# ══════════════════════════════════════════════════════════════════════════════
# قالب المراجعة اللغوية — Linguistic Review Template (v2)
# ══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   1. Run: python3 tools/fill_prompt.py <synset_id> --output-dir output/
#   2. Send the filled prompt to the LLM.
#   3. Validate output: python3 tools/validate_review.py output/<synset_id>/review.yaml
#
# See: docs/REVIEW_SCHEMA.md for field definitions
# ══════════════════════════════════════════════════════════════════════════════

synset_id: ""                           # awn4-XXXXXXXX-X
reviewer: ""                            # من أجرى المراجعة
review_date: ""                         # YYYY-MM-DD
verdict: ""                             # excellent | good | acceptable | poor

# ═══════════════════════════════════════
# اللمّات — Lemmas
# ═══════════════════════════════════════
lemmas: []
# - lemma: ""                           # اللمّة بالتشكيل
#   status: ""                          # confirmed | rejected | modified
#   evidence: ""                        # إلزامي — اسم المعجم + اقتباس النص المثبت
#   synonymy_tests:                     # إلزامي — خلاصة اختبارات الترادف الرباعية
#     substitution: ""                  # نتيجة اختبار الاستبدال
#     collocation: ""                   # أبرز المتلازمات
#     antonymy: ""                      # المضاد الدلالي
#     componential: ""                  # السمات الدلالية (+/-)
#   nuance: ""                          # إلزامي — نوع الترادف والسمة الفارقة
#   root: ""                            # الجذر
#   usage: ""                           # archaic | modern | common
#   eloquence: ""                       # eloquent | neologism | colloquial
#   register: ""                        # literal | figurative (نوع المجاز)
#   connotation: ""                     # positive | negative | neutral
#   frame: ""                           # للأفعال: لازم | متعدٍ بنفسه | متعدٍ بـ(حرف)
#   collocate: ""                       # المتلازم اللفظي
#   flags: []                           # أعلام خاصة بهذه اللمّة

# ═══════════════════════════════════════
# مرادفات مفقودة — Missing Synonyms
# ═══════════════════════════════════════
missing: []
# - candidate: ""                       # المرشّح
#   verdict: ""                         # add | new_synset | reject
#   evidence: ""                        # المعجم + التبرير

# ═══════════════════════════════════════
# التعريف — Definition
# ═══════════════════════════════════════
definition:
  original: ""                          # تعريف AWN الأصلي (لا تعدّل)
  verdict: ""                           # retain | revise | reject
  revised: ""                           # النص البديل إذا revise أو reject
  source: ""                            # المعجم المستنَد إليه

# ═══════════════════════════════════════
# الشواهد — Examples
# ═══════════════════════════════════════
examples: []
# - text: ""                            # نص الشاهد
#   type: ""                            # quran | hadith | poetry | prose | authored
#   source: ""                          # المصدر

# ═══════════════════════════════════════
# العلاقة مع الأعمّ — Hypernym
# ═══════════════════════════════════════
hypernym:
  target: ""                            # معرّف الأعمّ
  verdict: ""                           # ok | flag
  note: ""

# ═══════════════════════════════════════
# أعلام — Flags
# ═══════════════════════════════════════
flags: []
# Synset-level flags: SPLIT_NEEDED, LEXICAL_GAP, NEEDS_ESCALATION, POS_MISMATCH
# Per-lemma flags go in lemmas[].flags: WEAK_EVIDENCE, MEANING_MISMATCH,
#   LEMMA_NOT_FOUND, HOMONYMY_RISK, SYNONYM_REJECTED, DEF_CONTRADICTS,
#   CALQUE_WARNING
