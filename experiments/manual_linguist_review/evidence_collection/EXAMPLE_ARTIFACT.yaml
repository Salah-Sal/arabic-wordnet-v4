    sql_template: |
      SELECT e.*, d.key AS dict_key, d.name_ar, d.name_en, d.source_type,
             d.period, d.author, d.death_year
      FROM entries e
      JOIN dictionaries d ON e.dictionary_id = d.id
      WHERE e.id IN (
          SELECT rowid FROM entries_fts
          WHERE entries_fts MATCH ?
          ORDER BY bm25(entries_fts, 10.0, 5.0, 5.0, 3.0, 1.0)
          LIMIT 50
