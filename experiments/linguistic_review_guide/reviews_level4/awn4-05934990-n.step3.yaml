    dictionary_comparison: "المعاجم كـ «المحيط» و«لسان العرب» تربط العوص والعمق بصعوبة استخراج المعنى وغموض الكلام."
    terminological_strategy: "الجنس القريب = «حالة أو صفة» + الفصل المميّز = «صعوبة إدراك الكنه بسبب الغموض»."
    linguistic_strategy: "التركيز على «استغلاق المعنى» كوصف لغوي دقيق للمصطلحين."
