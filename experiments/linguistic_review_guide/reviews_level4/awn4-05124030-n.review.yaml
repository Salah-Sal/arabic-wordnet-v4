  - lemma: متاهة
    decision: escalated
    decision_reason: تناقض دلالي بين معنى اللمّة وتعريف المجموعة
    evidence_assessment:
      case: mixed
      notes:
      - 'تناقض: المعنى المعجمي (تيه/حيرة/مكان) يختلف عن تعريف المجموعة (وفرة)'
    substitution_test:
      result: fail
      failure_sentences:
      - original: أدهشتني كثرة هائلة من الزهور
        substituted: أدهشتني متاهة من الزهور
        preserved_meaning: false
        why_failed: تغيّر المعنى من الوفرة إلى الحيرة أو التداخل
    reasoning:
      evidence_weight: الأدلة المعجمية تؤكد معنى الحيرة والمكان، ولا تدعم معنى الوفرة
      conflict_analysis: 'التعريف الحالي للمجموعة يخلط بين مفهومين: الوفرة (Abundance) والحيرة/التيه (Confusion/Labyrinth)'
      escalation_justification: اللمّة لا تنتمي دلالياً للمجموعة (الوفرة). يجب مراجعة التعريف أو فصل المجموعة
    actions:
    - &id002
      command: سجّل ملاحظة دلالية
      params:
        lemma: متاهة
        note: 'تناقض: المعنى المعجمي يختلف عن تعريف المجموعة'
    - &id003
      command: صعّد للمراجع البشري
      params:
        reason: تناقض دلالي بين معنى اللمّة وتعريف المجموعة
  synset_flags:
    definition_review_needed: true
status: none_added
reasoning: بعد فحص شامل لنتائج البحث المعجمي (FTS, English Bridge, Reverse Lookup)، لم يتم العثور على مرادفات دقيقة تعبر عن مفهوم 'الكثرة المذهلة والمحيرة' (bewildering profusion) بشكل أفضل من اللمات الموجودة
  حالياً. النتائج المستخرجة إما كانت عامة جداً (مثل 'وفرة') أو غير ذات صلة دلالية (مثل المعاني المعمارية لـ 'متاهة' أو نتائج جذر 'كتر').
step3_definition:
  definition_review_flag: true
  current_definition: وفرة مذهلة ومحيرة
  assessment:
    decision: revise
    reason: التعريف الحالي مقبول دلالياً لكنه يفتقر إلى الدقة المعجمية. اللمّات الحالية (خاصة 'متاهة') لا تعكس المفهوم بدقة وتوحي بوجود خلط دلالي في المصدر.
  authored_definitions:
  - type: terminological
    text: وفرة بالغة ومفرطة تبعث على الحيرة والذهول.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  - type: linguistic
    text: غزارة شديدة في الشيء تجعل المرء في حيرة من كثرته.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  reasoning:
    revision_justification: التعريف الحالي يحتاج إلى صياغة أكثر فصاحة وربطاً بالجنس القريب (وفرة) لضمان الدقة العلمية.
    dictionary_comparison: التعريف الجديد يعتمد على 'وفرة' كجنس قريب، مع وصف 'الحيرة والذهول' كفصل نوعي يميز هذا النوع من الوفرة.
    terminological_strategy: الجنس القريب = 'وفرة' + الفصل المميّز = 'بالغة ومفرطة تبعث على الحيرة والذهول'.
    linguistic_strategy: تبسيط المفهوم لغوياً بالتركيز على أثر الكثرة على المتلقي.
  actions:
  - &id004
    command: عدّل نص التعريف
    params:
      definition_index: 0
      new_text: وفرة بالغة ومفرطة تبعث على الحيرة والذهول.
  - &id005
    command: ألّف تعريفاً جديداً
    params:
      type: terminological
      text: وفرة بالغة ومفرطة تبعث على الحيرة والذهول.
  - &id006
    command: ألّف تعريفاً جديداً
    params:
      type: linguistic
      text: غزارة شديدة في الشيء تجعل المرء في حيرة من كثرته.
