step0_evidence:
  synset: awn4-05124030-n
  per_lemma:
    كثرة هائلة:
      evidence_status: no_material_found
    متاهة:
      confirm:
      - '«التيه: جنس من الحيرة» — مقاييس اللغة لابن فارس'
      - '«تاه في أمره: تحير، وتيهته» — المحكم والمحيط الأعظم لابن سيده الأندلسي'
      - «تاه في الأرض، أي ذهب متحيّراً، يَتيهُ تَيْهاً وتَيَهاناً» — تاج اللغة وصِحاح العربية للجوهري
      expand:
      - «المتاهة من الأرض التيه» — المعجم الوسيط
      - '«التيهُ: المفازةُ يُتاهُ فيها، والجمع أَتْياهٌ وأَتاويهُ» — تاج اللغة وصِحاح العربية للجوهري'
      - '«أرض متيهة: يتاه فيها. ووقعوا في تيه وتيهاء» — المحكم والمحيط الأعظم لابن سيده الأندلسي'
      peripheral_observations:
      - 'المداخل التقنية (مثل: مسرد الجغرافيا، المعجم الطبي الموحد) تشير إلى المصطلح كترجمة لـ ''Labyrinth'' أو ''Maze'' في سياقات علمية، وهي معانٍ مستقلة عن المعنى السياقي للوفرة المذهلة.'
step1_lemma_validation:
