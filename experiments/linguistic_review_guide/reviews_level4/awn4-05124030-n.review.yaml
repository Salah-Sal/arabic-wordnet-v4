    reasoning:
      evidence_weight: لا توجد أدلة معجمية كمدخل مستقل
      removal_justification: اللمّة عبارة عن تركيب حر (Noun Phrase) وليست مصطلحاً أو وحدة معجمية ثابتة
    actions:
    - &id001
