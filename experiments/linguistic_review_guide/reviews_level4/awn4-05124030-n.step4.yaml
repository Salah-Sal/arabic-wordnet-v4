step4_relations:
  hypernymy:
    current_hypernym: "وفرة"
    test_result: "correct"

  antonymy:
    per_lemma:
      - lemma: "كثرة هائلة"
        antonym_found: true
        antonym: "ندرة"
      - lemma: "متاهة"
        antonym_found: false

  verb_checks:
    applicable: false

  selectional_restrictions:
    - lemma: "كثرة هائلة"
      constraint: "يدل على كمية مفرطة"
    - lemma: "متاهة"
      constraint: "يدل على مكان أو حالة معقدة"

  reasoning:
    hypernymy_justification: "«كثرة هائلة» تندرج بوضوح تحت «وفرة». العلاقة صحيحة."
    antonymy_justification: "«ندرة» هي النقيض المباشر لـ «كثرة هائلة»."
    selectional_reasoning: "يوجد تباين دلالي؛ اللمة الأولى كمية واللمة الثانية مكانية/حالة تعقيد."

  synset_flags:
    split_needed: true

  actions:
    - command: "أضف علاقة دلالية"
      params:
        source_lemma: "كثرة هائلة"
        relation: "antonym"
        target: "ندرة"
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "متاهة"
        note: "عدم تجانس دلالي مع «كثرة هائلة»؛ يُقترح فصل اللمة في مجموعة مستقلة."