step0_raw: "step0_evidence:\n  synset: awn4-10691175-n\n  per_lemma:\n    خَلَف:\n      confirm:\n        - «خلف فلان فلاناً، إذا كان خليفته. يقال خلفه في قومه خلافة» — تاج اللغة وصِحاح العربية للجوهري\n\
  \        - «الخَلَفُ: مَا جَاءَ بَعْدُ. وَيَقُولُونَ: هُوَ خَلَفُ صِدْقٍ مِنْ أَبِيهِ. وَخَلَفُ سَوْءٍ مِنْ أَبِيهِ... وَإِنَّمَا سُمِّيَتْ خِلَافَةً لِأَنَّ الثَّانِي يَجِيءُ بَعْدَ الْأَوَّلِ قَائِمًا\
  \ مَقَامَهُ» — مقاييس اللغة لابن فارس\n        - «الخليفة: الملك الذي يُستخلف ممَّن قبله» — المحكم والمحيط الأعظم لابن سيده\n        - «خلفه: جاء بعده خلافة، وخلفه على أهله فأحسن الخلافة» — أساس البلاغة\
  \ للزمخشري\n        - «الخَلَفُ بِالتَّحْرِيكِ وَالسُّكُونِ: كُلُّ مَنْ يَجِيءُ بَعْدَ مَنْ مَضَى» — النهاية في غريب الحديث والأثر لابن الأثير\n        - «خَلَفَ فُلَانٌ فُلَانًا جَاءَ خَلْفَهُ خِلَافًا\
  \ وَخُلْفَةً... وَخَلَفْتُهُ خِلَافَة كُنْت خَلِيفَتَهُ» — المغرب في ترتيب المعرب للمُطَرِّزي\n        - «خلف فلان فلاناً يخلفه - بالضم - إذا كان خليفته» — العباب الزاخر للصغاني\n        - «خَلَفَ فُلَانٌ\
  \ فُلَانًا إِذَا كَانَ خَلِيفَتَهُ، يُقَالُ: خَلَفَهُ فِي قَوْمِهِ... وَ (اسْتَخْلَفَهُ) جَعَلَهُ خَلِيفَتَهُ» — مختار الصحاح للرازي\n        - «خَلَفَ فلانٌ فلانًا: صار خَلْفَه، جاء بعده، حلَّ مَحلَّه»\
  \ — معجم اللغة العربية المعاصرة لأحمد مختار عمر\n        - «خلف فلان فلاناً: كان بعده بدلاً وعوضاً. وقيل: صار خليفته، وقام مقامه» — المعجم الكبير\n      expands:\n        - «الخَلَفُ بِالتَّحْرِيكِ وَالسُّكُونِ:\
  \ كُلُّ مَنْ يَجِيءُ بَعْدَ مَنْ مَضَى، إِلَّا أَنَّهُ بِالتَّحْرِيكِ فِي الخَير، وَبِالتَّسْكِينِ فِي الشَّرّ» — النهاية في غريب الحديث والأثر لابن الأثير\n        - «الخَلَفُ: الولد الصالح يبقى بعد\
  \ الإنسان. والخَلْفُ، والخالفة: الطالح» — المحكم والمحيط الأعظم لابن سيده\n        - «الخَلَفُ: الولد الصالح يبقى بعد أبيه» — المعجم الكبير\n        - «الخَلَفُ: كل من يجيء بالخير بعد من مضى» — المعجم\
  \ الكبير\n      peripheral_observations:\n        - «خلف: نقيض قدام» — تاج اللغة وصِحاح العربية للجوهري\n        - «الخلف: أقصر أضلاع الجنب» — تاج اللغة وصِحاح العربية للجوهري\n        - «الخِلْف: حلمة\
  \ ضرع الناقة» — تاج اللغة وصِحاح العربية للجوهري\n        - «الخَلْف: الفأس العظيمة» — لسان العرب لابن منظور\n        - «شجر الخلاف: الصفصاف» — لسان العرب لابن منظور\n        - «خلف فوه خلوفاً: تغيرت\
  \ رائحته» — تاج اللغة وصِحاح العربية للجوهري\n    خَلِيفَة:\n      confirm:\n        - «من يخلف غيرَه ويقوم مقامه» — التعريفات الفقهيّة للبركتي\n        - «الذي يجيء بعد غيره» — موسوعة السلطان قابوس لأسماء\
  \ العرب\n        - «من يَخْلُفُ غيرَه, ويقومُ مَقامَه» — المعجم الكبير\n        - «من يقومُ مقامَ الذَّاهِب, ويَسُدُّ مَسَدَّه» — المعجم الكبير\n        - «الذى يُسْتَخْلَفُ مِمَّن قَبْلَه» — المعجم الكبير\n\
  \        - «المُسْتخلَف» — المعجم الوسيط\n        - «خليفة؛ خَلَف؛ وريث» — المورد الحديث (2008)\n        - «يُنيب؛ يُوَكِّل؛ يُعيِّن خليفةً له» — المورد الحديث (2008)\n        - «شخصٌ بديل» — المورد الحديث\
  \ (2008)\n        - «بديل» — المورد الحديث (2008)\n        - «نائب؛ وكيل» — المورد الحديث (2008)\n        - «ذات قائم بما يقوم به المستخلف على حسب رتبة ذلك الخليفة منه» — التوقيف على مهمات التعاريف للمناوي\n\
  \      expands:\n        - «السُّلْطانُ الأَعْظَم» — المعجم الوسيط\n        - «الإمامُ الذى لَيْس فَوْقَه إمامٌ» — التعريفات الفقهيّة للبركتي\n        - «قُصِد بــه الإنسانُ, لأنَّه ينوبُ عن الله - تعالى\
  \ - فى عِمارَةِ الكون» — المعجم الكبير\n        - «نظام دستوري يقوم على الدين، بحيث يتم اعتبار السلطة مستمدة من الله وأن الملك خليفة الله على الأرض» — المعجم الموحد لمصطلحات القانون (2017)\n        -\
  \ «خَليفة تحّول، مابعد (سابقة)، مابعد» — المعجم الموحد لمصطلحات علم التشريح العياني (2015)\n      peripheral_observations:\n        - «خَلِيفَةُ: جبل بمكة يشرف على أجياد الكبير» — معجم البلدان لياقوت\
  \ الحموي\n        - «رَجُلٌ خِلِّيفَةٌ: شديدُ الخِلافِ» — المعجم الكبير\n"
