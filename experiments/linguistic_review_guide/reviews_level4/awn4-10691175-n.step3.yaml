step3_definition:
  definition_review_flag: true
  current_definition: "الشخص الذي يلي في الترتيب"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي مقتصر على الترتيب الزمني، ويغفل المعنى الجوهري المتمثل في الإنابة والقيام مقام المستخلف، وهو جوهر معنى «الخليفة» و«الخلف»."
  authored_definitions:
    - type: "terminological"
      text: "مَن يحلُّ محلَّ غيره ويقومُ مقامَه في عملٍ أو مَنصبٍ أو مسؤوليةٍ بعدَ ذهابِه."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
    - type: "linguistic"
      text: "مَن يأتي بعدَ غيرِهِ في الترتيبِ أو المَنصبِ ويَخلفُهُ فيه."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
  reasoning:
    revision_justification: "التعريف الحالي مقتصر على الترتيب الزمني، بينما تشير الأدلة المعجمية إلى أن جوهر المفهوم هو «الاستخلاف» و«القيام بالمقام»."
    dictionary_comparison: "المعاجم (مثل مقاييس اللغة والمحكم) تؤكد أن الخليفة هو من يقوم مقام من قبله، وهو ما يضيف بعداً وظيفياً مفقوداً في التعريف الحالي."
    terminological_strategy: "الجنس القريب = «مَن يحل محل غيره» + الفصل المميّز = «يقوم مقامه في عمل أو منصب أو مسؤولية بعد ذهابه»."
    linguistic_strategy: "التركيز على المجيء بعد (الترتيب) مع الإشارة إلى الإحلال (يخلفه)."
  actions:
    - command: "عدّل نص التعريف"
      params:
        definition_index: 0
        new_text: "مَن يحلُّ محلَّ غيره ويقومُ مقامَه في عملٍ أو مَنصبٍ أو مسؤوليةٍ بعدَ ذهابِه."
    - command: "ألّف تعريفاً جديداً"
      params:
        type: "linguistic"
        text: "مَن يأتي بعدَ غيرِهِ في الترتيبِ أو المَنصبِ ويَخلفُهُ فيه."