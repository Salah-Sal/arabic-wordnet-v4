step1_lemma_validation:
  per_lemma:
    - lemma: "حز"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة وتطابق دلالي تام مع تعريف المفهوم (حفر/قطع غائر)"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "أدلة قوية من المعاجم (الوسيط، المحيط) تؤكد معنى القطع أو الحفر في العظم أو العود."
        nuance_differentiation: "يتميّز عن 'خدش' بكونه أعمق وأكثر تعمداً (قطع)، وعن 'شق' بكونه غالباً ما يكون عرضياً أو على سطح صلب."
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "حز"

    - lemma: "خدش"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة وتطابق دلالي مع مفهوم الخدش السطحي"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "أدلة معجمية واضحة تشير للأثر السطحي."
        nuance_differentiation: "يتميّز بكونه أثراً سطحياً غير عميق، غالباً ما يكون على الجلد أو المواد الملساء."
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "خدش"

    - lemma: "شق"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة وتطابق دلالي مع مفهوم الانفتاح أو الحفر الممتد"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "أدلة قوية تدعم معنى الانصداع أو القطع الطولي."
        nuance_differentiation: "يتميّز بكونه أعمق وأكثر اتساعاً من 'حز' و'خدش'، وغالباً ما ينتج عن انقسام أو فتح."
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "شق"

    - lemma: "وخزة"
      decision: "escalated"
      decision_reason: "تناقض دلالي: تشير للثقب (puncture) لا للحفر (groove/scratch)"
      evidence_assessment:
        case: "mixed"
        notes:
          - "تناقض: المعنى المعجمي (ثقب) يختلف عن تعريف المجموعة (انخفاض مخدوش/محفور)"
      substitution_test:
        result: "fail"
      reasoning:
        evidence_weight: "الأدلة تشير إلى 'أثر ثقب'، وهو ما لا يطابق تعريف المجموعة الحالي."
        escalation_justification: "لا يمكن حسم إدراج 'وخزة' ضمن 'حفر/خدش'؛ يجب مراجعة التعريف أو نقل اللمّة."
      actions:
        - command: "صعّد للمراجع البشري"
          params:
            reason: "اللمّة تشير إلى ثقب (puncture) بينما المجموعة تصف حفراً أو خدشاً سطحياً."

  synset_flags:
    definition_review_needed: true