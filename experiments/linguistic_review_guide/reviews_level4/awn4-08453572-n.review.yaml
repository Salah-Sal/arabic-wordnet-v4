      params:
        lemma: نقابة
        note: 'تعارض دلالي: اللمّة تشير إلى تنظيم، والتعريف يشير إلى أشخاص'
    - &id003
      command: صعّد للمراجع البشري
      params:
        reason: تعارض دلالي بين التعريف واللمّة
