step0_evidence:
  per_lemma:
    أهل الحرفة:
      evidence_status: no_material_found
    نقابة:
      confirm:
      - '«النّقابة الحِرْفية: نقابة تنتظم أهل الحرفة الواحدة فحسب.» — المورد الحديث'
      - «نقابة مهنية» — المعجم الموحد لمصطلحات الاقتصاد
      - «نقابة حرفيين» — المعجم الموحد لمصطلحات التقنيات التربوية
      - «نقابة الحرفيين والفنانين» — المعجم الموحد لمصطلحات التقنيات التربوية
      - «جماعة يختارون لرعاية شؤون طائفة من الطوائف منهم النقيب ووكيله وغيرهما مثل نقابة المهندسين ونقابة الأطباء ونقابة المهن التعليمية» — المعجم الوسيط
      - «نقابة تضم الموظفين فقط وتهدف إلى الدفاع عن مصالحهم وتحقيق مطالبهم الاقتصادية والاجتماعية» — المعجم الموحد لمصطلحات القانون
      - «تنظيم يدافع عن المصالح المادِّيَّة للصحفيين» — مسرد الإعلام والتواصل
      expands:
      - «تجمع يقوم بمهام المفاوضة الجماعية أو المساومة الجماعية بشأن شروط الاستخدام ولرعاية مصالح أعضائها الاقتصادية والاجتماعية.» — المعجم الموحد لمصطلحات القانون
      - «نقابة للعمال يسيطر عليها رَبُّ العمل.» — المورد الحديث
      - «النقابات الجمركية» — المَكنَز الزراعي متعدد اللغات
      - «النقابات البيئية» — المَكنَز الزراعي متعدد اللغات
      - «قيام النَّقِيب مَقَام مَن يمثِّلهم في رعاية شؤونهم» — المعجم الوسيط
      - '«النقابة المستقلّة: نقابة تضمّ عمال شركة أو مؤسسة من غير أن تؤلف جزءًا من اتحاد نقابيّ أوسع» — المورد الحديث'
      - '«النقابة: الوكالة: مؤسسة تبيع موادّ للنشر في عدة صُحُف ومجلّات في وقت واحد» — المورد الحديث'
      contradicts:
      - '«نقب الحائط: ثقبَه، وفتح فيه ثُغرَةً» — معجم اللغة العربية المعاصرة'
      - '«النقب: الثقب في أي شيء كان» — لسان العرب'
      - '«الناقبة: قرحة تخرج بالجنب تهجم على الجوف» — المعجم الطبي الموحد'
      - '«نقب: رقة الأخفاف» — النهاية في غريب الحديث'
      - '«النقبة: أول الجرب حين يبدو» — غريب الحديث لأبي عبيد'
      - '«النقاب: القناع على مارن الأنف» — المصباح المنير'
      - «تنقيب في البيانات» — معجم البيانات والذكاء الاصطناعي
      - «تنقيب مغنطيسي» — المعجم الموحد لمصطلحات الجيولوجيا
