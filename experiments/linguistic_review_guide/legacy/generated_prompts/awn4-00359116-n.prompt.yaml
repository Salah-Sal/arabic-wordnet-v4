observation: "يُستخدم كاسم ذات ليعني الثوب البالي (سَحْقٌ)، وكظرف/دعاء بمعنى البعد (سُحْقاً)."
source: "لسان العرب"
step: 0
note: "معانٍ مستقلة تماماً تمثل مداخل صرفية أو دلالية أخرى."

lemma: "طحن"
observation: "تستعمل بمعنى القصير من الرجال (طُحَن) ولنوع من الدواب (طُحَنَة)."
source: "القاموس المحيط"
step: 0
note: "معان مختلفة كلياً مرتبطة بحركات تشكيل مختلفة أحياناً."