step3_definition:
  definition_review_flag: true
  current_definition: "يحرر من الخوف والقلق"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي ترجمة حرفية (يحرر من). الصياغة العربية الأفضل تعتمد على الإزالة أو التسكين والانفعالات النفسية."
  scope_note: null
  authored_definitions:
    - type: "terminological"
      text: "ما يزيل الانفعالات النفسية كالتوتر والخوف والقلق ويبعث على الهدوء."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
    - type: "linguistic"
      text: "ما يبعث على الهدوء ويسكن الخوف والقلق."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
  reasoning:
    revision_justification: "ترجمة 'freeing from' إلى 'يحرر من' ركيكة في هذا السياق، الأفضل استخدام 'يزيل' أو 'يسكن'."
    dictionary_comparison: "المعاجم تستخدم أفعال التسكين والتخفيف (يسكن، يلطف، يهدئ)."
    terminological_strategy: "الجنس: ما يزيل الانفعالات النفسية + الفصل: كالتوتر والخوف والقلق."
    linguistic_strategy: "صياغة مبسطة تعتمد على إشاعة الهدوء وتسكين الخوف."
  actions:
    - command: "عدّل نص التعريف"
      params:
        definition_index: 0
        new_text: "ما يزيل الانفعالات النفسية كالتوتر والخوف والقلق ويبعث على الهدوء."
    - command: "ألّف تعريفاً جديداً"
      params:
        type: "linguistic"
        text: "ما يبعث على الهدوء ويسكن الخوف والقلق."

