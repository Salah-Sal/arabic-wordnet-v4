step0_evidence:
  synset: awn4-00733374-n
  per_lemma:
    إعادة تعيين:
      evidence_status: expands
      notes: "المصطلح مركب دلالياً؛ لا يوجد مدخل معجمي مباشر للمصطلح المركب. المكونات (إعادة + تعيين) تشير إلى تكرار فعل التعيين، مما يوسّع التعريف الأصلي 'التعيين في واجب مختلف' ليشمل احتمالات أخرى."
    إعادة تكليف:
      evidence_status: confirm
      notes: "المصطلح مركب دلالياً؛ المكونات (إعادة + تكليف) تطابق جوهر التعريف 'التعيين في واجب مختلف' من حيث إسناد مهمة جديدة أو تغيير التكليف."
