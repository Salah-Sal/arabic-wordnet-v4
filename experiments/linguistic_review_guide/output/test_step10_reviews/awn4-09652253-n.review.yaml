step0_evidence:
  per_lemma:
    متعصب ديني:
      confirm:
      - «شخص يدافع عن أفكاره بانفعال، رافضا قبول الرأي المُخالف.» — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)
      - «المتعصِّب [لدين أو حزب أو رأي].» — المورد الحديث (2008)
      - «نسبة إلى الدِين.» — موسوعة السلطان قابوس لأسماء العرب
      expands:
      - «تعصُّب أعمى.» — المورد الحديث (2008)
      - «(1) تعصُّب ديني (2) حماسة.» — المورد الحديث (2008)
      - '«التَّعْلِيمُ الدِّينِىّ: هو التَّعليمُ الذى كانت تَنْهضُ به المؤسَّساتُ التَّعلِيمِيَّةُ التَّقليديَّة فى العالَمِ العربىِّ...» — المعجم الكبير'
      peripheral_observations: يُظهر التحليل المعجمي أن كلمة 'متعصب' مشتقة من جذر 'عصب' الذي يحمل دلالات الربط والشد، مما يفسر الانتقال الدلالي إلى 'التمسك الشديد بالرأي'. أما كلمة 'ديني' فهي مشتقة من 'دين'
        التي تحمل تعددية دلالية واسعة، ولكن التركيب 'متعصب ديني' يخصص المعنى في الجانب العقائدي والاعتقادي.
    مهووس بالدين:
      confirm:
      - «مَهْووس (مصاب بالهَوَس)» — المعجم الطبي الموحد (2009)
      - '«الهَوَس: طرف من الجنون» — لسان العرب'
      - '«الدِّين: اسم لجَمِيع ما يعبد بِهِ الله والملة والإسلام» — المعجم الوسيط'
      - '«الدِّين: وضع إلهي يدعو أصحاب العقول إلى قبول ما هو عند الرسول» — كتاب التعريفات للشريف الجرجاني'
      expands:
      - '«شاب مَهْووس بالحياة الأوربية... المعنى: مجنون بها» — معجم الصواب اللغوي لأحمد مختار عمر'
      - '«مَهْووسٌ بالمَسْرح. وبخاصة: تتملَّكُهُ رغبةٌ لا تقاوَم في أن يُصْبح ممثّلًا» — المورد الحديث (2008)'
      - '«الدِّين: نظام اجتماعي يقوم على وجود موجود أو أكثر أو قوى فوق الطبيعة» — المعجم الكبير'
      - '«الدِّين: وضع إلهي سائق لذوي العقول باختيارهم إيّاه إلى الصّلاح في الحال والفلاح في المآل» — كشاف اصطلاحات الفنون والعلوم للتهانوي'
      peripheral_observations: يساهم المكون 'مهووس' في بناء معنى اللمة من خلال إضفاء صبغة نفسية (الهوس، الجنون، الرغبة التي لا تقاوم) التي تعزز مفهوم 'الإدمان' أو 'التعصب' الوارد في تعريف المجموعة الترادفية.
        في حين يوفر المكون 'بالدين' الإطار الموضوعي لهذه الحالة.
step1_lemma_validation:
  per_lemma:
  - lemma: متعصب ديني
    decision: confirmed
    decision_reason: تعبير مركب اصطلاحي مؤكّد بمعاجم موثوقة
    evidence_assessment:
      case: confirm_only
    mwe_check:
      is_mwe: true
      accepted: true
    substitution_test:
      result: pass
      pass_sentences:
      - original: إنه متعصب ديني لا يقبل النقاش.
        substituted: إنه مهووس بالدين لا يقبل النقاش.
        preserved_meaning: true
    reasoning:
      evidence_weight: أدلة مؤكّدة من عدة مصادر معجمية (المورد، ArabTerm).
      nuance_differentiation: يتميّز عن «مهووس بالدين» بتركيزه على الجانب الفكري والعقائدي (التعصب للرأي ورفض المخالف)، بينما يركز «مهووس» على الجانب النفسي (الهوس/الإدمان).
    actions:
    - &id001
      command: أكّد صلاحية اللمّة
      params:
        lemma: متعصب ديني
    - &id002
      command: سجّل ملاحظة دلالية
      params:
        lemma: متعصب ديني
        note: يتميّز عن «مهووس بالدين» بتركيزه على الجانب الفكري والعقائدي (التعصب للرأي ورفض المخالف).
  - lemma: مهووس بالدين
    decision: confirmed
    decision_reason: تعبير مركب اصطلاحي مؤكّد بمعاجم موثوقة
    evidence_assessment:
      case: confirm_only
    mwe_check:
      is_mwe: true
      accepted: true
    substitution_test:
      result: pass
      pass_sentences:
      - original: أصبح مهووساً بالدين بعد أن فقد عمله.
        substituted: أصبح متعصباً دينياً بعد أن فقد عمله.
        preserved_meaning: true
    reasoning:
      evidence_weight: أدلة مؤكّدة من مصادر معجمية (المعجم الطبي، لسان العرب).
      nuance_differentiation: يتميّز عن «متعصب ديني» بتركيزه على الجانب النفسي (الهوس/الإدمان) والرغبة القهرية، بينما يركز «متعصب» على التعصب الفكري.
    actions:
