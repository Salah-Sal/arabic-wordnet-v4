step3_definition:
  definition_review_flag: false
  current_definition: شخص مدمن على الدين أو متعصب ديني
  assessment:
    decision: revise
    reason: التعريف الحالي دائري (يستخدم اللمّة في التعريف) ويستخدم مصطلحاً غير دقيق («مدمن»).
  authored_definitions:
  - type: terminological
    text: شخص متدين يُظهر غُلُوّاً وتشدداً مفرطاً في معتقداته الدينية، وغالباً ما يتسم بعدم التسامح مع آراء الآخرين.
    quality_check:
      genus_present: true
      differentia_present: true
      passed: true
  - type: linguistic
    text: مَن يبالغ في التمسك بالدين إلى حد التشدد أو الهوس.
    quality_check:
      genus_present: true
      differentia_present: true
      passed: true
  reasoning:
    revision_justification: التعريف الحالي دائري وغير دقيق علمياً؛ تم استبدال «الإدمان» بمصطلحات أكثر دقة مثل «الغلو» و«التشدد».
    terminological_strategy: الجنس القريب = «شخص متدين» + الفصل المميّز = «يُظهر غُلُوّاً وتشدداً مفرطاً».
    linguistic_strategy: التركيز على فعل المبالغة والتمسك المتطرف.
  actions:
  - &id005
    command: عدّل نص التعريف
    params:
      definition_index: 0
      new_text: شخص متدين يُظهر غُلُوّاً وتشدداً مفرطاً في معتقداته الدينية، وغالباً ما يتسم بعدم التسامح مع آراء الآخرين.
  - &id006
    command: ألّف تعريفاً جديداً
    params:
      type: terminological
      text: شخص متدين يُظهر غُلُوّاً وتشدداً مفرطاً في معتقداته الدينية، وغالباً ما يتسم بعدم التسامح مع آراء الآخرين.
  - &id007
    command: ألّف تعريفاً جديداً
    params:
      type: linguistic
      text: مَن يبالغ في التمسك بالدين إلى حد التشدد أو الهوس.
