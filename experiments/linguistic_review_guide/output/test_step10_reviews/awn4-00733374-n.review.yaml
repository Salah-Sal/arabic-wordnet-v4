    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  reasoning:
    revision_justification: التمييز بين 'التعيين' (النشأة الأولى) و'إعادة التعيين' (التغيير أو النقل) ضروري لضبط المعنى.
    dictionary_comparison: المعاجم تميل لربط 'إعادة التكليف' بمفهوم النقل أو الإسناد المتجدد للعمل، وليس التعيين المطلق.
    terminological_strategy: الجنس القريب = 'تكليف' + الفصل المميّز = 'بمهام جديدة تختلف عن السابق'.
    linguistic_strategy: تبسيط المفهوم ليكون 'إسناد عمل جديد' لبيان عملية التغيير.
