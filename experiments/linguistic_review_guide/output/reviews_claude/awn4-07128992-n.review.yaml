    reasoning: "«الحركة الموضوعية» هو المقابل العربي الأكثر شيوعاً في الترجمات اللسانية لـ thematic vowel، وهو مرادف شائع لـ stem vowel في الدراسات الصرفية المقارنة — «الموضوعية» من وضع الجذعة في نظام التصريف"
