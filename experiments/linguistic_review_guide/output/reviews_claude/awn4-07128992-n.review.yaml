# الأدلة المتوفرة هي لكلٍّ من "حركة" و"الجذر" منفصلَيْن ضمن by_component.
# المنهج: صنّفت الأدلة الصوتية للمكوّن "حركة" والأدلة اللسانية للمكوّن "الجذر"
# بوصفها تؤكد جزئياً المعنى المركب أو توسّعه.

