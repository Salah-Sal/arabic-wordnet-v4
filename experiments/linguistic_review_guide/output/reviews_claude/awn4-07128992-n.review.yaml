    confirm:
    - text: "(في علم الصوت): كيفية عارضة للصوت، وهى الضم والفتح والكسر؛ ويقابلها السكون"
      source: "المعجم الوسيط"
    - text: "الحركة كما تطلق على ما مر كذلك تطلق على كيفية عارضة للصوت وهي الضم والفتح والكسر ويقابلها السكون. قال الإمام الرازي: الحركات أبعاض المصوّتات"
      source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"

    expands:
    - text: "عنصر أساس مشترك في مجموع من الكلمات داخل لغة أو لغات متقاربة، يمكن فرزه بعد إقصاء كل اللواصق الاشتقاقية والتصريفية، ويتضمن دلالة محددة"
      source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      addition: "يعرّف «الجذر» (= الجذعة الصرفية stem) في إطار لساني حديث يشمل العلاقة بين الجذر واللواصق التصريفية، مما يُضيء الإطار الذي تقع فيه «حركة الجذر»"
    - text: "التصريف: تحويل الأصل الواحد إلى أصول مختلفة لمعان مقصودة لا تحصل بها"
      source: "التوقيف على مهمات التعاريف للمناوي"
      addition: "يعرّف «التصريف» الذي تسبقه حركة الجذر — يُوضّح وظيفة المصطلح في السياق الصرفي"


