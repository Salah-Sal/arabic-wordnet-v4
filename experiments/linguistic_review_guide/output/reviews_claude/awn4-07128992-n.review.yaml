    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true

  reasoning:
    revision_justification: "التعريف الحالي دقيق في جوهره، لكن «الجذر» مُلتبس في العربية — القارئ العربي يتوقع «الجذر الثلاثي» (root)، أما المقصود فهو «الجذعة» (stem)، وهو ما يختلف منهجياً. إضافة إلى ذلك، غياب الإشارة إلى السياق الهندوأوروبي يُضيّق الفهم"
