step3_definition:
  definition_review_flag: false
  current_definition: "شراء أو بيع أسهم الشركة من قبل مسؤول في الشركة أو مطلع آخر بناءً على معلومات لم يتم الإعلان عنها ويفترض أن تظل سرية"

  assessment:
    decision: revise
    reason: "التعريف الحالي ترجمة شبه حرفية — بنية «لم يتم الإعلان عنها» ثقيلة في الفصحى (المبني للمجهول المركّب)؛ و«ويفترض أن تظل سرية» زيادة وصفية تضعف الإيجاز المصطلحي؛ فضلاً عن أن «أسهم الشركة» أضيق من المفهوم القانوني الفعلي الذي يشمل الأوراق المالية بأنواعها"

  authored_definitions:
    - type: terminological
      text: "شراء الأوراق المالية لشركة أو بيعها من قِبَل أحد مسؤوليها أو من يطّلع على معلومات سرية عنها غير مُعلنة للعموم — استغلالاً لهذه المعلومات لتحقيق مكسب أو تفادي خسارة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true

    - type: encyclopedic
      text: "نوع من الاحتيال المالي يقوم فيه مسؤول في شركة مُدرَجة في سوق الأوراق المالية — أو شخص مطّلع على معلومات داخلية سرية — ببيع أسهمها أو شرائها قبل إعلان تلك المعلومات للمستثمرين، فيُحقق ربحاً غير مشروع أو يتفادى خسارة وشيكة؛ وهو مُجرَّم في معظم التشريعات المالية العالمية"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true

  reasoning:
    revision_justification: "ثلاثة محاور للتعديل: ١) «أسهم الشركة» → «الأوراق المالية لشركة» (الأدق قانونياً — يشمل السندات والخيارات وغيرها)؛ ٢) «لم يتم الإعلان عنها» → «غير مُعلنة للعموم» (أسلوب أخفّ وأدق)؛ ٣) «ويفترض أن تظل سرية» حُذفت (مضمونة في «غير معلنة»)"
    dictionary_comparison: "لا مدخل معجمي عربي كلاسيكي للمصطلح — المفهوم قانوني مالي حديث؛ التعريف يستند إلى تشريحه القانوني لا إلى مقارنة معجمية"
    terminological_strategy: "الجنس القريب = «شراء الأوراق المالية أو بيعها» + الفصل المميّز الأول = «من قِبَل مسؤول أو مطّلع» + الفصل المميّز الثاني = «استغلالاً لمعلومات سرية غير معلنة»"

