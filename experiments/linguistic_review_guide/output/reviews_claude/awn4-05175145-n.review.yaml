        - text: "«تُطلَق أيضًا على اتجاهٍ عامٍّ يقومُ على الإضراب وعدم التعاون»"
          source: "المعجم الكبير"

        - text: "«السَّلْبانيّة: «أ» موقف عقلي متَّسم بالشَّك في جُلّ ما يؤكِّده الآخرون. «ب» نزعة إلى رفض القيام بما يُسأل المرءُ أداءَهُ أو إلى القيام بخلافِهِ أو نقيضه»"
          source: "المورد الحديث (2008)"

      expands:
        - text: "«(السلبية عند الفلاسفة): حال نفسية تؤدِّي إلى البطء والتردُّد في الحركة وقد تنتهي إلى توقفها»"
          source: "المعجم الوسيط"
          addition: "بُعد البطء والتردد الحركي — غير مذكور في تعريف المجموعة الذي يقتصر على الإنكار والمعارضة والمقاومة"

        - text: "«(السَّلْبيَّة) عند الفلاسفة: حالٌ نفسيةٌ تؤدِّى إلى البُطْءِ والتردُّد فى الحركة, وقد تنتهى إلى توقفها»"
          source: "المعجم الكبير"
          addition: "نفس توسيع المعجم الوسيط في بُعد البطء الحركي"

        - text: "«سلبية — translation_en: passivity — domain: Physics»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "المعنى التقني الفيزيائي (passivity) — مستقل تماماً عن المعنى النفسي-الاجتماعي في تعريف المجموعة"

      peripheral_observations:
        - "المعجم الموحد لمصطلحات الكيمياء (1992) يسجّل «سالبية» (بصيغة مختلفة — سَالِبِيَّة لا سَلْبِيَّة) كمقابل لـ negativity الكيميائية بمعنى «حالة أن يحمل الجسم شحنة سالبة» — لمة مختلفة إملائياً واشتقاقياً"
        - "المعجم الزراعي (AGROVOC) يورد «مناعة سلبية» و«حواف سلبية» بمعنى passive immunity وpassive margins على التوالي — استخدامات تقنية مستقلة لا صلة لها بالمعنى النفسي-الاجتماعي للمجموعة"
        - "المورد الحديث (2008) يترجم negative بـ«سلبي» مع تعريف «هدّام؛ غير بنّاء» — دلالة توسّعية على بُعد السلبية التدميرية"


