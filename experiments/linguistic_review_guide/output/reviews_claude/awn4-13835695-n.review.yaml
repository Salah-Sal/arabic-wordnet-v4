step0_evidence:
  per_lemma:
    - lemma: "قَرَابَة زَوْجِيَّة"
      confirm:
        - text: "«النسيب أو القريب بحكم الزَّواج»"
          source: "المورد الحديث (2008)"
        - text: "«الرّابّ؛ العمّ: زوج الأم»"
          source: "المورد الحديث (2008)"
        - text: "«(الزَّوْجِيَّة) بِمَعْنى الزواج. يقال: بينهما حق الزوجية. وما زالت الزوجية بينهما قائمة»"
          source: "المعجم الوسيط"
        - text: "«أخٌ غير شقيق: أخ من زوجة الأب أو زوج الأمّ»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«القَرابة: القُرب في الرحم. وأهلُ القرابة: هم الذين يُقَدِّمون الأقرب فالأقرب من ذوي الأرحام»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "«القرابة» في الفقه الكلاسيكي مقيَّدة بصلة الرحم (الدم) لا بالزواج، وهذا يناقض توظيفها لوصف صلة ناشئة عن عقد الزواج الثاني"
        - text: "«(الْقَرَابَة) الدنو فِي النّسَب. يُقَال هم ذَوُو قَرَابَتي»"
          source: "المعجم الوسيط"
          conflict: "«الدنو في النسب» يوحي بالقرب الدموي لا المصاهرة؛ توظيف «قرابة» في مقابل صلة الزواج توسُّعٌ دلالي معاصر لا أصلٌ كلاسيكي"
      expands:
        - text: "«قرابة — kinship» (في الحقل الأنثروبولوجي)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "في المعجمية الأنثروبولوجية الحديثة «القرابة» مصطلح جامع يشمل صلات الدم والزواج والتبني — وهذا يتجاوز المعنى الكلاسيكي المقيَّد بالرحم ويتيح توظيف اللمّة في سياق الزواج"
        - text: "«(1) زواجٌ ثانٍ [بعد وفاة - أو بعد الانفصال عن - الزوج الأول أو الزوجة الأولى] (2) تثنية الزواج: عادة الزواج ثانية»"
          source: "المورد الحديث (2008)"
          addition: "المقابل العربي الدقيق لـ remarriage هو «الزواج الثاني/ثانيةً» — وهذا يكشف أن قيد «إعادة الزواج» الجوهري غائب من اللمّة الحالية «قرابة زوجية» التي تعني الزواج مطلقاً لا الزواج الثاني تحديداً"
      peripheral_observations:
        - "للتراث العربي مصطلحات دقيقة لأفراد هذه الصلة: الرابّ (stepfather)، الربيبة (stepdaughter)، وهي مسكوكة في الفقه والمعاجم — غير أن مصطلحاً جامعاً للصنف الكلي «قرابة إعادة الزواج» يظل غائباً"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "الرَّبابة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الرّابّ؛ العمّ: زوج الأم» — المورد الحديث (2008)"
      justification: "آلية اشتقاق: الرابّ (جذر ر-ب-ب = زوج الأم، النموذج الكلاسيكي الأصيل للصلة المقصودة) — القياس على وزن فَعَالة يُنتج اسماً للعلاقة الكلية. غير أنّ «الرَّبابة» قائمةٌ أصلاً بمعنى آخر (آلة موسيقية وترية) مما قد يُفضي إلى اشتراك لفظي"
  knowledge_candidates:
    - lemma: "صِلَة الرَّبابة"
      justification: "آلية تركيب إضافي على غرار «صِلَة الرَّحِم»؛ يستند إلى الجذر الكلاسيكي ر-ب-ب (رَبَّ ولدَ غيره: عالجه وترباه) ومنه الرابّ (زوج الأم). يُختبر السكّ: إبدال «صِلَة» بـ«علاقة» أو «رابطة» يُبقي التعبير وصفاً صالحاً للمفهوم → تركيب وصفي حر لا مصطلح مسكوك"
  generation_notes: "المفهوم يعاني من فجوة معجمية حقيقية: العربية تمتلك مصطلحات لأفراد الصلة (الرابّ، الربيب، الربيبة) دون مصطلح جامع للصنف الكلي steprelationship. المرشحات أقرب ما يمكن تأليفه لكنها لم تُسكَّ في المعاجم ولم تُسجَّل في الاستعمال التخصصي"

step1_lemma_validation:
  per_lemma:
    - lemma: "قَرَابَة زَوْجِيَّة"
      decision: escalated
      decision_reason: "ثلاث إشكاليات متضافرة: (١) فشل اختبار التثبيت المعجمي — المركب لم يُسجَّل وحدةً ثابتة في أي معجم أو مصدر تخصصي مستقل؛ (٢) تداخل دلالي مع المُشتمِل «مُصَاهَرَة» إذ كلاهما يعني صياغياً «قرابةً بالزواج»، والتمييز يعتمد على التعريف لا على اللمّة ذاتها؛ (٣) إغفال قيد «إعادة الزواج» الجوهري (step- = by remarriage) — إذ «زوجية» تعني الزواج مطلقاً. يُصعَّد للمراجع البشري: هل يُبقى مع تعريف محسَّن، أم يُستبدل بمصطلح يعكس قيد «إعادة الزواج»؟"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: pass
      nuance_differentiation: "لمّة وحيدة في المجموعة — لا أخوات للمقارنة. الإشكالية الداخلية: «قرابة زوجية» (هذه المجموعة = steprelationship) لا تتمايز صياغياً عن «مُصَاهَرَة» (المُشتمِل = affinity) لأن كليهما «قرابة بالزواج». التمييز قائم على التعريف فحسب لا على اللمّة"

    - lemma: "الرَّبابة"
      source: step05
      decision: removed
      decision_reason: "«الرَّبابة» مسكوكة أصلاً بمعنى آلة موسيقية وترية (جذر ر-ب-ب في المعجم الوسيط وغيره) — الاستخدام بمعنى «صلة الزواج الثاني» يُفضي إلى اشتراك لفظي مُضلِّل. لا توجد شواهد على سكّه بهذا المعنى في أي مصدر"
      step05_citation: "«الرّابّ؛ العمّ: زوج الأم» — المورد الحديث (2008)"

    - lemma: "صِلَة الرَّبابة"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار السكّ: إبدال «صِلَة» بـ«علاقة» أو «رابطة» يُبقي التعبير صالحاً وصفاً للمفهوم → تركيب وصفي حر لا مصطلح مسكوك. لم يُسجَّل في أي معجم أو مصدر تخصصي"
      step05_citation: "«الرّابّ؛ العمّ: زوج الأم» — المورد الحديث (2008)"

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "علاقة أسرية بحكم الزواج الثاني (مثل زوج الأم)"
  assessment:
    decision: revise
    reason: "التعريف وظيفي لكن يحتاج إتقاناً: (أ) «الزواج الثاني» يُفهم منه العقد الزوجي الثاني في حياة الشخص وهذا صحيح، لكن الأدق «إعادة الزواج بعد وفاة أو انفصال» للتمييز عن الزواج الثاني لمن تزوّج أكثر من مرة في وقت واحد (تعدد الزوجات)؛ (ب) المثال (زوج الأم) ضيّق — الصلة تشمل أيضاً زوجة الأب وأبناء الزوج/الزوجة من زيجات سابقة (الأخ غير الشقيق، الأخت غير الشقيقة)"
  authored_definitions:
    - type: terminological
      text: "صلة أسرية تنشأ بين الولد وزوج أحد والديه من غير أصله، وكذلك بينه وبين أبناء ذلك الزوج من زيجات سابقة، وذلك إثر إعادة زواج أحد الوالدين بعد وفاة أو انفصال"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "القرابة الحادثة بين الولد وزوج أمه أو زوجة أبيه وما يتفرّع منها من صلات مع أبنائهم من زيجات سابقة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
