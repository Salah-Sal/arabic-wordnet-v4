      التعريف المؤلَّف يستند إلى المعايير الموسوعية للتعريف البيولوجي
      ونمط التعريفات في المعاجم الزراعية والبيولوجية العربية المتخصصة.
    terminological_strategy: >
      جنس قريب = «سمكة ناخرة استوائية من فصيلة هيموليداي» +
      فصل مميَّز = «نقوش سوداء وذهبية + نطاق جغرافي محدد + اسم علمي»

