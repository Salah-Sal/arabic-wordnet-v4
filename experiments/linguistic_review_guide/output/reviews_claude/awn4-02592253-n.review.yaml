      # في تسمية الأنواع المركبة يُعتمد جذر المكوّن الرئيسي (النوع الأعلى = سمكة).
      # لا علاقة مجازية — الاسم مبني على تشابه مظهري مع لون/هيئة الخنزير
      # في العقل الغربي (porkfish ← اللون المخطط كـ bacon)؛
      # في العربية البنية التركيبية حرفية لا مجازية.

    examples:
    - text: "تُعدّ سمكة الخنزير (Anisotremus virginicus) من أجمل أسماك الشعاب المرجانية في مياه الكاريبي بنقوشها السوداء والذهبية البارزة."
