      سمكة ناخرة استوائية من فصيلة هيموليداي (Haemulidae)، تتميز بنقوش
      سوداء وذهبية لافتة على جسمها، موطنها المياه الدافئة من برمودا إلى
      منطقة الكاريبي حتى السواحل البرازيلية، اسمها العلمي Anisotremus virginicus.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true

  reasoning:
    revision_justification: >
      التعريف الحالي يُرجم جملة إنجليزية قصيرة دون إضافة معلومات تصنيفية؛
      التعريف الموسوعي الصحيح لنوع بيولوجي يذكر الفصيلة والاسم العلمي
      والسمات المميِّزة — وهو النمط المعتمد في المعاجم البيولوجية العربية
      كالمعجم الموحد لمصطلحات علم الأحياء والمعجم الطبي الموحد.
    dictionary_comparison: >
