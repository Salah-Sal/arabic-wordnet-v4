  assessment:
    decision: revise
    reason: >
      التعريف الحالي ترجمة حرفية مختزلة للتعريف الإنجليزي؛ يفتقر إلى:
      (١) ذكر الفصيلة التصنيفية (Haemulidae)،
      (٢) الاسم العلمي الذي يُميّز النوع بدقة،
      (٣) وصف مورفولوجي ولو موجز يميّزه عن سائر الناخرات.
      معيار التعريف الموسوعي للأنواع البيولوجية في المعاجم العربية يستوجب هذه العناصر.

