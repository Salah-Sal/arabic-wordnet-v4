      nuance_differentiation: يتميز عن «أسيتات» و«خلّات» بكونه الاسم المنهجي المعياري وفق IUPAC؛ يُفضَّل في الكيمياء الأكاديمية والأبحاث العلمية الرسمية حين يُراد التدقيق المنهجي، بينما يبقى «أسيتات» هو المصطلح العملي الأشيع
      example: يُعدّ إيثانوات الصوديوم الاسمَ المنهجيَّ لأسيتات الصوديوم في الكيمياء المعيارية وفق تسمية IUPAC.

