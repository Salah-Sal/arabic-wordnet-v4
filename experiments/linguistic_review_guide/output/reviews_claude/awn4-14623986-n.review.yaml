      decision_reason: أدلة تأكيدية مباشرة من المعجم الكبير والمعاجم التخصصية؛ معرَّب مُخضَع للصرف العربي (يقبل التعريف والإضافة والجمع)؛ موثَّق في المعجم الكبير ومعجمَي المورد الحديث وتقانات الأغذية؛ يُسر التداول عالٍ وملاءمته للمفهوم تامّة؛ يصلح للاشتقاق (أسيتات الصوديوم، أسيتات السليلوز)
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: يتميز عن «خلّات» بكونه المصطلح التجاري والصناعي الأشيع في الكيمياء التطبيقية والقوائم الدولية للمواد الكيميائية؛ يتميز عن «إيثانوات» بالشيوع الفعلي لدى المتخصصين وفي الملصقات والمراجع غير الأكاديمية
      example: يُستخدم أسيتات السليلوز في تصنيع الأقمشة الاصطناعية والأغشية الشفافة والورق الفوتوغرافي.

