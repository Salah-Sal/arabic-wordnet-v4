    - lemma: خلات
      contradicts:
        - text: "«خَلأتِ النَّاقَةُ، كَمَنَعَ: بَرَكَتْ، أو حَرَنَتْ فلم تَبْرَحْ»"
          source: القاموس المحيط للفيروزآبادي (ت. 1414م)
          conflict: الجذر «خلأ» بمعنى حران الناقة مغاير تماماً للمصطلح الكيميائي؛ التطابق وهمي ناشئ عن التطبيع الصوتي الذي يُسقط الهمز (خلأت → خلات)
        - text: "«حركت الناقة وحرنت فلم تبرح مكانها»"
          source: مجمل اللغة (ابن فارس، ت. 1004م)
          conflict: أقدم شاهد لغوي يُثبت أن «خلات» بدون شدة تعود لجذر «خلأ» لا لجذر الخَلّ الكيميائي
        - text: "«خَلأت: الناقةُ: حَرَنتْ — الإنسانُ: لم يبرح مكانَه»"
          source: المعجم الوسيط (مجمع اللغة العربية)
          conflict: معنى الحران والثبوت في المكان يناقض دلالة الأسيتات الكيميائية (أملاح وإسترات حمض الخلِّيك)
        - text: "«النَّاقةُ ونَحوُها: بَرَكت فلم تَبْرَحْ مكانَها — حَرَنَت من غير عِلَّة»"
          source: المعجم الكبير (مجمع اللغة العربية)
          conflict: تأكيد من معجم رسمي حديث على بُعد «خلات» (بدون شدة) عن المصطلح الكيميائي
      peripheral_observations:
        - "«خلّات» (بتشديد اللام، من الخَلّ) مصطلح كيميائي مختلف رسماً ودلالةً، موثَّق في المعجم الموحد لمصطلحات تقانات الأغذية 2004 والمورد الحديث 2008 بمعنى «مركبات حمض الخليك» مقابل acetate — وهو المقابل الكيميائي الصحيح لما أُريد بـ«خلات»"


step05_lemma_generation:
  evidence_candidates:
    - lemma: خلّات
      source_section: step4_fts_keyword
      evidence_citation: "«لاحقة معناها: ملح أو إستر حمضٍ من الأحماض» — المورد الحديث (2008)"
      justification: يُثبت هذا المدخل أن اللاحقة الكيميائية «-ات» العربية تُنتج مصطلحات دلالتها «ملح أو إستر حمض»؛ ومن حمض الخلّ (= حمض الأسيتيك) تُشتقّ «خلّات» بهذا الهيكل بالضبط؛ يدعمه مدخل مباشر في معجم تقانات الأغذية (خَلاَّت، أسيتات = مركبات حمض الخليك)
  knowledge_candidates:
    - lemma: خلّات
      justification: آلية الاشتقاق — «الخَلّ» هو الاسم العربي التراثي لحمض الأسيتيك (حمض الخلِّيك)، ومنه تُشتقّ «خلّات» على نمط المصطلحات الكيميائية العربية الجامعة (نترات / كبريتات / فوسفات / كربونات)؛ المصطلح موثَّق في معاجم تخصصية معتمدة ويتمتع باشتقاقية مطّردة
    - lemma: أسيتات
      justification: آلية التعريب (ملاذ مشروع للمصطلحات ذات الأصل اليوناني-اللاتيني) — معرَّب من acétate الفرنسي (← لاتيني acetum = خلّ)، أُخضع للصرف العربي (يقبل التعريف والإضافة والجمع: أسيتات الصوديوم، أسيتات الرصاص)، وهو الأشيع في المراجع الكيميائية العربية والمعاجم المتخصصة الحديثة
  generation_notes: للمفهوم وجهان مشروعان — اشتقاقي (خلّات) ومعرَّب (أسيتات)؛ كلاهما موثَّق وكلاهما مستخدم؛ «أسيتات» أشيع تجارياً وعلمياً، و«خلّات» أوثق عربيةً وأعلى اشتقاقيةً


