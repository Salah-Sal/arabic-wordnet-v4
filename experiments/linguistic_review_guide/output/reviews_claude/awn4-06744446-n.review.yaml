    - lemma: "زعم"
      justification: "مصدر الفعل «زعَمَ» — آلية: اشتقاق (مصدر قياسي على وزن فَعْل). ثابت في كتب الاصطلاح: «الزعم هو القول بلا دليل» (الجرجاني، التهانوي). يختصر المعنى الكامل للمجموعة في لفظ واحد متجذّر في التراث، وله أسرة اشتقاقية وافرة"
    - lemma: "دعوى مُرسَلة"
      justification: "تركيب إضافي — آلية: تركيب. «الدعوى» = الادعاء، «مرسلة» = بلا سند. مستوحى من اصطلاح الفقه وعلوم الحديث؛ «الدعوى المرسلة» = الادعاء الذي لا يستند إلى بيّنة"
  generation_notes: "المفهوم يقع في حقل دلالي أصيل في العربية (جذر ز-ع-م) — «الزعم» المفرد هو الأدق والأكثر رسوخاً في المعاجم الاصطلاحية"


