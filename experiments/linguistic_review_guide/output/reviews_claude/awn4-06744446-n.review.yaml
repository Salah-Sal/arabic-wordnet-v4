step0_evidence:
  per_lemma:

    - lemma: "زعم بلا دليل"
      confirm:
        - text: "«الزَّعْمُ: هو القول بلا دليل»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الزعم: هو القول بلا دليل كذا في اصطلاحات السيد الجرجاني»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الزَّعْمُ... أَحَدُهُمَا الْقَوْلُ مِنْ غَيْرِ صِحَّةٍ وَلَا يَقِينٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«وإنما يقال زعموا في حديث لا سند له ولا ثبت فيه، وإنما يحكى على الألسن على سبيل البلاغ»"
          source: "النهاية في غريب الحديث والأثر لابن الأثير الجزري"
        - text: "«أكثر ما يكون الزعم فيما يشك فيه ولا يتحقق»"
          source: "المصباح المنير للفيّومي"
      expands:
        - text: "«زعم يزعم زعماً، أي قال»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "يوسّع الزعم ليشمل القول المطلق دون تقييده بغياب الدليل"
        - text: "«الزَّعْمُ مُثَلَّثةً: القولُ الحقُّ، والباطلُ، والكَذِبُ، ضِدٌّ، وأكثرُ ما يقالُ فيما يُشكُّ فيه»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يُدرج القولَ الحق ضمن الزعم، مما يوسّع المعنى عن حصره في التأكيد الباطل وحده"
        - text: "«التَّزَعُّم: التكذب»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "يوسّع المعنى نحو الكذب الصريح، وهو أشدّ مما تعنيه المجموعة (التأكيد بلا دليل قد يكون صادقاً)"
      peripheral_observations:
        - "«الزعيم: الكفيل» و«زعيم القوم: سيدهم» و«الزعامة: السيادة والرياسة» — معانٍ مستقلة لجذر ز-ع-م لا صلة لها بمعنى المجموعة"

    - lemma: "قول مجرد"
      expands:
        - text: "«القَوْلُ: الكلام، والرأي، والمعتقد»"
          source: "المعجم الوسيط"
          addition: "يتناول القول بعمومه ولا يُخصّصه بكونه مجرداً من الدليل"
        - text: "«القَوْل: الكلام على التقريب، وهو عند المحقق: كل لفظ قال به اللسان تاماً كان أو ناقصاً»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
          addition: "تعريف عام للقول يفتقر إلى سمة التأكيد بلا دليل المميّزة لهذه المجموعة"


step05_lemma_generation:
