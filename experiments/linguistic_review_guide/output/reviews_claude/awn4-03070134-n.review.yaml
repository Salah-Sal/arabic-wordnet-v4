step05_lemma_generation:
  evidence_candidates:
    - lemma: فِرزجة
      source_section: step4_fts_keyword
      evidence_citation: "«الفَرْزَجَة: «أ» تحميلة للمَهْبِل. «ب» «كعكة» تُقْحَم في المهبل لمنع الحمل أو لتصحيح وضع الرحم.» — المورد الحديث (2008)"
      justification: >
        الفرزجة جهاز يُدخَل في الجهاز التناسلي لمنع الحمل أو تصحيح وضع الرحم؛ تقاطع دلالي جزئي مع IUD
        من حيث الوظيفة (منع الحمل، وضع داخل الجسم)، وإن كان موضعها المهبل لا الرحم.

    - lemma: فِرزجة رحمية
      source_section: step4_fts_keyword
      evidence_citation: "«فِرزجَة: شكل صيدلاني معد للإدخال في المهبل لأغراض علاجية أو لسند الرحم أو لمنع الحمل.» — المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      justification: >
        مركّب إضافي يُقيّد الفرزجة بموضع الرحم؛ محاولة لسدّ الفجوة الدلالية بين الفرزجة (مهبلية) و IUD (رحمية).
        غير أن المصادر لا تُسجّل هذا المركّب بالذات — يفشل اختبار التثبيت المعجمي.

  knowledge_candidates:
    - lemma: حاجب الحمل الرحمي
      justification: >
        آلية التوليد: تركيب وصفي إضافي. «حاجب الحمل» مركّب يدل على الوظيفة (منع/حجب الحمل)،
        و«الرحمي» فصلٌ مميّز يحدد الموضع. غير أن هذا المركب وصفيٌّ حرّ لم يُسجَّل في المعاجم
        المتخصصة بهذا الجمع الخاص — يفشل اختبار السكّ.

    - lemma: الحلقة الرحمية
      justification: >
        آلية التوليد: تركيب إضافي. يصف الشكل (حلقة/لولب) والموضع (رحم)؛ يُستخدم شعبياً في بعض
        السياقات العربية. لكنه وصفي حرّ وليس مصطلحاً مسكوكاً ثابتاً في المعاجم الطبية.

  generation_notes: >
    التعريف يصف جهازاً طبياً متخصصاً (IUD). «لولب» هو المصطلح المُسكوك الأوحد في المعاجم العربية
    الطبية المتخصصة لهذا الجهاز؛ البدائل المُولَّدة إما أوسع دلالةً (فرزجة) أو وصفية حرة.
    الجسر الإنجليزي (coil) ترجم بـ«ملف/وشيعة» في السياقات الكهربائية وبـ«لولب» في الطبي.

