step1_lemma_validation:
  per_lemma:

    - lemma: لولب
      decision: confirmed
      decision_reason: >
        مصطلح طبي مُسكوك موثَّق في المعاجم الصيدلانية والطبية المتخصصة بالمعنى المقصود (IUD)؛
        أدلة تأكيد صريحة مع تحفّظ على تعدد المعاني وأصل الكلمة
      evidence_assessment:
        case: mixed
        notes:
          - >
            أدلة تأكيد من المعجم المعاصر (مختار عمر) والصيدلة (2009) والتشريح (2015) — صريحة في المعنى الطبي.
          - >
            أدلة توسّع من لسان العرب والوسيط والكمكلة (دوزي) — تُثبت تعدد المعاني وتُشكّك في الأصل.
          - >
            المعجم الوسيط (الطبعة الحالية) لا يُدرج المعنى الطبي — وهذا فجوة تستوجب الإشارة.

      mwe_check:
        is_mwe: false

      substitution_test:
        result: pass

      nuance_differentiation: >
        «لولب» الوحيدة في هذه المجموعة؛ المقارنة مع أخوات المجموعة غير ممكنة (لمّة منفردة).
        الفارق الجوهري أنه يُستخدم في الخطاب الطبي العربي المعاصر حصراً لـIUD، مع إدراك أن
        اللفظ في أصله يدل على الشكل الحلزوني (ويُشترك بين الهندسة والفيزياء والطب).
        الاشتراك اللفظي واسع لكن السياق الطبي يُرفع الإبهام.

      borrowing_check:
        loanword: true
        type: arabicized
        note: >
          ابن منظور يُقرّ بأنه «لا يدري أعربي أم معرّب»؛ الرأي الغالب أنه مُعرَّب أو دخيل قديم
          (ربما من السريانية أو الفارسية). أُخضع للصرف العربي الكامل (لوالب، لولبي، لولبيّة) → مقبول.
        blind_literal: false
        calque: false

      quality_gate:
        conformity: >
          مستعمل فعلياً عند الأطباء والصيادلة العرب بالفصحى للدلالة على IUD.
        ease_of_use: >
          يسير على اللسان، مألوف، وقد اشتُقّت منه صفات وأفعال (لولبي، يتلولب، ملولَب).
        adequacy: >
          يُناظر IUD بدقة في الاستعمال الطبي المعاصر — وإن كان في أصله يدل على الشكل الحلزوني.
        heritage_preference: >
          لا يوجد لفظ تراثي أصيل للجهاز نفسه؛ الأقرب «فرزجة» لكنه يختلف موضعاً ووظيفةً.
        arabic_preference: >
          معرَّب مُقَرّ راسخ — يُفضَّل على النقل الحرفي أو التعريب الجديد.
        derivativeness: >
          ينتمي إلى أسرة اشتقاقية واسعة: لولبيّ، لولبيّة، لوالب، يتلولب — درجة اشتقاقية مرتفعة.

      morphological_fit: >
        الوزن غير اشتقاقي قياسي (ليس على وزن مِفعَال أو فَعَّالة)؛ هذا متوقَّع في الألفاظ
        المعرَّبة. الوزن الحالي (فَوْعَل) يُعبّر عن الشيء الحلزوني لا الجهاز الطبي بحد ذاته.
        الملاءمة الصرفية معقولة لكن غير مثالية — دلالته الأولى (الشكل الحلزوني) مجازها أعطى الجهاز اسمه.

      decision_reason: >
        مصطلح طبي مُسكوك موثَّق في المعاجم التخصصية (الصيدلة، الطب)؛ أدلة تأكيد صريحة؛
        معرَّب مُقرَّر أُخضع للصرف؛ لا بديل عربي أصيل راسخ — القرار: مؤكَّد.

      example: >
        أوصى الطبيب المريضةَ بتركيب اللولب الرحمي وسيلةً لمنع الحمل لمدة خمس سنوات.

      actions:
