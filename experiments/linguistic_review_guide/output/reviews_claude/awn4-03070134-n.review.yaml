# مراجعة المجموعة الترادفية: awn4-03070134-n
# اللمّة الإنجليزية: coil (IUD)
# التعريف: جهاز لمنع الحمل يوضع داخل رحم المرأة
# ══════════════════════════════════════════════════════════

step0_evidence:
  per_lemma:
    - lemma: لولب

      confirm:
        - text: "«لَوْلَب [مفرد]: ج لوالِبُ: ... 6 - (طب) وسيلة لمنع الحمل عند المرأة، حيث يوضع كجسم غريب في الرحم يمنع من علوق الحمل.»"
          source: معجم اللغة العربية المعاصرة لأحمد مختار عمر

        - text: "«لَوْلَبٌ: وسيلة منع حمل وهو أداة معدنية أو مطاطية تدخل في تجويف الرحم لمنع البويضة من التعشيش.»"
          source: المعجم الموحد لمصطلحات علم الصيدلة (2009)

        - text: "«داخِلَ الرَّحِم (intrauterine): صفة لما يوجد ضمن تجويف الرحم من مكونات نسيجية أو تشريحية أو ما هو معد للاستخدام فيه من أدوات طبية علاجية أو تشخيصية مثل موانع الحمل.»"
          source: المعجم الموحد لمصطلحات علم التشريح العياني (2015)

      expands:
        - text: "«لولب: برغي، علاقة دائرية (بوشر) ... لولب: نابض، قطعة حديدية تقاوم الضغط ... لولب: صمام، لسان المضخة المتحرك ... لولب: فقرة، فقارة: باللاتينية: vertebra»"
          source: تكملة المعاجم العربية لرينهارت دوزي
          addition: >
            اللمّة «لولب» متعددة المعاني في المعاجم الكلاسيكية (برغي، نابض، صمام، فقرة)؛
            المعنى الطبي (اللولب الرحمي) معنى حديث مُستحدَث على الشكل الحلزوني للجهاز

        - text: "«اللولب: الماء الكثير يخرج مندفعاً من الصُّنبور أو فم قناة ضيقة فيستدير كأنه مُصبّ كوز. أداة من خشب أو معدن تنتهي بشكل حلزوني. (في الميكانيكا) جهاز يستعمل لرفع الأثقال. (في الموسيقى) ما يعرف بالبرغ، ومكانه في كعب العصا.»"
          source: المعجم الوسيط
          addition: >
            المعجم الوسيط يُغفل المعنى الطبي (IUD) كلياً؛ المعنى الطبي ظهر لاحقاً في المعجم المعاصر والمعاجم التخصصية
            الصيدلانية — وهو إزاحة دلالية مجازية مبنية على الشكل الحلزوني اللولبي

        - text: "«لولب: التهذيب في الثنائي في آخر ترجمة لبب: ويقال للماء الكثير يحمل منه المفتح ما يسعه ... فيستدير الماء عند فمه، ويصير كأنه بلبل آنية: لولب ... ولا أدري أعربي، أم معرّب، غير أن أهل العراق وَلِعوا باستعمال اللولب.»"
          source: لسان العرب لابن منظور
          addition: >
            ابن منظور يشكّك في عروبة اللفظ ويُشير إلى احتمال تعريبه؛ الجذر الأصلي غير عربي قحّ —
            وهذا يؤثر على تقييم الاشتقاقية

      peripheral_observations:
        - >
          «لولب» في المعاجم التقنية يُستخدم بمعانٍ متعددة مستقلة تماماً عن IUD:
          (1) مسمار/برغي (screw) في الهندسة المدنية والميكانيكا،
          (2) وشيعة/ملف (solenoid) في الفيزياء،
          (3) حلزون (helix) في الرياضيات والبيولوجيا والوراثة،
          (4) اللولب المضاعف (double helix) للحمض النووي.
          هذه كلها معانٍ مستقلة لمجموعات ترادفية مختلفة — ليست ذات صلة بهذه المجموعة (IUD).

