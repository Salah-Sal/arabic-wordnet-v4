step3_definition:
  definition_review_flag: false
  current_definition: جهاز لمنع الحمل يوضع داخل رحم المرأة

  assessment:
    decision: revise
    reason: >
      التعريف الحالي وظيفي صحيح لكنه مقتضب — يفتقر إلى الجنس القريب المميَّز (ما طبيعة الجهاز؟)
      والفصل النوعي (ما آلية عمله؟). يُستحسن تعريف مصطلحي يُحدّد المادة والشكل وآلية المنع.

  authored_definitions:
    - type: terminological
      text: >
        أداة طبية صغيرة على شكل حلزوني (لولبي) أو حرف T، تُصنَع من مواد معدنية أو بلاستيكية،
        تُدخَل في تجويف الرحم للحيلولة دون الحمل بمنع انغراس البويضة المخصَّبة.
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

    - type: encyclopedic
      text: >
        وسيلة منع حمل طويلة الأمد تُدخلها طبيبة في رحم المرأة؛ قد تكون معدنية (تحتوي على نحاس
        يُحدث وسطاً مُعادياً للحيوانات المنوية) أو هرمونية تُطلق جرعات صغيرة من البروجسترون.
        تبقى فعّالة من ٣ إلى ١٠ سنوات حسب النوع. من مزاياها العودة السريعة إلى الخصوبة عند
        إزالتها. جمعها: لوالب رحمية.
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

  reasoning:
    revision_justification: >
      التعريف الحالي صحيح لكن مبسَّط للغاية؛ في المعجم الطبي الموحَّد «لولب رحمي» يُعرَّف بذكر
      المادة والوظيفة وآلية العمل — وهذا غائب عن التعريف الحالي.
    dictionary_comparison: >
      المعجم الموحَّد للصيدلة (2009) يذكر: «أداة معدنية أو مطاطية تدخل في تجويف الرحم لمنع البويضة
      من التعشيش» — أدقّ من التعريف الحالي في ذكر المادة وآلية المنع.
    terminological_strategy: >
      الجنس القريب = «أداة طبية صغيرة على شكل حلزوني» + الفصل المميّز = «تُدخَل في تجويف الرحم
      للحيلولة دون الحمل».

  actions:
