step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية: شكل ──
    - lemma: "شكل"
      decision: confirmed
      decision_reason: >
        أدلة معجمية وفيرة من مصادر OCR وHawramani والمعاجم التقنية تؤكد دلالة الهيئة المكانية والصورة الخارجية للشيء؛
        موثّق في معاجم الهندسة والرياضيات والطب والقانون عبر مصطلحات ARABTERM؛
        وزنه الصرفي (فَعْل) مناسب للاسم الدال على الحدث الحاصل أو الهيئة؛
        يسمح بالاشتقاق الواسع: شكَّلَ / تشكيل / تشكّل / مشكَّل / تشكيلي ✓؛
        لا لبس في الاقتراض: عربي أصيل من الجذر ش-ك-ل؛
        المعنى التوسعي (المثيل والشبيه) لا يُضعف الدلالة الأساسية
      evidence_assessment:
        case: "mixed"
        notes:
          - "المعنى التوسعي (المثل/الشبيه) ظلّ هامشياً منذ العصر الكلاسيكي ولا يؤثر على الاستعمال الأساسي"
      substitution_test:
        result: "pass"
      nuance_differentiation: >
        شكل أخصّ في الدلالة الهندسية والبصرية المحسوسة — يركّز على الهيئة الخارجية القابلة للرصد والقياس (مثلث/دائرة/كرة).
        يتميز عن هيئة بالتخصص في المجال الحسي المرئي دون الامتداد للحالات المجردة،
        ويتميز عن صورة بدلالته الهندسية الملموسة دون البُعد الفلسفي الماهوي (الأرسطي)
      example: "يتميّز شكلُ الكرة عن المكعب بانعدام الحواف والزوايا وبانسجام سطحها الخارجي في كل الاتجاهات."

    # ── لمّة أصلية: هيئة ──
    - lemma: "هيئة"
      decision: confirmed
      decision_reason: >
        أدلة معجمية تؤكد دلالة «الحال الظاهرة للشيء محسوسةً أو معقولة» — وهي دلالة تشمل الترتيب المكاني وإن كانت أعمّ منه؛
        الآية القرآنية (كَهَيئَةِ الطَّيرِ) توثّق الاستعمال في الدلالة على الشكل الخارجي للشيء المادي؛
        لا تناقض مع التعريف — التوسيع الدلالي لا يُفسد الانتماء للمجموعة؛
        عربية أصيلة من الجذر هـ-ي-أ؛
        التوسع نحو «المؤسسة» معنى مستقل في الاستعمال المعاصر لا يُلوّث الدلالة الأصلية
      evidence_assessment:
        case: "mixed"
        notes:
          - "هيئة أعمّ من الترتيب المكاني الخالص — تشمل الحالات المجردة غير المرئية"
          - "دلالة المؤسسة/الجهة الرسمية معنى مستقل يستحق معالجة منفصلة في AWN"
      substitution_test:
        result: "pass"
      nuance_differentiation: >
        هيئة تدل على «الحالة الظاهرة» بمعناها الشامل — تتسع للمجرد والمحسوس معاً ولا تقتصر على الهيئة المكانية.
        تتميز عن شكل بالشمولية والمرونة الدلالية وبدلالتها على المظهر العام والوقار،
        وتتميز عن صورة بالتركيز على الحالة الظاهرة لا على الماهية الفلسفية للشيء
      example: "ظهر الوفدُ الدبلوماسي بهيئة رسمية مهيبة أوحت بثقل المناسبة وجلال الحضور."

    # ── مرشح الخطوة ٠٫٥: صورة — مقبول ──
    - lemma: "صورة"
      source: step05
      decision: confirmed
      decision_reason: >
        مصطلح فلسفي أرسطي راسخ في التراث العربي منذ عصر الترجمة (القرن ٩م)؛
        المعاجم تعرّفه صراحةً بـ«الشكل والهيئة والصفة»؛
        يعبّر بدقة استثنائية عن قيد «بشكل متميز عن مادته» إذ هو بالضبط المصطلح العربي لـform بمقابل matter/مادة في الأنطولوجيا الأرسطية؛
        مُسكوك ومُثبَّت معجمياً في المعجم الكبير والمعجم الوسيط والمعجم الفلسفي؛
        يسمح بالاشتقاق الواسع: صوَّرَ / تصوير / مُصَوَّر / تصوّري ✓
      step05_citation: >
        «الصُّورَةُ: الشَّكْلُ التمثالُ المجسَّمُ الهَيْئَةُ الصِّفَةُ» — المعجم الكبير؛
        «صورة الشيء: ماهيته المجردة» — المعجم الوسيط
      substitution_test:
        result: "pass"
      nuance_differentiation: >
        صورة تحمل أعمق الأبعاد الثلاثة — هي المصطلح الفلسفي الكلاسيكي للشكل بوصفه ماهية الشيء في مقابل مادته.
        تتميز عن شكل بعلوّها الفلسفي وامتدادها للماهية المجردة في الذهن،
        وتتميز عن هيئة بتخصصها في الدلالة الأرسطية (صورة/مادة) دون الامتداد للحالة العامة أو المؤسسية
      example: "تتجلّى صورةُ الأشياء في هيئتها المكانية وترتيب مكوّناتها الخارجي، بمعزل عن جوهر مادتها التي تتألف منها."
      actions:
        - command: create_entry
          params:
            lemma: "صورة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00028005-n"

    # ── مرشح الخطوة ٠٫٥: نمط — مرفوض ──
    - lemma: "نمط"
      source: step05
      decision: removed
      decision_reason: >
        نمط يدل على الطراز والأسلوب والنموذج (pattern/mode/style) لا على الترتيب المكاني المتميز عن المادة تحديداً؛
        فشل اختبار الإبدال في السياق الفلسفي: «نمط الكرة» لا يؤدي معنى شكل الكرة بالدقة المطلوبة؛
        لا توثيق معجمي مسترجع يدعم هذا الاستخدام؛
        النمط يصف الترتيب الداخلي/المتكرر لا الهيئة المكانية الخارجية
      step05_citation: "من المعرفة اللغوية الداخلية — لا دليل معجمي مباشر في الأدلة المسترجعة"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
