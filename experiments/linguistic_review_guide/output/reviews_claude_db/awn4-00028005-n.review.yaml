      reason: "مصدر: الخطوة ٠٫٥ — المصطلح الفلسفي الأرسطي الدال على الصورة/الهيئة في مقابل المادة؛ يُطابق قيد التعريف «بشكل متميز عن مادته» بدقة استثنائية"
