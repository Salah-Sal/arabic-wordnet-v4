step05_lemma_generation:
  evidence_candidates:
    - lemma: "صورة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الصُّورَةُ: الشَّكْلُ التمثالُ المجسَّمُ الهَيْئَةُ الصِّفَةُ» — المعجم الكبير؛ «صورة الشيء: ماهيته المجردة» — المعجم الوسيط"
      justification: "صورة هي المصطلح الفلسفي العربي الأصيل للدلالة على الهيئة والنموذج في مقابل المادة — وهو بالضبط ما يعبّر عنه قيد «بشكل متميز عن مادته». رسخ استعمالها منذ عصر الترجمة لأرسطو (الصورة/المادة = form/matter)"
  knowledge_candidates:
    - lemma: "نمط"
      justification: "آلية: اشتقاق من الجذر ن-م-ط. نمط يدل على الترتيب والطراز والأسلوب المميّز للشيء، ويُستخدم في اللسانيات والفنون للدلالة على «النظام الداخلي للشيء بمعزل عن مادته» — لكنه يميل نحو pattern/mode أكثر من shape/form"
  generation_notes: "التعريف يجمع بُعدين: هندسي (ترتيب مكاني) وفلسفي (تمييز الصورة عن المادة). صورة تمثّل البُعد الفلسفي بدقة استثنائية، وشكل يمثّل البُعد الهندسي المحسوس."

