step05_lemma_generation:
  evidence_candidates:
    - lemma: "أفعى الرصاص"
      source_section: "step5_english_bridge"
      evidence_citation: "«أفعى الرَّصّاص: قضيب مَرِن تُنَظَّف به الأنابيب المسدودة» — المورد الحديث (2008)"
      justification: "مقابل عربي موثَّق مباشر لـ plumber's snake من معجم إنجليزي-عربي حديث معتمد؛ يستثمر استعارة الثعبان (شكلاً وحركةً متلوية) مع تخصيص وظيفي واضح (تنظيف الأنابيب) — آلية التوليد: مجاز (إزاحة دلالية للفظ «أفعى» نحو أداة تشاركها الشكل)"
  knowledge_candidates:
    - lemma: "مِسلَكَة"
      justification: "اشتقاق على وزن مِفعَلة من الجذر س-ل-ك (سَلَكَ = أنفذ، أدخل، أزال العائق) — وزن مِفعَلة منتج لأسماء الأدوات (مِكنسة، مِصفاة، مِبشرة) — تعني «الأداة التي تُسلِّك الأنابيب»، صياغة عربية أصيلة غير مقترضة ولا مركّبة تركيباً وصفياً"
  generation_notes: "المفهوم أداة تقنية حديثة مستوردة من الصناعة الغربية؛ الاستعارة (ثعبان ← أداة متلوية) عابرة للغات — المورد الحديث يُوثّق «أفعى الرصاص» كمصطلح عربي راسخ مقابل plumber's snake"

step1_lemma_validation:
  per_lemma:

    - lemma: "أداة ثعبانية"
      decision: removed
      decision_reason: "تركيب وصفي حر (وصفي: اسم + نعت نسبي) — لا شاهد معجمي، وفشل اختبار التثبيت: يمكن إبدال «ثعبانية» بـ«مرنة» أو «ملتوية» أو «متعرجة» مع بقاء العبارة وصفاً صادقاً لأي جسم مشابه للثعبان — هذا يُثبت أنها عبارة وصفية حرة لا مصطلح مسكوك"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "وصف مفتوح يصدق على الحبل والخرطوم والأفعى الحية وسواها — لا يُخصّص وظيفة تقنية ولا مجالاً ولا مادةً، فلا يُميّزه عن أي جسم آخر مشابه للثعبان"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سلك تسليك"
      decision: confirmed
      decision_reason: "تركيب إضافي تقني (سلك + تسليك)؛ جذر «تسليك» موثَّق في معجم المياه الموحد بمعنى إزالة انسداد الأنابيب؛ مكوّن «سلك» يُخصّص المادة (معدن مرن) ولا يقبل الإبدال بـ«حبل» أو «خيط» في السياق التقني؛ المركب متداول في حرفة السباكة وإن لم يُسجَّل مدخلاً مستقلاً في المعاجم المتاحة — اختبار التثبيت: «سلك» ضرورة مادية و«تسليك» ضرورة وظيفية فالتعبير ثابت"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُصرّح بالوظيفة التقنية مباشرةً (تسليك = فتح الانسداد) دون لجوء إلى المجاز؛ أكثر مباشرةً وأيسر للمهني من «أفعى الرصاص» التي تعتمد على الصورة الاستعارية"
      example: "أدخل السباك سلك التسليك في قناة الصرف وأدار مقبضه الحلزوني حتى أزال الانسداد المتراكم"

    - lemma: "أفعى الرصاص"
      source: step05
      decision: confirmed
      decision_reason: "موثَّق في المورد الحديث (2008) بتعريف دقيق مطابق للمفهوم؛ مصطلح مسكوك يتكوّن من وحدتين لا تقبلان الإبدال الحر: «أفعى» استعارة تشكيلية وظيفية لا تُستبدَل بـ«ثعبان» أو «حية» في هذا السياق التقني، و«الرصاص» مخصِّص مادي جوهري — التثبيت المعجمي مؤكَّد بالورود في معجم حديث متداول"
      step05_citation: "«أفعى الرَّصّاص: قضيب مَرِن تُنَظَّف به الأنابيب المسدودة» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُبرز الصورة الاستعارية (أفعى = شكل الثعبان وحركته المتلوية) مع تحديد طبيعة المادة — أكثر تصويراً وتداولاً في المعاجم من «سلك تسليك»؛ يُفضَّل في السياقات الوصفية والتعليمية"
      example: "أدار السباك أفعى الرصاص داخل أنبوب الصرف حتى استأصل الانسداد الصلب من جذره"
      actions:
        - command: create_entry
          params:
            lemma: "أفعى الرصاص"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04255138-n"

    - lemma: "مِسلَكَة"
      source: step05
      decision: removed
      decision_reason: "الصيغة الصرفية سليمة (مِفعَلة من س-ل-ك) والاشتقاق منطقي، غير أن اللفظ لم يرد في أي معجم أو مصدر تقني متاح ولم يُعهد له استعمال في الحقل — فشل اختبار التثبيت المعجمي: مُبتكَر لا مسكوك؛ «سلك تسليك» و«أفعى الرصاص» يسدّان الحاجة المصطلحية دون الحاجة إلى توليد جديد"
      step05_citation: "لا شاهد معجمي — مولَّد من المعرفة اللغوية الداخلية بوزن مِفعَلة من س-ل-ك"
      substitution_test:
        result: "pass"
      nuance_differentiation: "صيغة صرفية وجيهة ومنتجة لكن غير مستعملة — تُدرَج كمقترح للتقييس المستقبلي لا للإدراج الفوري"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "أفعى الرصاص"
      reason: "مصدر: الخطوة ٠٫٥ — موثَّق في المورد الحديث (2008) كمقابل عربي راسخ لـ plumber's snake"
      via_command: create_entry + add_sense

