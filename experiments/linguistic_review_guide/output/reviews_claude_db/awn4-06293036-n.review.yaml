step0_evidence:
  per_lemma:

    - lemma: "سريان"
      contradicts:
        - text: "«السَّرَيَانُ الآليَة (Gravity flow): نوعٌ من حركة الجليد فى مثلجة مستقرة على سطح مُنْحَدِر, حيث يسرى الجليدُ بفِعْل الجَاذبيَة فى اتجاه الانحدار إلى أسفل, ومنه سريانُ البترول أيضًا»"
          source: "المعجم الكبير"
          conflict: "معنى مادي فيزيائي (سريان الجليد والبترول بفعل الجاذبية)، لا علاقة له بانتقال الحالة العاطفية بين الناس"
        - text: "«كمية السائل المُتدفقة في وحدة زمنية مُعينة خلال مقطع مُستعرض مُعين. (انظر: تدفق تصريف)»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "مصطلح هيدرولوجي تقني (تصريف السوائل)، لا علاقة بانتقال الموقف أو الحالة العاطفية"
      peripheral_observations:
        - "«سُرْيَان: من (س ر ي) جمع السُّرِيّ، والسريان: طائفة من مسيحيين الشام والعراق» — موسوعة السلطان قابوس لأسماء العرب — معنى اسمي عرقي مستقل تماماً عن تعريف المجموعة"
        - "«سَرْيان: من (س ر ي) الليل الماضي الذاهب ومن يقطع الليل سيرا» — موسوعة السلطان قابوس لأسماء العرب — المعنى الأصلي للجذر (السير ليلاً)، مستقل تماماً"
        - "«سُرْيَان [جمع]: مف سُرْيانيّ: كلمة أطلقت على العناصر الآراميّة التي اعتنقت المسيحيّة» — معجم اللغة العربية المعاصرة لأحمد مختار عمر — معنى إثني-ديني مستقل تماماً"

    - lemma: "عدوى"
      confirm:
        - text: "«(3) العَدْوَى: «ب» انتقال سريع لأيّما شعور، كالحماسة أو القلق، من شخصٍ إلى آخر. «ج» شعور أو تأثير منتقل بسرعة»"
          source: "المورد الحديث (2008)"
        - text: "«(5) إعداء الآخرين مجازيًا [بجعلهم يحذون حذو المرء في عواطفه أو صفاته من طريق الاحتكاك أو الاقتداء]»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(الْعَدْوى) انْتِقَال الدَّاء من الْمَرِيض بِهِ إِلَى الصَّحِيح بوساطة مَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الدلالة الجذرية الراسخة: انتقال داء بيولوجي من مريض إلى صحيح؛ التعريف المطلوب عن انتقال حالة عاطفية لا مرض"
        - text: "«العدوى: بالفتح: اسم من الإعداء، وهو أن تجاوز العلة صاحبها إلى غيره، ومنه حديث 'لا عدوى'، أي لا يعدي شيء شيئاً»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "العلة (المرض الجسدي) تجاوز صاحبها إلى غيره — يُرسّخ المعنى المرضي لا العاطفي"
        - text: "«العَدْوى: هو الاسم من أعداء الحرب ونحوه أي ما يُعدي من جرب أو غيره، أي يسرع من واحد إلى آخر، وكان أهل الجاهلية يعتقدونه فنفاه الشرع»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "ما يُعدي من جرب أو غيره — أمراض جلدية وبيولوجية، لا حالات عاطفية أو مواقف نفسية"
        - text: "«انتقال المرض من معتل إلى سليم»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: "تعريف طبي بيطري للعدوى البيولوجية لا العاطفية"
      expands:
        - text: "«العدوى: بالفتح: اسم من الإعداء... والعدوى طلبك إلى والٍ يعديك على من ظلمك أي ينتقم منه باعتدائه عليك، وينصرك عليه، ومن ذلك قول الفقهاء: مسافة العدوى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُضيف حقلاً دلالياً قانونياً مستقلاً (طلب الإنصاف القضائي) يُثري التاريخ التداولي للكلمة خارج المجال المرضي والعاطفي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "سِرَايَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«عَدْوَى؛سِرَايَة» — المعجم الطبي الموحد (2009): مقابل عربي مزدوج لـ contagion يُدرج سِرَايَة إلى جانب عدوى"
      justification: "سِرَايَة من الجذر (س-ر-ي) تدل على الانتشار والنفاذ؛ ورودها مقرونةً بعدوى في المعجم الطبي الموحد يُثبت استعمالها في حقل الانتقال من فرد إلى آخر؛ والمعجم الطبي يُعطيها أيضاً بمعنى communicability (entry 560013)"
  knowledge_candidates:
    - lemma: "تناقُل"
      justification: "اشتقاق: صيغة تفاعُل من الجذر ن-ق-ل تُفيد المشاركة والتبادل بين أطراف متعددة؛ المعجم الوسيط يُثبت: «تناقل الْقَوْم الحَدِيث بَينهم نَقله بَعضهم عَن بعض» — يتوافق بنيوياً مع «انتقال... بين عدد من الناس» مع إبراز التبادلية والتكرار"
  generation_notes: "التعريف يصف ظاهرة انتقال لاإرادي للحالة العاطفية في المجموعة؛ الجذران الرئيسيان: ع-د-و (التعدية والانتقال السريع) وس-ر-ي (النفاذ التدريجي)؛ صيغة التفاعُل واعدة لأنها تُضمّن الاشتراك والتبادلية"

step1_lemma_validation:
  per_lemma:

    - lemma: "سريان"
      decision: escalated
      decision_reason: "لا أدلة معجمية مباشرة تُثبت استخدام «سريان» مصطلحاً مستقلاً للعدوى العاطفية؛ المعاجم تُوثّق السريان المادي (الجليد والبترول والمياه) والمعنى الإثني (السريان المسيحيون)؛ وإن كان الجذر (س-ر-ي) يحمل معنى النفاذ والانتشار القابل للتوسع مجازاً كما في «سرى السُّمُّ فيه» و«سرى العتق» الفقهية، إلا أن تقرير الاسم المصدر «سريان» وصفاً اصطلاحياً لانتقال الحالة العاطفية يستلزم توثيقاً بشرياً"
      evidence_assessment:
        case: "contradicts"
      substitution_test:
        result: "pass"
      nuance_differentiation: "سريان يُبرز آلية النفاذ التدريجي الصامت (كسريان الماء في التربة وسريان الحكم في الفقه)؛ عدوى تُبرز الطابع التعدّي والانتقال السريع من حامل إلى غيره كالمرض المعدي؛ لو أُقرَّ سريان في هذا السياق: عدوى = تعدية سريعة واضحة، سريان = نفاذ تدريجي غير محسوس"
      actions:
        - command: set_confidence
          params:
            entity_type: sense
            entity_id: "{auto}"
            score: 0.3

    - lemma: "عدوى"
      decision: confirmed
      decision_reason: "المورد الحديث يُثبت صراحةً المعنى العاطفي الاجتماعي؛ بوابة الجودة: مستعملة عند المتخصصين (علم الاجتماع، علم النفس الاجتماعي — مسرد علم الاجتماع والأنثروبولوجيا يُثبت هذا)، تراثية أصيلة، اشتقاقية غنية (أعدى، يُعدي، مُعدٍ، إعداء)، يسيرة التداول؛ الوزن (فَعْلَى) ملائم للمصدر المُؤنَّث الدال على حدث مجرد"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "عدوى تُركّز على الطابع التعدّي (قابلية الانتقال كالمرض) وتحمل سمة اللاإرادية والسرعة؛ في السياق العاطفي: «عدوى الضحك» و«عدوى الذعر» و«عدوى الحماسة» تراكيب حيّة مُتداوَلة في الفصحى المعاصرة ومؤيَّدة بنص المورد الحديث؛ الانتقال المُضمَّن في عدوى لاإرادي بطبعه خلافاً للتواصل الإرادي"
      example: "رصد علماء النفس الاجتماعي كيف تنتقل عدوى الذعر في الحشود دون أن يدرك الأفراد أنهم يتأثرون ببعضهم."

    - lemma: "سِرَايَة"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار التثبيت المعجمي في حقل العواطف: «سراية الذعر/الحزن» غير مسكوك في أي مرجع؛ المعجم الطبي الموحد يُعطيها بمعنى communicability (قابلية الانتقال كخاصية) لا contagion (فعل الانتقال ذاته) — entry 560013؛ والجذر (س-ر-ي) مشترك مع سريان المُصعَّد مما يُضاعف الحاجة إلى تمييز بشري؛ عدوى المؤكَّدة تُغني عنها في هذا السياق"
      step05_citation: "«عَدْوَى؛سِرَايَة» للدلالة على contagion — المعجم الطبي الموحد (2009)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "سِرَايَة في معجمها الأساسي = communicability (الخاصية)؛ عدوى = الحدث نفسه (فعل الانتقال)؛ الفارق جوهري لأن تعريف المجموعة يصف «انتقال» (حدث) لا «قابلية الانتقال» (خاصية)"

    - lemma: "تناقُل"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار التثبيت المعجمي في حقل العواطف: تناقُل في المعاجم مقيَّد بنقل الأخبار والأحاديث؛ «تناقل الناس الذعر/الحزن» غير مسكوك في أي مرجع معجمي؛ فضلاً عن فارق الإرادية: تناقُل حدث إرادي (الناس ينقلون الخبر عمداً)، والعدوى العاطفية لاإرادية بطبعها — هذا الفارق كافٍ للرفض"
      step05_citation: "«تناقل الْقَوْم الحَدِيث بَينهم نَقله بَعضهم عَن بعض» — المعجم الوسيط لمجموعة من المؤلفين"
      substitution_test:
        result: "fail"
      nuance_differentiation: "تناقُل يختص بتداول المعلومات والأخبار إرادياً؛ عدوى تختص بانتقال المشاعر لاإرادياً؛ الفرق في الإرادية وطبيعة المنقول (خبر vs شعور) يجعلهما في حقلين دلاليين مختلفين"

  synset_flags:
    definition_review_needed: true

