step0_evidence:
  per_lemma:

    - lemma: "شعب"
      confirm:
        - text: "«الجماعة الكبيرة ترجع لأب واحد، وهو أوسع من القبيلة؛ الجماعة من الناس تخضع لنظام اجتماعي واحد؛ الجماعة تتكلم لساناً واحداً»"
          source: "المعجم الوسيط"
        - text: "«شَعْب2: جمهور، جماعة كبيرة من الناس تسكن أراضي محدّدة وتخضع لنظام اجتماعيّ واحد وتجمعها عادات وتقاليد وتتكلَّم لسانًا واحدًا — الشّعب العربيّ- رجل من الشّعب»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«كلّ جماعة كثيرة من الناس يرجعون إلى أب مشهور بأمر زائد فهو شعب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«شَعْبٌ» — translation_en: peuple — domain: Geography and History"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
        - text: "«شعب» — translation_en: people — domain: Sociology and Anthropology"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
        - text: "«شعب: جمهور، كثرة، حشد — حقوق الشعب: القانون المدني؛ رأي الشعب: الرأي العام»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
      expands:
        - text: "«الشَّعْبُ: ما تَشَعَّبَ من قبائل العرب والعجم؛ وكل جيل شَعْب»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "الدلالة الكلاسيكية تشمل الانتماء العرقي/القبلي وليس المواطنة القانونية وحدها — المفهوم أوسع من تعريف المجموعة"
        - text: "«الشَّعْبُ أكبر من القَبِيلَةِ، وقيل: الحيُّ العظيمُ يَتَشَعَّبُ من القبيلة؛ وكل جيل شَعْب»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "يشمل أبعاد الأصل والانتماء الإثني لا مجرد الانتساب القانوني لدولة"
      contradicts:
        - text: "«الشَّعْب: القبيلة العظيمة»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الدلالة الفقهية/القديمة تحصر شعب في مفهوم القبيلة العظيمة — يغاير هيئة مواطني دولة حديثة"
        - text: "«الشِّعْب (بالكسر): انفراجٌ بين الجبلين؛ الطريق في الجبل؛ مجرى للماء تحت الأرض»"
          source: "المعجم الوسيط"
          conflict: "المعنى الجغرافي (ممر جبلي ومسيل ماء) مستقل تماماً ولا صلة له بتعريف المجموعة"
      peripheral_observations:
        - "شَعُوب (بالضم): علم مؤنث على المنية — معنى مستقل تماماً"
        - "شِعْب (بالكسر): ممر بين جبلين — معنى جغرافي مستقل"
        - "شعب (فعل): جمع وأصلح / فرّق وأفسد — من الأضداد الكلاسيكية"

    - lemma: "مواطنون"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "مواطن (المفرد) في معجم الصواب اللغوي: مُصنَّف «مُحدَّثة» مقبولة — اشتقاق على وزن مُفَاعِل من «واطنَ القومَ: عاش معهم في وطن واحد»"
        - "مُوَاطِن في المعجم الموحد لمصطلحات القانون (2017): «شخص يتمتع بالحقوق المدنية والسياسية في الدولة التي يحمل جنسيتها» — translation_en: citizen"
        - "المورد الحديث (2008) يُترجم citizenry بـ«جماعة المواطنين؛ المواطنون قاطبةً» — يُقرُّ الجمع مواطنون ضمنياً"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "رعايا"
      source_section: "step5_english_bridge"
      evidence_citation: "«رعايا (دولة)» — translation_en: subjects — المعجم الموحد لمصطلحات القانون (2017)"
      justification: "مصطلح قانوني كلاسيكي يشير إلى منتسبي سلطة الدولة؛ مقابل subjects في النظام الملكي — قريب من المفهوم المعجمي للمجموعة"
    - lemma: "شعب"
      source_section: "step5_english_bridge"
      evidence_citation: "«شعب» — translation_en: people — مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)؛ وكذلك المعجم الوسيط: «الجماعة من الناس تخضع لنظام اجتماعي واحد»"
      justification: "الترجمة الطبيعية لـ people بوصفه هيئة أفراد الدولة — مدعوم بمعاجم متعددة كلاسيكية وحديثة"
  knowledge_candidates:
    - lemma: "مواطنون"
      justification: "اشتقاق — جمع مذكر سالم لاسم الفاعل «مُوَاطِن» على وزن مُفَاعِل من الجذر و-ط-ن (وطن)؛ يُعبِّر بدقة عن الانتماء القانوني للوطن؛ راسخ في الدساتير والتشريعات العربية المعاصرة كمقابل مباشر لـ citizens"
    - lemma: "رعية"
      justification: "اشتقاق — اسم جمعي من الجذر ر-ع-ي (رعى)؛ يُقابل «الشعب الخاضع لسلطة» في التراث — اسمٌ جامع لمنتسبي الدولة في الأدب السياسي الكلاسيكي؛ جمعه رعايا"
  generation_notes: "التعريف ذو طابع قانوني-سياسي؛ الجسر الإنجليزي أفضى إلى citizenry = «جماعة المواطنين» و subjects = رعايا؛ لا يوجد مصطلح واحد مسكوك في التراث الكلاسيكي يُقابل «هيئة المواطنين» بدلالتها الحديثة تماماً"


step1_lemma_validation:
  per_lemma:

    - lemma: "شعب"
      decision: confirmed
      decision_reason: "أدلة مؤكّدة قوية من المعجم الوسيط ومعجم اللغة المعاصرة؛ المصطلح مستقر في الاستعمال السياسي والاجتماعي"
      evidence_assessment:
        case: "mixed"
        notes:
          - "الأدلة الحديثة (الوسيط، معجم مختار عمر) تؤكد المعنى المطلوب بوضوح"
          - "الدلالة الكلاسيكية (القبيلة العظيمة، الأصل المشترك) تُوسِّع المعنى لما هو أشمل من المواطنة القانونية"
      substitution_test:
        result: "pass"
      nuance_differentiation: "شعب يُشير إلى الهوية الجماعية بأبعادها الثقافية واللغوية والتاريخية — أوسع من المواطنة القانونية؛ يُستخدم في الخطاب الوطني والسياسي للتعبير عن الإرادة الجماعية («إذا الشعب يومًا أراد الحياة»)؛ بينما مواطنون تُشير إلى الوضع القانوني الرسمي (حامل الجنسية)"
      loan_check:
        borrowing: false
        blind_literal: false
        calque: false
      quality_gate:
        consistency: "مستعمل فعلياً في الخطاب السياسي والقانوني العربي"
        ease_of_use: "يسير النطق خفيف اللسان"
        adequacy: "يُقابل people/citizenry في السياق السياسي مع توسّع دلالي مقبول"
        prefer_heritage: "لفظ تراثي أصيل"
        prefer_arabic: "عربي فصيح"
        derivability: "شعبيّ، شعبيّة، تشعُّب — اشتقاقية عالية"
      morphology_fit: "فَعْل على وزن شائع للأسماء الجمعية — الوزن مناسب"
      example: "أبدى الشعبُ تأييده الواسع للإصلاحات الدستورية من خلال المشاركة الكثيفة في الانتخابات"

    - lemma: "مواطنون"
      decision: confirmed
      decision_reason: "لفظ مُحدَّث مقبول لغوياً ومُقنَّن في التشريعات العربية؛ يُؤدي المعنى القانوني الدقيق لتعريف المجموعة"
      evidence_assessment:
        case: "no_material"
        notes:
          - "لا سند في المعاجم الكلاسيكية — المفرد مواطن مُصنَّف «مُحدَّثة مقبولة» في معجم الصواب"
          - "مُقرَّن بـ citizenry في المورد الحديث: «جماعة المواطنين؛ المواطنون قاطبةً»"
          - "المعجم الموحد لمصطلحات القانون (2017) يُعرِّف مواطن بـ«شخص يتمتع بالحقوق المدنية والسياسية»"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مواطنون تُشير بدقة إلى حاملي الجنسية القانونية — الحق القانوني في الانتماء للدولة — وهو المعنى الأضيق والأكثر تحديداً؛ بينما شعب أوسع ويشمل الأبعاد الثقافية والإثنية"
      loan_check:
        borrowing: false
        blind_literal: false
        calque: false
      quality_gate:
        consistency: "راسخ في الدساتير والتشريعات العربية"
        ease_of_use: "يسير النطق"
        adequacy: "يُقابل citizens بدقة تامة"
        prefer_heritage: "لا يوجد لفظ تراثي مفرد يُؤدي المعنى الحديث للمواطنة القانونية (رعايا تختلف دلالياً)"
        prefer_arabic: "عربي فصيح مُشتق من وطن"
        derivability: "يُواطن، مواطنة، مواطنتيّة — اشتقاقية جيدة"
      morphology_fit: "جمع مذكر سالم لمُفَاعِل — الوزن مناسب لاسم الفاعل من المفاعلة"
      example: "كفل الدستور لجميع المواطنين حقوقاً متساوية أمام القانون بصرف النظر عن أصولهم"

    - lemma: "رعايا"
      source: step05
