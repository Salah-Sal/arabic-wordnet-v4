step3_definition:
  definition_review_flag: true
  current_definition: "هيئة مواطني دولة أو بلد"
  assessment:
    decision: revise
    reason: "«هيئة» ترجمة حرفية لـ body في الإنجليزية — غير شائعة في هذا السياق بالعربية؛ التعبير العربي الأكثر طبيعية يستخدم «مجموع» أو «عموم»"
  scope_note: "تعريف AWN مُفسَّر بالمعنى القانوني-السياسي الحديث لـ citizenry؛ المعاجم الكلاسيكية لا تعرف «شعب» بهذا القيد القانوني بل بأوسع منه (جماعة بأصل مشترك)"
  authored_definitions:
    - type: terminological
      text: "مجموع مواطني الدولة أو البلد الذين يتمتعون بالحقوق المدنية والسياسية المكفولة بالجنسية"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "عموم من ينتسبون إلى دولة أو بلد من المواطنين"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-08177175-n"
        definition_index: 0
        text: "مجموع مواطني الدولة أو البلد الذين يتمتعون بالحقوق المدنية والسياسية المكفولة بالجنسية"


