step0_evidence:
  per_lemma:

    - lemma: "مجموعة"
      confirm:
        - text: "«مجموعة — set (Mathematics and Astronomy)»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«مفهوم رياضي استعمل بكثرة في اللسانيات وهو يدل على عدد من المكونات لها خاصيات متشابهة أو خاصية واحدة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«لفظ عام يطلق على مجموع عناصر منسجمة تكون وحدة مثل مجموعة المحارف ومجموعة التعليمات وغيرهما — set»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      expands:
        - text: "«تطلق في الكيمياء على عدد من الذرات تدخل في التفاعلات الكيميائية دون انفصام بينها فكأنما هي ذرة واحدة مثال ذلك المجموعة الهيدروكسيدية»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "المجموعة الكيميائية (functional group) تُقيّد العناصر بالذرات المترابطة كيميائياً — بُعد غير موجود في تعريف المجموعة الرياضية"
      peripheral_observations:
        - "المعجم الكبير (ocr): «المجموعة من الفلوات التي يجتمع بها القوم ولا يتفرقون خوف ضلال الطريق» — معنى جغرافي/حضاري كلاسيكي مستقل تماماً عن المعنى الرياضي"
        - "معجم مصطلحات المعلوماتية (2000): «في الطباعة والإظهار: زمرةٌ من المحارف المتصلة فيما بينها — set» — تطبيق تقني في الطباعة لا رياضي بحت"

    - lemma: "مجموعة رياضية"
      evidence_status: "no_material_found"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "مجموعة"
      source_section: "step5_english_bridge"
      evidence_citation: "«مجموعة = set — domain: Mathematics and Astronomy» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      justification: "المقابل العربي المعتمَد لـ 'set' في معجم الرياضيات والفلك الموحّد؛ اشتقاق من ج-م-ع على صيغة اسم المفعول (مَفْعُولة) تدل على الكيان الناتج عن فعل الجمع — آلية: اشتقاق"
  knowledge_candidates:
    - lemma: "طائفة"
      justification: "مجاز (إزاحة دلالية): «طائفة من الشيء» في الفصحى الكلاسيكية تعني الجزء والجماعة منه؛ يمكن إطلاقها على تجمُّع مجرد بإزاحة دلالية من الجماعة البشرية إلى التجمع الرياضي — غير أنها غير مثبَّتة في المعجمية الرياضية"
    - lemma: "جملة"
      justification: "مجاز تاريخي (إزاحة دلالية): «الجملة بالضم لغةً المجموع» (كشف اصطلاحات الفنون)؛ بعض المعاجم الثنائية تُعادل بها 'ensemble/set' — غير أن الاستعمال الحديث خصّصها للمعنى النحوي (sentence) تماماً"
  generation_notes: "نظرية المجموعات (set theory) هي المجال المستهدف؛ جذر ج-م-ع هو المحور الاشتقاقي الطبيعي والمُنتَج لهذا المفهوم في العربية؛ لا بديل مفرداً راسخاً في التراث الرياضي العربي"


step1_lemma_validation:
  per_lemma:

    - lemma: "مجموعة"
      decision: confirmed
      decision_reason: "مصطلح رياضي عربي مُعتمَد في المعجم الرياضي الموحّد (ALECSO 1990) كمقابل لـ 'set'؛ وزن اسم المفعول (مَفْعُولة) ملائم دلالياً لأنه يدل على الكيان الناتج المُجمَّع؛ يجتاز بوابة الجودة كاملةً: شائع فصيح مستعمَل عند المتخصصين، يسير النطق، دقيق المطابقة للمفهوم الرياضي، تراثي الجذر (ج-م-ع)، اشتقاقي المنتج (جَمَعَ / يَجمع / مجموعة / جمعٌ / جامع). لا إشكال في الاقتراض: الكلمة عربية خالصة. الوزن (مَفْعُولة) مناسب لأسماء الكيانات المُجمَّعة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختلف جوهرياً عن «زمرة» (algebraic group) التي تشترط عملية ثنائية منغلقة تحقق البنية الجبرية الأربعة (الانغلاق، الترابط، المحايد، المعكوس) — أما المجموعة الرياضية فلا تستلزم أي عملية أو بنية إضافية سوى عضوية العناصر"
      example: "تُعدّ مجموعة الأعداد الحقيقية ℝ مجموعةً لا نهائيةً تشمل الأعداد الصحيحة والنسبية وغير النسبية على حدٍّ سواء."

    - lemma: "مجموعة رياضية"
      decision: removed
      decision_reason: "مركّب وصفي حر (اسم + نعت) وليس مصطلحاً مسكوكاً؛ اختبار السكّ: «رياضية» قابلة للإبدال بـ«جبرية» أو «حسابية» أو «طوبولوجية» وتبقى العبارة وصفاً صحيحاً، مما ينفي الإحكام الاصطلاحي؛ اختبار التثبيت المعجمي: لا مدخل مستقل له في معجم الرياضيات الموحّد الذي يكتفي بـ«مجموعة» مفردةً — الوصف بـ«رياضية» يؤدي وظيفة تمييزية سياقية لا تأسيسية"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: "يؤدي وظيفة التمييز السياقي (يُميّز مجموعة نظرية المجموعات عن المجموعة الأدبية ونحوها) لكنه ليس مدخلاً مستقلاً في المعجمية الرياضية العربية"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "طائفة"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار التثبيت المعجمي: لا يرِد في أي معجم رياضي عربي مقابلاً رسمياً لـ 'set'؛ تحمل الكلمة في الاستعمال الحديث حمولةً دينيةً واجتماعيةً تُخلّ بالحياد العلمي؛ الوزن (فاعلة) لا يوحي بالتجمع الرياضي المجرد"
      step05_citation: "«طائفة من الشيء: القطعة منه والجزء والنصيب» — لسان العرب (ابن منظور)"

    - lemma: "جملة"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار الإبدال: استعمال «الجملة» بمعنى 'set' يوقع في لبس مباشر مع المعنى النحوي الراسخ (sentence)؛ فشل اختبار التثبيت: لا معجم رياضي عربي حديث يعتمدها مقابلاً رسمياً — المعنى التاريخي «المجموع» اندثر عملياً من الاستعمال الرياضي"
      step05_citation: "«الجملة بالضم لغةً: المجموع؛ وعند بعض النحاة هي الكلام» — التعريفات للجرجاني"


