step0_evidence:
  per_lemma:
    - lemma: "مَادَّة"
      confirm:
        - text: "«(مَادَّة الشَّيْء) أُصُوله وعناصره التي منها يتكون حسية كانت أو معنوية كمادة الخشب ومادة البحث العلمي»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«مادة الشيء: هي التي يحصل الشيء معها بالقوة، وقيل: المادة: الزيادة المتصلة»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«المادَّة: ما يكون به الشيء موجوداً بالقوة»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«مادة» — translation_en: substance"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«مادة» — translation_en: substance; substantia"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«مَادَّة» — translation_en: substance"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مادة» — translation_en: substance"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
        - text: "«مادة (ن)» — translation_en: substance"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«مادة» — translation_en: substance"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«(الْمَادَّة) كل شيء يكون مدداً لغيره وكل جسم ذي امتداد ووزن ويشغل حيزاً من الفراغ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "تعريف «المادة» في عموم الوجود الفيزيائي — أعمّ من «مادة ذات تكوين معين»"
        - text: "«ومواد اللغة: ألفاظها — ومواد العلم: مباحثه — ومواد القانون: الجمل التي تتضمن أحكامه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "استعمالات مجازية للمادة في اللغة والتشريع والعلوم — خارجة عن نطاق هذه المجموعة الترادفية"
        - text: "«الْمَادَّة: هي الهيولى وهي محل الجوهر أي الصورة جسمية كانت أو نوعية»"
          source: "دستور العلماء للأحمدنكري"
          addition: "المعنى الفلسفي الأرسطي (الهيولى/القوة الاستقبالية) — أعمّ من المفهوم الكيميائي/الفيزيائي المقصود"
        - text: "«المادّة: عند الحكماء هي المحل وتسمّى بالهيولى أيضاً... وتطلق أيضاً على خلط ردي يتغير عن طبعه بحيث يحصل له كيفية ردية. وعند المنطقيين هي كيفية النسبة بين المحمول والموضوع»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "ثلاثة معانٍ إضافية: الهيولى الفلسفية، الخلط الطبي، المادة المنطقية (وجوب/امتناع/إمكان) — كلها خارج نطاق المجموعة"
        - text: "«مُصطلح مُشتق من الكلمة اللاتينية materia، وهو في العلوم الطبيعية مصطلح يشمل كافة الأجسام المرئية التي لها كتلة»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "تعريف «المادة» المطلقة (جميع الأجسام ذات الكتلة) — أعمّ من «مادة بعينها ذات تكوين معين»"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جَوْهَر"
      source_section: step5_english_bridge
      evidence_citation: "«جوهر» — translation_en: substance — المعجم الموحد لمصطلحات اللسانيات (2002) ومسرد الفلسفة وعلم النفس"
      justification: "مقابل مستقرّ للإنجليزية substance في المعاجم التقنية العربية الحديثة، ويؤدي المعنى الأنطولوجي «ما يدل بذاته دون حاجة إلى غيره في وجوده»، وهو من ألصق المصطلحات بمفهوم المادة ذات الوجود المستقل"
  knowledge_candidates:
    - lemma: "هَيُولَى"
      justification: "آلية التوليد: مجاز — إحياء للفظ الفلسفي الكلاسيكي المنقول عن اليونانية (ὕλη)، ويُستخدم في التراث العربي الإسلامي للإشارة إلى مادة الأشياء المادية. يُمثّل المادة في صورتها الجوهرية الأولى. مع ذلك، يحمل دلالة أرسطية متخصصة (المادة الأولى غير المتشكّلة) أكثر تخصصاً من «مادة ذات تكوين معين»"
  generation_notes: "مفهوم «substance» بمعنى مادة محددة التكوين لا يملك مقابلاً مرادفاً شائعاً في العربية غير «مادة» ذاتها — جوهر الفلسفي يغطي جانباً من الدلالة لكنه لا يتطابق تطابقاً تاماً مع السياق الفيزيائي/الكيميائي"

