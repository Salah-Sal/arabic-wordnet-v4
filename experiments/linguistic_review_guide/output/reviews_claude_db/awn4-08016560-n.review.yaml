step0_evidence:
  per_lemma:

    - lemma: مجال
      confirm:
        - text: "«مجال: domain» في سياق الرياضيات والفلك"
          source: المعجم الموحد لمصطلحات الرياضيات والفلك (1990)
        - text: "«(في الاستعمال المُعاصر): ما يَدُورُ فيه الشيءُ أو يتَّصل به»"
          source: المعجم الكبير
      expands:
        - text: "«(في الفيزياء): الحيِّزُ الذى تعْمَلُ فيه أيَّةُ قوَّةٍ كهربائية أو مِغْنَطِيسِيّة أو جاذِبيّة وما إلَيْها»"
          source: المعجم الكبير
          addition: يمتد المعنى إلى الفيزياء (مجال كهربائي/مغناطيسي/جاذبية) — بُعد علمي تقني إضافي لا يقتصر على مجموعة قيم المتغير المستقل
        - text: "«مجال: area / sector / field / zone»"
          source: المعجم الموحد لمصطلحات المياه (2000)
          addition: يُستخدم بمعانٍ متعددة في ميادين تقنية مختلفة — يكشف عن سعة دلالية تجاوز المفهوم الرياضي
      peripheral_observations:
        - "«مَوْضِعُ الجَوَلان» (المعجم الوسيط، المعجم الكبير) هو المعنى الأصلي المكاني المستقل تماماً عن المعنى الرياضي — أساس المجاز"

    - lemma: مجال الدالة
      confirm:
        - text: "«مجال الدالة: domain of function — التعريف: منطلق دالة»"
          source: المعجم الموحد لمصطلحات الرياضيات والفلك (1990)

    - lemma: نطاق
      contradicts:
        - text: "«(النطاق) حزَام يشد بِهِ الْوسط وَذَات النطاقين أَسمَاء بنت أبي بكر»"
          source: المعجم الوسيط لمجموعة من المؤلفين (1998)
          conflict: المعنى الأصلي حزام/خصر — مغاير تماماً لمفهوم مجموعة قيم المتغير المستقل
        - text: "«النِّطَاقُ: ما يشدُّ به الوسط والمِنطقة أخصُّ وهي ما يكون شدُّ الوسط به متعارفاً»"
          source: التعريفات الفقهيّة للبركتي
          conflict: يؤكد الاستخدام الفقهي/الكلاسيكي المعنى الملبسي المغاير للسياق الرياضي
      expands:
        - text: "«نطاق: domain» في سياق الكهرباء"
          source: موسوعة الكهرباء (IEC 60050)
          addition: استُخدم «نطاق» بمعنى domain في الكهرباء — لكنه لا يُطابق المعنى الرياضي الخاص بمجموعة تعريف الدالة
        - text: "«نطاق: scope» في السياق الطبي"
          source: المعجم الطبي الموحد (2009)
          addition: يُستخدم بمعنى نطاق/مدى في السياق الطبي — معنى مختلف عن domain of function
        - text: "«نطاق: band» (مجموعة من أطوال الموجات، نطاق التردد، نطاق الامتصاص…)"
          source: المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)
          addition: يُستخدم بمعنى نطاق ترددي/نطاق موجي — يُعمّق الفجوة الدلالية مع المعنى الرياضي المقصود
      peripheral_observations:
        - "التهانوي (كشاف اصطلاحات الفنون والعلوم، ت.1777) يستخدم «النطاق» بمعنى قسم من الفلك — معنى تقني قديم مستقل في علم الهيئة لا علاقة له بمجال الدالة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: منطلق دالة
      source_section: step5_english_bridge
      evidence_citation: "«مجال الدالة: domain of function — التعريف: منطلق دالة» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      justification: ورد «منطلق دالة» نصاً تعريفياً شارحاً لـ«مجال الدالة» في ARABTERM الرياضيات — يوحي بأنه مرادف مُقترح في التأليف المعجمي؛ آلية التوليد‏: اشتقاق (اسم مكان/مصدر من انطلق على وزن مُنطَلَق)
  knowledge_candidates:
    - lemma: مجال التعريف
      justification: مصطلح تركيبي إضافي (مجال + التعريف) متداول في مناهج رياضيات شمال أفريقيا (المغرب، الجزائر، تونس) كترجمة لـ«ensemble de définition» الفرنسي؛ آلية التوليد‏: تركيب إضافي
  generation_notes: المصطلح الأكثر توثيقاً في ARABTERM هو «مجال الدالة»؛ «مجال التعريف» متداول في المناهج المغاربية ولم يُعثر له على مدخل مستقل في قاعدة البيانات؛ لم تُفضِ استعلامات البحث الحر إلى مصطلحات جديدة تفوق ما في المجموعة

step1_lemma_validation:
  per_lemma:

    - lemma: مجال
      decision: confirmed
      decision_reason: أدلة مؤكّدة من ARABTERM الرياضيات والفلك (مجال = domain)؛ المعنى الأصلي المكاني هو أساس المجاز الموصل إلى المعنى الرياضي؛ التوسعات الفيزيائية التقنية لا تناقض بل توسّع
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: يُستخدم مجال (المفرد) اختصاراً عند وضوح الدالة من السياق — دلالته أعم من «مجال الدالة» إذ يشمل المجال الفيزيائي والتقني والرياضي؛ يتميّز عن «نطاق» بامتلاكه توثيقاً رياضياً رسمياً في ARABTERM وجذراً مجازياً واضحاً (ج-و-ل)
      example: "إذا كانت f(x) = 1/x فإن مجال f هو مجموعة الأعداد الحقيقية باستثناء الصفر، أي ℝ \\ {0}."

    - lemma: مجال الدالة
      decision: confirmed
      decision_reason: مصطلح رياضي مُعتمد ومُسجَّل في المعجم الموحد لمصطلحات الرياضيات والفلك (ARABTERM 1990) بتقابل مباشر مع «domain of function»؛ مركّب إضافي مستقر
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: الصيغة الكاملة المحدَّدة للمصطلح — تُزيل الغموض الناشئ عن تعدد دلالات «مجال» المفرد؛ تُستخدم في التعريفات الأكاديمية والمقدمات الرسمية حيث الدقة الاصطلاحية ضرورية؛ تتميّز عن «مجال التعريف» بكونها المصطلح الرسمي الوحيد في ARABTERM
      example: "يُعرَّف مجال الدالة f: A → B بأنه المجموعة A التي يُؤخذ منها عناصر المتغير المستقل."

    - lemma: نطاق
      decision: escalated
      decision_reason: تعارض حقيقي — المعنى الأصلي الكلاسيكي (حزام/حيّز) يُناقض المعنى الرياضي المقصود؛ لم يُعثر في ARABTERM الرياضيات والفلك على توثيق لاستخدام «نطاق» بمعنى domain of function؛ يُستخدم إقليمياً (مناهج خليجية/سعودية) لكنه يُخلط بـ«المدى/range»؛ يستلزم مراجعاً بشرياً لتقدير درجة القبول الإقليمي
      evidence_assessment:
        case: contradicts
      substitution_test:
        result: pass
      nuance_differentiation: يُستخدم في بعض المناهج الخليجية بمعنى domain لكنه في المعاجم الرسمية يُغطي scope/band/zone/range؛ خطر الخلط مع «مدى الدالة» (range) قائم إذ هو المفهوم المكمّل لمجال الدالة ويُعبَّر عنه أحياناً بنطاق

    - lemma: منطلق دالة
      source: step05
      decision: removed
      decision_reason: ورد في ARABTERM نصاً تعريفياً شارحاً لـ«مجال الدالة» لا كمصطلح مستقل — فشل اختبار التثبيت المعجمي؛ لم يُعثر عليه مدخلاً قائماً بذاته في أي معجم أو مرجع تخصصي
      step05_citation: "«مجال الدالة: domain of function — التعريف: منطلق دالة» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"

    - lemma: مجال التعريف
      source: step05
      decision: escalated
      decision_reason: مركّب إضافي (مجال + التعريف) متداول في المناهج المغاربية لكنه غير مُسجَّل في ARABTERM الرياضيات؛ يُحتمل كونه مصطلحاً تعليمياً إقليمياً من تأثير الفرنسية — يحتاج تحقّقاً بشرياً قبل الإضافة
      step05_citation: "لا مدخل في قاعدة البيانات — مصطلح مستقى من الاستعمال التعليمي الإقليمي في شمال أفريقيا"

step3_definition:
  current_definition: "مجموعة قيم المتغير المستقل التي تكون الدالة معرفة عندها"
  assessment:
    decision: retain
    reason: التعريف دقيق رياضياً — الجنس القريب (مجموعة قيم) والفصل المميّز (ارتباطها بالمتغير المستقل + شرط تعريف الدالة عندها) حاضران بوضوح؛ غير دوري ولا ضيّق ولا واسع؛ يتطابق مع التعريف العلمي الرسمي لـdomain of function

step4_relations:
  hypernymy:
    current_hypernym: مجموعة رياضية
    test_result: correct

