    reason: "التعريف ترجمة حرفية من الإنجليزية؛ «أشخاص» جنسٌ قريب غير دقيق لمفهوم جمعي اجتماعي — الأنسب «جماعة بشرية»؛ والصياغة لا تنسجم مع أسلوب التأليف المعجمي العربي (جنس قريب + فصل نوعي)"
