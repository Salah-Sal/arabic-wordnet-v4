step0_evidence:
  per_lemma:

    - lemma: "إثنية"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "المعجم الوسيط يثبت اللفظ بصيغة «أثنية» مع التعريف «أيضاً» دون محتوى دلالي — يُرجَّح أنه إحالة داخلية أو مدخل غير مكتمل في النسخة المُرقمَنة بالمسح الضوئي"
        - "الجسر الإنجليزي يُفصح عن المركّب «فِئَةٌ أَثْنِيَّة» في المعجم الطبي الموحد (2009) مقابلاً لـ ethnic group — يؤكد توطّن الجذر الإثني في المصطلحية العلمية العربية المعاصرة"

    - lemma: "مجموعة عرقية"
      confirm:
        - text: "«مجموعة يتكون أعضاؤها من عِرق واحد يجعلونه الرابط الأساس بينهم»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«مجموعة عرقية» [مقابل معتمد لـ ethnic group بلا تعريف نصّي]"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      expands:
        - text: "«مجموعة يتكون أعضاؤها من عِرق واحد يجعلونه الرابط الأساس بينهم»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: "عبارة «يجعلونه الرابط الأساس بينهم» تضيف بُعد الانتماء الإرادي والتعريف الذاتي للمجموعة — غير صريح في تعريف AWN الذي يكتفي بوصف الاشتراك الموضوعي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مجموعة سلالية"
      source_section: "step5_english_bridge"
      evidence_citation: "«مجموعة سلالية» [مقابل معتمد لـ ethnic group] — مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      justification: "مقابل مسجّل في معجم جغرافي متخصص يُبرز البُعد النسبي والسلالي للمجموعة البشرية المتميزة"
    - lemma: "فئة إثنية"
      source_section: "step5_english_bridge"
      evidence_citation: "«فِئَةٌ أَثْنِيَّة» [مقابل معتمد لـ ethnic group] — المعجم الطبي الموحد (2009)"
      justification: "مقابل مسجّل في المعجم الطبي الموحد يستعمل الجذر الإثني مقترناً بلفظة فئة"
  knowledge_candidates:
    - lemma: "شعب"
      justification: "آلية التوليد: مجاز (إزاحة دلالية) — لفظ عربي كلاسيكي ورد في القرآن للدلالة على الجماعات البشرية المتمايزة (﴿وَجَعَلْنَاكُمْ شُعُوباً وَقَبَائِلَ﴾)؛ يُعادل ethnic group في سياقات التنوع البشري والحضاري"
    - lemma: "جماعة عرقية"
      justification: "آلية التوليد: تركيب وصفي — مركّب موازٍ لـ«مجموعة عرقية» يستبدل «مجموعة» بـ«جماعة» التي تُبرز التضامن الداخلي والهوية المجتمعية أكثر من مجرد التجمّع العددي"
  generation_notes: "المفهوم أنثروبولوجي حديث؛ التراث العربي يستعمل شعب وقوم وعِرق وقبيلة لدلالات متقاربة غير مطابقة بالمعنى الأكاديمي الدقيق. توحّدت المصطلحية الحديثة على «مجموعة عرقية» كمعيار"

step1_lemma_validation:
  per_lemma:

    - lemma: "إثنية"
      decision: confirmed
      decision_reason: "لفظ معرَّب أُخضع للصرف العربي (الإثنية، إثنيات، إثني) — مستقرّ في الأدبيات الأكاديمية العربية المعاصرة؛ قبول التعدد الدلالي (هوية + جماعة) سمة لا عيب، والاشتقاقية مضمونة"
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مفرد موجز يجمع دلالة المجموعة (ethnic group) ودلالة الهوية المجردة (ethnicity)؛ أكثر إيجازاً من المركّب وأعلى أكاديميةً في النصوص السوسيولوجية والسياسية؛ يُيسّر التوليد الاشتقاقي (إثني، إثنياً، إثنيات)"
      example: "وضعتِ الدولةُ سياساتٍ لصون هوية الإثنياتِ الأصليةِ وضمانِ تمثيلها في المؤسسات الدستورية."

    - lemma: "مجموعة عرقية"
      decision: confirmed
      decision_reason: "مُعتمَد في مسردَي الإعلام والجغرافيا (ArabTerm) بالمقابل ethnic group — تعبير مركّب وصفي مُثبَت معجمياً في مصادر متخصصة متعددة"
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُصرَّح فيه بالجانب الجمعي (مجموعة = group) والسمة التعريفية (عرقية = ethnic/racial)؛ أوسع استعمالاً في الخطاب الإعلامي والجغرافي؛ يُفرّق دلالياً بين العِرق بوصفه معياراً والمجموعة بوصفها تشكّلاً اجتماعياً"
      example: "يضمّ البلدُ أكثرَ من عشرين مجموعةً عرقيةً متمايزةً تتباين في اللغة والعادات وتتشارك في التاريخ."

    - lemma: "مجموعة سلالية"
      source: step05
      decision: confirmed
      decision_reason: "مقابل مُعتمَد في مسرد الجغرافيا والتاريخ (ArabTerm) لـ ethnic group؛ يُضاف بوصفه مرادفاً متخصصاً يُبرز البُعد الأنسابي"
      step05_citation: "«مجموعة سلالية» [مقابل ethnic group] — مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُقيّد التعريف بالانحدار السُّلالي والأنساب (سُلالة = lineage)؛ أخصّ من «عرقية» الذي يشمل الأبعاد الثقافية والحضارية معاً؛ يُستخدم في الجغرافيا البشرية وعلم الأنساب حين يكون الرابط الجيني هو المحدِّد"
      example: "درستِ الأنثروبولوجيا توزيعَ المجموعات السلاليةِ في حوض النيل وتتبّعت هجراتِها عبر آلاف السنين."
      actions:
        - command: create_entry
          params:
            lemma: "مجموعة سلالية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07983996-n"

    - lemma: "فئة إثنية"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار السكّ: استبدال «فئة» بـ«مجموعة» أنتج «مجموعة إثنية» تصف المفهوم ذاته — دلالة على التركيب الوصفي الحرّ لا المصطلح المسكوك؛ إضافةً إلى أن «فئة» تحمل دلالة التصنيف التجريدي لا التجمّع الإنساني الحيّ"
      step05_citation: "«فِئَةٌ أَثْنِيَّة» [مقابل ethnic group] — المعجم الطبي الموحد (2009)"
      nuance_differentiation: "فئة تُستعمل للتصنيف التجريدي والإحصائي، بينما المجموعة العرقية تجمّع بشري ذو هوية مُعاشة — تنافر الجنس مع المفهوم يُضعف الصياغة"

    - lemma: "جماعة عرقية"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار السكّ والتثبيت المعجمي: استبدال «جماعة» بـ«مجموعة» أنتج «مجموعة عرقية» الموجودة في المجموعة — تركيب وصفي حرّ لا وحدة معجمية مسكوكة، لا سند معجمي مسجّل"
      step05_citation: "مرشح من المعرفة اللغوية — لا سند معجمي"
      nuance_differentiation: "جماعة تُضيف ظلّ التضامن المجتمعي لكنها لا تُشكّل مصطلحاً مستقلاً — مرادفة تامة لمجموعة عرقية بلا تمايز دلالي معجمياً"

    - lemma: "شعب"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار الإبدال: «شعب» أعمّ بكثير — يشمل الشعوب القومية والدول والملل، ولا يحقّق خصوصية «المجموعة الإثنية» التي قد تكون أقلية داخل شعب أوسع"
      step05_citation: "مرشح من المعرفة اللغوية — لا سند معجمي خاص"
      nuance_differentiation: "شعب يُحيل إلى الوحدة القومية/السياسية الكبرى؛ ethnic group قد تكون أقلية داخل شعب واحد — الفرق جوهري في علم الأناسة الحديث"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "مجموعة سلالية"
      reason: "مقابل معتمد في ArabTerm الجغرافي؛ يُضيف البُعد السلالي المتمايز دلالياً"
      via_command: "create_entry + add_sense"

