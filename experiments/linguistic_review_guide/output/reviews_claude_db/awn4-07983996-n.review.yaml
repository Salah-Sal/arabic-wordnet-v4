        circular: false
        passed: true
    - type: linguistic
      text: "مجموعة من الناس ينحدرون من عِرق أو وطن واحد، ويجمعهم موروث ثقافي خاص يُميّزهم"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-07983996-n"
        definition_index: 0
        text: "جماعة بشرية تتشارك انتماءها العرقي أو الوطني، وتتميّز بتراث ثقافي مشترك يُعرِّفها ويُفرّقها من سائر الجماعات"
    - command: add_definition
      params:
        synset_id: "awn4-07983996-n"
        text: "مجموعة من الناس ينحدرون من عِرق أو وطن واحد، ويجمعهم موروث ثقافي خاص يُميّزهم"

