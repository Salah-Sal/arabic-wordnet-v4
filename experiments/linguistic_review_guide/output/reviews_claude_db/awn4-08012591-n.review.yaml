      decision_reason: "فشل اختبار التثبيت المعجمي كمرادف لجماعة الكائنات — التعريف المعجمي الثابت هو التكوين السحابي الجوي؛ استعمالها مجازاً لجماعة الحشرات غير مصطلحي في هذا الحقل الدلالي؛ إبدالها بـ«حشد» أو «سرب» في السياق يُغيِّر المعنى"
      step05_citation: "«سحابة» — المعجم الموحد لمصطلحات الأرصاد الجوية (cloud)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "المعنى المعجمي المستقر: التكوين السحابي الجوي؛ وهو مختلف جوهرياً عن معنى جماعة الكائنات في الهواء"

    - lemma: "خَشْرَم"
      source: step05
      decision: removed
      decision_reason: "أخصّ من دلالة المجموعة الترادفية — يختص بجماعة النحل والزنابير تحديداً دون الطير وسائر الحيوانات؛ فشل اختبار الإبدال في السياق العام"
      step05_citation: "«الخَشْرَمُ: مأوى الزنابير والنحل» — كتاب العين للخليل بن أحمد الفراهيدي"
