step0_evidence:
  per_lemma:

    - lemma: "حشد"
      confirm:
        - text: "«عِنْدِي حَشْدٌ مِنَ النَّاسِ، أَيْ جَمَاعَةٌ، وَهُوَ فِي الأَصْلِ مَصْدَرٌ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«الجَماعةُ يَحْتَشِدون»"
          source: "المعجم الكبير"
        - text: "«الحَشْدُ والحَشَدُ: اسمان للجمع»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
        - text: "«الحَشْد، ويُحَرَّك: الجماعةُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«واحتَشَدَ الْقَوْمُ لِفُلَانٍ: تَجَمَّعُوا لَهُ وتأهَّبُوا»"
          source: "النهاية في غريب الحديث والأثر لابن الأثير الجزري"
      contradicts:
        - text: "«من الناس: الجماعة»"
          source: "المعجم الوسيط"
          conflict: "يُقيِّد الحشد بالناس تحديداً، بينما تعريف المجموعة يشمل أشياء في الهواء وعلى الأرض من غير اشتراط الإنسان"
        - text: "«الجَماعةُ يَحْتَشِدون. يقال: عند فُلَانٍ حَشْدٌ من النَّاسِ العَشِيرَة»"
          source: "المعجم الكبير"
          conflict: "إضافة «من الناس» تُضيِّق الدلالة عن جماعة الطير أو الحشرات المقصودة في هذا السياق"
      expands:
        - text: "«وَمِنَ الْمَجَازِ: بِتُّ فِي لَيْلَةٍ تَحْشُدُ عَلَيَّ الْهُمُومَ»"
          source: "تاج العروس لمرتضى الزبيدي"
          addition: "الاستعمال المجازي يُثبت قابلية الجذر للتوسع إلى ما وراء الناس نحو الأشياء والمعنويات"
        - text: "«حشد = aggregation»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
          addition: "ترجمة «aggregation» تُوسِّع الدلالة إلى التجميع العام غير المقيَّد بالإنسان"

    - lemma: "سرب"
      confirm:
        - text: "«الفَريقُ من الطَّير والحيوان»"
          source: "المعجم الوسيط"
        - text: "«الفَريقُ من الطَّيْر وغيره. يقال: مَرَّ بِي سِرْبٌ من قَطًا وظِباءٍ ووَحْشٍ. وسِرْبُ نساءٍ على التَّشْبِيهِ»"
          source: "المعجم الكبير"
        - text: "«وبالكسرِ: القَطِيعُ منَ الظِّباءِ والنِّساءِ وغَيْرِها»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«مجموعة من الطيور تتغذى أو تنقل وتطير معاً»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«سـرب = swarms»"
          source: "المكنز الزراعي متعدد اللغات (ArabTerm)"
      contradicts:
        - text: "«السَّرَبُ: المَسْلك في خُفية وحفيرة تحت الأرض لا منفاذ لها وجُحْرُ الوحشي والقناة الجوفاء التي يدخل منها الماءُ الحائطُ والماء السائل من المزادة»"
          source: "المعجم الوسيط"
          conflict: "معانٍ مستقلة تماماً (نفق، جُحر، قناة مائية، ماء سائل) لا صلة لها بجماعة الطير أو الحيوان"
        - text: "«النَّفْسُ والقَلْبُ والصَّدْرُ والطريق والوجهة»"
          source: "المعجم الوسيط"
          conflict: "معانٍ مجازية (النفس، القلب، الصدر) وحسّية (الطريق، الوجهة) مستقلة عن دلالة جماعة الطير"
      peripheral_observations:
        - "للسَّرَب (بفتح الراء) معنى النفق والمسلك في الخُفية — ضبط صوتي مختلف عن السِّرْب"
        - "السَّرْب (بسكون الراء) يدل على المال الراعي والطريق والوجهة — معانٍ مستقلة"
        - "الشكل الدقيق للجماعة هو السِّرْب (بكسر السين) — التمييز الضبطي ضروري في الاستعمال"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "سِرْب"
      source_section: step4_fts_keyword
      evidence_citation: "«مجموعة من الطيور تتغذى أو تنقل وتطير معاً» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      justification: "يطابق دلالة التعريف (جماعة من الكائنات في الهواء أو على الأرض) مطابقةً دقيقة، ويُعزَّز بـ«swarms» في المكنز الزراعي"
    - lemma: "سحابة"
      source_section: step5_english_bridge
      evidence_citation: "«سحابة» — المعجم الموحد لمصطلحات الأرصاد الجوية (cloud)"
      justification: "يُقابل الإنجليزية cloud كما ترد في اللمّات الإنجليزية للمجموعة؛ مستعمل في العربية مجازاً للكتلة الكثيفة في الهواء"
  knowledge_candidates:
    - lemma: "خَشْرَم"
      justification: "آلية التوليد: إحياء لفظ تراثي (مجاز وظيفي). موثّق في كتاب العين والصحاح للدلالة على جماعة النحل والزنابير في الهواء؛ يُمثّل تمثيلاً تراثياً أصيلاً لمفهوم سِرْب الحشرات"
  generation_notes: "التعريف عام مقصود (جماعة أشياء في الهواء أو الأرض)؛ المفردات العربية تميل إلى التخصيص — سِرْب للطير، خَشْرَم للنحل، سحابة مجاز للكتلة الجوية؛ غياب إشارة الكائنات الحية يُوسِّع النطاق نحو الغبار والدخان"


step1_lemma_validation:
  per_lemma:

    - lemma: "حشد"
      decision: confirmed
      decision_reason: "دلالة الاجتماع والجماعة الكثيفة موثّقة في المعاجم الكلاسيكية والحديثة؛ تقييده بالناس في المصادر الكلاسيكية مُتجاوَز في الاستعمال المعاصر حيث يشمل الكتل الضخمة من الكائنات؛ بوابة الجودة: يستوفي المعايير الستة (فصيح شائع، يسير النطق، مشتقّ، تراثي، عربي خالص)"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركِّز على الكثافة العددية الهائلة والازدحام الشديد؛ أصله في الحشود البشرية ومنه امتد إلى سائر الكتل الضخمة؛ يُناسب الإنجليزية swarm للدلالة على الكتلة الكثيفة المُتراصّة"
      example: "حلّق حشدٌ من النوارس فوق الميناء يتنازع فُتَاتَ الصيد المُلقَى على الرصيف"

    - lemma: "سرب"
      decision: confirmed
      decision_reason: "المعنى المطابق (الفريق من الطير والحيوان) موثّق في المعاجم الكلاسيكية والحديثة وفي ArabTerm؛ الضبط الصحيح للجماعة هو السِّرْب بكسر السين؛ بوابة الجودة: يستوفي المعايير الستة"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "خاص بجماعة الطير والحيوان السائرة في انتظام وتناسق؛ يحمل معنى الحركة المنظّمة المشتركة؛ يُناسب الإنجليزية flock/cloud للدلالة على الجماعة الحيوانية المنظّمة في الهواء أو على الأرض"
      example: "مرّ سربٌ من القطا عبر سماء الصحراء يُقِلُّ في طيرانه حتى يبدو كسحابة داكنة في الأفق"

    - lemma: "سِرْب"
      source: step05
      decision: confirmed
      decision_reason: "يُطابق صرفياً اللمّة الموجودة (سرب) بعد التسوية — يُؤكِّد اللمّة القائمة ولا يُضاف مدخل جديد؛ يُصحِّح ضبط الشكل المكسور"
      step05_citation: "«مجموعة من الطيور تتغذى أو تنقل وتطير معاً» — مسرد المناخ والبيئة (ArabTerm)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "نفس اللمّة (سرب) بضبط صريح لكسر السين — يُؤكِّد الصحة الصرفية للشكل المكسور ويُفرِّقه من السَّرَب (المسلك) والسَّرْب (الإبل)"

    - lemma: "سحابة"
