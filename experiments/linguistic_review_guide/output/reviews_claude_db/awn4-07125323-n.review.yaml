step0_evidence:
  per_lemma:

    - lemma: "صوت"
      confirm:
        - text: "«مجموع الأمواج الصوتية المنتجة في الحنجرة بذبذبة الحبال الصوتية تحت ضغط الهواء الواقع أسفل الحنجرة»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«التصويت هو إرسال أصوات اللغة بواسطة مجموعة من الميكانيزمات الفيزيولوجية والفيزيو–عصبية، وأحد مراحله الأساسية هو إصدار النفس بحركة تنفسية خاصة بالنطق، وإنتاج الصوت باهتزاز الحبال الصوتية» (ترجمة: صَوت = voice)»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«صَوت» بوصفه ترجمة لمصطلح voice في المجال الطبي"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«جنس لكل ما وقر في أذن السامع»"
          source: "مقاييس اللغة"
          addition: "تعريف أشمل يضم أي صوت مسموع لا الصوت البشري الحنجري وحده — الجذر الأصلي أعمّ من المعنى التخصصي"
        - text: "«الصَّوْت: الجَرْسُ، معروف، مذكر»"
          source: "لسان العرب لابن منظور"
          addition: "الجرس العام يشمل صوت الحيوان والجماد، لا يقتصر على اهتزاز الأحبال الصوتية"
        - text: "«الأثر السمعىُّ الذى تُحْدِثُه تموُّجات ناشئة من اهتزاز جسم ما»"
          source: "المعجم الوسيط"
          addition: "أي جسم مهتز لا خصوص الأحبال الصوتية البشرية"
        - text: "«الرأى تبديه كتابة أو مشافهة فى موضوع يقرر أو شخص ينتخب. (محدثة)»"
          source: "المعجم الوسيط"
          addition: "الدلالة الانتخابية المحدثة — حقل دلالي مستقل تماماً لا صلة له بتعريف المجموعة"
      peripheral_observations:
        - "الصِّيت (الذِّكر الحسن في الناس) مشتق من نفس الجذر ص-و-ت — معنى مستقل لا صلة له بالتعريف الصوتي"

    - lemma: "لفظ"
      contradicts:
        - text: "«اللفظ: ما يتلفظ به الإنسان أو من في حكمه، مهملاً كان أو مستعملاً»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "لفظ = الوحدة اللغوية المنطوقة (كلمة/عبارة)، وهي نتيجة الفعل الكلامي لا الظاهرة الصوتية الفيزيائية لاهتزاز الأحبال الصوتية"
        - text: "«اللَّفْظُ: اللُّفاظ وما يلفظ به من الكلمات. ولا يقال: لَفْظُ اللهِ، بل كلمة الله»"
          source: "المعجم الوسيط"
          conflict: "لفظ = الكلمات والعبارات بوصفها وحدات لغوية — مفهوم لغوي/دلالي، لا حدث صوتي فيزيائي"
        - text: "«في اللغة: الرمي؛ وفي الاصطلاح: ما يتلفظ به الإنسان حقيقةً أو حكماً مهملاً كان أو موضوعاً مفرداً كان أو مركباً»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "التعريف الاصطلاحي لـ لفظ يجعله مرادفاً للكلام المركب/المفرد لا للصوت الحنجري الفيزيائي"
      expands:
        - text: "«(1) لَفْظ؛ نُطق؛ تعبير عن (2) غناء (3) التصويت؛ إرسال الأصوات» — مقابل vocalization"
          source: "المورد الحديث (2008)"
          addition: "المورد يُدرج لفظ ضمن مقابلات vocalization — هذا يُوسّع دلالة لفظ إلى الإجراء الصوتي، لكنه يعكس ترجمة حرة تشمل معنى الإخراج الصوتي إلى جانب المعنى اللغوي الأصلي"
        - text: "«النُّطق: اللَّفظ؛ إخراج الأصوات الكلاميّة» — مقابل phonation"
          source: "المورد الحديث (2008)"
          addition: "إسواء المورد بين لفظ ونطق كمقابل لـ phonation يمنح لفظ بُعداً صوتياً، لكنه يبقى في حقل الإخراج الكلامي (النطق) لا في حقل الفيزيولوجيا الصوتية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تصويت"
      source_section: "step5_english_bridge"
      evidence_citation: "«التصويت هو إرسال أصوات اللغة بواسطة مجموعة من الميكانيزمات الفيزيولوجية والفيزيو–عصبية، وأحد مراحله الأساسية هو إصدار النفس بحركة تنفسية خاصة بالنطق، وإنتاج الصوت باهتزاز الحبال الصوتية، ثم ضبطه بالنظر إلى الوحدات الصوتية» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "تصويت هو المقابل المعجمي المعتمد في المعاجم التخصصية العربية (الطبي واللساني) لمصطلحَي phonation و vocalization — مشتق اشتقاقاً قياسياً على وزن تفعيل (دال على العملية/الإجراء) من الجذر ص-و-ت؛ آلية التوليد: اشتقاق"
  knowledge_candidates:
    - lemma: "نطق"
      justification: "المورد الحديث يعطي phonation = «النُّطق: اللَّفظ؛ إخراج الأصوات الكلاميّة»؛ آلية التوليد: اشتقاق — مصدر من جذر ن-ط-ق؛ غير أن النطق أشمل من حدود التعريف لأنه يتضمن الوعي اللغوي والتعبير الإرادي لا مجرد الإنتاج الصوتي الحنجري"
  generation_notes: "الجذر الدلالي المحوري هو ص-و-ت؛ تصويت هو المصطلح الأكثر دقةً في ربط الفعل الفيزيولوجي (اهتزاز الأحبال الصوتية) بالمصطلح الإنجليزي phonation"

step1_lemma_validation:
  per_lemma:

    - lemma: "صوت"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من المعاجم التخصصية (ARABTERM الطبي واللساني) مع توسع دلالي طبيعي في المعاجم الكلاسيكية؛ المعجمية الحديثة تثبت استقرار المعنى التخصصي بوضوح؛ المصطلح أصيل عربياً قياسياً اشتقاقياً"
      evidence_assessment:
        case: "mixed"
        notes:
          - "المعاجم الكلاسيكية تعرّف صوت بأعم منه (أي صوت مسموع) بينما ARABTERM تؤكد المعنى المتخصص للصوت الحنجري البشري"
      substitution_test:
        result: "pass"
      nuance_differentiation: "صوت يدل على الأثر السمعي المنبعث (المخرَج/الظاهرة الصوتية) وهو الأشمل في الحقل — يتميز عن تصويت بأنه اسم للأثر لا لعملية الإنتاج؛ يتميز عن نطق بخلوه من الدلالة اللغوية الإرادية"
      example: "يُعدّ ارتفاع درجة الصوت وحدّته من أبرز المؤشرات السريرية على اضطرابات الحبال الصوتية."
      actions:
        - command: set_confidence
          params:
            entity_type: sense
            entity_id: "{auto}"
            score: 0.92

    - lemma: "لفظ"
      decision: removed
      decision_reason: "لفظ يدل على الوحدة اللغوية المنطوقة (الكلمة/العبارة) لا على الظاهرة الصوتية الفيزيائية لاهتزاز الأحبال الصوتية؛ فشل اختبار الإبدال فشلاً جذرياً؛ الإدراج على الأرجح نشأ عن ترجمة حرة لـ vocalization بمعنى الإخراج الكلامي لا بمعنى الفونيشن الفيزيولوجي"
      evidence_assessment:
        case: "contradicts"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "يُعاني المريض من اضطراب في إنتاج الصوت نتيجة خلل الأحبال الصوتية"
            substituted: "يُعاني المريض من اضطراب في إنتاج اللفظ نتيجة خلل الأحبال الصوتية"
            preserved_meaning: false
            why_failed: "لفظ في السياق الطبي يعني الكلمة المنطوقة لا الصوت الفيزيائي الحنجري — الجملة المبدَّلة تُغيّر المعنى من اضطراب صوتي إلى اضطراب كلامي/لغوي"
      nuance_differentiation: "لفظ يختص بالمستوى اللغوي (الوحدة اللفظية: ما يُقال)؛ الفارق عن صوت: لفظ = ما يُقال (الناتج اللغوي)، صوت = ما يُسمَع (الظاهرة الصوتية)؛ المجموعة تتحدث عن الآلية الفيزيائية لإنتاج الصوت (phonation) لا عن الكلام بوصفه نظاماً لغوياً"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تصويت"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تقني مستقر في المعاجم العلمية العربية (اللسانية والطبية) مقابلاً لـ phonation/vocalization؛ تعريفه في المعجم الموحد للسانيات يطابق تعريف المجموعة (اهتزاز الحبال الصوتية)؛ مشتق قياسي من ص-و-ت على وزن تفعيل الدال على العملية؛ يُسر التداول عالٍ؛ اشتقاقيٌّ منتج (تصويت/تصويتي/مُصوِّت)"
      step05_citation: "«التصويت هو إرسال أصوات اللغة... وإنتاج الصوت باهتزاز الحبال الصوتية» — المعجم الموحد لمصطلحات اللسانيات (2002)؛ «تصويت» = phonation = vocalization — المعجم الطبي الموحد (2009)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تصويت يدل على العملية الفيزيولوجية لإنتاج الصوت الكلامي (phonation as a process/action)؛ يتميز عن صوت بأن صوت يشير إلى الأثر/المخرَج بينما تصويت يشير إلى الفعل/الآلية (كالفرق بين نور وإنارة)"
      example: "درست الباحثة آليات التصويت الطبيعي مقارنةً بالتصويت المضطرب عند المصابين بشلل الحبل الصوتي."
      actions:
        - command: create_entry
          params:
            lemma: "تصويت"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07125323-n"

  added_lemmas:
    - lemma: "تصويت"
      reason: "مصدر: الخطوة ٠٫٥ — مصطلح تقني مستقر مقابل phonation/vocalization في المعاجم الطبية واللسانية العربية"
      via_command: create_entry + add_sense

