step3_definition:
  definition_review_flag: true
  current_definition: "حدث عجيب يظهر فعلاً خارقاً للطبيعة من قبل قوة إلهية"
  assessment:
    decision: revise
    reason: "ثلاث إشكاليات: (١) «حدث» بدلًا من «أمر» — الجنس القريب الكلامي المستقر في المصادر العربية هو «أمر» لأنه يشمل الفعل والترك معًا؛ (٢) «خارق للطبيعة» بدلًا من «خارق للعادة» — «خارق للعادة» هو المصطلح الكلامي العربي الموروث المستقر، ولـ«خارق للطبيعة» إيحاء فلسفي حديث مختلف؛ (٣) غياب معيار «عجز البشر عن مثيله» وهو جوهر التسمية"
  scope_note: "التعريفات الكلاسيكية أضيق تطبيقًا — تشترط ارتباطها بدعوى النبوة والتحدي وعدم المعارضة؛ تعريف AWN أعمّ ليشمل مفهوم المعجزة في السياقات الدينية المتعددة (الإسلام والمسيحية واليهودية)، وهذا التعميم صواب — التعريف المقترح يحافظ عليه"
  authored_definitions:
    - type: terminological
      text: "أمرٌ خارق للعادة يُظهره الله تأييدًا لدعوة دينية، مما يعجز البشر أن يأتوا بمثله"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "حادثة خارقة للعادة تنسب إلى قدرة إلهية ويعجز البشر عن محاكاتها"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
