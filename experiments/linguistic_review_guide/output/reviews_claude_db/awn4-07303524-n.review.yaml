step0_evidence:
  per_lemma:
    - lemma: "معجزة"
      confirm:
        - text: "«المُعْجِزَةُ: فعل من أَفعَال الله خارق للْعَادَة مقترنا بِدَعْوَى النُّبُوَّة مُوَافقا لدعواه عِنْد التحدي مَعَ عدم الْمُعَارضَة»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«المعجزة: أمر خارق للعادة يدعو إلى الخير والسعادة، مقرون بدعوى النبوة قصد به إظهار صدق من ادعى أنه رسول الله»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«المعجزة: أمر خارق للعادة، داعٍ إلى الخير والسعادة، مقرون بدعوى النبوة، قصد به إظهار صدق من ادعى أنه رسول من الله»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«(المعجزة) أَمر خارق للْعَادَة يظهره الله على يَد نَبِي تأييدا لنبوته وَمَا يعجز الْبشر أَن يَأْتُوا بِمثلِهِ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«أمرٌ خارق للعادة يُظهرهُ اللهُ على يد نبيّ تأييدًا لنبوَّتِهِ ما يعجز البشر أن يأتوا بمثله»"
          source: "المعجم الوسيط"
        - text: "«المعجزة: من الإعجاز وَهِي أَمر دَاع إِلَى الْخَيْر والسعادة يظْهر بِخِلَاف الْعَادة على يَد من يَدعِي النُّبُوَّة عِنْد تحدي المنكرين على وَجه يعجز المنكرين عَن الْإِتْيَان بِمثلِهِ»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«المُعْجِزة: أمرٌ خارقٌ للعادة داعيةٌ إلى الخير والسعادة مقرونةٌ بدعوى النبوة قصد به إظهارُ صدق من ادَّعى أنه رسولٌ من الله»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«المعجزة: اسم فاعل من الإعجاز وهي في الشرع أمر خارق للعادة من ترك أو فعل مقرون بالتحدّي مع عدم المعارضة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«المعجزة: أمر خارق للعادة...»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "جميع المصادر الكلاسيكية تستخدم «أمر» جنسًا قريبًا لا «حدث عجيب» — «أمر» يشمل الفعل والترك معًا كما صرّح التهانوي، أما «حدث» فيوحي بالوقوع الزمني فحسب"
        - text: "«أمر خارق للعادة من ترك أو فعل مقرون بالتحدّي مع عدم المعارضة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المصادر الكلاسيكية تستخدم «خارق للعادة» لا «خارق للطبيعة» — «خارق للعادة» هو المصطلح الكلامي الموروث المستقر، ولـ«خارق للطبيعة» إيحاء حديث مختلف لا يطابق المفهوم الكلامي الإسلامي"
      expands:
        - text: "«وَمَا يعجز الْبشر أَن يَأْتُوا بِمثلِهِ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "معيار «عجز البشر عن الإتيان بالمثيل» — فصل مميّز جوهري غائب عن تعريف AWN، وهو في حقيقته جوهر التسمية (مُعجِزة = المُعجِزة للمعارضين)"
        - text: "«أمر خارق للعادة يدعو إلى الخير والسعادة، مقرون بدعوى النبوة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "شرطا «دعوى النبوة» و«الدعوة إلى الخير والسعادة» — قيدان مميّزان للمعجزة عن السحر والكرامة، غائبان عن تعريف AWN الأعم"
        - text: "«أمر خارق للعادة من ترك أو فعل مقرون بالتحدّي مع عدم المعارضة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "المعجزة قد تكون تركًا (امتناعًا عن المعتاد) لا فعلًا فحسب — بُعد دلالي غائب عن تعريف AWN الذي يقصره على «فعل خارق»"
      peripheral_observations:
        - "الجسر الإنجليزي يكشف استخدام «معجزة» في سياق دنيوي مجازي: «معجزة اقتصادية» = economic miracle — دلالة توسعية خارج نطاق هذا السينست الديني"
        - "في التراث الكلامي الإسلامي تُفرَّق المعجزة عن «الكرامة» (خارقة الولي) و«الإرهاص» (إرهاص النبوة) — وهذه الفروق غائبة عن تعريف AWN مما قد يوهم بالاشتمال"
        - "ذُكرت «أعجوبة» في المورد الحديث مقترنةً بـ«معجزة» كترجمة لـmiracle — مشيرةً إلى إمكانية إضافتها للمجموعة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "أعجوبة"
      source_section: "step5_english_bridge"
      evidence_citation: "«مُعْجِزة؛ أعجوبة» — المورد الحديث (2008)"
      justification: "مصطلح عربي فصيح من جذر ع-ج-ب، استُخدم مقترنًا بـ«معجزة» كترجمتَين متكافئتين لـmiracle في معجم حديث معتمد؛ وزنه أُفعولة يدل على ما يثير الدهشة والاستغراب، ويمثّل الحدث الخارق من زاوية أثره الوجداني"
  knowledge_candidates:
    - lemma: "آية"
      justification: "آلية التوليد: مجاز (إزاحة دلالية) — «آية» في الاستعمال الديني الكلاسيكي والقرآني تُطلق على العلامة الخارقة الدالة على صدق النبوة (آيات موسى وعيسى)؛ وهي لفظ تراثي قرآني ذو مكانة في الحقل الدلالي، غير أنه بالغ التعدد الدلالي (آية قرآنية / علامة / معجزة) يستوجب الفحص الدقيق"
  generation_notes: "التعريف المقنّع يشير إلى «حدث عجيب + خارق للطبيعة + قوة إلهية»؛ الجذران الأساسيان في الحقل الدلالي هما ع-ج-ب (الدهشة) وع-ج-ز (الإعجاز)؛ «أعجوبة» من ع-ج-ب هو المرشح الأوفر حظًا من الأدلة، أما «آية» فلفظ تراثي مهم لكنه يحمل خطر الخلط مع الآية القرآنية"

step1_lemma_validation:
  per_lemma:
    - lemma: "معجزة"
      decision: confirmed
      decision_reason: "مصطلح كلامي راسخ موثّق في ثمانية مصادر كلاسيكية وحديثة، عربي الجذر والوزن (مُفعِلة من أعجَز)، الملاءمة الصرفية ممتازة — الوزن يُفصح عن المعنى (المُعجِزة = المُعجِزة للمعارضين عن المثيل)، جميع معايير الجودة الستة مستوفاة"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللمّة الأصل والأعلى تخصيصًا في الإطار الكلامي الإسلامي؛ تركّز على جانب الإعجاز أي عجز المعارضين عن الإتيان بالمثيل؛ تتميز عن «أعجوبة» بأنها مصطلح علم الكلام المشروط المشروط بالنبوة والتحدي وعدم المعارضة، وبأنها مقيّدة بالمصدر الإلهي المباشر لا بمجرد الدهشة"
      example: "أثبت موسى عليه السلام صدقَ رسالته بمعجزة العصا التي انقلبت ثعبانًا وابتلعت سحر السحرة، فآمنوا عن بكرة أبيهم"

    - lemma: "أعجوبة"
      source: step05
      decision: confirmed
      decision_reason: "لفظ عربي فصيح موثّق في المورد الحديث كمرادف لـ«معجزة»، جذره ع-ج-ب أصيل، وزنه (أُفعولة) مناسب لما يثير الاستغراب والدهشة، اجتاز اختبار الإبدال في السياقات الدينية، الاشتقاقية جيدة (عجب، أعاجيب، عجيب، إعجاب)"
      step05_citation: "«مُعْجِزة؛ أعجوبة» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركّز على الأثر الوجداني للحدث الخارق (إثارة الدهشة والاستغراب من جذر ع-ج-ب)؛ أوسع استعمالًا قليلًا من «معجزة» إذ تُستخدم أحيانًا لغير الديني من العجائب، لكنها في السياق الديني والتراثي مرادفة مقبولة ومستخدمة"
      example: "رأى الحاضرون في شفائه الفجائي التامّ من مرض الموت أعجوبةً من أعاجيب القدرة الإلهية لا يملك لها الطبّ تفسيرًا"
      actions:
