          params:
            lemma: "أعجوبة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07303524-n"

    - lemma: "آية"
      source: step05
      decision: removed
      decision_reason: "تعدد دلالي حاد يُفسد الملاءمة: الاستخدام الأغلب لـ«آية» في الوعي اللغوي العربي هو «جزء من القرآن الكريم»، وإدراجها في سينست المعجزة سيُنشئ ضوضاء دلالية تُخلط بينها وبين الآية القرآنية في معالجة النصوص؛ فضلًا عن أن «آية» علامة/دليل لا حدث خارق بالضرورة — اختبار السكّ المصطلحي يشير إلى احتياجها لقيد سياقي («آية نبوية») لتؤدي المعنى المطلوب"
      step05_citation: "«الآية: العلامة الظاهرة» — التوقيف على مهمات التعاريف للمناوي"

