step0_evidence:
  per_lemma:

    - lemma: "عامل"
      confirm:
        - text: "«الباعث أو المؤثر في الشيء، يُقال: كثرة الإنتاج من عوامل الرخاء»"
          source: "المعجم الوسيط"
        - text: "«أيّ عنصر أو كائن أو قوة فعالة ينتج عنها تأثير أو تغيير ما»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«ما يحدث تأثيراً في غيره حياً أو جماداً»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«عنصر أو مؤثر يساهم في إنتاج أو ظهور النتائج»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      contradicts:
        - text: "«العامل: ما يوجب كون آخر الكلمة على وجه مخصوص من الإعراب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى النحوي (التأثير في الإعراب) مختلف تماماً عن المعنى الفلسفي/العلمي للسبب الفاعل المُحدِث للتأثير"
        - text: "«مَن يعمل في مهنة أو صنعة»"
          source: "المعجم الوسيط"
          conflict: "المعنى الوظيفي (الشخص في مهنة) ينقض تعريف المجموعة الذي يُشير إلى السبب الفاعل لا إلى صاحب المهنة"
      expands:
        - text: "«(في الحساب): العدد الصحيح الذي يقسم عدداً صحيحاً آخر بدون باق»"
          source: "المعجم الوسيط"
          addition: "معنى factor الرياضي (التقسيم لا التأثير السببي) — بُعد مستقل تماماً عن تعريف المجموعة"

    - lemma: "فاعل"
      confirm:
        - text: "«الفَاعِل: مَا يكون فِي الشَّيْء مؤثرا»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الفاعل المختار: هو الذي يصح أن يصدر عنه الفعل مع قصد وإرادة»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«الفَاعِلُ: مَا كَانَ الْمسند إِلَيْهِ من فعل أَو شبهه مقدما عَلَيْهِ أبدا»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المعنى النحوي (المسند إليه في الجملة) هو الغالب في معظم المعاجم وهو مختلف عن المعنى الفلسفي للعامل المؤثر السببي"
        - text: "«(الْفَاعِل) الْعَامِل والقادر والنجار وَمن يسْتَأجر لأعمال الْبناء والحفر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعنى الوظيفي (النجار وعامل البناء) ينقض المعنى الفلسفي المقصود"
      expands:
        - text: "«الفاعل المختار: هو الذي يصح أن يصدر عنه الفعل مع قصد وإرادة»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يُضيف بُعد الإرادة والقصد غير الموجود صراحةً في تعريف المجموعة — التعريف لا يشترط إرادة في الفاعل"

    - lemma: "مُسَبِّب"
      confirm:
        - text: "«مُسَبِّب: causative»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُسَبِّب: etiogenic (causative)»"
          source: "المعجم الطبي الموحد (2009)"
      peripheral_observations:
        - "لا تعريف نصي لغوي أو كلاسيكي للكلمة — الأدلة مقتصرة على مصطلحات طبية حديثة"
        - "الكلمة اسم فاعل من سبَّب الثلاثي المزيد — معناها الصرفي 'الذي يُسبِّب' مطابق تماماً للتعريف وإن كانت المعاجم الكلاسيكية لم تُفردها بمدخل مستقل"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُؤَثِّر"
      source_section: step5_english_bridge
      evidence_citation: "«فاعِل، عامِل، مؤَثِّر — agent» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
      justification: "ورد 'مُؤَثِّر' في ARABTERM مُدرجاً ضمن المقابلات العربية لـ agent، وفي تعريف المعجم الوسيط لـ'عامل' اقترن 'الباعث أو المؤثر في الشيء' مما يجعله مرشحاً مدعوماً بالأدلة"
    - lemma: "عِلَّة"
      source_section: step5_english_bridge
      evidence_citation: "«علّة: cause» — مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
      justification: "في الفلسفة الأرسطية العربية، التعريف 'سبب نشط فعال' يوافق مفهوم العلة الفاعلية (Efficient Cause)؛ وردت 'علة' في مسرد الفلسفة مقابلاً لـ cause"
  knowledge_candidates:
    - lemma: "بَاعِث"
      justification: "اشتقاق على وزن فاعل من ب-ع-ث، يعني الذي يُثير ويُحرك ويُفضي إلى النتيجة؛ ورد في المعجم الوسيط ضمن تعريف 'عامل' («الباعث أو المؤثر في الشيء»)، مما يجعله مرادفاً سياقياً مباشراً — آلية: اشتقاق"
    - lemma: "مُحَرِّك"
      justification: "اشتقاق على وزن مُفعِّل من ح-ر-ك، يعني الذي يُحرك ويُفضي إلى الفعل؛ مصطلح فلسفي عربي كلاسيكي راسخ (المحرك الأول = Prime Mover عند الفلاسفة المسلمين) يؤدي معنى الفاعلية السببية — آلية: اشتقاق + تراث"
  generation_notes: "التعريف يُحيل إلى مفهوم الـ'agent' الفلسفي (الفاعلية السببية) لا إلى الوكيل التجاري ولا العامل الوظيفي؛ الجذور الدلالية المنتجة: ع-م-ل، ف-ع-ل، س-ب-ب، أ-ث-ر، ب-ع-ث"


step1_lemma_validation:
  per_lemma:

    - lemma: "عامل"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة متعددة من معاجم تقنية وطبية وعامة تُثبت استخدام 'عامل' بمعنى الباعث/المؤثر السببي"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "أعمّ اللمّات الثلاث وأشيعها — يُستخدم في السياقات العلمية والتقنية لكل ما يُحدث تأثيراً سواء أكان كياناً مادياً أم قوةً أم حدثاً؛ لا يشترط الإرادة أو القصد. ويتميز بقابليته للوصف بالأنواع: عامل كيميائي، عامل بيولوجي، عامل اقتصادي"
      example: "يُعدّ الفيروسُ عاملاً مُمرِضاً قادراً على إحداث تغييرات جذرية في الخلية الحية"

    - lemma: "فاعل"
      decision: confirmed
      decision_reason: "المعنى الفلسفي 'ما يكون في الشيء مؤثراً' موثَّق في معجمين كلاسيكيين؛ الاشتراك اللفظي مع المصطلح النحوي محدود السياق"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يُركز على الفاعلية الذاتية والإرادية (الفاعل المختار عند الجرجاني)؛ يصلح في السياقات الفلسفية وعلم الكلام حيث الفاعلية مرتبطة بالقدرة والإرادة. يتميز عن 'عامل' بتضمّنه دلالة القصد والاختيار، وعن 'مُسَبِّب' بدلالته على الفاعلية الشاملة لا السببية المباشرة فقط"
      example: "الإرادةُ فاعلٌ حقيقي في الوجود يصدر عنها الفعل بقصد واختيار وفق الفلسفة الإسلامية الكلاسيكية"

    - lemma: "مُسَبِّب"
      decision: confirmed
      decision_reason: "صحيح صرفياً ودلالياً — اسم فاعل من سبَّب يعني بطبيعته الاشتقاقية 'الذي يُسبِّب'؛ موثَّق في المصطلح الطبي الحديث بمعنى causative"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "يُركز على الجانب السببي الخالص — الذي يُفضي مباشرةً إلى نتيجة بعينها؛ يتميز عن 'عامل' بتخصيصه في علاقة السببية المباشرة، وعن 'فاعل' بغياب اشتراط الإرادة والقصد. يُستخدم غالباً في الحقل الطبي والعلمي (مُسَبِّب المرض، مُسَبِّب الحادثة)"
      example: "حُدِّد الدخانُ مُسَبِّباً رئيسياً للأمراض الرئوية في نتائج التقرير الطبي السنوي"

    # ── مرشحات الخطوة 0.5 ──

    - lemma: "مُؤَثِّر"
      source: step05
      decision: removed
      decision_reason: "دلالته على التأثير عامة وليس على الفاعلية السببية تحديداً؛ يُستخدم في المعاجم التقنية مقابلاً لـ operator وinfluential لا لـ agent الفلسفي. فشل اختبار الإبدال: 'المُؤَثِّر الكيميائي' لا يُعادل 'العامل الكيميائي' في الاستخدام الفعلي"
      step05_citation: "«فاعِل، عامِل، مؤَثِّر — agent» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
      substitution_test:
        result: fail
      nuance_differentiation: "يُغطي حقلاً دلالياً أوسع (التأثير العام) وقد يُلتبس بـ operator في الحوسبة"

    - lemma: "عِلَّة"
      source: step05
      decision: removed
      decision_reason: "علة = cause عموماً في المصطلح الفلسفي العربي (شاملة العلة المادية والصورية والغائية والفاعلية)؛ أعمّ بكثير من 'agent' الذي يُقابل العلة الفاعلية تحديداً. لا تُستبدل باللمّات الموجودة: 'علة الحادثة' ≠ 'عامل الحادثة' في الاستخدام التقني"
      step05_citation: "«علّة: cause» — مسرد الفلسفة وعلم النفس"
      substitution_test:
        result: fail
      nuance_differentiation: "أعمّ من المقصود — تشمل جميع أنواع العلل الأرسطية لا العلة الفاعلية وحدها"

    - lemma: "بَاعِث"
      source: step05
      decision: removed
      decision_reason: "يُركز على الجانب الإرادي-النفسي (الدافع والمحرك) ويُستخدم أكثر في السياق الإنساني؛ لا يُستبدل بـ'عامل' في السياق العلمي/التقني: 'باعث كيميائي' غير مقبول"
      step05_citation: "معنى مستنتج من: «الباعث أو المؤثر في الشيء» — المعجم الوسيط (في تعريف 'عامل')"
      substitution_test:
        result: fail
      nuance_differentiation: "مخصوص بالسياق الإرادي (بواعث الفعل البشري) ولا يصلح بديلاً في السياق السببي التقني"

    - lemma: "مُحَرِّك"
      source: step05
      decision: removed
      decision_reason: "مصطلح فلسفي مخصوص (المحرك الأول = Prime Mover) ذو سياق ميتافيزيقي ضيق؛ 'المحرك الكيميائي' غير مقبول. لا يصلح بديلاً عاماً لـ agent"
      step05_citation: "مستنتج من المعرفة اللغوية — المصطلح الفلسفي الأرسطي"
      substitution_test:
        result: fail
      nuance_differentiation: "دلالته مقيدة بالفلسفة الميتافيزيقية ولا تتسع لتغطية المعنى العلمي/التقني لـ agent"


step3_definition:
  definition_review_flag: false
  current_definition: "سبب نشط وفعال؛ قادر على إحداث تأثير معين"
  assessment:
    decision: retain
    reason: "التعريف يُغطي المعنى الفلسفي/العلمي للـ agent (السبب الفاعل النشط) بصورة وافية؛ ثنائية 'نشط وفعال' تُعادل active and efficient في المصطلح الفلسفي"
  scope_note: "التعريف الكلاسيكي أوسع — في الفلسفة الأرسطية العربية 'العلة الفاعلية' تشمل أيضاً البُعد الإرادي (الفاعل المختار) الذي لا يظهر في التعريف الحالي"


