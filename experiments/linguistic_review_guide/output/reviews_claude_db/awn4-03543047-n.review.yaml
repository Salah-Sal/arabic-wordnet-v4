step0_evidence:
  per_lemma:
    - lemma: "شيء مرعب"
      confirm:
        - text: "«(1) رُعْب؛ اشمئزاز شديد. (2) شيء مرعب» — ترجمة مدخل horror"
          source: "المورد الحديث (2008)"
      peripheral_observations:
        - "لم يرد «شيء مرعب» مدخلاً مستقلاً بمعجم عربي؛ ظهر فقط كبديل ترجمي في قاموس ثنائي اللغة — شاهد على الدلالة لا على التثبيت المعجمي"

    - lemma: "فظاعة"
      confirm:
        - text: "«atrocity: وحشيّة؛ شناعة؛ فظاعة؛ رداءة بالغة»"
          source: "المورد الحديث (2008)"
        - text: "«فَظُعَ الأمرُ بالضمِّ فَظاعَةً فهو فَظيعٌ، أي شديدٌ شنيعٌ جاوز المقدار»"
          source: "تاج اللغة وصِحاح العربية للجوهري (ت. 1003م)"
      expands:
        - text: "«فَظُعَ الأمر يَفْظُعُ فَظاعةً. وأمرٌ فظيع، أي: عظيم. وأفظعني هذا الأمرُ: تعاظمني، ومنه: فُظِعْتُ به وفَظِعْتُ به، أي ضِقتُ به ذَرْعاً»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي (ت. 786م)"
          addition: "دلالة العِظَم المطلق (عظيم) وانسحاق النفس (ضاق به ذرعاً) — الفظيع قد يكون عظيماً مُرهِقاً بلا اشتراط القُبح الأخلاقي"
        - text: "«ما أفظع هذا الخطب، وقد فظع فظاعة. أفظعته واستفظعته: وجدته فظيعاً»"
          source: "أساس البلاغة للزمخشري (ت. 1143م)"
          addition: "صيغة الاستفعال (استفظع) تُضيف بُعد الاستشعار الذاتي بالفظاعة — المشاعر الذاتية تجاه الأمر الفظيع وليس الأمر الفظيع ذاته"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "هول"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الهول: الأمر الفظيع يهول أي يفزع» — التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
      justification: "الهول هو بعينه «الأمر الفظيع المُخيف» — مطابق مباشر لمحور «يثير الرعب» في التعريف؛ اسم جنس عربي أصيل يناسب المعنى الاسمي وجمعه «أهوال» شائع للدلالة على الأهوال والمخاوف المحددة"
    - lemma: "شناعة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الشَّناعَةُ: الفَظاعَةُ» — المعجم الكبير؛ «الشناعة: قبح الشيء» — مجمل اللغة"
      justification: "مرادف مباشر للفظاعة ويغطي محور الاشمئزاز (استشنعه = رآه قبيحاً مثيراً للكراهية)؛ مصدر من شَنُعَ على وزن فَعَالة"
  knowledge_candidates:
    - lemma: "بشاعة"
      justification: "اشتقاق من ب-ش-ع على وزن فَعَالة — آلية: اشتقاق. البشاعة هي قُبح المنظر الصادم المُثير للاشمئزاز؛ يغطي مكوّن «يثير الاشمئزاز» بشكل مباشر وأدق من فظاعة من حيث الارتباط بالمنظر الحسي الصادم"
  generation_notes: "التعريف يجمع محورين: إثارة الرعب (terror) وإثارة الاشمئزاز (disgust). «هول» أقرب للمحور الأول و«شناعة/بشاعة» أقرب للثاني. الأمثل هو «هول» لكونه ينصب مباشرة على المفهوم الجامع (الأمر الفظيع المُخيف) بمصطلح مفرد مُتثبَّت في المعاجم الكلاسيكية."

step1_lemma_validation:
  per_lemma:
    - lemma: "شيء مرعب"
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبار السكّ المصطلحي والتثبيت المعجمي — لا يرد مدخلاً مستقلاً في أي معجم عربي؛ «مرعب» قابل للإبدال بأي صفة مرادفة (مخيف، مروّع، هائل، فظيع) مع بقاء التعبير وصفاً حراً صالحاً دون أي تحوّل في المعنى؛ علاوة على ذلك هو ترجمة حرفية عمياء لـ «something horrible» — نقل حرفي للهيكل الإنجليزي (شيء + صفة) دون أصالة عربية؛ الكلمة «شيء» تفتقر إلى الاشتقاقية ولا تنتج عائلة معجمية"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: "لا ظلّ دلالي مستقل — التعبير قابل لاستبدال صفته بعشرات الصفات دون أثر دلالي مميّز؛ مجرد وصف مُركَّب عرضي لا وحدة معجمية مسكوكة"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فظاعة"
      decision: confirmed
      decision_reason: "مصدر عربي أصيل مستقر في المعاجم الكلاسيكية والحديثة من الجذر ف-ظ-ع؛ يُستعمل اسماً لـ«الأمر أو الفعل الشنيع البالغ الحدَّ» وصيغته الجمعية (فظائع) راسخة للدلالة على أعمال فظيعة محددة؛ وزن فَعَالة مناسب للدلالة على الخاصية الجوهرية مع قابليتها للتحوّل إلى اسم للحدث المحدد (فظاعة = atrocity)"
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز عن «هول» بتركيزه على الجانب الأخلاقي-الجمالي (الشناعة والفُحش والتجاوز) دون اشتراط إثارة الخوف تحديداً — يغطي مكوّن «يثير الاشمئزاز» من التعريف بشكل أخص؛ يُفيد في الغالب في دلالة الجرائم والأعمال الوحشية (فظائع الحرب)"
      example: "كشف المحققون الدوليون عن فظائع بشعة ارتُكبت في حق المدنيين العُزَّل خلال الحرب."
      actions: []

    - lemma: "هول"
      source: step05
      decision: confirmed
      decision_reason: "اسم عربي أصيل مستقر في المعاجم من القاموس المحيط إلى المعجم الوسيط؛ يدل مباشرة على «الأمر الفظيع المُخيف» وهو مطابق تام لمحور «يثير الرعب» في تعريف المجموعة؛ وزن فَعْل مناسب للأسماء الجوهرية المجردة؛ يمتاز بالاشتقاقية (هال، هائل، مهوِّل، تهويل) وبالانتشار في الفصحى المعاصرة"
      step05_citation: "«الهول: الأمر الفظيع يهول أي يفزع» — التوقيف على مهمات التعاريف للمناوي (ت. 1622م); «الْهَوْلُ: الفزع المخيف المفزع الأمر الشديد» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز عن «فظاعة» بتركيزه على إثارة الخوف والرعب الوجداني دون اشتراط الشناعة الأخلاقية — الهول يشمل المخيفات الطبيعية (هَوْل البحر، هَوْل الليل) وليس فقط الأعمال الإجرامية؛ يغطي مكوّن «يثير الرعب» من التعريف بشكل أدق"
      example: "أصاب الناجين هولٌ لا يُوصف حين اجتازوا ما خلّفته الكارثة من دمار شامل."
      actions:
        - command: create_entry
          params:
            lemma: "هول"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03543047-n"

    - lemma: "شناعة"
      source: step05
      decision: removed
      decision_reason: "مترادف شبه تام لـ«فظاعة» المؤكدة (الشناعة = الفظاعة في المعاجم) — إضافته تُكرِّر دلالةً موجودة بلا ظلّ دلالي مستقل مضاف؛ كلاهما يعاني الميل نحو التجريد (الجودة لا الحدث)"
      step05_citation: "«الشَّناعَةُ: الفَظاعَةُ» — المعجم الكبير؛ «الشناعة: قبح الشيء» — مجمل اللغة"

    - lemma: "بشاعة"
      source: step05
      decision: removed
      decision_reason: "البشاعة تختص بقُبح المنظر الحسي (قبح الوجه والشكل) وهي أخص من مفهوم المجموعة الذي يشمل أي شيء فظيع بصرف النظر عن مظهره؛ فشل اختبار الإبدال في سياقات غير بصرية (فظائع الحرب ≠ بشاعات الحرب)"
      step05_citation: "معرفة لغوية داخلية — جذر ب-ش-ع"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "هول"
      reason: "مصدر: الخطوة ٠٫٥ — الأمر الفظيع المُخيف يطابق مكوّن «يثير الرعب» في تعريف المجموعة ويُكمِل «فظاعة» التي تغطي مكوّن الاشمئزاز"
      via_command: create_entry + add_sense

