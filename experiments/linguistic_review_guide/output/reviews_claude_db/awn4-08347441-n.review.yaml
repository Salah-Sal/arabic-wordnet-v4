      justification: "المورد الحديث يُعرّف «circuit» في معناه القضائي بوصف يتمحور حول الرقعة الجغرافية التي تشملها جولة القاضي؛ ولفظ «دائرة» (من دار–يدور) هو المقابل العربي المقترح باعتباره اسم فاعل من الجذر د-و-ر يلتقط بُعد الجولة الدورية"
  knowledge_candidates:
    - lemma: "منطقة قضائية"
      justification: "تركيب وصفي (اسم + نعت نسبي) يُعبّر عن النطاق الإقليمي للاختصاص القضائي؛ آلية التوليد: تركيب وصفي. «منطقة» من ن-ط-ق بمعنى الرقعة الجغرافية المحدودة، و«قضائية» نسبة إلى القضاء. مستعمل في بعض النصوص القانونية العربية للإشارة إلى الإطار الإقليمي للمحكمة"
  generation_notes: "الجسر الإنجليزي أشار في أغلبه إلى دارة/دائرة في حقل الكهرباء والفيزياء؛ المورد الحديث هو المصدر الوحيد الذي وثّق المعنى القضائي مباشرةً. لم يرد في قاعدة البيانات أي مدخل قانوني مباشر لمفهوم «الدائرة القضائية» كوحدة معجمية مستقلة"

step1_lemma_validation:
  per_lemma:
    - lemma: "دائرة قضائية"
      decision: confirmed
      decision_reason: "تعبير مركب وصفي ثابت في الاستعمال القانوني العربي، يمثّل الترجمة المعيارية لـ«judicial circuit»؛ تركيبه طبيعي (اسم فاعل + نعت نسبي)، ويتجاوز اختبار السكّ واختبار التثبيت المعجمي. فحص الاقتراض: لفظان عربيان خالصان؛ ليس ترجمةً حرفيةً عمياء بل استعارةٌ مفهومية واعية (calque) تُلائم البنية العربية — «دائرة» تلتقط بُعد الدوران الجغرافي للقضاة. بوابة الجودة: مطّرد فصيح، يسير النطق، ملائم للمفهوم، مشتق من تراث عربي أصيل (دائرة = ما يُحيط)، قابل للصرف (دوائر قضائية، دائرة قضائية واحدة). الوزن الصرفي: «دائرة» اسم فاعل من دار–يدور يوحي بالإحاطة والاشتمال، وهو ملائم لوحدة قضائية تحيط بنطاق جغرافي محدد"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
        mwe_type: "وصفي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللمّة الوحيدة في المجموعة — تتمايز عن المُشتمِل (مجموعة / تَجَمُّع) بدلالتها على قسمٍ إداريٍّ قضائيٍّ رسميٍّ تحدّه حدود جغرافية وله محكمة استئناف مختصة، لا على مجرد تجمّع كيانات. وتتمايز عن «منطقة قضائية» (المرشح المرفوض) بكون «دائرة» أثبت تعريفاً في المعاجم الحديثة للتقسيم الإداري القضائي، ولا سيما الدائرة الانتخابية كنظيرة تركيبية"
      example: "تشرف دائرةٌ قضائيةٌ فيدراليةٌ واحدة على القضايا المرفوعة من ولاياتٍ عدة في جنوب الولايات المتحدة، وتمثّل الجهةَ الاستئنافية العليا في نطاقها الإقليمي"

