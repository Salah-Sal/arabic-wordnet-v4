      text: "قسمٌ قضائيٌّ إقليميٌّ تختصُّ بالنظر في قضاياه محكمةُ استئنافٍ بعينها؛ وفي القانون الأمريكي: واحدةٌ من الدوائر القضائية الاثنتي عشرة التي تختصُّ بها محاكم الاستئناف الفيدرالية"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: encyclopedic
      text: "في المنظومة القضائية الأمريكية، تنقسم الولايات المتحدة إلى اثنتي عشرة دائرةً قضائية فيدرالية، تختصُّ بكلٍّ منها محكمةُ استئناف فيدرالية للنظر في الطعون على أحكام المحاكم الابتدائية داخل نطاقها الجغرافي. تسمّت بـ«الدائرة» لأن القضاة كانوا في الأصل يتنقّلون دورياً بين مدن الولايات ليعقدوا جلسات القضاء فيها"
      quality_check:
