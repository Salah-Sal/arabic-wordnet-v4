step3_definition:
  definition_review_flag: true
  current_definition: "(في القانون) قسم قضائي في دولة أو في الولايات المتحدة؛ واحدة من اثنتي عشرة مجموعة من الولايات في الولايات المتحدة تغطيها محكمة استئناف معينة"
  assessment:
    decision: revise
    reason: "يبدأ التعريف بقوسين (في القانون) وهو أسلوب دلالة مجال غير معجمي ينبغي استيعابه في متن التعريف؛ الجملة الثانية مقيّدة بالسياق الأمريكي والعدد الثابت دون صياغة عامة قابلة للتعميم؛ يفتقر إلى بنية الجنس القريب + الفصل النوعي بصيغة معجمية عربية صريحة"
  authored_definitions:
