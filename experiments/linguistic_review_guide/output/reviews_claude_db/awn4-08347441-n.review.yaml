step0_evidence:
  per_lemma:
    - lemma: "دائرة قضائية"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "«(3) «أ» جولة دورية [يقوم بها قاضٍ أو مبشِّر]. «ب» القائمون بهذه الجولة. «ج» الطريق التي يسلكونها أو المَواطن التي يزورونها أو المنطقة التي تشملها جولتهم» — المورد الحديث (2008) [جسر إنجليزي: circuit → يوثّق المعنى القضائي لكلمة «دائرة» عبر ترجمة اصطلاحية مفصّلة]"
        - "«الدَّائِرَةُ الانتِخَابِيَّةُ: قِسمٌ مِنَ المدينة, أو مَجْموعةٌ مِنَ القُرى, تَنْتَخِبُ عنها نائبًا يمثِّلها فى المجْلِس النيابىِّ» — المعجم الكبير [يُثبت أن نمط «دائرة + نعت نسبي» وحدةٌ معجمية منتجة في العربية للتعبير عن الوحدة الإدارية؛ الدائرة الانتخابية نظيرةٌ للدائرة القضائية في البنية التركيبية]"
        - "«(الدائرة الانتخابية) قسم من الْمَدِينَة أَو مَجْمُوعَة من الْقرى تنتخب عَنْهَا نَائِبا فِي الْمجْلس النيابي (مج)» — المعجم الوسيط [تثبيت معجمي إضافي لنمط «دائرة + نعت» بمعنى الوحدة الإدارية]"

step05_lemma_generation:
