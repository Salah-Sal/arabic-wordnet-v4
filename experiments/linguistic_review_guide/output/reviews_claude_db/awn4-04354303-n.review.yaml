step05_lemma_generation:
  evidence_candidates:
    - lemma: "مضمون"
      source_section: "step5_english_bridge"
      evidence_citation: "«مضمون: Content — هو الجانب المجدي في الخطاب، وهو موضوعه ومظهره التصوري» — المعجم الموحد لمصطلحات اللسانيات (ARABTERM)"
      justification: "مصطلح لساني يشير إلى ما يحمله الخطاب من دلالة — قد يمتد مجازاً إلى ما يحمله العمل البصري من موضوع مصوَّر. آلية التوليد: اشتقاق من جذر ض-م-ن على وزن مَفْعُول"
  knowledge_candidates:
    - lemma: "نموذج"
      justification: "في لغة الفنون البصرية، النموذج هو الشخص أو الشيء الذي يختاره الفنان ليجعله موضوع عمله التصويري — مستعمَل في مسرد الفن (ARABTERM: نموذج = model/form). آلية التوليد: لفظ مُعرَّب مُندمج في العربية الحديثة"
  generation_notes: "التعريف يصف الموضوع الفني البصري بوضوح (فنان، مصوِّر، تمثيل رسومي) — مركز الحقل الدلالي: ما يختاره الفنان ليصوِّره. أكثر المرشحات طبيعيةً في النقد الفني العربي هي مضمون ونموذج، غير أن كليهما مقيَّد في نطاقه"

step1_lemma_validation:
  per_lemma:

    - lemma: "غرض مصور"
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك ولا موثَّق في أي معجم أو مسرد فني — يفشل اختبار السكّ (يمكن إبداله بـ«موضوع مصور» أو «شيء مصور» دون فقدان الدلالة) ويفشل اختبار التثبيت المعجمي. فضلاً عن ذلك، كلمة «غرض» تعني في حقل الفنون الرسومية «هدف/غاية الفنان» لا «الجسم المادي الذي يصوِّره»، مما يجعلها ترجمةً حرفيةً عمياء لـ«object» بالمعنى البلاغي/الرسالي بدلاً من المعنى المادي/الحسي المطلوب. يوفر «موضوع» المؤكَّد نفس الدلالة بدقة أكبر وشيوع فصيح أوسع."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: "لا فارق دلالي يبرر إبقاءه — «موضوع» يغطي دلالته كاملاً بلا التباس"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "محتوى"
      decision: escalated
      decision_reason: "أدلة متناقضة: المعاجم الكلاسيكية (الوسيط، الكبير) تثبت معنىً بعيداً كلياً (بيوت القوم من الوبر)، ولا يوجد سند معجمي صريح للمعنى الفني. التقنيات الحديثة (ARABTERM) تؤيد «محتوى» بمعنى المضمون الكمي أو التعليمي لا بمعنى الموضوع الفني المختار للتصوير. اختبار الإبدال يكشف عدم الطبيعية: «اختار الفنان محتوى لوحته» يبدو غير مألوف في الخطاب الفني العربي الراهن مقارنةً بـ«اختار موضوع لوحته». يستوجب الأمر مراجعة بشرية لتقدير مدى قبول التطور الدلالي الحديث لـ«محتوى» في سياق المحتوى البصري الرقمي."
      evidence_assessment:
        case: "contradicts"
      nuance_differentiation: "يتميز عن «موضوع» بالتركيز على ما تحويه الصورة من عناصر مجتمعةً دون إبراز معنى القصدية والاختيار الواعي — «موضوع» أدق للتعبير عن ما يختاره الفنان عمداً ويضعه في مركز عمله"

    - lemma: "موضوع"
      decision: confirmed
      decision_reason: "أدلة مؤكَّدة متعددة: المعجم الوسيط يُثبت معنى «المادة التي يبني عليها الكاتب كلامه»، والمناوي يُثبت «محل العرض المختص به»، ومسرد الفن (ARABTERM) يُثبت «subject» مباشرةً في المجال الفني. اختبار الإبدال ناجح (اختار الرسامُ موضوعاً من مشاهد الريف). جميع معايير بوابة الجودة مستوفاة: شائع فصيح عند المتخصصين، يسير النطق، ملائم للمفهوم بدقة، عربي أصيل من جذر و-ض-ع، يسمح بالاشتقاق (موضوعي، موضوعية، مواضيع). الوزن الصرفي (مَفْعُول = اسم مفعول) ملائم دلالياً: الموضوع هو ما «وُضع» أي ما أختِير وجُعل مدار العمل الفني."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز بتضمّن معنى القصدية والاختيار الواعي — الفنان «يضع» الموضوع في مركز عمله (من الجذر و-ض-ع)، وهذا يتطابق مع التعريف الذي يشترط الاختيار. يشمل الأشخاص والكائنات والمشاهد دون تضييق."
      example: "صرَّح المصوِّر في حواره الصحفي أن الأطفالَ في الأحياء الشعبية كانوا دائماً موضوعَه المفضَّل، يجد فيهم صدقَ التعبير الذي يعجز عن محاكاته في الاستوديو."

    - lemma: "مضمون"
      source: step05
      decision: removed
      decision_reason: "مصطلح لساني/سيميائي متخصص — يعبّر عن المضمون الدلالي للخطاب في مقابل الشكل (المستوى السيميائي عند دوسوسير: المضمون ضد التعبير). هذا المعنى غير المعنى المطلوب وهو الشيء/الشخص/المشهد المادي المختار للتصوير. فشل اختبار الإبدال: «اختارت المصورة مضمون صورتها من السواق الشعبية» — غير طبيعي إذ يوحي بالمعنى الفكري/الرمزي لا بالموضوع المادي. فشل اختبار السك في السياق الفني البصري."
      step05_citation: "«مضمون: Content — هو الجانب المجدي في الخطاب، وهو موضوعه ومظهره التصوري» — المعجم الموحد لمصطلحات اللسانيات (ARABTERM)"
      nuance_differentiation: "يعبّر عن المضمون الدلالي والفكري للعمل لا عن الموضوع المادي المحسوس المختار للتصوير"

    - lemma: "نموذج"
      source: step05
      decision: removed
      decision_reason: "في الفنون البصرية، النموذج يخص الشخص الذي يجلس أمام الفنان ليُرسم (model) — ضيّق جداً لأنه لا يشمل المشاهد والكائنات غير البشرية. التعريف يشمل صراحةً (شخص، كائن، مشهد) — و«نموذج» لا يغطي المشاهد الطبيعية. فشل اختبار الإبدال الكلي: «اختار الرسام نموذج لوحته من منظر جبلي» — غير طبيعي. فضلاً عن ذلك، الكلمة مُعرَّبة من الفارسية — وجود «موضوع» العربي الأصيل يجعل «نموذج» أقل أولوية وفق مبدأ إيثار التراثي."
      step05_citation: "«نموذج: model, form» في مسرد الفن، التسلية والرياضة — ARABTERM"
      nuance_differentiation: "متخصص في النموذج البشري أو المجسَّم أمام الفنان — أضيق من نطاق المجموعة التي تشمل المشاهد والكائنات"

