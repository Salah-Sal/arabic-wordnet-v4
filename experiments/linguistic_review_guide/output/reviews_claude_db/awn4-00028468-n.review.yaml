step0_evidence:
  per_lemma:

    - lemma: "زمن"
      confirm:
        - text: "«أصل واحد يدل على وقت من الوقت؛ الزمان: الحين قليله وكثيره»"
          source: "مقاييس اللغة"
        - text: "«الزَّمَنُ والزَّمانُ: اسمٌ لقَليلِ الوَقْتِ وكثيرِهِ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«الزمانُ: وسطٌ متجانسٌ غيرُ مَحدودٍ، تمرُّ فيه الأحداثُ مُتلاحِقةً، والمدةُ جزءٌ منه»"
          source: "المعجم الكبير"
        - text: "«(الزَّمن) الزَّمَان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«الزَّمانُ: مُدَّةٌ قابلةٌ للقسمة، يُطلق على الوقت القليل والكثير»"
          source: "المصباح المنير للفيّومي"
          addition: "قابلية الزمن للقسمة — بُعد رياضي/فلسفي غائب عن التعريف الحالي"
        - text: "«عند المتكلمين: مُتَجَدِّدٌ مَعْلومٌ يُقَدَّرُ بِهِ مُتَجَدِّدٌ آخَرُ مَوْهومٌ، كقولهم: آتيكَ عندَ طلوعِ الشمسِ»"
          source: "تاج العروس لمرتضى الزبيدي (نقلاً عن المناوي)"
          addition: "تعريف المتكلمين للزمن كمقياس لتقدير الأحداث غير المحققة بالمحققة — يُثري الفهم الفلسفي"
        - text: "«الزمانُ: بعدٌ فيزيائي بحسب نظرية النسبية الخاصة، ويروم ترتيبَ الأحداث سواء أكان نفسياً أو فيزيائياً أو تحليلياً»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "البُعد العلمي المعاصر للزمن في الفيزياء الحديثة — يوسّع الدلالة إلى ما وراء التجربة اليومية"

    - lemma: "وقت"
      confirm:
        - text: "«الوَقْتُ: مِقدارٌ من الزَّمان قُدِّر لأمرٍ مَّا»"
          source: "المعجم الوسيط"
        - text: "«الوَقْتُ: المِقْدارُ من الدَّهْرِ، وأكثرُ ما يُستعمل في الماضي»"
          source: "القاموس المحيط للفيروزآبادي"
      contradicts:
        - text: "«الوَقْتُ: نِهايةُ الزَّمانِ المَفْرُوضِ للعَمَلِ؛ ولهذا لا يكاد يُقال إلا مُقَيَّداً، نحو قولهم: وقتَ كذا»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          conflict: "الوقت نهاية الزمن المفروض لغرض محدد — مقيَّد بأمر وحدٍّ، لا الكونتينيوم اللامتناهي الذي يصفه التعريف"
        - text: "«الوَقْتُ: الزَّمَانُ الْمَعْلُومُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الوقت زمان معلوم/محدد — خلاف التواصل المفتوح غير المحدود"
        - text: "«الوَقْتُ: مِقْدَارٌ مِنَ الزَّمَانِ مَفْرُوضٌ لِأَمْرٍ مَا»"
          source: "المصباح المنير للفيّومي"
          conflict: "الوقت مقدار محدود لأمر بعينه — لا الاستمرار الكلي للتجربة الإنسانية"
      expands:
        - text: "«الوقتُ عند أهل الحقيقة: عبارةٌ عن حالك، وهو ما يقتضيه استعدادُك»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "البُعد الصوفي للوقت كتجربة ذاتية داخلية — يتقاطع جزئياً مع 'تواصل التجربة' في التعريف"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "زمان"
      source_section: "step4_fts_keyword"
      evidence_citation: "«وسطٌ متجانسٌ غير محدود، تمرُّ فيه الأحداثُ متلاحقةً، والمدةُ جزءٌ منه» — المعجم الكبير"
      justification: "الصيغة الكاملة من الجذر ز-م-ن؛ وردت في المعجم الكبير بتعريف فلسفي يطابق بدقة دلالة التواصل الزمني الذي يصفه التعريف؛ مستعملة في الأدب والفلسفة للإشارة إلى الزمن كبُعد مستمر"
  knowledge_candidates:
    - lemma: "دهر"
      justification: "مصطلح عربي أصيل للزمن الكلي؛ آلية التوليد: إحياء لفظ تراثي من جذر د-ه-ر؛ يدل على امتداد الوجود من بدء العالم إلى انقضائه — غير أن دلالته تنحو نحو الأبدية والمصير أكثر من التواصل المحايد للأحداث"
  generation_notes: "التعريف ينصبُّ على الزمن الفلسفي الكلي (الكونتينيوم)؛ لا يوجد في التراث العربي لفظٌ أدق من زمان/زمن لهذا المعنى التحديدي؛ الدهر مرشح محتمل لكنه يحمل ظلالاً مستقلة تجعله أقرب إلى مفهوم الأبدية"

