    reason: "ترجمة حرفية عن الإنجليزية؛ التراث المعجمي العربي يتيح تعريفاً أغنى فلسفياً — خاصة تعريف المعجم الكبير وتعريف المصباح المنير وتعريف المتكلمين في تاج العروس"
