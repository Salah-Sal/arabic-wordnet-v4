      decision: removed
      decision_reason: "رغم استعماله مرادفاً للزمن في بعض السياقات، يحمل الدهر ظلالاً دلالية مستقلة: يدل على مدة الحياة الدنيا كلها أو على القدر والمصير والنازلة؛ الاستعمال الديني يجعله محمّلاً بدلالات قرآنية مخصوصة؛ يستحق مجموعة ترادفية مستقلة"
      step05_citation: "«مُدَّةُ الحياةِ الدنيا كلِّها من ابتداءِ وجودِ العالمِ إلى انقضائِه» — المعجم الكبير"

