    - lemma: "وقت"
      decision: escalated
      decision_reason: "تعارض حقيقي بين التعريف المعجمي الكلاسيكي (مقدار محدود من الزمن لأمر معين، يُستعمل مقيداً) وتعريف المجموعة (الكونتينيوم المستمر)؛ يُرجَّح أن يكون وقت أنسب لمجموعة ترادفية أخصّ تتعلق بالزمن المحدد أو الأوان"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الوقت مقدار من الزمن محدد بغاية ('وقت الصلاة، وقت العمل')، يُستعمل مقيداً في الغالب؛ أما الزمن/الزمان فيُستعملان مطلقَيْن للدلالة على التواصل الكلي"

    - lemma: "زمان"
      source: step05
      decision: confirmed
      decision_reason: "تعريف فلسفي دقيق في المعجم الكبير يطابق تعريف المجموعة؛ الصيغة الأكثر رسوخاً في الأدب والخطاب الفلسفي؛ يُستعمل في ظروف التعاصر والأبدية"
      step05_citation: "«وسطٌ متجانسٌ غير محدود، تمرُّ فيه الأحداثُ متلاحقةً، والمدةُ جزءٌ منه» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الزمان (بالألف) يُفضَّل في السياقات الأدبية الرفيعة والخطاب الفلسفي والإسلامي؛ يُبرز بُعد الامتداد والاستمرار أكثر من زمن (بدون ألف) التي تميل إلى التعبير عن مرحلة أو مدة بعينها"
      example: "إنَّ الزمانَ قد استدارَ كهيئتِه يومَ خَلَقَ اللهُ السَّماواتِ والأرضَ"
