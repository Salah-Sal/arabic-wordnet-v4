step0_evidence:
  per_lemma:

    - lemma: "كُلّ"
      confirm:
        - text: "«الكل: في اللغة اسمٌ مجموع المعنى ولفظه واحد، وفي الاصطلاح: اسم لجملة مركبة من أجزاء»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الْكل: فِي اللُّغَة الْمَجْمُوع الْمعِين. وَفِي الِاصْطِلَاح مَا يتركب من الْأَجْزَاء»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«لفظ كُلٍّ هو لضمّ أجزاء الشيء، وذلك ضربان: الضّامّ لذات الشيء وأحواله المختصّة به ويفيد معنى التمام، والضّامّ للذّوات»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«الكلّ المجموعي: الكلّ من حيث هو كلّ»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(2) كلٌّ تامّ؛ وحدة كاملة» — ترجمة whole"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«كلمةٌ تفيد الاستغراق لأفراد ما تضاف إليه أو أجزائه — تعتبر كلّ في هذه الحالة مفرداً مذكراً بحسب اللفظ»"
          source: "المعجم الوسيط"
          addition: "الاستعمال الأغلب لـ«كُلّ» هو حرف استغراق (دالّ على العموم) لا اسم بمعنى الكيان الكامل — وهو بُعد دلالي مستقل عن تعريف المجموعة"
        - text: "«كُلٌّ — اسم موضوع للإحاطة مضاف أبداً إلى ما بعده»"
          source: "مقاييس اللغة"
          addition: "تأكيد الطابع النسبي (مضاف) لـ«كُلّ» — بينما التعريف يُعيّن كياناً قائماً بذاته"
        - text: "«الكُلُّ، بالضم: اسمٌ لجميعِ الأَجْزاءِ... وقد جاءَ بمعنى بعضٍ، ضِدٌّ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الإشارة إلى تضاد كُلّ وبعض يوسّع نطاقه الدلالي إلى مقابل البعضية لا مجرد تجمُّع الأجزاء"
      peripheral_observations:
        - "الكَلّ (بالفتح) بمعنى اليتيم/العيال/الثِّقل — معنى مستقل تماماً لا صلة له بتعريف المجموعة"
        - "المعجم الوسيط (ocr) يُصنّف كُلٌّ صنف «particle» (حرف) لا اسماً — يُستلزم التحقق من صحة POS في AWN"

    - lemma: "وَحْدَة مُتَكَامِلَة"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "المورد الحديث (2008) يستخدم «وحدة كاملة» (لا متكاملة) كمقابل لـ whole — الفارق في الصفة (كاملة ≠ متكاملة) دال على عدم تثبيت الصيغة"
        - "المورد الحديث (entry 695590) يستخدم «كلٌّ متكامل» لـ integral whole — التنظيم الوصفي الحر لا المصطلح الثابت"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "وحدة كاملة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) كل؛ جميع (2) كلٌّ تامّ؛ وحدة كاملة» — المورد الحديث (2008)، ترجمة whole"
      justification: "المورد الحديث يُقابل whole صراحةً بـ«وحدة كاملة» — وهي الصيغة التي يستعملها المعجم المعاصر المعتمد"
    - lemma: "مجموع"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الكل: في اللغة اسمٌ مجموع المعنى — اسم لجملة مركبة من أجزاء» — كتاب التعريفات للجرجاني"
      justification: "المصادر الكلاسيكية تُوحّد بين «الكل» و«المجموع» في سياق الأجزاء المؤلِّفة لكيان واحد — التعريف يقول «تجمُّع من الأجزاء» وهو الدلالة الجوهرية للمجموع"
  knowledge_candidates:
    - lemma: "مُرَكَّب"
      justification: "آلية التوليد: اشتقاق — اسم المفعول على وزن مُفَعَّل من ر-ك-ب. في الفلسفة العربية الكلاسيكية، المركَّب هو ما يتألف من جزأين أو أجزاء فأكثر في مقابل البسيط (الجوهر الفرد)، وهو يعبّر عن «تجمُّع أجزاء يُعدّ كياناً واحداً» بصورة مباشرة. يمتلك اشتقاقية (يُركَّب، مركَّبات، التركيب). لا يقتصر على المادي."
  generation_notes: "التعريف ينتمي إلى حقل الأنطولوجيا الفلسفية (whole/unit) — الجذور الدلالية المركزية: ك-ل-ل (إحاطة) وج-م-ع (تجميع) ور-ك-ب (تأليف من أجزاء)"

step1_lemma_validation:
  per_lemma:

    - lemma: "كُلّ"
      decision: confirmed
      decision_reason: "أدلة كلاسيكية صريحة تُطابق تعريف المجموعة (اسم لجملة مركبة من أجزاء) — الاستعمال الاصطلاحي الفلسفي راسخ"
      evidence_assessment:
        case: "mixed"
        notes:
          - "الاستعمال الحرفي (particle) أغلب وأشهر من الاستعمال الاسمي المقصود هنا"
          - "المعجم الوسيط (ocr) يُصنّف كُلٌّ في هذا السياق بـ POS=particle — ينبغي مراعاة ذلك"
      substitution_test:
        result: "pass"
      nuance_differentiation: "كُلّ يُركّز على الإحاطة والاستغراق الكلّي — أي أن لا يبقى جزء خارج الكيان المُعبَّر عنه — في حين أن وَحْدَة تُركّز على الاتحاد والوحدانية. الفرق: كُلّ يُساق للدلالة على الامتداد والشمولية (من أجزاء)، أما وَحْدَة فتُساق للدلالة على الكيانية المتماسكة (لا تقبل الانقسام)."
      example: "يُعدّ النظامُ البيئي كلاًّ متكاملاً لا يمكن فهم عناصره بمعزل عن بعضها."
      actions:
        - command: set_metadata
          params:
            entity_type: sense
            entity_id: "{auto}"
            key: usage_note
            value: "الاستعمال الفلسفي/المنطقي للكُلّ (الكل المجموعي) — مغاير للاستعمال الحرفي الأشهر"

    - lemma: "وَحْدَة مُتَكَامِلَة"
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبار السكّ: الصفة (متكاملة) قابلة للإبدال بـ (كاملة / تامة / مكتملة) دون تغيير المعنى — لا يتوافر تثبيت معجمي في أي مصدر بهذه الصيغة بالذات"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "الإنسان وحدةٌ متكاملة من جسد وعقل وروح"
            substituted: "الإنسان وحدةٌ كاملة من جسد وعقل وروح"
            preserved_meaning: true
            why_failed: "إبدال متكاملة بـ كاملة لا يُغيّر المعنى — دليل على أن التركيب وصفي حر لا مصطلح مسكوك"
      nuance_differentiation: "لا توجد إضافة دلالية مميّزة تفصلها عن صياغات وصفية أخرى (وحدة كاملة، وحدة تامة)"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وحدة كاملة"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبار السكّ — إبدال كاملة بتامة أو مكتملة لا يُغيّر المعنى"
      step05_citation: "«(1) كل؛ جميع (2) كلٌّ تامّ؛ وحدة كاملة» — المورد الحديث (2008)"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "يُعدّ العقد وحدةً كاملة من بنود متماسكة"
            substituted: "يُعدّ العقد وحدةً تامة من بنود متماسكة"
            preserved_meaning: true
            why_failed: "كاملة وتامة قابلتان للتبادل — لا ثبات مصطلحي"
      nuance_differentiation: "لا تُضيف بُعداً دلالياً جديداً غير موجود في كُلّ"

    - lemma: "مجموع"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تراثي راسخ في الفلسفة العربية يُعبّر عن الكيان المؤلَّف من أجزاء — له اشتقاقية ويجتاز اختبار الإبدال"
      step05_citation: "«الكل: في اللغة اسمٌ مجموع المعنى — اسم لجملة مركبة من أجزاء» — كتاب التعريفات للجرجاني"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مجموع يُركّز على الجانب التجميعي (sum of parts) — تُبرز دلالته انبثاقَ الكيان الكلي من تضافر الأجزاء وتراكمها، في حين يُركّز كُلّ على الشمولية والإحاطة (the whole as encompassing all). الفرق: «المجموع يساوي مجموع أجزائه» (تعبير رياضي/فلسفي)، أما «الكلّ أعظم من مجموع أجزائه» (مبدأ الجشطالت)."
      example: "يُشكّل الجهازُ العصبي مجموعاً متآلفاً من خلايا ووصلات ومسارات تعمل كوحدة واحدة."
      actions:
        - command: create_entry
          params:
            lemma: "مجموع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00003553-n"

    - lemma: "مُرَكَّب"
      source: step05
      decision: removed
      decision_reason: "الوزن الصرفي مُفَعَّل يدل في سياق المركَّب على ما أُلِّف من أجزاء، وهو صحيح دلالياً — لكن المُرَكَّب في الاستعمال المعاصر يتصادم مع المصطلح الكيميائي (chemical compound) والنحوي (compound sentence) مما يُفضي إلى اشتراك لفظي يُضعف الملاءمة. لم يرد مثبَّتاً في مصدر بهذا الاستعمال الأنطولوجي المحدد."
      step05_citation: "لا دليل معجمي مباشر — مرشح من المعرفة اللغوية"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "الجملة مُرَكَّبٌ من مبتدأ وخبر"
            substituted: "الجملة كلٌّ مؤلَّف من مبتدأ وخبر"
            preserved_meaning: false
            why_failed: "مُرَكَّب في سياق النحو يعني «compound» لا «whole» — الاشتراك اللفظي يعيق الإبدال في سياق الأنطولوجيا"
      nuance_differentiation: "دلالته أقرب إلى «compound» (هيكل تركيبي) منها إلى «whole/unit» (كيان كلي)"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "مجموع"
      reason: "مصدر: الخطوة ٠٫٥ — يُعبّر عن الكيان المؤلَّف من أجزاء في التراث الفلسفي العربي"
      via_command: create_entry + add_sense

step3_definition:
  definition_review_flag: true
  current_definition: "تجمُّع من الأجزاء يُعَدّ كيانًا واحدًا متكاملًا"
  assessment:
    decision: revise
    reason: "لفظ «تجمُّع» يُوحي بحدث التجمُّع (المصدر المؤوَّل) لا بالكيان الناتج — والأدق وصفياً أن يُبدأ بالجنس القريب (كيان / كلٌّ). علاوةً على ذلك، حُذفت «وَحْدَة مُتَكَامِلَة» من اللمّات فصار استخدام «متكاملاً» في التعريف مُعلِّقاً دون سند لمَّي. يُقترح صياغة أدق بأسلوب المعجم الوسيط."
  scope_note: "التراث المنطقي العربي يميّز بين الكل المجموعي (ما يتركب من أجزاء كمجموعة = هذا السياق) والكل الإفرادي (ما ينطبق على كل فرد على انفراد) — التعريف الحالي يُغطّي الأول فحسب ولا يُشير إلى ذلك."
  authored_definitions:
    - type: terminological
      text: "كلٌّ مُؤَلَّف من أجزاء يُعدّ في ذاته كياناً واحداً قائماً"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "ما اجتمعت أجزاؤه فكان شيئاً واحداً بذاته"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-00003553-n"
        definition_index: 0
        text: "كلٌّ مُؤَلَّف من أجزاء يُعدّ في ذاته كياناً واحداً قائماً"
    - command: add_definition
      params:
        synset_id: "awn4-00003553-n"
        text: "ما اجتمعت أجزاؤه فكان شيئاً واحداً بذاته"

