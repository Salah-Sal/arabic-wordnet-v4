step0_evidence:
  per_lemma:

    - lemma: "شيء ثانوي"
      confirm:
        - text: "«(1) مُلْحَق؛ تابع؛ شيء ثانويّ. (2) شيء كماليّ auto accessories»"
          source: "المورد الحديث (2008)"
      peripheral_observations:
        - "الإدخال لا يُثبت «شيء ثانوي» مصطلحاً مسكوكاً، بل يُدرجه ضمن قائمة مقابلات اقتراحية للكلمة الإنجليزية accessory"

    - lemma: "غير ضروري"
      evidence_status: "no_material_found"

    - lemma: "كمالية"
      contradicts:
        - text: "«مذهب النزوع الى الكمال»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "الإدخال يُعرِّف «كمالية» بوصفها مذهب الكمال (perfectionism) لا الشيء غير الأساسي"
      expands:
        - text: "«كَمَالِيَّة: من (ك م ل) نسبة إلى كَمَال»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يكشف الأصل الاشتقاقي — المنسوب إلى كمال/إتمام — وهو ما يُفسّر الدلالة الاقتصادية: الكمالي = ما يُتمّ ولا يُشترط"
      peripheral_observations:
        - "الكلمة مستعملة في الخطاب الاقتصادي العربي صفةً للسلع غير الأساسية: «سلع كمالية»، «احتياجات كمالية» — غير أن هذا الاستعمال صفتي في الغالب لا اسمي مجرّد"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عَرَض"
      source_section: "step4_fts_keyword"
      evidence_citation: "«العَرَض: كلّ ما هو غير جوهريّ» — المورد الحديث (2008)"
      justification: "مصطلح فلسفي كلاسيكي من جذر ع-ر-ض، يقابل 'accident' في المنطق الأرسطي — يدلّ على ما ليس جوهراً، أي ما يمكن انتفاؤه دون إخلال بماهية الشيء؛ آلية التوليد: إحياء لفظ تراثي (مجاز/إزاحة دلالية)"
  knowledge_candidates:
    - lemma: "نافلة"
      justification: "اسم فاعل من ن-ف-ل (اشتقاق)، تدلّ على ما جاء زيادةً على الواجب أو الأصل؛ وردت في المعاجم الكلاسيكية: «النَّافِلَة والسُّنَّة: ترادفانه» (معجم مقاليد العلوم)؛ الوزن فاعِلة يُفيد القابلية — «ما من شأنه أن يكون زيادة»؛ آلية التوليد: اشتقاق بإحياء"
  generation_notes: "المفهوم من الصنف المجرد — العربية المعاصرة تعبّر عنه في الغالب بالصفة (كمالي، ثانوي، غير أساسي) لا بالاسم المفرد المستقل، مما يُنبّه إلى احتمال فجوة معجمية"

step1_lemma_validation:
  per_lemma:

    - lemma: "شيء ثانوي"
      decision: removed
      decision_reason: "مركّب وصفي حر يفشل اختبار السكّ المصطلحي — «شيء» قابل للاستبدال بـ«أمر» و«موضوع» و«جانب» مع حفظ المعنى تماماً؛ ليست وحدة معجمية مسكوكة"
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "«ثانوي» يدلّ على المرتبة الثانية في السلّم الأهمّي — أعمّ من «غير أساسي»؛ الشيء الثانوي قد يكون أساسياً في سياق مغاير، بينما غير الأساسي ينتفي وجوبه مطلقاً"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غير ضروري"
      decision: removed
      decision_reason: "نمط «غير + صفة» إنتاجي تركيبي بالكامل — لا يشكّل مصطلحاً مسكوكاً، ولا سند معجمي مباشر"
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "«غير ضروري» يُحدّد انتفاء الضرورة الوظيفية تحديداً — أدقّ مما ينفي الأساسية؛ يشمل ما هو مفيد لكن ليس إلزامياً، وهو أضيق من دلالة «غير أساسي»"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كمالية"
      decision: escalated
      decision_reason: "تعارض حقيقي بين دلالتين: الكمالية الاجتماعية (perfectionism — مُثبتة معجمياً مباشرةً) والكمالية الاقتصادية (luxury/non-essential — مستعملة صفةً لا اسماً)؛ يحتاج مراجعاً بشرياً لتحديد الدلالة المقصودة وما إذا كانت «كمالية» تؤدّي المعنى اسماً مفرداً"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "«كمالية» تحمل ظلاً دلالياً من الرفاهية والفخامة — تُضمر قيمة جمالية أو ترفيهية زائدة؛ في الاقتصاد تُشير تحديداً إلى السلعة التي يُستغنى عنها عند انخفاض الدخل، وهو أضيق من مفهوم «أي شيء غير أساسي»"

    - lemma: "عَرَض"
      source: step05
      decision: removed
      decision_reason: "اشتراك لفظي حاد يُعيق الاستعمال: الأعراض = symptoms (طب)، عَرَض = offer (تجارة)، عَرَض = chance event؛ المعنى الفلسفي (accident) مُهمَل في الاستعمال المعاصر ومحصور في الفلسفة المدرسية"
      step05_citation: "«العَرَض: كلّ ما هو غير جوهريّ» — المورد الحديث (2008)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "«عَرَض» فلسفياً يدلّ على الخاصية غير الجوهرية في المنطق الأرسطي — أضيق بكثير من «أي شيء غير أساسي»؛ يدلّ على الصفة المتعرِّضة للزوال لا على الكيان نفسه"

    - lemma: "نافلة"
      source: step05
      decision: removed
      decision_reason: "الاستعمال المعاصر يحصر «النافلة» في السياق الديني (صلوات وعبادات طوعية) — فشل اختبار الإبدال خارج هذا الحقل؛ تحمل إيحاءً بالفضل الإضافي لا بانتفاء الضرورة"
      step05_citation: "«النَّافِلَة والسُّنَّة: ترادفانه» — معجم مقاليد العلوم للسيوطي"
      substitution_test:
        result: "fail"
      nuance_differentiation: "«نافلة» تدلّ على ما جاء زيادةً على الواجب الديني مع الحفاظ على قيمة إيجابية — أضيق من «غير أساسي» ولا تشمل ما هو عديم القيمة"

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "أي شيء ليس أساسياً"
  assessment:
    decision: revise
    reason: "تعريف سلبي محض — يُعرِّف بالنفي دون محتوى إيجابي يُحدّد ماهية غير الأساسي؛ «أي شيء» يوسّع النطاق بلا تمييز؛ لا يُفرّق بين ما هو ثانوي وما هو لغو"
  authored_definitions:
    - type: terminological
      text: "ما يمكن الاستغناء عنه مما لا يدخل في متطلبات قيام الكلّ أو وجوده الجوهري، وإن أسهم في إتمامه أو تحسينه"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
    - type: linguistic
      text: "الشيء الذي لا يُخلّ غيابه بتحقيق الغرض الأساسي ولا يُعدّ ركناً لازماً، وإن كان مفيداً أو مُزيِّناً"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09335551-n"
        definition_index: 0
        text: "ما يمكن الاستغناء عنه مما لا يدخل في متطلبات قيام الكلّ أو وجوده الجوهري، وإن أسهم في إتمامه أو تحسينه"
    - command: add_definition
      params:
        synset_id: "awn4-09335551-n"
        text: "الشيء الذي لا يُخلّ غيابه بتحقيق الغرض الأساسي ولا يُعدّ ركناً لازماً، وإن كان مفيداً أو مُزيِّناً"

