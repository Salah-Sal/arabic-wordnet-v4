  generation_notes: "الجذر ج-م-د يعبّر عن مفهوم التجمد بشكل أدق لغوياً من ج-ل-د الذي أصله الجلد/الصلابة؛ لم يُكشف في قاعدة البيانات عن مصطلح عربي متخصص لجليد الأجسام المائية بعيداً عن «جليد» و«جمد»"

