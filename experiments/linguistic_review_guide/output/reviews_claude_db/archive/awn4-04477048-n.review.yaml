  current_definition: "وسيلة نقل تنقل الركاب أو البضائع في عربات معلقة بكابلات ومحمولة بواسطة سلسلة من الأبراج"
  assessment:
    decision: revise
    reason: "تكرار دلالي في «وسيلة نقل تنقل» (البنية الإضافية + الفعل من الجذر نفسه)؛ التعريف لا يذكر الإدارة الكهربائية/الميكانيكية الموثّقة في كلا المعجمين الحديثين"
  authored_definitions:
    - type: terminological
      text: "وسيلة لنقل الركاب أو البضائع في عربات مُعلَّقة بكابلات فولاذية تُحرَّك بالكهرباء، وتنتقل بين أبراج ارتكاز متتالية"
      quality_check:
        genus_present: true
        differentia_present: true
        passed: true
    - type: encyclopedic
      text: "منظومة نقل تعتمد على كابلات فولاذية مشدودة بين سلسلة من الأبراج، تحمل عربات أو كابينات مُعلَّقة تُديرها محركات كهربائية؛ تُستخدم عادةً لعبور التضاريس الوعرة كالجبال والوديان وضفاف الأنهار"
      quality_check:
        genus_present: true
        differentia_present: true
        passed: true
  actions:
