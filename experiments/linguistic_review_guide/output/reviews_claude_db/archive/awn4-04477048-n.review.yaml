step0_evidence:
  per_lemma:

    - lemma: "ترامواي"
      contradicts:
        - text: "«مسار سِكَّة حديد تسير عرباته على طريق ممهدة خصيصا»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "يصف نظام سكة حديد أرضياً، في حين تعرّف المجموعة عربات معلقة بكابلات فوق سلسلة من الأبراج"
        - text: "«ناقلة كهربائية تستعمل سكة حديدية ذات قضبان مسطحة على الطريق»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "تعريف صريح بالقضبان المسطحة على الطريق — لا صلة له بالتعليق الهوائي المحوري في تعريف المجموعة"
        - text: "«مركبة عامة تسير بالكهرباء على قضبان حديديّة؛ لنقل الركاب في المدن وضواحيها»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "نقل حضري أرضي بالقضبان — يتناقض مع الوصف الجوهري للعربات المعلقة بكابلات محمولة بأبراج"
      peripheral_observations:
        - "«ترامواي» و«ترام» في العربية يُطلقان حصراً على الترام الكهربائي الأرضي ذي القضبان في المدن؛ الإنجليزية تستعمل tramway للمعنيين (الأرضي والجوي)، أما العربية فتخصّصه للمعنى الأرضي وحده"

    - lemma: "تلفريك"
      confirm:
        - text: "«وسيلة مواصلات معلّقة تعمل بالكهرباء وتسير على أسلاك معلقة في الهواء»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«(Téléfereque): وَسِيلة لِنَقْل الناس فى مركَبَاتٍ هَوائِيَّة كَهْربيَّة معلَّقة»"
          source: "المعجم الكبير"
      expands:
        - text: "«ويُطلَق عليه أيضاً مِعْبَر هوائى»"
          source: "المعجم الكبير"
          addition: "يُضيف مرادفاً عربياً بديلاً «معبر هوائي» — غير موثّق كمدخل مستقل في أي معجم آخر"

    - lemma: "قطار هوائي"
      evidence_status: "no_material_found"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "العربة المعلَّقة"
      source_section: step5_english_bridge
      evidence_citation: "«العربة المعلَّقة: عربة خفيفة معلَّقة بأسلاك هوائية تجري عليها. وبخاصة: عربة كهذه مسيَّرة بالكهرباء» — المورد الحديث (2008)"
      justification: "توصف تحديداً الوحدة المعلقة بأسلاك هوائية كهربائية، وهو جوهر تعريف المجموعة؛ أداة التوليد: المجاز الوظيفي"
    - lemma: "الطريق الحبلي"
      source_section: step5_english_bridge
      evidence_citation: "«الطريق الحَبْليّ: طريقٌ قِوامُهُ حَبْلٌ فولاذيّ أو حبلان فولاذيان منصوبان» — المورد الحديث (2008)"
      justification: "مقابل معجمي موثّق لـ ropeway؛ الحبل الفولاذي = الكابل في تعريف المجموعة؛ أداة التوليد: التركيب الإضافي الوصفي"
  knowledge_candidates:
    - lemma: "معبر هوائي"
      justification: "تركيب وصفي: «معبر» (وسيلة العبور) + «هوائي» (في الفضاء الجوي) — يصف العبور فوق التضاريس معلقاً في الهواء؛ ذُكر في المعجم الكبير كمرادف للتلفريك؛ أداة التوليد: التركيب الوصفي"
    - lemma: "خط معلق"
      justification: "تركيب إضافي: «خط» (المسار) + «معلق» (المرتفع في الهواء) — يستعمله المعجم الموحد لمصطلحات الهندسة المدنية (2012) في وصف بنية كابل التعليق («تسير عليها دواليب عربات خط معلق»)؛ أداة التوليد: التركيب"
  generation_notes: "المفهوم تقني حديث (cable car / aerial tramway)؛ العربية لم تُرسِّخ مصطلحاً أصيلاً مفرداً لمنظومة النقل ككل — الموجود في المعاجم يُسمّي إما البنية التحتية (خط معلق، طريق حبلي) أو الوحدة المركبة (عربة معلقة)، مما يعكس فراغاً معجمياً حقيقياً في هذا الحقل الدلالي"


step1_lemma_validation:
  per_lemma:

    - lemma: "ترامواي"
      decision: removed
      decision_reason: "تناقض معجمي جوهري — جميع مداخل ترام/ترامواي في قاعدة البيانات (٤ مصادر) تُعرّفها بالنقل الأرضي على القضبان في المدن، لا بالعربات الجوية المعلقة؛ دخيل بتعريب ناقص (لا أوزان صرفية فعلية مشتقة)؛ المدلول العلمي للمفهوم هو «التلفريك» لا «الترام»؛ الربط بهذه المجموعة أخطأ في معالجة تعدد دلالة tramway الإنجليزية (blind literal)"
      evidence_assessment:
        case: contradicts
      substitution_test:
        result: fail
        failure_sentences:
          - original: "ركب المسافرون التلفريك للوصول إلى قمة الجبل"
            substituted: "ركب المسافرون الترامواي للوصول إلى قمة الجبل"
            preserved_meaning: false
            why_failed: "الترامواي في الوعي اللغوي العربي = مركبة أرضية في المدينة؛ استخدامه لوسيلة جبلية هوائية يُحدث انزياحاً دلالياً مضلّلاً"
      nuance_differentiation: "يُفيد في العربية نظام الترام الأرضي ذا القضبان (streetcar) لا العربات الكابلية المعلقة — المعنى المقصود في المجموعة مخصوص بالتعليق الهوائي الذي هو غائب كلياً من كل تعريفاته العربية الموثّقة"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تلفريك"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من معجمين حديثين (المعجم الكبير + معجم اللغة العربية المعاصرة) بتطابق دلالي تام مع التعريف؛ معرَّب مُقرّ (من الفرنسية téléférique) أُخضع للصرف العربي — يقبل ال التعريف والجمع (تلفريكات)؛ لا بديل فصيح مفرد راسخ في التداول التخصصي"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "اللمّة الوحيدة المؤكدة في المجموعة؛ تختص بمنظومة النقل الكابلية الهوائية بين أبراج ارتكاز — يمتاز بالثبات المعجمي ووضوح التخصيص الدلالي بالمقارنة مع المرشحات البديلة"
      example: "يستقلّ السياح التلفريك ذهاباً وإياباً بين محطة السفح ومحطة القمة على ارتفاع ألفَي متر فوق مستوى البحر."

    - lemma: "قطار هوائي"
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبار السكّ واختبار التثبيت المعجمي — لا يرد كمصطلح مستقل في أي من مصادر قاعدة البيانات؛ «هوائي» يمكن إبداله بـ«معلق» أو «كبلي» مع بقاء الوصف صالحاً؛ «قطار» يستدعي دلالة المركبة الأرضية ذات القضبان (root: قطر) مما يُحدث تنافراً مفهومياً مع التعليق الجوي"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        compound_type: وصفي
        accepted: false
      substitution_test:
        result: fail
        failure_sentences:
          - original: "ركب الزوار التلفريك لعبور الوادي"
            substituted: "ركب الزوار القطار الهوائي لعبور الوادي"
            preserved_meaning: false
            why_failed: "التركيب مفهوم وصفياً لكنه غير اصطلاحي؛ «قطار» يستحضر القطار الأرضي؛ التعبير لم يُثبَّت في أي معجم تقني"
      nuance_differentiation: "تركيب حر — يصف المفهوم وصفاً عاماً لكنه لا يُشكّل وحدة معجمية ثابتة؛ يخلط بين سياق «القطار» (ذو قضبان أرضية) وسياق «التلفريك» (معلق في الهواء)"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات الخطوة ٠٫٥ ──

    - lemma: "العربة المعلَّقة"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر — «المعلَّقة» يمكن إبداله بـ«المرفوعة» أو «الجوية» مع بقائه وصفاً صحيحاً (فشل اختبار السكّ)؛ يُسمّي وحدة العربة/الكابينة لا منظومة النقل الكاملة المقصودة في التعريف؛ «telpher» أضيق دلالةً من مفهوم المجموعة (يختص بعربات أحادية السكة)"
      step05_citation: "«العربة المعلَّقة: عربة خفيفة معلَّقة بأسلاك هوائية تجري عليها» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        compound_type: وصفي
        accepted: false
      nuance_differentiation: "مرشح — يُحيل إلى الوحدة المركبة (gondola/car) لا إلى المنظومة الكاملة (نظام النقل بأبراجه وكابلاته)"

    - lemma: "الطريق الحبلي"
      source: step05
      decision: removed
      decision_reason: "خلط بين البنية التحتية (infrastructure) ووسيلة النقل (conveyance) — «طريق» يُعبّر عن المسار/المنشأة لا عن «وسيلة النقل» بالمعنى المقصود في التعريف؛ «ropeway» يُطلق على المنشأة الكاملة لا على وسيلة النقل تحديداً"
      step05_citation: "«الطريق الحَبْليّ: طريقٌ قِوامُهُ حَبْلٌ فولاذيّ أو حبلان فولاذيان منصوبان» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        compound_type: إضافي
        accepted: false
      nuance_differentiation: "مرشح — يُعبّر عن البنية التحتية للسكة الحبلية لا عن وسيلة النقل التي تحمل الركاب والبضائع"

    - lemma: "معبر هوائي"
      source: step05
      decision: removed
      decision_reason: "ذُكر مرة واحدة استطراداً ضمن تعريف التلفريك في المعجم الكبير، ولم يُوثَّق كمدخل مستقل في أي معجم (فشل اختبار التثبيت المعجمي)؛ «معبر» يدل أصلاً على مكان العبور أو البنية لا على وسيلة النقل المتحركة؛ ضعيف الاطّراد في الاستخدام التخصصي المعاصر"
      step05_citation: "«ويُطلَق عليه أيضاً مِعْبَر هوائى» — المعجم الكبير (ضمن مدخل: تِلِفْريك)"
      mwe_check:
        is_mwe: true
        compound_type: وصفي
        accepted: false
      nuance_differentiation: "مرشح — يُحيل إلى المكان أو الممر (passage/crossing) لا إلى المركبة المتحركة؛ ورد مصدر واحد فقط"

    - lemma: "خط معلق"
      source: step05
      decision: removed
      decision_reason: "يُطلق على بنية المسار/السكة (track/line infrastructure) لا على منظومة النقل الكاملة؛ «خط» قابل للإبدال بـ«مسار» أو «سكة» (فشل اختبار السكّ)؛ لم يُوثَّق كمدخل مستقل بهذا المعنى — ورد ضمن تعريف «كابل تعليق» فحسب"
      step05_citation: "«كَبْل (حبل) من أسلاك فولاذية تسير عليها دواليب عربات خط معلق» — المعجم الموحد لمصطلحات الهندسة المدنية (2012) [ضمن مدخل: كَابِل تعليق]"
      mwe_check:
        is_mwe: true
        compound_type: إضافي
        accepted: false
      nuance_differentiation: "مرشح — يُعبّر عن المسار/البنية التحتية، لا عن وسيلة النقل نفسها"

  synset_flags:
    definition_review_needed: true


step3_definition:
