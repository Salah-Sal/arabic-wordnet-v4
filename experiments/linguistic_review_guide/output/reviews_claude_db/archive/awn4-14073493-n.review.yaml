step0_evidence:
  per_lemma:

    - lemma: "سلامة"
      confirm:
        - text: "«سَلَامة: من (س ل م) البراءة والعفية»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«السلامة: الخلاصة من المخوف، ذكره أبو البقاء. وقال الراغب. السلام والسلامة التعري من الآفات الظاهرة والباطنة. والسلامة الحقيقية لا تكون إلا في الجنة لأن فيها بقاء بلا فناء، وغنى بلا فقر، وعزاً بلا ذل وصحة بلا سقم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الصحة مذكورة ضمن مفهوم سلامة أشمل يضمّ سلامة الوجود كله (الروحية والمادية والاجتماعية)؛ البُعد الصحي حاضر لكنه ثانوي في النص"
      contradicts:
        - text: "«الخلو من الأضرار» — translation_en: safety"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "تثبّت سلامة في الاستعمال المتخصص الحديث بمعنى safety/أمان من الضرر، لا «الصحة الجيدة القوية»"
        - text: "«الخلو من المخاطر غير المقبولة» — translation_en: Safety"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          conflict: "تأكيد آخر على انحصار المعنى الحديث في مجال الأمان والوقاية لا الصحة"
      peripheral_observations:
        - "السلامة في علم العروض: بقاء الجزء على الحالة الأصلية — معنى اصطلاحي مستقل لا صلة له بالمجموعة (كتاب التعريفات للشريف الجرجاني؛ كشّاف اصطلاحات الفنون والعلوم للتهانوي)"
        - "السَّلامة من ألفاظ التحية والدعاء — معنى مستقل تماماً (المعجم الكبير)"

    - lemma: "صحة تامة"
      evidence_status: "no_material_found"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "عافية"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الصحّةُ التامّةُ الأضياف طلاب المعروف طلابُ الرِّزق من الناس والدواب والطير» — المعجم الوسيط"
      justification: "عافية مُعرَّفة في المعجم الوسيط (ocr) بـ«الصحّةُ التامّةُ» بوصفه المعنى الأول؛ وهو مطابق لمفهوم المجموعة (robust good health = صحة تامة قوية). اللفظ أصيل متداول في الفصحى والتراث — لا حاجة للمجاز أو الاشتقاق."
  knowledge_candidates:
    - lemma: "نضارة"
      justification: "مجاز (كناية تأثيرية): النضارة = إشراق البدن وطراوته وبهجته؛ وهي في الاستعمال العربي كناية مجازية عن حسن الصحة وقوة البدن (آلية التوليد: مجاز — مشابهة تأثيرية: الصحة الجيدة القوية تُظهر نضارة الوجه وبهجته)."
  generation_notes: "المرشح الأقوى من الأدلة هو «عافية» بتعريف المعجم الوسيط المطابق للمفهوم مباشرة. «نضارة» علاقة مجازية تأثيرية لا ترادف مباشر."


step1_lemma_validation:
  per_lemma:

    - lemma: "سلامة"
      decision: escalated
      decision_reason: "المعنى الأساسي في المعاجم الحديثة والمتخصصة هو الأمان من الخطر والضرر (safety)، لا «الصحة الجيدة القوية» تحديداً. الأصل الكلاسيكي يحمل بُعداً صحياً ضمن مفهوم أشمل («وصحة بلا سقم» — التوقيف)، لكن تثبّت المصطلح في حقل الأمان والوقاية يضعف ملاءمته لهذه المجموعة. بوابة الجودة: الملاءمة الاصطلاحية ضعيفة (المعنى المحوري safety لا robust health)؛ الوزن الصرفي (فَعَالة) مناسب للمصادر الوصفية لكن الإشكالية في الدلالة لا في الصيغة — يحتاج مراجعة بشرية."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "سلامة تشمل النجاة من الخطر والأمان من الضرر والبراءة من الآفات الظاهرة والباطنة (مفهوم أشمل من الصحة)؛ أما المجموعة فمعنية بالصحة البدنية القوية التامة تحديداً. سلامة تتميز عن «صحة تامة» بدلالتها الأمنية والوقائية الغالبة في الاستعمال المعاصر."

    - lemma: "صحة تامة"
      decision: removed
      decision_reason: "تعبير وصفي حر يفشل اختبار التثبيت المعجمي: «تامة» قابلة للإبدال بـ«كاملة» أو «وافرة» دون تغيير المعنى (اختبار السكّ فاشل). كذلك هو ترجمة حرفية عمياء (Blind Literal) من complete health دون استثمار المقابل العربي المسكوك. المقابل الأصيل هو «عافية» الذي يُعرَّف في المعجم الوسيط بـ«الصحّةُ التامّةُ» — مفرد ثابت أدق وأخصر."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "التعبير وصفي يحدد نوع الصحة (الكاملة/التامة)، لكنه لا يحمل قيمة معجمية زائدة على «عافية» التي تؤدي المعنى ذاته في مفرد مسكوك. النوع: مركب وصفي غير مثبّت."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عافية"
      source: step05
      decision: escalated
      decision_reason: "الدليل المعجمي ممتاز ومطابق تماماً («الصحّةُ التامّةُ» — المعجم الوسيط)؛ عافية هي أنسب لمّة لهذه المجموعة وتجتاز جميع المعايير الستة (شائعة، يسيرة النطق، ملائمة دلالياً، تراثية أصيلة، عربية فصيحة، اشتقاقية: عافى-يُعافي-مُعافى). غير أنها مدرجة بالفعل في المجموعة الجذرية (awn4-14073193-n)، مما يستلزم مراجعة بشرية: هل يُنقل الحسّ من الجذرية إلى هذه المجموعة الأكثر تخصصاً؟ أم تُضاف هنا كحسٍّ ثانٍ؟"
      step05_citation: "«الصحّةُ التامّةُ الأضياف طلاب المعروف طلابُ الرِّزق من الناس والدواب والطير» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "عافية تعني «الصحّةُ التامّةُ» بشكل مباشر؛ تتميز عن «سلامة» بانعدام الدلالة الأمنية وتخصصها في الصحة البدنية. تتميز عن «صحة تامة» بكونها وحدة معجمية مفردة ثابتة مسجّلة في المعاجم الكلاسيكية والحديثة."

    - lemma: "نضارة"
      source: step05
      decision: removed
      decision_reason: "النضارة دلالة حسية ظاهرية (الطراوة والبهجة وإشراق الوجه = bloom/freshness) لا تُستخدم اصطلاحاً للتعبير عن «حالة الصحة الجيدة القوية» في الكتابة المتخصصة. تفشل اختبار الإبدال في السياق الطبي والعلمي: «يتمتع بنضارة تامة» لا تؤدي معنى «يتمتع بصحة جيدة قوية» مباشرة."
      step05_citation: "«نضارة: bloom, freshness» — المَكنَز الزراعي متعدد اللغات"

  synset_flags:
    definition_review_needed: true


