        - text: "«عفة — temperance»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "ترجمة العفة بـ'temperance' في الإطار الفلسفي بدلاً من 'chastity' تؤكد أن مفهومها أشمل من الأخلاق الجنسية إذ يمتد إلى ضبط النفس في كل شهوة"
