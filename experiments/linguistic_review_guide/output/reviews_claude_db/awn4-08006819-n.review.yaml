  current_definition: "(في علم البيئة) مجموعة من الكائنات الحية (النباتات والحيوانات) تعيش معاً في منطقة جغرافية معينة وتشكل مجتمعاً مع عدد قليل من الأنواع السائدة"
  assessment:
    decision: revise
    reason: "الصياغة الحالية ترجمة مباشرة للإنجليزية؛ «تشكّل مجتمعاً» تُنشئ لبساً بعد إضافة «مجتمع بيئي» لمّةً للمجموعة؛ يمكن تحسين البنية لتكون جنساً قريباً + فصلاً مميزاً على نمط المعجم الوسيط"
  authored_definitions:
    - type: terminological
      text: "في علم البيئة (الإيكولوجيا): وحدة أحيائية تضم مجموع الكائنات الحية —نباتاتٍ وحيواناتٍ— في رقعة جغرافية محددة، تتسم بهيمنة أنواع قليلة تُعطيها طابعها البيئي المميز"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "مجموعة الكائنات الحية من نباتات وحيوانات التي تعيش في موقع جغرافي واحد وتسود فيها أنواع قليلة تُميّزها عن سائر التجمعات المجاورة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
