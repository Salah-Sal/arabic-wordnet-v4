step0_evidence:
  per_lemma:
    - lemma: "تجمع"
      confirm:
        - text: "«تجمُّع» — translation_en: association"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«تجمع» — translation_en: association"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
      contradicts:
        - text: "«تجمع: مصطلح من مجال السكن، يستعمل بالنسبة لتجمعات قد تصغر أو تكبر أحجامها. لكن المفهوم العام يظل: تجمع سكاني يشمل مدينة مركزية وضواحيها.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "يختص بالتجمعات السكانية البشرية (agglomeration) لا بالمجتمعات الأحيائية؛ السياق البيئي البشري مناقض للسياق الإيكولوجي البيولوجي المقصود"
      expands:
        - text: "«(تجمع) انضمّ بعضه إلى بعض»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "المعنى اللغوي الأصل عام يشمل كل ضم وانضمام بصرف النظر عن طبيعة الكيانات أو السياق؛ أوسع من الاستخدام البيئي المخصوص"
        - text: "«الشيءُ المُتَفَرِّقُ، أو الأشياءُ: اجتمعت... القَوْمُ: اجتمعوا»"
          source: "المعجم الكبير"
          addition: "يشمل التجمع البشري والاجتماعي — بُعد إنساني لا وجود له في تعريف المجموعة البيئية"
      peripheral_observations:
        - "«تجمع» = agglomeration / aggregate في معاجم الجيولوجيا والفيزياء والزلازل — معانٍ علمية مستقلة بعيدة عن السياق البيئي الإيكولوجي"
        - "«تجمع» = convergence في معجم علم الأحياء (1993) — معنى بيولوجي مستقل (تقارب تطوري)"

    - lemma: "رابطة بيئية"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تعايش حيوي"
      source_section: step5_english_bridge
      evidence_citation: "«تعايش (تكافل) الحيوانات والنباتات في مجال حيويّ (بيوتوب) واحد» — المعجم الموحد لمصطلحات المياه (2000)"
      justification: "ظهر بترجمة «biological association» في الجسر الإنجليزي؛ يصف تعايش الكائنات الحية في بيئة مشتركة مما يلامس دلالة التعريف الإيكولوجي"
  knowledge_candidates:
    - lemma: "مجتمع بيئي"
      justification: "تركيب وصفي (آلية: تركيب) من «مجتمع» (جذر جمع) + «بيئي» (نسبة إلى البيئة)؛ موثّق في مسرد المناخ والبيئة بتعريف «منطقة يحددها غطاؤها النباتي السائد» — يتقاطع مع قيد الأنواع السائدة في تعريف المجموعة"
    - lemma: "مجمع نباتي"
      justification: "اشتقاق (آلية: اشتقاق) على وزن مَفْعَل من الجذر جمع؛ مستخدم في أدبيات علم النبات البيئي (phytosociology) للدلالة على التجمع النباتي ذي الأنواع الغالبة"
  generation_notes: "المفهوم فيتوسوسيولوجي متخصص؛ تتشابك المصطلحات العربية بين «تجمع» (عام) و«مجتمع بيئي» (ecological community — أشمل) و«تعايش حيوي» (biocoenosis — مفهوم مختلف)"

step1_lemma_validation:
  per_lemma:
    - lemma: "تجمع"
      decision: confirmed
      decision_reason: "مصدر تفعُّل من الجذر جمع؛ مُقرّ في معاجم النفط والصحة بمعنى association؛ الملاءمة جزئية إذ يحتاج إلى سياق بيئي لتخصيص المعنى، غير أنه الأكثر استخداماً في أدبيات البيئة العربية؛ الاشتقاقية ممتازة (تجمعات، متجمَّع)؛ لا اقتراض ولا ترجمة حرفية"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز «تجمع» فعل التكتل والاجتماع ويُوظَّف كاسم للوحدة الأحيائية التجمعية؛ يختلف عن «مجتمع بيئي» بأن الأخير يُبرز الطابع الوظيفي والتكاملي للمجتمع الأحيائي لا مجرد اجتماع الكائنات"
      example: "يتميز التجمع في غابات المانغروف بهيمنة أنواع قليلة من النباتات الملحية تُشكّل طابعه البيئي المميز وتتحكم في بنيته."

    - lemma: "رابطة بيئية"
      decision: removed
      decision_reason: "لا سند معجمي للمركب في قاعدة البيانات؛ ترجمة حرفية عمياء (blind literal) — تنقل الدلالة اللفظية لـ«association» المؤسسية لا مدلولها البيئي؛ «رابطة» (ر-ب-ط) راسخة في السياق التنظيمي (رابطة الدول، رابطة المعلمين) مما يُنشئ لبساً مع المجتمع الأحيائي الطبيعي؛ فشل اختبار السكّ والتثبيت المعجمي"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
      nuance_differentiation: "«رابطة» من الجذر ربط تستدعي المعنى المؤسسي للارتباط التنظيمي؛ لا تحمل دلالة التجمع الأحيائي الطبيعي ذي الأنواع السائدة الذي يُعرَّف به المفهوم البيئي المقصود"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تعايش حيوي"
      source: step05
      decision: removed
      decision_reason: "يترجم «biocoenosis» لا «association» الفيتوسوسيولوجية؛ التعايش الحيوي يصف التكافل والتعيش المشترك عموماً بلا قيد هيمنة أنواع قليلة الذي يُميّز المفهوم المقصود؛ فشل اختبار الإبدال في السياق الفيتوسوسيولوجي المخصوص"
      step05_citation: "«تعايش (تكافل) الحيوانات والنباتات في مجال حيويّ (بيوتوب) واحد» — المعجم الموحد لمصطلحات المياه (2000)"
      nuance_differentiation: "«تعايش حيوي» = biocoenosis: مجموع الكائنات في بيوتوب بصرف النظر عن التوزيع والهيمنة؛ بينما «association» البيئية تُعرَّف بهيمنة أنواع قليلة تُعطيها طابعها — الفارق جوهري تصنيفياً في علم البيئة"

    - lemma: "مجتمع بيئي"
      source: step05
      decision: confirmed
      decision_reason: "تركيب وصفي موثّق في مسرد المناخ والبيئة (المنظمة العربية للتربية والثقافة والعلوم)؛ تعريفه يتقاطع مع مفهوم المجموعة ذات الأنواع السائدة؛ اجتاز اختبار التثبيت المعجمي؛ وزن المركب صحيح (مجتمع: مفعَل من جمع + بيئي: نسبة)"
      step05_citation: "«منطقة يحددها غطاؤها النباتي السائد باستخدام، مثلاً، التصنيف الدولي للمجتمعات البيئية» — مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "«مجتمع بيئي» يُبرز الطابع الوظيفي المتكامل للتجمع الأحيائي (ecological community) ويُغطي المفهوم بأوسع صوره؛ بينما «تجمع» يُبرز عملية التكتل؛ المصطلحان متكاملان في تغطية المفهوم"
      example: "يُحدَّد المجتمع البيئي في البحر المتوسط بهيمنة أشجار الزيتون والبلوط التي تُعطيانه طابعه المميز."
      actions:
        - command: create_entry
          params:
            lemma: "مجتمع بيئي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08006819-n"

    - lemma: "مجمع نباتي"
      source: step05
      decision: removed
      decision_reason: "يقتصر على المجتمعات النباتية (phytocoenosis) بينما تعريف المجموعة يشمل الحيوانات والنباتات معاً؛ فشل اختبار الإبدال في السياق الشامل للكائنات الحية"
      step05_citation: "مرشح معرفي — لم يُعثر عليه بهذه الصيغة في قاعدة البيانات"
      nuance_differentiation: "«مجمع نباتي» مصطلح فيتوسوسيولوجي أخص يقتصر على النباتات، بينما المجموعة الترادفية تصف مجتمعاً يضم النباتات والحيوانات معاً"

  added_lemmas:
    - lemma: "مجتمع بيئي"
      reason: "مصطلح بيئي موثّق في المعاجم يُغطي مفهوم المجتمع الأحيائي ذي الأنواع السائدة"
      via_command: create_entry + add_sense

step3_definition:
