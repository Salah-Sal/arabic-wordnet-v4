step0_evidence:
  per_lemma:

    - lemma: احتمال
      confirm:
        - text: "«عدد حقيقي بين 0 و 1 يدل على احتمال حدوث حدث معين من بين حالات أحداث ذات الصلة. ارتفاع هذا الرقم (نسبة حالات الحدث المعين إلى مجموع الحالات الممكنة)، يدل على ارتفاع احتمال حدوث الحدث. 0 يدل على استحالة الحدوث، أما 1 فيدل على الحدوث المؤكد.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«أرجحيةُ وقوعِ حادثة، يمكِن تقديرُها رياضياً غالباً. وفي الرياضيات: نظريةُ الإحصاء والاحتمالات من الحقول ذات الصلة بالمصطلح. وفي الحوسبة: يُستخدَمُ الاحتمالُ لتحديد أرجحيةِ حصولِ عطلٍ أو خطأٍ في نظامٍ أو تجهيزة.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«رقم يمثل فرصة حدوث حدث معين.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«(في الفلسفة): ما يمكن توقع حدوثه»"
          source: "المعجم الكبير"
        - text: "«أعلى قيمة ممكنة تعبر عن التواتر النسبي للحدث عند تكرار تجربة عشوائية لعدد لا نهائي (نظرياً) من المرات.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
        - text: "«احتمال» [مقابل probability] في مجالات: الرياضيات والفلك، الجيولوجيا، الحرب الإلكترونية، الطب، علوم الزلازل، الاجتماع، الهندسة المدنية، الفنون والرياضة"
          source: "معاجم ALECSO (ArabTerm) — مصادر متعددة"
      contradicts:
        - text: "«الاحتمال: إتعاب النفس للحسنات.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "المعنى الكلاسيكي الأصلي (الصبر وتحمُّل المشقة في سبيل الحسنات) لا يمتّ بصلة إلى الاحتمالية الرياضية"
        - text: "«الاحتمالُ: إتعاب الْبدن فِي الْحَسَنَات.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "نفس المعنى الكلاسيكي (التحمُّل والصبر) — مغاير تماماً للقيمة الرياضية"
        - text: "«الاحتمال: لغة: العفو والإغضاء وإتعاب النفس في الحسيات ونحو ذلك»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى اللغوي الأصلي (العفو والتحمل) مغاير تماماً للاستعمال التقني الحديث"
        - text: "«مصطلح اقترضته نظرية التواصل ليشكل درجة الشك في ظهور كل علامة.» [translation_en: Entropie]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "يُعطي احتمال مقابلاً للـentropy لا للـprobability — خلط اصطلاحي في هذا المعجم"
      expands:
        - text: "«الاحتمال: ما لا يكون تصور طرفيه كافيًا، بل يتردد الذهن في النسبة بينهما، ويراد به الإمكان الذهني.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "البُعد الفلسفي-المنطقي: الاحتمال كجواز ذهني وتردُّد بين طرفين — أوسع من القيمة الرياضية المحددة بنسبة عددية"
        - text: "«(في اصطلاح الفقهاء والمتكلمين): يجوز استعماله بمعنى: الشك والوهم والجواز فيكون لازمًا»"
          source: "المعجم الكبير"
          addition: "الاستعمال الكلامي-الفقهي (الجواز والوهم) يُوسِّع الدلالة إلى مفهوم الإمكان العام لا الاحتمالية المُقننة"
        - text: "«مبدأ أساس في نظرية التواصل، يحدد كم المعلومة التي تحملها الوحدة اللغوية في سياق معين.» [translation_en: Probability]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "توظيف احتمال في نظرية المعلومات اللسانية — توسيع تقني مستقل عن المعنى الإحصائي المحض"
      peripheral_observations:
        - "المعنى الأصلي في الجذر (ح-م-ل): التحمُّل والصبر — هذا الاستعمال الكلاسيكي مستقل تماماً ويُشكِّل مجموعة دلالية منفصلة لا صلة لها بالاحتمالية الرياضية"

    - lemma: فرصة
      contradicts:
        - text: "«النَّوبة; الوقت المناسب للقيام بعمل ما»"
          source: "المعجم الوسيط"
          conflict: "فرصة = وقت مناسب/نوبة (opportunity)، لا قيمة رياضية إحصائية؛ المعاجم الأصيلة تجمع على الدلالة الزمنية-الظرفية"
        - text: "«الفرصة: اختلاس الشيء حذرًا من فواته.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "يعزز معنى اغتنام الوقت المناسب خشية الفوات — لا صلة بالاحتمالية الرياضية"
        - text: "«النوبة تكون بين القوم يتناوبونها على الماء... انتهز فلان الفرصة: اغتنمها وفاز بها»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال الاصطلاحي يتعلق بانتهاز الفرص الزمنية، لا بقياس الاحتمالات"
        - text: "«فُرْصة: من (ف ر ص) النوبة والمدة الزمنية والوقت المناسب.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "يؤكد أن الفرصة = وقت/مدة زمنية، لا علاقة بالاحتمالية الرياضية"
      peripheral_observations:
        - "«الفِرْصَة» (بالكسر): الداء الذي يصيب فقار الظهر — معنى طبي قديم مستقل تماماً عن المعنيين الآخرين"
        - "أُدرجت فرصة في هذه المجموعة ترجمةً لـchance الإنجليزية، لكن الترادف سطحي مبني على المعنى الثانوي لـchance (opportunity) لا على معناها الإحصائي (probability)"


step05_lemma_generation:
  evidence_candidates:
    - lemma: أرجحية
      source_section: step5_english_bridge
      evidence_citation: "«(1) الاحتمال (2) أرجحيّة» — المورد الحديث (2008)؛ «أرجحية: احتمال حدوث حدث ما ضمن فئة أو صنف معين» — معجم البيانات والذكاء الاصطناعي (2024)"
      justification: "مصطلح مُسجَّل في معجمين حديثين معتمدَين كمقابل لـprobability/likelihood؛ يُفعِّل صورة الرُّجحان (ميل كفة الميزان) مجازاً حيّاً ملائماً لتصوُّر الاحتمالية؛ جذره الثلاثي (ر-ج-ح) أصيل ومنتج"
  knowledge_candidates:
    - lemma: احتمالية
      justification: "اشتقاق — مصدر صناعي: احتمال + ـيّة = خاصية الاحتمال المجردة (-ity/-ness). مُستخدم في المعجم الموحد للهندسة المدنية (2012) مقابلاً مستقلاً لـprobability. آلية التوليد: مصدر صناعي يحوِّل الاسم إلى مفهوم مجرد."
  generation_notes: "التعريف يصف مفهوماً رياضياً دقيقاً (نسبة عددية + قياس الإمكانية)؛ الجذران الدلاليان المحوريان هما ح-م-ل ور-ج-ح؛ الجسر الإنجليزي يكشف أرجحية كمقابل موثَّق في المعجمية العربية الحديثة"


step1_lemma_validation:
  per_lemma:

    - lemma: احتمال
      decision: confirmed
      decision_reason: "مصطلح تقني مستقر في عشرات المعاجم التخصصية الحديثة مقابلاً صريحاً لـprobability؛ التعريف الرياضي موثَّق ومطابق تماماً لتعريف المجموعة؛ المعنى الكلاسيكي (التحمل) انفصل عملياً في الاستعمال التقني"
      evidence_assessment:
        case: mixed
        notes:
          - "المعنى الكلاسيكي (التحمل والصبر) مناقض للمعنى الرياضي — لكنه معنى تاريخي منفصل لا يطعن في المصطلح التقني المُستقر"
          - "تحذير: بعض مداخل ArabTerm تُعطي احتمال مقابلاً للـentropy — خطأ يخص تلك المعاجم لا المصطلح ذاته"
      substitution_test:
        result: pass
      nuance_differentiation: "المصطلح الأعمّ شيوعاً وأدقّ رياضياً؛ يُعبِّر عن القيمة العددية المحددة؛ يتميز عن أرجحية التي تُبرز الطابع المقارن للترجيح، وعن فرصة التي تعني الوقت المناسب لا القيمة الإحصائية"
      example: "يبلغ احتمال وقوع عطل في هذا النظام خلال السنة الأولى أقل من واحد في المئة وفق نتائج الاختبار المنهجي."

    - lemma: فرصة
      decision: removed
      decision_reason: "ترجمة حرفية عمياء (Blind Literal) لـchance الإنجليزية في معناها الفرصاتي لا الإحصائي؛ جميع مداخل المعاجم العربية تؤكد معنى الوقت المناسب/النوبة؛ فشل اختبار الاستبدال في السياق الرياضي؛ لا يُقال «فرصة وقوع المطر = 0.4» في الفصحى التقنية"
      evidence_assessment:
        case: contradicts
      substitution_test:
        result: fail
      nuance_differentiation: "فرصة = وقت مناسب/نوبة (دلالة زمنية-ظرفية)؛ احتمال = قيمة رياضية إحصائية؛ التداخل الإنجليزي بين معنيَي chance لا يُسوِّغ إدراج فرصة في مجموعة ترادفية رياضية"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: أرجحية
      source: step05
      decision: confirmed
      decision_reason: "مصطلح عربي موثَّق في معجمين حديثين معتمدَين كمقابل لـprobability/likelihood؛ جذره (ر-ج-ح) أصيل ومنتج اشتقاقياً؛ اختبار الاستبدال ناجح؛ يُثري المجموعة بظلٍّ دلالي مغاير"
      step05_citation: "«(1) الاحتمال (2) أرجحيّة» — المورد الحديث (2008)؛ «أرجحية: احتمال حدوث حدث ما ضمن فئة أو صنف معين» — معجم البيانات والذكاء الاصطناعي (2024)"
      substitution_test:
        result: pass
      nuance_differentiation: "تُفعِّل مجاز الرُّجحان (ميل كفة الميزان)، مما يُبرز الطابع المقارن للاحتمالية (أيُّ الحوادث أرجح من سواها)؛ تحذير: في الإحصاء الدقيق تُستخدم أحياناً مقابل likelihood (دالة الإمكانية) الذي يختلف تقنياً عن probability — توخَّ الدقة في السياقات المتخصصة الضيقة"
      example: "قدّر الباحثون أرجحية نجاح العلاج بأكثر من ثمانين في المئة استناداً إلى نتائج التجارب السريرية."
      actions:
        - command: create_entry
          params:
            lemma: أرجحية
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05098974-n"

    - lemma: احتمالية
      source: step05
      decision: removed
      decision_reason: "صيغة نسبية (مصدر صناعي) من احتمال تعمل أساساً صفةً في المركبات (احتمالية الكشف، دالة احتمالية، نمذجة احتمالية)؛ استخدامها اسماً مستقلاً لقيمة الاحتمال أضعف من احتمال؛ فشل اختبار التثبيت المعجمي بوصفها مصطلحاً مفرداً قائماً بذاته؛ إضافتها إلى المجموعة التي تضم احتمال تُنشئ تداخلاً مجذرياً دون إثراء دلالي"
      step05_citation: "«احتمالية» — المعجم الموحد لمصطلحات الهندسة المدنية (2012)، translation_en: probability"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: أرجحية
      reason: "مرادف عربي راسخ في المعاجم الحديثة لمفهوم الاحتمالية، مع ظلٍّ دلالي مقارن يثري المجموعة"
      via_command: create_entry + add_sense


