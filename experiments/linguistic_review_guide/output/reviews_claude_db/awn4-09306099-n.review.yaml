step05_lemma_generation:
  evidence_candidates:
    - lemma: "أداة العدوى"
      source_section: "step5_english_bridge"
      evidence_citation: "«أَدَاةُ العَدْوَى» — المعجم الطبي الموحد (2009)"
      justification: "مقابل عربي مسجَّل في المعجم الطبي الموحد للمصطلح الإنجليزي fomite — تركيب إضافي مسكوك يدل على الأداة التي تؤوي العوامل المعدية وتنقلها"

    - lemma: "مكامن العدوى"
      source_section: "step4_fts_keyword"
      evidence_citation: "«مكامن العدوى: أشياء غير ضارة بذاتها ولكنها تأوي المكروبات المرضية مثل قطع الملابس وغيرها» — معجم المصطلحات الطبية (ج.2، 2003)"
      justification: "مصطلح طبي مسجَّل يُقابل fomes/fomite مباشرةً مع تعريف طبي دقيق يُركِّز على الإيواء السلبي للمكروبات في الأجسام الجامدة"

    - lemma: "ناقل العدوى"
      source_section: "step4_fts_keyword"
      evidence_citation: "«ناقل العدوى» — المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)، ترجمته: vehicle; vector"
      justification: "مسجَّل كمقابل عربي لـ vehicle في السياق الطبي؛ غير أنه يشمل أيضاً النواقل الحيّة (vector) مما يُوسِّع مدلوله خارج حدود المجموعة"

  knowledge_candidates:
    - lemma: "مكمن العدوى"
      justification: "مفرد «مكامن العدوى» الموثَّق في المعجم الطبي — اشتقاق (وزن مَفْعَل = موضع الكمون) من ك-م-ن + مجاز: الجسم الجامد مخبأٌ تكمن فيه المكروبات كما يكمن الكمينُ في المخبأ؛ آلية التوليد: اشتقاق + مجاز (إزاحة دلالية من المخبأ المكاني إلى المأوى الوبائي)"

  generation_notes: "المصطلح الإنجليزي fomite (من اللاتينية fomes = وقود) لا مقابلَ مفرداً مستقلاً له في العربية؛ المعاجم الطبية المعتمدة تلجأ إلى مركبات إضافية (أداة العدوى، مكامن العدوى) وهو نمط إنتاجي في المصطلحية الطبية العربية"

