step3_definition:
  definition_review_flag: false
  current_definition: "أي جسم غير حي (مثل منشفة أو نقود أو ملابس أو أطباق أو كتب أو ألعاب وما إلى ذلك) يمكن أن ينقل العوامل المعدية من شخص لآخر"
  assessment:
    decision: revise
    reason: "التعريف الحالي ترجمة قريبة من الإنجليزية ويفتقر إلى عنصر دلالي محوري ورد في معجم المصطلحات الطبية (ج.2، 2003): أن هذه الأشياء «غير ضارة بذاتها» — وهو فصل مميِّز جوهري يُفرِّق الفوميتَ عن السموم والمواد الخطرة التي تضر بذاتها؛ كما أن «جسم جامد» أدق طبياً من «جسم غير حي» (إذ يستبعد الصيغة الأخيرة الأجسام المائية وغيرها)"
  authored_definitions:
    - type: terminological
      text: "جسم جامد غير حي — كالمناشف والملابس والنقود والأواني — لا يُسبِّب ضرراً بذاته، غير أنه يأوي عوامل معدية وينقلها من شخص مصاب إلى آخر سليم"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: encyclopedic
      text: "في علم الأوبئة: أي جسم صامت جامد — كالمناشف وأدوات المائدة والنقود والألعاب — لا يحمل في ذاته خاصية الضرر، بيد أنه يُصبح وسيطاً لمسبِّبات الأمراض المعدية (فيروسات أو بكتيريا أو فطريات) إثر تلوُّثه، فينقلها إلى مَن يلمسه لاحقاً"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09306099-n"
        definition_index: 0
        text: "جسم جامد غير حي — كالمناشف والملابس والنقود والأواني — لا يُسبِّب ضرراً بذاته، غير أنه يأوي عوامل معدية وينقلها من شخص مصاب إلى آخر سليم"

