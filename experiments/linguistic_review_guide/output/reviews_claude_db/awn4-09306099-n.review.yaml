      step05_citation: "«مكامن العدوى: أشياء غير ضارة بذاتها ولكنها تأوي المكروبات المرضية مثل قطع الملابس وغيرها» — معجم المصطلحات الطبية (ج.2، 2003)"
      mwe_check:
