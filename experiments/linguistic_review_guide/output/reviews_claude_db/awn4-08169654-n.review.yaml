step0_evidence:
  per_lemma:

    - lemma: "طائفة القديسين"
      evidence_status: "no_material_found"
      # لا مدخلات مطابقة في headword_entries ولا في الجسر الإنجليزي لهذا التركيب تحديداً

    - lemma: "قديسون"
      confirm:
        - text: "«(2) القدِّيسون جملةً.»"
          source: "المورد الحديث (2008)"
          # المورد الحديث يُعطي «القديسون جملةً» كترجمة عربية للمعنى الثاني من sainthood
      expands:
        - text: "«يُعلن قداسةَ شخص بعد الوفاة؛ يضمُّهُ إلى قائمة القديسين»"
          source: "المورد الحديث (2008)"
          addition: "يُضيف بُعد التصنيف الكنسي الرسمي — القديسون قائمة مضبوطة تُعتمَد بإجراءات مؤسّسية، وليسوا مجرد جمع أشخاص صالحين"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "الأولياء"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) «أ» قِدِّيس؛ قِدِّيسة. «ب» وليّ (إس)» — المورد الحديث (2008)"
      justification: "المورد الحديث يُعطي «وليّ» مقابلاً مباشراً لـ saint في السياق الإسلامي؛ جمعه «الأولياء» هو المصطلح التراثي الراسخ للمقرّبين من الله جماعةً في التراث الإسلامي — مجاز دلالي إسلامي يوازي «القديسين» في التراث المسيحي (مشابهة وظيفية)"
  knowledge_candidates:
    - lemma: "الأبرار"
      justification: "اشتقاق من جذر ب-ر-ر على جمع التكسير (أَبْرار = جمع بَرّ وبَارّ)؛ مصطلح قرآني معهود لجماعة الصالحين المقرّبين من الله: «إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ» (المطففين/22) — يُجسّد المعنى الجماعي للمقدَّسين بإحياء لفظ تراثي قرآني"
  generation_notes: "التعريف يتمحور حول مفهوم جماعي ديني؛ الجسر الإنجليزي (sainthood) كشف معادلاً واضحاً في المورد الحديث (وليّ = saint) يُفضي إلى «الأولياء» كمقابل جماعي إسلامي. البحث بالكلمات المفتاحية (قديس، قداسة) في قاعدة البيانات أكّد عدم وجود مصطلح جماعي مخصوص في المعاجم الكلاسيكية غير «الأولياء» و«الأبرار»"

step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية — محذوفة (فشل اختبار السكّ المصطلحي) ──
    - lemma: "طائفة القديسين"
      decision: removed
      decision_reason: "مركّب إضافي وصفي حر يفشل اختبار السكّ — «طائفة» قابلة للإحلال بـ«جماعة» أو «زمرة» أو «فئة» دون أي تغيير في المعنى، مما يدلّ على أن هذا التركيب وصفي حر لا وحدة معجمية مسكوكة. علاوةً على أن المصطلح الكنسي الثابت للمفهوم هو «شركة القديسين» (Communion of Saints) لا «طائفة القديسين». بوابة جودة المصطلح: الاشتقاقية معدومة (التركيب جامد)"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: pass
      nuance_differentiation: "يُضيف «طائفة» حرفاً تركيبياً يصف الجمع وصفاً إضافياً لكنه لا يُشكّل وحدةً معجمية ثابتة، بخلاف «قديسون» الذي هو الجمع المعجمي المباشر للمصطلح وأقدر على التصرف الصرفي"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة أصلية — مؤكَّدة ──
    - lemma: "قديسون"
      decision: confirmed
      decision_reason: "الجمع المعجمي المباشر للمصطلح العربي قديس (ق-د-س على فَعِيل) مدعوم بشاهد المورد الحديث الذي يُترجم sainthood المعنى الجماعي بـ«القديسون جملةً». فحص الاقتراض: الجذر ق-د-س عربي أصيل، الصيغة فَعِيل عربية منتجة، ليس اقتراضاً لفظياً. بوابة الجودة: مستعمل فعلياً عند المتخصصين واللاهوتيين، يسير النطق، ملائم دلالياً، يسمح بالاشتقاق (قدّس، تقديس، مقدَّس). الملاءمة الصرفية: جمع مذكر سالم (قديسون/القديسين) وزن ملائم لجموع الأشخاص المتّصفين بصفة مستقرة"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "يمثّل الصيغة المسيحية الكنسية لمصطلح «قديس» ويُعبّر عن المقرَّبين من الله الذين أُعلن عن قداستهم بالإجراءات الكنسية الرسمية، بينما «الأولياء» يحمل الصياغة الإسلامية ذاتها — كلاهما يُغطّي المفهوم من بُعد حضاري مختلف"
      example: "تتّبع الكنيسة الكاثوليكية مسيرةً طويلة من التحقق والشهادات قبل إعلان انضمام شخص إلى زمرة القديسين."

    # ── مرشح من الخطوة ٠٫٥ — مقبول ──
    - lemma: "الأولياء"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح التراث الإسلامي الراسخ للمقرّبين من الله جماعةً، مدعوم بمعادلة (وليّ = saint) في المورد الحديث وبالاستعمال الواسع في المصادر الكلاسيكية (تذكرة الأولياء، طبقات الأولياء). فحص الاقتراض: جذر و-ل-ي عربي أصيل، لا اقتراض ولا ترجمة حرفية. بوابة الجودة: مستعمل فعلياً في الأدبين الصوفي والديني، يسير النطق، ملائم دلالياً للمفهوم الإسلامي، تراثي أصيل، يسمح بالاشتقاق (وَلِيَ، ولاية، موالاة). الملاءمة الصرفية: جمع تكسير على أفْعِلاء (أولياء) وزن منتج للأشخاص المتصفين بصفة روحية راسخة"
      step05_citation: "«(1) «أ» قِدِّيس؛ قِدِّيسة. «ب» وليّ (إس)» — المورد الحديث (2008)"
      substitution_test:
        result: pass
      nuance_differentiation: "يحمل الدلالة الإسلامية للقديسين (المقرّبون من الله المُعترَف بهم بالكرامات والصلاح في التراث الصوفي والإسلامي)، ويُكمل «قديسون» الحاملَ للدلالة المسيحية الكنسية — التكاملُ بين اللمّتين يُغطي التراثَين الدينيين العربيين الرئيسيين"
      example: "يزور المؤمنون أضرحة الأولياء في شتى أرجاء العالم الإسلامي تبرّكاً وتوسّلاً بأرواح المقرّبين من الله."
      actions:
        - command: create_entry
          params:
            lemma: "الأولياء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08169654-n"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "الأبرار"
      source: step05
      decision: removed
      decision_reason: "الأبرار أعمّ من القديسين — يشمل البررة والصالحين والمحسنين جميعاً دون اشتراط الاعتراف الديني الرسمي بالقداسة أو الولاية. فشل اختبار الإبدال: «جمعت الكنيسة أمام بيت لحم أمثلة الأولياء/ القديسين» لا يُعادَل بـ«الأبرار» إذ يفتقد الخصوصية المؤسّسية. كشّاف اصطلاحات الفنون يُعرّفه بـ«المحسنين» وهو حقل دلالي مختلف"
      step05_citation: "«الأبرار: بمعنى نيكوكاران- المحسنين» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      substitution_test:
        result: fail
      nuance_differentiation: "يدلّ على الصالحين والمحسنين عموماً دون تخصيص مفهوم القداسة أو الولاية الدينية المُعلَن عنها رسمياً، فيفتقد الخصوصية المطلوبة"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "الأولياء"
      reason: "مصدر: الخطوة ٠٫٥ — المصطلح الإسلامي الراسخ للقديسين جماعةً، معادل لـ«قديسون» في التراث الديني الإسلامي"
      via_command: create_entry + add_sense

