step3_definition:
  definition_review_flag: true
  current_definition: "(الرياضيات) أي مجموعة من النقاط تحقق مجموعة من المسلمات من نوع ما"
  assessment:
    decision: revise
    reason: "لفظ «نقاط» يوحي بالمعنى الهندسي الضيِّق، بينما عناصر الفضاء في الرياضيات
      الحديثة قد تكون أشياء مجرَّدة تماماً لا علاقة لها بالهندسة (كالدوال والمصفوفات
      والمتتاليات)؛ «نقاط» مقبول كمصطلح اصطلاحي لكن يحسن تمييزه عن المعنى الهندسي؛
      الصياغة الكلية قابلة للتدقيق لتعكس الطابع المجرَّد للمفهوم"
  scope_note: "«نقاط» في التعريف مصطلح اصطلاحي يُراد به أي عنصر من عناصر المجموعة —
    وهو أوسع من المعنى الهندسي للنقطة"
