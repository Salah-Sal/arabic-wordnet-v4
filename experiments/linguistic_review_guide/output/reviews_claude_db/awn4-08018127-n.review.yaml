step0_evidence:
  per_lemma:
    - lemma: "فضاء رياضي"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "arabterm يحتوي أكثر من ٢٠ مصطلحاً من نمط «فضاء + صفة» في مجال الرياضيات والفلك
          (فضاء متري، فضاء إقليدي، فضاء متجهات، فضاء مجرد، فضاء جدائي...) مما يُثبّت
          «فضاء» مقابلاً موحَّداً لـ space في المصطلحية الرياضية العربية — غير أن
          «فضاء رياضي» مُركَّباً بهذه الصيغة لم يرد بوصفه مدخلاً مستقلاً"

    - lemma: "فضاء طوبولوجي"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "arabterm يحتوي «طبولوجيا (ال)» و«طوبولوجى» كمقابلَين لـ topology في مجال الرياضيات
          والفلك والكهرباء — و«رسم بياني طوبولوجي للشبكة» يُثبت استعمال «طوبولوجي» صفةً
          معرَّبة — لكن «فضاء طوبولوجي» لم يرد مدخلاً مستقلاً"
        - "المورد الحديث (2008) يُعرِّف «الطوبولوجيا» بـ: «الهندسة اللاكمّيّة أو اللامقداريّة:
          فرع من الرياضيات يُعنى بدراسة موقع الشيء بالنسبة إلى الأشياء الأخرى لا بالمسافة
          أو الحجم» — هذا يُعرِّف العلمَ لا الفضاءَ ذاته"


