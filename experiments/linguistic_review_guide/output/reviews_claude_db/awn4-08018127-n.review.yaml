        space الرياضية؛ التركيب عربي سليم صرفياً لكن يحتاج تثبيتاً معجمياً"
  generation_notes: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) يعتمد «فضاء» مقابلاً
