# المراجعة اللغوية الشاملة — awn4-08195659-n
# population | مجموعة من الكائنات الحية من نفس النوع تسكن منطقة معينة

step0_evidence:
  per_lemma:

    - lemma: عشيرة
      confirm:
        - text: "«مجموعة من الأفراد تنتمي إلى نوع معين أو فئة ما لها القدرة على التزاوج فيما بينها»"
          source: المعجم الموحد لمصطلحات علم الوراثة (2009)
      contradicts:
        - text: "«العشيرة: أهل الرجل الذين يتكثر بهم أي يصيرون له بمنزلة العدد الكامل، وذلك لأن العشرة في العدد الكامل فصارت العشيرة اسماً لكل جماعة من أقارب الرجل الذين يتكثر بهم. والعشير: الزوج والزوجة وكل معاشر قرب أو بعد»"
          source: التوقيف على مهمات التعاريف للمناوي
          conflict: المعنى يخص جماعة أقارب الرجل البشريين حصراً — بعيد عن المفهوم البيولوجي العام الذي يشمل أي كائنات حية من نفس النوع
        - text: "«(الْعَشِيرَة) عشيرة الرجل بَنو أَبِيه الأقربون وقبيلته»"
          source: المعجم الوسيط لمجموعة من المؤلفين
          conflict: محدودة بالقبيلة البشرية (بنو الأب) لا بأي كائنات حية من نفس النوع
      expands:
        - text: "«مجموعة من البشر ينتمي كل منهم، وراثياً أو عن طريق التزاوج، إلى كل عضو آخر في المجموعة»"
          source: المعجم الموحد لمصطلحات علم الوراثة (2009)
          addition: يضيف قيد الانتماء الوراثي والقدرة على التزاوج — وهو أخص مما ورد في تعريف المجموعة الترادفية، ولا يزال مقتصراً على البشر
        - text: "«عشيرة نباتية: جماعة من الأفراد لها القدرة على التهجين وتنمو في موقع معين وتشترك معاً في مجموع جينات لنوع واحد»"
          source: المعجم الموحد لمصطلحات علم الوراثة (2009)
          addition: يمتد استخدام «عشيرة» في الوراثة إلى النباتات (plant population)، لكنه مقيّد بشرط القدرة على التهجين والمشاركة في المجموع الجيني
      peripheral_observations:
        - "معجم البلدان لياقوت الحموي يذكر «العُشَيرَة / عَشِيرَةُ» اسماً لمواضع جغرافية في الجزيرة العربية — معنى طوبونيمي مستقل تماماً لا صلة له بالمعنى المقصود"

    - lemma: مجموعة سكانية
      evidence_status: no_material_found


step05_lemma_generation:
  evidence_candidates:
    - lemma: سكان
      source_section: step5_english_bridge
      evidence_citation: "«مجموعة طبيعية من الأفراد من نوع واحد مع توفر إمكانية مبدئية للتزاوج والتناسل» — مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
      justification: مقابل موثق لـ population في معاجم متخصصة متعددة (AGROVOC، مسرد الاقتصاد، مسرد الجغرافيا، مسرد البيئة) مع تعريف بيولوجي في مسرد البيئة يطابق دلالة المجموعة الترادفية من حيث اشتراط النوع الواحد والمنطقة المحددة
    - lemma: جماعة
      source_section: step5_english_bridge
      evidence_citation: "«وراثة الجماعات» = population genetics؛ «علم بيئة الجماعة» = population ecology — المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      justification: مستخدم في AGROVOC ضمن مصطلحات علم الأحياء المركبة للدلالة على جماعة الكائنات الحية بوصفها وحدة دراسية بيولوجية في منطقة بعينها
  knowledge_candidates:
    - lemma: ساكنة
      justification: اشتقاق (آلية التوليد) من الجذر س-ك-ن — تأنيث جمعي على نمط الاسم الدال على المجموع (كالباقية والسائرة) مشتق من «ساكن»؛ مستخدم في الكتابة العلمية المغاربية المعاصرة للدلالة على المجموع الحيوي القاطن منطقةً بعينها
  generation_notes: تتوزع المعاجم الحديثة بين «سكان» (السياق البيئي والاقتصادي) و«عشيرة» (علم الوراثة) و«جماعة» (AGROVOC) كمقابلات لـ population — يعكس هذا التشعب غياب توحيد مصطلحي وأن المفهوم البيولوجي التقني لم يكن حاجة فكرية في التراث العربي الكلاسيكي


step1_lemma_validation:
  per_lemma:

    - lemma: عشيرة
      decision: escalated
      decision_reason: تعارض حقيقي بين المعنى الكلاسيكي الراسخ (جماعة الأقارب والقبيلة) والاستخدام الوراثي الحديث المحدود النطاق (Mendelian population) — لا تُمثّل المفهوم البيولوجي العام دون إيحاءات قبلية غير مقصودة؛ يحتاج مراجعاً بشرياً لتقرير الاستبقاء أو الاستبدال بـ«سكان»
      evidence_assessment:
        case: mixed
        notes:
          - تأكيد منفرد من معجم وراثة (2009) فيما تناقضه جميع المعاجم الكلاسيكية والعامة
          - الاستخدام الوراثي مشروط بالقدرة على التزاوج — أخص من تعريف المجموعة الترادفية
          - لا شاهد كلاسيكي على استخدامها للكائنات غير البشرية عموماً
      substitution_test:
        result: fail
      nuance_differentiation: في المعاجم الكلاسيكية يقيّدها المعنى بأقارب الرجل وقبيلته؛ وفي علم الوراثة الحديث تختص بالـ Mendelian population (الكائنات المتزاوجة جنسياً في مجموع جيني مشترك) — كلا الاستخدامين أخص من المفهوم البيئي العام للمجموعة الترادفية الذي يشمل النباتات والكائنات التي تتكاثر لا جنسياً أيضاً
      actions:
        - command: set_confidence
          params:
            entity_type: sense
            entity_id: "{auto}"
            score: 0.3

    - lemma: مجموعة سكانية
      decision: removed
      decision_reason: تعبير وصفي حر — فشل اختبار السكّ (يمكن إبدال «سكانية» بـ«حيوانية» أو «نباتية» مع بقاء التعبير وصفاً صالحاً) وفشل اختبار التثبيت المعجمي (لا مدخل في أي معجم)
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: لا تُضيف قيمة مصطلحية على «سكان» المفرد — مركب وصفي حر يؤدي وصفاً لا مصطلحاً ثابتاً، وأداؤه الدلالي لا يفترق جوهرياً عن «مجموعة بيئية» أو «مجموعة أحيائية» من حيث البنية
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: سكان
      source: step05
      decision: confirmed
      decision_reason: مصطلح عربي أصيل موثق في معاجم متخصصة متعددة كمقابل لـ population في السياقين البيئي والبيولوجي؛ مسرد البيئة (ALECSO) يُعرّفه تعريفاً بيولوجياً دقيقاً يطابق دلالة المجموعة الترادفية؛ خالٍ من الإيحاءات القبلية/الإنسانية التي تشوب «عشيرة»
      step05_citation: "«مجموعة طبيعية من الأفراد من نوع واحد مع توفر إمكانية مبدئية للتزاوج والتناسل» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
      substitution_test:
        result: pass
      nuance_differentiation: بخلاف «عشيرة»، خالٍ من الإيحاء القبلي ولا يقتصر على الكائنات المتزاوجة جنسياً — يصلح للنباتات والحيوانات والكائنات الدقيقة على حدٍّ سواء، وهو أشمل وأوفق للمفهوم البيئي العام المقصود
      example: رصد الباحثون تراجعاً ملحوظاً في سكان الضفادع الحمراء بأحواض المياه الجبلية خلال العقد الماضي.
      actions:
        - command: create_entry
          params:
            lemma: سكان
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: awn4-08195659-n

    - lemma: جماعة
      source: step05
      decision: escalated
      decision_reason: التداخل المصطلحي الموثق بين «جماعة» = population (AGROVOC) وبين «جماعة» = community (المعجم الموحد لمصطلحات علم الأحياء، entry 452821) يجعل قبوله دون تمييز مُضلِّلاً — يحتاج مراجعاً بيولوجياً متخصصاً
      step05_citation: "«وراثة الجماعات» = population genetics — المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      substitution_test:
        result: pass
      nuance_differentiation: يُستخدم في بعض المعاجم مقابلاً لـ community (المجتمع الأحيائي المتعدد الأنواع) لا لـ population (مجموعة من نوع واحد) — الالتباس يجعله أقل دقة مصطلحية من «سكان» في هذا السياق

    - lemma: ساكنة
      source: step05
      decision: removed
      decision_reason: غير مُثبَّتة في الفصحى المعيارية ولا في مصطلحيات ALECSO الموحدة — مقتصرة على الكتابة المغاربية ولم ترد في أي مدخل من قاعدة البيانات المعجمية
      step05_citation: مرشح من المعرفة اللغوية — لا سند معجمي في قاعدة البيانات

  added_lemmas:
    - lemma: سكان
      reason: مصطلح موثق في معاجم متخصصة كمقابل بيولوجي/بيئي للـ population؛ أدق وأشمل من «عشيرة» لهذا التعريف
      via_command: create_entry + add_sense


