step0_evidence:
  per_lemma:

    - lemma: "جَوْهَر"
      confirm:
        - text: "«جوهر الشيء: حقيقته وذاته أو أصله ومادّتُه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«substance (فى المنطق): ما قام بنَفْسِه، فهو مُتَقَوِّمٌ بذاتِه ومُتَعَيِّنٌ بماهيَّتِه، وهو المَقُولَةُ الأولى من مَقُولات أرسطو، وبه تقومُ الأعراضُ والكَيْفِيَّات»"
          source: "المعجم الكبير"
        - text: "«يكون الجوهر دومًا واقعًا بالنسبة للمتغيرات. وهو ما يدل بذاته، دون حاجة إلى غيره في وجوده»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«جوهر كل شيء أصله والمراد هنا جملة البدن المؤتلفة من مادة وصورة»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«جوهر = substance»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
        - text: "«جوهر = substance»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«حجر كريم كالياقوت واللؤلؤ ونحوهما»"
          source: "المعجم الكبير"
          conflict: "معنى الحجر الكريم (المجوهرات) مستقل تماماً عن المادة الفيزيائية التي يتكوّن منها شيء ما"
        - text: "«الجوهر: ماهية إذا وجدت في الأعيان كانت لا في موضوع، وهو مختصر في خمسة: هيولي، وصورة، وجسم، ونفس، وعقل»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الجوهر الفلسفي يشمل النفس والعقل (المجردين غير الماديين)، مما يتعارض مع اشتراط الطابع الفيزيائي المادي في تعريف المجموعة"
      expands:
        - text: "«جَوْهَر: (فِي الفلسفة) مَا قَامَ بِنَفسِهِ ويقابله الْعرض وَهُوَ مَا يقوم بِغَيْرِهِ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "المعنى الميتافيزيقي (القائم بذاته مقابل العرض) أوسع من المادة الفيزيائية — يشمل جواهر مجردة غير مادية"
        - text: "«جوهر الشيء حقيقته وذاته»"
          source: "المعجم الوسيط"
          addition: "بُعد «الحقيقة والذات» المعنوي يتجاوز الفيزيائية الصرفة ليشمل الجانب الجوهري المعنوي للشيء"
      peripheral_observations:
        - "جوهر لفظ فارسي معرَّب (گوهر) — صرّح بذلك المعجم الكبير (فارسية معربة) — وعليه لا جذر عربي ثلاثي أصيل"
        - "معنى الحجر الكريم (جواهر = مجوهرات) بالغ الاستقلالية الدلالية وله مجموعة ترادفية مستقلة"

    - lemma: "مَادَّة أَسَاسِيَّة"
      contradicts:
        - text: "«المادة البينية للنسيج خاصة في النسيج الرابط الضام كالغضروف والعظم»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "المصطلح مقيّد بمعنى ground substance البيولوجي (المادة البينية للنسيج الضام)، وهو أضيق بكثير من «المادة الفيزيائية التي يتكوّن منها شخص أو شيء» بصفة عامة"
        - text: "«مادة أساسية = ground substance»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الترجمة الإنجليزية المسجَّلة هي ground substance لا substance — وهي مصطلح تشريحي بيولوجي محدد لا يعبّر عن substance بمعناه الفيزيائي العام"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "هَيُولَى"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الجوهر الهيولاني: هو المادة الفيزيائية الأولية التي تقبل الصورة وتتشكّل بها» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      justification: "هيولى هو الاسم العربي للمفهوم الأرسطي ὕλη (hyle) = المادة الفيزيائية الأولية التي يتألف منها كل جسم. دلالته الكلاسيكية تطابق تعريف المجموعة مباشرةً: المادة الفيزيائية التي يتكوّن منها الكيان."
  knowledge_candidates:
    - lemma: "طِينَة"
      justification: "آلية التوليد: إحياء ممات (مجاز). التهانوي: «الطينة هي من أسماء العلّة المادية» أي المادة التي يتكوّن منها الشيء. اشتقاق من الجذر ط-ي-ن بوزن فِعْلَة يناسب المفاهيم الجوهرية. الاستعمال القرآني «خَلَقَكُم مِّن طِين» يؤصّل الدلالة المادية. تقديم اللفظ التراثي المُحيَى على المصطلح الدخيل وفق الترتيبية."
  generation_notes: "التعريف يصف substance بمعناه الفيزيائي الصارم (لا الميتافيزيقي)؛ المحور الدلالي هو المادة المُكوِّنة لكيان بعينه. هيولى الأدق فلسفياً، وطينة الأكثر تراثيةً وإن كانت مقيّدة بالسياق القرآني."

step1_lemma_validation:
  per_lemma:

    - lemma: "جَوْهَر"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من معاجم كلاسيكية وحديثة وتقنية متعددة؛ المصطلح مستقر في الاستعمال الفلسفي والعلمي العربي؛ المعرَّب مُقرٌّ ومُتصرَّف منه اشتقاقياً"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميّز عن المشتمِل «مَادَّة» بأنه يعني المادة المُكوِّنة لكيان بعينه (جوهر الشيء) لا المادة المجردة كمفهوم عام. يحمل ظلاً اصطلاحياً يربطه بـ substance الأرسطي: ما يتقوّم بذاته وبه تقوم الأعراض والكيفيات — وهو ما يُميّزه دلالياً عن مَادَّة (matter) ويجعله أدق تعبيراً عن «المادة المُشكِّلة للكيان»."
      example: "درس الباحثون جوهرَ العظم البشري فوجدوا أنه يتكوّن في معظمه من فوسفات الكالسيوم المترسّب في شبكة من بروتين الكولاجين."

    - lemma: "مَادَّة أَسَاسِيَّة"
      decision: removed
      decision_reason: "المصطلح مسجَّل في المعاجم التخصصية بمعنى ground substance (المادة البينية للنسيج الرابط الضام)، وهو مصطلح بيولوجي ضيّق لا يصلح تعبيراً عن المفهوم العام للمادة الفيزيائية المُكوِّنة لكيان ما. كما أن الترجمة الحرفية للبنية الإنجليزية وصفية حرة لا مصطلح مسكوك (تُخفق في اختبار التثبيت المعجمي: ARABTERM رصدها بمعنى مختلف تماماً)."
      evidence_assessment:
        case: "contradicts"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "يحيل في الاستعمال التخصصي إلى نوع محدد من المادة (extracellular matrix) وليس المادة المكوِّنة للكيان بصفة عامة"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "هَيُولَى"
      source: step05
      decision: removed
      decision_reason: "رغم دقة المعنى الكلاسيكي (المادة الأولية/الفيزيائية)، غلب على هيولى في المعاجم التقنية الحديثة معنى cytoplasm (هيولى الخلية)، مما يُفضي إلى اشتراك لفظي مُضلِّل. فضلاً عن ذلك فهو معرَّب من اليونانية (ὕλη) بوزن صرفي نادر (فَيْعَلى)، وفشل اختبار الإبدال في سياقات غير فلسفية."
      step05_citation: "«الجوهر الهيولاني: هو المادة الفيزيائية الأولية التي تقبل الصورة» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      substitution_test:
        result: "fail"
      nuance_differentiation: "الاشتراك اللفظي مع cytoplasm في الاستعمال المعاصر يجعله غير صالح كمرادف عام"

    - lemma: "طِينَة"
      source: step05
      decision: removed
      decision_reason: "رغم توثيق التهانوي لطينة بوصفها «من أسماء العلّة المادية»، فإن المعنى الأول والأغلب هو الطين الحرفي والطبيعةُ الخُلُقية (جُبِل على طينة كذا). اختبار التثبيت المعجمي يكشف أن «يتكوّن جسمه من طينة» لا يرد في نصوص علمية معاصرة، مما يعني أن الاستعمال التخصصي الذي يُعوَّل عليه لم يترسّخ."
      step05_citation: "«الطّينة: من أسماء العلّة المادية» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      substitution_test:
        result: "fail"
      nuance_differentiation: "الاستعمال الراسخ يقيّده بالطين الحرفي أو الطبيعة الخُلُقية دون امتداد لغوي منتج نحو المادة الفيزيائية العامة"

  synset_flags:
    definition_review_needed: true

