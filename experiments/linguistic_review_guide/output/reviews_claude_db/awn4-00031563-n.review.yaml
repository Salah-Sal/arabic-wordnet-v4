step0_evidence:
  per_lemma:

    - lemma: "تَجَمُّع"
      confirm:
        - text: "«تجمع: انضمَّ بعضه إلى بعض»"
          source: "المعجم الوسيط"
        - text: "«تجمَّعَ الشيءُ المُتَفَرِّقُ أو الأشياءُ: اجتمعت؛ القومُ: اجتمعوا»"
          source: "المعجم الكبير"
      expands:
        - text: "«مصطلح من مجال السكن… المفهوم العام: تجمع سكاني يشمل مدينة مركزية وضواحيها»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          addition: "يُضيَّق المفهوم إلى الكيانات البشرية والعمرانية — التجمع لا يعني بالضرورة تجمعاً جغرافياً أو سكانياً"

    - lemma: "مَجْمُوعَة"
      confirm:
        - text: "«لفظ عام يطلق على مجموع عناصر منسجمة تكون وحدة مثل مجموعة المحارف ومجموعة التعليمات وغيرهما»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
        - text: "«مفهوم رياضي استعمل بكثرة في اللسانيات وهو يدل على عدد من المكونات لها خاصيات متشابهة أو خاصية واحدة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«عدد من الأشخاص الذين حصل بينهم تفاعل في الأفكار مدة من الزمن، فتقاسموا الأهداف ذاتها، وتكوّنت لديهم هوية جماعية»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "«عدد من الذرات تدخل في التفاعلات الكيميائية دون انفصام بينها فكأنما هي ذرة واحدة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "وحدة وظيفية تحتفظ بتماسكها داخل جسيم أكبر — بُعد كيميائي تخصصي يُضيف قيد الترابط الوظيفي"
      peripheral_observations:
        - "«من الفَلَوَاتِ: التي يجتمع بها القوم ولا يتفرقون خوف ضلال الطريق» (المعجم الكبير، مدخل مؤنث صفة للأرض) — معنى جغرافي/بدوي كلاسيكي قديم لا صلة له بدلالة المجموعة الترادفية"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "زُمْرَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الزمرة: الفوج والجماعة» — المعجم الوسيط | «الزمرة: الجماعة القليلة» — التوقيف على مهمات التعاريف للمناوي"
      justification: "اسم عربي فصيح من الجذر ز-م-ر (اشتقاق) يدل على الجماعة؛ ورد في المعجم الموحد للرياضيات مقابلاً لـ group (زمرة آبيلية، زمرة دورية)"
    - lemma: "جَمَاعَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الجماعة: العدد الكثير من الناس والشجر والنبات / طائفة من الناس يجمعها غرض واحد» — المعجم الوسيط"
      justification: "اسم اشتقاقي من ج-م-ع على وزن فَعَالَة (اشتقاق)، يدل على عدد من الكيانات تجمع بينها رابطة مشتركة"
  knowledge_candidates:
    - lemma: "فِئَة"
      justification: "اشتقاق على وزن فِعْلَة، يدل على الطائفة والفرقة المتميزة بصفة مشتركة؛ شائع في الاستعمال المعاصر (فئة اجتماعية، فئة عمرية، فئة مهنية)"
    - lemma: "مَنْظُومَة"
      justification: "اشتقاق من ن-ظ-م على وزن مَفْعُولَة، يدل على مجموعة من العناصر منسّقة تؤلف وحدة واحدة؛ الجسر الإنجليزي: ensemble = «المنظومة: مجموعة تؤلف كُلاً عضوياً واحداً» (المورد الحديث 2008)"
  generation_notes: "التعريف يصف أعلى مستوى من التجريد في مفهوم المجموعة (any grouping of entities as a unit)؛ محاور التوليد: جذر ج-م-ع، معنى «الوحدة المركّبة من جمع»، المترادفات التقنية"


step1_lemma_validation:
  per_lemma:

    - lemma: "تَجَمُّع"
      decision: confirmed
      decision_reason: "مصدر فعلي من ج-م-ع (Form V)، مستخدم في المعاجم التقنية مقابلاً لـ aggregation / agglomeration / grouping / assemblage في مجالات متعددة؛ يفي بدلالة اجتماع الكيانات في وحدة"
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: "يُشير إلى اجتماع الكيانات بوصفه عملية أو نتيجتها المباشرة (the act/result of gathering)؛ يُستخدم غالباً حين تكون ثمة ديناميكية جمع فعلية — بينما مَجْمُوعَة وصفية حيادية تُطلق على أي وحدة مركّبة بصرف النظر عن كيفية تكوّنها"
      example: "شكَّل التجمعُ السكانيُّ في تلك المنطقة وحدةً إدارية واحدة ذات خصائص مشتركة."

    - lemma: "مَجْمُوعَة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة متعددة من المعاجم التخصصية المعتمدة؛ المقابل الأعم والأكثر تداولاً وحيادية لـ group / set"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "الأشمل والأكثر حياداً — تُطلق على أي مجموعة بصرف النظر عن طبيعة عناصرها أو طريقة تجمّعها أو الرابط الداخلي؛ بينما تَجَمُّع يُضمّن دلالة العملية الاجتماعية أو ديناميكية الانضمام"
      example: "تُعامَل مجموعةُ الدول الأعضاء كوحدة اقتصادية واحدة في الاتفاقيات الدولية."

    - lemma: "زُمْرَة"
      source: step05
      decision: removed
      decision_reason: "الزمرة مقيدة بالجماعة المحدودة العدد (التوقيف: «الجماعة القليلة»)؛ وفي الرياضيات مصطلح تقني للبنية الجبرية (Group Theory) بمفهوم أكثر تخصصاً؛ كلاهما أضيق من «أي عدد من الكيانات»"
      step05_citation: "«الزمرة: الفوج والجماعة» — المعجم الوسيط | «الزمرة: الجماعة القليلة» — التوقيف للمناوي"
      substitution_test:
        result: fail
      nuance_differentiation: "تُقيَّد إما بالعدد (قليلة) أو بالتخصص الرياضي — لا تعمل مقابلاً عاماً لمفهوم التجمع بأي عدد من أي كيانات"

    - lemma: "جَمَاعَة"
      source: step05
      decision: removed
      decision_reason: "جماعة تدل على كيانات حية (ناس وشجر) تجمعها غرض مشترك أو رابطة — مقيدة في الاستعمال الراسخ بالبشر والكائنات الحية؛ لا تعمل لمجموعات الأشياء والمفاهيم المجردة"
      step05_citation: "«الجماعة: طائفة من الناس يجمعها غرض واحد» — المعجم الوسيط"
      substitution_test:
        result: fail
      nuance_differentiation: "أخص من المفهوم المستهدف — تُشترط فيها الحياة والغرض المشترك؛ لا تُطلق على مجموعة من الأشياء أو المفاهيم"

    - lemma: "فِئَة"
      source: step05
      decision: removed
      decision_reason: "الفئة تدل على قسم أو طائفة داخل كل أكبر (division / category) — تفيد التصنيف لا الاجتماع كوحدة مستقلة؛ وأصلها العسكري (الطائفة المقيمة وراء الجيش) يُبعدها عن الدلالة العامة"
      step05_citation: "«الفئة: الطائفة المقيمة وراء الجيش للالتجاء إليهم عند الهزيمة» — التوقيف للمناوي"
      substitution_test:
        result: fail
      nuance_differentiation: "تُشير إلى انتماء عناصر إلى تصنيف أو تقسيم معيّن، لا إلى اجتماعها كوحدة مستقلة — الدلالة التصنيفية أقوى من دلالة الوحدة"

    - lemma: "مَنْظُومَة"
      source: step05
      decision: removed
      decision_reason: "المنظومة تشترط التنظيم والانتساق الداخلي (من ن-ظ-م) وتوحي ببنية مرتبة منسّقة — شرط زائد لا يوجد في التعريف «أي عدد من الكيانات»؛ اختبار السكّ: «منظومة من الكيانات» يغيّر المعنى"
      step05_citation: "«المنظومة: مجموعة تؤلف كُلاً عضوياً واحداً» — المورد الحديث (2008)"
      substitution_test:
        result: fail
      nuance_differentiation: "تُضمّن بنية داخلية منتظمة وتناسقاً وظيفياً — أخص بكثير من مجرد «عدد من الكيانات تُعدّ وحدة»"

  synset_flags:
    definition_review_needed: true


