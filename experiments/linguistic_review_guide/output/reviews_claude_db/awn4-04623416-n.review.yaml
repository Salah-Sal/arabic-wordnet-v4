step0_evidence:
  per_lemma:

    - lemma: "خصلة"
      confirm:
        - text: "«خُلُقٌ فى الإنسان, يكون فضيلةً أو رذيلةً»"
          source: "المعجم الوسيط"
        - text: "«الخَلَّةُ, وهى الصِّفَةُ, فَضِيلةً كانت أو رَذِيلَةً, تكون فى الإنسان, وقد غَلَب على الفَضِيلَةِ»"
          source: "المعجم الكبير"
        - text: "«الخصلة: الخلة والفضيلة والرذيلة، وقد غلب على الفضيلة.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الخَصْلَةُ: الخَلَّةُ، والفَضيلَةُ، والرَّذيلَةُ، أو قد غَلَبَ على الفَضيلَةِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«خلق فِي الْإِنْسَان يكون فَضِيلَة أَو رذيلة وَفِي الحَدِيث: كَانَت فِيهِ خصْلَة من خِصَال النِّفَاق»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«والخصلة بِالْفَتْح... وَهِي أَعم من أَن يكون حَسَنَة وقبيحة وَجَمعهَا الخصائل»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«الإصابَةُ في الرَّمْيِ, والغَلَبَةُ في النِّضَالِ. وهى المَرَّة من الخَصْلِ أنْ يقعَ السَّهْمُ بِلِزْقِ القِرْطَاس»"
          source: "المعجم الكبير"
          addition: "معنى مستقل في الرمي والنضال — لا يتعلق بالطبع الشخصي"
      peripheral_observations:
        - "الخُصلة (بضم) = قطعة الشعر المجتمعة أو الغصن الرطب — معنى مادي مستقل تماماً عن الخَصلة الأخلاقية"

    - lemma: "سمة"
      confirm:
        - text: "«إحدى الصفات الكثيرة التي تحدد الكائن. فالنمط الظاهري وصف لسمة أو أكثر.» — مرادف trait"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«خاصية دنيا، غير قابلة للتحقيق بشكل مستقل.» — مرادف Feature"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«سمة» — مرادف trait"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
      expands:
        - text: "«ما وُسِم به الحيوان من ضروب الصُّوَر / العلامة»"
          source: "المعجم الوسيط"
          addition: "الأصل الكلاسيكي: العلامة والأثر على الحيوان — أعمّ وأبعد عن الخلق الشخصي"
        - text: "«(السمة) مَا وسم بِهِ الْحَيَوَان من ضروب الصُّور والعلامة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "التشديد على معنى الوسم والعلامة — لا التأصيل في طبيعة الإنسان"
      peripheral_observations:
        - "مداخل سُمَّة/سِمَّة (جذر سمم): تعني الخضروات البحرية وجمّارة النخلة وما شابه — مستقلة تماماً"
        - "السمة في AWN4-00024444-n (المشتمِل المباشر) بمعنى 'attribute' — حضورها في طرفَي التسلسل يُثير إشكالاً بنيوياً"

    - lemma: "صفة"
      confirm:
        - text: "«الحالةُ التي يكون عليها الشيءُ من حِلْيَته ونَعْتِه: كالسَّواد والبياض, والعلم والجهل»"
          source: "المعجم الوسيط"
        - text: "«الصفة: لغة: النعت. وشرعا: الاسم الدال على بعض أحوال الذات نحو طويل وقصير وعاقل وأحمق»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«هي الاسم الدال على بعض أحوال الذات... وهي الأمارة اللازمة بذات الموصوف الذي يعرف بها»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الصفة الظاهرة للكائن الحيّ والقابلة للتحور...» — مرادف character; trait"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
      expands:
        - text: "«(الصّفة) الظلة والبهو الواسع العالي السّقف ومكان مظلل في مسجد المدينة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "معنى معماري-تاريخي مستقل تماماً (الصُّفَّة بضم وتشديد)"
        - text: "«الصّفة: [في الانكليزية] Quality، attribute... هي والوصف مترادفان لغة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "أشمل من الطبع الشخصي — تشمل أي وصف لأي موجود بما فيه الإلهي والنحوي"
      peripheral_observations:
        - "الصِّفَة في AWN4-00024444-n (المشتمِل المباشر) أيضاً — نفس إشكالية السِّمَة البنيوية"
        - "الصِّفَة عند النحويين = النعت (اسم فاعل/مفعول/مشبهة) — حقل دلالي مستقل"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "خَلَّة"
      source_section: "step5_english_bridge"
      evidence_citation: "«خَلَّة» — المعجم الطبي الموحد (2009)، يقابل «trait»؛ وفي المعجم الكبير: «الخَلَّةُ: الخَصْلَةُ. يقال: فيه خَلَّةٌ حَسَنَةٌ وخَلَّةٌ سَيِّئةٌ»"
      justification: >
        مرادف مباشر للخَصلة في كلا المعجمَين: الكلاسيكي (المعجم الكبير) والتقني الحديث (ARABTERM).
        آلية التوليد: إحياء اللفظ التراثي القائم بدلاً من الاشتقاق الجديد.
  knowledge_candidates:
    - lemma: "سَجِيَّة"
      justification: >
        اشتقاق من جذر س-ج-و. المعجم الكبير: «الطبيعَةُ. أو: ما دَامَ عليه الطَّبْعُ وَثَبَتَ. وقيل: الغريزة.
        وقيل: الخُلُق — الملكة الراسخة في النفس التي لا تقبل الزوال بسهولة».
        آلية التوليد: اشتقاق من وزن فَعِيلة يدل على الثبات والرسوخ في الطبيعة البشرية.
  generation_notes: >
    التعريف «ميزة مميزة لطبيعتك الشخصية» يشير إلى الحقل الدلالي للأخلاق والطبع الإنساني.
    الجذور الأساسية: خ-ص-ل، خ-ل-ل، س-ج-و. خَلَّة هي الأقرب دلالياً وأثبتها توثيقاً.


step1_lemma_validation:
  per_lemma:

    - lemma: "خصلة"
      decision: confirmed
      decision_reason: "أدلة كلاسيكية قوية من خمسة مصادر — تعريف «خُلُق في الإنسان» يطابق تعريف المجموعة بدقة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: >
        أخصّ لمّات المجموعة بالطبع الأخلاقي الشخصي — تحمل ظلاً إيجابياً طاغياً (غلب على الفضيلة)
        مع قبول الرذيلة، وتختص بالإنسان ولا تُستعمل في وصف الأشياء أو الأفكار المجردة.
        تتميّز عن «صفة» بالتخصيص في الخُلُق الإنساني الأخلاقي، وعن «سمة» بامتلاكها أصلاً
        كلاسيكياً راسخاً في هذا المعنى دون الحاجة إلى السياق.
      example: "كانت فيه خَصْلَةٌ مِن خِصَال النِّفاقِ حتَّى يَدَعَها"

    - lemma: "سمة"
      decision: escalated
      decision_reason: >
        تظهر سمة في المشتمِل المباشر (awn4-00024444-n) بمعنى attribute — إشكالية بنيوية في وجودها
        على طرفَي التسلسل التصنيفي. أصلها الكلاسيكي «علامة الوسم على الحيوان» أبعد عن الطبع
        الشخصي، وانتقل إلى «سمة = feature/attribute» حديثاً لكن بمستوى أعمّ من هذا السينست.
      evidence_assessment:
        case: "expands"
      nuance_differentiation: >
        سمة تدل على الخاصية المُعرِّفة للكيان (أعم — تشمل غير الإنسان)، بينما خصلة
        تختص بالخُلُق الإنساني. سمة في هذا السينست تعمل كمرادف مجازي بالمعنى الحديث.

    - lemma: "صفة"
      decision: escalated
      decision_reason: >
        تظهر صفة في المشتمِل المباشر (awn4-00024444-n) بمعنى attribute/property — نفس الإشكالية
        البنيوية. المعنى الكلاسيكي «الحالة التي يكون عليها الشيء» أعمّ بكثير من «ميزة طبيعتك
        الشخصية»؛ تُطلَق على كل موجود بما فيه الإله والنبات والجماد، لا على الإنسان وحده.
      evidence_assessment:
        case: "expands"
      nuance_differentiation: >
        صفة أشمل المصطلحات الثلاثة — تُوصَف بها الذوات والأفعال والمعاني. في هذا السينست
        تُستعمل مقيَّدةً ضمنياً بـ«الشخصية» للتخصيص، بينما خصلة تحمل هذا التخصيص بنيوياً.

    # ── مرشح من الخطوة ٠٫٥ — خَلَّة ──
    - lemma: "خَلَّة"
      source: step05
      decision: confirmed
      decision_reason: >
        مرادف مباشر لخصلة موثَّق في المعجم الكبير («الخَلَّةُ: الخَصْلَةُ») والمعجم الوسيط (ocr)
        وARABTERM (trait). معجم الصواب اللغوي يُقرّ الشكل الصحيح خَلَّة (بفتح) ويرفض خِلَّة.
      step05_citation: "«الخَلَّةُ: الخَصْلَةُ. يقال: فيه خَلَّةٌ حَسَنَةٌ وخَلَّةٌ سَيِّئةٌ» — المعجم الكبير؛ وخَلَّة = trait — المعجم الطبي الموحد (2009)"
      substitution_test:
        result: "pass"
      nuance_differentiation: >
        مرادف شبه تام لخصلة في المعنى الأخلاقي. الفارق: خَلَّة أدق استعمالاً في المخطوطات
        الكلاسيكية وأقل دوراناً في العربية المعاصرة. تنتمي لجذر خ-ل-ل (الفرجة/الحاجة) وانتقلت
        دلالياً إلى الخصلة الأخلاقية.
      example: "فيه خَلَّةٌ حَسَنَةٌ وخَلَّةٌ سَيِّئةٌ"
      actions:
        - command: create_entry
          params:
            lemma: "خَلَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04623416-n"

    # ── مرشح من الخطوة ٠٫٥ — سَجِيَّة ──
    - lemma: "سَجِيَّة"
      source: step05
      decision: confirmed
      decision_reason: >
        موثَّقة كلاسيكياً (المعجم الوسيط: «الطبيعة والخُلُق»؛ المعجم الكبير: «الملكة الراسخة في النفس
        التي لا تقبل الزوال بسهولة»؛ التوقيف: «العادة والخلق»). تُقابل بدقة «ميزة طبيعتك الشخصية»
        مع تركيزها على الثبات والرسوخ. اختبار السك: مصطلح مسكوك في المعاجم الكلاسيكية ✓
      step05_citation: "«السَّجِيَّة: الطبيعة والخُلُق» — المعجم الوسيط (ocr)؛ «الملكة الراسخة في النفس التي لا تقبل الزوال بسهولة» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: >
        تركّز سجية على الطبع الفطري الراسخ الثابت (الغريزة/الملكة) في حين قد تشمل خصلة
        الخصال المكتسبة أيضاً. «سجاياه الحسنة» تُشير إلى ما جُبِل عليه الإنسان، لا ما تعلّمه.
      example: "الصدقُ سَجِيَّةٌ حميدةٌ تَجَلَّت في سيرة الصادق الأمين"
      actions:
        - command: create_entry
          params:
            lemma: "سَجِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04623416-n"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "خَلَّة"
      reason: "مرادف مباشر لخصلة بسند كلاسيكي وتقني — مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "سَجِيَّة"
      reason: "خُلُق راسخ في الطبيعة الإنسانية — مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense


