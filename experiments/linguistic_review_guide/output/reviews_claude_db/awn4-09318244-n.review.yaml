step0_evidence:
  per_lemma:

    - lemma: "نبتة"
      contradicts:
        - text: "«(النبتة) حَالَة النَّبَات الَّتِي ينْبت عَلَيْهَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعجم يُعرِّف نبتة بأنها حالة (state) النبات في نموّه، لا كياناً نامياً (entity)؛ والمجموعة تطلب «شيء نامٍ» أي كيان مادي؛ فضلاً عن قصر التعريف على النبات دون سائر الكائنات النامية"

    - lemma: "نمو"
      confirm:
        - text: "«نَمَا الشيءُ يَنْمُوْ نُمُوّا زادَ وَكَثُرَ»"
          source: "المحكم والمحيط الأعظم لابن سيدة الأندلسي"
        - text: "«نُمُوّ: الزيادة والكثرة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«نمو: growth» في المعجم الطبي الموحد (2009)، والمعجم الموحد لعلم الأحياء (1993)، والمعجم الموحد لمصطلحات الفيزياء (1989)"
          source: "معاجم أرابترم متعددة"
      contradicts:
        - text: "«النمو: ازدياد حجم الجسم بما ينضم إليه ويداخله في جميع الأقطار بنسبة طبيعية، بخلاف السمن والورم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "جميع المصادر الكلاسيكية والحديثة تُعرِّف النمو بوصفه عملية (ازدياد الحجم) لا كياناً مادياً؛ والمجموعة الترادفية تطلب «شيء نامٍ» — أي الكيان الذي نما، لا فعل النمو ذاته"
        - text: "«النّموّ هو والذّبول من أنواع الحركة الكمية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "النمو مُصنَّف في الفلسفة الكلاسيكية ضمن الحركة الكمية (عملية)، لا ضمن الأجسام المادية؛ وهذا يؤكد طبيعته كمصدر (process noun) لا كاسم كيان (entity noun)"
      expands:
        - text: "«نُمُوّ: (حي) ازدياد حجم الجسم بما ينضمّ إليه نسبة طبيعيّة. (نف) تغيُّر مطّرد في الكائن الحيّ يتّجه به نحو تمام النُّضج»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يُستعمل نمو في السياقَين البيولوجي والطبي مما يُقاربه من دلالة الكيان (نمو خبيث، نمو شاذ)؛ كما يتشعَّب في الاقتصاد والتربية والفيزياء بمعانٍ لا تقتصر على الكيان الحيوي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نامٍ"
      source_section: "step4_fts_keyword"
      evidence_citation: "«النَّامِي: غير الصامت من الأشياء، كالنبات والحيوان» — المعجم الوسيط (مصدر OCR)"
      justification: "اسم فاعل من نما يُستعمل اسمياً في الفلسفة الطبيعية العربية للدلالة على الكيانات الحية النامية (النبات والحيوان)؛ يطابق تعريف المجموعة «شيء نامٍ» مباشرةً دون تضييق ولا توسيع؛ الآلية: إزاحة دلالية — الصفة (اسم فاعل) أُحكمت اسمًا للكيان الحيوي"
  knowledge_candidates:
    - lemma: "نَبات"
      justification: "اسم جمعي يدل على ما ينبت وينمو من الأرض؛ كيان مادي نامٍ بامتياز ومثبَّت في المعاجم كلها؛ لكنه أضيق من دلالة المجموعة (مقصور على النباتات دون الحيوانات والأنسجة النامية)؛ الآلية: اشتقاق من ن-ب-ت على وزن فَعال"
  generation_notes: "التعريف «شيء نامٍ أو ينمو» يشير إلى كيان مادي ذي نشاط حيوي. المحور الدلالي في العربية هو الجذر ن-م-و/ي؛ واللمّة التي تجمع بين الكيانية والنمو هي النامي المستعمَل اسماً في التراث الفلسفي."

step1_lemma_validation:
  per_lemma:

    - lemma: "نبتة"
      decision: removed
      decision_reason: "التعريف المعجمي الوحيد يناقض المجموعة: نبتة = حالة النبات (state) لا كيان نامٍ (entity)؛ والمعنى الحديث (نبتة = شتلة) أضيق من المجموعة إذ يقتصر على النباتات"
      evidence_assessment:
        case: contradicts
      substitution_test:
        result: fail
        failure_sentences:
          - original: "ظهر على ذراعه نمو شاذّ يستوجب الفحص"
            substituted: "ظهرت على ذراعه نبتة شاذّة تستوجب الفحص"
            preserved_meaning: false
            why_failed: "«نبتة» في الاستعمال الحديث تحيل إلى النبات الصغير لا إلى النسيج المرضي النامي، فيتغيّر المعنى جذرياً خارج السياق النباتي"
      nuance_differentiation: "نبتة تخصّص معنى «الكيان النامي» في النبات الصغير وحده (نبتة المشتل)؛ بينما المجموعة تشمل كلّ كيان نامٍ: نباتاً وحيواناً ونسيجاً حيوياً"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "نمو"
      decision: escalated
      decision_reason: "تعارض دلالي جوهري: نمو مصدر (عملية الازدياد)، والمجموعة تطلب كياناً مادياً (شيء نامٍ)؛ لكنّه يُستعمل في الطب والأحياء مقابلاً لـgrowth بما يُقاربه من دلالة الكيان — يحتاج مراجعاً بشرياً ليقرر: هل يبقى هنا أم ينتقل إلى مجموعة عملية النمو؟"
      evidence_assessment:
        case: mixed
        notes:
          - "تعارض: نمو مصدر (process noun) ولا كيان (entity noun)؛ والمجموعة مصنَّفة تحت «جسم مادي» لا «عملية»"
          - "توسيع: مثبَّت في أرابترم مقابلاً لـgrowth في الأحياء والطب والفيزياء"
      nuance_differentiation: "نمو يدل على عملية الازدياد (الحدث/المصدر)؛ أما المجموعة الترادفية فتريد الكيان الذي نما (الموضوع/المفعول)؛ الفرق كفرق «الكتابة» عن «الكتاب»"

    - lemma: "نامٍ"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل مستعمَل اسمياً في المعجم الوسيط بمعنى الكيان الحيوي النامي (النبات والحيوان)؛ يطابق تعريف المجموعة «شيء نامٍ» مباشرةً؛ نجح في اختبار الإبدال"
      step05_citation: "«النَّامِي: غير الصامت من الأشياء، كالنبات والحيوان» — المعجم الوسيط (OCR)"
      substitution_test:
        result: pass
      nuance_differentiation: "نامٍ يتميّز عن نمو بأنه كيان (entity) لا عملية (process)؛ ويتميز عن نبتة بشموله الكائنات الحية كافة — النبات والحيوان — دون تخصيص"
      example: "النامي من الأشياء — كالنبات والحيوان — يتغذّى وينمو ويتكاثر، خلافاً للجامد الذي يبقى على حاله ما لم يُغيَّر بعامل خارجي"
      actions:
        - command: create_entry
          params:
            lemma: "نامٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09318244-n"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "نامٍ"
      reason: "مصدر: الخطوة ٠٫٥ — اسم فاعل مستعمَل اسمياً يطابق تعريف المجموعة كياناً نامياً"
      via_command: create_entry + add_sense

