  generation_notes: "المجال الدلالي: الخرافة والتشاؤم. المُشتمِل «جسم / شيء مادي»
    يُقيَّد المرشحين بكونهما كياناً مادياً لا مجرد مفهوم مجرد أو ممارسة.
    الكلمات المفتاحية المُستخرَجة من التعريف: يجلب — سوء الحظ — يُعتقد — نحس — شؤم."


