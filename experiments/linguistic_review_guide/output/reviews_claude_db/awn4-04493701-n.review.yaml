step0_evidence:
  per_lemma:

    - lemma: "تفاهة"
      contradicts:
        - text: "«التّفاهة بفتح التاء تطلق على معنيين: أحدهما عدم الطعم كما في الأجسام البسيطة وتسمّى هذه تفاهة حقيقية، وثانيهما كون الجسم بحيث لا يحس طعمه لكثافة أجزائه واكتنازه»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "تعريف التهانوي يخصّ انعدام الطعم الحسّي (insipidity) لا انعدام الأهمية — المعنيان منفصلان دلالياً: الأول وصف لطبيعة مادة جسم، والثاني حكم قيمي على أهمية أمر"
      confirm:
        - text: "«(1) تفاهة (2) شيء تافه» [مقابل: triviality]"
          source: "المورد الحديث (2008)"
        - text: "«شيء تافه وتفه: قليل خسيس»"
          source: "أساس البلاغة للزمخشري"
        - text: "«التافِهُ: الحقيرُ اليسيرُ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«تَفِهَ الشَّيءُ تَفَهًا... إذَا خَسَّ وحَقُرَ فَهُوَ تَافِهٌ»"
          source: "المصباح المنير للفيّومي"
        - text: "«التافه: الخسيس الحقير» [في شرح حديث الرويبضة: «الرجل التافه ينطق في أمر العامة»]"
          source: "النهاية في غريب الحديث والأثر لابن الأثير"
      expands:
        - text: "«تَفِهَ فلانٌ تُفُوهاً: حَمُقَ. ورجل تافهُ العقل: قليله»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "امتداد دلالي نحو وصف الشخص بضعف العقل والحمق — خارج نطاق تعريف المجموعة (شيء قليل الأهمية)"

    - lemma: "شيء تافه"
      confirm:
        - text: "«(1) شيء تافه. وبخاصة: مقدار ضئيل [من المال إلخ]» [مقابل: trifle]"
          source: "المورد الحديث (2008)"
        - text: "«(1) جِعة رديئة أو قليلة الكحول (2) شيء تافه» [مقابل: small beer]"
          source: "المورد الحديث (2008)"
      peripheral_observations:
        - "«شيء تافه» واردة كترجمات عربية لمفردات إنجليزية (trifle, small beer) لا كمداخل معجمية مستقلة ذات هوية اصطلاحية ثابتة"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "توافه"
      source_section: "step5_english_bridge"
      evidence_citation: "«توافه؛ أُمور تافهة» [مقابل: trivia] — المورد الحديث (2008)"
      justification: "جمع تكسير من «تافه/تافهة» يُستخدم كاسم جمعي مسكوك في المعجم الحديث للدلالة على الأشياء والأمور التافهة مجتمعةً، مقابل مباشر لـ«trivia»"
  knowledge_candidates:
    - lemma: "تافهة"
      justification: "اشتقاق: الصيغة الاسمية المؤنثة لـ«تافه» تُستخدم أحياناً للدلالة على الشيء التافه بعينه (مقابل trifle بمعناه العياني). اختبار السكّ: «هذه المسألة تافهة» متداول في الاستعمال العربي"
    - lemma: "تُرَّهة"
      justification: "مجاز: لفظ كلاسيكي مستعار أصلاً من «الطريق الصغيرة المتشعبة عن الجادة»، أُطلق بالكناية على الأمور الخالية من الطائل. أقرب ما يقابل «trifle» في التراث العربي من حيث البنية الدلالية، غير أنه اكتسب غلبة دلالية نحو البطلان والزيف"
  generation_notes: "التعريف «شيء قليل الأهمية» يجمع بعدَين: التجريدي (الصفة: تفاهة) والعياني (الشيء بعينه: توافه/تافهة). حقل الجذر ت-ف-ه غني لغوياً، لكن مداخله في المعاجم الكلاسيكية تُركّز على قِلَّة الطعم الحسي أو الخِسَّة المادية، لا على الأمور المعنوية قليلة الشأن"


step1_lemma_validation:
  per_lemma:

    - lemma: "تفاهة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة متعددة من مصادر كلاسيكية وحديثة تثبت دلالة انعدام الأهمية؛ التناقض مع التهانوي محصور في الاستعمال الاصطلاحي الفلسفي لانعدام الطعم، وهو معنى ثانوي لا يعكس الاستعمال العربي الجاري. المصطلح مستوفٍ لمعايير بوابة الجودة الستة"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "تُعبّر عن التفاهة بوصفها خاصية مجردة (صفة/مصدر: the quality of being trivial)، أقرب إلى «triviality» بمعنى الوصف؛ تختلف عن «توافه» التي تُعبّر عن جمع الأشياء التافهة العيانية (trivia). وزنها الصرفي (فَعَالة) يدلّ على مصدر الصفة — مناسب للمفهوم"
      example: "أيقنَ الجمهور تفاهة الحجج المُقدَّمة في الجلسة، فانصرف قبل انتهائها."

    - lemma: "شيء تافه"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل اختبار السكّ واختبار التثبيت المعجمي: يمكن إبدال «تافه» بـ«زهيد» أو «حقير» مع الحفاظ على المعنى ذاته، كما يمكن إبدال «شيء» بـ«أمر» أو «موضوع» — ولا توجد مصادر تُدخلها كمدخل اصطلاحي ثابت. المعاجم تُثبتها ترجماتٍ للإنجليزية لا مصطلحاً مستقلاً. فضلاً عن ذلك: ضعيفة الاشتقاقية (مركّب وصفي جامد)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
      nuance_differentiation: "لا تحمل ظلاً دلالياً مستقلاً — هي وصف تركيبي حر لما تُسمّيه «تفاهة» و«توافه» بصورة أكثر إحكاماً ودقةً معجمية"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "توافه"
      source: step05
      decision: confirmed
      decision_reason: "وحدة معجمية مسكوكة ثابتة في المورد الحديث (trivia = توافه)؛ تُكمل «تفاهة» بتغطية الجمع الاستعمالي الدالّ على الأشياء التافهة مجتمعةً. اجتازت اختبار الإبدال مع تفاهة إذ بينهما فرق بنيوي واضح (مفرد مجرد مقابل جمع عياني). الاشتقاقية: متاحة (التوافه في الجملة وظيفة اسمية مكتملة)"
      step05_citation: "«توافه؛ أُمور تافهة» [trivia] — المورد الحديث (2008)"
      substitution_test:
        result: pass
      nuance_differentiation: "جمع تكسير يُعبّر عن مجموعة الأشياء أو الأمور التافهة (trivia)، في مقابل «تفاهة» التي تُعبّر عن الخاصية المجردة (triviality). يُستخدم في سياقات «الانشغال بالتوافه» بمعنى trivial pursuits/matters"
      example: "لا تُضيّع أوقاتك في التوافه، وانصرف إلى ما ينفعك في حياتك."
      actions:
        - command: create_entry
          params:
            lemma: "توافه"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04493701-n"

    - lemma: "تافهة"
      source: step05
      decision: removed
      decision_reason: "الصيغة المؤنثة لاسم الفاعل (تافهة) تُستخدم نعتاً وأحياناً خبراً، لكنها لم تُثبَّت معجمياً كاسم مستقل بمعنى «شيء قليل الأهمية» في أي مصدر معجمي. يُغني عنها «تفاهة» للمعنى التجريدي و«توافه» للجمع العياني. فشل اختبار التثبيت المعجمي"
      step05_citation: "لا دليل معجمي على التثبيت الاسمي — اشتقاق نظري خالص"
      nuance_differentiation: "تُغطّي دلالتها «تفاهة» (للمجرد) و«توافه» (للجمع)"

    - lemma: "تُرَّهة"
      source: step05
      decision: removed
      decision_reason: "انزياح دلالي حاسم: المعاجم الكلاسيكية تُعرّفها جميعاً بـ«الباطل» و«الأقاويل الخالية من الطائل» و«الكذب والتخليط» — لا بـ«قليل الأهمية». اختبار الإبدال كاشف: «هذا الأمر تُرَّهة» يوحي بالبطلان والزيف لا بانعدام الأهمية. الانتماء الدلالي الصحيح لها يكون في حقل «nonsense/falsehood» لا «triviality»"
      step05_citation: "«التُّرَّهَةُ: الباطِلُ... استُعيرت للأقاوِيلِ الخالِيَةِ من طائِلٍ» — تاج العروس للزبيدي"
      nuance_differentiation: "تُرَّهة = falsehood/nonsense ≠ something of small importance — فرق دلالي جذري"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "توافه"
      reason: "مقابل عربي موثَّق لـ«trivia»؛ يُكمل «تفاهة» في تغطية المدى الدلالي للمجموعة — مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense


