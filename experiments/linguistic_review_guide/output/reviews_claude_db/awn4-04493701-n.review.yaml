    reason: "التعريف الحالي صحيح لكنه عبارة وصفية لا تعريف معجمي أصيل: يفتقر إلى جنس قريب محدد وفصل نوعي يميّز المفهوم؛ علاوةً على ذلك، لفظة «شيء» توحي بالمادية في حين أن المفهوم يشمل الأمور المعنوية والمجردة (فكرة، حجة، قضية...). أسلوب المعجم الوسيط يقتضي صياغة أدق"
  scope_note: "المعنى الكلاسيكي الراسخ للتفاهة في المعاجم القديمة هو انعدام الطعم الحسّي (insipidity) — المعنى المقصود هنا (انعدام الأهمية) موثَّق في الاستعمال الحديث والحديثي، وهو الغالب في الاستعمال المعاصر"
