# AWN4 Linguistic Review — awn4-07327429-n
# id: awn4-07327429-n | pos: n | ili: i75120
# definition_ar: (في الكيمياء) الحركة غير العشوائية لذرة أو جذور كيميائية من مكان إلى آخر داخل الجزيء
# lemmas: انتقال، هجرة

step0_evidence:
  per_lemma:

    - lemma: "انتقال"
      confirm:
        - text: "«الانتقال: في علم الكلام عبارة عن حصول الشيء في حيّز بعد أن كان في حيّز آخر»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الِانْتِقَال: عِنْد الْحُكَمَاء حُصُول الشَّيْء فِي حيّز بعد أَن كَانَ فِي حيّز آخر»"
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: "«انتقال — مقابله الإنجليزي: transition — مجال: الكيمياء»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "المعجم الكيميائي المعياري يُخصّص انتقال للـtransition (الانتقال الإلكتروني، انتقال الطور)، لا للـmigration الذي هو موضوع المجموعة؛ في المقابل يُثبّت هجرة للـmigration في الكيمياء"
      expands:
        - text: "«انتقال من مرحلة إلى أخرى أو من حالة إلى أخرى»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يكشف أن انتقال يُغطّي معنى التحوّل بين الحالات (state transition)، وهو أبعد دلالياً عن migration الجزيئية التي تعني تحرّكاً مكانياً لكيان كيميائي"
      peripheral_observations:
        - "«وفي علم الجدل هو أن ينتقل المستدلّ إلى استدلال غير الذي كان أخذ فيه» — كشّاف اصطلاحات الفنون: الانتقال البلاغي في المناظرة — معنى مستقل تماماً"
        - "«انتقال نقطة من المنشإ تحت تأثير الأحمال المطبّقة عليه» — المعجم الموحد لمصطلحات الهندسة المدنية (2012): displacement في الهندسة — معنى مستقل"

    - lemma: "هجرة"
      confirm:
        - text: "«هجرة — مقابله الإنجليزي: migration — مجال: الكيمياء»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«هجرة آيونية — مقابله: ionic migration; migration of ions»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«هجرة — مقابله الإنجليزي: migration — مجال: علم الأحياء»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      expands:
        - text: "«الخروج من أرضٍ إلى أخرى / انتقال الأفراد من مكان إلى آخر سعياً وراء الرزق»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية هجرة جغرافية بشرية أو حيوانية — أوسع من الهجرة الجزيئية الكيميائية المقيّدة بالنطاق داخل الجزيء"
        - text: "«تسلل الكرات البيض عبر جدران الأوعية الدموية الدقيقة»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "توسيع طبي مستقل: هجرة الخلايا عبر الأوعية — بُعد خلوي لا يندرج ضمن الهجرة الكيميائية الجزيئية"
      peripheral_observations:
        - "«(الْهِجْرَة) السمينة التَّامَّة» — المعجم الوسيط [صيغة هَجْرَة بفتح الهاء]: وصف للناقة — معنى مستقل تماماً"
        - "«الهجرة: هي ترك الوطن الذي بين الكفار والانتقال إلى دار الإسلام» — كتاب التعريفات للجرجاني: المعنى الديني الإسلامي — مستقل"
        - "«الهِجْرَةُ: من نواحي اليمامة قرية ونخيلات» — معجم البلدان لياقوت الحموي: اسم مكان — مستقل"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "ارتحال"
      source_section: "step5_english_bridge"
      evidence_citation: "«ارتحال، هِجْرَة — migration: انتقال المواد من مكان لآخر من خلال الانتشار» — المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      justification: "يرادف هجرة في بعض المعاجم التقنية للدلالة على انتقال المواد من موضع لآخر؛ جذره ر-ح-ل مثبَّت في العربية للتنقّل والانتقال؛ مستعمَل أيضاً في مصطلحات علم الوراثة (ارتحال، هجرة = migration)"
  knowledge_candidates:
    - lemma: "تنقّل"
      justification: "اشتقاق (تفعّل) من جذر ن-ق-ل يدل على الحركة المتكررة من موضع إلى موضع؛ يُعبّر عن جوهر الفكرة (حركة الذرة داخل الجزيء) بأصالة عربية دون اقتراض"
  generation_notes: "المفهوم كيميائي متخصص (هجرة الذرات والجذور داخل الجزيء)؛ المعاجم الكيميائية العربية تُفرّق وظيفياً بين هجرة (migration) وانتقال (transition)؛ وجود ارتحال كمرادف في سياقات أخرى مثير للاهتمام"


step1_lemma_validation:
  per_lemma:

    - lemma: "هجرة"
      decision: confirmed
      decision_reason: "مُؤكَّدة مباشرة من معجم الكيمياء الموحد (1992) — هجرة = migration في الكيمياء بصريح العبارة؛ التوسّع في الدلالة (الهجرة الجغرافية) لا يُلغي الثبات الاصطلاحي في المجال المقصود"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "هجرة أخصّ من انتقال في السياق الكيميائي — تحمل دلالة الانتقال الهادف المنظَّم لكيانات دقيقة (ذرات، أيونات، جذور)، وتنفرد باتفاق المعاجم الكيميائية المعيارية على تخصيصها للـmigration دون غيرها"
      example: "رُصدت هجرة الجذر الألكيلي من موضع C1 إلى C2 داخل الجزيء الكربوني خلال تفاعل واغنر-ميرفاين لإعادة الترتيب الجزيئي."

    - lemma: "انتقال"
      decision: escalated
      decision_reason: "تعارض اصطلاحي حقيقي بين مستويين: (أ) المعنى الكلاسيكي العام (حصول الشيء في حيّز بعد أن كان في حيّز آخر) يُبرّر الإدراج من حيث المبدأ؛ (ب) المعجم الكيميائي المعياري يُخصّص انتقال للـtransition لا للـmigration؛ يحتاج مراجعاً بشرياً لتحديد أيّ المستويين تُمثّله هذه المجموعة"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "انتقال أعمّ دلالياً — يغطّي صنوف التحرك المكاني والزمني والحالي والبلاغي؛ في الكيمياء المصطلحية يُخصَّص للـtransition (الانتقال الإلكتروني، انتقال الطور)؛ استخدامه في مجموعة migration قد يُوقع خلطاً اصطلاحياً مع مصطلح transition المرتبط بسياق فيزيوكيميائي مختلف"

    - lemma: "ارتحال"
      source: step05
      decision: removed
      decision_reason: "تعريف ARABTERM يصف ارتحال بأنه 'انتقال المواد من مكان لآخر من خلال الانتشار' — الانتشار (diffusion) حركة عشوائية تناقض صريح قيد 'غير عشوائية' الوارد في تعريف المجموعة؛ فضلاً عن انعدام استخدامه في الأدبيات الكيميائية العربية لـmigration الجزيئي"
      step05_citation: "«ارتحال، هِجْرَة — migration: انتقال المواد من مكان لآخر من خلال الانتشار» — المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      nuance_differentiation: "ارتحال مرتبط بالانتشار العشوائي في المصادر المتاحة، لا يُضيف فرقاً دلالياً عن هجرة، ويُعارض قيد الـnonrandom في التعريف"

    - lemma: "تنقّل"
      source: step05
      decision: removed
      decision_reason: "مصطلح عام لا يرد في أي معجم كيميائي تخصصي للدلالة على migration الجزيئي؛ يفشل اختبار التثبيت المعجمي — التعبير قابل للإبدال بمكوّناته الوصفية دون فقدان المعنى"
      step05_citation: "لا دليل معجمي مباشر — مرشح من المعرفة اللغوية"
      nuance_differentiation: "تنقّل أعمّ من هجرة — يصف أي حركة دورية من موضع إلى موضع دون تخصيص طبيعة الكيان أو السياق العلمي"


step3_definition:
  definition_review_flag: false
  current_definition: "(في الكيمياء) الحركة غير العشوائية لذرة أو جذور كيميائية من مكان إلى آخر داخل الجزيء"
  assessment:
    decision: retain
    reason: "التعريف دقيق وتام — يُحدّد السياق (الكيمياء)، وطبيعة الحركة (غير عشوائية)، والكيان المتحرك (ذرة أو جذور كيميائية)، والقيد المكاني (داخل الجزيء)"
  scope_note: "التعريف العربي الكلاسيكي لهجرة أوسع (الخروج من أرض إلى أخرى)؛ المجموعة تستخدم المصطلح بدلالته الكيميائية التخصصية الأضيق"


