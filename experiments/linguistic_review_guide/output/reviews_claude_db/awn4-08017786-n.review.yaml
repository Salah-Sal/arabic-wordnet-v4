step0_evidence:
  per_lemma:

    - lemma: مجموعة خالية
      confirm:
        - text: "«مجموعة خالية — empty set»"
          source: المعجم الموحد لمصطلحات الرياضيات والفلك (1990)
        - text: "«مجموعة خالية — null set»"
          source: المعجم الموحد لمصطلحات الرياضيات والفلك (1990)

    - lemma: مجموعة فارغة
      evidence_status: no_material_found

step05_lemma_generation:
  evidence_candidates:
    - lemma: مجموعة خالية
      source_section: step5_english_bridge
      evidence_citation: "«مجموعة خالية — null set» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      justification: >-
        المصطلح الموحّد المُثبَّت في معجم ALECSO للرياضيات والفلك (1990)؛
        يعادل كلاً من null set وempty set في آنٍ واحد؛
        خالية من الجذر خ-ل-و يدل على البراءة الذاتية من المحتوى

    - lemma: فئة خالية
      source_section: step4_fts_keyword
      evidence_citation: "«فئة لا تحتوي على أية عناصر» — مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
      justification: >-
        مقابل موثّق لـ empty set في مسرد التربية (ALECSO)؛
        يستخدم "فئة" بدلاً من "مجموعة" في السياق التربوي الأولي؛
        الدليل معجمي موجود لكن التطابق المفهومي مع الرياضيات الرسمية ليس تاماً

  knowledge_candidates:
    - lemma: المجموعة الصفرية
      justification: >-
        اشتقاق وصفي يُحاكي null set بترجمة null إلى "صفري" نسبةً إلى الصفر الرياضي؛
        آلية التوليد: تركيب وصفي + اشتقاق (صفر → صفري)؛
        يُبرز أن القوة العددية للمجموعة تساوي الصفر؛
        غير مُثبَّت في المعاجم الموحدة حسب نتائج قاعدة البيانات

  generation_notes: >-
    المفهوم (مجموعة رياضية بلا عناصر) يُولّد مصطلحات عبر الوصف بالخلوّ أو الفراغ أو الصفرية؛
    الأدلة المعجمية الموثّقة تدعم "خالية" في المعاجم الرسمية و"فارغة" في الاستعمال التعليمي الواسع

step1_lemma_validation:
  per_lemma:

    - lemma: مجموعة خالية
      decision: confirmed
      decision_reason: >-
        أدلة تأكيد مزدوجة من المعجم الموحد (ALECSO 1990) كمقابل لـ empty set ولـ null set؛
        مركب وصفي (اسم + صفة) مستقر اجتاز اختبار التثبيت المعجمي والاستعمالي؛
        لا اقتراض لفظي — خ-ل-و وج-م-ع جذران عربيان أصيلان؛
        لا ترجمة حرفية عمياء — "خالية" تعادل دلالياً null/empty بدقة وصواب؛
        الوزن الصرفي (فاعلة صفةً لمجموعة) ملائم للوظيفة الوصفية التخصصية؛
        يحقق معايير بوابة الجودة الستة: شيوع ✓ يُسر ✓ ملاءمة ✓ عربي ✓ اشتقاقية (خلوّ، أخلى، أُخليت) ✓
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: >-
        المصطلح المعياري في المعاجم الموحدة الصادرة عن ALECSO؛
        "خالية" من خ-ل-و تُصوّر الخلوّ وصفاً ذاتياً راسخاً في طبيعة المجموعة —
        هو خلوّ أصيل لا إفراغ عارض، مما يميزه عن "فارغة" التي تُصوّر المجموعة كوعاء أُفرغ من محتواه
      example: >-
        تُعدّ المجموعة الخالية مجموعة جزئية من كل مجموعة رياضية في نظرية المجموعات،
        وهي المجموعة الوحيدة التي تحقق هذه الخاصية تجاه أي مجموعة كانت.

    - lemma: مجموعة فارغة
      decision: confirmed
      decision_reason: >-
        لا سند في قاعدة البيانات المعجمية؛ مقبولة بحكم اللغوي —
        هي الصيغة الغالبة في الكتب المدرسية والمناهج العربية من الخليج إلى المغرب؛
        مركب وصفي (اسم + صفة) مستقر اجتاز اختبار الإبدال والتثبيت الاستعمالي التعليمي؛
        لا اقتراض لفظي — ف-ر-غ وج-م-ع جذران عربيان أصيلان؛
        الوزن الصرفي (فاعلة) ملائم للوظيفة الوصفية؛
        تحقق معايير بوابة الجودة الستة
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: >-
        الصيغة السائدة في الاستعمال التعليمي العربي على امتداد الوطن العربي؛
        "فارغة" من ف-ر-غ تُصوّر المجموعة كوعاء في حالة فراغ تام —
        تصوير مكاني/وجودي يختلف عن "خالية" التي تؤكد البراءة الأصلية من المحتوى دون إيحاء بوعاء مُفرَّغ
      example: >-
        يُثبت المعلم في درس نظرية المجموعات أن المجموعة الفارغة لا تحوي أي عنصر،
        وأن قوتها العددية تساوي صفراً بتعريف قوة المجموعة.

    - lemma: فئة خالية
      source: step05
      decision: removed
      decision_reason: >-
        "فئة" (class) و"مجموعة" (set) مصطلحان متمايزان في نظرية المجموعات الرسمية
        (منظومة ZF وغيرها تميز تمييزاً صريحاً بين class وset)؛
        إدراجها في هذه المجموعة الترادفية يُقحم التباساً مفهومياً بين المصطلحين
        ويُربك الاستخدام التخصصي الرياضي الدقيق؛
        المصطلح ملائم للسياق التربوي الأولي فحسب، وليس للمصطلحية الرياضية الرسمية
      step05_citation: "«فئة لا تحتوي على أية عناصر» — مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"

    - lemma: المجموعة الصفرية
      source: step05
      decision: removed
      decision_reason: >-
        لم تُوجد في أي معجم رياضي موحّد ضمن قاعدة البيانات المعجمية (760,660 مدخل)؛
        فشلت اختبار التثبيت المعجمي فشلاً تاماً؛
        ليست مُثبَّتة في الاستعمال التخصصي الرياضي العربي الموثّق —
        الصيغتان المعياريتان (مجموعة خالية / مجموعة فارغة) تؤديان المعنى بكفاءة
      step05_citation: لم تُوجد في قاعدة البيانات — مقترح من المعرفة اللغوية

  synset_flags:
    definition_review_needed: true

step3_definition:
