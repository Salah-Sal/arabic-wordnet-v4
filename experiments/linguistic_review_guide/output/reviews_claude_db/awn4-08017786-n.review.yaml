  current_definition: "مجموعة فارغة؛ مجموعة ليس لها أعضاء"
  assessment:
    decision: revise
    reason: >-
      التعريف الحالي دائري — يستخدم "مجموعة فارغة" وهي إحدى لمّات المجموعة الترادفية ذاتها؛
      فضلاً عن أنه يستعمل "أعضاء" بدلاً من "عناصر" الذي هو المصطلح الأدق
      في نظرية المجموعات الرياضية (elements لا members)
  authored_definitions:
