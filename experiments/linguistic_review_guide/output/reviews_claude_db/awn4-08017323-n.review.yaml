step0_evidence:
  per_lemma:
    - lemma: "محل هندسي"
      confirm:
        - text: "«محلّ هندسي» — المقابل العربي الموحَّد للمصطلح الإنجليزي locus في مجال الرياضيات والفلك"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«محلّ هندسي» — المقابل العربي الموحَّد للمصطلح الإنجليزي locus في مجال الفيزياء العامة والنووية"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«المحل الهندسى لاستجابة التردد» — frequency response locus; Nyquist plot"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«المحل الهندسى الطيفى» — spectrum locus"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«مُنشِئ المنحنِي: المحلُّ الهندسي لمركز الانحناء (ر).» — evolute"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) مكان؛ موضع؛ محلّ (2) مركز ثِقْل أو نشاط (3) المحلّ الهندسي (ر).»"
          source: "المورد الحديث (2008)"
          addition: "يُظهر أن locus الإنجليزية أوسع من المعنى الهندسي — له معنيان مادي وإيحائي (المعنى الأول والثاني) بينما التعريف الحالي يُغطي المعنى الثالث فحسب؛ هذا يُقيّد مجال المجموعة بالاستعمال الرياضي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "موضع"
      source_section: "step5_english_bridge"
      evidence_citation: "«مَوضِع [ج:مَواضِع]» — locus NA — المعجم الطبي الموحد (2009)"
      justification: "يُستخدم «موضع» مقابلاً لـ locus في السياقَين الطبي والجيني (موضع المورث = gene locus)؛ يُشكّل بديلاً مُعجمياً محتملاً من جذر و-ض-ع"
    - lemma: "موقع المورث"
      source_section: "step5_english_bridge"
      evidence_citation: "«مَوضِع المورِّث: مكان أو موقع وجود مورث معين على الصبغيّ، ويتموضع فيه أيّ أليل للمورث» — المعجم الموحد لمصطلحات علم الوراثة (2009)"
      justification: "يدل على «locus» بمعنى موقع مُحدَّد على الكروموسوم يتّسم بشرط محدد — بنيته الدلالية مشابهة للمحل الهندسي (موقع + شرط)"
  knowledge_candidates:
    - lemma: "موضع هندسي"
      justification: "تركيب وصفي بالقياس على «محل هندسي» — آلية التوليد: تركيب وصفي (موضع + هندسي) — يُحيل إلى نفس البنية الدلالية لكن بـ«موضع» الأكثر شيوعاً في المعاجم الحديثة للعلوم"
    - lemma: "مجمع النقاط"
      justification: "اشتقاق تركيبي إضافي — آلية التوليد: تركيب إضافي (مجمع + النقاط) — يُصرّح بالجنس القريب (مجموعة) والمادة (نقاط)؛ لكنه تركيب وصفي حر قد لا يكون مسكوكاً"
  generation_notes: "أسفر الجسر الإنجليزي عن نتائج طبية وجينية لـ locus لا هندسية-رياضية محضة؛ المصطلح الرياضي الموثَّق في قاعدة البيانات هو «محل هندسي» فحسب. البحث الكلامي (FTS) لم يكشف عن بديل رياضي مسجَّل."

step1_lemma_validation:
  per_lemma:
    - lemma: "محل هندسي"
      decision: confirmed
      decision_reason: "مصطلح موحَّد في معجمَي ALECSO للرياضيات والفيزياء وموسوعة الكهرباء الدولية IEC؛ تركيب وصفي مستقر عبر عقود من الاستعمال العلمي العربي. وزن «محلّ» (اسم مكان على مَفْعَل من حلّ-يحلّ) يُناسب الدلالة المكانية/المجموعاتية المجردة. كلا المكوِّنَين فصيح أصيل؛ المصطلح يجيز الاشتقاق: «محلات هندسية»، «الاستعمال المحلّي»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "اللمّة وحيدة في المجموعة؛ تُقيَّد بالدلالة الرياضية المجردة (مجموعة نقاط أو خطوط تُحقق شرطاً معيَّناً) — يتمايز «محل هندسي» عن «موضع» و«مكان» اللذَين يدلاّن على الموقع المادي الفيزيائي، وعن «موضع المورث» في علم الوراثة الذي يدل على موقع جيني محدد على الكروموسوم لا مجموعة هندسية"
      example: "الدائرةُ هي المحلُّ الهندسيُّ لجميع النقاط التي تبعد مسافةً ثابتة عن نقطة مركزية، إذ تُحقق كلّ نقطة على محيطها شرط تساوي البُعد."

    - lemma: "موضع"
      source: step05
      decision: removed
      decision_reason: "لفظ عام متعدد الدلالات (موقع مادي، تشريحي، جيني، لساني) — لم يرد في أي معجم رياضي بمعنى المحل الهندسي؛ يفشل اختبار التثبيت المعجمي في الحقل الرياضي. وبوابة الجودة: «موضع» وحده لا يُلبّي شرط الملاءمة (لا يحمل دلالة مجموعة النقاط وِفق شرط رياضي)."
      step05_citation: "«مَوضِع [ج:مَواضِع]» — locus NA — المعجم الطبي الموحد (2009)"
      substitution_test:
        result: fail
      nuance_differentiation: "أعمّ من «محل هندسي» ولا يُخصّص المعنى الرياضي المجرد"

    - lemma: "موقع المورث"
      source: step05
      decision: removed
      decision_reason: "مصطلح جيني متخصص (gene locus = موقع الجين على الكروموسوم) — مفهوم مختلف عن المحل الهندسي الرياضي؛ يفشل اختبار الإبدال في السياق الرياضي. استعمال «موقع المورث» بمعنى المحل الهندسي يُفضي إلى خلط بين الدلالتَين."
      step05_citation: "«مَوضِع المورِّث: مكان أو موقع وجود مورث معين على الصبغيّ» — المعجم الموحد لمصطلحات علم الوراثة (2009)"
      substitution_test:
        result: fail
      nuance_differentiation: "يدل على locus بمعناه الجيني (موقع على الكروموسوم) لا الهندسي (مجموعة نقاط)"

    - lemma: "موضع هندسي"
      source: step05
      decision: removed
      decision_reason: "مقترح معرفي غير موثَّق في أي معجم أو استعمال تخصصي رياضي؛ يفشل اختبار التثبيت المعجمي — الاستعمال العلمي العربي استقرّ على «محل هندسي» حصراً"
      step05_citation: "لم يُعثر على توثيق معجمي — مقترح بالقياس على «محل هندسي»"
      substitution_test:
        result: fail
      nuance_differentiation: "يُعيد صياغة المصطلح المستقر دون إضافة دلالية — مقترح لا مُسكّ"

    - lemma: "مجمع النقاط"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر — يفشل اختبار السكّ: يمكن إبداله بـ«مجموعة النقاط» أو «تجمّع النقاط» دون أن يتغير المعنى، مما يُثبت أنه وصف حر لا مصطلح مسكوك"
      step05_citation: "لم يُعثر على توثيق معجمي — مقترح معرفي"
      substitution_test:
        result: fail
      nuance_differentiation: "تركيب وصفي حر لا قيمة مصطلحية له مستقلة"

step3_definition:
  current_definition: "مجموعة كل النقاط أو الخطوط التي تحقق شروطاً محددة أو تتحدد بها"
  assessment:
    decision: retain
    reason: "التعريف دقيق ومصطلحي — يحتوي جنساً قريباً صريحاً (مجموعة كل النقاط أو الخطوط) وفصلاً مميّزاً واضحاً (التي تحقق شروطاً محددة أو تتحدد بها). لا تعارض مع أي دليل معجمي؛ المعاجم التخصصية اقتصرت على المقابل الترجمي دون أن تُعرِّف. التعريف الإنجليزي المقابل مطابق ولا دليل على ضرورة التعديل."

