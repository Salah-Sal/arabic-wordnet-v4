      confirm:
        - text: "«طبقة رقيقة» [thin layer]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2: بناء-تجارة (1999)"
        - text: "«طبقة رقيقة» [thin layer]"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
        - text: "«ضئيلة السمك»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«لا تتجاوز سماكتها الميلمترات والتي يتم ملاحظتها في عينة غضارية»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«طبقة رقيقة» [thin seam]"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "توسيع الدلالة نحو الطبقة الجيولوجية الرقيقة (seam) — أخص من الطلاء/الغطاء الرقيق العام"
        - text: "«طبقة رقيقة» [thin seam]"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
          addition: "تخصيص بالسياق الجيوفيزيائي — دلالة الطبقة الرسوبية الرقيقة"

    - lemma: "غشاء"
      confirm:
        - text: "«الغِشَاءُ: جسم منتج من لِيف عصباني غير محسوس قَلِيل الثخن»"
          source: "معجم مقاليد العلوم للسيوطي (ت. 1505م)"
        - text: "«(الغشاء) الغطاء (ج) أغشية»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
        - text: "«طبقة رقيقة جداً كتلك التي تغلف فقاعة الصابون»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«غشاء» [film]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1: طباعة-كهرباء (1996)"
      expands:
        - text: "«الغِشاء: ما يغشَى الشيء ويغطيه ومنه غشاء القلب والسيف وغيره»"
          source: "التعريفات الفقهية للبركتي (ت. 1975م)"
          addition: "تعميم الغشاء ليشمل كل غطاء عضوي أو غير عضوي — أوسع من الطبقة الرقيقة وحدها"
        - text: "«حاجز رقيق يسمح بمرور جسيمات ذات حجم معين أو ذات خاصية فيزيائية أو كيميائية معينة»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "بُعد الانتقائية النفاذية — وظيفة الغربلة الجزيئية غائبة تماماً عن تعريف المجموعة"
        - text: "«سطح مشدود، مرن، ثنائي المحور، يُستخدم في أجهزة قياس الضغط»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "البُعد الهندسي الخاص (الحجاب الحاجز في أجهزة قياس الضغط) — معنى تقني مستقل"
      peripheral_observations:
        - "المعنى البيولوجي/الطبي لـ«غشاء» (membrane = حاجز نصف نافذ) — مفهوم مستقل يستحق مجموعة ترادفية منفصلة"
        - "المعنى التشريحي (غشاء الخلية، غشاء مخاطي) يختلف جوهرياً عن مفهوم الطلاء الرقيق العام"
        - "«غشاء» = web في علم الأحياء (الغشاء بين أصابع الطيور المائية) — معنى مغاير تماماً"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رقّ"
      source_section: "step5_english_bridge"
      evidence_citation: "«رِقّ» [film] — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      reasoning: "مصطلح عربي تقني مُسكوك في معجم الفيزياء الموحَّد لمعنى «film». آلية التوليد: إحياء لفظ كلاسيكي ممات (الرَّق = الجلد الرقيق للكتابة عليه) باستعماله مجازاً للطبقة الرقيقة في الفيزياء (مشابهة وظيفية: كلاهما طبقة رقيقة ذات وظيفة تسجيلية/حاجزة). الجذر ر-ق-ق منتج جداً: رق، رقاقة، رق رهيف، رق التصوير."
    - lemma: "رقاقة"
      source_section: "step5_english_bridge"
      evidence_citation: "«رقاقة، غشاء» [film] — المعجم الموحد لمصطلحات الكيمياء (1992)"
      reasoning: "مصطلح عربي مُسكوك في معجم الكيمياء مقترناً مع «غشاء» لمعنى «film». صيغة رُقاقة (فُعَالة) من جذر ر-ق-ق تدل على الورقة الرقيقة. آلية التوليد: اشتقاق على صيغة التصغير/النوعية."
  knowledge_candidates:
    - lemma: "قشرة"
      reasoning: "المورد الحديث (2008) يُعطي «القِشْرة: طبقة رقيقة» كأحد مقابلات «film» في معنى الطبقة السطحية. آلية التوليد: إزاحة دلالية (مجاز) — استعارة معنى القشرة الخارجية الرقيقة لأي طبقة رقيقة. الجذر ق-ش-ر: قشرة، يقشر، مقشرة."
  generation_notes: "الجذور الدلالية المركزية للتعريف: غ-ش-ي (التغطية)، ر-ق-ق (الرقة)، ط-ل-و (الطلاء). أبرز الألفاظ المستخرجة من الجسر الإنجليزي: رق (فيزياء)، رقاقة (كيمياء)، غشاء رقيق (هندسة مياه)."

step1_lemma_validation:
  per_lemma:

    - lemma: "طبقة رقيقة"
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبار السكّ — إبدال «رقيقة» بـ«نحيلة» أو «رفيعة» يحفظ المعنى كاملاً مما يدل على أنه وصف تحليلي لا مصطلح مسكوك؛ فضلاً عن تطابقه شبه التام مع تعريف المجموعة مما يُفقده قيمته كلمّة مستقلة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        type: وصفي
        accepted: false
      substitution_test:
        result: fail
        failure_sentences:
          - original: "تُغطَّى الأسطح المعدنية بطبقة رقيقة واقية"
            substituted: "تُغطَّى الأسطح المعدنية بطبقة نحيلة واقية"
            preserved_meaning: true
            why_failed: "«نحيلة» و«رفيعة» بدائل مقبولة تامة — المركب وصفي حر لا مصطلح"
      nuance_differentiation: "لا تمييز دلالي مستقل — المركب وصف للمفهوم ذاته لا لمّة تُضيف ظلاً دلالياً مميزاً؛ «غشاء» يؤدي المعنى باقتصاد أكبر وبُعد دلالي إضافي"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غشاء"
      decision: confirmed
      decision_reason: "أدلة مؤكّدة كلاسيكية وحديثة متعددة — لمّة عربية أصيلة مستعملة في المعاجم التقنية والطبية والهندسية والفيزيائية؛ بوابة الجودة: فصيح متداول، يسير النطق، ملائم، تراثي أصيل، جذر إنتاجي (غشَّى، غاشٍ، مُغشًّى، أغشية)"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يؤكد بُعد التغطية والإحاطة — يُستعمل تحديداً للطبقة ذات الوظيفة الحاجزة أو الكاسية (غشاء القلب، غشاء الخلية، الغشاء الواقي)؛ يختلف عن «رقّ» في كونه يتضمن دلالة الإحاطة لا مجرد الرقة المادية"
      example: "يُغطِّي غشاءٌ رقيقٌ شفافٌ سطحَ العدسةِ الضوئيةِ لتقليل انعكاس الضوء وتحسين نفاذيتها"

    - lemma: "رقّ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تقني مُسكوك في معجم الفيزياء الموحَّد (1989) — عربي أصيل، جذر ر-ق-ق إنتاجي جداً، إحياء للفظ الكلاسيكي الممات بمعنى جديد؛ بوابة الجودة: مستعمل عند المتخصصين في الفيزياء، يسير النطق (مقطع واحد)، ملائم دلالياً، تراثي (الرَّق = الجلد الرقيق)، يشتق منه: رقَّق، ترقيق، رقيق، رقاقة"
      step05_citation: "«رِقّ» [film] — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      substitution_test:
        result: pass
      nuance_differentiation: "يؤكد بُعد الرقة المادية والنعومة الفيزيائية — أقرب للاستعمال الفيزيائي/التقني (رق رهيف = thin film، رق التصوير = photographic film)؛ يختلف عن «غشاء» في غياب دلالة الوظيفة الحاجزة أو الإحاطة العضوية"
      example: "يُرسَّب رقٌّ رفيعٌ من نيتريد السيليكون على أسطح الخلايا الشمسية لتحسين كفاءة التحويل الضوئي"
      actions:
        - command: create_entry
          params:
            lemma: "رقّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03343593-n"

    - lemma: "رقاقة"
      source: step05
      decision: removed
      decision_reason: "أخص من نطاق المجموعة — «رقاقة» تدل على الورقة الرقيقة القائمة بذاتها (رقائق السيليكون، الرقاقة البلاستيكية) لا على الطلاء الرقيق الكاسي لسطح ما؛ الإبدال بـ«غشاء» في سياق الطلاء يفشل جزئياً"
      step05_citation: "«رقاقة، غشاء» [film] — المعجم الموحد لمصطلحات الكيمياء (1992)"

    - lemma: "قشرة"
      source: step05
      decision: removed
      decision_reason: "قاصر الملاءمة — «قشرة» تُوحي بطبقة خارجية قابلة للتقشر والانفصال الطبيعي (كقشرة الفاكهة والبيضة)، مما يُوجِد انزياحاً دلالياً سلبياً عن مفهوم الطلاء/الغشاء الرقيق الثابت؛ لا تجتاز بوابة الملاءمة"
      step05_citation: "«القِشْرة: طبقة رقيقة» — المورد الحديث (2008)"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "رقّ"
      reason: "مصدر: الخطوة ٠٫٥ — مصطلح فيزيائي تقني مُسكوك لمعنى «film»"
      via_command: create_entry + add_sense

