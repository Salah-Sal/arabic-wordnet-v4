step0_evidence:
  per_lemma:
    - lemma: "فترة"
      confirm:
        - text: "«(1) فاصل؛ فترة فاصلة (2) فُرجة؛ فسحة [بين شيئين] (3) الفاصلة (مو) (4) الفَتْرة؛ الفاصل (ر).»"
          source: "المورد الحديث (2008)"
        - text: "«فترة مغلقة» [مقابل: closed interval]"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«فترة (ن)» [مقابل: interval]"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«فترة - فاصل: فضاء بين شيئين أو جزئين أو بين نوبتين من الزمن»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«فترة» [مقابل: interval]"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«(الفترة) الضعْف والانكسار والمدة تقع بَين زمنين أَو نبيين وفي التنزيل العزيز {يَا أهل الكتاب قد جاءكم رسولنا يبين لكم على فَتْرَة من الرسل} وفترة الحمى زمن سكونها بَين نوبتين وفترة الرخاء دور اقتصادي تنشط فيه الصناعة وترتفع الأسعار والأجور (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "المعنى الزمني (مدة بين زمنين أو حادثتين) أوسع من الخصوصية الرياضية (مجموعة أعداد بين طرفين)، ويكشف أن الاستخدام الرياضي نشأ بتوسع دلالي طبيعي من هذا الأصل"
        - text: "«وردت كلمة «فترة» في المعاجم القديمة بمعنى ما بين كل نَبِيَّين من الزمان... كما أوردتها المعاجم الحديثة بمعنى القطعة من الزمن طالت أو قصرت؛ ومن ثمَّ يمكن تصويبها»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (2003)"
          addition: "التوسع الدلالي من 'مدة بين نبيين' إلى 'قطعة من الزمن' مُقرٌّ في المعاجم الحديثة — يُسوّغ التوسع الرياضي المزيد إلى 'مجموعة أعداد بين حدّين'"
      peripheral_observations:
        - "«الفترة: سكون بعد حدة، ولين بعد شدة، وضعف بعد قوة. وعند القوم: خمود نار البداية المحرقة ببرد الطبيعة المخدرة للقوة الطلبية.» — التوقيف على مهمات التعاريف للمناوي (د. 1622م): معنى صوفي/روحاني مستقل كلياً عن الدلالة الرياضية"
        - "«الفترة: خمود نار البداية المحرقة بتردد آثار الطبيعة المخدرة للقوة الطلبية.» — كتاب التعريفات للشريف الجرجاني (د. 1413م): معنى صوفي مستقل كلياً"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "فاصل"
      source_section: "step5_english_bridge"
      evidence_citation: "«(4) الفَتْرة؛ الفاصل (ر).» — المورد الحديث (2008)"
      justification: "المورد الحديث يورد 'فاصل' بالتوازي مع 'فترة' كمعادل للـ interval في الرياضيات (ر = رياضيات)؛ جذره ف-ص-ل يحمل معنى الفصل بين شيئين مما يُقاربه من 'الفضاء بين نقطتين'"
  knowledge_candidates:
    - lemma: "مجال"
      justification: "آلية التوليد: اشتقاق وتوسع دلالي. في المعجم الرياضي ذاته يرد 'مجال مفتوح' = open interval و'مجال رأسي' = vertical interval، مما يدل على استخدام 'مجال' كعنصر في مصطلحات الفترات الرياضية. غير أن المعجم يُخصص 'مجال' المفرد = domain وليس interval، مما يُنشئ تعارضاً مصطلحياً محتملاً"
  generation_notes: "مصطلح رياضي تقني مستقر؛ الأدلة تُجمع على 'فترة' كمصطلح محوري في المعجمية الرياضية العربية (فترة مغلقة، فترة مفتوحة، فترة نصف مفتوحة)"

step1_lemma_validation:
  per_lemma:
    - lemma: "فترة"
      decision: confirmed
      decision_reason: "مصطلح رياضي مُعتمَد في مصطلحات ALECSO (الرياضيات والفلك: فترة مغلقة = closed interval)؛ أصل عربي خالص (ف-ت-ر) بلا اقتراض؛ التوسع الدلالي من 'مدة بين زمنين' إلى 'مجموعة أعداد بين حدّين' طبيعي وتدريجي ومُقرّ في المصادر الحديثة؛ وزن فَعْلة مناسب للمصادر الدالة على النوع أو الحالة؛ اشتقاقية عالية (فترات، فترة مغلقة، فترة مفتوحة، فترة نصف مفتوحة)"
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "لمّة وحيدة في المجموعة — تُمثّل المفهوم الكلي للفترة الرياضية بما يشمل أنواعها (المفتوحة والمغلقة والنصف مفتوحة)؛ يتميز استخدامها الرياضي عن استخدامها الزمني (فترة = مدة) بانتمائها إلى حقل التوبولوجيا والتحليل الحقيقي إذ تصف كياناً رياضياً مجرداً لا امتداداً زمنياً"
      example: "الفترة المغلقة [0, 1] تضم جميع الأعداد الحقيقية الواقعة بين الصفر والواحد شاملةً طرفيها، بينما تستثنيهما الفترة المفتوحة (0, 1)."

    - lemma: "فاصل"
      source: step05
      decision: removed
      decision_reason: "في المعاجم التقنية المتخصصة، فاصل يُقابَل بـ separator وspacer وjoint وinterlude — لا بـ interval كمصطلح رياضي مستقل. فشل اختبار التثبيت المعجمي: 'الفاصل المغلق' و'الفاصل المفتوح' لا يردان في المصطلحات الرياضية بخلاف 'الفترة المغلقة' و'الفترة المفتوحة'. دلالة الفَصْل والحاجزية تُغاير دلالة المجموعة المتصلة المنحصرة بين حدّين."
      step05_citation: "«(4) الفَتْرة؛ الفاصل (ر).» — المورد الحديث (2008)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "فاصل يدل على الشيء الفاصل/الحاجز بين جزأين، مُركِّزاً على عملية الفصل لا على المجموعة المنبثقة عن الانحصار بين طرفين — التركيز الدلالي مختلف جذرياً"

    - lemma: "مجال"
      source: step05
      decision: removed
      decision_reason: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) يُخصص 'مجال' = domain لا interval؛ استخدامه في 'مجال مفتوح' = open interval تركيب إضافي لا يُكسب المفرد معنى الفترة. إيثار العربي يُقدّم 'فترة' الأرسخ في المصطلحية الرياضية. قبول 'مجال' بديلاً ينشئ اشتراكاً لفظياً مع 'domain' وهو مفهوم رياضي آخر."
      step05_citation: "«مجال مفتوح» [مقابل: open interval] — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "مجال يدل على المجال/النطاق/الحقل — استخدامه للفترة المفتوحة ثانوي ومرتبط بتركيب إضافي وليس باستقلالية مصطلحية"

step3_definition:
  current_definition: "مجموعة تحتوي على جميع النقاط (أو جميع الأعداد الحقيقية) الواقعة بين نقطتي نهاية معطيتين"
  assessment:
    decision: retain
    reason: "التعريف يستوفي معياري الجنس القريب (مجموعة — بما يتطابق مع المشتمِل المباشر مجموعة رياضية) والفصل المميز (جميع النقاط الواقعة بين نقطتي نهاية معطيتين)؛ يتطابق مع التعريف القياسي في التحليل الرياضي والحساب التفاضلي"
  scope_note: "التعريف يصف المفهوم العام دون تقييد نوع الفترة (مفتوحة/مغلقة/نصف مفتوحة) — وهذا مقصود إذ تُمثّل هذه المجموعة الترادفية المفهوم الجامع للفترة الرياضية بجميع أنواعها"

