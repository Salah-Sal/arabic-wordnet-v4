        - text: "«العَرَضُ: ما يطرأ ويزول من مرض ونحوه ... (في الطب): ما يحسُّه المريض من الظواهر الدَّالة على المرض»"
          source: "المعجم الوسيط"
          addition: "معنى طبي (symptom) مستقل تماماً عن معنى العرض العلني"
