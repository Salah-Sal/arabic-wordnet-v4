step0_evidence:
  per_lemma:
    - lemma: "تميمة الحظ"
      evidence_status: "no_material_found"

    - lemma: "جالب للحظ"
      confirm:
        - text: "«جالبُ الحظّ: شخص أو حيوان أو شيء يُظنّ أنه يجلب الحظّ السعيد»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«جالبُ الحظّ: شخص أو حيوان أو شيء يُظنّ أنه يجلب الحظّ السعيد»"
          source: "المورد الحديث (2008)"
          addition: "التعريف يُوسِّع المفهوم ليشمل الأشخاص والحيوانات (نمط الماسكوت) لا الأشياء المادية وحدها، وهو مقابل لـ mascot لا لـ good luck charm تحديداً"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تميمة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«تَمِيمة: التعويذة التي تعلق في العنق لدفع العين» — موسوعة السلطان قابوس لأسماء العرب؛ «تميمة = amulet» — مسرد الجغرافيا والتاريخ (ALECSO) ومسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
      justification: "اسم عربي كلاسيكي مسكوك للشيء المادي المُعلَّق للوقاية وجلب الحظ؛ آلية التوليد: إحياء لفظ تراثي راسخ"
    - lemma: "تعويذة"
      source_section: "step5_english_bridge"
      evidence_citation: "«تعويذة = charm» — مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      justification: "مقابل مباشر للمصطلح الإنجليزي charm في مسرد متخصص معتمد؛ جذرها ع-و-ذ يدل على الاستعاذة والحماية"
  knowledge_candidates:
    - lemma: "حِرْز"
      justification: "آلية التوليد: اشتقاق من جذر ح-ر-ز (الحفظ والصون)؛ معجم الصواب اللغوي يقرّ فصاحته: «الكلمة من الفصيح — الحِرْز: العوذة، ويسمى التعويذ حِرْزًا»؛ معجم اللغة العربية المعاصرة يعرّفه بـ«تميمة أو تعويذة يُكتب عليها وتُحمل لتحمِيَ حاملَها من المرض والخطر»"
  generation_notes: "المفهوم عربي أصيل ذو كثافة مصطلحية في التراث (تميمة، تعويذة، حرز، عوذة، طلسم)؛ تميمة هي المرشح الأقوى لقِدَمها وشيوعها وخلوّها من الاشتراك اللفظي في هذا الحقل الدلالي"

step1_lemma_validation:
  per_lemma:
    - lemma: "تميمة الحظ"
      decision: confirmed
      decision_reason: "تركيب إضافي عربي سليم يُخصِّص تميمة بالحظ السعيد؛ جذر تمم عربي خالص، وزن تَفْعِيلَة مناسب للأسماء الدالة على الأشياء المحسوسة ذات الوظيفة؛ لا إشكالية اقتراض ولا ترجمة حرفية عمياء؛ جميع معايير بوابة الجودة مستوفاة (شائع فصيح، يسير النطق، مناسب للمفهوم، تراثي الجذر، قابل للاشتقاق: تمائم الحظ)"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "تخص التميمة التي يُقتنى أو يُعلَّق لغرض جلب الحظ تحديداً، بخلاف تميمة المجردة التي قد تُعلَّق لدرء العين أو السحر دون تخصيص جلب الحظ"
      example: "علّق البحّار تميمةَ حظٍّ في صارية سفينته قبيل إبحاره نحو المجهول"

    - lemma: "جالب للحظ"
      decision: removed
      decision_reason: "تركيب وصفي حر من اسم فاعل وجار ومجرور؛ يفشل اختبار التثبيت المعجمي إذ يُبدَّل بـ'جالب للسعادة' أو 'جالب للبركة' دون أثر دلالي؛ ليس اسماً لفئة من الأشياء بل وصفاً وظيفياً؛ المقابل المعجمي المرصود (entry 700326) يترجم mascot لا good luck charm، مما يكشف تباعداً دلالياً عن مفهوم المجموعة"
      evidence_assessment:
        case: expands
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
      nuance_differentiation: "يصف خاصية وظيفية (جلب الحظ) ولا يُسمّي فئة من الأشياء؛ أشمل من تميمة الحظ إذ يصلح نعتاً للأشخاص والحيوانات أيضاً (ماسكوت)"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تميمة"
      source: step05
      decision: confirmed
      decision_reason: "موثقة في مسارد متخصصة متعددة كمقابل لـ amulet وتقع في صميم الحقل الدلالي للمجموعة؛ استيفاء معايير بوابة الجودة الست: شائعة فصيحة، يسيرة النطق، مناسبة للمفهوم، تراثية الجذر، عربية خالصة، قابلة للاشتقاق (تمائم، تُميمة)"
      step05_citation: "«تَمِيمة: التعويذة التي تعلق في العنق لدفع العين» — موسوعة السلطان قابوس لأسماء العرب؛ «تميمة = amulet» — مسرد الجغرافيا والتاريخ ومسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
      substitution_test:
        result: pass
      nuance_differentiation: "أعم من تميمة الحظ — تشمل أي تميمة مادية وقائية أو تيمّنية دون تخصيص الغرض؛ تُغطي المفهوم من جهة الجسم المادي الملموس"
      example: "وجد علماء الآثار في المقبرة الفرعونية تميمةً من الذهب تعود إلى الألف الثالثة قبل الميلاد"
      actions:
        - command: create_entry
          params:
            lemma: "تميمة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03013287-n"

    - lemma: "تعويذة"
      source: step05
      decision: removed
      decision_reason: "تعويذة تدل على الرقية المكتوبة أو الملفوظة لا على الشيء المادي يُحمل تحديداً لجلب الحظ؛ يفشل اختبار الاستبدال في السياقات التي تخصّ الحظ: 'أمسك تعويذتَه قبل المباراة' لا تحمل دلالة الحظ بوضوح كما تحملها 'تميمة الحظ'"
      step05_citation: "«تعويذة = charm» — مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"
      substitution_test:
        result: fail
      nuance_differentiation: "تختص بالرقية أو النص المكتوب بهدف الحماية أو الاستعاذة، وليست بالضرورة شيئاً مادياً مُقتنى لجلب الحظ"

    - lemma: "حِرْز"
      source: step05
      decision: removed
      decision_reason: "الحرز وقائي دلالةً (يحمي من المرض والخطر) لا إيجابي (يستجلب الحظ)؛ الدلالة الوقائية المُسجَّلة في معجم اللغة العربية المعاصرة تُفرقه جوهرياً عن good luck charm"
      step05_citation: "«تميمة أو تعويذة يُكتب عليها وتُحمل لتحمِيَ حاملَها من المرض والخطر» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      substitution_test:
        result: fail
      nuance_differentiation: "يختص بدرء الضرر المتوقع (الوقاية)، بينما تميمة الحظ إيجابية الغاية (استجلاب الخير)؛ الفرق بين نفي السلبي وإثبات الإيجابي"

  added_lemmas:
    - lemma: "تميمة"
      reason: "مصدر: الخطوة ٠٫٥ — اسم عربي كلاسيكي مسكوك موثق كمقابل لـ amulet في مسارد متخصصة متعددة"
      via_command: create_entry + add_sense

