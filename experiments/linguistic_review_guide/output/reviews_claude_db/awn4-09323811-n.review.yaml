step0_evidence:
  per_lemma:
    - lemma: "وابل"
      contradicts:
        - text: "«الوابل: كبار المطر لأنه يشتد وقعه على الأرض، وكل ثقيل وبيل ومنه أخذا وبيلا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الأصلي المُثبَت هو المطر الشديد الكبير القطر، لا الأشياء المرمية عبر الهواء"
        - text: "«(الوابل) الْمَطَر الشَّديد الضخم الْقطر وَرجل وابل جواد يبل بالعطايا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "التعريف المعجمي يحصر الوابل الاسمي في المطر — تعريف المجموعة لا ذِكر فيه للمطر"
        - text: "«المطر الشديد الضَّخْم القَطْر»"
          source: "المعجم الوسيط"
          conflict: "مطابق للمصدر السابق — المعنى محدد بالمطر لا بالأشياء المرمية"
        - text: "«وابِلٌ: هو الثقيل الغليظ جدّا، ومن هذا قيل للمطر الشديد الضخم القطر العظيم الوابل»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "يشرح الوابل بما هو مطر عظيم — لا إشارة إلى أشياء تُرمى بفعل فاعل"
      expands:
        - text: "«وكل ثقيل وبيل ومنه أخذا وبيلا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الجذر و-ب-ل دلالته الأصيلة الثِّقَل والشِّدة — وهو ما يتيح التوسع المجازي نحو كل ما يُقذف بقوة وكثافة"
        - text: "«هو الثقيل الغليظ جدّا، ومن هذا قيل للمطر الشديد الضخم القطر العظيم الوابل»"
          source: "معجم البلدان لياقوت الحموي"
          addition: "الوابل اشتُق من الثِّقَل والغلظ ثم أُطلق على المطر — هذا الاشتقاق التاريخي يفسّر التوسع المجازي اللاحق نحو وابل الطلقات والسهام"
        - text: "«وابِلٌ [من طَلَقاتٍ نارية] / سيل [من الأسئلة والانتقادات]»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت استعمال وابل في العربية المعاصرة مجازاً للدلالة على ما يُقذف أو ينهمر بكثرة وقوة من أشياء غير المطر"
        - text: "«(1) «أ» وابل [من المطر أو البَرَد لا يدوم طويلًا]. «ب» الوابل: سَيْل أو مقدار كبير a shower of questions»"
          source: "المورد الحديث (2008)"
          addition: "يُدرج المورد الحديث الوابل ترجمةً لـ shower بمعنييه المعجميَّين: الجوي والمجازي المُعمَّم"
      peripheral_observations:
        - "«وَرجل وابل جواد يبل بالعطايا» — المعجم الوسيط: معنى مستقل تماماً (الرجل الكريم الجواد) لا صلة له بتعريف المجموعة"
        - "«(وابل) الأمر واظب عليه» — المعجم الوسيط: فعل وابل الرباعي بمعنى واظب — معنى فعلي مستقل كلياً"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رشقة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الرِّشْق: وابل من السهام أو الرصاصات أو القذائف [ينطلق في وقت واحد]» — المورد الحديث (2008)؛ و«رَشْقَة: volley» — المعجم الطبي الموحد (2009)"
      justification: "رشقة هي المقابل الكلاسيكي العربي الدقيق لمفهوم «عدد من الأشياء تُرمى معاً بقوة» — مشتقة من جذر ر-ش-ق (الرَّمْي بالنَّبْل وغيره، آلية اشتقاق: المصدر المرّي فَعْلَة بمعنى مرة الرمي)"
  knowledge_candidates:
    - lemma: "زخّة"
      justification: "اشتقاق من جذر ز-خ-خ — مستعملة في العربية التقنية المعاصرة بمعنى 'دفعة/سيل' (زخة جسيمات، زخة شهاب: meteor shower) — قد تُناسب المفهوم لكن دلالتها الراسخة أقرب إلى الظواهر الجوية والعلوم الطبيعية (آلية التوليد: اشتقاق)"
  generation_notes: "الجذر ر-ش-ق يعطي المصطلح الأدق — القاموس المحيط: «فإذا رَمَوْا كلُّهُم في جِهَةٍ قالوا: رَمَيْنَا رِشْقاً» — هذا يطابق تعريف المجموعة تماماً. وابل من الجذر و-ب-ل يغطي المفهوم مجازاً لا أصالةً."

step1_lemma_validation:
  per_lemma:
    - lemma: "وابل"
      decision: confirmed
      decision_reason: "مستعمَل في العربية المعاصرة بمعنى الوابل المجازي من الطلقات والسهام — ثابت في المورد الحديث. من حيث بوابة الجودة: اللفظ تراثي خالص، يسير النطق، مشتق من جذر منتج (وَبَلَ/وابل/وَبِيل). لكن التعريف الحالي ترجمة حرفية تحتاج مراجعة. الوزن الصرفي (فَاعِل) أصله صفة مشبهة/اسم فاعل — استعماله اسماً جامداً للمفهوم صحيح لغةً بحكم الغلبة والاستعمال."
      evidence_assessment:
        case: contradicts
      substitution_test:
        result: pass
      nuance_differentiation: "وابل يحمل دلالة الانهمار المتواصل والكثرة الغامرة المستعارة من المطر الغزير — يبرز بُعد الإحاطة والشدة والاستمرار؛ بخلاف رشقة التي تدل على الإطلاق الجماعي الآني المتزامن"
      example: "تحصّن الجنود خلف المتاريس بعد أن أمطرهم العدو وابلاً من الرصاصات والقنابل."

    - lemma: "رشقة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح كلاسيكي أصيل موثّق في أمهات المعاجم العربية — القاموس المحيط وغريب الحديث لأبي عبيد والمعجم الطبي الموحد. يصف بدقة مفهوم «كمية من المقذوفات تُطلق في وقت واحد». الوزن الصرفي (فَعْلَة) للمرة الواحدة من الرمي — مناسبة صرفية مثالية. يُسر التداول وتراثية وعربية واشتقاقية: رَشَق/رَشِيق/رَشَاقة/رَشَّاق. اجتاز اختبار الإبدال. اجتاز اختبار التثبيت المعجمي."
      step05_citation: "«الرَّشْقُ: الرَّمْيُ بالنَّبْلِ وغيرِه... فإذا رَمَوْا كلُّهُم في جِهَةٍ قالوا: رَمَيْنَا رِشْقاً» — القاموس المحيط للفيروزآبادي"
      substitution_test:
        result: pass
      nuance_differentiation: "رشقة تدل تحديداً على الإطلاق الجماعي المتزامن لعدد من المقذوفات في آنٍ واحد — أدق وأخص من وابل؛ وابل يبرز الكثرة والشدة المستمرة، أما رشقة فتبرز التزامن وصدور الرمي دفعةً واحدة"
      example: "أطلق الرماةُ رشقةً من السهام صوب أسوار الحصن في لحظة واحدة."
      actions:
        - command: create_entry
          params:
            lemma: "رشقة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09323811-n"

    - lemma: "زخّة"
      source: step05
      decision: removed
      decision_reason: "دلالتها الراسخة في المعاجم التقنية المعاصرة مرتبطة بالظواهر الجوية والفيزيائية (زخة مطرية/زخة جسيمات/زخة شهاب) — لا تصلح مصطلحاً مستقلاً لمفهوم «الأشياء المرمية بفعل فاعل»؛ فضلاً عن أن دلالتها أقرب إلى مفهوم مختلف (shower) وليس (hail of thrown objects)"
      step05_citation: "«زخة مطرية: downpour» — المعجم الموحد لمصطلحات الطاقة المتجددة (1996)؛ «زخّة جسيمات: shower particles» — المعجم الموحد للفيزياء (1989)"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "رشقة"
      reason: "مصدر الخطوة ٠٫٥ — مصطلح كلاسيكي أصيل يدل على الرمي الجماعي المتزامن، وهو الأدق للمفهوم المقصود"
      via_command: create_entry + add_sense

