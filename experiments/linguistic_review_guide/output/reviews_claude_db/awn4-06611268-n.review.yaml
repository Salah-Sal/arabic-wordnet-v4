step0_evidence:
  per_lemma:

    - lemma: "رِسَالَة"
      confirm:
        - text: "«ما يُرْسَلُ, أَوْ: ما يَحْمِلُه الرَّسُولُ»"
          source: "المعجم الكبير"
        - text: "«الوِسَاطَةُ بَيْنَ المُرْسِلِ والمُرْسَلِ إِلَيْهِ في إِيصالِ الأَخْبَارِ»"
          source: "المعجم الكبير"
        - text: "«في الأصل الكلام الذي أُرسل إلى الغير»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«انبعاث أمر من المرسل إلى المرسل إليه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«تبليغُ أحد كلامَ الآخر من دون أن يكون له دَخْل في التصرف للآخر»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«معلومات مكتوبة أو منطوقة يريد المتكلم أن يتقاسمها مع مخاطب معين»"
          source: "مسرد الإعلام والتواصل — ArabTerm"
        - text: "«خبرٌ مُرسل يوجه إلى مُرسل إليه عبر تشفيرات قصد التواصل السردي والشعري لأدب يتوجه إلى قارئ محتمل»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«رسالة الرسول: ما أَمر بتبليغه عن الله ودعوته الناس إلى ما أُوحِيَ إليه»"
          source: "المعجم الوسيط"
          addition: "المعنى الديني (النبوة والتبليغ) مستوى دلالي مختلف — الرسالة هنا مهمة المرسَل لا مضمون ما يُبلَّغ"
        - text: "«كتاب يشتمل على قليل من المسائل تكون في موضوع واحد، وبحث مبتكر يقدمه الطالب الجامعي لنيل شهادة عالية (محدثة)»"
          source: "المعجم الوسيط"
          addition: "المعنى الأكاديمي (الأطروحة الجامعية) ليس داخلاً في تعريف المجموعة"
        - text: "«الغَايَةُ والوَظِيفَةُ — كقولنا: رِسَالَةُ مجمع اللغة العربية كذا»"
          source: "المعجم الكبير"
          addition: "معنى الرسالة المؤسسية (المهمة/الوظيفة) — توسّع حديث في دلالة الكلمة"
        - text: "«في أدبيَّات السياسة: ما يُريدُ أن يُبَلِّغَه خِصم أو مِنافِس إلى خِصمِه أو منافِسه ممَّا فيه تَحْذِيرٌ أو تَهْدِيد»"
          source: "المعجم الكبير"
          addition: "الاستعمال السياسي يُضيّق الدلالة في اتجاه التهديد لا المحتوى العام"
      peripheral_observations:
        - "المعنى الديني (رسالة الأنبياء) والمعنى الأكاديمي (أطروحة) مستقلان تماماً عن معنى المحتوى الدلالي المقصود في المجموعة"

    - lemma: "مَضْمُون"
      confirm:
        - text: "«مَضْمُونُ الكتاب: ما في طَيِّه — مَضْمُونُ الكلام: فَحْواه وما يُفْهَمُ منه»"
          source: "المعجم الكبير"
        - text: "«المحتوى ومنه مضمون الكتاب: ما في طيه، ومضمون الكلام: فحواه وما يفهم منه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«المحتوى، ومضمون الكلام: فحواه وما يفهم منه والأمر المتأكد منه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«هو الجانب المجدي في الخطاب، وهو موضوعه ومظهره التصوري»"
          source: "مسرد الإعلام والتواصل — ArabTerm"
        - text: "«كل خطاب يتضمن جانباً ويدل على شيء ما، والمضمون هو الجانب المجدي في الخطاب وهو موضوعه ومظهره التصوري»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«من السِّلَع والأشياء: الخالي ممّا يعيبه»"
          source: "المعجم الكبير"
          conflict: "المعنى التجاري (السلعة الخالية من العيوب) بعيد تماماً عن دلالة المحتوى الدلالي — أحد معاني الجذر ض-م-ن (الضمان/الكفالة)"

    - lemma: "مُحْتَوَى"
      confirm:
        - text: "«محتوى» — translation_en: content"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) / المعجم الموحد لمصطلحات الكيمياء (1992) / مسرد الإعلام والتواصل"
        - text: "«مجموعة الخبرات الموجودة في المنهاج التربوي، والتي تحقق أهداف التعلم»"
          source: "مسرد التربية — ArabTerm"
        - text: "«محتوى» — translation_en: content(s)"
          source: "مسرد الإعلام والتواصل — ArabTerm"
      contradicts:
        - text: "«بيوتُ الناس من الوبر مجتمعة على ماء»"
          source: "المعجم الوسيط / المعجم الكبير"
          conflict: "المعنى الأصلي الكلاسيكي (الأخبية المجتمعة حول الماء) يختلف كلياً عن المعنى الحديث — الاستعمال الحديث بمعنى «content» قائم على التوسّع الدلالي"
      peripheral_observations:
        - "الاستعمال الحديث بمعنى (content) انتشر في سياقات التعليم والإعلام الرقمي والعلوم — وهو استعمال تقني معاصر ثابت في المعاجم المتخصصة"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "فَحْوَى"
      source_section: "step4_fts_keyword"
      evidence_citation: "«فحوى المفهوم: مجموع السمات الدلالية التي يتكون منها المفهوم» — المعجم الموحد لمصطلحات اللسانيات (2002) — ووردت أيضاً في تعريف مضمون: «مضمون الكلام: فحواه وما يفهم منه» — المعجم الكبير"
      justification: "كلمة عربية أصيلة من جذر ف-ح-و تعني جوهر الكلام ومستخلَصه — تعبّر عن «ما يتعلق به الشيء من معنى» وتُستعمل في الفصحى الكلاسيكية والمعاصرة في سياقات الخطاب والنص"
  knowledge_candidates:
    - lemma: "مَغْزَى"
      justification: "اشتقاق من جذر غ-ز-و (بمعنى القصد والطلب والمرمى)، وزن مَفْعَل للموضع والحدث — يُستعمل في الفصحى للدلالة على مقصود الكلام ومرماه؛ مثال: «ما مغزى هذه القصة؟» يوازي «ما يتعلق به الشيء من معنى»"
  generation_notes: "التعريف يتمحور حول ثلاثة محاور: (1) المحتوى الدلالي لما يُقال أو يُكتَب، (2) ما يُبلَّغ ويُنقَل، (3) ما يتعلق بالشيء من معنى. الجذور الدلالية المركزية: ض-م-ن (تضمين وإضمار)، ح-و-ي (احتواء)، ف-ح-و (جوهر وفحوى)"


step1_lemma_validation:
  per_lemma:

    - lemma: "رِسَالَة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة متعددة من المعاجم الكلاسيكية والحديثة — الاستعمال الحديث في «رسالة هذا العمل» مطابق لدلالة المجموعة"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز الجانبَ التواصلي المتكامل — الرسالة هي الوحدة الكلية المنقولة بين مُرسِل ومُرسَل إليه؛ أما مضمون ومحتوى فيؤكدان الجانب الدلالي الداخلي بمعزل عن سياق الإرسال"
      example: "استطاع المخرج أن يُوصِل رسالته الإنسانية إلى المشاهد من خلال أسلوب بصري موجَز وعميق."

    - lemma: "مَضْمُون"
      decision: confirmed
      decision_reason: "أدلة مؤكدة قوية من معجمين رئيسيين — التعريفات تطابق دلالة المجموعة مباشرة دون التباس"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يُركِّز على ما هو كامن داخل النص أو القول ومُستخلَص منه (ما في طيّه) — يتضمن معنى الإضمار والتأكيد الضمني؛ مضمون الكلام هو ما يُفهم منه لا ما يُصرَّح به فحسب"
      example: "أشارت الدراسة النقدية إلى أن مضمون الرواية يتجاوز الحكاية السطحية ليعكس أزمة الهوية في المجتمع الحديث."

    - lemma: "مُحْتَوَى"
      decision: confirmed
      decision_reason: "الاستعمال التقني الحديث راسخ في مجالات متعددة (تربية، إعلام، جيولوجيا، كيمياء) — الوزن الصرفي اسم مفعول من احتوى يناسب الدلالة"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "الأعم والأكثر حيادية بين لمات المجموعة — يشمل كل ما يحتويه شيء ما بصرف النظر عن القصد أو التأويل؛ يُستعمل في السياقات الرقمية والتعليمية والعلمية بكثافة"
      example: "تضع المنصات الرقمية معايير لضمان جودة محتوى ما يُنشر على صفحاتها وسلامته."

    - lemma: "فَحْوَى"
      source: step05
      decision: confirmed
      decision_reason: "كلمة عربية أصيلة مستعملة في الفصحى الكلاسيكية والمعاصرة — تجتاز اختبار الإبدال في السياقات الخطابية والأدبية"
      step05_citation: "«مضمون الكلام: فحواه وما يفهم منه» — المعجم الكبير"
      substitution_test:
        result: pass
      nuance_differentiation: "يُركِّز على الجوهر الأساسي والمعنى المستخلَص (ما يُستشفّ من الكلام) لا على كامل المحتوى — فحوى الكلام = الرسالة الجوهرية التي يرمي إليها القائل، أضيق نطاقاً من محتوى ومضمون"
      example: "فحوى ما أراد المتحدث قوله أن الإصلاح الحقيقي يبدأ من الداخل لا من الخارج."
      actions:
        - command: create_entry
          params:
            lemma: "فَحْوَى"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06611268-n"

    - lemma: "مَغْزَى"
      source: step05
      decision: removed
      decision_reason: "يدل على المقصود والعِبرة المستخلَصة والمرمى المقصود — يفشل اختبار الإبدال في سياقات المحتوى العام: لا يُقال «مغزى هذا المنهج الدراسي» ولا «مغزى هذا التقرير» — دلالته أضيق تركّز على الدرس والغاية"
      step05_citation: "«من الكلام: مقصده» — المعجم الوسيط"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "فَحْوَى"
      reason: "مصدر: الخطوة ٠٫٥ — كلمة عربية أصيلة تُعبّر عن جوهر المحتوى ومستخلَصه الدلالي"
      via_command: create_entry + add_sense


