  per_lemma:

    - lemma: "أسلوب تعليمي"
      evidence_status: "no_material_found"

    - lemma: "تعليمية"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تعليمية"
      source_section: "step4_fts_keyword"
      evidence_citation: "«تعليمي = didactic» — مسرد الفن والتسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      justification: "الصفة «تعليمي» مُثبَتة معجمياً مقابل «didactic»؛ المصدر الصناعي منها بإلحاق الياء المشددة والتاء (تعليمية) يُكوّن الاسم المجرد الدال على الخاصية، وهو النظير المورفولوجي المباشر للاحقة «-ism» الإنجليزية — آلية: اشتقاق (مصدر صناعي)"
  knowledge_candidates:
    - lemma: "وعظية"
      justification: "آلية: اشتقاق — مصدر صناعي من «وعظ» (و-ع-ظ). الوعظ في المعاجم الكلاسيكية «التذكير بالخير فيما يرق له القلب» (كتاب العين) و«التخويف والإنذار» (مقاييس اللغة)، أي تواصل مقصود به إرشاد المتلقي وتعليمه — مما يجعل «الوعظية» مرشحةً للدلالة على خاصية التواصل التعليمي"
  generation_notes: "التعريف يشير إلى خاصية مجردة للتواصل (-ism)؛ المصطلح المناسب اسم مجرد يدل على الطابع لا على الأسلوب؛ الجذور الدلالية المركزية: ع-ل-م وو-ع-ظ"

step1_lemma_validation:
  per_lemma:

    - lemma: "أسلوب تعليمي"
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختباري السكّ والتثبيت المعجمي — يمكن إبدال «تعليمي» بـ«إرشادي» أو «تربوي» ويبقى التركيب وصفاً صالحاً، مما يكشف أنه ليس مصطلحاً مسكوكاً. فضلاً عن ذلك، المفهوم المقصود (didacticism) مصدر صناعي دال على الخاصية المجردة لا على أسلوب أو منهج. لا توجد له شواهد في المعاجم الاصطلاحية ولا في الاستعمال التخصصي بهذه الصياغة بوصفه مصطلحاً ثابتاً"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "تتسم هذه القصيدة بالتعليمية"
            substituted: "تتسم هذه القصيدة بأسلوب تعليمي"
            preserved_meaning: false
            why_failed: "«أسلوب تعليمي» يصف طريقة التقديم (manner)؛ أما «التعليمية» فتدل على الخاصية الكامنة في الخطاب (quality). الإبدال بـ«أسلوب إرشادي» يُبيّن أن التركيب وصفي حر لا مصطلح مسكوك"
      nuance_differentiation: "يشير إلى طريقة في التقديم لا إلى المفهوم المجرد للطابع التعليمي؛ أضيق دلالةً من «تعليمية» ويشترط موضوعاً محدداً (أسلوب في/مع…)"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تعليمية"
      decision: confirmed
      decision_reason: "مصدر صناعي منتِج من جذر عربي أصيل (ع-ل-م) يستوفي معايير الجودة: شائع في الكتابة الأكاديمية العربية والنقد الأدبي، خفيف النطق، دقيق في مناظرة «didacticism»، اشتقاقي منتِج (تعليمي ← تعليمية)، ولا يوجد لفظ تراثي يؤدي المفهوم المجرد ذاته بنفس الصيغة"
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الخاصية المجردة للطابع التعليمي-الإرشادي في الخطاب (-ism)؛ لا تشير إلى أسلوب أو منهج بل إلى الطابع الكامن في التواصل نفسه"
      example: "تتجلى التعليمية في مقامات الحريري تجلياً واضحاً، إذ تحمل في طياتها حِكَماً وعِبَراً موجَّهةً إلى القارئ"

    - lemma: "تعليمية"
      source: step05
      decision: removed
      decision_reason: "تطابق مع اللمّة الأصلية الموجودة والمؤكَّدة أعلاه — لا داعي للإضافة"
      step05_citation: "«تعليمي = didactic» — مسرد الفن والتسلية والرياضة (ArabTerm)"

    - lemma: "وعظية"
      source: step05
      decision: removed
      decision_reason: "مقيَّد بسياق الإرشاد الديني-الأخلاقي ولا يشمل التعليمية بمفهومها الأدبي والتربوي الحديث؛ غير مُثبَّت معجمياً كمصطلح مستقل؛ فشل اختبار الإبدال في السياق التعليمي الأكاديمي. فحص الاقتراض: مشتق عربي خالص لكنه غير مسكوك في الاستعمال التخصصي"
      step05_citation: "«وعظي: إرشاد ديني Parénétique» — تكملة المعاجم العربية لرينهارت دوزي"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "تتسم هذه القصيدة بالتعليمية"
            substituted: "تتسم هذه القصيدة بالوعظية"
            preserved_meaning: false
            why_failed: "«الوعظية» تستحضر الخطاب الديني التخويفي (التخويف من العواقب)، بينما «التعليمية» أعم وتشمل التعليم الأكاديمي والأدبي والعلمي"
      nuance_differentiation: "أخص من تعليمية — تقتصر على التواصل الإرشادي ذي الطابع الديني والأخلاقي"

  synset_flags:
    definition_review_needed: true

