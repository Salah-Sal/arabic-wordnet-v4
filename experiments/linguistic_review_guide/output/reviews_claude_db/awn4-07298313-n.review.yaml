step0_evidence:
  per_lemma:

    - lemma: "حَدَث طَبِيعِيّ"
      evidence_status: "no_material_found"

    - lemma: "حُدُوث"
      confirm:
        - text: "«(1) حُدوث (2) حَدَثٌ؛ حادثة» [مقابل happening]"
          source: "المورد الحديث (2008)"
        - text: "«(1) حادثة. وبخاصة: مصادفة an unusual occurrence / (2) حدوث of rare occurrence» [مقابل occurrence]"
          source: "المورد الحديث (2008)"
        - text: "«حدوث» [مقابل occurrence] — بلا تعريف، في حقل الطب والطب البيطري والكيمياء"
          source: "معاجم أرابترم المتخصصة (2009–2010)"
      contradicts:
        - text: "«الحُدُوثُ: كَون الْوُجُود مَسْبُوقا بِالْعدمِ، وَقيل: هُوَ الْخُرُوج من الْعَدَم»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "معنى كلامي فلسفي خالص — الحدوث ضد القِدَم في علم أصول الدين، لا علاقة له بالحدث الطبيعي الجاري"
        - text: "«الحدوث: وجود الشيء بعد عدمه عرضاً أو جوهراً، وإحداثه إيجاده، والحادث ما وجد بعد أن لم يكن»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "مصطلح أنطولوجي إسلامي — الحدوث الذاتي والزماني مقابل القِدَم؛ لا يصف حدثاً واقعاً"
        - text: "«الحدوث: عبارة عن وجود الشيء بعد عدمه. الحدوث الذاتي: هو كون الشيء مفتقراً في وجوده إلى الغير»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "ينصبّ على إثبات حدوث العالم في الكلام — بعيد عن دلالة الحدث الواقع الفعلي"
        - text: "«(عند المتكلمين): كَوْنُ الشيءِ مَسْبُوقًا بالعدَم، وهو ضربان: حُدُوثٌ زَمانِيٌّ وحُدُوثٌ ذاتيُّ»"
          source: "المعجم الكبير"
          conflict: "تقييد الدلالة بعلم الكلام يُبعدها عن الاستعمال اللغوي العام المقصود"

    - lemma: "وَاقِعَة"
      confirm:
        - text: "«(الْوَاقِعَة) الْقِيَامَة والنازلة من صروف الدَّهْر... و(فِي الفلسفة) مَا حدث وَوجد (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«(فى الفلسفة): ما حدث ووُجد»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(الواقعة) الْقِيَامَة والنازلة من صروف الدَّهْر والمصادمة وَهِي اسْم من الْوَقْعَة بِالْحَرْبِ وَهِي الصدمة بعد الصدمة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "دلالة الشدة والمكروه والقيامة والصدمة الحربية — أوسع بكثير من «حدث يقع بشكل طبيعيّ»"
        - text: "«واقعة» [مقابل fact] — مسرد الفلسفة وعلم النفس، مسرد علم الاجتماع والأنثروبولوجيا"
          source: "مسارد المنظمة العربية للتربية والثقافة والعلوم (أرابترم)"
          addition: "ترجمة fact تنزع نحو الوقائع المُثبَتة والحقائق المُقرَّرة، لا مجرد الأحداث الجارية"
      peripheral_observations:
        - "«الواقعة: عند أهل الله، ما يرد على القلب من ذلك العالم بأي طريق كان من خطاب أو مثال» — التوقيف على مهمات التعاريف للمناوي — معنى صوفي تقني مستقل تماماً عن دلالة المجموعة"
        - "«الواقعة في اصطلاح المتصوّفة عبارة عن الوارد الذي يهبط على القلب من عالم الغيب بأيّ طريق كان» — كشاف اصطلاحات الفنون والعلوم للتهانوي — معنى صوفي مستقل تماماً"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "حَادِثَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) حادثة. وبخاصة: مصادفة an unusual occurrence (2) حدوث of rare occurrence» — المورد الحديث (2008)؛ «حادثة = event» — مسرد الفلسفة وعلم النفس (أرابترم)"
      justification: "اشتقاق من جذر ح-د-ث على وزن فَاعِلَة — تمثّل الحدث المفرد الواقع؛ موثّقة في المعجم الوسيط والمعاجم التخصصية بمعنى event محايد"
    - lemma: "حُدُوث طَبِيعِيّ"
      source_section: "step5_english_bridge"
      evidence_citation: "«حدوث طبيعي — natural occurrence» — المَكنَز الزراعي متعدد اللغات AGROVOC"
      justification: "تركيب وصفي (اسم + صفة) مسجّل في معجم دولي متخصص بالزراعة والبيئة — آلية التوليد: تركيب"
  knowledge_candidates:
    - lemma: "كَائِنَة"
      justification: "اشتقاق من جذر ك-و-ن على وزن فَاعِلَة — المعجم الوسيط: «الكائنة = الحادثة (ج) كوائن»؛ لفظ تراثي أصيل يدل على ما وُجد وكان — آلية التوليد: اشتقاق (إحياء لفظ ممات)"
  generation_notes: "الجذران الدلاليان المركزيان هما ح-د-ث (حدوث، حادثة) وو-ق-ع (واقعة، وقوع). المرشح الأقوى أدلةً هو حَادِثَة لتوافر توثيقها في المعاجم التخصصية المعاصرة والكلاسيكية معاً."

