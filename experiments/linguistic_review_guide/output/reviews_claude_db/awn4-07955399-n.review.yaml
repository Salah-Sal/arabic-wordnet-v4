step0_evidence:
  per_lemma:

    - lemma: شرذمة
      confirm:
        - text: "«القليلُ من الناسِ»"
          source: القاموس المحيط للفيروزآبادي
        - text: "«القليل من الناس»"
          source: مقاييس اللغة
        - text: "«القليل من الناس, والقطعة من الشيء»"
          source: مجمل اللغة
        - text: "«الجماعةُ القليلةُ من النَّاس / الطائفةُ منَ الناس»"
          source: المعجم الكبير
        - text: "«شرذمة من النَّاس جمَاعَة قَليلَة»"
          source: المعجم الوسيط لمجموعة من المؤلفين
        - text: "«شرذمة من الناس: جماعة قليلة»"
          source: المعجم الوسيط
      contradicts:
        - text: "«القليلُ من الناسِ»"
          source: القاموس المحيط للفيروزآبادي
          conflict: جميع المعاجم تُقيّد الشرذمة بالقِلَّة العددية («قليلون»)، وهي سمة جوهرية مُجمَع عليها وواردة في القرآن الكريم، غائبة من تعريف AWN الذي يُطلق «تجمعاً» دون قيد؛ كما أن «متجول» لا تؤيده المعاجم العربية في تعريف هذه اللمّة
        - text: "«شرذمة من النَّاس جمَاعَة قَليلَة»"
          source: المعجم الوسيط لمجموعة من المؤلفين
          conflict: التعريف الحالي «تجمع متجول أو غير منظم» لا يُقيّد العدد بالقِلَّة، مما يجعله أعمّ من الدلالة الحقيقية للشرذمة
      expands:
        - text: "«الشرذمة: جماعة منقطعة من قولهم ثوب شراذم أي متقطع»"
          source: التوقيف على مهمات التعاريف للمناوي
          addition: تُضيف دلالة الانقطاع والتشتت المأخوذة بالمجاز من صورة الثوب الممزق المتقطع
      peripheral_observations:
        - "«القِطْعَةُ من السَّفَرْجَلَةِ وغيرِها» — القاموس المحيط: معنى مادي مستقل تماماً عن دلالة الجماعة من الناس"
        - "«ثيابٌ شَراذِمُ: أخلاقٌ مُتَقَطِّعَةٌ» — القاموس المحيط: معنى مجازي مستقل يدل على الممزق من الثياب الخَلِقة"

    - lemma: مجموعة متفرقة
      evidence_status: no_material_found

step05_lemma_generation:
  evidence_candidates:
    - lemma: شتات
      source_section: step4_fts_keyword
      evidence_citation: "«الشَّتاتُ: التفرق، أمر شتات: متشتت، جاء القوم شتات شتات متفرقين» — المعجم الوسيط"
      justification: اسم مصدر من الجذر ش-ت-ت يدل على حالة التفرق والتبعثر؛ قد يصف الجماعة المتناثرة غير المنظمة انطلاقاً من معنى التفرق
  knowledge_candidates:
    - lemma: فُلُول
      justification: "مجاز (إزاحة دلالية) — جمع فَلّ، أصله بقايا الجيش المتشتت المنهزم؛ الوظيفة التصويرية تُتيح توسيع المعنى لأي مجموعة متبعثرة متناثرة غير منظمة. الجذر ف-ل-ل اشتقاقي منتج (يُفَلُّ، مُفَلَّل)."
  generation_notes: "التعريف يصف جماعة متشتتة غير منظمة؛ المعجم الكلاسيكي يؤدي هذا المفهوم بدقة عبر «شرذمة» التي هي المفردة الأصلية المتداولة في الفصحى"

step1_lemma_validation:
  per_lemma:

    - lemma: شرذمة
      decision: confirmed
      decision_reason: أدلة معجمية واسعة من سبعة مصادر تؤكد جوهر المعنى (جماعة قليلة متفرقة)؛ التضارب محصور في سمة القِلَّة الغائبة من تعريف AWN وليس في الدلالة الجوهرية
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: شرذمة تحمل سمة القِلَّة العددية (جماعة قليلون) بوصفها خاصية دلالية جوهرية مُؤكَّدة قرآنياً وكلاسيكياً — تُفارق بها أي «مجموعة» عامة؛ كما تنطوي على إيحاء احتقاري يدل على ضعف الجماعة وتشرذمها، مما يجعلها أكثر شحنة دلالية وأدق تعبيراً من «تجمع غير منظم»
      example: "تصدّت قوات الأمن لشرذمة من المشاغبين كانت تُثير الفوضى في أطراف المدينة."

    - lemma: مجموعة متفرقة
      decision: removed
      decision_reason: تعبير وصفي حر يفشل اختبار السكّ واختبار التثبيت المعجمي — يقبل الإبدال بمجموعة مبعثرة / مجموعة منتشرة / مجموعة شاردة دون تغيّر في المعنى؛ لم يُسجَّل كمصطلح ثابت في أي مصدر؛ بنيته الوصفية الحرة تكشف أنه ترجمة وصفية للمفهوم لا مصطلح مسكوك
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
      nuance_differentiation: لا تملك ظلاً دلالياً مستقلاً — هي مجرد وصف حر للمفهوم دون معنى اصطلاحي يُميّزها عن أخواتها الوصفية (مجموعة مبعثرة، مجموعة منتشرة)
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: شتات
      source: step05
      decision: removed
      decision_reason: "شتات مصدر يدل على حالة التفرق لا على الجماعة المتفرقة نفسها — البنية الدلالية مختلفة: «الشتات» = التفرق كحالة مجردة، بينما تعريف المجموعة يصف كياناً جمعياً (تجمع/grouping)؛ لا يصح اختبار الإبدال السياقي «جاءت شتاتٌ من الناس» كاسم جماعي"
      step05_citation: "«الشَّتاتُ: التفرق، أمر شتات: متشتت، جاء القوم شتات شتات متفرقين» — المعجم الوسيط"
      substitution_test:
        result: fail
      nuance_differentiation: شتات يصف الفُرقة والتبعثر كحالة مجردة، بينما الشرذمة كيان جماعي اسمي — فرق نوع الكلمة (مصدر vs. اسم جمع)

    - lemma: فلول
      source: step05
      decision: removed
      decision_reason: فلول تحمل دلالة الهزيمة والانكسار العسكري لازمة لها — المعنى الزائد يجعلها أخصّ من تعريف المجموعة الذي يُطلق على أي تجمع متجول أو غير منظم بصرف النظر عن الهزيمة؛ الإبدال في سياقات غير عسكرية شاذ
      step05_citation: من المعرفة اللغوية — مجاز من فَلَّ الجيش (انكسر وتشتت)؛ لا وجود في قاعدة البيانات بمعنى تجمع عام غير منظم
      substitution_test:
        result: fail
      nuance_differentiation: فلول أخصّ من الشرذمة — تحمل دلالة الانكسار العسكري المنعدمة في تعريف المجموعة

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "تجمع متجول أو غير منظم (لأشياء أو أشخاص)"
  assessment:
    decision: revise
    reason: جميع المعاجم الكلاسيكية والحديثة (سبعة مصادر) تُقيّد الشرذمة بالقِلَّة («جماعة قليلة»، «القليل من الناس»)، وهي سمة مؤكَّدة بالقرآن الكريم ﴿إِنَّ هَٰؤُلَاءِ لَشِرْذِمَةٌ قَلِيلُونَ﴾ — غائبة تماماً من التعريف الحالي؛ كما أن «متجول» لا سند له في المعاجم العربية لهذه اللمّة
  scope_note: "المعاجم الكلاسيكية تُضيف بُعداً مادياً (القطعة من الشيء — من الثمار أو من الثياب الممزقة) خارج نطاق هذه المجموعة الترادفية"
  authored_definitions:
    - type: terminological
      text: "جماعة قليلة العدد من الأشخاص تجيء متناثرة غير منظمة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "قِطعة قليلة من الناس تتشتت وتتفرق دون نظام"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: awn4-07955399-n
        definition_index: 0
        text: "جماعة قليلة العدد من الأشخاص تجيء متناثرة غير منظمة"

