step0_evidence:
  per_lemma:

    - lemma: "جسم طافٍ"
      evidence_status: "no_material_found"

    - lemma: "عائم"
      confirm:
        - text: "«(1) العائم: شيء أو شخص عائم»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«المواد الطافية في الماء العذب أو المياه العادمة والتي يجب إزالتها قبل المعالجة أو الطرح»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "تخصيص المفهوم في سياق هندسة المياه — المواد الطافية بوصفها مشكلة بيئية تُزال، لا وصفاً عاماً لأجسام قادرة على الطفو"
      peripheral_observations:
        - "معجم البلدان لياقوت الحموي (ت 1229م): «عائم» اسم موضع جغرافي تابع لأزد السراة — استخدام علمي خارج نطاق المجموعة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عوّامة"
      source_section: "step5_english_bridge"
      evidence_citation: "«العوّامة: بيت من خشب أو نحوه يُقام على سطح الماء (مج)، وجسم معدني كروي أجوف يطوف على سطح الماء (مج)» — المعجم الوسيط"
      justification: "اشتقاق على وزن فَعَّالة من جذر عوم — يدل على الجسم المُصمَّم للطفو على سطح الماء؛ وردت مقابلاً لـ float/floater في معاجم البحار والهندسة والسيارات والكهرباء"
  knowledge_candidates:
    - lemma: "طافٍ"
      justification: "اشتقاق — اسم فاعل من الفعل طفا يطفو (جذر ط-ف-و)؛ الوزن فاعل مُستخدم اسمياً للدلالة على الشيء الذي يطفو؛ وردت في المعاجم التقنية بمعنى buoyant (علوم البحار) وsupernatant (المعجم الطبي) وplanktonic (الجيولوجيا)"
  generation_notes: "التعريف يدور حول مفهوم الطفو — الجذران المركزيان هما عوم (عائم، عوّامة، عوّام) وطفو (طافٍ، طفاوة، الطفو). المصطلح الإنجليزي floater يقابله في العربية عدة مفردات حسب السياق"

step1_lemma_validation:
  per_lemma:

    - lemma: "جسم طافٍ"
      decision: removed
      decision_reason: "عبارة وصفية حرة (موصوف + صفة) — ليست وحدة معجمية مسكوكة؛ يُبدَل كلا مكوّنيها بحرية (جسم ← شيء / طافٍ ← عائم) دون تغيير المعنى، مما يُثبت أنها تركيب وصفي لا مصطلح مُثبَّت"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "الجسم الطافي على سطح الماء"
            substituted: "الشيء العائم على سطح الماء"
            preserved_meaning: true
            why_failed: "نجح الإبدال بمكوّنَيْن مختلفَيْن معاً مع الحفاظ على المعنى — اختبار السَّكّ: فشل؛ التركيب وصفي حر لا وحدة معجمية"
      nuance_differentiation: "لا تمييز دلالي ذاتي — هي وصف تركيبي حر لمفهوم «عائم»، لا مصطلح مستقل"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عائم"
      decision: confirmed
      decision_reason: "اسم فاعل موثَّق من الجذر عوم، مُثبَّت في المعاجم الحديثة والتقنية بمعنى شيء أو شخص يعوم؛ الأدلة المؤكِّدة راجحة، والتوسّع في الهندسة المدنية لا يُناقض المعنى الأصلي"
      evidence_assessment:
        case: "mixed"
        notes:
          - "confirm: المورد الحديث يُثبت المعنى مباشرةً — العائم: شيء أو شخص عائم"
          - "expands: الهندسة المدنية تخصّص المفهوم في سياق المياه العادمة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "«عائم» من جذر عوم (السباحة والطفو معاً) — يشمل العاقل وغير العاقل، ويُستخدم وصفاً وأسماً؛ يختلف عن «طافٍ» (جذر طفو) الذي يحمل في التراث الفقهي دلالةً سلبية خاصة (الطافي من السمك: الميت)"
      example: "وجد رجال الإنقاذ جذعاً عائماً قرب موقع الغرق فتشبّث به الناجون حتى وصلت النجدة"

    - lemma: "عوّامة"
      source: step05
      decision: removed
      decision_reason: "عوّامة أخصّ من تعريف المجموعة — تدل في المعاجم على جسم بعينه مُصمَّم للطفو (كرة معدنية جوفاء، بيت خشبي على الماء، طوّافة)، لا على أي جسم قادر على الطفو بطبيعته؛ كما لا تُطلق على الأشخاص"
      step05_citation: "«العوّامة: بيت من خشب أو نحوه يُقام على سطح الماء (مج)، وجسم معدني كروي أجوف يطوف على سطح الماء (مج)» — المعجم الوسيط"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "الإنسان العائم على الماء"
            substituted: "الإنسان العوّامة على الماء"
            preserved_meaning: false
            why_failed: "عوّامة لا تُطلق على الأشخاص — والمجموعة تشمل أي جسم قادر على الطفو، عاقلاً أو غير عاقل"
      nuance_differentiation: "عوّامة أداة أو هيكل مُصمَّم للطفو (hyponym) — لا تُرادف المفهوم العام للمجموعة"

    - lemma: "طافٍ"
      source: step05
      decision: removed
      decision_reason: "التخصص الدلالي الفقهي والكلاسيكي يُقيِّد «الطافي» بالسياق السلبي (الطافي من السمك: الميت الذي علا فوق الماء)؛ وهو تعارض مع الدلالة الإيجابية في التعريف (قادر على الطفو)؛ فضلاً عن أن «عائم» المؤكَّدة تؤدي الوظيفة ذاتها بلا إشكال"
      step05_citation: "«طافٍ: سمكٌ طافٍ: مات ثم علا فوق سطح الماء» — المعجم الكبير؛ «الطافي من السمك هو الذي يموت في الماء حتف أنفه فيعلو ويظهر» — التعريفات الفقهية للبركتي"
      nuance_differentiation: "في التراث المعجمي الفقهي «الطافي» مصطلح يدل على الميت العائم، لا على القادر على الطفو — تعارض دلالي مع تعريف المجموعة"

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "جسم يطفو أو قادر على الطفو"
  assessment:
    decision: revise
    reason: "التعريف صحيح في مضمونه لكن صياغته تُعيد وصف اللمّة ذاتها (جسم طافٍ ← جسم يطفو)؛ مع حذف «جسم طافٍ» من اللمّات ينبغي تحسين الجنس القريب وتوحيد العنصرَيْن (يطفو / قادر على الطفو) في صياغة أدق"
  authored_definitions:
    - type: terminological
      text: "كل جسم مادي يعلو فوق سطح مائع ولا يرسب فيه بحكم طبيعته أو تصميمه"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "جسم يطفو على وجه الماء أو نحوه بطبيعته أو بتصميمه"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09304683-n"
        definition_index: 0
        text: "كل جسم مادي يعلو فوق سطح مائع ولا يرسب فيه بحكم طبيعته أو تصميمه"

