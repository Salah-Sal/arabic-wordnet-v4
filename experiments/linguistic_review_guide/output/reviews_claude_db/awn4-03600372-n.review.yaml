        - command: set_confidence
          params:
            entity_type: "sense"
            entity_id: "{auto}"
            score: 0.2

    - lemma: "لا يوصف"
      source: step05
      decision: removed
      decision_reason: "صفة مُثبَّتة في المعجم اللساني لا اسم — لا يصلح مدخلاً في مجموعة أسماء (pos: n)؛ إدراجه سيُوجِد خلطاً بين الفئتين النحويتين. فحص الاقتراض: لفظ عربي أصيل (و-ص-ف)، لا اقتراض."
      step05_citation: "«يعارض الاصطلاح (البث) في السيميائية... يستخدم بالمعنى الواسع للتقرير عن الفضائي والمرئي اللذين يستحيل الإلمام بوصفهما» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "«لا يوصف» صفة تُسنَد إلى الشيء؛ المجموعة تحتاج اسماً يدل على الشيء ذاته لا وصفاً مسنَداً إليه — فرق مقولي لا مجرد فارق دلالي"

    - lemma: "ما لا يُوصَف"
      source: step05
      decision: removed
      decision_reason: "يفشل اختبار التثبيت المعجمي: تركيب موصولي حر قابل للإبدال («ما يعجز الوصف عنه»، «ما يصعب تحديده») — لم يرد في أي مصدر معجمي كوحدة مستقلة مسكوكة؛ لا يتجاوز فحص اختبار السكّ"
      step05_citation: "لا استشهاد معجمي — مولَّد من المعرفة اللغوية الداخلية (تركيب موصولي)"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "بنيوياً مرادف لـ«شيء لا يوصف» — الإحلال بـ«ما» الموصولة بدل «شيء» لا يُضيف تثبيتاً مصطلحياً ولا يجعله وحدة معجمية مستقلة"

    - lemma: "المُبهَم"
      source: step05
      decision: removed
      decision_reason: "خلل دلالي نوعي: «المُبهَم» يعني الغامض غير المحدد المعالم في الاستعمال التقني، بينما دلالة المجموعة أن الشيء مُدرَك بوضوح لكن يعجز اللسان عن تحديده — الفرق ليس درجياً بل وظيفي"
      step05_citation: "لا استشهاد معجمي مباشر — مولَّد من المعرفة اللغوية (اشتقاق: مُفْعَل من بهَم)"
