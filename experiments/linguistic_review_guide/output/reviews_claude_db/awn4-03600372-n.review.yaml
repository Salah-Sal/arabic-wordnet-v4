step05_lemma_generation:
  evidence_candidates:
    - lemma: "لا يوصف"
      source_section: "step4_fts_keyword"
      evidence_citation: "«يعارض الاصطلاح (البث) في السيميائية وكل كينونة ذات دلالة، ويُستخدم بالمعنى الواسع للتقرير عن الفضائي والمرئي اللذين يستحيل الإلمام بوصفهما والإحاطة بوضعهما» — المعجم الموحد لمصطلحات اللسانيات (2002)؛ translation_en: unutterable; inexpressible"
      justification: "المصطلح اللساني الموثَّق الأقرب إلى دلالة «ما يتعذر وصفه»، مُثبَّت في معجم تخصصي معتمد — غير أنه وُثِّق صفةً لا اسماً"
  knowledge_candidates:
    - lemma: "ما لا يُوصَف"
      justification: "تركيب موصولي: «ما» الموصولة وصلتها تُنتجان اسماً مركباً أكثر إحكاماً من «شيء لا يوصف» في العربية؛ آلية التوليد: تركيب (موصولي). يُختبَر في الخطوة ١ باختبار التثبيت المعجمي."
    - lemma: "المُبهَم"
      justification: "اشتقاق: اسم مفعول من أبهَمَ (ب-هـ-م)، يعني ما غمض وأشكل تحديده؛ آلية التوليد: اشتقاق (وزن مُفْعَل). قريب دلالياً من «ما يتعذر تحديده» لكن معناه في الاستعمال التقني أعمّ — يشمل الغموض عموماً لا عجز الوصف تحديداً."
  generation_notes: "المفهوم يقابل التعبير الفرنسي-الإنجليزي «je ne sais quoi» — لا يقابله مصطلح مسكوك مفرد في العربية الفصحى. الأدلة المعجمية تُثبت «لا يوصف» صفةً لا اسماً. فراغ معجمي حقيقي في هذا الحقل الدلالي."

step1_lemma_validation:
  per_lemma:

    - lemma: "شيء لا يوصف"
      decision: escalated
      decision_reason: "عبارة وصفية حرة تفشل اختبار السكّ المصطلحي — «لا يوصف» قابل للإبدال بـ«يعسر وصفه» أو «يصعب تحديده» دون تغيير الوصف؛ لا مدخل معجمي؛ لا بديل مسكوك متاح حتى الآن. يُضاف إليه: المُشتمِل محدَّد خطأً على كيان مادي فيما المفهوم خاصية مجردة. يُصعَّد للمراجع البشري لتقرير بديل مصطلحي أو قبول العبارة الوصفية استثناءً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللمّة الوحيدة في المجموعة — لا أخوات للمقارنة. تفشل اختبار السكّ: «شيء لا يوصف» وصف حر يمكن تعويضه بـ«شيء يعجز الوصف عنه» أو «شيء يصعب تبيينه»، مما يكشف أنه تركيب وصفي عرضي لا وحدة معجمية ثابتة. بوابة الجودة: ضعيفة في الاشتقاقية (لا تولّد أسرة صرفية) وفي يُسر التداول كمصطلح نظامي."
