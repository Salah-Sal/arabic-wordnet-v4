          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«تبادل المعلومات أو العواطف بين شخصين أو أكثر بواسطة رسائل مكتوبة.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "يُقيّد الوسيلة برسائل مكتوبة بعينها (لا رموز مكتوبة عموماً)، ويُضيف البُعد العاطفي (تبادل العواطف) وقيد التفاعل الشخصي المباشر (بين شخصين أو أكثر)، وهي تفاصيل غائبة عن تعريف المجموعة الأعم"

    - lemma: "لُغَة مَكْتُوبَة"
      confirm:
        - text: "«مجموع عناصر اللغة التي تمر عبر عملية تسجيل خطي مرئي.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«صفة اللغة الأدبية الرسمية التي تقابل اللغة الشعبية الشفهية.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "يُحمّل المصطلح دلالةً سوسيولسانية — اللغة الرسمية/الأدبية في مقابل العامية الشفهية — وهي دلالة أخصّ وأبعد عن تعريف المجموعة الذي يُعنى بالتواصل عبر الرموز المكتوبة بصرف النظر عن المستوى الأسلوبي أو الاجتماعي"
      expands:
        - text: "«مجموع عناصر اللغة التي تمر عبر عملية تسجيل خطي مرئي.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُضيف البُعد النظامي-اللساني: اللغة المكتوبة كمنظومة من العناصر تسجيلية الطابع ومرئية الشكل، وهو بُعد بنيوي لا وظيفي لا يُصرَّح به في تعريف المجموعة"
      peripheral_observations:
        - "المعنى السوسيولساني (اللغة الرسمية/الأدبية مقابل العامية الشفهية) مستقل تماماً عن دلالة المجموعة؛ قد يستحق مجموعة ترادفية منفردة في حقل علم اللغة الاجتماعي"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "اتصال كتابي"
      source_section: step5_english_bridge
      evidence_citation: "«اتصال كتابي، تواصُل كتابي» — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      justification: "يرِد في المسرد التخصصي ذاته مقابلاً لـ written communication، مُدرَجاً إلى جنب «تواصل كتابي» كصيغتين مترادفتين في الحقل المعلوماتي"
  knowledge_candidates:
    - lemma: "الكتابة"
      justification: "اشتقاق مصدري من جذر ك-ت-ب؛ يُعبّر عن المفهوم الجوهري ويُمثّل الجنس القريب للمجموعة. غير أن دلالته أعم إذ تشمل الكتابة لأغراض غير تواصلية (تسجيل ذاتي، فن، دراسة)، فيبقى جنساً لا مرادفاً كاملاً"
    - lemma: "المراسلة"
      justification: "مصدر المفاعلة من جذر ر-س-ل (مجاز وظيفي: إرسال الرسائل = التواصل الكتابي التبادلي)؛ مسكوك ومستقر في المعاجم والاستعمال، ويحمل دلالة التبادل المتبادل الكتابي. أضيق من التعريف إذ يُخصّص الوسيلة بالرسائل ويستلزم طرفاً مُرسِلاً ومُستقبِلاً بعينهما"
  generation_notes: "التعريف يجمع بين وظيفة التواصل (يُولّد مرشحات كالمراسلة) ونظام اللغة المكتوبة (يُولّد مرشحات أشمل كالكتابة)؛ المفهوم حاضر في المصطلحية العربية المعاصرة حضوراً جيداً"


step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية — مؤكَّدة ──
    - lemma: "تَوَاصُل كِتَابِيّ"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة مباشرة من مسرد تخصصي مُعتمَد، والمصطلح موحَّد ومستقر في الاستخدام المهني والأكاديمي"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز الوظيفة التواصلية التفاعلية (تبادل بين طرفين)؛ يختلف عن «لغة مكتوبة» في أنه يُشير إلى حدث التواصل الفعلي وفاعليته لا إلى النظام اللغوي الكتابي بوصفه منظومة ثقافية. الوزن الصرفي: تَفَاعُل (مصدر تفاعُل) + كِتَابِيّ (نسبة) — وصفي مناسب للحدث التبادلي"
      example: "اشترطت اللوائحُ الإدارية أن يُوثَّق كل تواصل كتابي بين الأقسام في سجلات الأرشيف الرسمي."

    # ── لمّة أصلية — مؤكَّدة ──
    - lemma: "لُغَة مَكْتُوبَة"
      decision: confirmed
      decision_reason: "الأدلة المعجمية تُثبت حضوره في المصطلحية اللسانية العربية؛ التناقض الجزئي مصدره تعريف سوسيولساني أخصّ لا يُلغي الاستخدام الأعم للمصطلح الذي يُرادف «written language» بمفهومها اللساني العام"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز البُعد النظامي للغة المكتوبة (مقابل المنطوقة) بوصفها منظومة تسجيلية مرئية؛ يختلف عن «تواصل كتابي» في أنه يصف البنية اللغوية الكتابية كمنظومة قائمة لا حدثاً تواصلياً بعينه. الوزن الصرفي: فُعْلَة (اسم) + مَفْعُولَة (صفة مفعول) — وصفي مناسب لوصف النظام اللغوي"
      example: "أتاحت اللغةُ المكتوبةُ للحضارات الإنسانية نقلَ معارفها وتجاربها عبر الأجيال."

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "اتصال كتابي"
      source: step05
      decision: removed
      decision_reason: "ترادف شبه تام مع «تواصل كتابي» الموجود في المجموعة؛ فشل اختبار منع الترادف المطلق — الفارق الدقيق بين اتصال وتواصل لا يرقى لتبرير لمّتين مستقلتين، و«تواصل» أدق دلالةً على التبادل المتبادل الذي يُميّز هذا المفهوم"
      step05_citation: "«اتصال كتابي، تواصُل كتابي» — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      substitution_test:
        result: pass
      nuance_differentiation: "«اتصال» يحتمل أحادية الاتجاه، أما «تواصل» فيُفيد التفاعل المتبادل الذي هو جوهر المفهوم المقصود — لذا «تواصل كتابي» أفضل وهو موجود أصلاً"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "الكتابة"
      source: step05
      decision: removed
      decision_reason: "دلالة أعم بكثير من تعريف المجموعة؛ تشمل الكتابة لأغراض غير تواصلية (التدوين الذاتي، الفن، التسجيل المحاسبي) فلا تصلح مرادفاً كاملاً — فشلت اختبار الإحلال في سياقات التواصل التفاعلي"
      step05_citation: "«(1) كتابة (2) خَطّ (3) رسالة؛ مذكِّرة» — المورد الحديث (2008)"
      substitution_test:
        result: fail

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "المراسلة"
      source: step05
      decision: removed
      decision_reason: "أضيق من تعريف المجموعة؛ تُخصّص بالتبادل عبر رسائل بين أشخاص بعينهم ولا تغطي الكلمة المطبوعة العامة (كتب، مجلات، لوائح) ولا التواصل الكتابي المؤسسي والإعلامي الواسع"
      step05_citation: "لا دليل معجمي مباشر — مرشح من المعرفة اللغوية"
