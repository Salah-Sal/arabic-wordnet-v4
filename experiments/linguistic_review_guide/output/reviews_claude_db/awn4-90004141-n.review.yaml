          params:
            sense_id: "{auto}"

    # ── مرشح الخطوة ٠٫٥: واجب المشاهدة ──
    - lemma: "واجب المشاهدة"
      source: step05
      decision: removed
      decision_reason: >
        اقتراض مفهومي (calque) من must-see الإنجليزية — البنية الاستعارية مُستعارة
        بالكامل وملؤها بقوالب عربية (must → واجب، see → المشاهدة). المركب غير
        مسجّل في أي معجم. اختبار السكّ: يمكن إبدال «المشاهدة» بـ«الرؤية» أو
        «الزيارة» مع الحفاظ على المعنى → مركب وصفي حر لا مصطلح مسكوك.
        اختبار التثبيت المعجمي: غائب من كافة مصادر القاعدة.
      step05_citation: "«واجب؛ ضروري: مطلوب بموجب آداب المعاشرة» — المورد الحديث (2008)، مدخل de rigueur"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "هذا الفيلم واجب المشاهدة."
            substituted: "—"
            preserved_meaning: false
            why_failed: >
              يعمل خبراً لا اسماً مرجعياً — لا يصلح لمّةً اسمية في WordNet
              بوزنه الحالي.
      nuance_differentiation: >
        يُحصّر المفهوم في المشاهدة البصرية (فيلم/عرض) دون تعميمه على الزيارة
        أو الاطلاع، مما يُضيّق نطاق التعريف الذي يشمل «الاطلاع» أيضاً.

    # ── مرشح الخطوة ٠٫٥: لا يُفَوَّت ──
    - lemma: "لا يُفَوَّت"
      source: step05
      decision: removed
      decision_reason: >
        تعبير فعلي منفي (فعل مضارع مبني للمجهول + حرف النفي) — بنيته الصرفية
        لا تؤهله لمّةً اسمية في WordNet المصنَّف pos: n. الاستعمال الإعلامي
        يوظّفه محمولاً خبرياً أو نعتاً (عرض لا يُفَوَّت) لا اسماً.
        اختبار السكّ: يؤدي وظيفة الصفة لا الاسم.
      step05_citation: >
        «الفوت: بعد الشيء عن الإنسان بحيث يتعذر إدراكه» — التوقيف على مهمات
        التعاريف للمناوي (hawramani، entry_id 814660)
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "شاهدتُ «لا يُفَوَّت»"
            substituted: "—"
            preserved_meaning: false
            why_failed: >
              لا يعمل مرجعاً اسمياً مستقلاً — يحتاج دائماً اسماً يصفه
              (فيلم لا يُفَوَّت / عرض لا يُفَوَّت).
      nuance_differentiation: >
        يركّز على جانب «عدم الإفلات» (الفوت) مقابل «ما يجب رؤيته» الذي يركّز
        على الإلزام (الوجوب) — ظلال مختلفة لنفس المفهوم لكن كلاهما صفة لا اسم.

  synset_flags:
    definition_review_needed: true


step3_definition:
  definition_review_flag: true
  current_definition: "شيء يُعَد الاطلاع عليه أو رؤيته أمراً ضرورياً"
  assessment:
    decision: revise
    reason: >
      التعريف يستهل بـ«شيء» — وهو ذات الاسم الذي يُشكّل المُشتمِل المباشر
      (awn4-04431553-n: كيان لم يُسمَّ بشكل محدد / شيء). هذا يجعله قريباً من
      الدوري. فضلاً عن ذلك، «الاطلاع عليه أو رؤيته» تعبير مُزدوج يمكن توحيده؛
      و«أمراً ضرورياً» تعبير ضعيف يمكن تقويته بـ«لازماً» أو «حتمياً».
      لا يوجد تعريف عربي في أي معجم يمكن الاستناد إليه.
  authored_definitions:
    - type: terminological
      text: >
        كل مشهد أو مكان أو عمل يُعدّ الإقبال عليه ومشاهدته أمراً لازماً لا
        يصح إغفاله، ويُوصى به توصية حثيثة لكل من تسنح له الفرصة.
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: >
        ما لا ينبغي للمرء تركه دون أن يراه أو يُقبل عليه، لما فيه من قيمة
        رفيعة أو تجربة فريدة لا تعوض.
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-90004141-n"
        definition_index: 0
        text: >
          كل مشهد أو مكان أو عمل يُعدّ الإقبال عليه ومشاهدته أمراً لازماً لا
          يصح إغفاله، ويُوصى به توصية حثيثة لكل من تسنح له الفرصة.
    - command: add_definition
      params:
        synset_id: "awn4-90004141-n"
        text: >
          ما لا ينبغي للمرء تركه دون أن يراه أو يُقبل عليه، لما فيه من قيمة
          رفيعة أو تجربة فريدة لا تعوض.


