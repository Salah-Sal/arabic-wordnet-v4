# مراجعة المجموعة الترادفية: awn4-90004141-n
# المفهوم: must-see / شيء لا يُفَوَّت
# ══════════════════════════════════════════════════════════════

step0_evidence:
  per_lemma:

    - lemma: "شيء لا يُفَوَّت"
      evidence_status: "no_material_found"
      # البحث بالمطابقة الدقيقة (headword_norm) لم يُسفر عن أي نتيجة في قاعدة البيانات.
      # البحث العكسي بـ FTS وجد «لا يفوت» في كتاب التعريفات للجرجاني والتوقيف للمناوي
      # لكن في سياق مختلف تماماً (تفويت المنفعة في الثوب) ولا صلة له بدلالة المجموعة.

    - lemma: "ما يجب رؤيته"
      evidence_status: "no_material_found"
      # لا وجود لهذه العبارة في أي مدخل معجمي في قاعدة البيانات.
      # الجسر الإنجليزي بـ must-see / unmissable / not to be missed لم يُسفر عن نتيجة.


step05_lemma_generation:
  evidence_candidates:
    - lemma: "واجب المشاهدة"
      source_section: step5_english_bridge
      evidence_citation: "«واجب؛ ضروري: مطلوب بموجب آداب المعاشرة أو الأتيكيت» — المورد الحديث (2008)، مدخل de rigueur"
      justification: >
        المورد الحديث يُعطي «واجب» و«ضروري» و«مطلوب» مقابلاً للإلزام الاجتماعي
        في de rigueur، وهو المكوّن الدلالي الجوهري في مفهوم must-see.
        آلية التوليد: **تركيب إضافي** — «واجب» (اسم بمعنى ما يجب) + «المشاهدة»
        (مصدر من شهد). المركب منتج في الاستعمال الإعلامي المعاصر («الفيلم واجب المشاهدة»).

  knowledge_candidates:
    - lemma: "لا يُفَوَّت"
      justification: >
        آلية التوليد: **مجاز (إزاحة دلالية)** — الجذر ف-و-ت يدل على بُعد الشيء
        بحيث يتعذر إدراكه (التوقيف للمناوي: «الفوت: بعد الشيء عن الإنسان بحيث
        يتعذر إدراكه»). استُعير هذا المعنى للدلالة على ما ينبغي ألا يُترك دون رؤية.
        الصيغة المبنية للمجهول «يُفَوَّت» شائعة في الاستعمال الإعلامي العربي المعاصر
        («هذا العرض لا يُفَوَّت»، «مباراة لا تُفَوَّت»). غير أن وظيفتها الصرفية
        فعل منفي لا اسم — مما يُشكّل إشكالاً في توظيفها اسماً في WordNet.

  generation_notes: >
    التعريف يصف مفهوماً تقييمياً ثقافياً إنجليزياً (must-see) لا يقابله في العربية
    مصطلح مفرد مسكوك ومعجمياً مستقر. الأدلة المعجمية في القاعدة خالية من أي مدخل
    مباشر لهذا المفهوم. الجسر الإنجليزي بكل صياغاته (must-see / unmissable /
    not to be missed) لم يُسفر عن نتيجة. يُشير هذا إلى فجوة معجمية حقيقية.


step1_lemma_validation:
  per_lemma:

    # ── لمّة ١: شيء لا يُفَوَّت ──
    - lemma: "شيء لا يُفَوَّت"
      decision: escalated
      decision_reason: >
        تركيب إسنادي (اسم + جملة فعلية منفية) يقع خارج أنواع التعابير المركبة
        المقبولة (إضافي / وصفي / مزجي). الاستعمال الإعلامي المعاصر يوظّف «لا يُفَوَّت»
        محمولاً خبرياً لا اسماً مستقلاً. مع ذلك، لا يوجد بديل عربي مسكوك مسجّل
        في المعاجم يمكن تأكيده — تصعيد للمراجع البشري لاتخاذ القرار.
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "هذا الفيلم شيء لا يُفَوَّت."
            substituted: "—"
            preserved_meaning: false
            why_failed: >
              العبارة تؤدي دوراً خبرياً (predicate) لا دوراً اسمياً مرجعياً (noun phrase).
              لا يمكن استخدامها موضع اسم في تركيب من قبيل «حضرتُ شيئاً لا يُفَوَّت»
              دون تغيير نحوي جذري يكشف أنها جملة لا مصطلح.
      nuance_differentiation: >
        اللمّة الوحيدة المتاحة حالياً لهذا المفهوم؛ تحمل دلالة الإلحاح والإلزام
        («يجب ألا يُفوَّت»)، وتختلف عن «ما يجب رؤيته» باختصار التعبير وشيوع
        استعماله في العناوين الإعلامية العربية.
      loanword_check:
        blind_literal: >
          الصياغة ليست ترجمة حرفية عمياء — الجذر ف-و-ت عربي أصيل ودلالة الفوت
          متلائمة مع المفهوم المقصود. لكن البنية الكلية إسنادية لا اسمية.
      quality_gate:
        ittiraad: "الاستعمال الإعلامي موجود لكنه خبري لا اسمي"
        yusr: "يسيرة النطق نسبياً لكنها طويلة (٤ كلمات)"
        mulaama: "ملاءمة دلالية جيدة — لكن الوظيفة الصرفية خاطئة للاسمية"
        isytiqaqiyya: "جامدة — لا تُولّد أسرة اشتقاقية بهذا الشكل المركب"
      actions:
        - command: escalate
          params:
            sense_id: "{auto}"
            reason: >
              تركيب إسنادي يُشكّل إشكالاً نحوياً كاسم في WordNet؛ الفجوة المعجمية
              الحقيقية تستلزم قرار مراجع بشري: إما الإبقاء براغماتياً أو البحث
              عن صياغة أنسب.

    # ── لمّة ٢: ما يجب رؤيته ──
    - lemma: "ما يجب رؤيته"
      decision: removed
      decision_reason: >
        جملة اسمية موصولية ذات خبر فعلي (ما + يجب + رؤيته) — بنيتها جملة لا
        مصطلح. مضمونها مكرَّر دلالياً مع «شيء لا يُفَوَّت» دون أن تُضيف ظلاً
        دلالياً مستقلاً. أكثر وصفية وأقل تداولاً في الاستعمال الإعلامي مقارنةً
        بالأولى.
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "هذا المكان شيء لا يُفَوَّت."
            substituted: "هذا المكان ما يجب رؤيته."
            preserved_meaning: true
      nuance_differentiation: >
        تتطابق دلالياً مع «شيء لا يُفَوَّت» مع تطويل في الصياغة وميل أكثر
        إلى الأسلوب التعليمي الوصفي — لا تضيف ظلاً دلالياً يبرر وجودها
        كلمّة مستقلة في نفس المجموعة.
      loanword_check:
        blind_literal: >
          ترجمة وصفية شبه حرفية لـ "what must be seen" — البنية صحيحة عربياً
          لكنها جملة وصفية حرة لا مصطلح.
      actions:
