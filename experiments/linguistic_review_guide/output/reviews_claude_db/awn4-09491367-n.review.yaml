step0_evidence:
  per_lemma:

    - lemma: "شارد"
      confirm:
        - text: "«كتلة صخرية كبيرة ومعزولة خلفها نهر جليدي»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«النافر المستعصي، والحائد عن الطريق الصحيح، والمتطلع إلى غير ماله»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«يقال: رجل شارد العين: يتطلع إلى غير ما له من متاع ونحوه»"
          source: "المعجم الوسيط"
          addition: "البُعد الإنساني للشرود — يوسّع المفهوم ليشمل الكائنات الحية ذات الإرادة، وليس الأجسام المادية الصمّاء فحسب"
        - text: "«يقال: رَجُلٌ شاردُ العينِ: يتطلَّعُ إلى ما ليس له من متاعٍ ونحوِه»"
          source: "المعجم الكبير"
          addition: "يوسّع الشرود ليشمل معنى الطموح والرغبة فيما هو خارج نطاق المرء"
      peripheral_observations:
        - "«شوارد اللغة: غرائبها ونوادرها» — المعجم الوسيط: معنى مستقل تماماً في حقل علم اللغة، لا صلة له بمعنى انعدام المكان الثابت"
        - "«قصيدة شاردة: سائرة في البلاد» — المعجم الوسيط: معنى مستقل (القصيدة الذائعة الانتشار)، مخالف تماماً للمعنى المقصود"

    - lemma: "جسم تائه"
      evidence_status: "no_material_found"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "تائه"
      source_section: "step4_fts_keyword"
      evidence_citation: "«تائه» = erratic — المعجم الموحد لمصطلحات الطب البيطري (2010)؛ و«حيوان تائه: حيوان لا مالك له» في المرجع ذاته؛ و«طفيلي تائه» = erratic parasite — المعجم الطبي الموحد (2009)"
      justification: "موثق في ArabTerm بوصفه مقابلاً مباشراً لـ erratic في سياقات طبية بيطرية، يدل على كيان منفصل عن موطنه الأصلي بلا مكان محدد ينتمي إليه"
  knowledge_candidates:
    - lemma: "طائح"
      justification: "آلية التوليد: إحياء لفظ — الجذر ط-و-ح (طوح به: رمى به بعيداً في الفضاء). المعجم الكبير: «الساقط الهالك في التيه الذاهب في الأرض الفاسد السهم المخطئ للغرض». يعبّر عن كيان أُلقي بعيداً دون استقرار في موطن ثابت، مما يتوافق مع مفهوم الجسم المنبثق دون موطن."
  generation_notes: "التعريف يستهدف كياناً مادياً يفتقر إلى موطن ثابت كالمتشرد؛ أبرز الجذور الدلالية المرشحة: ش-ر-د وت-و-ه وط-و-ح؛ الجسر الإنجليزي (vagabond) أفاد بترجمات بشرية (متشرد، متسكع) لا تصلح لأجسام مادية"


step1_lemma_validation:
  per_lemma:

    - lemma: "شارد"
      decision: confirmed
      decision_reason: "مصطلح تقني موثق في ArabTerm (بيئة ومناخ) بمعنى erratic — كتلة صخرية نقلها الجليد بعيداً عن موطنها؛ وزن فاعل من الجذر ش-ر-د سليم صرفياً؛ ملاحظة: المعاجم العامة تصنّفه صفة (adj) لكن ArabTerm يستخدمه اسماً مستقلاً مما يُسوّغ التصنيف (n) في السياق التقني"
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على النفور والانفصال القسري عن الموطن الأصلي (الجذر ش-ر-د: نفر وفرّ بعيداً)، وهو الأوفق للمعنى الجيولوجي — خلافاً لـ«تائه» الذي يركز على الضياع والتحيّر"
      example: "رصد الجيولوجيون صخرة شاردة ضخمة على بعد مئات الكيلومترات من موطنها الأصلي، نقلتها الأنهار الجليدية عبر آلاف السنين"

    - lemma: "جسم تائه"
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبار السكّ: إبدال «تائه» بـ«ضال» أو «سائح» يُبقي الوصف صالحاً للمفهوم، مما يدل على أنه ليس مصطلحاً مسكوكاً بل عبارة وصفية مؤلَّفة؛ لا شاهد معجمي في أي مصدر على ثبوته وحدةً مصطلحية"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "لا تمييز دلالي حقيقي عن «جسم ضال» أو «جسم سائح» — دليل على أنه تركيب وصفي لا مصطلح"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تائه"
      source: step05
      decision: confirmed
      decision_reason: "موثق في ArabTerm (الطب البيطري) بوصفه مقابلاً مباشراً لـ erratic في سياق الكائنات والأجسام؛ الجذر ت-و-ه راسخ في المعاجم بمعنى الضياع وانعدام المستقر؛ يتمم «شارد» دلالياً"
      step05_citation: "«تائه» = erratic — المعجم الموحد لمصطلحات الطب البيطري (2010)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الضياع والتيه (الجذر ت-و-ه: ضاع وتحيّر ولم يجد طريقه)، ويُفيد ضمناً غياب الوعي بالطريق — بخلاف «شارد» الذي يحمل معنى النفور الإرادي والانفصال"
      example: "رُصد الجرم التائه وهو يعبر المجموعة الشمسية قادماً من خارجها دون مدار ثابت ولا نجم ينتمي إليه"
      actions:
        - command: create_entry
          params:
            lemma: "تائه"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09491367-n"

    - lemma: "طائح"
      source: step05
      decision: removed
      decision_reason: "لفظ كلاسيكي نادر الاستعمال في الخطاب التقني المعاصر؛ دلالته الأصلية على الهلاك والسقوط (الفاسد الذي يخطئ الغرض) أقوى من دلالته على انعدام المكان الثابت؛ يفشل اختبار التثبيت المعجمي في السياق التقني"
      step05_citation: "«الساقط الهالك في التيه الذاهب في الأرض الفاسد السهم المخطئ للغرض» — المعجم الكبير"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "تائه"
      reason: "مقابل عربي موثق لـ erratic في ArabTerm (الطب البيطري)؛ يُتمّم «شارد» بتغطية دلالة الضياع وانعدام الانتماء المكاني"
      via_command: create_entry + add_sense


step3_definition:
  definition_review_flag: true
  current_definition: "أي شيء يشبه المتشرد في عدم وجود مكان ثابت له"
  assessment:
    decision: revise
    reason: "التعريف الحالي ترجمة حرفية للإنجليزية — يعتمد استعارة بشرية («يشبه المتشرد») تُخلّ بمنهج التعريف المعجمي؛ ويفتقر إلى الجنس القريب والفصل النوعي اللازمَيْن؛ وهو دائري نسبياً إذ لا يُحدد ما الذي يميّز هذا الكيان عن غيره من الأجسام المادية"
  authored_definitions:
    - type: terminological
      text: "كيان مادي يفتقر إلى موطن جغرافي أو مداري ثابت، يُوجد في غير مكانه الأصلي نتيجة قوى خارجية أو غياب ارتباط مكاني"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "كل جسم مادي لا موطن ثابت له ولا مكان ينتسب إليه، كالصخرة الشاردة تنقلها الأنهار الجليدية بعيداً عن مصدرها"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09491367-n"
        definition_index: 0
        text: "كيان مادي يفتقر إلى موطن جغرافي أو مداري ثابت، يُوجد في غير مكانه الأصلي نتيجة قوى خارجية أو غياب ارتباط مكاني"
    - command: add_definition
      params:
        synset_id: "awn4-09491367-n"
        text: "كل جسم مادي لا موطن ثابت له ولا مكان ينتسب إليه، كالصخرة الشاردة تنقلها الأنهار الجليدية بعيداً عن مصدرها"


