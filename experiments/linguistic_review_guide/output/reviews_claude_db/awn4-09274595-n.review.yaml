# =========================================================
# مراجعة المجموعة الترادفية: awn4-09274595-n
# commemorative — جسم صُنع لتمييز حدث أو تكريم شخص
# =========================================================

step0_evidence:
  per_lemma:

    - lemma: "تذكار"
      confirm:
        - text: "«قَدَّمَ له هدية على سبيل التَّذْكار [فصيحة] — التعليق: الوارد في المعاجم ضبط كلمة «تذكار» بفتح التاء»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«التَّذْكِرة: شيء يُذكِّر أو يحذّر (٢) تَذْكار»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«تذكار» — translation_en: souvenir"
          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "souvenir أعمّ من commemorative؛ يشمل أي هدية تذكارية وليس فقط الجسم المصنوع خصيصاً لإحياء حدث"
        - text: "«تَذْكار.» — translation_en: souvenir"
          source: "المورد الحديث (2008)"
          addition: "تأكيد اتساع الدلالة لتشمل السوفينير العام"
        - text: "«(١) تذكُّر (٢) ذاكرة (٣) ذكرى (٤) تذكار (٥) إحياء ذكرى» — translation_en: remembrance"
          source: "المورد الحديث (2008)"
          addition: "تذكار يغطي أيضاً الذكرى المجردة وفعل التذكّر، وليس فقط الجسم المادي المصنوع"

    - lemma: "عملة تذكارية"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نوط تذكاري"
      source_section: "step5_english_bridge"
      evidence_citation: "«نوط تذكاري» = commemorative medal — المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      justification: "تركيب إضافي وصفي مُسجَّل في ArabTerm يُمثّل نوعاً من الأجسام التذكارية المصنوعة لإحياء الذكريات والإنجازات"
  knowledge_candidates:
    - lemma: "أثر تذكاري"
      justification: "تركيب وصفي (آلية التركيب) يُستعمل في المجالين الثقافي والتراثي للدلالة على الجسم الذي يُصنع أو يُحفظ تخليداً لحدث أو شخص؛ «الأثر» في المعجم العربي يحمل دلالة الشيء الباقي من عهد سابق"
  generation_notes: "التعريف يصف نوعاً خاصاً من الأجسام التذكارية المصنوعة لحدث أو شخص؛ الجذر ذ-ك-ر واسع لكن المعاجم لا تُفرِّق بين التذكار العام (souvenir) والتذكار الاحتفالي الخاص (commemorative object manufactured for an event) في مفرد مستقل. كلا المرشحَين أخصّ من المفهوم الكلي."

step1_lemma_validation:
  per_lemma:

    - lemma: "تذكار"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل مُثبَت في المعاجم بدلالة الشيء التذكاري؛ الأدلة المؤكِّدة وافية رغم اتساع الدلالة"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تذكار أعمّ من «عملة تذكارية»؛ يشمل كل شيء يُذكِّر بحدث أو شخص (سوفينير، هدية، أثر)؛ يتميّز بغياب قيد «المصنوع خصيصاً لحدث» الموجود في الإنجليزية — وهو الجانب الذي يجعل «تذكار» أنسب لأنه يُقابل المفهوم الكلي للمجموعة"
      loanword_check:
        is_loanword: false
      quality_gate:
        derivability: "عائلة اشتقاقية ثرية — ذَكَرَ / يُذكِّر / تَذَكَّرَ / ذِكر / ذاكرة / مذكِّر"
      morphology_fit: "وزن تَفْعَال يدلّ على الاستمرار والتكثير — ملائم لمفهوم الشيء الدائم الذي يُبقي الذكرى"
      example: "أصدر البنك المركزي تذكاراً احتفالياً بمناسبة مرور مئة عام على تأسيس المملكة، وزُعِّع على المواطنين مجاناً."

    - lemma: "عملة تذكارية"
      decision: escalated
      decision_reason: "تعبير مركب (وصفي: اسم + صفة) يُمثّل نوعاً واحداً فقط من الأجسام التذكارية (العملات المعدنية)؛ لا يشمل الطوابع البريدية ولا سائر المطبوعات التذكارية التي ينصّ عليها التعريف — تحتاج مراجعاً بشرياً ليقرر: هي hyponym أم lemma مقبول للمجموعة؟"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "تتميّز عن «تذكار» بالتخصيص في العملات النقدية؛ ومن ثَمَّ لا تقوم مقامه في الجمل التي تذكر الطوابع أو غيرها من الأجسام التذكارية"
      actions:
        - command: move_sense
          params:
            sense_id: "{auto}"
            target_synset_id: "{auto — synset أخص بالعملات التذكارية إن وُجد}"

    # ── مرشح نوط تذكاري (step05) — مرفوض ──
    - lemma: "نوط تذكاري"
      source: step05
      decision: removed
      decision_reason: "تركيب إضافي وصفي مُسجَّل في ArabTerm، لكنه أخصّ من المجموعة (ميدالية تذكارية فقط لا تشمل العملات أو الطوابع)؛ فشل اختبار الإبدال مع «تذكار» في السياقات العامة"
      step05_citation: "«نوط تذكاري» = commemorative medal — المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "نوط = ميدالية/وسام — أخصّ من المفهوم الكلي للمجموعة"

    # ── مرشح أثر تذكاري (step05) — مرفوض ──
    - lemma: "أثر تذكاري"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر — فشل اختبار السكّ؛ يمكن إبدال «أثر» بـ«معلَم» أو «رمز» وتبقى الجملة صالحة؛ فضلاً عن أن «أثر» تحمل دلالة البقايا الأثرية القديمة لا الأجسام المصنوعة حديثاً لإحياء ذكرى"
      step05_citation: "لا دليل معجمي مسجَّل"
      substitution_test:
        result: "fail"
      nuance_differentiation: "غير منطبق — مرفوض"

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "جسم (مثل عملة معدنية أو طابع بريد) صنع لتمييز حدث أو تكريم شخص"
  assessment:
    decision: revise
    reason: "لفظ «لتمييز» ترجمة حرفية لـ «to mark» غير دقيقة؛ «تمييز» في العربية يعني التفريق والتمييز بين الأشياء لا الإشارة التذكارية إلى حدث. الأدق: «تخليداً لحدثٍ» أو «لإحياء ذكرى حدث»"
  authored_definitions:
    - type: terminological
      text: "جسمٌ صغير (كعملةٍ أو طابع بريد) يُصنع تخليداً لحدثٍ بارز أو تكريماً لشخصٍ معيَّن"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
    - type: linguistic
      text: "ما يُصنع من مواد كالمعدن أو الورق تذكاراً بحدث تاريخي أو بشخصية بارزة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09274595-n"
        definition_index: 0
        text: "جسمٌ صغير (كعملةٍ أو طابع بريد) يُصنع تخليداً لحدثٍ بارز أو تكريماً لشخصٍ معيَّن"

