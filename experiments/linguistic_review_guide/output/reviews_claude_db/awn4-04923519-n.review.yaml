      source_section: "step5_english_bridge"
      evidence_citation: "«الدّارما: «أ» صفة جوهرية...» — المورد الحديث (2008)"
      justification: "مركب وصفي مُثبَّت في المورد الحديث بمعنى الخاصية الجوهرية للشيء؛ يُوظّف «صفة» (من الجذر الأوسع والأقدم) بدلاً من «خاصية»"
  knowledge_candidates:
    - lemma: "الصِّفَة الذَّاتِيَّة"
      justification: "تركيب وصفي يوظّف التقابل الفلسفي الأرسطي الراسخ في التراث العربي: الذاتي (essential/inherent) في مقابل العرضي (accidental)؛ آلية التوليد: تركيب وصفي (موصوف «صفة» + نسبة إلى «الذات»)"
  generation_notes: "المفهوم يرتكز على التقابل الأرسطي جوهري/عرضي؛ التراث الفلسفي العربي وظّف «الذاتي» و«الجوهري» للتعبير عن الصفة اللازمة للصنف"

