      justification: "مفرد عربي فصيح موثَّق في المعجم الوسيط والمعجم الكبير بمعنى «الصِّفَة التى تُميِّزه وتُحَدِّدُه»، ومُعتمَد في معجم مصطلحات المعلوماتية (2000) مقابلاً مباشراً لـ property بالمعنى الوصفي (خصائص الغرض/الكيان)"
