step0_evidence:
  per_lemma:
    - lemma: "عَلَاقَة اجْتِمَاعِيَّة"
      confirm:
        - text: "«روابط تجمع بين الأفراد على أساس اجتماعي»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«روابط تجمع بين الأفراد على أساس اجتماعي»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "التعريف المعجمي يقصر النطاق على «الأفراد» (البشر) بينما تعريف AWN يشمل «الكائنات الحية» عموماً مما يُفيد بشمول علاقات الحيوانات؛ وصيغة «روابط» (جمع) تُوحي بتعددية الروابط لا بعلاقة منفردة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "صلة اجتماعية"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(4) «أ»، صلة اجتماعية أو مهنية أو تجارية» — المورد الحديث (2008)، تحت مدخل connection"
      justification: "المورد الحديث يُدرج «صلة اجتماعية» صراحةً كأحد ترجمات connection في سياقه الاجتماعي؛ «صلة» من الجذر ص-ل-و/ي بمعنى الوصل والارتباط بين الأطراف"
  knowledge_candidates:
    - lemma: "ارتباط اجتماعي"
      justification: "اشتقاق: مصدر «ارتبط» على باب الافتعال من الجذر ر-ب-ط، يدل على حالة التلاحم المتبادل بين طرفَيْن أو أكثر في سياق اجتماعي؛ مستعمل في الأدبيات الاجتماعية العربية للدلالة على روابط دوركهايم (social bond)"
  generation_notes: "المفهوم (social relation) فضفاض جداً في WordNet؛ معظم البدائل العربية أكثر تخصصاً إما في اتجاه الصلة الشخصية (صلة) أو في اتجاه الرابط الإلزامي (ارتباط)"

step1_lemma_validation:
  per_lemma:
    - lemma: "عَلَاقَة اجْتِمَاعِيَّة"
      decision: confirmed
      decision_reason: "مُركَّب وصفي (اسم + نعت) مستقر في الاستعمال الأكاديمي العربي؛ مدعوم بمدخل ArabTerm مؤكِّد في مسرد الإعلام والتواصل؛ لا اقتراض لفظي ولا لهجية؛ يسر التداول مرتفع واشتقاقيته موثّقة (علاقات اجتماعية، العلاقة الاجتماعية)"
      evidence_assessment:
        case: "confirm_only"
        notes:
          - "المدخل الوحيد يقصر «الأفراد» بدلاً من «الكائنات الحية» — الدلالة الأساسية مؤكَّدة لكن سعة النطاق مُثارة"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميز عن الأعم «عَلَاقَة» بالتخصيص في النطاق الاجتماعي (بين كائنات حية وفق معايير اجتماعية)؛ وتتميز عن «علاقة شخصية» بشمولها جميع أشكال التفاعل الاجتماعي رسميةً كانت أم غير رسمية، فردية أم مؤسسية؛ وتتميز عن «علاقة مهنية» بعموميتها إذ تشمل الصداقة والقرابة والعلاقة المؤسسية معاً"
      example: "تُعدّ الصداقةُ والقرابةُ والزمالةُ أشكالاً متعددة من العلاقة الاجتماعية التي تربط أفراد المجتمع ببعضهم وتُنظّم تفاعلاتهم اليومية."

    - lemma: "صلة اجتماعية"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار التثبيت المعجمي: «صلة» في المعاجم الكلاسيكية (المعجم الوسيط، التوقيف على مهمات التعاريف) تعني أصلاً العطية والجائزة والهبة — دلالات تُثقل المصطلح بإيحاءات خارج نطاق التعريف؛ ولا ترد كمصطلح مسكوك في المعاجم التخصصية الاجتماعية العربية المعتمدة"
      step05_citation: "«صلة اجتماعية أو مهنية أو تجارية» — المورد الحديث (2008)، تحت مدخل connection"
      substitution_test:
        result: "fail"
      nuance_differentiation: "«صلة» تميل إلى الاتصال الشخصي أو العائلي الضيق (قرابة، معرفة) بخلاف «علاقة اجتماعية» الأشمل؛ كما أن «صلة» تحمل ظلّ العطاء والمعروف من معانيها الكلاسيكية"

    - lemma: "ارتباط اجتماعي"
      source: step05
      decision: removed
      decision_reason: "أخص من المطلوب: «ارتباط» يدل على علاقة الإلزام والتقييد المتبادل (social bond) كالزواج والتحالف، بينما «علاقة اجتماعية» أعم وأشمل حتى للتفاعلات العابرة؛ لم يُعثر على مدخل مباشر في قاعدة البيانات بهذا المعنى الاجتماعي"
      step05_citation: "مولَّد من المعرفة اللغوية الداخلية — لا مدخل مباشر في قاعدة البيانات"
      substitution_test:
        result: "fail"
      nuance_differentiation: "«ارتباط اجتماعي» يخص الروابط القوية ذات الإلزام (عقد، تحالف، زواج)؛ «علاقة اجتماعية» تشمل حتى التعارف العابر وتبادل التحية"

  synset_flags:
    definition_review_needed: true

