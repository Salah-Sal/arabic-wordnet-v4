      justification: "لفظ تراثي مسكوك في الفلسفة العربية الإسلامية، يدل مباشرةً على الطبيعة البشرية في مقابل الطبيعة الإلهية؛ آلية التوليد: اشتقاق تراثي (ناس + لاحقة -وت الكلامية) على قياس «لاهوت»"
