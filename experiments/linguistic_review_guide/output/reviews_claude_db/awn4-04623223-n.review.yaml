    - lemma: "الجِبِلَّة"
      justification: "اشتقاق من جذر ج-ب-ل (التكوين والتشكيل) على وزن فِعِلَّة يدل على الطبيعة الفطرية المجبولة؛ آلية التوليد: اشتقاق. غير أنه أعمّ من المفهوم المقصود لأنه يشمل طبيعة كل كائن لا الإنسان وحده، ولا يُخصَّص للطبيعة البشرية المشتركة إلا بإضافة"
  generation_notes: "التعريف يشير إلى مفهوم فلسفي ذي حضور راسخ في التراث العربي الإسلامي؛ اللفظ التراثي الأكثر دقة هو «الناسوت»؛ المصطلح الأكاديمي المعتمد حديثاً هو «الطبيعة الإنسانية» لا «البشرية»"

