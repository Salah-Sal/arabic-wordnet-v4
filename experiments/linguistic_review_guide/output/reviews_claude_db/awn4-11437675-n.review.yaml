step05_lemma_generation:
  evidence_candidates:
    - lemma: "آلة"
      source_section: step4_fts_keyword
      evidence_citation: "«ما اعتُمِل به من أداة، وتشمل المسطحات والعدد والأدوات — في علم الحِيَل (الميكانيكا): جهاز يؤدّى عملاً بتحويل القوى المحركة كالحرارة والبخار إلى قوى آلية» — المعجم الكبير"
      justification: "آلة تدل على كل ما يُعمَل به لأداء غرض، مطابقةً لتعريف المجموعة؛ وردت في المعاجم الكلاسيكية كمرادف متشعّب لأداة"
  knowledge_candidates:
    - lemma: "وسيلة"
      justification: "اشتقاق (فَعِيلَة من و-س-ل) يعني الواسطة التي يُتوصَّل بها إلى الغرض — آلية التوليد: الاشتقاق. تُستعمل في الفصحى المعاصرة في تراكيب مثل «استخدمه وسيلةً للضغط» التي تقابل تماماً 'engine of coercion' في الإنجليزية"
  generation_notes: "التعريف فضفاض (شيء يستخدم لتحقيق غرض) يشمل حقلاً دلالياً عربياً واسعاً: أداة / آلة / وسيلة / عدة / ذريعة. آلة هي المرشح الأقرب من الأدلة المعجمية، ووسيلة من المعرفة اللغوية"

