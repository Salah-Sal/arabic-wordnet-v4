step1_lemma_validation:
  per_lemma:

    - lemma: "أداة"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة قوية — تعريفا المعجم الكبير وكتاب العين يطابقان تعريف المجموعة مباشرةً؛ الأدلة التوسّعية تكشف معاني مستقلة لا تقدح في صلاحية اللمّة"
      evidence_assessment:
        case: expands
        notes:
          - "الأدلة المؤكِّدة الأساسية صريحة؛ التوسّع نحو الأداة النحوية وأداة الحرب يستدعي scope_note"
      substitution_test:
        result: pass
      nuance_differentiation: "أداة تُبرز الجانب الوظيفي الخادم — شيء محكوم في يد فاعل يُوظِّفه لغرضه، مع إيحاء بالبساطة التقنية أو صغر الحجم نسبةً إلى «آلة»"
      example: "وظَّفَت الأنظمةُ الاستبدادية الإعلامَ أداةً لتضليل الرأي العام وإسكات كل صوت معارض."

    - lemma: "محرك"
      decision: escalated
      decision_reason: "تعارض دلالي حقيقي: المعنى الأساسي في المعاجم (المحرك الميكانيكي، آلة تحويل الطاقة) أخصّ من التعريف ولا يصلح مدخلاً للمجموعة؛ والمعنى الاشتقاقي (مُفعِّل غيره = اسم فاعل) يُقرِّبه من المُشتمِل «عامل مسبب» لا من «شيء يستخدم لغرض» — يحتاج حسماً بشرياً"
      evidence_assessment:
        case: mixed
        notes:
          - "المعنى التقني الطاغي (mechanical engine) يخصّص المفهوم أكثر مما ينبغي لهذه المجموعة"
          - "المعنى الاشتقاقي (اسم فاعل = الذي يُخرج غيره عن سكونه) يتداخل مع مُشتمِل «عامل مسبب» لا مع دلالة الأداة"
          - "المعنى التشريحي (أصل العنق) لا صلة له بأي من المعنيين"
      substitution_test:
        result: fail
        failure_sentences:
          - original: "وظَّفَت الأنظمةُ الإعلامَ أداةً لتضليل الرأي"
            substituted: "وظَّفَت الأنظمةُ الإعلامَ محرِّكاً لتضليل الرأي"
            preserved_meaning: false
            why_failed: "«محرك» في هذا التركيب يوحي بالآلة الفاعلة الدافعة لا بالشيء المُسيَّر في يد فاعل — الإبدال مُكلَّف ويُغيِّر الصورة الذهنية"
      nuance_differentiation: "محرك يُبرز الدور الديناميكي الدافع للحركة (agent of motion) لا مجرد الأداة المُسيَّرة لغرض؛ هذا التمييز يجعله معنوياً أقرب إلى الاشتمال «عامل مسبب» منه إلى هذه المجموعة"

    # ── مرشح من الخطوة ٠٫٥ — آلة (مرفوض) ──
    - lemma: "آلة"
      source: step05
      decision: removed
      decision_reason: "مرادف شبه تام لـ«أداة» الموجودة في المجموعة — لا يضيف ظلاً دلالياً مستقلاً كافياً لتبرير وجوده؛ كما أن «آلة» في المعجمية العربية تنزع إلى الأعم (آلة السينما / آلة الحرب) وقد تنتمي إلى مجموعة اشتمال أعلى من هذه"
      step05_citation: "«ما اعتُمِل به من أداة، وتشمل المسطحات والعدد والأدوات» — المعجم الكبير"
      substitution_test:
        result: pass
      nuance_differentiation: "آلة تميل إلى الأجهزة الأكبر والأعقد آليةً من أداة؛ الفرق غير حاسم لكنه كافٍ لجعل آلة في مجموعة مجاورة لا في هذه المجموعة بالذات"

    # ── مرشح من الخطوة ٠٫٥ — وسيلة (مرفوض) ──
    - lemma: "وسيلة"
      source: step05
      decision: removed
      decision_reason: "وسيلة تُعبِّر عن مفهوم «الواسطة إلى الغرض» (means / medium) لا عن «الشيء المستخدَم» (instrument) — تنتمي إلى مجموعة ترادفية مجاورة، وإدراجها هنا يُنشئ تداخلاً مع synsets «means» المستقلة"
      step05_citation: "لا دليل على تثبيت «وسيلة» مقابلاً معجمياً لـ«engine» (بمعناه المجرد) في المعجمية العربية التخصصية"
      substitution_test:
        result: pass
      nuance_differentiation: "وسيلة تُركِّز على مسار الوصول (الطريق نحو الهدف) بينما تُركِّز أداة على الشيء ذاته المستخدَم — هذا الفرق الجوهري يُبعد وسيلة عن هذه المجموعة"

  synset_flags:
    definition_review_needed: true

