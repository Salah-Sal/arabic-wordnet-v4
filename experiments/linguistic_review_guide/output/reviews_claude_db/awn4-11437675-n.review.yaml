## مراجعة المجموعة الترادفية — awn4-11437675-n
## synset: أداة / محرك — "شيء يستخدم لتحقيق غرض ما"

# ══════════════════════════════════════════════════════
# الخطوة ٠: استخلاص الأدلة المعجمية
# ══════════════════════════════════════════════════════

step0_evidence:
  per_lemma:

    - lemma: "أداة"
      confirm:
        - text: "«وسيلةٌ يُستعان بها لتأدية عَمَلٍ ما كالمطرقة والمِبْرد والمِخرطة»"
          source: "المعجم الكبير"
        - text: "«آلة الحرفة التي يقيم بها صاحبها حرفته»"
          source: "كتاب العين"
      expands:
        - text: "«أَدَاة الحَرْب: سلاحها الأُهْبَة والعُدَّة»"
          source: "المعجم الكبير"
          addition: "يتوسّع المعنى ليشمل مجموع العتاد والتجهيزات العسكرية، لا الأداة الفردية وحدها"
        - text: "«الآلة الصغيرة — في اصطلاح النحويين: اللفظة تستعمل للربط بين الكلام أو للدلالة على معنى في غيرها كالتعريف في الاسم أو الاستقبال في الفعل»"
          source: "المعجم الوسيط"
          addition: "الاستعمال النحوي (أداة = حرف) مستقل تماماً عن الدلالة الأدواتية العامة — معنيان منفصلان تحت اسم واحد"

    - lemma: "محرك"
      confirm:
        - text: "«مُحَرِّك: الذي يخرج غيره عن سكونه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«engine: آلةٌ تُحوِّل الطاقة إلى شغل (الشغل = قوة × مسافة) — منها الحراري ومنها الكهربائي»"
          source: "المعجم الكبير"
          conflict: "المعنى التقني (آلة تحويل الطاقة) أخصّ بكثير من «شيء يستخدم لتحقيق غرض» — يقتصر على فئة محددة من الأجهزة الهندسية"
        - text: "«(المحرك) أصل الْعُنُق من أَعْلَاهُ وَهُوَ مُنْتَهى الْعُنُق عند المفصل من الرأس»"
          source: "المعجم الوسيط"
          conflict: "معنى تشريحي (أصل العنق) لا صلة له بتعريف المجموعة"
      expands:
        - text: "«جهاز يُحوِّل الطاقة إلى عمل ميكانيكي»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يُكشف عن معنى هندسي تقني ضيّق يتجاوز نطاق التعريف العام"
      peripheral_observations:
        - "مُحَرِّك بوصفه اسم فاعل (الذي يُحرِّك غيره) يُشير إلى دور الفاعل الديناميكي لا إلى الأداة المُسيَّرة — مما يُقرِّبه من المُشتمِل «عامل مسبب» أكثر من انتمائه إلى هذه المجموعة"

# ══════════════════════════════════════════════════════
