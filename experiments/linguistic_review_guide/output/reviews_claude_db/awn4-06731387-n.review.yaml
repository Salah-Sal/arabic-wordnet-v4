step0_evidence:
  per_lemma:

    - lemma: "تَشْهِير"
      confirm:
        - text: "«(2) ذمٌّ؛ قَذْفٌ؛ طَعْنٌ؛ تشهير.»"
          source: "المورد الحديث (2008) — مقابل aspersion"
        - text: "«قَذْف؛ تشهير؛ افتراء.»"
          source: "المورد الحديث (2008) — مقابل defamation"
        - text: "«(1) قَذْف؛ قَدْح؛ تشهير»"
          source: "المورد الحديث (2008) — مقابل slur"
        - text: "«(2) طعن؛ قذف؛ تشهير»"
          source: "المورد الحديث (2008) — مقابل libel"
      expands:
        - text: "«التشهير: أَن يبْعَث القَاضِي رجلا إِلَى محلته ليقال إِنَّا وجدنَا هَذَا شَاهد الزُّور فَاحْذَرُوهُ وَإِن كَانَ سوقيا يَبْعَثهُ إِلَى محلته فَيُقَال ذَلِك.»"
          source: "دستور العلماء للأحمدنكري"
          addition: "المعنى الكلاسيكي يخصّص التشهير بإجراء قضائي رسمي لإعلان كذب الشاهد علنًا — أوسع من «ملاحظة مهينة» وأدلّ على التفضيح الممنهج لا على ملاحظة عابرة"

    - lemma: "طَعْن"
      confirm:
        - text: "«طعن فلان على فلان: إذا أدخل عليه العيب»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«الطعن: الضرب بالرمح، واستعير للوقيعة.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الطَّعْن ... العيب»"
          source: "المعجم الوسيط"
        - text: "«(1) طعنٌ؛ قَذفٌ؛ قَدْح»"
          source: "المورد الحديث (2008) — مقابل obloquy"
        - text: "«(1) قَدْحيّ؛ ذَمّيّ؛ طَعْنيّ (2) قَدْح؛ ذمّ؛ طعن.»"
          source: "المورد الحديث (2008) — مقابل invective"
      contradicts:
        - text: "«النخس في الشيء بما ينفذه»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الحسي (النخس الجسدي بآلة حادة) مختلف جذريًا عن «ملاحظة مهينة» — المعنى الأساسي للجذر مادي لا كلامي"
        - text: "«أثـرُ الوَخْـزِ بالرُّمْحِ وغيره»"
          source: "المعجم الكبير"
          conflict: "الوخز بالرمح هو الدلالة الأولى للجذر ط-ع-ن — التعريف الحسي يناقض دلالة القول المهين"
      expands:
        - text: "«(الطعْن) بطريق النقض (في قانون المرافعات) أن يرفع المحكوم عليه الحكم النهائي إلى محكمة النقض طالبًا نقضه لأسباب ترجع إلى القانون لا إلى الوقائع»"
          source: "المعجم الوسيط"
          addition: "معنى قانوني تقني مستقل (الطعن في الأحكام القضائية) لا علاقة له بتعريف المجموعة"
        - text: "«(في الانتخابات): ادّعاءٌ ببطلان»"
          source: "المعجم الكبير"
          addition: "معنى انتخابي/سياسي مستقل عن المعنى المراد"

    - lemma: "لَطْخَة"
      confirm:
        - text: "«(2) لطخة؛ وصمة عار»"
          source: "المورد الحديث (2008) — مقابل slur"
        - text: "«(6) لَطْخة»"
          source: "المورد الحديث (2008) — مقابل smear"
      contradicts:
        - text: "«رجلٌ لُطْخَةٌ: أحمق لا خير فيه»"
          source: "المعجم الوسيط"
          conflict: "التعريف الأساسي في المعجم الوسيط يصف شخصًا أحمق لا قولاً مهينًا — فجوة بين الدلالة المعجمية والمعنى المراد"
        - text: "«(اللطخة) يُقَال رجل لطخة أَحمَق لَا خير فِيهِ»"
          source: "المعجم الوسيط (الطبعة الهوراماني)"
          conflict: "المعنى المعجمي المتكرر في المصدرين: وصف الشخص الأحمق — لا القول المهين كفعل كلامي"
      peripheral_observations:
        - "لَطْخَة في الاصطلاح الطبي: بقعة أو مسحة على سطح ما (لطخة مخاطية، لطخة بابانيكولاو) — معنى تقني مستقل تمامًا"
        - "المعنى الأصيل: أثر مادي لزج على سطح ما — والاستعمال المجازي (وصمة عار) يُعبّر عن الأثر السلبي لا عن القول نفسه"


step05_lemma_generation:
  evidence_candidates:
