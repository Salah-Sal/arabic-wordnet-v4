      source_section: step5_english_bridge
      evidence_citation: "«(2) قَدْح؛ ذمّ؛ طعن.» — المورد الحديث (2008) [invective]; «(1) يَذُمّ؛ يَقْدَح بِـ (2) ذَمٌّ؛ قَدْح.» — المورد الحديث (2008) [dispraise]"
      justification: "مصدر من الجذر ق-د-ح يدل تحديدًا على إنزال الشخص من منزلته وثلم شرفه بالكلام — مرادف كلاسيكي راسخ للطعن في القدر والانتقاص من الشأن. آلية التوليد: اشتقاق (مصدر الفعل الثلاثي قَدَحَ)"
  knowledge_candidates:
