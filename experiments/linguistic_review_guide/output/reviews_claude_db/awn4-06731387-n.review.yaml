      justification: "مصطلح تراثي كلاسيكي يُعرَّف بأنه ضد المدح وينبئ عن انحطاط شأن الغير — تثبته كتب الفروق والتعريفات الفقهية. آلية التوليد: اشتقاق (مصدر الفعل الثلاثي ذَمَّ من ذ-م-م)"
  generation_notes: "التعريف يدور حول فعل كلامي (قول/كلام) يستهدف تحقير الغير أو الإساءة لسمعته — الجذر الدلالي الأكثر دقةً للمفهوم هو ق-د-ح بمعنى الانتقاص الكلامي، يليه ذ-م-م بمعنى ضد المدح"


step1_lemma_validation:
  per_lemma:

    - lemma: "تَشْهِير"
      decision: confirmed
      decision_reason: "أدلة مؤيدة متعددة من المورد الحديث كمقابل لـ aspersion وslur وdefamation وlibel — المعنى الحديث للتشهير (الإساءة للسمعة علنًا) متوافق مع تعريف المجموعة؛ المعنى الكلاسيكي الأوسع (الإجراء القضائي) لا يُبطل الاستعمال الحديث الشائع"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يُركّز على الإعلان العلني والتفضيح الممنهج للسمعة — أشدّ وطأةً من طعن أو قدح في أنه يستدعي نشر الإساءة على منابر عامة أو أمام جمهور؛ أقرب إلى defamation/libel منه إلى disparagement البسيط"
      example: "وجّه المدّعي في مستهل جلسة الاستماع ملاحظاتٍ فيها تشهيرٌ صريح بمنافسه أمام هيئة التحكيم."

    - lemma: "طَعْن"
      decision: confirmed
      decision_reason: "المعنى المجازي (الوقيعة / إدخال العيب) ثابت في المعاجم الكلاسيكية منذ كتاب العين — نصّ المناوي «استعير للوقيعة» يُثبّت هذا المجاز بصريح العبارة؛ رغم أن الأصل الحسي يناقض، فإن الاستعمال المجازي الكلاسيكي المُثبَّت كافٍ للقبول"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يُستعمل تحديدًا في الطعن بالمصداقية والكفاءة والنزاهة («طعن في شهادته»، «طعن في سيرته») — أقوى في السياقات الرسمية والقانونية؛ يفترض هدفًا محددًا ومستضعفًا بعكس التشهير الذي قد يكون حملةً منتشرة"
      example: "لم يتوقف المنتقدون عن توجيه طعنٍ في مصداقية الشاهد الرئيسي طوال جلسات المحاكمة."

    - lemma: "لَطْخَة"
      decision: escalated
      decision_reason: "تناقض جوهري بين دلالتي الكلمة: (١) التعريف المعجمي المتكرر يُعرّفها بـ«رجل أحمق»؛ (٢) الاستعمال المجازي يجعلها «وصمة عار» أي الأثر/النتيجة لا فعل الكلام نفسه — فجوة بين الأثر (stain) والفعل الكلامي (remark)؛ يحتاج مراجعًا بشريًا ليقرر: هل تُوضع في synset «ملاحظة مهينة» أم في synset «وصمة في السمعة»؟"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: fail
        failure_sentences:
          - original: "وجّه إليه طعنًا أمام الملأ"
            substituted: "وجّه إليه لطخةً أمام الملأ"
            preserved_meaning: false
            why_failed: "«لطخة» في هذا السياق لا تُشير إلى فعل كلامي بل إلى الوصمة الناجمة — «ترك لطخةً في سمعته» تصف الأثر لا القول الذي أوجده"
      nuance_differentiation: "لطخة تدل على الأثر السلبي (الوصمة في السمعة) لا على فعل الكلام ذاته — فرق بين المسبِّب (القول المهين) والأثر (الوصمة)؛ أقرب إلى stain/blemish منها إلى remark/statement"

    # ── مرشح من الخطوة ٠٫٥ — مقبول ──
    - lemma: "قَدْح"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح كلاسيكي راسخ للقول الذي يُنقَّص به قدر الشخص — يجمع بين الفعل الكلامي (قول) والأثر التحقيري؛ يملأ الفجوة الدلالية التي كشفتها مشكلة «لطخة»، ويصمد أمام اختبار السكّ المصطلحي (تعبير ثابت في الفصحى: «قدح في شرفه / في كرامته»)"
      step05_citation: "«(2) قَدْح؛ ذمّ؛ طعن.» — المورد الحديث (2008) [invective]; «(1) يَذُمّ؛ يَقْدَح بِـ (2) ذَمٌّ؛ قَدْح.» — المورد الحديث (2008) [dispraise]"
      substitution_test:
        result: pass
      nuance_differentiation: "يُركّز على إنزال المنزلة وثلم الشرف بكلام مباشر («قدح في كرامته أمام زملائه») — أدق من طعن في التعبير عن الانتقاص الكلامي المباشر، وأرسخ من لطخة في دلالة القول نفسه لا أثره"
      example: "رأى المتهم في ملاحظات القاضي قدحًا صريحًا في شرفه لا تقتضيه متطلبات الفصل في القضية."
      actions:
        - command: create_entry
          params:
            lemma: "قَدْح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06731387-n"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "ذَمّ"
      source: step05
      decision: removed
      decision_reason: "مصدر عام يدل على مجمل فعل الذم والانتقاص — أوسع من «ملاحظة مهينة» (count noun)، إذ هو أقرب للأعم (المفهوم الكلي للانتقاص) منه للمرادف المحدد؛ فضلاً عن أن «انتقاص» الموجود في الأعم (awn4-06730109-n) يغطي هذا المعنى بالفعل"
      step05_citation: "«الذّمّ: ضد المدح وهو قول أو فعل أو ترك قول أو فعل ينبئ عن اتّضاح حال الغير وانحطاط شأنه» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"

