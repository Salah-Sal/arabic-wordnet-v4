step0_evidence:
  per_lemma:

    - lemma: "عالم آخر"
      confirm:
        - text: "«يحيل العالم الآخر على عوالم مركزيات أخرى، لكنه يتجه إلى التنبؤ بعالم ميتافيزيقي كما في رسالة الغفران والكوميديا الإلهية والفردوس المفقود بما أنها عوالم بشرية يُحِس بها ولا تدرك»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«الآخِرة: العالَم الآخَر»"
          source: "المورد الحديث (2008)"
        - text: "«الآخرة؛ العالم الآخر»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«يحيل العالم الآخر على عوالم مركزيات أخرى ... بما أنها عوالم بشرية يُحِس بها ولا تدرك»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "توسيع دلالي نحو العوالم الأدبية الخيالية (رسالة الغفران، الكوميديا الإلهية، الفردوس المفقود) — يتجاوز الحدّ الروحي المجرد المحدّد في تعريف المجموعة"

    - lemma: "عالم الغيب"
      confirm:
        - text: "«عالم الغيب المختصُّ بالأرواح والنفوس والعجائب»"
          source: "المعجم الوسيط (تعريف الملكوت)"
        - text: "«الملكوت: عالم الغيب المختص بالأرواح والنفوس»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«خلاف الشهادة كلّ ما غاب عن الإنسان سواء أكان مُحصَّلاً فى القلوب أم غير مُحصَّل»"
          source: "المعجم الوسيط (تعريف الغيب)"
      expands:
        - text: "«الغيب: الشك»"
          source: "كتاب العين"
          addition: "دلالة قديمة للغيب تشمل الشك وانعدام اليقين — أوسع من الدلالة الروحية الإسلامية التي استقر عليها اللفظ"
      peripheral_observations:
        - "«كل ما غاب عنك هبطة من الأرض» — مجمل اللغة: معنى حرفي مادي قديم للغيب (المنخفض في الأرض)، منفصل تماماً عن الدلالة الروحية المقصودة، ميت في الاستعمال المعاصر"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "الملكوت"
      source_section: "step4_fts_keyword"
      evidence_citation: "«عالم الغيب المختصُّ بالأرواح والنفوس والعجائب» — المعجم الوسيط؛ «الملكوت: عالم الغيب المختص بالأرواح والنفوس» — كتاب التعريفات للشريف الجرجاني"
      justification: "مصطلح قرآني راسخ (أَوَلَمْ يَنظُرُوا فِي مَلَكُوتِ السَّمَاوَاتِ وَالْأَرْضِ) يُعادل تعريفياً «عالم الغيب المختص بالأرواح والنفوس» — مطابق مباشر للتعريف الجوهري لدلالة المجموعة"
    - lemma: "الآخرة"
      source_section: "step5_english_bridge"
      evidence_citation: "«الآخِرة: العالَم الآخَر» — المورد الحديث (2008) [ترجمة: otherworld]"
      justification: "المورد الحديث يُعادل صراحةً «otherworld» بـ«الآخِرة: العالَم الآخَر» — هو اللفظ الأكثر شيوعاً وأصالةً في العربية للدلالة على عالم روحي مجرد يقع خارج حدود الواقع الدنيوي"
  knowledge_candidates:
    - lemma: "الملأ الأعلى"
      justification: "تركيب إضافي (الملأ + الأعلى) مُستمدّ من القرآن الكريم (ص: 69) — آلية التوليد: مجاز بالانتزاع التراثي؛ يشير إلى الجمع الروحاني السامي في العوالم العلوية، غير أن دلالته تتمحور حول الكائنات الروحانية ذاتها لا العالم بوصفه وعاءً"
    - lemma: "عالم الأرواح"
      justification: "تركيب إضافي (عالم + الأرواح) — آلية التوليد: تركيب؛ يصف العالم المجرد من حيث سكّانه (الأرواح) في الخطاب الروحاني العربي الحديث، غير أنه أضيق من التعريف المقصود إذ يقصره على الكيانات الروحانية دون سائر أبعاد الغيب"
  generation_notes: "التعريف يدور حول ثلاثة محاور: الطابع الروحي (روحي)، التجريد (مجرد)، والموقع خارج الواقع الدنيوي (خارج حدود الدنيا). الجذور الدلالية المركزية المنتجة: غ-ي-ب (الغيب)، م-ل-ك (الملكوت)، أ-خ-ر (الآخرة)"


step1_lemma_validation:
  per_lemma:

    - lemma: "عالم آخر"
      decision: confirmed
      decision_reason: "تعبير وصفي مُستقر في المعاجم التخصصية العربية المعاصرة (المعجم الموحد لمصطلحات اللسانيات، المورد الحديث)؛ بوابة الجودة: فصيح شائع، يسير التداول، ملائم للمفهوم، لا بديل مفرد تراثي يؤدي المعنى ذاته بشموله، عربي أصيل، مشتق جزئياً (عالم → عوالم)"
      evidence_assessment:
        case: "expands"
      mwe_check:
        is_mwe: true
        type: "وصفي"
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "أعمّ دلالةً وأقلّ التزاماً دينياً من «عالم الغيب» — يصلح للإشارة إلى أي عالم آخر سواء أكان روحياً أم خيالياً أم فلسفياً، ويُستعمل في السياقات الأدبية والفلسفية العلمانية بخلاف «عالم الغيب» المرتبط بالإطار العقدي الإسلامي"
      example: "تتجلّى في ملاحم الإنسانية الكبرى رحلةُ البطل إلى عالم آخر لا تبلغه الأجساد ولا تُدركه الحواس."

    - lemma: "عالم الغيب"
      decision: confirmed
      decision_reason: "تعبير إضافي مُستقر مؤكَّد بذكره صريحاً في تعريف الملكوت بالمعجم الوسيط وكتاب التعريفات للجرجاني؛ مصطلح عقدي راسخ يرتبط بركن الإيمان بالغيب في الإسلام؛ بوابة الجودة: تراثي راسخ، قرآني الجذر، يسير النطق، ملائم، مشتق (غاب → غيب → غيبي → الاغتياب)"
      evidence_assessment:
        case: "expands"
      mwe_check:
        is_mwe: true
        type: "إضافي"
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يحمل حمولة دينية وعقدية خاصة ترتبط بالإيمان بالغيب بوصفه ركناً إسلامياً — يُقابَل بـ«عالم الشهادة» ويستلزم إطاراً لاهوتياً؛ أخصّ من «عالم آخر» وأعمّ من «الملكوت»"
      example: "صاغ المتكلمون أدلّتهم على وجود الله انطلاقاً من الإيمان بعالم الغيب الذي يتجاوز إدراك الحواس ويُعلن عنه الوحي."

    - lemma: "الملكوت"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح قرآني راسخ (أَوَلَمْ يَنظُرُوا فِي مَلَكُوتِ السَّمَاوَاتِ وَالْأَرْضِ — الأعراف: 185) تُعرّفه المعاجم الكلاسيكية بـ«عالم الغيب المختص بالأرواح والنفوس»؛ يجتاز بوابة الجودة: تراثي، مفرد مشتق على وزن فَعَلُوت (توليد داخلي)، يسير، مشتق (ملك → ملكوت → ملكوتي)؛ الوزن الصرفي فَعَلُوت يناسب المفاهيم المجردة ذات الطابع المبالغي"
      step05_citation: "«عالم الغيب المختصُّ بالأرواح والنفوس والعجائب» — المعجم الوسيط؛ «الملكوت: عالم الغيب المختص بالأرواح والنفوس» — كتاب التعريفات للشريف الجرجاني"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُضيف إلى البُعد الروحي المجرد دلالةَ السلطان الإلهي والعزّ — مختص بالتصور الإسلامي والصوفي عن الوجود الروحاني؛ يُقابَل الملكُ (عالم الشهادة) بالملكوت (عالم الغيب) في المعجم الصوفي"
      example: "أَوَلَمْ يَنظُرُوا فِي مَلَكُوتِ السَّمَاوَاتِ وَالْأَرْضِ وَمَا خَلَقَ اللَّهُ مِن شَيْءٍ"
      actions:
        - command: create_entry
          params:
            lemma: "الملكوت"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05818169-n"

    - lemma: "الآخرة"
      source: step05
      decision: confirmed
      decision_reason: "المورد الحديث (2008) يُعادل صراحةً «otherworld» بـ«الآخِرة: العالَم الآخَر» — هو اللفظ القرآني الأكثر شيوعاً وتداولاً في العربية للعالم الروحي ما بعد الدنيوي؛ بوابة الجودة: قرآني راسخ، يسير، ملائم، تراثي، مشتق (أَخَّر → آخِرة → أخروي → إخروية)"
      step05_citation: "«الآخِرة: العالَم الآخَر» — المورد الحديث (2008) [ترجمة: otherworld]؛ «مقابل الأولى دار الحياة بعد الموت» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تحمل دلالة خاصة بما بعد الموت والحياة الأبدية تحديداً — أضيق من «عالم الغيب» الذي يشمل كل الغيب في الحياة الدنيا وما بعدها، وأكثر تخصصاً من «عالم آخر» الذي قد يُطلق على عوالم خيالية"
      example: "وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ"
      actions:
        - command: create_entry
          params:
            lemma: "الآخرة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05818169-n"

    - lemma: "الملأ الأعلى"
      source: step05
      decision: removed
      decision_reason: "يدل على الملائكة والكائنات الروحانية السامية (ساكنو العالم الروحي) لا على العالم الروحي ذاته — فشل اختبار السكّ: لم يرد في المعاجم التخصصية بمعنى «عالم روحي مجرد»؛ وفشل اختبار الإبدال: «يؤمن بعالم الغيب» ≠ «يؤمن بالملأ الأعلى» (الثانية تُقصّر الدلالة على الكائنات)"
      step05_citation: "القرآن الكريم (ص: 69) — «مَا كَانَ لِيَ مِنْ عِلْمٍ بِالْمَلَإِ الْأَعْلَىٰ»"

    - lemma: "عالم الأرواح"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر يمكن إبدال «الأرواح» فيه بـ«الملائكة» أو «الجن» ويظل وصفياً للمفهوم — فشل اختبار التثبيت المعجمي: لم يرد كمصطلح مسكوك في المعاجم الكلاسيكية المعتمدة؛ يضيّق الدلالة على الأرواح دون سائر أبعاد الغيب"
      step05_citation: "لا دليل معجمي مباشر"

  added_lemmas:
    - lemma: "الملكوت"
      reason: "مصدر: الخطوة ٠٫٥ — مصطلح قرآني يُعادل تعريفياً «عالم الغيب المختص بالأرواح والنفوس»"
