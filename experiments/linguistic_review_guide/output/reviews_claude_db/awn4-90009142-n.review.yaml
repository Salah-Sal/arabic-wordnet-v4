step0_evidence:
  per_lemma:

    - lemma: "مثير للإعجاب الفوري"
      confirm:
        - text: "«مثير للإعجاب: خطاب يثير التقدير والاحترام»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«مثير للإعجاب: خطاب يثير التقدير والاحترام»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "المدخل المعجمي يُقيِّد المصطلح بـ«خطاب» (discourse) لا بشيء عام على وسائل التواصل؛ وإضافة «الفوري» غائبة عن جميع مصادر القاعدة المعجمية (760,660 مدخل)"
      expands:
        - text: "«الإعجاب: مفهوم يرتبط بعصر النهضة، ويتجاوزه إلى حالة وجدانية تمتزج بتقدير أمهات الأعمال الأدبية والفنية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "الإعجاب في المعجمية العربية يتصل بالتقدير الجمالي الراسخ للأعمال الأدبية والفنية، وهو أعمق وأوسع من التصويت الفوري على التواصل الاجتماعي"
        - text: "«الإعجاب: الترفع والتكبر، وقيل تذكار العمل ونسيان الزلل، وقيل الغفلة عن رؤية التوقيف»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المعنى الكلاسيكي للإعجاب يتضمن دلالة العُجب والكبر — بُعد سلبي مغاير تماماً لتعريف المجموعة"

    - lemma: "يستحق الإعجاب"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُعجِب"
      source_section: step9_specialized
      evidence_citation: "«مُعجِب: الشيء الذي يُعجَب منه ويُسرّ به» — موسوعة السلطان قابوس لأسماء العرب"
      reasoning: "اسم فاعل من أعجب (ع-ج-ب) يدل بصريح العبارة على الشيء المُثير للإعجاب والسرور — الجذر نفسه الوارد في تعريف المجموعة، والمعنى مطابق لجوهر التعريف"
  knowledge_candidates:
    - lemma: "رائع"
      reasoning: "آلية: اشتقاق — اسم فاعل من راع (ر-و-ع) بمعنى ما يبهر النظر ويحمل على الاستحسان؛ المعجم الوسيط يعرّفه صراحةً بـ«المُعجِب»؛ المورد الحديث يُقابله بـ admirable"
  generation_notes: "التعريف الراهن يصف مفهوماً معاصراً خاصاً بالتواصل الاجتماعي لا مصطلح عربي مسكوك بهذا المعنى المحدد؛ الأقرب معجمياً «مُعجِب» من الجذر الوارد في التعريف نفسه (ع-ج-ب)؛ العجز عن إيجاد مصطلح مسكوك لمفهوم التصويت بالإعجاب على التواصل الاجتماعي قد يُشير إلى حاجة التعريف للتنقيح نحو المفهوم الأعم"

step1_lemma_validation:
  per_lemma:

    - lemma: "مثير للإعجاب الفوري"
      decision: removed
      decision_reason: "تعبير وصفي حر يفشل اختبار السكّ — يمكن إبدال «الفوري» بـ«السريع» أو «الآني» دون تغيير في المعنى؛ كذلك يفشل اختبار التثبيت المعجمي إذ لا يرد المصطلح الكامل في أي مصدر؛ وثمة خلل في التصنيف النحوي (مركب وصفي إضافي مُدرَج كاسم)"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: "أبرز بُعد الفورية (تلقائية الإعجاب اللحظي) مقابل «يستحق الإعجاب» الذي أبرز بُعد الاستحقاق (الجدارة بالإعجاب) — كلاهما عبارة وصفية حرة لا مصطلح"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "يستحق الإعجاب"
      decision: removed
      decision_reason: "جملة فعلية إسنادية تبدأ بفعل مضارع (يستحق) — لا تصلح لمّةً في مجموعة ترادفية اسمية؛ التركيب الإسنادي مرفوض كلياً في قوائم لمّات WordNet؛ لا سند معجمي من أي مصدر"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: "أبرز بُعد الاستحقاق (الجدارة بالإعجاب من منطلق معياري) مقابل «مثير للإعجاب الفوري» الذي أبرز تلقائية الاستجابة — كلاهما ينظر إلى الإعجاب من زاوية مختلفة لكن دون صياغة مصطلحية"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُعجِب"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل عربي أصيل من الجذر ع-ج-ب؛ موثّق في المعاجم بمعنى «الشيء الذي يُعجَب منه ويُسرّ به»؛ يجتاز اختبار السكّ (لا يمكن إبدال مكوّناته إذ هو مفرد) والتثبيت المعجمي؛ متوافق مع POS اسمي؛ اشتقاقيته عالية (يُعجِب، مُعجِبات، إعجاب، عجيب)"
      step05_citation: "«مُعجِب: الشيء الذي يُعجَب منه ويُسرّ به» — موسوعة السلطان قابوس لأسماء العرب"
      substitution_test:
        result: pass
      nuance_differentiation: "يُعبِّر عن كونية الإعجاب الوجداني (ما يحمل على الإعجاب من الداخل) دون تقييد بالفورية أو بمنصات بعينها؛ أعمّ من التعريف الراهن، مما يستوجب تنقيح التعريف ليتسق مع نطاق اللمّة"
      example: "أبدع المعماري في تصميم المبنى، فأتى هيكلاً مُعجِباً حقاً اجتذب ثناء المختصين والزوار على حدٍّ سواء."
      actions:
        - command: create_entry
          params:
            lemma: "مُعجِب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-90009142-n"

    - lemma: "رائع"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل عربي فصيح من الجذر ر-و-ع؛ المعجم الوسيط يعرّفه بـ«المُعجِب»؛ المورد الحديث يُقابله بـ admirable؛ يجتاز اختبار السكّ والتثبيت المعجمي؛ متوافق مع POS اسمي وشائع في الاستعمال التخصصي والعام"
      step05_citation: "«الرائع: المُعجِب» — المعجم الوسيط؛ «رائع؛ باهر؛ ممتاز» — المورد الحديث (مقابل: admirable)"
      substitution_test:
        result: pass
      nuance_differentiation: "يُركِّز على أثر الدهشة البصرية الفورية في المتلقّي (من ر-و-ع: ما يروع ويبهت بجماله الساطع) مقابل «مُعجِب» الذي يُركِّز على استثارة وجدان الإعجاب الراسخ (من ع-ج-ب)"
      example: "صدر الديوان الشعري في حلّة رائعة أبهرت الأدباء وحملتهم على الإشادة به."
      actions:
        - command: create_entry
          params:
            lemma: "رائع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-90009142-n"

  synset_flags:
