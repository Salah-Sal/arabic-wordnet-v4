    reason: "التعريف يستعمل «مختلف» التي هي مرادف قريب للمّة «مُغايِر» المؤكدة — يُقرّب التعريف من الدور؛ كما أنه لا يُعبّر عن البُعد التحوّلي الذي تحمله لمّة «تغيير»؛ عبارة «عما سواه» مبهمة دلالياً (سواه من ماذا؟)"
  authored_definitions:
    - type: terminological
      text: "ما يتمايز في خصائصه أو صفاته عن سائر ما يُقارَن به"
