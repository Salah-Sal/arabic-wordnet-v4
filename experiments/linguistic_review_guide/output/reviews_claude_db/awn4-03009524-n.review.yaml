# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-03009524-n
# definition_en: a thing that is different
# definition_ar: شيء مختلف عما سواه
# pos: n  |  ili: i51773
# hypernym: awn4-04431553-n (شيء — كيان لم يُسمَّ بشكل محدد)
# ══════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────
# الخطوة ٠ — استخلاص الأدلة المعجمية
# ──────────────────────────────────────────────────────────────

step0_evidence:
  per_lemma:

    - lemma: بديل
      contradicts:
        - text: "«الخَلَفُ والعوض»"
          source: "المعجم الوسيط"
          conflict: "المعنى الجوهري استبدال شيء محدد بآخر (replacement/substitute) لا مجرد كون الشيء مغايراً — يخصّص المفهوم في نطاق الإحلال والعوض، وهو شرط غائب عن تعريف المجموعة"
        - text: "«واحد الأبدال عند الصوفية»"
          source: "المعجم الوسيط"
          conflict: "المعنى الصوفي للبدَل (الوليّ الرباني) بعيد تماماً عن دلالة «شيء مختلف عما سواه»"
      expands:
        - text: "«منظور مغاير لمعالجة قضية من القضايا»"
          source: "مسرد الإعلام والتواصل — ArabTerm"
          addition: "يُضيف معنى «الموقف البديل» (alternative perspective) وهو بُعد إجرائي خارج نطاق التعريف"
        - text: "«صوتية تأتي بديلاً لصوتية أخرى دون إحداث تغيير في معنى الكلمة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُضيف اشتراط التكافؤ الوظيفي بين الشيء وما يحل محله — غائب في التعريف"

    - lemma: شيء مختلف
      evidence_status: "no_material_found"

    - lemma: مُغايِر
      confirm:
        - text: "«مُغايِر: صفة لبنية تشريحيّة تتسم بأبعاد متغايرة» (heterotopic)"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«مغاير: مكوّن من أنسجة تختلف عن طبيعة العضو» (heterologous)"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«مغاير: صفة لما يبتعد عن المسار السوي» (divergent)"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«مُغايِر: unlike — تقع ثنائية (النقيض/المتعارض) على نفس المحور الدلالي، لذلك كان نقيض الأطروحة توليداً منطقياً لكل دعوى»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُضيف بُعد التضاد المحوري والتعارض الدلالي — يتجاوز مجرد الاختلاف إلى المقابلة والمعارضة"


# ──────────────────────────────────────────────────────────────
# الخطوة ٠٫٥ — توليد لمّات من التعريف (بمعزل عن اللمّات الموجودة)
# ──────────────────────────────────────────────────────────────

step05_lemma_generation:
  evidence_candidates:
    - lemma: آخَر
      source_section: step5_english_bridge
      evidence_citation: "«آخَر: يحيل الاصطلاح على المختلف والمتعدد والأجنبي وما هو منفصل عن الأنا» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "آخَر يُستعمل اسماً للدلالة على «الشيء الآخر/المغاير» — المورد الحديث يترجم different بـ «مختلف/آخَر» مما يُثبت التداخل الدلالي مع المفهوم المطلوب"

  knowledge_candidates:
    - lemma: تغيير
      justification: "اشتقاق (مصدر Form II من جذر غ-ي-ر: غيَّرَ → تغيير) — يُستعمل في الفصحى المعاصرة والتراثية اسماً للدلالة على «الشيء المختلف/المغاير عن المألوف»؛ الجملة «ذهب طلباً للتغيير» تُطابق تماماً المعنى المقصود وهو ما يُؤيّده المثال الإنجليزي للمجموعة ذاتها (he went to the beach for a change)"

  generation_notes: "المفهوم عالي التجريد (hypernym = شيء فحسب)؛ أغلب مقابلاته العربية صفات تُستعمل اسمياً (مغاير، آخَر) أو مصادر تتحوّل إلى دلالة اسمية في السياق (تغيير)"


# ──────────────────────────────────────────────────────────────
# الخطوة ١ — التحقق من اللمّات
# ──────────────────────────────────────────────────────────────

step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية — محذوفة ──
    - lemma: بديل
      decision: removed
      decision_reason: "الدلالة الأصلية «الخلف والعوض» تخصّص المفهوم في نطاق الإحلال (substitution/replacement) لا الاختلاف العام — يفشل اختبار الإبدال في سياقات الاختلاف غير الإحلالي؛ الاقتراض المفهومي مرفوض: ترجمة change بـ«بديل» ترجمة حرفية عمياء لا تنقل المدلول"
      evidence_assessment:
        case: contradicts
      substitution_test:
        result: fail
      nuance_differentiation: "يفترق عن مُغايِر في اشتراط وجود مرجع محدد يُحَل محله (X is a substitute for Y) — بينما المجموعة تدور حول الاختلاف الذاتي المستقل عن أي إحلال"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة أصلية — محذوفة ──
    - lemma: شيء مختلف
      decision: removed
      decision_reason: "تركيب وصفي حر يُعيد صياغة التعريف لا يُسمّي المفهوم — اختبار السكّ: «شيء مختلف» قابل للإبدال بـ«شيء متباين» و«شيء متغاير» وتبقى العبارة وصفاً صالحاً، مما يثبت أنها ليست وحدة معجمية ثابتة؛ غير مسجّلة في أي مصدر معجمي"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: "ليس مصطلحاً بل عبارة وصفية حرة تُعيد التعريف بمكوّناته — تعجز عن التمييز بين درجات الاختلاف (طفيف/جوهري) أو أنواعه"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة أصلية — مؤكَّدة ──
    - lemma: مُغايِر
      decision: confirmed
      decision_reason: "أدلة تأكيدية من ثلاثة معاجم تقنية بمعنى «مختلف/غير متشابه في الطبيعة» — اسم فاعل من الفعل «غايَرَ» (Form III، جذر غ-ي-ر)، يُستعمل اسمياً للدلالة على الشيء المغاير؛ اجتاز اختبار الملاءمة الصرفية وبوابة الجودة"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "يُركّز على الاختلاف النوعي الجوهري في الطبيعة أو الخصائص (heterologous/unlike in kind) — يُلمح إلى التباين التام لا الفارق الطفيف؛ يتميّز عن «تغيير» بأنه يصف صفة الاختلاف الجوهري دون إيحاء بالتحوّل أو الانتقال من حال إلى حال"
      example: "يسعى المرء أحياناً إلى مغايرٍ عمّا اعتاد عليه بُعداً عن رتابة الحياة اليومية."

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: آخَر
      source: step05
      decision: removed
      decision_reason: "المعاجم الكلاسيكية تُعرّفه بـ«أحد الشيئين/الآخِر نقيض المتقدم» — يدل على الغيرية التعاقبية أو العددية (the other of two/more) لا على الاختلاف النوعي الجوهري الذي يعبّر عنه التعريف؛ فشل اختبار التثبيت المعجمي: استعماله اسماً في هذا المعنى التجريدي غير راسخ"
      step05_citation: "«يحيل الاصطلاح على المختلف والمتعدد والأجنبي وما هو منفصل عن الأنا» — المعجم الموحد لمصطلحات اللسانيات (2002)"

    # ── مرشح من الخطوة ٠٫٥ — مقبول ──
    - lemma: تغيير
      source: step05
      decision: confirmed
      decision_reason: "مصدر قياسي من الجذر غ-ي-ر (Form II: غيَّرَ → تغيير) يُستعمل في الفصحى اسماً للدلالة على «الشيء المختلف عن المألوف» — اجتاز اختبار السكّ والتثبيت المعجمي واختبار الإبدال؛ يحمل ميزة الاشتقاقية (تغييرات، تغييري، قابل للتغيير)"
      step05_citation: "اشتقاق من جذر غ-ي-ر — مُثبَت في الاستعمال الفصيح المعاصر (جاء طلباً للتغيير؛ أحتاج إلى تغيير)"
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز البُعد التحوّلي والانتقال من حال مألوف إلى حال مغاير — مُقيَّد بسياق الخروج عن المعتاد أو الروتين؛ بخلاف «مغاير» الذي يصف الاختلاف الجوهري المطلق بمعزل عن السياق"
      example: "ذهب إلى قرية نائية طلباً للتغيير بعيداً عن صخب المدينة ورتابتها."
      actions:
        - command: create_entry
          params:
            lemma: تغيير
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03009524-n"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: تغيير
      reason: "مصدر عربي أصيل من الجذر غ-ي-ر يُعبّر بدقة عن «الشيء المختلف/المغاير» في الاستعمال الفصيح — مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense


# ──────────────────────────────────────────────────────────────
