step0_evidence:
  per_lemma:

    - lemma: "تَجْرِيد"
      confirm:
        - text: "«(فى المَنْطِق الصُّورِيّ): عَمَليَّةٌ ذِهْنِيَّةٌ يَسيرُ فيها الذِّهْنُ من الجُزْئِيَّات والأفْرادِ إلى الكُلِّيَّات والأَصْناف»"
          source: "المعجم الكبير"
        - text: "«عزل صفة أو علاقة عزلاً ذهنياً، وقصر الاعتبار عليها»"
          source: "المعجم الوسيط"
        - text: "«(التَّجْرِيد) عزل صفة أَو علاقَة عزلا ذهنيا وَقصر الِاعْتِبَار عَلَيْهَا أَو مَا يَتَرَتَّب على ذَلِك (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«عملية تحليل ومقارنة تنتهي بتعميم»"
          source: "مسرد الإعلام والتواصل — ArabTerm"
      contradicts:
        - text: "«التجريد في البلاغة: أن ينتزع من أمرٍ موصوف بصفة أمرٌ آخر مثله في تلك الصفة، للمبالغة في كمال تلك الصفة في ذلك الأمر المنتزع عنه»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "معنى بلاغي بديعي مستقل تماماً — انتزاع مشبَّه منه لا استخلاص سمات مشتركة من أمثلة"
        - text: "«التجْرِيدُ: أَن ينتزع من متصف بِصفة مثله فِيهَا؛ مُبَالغَة فِي كمالها فِيهِ»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "نفس المعنى البلاغي — التجريد البديعي ≠ الإجراء المعرفي لتكوين المفهوم العامّ"
      expands:
        - text: "«(عند المتصوفة): إماطَةُ الأَغْيَارِ والأَعْيان عن السِّرِّ والقَلْب، فتَنْكَشِف الحُجُبُ، ويكون الاتِّصالُ»"
          source: "المعجم الكبير"
          addition: "المعنى الصوفي الروحاني — تنقية الباطن من ما سوى الله — مجال دلالي مستقل"
        - text: "«التجريد: إحاطة السوى والكون عن السر والقلب إذ لا حجاب سوى الصور الكونية والأغيار المنطبعة في ذات القلب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف صوفي لا يتقاطع مع الاستخلاص المنطقي للمفاهيم"
        - text: "«عملية ثقافية تقوم على استبعاد فكري لبعض العناصر التمثيلية بإهمالها»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "تعريف لساني ثقافي يضيف بُعد استبعاد التمثيل الأدبي — أوسع من الاستخلاص الفلسفي"
      peripheral_observations:
        - "التجريد البديعي (انتزاع مشبَّه من مشبَّه به للمبالغة) مفصَّل بإسهاب في التهانوي والجرجاني والسيوطي وهو حقل دلالي مستقل"
        - "الوزن الصرفي تَفْعِيل يدل أصالةً على الحدث/العملية؛ استعماله للمفهوم الناتج (الكيان) امتداد دلالي حديث مشابه لـ«علم» و«إيمان»"

    - lemma: "كِيَان مُجَرَّد"
      confirm:
        - text: "«المُجَرَّد: ما يُدْرَكُ بالعَقْل دُونَ الحواس، كالكُليَّات»"
          source: "المعجم الكبير"
        - text: "«المُجَرَّد: ما يُدْرَك بالذهن دون الحواس»"
          source: "المعجم الوسيط"
        - text: "«(الْمُجَرّد) مَا يدْرك بالذهن دون الحواس (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«كيان: شيء مادي أو غير مادي يمكن التعرُّف عليه وتمييزه بوضوح»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
      expands:
        - text: "«المجرّد: الممكن الذي لا يكون متحيّزا ولا حالا في المتحيّز، ويسمّى مفارقا أيضا»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "المجرد في الفلسفة الإسلامية = الجوهر المفارق اللامادي (عقل، نفس، ملائكة) — أخصّ وأوجودي من مجرد «مفهوم مستخلَص»"
        - text: "«المجرد: ما لا يكون محلًا لجوهر، ولا حالًا في جوهر آخر، ولا مركبًا منهما»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "التعريف الأرسطي للجوهر المفارق — وجودي إنطولوجي لا معرفي إبستيمولوجي"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "مفهوم مجرد"
      source_section: step5_english_bridge
      evidence_citation: "«مَفْهُومٌ مُجَرَّدٌ» — المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020)، translation_en: abstract concept"
      justification: "تركيب وصفي (noun+adj) موثَّق كوحدة معجمية في ArabTerm؛ يُعيِّن الجنس (مفهوم) والصفة (مجرد) بدقة تناسب التعريف"
  knowledge_candidates:
    - lemma: "تجريد"
      justification: "اشتقاق: مصدر تَفْعِيل من جرَّد؛ العربية تستعمل المصدر على الحدث وعلى الناتج (كالعلم والإيمان)؛ المنطق الأرسطي العربي استعمله لوصف العملية ونتيجتها معاً"
    - lemma: "كُلِّيّ"
      justification: "اشتقاق: نسبة إلى كُلّ على وزن فُعليّ؛ في المنطق الكلاسيكي العربي يدل على المحمول الذي يصدق على جزئيات كثيرة — يقارب مفهوم المجرد المستخلَص من الجزئيات"
  generation_notes: "الحقل الدلالي المقصود (مفهوم عامّ مستخلَص) يتمحور حول الجذر ج-ر-د وزن تَفْعِيل والتركيب الوصفي؛ التعريب غير مطلوب لأن للمفهوم جذوراً عربية راسخة"


step1_lemma_validation:
  per_lemma:

    - lemma: "تَجْرِيد"
      decision: confirmed
      decision_reason: "الدلالة المعرفية/المنطقية موثَّقة في المعجم الكبير والمعجم الوسيط (مج) وعدة مصادر ArabTerm؛ وزن تَفْعِيل يصلح للعملية والناتج معاً في استعمال المصادر العربية"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز الجانب الإجرائي لتكوين المفهوم (الانتزاع الذهني للسمات) أكثر مما يُبرز الوجود الكياني للمجرد؛ أنسب في السياق المعرفي والفلسفي حيث يُراد وصف المفهوم بوصفه ناتجاً لعملية ذهنية"
      example: "يُعدّ التجريد قاعدةً معرفيةً يسير بها الذهن من المشخَّص الجزئي نحو المفهوم الكلي العامّ، فالإنسانية تجريدٌ مستخلَص من ملاحظة أفراد بشريين بعينهم"

    - lemma: "كِيَان مُجَرَّد"
      decision: escalated
      decision_reason: "تركيب وصفي كالِق لـ abstract entity؛ المكوِّن المجرد موثَّق جيداً فلسفياً، لكن المركَّب كيان مجرد غير مسجَّل كوحدة معجمية ثابتة في ArabTerm (الموثَّق هو مفهوم مجرد لا كيان مجرد)؛ فحص التثبيت المعجمي: فشل؛ يُوصى بمراجعة بشرية — هل يُستعاض عنه بـ«مفهوم مجرد» الأكثر توثيقاً؟"
      evidence_assessment:
        case: expands
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: "يُبرز الطبيعة الوجودية للمجرد (كيان = entity) أكثر من تجريد الذي يُبرز الإجراء؛ غير أن «كيان» في هذا السياق تتداخل مع الجوهر المفارق في الميتافيزيقا الإسلامية، مما يُوسِّع الدلالة عن المقصود"

    - lemma: "مفهوم مجرد"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح موثَّق في ArabTerm كوحدة معجمية مستقلة (المعجم الموحد لمصطلحات الاستراتيجيات التربوية 2020)؛ تركيب وصفي ثابت يجتاز فحص السكّ والتثبيت المعجمي؛ أدق من كيان مجرد في التوثيق التخصصي"
      step05_citation: "«مَفْهُومٌ مُجَرَّدٌ» — المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "أدق من تجريد في إبراز الطابع الإدراكي للوحدة المفهومية (هو مفهوم لا مجرد عملية)؛ أكثر شيوعاً في الخطاب التربوي والمعرفي؛ المركَّب الوصفي يُميِّزه عن المفهوم الجزئي الملموس"
      example: "الزمن مفهومٌ مجرّد لا يُدرَك بالحواس، وإنما يُستخلَص من ملاحظة التغيُّر والتحوُّل في الأشياء"
      actions:
        - command: create_entry
          params:
            lemma: "مفهوم مجرد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00002137-n"

    - lemma: "تجريد"
      source: step05
      decision: removed
      decision_reason: "تكرار للمّة الأصلية تَجْرِيد الموجودة في المجموعة — لا إضافة"
      step05_citation: "مطابق للمّة الأصلية — لا اقتباس إضافي"

    - lemma: "كُلِّيّ"
      source: step05
      decision: removed
      decision_reason: "الكليّ مفهوم منطقي أخصّ: المحمول الذي يصدق على جزئيات كثيرة — هو طريقة تصنيف المحمولات لا الكيان المجرد ذاته؛ فشل اختبار الإبدال: «الحرية كُلِّيّ» غير مطابق للمعنى المقصود؛ يتداخل مع الكلي/الجزئي في المنطق الصوري"
      step05_citation: "«الكُلِّي: ما لا يمنع نفس تصوره من وقوع الشركة فيه كالإنسان» — التوقيف على مهمات التعاريف للمناوي"

  added_lemmas:
    - lemma: "مفهوم مجرد"
      reason: "مصدر: الخطوة ٠٫٥ — مصطلح تربوي/فلسفي موثَّق في ArabTerm، أدق من «كيان مجرد» في التوثيق"
      via_command: create_entry + add_sense


step3_definition:
  definition_review_flag: false
  current_definition: "مفهوم عامّ يُستخلَص بانتزاع السمات المشتركة من أمثلة محدّدة"
  assessment:
    decision: retain
    reason: "التعريف دقيق ومحكم — الجنس القريب (مفهوم عامّ) والفصل المميّز (يُستخلَص بانتزاع السمات المشتركة من أمثلة محدّدة) حاضران؛ يتوافق مع الدلالة المعرفية في المعجم الكبير (الذهن يسير من الجزئيات إلى الكليات) ومع توصيف ArabTerm (عملية تحليل ومقارنة تنتهي بتعميم)؛ غير دوري ولا أضيق ولا أوسع مما ينبغي"
  scope_note: "المعاجم الكلاسيكية تتناول التجريد أكثر بوصفه عملية ذهنية لا كياناً، والتعريف الحالي يُوفِّق بين الجانبين بتسمية الناتج (مفهوم عامّ) وبيان طريقة تكوّنه"


