# مراجعة المجموعة الترادفية awn4-04624646-n
# thing — any attribute or quality considered as having its own existence
# ════════════════════════════════════════════════════════════════

step0_evidence:
  per_lemma:

    - lemma: "أمر"

      contradicts:
        - text: "«الأَمْرُ: ضِدُّ النَّهْيِ … الحادِثَةُ، ج: أُمورٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: >
            المعنى الأساسي للأمر في المعاجم هو الطلب (ضد النهي) والحادثة والشأن،
            لا «السمة أو الصفة التي تُعتبر ذات وجود مستقل». المعنيان الأكثر تداولاً
            (الطلب، والحادثة) متباينان تمام التباين عن التعريف الفلسفي المقصود.
        - text: "«الأمْر: صِيغَة يطْلب بهَا الْفِعْل من الْفَاعِل الْمُخَاطب»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: >
            التعريف الاصطلاحي-النحوي للأمر (صيغة الطلب) يناقض المعنى المقصود.

      expands:
        - text: "«الأمر: الحالُ والشَّأن … الأَمْرُ الاعْتِبارِيّ: ما يَعْتَبِرُه العقلُ من غير تَحَقُّقٍ في الخارج»"
          source: "المعجم الكبير"
          addition: >
            مصطلح «الأمر الاعتباري» في المعجم الكبير قريب من مفهوم «السمة المعتبرة ذات وجود»،
            غير أنه يُشير تحديدًا إلى ما لا تحقّق له خارج الذهن — عكس ما يعنيه التعريف من
            «وجود مستقل». معنى «الحال والشأن» توسيع دلالي لا يطابق المعنى المقصود.
        - text: "«الأمر: الشَّيْء وَقَول الْقَائِل لمن دونه افْعَل»"
          source: "دستور العلماء للأحمدنكري"
          addition: >
            يُساوي «الأمر» بـ«الشيء» مباشرةً، مما يُثبت وجود معنى ثانوي للأمر بمعنى الشيء
            المطلق؛ غير أنه معنى هامشي في المعجمية العربية.
        - text: "«(الْأَمر) الْحَال والشأن … الحادِثَة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: >
            «الحال والشأن» أوسع من «سمة ذات وجود مستقل»؛ فكل سمة ذات وجود مستقل قد تُوصف
            بأنها شأن، لكن ليس كل شأن سمةً فلسفية قائمة بذاتها.

      peripheral_observations:
        - >
          «عالَمُ الأَمرِ» مصطلح صوفي (ابن عربي وغيره) يُراد به عالم الوجود المطلق غير
          المحدود بمدة أو مادة. هذا المعنى قريب من الدلالة الفلسفية المقصودة، لكنه معنى
          اصطلاحي متخصص ولا علاقة له بالمعنى اللغوي العام لـ«الأمر».

    - lemma: "شيء"

      confirm:
        - text: "«الشَّيْء: الْمَوْجُود وَمَا يتَصَوَّر ويخبر عَنهُ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الشَّيْءُ: الموجود ما يتصور ويخبر عنه»"
          source: "المعجم الوسيط"
        - text: "«الشَّىْءُ: كلُّ موجود، حِسّيٌّ أو معنويٌّ»"
          source: "المعجم الكبير"
        - text: "«الشَّيْءُ: الموجودُ: ما يصح أن يُعلم ويُخبر عنه … ما يُتَصَوَّرُ أو يُخْبَرُ عنه، ويُراد به أساسًا الموجود»"
          source: "المعجم الكبير"
        - text: "«الشَّيْءُ: مَا يجوز أَن يخبر عَنهُ، وَتَصِح الدّلَالَة عَلَيْهِ»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الشيء: في اللغة: ما يصح أن يعلم ويخبر عنه عند سيبويه … وفي الاصطلاح: هو الموجود الثابت المتحقق في الخارج»"
          source: "التعريفات الفقهيّة للبركتي"

      expands:
        - text: "«الشّيء … بالفتح وسكون المثناة التحتانية في اللغة اسم لما يصحّ أن يعلم أو يحكم عليه أو به، موجودًا كان أو معدومًا، محالاً كان أو ممكنًا … الأشاعرة: الشيء هو الموجود … المعتزلة: الشيء هو المعلوم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: >
            يكشف التهانوي عن الجدل الكلامي حول «الشيء»: هل يشمل المعدوم؟ وهل هو مرادف
            للموجود؟ هذا البُعد الكلامي-الفلسفي أوسع من تعريف AWN الذي يُقيّد المعنى بـ
            «السمة أو الصفة» (attribute/quality). تعريف AWN أضيق دلاليًا من التراث العربي
            الذي يجعل «الشيء» أعمّ ليشمل كل ما يُتصوَّر ويُخبر عنه.


step05_lemma_generation:
  evidence_candidates:
    - lemma: "موجود"
      source_section: step4_fts_keyword
      evidence_citation: "«المَوْجُودُ: الثابت في الذهن وفي الخارج (في الفلسفة: مج)» — المعجم الوسيط"
      justification: >
        «الموجود» في الاصطلاح الفلسفي العربي هو ما ثبت له الوجود ذهنًا وخارجًا، وهو بهذا
        المعنى مرادف قريب لـ«الشيء ذي الوجود المستقل». ورد في المعجم الوسيط تعريف الشيء بـ
        «الموجود وما يتصور ويخبر عنه»، مما يُساوي الموجود بالشيء في الاستخدام الفلسفي.
  knowledge_candidates:
    - lemma: "كِيان"
      justification: >
        آلية التوليد: اشتقاق من الجذر ك-و-ن على وزن فِعال. «الكيان» يدل في الفلسفة والاستخدام
        المعاصر على الموجود ذي الوجود المستقل (entity)، وهو مصطلح مستقر في المعاجم الحديثة
        والأدبيات الفلسفية العربية. غير أن «الكيان» أوسع من «السمة أو الصفة» بمعنى attribute؛
        إذ يشمل الجواهر والأعراض معًا، وقد يُشير إلى entity أكثر من attribute.
  generation_notes: >
    التعريف يُمثّل مفهومًا فلسفيًا مجرّدًا للغاية (السمة كوجود قائم بذاتها). التراث
    الفلسفي العربي أثرى هذا المفهوم تحت مصطلح «الشيء» بالدرجة الأولى. الجسر الإنجليزي
    أظهر: خاصية/سمة/صفة لـ attribute — لكنها جميعها في المُشتمِل (awn4-00024444-n)
    لا في المجموعة الحالية، مما يُشير إلى إشكالية في موضع المجموعة في الشجرة الدلالية.


step1_lemma_validation:
  per_lemma:

    - lemma: "شيء"
      decision: confirmed
      decision_reason: >
        أدلة مؤكدة متعددة من أكثر من خمسة مصادر معجمية (الوسيط، الكبير، مقاليد العلوم،
        التعريفات الفقهية) تُثبت أن «الشيء» هو المقابل العربي الأصيل للمفهوم الفلسفي
        المعني (thing = الموجود الذي يصح الإخبار عنه).
      evidence_assessment:
        case: mixed
        notes:
          - >
            الأدلة المؤكِّدة تُعرِّف الشيء بـ«الموجود وما يتصور ويخبر عنه» — يتوافق مع
            تعريف المجموعة.
          - >
            الأدلة التوسّعية (التهانوي) تكشف أن «الشيء» في التراث العربي أوسع من
            مفهوم AWN المقيَّد بـ«السمة أو الصفة» (attribute/quality).
      substitution_test:
        result: pass
      nuance_differentiation: >
        «شيء» هو المصطلح الأعمّ الذي يستوعب كل موجود — حسيًّا أو معنويًّا. يتميز عن
        «أمر» بأن «الشيء» يُشير إلى الوجود الثابت (ما يصح الإخبار عنه)، بينما «الأمر»
        يُشير إلى الحادثة والشأن وما فيه حركة ودينامية. «الشيء» أصلح للسياق الفلسفي الذي
        يتحدث عن الوجود الثابت القائم بذاته.
      example: >
        ناقش الفلاسفة المسلمون الكلاسيكيون ما إذا كان البياض في حدّ ذاته شيئًا قائمًا
        بنفسه أم أنه لا يوجد إلا في حامله.
      actions:
        - command: set_confidence
          params:
            entity_type: sense
            entity_id: "{auto}"
            score: 0.90

    - lemma: "أمر"
      decision: removed
      decision_reason: >
        معاني «الأمر» الأساسية في المعاجم (الطلب/ضد النهي، الحادثة، الشأن) لا تُطابق
        معنى «السمة أو الصفة التي تُعتبر ذات وجود مستقل». معنى «الشيء» هو معنى هامشي
        ثانوي لـ«الأمر»، ويُخلط بين السياق الفلسفي والسياق اللغوي. فشل اختبار الإبدال
        الفلسفي: «البياض أمرٌ قائم بذاته» غير متداول في اللغة المتخصصة.
      evidence_assessment:
        case: mixed
        notes:
          - >
            المعاجم تُثبت أن «الأمر» يُستخدم أحيانًا بمعنى «الشيء» (دستور العلماء)،
            لكنه معنى هامشي لا يُشكّل المعنى المعجمي الرئيسي.
          - >
            المعنى الفلسفي الأقرب («الأمر الاعتباري») يُشير إلى ما لا تحقق له خارج الذهن،
            وهو ضد المقصود (وجود مستقل).
      substitution_test:
        result: fail
      nuance_differentiation: >
        «أمر» في الوجدان العربي يحمل دلالة الحدث والشأن والطلب — لا الوجود الثابت القائم
        بذاته. الإبدال في سياق فلسفي («البياض أمرٌ ذو وجود مستقل» مقابل «البياض شيءٌ ذو
        وجود مستقل») يُظهر أن «أمر» ينقل دلالة أضعف وأقل دقة في هذا السياق.
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "موجود"
      source: step05
      decision: removed
      decision_reason: >
        «الموجود» أوسع دلاليًا من المفهوم المقصود: فهو يشمل الجواهر والأعراض والمجردات
        والمحسوسات، بينما التعريف مُقيَّد بـ«السمة أو الصفة» (attribute/quality). إضافة
        «موجود» ستُفضي إلى تداخل مع مجموعات ترادفية أخرى. فشل اختبار التثبيت المعجمي:
        «الموجود» لا يُستخدم وحده مصطلحًا مستقرًا بمعنى «attribute with own existence».
      step05_citation: "«المَوْجُودُ: الثابت في الذهن وفي الخارج (في الفلسفة)» — المعجم الوسيط"

    - lemma: "كِيان"
      source: step05
      decision: removed
      decision_reason: >
        «الكيان» يُقابل entity (الكيان الذي له وجود مستقل) لا attribute (السمة/الصفة)؛
        فالكيان يشمل الجواهر ولا يختص بالصفات. إضافته ستنقل الدلالة من «سمة بوجود مستقل»
        إلى «موجود بوجود مستقل» مما يُبدّل المعنى تبديلًا جوهريًا ويُفضي إلى خلط
        مفهومي بين attribute وentity.
      step05_citation: "لا مدخل معجمي مباشر بهذا المعنى الفلسفي — مشتق من الجذر ك-و-ن"

  synset_flags:
    definition_review_needed: true


step3_definition:
  definition_review_flag: true
  current_definition: "أي سمة أو صفة تعتبر ذات وجود مستقل"
  assessment:
    decision: revise
    reason: >
      التعريف الحالي ترجمة حرفية من الإنجليزية («any attribute or quality considered as
      having its own existence»). غير أن الصياغة العربية الفلسفية الأصيلة لهذا المفهوم
      تختلف: فكلمة «تعتبر» توحي بالاعتبار الذهني لا بالوجود الفعلي، مما يُثير التباسًا
      فلسفيًا. كذلك يحتاج التعريف إلى مثال يُوضّح المقصود. أدلة المعاجم تُثبت أن
      «الشيء» يُعرَّف في الفلسفة العربية بـ«ما يصح أن يُعلم ويُخبر عنه» وهو تعريف
      أدق وأكثر مطابقة للتراث.
  scope_note: >
    التعريف الكلاسيكي للشيء («ما يصح أن يُعلم ويُخبر عنه» — سيبويه وسواه) أوسع مما في
    AWN لأنه يشمل المعدوم والممتنع في بعض المذاهب الكلامية. تعريف AWN أضيق: يقتصر على
    السمة أو الصفة المعتبرة ذات وجود.
  authored_definitions:
    - type: terminological
      text: >
        سِمةٌ أو صِفةٌ مجرَّدة تُعدُّ قائمةً بذاتها مستقلةً عن الموصوف،
        كالبياض والعدل والعلم.
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
    - type: linguistic
      text: >
        كل معنًى مجرَّد يُتصوَّر ذا وجود قائم بنفسه، من سِمة أو خاصية أو صِفة.
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
