
# مراجعة المجموعة الترادفية awn4-08285242-n
# اللمّة: قطر | المفهوم: القطر الرياضي في المصفوفة (diagonal)
# التاريخ: 2026-03-12

step0_evidence:
  per_lemma:
    - lemma: قطر
      confirm:
        - text: "«قطر المربع والمستطيل والمعين والشبيه بالمعين هو الخط المستقيم الواصل بين الزاويتين المتقابلتين من هذه الأشكال»"
          source: كشّاف اصطلاحات الفنون والعلوم للتهانوي
        - text: "«القُطرُ: خطّ يخرج من طرف زَاوِيَة وَيَنْتَهِي إِلَى أُخْرَى»"
          source: معجم مقاليد العلوم للسيوطي
        - text: "«قطر = diagonal»"
          source: المعجم الموحد لمصطلحات الرياضيات والفلك (1990)
        - text: "«قطر رئيسي = principal diagonal»"
          source: المعجم الموحد لمصطلحات الرياضيات والفلك (1990)
        - text: "«قطر ثانوي = secondary diagonal»"
          source: المعجم الموحد لمصطلحات الرياضيات والفلك (1990)
        - text: "«قُطْر = diagonal؛ خطّ قُطرْي (المرادف العربي)»"
          source: المعجم الموحد لمصطلحات الهندسة المدنية (2012)
        - text: "«قُطري = diagonal»"
          source: المعجم الموحد لمصطلحات الجيولوجيا (2000)
      expands:
        - text: "«قطر الدائرة (فى الهندسة): الخط المستقيم الذى يقسم الدائرة ومحيطها إلى قسمين متساويين مارًّا بمركزها»"
          source: المعجم الوسيط
          addition: "المعنى الكلاسيكي المهيمن هو قطر الدائرة (diameter) لا قطر المصفوفة؛ معنيان رياضيان مختلفان يحملهما اللفظ ذاته بلا تمييز في الرسم بدون الشكل"
        - text: "«الْقُطْرُ بِالضَّمِّ هُوَ الْخط الْمنصف للدائرة وَيُطلق على الْخط الْمَار بمركز الكرة أَيْضا؛ وَالْفرق بَين الْقطر وَالْوتر بِالِاعْتِبَارِ فَإِن الْخط الْمَار بمركز الدائرة مِنْ حَيْثُ مروره إِلَيْهِ سمي بالقطر»"
          source: دستور العلماء للأحمدنكري
          addition: "يُوضّح الفرق بين القطر والوتر من الناحية الهندسية — المعنى هنا diameter لا diagonal matrix"
        - text: "«القُطرُ: النَّاحية والجانب. والجمع الأقْطارُ»"
          source: تاج اللغة وصِحاح العربية للجوهري
          addition: "المعنى الجغرافي (الناحية/الجانب) مستقل تماماً عن دلالة القطر الرياضي — الاستعمال الحديث (قُطْر = بلد) نشأ من هذا المعنى"
      peripheral_observations:
        - "«القِطْر» بالكسر يعني النحاس الذائب أو الحديد الذائب — معنى مستقل تماماً ورد في القرآن الكريم (سورة سبأ: وَأَسَلْنَا لَهُ عَيْنَ الْقِطْرِ)"
        - "«قَطَرَ» فعلٌ يعني سيلان الماء قطرةً قطرةً، ومنه المصدر «القَطْر» (المطر) — مستقل عن القُطْر الرياضي"
        - "اللمّة تحمل أوزاناً ومعانيَ متعددة (قَطْر/قِطْر/قُطْر) تختلف بالشكل فقط — الاستعمال المكتوب بدون تشكيل يُوقع في اللبس؛ السياق الرياضي يرفع اللبس عادةً"

