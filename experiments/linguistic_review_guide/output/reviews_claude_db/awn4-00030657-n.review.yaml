step05_lemma_generation:
  evidence_candidates:
    - lemma: "عَمَل"
      source_section: "step5_english_bridge"
      evidence_citation: "«العمل مثله [مثل الفعل] والصنع أخص منهما» — المفردات في غريب القرآن للراغب الأصفهاني"
      justification: "مرادف مباشر للفعل في المعجمية الكلاسيكية؛ يُقابل المصطلح الإنجليزي «action» مباشرةً عبر جسر ARABTERM (مسرد الفلسفة وعلم النفس: «عمل» ↔ «act»). أفضل من التركيب الوصفي «عمل بشري»"
  knowledge_candidates:
    - lemma: "تَصَرُّف"
      justification: "اشتقاق من ت-ص-ر-ف على وزن تَفَعُّل (آلية: اشتقاق)، يدل على الفعل الإنساني الإرادي القائم على الاختيار؛ مُستعمَل في القانون والفلسفة بمعنى «act/action». ورد في ARABTERM (القانون): «تصرُّف» ↔ «act»"
  generation_notes: "التعريف يدور حول مفهوم الفعل/الحدث الإنساني الإرادي أو المُسبَّب؛ الجذران المحوريان ف-ع-ل وع-م-ل. لا يوجد في المعاجم مدخل مُركَّب ثابت لـ«نشاط إنساني» أو «عمل بشري» كوحدة معجمية مسكوكة."

step1_lemma_validation:
  per_lemma:
    - lemma: "فِعْل"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة وفيرة من المعجمية الكلاسيكية والحديثة — المعنى الأساسي (العمل، حركة الإنسان) متطابق تطابقاً وثيقاً مع تعريف المجموعة"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يدل على الحدث المنفرد الآني الصادر عن فاعل ما؛ يتميز عن «عمل» بالدلالة على الأحداث اللحظية غير المتكررة (حدّ الجويني: «ما كان في زمن يسير بلا تكرير»). التوسّع الفلسفي للراغب (شمول الحيوان والجماد) خارج نطاق المجموعة المقيَّدة بالإنسان. تجدر الإشارة إلى ثقل المعنى النحوي الذي يُهيمن على الاستعمال المعاصر"
      example: "يُحاسَب كل إنسان على ما يصدر عنه من فعل، سواء أقصده أم لم يقصده"

    - lemma: "عَمَل بَشَرِيّ"
      decision: removed
      decision_reason: "تركيب وصفي حر — يفشل اختبار السكّ (يُبدَّل «بشري» بـ«إنساني» دون أي تغيير دلالي) واختبار التثبيت المعجمي (لا يرد كمدخل في أي معجم من المعاجم المُستعلَمة)"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: pass
      nuance_differentiation: "لا يضيف المقيِّد «بشري» فارقاً معجمياً عن «عمل» المفرد؛ وظيفته تصنيفية تشجرية (تمييز عن الحدث الطبيعي غير البشري) لا تمييزية دلالية داخل أبناء المجموعة"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "نَشَاط إِنْسَانِيّ"
      decision: removed
      decision_reason: "تركيب وصفي حر — يفشل اختبار السكّ واختبار التثبيت المعجمي؛ علاوةً على ذلك يحمل «نشاط» دلالة «مجموع الأفعال في مجال معين» وهي أعمّ وأشمل من الفعل الواحد المفرد"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: pass
      nuance_differentiation: "«نشاط» في استعماله المعجمي يدل على منظومة أفعال مستمرة في نطاق محدد (تعريف ARABTERM: «مجموع الأفعال والأعمال التي يُنجزها شخص في مجال معين»)، لا على الفعل المنفرد الآني المقصود هنا"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عَمَل"
      source: step05
      decision: confirmed
      decision_reason: "مرادف كلاسيكي مباشر لـ«فعل» وثَّقه الراغب والمعجمية العربية؛ مصطلح بسيط مفرد أجدى من التركيب الوصفي الحر «عمل بشري» الذي يُحلّ محله"
      step05_citation: "«العمل مثله والصنع أخص منهما» — المفردات في غريب القرآن للراغب الأصفهاني"
      substitution_test:
