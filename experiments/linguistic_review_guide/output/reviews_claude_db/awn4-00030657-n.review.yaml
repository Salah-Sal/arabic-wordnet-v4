        - text: "«فعَلَ الشيءَ: عمِله وصنعه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«فِعْل — [a deed, or an action: or] a motion (حَرَكَةٌ) of a human being»"
          source: "Arabic-English Lexicon by Edward William Lane"
      expands:
        - text: "«الفِعْلُ: التأثيرُ من جهةِ مُؤَثِّرٍ، وَهُوَ عامٌّ لما كَانَ بإيجادِه أَو بغيرِه، ولِما كَانَ من الإنسانِ أَو الحيَوانِ أَو الجَماد، والعمَلُ مِثلُه والصَّنْعُ أخَصُّ مِنْهُمَا»"
          source: "تاج العروس لمرتضى الزبيدي (نقلاً عن الراغب الأصفهاني)"
          addition: "يُوسِّع الراغب مفهوم الفعل ليشمل الحيوان والجماد — أعمّ من التعريف المقيَّد بالإنسان في تعريف المجموعة"
        - text: "«الفعلُ: مَا دلّ على معنى فِي نَفسه مقترنا بِأحد الْأَزْمِنَة الثَّلَاثَة»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "المعنى النحوي (قسم من أقسام الكلام) يوسِّع دلالة المفردة بعيداً عن معنى المجموعة"
        - text: "«آلية في التعلُّم التعزيزي، ينتقل بها الوكيل بين حالات البيئة»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "توسّع حديث في الذكاء الاصطناعي يُطلق «فعل» على الاستجابة الآلية — بعيد عن التعريف الإنساني"
      peripheral_observations:
        - "«الفِعْل» في اصطلاح النحاة هو الكلمة الدالة على حدث وزمن — معنى نحوي مستقل كلياً عن مضمون المجموعة الترادفية الحالية، ويحمله الغالبية العظمى من المداخل"
        - "«الفَعْل» بالفتح: كناية عن حياء الناقة وفرج كل أنثى — معنى حيواني لا صلة له بالمجموعة"

