        - text: "«الفِعْلُ، بالكسر: حَرَكَةُ الإِنسانِ، أو كِنايةٌ عَن كُلِّ عَمَلٍ مُتَعَدٍّ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الفِعْل: كِناية عَن كل عمل متعدٍّ أَو غير متعدٍّ»"
