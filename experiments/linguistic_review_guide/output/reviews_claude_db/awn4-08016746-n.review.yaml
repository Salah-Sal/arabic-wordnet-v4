step0_evidence:
  per_lemma:

    - lemma: "صورة"
      confirm:
        - text: "«صورة» ← image [Mathematics and Astronomy]"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«صورة» ← image"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«صورة» ← image [Educational and Computer Techniques]"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      contradicts:
        - text: "«الصُّورَةُ: الشَّكْلُ التمثالُ الْمُجَسَّمُ الهَيْئَةُ الصِّفَةُ: يقال: صُورَةُ الأمر أو المسألة كذا وكذا»"
          source: "المعجم الكبير"
          conflict: "المعنى الأصيل (الشكل المجسّم والهيئة الحسية) بعيد عن المعنى الرياضي لمجموعة قيم الدالة"
        - text: "«الصُّورَةُ: مَا يكون الشَّيْء بِهِ وَبِغَيْرِهِ مَوْجُوداً»"
          source: "معجم مقاليد العلوم للسيوطي (ت1505)"
          conflict: "تعريف فلسفي-وجودي لا يُحيل إلى مجموعة القيم الرياضية"
        - text: "«الصُّورة: الشكل وكل ما يُصوَّر مُشبَّهاً بخلق الله من ذوات الأرواح وغيرها»"
          source: "التعريفات الفقهية للبركتي (ت1975)"
          conflict: "تعريف فقهي مرتبط بالتصوير الحسي لا بالدلالة الرياضية"
      expands:
        - text: "«صورة الشيء: ماهيته المجردة وخياله في الذهن أو العقل»"
          source: "المعجم الوسيط"
          addition: "يُضيف بُعد التجريد الذهني الذي يتقاطع مع الطابع المجرد لمجموعة القيم الرياضية"
        - text: "«صورة الشيء: ما يؤخذ منه عند حذف المشخصات، ما به يحصل الشيء بالفعل»"
          source: "كتاب التعريفات للشريف الجرجاني (ت1413)"
          addition: "الصورة كنتيجة انتزاعية من الشيء تُوازي صورة الدالة كنتيجة تطبيقها على مجالها"
      peripheral_observations:
        - "«صورة» تحمل في المعاجم الكلاسيكية معانٍ مستقلة متعددة (شكل، هيئة، تمثال، وجه) تختلف كلياً عن المعنى الرياضي؛ الاستعمال الرياضي اقتراض مجازي حديث"
        - "في كشّاف اصطلاحات الفنون للتهانوي: الصورة الفلسفية (ما به يتميز الشيء في الذهن) قريبة من المفهوم الرياضي نظرياً لكنها في سياق مختلف"

    - lemma: "مدى"
      confirm:
        - text: "«المَدَى: الغايَةُ» — «قطعة أرض قدر مدى البصر»"
          source: "تاج اللغة وصِحاح العربية للجوهري (ت1003)"
        - text: "«الْمَدَى: الغَايَةُ» — «الميم والدال والحرف المعتل أصل صحيح يدل على امتداد في شيء وإمداد»"
          source: "مقاييس اللغة لابن فارس (ت1004)"
        - text: "«المسافةُ الغايَةُ»"
          source: "المعجم الوسيط"
        - text: "«مدى» ← range"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«مدى» ← range"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«مدى» ← range [للرادار]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية — طباعة وكهرباء (1996)"
        - text: "«مدى» ← range"
          source: "موسوعة الكهرباء — Electropedia"
      contradicts:
        - text: "«في البرمجة: النطاقُ الذي يمكِن ضمنه الدلالةُ على معرّف هُويّة ما ضمن برنامج» — translation_en: scope"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "المعنى البرمجي للمدى (scope) مختلف كلياً عن range of a function"
      expands:
        - text: "«المَدَى: الفرق بين أعلى قيمة وأقلّ قيمة في التَّوزيع»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (ت2003)"
          addition: "المعنى الإحصائي للمدى (max−min) مختلف عن مدى الدالة كمجموعة قيم — مصدر اشتراك لفظي محتمل"
        - text: "«الفرق بين أعلى وأدنى قيمة من قيم المتغير»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يؤكد الاستعمال الإحصائي بمعنى max−min المميَّز عن range الرياضي"
        - text: "«مجال للحركة أو لمساحة ما» — translation_en: amplitude"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          addition: "يُشير إلى امتداد فضاء ما — مفهوم مجاور يُوسّع الدلالة نحو النطاق"

    - lemma: "مدى الدالة"
      confirm:
        - text: "«مدى الدالّة» ← range of function"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"


