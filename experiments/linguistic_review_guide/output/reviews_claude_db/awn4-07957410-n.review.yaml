step05_lemma_generation:
  evidence_candidates:
    - lemma: "وحدة تصنيفية"
      source_section: "step4_fts_keyword"
      evidence_citation: "«وحدة تصنيفية كبيرة في تقسيم الكائنات الحية تضم مجموعة متقاربة من الأصناف أو الطوائف» — المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      justification: "تركيب إضافي مسكوك في معاجم الأحياء العربية؛ كل مرتبة تصنيفية (فصيلة، شعبة، رتبة...) تُعرَّف بكونها «وحدة تصنيفية»، مما يجعل هذا التركيب المصطلح الأشمل لأي مجموعة أحيائية رسمية"
  knowledge_candidates:
    - lemma: "تجمّع أحيائي"
      justification: "تركيب وصفي (آلية: تركيب) من تجمّع (وزن تَفَعُّل من ج-م-ع، يُفيد اجتماعاً طبيعياً عضوياً أكثر من مجموعة التي تفيد مجرد العدد) + أحيائي (نسبة من أحياء = علم الأحياء). يتميّز عن المجموعة الأحيائية بالإشارة إلى التضافر الطبيعي لا مجرد التصنيف"
  generation_notes: "التعريف يصف مفهوماً فوقياً واسعاً يعلو كل المراتب التصنيفية الأحيائية؛ المعاجم العربية المتخصصة تتناول المراتب الفرعية منفردةً (فصيلة، شعبة، رتبة، طائفة، جنس، نوع) دون أن تُفرد مصطلحاً موحّداً للمفهوم الأعمّ «المجموعة الأحيائية»، مما يشير إلى فجوة معجمية جزئية على مستوى المصطلح الفوقي"

step1_lemma_validation:
  per_lemma:
    - lemma: "مَجْمُوعَة أَحْيَائِيَّة"
      decision: confirmed
      decision_reason: "تعبير مركب اصطلاحي وصفي (اسم + نعت) مستقر في الأدب الأحيائي والتعليمي العربي رغم غيابه في المعاجم المُستعلَمة؛ مكوّناه من جذور عربية خالصة (ج-م-ع وح-ي-ي)؛ اقتراض مفهومي مقبول من نمط «biological group» بآلية تركيب وصفي عربي؛ اختبار السكّ: «أحيائية» (من أحياء = علم الأحياء) تختلف دلالياً عن «حيوية» (من حيوي = متعلق بالحياة بمعناها العام)، مما يعطيها قدراً من التثبيت الاصطلاحي"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُخصَّص المجموعةُ المفهومَ الفوقيَّ (تجمّع / مجموعة من المشتمِل awn4-00031563-n) بقيد الأحيائية، أي حصرِها في كائنات حية (نباتات وحيوانات)، في مقابل التجمّعات غير الأحيائية (مجموعات أعداد، أشياء، أفكار)؛ تختلف كذلك عن المصطلحات التصنيفية الفرعية (فصيلة، شعبة، رتبة...) بكونها مفهوماً فوقياً يشمل كل تلك المراتب"
      example: "تُصنَّف الطيور والزواحف والثدييات والبرمائيات مجموعاتٍ أحيائيةً متمايزة تندرج جميعها تحت مملكة الحيوان في نظام التصنيف الأحيائي الحديث."

    - lemma: "وحدة تصنيفية"
      source: step05
      decision: removed
      decision_reason: "مفهوم أضيق من المجموعة الأحيائية؛ يقتصر على المراتب التصنيفية الرسمية (النوع، الجنس، الفصيلة...) ولا يشمل التجمّعات البيولوجية غير التصنيفية كالتجمعات البيئية أو مجموعات المسح الميداني؛ فضلاً عن أن «وحدة» تفيد الفردية لا الجماعة، مما يُبعده عن دلالة «مجموعة»"
      step05_citation: "«وحدة تصنيفية كبيرة في تقسيم الكائنات الحية تضم مجموعة متقاربة من الأصناف أو الطوائف» — المعجم الموحد لمصطلحات الجيولوجيا (2000)"

    - lemma: "تجمّع أحيائي"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبار السكّ: «أحيائي» قابل للاستبدال بـ«حيوي» أو «بيولوجي» دون تغيير جوهري في المعنى الوصفي؛ لا تثبيت معجمي له في المصادر المُستعلَمة؛ يُعدّ إعادة صياغة وصفية حرة للمفهوم ذاته لا مصطلحاً مسكوكاً مستقلاً"
      step05_citation: "لا دليل معجمي مباشر — مرشح من المعرفة اللغوية الداخلية"

