  generation_notes: "الجذران المركزيان في حقل المفهوم هما ب-ش-ر وأ-ن-س. الإنسانية هي الأجدر باعتبارها مصطلحاً وظيفياً ثابتاً في اللغة المعاصرة والمنظمات الدولية، والبشر هو الأصل اللغوي القرآني الراسخ"

