      justification: "الصَّنج آلة نقر معدنية (صفائح تُضرب بعضها ببعض) تُصدر صوتاً رنيناً معدنياً واضحاً — ورد ذكره في المورد الحديث شاهداً على «الشيء المُجلجل المُصلصِل»؛ لفظ تراثي مستعمل في الشعر والفقه المالكي؛ آلية التوليد: إحياء لفظ تراثي من الممات المعجمي"
  generation_notes: "التعريف يدل على فئة عامة من الأجسام المُصوِّتة بالرنين المعدني؛ المرشح الأقوى من الأدلة هو جُلجُل لشمول مداخله المعجمية معنيَيْن (الجرس الصغير + عضو الرنين في ذيل الحيّة)، كلاهما «شيء يصدر صوتاً»"

