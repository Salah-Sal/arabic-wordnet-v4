step0_evidence:
  per_lemma:
    - lemma: "جزء"
      confirm:
        - text: "«الجُزْءُ: البَعْضُ»"
          source: "المعجم الكبير"
        - text: "«القطعةُ من الشىء, وما يتركب الشىء منه ومن غيره، النَّصيب»"
          source: "المعجم الوسيط"
        - text: "«الجزء بعض من كل يشابهه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«جزء الشيء من يتقوم به جملته كأجزاء السفينة والبيت وأجزاء الجملة من الحساب»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«الجُزْءُ: ما يتركب منه شيء وأيضاً بعض الشيء»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«جزء — translation_en: part / component; part; piece / pars; fraction»"
          source: "معاجم ARABTERM (رياضيات وفلك، هندسة المياه، تشريح عياني)"
      expands:
        - text: "«ما يَكفي من مال أو طعام ونحوهما»"
          source: "المعجم الكبير"
          addition: "دلالة الاكتفاء والكفاية — بُعد دلالي غير موجود في تعريف المجموعة"
        - text: "«الجزء بالفتح هو حذف جزئين من الشطرين، كحذف العروض والضرب ويسمى مجزوءاً»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "الجزء اصطلاح عروضي — حذف ركن من وزن الشعر، بُعد مستقل تماماً"
      peripheral_observations:
        - "الجزء الذي لا يتجزأ: مفهوم فلسفي كلامي (الجوهر الفرد) — مستقل عن سياق المجموعة"

    - lemma: "شِق"
      confirm:
        - text: "«شِقُّ الشيء: جزؤه ونصفه، جانبه»"
          source: "المعجم الوسيط"
        - text: "«من كلِّ شيء: نِصْفُه أو الجُزْءُ منه، ناحيتُه وجانبُهُ»"
          source: "المعجم الكبير"
        - text: "«(الشق) شقّ الشَّيء: جزؤه ونصفه وجانبه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«(الشق) المشقة والصدع والخرق»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المشقة والصدع والخرق دلالات تتعلق بالجهد والتمزق، لا بجزء من مصنوع بشري"
        - text: "«الشق: تصيير الشيء في شقين أي ناحيتين متقابلتين»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "يدل على عملية الانشطار لجانبين متقابلين لا على الجزء المستقل من مصنوع"
        - text: "«الشّق بالفتح عند الأطباء هو تفرّق اتصال في طول العصب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "استعمال طبي للتمزق في نسيج حي — بعيد عن سياق المصنوع البشري"
      peripheral_observations:
        - "الشِّقُّ: جنس من أجناس الجن في زعمهم (المعجم الكبير) — معنى أسطوري مستقل"
        - "الشِّقُّ الخيشومي والشِّقُّ القيصري: مصطلحان طبيان لا علاقة لهما بالمجموعة"

    - lemma: "قِسم"
      confirm:
        - text: "«القِسْمُ: النصيبُ والحظُّ»"
          source: "المعجم الوسيط"
        - text: "«النَّصِيب والحظ (ج) أَقسَام»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«بالكسر النَّصِيب أَو الْجُزْء من الشَّيْء الْمَقْسُوم»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«قِسْم [ج:أَقْسام] — translation_en: portion»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«القَسَمُ: اليمينُ»"
          source: "المعجم الوسيط"
          conflict: "القَسَم (بفتحتين) = اليمين بالله — معنى مستقل لا صلة له بالجزء من المصنوع"
        - text: "«القَسْم: شرعاً تسوية الزوج بين الزوجات في المأكول والمشروب والملبوس والبيتوتة»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "القَسْم الشرعي عملية تسوية بين زوجات — لا علاقة له بجزء مصنوع بشري"
      expands:
        - text: "«القسم: قسمة المال بين الشركاء وتعيين أنصبائهم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "القسم عملية التوزيع والتقسيم لا الناتج المادي منه؛ ويشمل توزيع ما لا يُعدّ مصنوعاً بشرياً"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مكوِّن"
      source_section: step5_english_bridge
      evidence_citation: "«قطعة أو جزء من جهاز معلومياتي مثل اللوحة الأم أو الذاكرة أو بطاقة الصوت أو القرص الصلب وغير ذلك» [translation_en: component] — المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      justification: "مصطلح مسكوك في معاجم تقنية متعددة (هندسة مدنية، كيمياء، لسانيات، طب بيطري، صيدلة) يدل على الجزء البنيوي من المصنوع البشري — آلية الاشتقاق: اسم فاعل من الجذر ك-و-ن على وزن مُفَعِّل"
  knowledge_candidates:
    - lemma: "شَطْر"
      justification: "مصطلح تراثي يدل على النصف أو الجزء (شَطْرُ الشيء: نصفه وجزؤه) — آلية: إحياء لفظ كلاسيكي بمجاز (إزاحة من الانقسام إلى الجزئية) لتجنّب الاشتراك"
    - lemma: "قطعة"
      justification: "مصطلح شائع في السياق التقني والعلمي يدل على الجزء المنفصل من الكل (piece/segment) — آلية: اشتقاق من ج-ز-أ ... لا: من ق-ط-ع؛ شائع في 'قطعة غيار' و'قطعة من الجهاز'"
  generation_notes: "المفهوم 'جزء من مصنوع بشري' تغطيه جزء بصورة أولية؛ المرشحات الأخرى إما أخص وظيفياً (مكوِّن = component) أو أعم نطاقاً (قطعة) أو مقيّد بالنصفية (شطر)"

step1_lemma_validation:
  per_lemma:
    - lemma: "جزء"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من معاجم متعددة بلا تناقض؛ الأكثر شيوعاً واطّراداً في الاستعمال التقني والعلمي"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "الأعم في المجموعة — يدل على البعض من الكل دون اشتراط النصفية أو عملية التقسيم؛ يشمل الأجزاء المادية والعقلية والطبيعية والمصنوعة على حدٍّ سواء"
      example: "تمّ استبدال جزء المحرك التالف بآخر أصلي من المصنع ذاته."

    - lemma: "شِق"
      decision: escalated
      decision_reason: "الأدلة متضاربة — الدلالة الأصيلة تتمحور حول الانشطار والمشقة لا حول جزء مصنوع؛ الاستعمال الشائع في سياق التقسيم المكاني (شق الطريق، الشق الأيمن) لا في وصف أجزاء المصنوعات التقنية"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يتميز عن جزء بإيحائه بالنصفية والجانب (side/half) لا الجزء العام؛ يوحي بالانشطار والانقسام أكثر من الانتماء البنيوي"

    - lemma: "قِسم"
      decision: confirmed
      decision_reason: "أدلة مؤكدة (النصيب والجزء من الشيء المقسوم) مع فارق دلالي واضح؛ شائع في الفصحى المعاصرة للأقسام الإدارية والعلمية من المنشآت والمصنوعات"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يتميز عن جزء بارتباطه الدلالي بعملية التقسيم — يوحي بأن الجزء نتج عن توزيع أو تخصيص مسبق (portion المخصّص)؛ يستعمل للأقسام الوظيفية أو الهيكلية المحددة من المصنوع"
      example: "خُصِّص القِسم الخلفي من المركبة الفضائية لإيواء معدات الهبوط الآلي."

    - lemma: "مكوِّن"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مسكوك في معاجم تقنية متعددة؛ يجتاز اختبار السكّ واختبار التثبيت المعجمي؛ يضيف دلالة بنيوية وظيفية لا تغطيها جزء وقِسم"
      step05_citation: "«قطعة أو جزء من جهاز معلومياتي مثل اللوحة الأم أو الذاكرة...» [translation_en: component] — المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      substitution_test:
        result: pass
      nuance_differentiation: "يتميز عن جزء وقِسم بأنه يدل على الجزء الذي يُشكِّل ويبني الكل (constituent/component) — يشترط أن يكون الجزء وظيفياً بنيوياً مُساهماً في تكوين الكل، لا مجرد بعض منفصل"
      example: "يتألف هذا الجهاز من ثلاثة مكوِّنات رئيسية: وحدة المعالجة، والذاكرة، وبطاقة الشبكة."
      actions:
        - command: create_entry
          params:
            lemma: "مكوِّن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03898588-n"

    - lemma: "قطعة"
      source: step05
      decision: removed
      decision_reason: "أعم مما تقتضيه المجموعة — تشمل قطعة الأرض والقطعة الموسيقية وقطعة السماء وليس المصنوعات البشرية حصراً؛ فضلاً عن أن 'قطعة' لا تُنشئ أسرة اشتقاقية متمايزة عن جزء في هذا السياق"
      step05_citation: "«قِطْعَة — translation_en: piece» — المعجم الطبي الموحد (2009)"
      substitution_test:
        result: fail

    - lemma: "شَطْر"
      source: step05
      decision: removed
      decision_reason: "يدل على النصف تحديداً (شَطْرُ الشيء: نصفه)، وهو أضيق مما تقتضيه المجموعة التي تعني 'أقل من الكل' بشكل عام لا بالضرورة النصف"
      step05_citation: "معرفة لغوية — لا دليل مباشر من الجسر الإنجليزي"
      substitution_test:
        result: fail

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "مكوِّن"
      reason: "مصدر: الخطوة ٠٫٥ — مصطلح تقني مسكوك يضيف الدلالة البنيوية الوظيفية (component/constituent) غير الممثَّلة في اللمّات الأصلية"
      via_command: create_entry + add_sense

