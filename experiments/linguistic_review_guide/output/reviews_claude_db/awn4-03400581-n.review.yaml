step0_evidence:
  per_lemma:

    - lemma: "مُلَطِّف"
      confirm:
        - text: "«مُلَطِّف: من (ل ط ف) جاعل الشيء رقيقا»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«مُلَطِّف: شخصٌ يراقبُ ويغربلُ الرسائلَ قبل توزيعها على أعضاء المجموعة الأخبارية أو البريد»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "هذا معنى «moderator» المعلوماتي — مختلف تماماً عن الإنعاش والتلطيف؛ تعدد دلالي لا صلة له بتعريف المجموعة"
      expands:
        - text: "«الملطّف: دواء يجعل قوام المادة أرقّ لما فيه من الحرارة المعتدلة كالزوفى، ويقابله المغلّظ» — [Palliative, sedative]"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة طبية كلاسيكية متخصصة في ترقيق القوام — أخص من التلطيف العام في تعريف المجموعة"
        - text: "«ملطف: دواء يخفف أعراض المرض أو يزيله تماما» — [palliative]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "دلالة صيدلانية (تسكين الأعراض) — توسيع طبي خارج نطاق freshener اليومي"
        - text: "«ملطف: صفة لما يذهب التهيج أو الالتهاب من الأنسجة المسحوجة؛ دهان يذهب التهيج» — [demulcent]"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "دلالة demulcent الطبية — تخص تلطيف الأنسجة لا الهواء أو البيئة"

    - lemma: "مُنعِش"
      confirm:
        - text: "«المُنْعِش: «أ» شرابٌ منعِش»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مُنْعِش: دواء ينبه الجملة العصبية المركزية، وخاصة المراكز القلبية الوعائية والتنفسية» — [analeptic]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "دلالة طبية متخصصة (منبّه الجهاز العصبي) — أخص من الإنعاش العام"
        - text: "«المُنْعِش: مُذكِّر؛ برنامج [أو موضوع دراسة] لتطرية الذاكرة» — [refresher]"
          source: "المورد الحديث (2008)"
          addition: "دلالة مجازية في سياق التعليم والقانون (refresher course) — توسيع دلالي بعيد عن المعنى المادي لـ freshener"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُرَوِّح"
      source_section: "step4_fts_keyword"
      evidence_citation: "«مُرَوِّح: المُطيِّب بالمسك ونحوه، والمسري عن النفس، والمصلي صلاة التراويح» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "اسم فاعل من روَّح يدل على التطييب وترويح النفس — مقابل كلاسيكي لمزدوج التلطيف/الإنعاش في تعريف المجموعة"
  knowledge_candidates:
    - lemma: "مُعَطِّر"
      justification: "اشتقاق (مُفَعِّل) من ج-ذ-ر ع-ط-ر: جاعل الشيء عطِراً طيّب الرائحة — يُستعمل على نطاق واسع في الفصحى المعاصرة: «معطر الهواء» (air freshener)، «معطر الثياب»؛ أدق وأشيع مقابل لـ freshener التجاري من اللمّتَيْن الأصليتَيْن"
    - lemma: "مُطَيِّب"
      justification: "اشتقاق (مُفَعِّل) من ط-ي-ب: جاعل الشيء طيّباً — يُستعمل في الفصحى بمعنى تطييب المكان والهواء، وله دلالة قريبة من freshener في البُعد الرائحي"
  generation_notes: "التعريف (أي شيء يقوم بالإنعاش أو التلطيف) يشير إلى إضفاء النضارة وطيب الرائحة على البيئة — الجذور الأكثر صلةً: ع-ط-ر (عِطر)، ر-و-ح (روح/راحة)، ط-ي-ب (طيب). لم يَرِد في قاعدة البيانات مقابل مباشر لـ freshener بالمعنى التجاري الحديث"

step1_lemma_validation:
  per_lemma:

    - lemma: "مُلَطِّف"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة كلاسيكية (جاعل الشيء رقيقاً) تدعم دلالة التلطيف المتوافقة مع تعريف المجموعة — التناقض في معجم المعلوماتية (moderator) تعدد دلالي معزول لا يمس المعنى الأصلي"
      evidence_assessment:
        case: mixed
        notes:
          - "التناقض محصور في المعنى المعلوماتي (moderator) — سياق مستقل تماماً لا يلغي الاستعمال اللغوي الأصلي"
      substitution_test:
        result: pass
      nuance_differentiation: "يُركّز على التخفيف المادي وإزالة الحدة (جعل الشيء رقيقاً أو لطيفاً)، بينما مُنعِش يُبرز استعادة الحيوية والنشاط — مُلَطِّف أقرب لـ softener/mitigator أما مُنعِش فأقرب لـ reviver/stimulant"
      example: "وضعت مُلَطِّف الهواء على الرف لإزالة الروائح الكريهة من الغرفة."
      actions: []

    - lemma: "مُنعِش"
      decision: confirmed
      decision_reason: "المورد الحديث يُثبت الاستعمال المعاصر (شراب منعش / refresher) المتوافق مع تعريف المجموعة — المعنى الطبي (analeptic) توسيع لا ينقض المعنى العام"
      evidence_assessment:
        case: mixed
        notes:
          - "المعنى الطبي (منبّه الجهاز العصبي) وسياق refresher course — كلاهما توسيع دلالي لا تعارض"
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز استعادة الحيوية والانتعاش الحسّي أو المعنوي (revival/refreshment)، بينما مُلَطِّف يُركّز على التخفيف والإزالة — مُنعِش أكثر حضوراً في السياقات الحسّية (شراب، نسيم، أثر جمالي)"
      example: "شرب كوباً من العصير المُنعِش بعد يوم عمل شاقٍّ فعادت إليه طاقته."
      actions: []

    - lemma: "مُرَوِّح"
      source: step05
      decision: removed
      decision_reason: "لفظ كلاسيكي نادر الاستعمال المعاصر — لا يُستعمل وحده مصطلحاً لـ freshener في الفصحى التقنية الحديثة؛ مُعَطِّر أكثر دقةً وشيوعاً وتحديداً لهذا المفهوم"
      step05_citation: "«مُرَوِّح: المُطيِّب بالمسك ونحوه، والمسري عن النفس» — موسوعة السلطان قابوس لأسماء العرب"

    - lemma: "مُعَطِّر"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح اشتقاقي مستقر من ع-ط-ر (مُفَعِّل)، شائع في الاستعمال الفصيح المعاصر — «معطر الهواء» هو الترجمة المعتمدة لـ air freshener في المعاجم التجارية والإعلانات العربية؛ يسدّ فجوة دلالية حقيقية في المجموعة"
      step05_citation: "«معطر الهواء» — مصطلح متداول في الاستعمال التخصصي والتجاري المعاصر؛ مشتق من ع-ط-ر بآلية اشتقاق (مُفَعِّل)"
      substitution_test:
        result: pass
      nuance_differentiation: "يُركّز على البُعد الرائحي (إضفاء العِطر وطيب الرائحة) — أخص من مُلَطِّف (تليين/تخفيف) ومن مُنعِش (استعادة الحيوية) في السياق التجاري للمعطّرات"
      example: "رشَّ مُعَطِّر الهواء في أرجاء الغرفة فعمَّها عبق الياسمين."
      actions:
        - command: create_entry
          params:
            lemma: "مُعَطِّر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03400581-n"

    - lemma: "مُطَيِّب"
      source: step05
      decision: removed
      decision_reason: "مُعَطِّر أشيع وأخص — مُطَيِّب أعمّ دلالةً (يشمل التحسين والإصلاح والتطيّب) وقد يُخلط بمعنى «المُحسِّن» في سياقات غير رائحية؛ يُضيف ازدحاماً دلالياً لا حاجة إليه مع وجود مُعَطِّر"
      step05_citation: "معرفة لغوية — اشتقاق من ط-ي-ب"

  added_lemmas:
    - lemma: "مُعَطِّر"
      reason: "مصدر: الخطوة ٠٫٥ — اشتقاق من ع-ط-ر، الأكثر تمثيلاً للمفهوم التجاري الحديث لـ freshener في الفصحى المعاصرة"
      via_command: create_entry + add_sense

