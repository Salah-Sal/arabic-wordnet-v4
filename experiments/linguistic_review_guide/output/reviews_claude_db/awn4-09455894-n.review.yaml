# مراجعة المجموعة الترادفية awn4-09455894-n
# shiner — شيء يلمع (بضوء منبعث أو منعكس)
# تاريخ المراجعة: 2026-03-12

step0_evidence:
  per_lemma:
    - lemma: "جسم لامع"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "«سطح مستو صغير محدد بأضلع، يكون مع أسطح صغيرة مشابهة مجاورة سطح جسم لامع براق (مجوهرات مثلا)» — مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (تعريف مدخل وجه/facet) — ورود وصفي للمركب داخل تعريف مدخل آخر، لا كمصطلح مستقل برأسه"
        - "«(2) شيء برّاق [كنجم أو ماسةٍ أو قطعة نقدية]» — المورد الحديث (2008)، ضمن تعريف shiner — يؤكد معنى المجموعة لكنه يستخدم مركباً مغايراً (شيء برّاق لا جسم لامع) ولا يُثبّت اللمّة ذاتها كوحدة معجمية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "شيء برّاق"
      source_section: step5_english_bridge
      evidence_citation: "«(1) شخصٌ لامع (2) شيء برّاق [كنجم أو ماسةٍ أو قطعة نقدية] (3) سمكة فضيّة (4) كَدْمة حول العين [من أثرِ لَكْمةٍ]» — المورد الحديث (2008)"
      justification: "المعنى الثاني في ترجمة «shiner» يُطابق تعريف المجموعة مباشرةً؛ مركب وصفي (اسم نكرة + نعت) موازٍ هيكلياً للمّة الراهنة، مع تفضيل «شيء» على «جسم» و«برّاق» على «لامع» في قاموس المورد"
  knowledge_candidates:
    - lemma: "بَرَّاق"
      justification: "اشتقاق — صيغة فَعَّال من الجذر ب-ر-ق تفيد المبالغة في البريق والوميض؛ تُستعمل أحياناً استعمالاً شبه اسمي في سياقات كـ«البرّاق من الأحجار»؛ يُعاب عليها أن الوزن فَعَّال يُفيد الوصف بالدرجة الأولى (صفة مشبهة) لا تسمية الكيان المستقل"
  generation_notes: "المفهوم فوق-معجمي (super-lexical) — يمثّل عقدة تصنيفية في وردنيت فوق المفردات المعجمية الفعلية (كالماسة والنجم والجوهرة). العربية لا تُفرد لهذه الفئة العامة اسمًا ذاتًا واحدًا مسكوكًا يُقابل «shiner» بوصفه مقولة جامعة. الحالة ترشّح إلى فجوة معجمية."

step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية — محذوفة (مركب وصفي حر) ──
    - lemma: "جسم لامع"
      decision: removed
      decision_reason: "مركب وصفي حر (جنس + نعت) يفشل اختبار السكّ المصطلحي — إبدال «جسم» بـ«شيء» أو «لامع» بـ«مضيء» أو «برّاق» لا يُخلّ بالمعنى الوصفي المقصود؛ وغير مُسجَّل كوحدة معجمية ثابتة في أي معجم بهذا المعنى كمصطلح مستقل"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        compound_type: "وصفي"
        accepted: false
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "يُعدّ النجمُ جسماً لامعاً"
            substituted: "يُعدّ النجمُ شيئاً مضيئاً"
            preserved_meaning: true
          - original: "الماسةُ جسمٌ لامع يعكس الضوء"
            substituted: "الماسةُ شيءٌ برّاق يعكس الضوء"
            preserved_meaning: true
      nuance_differentiation: "اللمّة الوحيدة في المجموعة — لا مقارنة ترادفية داخلية ممكنة؛ حذفها يُفضي إلى انعدام التمثيل العربي للمجموعة (فجوة معجمية)؛ المركب وصفي محايد يجمع الجنس القريب (جسم) بالخاصية الفارقة (لامع) دون أن يُشكّل وحدة مسكوكة"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض (مركب وصفي حر) ──
    - lemma: "شيء برّاق"
      source: step05
      decision: removed
      decision_reason: "مركب وصفي حر مماثل في هيكله وإشكالياته لـ«جسم لامع» المحذوفة — يفشل اختبار السكّ (إبدال «شيء» بـ«جسم» أو «برّاق» بـ«لامع» يُبقي الوصف سليماً) واختبار التثبيت المعجمي (لا يرد كمصطلح مستقل في أي معجم)"
      step05_citation: "«(2) شيء برّاق [كنجم أو ماسةٍ أو قطعة نقدية]» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        compound_type: "وصفي"
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "موازٍ للمّة الأصلية في البنية والإشكالية — استبدال «جسم» بـ«شيء» و«لامع» بـ«برّاق» لا يُنشئ وحدة معجمية ثابتة جديدة؛ «برّاق» يُضيف ظلالة الوميض السريع (من البرق) بدلاً من اللمعان الثابت"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض (صفة مشبهة لا اسم كيان) ──
    - lemma: "بَرَّاق"
      source: step05
      decision: removed
      decision_reason: "صفة مشبهة (وزن فَعَّال) لا اسم كيان — الوزن يُفيد المبالغة في الوصف لا تسمية الفئة الاسمية؛ تعارض مع المقتضى الاسمي للمجموعة (pos: n)؛ لا ترد في المعاجم كاسم ذات مستقل بمعنى «شيء يلمع»"
      step05_citation: "«براق، لامع» — المعجم الموحد لمصطلحات الكيمياء (1992) — مقابل صفة لـ«lustrous (glassy)» لا اسم كيان"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "هذا جسمٌ لامع"
            substituted: "هذا بَرَّاق"
            preserved_meaning: false
            why_failed: "«برّاق» يُفهم في هذا السياق خبراً وصفياً (= هو برّاق) لا اسم كيان موضوعي؛ كما يُحيل إلى شدة البريق الوامض/اللحظي (من البرق) لا إلى الإضاءة الثابتة"
      nuance_differentiation: "يُركّز على خاصية التألق الشديد والوميض السريع (ب-ر-ق، كالبرق) بدلاً من اللمعان الاعتيادي — أنسب كصفة توصيفية لأشياء بعينها (سيف برّاق، عينان برّاقتان) لا كاسم فئة جامعة"

  synset_flags:
    definition_review_needed: true

