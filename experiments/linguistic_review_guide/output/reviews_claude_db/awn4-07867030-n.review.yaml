step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية — مؤكَّدة ──
    - lemma: "قُشارة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من معجمَين معتمدَين (الوسيط + تقانات الأغذية)؛ الترجمة المباشرة parings مطابقة تماماً؛ التناقض المبدئي (مدخل 476796) عائد إلى قَشَّارة (كلمة مختلفة بشدة على الشين) لا إلى قُشارة — أثر تسوية لا تعارض دلالي"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "قُشارة = ما ينفصل ويُنزع خصيصاً في عملية التقشير (مفهوم العملية-النتيجة)؛ الوزن الصرفي فُعالة يفيد «بقايا الفعل وإفرازاته» تحديداً كما في نُحاتة (من نحت) وبُرادة (من برد)؛ تختلف عن قِشْر/قشرة التي تصف الغلاف النباتي قبل نزعه، وعن قُشور التي تشمل الغلاف سواء نُزع أم لا"
      example: "جمعت الطاهية قُشارةَ الجزر والبطاطا في وعاء مخصص وأضافتها إلى سماد الكمبوست."

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "بُشارة"
      source: step05
      decision: removed
      decision_reason: "تضارب لفظي حاد مع «بِشارة/بُشارة» (الخبر السار) وهي الأعلى تداولاً في اللغة؛ يفشل اختبار يُسر التداول في بوابة جودة المصطلح — سيُحدث التباساً مبرماً في النص المجرد من الشكل؛ الحمل الدلالي الخاطئ يطغى على الكسب المصطلحي"
      step05_citation: "«القشور أو البُشارة المنزوعة من الثمار.» — المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      substitution_test:
        result: fail
      nuance_differentiation: "غير قابلة للتمييز من بِشارة (good news) في النص المكتوب بلا شكل؛ التضارب الاشتراكي يفوق المكسب الدلالي"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "قُلامة"
      source: step05
      decision: removed
      decision_reason: "الحقل الدلالي الأصيل لقُلامة هو ما يُقلم من الأظافر والأقلام؛ توزيع المورد الحديث يشير إلى: قُشارة = potato parings و قُلامة = nail parings — فالكلمتان مقسّمتان بين مجالين منفصلين لا متبادلتان؛ استعمالها في مجال الثمار/الخضروات غير موثق"
      step05_citation: "«(2) قُشارة؛ قُلامة potato paring s; nail paring s.» — المورد الحديث (2008)"
      substitution_test:
        result: fail
      nuance_differentiation: "قُلامة مخصصة لما يُقلم من الأظافر والأقلام؛ قُشارة مخصصة لما يُقشر من الثمار والخضروات — تقسيم دلالي واضح في المعجمية العربية"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "قُشور"
      source: step05
      decision: removed
      decision_reason: "قُشور (جمع قِشر) تصف الغلاف النباتي في ذاته بمعزل عن نزعه؛ المجموعة الترادفية تخص ما نُزع فعلاً بالتقشير (نتيجة الفعل كمادة منفصلة)؛ قُشور أعم دلالةً من مقصود المجموعة وقد تشمل القشر غير المنزوع"
      step05_citation: "وارد في الاستعمال اليومي — قُشور الموز، قُشور البرتقال"
      substitution_test:
        result: fail
      nuance_differentiation: "قُشور = الغلاف النباتي عموماً (هوية مادية)؛ قُشارة = ما انفصل تحديداً في عملية التقشير (هوية عملية-نتيجة)"

  synset_flags:
    definition_review_needed: true


