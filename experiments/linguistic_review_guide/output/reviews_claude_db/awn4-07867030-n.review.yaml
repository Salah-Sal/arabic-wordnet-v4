step05_lemma_generation:

  evidence_candidates:

    - lemma: "بُشارة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«القشور أو البُشارة المنزوعة من الثمار.» — المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      justification: "اشتقاق (فُعالة من بَشَرَ = أزال الطبقة الخارجية الرقيقة)؛ استُعمل في المعجم التقني المتخصص مقابلاً مباشراً للقشر المنزوع من الثمار"

    - lemma: "قُلامة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(2) قُشارة؛ قُلامة potato paring s; nail paring s.» — المورد الحديث (2008)"
      justification: "اشتقاق (فُعالة من قَلَمَ = قصّ وأزال الطرف)؛ وردت في المورد الحديث ضمن مداخل paring مع إيحاء بالتوزيع الدلالي"

  knowledge_candidates:

    - lemma: "قُشور"
      justification: "اشتقاق — جمع قِشر من الجذر ق-ش-ر؛ المصطلح الأكثر شيوعاً في الاستعمال العربي اليومي للدلالة على ما يُزال من قشر الفاكهة والخضروات (قُشور البرتقال، قُشور البطاطا) — الجمع أنسب لأن المفهوم يُستعمل غالباً جمعاً"

  generation_notes: "نمط الفُعالة هو الوزن الصرفي الأكثر إنتاجية في العربية للدلالة على بقايا فعل وإفرازاته (نُحاتة، بُرادة، قُصارة، قُشارة)؛ المفهوم المطلوب هو نتيجة عملية التقشير كمادة منفصلة"


