step0_evidence:
  per_lemma:

    - lemma: "قُشارة"

      confirm:
        - text: "«(القشارة) مَا يتساقط من القشر عِنْد القشر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
        - text: "«القشور أو البُشارة المنزوعة من الثمار.» [ت.إنجليزية: parings]"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"

      contradicts:
        - text: "«اللحاء» [ت.إنجليزية: barker]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية — بناء وتجارة (1999)"
          conflict: "المدخل هو «قَشَّارة» (بشدة على الشين) = أداة تقشير اللحاء أو من يقشّره، لا «قُشارة» (ما يُقشر)؛ اشتراك في الصورة المسوّاة فحسب — تضارب شكلي لا دلالي"

      expands:
        - text: "«بالضم، والتخفيف، وهو ما يقشّر عن شجرة من شيء رقيق»"
          source: "معجم البلدان لياقوت الحموي (ت. 1229م)"
          addition: "يوسّع النطاق إلى الأشجار عموماً، لا الثمار والخضروات فقط؛ يمثّل أقدم توثيق كلاسيكي يُظهر أن الدلالة الأصلية أعمّ من حدود تعريف المجموعة الحالي"

      peripheral_observations:
        - "معجم البلدان: «قُشَارَةُ» اسم موضع (ماء لأبي بكر بن كلاب في بلاد العرب) — معنى علمي جغرافي مستقل تماماً عن الدلالة المعجمية"


