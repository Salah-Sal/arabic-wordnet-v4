step05_lemma_generation:
  evidence_candidates:
    - lemma: "جوهر"
      source_section: "step5_english_bridge"
      evidence_citation: "«جوهر — substance» — المعجم الموحد لمصطلحات التقنيات التربوية (1999)؛ وكذلك: «يكون الجوهر دومًا واقعًا بالنسبة للمتغيرات. وهو ما يدل بذاته، دون حاجة إلى غيره في وجوده» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "اسم مفرد يُستعمل مقابلاً لـ substance في المعاجم التخصصية العربية الحديثة؛ يحمل دلالة الشيء القائم بذاته ذي الطبيعة الثابتة وهو ما يقترب من مفهوم نوع المادة ذي الخصائص الثابتة"
    - lemma: "مادة متجانسة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«متجانس؛ متماثل: من جنس واحد أو طبيعة واحدة أو تكوين واحد» — المورد الحديث (2008)؛ مع توثيق «متجانس» بمعنى homogeneous في معاجم الفيزياء والكيمياء والجيولوجيا والأحياء"
      justification: "تركيب وصفي (مادة + متجانسة) مستند إلى مقابلات عربية راسخة في المعاجم التخصصية؛ «من جنس واحد أو تكوين واحد» في تعريف المورد الحديث يعكس مباشرةً مفهوم الخصائص الموحّدة الوارد في التعريف"
  knowledge_candidates:
    - lemma: "مادة نقية"
      justification: "آلية التوليد: تركيب وصفي — «نقي» يدل على التجانس الكيميائي وثبات التركيب في جميع الأجزاء؛ مصطلح مستعمل في الكيمياء العربية للإشارة إلى المواد ذات الخصائص الثابتة كالعناصر والمركبات الكيميائية، وهو ما يتقاطع مع مفهوم المادة ذات الخصائص الموحدة"
  generation_notes: "التعريف يشير إلى مفهوم علمي فيزيائي/كيميائي لا إلى المفهوم الفلسفي للجوهر؛ المحور الدلالي هو توحّد الخصائص لا مجرد وجود المادة بذاتها"


step1_lemma_validation:
  per_lemma:

    # ── اللمّة الأصلية — مؤكَّدة ──
    - lemma: "مَادَّة مُتَجَانِسَة"
      decision: confirmed
      decision_reason: >
        مركب وصفي عربي فصيح (موصوف + صفة = نوع وصفي منتج) يؤدي المعنى العلمي بدقة —
        لا اقتراض لفظي: مكوّناه عربيان أصيلان (م-د-د وج-ن-س). لا ترجمة حرفية عمياء:
        «homogeneous substance» → «مادة متجانسة» تتّفق مع المدلول العلمي للمفهوم.
        اقتراض مفهومي (calque) مقبول لأن الهيكل العربي (موصوف+صفة) منتج ومستقر.
        الملاءمة الصرفية: «متجانسة» على وزن مُتَفَاعِلَة الدال على التشارك والتماثل
        في الجنس — يناسب وظيفةً تصف التجانس المادي. بوابة الجودة: اطّراد ✓، يُسر ✓،
        ملاءمة ✓، اشتقاقية (مواد متجانسة، المادة المتجانسة) ✓، لا لفظ تراثي مفرد بديل.
        غياب السند المعجمي المباشر مردّه الطابع الوصفي للمركب لا إشكالية بنيوية.
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: >
        يمتاز عن «مادة» المشتمِل بإضافة قيد التجانس وتوحّد الخصائص، فيميّز الأنواع
        المتجانسة ذات الخصائص الثابتة (كالذهب والماء والأكسجين) من المادة الأعم التي
        تشمل الخلائط غير المتجانسة والأجسام المركبة — لا بديل مفرد عربي مستقر لهذا
        المفهوم العلمي الجزئي.
      example: "الماءُ والذهبُ مثالان على مواد متجانسة تتّسم كلٌّ منهما بخصائص فيزيائية وكيميائية موحَّدة في جميع أجزائها."

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "جوهر"
      source: step05
      decision: removed
      decision_reason: >
        «جوهر» في العربية المعاصرة والتراثية يحمل أولاً دلالة الحجر الكريم/الثمين
        وثانياً المفهوم الفلسفي الأرسطي (ما يدل بذاته دون حاجة إلى غيره في وجوده، في
        مقابل العَرَض). كلا المعنيين يباعد عن المفهوم العلمي لـ«نوع معيَّن من المادة
        ذي خصائص موحدة». فشل اختبار الإبدال: لا يقال في الخطاب العلمي «الذهب جوهر ذو
        خصائص موحدة» بالمعنى المقصود؛ كما أن الدلالة الفلسفية (الوجود بالذات)
        تناقض مفهوم النوع الجزئي ضمن المادة.
      step05_citation: "«جوهر — substance» — المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      nuance_differentiation: >
        «جوهر» أوسع دلالةً ومشحون فلسفياً — المعنى الفلسفي (ما يقوم بذاته) يستغرق
        الوجود كله لا نوعاً معيّناً من المادة؛ والمعنى الأول (الحجر الكريم) يُضيّق
        المفهوم تضييقاً شديداً. أما «مادة متجانسة» فتحدد نطاقاً وسطاً: نوع ضمن الجنس
        الأعم «مادة».

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "مادة نقية"
      source: step05
      decision: removed
      decision_reason: >
        «المادة النقية» في الكيمياء أضيق من المفهوم المقصود — تشترط التجانس الكيميائي
        (عنصر أو مركب بتركيب كيميائي ثابت)، في حين يشمل التعريف كل مادة ذات خصائص
        موحَّدة بما فيها الخلائط المتجانسة كالهواء. فشل اختبار التثبيت المعجمي:
        لم تُسجَّل كوحدة معجمية ثابتة في المعاجم المستعلَمة. الإبدال جزئي فقط.
      step05_citation: "لا دليل معجمي مباشر — مرشح معرفي"
      nuance_differentiation: >
        «مادة نقية» أخصّ من المقصود — تستلزم التجانس الكيميائي لا مجرد توحّد
        الخصائص الفيزيائية؛ وبذلك تستبعد الخلائط المتجانسة التي تندرج تحت تعريف
        المجموعة الترادفية. «مادة متجانسة» أشمل وأدق للمفهوم الوارد.


