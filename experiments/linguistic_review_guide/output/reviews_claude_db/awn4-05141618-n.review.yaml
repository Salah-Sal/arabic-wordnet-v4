step0_evidence:
  per_lemma:
    - lemma: "عمق"
      confirm:
        - text: "«البُعْدُ إلى أسفل... عُمْقُ الحُبِّ/ عُمْقُ الحُزن: شِدَّته»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«(الْعُمق) الْبعد إِلَى أَسْفَل والوادي وَمَا بعد من أَطْرَاف المفاوز (ج) أعماق وأعماق الأَرْض نَوَاحِيهَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«العُمق والعَمْق: قعر البئر والفجِّ والوادي... وعَمَّقَ النظرَ في الأمور تَعْميقاً»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«العمق: البعد سفلا.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«أصل العُمْقِ: البعد سفلا، يقال: بئر عَمِيقٌ ومَعِيقٌ: إذا كانت بعيدة القعر»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«عَماقة [مفرد]: مصدر عمُقَ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«العمق: [في الانكليزية] Depth... الامتداد الثالث المقاطع لكلّ واحد من الامتدادين الأولين أي الطول والعرض على زوايا، وهو ثالث الأبعاد الجسمية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تعريفات فلسفية وهندسية متعددة للعمق بوصفه بُعداً رياضياً — لا تُوافق بالضرورة التعريف المجرد الشامل للصفة"
        - text: "«رجل عُمْقِيُّ الكلام: لكلامه غَوْرٌ»"
          source: "لسان العرب لابن منظور"
          addition: "دلالة العمق المعنوي في الخطاب والفكر — بُعد لا يذكره التعريف صراحةً"
        - text: "«عَميق: مجرّد، معنوي، ذهني»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "دلالة الاستعمال المعاصر والعامي للعمق بمعنى التجريد الذهني"
        - text: "«عدد الطبقات التي تتعلَّم الأوزان في شبكة عصبية»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "استعمال مصطلحي تقني حديث للعمق بمعنى حوسبي — لا علاقة له بالتعريف المجرد"
      peripheral_observations:
        - "«العَمْق: وادٍ بالطائف... وع، أو ماءٌ ببلاد مُزينة» — اسم مكان في معجم البلدان لياقوت الحموي، مستقل تماماً عن دلالة الصفة"
        - "«العَمْق: البُسر الموضوع في الشمس ليَجِفّ» — معنى مادي آخر عن أبي حنيفة في لسان العرب، مستقل عن المجموعة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عَمَاقَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«عَماقة [مفرد]: مصدر عمُقَ» — معجم اللغة العربية المعاصرة؛ «عَمُقَتْ الْبِئْرُ عُمْقًا وعَمَاقَةً» — المصباح المنير للفيّومي"
      justification: "مصدر فَعَالة من جذر ع-م-ق (اشتقاق)، يعني الحالة الدالة على كون الشيء عميقاً، وهو بالضبط المعنى الذي تعبّر عنه المجموعة الترادفية كـ«سمة أو جودة»"
    - lemma: "غَوْر"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الغَوْر: القَعْرُ من كلِّ شيء... ومنه فلان بعيد الغور أي حقود أو عارف بالأمور» — التوقيف على مهمات التعاريف؛ «من كل شيء: قعره وعمقه» — المعجم الوسيط"
      justification: "مرادف جزئي لعمق في المعنى المادي (القعر)، وله استعمال مجازي في العمق المعنوي"
  knowledge_candidates:
    - lemma: "سُحْق"
      justification: "مصدر من جذر سحق (اشتقاق) يعني البُعد الشديد، مذكور في لسان العرب والصِحاح: «السُّحق: البعد» وفي الدعاء «سحقاً له» أي بُعداً، قريب من دلالة العمق بمعنى الشدة والبعد، لكن تخصّص تاريخياً في البعد المكاني"
    - lemma: "إِمَاقَة"
      justification: "هل يوجد اشتقاق على وزن إفعالة من مَعُق/عمق (قلب)؟ يُشير لسان العرب إلى «مَعِيق» لغةً بديلة لـ«عميق». قد يكون هناك مصدر مقابل لكن لا تثبت المعاجم صيغة إماقة — هذا المرشح وُلّد من المعرفة اللغوية النظرية ولا دليل على سكّه"
  generation_notes: "التعريف يصف صفةً مجردة (attribute). التوليد الأنسب هو المصادر (اشتقاق) من جذر عمق أو مرادفاته الحسية. عَمَاقَة هو المرشح الأقوى. غَوْر يُغطي المعنى الحسي فقط."

step1_lemma_validation:
  per_lemma:
    - lemma: "عمق"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من معاجم متعددة كلاسيكية ومعاصرة — المعنى المادي والمجرد كلاهما موثّق"
      evidence_assessment:
        case: "mixed"
        notes:
          - "الأدلة الكلاسيكية تُغلّب المعنى الحسي المادي (قعر البئر والفج)، بينما المعاصرة تضمّ المعنى المجرد (شدة الحب والحزن) — وهذا التوسع يعكس تطوراً دلالياً مستقراً"
      substitution_test:
        result: "pass"
      loanword_check:
        is_loanword: false
      quality_gate:
        consistent_usage: true
        ease_of_use: true
        fitness: true
        heritage_preferred: true
        arabic_preferred: true
        derivability: true
      morphological_fit:
        pos: noun
        pattern: "فُعْل (مصدر/اسم جنس)"
        assessment: "الوزن فُعْل مناسب لاسم الصفة المجردة — يُستعمل مصدراً وجامداً اصطلاحياً"
      nuance_differentiation: "يتميز عمق عن مرادفاته المحتملة (غور، سحق) بشموله المعنيين الحسي والمجرد معاً في آنٍ واحد، وباتساع اشتقاقه (عميق، عمّق، تعمّق، إعماق) وثبات استعماله في العربية الفصحى المعاصرة"
      example: "أبدت الجلسة النقاشية عمق الخلاف الحضاري بين المدرستين الفلسفيتين."

    - lemma: "عَمَاقَة"
      source: step05
      decision: removed
      decision_reason: "تغطي المعنى الحسي المادي (عَمَاقَة البئر) ولا تتسع طبيعياً لتشمل دلالة الشدة والقوة (عُمق الحزن ≠ ؟عَمَاقَة الحزن) — فشل اختبار الإبدال في السياق المجرد"
      step05_citation: "«عَماقة [مفرد]: مصدر عمُقَ» — معجم اللغة العربية المعاصرة"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "أثار عمق حزنه شفقةَ الجميع"
            substituted: "أثار عَمَاقَةُ حزنه شفقةَ الجميع"
            preserved_meaning: false
            why_failed: "عَمَاقَة لا تستعمل مع المشاعر المجردة في الفصحى المعاصرة — تفتقر إلى النقل الدلالي الذي اكتسبه «عمق»"
      nuance_differentiation: "عَمَاقَة صالحة للمعنى الحسي الضيّق (عَمَاقَة البئر) لكنها لا تحمل المعنى الموسع المجرد الذي يحمله «عمق»"

    - lemma: "غَوْر"
      source: step05
      decision: removed
      decision_reason: "مرادف جزئي للمعنى المادي لكنه يُغلّب دلالة التجويف الأرضي والمنخفض ولا يُحيط بمعنى الشدة والقوة"
      step05_citation: "«الغَوْر: القعر من كل شيء» — التوقيف على مهمات التعاريف"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "عُمقُ الحبِّ الحقيقي يُدرَك بالتجربة لا بالتعريف"
            substituted: "غَوْرُ الحبِّ الحقيقي يُدرَك بالتجربة لا بالتعريف"
            preserved_meaning: false
            why_failed: "غَوْر في تعبير «بعيد الغور» يعني الحنق أو الذكاء لا الشدة العاطفية، مما يُلتبس المعنى"
      nuance_differentiation: "غَوْر يتخصص في المنخفضات الطبيعية (غور الأردن) والعمق المادي للماء؛ يُستخدم مجازاً بمعنى حسن الفطنة، وليس الصفة المجردة الشاملة للعمق"

    - lemma: "سُحْق"
      source: step05
      decision: removed
      decision_reason: "يعني البُعد المكاني الشديد (سحقاً = بُعداً) لا الصفة الوصفية التجريدية للعمق — لا يصح استبداله بعمق في أي سياق تعريفي"
      step05_citation: "«السُّحْق: البعد» — تاج اللغة وصِحاح العربية"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "عُمق الفكر الفلسفي يتجلى في قدرته على الاختزال"
            substituted: "سُحق الفكر الفلسفي يتجلى في قدرته على الاختزال"
            preserved_meaning: false
            why_failed: "سُحق لا يُستعمل وصفاً للأفكار — يُستعمل في الدعاء (بُعداً) وفي البُعد الجغرافي فقط"
      nuance_differentiation: "سُحق يتخصص في البُعد المكاني أو الدعائي، ولا يشترك مع «عمق» في دلالة الوصف التجريدي"

    - lemma: "إِمَاقَة"
      source: step05
      decision: removed
      decision_reason: "صيغة نظرية لا دليل على سكّها أو تداولها في المعاجم — رُفضت في الخطوة 0.5 ذاتها"
      step05_citation: "لا دليل معجمي — مرشح نظري من القياس الصرفي"
      nuance_differentiation: "غير مستعملة ولا موثّقة"

step3_definition:
  definition_review_flag: false
  current_definition: "سمة أو جودة كون الشيء عميقاً أو قوياً أو شديداً"
  assessment:
    decision: revise
    reason: "«أو قوياً» في التعريف ترجمة حرفية للإنجليزية (strong) لا تطابق الاستعمال العربي — العربية تعبّر عن هذه الدلالة بـ«الشدة» لا بـ«القوة»، كما أن «قوياً» في العربية يُحيل إلى الاقتدار الجسدي أو التأثير الفاعل لا إلى الصفة التجريدية الوصفية"
  scope_note: "التعريف الكلاسيكي يُضيّق العمق في المعنى الحسي المادي (بُعد القعر)، بينما التعريف الحالي يوسّعه لصفة مجردة شاملة — التوسع مدعوم من المعجم المعاصر"
  authored_definitions:
    - type: terminological
      text: "سِمَةُ كونِ الشيء عميقاً؛ ويُطلق على العمق الحسي كبُعد قعر البئر والوادي، والعمق المعنوي كشدة الفكر والعاطفة وكُنْهها"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
    - type: linguistic
      text: "بُعد القعر في الشيء المادي أو شدة الأثر في المعنوي"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-05141618-n"
        definition_index: 0
        text: "سِمَةُ كونِ الشيء عميقاً؛ ويُطلق على العمق الحسي كبُعد قعر البئر والوادي، والعمق المعنوي كشدة الفكر والعاطفة وكُنْهها"
    - command: add_definition
      params:
        synset_id: "awn4-05141618-n"
        text: "بُعد القعر في الشيء المادي أو شدة الأثر في المعنوي"

