step0_evidence:
  per_lemma:
    - lemma: "شَيْء مُسْتَقِلّ"
      confirm:
        - text: "«الموجود الثابت المتحقق في الخارج»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«مستقلّ؛ قائم بذاته»"
          source: "المورد الحديث (2008) — ضمن مقابلات individual"
        - text: "«قائم بذاته: صفةٌ لتجهيزةٍ لا تحتاج إلى دعمٍ من تجهيزةٍ أو نظام آخر»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«الشيء: كلُّ موجود, حِسّيٌّ أو معنويٌّ»"
          source: "المعجم الكبير"
          addition: "يشمل المعنوي كما يشمل الحسّي — أعمّ من «الكيان المستقل المادّيّ» الذي تختصّ به المجموعة"
        - text: "«الشيء: ما يجوز أن يخبر عنه وتصح الدلالة عليه»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "المعنى اللغوي الأصلي يتسع للممكن والمعدوم في بعض المذاهب الفلسفية — أشمل من المعنى المقصود في المجموعة"
        - text: "«الشيء (في الفلسفة): ما يُتَصَوَّرُ أو يُخْبَرُ عنه، ويُراد به أساسًا الموجود»"
          source: "المعجم الكبير"
          addition: "البُعد الفلسفي الواسع لـ«شيء» يتجاوز خاصّتَي الاستقلالية والانفصال اللتين تعرّف بهما المجموعة"
      peripheral_observations:
        - "«الشيء» في اصطلاح الجبر: العدد المجهول (الجذر) — معجم مقاليد العلوم للسيوطي — معنى مستقل تماماً لا صلة له بالمجموعة"
        - "نقاش الأشاعرة والمعتزلة حول إطلاق «الشيء» على المعدوم الممكن (كشّاف اصطلاحات الفنون للتهانوي) — دقة كلامية تاريخية لا تنعكس على الاستعمال المعاصر"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "كيان"
      source_section: step5_english_bridge
      evidence_citation: "«كيان: شيء مادي أو غير مادي يمكن التعرُّف عليه وتمييزه بوضوح» — معجم البيانات والذكاء الاصطناعي (2024)"
      justification: "مقابل مباشر لـ entity في جميع معاجم ARABTERM الحديثة؛ يتضمن ضمنياً معنى التمييز والتحديد اللذين يقتضيهما تعريف «الكيان المنفصل»"
    - lemma: "موجود"
      source_section: step4_fts_keyword
      evidence_citation: "«الموجود (في الفلسفة): الثابت في الذهن وفي الخارج» — المعجم الوسيط"
      justification: "اشتقاق (اسم مفعول من وجد) يدل على ثبات الوجود واستقراره؛ قريب من معنى «الكيان القائم بذاته» في الاصطلاح الفلسفي"
  knowledge_candidates:
    - lemma: "فرد"
      justification: "إحياء لفظ تراثي فلسفي؛ الفرد عند الجرجاني «ما يتناول شيئاً واحداً دون غيره» — يلتقط الانفصال والتمايز عن الكثرة، وهما خاصّتان جوهريتان في تعريف المجموعة؛ آلية التوليد: إحياء ممات"
  generation_notes: "لا توجد كلمة عربية مفردة تلتقط دلالة «الكيان المستقل المنفصل» بدقة كافية دون قيد إضافي — الجذور الدلالية الواعدة: ش-ي-أ، و-ج-د، ف-ر-د، ك-ي-ن"

step1_lemma_validation:
  per_lemma:
    - lemma: "شَيْء مُسْتَقِلّ"
      decision: confirmed
      decision_reason: >
        مقبول مؤقتاً لغياب بديل مسكوك أفضل. يفشل اختباري السكّ والتثبيت المعجمي:
        (أ) اختبار السكّ: يمكن إبدال «مستقل» بـ«منفصل» أو «قائم» وتظل العبارة وصفاً صالحاً
        للمفهوم، مما يكشف أنها مركب وصفي حر لا مصطلح مسكوك؛
        (ب) اختبار التثبيت المعجمي: لم تُسجَّل «شيء مستقل» وحدةً اصطلاحية في أي معجم.
        بوابة الجودة — إشكالية: الاشتقاقية ضعيفة (لا يُشتق من المركب بسهولة).
        قرار: يُؤخذ به إلى حين تحديد مصطلح أدق عبر مراجعة بشرية.
      evidence_assessment:
        case: expands
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة. تتميز عن «شيء» المفرد بتضمّن قيدَي الاستقلالية
        والانفصال الحدودي — وهما ما يفرّق هذه المجموعة عن المُشتمِل «كيان مادّيّ»
        الذي يدل على الوجود المادّيّ العام دون اشتراط الاستقلالية.
      example: "يُعدُّ كلُّ كوكب في المنظومة الشمسية شيئاً مستقلاً ذا كتلة وحدود فيزيائية واضحة تفصله عن سائر الأجرام."

    - lemma: "كيان"
      source: step05
      decision: removed
      decision_reason: "يرد «كيان» في تعريف المجموعة وفي تسمية المُشتمِل المباشر (كيان مادّيّ) — إضافته لمّةً مفردة بلا قيد تُفضي إلى تداخل مع المُشتمِل ودوران في الشجرة الدلالية؛ فضلاً عن فشل اختبار الإبدال: «هذا الحجر كيان» ≠ «هذا الحجر شيء مستقل»"
      step05_citation: "«كيان: شيء مادي أو غير مادي يمكن التعرُّف عليه وتمييزه بوضوح» — معجم البيانات والذكاء الاصطناعي (2024)"

    - lemma: "موجود"
      source: step05
      decision: removed
      decision_reason: "يدل على «الثابت في الذهن وفي الخارج» — معنى وجودي عام أشمل مما يقتضيه التعريف؛ لا يلتقط خاصّتَي الانفصال الحدودي والاكتفاء الذاتي. يُضاف إلى ذلك إيهامه بالنعت الآني (ما وُجد الآن)"
      step05_citation: "«الموجود (في الفلسفة): الثابت في الذهن وفي الخارج» — المعجم الوسيط"

    - lemma: "فرد"
      source: step05
      decision: removed
      decision_reason: >
        «الفرد» في المعاجم العربية يحمل معنيَين رئيسيَّين: الانفراد العددي (نقيض الزوج)
        والشخص المتميز — لا معنى الكيان المادّيّ المنفصل؛ فشل اختبار الإبدال:
        «هذا الجسم فرد» لا تؤدي المعنى المقصود في سياق «شيء مستقل قائم بذاته»؛
        كما أن الدلالة الإنسانية لـ«فرد» تُضيّق استعماله في السياق الأنطولوجي العام
      step05_citation: "«الفرد: ما يتناول شيئاً واحداً دون غيره» — كتاب التعريفات للشريف الجرجاني"

  synset_flags:
    definition_review_needed: true

