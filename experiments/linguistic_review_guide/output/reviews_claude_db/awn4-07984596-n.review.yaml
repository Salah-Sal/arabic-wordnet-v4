        - text: "«مجموعة من الكائنات بداخل صنف معين، وتكون متماثلة الزيجوت (جينيا)، وتشترك في مميزات بارزة من الصفات الظاهرية والاختلافات الفيزيولوجية» — سلالة = strain (Genetics)"
