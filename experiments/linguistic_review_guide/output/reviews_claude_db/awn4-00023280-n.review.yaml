step0_evidence:
  per_lemma:

    - lemma: "سِمَة نَفْسِيَّة"

      contradicts:
        - text: "«سِمَةٌ نَفْسِيَّة — psychic stigma»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >-
            المعجم الطبي يُخصّص التعبير ليعني «وصمة/علامة نفسية» (psychic stigma)
            — مصطلح طبي ضيّق وسالب الدلالة يُشير إلى وصمة مرضية، في حين تعريف
            المجموعة يقصد «خاصية من خصائص الحياة العقلية» بمعناه العام المحايد
            الشامل للإدراك والانفعال والإرادة وسائر مظاهر الحياة الذهنية

      expands:
        - text: "«السِّمَة: مَا وُسِم به الحيوان من ضروب الصُّوَر، العلامة»"
          source: "المعجم الوسيط"
          addition: >-
            الجذر الأصلي وَسَمَ يُفيد العلامةَ الكاشفةَ عن هوية الشيء وتمييزه —
            بُعد التمييز والكشف عن الهوية يُغني دلالة المجموعة بربط «السمة» بوظيفتها
            التصنيفية لا مجرد وصف المظهر
        - text: "«سِمةَ: إحدى الصفات الكثيرة التي تحدد الكائن. فالنمط الظاهري وصف لسمة أو أكثر»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: >-
            يُوظّف «سمة» في سياق تقني بيولوجي تطوري (وصف الكائن بصفاته المميّزة)
            يتناظر بنيوياً مع استعمالها في علم النفس لوصف سمات الشخصية
        - text: "«سمة: صفة أو ميزة لشيء ما بمقدور البشر أو الطُّرُق المؤتمتة التعرُّف عليها، وغالبًا ما تستخدم كمرادفًا لكلمة (خاصية)»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: >-
            يؤكد تكافؤ «سمة» و«خاصية» في الاستعمال التقني الحديث ويوسّع مدى
            الاستعمال إلى حقل الذكاء الاصطناعي؛ مما يشهد على حيوية اللفظ وعدم
            تقادمه

      peripheral_observations:
        - >-
          الاستعمال اللغوي لـ«السِّمَّة» (بالتشديد على الميم، جذر سمم) يُشير إلى
          أشياء مختلفة تماماً (ما يُستخرج من البحر، جمّارة النخلة) — لا صلة
          بالمجموعة؛ ينبغي التمييز الصرفي بين «سِمَة» (وسم) و«سُمَّة» (سمم)


step05_lemma_generation:
  evidence_candidates:
    - lemma: "خاصية نفسية"
      source_section: "step4_fts_keyword"
      evidence_citation: >-
        «خاصية: صفة أو ميزة للبيانات يمكن استخدامها مُدخَلًا لعملية التنبؤ،
        وغالبًا ما تُستخدم مُرادِفًا لكلمة (سمة)» — معجم البيانات والذكاء
        الاصطناعي (2024)؛ وأيضاً «خاصية: property» في المعجم الموحد للرياضيات
        والمعجم الموحد للفيزياء والكيمياء (مصادر ArabTerm متعددة)
      justification: >-
        تركيب وصفي (اسم + نعت) يجمع «خاصية» (property/feature/characteristic) +
        «نفسية» (psychological) — مقابل مباشر للمفهوم الإنجليزي؛ آلية التوليد:
        تركيب وصفي. موثّق بكثافة في المعاجم التقنية كمقابل عربي لـ property

    - lemma: "ظاهرة نفسية"
      source_section: "step4_fts_keyword"
      evidence_citation: >-
        «ظاهرة: حادثة يمكن رصدها ووصفها على أساس علمي» — المعجم الكبير؛
        «ظاهرة: phenomenon» في مراجع ArabTerm متعددة (التربية، الفلسفة، علم
        النفس، علوم الأحياء)
      justification: >-
        تركيب وصفي (اسم + نعت) شائع في الأدبيات العلمية العربية لوصف مظاهر
        الحياة النفسية؛ آلية التوليد: تركيب وصفي. وإن كان يميل نحو phenomenon
        أكثر من feature/property

  knowledge_candidates:
    - lemma: "صِفَة نَفْسِيَّة"
      justification: >-
        تركيب وصفي — «صِفَة» من أصيل الألفاظ العربية الفصيحة (جذر و-ص-ف) ومستعمل
        في علم النفس العربي للدلالة على السمة أو الخاصية؛ آلية التوليد: تركيب
        وصفي. يتجنّب الإشكال المصطلحي لـ«سمة نفسية» في السياق الطبي (psychic
        stigma)

    - lemma: "مَلَكَة ذِهْنِيَّة"
      justification: >-
        اشتقاق + تركيب — «مَلَكَة» (جذر م-ل-ك) وردت في المعاجم الكلاسيكية
        بمعنى القدرة الراسخة في النفس؛ ابن خلدون ووظّفها في وصف القدرات الإنسانية
        الباطنة؛ آلية التوليد: اشتقاق (مَفْعَلَة) + تركيب. غير أنها تميل نحو
        faculty/ability لا نحو feature العام

  generation_notes: >-
    التعريف رفيع المستوى جداً (top-level abstract node) في شجرة WordNet — لا يوجد
    مفرد عربي يعادله؛ الجسر الإنجليزي لم يُنتج مطابقات مباشرة لـ«psychological
    feature» بمعناه WordNet العام؛ كل المرشحات تركيبات وصفية وهو أمر متوقع في
    هذا المستوى من التجريد


step1_lemma_validation:
  per_lemma:

    - lemma: "سِمَة نَفْسِيَّة"
      decision: confirmed
      decision_reason: >-
        تعبير مركب وصفي (وصفي: اسم + نعت) مستقر في الاستعمال التخصصي العربي
        لعلم النفس — لا سيما في أدبيات سمات الشخصية (personality traits)؛
        التناقض المعجمي الوحيد (psychic stigma في المعجم الطبي) يتعلق بتخصيص
        طبي ضيّق لا يُبطل الاستعمال النفسي العام؛ مكوّنا التعبير موثّقان
        معجمياً في المعاجم التقنية. فحص الاقتراض: تركيب calque من «psychological
        feature» — الهيكل الاستعاري واضح ومقبول. الملاءمة الصرفية: «سِمَة»
        وزن اسم الهيئة من وسم — مناسب تماماً للسمة الكاشفة عن هوية الشيء.
        بوابة الجودة: الاطّراد موجود، اليُسر في التداول جيد، الملاءمة محدودة بخطر
        الالتباس الطبي، الاشتقاقية متوسطة (سمات، وسم، موسوم).
      evidence_assessment:
        case: contradicts
        notes:
          - "التناقض من المعجم الطبي: psychic stigma ≠ psychological feature — تخصيص لا نقيض"
          - "الأدلة التوسّعية من مكوّن «سمة» تدعم الدلالة العامة"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: >-
        اللمّة الوحيدة في المجموعة؛ في مقابل «خاصية نفسية»: «سمة» تنطوي على
        دلالة الوَسْم والتمييز (من وسم) مما يجعلها أكثر ديناميكية من «خاصية»
        الساكنة؛ وفي مقابل «ظاهرة نفسية»: «سمة» أعمّ وتشمل المظاهر الباطنة غير
        المرصودة خارجياً كالانفعالات الداخلية والمواقف الضمنية
      example: >-
        يُصنّف علماء النفس السِّمَات النفسية للشخصية في خمسة أبعاد كبرى تشمل
        الانبساطية والتوافقية والضميرية والعصابية والانفتاح على التجربة.
      actions:
        - command: set_confidence
          params:
            entity_type: sense
            entity_id: "{auto}"
            score: 0.78

    - lemma: "خاصية نفسية"
      source: step05
      decision: removed
      decision_reason: >-
        تركيب وصفي حر غير مسكوك كمصطلح ثابت في المعاجم التخصصية النفسية؛ فشل
        اختبار التثبيت المعجمي: لم يرد كوحدة معجمية مدرجة في أي معجم نفسي أو
        موحّد. فضلاً عن ذلك: «خاصية» مرفوضة في معجم الصواب اللغوي لأحمد مختار
        عمر (الصواب: خاصة)، وإن كانت شائعة في الاستعمال؛ بوابة الجودة: إشكالية
        في معيار «إيثار الفصيح» و«الاطّراد».
      step05_citation: >-
        «خاصية: صفة أو ميزة للبيانات... مرادف لكلمة (سمة)» — معجم البيانات
        والذكاء الاصطناعي (2024) | «خاصّيّة: مرفوضة — الصواب: خاصة الانسياب»
        — معجم الصواب اللغوي لأحمد مختار عمر

    - lemma: "ظاهرة نفسية"
      source: step05
      decision: removed
      decision_reason: >-
        فشل اختبار الإبدال — «ظاهرة» تدل على phenomenon (حادثة مرصودة) لا على
        feature/property (سمة/خاصية)؛ الفارق الدلالي جوهري: الظاهرة تستلزم
        إمكانية الرصد الخارجي، في حين تشمل «السمة النفسية» في AWN4 الحالات
        الذهنية الباطنة (كالمشاعر والمواقف الضمنية) غير القابلة للرصد المباشر؛
        التعبير أخصّ بمستوى واحد من المجموعة المدروسة.
      step05_citation: >-
        «ظاهرة: حادثة يمكن رصدها ووصفها على أساس علمي» — المعجم الكبير؛
        «ظاهرة: phenomenon» — معاجم ArabTerm المتعددة

    - lemma: "صِفَة نَفْسِيَّة"
      source: step05
      decision: removed
      decision_reason: >-
        تركيب وصفي حر لم يُسكَّ كمصطلح ثابت في المعاجم التخصصية؛ فشل اختبار
        التثبيت المعجمي: إبدال «نفسية» بـ«عقلية» أو «انفعالية» لا يُفسد المعنى
        العام مما يكشف أنه تعبير وصفي حر؛ رغم صحة «صِفَة» الصرفية تماماً فإنه
        لا يُشكّل وحدة معجمية مسكوكة.
      step05_citation: "من المعرفة اللغوية — لا دليل معجمي مباشر للتركيب"

    - lemma: "مَلَكَة ذِهْنِيَّة"
      source: step05
      decision: removed
      decision_reason: >-
        أخصّ من المجموعة — الملَكَة تدل على القدرة أو المهارة الراسخة
        (faculty/ability) كالملكة اللغوية أو ملكة التفكير، وهي مجموعة فرعية من
        «السمة النفسية» لا مرادف لها في مستوى التجريد المطلوب؛ الإبدال يفشل:
        «دراسة مَلَكَات الشخصية» لا تستوعب الانفعالات والمشاعر التي تشملها
        «السمات النفسية» في AWN4.
      step05_citation: "من المعرفة اللغوية — لا دليل معجمي مباشر للتركيب"

  synset_flags:
    definition_review_needed: true


step3_definition:
  definition_review_flag: true
  current_definition: "سمة من سمات الحياة العقليّة والنفسيّة للكائن الحيّ"
  assessment:
    decision: revise
    reason: >-
      التعريف دوري: يستخدم «سمة» (جزء من اللمّة «سمة نفسية») في تعريف نفسها؛
      فضلاً عن ذلك هو ترجمة حرفية للتعريف الإنجليزي «a feature of the mental
      life of a living organism» دون مراعاة الأسلوب المعجمي العربي (جنس قريب +
      فصل نوعي). الأدلة التوسّعية تشير إلى إمكانية تعريف أغنى يُضمّن دلالة
      الوَسْم (التمييز) الأصلية للجذر.
  scope_note: >-
    التعريف الكلاسيكي لـ«السِّمَة» (العلامة الكاشفة عن هوية الشيء) أوسع من
    الاستعمال النفسي الحديث المقصود
  authored_definitions:
    - type: terminological
      text: >-
        ما يتصف به الكائنُ الحيُّ من مظاهر حياته الذهنية والوجدانية التي تُميّزه
        وتكشف عن طبيعته الباطنة، كالإدراك والانفعال والإرادة والوجدان
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: >-
        خاصة ذهنية أو وجدانية راسخة في الكائن الحي تنتمي إلى حياته الباطنة
        وتُميّزه عن غيره
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-00023280-n"
        definition_index: 0
        text: >-
          ما يتصف به الكائنُ الحيُّ من مظاهر حياته الذهنية والوجدانية التي تُميّزه
          وتكشف عن طبيعته الباطنة، كالإدراك والانفعال والإرادة والوجدان
    - command: add_definition
      params:
        synset_id: "awn4-00023280-n"
        text: "خاصة ذهنية أو وجدانية راسخة في الكائن الحي تنتمي إلى حياته الباطنة وتُميّزه عن غيره"


