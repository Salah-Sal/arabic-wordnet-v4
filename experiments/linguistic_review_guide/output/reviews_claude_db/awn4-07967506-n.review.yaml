step0_evidence:
  per_lemma:

    - lemma: "جَمَاعَة اجْتِمَاعِيَّة"
      confirm:
        - text: "«(الْجَمَاعَة) الْعدَد الْكثير من النَّاس وَالشَّجر والنبات وَطَائِفَة من النَّاس يجمعها غَرَض وَاحِد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«العدَدُ الكثير من الناس والشجر والنبات طائفة من الناس يَجْمَعُها غرض واحد»"
          source: "المعجم الوسيط"
        - text: "«جماعة: group — مجال: Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«جماعة: community — مجال: Geography and History»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
      expands:
        - text: "«الجماعة: [في الانكليزية] Community، society، clan... لغة فرقة يجتمعون»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُضيف دلالتَي Community وSociety اللتين هما أشمل من Social Group — تعريف المجموعة يخصّص الجماعة باشتراط العلاقة الاجتماعية المشتركة لا الغرض الواحد فحسب"
      peripheral_observations:
        - "مداخل «الجماعة» الفقهية (صلاة الجماعة، جماعة القراء، جماعة عند أهل الرمل) — معانٍ اصطلاحية خاصة لا صلة لها بالجماعة الاجتماعية المستهدفة"

    - lemma: "فِئَة اجْتِمَاعِيَّة"
      confirm:
        - text: "«(الفئة) الْفرْقَة وَفِي التَّنْزِيل الْعَزِيز {كم من فِئَة قَليلَة غلبت فِئَة كَثِيرَة بِإِذن الله} (ج) فئات وفئون»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«فئة: category — مجال: Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«فئة: category — مجال: The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«الفئة: الطائفة المقيمة وراء الجيش للالتجاء إليهم عند الهزيمة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الكلاسيكي عسكري (جماعة الدعم العسكري خلف الجيش) — بعيد كلياً عن مفهوم الجماعة الاجتماعية"
        - text: "«الفئة: الطَّائِفَة المقيمة وَرَاء الْجَيْش للالتجاء إِلَيْهِم عِنْد الْهَزِيمَة»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "نفس المعنى العسكري الكلاسيكي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جماعة اجتماعية"
      source_section: "step4_fts_keyword"
      evidence_citation: "«جماعة: group — مجال: Sociology and Anthropology» — مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
      justification: "تركيب وصفي من «جماعة» (ج-م-ع: التجمع والاجتماع) + «اجتماعية» — يُطابق social group بمعناه التفاعلي، مستقر في الأدبيات الاجتماعية العربية الأكاديمية والتعليمية"
    - lemma: "فئة اجتماعية"
      source_section: "step4_fts_keyword"
      evidence_citation: "«فئة: category — مجال: Sociology and Anthropology» — مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
      justification: "تركيب وصفي من «فئة» (الفرقة/الطائفة) + «اجتماعية» — يُطابق social category/group بمعناه التصنيفي، شائع في الخطاب الاجتماعي والصحفي والأكاديمي العربي"
  knowledge_candidates:
    - lemma: "شريحة اجتماعية"
      justification: "آلية التوليد: إزاحة دلالية (مجاز) — «شريحة» (ش-ر-ح: الشقّ والتقطيع) انتُقل دلالياً من القطعة المرققة من اللحم إلى الفئة المقتطعة من جسم المجتمع. ورد هذا المعنى الجديد صريحاً في المعجم الكبير: «فئة من المجتمع تتقارب ظروفها الاجتماعية أو المهنية أو الثقافية»، وأقرّ معجم الصواب اللغوي (أحمد مختار عمر) صحّة «شريحة اجتماعية» مع تنبّهه إلى حداثة الاستعمال. تركيب وصفي إضافي مستقر في الصحافة والأدبيات الاجتماعية العربية."
  generation_notes: "المفهوم المستهدف هو الجنس الأعلى للجماعات الاجتماعية كافة (مجموعة أبوية). المصطلحات العربية المتوفرة تتوزع بين دلالة التفاعل (جماعة) والتصنيف (فئة) والطبقية (شريحة) — وقد تكون «شريحة اجتماعية» أخص من المفهوم المستهدف."

step1_lemma_validation:
  per_lemma:

    - lemma: "جَمَاعَة اجْتِمَاعِيَّة"
      decision: confirmed
      decision_reason: "مصطلح اجتماعي مستقر؛ أدلة مؤكِّدة من المعجم الوسيط ومسرد علم الاجتماع (ALECSO)؛ تركيب وصفي من جذر أصيل (ج-م-ع) ومشتق فصيح — جميع معايير بوابة الجودة محقَّقة: فصيح مستعمل، يسير التداول، ملائم للمفهوم، عربي الأصل، قابل للاشتقاق (جماعي، تجمّع)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "يُركّز على التجمّع الفعلي والتفاعل المباشر بين الأعضاء — أشخاص يلتقون برابطة اجتماعية ويتشاركون في إطارها (كالأسرة، النادي، الفريق). يُفرَّق به عن «فئة اجتماعية» التي تدل على التصنيف التحليلي الخارجي لمجموعة بحسب خصائص مشتركة دون اشتراط التفاعل المباشر"
      example: "تُعدّ الأسرةُ أصغرَ جماعةٍ اجتماعيةٍ تُشكّل البيئةَ الأولى لتنشئة الفرد وصياغة هويّته."

    - lemma: "فِئَة اجْتِمَاعِيَّة"
      decision: confirmed
      decision_reason: "مصطلح اجتماعي مستقر في الاستعمال الحديث؛ المعنى الكلاسيكي العسكري (الطائفة خلف الجيش) تجاوزه الاستخدام المعاصر بدلالة التصنيف الاجتماعي؛ مدعوم بمسرد علم الاجتماع ALECSO؛ فحص الاقتراض: لا اقتراض — مفردة عربية أصيلة استُعملت بمعنى جديد؛ لا ترجمة حرفية عمياء"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "يُركّز على التصنيف التحليلي والتمييز الفئوي — أشخاص يُصنَّفون معاً بحسب خصائص اجتماعية مشتركة كالفئة العمرية والمهنية والاقتصادية دون اشتراط التفاعل المباشر؛ أقرب إلى social category في التمييز التحليلي مقابل «جماعة اجتماعية» التفاعلية"
      example: "تسعى برامجُ الرعاية الاجتماعية إلى تحسين مستوى معيشة جميع الفئاتِ الاجتماعيةِ دون تمييز."

    - lemma: "شريحة اجتماعية"
      source: step05
      decision: removed
      decision_reason: "أخص من المفهوم المستهدف — تدل على الشريحة/الطبقة الاجتماعية (social stratum) أي مجموعة تتقارب ظروفها الاجتماعية والمهنية والثقافية؛ فشل اختبار الاستبدال في سياقات المجموعات التفاعلية: «الأسرة جماعة اجتماعية» صحيح، لكن «الأسرة شريحة اجتماعية» غير دقيق — الأسرة ليست شريحة مجتمعية"
      step05_citation: "«فئةٌ من المجتمع تتقاربُ ظروفُها الاجتماعيةُ أو المهنيةُ أو الثقافيةُ» — المعجم الكبير"

