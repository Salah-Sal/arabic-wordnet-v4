step0_evidence:
  per_lemma:

    - lemma: "حافز"
      confirm:
        - text: "«(في علم النفس) drive: نشاط داخليّ في الكائن الحيّ, أو فى عُضْوِ من أعضائِهِ, يجعلـه مُهَيَّئًا للاستِجابَةِ لِمُثِيرٍ مُعَيَّنٍ»"
          source: "المعجم الكبير"
        - text: "«الدافع من الخلف بالسوق أو غيره، والحاث على الشيء، والطاعن»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«حَافِز» (translation_en: motive)"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«مقابِلُ ماليّ يُمنَحُ للعامل تشجيعًا لإتْقانِهِ العَمَلَ أو لزيادة الإنتاج»"
          source: "المعجم الكبير"
          conflict: "المعنى الاقتصادي (incentive/مكافأة مالية) يختلف عن السمة النفسية المحرّكة للسلوك"
        - text: "«مادة تزيد من سرعة التفاعل الكيميائي الناجم عن بعض المواد دون أن تستهلك نفسها»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "المعنى الكيميائي (catalyst) مختلف تماماً عن السمة النفسية"
      expands:
        - text: "«في النظرية السلوكية، هو الحدث المنبه الذي يثير استجابة ما»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُوسّع المفهوم نحو stimulus (المنبّه السلوكي) وهو أعمّ من الدافعية النفسية التوجيهية"
        - text: "«تمييز اقتصادىّ يتمتع به المشاركون في نظام الحدّ الأقصى للانبعاثات ويظهر بصفة خاصة كحافز اقتصادي»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يُضيف بُعد الحافز الاقتصادي/المادي الخارجي المتمايز عن السمة النفسية الداخلية"
      peripheral_observations:
        - "«طريقة ظهور استعارة جامدة (لحافز حر) كوحدة أنماط تصورية في موازاة مع حوافز مجاورة خاضعة لوظيفة محددة في السرد القصصي» — المعجم الموحد لمصطلحات اللسانيات (2002): معنى أدبي/سردي مستقل تماماً عن الدلالة النفسية"

    - lemma: "دافع"
      confirm:
        - text: "«(في الفلسفة) mobile: الداعي, وماله يختار القادرُ الفعلَ. وهو العاملُ الخاصُّ بالإنسانِ والمَوْقِفِ»"
          source: "المعجم الكبير"
        - text: "«حالة داخلية جسمية أو نفسية تدفع الفرد نحو سلوك في ظروف معينة وتوجهه نحو إشباع حاجة أو هدف محدد؛ أي أنها قوة محركة منشِّطة وموجِّهة في وقت واحد»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«القوة الداخلية التي تنشط النزوع عند الإنسان»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«دافِع» (translation_en: motivation)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«دافِع» (translation_en: motive)"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«الدَّافِع» (translation_en: payer)"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "يحمل «دافع» بمعنى «من يدفع المال» (payer) — اشتراك لفظي مع مفهوم مغاير للمقصود"
      expands:
        - text: "«وقد اصطُلِحَ على إطلاقِ لفظِ الحافزِ على الدَّافِعِ الخاصِّ بالإنسانِ ولفظِ \"الباعث\" على الدَّافِعِ الصَّادرِ عن المَوْقِفِ. ويَنْقَسِمُ إلى صِنْفَيْنِ: أ – دَوافِعُ نَقْص... ب– دَوافِعُ الغَزارة»"
          source: "المعجم الكبير"
          addition: "يُصنّف الدوافع إلى نقص وغزارة ويميّزها عن الحافز والباعث — تفصيل مفهومي غائب عن تعريف المجموعة الحالي"
        - text: "«حافز يثير ردود فعل، إلا أنه يمثّل علامة يتم تشفيرها على أساس عرف تاريخي واجتماعي»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُضيف البُعد الاجتماعي-التاريخي للدافع بوصفه علامة ثقافية مشفَّرة"
      peripheral_observations:
        - "«مِن الشَّاءِ والنُّوقِ: التى تَدْفَعُ اللَّبَنَ على رأس وَلَدِها لكَثْرَتِه» — المعجم الكبير: معنى مستقل خاص بالنوق الدوافع؛ لا صلة له بالمفهوم النفسي"

    - lemma: "دافعية"
      confirm:
        - text: "«دَافِعِيَّةٌ» (translation_en: motivation)"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية (2020)"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "باعث"
      source_section: "step4_fts_keyword"
      evidence_citation: "«وقد اصطُلِحَ على إطلاقِ لفظِ الحافزِ على الدَّافِعِ الخاصِّ بالإنسانِ ولفظِ \"الباعث\" على الدَّافِعِ الصَّادرِ عن المَوْقِفِ» — المعجم الكبير؛ «باعث» (translation_en: motive) — المعجم الموحد لمصطلحات القانون (2017)؛ «باعث» (translation_en: mobile) — مسرد الفلسفة وعلم النفس"
      justification: "اسم فاعل من الجذر ب-ع-ث (اشتقاق)؛ مصطلح فلسفي ونفسي وقانوني راسخ يدل على الدافع المحرّك للفعل الإرادي؛ يرد مرادفاً لـ motive في سياقات متعددة"
  knowledge_candidates:
    - lemma: "حاجة"
      justification: "اسم من الجذر ح-و-ج (اشتقاق)؛ مقابل عربي أصيل لـ need في OEWN lemmas؛ يُثبَّت في مسرد الفلسفة وعلم النفس (حاجة = need)؛ في علم النفس الإنساني (سُلَّم ماسلو) تمثّل الحاجة الدافع الأساسي للسلوك"
  generation_notes: "المفهوم المحوري هو السمة النفسية المحرّكة للسلوك؛ الكلمات المرجعية: باعث (للدافع الفلسفي/الإرادي)، وحاجة (لمصدر الدافعية في النظريات الإنسانية)"


step1_lemma_validation:
  per_lemma:

    - lemma: "حافز"
      decision: confirmed
      decision_reason: "الدليل النفسي في المعجم الكبير (drive: نشاط داخلي في الكائن الحي) يؤكد المعنى المقصود؛ التناقضات ناتجة عن تعدد الاستعمال (catalyst/incentive) لا عن تعارض مفهومي جوهري مع الدلالة النفسية"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: pass
      nuance_differentiation: "يتميز عن «دافع» بميله نحو التحفيز الإيجابي والإثارة من الخارج أو من الداخل بطابع نشيط؛ أكثر استعمالاً في السياقين الاقتصادي والتربوي بمعنى incentive. يتميز عن «دافعية» في كونه الوحدة التحفيزية الفردية المحددة لا الخاصية النفسية الكلية"
      example: "أسهمت بيئة العمل المحفِّزة في تعزيز الحافز الإبداعي لدى الموظفين وتنمية روح الابتكار."

    - lemma: "دافع"
      decision: confirmed
      decision_reason: "أدلة معجمية قوية متعددة المصادر (معجم كبير + مسرد التربية + معجم طبي) تؤكد المعنى النفسي المحرّك تأكيداً دقيقاً؛ التناقض مع payer ناتج عن اشتراك لفظي لا تداخل دلالي حقيقي مع مفهوم المجموعة"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: pass
      nuance_differentiation: "أوسع استعمالاً وأشمل دلالةً من «حافز»؛ يدل على القوة الداخلية المحركة بصورة عامة دون تخصيص إيجابي؛ يشمل الدوافع السلبية والإيجابية معاً. يتميز عن «دافعية» في كونه الدافع الفردي المحدد (motive) لا مجموع الدوافع كظاهرة (motivation)"
      example: "كان حبُّ الاستطلاع دافعًا راسخًا يدفعه إلى مواصلة البحث والتقصّي في زوايا المسألة كافة."

    - lemma: "دافعية"
      decision: confirmed
      decision_reason: "مصدر صناعي (-ية) ذو إنتاجية اشتقاقية عالية؛ يختص بالمفهوم المجرد الكلي (motivation كظاهرة نفسية) مقابل الدافع الفردي؛ مثبَّت في المعجم المتخصص بالحكامة التربوية"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: pass
      nuance_differentiation: "يمثل الخاصية النفسية الكلية (motivation كظاهرة وسمة) مقابل «دافع» الذي يمثل الدافع الفردي المحدد (motive)؛ يسمح بتوليد الوصف (دافعي) والمركبات (الدافعية الذاتية، الدافعية الداخلية) — وهو أكثر اشتقاقية من المفردتين الأخريين"
      example: "تستهدف المناهج الحديثة تعزيز الدافعية الذاتية لدى المتعلمين وتنمية الرغبة في التعلم المستمر."

    - lemma: "باعث"
      source: step05
      decision: removed
      decision_reason: "المعجم الكبير يميّز «الباعث» تمييزاً صريحاً عن «الدافع» و«الحافز» كمصطلح مستقل يدل على دافع الموقف الخارجي؛ إدراجه مرادفاً في المجموعة يُعدّ خلطاً دلالياً — يستحق مجموعة ترادفية مستقلة أو إدراجه كعلاقة دلالية قريبة"
      step05_citation: "«وقد اصطُلِحَ على إطلاقِ لفظِ الحافزِ على الدَّافِعِ الخاصِّ بالإنسانِ ولفظِ \"الباعث\" على الدَّافِعِ الصَّادرِ عن المَوْقِفِ» — المعجم الكبير"

    - lemma: "حاجة"
      source: step05
      decision: removed
      decision_reason: "«حاجة» بمعنى need تدل على حالة الافتقار والضرورة، وهي مصدر الدافع وليست الدافع نفسه؛ لا تتوافق مع تعريف المجموعة الذي يدل على السمة النفسية المحرّكة — لو أضفناها لأنشأنا خلطاً بين cause والظاهرة النفسية"
      step05_citation: "«حاجة» (translation_en: need) — مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"


step3_definition:
  definition_review_flag: false
  current_definition: "السمة النفسية التي تثير الكائن الحي للقيام بفعل نحو هدف منشود؛ سبب الفعل"
  assessment:
    decision: retain
    reason: "التعريف دقيق ومتوافق مع أدلة المعاجم — الجنس القريب (السمة النفسية) والفصل المميّز (تثير الكائن الحي نحو هدف منشود) كلاهما حاضران؛ يتطابق مع تعريف motivation/motive في علم النفس؛ لا تناقض بينه وبين الأدلة المؤكِّدة القوية لـ«دافع» و«دافعية»"


