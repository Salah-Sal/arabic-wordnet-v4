step0_evidence:
  per_lemma:

    - lemma: خزان
      expands:
        - text: "«مجمع الماء قلّ أو كثر»"
          source: المعجم الوسيط
          addition: يُثبت وظيفة الاحتواء والتجميع دلالةً أساسية — الاستعمال الوبائي امتداد مجازي من التخزين المادي إلى الاحتضان البيولوجي للعوامل المعدية
        - text: "«خَزَّانُ التَّراكُم (في الجيولوجيا): الخَزَّانُ المستعملُ في تجميع السوائل»"
          source: المعجم الكبير
          addition: يُثبت الاستعمال الفني للكلمة في تجميع مواد — يُمهّد بالقياس للاستعمال في الوبائيات لوصف ما يتراكم فيه العامل المعدي ويُجمَع
        - text: "«يستعمل أحياناً بمفهوم موقع تراكم المخزون الطبيعي من البترول/الغاز»"
          source: المعجم الموحد لمصطلحات الطاقة المتجددة (1996)
          addition: تراكم مادة في وسط حاوٍ — يُوازي تراكم العامل المعدي في الخزان البيولوجي

    - lemma: مستودع
      confirm:
        - text: "«شخص أو حيوان أو مصل أو مادة تسمح للعامل الممرض فرصة البقاء والتكاثر ضمنها، ثم تسهل انتقاله إلى ثوي يمكن إصابته بالعدوى»"
          source: المعجم الموحد لمصطلحات علم الصيدلة (2009)
        - text: "«مُضِيفٌ مُسْتَودَع (مُسْتَوْدَع)» [مقابل: reservoir host (reservoir)]"
          source: المعجم الطبي الموحد (2009)
      expands:
        - text: "«الشيء المجعول في قرار كالولد الذي في بطن أمه، والنطفة التي في الظهر»"
          source: التوقيف على مهمات التعاريف للمناوي
          addition: يُثبت كلاسيكياً معنى الإيداع الداخلي لشيء حيّ أو أصيل محفوظ داخل كيان — يمتدّ إلى احتضان العامل المعدي وصونه ضمن الكائن الحيّ أو المادة
        - text: "«مكان الوديعة»"
          source: المعجم الوسيط
          addition: الوديعة = شيء مؤتمَن على حفظه؛ يُقارب مفهوم «أمانة» العامل المعدي في البيئة الحاوية

    - lemma: مصدر
      confirm:
        - text: "«ما يَصدُر عنه الشيءُ، ويستمدُّ منه»"
          source: المعجم الكبير
        - text: "«ما يصدر عنه الشيء»"
          source: المعجم الوسيط
      contradicts:
        - text: "«صِيغةٌ اسمية تدلُّ على حدثٍ مجرَّد من الزمان (في علم الصرف)»"
          source: المعجم الكبير
          conflict: الدلالة الصرفية السائدة في المعاجم تُضعف الوضوح الدلالي لمصدر في السياق الطبي الوبائي — احتمال التباس مع المصطلح النحوي
      peripheral_observations:
        - المصدر بمعناه النحوي (اسم الحدث المشتق من الفعل) حاضر في أغلب المعاجم الكلاسيكية — دلالة مستقلة تماماً عن تعريف المجموعة
        - مَصْدَرٌ = اسم من أسماء جمادى الأولى (المعجم الكبير) — اسم علَم لا صلة له بالمجموعة

step05_lemma_generation:
  evidence_candidates:
    - lemma: مُضيف
      source_section: step4_fts_keyword
      evidence_citation: "«مُضيف نهائي: المضيف الذي يتكاثر فيه الطفيليّ تكاثراً جنسياً» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
      justification: اسم فاعل من ض-ي-ف؛ يُقابل host في المعجم الطبي؛ التعريف يتضمن التكاثر داخل كيان حيّ مما يتقاطع جزئياً مع «يعيش فيه عامل معدٍ ويتكاثر»؛ آلية التوليد: اشتقاق
  knowledge_candidates:
    - lemma: حاضن
      justification: اسم فاعل من ح-ض-ن (يحتضن = يحفظ في حضنه)؛ الطائر يحضن بيضه إذ يحفظه دافئاً داخله — مشابهة وظيفية مع الكيان الذي يحتضن العامل المعدي داخله؛ آلية التوليد: مجاز (مشابهة وظيفية: الاحتضان الداخلي)
  generation_notes: >
    التعريف يصف خزان العدوى (reservoir of infection) بمعناه الوبائي الدقيق؛
    الأدلة المعجمية لا تكشف مصطلحاً عربياً جديداً خارج الأسماء الموجودة في المجموعة —
    المصطلحات الموجودة (خزان ومستودع) مُتجذِّرة في المعجمية الطبية العربية

step1_lemma_validation:
  per_lemma:

    - lemma: خزان
      decision: confirmed
      decision_reason: >
        الأدلة تُثبت وظيفة الاحتواء والتجميع (expands)؛ استعمال خزان مقابل reservoir في البيولوجيا مُثبَت في ARABTERM (علم الأحياء 1993)؛
        الاستعمال الوبائي calque مقبول لانعدام بديل عربي أرسخ في الاستعمال لهذا المجال تحديداً؛
        الاطّراد وسط المتخصصين ✓؛ يُسر التداول ✓؛ الملاءمة تقريبية (المعنى الأصلي مادي لا حيوي) ~؛
        إيثار التراثي: مستودع أوثق صلةً بالمعنى الوبائي الدقيق لكن خزان مستعمَل موازٍ؛
        إيثار العربي ✓؛ الاشتقاقية: يُخَزَّن، تخزين، خِزانة ✓؛
        الوزن الصرفي فَعَّال — مناسب لدلالة الوعاء الكبير الحاوي
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: >
        خزان يُركّز على بُعد الاحتواء الجسدي والسعة التخزينية؛
        يُشير إلى الجانب المادي (مجمع ووعاء) أكثر من الجانب الحيوي (علاقة الاحتضان)؛
        يُستعمل غالباً في تركيب «خزان العدوى» لا مفرداً في الاستعمال الوبائي؛
        يتميّز عن مستودع بأن دلالته أقل صلةً بالاحتضان الوبائي الدقيق، وعن مصدر بأنه يفيد الاحتواء لا الانبثاق والأصل
      example: "يُعَدّ الخفّاش خزاناً طبيعياً للعديد من الفيروسات المعدية كفيروس إيبولا، إذ يحملها دون أن تُفضي إلى مرض ظاهر فيه"

    - lemma: مستودع
      decision: confirmed
      decision_reason: >
        أدلة مؤكِّدة مباشرة من معجم طبي متخصص (الصيدلة 2009) بتعريف يطابق تعريف المجموعة تطابقاً شبه تام؛
        المعجم الطبي الموحد (2009) يُثبت الاستعمال الرسمي مقابلاً لـreservoir؛
        بوابة الجودة: جميع المعايير الست مستوفاة — الاطّراد ✓، يُسر التداول ✓، الملاءمة ✓، إيثار التراثي ✓، إيثار العربي ✓، الاشتقاقية: يُودِع/وُدِع/إيداع/وديعة ✓؛
        الوزن الصرفي مُستَفْعَل — اسم مكان/شيء لفعل الاستيداع، مناسب تماماً للدلالة على وعاء الاحتضان
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: >
        مستودع يُركّز على مفهوم الأمانة والإيداع الحيوي — العامل المعدي «مودَع» داخل الكيان محفوظاً ومُتكاثِراً؛
        يُعبّر عن الاحتضان الوبائي الدقيق (البقاء والتكاثر معاً) لا مجرد التخزين أو الاحتواء المادي؛
        هو المصطلح الطبي الرسمي الأدق في المعجمية العربية من بين لمّات المجموعة؛
        يتميّز عن خزان بالعمق الحيوي-الوبائي، وعن مصدر بأنه يُعبّر عن الاحتضان لا الانبثاق
      example: "يُعَدّ الجِرذ مستودعاً رئيساً لبكتيريا اليرسينيا، إذ تعيش وتتكاثر في جسمه دون أن يُصاب بمرض يُذكر"

    - lemma: مصدر
      decision: escalated
      decision_reason: >
        مصدر يُقابل OEWN lemma «source» لا «reservoir»؛
        التمييز الوبائي بين مصدر العدوى (موضع اكتساب العدوى) وخزان العدوى (موضع بقاء العامل وتكاثره) ذو أهمية علمية جوهرية — دمجهما في مجموعة واحدة يُضعف الدقة الدلالية؛
        مصدر أعمّ دلالةً: كل خزان مصدر محتمل، وليس كل مصدر خزاناً بيولوجياً؛
        يحتاج مراجعاً بشرياً ليحسم: هل يبقى مصدر في هذا الsynset أم يُنقل إلى مجموعة «source of infection» مستقلة؟
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: >
        مصدر يُعبّر عن الانبثاق والاستمداد والأصل (ما يصدر عنه الشيء)؛
        يُركّز على نقطة الانطلاق لا على الاحتضان والتكاثر؛
        يتميّز عن مستودع بأنه أعمّ وأشمل (يشمل مصادر العدوى المتعددة لا الخزان البيولوجي الدقيق)؛
        يتميّز عن خزان بأنه يُعبّر عن الصدور والانطلاق لا عن الاحتواء والتخزين

    - lemma: مُضيف
      source: step05
      decision: removed
      decision_reason: >
        مُضيف = host في المعجم الطبي — يُعبّر عن العلاقة النشطة بين الطفيل والكيان المضيف؛
        المستودع الوبائي لا يشترط وجود علاقة طفيلية أو إصابة بمرض في الكيان الحاوي؛
        فشل اختبار التثبيت المعجمي: مُضيف لا يُستعمل مرادفاً لـreservoir في الوبائيات العربية؛
        مفهومان متداخلان لا مترادفان
      step05_citation: "«مُضيف نهائي: المضيف الذي يتكاثر فيه الطفيليّ تكاثراً جنسياً» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
      substitution_test:
        result: fail
      nuance_differentiation: >
        مُضيف يُعبّر عن علاقة نشطة (المضيف يُغذّي الطفيل ويحمله)؛
        المستودع قد لا يُصاب بأي أذى من العامل المعدي (مثل الخفّاش مع إيبولا)؛
        الفصل المفاهيمي بين host وreservoir في الوبائيات مستقرّ علمياً

    - lemma: حاضن
      source: step05
      decision: removed
      decision_reason: >
        لم يَرِد حاضن مصطلحاً طبياً لخزان العدوى في أي مصدر معجمي متخصص مُراجَع؛
        فشل اختبار التثبيت المعجمي: الكلمة قائمة بمعنى «طائر يحضن بيضه» أو «مُرَبٍّ للصبي» لا بمعنى وبائي؛
        إضافتها اجتهاد اشتقاقي غير مُسكوك في الاستعمال الطبي التخصصي العربي المعاصر
      step05_citation: "«الطائر المُرخِم على بيضه، المُوَكَّل بالصبي يحفظه ويُرَبِّيه» — المعجم الكبير"
      substitution_test:
        result: fail
      nuance_differentiation: >
        حاضن يُعبّر عن رعاية ودفء وحماية (حضانة الأبناء أو البيض)؛
        لا يُقابل الدلالة الوبائية التقنية المحددة لـreservoir في الاستعمال الطبي العربي

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "أي شيء (شخص أو حيوان أو نبات أو مادة) يعيش فيه عامل معدٍ ويتكاثر عادة"
  assessment:
    decision: retain
    reason: >
      التعريف دقيق تقنياً ومطابق للمصطلحين المؤكَّدَين (خزان ومستودع) تمام المطابقة؛
      يُصوِّر المفهوم الوبائي الدقيق لـreservoir of infection (البقاء والتكاثر معاً)؛
      إشكالية مصدر مُعالَجة بالتصعيد في الخطوة ١ — الحاجة إلى المراجعة تتعلق بانتماء مصدر إلى هذا التعريف لا بصياغة التعريف ذاتها؛
      التعريف الحالي لا يحتاج تعديلاً للمصطلحين المؤكَّدَين

