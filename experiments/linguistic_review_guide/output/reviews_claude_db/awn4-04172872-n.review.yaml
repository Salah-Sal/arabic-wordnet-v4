step0_evidence:
  per_lemma:

    - lemma: "مصدر أمان"
      # اللمّة مركّبة (مضاف + مضاف إليه) — لم تُوجَد كمدخل مستقل في أي معجم.
      # الأدلة أدناه مستخلصة من مدخلَي المكوِّنَين (مصدر / أمان) منفصلَين.
      confirm:
        - text: "«الأمان: اطمئنان النّفس وزوال الخوف، لِعَدَم توقُّع مكروه»"
          source: "المعجم الكبير"
        - text: "«الأمَان: إِزَالَة الْخَوْف»"
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "«المَصْدَرُ: ما يَصْدُرُ عنه الشيءُ ويستمدُّ منه»"
          source: "المعجم الكبير"
          addition: "يوسّع المفهوم نحو الأصل والمنبع — بينما تعريف المجموعة يحدّد «أي شيء يُستخدَم» لا «أصل الأمان»"
        - text: "«المصدر: ما يصدر عنه الشيء»"
          source: "المعجم الوسيط"
          addition: "المصدر يدل على منشأ الشيء، وليس الشيء المستخدَم ذاته"
      peripheral_observations:
        - "«المَصْدَرُ» في مداخل المعاجم يُطغى عليه المعنى الصرفي (اسم الحدث) — وهو معنى مستقل تماماً لا علاقة له بتعريف المجموعة"

    - lemma: "ملاذ نفسي"
      # اللمّة مركّبة (اسم + نعت) — لم تُوجَد كمدخل مستقل في أي معجم.
      # الأدلة مستخلصة من مدخل (ملاذ) المفرد؛ «نفسي» لم يُوجَد مستقلاً.
      expands:
        - text: "«الملاذ: الملجأ والحصن»"
          source: "المعجم الوسيط"
          addition: "يوسّع المفهوم نحو المكان المحصَّن الذي يُلجأ إليه — في حين يتحدث تعريف المجموعة عن «شيء يُستخدَم» لا عن ملجأ أو مكان"
        - text: "«(الملاذ) الملجأ والحصن»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "دلالة الملاذ على الحصانة والمكان المانع تخالف الطابع الشيئي الوظيفي للمفهوم"


step05_lemma_generation:
  # المُدخل: synset_info_masked.yaml (بدون لمّات) + استعلامات قاعدة البيانات
  # التعريف: أي شيء يستخدمه الشخص البالغ للحد من القلق والتوتر
  # المُشتمِل: شيء — POS: noun

  evidence_candidates:
    - lemma: "بطانية الأمن"
      source_section: step5_english_bridge
      evidence_citation: "«بَطَّانِيَّةُ الأَمْن» ← security blanket — المعجم الطبي الموحد (2009)"
      justification: >
        المقابل العربي الرسمي المسجَّل في المعجم الطبي الموحد لمصطلح security blanket؛
        تركيب إضافي (بطانية + الأمن) يُجسّد المفهوم النفسي بتصوير الغطاء الذي يوفّر الأمان.
        الآلية: تركيب إضافي — نقل للهيكل الاستعاري الأجنبي (security → أمن، blanket → بطانية)
        مع ملء القوالب بالعربية (اقتراض مفهومي/calque مستقر).

  knowledge_candidates:
    - lemma: "عُكَّاز نفسي"
      justification: >
        تعبير اصطلاحي دارج في الخطاب النفسي العربي المعاصر يدل على أي شيء يعتمد عليه
        الشخص للتخفيف من القلق بشكل آلي؛ آلية التوليد: تركيب إضافي (عُكَّاز + نفسي)
        بمجاز وظيفي — العُكَّاز (أداة الدعم الجسدي) مُوسَّع إلى دعم الإسناد النفسي.
        المُشكِلة: «عُكَّاز نفسي» وصف حرّ أكثر منه مصطلح مسكوك.

  generation_notes: >
    المفهوم نفسي بامتياز؛ المصطلح الأكثر استقراراً في المراجع الطبية العربية هو «بطانية الأمن».
    «عُكَّاز نفسي» شائع في المحادثات الإعلامية العربية لكنه لم يُثبَّت في معجم طبي معتمد.
    لم يُنتج التعريبُ مرشّحاً لأن المفهوم وصلَ عبر الترجمة لا عبر التعريب الصوتي.


step1_lemma_validation:
  per_lemma:

    # ── اللمّة الأصلية ١: مصدر أمان — محذوفة ──
    - lemma: "مصدر أمان"
      decision: removed
      decision_reason: "تركيب إضافي وصفي حر — يفشل اختبار السكّ ولا سند له كمصطلح مستقر"
      evidence_assessment:
        case: expands
        notes:
          - "الأدلة تخصّ المكوّنَين منفردَين لا الوحدة المركّبة"
          - "مصدر الأمان يدل على منشأ الأمان لا على الشيء المُستخدَم ذاته"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
        failure_sentences:
          - original: "تُعدّ موسيقاه المفضلة مصدرَ أمانٍ له في أوقات التوتر"
            substituted: "تُعدّ موسيقاه المفضلة مصدرَ طمأنينةٍ له في أوقات التوتر"
            preserved_meaning: true
            why_failed: "إمكانية إبدال «أمان» بـ«طمأنينة» و«راحة» تكشف أن التركيب وصفي حر غير مقيَّد"
      nuance_differentiation: >
        يُركّز على «المصدر» (الأصل/المنبع) وهو أعم وأشمل من دلالة المصطلح النفسي —
        security blanket ليس «مصدر الأمان» بل «الشيء المستخدَم لتحقيق الأمان».
        الفارق الجوهري: إطار الإنتاج (مصدر) مقابل إطار الاستعمال الوظيفي (وسيلة/أداة).
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── اللمّة الأصلية ٢: ملاذ نفسي — محذوفة ──
    - lemma: "ملاذ نفسي"
      decision: removed
      decision_reason: "تركيب وصفي حر — يُخالف المدلول الفعلي للمفهوم ويفشل اختبار السكّ"
      evidence_assessment:
        case: expands
        notes:
          - "الملاذ يدل على مكان/كيان يُلجأ إليه — لا على شيء يُستخدَم لتخفيف القلق"
          - "الإطار الدلالي لـ«ملاذ» (refuge/haven) يخالف الإطار الوظيفي لـsecurity blanket"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
        failure_sentences:
          - original: "الكتاب ملاذه النفسي حين يشعر بالضيق"
            substituted: "الكتاب ملجؤه النفسي حين يشعر بالضيق"
            preserved_meaning: true
            why_failed: "«ملاذ» قابل للإبدال بـ«ملجأ» و«مأوى» بلا خسارة دلالية — التركيب وصفي حر"
      nuance_differentiation: >
        يُركّز على إطار الهروب والاحتماء (escape frame) في حين security blanket
        يُركّز على إطار الارتباط والطمأنة (attachment/comfort frame).
        «ملاذ» يستلزم حاجة ماسّة وطارئة، بينما بطانية الأمن ظاهرة نفسية اعتيادية.
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح من الخطوة ٠٫٥: بطانية الأمن — مقبول ──
    - lemma: "بطانية الأمن"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح طبي مستقر في المعجم الطبي الموحد (2009) — مقابل مسجَّل لـsecurity blanket"
      step05_citation: "«بَطَّانِيَّةُ الأَمْن» ← security blanket — المعجم الطبي الموحد (2009)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: >
        يُعيد توظيف «البطانية» (الغطاء الجسدي) كاستعارة للشيء الذي يُضفي الدفء النفسي
        والأمان على صاحبه — مُميِّزاً المفهومَ عن «الملاذ» (مكان الاحتماء) وعن «مصدر الأمان»
        (منبع الشعور بالأمان). البطانية تُشير بدقة إلى الغرض الشخصي المألوف الذي يُستخدَم
        آلياً لتخفيف القلق، مع الإيحاء بالدفء والحميمية المرتبطَين بالطفولة.
      loan_check:
        literal_translation: true
        assessment: >
          الكلق (calque): «security» → «الأمن» و«blanket» → «بطانية» — ترجمة حرفية
          لكنها مقبولة لأن الهيكل الاستعاري واضح ومُتناظر مع المصطلح الإنجليزي،
          والمدلول العلمي محفوظ تماماً في الترجمة العربية.
      quality_gate:
        derivability: "الجذر ب-ط-ن يسمح بالاشتقاق (بطانة، مبطَّن)؛ التركيب كوحدة معجمية جامد نسبياً"
        terminological_fit: "مسجَّل في معجم طبي معتمد — اطّراد الاستعمال عند المتخصصين"
        passed: true
      morphological_fit: >
        التركيب الإضافي «بطانية الأمن» وزنه مقبول (اسم + مضاف إليه محلّى بـال) —
        قياسي في المصطلحات الطبية العربية المركّبة.
      example: "لجأت إلى سماعاتها اللاسلكية كبطانية أمن تُهدّئ من روعها قبيل اجتماعات العمل الكبرى."
      actions:
        - command: create_entry
          params:
            lemma: "بطانية الأمن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04172872-n"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "بطانية الأمن"
      reason: "المصطلح الطبي المستقر في المعجم الطبي الموحد (2009) كمقابل لـsecurity blanket"
