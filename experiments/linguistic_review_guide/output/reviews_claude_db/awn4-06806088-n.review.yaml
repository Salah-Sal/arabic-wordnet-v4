step0_evidence:
  per_lemma:

    - lemma: "إعلان"
      confirm:
        - text: "«(الإعلان) إِظْهَار الشَّيْء بالنشر عَنهُ فِي الصُّحُف وَنَحْوهَا (محدثة)»"
          source: "المعجم الوسيط"
      expands:
        - text: "«إخبار العموم أو فئة مخصوصة بنشاط أو حدث»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يوسِّع المفهوم من العرض المرئي الثابت إلى الإخبار العام بحدث أو نشاط — مما يُدخله في دلالة الإشعار والخبر لا اللافتة المادية"
        - text: "«يكون الإعلان في صفحات ويب على شكل مساحة مستطيلة الشكل، ذات عدد محدد من البيكسلات، أو صورة، محدودة الحجم. وغالباً ما يكون متحركاً»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          addition: "توسيع رقمي إلى سياق إعلانات الويب — بُعد تقني مستقل عن مفهوم اللافتة المادية الثابتة"
      peripheral_observations:
        - "ArabTerm: إعلان = advertisement, announcement, proclamation, publicity — مقابلات إنجليزية أوسع بكثير من sign، تشمل الدعاية التجارية والتصريح الرسمي والإخبار العام؛ وهذا الطيف الدلالي الواسع يُشير إلى أن «إعلان» ينتمي أساساً إلى حقل الاتصال المجرد لا الكيان المادي"

    - lemma: "لافتة"
      confirm:
        - text: "«(اللافتة) لوحة من خشب وَنَحْوه يكْتب عَلَيْهَا اسْم أَو شعار لتوجيه النّظر إِلَيْهِ (ج) لوافت (محدثة)»"
          source: "المعجم الوسيط"
      expands:
        - text: "«منطقة من صفحة موقع على الشبكة الدولية تستعمل عادة للإعلانات الإشهارية»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          addition: "توسيع رقمي إلى مفهوم banner الإلكتروني — اللافتة الشبكية الإشهارية"
        - text: "«مقطعٌ من صفحةِ Web يتضمن إعلانات، ويكُون طولُه عادةً أقصرَ من إنش، وله عرضُ صفحةِ Web. تحوي اللافتةُ وصلةً إلى صفحةِ موقعِ صاحبِ الإعلان»"
          source: "معجم مصطلحات المعلوماتية"
          addition: "تفصيل تقني في البُعد الرقمي — لافتة الويب بمواصفات محددة (banner)"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "يافطة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«يافطة [مفرد]: ج يافطات: لافتة للدعاية والإعلان، لوحة من خشب أو معدن أو نحوهما يُكتب عليها اسم أو شعار لتوجيه النظر إليه» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      justification: "مرادف موثَّق في المعاجم الحديثة للكيان المادي المقصود — دلالته متطابقة مع التعريف (عرض عام لرسالة عبر لوحة منصوبة)"
    - lemma: "لوحة إعلانية"
      source_section: "step5_english_bridge"
      evidence_citation: "«لوحة إعلانيّة» — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)، ترجمة: hoarding"
      justification: "مركب وصفي مسجَّل في ArabTerm كمقابل عربي لـ hoarding؛ يدل على لوحة إعلانات كبيرة في الفضاء العام، وهو نوع من العرض العام لرسالة"
  knowledge_candidates:
    - lemma: "لوحة"
      justification: "اشتقاق من الجذر ل-و-ح (الظهور والبريق)؛ يُستخدم في التركيب الوصفي للدلالة على سطح مكتوب أو مُعلَن عليه (لوحة الطريق، لوحة إرشادية، لوحة تعريفية). آلية التوليد: اشتقاق — «اللَّوح» في أصل المعنى كل صفيحة أو سطح قابل للكتابة، ومنه جاءت «اللوحة» كوحدة معجمية"
  generation_notes: "المفهوم مادي — يدل على كيان منصوب أو معلَّق يحمل نصاً للعموم. الجذران الأكثر ملاءمة: ل-ف-ت (جلب الانتباه) وع-ل-ن (الإظهار العلني)؛ و«يافطة» هي المرادف الأقرب الموثَّق خارج اللمّات المعروفة"


step1_lemma_validation:
  per_lemma:

    - lemma: "إعلان"
      decision: escalated
      decision_reason: "المعنى الأساسي لـ«إعلان» في المعجمية العربية الحديثة يُحيل إلى الإخبار العام أو الإعلان التجاري (advertisement/announcement) — مفهوم اتصالي أو وسيط إعلامي. هذه المجموعة تختص بـ«العرض المادي الثابت لرسالة» (لافتة). الأدلة توسّعية لا مؤكِّدة، والوزن الصرفي (إفعال = مصدر فعل) يُرسِّخ البُعد الإجرائي/المجرد لا الكياني المادي. يحتاج مراجعة بشرية"
      evidence_assessment:
        case: expands
        notes:
          - "المعجم الوسيط: «إظهار الشيء بالنشر في الصحف ونحوها» — يُبرز الوسيط الإعلامي، لا الكيان المادي المنصوب"
          - "ArabTerm: إعلان = advertisement, announcement, proclamation, publicity — طيف أوسع من sign"
      substitution_test:
        result: fail
        failure_sentences:
          - original: "علّقوا لافتةً تُبيِّن ساعات العمل على واجهة المتجر"
            substituted: "علّقوا إعلاناً تُبيِّن ساعات العمل على واجهة المتجر"
            preserved_meaning: false
            why_failed: "«إعلان» في هذا السياق يُفهَم كنشرة إعلانية ورقية أو مطبوعة تجارية لا كلافتة إرشادية ثابتة؛ الجملة المُبدَّلة مُلتبسة دلالياً"
      nuance_differentiation: "«إعلان» يُركِّز على فعل الإبلاغ ومضمونه الخبري أو التجاري، وقد يكون مسموعاً أو في وسائل الإعلام — إنه المحتوى الإخباري لا الكيان المادي. «لافتة» تختص بالكيان الجسدي المنصوب للعرض الثابت في المكان العام. الفارق: مجرَّد/إجرائي ↔ مادي/مكاني"
      actions:
        - command: set_confidence
          params:
            entity_type: sense
            entity_id: "{auto}"
            score: 0.3

    - lemma: "لافتة"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة مباشرة من المعجم الوسيط — التعريف المعجمي يتطابق تطابقاً تاماً مع مفهوم المجموعة: لوحة مادية تُعلَّق في مكان عام لتوجيه النظر وإيصال رسالة للعموم"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "«لافتة» أخصّ من «إعلان» — تختص بالكيان المادي الثابت (لوحة/صفيحة) المعلَّق في مكان عام. اسم فاعل من «لفت» (جلب الانتباه)، مما يُضيف دلالة استقطاب الأنظار إلى جانب حمل الرسالة. تتمايز عن «إعلان» بثلاثة أبعاد: (١) مادية الكيان، (٢) ثبات الموضع، (٣) وظيفة الإرشاد لا الترويج بالضرورة"
      example: "علّقت البلديةُ لافتاتٍ إرشاديةً عند مداخل المدينة تُوجِّه الزوارَ إلى مواقف السيارات والمرافق العامة."

    - lemma: "يافطة"
      source: step05
      decision: removed
      decision_reason: "معجم الصواب اللغوي يُصنِّفها «مرفوضة عند الأكثرين» وإن قبل الاستعمال «مقبولاً» — دون درجة الفصاحة المطلوبة. لا جذر عربي أصيل موثَّق (اللفظ ذو أصل غير عربي محتمل)، مما يُخلّ بمعيار الاشتقاقية ولا يُتيح بناء أسرة صرفية. المصطلح الفصيح «لافتة» يُغني عنها"
      step05_citation: "«يافطة [مفرد]: ج يافطات: لافتة للدعاية والإعلان، لوحة من خشب أو معدن أو نحوهما يُكتب عليها اسم أو شعار لتوجيه النظر إليه» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"

    - lemma: "لوحة إعلانية"
      source: step05
      decision: removed
      decision_reason: "تُترجم «hoarding» (لوحة إعلانية ضخمة خارجية) وهو مفهوم أضيق من «sign» العام. تفشل اختبار السكّ: يمكن إبدال «إعلانية» بـ«دعائية» أو «ترويجية» دون فقدان المعنى الوصفي، مما يكشف أنها تركيب وصفي حر لا وحدة معجمية مسكوكة ثابتة"
      step05_citation: "«لوحة إعلانيّة» — مسرد الإعلام والتواصل (ALECSO)، ترجمة: hoarding"

    - lemma: "لوحة"
      source: step05
      decision: removed
      decision_reason: "لفظ عام يدل على أشكال متعددة (لوحة فنية، لوحة مفاتيح، لوحة بيانات، لوحة تحكم) — لا يختص بمفهوم المجموعة دون موصوف. يفشل اختبار السكّ: «لوحة» مجردةً لا تُحيل إلى «العرض العام لرسالة» في السياق المباشر"
      step05_citation: "لا دليل معجمي يقيِّد «لوحة» بمعنى sign — اقتراح من المعرفة اللغوية بآلية اشتقاق/تركيب"

  synset_flags:
    definition_review_needed: true


