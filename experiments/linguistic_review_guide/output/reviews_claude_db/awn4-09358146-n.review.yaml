        - text: "«أرضٌ أَريضةٌ، أي زكيةٌ، بيّنة الأَراضَة. وقد أَرُضَتْ بالضم، أي زَكَتْ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
