        - text: "«[أرض] الارض مؤنثة وهى اسم جنس... وكل ما سفل فهو أرض»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          conflict: "أرض تشمل قاع البحر والسهل والصخر والجبل — غير محصورة في الطبقة العليا من التربة"
