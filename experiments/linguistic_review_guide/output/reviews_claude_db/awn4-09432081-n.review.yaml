step0_evidence:
  per_lemma:

    - lemma: "خيط"
      confirm:
        - text: "«الخَيْطُ: السِّلْكُ، وجمعه خُيُوطٌ وخُيُوطةٌ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«الخَيْطُ: السِّلْكُ — وجمعه أخياط وخيوط وخيوطة»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«السلكُ يُخاط به، أو ينظم فيه الشيء، أو يربط به»"
          source: "المعجم الوسيط"
        - text: "«ما يُخاطُ به من قُطْنٍ أو حَرِيرٍ — ما يُنْظَمُ فيه الشَّيءُ، أو يُرْبَطُ به»"
          source: "المعجم الكبير"
        - text: "«(خَيَطَ) الخاء والياء والطاء أصل واحد يدل على امتداد الشيء في دقة — فالخيط معروف»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«خيط: الخَيْطُ: السِّلك، والجمع أَخياطٌ وخُيوطٌ وخُيوطةٌ»"
          source: "لسان العرب لابن منظور"
        - text: "«الخَيط السلك يُستعمل في رَفْوِ الجروح — سلك رفيع»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      expands:
        - text: "«الخَيْطُ الأبيضُ والأسودُ: بياضُ الصُّبحِ وسَوادُ الليلِ»"
          source: "المعجم الوسيط"
          addition: "استعمال مجازي — ضوء الفجر وظلمة الليل يُشبَّهان بخيط ممدود في الأفق؛ خارج نطاق 'الجسم المادي الطويل'"
        - text: "«الجَماعَةُ من النَّعامِ والبَقَرِ والجَرادِ»"
          source: "المعجم الكبير"
          addition: "معنى مجازي مستقل — الجماعة المتتابعة تُشبَّه بالخيط المنسدل؛ مفهوم مستقل لا صلة له بالجسم الرفيع"
        - text: "«خَيْطُ الرَّقَبة: نُخاعُها»"
          source: "المعجم الوسيط"
          addition: "معنى تشريحي — تسمية النخاع الشوكي بالشبه الشكلي مع الخيط الممدود"
        - text: "«خيط من ذهب أو فضة أو نحوهما — thread (of gold or silver)»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "تخصيص دلالي بمادة معيّنة — خيط المعدن النفيس نوع أخص من الخيط المطلق"
      peripheral_observations:
        - "المعاجم التقنية تستخدم خيط بمعنى filament في الطب والأحياء والكيمياء والفيزياء — استعمال اصطلاحي راسخ"
        - "خيط باطل: الهباء المنثور في شعاع الشمس أو لعاب العنكبوت — استعمال مجازي مستقل يُضرب به المثل في الهشاشة"

    - lemma: "شريط"
      confirm:
        - text: "«الحَبْلُ الدقيق يُفْتَلُ من اللَّيفِ أو الخُوص أو نحوهما (فعيل بمعنى مَفعول)»"
          source: "المعجم الكبير"
        - text: "«خَيْطٌ يُرْبَطُ به صغارُ الضَّأْنِ»"
          source: "المعجم الكبير"
        - text: "«سَيْرٌ من نَسِيجٍ ونحوه ممدودٌ ضَيِّقُ العَرْضِ»"
          source: "المعجم الكبير"
        - text: "«الحبلُ المفتولُ — سير من نسيج ونحوه ممدود ضيق العرض»"
          source: "المعجم الوسيط"
        - text: "«(الشريط) الحبل المفتول وفتيلة السراج — وسير من نسيج ونحوه ممدود ضيق العرض»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«شَريط: ribbon» — مقابل عربي معتمد"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«شَرِيطُ تسجيل: شريطٌ مُمَغْنَط تُسَجَّل عليه الأصوات — شَرِيطُ فيديو: شريطٌ مُمَغْنَطُ تُسَجَّل عليه الصورة»"
          source: "المعجم الكبير"
          addition: "المعنى التقني الحديث (مواد التسجيل السمعي والمرئي) — مفهوم وظيفي مستقل يتجاوز 'الجسم الطويل الرفيع'"
        - text: "«الشَّرِيطُ الحديديُّ: القضيبُ الحَديديُّ الذى يَجْرِى عليه القطارُ وَنَحْوُه»"
          source: "المعجم الكبير"
          addition: "معنى هندسي صناعي — القضيب المعدني الطولي، أثقل وأصلب مما تدل عليه المجموعة"
        - text: "«شريط حبري: في آلة كاتبة»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1 (1996)"
          addition: "معنى مكتبي خاص — شريط الحبر في الآلة الكاتبة؛ نوع أخص يُستخدم بدلالة وظيفية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "سِلك"
      source_section: "step4_fts_keyword"
      evidence_citation: "«السِّلْكُ: الخيطُ الذى ينظم فيه الخرز ونحوه، أو الذى يخاط به — خيط من المعدن دقيق أو غليظ» — المعجم الوسيط"
      justification: "مرادف صريح للخيط في المعاجم الكلاسيكية والحديثة — يدل على الجسم الممدود الدقيق المستخدم في الربط والنظم، مطابقاً لتعريف المجموعة من حيث الشكل"
  knowledge_candidates:
    - lemma: "وتر"
      justification: "آلية التوليد: مجاز — الوتر خيط مشدود ممتد بين طرفين (وتر القوس، وتر الآلة الموسيقية)، يشبه الخط الرفيع في دقته وامتداده؛ جذره و-ت-ر دالٌّ على الشدّ والامتداد في خط"
  generation_notes: "التعريف 'أي جسم طويل يشبه الخط الرفيع' فئة واسعة جداً — معظم ما يُولَّد إما مرادف تاريخي لخيط (سلك) أو نوع أخص منه (وتر)؛ المجموعة بحالتها الراهنة كافية للتعبير عن الفئة"

step1_lemma_validation:
  per_lemma:

    - lemma: "خيط"
      decision: confirmed
      decision_reason: "أدلة وافرة من أمهات المعاجم (صحاح، قاموس محيط، لسان، مقاييس، وسيط، كبير) — المعنى الأساسي يطابق تعريف المجموعة تماماً — الجذر خ-ي-ط أصله عند ابن فارس 'امتداد الشيء في دقة' وهو دلالة المجموعة بعينها — الوزن فَعْل مناسب للأجسام البسيطة المحسوسة — يُسر التداول وشيوع الفصيح: كلمة حية في الفصحى المعاصرة والتراث — الاشتقاقية: تتفرع منه يَخِيط / خِياطة / خيّاط / مِخيط / مَخِيط"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "خيط هو النموذج الأصلي في المجموعة — يحيل على الجسم الممدود الدقيق المستدير القطع (كالخيط الذي يُخاط به من قطن أو حرير)؛ أدق من شريط وأقل عرضاً، ويُستعمل للأشياء التي تكاد تخلو من العرض كخيط الإبرة وخيط الجرح"
      example: "شدَّ الطفلُ خيطَ الطائرة الورقية بكلتا يديه لئلا تفلت مع الريح"

    - lemma: "شريط"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من المعجم الكبير والوسيط — المعجم الكبير ينص على أن شريطاً 'خَيْطٌ يُرْبَطُ به' مما يربطه ببنية المجموعة مباشرةً — المعنى الأساسي (سير ممدود ضيق العرض) يُطابق 'الجسم الطويل الذي يشبه الخط' — الوزن فَعِيل بمعنى مفعول (مشروط/مفتول) مناسب للاسم الجامد — الاشتقاقية: شريطي، شريطية، أشرطة — الأدلة الموسَّعة (شريط التسجيل) لا تُلغي المعنى الأصلي المطابق للمجموعة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "شريط أعرض من خيط وذو طابع مُفلطح (ribbon/band مقابل thread) — يُستعمل للشيء الممتد الذي له وجهان وعرض محسوس نسبياً كشريط الحرير وشريط القياس وشريط الجرح؛ أما خيط فمستدير القطع بلا عرض محسوس"
      example: "ربطت الطفلةُ ذيلها بشريط من الحرير الأبيض"

    - lemma: "سِلك"
      source: step05
      decision: removed
      decision_reason: "رغم مرادفته التاريخية لخيط في المعاجم الكلاسيكية، خصَّص الاستعمال المعاصر «سلك» للأسلاك المعدنية الكهربائية — فيفشل معيار الملاءمة (سيُفهَم في السياق الكهربائي لا الخيطي) ومعيار يُسر التداول. فضلاً عن ذلك، الإضافة مكررة دلالياً مع خيط الموجود أصلاً؛ لا قيمة مضافة"
      step05_citation: "«السِّلْكُ: الخيطُ الذى ينظم فيه الخرز ونحوه، أو الذى يخاط به» — المعجم الوسيط"

    - lemma: "وتر"
      source: step05
      decision: removed
      decision_reason: "وتر مفهوم أخص — يدل حصراً على الخيط المشدود بين طرفي القوس أو أوتار الآلات الموسيقية؛ لا يُستعمل للدلالة على الفئة العامة 'أي جسم طويل يشبه الخط الرفيع'. فشل اختبار الإبدال: لا يمكن استبدال خيط بوتر في سياقات الخياطة والربط والنظم. معيار الاطّراد: وتر ليس شائعاً خارج الحقل الموسيقي والهندسي"
      step05_citation: "من المعرفة اللغوية — لا دليل معجمي على استعمال وتر بمعنى الخيط العام"

