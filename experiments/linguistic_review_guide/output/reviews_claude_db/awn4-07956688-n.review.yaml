step0_evidence:
  per_lemma:
    - lemma: "مملكة"
      confirm:
        - text: "«مملكة: حيوانية، نباتية»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«مملكة — kingdom (taxa)»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«مَمْلَكَة (في تَصْنيفِ الأَحْياء) — kingdom»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«المملكة: أحد أقسام العالم الطبيعي الرئيسية الثلاثة، وهي مملكة الجماد mineral kingdom، ومملكة النبات plant kingdom، ومملكة الحيوان animal kingdom»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(المملكة) سُلْطَان الْملك فِي رَعيته... والدولة يحكمها ملك»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعنى السياسي (السيادة والدولة الملكية) يختلف كلياً عن المعنى البيولوجي التصنيفي المقصود في هذه المجموعة"
        - text: "«سلطان المَلِيك في رعيَّته... الدولة يحكمها ملك»"
          source: "المعجم الوسيط"
          conflict: "المعنى السياسي ذاته لا يتوافق مع تعريف المجموعة البيولوجية"
        - text: "«مملكة — kingdom» (domain: Law)"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الاستخدام القانوني يعني الدولة ذات النظام الملكي، لا تقسيماً طبيعياً للكائنات"
      expands:
        - text: "«مملكة الطَّريق: معظمه ووسطه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "دلالة مجازية خاصة بالطريق (المعظم والوسط) مستقلة تماماً عن السياق البيولوجي"
      peripheral_observations:
        - "«مملكة الطريق» معنى مجازي عربي أصيل يفيد معظم الشيء وجوهره، مستقل عن التصنيف الطبيعي ولا صلة له بهذه المجموعة الترادفية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عالَم"
      source_section: "step5_english_bridge"
      evidence_citation: "«عالم الحيوان — animal kingdom»؛ «مملكة(ال..) النباتية، عالم النبات — plant kingdom» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
      justification: "يرد «عالَم» في المعاجم البيولوجية العربية بديلاً مرادفاً لـ«مملكة» في تعابير مثل «عالم الحيوان» و«عالم النبات»، وهي تعابير راسخة في الأدبيات العلمية العربية تمثّل دلالة «مجموعة من الكائنات الطبيعية»"
  knowledge_candidates:
    - lemma: "صِنف"
      justification: "اشتقاق من الجذر ص-ن-ف يفيد التقسيم التصنيفي عموماً — آلية: اشتقاق (مصدر صناعي من التصنيف)؛ يُستخدم في اللغة العربية للدلالة على الفئة والنوع، وقد يكون مرشحاً لمفهوم الوحدة التصنيفية الكبرى"
  generation_notes: "الحقل الدلالي لهذا المفهوم ضيّق في العربية التقنية؛ معظم المقابلات البيولوجية تعود إلى «مملكة» أو «عالَم» في صيغ مركبة؛ لا يوجد مفرد مسكوك بديل شائع"

step1_lemma_validation:
  per_lemma:
    - lemma: "مملكة"
      decision: confirmed
      decision_reason: "مصطلح بيولوجي تقني مستقر في المعاجم العلمية العربية — أدلة تأكيد صريحة من المعجم البيولوجي الموحد والمعجم الطبي الموحد والمَكنَز الزراعي والمورد الحديث؛ الاقتراض المفهومي (calque) من الإنجليزية مقبول بعد تثبيت المصطلح في الأدبيات العلمية؛ الوزن الصرفي مَفْعَلَة يناسب دلالة النطاق والمجال"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "«مملكة» في السياق البيولوجي = أعلى رتبة في التراتبية التصنيفية (فوق الشعبة والطائفة والرتبة)، وهو معنى مختلف جوهرياً عن معناها السياسي الكلاسيكي (الدولة ذات النظام الملكي)؛ لا يوجد مرادف مفرد منافس في الاستعمال التخصصي العربي الحديث"
      example: "تُقسَّم الكائناتُ الحية في علم الأحياء إلى ممالك كبرى، أبرزها مملكة الحيوانات ومملكة النباتات ومملكة الفطريات."

    - lemma: "عالَم"
      source: step05
      decision: removed
      decision_reason: "يرد في صيغ مركبة فقط (عالم الحيوان، عالم النبات) ولا يُستخدم مفرداً مستقلاً بهذا المعنى — فشل اختبار التثبيت المعجمي؛ الاشتراك اللفظي مع «عالِم» (scientist) يُفقده الوضوح كمصطلح مفرد"
      step05_citation: "«عالم الحيوان — animal kingdom»؛ «عالم النبات — plant kingdom» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
      substitution_test:
        result: fail
      nuance_differentiation: "«عالَم» يؤدي المعنى حصراً في تراكيب إضافية ولا يقوم مقام مصطلح مفرد مستقل يدل على المجموعة الطبيعية الكبرى"

    - lemma: "صِنف"
      source: step05
      decision: removed
      decision_reason: "في البيولوجيا الحديثة «صِنف» مُخصَّص لمستويات تصنيفية أدنى من المملكة (class / form / variety)؛ استخدامه بمعنى «المملكة» يُحدث خلطاً في التراتبية؛ فشل اختبار السكّ المصطلحي لأن إبدال أحد مكوّناته بمرادف يبقيه صالحاً وصفاً عاماً لا مصطلحاً مسكوكاً"
      step05_citation: "«قسم — division (في التصنيف)» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
      substitution_test:
        result: fail
      nuance_differentiation: "«صِنف» رتبة تصنيفية دنيا لا تكافئ مستوى المملكة في التراتبية البيولوجية"

  synset_flags:
    definition_review_needed: true

