step0_evidence:
  per_lemma:

    - lemma: "السقوط"
      contradicts:
        - text: "«السّقوط: خروج الطفل من بطن أمّه قبل أوانه كما في المنتخب، وعند المنجّمين: عبارة عن غروب منزل كما يجيء في لفظ الطلوع. والأطباء يطلقون السقوط على الصرع»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المعاني الاصطلاحية (الولادة المبكرة، وغروب المنزل الفلكي، والصرع) لا صلة لها بالمعنى اللاهوتي المقصود في المجموعة"
        - text: "«سُقوطُ الذِّراع (في الولادة): زَلَقُها من الرَّحِمِ قبل الرأس — سُقوط الخصومة (في القانون): انتهاء الخصومة قبل الفصل فيها»"
          source: "المعجم الوسيط"
          conflict: "المداخل التخصصية الطبية والقانونية تعكس توظيفات فنية بعيدة عن السياق اللاهوتي الذي تعنيه المجموعة"
      expands:
        - text: "«السقوط: طرح الشيء إما من مكان عال إلى مكان منخفض كسقوط الإنسان من السطح وسقوط منتصب القامة، والسقط والسقاط لما يقل الاعتداد به، ومنه رجل ساقط أي لئيم في حسبه... وقول الفقهاء سقط الفرض معناه سقط طلبه والأمر به»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يكشف تمدد دلالة 'السقوط' نحو الانحطاط الأخلاقي ('رجل ساقط أي لئيم في حسبه') وزوال الالتزام الديني ('سقوط الفرض')؛ هذان البُعدان الأخلاقي والديني يقتربان من الحقل الدلالي لمفهوم السقوط في الخطيئة"
      peripheral_observations:
        - "المناوي يستعمل عبارة 'كسقوط الإنسان من السطح' كمثال على السقوط الجسدي — وهي الصيغة الحرفية للمّة الثانية في المجموعة، لكن بمعنى مادي لا لاهوتي"
        - "المعجم الكبير والوسيط يُدرجان 'السقوط' فقط في تركيبات اصطلاحية (سقوط الذراع، سقوط الخصومة) دون التطرق إلى أي معنى مجازي أخلاقي أو لاهوتي"

    - lemma: "سقوط الإنسان"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "لم يُعثر على هذا التركيب مدخلاً مستقلاً في أي معجم من قاعدة البيانات. ورد الشكل المقابل 'سقوط الإنسان من السطح' في المناوي مثالاً على السقوط الجسدي لا بوصفه مصطلحاً لاهوتياً"
        - "الجسر الإنجليزي (Fall / Fall of man) لم يُسفر إلا عن مصطلحات فنية (سقوط صخري، سقوط حر، سقوط إشعاعي) — لا أثر للمفهوم اللاهوتي في قاعدة البيانات"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "هبوط آدم"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الهبوط: الانحدار على سبيل القهر» — معجم مقاليد العلوم للسيوطي (Hawramani)؛ و«هبوط: lapse» — المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
      justification: "تركيب إضافي ذو أصل قرآني مباشر ('اهبطوا منها جميعاً' — البقرة:38)؛ يُعبّر عن الانتقال القسري من الجنة إلى الأرض، وهو المقابل الإسلامي السائد لمفهوم The Fall. مبدأ التوليد: تركيب إضافي"
  knowledge_candidates:
    - lemma: "الخطيئة الأصلية"
      justification: "تركيب وصفي — Calque (اقتراض مفهومي) من اللاتينية peccatum originale عبر الإنجليزية original sin؛ هو المصطلح اللاهوتي المسيحي العربي المعتمد لتسمية الذنب الموروث عن آدم وحواء. مبدأ التوليد: تركيب وصفي — الهيكل الاستعاري واضح ومقبول"
    - lemma: "السقطة الآدمية"
      justification: "تركيب وصفي نسبي يجمع مصدر 'سقطة' (من جذر س-ق-ط، وزن فَعْلة للمرة الواحدة) مع النسبة إلى آدم. مبدأ التوليد: تركيب وصفي + اشتقاق (وزن فَعْلة للحدث المفرد بدلاً من المصدر العام). يُوظَّف في بعض الكتابات اللاهوتية العربية المسيحية"
  generation_notes: "المفهوم لاهوتي إبراهيمي ذو صياغتين مختلفتين: الإسلام يُركّز على الهبوط (النزول القسري دون وراثة ذنب)؛ المسيحية تُركّز على الخطيئة الموروثة. قاعدة البيانات لا تحوي مدخلاً بالمعنى اللاهوتي المقصود لأي من اللمّتين الموجودتين"

step1_lemma_validation:
  per_lemma:

    - lemma: "السقوط"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل من الجذر الثلاثي س-ق-ط؛ يُستعمل في الأدبيات اللاهوتية العربية (المسيحية والإسلامية) لتسمية هذا المفهوم. غياب التأكيد المعجمي متوقع في المصطلحات الدينية المتخصصة التي لم تُعالجها المعاجم اللغوية الكلاسيكية بهذا البُعد اللاهوتي. المعايير الستة: الاطّراد والشيوع موجودان في الكتابة الدينية؛ اليُسر التداولي ممتاز (مفرد ثلاثي)؛ الملاءمة دقيقة (السقوط من الكمال إلى الخطيئة)؛ اللفظ تراثي عربي أصيل؛ الاشتقاقية قوية (يسقط — ساقط — مسقط)"
      evidence_assessment:
        case: contradicts
        notes:
          - "لم تُسجّل المعاجم المعنى اللاهوتي للسقوط؛ المداخل المتاحة تتناول السقوط الجسدي والولادة المبكرة والصرع والمسائل القانونية. تناقض شكلي لا دلالي إذ المعاجم لم تُدرج هذا التوظيف اللاهوتي"
      substitution_test:
        result: pass
      nuance_differentiation: "يحمل 'السقوط' الطابع الحركي-المجازي الصرف (الانحدار من مرتبة رفيعة إلى أدنى)، في مقابل 'سقوط الإنسان' الذي يُضيف التحديد البشري صراحةً. الأول أكثر اختصاراً وأقرب إلى المفهوم المجرد المطلق"
      example: "يُعدّ السقوط في اللاهوت المسيحي نقطة تحوّل كبرى أخرجت الإنسان من حالة الكمال الأصلي إلى حالة الضعف والميل إلى الخطيئة"

    - lemma: "سقوط الإنسان"
      decision: confirmed
      decision_reason: "ترجمة مصطلحية راسخة لـ 'Fall of Man' في الأدبيات اللاهوتية العربية المسيحية؛ التركيب ثابت ومعهود في هذه الأدبيات. هو Calque هيكلي واضح المعالم (Fall → سقوط / of Man → الإنسان). اليُسر التداولي مقبول (تركيب إضافي من كلمتين)؛ الملاءمة دقيقة"
      evidence_assessment:
        case: no_material
        notes:
          - "لا مدخل مستقل في قاعدة البيانات — المجموعة تنتمي لحقل لاهوتي متخصص لم تُعالجه المعاجم الموجودة"
      mwe_check:
        is_mwe: true
        accepted: true
        mwe_type: إضافي
      substitution_test:
        result: pass
      nuance_differentiation: "يُصرّح بالمشمول ('الإنسان') خلافاً لـ'السقوط' المجرد، مما يجعله أوضح دلالياً في السياقات التعليمية والتفسيرية؛ وهو الترجمة الأكثر توافقاً حرفياً ومعنوياً مع المصطلح الإنجليزي 'Fall of Man'. الاشتقاقية محدودة بحكم التركيب الإضافي"
      example: "تتمحور عقيدة الفداء في المسيحية حول التكفير عن سقوط الإنسان الأول وما ترتّب عليه من فقدان للبراءة الأصلية"

    - lemma: "هبوط آدم"
      source: step05
      decision: removed
      decision_reason: "المصطلح يعكس الإطار الإسلامي (النزول القسري من الجنة إلى الأرض) لا الإطار المسيحي (السقوط في الخطيئة بوصفها ذنباً موروثاً)؛ الإسلام لا يُقرّ بوراثة الذنب مما يُباعد بينه وبين تعريف المجموعة ('سقوط البشرية في الخطيئة'). يصلح لمجموعة ترادفية إسلامية مستقلة"
      step05_citation: "«الهبوط: الانحدار على سبيل القهر» — معجم مقاليد العلوم للسيوطي"
      substitution_test:
        result: fail

    - lemma: "الخطيئة الأصلية"
      source: step05
      decision: removed
      decision_reason: "المفهوم مختلف دلالياً: الخطيئة الأصلية هي الحالة الناجمة عن السقوط (النتيجة) لا حدث السقوط ذاته (السبب). علاقتهما سببية لا ترادفية؛ تنتمي إلى مجموعة ترادفية مختلفة تصف حالة الذنب الموروث لا الواقعة التأسيسية"
      step05_citation: "لا دليل معجمي مباشر — من المعرفة اللغوية الداخلية"
      substitution_test:
        result: fail

    - lemma: "السقطة الآدمية"
      source: step05
      decision: removed
      decision_reason: "يفشل اختبار التثبيت المعجمي: التعبير لم يرد في قاعدة البيانات ولم يُسجَّل في المعاجم كمدخل مستقل. وزن 'فَعْلة' للمرة الواحدة يُوحي بحدث آني معزول، وهو مناسب لكن التركيب الوصفي بأسره ليس مسكوكاً كافياً"
      step05_citation: "لا دليل معجمي مباشر — من المعرفة اللغوية الداخلية"
      substitution_test:
        result: fail

  synset_flags:
    definition_review_needed: true

