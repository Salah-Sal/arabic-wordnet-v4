step0_evidence:
  per_lemma:

    - lemma: "تحفة"
      confirm:
        - text: "«(التُّحْفَة) الطرفة ويُقال لما له قيمة فنية أو أثرية تحفة (ج) تحف»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«التحفة: الشيء الطريف النفيس يكرم به الإنسان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الطُّرفة يقال لما له قيمة فنية أو أثرية: تُحفة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«عمل فنِّي نادر»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«(1) التُّحفة؛ الطُّرفة: شيء لافت للنظر بجِدَّته أو طرافتِه»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التُّحْفَةُ، بالضم: البِرُّ واللَّطَفُ، والطُّرْفَةُ، ج: تُحَفٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يُضيف بُعد البِرّ والإلطاف (الإكرام والإهداء) الذي يتجاوز مجرد الاقتناء"
        - text: "«التحفة: ما أتحف به الرجل من البر»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يُبرز طابع الهدية والتكريم — التحفة كإلطاف لا كمقتنى بالضرورة"
        - text: "«ما أُتْحفت به الرجلَ من البِرِّ والألْطاف الطُّرْفةُ من الفَاكهة وغيرِها كالرَّياحين»"
          source: "المعجم الكبير"
          addition: "يوسّع المعنى ليشمل الفاكهة والرياحين، أي أنواع الهدايا الطريفة لا مجرد التحف الأثرية"

    - lemma: "شيء نادر"
      evidence_status: "no_material_found"

    - lemma: "طُرفة"
      confirm:
        - text: "«(الطرفة) كل شَيْء مستحدث عَجِيب (ج) طرف»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«كُلُّ شيءٍ مُسْتَحْدَثٍ عجيبٍ»"
          source: "المعجم الكبير"
        - text: "«طُرْفة: كل شيء مستحدث عجيب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«من الحديث: الْمُسْتَحْسَنُ الْمُسْتَمْلَحُ»"
          source: "المعجم الكبير"
        - text: "«(1) التُّحفة؛ الطُّرفة: شيء لافت للنظر بجِدَّته أو طرافتِه»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الطَّرْفَةُ: أَن تحدث فِيهَا نقطة حَمْرَاء من ضَرْبَة أَو غَيرهَا»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "معنى طبي تشريحي (نقطة دم في العين) لا صلة له بالمعنى المقصود — اشتراك لفظي بين طَرفة (بفتح الطاء) وطُرفة (بضمها)"
        - text: "«(الطرفة) نقطة حَمْرَاء من الدَّم تحدث فِي الْعين من ضَرْبَة أَو غَيرهَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "اشتراك لفظي — المعجم ذاته يفرق بين الطَّرفة (بالفتح) بمعنى نقطة الدم والطُّرفة (بالضم) بمعنى كل شيء مستحدث"
      peripheral_observations:
        - "«طَرَفة»: لقب عمرو بن العبد، شاعر جاهلي من أصحاب المعلّقات — اسم علم لا علاقة له بالمجموعة"
        - "«طَرَفة»: واحدة الطَّرف، نوع من النبات الصحراوي القوي العمر — معنى نباتي مستقل"


