step1_lemma_validation:
  per_lemma:

    # ── تحفة (مؤكدة) ──
    - lemma: "تحفة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من المعجم الوسيط والمناوي والمورد الحديث وArabTerm تُجمع على دلالة الشيء النفيس الغريب ذي القيمة الفنية أو الأثرية. الأدلة التوسعية (البِرّ والإهداء) لا تناقض التعريف بل توسّعه"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تنصبّ دلالتها على القيمة الفنية والأثرية والنفاسة، وتُوحي بطابع الإكرام والإهداء؛ غلب عليها في الاستعمال الحديث معنى المقتنى النادر النفيس في المتاحف والمجموعات الخاصة — وهو الأوثق تطابقاً مع مفهوم المجموعة"
      example: "تتباهى متاحف العالم بما تقتنيه من تحف أثرية نادرة تحكي تاريخ الحضارات القديمة"

    # ── شيء نادر (محذوفة) ──
    - lemma: "شيء نادر"
      decision: removed
      decision_reason: "تعبير وصفي حر يفشل اختبار السكّ: يمكن إبدال «نادر» بـ«غريب» أو «عجيب» أو «فريد» وتبقى العبارة صالحة كوصف للمفهوم دون أن تُشكّل وحدة معجمية ثابتة. لا مدخل معجمي مباشر لها. وتفشل اختبار التثبيت المعجمي: لم ترد كمصطلح مسكوك في أي معجم معتمد"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: "تعبير وصفي حر لا يحمل ظلاً دلالياً مستقلاً عن مكوّنيه — «الشيء» + «النادر» مجرد جنس وصفة لا وحدة معجمية"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── طُرفة (مؤكدة مع تنبيه) ──
    - lemma: "طُرفة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة قوية من المعجم الوسيط والكبير وموسوعة السلطان قابوس على المعنى الكلاسيكي «كل شيء مستحدث عجيب». الأدلة المتضاربة خاصة بمعنى طبي تشريحي لـ«طَرفة» (بفتح الطاء) وهو اشتراك لفظي لا يُفسد المعنى الأصيل. تنبيه: في العربية المعاصرة انزاحت «طُرفة» نحو معنى القصة الطريفة المضحكة، مما يُوصى بالإشارة إليه في بيانات المجموعة"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تنصبّ دلالتها الكلاسيكية على الاستحداث والجِدّة والعجب («مستحدث عجيب») أكثر من النفاسة المادية؛ تختلف عن «تحفة» بغياب طابع الإكرام والقيمة الأثرية، وتختلف عن «أطروفة» بشيوعها الكلاسيكي. في المعاصرة تُستخدم أساساً للقصة المضحكة وهو انزياح لا يُمثّل المعنى المقصود هنا"
      example: "عاد الرحّالة من رحلته محمّلاً بالطُّرَف والغرائب جمعها من مختلف أقطار الأرض"

    # ── أطروفة — مرشح من الخطوة ٠٫٥ — مقبول ──
    - lemma: "أطروفة"
      source: step05
      decision: confirmed
      decision_reason: "وحدة معجمية ثابتة مسجّلة في المعجم الوسيط والمعجم الكبير بتعريف مطابق للمفهوم المقصود: «التحفة والمستحدث المعجب». جمعها أطاريف. تجتاز اختبار السكّ: لا يمكن إبدال أيٍّ من مكوّناتها لأنها مفردة لا تركيب. الوزن أُفعولة مناسب صرفياً لما يدل على الشيء اللافت العجيب"
      step05_citation: "«الأطروفة: المُلحة والتُّحفة المُستحْدَثُ المُعجب (ج) أطاريف» — المعجم الوسيط لمجموعة من المؤلفين؛ «من كُلِّ شيءٍ: الْمُسْتَحْدَثُ الْمُعْجِب الْمُلْحَةُ والتُّحْفَةُ» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تشترك مع «تحفة» و«طُرفة» في معنى الشيء المستحدث العجيب، وتنفرد بالوزن الصرفي المُعبِّر عن الإعجاب المبالَغ فيه (أُفعولة)؛ أقلّ شيوعاً في الاستخدام الحديث وأكثر ارتباطاً بالفصاحة الكلاسيكية، مما يُضفي عليها طابعاً بلاغياً"
      example: "أهدى السفير ضيوفه أطاريف نادرة من بلاده لفتت أنظار المجتمعين في الحفل"
      actions:
        - command: create_entry
          params:
            lemma: "أطروفة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03154617-n"

    # ── أُعجوبة — مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "أُعجوبة"
      source: step05
      decision: removed
      decision_reason: "الدلالة أعمّ من المقصود: «أعاجيب» تُستخدم للعجائب الكونية والحوادث الإدهاشية بوجه عام، لا تخصيص للشيء المادي الغريب القابل للاقتناء. فشل اختبار الإبدال الدقيق: «جمع المتحف أعاجيب نادرة» أقل طبيعية من «جمع المتحف تحفاً نادرة» — الاستعمال التخصصي في سياق المقتنيات لا يُثبّتها. تبقى مرشحاً لمجموعة دلالية أخرى («شيء مدهش / أُعجوبة»)"
      step05_citation: "لا مدخل معجمي مباشر في بيانات الاستعلام لـ«أُعجوبة» بمعنى المقتنى النادر — الدلالة المعجمية أعمّ"

  synset_flags:
