step05_lemma_generation:
  evidence_candidates:
    - lemma: "أطروفة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الأطروفة: المُلحة والتُّحفة المُستحْدَثُ المُعجب» — المعجم الوسيط؛ «من كُلِّ شيءٍ: الْمُسْتَحْدَثُ الْمُعْجِب الْمُلْحَةُ والتُّحْفَةُ» — المعجم الكبير"
      justification: "اسم على وزن أُفعولة من جذر ط-ر-ف، يُعرَّف في المعجم الوسيط والكبير بأنه مرادف مباشر للتحفة والشيء المستحدث المُعجب؛ جمعه أطاريف وهو ما يناسب سياق المقتنيات النادرة. الوزن أُفعولة يحمل دلالة التفضيل والمبالغة في الصفة (مثل أُعجوبة من ع-ج-ب)"

  knowledge_candidates:
    - lemma: "أُعجوبة"
      justification: "اشتقاق على وزن أُفعولة من جذر ع-ج-ب (نفس وزن أطروفة من ط-ر-ف)؛ تدل على الشيء العجيب المُدهش، وجمعها أعاجيب — نحو «أعاجيب الكون» و«عجائب وأعاجيب». ترد في التراث العربي للتعبير عن الغريب النادر. غير أن دلالتها تميل إلى الإدهاش والإعجاز أكثر من الاقتناء، مما قد يجعلها أعمّ من المفهوم المقصود في هذه المجموعة"

  generation_notes: "التعريف يشير إلى شيء مادي غريب نادر جدير بالاقتناء؛ الجذر الدلالي المركزي ط-ر-ف (الطراوة والجِدّة والغرابة والنفاسة) هو الأوفر إنتاجاً لهذا المفهوم في العربية"


