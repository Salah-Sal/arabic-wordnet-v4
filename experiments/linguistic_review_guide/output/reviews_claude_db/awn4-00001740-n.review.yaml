    - lemma: "كَيْنُونَة"
      contradicts:
        - text: "«(1) كينونة؛ وجود (2) الكائنات مجتمعةً (3) كائن (4) حياة؛ بقاء (5) أسلوبُ حياةٍ»"
          source: "المورد الحديث (2008)"
          conflict: "المورد الحديث يُسنّد كينونة إلى ترجمة 'existence' لا 'entity' — يُثبت أن الكلمة تُقابل الوجودَ المجرد لا الشيءَ ذا الوجود المستقل"
        - text: "«(1) وجود (2) كيان؛ كينونة»"
          source: "المورد الحديث (2008)"
          conflict: "ورودها ضمن مقابلات 'entity' في هذا المدخل لا ينفي أن سياقها الأصيل هو 'وجود' — المرادفة هنا جزئية وليست مطابقة"
      expands:
        - text: "«يقال: كان الشيء كوْنًا، وكِيانًا، وكينونةً»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "كينونة مصدر عربي أصيل من ك-و-ن، قرينة كيان اشتقاقاً — غير أن تطوراً دلالياً فصل بينهما: كينونة انزاحت نحو 'حال الوجود' وكيان نحو 'الشيء الموجود'"
        - text: "«(1) غير ذي جوهر أو كينونة (2) غير جوهريّ»"
          source: "المورد الحديث (2008)"
          addition: "يكشف استعمال كينونة في سياق 'الجوهر/الماهية' — بُعد إضافي يوسّع دلالتها نحو essence وليس entity"
      peripheral_observations:
        - "في الفلسفة العربية المعاصرة (ترجمات هيدغر): كينونة = Sein (الوجود بمعناه الأنطولوجي الكلي)، كائن = Seiendes (الموجود/entity) — الفصل بين المستويين حادّ ومقصود"
        - "كينونة لا تُجمَع جمعاً طبيعياً (*كينونات)، وهو عَرَض ينمّ عن كونها مفهوماً كلياً لا فرداً من أفراد فئة"

    - lemma: "كِيَان"
