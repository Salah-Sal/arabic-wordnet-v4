            substituted: "أسّست المنظمةُ موجودها القانوني بموجب القانون الدولي"
            preserved_meaning: false
            why_failed: "موجود القانوني مركّب غير مألوف في العربية التقنية — الكيان القانوني هو المصطلح المستقر"
      nuance_differentiation: "موجود = 'ما هو موجود الآن في الواقع' — يستبعد الكيانات المتصوَّرة أو المستنتجة التي يشملها تعريف المجموعة (يُستدَلّ على وجوده)؛ وهو أضيق من كيان"

