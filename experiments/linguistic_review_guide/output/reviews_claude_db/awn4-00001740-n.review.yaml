          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«بندٌ يمكِن أن يعامَلَ كوحدة مستقلة، وغالباً كعضو من نوع أو صنف معيَّن»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«كِيان» [entity] — مسرد الفلسفة وعلم النفس"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«الكِيان الصهيونيّ [فصيحة] — ذكرت المعاجم «كِيان» بالكسر، يقال: كان الشيء كوْنًا، وكِيانًا، وكينونةً»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«كيان» [entity] — مسرد علم الاجتماع والأنثروبولوجيا"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«كِيان» [entity] — المعجم الطبي الموحد (2009)"
          source: "المعجم الطبي الموحد (2009)"
      expands:
