            substituted: "يشمل مفهوم الذات الحيَّ والجامدَ على حدٍّ سواء"
            preserved_meaning: false
            why_failed: "الذات في العربية مرتبطة بالنفس والهوية الشخصية — 'ذات جامدة' مخالف للاستعمال المعتاد ويوحي بتناقض مفهومي"
      nuance_differentiation: "ذات تشير إلى self/identity/essence — تصلح للكيانات الواعية أو ذوات الهوية المتمايزة؛ ليست مقابلاً عاماً وشاملاً لـ entity"

    # ── مرشح الخطوة ٠٫٥ — موجود — مرفوض ──
    - lemma: "مَوْجُود"
      source: step05
      decision: removed
      decision_reason: "موجود صفة أصلاً (= existing, present)، واستعماله اسماً للدلالة على كلّ entity يقتصر على الخطاب الفلسفي الكلاسيكي ولا يُغطي السياقات التقنية والقانونية والمعلوماتية التي يُغطيها كيان"
      step05_citation: "«مَوْجـود» [existent] — المعجم الموحد لمصطلحات اللسانيات (2002)؛ «(1) كائن؛ موجود» — المورد الحديث (2008)"
      substitution_test:
