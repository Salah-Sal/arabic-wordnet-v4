      nuance_differentiation: "كائن أضيق من كيان — يُستعمل غالباً للكائنات الحية (كائن حيّ) أو المتخيَّلة (كائنات فضائية)؛ لا يصلح مقابلاً عاماً لكيان قانوني أو كيان رياضي أو كيان برمجي"

    # ── مرشح الخطوة ٠٫٥ — ذات — مرفوض ──
    - lemma: "ذات"
      source: step05
      decision: removed
      decision_reason: "ذات تدل على الهوية والجوهر والنفس — استعمالها لـ entity في اللسانيات خاص بذلك الحقل ولا يتعمّم؛ تتداخل مع مفهوم 'الذاتية' الفلسفية (subjectivity) مما يُولّد لبساً في السياق الأنطولوجي"
      step05_citation: "«ذاتٌ — مكوِّن من مكوّنات اللغة كالوحدة النحوية أو المعجمية» — المعجم الموحد لمصطلحات اللسانيات (2002)"
