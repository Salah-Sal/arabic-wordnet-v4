step1_lemma_validation:
  per_lemma:

    - lemma: "كَيْنُونَة"
      decision: removed
      decision_reason: "كينونة تدل على الوجود المجرد كحال أو صفة (= existence/Being) لا على الشيء ذي الوجود المستقل (= entity) — المصادر المعجمية تُسنّدها إلى 'existence' لا 'entity'، وهو فرق مفهومي جوهري يمنع الإدراج؛ كذلك لا تقبل الجمع الطبيعي (*كينونات) مما يؤكد كليّتها"
      evidence_assessment:
        case: contradicts
        notes:
          - "المورد الحديث يُسنّد كينونة لـ existence لا entity"
          - "الاستعمال الفلسفي المعاصر يفصل فصلاً تاماً: كينونة = Sein، كيان/كائن = Seiendes"
      substitution_test:
        result: fail
        failure_sentences:
          - original: "الكيانُ القانونيُّ مستقلٌّ عن شخص مالكيه"
            substituted: "الكينونةُ القانونيةُ مستقلةٌ عن شخص مالكيها"
            preserved_meaning: false
            why_failed: "كينونة قانونية تعني 'الوجود القانوني كصفة' لا 'الشخصية القانونية' — انزياح مفهومي وليس تعبيراً مُعتاداً"
          - original: "يشمل مفهومُ الكيان الأشياءَ والأفكارَ والكائنات"
            substituted: "يشمل مفهومُ الكينونة الأشياءَ والأفكارَ والكائنات"
            preserved_meaning: false
            why_failed: "كينونة لا تُعدَّد (*كينونات) بالطريقة التي تُعدَّد بها الكيانات — لأنها مفهوم وجودي كليّ، لا فرد من أفراد فئة"
      nuance_differentiation: "كينونة ↔ كيان كـ existence ↔ entity بالضبط — كينونة = فعل/حال الوجود كمفهوم كليّ، كيان = شيء بعينه له وجود مستقل"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كِيَان"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من سبعة معاجم تقنية وفلسفية وطبية وحاسوبية — مطابق تام لتعريف المجموعة؛ معجم الصواب يؤكد الضبط الصحيح كِيَان (بالكسر)"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "اللمّة الوحيدة المؤكدة — تدل على 'الشيء ذي الوجود المستقل' بصرف النظر عن طبيعته: حيّ/جامد، مادي/معنوي، واقعي/ذهني؛ أشمل من كائن (يوحي بالأحياء) وأدق من موجود (صفة أصلاً) وأضبط من كينونة (حال مجرد)"
      morphological_fitness: "وزن فِعَال من الفعل الجوف (ك-و-ن) — يناسب المصادر الدالة على الحقيقة الجوهرية للشيء؛ جمعه كيانات (منتج) وتنسيبه كِيَانيّ"
      example: "تُعدّ الشركةُ كياناً قانونياً مستقلاً يختلف عن كياناتِ مالكيه، كما أنّ الفكرةَ الرياضيةَ كيانٌ معنويٌّ لا يستهان بحقيقته."

    # ── مرشح الخطوة ٠٫٥ — كائن — مرفوض ──
    - lemma: "كائن"
      source: step05
      decision: removed
      decision_reason: "كائن يوحي بالكائن الحيّ في الاستعمال الشائع (كائن حيّ = organism)، مما يضيّق المعنى عن entity الشاملة للجامد والمجرد والقانوني والرقمي؛ فشل اختبار الإبدال في السياقات غير الحيوية"
      step05_citation: "«(1) كائن؛ موجود (4) الكائن؛ الموجود» — المورد الحديث (2008)؛ «كائن» [being] — مسرد الفلسفة"
