      params:
        synset_id: "awn4-07096217-n"
        definition_index: 0
        text: "ما يصاحب الكلام من نبر وإيقاع وحركات وإشارات تُكمّل معناه وتُضيف إليه أبعاداً تعبيرية"
    - command: add_definition
      params:
        synset_id: "awn4-07096217-n"
        text: "منظومة الأساليب الصوتية والحركية غير اللفظية المرافقة للكلام — كالنبر والإيقاع والإيماء وتعبيرات الوجه — التي تُسهم في توصيل المعاني وتعزيز التفاهم بين المتكلمين"

