      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "ما يصاحب الكلام من نبر وإيقاع وحركات وإشارات تُكمّل معناه وتُضيف إليه أبعاداً تعبيرية"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
