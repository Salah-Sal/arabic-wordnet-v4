step0_evidence:
  per_lemma:

    - lemma: "تواصل شبه لغوي"
      evidence_status: "no_material_found"

    - lemma: "لغة مصاحبة"
      confirm:
        - text: "«ما يصاحب اللغة من استعمال حركات وإشارات تكمل معنى الكلام.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«ما يصاحب اللغة من استعمال حركات وإشارات تكمل معنى الكلام.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "يوسّع نطاق التعريف ليشمل صراحةً 'الحركات والإشارات' الجسدية، في حين يقتصر تعريف AWN الحالي على 'طريقة التحدث' — وهذا فرق جوهري إذ إن اللغة المصاحبة تتخطى الجانب الصوتي وحده"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جنائب الكلام"
      source_section: "step5_english_bridge"
      evidence_citation: "«جَنائِبُ الكَلاَم (مَثَلاً: نَبْرَةُ الصَّوتِ....)» — المعجم الطبي الموحد (2009)"
      justification: "مركب إضافي (جذر ج-ن-ب: جوانب/مرافقات) + الكلام؛ يُعبّر عن الظواهر المرافقة للكلام كالنبر، وله مسوّغ دلالي من فعل 'تجانب' بمعنى التواجد جنباً إلى جنب"
    - lemma: "لغة ملحقة"
      source_section: "step5_english_bridge"
      evidence_citation: "«لغة ملحقة: اِمتزاج أو عدمه لِلُغة فعلٍ بالخطاب العادي، لهذا تعتبر بعض أنظمة التواصل لغة لاحقة تتميز عن الكلام» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "مصطلح لساني مُوثَّق في معجم متخصص معتمد؛ يُشير إلى منظومة لغوية ملحقة بالخطاب اللفظي ومتمايزة عنه، مما يعكس الطابع 'الثانوي' أو 'التبعي' لهذا النوع من التواصل"
  knowledge_candidates:
    - lemma: "شِبه اللغة"
      justification: "تركيب إضافي مباشر (آلية: تركيب): شِبه (بمعنى para-/شبه، على غرار شبه جزيرة وشبه قارة) + اللغة — يُنتج مقابلاً مضغوطاً لـ paralanguage يعادله لفظاً ومعنى ويتيح الاشتقاق منه (شبه لغوي، شبه لغوياً)"
  generation_notes: "الكلمات المفتاحية الدلالية: مصاحبة/ملحقة/جنائب + اللغة/الكلام. الجسر الإنجليزي أنتج ثلاثة مقابلات مختلفة لـ paralanguage تتفاوت في الاستعمال والتثبيت المعجمي"

step1_lemma_validation:
  per_lemma:

    - lemma: "تواصل شبه لغوي"
      decision: confirmed
      decision_reason: "مقبول بحكم اللغوي رغم غياب السند المعجمي المباشر — كالك مُستقر لـ paralinguistic communication (اللمّة الإنجليزية الثانية في AWN): تواصل = communication، شبه لغوي = paralinguistic؛ الهيكل الاستعاري واضح ومقبول (كالك مفهومي)؛ وزن تَفَاعُل (تواصل) يدل على الاشتراك والتفاعل المتبادل مما يناسب طبيعة التواصل؛ 'شبه لغوي' نعت مركب قياسي مستعمل في الأدبيات اللسانية العربية"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركّز على العملية التواصلية ذاتها (الفعل والنشاط) بخلاف 'لغة مصاحبة' التي تُركّز على المنظومة اللغوية في حد ذاتها — ويُقابل paralinguistic communication تحديداً دون paralanguage"
      example: "يُدرس علماء اللغة التواصلَ شبه اللغوي جنباً إلى جنب مع البنية اللفظية لفهم كيفية توصيل المعاني الكاملة بين المتحدث والسامع."

    - lemma: "لغة مصاحبة"
      decision: confirmed
      decision_reason: "مُؤكَّدة بتعريف صريح وترجمة إنجليزية مباشرة (paralanguage) من مسرد الإعلام والتواصل (ArabTerm)؛ ليست ترجمة حرفية عمياء بل كالك مفهومي سليم: 'مصاحبة' تعكس طبيعة الظاهرة المرافقة للكلام اللفظي؛ وزن مُفَاعِلة (مصاحبة) يدل على المرافقة المستمرة الملائمة دلالياً؛ تسمح بالاشتقاق (مصاحب، مصاحباً)"
      evidence_assessment:
        case: "expands"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُركّز على طبيعة الظاهرة بوصفها 'لغة' قائمة بذاتها ترافق الكلام اللفظي وتُكمّله — بخلاف 'تواصل شبه لغوي' الذي يُركّز على العملية التواصلية؛ يُقابل paralanguage تحديداً بوصفه منظومة"
      example: "تُعدّ نبرة الصوت وتعبيرات الوجه وإيقاع الكلام من أبرز مكوّنات اللغة المصاحبة التي تُثري الخطاب وتُضيف إليه أبعاداً دلالية لا تبلغها الألفاظ وحدها."

    - lemma: "جنائب الكلام"
      source: step05
      decision: removed
      decision_reason: "وُجد حصراً في المعجم الطبي الموحد (2009) دون أي تعريف عربي؛ غريب عن مجال اللسانيات ومعجمياتها؛ فشل اختبار التثبيت المعجمي (لم يرد في أي معجم لساني متخصص)؛ الاستعمال في الأدبيات العربية اللسانية شبه معدوم"
      step05_citation: "«جَنائِبُ الكَلاَم (مَثَلاً: نَبْرَةُ الصَّوتِ....)» — المعجم الطبي الموحد (2009)"
      nuance_differentiation: "لا ينطبق — مرفوض"

    - lemma: "لغة ملحقة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مُوثَّق في المعجم الموحد لمصطلحات اللسانيات (2002) مع تعريف تقني واضح؛ مصدر لساني متخصص معتمد على مستوى العالم العربي؛ وصفي (لغة + ملحقة) مقبول؛ 'ملحقة' من ل-ح-ق دالّ على الإضافة والإلحاق وهو تصوير مشروع لطبيعة الظاهرة"
      step05_citation: "«لغة ملحقة: اِمتزاج أو عدمه لِلُغة فعلٍ بالخطاب العادي، لهذا تعتبر بعض أنظمة التواصل لغة لاحقة تتميز عن الكلام» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُبرز الطابعَ 'الإلحاقي' للظاهرة — أنها ثانوية نسبياً ومُضافة على الخطاب الأساسي — بخلاف 'مصاحبة' التي تُوحي بالتزامن والندّية، و'تواصل شبه لغوي' الذي يُركّز على العملية لا المنظومة"
      example: "تبحث اللسانيات الحديثة في مدى استقلالية اللغة الملحقة عن الخطاب اللفظي وما إذا كانت تخضع لأنظمة خاصة بها."
      actions:
        - command: create_entry
          params:
            lemma: "لغة ملحقة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07096217-n"

    - lemma: "شِبه اللغة"
      source: step05
      decision: removed
      decision_reason: "غير مُثبَّت معجمياً في قاعدة البيانات — فشل اختبار التثبيت المعجمي؛ يحتمل الخلط مع 'ما وراء اللغة' (metalanguage) و'اللغة البدائية' (proto-language)؛ قد يُفضي تركيب شبه + اللغة إلى دلالة 'شبيه اللغة' (quasi-language) غير المقصودة هنا"
      step05_citation: "لا أثر في قاعدة البيانات"
      nuance_differentiation: "لا ينطبق — مرفوض"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "لغة ملحقة"
      reason: "مصدر: الخطوة ٠٫٥ — مصطلح لساني مُوثَّق في المعجم الموحد لمصطلحات اللسانيات (2002)"
      via_command: create_entry + add_sense

