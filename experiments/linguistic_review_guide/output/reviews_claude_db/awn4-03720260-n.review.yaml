step0_evidence:
  per_lemma:

    - lemma: "تِكملة"
      confirm:
        - text: "«(التكملة) ما يتم به الشيء»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(1) مُلحَق؛ تَكْمِلة؛ إضافة؛ ذَيْل»"
          source: "المورد الحديث (2008)"
          addition: "يُوسِّع المفهوم ليشمل الملحق والذيل التسلسلي (addendum/supplement) — أبعد من دلالة إكمال الكل المادي المقصودة في التعريف"

    - lemma: "حشو"
      confirm:
        - text: "«(الحشو) ما يحشى به الشيء»"
          source: "المعجم الوسيط"
        - text: "«ما يُجْعَلُ في الوسادَةِ ونَحْوها من قُطْنٍ ونَحْوه — مِلْءُ الشيء»"
          source: "المعجم الكبير"
        - text: "«ما حشوت به فراشا وغيره»"
          source: "كتاب العين"
      expands:
        - text: "«من الكلام: فَضْلُه الذى لا يُعْتَمَدُ عليه — (عند البلاغيين): زيادةٌ مُتَعَيِّنَةٌ في الكلام لغير فائدةٍ»"
          source: "المعجم الكبير"
          addition: "المعنى البلاغي يدل على الزيادة غير المجدية في الكلام — بُعد مختلف جذرياً عن معنى الملء المادي المقصود في المجموعة"
        - text: "«من الناس من لا يعتد به»"
          source: "كتاب العين"
          addition: "امتداد مجازي نحو الدلالة الاجتماعية على من لا قيمة له — خارج نطاق المجموعة الترادفية"
      peripheral_observations:
        - "أشهر استعمالات «حشو» في الحديث هو اللفظ الزائد في الكلام (المعنى البلاغي)؛ هذا التداخل يُثير التباساً عند استخدام اللمّة في سياق «ما يُضاف لإكمال الكل» المادي"
        - "المعاني المستقلة (صغار الإبل، الأحشاء، الطرف والناحية) خارج نطاق المجموعة الترادفية بالكلية"

