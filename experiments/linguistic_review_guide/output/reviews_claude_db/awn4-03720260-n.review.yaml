      justification: "اشتقاق — اسم فاعل من كمَّل على وزن مُفَعِّل، يدل على «ما يُكمّل شيئاً ناقصاً»؛ شائع في السياق التخصصي (مكمّل غذائي، مكمّل معدني) ويُقابل supplement؛ آلية التوليد: اشتقاق"
  generation_notes: "المفهوم يجمع بين الإتمام النوعي (ك-م-ل وت-م-م) والملء المادي (ح-ش-و وس-د-د)؛ الجذران الأول والثاني يُغطيان جانب الاكتمال، والثاني والثالث يُغطيان جانب الملء"

