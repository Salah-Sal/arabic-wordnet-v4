step0_evidence:
  per_lemma:

    - lemma: "إرث"
      confirm:
        - text: "«الإِرْثُ في الحَسَبِ، والوِرثُ في المالِ» (قول ابن الأعرابي)"
          source: "لسان العرب لابن منظور"
        - text: "«إرث [مفرد]: 2 - أمر قديم متوارث؛ ما يتوارثه الناس عن آبائهم من تراث — حضارتنا مزيج من إرث قديم ومكتسبات ومبدعات حديثة — تعتزّ كلُّ أمّة بإرْثها الحضاريّ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«هو على إرثٍ من كذا، أي على أمر قديم تَوارثه الآخِرُ عن الأوَّل»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«An inheritance, or a heritage; what is inherited. An old condition, case, or state of things, which the last has inherited from the first»"
          source: "Arabic-English Lexicon by Edward William Lane"
        - text: "«إنكم على إرثٍ من إرثِ أبيكم إبراهيم — يريد به ميراثَهم مِلَّته»"
          source: "النهاية في غريب الحديث والأثر لابن الأثير الجزري"
      expands:
        - text: "«الإِرْثُ المِيراثُ، وأصل الهمزة فيه واو»"
          source: "مختار الصحاح للرازي"
          addition: "يُعادَل بالميراث عموماً فيشمل الدلالة المادية والمعنوية معاً — أوسع من اشتراط «غير مادية» في تعريف المجموعة"
        - text: "«الإِرْثُ: الأَصْل. يقال: هو في إرث صدق، أي في أصل صدق»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "دلالة الأصل الحسبي والجذر — بُعد إضافي يشمل الانتساب إلى عريق المجد لا السمة المحددة"
        - text: "«الإِرْثُ من الشيء: البَقِيَّةُ من أصله، والجمع إِراث»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "معنى الأثر والبقية من الأصل — أعمّ من الصفة الموروثة المحددة"

    - lemma: "ميراث"
      confirm:
        - text: "«ميراث: heritage»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ArabTerm، 1995)"
      contradicts:
        - text: "«(الْمِيرَاث) الإراث (ج) مَوَارِيث وَعلم الْمَوَارِيث علم الْفَرَائِض»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة)"
          conflict: "اقتران ميراث بعلم الفرائض يُحيل إلى تقسيم المال الموروث المادي لا إلى الصفات غير المادية المعنية في تعريف المجموعة"
        - text: "«الإِرْثُ في الحَسَبِ والوِرثُ في المالِ» (قول ابن الأعرابي)"
          source: "لسان العرب لابن منظور"
          conflict: "الوِرث — وهو أصل ميراث (مِفعال من وَرِثَ) — مُقابَل صراحةً بالمال المادي، خلافاً لاشتراط «غير مادية» في تعريف المجموعة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تراث"
      source_section: "step5_english_bridge"
      evidence_citation: "«تراث: مَوْروث مُشترك (فني، ثقافي، أدبي) يحيل على الجذور والمكونات، ويُعتبر ذاكرة كل القارات الإثنية والأنثروبولوجية» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "مرادف للإنجليزية heritage في مجال التراث غير المادي؛ مثبَّت في المعاجم المتخصصة المتعددة كمصطلح راسخ لما يتوارثه الناس من قيم وفنون وسجايا"
  knowledge_candidates:
    - lemma: "مَوْرُوث"
      justification: "اشتقاق: اسم مفعول من الجذر و-ر-ث على وزن مَفْعُول، يُستعمل اسماً في الخطاب الأكاديمي والأدبي للدلالة على ما انتقل من الأسلاف — كـ«الموروث الشعبي» و«الموروث الثقافي» — ويمثّل الشيء الموروث ذاته لا فعل الإيراث"
  generation_notes: "الجذر و-ر-ث خصيب الاشتقاق ويُغطي الحقل الدلالي من جهات متعددة؛ المفهوم عربي أصيل غير محتاج إلى تعريب"

step1_lemma_validation:
  per_lemma:

    - lemma: "إرث"
      decision: confirmed
      decision_reason: "أدلة قوية من المعاجم الكلاسيكية والحديثة تُؤكد دلالة الموروث المعنوي والحسبي تحديداً — يطابق قيد «غير مادية» في تعريف المجموعة بدقة"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "يختص في أصل الاستعمال بالإرث المعنوي — الصفات والأخلاق والسجايا والملّة المنتقلة من الأسلاف، إذ نصّ ابن الأعرابي على أن «الإرث في الحسب» (غير المادي) مقابل «الوِرث في المال» (المادي). يتميز داخل المجموعة بأنه الأنسب لتمثيل الخاصية المعنوية الموروثة تحديداً"
      example: "«إنكم على إرثٍ من إرثِ أبيكم إبراهيم» — يريد به توارثَهم ملّتَه وشرائعه المعنوية لا أموالاً"

    - lemma: "ميراث"
      decision: escalated
      decision_reason: "تعارض بين الدلالة الأصلية المادية الراسخة (الوِرث في المال — ابن الأعرابي؛ واقتران عِلم الفرائض به) وبين قيد «غير مادية» في تعريف المجموعة. الاستعمال الحديث يتسع لكن الثقل الدلالي الأصلي يميل إلى المادي — يحتاج مراجعاً بشرياً ليقرر: هل ميراث يُمثّل مجموعة اللاّمادي أم مجموعة المادي؟"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يرتبط أصلاً بالمال والممتلكات المادية في التراث اللغوي الكلاسيكي؛ دلالته الاقتصادية والفقهية (علم الفرائض، التركة، الوصية) أكثر حضوراً من دلالته المعنوية. يتميز عن إرث بهذا الثقل المادي والقانوني"

    - lemma: "تراث"
      source: step05
      decision: removed
      decision_reason: "تراث يدل على التراث الحضاري الجماعي الشامل لا على «أي سمة» محددة موروثة — أوسع نطاقاً من المجموعة. فضلاً عن ذلك يفشل اختبار الإبدال في السياق الدقيق: «شجاعة الأجداد إرث» تجوز، أما «شجاعة الأجداد تراث» فتبدو ضعيفة لأن تراث يُستعمل عادةً لمجموعة موروثات لا لسمة واحدة"
      step05_citation: "«تراث: مَوْروث مُشترك (فني، ثقافي، أدبي)» — المعجم الموحد لمصطلحات اللسانيات"

    - lemma: "مَوْرُوث"
      source: step05
      decision: removed
      decision_reason: "اسم مفعول يعمل صفةً في المقام الأول — يفشل اختبار التثبيت المعجمي كمصطلح اسمي مستقل: «الموروث الشعبي» تركيبٌ وصفيٌ حر يمكن إحلال أي صفة مكان «شعبي»، وليس وحدة معجمية مسكوكة مناظِرة لدلالة المجموعة"
      step05_citation: "مشتق اشتقاقاً عاماً من الجذر و-ر-ث — لا دليل مباشر على تثبيته اسماً مستقلاً بمعنى «سمة موروثة»"

  synset_flags:
    definition_review_needed: true

