    reason: "«ممتلكات غير مادية» تركيب إشكالي — الممتلكات في العربية تنصرف إلى المادي، مما يُولّد تناقضاً داخلياً في الصياغة. التعريف الحالي ترجمة حرفية للإنجليزي «immaterial possession» يستحسن استبداله بتعبير أدق"
