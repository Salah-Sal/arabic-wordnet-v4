step0_evidence:
  per_lemma:
    - lemma: قمر
      confirm:
        - text: "«جِرْمٌ سماوى صغير يدور حول كوكب أكبر منه ويكون تابعاً له... والأقمار الَّتِي تَدور حول كواكب المريخ وزحل وَالْمُشْتَرِي»"
          source: "المعجم الوسيط"
        - text: "«(فك) جرْم سماويّ صغير يدور حول كوكب أكبر منه ويكون تابعًا له... (فك) كلّ كوكب تابع لكوكب آخر ويدور حوله كأقمار المشترى»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«(2) جِرم سماويّ دائر حول جِرم أكبر منه»"
          source: "المورد الحديث (2008)"
        - text: "«القمر: جرم سماوي صغير، والقمر الصناعي جسم يُطلق فى الفضاء ليدور حول الأرض يستخدم لرصد المعلومات والاتصالات»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الْقَمَرُ بعد ثلاث ليالٍ إلى آخر الشهر، سُمِّيَ قَمَراً لِبَيَاضِه»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          conflict: "يحصر القمر في مرحلة قمرية بعينها بعد الليلة الثالثة من الشهر، ولا يتسع لمعنى «أيّ جسم يشبه القمر» عموماً"
        - text: "«الْقَمَر: كَوْكَب ليلِي مكدر أَزْرَق مائل إِلَى السوَاد مظلم غير نوراني كثيف صقيل قَابل للاستنارة من غَيره»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "تعريف تفصيلي يخصّ الجرم الفلكيّ التابع للأرض وحده بأوصاف دقيقة، ولا يشمل «أيَّ جسم» مشابه بصورة عامة"
        - text: "«قَمَرُ السَّمَاءِ سُمِّيَ بِذَلِكَ لِبَيَاضِهِ»"
          source: "المصباح المنير للفيّومي"
          conflict: "يقصر المعنى على قمر السماء المعروف (تابع الأرض)، دون استيعاب المعنى العام «أيّ جسم مشابه»"
      expands:
        - text: "«ووَجْهٌ أَقْمَرُ: مُشَبَّه بالقَمر في بياض اللَّوْن»"
          source: "لسان العرب لابن منظور"
          addition: "يُرسّخ استخدام القمر معياراً للتشبيه في أجسام غير فلكية (الوجه)، مما يدعم دلالة «ما يشبه القمر» في غير الفلك"
        - text: "«جرم سماوي صغير ويكنى به عن الجمال والضياء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يضيف البعد الكنائيّ: قمر = معيار الجمال والإضاءة، مما يوسّع الدلالة لتشمل أيَّ جسم يماثله في الإضاءة والحسن"
        - text: "«قمر: فضة عند أصحاب الكيمياء»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "تطوّر دلاليّ يربط القمر بالفضة عبر المشابهة في البريق واللون الفضيّ — نموذج لتطبيق مبدأ «الشبه بالقمر» على أشياء مادية"
        - text: "«القَمَرُ: قَمَرُ السّماء. يقال عند الامتلاء وذلك بعد الثالثة، قيل: وسمّي بذلك لأنه يَقْمُرُ ضوء الكواكب ويفوز به»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "يكشف أصل اشتقاقيّاً مختلفاً (يقمر = يغلب الكواكب في الضوء)، مما يؤصّل لمفهوم «الغلبة الضوئية» كخاصية جوهرية يمكن أن يشاركه فيها أيُّ جسم مضيء"
      peripheral_observations:
        - "القِمار (المراهنة) — مشتقّ من الجذر ذاته لكنه بعيد كلياً عن دلالة المجموعة؛ بعض المعاجم تربطه بالخداع (تقمّره = خدعه)"
        - "القُمْرِيّ (طائر يشبه الحمام) — سُمّي لبياض لونه الشبيه بلون القمر، معنى مستقل لا علاقة له بالمجموعة"
        - "قمرية (نافذة ذات زجاج ملوّن) — توسّع دلاليّ عبر المشابهة الضوئية والشكل الدائري، معنى مستقل"
        - "قمر الدين (نوع من المشمش المجفّف) — توسّع ثقافيّ اصطلاحي ذو أصل غير واضح، لا علاقة بالمعنى الفلكيّ"

step05_lemma_generation:
  evidence_candidates:
    - lemma: هلال
      source_section: step4_fts_keyword
      evidence_citation: "«هِلال: بنية تشريحيّة بشكل هلال» — المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      reasoning: "الهلال هو الشكل القمريّ الأكثر إيقونيةً في التصوير العربي؛ وقد جرى توظيفه في المصطلحية العلمية والطبية للدلالة على البنى ذات الشكل القمريّ (lunate/crescent-shaped)، مما يجعله مرشحاً للتعبير عن «شيء يشبه القمر» في شكله"
  knowledge_candidates:
    - lemma: بدر
      reasoning: "البدر هو القمر التام في استدارته وإشراقه (الليالي 13-15)، ويمثّل النموذج الأعلى للجسم الشبيه بالقمر في الاستعمال الشعري والأدبيّ العربيّ («وجهها كالبدر»). آلية التوليد: مجاز (إزاحة دلالية — البدر كنموذج للجسم المستدير المضيء). لفظ تراثيّ يمكن إحياؤه للدلالة على الأجسام ذات الشكل القمريّ الكامل."
  generation_notes: "التعريف «أي جسم يشبه القمر» يطرح تحدياً توليدياً: لا تملك العربية مصطلحاً مفرداً راسخاً يكافئ هذا المفهوم العام بمعزل عن لفظ قمر نفسه. هلال وبدر يمثّلان طورَيْن قمريَّيْن محددَيْن لا المفهوم العام. المرشحان يُدرجان للمراجعة مع توقع الرفض."

step1_lemma_validation:
  per_lemma:
    - lemma: قمر
      decision: confirmed
      decision_reason: "اللمّة مركزية في العربية الكلاسيكية والمعاصرة؛ المعاجم الحديثة تؤكد امتداد معناها لتشمل أيَّ جرم سماويّ تابع لكوكب آخر، وهو المفهوم الأقرب لـ«أيّ جسم يشبه القمر»؛ لا بديل عربي أصيل ومستقر يؤدي هذا المعنى العام"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "قمر هو اللفظ الجامع الذي يشمل القمرَ المعيّن (تابع الأرض) وسائر التوابع الفلكية (أقمار المشتري، زحل...) وكلَّ ما يشبه القمرَ شكلاً؛ يتمايز عن هلال (طور الشكل الهلاليّ تحديداً) وعن بدر (طور الاكتمال تحديداً) بكونه الدالَّ على القمريّة المطلقة لا على طور بعينه"
      example: "رصد الفلكيون خمسة أقمار جديدة تدور حول كوكب زحل، تشبه في أحجامها وتراكيبها قمرَ الأرض"

    - lemma: هلال
      source: step05
      decision: removed
      decision_reason: "هلال يخصّ الطورَ الأول للقمر (الشكل المنجليّ في مستهلّ الشهر)، وهو أضيق من «أيّ جسم يشبه القمر»؛ فشل اختبار الإبدال في السياقات التي تعني أقماراً تابعة لكواكب أخرى أو أجساماً مستديرة شبيهة بالبدر"
      step05_citation: "«هِلال: بنية تشريحيّة بشكل هلال» — المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      substitution_test:
        result: fail
      nuance_differentiation: "هلال يمثّل الشكل الهلاليّ (crescent) حصراً، وليس مرادفاً عاماً لأيّ جسم يشبه القمر"

    - lemma: بدر
      source: step05
      decision: removed
      decision_reason: "بدر يختص بطور القمر الكامل (الليالي 13-15)؛ لا يغطي المفهوم العام «أيّ جسم يشبه القمر»، ولا يُبدَل به قمر في السياقات الفلكية (أقمار المشتري ليست كلها أبداراً) ولا في التشبيهات الجزئية"
      step05_citation: "لا دليل معجمي مباشر من قاعدة البيانات — مولّد من المعرفة اللغوية"
      substitution_test:
        result: fail
      nuance_differentiation: "بدر يمثّل نموذج الاكتمال والاستدارة الكاملة، لا مجرّد الشبه بالقمر بوجه عام"

  synset_flags:
    definition_review_needed: true

