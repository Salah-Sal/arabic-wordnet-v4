step3_definition:
  definition_review_flag: true
  current_definition: >-
    (الأنثروبولوجيا) التعبير المميز للطابع المعرفي أو الفكري لثقافة أو مجموعة اجتماعية
  assessment:
    decision: revise
    reason: >-
      «التعبير» (expression) ليست الترجمة الأدق لـeidos — المصطلح يُشير إلى نمط أو
      بنية معرفية كامنة لا إلى «تعبير» بمعنى إفصاح أو ظاهرة خارجية. كذلك «المعرفي أو
      الفكري» ازدواج غير ضروري في تعريف واحد: «المعرفي» أدق وأخص في السياق الإدراكي
      الأنثروبولوجي
  authored_definitions:
    - type: terminological
      text: >-
        (أنثروبولوجيا) النمطُ المعرفي المميز الذي يُحكِم أسلوبَ التفكير وتنظيمَ المعرفة
        في ثقافة بعينها أو جماعة اجتماعية محددة
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: encyclopedic
      text: >-
        (أنثروبولوجيا) البنيةُ الفكرية الكامنة التي تُحدِّد طريقةَ ثقافة ما في تنظيم
        معرفتها وأنماطَ إدراكها للعالم؛ وهو في مقابل الإيثوس الذي يُمثِّل طابعها
        العاطفي والأخلاقي، وكلاهما أداة تحليلية أصَّلها مالينوفسكي وطوَّرتها بنديكت
        في دراسة الأنماط الثقافية المقارنة
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
