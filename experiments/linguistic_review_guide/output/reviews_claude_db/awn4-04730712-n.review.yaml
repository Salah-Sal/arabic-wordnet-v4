        المورد الحديث (2008) [مقابل ethos لا eidos]

    # ── مرشح الخطوة ٠٫٥ الثاني ──
    - lemma: "الشاكلة المعرفية"
      source: step05
      decision: removed
      decision_reason: >-
        فشل اختبار السكّ («المعرفية» قابلة للإبدال بـ«الفكرية» و«العقلية» مع حفظ المعنى)
        — تركيب وصفي حر لا مصطلح مسكوك. فشل اختبار التثبيت المعجمي: لم يَرِد بهذا
        التركيب في أي معجم متخصص بالأنثروبولوجيا رغم أصالة «شاكلة» في التراث العربي.
        يصلح «شاكلة» منطلقاً لتوليد مصطلح مستقبلي إذا قرّر المختصون تعريبَ المفهوم
        بدلاً من التعريب الصوتي
      step05_citation: >-
        «الشاكِلَة: السجيَّةُ والطَّبْعُ المشابِه، المذهبُ والخليقة» — المعجم الكبير

