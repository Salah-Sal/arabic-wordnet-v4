  # (الأنثروبولوجيا)

  evidence_candidates:
    - lemma: "روح الجماعة الفكرية"
      source_section: "step5_english_bridge"
      evidence_citation: >-
        «(1) روح الجماعة: المعتقَدات والمُثُل العليا وأنماط السلوك التي تميِّز جماعة إلخ» —
        المورد الحديث (2008) [مقابل ethos]
      justification: >-
        المورد الحديث يُقابل «ethos» (المفهوم الشقيق) بـ«روح الجماعة» في تركيب إضافي
        يُعبِّر عن الطابع الكلي المميز لجماعة؛ بتخصيصه بـ«الفكرية» يُحاذي البُعد المعرفي
        الإدراكي في تعريف المجموعة — آلية التوليد: تركيب إضافي وصفي (نوع ٣)

  knowledge_candidates:
    - lemma: "الشاكلة المعرفية"
      justification: >-
        آلية التوليد: مجاز (إزاحة دلالية) + إحياء لفظ تراثي (نوع ١). «شاكلة» موثّقة في
        المعجم الكبير والوسيط بمعنى «السجيّة والطبعُ المشابه، المذهبُ والخليقة»، ومقروءة
        في التنزيل العزيز {قل كل يعمل على شاكلته}. استحضار هذا اللفظ التراثي الدقيق
        في سياق أنثروبولوجي — يُحيل على «الطبع الفطري الخاص» بجماعة — مع تخصيصه
        بـ«المعرفية» يُعطي مصطلحاً يُحاكي المعنى المطلوب بأصالة عربية

  generation_notes: >-
    لم يُعثر في قاعدة البيانات على مقابل عربي مسكوك مباشر لـeidos الأنثروبولوجي؛
    المصطلح يُوظَّف في الأدبيات العربية المتخصصة إما بالتعريب المباشر وإما بعبارات
    وصفية. قاعدة البيانات تُقابل المفهوم الشقيق ethos بـ«سمات تراثية مميزة» و«روح
    الجماعة» و«إيثوسية» — مما يدل على أن الحقل الأنثروبولوجي العربي يلجأ إلى التركيب
    الوصفي عند غياب المفردة المسكوكة


step1_lemma_validation:
  per_lemma:

    # ── اللمّة الأولى: إيدوس (لمّة أصلية) ──
    - lemma: "إيدوس"
      decision: confirmed
      decision_reason: >-
        مصطلح فني متخصص في الأنثروبولوجيا الثقافية مُوظَّف بهذا الشكل في الأدبيات
        العربية الأكاديمية (دخيل يوناني كـ«إيثوس» و«لوغوس» و«باثوس» المقبولة في الاستعمال
        العلمي العربي). لا يوجد مقابل عربي أصيل مسكوك. — مخاوف موثَّقة للمراجع البشري:
        (أ) الاقتراض اللفظي — دخيل لا معرَّب: بقي على لفظه الأجنبي دون اندماج في الصرف
        العربي، التهجية غير موحَّدة في المصادر (إيدوس / أيدوس / ايدوس)؛
        (ب) الترجمة الحرفية: لا تنطبق (المصطلح منقول بالتعريب لا بالترجمة)؛
        (ج) الاشتقاقية: محدودة (الصفة «إيدوسي» نادرة، لا يُولَّد منه فعل)؛
        (د) الملاءمة الصرفية: الوزن غير عربي؛
        (ه) أداة التعريف تلتصق به طبيعياً (الإيدوس) مما يُيسِّر إدماجه.
        القبول مُسوَّغ بغياب البديل العربي وبالسابقة الأكاديمية لقبول المصطلحات اليونانية
        في التخصصات الإنسانية العربية
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: >-
        يُمثّل البنيةَ المعرفية والإدراكية المميزة لثقافة ما (الطريقة التي تُنظِّم بها
        معرفتها وتصوُّرها للعالم)، في مقابل الإيثوس الذي يُجسِّد طابعها العاطفي والأخلاقي؛
        التمييز بينهما أساسي في الأنثروبولوجيا البنيوية (Bateson 1936, Benedict 1934)
      example: >-
        درس غريغوري باتسون إيدوسَ قبيلة الياتمول في بابوا غينيا الجديدة، كاشفاً عن
        المنطق المعرفي الكامن الذي يُنظِّم تصوُّرهم للعالم ويُقيِّد تعبيرهم الرمزي
        والاجتماعي.

    # ── اللمّة الثانية: طابع فكري (لمّة أصلية) ──
    - lemma: "طابع فكري"
      decision: removed
      decision_reason: >-
        تركيب وصفي حر يفشل اختبارَي السكّ والتثبيت المعجمي:
        (أ) اختبار السكّ: «فكري» قابل للإبدال بـ«معرفي» أو «عقلي» مع الحفاظ التام على
        المعنى — دليل على أن التعبير وصفي حر لا مصطلح مسكوك؛
        (ب) اختبار التثبيت المعجمي: غير مسجّل في أي معجم متخصص أو مصدر تخصصي.
        فضلاً عن ذلك، «فكري» أقل دقة من «معرفي» في السياق الأنثروبولوجي الإدراكي.
        وظيفته الوصفية تُؤدِّيها التعريف دون الحاجة إلى لمّة منفصلة
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
        failure_sentences:
