          params:
            sense_id: "{auto}"

    # ── مرشح الخطوة ٠٫٥ الأول ──
    - lemma: "روح الجماعة الفكرية"
      source: step05
      decision: removed
      decision_reason: >-
        فشل اختبار التثبيت المعجمي — التعبير منحوت لهذا الغرض ولم يَرِد في أي مصدر
