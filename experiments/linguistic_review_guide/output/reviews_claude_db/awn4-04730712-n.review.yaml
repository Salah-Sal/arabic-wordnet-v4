            substituted: "يكشف الإيدوس عن طابع معرفي مميز لثقافة الأمازون"
            preserved_meaning: true
            why_failed: >-
              الإبدال يحفظ المعنى تماماً — التعبير وصفي حر لا مصطلح ثابت
      nuance_differentiation: >-
        تُمثّل ترجمة وصفية حرة لـ«إيدوس» لا مرادفاً مستقلاً — لا فارق دلالي بينهما؛
        كلتاهما تُحيل على المفهوم ذاته. التداخل تام مما يُخلّ بمبدأ منع الترادف المطلق
      actions:
