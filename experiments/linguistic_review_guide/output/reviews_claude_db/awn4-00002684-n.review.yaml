step0_evidence:
  per_lemma:

    - lemma: "جِسْم"
      confirm:
        - text: "«الجسَد كلُّ ما له طول وعَرْض وعُمْق كلُّ شخص يُدرك من الإنسان والحيوان والنبات
            (عند الفلاسفة): كل جوهر مادي يشغل حيزاً ويتميز بالثقل والامتداد، ويقابل الروح»"
          source: "المعجم الوسيط"
        - text: "«كل شخص مدرك»"
          source: "مقاييس اللغة"
        - text: "«كل شخص مدرك الجسمان: الجسم»"
          source: "مجمل اللغة"
        - text: "«الجسم: جوهر قابل للأبعاد الثلاثة، وقيل: الجسم هو المركب المؤلف من الجوهر»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الجِسْم: متحيز قَابل للْقِسْمَة»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«يجمع البدن وأعضاءه من الناس والإبل والدواب ونحوه مما عظم من الخلق»"
          source: "كتاب العين"
      expands:
        - text: "«الجِسْمُ: جماعة البَدَنِ أو الأعضاء من الناس والإبل والدواب وغيرهم من الأنواع
            العظيمة الخَلْق»"
          source: "لسان العرب لابن منظور"
          addition: "التعريف يتضمن دلالة العِظَم في الخَلق مما قد يُضيّق المعنى عن الأجسام
            الصغيرة كالحصاة والحبة، وهو أخصّ من تعريف المجموعة الذي يشمل كل جسم ملموس مرئي"
        - text: "«كلّ شيء عظيم الخلقة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يقيّد الجسم باشتراط الضخامة، وهو قيد غائب في تعريف المجموعة الأشمل"
        - text: "«الجسم: ما له طول وعرض وعمق، ولا تخرج أجزاء الجسم عن كونها أجساما وإن
            قطع وجزّئ»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "التعريف الفلسفي يُبرز خاصية التحيّز والامتداد في الأبعاد الثلاثة دون النص
            على الرؤية أو إلقاء الظل"

    - lemma: "شَيْء مَادِّيّ"
      contradicts:
        - text: "«الشيء: في اللغة هو ما يصلح أن يعلم ويخبر عنه... وفي الاصطلاح: هو الموجود
            الثابت المتحقق في الخارج»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "«شيء» في الاصطلاح يشمل الأعراض والمعاني المجردة الثابتة في الخارج، لا
            المادي الملموس وحده؛ يتعارض مع اشتراط الملموسية والمرئية في تعريف المجموعة"
        - text: "«كلُّ موجود، حِسّيٌّ أو معنويٌّ»"
          source: "المعجم الكبير"
          conflict: "«شيء» يشمل صراحةً الموجود المعنوي والمجرد، بينما تعريف المجموعة مقيّد
            بالملموس المرئي الذي يُلقي ظلاً"
      expands:
        - text: "«الشَّيْءُ الموجود وما يتصور ويخبر عنه»"
          source: "المعجم الوسيط"
          addition: "الأصل اللغوي لشيء يشمل كل ما يتصوَّر بما في ذلك الكيانات المجردة؛
            إضافة «مادي» ضرورية لكنها تُبقي التركيب وصفاً حراً لا مصطلحاً مسكوكاً"

    - lemma: "غَرَض"
      contradicts:
        - text: "«الهدف الذي يُرمى إليه البغية والحاجة القصد»"
          source: "المعجم الوسيط"
          conflict: "غرض في المعجم الوسيط يعني الهدف والقصد والغاية، لا الجسم المادي الملموس"
        - text: "«الغَرَضُ، محرَّكةً: هَدَفٌ يُرْمَى فِيهِ... والضَّجَرُ والمَلالُ والشَّوْقُ
            والمَخافَةُ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "لا يوجد في هذا المدخل الجامع أي إشارة إلى دلالة الجسم المادي؛ المعاني
            كلها في حقل الإرادة والانفعال لا في حقل الأجسام"
        - text: "«الغَرَضُ الهدف المقصود بالرمي، ثم جُعل اسماً لكل غاية يتحرّى إدراكها»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          conflict: "الراغب يُعمّم الغرض على كل غاية مقصودة، لكنه يبقى في حقل الإرادة
            والقصد لا في حقل الأجسام المادية الملموسة"
        - text: "«الغَرَضُ في الاصطلاح: ما لأجله فعل الفاعل، ويُسمّى علّة غائية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التعريف الاصطلاحي يجعل الغرض علّة غائية (سبب الفعل)، لا جسماً مادياً"
      peripheral_observations:
        - "استُعمل غرض في مسرد المعلوماتية (معجم مصطلحات المعلوماتية 2000) بمعنى object في
          سياق البرمجة الغرضية-التوجه (object-oriented): «متغيِّر يحوي كلاًّ من المساقات والمعطيات
          التي تعالَج ككيان منفصل» — وهو استعمال اصطلاحي تقني مغاير تماماً لمعنى الجسم الفيزيائي
          الملموس المقصود في هذه المجموعة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جِرْم"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الجِرْمُ: الجِسْمُ. فلانٌ حَسَنُ الجِرْمِ: ألواح الجسد وجثمانه» — المعجم الكبير"
      justification: "الجِرم مرادف كلاسيكي للجِسم، ويُستعمل في الفلك (الجرم السماوي) للدلالة
        على الجسم المادي المرئي؛ يقترب من دلالة «كيان ملموس مرئي»؛ آلية التوليد: إحياء لفظ
        تراثي ذي استعمال فلكي ومادي"
  knowledge_candidates:
    - lemma: "شَخْص"
      justification: "المعجم الوسيط: «كلُّ جسمٍ له ارتفاع وظهور» والمعجم الكبير: «كل جسم يُرى
        له ارتفاع وظهور» — التعريف يتقاطع مع «كيان مرئي ملموس»؛ آلية التوليد: إحياء المعنى
        الكلاسيكي الأشمل (قبل تخصيصه بالإنسان في الاستعمال المعاصر)"
  generation_notes: "التعريف يصف كياناً مادياً عاماً يُدرك بالحواس ويُلقي ظلاً؛ أقرب المفردات
    العربية الأصيلة هي الجِرم والشَّخص والجِسم، غير أن الأوّلَيْن يحملان قيوداً استعمالية
    تُضيّق نطاقهما"

step1_lemma_validation:
  per_lemma:

    - lemma: "جِسْم"
      decision: confirmed
      decision_reason: "أدلة فلسفية ومعجمية وافرة؛ المعجم الوسيط وكتاب التعريفات يُقرّان المعنى
        المطلوب (كل جوهر مادي يشغل حيزاً)؛ راسخ في الفصحى المعاصرة والتراث"
      evidence_assessment:
        case: "mixed"
        notes:
          - "الأدلة الفلسفية تؤكد المعنى المطلوب؛ بعض الأدلة الكلاسيكية تُضيّق المفهوم
            باشتراط العظم في الخَلق"
      substitution_test:
        result: "pass"
      nuance_differentiation: "جِسْم يُركّز على المادة الممتدة في الأبعاد الثلاثة (طول وعرض
        وعمق)، ويُستعمل في الفلسفة والفيزياء للدلالة على كل جوهر مادي يشغل حيزاً؛ يتميز
        عن الجسَد (البدن الحي تحديداً) وعن الشَّخص (الكيان المرئي بعينه المقيّد بالإنسان
        في الاستعمال المعاصر)"
      example: "تتأثر الأجسامُ المادية بقوانين الحركة وتُلقي ظلالها على الأسطح المجاورة عند
        سقوط الضوء عليها."

    - lemma: "شَيْء مَادِّيّ"
      decision: removed
      decision_reason: "تركيب وصفي حر لا يشكّل وحدة معجمية مستقرة؛ فشل اختبارَ السكّ المصطلحي
        واختبارَ التثبيت المعجمي: يمكن إبدال «مادي» بـ«حسّي» أو «ملموس» أو «عيني» دون أن
        يتغير المعنى جوهرياً، مما يثبت أنه وصف حر لا مصطلح"
      evidence_assessment:
        case: "expands"
        notes:
          - "«شيء» في الأصل يشمل المجرد والمادي معاً؛ إضافة «مادي» ضرورية لكنها تُبقيه
            وصفاً لا مصطلحاً"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "«شيء» وحده واسع لكل موجود بما فيه المجرد؛ التقييد بـ«مادي» يُعيد
        التعريفَ إلى مجال المجموعة لكن دون سكّ مصطلحي حقيقي"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غَرَض"
      decision: removed
      decision_reason: "خلط دلالي عميق: جميع المعاجم الكلاسيكية والحديثة تُعرّف غرضاً بالهدف
        والقصد والغاية — لا بالجسم المادي الملموس. الاستعمال المقصود هنا ترجمة حرفية عمياء
        (Blind Literal) من الإنجليزية: استُعيرت الدلالة الثانية لـ«object» (الجسم المادي) مع
        أن غرضاً لا يحمل تلك الدلالة في العربية"
      evidence_assessment:
        case: "contradicts"
        notes:
          - "لا يوجد في أي معجم معتمد شاهد على استعمال غرض للجسم المادي الملموس خارج
            السياق الاصطلاحي التقني لبرمجة الحاسوب"
      substitution_test:
        result: "fail"
      nuance_differentiation: "غَرَض = هدف/قصد/غاية (في الإرادة)؛ بينما المطلوب = جسم مادي
        ملموس. الانتقال من «قصد» إلى «جسم» ليس توسيعاً دلالياً طبيعياً بل خلط بين حقلين
        مختلفين استناداً إلى تعددية «object» الإنجليزية غير الموجودة في العربية"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جِرْم"
      source: step05
      decision: removed
      decision_reason: "الاشتراك اللفظي القوي مع الجُرم (بضم الجيم = الجريمة) يُفضي إلى
        التباس في الفهم؛ الاستعمال المعاصر لجِرم بمعنى الجسم المادي نادر ومقتصر على السياق
        الفلكي (الجرم السماوي)؛ يُسر التداول منخفض كمصطلح عام للجسم المادي"
      step05_citation: "«الجِرْمُ: الجِسْمُ. ألواح الجسد وجثمانه» — المعجم الكبير"

    - lemma: "شَخْص"
      source: step05
      decision: removed
      decision_reason: "شَخْص تخصّص في الاستعمال المعاصر بالإنسان (person/individual)؛ لا
        يُطبَّق على الأجسام غير الحية (الحجر والطاولة والنجم) مما يُضيّق نطاقه تضييقاً جذرياً
        عن تعريف المجموعة الأشمل"
      step05_citation: "«كلُّ جسمٍ له ارتفاع وظهور» — المعجم الوسيط"

  synset_flags:
