  generation_notes: "التعريف يصف مفهوماً ترسّخ في المعجمية العربية الحديثة؛ الجذر ظ-ه-ر هو الأكثر طبيعية لهذا المفهوم الدائر حول «الظهور والإدراك الحسّي»؛ المرشحان المُوَلَّدان يُتوقَّع فشلهما في اختبار الإبدال"

