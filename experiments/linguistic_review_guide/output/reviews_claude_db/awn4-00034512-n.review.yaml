step1_lemma_validation:
  per_lemma:

    - lemma: ظاهرة
      decision: confirmed
      decision_reason: "لمّة عربية أصيلة مشتقة على وزن فَاعِلة من الجذر ظ-ه-ر؛ ترسّخ استعمالها في المعاجم المتخصصة الحديثة (الفيزياء، الكيمياء، الجيولوجيا، الطب، علم الاجتماع) كمقابل معتمد لـphenomenon؛ تجمع معايير المصطلح الجيد: الملاءمة الدلالية الدقيقة، يسر التداول، الاشتقاقية الغنية (جمع: ظواهر، نسبة: ظاهراتي، فعل: تظاهرت الأسباب)، وشيوع الفصيح عند المتخصصين"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "تتميّز ظاهرة عن واقعة وحادثة بأنها تشمل الحالات الدائمة والعمليات المستمرة والمتكررة، لا الأحداث الزمنية المنفردة فحسب؛ وتُفرد بالاستعمال العلمي للدلالة على كل ما يخضع للرصد الحسّي سواء أكان طبيعياً أم اجتماعياً أم نفسياً؛ يميّزها عن المحسوس كونها مصطلحاً اسمياً مستقلاً للحدث/الحالة لا وصفاً لصفتها"
      example: "رصد الفلكيون ظاهرة الكسوف الكلي بأجهزة قياسية دقيقة، مؤكّدين أنها ظاهرة حسّية قابلة للتنبؤ والتكرار بصرف النظر عن أي تفسير نظري مسبق"

    - lemma: واقعة
      source: step05
      decision: removed
      decision_reason: "فشل اختبار الإبدال — «واقعة الجاذبية» و«واقعة التضامن الاجتماعي» غير مقبولَين في الاستعمال الفصيح بدلاً من «ظاهرة»؛ واقعة تدل على حدث زمني منفرد (fact/incident) بينما الظاهرة تشمل الحالات الدائمة والعمليات المستمرة؛ المرادفة جزئية في الاستعمال لا تامة في المفهوم"
      step05_citation: "«كلُّ واقعة يُمْكن إدراكها بالحواس والتَّجربة» — المعجم الكبير"
      substitution_test:
        result: fail
      nuance_differentiation: "واقعة تدور في الحقل الدلالي للأحداث المنفردة والموقفية؛ لا تصلح مصطلحاً للظواهر الطبيعية الدائمة كالجاذبية والمدّ والجزر"

    - lemma: مرصود
      source: step05
      decision: removed
      decision_reason: "اسم مفعول من رصد يؤدي وظيفة وصفية (something monitored) لا اسمية مستقلة لمفهوم الظاهرة؛ لم يُسكّ كمصطلح مستقل في أي معجم متخصص؛ فشل اختبار السكّ المصطلحي: «مرصود الجاذبية» و«مرصود طبيعي» غير متداولَين؛ فشل اختبار الإبدال"
      step05_citation: "من المعرفة اللغوية — لم يُعثر على توثيق معجمي كمصطلح مستقل للظاهرة"
      substitution_test:
        result: fail
      nuance_differentiation: "مرصود وصف لحالة الرصد لا للظاهرة المرصودة في ذاتها؛ هو نعت لا اسم جنس"

