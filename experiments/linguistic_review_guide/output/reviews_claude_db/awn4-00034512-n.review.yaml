step0_evidence:
  per_lemma:
    - lemma: ظاهرة

      confirm:
        - text: "«كلُّ واقعة يُمْكن إدراكها بالحواس والتَّجربة»"
          source: المعجم الكبير
        - text: "«حادثةٌ يمكن رَصْدُها ووصفُها على أساس علميّ»"
          source: المعجم الكبير
        - text: "«شيء أو مَظهَر مُدْرَكٌ بالحواس لا بالفكر أو الحدْس»"
          source: المورد الحديث (2008)
        - text: "«واقعةٌ أو حادثة قابلة للوصف والتفسير العلميين»"
          source: المورد الحديث (2008)
        - text: "«الظاهرة الجوية: ما يؤثر في البصر والخيال من أفاعيل الطبيعة»"
          source: المعجم الوسيط لمجموعة من المؤلفين
        - text: "«ظاهرة» — مقابل معتمد لـphenomenon في مجالات الفيزياء والكيمياء والجيولوجيا والطب والاجتماع والفلك والأرصاد والزلازل والتربية"
          source: المعاجم الموحدة للمصطلحات العلمية (ArabTerm، 1989–2010)

      contradicts:
        - text: "«مجموعة الصفات الظاهرة للحيوان»"
          source: المعجم الموحد لمصطلحات علم الأحياء (1993)
          conflict: يقترح ترجمة اللمّة بـ«phenotype» (مجموعة الصفات الوراثية الظاهرة) لا بـphenomenon العلمي العام؛ خلط بين مفهومَين مختلفَين — الظاهرة بالمعنى المقصود عملية/حالة مدركة بالحواس، أما phenotype فمصطلح بيولوجي تخصصي لا يُعرَف بالحواس وحدها

      expands:
        - text: "«الظَّاهِرَةُ الاجْتماعيَّةُ: النُّزوعُ إلى سُلوك مَحْمود أو مَذْموم يَنْتَشِرُ بين الناس حتى يعُمَّ»"
          source: المعجم الكبير
          addition: يوسّع الدلالة إلى الحقل الاجتماعي؛ السلوك الجماعي لا يُرصد بالحواس الطبيعية المجردة بالمعنى الدقيق، بل بالملاحظة الاجتماعية، مما يمتد خارج نطاق التعريف المقيّد بالحواس الحسّية
        - text: "«الشيء كما يبدو لنا، تمييزًا له عن الشيء في ذاته [في فلسفة كَنْت]»"
          source: المورد الحديث (2008)
          addition: يضيف البُعد الفلسفي الكانطي (المظهر ≠ الشيء في ذاته)؛ هذا التمييز أعمق من تعريف المجموعة الذي يقتصر على الإدراك الحسّي الاختباري
        - text: "«واقعة أو حادثة نادرة» و«شخص فائق البراعة»"
          source: المورد الحديث (2008)
          addition: يمتد إلى الاستعمال المجازي للدلالة على الشخص الاستثنائي؛ هذا الاستعمال بعيد عن المعنى العلمي المحدد للمجموعة

      peripheral_observations:
        - "«من الأرض وغيرها: ما أشرف منها وارتفع» — المعجم الكبير (معنى طبوغرافي كلاسيكي مستقل تماماً: الأرض المرتفعة)"
        - "«العين الجاحظة تملأ نقرتها، وهي خلاف الغائرة» — المعجم الكبير (معنى تشريحي كلاسيكي مستقل: العين الناتئة)"
        - "«شرب الإبل ونحوها وقت الظهيرة» — المعجم الكبير (معنى حيواني كلاسيكي مستقل: وقت الري في الظهيرة)"
        - "«ظاهرة الرجل: عشيرته والقوم» — المعجم الكبير (معنى اجتماعي تراثي مستقل: الأهل والعشيرة)"
        - "«من قرى اليمامة» — معجم البلدان لياقوت الحموي (اسم علم جغرافي — غير ذي صلة بالمعنى المقصود)"

