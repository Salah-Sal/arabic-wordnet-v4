  generation_notes: "التعريف يصف الشيء القابل للتغيّر بشكل عام؛ الجذر المحوري غ-ي-ر هو الأكثر إنتاجاً في المصطلحية العربية لهذا الحقل؛ جذور ح-و-ل وق-ل-ب وب-د-ل وردت أيضاً في المعاجم الحديثة مقابلات لـ variable"

