step0_evidence:
  per_lemma:
    - lemma: "متغير"
      confirm:
        - text: "«(4) شيء متقلِّب أو متغيِّر (5) المتغيِّر أو رَمْزُه (ر).»"
          source: "المورد الحديث (2008)"
        - text: "«في اللسانيات، كم يحمل قيما مختلفة. مثال: يعد المركب الاسمي متغيرا قادرا على التمظهر في عدة قيم نحو: أنت، زيد، الولد … إلخ.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«متغير»: مقابل عربي مستقر لـ variable في الرياضيات والفلك والجيولوجيا والفيزياء والصيدلة والهندسة المدنية والزلازل والجغرافيا والفلسفة والفن والاجتماع وموسوعة الكهرباء"
          source: "سلسلة المعاجم الموحدة (ALECSO، 1989–2012) — 13 معجماً تخصصياً"
      expands:
        - text: "«في الرياضيات، يُشير المُتغيّر إلى حرف بديل لمقدار مُقاس، وليكن عدداً على سبيل المثال. وفي البرمجة، يُشيرُ المُتغيِّر إلى 'خزّان' للقيم العددية التي تظهر أثناء إجراء العمّلية الحسابية. وفي الحالات العادية، يُميَّز المُتغيِّر من خلال اسم، ويكون له عنوانٌ مُحدَّد في ذاكرة الحاسوب.»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "دلالتان متخصصتان أخص من التعريف العام: (أ) رياضية — رمز يمثّل مقداراً غير ثابت، (ب) برمجية — موضع ذاكرة يحمل قيمة متبدّلة عند التنفيذ"
        - text: "«في البرمجة: موضعُ تخزينٍ يَحملُ اسماً، ويمكِن أن يحويَ معطياتٍ قابلةً للتغيّر أثناء تنفيذ البرنامج.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُضيف قيداً جوهرياً: المتغير البرمجي ليس أي شيء قابل للتغير بل موضع تخزين له هوية واسم"
        - text: "«الخواص المشاهدة للعنصر الإحصائي.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "دلالة إحصائية: المتغير خاصية قابلة للقياس والملاحظة في وحدة إحصائية — يُضاف بُعد القياسية والإمبيريقية"
      peripheral_observations:
        - "مُتَغَيَّر (اسم مفعول، بفتح الياء) في المعجم الطبي الموحد (2009) يُقابل «variate» لا «variable» — صيغة مختلفة (مُتَفَعَّل لا مُتَفَعِّل) ومعنى مختلف إحصائياً"
        - "في مسرد المياه (2000) يُترجم متغيّر أحياناً إلى «alternative / option / variant» — استخدام هندسي سياقي يبتعد عن الدلالة الأصيلة للتغيّر"

