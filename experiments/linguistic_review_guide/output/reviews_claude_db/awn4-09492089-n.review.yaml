      example: "رصدت الدراسة تأثير عدة متغيّرات اقتصادية على معدلات النمو خلال العقد الماضي."

    - lemma: "متقلّب"
      source: step05
      decision: removed
      decision_reason: "يفشل في اختبار الإبدال التقني: متقلّب يوحي بالتذبذب المتكرر وغير المنتظم (تقلّب الأسعار، تقلّب المزاج) وينطوي أحياناً على دلالة سلبية — المتغير في المصطلحية العلمية محايد يعبّر فقط عن قابلية الأخذ بقيم متعددة لا عن تكرار التغيّر أو اضطرابه؛ المعجم الطبي الموحد يربط متقلّباً بـ protean (لا variable) مما يُرسّخ الانزياح الدلالي"
      step05_citation: "«(1) متقلِّب (2) متغيِّر أو قابل للتَّغيير (4) شيء متقلِّب أو متغيِّر» — المورد الحديث (2008)"
      substitution_test:
        result: fail
      nuance_differentiation: "متقلّب يضمّن عنصر الاستمرارية والتردد المتكرر بين أحوال متناقضة (من ق-ل-ب = الانعكاس والتبدّل)؛ المتغير العلمي يعبّر عن قابلية التغيّر الكامنة لا عن تكرّر حدوثه"

    - lemma: "متحوّل"
      source: step05
      decision: removed
      decision_reason: "تداخل دلالي مخلٌّ مع معانٍ راسخة: في اللسانيات يعني «shifter» (الكلمة المُحوِّلة التي تتغيّر إحالتها بحسب السياق)، وفي الجيولوجيا يعني «metamorphic» (صخر متحوّل)، وفي اللسانيات أيضاً «travesty» — هذا التعدد يُوهم القارئ المتخصص بمعنى مغاير؛ فضلاً عن أن متغير أرسخ وأوسع انتشاراً في المعاجم العلمية العربية"
      step05_citation: "«متحوِّل»: variable — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
      nuance_differentiation: "متحوّل يحمل في العربية الأكاديمية دلالة التحوّل النوعي الجذري أو الشكلي (صخر متحوّل، مادة متحوّلة)؛ المتغير يعبّر عن قابلية أخذ قيم متعددة دون اشتراط تحوّل نوعي"

    - lemma: "مُتَبَدِّل"
      source: step05
      decision: removed
      decision_reason: "يفشل اختبار التثبيت المعجمي: اللفظ لم يرد في أي معجم تخصصي مقابلاً لـ variable — لا يعدو كونه اشتقاقاً وصفياً قابلاً للإبدال بألفاظ متعددة (مُتَبَدِّل / مُتَقَلِّب / مُتَغَيِّر) دون أن يُشكّل وحدة معجمية مسكوكة في التراث العلمي العربي"
      step05_citation: "لا دليل معجمي — مقترح من المعرفة اللغوية الداخلية"
      nuance_differentiation: "مُتَبَدِّل يُحيل على التبدّل المستمر والاستبدال من شيء إلى شيء آخر (من ب-د-ل = الاستبدال) لا على القابلية للتغيّر كصفة دلالية جوهرية للمفهوم"

