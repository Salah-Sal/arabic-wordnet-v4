step0_evidence:
  per_lemma:

    - lemma: "إيثوس"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "«إيثوسية (ال...)، سمات تراثية مميزة: سُلوك وعادة وحالة عاطفية يحددها نورثروب فراي في مضمون اجتماعي داخلي لعمل أدبي يركز على: ميزات الشخصيات، الإطار الأدبي للتخييل، العلاقة بين الكاتب وقارئه» — المعجم الموحد لمصطلحات اللسانيات (2002): مدخل اشتقاقي مشتق من «إيثوس» يخص الإيثوسية الأدبية في نظرية نورثروب فراي لا المعنى الأنثروبولوجي مباشرةً"

    - lemma: "روح الثقافة"
      confirm:
        - text: "«(1) روح الجماعة: المعتقَدات والمُثُل العليا وأنماط السلوك التي تميِّز جماعة إلخ»"
          source: "المورد الحديث (2008)"
        - text: "«سمات (ال…) التراثية»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«(2) روح الفرد: مزاج الفرد وقِيَمُه إلخ»"
          source: "المورد الحديث (2008)"
          addition: "يوسّع دلالة ethos لتشمل روح الفرد الخاصة، وهو بُعد يتجاوز نطاق تعريف المجموعة المتمحور حول الثقافة والعصر لا الأفراد"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "روح الجماعة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) روح الجماعة: المعتقَدات والمُثُل العليا وأنماط السلوك التي تميِّز جماعة» — المورد الحديث (2008)"
      justification: "تركيب إضافي يترجم ethos في السياق الاجتماعي الجمعي وفق المورد الحديث؛ قريب دلالياً من التعريف المطلوب بوصفه الروح المميِّزة لكيان جمعي"
    - lemma: "السمات التراثية"
      source_section: "step5_english_bridge"
      evidence_citation: "«سمات (ال…) التراثية» — مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
      justification: "مصطلح وارد في مسرد أنثروبولوجي متخصص (ALECSO) كمقابل مباشر لـ ethos في سياق العلوم الاجتماعية"
  knowledge_candidates:
    - lemma: "الطابع الثقافي"
      justification: "آلية: تركيب وصفي + مجاز (الطابع = بصمة/خاصية، من جذر ط-ب-ع بمعنى النقش والانطباع). يُعبِّر عن الخاصية المميِّزة المطبوعة في ثقافة ما"
    - lemma: "الشخصية الثقافية"
      justification: "آلية: تركيب وصفي، قياساً على «الشخصية القومية» الشائع في الأدب السوسيولوجي العربي. يُعبِّر عن هوية وطابع الثقافة بوصفها كياناً متمايزاً"
  generation_notes: "مفهوم ethos الأنثروبولوجي يرتكز على الروح الجوهرية المميِّزة للكيان الثقافي؛ المعجم العربي المتخصص يتعامل معه بمحورين: (أ) «روح + موصوف جمعي» كما في المورد الحديث، (ب) «سمات + نسبة تراثية/ثقافية» كما في مسارد ALECSO"

step1_lemma_validation:
  per_lemma:

    - lemma: "إيثوس"
      decision: confirmed
      decision_reason: "دخيل من اليونانية ἦθος عبر الإنجليزية ethos — يقبل أداة التعريف («الإيثوس») ويمكن نسبته («الإيثوسي»، «الإيثوسية») مما يدل على تعريب جزئي؛ رغم وجود مقابل عربي في المجموعة ذاتها فإن الإبقاء على اللفظ الأجنبي المعرَّب مشروع في المصطلحية الأنثروبولوجية المتخصصة للإحالة إلى أصل المفهوم النظري"
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ الأجنبي الدخيل يُستخدم في النصوص الأكاديمية التقنية حين يُراد الإحالة الصريحة إلى المفهوم اليوناني-الإنجليزي الأصل؛ يتميز عن «روح الثقافة» بأنه المصطلح الدقيق الجامع للدلالتين الفردية والجمعية معاً دون تخصيص عنصر «الروح»"
      example: "يرصد الباحث في مؤلَّفه إيثوس الثقافة العربية من خلال تحليل منظومة القيم الجمعية والممارسات الاجتماعية الموروثة عبر الأجيال."

    - lemma: "روح الثقافة"
      decision: confirmed
      decision_reason: "تركيب إضافي عربي فصيح مستقر — الاستعارة الجوهرية لـ«الروح» في دلالة الجوهر الباطني والطابع المميِّز راسخة في التراث العربي والاستعمال الأكاديمي المعاصر؛ أدلة مؤكِّدة من المورد الحديث (2008)"
      evidence_assessment:
        case: "expands"
      mwe_check:
        is_mwe: true
        type: "إضافي"
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "التعبير العربي التوضيحي الموجَّه لعموم القراء — يُبرز بُعد الجوهر الباطني والروحانية الثقافية؛ يتميز عن «إيثوس» بأنه يُخصِّص المعنى بالجانب الروحي والقيمي للثقافة دون سواها، في حين أن «إيثوس» أشمل وأقل تخصيصاً"
      example: "تجلّت روح الثقافة الأندلسية في الانفتاح الفكري وتلاقح الحضارات الذي جمع المسلمين والمسيحيين واليهود في مساحة إبداعية مشتركة."

    - lemma: "روح الجماعة"
      source: step05
      decision: removed
      decision_reason: "المجموعة الترادفية تخص الروح المميِّزة لـ«ثقافة أو عصر» لا «جماعة» — «روح الجماعة» أضيق دلالةً وأقرب إلى esprit de corps أو team spirit؛ الإبدال في جملة «تجلّت [روح الجماعة/روح الثقافة] العربية» يُحدث انزياحاً دلالياً نحو التضامن الجمعي"
      step05_citation: "«(1) روح الجماعة: المعتقَدات والمُثُل العليا وأنماط السلوك التي تميِّز جماعة» — المورد الحديث (2008)"

    - lemma: "السمات التراثية"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر — يمكن إحلال «التراثية» بـ«الثقافية» أو «الاجتماعية» مع استمرار دلالة صالحة، مما يؤكد أنه ليس وحدة معجمية مسكوكة (فشل اختبار السكّ)؛ علاوةً على ذلك «السمات» تُحيل إلى الخصائص المحسوسة أو الظاهرة بينما ethos يُحيل إلى الروح الباطنية غير المحسوسة"
      step05_citation: "«سمات (ال…) التراثية» — مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"

    - lemma: "الطابع الثقافي"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر — «الطابع الحضاري» يؤدي المعنى ذاته بلا فارق (فشل اختبار السكّ)؛ لم يُعثَر له على إدخال في قاعدة البيانات بالمعنى الأنثروبولوجي؛ كما أن «الطابع» قد يُوحي بالسمة الخارجية أو الأسلوبية لا بالجوهر الكامن الذي يعنيه ethos"
      step05_citation: "لا وجود لهذا التركيب بالمعنى الأنثروبولوجي في قاعدة البيانات"

    - lemma: "الشخصية الثقافية"
      source: step05
      decision: removed
      decision_reason: "مقارب لـ«الهوية الثقافية» (cultural identity) لا لـethos — وجدت في قاعدة البيانات «هوية ثقافية» بترجمة «cultural identity» وهو مفهوم مختلف؛ «الشخصية» في العربية تُحيل إلى هوية الكيان الكلية لا إلى روحه المميِّزة"
      step05_citation: "وُجدت في قاعدة البيانات «هوية ثقافية» (entry_id: 730929) بترجمة cultural identity — مفهوم مختلف عن ethos"

