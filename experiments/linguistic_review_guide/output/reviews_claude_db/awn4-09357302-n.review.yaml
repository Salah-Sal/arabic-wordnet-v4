          source: "المعجم الوسيط"
        - text: "«البَرُّ: خلافُ البَحْر»"
          source: "المعجم الكبير"
        - text: "«بَرّ: خلاف البحر ونقيض الكن»"
          source: "كتاب العين"
        - text: "«البر: خلاف البحر (اليابسة)»"
          source: "مقاييس اللغة"
        - text: "«ضِدُّ البَحْرِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«البَرُّ خلاف البحر، وتصوّر منه التوسع فاشتق منه البِرُّ»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«البر: بالفتح خلاف البحر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«البَرُّ: خِلَافُ الْبَحْرِ. وإنَّه لَمُبْحِرٌ مُبِرٌّ. والبَرِّيَّةُ: الصَّحْرَاءُ»"
          source: "المحيط في اللغة للصاحب بن عباد"
      expands:
        - text: "«والبَرِّيَّةُ: الصَّحْراءُ»"
          source: "المحيط في اللغة للصاحب بن عباد"
          addition: "يتسع ليشمل الصحراء القفر؛ أوسع من تعريف المجموعة الذي يعني اليابسة عموماً"
        - text: "«والبَرُّ نَقِيضُ الكِنِّ. والعَرَبُ تَسْتَعْمِلُ ذَلِكَ نَكِرَةً، يَقُولُونَ خَرَجْتُ بَرًّا»"
          source: "مقاييس اللغة"
          addition: "بُعد دلالي إضافي: الخارج/الفضاء المفتوح مقابل الداخل المسقوف — غير موجود في تعريف المجموعة"

