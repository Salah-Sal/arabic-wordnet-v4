          source: "المعجم الكبير"
        - text: "«كل شيء يسفل ويقابل السماء الأرض التي نحن عليها»"
          source: "مقاييس اللغة"
        - text: "«الأَرْضُ، الَّتِي عَلَيْهَا النَّاسُ»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
        - text: "«الأرض: الجرم المقابل للسماء، ويعبّر بها عن أسفل الشيء»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الأَرْضُ: المعروفة»"
          source: "كتاب العين"
        - text: "«سطح الأرض الصلب، قد يكون مغطى بماء (قاع البحر) أو نبات»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (أربترم)"
        - text: "«الأرض: أحد كواكب المجموعة الشمسية وترتيبه الثالث في فلكه حول الشمس، وهو الكوكب الذي نسكنه. الجزء منه. أرض الشيء: أسفله»"
          source: "المعجم الوسيط"
        - text: "«نشأت الأرض قبل حوالي 4.5 مليار عام بفِعل التكتّل التدريجي لمواد كالصخور والغازات»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (أربترم)"
      expands:
        - text: "«وَالأَرْضُ: النُّفْضَةُ والرِّعْدَةُ. وبي أرضٌ أي رعدة»"
          source: "لسان العرب"
          addition: "معنى مستقل تماماً (الرعدة/النفضة) لا صلة له بالمفهوم الجغرافي الصلب"
        - text: "«وَالأَرْضُ: سَفِلَةُ البَعِيرِ والدَّابَّةِ وما وَلِيَ الأَرْضَ منه»"
          source: "لسان العرب"
          addition: "مجاز منقول بالمشابهة المكانية (السُّفلية) — لا يؤثر في صحة المعنى الجغرافي"
      peripheral_observations:
        - "معانٍ مستقلة (هوموفونات دلالية): الزكام (أُرِضَ: زُكِم)، الرعدة، الأرضة (دودة الخشب) — لا علاقة لها بالمجموعة"
        - "مدخل أربترم للكهرباء 'earth' يشير إلى التأريض الكهربائي — سياق مختلف تماماً"

    - lemma: "بر"
      confirm:
