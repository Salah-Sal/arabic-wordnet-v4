      nuance_differentiation: "«أرض» أعمّ ألفاظ المجموعة: تشمل الكوكب كله بما فيه قاع البحر في بعض الاستعمالات؛ هي أيضاً اسم الكوكب ذاته — مما يجعلها لفظاً مشتركاً بين المفهوم الجغرافي الجزئي والكوكبي الكلي؛ لا تشترط صراحةً خلو السطح من الماء كما يفعل «بر» و«يابسة»"
      example: "هبطت الطائرة على أرض المطار بعد رحلة استغرقت عشر ساعات، فتنسّم المسافرون هواء البر."

    - lemma: "بر"
      decision: confirmed
      decision_reason: "تعريف المعجم الوسيط 'ما انبسط من سطح الأرض ولم يغطه الماء' يُطابق تعريف المجموعة تطابقاً دقيقاً بل يزيده دقةً بتقييد الخلو من الماء"
      evidence_assessment:
        case: "expands"
        notes:
          - "التوسع: يحمل دلالة الصحراء والخارج مقابل الداخل المسقوف (نقيض الكن) — أوسع من تعريف المجموعة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "«بر» الأكثر تحديداً في المقابلة مع البحر: يشترط صراحةً ألا يغطيه الماء؛ يميل إلى الدلالة على الفضاء المفتوح والمساحات الواسعة؛ يُستعمل مقابل «بحر» بشكل منهجي أكثر من سائر اللمات"
      example: "أتمّ الرحّالةُ مسيرتَه برًّا من البصرة إلى الشام دون أن يركب البحر."

    - lemma: "يابسة"
      decision: confirmed
      decision_reason: "مقبولة بحكم اللغوي — اسم فاعل مؤنث شفاف من ي-ب-س، مستقرّ في الاستعمال الجغرافي الحديث ومسكوك في المعجمية التخصصية كمقابل للبحر"
      evidence_assessment:
