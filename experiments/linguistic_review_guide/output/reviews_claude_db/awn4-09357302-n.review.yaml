        notes:
          - "لا مدخل معجمي كلاسيكي مستقل بالمعنى المطلوب؛ المدخل الوحيد في قاعدة البيانات اسم مكان (جزيرة إيبيزا)"
          - "أربترم يوثّق 'اليابسة' كمصطلح مستقل مرادف لـ dry land في علوم البحار والجيولوجيا"
      substitution_test:
        result: "pass"
      nuance_differentiation: "«يابسة» أصرح اللمات في الدلالة على صفة الجفاف وخلوّ السطح من الماء — فالجذر ي-ب-س يحمل دلالة اليبوسة الذاتية؛ تُستعمل في السياق الجغرافي التقني الحديث غالباً مع أداة التعريف (اليابسة) وكثيراً في مقابل الماء أو المحيط"
      example: "تغطي اليابسةُ نحو ثلاثين بالمئة من مجموع مساحة الكرة الأرضية بينما يحتلّ الماءُ الجزء الأعظم."

