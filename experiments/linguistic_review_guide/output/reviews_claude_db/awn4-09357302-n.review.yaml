        - "المدخل الوحيد في قاعدة البيانات (معجم البلدان لياقوت الحموي) هو اسم جزيرة (إيبيزا الإسبانية) لا تعريف معجمي للمفهوم"
        - "البحث الكلوبي (FTS) وجد 'أرض يابسة' = dry land بتعريف 'اليابسة' في أربترم علوم البحار، وكذلك 'يابسة، بَرٌّ' = land في أربترم الجيولوجيا — تؤكد الاستعمال التقني"

