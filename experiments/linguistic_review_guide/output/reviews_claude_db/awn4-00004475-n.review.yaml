step0_evidence:
  per_lemma:

    - lemma: "عُضْوِيَّة"
      confirm:
        - text: "«جسم الكائن الحيّ»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«عضوية» [مقابل: organism — المجال: الكيمياء]"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«عضوية» [مقابل: organism — المجال: علم الاجتماع والأنثروبولوجيا]"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (موقع ArabTerm)"
      contradicts:
        - text: "«(العضوية) صفة الْعُضْو فِي جمَاعَة (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الوسيط يُقرّر أن المعنى المجمعي المُعتمَد هو «الانتماء التنظيمي/صفة العضو في جماعة» لا «الكائن الحيّ»؛ يكشف هذا لبساً دلالياً بنيوياً بين دلالتين متعارضتين لا يُحسم بالسياق"
      peripheral_observations:
        - "الدلالة المجمعية الأصيلة (الانتماء التنظيمي) غالبة في الاستعمال العام؛ دلالة organism اقتصرت على معاجم المصطلحات الحديثة وتمثّل calque مفهومياً متأخراً غير مستقر"

    - lemma: "كَائِن حَيّ"
      confirm:
        - text: "«شكل من أشكال الحياة: نبات أو حيوان أو فطريات أو بكتيريا»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (موقع ArabTerm)"
        - text: "«كائن حيّ» [مقابل: organism — المجال: الهندسة المدنية]"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«حَيٌّ ؛ كائِنٌ حَيّ» [مقابل: organism]"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«نبات أو حيوان أو كائن وحيد الخلية أو أي شكل من أشكال الحياة، منظومة لها مكونات مترابطة ومتكاملة تمكن من تحقيق الاستمرارية عن طريق النمو والتكاتر»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (موقع ArabTerm)"
          addition: "يُضيف البُعد البنيوي (منظومة مترابطة) ودلالة الاستمرارية عبر النمو والتكاثر — غير صريحَيْن في تعريف المجموعة الذي يُركّز على الأداء الوظيفي المستقل"
        - text: "«كائن / فردي: مخلوقات يمكن أن تعيش على انفراد، وقد تكون وحيدة الخلية أو متعددة الخلايا»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (موقع ArabTerm)"
          addition: "يُضيف فكرة الانفراد والتفرد كخاصية مميزة للكائن الحيّ القادر على الحياة باستقلالية"

    - lemma: "مُتَعَضٍّ"
      confirm:
        - text: "«(1) المُتَعضّي؛ الكائن الحيّ (أح) — (2) نظام the social organism»"
          source: "المورد الحديث (2008)"
        - text: "«كائن حي متعض، متعضية» [مقابل: organism]"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«كائن متعض» [مقابل: organism]"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«كائن حي متعض، متعضية» [مقابل: organism]"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
      expands:
        - text: "«(2) نظام the social organism»"
          source: "المورد الحديث (2008)"
          addition: "دلالة مجازية إضافية: المنظومة الاجتماعية الموحّدة كـ«كائن عضوي» — بُعد استعاري خارج نطاق التعريف البيولوجي للمجموعة"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُتَعَضِّيَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«كائن حي متعض، متعضية» [مقابل: organism] — المعجم الموحد لمصطلحات الجيولوجيا (2000)؛ و«متعضية مجهرية» [مقابل: micro-organism] — المعجم الموحد لمصطلحات علوم الزلازل (1999)؛ و«متعضية مجهرية» — مسرد الجغرافيا والتاريخ"
      justification: "الصيغة المؤنثة (وزن مُتَفَعِّلَة) أكثر ورودًا كاسم مستقل في المعاجم التخصصية من الصيغة المذكرة؛ التاء المربوطة تُكسبها طابع الاسم الصريح؛ آلية التوليد: اشتقاق من ع-ض-و"
    - lemma: "حَيّ"
      source_section: "step5_english_bridge"
      evidence_citation: "«حَيٌّ ؛ كائِنٌ حَيّ» [مقابل: organism] — المعجم الطبي الموحد (2009)"
      justification: "ورد حيّ متقدّماً على «كائن حيّ» في بعض المقابلات الطبية كمقابل مختصر لـ organism؛ اسم فاعل من الجذر ح-ي-ي"
  knowledge_candidates:
    - lemma: "حَيَوان"
      justification: "اشتقاق (وزن فَعَلان من جذر ح-ي-ي) — في التراث الفلسفي العربي المترجم عن أرسطو: «كل ذي روح ونفس» شاملاً الإنسان والنبات؛ استعمله الفلاسفة بمعنى «الكائن الحيّ» بعمومه لا «الحيوان» وحده؛ إشكالية: المعنى المعاصر ضيَّقه ليقتصر على animal"
    - lemma: "نَامٍ"
      justification: "اشتقاق (اسم فاعل من نما يَنمو، جذر ن-م-و) — وُظِّف في الموروث الأرسطي العربي لـ«النفس النامية» للدلالة على الكائن القادر على النمو والتوالد؛ يستهدف أحد المعايير الجوهرية للكائن الحيّ في تعريف المجموعة"
  generation_notes: "المفهوم له مسارَان اشتقاقيان في المعجمية العربية: (1) من ع-ض-و (الأعضاء) — نشط في المعاجم التخصصية الحديثة؛ (2) من ح-ي-ي (الحياة) — راسخ في الموروث الكلاسيكي؛ المسار الأول أوضح للمعنى العلمي الحديث وأبعد عن اللبس"


step1_lemma_validation:
  per_lemma:

    - lemma: "عُضْوِيَّة"
      decision: removed
      decision_reason: "الدلالة الراسخة مجمعياً هي «صفة العضو في جماعة» (الانتماء التنظيمي)؛ وهي تمثّل calque مفهومياً (Calque) نقل البنية الاشتقاقية عضو→عضوية ≈ organ→organism دون مراعاة أن العربية سبق أن سكّت المصطلح بمعنى آخر؛ فضلاً عن أن تعريف الصيدلة يُعرّفها بـ«جسم الكائن الحيّ» (الجسم لا الكيان)؛ تفشل في معياري الملاءمة (تداخل جوهري مع الانتماء) واطّراد الفصيح (الاستعمال الشائع = بطاقة عضوية، طلب العضوية)"
      evidence_assessment:
        case: "mixed"
      nuance_differentiation: "تنفرد بدلالة «الانتماء التنظيمي» وهي معناها المُقرَّر مجمعياً؛ دلالة الكائن الحيّ طارئة ومتنازَع عليها"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كَائِن حَيّ"
      decision: confirmed
      decision_reason: "موثق في معاجم متعددة بلا تناقض؛ يطابق التعريف تطابقاً دقيقاً؛ يجتاز جميع معايير بوابة الجودة؛ هو الأوسع انتشاراً وأقلّها لبساً في الاستعمال العلمي والعام؛ مركب وصفي ثابت (كائن + حيّ) مسكوك في جميع المجالات"
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
        mwe_type: "وصفي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُبرز الوصف الحيوي الكلي (الوجود + الحياة) دون التركيز على البنية العضوية؛ الأنسب للاستعمال العام والمتخصص على حدٍّ سواء؛ أوضح وأشمل من مُتَعَضٍّ في تصوير المعنى"
      example: "تعتمد الكائناتُ الحيّةُ على آليات الانتخاب الطبيعي لتكييف صفاتها مع متطلبات البيئة المتغيرة بمرور الأجيال."

    - lemma: "مُتَعَضٍّ"
      decision: confirmed
      decision_reason: "موثق في المورد الحديث كمقابل صريح لـ organism في علم الأحياء، ومسجّل في معاجم الجيولوجيا والأحياء والزلازل؛ اشتقاق عربي أصيل من جذر ع-ض-و على وزن اسم الفاعل من تفعّل (مُتَفَعِّل) يعكس المعنى الاشتقاقي الدقيق «الكائن الذي نظَّم أعضاءه»؛ الوزن مناسب دلالياً — اسم الفاعل من Form V يُشير إلى الكيان الذي بلغ حالة التعضّي؛ منتج اشتقاقياً: تعضٍّ/تعضّي (مصدر)، متعضية (مؤنث)، متعضّيات (جمع)"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُبرز البُعد البنيوي-التنظيمي (الكائن ذو الأعضاء المنظّمة)؛ أنسب في السياق التخصصي البيولوجي وأكثر تحديداً من «كائن حيّ» الذي يصف الوجود الحيّ دون الإشارة إلى البنية العضوية"
      example: "يتألف كل مُتَعَضٍّ — من الجراثيم وحيدة الخلية إلى الثدييات الكبرى — من منظومة أعضاء متكاملة تعمل في تناسق لضمان استمراره."

    - lemma: "مُتَعَضِّيَة"
      source: step05
      decision: confirmed
      decision_reason: "الصيغة المؤنثة أكثر توثيقاً كاسم مستقل في المعاجم التخصصية (الجيولوجيا، الزلازل، الجغرافيا، الطب البيطري)؛ التاء المربوطة تُكسبها طابع الاسم الصريح في العربية؛ تجتاز اختبار السكّ المصطلحي (واردة في معاجم معتمدة كوحدة مستقلة)؛ تجتاز اختبار التثبيت المعجمي (سُجّلت في ArabTerm بصيغة مستقلة ومركّبة)"
      step05_citation: "«كائن حي متعض، متعضية» [مقابل: organism] — المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      mwe_check:
        is_mwe: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "مرادفة لمُتَعَضٍّ في الدلالة، غير أن الصيغة المؤنثة تُستخدم غالباً اسماً مستقلاً (مُتَعَضِّيَة = كائن حيّ بعينه)، بينما يُستخدم المذكر غالباً نعتاً في «كائن متعضٍّ»؛ الأُنثى أوسع توثيقاً في الاستعمال المنفرد"
      example: "اكتشف علماءُ الأحياء مُتَعَضِّياتٍ دقيقة في قاع المحيطات تُؤدّي أدواراً محورية في دورة الكربون وتدوير المغذيات."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَعَضِّيَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00004475-n"

    - lemma: "حَيّ"
      source: step05
      decision: removed
      decision_reason: "حيّ كاسم مستقل يحمل دلالتين أشيع وأثبت: (1) حيّ = neighborhood/quarter (أكثر استعمالاً كاسم)، (2) حيّ = alive/living (صفة أساساً)؛ استعماله كاسم مستقل بمعنى organism نادر ومُلتبس؛ فضلاً عن أنه أعمّ من organism إذ قد يشمل التصورات المجردة ذات الحياة"
      step05_citation: "«حَيٌّ ؛ كائِنٌ حَيّ» [مقابل: organism] — المعجم الطبي الموحد (2009)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "يُبرز خاصية الحياة وحدها دون التحديد البيولوجي الكامل — أعمّ من organism ومُلتبس مع neighborhood"

    - lemma: "حَيَوان"
      source: step05
      decision: removed
      decision_reason: "في العربية المعاصرة حيوان = animal (النمط الأحيائي فقط)؛ استخدامه بمعنى organism (الكائن الحيّ بعمومه يشمل النبات والفطريات) يُضيّع الحدود مع hyponym الحيوانات ويعكس معنىً كلاسيكياً غير شائع في الاستعمال الحديث"
      step05_citation: "لا دليل معجمي مباشر — مرشح من المعرفة اللغوية (الاستعمال الأرسطي الكلاسيكي)"
      nuance_differentiation: "يُبرز في الكلاسيكي «كل ذي روح ونفس» — أعمّ من organism تراثياً وأضيق منه في الاستعمال الحديث (يقتصر على animal)"

    - lemma: "نَامٍ"
      source: step05
      decision: removed
      decision_reason: "يُشير إلى خاصية النمو من خصائص الكائن الحيّ لا إلى الكائن نفسه كوحدة؛ أضيق من organism (لا يشمل الكائنات محدودة النمو كبعض الكائنات الدقيقة)؛ غير مُثبَت في معاجم المصطلحات كمقابل لـ organism"
      step05_citation: "لا دليل معجمي — مرشح من المعرفة اللغوية (الموروث الأرسطي: النفس النامية)"
      nuance_differentiation: "يُبرز خاصية النمو والتكاثر — صفة فرعية من صفات الكائن الحيّ لا تعريفه الكامل"

  added_lemmas:
    - lemma: "مُتَعَضِّيَة"
      reason: "مصدر: الخطوة ٠٫٥ — الصيغة المؤنثة أوسع توثيقاً كاسم مستقل في المعاجم التخصصية المتعددة"
      via_command: create_entry + add_sense


step3_definition:
  definition_review_flag: false
  current_definition: "كائن حيّ قادر على الفعل أو الأداء الوظيفيّ بشكل مستقلّ، أو لديه القدرة على ذلك"
  assessment:
    decision: retain
    reason: "التعريف جيد البناء: جنسه القريب (كائن حيّ) دقيق، وفصله المميّز (قادر على الفعل والأداء الوظيفي المستقل) يُميّز الكائن الحيّ من وحدات الحياة الأصغر (العضيّات، الجزيئات الحيوية) غير المستقلة وظيفياً؛ لا تناقض بين التعريف والأدلة المعجمية"
  scope_note: "بعض التعريفات المعجمية تُضيف بُعداً بنيوياً (منظومة مترابطة المكونات) وبُعداً تكاثرياً (الاستمرارية بالنمو والتكاثر) غير صريحَيْن في التعريف الحالي؛ يُوصى بإضافة تعريف موسوعي مكمّل مستقبلاً"


step4_relations:
  hypernymy:
    current_hypernym: "awn4-00007347-n — سَبَب / عَامِل مُسَبِّب"
    test_result: "needs_closer"
    needs_closer_note: "التصنيف تحت «عامل مسبّب» مدفوع بنص «قادر على الفعل المستقل» في التعريف، لكنه يتجاوز الفجوة الدلالية الكبيرة بين المُشتمِل والمُشتمَل؛ في التصنيف البيولوجي الطبيعي organism ← living_thing ← natural_object ← entity؛ يُوصى بإدراج synset وسيط من نوع «شيء حيّ / كيان حيّ» بين organism وcausal_agent"
  antonymy:
    per_lemma:
      - lemma: "كَائِن حَيّ"
        antonym_found: false
      - lemma: "مُتَعَضٍّ"
        antonym_found: false
      - lemma: "مُتَعَضِّيَة"
        antonym_found: false
  verb_checks:
    applicable: false
  selectional_restrictions:
    - lemma: "كَائِن حَيّ"
      constraint: "يُشترط في الكيان المنسوب إليه أن يكون مادياً حيّاً (نبات أو حيوان أو كائن دقيق)؛ لا يصلح للجوامد إلا استعارةً (الدولة كائن حيّ)"
    - lemma: "مُتَعَضٍّ"
      constraint: "يُشترط في الكيان وجودُ تنظيم عضوي — يُستبعد منه الكيانات الأبسط التي لا أعضاء لها بالمعنى الكامل (الفيروسات في بعض التصنيفات)"


