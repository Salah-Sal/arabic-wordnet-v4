step0_evidence:
  per_lemma:

    - lemma: "انشراح"
      confirm:
        - text: "«انشِرَاح: من (ش ر ح) سرور الصدر بالشيء والإقبال عليه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«انشِرَاح: من (ش ر ح) سرور الصدر بالشيء والإقبال عليه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الإقبال على الشيء — بُعد التوجه الإيجابي الإرادي نحو ما يُفرح، لم يرد في تعريف المجموعة المقتصر على الابتهاج وطرد الكآبة"

    - lemma: "بشاشة"
      confirm:
        - text: "«بَاب البشاشة: البشاشة والطلاقة والدحاثة واللباقة والظرافة والهشاشة واللطافة والبشر ولين الجَانِب والتهلل وخفة الرّوح والحلاوة»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
      expands:
        - text: "«بَاب البشاشة: البشاشة والطلاقة والدحاثة واللباقة والظرافة والهشاشة واللطافة والبشر ولين الجَانِب والتهلل وخفة الرّوح والحلاوة»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
          addition: "اللباقة والظرافة ولين الجانب — أبعاد اجتماعية تتجاوز الابتهاج الداخلي نحو حُسن التعامل وجمال الشخصية في المعاشرة"

    - lemma: "بهجة"
      confirm:
        - text: "«البَهْجَةُ: الحُسْنُ، وكخَجِلَ: فَرِحَ، فهو بَهِيجٌ وبَهِجٌ. والابْتِهاجُ: السُّرورُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«البهجة: حسن اللون وظهور السرور. وابتهج بالشيء سُرَّ سروراً بان أثره على وجهه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«في الإنسان: ضَحِكُ أساريرِ الوَجْه، أو ظُهورُ الفَرَح»"
          source: "المعجم الكبير"
        - text: "«بَهْجَة: من (ب ه ج) الفرح والسرور والحسن والنضارة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«البَهْجَةُ: الحُسْنُ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الحسن والجمال الظاهر — البهجة صفة للأشياء والطبيعة أيضاً، ليست حكراً على الحالة النفسية الإنسانية"
        - text: "«البهجة: حسن اللون وظهور السرور»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "حسن اللون — بُعد جمالي بصري مادي يتجاوز الحالة النفسية الابتهاجية المراد تعريفها"
      peripheral_observations:
        - "في القرآن الكريم: «وَأَنْزَلَ لَكُم مِن السَّماءِ مَاءً فَأَنْبَتْنَا بِهِ حَدَائِقَ ذاتَ بَهْجَةٍ» (النمل: ٦٠) — البهجة هنا صفة جمالية نباتية مستقلة تماماً عن معنى الابتهاج الإنساني"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "ابتهاج"
      source_section: "step5_english_bridge"
      evidence_citation: "«ابتهاج؛ مَرَح» — المورد الحديث (2008) [ترجمة cheerfulness]؛ «ابْتِهَاج: من (ب ه ج) الفرح والسرور» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "مصدر قياسي على وزن الافتعال من جذر ب-ه-ج، يدل على إظهار الفرح والسرور، ورد مباشرةً كمقابل عربي لـ cheerfulness في المورد الحديث؛ آلية التوليد: اشتقاق"
    - lemma: "حُبور"
      source_section: "step4_fts_keyword"
      evidence_citation: "«السرور والحبور والجذل والغبطة البهج والارتياح» — الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (باب الفرح)"
      justification: "اسم على وزن فُعول من ح-ب-ر، يدل على الفرح والسرور الهادئ الداخلي، مُدرَج في المعاجم الكلاسيكية ضمن الحقل الدلالي للفرح؛ آلية التوليد: اشتقاق"
  knowledge_candidates:
    - lemma: "انبساط"
      justification: "مصدر انفعالي من ب-س-ط على وزن انفعال، يدل على انطلاق النفس وسرورها وانفتاحها؛ ورد في موسوعة السلطان قابوس بمعنى السرور. آلية التوليد: اشتقاق (وزن انفعال للمطاوعة الداخلية)"
  generation_notes: "التعريف يصف سِمة طباعية ثابتة (صفة كون المرء مبتهجاً) — الأوفى بذلك ما كان مصدراً اسمياً يدل على الحالة الراسخة لا الحدث الآني"


step1_lemma_validation:
  per_lemma:

    - lemma: "انشراح"
      decision: confirmed
      decision_reason: "أدلة معجمية مؤكدة مع توسيع دلالي لا يناقض — اللمّة شائعة الاستعمال فصيحة وافية الاشتقاقية"
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بالإحساس الداخلي لانفتاح الصدر وزوال الانقباض (serenity/relief)، أعمق في الجانب النفسي الباطني من بشاشة الاجتماعية ومن بهجة الظاهرة؛ وزن انفعال يشير إلى المطاوعة الداخلية والاستجابة الوجدانية الذاتية"
      example: "استقبل الخبرَ السارَّ بانشراح ظاهر على ملامحه وانبساط في حديثه مع زملائه"

    - lemma: "بشاشة"
      decision: confirmed
      decision_reason: "أدلة معجمية من ابن مالك تؤكد الدلالة وتثريها — مصطلح طباعي مشتق قياسي على وزن فَعالة الدال على ملازمة الصفة"
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميز بالتجلي في المظهر الخارجي الاجتماعي — طلاقة الوجه وانبساطه عند اللقاء وخفة الروح في التعامل (affability)؛ هي الأكثر وصفاً للجانب الاجتماعي المرئي للابتهاج، في مقابل انشراح الذي يصف الحالة الداخلية الباطنة"
      example: "ودّع المضيفُ ضيوفَه ببشاشة ولطف في الحديث جعلاهم يودّون لو أطالوا المُقام"

    - lemma: "بهجة"
      decision: confirmed
      decision_reason: "أدلة معجمية غزيرة من أربعة مصادر تؤكد المعنى الابتهاجي — اللمّة مركزية في الحقل الدلالي ذات عائلة اشتقاقية ثرية"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الأوسع دلالةً في المجموعة — تجمع بين السرور الداخلي والحسن الخارجي النضر، وتُستخدم لوصف الطبيعة والأشياء مجازاً (بهجة الروضة)؛ وزن فَعْلة يجعلها أقرب للحالة المشهودة المكثّفة من مجرد الصفة الطباعية"
      example: "تجلَّت بهجتُه حين أُعلن اسمه فائزاً في المسابقة العلمية فصفّق الحضور له مُهنِّئين"

    - lemma: "ابتهاج"
      source: step05
      decision: confirmed
      decision_reason: "مقابل مباشر لـ cheerfulness في المعجم الإنجليزي-العربي، مثبَّت في المعاجم الكلاسيكية والحديثة — مصدر اشتقاقي قياسي يُكمل طيف المجموعة الدلالي"
      step05_citation: "«ابتهاج؛ مَرَح» — المورد الحديث (2008)؛ «ابْتِهَاج: من (ب ه ج) الفرح والسرور» — موسوعة السلطان قابوس لأسماء العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "وزن الافتعال يفيد إظهار الفرح وإبداءه والاحتفاء به (exultation)، يميل نحو السرور الصاخب الظاهر — يُكمل الطيف الدلالي: انشراح (باطن هادئ) ← بشاشة (اجتماعي ظاهر) ← بهجة (حسن ظاهر + فرح باطن) ← ابتهاج (إظهار السرور وإبداؤه)"
      example: "استقبل الطلابُ أخبارَ نجاحهم بابتهاج بالغ وسعادة غامرة فاضت في أروقة المدرسة"
      actions:
        - command: create_entry
          params:
            lemma: "ابتهاج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04638046-n"

    - lemma: "حُبور"
      source: step05
      decision: removed
      decision_reason: "فصيح معجمي لكن تداوله ضعيف في المعاصرة، ودلالته متداخلة كلياً مع 'سرور' الأعم منه شيوعاً — ابتهاج يؤدي نفس الدلالة بتثبيت معجمي أقوى وبتمييز وزن صرفي أدق"
      step05_citation: "«السرور والحبور والجذل» — الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"

    - lemma: "انبساط"
      source: step05
      decision: removed
      decision_reason: "انزلقت دلالته في الاستعمال المعاصر نحو extraversion في علم النفس، مما يُربك الدلالة المطلوبة؛ المعنى الأصلي أعم من المطلوب (يشمل الاتساع المادي وانطلاق اللسان وامتداد اليد)"
      step05_citation: "«انبساط: الانتشار وانطلاق اللسان والسرور» — موسوعة السلطان قابوس لأسماء العرب"

  added_lemmas:
    - lemma: "ابتهاج"
      reason: "مصدر: الخطوة ٠٫٥ — مقابل مباشر لـ cheerfulness مثبَّت في المعاجم الكلاسيكية والحديثة، مشتق من جذر بهجة نفسه ومُكمِل للطيف الدلالي"
