step0_evidence:
  per_lemma:
    - lemma: "سبب الوفاة"
      evidence_status: "no_material_found"
      # لا مدخل مباشر للمركب في قاعدة البيانات؛ غير أن البحث الحرّ أظهره
      # مستخدماً في تعريفات أخرى: «عملية لأجل التأكد من سبب الوفاة وظروفها» (تشريح الجثة، قانون)

    - lemma: "قاتل"
      contradicts:
        - text: "«مُقَاتَلَةً, وقِتَالاً: حارَبَهُ دافعَهُ اللهُ فلاناً: لعنه»"
          source: "المعجم الوسيط"
          conflict: "المدخل المُسترجَع هو الفعل قَاتَلَ (الثلاثي المزيد بالمفاعلة = حارَبَ/دافَعَ) لا اسمُ الفاعل قَاتِل من قَتَلَ — تصادُم التسوية الإملائية أوقع خلطاً بين لفظين مختلفَي الوزن والمعنى: قَاتَلَ الفعلُ ≠ قَاتِل الاسمُ"
      expands:
        - text: "«(1) القاتل؛ السَّفّاك (2) killer whale»"
          source: "المورد الحديث (2008)"
          addition: "الاقتران بـ«السَّفّاك» (من يسفك الدماء عمداً) يضيف بُعداً جنائياً ويقصر الدلالة على القاتل الشخص المتعمد دون العامل المسبِّب المجرد؛ كما تكشف الدلالة الثانية (killer whale) عن إمكانية التعدد المجازي"
      peripheral_observations:
        - "المورد الحديث: «(1) قاتلُ الوقت أو مُضِيعُهُ سدًى (2) مَضْيَعَة للوقت؛ لهو؛ تسلية» — استخدام مجازي مستقل تماماً عن معنى العامل المسبب للموت"
        - "المورد الحديث: «القاتل بالتسلسل؛ السفاح» — مُركَّب متخصص في الجرائم المتسلسلة يُضيّق الدلالة نحو الجاني الشخص"
        - "المورد الحديث: «قاتل لون» (colour killer) — استخدام تقني في الإلكترونيات يُظهر خصوبة الجذر في المجاز التقني"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُمِيت"
      source_section: "step5_english_bridge"
      evidence_citation: "«مُمِيت: مسبب أو قادر على التسبب في الموت» — المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      justification: "اسم فاعل من الفعل الرباعي أَمَاتَ (جذر م-و-ت)، مُوثَّق في معاجم تقنية متعددة بمعاني: lethal وdeadly وfatal وmortal وthanatophoric — وتعريفه في مسرد الهندسة المدنية يوافق تعريف المجموعة مباشرةً: «مسبب أو قادر على التسبب في الموت»"
  knowledge_candidates:
    - lemma: "فَتَّاك"
      justification: "اشتقاق — صيغة المبالغة فَعَّال من جذر ف-ت-ك (فَتَكَ = هجم قاتلاً بغتةً دون مواجهة)؛ تدلّ على الشديد الإهلاك؛ تُستعمل في العربية المعاصرة للأمراض والأوبئة المميتة («وباء فتاك»، «سُمّ فتاك»، «جراثيم فتاكة»)؛ يُمكن التعبير عن عامل الوفاة الخفي بـ«الفتاك الصامت»"
  generation_notes: "التعريف يدور حول «العامل» (كيان) «المسبِّب» (وظيفة الإهلاك) — الجذور الدلالية الرئيسية: م-و-ت وق-ت-ل وف-ت-ك وه-ل-ك؛ المرشحات المولَّدة كلها أسماء فاعل أو صيغ مبالغة تعمل في الغالب صفاتٍ لا أسماءً مستقلة، وهو ما يجعل التحقق من ملاءمتها اسمياً محورياً في الخطوة ١"

step1_lemma_validation:
  per_lemma:
    - lemma: "سبب الوفاة"
      decision: confirmed
      decision_reason: "مصطلح إضافي (سبب + الوفاة) قانوني-طبي مستقر؛ يُدرَج في شهادات الوفاة والتقارير الجنائية وإحصاءات المنظمة العالمية للصحة؛ التركيب إضافي أصيل في اللغة العربية؛ لم يُعثر له على مدخل مباشر في القاعدة غير أنه مُسنَد في سياقات تعريفية متعددة"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز عن «قاتل» بكونه مصطلحاً إجرائياً يُسمّي العلاقةَ السببية الرسمية بين عامل ووفاة (ما يُكتب في السجل المدني والتقرير الجنائي)؛ محايد تجاه طبيعة العامل — يستوي أن يكون مرضاً أو حادثاً أو اعتداءً؛ في حين يصف «قاتل» الكيانَ ذاتَه بوصفه فاعل الإهلاك"
      example: "أوضح تقرير الطب الشرعي أن سبب الوفاة احتشاءٌ حادٌّ في عضلة القلب لا يتعلق بأي اعتداء خارجي."

    - lemma: "قاتل"
      decision: confirmed
      decision_reason: "اسم فاعل عربي أصيل من قَتَلَ (وزن فَاعِل، جذر ق-ت-ل)؛ يُستعمل فصيحاً لمؤدي الإهلاك شخصاً كان أو عاملاً بيولوجياً أو كيميائياً؛ الوزن فَاعِل يوحي بالفاعلية والتأثير — وهو ملائم لمفهوم العامل المسبب؛ الاشتقاقية ممتازة (قتل، قاتل، مقتول، قتيل، قتّال، مقتلة)"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز عن «سبب الوفاة» بأنه يُعبِّر عن الكيان القاتل ذاتِه لا عن العلاقة الإجرائية؛ أكثر مرونةً استعمالياً ويقبل التوصيف العلمي المباشر («جرثومة قاتلة»، «جرعة قاتلة»، «مرض قاتل»)؛ يحمل ظلاً دلالياً فاعلياً يجعله أقرب إلى التوصيف الوصفي-العلمي منه إلى التسمية الإجرائية"
      example: "حدَّد علماء الأوبئة الجرثومةَ القاتلةَ المسؤولةَ عن انتشار الوباء في ثلاث قارات خلال أقل من عام."

    - lemma: "مُمِيت"
      source: step05
      decision: removed
      decision_reason: "مُمِيت (فاعل من أَمَاتَ) يعمل أساساً صفةً في المعاجم التقنية (lethal/deadly/fatal/mortal) لا اسماً مستقلاً للعامل المسبب؛ تفشل الإبدال الاسمي: «الإيبولا مُمِيتٌ» ≠ «الإيبولا سببُ الوفاة»؛ POS المجموعة هو noun والإدراج سيُولِّد تعارضاً في التصنيف الصرفي؛ يُقبَل في مجموعة الصفات المعبِّرة عن الخطورة (deadly) لا هنا"
      step05_citation: "«مُمِيت: مسبب أو قادر على التسبب في الموت» — المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      substitution_test:
        result: "fail"

    - lemma: "فَتَّاك"
      source: step05
      decision: removed
      decision_reason: "فَتَّاك (فَعَّال من فَتَكَ) يعمل أساساً صفةً للشيء الشديد الإهلاك؛ غير مُوثَّق في أي مصدر مستعلَم كاسم مستقل لعامل الوفاة؛ فشل اختبار التثبيت المعجمي: لم يرد «الفتاك» مصطلحاً مستقلاً في المعاجم القانونية أو الطبية المرجعية؛ هو عبارة وصفية قابلة للتأويل لا مصطلح مسكوك"
      step05_citation: "لم يرد في المصادر المستعلَمة كمصطلح مستقل بالدلالة المطلوبة — مستنبط من المعرفة اللغوية"
      substitution_test:
        result: "fail"

step3_definition:
  definition_review_flag: false
  current_definition: "العامل المسبب الذي يؤدي إلى الموت"
  assessment:
    decision: retain
    reason: "التعريف وافٍ ومحكم — يشتمل على جنس قريب (العامل = أي كيان مؤثر) وفصل مميّز (المسبب الذي يؤدي إلى الموت)؛ غير دوري وغير ضيق وغير موسّع؛ يُرجِم التعريف الإنجليزي (the causal agent resulting in death) بصدق دون ترجمة حرفية عمياء"

