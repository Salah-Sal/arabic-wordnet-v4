      text: "تجريد يستصحب كيانَيْن أو جزأَيْن أو يصلهما بحيث يستلزم أحدُهما الآخرَ أو يتميّزان به معًا، كالعِلِّية والتضايف"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
