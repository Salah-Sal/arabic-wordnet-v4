step0_evidence:
  per_lemma:
    - lemma: "عَلَاقَة"
      confirm:
        - text: "«العلاقة: شيء يستصحب الأول الثاني كالعلية والتضايف»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«العلاقة: شيء بسببه يستصحب الأول الثاني كالعلية والتضايف»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العلاقة: [في الإنجليزية] Relation, relationship, link — بالفتح رابطة بازبستن معنى بمعنى — ربط معنى بمعنى آخر»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«وعند المنطقيين شيء بسببه يستصحب أي يستلزم أمر أمرًا»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«رابط موجود بين لفظين على الأقل، قد يكونان صوتين أو صرفيتين أو كلمتين أو جملتين»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«ارتباط بين المواضيع أو بين المعطيات. ويسمى علاقة أحد جداول قاعدة معطيات علائقية يحتوي على تسجيلات ذات البنية نفسها»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
        - text: "«عَلاَقَة» [translation_en: relation]"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«علاقة» [translation_en: relation]"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      expands:
        - text: "«الصداقة والحب اللازم للقلب وما تتبلغ به البهائم من الشجر وما يُكتفى به من العيش وما تعلق به الإنسان من صناعة وغيرها»"
          source: "المعجم الوسيط"
          addition: "معانٍ مادية وعاطفية (الصداقة، الزاد، التعلق بالصناعة) لا صلة لها بالتجريد الفلسفي المنتمي لكيانين"
        - text: "«(في علم البيان): المناسبة بين المعنى الأصلي والمعنى المراد في المجاز والكناية»"
          source: "المعجم الوسيط"
          addition: "البُعد البلاغي للعلاقة (علاقة الاستعارة والكناية) — بُعد غير موجود في تعريف المجموعة الفلسفي"
        - text: "«وبالكسر رابطة بازبستن جسم بجسم — ربط جسم بجسم آخر... فهي بالفتح تستعمل في المعاني وبالكسر في الأمور المحسوسة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التمييز الصوتي: عَلاقة (فتح) للمجردات، عِلاقة (كسر) للمحسوسات — يوسّع دلالة المادة اللغوية خارج المعنى المجرد للمجموعة"
        - text: "«العلاقة المهر»"
          source: "التعريفات الفقهية للبركتي"
          addition: "معنى فقهي إضافي (العلاقة = المهر) غير موجود في التعريف الفلسفي للمجموعة"
        - text: "«اتصال متبادل بين أشخاص أو مجموعات»"
          source: "مسرد الإعلام والتواصل — ArabTerm"
          addition: "تخصيص الكيانَيْن بالأشخاص والمجموعات — أخص من التجريد العام للمجموعة"
        - text: "«بنية مكوَّنة من صفات وصفوف علاقاتية... لا يمكن تكرار صف علاقاتي في علاقة»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "التعريف التقني لـ relation في قواعد البيانات العلائقية (Relational DB) — أخص تقنياً وأبعد عن المعنى الفلسفي العام"
      peripheral_observations:
        - "عِلاقَة (بكسر العين) في المعجم الوسيط (OCR): «ما يُعلَّق به السيف ونحوه» — هذا المعنى المادي (الحامل/الشماعة) ينتمي لوزن اسم الآلة ولا علاقة له بعَلاقَة (بفتح) المجردة؛ وأشار معجم الصواب اللغوي إلى أن الفتح هو الفصيح للمعاني المجردة والكسر للمحسوسة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "إضافة"
      source_section: "step5_english_bridge"
      evidence_citation: "«الإضافة: [في الانكليزية] Relation... هي عند النحاة نسبة شيء إلى شيء... وعند الحكماء نسبة بين شيئين يقتضي وجود أحدهما وجود الآخر كالأبوة والبنوة» — كشاف اصطلاحات الفنون للتهانوي + المعجم الوسيط (OCR)"
      justification: "الإضافة في الاصطلاح الفلسفي الأرسطي هي إحدى المقولات العشر وتعني النسبة المتبادلة بين كيانين لا يُعقل أحدهما إلا بالآخر — وهو بالضبط «التجريد المنتمي لكيانين» في تعريف المجموعة"
    - lemma: "نسبة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الإضافة: هي النسبة العارضة للشيء بالقياس إلى نسبة أخرى كالأبوة والبنوة» — كتاب التعريفات للجرجاني"
      justification: "النسبة مصطلح منطقي عربي يدل على الصلة القائمة بين طرفين؛ يُستخدم في الفلسفة العربية الكلاسيكية للدلالة على logical relation في القضايا والتضايفات"
  knowledge_candidates:
    - lemma: "صِلَة"
      justification: "آلية التوليد: إزاحة دلالية (مجاز) — الصِّلَة أصلاً الوصل والقرابة، أُزيحت للدلالة على أي ارتباط بين كيانين. التهانوي يُثبتها مباشرةً مقابلاً لـ [Relation, contact] بالإنجليزية والفرنسية، ووردت في المورد الحديث بمعنى «علاقة، صِلة، رابطة». أقل التباساً من الإضافة ومن النسبة في الاستعمال العام"
  generation_notes: "التعريف (تجريد ينتمي لكيانين) يقابل في التراث الفلسفي العربي مصطلح «الإضافة» (مقولة أرسطو الثالثة من العشر) و«النسبة» (relation في المنطق). الاستعمال المعاصر يُفضل لفظاً من وزن فَعَالَة من جذر يدل على الارتباط والتعلق"

step1_lemma_validation:
  per_lemma:
    - lemma: "عَلَاقَة"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة وافرة من أمهات المعاجم الكلاسيكية (الجرجاني ١٤١٣، المناوي ١٦٢٢، التهانوي ١٧٧٧، الأحمدنكري) والمعاجم التخصصية المعاصرة (الرياضيات، اللسانيات، المعلوماتية، الطب). تستوفي معايير الجودة الستة: شائعة في الفصحى المعاصرة والكتابة العلمية، يسيرة النطق (ثلاثة مقاطع)، ملائمة دلالياً لـ relation المجردة، تراثية الأصل، عربية خالصة من جذر ع-ل-ق، مشتقة الوزن (علائق جمع تكسير، عَلائقي نسبة، تعلَّق فعل ذو صلة). الوزن فَعَالَة مناسب للدلالة على الحالة والصفة المجردة"
      evidence_assessment:
        case: mixed
        notes:
          - "confirm: الجرجاني والمناوي والتهانوي والأحمدنكري يعرّفونها بالاستصحاب المتبادل بين كيانين — يطابق تعريف المجموعة"
          - "expands: المعجم الوسيط يضيف معاني الصداقة والحب والبيان — أبعاد خارج التعريف الفلسفي المجرد للمجموعة"
          - "التمييز الصوتي (فتح/كسر) موثَّق بالمعاجم ولا يُشكّل تناقضاً: المفتوحة للمجردات (تعريف المجموعة) والمكسورة للمحسوسات"
      substitution_test:
        result: pass
      nuance_differentiation: "عَلَاقَة (فتح) هي المصطلح الأعم والأكثر تداولاً في العربية الفصحى المعاصرة للدلالة على الارتباط المجرد؛ تتميز عن «إضافة» بعدم التباسها بالمعنى النحوي (الإضافة الجرية) وعن «نسبة» بعدم التباسها بمعنى الحصة والمئوية وعن «صِلَة» بعدم تخصصها في القرابة الشخصية — هي الوحيدة التي تقع مرادفةً لـ relation في جميع السياقات الفلسفية والعلمية والعامة"
      example: "تقوم العلوم الرياضية على دراسة العلاقات بين المقادير وكشف الخصائص التي تربطها في ما بينها."

    - lemma: "إضافة"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار الإبدال في الاستعمال الحديث — الاشتراك اللفظي الراسخ بين المعنى الفلسفي (relation الأرسطية) والمعنى النحوي (genitive construction) والمعنى الإجرائي (adding/appending) يُعمي المعنى المقصود في أي سياق خارج الدوائر الفلسفية المتخصصة. اختبار السكّ: «الإضافة بين السبب والمسبَّب» تُقرأ فوراً على أنها إلحاق لا ارتباط مجرد"
      step05_citation: "«الإضافة: [في الانكليزية] Relation... وعند الحكماء نسبة بين شيئين يقتضي وجود أحدهما وجود الآخر كالأبوة والبنوة» — كشاف اصطلاحات الفنون للتهانوي + المعجم الوسيط (OCR)"
      substitution_test:
        result: fail
        failure_sentences:
          - original: "العلاقة بين السبب والمسبَّب علاقة ضرورية لا تنفصم"
            substituted: "الإضافة بين السبب والمسبَّب إضافة ضرورية لا تنفصم"
            preserved_meaning: false
            why_failed: "«الإضافة» تُحيل في الوهلة الأولى إلى الإلحاق النحوي أو الإجرائي، ولا تُؤدي المعنى الفلسفي لـ relation في هذا السياق"
      nuance_differentiation: "الإضافة هي المصطلح الأدق تراثياً للـ Relation الأرسطية (المقولة الثالثة) لكن استعمالها الحديث الغالب (النحو والإجراء) يطغى على معناها الفلسفي ويُفقدها الصلاحية كمرادف عام لـ relation"

    - lemma: "نسبة"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار الإبدال — «نسبة» في الاستعمال المعاصر تُفيد أولاً الحصة أو النسبة المئوية أو القرابة أو العزو؛ دلالتها على relation المنطقية المجردة أخص وأضيق من نطاق تعريف المجموعة. اختبار التثبيت المعجمي: «نسبة بين الكميتين» تُقرأ بمعنى ratio لا relation"
      step05_citation: "«الإضافة: هي النسبة العارضة للشيء بالقياس إلى نسبة أخرى كالأبوة والبنوة» — كتاب التعريفات للجرجاني"
      substitution_test:
        result: fail
        failure_sentences:
          - original: "العلاقة بين المتغيرين تحكمها معادلة رياضية"
            substituted: "النسبة بين المتغيرين تحكمها معادلة رياضية"
            preserved_meaning: false
            why_failed: "«النسبة» تُقرأ هنا حتماً بمعنى ratio — تغيّر المعنى الجوهري إلى علاقة كمية لا معنى عام للارتباط"
      nuance_differentiation: "النسبة المنطقية أخص من العلاقة المجردة: تنتمي إلى سياق القضايا والتضايفات المنطقية ولا تُستعمل مرادفاً عاماً لـ relation في جميع الحقول"

step3_definition:
  definition_review_flag: false
  current_definition: "تجريد ينتمي إلى كيانَيْن أو جزأَيْن معًا أو يميّزهما"
  assessment:
    decision: revise
    reason: "التعريف الحالي ترجمة حرفية للإنجليزية («an abstraction belonging to or characteristic of two entities») — التراث المعجمي العربي يُقدِّم تعريفاً أعمق يُبرز مفهوم الاستصحاب والتلازم (الكيانان مترابطان بحيث يستلزم أحدُهما الآخر)؛ كما أن تعبير «ينتمي إلى» غير عربي الصياغة ولا يُؤدي المعنى المقصود بإتقان"
  scope_note: "التعريفات الكلاسيكية (الجرجاني، المناوي، الأحمدنكري) تضيف مفهوم الاستصحاب والاستلزام المتبادل — وهو أدق فلسفياً من مجرد «ينتمي إليهما معًا»"
  authored_definitions:
