      decision_reason: "مرادف شبه تام لـ«مُنْتِن» المؤكَّدة في المجموعة ذاتها — الفارق الصرفي (صفة مشبهة مقابل اسم فاعل) دقيق ولا يستوجب إدراج لمّة مستقلة. فضلاً عن أن «نَتِن» تُستخدم في الغالب وصفاً مقيَّداً بالموصوف لا مفرداً اسمياً قائماً بذاته"
