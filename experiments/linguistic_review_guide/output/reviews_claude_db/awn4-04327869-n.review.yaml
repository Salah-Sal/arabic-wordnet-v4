      nuance_differentiation: "اسم الفاعل من «أنتَن» يُفيد إصدار النتن وتجدّده (طابع الحدث الديناميكي المتكرر)، في مقابل الصفة المشبهة «نَتِن» التي تُفيد الحالة الثابتة. يتمايز عن «رائحة كريهة» بالتركيز على الموضوع المُصدِر (الفاعل) لا الرائحة ذاتها (الأثر). من بوابة الجودة: مُطَّرد، يسير النطق، ملائم للمفهوم، تراثي أصيل، عربي خالص، واشتقاقيته غنية (أنتَن، مُنتِن، إنتان، نتانة)"
      example: "اضطُرَّ العمالُ إلى مغادرة المنطقة فور اكتشاف مُنْتِن يعبق في هواء المستودع"

