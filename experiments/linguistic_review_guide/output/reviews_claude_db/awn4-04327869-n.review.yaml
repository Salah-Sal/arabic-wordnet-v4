          source: "المورد الحديث (2008)"
          addition: "يجمع «رائحة كريهة» مع «نتن» كترادفَيْن في حقل دلالي واحد — مما يوحي أن الوحدة المعجمية الأصيلة هي «نتن» (المفرد المسكوك)، لا المركب الوصفي الحر «كريه الرائحة»"

    - lemma: "مُنْتِن"
      confirm:
        - text: "«النتن: الرائحة الكريهة... فهو منتن ومنتن»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«النَّتْنُ: الرائحة الكريهة... فهو مُنْتِنٌ»"
          source: "مختار الصحاح للرازي"
        - text: "«نتن الشيء نتناً ونتانةً وأنتن، وشيء نتنٌ ومنتنٌ. ورجال وآباط مناتين»"
          source: "أساس البلاغة للزمخشري"
        - text: "«foetid (fetid)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«نتن... فهو مُنْتِنٌ ومِنْتِنٌ ومُنْتُنٌ ومِنْتِينٌ»"
          source: "لسان العرب لابن منظور"
        - text: "«النَّتْنُ: الرائحة الكريهة، ضِدُّ الفَوْحِ»"
          source: "تاج العروس لمرتضى الزبيدي"
      peripheral_observations:
        - "المعجم الوسيط (Hawramani) يُسجّل كلمة مغايرة: «مَنتِن» (بفتح الميم) بمعنى «موضع النتانة، جمعه مناتن» — وهي اسم مكان على وزن مَفعِل، مختلفة صوتياً وصرفياً عن اسم الفاعل «مُنْتِن» (ضم الميم) الذي هو اسم فاعل من أنتَن"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "نَتِن"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) «أ»، شيء نَتِن. مثل: «ب» شخص حقير أو جدير بالازدراء» — المورد الحديث (2008)"
      reasoning: "وردت في المورد الحديث الترجمةَ الأولى المباشرة لـ stinker — صفة مشبهة من الجذر ن-ت-ن، قابلة للتأسيم الدلالي للدلالة على الشيء النتن"
  knowledge_candidates:
    - lemma: "عَفِن"
      reasoning: "اشتقاق — صفة مشبهة من الجذر ع-ف-ن (وزن فَعِل) دالّة على الفساد والتحلل المصحوب برائحة كريهة؛ قابلة للتأسيم «العَفِن» للدلالة على الشيء المتعفن. آلية التوليد: اشتقاق على وزن فَعِل للدلالة على الحالة الثابتة"
  generation_notes: "المفهوم «شيء ذو رائحة كريهة» لا يمتلك مفرداً اسمياً صرفاً في العربية — الطريق الصرفي المنتج هو تأسيم الصفة (اسم الفاعل أو الصفة المشبهة) من الجذر ن-ت-ن. جذرا ن-ت-ن وع-ف-ن هما المحوران الدلاليان الأقرب إلى التعريف"


