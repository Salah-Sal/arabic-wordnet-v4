step0_evidence:
  per_lemma:

    - lemma: "اتِّصَال"
      confirm:
        - text: "«اتصال: communication» (مجال: الإعلام والتواصل)"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«اتصال: communication» (مجال: الطب)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«اتصال: communication» (مجال: الكهرباء)"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«تماس بين مُوصِلين يسمح بمرور رسالة ما»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«الاتصال: اتحاد الأشياء بعضها ببعض، كاتصال طرفي الدائرة، ويضاده الانفصال»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الأصلي (التلاصق المادي وترابط الأجزاء) يغاير تعريف المجموعة القائم على نقل محتوى فكري أو إعلامي بين الناس"
        - text: "«والاتصال هُوَ مُلَاحظَة العَبْد عينه مُتَّصِلاً بِالوُجُود الأَحَدِي بِقطع النّظر عَن تَقْيِيد وجوده بِعَيْنِه»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "الاتحاد الصوفي بالوجود الإلهي معنى فلسفي أجنبي عن دلالة نقل المعلومات والأفكار بين الناس"
      expands:
        - text: "«الاتصال يطلق على أمرين: اتحاد النهايات [في المقادير]... وعند المحدّثين: عدم سقوط راوٍ من رواة الحديث... وعند المنطقيين: ثبوت قضية على تقدير أخرى... وعند المنجّمين: كون الكوكبين على وضع مخصوص من النظر»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "اصطلاحات علمية متعددة في علم الحديث والمنطق والفلك والرياضيات تُوسّع المادة اللغوية إلى معانٍ تقنية بعيدة عن سياق التواصل الإنساني"
        - text: "«اتصال: intercourse» (مجال: الطب)"
          source: "المعجم الطبي الموحد (2009)"
          addition: "معنى طبي متخصص (الاتصال الجسدي) يُضيف بُعداً دلالياً خارج نطاق تعريف المجموعة"
      peripheral_observations:
        - "المعنى الكلاسيكي الجوهري للفظ «اتصال» هو التلاصق المادي والترابط (ضد الانفصال)؛ معنى نقل الأفكار والمعلومات بين الناس تطوّر دلالي حديث ثبت وترسَّخ في المعاجم التقنية المعاصرة."

    - lemma: "تَوَاصُل"
      confirm:
        - text: "«نقل الأخبار بواسطة العلامات والإشارات بين مرسل إلى متلقٍ عبر قناة ما، حيث يعمل التواصل بشكل جيّد في وضعية تقاسم الشفرة وغياب التشويش، تنتُج وَظيفة التواصل في تعارض مع وظيفة التعبير»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«اتصال متبادل»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«تواصل: communication» (مجال: الفلسفة وعلم النفس)"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«تواصل: communication» (مجال: علم الاجتماع والأنثروبولوجيا)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«الحوار وتمكين الناس من فهم العوامل الرئيسية لبيئتهم المادية والاجتماعية والاقتصادية والسياسية وترابطها بحيث يمكن حل المشكلات الطارئة بكفاءة... التواصل هو حزام نقل بين نشر المعلومات وتخطيط العمل»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يُدرج التواصل في منظومة التمكين المجتمعي والنماذج التشاركية الديموقراطية، مُضيفاً بُعداً سياسياً وتنموياً يتجاوز التعريف المجموعي العام"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "رِسَالَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«خبرٌ مُرسَل يوجه إلى مُرسَل إليه عبر تشفيرات قصد التواصل السردي والشعري لأدب يتوجه إلى قارئ محتمل» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "الرسالة من الجذر ر-س-ل تدل على «شيء يُرسَل/يُنقَل» بين طرفين، وهو ما يتطابق مع محور التعريف «شيء يُنقَل بين الناس»"
    - lemma: "تَبْلِيغ"
      source_section: "step5_english_bridge"
      evidence_citation: "«(2) معلومات مبلَّغة. وبخاصة: (ب) رسالة. (ج) خبر / (3) التواصل: تبادل الفكرات أو الآراء أو المعلومات» (تحت مدخل communication) — المورد الحديث (2008)"
      justification: "التبليغ من ب-ل-غ يدل على إيصال شيء من طرف إلى آخر، وهو ملاصق لمفهوم «ما يُنقَل بين الناس» المنطوق في التعريف"
  knowledge_candidates:
    - lemma: "بَلَاغ"
      justification: "اشتقاق: من الجذر ب-ل-غ على وزن فَعَال الدالّ على الحدث/الشيء المُنجَز؛ يدل بدقة على «ما يُبلَّغ ويُوصَل بين الناس». الوزن مناسب للمحتوى المُنقَل لا للفعل نفسه (مثال: بلاغ صحفي، بلاغ رسمي)."
    - lemma: "خِطَاب"
      justification: "مجاز (إزاحة دلالية): الخطاب أصله «التوجه بالكلام» (من خ-ط-ب)، واستُعمل اصطلاحاً في اللسانيات والفلسفة للدلالة على المحتوى الموجَّه من طرف إلى آخر، وهو من أبرز مقابلات discourse وcommunication في الأدبيات العربية المعاصرة."
  generation_notes: "التعريف يصف مفهوماً مجرداً اسمياً (شيء/محتوى يُنقَل) لا العملية ذاتها. الجذور الدلالية المركزية: و-ص-ل (وصل/تواصل)، ب-ل-غ (بلَّغ/بلاغ)، ر-س-ل (رسالة). المرشحان المؤلَّفان من المعرفة أخصّ من مستوى المجموعة الترادفية."


step1_lemma_validation:
  per_lemma:

    - lemma: "اتِّصَال"
      decision: confirmed
      decision_reason: "مستقر في المعاجم التقنية الحديثة والاستعمال الفصيح المعاصر لمعنى التواصل والإعلام؛ التناقض مع المصادر الكلاسيكية يعكس تطوراً دلالياً معروفاً لا يُسقط اللمّة من المجموعة. اللفظ عربي أصيل (اِفْتِعَال من و-ص-ل)، قابل للاشتقاق (اتّصل، متصل، اتصالي)، خفيف على اللسان، شائع في الفصحى المعاصرة."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركّز على جانب «الوصل والإيصال» القناتي؛ يقبل الدلالة أحادية الاتجاه ويُستعمل كثيراً في السياقات التقنية والمؤسسية (قناة اتصال، شبكة اتصالات). يختلف عن «تواصل» في أنه لا يشترط التبادل بين طرفين."
      example: "تُعدّ الرسائل والتقارير الكتابية أشكالاً من أشكال الاتصال الرسمي المعتمدة في المؤسسات الحديثة."

    - lemma: "تَوَاصُل"
      decision: confirmed
      decision_reason: "أدلة تأكيد قوية ومتسقة من مصادر حديثة متعددة؛ تعريف اللسانيات يوافق دلالة المجموعة مباشرةً. لفظ عربي أصيل (تَفَاعُل من و-ص-ل)، قابل للاشتقاق (تواصَل، متواصل، تواصلي)، واسع الانتشار في الدراسات الإنسانية واللغوية."
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "وزن تَفَاعُل يُصرّح بالمشاركة المتبادلة بين طرفين أو أطراف (يَتَوَاصَلُون معاً)؛ يُلائم سياقات التواصل الإنساني الحواري والاجتماعي أكثر من «اتصال» الذي يميل للدلالة القناتية التقنية. يُفيد التواصلَ الأفقيَّ التشاركي."
      example: "يُسهم التواصل الجيد بين أعضاء الفريق في رفع كفاءة العمل وتحقيق الأهداف المشتركة."

    # ── مرشح خطوة ٠٫٥ — مرفوض ──
    - lemma: "رِسَالَة"
      source: step05
      decision: removed
      decision_reason: "الرسالة أخصّ من المجموعة — هي نوع محدد من أنواع ما يُنقَل (شيء مُرسَل بعينه)، لا الجنس المجرد الشامل. فشل اختبار السكّ: يمكن إبدال «رسالة» بـ«مراسَلة» ويبقى التعبير وصفاً للمفهوم — دليل على أنها تعبير وصفي لا مصطلح في مستوى المجموعة."
      step05_citation: "«خبرٌ مُرسَل يوجه إلى مُرسَل إليه عبر تشفيرات» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      substitution_test:
        result: "fail"

    - lemma: "تَبْلِيغ"
      source: step05
      decision: removed
      decision_reason: "التبليغ يدل على فعل الإيصال (مصدر بلَّغَ) لا على المحتوى المُنقَل ذاته؛ هو العملية لا الكيان. فضلاً عن أنه أخصّ دلالةً (إيصال رسمي/إداري في الغالب) ومُدرَج تحت المجموعة لا في مستواها."
      step05_citation: "«(2) معلومات مبلَّغة. وبخاصة: (ب) رسالة. (ج) خبر» (تحت communication) — المورد الحديث (2008)"
      substitution_test:
        result: "fail"

    - lemma: "بَلَاغ"
      source: step05
      decision: removed
      decision_reason: "البلاغ في الاستعمال المعاصر يدل على البيان الرسمي المُوجَّه (communiqué) وهو أخصّ من المجموعة؛ لا يصلح جنساً مجرداً لكل ما يُنقَل بين الناس. فشل اختبار التثبيت المعجمي كبديل شامل لـ«communication»."
      step05_citation: "معرفة لغوية — اشتقاق فَعَال من ب-ل-غ"
      substitution_test:
        result: "fail"

    - lemma: "خِطَاب"
      source: step05
      decision: removed
      decision_reason: "الخطاب في الاستعمال العربي مرتبط بالوسيط الكلامي أو النصي المُوجَّه (discourse) وهو أخصّ من المجموعة؛ لا يشمل التواصل غير اللفظي (الإيماءات، الإشارات، الصور). فشل اختبار التثبيت المعجمي في هذا المستوى التجريدي."
      step05_citation: "معرفة لغوية — مجاز من خ-ط-ب"
      substitution_test:
        result: "fail"


