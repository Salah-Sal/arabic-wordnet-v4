step05_lemma_generation:
  evidence_candidates:
    - lemma: "زمرة"
      source_section: step5_english_bridge
      evidence_citation: "«زمرة» ↔ group — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      justification: "الجسر الإنجليزي يؤكد «زمرة» مقابلاً رسمياً لـ group في الرياضيات والفيزياء؛ آلية التوليد: مجاز (إزاحة دلالية) — نُقل اللفظ من «جماعة قليلة من الناس» إلى «بنية رياضية منظّمة ذات عملية وشروط» بمشابهة وظيفية (مجموعة منظّمة ذات خصائص محددة)"
  knowledge_candidates:
    - lemma: "زمرة جبرية"
      justification: "تركيب وصفي (زمرة + جبرية) لتحديد المجال؛ آلية التوليد: تركيب وصفي. تحذير: في الاستعمال الرياضي المتخصص «الزمرة الجبرية» قد تُشير تحديداً إلى algebraic group — بنية جبرية-هندسية مركّبة — وهو مفهوم أخص من الزمرة العامة"
  generation_notes: "المصطلح «زمرة» راسخ في معاجم ALECSO ومؤكَّد من مصدرين تخصصيَّين؛ الجسر الإنجليزي أعطى نتائج مباشرة؛ بحث FTS كشف «نظرية الزّمر» (theory of groups) مما يؤكد استقرار الجذر الاشتقاقي"

step1_lemma_validation:
  per_lemma:

    - lemma: "زمرة"
      decision: confirmed
      decision_reason: "مصطلح رياضي مستقر مؤكَّد في معجمَي ALECSO (الرياضيات 1990 والفيزياء 1989)؛ عربي أصيل (جذر ز-م-ر) مُوسَّع دلالياً إلى المجال الرياضي؛ يجتاز بوابة الجودة الستة: مستعمَل فعلياً في النصوص الرياضية، يسير النطق، ملائم للمفهوم، تراثي الأصل، فصيح، اشتقاقي بامتياز (→ زمرة جزئية، زمرة حلقية، زمرة أبيلية، نظرية الزمر)؛ وزن فُعْلة مناسب للمفاهيم المحددة ذات البنية الداخلية"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الشكل المفرد المفضَّل في النصوص الرياضية الفنية البحتة حيث السياق التخصصي يزيل كل لبس؛ يتميز عن «زمرة رياضية» بالإيجاز وارتباطه المباشر بالمشتقات («نظرية الزمر»، «الزمر الجزئية»)"
      example: "تُعدّ زمرة الأعداد الصحيحة مع عملية الجمع النموذجَ الكلاسيكي الأبسط الذي يُقدَّم به مفهوم الزمرة في مقررات الجبر المجرد."

    - lemma: "زمرة رياضية"
      decision: confirmed
      decision_reason: "تعبير مركب وصفي (زمرة + رياضية) يوازي «mathematical group» في الإنجليزية؛ مقبول رغم غياب نص معجمي مباشر لأنه يُزيل الالتباس مع المعنى الاجتماعي للفظ في السياقات التعليمية والتواصلية؛ يجتاز اختبار السكّ المصطلحي (لا يصح إبدال «رياضية» بوصف مرادف دون تغيير الدلالة التخصصية)؛ يجتاز اختبار التثبيت المعجمي (يوازي عنوان المجموعة الأم «مجموعة رياضية» بالتوازي البنيوي ذاته)"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز عن «زمرة» بتصريح القيد المجالي «رياضية» المفيد في الخطاب التعليمي والتواصل مع غير المختصين الذين قد يتبادر إلى أذهانهم المعنى الاجتماعي للفظ؛ الدلالة المفهومية متطابقة مع «زمرة» في السياق التخصصي"
      example: "تُدرَّس الزمرة الرياضية في مقررات الجبر المجرد بوصفها البنية الجبرية التي تجمع الإغلاق والتجميعية ووجود عنصري المحايد والنظير."

    - lemma: "زمرة"
      source: step05
      decision: confirmed
      decision_reason: "يطابق اللمّة الأصلية الموجودة — التحليل الكامل ضمن إدخال اللمّة الأصلية أعلاه"
      step05_citation: "«زمرة» ↔ group — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مطابق للمّة الأصلية «زمرة» — يعزّز صحة اختيارها"

    - lemma: "زمرة جبرية"
      source: step05
      decision: removed
      decision_reason: "«الزمرة الجبرية» تُشير في الاستعمال الرياضي المتخصص إلى algebraic group — بنية تجمع هيكل الزمرة مع هيكل متعدد جبري (كـ GL(n)، SL(n)) — وهو مفهوم أخص يختلف عن «group» العام في نظرية الزمر؛ إضافته لهذه المجموعة الترادفية سيُحدث خلطاً مفاهيمياً بين synset الزمرة العامة وsynset الزمرة الجبرية المتخصصة"
      step05_citation: "لا دليل معجمي مباشر — تحليل مفاهيمي رياضي"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "الزمرة الجبرية مفهوم أخص — كل زمرة جبرية زمرة، وليس كل زمرة جبرية"

step3_definition:
