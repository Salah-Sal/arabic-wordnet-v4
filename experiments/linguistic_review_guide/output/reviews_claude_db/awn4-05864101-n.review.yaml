step0_evidence:
  per_lemma:
    - lemma: "كم"
      confirm:
        - text: "«كم» — [مقابل] quantum"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«كمّ» في علم الفيزياء، يُشيرُ هذا المُصطلح إلى مادة تتوَّلد من خلال تبدّل الحالة داخل نظام مُعيَّن من قيم مُتقّطعة لكمّية فيزيائية، هي الطاقة غالباً. ولا يُمكن أن تظهر الكمّات إلا في نسبٍ مُحدَّدة لتلك الكمّية الفيزيائية، وهي بالتالي (تكمية) لتلك الكمّيات. تُوصَّف الكمّيات المُكمّاة في ميكانيكا الكمّ وفي مجالاتٍ من الفيزياء النظرية."
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«الكَمّ: مَا يقبل الانقسام لذاته»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "دلالة فلسفية أرسطية أوسع: يشمل الكم المتصل (الخط والسطح والزمان) والمنفصل (العدد) — أوسع من الكم الفيزيائي الحديث المنصبّ على المنفصل وحده"
        - text: "«الكم: بالفتح: العرض الذي يقتضي الانقسام لذاته، وهو إما متصل أو منفصل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الكم المنفصل في الفلسفة الإسلامية يتقاطع مع مفهوم الكمية الكمومية المنفصلة في الفيزياء الحديثة، مما يمنح المصطلح شرعية تاريخية"
        - text: "«(الْكمّ) مِقْدَار الشَّيْء (مو)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "(مو) = مصطلح موضوع حديثاً — المعجم الوسيط استوعب المعنى التقني الحديث وأثبته مفرداً"
        - text: "«كَمِّيَّةٌ Quantum, or quantity, as answering to 'how many'»"
          source: "المعجم العربي الإنجليزي لإدوارد وليام لين"
          addition: "يربط «كمّية» بالـquantum الإنجليزي منذ القرن التاسع عشر — يوثّق الجسر الدلالي بين الكم الفلسفي العربي والكم الفيزيائي الحديث"
      peripheral_observations:
        - "كُمّ (بضم الكاف): مدخل اليد ومخرجها من الثوب — معنى مغاير يشترك في الهيئة الإملائية مع «كمّ» الفيزيائي لا صلة له بالمعنى المقصود"
        - "كَمْ (بسكون الميم): اسم استفهام عن العدد — هو الأصل الاشتقاقي الذي انبثق منه مفهوم «الكمّ» للدلالة على الكمية والمقدار"

    - lemma: "كموم"
      contradicts:
        - text: "«كَمُوم: من (ك م م) اجتماع الناس، وتغطية ثمر النخلة حتى ترطب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "«كموم» هو مصدر الفعل «كمَّ» (وزن فُعُول) بمعنى التغطية والاجتماع — لا صلة له بمعنى quantum الفيزيائي؛ الجمع الصحيح لـ«كم» الفيزيائي هو «كمّات» (ARABTERM: «كمّات» = quanta، المفرد: كم)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "كمّ"
      source_section: step5_english_bridge
      evidence_citation: "«كمّ» — [مقابل] quantum في مسرد الهندسة الكهربائية (ArabTerm)؛ «كم» — [مقابل] quantum في المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      justification: "مصدران تقنيان مستقلان في ARABTERM يستخدمان «كمّ» مقابلاً لـquantum — الاشتقاق من الجذر ك-م-م على وزن فَعْل يناسب المصطلح العلمي المجرد وتتوالد منه مشتقات: كمومي، تكميم، ميكانيكا الكم"
  knowledge_candidates:
    - lemma: "فوتون"
      justification: "تعريب مُقَرّ للكم الكهرومغناطيسي (كم الضوء). آلية التوليد: تعريب (ملاذ أخير) — من photon اليونانية الأصل (φῶς = نور). مشهور ومستعمل في الفيزياء العربية لكنه أخص من المفهوم العام لـquantum إذ ينطبق على الإشعاع الكهرومغناطيسي دون سواه من الخصائص الفيزيائية"
  generation_notes: "مصطلح quantum مرتبط بالكمية المنفصلة التي لا تقبل التجزئة — وهذا المفهوم ذاته مجسَّد في التراث الفلسفي العربي بـ«الكمّ المنفصل» في مقابل «المتصل». التوليد يستعيد هذا الإرث ويضيّقه ليلائم الاستعمال الفيزيائي الحديث. جمع «كم» الفيزيائي «كمّات» (ARABTERM) وليس «كموم»"

step1_lemma_validation:
  per_lemma:
    - lemma: "كم"
      decision: confirmed
      decision_reason: "أدلة تقنية مباشرة من مصدرين ARABTERM (الفيزياء والهندسة الكهربائية) — مصطلح مستقر في الاستعمال العلمي العربي المعاصر؛ يرتكز على أصل فلسفي عربي أصيل (الكمّ الفلسفي الأرسطي) مما يمنحه شرعية لغوية وتاريخية"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "يختص بالمعنى الفيزيائي الكمومي الدقيق (أصغر وحدة منفصلة من خاصية فيزيائية)، في مقابل «كمّية» الأعمّ (أي مقدار) و«مقدار» الأعمّ منه (أي شيء يمكن قياسه) — ينحدر من الكم الفلسفي لكنه أخص وأحدث"
      loanword_check:
        is_loanword: false
        calque: true
        calque_analysis: "اقتراض مفهومي (calque دلالي مقبول): استُعير الهيكل المفهومي لـquantum الفيزيائي وأُسقط على «الكمّ» الفلسفي العربي الأصيل مع تضييق نحو المنفصل الفيزيائي الحديث — الهيكل الاستعاري واضح والنتيجة ملائمة"
      quality_gate:
        consistency: "مستعمل في المعاجم التقنية المعتمدة (ARABTERM الفيزياء + الهندسة الكهربائية)"
        ease: "مفردة خفيفة يسيرة النطق والكتابة"
        adequacy: "دقيق في الدلالة على المفهوم الكمومي الفيزيائي"
        heritage_preference: "يوجد أصل تراثي متين (الكمّ الفلسفي عند ابن سينا والجرجاني)"
        arabic_preference: "عربي أصيل من الجذر ك-م-م"
        derivability: "إنتاجية اشتقاقية ممتازة: كمومي، تكميم، مُكمَّم، ميكانيكا الكم، نظرية الكم ✓"
      morphological_check: "وزن فَعْل بالتشديد (كَمٌّ) — مناسب للمصطلح التقني المجرد؛ التشديد يميّزه عن «كَمْ» الاستفهامية (بالسكون) ومن «كُمّ» (بالضم = كم القميص)"
      example: "يُنقل الضوء طاقتَه إلى المادة في كمَّاتٍ متفردة؛ كل كمٍّ يساوي جداءَ ثابت بلانك مضروباً في تردد الإشعاع"

    - lemma: "كموم"
      decision: removed
      decision_reason: "«كموم» مصدر الفعل «كمَّ» (وزن فُعُول) بمعنى اجتماع الناس وتغطية ثمر النخلة — لا صلة له بالمعنى الفيزيائي لـquantum؛ فشل اختبار الإبدال وفشل اختبار السياق الفيزيائي تماماً؛ الجمع الصحيح لـ«كم» الفيزيائي هو «كمّات» (ARABTERM: مسرد الفلسفة وعلم النفس)"
      evidence_assessment:
        case: contradicts
      substitution_test:
        result: fail
        failure_sentences:
          - original: "يمكن للنظام أن يمتلك كمًّا واحداً من الطاقة"
            substituted: "يمكن للنظام أن يمتلك كموماً واحداً من الطاقة"
            preserved_meaning: false
            why_failed: "«كموم» لا تُستعمل في السياق الفيزيائي مطلقاً — يُحيل إلى معنى الاجتماع أو التغطية غير ذي صلة"
      nuance_differentiation: "لا فارق دلالي صحيح يبرر الاحتفاظ بها — هي كلمة مختلفة وظيفياً (مصدر لا اسم مفرد تقني) ومعناها المعجمي مغاير تماماً للمعنى الفيزيائي"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كمّ"
      source: step05
      decision: removed
      decision_reason: "headword_norm = «كم» — مطابق للمّة الأصلية «كم» المؤكَّدة في المجموعة؛ إضافتها كمدخل مستقل تُنشئ تكراراً لا قيمة له"
      step05_citation: "«كمّ» — [مقابل] quantum في مسرد الهندسة الكهربائية (ArabTerm) + المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      nuance_differentiation: "لا فارق — كلاهما headword_norm = كم في قاعدة البيانات؛ الفرق الخطي (التشديد) لا يُنشئ مدخلاً مستقلاً"

    - lemma: "فوتون"
      source: step05
      decision: removed
      decision_reason: "أخص من المطلوب: يدل على كم الإشعاع الكهرومغناطيسي (photon) فحسب — لا يمثل المفهوم العام لـquantum في جميع الخصائص الفيزيائية (الطاقة الحرارية، الزخم، الشحنة...إلخ)؛ فشل اختبار الإبدال في سياقات الكم غير الضوئي"
      step05_citation: "لا دليل معجمي على استخدام «فوتون» مقابلاً عاماً لـquantum — ينحصر استعماله في الفيزياء الضوئية تحديداً"
      nuance_differentiation: "يتضمن قيداً ضيّقاً: الخاصية الفيزيائية = الإشعاع الكهرومغناطيسي فحسب — بينما التعريف يشمل أي خاصية فيزيائية"

