step0_evidence:
  per_lemma:

    - lemma: "إِهَانَة"
      confirm:
        - text: "«الإهانة: الاطراح إذلالاً واحتقاراً»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«أسلوب يتبعه المتكلم عن قصد للحط من قدر مخاطبه، وعادة ما يكون بإطلاق أوصاف مذمومة وأحكام غير مقبولة»"
          source: "مسرد الإعلام والتواصل — ALECSO"
      contradicts:
        - text: "«الإهانة: ما يظهر على يد الكفرة أو الفجرة من خرق العادة مخالفاً لدعواه كذا في مجمع البحرين وغيره»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "معنى اصطلاحي شرعي (نقيض الكرامة المعجزية) يختلف جذرياً عن التعبير اللفظي القبيح"
        - text: "«الإهانة: الأمر الخارق للعادة الصادر على يد من يدّعي النبوة مخالفاً لما ادّعاه»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "معنى اصطلاحي ديني لا يمتُّ للتعبير الإيذائي المقصود في التعريف"
      peripheral_observations:
        - "المعاجم الكلاسيكية تُعرِّف الإهانة بالإطراح والإذلال الجسدي والنفسي — أعمّ من 'تعبير' الذي يُوحي بالقول اللفظي حصراً"

    - lemma: "سَبّ"
      confirm:
        - text: "«سَبَّ فلانًا: شتم فلان»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«سَبّاً: شتمه»"
          source: "المعجم الوسيط"
        - text: "«شتمه: نال من عرضه بالقول القبيح عابَهُ وعَيَّرَهُ»"
          source: "المعجم الكبير"
        - text: "«السَّبُّ: الطعن والشَّتْمُ»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«كل تعبير شائن أو عبارة تحقير أو قدح لا تتضمن نسبة أية واقعة معينة»"
          source: "المعجم الموحد لمصطلحات القانون"
      contradicts:
        - text: "«الثوب الرقيق»"
          source: "كتاب العين"
          conflict: "هذا معنى السِّبّ بكسر السين (خمار/ثوب) لا السَبّ بفتحها — اشتراك لفظي لا تناقض دلالي"
      expands:
        - text: "«السَّبُّ: القدح في نسب شخص، أو نفسه، أو بدنه، أو فعله»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "السَّبُّ أشمل من التعبير الشفهي المبهم — يطال النسب والشخص والبدن والفعل تفصيلاً"
        - text: "«أصل السب القطع، ثم اشتق منه الشتم»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي (القطع المادي) كشف عن الطابع الانقطاعي للشتم — قطع للعلاقة وإهلاك للعرض"

    - lemma: "شَتِيمَة"
      confirm:
        - text: "«(الشتيمة) السب»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
        - text: "«السَّبُّ»"
          source: "المعجم الكبير"
        - text: "«استعمال كلام عنيف لإلحاق الأذى بالمخاطَب»"
          source: "مسرد الإعلام والتواصل — ALECSO"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "ازدراء"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) ازدراء (2) إهانة [توجَّه إلى شخص]» — المورد الحديث (مقابل: contumely)"
      justification: "ظهر كمقابل عربي لـcontumely (أحد مرادفات المجموعة الإنجليزية) في معجم ثنائي معتمد — الازدراء من ز-ر-أ، يدل على الاحتقار والاستخفاف بالآخر"
    - lemma: "هِجاء"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الهِجَاء: السَّبُّ وتعديد المعايب، ويكون بالشِّعر غالباً» — المعجم الوسيط"
      justification: "المعجم يُعادله بالسَّبِّ مباشرةً، وتعديد المعايب جوهرٌ من جوهر دلالة 'تعبير وقح يهدف إلى الأذى'"
  knowledge_candidates:
    - lemma: "ثَلْب"
      justification: "اشتقاق من جذر ث-ل-ب — يُقال في التراث الكلاسيكي 'ثَلَبَهُ: عابه وأكثر ذكر مساوئه'؛ يُرادف السَّبَّ والشتيمةَ في النيل من العرض بالكلام القبيح (آلية التوليد: الاشتقاق)"
    - lemma: "قَدْح"
      justification: "اشتقاق من جذر ق-د-ح، يدل على الطعن في الشرف والعرض بالقول؛ استعمله السيوطي بوصفه جوهر معنى السَبّ: 'القدح في نسب شخص' — وهو من الحقل الدلالي ذاته (آلية التوليد: الاشتقاق)"
  generation_notes: "الحقل الدلالي يتمحور حول الأذى اللفظي المتعمَّد؛ أبرز جذوره العربية: هـ-و-ن (إهانة)، ش-ت-م (شتيمة)، س-ب-ب (سب)، هـ-ج-و (هجاء)، ث-ل-ب، ق-د-ح"


step1_lemma_validation:
  per_lemma:

    - lemma: "إِهَانَة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من مصدرين معتمدَين؛ التناقض ناجم عن الاشتراك الاصطلاحي الشرعي (الإهانة نقيض الكرامة المعجزية) لا عن تعارض في المعنى اللغوي العام"
      evidence_assessment:
        case: "mixed"
        notes:
          - "المداخل المناقِضة تخص معنىً شرعياً اصطلاحياً خاصاً — لا تُعارض المعنى اللغوي للإذلال والتحقير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الإهانة أعمّ من سَبّ وشَتِيمَة — تشمل الإذلال اللفظي وغير اللفظي (بالفعل والموقف لا بالقول فحسب)؛ وهي أكثر رسمية وجدّية في إشارتها إلى عمدية انتهاك الكرامة. يُقال 'تعرّض للإهانة' في السياق الجسدي والمعنوي معاً، بينما السبُّ والشتيمةُ قاصران على التعبير اللفظي"
      example: "رفض القاضي ما وُجِّهَ إليه من إهانةٍ صريحةٍ في قاعة المحكمة وأحال صاحبها إلى النيابة"

    - lemma: "سَبّ"
      decision: confirmed
      decision_reason: "أدلة مؤكدة وافرة من أقدم المعاجم؛ التناقض الظاهر ناجم عن الاشتراك اللفظي مع السِّبّ بكسر السين (= الثوب الرقيق) لا عن اختلاف في المعنى المقصود"
      evidence_assessment:
        case: "mixed"
        notes:
          - "مداخل الثوب الرقيق والخمار والعمامة تخص السِّبّ بالكسر (اشتراك لفظي) لا السَبّ بالفتح والتشديد"
      substitution_test:
        result: "pass"
      nuance_differentiation: "السَّبُّ يُركِّز على فعل الشتم الصريح المباشر في حد ذاته (الفعل الخطابي) — هو أقل رسميةً من إهانة وأشد فجاجةً وأوضح في تناوله للعرض والشرف مباشرةً؛ يصلح مصدراً للفعل (سبَّهُ سَبّاً) في حين الإهانة تُوحي بالنتيجة الاجتماعية"
      example: "نهى النبيُّ ﷺ عن سَبِّ الأموات فقال: لا تسبّوا الأمواتَ فتؤذوا الأحياء"

    - lemma: "شَتِيمَة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة بلا تناقض؛ المعاجم تُعرِّفها مباشرةً بالسَّبِّ وتعديد المعايب"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الشَّتِيمَة هي الوحدة القولية المحدَّدة للشتم — اسم النوع لكلمة الإهانة أو الجملة الشتمية بعينها؛ وهي أكثر تخصيصاً من السَّبّ (الفعل العام) ومن الإهانة (المفهوم الشامل) — يُقال 'وجَّهَ إليه شتيمةً' أي قالَ له كلاماً قبيحاً بعينه، والجمع شَتَائِم يدلّ على تعدّدها وتراكمها"
      example: "لم يَرُدَّ على الشَّتِيمةِ بل انصرف صامتاً إباءً واحتقاراً لصاحبها"

    - lemma: "ازدراء"
      source: step05
      decision: removed
      decision_reason: "الازدراء يدل على الاحتقار الشعوري الداخلي (contempt/disdain) وقد يكون غير لفظي بالكلية؛ أعمُّ من 'تعبير وقح يهدف إلى الأذى' — فشل اختبار الإبدال في السياق اللفظي المحدد"
      step05_citation: "«(1) ازدراء (2) إهانة [توجَّه إلى شخص]» — المورد الحديث (مقابل: contumely)"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "وجَّهَ إليه شتيمةً أمام الجميع"
            substituted: "وجَّهَ إليه ازدراءً أمام الجميع"
            preserved_meaning: false
            why_failed: "الازدراء يصف موقفاً نفسياً لا تعبيراً لفظياً محدداً — 'أظهر ازدراءه' بالصمت أو الإشارة ممكن، بخلاف السب والشتيمة"
      nuance_differentiation: "الازدراء حالة نفسية (contempt) قد تُعبَّر عنها بالكلام أو بغيره؛ لمّات المجموعة تختص بالتعبير اللفظي القبيح المقصود تحديداً"

    - lemma: "هِجاء"
      source: step05
      decision: removed
      decision_reason: "الهجاء مقيَّد عرفاً بالشعر وتعديد المعايب المنظَّم؛ أخصُّ من المعنى العام للمجموعة — يُناسب مجموعة في حقل الأدب (satire) لا مجموعة الشتم العام"
      step05_citation: "«الهِجَاء: السَّبُّ وتعديد المعايب، ويكون بالشِّعر غالباً» — المعجم الوسيط"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "وجَّهَ إليه إهانةً في حادثة طارئة"
            substituted: "وجَّهَ إليه هجاءً في حادثة طارئة"
            preserved_meaning: false
            why_failed: "الهجاء يستلزم تعديداً شعرياً أو نقداً منظَّماً للمعايب؛ لا يصح في الموقف العفوي اليومي"
      nuance_differentiation: "الهجاء ضرب أدبي خاص يُناسب مجموعة (satire/lampoon)؛ المجموعة الحالية تختص بالتعبير اللفظي القبيح اليومي العام بقصد الأذى"

    - lemma: "ثَلْب"
      source: step05
      decision: removed
      decision_reason: "لم يَرِد في قاعدة البيانات المعجمية عند الاستعلام المباشر؛ يحتاج توثيقاً معجمياً مُثبَتاً قبل الإضافة رغم وروده في التراث اللغوي الكلاسيكي"
      step05_citation: "لا دليل في قاعدة البيانات — معرفة لغوية داخلية"
      nuance_differentiation: "ثَلْب مصطلح كلاسيكي يدل على عيب الشخص وإكثار ذكر مساوئه؛ لو ثُبِّت معجمياً لكان مرشحاً صالحاً"

    - lemma: "قَدْح"
      source: step05
      decision: removed
      decision_reason: "القدح أعمُّ من المعنى المقصود — يُستعمل مشروعاً في الجرح والتعديل وقدح الشهود في علم الرواية؛ لا يشترط الوقاحة ولا قصد الأذى الصريح"
      step05_citation: "«القدح في نسب شخص، أو نفسه، أو بدنه، أو فعله» — معجم مقاليد العلوم للسيوطي (ورد في تعريف السَّبّ)"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "وجَّهَ إليه شتيمةً بذيئةً"
            substituted: "وجَّهَ إليه قدحاً بذيئاً"
            preserved_meaning: false
            why_failed: "القدح يشمل الانتقاد المشروع والمنهجي؛ 'قدح بذيء' تركيب مستأنَف يحتاج وصفاً إضافياً لا تحمله الكلمة بذاتها"
      nuance_differentiation: "القدح أخف وطأةً وأوسع نطاقاً — يشمل الانتقاد الموضوعي؛ بينما لمّات المجموعة مقصورة على التعبير القبيح المعادي بقصد الأذى"

  synset_flags:
    definition_review_needed: true


