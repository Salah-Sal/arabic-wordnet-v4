step0_evidence:
  per_lemma:
    - lemma: اختبار تعويضي
      evidence_status: no_material_found

    - lemma: حدث تعويضي
      evidence_status: no_material_found

step05_lemma_generation:
  evidence_candidates:
    - lemma: حصة استدراكية
      source_section: step5_english_bridge
      evidence_citation: >
        «حصة استدراكية» — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم
        (موقع ArabTerm)؛ بمقابل إنجليزي «make-up class». وفي المصدر ذاته:
        «صفّ الاستدراك» (بتعريف: المداركة) — مسرد التربية.
      justification: >
        مصطلح تعليمي موثق في مصادر ALECSO؛ إلا أنه أضيق دلالةً من تعريف المجموعة الذي
        يشمل أي حدث بصرف النظر عن نوعه.

    - lemma: امتحان الإكمال
      source_section: step5_english_bridge
      evidence_citation: >
        «امتحان الإكمال» (المعنى الرابع تحت مدخل make-up) — المورد الحديث (2008)،
        entry_id: 699870.
      justification: >
        مصطلح موثق في أشهر قواميس الترجمة الحديثة؛ لكنه أضيق من المجموعة إذ يقتصر
        على الامتحانات الأكاديمية.

  knowledge_candidates:
    - lemma: حدث استدراكي
      justification: >
        بالاشتقاق والتركيب الوصفي — الجذر (درك) يُعطي مصدر «استدراك» وصفة نسبية «استدراكي»؛
        النمط التركيبي موثق في «حصة استدراكية» و«صفّ الاستدراك». تمديده إلى «حدث استدراكي»
        يُعطي مصطلحاً عاماً يشمل أي نوع من الأحداث. غير أن «حدث استدراكي» لم يُعثر له
        على تثبيت معجمي ولا استعمال تخصصي موثق.

  generation_notes: >
    المفهوم العام (حدث يحلّ محلّ ملغى) يمثّل فجوة معجمية عربية — الاستعمال الموثق
    مقتصر على السياق التعليمي (حصة، صف، امتحان). لا يوجد مصطلح عربي ثابت للمفهوم
    بتجريده الكامل.

step1_lemma_validation:
  per_lemma:
    - lemma: اختبار تعويضي
      decision: removed
      decision_reason: >
        أولاً: لا أدلة معجمية (no_material_found). ثانياً: المصطلح أضيق من تعريف
        المجموعة — يقتصر على الاختبارات/الامتحانات بينما التعريف يشمل أي حدث (رياضي،
        ثقافي، أكاديمي). ثالثاً: «تعويضي» يؤدي معنى (compensatory) لا (substitute
        for cancelled) بدقة؛ وهو اقتراض مفهومي أعوج من الإنجليزية. رابعاً: يفشل
        اختبار السكّ — «اختبار إكمالي» أو «اختبار استدراكي» تصف المفهوم ذاته بقدر
        مساوٍ، مما يكشف أن التعبير مركب وصفي حر لا مصطلح مسكوك.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: >
        يختص بالسياق التقييمي/الأكاديمي دون غيره؛ لا يشمل المباريات الرياضية
        والحفلات الموسيقية والفعاليات الثقافية التي يستوعبها تعريف المجموعة
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: حدث تعويضي
      decision: confirmed
      decision_reason: >
        لا أدلة معجمية مباشرة؛ غير أن اللمّة تُغطي المفهوم العام بأوسع دلالة
        ممكنة وتطابق المُشتمِل (حَدَث). «تعويضي» — رغم كونه تقريباً دلالياً
        (compensatory لا substitute precisely) — هو الصفة الأوسع انتشاراً في
        السياق العربي لهذا المفهوم. لا وجود لبديل أفضل مُثبَّت. بوابة الجودة:
        يُسر التداول ✓؛ اشتقاقية ✓ (عوّض/تعويض/عوض)؛ ملاءمة: تقريبية ⚠؛
        إيثار التراثي: لا يوجد لفظ تراثي بالمعنى ذاته. يُبقى مصطلحاً مرحلياً
        إلى أن يرسو الاستعمال على لفظ أدق. الوزن الصرفي: «تعويضي» صفة مشبّهة
        منسوبة (تَفْعِيل → تَفْعِيلِيّ) — مناسب وظيفياً لوصف النشاط.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: >
        اللمّة الوحيدة المتبقية بدلالة عامة — تُغطي أي نوع من الأحداث (ثقافية،
        رياضية، أكاديمية) المقامة بديلاً عن أخرى ملغاة، خلافاً للمحذوف «اختبار
        تعويضي» المقتصر على التقييم الأكاديمي
      example: >
        أعلنت الجامعة عن الحدث التعويضي لمعرض الفنون الذي أُلغي الأسبوع الماضي،
        وسيُقام خلال الفصل الدراسي المقبل.

    - lemma: حصة استدراكية
      source: step05
      decision: removed
      decision_reason: >
        مصطلح تعليمي موثق لكنه أضيق من المجموعة الترادفية — يقتصر على الحصص
        الدراسية. إدراجه في مجموعة تشمل أي حدث عام يُفضي إلى توسّع غير مبرر
        في دلالة المصطلح. يصلح لمجموعة متخصصة منفصلة إن وُجدت.
      step05_citation: >
        «حصة استدراكية» — مسرد الإعلام والتواصل، المنظمة العربية للتربية
        والثقافة والعلوم (موقع ArabTerm)

    - lemma: حدث استدراكي
      source: step05
      decision: removed
      decision_reason: >
        غير موثق معجمياً. يفشل اختبار التثبيت المعجمي — لم يرد في أي مصدر
        تخصصي أو معجمي. رغم أن النمط الاشتقاقي (استدراك → استدراكي) منتج
        وقياسي، فإن «حدث استدراكي» مركب وصفي حر ابتكاري لا مصطلح مسكوك.
        علاوة على ذلك، «حدث» مستعمل في التعريف نفسه مما قد يُفضي إلى الدوران.
      step05_citation: لم يُعثر عليه في قاعدة البيانات

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: حدث يتم استبداله بحدث تم إلغاؤه مسبقاً
  assessment:
    decision: revise
    reason: >
      الصياغة الحالية تستخدم «يتم» مرتين في جملة واحدة ركاكةً أسلوبية واضحة.
      كما أن العلاقة الاتجاهية ملتبسة في الفهم العربي — «يُستبدَل بحدث تم
      إلغاؤه» توحي بأن المُعرَّف هو الملغى لا البديل. الأصوب في العربية
      توصيف الحدث التعويضي بأنه «ما يحلّ محلّ الملغى» أو «ما يُنظَّم بديلاً
      منه».
  authored_definitions:
    - type: terminological
      text: حدثٌ يُنظَّم بديلاً من حدث آخر مقرَّرٍ كان قد أُلغي
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: ما يُقام من نشاط أو فعالية عوضاً عن آخر كان مقرّراً فأُلغي
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: awn4-07337369-n
        definition_index: 0
        text: حدثٌ يُنظَّم بديلاً من حدث آخر مقرَّرٍ كان قد أُلغي

