        antonym_found: false
        note: >
          لا متضاد اصطلاحي رسمي — المقابل المفهومي «الحدث الأصلي الملغى»
          ليس متضاداً دلالياً وفق تقاليد WordNet؛ بل هو المُحيل/المرجع
          للحدث التعويضي
  verb_checks:
    applicable: false
  selectional_restrictions:
    - lemma: حدث تعويضي
      constraint: >
        مفهوم مجرد يُشير إلى نشاط مُؤسَّسي — لا يتطلب قيوداً اختيارية
        على الفاعل؛ الفاعل المُنظِّم عاقل بالضرورة لكنه ليس قيداً دلالياً
        داخلياً في المصطلح

