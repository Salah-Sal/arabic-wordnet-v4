    test_result: correct
    note: >
      الحدث التعويضي هو حدث ✓ — اختبار is-a ناجح. المُشتمِل المباشر صحيح
      ومناسب؛ لا يوجد مُشتمِل أقرب يناسب هذا المفهوم العام على مستوى الجنس
