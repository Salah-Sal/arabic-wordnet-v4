step0_evidence:
  per_lemma:

    - lemma: "سَبَب"
      confirm:
        - text: "«ما يوصل به، وكل فصل يوصل بشيء فهو سببه — الطريق لأنك تصل به إلى ما تريد»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«كُلُّ شىءٍ يُتوَصَّلُ به إِلى غَيْرِه»"
          source: "المعجم الكبير"
        - text: "«كل شيء يتوصل به إلى غيره»"
          source: "المعجم الوسيط"
        - text: "«سَبَبٌ — cause» (مصطلح في الطب البيطري)"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«سَبَبٌ — cause» (مصطلح قانوني)"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: "«(في الشرع): ما يوصل إلى الشيء ولا يؤثر فيه. كالوقت»"
          source: "المعجم الوسيط"
          conflict: "التعريف الفقهي يشترط عدم التأثير المباشر («لا يؤثر فيه»)، في حين يشترط تعريف المجموعة إحداثَ أثر مباشر («يُحدِث أثرًا»)"
        - text: "«السبب في الشريعة: عبارة عما يكون طريقًا للوصول إلى الحكم غير مؤثر فيه»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "التقليد الفقهي والأصولي يُعرِّف السبب صراحةً بأنه الواسطة غير المؤثِّرة — وهو نقيض وصف «الكيان الذي يُحدِث أثرًا»"
      expands:
        - text: "«السَّبَبُ: الحَبْلُ الذي يصعد به النخل... وسمّي كلّ ما يتوصّل به إلى شيء سَبَباً»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "كشف الأصل المادي (الحبل) عن المسار المجازي للكلمة — انتقال من الحبل الحسي إلى الوسيلة المعنوية؛ بُعد إيتيمولوجي يُثري فهم العلاقة المجازية"
        - text: "«وأصله من السبب الحبل المتوصل به إلى الماء، فاستعير لكل ما يتوصل به إلى شيء، كقوله: وتقطعت بهم الأسباب أي الوصل والمودات»"
          source: "مجمع بحار الأنوار للفتّني"
          addition: "السبب يمتد دلالياً إلى القرابة والمودة — بُعد اجتماعي-علائقي مستقل عن تعريف المجموعة"
      peripheral_observations:
        - "السبب في علم العروض: مصطلح تقني لنمط إيقاعي (حرفان: متحرك فساكن) — معنى مستقل تماماً"
        - "السبب في القانون المدني: الدافع والباعث على التعاقد — معنى قانوني مستقل"

    - lemma: "عَامِل مُسَبِّب"
      confirm:
        - text: "«العامل الذي يعزى إليه المرض أو الإصابة أو الحالة»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      contradicts:
        - text: "entry_id=386794: headword «عامل مسبَب»، translation_en='antenna feed'، domain='Water Engineering'"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "ربط «عامل مسبب» بـ 'antenna feed' — على الأرجح مدخل مختلف أو خطأ في بيانات قاعدة البيانات؛ لا صلة له بمفهوم العامل المُسبِّب للأثر"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "عِلَّة"
      source_section: "step5_english_bridge"
      evidence_citation: "«علّة — cause» — مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
      justification: "المصطلح الفلسفي العربي الكلاسيكي للسبب المؤثر — خاصةً «العلة الفاعلة» التي تُنتج الأثر مباشرةً وتقابل efficient cause؛ أقرب إلى causal agent من «السبب» الذي يعني في الأصل الوسيلة"
    - lemma: "مُسَبِّب"
      source_section: "step5_english_bridge"
      evidence_citation: "«مُسَبِّب — causative» — المعجم الطبي الموحد (2009)"
      justification: "اشتقاق (اسم فاعل من سبَّب على وزن مُفَعِّل) يدل على الكيان الذي يُحدِث التسبيب؛ يقابل causative agent مباشرةً في الخطاب الطبي"
  knowledge_candidates:
    - lemma: "فَاعِل"
      justification: "اشتقاق (اسم فاعل من فَعَل) — في الفلسفة العربية الكلاسيكية «الفاعل» هو المبدأ الذي يصدر عنه الفعل ويُنتج الأثر؛ مجاز وظيفي من «الفاعل النحوي» إلى «العلة الفاعلة الأنطولوجية»"
    - lemma: "مُوجِد"
      justification: "اشتقاق (اسم فاعل من أوجَد على وزن مُفعِل) — يعني الكيان الذي يُخرج الأثر من العدم إلى الوجود؛ يقابل دلالياً «any entity that produces an effect»"
  generation_notes: "الحقل الدلالي العربي الكلاسيكي يُفرِّق بين السبب (الواسطة) والعلة (المؤثر المباشر) والفاعل (المُنشئ). تعريف المجموعة يجمع هذه الفروق في مفهوم واحد — المصطلح المُركَّب الحديث هو الأقدر على التعبير عن هذا الجمع."


step1_lemma_validation:
  per_lemma:

    - lemma: "سَبَب"
      decision: confirmed
      decision_reason: "راسخ في الفصحى التراثية والمعاصرة بمعنى العلة والداعي والوسيلة المؤدية إلى الأثر؛ التناقض الفقهي (السبب لا يؤثر) لا يُلغي الاستعمال اللغوي العام الذي يُثبت دلالة الكيان المُفضي إلى الأثر؛ عالي الاشتقاقية (يُسبِّب، مُسبِّب، سببية، مُسبَّب)؛ وزن فَعَل ملائم للمفاهيم التجريدية كالعلة والسبب؛ لا اقتراض ولا ترجمة حرفية."
      evidence_assessment:
        case: mixed
        notes:
          - "التقليد الفقهي والأصولي يُقيِّد «السبب» بعدم التأثير المباشر — مخالف لتعريف المجموعة"
          - "الاستعمال اللغوي العام (كتاب العين، المعجم الكبير، المعجم الوسيط) يُثبت دلالة الوسيلة الموصلة إلى الأثر"
      substitution_test:
        result: pass
      nuance_differentiation: "يغطي الجانبَ التجريدي من المفهوم (العلة والداعي والوسيلة) ويصلح للأسباب المادية والمجردة؛ أكثر شيوعاً من «عامل مسبب» في الاستعمال غير المتخصص؛ لا يُقيِّد الكيان بالطابع الفاعلي الصريح."
      example: "كان الجهلُ سببَ كثير من الكوارث التي حلّت بالأمم عبر التاريخ."

    - lemma: "عَامِل مُسَبِّب"
      decision: confirmed
      decision_reason: "مصطلح علمي مُثبَّت في معجم المصطلحات الطبية (1985)؛ مركب وصفي عربي أصيل (عامل: اسم فاعل من عَمِل على وزن فاعِل + مسبِّب: اسم فاعل من سبَّب على وزن مُفعِّل)؛ يجتاز اختبار التثبيت المعجمي بورود كليهما في المعجم المتخصص كوحدة واحدة؛ يُجسِّد مفهوم causal agent بدقة؛ لا اقتراض ولا ترجمة حرفية عمياء — التركيب عربي البنية."
      evidence_assessment:
        case: confirm_only
        notes:
          - "مدخل المياه (entry_id=386794 بترجمة 'antenna feed') مدخل مختلف أو خطأ في البيانات — متجاهَل"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "يُركِّز على الجانب الفاعلي الصريح للكيان المُحدِث للأثر؛ أدق من «سبب» في السياقات العلمية والطبية حيث تُحدَّد العوامل الفاعلة تحديداً (فيروس، بكتيريا، عامل كيميائي، قوة طبيعية)."
      example: "حدَّد الباحثون العاملَ المُسبِّبَ للوباء في وقت مبكر مما أسهم في احتوائه."

    - lemma: "عِلَّة"
      source: step05
      decision: removed
      decision_reason: "في العربية المعاصرة انحصر استعمال «عِلَّة» في معنى المرض والعاهة الجسدية؛ معناها الفلسفي (السبب المؤثر) قديم مهجور في الاستعمال الحي؛ فشل اختبار السكّ — بديلها في التداول الحديث هو «سبب» أو «عامل»؛ الإدراج سيُضاف إرباكاً دلالياً حاداً."
      step05_citation: "«علّة — cause» — مسرد الفلسفة وعلم النفس (ArabTerm)"

    - lemma: "مُسَبِّب"
      source: step05
      decision: removed
      decision_reason: "صفة (اسم فاعل كنعت) لا اسم كيان مستقل — يصف خاصية التسبيب لا الكيان نفسه؛ وظيفته كنعت ملازم (مُسبِّب للمرض، عامل مُسبِّب) لا كمصطلح مفرد يدل على «أيّ كيان يُحدِث أثرًا»؛ فشل اختبار الإبدال كمفرد مستقل."
      step05_citation: "«مُسَبِّب — causative» — المعجم الطبي الموحد (2009)"

    - lemma: "فَاعِل"
      source: step05
      decision: removed
      decision_reason: "في الاستعمال الشائع يُقيَّد بصاحب الفعل الإرادي (فاعل عاقل)؛ لا يشمل الأسباب الطبيعية والعوامل غير الإرادية كما يقتضي تعريف المجموعة («أيّ كيان»)؛ المعنى النحوي الغالب يحجب المعنى الفلسفي المقصود."
      step05_citation: "معرفة داخلية — اشتقاق فلسفي"

    - lemma: "مُوجِد"
      source: step05
      decision: removed
      decision_reason: "نادر الاستعمال المصطلحي المستقل في هذا الحقل الدلالي؛ فشل اختبار التثبيت المعجمي — لم يُسجَّل في معاجم متخصصة بمعنى causal agent؛ استعماله مقيَّد بالسياق الديني (الله المُوجِد للمخلوقات)."
      step05_citation: "معرفة داخلية — اشتقاق من أوجَد"


