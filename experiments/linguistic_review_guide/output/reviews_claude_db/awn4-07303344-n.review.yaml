step0_evidence:
  per_lemma:
    - lemma: "حدث اجتماعي"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "المركب الوصفي «حدث اجتماعي» غير مُدرج كوحدة معجمية مستقلة في أي من مصادر قاعدة البيانات المستعلَمة؛ وقد أسفر الاستعلام المباشر (المطابقة الدقيقة) والبحث النصي الكامل كلاهما عن نتيجة سلبية للمركب ككل."

    - lemma: "مناسبة اجتماعية"
      expands:
        - text: "«(2) «أ» حادثة. «ب» حَدَثٌ؛ حادثة هامة. «ج» مناسبة اجتماعية» — المورد الحديث (2008)"
          addition: "يُثبت أن «مناسبة اجتماعية» مستخدَمة في المعاجم ثنائية اللغة المعاصرة ترجمةً عربية راسخة للفظ الإنجليزي event في سياقه الاجتماعي، مما يوسّع دائرة التوثيق إلى الاستعمال المعجمي الحديث دون توثيق مباشر للمركب العربي كمدخل مستقل."
        - text: "«(2) مناسَبة — (8) احتفال؛ مهرجان» — المورد الحديث (2008) [مدخل: occasion]"
          addition: "يربط «مناسبة» بحقل دلالي يشمل الاحتفال والمهرجان، مما يُفيد في تحديد نطاق المفهوم ضمن المجموعة الترادفية."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مناسبة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(2) مناسَبة — (8) احتفال؛ مهرجان» — المورد الحديث (2008) [مدخل: occasion]"
      justification: "كلمة «مناسبة» مفردة راسخة في المعجمية العربية الحديثة تحمل دلالة الحدث/الفرصة الاجتماعية، وترد في المعاجم الثنائية كمقابل لـ occasion وevent."
  knowledge_candidates:
    - lemma: "مَحْفِل"
      justification: "اشتقاق على وزن مَفْعِل (مكان/زمان الحدث) من جذر ح-ف-ل الذي تؤكده أساس البلاغة: «محفل القوم ومحتفلهم» — وهو مكان اجتماعهم؛ آلية التوليد: اشتقاق (وزن مَفْعِل للمكان والزمان). اللفظ راسخ في الفصحى الكلاسيكية والمعاصرة (المحافل الدولية، المحافل الرسمية)."
  generation_notes: "لم يُسفر الجسر الإنجليزي (البحث بـ social event / social occasion / social gathering / social function) عن أي نتيجة في قاعدة البيانات. الاستعلام بالكلمات المفتاحية العربية أنتج حقلاً دلالياً غنياً (احتفال، مناسبة، مهرجان، حفلة) لكن معظمه أشد خصوصية من المفهوم المستهدف."

