        circular: false
        passed: true
    - type: linguistic
      text: "كل حدث يقع بين جماعة من الناس أو يجمعهم في إطار اجتماعي مشترك."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
