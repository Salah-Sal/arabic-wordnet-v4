          type: usage
          source: "مؤلَّف"
        - text: "فقدَتِ المرأةُ ابنَها الوحيد الذي كان كلَّ شيءٍ في حياتها"
          type: usage
          source: "مؤلَّف"
      pos_check:
        pos: noun
        pos_mismatch: true
        # ملاحظة: «كل شيء» في البنية الصرفية هو مضاف+مضاف إليه (تركيب إضافي حرّ)
        # لا يختلف عن «كل أمر» أو «كل ما» — ليس اسماً مستقلاً بالمعنى الصرفي

