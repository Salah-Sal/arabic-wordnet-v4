# مراجعة المجموعة الترادفية awn4-90004801-n
# synset: كل شيء — "كل الأشياء التي لها أهمية بالغة بالنسبة للشخص"
# مراجع: نظام AWN4 | تاريخ المراجعة: 2026-03-12

# ══════════════════════════════════════════════════════════════
# الخطوة ٠: استخلاص الأدلة المعجمية
# ══════════════════════════════════════════════════════════════
# ملاحظة منهجية: الاستعلام عن «كل شيء» كمدخل مركب لم يُسفر عن أي نتيجة في قاعدة البيانات.
# استُعمل الاستعلام عن «الكل / كل» للحصول على الأدلة الأقرب صلةً.
# ——————————————————————————————————————————————————————————————

step0_evidence:
  per_lemma:

    - lemma: "كل شيء"
      # لا مدخل معجمي مباشر لـ«كل شيء» كتركيب اسمي مستقل
      # الأدلة الواردة مصدرها مداخل «الكلّ» و«كلّ» باعتبارها أقرب عنصر مُوثَّق
      expands:
        - text: "«كلمة تفيد الاستغراق لأفراد ما تضاف إليه أو أجزائه، نحو: {كل امرئ بما كسب رهين}»"
          source: "المعجم الوسيط"
          addition: "الاستغراق الشامل غير المقيَّد — يدل على جميع الأفراد دون قيد الأهمية البالغة أو البُعد الشخصي الوجداني"
        - text: "«الكُلُّ، بالضم: اسمٌ لجميعِ الأَجْزاءِ، للذَّكَرِ والأنثى»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "كلية منطقية: مجموع جميع الأجزاء — أوسع من تعريف المجموعة الذي يُقيِّده بالأهمية الشخصية البالغة"
        - text: "«لفظ كُلٍّ هو لضمّ أجزاء الشيء، وذلك ضربان: أحدهما الضامّ لذات الشيء وأحواله المختصة به، ويفيد معنى التمام»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "دلالة الكمال والتمام المطلق — أشمل وأعم من المعنى الوجداني المقيَّد في تعريف المجموعة"
        - text: "«الكلّ في الاصطلاح: اسم للحق تعالى باعتبار الحضرة الوحدية الإلهية الجامعة للأسماء. وفي اللغة: المجموع المعيَّن»"
          source: "دستور العلماء للأحمدنكري"
          addition: "توسيع فلسفي/صوفي للمعنى الاستغراقي — يتجاوز كلياً النطاق الشخصي الوجداني"
      peripheral_observations:
        - "«كل ما يملك — to lose one's all» — المورد الحديث (2008): أقرب دلالياً للحقل الشخصي/الملكي لكنه مقيَّد بالامتلاك المادي لا الأهمية الوجدانية"
        - "معجم الصواب اللغوي لأحمد مختار عمر يشير إلى جواز دخول أل التعريف على «كلّ» لكن الأفصح إبقاؤها بدون أل"


# ══════════════════════════════════════════════════════════════
# الخطوة ٠٫٥: توليد لمّات من التعريف (بدون الاطلاع على اللمّات الموجودة)
# ══════════════════════════════════════════════════════════════
# المدخل: التعريف فقط — «كل الأشياء التي لها أهمية بالغة بالنسبة للشخص»
# نوع الكلمة: اسم | المُشتمِل: شيء (كيان لم يُسمَّ بشكل محدد)
# ——————————————————————————————————————————————————————————————

step05_lemma_generation:
  evidence_candidates:
    - lemma: "الكلّ"
      source_section: step4_fts_keyword
      evidence_citation: "«الكُلُّ، بالضم: اسمٌ لجميعِ الأَجْزاءِ» — القاموس المحيط للفيروزآبادي"
      justification: "اسم يدل على مجموع ما تحت مفهوم ما بالاستغراق الشامل — من جذر ك-ل-ل، آلية: اشتقاق اسمي. يقابل جانباً من التعريف (الشمولية) لكنه يفتقر إلى القيد الوجداني «الأهمية البالغة للشخص»"
  knowledge_candidates:
    - lemma: "الكلّ في الكلّ"
      justification: "تعبير اصطلاحي مُثبَّت في المعاجم الثنائية (المورد الحديث 2008: «all in all = كلّ شيء؛ الكلّ في الكلّ / على العموم»). آلية: تركيب ظرفي تكراري مُسكَّك. غير أن دلالته تميل إلى المعنى الكلي المجمَّع لا إلى التخصيص بالأهمية الشخصية"
    - lemma: "الأهم"
      justification: "صيغة تفضيل اسمية (أَفْعَل التفضيل) من جذر أ-ه-م — آلية: اشتقاق على وزن أَفْعَل. يُركِّز على بُعد الأهمية من التعريف، لكنه مفرد (الأكثر أهمية) وليس جمعاً (كل الأشياء المهمة)، فضلاً عن أنه أقرب للاستعمال الوصفي منه للاستعمال الاسمي المستقل"
  generation_notes: "المفهوم المُعرَّف — «كل الأشياء ذات الأهمية البالغة للشخص» — لا يملك في العربية مقابلاً مُفرداً أو مركباً مُثبَّتاً معجمياً بهذه الدلالة الوجدانية المقيَّدة. الاستعمال العربي الطبيعي لهذا المعنى يعتمد على عبارات وجدانية سياقية كـ«أنت دنياي» و«أنت وجودي» و«أنت حياتي» — وهي استعارات مجازية لا مصطلحات مسكوكة"


# ══════════════════════════════════════════════════════════════
# الخطوة ١: التحقق من اللمّات
# ══════════════════════════════════════════════════════════════

step1_lemma_validation:
  per_lemma:

    # ── اللمّة الأصلية: كل شيء ──
    - lemma: "كل شيء"
      decision: escalated
      decision_reason: "تركيب حرّ غير مُعجمَن + لا وجود معجمي كمدخل مركب مستقل + التعريف يفتقر إلى سند لغوي مباشر للمعنى المُقيَّد بالأهمية الشخصية"

      evidence_assessment:
        case: expands
        notes:
          - "المعاجم توثّق «كلّ» كأداة استغراق (أوسع من المعنى المقيَّد في التعريف)"
          - "لا مدخل معجمي مباشر لـ«كل شيء» كوحدة معجمية اسمية"

      mwe_check:
        is_mwe: true
        accepted: false
        mwe_type: "وصفي حرّ (كمٌّ + اسم نكرة)"

      substitution_test:
        result: fail
        failure_sentences:
          - original: "أنت كل شيء بالنسبة لي"
            substituted: "أنت كل أمر بالنسبة لي"
            preserved_meaning: true
            why_failed: "نجاح الإبدال بـ«أمر» يُثبت أن «شيء» ليست جزءاً ثابتاً من التعبير المسكوك — التركيب حرّ ومفتوح، لا يختبر الإبدال الدلالي بل التركيبي"
          - original: "صحته كل شيء بالنسبة له"
            substituted: "صحته كل ما يهمه بالنسبة له"
            preserved_meaning: true
            why_failed: "يمكن إبدال «كل شيء» بـ«كل ما يهم» أو «كل ما يعز» دون فقدان المعنى — ليس تعبيراً اصطلاحياً ثابتاً"

      nuance_differentiation: "لا تمييز دلالي جوهري يفصل «كل شيء» عن مرادفاتها الحرّة (كل أمر، كل ما يعز، كل ما يهم) — التمييز سياقي وجداني لا معجمي ثابت. المعنى الخاص بالمجموعة (الأهمية البالغة الشخصية) يأتي من السياق لا من البنية المعجمية"

      actions:
        - command: set_confidence
          params:
            entity_type: sense
            entity_id: "{auto}"
            score: 0.25

    # ── مرشح من الخطوة ٠٫٥: الكلّ ──
    - lemma: "الكلّ"
      source: step05
      decision: removed
      decision_reason: "يفتقر إلى القيد الوجداني «الأهمية البالغة للشخص» — دلالته منطقية/فلسفية (مجموع الأجزاء) لا وجدانية شخصية. اختبار الإبدال: «أنت الكلّ بالنسبة لي» ممكن لكن غير طبيعي ومرفوض أسلوبياً"
      step05_citation: "«الكُلُّ، بالضم: اسمٌ لجميعِ الأَجْزاءِ» — القاموس المحيط للفيروزآبادي"
      substitution_test:
        result: fail
        failure_sentences:
          - original: "أنت كل شيء بالنسبة لي"
            substituted: "أنت الكلّ بالنسبة لي"
            preserved_meaning: false
            why_failed: "«الكلّ» ذات طابع فلسفي/منطقي — لا يُوظَّف في الخطاب الوجداني الطبيعي بهذا المعنى"
      nuance_differentiation: "أضيق دلالةً من الحاجة (فلسفي/منطقي) وأشمل من التعريف في آن (لا يشترط الأهمية الشخصية)"

    # ── مرشح من الخطوة ٠٫٥: الكلّ في الكلّ ──
    - lemma: "الكلّ في الكلّ"
      source: step05
      decision: removed
      decision_reason: "تعبير يُفيد «على العموم / حين يُأخذ كل شيء بعين الاعتبار» — دلالة إجمالية استعراضية لا دلالة أهمية شخصية وجدانية. اختبار السكّ: يمكن تعديل مكوناته «الكلّ في المجموع» بمعنى مقارب → تركيب وصفي نسبياً. اختبار التثبيت: ورد في المورد الحديث ترجمةً لـ«all in all» لا كمصطلح مستقل"
      step05_citation: "«(1) كلّ شيء؛ «الكلّ في الكلّ» (2) على العموم» — المورد الحديث (2008) ترجمة «all in all»"
      mwe_check:
        is_mwe: true
        accepted: false
        mwe_type: "تركيب ظرفي تكراري — نقل حرفي (Calque) من «all in all»"
      nuance_differentiation: "يدل على خلاصة الأمور وإجمالها لا على الأهمية الشخصية البالغة"

    # ── مرشح من الخطوة ٠٫٥: الأهم ──
    - lemma: "الأهم"
      source: step05
      decision: removed
      decision_reason: "صيغة وصفية تفضيلية (أَفْعَل) لا اسمية — لا تؤدي وظيفة الاسم المستقل في السياقات المستهدفة. اختبار الإبدال: «أنت الأهم بالنسبة لي» يتحول إلى وصف لا إلى الاسم المقصود في التعريف"
      step05_citation: "اشتقاق داخلي من جذر أ-ه-م — لم يرد في مصادر خارجية بهذه الدلالة الاسمية"
      nuance_differentiation: "يدل على صفة (الأكثر أهمية) لا على مجموع «كل الأشياء المهمة»"

  synset_flags:
    definition_review_needed: true
    split_needed: false


