step5_enrichment:
  per_lemma:
    - lemma: "كل شيء"
      enrichment:
        root: "ك-ل-ل / ش-ي-أ"
        # التركيب ثنائي الجذر: «كلّ» من ك-ل-ل و«شيء» من ش-ي-أ
        # لا يمكن تعيين جذر موحّد لتركيب حرّ من جزأين متباينَي الجذر
      examples:
