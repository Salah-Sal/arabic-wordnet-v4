step0_evidence:
  per_lemma:

    - lemma: "جَوْدَة"
      confirm:
        - text: "«جَوْدَة: من (ج و د) أن يصبح الشيء جيداً، ومن يأتي بالجيد من قول أو عمل، وإسراع الفرس في العدو»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«جودة مُنتج أو أداء أو ما إلى ذلك»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«مجملُ السماتِ والمميزاتِ، لمنتَجٍ أو خدمةٍ، المتصلةِ بمقدرة المنتَج أو الخدمة على الوفاء بحاجات معيّنة»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«مجموعة خواص يتم بموجبها قبول السلعة أو رفضها»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«(الْجَوْدَة) جودة الْفَهم (فِي اصْطِلَاح أهل النّظر) صِحَة الِانْتِقَال من الملزومات إِلَى اللوازم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "جودة الفهم مصطلح منطقي كلاسيكي يُوسِّع المعنى نحو صحة الاستدلال — أخصّ من الصفة الجوهرية العامة"
        - text: "«جَوْدَةُ الفَهْم (عند أهل المنطق): صحَّة الانتقال من المقدِّمـاتِ إلى النَّتـائج، وحُسْن إدراكِ المعاني والعلاقاتِ»"
          source: "المعجم الكبير"
          addition: "توافق مع مدخل الوسيط — عبارة معجمية ثابتة في المنطق الكلاسيكي تجعل الجودة مصطلحاً خاصاً بالاستدلال"
        - text: "«جودة الفهم: صحة الانتقال من الملزومات إلى اللوازم»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "أقدم توثيق كلاسيكي للاستعمال المنطقي — ثلاثة مصادر مستقلة تُثبِّت هذا المعنى الاصطلاحي الأخص"
      peripheral_observations:
        - "«جُودَةُ: بزيادة الهاء، قلت جودة: في واد باليمن» — معجم البلدان لياقوت الحموي: اسم علم جغرافي مستقل كلياً لا علاقة له بالمعنى المعجمي"

    - lemma: "نَوْعِيَّة"
      confirm:
        - text: "«(2) نوع؛ نوعيّة food of poor quality» + «(4) كيفيّة؛ جودة used to look for quality rather than quantity»"
          source: "المورد الحديث (2008)"
        - text: "«نوعية، صفة» [ترجمة: quality]"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«خاصية، جودة، نوعية» [ترجمة: quality]"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«نوعية المحاصيل» [crop quality]، «نوعية البيانات» [data quality]، «نوعية الطحن» [milling quality]، «نوعية النقل» [transporting quality]"
          source: "المَكنَز الزراعي متعدد اللغات"
      contradicts:
        - text: "«يدل مصطلح النوعية على علاقة الانتماء التي تنطبق على مدلول الوحدات المعجمية المدروسة. وهو يرتبط بمنطق الطبقات، فمثلا، ينتمي اسم [كلب] لنوعية أو جنس هو [حيوان]» [ترجمة: Hyponymy]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "النوعية = Hyponymy (علاقة الاشتمال الدلالي) في اللسانيات — مفهوم مختلف كلياً عن 'صفة جوهرية مميزة'"
        - text: "«نَوعِيَّةٌ» [ترجمة: specificity / specificness]"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "النوعية = specificity (الخصوصية التشخيصية) في الطب — مقياس دقة الاختبار التشخيصي، مختلف كلياً عن مفهوم الصفة الجوهرية"
        - text: "«نوعية» [ترجمة: specificity]"
          source: "مسرد الفلسفة وعلم النفس"
          conflict: "التضارب في مجال الفلسفة — الأكثر صلة بتعريف هذه المجموعة — يُضعف ثقة الربط بين النوعية وقيمة quality الفلسفية"
        - text: "«نوعية» [ترجمة: specificity]"
          source: "مسرد علم الاجتماع والأنثروبولوجيا"
          conflict: "أربعة مصارد مستقلة تُرجمت النوعية بـ specificity — نمط متسق يدل على خلط مصطلحي موثَّق"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "كَيْفِيَّة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(الْكَيْفِيَّة) مصدر صناعي من لفظ كَيفَ... وَكَيْفِيَّة الشَّيْء حَاله وَصفته» — المعجم الوسيط لمجموعة من المؤلفين؛ وكذلك: «الكيفية: منسوبة إلى كيف، وهي معرفة الحال» — التوقيف على مهمات التعاريف للمناوي؛ وفي arabterm: «كيفية، كيف» = quality في مسردي الفلسفة وعلم الاجتماع"
      justification: "الكيفية هي المقابل الفلسفي الأرسطي الكلاسيكي لـ quality (ποιότης) — أحد المقولات العشر، تُجيب عن السؤال «كيف هو الشيء؟» وتُميِّزه — مناظرة دقيقة لتعريف المجموعة؛ آلية التوليد: اشتقاق (مصدر صناعي على فَعْلِيَّة من الحرف كيف)"
    - lemma: "خَصِيصَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«خَصِيصَةُ الشىءِ: خاصَتُه, وهى الصِّفَة التى تُميِّزه وتُحَدِّدُه» — المعجم الكبير؛ وكذلك: «(الخصيصة) الصّفة الَّتِي تميز الشَّيْء وتحدده (ج) خَصَائِص» — المعجم الوسيط لمجموعة من المؤلفين"
      justification: "خصيصة تُعرَّف في المعجمين تعريفاً يُطابق تعريف المجموعة مطابقةً شبه حرفية — الصفة المميِّزة المحدِّدة؛ آلية التوليد: اشتقاق (فَعِيلَة من خَصَّ يَخُصُّ)"
  knowledge_candidates:
    - lemma: "سَجِيَّة"
      justification: "اشتقاق من س-ج-و (سجا يسجو = ثبت ودام على الحال)؛ السجية = الطبيعة الراسخة والخلق الجِبِلِّي — صفة جوهرية مميزة تنتمي إلى الشخص بالفطرة؛ تستوفي شرط 'صفة جوهرية مميزة' لكنها مقيّدة بالأشخاص دون الأشياء المادية"
  generation_notes: "التعريف يتوافق مع مفهوم الكَيْف الأرسطي (الكيفية) — المصطلح الفلسفي الأدق؛ خصيصة هي الأشيع في الاستعمال التقني؛ سجية مرشحة محدودة النطاق"

step1_lemma_validation:
  per_lemma:

    - lemma: "جَوْدَة"
      decision: confirmed
      decision_reason: "مستخدمة على نطاق واسع ترجمةً لـ quality في المعاجم التقنية العربية عبر حقول متعددة؛ بوابة الجودة: الاطّراد والشيوع — نعم؛ يُسر التداول — نعم؛ الملاءمة — تقريبية (جودة تحمل تحيزاً نحو الإيجابية من الجذر ج-و-د = كان جيداً، بينما التعريف محايد)؛ الاشتقاقية — جودة → تجويد، جيِّد، جوَّد ✓؛ إيثار العربي — نعم"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميز عن 'نوعية' بارتباطها الأصيل بالتقييم الإيجابي — الجيد والرفيع (من جاد = كان جيداً)، فضمّها لهذا السياق يرتكز على الاستعمال الاصطلاحي لا الأصل اللغوي؛ تتميز عن 'كيفية' بشيوعها في التداول التقني الحديث على حساب الدقة الفلسفية؛ قد تنتمي أصلاً لمجموعة ترادفية 'درجة الامتياز' أكثر من 'الصفة الجوهرية'"
      example: "يسعى الفنيون إلى رفع جودة المنتج بتحسين خصائصه وتدقيق سماته في كل دورة إنتاجية."

    - lemma: "نَوْعِيَّة"
      decision: escalated
      decision_reason: "تضارب توثيقي حاد في مصادر متعددة ذات صلة مباشرة: المعجم الطبي الموحد + مسرد الفلسفة + مسرد علم الاجتماع + معجم اللسانيات — كلها تُرجمت النوعية بـ specificity أو Hyponymy لا quality؛ التضارب في الفلسفة — المجال الأكثر صلة بتعريف هذه المجموعة — يستوجب مراجعة بشرية لتحديد هل النوعية تخدم هذا السياق الدلالي الفلسفي المحايد"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميز عن 'جودة' بمحاولتها تمثيل النوع والطبيعة (نَوْعِيَّة = ما يتعلق بالنوع) — أقل ارتباطاً بالامتياز؛ الإشكالية الجوهرية: أربعة مصادر علمية مستقلة تُثبِّت النوعية بمعنى specificity مما يُنشئ تداخلاً مع مفهوم مختلف تماماً"
      actions:
        - command: set_confidence
          params:
            entity_type: sense
            entity_id: "{auto}"
            score: 0.35

    - lemma: "كَيْفِيَّة"
      source: step05
      decision: confirmed
      decision_reason: "المصطلح الفلسفي الأرسطي الكلاسيكي لـ quality — موثَّق في المعجم الوسيط والتوقيف للمناوي وموسوعة السلطان قابوس؛ يُستخدم في arabterm ترجمةً لـ quality في مسردي الفلسفة وعلم الاجتماع؛ بوابة الجودة: إيثار التراثي — أعلى درجة، دقة الملاءمة — ممتازة، الاشتقاقية — كيفية → كيفيات، كيفي ✓؛ الوزن الصرفي فَعْلِيَّة (مصدر صناعي) مناسب للمفاهيم المجردة الفلسفية"
      step05_citation: "«(الْكَيْفِيَّة) مصدر صناعي من لفظ كَيفَ... وَكَيْفِيَّة الشَّيْء حَاله وَصفته» — المعجم الوسيط لمجموعة من المؤلفين"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميز عن 'جودة' بدلالتها الفلسفية المحايدة (لا حكم تقييمي — تُجيب عن كيف هو الشيء دون إيجابية أو سلبية)؛ تتميز عن 'خصيصة' بشمولها للمقولة الفلسفية الكاملة (الكيف من المقولات العشر) لا مجرد الصفة التمييزية؛ الوزن الصرفي: مصدر صناعي مناسب للمفاهيم المجردة"
      example: "عَدَّ الفلاسفةُ الكيفيّاتِ الجوهريّةَ كالحرارةِ والبرودةِ صفاتٍ راسخةً تُميِّز الأجسامَ وتُحدِّدُ طبائعَها وتُجيب عن السؤال «كيف هو؟»."
      actions:
        - command: create_entry
          params:
            lemma: "كَيْفِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04731092-n"

    - lemma: "خَصِيصَة"
      source: step05
      decision: confirmed
      decision_reason: "التعريف المعجمي يطابق تعريف المجموعة مطابقةً شبه حرفية: 'الصفة التي تُميِّز الشيء وتُحدِّده' — موثَّق في المعجم الكبير والمعجم الوسيط؛ بوابة الجودة: الملاءمة — ممتازة، الاشتقاقية — خصيصة → خصائص، خاصّ، يختص ✓؛ فَعِيلَة وزن مناسب للصفة الذاتية المميِّزة"
      step05_citation: "«خَصِيصَةُ الشىءِ: خاصَتُه, وهى الصِّفَة التى تُميِّزه وتُحَدِّدُه» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميز عن 'كيفية' بتركيزها على الجانب التمييزي المحدِّد دون البُعد الفلسفي الشامل؛ تتميز عن 'جودة' بحيادها التقييمي وأصالتها اللغوية؛ قريبة من 'خاصية' (لمّة المُشتمِل) لكن أخصّ: الخصيصة صفة مميِّزة محدِّدة، الخاصية تجريد ينتمي لكيان"
      example: "من أبرز خصائص هذه المادة خصيصةُ التوصيل الحراري المرتفع التي تُميِّزها من سائر العناصر وتُحدِّد سلوكها."
      actions:
        - command: create_entry
          params:
            lemma: "خَصِيصَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04731092-n"

    - lemma: "سَجِيَّة"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار النطاق الدلالي: السجية = الطبيعة والخلق الفطري — مقيَّدة بالأشخاص والكائنات الحية دون الأشياء المادية والمفاهيم المجردة؛ تعريف المجموعة يشمل 'شيئاً أو شخصاً' فلا تستوفي السجية الشرط العام"
      step05_citation: "«السجية: الطبيعة والخُلُق» — المعجم الوسيط؛ «السجيَّة: ما سجي عَلَيْهِ الْإِنْسَانُ» — معجم مقاليد العلوم للسيوطي"

