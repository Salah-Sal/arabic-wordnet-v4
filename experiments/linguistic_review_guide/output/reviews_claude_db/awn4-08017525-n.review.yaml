  current_definition: "مجموعة مميزة وغالباً ما تكون تابعة داخل مجموعة"
  assessment:
    decision: retain
    reason: "التعريف دقيق ومكتمل بنيوياً — يجمع الجنس القريب (مجموعة) مع فصلين مميّزين: التمييز النوعي (مميزة) والعلاقة الهرمية (تابعة داخل مجموعة)؛ التحفّظ بـ«غالباً» دقيق إذ توجد مجموعات فرعية غير تابعة بالمعنى الصارم (كالزمرات الجزئية الاختيارية)؛ لا تناقض مع أدلة المعاجم"

