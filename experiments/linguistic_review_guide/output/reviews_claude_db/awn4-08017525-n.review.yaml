step0_evidence:
  per_lemma:
    - lemma: "مجموعة فرعية"
      confirm:
        - text: "«مَجْمُوعَة فَرْعِيَّة: subgroup»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مجموعة فرعية فئة: sub-group»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«(1) العشيرة [في تصنيف النباتات والحيوانات] (2) الطُّوَيْئفة: جزء من طائفة أو جماعة أو مجموعة (3) الزُّمرة الجزئية (ر).»"
          source: "المورد الحديث (2008)"
          addition: "يوفّر مرادفات عربية متعددة تغطي سياقات التصنيف البيولوجي (العشيرة) والعموم (الطُّوَيْئفة) والرياضيات (الزُّمرة الجزئية)؛ ويُشير إلى تعدد المصطلحات الموحَّدة للمفهوم ذاته"
        - text: "«مجموعة فرعية من لغات عائلة واحدة: Branch» — ورد في تعريف «فصيلة صغرى، فَرْع»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُؤكد استخدام «مجموعة فرعية» وصفاً لاحتواء مجموعات أصغر ضمن مجموعة كبرى في حقل اللسانيات"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "زمرة جزئية"
      source_section: "step5_english_bridge"
      evidence_citation: "«زمرة جزئية: subgroup» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      justification: "مصطلح تركيبي وصفي موحَّد في معاجم ALECSO للرياضيات — يُجسّد مفهوم المجموعة الفرعية في نظرية الزمر الجبرية؛ الوحدة المعجمية مسجَّلة منذ 1990 ومستقرة في الاستعمال التخصصي"
    - lemma: "زُمَيرة"
      source_section: "step5_english_bridge"
      evidence_citation: "«زُمَيرة: subgroup» — المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      justification: "تصغير زمرة على وزن فُعَيلة (اشتقاق) — تُعبّر الصيغة التصغيرية صرفياً عن مجموعة أصغر وفرعية؛ موثَّقة في معجم تشريحي معتمد لدى ALECSO"
  knowledge_candidates:
    - lemma: "طُوَيْئفة"
      justification: "اشتقاق: تصغير طائفة على وزن فُعَيعِلة — يُعبّر صرفياً عن طائفة صغيرة أو فرع منها؛ الصيغة التصغيرية تُجسّد طبيعياً دلالة الفرعية والتبعية دون اقتراض هيكل أجنبي. آلية التوليد: اشتقاق بالتصغير لإفادة التحقير المقداري والتبعية. يؤكده المورد الحديث: «الطُّوَيْئفة: جزء من طائفة أو جماعة أو مجموعة»"
  generation_notes: "ثلاثة مسارات مصطلحية واعدة: زمرة جزئية (رياضيات)، زُمَيرة (تشريح)، طُوَيْئفة (عموم). الأخيرتان مبنيتان على صيغة التصغير العربية التي تُجسّد صرفياً دلالة «المجموعة الأصغر المندرجة ضمن كبرى»"

step1_lemma_validation:
  per_lemma:
    - lemma: "مجموعة فرعية"
      decision: confirmed
      decision_reason: "مصطلح وصفي مركب (إضافة صفة فرعية إلى مجموعة) — مسجَّل في معاجم تخصصية متعددة (صيدلة، كيمياء، حوسبة، بيئة، بيانات)؛ تركيب وصفي ثابت يجتاز اختبار السكّ لكونه وحدة معجمية مستقلة؛ يُعدّ اقتراضاً مفهومياً (calque) من Eng: sub+group=فرعية+مجموعة بقوالب عربية أصيلة — مقبول لوضوح الهيكل الاستعاري؛ يحقق معايير الجودة: شيوع فعلي في الفصحى التقنية، يُسر التداول، تناظر دقيق مع المفهوم، اشتقاقية من فرع (يتفرّع، تفريع)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "الأشمل استخداماً من جميع المرادفات — يصلح لكل السياقات التقنية والعلمية والإدارية والعامة؛ يُركّز على البُعد الهرمي والتنظيمي (التبعية + التمييز)؛ بخلاف زمرة جزئية (خاصة بنظرية الزمر الرياضية) وزُمَيرة (طبية تشريحية) وطُوَيْئفة (نثر غير تقني)"
      example: "تُعدّ الخلايا الجذعية المكوِّنة للدم مجموعةً فرعيةً متخصصة تضطلع بتجديد مكوّنات الدم باستمرار"

    - lemma: "زمرة جزئية"
      source: step05
      decision: confirmed
      decision_reason: "تركيب وصفي ثابت مسجَّل في معجم ALECSO للرياضيات منذ 1990 — يجتاز اختبار التثبيت المعجمي؛ لا يمكن إبدال «جزئية» بـ«فرعية» في الاستعمال الرياضي لأن الصيغة المسكوكة محددة؛ جزء أصيل من مصطلحات نظرية الزمر (Group Theory) في العربية؛ يحقق الاشتقاقية (زمرة → زُمَر، زُمَري)"
      step05_citation: "«زمرة جزئية: subgroup» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "حصري في السياق الرياضي الدقيق — «زمرة» في نظرية الزمر تعني مجموعة مزوَّدة بعملية ثنائية وعنصر محايد وعناصر عكسية؛ «الزمرة الجزئية» هي إذاً مجموعة فرعية تستوفي نفس الشروط؛ هذا التخصص الدلالي يميّزها جوهرياً عن مجموعة فرعية (العام) وعن زُمَيرة وطُوَيْئفة"
      example: "تُعدّ مجموعة الأعداد الصحيحة الزوجية زمرةً جزئيةً من زمرة الأعداد الصحيحة بالنسبة للجمع"
      actions:
        - command: create_entry
          params:
            lemma: "زمرة جزئية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08017525-n"

    - lemma: "زُمَيرة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مفرد مسجَّل في معجم التشريح العياني (2015) — تصغير عربي أصيل على وزن فُعَيلة يُجسّد صرفياً مفهوم المجموعة الأصغر الفرعية؛ يجتاز اختبار التثبيت المعجمي بتسجيله في معجم طبي معتمد؛ يحقق الاشتقاقية وله جمع تكسير طبيعي (زُمَيرات)"
      step05_citation: "«زُمَيرة: subgroup» — المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      substitution_test:
        result: pass
      nuance_differentiation: "مختص بالحقل الطبي والبيولوجي — الصيغة التصغيرية (فُعَيلة) تُفيد التقليل والفرعية معاً وهو ما يناسب الوصف التشريحي؛ أكثر إيقاعاً لغوياً من «مجموعة فرعية» في النصوص الطبية"
      example: "تشكّل الخلايا التائية المنظِّمة زُمَيرةً حيويةً تكبح الاستجابة المناعية المفرطة"
      actions:
        - command: create_entry
          params:
            lemma: "زُمَيرة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08017525-n"

    - lemma: "طُوَيْئفة"
      source: step05
      decision: confirmed
      decision_reason: "موثَّق في المورد الحديث (2008) بتعريف عربي صريح «جزء من طائفة أو جماعة أو مجموعة» — يطابق تعريف المجموعة الترادفية مطابقةً مباشرة؛ تصغير أصيل على وزن فُعَيعِلة من طائفة (ط-و-ف)؛ يُلائم النصوص غير التقنية (اجتماعية، دينية، سياسية) وهي سياقات لا تكفي فيها «مجموعة فرعية» ذات النكهة التقنية"
      step05_citation: "«الطُّوَيْئفة: جزء من طائفة أو جماعة أو مجموعة» — المورد الحديث (2008)"
      substitution_test:
        result: pass
      nuance_differentiation: "يُلائم السياقات الإنسانية والأدبية والعامة؛ الجذر ط-و-ف يوحي بالانتماء والدوران في مجال (طاف حول شيء) — مجازياً «طويئفة» هي جماعة تدور في فلك الجماعة الأكبر؛ يمتاز بالفصاحة وثقل الإيقاع الصرفي"
      example: "انقسم المجلس إلى طُوَيْئفات ذات مصالح متباينة أخّرت التوصل إلى توافق"
      actions:
        - command: create_entry
          params:
            lemma: "طُوَيْئفة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08017525-n"

  added_lemmas:
    - lemma: "زمرة جزئية"
      reason: "مصدر: الخطوة ٠٫٥ — مصطلح رياضي موحَّد لمفهوم المجموعة الفرعية في نظرية الزمر"
