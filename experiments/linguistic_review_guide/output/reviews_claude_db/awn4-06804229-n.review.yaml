    reason: "«تشفر» ترجمة حرفية لـ encodes — في أسلوب المعجم العربي الأنسب «تُبلِّغ» أو «تُوصِل»؛ كما تُحاكي الصياغة الإنجليزية وليست على نهج المعجم الوسيط؛ كلمة «رسالة ما» غير طبيعية في السياق المعجمي العربي"
