step0_evidence:
  per_lemma:

    - lemma: "إشارة"
      confirm:
        - text: "«تعيين الشيء باليد ونحوها, والتلويح بشيء يفهم منه المراد»"
          source: "المعجم الوسيط"
        - text: "«علامَةٌ, أو رَمْزٌ, أو حركةٌ للدلالةِ على أمرٍ ما»"
          source: "المعجم الكبير"
        - text: "«الإشارة: التلويح بشيء يفهم منه النطق، فهي ترادف النطق في فهم المعنى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الإشارة: هو تعيين الشيء بالحسّ»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«الإشَارةُ: دلَالَة عقلية أَو حسية إِلَى الشَّيْء بِحَيْثُ لَا يُشَارِكهُ فِيهِ غَيره»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "إضافة بُعد التخصيص والتفريد — الإشارة تُحدِّد شيئاً بعينه دون سواه"
        - text: "«علامة إرادية ترسل تعليمات أو معلومات وتأخذ أشكالا خطية أو سمعية أو بصرية كإشارات قانون السير»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "توسيع المعنى ليشمل الإشارات غير الجسدية (الخطية والسمعية والبصرية) — أعمّ من «فعل أو إيماءة»"
        - text: "«الإشارة: معناه بديهي وهي قسمان: إشارة عقلية وإشارة حسّية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "إضافة أبعاد منطقية وأصولية ولغوية تتجاوز الإيماء الجسدي المتعمَّد"
      peripheral_observations:
        - "المعنى التقني الكهربائي/الفيزيائي (الإشارة = مقدار فيزيائي يُمثِّل معلومة) — من مصادر ARABTERM للهندسة الكهربائية — معنى مستقل تماماً قد يستحق مجموعة ترادفية منفصلة"

    - lemma: "علامة"
      contradicts:
        - text: "«الأُعْلُومة ما يُنصب فى الطريق فيهتدى به»"
          source: "المعجم الوسيط"
          conflict: "تصف علامة ثابتة جامدة منصوبة في مكانها — لا فعلاً ولا إيماءة متعمَّدة كما يشترط تعريف المجموعة"
        - text: "«ما يُسْتَدَلُّ به على الطريق من أثر»"
          source: "المعجم الوسيط"
          conflict: "أثر طبيعي أو وسيلة استدلال — لا فعل إرادي يُرسَل من فاعل إلى آخر بقصد الإفهام"
        - text: "«العَلامة: الأمارة وهي ما يعرف الوجود من تعلق وجود لا وجوب، وقد تتخلَّف عن ذي العلامة كالسحاب فإنه علامة المطر»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "قد تتخلَّف عن صاحبها أي لا تستلزم إرادة أو فاعلاً — نقيض اشتراط التعريف أن تكون فعلاً يُشفِّر رسالة"
      expands:
        - text: "«بَاب الْعَلامَة فِي الشَّيْء: عَلَامَات وأمارات وسمات وَدَلَائِل وشواهد وبراهين ومخايل وآثار ومنار وأشراط وندوب»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
          addition: "الحقل الدلالي لـ«علامة» أوسع بكثير من الإيماء — يشمل الآثار الطبيعية والمؤشرات غير الإرادية"
        - text: "«العلامة:[في الانكليزية] Mark ،signe... ما تعلّق بالشيء من غير تأثير فيه ولا توقّف له عليه إلّا من جهة أنّه يدلّ على وجود ذلك الشيء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تعريف أصولي يُحدِّد العلامة كدليل على الوجود دون اشتراط الإرادة أو التعمُّد"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "إيماء"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الإِيْمَاءُ: الإشارة باليد أو بالرأس» — كتاب العين لفراهيدي"
      justification: "مصدر الفعل «أومأ» — يدل على الحركة الجسدية الخفيفة باليد أو الرأس التي تُعبِّر عن مراد بغير نطق؛ يُطابق نصاً تعريف المجموعة «فعل أو إيماءة غير لفظية تُبلِّغ رسالة»؛ معجم مقاليد العلوم: «الكلام المشار به إلى المطلوب من قرب لا مع الخفاء»"
  knowledge_candidates:
    - lemma: "تلويح"
      justification: "اشتقاق (مصدر تَفْعِيل من لَوَّح): ورد في معجم مقاليد العلوم «مَا يشار بِهِ إِلَى الْمَطْلُوب من بعد، مَعَ خَفَاء» — في العربية التراثية يُعبِّر عن الإشارة من بُعد بحركة جسدية؛ يقع في الحقل الدلالي للتواصل غير اللفظي"
  generation_notes: "التعريف يُفيد أن المفهوم فعل جسدي متعمَّد غير لفظي؛ الجذر المركزي و-م-أ (الإيماء بالجوارح) هو الأقرب للمفهوم المقصود؛ تلويح مرشح احتياطي يختص بالإشارة من بُعد"

step1_lemma_validation:
  per_lemma:

    - lemma: "إشارة"
      decision: confirmed
      decision_reason: "أدلة معجمية مؤكِّدة من مصادر كلاسيكية وحديثة متعددة — مطابقة تامة لتعريف المجموعة بلا تعارض"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "«إشارة» تدل على الفعل التواصلي المتعمَّد بالجسد بغير نطق — أعمّ من «إيماء» (الحركة الخفيفة الجسدية) وأخصّ من «علامة» (التي تشمل الأمارات الطبيعية غير الإرادية)؛ هي العمود الدلالي المركزي للمجموعة"
      example: "أشار الحارسُ برأسه إشارةً خفيةً للاعبِ كي يتقدَّم، فانطلق على الفور دون أن ينطق أحدٌ بكلمة"

    - lemma: "علامة"
      decision: escalated
      decision_reason: "تعارض دلالي حقيقي: المعنى المعجمي الجوهري هو الأمارة الثابتة أو الأثر غير الإرادي، بينما يشترط تعريف المجموعة فعلاً إرادياً متعمَّداً لإيصال رسالة — يحتاج مراجعاً بشرياً للبتّ: إما نقل «علامة» إلى مجموعة أعمّ تمثّل مفهوم Sign/Indicator، أو الإبقاء مع مراجعة التعريف"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "fail"
      nuance_differentiation: "«علامة» تُركِّز على الدليل الخارجي الذي يدلّ على وجود شيء — وقد يكون غير إرادي (كالسحاب علامة المطر)؛ «إشارة» تُركِّز على الفعل الإرادي لفاعل يُوصِل مراداً؛ الفارق الجوهري هو الإرادية وحضور الفاعل القاصد"

    - lemma: "إيماء"
      source: step05
      decision: confirmed
      decision_reason: "موثَّق في كتاب العين وعدة مصادر كلاسيكية وحديثة بمعنى «الإشارة باليد أو الرأس» — يُناسب تماماً تعريف «فعل أو إيماءة غير لفظية»؛ يستكمل دلالة المجموعة بتغطية الإيماء الجسدي الخفيف"
      step05_citation: "«الإِيْمَاءُ: الإشارة باليد أو بالرأس» — كتاب العين لفراهيدي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "«إيماء» أخصّ من «إشارة» ويدل على الحركة الجسدية الخفيفة الهادئة (نود برأس، لفتة بيد) دون المعنى التقني أو التواصلي الأوسع لـ«إشارة»؛ يُكمِّلها في الجانب الجسدي المحض"
      example: "تبادلا إيماءً بالرأس تعبيراً عن الموافقة دون أن يُفوها بكلمة"
      actions:
        - command: create_entry
          params:
            lemma: "إيماء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06804229-n"

    - lemma: "تلويح"
      source: step05
      decision: removed
      decision_reason: "رغم الأصل التراثي (الإشارة من بعد)، انزاح «تلويح» في العربية المعاصرة نحو معانٍ بلاغية (نوع من الكناية) وتقنية (تغطية بألواح)؛ اختصاصه بالإشارة البعيدة المبهمة (مع خفاء) يجعله أضيق من تعريف المجموعة الشامل لكل فعل غير لفظي؛ «إشارة» و«إيماء» يكفيان لتغطية المفهوم"
      step05_citation: "«التَّلوِيحُ: مَا يشار بِهِ إِلَى الْمَطْلُوب من بعد، مَعَ خَفَاء» — معجم مقاليد العلوم للسيوطي"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "إيماء"
      reason: "موثَّق في كتاب العين بمعنى الإشارة باليد أو الرأس — مصدر الخطوة ٠٫٥"
      via_command: create_entry + add_sense

