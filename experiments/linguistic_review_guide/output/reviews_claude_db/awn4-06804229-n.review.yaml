        passed: true
    - type: linguistic
      text: "ما يُعبَّر به عن المقصود بغير كلام من إيماء بالجوارح أو حركة جسدية متعمَّدة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
