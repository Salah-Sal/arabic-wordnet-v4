step0_evidence:
  per_lemma:

    - lemma: "تحفة"
      confirm:
        - text: "«التحفة: الشيء الطريف النفيس يكرم به الإنسان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«التُّحفة: الطرفة، ويقال لما له قيمة فنية أو أثرية تحفة»"
          source: "المعجم الوسيط"
        - text: "«التُّحفة: ما أُتحفت به الرجل من البر والألطاف، الطرفة من الفاكهة وغيرها كالرياحين»"
          source: "المعجم الكبير"
        - text: "«التُّحفة: ما أَتحفتَ به الرجلَ من البر واللطف»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«التُّحفة: الطرفة من الفاكهة، وقد أتحفه بها»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
      expands:
        - text: "«التُّحفة: البِرُّ واللَّطفُ، والطُّرفة»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "دلالة الهبة والإكرام للآخر — بُعد العطاء والبر غير موجود في تعريف المجموعة الذي يقتصر على التميز الذاتي"
        - text: "«التُّحفة: ما أُتحف به الرجل من البر»"
          source: "التعريفات الفقهية للبركتي"
          addition: "استعمال فقهي يُركّز على العطاء الديني والإكرام، لا على النفاسة الجوهرية للشيء"

    - lemma: "شيء رائع"
      confirm:
        - text: "«الرائع: المعجب»"
          source: "المعجم الوسيط"
        - text: "«الرائع: وصف لما جاوز المألوف في الفن والأخلاق والفكر»"
          source: "المعجم الكبير"

    - lemma: "شيء ممتاز"
      confirm:
        - text: "«crackerjack: (1) شيء ممتاز؛ شخص من الطراز الأول (2) عظيم البراعة؛ ممتاز جدًا»"
          source: "المورد الحديث (2008)"


