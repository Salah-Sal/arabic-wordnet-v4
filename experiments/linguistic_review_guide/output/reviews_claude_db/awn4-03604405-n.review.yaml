step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية — مؤكدة ──
    - lemma: "تحفة"
      decision: confirmed
      decision_reason: "أدلة معجمية كلاسيكية وحديثة مؤكدة من مصادر متعددة؛ تحمل دلالة التميز النوعي والنفاسة الذاتية بلا تناقض مع تعريف المجموعة؛ مقبولة باختبار الاقتراض (لفظ عربي أصيل جذره ت-ح-ف أو الأصل و-ح-ف بحسب المعاجم الكلاسيكية)؛ تجتاز بوابة الجودة: شائعة فصيحة، يسيرة التداول، مشتقة (تحف، أتحف، إتحاف)"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "تحفة تُسمّي الشيءَ تسميةً جوهرية انطلاقاً من نفاسته الذاتية وتميزه في جنسه، لا انطلاقاً من انطباع وصفي خارجي — تختلف عن «رائع» (وصف وجداني) و«ممتاز» (تقييم نسبي) بأنها تُجسّد مفهوم النفاسة النوعية في كيان مسمى مستقل"
      example: "يُعدّ هذا الفيلم الوثائقي تحفةً في تاريخ السينما العربية من حيث الإخراج والتوثيق."

    # ── لمّة أصلية — محذوفة ──
    - lemma: "شيء رائع"
      decision: removed
      decision_reason: "تركيب وصفي حر غير مسكوك — نوعه: وصفي (اسم + صفة)؛ فشل اختبار السك: إبدال «رائع» بـ«جميل» أو «مذهل» يبقي العبارة وصفاً صالحاً للمفهوم ذاته؛ فشل اختبار التثبيت المعجمي: لا يرد كوحدة معجمية ثابتة في المعاجم؛ إضافةً إلى أن «رائع» في فحص الاقتراض المفهومي هو ترجمة وصفية حرة لا مصطلح"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        type: "وصفي"
        accepted: false
      substitution_test:
        result: pass
      nuance_differentiation: "«رائع» يصف الانطباع الحسي والوجداني (ما يثير الإعجاب والدهشة) لا التميز النوعي الموضوعي المقصود في التعريف؛ وهو صفة لا اسم مستقل"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة أصلية — محذوفة ──
    - lemma: "شيء ممتاز"
      decision: removed
      decision_reason: "تركيب وصفي حر دائري — نوعه: وصفي (اسم + صفة)؛ إعادة صياغة للتعريف ذاته «شيء ممتاز من نوعه» دون إضافة معجمية مستقلة؛ الترجمة الحرفية العمياء: يعكس الهيكل الاستعاري للإنجليزية «something excellent» دون توطين حقيقي؛ فشل اختبار السك والتثبيت المعجمي"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        type: "وصفي"
        accepted: false
      substitution_test:
        result: pass
      nuance_differentiation: "لا فارق دلالي مستقل — المركب وصف حر للانطباع التقييمي لا تسمية لكيان معجمي مستقل"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "طُرفة"
      source: step05
      decision: removed
      decision_reason: "انزياح دلالي في العربية المعاصرة — طُرفة تعني أساساً «الحكاية الطريفة / النكتة» في الاستعمال الحديث؛ فشل اختبار الإبدال: «هذا الاختراع طُرفة في بابه» تُفهم على أنه فكاهة لا تميز نوعي؛ وإن صلح الاستعمال الكلاسيكي فهو يُركّز على الجِدَّة والندرة لا على الجودة والتميز"
      step05_citation: "«التُّحفة: الطرفة من الفاكهة وغيرها» — المعجم الكبير"
      substitution_test:
        result: fail
      nuance_differentiation: "طُرفة = ندرة وطرافة وجِدَّة؛ التعريف يستهدف تميزاً نوعياً جوهرياً — السياق الدلالي مختلف؛ التداخل الاشتراكي مع معنى «النكتة» يُشكّل خطراً استعمالياً"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "درة"
      source: step05
      decision: removed
      decision_reason: "استعمال مجازي يتطلب سياقاً تخصيصياً («درة العقد»، «درة التاج») ولا يقوم مستقلاً بمعنى «شيء ممتاز من نوعه»؛ فشل اختبار الإبدال: «هذه الرواية درة» يحتاج إلى إتمام («درة الأدب» أو «درة في بابها»)؛ فشل اختبار التثبيت المعجمي كمصطلح مستقل لهذا المعنى"
      step05_citation: "«الدُّرة: واحدة الدر، وهي اللؤلؤة العظيمة الكبيرة» — المعجم الوسيط"
      substitution_test:
        result: fail
      nuance_differentiation: "درة = مجاز جمالي من عالم الجواهر؛ المعنى المستهدف تفوق نوعي موضوعي لا حسن حسي فحسب"

