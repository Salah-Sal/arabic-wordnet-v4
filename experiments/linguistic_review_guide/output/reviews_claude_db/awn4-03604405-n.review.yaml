    - lemma: "طُرفة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«التُّحفة: الطرفة من الفاكهة وغيرها، ثم يُستعمل في غيرها» — المعجم الكبير"
      justification: "وردت طُرفة مرادفةً لمفهوم النفاسة والجِدَّة في معاجم كلاسيكية متعددة؛ أصلها الشيء الجديد الطريف ثم اتُّسعت لكل شيء نفيس ملفت — آلية التوليد: إحياء الاستعمال الكلاسيكي"
  knowledge_candidates:
    - lemma: "درة"
      justification: "مجاز بالمشابهة القيمية — الدُّرة (اللؤلؤة العظيمة) تُستعمل في الفصحى للتعبير عن الأنفس في جنسه («درة العقد»، «درة التاج»)؛ آلية التوليد: مجاز (إزاحة دلالية من القيمة المادية إلى التميز النوعي)"
  generation_notes: "تعريف المجموعة «شيء ممتاز من نوعه» يُركّز على التفوق النوعي الموضوعي؛ المرادفات العربية تتوزع بين دلالات الندرة والطرافة (طُرفة) والقيمة الجمالية (درة) والتميز المطلق (تحفة) — الجذور الواعدة: ط-ر-ف، د-ر-ر، ت-ح-ف"


