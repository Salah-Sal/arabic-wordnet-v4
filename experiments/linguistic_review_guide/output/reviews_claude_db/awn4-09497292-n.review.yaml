          addition: "البستان المسوَّر — معنى ثانٍ بالمجاز المرسل (تسمية المكان باسم ما أحاط به)؛ يوسّع دلالة الحائط إلى كل ما تحيط به بنية جدارية"
      peripheral_observations:
