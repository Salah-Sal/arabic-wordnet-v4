# مراجعة المجموعة الترادفية — awn4-07955013-n
# id: awn4-07955013-n  |  ili: i79043  |  pos: n
# التعريف الإنجليزي: an orderly grouping (of things or persons)
#                    considered as a unit; the result of arranging
# ══════════════════════════════════════════════════════════════

step0_evidence:
  per_lemma:

    - lemma: "ترتيب"
      confirm:
        - text: "«التَّرتيبُ: جعل الأشياء المتعددة بحيث يُطلق عليها اسم الواحد، ويكون لبعضها نسبة إلى بعض بالتقدم والتأخر»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الترتيب: لغة جعل كل شيء في مرتبته، واصطلاحاً: هو جعل الأشياء الكثيرة بحيث يطلق عليها اسم الواحد، ويكون لبعض أجزائه نسبة إلى البعض، بالتقدم والتأخر»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الترتيب: لغة، جعل كل شيء في مرتبة. وعرفا جعل الأشياء الكثيرة بحيث يطلق عليها اسم الواحد ويكون لبعض أجزائه نسبة إلى بعضها بالتقدم والتأخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الترتيب: لغة: جعل كل شيء في مرتبته، واصطلاحاً: هو جعل الأشياء المتعدّدة بحيث يطلق عليها اسم واحد ويكون لبعض أجزائه نسبة إلى البعض بالتقدم والتأخر، وأصله مراعاةُ مراتب المذكورات»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«ترتيب — arrangement»"
          source: "المعجم الطبي الموحد (2009)؛ المعجم الموحد لمصطلحات الرياضيات والفلك (1990)؛ المعجم الموحد لمصطلحات الكيمياء (1992)؛ مسرد الفن والتسلية والرياضة (ArabTerm)؛ المعجم الموحد للمياه (2000)"
      expands:
        - text: "«وفي الاصطلاح جعل الأشياء الكثيرة بحيث يطلق عليها اسم الواحد ويكون لبعضها نسبة إلى بعض بالتقديم والتأخير... ثم الترتيب أخصّ مفهوماً من التأليف إذ لم يُعتبر في التأليف نسبة بعض الأجزاء إلى بعض بالتقديم والتأخير»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُميّز التهانوي الترتيب عن التأليف بأن الترتيب يشترط نسبة التقديم والتأخير بين الأجزاء — بُعد دلالي إضافي غير صريح في تعريف المجموعة؛ كما يوسّع الترتيب إلى المجالين الفقهي (ترتيب الوضوء والصلوات الفائتة) والبلاغي"
      peripheral_observations:
        - "«ترتيب — ordinate: أحد الاحداثيين» — المعجم الموحد لمصطلحات الهندسة المدنية (2012): معنى هندسي مستقل تماماً (الإحداثي الصادي) بعيد كلياً عن تعريف المجموعة"

    - lemma: "تنسيق"
      confirm:
        - text: "«التنسيق: من النسق بسكون السين المهملة التَّرتيب وإجراء الكلام على سياق واحد ونظام واحد. والنسق بالفتحتين من كل شيء ما كان على نظام واحد»"
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: "«تنسيق — coordination»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)؛ معجم الحكامة التربوية (2020)؛ مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)؛ المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          conflict: "تُترجم المعاجم التقنية الحديثة التنسيق بـ coordination (التوافق والتناغم بين أطراف)، لا بـ arrangement (تجميع منظم كنتيجة)؛ المفهومان مختلفان دلالياً — تعريف المجموعة يصف arrangement ولا يصف coordination"
        - text: "«تنسيق — harmonization: توحيد الأطر التشريعية المتعلقة بموارد المياه في الدول المتشاطئة. ولهذا التنسيق أهمية بالغة في حالة الإدارة المشتركة للموارد المائية»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "harmonization بُعد مستقل عن التجميع المنظم كوحدة واحدة"
        - text: "«تنسيق — إحداث انسجام بين مكونات موضوع ما أو بين نشاطات عدة أشخاص في مجال محدد»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          conflict: "إحداث الانسجام بين أطراف (coordination) يختلف جوهرياً عن التجميع المنظم كنتيجة arrangement"
      expands:
        - text: "«تنسيق الصفات في صنعة البديع: هو ذكر الشيء بصفات متتالية؛ مدحاً كان كقوله تعالى: {وَهُوَ الْغَفُورُ الْوَدُودُ} أو ذماً»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "المعنى البلاغي (تتابع الصفات في الأسلوب البديعي) مجال مستقل لا صلة له بتعريف المجموعة"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "نسق"
      source_section: "step0_evidence"
      evidence_citation: "«والنسق بالفتحتين من كل شيء ما كان على نظام واحد» — دستور العلماء للأحمدنكري (ضمن مدخل التنسيق)"
      justification: "النسق يصف الكيان المرتَّب على نظام واحد (الناتج)، وهو ما يصفه التعريف بـ«تجميع منظم يُعتبر كوحدة واحدة». يقع الجذر ن-س-ق في صميم الحقل الدلالي للمجموعة"
  knowledge_candidates:
    - lemma: "تشكيل"
      justification: "اشتقاق من ش-ك-ل على وزن تَفْعِيل؛ يدل على الكيان المشكَّل كوحدة واحدة (تشكيل عسكري، تشكيل حكومي، تشكيل فني). يُعبّر عن «نتيجة الترتيب» بوصفها هيئة متشكّلة. آلية التوليد: اشتقاق على وزن تَفْعِيل الدال على الناتج الكامل للفعل."
  generation_notes: "التعريف يصف arrangement كنتيجة وليس كفعل؛ الجذران الواعدان: ن-س-ق (النسق = ما كان على نظام واحد) وش-ك-ل (تشكيل = الهيئة الناتجة)"


step1_lemma_validation:
  per_lemma:

    - lemma: "ترتيب"
      decision: confirmed
      decision_reason: "أدلة مؤكّدة وافرة من خمسة مصادر كلاسيكية ومعاجم تقنية متعددة؛ مصطلح عربي أصيل راسخ في التراث والاستعمال الحديث؛ اشتقاقي منتج (رتّب/يرتّب/مرتَّب/ترتيبات/ترتيبي)؛ وزن تَفْعِيل مناسب للمصدر الدال على الفعل ونتيجته معاً؛ بوابة الجودة: الاطّراد ✓، يُسر التداول ✓، الملاءمة ✓، إيثار التراثي ✓، إيثار العربي ✓، الاشتقاقية ✓"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركّز على النسبة بين العناصر بالتقدم والتأخر (البُعد التسلسلي للوحدة)، ويجمع في آنٍ معنى العملية (جعل الأشياء في مراتب) ومعنى النتيجة (المنظومة الناتجة)؛ أكثر صرامةً في دلالة التسلسل من تشكيل الذي يُركّز على الهيئة الشكلية"
      example: "وضع المهندسُ ترتيباً هندسياً محكماً لمكونات الجهاز يجعلها تعمل بوصفها وحدة واحدة متكاملة"

    - lemma: "تنسيق"
      decision: escalated
      decision_reason: "تعارض حقيقي بين الاستعمال الكلاسيكي (دستور العلماء: التنسيق = الترتيب) والاستعمال الحديث المعجمي التقني (ArabTerm وغيره: تنسيق = coordination/harmonization ≠ arrangement)؛ تعريف المجموعة يصف نتيجة الترتيب كوحدة (arrangement)، بينما التنسيق في الاستعمال الفصيح الحديث ينزاح نحو التوافق بين أطراف — فحص الملاءمة يكشف انفصالاً دلالياً؛ يحتاج مراجعاً بشرياً ليقرر: هل يُقبل بالمعنى الكلاسيكي التراثي أم يُحذف لتغلّب المعنى الحديث؟"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "التنسيق في الاستعمال الحديث يعني إحداث التوافق والانسجام بين أطراف (coordination)؛ كلاسيكياً هو الترتيب وإجراء الكلام على سياق واحد — انزياح دلالي حديث يُبعده عن معنى arrangement كنتيجة"

    - lemma: "نسق"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار التثبيت المعجمي: النسق كمدخل مستقل لا يُستعمل في العربية الحديثة مصطلحاً مسكوكاً بمعنى «تجميع منظم يُعتبر كوحدة واحدة»؛ ورد في الأدلة وصفاً للجذر ضمن مدخل التنسيق لا مدخلاً مستقلاً مسجَّلاً بهذا المعنى؛ الاستعمال الحديث: نسق الطباعة (formatting/layout) — انزياح بعيد عن المعنى المقصود"
      step05_citation: "«والنسق بالفتحتين من كل شيء ما كان على نظام واحد» — دستور العلماء للأحمدنكري"

    - lemma: "تشكيل"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح شائع في الفصحى المعاصرة يدل على التجميع في هيئة واحدة (تشكيل عسكري، تشكيل حكومي، تشكيل فني)؛ اشتقاقي منتج (شكّل/يشكّل/مشكَّل/تشكيلي/تشكيلات)؛ ملاءمة جيدة مع «نتيجة الترتيب» كهيئة متشكّلة؛ وزن تَفْعِيل مناسب؛ بوابة الجودة: الاطّراد ✓، يُسر التداول ✓، الملاءمة ✓، إيثار العربي ✓، الاشتقاقية ✓"
      step05_citation: "«تشكيل» — مصطلح مستعمل في الفصحى المعاصرة بمعنى formation/configuration؛ «تشكيل وحدات عسكرية»، «تشكيل الحكومة»، «التشكيل المعماري»"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركّز على الناتج كهيئة ووحدة متشكّلة (formation/configuration)، بينما ترتيب يُركّز على النسبة بين العناصر بالتقدم والتأخر؛ تشكيل أقرب للبُعد البنيوي الشكلي للوحدة، وترتيب أقرب للبُعد التسلسلي"
      example: "استعرضت القيادةُ التشكيلَ الجديدَ للوحدات المدرّعة بوصفه منظومةً قتالية واحدة ذات هيئة محكمة"
      actions:
        - command: create_entry
          params:
            lemma: "تشكيل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07955013-n"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "تشكيل"
      reason: "مصدر: الخطوة ٠٫٥ — يُعبّر عن معنى النتيجة كهيئة متشكّلة تُعتبر وحدة واحدة"
