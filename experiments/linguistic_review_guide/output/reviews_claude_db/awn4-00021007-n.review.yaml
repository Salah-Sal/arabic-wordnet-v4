# مراجعة المجموعة الترادفية: awn4-00021007-n
# اللمّات: مَادَّة | التعريف: ما له كتلة ويشغل حيّزًا من الفراغ
# ══════════════════════════════════════════════════════════════

step0_evidence:
  per_lemma:
    - lemma: "مَادَّة"
      confirm:
        - text: "«(الْمَادَّة) كل شَيْء يكون مدَدا لغيره وكل جسم ذِي امتداد وَوزن ويشغل حيزا من الْفَرَاغ»"
          source: "المعجم الوسيط"
        - text: "«مُصطلح مُشتق من الكلمة اللاتينية materia... يشمل كافة الأجسام المرئية التي لها كُتلة. أمّا الحيّز المكاني الذي يخلو من أية مادة فيُسمّى الفراغ»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«مادة — Matter» [مدرج في باب الفيزياء]"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      contradicts:
        - text: "«مادة الشيء: هي التي يحصل الشيء معها بالقوة، وقيل: المادة: الزيادة المتصلة»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "تعريف أرسطي (المادة = الهيولى بالقوة والاستعداد) يخالف التعريف الفيزيائي الحديث (كتلة + حيز)"
        - text: "«المادَّة: مَا يكون بِهِ الشَّيْء مَوْجُودا بِالْقُوَّةِ»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الوجود بالقوة الأرسطي مفهوم ميتافيزيقي يناقض المفهوم الفيزيائي المقيَّد بالكتلة"
      expands:
        - text: "«المادّة... عند الحكماء هي المحل وتسمّى بالهيولى أيضا... وتطلق أيضا على خلط ردي يتغيّر عن طبعه... وعند المنطقيين هي كيفية النسبة بين المحمول والموضوع، وتنحصر في الوجوب والامتناع والإمكان الخاص»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "ثلاثة حقول دلالية مستقلة تتجاوز التعريف الفيزيائي: الهيولى الأرسطية، والخلط الطبي، والمادة المنطقية (الجهة)"
        - text: "«الْمَادَّة: هِيَ الهيولى وَهِي مَحل الْجَوْهَر أَي الصُّورَة»"
          source: "دستور العلماء للأحمدنكري"
          addition: "ربط مادة بالهيولى الأرسطية — حقل دلالي فلسفي مستقل تماماً عن الحقل الفيزيائي"
      peripheral_observations:
        - "المادة المنطقية (مادة القضية) عند المنطقيين تُشير إلى كيفية النسبة بين المحمول والموضوع — دلالة مستقلة لا تمت للمادة الفيزيائية بصلة، وتستحق مجموعة ترادفية مستقلة"
        - "المادة الطبية (الكلاسيكية) بمعنى الخلط الرديء — دلالة طبية تراثية مستقلة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جِسْم"
      source_section: "step5_english_bridge"
      evidence_citation: "«جِسم: body» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      justification: "جسم يُستعمل في السياق الفيزيائي ويُشير إلى الكيان المادي الذي يشغل حيزاً ويمتلك كتلة — مرشح قريب لمفهوم المادة المتجسِّدة"
  knowledge_candidates:
    - lemma: "هَيُولَى"
      justification: "إحياء لفظ ممات (مجاز): المقابل الأرسطي العربي للـ hyle اليونانية — استُخدم قروناً في التراث الفلسفي الإسلامي بمعنى مادة الشيء الأولى. آلية التوليد: المجاز (مشابهة وظيفية: هيولى = ما تتكوّن منه الأشياء)"
    - lemma: "جَوْهَر"
      justification: "اشتقاق دلالي: يُستعمل في الفلسفة العربية بمعنى ما يقوم بذاته من المادة (substance)، وهو موروث معجمي راسخ. آلية التوليد: الاشتقاق الدلالي من جذر ج-و-ه-ر بمعنى أصل الشيء وجوهره"
  generation_notes: "التعريف الفيزيائي الدقيق (كتلة + حيز) يضيّق نطاق التوليد؛ الجسر الإنجليزي والبحث العربي بكلمات كتلة وحيز وفراغ لا يُسفران عن مرشحات قوية سوى مادة نفسها في مصادر متعددة — مؤشر على استقرار المصطلح وانعدام التنافس المعجمي"

step1_lemma_validation:
  per_lemma:
    - lemma: "مَادَّة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من المعجم الوسيط ومصطلحيات الفيزياء في مجالات متعددة — المصطلح المعياري الراسخ للمفهوم في الفصحى المعاصرة والتراث الحديث"
      evidence_assessment:
        case: mixed
        notes:
          - "التعريفات الكلاسيكية (الجرجاني، السيوطي، التهانوي) أرسطية لا فيزيائية؛ التعارض مع التعريف الفيزيائي ظاهري ناجم عن تطور دلالي عبر التاريخ — الانتقال من الهيولى الأرسطية إلى المادة الفيزيائية الحديثة — لا يطعن في صلاحية اللمّة"
      substitution_test:
        result: pass
      nuance_differentiation: "مادة تدل على المادة الفيزيائية المجردة (abstract matter with mass) لا على جسم بعينه — تتميز عن جسم (كيان مادي فردي محدد) وعن هيولى (المادة الأرسطية اللامتعيَّنة) وعن جوهر (الجوهر الفلسفي الأعم الذي يشمل المجردات)"
      example: "تنقسم المادة إلى حالاتها الثلاث بحسب درجة الحرارة والضغط: الصلبة حيث تتراص الجسيمات، والسائلة حيث تتحرك بحرية، والغازية حيث تتباعد وتملأ الحيز المتاح"

    - lemma: "جِسْم"
      source: step05
      decision: removed
      decision_reason: "جسم يدل على كيان مادي فردي محسوس (object/body)، لا على المفهوم المجرد للمادة (abstract matter) — فشل اختبار الاستبدال: «كُلّ جسمٍ له كتلة» لا تعني «كلّ مادة لها كتلة» لأن المادة أعم من الجسم المحدد"
      step05_citation: "«جِسم: body» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      substitution_test:
        result: fail
      nuance_differentiation: "جسم = instance of a physical object (كيان مادي فردي من الكيان المادي)؛ مادة = the abstract substance of which bodies are composed — علاقتهما علاقة النوع بالجنس، لا ترادف"

    - lemma: "هَيُولَى"
      source: step05
      decision: removed
      decision_reason: "هيولى مصطلح أرسطي فلسفي (pure potentiality / substrate of existence) يختلف جوهرياً عن المادة الفيزيائية ذات الكتلة — انعدام التثبيت المعجمي في السياق الفيزيائي الحديث، وتخصص هيولى بالفلسفة الكلاسيكية وحدها"
      step05_citation: "«الْمَادَّة: هِيَ الهيولى وَهِي مَحل الْجَوْهَر» — دستور العلماء للأحمدنكري"
      nuance_differentiation: "هيولى = المادة الأرسطية اللامتعيَّنة (pure potentiality, لا تنتسب بالضرورة إلى الكتلة)؛ مادة = المادة الفيزيائية المتعيَّنة ذات الكتلة — حقلان دلاليان مختلفان زمناً وإطاراً"

    - lemma: "جَوْهَر"
      source: step05
      decision: removed
      decision_reason: "جوهر أعم من مادة — يشمل الجوهر المادي والروحاني والمجرد معاً في التراث الفلسفي، ولا يحمل قيد «الكتلة» الضروري للتعريف الفيزيائي الحالي"
      step05_citation: "«جوهر: essence» — المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      nuance_differentiation: "جوهر = substance في الأنطولوجيا الأرسطية (ما يقوم بذاته سواء أكان مادياً أم مجرداً)؛ مادة = matter في الفيزياء (ما له كتلة تحديداً) — مادة أخصّ من جوهر تخصيصاً حاداً"

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "ما له كتلة ويشغل حيّزًا من الفراغ"
  assessment:
    decision: retain
    reason: "التعريف الحالي دقيق علمياً — يستخدم «كتلة» (mass) وهو أدق من «وزن» (weight) الوارد في المعجم الوسيط، لأن الكتلة خاصية ذاتية للمادة ثابتة في أي إطار مرجعي، بخلاف الوزن الذي يتغير بالموقع"
  scope_note: "المعجم الوسيط يعرّف المادة بـ«امتداد ووزن» — التعريف الحالي أدق فيزيائياً بإحلال «كتلة» محل «وزن». كما أن التعريف الكلاسيكي أوسع دلالياً إذ يشمل المادة الأرسطية (الهيولى) التي تختلف عن المادة الفيزيائية الحديثة"

