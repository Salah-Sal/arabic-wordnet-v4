      evidence_citation: "«طائفة: نظام اجتماعي سائد بالهند» — مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      justification: أقرب مقابل عربي وُجد في المعاجم الموحدة لمفهوم caste في مجالات الجغرافيا والتاريخ وعلم الاجتماع والأنثروبولوجيا والفلسفة؛ التعريف الإضافي في المورد الحديث يذكر «إحدى الطبقات الاجتماعية الوراثية المنغلقة على نفسها عند الهندوس» مما يقترب من المفهوم المطلوب
  knowledge_candidates:
    - lemma: وارنة
      justification: "تعريب بديل من السنسكريتية varna (آلية: تعريب — الملاذ الأخير)؛ المفهوم مصطلح ديني-حضاري هندوسي خالص لا منطلق تشبيهي أو جذري عربي له، ومن ثمّ استُنفدت الدرجات الأعلى (مجاز، اشتقاق، تركيب) قبل اللجوء إلى التعريب؛ الفونيم الافتتاحي /w/ في «وارنة» أقرب صوتياً للنطق السنسكريتي الأصلي"
  generation_notes: المفهوم من المصطلحات الثقافية الدينية المرتبطة بحضارة بعينها (الحضارة الهندية الفيدية)؛ لا يوجد في التراث اللغوي العربي أي مشابهة وظيفية أو تشبيهية تسمح بتطبيق المجاز، ولا جذر عربي قابل للاشتقاق، ولا تركيب مصطلحي ثابت في المعاجم المتخصصة؛ التعريب هو الخيار الطبيعي الوحيد لهذا النوع من المصطلحات


step1_lemma_validation:
  per_lemma:

    # ── اللمّة الأصلية ──
    - lemma: فارنا
      decision: confirmed
      decision_reason: "بلا سند معجمي مباشر في قاعدة البيانات؛ غير أنها تعريب مشروع من السنسكريتية varna — فهي معرَّبة لا دخيلة: تقبل ال التعريف (الفارنا) وتصرّفت في الجمع (فارنات) والنسبة (فارناوي)؛ اطّرد استعمالها في الأدبيات العربية الأكاديمية للأديان المقارنة وعلم الاجتماع الديني؛ الملاءمة الدلالية تامة إذ يشير المصطلح حصراً إلى التقسيم الأربعي الأصلي دون التباس مع مصطلح caste الأشمل؛ الاشتقاقية محدودة (لا فعل مشتق) وهذا طبيعي للمصطلحات الثقافية المعرَّبة؛ لا ترجمة حرفية عمياء ولا اقتراض مفهومي قائم — التعريب الصوتي مباشر"
      evidence_assessment:
        case: no_material
      substitution_test:
        result: pass
      nuance_differentiation: لمّة وحيدة في المجموعة — لا تنافس مع مرادفات داخلية؛ تتمايز عن «طائفة» (أعم — يشمل أي تجمع اجتماعي منغلق) وعن «كاست» (أشمل حضارياً — يطال ظاهرة الطبقية في حضارات متعددة) بكونها المصطلح الاصطلاحي الدقيق للتقسيم الرباعي الأصلي في النظام الاجتماعي الفيدي الهندوسي تحديداً، قبل تشعّبه إلى الجاتي
      example: "يُقسِّم نظامُ الفارنا في الهندوسيةِ المجتمعَ الفيديَّ الأصليَّ إلى أربع فئات كبرى: البراهمة والكشاتريا والفايشيا والشودرا، وتنبثق من كل فارنا آلافُ الطوائف الصغرى المعروفة بالجاتي."

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: طائفة
      source: step05
      decision: removed
      decision_reason: "أعم من المطلوب — «طائفة» تقابل caste بمعناه الشامل (أي طبقة اجتماعية وراثية منغلقة)، في حين أن المجموعة تخص varna تحديداً وهو التقسيم الرباعي الأصلي الذي سبق نشوء الطوائف الصغرى؛ فشل اختبار الإبدال في السياق الدقيق: «نظام الطائفة الفيدية» لا يحمل الخصوصية الاصطلاحية لـ«نظام الفارنا»؛ الدلالة المعجمية لـ«طائفة» أوسع من حدود المجموعة"
      step05_citation: "«طائفة: نظام اجتماعي سائد بالهند» — مسرد الجغرافيا والتاريخ (ArabTerm)"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: وارنة
      source: step05
      decision: removed
      decision_reason: "صيغة تعريب بديلة أقل شيوعاً من «فارنا» في المصادر العربية المتخصصة؛ وجود تعريبَين متوازيَين للمصطلح ذاته يُخلّ بمبدأ الاطراد ويُشوِّش على القارئ؛ مرفوضة لصالح الصيغة المستقرة «فارنا» التي تعكس النطق الأكثر شيوعاً في الأدبيات العربية الأكاديمية؛ اجتياز اختبار الإبدال لا يبرر الإضافة لكونها تعريباً موازياً لمصطلح موجود"
      step05_citation: "لا شاهد معجمي — مستنبط من المعرفة اللغوية بأصول التعريب الصوتي"


step3_definition:
  definition_review_flag: false
  current_definition: "(في الهندوسية) اسم التقسيم الاجتماعي الأصلي للشعب الفيدي إلى أربع مجموعات (والتي تنقسم إلى آلاف الطوائف)"
  assessment:
    decision: revise
    reason: "صياغة «اسم التقسيم» ترجمة آلية لـ «the name for the original social division» وليست أسلوباً معجمياً عربياً أصيلاً — التعريف القاموسي يصف ماهية المفهوم مباشرةً لا يقول إنه «اسم لشيء»؛ زيادة على ذلك، إغفال أسماء الفئات الأربع الموسومة يُضعف الدقة الموسوعية للتعريف"
  authored_definitions:
    - type: encyclopedic
      text: "(في الهندوسية) التقسيمُ الاجتماعيُّ الأصليُّ للشعب الفيدي إلى أربع فئات كبرى هي: البراهمة (الكهنة والعلماء)، والكشاتريا (المحاربون والحكام)، والفايشيا (التجار والفلاحون)، والشودرا (الخدّام والحرفيون)، وتتفرع كلٌّ منها بدورها إلى آلاف الطوائف الصغرى المعروفة بالجاتي"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: awn4-08323595-n
        definition_index: 0
        text: "(في الهندوسية) التقسيمُ الاجتماعيُّ الأصليُّ للشعب الفيدي إلى أربع فئات كبرى هي: البراهمة (الكهنة والعلماء)، والكشاتريا (المحاربون والحكام)، والفايشيا (التجار والفلاحون)، والشودرا (الخدّام والحرفيون)، وتتفرع كلٌّ منها بدورها إلى آلاف الطوائف الصغرى المعروفة بالجاتي"


