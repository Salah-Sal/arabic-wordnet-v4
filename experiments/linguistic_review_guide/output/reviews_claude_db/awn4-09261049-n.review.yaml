step0_evidence:
  per_lemma:
    - lemma: "صيد"
      confirm:
        - text: "«ما يصاد»"
          source: "المعجم الوسيط"
        - text: "«(الصَّيْد) مَا يصاد وَفِي التَّنْزِيل الْعَزِيز {أحل لكم صيد الْبَحْر}»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (الهودرماني)"
        - text: "«كُلُّ ما يَصيدُه الإنسانُ من السَّمكِ والطير والوحش كُلُّ وَحْش صَيْدٌ, صِيدَ أو لم يُصَدْ»"
          source: "المعجم الكبير"
        - text: "«والصَّيْدُ: ما تُصُيِّدَ»"
          source: "لسان العرب لابن منظور"
        - text: "«صادَهُ يَصيدُهُ وَيَصادُهُ صَيْداً، أي اصطاده والصَيْدُ أيضاً: المَصيدُ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«وَقَدْ يقِع الصَّيْدُ عَلَى المَصِيد نَفْسِهِ تَسْميةً بالمَصْدر»"
          source: "النهاية في غريب الحديث والأثر لابن الأثير الجزري"
        - text: "«وَيُسَمَّى الْمَصِيدُ صَيْدًا فَيُجْمَعُ صُيُودًا»"
          source: "المغرب في ترتيب المعرب للمُطَرِّزي"
        - text: "«وَسُمِّيَ مَا يُصَادُ صَيْدًا إمَّا فَعْلٌ بِمَعْنَى مَفْعُولٍ وَإِمَّا تَسْمِيَةٌ بِالْمَصْدَرِ»"
          source: "المصباح المنير للفيّومي"
        - text: "«والصَّيْدُ: ما تُصَيِّدَ»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
        - text: "«الصَّيْدُ... الْمَصِيدُ»"
          source: "مختار الصحاح للرازي"
      contradicts:
        - text: "«الصيد: ما امتنع بجناحه أو بقوائمه مأكولا أو غيره، ولا يؤخذ إلا بحيلة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "يقصر الصيد على الحيوان الوحشي الممتنع المأخوذ بحيلة، وهو أضيق من «أي شيء يُصاد» في تعريف المجموعة الذي يشمل كل مُمسَك به"
        - text: "«حيوان ممتنع متوحش طبعا لا يمكن أخذه إلّا بحيلة، فخرج بقيد الممتنع الدجاجة والبطّ ونحوهما»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التعريف الفقهي يستثني الدواجن والأليفة، مما يجعله أضيق من تعريف المجموعة الشامل"
        - text: "«ما كان ممتنعا من الحيوان ولم يكن له مالك وكان حلالا أكله»"
          source: "تحفة الأريب بما في القرآن من الغريب لأبي حيان الغرناطي"
          conflict: "يضيف قيود الحل وانعدام الملكية وهي قيود فقهية لا دلالية؛ يجعل المعنى أضيق من «أي شيء يُصاد»"
      expands:
        - text: "«ومن المجاز: صدنا الكمأة، وصدنا ماء المطر، وهو يصيد الناس بالمعروف»"
          source: "أساس البلاغة للزمخشري"
          addition: "توسيع المجال: الصيد يتعدى الحيوان ليشمل التقاط الكمأة والمطر والمجاز في صيد القلوب بالمعروف — يقترب من الدلالة الأعم «أي شيء يُمسَك به»"
        - text: "«(الصَّيَد) داءٌ بالعُنُق لا يُسْتَطاعُ معـه الالتفاتُ»"
          source: "المعجم الكبير"
          addition: "معنى مستقل تماماً (الصَّيَد بالتحريك): مرض في العنق — بعد دلالي لا صلة له بتعريف المجموعة لكنه جدير بالتمييز"
      peripheral_observations:
        - "الصَّيَد (بفتح الياء): داء يصيب الإبل والإنسان في الرقبة يمنع الالتفات — معنى مستقل غير مرتبط بالمجموعة الترادفية"
        - "الصِّيد (بكسر الصاد): جمع الأصيد، وهو الملوك والشرفاء الذين لا يلتفتون تيهاً — معنى مستقل آخر"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "طريدة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الطَّريدَة: الصيدُ ما طُرِدَت من صَيْدٍ أو غيرِهِ» — المعجم الكبير (OCR)"
      justification: "مصدر اشتقاقي من ط-ر-د يدل على ما يُطارَد ويُصاد؛ موثَّق في المعجم الموحد للطب البيطري (game animals) وفي المورد الحديث بمعنى quarry"
    - lemma: "قنيص"
      source_section: "step4_fts_keyword"
      evidence_citation: "«القَنِيص: حيوان مقنوص أو مَصِيد» — المورد الحديث (2008)"
      justification: "اسم على وزن فَعِيل بمعنى مفعول (ما يُقنَص)؛ مستخدم في المعجم الثنائي كمقابل لـ«kill» في سياق الصيد، يعادل semantically «ما يُصاد»"
  knowledge_candidates:
    - lemma: "فريسة"
      justification: "آلية: اشتقاق — وزن فَعِيلة بمعنى مفعول من الجذر ف-ر-س؛ تدل على ما يُمسَك ويُفرَس، وهي أقرب الألفاظ العربية لمفهوم «ما يتم اصطياده» في السياق الحيواني، غير أنها تركّز على الافتراس لا مجرد الإمساك"
  generation_notes: "التعريف يدور حول مفهوم الشيء المُقتنَص؛ الجذور الدلالية المركزية في العربية: ص-ي-د (صيد)، ط-ر-د (طريدة)، ق-ن-ص (قنيص)، ف-ر-س (فريسة). التحدي الرئيسي أن التراث العربي ربط الصيد بالحيوان الوحشي تحديداً بينما التعريف الإنجليزي (catch) أعم"

step1_lemma_validation:
  per_lemma:
    - lemma: "صيد"
      decision: confirmed
      decision_reason: "أدلة قاطعة ومتكاثرة من مصادر كلاسيكية ومعاصرة تثبت استخدام «صيد» بمعنى المصيد (ما يُصاد)؛ وإن ضيّقت المصادر الفقهية دلالته على الحيوان الوحشي الحلال، فإن الاستخدام اللغوي الأصيل أعم كما في «صدنا ماء المطر» (الزمخشري). الكلمة عربية خالصة، خفيفة النطق، اشتقاقية خصبة (صياد، مصيدة، يصطاد...)، ولا تعاني من ترجمة حرفية"
      evidence_assessment:
        case: mixed
        notes:
          - "أدلة مؤكدة وافرة: ما يُصاد (المعجم الوسيط، لسان العرب، المحكم، المصباح المنير، تاج اللغة، النهاية، المغرب)"
          - "أدلة متناقضة من المصادر الفقهية: تضيّق إلى الحيوان الوحشي الحلال الممتنع — وهو أضيق من تعريف المجموعة"
      substitution_test:
        result: pass
      nuance_differentiation: "«صيد» في هذه المجموعة مصدرٌ يُستعمل بمعنى اسم المفعول (مَصِيد) — أي الشيء الذي يُصاد لا فعل الصيد. هذا الاستعمال المجازي المتجذّر (مصدر بمعنى مفعول) يميّزه عن أي مرشح بديل: «طريدة» تؤكد الملاحقة، «فريسة» تخص الافتراس، أما «صيد» فأعمّها وأشيعها في النصوص العربية قرآناً وحديثاً وشعراً"
      example: "عاد الصيادُ بصيدٍ وفيرٍ من سمك البحر وطير الساحل بعد رحلة استمرت يومين"

    - lemma: "طريدة"
      source: step05
      decision: removed
      decision_reason: "طريدة تركّز دلالةً على الملاحقة والطرد (ط-ر-د) لا الإمساك؛ فالطريدة قد تُطرَد دون أن تُمسَك. كذلك تشعّبت معانيها في المعاجم الكلاسيكية (شقة ثوب، خط الظهر، عُرجون النخل) مما يضعف قيمتها الاصطلاحية في هذا السياق دون قرينة"
      step05_citation: "«الطَّريدَة: الصيدُ ما طُرِدَت من صَيْدٍ أو غيرِهِ» — المعجم الكبير (OCR)"
      substitution_test:
        result: pass
      nuance_differentiation: "تؤكد المطاردة والسعي نحو الصيد، لا لحظة الإمساك به؛ وقد تُطلَق على ما فرّ ولم يُمسَك"

    - lemma: "قنيص"
      source: step05
      decision: removed
      decision_reason: "قنيص مصطلح أخص من صيد: يخص القنص من الكمين والصمت (ق-ن-ص)؛ وروده في المعاجم المعاصرة محدود وضمن سياق ترجمي (مقابل لـ«kill» في المورد الحديث)، ولا يصلح مدخلاً مستقلاً في هذا المستوى الدلالي الأعم"
      step05_citation: "«القَنِيص: حيوان مقنوص أو مَصِيد» — المورد الحديث (2008)"
      substitution_test:
        result: pass
      nuance_differentiation: "أخص من صيد: يخص الصيد بالكمين والمهارة الصامتة (القنص)، بينما صيد أعم"

    - lemma: "فريسة"
      source: step05
      decision: removed
      decision_reason: "فريسة (ف-ر-س = التمزيق) تخص ما يُفرَس من الحيوانات في سياق المفترس-الفريسة؛ لا تصح في صيد السمك بالشبكة أو طير السهل بالفخ. فشل اختبار الإبدال في سياقات غير الافتراس"
      step05_citation: "«(الفريسة) مَا يفرسه السَّبع من الحيوان» — المعجم الوسيط"
      substitution_test:
        result: fail
      nuance_differentiation: "مقيّدة بسياق الافتراس الحيواني (أسد-غزال)؛ لا تُبدَل بـ«صيد» في: «صيد البحر» أو «صاد الكمأة»"

  synset_flags:
    definition_review_needed: true

