step0_evidence:
  per_lemma:

    - lemma: "دلالة"
      confirm:
        - text: "«الدَّلِيلُ والإِرْشادُ ما يُفْهَمُ من اللَّفْظِ عند إِطْلَاقِه... (فى الفَلْسَفة): شىءٌ أو مَعْنًى يُفيدُه لفظٌ أو رَمْزٌ ما، وهى ما إذا نُظِر فيها وَصَلَتْه إلى العِلْم بالغَيْرِ»"
          source: "المعجم الكبير"
        - text: "«الإرشاد ما يقتضيه اللفظ عند إطلاقه»"
          source: "المعجم الوسيط"
        - text: "«الدَّلالةُ: كَون الشَّيْء بِحَالَة يلْزم من الْعلم بِهِ الْعلم بِشَيْء آخر»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الدلالة: هي كون الشيء بحالة يلزم من العلم به العلم بشيء آخر، والشيء الأول هو الدال، والثاني هو المدلول»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الدَّلالة: بالفتح هي كونُ الشيء بحالة يلزم من العلم به العلم بشيء آخر والشيء الأول هو الدال والثاني المدلول»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الإرشاد، وما يقتضيه اللفظ عند إطلاقه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«حِرْفَةُ الدَّلَّالِ / ما يُجْعَل لِلدَّلِيلِ أو الدَّلَّالِ مـن الأُجْرَةِ»"
          source: "المعجم الكبير"
          addition: "معنى مستقل تماماً: حرفة السمسار وأجره — لا صلة له بتعريف المجموعة"
        - text: "«دِلالة... عِلْمُ الدَّلالة [فصيحة] وعِلْمُ الدِّلالة [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "استخدام دلالة في تسمية علم اللغة (Semantics) — أوسع من دلالة المجموعة"
      peripheral_observations:
        - "دلالة بالكسر (دِلالة = حرفة الدلّال وأجره) معنى مستقل تماماً يستحق مجموعة ترادفية منفصلة"
        - "دلالة في تركيب «علم الدلالة» = Semantics — استخدام اصطلاحي تخصصي مستقل"

    - lemma: "علامة"
      confirm:
        - text: "«ما يُسْتَدَلُّ به على الطريق من أثر»"
          source: "المعجم الوسيط"
        - text: "«العَلامة: الأمارة وهي ما يعرف الوجود من تعلق وجود لا وجوب، وقد تتخلَّف عن ذي العلامة كالسحاب فإنه علامة المطر»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الأمارة وعلامة الشَّيْء مَا يعرف بِهِ»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«حدث مُدرك، وبديل أشياء طبيعية أو عرفية أو اعتباطية بقيمة جملة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«عَلَامَات وأمارات وسمات وَدَلَائِل وشواهد وبراهين ومخايل وآثار ومنار وأشراط وندوب»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
        - text: "«العلامة:[في الانكليزية] Mark، signe... ما يكون علما على الوجود من غير أن يتعلّق به وجوب ولا وجود»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«السائل الأمنيوسي الذي يتدفق من عنق الرحم عند بدء الولادة»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          conflict: "مصطلح طبي متخصص (forewaters) لا صلة له بالمفهوم الدلالي للعلامة — تخصيص مبالغ فيه أو خطأ في التعيين المصطلحي"
      expands:
        - text: "«الأعلومة وَمَا ينصب فِي الطَّرِيق فيهتدى بِهِ والفصل بَين الْأَرْضين — (فِي الطِّبّ) مَا يكشفه الطَّبِيب الفاحص من دلالات الْمَرَض»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
          addition: "المعنى الطبي (أعراض المرض) والمعنى المادي الحسي (منار الطريق) أكثر تخصيصاً من التعريف العام للمجموعة"

    - lemma: "مؤشر"
      confirm:
        - text: "«ما يُشار به»"
          source: "المعجم الكبير"
        - text: "«علامة أو دليل على معنى مُضمر أو مدى أو درجة»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«علامة دالة على المعيار، تسمح بوضع المعايير في السياق المحدد لها»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (2020)"
      expands:
        - text: "«في البرمجة ومعالجة المعلومات: متغيِّرٌ يتضمَّن موضعَ الذاكرةِ (العنوان) الخاصّ ببعض المعطيات بدلاً من المعطيات نفسِها»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "معنى تقني حاسوبي مستقل (pointer) يختلف كلياً عن معنى الإشارة/الدلالة"
        - text: "«خاصية كمية أو نوعية أو وصفية، التي عند قياسها أو مراقبتها بشكل دوري، فإن النتائج تشير إلى اتجاه التغيير في معيار»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          addition: "معنى قياسي إحصائي (statistical indicator) يتجاوز المفهوم العام للمجموعة"
        - text: "«غالباً ما تكون لقياس الإزاحة أو القوة المطبقة»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "معنى هندسي متخصص (dial gauge) مستقل تماماً عن مفهوم المجموعة"
      peripheral_observations:
        - "مؤشر بمعنى (pointer) في الحاسوب، و(dial gauge) في الهندسة، و(index) في الاقتصاد — معانٍ تقنية مستقلة تستحق مجموعات ترادفية منفصلة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "أمارة"
      source_section: step4_fts_keyword
      evidence_citation: "«الأمارة: لغة العلامة، واصطلاحاً: هي التي يلزم من العلم بها الظنُّ بوجود المدلول كالغيم بالنسبة إلى المطر» — التعريفات الفقهيّة للبركتي"
      justification: "مصطلح كلاسيكي راسخ مرادف للعلامة مع ظل استنتاجي احتمالي (يُوحي لا يُقطع)، مطابق لشطر «الإيحاء» في تعريف المجموعة؛ وزن فَعَالة مسكوك في المعاجم الكلاسيكية"
    - lemma: "دالّ"
      source_section: step5_english_bridge
      evidence_citation: "«المشير؛ الدالّ؛ المُظْهِر؛ المعبِّر إلخ.» — المورد الحديث (2008) [مقابل: indicant]"
      justification: "اسم فاعل من دلَّ/يدلُّ — مسكوك في السيميائيات العربية في ثنائية الدال/المدلول (Saussure)؛ يمثّل المرشح الأقرب دلالياً لـ indicant: الشيء الحامل للمعنى الدلالي"
  knowledge_candidates:
    - lemma: "سِمَة"
      justification: "اشتقاق من جذر و-س-م (وَسَمَ = وضع العلامة) على وزن فِعْلَة — ورد في مرادفات العلامة عند ابن مالك (عَلَامَات وأمارات وسمات وَدَلَائِل)؛ يستخدم في اللسانيات الحديثة (السمات المميزة = distinctive features)؛ آلية التوليد: إحياء + اشتقاق"
    - lemma: "قرينة"
      justification: "مجاز اشتقاقي من ق-ر-ن (الاقتران والمصاحبة) — تدل على ما يُستدل به من السياق المصاحب على معنى ضمني؛ مطابق لشطر «يُوحي» في تعريف المجموعة؛ آلية التوليد: مجاز (إزاحة دلالية من المصاحبة إلى الاستنتاج)"
  generation_notes: "التعريف يجمع بين الإشارة الصريحة (indication) والإيحاء الضمني (suggestion)؛ الجذور الدلالية المركزية هي د-ل-ل وع-ل-م وأ-م-ر"

