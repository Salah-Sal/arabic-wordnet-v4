step0_evidence:
  per_lemma:

    - lemma: "تواصل خارق"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "الصفة «خارق» موثَّقة في المورد الحديث (2008): «خارق: مُتَعَذِّرٌ تعليلُهُ علميًّا» — translation_en: paranormal"
        - "المركَّب «خارق للطبيعة» يرد مراراً في المورد الحديث مقابلاً لـ supernatural وparanormal"
        - "المركَّب «خارق للطبيعة supernatural powers» مُدرَج صراحةً في المورد الحديث (entry_id: 721287)"

    - lemma: "تواصل روحي"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "الصفة «روحي» موثَّقة في معجم الصواب اللغوي: كلا صيغَتَيْ «رُوحيّ» و«رُوحانيّ» فصيحتان — لكن المعنى: spiritual/غير مادي"
        - "المعجم الطبي الموحد (2009): psychic → «نَفْسِيّ» وليس «روحي» — يدل على أن «روحي» لا تُعدّ المقابلَ التقني لـ psychic في المصطلحية الطبية المعيارية"
        - "المورد الحديث (entry_id: 710690): psychic → «نفسي؛ عقلي / خارق للطبيعة» — «روحي» غائبة عن مقابلات psychic في هذا المعجم"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تخاطر"
      source_section: "step5_english_bridge"
      evidence_citation: "«التَّخاطُر: اتّصال عقل بآخر من غير طريق الكلام أو الكتابة أو الإشارة، أو من غير طريق الحواسّ الخمس» — المورد الحديث (2008)"
      justification: "مصطلح عربي موثَّق مُشتقّ بوزن تَفَاعُل من جذر خ-ط-ر (الخاطر: ما يَعرض للذهن ويمرّ به) — آلية الاشتقاق. يُعبّر عن التواصل العقلي خارج نطاق الحواس الخمس، وهو جوهر معنى التواصل الخارق. وارد في المعجم الطبي الموحد (telepathy) ومسرد علم الاجتماع والأنثروبولوجيا"
  knowledge_candidates:
    - lemma: "التواصل الغيبي"
      justification: "تركيب وصفي — آلية التركيب. «غيبي» نسبة إلى الغيب (ما وراء الإدراك الحسي)، وهو مصطلح قرآني راسخ يُعبّر عن المجال ذاته (ما لا يُدرَك بالحواس). التركيب يعكس البُعد الثقافي العربي للمفهوم ويُفرّق بين ما هو طبيعي (شهادة) وما هو خارج الإدراك المادي (غيب)"
  generation_notes: "المفهوم يقع عند تقاطع المصطلحية النفسية (parapsychology) والتراث العربي الروحي — لا يوجد مصطلح مفرد موحَّد في المعاجم العربية للمفهوم الكلي؛ الجذور الدلالية المرصودة: خ-ط-ر، خ-ر-ق، غ-ي-ب"

step1_lemma_validation:
  per_lemma:

    - lemma: "تواصل خارق"
      decision: confirmed
      decision_reason: "«خارق» موثَّق بمعنى paranormal في المورد الحديث؛ المركَّب الوصفي دقيق دلاليًّا ومنسجم مع التعريف — لا ترجمة حرفية عمياء (خارق يعكس المدلول العلمي لـ paranormal)"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُعبّر عن تجاوز قوانين الطبيعة المادية بصرف النظر عن طبيعة القناة (ذهنية أم روحية أم أخرى) — أشمل وأدق من «روحي» لأنه يغطي طيف paranormal كاملاً دون اختزاله في بُعد ديني أو روحاني"
      example: "أثارت الدراسة جدلاً أكاديميًّا حين أعلنت رصد حالات موثَّقة من التواصل الخارق بين متطوعين تفصل بينهم قارّات."

    - lemma: "تواصل روحي"
      decision: removed
      decision_reason: "ترجمة حرفية مُضلِّلة — «روحي» يدل على ما يتعلق بالرُّوح (spiritual) لا على ما خرج عن التفسير العلمي (paranormal)؛ المعجم الطبي الموحد يُترجم psychic بـ «نفسي» لا «روحي»؛ المصطلح يُضيّق المجموعة ويُوجد التباساً مع المعنى الديني/الصوفي غير المقصود"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
      nuance_differentiation: "«روحي» يعكس الجانب الروحاني للمصطلح الإنجليزي psychical دون الجانب الأهم وهو خروج التواصل عن التفسير الحسي والعلمي — هو اقتراض مفهومي جزئي (calque) يفقد الدلالة المحورية"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تخاطر"
      source: step05
      decision: escalated
      decision_reason: "نطاقه الدلالي متضارب بين المعجمَيْن — المورد الحديث يُعرّفه تعريفًا شاملاً (اتصال عقل بآخر دون الحواس الخمس = paranormal communication) بينما المعجم الطبي الموحد يُخصّصه بنقل الأفكار (thought-transference/telepathy فقط) — قد يكون أخصّ من المجموعة الترادفية المستهدفة (hyponym)"
      step05_citation: "«التَّخاطُر: اتّصال عقل بآخر من غير طريق الكلام أو الكتابة أو الإشارة، أو من غير طريق الحواسّ الخمس» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تخاطر يُركّز على البُعد الذهني العقلي (عقل إلى عقل) دون تغطية أشكال أخرى من التواصل الخارق كالتواصل مع الأرواح أو الإدراك خارج الحواس (clairvoyance) — يمثّل النمط الأشهر لكنه ليس مرادفًا تامًّا للمجموعة"

    - lemma: "التواصل الغيبي"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر لم يُسكَّ في مصدر معجمي أو تخصصي — يفشل اختبار التثبيت المعجمي؛ يمكن إبدال «غيبي» بـ«خارق» دون فقدان المعنى مما يدل على أنه تركيب وصفي لا مصطلح"
      step05_citation: "لا دليل معجمي مباشر — مقترح من المعرفة اللغوية الداخلية"

