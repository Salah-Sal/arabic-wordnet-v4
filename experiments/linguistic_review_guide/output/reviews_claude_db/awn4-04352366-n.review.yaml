      nuance_differentiation: "أغراض جمع غَرَض الذي يحمل في الأصل معنى الهدف والقصد؛ ثم توسّع في الاستعمال المعاصر ليدل على الأشياء الشخصية والحاجيات. يتميز عن «أشياء» بإيحائه بالانتماء الشخصي وصلة الشيء بصاحبه، ويُستعمل عادةً مضافاً (أغراضه، أغراضك). يقلّ استعماله للأشياء المجردة أو غير الشخصية"
      example: "احضر أغراضك من الغرفة قبل إغلاق المبنى"

