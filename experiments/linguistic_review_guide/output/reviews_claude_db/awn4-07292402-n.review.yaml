step0_evidence:
  per_lemma:
    - lemma: "صوت"
      confirm:
        - text: "«قدرة التعبيرعن شيء، وهي عبارة عن تحديد قدرة فاعلي (مسرح أو أوبرا أو غناء)»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«الرأى تبديه كتابة أو مشافهة فى موضوع يقرر أو شخص ينتخب. (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«إبداء الرَّأي كتابةً أو مشافهةً في موضوع يُقرَّر أو شخص يُنْتَخب»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (د. 2003)"
        - text: "«إنتاج ومُحاكاة وتفهم الصوت البشري بواسطة المعلوميات»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      expands:
        - text: "«ما وقَرَ فى أُذُنِ السَّامع من جَرْسِ صِياحٍ ونحوه وقيل: كلُّ ما يَقْرَعُ حاسة السمع»"
          source: "المعجم الكبير"
          addition: "المعنى الفيزيائي الحسي الأشمل — يتجاوز دلالة «وسيلة التعبير» إلى كل مدرك سمعي بصرف النظر عن وظيفته التعبيرية"
        - text: "«الصَّوتُ: الجَرْسُ، معروف، مذكر»"
          source: "لسان العرب لابن منظور (د. 1311)"
          addition: "الجرس الصوتي بعمومه — أوسع من مفهوم وسيلة التعبير المجازية"
        - text: "«كلُّ ضَرْبٍ من الغِناءِ صَوْتٌ»"
          source: "لسان العرب لابن منظور (د. 1311)"
          addition: "المعنى الغنائي/الموسيقي — بُعد مستقل لا يستوعبه تعريف المجموعة الذي يقصر الدلالة على وسيلة التعبير الشبيهة بالكلام"
        - text: "«الصَّوْت في الفيزياء: الأثر السمعيّ الذي تحدثه تموُّجات ناشئة من اهتزاز جسم ما»"
          source: "المعجم الوسيط"
          addition: "المعنى العلمي/الفيزيائي الدقيق — تعريف تقني للظاهرة الصوتية المادية، لا علاقة له بكون الصوت وسيلة تعبير مجازية"
        - text: "«مجموع الأمواج الصوتية المنتجة في الحنجرة بذبذبة الحبال الصوتية تحت ضغط الهواء الواقع أسفل الحنجرة»"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "التعريف الفسيولوجي الصوتي — يخص الصوت البشري الجسدي لا الصوت بوصفه وسيطاً تعبيرياً مجازياً"
      peripheral_observations:
        - "«الصِّيتُ: الذِّكْرُ الحَسَنُ فِي النَّاسِ... والصَّوْتُ لغةٌ في الصِّيتِ» — لسان العرب: دلالة السمعة والشهرة الحسنة المنتشرة في الناس — مستقلة تماماً عن مفهوم المجموعة ولا تربطها به إلا القرابة الجذرية"
        - "«اسمُ الصَّوْتِ (عند النُّحَاة): كلُّ لفظٍ حُكِىَ به صوتٌ أو صُوِّتَ به لزجرٍ أو دعاءٍ أو تعجُّبٍ أو تَوجُّعٍ أو تَحَسُّرٍ» — المعجم الكبير: مصطلح نحوي تقني خاص بالأصوات المحكية — لا صلة له بمفهوم المجموعة"
        - "«صَوْتٌ: من نواحي اليمامة وادٍ فيه نخيل» — معجم البلدان لياقوت الحموي: اسم علم جغرافي — خارج نطاق التحليل الدلالي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "صوت"
      source_section: "step5_english_bridge"
      evidence_citation: "«صوت: قدرة التعبيرعن شيء، وهي عبارة عن تحديد قدرة فاعلي (مسرح أو أوبرا أو غناء)» — المعجم الموحد لمصطلحات اللسانيات (2002) [translation_en: voice, Language and Literature domain]"
      justification: "مقابل عربي مباشر للمصطلح الإنجليزي «voice» بمعناه التعبيري — مسجَّل في معاجم اللسانيات التخصصية المعاصرة بالمعنى المطابق لتعريف المجموعة"
  knowledge_candidates:
    - lemma: "لسان"
      justification: "مجاز — اللسان آلة الكلام والنطق بامتياز، والعربية تستخدمه مجازاً صريحاً لوصف وسائل التعبير غير النطقية: «فلان لسان قومه» (المتحدث/الصوت باسمهم)، «لسان الحال» (صوت الأحوال والمواقف)؛ هذا توليد بآلية المجاز (إزاحة دلالية) — العضو الجسدي يُزاح معناه إلى الوظيفة التعبيرية"
  generation_notes: "التعريف يستهدف المعنى المجازي للصوت بوصفه وسيطاً تعبيرياً لا الظاهرة الصوتية الحسية؛ الجسر الإنجليزي يُجمع على «صوت» مقابلاً عربياً في هذا السياق؛ «لسان» يُقدَّم كمرشح معرفي قد يُثري المجموعة أو يُصعَّد للمراجع البشري"

step1_lemma_validation:
  per_lemma:
    - lemma: "صوت"
      decision: confirmed
      decision_reason: "أدلة مؤكدة في المعاجم التقنية المعاصرة (اللسانيات، المعلوماتية) على المعنى التعبيري؛ جذر عربي أصيل شديد الاشتقاقية؛ المقابل الراسخ لـ«voice» بمعنى وسيلة التعبير"
      evidence_assessment:
        case: mixed
        notes:
          - "المعنى الصوتي الفيزيائي هو المعنى الجذري والأوفر حضوراً في المعاجم الكلاسيكية — يتجاوز نطاق تعريف المجموعة"
          - "المعنى التعبيري/المجازي موثَّق في المصادر اللسانية والمعاصرة ويطابق تعريف المجموعة مباشرةً"
          - "اللمّة متعددة المعاني في AWN وهذا المعنى يمثّل إحدى حساساتها الدلالية المستقلة"
      substitution_test:
        result: pass
      nuance_differentiation: "في هذا السياق المحدد «صوت» يُمثّل الوجه المجازي للكلمة — الصوت بوصفه قناةً أو وسيطاً للتعبير لا الجرسَ الصوتيَّ الحسّي؛ الفارق عن الحساسات الأخرى لـ«صوت» هو الغرض التعبيري: «الفن صوتُ الروح» vs. «صوت الطائر»"
      example: "كانت الموسيقى طوالَ التاريخ صوتاً للمظلومين يُعبّر عمّا تعجز عنه الكلمات."

    - lemma: "لسان"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار التثبيت المعجمي في هذا السياق التحديدي: معنى «الوسيلة التعبيرية الشبيهة بالكلام» ليس سمةً مستقلة ثابتة مسكوكة لـ«لسان» في المعاجم — بل هو امتداد استعاري ثانوي يتنافس مع معانيه الرئيسية (العضو الجسدي / اللغة / الناطق الرسمي)؛ الاستخدام في هذا السياق الدلالي يُفضي إلى اشتراك لفظي مع synsets أخرى (tongue، language، spokesman)"
      step05_citation: "«اللُّغَةُ، والرِّسالَةُ، والمُتَكَلِّمُ عن القَوْمِ» — القاموس المحيط للفيروزآبادي (د. 1415)"

