step0_evidence:
  per_lemma:

    - lemma: "مَكَان"
      confirm:
        - text: "«الموضِعُ»"
          source: "المعجم الوسيط"
        - text: "«(الْمَكَان) الْمنزلَة يُقَال هُوَ رفيع الْمَكَان والموضع (ج) أمكنة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الْمَكَان: إِمَّا مصدر ميمي بِمَعْنى الْكَوْن. أَو مفعل اسْم مَكَان بِمَعْنى الْموضع فَهُوَ فِي اللُّغَة مَا يوضع الشَّيْء فِيهِ وَمَا يعْتَمد عَلَيْهِ كالأرض للسرير»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«المكان: عند الحكماء، هو السطح الباطن من الجسم الحاوي المماس للسطح الظاهر من الجسم المحوي، وعند المتكلمين: هو الفراغ المتوهم الذي يشغله الجسم وتنفذ فيه أبعاده»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«المكان:[في الانكليزية] Place، situation»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«المكان: عند أهل الحقائق: يراد به المكانة، وهي منزلة في البساط لا تكون إلا للمتمكنين الذين جاوزوا الجلال والجمال»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المعنى الصوفي/الروحاني للمكانة خارج نطاق المعنى المكاني الفيزيائي المقصود في المجموعة"
        - text: "«المكان: هو في العرف العام ما يمنع الشيء من النزول»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التعريف الأرسطي الفيزيائي يُفصّل المفهوم ويُضيّق الدلالة إلى السطح الحاوي — أخصّ من «نقطة أو حيّز»"
      peripheral_observations:
        - "المعجم الوسيط (مج) يورد مدخلاً مختلفاً: «المَكَّان = من يُدير المكنة» (بتشديد الكاف)؛ هذا حرف مختلف يلتبس بالتطبيع، لا علاقة له بالموضع المكاني"
        - "المعجم الوسيط يُحيل (انظر: كون) مما يُرسّخ أن الجذر الأصلي ك-و-ن لا م-ك-ن"

    - lemma: "مَوْقِع"
      confirm:
        - text: "«مكانُ الوقوع»"
          source: "المعجم الوسيط"
        - text: "«(الْموقع) مَكَان الْوُقُوع يُقَال وَقع الشَّيْء موقعه (ج) مواقع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«مَوْقِع: بمعنى موضع أو المكان الذي توجد فيه بعض الأشياء»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«مَوْقَعٌ: بالفتح ثم السكون، وفتح القاف... كأنه من الوقوع: موضع»"
          source: "معجم البلدان لياقوت الحموي"
      expands:
        - text: "«موقع الشمس: مغيب الشمس؛ موقع: مصب النهر»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "توسيع نحو معانٍ جغرافية محددة (مغيب الشمس، مصب النهر) تتجاوز الدلالة العامة لـ«موضع في الفضاء»"
        - text: "«له موقع حسن عند فلان — وأعظمها (الآداب) موقعاً»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "دلالة مجازية على المكانة الاجتماعية ومدى التأثير، خارج نطاق المعنى المكاني الفيزيائي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مَوْضِع"
      source_section: "step5_english_bridge"
      evidence_citation: "«مَوْضِعٌ: location» — المعجم الطبي الموحد (2009)"
      justification: "مَفعِل من و-ض-ع، يدل على الموضع الذي يُوضع فيه الشيء أو يُحدَّد مكانه؛ مقابل مباشر لـ location في المعاجم التخصصية الطبية والهندسية؛ آلية التوليد: اشتقاق (مَفعِل = اسم مكان)"
  knowledge_candidates:
    - lemma: "مَحَل"
      justification: "اشتقاق من ح-ل-ل على وزن مَفعَل (اسم مكان)، معناه «الموضع الذي يحلّ فيه الشيء»، وارد في الفصحى الكلاسيكية والفلسفية («المحل: المكان الذي يحل فيه» — دستور العلماء)؛ آلية التوليد: اشتقاق"
  generation_notes: "التعريف «نقطة أو حيّز في المكان» يستخدم «مكان» لتعريف مكان نفسه (دوران)؛ المفهوم الإنجليزي «a point or extent in space» يُقابَل في العربية بمصطلحات عدة: موضع وموقع ومحل وحيّز وبقعة — أكثرها شيوعاً في التداول التقني: موضع وموقع"

step1_lemma_validation:
  per_lemma:

    - lemma: "مَكَان"
      decision: confirmed
      decision_reason: "أدلة مؤكدة متعددة من معاجم موثوقة تُثبت المعنى المكاني («الموضع»)؛ الكلمة أصيلة ذات إنتاجية اشتقاقية عالية (تمكّن، متمكّن، مكانة، أمكنة)؛ هي الأعمّ والأشيع في العربية للدلالة على الموضع في الفضاء"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "مكان هو الأعمّ والأشمل — يدل على أي موضع في الفضاء بصرف النظر عن خصائصه أو ما يرتبط به من حدث؛ أقل تخصيصاً من موقع (المرتبط بالوقوع والحدث)، وأوسع من موضع (المرتبط بعملية الوضع والتعيين الدقيق). وزنه الصرفي مَفعَل (اسم مكان) مناسب تماماً"
      example: "تقع المدينة القديمة في مكان استراتيجي يطل على الوادي من جهاتٍ ثلاث."

    - lemma: "مَوْقِع"
      decision: confirmed
      decision_reason: "أدلة مؤكدة وتوسيعية من معاجم كلاسيكية وحديثة؛ وزن مَفعِل من و-ق-ع هو الوزن القياسي لاسم مكان الوقوع؛ الجانب التوسّعي (المجازات الاجتماعية والمعاني الجغرافية) لا يُخرجه من المجموعة لأن المعنى المكاني الأصلي راسخ"
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: "موقع يحمل دلالة الموضع المحدد والمعيَّن الذي وقع فيه شيء أو خُصِّص لحدث أو غرض؛ أخصّ من مكان في دلالة التحديد، ويُستعمل بكثرة في السياقات التقنية والجغرافية والرقمية (موقع أثري، موقع إلكتروني، موقع معركة). الجانب التوسّعي (المكانة الاجتماعية «موقعه عند الأمير») يُلاحَظ كبُعد محيطي لا يُخرجه عن المجموعة"
      example: "حدّد الجيولوجيون موقع الحفريات بدقة باستخدام نظام تحديد المواقع العالمي."

    - lemma: "مَوْضِع"
      source: step05
      decision: confirmed
      decision_reason: "مقابل مباشر لـ location في المعاجم التخصصية الطبية والهندسية؛ أصيل في الفصحى الكلاسيكية والمعاصرة؛ وزن مَفعِل من و-ض-ع (اسم مكان)؛ يجتاز اختبار السكّ (تعبير مفرد مستقر) واختبار الإبدال في سياقات التحديد الدقيق"
      step05_citation: "«مَوْضِعٌ: location» — المعجم الطبي الموحد (2009)"
