# مراجعة المجموعة الترادفية: awn4-07957969-n
# biotic community — المجتمع الحيوي
# ─────────────────────────────────────────

step0_evidence:
  per_lemma:
    - lemma: "مجتمع حيوي"
      confirm:
        - text: "«مُجْتَمَعٌ حَيَوِي — biotic community»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(٤) المجتَمَع: مجموعة من النباتات أو الحيوانات تحيا معاً»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مجتمع: في علم البيئة كل جملة من المتعضيات (الأحياء) تعيش معا دون ذكر خاص لأحوالها البيئية»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "يُبيّن صراحةً أن المجتمع الحيوي يختص بالمكوّن الحيّ فحسب بمعزل عن الأحوال البيئية اللاأحيائية — بُعد تعريفي غائب في صياغة AWN الحالية"
        - text: "«مجتمع بيئي — ecological community — منطقة يحددها غطاؤها النباتي السائد»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          addition: "يكشف وجود مصطلح موازٍ أوسع نطاقاً (ecological community) يشمل البيئة اللاأحيائية أيضاً، في مقابل «المجتمع الحيوي» الأخصّ المقتصر على الكائنات الحية"
      peripheral_observations:
        - "«تعايشية: معيشة مشتركة. حياة مشتركة بين كائنات حية نباتية وحيوانية، والتي يمكن أن تنشأ نتيجة لمتطلبات بيئية متماثلة، والاعتماد من جانب واحد أو المتبادل في الموائل ذات الصلة (وسط أحيائي) وتشكل بنية مترابطة — biocenosis» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm): مدخل مستقل يُغطّي المفهوم ذاته (biocenosis = biotic community)، مستحق للدراسة كلمّة إضافية في هذه المجموعة"

# ─────────────────────────────────────────
step05_lemma_generation:
  evidence_candidates:
    - lemma: "تعايشية"
      source_section: "step4_fts_keyword"
      evidence_citation: "«تعايشية: معيشة مشتركة. حياة مشتركة بين كائنات حية نباتية وحيوانية، والتي يمكن أن تنشأ نتيجة لمتطلبات بيئية متماثلة، والاعتماد من جانب واحد أو المتبادل في الموائل ذات الصلة (وسط أحيائي) وتشكل بنية مترابطة — biocenosis» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      justification: "مصدر صناعي عربي خالص من الجذر ع-ي-ش عبر المسار (تعايش → تعايشية)؛ آلية الاشتقاق. يُقابل biocenosis الذي يرادف biotic community في المصطلح العلمي الدولي. الدليل من مسرد بيئي رسمي."
    - lemma: "مجتمع بيولوجي"
      source_section: "step5_english_bridge"
      evidence_citation: "«مجتمع بيولوجي — biological community» — المعجم الموحد لمصطلحات المياه (2000)"
      justification: "مصطلح موحّد في معجم فني رسمي؛ يستخدم «بيولوجي» بدلاً من «حيوي» مقابل biological community — قريب دلالياً من biotic community"
  knowledge_candidates:
    - lemma: "الجماعة الحيوية"
      justification: "تركيب إضافي (آلية: تركيب) — «جماعة» اللفظ التراثي لتجمع الكائنات + «حيوية» صفة الحياة؛ بعض المراجع العلمية العربية القديمة تستخدم «جماعة» مقابل community في البيئة، وهو أقرب إلى التراث من «مجتمع»"
  generation_notes: "للمفهوم مصطلحان شائعان بالإنجليزية (biotic community وbiocenosis) يُعبَّر عنهما بعربيتين مختلفتين. أقوى الأدلة تشير إلى تعايشية (biocenosis) كمقابل مسجّل."

# ─────────────────────────────────────────
step1_lemma_validation:
  per_lemma:

    - lemma: "مجتمع حيوي"
      decision: confirmed
      decision_reason: "مصطلح تقني مسجّل في المعجم الطبي الموحد (2009) مقابل biotic community؛ تركيب وصفي مستقر في المعجمية العلمية العربية؛ البنية calque صحيحة (biotic→حيوي، community→مجتمع) لا ترجمة عمياء؛ يجتاز بوابة الجودة في المعايير الستة: شيوع في الفصحى العلمية، يُسر التداول، ملاءمة المفهوم، إيثار العربي، الاشتقاقية (مجتمعي حيوي ممكنة)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "اللمّة الرئيسية في المجموعة؛ تتميز عن «مجتمع بيئي» (ecological community) بتخصيص البُعد الحيوي (biotic) فقط دون العوامل اللاأحيائية، وعن «مجتمع بيولوجي» باستخدام «حيوي» الأدق في علم البيئة الإيكولوجي (biotic ≠ biological في السياق البيئي)"
      example: "يتألف المجتمع الحيوي في غابات المانغروف من أنواع متشابكة من الأسماك والطحالب والإنفسيليات التي تُشكّل نسيجاً بيئياً متكاملاً."

    - lemma: "تعايشية"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح بيئي مسجّل في مسرد المناخ والبيئة (ArabTerm) كمقابل لـ biocenosis = biotic community؛ مصدر صناعي عربي سليم من الجذر ع-ي-ش؛ يجتاز اختبار السكّ (لفظة مصطلحية ثابتة لا وصفاً حراً)؛ يجتاز اختبار التثبيت المعجمي (وارد في مسرد رسمي)؛ يجتاز بوابة الجودة: لا لهجية، لا اقتراض لفظي، الاشتقاقية جيدة (تعايشي، التعايشيات)"
      step05_citation: "«تعايشية: معيشة مشتركة. حياة مشتركة بين كائنات حية نباتية وحيوانية... وتشكل بنية مترابطة — biocenosis» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      substitution_test:
        result: pass
      nuance_differentiation: "تُركّز على بُعد التعايش والتشابك الوظيفي بين الكائنات في الموئل المشترك، بينما يُبرز «مجتمع حيوي» الجانب التجمّعي البنيوي؛ «تعايشية» أقرب إلى المعنى الاشتقاقي الدقيق لـ biocenosis (bio + koinosis = تشارك الحياة) في حين «مجتمع حيوي» أكثر شيوعاً في الكتابة العلمية العربية المعاصرة"
      example: "تُعدّ تعايشية الشعاب المرجانية إحدى أكثر التجمعات الحيوية تنوعاً على وجه الأرض، إذ تحتضن نحو ربع أنواع الأحياء البحرية المعروفة."
      actions:
        - command: create_entry
          params:
            lemma: "تعايشية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07957969-n"

    - lemma: "مجتمع بيولوجي"
      source: step05
      decision: removed
      decision_reason: "يُقابل biological community (أعمّ) لا biotic community (أخصّ)؛ «بيولوجي» يشمل الدراسة البيولوجية الشاملة بينما «حيوي» يختص بالمكوّن الحيّ البيئي — التوسيع يتجاوز حدود هذه المجموعة الترادفية"
      step05_citation: "«مجتمع بيولوجي — biological community» — المعجم الموحد لمصطلحات المياه (2000)"

    - lemma: "الجماعة الحيوية"
      source: step05
      decision: removed
      decision_reason: "لم يُوثَّق في أي مصدر معجمي مفحوص؛ فشل اختبار التثبيت المعجمي — يمكن إبدال «الجماعة» بـ«التجمع» أو «المجموعة» دون أثر دلالي محسوس، مما يكشف أنه تعبير وصفي حر لا مصطلح مسكوك"
      step05_citation: "لا وجود في قواعد البيانات المفحوصة"

  added_lemmas:
    - lemma: "تعايشية"
      reason: "مصطلح بيئي عربي مسجّل في مسرد رسمي، مرادف لـ biocenosis = biotic community"
      via_command: create_entry + add_sense

