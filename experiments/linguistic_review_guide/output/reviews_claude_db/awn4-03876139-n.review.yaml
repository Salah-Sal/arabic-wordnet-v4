step1_lemma_validation:
  per_lemma:

    - lemma: مُسَكِّن
      decision: confirmed
      decision_reason: >
        أدلة مؤكدة ومُوسِّعة من خمسة معاجم معتمدة؛ عربي أصيل من الجذر س-ك-ن بوزن مُفَعِّل الملائم لاسم الفاعل
        الدال على «ما يُسَكِّن»؛ يُسر التداول عالٍ؛ اشتقاقية غنية (سكَّن، تسكين، مُسَكَّن، مُسَكِّنات)؛
        لا اشتراك لفظي مُلبِس مع مَسْكَن (المسكن) لأن الشكل المشكَّل مُسَكِّن يُمَيِّزهما، وإن كان الشكل
        الأقرع (مسكن) مشتركاً مع المَسْكَن في الكتابة — إشكالية الاشتراك الأقرعي لا تمنع القبول لأن
        السياق يُزيل الإلباس دائماً.
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: >
        يتميز عن مُهَدِّئ بالتركيز على إزالة الإحساس بالألم الجسدي (analgesic) تحديداً؛
        بينما مُهَدِّئ يُطلق على ما يُخفف التوتر والنشاط العصبي (sedative/tranquilizer) سواء أكان جسدياً
        أم نفسياً. كلاهما نوع من التسكين لكن بآلية مختلفة: مُسَكِّن يعمل على المسارات العصبية للألم،
        ومُهَدِّئ يعمل على المركز العصبي العام.
      example: "وصف الطبيب للمريض مُسَكِّناً قوياً للتخفيف من حدة الآلام الحادة في أعقاب العملية الجراحية."

    - lemma: مُهَدِّئ
      decision: confirmed
      decision_reason: >
        أدلة مؤكدة ومُوسِّعة من معاجم طبية متعددة؛ عربي أصيل من الجذر هـ-د-أ بوزن مُفَعِّل الملائم؛
        دلالته أوسع من مُسَكِّن إذ تمتد لغير الأدوية («شخص مهدئ للأعصاب»)، مما يتوافق مع
        عموم التعريف «أي شيء يعمل على التهدئة»؛ اشتقاقية جيدة (هدَّأ، تهدئة، مُهَدَّأ، مُهَدِّئات).
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: >
        يتميز عن مُسَكِّن بالشمول الدلالي (يُطلق على الشخص والدواء والوسيلة معاً) وبالتركيز على
        تهدئة الجهاز العصبي وتخفيف الانفعال والقلق، لا إزالة الألم الجسدي تحديداً. ويتميز أيضاً
        بقدرته التركيبية (مُهَدِّئ قلبي، مُهَدِّئ مخّي، مُهَدِّئ عصبي...) مما يدل على اتساع مجاله المصطلحي.
      example: "تناول المريض مُهَدِّئاً للأعصاب بوصفة طبية للتخفيف من حدة القلق والتوتر النفسي."

    - lemma: مُلَطِّف
      source: step05
      decision: removed
      decision_reason: >
        فشل اختبار الإبدال في السياق العام — مُلَطِّف في المعجمية الطبية العربية خاص بتلطيف التهيج
        والالتهاب في الأنسجة (demulcent/palliative)؛ لا يُستبدل بمُسَكِّن أو مُهَدِّئ في عموم
        سياقات التسكين، مثل: «وصف الطبيب ملطِّفاً للمريض» — الجملة مقبولة في سياق الأمراض
        الجلدية والأغشية فحسب لا في عموم سياقات الإمساك بالألم أو تهدئة الأعصاب.
        فحص جودة المصطلح: الملاءمة ضعيفة — مُلَطِّف يُوحي بالتلطيف الموضعي لا التسكين العام.
      step05_citation: "«دواء يخفف أعراض المرض أو يزيله تماما» — المعجم الموحد لمصطلحات علم الصيدلة (2009) [palliative]; «صفة لما يذهب التهيج أو الالتهاب من الأنسجة المسحوجة» — معجم المصطلحات الطبية ج.2 (2003) [demulcent]"
      substitution_test:
        result: fail
      nuance_differentiation: أخصّ من مُهَدِّئ ومُسَكِّن — مقتصر على تلطيف أعراض موضعية (التهيج، الالتهاب، تصلب الأنسجة)، لا يُطلق على سائر المُسَكِّنات.

    - lemma: مُرَكِّن
      source: step05
      decision: removed
      decision_reason: >
        مصطلح دوائي تقني ضيق الانتشار: لم يرد إلا في مصدر واحد (معجم الصيدلة 2009) فيما
        تحقق اختبار التثبيت المعجمي بالفشل. الدلالة مشمولة تماماً في مُهَدِّئ ولا تُضيف فصلاً
        مميزاً يستحق إدراجاً مستقلاً. الوزن الصرفي مُفَعِّل صحيح لكن الاشتقاق من ر-ك-ن بمعنى
        التهدئة يحتاج تعليلاً (ركن: استقر وسكن) وهو مقبول نظرياً لكنه لم يُثبَّت في الاستعمال الواسع.
        فحص جودة المصطلح: الاطّراد ضعيف — لا يُستعمل فعلياً عند عموم المتخصصين بالفصحى.
      step05_citation: "«مادة دوائية ذات مفعول مهدئ ومخفف للنشاط الوظيفيّ المفرط لعضو ما» — المعجم الموحد لمصطلحات علم الصيدلة (2009) [sedative]"
      substitution_test:
        result: fail
      nuance_differentiation: دلالته متضمَّنة في مُهَدِّئ؛ أضيق تخصصاً (يُخفف النشاط الوظيفي المفرط لعضو ما فقط) وأقل شيوعاً.

    - lemma: مُسَكِّتة
      source: step05
      decision: removed
      decision_reason: >
        تُحيل على المصّاصة (baby soother/dummy) تحديداً — مفهوم hyponym لا synonym؛
        مرتبطة بالرضيع فقط ولا تُطلق على سائر المُسَكِّنات والمُهَدِّئات الطبية أو النفسية.
        فشل اختبار الإبدال: «وصف الطبيب مُسَكِّتةً للمريض» — جملة خاطئة بلا سياق رضيع.
        اختبار السكّ: مُسَكِّتة مسكوكة في الاستعمال لكن بمعنى أضيق من نطاق المجموعة الترادفية.
      step05_citation: "«المُسَكِّتة: أداة على شكل حَلْمة يُلَهَّى الطفل بمصّها أو العضّ عليها» — المورد الحديث (2008) [مادة pacifier]"
      substitution_test:
        result: fail
      nuance_differentiation: مفهوم جزئي محدد (baby pacifier/soother) ينتمي إلى مجموعة ترادفية أخرى مُخصَّصة بمصّاصة الرضيع.

