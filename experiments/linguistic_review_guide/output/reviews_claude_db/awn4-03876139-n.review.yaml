    definition_review_needed: true


step3_definition:
  definition_review_flag: true
  current_definition: "أي شيء يعمل على التهدئة أو التسكين"
  assessment:
    decision: revise
    reason: >
      التعريف الحالي ترجمة حرفية للإنجليزية: «يعمل على» calque من serves to،
      و«أي شيء» نقل مباشر من anything. الصياغة العربية الأمثل تستخدم
      «ما» أو «كل ما» مع فعل مناسب دون الحاجة لـ«يعمل على».
      علاوةً على ذلك، يُحسِّن التعريفُ الدلالةَ بتوضيح أن التسكين يشمل
      البُعدين الجسدي (الألم) والنفسي (الاضطراب).
  authored_definitions:
    - type: terminological
      text: "ما يُفيد في إحداث الهدوء أو تخفيف الألم والاضطراب، سواء أكان دواءً أم وسيلةً أم أسلوباً"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "كل ما من شأنه إيجاد الهدوء وإزالة الألم والانفعال"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
