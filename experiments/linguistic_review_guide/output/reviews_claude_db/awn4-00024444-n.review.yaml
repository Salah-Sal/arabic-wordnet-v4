step0_evidence:
  per_lemma:

    - lemma: "خَاصِّيَّة"
      confirm:
        - text: "«الخاصيّة: [Characteristic, property] بإلحاق الياء تستعمل في الموضع الذي يكون السبب فيه مخفياً كقول الأطباء هذا الدواء يعمل بالخاصية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«خاصية: صفة أو ميزة للبيانات يمكن استخدامها مُدخَلاً لعملية التنبؤ، وغالباً ما تُستخدم مُرادِفاً لكلمة (سمة)»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«خاصية أدب تُميزه عن لا أَدب؛ وهي علامة موضوع تسمح بالتعرف على شخصية أو ظاهرة أو أسلوب كتميز خاص عن باقي الأعمال»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«الخاصية: كلية مقولة على أفراد حقيقة واحدة فقط قولاً عرضياً»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«خاصية — trans: property»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) / الفيزياء العامة والنووية (1989) / الرياضيات والفلك (1990)"
      contradicts:
        - text: "«(الخاصِّيَّة) نِسْبَة إِلَى الخَاصَّة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "تُعرِّفه على أنه صيغة نسبية لا اسم معنى مستقل — يخالف المفهوم الاسمي للمجموعة ويُشير إلى أن المفردة لم تستقر بعد في المعاجم الكلاسيكية المدوَّنة"
      expands:
        - text: "«الخاصيّة الشعرية (في الفيزيقا): ظاهرة ارتفاع السوائل في بعض الأنابيب الشعرية وانخفاضها في البعض الآخر»"
          source: "المعجم الكبير (OCR)"
          addition: "تخصيص دلالي في المجال الفيزيائي — ينعكس على مصطلح خاصيّة في معناه العلمي المحدّد"
        - text: "«خاصيّة: مرفوضة لعدم ورودها في المعاجم القديمة؛ الصواب: خاصَّة [فصيحة]، خاصّيّة [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "ملاحظة معيارية: اللفظ مستحدَث مقبول في الاستعمال المعاصر، والشكل الكلاسيكي الأصيل هو «خاصَّة»"

    - lemma: "سِمَة"
      confirm:
        - text: "«سمة: صفة أو ميزة لشيء ما بمقدور البشر أو الطرق المؤتمتة التعرف عليها، وغالباً ما تستخدم كمرادف لكلمة (خاصية)»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«السِّمَة: إحدى الصفات الكثيرة التي تحدد الكائن. فالنمط الظاهري وصف لسمة أو أكثر»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«سِمَة: خاصية دنيا، غير قابلة للتحقيق بشكل مستقل — trans: Feature»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«سِمَة: خاصية تعطى لملف أو مجلد من طرف برنامج تطبيقي أو نظام تشغيل وتشير إلى كيفية التعامل معها — trans: attribute»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      contradicts:
        - text: "«السِّمَة: ما وُسِم به الحيوان من ضروب الصُّوَر؛ العلامة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المعنى الكلاسيكي مادي ملموس (علامة الكيّ على الجلد)، بخلاف التجريد الذي تصفه المجموعة"
        - text: "«السِّمَة: العلامة والأثر في الجلد نتيجة كي أو نحوه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "تعريف حسّي مادي — يؤكد أن المعنى الأصيل للجذر و-س-م هو الوسم الجسدي لا التجريد"
      expands:
        - text: "«سِمَة: cognomen — العنوان ومرتبة الشرف واللقب السامي»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "دلالة على اللقب الشرفي — بُعد اجتماعي متمايز عن تعريف المجموعة الفلسفي"

    - lemma: "صِفَة"
      confirm:
        - text: "«الصِّفَة: الحالةُ التي يكون عليها الشيءُ من حِلْيَته ونَعْتِه: كالسَّواد والبياض، والعلم والجهل»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الصفة: لغةً: النعت. شرعاً: الاسم الدال على بعض أحوال الذات نحو طويل وقصير وعاقل وأحمق. وقال بعضهم ما دل على معنى زائد على الذات محسوس كالأبيض أو معقول كالعلم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الصّفة: [Quality, attribute] ما دل على معنى زائد على الذات محسوس كالأبيض أو معقول كالعلم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الصفة: هي الاسم الدال على بعض أحوال الذات؛ وهي الأمارة اللازمة بذات الموصوف الذي يُعرف بها»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«صِفَة: خاصية ينعت بها شخص أو شيء بواسطة لفظ محدد في الجملة — trans: Attribute»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(الصّفة عند النحويين) النَّعت واسم الفاعل واسم المفعول والصفة المشبهة واسم التفضيل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          addition: "الاستعمال النحوي (الصفة = المُعدِّل الاسمي) يُوسِّع دلالة اللفظ خارج مفهوم التجريد الكامن في الكيان إلى فئة نحوية صرفة"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "خَلَّة"
      source_section: "step5_english_bridge"
      evidence_citation: "«خَلَّة — trans: trait; خَلَّةٌ سائدة = dominant trait، خَلَّةٌ مُتَنَحِّية = recessive trait» — المعجم الطبي الموحد (2009)"
      justification: "وُظِّف في المعجم الطبي مقابلاً للخاصية الوراثية؛ يرتبط بجذر خ-ل-ل وورد بمعنى «الخصلة» في المعاجم الكلاسيكية"
    - lemma: "مَيْزَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«مِيزة بارزة؛ مقوِّم — trans: feature» — Al-Mawrid Al-Hadeeth"
      justification: "مصدر مرّة من مَازَ/يَمِيز، يدل على ما يتميّز به الشيء؛ يُستخدم في المعاجم الثنائية مقابلاً لـ feature"
  knowledge_candidates:
    - lemma: "خَصِيصَة"
      justification: "اشتقاق على وزن فَعِيلَة من جذر خ-ص-ص؛ يدل على «ما اختصَّ به الشيء دون غيره» — لفظ تراثي مستعمل في كتب الفروق اللغوية والتراث الفلسفي العربي كخصائص القرآن؛ آلية التوليد: اشتقاق بوزن يدل على اللازم الثابت"
    - lemma: "خُصُوصِيَّة"
      justification: "مصدر صناعي من خصوص؛ يدل على خاصية الاختصاص والتفرد — مقابل specificity/particularity؛ آلية التوليد: المصدر الصناعي (-يَّة) لتحويل المفهوم إلى مجرَّد"
  generation_notes: "التعريف يصف مفهوماً دلالياً فلسفياً راسخاً في التراث العربي؛ الجذور الدلالية المركزية: خ-ص-ص و و-ص-ف و و-س-م"


step1_lemma_validation:
  per_lemma:

    - lemma: "خَاصِّيَّة"
      decision: confirmed
      decision_reason: "أدلة تأكيد وافرة من المعاجم التقنية والفلسفية؛ مستعملة بثبات في الفصحى العلمية المعاصرة؛ المعجم الوسيط يقبلها رغم إشارة معجم الصواب إلى حداثتها؛ الشكل الكلاسيكي «خاصَّة» متاح لكن لا يُلغي هذه اللمّة في الحقل التقني — بوابة الجودة: خفيفة النطق ✓، اطراد في الفصحى التقنية ✓، الاشتقاقية محدودة (الفعل المشتق منها غير سائد) △"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميّز «خاصِّيَّة» عن «سِمَة» بالتركيز على الخصائص الكامنة الجوهرية ذات الأسباب الفيزيائية أو الكيميائية أو المنطقية (property of a substance)؛ وعن «صِفَة» بانحسارها في الاستعمال العلمي/التقني دون الاستعمال الإنساني العام أو النحوي"
      example: "تتمتع هذه السبيكة بخاصِّيَّة المقاومة الاستثنائية للتآكل في البيئات الحامضية"

    - lemma: "سِمَة"
      decision: confirmed
      decision_reason: "مستعملة بثبات في المعاجم التقنية الحديثة (لغويات، تقنية معلومات، بيانات) مقابلاً لـ attribute/feature/trait؛ الانتقال الدلالي من «علامة الكيّ على الجلد» إلى «السمة المجرَّدة» موثَّق ومقبول معجمياً — الجذر وسم يحمل معنى العلامة الكاشفة الذي يُبرِّر التوسّع؛ بوابة الجودة: خفيفة النطق ✓، اشتقاقية جيدة (وَسَمَ، يَسِمُ، سِمَة) ✓"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميّز «سِمَة» عن «خاصِّيَّة» بالتركيز على العلامة الظاهرة المُدرَكة التي يُعرَّف بها الكيان (trait/marker) لا على الخاصية الكامنة؛ وعن «صِفَة» بأنها أدق وأكثر تحديداً — تدل على سمة مميِّزة جوهرية لا على أي وصف عام"
      example: "الوضوحُ والإيجازُ سِمَتانِ جوهريّتانِ تُميِّزانِ الكتابةَ العلمية الرصينة"

    - lemma: "صِفَة"
      decision: confirmed
      decision_reason: "أدلة تأكيد قوية ومتوفرة من المعاجم الكلاسيكية والحديثة؛ اللفظ الأصيل الأوسع استعمالاً من بين اللمّات الثلاث لمفهوم attribute/quality — اشتقاق صحيح من و-ص-ف؛ بوابة الجودة: إيثار التراثي ✓، اشتقاقية ممتازة (وَصَفَ، يَصِف، وَصْف، واصف، موصوف، وصّاف) ✓"
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميّز «صِفَة» عن «خاصِّيَّة» و«سِمَة» بالشمول الأوسع — تصحّ لأي وصف مجرَّد أو حسّي أو إنساني أو إلهي؛ واستعمالها النحوي (الصفة = النعت) دليل على عمقها في التراث اللغوي؛ هي الأقرب إلى quality/attribute بمعناه الفلسفي العام"
      example: "حدَّد الباحث الصِّفاتِ الجوهريَّة للمادة المدروسة قبل الشروع في التجربة"

    - lemma: "خَلَّة"
      source: "step05"
      decision: removed
      decision_reason: "المعنى الكلاسيكي الأصيل (الفرجة، الحاجة، الصداقة، الطريق، الخمرة) بعيد عن تجريد «الخصيصة المميِّزة للكيان»؛ الاستعمال الطبي (الخاصية الوراثية) تخصّص ضيِّق لا يُعمَّم؛ فشل اختبار السكّ في السياق العام"
      step05_citation: "«خَلَّة — trans: trait» — المعجم الطبي الموحد (2009)"

    - lemma: "مَيْزَة"
      source: "step05"
      decision: removed
      decision_reason: "تحمل معنى الأفضلية والتميُّز المقارن (advantage/privilege) لا «الصفة المجرَّدة الكامنة في الكيان»؛ فشل اختبار الإبدال: «للماء مَيْزَة التمدد» غير طبيعية مقابل «للماء خاصِّيَّة التمدد»؛ موسوعة قابوس: «الميزة: الرفعة» — يؤكد دلالة التفضيل لا التوصيف"
      step05_citation: "«مِيزة بارزة؛ مقوِّم — trans: feature» — Al-Mawrid Al-Hadeeth"

    - lemma: "خَصِيصَة"
      source: "step05"
      decision: removed
      decision_reason: "لفظ تراثي صحيح بمعنى «ما اختصّ به الشيء دون غيره»، لكنه يتداخل دلالياً مع «خاصِّيَّة» المؤكَّدة تداخلاً كاملاً؛ إضافته تُفضي إلى ترادف مطلق لا فروق توزيعية قابلة للتوثيق؛ مبدأ منع الترادف التام"
      step05_citation: "من المعرفة اللغوية — الجذر خ-ص-ص، وزن فَعِيلَة"

    - lemma: "خُصُوصِيَّة"
      source: "step05"
      decision: removed
      decision_reason: "المعنى الغالب في العربية المعاصرة هو privacy (خصوصية البيانات)؛ فشل اختبار الإبدال: «خصوصية الماء» يُفهم منها «سرية الماء» لا «صفة الماء»؛ الانزياح الدلالي نحو Privacy يجعل الإضافة مضلِّلة"
      step05_citation: "من المعرفة اللغوية — مصدر صناعي من خصوص"

  synset_flags:
    definition_review_needed: true


