step05_lemma_generation:
  evidence_candidates:
    - lemma: "رسيلة"
      source_section: "step5_english_bridge"
      evidence_citation: "«معلومات تظهر على الشاشة كرد فعل من طرف النظام على حدوث ظاهرة ما مثل إنهاء تنفيذ برنامج أو غلط أو غير ذلك» — المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      justification: "مشتق من ر-س-ل على وزن فَعِيلة، يُستعمل مقابلاً تقنياً لـ message في مصطلحات تقانة المعلومات وعلم الأرصاد الجوية والمحيطات"
    - lemma: "خطاب"
      source_section: "step5_english_bridge"
      evidence_citation: "«تقنيا، يحدد الخطاب عند منظري علم التواصل على أنه متوالية من الإشارات المطابقة لقواعد التأليف المحدد يرسلها مرسل إلى متلق بواسطة قناة معينة» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "يُقابَل بـ Message في بعض المعاجم اللسانية بوصفه وحدة تواصلية تُوجَّه من مرسِل إلى متلقٍّ عبر قناة"
  knowledge_candidates:
    - lemma: "بلاغ"
      justification: "اشتقاق (مصدر فَعَال) من الجذر ب-ل-غ (البلوغ والإيصال)، يدل على ما يُبلَّغ به في صورة موجزة، مستعمَل في الإعلام والدوائر الرسمية بمعنى التواصل القصير المكتوب أو المذاع"
  generation_notes: "الحقل الدلالي المركزي لـ«تواصل موجز مكتوب أو منطوق» مغطَّى في العربية أصلاً بكلمة رسالة؛ المرشّحات كلها إما متخصصة تقنياً (رسيلة) أو أعم بكثير وأقل إيجازاً (خطاب) أو مقيّدة بالطابع الرسمي (بلاغ)"


step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية — مؤكدة ──
    - lemma: "رسالة"
      decision: confirmed
      decision_reason: "أدلة مؤكّدة وافرة من معاجم كلاسيكية وحديثة ولسانية — اللمّة مطابقة تماماً لتعريف المجموعة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "رسالة تتميز عن «خطاب» بكونها موجزة عادةً ومتجهة إلى مرسَل إليه محدد لا إلى الجمهور العام؛ وعن «مراسلة» بكونها وحدة تواصلية منفردة لا تبادلاً مستمراً؛ وعن «بلاغ» بعدم اشتراط الطابع الرسمي؛ وعن «تبليغ» بكونها الشيءَ المُرسَل نفسه لا فعل الإرسال"
      example: "بعث الوزيرُ رسالةً موجزةً إلى نظيره عبر الدبلوماسية الهادئة يُبدي فيها استعداده للتفاوض"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "رسيلة"
      source: step05
      decision: removed
      decision_reason: "مصطلح تقني حاسوبي متخصص يقتصر على رسائل النظام على الشاشة — لا يُغطّي التواصل العام المكتوب أو المنطوق أو الإشاري؛ فشل اختبار التثبيت المعجمي في الاستعمال العام"
      step05_citation: "«معلومات تظهر على الشاشة كرد فعل من طرف النظام» — المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "رسيلة مقيّدة بالسياق الحاسوبي والتقني، ولا تصلح للتواصل الشخصي أو الإنساني العام الذي يُعرّفه AWN"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "خطاب"
      source: step05
      decision: removed
      decision_reason: "خطاب في العربية يدل على الكلام الرسمي الموجَّه إلى الجمهور أو على الخطبة — دلالته أعم بكثير وأقل إيجازاً من message، ولا يشترط الإيجاز"
      step05_citation: "«تقنيا، يحدد الخطاب... متوالية من الإشارات... يرسلها مرسل إلى متلق بواسطة قناة معينة» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "خطاب يشمل الخطبة والكتاب والمقالة والمراسلة الرسمية الطويلة، خلافاً للـ message التي تُشير إلى تواصل عادةً موجز؛ فضلاً عن أن «خطاب» في العربية يحمل معنى التلفظ الخطابي لا إرسال المحتوى"

    # ── مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "بلاغ"
      source: step05
      decision: removed
      decision_reason: "بلاغ مقيّد بالإشعارات الرسمية والإعلانات المؤسسية — لا يُغطّي التواصل الشخصي غير الرسمي الذي يشمله تعريف AWN"
      step05_citation: "«بلاغ: communique — بلاغ مذاع: broadcast announcement» — مسرد الإعلام والتواصل (ArabTerm)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "بلاغ يستلزم مرسِلاً مؤسسياً وطابعاً رسمياً، ولا يصح في سياقات التواصل الشخصي والاجتماعي اليومي"


