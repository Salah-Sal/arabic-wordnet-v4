step0_evidence:
  per_lemma:
    - lemma: "بقايا"
      confirm:
        - text: "«بقايا: remains (remnants)»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
      expands:
        - text: "«بقايا: relic»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "تعني الأثرَ التاريخي أو الديني المتبقي — مفهوم أخص من 'أي شيء يبقى دون استخدام'"
        - text: "«ما يتبقى من النفايات بعد الانتهاء من عمليات فرز ما هو قابل لإعادة الاستعمال، لإعادة التدوير، للتحويل إلى سماد أو للحرق. عادة ما يتم التخلص من البقايا في مدافن النفايات.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "تخصيص في مجال النفايات الصلبة — يُقيّد المعنى بما يُرفض بعد الفرز ويُرسَل إلى المدافن"
        - text: "«بقايا القماش الصغيرة لم تتحلل بعد وناتجة عن معالجة الصّوف، وقد تؤدي إلى ظهور عيوب.»"
          source: "مسرد صناعة النسيج، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "تخصيص في صناعة النسيج — يُقيّد بفُضالة نسيجية ذات صفة عيبية محددة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "بقيّة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(1) «أ» بقيّة. «ب» pl. عد: بقايا. وبخاصة: بقايا الطعام تُقَدَّم في وجبةٍ تالية» — المورد الحديث (2008) في مدخل 'leftover'"
      justification: "بقيّة هي المفرد الذي ينكسر منه جمع التكسير «بقايا»؛ يرد في المعجم بوصفه مرادفاً مباشراً لـ remains/leftover، وهو الأصل المفرد للمفهوم ذاته"
  knowledge_candidates:
    - lemma: "مُخَلَّفَات"
      justification: "اشتقاق (آلية التوليد: صيغة مُفَعَّلَات جمع مُفَعَّل) من الجذر خ-ل-ف، تعني ما أبقاه شخص أو حدث وراءه دون أن يُستهلَك — تُستخدم في الفصحى للدلالة على ما يتبقى بعد الفناء أو الرحيل"
  generation_notes: "التعريف يدل على المفهوم العام للبقايا بوجه مطلق؛ الجذر المركزي ب-ق-ي هو أصل المصطلح المعجمي المعتمد"

