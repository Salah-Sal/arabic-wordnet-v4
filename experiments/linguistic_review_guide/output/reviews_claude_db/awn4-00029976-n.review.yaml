        - text: "«إجمالي الأحداث المؤثرة بعضها على بعض في نظام ما، والتي تتسبب في تغيير أو نقل أو تخزين المادة أو الطاقة أو المعلومة أيضاً»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يُضيف بُعد تحوّل المادة والطاقة — بُعد فيزيائي صريح يُكمّل تعريف المجموعة"
      peripheral_observations:
