  generation_notes: "المصطلح المحوري في العربية العلمية المعاصرة هو «عملية»؛ «سيرورة» بديل مشتق يُقابل process في السياق اللساني والفلسفي؛ «مجرى» أقدم وأكثر كلاسيكية لكنه أقل دقةً في الدلالة التقنية"


