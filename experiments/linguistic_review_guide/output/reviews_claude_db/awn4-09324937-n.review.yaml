step0_evidence:
  per_lemma:
    - lemma: رأس

      contradicts:
        - text: "«مِن كُلِّ شَيْءٍ: أَعْلاهُ — مِن الإِنْسانِ: الجُزْءُ الأَعْلَى منه وهو ما فَوْق العُنُق يَنْبُت فيه الشَّعْرُ»"
          source: المعجم الكبير
          conflict: التعريف يحصر رأس في الدلالة الموقعية (الأعلى / ما فوق العنق) لا في الشكل الكروي المكتنز
        - text: "«من كل شَيْء أَعْلَاهُ وسيد الْقَوْم ورَأس الشَّهْر والسّنة أول يَوْم مِنْهُمَا»"
          source: المعجم الوسيط لمجموعة من المؤلفين
          conflict: الدلالة الجوهرية موقعية/سيادية لا شكلية، ولا أثر لمعنى «كتلة مدمجة مستديرة»
        - text: "«الرأسُ: م، وأعْلى كلِّ شيءٍ، وسَيِّدُ القومِ»"
          source: القاموس المحيط للفيروزآبادي
          conflict: يربط المعجم رأس بالعلو والسيادة، لا بالشكل الاستداري المكتنز

      expands:
        - text: "«الرأس: مجتمع الخلقة، ومجتمع كل شيء راسه — ذكره الحرالي»"
          source: التوقيف على مهمات التعاريف للمناوي
          addition: يُشير إلى دلالة الاجتماع والتكاثف — أقرب المعاني المعجمية الكلاسيكية إلى «كتلة مدمجة» — غير أنه لا يذكر الاستدارة صراحةً
        - text: "«ويطلق ويراد به القحف والجدران الأربعة والقاعدة وما في داخلها من المخّ والحجب والجرم الشّبكي والعروق والشرايين»"
          source: كشّاف اصطلاحات الفنون والعلوم للتهانوي
          addition: التهانوي يصف رأس الإنسان كمجموعة أجزاء متماسكة في كتلة واحدة متكاملة، مما يدعم دلالة الكتلة المترابطة
        - text: "«الرأس: الجزء الموشك على الانفجار من بثرة أو خرّاج»"
          source: المورد الحديث (2008)
          addition: يُثبت استعمال رأس عربياً للدلالة على كتلة مدمجة مستديرة (رأس الدمل/الخراج) مما يوافق تعريف المجموعة مباشرةً

      peripheral_observations:
        - رأس (جغرافيا) = جزء من البر ممتد في البحر / نتوء في الساحل — دلالة جيوغرافية مستقلة تماماً
        - رأس المال = أصل المال في عقد الشركة والمضاربة — دلالة مالية اقتصادية
        - رأس (فلك) = نقطة مقابلة للذنب في المدار — دلالة فلكية تقنية
        - رأس = سيد القوم / الرئيس — دلالة اجتماعية سيادية


step05_lemma_generation:
  evidence_candidates:
    - lemma: كُبَّة
      source_section: step5_english_bridge
      evidence_citation: "«كُبَّة: مجموعة من شرينات دقيقة مع الأوردة دون وجود شعيريات بينها، مع وجود تعصيب غزير» — المعجم الموحد لمصطلحات علم التشريح العياني (2015)، = glomus"
      justification: >
        كُبّة من الجذر ك-ب-ب (التجمع والتكور) تدل على بنية مدمجة مستديرة — المعجم التشريحي يستعملها للدلالة على glomus وهو كتلة وعائية مدمجة مستديرة.
        وفي الاستعمال الكلاسيكي «كبة الغزل» = ما جُمع من الغزل على استدارة، مما يُثبت دلالة التدوير والتجمع.
  knowledge_candidates:
    - lemma: حُبَّة
      justification: >
        آلية التوليد: اشتقاق — صيغة فُعْلة للدلالة على الجسم الصغير المفرد المستدير (حبة العنب، حبة القمح، حبة الدواء).
        الحُبّة = جسم صغير مكتنز مستدير، وهي الصنف الأصغر من الكتلة المدمجة المستديرة.
  generation_notes: >
    التعريف «كتلة مدمجة مستديرة» يصف شكلاً مادياً عاماً لا وظيفةً محددة، مما يجعل إيجاد مقابل عربي موحد أمراً عسيراً.
    لا يوجد في المعاجم العربية مصطلح مفرد ثابت يعادل هذا المفهوم العام.
    الجذور الدلالية المركزية: ك-ب-ب (التكور والتجمع) وح-ب-ب (الجسيم المستدير الصغير).


step1_lemma_validation:
  per_lemma:

    - lemma: رأس
      decision: confirmed
      decision_reason: >
        رأس يُستعمل فعلياً في العربية للدلالة على كتلة مدمجة مستديرة في سياقات محددة (رأس الملفوف، رأس الدمل)،
        وقد أثبت المورد الحديث هذا الاستعمال. اللفظ أصيل فصيح قابل للاشتقاق، وإن كانت الدلالة الشكلية ثانوية.
        الاقتراض المفهومي (Calque): استعارة التوسع الدلالي الإنجليزي لـ«head» بمعنى «rounded compact mass» إلى رأس مقبول
        لأن العربية تستعمل رأس فعلاً في هذه السياقات (رأس الملفوف / رأس الدمل).
        بوابة الجودة: الاطّراد ✓ (رأس الملفوف متداول) — يُسر التداول ✓ — الملاءمة △ (الدلالة الموقعية أطغى) —
        إيثار التراثي ✓ — إيثار العربي ✓ — الاشتقاقية ✓ (رأَّس، ترأَّس، رئاسة).
        الملاءمة الصرفية: فَعْل (رَأْس) وزن يصلح للأسماء العامة والمتعلقة بالرأس والأعلى — لا إشكال صرفياً.

      evidence_assessment:
        case: mixed
        notes:
          - الدلالة الأولى في المعاجم (موقعية: الأعلى) تناقض التعريف الشكلي (كتلة مدمجة مستديرة)
          - المورد الحديث يُثبت استعمال رأس للدلالة على رأس الدمل/البثرة (كتلة مدمجة مستديرة)
          - التوقيف يُشير إلى دلالة التجمع والتكاثف مما يدعم الاستعمال جزئياً

      substitution_test:
        result: pass

      nuance_differentiation: >
        رأس في هذا السياق (الكتلة المدمجة المستديرة) يختلف عن سائر معانيه:
        فهو هنا يعني الجزء المتجمع المكتنز الذي اكتسب شكلاً كرويًا أو شبه كروي كرأس الملفوف
        ورأس الخراج، بينما يعني في سائر الاستعمالات الأعلى أو السيد أو الأول.
        هذا المعنى الشكلي يتمايز عن المعنى الموقعي (أعلى كل شيء)
        ولذلك يتطلب التعريفُ تحديدًا سياقيًا.

      example: "نضج رأس الدمل واكتنز حتى بات موشكًا على الانفجار"

      actions: []

    # ── مرشح كُبّة من الخطوة ٠٫٥ — مرفوض ──
    - lemma: كُبَّة
      source: step05
      decision: removed
      decision_reason: >
        كُبّة في المعجم التشريحي = glomus (بنية وعائية خاصة) وهو معنى تخصصي ضيق لا يعادل «كتلة مدمجة مستديرة» عموماً.
        فحص السكّ المصطلحي: «كبة الملفوف» لا تُقال في العربية — الاختبار يفشل.
        كذلك فحص التثبيت المعجمي: كُبّة ثابتة في معنى «كرة الغزل» و«الglomus» لكن لا تُستعمل للملفوف أو الدمل.
        فشل اختبار الإبدال مع رأس في السياق الطبيعي.
      step05_citation: "«كُبَّة: مجموعة من شرينات دقيقة مع الأوردة» — المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      substitution_test:
        result: fail

    # ── مرشح حُبّة من الخطوة ٠٫٥ — مرفوض ──
    - lemma: حُبَّة
      source: step05
      decision: removed
      decision_reason: >
        حُبّة تدل على الجسم الصغير المفرد المستدير (حبة قمح، حبة دواء) — الحجم الصغير جداً لا يطابق
        المفهوم العام «كتلة مدمجة مستديرة» الذي يشمل رأس الملفوف ورأس الخراج.
        فشل اختبار الإبدال: «حبة الملفوف» لا تُقال.
      step05_citation: معرفة لغوية — لا دليل معجمي مباشر في قاعدة البيانات للمعنى المقصود.
      substitution_test:
        result: fail

  synset_flags:
    definition_review_needed: true


