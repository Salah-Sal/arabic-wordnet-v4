      الاستعمال العربي الفعلي لـ رأس في هذا المعنى. التعريف الأصيل يجب أن يُقيَّد بالسياق
      ويذكر الأمثلة العربية المستعملة (رأس الملفوف، رأس الدمل)، لا أن يكتفي بوصف شكلي
