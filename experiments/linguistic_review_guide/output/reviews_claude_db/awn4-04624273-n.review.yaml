step0_evidence:
  per_lemma:
    - lemma: "صفة وراثية"
      confirm:
        - text: "«أيّ صفة محكومة وراثياً لعشيرة مستخدمة في التحليل التصنيفيّ الحيويّ»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
      expands:
        - text: "«أيّ صفة محكومة وراثياً لعشيرة مستخدمة في التحليل التصنيفيّ الحيويّ»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "يقيّد المعجم المصطلح بسياق التحليل التصنيفيّ الحيوي والعشيرة المدروسة — بُعد غير وارد في تعريف المجموعة الأعمّ"
        - text: "«الصفة الظاهرة للكائن الحيّ والقابلة للتحور والتعديل بواسطة الظروف البيئية، وذلك داخل حدودها المحددة وراثياً، وتجري على أساسها ملاحظات حول أوجه الشبه أو الاختلافات الوراثية وغيرها»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "يُبيّن أن الصفة قابلة للتعديل البيئي ضمن حدودها الجينية — يكشف العلاقة بين التعبير الجيني والمحيط وهو بُعد فينوتيبي غائب عن التعريف الحالي"
      peripheral_observations:
        - "«صفة موروثة، خاصية وراثية: توريث الصفة للكائن الحيّ من سلفه بواسطة المورثات» — المعجم الموحد لمصطلحات علم الوراثة (2009) [مدخل hereditary character — يُدرج 'خاصية وراثية' بديلاً اصطلاحياً مقروناً بـ'صفة موروثة']"
        - "«صفة قابلة للتوريث: الصفة التي تنتقل من جيل إلى جيل وتحملها الجينات» — المعجم الموحد لمصطلحات علم الأحياء (1993) [مدخل heritable character — يُثبت الاستخدام الموازي لمصطلح 'صفة + وصف وراثي' في معاجم العلوم الحيوية]"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "خاصية وراثية"
      source_section: "step5_english_bridge"
      evidence_citation: "«صفة موروثة، خاصية وراثية — hereditary character — توريث الصفة للكائن الحيّ من سلفه بواسطة المورثات» — المعجم الموحد لمصطلحات علم الوراثة (2009)"
      justification: "مُدرجة في المعجم المعتمد بديلاً اصطلاحياً لـ'صفة موروثة' — آلية التوليد: تركيب وصفي من 'خاصية' (من خصّ) + 'وراثية' — تحمل الدلالة ذاتها للـgenetic character"
  knowledge_candidates:
    - lemma: "سِمَة وراثية"
      justification: "تركيب وصفي — آلية: تركيب — يستخدم 'سِمَة' (من وَسَمَ) التي وردت في تعريف المجموعة نفسها وفي لمّات المُشتمِل (خَاصِّيَّة، سِمَة، صِفَة) — البنية موازية لـ'صفة وراثية' وتشير إلى العلامة أو الطابع المميّز للكائن الحيّ من جهته الوراثية"
  generation_notes: "المصطلحية العربية في الوراثة تعتمد نمط 'اسم + نعت وراثي' أساساً للتوليد — اللفظتان المرشّحتان يسلكان هذا النمط ذاته"

