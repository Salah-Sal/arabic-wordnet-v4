    decision: retain
    reason: "التعريف دقيق — يحتوي جنساً قريباً (سمة) وفصلاً نوعياً (يحددها جين أو مجموعة من الجينات) مع تحديد طبيعتها (هيكلية أو وظيفية) — أشمل وأعمّ من تعريف المعجم المتخصص الذي يقيّده بالتحليل التصنيفي الحيوي"
  scope_note: "تعريف المعجم المتخصص أضيق — يقيّد المصطلح بسياق التحليل التصنيفي للعشائر البيولوجية، في حين تعريف المجموعة يشمل أي صفة وراثية هيكلية أو وظيفية في أي سياق"

