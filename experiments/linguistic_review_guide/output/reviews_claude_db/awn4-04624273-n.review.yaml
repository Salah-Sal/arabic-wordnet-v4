      decision_reason: "وردت في معجم الوراثة المعتمد بوصفها بديلاً اصطلاحياً مقروناً بـ'صفة موروثة' — اختبار السكّ: مركب وصفي مسكوك بشهادة المعجم — اختبار التثبيت المعجمي: موثّق في مصدر متخصص — اختبار الإبدال: قابلة للإبدال بـ'صفة وراثية' في السياق التخصصي"
      step05_citation: "«صفة موروثة، خاصية وراثية — توريث الصفة للكائن الحيّ من سلفه بواسطة المورثات» — المعجم الموحد لمصطلحات علم الوراثة (2009)"
