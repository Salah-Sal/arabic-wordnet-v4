          source: "المورد الحديث (2008)"
        - text: "«تَذْكار.» [ترجمة: souvenir]"
          source: "المورد الحديث (2008)"
        - text: "«تذكار» [ترجمة: souvenir — مجال: الفنون والتسلية والرياضة]"
          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«قَدَّمَ له هدية على سبيل التَّذْكار [فصيحة] — التعليق: الوارد في المعاجم ضبط كلمة «تذكار» بفتح التاء وليس بكسرها»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت. 2003)"
          addition: "يُقيّد الضبط الصحيح تَذْكار بفتح التاء (لا تِذْكار بكسرها)، ويُضيف استعمال التذكار هديةً مُقدَّمة"

    - lemma: "هدية تذكارية"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "المورد الحديث يستخدم «هديّة تقدَّم للذكرى» ضمن تعريف keepsake كعبارة وصفية توضيحية، لا كمصطلح مستقل مقنَّن"
        - "ArabTerm تضمّ «بائع تذكارات» [souvenir salesman] لكن لا ترد «هدية تذكارية» كمدخل منفرد"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "تذكار"
      source_section: "step5_english_bridge"
      evidence_citation: "«التَّذكار: شيء يُحتفظ به [أو هديّة تقدَّم] للذكرى.» — المورد الحديث (2008)"
      justification: "مقابل عربي مباشر لـkeepsake مصرَّح به في المعاجم الحديثة؛ اشتقاق على وزن تَفْعَال من الجذر ذ-ك-ر، يجمع على تَذَاكير"
    - lemma: "ذخيرة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) «أ», الذخيرة: «ب» أثر مقدَّس [لصلته بقدِّيس أو شهيد]. «ج» تذكار (3) بقيّة؛ شيء باقٍ [بعد الفناء أو الزوال] (4) أثرٌ من عادة قديمة أو مُعْتَقَدٍ بالٍ.» — المورد الحديث (2008)"
      justification: "يرد كمقابل عربي لـrelic؛ يحمل دلالة الشيء الباقي من شخص أو حقبة بما ينطوي على قيمة رمزية وعاطفية"
  knowledge_candidates:
    - lemma: "أثر"
      justification: "مجاز بالإزاحة الدلالية (مشابهة وظيفية): الأثر الباقي من إنسان عزيز أو حقبة مضت يصبح حاملاً للقيمة العاطفية؛ آلية التوليد: مجاز من الجذر أ-ث-ر على وزن فَعَل؛ شائع في التراث العربي (آثار الصالحين، أثر من أثار فلان)"
  generation_notes: "التعريف «شيء ذو قيمة عاطفية» يُرسي محورين دلاليين: الاحتفاظ بالذكرى (ذ-ك-ر) والبقاء من الماضي (أ-ث-ر)؛ الجذر الأوّل أوفر إنتاجية في المعاجم العربية لهذا المفهوم"


step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية: تذكار ── مؤكَّدة ──
    - lemma: "تذكار"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من معاجم حديثة متعددة؛ مفردة فصيحة راسخة من جذر ذ-ك-ر؛ الضبط الصحيح تَذْكار بفتح التاء (بحسب معجم الصواب)"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تَذْكار يغطي الطيف الدلالي الكامل للمجموعة: ما يُحتفظ به من ذكريات شخصية (keepsake) وما يُشترى أو يُهدى من مكان (souvenir)؛ يتميز عن «هدية تذكارية» بعدم اشتراط كونه هدية مقدَّمة"
      example: "احتفظت بالمفتاح القديم تذكاراً من بيت جدّها الذي هُدم."
      actions: []

    # ── لمّة أصلية: هدية تذكارية ── محذوفة ──
    - lemma: "هدية تذكارية"
      decision: removed
      decision_reason: "تركيب وصفي حر فشل اختبار التثبيت المعجمي: لا يرد كمدخل مستقل في أيٍّ من المعاجم المستعلَمة؛ يُضيّق نطاق المفهوم بحصره في الهدايا المُقدَّمة دون سائر التذكارات؛ «تذكار» يؤدي المعنى ذاته بوصفه المصطلح المسكوك"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "تمثّل فئة فرعية من التذكار (الهدية المهداة تحديداً)، لا مرادفاً له؛ اختبار السكّ: يمكن إبدال «تذكارية» بـ«للذكرى» مع بقاء المعنى، مما يكشف أنه تركيب وصفي لا مصطلح"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح الخطوة ٠٫٥: تذكار (يطابق اللمّة الأصلية) ──
    - lemma: "تذكار"
      source: step05
      decision: confirmed
      decision_reason: "مرشح يطابق اللمّة الأصلية الموجودة — يُعزّز صحتها باستقلالية الإثبات من التعريف"
      step05_citation: "«التَّذكار: شيء يُحتفظ به [أو هديّة تقدَّم] للذكرى.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يطابق اللمّة الأصلية المؤكدة — انظر التفصيل في قيدها"

    # ── مرشح الخطوة ٠٫٥: ذخيرة ── مرفوض ──
    - lemma: "ذخيرة"
      source: step05
      decision: removed
      decision_reason: "اشتراك لفظي شديد: في الاستعمال المعاصر «ذخيرة» تعني السلاح والعتاد أو الرصيد والمؤونة بدرجة أولى؛ دلالة الأثر المقدس الديني متخصصة جداً ولا تُعمَّم على مفهوم التذكار الشخصي؛ بوابة الجودة: ضعف الاطّراد في سياق القيمة العاطفية العامة"
      step05_citation: "«الذخيرة: أثر مقدَّس [لصلته بقدِّيس أو شهيد] / تذكار» — المورد الحديث (2008)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "تختص بالأثر الديني المقدّس، ولا تصلح للتذكارات العاطفية الشخصية أو السياحية العامة"

    # ── مرشح الخطوة ٠٫٥: أثر ── مرفوض ──
    - lemma: "أثر"
      source: step05
      decision: removed
      decision_reason: "اشتراك لفظي شديد في العربية المعاصرة: أثر = تأثير (علوم)، أثر = علامة جيولوجية، آثار = antiquities؛ فشل اختبار الإبدال في سياقات التذكارات السياحية والهدايا الشخصية؛ إيثار التراثي لا يُسعف هنا لأن «تذكار» أدق وأشمل"
      substitution_test:
        result: "fail"
      nuance_differentiation: "يغطي جانب «ما يبقى من الماضي» فحسب، ولا يحمل دلالة القيمة العاطفية الشخصية التي تميّز هذه المجموعة"

  synset_flags:
    definition_review_needed: true


