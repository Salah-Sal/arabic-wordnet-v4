step05_lemma_generation:
  evidence_candidates:
    - lemma: "صَعْقَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(2) يَصْعَق: يقتل أو يدمِّر أو يصدم [على نحوٍ مُباغت وقويّ]؛ (7) ضربة مفاجئة وقوية» — المورد الحديث (2008)"
      reasoning: اسم المرة من الجذر ص-ع-ق يدل على الحدث الواحد الشديد المباغت كإصابة الصاعقة؛ يترجم الاستخدامَ الاسمي لـ«zap» كحدث مباغت قوي الوقع بتأثير درامي — المعنى (7) في المورد الحديث هو الأقرب للمجموعة الترادفية
  knowledge_candidates:
    - lemma: "وَهْجَة"
      reasoning: اشتقاق على وزن فَعْلَة (اسم مرّة) من الجذر و-ه-ج (وهَجَ: أضاء وأحرق بشدة)؛ بالمجاز يصف انبثاقاً مفاجئاً من الإثارة والحيوية بتأثير درامي كوهج النار — آلية التوليد: اشتقاق + مجاز (مشابهة تأثيرية بين حرارة الوهج وطاقة الإثارة)
  generation_notes: المفهوم غير رسمي؛ الجذر ص-ع-ق هو الأقوى دليلاً إذ يُستخدم في المعاجم الحديثة مقابلاً لـ«zap» الفعلي — النمط صَعْلَة (اسم مرة) يُعطي أفضل انضباط صرفي للمفهوم الاسمي

step1_lemma_validation:
  per_lemma:
    - lemma: "دفعة طاقة"
      decision: escalated
      decision_reason: تركيب إضافي (دفعة + طاقة) شائع في الإعلام المعاصر لكنه يفشل اختبار التثبيت المعجمي — مكوّناته قابلة للاستبدال (دفعة حيوية / دفعة نشاط / دفعة كهرباء) مما يكشف أنه تركيب وصفي حر لا مصطلح مسكوك؛ يحتاج مراجعة التثبيت في الاستعمال التخصصي
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
        failure_sentences:
          - original: "أعطت الأخبارُ السارة الفريقَ دفعة طاقة"
            substituted: "أعطت الأخبارُ السارة الفريقَ صدمة مفاجئة"
            preserved_meaning: false
            why_failed: دفعة طاقة تركّز على المنحى الإيجابي الحيوي بينما صدمة مفاجئة تنحو نحو التأثير المباغت والمُرهِق — التعويض يُغيّر الحمولة الإيجابية للجملة
      nuance_differentiation: يتميّز بالتركيز على الجانب الإيجابي — منح الطاقة والنشاط — دون أثر إذهال سلبي؛ بعكس صدمة مفاجئة التي تنزع نحو الإرباك والإذهال

    - lemma: "صدمة مفاجئة"
      decision: removed
      decision_reason: إشكاليتان متلازمتان — أولاً الصفة «مفاجئة» زائدة دلالياً لأن الصدمة تنطوي على المباغتة بطبيعتها؛ ثانياً «صدمة» في العربية المعاصرة ذات حمولة سلبية غالبة (حادث، فقدان، إرباك) تتعارض مع مفهوم «منح الطاقة والإثارة الإيجابية» المنصوص عليه في التعريف
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
        failure_sentences:
          - original: "كانت نتيجة المباراة صدمة مفاجئة للجمهور"
            substituted: "كانت نتيجة المباراة دفعة طاقة للجمهور"
            preserved_meaning: false
            why_failed: "«صدمة مفاجئة» توحي بالأثر المُربك أو السلبي؛ «دفعة طاقة» تُوحي بالنشاط والإيجاب — المعنيان متباينان ولا يتبادلان الموضع"
      nuance_differentiation: تُركّز على الأثر المُذهِل المباغت دون إشارة إلى الطاقة أو الإثارة الإيجابية؛ وهذا يجعلها أبعد عن دلالة التعريف؛ كما أن «مفاجئة» تضاعف المعنى بلا جدوى
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "صَعْقَة"
      source: step05
      decision: confirmed
      decision_reason: اسم مرّة مسكوك على وزن فَعْلَة من الجذر ص-ع-ق يجمع في دلالته المفاجأةَ والشدةَ والأثرَ الدراميَّ — وهي الأبعاد الثلاثة التي ينصّ عليها تعريف المجموعة؛ الكلمة موثّقة في لسان العرب والمعجم الوسيط والمعجم الحديث بما يُثبَّت سَكّها المعجمي
      step05_citation: "«يَصْعَق: يصدم [على نحوٍ مُباغت وقويّ]؛ ضربة مفاجئة وقوية» — المورد الحديث (2008)؛ «الصَّعْقَةُ: المَرَّةُ الواحدةُ منه» — لسان العرب لابن منظور"
      substitution_test:
        result: pass
        pass_sentences:
          - original: "كانت أخبار قبوله في الجامعة صدمة مفاجئة أعادت إليه الحيوية"
            substituted: "كانت أخبار قبوله في الجامعة صَعْقَة أعادت إليه الحيوية"
            preserved_meaning: true
      nuance_differentiation: تجمع أثرَيْ المفاجأة والشدة في وحدة معجمية واحدة دون ازدواجية وصفية؛ أكثر درامية من «دفعة طاقة» وأقل سلبية من «صدمة» — تركّز على الإذهال الفوري الموجب والأثر الكهربائي للحدث دون التصريح بمنح طاقة مستدامة
      example: "جاءت أخبارُ فوز الفريق بالبطولة كصَعْقَةٍ هزّت الملعبَ وأطلقت موجةً من الحماس والحيوية في صفوف المشجّعين"
      actions:
        - command: create_entry
          params:
            lemma: "صَعْقَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07494768-n"

    - lemma: "وَهْجَة"
      source: step05
      decision: removed
      decision_reason: الاشتقاق صحيح صرفياً لكن استعمال «وهجة» لهذا المفهوم تحديداً لم يُثبَّت في أيٍّ من المعاجم المستعلَمة ولا في الاستعمال التخصصي — فشل اختبار التثبيت المعجمي؛ التركيب المجازي وصفي حر
      step05_citation: "لا شاهد مباشر في قاعدة البيانات — مرشّح معرفي بالاشتقاق والمجاز"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "صَعْقَة"
      reason: "مصدر: الخطوة ٠٫٥ — أقرب مفردة عربية مسكوكة لمفهوم «zap» الاسمي بمعنى الحدث المباغت شديد الوقع ذي الأثر الدرامي"
      via_command: create_entry + add_sense

step3_definition:
  definition_review_flag: true
  current_definition: "حدث مفاجئ يمنح طاقة أو إثارة، عادةً بتأثير درامي"
  assessment:
    decision: revise
    reason: التعريف ترجمة شبه حرفية من الإنجليزية — «تأثير درامي» كالك من «dramatic impact»؛ وتركيب «يمنح طاقة أو إثارة» يفتقر إلى دقة التعريف المعجمي العربي القائم على الجنس القريب والفصل المميّز؛ كما أن إضافة لمّة «صَعْقَة» يستلزم تعديل الصياغة لتشمل دلالة الإذهال الفوري
  authored_definitions:
    - type: terminological
      text: "حدثٌ مُباغَتٌ شديدُ الوقعِ يُذهِل النفسَ ويُولِّد فيها إثارةً انفعالية أو شعوراً بتجدُّد الطاقة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "وقوعٌ مُفاجئٌ كالصاعقة في شدّة أثره، يبعث في المتلقّي حيويةً وإثارة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-07494768-n"
        definition_index: 0
        text: "حدثٌ مُباغَتٌ شديدُ الوقعِ يُذهِل النفسَ ويُولِّد فيها إثارةً انفعالية أو شعوراً بتجدُّد الطاقة"

