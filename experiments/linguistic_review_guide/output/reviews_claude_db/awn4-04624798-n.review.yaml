step0_evidence:
  per_lemma:
    - lemma: "قاسم مشترك"
      contradicts:
        - text: "«قاسم مشترك: common divisor»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "الدلالة الرياضية المُدوَّنة هي common divisor (عدد يقسم أعداداً أخرى بلا باقٍ)، لا common denominator ولا «سمة مشتركة بين أعضاء فئة»؛ والمقابل الرياضي الدقيق لـ common denominator في العربية هو «مقام مشترك» لا «قاسم مشترك»"
      expands:
        - text: "«قاسم (ال...) المشترك الأعضم: greatest common divisor»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "يُثبت أن «القاسم المشترك» وحدة معجمية مسكوكة راسخة في التراث الرياضي العربي، وأن محور دلالة «الاشتراك» فيها مما يُفسّر انزياحها المجازي نحو معنى «السمة الجامعة بين أعضاء الفئة» في الاستعمال المعاصر"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مقام مشترك"
      source_section: step5_english_bridge
      evidence_citation: "«مقام مشترك: common denominator» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      justification: "المقابل العربي المباشر للمصطلح الإنجليزي common denominator في معاجم التوحيد العلمي — تركيب إضافي مسجَّل في معاجم متعددة"
    - lemma: "صفة مشتركة"
      source_section: step4_fts_keyword
      evidence_citation: "«(2) «أ» صفة مشترَكة» — المورد الحديث (2008) [ضمن ترجمة: denominator]"
      justification: "يُترجم المورد الحديث denominator في معناه المجازي بـ«صفة مشتركة»، مما يُثبت هذه الصياغة في المعجمية العربية المعاصرة للتعبير عن السمة المشتركة"
  knowledge_candidates:
    - lemma: "القدر المشترك"
      justification: "مصطلح فلسفي كلاسيكي مسكوك من كتب الاصطلاح الإسلامي؛ آلية التوليد: إحياء لفظ كلاسيكي (تركيب إضافي ثابت) — تعريفه في دستور العلماء للأحمدنكري: «ما به الاشتراك بين الأمرين المختلفين»، يطابق دلالة «سمة مشتركة بين جميع أعضاء فئة» بدقة"
  generation_notes: "الجذران الدلاليان الأثرى للمفهوم هما ق-س-م (القسمة والاشتراك) وق-د-ر (القدر والجوهر المشترك)؛ التعريف يحتاج مصطلحاً يجمع الجماعيةَ (مشترك) والانتماءَ التصنيفي (فئة)"

step1_lemma_validation:
  per_lemma:
    - lemma: "قاسم مشترك"
      decision: confirmed
      decision_reason: "مصطلح عربي مركب وصفي (اسم فاعل + صفة) راسخ في الاستعمال المعاصر؛ رغم أن المعاجم الرياضية تُدوّنه بمعنى common divisor إلا أنه استُعمل مجازياً في العربية المعاصرة استعمالاً واسعاً بمعنى «السمة الجامعة بين أعضاء فئة»؛ الامتداد المجازي اقتراض مفهومي (calque) موازٍ لامتداد common denominator في الإنجليزية — كلاهما انطلق من استعارة رياضية ليؤدي معنى الاشتراك المفهومي العام؛ ليس ترجمةً حرفيةً عمياء إذ لا يُشترط تطابق الأصل الرياضي (divisor/denominator)؛ بوابة الجودة: شائع في الفصحى، يسير النطق، ملائم، اشتقاقي (قَسَمَ / مَقسم / انقسام)"
      evidence_assessment:
        case: "contradicts"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يحمل إيحاء القسمة والتوزيع المتوازن (جذر ق-س-م) مما يُضفي على الاشتراك طابعَ «العامل المُنظِّم الجامع»؛ بخلاف «القدر المشترك» الذي يُركّز على الجوهر الاشتراكي الذاتي في السياق الفلسفي الكلاسيكي"
      example: "تشترك الأديان الإبراهيمية الثلاثة في قاسم مشترك هو الإيمان بالإله الواحد ونبذ الشرك"

    - lemma: "مقام مشترك"
      source: step05
      decision: removed
      decision_reason: "مصطلح رياضي بحت يدل على «مخرج الكسور»؛ لا يُستعمل في العربية في الدلالة المجازية المقصودة للمجموعة (سمة مشتركة بين أعضاء فئة)؛ الاستبدال في السياق العام يُنتج جملاً شاذة: *«المقام المشترك بين الحضارات هو احترام الكرامة» — غير مقبول في الاستعمال الفصيح المعاصر"
      step05_citation: "«مقام مشترك: common denominator» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "مقيّد بالمجال الرياضي (مخرج الكسر)، لم يُمتدَّ مجازاً في العربية كما امتدَّ «قاسم مشترك»"

    - lemma: "صفة مشتركة"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر — يجوز إبدال «صفة» بـ«سمة» أو «خاصية» مع بقاء التعبير صالحاً للمفهوم ذاته (اختبار السكّ فاشل)؛ لا توجد وحدة معجمية ثابتة بهذه الصيغة في التخصص أو في كتب المصطلح"
      step05_citation: "«(2) «أ» صفة مشترَكة» — المورد الحديث (2008) [ترجمة: denominator]"
      substitution_test:
        result: "fail"
      nuance_differentiation: "تركيب وصفي حر شائع لا يرقى إلى مستوى الوحدة المعجمية المسكوكة"

    - lemma: "القدر المشترك"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فلسفي كلاسيكي مسكوك موثّق في دستور العلماء للأحمدنكري؛ تعريفه «ما به الاشتراك بين الأمرين المختلفين» يطابق دلالة المجموعة الترادفية مطابقةً دقيقة؛ التركيب إضافي ثابت يجتاز اختبار السكّ («القدر» لا يُبدَل بـ«الحظ» أو «النصيب» دون تغيير المعنى)؛ يُحيي لفظاً كلاسيكياً أصيلاً ويُثري المجموعة بمرادف تراثي؛ بوابة الجودة: تراثي أصيل، ملائم، اشتقاقي (قَدَر / مِقدار / تقدير)"
      step05_citation: "«الْقدر الْمُشْتَرك: مَا بِهِ الِاشْتِرَاك بَين الْأَمريْنِ الْمُخْتَلِفين» — دستور العلماء للأحمدنكري"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يعكس الاصطلاح الفلسفي الكلاسيكي بتركيز على الجوهر الاشتراكي الذاتي بين الأشياء المختلفة؛ بخلاف «القاسم المشترك» ذي الإيحاء التقسيمي الحسابي الأكثر شيوعاً في الاستعمال المعاصر"
      example: "استخلص علماءُ الكلام القدرَ المشتركَ بين المدارس الفلسفية المتعددة في تعريفها للوجود المطلق"
      actions:
        - command: create_entry
          params:
            lemma: "القدر المشترك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04624798-n"

  added_lemmas:
    - lemma: "القدر المشترك"
      reason: "مصدر: الخطوة ٠٫٥ — مصطلح فلسفي كلاسيكي مطابق للدلالة، يُثري المجموعة بمرادف تراثي أصيل"
