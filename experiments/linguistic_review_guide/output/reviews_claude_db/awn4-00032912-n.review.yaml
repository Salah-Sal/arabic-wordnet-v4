step0_evidence:
  per_lemma:
    - lemma: "حِيَازَة"
      confirm:
        - text: "«حيازة الرجل: ما في حَوْزَتِه من مال أو عقار»"
          source: "المعجم الوسيط"
        - text: "«حيازةُ الشيء: ما ضمَّه الإنسانُ إلى نَفْسِه من مالٍ أو غيره»"
          source: "المعجم الكبير"
        - text: "«حيازة، تملك» — ترجمة: possession"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«حيازة» — ترجمة: possession"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«الأَرْضُ الزِّراعِيَّة تدخل في حيازة فرد أو هيئة (محدثه)»"
          source: "المعجم الكبير"
          addition: "يُضيف بُعد الحيازة المؤسسية — الشيء المملوك قد يكون في حيازة هيئة لا فرد"
        - text: "«حيازة» — ترجمة: tenancy"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "يُوسّع إلى الاستئجار حيث الحائز ليس مالكاً — بُعد خارج تعريف المجموعة"
        - text: "«حيازة» — ترجمة: holding"
          source: "مسرد الجغرافيا والتاريخ"
          addition: "يُوسّع إلى الحيازة الإقليمية/الجغرافية"
        - text: "«حقوق ملكية. الحق في استعمالات محددة للنظم الإيكولوجية والاستفادة من خدماتها.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: "يُوسّع إلى حيازة حقوقية بيئية (tenure) تشمل حق الاستخدام دون الملكية الكاملة"
      peripheral_observations:
        - "حيازة مخدرات وحيازة مسروقات: تخصيص قانوني جزائي لا صلة له بتعريف المجموعة"

    - lemma: "مِلْكِيَّة"
      confirm:
        - text: "«المِلْكُ أو التمليك. يقال: بيدى عَقْد مِلكيّة هذه الأرض»"
          source: "المعجم الوسيط"
        - text: "«الملكية الخاصة: ما يملكه الفرد»"
          source: "المعجم الوسيط"
        - text: "«الملكية العامة: ما تملكه الدولة»"
          source: "المعجم الوسيط"
        - text: "«مِلكية» — ترجمة: ownership; property"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«مِلكية» — ترجمة: property"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«مِلْكِيَة» — ترجمة: Possession"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«(الملكية) المنسوبة إِلَى الْملك والحكومة الملكية الَّتِي يرأسها ملك يتَوَلَّى الْملك بالوراثة غَالِبا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "معنى النسبة للملك/الحكومة الملكية — يخلط بين مِلْكِيَّة (ownership) ومَلَكِيَّة (royalty/monarchy)"
        - text: "«مَلَكِية» — ترجمة: monarchy"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "صيغة مَلَكِيَّة (بفتح الميم واللام) = نظام حكم ملكي — معنى مستقل لا صلة له بالمجموعة"
      expands:
        - text: "«كل إبداع يرتبط بمبدعه الأصلي ويحمل توقيعه ولا يحمل شكاً في هُويته.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُوسّع نحو الملكية الفكرية — بُعد غير صريح في تعريف المجموعة"
      peripheral_observations:
        - "تمييز صرفي جوهري: مِلْكِيَّة (بكسر الميم) = property/ownership ≠ مَلَكِيَّة (بفتح) = royalty/monarchy"
        - "معجم الصواب اللغوي لأحمد مختار عمر ينبّه على أن مَلِكِيَّة (بكسر العين) مرفوضة صرفياً والصواب مَلَكِيَّة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُمْتَلَك"
      source_section: step5_english_bridge
      evidence_citation: "«المُمْتَلَك: شيء في حَوْزة المرء فعلًا (ق).» — المورد الحديث (2008)"
      justification: "اشتقاق (اسم مفعول من امتلك) — يُحيل مباشرةً إلى الشيء المملوك بعينه؛ دلالته المعجمية «شيء في حوزة المرء» تطابق تعريف المجموعة تطابقاً حرفياً"
    - lemma: "مَتَاع"
      source_section: step4_fts_keyword
      evidence_citation: "«المَتَاع: كل ما يُنْتَفع به ويُرْغب فى اقتنائه كالطعام وأثاث البيت والسلعة والأداة والمال» — المعجم الوسيط"
      justification: "اشتقاق (الجذر م-ت-ع) — يشمل ما يُقتنى من أشياء نافعة؛ متداخل مع المفهوم المستهدف لكنه يُضيف شرطَي النفعية والرغبة في الاقتناء"
  knowledge_candidates:
    - lemma: "مِلْك"
      justification: "اشتقاق — الاسم الجذري من م-ل-ك بمعنى ما يختصّ به الشخص: «هذا مِلكي» = هذا الشيء الذي أملكه؛ أصرح من مِلْكِيَّة في الإحالة إلى الشيء لا إلى الحق المجرد"
    - lemma: "مَقْتَنًى"
      justification: "اشتقاق (اسم مفعول من اقتنى، الجذر ق-ت-ن) — يدل على الشيء المقتنى المحتفظ به عمداً؛ يُعبّر عن بُعد الحيازة الطوعية المتعمَّدة"
  generation_notes: "التعريف «أيّ شيء مملوك أو في حوزة شخص» يستدعي اسماً يُحيل إلى الشيء المملوك ذاته لا إلى الحق المجرد؛ الجذران م-ل-ك وح-و-ز الأكثر إنتاجيةً لهذه الدلالة"

step1_lemma_validation:
  per_lemma:
    - lemma: "حِيَازَة"
      decision: confirmed
      decision_reason: "أدلة تأكيد وافية من المعجم الوسيط والكبير تُثبت دلالتها على ما يحوزه المرء فعلاً من مال أو غيره — بلا تناقض داخلي"
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: "تُبرز الوقوعَ الفعلي للشيء في يد الشخص وسيطرته المادية عليه دون اشتراط سند ملكية رسمي — تقابل الإنجليزية possession بمعنى السيطرة الفعلية؛ تتميز عن مِلْكِيَّة بأنها لا تستلزم تسجيلاً قانونياً"
      example: "أودعت المحكمةُ جميعَ ما في حيازة المتهم من وثائق في خزينة الضبط المختومة."

    - lemma: "مِلْكِيَّة"
      decision: confirmed
      decision_reason: "الشواهد المؤكِّدة للمعنى الملائم (المِلك والتمليك وما يملكه الفرد) أوفر وأصرح — التناقض يخص صيغة مَلَكِيَّة المفتوحة لا مِلْكِيَّة المكسورة المقصودة"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "تُبرز الجانبَ القانوني والرسمي للتملك — تُستخدم في سياقات الأصول المُوثَّقة والعقارات المسجَّلة؛ تقابل الإنجليزية property بالمعنى القانوني الاقتصادي؛ تتميز عن حِيَازَة باشتراط الإثبات القانوني"
      example: "نقلت المؤسسةُ ملكيةَ مبانيها إلى الشركة الشريكة بعقود موثَّقة رسمياً."

    - lemma: "مُمْتَلَك"
      source: step05
