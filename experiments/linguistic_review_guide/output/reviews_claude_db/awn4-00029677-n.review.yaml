step0_evidence:
  per_lemma:
    - lemma: "حَدَث"
      confirm:
        - text: "«الجديد من الأشياء شبه النازلة من أحداث الدهر»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«الحَدَث من أحداث الدهر شِبْه النازلة»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي (رواية هَوْرَماني)"
        - text: "«الحَدَثُ والحَدَثانُ من أحْدَاثِ الدَّهْرِ شِبْهُ النّازِلَةِ»"
          source: "المحيط في اللغة للصاحب بن عباد"
        - text: "«الأمر حدوثًا: وقع»"
          source: "المعجم الوسيط"
        - text: "«الأمرُ: نَزَلَ ووَقَعَ»"
          source: "المعجم الكبير"
        - text: "«حدَث الأمرُ: وقع وحصَل»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«الحَدَثُ: الأمر الحادث المنكر النازلة من نوازل الدهر»"
          source: "المعجم الكبير"
        - text: "«حدَثَ حُدُوثًا: تَجَدَّدَ وُجُودُهُ فَهُوَ حَادِثٌ وَحَدِيثٌ»"
          source: "المصباح المنير للفيّومي"
        - text: "«حدث، واقعة» ترجمةً لـ event"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«حَدَثٌ، واقعة» ترجمةً لـ event"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«حَدَثٌ؛ حادثة هامة» ترجمةً لـ event"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الحَدَثُ: الصغير السن»"
          source: "المعجم الوسيط"
          conflict: "دلالة العمر (الفتيّ من الناس) مستقلة عن معنى «شيء يقع في زمان ومكان»"
        - text: "«الحَدَث: النجاسة الحكمية التي ترتفع بالوضوء أو الغُسل أو التيمم»"
          source: "المعجم الوسيط"
          conflict: "مصطلح فقهي في باب الطهارة — لا صلة له بالوقوع في زمان ومكان"
        - text: "«فعلٌ يولِّده المستخدِمُ غالباً ويمكِن أن يستجيبَ له البرنامج، كضغط المفاتيح أو نقر الأزرار أو حركات الفأرة»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "تقييد بالحدث الحاسوبي التفاعلي — أخصّ وأضيق من تعريف المجموعة المحايد"
      expands:
        - text: "«الحدوث: كون الشيء بعد أن لم يكن، عرضًا كان ذلك أو جوهرًا»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "بُعد أنطولوجي — الحدث كظهور الشيء للوجود ابتداءً؛ أوسع من الوقوع في زمان ومكان محدَّدَيْن"
        - text: "«الحدث: ما يكون مسبوقاً بمادة ومدة، وقيل ما كان لوجوده ابتداء»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "التعريف الفلسفي الكلامي — يُضيف شرطَي المادة والمدة إلى مفهوم الحدوث"
        - text: "«الحدث: معنى قائم بغيره بشرط الحدوث والتجدد، سواء صدر عن ذلك الغير كالضرب والمشي أو لا كالطول والقِصَر»"
          source: "دستور العلماء للأحمدنكري"
          addition: "المعنى النحوي الفلسفي — الحدث كمعنى قائم بالفاعل؛ يشمل أحداثَ النحو (الفعل والمصدر) وهو أعمّ من مفهوم المجموعة"
      peripheral_observations:
        - "«الحَدَث: الإبداء» (إخراج البول أو الغائط) — كتاب العين — معنى فقهي آخر مستقل تماماً"
        - "«الرجل الحَدَث: الطريُّ السنّ» — مقاييس اللغة لابن فارس — دلالة وصفية مستقلة"
        - "«الحَدَث: قلعة حصينة بين ملطية وسميساط» — معجم البلدان لياقوت — اسم عَلَم جغرافي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "واقعة"
      source_section: "step5_english_bridge"
      evidence_citation: "«الواقعة (في الفلسفة): ما حدث ووُجد» — المعجم الوسيط"
      justification: "اشتقاق — اسم فاعل مؤنث من الجذر و-ق-ع (وقع الأمرُ: حدث ونزل)؛ يطابق التعريفَ «شيء يقع» بصورة مباشرة؛ المعجم الوسيط يُقرّها بالاستعمال الفلسفي بمعنى fact/event؛ جمعها وقائع مستقر في الكتابة القانونية والتاريخية"
    - lemma: "حادثة"
      source_section: "step5_english_bridge"
      evidence_citation: "«حادثة» = event — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      justification: "اشتقاق — اسم فاعل مؤنث من ح-د-ث على وزن فاعلة؛ مستعمل في الرياضيات وحساب الاحتمالات بمعنى event المحايد (حادثة مستحيلة، حادثة استثنائية، حادثة مؤكَّدة)"
  knowledge_candidates:
    - lemma: "كائنة"
      justification: "اشتقاق — اسم فاعل مؤنث من الجذر ك-و-ن على وزن فاعلة؛ معناها الحرفي «التي كانت» أي ما تحقَّق وجوده؛ وردت في المعجم الوسيط بمعنى «الحادثة» مع جمع كوائن؛ تستحضر دلالة الكون والوجود المرتبطة بالحدوث"
    - lemma: "مُستجَدّ"
      justification: "اشتقاق — اسم مفعول من استجدَّ على وزن مستفعَل؛ يدل على شيء جديد الحدوث؛ يُستعمل في الصحافة العربية المعاصرة بمعنى التطوّر والحدث الجديد؛ يتمتع بإنتاجية صرفية (مستجدات، مستجدٌّ)"
  generation_notes: "يتقاطع التعريف «شيء يقع في مكان وزمان محدّدَيْن» مع جذرين دلاليين رئيسيَّيْن: ح-د-ث (الحدوث والجِدَّة) و و-ق-ع (الوقوع والنزول)؛ كلاهما يُنتج وحدات معجمية تمثّل المفهوم من زاويتَيْن مختلفتَيْن"

step1_lemma_validation:
  per_lemma:
    - lemma: "حَدَث"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة وافرة من طبقات معجمية متعددة (كلاسيكية ومعاصرة وتخصصية) على معنى الوقوع والأمر الحادث"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "حَدَث الأعمُّ والأكثر حياداً لمفهوم event — لا يستلزم دلالة سلبية ولا إيحاءً بالخطورة؛ يتميز عن «واقعة» بخفّته الأسلوبية وشيوعه في الخطاب الإعلامي والعامّي المعاصر؛ ويتميز عن «حادثة» بغياب الإيحاء بالطارئ المؤلم؛ جمعه أحداث وحوادث كلاهما شائع"
      example: "أفرز الحَدَثُ السياسيُّ الكبيرُ موجةً من التحليلات في وسائل الإعلام، إذ تداعى المحللون إلى تفسير ملابساته ووقته ومكانه."
      actions: []

    - lemma: "واقعة"
      source: step05
      decision: confirmed
      decision_reason: "المعجم الوسيط يُثبتها فلسفياً بمعنى «ما حدث ووُجد»؛ اجتازت اختبار السكّ (وحدة معجمية ذات جمع تكسيري ثابت: وقائع) واختبار الإبدال في السياقات التوثيقية"
      step05_citation: "«الواقعة (في الفلسفة): ما حدث ووُجد» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "واقعة تُفيد رسوخَ الحدث وقابليتَه للتوثيق والإثبات — أقرب إلى fact/event بمعنى ما يُسجَّل ويُشهَد عليه؛ تستعمل في السياقات القانونية والتاريخية والفلسفية؛ وقائع أثقل وأرسخ أسلوبياً من أحداث؛ التوقيف ينبّه إلى أن «الواقعة» تميل كلاسيكياً للشدة، غير أن المعجم الوسيط يُقرّ استعمالها الفلسفي المحايد"
      example: "دوَّن المؤرخُ الوقائعَ التاريخيةَ بدقة متناهية، مُحدِّداً مكانَ كلِّ واقعةٍ وزمانَها ودلالتَها."
      actions:
        - command: create_entry
          params:
            lemma: "واقعة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00029677-n"

    - lemma: "حادثة"
      source: step05
      decision: removed
      decision_reason: "تحمل في الاستعمال العامّ دلالةَ الطارئ السلبي أو الحادث المؤلم (accident/incident)؛ يُناقض ذلك التعريفَ المحايد «شيء يقع في مكان وزمان»؛ استعمالها الرياضي المحايد (حادثة احتمالية) مجالٌ تخصصي ضيّق لا يُعمَّم على المجموعة العامّة"
      step05_citation: "«حادثة» = event — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"

    - lemma: "كائنة"
      source: step05
      decision: removed
      decision_reason: "لفظ تراثي خارج الاستعمال المعاصر الفعلي؛ فشل اختبار التثبيت المعجمي — لا يَرِد في المصادر التخصصية الحديثة كمصطلح مسكوك لـ event؛ لا يُكسب المجموعة قيمة دلالية مضافة غير موجودة في حَدَث وواقعة"
      step05_citation: "«الكائنة: الحادثة» — المعجم الوسيط"

    - lemma: "مُستجَدّ"
      source: step05
      decision: removed
      decision_reason: "يُؤكِّد جانبَ الجِدَّة والحداثة أكثر من دلالة الوقوع في زمان ومكان؛ فشل اختبار الإبدال — لا يمكن إحلاله محلّ حَدَث في سياقات الحدث العامّ دون تغيير المعنى نحو التركيز على الطابع الجديد"
      step05_citation: "مستخرج من المعرفة اللغوية — لا دليل معجمي مباشر"

  added_lemmas:
    - lemma: "واقعة"
      reason: "مصدر الخطوة ٠٫٥ — مؤكَّدة بالمعجم الوسيط (فلسفة: ما حدث ووُجد) واجتازت اختبار السكّ والإبدال"
      via_command: create_entry + add_sense

