step0_evidence:
  per_lemma:

    - lemma: "شبكة"
      confirm:
        - text: "«كلُّ مُتَداخِل مُتَشَابِك»"
          source: "المعجم الكبير"
        - text: "«(الشبكة) شركَة الصياد في البر والبحر وأكثر ما تتَّخذ من الخيط المشبك وكل متداخل متشابك يُقَال شبكة المواصلات وشبكة الكهرباء ونحو ذلك»"
          source: "المعجم الوسيط"
        - text: "«شبكة الصياد في البر والبحر وهي كل متداخل متشابك»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«بنية تشريحيّة تُشبه الشّبكة»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«بنية من العلاقات بين عناصر متعددة»"
          source: "مسرد الإعلام والتواصل — ArabTerm"
      expands:
        - text: "«شبكة إذاعيّة Radio network: مجموعةٌ من محطَّاتٍ تتَّبعُ جهةً واحدةً ويرتبطُ بعضُها ببعض»"
          source: "المعجم الكبير"
          addition: "امتداد نحو المنظومات الإذاعية المنظَّمة — بُعد مؤسسي غير موجود في التعريف"
        - text: "«الشبكةُ العنكبوتيةُ العالميةُ World Wide Web: مجموعةٌ من الحواسيب الخادمة تضمُّ الصفحات وتوزِّعها»"
          source: "المعجم الكبير"
          addition: "امتداد إلى الشبكة الرقمية الإلكترونية — معنى مستحدث"
        - text: "«ربط يسمح بنقل إشارة من نقطة إلى نقط عديدة أخرى»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "تعريف تقني للشبكة من منظور الاتصالات — يوسّع الدلالة نحو البنية الاتصالية"
      peripheral_observations:
        - "«هَدِيَّةٌ يُقَدِّمُها الخطيبُ إلى خطيبته إعلانًا للخِطبَةِ (محدثة)» — المعجم الكبير/المعجم الوسيط: الشَّبْكَة بتسكين الباء — معنى مستقل تماماً لا صلة له بالمجموعة"
        - "«الشبكة: ماء بأجإ ويعرف بشبكة ياطب...» — معجم البلدان لياقوت الحموي: أسماء مياه وأماكن جغرافية — أعلام خاصة لا صلة لها بالمجموعة"
        - "«القَرَابَةُ والرَّحِمُ» — المعجم الكبير: الشُّبكة بضم الشين — وزن صرفي مختلف ومعنى مستقل"
        - "«الآبارُ المتقاربةُ القريبةُ الماء يُفضِي بعضُها إلى بعض» — المعجم الكبير: معنى جغرافي تراثي مستقل لا يلتقي بدلالة المجموعة"

    - lemma: "نسيج"
      confirm:
        - text: "«(النسيج) المنسوج»"
          source: "المعجم الوسيط"
        - text: "«نَسِيْج: الثوب المنسوج»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«مجموعة خلايا متشابهة التركيب والوظيفة عادة»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "التخصص البيولوجي للنسيج (tissue) — مجال علمي مستقل بعيد عن دلالة البنية الحياكية المقصودة"
        - text: "«مظهر مكونات الصخر من حيث الحجم والشكل والترتيب»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "التخصص الجيولوجي للملمس (texture) — بُعد مختلف كلياً"
        - text: "«مجموعة من خلايا متماثلة منتظمة في وحدة هيكلية ووظيفية»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ArabTerm"
          addition: "توسّع إلى البنية الخلوية — يتجاوز المعنى المقصود في المجموعة بعيداً"
      peripheral_observations:
        - "«هُوَ نَسِيج وَحده لَا نَظِير لَهُ في علم وغيره» — المعجم الوسيط: تعبير اصطلاحي ثابت بمعنى «فريد لا مثيل له» — معنى مجازي مستقل تماماً لا صلة له بالمجموعة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "ضفيرة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«مجموعة عصبات عضلية متشابكة» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
      justification: "ضفيرة على وزن فَعِيلة من جذر ض-ف-ر (الضفر = الجدل والتشابك) تدل في الاصطلاح التشريحي على شبكة أعصاب أو أوعية متشابكة (plexus) — وهو ما يوافق دلالة «بنية متشابكة الأجزاء» في التعريف؛ آلية التوليد: اشتقاق على وزن يوحي بمنتَج فعل التشابك"
  knowledge_candidates:
    - lemma: "حُبُك"
      justification: "اشتقاق — جمع حِبَاك/حَبِيكَة من جذر ح-ب-ك (الإحكام في النسج والحياكة). ورد في قوله تعالى «وَالسَّمَاءِ ذَاتِ الْحُبُكِ» (الذاريات/٧) في إشارة إلى ما حُبك وأُحكم نسجه، وهو يعبّر عن دلالة البنية المتقنة الحياكة التي يُومئ إليها التعريف — آلية التوليد: إحياء لفظ تراثي قرآني على مرتبة الاشتقاق"
  generation_notes: "التعريف يستخدم كلمة «شبكة» صراحةً؛ لذا أُحجم عن توليدها كمرشّح (دوران حتمي). ركّزت المرشحات على ما يتصل بالنسج والتشابك الحياكي. الجسر الإنجليزي أعاد «شبكة» نفسها مقابل «web» فلم يُضِف جديداً. البحث الكلمي أسفر عن «ضفيرة» كأقوى مرشح دلالي من قاعدة البيانات"

step1_lemma_validation:
  per_lemma:

    - lemma: "شبكة"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة وافرة من كبريات المعاجم؛ المعنى الجوهري «كل متداخل متشابك» يطابق تعريف المجموعة مطابقةً تامة؛ مستوفية معايير الجودة الستة: فصيحة متداولة، يسيرة النطق، ملائمة للمفهوم، تراثية، عربية خالصة، اشتقاقية (شَبَّك، تشابُك، شُبّاك، شابَك)"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميّز «شبكة» بإبراز البُعد البنيوي التشبيكي — التشابك والتداخل في هيكل ذي فتحات وفراغات منتظمة كشبكة الصائد؛ أعمّ من «نسيج» وأصلح للتعبير عن البنى المعقدة ذات الوصلات المتعددة (شبكة الكهرباء، شبكة المواصلات) وعن الشبكة المجازية بوجه عام"
      example: "نسجت العنكبوتُ شبكتَها المتداخلةَ بدقةٍ هندسية مذهلة بين أغصان الشجرة، فبدت كقطعة دانتيل نسجتها أنامل صانع ماهر."

    - lemma: "نسيج"
      decision: confirmed
      decision_reason: "المعنى الكلاسيكي «المنسوج» يوافق دلالة «شيء تشكّل عن طريق النسج»؛ ويُستعمل في العربية استعمالاً موثَّقاً في «نسيج العنكبوت» (cobweb) و«نسيجٌ معقَّد من الأحداث»؛ اختبار الإبدال نجح في النطاق الدلالي المقصود للمجموعة؛ فصيح تراثي مشتقاقي (نسَج، ناسج، نسّاج، نسائج). تُلاحَظ: دلالة «النسيج» البيولوجية (tissue) تُشكّل تعدداً دلالياً تقنياً بعيداً عن المجموعة، لكنها تُعالَج بمجموعات ترادفية أخرى"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميّز «نسيج» بإبراز البُعد الحياكي الداخلي — الشيء المُحبَك أو المُضفَّر كما ينسجه النسّاج أو العنكبوت؛ يُبرز ملمس التركيب وتداخل الخيوط أكثر من إبراز الشكل الشبكي الخارجي؛ يُفضَّل في السياقات الاستعارية (نسيج الحياة، نسيج الأحداث، نسيج العنكبوت) أكثر من سياقات البنية التقنية (شبكة الكهرباء)"
      example: "غَدا نسيجُ العنكبوت المتشابكُ، المرئيُّ بضوء الصباح مُعلَّقاً بين شعب الصخر، مثالاً بديعاً للبنى الحياكية الدقيقة في عالم الطبيعة."

    - lemma: "ضفيرة"
      source: step05
      decision: removed
      decision_reason: "الدلالة الأولية «خصلة الشعر المجدولة» بعيدة تماماً عن المجموعة؛ الدلالة التشريحية (plexus) تخصصية جداً ومحصورة في حقل طبي؛ فشل اختبار الإبدال — «ضفيرة العنكبوت» غير متداولة في مقابل «شبكة العنكبوت»؛ فشل اختبار التثبيت المعجمي — «ضفيرة» في المعاجم العامة تعني الجديلة لا البنية التشبيكية المجردة؛ فشل اختبار السكّ المصطلحي"
      step05_citation: "«مجموعة عصبات عضلية متشابكة» — المعجم الموحد لمصطلحات الطب البيطري (2010)"

    - lemma: "حُبُك"
      source: step05
      decision: removed
      decision_reason: "لفظ قرآني مُمات خارج السياق التفسيري؛ فشل اختبار الإبدال — «حُبُك العنكبوت» غير مستعملة ولا مأنوسة؛ فشل اختبار التثبيت المعجمي — لا وجود له في المعاجم العامة الحديثة كمصطلح قائم للمفهوم المقصود؛ لا اشتقاقية فعّالة في الاستعمال المعاصر"
      step05_citation: "سورة الذاريات/ 7: «وَالسَّمَاءِ ذَاتِ الْحُبُكِ»"

  synset_flags:
    definition_review_needed: true

