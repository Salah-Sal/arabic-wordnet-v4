step0_evidence:
  per_lemma:

    - lemma: "احتمال لم يتحقق"
      contradicts:
        - text: "«الاحتمال: ما لا يكون تصور طرفيه كافيًا، بل يتردد الذهن في النسبة بينهما، ويراد به الإمكان الذهني» — كتاب التعريفات للشريف الجرجاني"
          conflict: "«احتمال» في الاصطلاح الفلسفي = إمكان ذهني (توردد العقل بين طرفين) لا «حدث عيني يمكن وقوعه»؛ تعريف المجموعة يصف حَدَثاً (event) بينما «احتمال» مصطلح يدل على الاحتمالية أو الجواز لا على الواقعة"
        - text: "«الاحتمال: لغة العفو والإغضاء وإتعاب النفس في الحسيات؛ وفي اصطلاح الفقهاء يستعمل بمعنى الوهم والجواز فيكون لازماً، يُقال: يحتمل أن يكون كذا» — التوقيف على مهمات التعاريف للمناوي"
          conflict: "الأصل اللغوي لـ«احتمال» (ح-م-ل) يدور على التحمّل والصبر، والاصطلاح الفقهي يجعله مرادفاً للجواز؛ لا صلة لذلك بمفهوم الحدث الماضي الذي لم يقع"
        - text: "«الاحتمال: في الفلسفة: ما يمكن توقع حدوثه» — المعجم الكبير"
          conflict: "«ما يمكن توقع حدوثه» يشمل الأحداث المستقبلية الممكنة، لا الأحداث الماضية المنتفية التي هي موضوع المجموعة"
      peripheral_observations:
        - "لم ترد العبارة «احتمال لم يتحقق» كاملةً في أي مدخل معجمي — المكوّن «احتمال» في المعاجم الكلاسيكية مصطلح منطقي-فلسفي (probability / possibility) مختلف دلالياً عن «حدث» (event)"

    - lemma: "فرصة ضائعة"
      confirm:
        - text: "«انتهز فلان الفرصة: اغتنمها وفاز بها» — المعجم الوسيط"
      contradicts:
        - text: "«الفُرْصَة: النوبة تكون بين القوم يتناوبونها على الماء... الوقت المناسب للقيام بعمل ما» — المعجم الوسيط"
          conflict: "«فرصة» = وقت/نوبة مناسبة لعمل بعينه، وهي أخصّ من «حدث كان ممكناً»: كل فرصة ضائعة هي حدث لم يتحقق، لكن ليس كل حدث لم يتحقق فرصةً — يُضيَّق نطاق المجموعة إلى الإمكانيات القابلة للاغتنام لا الأحداث الانتفائية عموماً"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "حدث افتراضي"
      source_section: step4_fts_keyword
      evidence_citation: "«سؤال افتراضيّ» — المورد الحديث (2008) — يُستعمل «افتراضي» بمعنى what-if للدلالة على ما يُفترض دون أن يقع"
      justification: "بالتركيب الوصفي: «افتراضي» مستعمل في معاجم حديثة للمفاهيم الفرضية؛ «حدث افتراضي» = حدث لم يقع وبقي في حيّز الفرض — آلية التوليد: تركيب وصفي (اسم + صفة)"
  knowledge_candidates:
    - lemma: "اللَّو"
      justification: "مجاز بالإزاحة الدلالية: حرف «لو» في العربية أداة الشرط الخلافي المضاد للواقع («لو فعلت لكان...»)؛ يُستخدم مجازاً اسماً في الأساليب الأدبية الرفيعة («عالم اللو»، «لو المندوبة عند النحاة»)؛ يرادف might-have-been بوصفه رمزاً للأمنيات والأحداث الانتفائية — آلية التوليد: مجاز (إحياء أسلوبي + إزاحة دلالية من الأداة إلى الاسم)"
    - lemma: "الفائت"
      justification: "اشتقاق من الجذر ف-و-ت (فاتَ يَفوتُ فَوْتاً وفَواتاً)؛ «الفائت» على وزن فاعل اسماً للحدث الذي فات وقوعه وانقضى دون أن يُدرَك — آلية التوليد: اشتقاق (وزن فاعل للدلالة على المنسوب إليه الفوات)"
  generation_notes: "المفهوم «might-have-been» كاسم للحدث الانتفائي المضاد للواقع يمثّل فراغاً معجمياً حقيقياً في العربية؛ لا توجد لمّة مفردة مسكوكة تعادله بدقة في التراث أو الاستعمال المعاصر"


step1_lemma_validation:
  per_lemma:

    - lemma: "احتمال لم يتحقق"
      decision: removed
      decision_reason: "مركب إسنادي (اسم + جملة فعلية سلبية) — المركبات الإسنادية مرفوضة صنفياً؛ «احتمال» في الاصطلاح الفلسفي ≠ «حدث» بالمعنى الدلالي الدقيق؛ العبارة شرح وصفي للمفهوم لا تسمية له، وتفشل اختبار السكّ (يمكن إبدال «احتمال» بـ«توقع» أو «لم يتحقق» بـ«لم يقع» والعبارة لا تزال صالحة كوصف → تركيب حر)"
      evidence_assessment:
        case: contradicts
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
      nuance_differentiation: "لا قيمة فارقة مقنعة — «احتمال» يعني الإمكانية الفلسفية أو الجواز المنطقي لا «حدثاً» عينياً؛ المكوّن الصنفي الخاطئ (احتمال ≠ حدث) يجعل التمييز بين هذه اللمّة و«فرصة ضائعة» قائماً على سوء التصنيف لا على الفروق الدلالية"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فرصة ضائعة"
      decision: confirmed
      decision_reason: "تعبير وصفي ثابت في العربية يدل على الإمكانية التي فاتت دون اغتنام؛ هو أيضاً الوحيد من لمّات المجموعة الذي يخضع لاختبار الإبدال في سياق حقيقي؛ التضييق الدلالي مقبول ريثما يُحال للمراجع البشري"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "تختص بالفرص والنوب القابلة للاغتنام (صداقة، علاقة، مسار مهني، لحظة حاسمة) دون سائر أنواع الأحداث الانتفائية — might-have-been في الإنجليزية أشمل: يتسع لأحداث تاريخية كبرى وتحولات وجودية لا تنطبق عليها «فرصة» في العربية"
      example: "حين عاد إلى مسقط رأسه بعد غياب طويل، استحضر ذكرى تلك الصداقة القديمة باعتبارها فرصةً ضائعةً لن تُسنَح مرةً ثانية"
      actions:
        - command: set_confidence
          params:
            entity_type: sense
            entity_id: "{auto}"
            score: 0.65

    - lemma: "حدث افتراضي"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبار التثبيت — «حدث ممكن» و«أمر افتراضي» و«واقعة فرضية» تصف المفهوم ذاته بالقدر نفسه → غير مسكوك؛ علاوةً على أن «افتراضي» في المعاجم لا يفيد الانتفاء الماضي تحديداً بل يشمل الفرضي المستقبلي أيضاً، فيفقد الدلالة الجوهرية للمجموعة"
      step05_citation: "«سؤال افتراضيّ» — المورد الحديث (2008)"
      substitution_test:
        result: fail
      nuance_differentiation: "أعمّ من المطلوب — يشمل الفرضيات المستقبلية والماضوية على حدٍّ سواء دون تخصيص الانتفاء"

    - lemma: "اللَّو"
      source: step05
      decision: removed
      decision_reason: "حرف في أصله لا اسم معجمي راسخ؛ استعماله اسماً أدبي نادر لا مصطلح موحّد؛ يفشل اختبار التثبيت المعجمي وشروط قبول الاسمية (التنكير والتعريف والجمع السالم)"
      step05_citation: "معرفة لغوية داخلية — لم يرد «اللو» مدخلاً في المعاجم المستعلَمة"
      substitution_test:
        result: fail
      nuance_differentiation: "يفيد الشرطية الخلافية كأداة بلاغية لكنه لا يُسكّ اسماً معجمياً في المصادر الموثوقة"

    - lemma: "الفائت"
      source: step05
      decision: removed
      decision_reason: "دلالة عامة جداً وغير مخصوصة بالحدث الانتفائي المضاد للواقع — «الفائت» يصدق على الوقت الضائع والمال المفقود وكل ما انقضى؛ يفشل اختبار الإبدال في سياق الحدث الانتفائي"
      step05_citation: "اشتقاق لغوي من جذر ف-و-ت — لا شاهد مباشر في المعاجم المستعلَمة"
      substitution_test:
        result: fail
      nuance_differentiation: "أعمّ من المقصود — لا يختص بالحدث المضاد للواقع بل يشمل كل أنواع الفوات"

  synset_flags:
    definition_review_needed: true


