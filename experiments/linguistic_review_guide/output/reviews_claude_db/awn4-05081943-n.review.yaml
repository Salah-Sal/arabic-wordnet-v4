step0_evidence:
  per_lemma:

    - lemma: "عَلاقَة مَكَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مَوْضِع"
      confirm:
        - text: "«(المَوْضِعُ) اسم المكان»"
          source: "المعجم الوسيط"
        - text: "«(الموضع) اسم المكان ويُقال في قلبي موضع فلان محبته (ج) مواضع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الموضع عند الحكماء مرادف للمكان كما في شرح الإشارات. وعند الصرفيين وهو اسم الظرف مكاناً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«موضع: locality / location / locum / situs»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«في قلبي موضعُ فلان: محبته»"
          source: "المعجم الوسيط"
          addition: "الدلالة تتسع لتشمل المكانة المجازية (محل الشيء في النفس)، لا الموضع المادي وحده"
        - text: "«موضع الشيء: مركزه، عيَّن موضعه، دلَّ عليه — تموضَع الداء في الجهة اليسرى: احتلَّ موضعاً محدَّداً»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "الدلالة تتسع لتشمل فعل التموضع الديناميكي (احتلال موضع) لا الموضع الساكن فقط"

    - lemma: "مَوْقِع"
      confirm:
        - text: "«مكانُ الوقوع — مواقِعُ القتال: مواضِعُه — مواقِعُ القَطْر: مَسَاقِطه»"
          source: "المعجم الوسيط"
        - text: "«(الموقع) مكان الوقوع يُقال وقع الشيء موقعه (ج) مواقع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«مَوْقِع: بمعنى موضع أو المكان الذي توجد فيه بعض الأشياء — موقع: محل / situation»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«مَوْقَعٌ: كأنه من الوقوع: موضع»"
          source: "معجم البلدان لياقوت الحموي"
      expands:
        - text: "«له موقع حسن عند فلان: وتُقال للتعبير عن شيء نال رضا الطرف الأول — عظم موقعه عند فلان»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "الدلالة تتسع إلى الأثر والمنزلة المجازية عند الآخر، لا الموضع المادي وحده"
        - text: "«موقع الشمس: مغيب الشمس — موقع: مصب النهر»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "يشمل موضع الانتهاء والوصول (المغيب، المصب) لا مجرد الاستقرار الثابت"
      peripheral_observations:
        - "المُوَقَّعُ (بضم فتح تشديد) في الوسيط = مَن أصابته البلايا / السكين المحدد — لفظ مختلف الشكل والمعنى تماماً"
        - "المُوَقِّعُ = كاتب التوقيع — لا صلة بالدلالة المكانية"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "وضع"
      source_section: "step5_english_bridge"
      evidence_citation: "«وضع: translation_en = position / situation / attitude / posture» — المعجم الموحد لمصطلحات التقنيات التربوية (1999) / المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "يُستخدم في المعاجم التقنية العربية المتخصصة مقابلاً لـ position في مجالات متعددة؛ آلية: اشتقاق (مصدر من جذر و-ض-ع يُفيد الاستقرار والتوضع)"
  knowledge_candidates:
    - lemma: "حيّز"
      justification: "في الفلسفة الإسلامية الكلاسيكية (شرح الإشارات، ابن رشد) يعني حيّز الشيء الخاصيةَ المكانية لتحيُّزه في الفضاء — أقرب للمفهوم المجرد (الخاصية المكانية) من موضع أو موقع اللذَيْن يدلان على المكان نفسه؛ آلية: مجاز (إحياء لفظ كلاسيكي من ح-و-ز بمشابهة وظيفية مع spatial property)"
  generation_notes: "التعريف يرصد مفهوماً مجرداً (خاصية مكانية لا المكان المادي ذاته)؛ الجذر و-ض-ع ممثَّل بقوة بـ'موضع'؛ حيّز هو المرشح الفلسفي للبُعد المجرد"


step1_lemma_validation:
  per_lemma:

    - lemma: "عَلاقَة مَكَانِيَّة"
      decision: confirmed
      decision_reason: "مصطلح علمي مركب (تركيب وصفي: اسم + نعت) يُستخدم في اللسانيات الحاسوبية والأنطولوجيا مقابل spatial relation؛ مقبول بحكم الاستعمال التخصصي رغم غياب التوثيق المعجمي الكلاسيكي؛ التركيب عربي سليم (فَعَالَة + نسبة) واشتقاقيته معقولة (علاقات مكانية، علاقة مكانية نقطية...)"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        type: "وصفي"
        accepted: true
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "فوقَ وتحتَ ويمينَ ويسارَ — هذه علاقات مكانية بين الأجسام"
            substituted: "فوقَ وتحتَ ويمينَ ويسارَ — هذه مواضع الأجسام"
            preserved_meaning: false
            why_failed: "علاقة مكانية تصف رابطاً بين طرفَيْن في الفضاء، أما موضع فيصف موضع كيان واحد — لا تتبادلان"
      nuance_differentiation: "الأكثر تجريداً بين اللمّات الثلاث — يدل على الرابط القائم بين كيانَيْن في الفضاء (فوق/تحت/داخل/خارج/مجاور) لا على المكان نفسه؛ البُعد العلائقي المنطقي هو ما يميّزها"
      example: "تُعدّ الاحتواءُ والتجاورُ والتعامدُ من أبرز العلاقات المكانية التي تدرسها أنطولوجيات الهندسة الشكلية."

    - lemma: "مَوْضِع"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة راسخة من المعجم الوسيط وكشاف التهانوي والمعجم الطبي الموحد؛ كلمة عربية أصيلة على وزن اسم المكان (مَفْعِل من و-ض-ع)؛ لا اقتراض؛ اشتقاقية ممتازة (وضع، موضوع، تموضع، توضُّع)"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "حدِّد موضع الجسم على المحور"
            substituted: "حدِّد موقع الجسم على المحور"
            preserved_meaning: true
      nuance_differentiation: "من و-ض-ع (وضَع = استقرَّ) → يحمل دلالة الثبات والاستقرار المكاني؛ يُفضَّل في السياقات الأدبية والفلسفية والتشريحية والعلمية الدقيقة حين يُراد المكان الذي استقرَّ فيه الشيء ووُضع"
      example: "يُحدِّد علم التشريح موضعَ كل عضو في الجسم بدقة تُوجِب الاستناد إليها في الجراحة."

    - lemma: "مَوْقِع"
      decision: confirmed
      decision_reason: "أدلة مؤكِّدة من المعجم الوسيط ودوزي ومعجم البلدان؛ كلمة عربية أصيلة على وزن اسم المكان (مَفْعِل من و-ق-ع)؛ شائعة جداً في المجالات التقنية والجغرافية والرقمية المعاصرة وفي البيولوجيا الجزيئية"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "حدِّد موقع الجسم على الخريطة"
            substituted: "حدِّد موضع الجسم على الخريطة"
            preserved_meaning: true
      nuance_differentiation: "من و-ق-ع (وقَع = سقط/حدث) → يحمل دلالة التحديد الجغرافي والتقني وموضع الوصول والوقوع؛ يُفضَّل في الخطاب الجغرافي والعسكري والرقمي والجزيئي (موقع المورِّث على الصبغي)"
      example: "تتكشَّف دقة البيولوجيا الجزيئية في تحديد موقع كل مورِّث على سلسلة الصبغي بدقة نانومترية."

    - lemma: "وضع"
      source: step05
      decision: removed
      decision_reason: "شديد التعدد الدلالي: يعني الحالةَ والشأنَ والوضعَ العام قبل أن يعني الموضعَ المكاني؛ وجوده يزيد الضوضاءَ الدلالية دون مكسب؛ الجذر و-ض-ع ممثَّل تمثيلاً أدق وأخص بـ'مَوْضِع'"
      step05_citation: "«وضع: translation_en = position / situation / attitude / posture» — المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "موضع الكتاب على الرف هو الخاصية المكانية له"
            substituted: "وضع الكتاب على الرف هو الخاصية المكانية له"
            preserved_meaning: false
            why_failed: "وضع في هذا السياق يُحمَل على الفعل الماضي (to put) لا على الموضع المكاني؛ التعدد يُوجد لبساً بنيوياً"
      nuance_differentiation: "وضع الأشيع استعمالاً بمعنى الحالة والوضع العام؛ لا يؤدي الدلالة المكانية بدون قرائن مضافة"

    - lemma: "حيّز"
      source: step05
      decision: removed
      decision_reason: "انزياح دلالي في المعاصرة: صحيح فلسفياً تراثياً بمعنى الامتداد المكاني للجسم، لكنه في الاستعمال المعاصر الشائع يفيد النطاق والمجال (في حيّز الإمكان، دخل حيّز التنفيذ)؛ قبوله يُوجد تعارضاً مع المعنى السائد ويُربك المستخدم"
      step05_citation: "الاستعمال الفلسفي في شروح ابن سينا وابن رشد — غير مسجَّل في قاعدة البيانات الحالية"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "موضع الكتاب على الرف"
            substituted: "حيّز الكتاب على الرف"
            preserved_meaning: false
            why_failed: "الجملة غير طبيعية في العربية المعاصرة؛ حيّز يفيد النطاق لا الموضع المحدد"
      nuance_differentiation: "الانزياح الدلالي المعاصر نقل اللفظ من الموضع المكاني إلى مجال النطاق والإمكان؛ لم يعد صالحاً للدلالة المكانية الدقيقة بلا إشكال"

  synset_flags:
    split_needed: true


