step0_evidence:
  per_lemma:
    - lemma: "كِيَان مَادِّيّ"
      confirm:
        - text: "«كيان مادي؛ هوية مادية» (translation_en: physical entity)"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«شيء مادي أو غير مادي يمكن التعرُّف عليه وتمييزه بوضوح» (مدخل: كيان)"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "يكشف أن «كيان» بمفرده (دون قيد مادي) يشمل الكيانات غير المادية، مما يُثبت أهمية المكوّن التمييزي «مادّيّ» في المصطلح المركّب"
        - text: "«ملموس: صفة طبقة فرعية للأسماء تحيل على الذوات الموجودة في العالم الخارجي المحسوس»"
          source: "مسرد الإعلام والتواصل — ALECSO"
          addition: "يُثبت الاستعمال الاصطلاحي لـ«ملموس» بوصفه وصفاً للموجودات الخارجية، غير أنه في سياق تصنيف الأسماء اللغوية لا الكيانات الوجودية؛ يُنبّه إلى أن «ملموس» في تعريف المجموعة مقيِّدٌ أكثر مما ينبغي"
      peripheral_observations:
        - "«حقيقة الشيء أو وجوده المستقل» — معجم المصطلحات الطبية ج.2 (2003) [مدخل: كيان]: تعريف مستقل لـ«كيان» بمعنى entity دون قيد المادية"
        - "«كل جسم ذِي امتداد ووزن ويشغل حيزاً من الفراغ» — المعجم الوسيط [مدخل: المادة]: تعريف المادة الفيزيائية (matter) — مفهوم مستقل لا يرادف physical entity"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "هوية مادية"
      source_section: step5_english_bridge
      evidence_citation: "«كيان مادي؛ هوية مادية» (physical entity) — موسوعة الكهرباء (IEC 60050)"
      justification: "وردت «هوية مادية» في IEC 60050 كمقابل ثانٍ رسمي لـ physical entity إلى جانب «كيان مادي»"
  knowledge_candidates:
    - lemma: "جِسْم"
      justification: "مجاز — الجِسم في التراث الفلسفي العربي يُستعمل للدلالة على ما له وجود مادي وأبعاد مكانية؛ استعمله ابن سينا في الشفاء مقابل المعقولات المجرّدة؛ من جذر ج-س-م ← كيان ذو وجود حسي"
    - lemma: "موجود مادي"
      justification: "تركيب وصفي — اسم مفعول من وُجِد + صفة مادي؛ يُستعمل في الكتابات الفلسفية العربية المعاصرة للتمييز بين الموجود المادي والموجود الذهني المجرَّد"
  generation_notes: "المفهوم يقع في أعلى التراتبية الوجودية للكيانات المادية في شجرة WordNet؛ الجذور الدلالية المركزية: ك-و-ن، م-د-د، ج-س-م"

step1_lemma_validation:
  per_lemma:
    - lemma: "كِيَان مَادِّيّ"
      decision: confirmed
      decision_reason: "مصطلح وصفي مركّب مُثبَّت معجمياً في موسوعة الكهرباء (IEC 60050) مقابلاً موحَّداً لـ physical entity؛ مكوّناه عربيان أصيلان (كيان ← ك-و-ن، مادّيّ ← م-د-د)، والتركيب الوصفي اصطلاحي مستقر في المعجمية التقنية العربية"
      evidence_assessment:
        case: expands
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "يمثّل القطب الوجودي المقابل للكيان المجرَّد — يشمل كل ما له حضور فعلي في العالم الخارجي بصرف النظر عن إمكانية لمسه أو رؤيته مباشرةً (يندرج فيه الضوءُ والحرارةُ والحقولُ الفيزيائية إلى جانب الأجسام المادية الصلبة)"
      example: "يُعدّ الجبلُ والنهرُ والهواءُ والأشعةُ الكهرومغناطيسيةُ كياناتٍ ماديةً تدرسها العلوم الطبيعية بمناهج متنوّعة."

    - lemma: "هوية مادية"
      source: step05
      decision: removed
      decision_reason: "«هوية» تعني الهُوِيَّة والخصوصية الذاتية (identity) لا الكيانية المطلقة (entity)؛ الإبدال يُغيِّر المعنى إذ لا يصحّ القول «الهويات المادية الكبرى» بمعنى «الكيانات المادية الكبرى»؛ ورودها في IEC 60050 اقتراحٌ تقني بديل لا يعكس تكافؤاً دلالياً حقيقياً"
      step05_citation: "«كيان مادي؛ هوية مادية» — موسوعة الكهرباء (IEC 60050)"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
      nuance_differentiation: "هوية تحمل دلالة التمايز والإثبات الذاتي (identity/selfhood) بينما المطلوب دلالة الوجود الكياني المطلق (entity/being)"

    - lemma: "جِسْم"
      source: step05
      decision: removed
      decision_reason: "أضيق من المفهوم المستهدف — المعجم الوسيط يحدّه بـ«كل شيء ذي امتداد ووزن يشغل حيزاً»؛ يستبعد الظواهر الفيزيائية غير الجسمانية كالضوء والحرارة والحقول المغناطيسية التي تندرج ضمن physical entity في تصنيف WordNet"
      step05_citation: "من المعرفة اللغوية — المعجم الوسيط: «كل جسم ذِي امتداد ووزن ويشغل حيزاً من الفراغ»"
      substitution_test:
        result: fail
      nuance_differentiation: "جسم يناسب المرتبة الدلالية الفرعية (physical object) لا المرتبة العليا (physical entity) الشاملة للظواهر والحقول"

    - lemma: "موجود مادي"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر لم يرد مسكوكاً في معجم تخصصي معتمد؛ يفشل اختبار السكّ (يصحّ إبدال «مادي» بـ«حسي» أو «جسماني» دون فقدان المعنى الجوهري) ويفشل اختبار التثبيت المعجمي"
      step05_citation: "من المعرفة اللغوية"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: fail
      nuance_differentiation: "تركيب وصفي حر يفتقر إلى التثبيت الاصطلاحي الذي يتمتع به «كيان مادي» في المعاجم التقنية المعتمدة"

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "كيان له وجود مادّيّ ملموس في العالم الفيزيائيّ"
  assessment:
    decision: revise
    reason: "يُضيِّق قيدُ «ملموس» دلالةَ المفهوم إلى المدركات اللمسية ويستبعد الظواهر الفيزيائية غير القابلة للمسّ (الضوء، الحرارة، الحقول الكهرومغناطيسية) التي تندرج بلا ريب تحت physical entity؛ فضلاً عن تكرار «مادّيّ» و«الفيزيائيّ» وهما مترادفان في هذا السياق"
  scope_note: "الدلالة الإنجليزية physical entity أوسع من إيحاءات «ملموس» — تشمل كل ما له وجود في العالم الخارجي بصرف النظر عن إمكانية لمسه مباشرةً"
  authored_definitions:
    - type: terminological
      text: "كيانٌ ذو وجود حقيقي في العالم الخارجي، في مقابل الكيان المجرَّد الذي لا وجود له إلا في الذهن"
      quality_check:
        genus_present: true
