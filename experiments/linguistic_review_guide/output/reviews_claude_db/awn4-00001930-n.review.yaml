        circular: false
        passed: true
    - type: linguistic
      text: "ما يوجد وجوداً فعلياً في الطبيعة، مدرَكاً بالحواسّ أو قابلاً للاستدلال على وجوده بالقياس والرصد العلمي"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
