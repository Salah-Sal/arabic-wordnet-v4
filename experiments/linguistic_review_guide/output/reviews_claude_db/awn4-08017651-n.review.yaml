step05_lemma_generation:
  evidence_candidates:
    - lemma: "مجموعة جزئية"
      source_section: "step5_english_bridge"
      evidence_citation: "«مجموعة جزئية = subset» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      justification: "المقابل المعجمي المعتمد في معاجم الرياضيات العربية لمصطلح subset؛ تركيب وصفي (آلية: تركيب) من مجموعة + جزئية يجمع بين مفهوم التجميع ومعنى الانتساب الجزئي — ينعكس فيه المفهوم الرياضي (الأجزاء المحتواة)"
  knowledge_candidates:
    - lemma: "مجموعة فرعية"
      justification: "تركيب وصفي (آلية: تركيب) من مجموعة + فرعية (نسبة من فرع = branch/sub-)؛ يوحي بالعلاقة الهرمية بين المجموعتين؛ يُستخدم في بعض المراجع العربية المتخصصة مقابلاً للـ subset وإن كان الاستعمال الأدق يربطه بالجبر الزمري (subgroup)"
  generation_notes: "التعريف يرتكز على علاقتَي العضوية (∀x∈A: x∈B) والاحتواء (A⊆B)؛ المصطلح رياضي بحت في مجال نظرية المجموعات؛ الجذران الدلاليان المركزيان ج-م-ع (التجميع) وج-ز-ء (الجزئية)"

step1_lemma_validation:
  per_lemma:
    - lemma: "مجموعة جزئية"
      decision: confirmed
      decision_reason: "مصطلح رياضي معتمد بسند معجمي مباشر من المعجم الموحد للرياضيات والفلك؛ تركيب وصفي عربي أصيل — كالك (اقتراض مفهومي) صحيح من subset (sub=جزئية، set=مجموعة) دون ترجمة حرفية عمياء؛ معيار الجودة مكتمل: شائع في المناهج والمراجع العربية، يُسر التداول مقبول للمصطلح التقني، ملائم للمفهوم دلالياً، لا لفظ تراثي منافس، عربي خالص المكوّنات، يسمح بالاشتقاق (الجزئية، جزئياً)؛ الوزن الصرفي مناسب: مجموعة (مَفْعُولة — ما جُمع) + جزئية (نسبة من جزء — يدل على الانتماء الجزئي)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "المصطلح الوحيد المعتمد للمفهوم في نظرية المجموعات؛ يتميز عن «مجموعة فرعية» التي تخص الجبر الزمري (subgroup — زمرة أصغر محافظة على البنية الجبرية)، وعن «جزء من مجموعة» التي وصفية غير مصطلحية (تفشل اختبار السكّ: يمكن إبدال «جزء» بـ«عنصر» فتصبح «عنصر من مجموعة» وهو مفهوم مختلف كلياً)"
      example: "مجموعة الأعداد الفردية مجموعة جزئية من مجموعة الأعداد الطبيعية، إذ كلُّ عدد فردي ينتمي بالضرورة إلى مجموعة الأعداد الطبيعية."

    - lemma: "مجموعة جزئية"
      source: step05
      decision: removed
      decision_reason: "تطابق تام مع اللمّة الموجودة بالفعل في المجموعة — الدليل المعجمي يُثبّت اللمّة الأصلية ولا يضيف جديداً؛ لا حاجة لإضافة مكررة"
      step05_citation: "«مجموعة جزئية = subset» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      substitution_test:
        result: pass
      nuance_differentiation: "يطابق اللمّة الأصلية المؤكدة — اكتشاف الخطوة ٠٫٥ يُعزّز اللمّة الموجودة ويؤكد صحتها"

    - lemma: "مجموعة فرعية"
      source: step05
      decision: removed
      decision_reason: "التحقق المعجمي يربط «مجموعة فرعية» بـ subgroup لا subset — خلط مصطلحي حادّ؛ في الرياضيات الرسمية: كل مجموعة فرعية (زمرة فرعية) مجموعة جزئية لكن العكس خاطئ — مفهومان مختلفان لا يصح استبدال أحدهما بالآخر في السياقات الجبرية؛ فشل اختبار الإبدال في النصوص الرياضية الدقيقة"
      step05_citation: "«مجموعة فرعية = subgroup» — المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      substitution_test:
        result: fail
      nuance_differentiation: "تدل في الاستخدام المعجمي الموثق على الزمرة الفرعية (algebraic subgroup) — مفهوم أخص يشترط الحفاظ على العملية الجبرية، لا مجرد الاحتواء"

step3_definition:
  definition_review_flag: false
  current_definition: "مجموعة تكون عناصرها أعضاء في مجموعة أخرى؛ مجموعة محتواة داخل مجموعة أخرى"
  assessment:
    decision: retain
    reason: "التعريف دقيق رياضياً ويجمع بين الصياغة الرسمية (معيار العضوية: تكون عناصرها أعضاء في مجموعة أخرى) والصياغة الهندسية/البصرية (مجموعة محتواة داخل مجموعة أخرى)؛ جنس قريب = مجموعة، فصل مميّز = قيد العضوية الاحتوائية؛ لا دور (لا يستخدم مجموعة جزئية في تعريف نفسه)، لا توسيع، لا تضييق"

