# ══════════════════════════════════════════════════════════════
# مراجعة لغوية شاملة — AWN4 Linguistic Review
# Synset: awn4-04581520-n  |  ili: i61090
# Lemmas: شيء ضخم، شيء هائل
# EN: something especially big or impressive of its kind
# ══════════════════════════════════════════════════════════════

step0_evidence:
  per_lemma:

    - lemma: "شيء ضخم"
      confirm:
        - text: "«الضَّخْمُ: العظيمُ من كل شيءٍ، أو العظيمُ الجِرْمِ، الكثيرُ اللحْمِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الضَّخْمُ: الغليظُ من كل شيءٍ... ويُسْتعار فيقال أَمرٌ ضَخْمٌ وشأنٌ ضَخْمٌ»"
          source: "لسان العرب"
        - text: "«(الضخم) الضخام ومن الطرق الواسع ومن المياه الثقيل»"
          source: "المعجم الوسيط"
        - text: "«الضخم: ذو حجم كبير»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
      expands:
        - text: "«يقال مجازًا: أمرٌ ضَخْمٌ، وشأنٌ ضَخْمٌ، وسُؤْدَدٌ ضَخْمٌ»"
          source: "المعجم الكبير"
          addition: "المجاز يوسّع دلالة ضخم لتشمل الأمور المعنوية والمجردة فوق الحجم الحسي — ومنه يتضح بُعد الفخامة والبروز الذي يتقاطع مع الشقّ الثاني من تعريف المجموعة (مثير للإعجاب)"
      peripheral_observations:
        - "ضخم في الأصل صفة (adjective) لا اسم؛ التركيب «شيء ضخم» عبارة وصفية حرة — لا مدخل معجمي مستقل لها"
        - "المعاجم التقنية (arabterm) تستخدم ضخم صفةً في مركبات طبية ثابتة كـ«ضخامة الأطراف/القولون» لا لوحدها كاسم عام"

    - lemma: "شيء هائل"
      contradicts:
        - text: "«هَائِل: المخيف المفزع، وما خوفته وأفزعته»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعنى الأصلي لهائل الإخافة والإفزاع لا الضخامة ولا الإعجاب بالكبر — الدلالة الأصيلة تغاير الوجه الأول من تعريف المجموعة (شيء كبير)"
      expands:
        - text: "«مثال: منظرٌ هائِلٌ — التعليق: أجازت المعاجم القديمة الاستعمال، ففي التاج: الهُولة، بالضم: العجب، وفيه أيضًا: الهُوَلة: المرأة تهوِّل الناظر بحسنها وجمالها وحليّها ولباسها، وفي المصباح: وهالت المرأة بحسنها، وفي أساس البلاغة: وزينت بالتهاويل، وهي النقوش والألوان تهوِّل من نظر إليها، كما يقال شيء رائع، ولو أبصرته لراعك وهو يروع بجماله»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "توثّق المصادر الكلاسيكية المستشهد بها أن هائل ومشتقاته يُستعملان في الإعجاب والاستحسان (العجب، الجمال، الإبهار) لا في الإخافة وحدها — وهو ما يتقاطع مع (مثير للإعجاب) في تعريف المجموعة، لكن يبقى الاستعمال الإعجابي ثانويًا"
      peripheral_observations:
        - "شيء هائل تركيب وصفي حر — هائل صفة وليست اسمًا في الغالب"
        - "التعارض بين المعنى الأصلي (الإخافة) والمعنى الثانوي (الإعجاب) يجعل هذا الاختيار المعجمي مُلتبِساً"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عملاق"
      source_section: "step5_english_bridge"
      evidence_citation: "«(العملاق) من الإنسان والشجر: ما يفوق جنسه فى الطول والضخامة، ويقال: فلانٌ عملاق في الأدب أو السياسة: فائق مبرّز» — المعجم الوسيط"
      justification: "مفرد اسمي راسخ يدل على شيء يتفوق على أمثاله في الحجم والضخامة مع إمكانية الاستعمال المجازي؛ يوافق مباشرةً قيد «من نوعه» في تعريف المجموعة، ويصلح للدلالة على الأشخاص والأشياء والأشجار"
  knowledge_candidates:
    - lemma: "هُولة"
      justification: "اشتقاق (فُعْلة) من جذر ه-و-ل — التاج: «الهُولة، بالضم: العجب» — اسم يدل على ما يُدهش ويُعجب؛ إحياء لمّة ميتة تُغطّي الشقّ الثاني من التعريف (مثير للإعجاب) بأصالة تراثية، وتتحاشى اللبس الذي يعتري هائل"
  generation_notes: "المفهوم يجمع شقّين — الضخامة الحسية (كبير) والبروز الإعجابي (مثير للإعجاب) — ولا يوجد في المعاجم مفرد واحد يجمعهما بالسجل الكلامي اللاتكلفي الذي تؤديه whacker/whopper في الإنجليزية"

step1_lemma_validation:
  per_lemma:

    - lemma: "شيء ضخم"
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبار السكّ وينعدم تثبيته المعجمي — يمكن إبداله بـ«أمر ضخم / كيان ضخم» دون فقدان المعنى"
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "ضخم يركّز على الحجم المادي الحسي — لا يغطي البُعد الإعجابي (مثير للإعجاب) في تعريف المجموعة؛ المركّب ليس وحدة معجمية مثبّتة"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "شيء هائل"
      decision: removed
      decision_reason: "تركيب وصفي حر + هائل في أصل معناه للإخافة لا للضخامة — ترجمة حرفية عمياء تعتمد على المعنى الثانوي"
      evidence_assessment:
        case: "mixed"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "هائل (ه-و-ل) يضيف بُعد الرهبة والاستهوال الغائب في تعريف المجموعة؛ الاستعمال الإعجابي ثانوي ومنازَع فيه — تعارض بين المعنى الأصيل والمستعمَل"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عملاق"
      source: step05
      decision: confirmed
      decision_reason: "مفرد اسمي معجمي موثّق في المعجم الوسيط — يصلح للأشخاص والأشجار والأشياء، ويلتقي تعريفه بتعريف المجموعة في قيد (من نوعه)"
      step05_citation: "«من الإنسان والشجر: ما يفوق جنسه فى الطول والضخامة» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركّز على التفوق الكمّي على الأقران (يفوق جنسه) — يغطي بُعد الضخامة الاستثنائية بقوة لكنه أضعف في بُعد الإعجاب المجرد؛ الاستعمال المجازي (عملاق في الأدب) يقرّبه من الشق الثاني"
      example: "يُعدّ هذا السدّ عملاقًا في مجال الهندسة المائية؛ إذ يفوق في ضخامته وطاقته الاستيعابية أكبر سدود المنطقة."
      actions:
        - command: create_entry
          params:
            lemma: "عملاق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04581520-n"

    - lemma: "هُولة"
      source: step05
      decision: removed
      decision_reason: "لفظ ميت نادر الاستعمال — يفشل معيار الاطراد وشيوع الفصيح وإن صحّ اشتقاقه وتثبيته الكلاسيكي"
      step05_citation: "«الهُولة، بالضم: العجب» — تاج العروس (مستشهد به في معجم الصواب اللغوي)"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "عملاق"
      reason: "مصدر الخطوة ٠٫٥ — مفرد اسمي موثّق يعبّر عن المفهوم بدقة أعلى من التركيبين الوصفيين المحذوفين"
      via_command: create_entry + add_sense

