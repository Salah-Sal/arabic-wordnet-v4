step0_evidence:
  per_lemma:

    - lemma: تجميع
      confirm:
        - text: "«تجميع: aggregation»"
          source: المعجم الموحد لمصطلحات الجيولوجيا (2000)
        - text: "«تجميع: assemblage»"
          source: مسرد الجغرافيا والتاريخ، ALECSO
        - text: "«تجميع: collection / recording»"
          source: المعجم الموحد لمصطلحات المياه (2000)
        - text: "«مؤالَفةُ عناصرَ مصنَّعة (أو مُنتَجة) بعضها ببعض، لتكوين عنصرٍ أكبر»"
          source: معجم مصطلحات المعلوماتية (2000)
      expands:
        - text: "«التجميع في الصناعة المعجمية هي الطريقة التي تقوم على تجميع اللفظ البسيط ومشتقاته، أو ما يظهر على أنه مشابه له في المعنى الأصلي، في المدخل المعجمي نفسه»"
          source: المعجم الموحد لمصطلحات اللسانيات (2002)
          addition: يُوسّع الدلالة إلى إجراء منهجي في صناعة المعاجم لا إلى المجموعة بوصفها حاصلاً
        - text: "«طريقة في تعلُّم الآلة غير الموجَّه لتجميع الأشياء المتشابهة في مجموعات. ويُطلق عليها أيضًا (تحليل المجموعات)»"
          source: معجم البيانات والذكاء الاصطناعي (2024)
          addition: يُوسّع الدلالة إلى خوارزمية التجميع الحاسوبي (clustering) لا إلى المجموعة الناتجة
        - text: "«في هندسة الإنشاءات مُصطلح يُقصد به تجميع وتركيب وتثبيت وتوصيل ماكينة، أو تركيب أجزاء مفردة سابقة الصنع بحيث تصبح وحدة تقنية أو آلة جاهزة للعمل»"
          source: المعجم الموحد لمصطلحات المياه (2000)
          addition: يُوسّع الدلالة إلى عملية التجميع التقني (assembly as process) لا إلى الناتج
      contradicts:
        - text: "«انخفاض تدريجي في حجم الجزء الأكبر من التربة، ويرجع ذلك إلى إزالة المياه من بين الجزيئات بعد الضغط المستمر»"
          source: المعجم الموحد لمصطلحات النقل (2010)
          conflict: مدخل تجميع في هذا المعجم يُقابل "consolidation" (تماسك التربة الجيوتقني) — معنى مغاير تماماً لا صلة له بالجمع

    - lemma: تشكيلة
      confirm:
        - text: "«تَشْكيلة اسم مرة مأخوذ من الفعل «شَكَّلَ» بمعنى صوَّر أشكالاً، وقد جاء في الأساسي أن التشكيلة هي عدد متنوع من شيء ما»"
          source: معجم الصواب اللغوي لأحمد مختار عمر
      expands:
        - text: "«مجموعة العناصر المادية والبرمجية المكونة لحاسوب»"
          source: المعجم الموحد لمصطلحات تقانة المعلومات (2011)
          addition: يُوسّع الدلالة إلى معنى تقني محدد (configuration = الهيئة التقنية لنظام معلوماتي) لا مجرد العدد المتنوع

    - lemma: مجموعة
      confirm:
        - text: "«لفظ عام يطلق على مجموع عناصر منسجمة تكون وحدة مثل مجموعة المحارف ومجموعة التعليمات وغيرهما»"
          source: المعجم الموحد لمصطلحات تقانة المعلومات (2011)
        - text: "«مفهوم رياضي استعمل بكثرة في اللسانيات وهو يدل على عدد من المكونات لها خاصيات متشابهة أو خاصية واحدة»"
          source: المعجم الموحد لمصطلحات اللسانيات (2002)
        - text: "«مجموعة من الأشياء المتشابهة في خصائصها، والمنظَّمة حسب أوجه التشابه بينها»"
          source: معجم البيانات والذكاء الاصطناعي (2024)
      expands:
        - text: "«تطلق في الكيمياء على عدد من الذرات تدخل في التفاعلات الكيميائية دون انفصام بينها فكأنما هي ذرة واحدة مثال ذلك المجموعة الهيدروكسيدية»"
          source: المعجم الموحد لمصطلحات الكيمياء (1992)
          addition: يُوسّع الدلالة إلى وحدة كيميائية وظيفية ذات رابط تساهمي لا مجرد اجتماع أشياء
        - text: "«عدد من الأشخاص الذين حصل بينهم تفاعل في الأفكار مدة من الزمن، فتقاسموا الأهداف ذاتها، وتكونت لديهم هوية جماعية»"
          source: مسرد الإعلام والتواصل، ALECSO
          addition: يُوسّع الدلالة إلى مجموعة بشرية ذات هوية مشتركة — يتجاوز مجرد الجمع إلى الاندماج الاجتماعي
        - text: "«تشير إلى كتابٍ يضُم (قصصا / قصائد) تصدُر دُفعة واحدة بعد نشرها موزعة في الزمان والفضاء»"
          source: المعجم الموحد لمصطلحات اللسانيات (2002)
          addition: يُوسّع الدلالة إلى مجموعة أدبية (anthology) بشروط نشر محددة
      peripheral_observations:
        - text: "«المَجْموعة من الفَلَوَاتِ: التي يَجْتَمِع بها القَوْمُ ولا يَتَفَرَّقُون خَوْفَ ضَلال الطريق، ونَقْصِ الزَّادِ، ونَحْو ذلك»"
          source: المعجم الكبير
          note: معنى جغرافي مستقل — نوع من الصحراء يجتمع فيها المسافرون؛ لا صلة له بمعنى المجموعة من الأشياء

step05_lemma_generation:
  evidence_candidates:
    - lemma: تراكم
      source_section: step5_english_bridge
      evidence_citation: "«تراكُم: accumulation» — المعجم الموحد لمصطلحات الجيولوجيا (2000)؛ ورد بالترجمة ذاتها في الأرصاد الجوية والاقتصاد والفيزياء والكيمياء والقانون"
      justification: المقابل العربي الأكثر استعمالاً لـ "accumulation" وهي إحدى لمّات OEWN — يدل على اجتماع الأشياء بتكدّسها التدريجي
    - lemma: حزمة
      source_section: step4_fts_keyword
      evidence_citation: "«(الحزمة) ما جمع وربط من كل شيء» — المعجم الوسيط؛ «رِزمة، حزمة: bundle» — المعجم الموحد لمصطلحات النقل (2010)"
      justification: تدل على جمع الأشياء وضمّها في وحدة واحدة، وتجمع بين معنيَي الجمع والوحدة
  knowledge_candidates:
    - lemma: زمرة
      justification: "لفظ عربي كلاسيكي من الجذر ز-م-ر بمعنى الجماعة والفوج (المعجم الوسيط: «الزمرة: الفوج والجماعة»)؛ ورد في نصوص المعاجم التقنية بديلاً عن مجموعة (معجم مصطلحات المعلوماتية: «زمرةٌ من المحارف»). آلية التوليد: مجاز — إحياء لفظ تراثي خفيف الاستعمال."
    - lemma: حشد
      justification: "من الجذر ح-ش-د، دلالته الأصيلة الجمع والتعاون (لسان العرب: «حشدَ القومَ: جمعهم»؛ الصحاح: «عندي حَشْدٌ من الناس: جماعة»). آلية التوليد: مجاز — تعميم لفظ الجمع البشري ليشمل assemblage من أشياء."
  generation_notes: الجذر ج-م-ع ممثَّل باللمّتَين مجموعة وتجميع الموجودتَين؛ المقترحات تُغطي زاوية التراكم (تراكم) والتحزيم (حزمة) والفوج الكلاسيكي (زمرة) والحشد (حشد)

step1_lemma_validation:
  per_lemma:

    - lemma: تجميع
      decision: confirmed
      decision_reason: مؤيَّد بترجمات معجمية متعددة (aggregation, assemblage, collection) وبتعريف صريح — يُستعمل في العربية للدلالة على التوليفة والتجميعة الناتجة لا الفعل وحده
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: يتميّز بدلالة التجميع القصدي وتنظيم العناصر المتفرقة في وحدة — يُستعمل تحديداً حين يُبرَز فعل الجمع وعمليته، بخلاف مجموعة (وجود جامع مجرد) وتشكيلة (تنوع العناصر)
      example: "أصدرت الدار تجميعاً من روائع الموسيقى العربية الكلاسيكية يضمّ أعمال ستة مؤلفين بارزين من القرن الماضي."

    - lemma: تشكيلة
      decision: confirmed
      decision_reason: مؤيَّدة بتعريف معجمي صريح («عدد متنوع من شيء ما») — فصيحة مقرّرة في معجم الصواب اللغوي بعد دراسة الاستعمال
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: تتميّز بالتركيز على التنوع والاختلاف بين العناصر — تُستعمل تحديداً حين تكون مكونات المجموعة مختلفة ومتعددة الأشكال («عدد متنوع»)، بخلاف مجموعة التي لا تشترط التنوع
      example: "عرضت المحل تشكيلةً واسعة من الأزياء الفصلية بأشكال وألوان متعددة تلائم مختلف الأذواق."

    - lemma: مجموعة
      decision: confirmed
      decision_reason: أقوى لمّات المجموعة الترادفية بياناً معجمياً — مؤيَّدة بتعريفات صريحة من معاجم تقنية وعلمية ولسانية متعددة، وهي الأساس الذي بُنيت عليه المجموعة
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: أعمّ الثلاثة وأشملها — تصلح للأشياء والأفراد والمفاهيم الرياضية والكيميائية والأدبية ولا تشترط قصداً في الجمع ولا تنوعاً في العناصر؛ تُركّز على الكيان الجامع ككلٍّ واحد
      example: "أصدر المعهد مجموعةً من الدراسات العلمية حول التغير المناخي تُعدّ اليوم مرجعاً أساسياً في الحقل."

    # ── مرشحات الخطوة ٠٫٥ ──

    - lemma: تراكم
      source: step05
      decision: removed
      decision_reason: فشل اختبار الإبدال — تراكم يدل على التكدّس التدريجي والغالباً غير المقصود، ولا يُستعمل للدلالة على collection أو assemblage بالمعنى العام؛ كما أنه مصدر فعل يصف العملية أكثر من الحاصل
      step05_citation: "«تراكُم: accumulation» — المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      substitution_test:
        result: fail
      nuance_differentiation: يحمل ضمناً التراكم التلقائي عبر الزمن (تراكم الديون، تراكم الأشغال) لا الجمع الإرادي المنظّم — لا يصحّ إبداله بمجموعة في سياقات المجموعة المنسجمة

    - lemma: حزمة
      source: step05
      decision: removed
      decision_reason: أضيق دلالةً من مقتضى المجموعة الترادفية — تستلزم الضمّ المادي أو الرباط التقني، ولا تُستعمل للمجموعات المجردة أو المعنوية
      step05_citation: "«(الحزمة) ما جمع وربط من كل شيء» — المعجم الوسيط"
      substitution_test:
        result: fail
      nuance_differentiation: تنطوي على الرباط المادي بين عناصر المجموعة مما يُضيّق دلالتها — لا تصحّ مع «مجموعة من الأفكار» أو «مجموعة من الخصائص»

    - lemma: زمرة
      source: step05
      decision: removed
      decision_reason: دلالتها التراثية تقتصر على الجماعة القليلة من الناس («الجماعة القليلة» — التوقيف على مهمات التعاريف)، وكلا القيدَين (القِلّة والبشر) يتعارضان مع عمومية المجموعة الترادفية
      step05_citation: "«(الزمرة) الفوج والجماعة» — المعجم الوسيط؛ «الزمرة: الجماعة القليلة» — التوقيف على مهمات التعاريف للمناوي"
      substitution_test:
        result: fail
      nuance_differentiation: تُقيّدها دلالياً بجماعات الناس وبالقِلّة — لا تصحّ مع «مجموعة من الأشياء» ولا مع المجموعات الكبيرة

    - lemma: حشد
      source: step05
      decision: removed
      decision_reason: تختص في المصادر الكلاسيكية والمعاصرة بالتجمع البشري الفاعل (الخِفّة في التعاون والاستعداد)، ولا تُستعمل للأشياء الجامدة أو المجموعات المجردة
      step05_citation: "«(الحشد) من الناس الجماعة» — المعجم الوسيط؛ «حشدَ القومَ يحشِدُهم: جمعهم» — لسان العرب"
      substitution_test:
        result: fail
      nuance_differentiation: تقتصر دلالتها على الجمع البشري النشط — لا تصحّ مع «مجموعة من الكتب» أو «مجموعة بيانات»

step3_definition:
