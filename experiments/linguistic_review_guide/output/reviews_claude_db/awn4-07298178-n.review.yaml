step05_lemma_generation:
  evidence_candidates:
    - lemma: "خيبة أمل"
      source_section: "step4_fts_keyword"
      evidence_citation: "«خَيْبة أمل / مُخيِّب الأملِ» — المورد الحديث (2008)"
      justification: "أقرب موثَّق دلالي في المعاجم للمفهوم المستهدف — يقع في الحقل الدلالي ذاته (ما لم يُلبِّ التوقع) غير أن جنسه حالة وجدانية لا تصنيف حدث"
  knowledge_candidates:
    - lemma: "فقاعة"
      justification: "آلية: مجاز (المرتبة الأولى) — الفقاعة تبدو ضخمة ثم تنفقع، كناية راسخة في الصحافة العربية المعاصرة للأحداث المضخَّمة التي لا تُفضي إلى شيء يُذكر، نحو: «كانت القمة مجرد فقاعة». الجذر: ف-ق-ع"
    - lemma: "هبوط"
      justification: "آلية: توسّع دلالي (مجاز) من ه-ب-ط — المورد الحديث يُقابل «anticlimax» بـ«الهبوط المفاجئ» وهو الأقرب في المعاجم المتاحة لمفهوم nonevent: الهبوط المفاجئ في مستوى الحدث بعد توقعات عالية"
  generation_notes: "المفهوم يعاني فجوة معجمية في العربية — الحقل الدلالي المعجمي يتمحور حول الحالة الانفعالية (خيبة، إحباط، مخيب) لا حول تصنيف الحدث ذاته كنوع. الجسر الإنجليزي (nonevent) والمطابقة الدقيقة لكلتا اللمّتين أسفرا عن لا شيء"

step1_lemma_validation:
  per_lemma:
    - lemma: "حدث مخيب للآمال"
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل اختبارَي السَكّ والتثبيت المعجمي — مكوّناته قابلة للإبدال بمرادفات (مخيب ↔ محبط ↔ خائب، للآمال ↔ للتوقعات) دون تغيير المعنى مما ينفي كونه وحدة معجمية ثابتة. النوع: تركيب وصفي (حدث + مخيب للآمال)"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "كان الاجتماع حدثاً مخيباً للآمال"
            substituted: "كان الاجتماع حدثاً محبطاً للتوقعات"
            preserved_meaning: true
            why_failed: "إبدال «مخيب» بـ«محبط» و«الآمال» بـ«التوقعات» لا يغيّر المعنى — يثبت أن التعبير وصفي حر لا مصطلح مسكوك"
      nuance_differentiation: "يصف الحدث من منظور أثره الانفعالي على المتلقي دون أن يُصنّفه كنوع محدد من الأحداث ذات التوقع الزائد — هو وصف يصح لأي حدث مخيب لا للمفهوم الخاص بـ«nonevent»"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "لا حدث"
      decision: confirmed
      decision_reason: "اقتراض مفهومي (calque) من «non-event» باستخدام نموذج «لا+اسم» المنتج في العربية المعاصرة (لا مركزية، لا سلكي، لا نهائي، لا شرطية) — مادته عربية خالصة (لا + حدث)، الاستعمال مستقر في الصحافة العربية المتخصصة. فحص الاقتراض: تركيب هيكلي لا لفظي، مقبول. بوابة الجودة: خفيف النطق ✓، يتناظر مع المفهوم بدقة ✓، لا مرادف تراثي مفرد ✓، مادة عربية ✓، يقبل نسبة اشتقاقية (لا-حَدَثِيّ) ✓. الوزن الصرفي: نموذج «لا+اسم» أنموذج توليدي معتمد في مجامع اللغة العربية"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللمّة الوحيدة القادرة على أداء وظيفة المصطلح — تُبرز التناقض الجوهري للمفهوم: ما كان مُتَوَقَّعاً «حَدَثاً» (= ذا أهمية) تبيَّن «لا حدثاً» (= دون أهمية مستحقة). تتمايز عن الأخوات المحذوفة بكونها وحدة معجمية ثابتة لا عبارة وصفية"
      example: "أثارت الانتخابات البلدية ضجةً إعلامية واسعة قبيل موعدها، غير أنها جاءت في نهاية المطاف لا حدثاً؛ انتهت دون أي تحوّل في موازين القوى أو قرارات تستحق التسجيل."

    - lemma: "خيبة أمل"
      source: step05
      decision: removed
      decision_reason: "خطأ في الجنس المنطقي: «خيبة أمل» تصنّف حالةً وجدانية (شعور بعدم تحقق ما كان يُرجى) لا نوعاً من الأحداث — المشتمِل الصحيح لها هو المشاعر/الحالات النفسية، لا «حدث». فشل اختبار الإبدال في سياق تصنيف الأحداث"
      step05_citation: "«خَيْبة أمل / مُخيِّب الأملِ» — المورد الحديث (2008)"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "كانت القمة الاقتصادية لا حدثاً"
            substituted: "كانت القمة الاقتصادية خيبة أمل"
            preserved_meaning: false
            why_failed: "«خيبة أمل» تنقل الأثر النفسي على المتلقي لا تصنّف الحدث ذاته كنوع من الأحداث"
      nuance_differentiation: "تقع في مجال الانفعالات والحالات النفسية (effect) لا في مجال تصنيف الأحداث (entity type)"

    - lemma: "فقاعة"
      source: step05
      decision: removed
      decision_reason: "مجاز حر غير مثبَّت كمصطلح لتصنيف الأحداث — فشل اختبار التثبيت المعجمي (لم تُسجَّل في أي معجم بوصفها مصطلحاً لهذا المعنى). معناها المجازي أوسع من المفهوم المستهدف: تستلزم ضخاً مبالغاً وزيفاً كاملاً ثم انفجاراً، وهو أبلغ وأشمل من مجرد كون الحدث أقل أهمية مما كان متوقعاً"
      step05_citation: "«نفاخات ترتفع على سطح الماء والشراب كالقوارير تنفقئ سريعاً» — المعجم الوسيط"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "كانت الانتخابات لا حدثاً"
            substituted: "كانت الانتخابات فقاعة"
            preserved_meaning: false
            why_failed: "«فقاعة» تستلزم ادعاءً زائفاً مبالغاً فيه وانفجاراً كاملاً، أشد من مجرد فجوة بين التوقع والأهمية الفعلية"
      nuance_differentiation: "أقوى دلالةً وأوسع مجالاً من المفهوم المستهدف (زيف كامل لا فجوة توقع)"

    - lemma: "هبوط"
      source: step05
      decision: removed
      decision_reason: "مرجع دلالي خاطئ: الدليل من مدخل «anticlimax» لا «nonevent» — المفهومان متقاطعان لا متطابقان؛ «anticlimax» يستلزم مساراً نزولياً درامياً بينما «nonevent» يستلزم فجوة بين التوقع وأهمية الحدث فحسب. «هبوط» مصدر يدل على عملية التحرك نزولاً لا على تصنيف نوع الحدث. فشل اختبار الإبدال"
      step05_citation: "«الهبوط المفاجئ / انحطاط / خيبة أمل / شيء غير مثير» — المورد الحديث (2008) [مدخل: anticlimax]"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "اتضح أن المؤتمر كان لا حدثاً"
            substituted: "اتضح أن المؤتمر كان هبوطاً"
            preserved_meaning: false
            why_failed: "«هبوط» يوحي بتدهور متدرج أو مسار نزولي، لا بحدث أقل أهمية مما كان منتظراً"
      nuance_differentiation: "يفترض مساراً زمنياً (من ذروة إلى هبوط) بينما «لا حدث» يفترض فجوة بين التوقع والواقع دون اشتراط مسار"

step3_definition:
  current_definition: "حدث منتظر يتبين أنه أقل أهمية بكثير مما كان متوقعاً"
  assessment:
    decision: retain
    reason: "التعريف سليم بنيوياً ودلالياً: الجنس «حدث» صريح، والفصل مزدوج (منتظر = يحدد اشتراط التوقع السابق) + (يتبين أنه أقل أهمية بكثير مما كان متوقعاً = يحدد فجوة التوقع بدقة). لا أدلة معجمية خارجية تناقضه أو تستدعي مراجعته"

