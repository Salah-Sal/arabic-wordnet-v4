step0_evidence:
  per_lemma:

    - lemma: "إصدار"
      confirm:
        - text: "«مطبوعٌ ورقيٌّ أو إلكترونيٌّ, له رقمٌ أو ترتيبٌ»"
          source: "المعجم الكبير"
        - text: "«إصدار» (مقابل: version)"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«إصدار» (مقابل: issue)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "«النقود» (مقابل: emission; issuing)"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "إصدار النقود = طرح عملة في التداول المالي — مفهوم اقتصادي مغاير تماماً لمجموعة نسخ تُعرَض للجمهور"
        - text: "«إصدار» (مقابل: promulgation)"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الإصدار القانوني = إعلان نفاذ مرسوم أو قانون — لا صلة بالنسخ والتوزيع للجمهور"
        - text: "«إصدار» (مقابل: emission)"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الانبعاث/الإطراح الطبي (كإفراز غدّي أو انبعاث إشعاعي) مفهوم مغاير تماماً"
      expands:
        - text: "«يتعلق الأمر عادة بإصدار جديد لبرمجية يحسن أداءها ويصحح الأخطاء التي يمكن أن تكون قد وردت في الإصدار السابق» (مقابل: release)"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "يوسّع الدلالة إلى إصدارات البرمجيات المتعاقبة ذات الأرقام التطوريّة — بُعد غير صريح في تعريف المجموعة"
        - text: "«إصدارٌ أو سحبٌ خاصّ لمنتَجٍ عتادي أو اسم برمجية.» (مقابل: version)"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يمتدّ ليشمل العتاد الحاسوبي والبرمجيات — توسيع عن نطاق النشر التقليدي الورقي"
      peripheral_observations:
        - "«الأَصْدَارُ: كأنه جمع الصدر ضدّ الورد: مواضع بنعمان الأراك قرب مكة يجلب منها العسل، والمراد بها صدور الوادي، عن الأصمعي.» — معجم البلدان لياقوت الحموي: معنى جغرافي مستقل تماماً، لا صلة له بالنشر والتوزيع"

    - lemma: "طبعة"
      confirm:
        - text: "«مجموعُ النُّسَخِ الْمَطْبوَعَة في مرَّة واحدة من كِتابٍ, أو جريدة. يُقال: الطَّبْعَة الأولَى, أو الأخيرة»"
          source: "المعجم الكبير"
        - text: "«طبعة» (مقابل: edition)"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"
        - text: "«طَبْعة» (مقابل: edition)"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«(1أ) طبعة [من كتاب]. (1ب) مجموع النُّسَخ المطبوعة دفعةً واحدة. (2) نسخة.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«صورة مطبوعة عن أصل محفور» (مقابل: print)"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يوسّع دلالة طبعة لتشمل الطباعة الفنية من لوحة محفورة — معنى مختلف عن مجموعة النسخ المتطابقة"
      peripheral_observations:
        - "«النَّهَر» — المعجم الكبير (التعريف الثاني لمدخل طبعة): معنى قديم لمجرى ماء، مستقل تماماً عن دلالة النشر"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نشرة"
      source_section: "step5_english_bridge"
      evidence_citation: "«نشرة» (مقابل: issue) — المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"
      justification: "اشتقاق — مشتق من جذر ن-ش-ر على وزن فَعْلة الدالة على الوحدة المنشورة؛ الترجمة «issue» تقابل مفهوم الإصدار الواحد المطروح للجمهور"
    - lemma: "طبع"
      source_section: "step5_english_bridge"
      evidence_citation: "«طبعة» (مقابل: edition) — المورد الحديث (2008): «مجموع النسخ المطبوعة دفعةً واحدة»"
      justification: "تركيب — المعاجم تُكثر من مشتقات الجذر ط-ب-ع للتعبير عن مفهوم الطبع والنسخ المتطابقة؛ الجذر الأصل يدل على الختم والضغط مما ينتج نسخاً متماثلة"
  knowledge_candidates:
    - lemma: "إصدارة"
      justification: "اشتقاق — مصدر المرة من أصدر على وزن إفعالة، تدل على وحدة واحدة مما صدر؛ مثبّتة معجمياً في المعجم الكبير: «الإصدارةُ: الإصدارُ»"
  generation_notes: "التعريف يصف مجموعة نسخ متطابقة تُطرح دفعةً واحدة — المفهوم المحوري هو التزامنية والتطابق في الطرح العام؛ الجذور الدلالية المركزية: ط-ب-ع (الختم والنسخ)، ص-د-ر (الخروج والانطلاق)، ن-ش-ر (البثّ والتوزيع)"

step1_lemma_validation:
  per_lemma:

    - lemma: "إصدار"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من المعجم الكبير والمعاجم التقنية؛ المعاني المتضاربة (اقتصادي/قانوني/طبي) حقول دلالية منفصلة لا تُخلّ بصحة اللمة في السياق الراهن؛ المصطلح مستقرّ في النشر والإعلام الحديث"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "إصدار أعمّ من طبعة — يشمل النشر الرقمي والبرمجيات والمنتجات غير الورقية؛ هو الاختيار الطبيعي في سياقات التقنية والإعلام وكل ما يُطرح للجمهور بصيغ رقمية أو متعددة الوسائط"
      example: "أتاح الناشر إصدار الكتاب السادس للقرّاء في آنٍ واحد على الصعيدين الورقي والرقمي."

    - lemma: "طبعة"
      decision: confirmed
      decision_reason: "أدلة مؤكدة قوية من معاجم متعددة — المعجم الكبير يطابق التعريف مطابقةً شبه حرفية: «مجموع النسخ المطبوعة في مرة واحدة»؛ المصطلح راسخ في النشر العربي التراثي والمعاصر"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "طبعة أخصّ من إصدار — تركّز على المطبوعات الورقية التقليدية (الكتاب والجريدة)؛ هي الاختيار الأصلح في سياقات النشر والتحقيق والتراث والأدب؛ وزن فَعْلة يحمل معنى الوحدة/المجموعة المنتجة في دفعة واحدة"
      example: "نفدت الطبعة الأولى من الرواية خلال أسبوعين فأقدم الناشر على طرح طبعة ثانية منقّحة."

    - lemma: "نشرة"
      source: step05
      decision: removed
      decision_reason: "فشل اختبار الإبدال والسكّ — «نشرة» في الاستعمال الراسخ تقتصر على الدوريات والبيانات الإخبارية (نشرة إخبارية، نشرة طقس)؛ لا يُقال «نشرة الكتاب» بديلاً عن «طبعة الكتاب»، ولا تحمل دلالة مجموعة النسخ المتطابقة"
      step05_citation: "«نشرة» (مقابل: issue) — المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"

    - lemma: "إصدارة"
      source: step05
      decision: removed
      decision_reason: "مكررة مع لمة «إصدار» الموجودة — المعجم الكبير يُعرّفها بـ«الإصدار» نفسه دون فارق دلالي مضاف؛ رديف صرفي لا يستحق إدراجاً مستقلاً في المجموعة"
      step05_citation: "«الإصدارةُ: الإصدارُ» — المعجم الكبير"

