step0_evidence:
  per_lemma:

    - lemma: "خيار أول"
      confirm:
        - text: "«خِيارُ الشَّيءِ: أفْضَلُه... المُخْتارُ المُنْتَقَى»"
          source: "المعجم الكبير"
        - text: "«اسم بمعنى طلب خير الأمرين... المختار المنتقى»"
          source: "المعجم الوسيط"
        - text: "«مجموعة دارة الخيار الأول» (ترجمة: first choice circuit group)"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«في البيع (عند الفقهاء): طلب خير الأمرين: إما إمضاء البيع وإما فسخه»"
          source: "المعجم الكبير"
          addition: "دلالة الخيار التعاقدي (حق الفسخ أو الإنفاذ) — بُعد فقهي يتجاوز تعريف المجموعة"

    - lemma: "خيار مُفَضَّل"
      confirm:
        - text: "«مُفَضَّل: مجلد أو موقع على الإنترنيت يتم الولوج إليه باستمرار»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
        - text: "«الأثير؛ المفضَّل؛ المَحْظيّ»"
          source: "المورد الحديث (2008) — ترجمة favorite"

    - lemma: "ملاذ"
      contradicts:
        - text: "«الملجأُ والحصن»"
          source: "المعجم الوسيط"
          conflict: "ملاذ يعني المأوى والحمى — لا صلة له بمعنى الاختيار أو التفضيل"
        - text: "«(الملاذ) الملجأ والحصن»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "توافق كامل مع المعنى السابق — ملاذ = مأوى لا خيار مُفَضَّل"
        - text: "«عموما بناية صغيرة وبسيطة... تستخدم كملجأ للوقاية من سوء الأحوال الجوية»"
          source: "مسرد المناخ والبيئة (ALECSO)"
          conflict: "الاستعمال التخصصي يحصر الكلمة في مأوى جغرافي"
      peripheral_observations:
        - "جذر ل-و-ذ (لاذ بالشيء = اعتصم به) — وزن مَفْعَل للمكان — حقل دلالي مستقل عن الاختيار"
        - "«ملاذ أخير» هو النقيض المنطقي لـ«خيار أول»، لا مرادفه"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُفَضَّل"
      source_section: step5_english_bridge
      evidence_citation: "«الأثير؛ المفضَّل؛ المَحْظيّ» — المورد الحديث (2008) ترجمة favorite"
      justification: "اسم مفعول من فضَّل يُستعمل اسماً دالاً على الشيء الذي يُختار دوماً ويُؤثَر؛ وثَّقه ARABTERM (تقانة المعلومات) بمعنى «ما يُولج إليه باستمرار» — وحدة معجمية مسكوكة"
    - lemma: "أثير"
      source_section: step5_english_bridge
      evidence_citation: "«الأَثِير: المفضل على غيره؛ يقال: هو أثيري: أوثره وأفضله» — المعجم الوسيط"
      justification: "لفظ كلاسيكي من أ-ث-ر يدل على الشيء أو الشخص الذي يُؤثَر ويُقدَّم على غيره؛ مسجَّل في المعجم الوسيط بصيغة إسمية مستقلة دالة على التفضيل"
  knowledge_candidates:
    - lemma: "خِيرة"
      justification: "اشتقاق من خ-ي-ر (خار يخار = اختار الأفضل) على وزن فِعْلة — «خِيرة القوم: مختارهم» — يدل مباشرةً على المختار المُؤثَر؛ آلية: اشتقاق من جذر الاختيار ذاته"
  generation_notes: "الجذور المركزية للمفهوم: خ-ي-ر (اختيار وأفضلية)، ف-ض-ل (تفضيل وتقديم)، أ-ث-ر (إيثار وتقديم على الغير)"

step1_lemma_validation:
  per_lemma:

    - lemma: "خيار أول"
      decision: confirmed
      decision_reason: "مركب إضافي موثَّق في ARABTERM بالمعنى التقني ومدعوم بأدلة معجمية تؤكد «خيار = المختار المنتقى»؛ الاشتقاق من خ-ي-ر أصيل؛ يُسر التداول وشيوع الفصيح مرتفعان؛ ليس ترجمةً حرفيةً عمياء إذ «خيار» يحمل دلالة الأفضلية والانتقاء نصاً في المعاجم"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز الأولوية الترتيبية الصريحة (ما يأتي أوّلاً في تسلسل البدائل) — البُعد «الأول» في التسلسل أوضح مما تُفيده «مُفَضَّل» التي تُركِّز على التفضيل الوجداني"
      example: "يبقى الحوار المباشر خيارَ الدبلوماسية الأوّلَ في تسوية النزاعات قبل اللجوء إلى أي إجراء آخر."

    - lemma: "خيار مُفَضَّل"
      decision: removed
      decision_reason: "مركب وصفي حر يفشل اختبار السكّ — يمكن إبدال «خيار» بـ«اختيار» أو «بديل» دون إخلال بالوصفية؛ غير مسجَّل في المعاجم كوحدة ثابتة؛ يُسر التداول منخفض مقارنةً بـ«خيار أول»؛ يفتقر إلى الاشتقاقية المستقلة كمركَّب"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: pass
      nuance_differentiation: "لا يُضيف ظلاً دلالياً محدداً فوق «خيار أول» — التفضيل مجرد تكثيف وصفي لما تحمله الكلمة الأولى أصلاً"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ملاذ"
      decision: removed
      decision_reason: "تناقض جوهري مدعوم بثلاثة معاجم — ملاذ من جذر ل-و-ذ بمعنى الملجأ والحصن لا الاختيار؛ لا توجد شواهد على انزياح دلالي نحو التفضيل في أي طور من أطوار اللغة؛ وقوعه في هذه المجموعة خطأ في التصنيف"
      evidence_assessment:
        case: contradicts
      substitution_test:
        result: fail
      nuance_differentiation: "حقل دلالي منفصل تماماً (الحماية والاحتماء) — «ملاذ أخير» هو النقيض المنطقي للخيار الأول لا مرادفه"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُفَضَّل"
      source: step05
      decision: confirmed
      decision_reason: "اسم مفعول عربي أصيل (ف-ض-ل) مسكوك في الاستعمال التخصصي والعامّي بمعنى «ما يُختار دوماً ويُؤثَر» — يعمل اسماً مستقلاً كما في «المفضَّلات» (browser favorites)؛ اشتقاقيته عالية (فضَّل، تفضيل، مُفضَّل)؛ ملاءمته للمفهوم تامة؛ لا اشتراك لفظي يُشوِّش"
      step05_citation: "«مُفَضَّل: مجلد أو موقع على الإنترنيت يتم الولوج إليه باستمرار» — المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز التفضيل الذاتي الراسخ والمألوف (ما ألِفه المرء وأحبَّه) في مقابل الأولوية الترتيبية الصريحة لـ«خيار أول»"
      example: "أصبح هذا المطعم مُفَضَّلَ الأسرة في المناسبات الخاصة، لا يُعدل عنه إلى سواه."
      actions:
        - command: create_entry
          params:
            lemma: "مُفَضَّل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-90003191-n"

    - lemma: "أثير"
      source: step05
      decision: removed
      decision_reason: "اشتراك لفظي حاد — «الأثير» في المعاجم الحديثة ومصطلحات العلوم محتلٌّ بالمعنى الكيميائي/الفيزيائي (ether = آيثر اليوناني)؛ فضلاً عن أن الاستعمال الكلاسيكي يميل نحو «المحبوب المُقَرَّب» (علاقة شخصية) لا نحو شيء أو فعل مُختار في قرار عقلاني"
      step05_citation: "«الأَثِير: المفضل على غيره؛ يقال: هو أثيري: أوثره وأفضله» — المعجم الوسيط"
      nuance_differentiation: "يحمل شحنة عاطفية وعلاقة شخصية أكثر تخصيصاً من المطلوب في تعريف المجموعة الذي يشمل الأفعال والأشياء عموماً"

    - lemma: "خِيرة"
      source: step05
      decision: removed
      decision_reason: "نادر الاستعمال في العربية المعاصرة بمعنى «الخيار المُفَضَّل» — يُسر التداول منخفض؛ ويُغني عنه «خيار أول» بشيوع أكبر رغم صحة الاشتقاق من خ-ي-ر"
      step05_citation: "«خِيارُ الشَّيءِ: أفْضَلُه» — المعجم الكبير (بالقياس على بنية فِعْلة)"
      nuance_differentiation: "يدل على الشيء المنتقى دون إفادة الأولوية والديمومة الواردتَين في تعريف المجموعة"

  added_lemmas:
    - lemma: "مُفَضَّل"
      reason: "مصدر: الخطوة ٠٫٥ — اسم مفعول عربي موثَّق بمعنى «favorite/preferred» يطابق دلالة المجموعة"
      via_command: create_entry + add_sense

