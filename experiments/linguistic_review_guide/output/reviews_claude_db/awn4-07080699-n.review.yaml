step05_lemma_generation:
  evidence_candidates:
    - lemma: "طراز"
      source_section: "step5_english_bridge"
      evidence_citation: "«الجيِّدُ من كلِّ شيء، الكلامُ الجيَّد السَّبْكِ طبعاً وقريحةً، النَّمَطُ والشَّكْلُ» — المعجم الكبير؛ + يُترجم «style» في المعجم الموحد للمصطلحات المهنية والتقنية"
      justification: "يُترجم «style» في معاجم عدة، وقد تضمّن المعجم الكبير «النمط أو القاعدة أو الأسلوب» في دلالاته — آلية اشتقاق: معرَّب عن الفارسية (تَرَاز)"
  knowledge_candidates:
    - lemma: "طابَع"
      justification: "مجاز (إزاحة دلالية): من معنى «الختم والطبع» المادي → «السمة المميزة التي يُعرَف بها الكاتب أو الفنان» — الطابع يُضفَر للشخص كما الأسلوب يُعرَّف به. مثال: «طابَعه الأدبي الخاص» يقابل «أسلوبه الأدبي الخاص»"
  generation_notes: "التعريف يُركّز على خاصيتين: (١) طريقة التعبير، (٢) التميّز والخصوصية لشخص/جماعة/حقبة. الكلمات المفتاحية: تعبير، طريقة، مميزة، خاصة. الأدلة المعجمية تُرجّح «طراز» و«أسلوب» كأقرب مقابلَين."


