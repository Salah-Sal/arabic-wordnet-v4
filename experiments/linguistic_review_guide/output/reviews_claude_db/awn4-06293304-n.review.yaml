step0_evidence:
  per_lemma:

    - lemma: "تَوَاصُل لُغَوِيّ"
      confirm:
        - text: "«تبادل المعلومات والتأثير بين شخصين أو أكثر بواسطة اللغة»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      expands:
        - text: "«تبادل المعلومات والتأثير بين شخصين أو أكثر بواسطة اللغة»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: "يُضيف بُعد التفاعل الثنائي (بين شخصين أو أكثر) وبُعد التأثير المتبادل — وهما غير مذكورَيْن صراحةً في تعريف المجموعة الذي يُعرّف نظامَ التواصل لا فعلَه"

    - lemma: "لُغَة"
      confirm:
        - text: "«اللُّغَةُ: أصْواتٌ يُعَبِّرُ بها كلُّ قومٍ عن أغْراضِهِم»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«اللغة: ما يعبر به كل قوم عن أغراضهم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«اللغة: الكلام المصطلح عليه بين كل قبيل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«اللغة: هي ما يعبر بها كل قوم عن أغراضهم»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«(اللُّغَة) أصوات يعبر بها كل قوم عن أغراضهم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«نظام العلامات الصوتية التي تمكن الإنسان من التعبير عن أفكاره، ومن التواصل مع بني جنسه»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«من العلامات الصّوتية الإشارية الخطية والسّيمة الحاملة لمعنى، وهي عموما أداة للتواصل»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«اللّغة: اللفظ الموضوع للمعنى وجمعه اللغات. ومن أنواع اللغة الأصلية والمولّدة والمعرّبة والمعجمة والمختلفة والمعروفة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُوسّع المفهوم بتصنيفات اللغة (أصلية/مولّدة/معرّبة...) — بُعد تقسيمي غير مذكور في تعريف المجموعة"
        - text: "«أداة التواصل بين الناس، أو أداة التواصل بين الإنسان والحاسوب وبين الحواسيب والأنظمة الآلية في ما بينها»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
          addition: "يُوسّع المفهوم ليشمل لغات البرمجة والتواصل الآلي — خارج نطاق تعريف المجموعة المقتصر على الأصوات والرموز الاصطلاحية للتواصل البشري"
      peripheral_observations:
        - "«اللغة في اصطلاح أهل الله: ما يخاطبك به الحق من العبارات» — التوقيف على مهمات التعاريف للمناوي — معنى صوفي روحاني مستقل تماماً عن تعريف المجموعة"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "لِسَان"
      source_section: "step5_english_bridge"
      evidence_citation: "«لغة، لِسَان — وسيلة للتواصل تكمن في القدرة الخاصة بالكائن البشري على استخدام نظام من العلامات الصوتية مستعملاً في ذلك تقنية جسدية معقدة» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "لِسَان في الاستعمال القرآني والكلاسيكي يدل على لغة قوم بعينهم (مجاز بالمجاورة من عضو النطق إلى منتَجه) — «وَمَا أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِ» (إبراهيم:٤) — فهو مرادف تراثي لنظام التواصل الصوتي المشترك بين جماعة"
  knowledge_candidates:
    - lemma: "كَلَام"
      justification: "اشتقاق من ك-ل-م على وزن فَعَال — يدل أصلاً على التعبير اللغوي البشري والتواصل بالقول؛ والمناظرة مع التعريف: «نظام للتواصل باستخدام الأصوات» تُحيل على «الكلام» بوصفه الفعل الصوتي الاصطلاحي البشري. التوليد باشتقاق تراثي"
  generation_notes: "التعريف يصف نظاماً منهجياً للتواصل الصوتي والرمزي — الجذور الدلالية المركزية: ل-غ-و (اللغة/النظام) وك-ل-م (الكلام/الأداء) ول-س-ن (اللسان/الأداة والمنتَج)"


step1_lemma_validation:
  per_lemma:

    - lemma: "تَوَاصُل لُغَوِيّ"
      decision: confirmed
      decision_reason: "مركب وصفي مستقر مُدرَج في مسرد الإعلام والتواصل (ALECSO) بوصفه المقابل المعتمد لـ linguistic communication — أدلة تؤكد مع توسيع وظيفي؛ اختبار التثبيت المعجمي: مسجّل في مصدر اصطلاحي موثوق؛ اختبار السكّ: «لغوي» جزء جوهري لا يُعوَّض بصفة أخرى دون تغيير المفهوم؛ بوابة الجودة: مطّرد في الأدبيات الأكاديمية العربية، كل مكوّناته عربية أصيلة، يتناظر بدقة مع المدلول العلمي"
      evidence_assessment:
        case: expands
      mwe_check:
        is_mwe: true
        type: وصفي
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "يُركّز على فعل التواصل وعمليته الثنائية (التبادل بين طرفَيْن أو أكثر)، بينما «لُغَة» تدل على النظام المجرد نفسه — الفارق هو الفعل مقابل الأداة، أو parole مقابل langue بالمصطلح السوسيري"
      example: "التواصلُ اللغويُّ بين أبناء الثقافات المختلفة يستلزم قدراً من الإلمام بأنظمة الرموز الاصطلاحية المشتركة."

    - lemma: "لُغَة"
      decision: confirmed
      decision_reason: "أدلة كلاسيكية وحديثة متعددة تؤكد المعنى بلا تناقض؛ المصطلح الأصيل والأشيع في العربية للمفهوم؛ بوابة الجودة: شائعة في الفصحى بلا منازع، يسيرة النطق، تُناظر مفهوم النظام اللغوي بدقة، تراثية أصيلة، تتفرع منها «لُغَوِيّ» و«لُغَوِيَّة»؛ الملاءمة الصرفية: وزن فُعَة مناسب لاسم الجنس الدال على كيان مجرد"
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: "تدل على النظام المنهجي للتواصل بوصفه بنيةً مجردة مشتركة بين أبناء مجتمع لغوي (langue)، بعكس «تواصل لغوي» الدالّ على العملية الفعلية للتبادل اللغوي بين أفراد"
      example: "تُعدّ اللغةُ العربية نظاماً صوتياً ورمزياً ثرياً طوّره أهلها عبر قرون من الاستعمال والتدوين."

    - lemma: "لِسَان"
      source: step05
      decision: removed
      decision_reason: "ثلاثة أسباب للرفض: (أ) التعددية الدلالية الحادة: الاستعمال الحديث يُغلّب دلالة العضو الجسدي على دلالة نظام التواصل، مما يُفضي إلى لبس يخلو منه «لُغَة»؛ (ب) المجموعة تمتلك «لُغَة» وهي أدق في الدلالة على النظام اللغوي المجرد وأكثر شيوعاً في المصطلح الحديث؛ (ج) اختبار الإبدال: «يدرس الطالب اللسانَ الإنجليزي» يبدو متكلَّفاً في العربية المعاصرة مقارنةً بـ«يدرس اللغةَ الإنجليزية»"
      step05_citation: "«لغة، لِسَان — وسيلة للتواصل تكمن في القدرة الخاصة بالكائن البشري على استخدام نظام من العلامات الصوتية» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      substitution_test:
        result: fail
        failure_sentences:
          - original: "يدرس الطالب اللغةَ الإنجليزية"
            substituted: "يدرس الطالب اللسانَ الإنجليزي"
            preserved_meaning: false
            why_failed: "الإبدال صحيح كلاسيكياً لكن مرفوض في الاستعمال المعاصر المعياري — يُحدث أثراً أسلوبياً مقصوداً (تفخيم/شعرية) مما يخرجه عن التداول الاصطلاحي العادي"
      nuance_differentiation: "لِسَان يحمل معنى «نظام لغوي لجماعة بشرية» في الاستعمال الكلاسيكي والقرآني، غير أن دلالته الجسدية (عضو النطق) تطغى في المعجم الحديث مما يُسبّب التباساً لا يخلو منه «لُغَة»"

    - lemma: "كَلَام"
      source: step05
      decision: removed
      decision_reason: "كَلَام في المصطلح اللساني الحديث يقابل parole عند دوسوسير (الأداء الكلامي الفردي)، لا langue (النظام المشترك)؛ والمجموعة تُعرّف «النظام المنهجي» لا «فعل الكلام» — مما يجعل كلام أضيق دلالةً وأخصّ مفهوماً من المقصود؛ فضلاً عن أن «الكلام» محمّل في التراث النحوي بمعنى «الجملة المفيدة» وفي الكلام المصطلح بمعنى علم الكلام (الثيولوجيا)"
      step05_citation: "«الكلام: إظهار ما في الباطن على الظاهر لمن يشهد ذلك بنحو من أنحاء الإظهار. وفي اصطلاح النحاة: المعنى المركب الذي فيه الإسناد التام» — التوقيف على مهمات التعاريف للمناوي"
      substitution_test:
        result: fail
        failure_sentences:
          - original: "تُعدّ اللغةُ العربية من أغنى لغات العالم"
            substituted: "يُعدّ الكلامُ العربي من أغنى لغات العالم"
            preserved_meaning: false
            why_failed: "الإبدال يُغيّر المعنى من النظام اللغوي المجرد إلى الأداء الكلامي الفردي"
      nuance_differentiation: "كَلَام يدل على فعل القول وما يُقال في مناسبة بعينها (الأداء)، أما «لُغَة» فتدل على النظام الكامن الذي يُتيح ذلك الأداء — فكل كلام يستخدم لُغَةً، لكن اللغة ليست هي الكلام"


step3_definition:
  definition_review_flag: false
  current_definition: "نظام منهجيّ للتواصل باستخدام الأصوات أو الرموز الاصطلاحيّة"
  assessment:
    decision: retain
    reason: "التعريف الحالي أشمل من التعريف الكلاسيكي الذي اقتصر على «أصواتٌ يُعَبِّرُ بها كلُّ قومٍ عن أغراضهم» — فهو يتضمن الرموز الاصطلاحية إلى جانب الأصوات مما يُغطي الكتابة ولغات الإشارة؛ ويطابق المستوى العلمي لتعريف Princeton WordNet؛ والمصادر الحديثة (مسرد ALECSO، معجم اللسانيات) تُقرّ النظامية والوظيفة التواصلية"


