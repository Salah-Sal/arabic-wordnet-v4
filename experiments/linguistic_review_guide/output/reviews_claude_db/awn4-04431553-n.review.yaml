step0_evidence:
  per_lemma:
    - lemma: شيء
      confirm:
        - text: "«واحد الأشياء، اسم للآدميين وغيرهم من الخلق»"
          source: كتاب العين (الخليل بن أحمد، ت. 786م)
        - text: "«كلُّ موجود، حِسّيٌّ أو معنويٌّ»"
          source: المعجم الكبير
        - text: "«(الشَّيْء) الْمَوْجُود وَمَا يتَصَوَّر ويخبر عَنهُ»"
          source: المعجم الوسيط
        - text: "«الشيء في اللغة ما يُعلم ويُخبر عنه»"
          source: المغرب في ترتيب المعرب للمطرزي (ت. 1213م)
        - text: "«في اللغة هو ما يصلح أن يعلم ويخبر عنه، عند سيبويه... في الاصطلاح هو الموجود الثابت المتحقق في الخارج»"
          source: كتاب التعريفات للشريف الجرجاني (ت. 1413م)
        - text: "«الشيء في اللغة عبارة عن كل موجود إما حسًّا كالأجسام أو حكمًا كالأقوال»"
          source: المصباح المنير للفيومي (ت. 1368م)
        - text: "«الشيء: في اللغة ما يصح أن يعلم ويخبر عنه... في الاصطلاح هو الموجود الثابت المتحقق في الخارج»"
          source: التعريفات الفقهية للبركتي (ت. 1975م)
        - text: "«كيان مادي أو مفاهيمي قد يكون له سمة واحدة أو أكثر»"
          source: معجم البيانات والذكاء الاصطناعي (2024)
      expands:
        - text: "«الشيء في اللغة عبارة عن كل موجود إما حسًّا كالأجسام أو حكمًا كالأقوال نحو قلتُ شيئاً»"
          source: المصباح المنير للفيومي
          addition: "التمييز الصريح بين الموجود الحسي والحكمي — بُعد دلالي غائب عن تعريف المجموعة الذي يقتصر على الكيان"
        - text: "«الشَّيْءُ ما يجوز أَن يخبر عَنهُ وتَصِح الدّلَالَة عَلَيْهِ»"
          source: معجم مقاليد العلوم للسيوطي (ت. 1505م)
          addition: "إضافة شرط صحة الدلالة — يُقيّد الشيء بما يصح أن يُشار إليه في الخطاب المنطقي، وهو أوسع من مجرد «كيان غير محدد»"
        - text: "«الشيء عبارة عن الوجود وهو اسم لجميع المكونات عرضًا كان أو جوهرًا»"
          source: كتاب التعريفات للشريف الجرجاني
          addition: "الشمول الأونطولوجي للعرض والجوهر معاً — أوسع من تعريف المجموعة المقتصر على الكيان المسمّى"
      peripheral_observations:
        - "المعنى الرياضي/الجبري المستقل: «الشيء في كلام أهل الجبر هو الجذر المجهول» — معجم مقاليد العلوم للسيوطي؛ وكذلك المصباح المنير: «وفي الحساب عدد مجهول يصير في أثناء العمل جذراً»"
        - "المعنى الاشتقاقي: الشيء أصله مصدر شاء — يُوصف به تعالى فمعناه شاء، وغيره فمعناه المشيء — المفردات في غريب القرآن للراغب الأصفهاني"
        - "جدل كلامي مستقل حول صدق «الشيء» على المعدوم: الأشاعرة (لا) vs. المعتزلة (نعم) — كشاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777م)"


