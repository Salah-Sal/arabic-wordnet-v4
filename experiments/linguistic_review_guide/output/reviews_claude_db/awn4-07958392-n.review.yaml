      justification: "اسم جمع كلاسيكي يُرادف «الناس» في الاستعمال التراثي — اشتقاق من ج-ذ-ر خ-ل-ق؛ تُصرّح به المعاجم الكبرى صراحةً كمعنى لـ«الخلق»"
  knowledge_candidates:
    - lemma: إنس
      justification: "آلية الاشتقاق من ج-ذ-ر أ-ن-س؛ المعجم الوسيط (OCR): «الجماعة الكثيرة من الناس خلاف الجن» — يدل على تجمع بشري بطبيعته؛ يُمثّل مفهوم مجموعة البشر بوصفهم «مجتمعين مألوفين» في مقابل عالم الجن"
  generation_notes: "التعريف يصف تجمعاً بشرياً شاملاً للجنسين وسائر الأعمار؛ المصطلحات الجامعة في التراث العربي تدور حول: بني آدم، الخلق، الأنام، الإنس — كلها مرشحة محتملة"


step1_lemma_validation:
  per_lemma:

    - lemma: أشخاص
      decision: confirmed
      decision_reason: "أدلة مؤكدة بالاستخدام — جمع «شخص» بمعنى «فرد بشري» مستقر في الفصيح المعاصر رغم غياب تعريف معجمي صريح"
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز الفردية والعدِّية: كل إنسان كيان مستقل مُحصى؛ يُستعمل في السياقات الرسمية والقانونية والإحصائية حيث يُعدّ الأفراد فرادى؛ الأكثر توافقاً مع «عدد من الناس» في التداول الرسمي والإداري"
      example: "أكد المتحدث باسم الجهة الأمنية أن أربعة أشخاص اعتُقلوا في إطار التحقيق في الحادثة."

    - lemma: بشر
      decision: confirmed
      decision_reason: "أدلة مؤكدة وافرة من مصادر معجمية متعددة كلاسيكية وحديثة — المعنى ثابت ومتفق عليه"
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز الطبيعة الجسدية-النوعية المشتركة للإنسانية (من «بَشَرَة» = ظاهر الجلد — تسمية بالمظهر الخارجي)؛ يُستعمل في السياقات الفلسفية والدينية والعلمية للدلالة على الجنس البشري بوصفه فصيلة؛ اسم جنس يُطلق على المفرد والجمع — الأعمّ دلالةً بين لمّات المجموعة"
      example: "كانت قاعة المؤتمر تعجّ بالبشر الذين جاؤوا من أصقاع شتى للاستماع إلى الخطاب."

    - lemma: ناس
      decision: confirmed
      decision_reason: "أدلة مؤكدة صريحة من المعجم الوسيط مع شاهد قرآني — المعنى الجمعي واضح وراسخ"
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: "يُبرز البُعد الاجتماعي والتقابلي (من أَنِسَ = اجتمع وألف)؛ جمع سماعي مفرده «إنسان» من جذر مغاير (ظاهرة السُّبَاعِيَّة)؛ يحمل دفء الحضور الاجتماعي المألوف؛ الأكثر شيوعاً في التداول اليومي والفصيح المعاصر"
      example: "تجمّع ناسٌ من مختلف أحياء العاصمة أمام مقر البلدية للتعبير عن مطالبهم."

    - lemma: خلق
      source: step05
      decision: removed
      decision_reason: "دلالة أعمّ من المطلوب — «الخلق» يشمل جميع المخلوقات لا البشر وحدهم؛ يُشير إلى الخليقة جمعاء لا إلى مجموعة بشرية محددة؛ فشل اختبار الاستبدال: «جاء خلقٌ كثير إلى الحفل» — لا يُحدّد الطابع البشري تحديداً كافياً"
      step05_citation: "«الخَلْقُ: المخلوقُ الناسُ» — المعجم الكبير"
      substitution_test:
        result: fail

    - lemma: إنس
      source: step05
      decision: removed
      decision_reason: "لفظ تراثي لا يُستعمل مستقلاً في الفصيح المعاصر؛ دلالته الأساسية اقترانية-تقابلية (البشر في مقابل الجن) لا دلالة على مجموعة بشرية في ذاتها؛ إدراجه سيُثير تساؤلاً عن غياب الجن؛ فشل بوابة الاطّراد والتداول"
      step05_citation: "«الإنس: البشر خلاف الجن» — المعجم الكبير; «الجماعة الكثيرة من الناس خلاف الجن» — المعجم الوسيط"
      substitution_test:
        result: fail


