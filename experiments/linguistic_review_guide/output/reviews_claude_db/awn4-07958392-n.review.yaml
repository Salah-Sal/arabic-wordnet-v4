step0_evidence:
  per_lemma:

    - lemma: أشخاص
      confirm:
        - text: "«ثلاثة أشخاص: امرأتان وفتاة [فصيحة]»"
          source: معجم الصواب اللغوي لأحمد مختار عمر
      peripheral_observations:
        - "الجذر ش-خ-ص يدل على الظهور والبروز للعيان؛ «شَخَص» = ظهر جسمه من بُعد؛ «أشخاص» في كثير من المعاجم الكلاسيكية تعني الأجساد المرئية أو الأشباح لا الأفراد البشريين بمفهومه الإنسانيّ المجرد — الانتقال إلى معنى «أفراد بشريون» تطور دلالي حديث"

    - lemma: بشر
      confirm:
        - text: "«الإنسان, للذَّكَر والأُنثى, وللواحد والمثنى والجمع»"
          source: المعجم الكبير
        - text: "«الإنسان (الواحد والجمع والمذكر والمؤنث فيه سواء)»"
          source: المعجم الوسيط
        - text: "«البَشَرُ، محرَّكةً: الإِنْسانُ ذَكَراً أو أُنْثَى، واحداً أو جَمْعاً، وقد يُثَنَّى، ويُجْمَعُ أبْشاراً»"
          source: القاموس المحيط للفيروزآبادي
        - text: "«البَشَرُ الإِنسانُ والواحدُ والجميعُ والمذكَّرُ والمؤنَّثُ في ذلك سواء وقد يُثَنَّى»"
          source: المحكم والمحيط الأعظم لابن سيده الأندلسي
        - text: "«هم الإنس، سُمُّوا بشراً لظهورهم بخلاف الجن»"
          source: المجموع المغيث في غريبي القرآن والحديث لأبي موسى المديني
        - text: "«البَشَر يَقَع على الواحِد والجَمْع والمَرْأة أيضاً، وهم الإِنْسُ، سُمُّوا بَشَرًا لظُهُورهم»"
          source: المجموع المغيث في غريبي القرآن والحديث لأبي موسى المديني
      expands:
        - text: "«البَشَر: الإنسان الواحد رجلا كان أو امرأة لا يثنى ولا يجمع»"
          source: كتاب العين
          addition: "بُعد صرفي مغاير — «بشر» في كتاب العين اسم جنس لا يُثنّى ولا يُجمع مورفولوجياً، يستعمل للفرد والجماعة؛ بينما يُوظّفه السياق في المجموعة الترادفية بمعناه الجمعيّ الدلالي فحسب"

    - lemma: ناس
      confirm:
        - text: "«النَّاسُ: اسم للجمع من بنى آدم, واحده: إنْسَانٌ من غير لفظه»"
          source: المعجم الوسيط
        - text: "«النَّاس: اسم للجمع من بني آدم واحده إنسان من غير لفظه»"
          source: المعجم الوسيط لمجموعة من المؤلفين
      expands:
        - text: "«وقد يُراد به الفُضَلاء دون غيرهم, مراعاة لمعنى الإنسانية»"
          source: المعجم الوسيط
          addition: "دلالة تمييزية نخبوية — «الناس» يُطلق أحياناً على ذوي العقل والفضيلة تحديداً لا على عامة البشر؛ بُعد أسلوبي غائب عن تعريف المجموعة"
      peripheral_observations:
        - "«ناسَ» فعل ثلاثي (ج-ذ-ر نوس) بمعنى تحرّك وتذبذب؛ مدخل مستقل تماماً — لا صلة بالمعنى المقصود (المعجم الوسيط)"
        - "«ناسُ» اسم قرية كبيرة من نواحي أبيورد بخراسان؛ مدخل جغرافي مستقل (معجم البلدان لياقوت الحموي)"
        - "«ناس» علم شخصي مستعار من العبرية بمعنى علم ورواية ولواء (موسوعة السلطان قابوس لأسماء العرب)"


step05_lemma_generation:
