step0_evidence:
  per_lemma:

    - lemma: "إشهار"
      confirm:
        - text: "«إشهار الخبر [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«إعلان معلومات عن منتوج ما بهدف ترويجه» (translation_en: publicity)"
          source: "مسرد الإعلام والتواصل — ArabTerm"
      contradicts:
        - text: "«الإعلان عن منتوج ما والترويج له» (translation_en: advertising)"
          source: "مسرد الإعلام والتواصل — ArabTerm"
          conflict: "الدلالة تجارية ترويجية خاصة بمنتوج، بينما تعريف المجموعة يشمل توصيل أي معلومة للجمهور بصرف النظر عن الغرض التجاري"
        - text: "«مثال: إشهار الخَبَر — الرأي: مرفوضة — السبب: لأنها مصدر للفعل «أشهر»، وهذا الفعل لم يرد في المعاجم بمعنى «أعلن»، وإنما الوارد «شَهَرَ» الثلاثي»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "المعجم يُسجّل اعتراضاً على استعمال «إشهار» مصدراً للإعلان العام، وإن كان يقبل «إشهار الخبر» صحيحة في الحكم النهائي"
      expands:
        - text: "«إعلان معلومات عن منتوج ما بهدف ترويجه» (publicity)"
          source: "مسرد الإعلام والتواصل — ArabTerm"
          addition: "بُعد الترويج التجاري المقصود لمنتوج بعينه — غير حاضر في تعريف المجموعة الذي يصف التوصيل العام للمعلومات"

    - lemma: "نشر"
      confirm:
        - text: "«طبع الكتب والصحف وبيعها»"
          source: "المعجم الوسيط"
        - text: "«عملية تعميم خبر أو معلومة على الناس»"
          source: "مسرد الإعلام والتواصل — ArabTerm"
        - text: "«إصدار مادة مطبوعة موضوعة للبيع أو الترويج» (translation_en: publication)"
          source: "مسرد الإعلام والتواصل — ArabTerm"
        - text: "«نشرت الخبر أنشره وأنشره إذا أذعته»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«نشر الخبر: أذاعه. وانتشر الخبر في الناس»"
          source: "أساس البلاغة للزمخشري"
        - text: "«نَشَرَ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَتْحِ شَيْءٍ وَتَشَعُّبِهِ ... نَشَرْتُ الخبرَ: إذا أذعته»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«كلّ مخطوط يخرج إلى الوجود في شكل كتاب بفضل صناعة الطباعة» (translation_en: publishing)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "تخصيص النشر بالكتاب الورقي المطبوع — أضيق من الدلالة العامة للمجموعة التي تشمل كل أشكال توصيل المعلومات للجمهور"
      peripheral_observations:
        - "الجذر ن-ش-ر في المعاجم الكلاسيكية يحمل معاني متعددة مستقلة تماماً عن دلالة المجموعة: الريح الطيّبة، وإحياء الموتى (النشور)، ونحت الخشب بالمنشار، وبدء نبات الكلأ — ذكرها القاموس المحيط والمحكم والصحاح"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "إذاعة"
      source_section: step4_fts_keyword
      evidence_citation: "«(1) إعلام؛ إذاعة؛ إعلان [الحقائق إلخ] (2) النَّشْر: نشر الكتب أو الصحف أو المجلّات إلخ» — المورد الحديث (2008)"
      justification: "أصلها الكلاسيكي «أذاع الخبر» = نشره وأفشاه بين الناس (مجاز من الفتح والانتشار)، وهو يطابق دلالة توصيل المعلومات للجمهور في التعريف؛ آلية التوليد: إحياء دلالة الجذر ذ-ي-ع"
    - lemma: "إعلان"
      source_section: step4_fts_keyword
      evidence_citation: "«الإعلان: إظهار الشيء بالنشر عنه في الصحف ونحوها (محدثة)» — المعجم الوسيط / «announcement» — مسرد الإعلام — ArabTerm"
      justification: "مصدر أعلن (اشتقاق من ع-ل-ن)، يدل على إظهار الشيء وإبرازه للناس — يطابق «جعل المعلومات معروفة بشكل عام»"
  knowledge_candidates:
    - lemma: "إعلام"
      justification: "مصدر أعلم (اشتقاق إفعال من ع-ل-م)، يدل على إيصال المعلومة وجعلها معلومةً لدى الآخرين — الاشتقاق الصرفي يطابق «جعل المعلومات معروفة بشكل عام» بصورة مباشرة"
  generation_notes: "التعريف يصف فعل التواصل العام مع الجمهور؛ الجذور الدلالية الواعدة: ع-ل-ن (الإظهار)، ع-ل-م (الإبلاغ)، ذ-ي-ع (الانتشار)"


step1_lemma_validation:
  per_lemma:

    - lemma: "إشهار"
      decision: confirmed
      decision_reason: "مقبول رغم التحفظ على التخصيص التجاري؛ الأصل الاشتقاقي (ش-ه-ر = جعل الشيء مشهوراً) يدعم الدلالة العامة، ومعجم الصواب يُقرّ «إشهار الخبر» صحيحة، وArabTerm يُدرجه في مجال الإعلام والتواصل"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يتميز عن «نشر» بالتركيز على الإبراز والجعل مشهوراً في نظر الجمهور (publicity)؛ إشهار = إعلان رسمي ذو وقع إعلاني يُكسب الشيء شهرة، بينما نشر = توزيع وتعميم (dissemination). الفرق كالفرق بين الظهور العام والتوزيع؛ وإشهار يُوظَّف كثيراً في السياقات الرسمية والقانونية (إشهار إفلاس، إشهار جمعية)"
      example: "أصدرت وزارة الداخلية قرار إشهار الجمعية الخيرية رسمياً بعد استيفاء جميع الشروط القانونية المطلوبة"

    - lemma: "نشر"
      decision: confirmed
      decision_reason: "أدلة مؤكدة من مصادر كلاسيكية وحديثة متعددة — مطابق تاماً لتعريف المجموعة في دلالة تعميم المعلومات وإذاعتها للجمهور"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "يتميز عن «إشهار» بأن محوره التوزيع والانتشار (spreading/publication) لا الإبراز والشهرة؛ نشر الخبر = إذاعته وتعميمه بين الناس بصرف النظر عن مدى شهرته — وقد يكون لأغراض إعلامية أو علمية أو أدبية دون أن يحمل طابعاً إعلانياً رسمياً"
      example: "نشرت وكالة الأنباء بياناً رسمياً حول مستجدات الوضع السياسي في المنطقة"

    - lemma: "إذاعة"
      source: step05
      decision: removed
      decision_reason: "تخصّصت في الفصحى المعاصرة للبث الإذاعي اللاسلكي (radio broadcasting) — أضيق بكثير من دلالة المجموعة، واستعمالها بالمعنى العام يُوهم بالراديو تحديداً لا بتوصيل المعلومات عموماً"
      step05_citation: "«(1) إعلام؛ إذاعة؛ إعلان [الحقائق إلخ]» — المورد الحديث (2008)"
      substitution_test:
        result: fail
      nuance_differentiation: "إذاعة = radio broadcast في الاستعمال المعاصر الغالب؛ فقدت دلالتها العامة في توصيل المعلومات وضاقت في مجال البث الإلكتروني"

    - lemma: "إعلان"
      source: step05
      decision: removed
      decision_reason: "مشترك لفظي بين advertisement وannouncement؛ الاستعمال الغالب في العربية المعاصرة للإعلان التجاري مما يُبعده عن دلالة التوصيل العام — ويتداخل مع إشهار جزئياً دون أن يُضيف فرقاً دلالياً مبرراً"
      step05_citation: "«الإعلان: إظهار الشيء بالنشر عنه في الصحف ونحوها» — المعجم الوسيط"
      substitution_test:
        result: fail
      nuance_differentiation: "الاستعمال الغالب في الإعلان التجاري (advertisement) يُبعده عن دلالة التوصيل العام للمعلومات التي يصفها تعريف المجموعة"

    - lemma: "إعلام"
      source: step05
      decision: removed
      decision_reason: "تخصّص في الاستعمال المعاصر كمصطلح مؤسسي (وسائل الإعلام، إعلام رقمي) لا كفعل توصيل؛ يوحي استعماله منفرداً بالمؤسسة الإعلامية لا بفعل النشر — وفشل اختبار الإبدال في سياقات publication الجزئية"
      step05_citation: "مصدر أعلم — اشتقاق إفعال من ع-ل-م"
      substitution_test:
        result: fail
      nuance_differentiation: "الإعلام في الفصحى المعاصرة = media/press كمؤسسة لا كفعل توصيل فردي؛ قيد انزياح دلالي مؤسسي"


