step0_evidence:
  per_lemma:
    - lemma: "إِدْرَاك"
      confirm:
        - text: "«الإدراكُ: حصولُ صورةِ الشيءِ في العقلِ — وفي الفلسفةِ: حصولُ الصورةِ عندَ النفسِ الناطقةِ»"
          source: "المعجم الكبير"
        - text: "«cognition: الإدراكُ — المعرفةُ في أوسعِ معانيها»"
          source: "المعجم الكبير"
        - text: "«إدراكٌ: cognition»"
          source: "مسرد التربية — ArabTerm"
        - text: "«الإدراكُ: حصولُ الصورةِ عندَ النفسِ الناطقةِ»"
          source: "التعريفات — الجرجاني"
      contradicts:
        - text: "«أَدْرَكَ الشيءَ: بَلَغَ الوَطَرَ منه، وأَدْرَكَه: لَحِقَهُ ورَجَعَ إليه»"
          source: "شرح الكافية الشافية — ابن مالك"
          conflict: "يُثبت إدراك بمعنى البلوغ الجسدي والوصول الحسّي — لا المحصِّلة العقلية الذهنية"
        - text: "«أَدرَكَ الثمرُ: نَضِجَ وبَلَغَ أوانَه»"
          source: "المعجم الوسيط"
          conflict: "يُثبت إدراك بمعنى بلوغ الأجل وإتمام النمو — معنى فيزيائي لا معرفي"
      expands:
        - text: "«الإدراكُ قسمانِ: إدراكٌ بالحواسِّ الظاهرةِ، وإدراكٌ بالحواسِّ الباطنةِ — والعقليُّ منه إمّا تصوُّرٌ وإمّا تصديقٌ»"
          source: "دستور العلماء — أحمدنغري"
          addition: "يُقدّم تصنيفاً رباعياً للإدراك (حسّي/عقلي × تصوّر/تصديق) أدقّ مما في تعريف المجموعة"
        - text: "«الإدراكُ هو الإحاطةُ بالشيءِ من جميعِ جهاتِه بلوغاً لنهايتِه»"
          source: "التعريفات — الجرجاني"
          addition: "يُضيف اشتراط الإحاطة الكاملة الذي لا يُشترط في كل معرفة — يوسّع الدلالة"

    - lemma: "مَعْرِفَة"
      confirm:
        - text: "«المعرفةُ: إدراكُ صُوَرِ الموجوداتِ»"
          source: "المزهر في علوم اللغة والأدب — السيوطي"
        - text: "«المعرفةُ: إدراكُ الشيءِ بوجهٍ ما، وهي أخصُّ من العلمِ»"
          source: "التعريفات — الجرجاني"
        - text: "«معرفة: cognition»"
          source: "معجم المصطلحات الطبية — ArabTerm"
      contradicts:
        - text: "«مَعْرَفَةٌ: موضعُ العُرفِ من الطائرِ والفَرَسِ، وهو الريشُ والشَّعرُ النابتُ على الرقبةِ»"
          source: "المعجم الوسيط"
          conflict: "يُثبت مَعْرَفة (بفتح الراء) بمعنى تشريحي فيزيائي — مغاير بالكلية للمعنى المعرفي مَعْرِفَة (بكسر الراء)"
      expands:
        - text: "«المعرفةُ تختصُّ بإدراكِ الجزئيّاتِ والأعيانِ، والعلمُ يختصُّ بإدراكِ الكُلِّيّاتِ والمعاني»"
          source: "التعريفات — الجرجاني"
          addition: "يُميّز المعرفة عن العلم بتقييدها بالجزئيات — وهو فرق لا يُصرَّح به في تعريف المجموعة"
        - text: "«المعرفةُ في النحوِ: الاسمُ المُعرَّفُ بأل التعريفِ أو الإضافةِ أو غيرهما»"
          source: "المعجم الوسيط"
          addition: "يُضيف بُعداً نحوياً مستقلاً تماماً (الاسم المعرفة مقابل النكرة)"
      peripheral_observations:
        - "مادة ع-ر-ف تحمل في أصلها دلالة الألفة والتكرار (عَرَفَ = ألِفَ وتعوَّد) — مما يُضمّن مَعْرِفَة ظلّ السابقية والتعارف، وهو ما يُفسّر اختصاصها بالجزئيات المألوفة دون الكليات"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تَفْكِير"
      source_section: "step5_english_bridge"
      evidence_citation: "«noesis: تفكير» — معجم المصطلحات الطبية"
      justification: "يُعادل noesis في مسرد المصطلحات الطبية؛ آلية التوليد: اشتقاق على وزن تَفْعِيل من جذر ف-ك-ر"
    - lemma: "وَعْي"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الوَعْيُ: الفهمُ وسلامةُ الإدراكِ في علمِ النفسِ» — المعجم الوسيط"
      justification: "ورد في المعجم الوسيط بالتعريف النفسي المرتبط بمجال المجموعة"
  knowledge_candidates:
    - lemma: "تَعَقُّل"
      justification: "اشتقاق على وزن تَفَعُّل من جذر ع-ق-ل — يدلّ على اكتساب العقل والفهم؛ مستعمل في الفلسفة الإسلامية كمصطلح لإعمال العقل"
    - lemma: "عِلْم"
      justification: "اشتقاق أصيل من جذر ع-ل-م — يمثل المحصِّلة المعرفية الكليّة في التراث العربي؛ إحياء لفظ تراثي (إيثار التراثي)"
  generation_notes: "التعريف يقوم على ثلاثة أفعال معرفية (إحساس، تعلّم، استدلال) مما يُرجّح أن المستهدف مُحصِّلة (result/product) لا عملية (process) — قُيِّدَ التوليد بهذا الاشتراط"

step1_lemma_validation:
  per_lemma:
    - lemma: "إِدْرَاك"
      decision: confirmed
      decision_reason: "مصطلح فلسفي وتربوي راسخ موثَّق في الجرجاني وأحمدنغري وArabTerm بمعنى cognition مباشرةً؛ الاطّراد عال والاشتقاقية تامة (يُدرِك، مُدرَك، مُدرِك)"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "الإدراك أعمُّ من المعرفة — يشمل الحسّي والعقلي ولا يختص بالجزئيات؛ يتضمن دلالة الإحاطة الكاملة ببلوغ نهاية الشيء، مما يجعله أقوى في الدلالة على الفهم العميق"
      example: "تُسهم المناهجُ التفاعليّةُ في تعزيز إدراكِ الطلابِ للمفاهيمِ العلميّةِ المجرَّدةِ"

    - lemma: "مَعْرِفَة"
      decision: confirmed
      decision_reason: "موثَّق في التعريفات والمزهر وArabTerm بمعنى cognition مباشرةً؛ الشكل المعجمي مَعْرِفَة (بكسر الراء) مغاير تماماً لـ مَعْرَفة (بفتح الراء) ذات المعنى التشريحي الذي رصده المعجم الوسيط"
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "المعرفة أخصُّ من الإدراك — تختص بالجزئيات والأعيان المألوفة، وتحمل ظلّ السابقية والتعرّف (من جذر ع-ر-ف الدال على الألفة)؛ في حين الإدراك أعمّ ويشمل الكليات والتجريد"
      example: "تُعدُّ المعرفةُ البشريّةُ نتاجاً تراكميّاً للتجربةِ والتأمُّلِ والاستدلالِ المنطقيِّ"

    - lemma: "تَفْكِير"
      source: step05
      decision: removed
      decision_reason: "التفكير عملية معرفية (cognitive process) لا محصِّلة؛ المجموعة تمثّل الناتج (result) لا الفعل — كما أن noesis في الفلسفة اليونانية تعني الإدراك العقلي المباشر (direct intellectual apprehension) لا مجرّد عمليّة التفكير"
      step05_citation: "«noesis: تفكير» — معجم المصطلحات الطبية"

    - lemma: "وَعْي"
      source: step05
      decision: removed
      decision_reason: "الوعي يُعبّر عن الانتباه والإدراك الآني (awareness/consciousness) لا عن المحصِّلة الكليّة المتراكمة من الإحساس والتعلّم والاستدلال — نطاقه الدلالي أضيق بكثير من المجموعة"
      step05_citation: "«الوَعْيُ: الفهمُ وسلامةُ الإدراكِ في علمِ النفسِ» — المعجم الوسيط"

    - lemma: "تَعَقُّل"
      source: step05
      decision: removed
      decision_reason: "التعقّل عملية إعمال العقل (process of reasoning/intellection) لا محصِّلة معرفية؛ فضلاً عن أنه لا يشمل المكوّن الحسّي (الإحساس) الداخل في تعريف المجموعة"
      step05_citation: "مرشح من المعرفة اللغوية — اشتقاق على تَفَعُّل من ع-ق-ل"

    - lemma: "عِلْم"
      source: step05
      decision: removed
      decision_reason: "العلم يختص بإدراك الكليات والمعاني وهو أضيق من المجموعة؛ إدراجه مع إدراك ومعرفة يُخلط بين مراتب معرفية مميَّزة في التراث الفلسفي العربي — كما ورد في الجرجاني صراحةً"
      step05_citation: "«العلمُ: إدراكُ الشيءِ بحقيقتِه... ويختصُّ بإدراكِ الكُلِّيِّ والمُركَّبِ» — المعجم الوسيط"

  synset_flags:
    definition_review_needed: true

