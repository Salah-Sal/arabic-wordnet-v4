        - text: "«العَدَدُ الذي إذا ضُرِبَ في نَفْسِه مَرّاتٍ عَدَدُها «ن» يَنْتُج العددُ الأصْليُّ، وعلى ذلك يكون الجَذْرُ التّربيعِيُّ للعدد (١٠٠) هو (±١٠)»"
          source: "المعجم الكبير"
