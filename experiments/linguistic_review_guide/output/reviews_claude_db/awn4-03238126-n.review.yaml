    - lemma: "سهم"
      source_section: "step4_fts_keyword"
      evidence_citation: "«القُرعة: السهمُ والنصيبُ وإلقاءُ القرعة حيلةٌ يتعيَّن بها سهمُ الإنسان أي نصيبُه» — التعريفات الفقهية للبركتي"
      justification: "يُعادل البركتي القُرعةَ بالسهم؛ والسهم في الموروث العربي هو الأداة المادية (العصا المُدوَّرة الخشبية) التي تُرمى لتقرير الأنصباء — آلية المجاز: إطلاق اسم الأداة التقليدية على المفهوم العام"
  knowledge_candidates:
    - lemma: "قِدح"
      justification: "اشتقاق من ق-د-ح — هو السهم الخشبي الذي كان يُستخدم في ضرب القرعة وفي لعبة الميسر؛ الأصل مادي ملموس يُسحب بالحظ مطابقاً للمفهوم. آلية التوليد: إحياء لفظ كلاسيكي (الممات) يصف بدقة الشيء المادي المسحوب"
  generation_notes: "المفهوم محدود ودقيق (الشيء المادي المسحوب بالحظ)؛ المعجم العربي يُعبّر عنه إما بأداته التقليدية (سهم/قِدح) أو بنتيجته (نصيب)؛ لا يوجد مصطلح تقني حديث بديل"


