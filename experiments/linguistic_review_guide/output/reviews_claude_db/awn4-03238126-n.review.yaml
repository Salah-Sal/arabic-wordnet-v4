step0_evidence:
  per_lemma:

    - lemma: "قُرعة"

      confirm:
        - text: "«القرعة: بالضم وسكون الراء طينة مدورة أو عجينة مدورة مثلا يدرج فيها رقعة يكتب فيها اسم المتنازعين في قسمة شيء ثم سلّم إلى صبي، يعطي كلّ واحد من المتنازعين واحدة منهما»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«القُرْعة: كلّ ما يُلقَى أو يُسحَب لتقرير أمرٍ على أساسٍ من الحظّ»"
          source: "المورد الحديث (2008)"
        - text: "«القُرعَة: بالضم السهمُ والنصيبُ»"
          source: "التعريفات الفقهية للبركتي"

      expands:
        - text: "«وإلقاءُ القرعة حيلةٌ يتعيَّن بها سهمُ الإنسان أي نصيبُه»"
          source: "التعريفات الفقهية للبركتي"
          addition: "يُضيف بُعدَي النصيب (النتيجة المُتحصَّلة) وعملية الإجراء — وهما غير موجودَين في تعريف المجموعة المُقتصِر على الشيء المادي"
        - text: "«(الْقرعَة) النَّصِيب وَيُقَال كَانَت لَهُ الْقرعَة إِذا قارع أَصْحَابه غلبهم بهَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
          addition: "توسيع دلالي نحو «النصيب المُتحصَّل» — أي نتيجة القرعة لا الأداة المادية التي يُستخدمها AWN"
        - text: "«النصيبُ. ويقال: كانت له القُرْعَةُ على أصحابه: غلبَهم بها»"
          source: "المعجم الوسيط"

      peripheral_observations:
        - "«القَرْعَةُ: مَوْضِع القَرَع من الرَّأْسِ. ويقال: ضربَهُ على قَرْعَةِ رأسه» — المعجم الوسيط (معنى مستقل: موضع الصلع)"
        - "«القَرَعَةُ: من الأرض التي لا تُنبت شيئاً» — المعجم الوسيط (معنى مستقل: الأرض القاحلة)"
        - "«قَرْعة: واحدة القَرْع بمعنى جنس من النباتات فيه أنواع تُزرع للثمار وأصناف للتزيين» — موسوعة السلطان قابوس (معنى مستقل: نبات القرع)"


step05_lemma_generation:
