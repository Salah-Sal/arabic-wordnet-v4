step0_evidence:
  per_lemma:
    - lemma: "شخصية"
      confirm:
        - text: "«(الشخصية) صِفَات تميز الشَّخْص من غَيره وَيُقَال فلَان ذُو شخصية قَوِيَّة ذُو صِفَات متميزة وَإِرَادَة وكيان مُسْتَقل (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
        - text: "«صفات تميز الشخص من غيره»"
          source: "المعجم الوسيط"
        - text: "«صفات تميز الشخص عن غيره»"
          source: "المعجم الكبير"
        - text: "«كامل خصائص الفرد الذاتية المميِّزة؛ مجموع نزعات الفرد السلوكيّة والعاطفية»"
          source: "المورد الحديث (2008)"
        - text: "personality (character)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "personality — مسرد التربية (ALECSO)"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "personality — مسرد الفلسفة وعلم النفس (ALECSO)"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "personality — مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«(في الأدب): أحد الأفراد الخياليين أو الواقعيين الذين تدور حولهم القصة أو المسرحية كشخصية سي السيد في ثلاثية نجيب محفوظ»"
          source: "المعجم الكبير"
          addition: "المعنى الأدبي (الشخصية الروائية/المسرحية) — مفهوم فرعي مستقل عن المعنى النفسي يستحق synset مستقلاً في AWN4"
        - text: "«بطولة روائية تقابل (الفاعل / الممثل) لدقتهما السيميائية، وهي فكرة من الأفكار الحوارية تندرج ضمن حوارية الشخصيات»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "المعنى السيميائي/اللساني للشخصية في الخطاب الأدبي والنقد الروائي"
        - text: "«قوّة الشخصيّة أو جاذبيّتها a man with personality؛ شخص قويّ الشخصيّة أو جذّابها»"
          source: "المورد الحديث (2008)"
          addition: "دلالة الكاريزما والتأثير الشخصي — بُعد تقييمي لا وصفي، غير موجود في التعريف النفسي الأساسي"
      peripheral_observations:
        - "الاستعمال القانوني (شخصية قانونية، شخصية اعتبارية): مفهوم مستقل تماماً يتعلق بالأهلية القانونية للأشخاص والمؤسسات — لا صلة له بالمعنى النفسي"
        - "المصطلحات الطب-نفسية المركّبة (اضطراب الشخصية، الشخصية الحدية، الشخصية المتعددة...): تستخدم شخصية قاعدةً اصطلاحية منتجة جداً في الطب النفسي — تدل على تنوع الحقل الدلالي وامتداده"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "الطِّباع"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الطَّبْعُ: السجيّهُ التي جُبِلَ عليها الإنسان، والطِّباعُ: كالطَّبيعةِ» — تاج اللغة وصِحاح العربية للجوهري"
      justification: "الجذر ط-ب-ع يدل في المعاجم الكلاسيكية على مجموع الخصائص الفطرية التي جُبل عليها الإنسان؛ وقد عثر عليه بحث المفاتيح عبر مفهوم «نزعات الفرد السلوكية والعاطفية» في المورد الحديث — آلية التوليد: مجاز (إحياء لفظ تراثي يدل على الطبيعة الفطرية)"
  knowledge_candidates:
    - lemma: "السَّجِيَّة"
      justification: "مصطلح كلاسيكي يُدرَج في المعاجم مع الطَّبْع وجمعُه السَّجايا؛ ورد في ابن مالك ضمن مترادفات باب الطَّبْع (غريزة، خليقة، ضريبة، سجية، جِبِلَّة...) — آلية التوليد: مجاز/إحياء، يدل على الطبيعة الثابتة الفريدة التي تميز صاحبها"
  generation_notes: "مفهوم الشخصية النفسية الشاملة حديث النشأة في التراث العربي؛ المعاجم الكلاسيكية لا تعرف مصطلحاً موحداً يعادل personality بمفهومها النفسي المركّب — الألفاظ الكلاسيكية القريبة (الطبع، السجية، الجبلّة) أضيق دلالةً لأنها تقتصر على الصفات الفطرية الموروثة دون المكتسبة ودون الأبعاد العاطفية والعقلية"

step1_lemma_validation:
  per_lemma:
    - lemma: "شخصية"
      decision: confirmed
      decision_reason: "مصطلح نفسي-اجتماعي مستقر ومحكوم بأدلة مؤكِّدة متعددة: المعجم الوسيط والمعجم الكبير والمورد الحديث ومصادر متخصصة في التربية والفلسفة وعلم النفس وعلم الاجتماع والطب — صنّفه المعجم الوسيط «محدثة» مما يؤكد مشروعية الاستعمال الحديث وسلامة التحديث الدلالي. اجتاز بوابة الجودة بامتياز: شائع في الفصحى المتخصصة، يسير النطق، ملائم للمفهوم، مشتقّ اشتقاقاً صحيحاً، منتج اشتقاقياً (شخَّص/تشخيص/مشخَّص)"
      evidence_assessment:
        case: "expands"
        notes:
          - "الأدلة التوسّعية في المعنى الأدبي والسيميائي تشير إلى ضرورة إيجاد synset مستقل للشخصية الروائية/المسرحية في AWN4، بمعزل عن هذا الـsynset النفسي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللمّة الوحيدة في المجموعة؛ تتمايز شخصية عن القريبين الكلاسيكيين المرفوضَين في الخطوة ٠٫٥: (١) الطَّبْع/الطِّباع — يختص بالصفات الفطرية الموروثة (السجية التي جُبل عليها الإنسان) دون الصفات السلوكية والعاطفية المكتسبة ودون الأبعاد الأربعة الواردة في التعريف؛ (٢) السَّجِيَّة — أضيق دلالةً وأكثر تخصصاً في الفضائل الأخلاقية الراسخة. أما شخصية فتشمل المجمع الكامل: السلوكي + المزاجي + العاطفي + العقلي، وتقبل الاستعمال العلمي الحديث في الطب النفسي والتربية والاجتماع"
      example: "درس الباحثون شخصيةَ المرضى لفهم الآليات التي تُسهم في اضطرابات القلق والاكتئاب وصياغة برامج علاجية مخصّصة لكل فرد"

    - lemma: "الطِّباع"
      source: step05
      decision: removed
      decision_reason: "أضيق دلالةً من تعريف المجموعة — يختص بالصفات الفطرية الموروثة (السجية المجبول عليها) دون الصفات المكتسبة، ولا يشمل الأبعاد السلوكية والعاطفية والعقلية كما في التعريف؛ فشل اختبار الإبدال: «اضطراب الطباع» و«علم الطباع» غير متداولَين، خلافاً لـ«اضطراب الشخصية» و«علم الشخصية» السائدَين في الأدبيات التخصصية"
      step05_citation: "«الطَّبْعُ: السجيّهُ التي جُبِلَ عليها الإنسان، والطِّباعُ: كالطَّبيعةِ» — تاج اللغة وصِحاح العربية للجوهري"

    - lemma: "السَّجِيَّة"
      source: step05
      decision: removed
      decision_reason: "أضيق دلالةً وأكثر تخصصاً في الطبيعة الأخلاقية الراسخة دون الأبعاد السلوكية والعاطفية والعقلية الشاملة؛ فشل اختبار الإبدال: «اضطراب السجية» و«اختبار السجية» مُنكَران في الاستعمال، ولا تنتج عن الجذر سجا مصطلحات تخصصية في علم النفس أو التربية بخلاف الشخصية"
      step05_citation: "«غريزتي وخليقتي وضريبتي ونحيزتي وسليقتي... وشيمتي... وسجيتي وجبلتي وخلقتي» — الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (باب الطَّبْع)"

  synset_flags:
    definition_review_needed: true

