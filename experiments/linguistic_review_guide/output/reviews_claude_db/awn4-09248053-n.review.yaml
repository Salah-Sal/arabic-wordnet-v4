# مراجعة المجموعة الترادفية awn4-09248053-n
# body of water / water — جزء من سطح الأرض مغطى بالماء
# ─────────────────────────────────────────────────────────────

step0_evidence:
  per_lemma:

    - lemma: "مسطح مائي"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "ورد «مسطح مائي» في تعريف «بركة» (pond) لا كمدخل مستقل: «بركة: مسطح مائي صغير ومستقر.» — المعجم الموحد لمصطلحات الطاقة المتجددة (1996). يُثبت الاستعمال التقني للمصطلح كجنس أعم للأنواع المائية."
        - "ورد أيضاً في «شريط ضفافيّ لمُسطح مائيّ» (riparian zone) — المعجم الموحد لمصطلحات المياه (2000): دليل على تداوله في الاصطلاح التقني."

    - lemma: "مياه"
      confirm:
        - text: "«المياه الجارية أو الراكدة التي لها علاقة بالدورة المائية، بما في ذلك أسرة المجاري المائية أو الطبقات الحاملة للمياه الجوفية.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      contradicts:
        - text: "«المِيَاهُ: يقال لها بالفارسية الماشية: باليمامة، قال أبو زياد: وللوعليّين وهم آل وعلة الجرميّون حلفاء بني نمير المياه مياه الماشية البئر والبئر إلى أجبال يقال لها المعانيق.»"
          source: "معجم البلدان لياقوت الحموي (ت 1229م)"
          conflict: "يُعالج المعجم «مياه» كاسم علم جغرافي لآبار ومواضع في الجزيرة العربية، لا كمصطلح للمسطح المائي الطبيعي على سطح الأرض."
        - text: "«مِيَاهٌ: بكسر أوله، وآخره هاء خالصة، جمع ماء وتصغيره مويه والنسبة إليها ماهيّ: موضع في بلاد عذرة قرب الشام. ووادي المياه: من أكرم ماء بنجد لبني نفيل بن عمرو بن كلاب.»"
          source: "معجم البلدان لياقوت الحموي (ت 1229م)"
          conflict: "مدخل مكاني بحت — لا علاقة له بدلالة المجموعة."
      expands:
        - text: "«المياه الجارية أو الراكدة التي لها علاقة بالدورة المائية، بما في ذلك أسرة المجاري المائية أو الطبقات الحاملة للمياه الجوفية.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يُوسّع المفهوم ليشمل المياه الجوفية (الطبقات الحاملة للمياه تحت الأرض) — وهي خارج نطاق تعريف المجموعة الذي يقتصر على سطح الأرض."
      peripheral_observations:
        - "«مِياه: من (م و ه) جمع الماء.» — موسوعة السلطان قابوس لأسماء العرب (1985): مدخل صرفي محض، لا دلالة جغرافية."
        - "«مَيَّاه: من (م ي ه) من يسقى الماء ومن يطلى السيف بالذهب ونحوه.» — موسوعة السلطان قابوس لأسماء العرب (1985): كلمة مختلفة (فَعَّال للمبالغة) وليست لمّة المجموعة."

