step1_lemma_validation:
  per_lemma:

    # ── لمّة أصلية: مسطح مائي ──
    - lemma: "مسطح مائي"
      decision: confirmed
      decision_reason: "تركيب وصفي عربي أصيل مستقر في الاستعمال التقني — يُؤدي المعنى الجغرافي (جزء من سطح الأرض مغطى بالماء) بدقة. عدم وجود مدخل مباشر لا يُضعف المصطلح بحكم تداوله الاصطلاحي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "يُركّز على البُعد الامتدادي الأفقي (expanse/surface) — ملاءم للتعبير عن المساحة المائية المرئية على سطح الأرض وتصنيفاتها (بحيرة، بحر، محيط). يُستعمل جنساً أعمّ في تعريف الأنواع الأكثر خصوصية كالبركة."
      example: "يضم حوض الأمازون شبكةً من المسطحات المائية العذبة لا مثيل لها في أي قارة أخرى."

    # ── لمّة أصلية: مياه ──
    - lemma: "مياه"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل يُعبّر عن الكتلة المائية بوصفها كياناً جماعياً — مُوثَّق في المعاجم التقنية بدلالة surface water. التعارض في المعاجم الكلاسيكية يخصّ الاستعمال الاسمي (أسماء أماكن) لا يبطل الاستعمال الجنسي."
      evidence_assessment:
        case: mixed
      substitution_test:
        result: pass
      nuance_differentiation: "اسم جمع يؤدي وظيفة اسم الكتلة (mass noun) — يناسب التعبير عن الامتداد الجماعي لأجسام مائية (مياه المحيط الهادئ، مياه بحيرة فيكتوريا)، خلافاً لـ«مسطح مائي» و«جسم مائي» اللذين يُحيلان إلى كيان واحد قابل للعدّ."
      example: "تغطي مياه المحيطات والبحار نحو سبعين بالمئة من مساحة سطح الأرض."

    # ── مرشح من الخطوة ٠٫٥: جسم مائي — مقبول ──
    - lemma: "جسم مائي"
      source: step05
      decision: confirmed
      decision_reason: "تركيب وصفي (اسم + صفة) مستقر ومعتمد في المورد الحديث (2008) بوصفه المصطلح الشامل المقابل لـ body of water — يرد في خمسة مداخل متمايزة ويُدرج النهر والقناة ضمن أمثلته صراحةً. الاشتقاق مفهومي (Calque) من «body of water» بهيكل واضح وعناصر عربية أصيلة — مقبول."
      step05_citation: "«المجرَى المائيّ: ... «ج» جسم مائيّ [نهر؛ قناة إلخ] صالح للملاحة.» + «الناصفة: جسم مائيّ ضيّق يصل بين اليابسة وجزيرة قريبة منها.» + «الطَّوْف الجليديّ: جليد طافٍ على سطح جسمٍ مائيّ.» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: pass
      nuance_differentiation: "أشمل من «مسطح مائي» (لا يقتصر على الامتداد السطحي) ومن «مياه» (يُحيل إلى كيان جغرافي واحد مُعيَّن لا إلى مادة مائية مجردة) — يُستعمل في التعريفات التقنية للإشارة إلى الجسم الجغرافي كوحدة واحدة (ضيّق، صالح للملاحة، سطحه متجمد)."
      example: "الناصفة: جسم مائيّ ضيّق يصل بين اليابسة وجزيرة قريبة منها."
      actions:
        - command: create_entry
          params:
            lemma: "جسم مائي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09248053-n"

    # ── مرشح من الخطوة ٠٫٥: وسط مائي — مرفوض ──
    - lemma: "وسط مائي"
      source: step05
      decision: removed
      decision_reason: "الاستعمال التقني الغالب يُحيله إلى المفهوم البيئي (aquatic medium/environment) لا إلى الكيان الجغرافي (body of water). تعريف «مياه شبه محصورة» يوصف «الوسط المائي» بأنه المحيط الذي تعيش فيه الكائنات، لا الجسم الجغرافي نفسه. يفشل اختبار التثبيت المعجمي للمفهوم المستهدف."
      step05_citation: "«حوض مائي كبير له منفذ محدود إلى المحيط... وسط مائي شبه مغلق (المرادف العربي)» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"

  added_lemmas:
