step05_lemma_generation:
  evidence_candidates:
    - lemma: "جسم مائي"
      source_section: "step4_fts_keyword"
      evidence_citation: "«المجرَى المائيّ: «أ» قناة أو مجرًى للماء... «ج» جسم مائيّ [نهر؛ قناة إلخ] صالح للملاحة.» — المورد الحديث (2008). وأيضاً: «الناصفة: جسم مائيّ ضيّق يصل بين اليابسة وجزيرة قريبة منها.» — المورد الحديث (2008)."
      justification: "يُستخدم «جسم مائي» في المورد الحديث (2008) كمصطلح شامل مقابل body of water، حيث يضم بين قوسين الأمثلة ذاتها الواردة في تعريف المجموعة (نهر، قناة). ورد في خمسة مداخل متمايزة (waterway, sound, floe, nekton, waterfront) مما يُثبت تثبيته معجمياً. آلية التوليد: تركيب وصفي (اسم + صفة)."

  knowledge_candidates:
    - lemma: "وسط مائي"
      justification: "ورد في مسرد المناخ والبيئة: «وسط مائي شبه مغلق (المرادف العربي)» وفي تعريف «مستقبل مجرى الماء»: «الوسط المائي، نهر، بحر، محيط». يُستعمل في التوثيق البيئي للتعبير عن كيان مائي شامل. آلية التوليد: تركيب وصفي. التحفظ: قد ينحرف نحو دلالة البيئة المائية (aquatic environment) لا الكيان الجغرافي."

  generation_notes: "«جسم مائي» هو المقابل الأوثق لـ body of water في المراجع الحديثة الموثوقة (المورد الحديث 2008). «وسط مائي» مرشح محتمل تستوجب دلالته تدقيقاً في مرحلة التحقق."

