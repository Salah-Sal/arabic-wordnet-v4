step0_evidence:
  per_lemma:

    - lemma: ضرورة
      confirm:
        - text: «(الضَّرُورَة) الحاجة والشدة لا مدفع لها والمشقة»
          source: المعجم الوسيط لمجموعة من المؤلفين
        - text: «الحاجةُ. الشِّدَّةُ لا مَدْفَعَ لها. المشقة»
          source: المعجم الكبير
        - text: «الضَّرورة: مشتقة من الضرر، وهو النازل مما لا مدفع له»
          source: كتاب التعريفات للشريف الجرجاني
        - text: «ضَرورَة — necessity»
          source: المعجم الطبي الموحد (2009)
        - text: «ضرورة — necessity»
          source: المعجم الموحد لمصطلحات القانون (2017)
        - text: «ضرورة — necessity»
          source: مسرد الفلسفة وعلم النفس (ALECSO)
      expands:
        - text: «الضّرورة: في اللغة الحاجة. وعند أهل السلوك هي ما لا بدّ للإنسان في بقائه»
          source: كشّاف اصطلاحات الفنون والعلوم للتهانوي
          addition: تُوسّع بمعنى الحاجة الوجودية الضيّقة "ما لا بدّ للإنسان في بقائه" — أخص من تعريف المجموعة "أي شيء لا غنى عنه"
        - text: «الضَّرُورَة: امتناع انفكاك شيء عن آخر عقلاً»
          source: دستور العلماء للأحمدنكري
          addition: المعنى الفلسفي/المنطقي (ضرورة الإلزام العقلي) — بُعد دلالي مستقل يختلف عن تعريف المجموعة
        - text: «(في الشعر): الحالة الداعية إلى أن يُرتكب فيه ما لا يُرتكب في النثر»
          source: المعجم الوسيط
          addition: معنى مصطلحي شعري (ضرورة الشعر) — مستقل تماماً عن تعريف المجموعة، يستحق مجموعة ترادفية مستقلة

    - lemma: حاجة ماسة
      evidence_status: no_material_found
      peripheral_observations:
        - «الحاجة: ما يفتقر إليه الإنسان ويطلبه» — المعجم الكبير — دلالة "الحاجة" أعمّ من "لا غنى عنه"
        - «الحاجة: ما يفتقر الإنسان إليه مع أنه يبقى بدونه والضرورة ما لابدَّ له في بقائه» — التعريفات الفقهيّة للبركتي — يُصرّح بالتمييز بين الحاجة والضرورة

    - lemma: شيء أساسي
      evidence_status: no_material_found

    - lemma: مستلزم
      evidence_status: no_material_found
      peripheral_observations:
        - «اللازم: ما يمتنع انفكاكه عن الشيء» — التوقيف على مهمات التعاريف للمناوي — الجذر ل-ز-م يدل على اللصوق الوجوبي
        - «مستلزمات الانتاج — production requirement» — المعجم الموحد لمصطلحات الاقتصاد (2000) — يُثبت الاستعمال المركّب للجذر ذاته

step05_lemma_generation:
  evidence_candidates:
    - lemma: متطلَّب
      source_section: step5_english_bridge
      evidence_citation: «مُتَطَلَّب — requirement» — المعجم الطبي الموحد (2009)
      reasoning: آلية التوليد — اشتقاق على وزن مُتَفَعَّل (اسم مفعول من "طلب")؛ يدل على ما يُطلب توفيره بالضرورة؛ مستقر في معاجم ARABTERM التقنية بمعنى "requirement" وهو أحد المقابلات المباشرة للمفهوم
  knowledge_candidates:
    - lemma: لازم
      reasoning: آلية التوليد — اشتقاق؛ اسم فاعل على وزن فاعِل من لَزِمَ (الجذر ل-ز-م)؛ يُستخدم في الاستعمال الكلاسيكي والمعاصر بمعنى ما لا يمكن الاستغناء عنه (لوازم البيت، لوازم السفر)؛ قابل للاشتقاق (ملازمة، لزوم، إلزام)
  generation_notes: التعريف "أي شيء لا غنى عنه" يدور حول مفهومَي اللزوم والطلب؛ المقابلات الإنجليزية (necessity/requirement/requisite) تكشف عن بُعدين — الضرورة المطلقة والمتطلَّب الوظيفي

step1_lemma_validation:
  per_lemma:

    - lemma: ضرورة
      decision: confirmed
      decision_reason: أدلة مؤكَّدة من معاجم متعددة (OCR + Hawramani + ARABTERM)؛ المعنى الأساسي "الحاجة والشدة لا مدفع لها" يطابق تعريف المجموعة مع توسّع فلسفي وشعري لا يناقضه
      evidence_assessment:
        case: expands
      substitution_test:
        result: pass
      nuance_differentiation: تتميز بدلالة الشدة والإلحاح وامتناع الدفع — تُستخدم لما يكون فقدانه ضاراً أو مُهلِكاً؛ أعمق جذوراً في الفقه والفلسفة العربية ("الضرورات تبيح المحظورات") مقارنةً بـ"مستلزم" الوظيفي و"متطلَّب" المؤسسي
      example: يُعدّ توفير المياه النظيفة ضرورةً حياتيةً لا يمكن لأي مجتمع مهما بلغ من الحضارة الاستغناءَ عنها

    - lemma: حاجة ماسة
      decision: removed
      decision_reason: تركيب وصفي حر فشل اختبار السكّ المصطلحي — إبدال "ماسة" بـ"ملحّة" أو "شديدة" يُبقي التعبير وصفاً للمفهوم؛ لا تثبيت معجمي كوحدة مسكوكة؛ "الحاجة" معجمياً أعمّ من "الضرورة" وتخالف تعريف المجموعة
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: لا تُميّز نوعاً مستقلاً — تصف درجة الحاجة لا كياناً قائماً بذاته؛ "الحاجة" في التعريفات الفقهيّة للبركتي أقلّ من "الضرورة" وأعمّ منها في آنٍ واحد
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: شيء أساسي
      decision: removed
      decision_reason: ترجمة حرفية عمياء من "essential thing" — تركيب وصفي حر لا وجود له في المعاجم؛ إبدال "شيء" بـ"أمر" أو "عنصر" يُبقي التعبير وصفياً صالحاً ← فشل اختبار السكّ؛ تُغني عنه "ضرورة" و"مستلزم" و"متطلَّب"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        accepted: false
      nuance_differentiation: ترجمة حرفية (blind calque) من "essential thing" — لا تُضيف بُعداً دلالياً مستقلاً في المعجمية العربية
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: مستلزم
      decision: confirmed
      decision_reason: مشتق بوضوح من الجذر ل-ز-م (اسم مفعول من استلزم)؛ شائع في الاستعمال المعاصر الفصيح (مستلزمات المكتب، مستلزمات الإنتاج)؛ اجتاز اختبار الإبدال؛ الملاءمة الصرفية (وزن مُسْتَفْعَل) تناسب الدلالة تماماً
      evidence_assessment:
        case: no_material
      substitution_test:
        result: pass
      nuance_differentiation: يتميز بالتركيز الوظيفي — يدل على ما يُطلب لتحقيق غرض محدد (ما يلزم لشيء بعينه)؛ أكثر تحديداً للسياق من "ضرورة" الوجودية العامة، وأقل رسميةً من "متطلَّب" المؤسسي
      example: يُعدّ التمويل الكافي والكوادر البشرية المؤهَّلة من أبرز مستلزمات إنجاح المشاريع التنموية

    - lemma: لازم
      source: step05
      decision: removed
      decision_reason: في الاستعمال المعاصر "لازم" صفة لا اسم مفرد مستقل — لا يعمل كوحدة اسمية تدل على "شيء لا غنى عنه" في سياقات طبيعية؛ الصواب استخدامه صفةً ("أمر لازم") أو في الجمع ("لوازم")
      step05_citation: «اللازم: ما يمتنع انفكاكه عن الشيء» — التوقيف على مهمات التعاريف للمناوي

    - lemma: متطلَّب
      source: step05
      decision: confirmed
      decision_reason: مصطلح مستقر في المعاجم التقنية المعاصرة (ARABTERM)؛ وزنه الصرفي مُتَفَعَّل مناسب لاسم المفعول "ما يُطلب"؛ اجتاز اختبار السكّ واختبار التثبيت المعجمي؛ قابل للاشتقاق (يُطلب، طلب، متطلِّب، متطلَّب)
      step05_citation: «مُتَطَلَّب — requirement» — المعجم الطبي الموحد (2009)
      substitution_test:
        result: pass
      nuance_differentiation: يتميز بالطابع الرسمي والمؤسسي — يُستخدم لما يُطلب وفق شروط أو مواصفات محددة (formal/functional requirements)؛ أكثر رسميةً من "مستلزم" وأقل دلالةً على الإلحاح الوجودي من "ضرورة"
      example: حدّدت هيئة الاعتماد متطلَّبات الجودة الواجب استيفاؤها قبل منح الترخيص للمؤسسة
      actions:
        - command: create_entry
          params:
            lemma: متطلَّب
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: awn4-09390100-n

  added_lemmas:
    - lemma: متطلَّب
      reason: مصدر — الخطوة ٠٫٥؛ مصطلح مستقر في الاستعمال التقني والمعاصر بمعنى requirement
      via_command: create_entry + add_sense

