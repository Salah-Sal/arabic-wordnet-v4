step0_evidence:
  per_lemma:

    - lemma: "إكسسوار مسرحي"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "«إكسسوار [جمع] إكسسوارات: قطع من الأدوات التزيينيّة تستخدم في تزيين الملابس وزخرفتها وهو من الأشياء الكماليَّة. إكسسوار السَّيَّارات: قطع من غيار السيارات تقوم بمهام وظيفيَّة» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"

    - lemma: "دعامة"
      confirm:
        - text: "«(1) دِعامة؛ سِناد؛ عِماد — prop — (1) property 4»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الدعامة: ما يسند به الحائط إذا مال يمنعه من السقوط»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "تحصر الدلالة في دعم الجدران المائلة، ولا صلة لها بالأغراض المنقولة على خشبة المسرح"
        - text: "«ما يُسنَدُ به الحائطُ ونحوه لِيمنَعَه من السُّقوط؛ خَشَبَةُ البَكْرَةِ؛ السَّيِّدُ»"
          source: "المعجم الكبير"
          conflict: "الدلالة الأصلية هندسية/بنائية تختلف كلياً عن الأداة المنقولة في موقع التصوير"
        - text: "«عماد البيت الذى يقوم عليه»"
          source: "المعجم الوسيط"
          conflict: "دعامة = عمود البناء الثابت، لا غرض منقول يُعدّ لإثراء المشهد الدرامي"
        - text: "«دعامة: buttress / pier / abutment / strut / stanchion»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "الاستعمال التقني حصري في الهندسة الإنشائية لا في الفنون المسرحية"
      expands:
        - text: "«دعامة الضيف: مُعينه؛ دعامة قومه: سيّدهم وسندهم»"
          source: "المعجم الوسيط"
          addition: "المعنى المجازي الاجتماعي (السيد والناصر) مستقل تماماً عن الدلالة المسرحية"
        - text: "«دعامة المنجم: سِناد يُستخدم لتدعيم سقف المنجم»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 2 (1999)"
          addition: "الاستعمال التقني يُوسّع المعنى نحو كل دعامة وظيفية في أي سياق تقني، مما يفتح الباب أمام التوسع للسياق المسرحي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "دعامة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) دِعامة؛ سِناد؛ عِماد — prop — (1) property 4» — المورد الحديث (2008)"
      reasoning: "المورد الحديث يُدرج دعامة كأول مقابل عربي لـ prop ويشير صراحةً إلى المعنى الرابع (property 4) الدال على الأداة المسرحية؛ الكلمة تُطابق الجنس القريب (غرض مادي) مع التخصيص الوظيفي"
  knowledge_candidates:
    - lemma: "مستلزمات الخشبة"
      reasoning: "تركيب إضافي — مستلزمات (جمع مستلزَم: ما يُحتاج إليه لإتمام الشيء) + الخشبة (خشبة المسرح في الاصطلاح الفني). منهج التوليد: تركيب إضافي. محتمل فشل اختبار التثبيت المعجمي لعدم تسجيله في المعاجم المتخصصة"
  generation_notes: "المفهوم يعاني من ثغرة معجمية في الفصحى؛ لا توجد مفردة عربية مفردة أصيلة مسكوكة خاصة بالأداة المسرحية بمعناها التقني الدقيق. الجسر الإنجليزي يُعيد دائماً إلى دعامة كمقابل مُعجمي رئيسي"

step1_lemma_validation:
  per_lemma:

    - lemma: "إكسسوار مسرحي"
      decision: removed
      decision_reason: "كلمة دخيلة (accessoire الفرنسية) بقيت على لفظها الأجنبي دون إخضاع صرفي كامل؛ التركيب (دخيل + صفة عربية) وصفي حر يفشل اختبار السكّ — «إكسسوار سينمائي» يؤدي الوصف ذاته مما يؤكد عدم التثبيت الاصطلاحي؛ تفتقر إلى الاشتقاقية (لا فعل ولا صفة منها، وجمعها المنتج إكسسوارات بالسالم لا بالتكسير)"
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُركّز على الجانب الزينتي والكمالي للإكسسوار (تزيين الملابس والمظهر)، بينما المفهوم المستهدف يشمل كل غرض وظيفي أو جمالي منقول في موقع التصوير — فارق في الشمول والوظيفة"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "دعامة"
      decision: confirmed
      decision_reason: "مفردة عربية أصيلة ذات جذر راسخ (د-ع-م) مع سند معجمي حديث معتمد للمعنى المسرحي (المورد الحديث 2008)؛ تستوفي معايير الجودة الستة: اطراد في الاستعمال الحديث + يُسر في النطق + ملاءمة تناظرية مع prop + اشتقاقية غنية (دعم، يدعم، ادعم، مداعم، دعائم) + عربية أصيلة + أوزان صرفية منتجة"
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تنفرد بالأصالة العربية وغياب الظلال الزينتية لـ«إكسسوار»؛ تُعبّر عن البُعد الوظيفي والدرامي (ما يُسنَد به الحدث المسرحي ويُقيم المشهد)؛ جمعها «دعائم» أيسر استعمالاً من «إكسسوارات» في النصوص الفصيحة"
      example: "طلب المخرجُ من فريق الديكور ترتيبَ دعائم المشهد على خشبة المسرح قبيل بدء التصوير"

    - lemma: "دعامة"
      source: step05
      decision: removed
      decision_reason: "تكرار — اللمّة مدرجة أصلاً في المجموعة وأُكِّدت في تحليل اللمّات الأصلية؛ لا حاجة إلى إضافة"
      step05_citation: "«(1) دِعامة؛ سِناد؛ عِماد — prop — (1) property 4» — المورد الحديث (2008)"

    - lemma: "مستلزمات الخشبة"
      source: step05
      decision: removed
      decision_reason: "عبارة وصفية حرة — فشلت اختبار السكّ (يمكن إبدال «الخشبة» بـ«المسرح» أو «التصوير» دون فقدان الوصف)؛ غير مسجّلة في أي معجم تخصصي مسرحي؛ لم تثبت كوحدة معجمية مسكوكة بموجب اختبار التثبيت المعجمي"
      step05_citation: "لا دليل معجمي — مرشح من المعرفة اللغوية"

  synset_flags:
    definition_review_needed: true

