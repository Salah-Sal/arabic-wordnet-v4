step0_evidence:
  per_lemma:

    - lemma: "اتصال سمعي"
      confirm:
        - text: "«معدات تتحكم من خلال وسائل ميكانيكية أو إلكترونية في عرض وتقديم أي اتصال سمعي لغرض التعليم»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"

    - lemma: "تواصل سمعي"
      confirm:
        - text: "«تواصل بواسطة استعمال حاسة السمع»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«كل تواصل يعتمد حاسة السمع ويشمل إلى جانب الكلام الموسيقى والغناء»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«كل تواصل يعتمد حاسة السمع ويشمل إلى جانب الكلام الموسيقى والغناء»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "يوسّع نطاق التعريف ليشمل الموسيقى والغناء إضافةً إلى الكلام المنطوق، مما يُبيّن أن المفهوم أشمل من مجرد التواصل اللفظي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تواصل سمعي"
      source_section: "step5_english_bridge"
      evidence_citation: "«كل تواصل يعتمد حاسة السمع ويشمل إلى جانب الكلام الموسيقى والغناء» — مسرد الإعلام والتواصل (ArabTerm) [translation_en: auditory communication]"
      justification: "المصطلح المطابق مباشرةً للمفهوم في مسرد الإعلام والتواصل الصادر عن المنظمة العربية للتربية والثقافة والعلوم؛ يحمل ترجمة إنجليزية صريحة 'auditory communication' تُطابق مصطلح OEWN"
  knowledge_candidates:
    - lemma: "تخاطب سمعي"
      justification: "آلية التوليد: تركيب وصفي — الجذر خ-ط-ب (تخاطب: تكالم وتحادث بصفة متبادلة) + الصفة النسبية «سمعي». يُعبّر عن التواصل اللفظي المتبادل عبر القناة السمعية. غير أنه تركيب وصفي حر لم يُسجَّل في المعاجم المتخصصة كمدخل ثابت، مما يُرجَّح معه إخفاقه في اختبار التثبيت المعجمي"
  generation_notes: "المفهوم مستقر مصطلحياً في العربية المعاصرة تحت مسمى «تواصل سمعي»؛ التوليد الاشتقاقي والتركيبي لم يُفضِ إلى مصطلح بديل أقوى أو أصوب مما هو قائم"

step1_lemma_validation:
  per_lemma:

    - lemma: "اتصال سمعي"
      decision: confirmed
      decision_reason: "مصطلح مستعمل في المراجع التقنية العربية — تؤكد أدلة البحث العكسي توظيفه في خطاب المنظمة العربية للتربية والثقافة والعلوم"
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "«اتصال» (مصدر اتّصل — باب الافتعال من جذر و-ص-ل) يُركّز على الوصل والربط الآني وقد يكون أحاديّ الاتجاه (من مُرسِل إلى متلقٍّ)؛ بينما «تواصل» (باب التفاعل) يُفيد الاستمرار والتبادل المتكرر بين طرفين. في سياق التواصل الحيواني والبيئي، «تواصل» أوفى دلالةً على الشمولية"
      example: "يُعدّ الكلامُ المنطوقُ الوسيلةَ الأساسيةَ في الاتصال السمعي بين أفراد الجماعة اللغوية."

    - lemma: "تواصل سمعي"
      decision: confirmed
      decision_reason: "دليل معجمي مباشر من مسرد ArabTerm مع مطابقة تامة للمفهوم وتأكيد الترجمة الإنجليزية 'auditory communication'"
      evidence_assessment:
        case: "mixed"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "«تواصل» (باب التفاعل من و-ص-ل) يُفيد الشمولية والتبادل المستمر بين طرفين أو أكثر، وهو الأوفى تعبيراً عن الطابع التفاعلي للمفهوم مقارنةً بـ«اتصال»؛ كما أن ArabTerm اعتمده مقابلاً رسمياً لـ'auditory communication'"
      example: "يشمل التواصل السمعي في عالم الحيوان أصواتَ التحذير والتودد والتعارف بين أفراد النوع الواحد."

    - lemma: "تخاطب سمعي"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر غير مسكوك في المعاجم المتخصصة — يخفق في اختبار التثبيت المعجمي ويُضيّق النطاق الدلالي إلى التحاور اللفظي البشري دون سائر صور التواصل السمعي"
      step05_citation: "«تكالما وتحادثا» — المعجم الكبير (مادة تخاطب)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "«تخاطب» يُقيّد المفهومَ بالتحاور اللفظي المتبادل بين عاقلَيْن، مما يُقصي الموسيقى والأصوات الحيوانية وسائر أشكال التواصل السمعي غير اللغوي"

step3_definition:
  definition_review_flag: false
  current_definition: "تواصل يعتمد على حاسة السمع"
  assessment:
    decision: revise
    reason: "التعريف الحالي صحيح مفهومياً لكنه يفتقر إلى الجنس القريب الصريح المُميَّز بلفظ التخصيص (نوع/ضرب من)، والفصلُ المميّز فيه ضيّق ولا يُبيّن نطاق المفهوم الكامل الذي يتخطى الكلام المنطوق؛ وتعريف ArabTerm يُوفّر صياغةً أوفى تُصرّح بشمول الموسيقى والغناء"
  authored_definitions:
    - type: terminological
      text: "ضرب من التواصل يُنقل فيه المحتوى الدلالي عبر أصوات مسموعة، ويشمل الكلامَ والموسيقى والغناءَ وسائر الإشارات الصوتية الدالّة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: linguistic
      text: "كل تواصل يعتمد على حاسة السمع وسيلةً لنقل المعنى بين طرفين أو أكثر، سواء أكان كلاماً أم غناءً أم سواهما من الأصوات الدالّة"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
