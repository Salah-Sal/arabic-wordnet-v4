step3_definition:
  definition_review_flag: true
  current_definition: "صفة الافتقار إلى القوة أو القدرة؛ الضعف والوهن"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي يحتوي على تكرار معجمي (استخدام اللمة 'الضعف' في تعريفها نفسه)، ويحتاج إلى صياغة أكثر دقة لتمييز 'الضعف' عن 'العجز'."
  authored_definitions:
    - type: "terminological"
      text: "حالة تجريدية تتسم بافتقار الفاعل إلى القوة أو القدرة اللازمة لإنجاز عمل ما أو تحمُّل أمرٍ ما"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
    - type: "linguistic"
      text: "انعدام القوة أو عدم القدرة على إتيان الفعل أو بلوغ الغاية"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
  reasoning:
    revision_justification: "التعريف الأصلي يكرر اللمة 'الضعف' في التعريف. التعريف الجديد يفكك المفهوم إلى 'حالة' (جنس) و'افتقار للقدرة' (فصل نوعي)."
    terminological_strategy: "الاعتماد على 'حالة تجريدية' كجنس قريب، وتحديد الفصل النوعي بـ 'افتقار القوة أو القدرة'."
    linguistic_strategy: "تبسيط المفهوم لغوياً ليشمل معنى العجز عن الفعل."
  actions:
    - command: "عدّل نص التعريف"
      params:
        definition_index: 0
        new_text: "حالة تجريدية تتسم بافتقار الفاعل إلى القوة أو القدرة اللازمة لإنجاز عمل ما أو تحمُّل أمرٍ ما"
    - command: "ألّف تعريفاً جديداً"
      params:
