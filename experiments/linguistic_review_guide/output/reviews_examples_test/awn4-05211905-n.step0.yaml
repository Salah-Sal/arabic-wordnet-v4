
step0_evidence:
  synset_id: awn4-05211905-n
  per_lemma:
    ضَعْف:
      confirm:
        - "«ضَعْف: hypodynamia» — المعجم الطبي الموحد (2009)"
        - "«ضَعْف: asthenia; weakness» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - "«والضُّعْفْ: خلاف القوّة.» — كتاب العين للخليل بن أحمد الفراهيدي"
        - "«الضَعْفُ والضُعْفُ: خلاف القُوَّة.» — تاج اللغة وصِحاح العربية للجوهري"
        - "«الضَّعْفُ وَالضُّعْفُ، وَهُوَ خِلَافُ الْقُوَّةِ.» — مقاييس اللغة لابن فارس"
        - "«فيه ضعف وضعف وهو ضعيف» — أساس البلاغة للزمخشري"
        - "«الضَّعْفُ والضُّعْفُ: خِلافُ القُوّةِ» — لسان العرب لابن منظور"
        - "«الضَّعْفُ بِفَتْحِ الضَّادِ وَضَمِّهَا ضِدُّ الْقُوَّةِ» — مختار الصحاح للرازي"
        - "«الضَّعْفُ والضُّعْفُ: خْلافُ القوة» — العباب الزاخر للصغاني"
      expands:
        - "«ويقال: الضَّعْفُ في العقل والرأي، والضُّعْفُ في الجسد.» — كتاب العين للخليل بن أحمد الفراهيدي"
        - "«والضَّعْف بالفَتْح في الرَّأى والعَقْل، والضُّعْفُ بالضَّم. في البَدَن.» — المجموع المغيث في غريبي القرآن والحديث لأبو موسى المديني"
        - "«وفرق بعضهم بين الضَّعْفِ والضُّعْفِ فقال: الضَّعْفُ - بالفتح - في العقل والرأي، والضُّعْفُ - بالضم - في الجسد.» — العباب الزاخر للصغاني"
        - "«وقيل: الضُّعْفُ، بالضم، في الجسد؛ والضَّعف، بالفتح، في الرَّأْي والعَقْلِ» — لسان العرب لابن منظور"
      contradicts:
        - "«وذكر الخليل أن التَضْعيفَ أن يزاد على أصل الشئ فيجعل مثلين أو أكثر. وكذلك الإضعافُ والمُضاعَفَةُ.» — تاج اللغة وصِحاح العربية للجوهري"
        - "«وَأَمَّا الْأَصْلُ الْآخَرُ فَقَالَ الْخَلِيلُ: أَضْعَفْتُ الشَّيْءَ إِضْعَافًا... وَهُوَ أَنْ يُزَادَ عَلَى أَصْلِ الشَّيْءِ فَيُجْعَلَ مِثْلَيْنِ أَوْ أَكْثَرَ.» — مقاييس اللغة لابن فارس"
        - "«وضعفتهم بقومي: كثرتهم لأنهم أضعافهم.» — أساس البلاغة للزمخشري"
        - "«تَضْعُفُ صلاةُ الجَماعَةِ على صلاةِ الفَذِّ كَذا وكَذَا : أي تُزَادُ.» — المجموع المغيث في غريبي القرآن والحديث لأبو موسى المديني"
        - "«أَيْ مَنْ كَانَتْ دَابَّتُه ضَعِيفَة... وَفِي حَدِيثِ أَبِي الدَّحْدَاحِ: إِلَّا رَجَاءَ الضِّعْف فِي المَعادِ أَيْ مِثْلَيِ الأجْرِ» — النهاية في غريب الحديث والأثر لأبي السعادات ابن الأثير الجزري"
        - "«لِفُلَانٍ عَلَيَّ دَرَاهِمُ (مُضَاعَفَةٌ) فَعَلَيْهِ سِتَّةُ دَرَاهِمَ» — المغرب في ترتيب المعرب للمُطَرِّزي"
      peripheral_observations:
        - "هناك تمييز دلالي (سياقي) متكرر في المعاجم بين 'الضَّعْف' (بالفتح) كدلالة على ضعف الرأي أو العقل، و'الضُّعْف' (بالضم) كدلالة على ضعف الجسد، رغم أن بعض المعاجم تشير إلى جوازهما معاً."
        - "المادة المعجمية تحمل معنيين أصليين متباعدين تماماً: الأول هو 'نقيض القوة' (وهو موضوع التعريف)، والثاني هو 'المضاعفة والزيادة' (بمعنى جعل الشيء مثلين أو أكثر)، وهذا الأخير يخرج عن نطاق التعريف المحدد في المهمة ويُصنف كـ (contradicts) لأنه يمثل أصلاً اشتقاقياً مختلفاً."
    عَجْز:
      confirm:
        - "«عَجْز: نقيض الحَزْم. عَجَزَ يَعْجِزُ عَجْزاً فهو عاجزٌ ضعيفٌ.» — كتاب العين للخليل بن أحمد الفراهيدي"
        - "«العَجْز: الضعف. تقول: عَجَزْتُ عن كذا أعْجِزُ بالكسر عَجْزاً ومَعْجِزَةً» — تاج اللغة وصِحاح العربية للجوهري"
        - "«فَالْأَوَّلُ عَجِزَ عَنِ الشَّيْءِ يَعْجِزُ عَجْزًا، فَهُوَ عَاجِزٌ، أَيْ ضَعِيفٌ.» — مقاييس اللغة لابن فارس"
        - "«العَجْز: نقيض الحَزْم. عَجَز عَن الْأَمر يَعْجِز، وعَجِز عَجْزاً فيهمَا.» — المحكم والمحيط الأعظم لابن سيده الأندلسي"
        - "«translation_en: disabilities» — المَكنَز الزراعي متعدد اللغات"
        - "«translation_en: deficit» — المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - "«translation_en: disability» — موسوعة الكهرباء (IEC 60050)"
        - "«translation_en: deficit» — مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - "«translation_en: invalidity» — المعجم الموحد لمصطلحات القانون (2017)"
        - "«translation_en: disability» — المعجم الطبي الموحد (2009)"
        - "«translation_en: infirmity» — المعجم الطبي الموحد (2009)"
      expands:
        - "«أعجزني فلان إذا عجزت عن طلبه وإدراكه... والعجوز: المرأة الشيخة... والعَجُزُ: مؤخر الشيء... والعجيزة عجيزة المرأة إذا كانت ضخمة... والعجزاء من الرمل... والعَجَزُ داءٌ يأخذ الدّابّة في عجُزِها... والعِجْزةُ وابنُ العِجْزَةِ آخرُ ولدِ الشيخ...» — كتاب العين للخليل بن أحمد الفراهيدي"
        - "«العَجُزُ: يذكر ويؤنث، وتأنيثه أكثر؛ وهي العجيزة.» — المذكر والمؤنث لابن التستري الكاتب"
        - "«العَجُزُ: مؤخر الشئ... والعَجيزَةُ، للمرأة خاصة... وعَجِزَت المرأة تَعْجُزُ بالضم عجوزا، أي صارت عجوزا... والعجوز: الخمر... والعجوز: نصل السيف... والعجوز: رملة بالدهناء... والعِجْزةُ بالكسر: آخر ولد الرجل.» — تاج اللغة وصِحاح العربية للجوهري"
        - "«الْعَجُزُ: مُؤَخَّرُ الشَّيْءِ... وَالْعَجُوزُ: الْمَرْأَةُ الشَّيْخَةُ... وَالْعِجْزَةُ وَابْنُ الْعِجْزَةِ: آخِرُ وَلَدِ الشَّيْخِ... وَالْعَجَزُ: دَاءٌ يَأْخُذُ الدَّابَّةَ فِي عَجُزِهَا...» — مقاييس اللغة لابن فارس"
        - "«translation_en: sacrum» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - "«translation_en: sacrum» — المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
        - "«translation_en: sacrum NA» — المعجم الطبي الموحد (2009)"
        - "«translation_en: sacrum; rump» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - "«العَجُزُ مَا بعد الظّهْر... والعَجُز فِي الْعرُوض: حذفك نون فاعلاتُن... وعُجْز الْقوس وعَجْزُها ومَعْجِزها: مقبضها.» — المحكم والمحيط الأعظم لابن سيده الأندلسي"
      peripheral_observations:
        - "تتضمن المادة المعجمية دلالة ثانية جذرية (مؤخر الشيء) تختلف تماماً عن دلالة (الضعف والوهن)، وهي دلالة مكانية/تشريحية (العَجُز/العجيزة/الأعجاز)."
        - "هناك دلالات مرتبطة بالعمر (العجوز) أو بالترتيب (العِجْزة/آخر ولد) وهي توسعات دلالية ناتجة عن استعارة مفهوم 'المؤخرة' أو 'الضعف' في سياقات مختلفة."
        - "المصطلحات العلمية الحديثة (sacrum) تشير إلى العظم التشريحي، وهو ما يطابق دلالة 'مؤخر الشيء' وليس دلالة 'الضعف'."
        - "المصطلحات الاقتصادية والقانونية (deficit, invalidity) تطابق دلالة 'الضعف والافتقار إلى القدرة'."
