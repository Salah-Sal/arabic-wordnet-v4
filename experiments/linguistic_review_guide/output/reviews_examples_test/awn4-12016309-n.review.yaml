step3_definition:
  definition_review_flag: false
  current_definition: شجيرة صغيرة كثيفة لها رؤوس زهرية تشبه الأستر بأشعة بيضاء عريضة؛ توجد في المناطق الصحراوية من أريزونا شرقاً إلى كانساس وجنوباً إلى المكسيك
  assessment:
    decision: revise
    reason: التعريف الحالي جيد ولكنه يحتاج إلى صياغة أكثر دقة وموسوعية، مع إبراز التصنيف النباتي (الفصيلة النجمية) ليكون التعريف أكثر علمية.
  authored_definitions:
  - type: terminological
    text: نبات عشبي معمر من الفصيلة النجمية، يتميز برؤوس زهرية بيضاء ذات أشعة عريضة، وينتشر في المناطق الصحراوية بجنوب غرب أمريكا الشمالية.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  - type: encyclopedic
    text: شجيرة صغيرة كثيفة، من أنواع الفصيلة النجمية، تحمل رؤوساً زهرية بيضاء تشبه زهور الأستر، وتستوطن المناطق الصحراوية الممتدة من أريزونا شرقاً إلى كانساس وجنوباً نحو المكسيك.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  reasoning:
    revision_justification: التعريف الأصلي يفتقر إلى تحديد الفصيلة النباتية، وهو أمر ضروري في التعريفات الموسوعية للنباتات.
    dictionary_comparison: التعريف الحالي دقيق جغرافياً، لذا تم الاحتفاظ بالمعلومات المكانية مع تحسين البنية اللغوية.
    terminological_strategy: استخدام 'نبات عشبي معمر' كجنس قريب، وتحديد الخصائص الزهرية والجغرافية كفصل نوعي.
  actions:
  - &id005
    command: عدّل نص التعريف
    params:
      definition_index: 0
      new_text: شجيرة صغيرة كثيفة، من أنواع الفصيلة النجمية، تحمل رؤوساً زهرية بيضاء تشبه زهور الأستر، وتستوطن المناطق الصحراوية الممتدة من أريزونا شرقاً إلى كانساس وجنوباً نحو المكسيك.
