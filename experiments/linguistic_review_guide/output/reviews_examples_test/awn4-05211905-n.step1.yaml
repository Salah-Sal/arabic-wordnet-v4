step1_lemma_validation:
  per_lemma:
    - lemma: "ضَعْف"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة للمعنى المقصود (نقيض القوة)"
      evidence_assessment:
        case: "mixed"
        notes:
          - "confirm: نقيض القوة"
          - "contradicts: المعنى الاشتقاقي (المضاعفة والتضعيف) خارج نطاق هذه المجموعة"
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "شعرَ بضعفٍ في جسده"
            substituted: "شعرَ بعجزٍ في جسده"
            preserved_meaning: true
      reasoning:
        evidence_weight: "أدلة قوية جداً من أمهات المعاجم (لسان العرب، مقاييس اللغة)"
        nuance_differentiation: "يتميّز عن «عجز» بكونه دلالة على حالة (state) نقص القوة، بينما «عجز» دلالة على فشل في الأداء (inability)"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "ضَعْف"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "ضَعْف"
            note: "يتميّز عن «عجز» بكونه دلالة على حالة (state) نقص القوة"

    - lemma: "عَجْز"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة للمعنى المقصود (نقيض القدرة)"
      evidence_assessment:
        case: "mixed"
        notes:
          - "confirm: نقيض الحزم والقدرة"
          - "expands: دلالات تشريحية (العَجُز) أو عمرية (العجوز) خارج نطاق المجموعة"
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "عجزَ عن إتمام العمل"
            substituted: "ضعفَ عن إتمام العمل"
            preserved_meaning: true
      reasoning:
        evidence_weight: "أدلة قوية من المعاجم والمصادر الحديثة (المعجم الطبي، القانوني)"
        nuance_differentiation: "يتميّز عن «ضعف» بكونه يشير إلى عدم القدرة على إنجاز فعل محدد (inability)"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "عَجْز"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "عَجْز"
            note: "يتميّز عن «ضعف» بكونه يشير إلى عدم القدرة على إنجاز فعل محدد"

  synset_flags:
    definition_review_needed: true