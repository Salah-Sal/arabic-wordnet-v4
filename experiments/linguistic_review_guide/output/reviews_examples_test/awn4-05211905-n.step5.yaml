step5_enrichment:
  per_lemma:
    - lemma: "ضَعْف"
      enrichment:
        root: "ض-ع-ف"
      examples:
        - text: "اللَّهُ الَّذِي خَلَقَكُم مِّن ضَعْفٍ ثُمَّ جَعَلَ مِنْ بَعْدِ ضَعْفٍ قُوَّةً"
          type: "quran"
          source: "الروم/ ٥٤"
      pos_check:
        pos: "noun"

    - lemma: "عَجْز"
      enrichment:
        root: "ع-ج-ز"
        figurative_relation: "metonymy"
      examples:
        - text: "وَمَا أَنتُم بِمُعْجِزِينَ فِي الْأَرْضِ"
          type: "quran"
          source: "كتاب العين"
      pos_check:
        pos: "noun"

  cultural_fit:
    assessment: "native"

  reasoning:
    cultural_fit_reasoning: "مفهوم الضعف والعجز من المفاهيم الإنسانية العامة والأصيلة في اللغة العربية، ولا يتطلب أي معالجة خاصة للفجوات المعجمية."

  actions:
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "عَجْز"
        note: "توجد علاقة مجازية (كناية) بين العَجُز (مؤخر الشيء) والعَجْز (عدم القدرة على إتمام الأمر)، حيث يُستعار التأخر للضعف."