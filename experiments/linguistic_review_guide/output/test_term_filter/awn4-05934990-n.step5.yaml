step5_enrichment:
  per_lemma:
    - lemma: "عمق"
      enrichment:
        root: "ع-م-ق"
        figurative_relation: "metaphor"
      examples:
        - text: "وقاتم الأعماق خاوي المخترق % مشتبه الأعلام لماع الخفق"
          type: "poetry"
          source: "رؤبة (كتاب العين)"
      pos_check:
        pos: "noun"

    - lemma: "عوص"
      enrichment:
        root: "ع-و-ص"
      examples:
        - text: "يا أيها السائل عن عوصائها"
          type: "poetry"
          source: "الراجز (كتاب العين)"
      pos_check:
        pos: "noun"

    - lemma: "حكمة باطنية"
      enrichment:
        root: "ح-ك-م / ب-ط-ن"
      examples:
        - text: "تزخر الفلسفات القديمة بحكمة باطنية لا يدرك كنهها إلا الراسخون في العلم."
          type: "usage"
          source: "مؤلَّف"
      pos_check:
        pos: "noun"

    - lemma: "حكمة مستغلقة"
      enrichment:
        root: "ح-ك-م / غ-ل-ق"
      examples:
        - text: "تحتاج النصوص الفلسفية القديمة إلى فك شفرة حكمة مستغلقة لفهم مقاصدها."
          type: "usage"
          source: "مؤلَّف"
      pos_check:
        pos: "noun"

  cultural_fit:
    assessment: "native"

  reasoning:
    cultural_fit_reasoning: "مفهوم الحكمة العميقة أو الغامضة مفهوم أصيل في التراث العربي، ويتم التعبير عنه عبر مفردات تراثية (عمق، عوص) أو تراكيب وصفية (حكمة باطنية/مستغلقة) لتغطية الجوانب الدلالية."

  actions:
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "عمق"
        note: "مجاز: استعارة العمق المادي لوصف عمق الحكمة (metaphor)"