step0_evidence:
  synset_id: awn4-05934990-n
  per_lemma:
    عمق:
      confirm:
      - «وتَعَمَّقَ في كلامه، أي تنطَّعَ.» — تاج اللغة وصِحاح العربية
      - «تَعَمَّقَ الرَّجُلُ فِي كَلَامِهِ، إِذَا تَنَطَّعَ.» — مقاييس اللغة
      - '«وتعمّق في الكلام: تنطّع.» — أساس البلاغة'
      - «وتَعَمَّق في كلامه أَي تَنَطَّع.» — لسان العرب
      - «وَ (تَعَمَّقَ) فِي كَلَامِهِ تَنَطَّعَ.» — مختار الصحاح
      - '«وتَعَمَّقَ في كلامِهِ: تَنَطَّعَ.» — القاموس المحيط'
      - '«وتعمَّقَ فِي كلامِه أَي: تنطّع.» — تاج العروس'
      - «He went deeply, or far, in in his speech; syn. تَنَطَّعَ.» — المعجم العربي الإنجليزي لإدوارد وليام لين
      expands:
      - '«المُتَعَمِّق: المُبَالِغ فِي الأمْر المُتَشَدِّد فِيهِ، الَّذِي يَطْلُبُ أقْصَى غايَتِه.» — النهاية في غريب الحديث والأثر'
      - '«عمَّق الرأيَ: دقّقه واستقصاه وبالغ فيه» — معجم اللغة العربية المعاصرة'
      - '«عمُقت أفكارُه: بلغت أقصى الأمر وكُنْهه.» — معجم اللغة العربية المعاصرة'
      - «مُعَقّد؛ عويص a deep problem / خَفِيّ؛ غامض a deep mystery / حكيم؛ حصيف» — المورد الحديث
      - '«تعمَّق في البحث: استقصاه، دقَّقه وبالغ في النَّظرِ فيه» — معجم اللغة العربية المعاصرة'
      - '«ورجل عُمْقِىُّ الْكَلَام: لكَلَامه غور.» — المحكم والمحيط الأعظم'
    عوص:
      confirm:
      - '«والعويص من الشعر: ما يصعُب استخراج معناه.» — تاج اللغة وصِحاح العربية'
      - «وَيُقَالُ أَعْوَصَ فِي الْمَنْطِقِ وَأَعْوَصَ بِالخَصْمِ، إِذَا كَلَّمَهُ بِمَا لَا يَفْطِنُ لَهُ.» — مقاييس اللغة
      - '«وَقد اعْتاصَ وأعْوَص فِي الْمنطق: غمضه.» — المحكم والمحيط الأعظم'
      - '«كلام عويص وأعوص، وكلمة عوصاء، وقد أعوصت في منطقك: جئت فيه بالعويص» — أساس البلاغة'
      - «(الْعَوِيصُ) مِنَ الشِّعْرِ مَا يَصْعُبُ اسْتِخْرَاجُ مَعْنَاهُ.» — مختار الصحاح
      - '«وكلامٌ عَوِيصٌ... والعَوِيصُ من الشِّعْرِ: ما يصعب استخراجُ معناه.» — لسان العرب'
      - «وَكَلَامٌ عَوِيصٌ يَعْسُرُ فَهْمُ مَعْنَاهُ» — المصباح المنير
      - '«والعَوِيصُ من الشِعْرِ: ما يَصْعُبُ اسْتِخْرَاجُ مَعْنَاهُ» — القاموس المحيط'
      - '«والعَوِيصُ من الشِّعْرِ: مَا يَصْعُبُ اسْتخْرَاجُ مَعْنَاهُ» — تاج العروس'
      - «Language Difficult to be understood... obscure; or not comprehended or understood» — المعجم العربي الإنجليزي لإدوارد وليام لين
      - '«الكلامُ: خفِي معناه وصعُب فهمُه. فهو عَوِيص» — المعجم الوسيط'
      - '«عاص الكلامُ: صَعُبَ فهمُه، خفِي معناه» — معجم اللغة العربية المعاصرة'
      - '«كلام عويص: صعب وغامض» — كتاب العين'
      - «الكلام الصعب الذي لا يفطن له» — مقاييس اللغة
      expands:
      - '«والكلمةُ العَوْصاءُ: الغريبةُ.» — تاج اللغة وصِحاح العربية'
      - «وفلان يركب العَوْصاءَ، أي يركب أصعبَ الامور.» — تاج اللغة وصِحاح العربية
      - '«والأَعْوَصُ: الغامضُ الذي لا يُوقَفُ عليه.» — لسان العرب'
      - '«وـ من الكَلِمِ: الغَريبةُ، كالعَوْصَاء» — القاموس المحيط'
      - '«والعَوْصاءُ: الأَمْرُ الصَّعْبُ. يُقَال: فُلانٌ يَركَبُ العَوْصاءَ، أَي أَصْعَبَ الأُمُور.» — تاج العروس'
      - '«كلمة عوصاء: صعبة» — كتاب العين'
