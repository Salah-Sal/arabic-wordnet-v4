step1_lemma_validation:
  per_lemma:
    - lemma: "تداول المطلعين"
      decision: "confirmed"
      decision_reason: "مصطلح مالي قياسي، مقبول بحكم اللغوي رغم عدم توثيقه معجمياً"
      evidence_assessment:
        case: "no_material"
        notes:
          - "لا سند معجمي مباشر — مقبولة بحكم اللغوي كاصطلاح مالي معتمد"
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "تم إيقاف المدير بسبب تداول المطلعين"
            substituted: "تم إيقاف المدير بسبب تداول داخلي"
            preserved_meaning: true
      reasoning:
        evidence_weight: "مصطلح تقني مستقر في الأدبيات المالية العربية"
        nuance_differentiation: "يتميّز عن 'تداول داخلي' بالتركيز على الفاعل (المطّلع) وليس على طبيعة التداول"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "تداول المطلعين"

    - lemma: "تداول من الداخل"
      decision: "removed"
      decision_reason: "ترجمة حرفية (calque) ضعيفة، غير مستخدمة كاصطلاح"
      evidence_assessment:
        case: "no_material"
      reasoning:
        evidence_weight: "لا سند معجمي — مصطلح ركيك"
        calque_analysis: "ترجمة حرفية لـ 'trading from the inside' وهي غير مستساغة في العربية المالية"
        removal_justification: "وجود مصطلحات أدق مثل 'تداول المطلعين' و 'تداول داخلي' يجعل هذا التعبير زائداً وغير دقيق"
      actions:
        - command: "احذف ارتباط اللمّة بالمجموعة"
          params:
            lemma: "تداول من الداخل"
            reason: "ترجمة حرفية غير اصطلاحية"

  added_lemmas:
    - lemma: "تداول داخلي"
      reason: "مصطلح مالي قياسي، موجز، وشائع الاستخدام"
      via_command: "أضف لمّة جديدة إلى المجموعة"

  synset_flags:
    definition_review_needed: false
    split_needed: false