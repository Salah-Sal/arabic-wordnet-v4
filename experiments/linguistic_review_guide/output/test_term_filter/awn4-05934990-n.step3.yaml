    terminological_strategy: "الجنس القريب = 'حكمة' + الفصل المميّز = 'تتسم بالخفاء والغموض وصعوبة الإدراك'."
    linguistic_strategy: "تبسيط المفهوم ليكون صفة للعلوم والحكم الصعبة."

