stage1_review:
  assessment:
    concerns:
      - "غياب التشكيل عن اللمات الحالية."
      - "اللمة 'محيي' يمكن أن تُفهم بمعنى روحي أو ديني إذا لم تُقيّد بسياق ملائم."
    observations: "المجموعة الترادفية تعبر عن شخص يبث الطاقة والنشاط في غيره. اللمات الحالية جيدة، لكن يمكن إضافة مصطلحات أخرى تستعمل مجازاً أو اصطلاحاً للدلالة على نفس المعنى مثل 'دينامو' أو 'محفز'."
  blind_candidates:
    - lemma: "مُحَفِّز"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل حفز، ويستخدم للتعبير عن الشخص الذي يستحث طاقة الآخرين ويدفعهم للعمل."
    - lemma: "بَاعِثُ حَيَوِيَّةٍ"
      generation_method: tarkib
      justification: "مركب إضافي يترجم التعريف بدقة من خلال وصف الشخص بأنه يبعث الحيوية."
    - lemma: "دِينَامُو"
      generation_method: taarib
      justification: "كلمة معربة (دينامو) تستخدم مجازاً في اللغة العربية المعاصرة لوصف الشخص مفرط النشاط والذي يبعث النشاط في محيطه."
    - lemma: "مِفْعَام"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل أفعم بمعنى ملأ، فيُقصد به الشخص الذي يملأ غيره بالطاقة، صيغ على وزن مفعال للمبالغة والآلة."

stage2_evidence:
  per_lemma:
    - lemma: "مُحْيِي"
      confirm:
        - text: "«من (ح ي ي) باعث الحياة ومعطيها، ومحي الليل: من يترك النوم فيه ويصرفه في العبادة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُنَشِّط"
      confirm:
        - text: "«ما يمد بالطاقة أو ينشط أو يشحن.»"
          source: "معجم المصطلحات الطبية"
    - lemma: "مُحَفِّز"
      confirm:
        - text: "«مادة تُسَرِّع التفاعل الكيميائي ولكنها تظل دون تغيير في الشكل وفي الكم (على سبيل المثال، الإنزيمات).»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      expands:
        - text: "يُستخدم مجازاً وبكثرة في السياقات الإدارية والتربوية لوصف الشخص الذي يرفع من همة الآخرين ويدفعهم للإنجاز."
          source: "الاستعمال المعاصر"
    - lemma: "بَاعِثُ حَيَوِيَّةٍ"
      evidence_status: "no_material_found"
    - lemma: "دِينَامُو"
      confirm:
        - text: "«رَجُل دينامو: رجل نشيط.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«فلانٌ دينامو هذا العمل: مُحَرِّكه ومُدِيرُه (مجاز)»"
          source: "المعجم الكبير"
    - lemma: "مِفْعَام"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُحْيِي"
      decision: confirmed
      decision_reason: "لمة فصيحة وصحيحة تستخدم بمعنى باعث الحياة والنشاط المعنوي، وتحتاج إلى ضبط التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحْيِي"

    - lemma: "مُنَشِّط"
      decision: confirmed
      decision_reason: "مصطلح دقيق ومستعمل للتعبير عن مانح الطاقة والنشاط سواء للأشياء أو الأشخاص."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنَشِّط"

    - lemma: "مُحَفِّز"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح واسع الاستخدام في العصر الحديث لوصف الشخص الذي يدفع غيره للعمل والنشاط ويرفع من طاقتهم المعنوية والإنتاجية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُحَفِّز", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "بَاعِثُ حَيَوِيَّةٍ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر ومركب غير مسكوك معجمياً، يمكن الاستغناء عنه بالمفردات الأدق."

    - lemma: "دِينَامُو"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معرّب من الاستعمالات الشائعة والمُثبتة معجمياً (المعجم الكبير، المعاصر) لتمثيل الشخص المحرك لمن حوله والذي يبعث فيهم النشاط باستمرار."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دِينَامُو", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مِفْعَام"
      source: stage1
      decision: removed
      decision_reason: "كلمة غير مستعملة ولا يوجد لها شواهد تدعم دلالتها في هذا السياق."

stage4_content:
  definition:
    current: "شخص يبعث الطاقة والحيوية والروح في الآخرين"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يترجم الكلمات الإنجليزية حرفياً، يمكن تحسينه وصياغته بأسلوب عربي أدق وأكثر سلاسة."
    authored:
      - type: linguistic
        text: "شَخْصٌ يَبُثُّ الطَّاقَةَ وَالنَّشَاطَ وَالحَيَوِيَّةَ فِي الآخَرِينَ وَيَدْفَعُهُمْ لِلْعَمَلِ وَالإِنْجَازِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ يَبُثُّ الطَّاقَةَ وَالنَّشَاطَ وَالحَيَوِيَّةَ فِي الآخَرِينَ وَيَدْفَعُهُمْ لِلْعَمَلِ وَالإِنْجَازِ."}

  examples:
    per_lemma:
      - lemma: "مُحْيِي"
        examples:
          - text: "كَانَ مُحْيِيَ الحَفْلِ بِرُوحِهِ المَرِحَةِ وَطَاقَتِهِ الإِيجَابِيَّةِ."
            type: usage
      - lemma: "مُنَشِّط"
        examples:
          - text: "عَمِلَ مُنَشِّطًا لِلْفَرِيقِ خِلَالَ فَتْرَةِ التَّدْرِيبِ الشَّاقَّةِ."
            type: usage
      - lemma: "مُحَفِّز"
        examples:
          - text: "يُعَدُّ المُدِيرُ النَّاجِحُ مُحَفِّزًا لِمُوَظَّفِيهِ عَلَى البَذْلِ وَالعَطَاءِ."
            type: usage
      - lemma: "دِينَامُو"
        examples:
          - text: "إِنَّهُ دِينَامُو المَشْرُوعِ الَّذِي لَا يَهْدَأُ حَتَّى يُنْجِزَ المَهَامَّ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "إِنَّهُ دِينَامُو المَشْرُوعِ الَّذِي لَا يَهْدَأُ حَتَّى يُنْجِزَ المَهَامَّ."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعَدُّ المُدِيرُ النَّاجِحُ مُحَفِّزًا لِمُوَظَّفِيهِ عَلَى البَذْلِ وَالعَطَاءِ."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "عَمِلَ مُنَشِّطًا لِلْفَرِيقِ خِلَالَ فَتْرَةِ التَّدْرِيبِ الشَّاقَّةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "مُحْيِي"
      entry_id: "{auto}"
      root: "حيي"
      maqayis_quote: "«(حَيَّ) الْحَاءُ وَالْيَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ: أَحَدُهُمَا خِلَافُ الْمَوْتِ، وَالْآخَرُ الِاسْتِحْيَاءُ... فَالْحَيَاةُ وَالْحَيَوَانُ، وَهُوَ ضِدُّ الْمَوْتِ.»"
    - lemma: "مُنَشِّط"
      entry_id: "{auto}"
      root: "نشط"
      maqayis_quote: "«(نَشِطَ) النُّونُ وَالشِّينُ وَالطَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اهْتِزَازٍ وَحَرَكَةٍ. مِنْهُ النَّشَاطُ مَعْرُوفٌ وَهُوَ لِمَا فِيهِ مِنَ الْحَرَكَةِ.»"
    - lemma: "مُحَفِّز"
      entry_id: "{auto}"
      root: "حفز"
      maqayis_quote: "«(حَفَزَ) الْحَاءُ وَالْفَاءُ وَالزَّاءُ كَلِمَةٌ وَاحِدَةٌ تَدَلُّ عَلَى الْحَثِّ وَمَا قَرُبَ مِنْهُ. فَالْحَفْزُ: حَثُّكَ الشَّيْءَ مِنْ خَلْفِهِ.»"

  per_sense:
    - lemma: "مُحْيِي"
      sense_id: "{auto}"
      nuance: "يُشير إلى بعث الروح والحياة في الأشخاص أو الفعاليات، ويغلب عليه الطابع المعنوي أو الوجداني."
      mwe: false
    - lemma: "مُنَشِّط"
      sense_id: "{auto}"
      nuance: "يُشير إلى بث النشاط والطاقة، ويُستخدم كثيراً كصفة لمن يقود النشاط أو يبث الهمة."
      mwe: false
    - lemma: "مُحَفِّز"
      sense_id: "{auto}"
      nuance: "يُركز على استثارة الدافعية للعمل والإنجاز وتوجيه الطاقة نحو هدف."
      mwe: false
    - lemma: "دِينَامُو"
      sense_id: "{auto}"
      nuance: "تعبير مجازي مستعار يوحي بالطاقة الجبارة التي لا تنضب والقدرة المستمرة على تحريك الآخرين كالمولد."
      mwe: false

  synset:
    cultural_fit: native

  actions:
