      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حيي","maqayis":"«(حَيَّ) الْحَاءُ وَالْيَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ: أَحَدُهُمَا خِلَافُ الْمَوْتِ، وَالْآخَرُ الِاسْتِحْيَاءُ... فَالْحَيَاةُ وَالْحَيَوَانُ، وَهُوَ ضِدُّ الْمَوْتِ.»"}'
