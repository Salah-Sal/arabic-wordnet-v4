      decision: revise
      reason: "التعريف الحالي جيد، لكن يمكن تحسين صياغته لتكون أكثر سلاسة وجرياناً على الأسلوب المعجمي العربي."
    authored:
      - type: terminological
        text: "الجزء الصغير المتبقي من شيء ما بعد استخدامه، كالجزء الباقي من السيجارة بعد تدخينها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
