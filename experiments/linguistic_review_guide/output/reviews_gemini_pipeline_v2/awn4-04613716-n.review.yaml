stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية 'حطام' تفتقر إلى التشكيل الكامل (حُطَام)."
      - "الحاجة إلى إضافة مرادفات متخصصة مثل 'أنقاض' لركام المباني."
    observations: "اللمّة الموجودة 'حطام' دقيقة جداً ومطابقة للتعريف، وهي اللفظ الأكثر شيوعاً للتعبير عن حطام السفن والطائرات والأشياء المحطمة بصفة عامة."
  blind_candidates:
    - lemma: "حُطَام"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من الفعل حطَمَ، ويعني ما تكسر من الشيء، وهو اللفظ المباشر للمفهوم."
    - lemma: "أَنْقَاض"
      generation_method: ishtiqaq
      justification: "جمع نِقْض، ويُستخدم خصيصاً للتعبير عن بقايا المباني والمنشآت المنهدمة (wreckage/rubble)."
    - lemma: "رُكَام"
      generation_method: majaz
      justification: "من ركَمَ الشيء إذا جمعه، ويُطلق على ما تراكم من حطام أو غيره في كومة واحدة."
    - lemma: "بَقَايَا"
      generation_method: ishtiqaq
      justification: "لفظ عام يشمل كل ما يتبقى من الشيء بعد تحطمه أو زوال معظمه."

stage2_evidence:
  per_lemma:
    - lemma: "حُطَام"
      confirm:
        - text: "«الحُطامُ من كُلِّ شيءٍ: ما تَحَطَّمَ مِنْه»"
          source: "المعجم الكبير"
        - text: "«(الحطام) من كل شَيْء مَا تحطم مِنْهُ»"
          source: "المعجم الوسيط"
        - text: "«حطام سفينة: wreckage»"
          source: "المعجم الموحد لمصطلحات علوم البحار"
      expands:
        - text: "«الأجزاء المتفتتة من الأنسجة المصابة»"
          source: "معجم المصطلحات الطبية"
    - lemma: "أَنْقَاض"
      confirm:
        - text: "«أَنقاض: كُسَارَة صخرية مفككة نتجت من تفتت الصخور»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
        - text: "«انقاض البناء: تهدم»"
          source: "المعجم الوسيط"
      expands:
        - text: "«بقايا الهدم»"
          source: "مقاييس اللغة (بالاشتقاق)"
    - lemma: "رُفَاض"
      confirm:
        - text: "«الرُّفاض: من الشيء ما تحطم منه فتفرق»"
          source: "المعجم الوسيط"
        - text: "«رُفاض الشيء: ما تحطم منه وتفرق»"
          source: "المحكم والمحيط الأعظم"
    - lemma: "كُسَارَة"
      confirm:
        - text: "«كُسَارة صخرية: debris/wreckage»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل"
    - lemma: "رُكَام"
      contradicts:
        - text: "«ما اجتمع من الأشياء وتراكم بعضه فوق بعض»"
          source: "المعجم الوسيط"
          conflict: "الركام يركز على هيئة التجمع (الكومة) وليس بالضرورة أن يكون ناتجاً عن تحطم."

stage3_analysis:
  per_lemma:
    - lemma: "حُطَام"
      decision: confirmed
      decision_reason: "هو المصطلح الأساسي والأكثر دقة وشمولية لوصف بقايا الأشياء المحطمة، ومدعوم بقوة في المعاجم القديمة والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُطَام"
    - lemma: "أَنْقَاض"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح قياسي وشائع جداً لوصف حطام المباني والمنشآت المنهدمة، ويكمل الدلالة في السياق العمراني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَنْقَاض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04613716-n"
    - lemma: "رُفَاض"
      decision: confirmed
      decision_reason: "مصطلح تراثي دقيق يصف الأجزاء المحطمة التي تفرقت وتشتتت، وهو مرادف قوي في النصوص الأدبية والقديمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "رُفَاض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04613716-n"
    - lemma: "كُسَارَة"
      decision: confirmed
      decision_reason: "يُستخدم في السياقات التقنية والجيولوجية للتعبير عن القطع الصغيرة المفتتة الناتجة عن التحطم (debris)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "كُسَارَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04613716-n"
    - lemma: "رُكَام"
      source: stage1
      decision: removed
      decision_reason: "الركام يشير إلى هيئة التراكم (الكومة) وليس بالضرورة إلى فعل التحطم، وقد يكون ركاماً من رمل أو سحاب."
    - lemma: "بَقَايَا"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام جداً يشمل الفضلات والنفايات والآثار، وليس مخصصاً للحطام."

stage4_content:
  definition:
    current: "الأجزاء المتبقية من شيء تحطم"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويغطي الجوهر الدلالي للمجموعة."
  examples:
    per_lemma:
      - lemma: "حُطَام"
        examples:
          - text: "عثر الغواصون على حُطَام السفينة الغارقة في قاع المحيط."
            type: usage
      - lemma: "أَنْقَاض"
        examples:
          - text: "تعمل فرق الإنقاذ بجد لانتشال الضحايا من تحت أَنْقَاض المبنى المنهار."
            type: usage
      - lemma: "رُفَاض"
        examples:
          - text: "تناثر رُفَاض الزجاج في أرجاء المكان بعد وقوع الانفجار."
            type: usage
      - lemma: "كُسَارَة"
        examples:
          - text: "تجمعت كُسَارَة الصخور عند قاعدة الجبل نتيجة العوامل الجوية."
            type: usage

