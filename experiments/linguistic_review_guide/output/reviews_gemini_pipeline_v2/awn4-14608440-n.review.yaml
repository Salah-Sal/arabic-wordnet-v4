      sense_id: "{auto}"
      nuance: "يركز على وظيفة المادة في إحداث الأرجية."
      mwe: false
    - lemma: "مَادَّةٌ مُسَبِّبَةٌ لِلْحَسَاسِيَّة"
      sense_id: "{auto}"
      nuance: "تعبير وصفي واسع الانتشار في السياقات التعليمية والعامة."
      mwe: true
  synset:
    cultural_fit: native
  actions:
