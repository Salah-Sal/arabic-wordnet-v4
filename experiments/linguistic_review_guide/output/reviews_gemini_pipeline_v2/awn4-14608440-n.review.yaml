        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"أرج","maqayis":"«الْهَمْزَةُ وَالرَّاءُ وَالْجِيمُ كَلِمَةٌ وَاحِدَةٌ وَهِيَ الْأَرَجُ، وَهُوَ وَالْأَرِيجُ رَائِحَةُ الطِّيبِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"مادة","root":"مد","maqayis":"«الْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ فِي طُولٍ...»"},{"word":"مسببة","root":"سبب","maqayis":"«السِّينُ وَالْبَاءُ... أَصْلُ هَذَا الْبَابِ الْقَطْعُ...»"},{"word":"للحساسية","root":"حس","maqayis":"«الْحَاءُ وَالسِّينُ أَصْلَانِ...»"}]}'
    - command: set_metadata
