stage1_review:
  assessment:
    concerns:
      - "استخدام 'سحر' كمرادف للتميمة غير دقيق، فالسحر هو الفعل أو العملية المعنوية بينما المفهوم يشير إلى أداة أو غرض مادي."
      - "اللمة 'تميمة سحرية' عبارة عن مركب وصفي قد لا يكون مصطلحا مسكوكا مستقلا، ولكنه يؤدي المعنى."
    observations: "المفهوم يشير إلى غرض أو أداة تُحمل أو تُتخذ للاعتقاد بأن فيها قوى سحرية (juju, voodoo, fetish). في العربية، الألفاظ المعبرة عن ذلك تشمل: تميمة، تعويذة، حرز، وعوذة."
  blind_candidates:
    - lemma: "تَمِيمَة"
      generation_method: ishtiqaq
      justification: "اللفظ العربي الأصيل الدال على ما يُعلق لدفع العين، ويتناسب مع فكرة الغرض ذي القوة الخفية."
    - lemma: "تَعْوِيذَة"
      generation_method: ishtiqaq
      justification: "مشتق من العوذ، ويعني الرقية أو الشيء الذي يُتخذ للحماية والقوة الخفية."
    - lemma: "حِرْز"
      generation_method: majaz
      justification: "يُطلق مجازاً على ما يُتحصن به من الأذى سواء كان أداة أو رقية."
    - lemma: "عُوذَة"
      generation_method: ishtiqaq
      justification: "مرادف فصيح للتميمة والتعويذة، يدل على اللجوء لشيء من أجل الحماية."

stage2_evidence:
  per_lemma:
    - lemma: "تميمة سحرية"
      evidence_status: "no_material_found"
    - lemma: "سحر"
      contradicts:
        - text: "السِّحر: كل ما لطف مأخذه ودق، والفعل كمنع."
          source: "القاموس المحيط"
          conflict: "السحر يدل على الفعل أو العملية المعنوية ولا يدل على الأداة أو التميمة المادية نفسها."
    - lemma: "تميمة"
      confirm:
        - text: "التميمة: مَا يعلق فِي الْعُنُق لدفع الْعين"
          source: "المعجم الوسيط"
    - lemma: "تعويذة"
      confirm:
        - text: "charm"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
    - lemma: "حرز"
      confirm:
        - text: "الحِرْزُ، بالكسر: العُوذَةُ، والمَوْضِعُ الحَصينُ"
          source: "القاموس المحيط"
    - lemma: "عوذة"
      confirm:
        - text: "العُوذة: التميمة والرقية يُرقى بها الإنسان من فزع أو جنون"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "تَمِيمَة سِحْرِيَّة"
      decision: confirmed
      decision_reason: "تعبير وصفي مستقر في الاستعمال لوصف التميمة التي ترتبط بقوى سحرية تحديداً، لتمييزها عن تميمة الحظ العادية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمِيمَة سِحْرِيَّة"

    - lemma: "سِحْر"
      decision: removed
      decision_reason: "السحر هو الفعل أو العملية ذاتها وليس الأداة المادية (التميمة)."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَمِيمَة"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة أصلية ومناسبة تماماً للتعبير عن الأشياء التي تُعلق أو تُحمل لدفع الأذى بناءً على معتقدات قوى غيبية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَمِيمَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَعْوِيذَة"
      source: stage1
      decision: confirmed
      decision_reason: "شائعة الاستخدام في العصر الحديث للتعبير عن الأشياء أو العبارات التي يُعتقد أن لها قوة سحرية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَعْوِيذَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حِرْز"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم في التراث العربي بمعنى العوذة والتميمة التي يُتحصن بها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حِرْز", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عُوذَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح للتميمة، تؤيده المعاجم ويحمل دلالة الالتجاء للشيء للحماية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عُوذَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "تميمة يُعتقد بخرافة أنها تجسد قوى سحرية"
    assessment:
      decision: retain
      reason: "التعريف دقيق ويوضح ارتباط التميمة هنا بالقوى السحرية وفق المعتقدات الخرافية، مما يميزها عن تمائم الحظ العادية."
  examples:
    per_lemma:
      - lemma: "تَمِيمَة سِحْرِيَّة"
        examples:
          - text: "علق المشعوذ تميمة سحرية في رقبته زاعماً أنها تحميه من الأرواح الشريرة."
            type: usage
      - lemma: "تَمِيمَة"
        examples:
          - text: "كانت القبائل البدائية تتخذ من بعض الأحجار تميمة لجلب القوة."
            type: usage
      - lemma: "تَعْوِيذَة"
        examples:
          - text: "وجدوا بين أغراض الساحر تعويذة مكتوبة بلغة غير مفهومة."
            type: usage
      - lemma: "حِرْز"
        examples:
          - text: "اتخذ المحارب هذا العقد حرزاً يقيه من الأذى في المعارك."
            type: usage
      - lemma: "عُوذَة"
        examples:
          - text: "ربطت الأم عوذة على ذراع طفلها خوفاً عليه من العين."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "علق المشعوذ تميمة سحرية في رقبته زاعماً أنها تحميه من الأرواح الشريرة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "كانت القبائل البدائية تتخذ من بعض الأحجار تميمة لجلب القوة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "وجدوا بين أغراض الساحر تعويذة مكتوبة بلغة غير مفهومة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "اتخذ المحارب هذا العقد حرزاً يقيه من الأذى في المعارك."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "ربطت الأم عوذة على ذراع طفلها خوفاً عليه من العين."}

