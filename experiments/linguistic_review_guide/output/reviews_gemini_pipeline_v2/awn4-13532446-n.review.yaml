stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمة واحدة فقط، وهي قوى السوق."
    observations: "المصطلح الحالي دقيق وشائع في الأدبيات الاقتصادية العربية، ولكن يمكن إثراء المجموعة بمترادفات أخرى تعبر عن نفس الآلية."
  blind_candidates:
    - lemma: "قِوَى السُّوقِ"
      generation_method: tarkib
      justification: "التركيب الإضافي الأكثر شيوعاً للتعبير عن هذا المفهوم الاقتصادي (market forces)."
    - lemma: "آلِيَّةُ السُّوقِ"
      generation_method: tarkib
      justification: "مصطلح يعبر عن الطريقة التي تعمل بها قوى العرض والطلب (market mechanism)."
    - lemma: "مُحَرِّكَاتُ السُّوقِ"
      generation_method: majaz
      justification: "استعارة للتعبير عن القوى الدافعة للنشاط الاقتصادي."
    - lemma: "ضَوَابِطُ السُّوقِ"
      generation_method: tarkib
      justification: "مصطلح يعبر عن القوانين الطبيعية للعرض والطلب التي تحكم السوق."

stage2_evidence:
  per_lemma:
    - lemma: "قِوَى السُّوقِ"
      confirm:
        - text: "قوى السوق (market forces)"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "فإن قوى السوق من شأنها أن تعيد بسرعة الاقتصاد إلى وضعية التوظيف الكامل."
          source: "مسرد المناخ والبيئة (ArabTerm)"
    - lemma: "آلِيَّةُ السُّوقِ"
      confirm:
        - text: "آلية السوق (market mechanism)"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
    - lemma: "مُحَرِّكَاتُ السُّوقِ"
      evidence_status: "no_material_found"
    - lemma: "ضَوَابِطُ السُّوقِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "قوى السوق"
      decision: confirmed
      decision_reason: "مصطلح أساسي ومعياري في علم الاقتصاد، مدعوم بأدلة قوية من المعاجم المتخصصة واستخدامات حقيقية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِوَى السُّوقِ"
    - lemma: "آلِيَّةُ السُّوقِ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف شائع جداً يستخدم للتعبير عن التفاعل بين قوى العرض والطلب في السوق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "آلِيَّةُ السُّوقِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13532446-n"}

stage4_content:
  definition:
    current: "التفاعل بين العرض والطلب الذي يشكل اقتصاد السوق"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً؛ يفضل صياغته بأسلوب معجمي يوضح الوظيفة الاقتصادية لهذه القوى."
    authored:
      - type: terminological
        text: "مجموعة العوامل الاقتصادية، والمتمثلة أساساً في التفاعل بين العرض والطلب، التي تؤثر في الأسعار وتحدد اتجاهات النشاط الاقتصادي في ظل المنافسة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13532446-n", definition_index: 0, text: "مجموعة العوامل الاقتصادية، والمتمثلة أساساً في التفاعل بين العرض والطلب، التي تؤثر في الأسعار وتحدد اتجاهات النشاط الاقتصادي في ظل المنافسة."}
  examples:
    per_lemma:
      - lemma: "قِوَى السُّوقِ"
        examples:
          - text: "تؤدي قوى السوق دوراً حاسماً في تحقيق التوازن الاقتصادي وتخصيص الموارد."
            type: usage
      - lemma: "آلِيَّةُ السُّوقِ"
        examples:
          - text: "تعتمد الليبرالية الاقتصادية على آلية السوق لتنظيم العلاقة بين المنتجين والمستهلكين."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-13532446-n", text: "تتدخل الدولة أحياناً للحد من تأثير قوى السوق على الفئات الضعيفة."}

