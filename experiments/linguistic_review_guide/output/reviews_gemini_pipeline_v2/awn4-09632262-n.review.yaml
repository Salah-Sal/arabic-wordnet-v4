  per_entry:
    - lemma: "رَأْسَمَالِيّ"
      entry_id: "{auto}"
      roots:
        - word: "رأس"
          root: "رأس"
          maqayis_quote: "«الرَّاءُ وَالْهَمْزَةُ وَالسِّينُ أَصْلٌ يَدُلُّ عَلَى تَجَمُّعٍ وَارْتِفَاعٍ.»"
        - word: "مال"
          root: "مول"
          maqayis_quote: "«الْمِيمُ وَالْوَاوُ وَاللَّامُ كَلِمَةٌ وَاحِدَةٌ، هِيَ تَمَوَّلَ الرَّجُلُ: اتَّخَذَ مَالًا.»"
    - lemma: "مُسْتَثْمِر"
      entry_id: "{auto}"
      root: "ثمر"
      maqayis_quote: "«الثَّاءُ وَالْمِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ شَيْءٌ يَتَوَلَّدُ عَنْ شَيْءٍ مُتَجَمِّعٍ.»"
    - lemma: "مُمَوِّل"
