stage1_review:
  assessment:
    concerns:
      - "لا توجد مشكلات جوهرية، اللمة الحالية 'سائل' دقيقة ومناسبة تماماً."
    observations: "المجموعة تغطي المفهوم الفيزيائي للحالة السائلة، والتعريف الحالي دقيق علمياً."
  blind_candidates:
    - lemma: "سَائِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من سال، وهو المصطلح العلمي واللغوي القياسي لهذه الحالة من المادة."
    - lemma: "مَادَّة سَائِلَة"
      generation_method: tarkib
      justification: "تعبير مصطلحي يجمع بين الماهية (مادة) والوصف الفيزيائي (سائلة)."
    - lemma: "جِسْم سَائِل"
      generation_method: tarkib
      justification: "تعبير فيزيائي كلاسيكي يُستخدم لتمييز المادة السائلة عن الغازية والصلبة."
    - lemma: "سَيَّال"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة تدل على كثرة الجريان، وتُستخدم أحياناً في السياقات العلمية."

stage2_evidence:
  per_lemma:
    - lemma: "سَائِل"
      confirm:
        - text: "«(فى الكيمياء): حالة من حالات المادة الثلاث، وسط بين الصلابة والغازية... له حجم ثابت عند ثبوت الحرارة والضغط، ويأخذ شكل الإناء الذى يحتويه.»"
          source: "المعجم الكبير"
        - text: "«(فى الكيمياء): حالة من حالات المادة الثلاث، وسط بين الصلابة والغازية.»"
          source: "المعجم الوسيط"
        - text: "«الحالة الوسطى للمادة... تمتلك فيها المادة حجماً محدداً وتتدفق بسهولة لكن لا يكون لها شكل محدد.»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
    - lemma: "مَادَّة سَائِلَة"
      confirm:
        - text: "«(فى الكيمياء) : حالة من حالات المادة الثلاث...» (باعتبار الوصف جزءاً من التعريف المصطلحي للمادة)."
          source: "المعجم الكبير"
    - lemma: "جِسْم سَائِل"
      confirm:
        - text: "«السّائل: عند الأطباء على دواء من شأنه أن تنبسط أجزاؤه إلى أسفل... كالمائعات كلها.»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "سَيَّال"
      contradicts:
        - text: "«شجر شائك متوسط الحجم من الفصيلة القرنية...»"
          source: "المعجم الوسيط"
          conflict: "المعنى الشائع هو نوع من الشجر، أو مصطلح جيولوجي (Sial)."

stage3_analysis:
  per_lemma:
    - lemma: "سائل"
      decision: confirmed
      decision_reason: "هو المصطلح الأساسي والدقيق الذي يجمع بين خاصيتي الجريان (مائع) وثبات الحجم، وهو المستخدم في كافة المعاجم العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَائِل"
    - lemma: "مَادَّة سَائِلَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مركب شائع الاستخدام في السياقات التعليمية والعلمية لتمييز الحالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مَادَّة سَائِلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14964238-n"}
    - lemma: "جِسْم سَائِل"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير فيزيائي كلاسيكي دقيق لتمييز الحالة الفيزيائية للجسم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "جِسْم سَائِل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14964238-n"}

stage4_content:
  definition:
    current: "مادة مائعة ليس لها شكل ثابت ولكن لها حجم ثابت"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً وجامع مانع لخصائص السائل الفيزيائية."
  examples:
    per_lemma:
      - lemma: "سَائِل"
        examples:
          - text: "الماء هو السائل الأكثر أهمية للحياة على وجه الأرض."
            type: usage
      - lemma: "مَادَّة سَائِلَة"
        examples:
          - text: "تتميز المادة السائلة بقدرتها على الانسياب مع الحفاظ على حجمها."
            type: usage
      - lemma: "جِسْم سَائِل"
        examples:
          - text: "يأخذ الجسم السائل شكل الوعاء الذي يوضع فيه."
            type: usage

