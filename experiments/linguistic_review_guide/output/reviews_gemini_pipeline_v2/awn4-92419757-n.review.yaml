stage1_review:
  assessment:
    concerns:
      - "المصطلح 'كائن فوق صخري' هو ترجمة اقتراضية (Calque) للمصطلح الإنجليزي (epilithic) وغالباً ما يكون هذا الاستعمال محدوداً في النصوص البيولوجية."
      - "المصطلح 'نبات صخري' دقيق ولكنه يغطي النباتات فقط، بينما المجموعة الدلالية تشمل أيضاً الفطريات والكائنات الأخرى التي تعيش على الصخور."
    observations: "تدور الدلالة حول فئة الكائنات والنباتات التي ترتبط بيئياً بسطح الصخور، ويمكن التعبير عن هذا بالوصف والإضافة مثل (كائن صخري) أو (نبات صخري) أو (معايش الصخور)."
  blind_candidates:
    - lemma: "نَبَات صَخْرِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يصف النبات الذي يتخذ من الصخور بيئة لنموه."
    - lemma: "كَائِن صَخْرِيّ"
      generation_method: tarkib
      justification: "توسيع الدلالة لتشمل الفطريات والكائنات غير النباتية التي تعيش على الصخر."
    - lemma: "نَابِتَة صَخْرِيَّة"
      generation_method: tarkib
      justification: "استخدام صيغة فاعلة للتعبير عن الكائن النامي، مع نسبته للصخر."
    - lemma: "صَخْرِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي الدال على الكائنات التي ترتبط بالصخور ارتباطاً حيوياً."

stage2_evidence:
  per_lemma:
    - lemma: "كائن فوق صخري"
      evidence_status: "no_material_found"
    - lemma: "نبات صخري"
      confirm:
        - text: "(2) النبات الصخري: نبات ينمو على سطح الصخور."
          source: "المورد الحديث (2008)"
    - lemma: "كَائِن صَخْرِيّ"
      evidence_status: "no_material_found"
    - lemma: "نَابِتَة صَخْرِيَّة"
      evidence_status: "no_material_found"
    - lemma: "صَخْرِيَّة"
      expands:
        - text: "وبلان (باليونانية Balanos) : صخرية وهي ضرب من الحيوانات القشرية تعيش على الصخور البحرية (صدفيات) (بوشر)."
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "استخدام قديم لكلمة (صخرية) للدلالة على بعض الحيوانات التي تعيش على الصخور."

stage3_analysis:
  per_lemma:
    - lemma: "كائن فوق صخري"
      decision: confirmed
      decision_reason: "مصطلح يعكس الدلالة العلمية الدقيقة (epilithic)، وهو ترجمة مفهومية مقبولة للحاجة إلى مصطلح يشمل الكائنات غير النباتية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَائِن فَوْقَ صَخْرِيّ"
    - lemma: "نبات صخري"
      decision: confirmed
      decision_reason: "مصطلح معجمي موثق ويؤدي المعنى المطلوب بدقة لفئة النباتات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَبَات صَخْرِيّ"
    - lemma: "كَائِن صَخْرِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب وصفي سليم يغطي الجانب الأعم من الدلالة (يشمل الفطريات والبكتيريا) ولا يتقيد بلفظ 'فوق' كما في الترجمة الحرفية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "كَائِن صَخْرِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَابِتَة صَخْرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير شائع ولا تدعمه أدلة معجمية."
    - lemma: "صَخْرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح يشوبه الغموض والاشتراك اللفظي مع المؤنث من (صخري)، واستعماله قاصر على أدلة نادرة لحيوانات قشرية."

stage4_content:
  definition:
    current: "نبات أو فطر أو كائن آخر ينمو على الصخور"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وعلمي ويشمل الفئات المختلفة المذكورة في المفهوم الأصلي (نباتات، فطريات، كائنات حية أخرى)."
  examples:
    per_lemma:
      - lemma: "كَائِن فَوْقَ صَخْرِيّ"
        examples:
          - text: "تُعد الأشنات من أبرز الكائنات فوق الصخرية التي تسهم في تفتيت الصخور وتكوين التربة."
            type: usage
      - lemma: "نَبَات صَخْرِيّ"
        examples:
          - text: "يستطيع النبات الصخري البقاء في بيئات قاسية حيث تقل التربة وتندر المياه."
            type: usage
      - lemma: "كَائِن صَخْرِيّ"
        examples:
          - text: "اكتشف العلماء كائناً صخرياً جديداً ينمو في المناطق الجبلية الوعرة."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُعد الأشنات من أبرز الكائنات فوق الصخرية التي تسهم في تفتيت الصخور وتكوين التربة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يستطيع النبات الصخري البقاء في بيئات قاسية حيث تقل التربة وتندر المياه."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "اكتشف العلماء كائناً صخرياً جديداً ينمو في المناطق الجبلية الوعرة."}

