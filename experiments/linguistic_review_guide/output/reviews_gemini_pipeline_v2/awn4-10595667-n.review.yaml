stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مصاغ بطريقة بسيطة ('شخص تم عزله') ويمكن تحسينه ليكون تعريفاً لغوياً أدق."
      - "كلمة 'مفصول' كاسم مفرد في العربية المعاصرة غالباً ما تنصرف إلى الشخص المقال من عمله، مما قد يسبب التباساً مع دلالة الفصل المكاني أو الاجتماعي المطلوبة هنا، لكنها صحيحة دلالياً."
    observations: "المفهوم يعبر عن الانعزال أو العزل (segregation) سواء أكان ذاتياً أم قسرياً، وهو يقابل اسم المفعول في العربية."
  blind_candidates:
    - lemma: "مَعْزُول"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الفعل 'عزل'، يعبر بدقة عن الشخص الذي أُبعد أو فُصل عن الآخرين مكانياً أو اجتماعياً."
    - lemma: "مَفْصُول"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الفعل 'فصل'، يدل على قطع الصلة أو الإبعاد عن المجموعة."
    - lemma: "مُسْتَبْعَد"
      generation_method: ishtiqaq
      justification: "اسم مفعول من 'استبعد'، يوحي بالإقصاء عن المشاركة أو التواجد مع الآخرين."
    - lemma: "مُقْصًى"
      generation_method: ishtiqaq
      justification: "اسم مفعول من 'أقصى'، يعبر عن الإبعاد إلى مسافة أو إخراج الشخص من المحيط المألوف."

stage2_evidence:
  per_lemma:
    - lemma: "مَعْزُول"
      confirm:
        - text: "(4) معزول [عن سائر أعضاء المجتمع]\n(5) شخص معزول؛ جماعة معزولة."
          source: "المورد الحديث (2008)"
        - text: "وسط مفصول عن محيطه لمنع أو التقليل من انتقال الحرارة أو الصوت أو الكهرباء أو الكائنات أو غير ذلك"
          source: "مسرد المناخ والبيئة (موقع ArabTerm)"
    - lemma: "مَفْصُول"
      confirm:
        - text: "(1) معزول؛ مفصول عن غيره a segregated area"
          source: "المورد الحديث (2008)"
    - lemma: "مُسْتَبْعَد"
      evidence_status: "no_material_found"
    - lemma: "مُقْصًى"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مَعْزُول"
      decision: confirmed
      decision_reason: "يتطابق تماماً مع المفهوم الدلالي للعزل المكاني أو الاجتماعي، وهو مدعوم في المعاجم الثنائية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْزُول"
    - lemma: "مَفْصُول"
      decision: confirmed
      decision_reason: "صحيح من حيث الاشتقاق والدلالة العامة على الانفصال، ومدعوم في القواميس، رغم أن شيوعه كاسم يميل للناحية الإدارية (الفصل من العمل)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَفْصُول"
    - lemma: "مُسْتَبْعَد"
      source: stage1
      decision: removed
      decision_reason: "دلالة الاستبعاد تميل أكثر إلى الإسقاط من الحسبان أو الترشيح، ولا تطابق مفهوم العزل الفيزيائي أو الاجتماعي تماماً."
    - lemma: "مُقْصًى"
      source: stage1
      decision: removed
      decision_reason: "يعني الإبعاد الشديد أو التهميش، وهو معنى أخص وأقوى من مجرد العزل."

stage4_content:
  definition:
    current: "شخص تم عزله أو فصله"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم أسلوباً ركيكاً ('تم عزله')، والأفضل صياغته بأسلوب معجمي دقيق يعتمد على اسم المفعول أو الفعل المبني للمجهول."
    authored:
      - type: linguistic
        text: "شَخْصٌ فُصِلَ أَوْ أُبْعِدَ عَنِ الآخَرِينَ أَوْ عَنْ جَمَاعَتِهِ لأَسْبَابٍ مُخْتَلِفَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ فُصِلَ أَوْ أُبْعِدَ عَنِ الآخَرِينَ أَوْ عَنْ جَمَاعَتِهِ لأَسْبَابٍ مُخْتَلِفَةٍ."

  examples:
    per_lemma:
      - lemma: "مَعْزُول"
        examples:
          - text: "بَقِيَ الْمَرِيضُ مَعْزُولاً فِي غُرْفَتِهِ تَجَنُّباً لِنَقْلِ الْعَدْوَى."
            type: usage
      - lemma: "مَفْصُول"
        examples:
          - text: "عَاشَ فِي حَيٍّ مَفْصُولٍ عَنْ بَاقِي أَجْزَاءِ الْمَدِينَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "بَقِيَ الْمَرِيضُ مَعْزُولاً فِي غُرْفَتِهِ تَجَنُّباً لِنَقْلِ الْعَدْوَى."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "عَاشَ فِي حَيٍّ مَفْصُولٍ عَنْ بَاقِي أَجْزَاءِ الْمَدِينَةِ."

stage5_enrichment:
  per_entry:
    - lemma: "مَعْزُول"
      entry_id: "{auto}"
      root: "عزل"
      maqayis_quote: "(عَزَلَ) الْعَيْنُ وَالزَّاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَنْحِيَةٍ وَإِمَالَةٍ تَقُولُ: عَزَلَ الْإِنْسَانُ الشَّيْءَ يَعْزِلُهُ، إِذَا نَحَّاهُ فِي جَانِبٍ."
    - lemma: "مَفْصُول"
      entry_id: "{auto}"
      root: "فصل"
      maqayis_quote: "(فَصَلَ) الْفَاءُ وَالصَّادُ وَاللَّامُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى تَمْيِيزِ الشَّيْءِ مِنَ الشَّيْءِ وَإِبَانَتِهِ عَنْهُ."
  per_sense:
