      maqayis_quote: "«النُّونُ وَالْوَاوُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى جُمُودٍ وَسُكُونِ حَرَكَةٍ. مِنْهُ النَّوْمُ.»"
