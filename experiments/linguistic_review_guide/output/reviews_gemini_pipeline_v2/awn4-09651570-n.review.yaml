      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دين","maqayis":"«الدَّالُ وَالْيَاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ إِلَيْهِ يَرْجِعُ فُرُوعُهُ كُلُّهَا. وَهُوَ جِنْسٌ مِنَ الِانْقِيَادِ، وَالذُّلِّ. فَالدِّينُ: الطَّاعَةُ...»"}'
