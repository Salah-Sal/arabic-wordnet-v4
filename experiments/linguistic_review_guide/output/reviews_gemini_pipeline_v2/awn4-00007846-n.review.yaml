stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جداً (دوران: كائن بشري، فرد من البشر)."
      - "نقص في التشكيل للمات الموجودة."
    observations: "المجموعة تغطي المفهوم الأساسي للكائن البشري كفرد مستقل، وجميع اللمات الحالية صحيحة ومركزية، لكنها تحتاج إلى إثراء بمرادفات فصيحة أخرى تعبر عن جوانب مختلفة من المفهوم (البيولوجي، السلالي، الإحصائي)."
  blind_candidates:
    - lemma: "آدَمِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى آدم عليه السلام، وهو مصطلح فصيح يعبر عن النوع الإنساني."
    - lemma: "بَشَرِيّ"
      generation_method: ishtiqaq
      justification: "وصف للنوع الإنساني من حيث خصائصه الظاهرية والبيولوجية."
    - lemma: "نَسَمَة"
      generation_method: majaz
      justification: "يُطلق على الفرد الواحد في سياق العدّ والإحصاء (إطلاق الروح على الجسد)."
    - lemma: "ذَات"
      generation_method: majaz
      justification: "تُستخدم في السياقات الفلسفية والقانونية للتعبير عن الفرد المستقل."

stage2_evidence:
  per_lemma:
    - lemma: "إِنْسَان"
      confirm:
        - text: "«الْإِنْسَان: نوع من أنواع العالم... يطلق على المذكر والمؤنث»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«الإنسان: الكامل الجامع لجميع العوالم الكونية»"
          source: "المناوي"
    - lemma: "شَخْص"
      confirm:
        - text: "«شَخْص؛ إنسان»"
          source: "المورد الحديث"
        - text: "«الشخص: سواد الإنسان إذا سما لك من بعد»"
          source: "مقاييس اللغة"
    - lemma: "فَرْد"
      confirm:
        - text: "«فرد: إنسان، شخص بعينه»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«الفرد: ما كان وحده»"
          source: "كتاب العين"
    - lemma: "آدَمِيّ"
      confirm:
        - text: "«الآدمي: منسوب إلى آدم، وهو الإنسان»"
          source: "المعجم الوسيط"
    - lemma: "بَشَر"
      confirm:
        - text: "«البشر: الإنسان (الواحد والجمع والمذكر والمؤنث فيه سواء)»"
          source: "المعجم الوسيط"
        - text: "«سمي البشر بشراً لظهورهم»"
          source: "مقاييس اللغة"
    - lemma: "نَسَمَة"
      confirm:
        - text: "«النسمة: إنسان، كل دابة فيها روح»"
          source: "التعريفات الفقهية"
        - text: "«أعتقت نسمة وأنت تريد عبداً أو أمة»"
          source: "المذكر والمؤنث لابن التستري"
    - lemma: "امْرُؤ"
      confirm:
        - text: "«أنت امرؤ بالحق لست بقائم»"
          source: "المحكم والمحيط الأعظم"
        - text: "«امرؤ: إنسان (للمذكر)»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "إنسان"
      decision: confirmed
      decision_reason: "اللفظ الأصلي والأشمل للنوع الإنساني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِنْسَان"
    - lemma: "شخص"
      decision: confirmed
      decision_reason: "يدل على الفرد المتميز بكيانه وظهوره."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَخْص"
    - lemma: "فرد"
      decision: confirmed
      decision_reason: "يدل على الإنسان كواحدة حسابية أو عضو مستقل في جماعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَرْد"
    - lemma: "آدَمِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح يربط الإنسان بأصله السلالي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "آدَمِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بَشَر"
      decision: confirmed
      decision_reason: "لفظ قرآني وفصيح يطلق على الواحد والجمع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بَشَر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَسَمَة"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم بكثرة في السياقات الإحصائية والحقوقية (نسمة سكانية)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَسَمَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "امْرُؤ"
      decision: confirmed
      decision_reason: "لفظ فصيح يعبر عن الإنسان في سياق اجتماعي أو أخلاقي، ويتميز بتغير حركة همزته حسب الإعراب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "امْرُؤ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "كائن بشري؛ فرد من البشر"
    assessment:
      decision: revise
      reason: "التعريف الحالي يكرر الكلمة المعرفة (بشري/بشر)، ويحتاج لأسلوب معجمي يحدد الجنس والفصل."
    authored:
      - type: terminological
        text: "كُلُّ كائِنٍ حَيٍّ يَنْتَمِي إِلى النَّوْعِ الإِنْسَانِيِّ، يَتَمَيَّزُ بِالعَقْلِ والنُّطْقِ والِانْتِصَابِ، سَواءٌ أَكَانَ ذَكَرًا أَمْ أُنْثَى."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "إِنْسَان"
        examples:
          - text: "خلق الله الإنسان في أحسن تقويم."
            type: usage
      - lemma: "شَخْص"
        examples:
          - text: "لا يجوز الحكم على الشخص من مظهره الخارجي."
            type: usage
      - lemma: "فَرْد"
        examples:
          - text: "لكل فرد في المجتمع حقوق وعليه واجبات."
            type: usage
      - lemma: "آدَمِيّ"
        examples:
          - text: "هذا تصرف لا يليق بأي كائن آدمي."
            type: usage
      - lemma: "بَشَر"
        examples:
          - text: "ما أنا إلا بشر مثلكم يوحى إلي."
            type: usage
      - lemma: "نَسَمَة"
        examples:
          - text: "يبلغ عدد سكان هذه المدينة مليون نسمة."
            type: usage
      - lemma: "امْرُؤ"
        examples:
          - text: "لكل امرئ من دهره ما تعودا."
            type: usage
            source: "المتنبي"
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "كُلُّ كائِنٍ حَيٍّ يَنْتَمِي إِلى النَّوْعِ الإِنْسَانِيِّ، يَتَمَيَّزُ بِالعَقْلِ والنُّطْقِ والِانْتِصَابِ، سَواءٌ أَكَانَ ذَكَرًا أَمْ أُنْثَى."}

stage5_enrichment:
  per_entry:
    - lemma: "إِنْسَان"
      entry_id: "{auto}"
      root: "أنس"
      maqayis_quote: "«الْهَمْزَةُ وَالنُّونُ وَالسِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ ظُهُورُ الشَّيْءِ، وَكُلُّ شَيْءٍ خَالَفَ طَرِيقَةَ التَّوَحُّشِ.»"
    - lemma: "شَخْص"
      entry_id: "{auto}"
      root: "شخص"
      maqayis_quote: "«الشِّينُ وَالْخَاءُ وَالصَّادُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي شَيْءٍ. مِنْ ذَلِكَ الشَّخْصُ، وَهُوَ سَوَادُ الْإِنْسَانِ إِذَا سَمَا لَكَ مِنْ بُعْدٍ.»"
    - lemma: "فَرْد"
      entry_id: "{auto}"
      root: "فرد"
      maqayis_quote: "«الْفَاءُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى وُحْدَةٍ. مِنْ ذَلِكَ الْفَرْدُ وَهُوَ الْوَتْرُ.»"
    - lemma: "آدَمِيّ"
      entry_id: "{auto}"
      root: "أدم"
      maqayis_quote: "«سُمِّيَ آدَمُ عَلَيْهِ السَّلَامُ؛ لِأَنَّهُ أَخَذَ مِنْ أَدَمَةِ الْأَرْضِ... وَالْعَرَبُ تَقُولُ مُؤْدَمٌ مُبْشَرٌ، أَيْ: قَدْ جَمَعَ لِينَ الْأَدَمَةِ وَخُشُونَةَ الْبَشَرَةِ.»"
    - lemma: "بَشَر"
      entry_id: "{auto}"
      root: "بشر"
      maqayis_quote: "«الْبَاءُ وَالشِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ: ظُهُورُ الشَّيْءِ مَعَ حُسْنٍ وَجَمَالٍ. فَالْبَشَرَةُ ظَاهِرُ جِلْدِ الْإِنْسَانِ... وَسُمِّيَ الْبَشَرُ بَشَرًا لِظُهُورِهِمْ.»"
    - lemma: "نَسَمَة"
      entry_id: "{auto}"
      root: "نسم"
      maqayis_quote: "«النُّونُ وَالسِّينُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خُرُوجِ نَفَسٍ، أَوْ رِيحٍ غَيْرِ شَدِيدَةِ الْهُبُوبِ... وَلِذَلِكَ سُمِّيَتِ النَّفْسُ نَسَمَةً.»"
    - lemma: "امْرُؤ"
      entry_id: "{auto}"
      root: "مرأ"
      maqayis_quote: "«الْمِيمُ وَالرَّاءُ وَالْهَمْزَةُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى صَلَاحِ الشَّيْءِ وَنَفْعِهِ... وَالْمَرْءُ: الْإِنْسَانُ.»"
  per_sense:
    - lemma: "إِنْسَان"
      sense_id: "{auto}"
      nuance: "اللفظ الجوهري الدال على النوع والمشرّف بالعقل."
      mwe: false
    - lemma: "شَخْص"
      sense_id: "{auto}"
      nuance: "يركز على الجانب الفردي والكيان الظاهر المتميز عن الآخرين."
      mwe: false
    - lemma: "فَرْد"
      sense_id: "{auto}"
      nuance: "يركز على الواحدية في العدد أو العضوية الفردية في الجماعة."
      mwe: false
    - lemma: "آدَمِيّ"
      sense_id: "{auto}"
      nuance: "يؤكد على النسب السلالي لآدم والكرامة الإنسانية."
      mwe: false
    - lemma: "بَشَر"
      sense_id: "{auto}"
      nuance: "يشير إلى الإنسان من حيث خصائصه الطبيعية والبيولوجية المشتركة."
      mwe: false
    - lemma: "نَسَمَة"
      sense_id: "{auto}"
      nuance: "يستخدم غالباً كوحدة إحصائية للتعبير عن النفوس البشرية."
      mwe: false
    - lemma: "امْرُؤ"
      sense_id: "{auto}"
      nuance: "يستخدم للإشارة إلى الإنسان في سياق أخلاقي أو أدبي رفيع."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"أنس","maqayis":"«الْهَمْزة والنُّون والسِّين أصْلٌ واحدٌ، وهُو ظهورُ الشَّيءِ، وكُلُّ شيءٍ خالَفَ طَريقةَ التَّوحُّشِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"شخص","maqayis":"«الشِّين والخاء والصَّاد أصْلٌ واحدٌ يدلُّ على ارتفاعٍ في شيءٍ. منه الشَّخصُ، وهو سوادُ الإنسانِ إذا سما لكَ من بُعْدٍ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فرد","maqayis":"«الفاء والراء والدال أصْلٌ صحيحٌ يدلُّ على وحدةٍ. من ذلك الفَرْدُ وهو الوترُ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"أدم","maqayis":"«سُمِّي آدمُ عليهِ السَّلامُ؛ لأنَّه أخِذَ من أدَمةِ الأرضِ... والعربُ تقولُ مُؤدمٌ مُبشرٌ، أي: قد جَمعَ لينَ الأدَمةِ وخُشونةَ البَشرةِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"بشر","maqayis":"«الباء والشين والراء أصْلٌ واحدٌ: ظهورُ الشَّيءِ مع حُسنٍ وجمالٍ. فالبَشرةُ ظاهرُ جلدِ الإنسانِ... وسُمِّي البَشرُ بشراً لظهورهم.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نسم","maqayis":"«النون والسِّين والميم أصْلٌ صحيحٌ يدلُّ على خُروجِ نفَسٍ، أو ريحٍ غيرِ شديدةِ الهُبوبِ... ولذلك سُمِّيتِ النَّفْسُ نَسمةً.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"مرأ","maqayis":"«الميم والراء والهمزة أصْلٌ صحيحٌ يدلُّ على صلاحِ الشَّيءِ ونفْعِهِ... والمَرْءُ: الإنسانُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ الجوهري الدال على النوع والمشرّف بالعقل.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params: {entity_type: synset, entity_id: "{synset_id}", score: 1.0}
