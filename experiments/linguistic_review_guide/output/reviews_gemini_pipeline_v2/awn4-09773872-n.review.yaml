      maqayis_quote: "«فَأَمَّا الْبَاءُ وَالرَّاءُ وَالْهَمْزَةُ فَأَصْلَانِ إِلَيْهِمَا تَرْجِعُ فُرُوعُ الْبَابِ: أَحَدُهُمَا الْخَلْقُ... وَالْأَصْلُ الْآخَرُ: التَّبَاعُدُ مِنَ الشَّيْءِ وَمُزَايَلَتُهُ، مِنْ ذَلِكَ الْبُرْءُ وَهُوَ السَّلَامَةُ مِنَ السُّقْمِ»"
