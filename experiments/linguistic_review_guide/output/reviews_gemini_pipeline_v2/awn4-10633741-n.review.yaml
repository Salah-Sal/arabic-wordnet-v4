stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي عبارة عن ترجمة حرفية بسيطة تفتقر إلى الصياغة المعجمية السليمة."
    observations: "المفهوم يعبر عن الفاعل الذي يقوم بفعل التحطيم أو التهشيم، وتصاغ هذه المعاني في العربية على صيغة اسم الفاعل (مُفَعِّل) من الأفعال المضعفة للدلالة على المبالغة والقوة في الفعل."
  blind_candidates:
    - lemma: "مُحَطِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (حَطَّمَ)، ويدل على من يكسر الأشياء بقوة."
    - lemma: "مُهَشِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (هَشَّمَ)، ويدل على من يكسر الأشياء الجوفاء أو الصلبة."
    - lemma: "كَاسِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (كَسَرَ)، وهو المعنى العام للمفهوم."
    - lemma: "مُكَسِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (كَسَّرَ) المضعف الذي يفيد التكثير والشدة."

stage2_evidence:
  per_lemma:
    - lemma: "مُحَطِّم"
      confirm:
        - text: "مُحَطِّم الذرّة: atom smasher"
          source: "المورد الحديث"
    - lemma: "مُهَشِّم"
      confirm:
        - text: "يُحَطِّم؛ يُهَشِّم: to smash"
          source: "المورد الحديث"
    - lemma: "كَاسِر"
      evidence_status: "no_material_found"
    - lemma: "مُكَسِّر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُحَطِّم"
      decision: confirmed
      decision_reason: "صيغة اسم الفاعل من الفعل (حطّم) تتطابق تماماً مع الدلالة الإنجليزية (smasher) التي تفيد الكسر بعنف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَطِّم"

    - lemma: "مُهَشِّم"
      decision: confirmed
      decision_reason: "اسم فاعل من الفعل (هشّم) الذي يعبر عن التكسير العنيف والتفتيت، وهو مرادف مناسب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُهَشِّم"

    - lemma: "كَاسِر"
      source: stage1
      decision: removed
      decision_reason: "دلالة الفعل (كسر) عامة وليست مخصصة للتحطيم العنيف، ويكتفى باللمّات المؤكدة."

    - lemma: "مُكَسِّر"
      source: stage1
      decision: removed
      decision_reason: "رغم صحته دلالياً، إلا أن (مُحَطِّم) و(مُهَشِّم) أكثر دقة في أداء معنى التحطيم القوي (smash)."

stage4_content:
  definition:
    current: "شخص يهشم شيئاً ما"
    assessment:
      decision: revise
      reason: "التعريف ترجمة حرفية ركيكة، ويجب صياغته بأسلوب معجمي عربي يعبر عن الفاعل والفعل بشمول."
    authored:
      - type: linguistic
        text: "مَن يَقُومُ بِتَكْسِيرِ الْأَشْيَاءِ وَتَحْطِيمِهَا بِعُنْفٍ وَقُوَّةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10633741-n"
          definition_index: 0
          text: "مَن يَقُومُ بِتَكْسِيرِ الْأَشْيَاءِ وَتَحْطِيمِهَا بِعُنْفٍ وَقُوَّةٍ."

  examples:
    per_lemma:
      - lemma: "مُحَطِّم"
        examples:
          - text: "أَلْقَتِ الشُّرْطَةُ الْقَبْضَ عَلَى مُحَطِّمِ زُجَاجِ السَّيَّارَاتِ."
            type: usage
      - lemma: "مُهَشِّم"
        examples:
          - text: "اسْتَخْدَمَ مُهَشِّمُ الصُّخُورِ مِطْرَقَةً ثَقِيلَةً فِي عَمَلِهِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَلْقَتِ الشُّرْطَةُ الْقَبْضَ عَلَى مُحَطِّمِ زُجَاجِ السَّيَّارَاتِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اسْتَخْدَمَ مُهَشِّمُ الصُّخُورِ مِطْرَقَةً ثَقِيلَةً فِي عَمَلِهِ."

