stage4_content:
  definition:
    current: "حالة يمتلك فيها البائعون معلومات لا يمتلكها المشترون (أو العكس) حول جانب من جوانب جودة المنتج."
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لكنه يفتقر للجنس القريب (ظاهرة/حالة اقتصادية) ولبيان النتيجة (اختلال توازن السوق)."
    authored:
      - type: terminological
        text: "ظاهرة اقتصادية ناتجة عن عدم تماثل المعلومات، حيث يمتلك أحد طرفي التعاقد (البائع عادة) معلومات أكثر دقة عن جودة السلعة من الطرف الآخر، مما يؤدي إلى غلبة السلع الرديئة في السوق."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-92448349-n"
          definition_index: 0
          text: "ظاهرة اقتصادية ناتجة عن عدم تماثل المعلومات، حيث يمتلك أحد طرفي التعاقد (البائع عادة) معلومات أكثر دقة عن جودة السلعة من الطرف الآخر، مما يؤدي إلى غلبة السلع الرديئة في السوق."
  examples:
    per_lemma:
      - lemma: "اِخْتِيَارٌ عَكْسِيٌّ"
        examples:
          - text: "يؤدي الاختيار العكسي في سوق التأمين الصحي إلى ارتفاع الأقساط لأن المرضى هم الأكثر إقبالاً على شراء التغطية."
            type: usage
      - lemma: "انْتِقَاءٌ سَلْبِيٌّ"
        examples:
          - text: "تعاني المصارف من الانتقاء السلبي عندما يتقدم المقترضون الأكثر خطورة لطلب القروض بمعدلات فائدة ثابتة."
            type: usage
      - lemma: "اِخْتِيَارٌ سَلْبِيٌّ"
        examples:
          - text: "أشار جورج أكرلوف في بحثه 'سوق الليمون' إلى كيف يمكن للاختيار السلبي أن يتسبب في انهيار سوق السيارات المستعملة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-92448349-n"
          text: "يعد الاختيار العكسي من أبرز مشكلات عدم تماثل المعلومات في الأسواق المالية."

