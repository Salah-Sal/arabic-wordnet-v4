stage1_review:
  assessment:
    concerns:
      - المصطلحات الموجودة (اختيار عكسي، انتقاء سلبي) مستخدمة في مجالات أخرى (الوراثة، النقل) بتعريفات مختلفة تماماً في بعض المعاجم التقنية.
      - غياب مصطلح "اختيار سلبي" رغم شيوعه في معاجم التأمين والبيئة للدلالة على ذات المفهوم الاقتصادي.
    observations: "المفهوم يعبر عن (Adverse Selection) في الاقتصاد، وهو مصطلح مركّب يصف خللاً في كفاءة السوق ناتجاً عن عدم تماثل المعلومات. المصطلحات العربية المعتمدة تتردد بين 'العكسي' و'السلبي' و'الضائر'."
  blind_candidates:
    - lemma: "اِخْتِيَارٌ سَلْبِيٌّ"
      generation_method: tarkib
      justification: "ترجمة اصطلاحية شائعة في أدبيات التأمين والاقتصاد الكلي، وتعبّر بدقة عن طبيعة الاختيار الذي يؤدي لنتائج غير مرغوبة."
    - lemma: "انْتِقَاءٌ ضِدِّيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن كون الاختيار يسير في اتجاه مضاد لمصلحة السوق أو الطرف الأقل حظاً في المعلومات."
    - lemma: "خِيَارٌ مُعَاكِسٌ"
      generation_method: tarkib
      justification: "تنويع على 'اختيار عكسي' باستخدام 'خيار' لتقليل اللبس مع عملية الاختيار الإجرائية."
    - lemma: "اِخْتِيَارٌ ضَائِرٌ"
      generation_method: tarkib
      justification: "ترجمة لـ (Adverse) بصفة 'ضائر' المستخدمة في المعاجم الطبية والتقنية للدلالة على التأثير السلبي أو المضر."

stage2_evidence:
  per_lemma:
    - lemma: "اختيار عكسي"
      confirm:
        - text: "انتقاء صفة أثناء التجربة عكس الصفة التي اختيرت سابقا فيها."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          conflict: "المعنى هنا وراثي بحت، لكن اللفظ هو ذاته المستخدم اقتصادياً."
    - lemma: "انتقاء سلبي"
      confirm:
        - text: "يتم استخدام إجراءالانتقاء السلبي في حالات التفريغ فقط..."
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "المعنى لوجستي (Negative Picking)، وليس اقتصادياً."
    - lemma: "اختيار سلبي"
      confirm:
        - text: "المبدأ الذي يقول أن معظم أولئك الذين يشترون عقدة التأمين يميلون إلى أن يكونون الأكثر عرضة للخطر... عند مفاوضات بين شخصين مع معلومات غير متماثلة فإن ذلك يحد من جودة المفاوضات. هذا يحدث عادة لأن الشخص مع مستوى جيد من المعلومات يمكن أن يتفاوض على عقدة بشروط أفضل."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
    - lemma: "انتقاء ضائر"
      confirm:
        - text: "«انتقاء ضائر»"
          source: "المعجم الطبي الموحد (2009)"

