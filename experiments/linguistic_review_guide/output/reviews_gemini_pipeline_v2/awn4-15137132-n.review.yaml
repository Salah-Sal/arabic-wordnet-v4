stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة حالياً عبارة عن مركب وصفي (مادة مزججة)، بينما يفضل البحث عن مصطلحات أحادية إن وجدت."
      - "التعريف الحالي جيد ولكنه يحتاج إلى صياغة معجمية أكثر دقة لتمييز المادة (Substance) عن العملية (Process)."
    observations: "المفهوم يشير إلى المادة الناتجة عن عملية التزجيج (vitrification)، وهي حالة مادية صلبة غير متبلورة. المصطلحات العربية تتراوح بين وصف المادة (مادة مزججة) وبين اسم الحالة أو النتيجة (تزجج)."
  blind_candidates:
    - lemma: "زُجَاجِيَّةٌ"
      generation_method: ishtiqaq
      justification: "اسم يدل على الحالة الزجاجية أو المادة التي اتخذت هذه الحالة، وهو وزن (فُعَالِيَّة) المناسب للخواص والمواد."
    - lemma: "مُزَجَّجٌ"
      generation_method: ishtiqaq
      justification: "اسم مفعول من (زجّج)، ويستخدم للدلالة على المادة التي تم تحويلها إلى زجاج."
    - lemma: "تَزَجُّجٌ"
      generation_method: ishtiqaq
      justification: "مصدر الفعل (تزجّج) الذي يدل على التحول إلى زجاج، ويطلق في السياقات العلمية على النتيجة أو الحالة الناتجة."
    - lemma: "مَادَّةٌ زُجَاجِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي شائع الاستخدام في الجيولوجيا وعلم المواد لوصف المواد غير المتبلورة."

stage2_evidence:
  per_lemma:
    - lemma: "مادة مزججة"
      evidence_status: "no_material_found"
    - lemma: "تزجيج"
      confirm:
        - text: "تكنولوجيا تستخدم لمعالجة بعض النفايات الخطيرة... مع إضافة مواد زجاجية حيث ينصهر الكل ويكون مادة متراصة تشبه الزجاج عندما تبرد"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "تحويل إلى مادة تشبه الزجاج في شفافيته."
          source: "معجم المصطلحات الطبية (ArabTerm)"
    - lemma: "تزجج"
      confirm:
        - text: "تحول المادة المتبلورة إلى زجاج"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
        - text: "تزجُّج ؛ تَنَكُّسٌ زُجاجِيّ"
          source: "المعجم الطبي الموحد"
    - lemma: "مزجج"
      confirm:
        - text: "بئر تفتيش طينيّ مُزجَّج ... أُنْبوب فخاريّ مُزَجَّج ... آجرة مزجّجة"
          source: "المعجم الموحد لمصطلحات المياه / المهنية"
    - lemma: "زجاجية"
      expands:
        - text: "مادة شفافة زلالية تنتج عن حرض المادة النشوانية."
          source: "معجم المصطلحات الطبية (ArabTerm)"

stage3_analysis:
  per_lemma:
    - lemma: "مادة مزججة"
      decision: confirmed
      decision_reason: "مصطلح دقيق فنياً يعبر عن المادة التي خضعت لعملية التزجيج، وهو يتوافق مع التصنيف الهرمي (مادة صلبة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّةٌ مُزَجَّجَةٌ"
    - lemma: "مُزَجَّجٌ"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم كاسم مفعول وكوحدة معجمية للدلالة على المادة أو الجسم الذي تم تزجيجه، وهو شائع في المصطلحات التقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُزَجَّجٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15137132-n"}
    - lemma: "تَزَجُّجٌ"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح العلمي الأكثر دقة في الجيولوجيا لوصف الحالة والنتيجة الزجاجية للتحول من الحالة المتبلورة، ويقابل Vitrification بدقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَزَجُّجٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15137132-n"}
    - lemma: "زُجَاجِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم للدلالة على المادة أو الخاصية الزجاجية، وهي مكملة للمجموعة في سياقات علمية وطبية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "زُجَاجِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15137132-n"}

stage4_content:
  definition:
    current: "مادة تحولت إلى زجاج؛ النتيجة الزجاجية لعملية التزجيج"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتاج إلى صياغة أكثر دقة لغويًا وعلميًا، مع توضيح طبيعة التحول."
    authored:
      - type: terminological
        text: "مادّةٌ صُلبةٌ تحوَّلت إلى حالةٍ زجاجيّةٍ غيرِ مُبلورةٍ بفعلِ الصَّهرِ أو الحرارة، أو هي النتيجةُ الماديّةُ لعمليّةِ التَّزَجُّج."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-15137132-n"
          definition_index: 0
          text: "مادّةٌ صُلبةٌ تحوَّلت إلى حالةٍ زجاجيّةٍ غيرِ مُبلورةٍ بفعلِ الصَّهرِ أو الحرارة، أو هي النتيجةُ الماديّةُ لعمليّةِ التَّزَجُّج."
  examples:
    per_lemma:
      - lemma: "مَادَّةٌ مُزَجَّجَةٌ"
        examples:
          - text: "يتمُّ صَهْرُ النفاياتِ النوويّةِ مع الزُّجاجِ لإنتاجِ مادةٍ مُزجَّجةٍ مستقرَّةٍ قابلةٍ للتخزين."
            type: usage
      - lemma: "تَزَجُّجٌ"
        examples:
          - text: "يؤدي التبريدُ السريعُ للحِممِ البركانيّةِ إلى تَزَجُّجِها وتكوُّنِ صخورِ الأوبسيديان."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-15137132-n"
          text: "يُعدُّ التَّزجُّجُ وسيلةً فعالةً لعزلِ الموادِّ السامةِ ضِمنَ كُتلٍ زجاجيّةٍ صلبةٍ."

