stage1_review:
  assessment:
    concerns:
      - "المصطلحات الحالية (ماكر، مخادع) عامة جداً ولا تخصيص فيها لسمة الروغان أو الغدر المرتبطة باللفظ الإنجليزي 'weasel'."
      - "نقص التشكيل في اللمات الموجودة."
    observations: "اللفظ الإنجليزي 'weasel' عند استخدامه لوصف البشر يشير إلى الشخص الذي يتهرب من المسؤولية أو يتصرف بمكر وغدر خفي. اللفظ العربي 'ثعلب' هو الأقرب استعارياً، بينما الألفاظ المشتقة مثل 'ختار' و'مراوغ' تعطي الدقة المطلوبة دلالياً."
  blind_candidates:
    - lemma: "ثَعْلَب"
      generation_method: majaz
      justification: "استعارة كلاسيكية مشهورة في العربية للشخص الماكر الروّاغ."
    - lemma: "خَتَّار"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من 'ختر' وهو الغدر الشديد، وردت في القرآن الكريم لوصف الغادر."
    - lemma: "مُرَاوِغ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'راغ'، ويصف بدقة الشخص الذي يتهرب بذكاء ومكر."
    - lemma: "مُدَاجٍ"
      generation_method: ishtiqaq
      justification: "من 'المداجاة' وهي مداراة العدو وإخفاء البغضاء والمكر به، وهي تناسب صفة 'sneaky'."

stage2_evidence:
  per_lemma:
    - lemma: "ثَعْلَب"
      confirm:
        - text: "«فلان ثَعْلَب في سياسته: ماكرٌ مراوِغ، متصف بالدّهاء والاحتيال»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«ثَعْلَبَ الرَّجلُ: تحايل وراغ كالثعلب»"
          source: "المعجم الوسيط"
        - text: "«مثعلب: ماكر، ماهر»"
          source: "تكملة المعاجم لدوزي"
    - lemma: "مَاكِر"
      confirm:
        - text: "«(2) شخص pl. ماكر» (في ترجمة weasel)"
          source: "المورد الحديث"
    - lemma: "مُخَادِع"
      confirm:
        - text: "«(3) مُنافِق؛ مُخادِع؛ ذو وَجْهَيْن.» (في ترجمة ambidextrous/weasel context)"
          source: "المورد الحديث"
    - lemma: "خَتَّار"
      confirm:
        - text: "«الخَتَّارُ: العَذَّار الغشوم... الختر الغدر»"
          source: "غريب القرآن لابن عباس"
        - text: "«وَمَا يَجْحَدُ بِآيَاتِنَا إِلَّا كُلُّ خَتَّارٍ كَفُورٍ... الختار الغدار»"
          source: "تفسير الفراء"
    - lemma: "مُرَاوِغ"
      confirm:
        - text: "«مُرَاوِغ: المخادع والمصارع»"
          source: "موسوعة السلطان قابوس"
        - text: "«(4) يروغ؛ يراوغ؛ يوارب» (في ترجمة weasel)"
          source: "المورد الحديث"
    - lemma: "مُدَاجٍ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "ثَعْلَب"
      decision: confirmed
      decision_reason: "أثبتت الأدلة استخدامه المجازي الفصيح لوصف الشخص الماكر الروّاغ، وهو المطابق الدقيق لروح اللفظ الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثَعْلَب"
    - lemma: "مَاكِر"
      decision: confirmed
      decision_reason: "مرادف عام صحيح ومدعوم في المعاجم الحديثة كترجمة للمصطلح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَاكِر"
    - lemma: "مُخَادِع"
      decision: confirmed
      decision_reason: "مرادف صحيح يعبر عن جانب الخداع في التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَادِع"
    - lemma: "خَتَّار"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ قرآني بليغ يعبر عن قمة الغدر (treacherous)، وهو إضافة نوعية للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خَتَّار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُرَاوِغ"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر بدقة عن جانب الروغان والتهرب (sneaky) الموجود في التعريف واللفظ الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُرَاوِغ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يُنظر إليه على أنه خائن أو متستر"
    assessment:
      decision: revise
      reason: "التعريف الحالي يفتقر إلى وصف طبيعة السلوك (الروغان والمكر) التي تميز هذا المفهوم."
    authored:
      - type: terminological
        text: "شخص غَدَّار أو مُخَادِع يَتَصَرَّف بِمَكْر وَتَسَتُّر لِتَجَنُّب المَسْؤُولِيَّة أو لإِذَاء الآخَرِين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شخص غَدَّار أو مُخَادِع يَتَصَرَّف بِمَكْر وَتَسَتُّر لِتَجَنُّب المَسْؤُولِيَّة أو لإِذَاء الآخَرِين."}
  examples:
    per_lemma:
      - lemma: "ثَعْلَب"
        examples:
          - text: "حَذَّرَ القَائِدُ جُنُودَهُ مِنْ هَذَا العَدُوِّ، فَهُوَ ثَعْلَبٌ يَمْكُرُ فِي الظَّلامِ."
            type: usage
      - lemma: "خَتَّار"
        examples:
          - text: "«وَمَا يَجْحَدُ بِآيَاتِنَا إِلَّا كُلُّ خَتَّارٍ كَفُورٍ»"
            type: quran
            source: "سورة لقمان: 32"
      - lemma: "مُرَاوِغ"
        examples:
          - text: "لَمْ يَسْتَطِعِ المُحَقِّقُ كَشْفَ الحَقِيقَةِ بِسَبَبِ إِجَابَاتِ المُرَاوِغِ الَّتِي لا تَنْتَهِي."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "حَذَّرَ القَائِدُ جُنُودَهُ مِنْ هَذَا العَدُوِّ، فَهُوَ ثَعْلَبٌ يَمْكُرُ فِي الظَّلامِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "«وَمَا يَجْحَدُ بِآيَاتِنَا إِلَّا كُلُّ خَتَّارٍ كَفُورٍ»"}

stage5_enrichment:
  per_entry:
    - lemma: "ثَعْلَب"
      entry_id: "{auto}"
      root: "ثعلب"
      maqayis_quote: "«الثَّعْلَبُ مَخْرَجُ الْمَاءِ مِنَ الْجَرِينِ. فَهَذَا مَأْخُوذٌ مِنْ ثَعَبَ، وَاللَّامُ فِيهِ زَائِدَةٌ.»"
    - lemma: "مَاكِر"
      entry_id: "{auto}"
      root: "مكر"
      maqayis_quote: "«الْمِيمُ وَالْكَافُ وَالرَّاءُ كَلِمَتَانِ مُتَبَايِنَتَانِ: إِحْدَاهُمَا الْمَكْرُ: الِاحْتِيَالُ وَالْخِدَاعُ.»"
    - lemma: "مُخَادِع"
      entry_id: "{auto}"
      root: "خدع"
      maqayis_quote: "«الْخَاءُ وَالدَّالُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ... فَمِنْهُ خَدَعْتُ الرَّجُلَ خَتَلْتُهُ. وَالْإِخْدَاعُ إِخْفَاءُ الشَّيْءِ.»"
    - lemma: "خَتَّار"
      entry_id: "{auto}"
      root: "ختر"
      maqayis_quote: "«الْخَاءُ وَالتَّاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى تَوَانٍ وَفُتُورٍ... وَمِنَ الْبَابِ الْخَتْرُ، وَهُوَ الْغَدْرُ، وَذَلِكَ أَنَّهُ إِذَا خَتَرَ فَقَدْ قَعَدَ عَنِ الْوَفَاءِ.»"
    - lemma: "مُرَاوِغ"
      entry_id: "{auto}"
      root: "روغ"
      maqayis_quote: "«الرَّاءُ وَالْوَاوُ وَالْغَيْنُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مَيْلٍ وَقِلَّةِ اسْتِقْرَارٍ. يُقَالُ رَاغَ الثَّعْلَبُ وَغَيْرُهُ يَرُوغُ.»"
  per_sense:
    - lemma: "ثَعْلَب"
      sense_id: "{auto}"
      nuance: "تأكيد على المكر والذكاء في الاحتيال (الاستعارة الحيوانية)."
      mwe: false
    - lemma: "خَتَّار"
      sense_id: "{auto}"
      nuance: "تأكيد على شدة الغدر ونقض العهود (صيغة مبالغة)."
      mwe: false
    - lemma: "مُرَاوِغ"
      sense_id: "{auto}"
      nuance: "تأكيد على كثرة الروغان والتهرب من الحقيقة أو المسؤولية."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ثعلب","maqayis":"«الثَّعْلَبُ مَخْرَجُ الْمَاءِ مِنَ الْجَرِينِ. فَهَذَا مَأْخُوذٌ مِنْ ثَعَبَ، وَاللَّامُ فِيهِ زَائِدَةٌ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تأكيد على المكر والذكاء في الاحتيال (الاستعارة الحيوانية).","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
