stage1_review:
  assessment:
    concerns:
      - "المعنى المعجمي المسجل لكلمة (حَاكّ) مجازي ويدل على الملح في الطلب والمثير للمشاكل، ولا يوجد تسجيل صريح للمعنى الحرفي الجسدي (من يحك جلده)."
      - "المفهوم الإنجليزي يعبر عن حالة فعلية مؤقتة، بينما قد تعطي الأوزان الصرفية المفردة إيحاء بالثبوت أو الحرفة في بعض السياقات."
    observations: "صيغة (حَاكّ) هي اسم فاعل صحيح ومقيس من الفعل (حَكَّ)، ورغم غياب معناها الحرفي في المعاجم القديمة التي ركزت على المعاني المجازية، تظل الصيغة سليمة لغوياً وتفي بالغرض كترجمة معجمية لمفهوم (scratcher)."
  blind_candidates:
    - lemma: "حَاكّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل قياسي من الفعل (حَكَّ)، يدل على من يقوم بفعل الحك."
    - lemma: "حَكَّاك"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة تفيد من يكثر من حك جلده أو يمتهن ذلك."
    - lemma: "هَارِش"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (هَرَشَ) التي تفيد معنى الحك الخفيف للجلد في اللغة."
    - lemma: "مُحْتَكّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (احْتَكَّ)، قد يعبر عمن يحك نفسه بقوة أو بشيء ما."

stage2_evidence:
  per_lemma:
    - lemma: "حَاكّ"
      contradicts:
        - text: "«الملحُّ في الطَّلَبِ صاحبُ الشَّرِّ (مجاز)»"
          source: "المعجم الكبير"
          conflict: "المعنى المسجل في المعاجم مجازي (المثير للشر والملح في الطلب) ولا يشير إلى المعنى الحرفي الجسدي (حك الجلد لتخفيف الحكة)."

stage3_analysis:
  per_lemma:
    - lemma: "حَاكّ"
      decision: confirmed
      decision_reason: "على الرغم من أن الاستعمال المعجمي الموثق للاسم (حَاكّ) انصرف غالباً إلى المعنى المجازي، إلا أن دلالته الأصلية كاسم فاعل من الفعل (حَكَّ) قياسية وصحيحة، وتمثل المقابل المعجمي الأقرب والأدق للمصطلح الإنجليزي المعبر عن الشخص الذي يحك جلده."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَاكّ"

stage4_content:
  definition:
    current: "شخص يحك جلده لتخفيف حكة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مفهوم ومباشر، لكن يمكن تحسين صياغته لتكون أوفق لأسلوب المعاجم العربية (باستخدام الموصول 'مَنْ' بدلاً من كلمة 'شخص')."
    authored:
      - type: linguistic
        text: "مَنْ يَحُكُّ جِلْدَهُ أَوْ مَوْضِعاً في جَسَدِهِ لِتَخْفِيفِ حِكَّةٍ أَوْ تَهَيُّجٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10583139-n"
          definition_index: 0
          text: "مَنْ يَحُكُّ جِلْدَهُ أَوْ مَوْضِعاً في جَسَدِهِ لِتَخْفِيفِ حِكَّةٍ أَوْ تَهَيُّجٍ."

  examples:
