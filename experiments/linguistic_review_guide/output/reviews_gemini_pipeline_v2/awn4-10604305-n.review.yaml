stage3_analysis:
  per_lemma:
    - lemma: "أَدَاة لِلْمُتْعَة الْجِنْسِيَّة"
      decision: removed
      decision_reason: "عبارة وصفية وتفسيرية لا ترقى لتكون وحدة معجمية مسكوكة (MWE)."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
            
    - lemma: "مَوْضُوع جِنْسِيّ"
      decision: confirmed
      decision_reason: "مصطلح معاصر مستقر في علم الاجتماع وعلم النفس (مرتبط بمفهوم التشييء الجنسي Objectification) للدلالة على الشخص الذي يُنظر إليه كأداة للإشباع."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْضُوعٌ جِنْسِيّ"

    - lemma: "شَيْءٌ جِنْسِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مرادف يعكس بدقة عملية التشييء الجنسي (Sexual Objectification) المتصلة بالمفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "شَيْءٌ جِنْسِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10604305-n"

    - lemma: "لُعْبَةٌ جِنْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مخصص في الأصل للأدوات والجمادات (Sex toys)، واستخدامه للإنسان يحمل طابعاً مجازياً قد يلتبس مع الدلالة الأساسية."
      evidence_assessment:
        case: no_material

    - lemma: "مَتَاعٌ جِنْسِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير أدبي أو مجازي ليس مصطلحاً علمياً أو معجمياً مستقراً."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "أي شخص يُنظر إليه ببساطة كأداة للإشباع الجنسي"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح وينقل معنى المفهوم (Objectification) بشكل سليم دون حاجة للتعديل."
  examples:
    per_lemma:
      - lemma: "مَوْضُوعٌ جِنْسِيّ"
        examples:
          - text: "انتقدت الدراسة ظاهرة تسليع المرأة والنظر إليها كمجرد موضوع جنسي في بعض وسائل الإعلام."
            type: usage
      - lemma: "شَيْءٌ جِنْسِيّ"
        examples:
          - text: "يؤدي التشييء إلى اختزال الإنسان في كونه شيئاً جنسياً مجرداً من إنسانيته."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "انتقدت الدراسة ظاهرة تسليع المرأة والنظر إليها كمجرد موضوع جنسي في بعض وسائل الإعلام."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يؤدي التشييء إلى اختزال الإنسان في كونه شيئاً جنسياً مجرداً من إنسانيته."

