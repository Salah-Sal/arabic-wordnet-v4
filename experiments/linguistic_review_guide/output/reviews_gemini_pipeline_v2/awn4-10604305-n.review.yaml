    - lemma: "مَوْضُوعٌ جِنْسِيّ"
      evidence_status: "no_material_found"
    - lemma: "شَيْءٌ جِنْسِيّ"
      evidence_status: "no_material_found"
    - lemma: "لُعْبَةٌ جِنْسِيَّة"
      evidence_status: "no_material_found"
    - lemma: "مَتَاعٌ جِنْسِيّ"
