stage1_review:
  assessment:
    concerns:
      - "اللمة الأولى (أداة للمتعة الجنسية) عبارة وصفية تفسيرية وليست مصطلحاً مسكوكاً."
      - "اللمة الثانية (موضوع جنسي) تفتقر إلى التشكيل الكامل."
    observations: "اللمة (موضوع جنسي) تمثل اصطلاحاً معاصراً دقيقاً في علم النفس والاجتماع، ومقابلاً مباشراً لمفهوم (Sex object) الناتج عن التشييء الجنسي (Sexual objectification)."
  blind_candidates:
    - lemma: "مَوْضُوعٌ جِنْسِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعكس الترجمة الاصطلاحية الشائعة للمفهوم في العلوم الإنسانية."
    - lemma: "شَيْءٌ جِنْسِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي مشتق من مفهوم التشييء (Objectification)."
    - lemma: "لُعْبَةٌ جِنْسِيَّة"
      generation_method: majaz
      justification: "إزاحة دلالية باستخدام تعبير يُطلق على الجماد للدلالة على الشخص المسلوب الإرادة (كناية)."
    - lemma: "مَتَاعٌ جِنْسِيّ"
      generation_method: majaz
      justification: "استخدام مجازي لمفهوم المتاع الذي يُنتفع به ليشمل الإنسان."

stage2_evidence:
  per_lemma:
    - lemma: "أَدَاة لِلْمُتْعَة الْجِنْسِيَّة"
