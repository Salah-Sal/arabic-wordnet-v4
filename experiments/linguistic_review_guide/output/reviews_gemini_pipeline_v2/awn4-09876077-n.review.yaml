stage1_review:
  assessment:
    concerns:
      - "المسند إليه (Hypernym) 'عَامِل' أو 'فَاعِل' غير دقيق دلالياً للمولود في السياق العربي، حيث يشير 'عامل' عادة إلى المشتغل أو الأجير، بينما 'مولود' هو كائن في طور البداية."
      - "التعريف الحالي 'طفل مولود؛ نسل' يدمج بين الفرد (المولود) والجماعة أو المفهوم العام (النسل)، والأفضل الفصل أو التوضيح."
      - "اللمة الإنجليزية 'birth' تستخدم أحياناً بمعنى النسل (offspring) ولكنها في الغالب تشير لعملية الولادة، والأنسب 'newborn' أو 'offspring'."
    observations: "المجموعة تغطي مفهوم الكائن البشري في أول عهده بالولادة، وتمتد لتشمل المعنى العام للنسل والذرية. اللمات المقترحة تهدف لاستيعاب هذه التدرجات الدلالية (الوليد للحظة الولادة، والنسل والنجل للعلاقة بالأصل)."
  blind_candidates:
    - lemma: "وَلِيد"
      generation_method: ishtiqaq
      justification: "اشتقاق مباشر من جذر (ولد) على وزن (فعيل) للمبالغة أو الصفة الثابتة، وهو المصطلح العربي الأدق للمولود حديثاً."
    - lemma: "نَسْل"
      generation_method: ishtiqaq
      justification: "اسم جنس يطلق على الولد والذرية، وهو مذكور في التعريف الحالي كمرادف."
    - lemma: "سَلِيل"
      generation_method: ishtiqaq
      justification: "لفظ تراثي بليغ يطلق على الولد حين يخرج من بطن أمه، كأنه سُلَّ منه سلاً."
    - lemma: "نَجْل"
      generation_method: ishtiqaq
      justification: "يستخدم للدلالة على الولد والنسل، وغالباً ما يضاف للأب (نجل فلان)."

stage2_evidence:
  per_lemma:
    - lemma: "مَوْلُود"
      confirm:
        - text: "«(المَوْلُود) الصغير لقرب عهده من الولادة»"
          source: "المعجم الوسيط"
        - text: "«المولود: يقال للصغير لقرب عهده من الولادة»"
          source: "التعريفات الفقهية للبركتي"
    - lemma: "وَلِيد"
      confirm:
        - text: "«(وَلِيد) من (و ل د) المولود حين يولد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الوليد: المولود حين يولد»"
          source: "المعجم الموحد لمصطلحات علم التشريح"
    - lemma: "نَسْل"
      confirm:
        - text: "«النَّسْل: الولد والذرِّية، والجمع أَنسال»"
          source: "لسان العرب"
        - text: "«النَّسْل: الذرية الناتجة من التكاثر»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
    - lemma: "سَلِيل"
      confirm:
        - text: "«السليل: الولد لأنه مستل من أبيه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(السَّلِيل) المسلول والولد حين يخرج من بطن أمه»"
          source: "المعجم الوسيط"
    - lemma: "نَجْل"
      confirm:
        - text: "«النَّجْلُ: الوَلَدُ، والوالِدُ، ضِدٌّ»"
          source: "القاموس المحيط"
        - text: "«(النجل) الْوَلَد وَيُقَال هُوَ كريم النجل طيب الأَصْل والطبع»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "مَوْلُود"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والمباشر للمفهوم، ومدعوم بقوة في المعاجم الحديثة والقديمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْلُود"
    - lemma: "وَلِيد"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق يركز على زمن الولادة (حديث الولادة)، وهو مستخدم طبياً وأدبياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "وَلِيد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَسْل"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح أساسي يغطي جانب 'الذرية' المذكور في التعريف، وهو اسم جمعي وفردي في آن."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَسْل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "سَلِيل"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ بليغ يضيف بعداً تراثياً وأدبياً للمجموعة، ويستخدم بكثرة في سياق النسب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سَلِيل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَجْل"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف شائع للابن والنسل، ويناسب سياق الانتساب للأب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَجْل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "طفل مولود؛ نسل"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويخلط بين الفرد والنسل دون رابط لغوي واضح."
    authored:
      - type: linguistic
        text: "الكَائِنُ البَشَرِيُّ حِينَ يُولَدُ؛ وَيُطْلَقُ عَلَى الذُّرِّيَّةِ وَالنَّسْلِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "الكَائِنُ البَشَرِيُّ حِينَ يُولَدُ؛ وَيُطْلَقُ عَلَى الذُّرِّيَّةِ وَالنَّسْلِ."}
  examples:
    per_lemma:
      - lemma: "مَوْلُود"
        examples:
          - text: "رُزِقَتِ العَائِلَةُ بِمَوْلُودٍ جَدِيدٍ أَدْخَلَ البَهْجَةَ عَلَى قُلُوبِهِمْ."
            type: usage
      - lemma: "وَلِيد"
        examples:
          - text: "يَحْتَاجُ الطِّفْلُ الوَلِيدُ إِلَى رِعَايَةٍ خَاصَّةٍ فِي أَيَّامِهِ الأُولَى."
            type: usage
      - lemma: "نَسْل"
        examples:
          - text: "يَسْعَى كُلُّ كَائِنٍ حَيٍّ لِلْحِفَاظِ عَلَى نَسْلِهِ مِنَ الانْقِرَاضِ."
            type: usage
      - lemma: "سَلِيل"
        examples:
          - text: "هُوَ سَلِيلُ أُسْرَةٍ عَرِيقَةٍ عُرِفَتْ بِالعِلْمِ وَالأَدَبِ."
            type: usage
      - lemma: "نَجْل"
        examples:
          - text: "حَضَرَ الحَفْلَ نَجْلُ الرَّئِيسِ مُمَثِّلاً عَنْ وَالِدِهِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعَدُّ المَوْلُودُ نِعْمَةً كَبِيرَةً تَقَرُّ بِهَا أَعْيُنُ الوالِدَيْنِ."}

stage5_enrichment:
  per_entry:
    - lemma: "مَوْلُود"
      entry_id: "{auto}"
      root: "ولد"
      maqayis_quote: "«الْوَاوُ وَاللَّامُ وَالدَّالُ: أَصْلٌ صَحِيحٌ، وَهُوَ دَلِيلُ النَّجْلِ وَالنَّسْلِ، ثُمَّ يُقَاسُ عَلَيْهِ غَيْرُهُ. مِنْ ذَلِكَ الْوَلَدِ.»"
    - lemma: "وَلِيد"
      entry_id: "{auto}"
      root: "ولد"
      maqayis_quote: "«الْوَاوُ وَاللَّامُ وَالدَّالُ: أَصْلٌ صَحِيحٌ... وَالْوَلِيدَةُ الْأُنْثَى، وَالْجَمْعُ وَلَائِدُ.»"
    - lemma: "نَسْل"
      entry_id: "{auto}"
      root: "نسل"
      maqayis_quote: "«النُّونُ وَالسِّينُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَلِّ شَيْءٍ وَانْسِلَالِهِ. وَالنَّسْلُ: الْوَلَدُ. لِأَنَّهُ يُنْسَلُ مِنْ وَالِدَتِهِ.»"
    - lemma: "سَلِيل"
      entry_id: "{auto}"
      root: "سلل"
      maqayis_quote: "«السِّينُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ مَدُّ الشَّيْءِ فِي رِفْقٍ وَخَفَاءٍ... وَالسَّلِيلُ: الْوَلَدُ ; كَأَنَّهُ سُلَّ مِنْ أُمِّهِ سَلًّا.»"
    - lemma: "نَجْل"
      entry_id: "{auto}"
      root: "نجل"
      maqayis_quote: "«النُّونُ وَالْجِيمُ وَاللَّامُ أَصْلَانِ صَحِيحَانِ... وَمِنَ الْبَابِ النَّجْلُ، وَهُوَ النَّسْلُ، لِأَنَّ الْوَالِدَةَ كَأَنَّهَا تَرْمِي بِهِ.»"
  per_sense:
    - lemma: "مَوْلُود"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشائع للصغير عند ولادته."
      mwe: false
    - lemma: "وَلِيد"
      sense_id: "{auto}"
      nuance: "تؤكد على حداثة الولادة (اللحظات أو الأيام الأولى)."
      mwe: false
    - lemma: "نَسْل"
      sense_id: "{auto}"
      nuance: "تشير للذرية كناتج لعملية التكاثر والامتداد العائلي."
      mwe: false
    - lemma: "سَلِيل"
      sense_id: "{auto}"
      nuance: "لفظ أدبي يؤكد على الانحدار والنسب (خروج الشيء من أصله)."
      mwe: false
    - lemma: "نَجْل"
      sense_id: "{auto}"
      nuance: "تستخدم غالباً في سياق البنوة والانتساب المباشر للأب."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ولد","maqayis":"«الْوَاوُ وَاللَّامُ وَالدَّالُ: أَصْلٌ صَحِيحٌ، وَهُوَ دَلِيلُ النَّجْلِ وَالنَّسْلِ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ العام والشائع للصغير عند ولادته.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
