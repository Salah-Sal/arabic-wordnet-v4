stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي 'عملية الإهدار' تعريف دوري (تستخدم فيه كلمة من الجذر نفسه)."
      - "اللمّات الحالية 'هدر' و 'ضياع' صحيحة ولكنها غير كافية لتغطية المصطلح التقني wastage."
    observations: "المجموعة تعبر عن عملية الهدر المادي أو المعنوي (وقت، طاقة، مال). اللمّات المقترحة تهدف لتعزيز الدقة في السياقات التقنية والاقتصادية."
  blind_candidates:
    - lemma: "إِهْدَار"
      generation_method: ishtiqaq
      justification: "المصدر الصريح لعملية الإهدار (Wasting) وهو الأكثر تداولاً في السياق الرسمي."
    - lemma: "تَبْدِيد"
      generation_method: ishtiqaq
      justification: "يستخدم لوصف هدر الموارد المالية أو تبدد الطاقة (Dissipation)."
    - lemma: "إِضَاعَة"
      generation_method: ishtiqaq
      justification: "يعبر عن فعل الضياع المتعمد أو غير المتعمد للموارد."
    - lemma: "إِتْلَاف"
      generation_method: ishtiqaq
      justification: "عملية إلحاق التلف بالشيء بحيث لا يُنتفع به."

stage2_evidence:
  per_lemma:
    - lemma: "هَدْر"
      confirm:
        - text: "«هدَر الأموالَ: أضاعَهَا، فقَدها (هدَر طاقَتَهُ/ الجُهْدَ)»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«ذهَب سعيُه هَدْرًا: باطلاً»"
          source: "المعجم الوسيط"
    - lemma: "ضَيَاع"
      confirm:
        - text: "«(فى الاقتصاد): إساءةُ استعمال الموارد الاقتصادية، حين تُستخدم لإشباع حاجاتٍ أقلَّ في كميتها أو أهميتها ممَّا كان يمكن إشباعه بها»"
          source: "المعجم الكبير"
    - lemma: "إِهْدَار"
      confirm:
        - text: "«يعبر عن ذلك، بوفورات سلبية، وهو حساب الآثار السلبية للنمو الصناعي...»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
    - lemma: "تَبْدِيد"
      confirm:
        - text: "«تبديد الطاقة الضوئية التي تحولت إلى حرارة»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«هيكل قادر على تبديد الطاقة عن طريق سلوك الدكتايل...»"
          source: "المعجم الموحد لمصطلحات النقل"
    - lemma: "إِضَاعَة"
      confirm:
        - text: "«للاكتفاء به عن إضاعة الأوقات في طلب الأقوات»"
          source: "أبجد العلوم"
        - text: "«أَضَعْتُهُ أَنَا إِضَاعَةً»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "هَدْر"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومباشر للمفهوم، وموثق في المعاجم الحديثة والقديمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَدْر"
    - lemma: "ضَيَاع"
      decision: confirmed
      decision_reason: "يعبر عن نتيجة الهدر في السياق الاقتصادي والعملي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ضَيَاع"
    - lemma: "إِهْدَار"
      source: stage1
      decision: confirmed
      decision_reason: "المصدر الصريح للفعل 'أهدر'، وهو الأكثر شيوعاً كعملية إدارية واقتصادية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِهْدَار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَبْدِيد"
      source: stage1
      decision: confirmed
      decision_reason: "دقيق جداً في سياق تبديد الطاقة (dissipation) وتبديد الموارد المالية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَبْدِيد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "إِضَاعَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر الفعل 'أضاع' الذي يعني جعل الشيء يضيع، وهو مرادف قوي لـ wastage."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِضَاعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عملية الإهدار"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويستخدم مصطلحاً من نفس الجذر."
    authored:
      - type: terminological
        text: "عملية صَرْف الموارد أو استنفادها بلا طائل أو فائدة حقيقية، وتُستخدم خاصة في سياق المال والوقت والطاقة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية صَرْف الموارد أو استنفادها بلا طائل أو فائدة حقيقية، وتُستخدم خاصة في سياق المال والوقت والطاقة."}
  examples:
    per_lemma:
      - lemma: "هَدْر"
        examples:
          - text: "يجب العمل على تقليل هَدْر الموارد الطبيعية لضمان استدامتها."
            type: usage
      - lemma: "ضَيَاع"
        examples:
          - text: "أدى غياب التنسيق بين الأقسام إلى ضَيَاع الكثير من الجهد والمال."
            type: usage
      - lemma: "إِهْدَار"
        examples:
          - text: "تعتبر هذه المشروعات غير المدروسة إِهْدَاراً للمال العام."
            type: usage
      - lemma: "تَبْدِيد"
        examples:
          - text: "تتميز هذه الأجهزة بقدرتها العالية على تَبْدِيد الحرارة بكفاءة."
            type: usage
      - lemma: "إِضَاعَة"
        examples:
          - text: "إِضَاعَة الفرص المتاحة قد تؤدي إلى تراجع القدرة التنافسية للشركة."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "هَدْر"
      entry_id: "{auto}"
      root: "هدر"
      maqayis_quote: "«الْهَاءُ وَالدَّالُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى سُقُوطِ شَيْءٍ وَإِسْقَاطِهِ، وَعَلَى جِنْسٍ مِنَ الصَّوْتِ.»"
    - lemma: "ضَيَاع"
      entry_id: "{auto}"
      root: "ضيع"
      maqayis_quote: "«الضَّادُ وَالْيَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَوْتِ الشَّيْءِ وَذَهَابِهِ وَهَلَاكِهِ.»"
    - lemma: "إِهْدَار"
      entry_id: "{auto}"
      root: "هدر"
      maqayis_quote: "«الْهَاءُ وَالدَّالُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى سُقُوطِ شَيْءٍ وَإِسْقَاطِهِ...»"
    - lemma: "تَبْدِيد"
