    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عبد","maqayis":"«الْعَيْنُ وَالْبَاءُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، كَأَنَّهُمَا مُتَضَادَّانِ، وَالْأَوَّلُ مِنْ ذَيْنِكَ الْأَصْلَيْنِ يَدُلُّ عَلَى لِينٍ وَذُلٍّ، وَالْآخَرُ عَلَى شِدَّةٍ وَغِلَظٍ.»"}'
    - command: set_metadata
