stage1_review:
  assessment:
    concerns:
      - "المعنى هنا مجازي يشير إلى الخضوع التام لتأثير معنوي (مثل العادات أو التقاليد) أو لشخص ما، وليس الرق أو الأسر بالمعنى الحرفي المادي."
    observations: "المصطلحان 'أسير' و'عبد' يُستخدمان في العربية بكثرة في السياقات المجازية للتعبير عن هذا المفهوم، مثل 'عبد المال' أو 'أسير الهوى'، وهما يعبران بدقة عن حالة سلب الإرادة التامة."
  blind_candidates:
    - lemma: "مُسْتَعْبَد"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (عبد) للدلالة على من وقع عليه فعل الاستعباد وسلب الإرادة والتأثير المطلق."
    - lemma: "صَرِيع"
      generation_method: majaz
      justification: "مجاز لمن غلبه تأثير ما حتى أوقعه وأفقده إرادته، مثل (صريع الهوى) أو (صريع الكأس)."
    - lemma: "مُنْقَاد"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (قود) للدلالة على الشخص المسلوب الإرادة الذي يتبع غيره تماماً."
    - lemma: "خَاضِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من خضع، يعبر عن الانقياد التام والاستسلام للتأثير."

stage2_evidence:
  per_lemma:
    - lemma: "عَبْد"
      confirm:
        - text: "وأسير التقليد: عبد التقاليد (بوشر)."
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "العَبْدُ: الإِنْسانُ حُرَّاً كان أو رقيقاً، والمَمْلوكُ."
          source: "القاموس المحيط للفيروزآبادي"
    - lemma: "أَسِير"
      confirm:
        - text: "أسير: مؤنثه أسيرة: عبد، رقيق (بوشر). وأسير التقليد: عبد التقاليد (بوشر)."
          source: "تكملة المعاجم العربية لرينهارت دوزي"
    - lemma: "مُسْتَعْبَد"
      expands:
        - text: "واستعبده: اتخذه عبدا"
          source: "المحكم والمحيط الأعظم"
    - lemma: "صَرِيع"
      confirm:
        - text: "(الصريع) المصروع يُقَال بَات صريع الكأس وَالْمَجْنُون (ج) صرعى"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "مُنْقَاد"
      evidence_status: "no_material_found"
    - lemma: "خَاضِع"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أَسِير"
      decision: confirmed
      decision_reason: "الكلمة دقيقة وتعبر مجازاً عن سلب الإرادة والوقوع تحت تأثير شيء ما بشكل قسري، مثل 'أسير العادة'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَسِير"
    - lemma: "عَبْد"
      decision: confirmed
      decision_reason: "تُستخدم مجازاً للدلالة على الخضوع المطلق والتام لتأثير ما لدرجة تماثل الرق المادي، مثل 'عبد الدرهم' و'عبد الشهوات'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَبْد"
    - lemma: "مُسْتَعْبَد"
      source: stage1
      decision: removed
      decision_reason: "كلمة صحيحة لغوياً، لكن 'عبد' و'أسير' أكثر شيوعاً وأبلغ في التعبير عن المعنى المجازي المقصود في هذه المجموعة."
    - lemma: "صَرِيع"
      source: stage1
      decision: removed
      decision_reason: "تخص أكثر من غلبه التأثير حتى أسقطه وأهلكه وتأتي بمعنى مغلوب، بينما المجموعة تركز على الخضوع والتبعية المستمرة."
    - lemma: "مُنْقَاد"
      source: stage1
      decision: removed
      decision_reason: "أقل قوة في الدلالة على سلب الإرادة التام مقارنة بـ 'عبد' و'أسير'."
    - lemma: "خَاضِع"
      source: stage1
      decision: removed
      decision_reason: "تحمل معنى الانقياد لكنها قد تكون طوعية، ولا تفيد بالضرورة التبعية التامة المجازية التي تفيدها 'عبد'."

stage4_content:
  definition:
    current: "شخص خاضع تماماً لتأثير ما أو لشخص ما"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وموجز ويعبر عن المفهوم بوضوح وتطابق تام مع التعريف الإنجليزي."
  examples:
    per_lemma:
      - lemma: "أَسِير"
        examples:
          - text: "ظلَّ الشاب أسيرَ عاداته السيئة ولم يستطع التخلص منها."
            type: usage
      - lemma: "عَبْد"
        examples:
          - text: "لا تكن عبداً للمال فتخسر مبادئك."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "ظلَّ الشاب أسيرَ عاداته السيئة ولم يستطع التخلص منها."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "لا تكن عبداً للمال فتخسر مبادئك."}

stage5_enrichment:
  per_entry:
    - lemma: "أَسِير"
      entry_id: "{auto}"
      root: "اسر"
      maqayis_quote: "«الْهَمْزَةُ وَالسِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَقِيَاسٌ مُطَّرِدٌ، وَهُوَ الْحَبْسُ، وَهُوَ الْإِمْسَاكُ.»"
    - lemma: "عَبْد"
      entry_id: "{auto}"
      root: "عبد"
      maqayis_quote: "«الْعَيْنُ وَالْبَاءُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، كَأَنَّهُمَا مُتَضَادَّانِ، وَالْأَوَّلُ مِنْ ذَيْنِكَ الْأَصْلَيْنِ يَدُلُّ عَلَى لِينٍ وَذُلٍّ، وَالْآخَرُ عَلَى شِدَّةٍ وَغِلَظٍ.»"
  per_sense:
