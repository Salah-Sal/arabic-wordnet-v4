stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي بسيط للغاية ويحتاج لضبط صياغته المعجمية."
      - "الاكتفاء بكلمة واحدة (منتظر) قد لا يغطي الظلال الدلالية المختلفة للانتظار (الترقب، التحين)."
    observations: "المجموعة تعبر عن الشخص الذي يقضي وقته في انتظار وقوع حدث أو وصول شخص. اللفظ الأساسي هو 'مُنتظِر'، وهناك مرادفات قوية مثل 'مترقِّب' و'مرتقِب' تضيف معنى اليقظة والانتباه أثناء الانتظار."
  blind_candidates:
    - lemma: "مُنْتَظِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل قياسي من الفعل (انتظر)، وهو اللفظ الأكثر شيوعاً ومباشرة للمفهوم."
    - lemma: "مُتَرَقِّب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (ترقَّب)، يفيد انتظار الشيء مع رصده ومراقبته."
    - lemma: "مُرْتَقِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (ارتقب)، مرادف للمنتظر مع دلالة على تطلع النفس للشيء."
    - lemma: "مُتَحَيِّن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (تحيَّن)، وهو الذي ينتظر الوقت المناسب (الحين) لفعل شيء."

stage2_evidence:
  per_lemma:
    - lemma: "مُنْتَظِر"
      confirm:
        - text: "مُنْتَظِر: من (ن ظ ر) المترقب والمتوقع، والمتأني."
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "يقولون: نظرتُه، أي انتظرته. وهو ذلك القياس، كأنه ينظر إلى الوقت الذي يأتي فيه."
          source: "مقاييس اللغة لابن فارس"
    - lemma: "مُتَرَقِّب"
      confirm:
        - text: "مُتَوقِّع؛ مُتَرقِّب"
          source: "المورد الحديث"
        - text: "الرَّاءُ وَالْقَافُ وَالْبَاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى انْتِصَابٍ لِمُرَاعَاةِ شَيْءٍ."
          source: "مقاييس اللغة (جذر رقب)"
    - lemma: "مُرْتَقِب"
      confirm:
        - text: "المُتَوقِّع؛ المُرْتَقِب. وبخاصة: المُرَشَّح لمنصب."
          source: "المورد الحديث"
    - lemma: "مُتَحَيِّن"
      confirm:
        - text: "تَحَيَّنَ وقتَ الصلاة: طلب وقتَها. وتحيّن الفُرصَةَ: انتظر الوقتَ المناسبَ وترقَّبه."
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
