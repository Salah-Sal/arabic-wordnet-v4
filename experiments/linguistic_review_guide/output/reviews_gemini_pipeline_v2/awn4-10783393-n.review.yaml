          params: {lemma: "مُرْتَقِب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10783393-n"}
    - lemma: "مُتَحَيِّن"
      source: stage1
      decision: confirmed
      decision_reason: "يصلح للتعبير عن المنتظر الذي يترصد وقتاً بعينه (الحين)، وهو اشتقاق صحيح ومستعمل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُتَحَيِّن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10783393-n"}

stage4_content:
  definition:
    current: "شخص ينتظر أو يترقب"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، ويفضل استخدام صياغة معجمية أكثر دقة."
    authored:
      - type: terminological
        text: "مَنْ يَنْتَظِرُ حُدُوثَ أَمْرٍ أَوْ وُصُولَ شَخْصٍ، أَوْ يَتَرَقَّبُ وَقْتًا مُعَيَّنًا لِفِعْلِ شَيْءٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-10783393-n", definition_index: 0, text: "مَنْ يَنْتَظِرُ حُدُوثَ أَمْرٍ أَوْ وُصُولَ شَخْصٍ، أَوْ يَتَرَقَّبُ وَقْتًا مُعَيَّنًا لِفِعْلِ شَيْءٍ."}
  examples:
    per_lemma:
      - lemma: "مُنْتَظِر"
        examples:
          - text: "ظَلَّ المُسَافِرُ مُنْتَظِرًا فِي المَحَطَّةِ لِسَاعَاتٍ طَوِيلَةٍ."
            type: usage
      - lemma: "مُتَرَقِّب"
        examples:
          - text: "كَانَ الجُمْهُورُ مُتَرَقِّبًا لإِعْلَانِ النَّتَائِجِ النِّهَائِيَّةِ."
            type: usage
      - lemma: "مُرْتَقِب"
        examples:
          - text: "وَقَفَ العَالِمُ مُرْتَقِبًا ظُهُورَ المُلَاحَظَاتِ المَخْبَرِيَّةِ الجَدِيدَةِ."
            type: usage
      - lemma: "مُتَحَيِّن"
        examples:
          - text: "يَبْقَى الصَّيَّادُ مُتَحَيِّنًا الفُرْصَةَ المُنَاسِبَةَ لِإِطْلَاقِ سَهْمِهِ."
            type: usage

