        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْتَظِر"
    - lemma: "مُتَرَقِّب"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي يضيف معنى الانتظار مع اليقظة والانتباه، وهو شائع الاستخدام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
