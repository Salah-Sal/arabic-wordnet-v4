stage1_review:
  assessment:
    concerns:
      - "خلو اللمات الحالية من التشكيل الكامل."
      - "اللمة 'ضاغط' تستخدم في المجالات التقنية بمعنى (compressor)، ولكنها صحيحة مجازيا في علم النفس كمرادف لـ (stressor)."
    observations: "المجموعة الحالية تعبر بشكل جيد عن المفهوم من خلال التنوع بين التركيب (عامل إجهاد) والاشتقاق (موتّر، ضاغط)."
  blind_candidates:
    - lemma: "مُجْهِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (أجهد)، يدل على ما يوقع الإجهاد."
    - lemma: "مُوَتِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (وتّر)، يدل على ما يسبب التوتر."
    - lemma: "عَامِلُ ضَغْطٍ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر عن المسبب للضغط النفسي أو الجسدي."
    - lemma: "مُرْهِق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (أرهق)، يدل على مسبب الإرهاق."

stage2_evidence:
  per_lemma:
    - lemma: "ضاغط"
      confirm:
        - text: "«الرَّقِيب الْأمين على الشَّيْء (ج) ضواغط»"
          source: "المعجم الوسيط"
      expands:
        - text: "«آلة طاقة موائع، والتي تستخدم لضغط الغازات.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
          addition: "استخدام اللمة كآلة (Compressor) في المجال التقني."
    - lemma: "عامل إجهاد"
      confirm:
        - text: "«يدل على محفز إجهاد، والاستجابة أو حالة إجهاد التي تدل على استجابة لحافز...»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
    - lemma: "موتر"
      confirm:
        - text: "«مُوتِّر من (و ت ر) الذي يشد وتر القوس ومن يجعل صلاته وترا.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مجهد"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "ضاغط"
      decision: confirmed
      decision_reason: "كلمة فصيحة، وتستخدم مجازياً واصطلاحياً في علم النفس للتعبير عن المسببات الضاغطة (الضواغط النفسية)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ضَاغِط"
    - lemma: "عامل إجهاد"
      decision: confirmed
      decision_reason: "مصطلح دقيق وموثق في المعاجم الحديثة للدلالة على المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِلُ إِجْهَادٍ"
    - lemma: "مُوَتِّر"
      decision: confirmed
      decision_reason: "اسم فاعل صحيح يدل على من أو ما يُحدث التوتر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَتِّر"
    - lemma: "مُجْهِد"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل قياسي من (أجهد)، يدل مباشرة على العامل الذي يسبب الإجهاد الجسدي أو النفسي، وشائع الاستخدام."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُجْهِد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "أي عامل يسبب الإجهاد أو التوتر للكائن الحي"
    assessment:
      decision: revise
      reason: "تحسين الصياغة لتكون أكثر معجمية وشمولاً للجانبين النفسي والجسدي."
    authored:
      - type: terminological
        text: "كُلُّ مَا يُسبِّبُ الإجْهَادَ أَوِ التَّوتُّرَ الجَسَدِيَّ أو النَّفْسِيَّ للكَائِنِ الحَيِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "كُلُّ مَا يُسبِّبُ الإجْهَادَ أَوِ التَّوتُّرَ الجَسَدِيَّ أو النَّفْسِيَّ للكَائِنِ الحَيِّ."

  examples:
    per_lemma:
      - lemma: "ضَاغِط"
        examples:
          - text: "تُعَدُّ بِيئَةُ العَمَلِ السَّلْبِيَّةِ مِنْ أَكْبَرِ الضَّوَاعِطِ النَّفْسِيَّةِ عَلَى المُوَظَّفِ."
            type: usage
      - lemma: "عَامِلُ إِجْهَادٍ"
        examples:
          - text: "يُمَثِّلُ نَقْصُ النَّوْمِ عَامِلَ إِجْهَادٍ رَئِيسِيًّا لِلْجِسْمِ."
            type: usage
      - lemma: "مُوَتِّر"
        examples:
          - text: "تَجَنَّبِ المَوَاقِفَ المُوَتِّرَةَ قَبْلَ النَّوْمِ لِتَحْظَى بِرَاحَةٍ أَفْضَلَ."
            type: usage
      - lemma: "مُجْهِد"
        examples:
          - text: "كَانَ نِظَامُ العَمَلِ مُجْهِدًا لِلْعَامِلِينَ فِي المَصْنَعِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعَدُّ بِيئَةُ العَمَلِ السَّلْبِيَّةِ مِنْ أَكْبَرِ الضَّوَاعِطِ النَّفْسِيَّةِ عَلَى المُوَظَّفِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُمَثِّلُ نَقْصُ النَّوْمِ عَامِلَ إِجْهَادٍ رَئِيسِيًّا لِلْجِسْمِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَجَنَّبِ المَوَاقِفَ المُوَتِّرَةَ قَبْلَ النَّوْمِ لِتَحْظَى بِرَاحَةٍ أَفْضَلَ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كَانَ نِظَامُ العَمَلِ مُجْهِدًا لِلْعَامِلِينَ فِي المَصْنَعِ."

stage5_enrichment:
  per_entry:
    - lemma: "ضَاغِط"
      entry_id: "{auto}"
      root: "ضغط"
      maqayis_quote: "«الضَّادُ وَالْغَيْنُ وَالطَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى مُزَاحَمَةٍ بِشِدَّةٍ...»"
    - lemma: "عَامِلُ إِجْهَادٍ"
      entry_id: "{auto}"
      roots:
        - word: "عامل"
          root: "عمل"
          maqayis_quote: "«الْعَيْنُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ، وَهُوَ عَامٌّ فِي كُلِّ فِعْلٍ يُفْعَلُ...»"
        - word: "إجهاد"
          root: "جهد"
          maqayis_quote: "«الْجِيمُ وَالْهَاءُ وَالدَّالُ أَصْلُهُ الْمَشَقَّةُ...»"
    - lemma: "مُوَتِّر"
      entry_id: "{auto}"
      root: "وتر"
      maqayis_quote: "«الْوَاوُ وَالتَّاءُ وَالرَّاءُ: بَابٌ لَمْ تَجِئْ كَلِمُهُ عَلَى قِيَاسٍ وَاحِدٍ، بَلْ هِيَ مُفْرَدَاتٌ لَا تَتَشَابَهُ...»"
    - lemma: "مُجْهِد"
      entry_id: "{auto}"
      root: "جهد"
      maqayis_quote: "«الْجِيمُ وَالْهَاءُ وَالدَّالُ أَصْلُهُ الْمَشَقَّةُ...»"

  per_sense:
    - lemma: "ضَاغِط"
      sense_id: "{auto}"
      nuance: "يغلب استخدامه في سياق الطب النفسي لوصف مسببات الضغط (الضواغط النفسية)."
      mwe: false
    - lemma: "عَامِلُ إِجْهَادٍ"
      sense_id: "{auto}"
      nuance: "مصطلح علمي مركب وصريح لوصف المسبب المباشر للإجهاد."
      mwe: true
    - lemma: "مُوَتِّر"
      sense_id: "{auto}"
      nuance: "يركز على الجانب الانفعالي والعصبي والتشنج النفسي."
      mwe: false
    - lemma: "مُجْهِد"
      sense_id: "{auto}"
      nuance: "يصف ما يسبب التعب والإرهاق العام والمشقة."
      mwe: false

