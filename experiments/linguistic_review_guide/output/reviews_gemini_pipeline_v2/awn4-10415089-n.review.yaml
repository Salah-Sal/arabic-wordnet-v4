      maqayis_quote: "«الدَّالُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا إِبَانَةُ الشَّيْءِ بِأَمَارَةٍ تَتَعَلَّمُهَا، وَالْآخَرُ اضْطِرَابٌ فِي الشَّيْءِ... وَمِنَ الْبَابِ دَلَالُ الْمَرْأَةِ، وَهُوَ جُرْأَتُهَا فِي تَغَنُّجٍ وَشِكْلٍ»"
