stage1_review:
  assessment:
    concerns: []
    observations: "المعنى يتمحور حول الإفراط في العناية والملاطفة حتى بلوغ حد الإفساد. الفعل 'دلّل' واسم الفاعل منه 'مُدَلِّل' يفيان بالمعنى. ونجد أيضاً 'مُغَنِّج' و'مُتْرِف' كخيارات دقيقة تتناول جوانب أخرى كالملاطفة والتنعيم المفرط."
  blind_candidates:
    - lemma: "مُدَلِّل"
      generation_method: ishtiqaq
      justification: "اشتقاق من الفعل 'دلل' على وزن مُفَعِّل للدلالة على الشخص الذي يقوم بفعل التدليل والتساهل."
    - lemma: "مُغَنِّج"
      generation_method: ishtiqaq
      justification: "اشتقاق من الفعل 'غنّج' بمعنى دلّل ولاطف، للدلالة على الشخص الذي يبالغ في الغنج والتدليل."
    - lemma: "مُتْرِف"
      generation_method: ishtiqaq
      justification: "اشتقاق من الفعل 'أترف' بمعنى أفسد الشخص بكثرة النعمة وتلبية الرغبات."
    - lemma: "مُفْسِد بِالدَّلَال"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يجمع بين الإفساد وسببه وهو الدلال، لبيان طبيعة هذا الإفساد تحديداً."

stage2_evidence:
  per_lemma:
    - lemma: "مُدَلِّل"
      confirm:
        - text: "مُدَلِّلَة: من (د ل ل) من تتساهل في تربية أبنائها وتعاملهم معاملة لينة."
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُغَنِّج"
      confirm:
        - text: "مُغَنّجِ: متملق، مداعب، ملاطف، مدلَِل، غَنِج، مغناج، متظرف، متلاطف، متكلف اللطف، متدلّل."
          source: "تكملة المعاجم العربية لرينهارت دوزي"
    - lemma: "مُتْرِف"
      confirm:
        - text: "أَتْرَف فلاناً: أعطاه ما يَشْتَهى وُسِّع عليه ودُلِّله"
          source: "المعجم الكبير"
        - text: "يُقَالُ رَجُلٌ مُتْرَفٌ مُنَعَّمٌ، وَتَرَّفَهُ أَهْلُهُ إِذَا نَعَّمُّوهُ بِالطَّعَامِ الطَّيِّبِ وَالشَّيْءِ يُخَصُّ بِهِ."
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "التتريف: نعمة وسعة العيش وتلبية الرغبات بما يؤدي إلى الإفساد."
          source: "تحليل لغوي مستمد من المعجم الكبير"
    - lemma: "مُفْسِد بِالدَّلَال"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُدَلِّل"
      decision: confirmed
      decision_reason: "اسم فاعل قياسي من 'دَلَّلَ' يعبر بدقة عن الشخص الذي يقوم بالتدليل والملاطفة الزائدة، وهو مطابق للمعنى المقصود، ووروده كاسم فاعل مؤكد معجمياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدَلِّل"
    - lemma: "مُغَنِّج"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من 'غَنَّجَ' بمعنى دلّل. وقد وثق دوزي استخدامه بمعنى 'مدلِّل'. يحمل دلالة قوية على التدليل والإفساد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُغَنِّج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: awn4-10415089-n
    - lemma: "مُتْرِف"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من 'أترف'. والتتريف والإتراف يعنيان تلبية الشهوات والتوسعة والدلال، مما يتفق مع مفهوم إفساد الشخص بالدلال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُتْرِف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: awn4-10415089-n
    - lemma: "مُفْسِد بِالدَّلَال"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية غير مسكوكة معجمياً، وتعد شرحاً للمفهوم أكثر من كونها مصطلحاً معجمياً مستقلاً."

stage4_content:
  definition:
    current: "شخص يدلل أو يفسد بالتدليل المفرط"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد، ولكن صياغته بأسلوب معجمي دقيق تتطلب البدء بالجنس القريب ('مَن' أو 'شخص') مع تفصيل يوضح طبيعة الإفساد بالتدليل والتساهل بوضوح أكثر."
    authored:
      - type: terminological
        text: "مَن يُسرف في تدليل شخص وتلبية رغباته والتساهل معه إلى حدّ إفساده."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: awn4-10415089-n
          definition_index: 0
          text: "مَن يُسرف في تدليل شخص وتلبية رغباته والتساهل معه إلى حدّ إفساده."
  examples:
    per_lemma:
      - lemma: "مُدَلِّل"
        examples:
          - text: "حذّر التربويون من عواقب الأب المُدَلِّل الذي يلبّي كل رغبات طفله."
            type: usage
      - lemma: "مُغَنِّج"
        examples:
          - text: "كانت الأم مُغَنِّجَةً لولدها الوحيد، لا تردّ له طلباً."
            type: usage
      - lemma: "مُتْرِف"
        examples:
          - text: "كان الحاكم مُتْرِفاً لحاشيته، يُغدق عليهم الأموال بلا حساب."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: awn4-10415089-n
          text: "حذّر التربويون من عواقب الأب المُدَلِّل الذي يلبّي كل رغبات طفله."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كانت الأم مُغَنِّجَةً لولدها الوحيد، لا تردّ له طلباً."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كان الحاكم مُتْرِفاً لحاشيته، يُغدق عليهم الأموال بلا حساب."

