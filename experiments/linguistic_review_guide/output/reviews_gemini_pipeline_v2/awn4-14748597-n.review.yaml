    current: "مادة تؤخر أو توقف نشاطاً ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي عام جداً؛ يفضل إضافة صفة كيميائية أو حيوية وتوسيع النطاق ليشمل تقليل السرعة أو الإعاقة."
    authored:
      - type: terminological
        text: "مادةٌ كيميائيَّةٌ أو حيويَّةٌ تُؤخِّرُ أو تُوقِفُ أو تُقلِّلُ من سُرعةِ نشاطٍ أو تفاعلٍ ما."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-14748597-n"
          definition_index: 0
          text: "مادةٌ كيميائيَّةٌ أو حيويَّةٌ تُؤخِّرُ أو تُوقِفُ أو تُقلِّلُ من سُرعةِ نشاطٍ أو تفاعلٍ ما."
  examples:
