      - lemma: "مُثَبِّط"
        examples:
          - text: "يُضافُ المُثَبِّطُ إلى مِحركِ السَّيارةِ لِمَنْعِ تَآكُلِ الأَجْزَاءِ المَعْدِنِيَّةِ."
            type: usage
      - lemma: "مَانِع"
        examples:
          - text: "اسْتَخْدَمَ الكِيمِيَائِيُّ مَانِعاً لِلتَّأَكْسُدِ لِحِفْظِ الزُّيُوتِ مِنَ التَّزَنُّخِ."
            type: usage
      - lemma: "كَابِح"
        examples:
          - text: "تَعْمَلُ بَعْضُ الأَدْوِيَةِ كَكَابِحٍ لِنَشَاطِ الأَنْزِيِمَاتِ الضَّارَّةِ."
            type: usage
    actions:
