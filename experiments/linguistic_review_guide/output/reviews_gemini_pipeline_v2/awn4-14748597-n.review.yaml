stage1_review:
  assessment:
    concerns:
      - "اللمّات تفتقر إلى التشكيل الكامل اللازم للتمييز الصرفي."
      - "التعريف الحالي مقتضب جداً ويحتاج إلى تحديد السياق (كيميائي/حيوي)."
    observations: "المجموعة تشير إلى مفهوم 'المثبط' (inhibitor) وهو مادة كيميائية أو حيوية تعيق نشاطاً ما. اللمات الموجودة صحيحة لكنها تحتاج لضبط."
  blind_candidates:
    - lemma: "مُثَبِّط"
      generation_method: ishtiqaq
      justification: "اللفظ المعياري في الكيمياء والأحياء للتعبير عن مادة تعيق التفاعل أو النشاط."
    - lemma: "مَانِع"
      generation_method: ishtiqaq
      justification: "لفظ عام وشائع الاستخدام في المجمعات التقنية (مانع تآكل، مانع صدأ)."
    - lemma: "كَابِح"
      generation_method: ishtiqaq
      justification: "يُستخدم في سياق الأدوية والأنزيمات للتعبير عن كبح النشاط."
    - lemma: "مُؤَخِّر"
      generation_method: ishtiqaq
      justification: "من 'أخر'، وهي ترجمة مباشرة لـ 'retard' الواردة في التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "مُثَبِّط"
      confirm:
        - text: "كل مادة تمنع أو توقف تفاعلا كيميائيا."
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "عامل يقلل أو يثبط النشاط الحركي."
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "الصّادّ؛ المثبِّط: عاملٌ يُبطّئ النشاط الكيميائي أو يعوقُهُ (ك)."
          source: "المورد الحديث (2008)"
    - lemma: "مَانِع"
      confirm:
        - text: "المانع أو المثبط، وهو عبارة عن مادة قادرة على التأثير على تفاعل... بحيث تبطئه، أو تعوقه أو تمنعه."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "مَا يمْنَع من حُصُول الشَّيْء وَهُوَ خلاف الْمُقْتَضى."
          source: "المعجم الوسيط"
    - lemma: "كَابِح"
      confirm:
        - text: "inhibitory; inhibitor"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "مَانِع، كابِح، كابِت (Inhibitor)"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
    - lemma: "مُؤَخِّر"
      contradicts:
        - text: "نِهَايَة الشَّيْء من الْخلف يُقَال مُؤخر السَّفِينَة ومؤخر الْبناء."
          source: "المعجم الوسيط"
          conflict: "المصطلح يشير إلى الموقع المكاني وليس الوظيفة الكيميائية."

stage3_analysis:
  per_lemma:
    - lemma: "مانع"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع الاستخدام في السياقات التقنية والكيميائية (مانع تآكل)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَانِع"
    - lemma: "مثبط"
      decision: confirmed
      decision_reason: "هو المصطلح العلمي الأدق والأكثر شيوعاً في الكيمياء والطب (inhibitor)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُثَبِّط"
    - lemma: "كَابِح"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي وموثق في معاجم المصطلحات (الصيدلة، النفط، الطب البيطري) للتعبير عن المادة التي تكبح النشاط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "كَابِح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14748597-n"

stage4_content:
