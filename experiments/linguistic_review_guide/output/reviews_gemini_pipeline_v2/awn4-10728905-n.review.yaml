        value: '{"roots":[{"word":"شخص","root":"شخص","maqayis":"«الشِّينُ وَالْخَاءُ وَالصَّادُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي شَيْءٍ...»"},{"word":"درجة","root":"درج","maqayis":"«الدَّالُ وَالرَّاءُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُضِيِّ الشَّيْءِ وَالْمُضِيِّ فِي الشَّيْءِ...»"},{"word":"ثالثة","root":"ثلث","maqayis":"«الثَّاءُ وَاللَّامُ وَالثَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ فِي الْعَدَدِ...»"}]}'
