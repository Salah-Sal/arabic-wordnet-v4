        entity_id: "{auto}"
        key: note
        value: '{"root":"ملك","maqayis":"«الْمِيمُ وَاللَّامُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ وَصِحَّةٍ.»"}'
