      decision: confirmed
      decision_reason: "مصطلح شائع ومسجل في المعاجم لوصف استدقاق وسط الحذاء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَصْرُ الحِذَاء"
    - lemma: "خَصْرُ النَّعْل"
      source: stage1
      decision: confirmed
      decision_reason: "أدق معجمياً في وصف الجزء المحدد من النعل (sole)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
