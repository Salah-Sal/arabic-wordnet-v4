      confirm:
        - text: "«خصَّر الثوب أو النعل: دقَّق جانبيه»"
          source: "المعجم الوسيط"
        - text: "«نعل مخصَّرة: مستدقَّة الوسط»"
          source: "القاموس المحيط"
    - lemma: "خَصْرُ النَّعْل"
      confirm:
        - text: "«خَصْر النعل: ما اسْتَدَقَّ من قدّام الأُذنين منها»"
          source: "المعجم الكبير"
        - text: "«الخَصْرانِ من النعل مُسْتَدَقُّها»"
          source: "تاج العروس"
    - lemma: "سَاقُ الحِذَاء"
      confirm:
        - text: "«shank: الجزء الضيّق من الحذاء المُوْصِلُ بين الجزء العريض من النعل وبين كعبهِ»"
          source: "المورد الحديث"
    - lemma: "خَصْر"
      confirm:
        - text: "«الخصر من النعل: ما استدق في قدام الأذنين منها»"
          source: "تاج العروس"

stage3_analysis:
