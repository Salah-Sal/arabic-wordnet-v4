          params: {lemma: "خَصْرُ النَّعْل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04190706-n"}
    - lemma: "سَاق"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني حديث مستخدم في ترجمة shank للدلالة على الجزء الداعم الصلب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سَاق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04190706-n"}
    - lemma: "خَصْر"
      source: stage1
      decision: confirmed
      decision_reason: "اللفظ المفرد الأصلي الذي اشتق منه المعنى الاصطلاحي في الأحذية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خَصْر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04190706-n"}
    - lemma: "مَخْصَر"
      source: stage1
      decision: removed
      decision_reason: "رغم صحته اشتقاقياً، إلا أن 'خصر' هو المصطلح المسموع والمعتمد في المعاجم."

stage4_content:
  definition:
    current: "الجزء الضيق من الحذاء الذي يربط الكعب بالجزء العريض من النعل"
    assessment:
      decision: retain
      reason: "التعريف دقيق وشامل ويطابق المفهوم التقني تماماً."
  examples:
    per_lemma:
      - lemma: "خَصْرُ الحِذَاء"
        examples:
          - text: "يجب أن يكون خَصْرُ الحِذَاء مرناً ليسمح بحركة القدم الطبيعية."
            type: usage
      - lemma: "خَصْرُ النَّعْل"
        examples:
          - text: "قام الإسكافي بتقوية خَصْرِ النَّعْلِ بقطعة من الجلد السميك."
            type: usage
      - lemma: "سَاق"
        examples:
          - text: "تُصنع السَّاقُ عادة من الفولاذ أو البلاستيك المقوى لدعم قوس القدم."
            type: usage
      - lemma: "خَصْر"
        examples:
          - text: "كانت نعالهم مخصَّرة، أي أن خَصْرَها مستدق."
            type: usage

