stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة وحيدة، وهي تعبير مركب (MWE)، ويُفضل إضافة بدائل مفردة أو مرادفات تقنية أدق."
    observations: "المفهوم تقني دقيق يتعلق بصناعة الأحذية، والمصطلح العربي 'خصر' مستخدم تاريخياً في هذا السياق لوصف استدقاق النعل."
  blind_candidates:
    - lemma: "خَصْرُ الحِذَاء"
      generation_method: tarkib
      justification: "ترجمة مباشرة للمصطلح الإنجليزي (waist of the shoe) وتعبر عن الجزء الضيق."
    - lemma: "خَصْرُ النَّعْل"
      generation_method: tarkib
      justification: "أكثر دقة لأن الخصر يقع في النعل تحديداً، وهو مصطلح معجمي قديم."
    - lemma: "سَاقُ الحِذَاء"
      generation_method: majaz
      justification: "ترجمة لمصطلح (shank) الذي يعني الساق، ويستخدم تقنياً للجزء الداعم في خصر الحذاء."
    - lemma: "مَخْصَر"
      generation_method: ishtiqaq
      justification: "اسم مكان من الخصر، يعبر عن موضع الضيق في الحذاء."

stage2_evidence:
