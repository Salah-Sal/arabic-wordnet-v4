stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة عبارة عن مركب اسمي يفتقر إلى التشكيل الكامل."
      - "التعريف العربي الحالي يتسم بالدورية والعمومية (عملية... في نظرية التحليل النفسي)."
    observations: "المفهوم تقني متخصص في علم النفس، ويشير إلى الديناميات النفسية التي تحدث أثناء العلاج أو في البنية النفسية حسب النظرية الفرويدية."
  blind_candidates:
    - lemma: "عَمَلِيَّةُ التَّحْلِيلِ النَّفْسِيِّ"
      generation_method: tarkib
      justification: "الترجمة الأكثر شيوعاً ومباشرة للمصطلح الإنجليزي (psychoanalytic process)."
    - lemma: "سَيْرُورَةٌ تَحْلِيلِيَّةٌ"
      generation_method: tarkib
      justification: "استخدام مصطلح 'سيرورة' (Process/Devenir) شائع جداً في الأدبيات النفسية الحديثة، خاصة المتأثرة بالمدرسة الفرنكوفونية."
    - lemma: "آلِيَّةُ التَّحْلِيلِ النَّفْسِيِّ"
      generation_method: tarkib
      justification: "يُستخدم للتعبير عن الجوانب الميكانيكية أو الوظيفية للعملية النفسية."
    - lemma: "مَسَارُ التَّحْلِيلِ النَّفْسِيِّ"
      generation_method: tarkib
      justification: "يشير إلى الجانب الزمني أو التتابعي للعملية العلاجية."

stage2_evidence:
  per_lemma:
    - lemma: "عملية التحليل النفسي"
      confirm:
        - text: "«تعتمد عملية التحليل النفسي على التداعي الحر»"
          source: "المعجم الموحد لمصطلحات اللسانيات (سياق)"
        - text: "«التحليل النفسي: يشير... إلى تبني نظريات إبداعية لكشف تعقيدات المكتوب»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«تفسير التحليل النفسي»"
          source: "المعجم الطبي الموحد"
          addition: "يؤكد وجود مركبات اصطلاحية تبدأ بالتحليل النفسي لوصف العمليات الجارية فيه."
    - lemma: "سَيْرُورَةٌ تَحْلِيلِيَّةٌ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عملية التحليل النفسي"
      decision: confirmed
      decision_reason: "المصطلح العربي المستقر والمعتمد في المجامع العلمية والأدبيات المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّةُ التَّحْلِيلِ النَّفْسِيِّ"
    - lemma: "سَيْرُورَةٌ تَحْلِيلِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق وحديث يُستخدم بكثرة في الترجمات النفسية المعاصرة لتمييز 'العملية' كتدفق مستمر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "سَيْرُورَةٌ تَحْلِيلِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13564150-n"}

stage4_content:
  definition:
    current: "عملية يفترض حدوثها في نظرية التحليل النفسي"
    assessment:
      decision: revise
      reason: "التعريف الحالي فقير دلالياً ولا يوضح طبيعة هذه العملية."
    authored:
      - type: terminological
        text: "سلسلة من التفاعلات النفسية والعمليات الذهنية التي تجري خلال العلاج بالتحليل النفسي، وتهدف إلى كشف محتويات العقل اللاواعي وفهم الصراعات النفسية الدفينة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13564150-n", definition_index: 0, text: "سلسلة من التفاعلات النفسية والعمليات الذهنية التي تجري خلال العلاج بالتحليل النفسي، وتهدف إلى كشف محتويات العقل اللاواعي وفهم الصراعات النفسية الدفينة."}
  examples:
    per_lemma:
      - lemma: "عَمَلِيَّةُ التَّحْلِيلِ النَّفْسِيِّ"
        examples:
          - text: "تتطلب عملية التحليل النفسي التزاماً طويلاً من المريض والمحلل لاستكشاف اللاشعور."
            type: usage
      - lemma: "سَيْرُورَةٌ تَحْلِيلِيَّةٌ"
        examples:
          - text: "تعتبر السيرورة التحليلية رحلة اكتشاف ذاتي تتجاوز مجرد تخفيف الأعراض."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-13564150-n", text: "تؤدي عملية التحليل النفسي إلى تحويل الصراعات المكبوتة إلى وعي مدرك."}

stage5_enrichment:
  per_entry:
    - lemma: "عَمَلِيَّةُ التَّحْلِيلِ النَّفْسِيِّ"
      entry_id: "{auto}"
      roots:
        - word: "عملية"
          root: "عمل"
          maqayis_quote: "«الْعَيْنُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ، وَهُوَ عَامٌّ فِي كُلِّ فِعْلٍ يُفْعَلُ.»"
        - word: "التحليل"
          root: "حلل"
          maqayis_quote: "«الْحَاءُ وَاللَّامُ لَهُ فُرُوعٌ كَثِيرَةٌ وَمَسَائِلُ، وَأَصْلُهَا كُلُّهَا عِنْدِي فَتْحُ الشَّيْءِ، لَا يَشِذُّ عَنْهُ شَيْءٌ.»"
        - word: "النفسي"
          root: "نفس"
          maqayis_quote: "«النُّونُ وَالْفَاءُ وَالسِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خُرُوجِ النَّسِيمِ كَيْفَ كَانَ.»"
    - lemma: "سَيْرُورَةٌ تَحْلِيلِيَّةٌ"
      entry_id: "{auto}"
      roots:
        - word: "سيرورة"
          root: "سير"
          maqayis_quote: "«السِّينُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى مُضِيٍّ وَجَرَيَانٍ.»"
        - word: "تحليلية"
          root: "حلل"
          maqayis_quote: "«الْحَاءُ وَاللَّامُ... أَصْلُهَا كُلُّهَا عِنْدِي فَتْحُ الشَّيْءِ.»"
  per_sense:
    - lemma: "عَمَلِيَّةُ التَّحْلِيلِ النَّفْسِيِّ"
      sense_id: "{auto}"
      nuance: "المصطلح الفني المعياري الذي يصف الإجراء العلاجي ككل."
      mwe: true
    - lemma: "سَيْرُورَةٌ تَحْلِيلِيَّةٌ"
      sense_id: "{auto}"
      nuance: "يركز على الجانب الديناميكي والتدفقي المتغير للعملية النفسية."
