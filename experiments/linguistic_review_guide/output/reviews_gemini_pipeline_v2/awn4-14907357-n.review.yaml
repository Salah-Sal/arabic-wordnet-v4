      entry_id: "{auto}"
      root: "بلور"
      maqayis_quote: "لم يرد في مقاييس اللغة بهذا اللفظ لكونه معرباً قديماً من اليونانية (beryllos)، ولكنه عومل معاملة الرباعي (بلور)."
    - lemma: "بِلَّوْر"
      entry_id: "{auto}"
      root: "بلور"
      maqayis_quote: "لم يرد في مقاييس اللغة بهذا اللفظ لكونه معرباً قديماً."
    - lemma: "كْرِيسْتَال"
      entry_id: "{auto}"
      root: "كرستل"
      maqayis_quote: "لفظ أعجمي معرب حديثاً، لا جذر له في المعاجم القديمة."
  per_sense:
    - lemma: "بِلَّوْرَة"
      sense_id: "{auto}"
      nuance: "تشير إلى الوحدة البنائية المفردة أو الشكل الهندسي المحدد."
      mwe: false
    - lemma: "بِلَّوْر"
      sense_id: "{auto}"
      nuance: "اسم جنس يطلق على المادة نفسها أو الحجر الكريم الشفاف."
      mwe: false
    - lemma: "كْرِيسْتَال"
      sense_id: "{auto}"
      nuance: "يستخدم غالباً في السياقات التقنية الحديثة وفي وصف الزجاج الفاخر."
      mwe: false
  synset:
