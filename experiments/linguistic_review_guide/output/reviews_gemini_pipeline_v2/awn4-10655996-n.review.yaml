      mwe: false
    - lemma: "مَبْدَأٌ حَيَوِيّ"
      sense_id: "{auto}"
      nuance: "مصطلح تقني نظري يفسر ظاهرة الحياة كقاعدة فكرية أو علمية."
      mwe: true
    - lemma: "قُوَّةٌ حَيَوِيَّة"
      sense_id: "{auto}"
      nuance: "تركز على الجانب الديناميكي والمحرك للطاقة الحيوية داخل الكائن."
      mwe: true
    - lemma: "نَسَمَة"
      sense_id: "{auto}"
      nuance: "تركز على ارتباط الحياة بالتنفس واللطافة، وتستخدم غالباً للإشارة إلى الفرد بصفته كائناً حياً."
