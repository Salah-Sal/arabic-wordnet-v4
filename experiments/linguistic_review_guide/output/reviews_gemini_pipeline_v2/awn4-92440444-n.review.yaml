          params: {entry_id: "{auto}", synset_id: "awn4-92440444-n"}
    - lemma: "تَكَرْتُل"
      source: stage1
      decision: confirmed
      decision_reason: "اشْتِقَاقٌ صَرْفِيٌّ سَلِيمٌ يُعَبِّرُ عَنْ صَيْرُورَةِ الكَارْتِلِ، وَإِنْ قَلَّ تَدَاوُلُهُ عَنْ 'كَرْتَلَة'."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَكَرْتُل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-92440444-n"}

stage4_content:
  definition:
    current: "عملية تشكيل كارتل، تحدث عادة في الصناعات التي تسيطر عليها قلة."
    assessment:
      decision: revise
      reason: "التَّعْرِيفُ الحَالِيُّ يَعْتَمِدُ عَلَى الدَّوَرَانِ (تَشْكِيل كَارْتِل)؛ وَيُفَضَّلُ اسْتِخْدَامُ تَعْرِيفٍ أَكْثَرَ تَفْصِيلًا لِلْآلِيَّةِ الاقْتِصَادِيَّةِ."
    authored:
      - type: terminological
        text: "تَكْوِينُ اتِّحَادٍ احْتِكَارِيٍّ بَيْنَ مَجْمُوعَةٍ مِنَ المُنْتِجِينَ أَوْ المُرَدِّدِينَ لِلتَّحَكُّمِ فِي الأَسْعَارِ وَتَقْيِيدِ المُنَافَسَةِ فِي السُّوقِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-92440444-n"
          definition_index: 0
          text: "تَكْوِينُ اتِّحَادٍ احْتِكَارِيٍّ بَيْنَ مَجْمُوعَةٍ مِنَ المُنْتِجِينَ أَوْ المُرَدِّدِينَ لِلتَّحَكُّمِ فِي الأَسْعَارِ وَتَقْيِيدِ المُنَافَسَةِ فِي السُّوقِ."
  examples:
    per_lemma:
      - lemma: "تَكَتُّلٌ احْتِكَارِيّ"
        examples:
          - text: "أَدَّى التَّكَتُّلُ الاحْتِكَارِيُّ لِشَرِكَاتِ النِّفْطِ إِلَى ارْتِفَاعٍ حَادٍّ فِي أَسْعَارِ الوَقُودِ العَالَمِيَّةِ."
            type: usage
      - lemma: "كَرْتَلَة"
        examples:
          - text: "تَحْظُرُ قَوَانِينُ حِمَايَةِ المُنَافَسَةِ كَرْتَلَةَ الصِّنَاعَاتِ الحَيَوِيَّةِ لِمَنْعِ الإِضْرَارِ بِالمُسْتَهْلِكِ."
            type: usage
      - lemma: "تَكَرْتُل"
        examples:
          - text: "ظَهَرَتْ بَوَادِرُ تَكَرْتُلٍ فِي سُوقِ الاتِّصَالَاتِ بَعْدَ انْدِمَاجِ كُبْرَى الشَّرِكَاتِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-92440444-n"
