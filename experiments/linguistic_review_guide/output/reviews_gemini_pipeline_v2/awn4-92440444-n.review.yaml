stage1_review:
  assessment:
    concerns:
      - "خَلْطٌ بَيْنَ الكِيَانِ (المُنَظَّمَة) وَالعَمَلِيَّةِ؛ حَيْثُ إِنَّ التَّعْرِيفَ يُشِيرُ إِلَى العَمَلِيَّةِ (تَشْكِيل كَارْتِل) بَيْنَمَا اللَّمَّات المَوْجُودَة (كَارْتِل) تُشِيرُ إِلَى الكِيَانِ نَفْسِهِ."
      - "نَقْصٌ فِي التَّشْكِيلِ الكَامِلِ لِلَّمَّاتِ المَوْجُودَةِ."
    observations: "المَجْمُوعَةُ التَّرَادُفِيَّةُ تَنْدَرِجُ تَحْتَ «عَمَلِيَّة اقْتِصَادِيَّة»، مِمَّا يَجْعَلُ اللَّمَّاتِ المَصْدَرِيَّةَ (تَكَتُّل، كَرْتَلَة) أَوْلَى بِالذِّكْرِ مِنَ اللَّمَّاتِ الجَامِدَةِ (كَارْتِل)."
  blind_candidates:
    - lemma: "تَكَرْتُل"
      generation_method: ishtiqaq
      justification: "مَصْدَرٌ قِيَاسِيٌّ لِلْفِعْلِ الرُّبَاعِيِّ المَزِيدِ (تَكَرْتَلَ)، يُعَبِّرُ عَنْ عَمَلِيَّةِ التَّحَوُّلِ إِلَى نِظَامِ الكَارْتِل."
    - lemma: "كَرْتَلَة"
      generation_method: taarib
      justification: "مَصْدَرٌ مُعَرَّبٌ شَائِعٌ فِي القَوَامِيسِ المَجَالِيَّةِ (التِّجَارَةِ وَالمُحَاسَبَةِ) لِلتَّعْبِيرِ عَنِ الـ (cartelization)."
    - lemma: "تَكَتُّلٌ احْتِكَارِيّ"
      generation_method: tarkib
      justification: "تَعْبِيرٌ مُرَكَّبٌ يَدُلُّ عَلَى فِعْلِ التَّكَتُّلِ بَيْنَ كِيَانَاتٍ مُسْتَقِلَّةٍ بِغَرَضِ الاحْتِكَارِ."
    - lemma: "تَشْكِيلُ كَارْتِل"
      generation_method: tarkib
      justification: "عِبَارَةٌ اصْطِلَاحِيَّةٌ بَسِيطَةٌ تُطَابِقُ التَّعْرِيفَ الحَرْفِيَّ لِلْعَمَلِيَّةِ."

stage2_evidence:
  per_lemma:
    - lemma: "تكتل احتكاري"
      confirm:
        - text: "«تكتل المنتجين، كارتل: تنظيم احتكاري ناتج عن اتفاق بين عدة شركات...»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
    - lemma: "كارتل"
      confirm:
        - text: "«كارتل: مجموعة من المنتجين يجمعهم اتفاق على تحديد الأسعار والإنتاج.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      contradicts:
        - text: "«كارتل: اتحاد بين المنتجين للتخفيف من وطأة التنافس فيما بينهم.»"
          source: "المورد الحديث (2008)"
          conflict: "الدليل يؤكد أن 'كارتل' هو الاتحاد نفسه (الكيان) وليس عملية التشكيل."
    - lemma: "كَرْتَلَة"
      confirm:
        - text: "«كرتلة: إقامة نظام الكارتل (cartelisation).»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
    - lemma: "تَكَرْتُل"
      evidence_status: "no_material_found"

