stage1_review:
  assessment:
    concerns:
      - "كلمة (عالم) قد تستخدم في السياق التراثي للإشارة إلى العالم بأمور الدين، لكنها استقرت في العصر الحديث لتكون الترجمة الأدق والمباشرة لمصطلح (scientist) في السياقات الأكاديمية والعلمية."
    observations: "التعريف الإنجليزي والمفهوم يركزان على الشخص المتخصص الذي يمتلك معرفة متقدمة في العلوم التجريبية أو غيرها، وهو مفهوم أساسي له مقابل مباشر في اللغة العربية."
  blind_candidates:
    - lemma: "عَالِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل الثلاثي (علم)، يدل على من اتصف بالعلم ورسخ فيه."
    - lemma: "بَاحِث"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (بحث)، يدل على من يمارس التقصي والبحث المنهجي في العلوم."
    - lemma: "خَبِير"
      generation_method: ishtiqaq
      justification: "صفة مشبهة تدل على من امتلك خبرة ومعرفة دقيقة وعميقة بمجال محدد."
    - lemma: "عَلَّامَة"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة تدل على الشخص غزير العلم الذي تبحر في المعرفة."

stage2_evidence:
  per_lemma:
    - lemma: "عَالِم"
      confirm:
        - text: "«عَالِم: من (ع ل م) العارف بالشيء الموقن منه.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«عالِم: scientist»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "بَاحِث"
      expands:
        - text: "«بَاحِث: من (ب ح ث) المفتش عن الشيء والمجتهد في التعرف على حقيقته.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يدل على ممارسة البحث والتفتيش (researcher) أكثر من مجرد الإحاطة بالمعرفة."
    - lemma: "خَبِير"
      expands:
        - text: "«خبير: من (خ ب ر) الذي يعلم الأشياء ويقف على حقيقتها بعلمه وقدرته.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يدل على الممارسة والتجربة والوقوف على بواطن الأمور (expert)."
    - lemma: "عَلَّامَة"
      expands:
        - text: "«عَلَّامة: من (ع ل م) بمعنى عَلَّام، والتاء لتأكيد المبالغة أو للتأنيث.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "تستخدم كلقب تبجيل للمتبحر والموسوعي أكثر من كونها صفة مهنية محايدة."

stage3_analysis:
  per_lemma:
    - lemma: "عَالِم"
      decision: confirmed
      decision_reason: "الكلمة الأشهر والأكثر دقة في ترجمة (scientist)، وتدل على من رسخ في العلم وتخصص فيه، وهي تتطابق تماماً مع دلالة المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الإحاطة المتقدمة والمنهجية بالمعرفة في أحد العلوم، وهي أعمق وأشمل دلالياً من الباحث."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَالِم"

    - lemma: "بَاحِث"
      source: stage1
      decision: removed
      decision_reason: "كلمة باحث تقابل بالإنجليزية (researcher) وتركز على النشاط العملي للبحث، بينما العالم (scientist) يتميز برسوخ المعرفة المتقدمة سواء أكان يمارس البحث أم لا."

    - lemma: "خَبِير"
      source: stage1
      decision: removed
      decision_reason: "الخبير هو الممارس ذو التجربة والمراس (expert)، بينما العالم هو المتبحر في المعرفة العلمية والنظرية."

    - lemma: "عَلَّامَة"
      source: stage1
      decision: removed
      decision_reason: "صيغة مبالغة تستخدم للتبجيل الشديد لمن تبحر في شتى الفنون، ولا تناسب الاستخدام المهني المحايد لمصطلح (scientist)."

stage4_content:
  definition:
    current: "شخص ذو معرفة متقدمة بواحد أو أكثر من العلوم"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح، حيث يشمل الجنس القريب (شخص) والفصل النوعي (ذو معرفة متقدمة بواحد أو أكثر من العلوم) مما يعكس المفهوم بدقة."
  examples:
    per_lemma:
      - lemma: "عَالِم"
        examples:
          - text: "نَالَ العَالِمُ جَائِزَةً مَرْمُوقَةً تَقْدِيرًا لاكْتِشَافَاتِهِ العِلْمِيَّةِ الحَدِيثَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "نَالَ العَالِمُ جَائِزَةً مَرْمُوقَةً تَقْدِيرًا لاكْتِشَافَاتِهِ العِلْمِيَّةِ الحَدِيثَةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "نَالَ العَالِمُ جَائِزَةً مَرْمُوقَةً تَقْدِيرًا لاكْتِشَافَاتِهِ العِلْمِيَّةِ الحَدِيثَةِ."

stage5_enrichment:
  per_entry:
    - lemma: "عَالِم"
      entry_id: "{auto}"
      root: "علم"
      maqayis_quote: "«الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى أَثَرٍ بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ»"
  per_sense:
    - lemma: "عَالِم"
      sense_id: "{auto}"
      nuance: "تدل على من يمتلك معرفة عميقة وشاملة بمجال علمي محدد أو عدة مجالات."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"علم","maqayis":"«الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى أَثَرٍ بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تدل على من يمتلك معرفة عميقة وشاملة بمجال علمي محدد أو عدة مجالات.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95