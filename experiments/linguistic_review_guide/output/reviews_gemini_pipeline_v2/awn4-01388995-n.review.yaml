stage4_content:
  definition:
    current: "كائن مثل حشرة تشارك عادة عش نوع من النمل"
    assessment:
      decision: revise
      reason: "لتحسين الصياغة المعجمية وجعلها أكثر دقة وشمولاً."
    authored:
      - type: terminological
        text: "كائن حيّ، كحشرة ونحوها، يعيش عادة في أعشاش النمل ويشاركه مسكنه ويألفه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-01388995-n", definition_index: 0, text: "كائن حيّ، كحشرة ونحوها، يعيش عادة في أعشاش النمل ويشاركه مسكنه ويألفه."}
  examples:
    per_lemma:
      - lemma: "أَلِيف النَّمْل"
        examples:
          - text: "تُعد بعض أنواع الخنافس أليفة للنمل، حيث تقضي معظم حياتها داخل أعشاشها."
            type: usage
      - lemma: "إِلْف النَّمْل"
        examples:
          - text: "يُطلق علماء الحشرات مصطلح إلف النمل على الكائنات التي تعيش في وئام مع مستعمرات النمل."
            type: usage
      - lemma: "مُسَاكِن النَّمْل"
        examples:
          - text: "تتنوع مساكنات النمل بين حشرات تتطفل عليه وأخرى تقدم له خدمات متبادلة."
            type: usage
      - lemma: "الحَشَرَة النَّمْلِيَّة"
        examples:
          - text: "تتميز الحشرة النملية بقدرتها على محاكاة روائح النمل لتجنب هجومه."
            type: usage

