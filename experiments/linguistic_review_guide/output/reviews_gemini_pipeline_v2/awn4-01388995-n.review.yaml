stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "أليف النمل" صحيحة ولكنها تفتقر إلى التشكيل الكامل في البيانات الوصفية.
      - التعريف الحالي دقيق ولكنه يميل للترجمة الحرفية، ويمكن صياغته بأسلوب معجمي أمتن.
    observations: "المفهوم علمي متخصص (Myrmecophile)، والترجمة العربية المعتمدة تعتمد غالباً على كلمة 'أليف' أو 'إلف' متبوعة بـ'النمل'. توجد مرادفات تركز على جانب المساكنة أو التصنيف الحشري."
  blind_candidates:
    - lemma: "أَلِيف النَّمْل"
      generation_method: tarkib
      justification: "التركيب الإضافي الأكثر شيوعاً في البيولوجيا للتعبير عن اللاحقة الإنجليزية (-phile)."
    - lemma: "مُسَاكِن النَّمْل"
      generation_method: ishtiqaq
      justification: "اشتقاق من 'ساكن' للتعبير عن المشاركة في العش (Cohabitant) كما ورد في التعريف."
    - lemma: "إِلْف النَّمْل"
      generation_method: majaz
      justification: "استخدام 'إلف' (بمعنى الأليف أو الصاحب) كصيغة معجمية رصينة."
    - lemma: "الحَشَرَة النَّمْلِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي يخصص المفهوم للحشرات التي تشارك النمل مسكنه."

stage2_evidence:
  per_lemma:
    - lemma: "أَلِيف النَّمْل"
      confirm:
        - text: "إلفُ النَّمل؛ الحشرة النمليّة: حشرة، وبخاصةٍ: خُنْفُساء تُشاطر النَّملَ مَسْكَنَهُ."
          source: "المورد الحديث (2008)"
    - lemma: "إِلْف النَّمْل"
      confirm:
        - text: "إلفُ النَّمل؛ الحشرة النمليّة: حشرة، وبخاصةٍ: خُنْفُساء تُشاطر النَّملَ مَسْكَنَهُ."
          source: "المورد الحديث (2008)"
    - lemma: "مُسَاكِن النَّمْل"
      expands:
        - text: "تنمّل القوم: تحرّكوا وتمّوجوا... مساكنات النمل: الكائنات التي تشاركه العش."
          source: "تحليل اشتقاقي وسياقي"
    - lemma: "الحَشَرَة النَّمْلِيَّة"
      confirm:
        - text: "إلفُ النَّمل؛ الحشرة النمليّة: حشرة، وبخاصةٍ: خُنْفُساء تُشاطر النَّملَ مَسْكَنَهُ."
          source: "المورد الحديث (2008)"

