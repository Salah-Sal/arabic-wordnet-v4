stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "اللمّات الحالية هي ترجمات حرفية أو عبارات وصفية، ويمكن إثراؤها بمصطلحات تقنية مسجلة في المعاجم المتخصصة."
    observations: "المصطلح يعبر عن أداة تقنية متخصصة (plumber's snake). المصطلح 'ثعبان السباك' هو ترجمة اقتراضية (calque) شائعة جداً، بينما 'سلك تسليك المجاري' هو الوصف الوظيفي المباشر."
  blind_candidates:
    - lemma: "ثُعْبَانُ السَّبَّاكِ"
      generation_method: majaz
      justification: "استعارة دلالية من الثعبان لمرونة الأداة وطولها، وهو المصطلح الشائع تقنياً."
    - lemma: "سِلْكُ تَسْلِيكِ المَجَارِي"
      generation_method: tarkib
      justification: "تعبير مركّب يصف المادة (سلك) والوظيفة (تسليك المجاري)."
    - lemma: "مِسْلَاكُ الأَنَابِيبِ"
      generation_method: ishtiqaq
      justification: "اسم آلة على وزن 'مِفْعَال' من الجذر (سلك)، مضاف إلى الأنابيب."
    - lemma: "لَوْلَبُ التَّسْلِيكِ"
      generation_method: tarkib
      justification: "تعبير يصف الهيكل اللولبي (coil) للأداة ووظيفتها."

stage2_evidence:
  per_lemma:
    - lemma: "ثُعْبَانُ السَّبَّاكِ"
      confirm:
        - text: "«أفعى الرَّصّاص: قضيب مَرِن تُنَظَّف به الأنابيب المسدودة.»"
        - source: "المورد الحديث (2008)"
          addition: "استخدم المعجم 'أفعى' بدلاً من 'ثعبان'، و'الرصاص' (وهو السباك قديمًا) لترجمة plumber's snake."
    - lemma: "سِلْكُ تَسْلِيكِ المَجَارِي"
      confirm:
        - text: "«طريقة لتنظيف أنابيب المجاري باستخدام قضبان طويلة قادرة على إزالة الكتل الصلبة.»"
        - source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يشير إلى استخدام قضبان (أو أسلاك) لتنظيف المجاري."
    - lemma: "أَفْعَى الرَّصَّاصِ"
      confirm:
        - text: "«أفعى الرَّصّاص: قضيب مَرِن تُنَظَّف به الأنابيب المسدودة.»"
        - source: "المورد الحديث (2008)"
    - lemma: "مِسْلَاك"
      expands:
        - text: "«كل ما كان مساكا للرجلين في المركب»"
        - source: "كتاب العين"
          addition: "الجذر (سلك) يدل على الدخول والنفاذ، والمِسلاك لغوياً يصلح اسماً للأداة التي تنفذ في الأنابيب."

stage3_analysis:
  per_lemma:
    - lemma: "ثعبان السباك"
      decision: confirmed
      decision_reason: "مصطلح تقني شائع ومستقر في الأدبيات المهنية، وهو ترجمة مقبولة للمصطلح الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثُعْبَانُ السَّبَّاكِ"
    - lemma: "سلك تسليك المجاري"
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق وشائع الاستخدام في الواقع العملي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِلْكُ تَسْلِيكِ المَجَارِي"
    - lemma: "أَفْعَى الرَّصَّاصِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معجمي موثق في المعاجم الحديثة (المورد) كترجمة مباشرة للأداة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "أَفْعَى الرَّصَّاصِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مِسْلَاكُ الأَنَابِيبِ"
      source: stage1
      decision: confirmed
      decision_reason: "اشتقاق عربي سليم يصف الأداة ووظيفتها في الأنابيب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "مِسْلَاكُ الأَنَابِيبِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "ملف فولاذي مرن طويل لإزالة الانسدادات في الأنابيب المنحنية"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يميل إلى الوصف الفيزيائي المحض؛ يُفضل صياغته بأسلوب معجمي يركز على الوظيفة والنوع."
    authored:
      - type: terminological
        text: "أداةٌ من سِلْكٍ فُولاذِيٍّ مَرِنٍ طَويلٍ، تُستخدمُ لتَسْلِيكِ الأنابيبِ والمَجاري وإزالةِ ما قد يَعْلَقُ بها من انْسِدادَاتٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "أداةٌ من سِلْكٍ فُولاذِيٍّ مَرِنٍ طَويلٍ، تُستخدمُ لتَسْلِيكِ الأنابيبِ والمَجاري وإزالةِ ما قد يَعْلَقُ بها من انْسِدادَاتٍ."
  examples:
    per_lemma:
      - lemma: "ثُعْبَانُ السَّبَّاكِ"
        examples:
          - text: "استخدمَ السباكُ ثُعبانًا فولاذيًّا لتسليكِ بالوعةِ المطبخِ المسدودةِ."
            type: usage
      - lemma: "سِلْكُ تَسْلِيكِ المَجَارِي"
        examples:
          - text: "يُباعُ سِلْكُ تَسْلِيكِ المجاري بأطوالٍ مختلِفةٍ تناسبُ كافّةَ الاستعمالاتِ المنزليّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعدُّ ثُعبانُ السباكِ أداةً أساسيّةً في حقيبةِ كلِّ فنيِّ صِيانةٍ للأنابيبِ."

