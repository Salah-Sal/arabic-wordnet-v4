stage1_review:
  assessment:
    concerns:
      - "المداخل الموجودة (شريك مثالي، فرصة زواج) هي تعبيرات وصفية حديثة (Phraset) وليست كلمات مفردة أصيلة في المعجم تعبر عن هذا المفهوم بدقة."
    observations: "المفهوم مرتبط بالزواج والبحث عن الشريك المناسب، واللغة العربية غنية بالمصطلحات التي تعبر عن التكافؤ والفرص الجيدة للزواج كالكفاءة واللقطة."
  blind_candidates:
    - lemma: "لُقَطَة"
      generation_method: majaz
      justification: "استعارة من الشيء الثمين الذي يُعثر عليه، وتُستخدم بكثرة في السياق الاجتماعي للتعبير عن الخاطب أو المخطوبة ذات الصفات الممتازة والنادرة."
    - lemma: "كُفْء"
      generation_method: ishtiqaq
      justification: "مأخوذة من الكفاءة، وهو مصطلح إسلامي ولغوي يعبر عن النظير والمساوي الصالح للزواج."
    - lemma: "صَيْد ثَمِين"
      generation_method: tarkib
      justification: "تعبير مجازي مركب يُستخدم لوصف شخص يعتبر فرصة ممتازة لا تُفوّت."
    - lemma: "خِطْب"
      generation_method: ishtiqaq
      justification: "تدل على المخطوب أو الخاطب، وهو الشخص الذي يُرغب في الزواج منه."

stage2_evidence:
  per_lemma:
    - lemma: "شَرِيك مِثَالِيّ"
      evidence_status: no_material_found
    - lemma: "فُرْصَة زَوَاج"
      evidence_status: no_material_found
    - lemma: "لُقَطَة"
      confirm:
        - text: "«اللُّقطة: كلّ ما يستحقّ أن يفوز به المرء، وبخاصة كزوجة أو زوج He was a good catch.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«اللُّقَطَةُ: الشَّيْءُ الذى تجده مُلْقًى فتأخُذُه»"
          source: "المعجم الوسيط"
    - lemma: "كُفْء"
      confirm:
        - text: "««أ» صِنو؛ نِدّ؛ كُفؤ finally met his match.»"
          source: "المورد الحديث (2008)"
        - text: "«(الْكُفْء) المماثل وَالْقَوِي الْقَادِر على تصريف العمل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "خِطْب"
      expands:
        - text: "«(الْخطب) الْمَرْأَة المخطوبة وَالَّذِي يخْطب الْمَرْأَة (ج) أخطاب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "صَيْد ثَمِين"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "شَرِيك مِثَالِيّ"
      decision: confirmed
      decision_reason: "تعبير وصفي حديث شائع الاستعمال للتعبير عن الزوج أو الزوجة المناسبة تماما (match)، وهو يغطي الفجوة المعجمية في المصطلحات الحديثة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَرِيك مِثَالِيّ"
    - lemma: "فُرْصَة زَوَاج"
      decision: confirmed
      decision_reason: "تعبير يعكس المعنى بدقة ووضوح وهو ترجمة تفسيرية مقبولة وشائعة للمفهوم الإنجليزي (matrimonial prospect)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُرْصَة زَوَاج"
    - lemma: "لُقَطَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي فصيح يستخدم مجازاً للتعبير عن فرصة الزواج الممتازة، وقد أثبتت المعاجم الحديثة (كالمورد) استخدامه بهذا المعنى المباشر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "لُقَطَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "كُفْء"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر عن الزوج أو الزوجة المناسبة أو المماثلة، ويستخدم بكثرة في الفقه الإسلامي والثقافة العربية للتعبير عن الملاءمة للزواج."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "كُفْء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خِطْب"
      source: stage1
      decision: removed
      decision_reason: "يدل على المخطوب أو الخاطب بشكل عام ولا يتضمن بالضرورة معنى الفرصة الممتازة أو النادرة."
    - lemma: "صَيْد ثَمِين"
      source: stage1
      decision: removed
      decision_reason: "تعبير مجازي يفتقر إلى التخصيص في سياق الزواج بالرغم من شيوعه ككناية عامة."

stage4_content:
  definition:
    current: "شخص يعتبر فرصة جيدة للزواج"
    assessment:
      decision: revise
      reason: "لتحسين السبك اللغوي وصياغته بأسلوب معجمي أدق."
    authored:
      - type: terminological
        text: "شَخْصٌ يُعَدُّ فُرْصَةً جَيِّدَةً وَمُنَاسِبَةً لِلزَّوَاجِ بِمَا يَمْلِكُهُ مِنْ صِفَاتٍ مَرْغُوبَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ يُعَدُّ فُرْصَةً جَيِّدَةً وَمُنَاسِبَةً لِلزَّوَاجِ بِمَا يَمْلِكُهُ مِنْ صِفَاتٍ مَرْغُوبَةٍ."}
  examples:
    per_lemma:
      - lemma: "شَرِيك مِثَالِيّ"
        examples:
          - text: "يَبْحَثُ الشَّابُّ عَنْ شَرِيكٍ مِثَالِيٍّ يُشَاطِرُهُ طُمُوحَاتِهِ في الحَيَاةِ."
            type: usage
      - lemma: "فُرْصَة زَوَاج"
        examples:
          - text: "رَفَضَتِ الفَتَاةُ فُرْصَةَ زَوَاجٍ لَا تُعَوَّضُ لِتُكْمِلَ دِرَاسَتَهَا العُلْيَا."
            type: usage
      - lemma: "لُقَطَة"
        examples:
          - text: "تَقَدَّمَ لِخِطْبَتِهَا شَابٌّ خَلُوقٌ وَمُقْتَدِرٌ، فَوَافَقَتْ عَلَى الفَوْرِ لِأَنَّهُ لُقَطَةٌ."
            type: usage
      - lemma: "كُفْء"
        examples:
          - text: "تَزَوَّجَتْ مِنْ رَجُلٍ كُفْءٍ يُشَابِهُهَا فِي الخُلُقِ وَالمَرْكَزِ الِاجْتِمَاعِيِّ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يَبْحَثُ الشَّابُّ عَنْ شَرِيكٍ مِثَالِيٍّ يُشَاطِرُهُ طُمُوحَاتِهِ في الحَيَاةِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "رَفَضَتِ الفَتَاةُ فُرْصَةَ زَوَاجٍ لَا تُعَوَّضُ لِتُكْمِلَ دِرَاسَتَهَا العُلْيَا."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَقَدَّمَ لِخِطْبَتِهَا شَابٌّ خَلُوقٌ وَمُقْتَدِرٌ، فَوَافَقَتْ عَلَى الفَوْرِ لِأَنَّهُ لُقَطَةٌ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَزَوَّجَتْ مِنْ رَجُلٍ كُفْءٍ يُشَابِهُهَا فِي الخُلُقِ وَالمَرْكَزِ الِاجْتِمَاعِيِّ."}

