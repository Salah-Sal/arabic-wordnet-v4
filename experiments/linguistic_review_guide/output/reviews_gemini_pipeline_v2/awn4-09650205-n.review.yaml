    - lemma: "فَاحِصُ أَقْمِشَة"
      entry_id: "{auto}"
      roots:
        - word: "فاحص"
          root: "فحص"
          maqayis_quote: "«الفاء والحاء والصاد كلمة تدل على طلب الشيء وبحثه.»"
        - word: "أقمشة"
          root: "قمش"
          maqayis_quote: "«القاف والميم والشين كلمة تدل على جمع الشيء من هنا وهناك.»"
  per_sense:
    - lemma: "فَاحِصُ أَقْمِشَة"
      sense_id: "{auto}"
      nuance: "مصطلح مهني متخصص في صناعة النسيج."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"فاحص","root":"فحص","maqayis":"«الفاء والحاء والصاد كلمة تدل على طلب الشيء وبحثه.»"},{"word":"أقمشة","root":"قمش","maqayis":"«القاف والميم والشين كلمة تدل على جمع الشيء من هنا وهناك.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح مهني متخصص في صناعة النسيج.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-09650205-n"
