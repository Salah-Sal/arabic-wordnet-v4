stage1_review:
  assessment:
    concerns: []
    observations: "التعريف متوافق بدقة مع المفهوم الإنجليزي (revenant/returnee). كلمة (عائد) هي الأنسب، ويمكن إثراء المجموعة بإضافة (آيِب) كمرادف فصيح مستخدم."
  blind_candidates:
    - lemma: "آيِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (آب) بمعنى رجع وعاد، ويستخدم بكثرة في سياق العودة من السفر الطويل."
    - lemma: "رَاجِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (رجع)، يفيد العودة."
    - lemma: "قَافِل"
      generation_method: majaz
      justification: "اسم فاعل من (قفل)، ويشير تحديدا للعائد من السفر."
    - lemma: "مُنْقَلِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (انقلب) أي رجع إلى أهله كقوله تعالى (وينقلب إلى أهله مسرورا)."

stage2_evidence:
  per_lemma:
    - lemma: "عَائِد"
      confirm:
        - text: "«(1) العائد [بعد غياب طويل] (2) العائد بعد الموت؛ الشَّبح (3) عائد.»"
          source: "المورد الحديث"
        - text: "«العائد؛ وبخاصة: العائد إلى الوطن من الخدمة العسكرية في الخارج.»"
          source: "المورد الحديث"
      expands:
        - text: "«من (ع و د) الراجع والمرتد إلى الشيء ومن يأتي الشيء مرة بعد أخرى»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "آيِب"
      confirm:
        - text: "«إِنّي آيِب من السفر [فصيحة] التعليق: رأى مجمع اللغة المصريّ صحّة كلمة «آيب»»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«كان طالوت أَيَّاباً. قال الخطابي: جاءَ تفسيره في الحديث أَنه السَّقاءُ»"
          source: "لسان العرب لابن منظور"
    - lemma: "رَاجِع"
      contradicts:
        - text: "«من النِّساءِ: التي تَرْجِع إلى بَيْتِ أهلها بِمَوْتِ زَوْجِها أو بطلاقها»"
          source: "المعجم الكبير"
          conflict: "الكلمة هنا تحمل دلالة مخصصة جدا (المرأة المطلقة أو الأرملة) ولا تناسب الدلالة العامة."
    - lemma: "قَافِل"
      evidence_status: "no_material_found"
    - lemma: "مُنْقَلِب"
      contradicts:
        - text: "«inversus»"
          source: "المعجم الطبي الموحد"
          conflict: "الاستخدامات المعجمية المعاصرة للمصطلح تغلب عليها الدلالات الطبية والفلكية أو السياسية (انقلاب)."

stage3_analysis:
  per_lemma:
    - lemma: "عَائِد"
      decision: confirmed
      decision_reason: "يتوافق تماما مع المعنى المقصود، وهو المقابل المعتمد لكلمة (revenant) و(returnee) في المعاجم الحديثة مثل المورد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَائِد"
    - lemma: "آيِب"
      source: stage1
      decision: confirmed
      decision_reason: "لفظة فصيحة مرادفة ومناسبة جدا للسياق؛ إذ تفيد معنى الرجوع بعد السفر أو الغياب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "آيِب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "رَاجِع"
      source: stage1
      decision: removed
      decision_reason: "دلالتها عامة جدا (مطلق الرجوع)، وفي بعض المعاجم تخصص بمعنى المرأة المطلقة أو الأرملة، مما يضعف دقتها هنا."
    - lemma: "قَافِل"
      source: stage1
      decision: removed
      decision_reason: "مخصصة للرجوع من الغزو أو السفر في جماعة (القافلة)، ولا تغطي كل حالات العودة الفردية بعد غياب."
    - lemma: "مُنْقَلِب"
      source: stage1
      decision: removed
      decision_reason: "دلالتها بعيدة عن المعنى المباشر للعودة الشخصية في الاستخدامات المعاصرة."

stage4_content:
  definition:
    current: "شخص يعود بعد غياب طويل"
    assessment:
      decision: revise
      reason: "صياغة التعريف باستخدام (من) الموصولة أفضل وأدق من استخدام النكرة (شخص)."
    authored:
      - type: linguistic
        text: "مَنْ يَعُودُ إِلَى مَكَانِهِ أَوْ أَهْلِهِ بَعْدَ غِيَابٍ طَوِيلٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ يَعُودُ إِلَى مَكَانِهِ أَوْ أَهْلِهِ بَعْدَ غِيَابٍ طَوِيلٍ."

  examples:
    per_lemma:
      - lemma: "عَائِد"
        examples:
          - text: "اسْتَقْبَلَتِ الْقَرْيَةُ الْعَائِدِينَ مِنَ الْمَهْجَرِ بِاحْتِفَالٍ كَبِيرٍ."
            type: usage
      - lemma: "آيِب"
        examples:
          - text: "أَسْرَعَ الْأَبُ لِلِقَاءِ ابْنِهِ الْآيِبِ مِنَ السَّفَرِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اسْتَقْبَلَتِ الْقَرْيَةُ الْعَائِدِينَ مِنَ الْمَهْجَرِ بِاحْتِفَالٍ كَبِيرٍ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَسْرَعَ الْأَبُ لِلِقَاءِ ابْنِهِ الْآيِبِ مِنَ السَّفَرِ."

stage5_enrichment:
  per_entry:
    - lemma: "عَائِد"
      entry_id: "{auto}"
      root: "عود"
      maqayis_quote: "«الْعَيْنُ وَالْوَاوُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَثْنِيَةٍ فِي الْأَمْرِ...»"
    - lemma: "آيِب"
      entry_id: "{auto}"
      root: "أوب"
      maqayis_quote: "«الْهَمْزَةُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الرُّجُوعُ»"
  per_sense:
    - lemma: "عَائِد"
      sense_id: "{auto}"
      nuance: "المصطلح الأعم والأكثر تداولاً في العصر الحديث لمن يرجع بعد الغياب."
      mwe: false
    - lemma: "آيِب"
      sense_id: "{auto}"
      nuance: "تحمل طابعاً تراثياً وتستخدم غالباً في سياق العودة من السفر أو المهمات."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عود","maqayis":"«الْعَيْنُ وَالْوَاوُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَثْنِيَةٍ فِي الْأَمْرِ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"أوب","maqayis":"«الْهَمْزَةُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الرُّجُوعُ»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الأعم والأكثر تداولاً في العصر الحديث لمن يرجع بعد الغياب.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تحمل طابعاً تراثياً وتستخدم غالباً في سياق العودة من السفر أو المهمات.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95