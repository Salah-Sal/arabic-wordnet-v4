stage1_review:
  assessment:
    concerns: []
    observations: "المجموعة الترادفية تعبر عن مفهوم الوطن أو البلد الذي يقيم فيه الإنسان وينتمي إليه. اللمات الموجودة 'موطن' و'وطن' تعبر بدقة عن هذا المفهوم، والتعريف يطابق الدلالة المكانية للإقامة."
  blind_candidates:
    - lemma: "وَطَن"
      generation_method: majaz
      justification: "اللفظ الأصيل الدال على محل إقامة الإنسان والبلد الذي ينتمي إليه."
    - lemma: "مَوْطِن"
      generation_method: ishtiqaq
      justification: "اسم مكان من الفعل 'وطن'، ويعني الموضع الذي يتخذه الإنسان مقرا له."
    - lemma: "مَقَرّ"
      generation_method: ishtiqaq
      justification: "اسم مكان من 'قرّ'، يدل على موضع الاستقرار والإقامة."
    - lemma: "دِيَار"
      generation_method: majaz
      justification: "جمع 'دار'، وتُطلق مجازاً على البلد أو المنطقة التي يسكنها القوم."

stage2_evidence:
  per_lemma:
    - lemma: "موطن"
      confirm:
        - text: "«الْمَوْطِنُ مِثْلُ الْوَطَنِ وَالْجَمْعُ مَوَاطِنُ»"
          source: "المصباح المنير للفيّومي"
        - text: "«مَوْطِن: وَطَن، بلد 'عاد إلى مَوْطِنه الأوَّل'»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "وطن"
      confirm:
        - text: "«(وَطَنَ) الْوَاوُ وَالطَّاءُ وَالنُّونُ: كَلِمَةٌ صَحِيحَةٌ. فَالْوَطَنُ: مَحَلُّ الْإِنْسَانِ.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الوَطَنُ: المَنْزِلُ تقيم به، وهو مَوْطِنُ الإنسان ومحله»"
          source: "لسان العرب لابن منظور"

stage3_analysis:
  per_lemma:
    - lemma: "موطن"
      decision: confirmed
      decision_reason: "الكلمة فصيحة ومستعملة بدلالة البلد أو الوطن الذي يعيش فيه الإنسان، وتتطابق تماما مع المفهوم المعجمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْطِن"
    - lemma: "وطن"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والفصيح للتعبير عن البلد أو المكان الذي يقيم فيه الإنسان وينتمي إليه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَطَن"

