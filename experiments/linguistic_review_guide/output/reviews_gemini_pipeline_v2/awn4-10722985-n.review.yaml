stage1_review:
  assessment:
    concerns: []
    observations: "المفهوم يعبر عن الشخص الذي يقوم بكتابة وصية أو يوصي لغيره، واللفظ العربي الدقيق والمستقر شرعاً وقانوناً هو (مُوصٍ)، وهو اسم فاعل من الفعل (أَوْصَى). لا حاجة لاختراع مصطلحات جديدة لوجود اللفظ الأصيل المألوف."
  blind_candidates:
    - lemma: "مُوصٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (أَوْصَى)، وهو اللفظ الشرعي والقانوني المعتمد لمن يترك وصية."
    - lemma: "صَاحِبُ الْوَصِيَّةِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف مالك الوصية أو من أصدرها."
    - lemma: "كَاتِبُ الْوَصِيَّةِ"
      generation_method: tarkib
      justification: "تركيب يصف الفعل الفعلي لكتابة الوصية."
    - lemma: "مُوَرِّث"
      generation_method: ishtiqaq
      justification: "من يترك إرثاً، وقد يتضمن ذلك كتابة وصية."

stage2_evidence:
  per_lemma:
    - lemma: "مُوصٍ"
      confirm:
        - text: "«المُوْصِي: المُوَرِّثُ ممتلكاتٍ بوصيّة (ق).»"
          source: "المورد الحديث (2008)"
        - text: "«موصٍ: testator»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«الوَصِيُّ: المُوصِي، والمُوصَى، وهي وصِيٌّ أيضاً ج: أوْصِياءُ.»"
          source: "القاموس المحيط للفيروزآبادي"
    - lemma: "صَاحِبُ الْوَصِيَّةِ"
      evidence_status: "no_material_found"
    - lemma: "كَاتِبُ الْوَصِيَّةِ"
      evidence_status: "no_material_found"
    - lemma: "مُوَرِّث"
      contradicts:
        - text: "«المُوَرِّث: من يترك إرثاً (لا يشترط وجود وصية).»"
          source: "المعجم الوسيط (مستنتج من المعنى العام)"
          conflict: "المورث قد يكون بغير وصية (intestate) فلا يطابق المفهوم الذي ينحصر فيمن يكتب وصية."

stage3_analysis:
  per_lemma:
    - lemma: "مُوصٍ"
      decision: confirmed
      decision_reason: "هو المصطلح الفصيح والدقيق والشرعي المعتمد للدلالة على الشخص الذي يصدر الوصية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions: []
    - lemma: "صَاحِبُ الْوَصِيَّةِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك ككيان معجمي مستقل."
      evidence_assessment:
        case: no_material
    - lemma: "كَاتِبُ الْوَصِيَّةِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي قد يدل على الناسخ (كاتب العدل) وليس بالضرورة الموصي نفسه."
      evidence_assessment:
        case: no_material
    - lemma: "مُوَرِّث"
      source: stage1
      decision: removed
      decision_reason: "مصطلح أعم من الموصي؛ فكل موصٍ بشيء من ماله بعد موته قد يكون مورثاً، ولكن ليس كل مورث موصياً."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "شخص يكتب وصية"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي وسطحي. يجب أن يعكس الدلالة الشرعية والقانونية الدقيقة للتصرف بالمال أو العهد بالأمور لما بعد الموت."
    authored:
      - type: terminological
        text: "شَخْصٌ يَعْهَدُ إِلَى غَيْرِهِ بِالتَّصَرُّفِ فِي مَالِهِ أَوْ شُئُونِهِ بَعْدَ مَوْتِهِ بِمُوجِبِ وَصِيَّةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10722985-n"
          definition_index: 0
          text: "شَخْصٌ يَعْهَدُ إِلَى غَيْرِهِ بِالتَّصَرُّفِ فِي مَالِهِ أَوْ شُئُونِهِ بَعْدَ مَوْتِهِ بِمُوجِبِ وَصِيَّةٍ."
  examples:
    per_lemma:
      - lemma: "مُوصٍ"
        examples:
          - text: "قَامَ الْوَرَثَةُ بِتَنْفِيذِ مَا أَقَرَّهُ الْمُوصِي فِي وَصِيَّتِهِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-10722985-n"
          text: "قَامَ الْوَرَثَةُ بِتَنْفِيذِ مَا أَقَرَّهُ الْمُوصِي فِي وَصِيَّتِهِ."

stage5_enrichment:
  per_entry:
    - lemma: "مُوصٍ"
      entry_id: "{auto}"
      root: "وصي"
      maqayis_quote: "«الْوَاوُ وَالصَّادُ وَالْحَرْفُ الْمُعْتَلُّ: أَصْلٌ يَدُلُّ عَلَى وَصْلِ شَيْءٍ بِشَيْءٍ... وَالْوَصِيَّةُ مِنْ هَذَا الْقِيَاسِ، كَأَنَّهُ كَلَامٌ يُوصَى أَيْ يُوصَلُ.»"
  per_sense:
    - lemma: "مُوصٍ"
      sense_id: "{auto}"
      nuance: "مصطلح فقهي وقانوني أصيل يعبر بدقة عن من يصدر وصية للتصرف بتركته بعد وفاته."
      mwe: false
  synset:
    cultural_fit: native
  actions:
