    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح فقهي وقانوني أصيل يعبر بدقة عن من يصدر وصية للتصرف بتركته بعد وفاته.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-10722985-n"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
