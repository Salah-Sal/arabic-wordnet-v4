stage4_content:
  definition:
    current: "أي من العوامل المختلفة التي تقلل مستوى الجلوكوز في الدم وتستخدم في علاج داء السكري"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتاج إلى صياغة أكثر دقة وموسوعية بأسلوب المعاجم الطبية العربية."
    authored:
      - type: terminological
        text: "مادَّةٌ كِيمْيَائِيَّةٌ تُخَفِّضُ مَسْتَوَى الغلوكوزِ فِي الدَّمِ، تُسْتَعْمَلُ غَالِبًا فِي عِلَاجِ مَرَضِ السُّكَّرِيِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مادَّةٌ كِيمْيَائِيَّةٌ تُخَفِّضُ مَسْتَوَى الغلوكوزِ فِي الدَّمِ، تُسْتَعْمَلُ غَالِبًا فِي عِلَاجِ مَرَضِ السُّكَّرِيِّ."}
  examples:
    per_lemma:
      - lemma: "خَافِضُ السُّكَّر"
        examples:
          - text: "نَصَحَ الطَّبِيبُ بِتَنَاوُلِ خَافِضِ السُّكَّرِ قَبْلَ الوَجَبَاتِ بِانْتِظَامٍ."
            type: usage
      - lemma: "عَامِلٌ خَافِضٌ لِسُكَّرِ الدَّم"
        examples:
          - text: "يُعَدُّ الأَنْسُولِينُ أَقْوَى عَامِلٍ خَافِضٍ لِسُكَّرِ الدَّمِ مُتَاحٍ حَالِيًّا."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُوصَفُ مُضَادُّ السُّكَّرِيِّ الفَمَوِيُّ لِمَرْضَى النَّمَطِ الثَّانِي مِنَ السُّكَّرِيِّ."}

stage5_enrichment:
  per_entry:
    - lemma: "خَافِضُ السُّكَّر"
      entry_id: "{auto}"
      roots:
        - word: "خافض"
          root: "خفض"
          maqayis_quote: "لم يعثر على جذر خفض في هذه النسخة من مقاييس اللغة، ولكن خفض في المعاجم الأخرى تعني النقص والحط من العلو."
        - word: "السكر"
          root: "سكر"
          maqayis_quote: "«السِّينُ وَالْكَافُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَيْرَةٍ. مِنْ ذَلِكَ السُّكْرِ مِنَ الشَّرَابِ.»"
    - lemma: "عَامِلٌ خَافِضٌ لِسُكَّرِ الدَّم"
      entry_id: "{auto}"
      roots:
        - word: "عامل"
          root: "عمل"
          maqayis_quote: "«الْعَيْنُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ، وَهُوَ عَامٌّ فِي كُلِّ فِعْلٍ يُفْعَلُ.»"
        - word: "الدم"
          root: "دمي"
          maqayis_quote: "لم يعثر على اقتباس دقيق للدم كجذر في مقاييس اللغة تحت هذا الرسم."
    - lemma: "مُضَادُّ السُّكَّرِيّ"
      entry_id: "{auto}"
      roots:
        - word: "مضاد"
          root: "ضدد"
          maqayis_quote: "«الضَّادُ وَالدَّالُ أَصْلٌ وَاحِدٌ صَحِيحٌ، وَهُوَ يَدُلُّ عَلَى خِلَافِ الشَّيْءِ.»"
  per_sense:
    - lemma: "خَافِضُ السُّكَّر"
      sense_id: "{auto}"
      nuance: "تعبير مقتضب وشائع الاستخدام."
      mwe: true
    - lemma: "عَامِلٌ خَافِضٌ لِسُكَّرِ الدَّم"
      sense_id: "{auto}"
      nuance: "تعبير طبي رسمي ودقيق يحدد الهدف الدقيق للفعل (سكر الدم)."
      mwe: true
    - lemma: "مُضَادُّ السُّكَّرِيّ"
      sense_id: "{auto}"
      nuance: "يركز على وظيفة الدواء في مكافحة المرض (السكري) ككل."
      mwe: true
  synset:
    cultural_fit: native
  actions:
