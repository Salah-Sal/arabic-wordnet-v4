stage1_review:
  assessment:
    concerns:
      - "خافض السكر مصطلح شائع ولكنه يفتقر للتعريف الدقيق في بعض السياقات"
      - "عامل خافض لسكر الدم هو ترجمة حرفية دقيقة للمصطلح الإنجليزي"
    observations: "المفهوم يشير إلى فئة من الأدوية المستخدمة لخفض جلوكوز الدم. المصطلحات العربية الموجودة جيدة ولكن يمكن إغناؤها بمصطلحات طبية معيارية من المعاجم المتخصصة."
  blind_candidates:
    - lemma: "خَافِضُ السُّكَّر"
      generation_method: tarkib
      justification: "تعبير إضافي شائع الاستخدام في الأوساط الطبية والعامة."
    - lemma: "مُخَفِّضُ السُّكَّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من فعل 'خفض' الرباعي (مزيد بالتضعيف) للدلالة على التكرار والاحترافية في الفعل."
    - lemma: "عَامِلٌ خَافِضٌ لِلسُّكَّر"
      generation_method: tarkib
      justification: "تعبير وصفي يطابق الهيكل المفهومي للمصطلح الإنجليزي (agent)."
    - lemma: "مُخَفِّضُ سُكَّرِ الدَّم"
      generation_method: tarkib
      justification: "تعبير إضافي مركب يحدد بدقة مكان خفض السكر (الدم)."

stage2_evidence:
  per_lemma:
    - lemma: "خافض السكر"
      confirm:
        - text: "«كَرْبُوتَامِيد: دواء خافض للسكر.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
    - lemma: "عامل خافض لسكر الدم"
      confirm:
        - text: "«خَافِضٌ لِسُكَّر الدَّم (hypoglycemic)»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«خافِضُ سُكَّرِ الدَّم (hypoglycemic agent)»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "مُضادُّ السُّكَّرِيّ"
      confirm:
        - text: "«مُضادُّ السُّكَّرِيّ (antidiabetic)»"
          source: "المعجم الطبي الموحد (2009)"

