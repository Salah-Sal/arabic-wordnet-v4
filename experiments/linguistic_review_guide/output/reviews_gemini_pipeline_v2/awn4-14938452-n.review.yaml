      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"خافض","root":"خفض"},{"word":"السكر","root":"سكر","maqayis":"«السِّينُ وَالْكَافُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَيْرَةٍ...»"}]}'
    - command: set_metadata
