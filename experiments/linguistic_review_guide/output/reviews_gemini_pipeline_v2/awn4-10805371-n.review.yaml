stage1_review:
  assessment:
    concerns:
      - "اللفظ 'مُمْتَنِع' غالباً ما يُستخدم في المعاجم القديمة بمعنى 'المستحيل' أو 'المتعذر' (ما اقتضت ذاته عدم وجوده)، بينما المعنى المراد هنا هو الشخص الذي يمتنع عن فعل شيء (مثل المنح)، وهو استخدام سياقي صحيح لكنه يحتاج لتدقيق."
      - "التعريف العربي الحالي بسيط جداً ويمكن تجويده ليعكس طبيعة الشخص الذي يمنع ما يجب بذله."
    observations: "المجموعة تدور حول الشخص الذي يحبس العطاء أو يمنع منح شيء ما. الألفاظ الحالية (مانع وممتنع) تغطي الجانب الوظيفي والقانوني، بينما يمكن إثراء المجموعة بألفاظ تعكس الجانب النفسي (مثل الضنين) أو الحركي (مثل الممسك)."
  blind_candidates:
    - lemma: "مَانِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (منع)، وهو اللفظ الأكثر مباشرة للتعبير عن الشخص الذي يمنع العطاء."
    - lemma: "مُمْسِك"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (أمسك)، ويُستخدم لوصف من يحبس يده عن العطاء أو يحتفظ بالشيء لنفسه."
    - lemma: "ضَنِين"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة/صفة مشبهة تدل على من يبخل بالشيء النفيس ويمنحه، وهو من مرادفات المانع في المعاجم."
    - lemma: "حَابِس"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (حبس)، ويُطلق على من يحبس الشيء عن غيره (مثل حابس الماء أو المعلومات)."

stage2_evidence:
  per_lemma:
    - lemma: "مَانِع"
      confirm:
        - text: "«(الْمَانِع) الضنين الممسك»"
          source: "المعجم الوسيط"
        - text: "«المَانِعُ: مَا يلْزم من وجوده انْتِفَاء الحكم»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يشير للمعنى الاصطلاحي في أصول الفقه."
    - lemma: "مُمْتَنِع"
      confirm:
        - text: "«ممتنِع [في الانكليزية] abstentionist [في القانون]»"
          source: "المعجم الموحد لمصطلحات القانون"
      contradicts:
        - text: "«المُمْتَنِعُ: مَا اقْتَضَت ذَاته عدم وجوده فِي الْخَارِج»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المعنى الفلسفي/المنطقي للممتنع هو المستحيل."
    - lemma: "مُمْسِك"
      confirm:
        - text: "«البخيل مُمْسِك. والإمساك: البخل»"
          source: "مقاييس اللغة"
        - text: "«(الْمَانِع) الضنين الممسك»"
          source: "المعجم الوسيط"
    - lemma: "ضَنِين"
      confirm:
        - text: "«الشديد البخل، أو البخيل بالشيء النفيس»"
          source: "المعجم الوسيط"
        - text: "«الضَّادُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى بُخْلٍ بِالشَّيْءِ... وَرَجُلٌ ضَنِينٌ»"
          source: "مقاييس اللغة"
    - lemma: "حَابِس"
      confirm:
        - text: "«حَابِس من (ح ب س) المانع الممسك والسجان»"
          source: "موسوعة السلطان قابوس"
        - text: "«زِقٌّ حابسٌ : مُمْسِكٌ لِلْماءِ»"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "مَانِع"
      decision: confirmed
      decision_reason: "هو المصطلح الأساسي المباشر الذي يعبر عن الشخص الذي يحول دون وصول الشيء لغيره."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَانِع"
    - lemma: "مُمْتَنِع"
      decision: confirmed
      decision_reason: "رغم معناه الفلسفي (المستحيل)، إلا أنه في السياق الاجتماعي والقانوني الحديث يعبر عن الشخص الذي يرفض منح موافقته أو القيام بفعل (Abstainer/Refuser)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُمْتَنِع"
    - lemma: "مُمْسِك"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي للمانع، ويؤكد عليه المعجم الوسيط ومقاييس اللغة في سياق حبس العطاء والبخل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُمْسِك", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ضَنِين"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن نوع خاص من المنح، وهو المنح المرتبط ببخل الشخص بالشيء لنفاسته (Withholder of something precious)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ضَنِين", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "حَابِس"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام قد يُقصد به السجان أو المكان، والألفاظ الأخرى في المجموعة تكفي للتعبير عن المعنى بدقة أكبر."

stage4_content:
  definition:
    current: "شخص يمتنع عن منح شيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي يميل للتبسيط اللغوي، والتعريف المعجمي المصطلحي يقتضي تحديد طبيعة المنع وأثره."
    authored:
      - type: terminological
        text: "مَنْ يَمْنَعُ غَيْرَهُ مِمَّا يَنْبَغِي بَذْلُهُ أَوْ يَحْبِسُ مَا عِنْدَهُ مِن مَالٍ أَوْ نَفْعٍ فَلَا يَمْنَحُهُ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مَنْ يَمْنَعُ غَيْرَهُ مِمَّا يَنْبَغِي بَذْلُهُ أَوْ يَحْبِسُ مَا عِنْدَهُ مِن مَالٍ أَوْ نَفْعٍ فَلَا يَمْنَحُهُ."}
  examples:
    per_lemma:
      - lemma: "مَانِع"
        examples:
          - text: "كَانَ المَانِعُ لِلصَّدَقَةِ يُذَمُّ فِي القَوْمِ لِأَنَّهُ يَحْرِمُ الفُقَرَاءَ حَقَّهُمْ."
            type: usage
      - lemma: "مُمْتَنِع"
        examples:
          - text: "يُعَدُّ المُمْتَنِعُ عَنِ الإِدْلَاءِ بِشَهَادَتِهِ مُعَرْقِلًا لِمَسَارِ العَدَالَةِ."
            type: usage
      - lemma: "مُمْسِك"
        examples:
          - text: "رَجُلٌ مُمْسِكٌ لَا يَجُودُ بِمَالِهِ وَلَا بِمَعْرُوفِهِ."
            type: usage
      - lemma: "ضَنِين"
        examples:
          - text: "هُوَ ضَنِينٌ بِمَعْلُومَاتِهِ لَا يُطْلِعُ عَلَيْهَا أَحَدًا مَهْمَا كَانَتِ الحَاجَةُ."
            type: usage

