stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (بقايا التبغ) صحيحة دلالياً لكنها عامة جداً ولا تعكس خصوصية المصطلح الإنجليزي (dottle) الذي يشير حصراً إلى الكتلة المتصلبة في وعاء الغليون."
    observations: "المفهوم يشير إلى بقايا التبغ التي تتجمع وتتصلب في قاع الغليون. العربية غنية بمصطلحات الثفل والحثالة والثمالة التي تصف الرواسب والبقايا في الأوعية."
  blind_candidates:
    - lemma: "ثُمَالَةُ الغَلْيُون"
      generation_method: tarkib
      justification: "الثمالة هي ما تبقى في أسفل الإناء، والغليون هو وعاء التدخين."
    - lemma: "حُثَالَةُ الغَلْيُون"
      generation_method: tarkib
      justification: "الحثالة هي الرديء من كل شيء وما يتبقى منه ولا خير فيه."
    - lemma: "رُسَابَة"
      generation_method: majaz
      justification: "الرواسب هي ما يتبقى في القاع، وتستخدم مجازاً لكتلة التبغ المحترق."
    - lemma: "بَقِيَّةُ الغَلْيُون"
      generation_method: tarkib
      justification: "تعبير وصفي مباشر للبقايا المتروكة في الغليون."

stage2_evidence:
  per_lemma:
    - lemma: "بقايا التبغ"
      confirm:
        - text: "«بقايا... ما يتبقى من النفايات بعد الانتهاء من عمليات فرز ما هو قابل لإعادة الاستعمال»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
    - lemma: "ثُفْلُ التِّبْغ"
      confirm:
        - text: "«الثُّفْلُ: ما استقر تحت الشيء من كدر... ما يتبقى من المادة بعد عصيرها»"
          source: "المعجم الوسيط"
        - text: "«الثّفل:[في الانكليزية] Residue ،dregs»"
          source: "كشاف اصطلاحات الفنون (التهانوي)"
    - lemma: "حُثَالَةُ التِّبْغ"
      confirm:
        - text: "«الحُثَالَةُ: الرديء من كل شيء... ثفل الطيب والدهن»"
          source: "المعجم الكبير"
    - lemma: "ثُمَالَةُ التِّبْغ"
      confirm:
        - text: "«الثمالة: البقية في أسفل الإناء من شراب ونحوه»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "بقايا التبغ"
      decision: confirmed
      decision_reason: "مصطلح شائع ومباشر لوصف المفهوم، وإن كان يفتقر للتخصيص الموجود في الإنجليزية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَقَايَا التِّبْغ"
    - lemma: "ثُفْلُ التِّبْغ"
      source: stage1
      decision: confirmed
      decision_reason: "الثفل هو أدق مصطلح تراثي لوصف الرواسب المتصلبة (dregs/residue)، وهو ما يطابق وصف (caked residue) تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "ثُفْلُ التِّبْغ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "حُثَالَةُ التِّبْغ"
      source: stage1
      decision: confirmed
      decision_reason: "الحثالة تصف البقايا الرديئة التي لا نفع منها وتطرح، وهو وصف دقيق لبقايا التبغ المحترق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "حُثَالَةُ التِّبْغ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ثُمَالَةُ التِّبْغ"
      source: stage1
      decision: confirmed
      decision_reason: "الثمالة هي ما يتبقى في قاع الوعاء، والغليون وعاء، لذا المصطلح دقيق لغوياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "ثُمَالَةُ التِّبْغ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "بقايا التبغ المحترق جزئياً المتروكة متكتلة في وعاء الغليون بعد التدخين"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويغطي الجوانب الجوهرية للمفهوم (البقايا، الاحتراق الجزئي، التكتل، المكان)."
  examples:
    per_lemma:
      - lemma: "بَقَايَا التِّبْغ"
        examples:
          - text: "عَمِدَ المُدَخِّنُ إِلَى تَنْظِيفِ قَاعِ الغَلْيُونِ مِنْ بَقَايَا التِّبْغِ المُتَحَجِّرَةِ."
            type: usage
      - lemma: "ثُفْلُ التِّبْغ"
        examples:
          - text: "تَتَرَاكَمُ حُثَالَةُ التِّبْغِ وَثُفْلُهُ فِي الغَلْيُونِ إِذَا لَمْ يُنَظَّفْ بَعْدَ كُلِّ جَلْسَةِ تَدْخِينٍ."
            type: usage
      - lemma: "حُثَالَةُ التِّبْغ"
        examples:
          - text: "أَفْرَغَ الرَّجُلُ حُثَالَةَ التِّبْغِ المُحْتَرِقِ فِي المِنْفَضَةِ."
            type: usage
      - lemma: "ثُمَالَةُ التِّبْغ"
        examples:
          - text: "تُعِيقُ ثُمَالَةُ التِّبْغِ العَالِقَةُ سَحْبَ الهَوَاءِ بِسُهُولَةٍ عَبْرَ أُنْبُوبِ الغَلْيُونِ."
            type: usage

