          text: "تدخل المُنْقِذ لانتشال الطفل من الغرق في اللحظة الأخيرة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وصل قارب الإنقاذ فكان المُنْجِي الوحيد للبحارة بعد العاصفة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وصلت فرق الدفاع المدني فكانت المُغِيث للمتضررين من الزلزال."

