    current: "شخص ينقذ شيئاً أو شخصاً من خطر أو عنف"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويعكس المعنى المقصود بشكل جيد دون حاجة ماسة للتعديل."
  examples:
    per_lemma:
      - lemma: "مُخَلِّص"
        examples:
          - text: "كان الجندي هو المُخَلِّص للرهائن من أيدي العصابة المسلحة."
