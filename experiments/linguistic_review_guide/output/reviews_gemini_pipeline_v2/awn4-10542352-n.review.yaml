stage1_review:
  assessment:
    concerns: []
    observations: "المجموعة الترادفية تعبر عن الفاعل الذي يقوم بفعل الإنقاذ والتخليص من الخطر. اللمّات الموجودة مناسبة جداً ومستعملة بكثرة، والتعريف دقيق إلى حد كبير. يمكن توسيع المجموعة لتشمل ألفاظاً أخرى من نفس الحقل الدلالي مثل (منجي) و(مغيث)."
  blind_candidates:
    - lemma: "مُنْقِذ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (أنقذ)، وهو اللفظ الأشيع للتعبير عن انتشال شخص من الخطر."
    - lemma: "مُخَلِّص"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (خلّص)، ويعني من يحرر غيره من مأزق أو خطر."
    - lemma: "مُنْجِي"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (أنجى)، وهو من يخرج غيره من الهلكة إلى بر الأمان."
    - lemma: "مُغِيث"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (أغاث)، ويدل على من يقدم النجدة السريعة لمن هو في شدة أو خطر."

stage2_evidence:
  per_lemma:
    - lemma: "مُخَلِّص"
      confirm:
        - text: "مُخَلِّص من (خ ل ص) مُصفي الشيء ومنقيه من شوائبه، ومميز الشيء من غيره."
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "مُخْلِص من (خ ل ص) من يصفى الشيء وينقيه من شوبه ومن يختار غيره ويختصه بدخيلة نفسه، وفي الاستخدام المعاصر بمعنى الوفي."
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يستخدم في المعنى المعاصر بمعنى المنقذ أو من يخلص الشيء."
    - lemma: "مُنْقِذ"
      confirm:
        - text: "مُنْقِذ الغرقى. منقذ للحياة lifesaving"
          source: "المورد الحديث (2008)"
    - lemma: "مُنْجِي"
      confirm:
        - text: "مُنْجِي من (ن ج و) المخلص غيره مما نزل به."
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "مُنَجِّي من (ن ج و) المخلص الذي يخلص الآخرين من الأذى."
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُغِيث"
      confirm:
        - text: "مُغِيث من (غ و ث) الناصر والمعين."
          source: "موسوعة السلطان قابوس لأسماء العرب"

