stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جداً ولا يعبر عن الطبيعة الكيميائية أو الاستعمال التقني للمادة."
      - "اللمّات الموجودة عبارة عن مركبات وصفية (MWEs)، بينما توجد مصطلحات مفردة فصيحة في المعاجم المتخصصة مثل 'دافع' و'داسر'."
    observations: "المجموعة تغطي مفهوم المادة الدافعة (propellant) المستخدمة في الصواريخ والذخائر. اللمّات الحالية صحيحة وشائعة، لكن المجموعة تفتقر إلى الألفاظ المفردة التي أثبتتها المجامع اللغوية والمعاجم الحديثة."
  blind_candidates:
    - lemma: "دَافِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'دفع'، وهو المصطلح المعتمد في العديد من المعاجم العلمية لترجمة propellant."
    - lemma: "مَادَّة دَافِعَة"
      generation_method: tarkib
      justification: "تركيب وصفي مباشر يعبر عن المفهوم، وهو الترجمة الأكثر شيوعاً."
    - lemma: "وَقُود دَافِع"
      generation_method: tarkib
      justification: "تركيب وصفي يخصص المادة بأنها وقود، وهو مستخدم بكثرة في سياق الصواريخ."
    - lemma: "دَفَّاع"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن 'فعّال' للدلالة على الآلة أو المادة التي تقوم بفعل الدفع بقوة."

stage2_evidence:
  per_lemma:
    - lemma: "دَافِع"
      confirm:
        - text: "«دَافِع، دَاسِر: propellant»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«دَافِع، مُسَيِّر: propellant»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
      expands:
        - text: "«الدَّافِعُ: مِن الشَّاءِ والنُّوقِ: التى تَدْفَعُ اللَّبَنَ...»"
          source: "المعجم الكبير"
          addition: "المعنى اللغوي القديم يرتبط بدفع اللبن، بينما المعنى الحديث تقني."
    - lemma: "دَاسِر"
      confirm:
        - text: "«دَافِع، دَاسِر: propellant»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«داسر: يميز في المحركات الإشعاعية جزء من المحرك... بسبب الدفع يتم من خلال دفع الغاز عكس اتجاه الطيران»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
    - lemma: "وَقُود دَفْعِيّ"
      confirm:
        - text: "«دافع، داسر: وقود دفعي يتكون من مادة مشتعلة وأخرى مؤكسدة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "مَادَّة دَافِعَة"
      confirm:
        - text: "«طاقة دافعة: مادة أو مجموعة مواد يُولِّد تفاعلها الكيميائي طاقة تُستعمل في الدفع الذاتي للصواريخ...»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "وَقُود دَافِع"
      confirm:
        - text: "«وقود دفعي يتكون من مادة مشتعلة وأخرى مؤكسدة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"

