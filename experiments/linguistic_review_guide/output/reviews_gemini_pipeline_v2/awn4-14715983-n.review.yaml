stage4_content:
  definition:
    current: "أي مادة تقوم بالدفع"
    assessment:
      decision: revise
      reason: "التعريف الحالي مفرط في البساطة ولا يحدد السياق التقني للمادة."
    authored:
      - type: terminological
        text: "مادة أو مزيج من المواد الكيميائية يُولِّد احتراقُها أو تفاعلها طاقةً أو غازاتٍ تُستخدم في دفع الصواريخ أو القذائف أو المحركات."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14715983-n", definition_index: 0, text: "مادة أو مزيج من المواد الكيميائية يُولِّد احتراقُها أو تفاعلها طاقةً أو غازاتٍ تُستخدم في دفع الصواريخ أو القذائف أو المحركات."}
  examples:
    per_lemma:
      - lemma: "مَادَّة دَافِعَة"
        examples:
          - text: "يُستخدم النيتروجين السائل مادةً دافعة في أنظمة التحكم في وضعية الأقمار الصناعية."
            type: usage
      - lemma: "وَقُود دَافِع"
        examples:
          - text: "يتطلب الوصول إلى المدار الأرضي وقوداً دافعاً ذا كفاءة عالية وكتلة منخفضة."
            type: usage
      - lemma: "دَافِع"
        examples:
          - text: "يُعد الأكسجين السائل دافعاً أساسياً في معظم المحركات الصاروخية ذات الوقود السائل."
            type: usage
      - lemma: "دَاسِر"
        examples:
          - text: "تُصنف الحبيبات الكربونية ضمن الدواسر الصلبة المستخدمة في المحركات التقليدية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-14715983-n", text: "تعتمد كفاءة الصاروخ بشكل أساسي على نوع المادة الدافعة المستخدمة."}

