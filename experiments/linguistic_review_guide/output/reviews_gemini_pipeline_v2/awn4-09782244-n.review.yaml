stage1_review:
  assessment:
    concerns:
      - "اللمّات الحاليّة محدودة جدًا، ونحتاج لتوسيع المجموعة لتشمل مفاهيم الفوز والتفوّق."
    observations: "المجموعة تدلّ على الفرد الذي يحقّق نتائج ملموسة ونجاحات مستمرّة. المصطلحات العربيّة المتوفّرة (ناجح، منجز) دقيقة، ولكن يمكن إثراؤها بمرادفات تعكس جوانب الظفر والفوز."
  blind_candidates:
    - lemma: "نَاجِحٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من نجح، وهو المصطلح الأساسي والأكثر شيوعًا للفرد الذي يحقّق النجاح."
    - lemma: "مُنْجِزٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أنجز، يدلّ على الشخص الذي يتمّ المهام ويحقّق الإنجازات."
    - lemma: "فَائِزٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من فاز، يدلّ على من نال مراده وظفر بمطلوبه."
    - lemma: "مُتَفَوِّقٌ"
      generation_method: ishtiqaq
      justification: "يدلّ على الشخص الذي يتجاوز أقرانه ويحقّق نجاحًا باهرًا (High Achiever)."

stage2_evidence:
  per_lemma:
    - lemma: "نَاجِحٌ"
      confirm:
        - text: "«الفائز الظاهر، والأمر المتيسر المتهيئ للتمام.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«شخص ناجح»"
          source: "المورد الحديث"
    - lemma: "مُنْجِزٌ"
      confirm:
        - text: "«نَجَزَ الشيءُ نَجْزًا: تمَّ وقُضِيَ؛ وأَنْجَزَهُ: أتمَّه وقضاه.»"
          source: "المعجم الوسيط"
        - text: "«مُنْجَزٌ من نقطة وقوف (standing jump)»"
          source: "المورد الحديث"
    - lemma: "فَائِزٌ"
      confirm:
        - text: "«الظافر بالخير والناجي من الشر والرابح.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الفائز؛ الظّافر؛ الرّابح (winner)»"
          source: "المورد الحديث"
    - lemma: "مُتَفَوِّقٌ"
      confirm:
        - text: "«متفوِّق: بارز، ممتاز، ناجح جدًّا.»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "ناجح"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشائع جدًّا، وله مستند معجمي واضح يدلّ على الفوز والظفر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَاجِحٌ"
    - lemma: "مُنجز"
      decision: confirmed
      decision_reason: "يدلّ على الجانب العملي من النجاح وهو إتمام المهام (achievement)، وهو مصطلح عصري فصيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْجِزٌ"
    - lemma: "فَائِزٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قويّ يعبّر عن جانب الظفر والربح، ومستند إلى معاجم الأسماء والمعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَائِزٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُتَفَوِّقٌ"
      source: stage1
      decision: confirmed
      decision_reason: "يغطّي مفهوم 'overachiever' أو الشخص الذي يحقّق مراتب عليا من النجاح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُتَفَوِّقٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص لديه سجل من النجاحات"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط؛ يحتاج صياغة معجمية أدقّ تعكس الاستمرارية والإنجاز."
    authored:
      - type: terminological
        text: "فردٌ يُحقِّقُ نَتَائجَ بَارِزَةً ويُحرِزُ نَجَاحاتٍ مُتَكَرِّرَةً فِي مَجَالِ عَمَلِهِ أَوْ حَيَاتِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "نَاجِحٌ"
        examples:
          - text: "يُعدُّ هَذا الرَّجُلُ نَاجِحًا فِي كُلِّ مَشْرُوعٍ يَخُوضُ فِيهِ."
            type: usage
      - lemma: "مُنْجِزٌ"
        examples:
          - text: "يَحتَاجُ الفَرِيقُ إِلَى قَائِدٍ مُنْجِزٍ يَعرِفُ كَيفَ يُحَوِّلُ الأَفْكَارَ إِلَى وَاقِعٍ."
            type: usage
      - lemma: "فَائِزٌ"
        examples:
          - text: "ظَلَّ فَائِزًا فِي كُلِّ المَسَابَقَاتِ الَّتِي شَارَكَ فِيهَا بِفَضْلِ دَأَبِهِ."
            type: usage
      - lemma: "مُتَفَوِّقٌ"
        examples:
          - text: "كُرِّمَ الطَّالِبُ لِأَنَّهُ كَانَ مُتَفَوِّقًا فِي دِرَاسَتِهِ وأَنْشِطَتِهِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "فردٌ يُحقِّقُ نَتَائجَ بَارِزَةً ويُحرِزُ نَجَاحاتٍ مُتَكَرِّرَةً فِي مَجَالِ عَمَلِهِ أَوْ حَيَاتِهِ."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعتبرُ هَذا الرَّائِدُ شَخصًا نَاجِحًا ومُنْجِزًا فِي مَجالِ رِيادَةِ الأَعْمَالِ."}

stage5_enrichment:
  per_entry:
    - lemma: "نَاجِحٌ"
      entry_id: "{auto}"
      root: "نجح"
      maqayis_quote: "«النُّونُ وَالْجِيمُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى ظَفَرٍ وَصِدْقٍ وَخَيْرٍ. مِنْهُ النَّجَاحُ فِي الْحَوَائِجِ: الظَّفَرُ بِهَا.»"
    - lemma: "مُنْجِزٌ"
      entry_id: "{auto}"
      root: "نجز"
      maqayis_quote: "«النُّونُ وَالْجِيمُ وَالزَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى كَمَالِ شَيْءٍ فِي عَجَلَةٍ مِنْ غَيْرِ بُطْءٍ.»"
    - lemma: "فَائِزٌ"
      entry_id: "{auto}"
      root: "فوز"
      maqayis_quote: "«الْفَاءُ وَالْوَاوُ وَالزَّاءُ كَلِمَتَانِ مُتَضَادَّتَانِ. فَالْأُولَى النَّجَاةُ... وَيُقَالُ لِمَنْ ظَفِرَ بِخَيْرٍ وَذَهَبَ بِهِ.»"
    - lemma: "مُتَفَوِّقٌ"
      entry_id: "{auto}"
      root: "فوق"
      maqayis_quote: "«الْفَاءُ وَالْوَاوُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى عُلُوٍّ.»"
  per_sense:
    - lemma: "نَاجِحٌ"
      sense_id: "{auto}"
      nuance: "المصطلح العام والشامل لأي نوع من أنواع تحقيق الأهداف."
      mwe: false
    - lemma: "مُنْجِزٌ"
      sense_id: "{auto}"
      nuance: "يركّز على جانب إتمام الأعمال وإنهاء المهام بكفاءة (Task-oriented achievement)."
      mwe: false
    - lemma: "فَائِزٌ"
      sense_id: "{auto}"
      nuance: "يوحي بالتغلّب على منافسين أو نيل جائزة أو مكافأة نتيجة النجاح."
      mwe: false
    - lemma: "مُتَفَوِّقٌ"
      sense_id: "{auto}"
      nuance: "يدلّ على النجاح الذي يتجاوز المألوف ويصل إلى مراتب عليا من التميّز."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نجح","maqayis":"«النُّونُ وَالْجِيمُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى ظَفَرٍ وَصِدْقٍ وَخَيْرٍ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح العام والشامل لأي نوع من أنواع تحقيق الأهداف.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
