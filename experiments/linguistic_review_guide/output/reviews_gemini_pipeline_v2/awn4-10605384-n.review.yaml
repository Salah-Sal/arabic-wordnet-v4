stage1_review:
  assessment:
    concerns:
      - "اللمة 'مُؤَثِّر' قد تلتبس بالمعنى الحديث الدال على مؤثر الشبكات الاجتماعية (influencer) أكثر من صاحب السلطة السياسية أو الفعلية."
    observations: "مفهوم يصف الشخص الذي يمتلك السلطة والنفوذ والقدرة على التأثير في مجريات الأمور. الترجمة العربية الحالية 'صاحب نفوذ' دقيقة ومناسبة وتعد مركباً إضافياً واسع الاستخدام. إضافة 'متنفذ' أو 'قطب' تعزز وتغني المجموعة بكلمات أكثر فصاحة وعمقاً."
  blind_candidates:
    - lemma: "مُتَنَفِّذ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل الخماسي تَنَفَّذَ، ويدل على الشخص الذي يملك نفوذاً وسلطة واسعة في محيطه."
    - lemma: "صَاحِبُ نُفُوذٍ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر بشكل مباشر وواضح عن الشخص الذي يمتلك النفوذ والسلطة."
    - lemma: "قُطْب"
      generation_method: majaz
      justification: "مجاز من قطب الرحى الذي تدور عليه، ويطلق على الشخص الذي يدور عليه أمر القوم ويمتلك السلطة المركزية."
    - lemma: "وَجِيه"
      generation_method: ishtiqaq
      justification: "من الجذر (و ج ه)، يدل على ذي الوجاهة والمكانة والسلطة في قومه."

stage2_evidence:
  per_lemma:
    - lemma: "صَاحِب نُفُوذ"
      evidence_status: "no_material_found"

    - lemma: "مُؤَثِّر"
      confirm:
        - text: "«(1) مُؤَثِّر (2) متنفّذ: ذو سلطةٍ أو نفوذ.»"
          source: "المورد الحديث (2008)"

    - lemma: "مُتَنَفِّذ"
      confirm:
        - text: "«(2) متنفّذ: ذو سلطةٍ أو نفوذ.»"
          source: "المورد الحديث (2008)"

    - lemma: "قُطْب"
      confirm:
        - text: "«هو قُطْب قبيلته/ هو قُطْب عائلته: سيِّدهم الذي يدور عليه أمرهم.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«فُلَانٌ قُطْبُ بَنِي فُلَانٍ، أَيْ سَيِّدُهُمُ الَّذِي يَلُوذُونَ بِهِ.»"
          source: "مقاييس اللغة"

    - lemma: "وَجِيه"
      confirm:
        - text: "«الوجيه: من فيه خصال حميدة من شأنه أن يعرف ولا ينكر.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«وَجِيْه من (و ج ه) ذو الوجاه وسيد القوم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

