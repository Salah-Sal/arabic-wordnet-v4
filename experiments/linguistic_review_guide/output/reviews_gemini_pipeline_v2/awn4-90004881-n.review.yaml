stage1_review:
  assessment:
    concerns:
      - "المصطلحات الحالية تتراوح بين العام جداً (محتاط) والوصفي الصرف (مستعد للكوارث)."
      - "يفتقر الساينسيت إلى المصطلح العربي المعاصر الأكثر دقة لهذا المفهوم وهو (بقائي)."
    observations: "الساينسيت يعبر عن مفهوم 'Prepper' أو 'Survivalist'، وهو الشخص الذي يتحسب للأزمات الكبرى بتأمين احتياجاته. اللمات المقترحة تهدف لتعزيز الدقة الاصطلاحية."
  blind_candidates:
    - lemma: "بَقَائِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى البقاء، وهو المصطلح المعاصر المقابل لـ Survivalist."
    - lemma: "مُتَأَهِّب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تأهب، ويعبر عن حالة الاستعداد التام واتخاذ العدة (الأهبة)."
    - lemma: "مُدَّخِر"
      generation_method: ishtiqaq
      justification: "يعبر عن جانب تخزين المؤونة والاحتياجات، وهو جزء أساسي من التعريف."
    - lemma: "مُحْتَرِز"
      generation_method: ishtiqaq
      justification: "مرادف للمحتاط، يعبر عن التحرز من الأخطار المتوقعة."

stage2_evidence:
  per_lemma:
    - lemma: "مُحْتَاط"
      confirm:
        - text: "«كان ثقة محتاطاً، وكان فيه عسر وملل في الحديث والحكومة»"
          source: "معجم البلدان (في ترجمة الحرستاني)"
      expands:
        - text: "«احتاط فلان: أخذ في أموره بأوثق الوجوه»"
          source: "المعجم الوسيط"
    - lemma: "مُتَأَهِّب"
      confirm:
        - text: "«وكانت متأهبة لتنفيذ أوامر الأمير»"
          source: "تاريخ الأندلس (في وصف كتيبة)"
      expands:
        - text: "«الأُهْبَةُ: العُدَّة، يقال أخَذَ لذلك الأمر أُهْبَتَه»"
          source: "المعجم الكبير"
    - lemma: "بَقَائِيّ"
      evidence_status: "no_material_found"
    - lemma: "مُسْتَعِدّ لِلْكَوَارِث"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُحْتَاط"
      decision: confirmed
      decision_reason: "مصطلح عام يعبر عن جوهر المفهوم (الاحتياط)، وهو مقبول كمرادف واسع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركز على الجانب الذهني والسلوكي العام في توخي الحذر واتخاذ الأوثق."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحْتَاط"
    - lemma: "مُسْتَعِدّ لِلْكَوَارِث"
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق للمفهوم، وإن كان مركباً إلا أنه شائع الاستخدام في هذا السياق."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يحدد طبيعة الاستعداد بأنه موجه حصراً نحو الكوارث."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَعِدّ لِلْكَوَارِث"
    - lemma: "بَقَائِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح المعاصر الأكثر دقة لترجمة Survivalist، وشائع في المحتوى المتخصص."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركز على هدف البقاء والنجاة كفلسفة وسلوك عملي."
      actions:
        - command: create_entry
          params: {lemma: "بَقَائِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُتَأَهِّب"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي وفصيح يعبر عن اتخاذ العدة والجاهزية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يؤكد على حالة الجاهزية القصوى واتخاذ العدة (الأهبة) المادية."
      actions:
        - command: create_entry
          params: {lemma: "مُتَأَهِّب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يجهز نفسه ومؤونته تحسباً لوقوع كارثة"
    assessment:
      decision: revise
      reason: "لجعله أكثر صياغة معجمية وشمولاً لجوانب المفهوم (التدرب والتخزين)."
    authored:
      - type: terminological
        text: "شَخْصٌ يَعْمَلُ عَلَى التَّأَهُّبِ لِلْكَوَارِثِ أَوِ الأَزَمَاتِ بِتَخْزِينِ المَؤُونَةِ وَالمُعَدَّاتِ وَالتَّدَرُّبِ عَلَى مَهَارَاتِ البَقَاءِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ يَعْمَلُ عَلَى التَّأَهُّبِ لِلْكَوَارِثِ أَوِ الأَزَمَاتِ بِتَخْزِينِ المَؤُونَةِ وَالمُعَدَّاتِ وَالتَّدَرُّبِ عَلَى مَهَارَاتِ البَقَاءِ."}
  examples:
    per_lemma:
      - lemma: "مُحْتَاط"
        examples:
          - text: "يُعرف الجارُ بأنه رجلٌ محتاطٌ، فقد جهّز ملجأً في حديقته تحسباً لأي طارئ."
            type: usage
      - lemma: "بَقَائِيّ"
        examples:
          - text: "انضمّ الشابُّ إلى مجموعةٍ من البقائيين للتدرّب على تقنيات العيش في الظروف القاسية."
            type: usage
      - lemma: "مُسْتَعِدّ لِلْكَوَارِث"
        examples:
          - text: "أصبح المواطنُ مستعداً للكوارث بعد أن أدرك أهمية تأمين مخزون استراتيجي من الغذاء."
            type: usage
      - lemma: "مُتَأَهِّب"
        examples:
          - text: "ظلّ الناشطُ البيئيُّ متأهباً لمواجهة أيّ فيضانٍ محتملٍ بتجهيز معدات الإنقاذ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "انضمّ الشابُّ إلى مجموعةٍ من البقائيين للتدرّب على تقنيات العيش في الظروف القاسية."}

stage5_enrichment:
  per_entry:
    - lemma: "مُحْتَاط"
      entry_id: "{auto}"
      root: "حوط"
      maqayis_quote: "«الحاء والواو والطاء كلمة واحدة وهو الشيء يطيف بالشيء»"
    - lemma: "بَقَائِيّ"
      entry_id: "{auto}"
      root: "بقي"
      maqayis_quote: "«الباء والقاف والياء كلمة واحدة تدل على دوام الشيء»"
    - lemma: "مُتَأَهِّب"
      entry_id: "{auto}"
      root: "أهب"
      maqayis_quote: "«الأهبة: العدة»"
    - lemma: "مُسْتَعِدّ لِلْكَوَارِث"
      entry_id: "{auto}"
      roots:
        - word: "مستعد"
          root: "عدد"
          maqayis_quote: "«العين والدال أصل واحد يدل على الإحصاء»"
        - word: "كوارث"
          root: "كرث"
          maqayis_quote: "«الكاف والراء والثاء أصل يدل على غلبة الشدّة وتراكم الهمّ»"
  per_sense:
    - lemma: "مُحْتَاط"
      sense_id: "{auto}"
      nuance: "يركز على الجانب الذهني والسلوكي العام في توخي الحذر."
      mwe: false
    - lemma: "بَقَائِيّ"
      sense_id: "{auto}"
      nuance: "يركز على هدف النجاة والعيش في الظروف الصعبة كمنهج حياة."
      mwe: false
    - lemma: "مُسْتَعِدّ لِلْكَوَارِث"
      sense_id: "{auto}"
      nuance: "يركز على طبيعة الحدث المستهدف وهو الكوارث تحديداً."
      mwe: true
    - lemma: "مُتَأَهِّب"
      sense_id: "{auto}"
      nuance: "يؤكد على امتلاك العتاد (الأهبة) والجاهزية المادية."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حوط","maqayis":"«الحاء والواو والطاء كلمة واحدة وهو الشيء يطيف بالشيء»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على الجانب الذهني والسلوكي العام في توخي الحذر.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
