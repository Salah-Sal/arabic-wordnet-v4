stage1_review:
  assessment:
    concerns:
      - اللمات الحالية (إقليم، منطقة) كافية ولكن يمكن إثراؤها بمرادفات تراثية تعبر عن "الرقعة الواسعة" بدقة أكبر.
      - لفظ "منطقة" في الأصل هو "الحزام" ولم ينتقل لدلالة المكان إلا في العصر الحديث (مجازاً).
    observations: "المجموعة تعبر عن مفهوم جغرافي عام للرقعة المكانية الواسعة. التعريف الحالي دقيق ويتطابق مع المفهوم الإنجليزي (region)."
  blind_candidates:
    - lemma: "صُقْع"
      generation_method: ishtiqaq
      justification: "لفظ عربي فصيح يطلق على الناحية أو الجهة من البلاد، ويجمع على أصقاع، وهو دقيق في الدلالة على المساحات الواسعة."
    - lemma: "قُطْر"
      generation_method: majaz
      justification: "يطلق في الأصل على الجانب والناحية، وشاع استخدامه للدلالة على الأقاليم والبلدان الواسعة."
    - lemma: "نَاحِيَة"
      generation_method: ishtiqaq
      justification: "اسم مكان من 'نحا' بمعنى قصد، ويطلق على الجانب أو الجزء من الأرض."
    - lemma: "حَيِّز"
      generation_method: ishtiqaq
      justification: "يعبر عن الحيز المكاني أو المساحة التي يشغلها الشيء، ويستخدم للدلالة على المناطق المحددة."

stage2_evidence:
  per_lemma:
    - lemma: "إِقْلِيم"
      confirm:
        - text: "«الصُّقْع [مفرد]: ج أصقاع: ناحية، جهة، إقليم... جاب أصقاعَ البلاد»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«إقليم مناخي: مجال جغرافي له خصائص مناخية متشابهة»"
          source: "ArabTerm"
    - lemma: "مِنْطَقَة"
      confirm:
        - text: "«وشاع استعمالها حديثًا للتعبير عن المكان المحدد، وقد أجاز مجمع اللغة المصري استعمال المنطقة عن طريق المجاز المرسل في المكان المحدد بالمعنى الجغرافي»"
          source: "معجم الصواب اللغوي"
        - text: "«مِنطَقة: region»"
          source: "ArabTerm"
    - lemma: "صُقْع"
      confirm:
        - text: "«صُقْعٌ A district, quarter, or tract, syn. نَاحِيَةٌ... of a country: (Msb:) and a place, region, quarter...»"
          source: "Lane"
        - text: "«الصُّقْعُ النَّاحِيَةُ... الْمَعْنَى إِلَى أَيِّ صَقْعٍ ذَهَبَ»"
          source: "مقاييس اللغة"
    - lemma: "قُطْر"
      confirm:
        - text: "«القُطْر، بالضم: الناحية والجانب، والجمع أَقْطار... وفي التنزيل العزيز: من أَقطار السموات والأَرض؛ أَقطارُها: نواحيها»"
          source: "لسان العرب"
    - lemma: "نَاحِيَة"
      confirm:
        - text: "«(الْجِهَة) الْجَانِب والناحية والموضع الَّذِي تتَوَجَّه إِلَيْهِ وتقصده»"
          source: "المعجم الوسيط"
    - lemma: "حَيِّز"
      expands:
        - text: "«الحَيِّز والمكان لأنّ كلا منهما مقصد الحركات ومنتهاها لكن لا بالحصول عنده بل بالحصول فيه»"
          source: "كشاف اصطلاحات الفنون"

stage3_analysis:
  per_lemma:
    - lemma: "إِقْلِيم"
      decision: confirmed
      decision_reason: "مصطلح جغرافي أصيل (معرب قديم) يعبر بدقة عن الرقعة المكانية ذات الخصائص المشتركة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِقْلِيم"
    - lemma: "مِنْطَقَة"
      decision: confirmed
      decision_reason: "أكثر المصطلحات شيوعاً في العصر الحديث للدلالة على الإقليم أو المنطقة الجغرافية، وقد أقره المجمع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِنْطَقَة"
    - lemma: "صُقْع"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي فصيح جداً في الدلالة على المناطق الشاسعة وغير المحددة بدقة (أصقاع)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "صُقْع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "قُطْر"
      source: stage1
      decision: confirmed
      decision_reason: "من الألفاظ القرآنية (أقطار السموات) التي تعبر عن النواحي الشاسعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "قُطْر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَاحِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي وشائع الاستخدام في السياقات العامة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَاحِيَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "رقعة واسعة غير محدّدة بدقّة على سطح الأرض"
    assessment:
      decision: revise
      reason: "لجعل التعريف أكثر دقة واحترافية بأسلوب المعاجم المتخصصة."
    authored:
      - type: terminological
        text: "مساحة فسيحة من سطح الأرض تتميز بخصائص طبيعية أو جغرافية أو إدارية مشتركة، وعادة ما تكون حدودها غير دقيقة أو واسعة النطاق."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مساحة فسيحة من سطح الأرض تتميز بخصائص طبيعية أو جغرافية أو إدارية مشتركة، وعادة ما تكون حدودها غير دقيقة أو واسعة النطاق."}
  examples:
    per_lemma:
      - lemma: "إِقْلِيم"
        examples:
          - text: "يتميز هذا الإقليم بمناخ مداري حار طوال العام."
            type: usage
      - lemma: "مِنْطَقَة"
        examples:
          - text: "تقع المنطقة الصناعية في ضواحي المدينة."
            type: usage
      - lemma: "صُقْع"
        examples:
          - text: "جاب الرحالة أصقاع الأرض بحثاً عن الآثار المفقودة."
            type: usage
      - lemma: "قُطْر"
        examples:
          - text: "انتشر صيت العلم في جميع أقطار البلاد."
            type: usage
      - lemma: "نَاحِيَة"
        examples:
          - text: "هاجرت القبائل إلى ناحية خصبة من الوادي."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تضم هذه القارة أقاليم جغرافية متنوعة التضاريس."}

stage5_enrichment:
  per_entry:
    - lemma: "إِقْلِيم"
      entry_id: "{auto}"
      root: "قلم"
      maqayis_quote: "«الْقَافُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَسْوِيَةِ شَيْءٍ عِنْدَ بَرْيِهِ وَإِصْلَاحِهِ» (كلمة معربة تعامل معاملة هذا الجذر)"
    - lemma: "مِنْطَقَة"
      entry_id: "{auto}"
      root: "نطق"
      maqayis_quote: "«النُّونُ وَالطَّاءُ وَالْقَافُ أَصْلَانِ صَحِيحَانِ... الْآخَرُ النِّطَاقُ: إِزَارٌ فِيهِ تِكَّةٌ... وَالْمِنْطَقَةُ: اسْمٌ لِشَيْءٍ بِعَيْنِهِ»"
    - lemma: "صُقْع"
      entry_id: "{auto}"
      root: "صقع"
      maqayis_quote: "«الصَّادُ وَالْقَافُ وَالْعَيْنُ أُصُولٌ ثَلَاثَةٌ... وَيَكُونُ مِنْ هَذَا الْبَابِ قَوْلُهُمْ: مَا أَدْرِي أَيْنَ صَقَعَ، أَيْ ذَهَبَ، وَالْمَعْنَى إِلَى أَيِّ صَقْعٍ ذَهَبَ»"
    - lemma: "قُطْر"
      entry_id: "{auto}"
      root: "قطر"
      maqayis_quote: "«الْقَافُ وَالطَّاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى سُقُوطِ شَيْءٍ قِطْعَةً بَعْدَ قِطْعَةٍ... وَالْقُطْرُ: النَّاحِيَةُ»"
    - lemma: "نَاحِيَة"
      entry_id: "{auto}"
      root: "نحو"
      maqayis_quote: "«النُّونُ وَالْحَاءُ وَالْوَاوُ كَلِمَةٌ تَدُلُّ عَلَى قَصْدٍ. وَنَحَوْتُ نَحْوَهُ»"
  per_sense:
    - lemma: "إِقْلِيم"
      sense_id: "{auto}"
      nuance: "توحي بالتميز الجغرافي أو المناخي أو الإداري (مثل الأقاليم المناخية)."
      mwe: false
    - lemma: "مِنْطَقَة"
      sense_id: "{auto}"
      nuance: "أكثر عمومية وتستخدم في السياقات الحديثة والتقنية (مثل المنطقة العسكرية أو الصناعية)."
      mwe: false
    - lemma: "صُقْع"
      sense_id: "{auto}"
      nuance: "توحي بالبعد والشساعة والاستغراق المكاني (أصقاع الأرض)."
      mwe: false
    - lemma: "قُطْر"
      sense_id: "{auto}"
      nuance: "تشير إلى الجانب أو الرقعة الواسعة وغالباً ما ترتبط بالبلدان (أقطار العالم العربي)."
      mwe: false
    - lemma: "نَاحِيَة"
      sense_id: "{auto}"
      nuance: "تشير إلى جهة معينة أو جزء مقتطع من مكان أكبر."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قلم","maqayis":"«الْقَافُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نطق","maqayis":"«النُّونُ وَالطَّاءُ وَالْقَافُ أَصْلَانِ صَحِيحَانِ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"توحي بالتميز الجغرافي أو المناخي أو الإداري","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
