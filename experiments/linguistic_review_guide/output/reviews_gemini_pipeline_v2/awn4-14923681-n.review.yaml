stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'وسط' تفتقر إلى التشكيل الكامل، مما قد يؤدي لخلطها مع 'وَسْط' (الظرفية) أو 'وَسِطَ' (الفعل)."
      - "التعريف الحالي دقيق علمياً ولكنه مقتضب جداً، وقد يستفيد من توسيع طفيف ليشمل حالات الغمر أو التثبيت."
    observations: "المفهوم يشير إلى المادة التي توضع فيها العينات البيولوجية (سواء للحفظ الكيميائي أو للعرض المجهري). المصطلح العربي القياسي في العلوم لهذه المادة هو 'الوسط'."
  blind_candidates:
    - lemma: "وَسَط"
      generation_method: ishtiqaq
      justification: "المصطلح العلمي الأكثر شيوعاً للمادة التي تعمل كبيئة أو ناقل أو حاضن في الفيزياء والأحياء."
    - lemma: "وَسِيط"
      generation_method: majaz
      justification: "يُستخدم أحياناً للإشارة إلى المادة التي يتم من خلالها إجراء عملية ما، وإن كان أكثر شيوعاً في سياق الوساطة البشرية أو الفنية."
    - lemma: "مُسْتَنْبَت"
      generation_method: ishtiqaq
      justification: "يُستخدم في البيولوجيا وتحديداً لعلم الأحياء الدقيقة (المستنبت الجرثومي)، وهو نوع من أنواع الأوساط."
    - lemma: "بِيئَة"
      generation_method: majaz
      justification: "تُستخدم أحياناً بمعنى 'medium' في السياق البيئي أو الحيوي الواسع."

stage2_evidence:
  per_lemma:
    - lemma: "وَسَط"
      confirm:
        - text: "(حي) محيط دائرة إقامة الإنسان، مجال نشاطه الحياتيّ، مجموع المؤثِّرات الخارجيَّة على كائن حيّ 'وَسَط اجتماعيّ/ ثقافيّ/ فنّيّ/ سياسيّ/ بيئيّ/ عائليّ'."
          source: "معجم اللغة العربية المعاصرة"
        - text: "الناقل؛ الوَسَط: مادة متخلِّلة تعمل عَبْرَها قوةٌ ما أو يُحْدَث أثرٌ ما The air is a medium for sound.. مادة محيطة بشيء أو مغلِّفة له."
          source: "المورد الحديث"
        - text: "المادة المستخدمة في مرشح لتشكيل حاجز أمام مرور بعض المواد العالقة أو الجزيئات المنحلة (medium)."
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
      expands:
        - text: "وسط انتشار (dispersion medium)، وسط خارجي (external medium)، وسط داخلي (internal medium)."
          source: "المعجم الموحد لمصطلحات علم الأحياء"
    - lemma: "مُسْتَنْبَت"
      confirm:
        - text: "أي مادة أو مستحضر يستعمل في استنبات الخلايا الحية (culture medium)."
          source: "معجم المصطلحات الطبية"
        - text: "مُسْتَنْبَت: (culture medium)."
          source: "المعجم الطبي الموحد"
      expands:
        - text: "يُستخدم تحديداً لنمو وتكثير الكائنات، بينما الوسط (medium) أعم ويشمل الحفظ والعرض."
          source: "تحليل المصطلحات الطبية"
    - lemma: "وَسِيط"
      confirm:
        - text: "يستخدم لتمييع اللون، كالزيوت والماء والورنيش (medium)."
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
      contradicts:
        - text: "شخص يتوسط بين طرفين مُتنازعين."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
          conflict: "المعنى الغالب هو الوساطة البشرية وليس المادة الفيزيائية."

stage3_analysis:
  per_lemma:
    - lemma: "وسط"
      decision: confirmed
      decision_reason: "المصطلح العربي الأصيل والمستخدم عالمياً في جميع المجالات العلمية للتعبير عن 'medium'. يتفق تماماً مع تعريف المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَسَط"
    - lemma: "مُسْتَنْبَت"
      source: stage1
      decision: removed
      decision_reason: "يختص بالوسط المستخدم لتنمية الكائنات (culture medium) وله مجموعة ترادفية مستقلة (i115379). هذه المجموعة (i115378) تركز على الحفظ والعرض."
    - lemma: "وَسِيط"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من استخدامه في الفن لتمييع الألوان، إلا أن 'وَسَط' هو المصطلح السائد في البيولوجيا للعينات."
    - lemma: "بِيئَة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح واسع يشمل الظروف المحيطة ولا يقتصر على المادة الفيزيائية التي تُغمر فيها العينة."

stage4_content:
  definition:
    current: "(بيولوجيا) مادة تحفظ فيها العينات أو تعرض"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب؛ توسيعه بذكر طبيعة المادة (سائلة أو صلبة) وفعل الغمر أو التثبيت يجعله أكثر دقة معجمية."
    authored:
      - type: terminological
        text: "مادّةٌ سائلةٌ أو جَامِدةٌ تُغمَرُ فيها أو تُوضَعُ عليها عَيِّناتُ الأَحياءِ لِحِفْظِها أو فحصِها مِجْهَرِيًّا أو عَرْضِها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "وَسَط"
        examples:
          - text: "يُحْفَظُ الْجَنِينُ فِي وَسَطٍ مِنَ الْفُورْمَالِينِ لِحِمَايَةِ أَنْسِجَتِهِ مِنَ التَّحَلُّلِ."
            type: usage
          - text: "تُثَبَّتُ الْقِطَاعَاتُ النَّسِيجِيَّةُ فِي وَسَطِ تَحْمِيلٍ رَاتِينِيٍّ قَبْلَ فَحْصِهَا بِالْمِجْهَرِ."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ سائلةٌ أو جَامِدةٌ تُغمَرُ فيها أو تُوضَعُ عليها عَيِّناتُ الأَحياءِ لِحِفْظِها أو فحصِها مِجْهَرِيًّا أو عَرْضِها."

