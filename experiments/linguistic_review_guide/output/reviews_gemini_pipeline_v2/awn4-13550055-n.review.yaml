        - word: "جمود"
          root: "جمد"
          maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ، وَهُوَ جُمُودُ الشَّيْءِ الْمَائِعِ مِنْ بَرَدٍ أَوْ غَيْرِهِ.»"
        - word: "فكري"
          root: "فكر"
          maqayis_quote: "«الْفَاءُ وَالْكَافُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَرَدُّدُ الْقَلْبِ فِي الشَّيْءِ.»"
    - lemma: "تَصَلُّب الرَّأْي"
      entry_id: "{auto}"
      roots:
        - word: "تصلب"
          root: "صلب"
          maqayis_quote: "«الصَّادُ وَاللَّامُ وَالْبَاءُ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى الشِّدَّةِ وَالْقُوَّةِ... فَالْأَوَّلُ الصُّلْبُ، وَهُوَ الشَّيْءُ الشَّدِيدُ.»"
        - word: "الرأي"
          root: "رأي"
          maqayis_quote: "«الرَّاءُ وَالْهَمْزَةُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ إِدْرَاكُ الشَّيْءِ بِبَصَرٍ أَوْ بَصِيرَةٍ.»"
    - lemma: "تَكَلُّس فِكْرِيّ"
      entry_id: "{auto}"
      roots:
        - word: "تكلس"
          root: "كلس"
          maqayis_quote: "«الْكَافُ وَاللَّامُ وَالسِّينُ يَدُلُّ عَلَى امْتِلَاءٍ فِي الشَّيْءِ.»"
        - word: "فكري"
