stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'تحجر فكري' هي مركب وصفي، بينما قد يكون اللفظ المفرد 'تحجر' كافياً في السياق الدلالي الأوسع."
    observations: "المصطلح يعبر عن حالة من الجمود وعدم المرونة في الأنماط العقلية والسلوكية، وهو ما يغطيه بدقة مصطلح 'ossification' الإنجليزي في سياقه المجازي."
  blind_candidates:
    - lemma: "تَحَجُّر فِكْرِيّ"
      generation_method: tarkib
      justification: "تعبير وصفي شائع جداً يعكس المعنى المجازي لـ ossification (التحول إلى حجر) في الفكر."
    - lemma: "جُمُود فِكْرِيّ"
      generation_method: tarkib
      justification: "استخدام مادة (جمد) للتعبير عن سكون الفكر وعدم حيويته وتغيره."
    - lemma: "تَصَلُّب الرَّأْي"
      generation_method: tarkib
      justification: "تعبير تراثي كلاسيكي (ورد في المعجم الكبير) عن التشدد وعدم المرونة."
    - lemma: "تَقَوْقُع"
      generation_method: majaz
      justification: "استعارة الانغلاق على أنماط ثابتة ورفض الانفتاح على الجديد."

stage2_evidence:
  per_lemma:
    - lemma: "تحجر فكري"
      confirm:
        - text: "التحجر [في السلوك أو المعتقدات أو العادات]."
          source: "المورد الحديث (2008)"
        - text: "تكلّس، تحجّر (ossification) في مجال علم الاجتماع والأنثروبولوجيا."
          source: "مسرد علم الاجتماع - ArabTerm"
    - lemma: "تحجر"
      confirm:
        - text: "تحجر: صلب كالحجر... وفي الرأي ونحوه تشدد فيه وأصر عليه."
          source: "المعجم الوسيط"
    - lemma: "تصلب"
      confirm:
        - text: "تصلب فلان: تشدد وتقوى في الرأي: أصر عليه."
          source: "المعجم الكبير"
    - lemma: "جمود"
      confirm:
        - text: "الجمود: هيئة حاصلة للنفس بها يقتصر على استيفائها ما ينبغي وما لا ينبغي."
          source: "كتاب التعريفات للجرجاني"
      expands:
        - text: "الجمود: Rigidity، immobility... علة إذا عرضت للإنسان بقي على الحالة التي أدركته عليها."
          source: "كشاف اصطلاحات الفنون للتهانوي"

stage3_analysis:
  per_lemma:
    - lemma: "تحجر فكري"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع جداً في السياق الفكري والسلوكي، ويطابق التعريف تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحَجُّر فِكْرِيّ"
    - lemma: "جُمُود فِكْرِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مرادف قوي جداً وشائع في الأدبيات العربية المعاصرة للتعبير عن جمود الأنماط الفكرية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "جُمُود فِكْرِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَصَلُّب الرَّأْي"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير فصيح ورد في المعاجم الأساسية (الكبير والوسيط) للتعبير عن التشدد في الموقف الفكري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "تَصَلُّب الرَّأْي", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَكَلُّس فِكْرِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "استعارة سوسيولوجية (biologism) معتمدة في المعاجم المتخصصة كمرادف للتحجر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "تَكَلُّس فِكْرِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عملية التثبيت الصارم في نمط تقليدي من التفكير أو السلوك"
    assessment:
      decision: revise
      reason: "التعريف الحالي يميل للترجمة الحرفية، وصياغته بأسلوب معجمي عربي أمتن وأوضح."
    authored:
      - type: terminological
        text: "صَيْرُورَةُ الفِكْرِ أو السُّلُوكِ إلى حالَةٍ من الجُمُودِ فَيَفْقِدُ مُرُونَتَهُ وَيَلْتَزِمُ أَنْمَاطًا ثَابِتَةً تَقْلِيدِيَّةً تَعْسُرُ زَحْزَحَتُهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "صَيْرُورَةُ الفِكْرِ أو السُّلُوكِ إلى حالَةٍ من الجُمُودِ فَيَفْقِدُ مُرُونَتَهُ وَيَلْتَزِمُ أَنْمَاطًا ثَابِتَةً تَقْلِيدِيَّةً تَعْسُرُ زَحْزَحَتُهَا."}
  examples:
    per_lemma:
      - lemma: "تَحَجُّر فِكْرِيّ"
        examples:
          - text: "يُعَانِي المُجْتَمَعُ مِنْ تَحَجُّرٍ فِكْرِيٍّ يَمْنَعُهُ مِنَ التَّكَيُّفِ مَعَ التَّحَوُّلَاتِ العَصْرِيَّةِ."
            type: usage
      - lemma: "جُمُود فِكْرِيّ"
        examples:
          - text: "أَدَّى الجُمُودُ الفِكْرِيُّ إلى رُكُودِ الحَرَكَةِ العِلْمِيَّةِ لِعُقُودٍ طَوِيلَةٍ."
            type: usage
      - lemma: "تَصَلُّب الرَّأْي"
        examples:
          - text: "إِنَّ تَصَلُّبَ الرَّأْيِ دُونَ نَظَرٍ في البَرَاهِينِ دَلِيلٌ عَلَى ضَعْفِ البَصِيرَةِ."
            type: usage
      - lemma: "تَكَلُّس فِكْرِيّ"
        examples:
          - text: "تَسْعَى المَؤَسَّسَاتُ التَّعْلِيمِيَّةُ لِمُحَارَبَةِ التَّكَلُّسِ الفِكْرِيِّ لَدَى الطُّلَّابِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعَانِي المُجْتَمَعُ مِنْ تَحَجُّرٍ فِكْرِيٍّ يَمْنَعُهُ مِنَ التَّكَيُّفِ مَعَ التَّحَوُّلَاتِ العَصْرِيَّةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "تَحَجُّر فِكْرِيّ"
      entry_id: "{auto}"
      roots:
        - word: "تحجر"
          root: "حجر"
          maqayis_quote: "«الْحَاءُ وَالْجِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، وَهُوَ الْمَنْعُ وَالْإِحَاطَةُ عَلَى الشَّيْءِ... وَالْحَجَرُ مَعْرُوفٌ، وَأَحْسِبُ أَنَّ الْبَابَ كُلَّهُ مَحْمُولٌ عَلَيْهِ وَمَأْخُوذٌ مِنْهُ، لِشِدَّتِهِ وَصَلَابَتِهِ.»"
        - word: "فكري"
          root: "فكر"
          maqayis_quote: "«الْفَاءُ وَالْكَافُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَرَدُّدُ الْقَلْبِ فِي الشَّيْءِ.»"
    - lemma: "جُمُود فِكْرِيّ"
      entry_id: "{auto}"
