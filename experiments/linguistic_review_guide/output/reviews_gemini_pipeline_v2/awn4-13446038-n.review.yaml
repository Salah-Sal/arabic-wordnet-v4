        value: '{"root":"ركم","maqayis":"«الرَّاءُ وَالْكَافُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى [تَجَمُّعِ] الشَّيْءِ...»"}'
    - command: set_metadata
