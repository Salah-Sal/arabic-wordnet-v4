stage1_review:
  assessment:
    concerns:
      - "كلمة (رقيق) تُستخدم غالباً كاسم جمع (Collective Noun) للإشارة إلى فئة العبيد، وقد تدل على صفة (الرقة)، لكنها تستخدم أيضاً للمفرد."
      - "كلمة (عبد) هي اللفظة الأساسية والأكثر دقة ومباشرة للتعبير عن المفرد."
    observations: "المفهوم يشير إلى الإنسان الفاقد لحريته والمملوك لغيره. التعريف الحالي جيد ولكنه يفتقر إلى الصياغة المعجمية الدقيقة. يمكن إضافة مترادفات مثل (مملوك)."
  blind_candidates:
    - lemma: "مَمْلُوك"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (ملك) بصيغة اسم المفعول، لتدل على من وقع عليه فعل التملك، وهي شائعة تاريخياً."
    - lemma: "قِنّ"
      generation_method: majaz
      justification: "لفظ عربي فصيح يدل على العبد الذي مُلك هو وأبواه، وهو من أخص معاني العبودية."
    - lemma: "مُسْتَعْبَد"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (عبد) بصيغة اسم المفعول من الفعل (استعبد)، لتدل على من سُلبت حريته."
    - lemma: "أَسِير"
      generation_method: majaz
      justification: "تُطلق مجازاً على من فقد حريته وأصبح مقيداً، وإن كان المعنى الأصلي يخص أسرى الحرب."

stage2_evidence:
  per_lemma:
    - lemma: "عَبْد"
      confirm:
        - text: "«(العَبْد) الرَّقِيق وَالْإِنْسَان حرا كَانَ أَو رَقِيقا لِأَنَّهُ مربوب لله عز وَجل (ج) عبيد وَعبد وأعبد وعبدان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الإِنْسانُ حُرَّاً كان أو رقيقاً، والمَمْلوكُ،كـ العَبْدَلِ، ج: عَبْدونَ وعَبيدٌ وأعْبُدٌ وعِبادٌ وعُبْدانٌ»"
          source: "القاموس المحيط للفيروزآبادي"
    - lemma: "رَقِيق"
      confirm:
        - text: "«(الرَّقِيق) الدَّقِيق اللَّطِيف والمملوك كُله أَو بعضه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«العبد المملوك كله أو بعضه، والدقيق اللطيف.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مَمْلُوك"
      confirm:
        - text: "«(الْمَمْلُوك) العَبْد (ج) مماليك»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«المملوك: هو العبد.»"
          source: "التعريفات الفقهيّة للبركتي"
    - lemma: "قِنّ"
      confirm:
        - text: "«(الْقِنّ) العَبْد الَّذِي كَانَ أَبوهُ مَمْلُوكا لمواليه وَيُقَال قن بَين القنانة والقنونة خَالص العبودة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«هو العبد الذي لا يجوز بيعه ولا شراؤه»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "تضيف شرطاً فقهياً في جواز بيعه وتدل على العبودية المتوارثة."
    - lemma: "مُسْتَعْبَد"
      evidence_status: no_material_found
    - lemma: "أَسِير"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "عَبْد"
      decision: confirmed
      decision_reason: "الكلمة الأساسية والأكثر شيوعاً ودقة في التعبير عن هذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَبْد"
    - lemma: "رَقِيق"
      decision: confirmed
      decision_reason: "كلمة صحيحة تستخدم للمفرد والجمع (كاسم جنس) للإشارة إلى العبيد والمماليك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَقِيق"
    - lemma: "مَمْلُوك"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق وشائع الاستخدام، ويوضح طبيعة العلاقة (التملك)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مَمْلُوك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "قِنّ"
      source: stage1
      decision: removed
      decision_reason: "أخص من العبد، فهو من وُلد في الرق أو خالص العبودية، ويعد مفهوماً فرعياً (Hyponym) وليس مرادفاً تاماً."
    - lemma: "مُسْتَعْبَد"
      source: stage1
      decision: removed
      decision_reason: "صيغة اسم مفعول مفهومة ولكنها لم تُوثق كمدخل معجمي مستقل بنفس الرسوخ المعجمي لبقية المصطلحات."
    - lemma: "أَسِير"
      source: stage1
      decision: removed
      decision_reason: "ترتبط بسياق الحرب وفقدان الحرية المؤقت، ولا تتطابق دلالياً مع مفهوم العبودية الدائمة (الرقيق)."

stage4_content:
  definition:
    current: "شخص مملوك لشخص آخر"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح ولكنه عام قليلاً، ويمكن تحسينه بصياغة معجمية أكثر دقة تبرز طبيعة الملكية وانعدام الحرية."
    authored:
      - type: terminological
        text: "إِنْسَانٌ مَمْلُوكٌ لِغَيْرِهِ، مَسْلُوبُ الحُرِّيَّةِ، يَخْضَعُ لِسُلْطَةِ سَيِّدِهِ تَصَرُّفًا وَبَيْعًا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "إِنْسَانٌ مَمْلُوكٌ لِغَيْرِهِ، مَسْلُوبُ الحُرِّيَّةِ، يَخْضَعُ لِسُلْطَةِ سَيِّدِهِ تَصَرُّفًا وَبَيْعًا."
  examples:
    per_lemma:
      - lemma: "عَبْد"
        examples:
          - text: "أَعْتَقَ الرَّجُلُ عَبْدَهُ طَمَعًا فِي الأَجْرِ والثَّوَابِ."
            type: usage
      - lemma: "رَقِيق"
        examples:
          - text: "مَنَعَتِ القَوَانِينُ الدَّوْلِيَّةُ الحَدِيثَةُ تِجَارَةَ الرَّقِيقِ كُلِّيًّا."
            type: usage
      - lemma: "مَمْلُوك"
        examples:
          - text: "كَانَ الْمَمْلُوكُ فِي العُصُورِ القَدِيمَةِ يُعَامَلُ كَجُزْءٍ مِنْ مُمْتَلَكَاتِ سَيِّدِهِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "مَنَعَتِ القَوَانِينُ الدَّوْلِيَّةُ الحَدِيثَةُ تِجَارَةَ الرَّقِيقِ كُلِّيًّا."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَعْتَقَ الرَّجُلُ عَبْدَهُ طَمَعًا فِي الأَجْرِ والثَّوَابِ."

stage5_enrichment:
  per_entry:
    - lemma: "عَبْد"
      entry_id: "{auto}"
      root: "عبد"
      maqayis_quote: "«الْعَيْنُ وَالْبَاءُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، كَأَنَّهُمَا مُتَضَادَّانِ، وَ [الْأَوَّلُ] مِنْ ذَيْنِكَ الْأَصْلَيْنِ يَدُلُّ عَلَى لِينٍ وَذُلٍّ، وَالْآخَرُ عَلَى شِدَّةٍ وَغِلَظٍ.»"
    - lemma: "رَقِيق"
