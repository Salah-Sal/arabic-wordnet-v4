    - lemma: "مُخَالِط"
      entry_id: "{auto}"
      root: "خلط"
      maqayis_quote: "الْخَاءُ وَاللَّامُ وَالطَّاءُ أَصْلٌ وَاحِدٌ مُخَالِفٌ لِلْبَابِ الَّذِي قَبْلَهُ، بَلْ هُوَ مُضَادٌّ لَهُ. تَقُولُ: خَلَطْتُ الشَّيْءَ بِغَيْرِهِ فَاخْتَلَطَ."
    - lemma: "مُعَاشِر"
      entry_id: "{auto}"
      root: "عشر"
      maqayis_quote: "الْعَيْنُ وَالشِّينُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا فِي عَدَدٍ مَعْلُومٍ ثُمَّ يُحْمَلُ عَلَيْهِ غَيْرُهُ، وَالْآخَرُ يَدُلُّ عَلَى مُدَاخَلَةٍ وَمُخَالَطَةٍ."
    - lemma: "أَلُوف"
      entry_id: "{auto}"
      root: "ألف"
      maqayis_quote: "الْهَمْزَةُ وَاللَّامُ وَالْفَاءُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى انْضِمَامِ الشَّيْءِ إِلَى الشَّيْءِ، وَالْأَشْيَاءُ الْكَثِيرَةُ أَيْضًا."

  per_sense:
