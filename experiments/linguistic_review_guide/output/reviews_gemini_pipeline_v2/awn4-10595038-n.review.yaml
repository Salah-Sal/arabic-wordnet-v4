stage1_review:
  assessment:
    concerns: []
    observations: "المفهوم يشير إلى الشخص الذي يقوم بعملية استمطار السحب. اللمات الحالية دقيقة؛ فـ«مستمطر» مشتق صحيح من الفعل استمطر، و«باذر السحب» ترجمة دقيقة ومقبولة للمصطلح الإنجليزي (cloud seeder)."
  blind_candidates:
    - lemma: "مُسْتَمْطِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (استمطر)، وهو يعبر بدقة عن الشخص الذي يقوم بعملية الاستمطار."
    - lemma: "بَاذِرُ السُّحُبِ"
      generation_method: tarkib
      justification: "مركب إضافي يترجم المصطلح الإنجليزي (cloud seeder) حرفياً، حيث تُشبّه العملية بالبذر."
    - lemma: "جَالِبُ المَطَرِ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر عن المفهوم (rainmaker) المرتبط بمن يتدخل صناعياً لإسقاط المطر."
    - lemma: "مُسْتَمْطِرُ السُّحُبِ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين اسم الفاعل والمفعول به لتخصيص عملية الاستمطار بالسحب."

stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَمْطِر"
      confirm:
        - text: "اسْتَمْطَرَ فلان: طلب المَطَر"
          source: "المعجم الوسيط"
    - lemma: "بَاذِر السُّحُب"
      confirm:
        - text: "استمطار السحب: cloud seeding"
          source: "المَكنَز الزراعي متعدد اللغات"
    - lemma: "جَالِبُ المَطَرِ"
      confirm:
        - text: "جالب المطر: «أ» من يستنزل المطر بوسائل صُنعيّة. «ب» شخص يحقِّق نتائج باهرة في الأعمال أو السياسة إلخ."
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "بَاذِر السُّحُب"
      decision: confirmed
      decision_reason: "مركب إضافي مستقر ومفهوم يشير إلى من يقوم بعملية بذر السحب لتلقيحها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَاذِرُ السُّحُبِ"
    - lemma: "مُسْتَمْطِر"
      decision: confirmed
      decision_reason: "اسم فاعل من استمطر، وهو فصيح ومناسب للمفهوم المعاصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَمْطِر"
    - lemma: "جَالِبُ المَطَرِ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب إضافي يوازي المصطلح الإنجليزي (rainmaker) وموثق في المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "جَالِبُ المَطَرِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10595038-n"
    - lemma: "مُسْتَمْطِرُ السُّحُبِ"
      source: stage1
      decision: removed
      decision_reason: "مرادف لـ«مستمطر»، ولا حاجة لإضافته كمركب طالما أن الكلمة المفردة تؤدي المعنى بدقة."

