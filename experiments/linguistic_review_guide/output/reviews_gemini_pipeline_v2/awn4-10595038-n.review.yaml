          text: "اعتمدت الحكومة على مُسْتَمْطِرٍ خبيرٍ لزيادة كمية الهطول المطري في المنطقة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "حلّق بَاذِرُ السُّحُبِ بطائرته لرش يوديد الفضة فوق الغيوم الركامية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "استعانت الولاية الجافة بخدمات جَالِبِ المَطَرِ لمواجهة الجفاف الطويل."

