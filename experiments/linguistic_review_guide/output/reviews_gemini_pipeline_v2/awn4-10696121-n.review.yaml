      reason: "التعريف الحالي حرفي إلى حد ما وقاصر. المفهوم يركز على تجاوز العدد المطلوب أو انعدام الدور الفعلي للشخص في الهيكل."
    authored:
      - type: terminological
        text: "شخصٌ زَائِدٌ عنِ العَدَدِ المُقَرَّرِ أَوْ المَطْلُوبِ، وَلَا يُؤَدِّي وَظِيفَةً فِعْلِيَّةً."
