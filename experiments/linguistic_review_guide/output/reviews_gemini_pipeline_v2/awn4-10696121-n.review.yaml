stage1_review:
  assessment:
    concerns:
      - "اللمة (عَمَالَة فَائِضَة) تشير إلى مفهوم جمعي أو مجرد (قوة العمل الزائدة) بينما التعريف والمفهوم في المجموعة الترادفية يختصان بالشخص المفرد (a person)."
      - "اللمة (زَائِد عَنِ الْحَاجَة) تفتقر إلى التشكيل الكامل."
    observations: "المفهوم يشير إلى الشخص الذي يتجاوز العدد المطلوب للعمل أو لا توجد له مهام فعلية يكلف بها (supernumerary). المرادفات الأقرب في العربية تدور حول الجذور (فضل) و(زيد) و(حشو)."
  blind_candidates:
    - lemma: "فَائِض"
      generation_method: ishtiqaq
      justification: "من (فاض) يفيض إذا زاد عن حده، وتطلق اصطلاحا على الموظف أو الشخص الذي زاد عن العدد المقرر."
    - lemma: "مُوَظَّفٌ زَائِد"
      generation_method: tarkib
      justification: "مركب وصفي يصف العامل الذي لا حاجة إليه في العمل."
    - lemma: "حَشْو"
      generation_method: majaz
      justification: "من حشو الكلام، ويطلق مجازا على من لا فائدة من وجوده سوى إكمال العدد."
    - lemma: "عَامِلٌ إِضَافِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يشير إلى الشخص الذي تمت إضافته دون حاجة حقيقية."

stage2_evidence:
  per_lemma:
    - lemma: "زَائِد عَنِ الْحَاجَة"
      confirm:
        - text: "الفائض: شخص أو شيء زائد عن العدد المقرَّر أو المطلوب"
          source: "المورد الحديث (2008)"
    - lemma: "عَمَالَة فَائِضَة"
      contradicts:
        - text: "العمالة هي مجموع العمال وليس شخصا واحدا"
          source: "تحليل لغوي"
          conflict: "تطابق الصنف: المجموعة تخص فردا (شخص) بينما (عمالة) مصطلح جمعي/مجرد."
    - lemma: "فَائِض"
      confirm:
        - text: "الفائض: شخص أو شيء زائد عن العدد المقرَّر أو المطلوب"
          source: "المورد الحديث (2008)"
    - lemma: "عَامِلٌ فَائِض"
      expands:
        - text: "مُسَرَّحٌ [بسبب من تكاثر العمال أو زيادتهم عن الحاجة]"
          source: "المورد الحديث (2008)"
          addition: "يدل على تسريح العمال الزائدين (redundant)."

stage3_analysis:
  per_lemma:
    - lemma: "زَائِد عَنِ الْحَاجَة"
      decision: confirmed
      decision_reason: "تعبير اصطلاحي شائع وموثق في المعاجم للدلالة على الشخص أو الشيء الذي يتجاوز العدد المطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَائِدٌ عَنِ الْحَاجَةِ"
    - lemma: "عَمَالَة فَائِضَة"
      decision: removed
      decision_reason: "كلمة (عمالة) تدل على جموع العمال أو قوة العمل ككل، ولا تدل على شخص مفرد كما يقتضي تعريف المجموعة الترادفية."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "فَائِض"
      source: stage1
      decision: confirmed
      decision_reason: "موثقة صراحة في المورد الحديث بمعنى (شخص أو شيء زائد عن العدد المقرر أو المطلوب) وتطابق الدلالة المطلوبة تماما."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَائِض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10696121-n"}
    - lemma: "عَامِلٌ فَائِض"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب وصفي شائع ومناسب للتعبير عن المفهوم في سياق العمل والوظائف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "عَامِلٌ فَائِض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10696121-n"}

