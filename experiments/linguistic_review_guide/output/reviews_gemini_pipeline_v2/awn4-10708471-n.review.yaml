stage1_review:
  assessment:
    concerns:
      - "كلمة 'واسم' صحيحة لغويا، لكنها قد تلتبس مع معانٍ أخرى مثل من يضع الوسم (الكي) على الحيوانات."
      - "التعريف يركز على العنصر البشري ('شخص')، في حين أن مصطلح Tagger في اللسانيات الحاسوبية غالباً ما يطلق على البرمجيات، ورغم ذلك إطلاقه على الشخص المختص صحيح."
    observations: "مصطلح 'واسم' ملائم من حيث الاشتقاق (اسم فاعل من وسم). ومصطلح 'موسم' (بكسر السين المشددة) شائع أيضا في المعالجة الآلية للغات الطبيعية للتعبير عن POS Tagger كأداة أو شخص."
  blind_candidates:
    - lemma: "مُوَسِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل المضعف (وسّم) الذي يدل على التكثير أو التخصيص في وضع الوسوم، وهو شائع في المجال الحاسوبي."
    - lemma: "مُرَمِّز"
      generation_method: majaz
      justification: "إزاحة دلالية لمفهوم الترميز ليعبر عن إعطاء رموز (وسوم) للمكونات النحوية."
    - lemma: "مُعَيِّنُ الوُسُومِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف الوظيفة بدقة كما وردت في التعريف الأصلي."
    - lemma: "وَسَّام"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة (فعّال) تدل على الاحتراف في أداء هذه الوظيفة."

stage2_evidence:
  per_lemma:
    - lemma: "وَاسِم"
      confirm:
        - text: "المؤشر المركبي، في النحو التوليدي، وهو تحليل البنية إلى مكونات، وتمثيل الجملة على شكل تشجير أو تقويسات."
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts: []
      expands:
        - text: "عنصر يمكن تتبعه في الجسم بفضل نشاطه الإشعاعيّ."
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          addition: "يستخدم مصطلح واسم أيضا في الطب وعلم الوراثة كترجمة لـ Marker."
    - lemma: "مُوَسِّم"
      evidence_status: "no_material_found"
    - lemma: "مُرَمِّز"
      confirm:
        - text: "نظام تعلُّم آلة يُحوِّل التمثيل الخام إلى تمثيل معالَج."
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
      contradicts: []
      expands: []
    - lemma: "وَسَّام"
      evidence_status: "no_material_found"
    - lemma: "مُعَيِّنُ الوُسُومِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "وَاسِم"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر في المعاجم العلمية (كاللسانيات) كاسم فاعل يدل على من أو ما يضع الوسم، ويؤدي المعنى المطلوب بدقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الأساسي والأكثر شيوعاً للتعبير عن الذي يقوم بوضع العلامات والوسوم."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَاسِم"

    - lemma: "مُوَسِّم"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من الفعل (وسّم) وهو دقيق في التعبير عن الوظيفة اللغوية الحاسوبية أو البشرية التي تعنى بوضع الوسوم المتعددة (التوسيم)، وشائع الاستخدام في المجال (مثل POS Tagger)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يبرز جانب الاحتراف أو التكثير في وضع الوسوم، ويغلب استخدامه للإشارة إلى النظم البرمجية، لكنه يصح للأشخاص أيضاً."
      actions:
        - command: create_entry
          params:
            lemma: "مُوَسِّم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُرَمِّز"
      source: stage1
      decision: removed
      decision_reason: "مصطلح يفضل حجزه لترجمة Encoder أو Coder ولا يعبر بدقة عن 'الوسم' النحوي الذي يتطلب إرفاق علامة تصنيفية وليس مجرد تحويل للشفرة."

    - lemma: "وَسَّام"
      source: stage1
      decision: removed
      decision_reason: "صيغة المبالغة هنا غير مستخدمة اصطلاحياً في هذا السياق، وقد تلتبس بمانح الأوسمة والنياشين."

    - lemma: "مُعَيِّنُ الوُسُومِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر وليس مصطلحاً معجمياً مسكوكاً."

stage4_content:
  definition:
    current: "شخص يعين تسميات (وسوم) للمكونات النحوية للنصوص"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول ولكنه ركيك بعض الشيء، ويمكن تحسينه لجعله أكثر دقة كتعريف مصطلحي يتماشى مع صياغة المعاجم."
    authored:
      - type: terminological
        text: "شخصٌ يُعنَى بإسناد وسوم أو علامات تصنيفية للمكوِّنات النحوية في النصوص."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخصٌ يُعنَى بإسناد وسوم أو علامات تصنيفية للمكوِّنات النحوية في النصوص."

  examples:
    per_lemma:
      - lemma: "وَاسِم"
        examples:
          - text: "يراجع الواسم النحوي مخرجات التحليل الآلي لتصحيح الأخطاء في المدونة."
            type: usage
      - lemma: "مُوَسِّم"
        examples:
          - text: "استغرق المُوَسِّم أسبوعاً في تصنيف أجزاء الكلام في المدونة اللغوية."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يراجع الواسم النحوي مخرجات التحليل الآلي لتصحيح الأخطاء في المدونة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "استغرق المُوَسِّم أسبوعاً في تصنيف أجزاء الكلام في المدونة اللغوية."

