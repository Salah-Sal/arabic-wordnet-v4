stage1_review:
  assessment:
    concerns: []
    observations: "اللمة الموجودة (مُرْتَهِن) تمثل المصطلح الفقهي والقانوني العربي الأصيل الدال على الطرف الذي يقبض الرهن، وهي تقابل المفهوم الإنجليزي بدقة تامة. لا توجد إشكاليات في اللمة."
  blind_candidates:
    - lemma: "مُرْتَهِن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل الخماسي (ارتهن)، وهو من يأخذ الشيء رهناً."
    - lemma: "قَابِضُ الرَّهْنِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف الطرف الذي يستلم الرهن ويحوزه."
    - lemma: "دَائِنٌ مُرْتَهِنٌ"
      generation_method: tarkib
      justification: "مصطلح قانوني يستخدم لوصف الدائن الذي يوثق دينه برهن."
    - lemma: "آخِذُ الرَّهْنِ"
      generation_method: tarkib
      justification: "تعبير وصفي يدل على متسلم الرهن."

stage2_evidence:
  per_lemma:
    - lemma: "مُرْتَهِن"
      confirm:
        - text: "«المُرْتهِن: من يُرْهَن عنده المِلْك.»"
          source: "المورد الحديث"
        - text: "«المُرْتهِن: من يأخذ الرَّهن (ق).»"
          source: "المورد الحديث"
        - text: "«ارْتَهَنَ الشَّىءَ : أَخَذَه رَهْنًا من فلان»"
          source: "المعجم الكبير"
    - lemma: "قَابِضُ الرَّهْنِ"
      evidence_status: "no_material_found"
    - lemma: "دَائِنٌ مُرْتَهِنٌ"
      evidence_status: "no_material_found"
    - lemma: "آخِذُ الرَّهْنِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُرْتَهِن"
      decision: confirmed
      decision_reason: "مصطلح فصيح وأصيل وهو المقابل الدقيق للمفهوم (pledgee) في الفقه والقانون، ومدعوم بقوة في المعاجم اللغوية وثنائية اللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرْتَهِن"
    - lemma: "قَابِضُ الرَّهْنِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر وليس مصطلحاً معجمياً مسكوكاً."
    - lemma: "دَائِنٌ مُرْتَهِنٌ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح قانوني أخص من المعنى العام للمجموعة، ومكون من اللمة الأصلية كصفة."
    - lemma: "آخِذُ الرَّهْنِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر ولا يمثل وحدة معجمية."

stage4_content:
  definition:
    current: "شخص يُقدم إليه تعهد أو يُودع لديه شيء كرهن"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو كترجمة حرفية، ويمكن صياغته بأسلوب معجمي عربي أمتن باستخدام المصطلحات الفقهية والقانونية."
    authored:
      - type: terminological
        text: "شَخْصٌ يُوضَعُ عِنْدَهُ الرَّهْنُ وَثِيقَةً لِدَيْنٍ أوْ تَعَهُّدٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يُوضَعُ عِنْدَهُ الرَّهْنُ وَثِيقَةً لِدَيْنٍ أوْ تَعَهُّدٍ."
  examples:
    per_lemma:
      - lemma: "مُرْتَهِن"
        examples:
          - text: "لَا يَجُوزُ لِلْمُرْتَهِنِ أَنْ يَنْتَفِعَ بِالشَّيْءِ الْمَرْهُونِ إِلَّا بِإِذْنِ الرَّاهِنِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "لَا يَجُوزُ لِلْمُرْتَهِنِ أَنْ يَنْتَفِعَ بِالشَّيْءِ الْمَرْهُونِ إِلَّا بِإِذْنِ الرَّاهِنِ."

stage5_enrichment:
  per_entry:
    - lemma: "مُرْتَهِن"
      entry_id: "{auto}"
      root: "رهن"
      maqayis_quote: "«الرَّاءُ وَالْهَاءُ وَالنُّونُ أَصْلٌ يَدُلُّ عَلَى ثَبَاتِ شَيْءٍ يُمْسَكُ بِحُقٍّ أَوْ غَيْرِهِ. مِنْ ذَلِكَ الرَّهْنُ: الشَّيْءُ يُرْهَنُ.»"
  per_sense:
    - lemma: "مُرْتَهِن"
      sense_id: "{auto}"
      nuance: "المصطلح الوحيد والأدق للتعبير عن الطرف القابض للرهن في الفقه والقانون."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"رهن","maqayis":"«الرَّاءُ وَالْهَاءُ وَالنُّونُ أَصْلٌ يَدُلُّ عَلَى ثَبَاتِ شَيْءٍ يُمْسَكُ بِحُقٍّ أَوْ غَيْرِهِ. مِنْ ذَلِكَ الرَّهْنُ: الشَّيْءُ يُرْهَنُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الوحيد والأدق للتعبير عن الطرف القابض للرهن في الفقه والقانون.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
