stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جدًّا وغير كافٍ لتغطية الدلالة المصطلحية."
      - "الاقتصار على لمّة واحدة في المجموعة الترادفية يضيق النطاق الدلالي المتاح."
      - "عدم وجود مدخل معجمي مستقل للمستيقظ في بعض المعاجم يجعله يعتمد على اشتقاقه المباشر من الفعل."
    observations: "المفهوم يشير إلى الحالة التي تعقب النوم مباشرة (الاستيقاظ) أو حالة الوعي والانتباه المستمر (اليقظة). اللفظ الموجود 'مستيقظ' سليم تماماً من حيث الاشتقاق الصرفي، لكنه يحتاج لتعزيز بمرادفات معجمية مسجلة."
  blind_candidates:
    - lemma: "مُسْتَيْقِظٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل مباشر من الفعل 'استيقظ' وهو التعبير الأكثر شيوعاً في اللغة العربية المعاصرة."
    - lemma: "يَقْظَانُ"
      generation_method: ishtiqaq
      justification: "صفة مشبهة على وزن 'فعلان' تدل على الامتلاء بصفة اليقظة، وهو لفظ فصيح معجمي."
    - lemma: "صَاحٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'صحا'، يشير إلى انجلاء النوم أو الغفلة."
    - lemma: "يَقِظٌ"
      generation_method: ishtiqaq
      justification: "صفة مشبهة تدل على الثبوت والاستمرار في اليقظة والانتباه."

stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَيْقِظ"
      confirm:
        - text: "«استيقظ من نومه- طول السهر يؤخِّر الاستيقاظ»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«(1) يستيقظ (2) يَنْهَض (3) يَعي؛ يُدْرِك She awoke... (4) يُوْقِظ (5) يُنْهِض (6) يَقْظان (7) متنبِّه؛ يقِظ؛ واعٍ.»"
          source: "المورد الحديث (2008)"
    - lemma: "يَقْظَان"
      confirm:
        - text: "«(الْيَقظَان) اليقظ وَمِنْه رجل يقظان الْفِكر (ج) يقاظى ويقاظ وَهِي يقظى يُقَال باتت عَيْني يقظى تراعيك (ج) يقاظى»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«هو يَقْظانُ إلى فِعالهم [فصيحة]»"
          source: "معجم الصواب اللغوي"
    - lemma: "صَاحٍ"
      confirm:
        - text: "«الصاحي: ضد سكران والصحو خلاف السُكر \"صحا السكران\" أي زال سكره.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«من (ص ح و) المستيقظ المنتبه.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "يَقِظ"
      confirm:
        - text: "«يقِظَ الشَّخصُ: صحَا، عكسه نام - يقِظ بعد نومٍ عميق- باتت عيني يقِظة تراعيك.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«رَجُل يقِظ الفكر- يقظ الذِّهن/ يقظ الفؤاد: سريع الإدراك أو الفطنة.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مُنْتَبِه"
      confirm:
        - text: "«من (ص ح و) المستيقظ المنتبه.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

