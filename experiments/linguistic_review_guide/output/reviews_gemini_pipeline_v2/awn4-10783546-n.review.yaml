stage4_content:
  definition:
    current: "شخص يستيقظ"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب ولا يشرح مدلول الحالة أو الصفة بوضوح."
    authored:
      - type: terminological
        text: "مَنْ فارَقَهُ النَّوْمُ وَصَحَا مِنْ غَفْلَتِهِ، أَو مَنْ كَانَ فِي حَالَةِ اليَقَظَةِ وَالإِدْرَاكِ بَعْدَ الصَّحْوِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "مُسْتَيْقِظ"
        examples:
          - text: "يَبْدُو المُسْتَيْقِظُ بَاكِرًا أَكْثَرَ نَشَاطًا فِي عَمَلِهِ."
            type: usage
      - lemma: "يَقْظَان"
        examples:
          - text: "ظَلَّ الحَارِسُ يَقْظَانًا طَوَالَ اللَّيْلِ لِحِمَايَةِ المَبْنَى."
            type: usage
      - lemma: "صَاحٍ"
        examples:
          - text: "كَانَ الصَّاحِي الوَحِيدَ بَيْنَ رِفَاقِهِ بَعْدَ لَيْلَةٍ طَوِيلَةٍ مِنَ السَّهَرِ."
            type: usage
      - lemma: "يَقِظ"
        examples:
          - text: "يجب أن يكون السائق يَقِظًا لِكُلِّ مَفاجآت الطَّريق."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10783546-n"
          definition_index: 0
          text: "مَنْ فارَقَهُ النَّوْمُ وَصَحَا مِنْ غَفْلَتِهِ، أَو مَنْ كَانَ فِي حَالَةِ اليَقَظَةِ وَالإِدْرَاكِ بَعْدَ الصَّحْوِ."

