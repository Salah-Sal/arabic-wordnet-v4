stage1_review:
  assessment:
    concerns:
      - "نقص التشكيل في اللمات الموجودة (شيطان، مغوٍ)."
      - "الكلمات الحالية تفتقر إلى بعض المرادفات القوية مثل 'مغرٍ' أو 'فتان'."
    observations: "التعريف دقيق وواضح ويعكس المفهوم بشكل سليم. اللمات الموجودة صحيحة لغوياً ودلالياً، فـ 'مغو' من الفعل أغوى يعبر مباشرة عن الفعل، و'شيطان' يستخدم مجازاً وحقيقة للدلالة على المتمرد المفسد الذي يغوي غيره."
  blind_candidates:
    - lemma: "مُغْوٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (أغوى)، يدل مباشرة على الشخص الذي يقوم بفعل الإغواء."
    - lemma: "مُغْرٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (أغرى)، للدلالة على من يزين للناس فعل الأشياء ويدفعهم إليها بقوة."
    - lemma: "فَتَّان"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من الفعل (فَتَنَ)، تستخدم لمن يكثر من إغواء الآخرين وفتنتهم عن طريق الصواب."
    - lemma: "مُضِلّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (أَضَلَّ)، ويعني الشخص الذي يخرج الآخرين عن الجادة وطريق الرشاد."

stage2_evidence:
  per_lemma:
    - lemma: "شَيْطَان"
      confirm:
        - text: "كُلُّ عاتٍ مُتَمَرِّدٍ مُفْسِدٍ من الجِنِّ والإِنس"
          source: "المعجم الكبير"
        - text: "روحٌ شريرٌ مِغْوٍ كلُّ متمرّد مفسد"
          source: "المعجم الوسيط"
        - text: "(1) المُغْرِي؛ المُغْوي (2) cap.: إبليس؛ الشيطان."
          source: "المورد الحديث (2008)"
    - lemma: "مُغْوٍ"
      confirm:
        - text: "(1) المُغْرِي؛ المُغْوي (2) cap.: إبليس؛ الشيطان. (كمقابل لكلمة tempter)"
          source: "المورد الحديث (2008)"
    - lemma: "مُغْرٍ"
      confirm:
        - text: "(1) المُغْرِي؛ المُغْوي (2) cap.: إبليس؛ الشيطان. (كمقابل لكلمة tempter)"
          source: "المورد الحديث (2008)"
    - lemma: "فَتَّان"
      confirm:
        - text: "وَالْفَتَّانُ: الشَّيْطَانُ."
          source: "مقاييس اللغة"
    - lemma: "مُضِلّ"
      confirm:
        - text: "يُضِلّ؛ يُغْوِي."
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "شَيْطَان"
      decision: confirmed
      decision_reason: "المصطلح دقيق، فكلمة شيطان تُطلق حقيقة واستعارة على كل عات متمرد مفسد يغوي غيره ويدفعه للشر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَيْطَان"

    - lemma: "مغوٍ"
      decision: confirmed
      decision_reason: "اسم الفاعل الدقيق المعبر عن هذا المفهوم، وهو اللفظ المباشر في المعاجم لمقابلة الكلمة الإنجليزية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُغْوٍ"

    - lemma: "مُغْرٍ"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة صحيحة لغوياً وقوية الدلالة على ترغيب الآخرين وإغوائهم لفعل شيء ما، وقد وردت في المعاجم مرادفة للمغوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُغْرٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "فَتَّان"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة مبالغة فصيحة وبليغة تدل على من يكثر من فتنة الناس وإغوائهم، وقد نصت المقاييس على أن الفتان هو الشيطان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَتَّان", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُضِلّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مناسب يدل على الشخص الذي يبعد الناس عن جادة الصواب ويغويهم بالباطل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُضِلّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يغوي الآخرين"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويؤدي المعنى المطلوب بصياغة لغوية سليمة؛ فهو يتكون من جنس قريب (شخص) وفصل نوعي (يغوي الآخرين)."
  examples:
    per_lemma:
      - lemma: "شَيْطَان"
        examples:
          - text: "احذر من رفيق السوء فإنه شَيْطَانٌ يزين لك المعاصي."
            type: usage
      - lemma: "مُغْوٍ"
        examples:
          - text: "لم يستطع الشاب مقاومة كلامِ مُغْوٍ محترف أوقعه في شرك الإدمان."
            type: usage
      - lemma: "مُغْرٍ"
        examples:
          - text: "كان الرجل مُغْرِياً للشباب بدخول مغامرات خاسرة."
            type: usage
      - lemma: "فَتَّان"
        examples:
          - text: "نجا القوم من فَتَّانٍ حاول إثارة الفوضى والضلال بينهم."
            type: usage
      - lemma: "مُضِلّ"
        examples:
          - text: "ابتعد عن كل مُضِلٍّ يحاول إبعادك عن طريق الحق والصواب."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "احذر من رفيق السوء فإنه شَيْطَانٌ يزين لك المعاصي."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "لم يستطع الشاب مقاومة كلامِ مُغْوٍ محترف أوقعه في شرك الإدمان."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "كان الرجل مُغْرِياً للشباب بدخول مغامرات خاسرة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "نجا القوم من فَتَّانٍ حاول إثارة الفوضى والضلال بينهم."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "ابتعد عن كل مُضِلٍّ يحاول إبعادك عن طريق الحق والصواب."}

stage5_enrichment:
  per_entry:
    - lemma: "شَيْطَان"
      entry_id: "{auto}"
      root: "شطن"
      maqayis_quote: "«الشِّينُ وَالطَّاءُ وَالنُّونُ أَصْلٌ مُطَّرِدٌ صَحِيحٌ يَدُلُّ عَلَى الْبُعْدِ... وَأَمَّا الشَّيْطَانُ فَقَالَ قَوْمٌ: هُوَ مِنْ هَذَا الْبَابِ، وَالنُّونُ فِيهِ أَصْلِيَّةٌ، فَسُمِّيَ بِذَلِكَ لِبُعْدِهِ عَنِ الْحَقِّ وَتَمَرُّدِهِ. وَذَلِكَ أَنَّ كُلَّ عَاتٍ مُتَمَرِّدٍ مِنَ الْجِنِّ وَالْإِنْسِ وَالدَّوَابِّ شَيْطَانٌ.»"
    - lemma: "مُغْوٍ"
      entry_id: "{auto}"
      root: "غوي"
      maqayis_quote: "«الْغَيْنُ وَالْوَاوُ وَالْحَرْفُ الْمُعْتَلُّ بَعْدَهُمَا أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى خِلَافِ الرُّشْدِ وَإِظْلَامِ الْأَمْرِ... فَالْأَوَّلُ الْغَيُّ، وَهُوَ خِلَافُ الرُّشْدِ، وَالْجَهْلُ بِالْأَمْرِ، وَالِانْهِمَاكُ فِي الْبَاطِلِ.»"
    - lemma: "مُغْرٍ"
      entry_id: "{auto}"
      root: "غري"
      maqayis_quote: "«الغين والراء والحرف المعتل أصل صحيح يدل على التزام شيء واللصوق به... وأغريت الكلب بالصيد: أشليته، كأني ألصقته به.»"
    - lemma: "فَتَّان"
      entry_id: "{auto}"
      root: "فتن"
      maqayis_quote: "«الْفَاءُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاءٍ وَاخْتِبَارٍ. مِنْ ذَلِكَ الْفِتْنَةُ... وَالْفَتَّانُ: الشَّيْطَانُ.»"
    - lemma: "مُضِلّ"
      entry_id: "{auto}"
      root: "ضلل"
      maqayis_quote: "«الضاد واللام أصل صحيح يدل على ضياع الشيء وذهابه في غير حقه... ومنه الضلال، وهو خلاف الهدى.»"
  per_sense:
    - lemma: "شَيْطَان"
      sense_id: "{auto}"
      nuance: "يحمل شحنة دلالية دينية وقوية، ويدل على من تَمَرَّد وأمعن في الإفساد وتزيين الشر للآخرين كالشيطان المنعوت في التراث."
      mwe: false
    - lemma: "مُغْوٍ"
      sense_id: "{auto}"
      nuance: "اللفظ العام والمباشر الدال على من يوقع غيره في الغواية والخطأ والضلال."
      mwe: false
    - lemma: "مُغْرٍ"
      sense_id: "{auto}"
      nuance: "يركز على إثارة الرغبة والشهوة في نفس الآخر لدفعه نحو فعل معين."
      mwe: false
    - lemma: "فَتَّان"
      sense_id: "{auto}"
      nuance: "يفيد المبالغة والكثرة، ويدل على شدة الإغواء والفتنة بحيث يصعب على المرء النجاة منها."
      mwe: false
    - lemma: "مُضِلّ"
      sense_id: "{auto}"
      nuance: "يبرز أثر الإغواء في التسبب بتيه الآخرين وإبعادهم عن طريق الحق والصواب."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"شطن","maqayis":"«الشِّينُ وَالطَّاءُ وَالنُّونُ أَصْلٌ مُطَّرِدٌ صَحِيحٌ يَدُلُّ عَلَى الْبُعْدِ... وَأَمَّا الشَّيْطَانُ فَقَالَ قَوْمٌ: هُوَ مِنْ هَذَا الْبَابِ، وَالنُّونُ فِيهِ أَصْلِيَّةٌ، فَسُمِّيَ بِذَلِكَ لِبُعْدِهِ عَنِ الْحَقِّ وَتَمَرُّدِهِ. وَذَلِكَ أَنَّ كُلَّ عَاتٍ مُتَمَرِّدٍ مِنَ الْجِنِّ وَالْإِنْسِ وَالدَّوَابِّ شَيْطَانٌ.»"}'
