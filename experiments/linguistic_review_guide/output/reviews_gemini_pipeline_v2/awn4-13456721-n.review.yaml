stage1_review:
  assessment:
    concerns:
      - "اللمّة 'تآكل' تشير عادة إلى العملية برمتها (corrosion) وليس بالضرورة بدايتها (onset)، بينما السينست يركز على البداية."
      - "اللمّة 'هجوم' هي ترجمة اصطلاحية لـ 'attack' في السياق الكيميائي والتقني، وهي دقيقة لوصف بداية الفعل التدميري."
    observations: "المجموعة تدور حول اللحظة الأولى لتأثير المادة الكيميائية أو العامل المدمر في السطح. في العربية، يُعبر عن 'attack' في هذا السياق بـ 'هجوم كيميائي' أو 'تآكل' (على سبيل التجوز بالكل عن الجزء). المصطلح 'onset' يتطلب لمّات تعبر عن الابتداء."
  blind_candidates:
    - lemma: "هُجُومٌ"
      generation_method: majaz
      justification: "استعارة لوصف بدء فعل المادة الكيميائية في السطح، وهي ترجمة معتمدة لـ 'attack' في المعاجم التقنية."
    - lemma: "بَدْءُ التَّآكُلِ"
      generation_method: tarkib
      justification: "تعبير مباشر ودقيق عن مفهوم 'onset of a corrosive process'."
    - lemma: "تَنَخُّرٌ"
      generation_method: ishtiqaq
      justification: "يشير إلى بداية تفتت العظم أو الخشب أو النسيج، ويناسب سياق التدمير التدريجي."
    - lemma: "تَحَاتٌّ"
      generation_method: ishtiqaq
      justification: "مصطلح معجمي يعبر عن تآكل الأجزاء وتفتتها تدريجياً."

stage2_evidence:
  per_lemma:
    - lemma: "هجوم"
      confirm:
        - text: "«(1) هَجْمة؛ هجوم (2) بداية؛ مُسْتَهلّ.» كترجمة لـ onset."
          source: "المورد الحديث (2008)"
        - text: "«attack: هجوم»"
          source: "موسوعة الكهرباء (IEC 60050)"
    - lemma: "تآكل"
      confirm:
        - text: "«الشيءُ: تَحاتَّ وتناقَص.»"
          source: "المعجم الكبير"
        - text: "«حتٌّ كيميائيّ (المرادف العربي)» لـ تآكل."
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
    - lemma: "تحات"
      confirm:
        - text: "«تآكل ونقل مواد التربة بواسطة قوى المياه والهواء.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«(تحات) الشَّيْء تناثر وَيُقَال تحاتت أَسْنَانه تأكلت وانقشر»"
          source: "المعجم الوسيط"
    - lemma: "تنخر"
      confirm:
        - text: "«نخَر السّوسُ الخشبَ: فتّته، ثقَبه، أتلفه»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "بدء التآكل"
      confirm:
        - text: "«بَدْء: onset»"
          source: "المعجم الطبي الموحد (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "تآكل"
      decision: confirmed
      decision_reason: "على الرغم من أنها تطلق غالباً على العملية المستمرة، إلا أنها تستخدم في السياق العربي العام للتعبير عن وقوع الفعل التدميري الكيميائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَآكُلٌ"
    - lemma: "هجوم"
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق مترجم عن 'attack' و 'onset' للتعبير عن بدء الفعل الكيميائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُجُومٌ"
    - lemma: "بَدْءُ التَّآكُلِ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير تركيبي دقيق يصف المفهوم (onset) بوضوح تام، وهو ضروري لتمييز البداية عن العملية المستمرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "بَدْءُ التَّآكُلِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "تَحَاتٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح ودقيق للتآكل والبري، وهو مستخدم في المعاجم العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَحَاتٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "بداية عملية تآكل أو تدمير (كما هو الحال بفعل عامل كيميائي)"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يحتاج صياغة أكثر دقة لتوضيح أن الهجوم هو الفعل الأول للمادة."
    authored:
      - type: terminological
        text: "بِدَايَةُ فِعْلِ عَامِلٍ كِيمْيَائِيٍّ أَوْ فِيزْيَائِيٍّ يُؤَدِّي إِلَى تَلَفِ الْمَادَّةِ أَوْ تآكُلِ سُطُوحِهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "بِدَايَةُ فِعْلِ عَامِلٍ كِيمْيَائِيٍّ أَوْ فِيزْيَائِيٍّ يُؤَدِّي إِلَى تَلَفِ الْمَادَّةِ أَوْ تآكُلِ سُطُوحِهَا."
  examples:
    per_lemma:
      - lemma: "هُجُومٌ"
        examples:
          - text: "تَتَعَرَّضُ الْمَعَادِنُ لِهُجُومٍ كِيمْيَائِيٍّ عِنْدَ تَمَاسِّهَا مَعَ الْأَحْمَاضِ الْقَوِيَّةِ."
            type: usage
      - lemma: "تَآكُلٌ"
        examples:
          - text: "ظَهَرَتْ عَلَامَاتُ التَّآكُلِ عَلَى هَيْكَلِ السَّفِينَةِ بِسَبَبِ الْمُلُوحَةِ."
            type: usage
      - lemma: "بَدْءُ التَّآكُلِ"
        examples:
          - text: "يُمْكِنُ الْكَشْفُ عَنْ بَدْءِ التَّآكُلِ فِي الْأَنَابِيبِ بِاسْتِخْدَامِ الْمَوْجَاتِ فَوْقَ الصَّوْتِيَّةِ."
            type: usage
      - lemma: "تَحَاتٌّ"
        examples:
          - text: "تُؤَدِّي الرِّيَاحُ الشَّدِيدَةُ إِلَى تَحَاتِّ الصُّخُورِ فِي الْمَنَاطِقِ الصَّحْرَاوِيَّةِ."
            type: usage

