stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة تفتقر للتشكيل الكامل."
      - "التعريف الحالي وصفي بسيط ويمكن تحويله إلى تعريف مصطلحي أكثر دقة."
    observations: "المصطلح طبي بامتياز، واللمّة الموجودة 'تنكس بقعي' صحيحة وشائعة في المعاجم الطبية الحديثة، لا سيما المعجم الطبي الموحد. يوجد تلازم دلالي قوي بين 'التنكس' و'البقعة الصفراء' في هذا السياق."
  blind_candidates:
    - lemma: "تَنَكُّسٌ بُقْعِيّ"
      generation_method: ishtiqaq
      justification: "اشتقاق نعتي (بقعي) من الاسم (بقعة) لوصف عملية التنكس."
    - lemma: "تَنَكُّسُ البُقْعَةِ الصَّفْرَاء"
      generation_method: tarkib
      justification: "تركيب إضافي يربط عملية التنكس بمكان حدوثها (البقعة الصفراء) وهو المصطلح الأكثر شيوعاً في الشروحات الطبية."
    - lemma: "ضُمُورُ البُقْعَةِ"
      generation_method: ishtiqaq
      justification: "استخدام 'الضمور' (atrophy) كمرادف وظيفي للتنكس في السياقات الطبية لوصف تدهور الأنسجة."
    - lemma: "تَحَلُّلُ البُقْعَةِ"
      generation_method: ishtiqaq
      justification: "استخدام 'التحلل' لوصف تداعي الخلايا في منطقة البقعة."

stage2_evidence:
  per_lemma:
    - lemma: "تنكس بقعي"
      confirm:
        - text: "«تَنَكُّسٌ بُقْعِيّ: macular degeneration»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "تَنَكُّسُ البُقْعَةِ الصَّفْرَاء"
      confirm:
        - text: "«تَنَكُّسُ البُقْعَةِ الصفْراءِ الوِراثِيّ»"
          source: "المعجم الطبي الموحد (2009) (ضمن تعريف داء ستارغاردت)"
    - lemma: "البقعة الصفراء"
      expands:
        - text: "«البُقْعة الصَّفراء: الجزء الأكثر حساسية في شبكيّة العَيْن.»"
          source: "المورد الحديث (2008)"
        - text: "«مجمع النور: لعل العبارة العربية مجمع النور تعني: البقعة الصفراء في شبكية العين.»"
          source: "تكملة المعاجم العربية (رينهارت دوزي)"

stage3_analysis:
  per_lemma:
    - lemma: "تنكس بقعي"
      decision: confirmed
      decision_reason: "مصطلح طبي معياري مثبت في المعجم الطبي الموحد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنَكُّسٌ بُقْعِيّ"
    - lemma: "تَنَكُّسُ البُقْعَةِ الصَّفْرَاء"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع الاستخدام في الأدبيات الطبية العربية لشرح المرض."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "تَنَكُّسُ البُقْعَةِ الصَّفْرَاء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ضُمُورُ البُقْعَةِ"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من تقارب المعنى، إلا أن 'الضمور' (atrophy) يمثل حالة نسيجية محددة قد تكون جزءاً من التنكس لكنها ليست مرادفاً كلياً له في الاصطلاح الطبي الدقيق."
    - lemma: "تَحَلُّلُ البُقْعَةِ"
      source: stage1
      decision: removed
      decision_reason: "أقل شيوعاً من 'تنكس' في الاصطلاح المعاصر."

stage4_content:
  definition:
    current: "مرض في العين ناتج عن تنكس خلايا البقعة الصفراء ويؤدي إلى عدم وضوح الرؤية؛ ويمكن أن يسبب العمى"
    assessment:
      decision: revise
      reason: "لتحسين الصياغة لتكون أكثر دقة ومطابقة للأسلوب المعجمي المصطلح."
    authored:
      - type: terminological
        text: "اضْطِرَابٌ عَيْنِيٌّ مُزْمِنٌ يَنْشَأُ عَنْ تَدَهْوُرِ الأَنْسِجَةِ فِي البُقْعَةِ الصَّفْرَاءِ (مَرْكَزُ الشَّبَكِيَّةِ)، مِمَّا يُسَبِّبُ فَقْدَانَ الرُّؤْيَةِ المَرْكَزِيَّةِ الحَادَّةِ وتغيمها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "اضْطِرَابٌ عَيْنِيٌّ مُزْمِنٌ يَنْشَأُ عَنْ تَدَهْوُرِ الأَنْسِجَةِ فِي البُقْعَةِ الصَّفْرَاءِ (مَرْكَزُ الشَّبَكِيَّةِ)، مِمَّا يُسَبِّبُ فَقْدَانَ الرُّؤْيَةِ المَرْكَزِيَّةِ الحَادَّةِ وتغيمها."}
  examples:
    per_lemma:
      - lemma: "تَنَكُّسٌ بُقْعِيّ"
        examples:
          - text: "يُعَدُّ التَّنَكُّسُ البُقْعِيُّ المُرْتَبِطُ بِالسِّنِّ السَّبَبَ الرَّئِيسِيَّ لِفَقْدَانِ البَصَرِ لَدَى كِبَارِ السِّنِّ."
            type: usage
      - lemma: "تَنَكُّسُ البُقْعَةِ الصَّفْرَاء"
        examples:
          - text: "يُمْكِنُ لِلْفَحْصِ الدَّوْرِيِّ لِلْعَيْنِ كَشْفُ تَنَكُّسِ البُقْعَةِ الصَّفْرَاءِ فِي مَرَاحِلِهِ الأُولَى."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعَدُّ التَّنَكُّسُ البُقْعِيُّ المُرْتَبِطُ بِالسِّنِّ السَّبَبَ الرَّئِيسِيَّ لِفَقْدَانِ البَصَرِ لَدَى كِبَارِ السِّنِّ."}

