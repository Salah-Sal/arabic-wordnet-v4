stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي 'شخص يتعرق' ركيك ودائري بعض الشيء، حيث استخدم الفعل من نفس جذر الكلمة المعرفة."
      - "اللمة الموجودة (مُتَعَرِّق) صحيحة ودقيقة، لكن يمكن إثراء المجموعة بمرادفات أخرى من صيغ الصفة المشبهة."
    observations: "المفهوم يشير إلى شخص يفرز العرق، ويدور في فلك اسم الفاعل من الفعل الخماسي (تَعَرَّقَ)، أو الصفة المشبهة من الثلاثي (عَرِقَ). اللغة العربية غنية بصيغ الوصف المرتبطة بإفراز السوائل كالرشح والعرق."
  blind_candidates:
    - lemma: "مُتَعَرِّق"
      generation_method: ishtiqaq
      justification: "اسم الفاعل القياسي من الفعل (تَعَرَّقَ)، وهو الأدق في الدلالة على من يقوم بفعل التعرق."
    - lemma: "عَرْقَان"
      generation_method: ishtiqaq
      justification: "صفة مشبهة قياسية على وزن (فَعْلَان) من الفعل (عَرِقَ)، تدل على امتلاء الشخص بالعرق."
    - lemma: "عَرِق"
      generation_method: ishtiqaq
      justification: "صفة مشبهة على وزن (فَعِل) من الفعل (عَرِقَ)، تدل على من يتصف بالعرق."
    - lemma: "رَشَّاح"
      generation_method: majaz
      justification: "من الرشح وهو نضح السائل، وتستخدم مجازاً أو اشتقاقاً لمن يفرز العرق بكثرة."

stage2_evidence:
  per_lemma:
    - lemma: "مُتَعَرِّق"
      confirm:
        - text: "«متعرِّق: مُفْرِزٌ عَرَقًا.»"
          source: "المورد الحديث (2008)"
        - text: "«المتَعَرِّق: كادح يقوم بعملٍ معرِّق»"
          source: "المورد الحديث (2008)"
    - lemma: "عَرْقَان"
      confirm:
        - text: "«عَرِقَ ـ عَرَقاً : رشَح جِلْدُه . فهو عَرْقَانُ»"
          source: "المعجم الوسيط"
    - lemma: "عَرِق"
      confirm:
        - text: "«عرق الحائط ، وعرقت الأرض : فهو عَرِقٌ , وعَرِقَانٌ»"
          source: "المعجم الوسيط"
    - lemma: "رَشَّاح"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُتَعَرِّق"
      decision: confirmed
      decision_reason: "لمة صحيحة ومناسبة للمفهوم، وهي اسم الفاعل القياسي من (تَعَرَّقَ) وتدل مباشرة على الشخص الذي يفرز العرق، وقد أيدتها المعاجم المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "عَرْقَان"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة فصيحة ومثبتة في المعجم الوسيط (عَرِقَ فهو عَرْقَانُ)، وهي من صيغ الصفة المشبهة التي تدل على من يتصبب عرقاً وتناسب سياق الوصف البشري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عَرْقَان", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عَرِق"
      source: stage1
      decision: removed
      decision_reason: "رغم صحتها لغوياً، إلا أنها وردت في المعاجم غالباً كصفة للأشياء (الحائط، الأرض)، واستخدام (عرقان) أو (متعرق) أبلغ وأكثر شيوعاً لوصف الإنسان."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "رَشَّاح"
      source: stage1
      decision: removed
      decision_reason: "كلمة مجازية تستخدم عادة للأشياء المادية (كالأواني الفخارية) التي تنضح بالماء، واستخدامها كوصف للإنسان في حالة التعرق غير دقيق أو شائع معجمياً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "شخص يتعرق"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري لكونه يستخدم مشتقاً من نفس الجذر (يتعرق)، ويحتاج إلى صياغة أكثر تفصيلاً تبين طبيعة الفعل (إفراز العرق)."
    authored:
      - type: terminological
        text: "شَخْصٌ يُفرِزُ جِلْدُهُ العَرَقَ اسْتِجَابَةً لِلْحَرَارَةِ أَوِ الجُهْدِ أَوِ الانْفِعَالِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ يُفرِزُ جِلْدُهُ العَرَقَ اسْتِجَابَةً لِلْحَرَارَةِ أَوِ الجُهْدِ أَوِ الانْفِعَالِ."}

  examples:
    per_lemma:
      - lemma: "مُتَعَرِّق"
        examples:
          - text: "بَدَا العَدَّاءُ مُتَعَرِّقًا بَعْدَ وُصُولِهِ إِلَى خَطِّ النِّهَايَةِ."
            type: usage
      - lemma: "عَرْقَان"
        examples:
          - text: "عَادَ العَامِلُ إِلَى بَيْتِهِ عَرْقَانَ مِنْ شِدَّةِ الحَرِّ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "بَدَا العَدَّاءُ مُتَعَرِّقًا بَعْدَ وُصُولِهِ إِلَى خَطِّ النِّهَايَةِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "بَدَا العَدَّاءُ مُتَعَرِّقًا بَعْدَ وُصُولِهِ إِلَى خَطِّ النِّهَايَةِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "عَادَ العَامِلُ إِلَى بَيْتِهِ عَرْقَانَ مِنْ شِدَّةِ الحَرِّ."}

