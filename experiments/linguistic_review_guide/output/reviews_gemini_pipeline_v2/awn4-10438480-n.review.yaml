  per_entry:
    - lemma: "مُتَعَرِّق"
      entry_id: "{auto}"
      root: "عرق"
      maqayis_quote: "«الْعَيْنُ وَالرَّاءُ وَالْقَافُ أَرْبَعَةُ أُصُولٍ صَحِيحَةٌ: أَحَدُهَا الشَّيْءُ يَتَوَلَّدُ مِنْ شَيْءٍ كَالنَّدَى وَالرَّشْحِ وَمَا أَشْبَهَهُ.»"
