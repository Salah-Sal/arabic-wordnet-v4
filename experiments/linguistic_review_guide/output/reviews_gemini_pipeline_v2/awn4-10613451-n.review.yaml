stage1_review:
  assessment:
    concerns:
      - "اللمة (مستعرض) تعني في الغالب (transverse) أو (browser) ولا تدل عادة على (showperson)."
    observations: "المفهوم يشير إلى شخص يحترف تقديم العروض المسرحية أو الترفيهية بمهارة لجذب الجمهور."
  blind_candidates:
    - lemma: "مُسْتَعْرِض"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استعرض، أي قدم عرضاً."
    - lemma: "عَرَّاض"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من الفعل عرض، لمن يكثر تقديم العروض."
    - lemma: "مُقَدِّمُ عُرُوضٍ"
      generation_method: tarkib
      justification: "مركب إضافي يصف الشخص بناءً على وظيفته."
    - lemma: "فَنَّانٌ اسْتِعْرَاضِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر بدقة عن مؤدي العروض الفنية الترفيهية."

stage2_evidence:
  per_lemma:
    - lemma: "فَنَّان اسْتِعْرَاضِيّ"
      evidence_status: "no_material_found"
    - lemma: "مُسْتَعْرِض"
      contradicts:
        - text: "«عمودي على الاتجاه الرأسي»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "المعنى يشير إلى الاتجاه العرضي (transverse) وليس إلى مقدم العروض."
    - lemma: "عَرَّاض"
      evidence_status: "no_material_found"
    - lemma: "مُقَدِّمُ عُرُوضٍ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "فَنَّان اسْتِعْرَاضِيّ"
      decision: confirmed
      decision_reason: "مصطلح معاصر وشائع الاستخدام للدلالة على من يمتلك مهارة في تقديم العروض المسرحية أو الفنية الترفيهية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح الوحيد المعتمد في هذه المجموعة، يركز على الجانب الفني والأدائي الماهر."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَنَّانٌ اسْتِعْرَاضِيٌّ"

    - lemma: "مُسْتَعْرِض"
      decision: removed
      decision_reason: "تُستخدم في سياقات علمية وتقنية بمعنى 'عرضي' (transverse) أو في تقنية المعلومات بمعنى متصفح (browser)، ولا تستخدم للدلالة على مؤدي العروض."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عَرَّاض"
      source: stage1
      decision: removed
      decision_reason: "صيغة غير مستعملة بهذا المعنى في المعاجم أو الاستعمال المعاصر."
      evidence_assessment:
        case: no_material

    - lemma: "مُقَدِّمُ عُرُوضٍ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك كمصطلح معجمي ثابت."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "شخص ماهر في تقديم العروض المؤثرة"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يمكن أن يكون أكثر دقة وإحكاماً ليعكس الجانب الترفيهي والفني للعروض."
    authored:
      - type: terminological
        text: "مؤدٍّ يمتلك مهارة عالية في تقديم العروض الفنية والترفيهية بطريقة تجذب انتباه الجمهور."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مؤدٍّ يمتلك مهارة عالية في تقديم العروض الفنية والترفيهية بطريقة تجذب انتباه الجمهور."
  examples:
    per_lemma:
      - lemma: "فَنَّان اسْتِعْرَاضِيّ"
        examples:
          - text: "أبهرَ الفَنَّانُ الاسْتِعْرَاضِيُّ الحُضُورَ بِقُدْرَتِهِ عَلَى التَّفَاعُلِ مَعَهُمْ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أبهرَ الفَنَّانُ الاسْتِعْرَاضِيُّ الحُضُورَ بِقُدْرَتِهِ عَلَى التَّفَاعُلِ مَعَهُمْ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أبهرَ الفَنَّانُ الاسْتِعْرَاضِيُّ الحُضُورَ بِقُدْرَتِهِ عَلَى التَّفَاعُلِ مَعَهُمْ."

stage5_enrichment:
  per_entry:
    - lemma: "فَنَّان اسْتِعْرَاضِيّ"
      entry_id: "{auto}"
      roots:
        - word: "فنان"
          root: "فنن"
          maqayis_quote: "«الْفَاءُ وَالنُّونُ أَصْلَانِ صَحِيحَانِ... الْأَفَانِينُ: أَجْنَاسُ الشَّيْءِ وَطُرُقُهُ.»"
        - word: "استعراضي"
          root: "عرض"
          maqayis_quote: "«الْعَيْنُ وَالرَّاءُ وَالضَّادُ بِنَاءٌ تَكْثُرُ فُرُوعُهُ، وَهِيَ مَعَ كَثْرَتِهَا تَرْجِعُ إِلَى أَصْلٍ وَاحِدٍ، وَهُوَ الْعَرْضُ الَّذِي يُخَالِفُ الطُّولَ...»"
  per_sense:
    - lemma: "فَنَّان اسْتِعْرَاضِيّ"
      sense_id: "{auto}"
      nuance: "يركز على مهارة الأداء الجماهيري والترفيهي وجذب الانتباه."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"فنان","root":"فنن","maqayis":"«الْفَاءُ وَالنُّونُ أَصْلَانِ صَحِيحَانِ... الْأَفَانِينُ: أَجْنَاسُ الشَّيْءِ وَطُرُقُهُ.»"},{"word":"استعراضي","root":"عرض","maqayis":"«الْعَيْنُ وَالرَّاءُ وَالضَّادُ بِنَاءٌ تَكْثُرُ فُرُوعُهُ، وَهِيَ مَعَ كَثْرَتِهَا تَرْجِعُ إِلَى أَصْلٍ وَاحِدٍ، وَهُوَ الْعَرْضُ الَّذِي يُخَالِفُ الطُّولَ...»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على مهارة الأداء الجماهيري والترفيهي وجذب الانتباه.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
