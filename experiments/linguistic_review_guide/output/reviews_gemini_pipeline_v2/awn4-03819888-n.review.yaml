      nuance: "يشيع استخدامها في الآلات ذات الهيكل الطويل كالمعازف الوترية لتدل على الجزء الممتد."
      mwe: false
    - lemma: "عُنُق"
      sense_id: "{auto}"
      nuance: "أكثر شيوعاً في الدلالة على الجزء الضيق الذي يمثل الفوهة أو المدخل في الأوعية (مثل عنق الزجاجة)."
      mwe: false
    - lemma: "خَصْر"
      sense_id: "{auto}"
      nuance: "يُطلق على الجزء الأوسط المستدق من الشيء، بخلاف العنق الذي يكون عادةً في الطرف."
      mwe: false

