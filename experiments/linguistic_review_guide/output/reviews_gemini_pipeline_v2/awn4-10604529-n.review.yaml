stage1_review:
  assessment:
    concerns:
      - "المصطلح الإنجليزي 'sex symbol' يصعب ترجمته حرفياً إلى (رمز جنسي) لاختلاف الدلالات الثقافية ولما قد تحمله الترجمة الحرفية من إيحاءات قد تعتبر غير مقبولة في السياق العربي الفصيح والصحافي."
      - "المصطلحات المتاحة في المجموعة هي تعابير حديثة مترجمة، والأفضل هو التركيز على الجاذبية والفتنة أو الإغراء، فتعبير (رمز الإغراء) هو الأكثر تداولاً وأقرب للدلالة المقصودة."
    observations: "المفهوم حديث وينتمي إلى ثقافة الإعلام والسينما، وهو يصف الأشخاص (عادة المشاهير) الذين يتمتعون بجاذبية طاغية. المعاجم التراثية لا تحوي هذا المفهوم كمركب، لكن المعاجم الحديثة تقبل تراكيب وصفية أو إضافية مثل 'رمز الإغراء'."
  blind_candidates:
    - lemma: "رَمْزُ الْإِثَارَةِ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر عن الشخص الذي يمثل قمة الإثارة والجاذبية للمتلقين."
    - lemma: "أَيْقُونَةُ الْفِتْنَةِ"
      generation_method: tarkib
      justification: "استخدام أيقونة للتعبير عن الرمز المطلق، والفتنة للإشارة إلى الجاذبية الشديدة."
    - lemma: "مِثَالُ الْجَاذِبِيَّةِ"
      generation_method: tarkib
      justification: "مركب يعبر عن الشخص الذي يجسد الجاذبية والقبول."
    - lemma: "نَجْمُ إِغْرَاءٍ"
      generation_method: tarkib
      justification: "تعبير شائع في السياق الفني للمشاهير الذين يشتهرون بجاذبيتهم وأدوارهم التي تعتمد على ذلك."

stage2_evidence:
  per_lemma:
    - lemma: "رَمْز الْإِغْرَاء"
      evidence_status: no_material_found
    - lemma: "رَمْز جِنْسِيّ"
      evidence_status: no_material_found
    - lemma: "رَمْزُ الْإِثَارَةِ"
      evidence_status: no_material_found
    - lemma: "أَيْقُونَةُ الْفِتْنَةِ"
      evidence_status: no_material_found
    - lemma: "مِثَالُ الْجَاذِبِيَّةِ"
      evidence_status: no_material_found
    - lemma: "نَجْمُ إِغْرَاءٍ"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "رَمْز الْإِغْرَاء"
      decision: confirmed
      decision_reason: "تعبير مستقر وشائع الاستخدام في الإعلام العربي والصحافة الفنية للدلالة على هذا المفهوم بدقة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَمْزُ الْإِغْرَاءِ"

    - lemma: "رَمْز جِنْسِيّ"
      decision: removed
      decision_reason: "ترجمة حرفية فجة للمصطلح الإنجليزي (sex symbol) ولا تتناسب مع الأسلوب العربي الفصيح للتعبير عن الجاذبية والفتنة، حيث يفضل استخدام (إغراء) أو (إثارة)."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "رَمْزُ الْإِثَارَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب إضافي سليم وشائع الاستخدام ويدل على المعنى بدقة، ويمثل رديفاً ممتازاً لـ (رمز الإغراء)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "رَمْزُ الْإِثَارَةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "أَيْقُونَةُ الْفِتْنَةِ"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من صحة التركيب، إلا أن كلمة (أيقونة) لا تزال تحمل طابعاً تعريبياً أو دلالات أخرى، والبدائل المعتمدة أكثر شيوعاً وأبلغ."

    - lemma: "مِثَالُ الْجَاذِبِيَّةِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي عام لا يرقى إلى مستوى المصطلح المستقر في الاستخدام."

    - lemma: "نَجْمُ إِغْرَاءٍ"
      source: stage1
      decision: removed
      decision_reason: "تعبير يشير غالباً إلى نوع معين من التمثيل السينمائي أكثر من كونه مصطلحاً عاماً للجاذبية المطلقة كرمز."

stage4_content:
  definition:
    current: "شخص (خاصة من المشاهير) معروف بجاذبيته الجنسية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم ترجمة حرفية ركيكة (الجاذبية الجنسية)، والأفضل صياغته بأسلوب عربي سليم يشير إلى الجاذبية الطاغية والفتنة، ليكون أليق وأكثر دقة في التعبير عن المفهوم المرجعي."
    authored:
      - type: terminological
        text: "شَخْصٌ، مَشْهُورٌ غَالِباً، يَتَمَتَّعُ بِجَاذِبِيَّةٍ جَسَدِيَّةٍ طَاغِيَةٍ وَفِتْنَةٍ شَدِيدَةٍ، مِمَّا يَجْعَلُهُ مِثَالاً لِلْإِثَارَةِ فِي الثَّقَافَةِ الشَّعْبِيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ، مَشْهُورٌ غَالِباً، يَتَمَتَّعُ بِجَاذِبِيَّةٍ جَسَدِيَّةٍ طَاغِيَةٍ وَفِتْنَةٍ شَدِيدَةٍ، مِمَّا يَجْعَلُهُ مِثَالاً لِلْإِثَارَةِ فِي الثَّقَافَةِ الشَّعْبِيَّةِ."}

  examples:
    per_lemma:
      - lemma: "رَمْزُ الْإِغْرَاءِ"
        examples:
          - text: "أَصْبَحَتِ الْمُمَثِّلَةُ رَمْزاً لِلْإِغْرَاءِ بَعْدَ دَوْرِهَا الْبَارِزِ فِي الْفِيلْمِ الْأَخِيرِ."
            type: usage
      - lemma: "رَمْزُ الْإِثَارَةِ"
        examples:
          - text: "تُعَدُّ النَّجْمَةُ شَخْصِيَّةً لَافِتَةً وَرَمْزَ إِثَارَةٍ فِي صِنَاعَةِ السِّينِمَا الْمُعَاصِرَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "أَصْبَحَتِ الْمُمَثِّلَةُ رَمْزاً لِلْإِغْرَاءِ بَعْدَ دَوْرِهَا الْبَارِزِ فِي الْفِيلْمِ الْأَخِيرِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُعَدُّ النَّجْمَةُ شَخْصِيَّةً لَافِتَةً وَرَمْزَ إِثَارَةٍ فِي صِنَاعَةِ السِّينِمَا الْمُعَاصِرَةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "رَمْزُ الْإِغْرَاءِ"
      entry_id: "{auto}"
      roots:
        - word: "رمز"
          root: "رمز"
          maqayis_quote: "«(رَمَزَ) الرَّاءُ وَالْمِيمُ والزَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَرَكَةٍ وَاضْطِرَابٍ...»"
        - word: "إغراء"
          root: "غرو"
          maqayis_quote: "«(غَرَوَ) الْغَيْنُ وَالرَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ، وَهُوَ يَدُلُّ عَلَى الْإِعْجَابِ وَالْعَجَبِ لِحُسْنِ الشَّيْءِ...»"
