stage1_review:
  assessment:
    concerns:
      - "اللمة «إكتوبلازم» تفتقر إلى التشكيل الكامل."
      - "اللمة «جِبْلة خارجية» قد توحي بدلالة بيولوجية (ectoplasm في الخلية) أكثر من كونها مصطلحاً روحانياً، وهي ترجمة حرفية (calque) للمصطلح الإنجليزي."
    observations: "المفهوم ينتمي إلى حقل الروحانيات (Spiritualism)، وهو مصطلح حديث دخل العربية عبر الترجمة والتعريب. المصطلح المعرّب «إكتوبلازم» هو الأكثر شيوعاً في الأدبيات المتخصصة، بينما «جبلة خارجية» هي المقابل المصطلحي الذي يحاول تأصيل الكلمة بناءً على بنيتها الاشتقاقية الإنجليزية (ecto- + -plasm)."
  blind_candidates:
    - lemma: "إِكْتُوبْلَازْم"
      generation_method: taarib
      justification: "التعريب المباشر للمصطلح العالمي لضمان الدقة وتجنب اللبس مع المفاهيم البيولوجية."
    - lemma: "جِبْلَة نَفَسِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين «جبلة» (بمعنى مادة حيوية أو بروتوبلازم) و«نفسية» لتمييزها عن الجبلة البيولوجية."
    - lemma: "مَادَّة رُوحِيَّة"
      generation_method: tarkib
      justification: "تعبير وصفي عام يوضح طبيعة المادة المقصودة في سياق الروحانيات."
    - lemma: "سُدَام رُوحِيّ"
      generation_method: majaz
      justification: "استخدام «سدام» (بمعنى ضباب أو مادة غيمية) لوصف المادة الهلامية أو الغازية التي تنبعث من الوسيط."

stage2_evidence:
  per_lemma:
    - lemma: "إكتوبلازم"
      confirm:
        - text: "«الجِبْلَة [أو البلازما] الخارجية (أح). translation_en: ectoplasm»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الوسيط): شخص يُزعم أنّه صلة وصلٍ بين العالم الأرضي وعالم الأرواح [في التنويم المغنطيسي].»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد سياق 'الوسيط' المرتبط بظاهرة الإكتوبلازم في الروحانيات."
    - lemma: "جِبْلة خارجية"
      confirm:
        - text: "«الجِبِلَّةُ ... (في علوم الأحياء): البروتوبلازمة protoplasm ... مُتَشَكِّلةً إلى الجَبْلَةِ الخَلَوِيَّةِ (السيتوبلازمة) ... والجبلَة النَّووِيّة»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الجِبْلَة [أو البلازما] الخارجية (أح).»"
          source: "المورد الحديث (2008)"
          conflict: "الدليل يحصر المصطلح في علم الأحياء (أح) مما قد يسبب لبساً عند استخدامه في الروحانيات."

