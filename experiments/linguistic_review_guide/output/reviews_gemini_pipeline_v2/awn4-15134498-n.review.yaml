stage4_content:
  definition:
    current: "(في الروحانيات) مادة يُفترض أنها تنبعث من جسد الوسيط الروحي أثناء الغيبوبة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق من حيث المضمون لكنه يفتقر إلى الصياغة المعجمية الرصينة."
    authored:
      - type: terminological
        text: "مادّةٌ هُلاميّةٌ أو غازيّةٌ يُزعَمُ صُدُورُها من جَسدِ الوَسيطِ الرُّوحِيِّ أثناءَ غَيْبُوبتِه التَّنْويميّةِ لتَتَجسَّدَ فيها الأرواح."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "إِكْتُوبْلَازْم"
        examples:
          - text: "زعم الحاضرون في جلسة تحضير الأرواح رؤية خيوط من الإكتوبلازم تنبعث من فم الوسيط."
            type: usage
      - lemma: "جِبْلَة خَارِجِيَّة"
        examples:
          - text: "يعتقد الروحانيون أن الجبلة الخارجية هي المادة الوسيطة التي تتيح للروح التأثير في العالم المادي."
            type: usage
      - lemma: "مَادَّة رُوحِيَّة"
        examples:
          - text: "وصف الباحث المادة الروحية المنبعثة بأنها ذات لون أبيض ضارِب إلى الزرقة."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-15134498-n"
          definition_index: 0
          text: "مادّةٌ هُلاميّةٌ أو غازيّةٌ يُزعَمُ صُدُورُها من جَسدِ الوَسيطِ الرُّوحِيِّ أثناءَ غَيْبُوبتِه التَّنْويميّةِ لتَتَجسَّدَ فيها الأرواح."

