      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ذرر","maqayis":"«الذَّالُ وَالرَّاءُ الْمُشَدَّدَةُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَطَافَةٍ وَانْتِشَارٍ. وَمِنْ ذَلِكَ الذَّرُّ: صِغَارُ النَّمْلِ، الْوَاحِدَةُ ذَرَّةٌ.»"}'
