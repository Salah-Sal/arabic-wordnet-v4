        key: note
        value: '{"roots":[{"word":"قائد","root":"قود","maqayis":"«الْقَافُ وَالْوَاوُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى امْتِدَادٍ فِي الشَّيْءِ...»"},{"word":"مركبة","root":"ركب","maqayis":"«الرَّاءُ وَالْكَافُ وَالْبَاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ مُنْقَاسٌ، وَهُوَ عُلُوُّ شَيْءٍ شَيْئًا...»"}]}'
    - command: set_metadata
