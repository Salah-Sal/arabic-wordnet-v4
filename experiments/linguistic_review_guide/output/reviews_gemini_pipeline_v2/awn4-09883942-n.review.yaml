stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (مُفَجِّر) هي اسم فاعل عام قد يطلق على الشخص أو الأداة، إلا أنها في الاستعمال المعاصر شائعة للدلالة على الشخص الذي يقوم بالتفجير."
      - "المفهوم الإنجليزي يشير تحديداً إلى (زارع القنابل)، والترجمة الحرفية عبارة وصفية لا ترقى لمرتبة المصطلح، مما يجعلنا نعتمد على (مُفَجِّر) كأقرب لفظ مسكوك."
    observations: "التعريف يعبر عن دلالة واضحة ومباشرة (شخص يزرع القنابل)، والمقابل الإنجليزي هو bomber. أقرب ترجمة ومصطلح عربي مستعمل هو (مُفَجِّر) حيث شاع إطلاقها في لغة الإعلام على منفذي العمليات التفجيرية سواء بزرع القنابل أو بغيرها."
  blind_candidates:
    - lemma: "مُفَجِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (فجّر)، وتطلق على الشخص الذي يقوم بالتفجير، وهو المصطلح الشائع حديثاً."
    - lemma: "زَارِع قَنَابِل"
      generation_method: tarkib
      justification: "تركيب إضافي يطابق التعريف المباشر للمفهوم الإنجليزي (a person who plants bombs)."
    - lemma: "مُلَغِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (لغّم)، وتطلق على من يزرع الألغام أو العبوات الناسفة، وهي قريبة دلالياً."
    - lemma: "نَاسِف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (نسف)، ويستخدم للدلالة على تدمير المباني، وهو ذو صلة بعملية التفجير."

stage2_evidence:
  per_lemma:
    - lemma: "مُفَجِّر"
      confirm:
        - text: "«مفجر: ...» (ترد في القواميس المعاصرة كأداة تفجير detonator، وفي المعجم الوسيط: فجّر الشيء بمعنى شقه، واستعملت الكلمة حديثاً كاسم فاعل لمن يقوم بالتفجير)"
          source: "الاستعمال المعاصر والمعاجم الموحدة"
      contradicts: []
      expands: []
    - lemma: "زَارِع قَنَابِل"
      evidence_status: "no_material_found"
    - lemma: "مُلَغِّم"
      confirm:
        - text: "«ملغم: سبيكة خليطة من معدنين أو أكثر...» (وهذا يدل على استخدام الكلمة في مجال الكيمياء كاسم مفعول، أما اسم الفاعل فغير مثبت في المعاجم القديمة لهذا المعنى رغم صحته اللغوية)"
          source: "المعجم الموحد"
      contradicts: []
      expands: []
    - lemma: "نَاسِف"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُفَجِّر"
      decision: confirmed
      decision_reason: "مصطلح شائع ومستقر في اللغة المعاصرة للإشارة إلى من يقوم بزرع أو تفجير القنابل والعبوات. وصيغتها الصرفية قياسية (اسم فاعل من فجّر)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions: []
    
    - lemma: "زَارِع قَنَابِل"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك معجمياً، يترجم المفهوم الإنجليزي حرفياً ولا يعتبر مصطلحاً مستقراً."

    - lemma: "مُلَغِّم"
      source: stage1
      decision: removed
      decision_reason: "الفعل (لغّم) يختص أكثر بالألغام والمفخخات ولا يطابق تماماً المفهوم المعني بزرع القنابل بصورة مطلقة."

    - lemma: "نَاسِف"
      source: stage1
      decision: removed
      decision_reason: "كلمة (ناسف) ترتبط بتدمير البناء أو النسف، وتعبير (مفجر) أشيع وأدق للدلالة على الفاعل."

stage4_content:
  definition:
    current: "شخص يزرع القنابل"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي وقصير جداً، ويحتاج إلى صياغة معجمية أدق تشمل الغرض من الزرع والتفجير."
    authored:
      - type: terminological
        text: "شخص يقوم بزرع القنابل أو المتفجرات بغرض إحداث تفجير."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخص يقوم بزرع القنابل أو المتفجرات بغرض إحداث تفجير."

  examples:
    per_lemma:
      - lemma: "مُفَجِّر"
        examples:
          - text: "ألقت قوات الأمن القبض على المُفَجِّر قبل أن يلوذ بالفرار من مكان الحادث."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "ألقت قوات الأمن القبض على المُفَجِّر قبل أن يلوذ بالفرار من مكان الحادث."

stage5_enrichment:
  per_entry:
    - lemma: "مُفَجِّر"
      entry_id: "{auto}"
      root: "فجر"
      maqayis_quote: "«الْفَاءُ وَالْجِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّفَتُّحُ فِي الشَّيْءِ. مِنْ ذَلِكَ الْفَجْرُ: انْفِجَارُ الظُّلْمَةِ عَنِ الصُّبْحِ. وَمِنْهُ: انْفَجَرَ الْمَاءُ انْفِجَارًا: تَفَتَّحَ...»"
  
  per_sense:
    - lemma: "مُفَجِّر"
      sense_id: "{auto}"
      nuance: "يُستخدم للدلالة على الشخص الذي ينفذ تفجيراً، سواء بزرع القنبلة أو ارتدائها."
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فجر","maqayis":"«الْفَاءُ وَالْجِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّفَتُّحُ فِي الشَّيْءِ. مِنْ ذَلِكَ الْفَجْرُ: انْفِجَارُ الظُّلْمَةِ عَنِ الصُّبْحِ. وَمِنْهُ: انْفَجَرَ الْمَاءُ انْفِجَارًا: تَفَتَّحَ...»"}'
    
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُستخدم للدلالة على الشخص الذي ينفذ تفجيراً، سواء بزرع القنبلة أو ارتدائها.","mwe":false}'
    
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
        
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95