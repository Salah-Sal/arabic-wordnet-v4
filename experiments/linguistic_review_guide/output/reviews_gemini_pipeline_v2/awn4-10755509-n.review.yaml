stage1_review:
  assessment:
    concerns:
      - "اللفظ الحالي 'البطة القبيحة' هو ترجمة حرفية (Calque) لمصطلح إنجليزي، ورغم شيوعه إلا أنه يفتقر للأصالة اللغوية."
      - "تعريف المجموعة الحالي طويل ويحتاج لأسلوب معجمي أكثر إيجازاً."
      - "الارتباط بالمجموعة العليا (Hypernym) 'عامل' قد يكون غير دقيق، فالمدلول هنا يتعلق بالتحول النوعي للشخص لا بمجرد عمله."
    observations: "المفهوم يشير إلى 'التحول المفاجئ من القبح أو عدم الواعدية إلى الجمال أو التميز'. المصطلح الحالي مستمد من قصة هانز كريستيان أندرسن، وقد تغلغل في الثقافة العربية المعاصرة."
  blind_candidates:
    - lemma: "الْبَطَّةُ الْقَبِيحَةُ"
      generation_method: tarkib
      justification: "الترجمة الأكثر شيوعاً وقبولاً في الأدب العربي المعاصر للمفهوم العالمي."
    - lemma: "الْجَوْهَرُ الْمَكْنُونُ"
      generation_method: majaz
      justification: "استعارة عربية أصيلة تشير إلى القيمة العالية المخبوءة التي لا تظهر للعيان في البداية."
    - lemma: "النَّابِتَةُ الْفَذَّةُ"
      generation_method: tarkib
      justification: "وصف للنمو الذي يبدأ بسيطاً ثم يتحول لشيء فريد."
    - lemma: "الْمَخْبُوءُ الثَّمِينُ"
      generation_method: tarkib
      justification: "وصف مباشر للشخص الذي يمتلك قيمة لا تُرى في مظهره الأولي."

stage2_evidence:
  per_lemma:
    - lemma: "الْبَطَّة الْقَبِيحَة"
      evidence_status: "no_material_found"
    - lemma: "الْجَوْهَرُ الْمَكْنُونُ"
      confirm:
        - text: "«وهي زهراء، مثل لؤلؤة الغواص، ميزت من جوهر مكنون»"
          source: "لسان العرب (نقلاً عن أبي دهبل الجمحي)"
      expands:
        - text: "«الكاف والنون أصل واحد يدل على ستر أو صون...»"
          source: "مقاييس اللغة"
          addition: "يؤكد معنى الخفاء والصيانة، وهو ما يتفق مع جانب 'غير الواعد' في التعريف."
    - lemma: "النَّابِتَةُ الْفَذَّةُ"
      evidence_status: "no_material_found"
    - lemma: "الْمَخْبُوءُ الثَّمِينُ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الْبَطَّة الْقَبِيحَة"
      decision: confirmed
      decision_reason: "على الرغم من كونه اقتراضاً مفهومياً (Calque)، إلا أنه أصبح المصطلح المعياري في اللغة العربية المعاصرة لهذا المفهوم بفضل الترجمة الأدبية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْبَطَّةُ الْقَبِيحَةُ"
    - lemma: "الْجَوْهَرُ الْمَكْنُونُ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف عربي أصيل يعبر عن الجمال أو القيمة التي تكون مستورة في البداية ثم تتجلى، وهو بديل تراثي قوي للمصطلح المترجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "الْجَوْهَرُ الْمَكْنُونُ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "النَّابِتَةُ الْفَذَّةُ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي أدبي وليس مصطلحاً مسكوكاً."
    - lemma: "الْمَخْبُوءُ الثَّمِينُ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي يفتقر إلى التثبيت المعجمي."

stage4_content:
  definition:
    current: "طفل قبيح أو غير واعد ينمو ليصبح شخصاً جميلاً أو جديراً بالتقدير"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحاكي الصياغة الإنجليزية حرفياً، ويفضل استخدام أسلوب معجمي يركز على كونه تعبيراً كنائيّاً."
    authored:
      - type: terminological
        text: "تعبيرٌ كِنائيٌّ يُطلَقُ على طفلٍ أو ناشئٍ لا تظهرُ ملامِحُ تَميُّزِهِ أو جمالِهِ في بَدءِ أمرِهِ، ثم يَؤولُ حالُهُ إلى بَهاءٍ وتفَوُّقٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "تعبيرٌ كِنائيٌّ يُطلَقُ على طفلٍ أو ناشئٍ لا تظهرُ ملامِحُ تَميُّزِهِ أو جمالِهِ في بَدءِ أمرِهِ، ثم يَؤولُ حالُهُ إلى بَهاءٍ وتفَوُّقٍ."
  examples:
    per_lemma:
      - lemma: "الْبَطَّةُ الْقَبِيحَةُ"
        examples:
          - text: "لَم يَكُن أَحَدٌ يَتَوَقَّعُ نَجَاحَهُ فِي الصِّغَرِ، فَقَد كَانَ كَالْبَطَّةِ الْقَبِيحَةِ الَّتِي غَدَت أَجْمَلَ السِّبَاحِينَ."
            type: usage
      - lemma: "الْجَوْهَرُ الْمَكْنُونُ"
        examples:
          - text: "كَانَ طِفْلًا هَادِئًا لَا يَلْفِتُ الأَنْظَارَ، لَكِنَّهُ كَانَ جَوْهَرًا مَكْنُونًا تَجَلَّى بَرِيقُهُ عِنْدَ الكِبَرِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "لَم يَكُن أَحَدٌ يَتَوَقَّعُ نَجَاحَهُ فِي الصِّغَرِ، فَقَد كَانَ كَالْبَطَّةِ الْقَبِيحَةِ الَّتِي غَدَت أَجْمَلَ السِّبَاحِينَ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "كَانَ طِفْلًا هَادِئًا لَا يَلْفِتُ الأَنْظَارَ، لَكِنَّهُ كَانَ جَوْهَرًا مَكْنُونًا تَجَلَّى بَرِيقُهُ عِنْدَ الكِبَرِ."}

stage5_enrichment:
  per_entry:
    - lemma: "الْبَطَّةُ الْقَبِيحَةُ"
      entry_id: "{auto}"
      roots:
        - word: "البطة"
          root: "بطط"
          maqayis_quote: "«الْبَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْبَطُّ وَالشَّقُّ...»"
        - word: "القبيحة"
          root: "قبح"
          maqayis_quote: "«الْقَافُ وَالْبَاءُ وَالْحَاءُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى خِلَافِ الْحُسْنِ...»"
