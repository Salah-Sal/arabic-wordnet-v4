stage1_review:
  assessment:
    concerns:
      - "اللمة (شخص من الدرجة الثانية) عبارة عن ترجمة حرفية (Calque) للتعبير الإنجليزي (second-rate)، ورغم شيوعها إلا أنها أشبه بتركيب وصفي حر من كونها مصطلحاً مسكوكاً."
      - "اللمة (متوسط المستوى) تعبير سليم، لكنه يدل على المستوى المعتدل، في حين أن המفهوم قد يحمل دلالة سلبية (دونية أو انعدام الجدارة)."
    observations: "المفهوم يشير إلى شخص يفتقر إلى التميز وتكون قدراته أو قيمته أقل من المستوى المطلوب أو الممتاز. في التراث العربي توجد ألفاظ دقيقة لوصف هذا الصنف من الناس مثل (غُفْل) و(دُون)."
  blind_candidates:
    - lemma: "غُفْل"
      generation_method: majaz
      justification: "لفظ فصيح يُطلق على من لا نباهة له ولا شأن، وهو يطابق معنى من كان ذا قدرة أو قيمة من الدرجة الثانية."
    - lemma: "دُون"
      generation_method: majaz
      justification: "يُطلق الدون على الخسيس أو الحقير من الناس أو من هو أقل رتبة، وهو يعبر عن تدني القيمة أو القدرة."
    - lemma: "مُتَوَسِّطُ الْقُدْرَةِ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر بدقة عن الشخص الذي لا يتمتع بامتياز ويقف في مرتبة ثانية من حيث الكفاءة."
    - lemma: "عَادِيّ"
      generation_method: ishtiqaq
      justification: "مشتق من العادة، ويشير إلى الشخص الخالي من التميز الذي لا يفوق غيره."

stage2_evidence:
  per_lemma:
    - lemma: "شَخْص مِنَ الدَّرَجَة الثَّانِيَة"
      expands:
        - text: "«(1) من الدرجة الثانية (2) رديء.»"
          source: "المورد الحديث (2008)"
          addition: "يدعم استخدام عبارة (من الدرجة الثانية) للدلالة على المعنى الإنجليزي (second-rate)."
    - lemma: "مُتَوَسِّط الْمُسْتَوَى"
      evidence_status: "no_material_found"
    - lemma: "غُفْل"
      confirm:
        - text: "«(الغُفْلُ) من لا يُرجى خيره ولا يُخشى شرُّه من لا حَسَب له من الرجال... الرجلُ الذى لم تسمه التجارب»"
          source: "المعجم الوسيط"
    - lemma: "دُون"
      confirm:
        - text: "«الدُّونُ: الحَقِيرُ الخَسِيسُ ويُقال: هذا دُونَ ذلك: أَخَسُّ منه وأَدْنَى مَنْزِلَةً... رجلٌ دُونٌ: لَيْس بلاحِقٍ الشَّرِيفُ.»"
          source: "المعجم الكبير"
    - lemma: "مُتَوَسِّطُ الْقُدْرَةِ"
      confirm:
        - text: "«متوسط القدرة: average ability»"
          source: "مسرد التربية (موقع ArabTerm)"
      expands:
        - text: "«شخص متوسّط المقدِرة. (ترجمة لـ mediocrity)»"
          source: "المورد الحديث (2008)"
          addition: "يثبت استخدام المركب لترجمة המושג الإنجليزي المرادف."
    - lemma: "عَادِيّ"
      contradicts:
        - text: "«(العادي) الأمر الذى جرت العادة به»"
          source: "المعجم الوسيط"
          conflict: "الكلمة تدل على المألوف والطبيعي، ولا تحمل بالضرورة الدلالة السلبية (انعدام القيمة أو القدرة) التي يقصدها المفهوم."

stage3_analysis:
  per_lemma:
    - lemma: "شَخْص مِنَ الدَّرَجَة الثَّانِيَة"
      decision: confirmed
      decision_reason: "على الرغم من كونها ترجمة حرفية (Calque)، إلا أنها أصبحت شائعة ومفهومة للدلالة على الدونية في القيمة أو القدرة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَخْصٌ مِنَ الدَّرَجَةِ الثَّانِيَةِ"
    - lemma: "مُتَوَسِّط الْمُسْتَوَى"
      decision: confirmed
      decision_reason: "تركيب وصفي شائع ومناسب للتعبير عن الشخص الذي لا يتمتع بقدرات ممتازة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَوَسِّطُ الْمُسْتَوَى"
    - lemma: "غُفْل"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي تراثي دقيق يعبر عن الشخص الذي لا يتميز بشيء ولا شأن له، مما يطابق المعنى المطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "غُفْل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "دُون"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة فصيحة تعني الحقير والخسيس أو من هو أدنى منزلة، وتستخدم كاسم للدلالة على الشخص الدون."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "دُون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مُتَوَسِّطُ الْقُدْرَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب إضافي دقيق أثبتته المعاجم الحديثة للدلالة على الشخص الذي كفاءته في المرتبة الثانية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "مُتَوَسِّطُ الْقُدْرَةِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "عَادِيّ"
      source: stage1
      decision: removed
      decision_reason: "تدل على مجرد انعدام الشذوذ ولا تحمل الدلالة السلبية المرتبطة بـ (second-rate)."

stage4_content:
  definition:
    current: "شخص ذو قدرة أو قيمة من الدرجة الثانية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم التعبير الإنجليزي المترجم حرفياً (من الدرجة الثانية) ضمن التعريف، والأفضل صياغة تعريف لغوي عربي سليم يعبر عن الجوهر الدلالي."
    authored:
      - type: terminological
        text: "شَخْصٌ ذُو قُدْرَةٍ أَوْ قِيمَةٍ مُتَدَنِّيَةٍ لَا يَبْلُغُ دَرَجَةَ الِامْتِيَازِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ ذُو قُدْرَةٍ أَوْ قِيمَةٍ مُتَدَنِّيَةٍ لَا يَبْلُغُ دَرَجَةَ الِامْتِيَازِ."
  examples:
    per_lemma:
      - lemma: "شَخْص مِنَ الدَّرَجَة الثَّانِيَة"
        examples:
          - text: "عَامَلَهُ الْمُدِيرُ وَكَأَنَّهُ شَخْصٌ مِنَ الدَّرَجَةِ الثَّانِيَةِ."
            type: usage
      - lemma: "مُتَوَسِّط الْمُسْتَوَى"
        examples:
          - text: "كَانَ لَاعِبًا مُتَوَسِّطَ الْمُسْتَوَى فَلَمْ يَلْفِتِ الْأَنْظَارَ إِلَيْهِ."
            type: usage
      - lemma: "غُفْل"
        examples:
          - text: "بَدَا فِي الْمَجْلِسِ رَجُلًا غُفْلًا لَا يُؤْبَهُ لَهُ."
            type: usage
      - lemma: "دُون"
        examples:
          - text: "إِذَا مَا عَلَا الْمَرْءُ رَامَ الْعَلَاءَ، وَيَقْنَعُ بِالدُّونِ مَنْ كَانَ دُونًا."
            type: poetry
      - lemma: "مُتَوَسِّطُ الْقُدْرَةِ"
        examples:
          - text: "لَا يُمْكِنُ الِاعْتِمَادُ عَلَى شَخْصٍ مُتَوَسِّطِ الْقُدْرَةِ فِي الْمَهَامِّ الدَّقِيقَةِ."
            type: usage
    actions:
