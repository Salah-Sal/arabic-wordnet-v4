stage1_review:
  blind_generation:
    - lemma: عُلِّيَّة
      generation_method: ishtiqaq
      justification: "مصطلح مشتق يدل على الغرفة المرتفعة، وقد يُستخدم مجازاً للدلالة على الطوابق العليا في البناء."
    - lemma: طَابِق عُلْوِيّ
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين طابق (مستوى البناء) وعلوي (ما فوق الأساس)، وهو أدق تعبير عن 'upstairs'."
    - lemma: دَوْر عُلْوِيّ
      generation_method: tarkib
      justification: "تركيب وصفي موازٍ للطابق العلوي، وهو واسع الانتشار في المعمار الحديث."
    - lemma: دَوْر أَعْلَى
      generation_method: tarkib
      justification: "تركيب وصفي يشير إلى العلو المكاني، ولكنه قد يلتبس بالدور الأخير (الأعلى)."
  initial_assessment:
    concerns: []
    observations: "اللمة الموجودة 'طابق علوي' هي الترجمة الأصح والأكثر استخداماً لمفهوم (upstairs) الذي يمثل الأجزاء التي تعلو الطابق الأرضي. سنعمل على تثبيتها مع ضبط التشكيل وإضافة 'دور علوي' كمرادف شائع."

stage2_evidence:
  - lemma: طَابِق عُلْوِيّ
    evidence:
      - text: "«upper floor»"
        source: "المعجم الموحد للمصطلحات المهنية والتقنية (ARABTERM)"
        status: confirm
  - lemma: دَوْر عُلْوِيّ
    evidence:
      - text: "«(4) «أ», .أ» عُلويّ an upstairs room. «ب» خاصّ بالأدوار العُلويّة upstairs servant»"
        source: "المورد الحديث"
        status: confirm
  - lemma: عُلِّيَّة
    evidence:
      - text: "«الغرفة فى الطبقة الثانية من الدار وما فوقها»"
        source: "المعجم الوسيط"
        status: contradicts
      - text: "«شرفة في دور علوي تستعمل للخزن»"
        source: "معجم الغني"
        status: contradicts
  - lemma: دَوْر أَعْلَى
    evidence:
      - text: "«(2) في أو إلى دَوْرٍ أعلى [من مبنًى]»"
        source: "المورد الحديث"
        status: confirm

stage3_analysis:
  - lemma: طَابِق عُلْوِيّ
    evidence_status: confirm_only
    mwe_test:
      is_mwe: true
      type: wasfi
      reason: "تركيب وصفي شائع ومستقر يعبر عن وحدات البناء المرتفعة."
    dialectal_test:
      is_dialectal: false
    substitution_test:
      is_substitutable: true
    nuance: "العبارة الأكثر رسمية وشيوعاً لوصف ما يعلو الطابق الأرضي في التخطيط المعماري."
    loan_status:
      is_loanword: false
    quality_gate:
      is_approved: true
      reason: "مصطلح فصيح ودقيق معمارياً."
    morphological_fit:
      is_fit: true
      reason: "طابق من التطابق (لأن الطوابق تُبنى متطابقة فوق بعضها) وعلوي نسبة إلى العلو."
    decision: confirmed
    actions:
      - command: update_lemma
        params:
          lemma: طَابِق عُلْوِيّ
  - lemma: دَوْر عُلْوِيّ
    evidence_status: confirm_only
    mwe_test:
      is_mwe: true
      type: wasfi
      reason: "مكون من دور (طبقة البناء) وعلوي كصفة له، وهو ثابت معجمياً."
    dialectal_test:
      is_dialectal: false
    substitution_test:
      is_substitutable: true
    nuance: "مرادف للطابق العلوي، وكلمة 'دور' تستخدم بكثرة للإشارة لطبقات المبنى نظراً لدوران البناء حول نقطة وسطه."
    loan_status:
      is_loanword: false
    quality_gate:
      is_approved: true
      reason: "فصيح ومطرد ويسير التداول."
    morphological_fit:
      is_fit: true
      reason: "ملاءمة ممتازة لمعنى طبقة البناء."
    decision: confirmed
    actions:
      - command: create_entry
        params:
          lemma: دَوْر عُلْوِيّ
          pos: n
      - command: add_sense
        params:
          entry_id: "{auto}"
          synset_id: awn4-04523024-n
  - lemma: عُلِّيَّة
    decision: removed
    reason: "تشير في الاستخدام المعاصر والكلاسيكي إلى الحجرة العلوية أو الغرفة تحت السطح (attic / garret) وليس إلى مجمل الطوابق العلوية التي يرمز لها 'upstairs'."
  - lemma: دَوْر أَعْلَى
    decision: removed
    reason: "يمكن أن يوحي بالدور الأخير أو القمة، والأدق وصفه بـ 'علوي' ليشمل أي دور فوق الأرضي."

stage4_content:
  - lemma: طَابِق عُلْوِيّ
    definition_action: retain
    definition_reason: "التعريف الحالي 'جزء المبنى الذي يقع فوق الطابق الأرضي' دقيق تماماً ومناسب وواضح."
    quality_check:
      genus: "جزء المبنى"
      differentia: "الذي يقع فوق الطابق الأرضي"
      is_clear: true
    examples:
      - text: "تم تخصيص أي طابق علوي في المبنى الجديد للمكاتب الإدارية، بينما تُرِكَ الطابق الأرضي لخدمة الجمهور."
        type: usage
    actions:
      - command: add_sense_example
        params:
          example: "تم تخصيص أي طابق علوي في المبنى الجديد للمكاتب الإدارية، بينما تُرِكَ الطابق الأرضي لخدمة الجمهور."
  - lemma: دَوْر عُلْوِيّ
    examples:
      - text: "انتقل سكان العمارة إلى دور علوي هرباً من ضجيج الشارع وإزعاج المارة."
        type: usage
    actions:
      - command: add_sense_example
        params:
          example: "انتقل سكان العمارة إلى دور علوي هرباً من ضجيج الشارع وإزعاج المارة."
          entry_id: "{auto}"

