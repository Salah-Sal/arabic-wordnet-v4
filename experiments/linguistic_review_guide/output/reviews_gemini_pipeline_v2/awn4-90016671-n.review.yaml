stage1_review:
  assessment:
    concerns:
      - "اللمة 'شخص جبار' تميل إلى الوصفية، ويغلب على لفظ 'جبار' في الاستعمال الحديث دلالة الطغيان، وإن كانت في المعاجم تدل على الطول والقوة."
      - "التعريف الحالي يحتاج إلى صياغة أكثر دقة وأسلوباً معجمياً رصيناً."
    observations: "المجموعة تدور حول الشخصية القوية المهيبة التي تثير الإعجاب بصلابتها ومواقفها. اللمات المقترحة تهدف إلى إغناء المجموعة بألفاظ عربية أصيلة تعبر عن العظمة والرسوخ."
  blind_candidates:
    - lemma: "صِنْدِيد"
      generation_method: ishtiqaq
      justification: "لفظ عربي أصيل يطلق على السيد الشجاع القوي الذي يترأس القوم ويثير الإعجاب بقوته."
    - lemma: "طَوْد"
      generation_method: majaz
      justification: "استعارة من الجبل العظيم، تطلق على الشخص الراسخ القوي ذي الهيبة."
    - lemma: "هُمَام"
      generation_method: ishtiqaq
      justification: "يطلق على الرجل العظيم الهمة، الشجاع السخي، وهو وصف يثير الإعجاب."
    - lemma: "شَدِيدُ البَأْس"
      generation_method: tarkib
      justification: "تعبير يدل على القوة والمنعة والثبات في المواقف."

stage2_evidence:
  per_lemma:
    - lemma: "قَوِيّ الشَّكِيمَة"
      confirm:
        - text: "«فلان شديد الشكيمة أو ذو شكيمة: أنف أبي»"
          source: "المعجم الوسيط"
        - text: "«يقال إنه لشديد الشكيمة إذا كان أنفاً أبياً لا ينقاد»"
          source: "المعجم الكبير"
    - lemma: "شَخْص جَبَّار"
      confirm:
        - text: "«الجبار من الناس: العاتي المتمرد المتسلط القاهر... العظيم القوي الطويل»"
          source: "المعجم الكبير"
    - lemma: "صِنْدِيد"
      confirm:
        - text: "«الصنديد من الرجال: الصندد الملك العظيم الشريف الرئيس العظيم والي القوم»"
          source: "المعجم الكبير"
        - text: "«من الناس الصندد والشديد»"
          source: "المعجم الوسيط"
    - lemma: "طَوْد"
      confirm:
        - text: "«في حديث عائشة تصف أباها: ذاك طود منيف أي جبل عال»"
          source: "لسان العرب"
        - text: "«ويشبه به غيره من كل مرتفع أو عظيم أو راسخ»"
          source: "المعجم الوسيط"
    - lemma: "هُمَام"
      confirm:
        - text: "«السيد الشجاع السخي من الرجال»"
          source: "المعجم الوسيط"
        - text: "«مبالغة في الهم بمعنى العزم على القيام بالأمر»"
          source: "موسوعة السلطان قابوس"

stage3_analysis:
