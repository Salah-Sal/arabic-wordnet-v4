    - lemma: "صِنْدِيد"
      entry_id: "{auto}"
      root: "صند"
      maqayis_quote: "«الصَّادُ وَالنُّونُ وَالدَّالُ أَصْلٌ صَحِيحٌ، يَدُلُّ عَلَى عِظَمِ قَدْرٍ وَعِظَمِ جِسْمٍ. مِنْ ذَلِكَ الصِّنْدِيدُ، وَهُوَ السَّيِّدُ الشَّرِيفُ.»"
    - lemma: "طَوْد"
      entry_id: "{auto}"
      root: "طود"
      maqayis_quote: "«الطَّاءُ وَالْوَاوُ وَالدَّالُ أَصْلٌ صَحِيحٌ، وَفِيهِ كَلِمَةٌ وَاحِدَةٌ. فَالطَّوْدُ: الْجَبَلُ الْعَظِيمُ.»"
    - lemma: "هُمَام"
      entry_id: "{auto}"
      root: "همم"
      maqayis_quote: "«الْهَاءُ وَالْمِيمُ: أَصْلٌ صَحِيحٌ... ثُمَّ تُشْتَقُّ مِنَ الْهِمَّةِ: الْهُمَامُ: الْمَلِكُ الْعَظِيمُ الْهِمَّةِ.»"
    - lemma: "شَخْص جَبَّار"
