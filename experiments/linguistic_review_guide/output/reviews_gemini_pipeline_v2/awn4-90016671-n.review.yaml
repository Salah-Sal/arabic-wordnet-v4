stage4_content:
  definition:
    current: "شخص يعتبر مثيراً للإعجاب بسبب مواقفه أو سلوكه أو مظهره القوي للغاية"
    assessment:
      decision: revise
      reason: "الصياغة الحالية وصفية نوعاً ما، والتعريف المقترح أكثر جزالة ومطابقة لأسلوب المعاجم."
    authored:
      - type: terminological
        text: "شخص ذو هيبة وبأس، يثير الإعجاب بصلابة مواقفه أو مظهره القوي أو سلوكه الحازم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-90016671-n"
          definition_index: 0
          text: "شخص ذو هيبة وبأس، يثير الإعجاب بصلابة مواقفه أو مظهره القوي أو سلوكه الحازم."
  examples:
    per_lemma:
      - lemma: "قَوِيّ الشَّكِيمَة"
        examples:
          - text: "عرفناه رجلاً قوي الشكيمة لا يساوم على مبادئه."
            type: usage
      - lemma: "صِنْدِيد"
        examples:
          - text: "كان القائد صنديداً لم تهزه نوائب الدهر."
            type: usage
      - lemma: "طَوْد"
        examples:
          - text: "وقف الرجل كالطود العظيم أمام التحديات."
            type: usage
      - lemma: "هُمَام"
        examples:
          - text: "تولى الهمام قيادة الركب بكل شجاعة وحكمة."
            type: usage
      - lemma: "شَخْص جَبَّار"
        examples:
          - text: "كان خصمه شخصاً جباراً لا يستهان بقوته."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-90016671-n"
          text: "واجه الأزمة بروح الطود العظيم وقوة الشكيمة."

stage5_enrichment:
  per_entry:
    - lemma: "قَوِيّ الشَّكِيمَة"
