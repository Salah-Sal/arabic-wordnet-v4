          maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شِدَّةٍ خِلَافَ الضَّعْفِ.»"
        - word: "الشكيمة"
          root: "شكم"
