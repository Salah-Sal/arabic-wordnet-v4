stage1_review:
  assessment:
    concerns:
      - "اللمة (باعث للرعب) عبارة عن مركب وصفي حر غير مسكوك، ويمكن الاستعاضة عنه بعبارات مشابهة كـ(مسبب للرعب)، ولا يشكل وحدة معجمية مستقلة تستحق مدخلا."
      - "غُيِّبت بعض الألفاظ المفردة والدقيقة التي تعبر عن المعنى بشكل أبلغ، مثل (مروع) و(مرهب) وصيغة المبالغة (فزاعة)."
    observations: "المجموعة الترادفية تعبر عن شخص أو شيء يثير الخوف أو الفزع في نفوس الآخرين (terror, scourge). اللمة الحالية (مرعب) دقيقة وتؤدي الغرض كاسم فاعل. يمكن إثراء المجموعة بكلمات مشتقة كـ(مروع) و(مرهب)، وكلمات فيها معنى المبالغة كـ(فزاعة)، بالإضافة إلى التعبيرات المجازية كـ(بعبع) التي تدل على نفس المفهوم."
  blind_candidates:
    - lemma: "مُرَوِّع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل روَّع، وهو من يوقع الروع والخوف الشديد في نفوس الآخرين."
    - lemma: "بَعْبَع"
      generation_method: majaz
      justification: "لفظ مجازي معبر عن الشخص أو الكائن الذي يُستدعى لإخافة الآخرين أو تفزيعهم، وصار يستخدم للشيء الذي يبعث على الرعب المستمر."
    - lemma: "مُرْهِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل أرهب، وهو من يثير الخوف والرهبة في النفوس."
    - lemma: "فَزَّاعَة"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فعّالة، وهي دقيقة لوصف الشخص الذي يكثر منه إفزاع الناس وتخويفهم."

stage2_evidence:
  per_lemma:
    - lemma: "بَاعِث لِلرُّعْب"
      evidence_status: "no_material_found"
    - lemma: "مُرْعِب"
      confirm:
        - text: "مُرْعِب: من (ر ع ب) المخوف المفزع، والمقطع."
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُرَوِّع"
      confirm:
        - text: "شخص أو شيء مُروِّع"
          source: "المورد الحديث (2008)"
    - lemma: "بَعْبَع"
      confirm:
        - text: "بُعْبُع [مفرد]: ج بَعابِعُ: 1 - كائن وهميّ يستدعونه لتفزيع الأطفال «أصبحت الحروب النوويّة بعبع العالم: أصبحت أشد ما يضايق أو يرعب الناس»."
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "مُرْهِب"
      confirm:
        - text: "الْمُرْهِبُ: ما يثيرُ الخَوْفَ والفَزَعَ"
          source: "المعجم الكبير"
        - text: "مُرْهِب: المخيف."
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "فَزَّاعَة"
      confirm:
        - text: "فَزّاعة: الرجل الذي يفزع الناس كثيرا"
          source: "كتاب العين"

stage3_analysis:
  per_lemma:
    - lemma: "بَاعِث لِلرُّعْب"
      decision: removed
      decision_reason: "مركب وصفي حر غير مسكوك، لا يعد مصطلحا معجميا مستقلا، بل هو مجرد وصف يمكن توليده في الكلام العادي."
      evidence_assessment:
        case: no_material
    - lemma: "مُرْعِب"
      decision: confirmed
      decision_reason: "اسم فاعل صحيح وثابت معجميا بمعنى من يثير الخوف والفزع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرْعِب"
    - lemma: "مُرَوِّع"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من الفعل 'روّع'، دقيق في التعبير عن الشخص الذي يثير الخوف الشديد والروع، ومثبت معجميا بهذا المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُرَوِّع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "بَعْبَع"
      source: stage1
      decision: confirmed
      decision_reason: "استعمال مجازي شائع ومثبت معجميا للدلالة على الشخص أو الشيء الذي يثير الخوف والفزع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "بَعْبَع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مُرْهِب"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من 'أرهب'، نص المعجم الكبير صراحة على أنه 'ما يثير الخوف والفزع'، وهو مطابق تماما لمعنى المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُرْهِب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "فَزَّاعَة"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة مبالغة للموصوف بتخويف الناس، ذكر الخليل في العين أنها تعني 'الرجل الذي يفزع الناس كثيرا'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "فَزَّاعَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "شخص يثير الخوف أو الفزع"
    assessment:
      decision: revise
      reason: "تعديل طفيف لضبط الصياغة اللغوية وإضافة (في النفوس) لتوضيح أثر التخويف وتعميق المعنى."
    authored:
      - type: linguistic
        text: "شَخْصٌ يُثِيرُ الخَوْفَ أَوِ الفَزَعَ فِي النُّفُوسِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يُثِيرُ الخَوْفَ أَوِ الفَزَعَ فِي النُّفُوسِ."
  examples:
    per_lemma:
      - lemma: "مُرْعِب"
        examples:
          - text: "كَانَ الحَاكِمُ مُرْعِباً لِمُعَارِضِيهِ بِمُمَارَسَاتِهِ الصَّارِمَةِ."
            type: usage
      - lemma: "مُرَوِّع"
        examples:
          - text: "يُعَدُّ هَذَا المُجْرِمُ شَخْصاً مُرَوِّعاً فِي المَدِينَةِ لِكَثْرَةِ جَرَائِمِهِ."
            type: usage
      - lemma: "بَعْبَع"
        examples:
          - text: "أَصْبَحَ ذَلِكَ المُسْتَبِدُّ بَعْبَعاً يُخِيفُ كُلَّ مَنْ يَقْتَرِبُ مِنْهُ."
