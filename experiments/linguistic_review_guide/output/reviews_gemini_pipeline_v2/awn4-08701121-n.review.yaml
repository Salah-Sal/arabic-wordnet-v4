stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'مكان التواجد' تشهد شيوعاً واسعاً في الاستعمال المعاصر، لكنها تُنتقد لغوياً لأن 'التواجد' في الأصل من الوجد (الوله)، والأفصح هو استعمال 'مكان الوجود'."
    observations: "المجموعة تعبر عن المفهوم الإنجليزي (whereabouts) والذي يقصد به الموقع العام الذي يرجح أو يعرف وجود الشخص أو الشيء فيه. التركيب 'مكان التواجد' شائع، لكننا بحاجة لإضافة بدائل فصيحة."
  blind_candidates:
    - lemma: "مَظِنَّة"
      generation_method: ishtiqaq
      justification: "مظنة الشيء هي موضعه ومألفه الذي يظن كونه فيه، وهو يطابق تماماً فكرة (whereabouts) أي المكان المرجح للوجود."
    - lemma: "مَقَرّ"
      generation_method: ishtiqaq
      justification: "مكان الاستقرار، ويستخدم للإشارة إلى مكان تواجد الشخص أو المؤسسة."
    - lemma: "مَوْضِع"
      generation_method: ishtiqaq
      justification: "اسم مكان يدل على موضع الشيء ومكانه."
    - lemma: "مَكَان وُجُود"
      generation_method: tarkib
      justification: "تعبير تركيبي مباشر وهو البديل الفصيح الخالي من الخطأ الشائع 'تواجد'."

stage2_evidence:
  per_lemma:
    - lemma: "مكان التواجد"
      evidence_status: "no_material_found"
    - lemma: "مَظِنَّة"
      confirm:
        - text: "«مَظِنَّةُ الشيء: مَوْضِعُهُ ومَأْلَفُه الذي يُظَن كونه فيه المَظَانُّ: المراجع التى ينشد فيها الباحث طَلِبَتَه»"
          source: "المعجم الوسيط"
    - lemma: "مَقَرّ"
      expands:
        - text: "«(الْمقر) مَوضِع الِاسْتِقْرَار (ج) مقار يُقَال اذْكُرْنِي فِي المقار المقدسة وَمحل يَتَّخِذهُ الْإِنْسَان مَكَانا لإقامته»"
          source: "المعجم الوسيط"
          addition: "يدل على الاستقرار والإقامة وليس مجرد الموقع العام لوجود الشيء في لحظة معينة."
    - lemma: "مَوْضِع"
      expands:
        - text: "«(الْموضع) اسْم الْمَكَان وَيُقَال فِي قلبِي مَوضِع فلَان محبته (ج) مَوَاضِع»"
          source: "المعجم الوسيط"
          addition: "معناه أعم ويشمل أي مكان مادي يوضع فيه شيء."
    - lemma: "مَكَان وُجُود"
      confirm:
        - text: "«(1) أين؛ قربَ أيّ مكان whereabouts do you live? (2) أين I know whereabouts helives. (3) مكان؛ مكان وجود.»"
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "مكان التواجد"
      decision: confirmed
      decision_reason: "رغم الانتقادات اللغوية لاشتقاق 'التواجد' بمعنى الوجود المادي، إلا أن هذا المركب الإضافي اكتسب شيوعاً كبيراً جداً في الاستعمال المعاصر لترجمة (whereabouts)، ولا يمكن إنكار استقراره، فجرى إثباته مع ضبطه."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "التعبير الأكثر شيوعاً في الاستخدام المعاصر والإعلامي للإشارة إلى موقع وجود شخص أو شيء."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَكَان التَّوَاجُد"
    - lemma: "مَظِنَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي فصيح وبليغ يدل بدقة على المكان الذي يغلب على الظن وجود الشيء فيه، وهو يطابق دلالة المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance: "يحمل دلالة الاحتمال والترجيح، ويشير إلى المكان الذي يُظن أو يُتوقع وجود الشيء فيه عادةً."
      actions:
        - command: create_entry
          params: {lemma: "مَظِنَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَقَرّ"
      source: stage1
      decision: removed
      decision_reason: "المقر يدل على الاستقرار الدائم (headquarters/residence)، بينما المجموعة هنا للموقع العام أو مكان الوجود الذي قد يكون عابراً أو غير مستقر."
    - lemma: "مَوْضِع"
      source: stage1
      decision: removed
      decision_reason: "الموضع أعم دلالةً؛ فهو يعني أي نقطة مكانية يوضع فيها الشيء، بينما المطلوب هو مكان الوجود العام."
    - lemma: "مَكَان وُجُود"
      source: stage1
      decision: confirmed
      decision_reason: "التركيب الأصوب لغوياً والبديل الفصيح لـ'مكان التواجد'، وقد أورده معجم المورد كترجمة مباشرة للكلمة الإنجليزية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "التركيب الفصيح واللغوي السليم للتعبير عن الموقع العام الذي يحل فيه الشيء أو الشخص."
      actions:
        - command: create_entry
          params: {lemma: "مَكَان وُجُود", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الموقع العام الذي يوجد فيه شيء ما"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح، ويعبر عن الدلالة المقصودة للمجموعة بصورة ممتازة."
  examples:
    per_lemma:
      - lemma: "مكان التواجد"
        examples:
          - text: "رفضت السلطات الإفصاح عن مَكَانِ تَوَاجُدِ السجين لأسباب أمنية."
            type: usage
      - lemma: "مَظِنَّة"
        examples:
          - text: "مكتبةُ الجامعة هي مَظِنَّةُ هذه المخطوطات النادرة."
            type: usage
      - lemma: "مَكَان وُجُود"
        examples:
          - text: "لا تزال الشرطة تجهل مَكَانَ وُجُودِ المشتبه به."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "رفضت السلطات الإفصاح عن مَكَانِ تَوَاجُدِ السجين لأسباب أمنية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "مكتبةُ الجامعة هي مَظِنَّةُ هذه المخطوطات النادرة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "لا تزال الشرطة تجهل مَكَانَ وُجُودِ المشتبه به."}

