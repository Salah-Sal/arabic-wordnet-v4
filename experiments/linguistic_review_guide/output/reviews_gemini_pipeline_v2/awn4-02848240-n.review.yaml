stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تشمل صيغة الجمع (أسنان المفتاح) بينما يفضل المعجم عادة المفرد كواحدة معجمية أساسية."
      - "التعريف الحالي يستخدم كلمة 'الريش' لوصف أجزاء القفل، وهي كلمة دقيقة تقنياً ولكن قد تحتاج لتوضيح في التعريف لربطها باللمّة."
    observations: "المفهوم يشير إلى الجزء الوظيفي من المفتاح (bit) الذي يتفاعل مباشرة مع آلية القفل. المصطلحات العربية تتراوح بين المجاز الشكلي (لسان، سن، ريشة) والوصف الوظيفي. التوليد ركز على إحياء المفردات الدقيقة والتمييز بين أنواع الأقفال."
  blind_candidates:
    - lemma: "لِسَان الْمِفْتَاح"
      generation_method: majaz
      justification: "استعارة قائمة على المشابهة الشكلية للجزء الناتئ الذي يدخل الفتحة."
    - lemma: "سِنّ الْمِفْتَاح"
      generation_method: majaz
      justification: "استعارة شائعة للأجزاء المسننة في مفاتيح الأسطوانة (pin tumbler)."
    - lemma: "رِيشَة الْمِفْتَاح"
      generation_method: majaz
      justification: "مصطلح تقني شائع للمفاتيح ذات النصل المسطح (lever locks)."
    - lemma: "شُعْبَة الْمِفْتَاح"
      generation_method: majaz
      justification: "لفظ تراثي لوصف التفرع أو الجزء الناتئ من الأداة."

stage2_evidence:
  per_lemma:
    - lemma: "لِسَان الْمِفْتَاح"
      confirm:
        - text: "«لسان: tenon ... tongue»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
        - text: "«لسان المفتاح: سنه»"
          source: "المورد الحديث"
    - lemma: "أسنان المفتاح"
      confirm:
        - text: "«مفتاح لا يتطلب في عمله أية أسنان مفاتيح لتحرير قفل الإشعال»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
    - lemma: "سِنّ الْمِفْتَاح"
      confirm:
        - text: "«A tooth [or pin] of a key [app. of the kind of wooden lock called ضبة]»"
          source: "Lane's Lexicon"
        - text: "«سن أو شقب [شق صغير ضيق] في مفتاح»"
          source: "المورد الحديث"
    - lemma: "رِيشَة الْمِفْتَاح"
      confirm:
        - text: "«ريشة: blade»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
      expands:
        - text: "«الجزء من المفتاح الذي يدخل القفل ويرفع الريش»"
          source: "تعريف المجموعة (AWN4)"
          addition: "يؤكد أن الأجزاء المقابلة في القفل تسمى ريشاً، مما يجعل تسمية الجزء المطابق لها في المفتاح ريشةً تسميةً متسقة."

stage3_analysis:
  per_lemma:
    - lemma: "لسان المفتاح"
      decision: confirmed
      decision_reason: "مصطلح شائع ومستقر في المعاجم الحديثة والموسوعات التقنية لوصف لسان المفتاح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لِسَان الْمِفْتَاح"
    - lemma: "أسنان المفتاح"
      decision: confirmed
      decision_reason: "صيغة الجمع شائعة جداً لوصف نتوءات المفتاح، وإن كان يفضل وجود المفرد معها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَسْنَان الْمِفْتَاح"
    - lemma: "سِنّ الْمِفْتَاح"
      source: stage1
      decision: confirmed
      decision_reason: "المفرد ضروري كواحدة معجمية أساسية، وهو موثق في المعاجم اللغوية والتقنية (Lane, Al-Mawrid)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "سِنّ الْمِفْتَاح"
