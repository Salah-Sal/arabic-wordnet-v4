        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "رِيشَة الْمِفْتَاح"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق يصف نصل المفتاح في الأقفال ذات الريش (lever locks)، ويتسق مع المصطلحات المستخدمة في تعريف المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "رِيشَة الْمِفْتَاح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "الجزء من المفتاح الذي يدخل القفل ويرفع الريش"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح ولكنه يفتقر إلى الشمول لمختلف أنواع المفاتيح (المسننة والريشية)."
    authored:
      - type: terminological
        text: "الجُزْءُ النَّاتِئُ مِنْ مِفْتَاحِ البَابِ الَّذِي يَدْخُلُ فِي القُفْلِ لِيُحَرِّكَ الرِّيشَ (الأَسْنَانَ الدَّاخِلِيَّةَ) أَوْ لِيَرْفَعَ النَّوَابِضَ لِيَفْتَحَ الغَلْقَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الجُزْءُ النَّاتِئُ مِنْ مِفْتَاحِ البَابِ الَّذِي يَدْخُلُ فِي القُفْلِ لِيُحَرِّكَ الرِّيشَ (الأَسْنَانَ الدَّاخِلِيَّةَ) أَوْ لِيَرْفَعَ النَّوَابِضَ لِيَفْتَحَ الغَلْقَ."
  examples:
    per_lemma:
      - lemma: "لِسَان الْمِفْتَاح"
        examples:
          - text: "أَدْخَلَ لِسَانَ الْمِفْتَاحِ فِي الثَّقْبِ بِحَذَرٍ لِتَحْرِيرِ القُفْلِ."
            type: usage
      - lemma: "أَسْنَان الْمِفْتَاح"
        examples:
          - text: "تَتَطَابَقُ أَسْنَانُ الْمِفْتَاحِ مَعَ نُتُوءَاتِ القُفْلِ الدَّاخِلِيَّةِ."
            type: usage
      - lemma: "سِنّ الْمِفْتَاح"
        examples:
          - text: "انْكَسَرَ سِنُّ الْمِفْتَاحِ دَاخِلَ الأُسْطُوَانَةِ مِمَّا أَدَّى إِلَى تَعَطُّلِ القُفْلِ."
            type: usage
      - lemma: "رِيشَة الْمِفْتَاح"
        examples:
          - text: "تَمْتَازُ الْمَفَاتِيحُ القَدِيمَةُ بِرِيشَةٍ عَرِيضَةٍ تَرْفَعُ رِيَشَ القُفْلِ الفُولاذِيَّةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "انْكَسَرَ سِنُّ الْمِفْتَاحِ دَاخِلَ الأُسْطُوَانَةِ مِمَّا أَدَّى إِلَى تَعَطُّلِ القُفْلِ."

