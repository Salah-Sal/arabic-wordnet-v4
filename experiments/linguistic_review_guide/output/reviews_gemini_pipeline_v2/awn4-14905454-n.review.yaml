stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دقيق علمياً لكنه يفتقر إلى الأسلوب المعجمي العربي الرصين."
    observations: "المجموعة تغطي مادة الزجاج (Glass)، وهي مادة تتميز لغوياً بالشفافية والصلابة والهشاشة، وعلمياً بالبنية الذرية العشوائية (Amorphous). اللفظ 'زجاج' هو المصطلح الأصيل والشامل، وهناك مرادفات فصيحة وتراثية مثل 'بلور' و'مهاة' تصف الزجاج الصافي أو النقي."
  blind_candidates:
    - lemma: "زُجَاج"
      generation_method: ishtiqaq
      justification: "الاسم الأصيل للمادة، مشتق من جذر 'زجج' الذي يدل على الدقة والصفاء."
    - lemma: "بِلَّوْر"
      generation_method: taarib
      justification: "لفظ معرب قديم يُطلق على الزجاج النقي والشفاف."
    - lemma: "مَهَاة"
      generation_method: majaz
      justification: "إحياء لفظي تراثي، يُطلق على البلور والزجاج الصافي لشدة بياضه وصفائه كالماء."
    - lemma: "زُجَاجِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي يُستخدم في السياقات التقنية للدلالة على المادة أو خاصية المادة."

stage2_evidence:
  per_lemma:
    - lemma: "زُجَاج"
      confirm:
        - text: "«جوهرٌ صلب سهل الكسر، شفاف، يُصنع من الرمل والقِلْي»"
          source: "المعجم الوسيط"
        - text: "«مادة قصيفة شفافة غالبا»"
          source: "معجم المصطلحات الطبية (عرب تيرم)"
    - lemma: "بِلَّوْر"
      confirm:
        - text: "«جوهر أبيض شفاف... وهو نوع من الزجاج النقي»"
          source: "المعجم الكبير"
        - text: "«حجر أبيض شفاف ونوع من الزجاج»"
          source: "المعجم الوسيط"
      expands:
        - text: "«مادة غير عضوية متجانسة بتركيب كيميائي واضح... بهيكل هندسي منتظم»"
          source: "مسرد المناخ والبيئة (عرب تيرم)"
          addition: "يوضح الفرق العلمي بين البلور (بنية منتظمة) والزجاج (بنية غير منتظمة)."
    - lemma: "مَهَاة"
      confirm:
        - text: "«المهاة: الحجارة البيض التي تبرق، وهي البلور»"
          source: "لسان العرب"
        - text: "«المها: البلور، وكل شيء صفي فهو ممهى تشبيها به»"
          source: "مقاييس اللغة"
    - lemma: "زُجَاجِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "زجاج"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والأصيل المطابق للتعريف العلمي واللغوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زُجَاج"
    - lemma: "بِلَّوْر"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف لغوي مشهور للزجاج الصافي، وإن اختلف عنه علمياً في البنية الذرية، إلا أنه مقبول في المعاجم العربية كنوع من الزجاج."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بِلَّوْر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَهَاة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي فصيح ومثبت في المعاجم (مقاييس اللغة ولسان العرب) كاسم للبلور والزجاج الصافي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَهَاة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "مادة صلبة شفافة وهشة ذات بنية ذرية غير منتظمة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ذو صياغة تقنية مترجمة، والأفضل صياغته بأسلوب معجمي يجمع بين الوصف الفيزيائي والمكونات المادية."
    authored:
      - type: terminological
        text: "جَوْهَرٌ صَلْبٌ شَفَّافٌ هَشٌّ، يُصْنَعُ غَالِبًا مِنَ الرَّمْلِ وَالقِلْيِ، وَتَتَمَيَّزُ بِنْيَتُهُ الذَّرِّيَّةُ بِعَدَمِ الانْتِظَامِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "زُجَاج"
        examples:
          - text: "يُستخدم الزُّجاج في صناعة النوافذ والعدسات لقدرته العالية على تمرير الضوء."
            type: usage
      - lemma: "بِلَّوْر"
        examples:
          - text: "تتوهج الثريات المصنوعة من البِلَّوْر الصافي فتعكس أنواراً خلابة."
            type: usage
      - lemma: "مَهَاة"
        examples:
          - text: "وتبسم عن مَهًا شَبِمٍ غَرِيٍّ ** إذا تُعطي المُقَبِّلَ يستزيدُ"
            type: poetry
            source: "الأعشى"
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "جَوْهَرٌ صَلْبٌ شَفَّافٌ هَشٌّ، يُصْنَعُ غَالِبًا مِنَ الرَّمْلِ وَالقِلْيِ، وَتَتَمَيَّزُ بِنْيَتُهُ الذَّرِّيَّةُ بِعَدَمِ الانْتِظَامِ."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "صناعة الزجاج من الحرف القديمة التي برع فيها العرب."}

stage5_enrichment:
  per_entry:
    - lemma: "زُجَاج"
      entry_id: "{auto}"
      root: "زجج"
      maqayis_quote: "«الزَّاءُ وَالْجِيمُ أَصْلٌ يَدُلُّ عَلَى رِقَّةٍ فِي شَيْءٍ... وَالزَّجَجُ: دِقَّةُ الْحَاجِبَيْنِ وَحُسْنُهُمَا.»"
    - lemma: "بِلَّوْر"
      entry_id: "{auto}"
      root: "بلر"
      maqayis_quote: "«(لفظ معرب) البلور: حجر أبيض شفاف ونوع من الزجاج.»"
    - lemma: "مَهَاة"
      entry_id: "{auto}"
      root: "مهو"
      maqayis_quote: "«الْمِيمُ وَالْهَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِمْهَالٍ وَإِرْخَاءٍ وَسُهُولَةٍ فِي الشَّيْءِ... وَالْمَهَا: جَمْعُ الْمَهَاةِ، وَهِيَ الْبِلَّوْرَةُ ; سُمِّيَتْ بِذَلِكَ لِصَفَائِهَا كَأَنَّهَا مَاءٌ.»"
  per_sense:
    - lemma: "زُجَاج"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشامل للمادة بمختلف أنواعها واستخداماتها الصناعية."
      mwe: false
    - lemma: "بِلَّوْر"
      sense_id: "{auto}"
      nuance: "يُطلق على الزجاج عالي النقاوة والشفافية، ويُستخدم غالباً في أدوات الزينة والتحف."
      mwe: false
    - lemma: "مَهَاة"
      sense_id: "{auto}"
      nuance: "لفظ أدبي وتراثي يُستخدم في سياق الوصف والتشبيه بالصفاء والبياض."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"زجج","maqayis":"«الزَّاءُ وَالْجِيمُ أَصْلٌ يَدُلُّ عَلَى رِقَّةٍ فِي شَيْءٍ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"بلر","maqayis":"«(معرب) البلور: حجر أبيض شفاف ونوع من الزجاج.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"مهو","maqayis":"«الْمِيمُ وَالْهَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ... وَالْمَهَا: جَمْعُ الْمَهَاةِ، وَهِيَ الْبِلَّوْرَةُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ العام والشامل للمادة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
