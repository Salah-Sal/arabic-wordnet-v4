stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (سدوم) هي اسم علم أعجمي لمدينة تاريخية، واستخدامها كاسم جنس للدلالة على أي بؤرة فساد هو استخدام مجازي. يفضل إضافة مصطلحات عربية أصيلة ومعاصرة تعبر عن المفهوم بشكل مباشر."
    observations: "المفهوم يشير إلى مكان يتسم بانتشار الرذيلة والفساد الأخلاقي. في التراث العربي يستخدم لفظ (ماخور)، وفي التعبير المعاصر تستخدم تراكيب مثل (بؤرة فساد)."
  blind_candidates:
    - lemma: "مَاخُور"
      generation_method: majaz
      justification: "لفظ عربي فصيح يدل على بيت الريبة ومجمع أهل الفسق والفساد، وهو ما ينطبق بدقة على مفهوم المجموعة."
    - lemma: "بُؤْرَةُ فَسَادٍ"
      generation_method: tarkib
      justification: "تركيب إضافي معاصر وشائع الاستخدام للتعبير عن المكان الذي يتركز فيه الفساد وينتشر منه."
    - lemma: "مَرْكَزُ رَذِيلَةٍ"
      generation_method: tarkib
      justification: "تركيب وصفي مباشر يعبر عن موقع يتسم بالرذيلة."
    - lemma: "مَفْسَدَة"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (فسد) على وزن مَفْعَلَة، ويدل على مظنة الفساد ومكانه."

stage2_evidence:
  per_lemma:
    - lemma: "سَدُوم"
      confirm:
        - text: "«سَدوم: «أ» مدينة فلسطينيّة جاء في «العهد القديم» أن الله دمّرها لانغماسها في الرذيلة والفساد. «ب» بؤرة رذيلة وفساد.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مدينةٌ من مدائن قوم لوطٍ, سُمِّيَت باسم قاضيها, أو مَلِكها سَدُوم»"
          source: "المعجم الكبير"
    - lemma: "مَاخُور"
      confirm:
        - text: "«بيتُ الرِّيبة مَجْمَعُ أهل الفسق والفساد»"
          source: "المعجم الوسيط"
    - lemma: "بُؤْرَةُ فَسَادٍ"
      confirm:
        - text: "ورد استخدامه في المورد الحديث في تعريف سدوم: «بؤرة رذيلة وفساد.» وهو تعبير شائع."
          source: "المورد الحديث (2008)"
    - lemma: "مَرْكَزُ رَذِيلَةٍ"
      evidence_status: no_material_found
    - lemma: "مَفْسَدَة"
      contradicts:
        - text: "«الضرر. يقال: هذا الأمر مفْسَدَةٌ لكذا: فيه فسادَه ما يؤدّى إلى الفساد من لهو ولعب ونحوهما»"
          source: "المعجم الوسيط"
          conflict: "المفسدة تعني السبب المؤدي للفساد أو الضرر نفسه، ولا تدل عادة على المكان الجغرافي (بؤرة الفساد)."

stage3_analysis:
  per_lemma:
    - lemma: "سَدُوم"
      decision: confirmed
      decision_reason: "كلمة مستخدمة مجازياً في العربية (كما في الإنجليزية) للدلالة على بؤرة الرذيلة، وقد أثبت معجم المورد هذا الاستخدام صراحةً بمعناه المجازي (بؤرة رذيلة وفساد)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَدُوم"
    - lemma: "مَاخُور"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ فصيح ودقيق جداً في الدلالة على المكان الذي يجمع أهل الفسق والفساد، ويتطابق تماماً مع دلالة المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَاخُور", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بُؤْرَةُ فَسَادٍ"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب إضافي معاصر وشائع الاستخدام للتعبير عن النقطة المركزية للرذيلة والفساد، ويغطي المعنى المقصود بوضوح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "بُؤْرَةُ فَسَادٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَرْكَزُ رَذِيلَةٍ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي صحيح ولكنه أقل شيوعاً واصطلاحية من (بؤرة فساد) و(ماخور)، ولا داعي لإدراجه."
    - lemma: "مَفْسَدَة"
      source: stage1
      decision: removed
      decision_reason: "المفسدة تدل على السبب المؤدي للفساد أو الفعل المضر نفسه، ولا تدل على المكان."

stage4_content:
  definition:
    current: "أي موقع معروف بالرذيلة والفساد"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح، ويشمل المعنى المجازي والاصطلاحي بدقة."
  examples:
    per_lemma:
      - lemma: "سَدُوم"
        examples:
          - text: "تحولت تلك المدينة إلى سَدُومَ جديدة بسبب انتشار الجريمة والانحلال."
            type: usage
      - lemma: "مَاخُور"
        examples:
          - text: "داهمت الشرطة مَاخُوراً في أطراف المدينة يستغله المفسدون."
            type: usage
      - lemma: "بُؤْرَةُ فَسَادٍ"
        examples:
          - text: "تسعى السلطات لتطهير الأحياء العشوائية من كل بُؤْرَةِ فَسَادٍ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "داهمت الشرطة مَاخُوراً في أطراف المدينة يستغله المفسدون."}

stage5_enrichment:
  per_entry:
    - lemma: "سَدُوم"
      entry_id: "{auto}"
      root: "سدم"
      maqayis_quote: "«السِّينُ وَالدَّالُ وَالْمِيمُ أَصْلٌ فِي شَيْءٍ لَا يُهْتَدَى لِوَجْهِهِ...»"
    - lemma: "مَاخُور"
      entry_id: "{auto}"
      root: "مخر"
      maqayis_quote: "«الْمِيمُ وَالْخَاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى شَقٍّ وَفَتْحٍ...»"
