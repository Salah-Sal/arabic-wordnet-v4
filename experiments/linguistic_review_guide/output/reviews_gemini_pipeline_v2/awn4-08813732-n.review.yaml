          maqayis_quote: "«الْفَاءُ وَالسِّينُ وَالدَّالُ كَلِمَةٌ وَاحِدَةٌ، فَسَدَ الشَّيْءُ يَفْسُدُ فَسَادًا وَفُسُودًا...»"
