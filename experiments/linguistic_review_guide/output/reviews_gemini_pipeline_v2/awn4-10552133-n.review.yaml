stage1_review:
  assessment:
    concerns:
      - "عدم وجود تشكيل كامل للمدالات الموجودة."
      - "التعريف الحالي جيد ولكنه يمكن أن يكون أدق بصياغة عربية طبيعية كاستخدام 'يصحو' أو 'يقوم' بدلاً من الاكتفاء بـ 'ينهض'."
    observations: "المجموعة الترادفية تعبر عن مفهوم (riser) بالإنجليزية، وهو الشخص الذي يستيقظ ويقوم من نومه. تعتمد اللغة العربية في التعبير عن هذا المعنى على اسم الفاعل من أفعال الاستيقاظ والنهوض مثل (مستيقظ) و(ناهض). الجذور الأنسب لتوليد هذه المدالات هي (يقظ) و(نهض)."
  blind_candidates:
    - lemma: "مُسْتَيْقِظ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل استيقظ، يدل على الشخص الذي يصحو من نومه."
    - lemma: "نَاهِض"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل نهض، يدل على الشخص الذي يقوم من فراشه أو مضجعه."
    - lemma: "هَابّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل هب، يستخدم للتعبير عن الشخص الذي يستيقظ بنشاط كقولنا (هب من نومه)."
    - lemma: "قَائِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل قام، بمعنى انتصب وقام من مضجعه إثر نوم."

stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَيْقِظ"
      confirm:
        - text: "(1) المستيقظ من النوم an early riser"
          source: "المورد الحديث (2008)"
    - lemma: "نَاهِض"
      confirm:
        - text: "الناهض: الجاد في الأمر، المشمر له."
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "(الناهض) ... وَيُقَال عَامل ناهض مَاض فِي عمله بعزيمة صَادِقَة وشباب ناهض يقظ مهتم بِالْقيامِ بواجباته"
          source: "المعجم الوسيط"
        - text: "(نَهَضَ) النُّونُ وَالْهَاءُ وَالضَّادُ أَصْلٌ يَدُلُّ عَلَى حَرَكَةٍ فِي عُلُوٍّ. وَنَهَضَ مِنْ مَكَانِهِ: قَامَ."
          source: "مقاييس اللغة"
    - lemma: "هَابّ"
      confirm:
        - text: "وَهَبَّ النَّائِمُ يَهُبُّ هَبَّا."
          source: "مقاييس اللغة"
    - lemma: "قَائِم"
      contradicts:
        - text: "(الْقَائِم) قَائِم السَّيْف مقبضه ودينار قَائِم سَوَاء لَا يزِيد على أصل وَزنه وَلَا ينقص وقائم المَاء بِنَاء مُرْتَفع يتوزع مِنْهُ المَاء"
          source: "المعجم الوسيط"
          conflict: "يدل على معانٍ متعددة كالعمود والراتب والمنتصب، ولا يختص بالاستيقاظ من النوم في الاستعمال المفرد."

stage3_analysis:
  per_lemma:
    - lemma: "مُسْتَيْقِظ"
      decision: confirmed
      decision_reason: "اسم فاعل دقيق وشائع التداول للتعبير عن الشخص الذي يصحو من نومه، ويؤكده الاستعمال في المعاجم ثنائية اللغة لترجمة المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَيْقِظ"
    - lemma: "نَاهِض"
      decision: confirmed
      decision_reason: "اسم فاعل من نهض، يعبر بوضوح عن الحركة الجسدية المصاحبة للاستيقاظ والقيام من الفراش، وهو دقيق في سياق المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَاهِض"
    - lemma: "هَابّ"
      source: stage1
      decision: removed
      decision_reason: "رغم صحته في السياق الفعلي (هب من نومه)، إلا أنه لا يستقل كاسم أو مصطلح شائع للتعبير عن المستيقظ، ويدل مفرداً على معانٍ أخرى كهبوب الرياح."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "قَائِم"
      source: stage1
      decision: removed
      decision_reason: "مصطلح شديد العمومية، ويقصد به المنتصب أو الثابت، ولا ينحصر معناه في الاستيقاظ من الفراش عند استخدامه مفرداً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

