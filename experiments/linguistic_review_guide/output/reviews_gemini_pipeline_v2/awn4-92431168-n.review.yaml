      decision_reason: "المصطلح الأصيل والأكثر دقة لوصف الرواسب والمخلفات المتبقية بعد التصفية في اللغة العربية الكلاسيكية والمعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "ثُفْلُ الشَّعِيرِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-92431168-n"}
    - lemma: "دِرْدِيُّ الجِعَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تخصصي دقيق جداً يجمع بين 'الدردي' (الرواسب السائلة) و'الجعة' (المشروب المعني)، وهو فصيح وتراثي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "دِرْدِيُّ الجِعَةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-92431168-n"}

stage4_content:
  definition:
    current: "بقايا الشعير والحبوب التي تبقى في وعاء الهرش بعد عملية الهرش والتصفية"
    assessment:
      decision: revise
      reason: "كلمة 'الهرش' غير دقيقة تقنياً وهي على الأرجح تصحيف لـ 'الهرس' (Mashing)، كما يحتاج التعريف لبيان الغرض الصناعي (صناعة الجعة)."
    authored:
      - type: terminological
        text: "بقايا الشعير والحبوب التي تتبقى بعد عملية الهرس والتصفية لاستخلاص المادة السكرية في صناعة الجعة، وتُستخدم عادةً علفاً للحيوانات."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-92431168-n"
          definition_index: 0
          text: "بقايا الشعير والحبوب التي تتبقى بعد عملية الهرس والتصفية لاستخلاص المادة السكرية في صناعة الجعة، وتُستخدم عادةً علفاً للحيوانات."
  examples:
    per_lemma:
      - lemma: "تُفْلُ الشَّعِيرِ"
        examples:
          - text: "يتجمع تفل الشعير في أحواض التصفية بعد انتهاء عملية غلي الحبوب."
            type: usage
      - lemma: "كُسْبُ الحُبُوبِ"
        examples:
          - text: "يُعد كسب الحبوب الناتج عن مصانع الجعة مكملاً غذائياً ممتازاً لتسمين العجول."
            type: usage
      - lemma: "ثُفْلُ الشَّعِيرِ"
        examples:
          - text: "يُصنف ثفل الشعير ضمن المخلفات الصناعية العضوية القابلة للتدوير."
            type: usage
      - lemma: "دِرْدِيُّ الجِعَةِ"
        examples:
          - text: "كانت المعاجم القديمة تصف دردي الجعة بأنه ما يتبقى في أسفل آنية التخمير."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-92431168-n", text: "يُستغل تفل الشعير المتبقي من صناعة الجعة في إنتاج الطاقة الحيوية."}

