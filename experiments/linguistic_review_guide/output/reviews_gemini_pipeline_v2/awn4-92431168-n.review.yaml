            new_lemma: "كُسْبُ الحُبُوبِ"
    - lemma: "حبوب البيرة المستهلكة"
      decision: removed
      decision_reason: "ترجمة حرفية ركيكة (Calque) من الإنجليزية 'spent brewer's grain'، ولا تعتبر وحدة معجمية فصيحة."
