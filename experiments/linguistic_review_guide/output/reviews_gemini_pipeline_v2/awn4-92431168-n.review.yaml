stage1_review:
  assessment:
    concerns:
      - "اللمة 'حبوب البيرة المستهلكة' تبدو ترجمة حرفية ركيكة للمصطلح الإنجليزي (Spent grain)، والمصطلح العربي الأصيل هو 'التفل' أو 'الثفل'."
      - "استخدام كلمة 'الهرش' في التعريف العربي غريب، والأرجح أنها تصحيف لكلمة 'الهرس' (Mashing) المستعملة تقنياً في صناعة المشروبات، أو أنها ترجمة صوتية مشوهة."
      - "اللمة 'كُسب الحبوب' تستخدم عادة لمخلفات استخراج الزيوت، لكنها مقبولة بالتوسع في مخلفات الحبوب عموماً."
    observations: "المجموعة تدور حول المخلفات الصلبة المتبقية من عملية نقع وهرس الحبوب (خاصة الشعير) في صناعة الجعة. المصطلحات العربية غنية بالألفاظ التي تصف البقايا والرسوبيات مثل 'الثفل' و'الدردي' و'الكسب'."
  blind_candidates:
    - lemma: "ثُفْلُ الشَّعِيرِ"
      generation_method: ishtiqaq
      justification: "الثفل هو ما رسب من كدر الشيء أو ما بقي بعد استخلاص عصارة المادة، وهو المصطلح الأدق دلالة وتراثية."
    - lemma: "دِرْدِيُّ الجِعَةِ"
      generation_method: tarkib
      justification: "الدردي هو رسوب الزيت والخل والخمر في أسفل الوعاء، والجعة هي شراب الشعير، فيكون المركب وصفاً دقيقاً للمادة."
    - lemma: "خُثَارَةُ الحُبُوبِ"
      generation_method: majaz
      justification: "الخثارة هي ما يبقى في أسفل القدر أو الوعاء من ثخن المادة، وتستخدم للمخلفات الرطبة."
    - lemma: "حُتَالَةُ الشَّعِيرِ"
      generation_method: ishtiqaq
      justification: "الحثالة هي ما رذل من الشيء وبقي بعد أخذ جيده، وتستعمل لمخلفات الحبوب."

stage2_evidence:
  per_lemma:
    - lemma: "تفل الشعير"
      confirm:
        - text: "«تفل: مخلفات ليفية تتخلف بعد عصر سيقان قصب السكر أو السرغوم لاستخلاص عصارتها»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
      expands:
        - text: "«التفل شبيه بالبزق... وتفل الشيء تغيرت رائحته»"
          source: "تاج العروس"
          addition: "تشير المعاجم التقنية الحديثة إلى استخدامه للمخلفات الليفية (bagasse) وهو ما ينطبق على قشور الشعير المتبقية."
    - lemma: "كُسب الحبوب"
      confirm:
        - text: "«الكسب بالضم: عصارة الدهن... وما يتبقى من بزور القطن والكتان والسمسم وغيرها بعد عصرها»"
          source: "المعجم الوسيط"
        - text: "«الذي يخرج من البر بعد التذرية مما ينبغي أن يدق: الكسب»"
          source: "المحيط في اللغة"
    - lemma: "ثُفْلُ الشَّعِيرِ"
      confirm:
        - text: "«الثفل: ما استقر تحت الشيء من كدورة. وكل ما استخرج عصيره وبقي هو»"
          source: "تاج العروس"
        - text: "«الثفل: ما يتبقى من المادة بعد عصيرها أو إغلائها (ثفل الشاي / القهوة)»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "دِرْدِيُّ الجِعَةِ"
      confirm:
        - text: "«دردي الزيت وغيره: ما يبقى في أسفل وعائه... الجعة: شراب يتخذ من الشعير يحمر حتى يسكر»"
          source: "تاج العروس / المعجم الكبير"
    - lemma: "حبوب البيرة المستهلكة"
      evidence_status: "no_material_found"

