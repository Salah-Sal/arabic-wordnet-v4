stage1_review:
  assessment:
    concerns:
      - اللمة الوحيدة الموجودة (تعميق) تعبر عن الجانب المتعدي للعملية (جعل الشيء أعمق)، بينما التعريف يشير إلى الجانب اللازم (أن يصبح الشيء أعمق).
    observations: "المفهوم يشمل الصيرورة (Becoming deep) والفعل (Making deep). اللمة الحالية صحيحة لكنها تحتاج إلى لمات متممة تعبر عن الجانب الذاتي للعملية (تأصل، تعمق) والجانب المعنوي (تجذير)."
  blind_candidates:
    - lemma: "تَعَمُّق"
      generation_method: ishtiqaq
      justification: "المصدر الطبيعي للفعل (تعمق) الذي يعني صار عميقاً، وهو يطابق التعريف تماماً."
    - lemma: "تَجْذِير"
      generation_method: majaz
      justification: "استعارة دلالية من (الجذر) للتعبير عن تعميق الأفكار أو المبادئ أو التأثير."
    - lemma: "تَجَذُّر"
      generation_method: majaz
      justification: "يعبر عن عملية صيرورة الشيء عميقاً وثابتاً كالجذور، وهو الجانب اللازم لعملية التجذير."
    - lemma: "اسْتِكْنَاه"
      generation_method: ishtiqaq
      justification: "يعبر عن التعمق المعنوي للوصول إلى كنه الشيء وحقيقته."

stage2_evidence:
  per_lemma:
    - lemma: "تَعْمِيق"
      confirm:
        - text: "عَمَّقَ النظر في الأمور تَعْمِيقاً"
          source: "تاج اللغة وصحاح العربية"
        - text: "عَمَّقَ: جعل الشيء عميقاً"
          source: "المعجم الوسيط"
        - text: "deepening"
          source: "المعجم الطبي الموحد"
    - lemma: "تَعَمُّق"
      confirm:
        - text: "تعمق في الأمر: دققه واستقصاه"
          source: "المعجم الوسيط"
        - text: "deepening of a depression (تعمق المنخفض الجوي)"
          source: "معجم مصطلحات الأرصاد الجوية"
    - lemma: "تَجْذِير"
      confirm:
        - text: "لابُدَّ من تجذير الأفكار قبل طرحها... المعنى: تأصيلها وتعميقها"
          source: "معجم الصواب اللغوي"
        - text: "rooting"
          source: "المكنز الزراعي"
    - lemma: "تَجَذُّر"
      evidence_status: "no_material_found"
    - lemma: "اسْتِكْنَاه"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَعْمِيق"
      decision: confirmed
      decision_reason: "اللمة الأساسية المعبرة عن فعل التشييد أو الإجراء الذي يجعل الشيء أعمق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْمِيق"
    - lemma: "تَعَمُّق"
      source: stage1
      decision: confirmed
      decision_reason: "يطابق التعريف (أن يصبح الشيء أعمق) بدقة في الجانبين المادي والمعنوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَعَمُّق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَجْذِير"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح شاع استخدامه في السياقات الفكرية والسياسية والاجتماعية للتعبير عن التعميق المعنوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَجْذِير", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَجَذُّر"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الجانب الذاتي أو التلقائي لعملية العمق والثبات، وهو ضروري لاكتمال الشبكة الدلالية للمفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَجَذُّر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عملية أن يصبح الشيء أعمق وأكثر عمقاً"
    assessment:
      decision: revise
      reason: "التعريف الحالي يركز فقط على الجانب اللازم (Becoming)، بينما اللمات تشمل الجانب المتعدي أيضاً. يجب توسيعه ليشمل الفعل والصيرورة."
    authored:
      - type: terminological
        text: "عملية الزيادة في العُمْق أو جَعْل الشيء أعمق وأكثر غَوْراً، سواء كان ذلك مادياً أو معنوياً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَعْمِيق"
        examples:
          - text: "تهدف الاتفاقية إلى تَعْمِيق التعاون الاقتصادي بين البلدين."
            type: usage
      - lemma: "تَعَمُّق"
        examples:
          - text: "أدى تَعَمُّق المنخفض الجوي إلى هطول أمطار غزيرة."
            type: usage
      - lemma: "تَجْذِير"
        examples:
          - text: "يعمل المركز على تَجْذِير قيم التسامح في المناهج التعليمية."
            type: usage
      - lemma: "تَجَذُّر"
        examples:
          - text: "أظهرت الدراسة تَجَذُّر العادات القديمة في الريف."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية الزيادة في العُمْق أو جَعْل الشيء أعمق وأكثر غَوْراً، سواء كان ذلك مادياً أو معنوياً."}

