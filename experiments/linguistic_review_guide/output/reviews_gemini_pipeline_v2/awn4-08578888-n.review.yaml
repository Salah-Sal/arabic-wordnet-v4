stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدو ترجمة حرفية (موقع في الجزء الشرقي من...)."
      - "افتقار اللمة (شرق) للتشكيل."
    observations: "اللمة (شرق) مستعملة بكثرة وصحيحة في هذا السياق، مثل قولنا (شرق المدينة) أو (شرق النهر)، للدلالة على الجزء الشرقي من كيان مكاني ما."
  blind_candidates:
    - lemma: "شَرْق"
      generation_method: ishtiqaq
      justification: "مصدر واسم جهة يشير إلى الجزء الشرقي."
    - lemma: "مَشْرِق"
      generation_method: ishtiqaq
      justification: "اسم مكان من (شرق) يطلق على الناحية الشرقية."
    - lemma: "جِهَة شَرْقِيَّة"
      generation_method: tarkib
      justification: "تعبير وصفي يشير للناحية المقصودة."
    - lemma: "قِسْم شَرْقِيّ"
      generation_method: tarkib
      justification: "تعبير وصفي."

stage2_evidence:
  per_lemma:
    - lemma: "شَرْق"
      confirm:
        - text: "«حيثُ تَشْرُقُ الشمسُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«جهة شروق الشمس»"
          source: "المعجم الوسيط"
    - lemma: "مَشْرِق"
      expands:
        - text: "«جهة شروق الشمس والبلاد الإسلامية في شرق الجزيرة العربية»"
          source: "المعجم الوسيط"
    - lemma: "جِهَة شَرْقِيَّة"
      evidence_status: "no_material_found"
    - lemma: "قِسْم شَرْقِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "شَرْق"
      decision: confirmed
      decision_reason: "اللمة صحيحة ومستعملة للدلالة على الجزء الذي يقع في جهة المشرق من أي كيان جغرافي كمدينة أو بلد (مثل: شرق المدينة، شرق النهر)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أكثر شيوعاً من (مشرق) في الدلالة على أجزاء مكانية محددة ضمن بلد أو مدينة، حيث يعبر عن موقع نسبي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَرْق"
    - lemma: "مَشْرِق"
      source: stage1
      decision: removed
      decision_reason: "يُستعمل (المشرق) أكثر للدلالة على الأقاليم الكبرى (كالشرق الأوسط أو العالم الإسلامي) أو على جهة الشروق المطلقة، بينما اللمة (شرق) أدق لتمثيل الجزء الشرقي من كيان مكاني كمدينة أو بلد."
    - lemma: "جِهَة شَرْقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حر وليس وحدة معجمية مسكوكة."
    - lemma: "قِسْم شَرْقِيّ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حر وليس وحدة معجمية مسكوكة."

stage4_content:
  definition:
    current: "موقع في الجزء الشرقي من بلد أو منطقة أو مدينة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مترجم حرفيا وركيك، يمكن صياغته بأسلوب معجمي أكثر سلاسة ودقة."
    authored:
      - type: terminological
        text: "جُزْءٌ أو مَوْقِعٌ يَقعُ فِي النَّاحِيَةِ الشَّرْقِيَّةِ مِنْ بَلَدٍ أو مَنْطِقَةٍ أو مَدِينَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "جُزْءٌ أو مَوْقِعٌ يَقعُ فِي النَّاحِيَةِ الشَّرْقِيَّةِ مِنْ بَلَدٍ أو مَنْطِقَةٍ أو مَدِينَةٍ."
  examples:
    per_lemma:
      - lemma: "شَرْق"
        examples:
          - text: "يَقْطُنُ فِي شَرْقِ المَدِينَةِ حَيْثُ تَتَوَفَّرُ الخَدَمَاتُ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يَقْطُنُ فِي شَرْقِ المَدِينَةِ حَيْثُ تَتَوَفَّرُ الخَدَمَاتُ."

stage5_enrichment:
  per_entry:
    - lemma: "شَرْق"
      entry_id: "{auto}"
      root: "شرق"
      maqayis_quote: "«الشِّينُ وَالرَّاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِضَاءَةٍ وَفَتْحٍ. مِنْ ذَلِكَ شَرَقَتِ الشَّمْسُ، إِذَا طَلَعَتْ.»"
  per_sense:
    - lemma: "شَرْق"
      sense_id: "{auto}"
      nuance: "أكثر شيوعاً من (مشرق) في الدلالة على أجزاء مكانية محددة ضمن بلد أو مدينة، حيث يعبر عن موقع نسبي."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"شرق","maqayis":"«الشِّينُ وَالرَّاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِضَاءَةٍ وَفَتْحٍ. مِنْ ذَلِكَ شَرَقَتِ الشَّمْسُ، إِذَا طَلَعَتْ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"أكثر شيوعاً من (مشرق) في الدلالة على أجزاء مكانية محددة ضمن بلد أو مدينة، حيث يعبر عن موقع نسبي.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95