            type: usage
      - lemma: "حَلَّالٌ"
        examples:
          - text: "يُعْرَفُ فِي القَرْيَةِ بِأَنَّهُ حَلَّالُ المَشَاكِلِ وَالعُقَدِ الصَّعْبَةِ."
