stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'حَالّ' قد تلتبس بمعنى الساكن (المقيم) أو الحالة الراهنة."
      - "اللمة الموجودة 'فَاكّ' قد تأتي بمعنى الهرم أو الأحمق في بعض المعاجم الكلاسيكية (الفاكّ)، مما يستوجب الحذر في استخدامها منفردة."
      - "غياب اللفظة الأكثر شيوعاً لوصف من يفتح الأشياء وهي 'فَاتِح'."
    observations: "الجذور الثلاثة (ف ك ك)، (ح ل ل)، (ف ت ح) هي الأصول اللغوية المباشرة للتعبير عن معاني الفك والحل والفتح. صيغة اسم الفاعل 'فاعل' صحيحة لغوياً، لكن صيغة المبالغة 'فعّال' قد تكون أكثر دلالة على الشخص الذي يحترف هذا الفعل أو يمارسه بكثرة."
  blind_candidates:
    - lemma: "فَاكّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (فكّ) بمعنى فصل أجزاء الشيء أو حرره."
    - lemma: "حَالّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (حلّ) بمعنى نقض العقدة أو أزال الرباط."
    - lemma: "فَاتِح"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (فتح) وهو المعنى المقابل للإغلاق."
    - lemma: "فَاكُّ العُقَدِ"
      generation_method: tarkib
      justification: "تعبير اصطلاحي يصف الشخص الذي يقوم بفك الارتباطات المعقدة."

stage2_evidence:
  per_lemma:
    - lemma: "فَاكّ"
      confirm:
        - text: "«فكَّ الشَّيءَ يفُكُّه فَكّاً فانْفَكَّ فصله... فهو فاكُّ»"
          source: "لسان العرب"
      contradicts:
        - text: "«الفاكُّ: الهَرِمُ من الإبل والناس... الفكة أيضاً: الحُمْق مع استرخاء. ورجل فاكٌّ: أَحمق بالغ الحُمْق»"
          source: "لسان العرب"
          conflict: "اللفظ يستخدم في سياق الذم أو وصف الهرم، مما قد يجعله غير مناسب كاسم فاعل حيادي في بعض السياقات."
    - lemma: "حَالّ"
      confirm:
        - text: "«أصل الحل حل العقدة... وعن حل العقدة استعير قولهم حل الشيء حلا»"
          source: "التوقيف على مهمات التعاريف"
      expands:
        - text: "«الحَالُّ المُرْتَحِلُ : الخاتِمُ الْمُفْتَتِحُ»"
          source: "المعجم الكبير"
          addition: "استخدام اللفظ في سياق القراءة (الختم والبدء) يشير إلى معنى الفتح والابتداء."
    - lemma: "فَاتِح"
      confirm:
        - text: "«فَاتِح من (فت ح) الغازي والبادئ والمهيئ للأمر»"
          source: "موسوعة السلطان قابوس"
        - text: "«فاتِح (ملامس فتح): هو مفتاح كهربائي يعمل عند تشغيله على فتح دائرة كهربائية»"
          source: "ArabTerm"
          addition: "يدعم استخدام اللفظ لوصف القائم بفعل الفتح."
    - lemma: "فَكَّاك"
      confirm:
        - text: "«فَكَّاك الرموز: الذي يحلها ويكتشف معناها»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "حَلَّال"
      confirm:
        - text: "«أهل الحَلِّ والعَقْدِ : قادة المجتمع والأمة»"
          source: "المعجم الكبير"
          addition: "يشير إلى دور الشخص في اتخاذ القرار عبر (الحل) أي فك الأمور."

