stage1_review:
  assessment:
    concerns:
      - "كلمة 'كسر' مشتركة لفظياً (Polysemous) بين تحطيم الشيء، والكسر العظمي، والكسر الرياضي، والكسر بمعنى الجزء الصغير (Fraction). ينبغي توضيح الدلالة المقصودة من خلال التعريف."
      - "كلمة 'جزء' عامة جداً وتغطي معاني واسعة لـ (Part)، بينما (Fraction) تدل على جزء يسير أو نسبة من الكل."
    observations: "المفهوم يركز على الجزء الصغير الذي يشكل نسبة من كل متكامل. اللمات الحالية 'جزء' و'كسر' تعبران عن هذا المفهوم بشكل مقبول في السياقات المعاصرة، حيث أصبح التعبير 'كسر من...' (مثل كسر من الثانية) شائعاً كترجمة اقتراضية أو توسيع دلالي مقبول لمفهوم (Fraction)."
  blind_candidates:
    - lemma: "قِطْعَة"
      generation_method: ishtiqaq
      justification: "لأنها تدل على ما يُقتطع من شيء كامل ليمثل جزءاً منه."
    - lemma: "شَطْر"
      generation_method: ishtiqaq
      justification: "لأنه يدل على القسم أو الجزء من الشيء، وإن كان يغلب عليه معنى النصف."
    - lemma: "نَزْر"
      generation_method: ishtiqaq
      justification: "للدلالة على الجزء القليل أو اليسير من الشيء، وهو يقابل مفهوم (small part)."
    - lemma: "كِسْرَة"
      generation_method: ishtiqaq
      justification: "لما يُكسر من الشيء ليصبح جزءاً صغيراً منه، ككسرة الخبز وغيرها."

stage2_evidence:
  per_lemma:
    - lemma: "جزء"
      confirm:
        - text: "القطعةُ من الشىء, وما يتركب الشىء منه ومن غيره النَّصيب"
          source: "المعجم الوسيط"
        - text: "جُزْءُ الشيء: ما يتقوّم به جملته، كأجزاء السفينة، وأجزاء البيت، وأجزاء الجملة من الحساب"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
    - lemma: "كسر"
      confirm:
        - text: "الكِسْر النَّزْر القليل (من الحساب) : جزء غير تام من أجزاء الواحد : كالنِّصفِ والخُمُس والتُّسع والعُشْر"
          source: "المعجم الوسيط"
        - text: "الْكسر والنزر الْقَلِيل و (من الْحساب) جُزْء غير تَامّ من أَجزَاء الْوَاحِد كالنصف وَالْخمس وَالتسع وَالْعشر"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "قطعة"
      confirm:
        - text: "طائفة من كل شيء"
          source: "كتاب العين"
    - lemma: "شطر"
      contradicts:
        - text: "نِصْفُ الشيءِ. الجهة والناحية. البُعد."
          source: "المعجم الكبير"
          conflict: "يدل على النصف بالتحديد في أغلب السياقات، وليس على مطلق الجزء الصغير."
    - lemma: "نزر"
      contradicts:
        - text: "لا توجد أدلة مباشرة"
          source: "قاعدة البيانات"
          conflict: "يعبر عن الكمية القليلة بشكل عام وليس بالضرورة جزءاً يكمل كلاً مجزأً."
    - lemma: "كسرة"
      contradicts:
        - text: "لا توجد أدلة مباشرة"
          source: "قاعدة البيانات"
          conflict: "تستخدم غالباً للأشياء المادية الملموسة (ككسرة الخبز) ولا تعبر عن المفهوم المجرد للكسر."

stage3_analysis:
  per_lemma:
    - lemma: "جزء"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر بدقة عن مفهوم القطعة أو القسم من شيء كامل، وهو مطابق تماماً للمفهوم المراد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُزْء"

    - lemma: "كسر"
      decision: confirmed
      decision_reason: "مصطلح صحيح فصيح يعبر عن الجزء الصغير أو النسبة غير التامة من الواحد، وهو المعادل الدقيق لـ Fraction في الرياضيات والاستخدام العام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَسْر"

    - lemma: "قِطْعَة"
      source: stage1
      decision: removed
      decision_reason: "مرادف عام جداً، ويكفي 'جُزْء' و'كَسْر' لتغطية المفهوم بدقة دون إحداث حشو في المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "شَطْر"
      source: stage1
      decision: removed
      decision_reason: "يُستخدم غالباً للدلالة على النصف (Half) ولا يعبر بدقة عن الجزء الصغير كنسبة ضئيلة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "نَزْر"
      source: stage1
      decision: removed
      decision_reason: "يدل على القلة في الكمية، وليس بالضرورة على كونه جزءاً مكملاً لكل."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "كِسْرَة"
      source: stage1
      decision: removed
      decision_reason: "ترتبط دلالتها بالمحسوسات المادية كالخبز، ولا تناسب الاستخدام المجرد للنسبة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "جزء صغير أو عنصر يشكل قطعة من كل"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يبدو كترجمة حرفية، يمكن تحسين صياغته ليكون أكثر عربية ودقة لغوياً."
    authored:
      - type: linguistic
        text: "جُزْءٌ صَغِيرٌ أَوْ مِقْدَارٌ يَسِيرٌ يُشَكِّلُ قِطْعَةً مِنْ كُلٍّ مَجْمُوعٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "جُزْءٌ صَغِيرٌ أَوْ مِقْدَارٌ يَسِيرٌ يُشَكِّلُ قِطْعَةً مِنْ كُلٍّ مَجْمُوعٍ."

  examples:
    per_lemma:
      - lemma: "جُزْء"
        examples:
          - text: "أَنْجَزَ الفَرِيقُ جُزْءاً صَغِيراً مِنَ المَشْرُوعِ فِي اليَوْمِ الأَوَّلِ."
            type: usage
      - lemma: "كَسْر"
        examples:
          - text: "حَدَثَ الانْفِجَارُ فِي كَسْرٍ مِنَ الثَّانِيَةِ، مِمَّا أَذْهَلَ الحَاضِرِينَ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَنْجَزَ الفَرِيقُ جُزْءاً صَغِيراً مِنَ المَشْرُوعِ فِي اليَوْمِ الأَوَّلِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "حَدَثَ الانْفِجَارُ فِي كَسْرٍ مِنَ الثَّانِيَةِ، مِمَّا أَذْهَلَ الحَاضِرِينَ."

