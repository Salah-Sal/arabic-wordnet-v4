stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (مُحَافِظ عَلَى الْبَقَاء، مُهْتَمّ بِالْبَقَاء) عبارة عن تراكيب وصفية حرة غير مسكوكة معجمياً."
      - "غياب مصطلح مفرد يعبر بدقة عن مفهوم (Survivalist) في المعاجم المتوفرة."
    observations: "المفهوم في الثقافة الغربية (survivalist) يشير إلى شخص يمارس الاستعداد النشط (كالتخزين والتدريب) لضمان البقاء في حالات الكوارث والأزمات. في العربية، لا يوجد مصطلح تراثي دقيق لهذا المعنى الحادث، لكن يمكن استخدام المصدر الصناعي أو النسبة (بَقَائِيّ) كمصطلح معاصر قياسي، وهو مستخدم في الأدبيات الحديثة لترجمة هذا المفهوم."
  blind_candidates:
    - lemma: "بَقَائِيّ"
      generation_method: ishtiqaq
      justification: "صيغة نسبة إلى (بقاء) على غرار (رأسمالي) أو (بيئي)، تعبر عن الشخص الذي يتخذ البقاء (survivalism) منهجاً واهتماماً أساسياً."
    - lemma: "مُسْتَبْقٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (استبقى)، أي طلب البقاء، وهو مناسب لمن يسعى لضمان النجاة والبقاء."
    - lemma: "مُتَأَهِّبٌ لِلْبَقَاءِ"
      generation_method: tarkib
      justification: "مركب إضافي/وصفي يشير إلى الاستعداد المتواصل لضمان البقاء في حالات الكوارث."
    - lemma: "نَاجٍ مُحْتَمَل"
      generation_method: tarkib
      justification: "ترجمة تقريبية وتعبير وصفي لمفهوم الشخص الذي يُعد نفسه ليكون من الناجين."

stage2_evidence:
  per_lemma:
    - lemma: "مُحَافِظ عَلَى الْبَقَاء"
      evidence_status: no_material_found
    - lemma: "مُهْتَمّ بِالْبَقَاء"
      evidence_status: no_material_found
    - lemma: "بَقَائِيّ"
      evidence_status: no_material_found
    - lemma: "مُسْتَبْقٍ"
      evidence_status: no_material_found
    - lemma: "مُتَأَهِّبٌ لِلْبَقَاءِ"
      evidence_status: no_material_found
    - lemma: "نَاجٍ مُحْتَمَل"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "مُحَافِظ عَلَى الْبَقَاء"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً مسكوكاً ثابتاً، ويمكن استبدال مكوناتها بمترادفات أخرى (مثل: حريص على البقاء، ساعٍ للبقاء)."
      evidence_assessment:
        case: no_material
    - lemma: "مُهْتَمّ بِالْبَقَاء"
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك، ولا يصح اعتماده كمدخل معجمي مستقل يمثل الوحدة الدلالية."
      evidence_assessment:
        case: no_material
    - lemma: "بَقَائِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح اشتقاقي حديث (نسبة إلى البقاء) يتناسب مع الأنماط الصرفية المعاصرة في نقل المفاهيم الفكرية والعملية المشابهة، ويفي بالدلالة على من يتبنى الاستعداد لضمان النجاة والبقاء."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "بَقَائِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مُسْتَبْقٍ"
      source: stage1
      decision: removed
      decision_reason: "استخدام الفعل (استبقى) يدل غالباً على ترك الشيء على حاله أو المحافظة على الغير، ولا يعكس بوضوح وتخصيص مفهوم (survivalist) المعاصر."
      evidence_assessment:
        case: no_material
    - lemma: "مُتَأَهِّبٌ لِلْبَقَاءِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر."
      evidence_assessment:
        case: no_material
    - lemma: "نَاجٍ مُحْتَمَل"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي غير دقيق ولا يحمل دلالة الاستعداد والتحضير التي تميز المفهوم."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "شخص يحاول ضمان بقائه الشخصي أو بقاء مجموعته أو أمته"
    assessment:
      decision: revise
      reason: "التعريف الحالي يفتقر للغة المعجمية الدقيقة ولإبراز الجانب العملي للمفهوم (الاستعداد واتخاذ التدابير)."
    authored:
      - type: terminological
        text: "شخص يتّخذ التدابير ويُعدّ العُدّة لضمان بقائه الشّخصيّ أو بقاء مجموعته عند وقوع الكوارث أو الأزمات."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخص يتّخذ التدابير ويُعدّ العُدّة لضمان بقائه الشّخصيّ أو بقاء مجموعته عند وقوع الكوارث أو الأزمات."
  examples:
    per_lemma:
      - lemma: "بَقَائِيّ"
        examples:
          - text: "قام البقائيّ بتخزين المؤن وبناء ملجأ محصّن تحسّباً لأي كارثة محتملة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "قام البقائيّ بتخزين المؤن وبناء ملجأ محصّن تحسّباً لأي كارثة محتملة."

stage5_enrichment:
