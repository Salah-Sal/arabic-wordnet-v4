      maqayis_quote: "«الْبَاءُ وَالْقَافُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الدَّوَامُ... بَقِيَ الشَّيْءُ يَبْقَى بَقَاءً، وَهُوَ ضِدُّ الْفَنَاءِ.»"
  per_sense:
    - lemma: "بَقَائِيّ"
      sense_id: "{auto}"
      nuance: "مصطلح حديث يشير إلى الشخص الذي يتبنى الاستعداد للكوارث كنهج لضمان البقاء."
      mwe: false
  synset:
    cultural_fit: lexical_gap
  actions:
