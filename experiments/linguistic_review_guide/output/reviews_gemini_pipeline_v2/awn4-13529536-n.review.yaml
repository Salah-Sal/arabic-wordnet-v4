stage4_content:
  definition:
    current: "عملية تشارك في اللغة البشرية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتاج إلى تحديد طبيعة هذه العمليات (ذهنية، عضوية) لزيادة الدقة الاصطلاحية."
    authored:
      - type: terminological
        text: "سلسلةٌ متتابعة من التغيرات أو الأنشطة الذهنية أو العضوية التي تسهم في إنتاج اللغة أو فهمها أو تحليلها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "عَمَلِيَّة لُغَوِيَّة"
        examples:
          - text: "يُعدُّ استيعاب القواعد النحوية عملية لغوية معقدة تبدأ في سن مبكرة جداً."
            type: usage
      - lemma: "عَمَلِيَّة لِسَانِيَّة"
        examples:
          - text: "تحليل الخطاب المعاصر يتطلب فهم كل عملية لسانية تساهم في بناء الدلالة."
            type: usage
      - lemma: "سَيْرُورَة لُغَوِيَّة"
        examples:
          - text: "التغير الصوتي والدلالي للكلمات هو سيرورة لغوية تمتد عبر فترات زمنية طويلة."
            type: usage
      - lemma: "نَشَاط لُغَوِيّ"
        examples:
          - text: "يعتبر الحوار نشاطاً لغوياً اجتماعياً يهدف إلى تحقيق التواصل الفعال بين البشر."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13529536-n", definition_index: 0, text: "سلسلةٌ متتابعة من التغيرات أو الأنشطة الذهنية أو العضوية التي تسهم في إنتاج اللغة أو فهمها أو تحليلها."}

