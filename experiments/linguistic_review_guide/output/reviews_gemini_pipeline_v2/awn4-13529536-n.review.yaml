stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي فضفاض نوعاً ما ويفتقر للصبغة الاصطلاحية."
      - "نقص المترادفات الأكاديمية المتخصصة في المجال اللساني."
    observations: "المفهوم يشير إلى العمليات الحيوية والذهنية التي تكمن وراء استخدام اللغة. المصطلح الحالي 'عملية لغوية' دقيق ومباشر، ولكن يمكن إغناؤه بمصطلحات أكثر تخصصاً مثل 'عملية لسانية' و'سيرورة لغوية' لخدمة السياقات الأكاديمية."
  blind_candidates:
    - lemma: "عَمَلِيَّةٌ لُغَوِيَّةٌ"
      generation_method: tarkib
      justification: "ترجمة مباشرة ودقيقة للمصطلح الإنجليزي، وهي الصيغة الأكثر شيوعاً في الأدبيات العربية."
    - lemma: "عَمَلِيَّةٌ لِسَانِيَّةٌ"
      generation_method: tarkib
      justification: "استخدام 'لساني' بدلاً من 'لغوي' شائع جداً في الأبحاث اللسانية الحديثة المتأثرة بالمدرسة البنيوية وما بعدها."
    - lemma: "سَيْرُورَةٌ لُغَوِيَّةٌ"
      generation_method: tarkib
      justification: "كلمة 'سيرورة' تعبر بدقة عن الجانب الحركي والزمني للعملية (Processus)."
    - lemma: "نَشَاطٌ لُغَوِيٌّ"
      generation_method: tarkib
      justification: "يستخدم لوصف العمليات اللغوية من منظور أدائي وتواصلي (Linguistic activity)."

stage2_evidence:
  per_lemma:
    - lemma: "عَمَلِيَّة لُغَوِيَّة"
      confirm:
        - text: "«عملية لغوية تقوم بتجزيء الوحدات اللغوية إلى طبقات أو مقولات تكون خصائصها... متماثلة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«عملية تقسيم النص إلى وحدات صغيرة تُسمى وحدات لغوية.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
    - lemma: "عَمَلِيَّة لِسَانِيَّة"
      confirm:
        - text: "«عملية تطبيق نتائج لسانية على ظواهر لغوية مماثلة.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "سَيْرُورَة لُغَوِيَّة"
      evidence_status: "no_material_found"
    - lemma: "نَشَاط لُغَوِيّ"
      evidence_status: "no_material_found"

