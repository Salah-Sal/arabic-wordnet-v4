stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي بسيط جداً، وقد يختلط الفعل العارض بالصفة الملازمة."
      - "كلمة 'غماز' تشترك دلالياً مع معانٍ تقنية حديثة (مؤشر السيارة) ومعانٍ تشريحية (نقرة الخد)."
    observations: "المجموعة تدور حول الشخص الذي يقوم بفعل الغمز بالعين للإشارة. الجذر 'غمز' ثري بالدلالات المجازية التي تجمع بين الإشارة الحسية والغمز المعنوي (العيب)."
  blind_candidates:
    - lemma: "غَامِز"
      generation_method: ishtiqaq
      justification: "اسم الفاعل المباشر من الفعل غمز، وهو الوصف القياسي لمن يقوم بالفعل."
    - lemma: "غَمَّاز"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة تدل على من يكثر الغمز أو من صارت له عادة."
    - lemma: "غَمَّازَة"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة للمؤنث أو للمبالغة في الوصف، وإن كانت غلبت على 'النقرة' في الخد."
    - lemma: "غَمَّازُ العَيْنِ"
      generation_method: tarkib
      justification: "مركب إضافي لتحديد العضو المستخدم في الغمز بدقة."

stage2_evidence:
  per_lemma:
    - lemma: "غَامِز"
      confirm:
        - text: "«الغَامِز: المشير بعينه إلى الغير»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«غمزه بعينه/ غمز بعينه: أشار بها إليه... فهو غامز»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "غَمَّاز"
      confirm:
        - text: "«(الغماز) مُبَالغَة الغامز»"
          source: "المعجم الوسيط"
        - text: "«غَمَّاز: صيغة مبالغة من غمَزَ»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "غَمَّازَة"
      contradicts:
        - text: "«(الغمازة) الفتاة الْحَسْنَاء الغمز للأعضاء أَي كبسها بِالْيَدِ»"
          source: "المعجم الوسيط"
          conflict: "تدل في المعاجم القديمة على كبس الأعضاء باليد، وفي الحديث على نقرة الخد."
    - lemma: "غَمَّازُ العَيْنِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "غَامِز"
      decision: confirmed
      decision_reason: "هو المصطلح الأساسي والقياسي المتفق عليه في المعاجم القديمة والحديثة لوصف الفاعل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَامِز"
    - lemma: "غَمَّاز"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة مبالغة فصيحة وشائعة الاستخدام لوصف الشخص كثير الغمز، وهي مدعومة في المعاجم كمبالغة للغامز."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "غَمَّاز", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10803215-n"}
    - lemma: "غَمَّازَة"
      decision: removed
      decision_reason: "رغم أنها صيغة مبالغة، إلا أن الاستعمال اللغوي والاصطلاحي حصرها في 'نقرة الخد' أو 'آلة الغمز باليد' (مساج)، مما قد يسبب لبساً دلالياً."
    - lemma: "غَمَّازُ العَيْنِ"
      decision: removed
      decision_reason: "تعبير وصفي إضافي لا يرقى لمرتبة المصطلح المسكوك في وجود اللفظ المفرد 'غامز'."

stage4_content:
  definition:
    current: "شخص يغمز بعينه"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط للغاية، ويفضل استخدام صياغة معجمية توضح غرض الغمز (الإشارة)."
    authored:
      - type: terminological
        text: "مَنْ يُشيرُ بِعَيْنِهِ أَوْ حَاجِبِهِ تَنْبِيهًا أَوْ إِغْرَاءً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-10803215-n", definition_index: 0, text: "مَنْ يُشيرُ بِعَيْنِهِ أَوْ حَاجِبِهِ تَنْبِيهًا أَوْ إِغْرَاءً."}
  examples:
    per_lemma:
      - lemma: "غَامِز"
        examples:
          - text: "بَقِيَ الغَامِزُ يُلاحِقُ خَصْمَهُ بِنَظَراتٍ مَرِيبَةٍ."
            type: usage
      - lemma: "غَمَّاز"
        examples:
          - text: "لا تَعْتَمِدْ على كَلامِ ذَلِكَ الرَّجُلِ الغَمَّازِ، فَهُوَ كَثِيرُ المِزَاحِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "بَقِيَ الغَامِزُ يُلاحِقُ خَصْمَهُ بِنَظَراتٍ مَرِيبَةٍ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "لا تَعْتَمِدْ على كَلامِ ذَلِكَ الرَّجُلِ الغَمَّازِ، فَهُوَ كَثِيرُ المِزَاحِ."}

