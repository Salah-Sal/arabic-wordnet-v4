      entry_id: "{auto}"
      roots:
        - word: "مادة"
          root: "مدد"
          maqayis_quote: "«الْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ فِي طُولٍ، وَاتِّصَالِ شَيْءٍ بِشَيْءٍ فِي اسْتِطَالَةٍ.»"
        - word: "مسرطنة"
          root: "سرط"
          maqayis_quote: "«السِّينُ وَالرَّاءُ وَالطَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى غَيْبَةٍ فِي مَرٍّ وَذَهَابٍ. مِنْ ذَلِكَ: سَرَطْتُ الطَّعَامَ، إِذَا بَلَعْتَهُ.»"
