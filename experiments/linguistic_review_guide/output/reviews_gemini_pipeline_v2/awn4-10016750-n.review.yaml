    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"زيف","maqayis_quote":"«الزَّاءُ وَالْيَاءُ وَالْفَاءُ فِيهِ كَلَامٌ، وَمَا أَظُنُّ شَيْئًا مِنْهُ صَحِيحًا. يَقُولُونَ دِرْهَمٌ زَائِفٌ وَزَيْفٌ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُستخدم للتركيز على الجانب المعنوي أو التقييمي في تقليل قيمة الشيء أو قدره.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُستخدم للتركيز على الجانب المادي كالغش بإضافة معادن رخيصة للعملات أو التزوير الملموس.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
