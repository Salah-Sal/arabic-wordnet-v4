stage1_review:
  assessment:
    concerns:
      - "المصطلح (مُخَنْفِر) يدل غالباً على الشخير في النوم أو ذي الأنف الضخم، وقد يكون استخدامه للتنفس بصوت عالٍ في اليقظة ناتجاً عن اتساع دلالي حديث."
    observations: "تؤكد المعاجم الحديثة استخدام (خَنْفَرَ) و(تَخَنْفَرَ) بمعنى التنفس بصوت مسموع والشخير، مما يعزز ملاءمة (مُخَنْفِر) للتعبير عن المفهوم (snuffler)."
  blind_candidates:
    - lemma: "أَخَنّ"
      generation_method: ishtiqaq
      justification: "مشتق من (الخُنَّة)، وهي خروج الصوت من الأنف، للدلالة على من يتنفس أو يتكلم بصوت أنفي بسبب الانسداد."
    - lemma: "مُخَنْخِن"
      generation_method: ishtiqaq
      justification: "مشتق من (الخَنْخَنَة)، وهي عدم بيان الكلام أو إخراج الصوت من الأنف بشكل مزعج."
    - lemma: "مُشَخِّر"
      generation_method: majaz
      justification: "استعارة من الشخير أثناء النوم للدلالة على التنفس بصوت عالٍ في أي وقت."
    - lemma: "مَزْكُوم"
      generation_method: majaz
      justification: "إطلاق اسم المصاب بالزكام (الذي يسد أنفه بالمخاط) على مظهر التنفس بصوت عالٍ الملازم لتلك الحالة."

stage2_evidence:
  per_lemma:
    - lemma: "مُخَنْفِر"
      confirm:
        - text: "خنفرَ في يُخنفر، خَنفرةً، فهو مُخنفِر... خنفر النَّائمُ في نومه: شخَّر، غطَّ فيه."
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "خنفر: شخر، غَطّ... مُخَنْفر: أنافيّ، عظيم الأنف"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
    - lemma: "أَخَنّ"
      contradicts:
        - text: "أَخَنَّهُ: أَفْقَدَهُ عَقْلَه. فهو مَخْنُونٌ"
          source: "المعجم الكبير"
          conflict: "المعنى بعيد عن التنفس، ويفيد فقدان العقل أو الخلل في الكلام فقط."
    - lemma: "مُخَنْخِن"
      evidence_status: "no_material_found"
    - lemma: "مُشَخِّر"
      evidence_status: "no_material_found"
    - lemma: "مَزْكُوم"
      confirm:
        - text: "المصاب بالزكام وهو التهاب حاد بغشاء الأنف المخاطي."
          source: "موسوعة السلطان قابوس لأسماء العرب"

stage3_analysis:
  per_lemma:
    - lemma: "مُخَنْفِر"
      decision: confirmed
      decision_reason: "المعاجم الحديثة وتكملة دوزي توثق استخدام الفعل (خنفر) واسم الفاعل (مُخنفِر) للتعبير عن الشخير والغطيط، وهو ما يتطابق دلالياً مع التنفس بصوت عالٍ بسبب المخاط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَنْفِر"
    - lemma: "أَخَنّ"
      source: stage1
      decision: removed
      decision_reason: "الخُنَّة تتعلق بجرس الصوت في الكلام ولا تصف التنفس الصوتي العالي."
    - lemma: "مُخَنْخِن"
      source: stage1
      decision: removed
      decision_reason: "لا يوجد دليل معجمي موثق يربطها مباشرةً بالتنفس الصوتي الناتج عن الانسداد."
    - lemma: "مُشَخِّر"
      source: stage1
      decision: removed
      decision_reason: "الشخير يختص بالنوم، والمفهوم يركز على من يتنفس بصوت من أنفه المسدود مطلقاً."
    - lemma: "مَزْكُوم"
      source: stage1
      decision: removed
      decision_reason: "الزكام مرض، والمفهوم يبحث عن العَرَض (صوت التنفس)، فليس كل مزكوم يتنفس بصوت عالٍ بالضرورة."

stage4_content:
  definition:
    current: "شخص يتنفس بصوت عالٍ (بسبب انسداد الأنف بالمخاط)"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق ويشرح الآلية (التنفس بصوت عالٍ) والسبب (انسداد الأنف بالمخاط) بصورة واضحة."
  examples:
    per_lemma:
      - lemma: "مُخَنْفِر"
        examples:
          - text: "بسبب إصابته بالزكام الشديد، ظلّ المريض مُخَنْفِراً طوال اليوم يعاني من انسداد في أنفه."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "بسبب إصابته بالزكام الشديد، ظلّ المريض مُخَنْفِراً طوال اليوم يعاني من انسداد في أنفه."

stage5_enrichment:
  per_entry:
    - lemma: "مُخَنْفِر"
      entry_id: "{auto}"
      root: "خنفر"
  per_sense:
    - lemma: "مُخَنْفِر"
      sense_id: "{auto}"
      nuance: "مصطلح يشير بشكل مباشر إلى إحداث صوت عالٍ يشبه الشخير نتيجة تنفس الهواء بصعوبة عبر أنف مسدود."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"خنفر"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح يشير بشكل مباشر إلى إحداث صوت عالٍ يشبه الشخير نتيجة تنفس الهواء بصعوبة عبر أنف مسدود.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
