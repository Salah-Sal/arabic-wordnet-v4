  per_lemma:
    - lemma: "مُطْفِئ الشُّمُوع"
      decision: confirmed
      decision_reason: "اللمة عبارة وصفية مفهومة وتؤدي الغرض في ظل غياب مصطلح مفرد متخصص في العربية، مع ضرورة ضبطها بالشكل لتصبح (مُطْفِئُ الشُّمُوعِ)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "تعبير مباشر ودقيق عن الشخص الذي تقتضي مهمته إطفاء الشموع."
