stage1_review:
  assessment:
    concerns:
      - "المفهوم يشير إلى شخص وظيفته إطفاء الشموع، وهو دور تاريخي أو خاص لا يوجد له مصطلح مفرد شائع في الثقافة العربية."
      - "اللمة الحالية (مطفئ الشموع) عبارة وصفية (تركيب إضافي) أكثر من كونها مصطلحا مسكوكا، لكنها تؤدي الغرض بدقة."
      - "اللمة الموجودة غير مشكّلة وتحتاج إلى الضبط بالشكل المكتمل."
    observations: "يمكن التعبير عن المفهوم من خلال التركيب الإضافي الذي يتكون من اسم الفاعل والمفعول به. ويعد هذا سدًّا لفجوة معجمية."
  blind_candidates:
    - lemma: "مُطْفِئُ الشُّمُوعِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف الفاعل الذي يقوم بفعل الإطفاء والمفعول به (الشموع)."
    - lemma: "طَفَّاءُ الشُّمُوعِ"
      generation_method: tarkib
      justification: "صيغة مبالغة (فعّال) تدل على الاحتراف أو كثرة الفعل مضافة إلى الشموع."
    - lemma: "مُخْمِدُ الشُّمُوعِ"
      generation_method: tarkib
      justification: "استخدام مرادف الإخماد بدل الإطفاء في تركيب إضافي لبيان الوظيفة."
    - lemma: "طَفَّاء"
      generation_method: ishtiqaq
      justification: "صيغة المبالغة من طفأ على وزن فعّال لتدل على من يحترف الإطفاء."

