    - lemma: "مُطْفِئُ الشُّمُوعِ"
      source: stage1
      decision: removed
      decision_reason: "مكررة مع اللمة الموجودة بعد تعديل تشكيلها."
    - lemma: "طَفَّاءُ الشُّمُوعِ"
      source: stage1
      decision: removed
      decision_reason: "صيغة المبالغة غير شائعة في هذا السياق، و(مطفئ) تفي بالغرض بشكل أفضل وأكثر اعتيادا."
    - lemma: "مُخْمِدُ الشُّمُوعِ"
      source: stage1
      decision: removed
      decision_reason: "الفعل أطفأ أكثر اختصاصا وشيوعا مع الشموع مقارنة بأخمد."
    - lemma: "طَفَّاء"
      source: stage1
      decision: removed
      decision_reason: "كلمة عامة جدا لا تدل تحديدا على إطفاء الشموع، وتفتقر للدقة بدون الإضافة."

