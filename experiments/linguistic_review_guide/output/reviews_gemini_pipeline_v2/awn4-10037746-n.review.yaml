stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي مقتضب جداً."
    observations: "المجموعة تغطي مفاهيم الاعتراض السياسي والفكري. اللمّات المقترحة (معارض، محتج، منشق) دقيقة ولكنها تحتاج لضبط صرفي وإضافة 'معترض' لتغطية 'objector'."
  blind_candidates:
    - lemma: "مُعَارِض"
      generation_method: ishtiqaq
      justification: "اسم فاعل من عارض، وهو المصطلح الأكثر شيوعاً للتعبير عن المعارضة السياسية والفكرية."
    - lemma: "مُحْتَجّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من احتج، يعبر عن الشخص الذي يقوم بفعل الاحتجاج (protester)."
    - lemma: "مُنْشَقّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من انشق، يعبر عن الشخص الذي ينفصل عن جماعة أو حزب (dissident)."
    - lemma: "مُنَاهِض"
      generation_method: ishtiqaq
      justification: "يعبر عن المقاومة والاعتراض الشديد للسياسات (resister/anti)."

stage2_evidence:
  per_lemma:
    - lemma: "مُعَارِض"
      confirm:
        - text: "«عارضه: رفض قوله أو عمله وناقشه فيه... أحزاب المعارضة: التجمعات السياسية المنافسة للحكومة.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«dissenter: المعارض»"
          source: "المورد الحديث"
    - lemma: "مُحْتَجّ"
      confirm:
        - text: "«protester: المحتج»"
          source: "المورد الحديث"
    - lemma: "مُنْشَقّ"
      confirm:
        - text: "«dissident: الخارج؛ المنشق.»"
          source: "المورد الحديث"
        - text: "«مجموعة منشقة: مجموعة دينية أو سياسية تنشق عن مجموعة أكبر.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مُعْتَرِض"
      confirm:
        - text: "«اعترض على خصمه: أنكر قوله أو فعله وناقشه فيه.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«protester: المعترض»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "محتج"
      decision: confirmed
      decision_reason: "مصطلح دقيق للتعبير عن القائم بالاحتجاج، وهو مطابق لـ 'protester'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحْتَجّ"
    - lemma: "معارض"
      decision: confirmed
      decision_reason: "المصطلح الأساسي للمخالف في الرأي أو السياسة (opponent/dissenter)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعَارِض"
    - lemma: "منشق"
      decision: confirmed
      decision_reason: "يعبر بدقة عن حالة 'dissident' الذي ينفصل عن الإجماع أو الجماعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْشَقّ"
    - lemma: "مُعْتَرِض"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي لـ 'objector'، وهو مستخدم بكثرة في السياقات القانونية والسياسية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُعْتَرِض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10037746-n"}

stage4_content:
  definition:
    current: "شخص يعارض سياسة راسخة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتاج لشمولية أكبر لتغطية الجوانب الفكرية والدينية بالإضافة للسياسية."
    authored:
      - type: terminological
        text: "مَنْ يُعَبِّرُ عَنْ عَدَمِ الرِّضَا أَوْ الِاخْتِلَافِ مَعَ سِيَاسَةٍ أَوْ عَقِيدَةٍ أَوْ مُمَارَسَةٍ قَائِمَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-10037746-n", definition_index: 0, text: "مَنْ يُعَبِّرُ عَنْ عَدَمِ الرِّضَا أَوْ الِاخْتِلَافِ مَعَ سِيَاسَةٍ أَوْ عَقِيدَةٍ أَوْ مُمَارَسَةٍ قَائِمَةٍ."}
  examples:
    per_lemma:
      - lemma: "مُعَارِض"
        examples:
          - text: "يُعَدُّ الكاتِبُ مُعارِضاً شَرِساً لِلسِّياساتِ الاقْتِصادِيَّةِ الجَدِيدَةِ."
            type: usage
      - lemma: "مُحْتَجّ"
        examples:
          - text: "تَجَمَّعَ المئاتُ مِنَ المُحْتَجِّينَ أمامَ مَبْنَى البَرْلَمانِ."
            type: usage
      - lemma: "مُنْشَقّ"
        examples:
          - text: "اعْتُبِرَ العالِمُ مُنْشَقّاً عَنِ الكَنِيسَةِ بِسَبَبِ آرائِهِ العِلْمِيَّةِ."
            type: usage
      - lemma: "مُعْتَرِض"
        examples:
          - text: "سَجَّلَ العُضْوُ كَلِمَةً بِصِفَتِهِ مُعْتَرِضاً على نَتائِجِ التَّصْوِيتِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-10037746-n", text: "قادَ المُعارِضونَ حَمْلَةً لِتَغْيِيرِ القوانِينِ المَحَلِّيَّةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "مُعَارِض"
      entry_id: "{auto}"
      root: "عرض"
      maqayis_quote: "«العين والراء والضاد بناء تكثر فروعه... ترجع إلى أصل واحد، وهو العرض الذي يخالف الطول... وما عرضت لفلان ولا تعرض له، وذلك أن تجعل عرضك بإزاء عرضه.»"
    - lemma: "مُحْتَجّ"
      entry_id: "{auto}"
      root: "حجج"
      maqayis_quote: "«الحاء والجيم أصول أربعة... ومن الباب الحجة مشتقة من هذا؛ لأنها تقصد، أو بها يقصد الحق المطلوب.»"
    - lemma: "مُنْشَقّ"
      entry_id: "{auto}"
      root: "شقق"
      maqayis_quote: "«الشين والقاف أصل واحد صحيح يدل على انصداع في الشيء... ومن الباب الشقاق، وهو الخلاف، وذلك إذا انصدعت الجماعة وتفرقت.»"
    - lemma: "مُعْتَرِض"
      entry_id: "{auto}"
      root: "عرض"
      maqayis_quote: "«العين والراء والضاد بناء تكثر فروعه... وما عرضت لفلان ولا تعرض له، وذلك أن تجعل عرضك بإزاء عرضه.»"
