      maqayis_quote: "«الْغَيْنُ وَالذَّالُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شَيْءٍ مِنَ الْمَأْكَلِ... فَأَمَّا الْمَأْكَلُ فَالْغِذَاءُ، وَهُوَ الطَّعامُ وَالشَّرابُ.»"
