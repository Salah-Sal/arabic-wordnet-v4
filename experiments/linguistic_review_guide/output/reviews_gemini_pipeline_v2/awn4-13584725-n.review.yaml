        key: note
        value: '{"root":"عرض","maqayis":"«الْعَيْنُ وَالرَّاءُ وَالضَّادُ بِنَاءٌ تَكْثُرُ فُرُوعُهُ... يَرْجِعُ إِلَى أَصْلٍ وَاحِدٍ، وَهُوَ الْعَرْضُ الَّذِي يُخَالِفُ الطُّولَ... وَمِنَ الْبَابِ: عَرَضَ الْمَتَاعَ يَعْرِضُهُ عَرْضًا. وَهُوَ كَأَنَّهُ فِي ذَاكَ قَدْ أَرَاهُ عَرْضَهُ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ورد","maqayis":"«الْوَاوُ وَالرَّاءُ وَالدَّالُ: أَصْلَانِ، أَحَدُهُمَا الْمُوَافَاةُ إِلَى الشَّيْءِ... فَالْأَوَّلُ الْوِرْدُ: خِلَافُ الصَّدَرِ. وَيُقَالُ: وَرَدَتِ الْإِبِلُ الْمَاءَ تَرِدُهُ وِرْدًا.»"}'
