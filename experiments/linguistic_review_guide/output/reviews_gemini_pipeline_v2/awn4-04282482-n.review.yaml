stage1_review:
  assessment:
    concerns:
      - "خلو اللمات الموجودة من التشكيل الكامل."
      - "غياب الألفاظ التراثية الدقيقة المعبرة عن المفهوم مثل 'هلل' و'شع'."
    observations: "المفهوم يشير إلى الهيكل النسجي الذي تصنعه العناكب. في العربية يُعبَّر عنه بمركبات إضافية شائعة، إلى جانب وجود ألفاظ مفردة تراثية دقيقة."
  blind_candidates:
    - lemma: "نَسِيجُ عَنْكَبُوتٍ"
      generation_method: tarkib
      justification: "مركب إضافي يصف طبيعة المادة المصنوعة."
    - lemma: "هَلَلٌ"
      generation_method: majaz
      justification: "لفظ تراثي أصيل يطلق على نسيج العنكبوت، وهو في الأصل مجاز من أول المطر لرقته."
    - lemma: "شَبَكَةُ عَنْكَبُوتٍ"
      generation_method: tarkib
      justification: "مركب إضافي شائع يصف الشكل الهندسي للنسيج."
    - lemma: "بَيْتُ عَنْكَبُوتٍ"
      generation_method: tarkib
      justification: "مركب إضافي ورد في القرآن الكريم ويشير إلى الوظيفة الإيوائية للنسيج."

stage2_evidence:
  per_lemma:
    - lemma: "شبكة عنكبوت"
      confirm:
        - text: "«نَسيجَةُ العَنْكَبوت (شَبَكَةُ العَنْكَبوت)»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "نسيج عنكبوت"
      confirm:
        - text: "«نسيج العنكبوت: cobweb, spider-web»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "هَلَلٌ"
      confirm:
        - text: "«(الهلل) أول الْمَطَر والأمطار وَاحِدهَا هلة ونسج العنكبوت»"
          source: "المعجم الوسيط"
    - lemma: "شُعٌّ"
      confirm:
        - text: "«الشُّعُّ: الشُّعاع. يقال: شُعُّ الشَّمْسِ، بَيْتُ العَنْكَبُوتِ»"
          source: "المعجم الكبير"
    - lemma: "بَيْتُ عَنْكَبُوتٍ"
      confirm:
        - text: "«بَيتُ العَنْكَبوت: cobweb»"
          source: "المعجم الطبي الموحد (2009)"

