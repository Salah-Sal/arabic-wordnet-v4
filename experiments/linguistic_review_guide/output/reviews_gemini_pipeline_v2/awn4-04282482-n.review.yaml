      - lemma: "شَبَكَةُ عَنْكَبُوتٍ"
        examples:
          - text: "عَلِقَتِ الذُّبَابَةُ فِي شَبَكَةِ عَنْكَبُوتٍ فِي زَاوِيَةِ الغُرْفَةِ."
            type: usage
      - lemma: "نَسِيجُ عَنْكَبُوتٍ"
        examples:
          - text: "يَتَمَيَّزُ نَسِيجُ العَنْكَبُوتِ بِمَتَانَةٍ تَفُوقُ مَتَانَةَ الفُولَاذِ بِنَفْسِ السُّمْكِ."
            type: usage
      - lemma: "هَلَلٌ"
        examples:
          - text: "تَرَاكَمَ الهَلَلُ فِي سَقْفِ البَيْتِ المَهْجُورِ."
            type: usage
      - lemma: "شُعٌّ"
        examples:
          - text: "نَسَجَتِ العَنْكَبُوتُ شُعَّهَا بَيْنَ أَغْصَانِ الشَّجَرَةِ."
