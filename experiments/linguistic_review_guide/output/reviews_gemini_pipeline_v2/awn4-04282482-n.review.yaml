stage4_content:
  definition:
    current: "شبكة تغزلها العناكب لاصطياد الفرائس من الحشرات"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يفتقر إلى الدقة المعجمية والصياغة المصطلحية السليمة التي تبدأ بالجنس القريب (نسيج رقيق)."
    authored:
      - type: terminological
        text: "نَسِيجٌ رَقِيقٌ تَغْزِلُهُ العَنَاكِبُ وَتَتَّخِذُهُ شَرَكاً لِاصْطِيَادِ الحَشَرَاتِ وَنَحْوِهَا، أَوْ مَأْوًى لَهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نَسِيجٌ رَقِيقٌ تَغْزِلُهُ العَنَاكِبُ وَتَتَّخِذُهُ شَرَكاً لِاصْطِيَادِ الحَشَرَاتِ وَنَحْوِهَا، أَوْ مَأْوًى لَهَا."

  examples:
