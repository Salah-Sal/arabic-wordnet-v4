stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة حالياً هي عبارة مركبة طويلة (فراست) وليست كلمة واحدة، رغم شيوعها في كتب التنجيم."
      - "عدم وجود لمة 'الأسدي' رغم أنها قياسية في النسبة للمواليد في البروج (مثل جدي، دلو، إلخ)."
    observations: "المفهوم يشير إلى الشخص المولود تحت برج الأسد. في العربية الحديثة، المصطلح الأكثر شيوعاً هو 'مولود برج الأسد'، كما يُستخدم اسم البرج 'الأسد' نفسه كناية عن الشخص في السياقات التنجيمية."
  blind_candidates:
    - lemma: "الأَسَدِيّ"
      generation_method: ishtiqaq
      justification: "النسبة إلى 'الأسد' (البرج) للدلالة على الشخص المنتمي إليه، وهي صيغة قياسية في النسبة للأبراج."
    - lemma: "مَوْلُودُ الأَسَدِ"
      generation_method: tarkib
      justification: "تعبير إضافي مخفف يشيع استخدامه في الصحافة والمجلات المتخصصة."
    - lemma: "صَاحِبُ بُرْجِ الأَسَدِ"
      generation_method: tarkib
      justification: "تعبير وصفي يستخدم للإشارة إلى الشخص الذي ينتمي لهذا البرج."
    - lemma: "الأَسَدُ"
      generation_method: majaz
      justification: "استخدام اسم البرج كناية عن الشخص المولود فيه، وهو شائع جداً في توقعات الأبراج."

stage2_evidence:
  per_lemma:
    - lemma: "مَوْلُود بُرْج الْأَسَد"
      confirm:
        - text: "«(3) مولود برج الأسد.»"
          source: "المورد الحديث (2008) - مدخل Leo"
    - lemma: "الأَسَد"
      confirm:
        - text: "«(1) الأَسد (فل)... (2) برج الأسد [في التنجيم]... (3) مولود برج الأسد.»"
          source: "المورد الحديث (2008)"
          addition: "المورد الحديث يربط اسم 'Leo' بكل هذه المعاني بما فيها الشخص."
    - lemma: "الأَسَدِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مَوْلُود بُرْج الْأَسَد"
      decision: confirmed
      decision_reason: "هو المصطلح المعياري والأكثر دقة وتفصيلاً لوصف الشخص في هذا السياق، وموثق في المعاجم الحديثة كالمورد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْلُود بُرْج الْأَسَد"
    - lemma: "الأَسَد"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم اسم البرج كناية عن الشخص المولود فيه، وهو شائع جداً في الاستعمال اللغوي اليومي والإعلامي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "الأَسَد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09772126-n"}

stage4_content:
  definition:
    current: "(علم التنجيم) شخص ولد بينما الشمس في برج الأسد"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أكثر رصانة مع تحديد الفترة الزمنية المرتبطة بالبرج."
    authored:
      - type: terminological
        text: "(في التَّنْجِيم) مَنْ كَانَ مَوْلِدُه وَالشَّمْسُ فِي بُرْجِ الأَسَدِ (بَيْنَ 23 يوليو وَ22 أغسطس)."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09772126-n", definition_index: 0, text: "(في التَّنْجِيم) مَنْ كَانَ مَوْلِدُه وَالشَّمْسُ فِي بُرْجِ الأَسَدِ (بَيْنَ 23 يوليو وَ22 أغسطس)."}
  examples:
    per_lemma:
      - lemma: "مَوْلُود بُرْج الْأَسَد"
        examples:
          - text: "يُعرف مَوْلُودُ بُرْجِ الأَسَدِ بِقُوَّةِ الشَّخْصِيَّةِ وَالطُّمُوحِ العَالِي."
            type: usage
      - lemma: "الأَسَد"
        examples:
          - text: "تُشير تَوقُّعاتُ الفَلَكِ لِهذا الأُسْبوعِ أَنَّ الأَسَدَ سَيَنالُ تَرْقِيَةً في عَمَلِه."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعرف مَوْلُودُ بُرْجِ الأَسَدِ بِقُوَّةِ الشَّخْصِيَّةِ وَالطُّمُوحِ العَالِي."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُشير تَوقُّعاتُ الفَلَكِ لِهذا الأُسْبوعِ أَنَّ الأَسَدَ سَيَنالُ تَرْقِيَةً في عَمَلِه."}

