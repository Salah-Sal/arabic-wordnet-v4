stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يستخدم الكلمات المشتقة من اللمات نفسها (يختار، ينتقي)، مما يجعله تعريفاً دائرياً بعض الشيء."
    observations: "المجموعة تغطي مفهوم الشخص الذي يقوم بالاختيار. اللمات الموجودة صحيحة، ويمكن إثراؤها بمرادفات من جذور أخرى مثل (ص-ف-و) و(ن-خ-ب) لبيان مراتب الاختيار."
  blind_candidates:
    - lemma: "مُصْطَفٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'اصطفى'، ويعني اختيار الأفضل والأصفى."
    - lemma: "مُنْتَخِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'انتخب'، ويستخدم في السياق العام والتقني للتعبير عن الانتقاء والاختيار."
    - lemma: "مُمَيِّز"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'ميز'، يعبر عن الشخص الذي يفصل بين الأشياء ويختار من بينها."
    - lemma: "نَخَّاب"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن 'فعال' للدلالة على كثرة اختيار النخبة أو الأفضل."

stage2_evidence:
  per_lemma:
    - lemma: "مُخْتَار"
      confirm:
        - text: "«مُخْتَار: من (خ ي ر) المصطفى المنتقي والمفضل على غيره.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«المختار؛ المتخيِّر؛ المنتقِي؛ المُصْطَفِي. : selector»"
          source: "المورد الحديث (2008)"
    - lemma: "مُنْتَقٍ"
      confirm:
        - text: "«منتقٍ، منتخِب : selector»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«المنتقي؛ ... : selector»"
          source: "المورد الحديث (2008)"
    - lemma: "مُصْطَفٍ"
      confirm:
        - text: "«المُصْطَفِي. : selector»"
          source: "المورد الحديث (2008)"
        - text: "«وَمُحَمَّدٌ صِفْوَةُ اللَّهِ تَعَالَى وَخِيرَتُهُ مِنْ خَلْقِهِ، وَمُصْطَفَاهُ ... وَإِنَّمَا سُمِّيَتْ صَفِيًّا لِأَنَّ صَاحِبَهَا يَصْطَفِيهَا.»"
          source: "مقاييس اللغة لابن فارس"
    - lemma: "مُنْتَخِب"
      confirm:
        - text: "«منتقٍ، منتخِب : selector»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«(الْمُنْتَخب) من لَهُ حق التصويت فِي الانتخاب (محدثة)»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "مُخْتَار"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشائع يعبر عن الشخص الذي يقوم بالاختيار، بالرغم من استخدامه الشائع كاسم مفعول أو لقب وظيفي (عمدة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخْتَار"
    - lemma: "مُنْتَقٍ"
      decision: confirmed
      decision_reason: "مصطلح دقيق يعبر عن عملية الانتقاء (أي اختيار الأفضل أو المحدد بناءً على معايير)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْتَقٍ"
    - lemma: "مُصْطَفٍ"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل فصيح يعبر عن اصطفاء الأفضل، وهو مرادف قوي ومستخدم في المعاجم الحديثة كمكافئ لـ selector."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُصْطَفٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُنْتَخِب"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم في السياق العلمي (كيمياء) كمرادف لـ selector، بالإضافة لاستخدامه السياسي (ناخب)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُنْتَخِب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يختار أو ينتقي"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً ويستخدم نفس جذور اللمات (دائري). يحتاج لصياغة أكثر شمولاً."
    authored:
      - type: terminological
        text: "شَخْصٌ يَقُومُ بِتَمْيِيزِ وَأَخْذِ شَيْءٍ أَوْ فَرْدٍ مِنْ بَيْنِ مَجْمُوعَةٍ بِنَاءً عَلَى تَفْضِيلٍ أَوْ مَعَايِيرَ مُعَيَّنَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ يَقُومُ بِتَمْيِيزِ وَأَخْذِ شَيْءٍ أَوْ فَرْدٍ مِنْ بَيْنِ مَجْمُوعَةٍ بِنَاءً عَلَى تَفْضِيلٍ أَوْ مَعَايِيرَ مُعَيَّنَةٍ."}

  examples:
    per_lemma:
      - lemma: "مُخْتَار"
        examples:
          - text: "كَانَ هُوَ المُخْتَارَ لِلْمَوَاهِبِ الجَدِيدَةِ فِي المُسَابَقَةِ."
            type: usage
      - lemma: "مُنْتَقٍ"
        examples:
          - text: "يَعْمَلُ كَمُنْتَقٍ لِلْمَخْطُوطَاتِ النَّادِرَةِ فِي المَكْتَبَةِ الوَطَنِيَّةِ."
            type: usage
      - lemma: "مُصْطَفٍ"
        examples:
          - text: "ظَلَّ القَائِدُ مُصْطَفِياً لِخَيْرَةِ رِجَالِهِ لِلْمَهَمَّةِ الصَّعْبَةِ."
            type: usage
      - lemma: "مُنْتَخِب"
        examples:
          - text: "يُعَدُّ الجِهَازُ مُنْتَخِباً آلِيّاً لِلْعَيِّنَاتِ الصَّالِحَةِ لِلتَّجْرِبَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "كَانَ هُوَ المُخْتَارَ لِلْمَوَاهِبِ الجَدِيدَةِ فِي المُسَابَقَةِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يَعْمَلُ كَمُنْتَقٍ لِلْمَخْطُوطَاتِ النَّادِرَةِ فِي المَكْتَبَةِ الوَطَنِيَّةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "مُخْتَار"
      entry_id: "{auto}"
      root: "خير"
      maqayis_quote: "«الْخَاءُ وَالْيَاءُ وَالرَّاءُ أَصْلُهُ الْعَطْفُ وَالْمَيْلُ، ثُمَّ يُحْمَلُ عَلَيْهِ. فَالْخَيْرُ: خِلَافُ الشَّرِّ ; لِأَنَّ كُلَّ أَحَدٍ يَمِيلُ إِلَيْهِ وَيَعْطِفُ عَلَى صَاحِبِهِ.»"
    - lemma: "مُنْتَقٍ"
      entry_id: "{auto}"
      root: "نقي"
      maqayis_quote: "«النُّونُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى نَظَافَةٍ وَخُلُوصٍ. مِنْهُ نَقَّيْتُ الشَّيْءَ: خَلَّصْتُهُ مِمَّا يَشُوبُهُ... كَأَنَّكَ أَخَذْتَ أَفْضَلَهُ وَأَخْلَصَهُ.»"
    - lemma: "مُصْطَفٍ"
      entry_id: "{auto}"
      root: "صفو"
      maqayis_quote: "«الصَّادُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خُلُوصٍ مِنْ كُلِّ شَوْبٍ. ... وَالصَّفِيُّ: مَا اصْطَفَاهُ الْإِمَامُ مِنَ الْمَغْنَمِ لِنَفْسِهِ.»"
    - lemma: "مُنْتَخِب"
      entry_id: "{auto}"
      root: "نخب"
      maqayis_quote: "«النُّونُ وَالْخَاءُ وَالْبَاءُ كَلِمَةٌ تَدُلُّ عَلَى تَعَظُّمٍ يُقَالُ أَحَدُهُمَا عَلَى خِيَارِ شَيْءٍ... فَالْأَوَّلُ النُّخْبَةُ: خِيَارُ الشَّيْءِ وَنُخْبَتُهُ. وَانْتَخَبْتُهُ، وَهُوَ مُنْتَخَبٌ أَيْ مُخْتَارٌ.»"
  per_sense:
    - lemma: "مُخْتَار"
      sense_id: "{auto}"
      nuance: "لفظ عام وشامل، وقد يلتبس بالمعنى الوظيفي (العمدة) أو المعنى المفعولي (المُنتقَى)."
      mwe: false
    - lemma: "مُنْتَقٍ"
      sense_id: "{auto}"
      nuance: "يوحي بالدقة في الاختيار واستبعاد الشوائب أو الرديء."
      mwe: false
    - lemma: "مُصْطَفٍ"
      sense_id: "{auto}"
      nuance: "درجة عالية من الاختيار توحي باختيار الأفضل والأكثر نقاءً، وهي ذات جرس لغوي رفيع."
      mwe: false
    - lemma: "مُنْتَخِب"
      sense_id: "{auto}"
      nuance: "توحي بالاختيار من بين الأفضل (النخبة) أو الاختيار عبر آلية فرز (سواء بشرية أو تقنية)."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"خير","maqayis":"«الْخَاءُ وَالْيَاءُ وَالرَّاءُ أَصْلُهُ الْعَطْفُ وَالْمَيْلُ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نقي","maqayis":"«النُّونُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى نَظَافَةٍ وَخُلُوصٍ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يوحي بالدقة في الاختيار واستبعاد الشوائب أو الرديء.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
