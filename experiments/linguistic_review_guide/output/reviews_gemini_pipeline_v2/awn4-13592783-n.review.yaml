stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي واسع جداً يجمع بين معنيين مختلفين قليلاً: الأخذ الفيزيائي (uptake) والاستهلاك الاقتصادي أو الوظيفي (consuming)."
      - "اللمة 'أخذ' عامة جداً وتحتاج إلى تشكيل دقيق."
    observations: "المجموعة تغطي مفهوم 'uptake' الذي يشيع في السياقات العلمية (البيولوجية والفيزيائية) ومفهوم 'consuming' (الاستهلاك). المصطلحات الموجودة جيدة ولكن يمكن إثراؤها بمصطلحات تقنية أكثر دقة مثل 'قبط' و'استهلاك'."
  blind_candidates:
    - lemma: "تَنَاوُل"
      generation_method: ishtiqaq
      justification: "لفظ شائع للتعبير عن أخذ الغذاء أو الدواء أو استيعاب مادة ما."
    - lemma: "اِسْتِهْلَاك"
      generation_method: ishtiqaq
      justification: "المقابل الدقيق لمفهوم (consuming) و(using up) الوارد في التعريف."
    - lemma: "اِسْتِنْفَاد"
      generation_method: ishtiqaq
      justification: "يعبر عن عملية استهلاك الشيء بالكامل حتى ينتهي."
    - lemma: "تَمْثِيل"
      generation_method: majaz
      justification: "يستخدم في السياق البيولوجي للتعبير عن استيعاب المواد وتحويلها (assimilation)."

stage2_evidence:
  per_lemma:
    - lemma: "أَخْذ"
      confirm:
        - text: "«الأَخْذ: خِلافُ العَطاء، وهو أَيضاً التناول.»"
          source: "لسان العرب"
        - text: "«أخذ الشيء أخذاً: حازه وحصله تناوله.»"
          source: "المعجم الوسيط"
      expands:
        - text: "«intake»"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
    - lemma: "اِمْتِصَاص"
      confirm:
        - text: "«استيعاب مادةٍ ما لمادة أخرى، وتوزيع الثانية في الأولى توزيعاً متجانساً.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«absorption; uptake»"
          source: "المورد الحديث"
      expands:
        - text: "«oxygen uptake»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
    - lemma: "اِسْتِيعَاب"
      confirm:
        - text: "«الاستيعاب: أخذ الشيء كله.»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«assimilation; uptake»"
          source: "المورد الحديث"
    - lemma: "اِسْتِهْلَاك"
      confirm:
        - text: "«استعمال السلع لإشباع الحاجات.»"
          source: "المعجم الموحد لمصطلحات الاقتصاد"
        - text: "«consumption»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "قَبْط"
      confirm:
        - text: "«قبط الغذيات: nutrient uptake»"
          source: "المكنز الزراعي متعدد اللغات"
        - text: "«قبط، التقاط: uptake»"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
        - text: "«amine precursor uptake and decarboxylation»"
          source: "المعجم الطبي الموحد"

stage3_analysis:
  per_lemma:
    - lemma: "أخذ"
      decision: confirmed
      decision_reason: "المعنى الأساسي للأخذ يتفق مع (taking up) الوارد في التعريف الإنجليزي، وهو مصطلح عام صالح لمختلف السياقات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَخْذ"
    - lemma: "امتصاص"
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق يعبر عن (uptake) في السياقات الفيزيائية والكيميائية والبيولوجية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِمْتِصَاص"
    - lemma: "استيعاب"
      decision: confirmed
      decision_reason: "يعبر عن استغراق الشيء بالكامل وتمثيله، وهو مناسب لمفهوم (assimilation/uptake)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِيعَاب"
    - lemma: "اِسْتِهْلَاك"
      source: stage1
      decision: confirmed
      decision_reason: "المقابل الدقيق لمفهوم (consuming) و(using up) الوارد في التعريف، ويغطي الجانب الوظيفي والاقتصادي للعملية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "اِسْتِهْلَاك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "قَبْط"
      decision: confirmed
      decision_reason: "مصطلح تقني متخصص جداً وجد في المعاجم الطبية والزراعية الموحدة لترجمة (uptake) في سياق امتصاص المغذيات والطلائع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "قَبْط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "عملية أخذ أو استهلاك شيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً، ويفضل صياغته بأسلوب مصطلحي يجمع بين الامتصاص البيولوجي/الفيزيائي والاستهلاك الوظيفي."
    authored:
      - type: terminological
        text: "عَمَلِيَّةُ سَحْبِ المَوَادِّ أَوْ الطَّاقَةِ وَضَمِّهَا إِلَى كِيَانٍ حَيٍّ أَوْ نِظَامٍ تَقْنِيٍّ، أَوْ اِسْتِنْفَادُهَا بِالغَرَضِ الَّذِي وُجِدَتْ لَهُ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "أَخْذ"
        examples:
          - text: "يُقاسُ مَعَدَّلُ أَخْذِ الجُذُورِ لِلأَمْلَاحِ المَعْدِنِيَّةِ بِدِقَّةٍ."
            type: usage
      - lemma: "اِمْتِصَاص"
        examples:
          - text: "يَزْدَادُ اِمْتِصَاصُ الأُكْسُجِينِ فِي الرِّئَتَيْنِ أَثْنَاءَ التَّمَارِينِ الرِّيَاضِيَّةِ."
            type: usage
      - lemma: "اِسْتِيعَاب"
        examples:
          - text: "تَعْمَلُ الخَلَايَا عَلَى اِسْتِيعَابِ السُّكَّرِ لِتَوْلِيدِ الطَّاقَةِ."
            type: usage
      - lemma: "اِسْتِهْلَاك"
        examples:
          - text: "يَسْعَى المَصْنَعُ إِلَى تَقْلِيلِ اِسْتِهْلَاكِ المَوَادِّ الخَامِ."
            type: usage
      - lemma: "قَبْط"
        examples:
          - text: "تَتَمَيَّزُ هَذِهِ الخَلَايَا بِقُدْرَتِهَا العَالِيَةِ عَلَى قَبْطِ الهُرْمُونَاتِ."
            type: usage
  actions:
    - command: update_definition
      params:
        synset_id: "{synset_id}"
        definition_index: 0
        text: "عَمَلِيَّةُ سَحْبِ المَوَادِّ أَوْ الطَّاقَةِ وَضَمِّهَا إِلَى كِيَانٍ حَيٍّ أَوْ نِظَامٍ تَقْنِيٍّ، أَوْ اِسْتِنْفَادُهَا بِالغَرَضِ الَّذِي وُجِدَتْ لَهُ."

stage5_enrichment:
  per_entry:
    - lemma: "أَخْذ"
      entry_id: "{auto}"
      root: "أخذ"
      maqayis_quote: "«الْهَمْزَةُ وَالْخَاءُ وَالذَّالُ أَصْلٌ وَاحِدٌ تَتَفَرَّعُ مِنْهُ فُرُوعٌ مُتَقَارِبَةٌ فِي الْمَعْنَى. [أَمَّا] أَخَذَ فَالْأَصْلُ حَوْزُ الشَّيْءِ وَجَبْيُهُ وَجَمْعُهُ.»"
    - lemma: "اِمْتِصَاص"
      entry_id: "{auto}"
      root: "مصص"
      maqayis_quote: "«الْمِيمُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شِبْهِ التَّذَوُّقِ لِلشَّيْءِ، وَأَخْذِ خَالِصِهِ. مِنْ ذَلِكَ مَصِصْتُ الشَّيْءَ أَمَصُّهُ، وَامْتَصَصْتُهُ أَمْتَصُّهُ.»"
    - lemma: "اِسْتِيعَاب"
      entry_id: "{auto}"
      root: "وعب"
      maqayis_quote: "«الْوَاوُ وَالْعَيْنُ وَالْبَاءُ: كَلِمَةٌ تَدُلُّ عَلَى اسْتِيظَافِ الشَّيْءِ. وَأَوْعَبْتُ الشَّيْءَ: اسْتَوْظَفْتُهُ كُلَّهُ.»"
    - lemma: "اِسْتِهْلَاك"
      entry_id: "{auto}"
      root: "هلك"
      maqayis_quote: "«الْهَاءُ وَاللَّامُ وَالْكَافُ: يَدُلُّ عَلَى كَسْرٍ وَسُقُوطٍ. مِنْهُ الْهَلَاكُ: السُّقُوطُ، وَلِذَلِكَ يُقَالُ لِلْمَيِّتِ هَلَكَ.»"
    - lemma: "قَبْط"
      entry_id: "{auto}"
      root: "قبط"
      maqayis_quote: "«الْقَافُ وَالْبَاءُ وَالطَّاءُ أَصْلٌ صَحِيحٌ. قَالَ ابْنُ دُرَيْدٍ: الْقَبْطُ: جَمْعُكَ الشَّيْءَ بِيَدِكَ.»"
  per_sense:
    - lemma: "أَخْذ"
      sense_id: "{auto}"
      nuance: "المصطلح الأعم للأفعال المذكورة في المجموعة."
      mwe: false
    - lemma: "اِمْتِصَاص"
      sense_id: "{auto}"
      nuance: "يركز على نفاذ المادة داخل مادة أخرى (فيزيائياً)."
      mwe: false
    - lemma: "اِسْتِيعَاب"
      sense_id: "{auto}"
      nuance: "يركز على احتواء الشيء بالكامل وتمثيله داخلياً."
      mwe: false
    - lemma: "اِسْتِهْلَاك"
      sense_id: "{auto}"
      nuance: "يركز على استخدام المورد حتى فنائه أو انتهاء الغرض منه."
      mwe: false
    - lemma: "قَبْط"
      sense_id: "{auto}"
      nuance: "مصطلح تقني تخصصي في البيولوجيا لامتصاص المغذيات أو الطلائع."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"أخذ","maqayis":"«الْهَمْزَةُ وَالْخَاءُ وَالذَّالُ أَصْلٌ وَاحِدٌ تَتَفَرَّعُ مِنْهُ فُرُوعٌ مُتَقَارِبَةٌ فِي الْمَعْنَى...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"مصص","maqayis":"«الْمِيمُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شِبْهِ التَّذَوُّقِ لِلشَّيْءِ، وَأَخْذِ خَالِصِهِ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"وعب","maqayis":"«الْوَاوُ وَالْعَيْنُ وَالْبَاءُ: كَلِمَةٌ تَدُلُّ عَلَى اسْتِيظَافِ الشَّيْءِ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"هلك","maqayis":"«الْهَاءُ وَاللَّامُ وَالْكَافُ: يَدُلُّ عَلَى كَسْرٍ وَسُقُوطٍ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قبط","maqayis":"«الْقَافُ وَالْبَاءُ وَالطَّاءُ أَصْلٌ صَحِيحٌ. قَالَ ابْنُ دُرَيْدٍ: الْقَبْطُ: جَمْعُكَ الشَّيْءَ بِيَدِكَ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الأعم للأفعال المذكورة في المجموعة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
