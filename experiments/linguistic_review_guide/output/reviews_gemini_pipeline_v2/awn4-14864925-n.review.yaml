stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة (عنصر) تفتقر إلى التشكيل الكامل."
      - "غياب المصطلحات الفلسفية التراثية الدقيقة لهذا المفهوم مثل (أسطقس) و(ركن)."
    observations: "المجموعة تشير إلى العناصر الأربعة التقليدية في الكونيات القديمة. المصطلح (عنصر) مستخدم بكثرة في هذا السياق، لكنه يشترك مع معانٍ كيميائية وحديثة، لذا فإن إضافة المرادفات التاريخية (أسطقس، ركن، بسيط) يعزز الدقة الدلالية للمجموعة في سياقها التاريخي."
  blind_candidates:
    - lemma: "عُنْصُر"
      generation_method: majaz
      justification: "الأصل في اللغة (الأصل والحسب)، واستُخدم مجازاً للتعبير عن المواد الأولية التي يتكون منها العالم."
    - lemma: "أُسْطُقُس"
      generation_method: taarib
      justification: "مصطلح معرب عن اليونانية (stoicheion) استخدمه فلاسفة العرب وعلماؤهم في العصور الوسطى حصراً للدلالة على العناصر الأربعة."
    - lemma: "رُكْن"
      generation_method: majaz
      justification: "يستخدم في الفلسفة والطب القديم (الأركان الأربعة) للتعبير عن النار والهواء والماء والتراب بصفتها دعائم الوجود المادي."
    - lemma: "بَسِيط"
      generation_method: ishtiqaq
      justification: "في الاصطلاح القديم، العناصر هي 'الأجسام البسيطة' (البسائط) التي لا تتركب من غيرها وتتركب منها الأجسام المختلفة الطبائع."

stage2_evidence:
  per_lemma:
    - lemma: "عُنْصُر"
      confirm:
        - text: "«هو الأصل الذي تتألف منه الأجسام المختلفة الطباع، وهو أربعة: الأرض، والماء، والنار، والهواء.»"
          source: "التعريفات للجرجاني"
        - text: "«العناصر الأربعة عند القدماء: الماء والهواء والنار والتراب.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "أُسْطُقُس"
      confirm:
        - text: "«الأسْطُقُسَّات: العناصر الأربعة عند القدماء؛ وهي الماء والهواء والنار والتراب.»"
          source: "المعجم الوسيط"
        - text: "«لفظ يوناني بمعنى الأصل، وتسمّى العناصر الأربع التي هي الماء والأرض والهواء والنار أسطقسات لأنها أصول المركبات.»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
    - lemma: "رُكْن"
      confirm:
        - text: "«عند الفلاسفة القدماء: أحد العناصر الأربعة، والأركانُ عندهم أجسامٌ بسيطةٌ هي أجزاء أولية للمواليد الثلاثة...»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
    - lemma: "بَسِيط"
      confirm:
        - text: "«البسيط: ما لا يتركب من أجسام مختلفة الطباع بحسب الحس... فيشتمل العناصر والأفلاك.»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الأصل البسيط يتكون منه المركب.»"
          source: "المعجم الوسيط"

