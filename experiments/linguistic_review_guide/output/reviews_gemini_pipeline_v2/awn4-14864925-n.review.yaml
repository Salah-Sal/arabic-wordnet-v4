stage4_content:
  definition:
    current: "واحدة من أربع مواد كان يعتقد في علم الكونيات القديم والعصور الوسطى أنها تشكل الكون المادي"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه يفتقر إلى ذكر الأسماء الصريحة لهذه العناصر (النار، الهواء، الماء، التراب) وهي جزء جوهري من تعريف المفهوم معجمياً."
    authored:
      - type: terminological
        text: "أَحَدُ العَنَاصِرِ الأَرْبَعَةِ (المَاءِ والهَوَاءِ والنَّارِ والتُّرَابِ) الَّتِي كَانَ القُدَمَاءُ يَعْتَقِدُونَ أَنَّهَا أُصُولُ المَرْكَبَاتِ وَبَسَائِطُ المَادَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14864925-n", definition_index: 0, text: "أَحَدُ العَنَاصِرِ الأَرْبَعَةِ (المَاءِ والهَوَاءِ والنَّارِ والتُّرَابِ) الَّتِي كَانَ القُدَمَاءُ يَعْتَقِدُونَ أَنَّهَا أُصُولُ المَرْكَبَاتِ وَبَسَائِطُ المَادَّةِ."}
  examples:
    per_lemma:
      - lemma: "عُنْصُر"
        examples:
          - text: "كَانَ الفَلَاسِفَةُ القُدَمَاءُ يَعْتَدُّونَ النَّارَ عُنْصُرًا بَسِيطًا لَا يَنْحَلُّ."
            type: usage
      - lemma: "أُسْطُقُس"
        examples:
          - text: "يَتَرَكَّبُ العَالَمُ عِنْدَ أَرِسْطُو مِنْ أَرْبَعَةِ أُسْطُقُسَّاتٍ هِيَ المَاءُ والتُّرَابُ والهَوَاءُ والنَّارُ."
            type: usage
      - lemma: "رُكْن"
        examples:
          - text: "تُعَدُّ الأَرْكَانُ الأَرْبَعَةُ أَسَاسَ تَرْكِيبِ الأَجْسَامِ فِي العُلُومِ القَدِيمَةِ."
            type: usage
      - lemma: "بَسِيط"
        examples:
          - text: "العَنَاصِرُ هِيَ الأَجْسَامُ البَسِيطَةُ الَّتِي تَتَأَلَّفُ مِنْهَا كَافَّةُ المَرْكَبَاتِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-14864925-n", text: "تَقُومُ نَظَرِيَّةُ العَنَاصِرِ الأَرْبَعَةِ عَلَى اعْتِبَارِ المَاءِ والهَوَاءِ والنَّارِ والتُّرَابِ أُسُسَ الوجُودِ المَادِيِّ."}

