        value: '{"root":"خطط","maqayis":"«الْخَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ ; وَهُوَ أَثَرٌ يَمْتَدُّ امْتِدَادًا.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"سير","maqayis":"«السِّينُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى مُضِيٍّ وَجَرَيَانٍ... وَالسَّيْرُ: الْجِلْدُ... سُمِّيَ بِذَلِكَ لِامْتِدَادِهِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حدد","maqayis":"«الْحَاءُ وَالدَّالُ أَصْلَانِ: الْأَوَّلُ الْمَنْعُ، وَالثَّاني طَرَفُ الشَّيْءِ. فَالْحَدُّ: الْحَاجِزُ بَيْنَ الشَّيْئَيْنِ.»"}'
