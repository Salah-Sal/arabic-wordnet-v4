stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط، رغم وجود مرادفات فصيحة وشائعة في السياقات القانونية والتجارية."
    observations: "اللمّة الموجودة (متعهد) دقيقة جداً وتطابق المفهوم تماماً، ولكن يمكن إثراء المجموعة بمرادفات تعبر عن الالتزام بالضمان والكفالة."
  blind_candidates:
    - lemma: "مُتَعَهِّد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'تعهد'، وهو اللفظ المباشر للشخص الذي يقطع عهداً أو التزاماً."
    - lemma: "ضَامِن"
      generation_method: ishtiqaq
      justification: "لفظ يعبر عن الالتزام بضمان شيء ما، وهو مرادف للـ (pledger) في السياق المالي والقانوني."
    - lemma: "كَفِيل"
      generation_method: ishtiqaq
      justification: "من يضمن شخصاً أو مالاً، وهو نوع من المتعهدين."
    - lemma: "مُلْتَزِم"
      generation_method: ishtiqaq
      justification: "من يوجب على نفسه القيام بأمر ما، وهو قريب جداً من مفهوم المتعهد."

stage2_evidence:
  per_lemma:
    - lemma: "مُتَعَهِّد"
      confirm:
        - text: "«(المتعهد) المحافظ على الْعَهْد والملتزم بالشَّيْء يَفْعَله وينفذه (محدثة)»"
          source: "المعجم الوسيط"
    - lemma: "ضَامِن"
      confirm:
        - text: "«(الضَّامِن) الْكَفِيل أَو الْمُلْتَزم أَو الْغَارِم»"
          source: "المعجم الوسيط"
        - text: "«المتكفل بدين أو عقدة تحت مسؤوليته»"
          source: "المعجم الموحد لمصطلحات النقل"
    - lemma: "كَفِيل"
      confirm:
        - text: "«(الْكَفِيل) المثيل يُقَال مَا لفُلَان كَفِيل والكافل والضامن»"
          source: "المعجم الوسيط"
        - text: "«هو الذي ضَمَّ ذمَّته إلى ذمة الآخر... والشيءُ الذي تعهَّد الكفيل بأدائه وتسليمه هو المكفول به»"
          source: "التعريفات الفقهيّة للبركتي"
    - lemma: "مُلْتَزِم"
      confirm:
        - text: "«(الْمُلْتَزم) من يتعهد بأَدَاء قدر من المَال لِقَاء استغلاله أَرضًا من أَرَاضِي الدولة (مو)»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الْمُلْتَزِمُ: بالضم ثم السكون، وتاء فوقها نقطتان مفتوحة... وهو ما بين الحجر الأسود والباب»"
          source: "معجم البلدان"
          addition: "يُستخدم اللفظ أيضاً للدلالة على مكان محدد في الكعبة."

stage3_analysis:
  per_lemma:
    - lemma: "مُتَعَهِّد"
      decision: confirmed
      decision_reason: "اللمّة الأساسية والمطابقة تماماً لتعريف المجموعة دلالياً واصطلاحياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَعَهِّد"
    - lemma: "ضَامِن"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي للمتعهد في سياق الالتزام والضمان المالي والقانوني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ضَامِن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "كَفِيل"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح قانوني وفقهي دقيق يعبر عن المتعهد بضمان ذمة الغير."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "كَفِيل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُلْتَزِم"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الالتزام الطوعي أو التعاقدي، وهو مرادف صحيح للمتعهد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُلْتَزِم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يقدم أو يعطي تعهداً"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، ويحتاج إلى صياغة معجمية توضح طبيعة التعهد."
    authored:
      - type: terminological
        text: "شَخْصٌ يَلْتَزِمُ بِقَوْلٍ أَوْ كِتَابَةٍ بِالْوَفَاءِ بِأَمْرٍ مُعَيَّنٍ أَوْ تَنْفِيذِ مَهَمَّةٍ مَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "مُتَعَهِّد"
        examples:
          - text: "وَقَّعَ الْمُتَعَهِّدُ عَلَى جَمِيعِ شُرُوطِ الْبِنَاءِ الْمُتَّفَقِ عَلَيْهَا."
            type: usage
      - lemma: "ضَامِن"
        examples:
          - text: "يُطَالِبُ الْبَنْكُ بِوُجُودِ ضَامِنٍ قَبْلَ صَرْفِ الْقَرْضِ لِتَأْمِينِ السَّدَادِ."
            type: usage
      - lemma: "كَفِيل"
        examples:
          - text: "تَقَدَّمَ الْكَفِيلُ لِلْمَحْكَمَةِ لِيَضْمَنَ حُضُورَ الْمُتَّهَمِ فِي مَوْعِدِ الْجَلْسَةِ."
            type: usage
      - lemma: "مُلْتَزِم"
        examples:
          - text: "يُعْتَبَرُ الطَّرَفُ الثَّانِي مُلْتَزِمًا بِتَسْلِيمِ الْبِضَاعَةِ فِي مَوْعِدِهَا الْمُحَدَّدِ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ يَلْتَزِمُ بِقَوْلٍ أَوْ كِتَابَةٍ بِالْوَفَاءِ بِأَمْرٍ مُعَيَّنٍ أَوْ تَنْفِيذِ مَهَمَّةٍ مَا."}
    - command: add_sense_example
      params: {sense_id: "{auto}", text: "وَقَّعَ الْمُتَعَهِّدُ عَلَى جَمِيعِ شُرُوطِ الْبِنَاءِ الْمُتَّفَقِ عَلَيْهَا."}

stage5_enrichment:
  per_entry:
    - lemma: "مُتَعَهِّد"
      entry_id: "{auto}"
      root: "عهد"
      maqayis_quote: "«الْعَيْنُ وَالْهَاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الِاحْتِفَاظِ بِالشَّيْءِ وَإِحْدَاثِ الْعَهْدِ بِهِ. وَمِنْهُ الْعَهْدُ: الْوَصِيَّةُ...»"
    - lemma: "ضَامِن"
      entry_id: "{auto}"
      root: "ضمن"
      maqayis_quote: "«الضَّادُ وَالْمِيمُ وَالنُّونُ أَصْلٌ صَحِيحٌ، وَهُوَ جَعْلُ الشَّيْءِ فِي شَيْءٍ يَحْوِيهِ... وَالْكَفَالَةُ تُسَمَّى ضَمَانًا مِنْ هَذَا؛ لِأَنَّهُ كَأَنَّهُ إِذَا ضَمِنَهُ فَقَدِ اسْتَوْعَبَ ذِمَّتَهُ.»"
    - lemma: "كَفِيل"
      entry_id: "{auto}"
      root: "كفل"
      maqayis_quote: "«الْكَافُ وَالْفَاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَضَمُّنِ الشَّيْءِ لِلشَّيْءِ... وَمِنَ الْبَابِ الْكَفِيلُ، وَهُوَ الضَّامِنُ.»"
    - lemma: "مُلْتَزِم"
      entry_id: "{auto}"
      root: "لزم"
      maqayis_quote: "«اللَّامُ وَالزَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ صَحِيحٌ، يَدُلُّ عَلَى مُصَاحَبَةِ الشَّيْءِ بِالشَّيْءِ دَائِمًا.»"
  per_sense:
    - lemma: "مُتَعَهِّد"
      sense_id: "{auto}"
      nuance: "اللفظ الأكثر عمومية للدلالة على من يأخذ على عاتقه تنفيذ عمل أو الوفاء بوعد."
      mwe: false
    - lemma: "ضَامِن"
      sense_id: "{auto}"
      nuance: "يركز على جانب الضمان المالي أو القانوني للوفاء بالتعهد."
      mwe: false
    - lemma: "كَفِيل"
      sense_id: "{auto}"
      nuance: "متعهد يضمن ذمة شخص آخر تجاه طرف ثالث."
      mwe: false
    - lemma: "مُلْتَزِم"
      sense_id: "{auto}"
      nuance: "يعبر عن حالة الالتزام والارتباط الأدبي أو التعاقدي بتنفيذ التعهد."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عهد","maqayis":"«الْعَيْنُ وَالْهَاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الِاحْتِفَاظِ بِالشَّيْءِ وَإِحْدَاثِ الْعَهْدِ بِهِ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ الأكثر عمومية للدلالة على من يأخذ على عاتقه تنفيذ عمل أو الوفاء بوعد.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
