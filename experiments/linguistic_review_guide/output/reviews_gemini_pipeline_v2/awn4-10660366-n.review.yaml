stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي جيد ولكنه يفتقر إلى ضبط التشكيل وتوضيح هيئة بسط الأطراف المميزة للمفهوم."
    observations: "المجموعة تعبر عن هيئة التمدد العشوائي وبسط الأطراف بغير انتظام (sprawling). اللمات الحالية 'متمدد' و'منبطح' تعبران عن هذا المعنى بشكل صحيح."
  blind_candidates:
    - lemma: "مُتَمَدِّد"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل 'تمدد'، ويعبر عن الامتداد والانبساط."
    - lemma: "مُنْبَطِح"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل 'انبطح'، ويعبر عن الاستلقاء والامتداد على الأرض."
    - lemma: "مُفْتَرِش"
      generation_method: ishtiqaq
      justification: "مشتق من 'افترش'، لمن يتخذ الأرض فراشاً ويمتد عليها."
    - lemma: "مُسْتَلْقٍ"
      generation_method: ishtiqaq
      justification: "مشتق من 'استلقى'، ويعني النوم على الظهر ممتداً."

stage2_evidence:
  per_lemma:
    - lemma: "مُتَمَدِّد"
      confirm:
        - text: "(2) يتمدَّد [باسطًا ذراعيه وقدميه] (3) ينتشر أو يمتدّ في غير نظام أو اتّساق ... (5) تمدُّد؛ انبطاح"
          source: "المورد الحديث (2008)"
    - lemma: "مُنْبَطِح"
      confirm:
        - text: "الوادى : اتَّسَع فلانٌ : استَلْقى على وَجْهِه مُمَتَدّاً على الأرْض"
          source: "المعجم الكبير"
        - text: "(1) مُنبطِح: مُستلقٍ على ظهره"
          source: "المورد الحديث (2008)"
    - lemma: "مُفْتَرِش"
      expands:
        - text: "مُفْتَرِش من (ف ر ش) الذي يبسط الثوب ونحوه ليجلس عليه والمفترش الأرض: متخذها مكانا للجلوس"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُسْتَلْقٍ"
      expands:
        - text: "(1) مُضْطَجع؛ مستَلْقٍ (2) مُسْتلقٍ: متمدِّد على الأرض مع نزوعِ طَرَفِهِ إلى الاستعلاء"
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "مُتَمَدِّد"
      decision: confirmed
      decision_reason: "الكلمة دقيقة وتعبر مباشرة عن التمدد والامتداد، وتؤكد المعاجم ارتباطها بالاستلقاء مع بسط الأطراف بغير انتظام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَمَدِّد"

    - lemma: "مُنْبَطِح"
      decision: confirmed
      decision_reason: "الكلمة فصيحة وتدل على الاستلقاء والامتداد على الأرض بشكل كامل، وهو ما يتوافق مع هيئة الشخص الذي يتمدد بغير انتظام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْبَطِح"

    - lemma: "مُفْتَرِش"
      source: stage1
      decision: removed
      decision_reason: "الافتراش يركز على اتخاذ الشيء فراشاً للجلوس أو النوم، ولا يحمل بالضرورة معنى التمدد بغير انتظام وبسط الأطراف الذي يقصده المفهوم."
      evidence_assessment:
        case: mixed

    - lemma: "مُسْتَلْقٍ"
      source: stage1
      decision: removed
      decision_reason: "الاستلقاء يدل على مجرد النوم على الظهر، ولا يفيد بالضرورة التمدد العشوائي أو بسط الأطراف بغير انتظام كالمقصود في المفهوم."
      evidence_assessment:
        case: mixed

stage4_content:
  definition:
    current: "شخص يتمدد بغير انتظام"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق وموجز، ولكن ينقصه ضبط التشكيل وإضافة توضيح بسيط لهيئة بسط الأطراف."
    authored:
      - type: terminological
        text: "شَخْصٌ يَتَمَدَّدُ بَاسِطاً أَطْرَافَهُ بِغَيْرِ انْتِظَامٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَتَمَدَّدُ بَاسِطاً أَطْرَافَهُ بِغَيْرِ انْتِظَامٍ."

  examples:
    per_lemma:
      - lemma: "مُتَمَدِّد"
        examples:
          - text: "كَانَ الشَّابُّ مُتَمَدِّدًا عَلَى الأَرِيكَةِ يَشْعُرُ بِالْمَلَلِ."
            type: usage
      - lemma: "مُنْبَطِح"
        examples:
          - text: "وَجَدُوهُ مُنْبَطِحًا عَلَى الأَرْضِ بَعْدَ يَوْمٍ شَاقٍّ مِنَ الْعَمَلِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كَانَ الشَّابُّ مُتَمَدِّدًا عَلَى الأَرِيكَةِ يَشْعُرُ بِالْمَلَلِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وَجَدُوهُ مُنْبَطِحًا عَلَى الأَرْضِ بَعْدَ يَوْمٍ شَاقٍّ مِنَ الْعَمَلِ."

stage5_enrichment:
  per_entry:
    - lemma: "مُتَمَدِّد"
      entry_id: "{auto}"
      root: "مدد"
      maqayis_quote: "«الْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ فِي طُولٍ، وَاتِّصَالِ شَيْءٍ بِشَيْءٍ فِي اسْتِطَالَةٍ. تَقُولُ: مَدَدْتُ الشَّيْءَ أَمُدُّهُ مَدًّا.»"
    - lemma: "مُنْبَطِح"
      entry_id: "{auto}"
      root: "بطح"
      maqayis_quote: "«الْبَاءُ وَالطَّاءُ وَالْحَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَبَسُّطُ الشَّيْءِ وَامْتِدَادُهُ. قَالَ الْخَلِيلُ: الْبَطْحُ مِنْ قَوْلِكَ بَطَحَهُ عَلَى وَجْهِهِ بَطْحًا.»"
  per_sense:
    - lemma: "مُتَمَدِّد"
      sense_id: "{auto}"
      nuance: "تُركِّز على فعل الاستطالة وبسط الأطراف (الذراعين والقدمين) بغير انتظام."
      mwe: false
    - lemma: "مُنْبَطِح"
      sense_id: "{auto}"
      nuance: "تُركِّز على ملامسة الأرض بالجسد والامتداد عليها (غالباً على الوجه)، وتشير إلى الهيئة العامة للاستلقاء الممتد."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"مدد","maqayis":"«الْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ فِي طُولٍ، وَاتِّصَالِ شَيْءٍ بِشَيْءٍ فِي اسْتِطَالَةٍ. تَقُولُ: مَدَدْتُ الشَّيْءَ أَمُدُّهُ مَدًّا.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"بطح","maqayis":"«الْبَاءُ وَالطَّاءُ وَالْحَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَبَسُّطُ الشَّيْءِ وَامْتِدَادُهُ. قَالَ الْخَلِيلُ: الْبَطْحُ مِنْ قَوْلِكَ بَطَحَهُ عَلَى وَجْهِهِ بَطْحًا.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُركِّز على فعل الاستطالة وبسط الأطراف (الذراعين والقدمين) بغير انتظام.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُركِّز على ملامسة الأرض بالجسد والامتداد عليها (غالباً على الوجه)، وتشير إلى الهيئة العامة للاستلقاء الممتد.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
