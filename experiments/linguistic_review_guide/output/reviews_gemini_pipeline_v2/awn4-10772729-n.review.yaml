        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يدل على الشخص من منظور تاريخي أو ثقافي","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
