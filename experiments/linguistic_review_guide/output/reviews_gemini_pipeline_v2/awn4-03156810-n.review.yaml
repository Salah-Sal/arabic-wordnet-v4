stage1_review:
  assessment:
    concerns:
      - "المصطلح الحالي عبارة عن ترجمة حرفية لمفهوم ثقافي غربي."
      - "عدم وجود مقابل تراثي دقيق نظراً لحداثة المفهوم وارتباطه بالسينما والمسرح الغربي."
    observations: "اللمة الموجودة (فطيرة الكسترد) مقبولة كترجمة اصطلاحية للمفهوم، حيث أنها تعبر بدقة عن مكونات الأداة ووظيفتها في سياق الكوميديا التهريجية (Slapstick)."
  blind_candidates:
    - lemma: "فَطِيرَةُ الكَسْتَرْد"
      generation_method: tarkib
      justification: "الترجمة الحرفية الاصطلاحية للمصطلح الإنجليزي (custard pie)، وهي الأكثر شيوعاً وتداولاً."
    - lemma: "فَطِيرَةُ التَّهْرِيج"
      generation_method: tarkib
      justification: "تسمية وظيفية تربط الأداة بنوع الكوميديا الذي تستخدم فيه (التهريج)."
    - lemma: "فَطِيرَةُ الهَزْل"
      generation_method: tarkib
      justification: "استخدام لفظ (الهزل) كمرادف فصيح للكوميديا، مما يعطي المصطلح صبغة معجمية أمتن."
    - lemma: "فَطِيرَةُ المُهَرِّجِ"
      generation_method: tarkib
      justification: "ربط الأداة بالشخصية التي تستخدمها غالباً (المهرج)."

stage2_evidence:
  per_lemma:
    - lemma: "فَطِيرَةُ الكَسْتَرْد"
      confirm:
        - text: "«طعام شبيه بالمهلبية يُحضَّر من البيض والحليب»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«فطيرة: نوع من أنواع المخبوزات غير المخمرة غنية بالدهن»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
    - lemma: "فَطِيرَةُ التَّهْرِيج"
      confirm:
        - text: "«تَهْرِيج: إضحاك، أو تخليط، أو إثارة الفوضى»"
          source: "معجم الصواب اللغوي"
    - lemma: "فَطِيرَةُ الهَزْل"
      confirm:
        - text: "«الهَزْلُ: نَقِيضُ الجِدِّ»"
          source: "القاموس المحيط"
    - lemma: "فَطِيرَةُ المُهَرِّجِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "فطيرة الكسترد"
      decision: confirmed
      decision_reason: "المصطلح الشائع والمستقر لوصف هذه الأداة في السياق الفني والسينمائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَطِيرَةُ الكَسْتَرْد"
    - lemma: "فَطِيرَةُ التَّهْرِيج"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح وصفي دقيق لوظيفة الأداة في الكوميديا التهريجية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "فَطِيرَةُ التَّهْرِيج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فَطِيرَةُ الهَزْل"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير فصيح ومناسب للسياقات الأدبية والمسرحية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "فَطِيرَةُ الهَزْل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "أداة (في الكوميديا) تتكون من فطيرة مفتوحة مملوءة بالكسترد الحقيقي أو الصناعي؛ تُرمى في الكوميديا التهريجية"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بشكل زائد، ويحتاج لصياغة معجمية أكثر إحكاماً."
    authored:
      - type: terminological
        text: "فطيرةٌ مَفتوحةٌ محشوّةٌ بالكستردِ، تُستخدَمُ كأداةٍ للقذفِ في وجوهِ المُمثِّلينَ في الكوميديا التَّهريجيَّةِ لإثارةِ الضَّحِكِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "فطيرةٌ مَفتوحةٌ محشوّةٌ بالكستردِ، تُستخدَمُ كأداةٍ للقذفِ في وجوهِ المُمثِّلينَ في الكوميديا التَّهريجيَّةِ لإثارةِ الضَّحِكِ."}
  examples:
    per_lemma:
      - lemma: "فَطِيرَةُ الكَسْتَرْد"
        examples:
          - text: "تُعدُّ فطيرةُ الكستردِ من أشهرِ الأدواتِ المُستخدمةِ في مَشاهدِ الكوميديا الصامتة."
            type: usage
      - lemma: "فَطِيرَةُ التَّهْرِيج"
        examples:
          - text: "تلقَّى المهرجُ فطيرةَ التهريجِ على وجهِهِ وسطَ ضحكاتِ الجمهورِ المتواصلة."
            type: usage
      - lemma: "فَطِيرَةُ الهَزْل"
        examples:
          - text: "تعتمدُ بعضُ العروضِ المسرحيةِ على فطيرةِ الهزلِ لإضفاءِ جوٍّ من الفكاهةِ الحركيةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "اشتهرتِ الكوميديا التهريجيةُ بقذفِ فطائرِ الكستردِ في وجوهِ الممثلينَ كجزءٍ من الفكاهةِ البصريةِ."}

