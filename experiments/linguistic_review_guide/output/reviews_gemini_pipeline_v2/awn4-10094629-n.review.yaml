stage1_review:
  assessment:
    concerns:
      - "وجود تعبير وصفي حر (شخص منفتح) بدلاً من مصطلح مسكوك."
    observations: "المفهوم يتعلق بالنمط الشخصي في علم النفس لمن تتجه طاقته واهتماماته نحو الخارج والمجتمع بدلاً من الانطواء على الذات. المصطلح العلمي المعتمد هو الانبساطي أو المنبسط."
  blind_candidates:
    - lemma: "مُنْبَسِط"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (انبسط)، يدل على مَن امتدت طاقته واهتمامه نحو الآخرين، وهو المقابل النفسي المباشر لمصطلح extrovert."
    - lemma: "اِنْبِسَاطِيّ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي نسبة إلى الانبساط، وهو أكثر المصطلحات شيوعاً واستخداماً في علم النفس للإشارة إلى هذا النمط من الشخصية."
    - lemma: "مُنْفَتِح"
      generation_method: majaz
      justification: "مجاز من تفتح الشيء وانفتاحه، للدلالة على الشخص الذي يقبل على العالم الخارجي ولا ينغلق على ذاته."
    - lemma: "ظَاهِرِيّ التَّوَجُّه"
      generation_method: tarkib
      justification: "تركيب وصفي يوضح آلية عمل هذا النمط النفسي بتوجهه نحو العالم الخارجي (الظاهري)."

stage2_evidence:
  per_lemma:
    - lemma: "انْبِسَاطِيّ"
      confirm:
        - text: "صفة لمن يتجه باهتماماته وانفعالاته إلى المواضيع الخارجية."
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "(1) المنبسِط: شخص تتجه اهتماماتُهُ إلى كلّ ما هو خارجٌ عن الذّات (نف)\n(2) انبساطيّ (نف)."
          source: "المورد الحديث (2008)"
    - lemma: "شَخْص مُنْفَتِح"
      evidence_status: no_material_found
    - lemma: "مُنْبَسِط"
      confirm:
        - text: "(نف) فرد يميل للجرأة ويوجّه اهتماماته للآخرين، عكسه منطوٍ."
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "(1) المنبسِط: شخص تتجه اهتماماتُهُ إلى كلّ ما هو خارجٌ عن الذّات (نف)"
          source: "المورد الحديث (2008)"
    - lemma: "مُنْفَتِح"
      evidence_status: no_material_found
    - lemma: "ظَاهِرِيّ التَّوَجُّه"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "انْبِسَاطِيّ"
      decision: confirmed
      decision_reason: "مصطلح نفسي معتمد وموثق بدقة في المعاجم المتخصصة والعامة للدلالة على الشخص الذي تتجه اهتماماته نحو الخارج."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْبِسَاطِيّ"
    - lemma: "شَخْص مُنْفَتِح"
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك، يمكن استبدال عناصره بسهولة (كقولنا: إنسان منفتح أو فرد منفتح)، ولذلك لا يُعد مصطلحاً معجمياً مستقلاً."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "مُنْبَسِط"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح نفسي دقيق وموثق في المعاجم الحديثة للدلالة على الشخص الانبساطي (عكس المنطوي)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُنْبَسِط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "(في علم النفس) شخص يهتم بالحقائق العملية أكثر من الأفكار والمشاعر الداخلية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك في صياغته. صياغة تعريف أدق وأكثر اصطلاحية بناءً على المادة المعجمية المجمعة تزيد من جودة المجموعة الدلالية."
    authored:
      - type: terminological
        text: "(في علم النفس) شَخْصٌ تَتَّجِهُ اهْتِمَامَاتُهُ وانْفِعَالَاتُهُ إِلَى العَالَمِ الخَارِجِيِّ والمَوْضُوعَاتِ المَوْضُوعِيَّةِ، بَدَلًا مِنْ أَنْ تَتَمَرْكَزَ حَوْلَ ذَاتِهِ، وَهُوَ عَكْسُ المُنْطَوِي."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "(في علم النفس) شَخْصٌ تَتَّجِهُ اهْتِمَامَاتُهُ وانْفِعَالَاتُهُ إِلَى العَالَمِ الخَارِجِيِّ والمَوْضُوعَاتِ المَوْضُوعِيَّةِ، بَدَلًا مِنْ أَنْ تَتَمَرْكَزَ حَوْلَ ذَاتِهِ، وَهُوَ عَكْسُ المُنْطَوِي."

  examples:
    per_lemma:
      - lemma: "اِنْبِسَاطِيّ"
        examples:
          - text: "يَتَمَيَّزُ الشَّخْصُ الِانْبِسَاطِيُّ بِحُبِّ المُشَارَكَةِ الِاجْتِمَاعِيَّةِ وَسُهُولَةِ التَّوَاصُلِ مَعَ الآخَرِينَ."
            type: usage
      - lemma: "مُنْبَسِط"
        examples:
          - text: "الْمُنْبَسِطُ فَرْدٌ يَمِيلُ لِلْجُرْأَةِ وَيُوَجِّهُ طَاقَتَهُ وَاهْتِمَامَاتِهِ نَحْوَ مُحِيطِهِ مُبْتَعِدًا عَنِ الْعُزْلَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يَتَمَيَّزُ الشَّخْصُ الِانْبِسَاطِيُّ بِحُبِّ المُشَارَكَةِ الِاجْتِمَاعِيَّةِ وَسُهُولَةِ التَّوَاصُلِ مَعَ الآخَرِينَ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "الْمُنْبَسِطُ فَرْدٌ يَمِيلُ لِلْجُرْأَةِ وَيُوَجِّهُ طَاقَتَهُ وَاهْتِمَامَاتِهِ نَحْوَ مُحِيطِهِ مُبْتَعِدًا عَنِ الْعُزْلَةِ."

