stage1_review:
  assessment:
    concerns:
      - "اللمتان 'كَابِت' و'خَانِق' في الأصل أسماء فاعل تستخدم غالباً كصفات، واستخدامها كاسم فاعل (شخص) قد لا يكون شائعاً بمفرده دون سياق (مثل: كابت الحريات)."
    observations: "المفهوم يشير إلى الشخص الذي يمنع الآخرين من التعبير عن أنفسهم أو يمارس عليهم القهر. اللمات الموجودة تشتق من أفعال الكبت والخنق، وهي ملائمة مجازياً."
  blind_candidates:
    - lemma: "قَامِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل قمع، وهو يؤدي معنى الكبت والقهر بقوة، ويشيع استخدامه للدلالة على الأشخاص."
    - lemma: "مُخْمِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أخمد، يستخدم لمنع التعبير أو تقليل حدة الأشياء، رغم أنه يغلب على الأدوات."
    - lemma: "كَابِت"
      generation_method: ishtiqaq
      justification: "اسم فاعل من كبت، وهو المانع للمشاعر أو للأشخاص."
    - lemma: "خَانِق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من خنق، يستعمل مجازا لمنع التعبير والحريات."

stage2_evidence:
  per_lemma:
    - lemma: "خَانِق"
      expands:
        - text: "«الشُّعبُ الضيقُ بين جبلين الزُّقاق [لغة يمانية] خانقُ النَّمِر...»"
          source: "المعجم الوسيط"
        - text: "«يُمكن تركيب الخانق على الوحدات البنيوماتية، حيث يعمل على تقليص المقطع العرضي...»"
          source: "مسرد هندسة وتكنولوجيا السيارات"
    - lemma: "كَابِت"
      confirm:
        - text: "«كَابِت من (ك ب ت) الحابس غيظه أو شهوته، والغائظ والمذل غيره.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "قَامِع"
      evidence_status: "no_material_found"
    - lemma: "مُخْمِد"
      expands:
        - text: "«إذا رأيتَه ساكِنًا لا يتَحَرَّكُ»"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "خَانِق"
      decision: confirmed
      decision_reason: "لها استخدام مجازي بمعنى التضييق ومنع التنفس أو التعبير، ورغم غلبة استخدامها للمكان أو الأداة، يمكن استخدامها كاسم فاعل للشخص."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَانِق"
    - lemma: "كَابِت"
      decision: confirmed
      decision_reason: "مدعومة معجمياً كاسم فاعل يدل على من يحبس مشاعر الآخرين أو يقهرهم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَابِت"
    - lemma: "قَامِع"
      source: stage1
      decision: confirmed
      decision_reason: "من أكثر الكلمات شيوعاً للتعبير عن الشخص الذي يقمع الحريات أو يمنع التعبير، وهي تؤدي المعنى بدقة أكبر من اللمات الموجودة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "قَامِع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10675662-n"
    - lemma: "مُخْمِد"
      source: stage1
      decision: removed
      decision_reason: "استخدامها يغلب على الأدوات والآلات (مثل مخمد الصدمات أو مخمد الصوت) ونادراً ما تستخدم للتعبير عن شخص."

stage4_content:
  definition:
    current: "شخص يكبت أو يخنق أو يقمع"
    assessment:
      decision: revise
      reason: "التعريف الحالي عبارة عن ترجمة حرفية، يفضل صياغته بأسلوب معجمي عربي سليم."
    authored:
      - type: terminological
        text: "شخص يقوم بقمع الآخرين أو كبت حرياتهم ومنعهم من التعبير عن أنفسهم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10675662-n"
          definition_index: 0
          text: "شخص يقوم بقمع الآخرين أو كبت حرياتهم ومنعهم من التعبير عن أنفسهم."
  examples:
    per_lemma:
      - lemma: "خَانِق"
        examples:
          - text: "كان الحاكم خانقاً لكل أشكال المعارضة في البلاد."
            type: usage
      - lemma: "كَابِت"
        examples:
          - text: "تصرف ككابت لطموحات من حوله."
            type: usage
      - lemma: "قَامِع"
        examples:
          - text: "واجه الشعب القامع بشجاعة ورفض التخلي عن حقوقه."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كان الحاكم خانقاً لكل أشكال المعارضة في البلاد."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تصرف ككابت لطموحات من حوله."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "واجه الشعب القامع بشجاعة ورفض التخلي عن حقوقه."

