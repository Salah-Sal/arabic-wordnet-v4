stage1_review:
  assessment:
    concerns:
      - "طرف القوس ليس المصطلح التقني الأدق؛ فهو ترجمة حرفية للمصطلح الإنجليزي 'tip' غالباً، بينما 'limb' في الرماية تشمل نصف القوس كاملاً."
      - "نقص المصطلحات التراثية لأجزاء القوس (مثل السية والبيت)."
    observations: "المفهوم يشير إلى 'ذراع القوس' (Limb)، وهو الجزء الممتد من المقبض (Riser/Handle) إلى الطرف (Tip). في الرماية العربية القديمة، يسمى هذا الجزء 'بيتاً' أو 'سية' (إذا قُصد به الطرف المنحني)، وفي الرماية الحديثة يسمى 'ذراع القوس'."
  blind_candidates:
    - lemma: "ذِرَاع القَوْس"
      generation_method: ishtiqaq
      justification: "المصطلح المعاصر الأكثر دقة في الرماية الرياضية للتعبير عن الـ (Limb)."
    - lemma: "سِيَة"
      generation_method: majaz
      justification: "مصطلح تراثي يشير إلى ما عُطف من طرفي القوس، ويُستخدم أحياناً للإشارة إلى النصف كاملاً."
    - lemma: "بَيْت القَوْس"
      generation_method: majaz
      justification: "مصطلح تراثي يشير إلى الجزء الأكبر من نصف القوس بين المقبض والطرف."
    - lemma: "يَد القَوْس"
      generation_method: majaz
      justification: "مصطلح تراثي يُطلق على السية العليا (النصف العلوي)."

stage2_evidence:
  per_lemma:
    - lemma: "طرف القوس"
      evidence_status: "no_material_found"
    - lemma: "سِيَة"
      confirm:
        - text: "«السية من القوس: ما عطف من طرفيها. وهما: سيتان»"
          source: "المعجم الوسيط"
        - text: "«ما عُطِف من طَرَفيِ القَوْسِ. وقِيل: رأسُها، أو ما اعْوَجَّ من رأسِها.»"
          source: "المعجم الكبير"
    - lemma: "يَد القَوْس"
      confirm:
        - text: "«ويقال: يَدُ القوس، للسِّية العليا، ورِجْلُها، للسِّية السُّفْلَى.»"
          source: "المعجم الكبير"
    - lemma: "ذِرَاع القَوْس"
      expands:
        - text: "«جسر الوتر: جسر مع عوارض دعم تتكون من شفة سفلية مستقيمة توفر التعادل لمقاومة الشفة العلوية المقوسة (bow-string bridge)»"
          source: "المعجم الموحد لمصطلحات النقل"
          addition: "يؤكد استخدام 'مقوسة' و'قوس' في السياقات الهندسية، و'ذراع' هو المصطلح الشائع في الرماية الحديثة."

stage3_analysis:
  per_lemma:
    - lemma: "طرف القوس"
      decision: confirmed
      decision_reason: "مقبول كترجمة وصفية عامة وموجود في المجموعة الأصلية، لكنه يحتاج إلى تشكيل دقيق."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَرَف القَوْس"
    - lemma: "ذِرَاع القَوْس"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح المعياري الحديث في الرماية الرياضية (Limb)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "ذِرَاع القَوْس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "سِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي أصيل وموثق في المعاجم (الوسيط، الكبير) لوصف هذا الجزء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سِيَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بَيْت القَوْس"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي يشير إلى الامتداد الأكبر من نصف القوس."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "بَيْت القَوْس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "يَد القَوْس"
      source: stage1
      decision: confirmed
      decision_reason: "تسمية تراثية للنصف العلوي من القوس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "يَد القَوْس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "رِجْل القَوْس"
      source: stage1
      decision: confirmed
      decision_reason: "تسمية تراثية للنصف السفلي من القوس (مقابل يد القوس)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "رِجْل القَوْس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "أحد نصفي القوس من المقبض إلى الطرف"
    assessment:
      decision: revise
      reason: "الصياغة الحالية جيدة ولكن يمكن تحسينها لتكون أكثر دقة واحترافية باستخدام المصطلح المعياري."
    authored:
      - type: terminological
        text: "كلٌّ من شقَّي القَوْس الممتدَّين من الكَبِد (المقبض) إلى السِّيتين (الطرفين)."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "كلٌّ من شقَّي القَوْس الممتدَّين من الكَبِد (المقبض) إلى السِّيتين (الطرفين)."}
  examples:
    per_lemma:
      - lemma: "ذِرَاع القَوْس"
        examples:
          - text: "صُنعت أذرع القوس الحديثة من ألياف الكربون لزيادة مرونتها وقوة دفعها."
            type: usage
      - lemma: "سِيَة"
        examples:
          - text: "انكسرت سِيَةُ القوس عند شدِّ الوتر بقوة مفرطة."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يجب فحص ذراعي القوس قبل الرماية للتأكد من خلوهما من الشقوق."}

stage5_enrichment:
  per_entry:
    - lemma: "سِيَة"
      entry_id: "{auto}"
      root: "سوي"
      maqayis_quote: "«السِّينُ وَالْوَاوُ وَالْيَاءُ أَصْلٌ يَدُلُّ عَلَى اسْتِقَامَةٍ وَاعْتِدَالٍ بَيْنَ شَيْئَيْنِ.»"
    - lemma: "ذِرَاع القَوْس"
      entry_id: "{auto}"
      roots:
        - word: "ذراع"
          root: "ذرع"
          maqayis_quote: "«الذَّالُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى بَسْطِ الشَّيْءِ وَمَدِّهِ.»"
        - word: "قوس"
          root: "قوس"
          maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالسِّينُ أَصْلٌ يَدُلُّ عَلَى الِانْحِنَاءِ.»"
  per_sense:
    - lemma: "طَرَف القَوْس"
      sense_id: "{auto}"
      nuance: "تعبير وصفي عام."
      mwe: true
    - lemma: "ذِرَاع القَوْس"
      sense_id: "{auto}"
      nuance: "المصطلح المعياري الحديث (Limb)."
      mwe: true
    - lemma: "سِيَة"
      sense_id: "{auto}"
      nuance: "مصطلح تراثي يشير تحديداً إلى الطرف المنحني من القوس."
      mwe: false
    - lemma: "بَيْت القَوْس"
      sense_id: "{auto}"
      nuance: "يشير إلى الامتداد الداخلي للنصف."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"سوي","maqayis":"«السِّينُ وَالْوَاوُ وَالْيَاءُ أَصْلٌ يَدُلُّ عَلَى اسْتِقَامَةٍ وَاعْتِدَالٍ بَيْنَ شَيْئَيْنِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"ذراع","root":"ذرع","maqayis":"«الذَّالُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى بَسْطِ الشَّيْءِ وَمَدِّهِ.»"},{"word":"قوس","root":"قوس","maqayis":"«الْقَافُ وَالْوَاوُ وَالسِّينُ أَصْلٌ يَدُلُّ عَلَى الِانْحِنَاءِ.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح المعياري الحديث (Limb)","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
