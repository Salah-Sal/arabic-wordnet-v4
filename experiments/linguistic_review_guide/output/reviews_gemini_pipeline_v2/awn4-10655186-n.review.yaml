stage1_review:
  assessment:
    concerns:
      - "استخدام 'أبو الهول' كدلالة على الشخص الغامض هو اقتراض مفهومي أو مجاز من اللغات الأوروبية (مثل الإنجليزية Sphinx)، ورغم شيوعه في الأدب الحديث فإنه يبدو مجازاً استعارياً وليس مصطلحاً معجمياً مستقلاً للتعبير عن هذا المعنى البشري البحت."
      - "اللمة 'غامض' صفة عامة، ولا تخص الإنسان حصراً، ولكنها تفي بالغرض إذا استُخدمت كصفة مشبهة تدل على الشخص."
    observations: "المفهوم يشير إلى شخص يخفي مشاعره ونواياه ويصعب قراءته. في العربية التعبير عن هذا المعنى يتم عادة باستخدام صفات مبالغة مثل 'كتوم' أو صفات مشبهة مثل 'غامض'، أو باستخدام التشبيه 'كأبي الهول' أو 'صندوق مغلق'."
  blind_candidates:
    - lemma: "كَتُوم"
      generation_method: ishtiqaq
      justification: "مشتق من كتم بمعنى أخفى، وصيغة مبالغة على وزن فَعُول للدلالة على المبالغة في كتمان الأسرار والمشاعر."
    - lemma: "لُغْز"
      generation_method: majaz
      justification: "استخدام مجازي لكلمة لغز التي تعني الأحجية أو الكلام المعمّى، للإشارة إلى الشخص الذي يصعب فهم نواياه."
    - lemma: "طِلْسَم"
      generation_method: majaz
      justification: "تعبير مجازي عن الشخص الغامض استعارةً من الطلسم الذي يرمز إلى الشيء المبهم أو المكتوب برموز سحرية معقدة."
    - lemma: "مُسْتَغْلِق"
      generation_method: ishtiqaq
      justification: "من الفعل استغلق، أي صار مغلقاً يصعب فهمه، ويستعمل مجازاً للشخص المنغلق على نفسه."

stage2_evidence:
  per_lemma:
    - lemma: "أَبُو الْهَوْل"
      confirm:
        - text: "أبو الهول: sphinx"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "تمثال فرعونىّ بجانب أهرام الجيزة"
          source: "المعجم الكبير"
          conflict: "تدل على التمثال أو الأثر التاريخي وليس على الشخص الموصوف بالغموض (رغم إمكانية استخدامه مجازاً)."
    - lemma: "غَامِض"
      confirm:
        - text: "غامض؛ مُبْهَم؛ مُلْغَز: inscrutable"
          source: "المورد الحديث (2008)"
      expands:
        - text: "(الغامض) الْخَفي يُقَال حسب غامض غير مَعْرُوف وَكَلَام غامض غير وَاضح وَرجل غامض فاتر عَن الحملة خامل"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يدل على الخفاء وعدم الوضوح بشكل عام، ويطلق على الرجل الفاتر، إلا أن المعنى الحديث اتسع ليشمل غموض الشخصية والنوايا."
    - lemma: "كَتُوم"
      confirm:
        - text: "كَتوم؛ متكتِّم؛ متحفِّظ: secretive"
          source: "المورد الحديث (2008)"
      expands:
        - text: "سحاب كتوم لَا رعد فِيهِ"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "تستخدم الكلمة للدلالة على المبالغة في الكتمان سواء للسر أو للمشاعر."
    - lemma: "لُغْز"
      evidence_status: "no_material_found"
    - lemma: "طِلْسَم"
      expands:
        - text: "الساحر وَنَحْوه كتب طلسما وَالشَّيْء عمل لَهُ طلسما وَمن كَلَام الصُّوفِيَّة سر مطلسم وحجاب مطلسم وَذَات مطلسم غامض"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يدل على الشيء الغامض والمبهم، ويستعمل أحياناً كصفة للشيء المعقد، ولكنه لا يطلق عادة كاسم مستقل على الشخص بحد ذاته إلا على سبيل التشبيه البليغ."
    - lemma: "مُسْتَغْلِق"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أَبُو الْهَوْل"
      decision: confirmed
      decision_reason: "شاع استخدام هذا التعبير مجازياً في العربية الحديثة للدلالة على الشخص الصامت الذي يصعب فهم ما يدور في خلده، متأثراً بالاستخدامات الأوروبية (Sphinx)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَبُو الْهَوْل"
    - lemma: "غَامِض"
      decision: confirmed
      decision_reason: "من أكثر الكلمات العربية دقة وشيوعاً للتعبير عن الشخص الذي يخفي نواياه ويصعب فهمه، وتُستخدم كصفة مشبهة تقوم مقام الاسم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَامِض"
    - lemma: "كَتُوم"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة أصيلة وصيغة مبالغة تعبر بدقة عن الشخص الذي يبالغ في كتمان أسراره ومشاعره ونواياه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "كَتُوم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10655186-n"
    - lemma: "طِلْسَم"
      source: stage1
      decision: removed
      decision_reason: "يُستخدم في العادة للأشياء المبهمة والألغاز أكثر من استخدامه المباشر كاسم يدل على شخص."
    - lemma: "لُغْز"
      source: stage1
      decision: removed
      decision_reason: "استخدام مجازي بحت لا يصلح كلمة معجمية مستقلة للدلالة على الشخص في هذا السياق، وهناك بدائل أدق."
    - lemma: "مُسْتَغْلِق"
      source: stage1
      decision: removed
      decision_reason: "يُستعمل عادة للكلام أو الأمور التي يصعب فهمها (استغلق عليه الأمر)، ونادراً ما يُطلق على الشخص."

stage4_content:
  definition:
    current: "شخص غامض يحتفظ بأفكاره ونواياه سراً"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يستخدم إحدى اللمات (غامض) في متنه، مما يسبب دوراناً معجمياً. الأفضل استبدالها بصياغة لا تعتمد على اللمة."
    authored:
      - type: linguistic
        text: "شخص لا يُظهِر ما في نفسه من أفكار ومشاعر ونوايا، مما يجعله خفياً يصعب على الآخرين فهمه أو التنبؤ بتصرفاته."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10655186-n"
          definition_index: 0
          text: "شخص لا يُظهِر ما في نفسه من أفكار ومشاعر ونوايا، مما يجعله خفياً يصعب على الآخرين فهمه أو التنبؤ بتصرفاته."

  examples:
    per_lemma:
      - lemma: "أَبُو الْهَوْل"
        examples:
          - text: "بقي جالسًا كأبي الهول طوال الاجتماع، لم ينطق بكلمة ولم تبدُ عليه أية انفعالات."
            type: usage
      - lemma: "غَامِض"
        examples:
          - text: "إنه رجل غامض، لا أحد يعرف حقيقة نواياه أو ما يخطط له."
            type: usage
      - lemma: "كَتُوم"
        examples:
          - text: "عُرف عنه أنه شخص كتوم، يحتفظ بأسراره لنفسه ولا يشارك أفكاره مع أحد."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "بقي جالسًا كأبي الهول طوال الاجتماع، لم ينطق بكلمة ولم تبدُ عليه أية انفعالات."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "إنه رجل غامض، لا أحد يعرف حقيقة نواياه أو ما يخطط له."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "عُرف عنه أنه شخص كتوم، يحتفظ بأسراره لنفسه ولا يشارك أفكاره مع أحد."

