    - lemma: "مِجَسّ نَبْض"
      entry_id: "{auto}"
      roots:
        - word: "مجس"
          root: "جسس"
          maqayis_quote: "«الْجِيمُ وَالسِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ تَعَرُّفُ الشَّيْءِ بِمَسٍّ لِطَيْفٍ.»"
        - word: "نبض"
          root: "نبض"
          maqayis_quote: "«النُّونُ وَالْبَاءُ وَالضَّادُ أُصَيْلٌ يَدُلُّ عَلَى حَرَكَةٍ أَوْ تَحْرِيكٍ.»"
  per_sense:
    - lemma: "مِجَسّ نَبْض"
      sense_id: "{auto}"
