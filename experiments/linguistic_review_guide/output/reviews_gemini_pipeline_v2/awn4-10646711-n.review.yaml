        key: note
        value: '{"roots":[{"word":"مجس","root":"جسس","maqayis":"«الْجِيمُ وَالسِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ تَعَرُّفُ الشَّيْءِ بِمَسٍّ لِطَيْفٍ.»"},{"word":"نبض","root":"نبض","maqayis":"«النُّونُ وَالْبَاءُ وَالضَّادُ أُصَيْلٌ يَدُلُّ عَلَى حَرَكَةٍ أَوْ تَحْرِيكٍ.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُستخدم كاستعارة معاصرة للدلالة على الشخص الذي يُختبر عليه مدى تقبل الأفكار قبل نشرها.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
