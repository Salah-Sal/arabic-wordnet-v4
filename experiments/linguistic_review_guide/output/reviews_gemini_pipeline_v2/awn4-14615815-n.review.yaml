      sense_id: "{auto}"
      nuance: "اللفظ العام والشامل للأثر المادي الناتج عن التفاعل الكيميائي أو الاستقرار الميكانيكي."
      mwe: false
    - lemma: "رُسَابَة"
      sense_id: "{auto}"
      nuance: "أكثر تخصيصاً للمادة التي استقرت فعلياً في الأسفل، وتستخدم في السياقات الفنية المخبرية."
      mwe: false
    - lemma: "عُكَارَة"
      sense_id: "{auto}"
      nuance: "تفيد معنى الكدر وعدم الصفاء الذي يترسب في السوائل غير الرائقة."
      mwe: false
