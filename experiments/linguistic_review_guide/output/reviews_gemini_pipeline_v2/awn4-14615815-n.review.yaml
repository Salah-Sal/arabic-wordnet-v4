stage1_review:
  assessment:
    concerns:
      - "الاكتفاء بلمة واحدة (راسب) رغم وجود مترادفات معجمية وعلمية دقيقة."
    observations: "المجموعة تعبر عن المادة التي تنفصل عن السائل وتستقر في الأسفل، وهي تشمل المعنى الكيميائي (Precipitate) والمعنى العام للرواسب (Sediment/Dregs). اللمة الموجودة صحيحة تماماً لكنها تحتاج لتعزيز بمصطلحات فنية وأخرى تراثية فصيحة."
  blind_candidates:
    - lemma: "رَاسِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رسب، وهو المصطلح الأشهر علمياً ولغوياً للمادة المترسبة."
    - lemma: "رُسَابَة"
      generation_method: ishtiqaq
      justification: "على وزن (فُعالة) الذي يدل غالباً على البقايا أو الفضلات (كالحثالة والنفاية)، وهو مصطلح علمي دقيق للمادة المترسبة."
    - lemma: "ثُفْل"
      generation_method: majaz
      justification: "لفظ تراثي فصيح لما استقر تحت الشيء من كدر، وهو مرادف دقيق لما يبقى بعد التصفية أو الاستقرار."
    - lemma: "عُكَارة"
      generation_method: ishtiqaq
      justification: "من العكر، وتستخدم لوصف ما ترسب من الشيء غير الصافي في قعر الإناء."

stage2_evidence:
  per_lemma:
    - lemma: "راسب"
      confirm:
        - text: "«(فى الكيمياء): المادَّة التى تَنْفَصِلُ من المحلول نتيجة لتغَيُّرٍ كيميائىٍّ أو فيزيقىٍّ (فى الجيولوجيا): ما تجمع من المواد الطبيعية واستقر فى موضعه»"
          source: "المعجم الكبير"
        - text: "«المترسِّب؛ الراسب (ك)»"
          source: "المورد الحديث"
    - lemma: "رُسَابَة"
      confirm:
        - text: "«ما يَرْسُبُ أَسْفَلَ الإناءِ والنَّهْر والمَسِيل»"
          source: "المعجم الكبير"
        - text: "«ما يَرْسُب أسفل الإناء والنهر والمسيل»"
          source: "المعجم الوسيط"
        - text: "«precipitate ... مادة مرسبة، رُسابَة»"
          source: "المعجم الموحد لمصطلحات المياه"
    - lemma: "عُكارة"
      confirm:
        - text: "«ما ترسَّب من شيء غير صافٍ 'ترسَّبت العُكارةُ في قعر الإناء'»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "ثُفْل"
      confirm:
        - text: "«ما استقرَّ تحت الماء ونحوه من كدر ما يتبقى من المادّة بعد عصيرها»"
          source: "المعجم الوسيط"
        - text: "«ما سَفَل من كُلِّ شَيْءٍ ... وهو ما اسْتَقَرَّ تَحْتَه من كُدْرَة»"
          source: "المعجم الكبير"
    - lemma: "دُرْدِيّ"
      confirm:
        - text: "«ما رسب أسفل العسل والزيت ونحوهما من كل شيء مائع كالأشربة والأدهان»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "راسب"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والأكثر شيوعاً في الاستعمال العلمي المعاصر (الكيمياء والجيولوجيا)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَاسِب"
    - lemma: "رُسَابَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق مستخدم في المعاجم العلمية الموحدة (المياه، الصيدلة، الطب) ويوافق القياس الصرفي لما يتبقى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رُسَابَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "عُكَارَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ شائع الاستعمال لوصف الرواسب في السوائل غير الصافية، وموثق في المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عُكَارَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ثُفْل"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي فصيح يعبر عن المادة المستقرة في الأسفل، ويغطي الجانب اللغوي للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ثُفْل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "دُرْدِيّ"
      decision: confirmed
      decision_reason: "لفظ فصيح متخصص في رواسب الموائع (الزيت، العسل، الشراب)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دُرْدِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "مادة صلبة مترسبة في معلق أو بعد الاستقرار أو الترشيح"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أكثر إحكاماً وشمولاً للمعنيين الكيميائي والعام."
    authored:
      - type: terminological
        text: "ما يرسُبُ ويستقِرُّ في قاعِ المائعِ من كَدَرٍ أو مادةٍ صُلبةٍ انفصلت عنه بالترشيح أو بتفاعلٍ كيميائيٍّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "ما يرسُبُ ويستقِرُّ في قاعِ المائعِ من كَدَرٍ أو مادةٍ صُلبةٍ انفصلت عنه بالترشيح أو بتفاعلٍ كيميائيٍّ."}
  examples:
    per_lemma:
      - lemma: "رَاسِب"
        examples:
          - text: "يتكوَّنُ رَاسِبٌ أبيضُ من كلوريد الفضة عند إضافة المحلول."
            type: usage
      - lemma: "رُسَابَة"
        examples:
          - text: "أظهر التحليلُ المجهريُّ للرُّسَابَة وجودَ معادنَ ثقيلة."
            type: usage
      - lemma: "عُكَارَة"
        examples:
          - text: "تجمَّعتِ العُكَارَةُ في قعر زجاجة الزيت القديمة."
            type: usage
      - lemma: "ثُفْل"
        examples:
          - text: "بقي ثُفْلُ الشاي في أسفلِ الكوب."
            type: usage
      - lemma: "دُرْدِيّ"
        examples:
          - text: "كان دُرْدِيُّ العسلِ صافياً وذا رائحةٍ زكية."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يتكوَّنُ رَاسِبٌ أبيضُ من كلوريد الفضة عند إضافة المحلول."}

stage5_enrichment:
  per_entry:
    - lemma: "رَاسِب"
      entry_id: "{auto}"
      root: "رسب"
      maqayis_quote: "«الرَّاءُ وَالسِّينُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، هُوَ ذَهَابُ الشَّيْءِ سُفْلًا مِنْ ثَِقَلٍ.»"
    - lemma: "رُسَابَة"
      entry_id: "{auto}"
      root: "رسب"
      maqayis_quote: "«الرَّاءُ وَالسِّينُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، هُوَ ذَهَابُ الشَّيْءِ سُفْلًا مِنْ ثَِقَلٍ.»"
    - lemma: "ثُفْل"
      entry_id: "{auto}"
      root: "ثفل"
      maqayis_quote: "«الثَّاءُ وَالْفَاءُ وَاللاَّمُ أَصْلٌ وَاحِدٌ، وَهُوَ الشَّيْءُ يَسْتَقِرُّ تَحْتَ الشَّيْءِ، يَكُونُ ذَلِكَ مِنَ الْكَدَرِ وَغَيْرِهِ.»"
    - lemma: "عُكَارَة"
      entry_id: "{auto}"
      root: "عكر"
      maqayis_quote: "«الْعَيْنُ وَالْكَافُ وَالرَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى مِثْلِ مَا دَلَّ عَلَيْهِ الَّذِي قَبْلَهُ مِنَ التَّجَمُّعِ وَالتَّرَاكُمِ ... الْعَكِرُ: دُرْدِيُّ الزَّيْتِ.»"
    - lemma: "دُرْدِيّ"
      entry_id: "{auto}"
      root: "درد"
      maqayis_quote: "لم يورد ابن فارس مادة (درد) في مقاييسه بهذا المعنى، والكلمة من فصيح المولد أو المعرب القديم."
  per_sense:
