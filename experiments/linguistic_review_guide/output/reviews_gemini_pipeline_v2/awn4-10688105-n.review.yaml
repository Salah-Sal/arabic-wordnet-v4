    current: "شخص يخضع لإجراءات تجريبية أو رصدية؛ شخص هو موضوع تحقيق"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق، شامل، ويغطي جوانب الخضوع للتجربة والرصد في البحث العلمي."
  examples:
    per_lemma:
      - lemma: "خَاضِع لِلتَّجْرِبَة"
        examples:
          - text: "يَجِبُ الحُصُولُ عَلَى مُوَافَقَةِ الخَاضِعِ لِلتَّجْرِبَةِ قَبْلَ بَدْءِ البَحْثِ السَّرِيرِيِّ."
            type: usage
      - lemma: "مَوْضُوعُ الدِّرَاسَة"
        examples:
          - text: "كَانَ الشَّابُّ هُوَ مَوْضُوعَ الدِّرَاسَةِ فِي البَحْثِ النَّفْسِيِّ عَنِ الاِكْتِئَابِ."
            type: usage
      - lemma: "مَبْحُوث"
        examples:
          - text: "تَمَّ اخْتِيَارُ المَبْحُوثِينَ بِطَرِيقَةٍ عَشْوَائِيَّةٍ لِضَمَانِ مَوْضُوعِيَّةِ الدِّرَاسَةِ المَسْحِيَّةِ."
