stage1_review:
  assessment:
    concerns:
      - اللمّتان الحاليتان (خاضع للتجربة، موضوع الدراسة) عبارة عن تعابير وصفية وليستا مصطلحات مسكوكة من كلمة واحدة، بالرغم من شيوع استخدامهما.
      - "موضوع الدراسة" مصطلح عام جداً يطلق على الأشياء والأشخاص على حد سواء، بينما التعريف يختص بالشخص (a person).
    observations: "المفهوم يشير إلى الشخص الذي تُجرى عليه التجارب أو الدراسات. في السياقات البحثية والأكاديمية، يُستخدم مصطلح 'مَبْحُوث' بكثرة. وفي السياقات الطبية والإكلينيكية يُعَبَّر عنه بكلمة 'حَالَة'. أما التعبير المجازي الشائع المقابل لـ (guinea pig) فهو 'فَأْر تَجَارِب'."
  blind_candidates:
    - lemma: "مَبْحُوث"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن مفعول من الفعل بحث، للدلالة على من يقع عليه فعل البحث والدراسة، وهو مصطلح شائع في المنهجية."
    - lemma: "مُجَرَّبٌ عَلَيْه"
      generation_method: tarkib
      justification: "تركيب وصفي يحدد الشخص الذي تُجرى عليه التجربة، متوافق مع الدلالة."
    - lemma: "حَالَة"
      generation_method: majaz
      justification: "استخدام مجازي لإطلاق اسم الحالة المدروسة على الشخص نفسه، شائع في الطب وعلم النفس."
    - lemma: "فَأْرُ تَجَارِب"
      generation_method: tarkib
      justification: "تركيب إضافي مجازي استُعير من الحيوان الذي تُجرى عليه التجارب ليُطلق على الإنسان في نفس الموقف."

stage2_evidence:
  per_lemma:
    - lemma: "مَبْحُوث"
      confirm:
        - text: "«مَبْحُوث: من (ب ح ث) الأمر المجتهد فيه والمتعرف على حقيقته.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "حَالَة"
      confirm:
        - text: "«حالة (case): شخص غريب الأطوار He's a case.. حالة تستحقّ الدَّرس»"
          source: "المورد الحديث (2008)"
        - text: "«حالة (case)»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا"
    - lemma: "فَأْرُ تَجَارِب"
      confirm:
        - text: "«خِنزير غينيا؛ خِنزير الهند (guinea pig) - حقل التجارب: كلّ ما يُتَّخَذُ موضوعًا أو وسيلةً لإجراء البحوث والدراسات العلمية.»"
          source: "المورد الحديث (2008)"
    - lemma: "مُجَرَّبٌ عَلَيْه"
      evidence_status: "no_material_found"
    - lemma: "خَاضِع لِلتَّجْرِبَة"
      confirm:
        - text: "«الشَّخص؛ الموضوع: شخص تُدْرَس ارتكاساتُهُ أو استجاباته (subject)»"
          source: "المورد الحديث (2008)"
        - text: "«قابلٌ لِـ؛ خاضِعٌ لِـ subject to discussion»"
          source: "المورد الحديث (2008)"
    - lemma: "مَوْضُوع الدِّرَاسَة"
      confirm:
        - text: "«الموضوع: موضوع الدراسة أو الكتاب إلخ (subject matter).»"
          source: "المورد الحديث (2008)"

