      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"لهب","maqayis":"«اللَّامُ وَالْهَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح العلمي المعرب المباشر","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"بديل عربي أصيل مقترح","mwe":false}'
    - command: set_metadata
