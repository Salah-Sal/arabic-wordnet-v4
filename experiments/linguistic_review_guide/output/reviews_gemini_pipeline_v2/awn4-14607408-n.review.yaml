      entry_id: "{auto}"
    - lemma: "اللَّاهُوب"
      entry_id: "{auto}"
      root: "لهب"
      maqayis_quote: "«اللَّامُ وَالْهَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ، وَهُوَ ارْتِفَاعُ لِسَانِ النَّارِ، ثُمَّ يُقَاسُ عَلَيْهِ مَا يُقَارِبُهُ. مِنْ ذَلِكَ اللَّهَبُ: لَهَبُ النَّارِ.»"
  per_sense:
    - lemma: "فَلُوجِسْتُون"
      sense_id: "{auto}"
      nuance: "المصطلح العلمي المعرب المباشر والأكثر تداولاً في الكتب الأكاديمية."
