stage1_review:
  assessment:
    concerns: []
    observations: "تتمحور دلالة هذه المجموعة حول السلطة وإصدار الأوامر. اللمات الحالية (حاكم، عاهل) تعبر بشكل جيد عن المفهوم، مع ملاحظة أن 'عاهل' تخصص عادة للملك الأعظم. يمكن إثراء المجموعة بكلمات أعم كـ 'آمِر' و'سُلْطَان' لتغطية المفهوم من زوايا مختلفة."
  blind_candidates:
    - lemma: "حَاكِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'حكم'، وهو اللفظ الأشهر لمن يتولى الحكم ويفصل بين الناس."
    - lemma: "آمِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'أمر'، ويعبر بدقة عن الشق الثاني من التعريف الإنجليزي (commands)."
    - lemma: "زَعِيم"
      generation_method: ishtiqaq
      justification: "الزعيم هو الرئيس أو سيد القوم، وقد يتولى سلطة الأمر والنهي في جماعته."
    - lemma: "سُلْطَان"
      generation_method: majaz
      justification: "إطلاق مجازي للمصدر (السلطان بمعنى القوة والقهر) على صاحبه الذي يمتلك الحكم."

stage2_evidence:
  per_lemma:
    - lemma: "حاكم"
      confirm:
        - text: "«(الْحَاكِم) من نصب للْحكم بَين النَّاس (ج) حكام»"
          source: "المعجم الوسيط"
    - lemma: "عاهل"
      confirm:
        - text: "«(العاهل) الْملك الْأَعْظَم يحكم شعوبا مُخْتَلفَة كالخليفة والامبراطور (ج) عواهل»"
          source: "المعجم الوسيط"
    - lemma: "آمر"
      confirm:
        - text: "«(1) الآمر (2) القائد (3) رئيس الجمعية»"
          source: "المورد الحديث"
    - lemma: "زعيم"
      confirm:
        - text: "«(الزعيم) الرئيس وَالْكَفِيل (ج) زعماء»"
          source: "المعجم الوسيط"
    - lemma: "سلطان"
      confirm:
        - text: "«(السُّلْطَان) الْملك أَو الْوَالِي (ج) سلاطين وَهِي سلطانة وَالْقُوَّة والقهر وَالْحجّة والبرهان»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "حاكم"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والمباشر للتعبير عن الشخص الذي يتولى الحكم، ويطرد استعماله في هذا السياق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَاكِم"
    - lemma: "عاهل"
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على الملك الأعظم، يندرج تماماً تحت معنى الحاكم ذي السلطة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَاهِل"
    - lemma: "آمِر"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل دقيق يعبر عن 'الذي يصدر الأوامر' ويقابل الكلمة الإنجليزية (commander)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "آمِر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "سُلْطَان"
      source: stage1
      decision: confirmed
      decision_reason: "يطلق على الملك أو الوالي ذي السلطة المطلقة، وهو إطلاق شائع جداً وتراثي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "سُلْطَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "زَعِيم"
      source: stage1
      decision: removed
      decision_reason: "الزعيم يشير أكثر إلى القيادة السياسية أو الاجتماعية (الرئيس، الكفيل) ولا يعني بالضرورة امتلاك سلطة الحكم والأمر المباشر في هذا السياق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "شخص يحكم أو يأمر"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه أقرب للترجمة الحرفية، صياغة تعريف مصطلحي يعزز وضوح المفهوم."
    authored:
      - type: terminological
        text: "شخص يمتلك السلطة لحكم الناس وإصدار الأوامر."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخص يمتلك السلطة لحكم الناس وإصدار الأوامر."

  examples:
    per_lemma:
      - lemma: "حَاكِم"
        examples:
          - text: "أصدر الحاكم قراراً بالعفو عن عدد من السجناء."
            type: usage
      - lemma: "عَاهِل"
        examples:
          - text: "التقى عاهل البلاد بعدد من المسؤولين لمناقشة الأزمات الراهنة."
            type: usage
      - lemma: "آمِر"
        examples:
          - text: "نفذ الجنود تعليمات الآمر بدقة وصرامة."
            type: usage
      - lemma: "سُلْطَان"
        examples:
          - text: "بسط السلطان نفوذه على أرجاء الإمبراطورية."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أصدر الحاكم قراراً بالعفو عن عدد من السجناء."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "التقى عاهل البلاد بعدد من المسؤولين لمناقشة الأزمات الراهنة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "نفذ الجنود تعليمات الآمر بدقة وصرامة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "بسط السلطان نفوذه على أرجاء الإمبراطورية."

stage5_enrichment:
  per_entry:
    - lemma: "حَاكِم"
      entry_id: "{auto}"
      root: "حكم"
      maqayis_quote: "«الْحَاءُ وَالْكَافُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ الْمَنْعُ. وَأَوَّلُ ذَلِكَ الْحُكْمُ، وَهُوَ الْمَنْعُ مِنَ الظُّلْمِ.»"
    - lemma: "عَاهِل"
      entry_id: "{auto}"
      root: "عهل"
      maqayis_quote: "«الْعَاهِلُ: الْمَلِكُ لَيْسَ الَّذِي فَوْقَهُ أَحَدٌ إِلَّا اللَّهُ - تَعَالَى -. يُقَالُ لِلْخَلِيفَةِ: عَاهِلٌ.»"
    - lemma: "آمِر"
      entry_id: "{auto}"
      root: "امر"
      maqayis_quote: "«الْهَمْزَةُ وَالْمِيمُ وَالرَّاءُ أُصُولٌ خَمْسَةٌ: الْأَمْرُ مِنَ الْأُمُورِ، وَالْأَمْرُ ضِدُّ النَّهْيِ... وَالْأَمْرُ الَّذِي هُوَ نَقِيضُ النَّهْيِ قَوْلُكَ افْعَلْ كَذَا.»"
    - lemma: "سُلْطَان"
      entry_id: "{auto}"
      root: "سلط"
      maqayis_quote: "«السِّينُ وَاللَّامُ وَالطَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْقُوَّةُ وَالْقَهْرُ... وَلِذَلِكَ سُمِّيَ السُّلْطَانُ سُلْطَانًا.»"
  
  per_sense:
    - lemma: "حَاكِم"
      sense_id: "{auto}"
      nuance: "اللفظة الأعم التي تطلق على كل من يملك السلطة ويصدر الأحكام."
      mwe: false
    - lemma: "عَاهِل"
      sense_id: "{auto}"
      nuance: "تخصص للدلالة على الملك الأعظم الذي يحكم دولاً أو شعوباً."
      mwe: false
    - lemma: "آمِر"
      sense_id: "{auto}"
      nuance: "تركز على صفة إصدار الأوامر والقيادة، وغالباً ما تكون في سياق تنفيذي."
      mwe: false
    - lemma: "سُلْطَان"
      sense_id: "{auto}"
      nuance: "تشير إلى الحاكم المطلق الذي يمتلك القوة القاهرة والسطوة التامة."
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حكم","maqayis":"«الْحَاءُ وَالْكَافُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ الْمَنْعُ. وَأَوَّلُ ذَلِكَ الْحُكْمُ، وَهُوَ الْمَنْعُ مِنَ الظُّلْمِ.»"}'
