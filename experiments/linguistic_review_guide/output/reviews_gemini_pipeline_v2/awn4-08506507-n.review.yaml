        value: '{"root":"هنا","maqayis":"«الْهَاءُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ، فِيهِ كَلِمَاتٌ مُشْكِلَةٌ... يَقُولُونَ: هُنَا كَلِمَةُ تَقْرِيبٍ»"}'
    - command: set_metadata
