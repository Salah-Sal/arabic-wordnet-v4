stage1_review:
  assessment:
    concerns:
      - "اللمّة 'تكليركية' غير مألوفة ويبدو أنها تعريب مشوه أو تحريف لـ 'إكليريكية' أو 'كليريكالية'."
      - "اللمّة 'هيمنة رجال الدين' تعبير وصفي صحيح ولكنه يفتقر إلى الاصطلاحية اللفظية الواحدة."
    observations: "المجموعة تتعلق بمفهوم الإكليروسية أو النفوذ الديني المتزايد في السياسة والمجتمع."
  blind_candidates:
    - lemma: "إِكْلِيرُوسِيَّة"
      generation_method: taarib
      justification: "التعريب الشائع لمفهوم Clericalism، من 'إكليروس' (رجال الدين)."
    - lemma: "كَهَنُوتِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'كهنوت'، يعبر عن النزعة نحو سلطة رجال الدين."
    - lemma: "حُكْمُ رِجَالِ الدِّين"
      generation_method: tarkib
      justification: "تعبير وصفي مباشر للمفهوم السياسي (Theocracy/Clericalism)."
    - lemma: "نَزْعَةٌ إِكْلِيرُوسِيَّة"
      generation_method: tarkib
      justification: "توصيف دقيق للميل نحو زيادة نفوذ الهرم الديني."

stage2_evidence:
  per_lemma:
    - lemma: "هيمنة رجال الدين"
      confirm:
        - text: "«رجال الدين: رجال الدّين عند اليهود والنصارى ونحوهم»"
          source: "المعجم الوسيط"
    - lemma: "إِكْلِيرُوسِيَّة"
      confirm:
        - text: "«الإِكْلِيرُوسية: منصب أحد الإِكْلِيروس منطقة نفوذه الدينى»"
          source: "المعجم الكبير"
    - lemma: "الإِكْلِيرُوسِيَانِيَّة"
      confirm:
        - text: "«الإكليروسيانية: النفوذ الإكليركيّ في الدولة أو السياسة.»"
          source: "المورد الحديث"
    - lemma: "تكليركية"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "هيمنة رجال الدين"
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق ومستعمل في السياق السياسي والاجتماعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَيْمَنَةُ رِجَالِ الدِّينِ"
    - lemma: "تكليركية"
      decision: removed
      decision_reason: "لفظ غير مسجل في المعاجم العربية، ويبدو أنه تحريف لـ 'إكليروسية' أو 'كليريكالية'."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "إِكْلِيرُوسِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "التعريب الفصيح المعتمد في المعجم الكبير لهذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِكْلِيرُوسِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "إِكْلِيرُوسِيَانِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معجمي حديث مسجل في 'المورد الحديث' كمرادف لـ Clericalism."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِكْلِيرُوسِيَانِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "كَهَنُوتِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي محدث يشير إلى النفوذ الديني المطلق."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "كَهَنُوتِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عملية زيادة قوة أو نفوذ التسلسل الهرمي الديني."
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط؛ الأفضل صياغته كمذهب أو نزعة سياسية/اجتماعية كما في المعاجم."
    authored:
      - type: terminological
        text: "نزعة أو مذهب يدعو لتعزيز نفوذ رجال الدين وهيمنة المؤسسة الدينية على الشؤون السياسية والاجتماعية للدولة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نزعة أو مذهب يدعو لتعزيز نفوذ رجال الدين وهيمنة المؤسسة الدينية على الشؤون السياسية والاجتماعية للدولة."
  examples:
    per_lemma:
      - lemma: "هَيْمَنَةُ رِجَالِ الدِّينِ"
        examples:
          - text: "أدّت هيمنة رجال الدين في بعض العصور الوسطى إلى صدامات عنيفة مع السلطات المدنية."
            type: usage
      - lemma: "إِكْلِيرُوسِيَّة"
        examples:
          - text: "ناقش الفلاسفة مخاطر الإكليروسية على استقلال القرار السياسي الوطني."
            type: usage
      - lemma: "كَهَنُوتِيَّة"
        examples:
          - text: "تعتبر الكهنوتية المطلقة عائقاً أمام تطور النظم الديمقراطية القائمة على المساواة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "عارضت الحركات العلمانية تزايد الإكليروسية في مؤسسات الدولة."

stage5_enrichment:
  per_entry:
    - lemma: "هَيْمَنَةُ رِجَالِ الدِّينِ"
      entry_id: "{auto}"
      roots:
        - word: "هيمنة"
          root: "همن"
          maqayis_quote: "«الْهَاءُ وَالْمِيمُ وَالنُّونُ: لَيْسَ أَصْلًا يُقَاسُ عَلَيْهِ، لَكِنَّهُمْ يَقُولُونَ: هَيْمَنَ الرَّجُلُ إِذَا كَانَ رَقِيبًا عَلَى الشَّيْءِ وَشَاهِدًا.»"
        - word: "رجال"
          root: "رجل"
          maqayis_quote: "«الرَّاءُ وَالْجِيمُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا الْعُضْوُ... وَالْآخَرُ الصَّلَابَةُ وَالْقُوَّةُ.»"
        - word: "الدين"
          root: "دين"
          maqayis_quote: "«الدَّالُ وَالْيَاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ إِلَيْهِ يَرْجِعُ فُرُوعُهُ كُلُّهَا، وَهُوَ الِانْقِيَادُ وَالذُّلُّ.»"
    - lemma: "كَهَنُوتِيَّة"
      entry_id: "{auto}"
      root: "كهن"
      maqayis_quote: "«الْكَافُ وَالْهَاءُ وَالنُّونُ كَلِمَةٌ وَاحِدَةٌ. وَهِيَ الْكَاهِنُ.»"
    - lemma: "إِكْلِيرُوسِيَّة"
      entry_id: "{auto}"
      note: '{"origin":"Greek kleros","transliteration":"Ekleerosiya"}'
  per_sense:
    - lemma: "هَيْمَنَةُ رِجَالِ الدِّينِ"
      sense_id: "{auto}"
      nuance: "تعبير وصفي يشرح المفهوم بدلالة السلطة والتحكم الفعلي."
      mwe: true
    - lemma: "إِكْلِيرُوسِيَّة"
      sense_id: "{auto}"
      nuance: "مصطلح معرب مخصص يشير إلى نظام رجال الدين ونفوذهم المؤسسي."
      mwe: false
    - lemma: "كَهَنُوتِيَّة"
      sense_id: "{auto}"
      nuance: "تركز على الطبيعة الدينية والطقوسية لسلطة رجال الدين."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
