stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "كعب المضرب" تفتقر إلى التشكيل الكامل.
      - الحاجة لتوثيق مصطلح "عقب المضرب" كمرادف فصيح مستعمل.
    observations: "المفهوم تقني رياضي (رياضة الغولف)، ويُقصد به الجزء من رأس المضرب الأقرب إلى الساق (العصا). المصطلحات العربية المعتمدة في هذا المجال تتبع النقل الدلالي من الأعضاء البشرية (كعب/عقب) إلى الأجزاء الميكانيكية، وهو مسلك قياسي في التعريب."
  blind_candidates:
    - lemma: "كَعْبُ المِضْرَب"
      generation_method: tarkib
      justification: "ترجمة اصطلاحية مباشرة لمصطلح (heel of the club)، وهو الجزء القاعدي الخلفي."
    - lemma: "عَقِبُ المِضْرَب"
      generation_method: tarkib
      justification: "العقب هو مؤخر القدم، ويُستخدم دلالياً لوصف الجزء الخلفي من الأدوات."
    - lemma: "أَصْلُ المِضْرَب"
      generation_method: tarkib
      justification: "الأصل هو أسفل الشيء ومنبته، ويصلح لوصف مكان اتصال الرأس بالساق."
    - lemma: "مَوْصِلُ المِضْرَب"
      generation_method: tarkib
      justification: "تسمية وصفية لمكان الاتصال الوظيفي بين جزأي المضرب."

stage2_evidence:
  per_lemma:
    - lemma: "كَعْبُ المِضْرَب"
      confirm:
        - text: "«(2) مِضْرَب غولف.» (في سياق ترجمة الأجزاء)"
          source: "المورد الحديث"
        - text: "«كَعْب: الجزء من قاعدة السد أو الجدار الاستنادي...» (يدعم استخدام كعب للأجزاء الميكانيكية)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
    - lemma: "عَقِبُ المِضْرَب"
      confirm:
        - text: "«العَقِب: ... د- كعب الحذاء أو الجورب. هـ- مؤخَّر المركب. و- أسفل الصاري أو السلّم» (يدعم استخدام عقب للأجزاء القاعدية)"
          source: "المورد الحديث"
      expands:
        - text: "«العَقِبُ: مُؤَخَّرُ الْقَدَمِ»"
          source: "المصباح المنير"
    - lemma: "كعب"
      expands:
        - text: "«الْكَعْبُ: الْعَظْمُ النَّاشِزُ عِنْدَ مُلْتَقَى السَّاقِ وَالْقَدَمِ»"
          source: "مختار الصحاح"

stage3_analysis:
  per_lemma:
    - lemma: "كعب المضرب"
      decision: confirmed
      decision_reason: "المصطلح موجود بالفعل في المجموعة وهو دقيق تقنياً وشائع الاستخدام في تعريب رياضة الغولف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَعْبُ المِضْرَب"
    - lemma: "عَقِبُ المِضْرَب"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح لـ (heel) ويُستخدم في السياقات الفنية لوصف الجزء الخلفي أو القاعدي من الأدوات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "عَقِبُ المِضْرَب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "(الغولف) جزء رأس المضرب حيث يتصل بالعصا"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لكنه يحتاج إلى صياغة معجمية أكثر دقة وتحديداً لموقع الجزء."
    authored:
      - type: terminological
        text: "جزء من رأس مضرب الغولف يقع عند نقطة اتصاله بالساق (العصا)، وهو الجزء الأقرب إلى اللاعب عند وضع المضرب خلف الكرة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "كَعْبُ المِضْرَب"
        examples:
          - text: "يؤدي ضرب الكرة بكعب المضرب إلى انحراف مسارها بشكل غير متوقع."
            type: usage
      - lemma: "عَقِبُ المِضْرَب"
        examples:
          - text: "يجب التأكد من متانة منطقة عقب المضرب لضمان ثبات الرأس عند الارتطام القوي."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "جزء من رأس مضرب الغولف يقع عند نقطة اتصاله بالساق (العصا)، وهو الجزء الأقرب إلى اللاعب عند وضع المضرب خلف الكرة."}

