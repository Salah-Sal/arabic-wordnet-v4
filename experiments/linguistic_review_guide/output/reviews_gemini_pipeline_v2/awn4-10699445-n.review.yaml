stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (مستسلم) غير مشكولة."
      - "يمكن إثراء المجموعة بلمّات أخرى تعبر عن الرضوخ والإذعان بدقة أكبر."
    observations: "مفهوم الشخص الذي يستسلم (surrenderer / yielder) له في العربية عدة مرادفات تعبر عن الانقياد والتسليم باختلاف بسيط في التضمينات الدلالية مثل الخضوع (التذلل) والرضوخ (القبول تحت الضغط) والإذعان (الطاعة والانقياد)."
  blind_candidates:
    - lemma: "مُسْتَسْلِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (استسلم)، وهو من الانقياد وترك المقاومة."
    - lemma: "مُذْعِن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (أذعن)، ويدل على الانقياد والطاعة."
    - lemma: "خَاضِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (خضع)، ويدل على التذلل والتطامن والانقياد."
    - lemma: "رَاضِخ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (رضخ)، ويعبر عن الإعطاء أو القبول على مضض وتحت الضغط."

stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَسْلِم"
      confirm:
        - text: "«(استسلم) انْقَادَ وَسنَن الطَّرِيق رَكبه وَلم يخطئه»"
          source: "المعجم الوسيط"
        - text: "«فلانٌ: انقاد وأذْعن.»"
          source: "المعجم الكبير"
    - lemma: "مُذْعِن"
      confirm:
        - text: "«(أذعن) انْقَادَ وسلس وَيُقَال أذعن بِالْحَقِّ أقرّ بِهِ»"
          source: "المعجم الوسيط"
        - text: "«أذْعَنَ له: خَضَعَ، وذَلَّ، وأقَرَّ، وأسْرَعَ في الطاعَةِ، وانْقادَ»"
          source: "القاموس المحيط"
    - lemma: "خَاضِع"
      confirm:
        - text: "«الخُضُوعُ: الذُّلُّ والاستِخذَاءُ.»"
          source: "كتاب العين"
        - text: "«والخَضُوع، كصَبُورٍ: الخاضِع...»"
          source: "تاج العروس"
    - lemma: "رَاضِخ"
      confirm:
        - text: "«(راضخ) فلَان شَيْئا أعطَاهُ كَارِهًا»"
          source: "المعجم الوسيط"
        - text: "«فلانٌ فلانًا: رَماهُ بالحِجَارةِ وغَيْرِها شيئًا: أَعْطاه وهُوَ كارهٌ»"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "مُسْتَسْلِم"
      decision: confirmed
      decision_reason: "اسم فاعل دقيق ومستعمل للتعبير عن التخلي عن المقاومة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَسْلِم"

    - lemma: "مُذْعِن"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الانقياد والتسليم، وهو من المرادفات الدقيقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُذْعِن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: awn4-10699445-n}

    - lemma: "خَاضِع"
      source: stage1
      decision: confirmed
      decision_reason: "من أشهر الكلمات المعبرة عن الانقياد والتذلل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خَاضِع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: awn4-10699445-n}

    - lemma: "رَاضِخ"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الانقياد والإذعان تحت الضغط والإكراه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رَاضِخ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: awn4-10699445-n}

stage4_content:
  definition:
    current: "شخص يرضخ أو يستسلم"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يستخدم كلمات تنتمي للمجموعة الترادفية نفسها؛ يمكن صياغة تعريف مصطلحي أدق يعتمد على الجنس والفصل."
    authored:
      - type: terminological
        text: "مَنْ ينقاد لغيره ويترك المقاومة خضوعاً أو عجزاً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: awn4-10699445-n, definition_index: 0, text: "مَنْ ينقاد لغيره ويترك المقاومة خضوعاً أو عجزاً."}

  examples:
    per_lemma:
      - lemma: "مُسْتَسْلِم"
        examples:
          - text: "رفع الجندي يديه مُسْتَسْلِماً للعدو."
            type: usage
      - lemma: "مُذْعِن"
        examples:
          - text: "نفذ العامل الأوامر مُذْعِناً لتعليمات رئيسه."
            type: usage
      - lemma: "خَاضِع"
        examples:
          - text: "وقف المتهم خَاضِعاً أمام القاضي."
            type: usage
      - lemma: "رَاضِخ"
        examples:
          - text: "كان رَاضِخاً لطلبات الخاطفين لإنقاذ الرهائن."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "رفع الجندي يديه مُسْتَسْلِماً للعدو."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "نفذ العامل الأوامر مُذْعِناً لتعليمات رئيسه."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "وقف المتهم خَاضِعاً أمام القاضي."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "كان رَاضِخاً لطلبات الخاطفين لإنقاذ الرهائن."}

