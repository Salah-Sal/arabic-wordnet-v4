stage1_review:
  assessment:
    concerns:
      - "اللمة 'شَخْص سَيِّئ' عبارة وصفية حرة (مركب وصفي) وترجمة حرفية للمصطلح الإنجليزي 'bad guy' وليست مصطلحًا معجميًا مسكوكًا للتعبير عن الخصم أو المنازع."
      - "التعريف العربي 'أي شخص ليس في صفك' يميل إلى العامية والترجمة الحرفية، ويحتاج إلى صياغة معجمية أدق مثل 'من يعاديك أو يخالفك في الرأي أو الموقف'."
    observations: "المفهوم يشير إلى 'الخصم' أو 'المنازع' أو 'المعادي' في سياق المواجهة أو الخلاف. اللغة العربية ثرية بالمفردات التي تعبر عن هذا المفهوم بدقة بعيدا عن الترجمات الحرفية."
  blind_candidates:
    - lemma: "مُعَارِض"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (عرض)، ويعني من يقف معترضاً لمسار الآخر أو يخالفه الرأي والموقف."
    - lemma: "عَدُوّ"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (عدو)، ويدل على من يضمر العداوة ويقف ضد الشخص."
    - lemma: "غَرِيم"
      generation_method: majaz
      justification: "أصل الغريم هو الدائن والمدين للزومهما، واستعيرت للمنازع والخصم الملازم لخصومته."
    - lemma: "مُنَاوِئ"
      generation_method: ishtiqaq
      justification: "من (نوأ)، ناوأه إذا عاداه وناهضه، وتعبر بدقة عن الخصم المعادي."

stage2_evidence:
  per_lemma:
    - lemma: "خَصْم"
      confirm:
        - text: "«المُخَاصِمُ. يَسْتَوِي فِيهِ الْمُذَكَّرُ وَالْمُؤَنَّثُ, وَالْمُفْرَدُ وَالْمُثَنَّى وَالْجَمْعُ»"
          source: "المعجم الكبير"
        - text: "«المنازع، ويقع على الواحد والجميع»"
          source: "كتاب العين"
    - lemma: "شَخْص سَيِّئ"
      evidence_status: "no_material_found"
    - lemma: "مُعَارِض"
      evidence_status: "no_material_found"
    - lemma: "عَدُوّ"
      confirm:
        - text: "«اسم جامع للواحد والجميع والتثنية والتأنيث والتذكير ضد الصديق»"
          source: "كتاب العين"
    - lemma: "غَرِيم"
      confirm:
        - text: "«الغَريم: الدائن، لأنه يلزم الذي عليه الدين، والمديون لأن الدين لازم له وأيضاً الخَصم.»"
          source: "التعريفات الفقهيّة للبركتي"
    - lemma: "مُنَاوِئ"
      confirm:
        - text: "«وَمِنَ الْبَابِ الْمُنَاوَأَةُ تَكُونُ بَيْنَ الْقَوْمِ يُقَالُ: نَاوَأَهُ، إِذَا عَادَاهُ. وَهُوَ قِيَاسُ مَا ذَكَرْنَاهُ، لِأَنَّهَا الْمُنَاهَضَةُ»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "خَصْم"
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل ودقيق للتعبير عن المنازع والمخالف، وتؤكده المعاجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَصْم"
    - lemma: "شَخْص سَيِّئ"
      decision: removed
      decision_reason: "عبارة وصفية حرة وترجمة حرفية عامية (bad guy) وليست وحدة معجمية مسكوكة للتعبير عن الخصومة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "مُعَارِض"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة فصيحة وشائعة الاستخدام في العصر الحديث للتعبير عمن يخالف ويقف في الجانب الآخر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُعَارِض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09851102-n"}
    - lemma: "عَدُوّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن الضد والخصم ومن ليس في صفك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عَدُوّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09851102-n"}
    - lemma: "غَرِيم"
      source: stage1
      decision: confirmed
      decision_reason: "استخدام مجازي فصيح ومستقر في المعاجم بمعنى الخصم والمنازع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "غَرِيم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09851102-n"}
    - lemma: "مُنَاوِئ"
      source: stage1
      decision: confirmed
      decision_reason: "من فصيح اللغة للتعبير عن الخصم المعادي والمناهض."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُنَاوِئ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09851102-n"}

stage4_content:
  definition:
    current: "أي شخص ليس في صفك"
    assessment:
      decision: revise
      reason: "التعريف الحالي عاميّ ومترجم حرفياً، ويفتقر إلى الصياغة المعجمية الرصينة."
    authored:
      - type: terminological
        text: "الشخص الذي يخالفك ويعاديك في الرأي أو الموقف أو المصالح."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09851102-n", definition_index: 0, text: "الشخص الذي يخالفك ويعاديك في الرأي أو الموقف أو المصالح."}
  examples:
    per_lemma:
      - lemma: "خَصْم"
        examples:
          - text: "واجه اللاعب خَصْمًا عنيدًا في المباراة النهائية."
            type: usage
      - lemma: "مُعَارِض"
        examples:
          - text: "استمع المدير إلى آراء كل مُعَارِض للقرار الجديد."
            type: usage
      - lemma: "عَدُوّ"
        examples:
          - text: "تكاتف الشعب لصد هجوم العَدُوّ."
            type: usage
      - lemma: "غَرِيم"
        examples:
          - text: "تصالح الرجل مع غَرِيمِهِ بعد طول نزاع."
            type: usage
      - lemma: "مُنَاوِئ"
        examples:
          - text: "لم يسلم المشروع من انتقادات كل مُنَاوِئ للتطوير."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-09851102-n", text: "واجه اللاعب خَصْمًا عنيدًا في المباراة النهائية."}

