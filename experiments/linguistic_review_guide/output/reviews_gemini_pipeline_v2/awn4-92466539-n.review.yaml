        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "مَادَّةُ تَبْيِيض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-92466539-n"}
    - lemma: "مُقَصِّرَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فني دقيق (Bleacher/Bleaching agent) يستند إلى أصل عربي فصيح (التقصير) وموثق في المعاجم الحديثة."
