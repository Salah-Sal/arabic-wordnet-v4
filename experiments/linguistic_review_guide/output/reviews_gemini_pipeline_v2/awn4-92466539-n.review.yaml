stage4_content:
  definition:
    current: "أي نوع من عوامل التفتيح التي يمكن استخدامها لتفتيح مظهر الشعر والجلد والخشب والأسطح الأخرى"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي طويل، ويفضل صياغة معجمية تركز على الطبيعة الكيميائية والوظيفة."
    authored:
      - type: terminological
        text: "مَادَّةٌ كِيمْيَائِيَّةٌ تُسْتَعْمَلُ لإِزَالَةِ الأَلْوَانِ أَوْ تَخْفِيفِهَا مِنْ نَحْوِ الشَّعْرِ وَالبَشَرَةِ وَالخَشَبِ وَالأَنْسِجَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-92466539-n", definition_index: 0, text: "مَادَّةٌ كِيمْيَائِيَّةٌ تُسْتَعْمَلُ لإِزَالَةِ الأَلْوَانِ أَوْ تَخْفِيفِهَا مِنْ نَحْوِ الشَّعْرِ وَالبَشَرَةِ وَالخَشَبِ وَالأَنْسِجَةِ."}
  examples:
    per_lemma:
      - lemma: "مُبَيِّض"
        examples:
          - text: "تُستخدم المبيضات التي تحتوي على الكلور لتعقيم الأسطح وتبييض الملابس."
            type: usage
      - lemma: "مُفَتِّح"
        examples:
          - text: "ينصح الخبراء باختيار مُفَتِّح بشرة خالٍ من المواد الكيميائية الضارة."
            type: usage
      - lemma: "مُقَصِّرَة"
        examples:
          - text: "أضاف العامل المُقَصِّرَة إلى حوض الغسيل لتفتيح لون الأقمشة القطنية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-92466539-n", text: "تُضاف مادة تبييض قوية إلى عجينة الورق للحصول على بياض ناصع."}

