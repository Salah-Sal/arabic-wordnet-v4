stage1_review:
  assessment:
    concerns:
      - "نقص التشكيل في اللمات الموجودة (مفتح، مادة تفتيح)."
      - "غياب مصطلح 'مبيض' وهو المصطلح الأكثر شيوعاً وعمومية لهذا المفهوم."
      - "غياب المصطلحات الفنية المتخصصة مثل 'مقصرة' أو 'قاصر الألوان'."
    observations: "المجموعة تغطي عوامل التفتيح الكيميائية لمختلف الأسطح (شعر، جلد، خشب). اللمات الحالية تركز على 'التفتيح' (lightening) بينما يغفل المعجم 'التبييض' (bleaching/whitening) وهو جزء أساسي من التعريف."
  blind_candidates:
    - lemma: "مُفَتِّح"
      generation_method: ishtiqaq
      justification: "اسم فاعل من فَتَّحَ (خفف اللون)، وهو المصطلح الشائع في مستحضرات التجميل للشعر والبشرة."
    - lemma: "مُبَيِّض"
      generation_method: ishtiqaq
      justification: "اسم فاعل من بَيَّضَ، وهو المصطلح العام لكل ما يزيل اللون أو يجعله أبيض (كالكلور ومبيضات الغسيل)."
    - lemma: "مَادَّةُ تَبْيِيض"
      generation_method: tarkib
      justification: "تعبير مركب يشير إلى الجوهر المادي المستخدم في عملية التبييض."
    - lemma: "مُقَصِّرَة"
      generation_method: ishtiqaq
      justification: "اسم آلة/فاعل من قَصَرَ الثياب (بيضها)، وهو مصطلح فني كيميائي قديم وحديث لمنتجات التبييض (Bleach)."

stage2_evidence:
  per_lemma:
    - lemma: "مُفَتِّح"
      confirm:
        - text: "«مُفَتِّح ... دواء يخرج المادة السادة عن المجرى»"
          source: "كشاف اصطلاحات الفنون"
        - text: "«مُفَتِّح (deoppilant)»"
          source: "المعجم الطبي الموحد"
      expands:
        - text: "«تفتيح القماش المغسول إلى درجة كبيرة عن طريق إزالة لونه»"
          source: "مسرد صناعة النسيج (ArabTerm)"
    - lemma: "مُبَيِّض"
      confirm:
        - text: "«مُبيِّض (bleach): مركب أكسدة يتضمن عادة الكلور متحدا مع الكالسيوم أو الصوديوم»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "«مُبَيِّض (whitener): مستحضر مبيِّض»"
          source: "المورد الحديث"
      expands:
        - text: "«مُبَيِّض القهوة: مادة تضاف للقهوة تكسبها عادة لوناً فاتحاً»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
    - lemma: "مُقَصِّرَة"
      confirm:
        - text: "«المُقَصِّرة: مادة كيميائية تُستخدم في التقصير (تبييض قماش بالتعريض للشمس أو بمواد كيميائية)»"
          source: "المورد الحديث"
    - lemma: "قاصِرُ الأَلْوَان"
      confirm:
        - text: "«قاصِر الألوان، مُبَيِّض (bleaching agent): مادة تبيض المادة الغذائية التي تعامل بها»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
    - lemma: "مَادَّةُ تَبْيِيض"
      confirm:
        - text: "«مادّة مبيِّضة (whitener)»"
          source: "المورد الحديث"

