stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي هو ترجمة شبه حرفية للتعريف الإنجليزي (a person who breathes audibly through a congested nose)."
      - "اللمة الموجودة 'مُخَنْفِر' تشير في الغالب إلى من يشخِّر أو يغط في نومه، أو من يكون عظيم الأنف، وقد تكون دلالتها على 'الاحتقان' دلالة ثانوية أو سياقية."
    observations: "المفهوم يشير إلى الشخص الذي يصدر صوتاً من أنفه بسبب الانسداد أو الزكام (Sniffler). في العربية، الجذر 'خنن' يرتبط ارتباطاً وثيقاً بالأصوات الصادرة من الأنف، ومنه استعملت صفة 'أَخَنّ' لمن انسدت خياشيمه فصار كلامه أو تنفسه من أنفه. كما أن الجذر الرباعي 'خنفر' يدل على إصدار الصوت من الأنف أو الشخير."
  blind_candidates:
    - lemma: "أَخَنّ"
      generation_method: ishtiqaq
      justification: "مشتقة من 'الخُنّة' أو 'الخنين'، وهو الصوت الذي يخرج من الأنف، وتطلق على مسدود الخياشيم."
    - lemma: "مُخِنّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'أَخَنَّ' أو 'خَنَّ' لمن يصدر صوتاً من أنفه."
    - lemma: "مُزْكَم"
      generation_method: ishtiqaq
      justification: "اسم مفعول لمن أصابه الزكام (احتقان الأنف)، والذي عادة ما يتنفس بصوت مسموع."
    - lemma: "نَاخِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'نَخَرَ'، أي مدَّ الصوت والنَّفَس في خياشيمه."

stage2_evidence:
  per_lemma:
    - lemma: "مُخَنْفِر"
      confirm:
        - text: "«خنفر النَّائمُ في نومه: شخَّر، غطَّ فيه. تخنْفُر [مفرد]: شخير، غطيط.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«خنفر: شخر، غَطّ... تَخَنْفَر: شخير، غطيط. مُخَنْفر: أنافيّ، عظيم الأنف»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
    - lemma: "أَخَنّ"
      confirm:
        - text: "«ورجل أَخَنُّ أَي أَغَنُّ مسدودُ الخياشيم، وقيل: هو الساقط الخَياشيم، والأُنثى خَنَّاء»"
          source: "لسان العرب لابن منظور"
        - text: "«خنَّ الشَّخصُ: خرج صوت بكائه أو ضحكه أو كلامه من أنفه... فهو أَخَنُّ.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"

stage3_analysis:
  per_lemma:
    - lemma: "مُخَنْفِر"
      decision: confirmed
      decision_reason: "اللمة مقبولة لأنها تدل على من يصدر أصواتاً من أنفه (مثل الشخير أو الغطيط)، وهو ما يقارب معنى التنفس بصوت مسموع. رغم أن الاستعمال المعاصر قد يميل لوصف النائم، إلا أنها صحيحة لغوياً للدلالة على إخراج الصوت من الأنف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَنْفِر"
    - lemma: "أَخَنّ"
      source: stage1
      decision: confirmed
      decision_reason: "اللمة دقيقة ومناسبة جداً وتتوافق تماماً مع المفهوم؛ فالأخن هو مسدود الخياشيم الذي يخرج صوته وتنفسه من أنفه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَخَنّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "شخص يتنفس بصوت مسموع من خلال أنف محتقن"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو كترجمة حرفية. التعديل يجعله أسبك وأكثر توافقاً مع التعريف المعجمي الفصيح للحالة."
    authored:
      - type: terminological
        text: "شخص يتنفس أو يتحدث بصوت مسموع من أنفه بسبب احتقان أو انسداد في الخياشيم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخص يتنفس أو يتحدث بصوت مسموع من أنفه بسبب احتقان أو انسداد في الخياشيم."

  examples:
    per_lemma:
      - lemma: "مُخَنْفِر"
        examples:
          - text: "كان المريض مُخَنْفِرًا طوال الليل بسبب شدة الزكام."
            type: usage
      - lemma: "أَخَنّ"
        examples:
          - text: "تحدث بصوت أَخَنَّ إثر إصابته بنزلة برد سدت خياشيمه."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كان المريض مُخَنْفِرًا طوال الليل بسبب شدة الزكام."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تحدث بصوت أَخَنَّ إثر إصابته بنزلة برد سدت خياشيمه."

