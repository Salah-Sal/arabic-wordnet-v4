stage1_review:
  assessment:
    observations: "التعريف يعبر عن صفة الفاعل الذي يقوم بالإلحاق أو الضم (tagger/appender). اللمات الموجودة (مُذَيِّل، مُلْحِق) صحيحة ومناسبة بصيغة اسم الفاعل للتعبير عن هذا المفهوم."
  blind_candidates:
    - lemma: "مُلْحِق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (ألحق)، يعبر بدقة عن الشخص الذي يقوم بإلحاق شيء بآخر."
    - lemma: "مُذَيِّل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (ذيّل)، يستخدم لمن يضيف ذيلاً أو ملحقاً في نهاية الشيء."
    - lemma: "ضَامّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (ضمّ)، يعبر عن الشخص الذي يضم شيئاً إلى شيء آخر."
    - lemma: "مُرْفِق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (أرفق)، يعبر عن الشخص الذي يرفق أو يضيف شيئاً كملحق."

stage2_evidence:
  per_lemma:
    - lemma: "مُذَيِّل"
      confirm:
        - text: "«مُذَيِّلُ الكِتابِ: مَنْ وَضَعَ لَهُ ذَيْلاً, أَيْ ما يُلْحَقُ بِآخِرِهِ لِتَكْمِلَةِ نَقْصٍ أَوْ شَرْحٍ»"
          source: "المعجم الكبير"
    - lemma: "مُلْحِق"
      expands:
        - text: "«وثيقة تلحق مع رسالة إلكترونية ويمكن أن تكون رسالة صوتية أو رسوما أو غير ذلك» (تعريف المُلْحَق)"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات"
          addition: "يدعم الاستخدام المعاصر لجذر (لحق) في سياق الإضافة والربط، ومُلْحِق هو اسم الفاعل منه."
    - lemma: "ضَامّ"
      expands:
        - text: "«النسيج الضامُّ (في الطب) Connective tissue (E): نسيجٌ رِخْوٌ يملأ الفراغاتِ بين الأنسجةِ والأعضاء؛ ليدعمها»"
          source: "المعجم الكبير"
          addition: "يشير إلى دلالة الضم والربط بصيغة اسم الفاعل."
    - lemma: "مُرْفِق"
      confirm:
        - text: "«مُرْفِق من (ر ف ق) من يلين جانبه ويحسن صنيعه، ومن ينفع ويفيد ومن يضيف شيئا إلى الشيء.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

stage3_analysis:
  per_lemma:
    - lemma: "مُذَيِّل"
      decision: confirmed
      decision_reason: "اسم فاعل فصيح ومستعمل لمن يلحق شيئاً بآخر، كما ورد في المعجم الكبير (مُذَيِّل الكتاب)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُذَيِّل"

    - lemma: "مُلْحِق"
      decision: confirmed
      decision_reason: "اسم فاعل صحيح قياسياً من الفعل (ألحق)، وهو يعبر بدقة عن وظيفة الإلحاق والإضافة، وشائع الاستخدام في السياقات المعاصرة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُلْحِق"

    - lemma: "ضَامّ"
      source: stage1
      decision: removed
      decision_reason: "صحيح قياسياً، لكن كلمة (مُلْحِق) و(مُذَيِّل) أَدَلّ وأكثر تخصصاً في هذا السياق، و(ضَامّ) تستخدم أكثر كصفة (كالنسيج الضام) وليست اسماً مستقلاً للفاعل."

    - lemma: "مُرْفِق"
      source: stage1
      decision: removed
      decision_reason: "مقبول قياسياً وموثق، ولكن الاكتفاء بـ (مُلْحِق) و(مُذَيِّل) يفي بالغرض وهما أكثر شيوعاً في الاستخدام."

stage4_content:
  definition:
    current: "شخص يلحق أو يضم شيئاً بآخر"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويعكس بصورة صحيحة دلالة المجموعة الترادفية."
  examples:
    per_lemma:
      - lemma: "مُذَيِّل"
        examples:
          - text: "كان مُذَيِّلُ التقرير حريصاً على إضافة جميع المراجع الداعمة في النهاية."
            type: usage
      - lemma: "مُلْحِق"
        examples:
          - text: "قام مُلْحِقُ البيانات بإضافة المعلومات الناقصة إلى الملف الأساسي."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كان مُذَيِّلُ التقرير حريصاً على إضافة جميع المراجع الداعمة في النهاية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "قام مُلْحِقُ البيانات بإضافة المعلومات الناقصة إلى الملف الأساسي."

