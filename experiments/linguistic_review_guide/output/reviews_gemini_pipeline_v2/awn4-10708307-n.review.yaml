  per_entry:
    - lemma: "مُذَيِّل"
      entry_id: "{auto}"
      root: "ذيل"
      maqayis_quote: "«الذَّالُ وَالْيَاءُ وَاللَّامُ أُصَيْلٌ وَاحِدٌ مُطَّرِدٌ مُنْقَاسٌ، وَهُوَ شَيْءٌ يَسْفُلُ فِي إِطَافَةٍ. مِنْ ذَلِكَ الذَّيْلُ ذَيْلُ الْقَمِيصِ وَغَيْرِهِ.»"
    - lemma: "مُلْحِق"
      entry_id: "{auto}"
      root: "لحق"
      maqayis_quote: "«اللَّامُ وَالْحَاءُ وَالْقَافُ أَصْلٌ يَدُلُّ عَلَى إِدْرَاكِ شَيْءٍ وَبُلُوغِهِ إِلَى غَيْرِهِ. يُقَالُ: لَحِقَ فُلَانٌ فُلَانًا فَهُوَ لَاحِقٌ. وَأَلْحَقَ بِمَعْنَاهُ.»"
  per_sense:
