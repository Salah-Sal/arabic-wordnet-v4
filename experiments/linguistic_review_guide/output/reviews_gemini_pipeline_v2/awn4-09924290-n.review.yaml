stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جداً ويفتقر للصبغة المعجمية."
      - "الارتباط بالمجموعات العليا (hypernyms) يبدو عاماً جداً (عامل/فاعل)."
    observations: "اللمّات الموجودة (مُعتدل، وسطي) دقيقة وتعبر عن المفهوم السياسي المعاصر بشكل جيد. المفهوم يجمع بين الاعتدال السلوكي (Moderate) والموقع السياسي (Centrist)."
  blind_candidates:
    - lemma: "مُعْتَدِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من عَدَلَ، يدل على التوازن وتجنب التطرف، وهو المصطلح الأشيع للمعتدل سياسياً."
    - lemma: "وَسَطِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الوسط، ويُستخدم في الفكر السياسي والاجتماعي المعاصر للدلالة على التموضع في المركز."
    - lemma: "اعْتِدَالِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الاعتدال، ويُستخدم لوصف الشخص الذي يتبنى منهج الاعتدال كأيديولوجية."
    - lemma: "مُتَوَسِّط الرَّأْي"
      generation_method: tarkib
      justification: "تعبير وصفي يدل على الشخص الذي لا يميل إلى طرفي النزاع."

stage2_evidence:
  per_lemma:
    - lemma: "مُعْتَدِل"
      confirm:
        - text: "«الاعتدالي: شخص ذو آراء معتدلة غير متطرفة في السياسة والدين»"
          source: "المورد الحديث"
        - text: "«طرف في نزاع يتجه إلى رؤية الجوانب الصحيحة لكل وجهة نظر، ويبدي مرونة عالية إزاء إمكانات التفاوض»"
          source: "المعجم الموحد لمصطلحات المياه (سياق عام للتفاوض)"
    - lemma: "وَسَطِيّ"
      confirm:
        - text: "«الوَسَطيّ: عضوٌ في حزب من أحزاب الوسَط. شخص ذو آراء معتدلة»"
          source: "المورد الحديث"
    - lemma: "اعْتِدَالِيّ"
      confirm:
        - text: "«الاعتدالي: شخص ذو آراء معتدلة غير متطرفة في السياسة والدين»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "مُعْتَدِل"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشائع جداً للتعبير عن الشخص المعتدل في مواقفه، ويدعمه الاستخدام المعاصر والمعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعْتَدِل"
    - lemma: "وَسَطِيّ"
      decision: confirmed
      decision_reason: "مصطلح دقيق تقنياً للدلالة على 'Centrist' أي الشخص الذي يتموضع في وسط الخارطة السياسية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَسَطِيّ"
    - lemma: "اعْتِدَالِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف صحيح من الناحية الصرفية والدلالية، ويُستخدم لتمييز الانتماء لمدرسة الاعتدال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "اعْتِدَالِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09924290-n"

stage4_content:
  definition:
    current: "شخص يتخذ موقفاً في الوسط السياسي"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً؛ يحتاج إلى تفصيل لغوي يوضح جوهر الموقف السياسي المتزن."
    authored:
      - type: terminological
        text: "مَنْ كَانَ ذَا آراءٍ سِيَاسِيَّةٍ غَيْرِ مُتَطَرِّفَةٍ، يَتَّخِذُ مَوْقِفاً وَسَطاً بَيْنَ التَّيَّارَاتِ السِّيَاسِيَّةِ الْمُتَعَارِضَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "مُعْتَدِل"
        examples:
          - text: "يُعَدُّ هَذَا النَّائِبُ مُعْتَدِلًا فِي طُرُوحَاتِهِ الَّتِي تُحَاوِلُ تَقْرِيبَ وُجُهَاتِ النَّظَرِ."
            type: usage
      - lemma: "وَسَطِيّ"
        examples:
          - text: "انْضَمَّ الْكَثِيرُ مِنَ النَّاخِبِينَ إِلَى الْحِزْبِ الْوَسَطِيِّ بَحْثاً عَنِ الِاسْتِقْرَارِ."
            type: usage
      - lemma: "اعْتِدَالِيّ"
        examples:
          - text: "بَرَزَ التَّيَّارُ الِاعْتِدَالِيُّ كَقُوَّةٍ مُوَازِنَةٍ فِي الْبَرْلَمَانِ."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09924290-n"
          definition_index: 0
          text: "مَنْ كَانَ ذَا آراءٍ سِيَاسِيَّةٍ غَيْرِ مُتَطَرِّفَةٍ، يَتَّخِذُ مَوْقِفاً وَسَطاً بَيْنَ التَّيَّارَاتِ السِّيَاسِيَّةِ الْمُتَعَارِضَةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعَدُّ هَذَا النَّائِبُ مُعْتَدِلًا فِي طُرُوحَاتِهِ الَّتِي تُحَاوِلُ تَقْرِيبَ وُجُهَاتِ النَّظَرِ."

