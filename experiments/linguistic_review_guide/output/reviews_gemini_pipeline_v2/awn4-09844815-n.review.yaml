stage4_content:
  definition:
    current: "شخص علم نفسه بنفسه"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً ويميل للعامية، يفضل استخدام لغة معجمية أكثر رصانة."
    authored:
      - type: terminological
        text: "مَن حصَّل المعرفةَ أو العِلْمَ بِمجهودِهِ الشَّخْصِيِّ دُونَ الاستِعَانَةِ بِمُعَلِّمٍ أو الانتِسَابِ لِمؤَسَّسَةٍ تَعْلِيمِيَّةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09844815-n", definition_index: 0, text: "مَن حصَّل المعرفةَ أو العِلْمَ بِمجهودِهِ الشَّخْصِيِّ دُونَ الاستِعَانَةِ بِمُعَلِّمٍ أو الانتِسَابِ لِمؤَسَّسَةٍ تَعْلِيمِيَّةٍ."}

  examples:
    per_lemma:
      - lemma: "عَصَامِيّ"
        examples:
          - text: "يُعَدُّ العَقَّادُ عَصَامِيًّا نَادِرًا، فَقَدْ كَوَّنَ ثَقَافَتَهُ العَرِيضَةَ بِنَفْسِهِ."
            type: usage
      - lemma: "مُعَلِّمُ نَفْسِهِ"
        examples:
          - text: "كَانَ الفَارَابِيُّ مُعَلِّمَ نَفْسِهِ فِي كَثِيرٍ مِنَ العُلُومِ الَّتِي بَرَعَ فِيهَا."
            type: usage
      - lemma: "مُتَعَلِّمٌ ذَاتِيٌّ"
        examples:
          - text: "فِي عَصْرِ المَعْلُومَاتِيَّةِ، أَصْبَحَ كُلُّ بَاحِثٍ نَاجِحٍ مُتَعَلِّمًا ذَاتِيًّا بِالضَّرُورَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعَدُّ العَقَّادُ عَصَامِيًّا نَادِرًا، فَقَدْ كَوَّنَ ثَقَافَتَهُ العَرِيضَةَ بِنَفْسِهِ."}

