stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة «مُعَلِّم نَفْسَه» تحتاج لتصحيح التشكيل وضبط بنية التركيب (إضافة الكسرة تحت الشدة)."
      - "نقص في المصطلحات الحديثة الدقيقة مثل «متعلم ذاتي» التي شاعت في السياقات التربوية."
    observations: "المجموعة تغطي مفهوم العصامية والتعلم الذاتي. المصطلح «عصامي» هو الأكثر تراثاً وشيوعاً، بينما تفتقر المجموعة للمصطلحات التقنية المعاصرة."
  blind_candidates:
    - lemma: "عَصَامِيّ"
      generation_method: majaz
      justification: "مأخوذ من قصة عصام بن شهبر الذي ساد بنفسه لا بآبائه، وهو المصطلح العربي الأصيل المقابل لـ (self-made) و(self-taught)."
    - lemma: "ذَاتِيُّ التَّثَقُّفِ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن الشخص الذي يثقف نفسه بنفسه، وهو شائع في المعاجم الحديثة مثل المورد."
    - lemma: "ذَاتِيُّ التَّحْصِيلِ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن اكتساب المعلم بشكل مستقل، وهو مستخدم في الأدبيات التربوية."
    - lemma: "تِلْمِيذُ ذَاتِهِ"
      generation_method: tarkib
      justification: "تعبير استعاري يشير إلى التلمذة المستقلة دون معلم خارجي."

stage2_evidence:
  per_lemma:
    - lemma: "عَصَامِيّ"
      confirm:
        - text: "«(العصامي) من سَاد بشرف نَفسه ويقابله العظامي»"
          source: "المعجم الوسيط"
        - text: "«نفس عصام سودت عصاما.. يقال للسائد بنفسه لا بآبائه»"
          source: "مقاييس اللغة"
      expands:
        - text: "«عصامي: self-made»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
    - lemma: "مُعَلِّم نَفْسَه"
      confirm:
        - text: "«ذاتيّ التحصيل: «أ» مُعلِّمٌ نفسَهُ بنفسه.»"
          source: "المورد الحديث (عبر ArabTerm)"
    - lemma: "مُتَعَلِّمٌ ذَاتِيٌّ"
      confirm:
        - text: "«متعلم ذاتي: self-educated»"
          source: "مسرد التربية (ArabTerm)"
    - lemma: "ذَاتِيُّ التَّثَقُّفِ"
      confirm:
        - text: "«ذاتيّ التثقُّف: مُثَقِّفٌ نفسَهُ بنفسه.»"
          source: "المورد الحديث (عبر ArabTerm)"

