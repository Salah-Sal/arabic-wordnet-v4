stage1_review:
  assessment:
    concerns:
      - "الكلمة 'لاحقة' تُستخدم في السياق الحديث غالباً بمعنى (Suffix) في اللسانيات، رغم صحتها لغوياً وتشريحياً لمدلول 'appendage'."
      - "التعريف الحالي مقتضب جداً."
    observations: "المجموعة تغطي المفهوم العام للشيء التابع أو الملحق، وتتداخل مع المصطلحات الطبية (الزائدة الدودية) والمعمارية (ملحق البيت) والتوثيقية (ملحق الكتاب)."
  blind_candidates:
    - lemma: "مُلْحَق"
      generation_method: ishtiqaq
      justification: "اسم مفعول من (ألحق)، يعبر بدقة عن الشيء المضاف لشيء أكبر منه."
    - lemma: "زائِدَة"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (زاد)، يُستخدم بكثرة في التشريح للتعبير عن الأطراف أو الأجزاء البارزة."
    - lemma: "ضَمِيمَة"
      generation_method: ishtiqaq
      justification: "ما يُضم إلى الشيء ليُكمله أو يُلحق به."
    - lemma: "عُلاوَة"
      generation_method: ishtiqaq
      justification: "ما يُزاد على الشيء بعد تمامه."

stage2_evidence:
  per_lemma:
    - lemma: "زائدة"
      confirm:
        - text: "«زائدة الكبد: قطعة صغيرة منها متعلقة بها إلى جنبها»"
          source: "المعجم الوسيط"
        - text: "«قطعة إضافيّة أو ملحقة بعضو ما. جزء متمّم لبقيّة الأجزاء الرئيسيّة الأخرى في عضو ما.»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"
    - lemma: "لاحقة"
      confirm:
        - text: "«جزء ثانوي الوظيفة أو الحجم متصل بتركيب رئيسي.»"
          source: "معجم المصطلحات الطبية"
        - text: "«قطعة إضافيّة أو ملحقة بعضو ما... بشكل خاصّ تطلق على الزائدة الدوديّة.»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"
    - lemma: "ملحق"
      confirm:
        - text: "«ما يضاف إلى موضوع رئيس كجزء مُكمّل وإضافي، كملحقات ملف وكتاب»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«صفحة أو صفحات تصدرها الجريدة اليومية بعد صدور عددها المعتاد لخبر مهم يقتضيه»"
          source: "المعجم الوسيط"
    - lemma: "ضَمِيمَة"
      confirm:
        - text: "«التكملة التي تضم للكتاب أو تلحق به»"
          source: "المعجم الكبير"
    - lemma: "عُلاوَة"
      expands:
        - text: "«من كل شيء ما زاد عليه»"
          source: "المعجم الوسيط"
        - conflict: "تُستخدم غالباً في السياق المالي (زيادة المرتب)."

stage3_analysis:
  per_lemma:
    - lemma: "زائدة"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشائع للتعبير عن الزوائد التشريحية وغيرها من الملحقات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زائِدَة"
    - lemma: "لاحقة"
      decision: confirmed
      decision_reason: "موثقة في المعاجم الطبية والتشريحية كمرادف لـ 'appendage' وإن كان يغلب عليها الاستعمال اللساني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاحِقَة"
    - lemma: "مُلحَق"
      decision: confirmed
      decision_reason: "أكثر اللمّات دقة في التعبير عن الإضافات المعمارية والوثائقية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُلْحَق"
    - lemma: "ضَمِيمَة"
      source: stage1
      decision: confirmed
      decision_reason: "لمة فصيحة تناسب السياق التوثيقي والمفاهيمي للشيء الملحق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ضَمِيمَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-02731707-n"}

stage4_content:
  definition:
    current: "جزء متصل بشيء أكبر منه"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً، ويفضل شمول الجانبين المادي (التشريحي والمعماري) والمفاهيمي."
    authored:
      - type: terminological
        text: "جُزْءٌ ثَانَوِيٌّ مُتَّصِلٌ بِشَيْءٍ أَوْ عُضْوٍ أَكْبَرُ مِنْهُ أَوْ بَارِزٌ عَنْهُ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-02731707-n", definition_index: 0, text: "جُزْءٌ ثَانَوِيٌّ مُتَّصِلٌ بِشَيْءٍ أَوْ عُضْوٍ أَكْبَرُ مِنْهُ أَوْ بَارِزٌ عَنْهُ."}
  examples:
    per_lemma:
      - lemma: "زائِدَة"
        examples:
          - text: "تُعتبر الزائدة الدودية جزءاً صغيراً متصلاً بالأمعاء الغليظة."
            type: usage
      - lemma: "لاحِقَة"
        examples:
          - text: "الأطراف هي لواحق خارجية لجسم الكائن الحي تساعده على الحركة."
            type: usage
      - lemma: "مُلْحَق"
        examples:
          - text: "بنى صاحب المنزل ملحقاً خارجياً لاستقبال الضيوف."
            type: usage
      - lemma: "ضَمِيمَة"
        examples:
          - text: "اشتمل المخطوط على ضميمة في آخره تتضمن شروحات إضافية."
            type: usage

