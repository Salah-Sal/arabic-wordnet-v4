stage1_review:
  assessment:
    concerns:
      - اللمة الحالية عبارة عن مركب وصفي يفتقر إلى التشكيل الكامل.
      - المصطلح الحالي "أحادي الصيغة الصبغية" دقيق علمياً ولكنه طويل، وهناك بدائل أقصر مثل "فرداني".
    observations: "المفهوم يشير إلى الحالة الوراثية التي تحتوي فيها الخلية على طاقم واحد من الكروموسومات (n)، وهو ما يقابل مصطلح (haploid) بالإنجليزية. المصطلحات العربية الشائعة تتراوح بين التركيب الوصفي (أحادي...) والاشتقاق الصرفي (فرداني)."
  blind_candidates:
    - lemma: "أُحَادِيُّ الصِّيغَةِ"
      generation_method: tarkib
      justification: "ترجمة لمصطلح (haploid) حيث 'أحادي' تقابل (haplo-) و'صيغة' تقابل (-ploid)."
    - lemma: "فَرْدَانِيّ"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (فرد) للدلالة على الانفراد والوحدانية، وهو مصطلح معتمد في المعاجم الطبية الموحدة."
    - lemma: "أُحَادِيُّ المَجْمُوعَةِ"
      generation_method: tarkib
      justification: "تعبير وصفي يشير إلى وجود مجموعة واحدة فقط من الصبغيات."
    - lemma: "أُحَادِيُّ العَدَدِ"
      generation_method: tarkib
      justification: "يشير إلى امتلاك العدد الأساسي (الفردي) من الصبغيات."

stage2_evidence:
  per_lemma:
    - lemma: "أحادي الصيغة الصبغية"
      expands:
        - text: "العدد الكلي للكروموزومات الفردانية في النواة."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          addition: "يؤكد استخدام 'صيغة صبغية' كمصطلح مرادف لعدد الكروموسومات."
    - lemma: "فَرْدَانِيّ"
      confirm:
        - text: "haploid: فَرْدانِيّ"
          source: "المعجم الطبي الموحد (2009)"
        - text: "احادي المجموعة الصبغية، فرداني"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "أُحَادِيُّ الصِّبْغِيَّاتِ"
      confirm:
        - text: "أ- صفة لما له طاقم واحد من الصبغيات... ب- الفرد أو الخلية التي تحمل فرداً واحداً من كل زوج من الكروموسومات المثلية."
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
    - lemma: "أُحَادِيُّ المَجْمُوعَةِ الصِّبْغِيَّة"
      confirm:
        - text: "نصف عدد الكروموسومات"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"

stage3_analysis:
  per_lemma:
    - lemma: "أحادي الصيغة الصبغية"
      decision: confirmed
      decision_reason: "المصطلح الحالي دقيق وشائع في المراجع الأكاديمية والكتب المدرسية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُحَادِيُّ الصِّيغَةِ الصِّبْغِيَّةِ"
    - lemma: "فَرْدَانِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مفرد، موجز، ومدعوم بقوة في المعاجم الطبية والوراثية الموحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَرْدَانِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-01322805-n"}
    - lemma: "أُحَادِيُّ الصِّبْغِيَّاتِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق مستخدم في معاجم الأحياء والطب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "أُحَادِيُّ الصِّبْغِيَّاتِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-01322805-n"}
    - lemma: "أُحَادِيُّ المَجْمُوعَةِ الصِّبْغِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق يشيع استخدامه لوصف العدد الكروموسومي (n)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "أُحَادِيُّ المَجْمُوعَةِ الصِّبْغِيَّةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-01322805-n"}

stage4_content:
  definition:
    current: "(في علم الوراثة) كائن أو خلية تحتوي على مجموعة كاملة واحدة فقط من الكروموسومات"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أكثر دقة وشمولاً."
    authored:
      - type: terminological
        text: "كائن حي أو خلية تشتمل نواتها على طاقم واحد من الصبغيات (الكروموسومات)، وهو نصف العدد الطبيعي الموجود في الخلايا الجسمية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-01322805-n", definition_index: 0, text: "كائن حي أو خلية تشتمل نواتها على طاقم واحد من الصبغيات (الكروموسومات)، وهو نصف العدد الطبيعي الموجود في الخلايا الجسمية."}
  examples:
    per_lemma:
      - lemma: "فَرْدَانِيٌّ"
        examples:
          - text: "تعتبر الأمشاج في الإنسان خلايا فردانية تحتوي على ثلاث وعشرين صبغياً."
            type: usage
      - lemma: "أُحَادِيُّ الصِّبْغِيَّاتِ"
        examples:
          - text: "تتميز ذكور النحل بأنها كائنات أحادية الصبغيات ناتجة عن بيوض غير مخصبة."
            type: usage

