stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة هي تعابير مركبة وصفيّة، بينما قد تتوفر لمّات مفردة أكثر شيوعاً في السياق العلمي."
      - "اللمّة الإنجليزية 'assay' تحمل دلالة تقنية دقيقة قد لا تستوعبها العبارات الوصفية العامة بالكامل."
    observations: "المفهوم يشير إلى العينة أو المادة التي تخضع للتحليل (assay as a substance). اللمات المقترحة تغطي الجانب الوصفي (عينة، مادة) والجانب التقني (مقايسة)."
  blind_candidates:
    - lemma: "عَيِّنَة"
      generation_method: ishtiqaq
      justification: "اللفظ المعياري في اللغة العربية الحديثة (بإقرار المجامع) للدلالة على الجزء المأخوذ من المادة لفحصه، وهو الاشتقاق من 'عين' بمعنى ذات الشيء."
    - lemma: "مُقايَسَة"
      generation_method: ishtiqaq
      justification: "المصطلح التقني المقابل لـ 'assay' في المعاجم الطبية والصيدلانية الموحدة، ويُستخدم للدلالة على المادة أو الاختبار نفسه."
    - lemma: "عَيِّنَةُ الِاخْتِبَار"
      generation_method: tarkib
      justification: "تركيب وصفي يحدد الغرض من العينة بدقة، وهو شائع في المختبرات."
    - lemma: "مَادَّةُ الفَحْص"
      generation_method: tarkib
      justification: "تركيب وصفي بديل يركز على طبيعة الشيء كمادة خاضعة للتحليل."

stage2_evidence:
  per_lemma:
    - lemma: "عينة الفحص"
      evidence_status: "no_material_found"
    - lemma: "مادة الاختبار"
      evidence_status: "no_material_found"
    - lemma: "عَيِّنَة"
      confirm:
        - text: "«العينة: (مج) جزء من المادة يؤخذ منها نموذجا لسائرها»"
          source: "المعجم الوسيط"
        - text: "«عينة: جزء مأخوذ من الكل لغرض الفحص أو إثبات الجودة. (sample)»"
          source: "معجم تقانات الأغذية"
        - text: "«عينة: جزء من المادة يؤخد من أجزائها المختلفة نموذجا لسائرها. (sample)»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "مُقايَسَة"
      confirm:
        - text: "«مُقايَسَة: assay»"
          source: "المعجم الطبي الموحد"
        - text: "«مُقايَسَة، مُعَايَرَة: assay»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
      expands:
        - text: "«assay ... (6.أ) المادة المرزونة»"
          source: "المورد الحديث"
          addition: "يشير صراحة إلى المادة الخاضعة للمعايرة (الرزن)."

stage3_analysis:
  per_lemma:
    - lemma: "عينة الفحص"
      decision: confirmed
      decision_reason: "تعبير مركب وصفي دقيق ومستعمل في السياقات العلمية لوصف المادة موضوع البحث."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَيِّنَةُ الفَحْص"
    - lemma: "مادة الاختبار"
      decision: confirmed
      decision_reason: "تعبير مركب سليم لغوياً ويؤدي المعنى المطلوب بدقة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّةُ الِاخْتِبَار"
    - lemma: "عَيِّنَة"
      source: stage1
      decision: confirmed
      decision_reason: "هي الكلمة الأساسية والأكثر شيوعاً لهذا المفهوم في جميع المعاجم المتخصصة، وهي تغطي معنى 'specimen' و'sample' و'assay' (بمعناه المادي)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: add_sense
          params:
            entry_id: "353494"
            synset_id: "awn4-14608570-n"
    - lemma: "مُقايَسَة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح التقني المقابل لـ 'assay' في العلوم الطبية والبيولوجية، ويستخدم لتعيين العينة ذاتها في سياق التحليل الكَمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: add_sense
          params:
            entry_id: "546134"
            synset_id: "awn4-14608570-n"

stage4_content:
  definition:
    current: "مادة تخضع لتحليل مكوناتها"
    assessment:
      decision: revise
      reason: "التعريف الحالي سليم ولكنه موجز جداً؛ يفضل إضافة تفاصيل توضح الغرض من التحليل (مثل إثبات الجودة أو معرفة الخصائص)."
    authored:
      - type: terminological
        text: "جزءٌ من مادةٍ أو مكوّنٍ يُؤخذ نموذجاً لإجراء الفحص والتحليل الكيميائي أو الحيوي عليه لمعرفة خصائصه أو مكوناته."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-14608570-n"
          definition_index: 0
          text: "جزءٌ من مادةٍ أو مكوّنٍ يُؤخذ نموذجاً لإجراء الفحص والتحليل الكيميائي أو الحيوي عليه لمعرفة خصائصه أو مكوناته."
  examples:
    per_lemma:
      - lemma: "عَيِّنَةُ الفَحْص"
        examples:
          - text: "توضع عينة الفحص في أنبوب اختبار نظيف ومعقم قبل البدء بالتحليل الكيميائي."
            type: usage
      - lemma: "مَادَّةُ الِاخْتِبَار"
        examples:
          - text: "يجب التأكد من تجانس مادة الاختبار لضمان دقة النتائج الإحصائية."
            type: usage
      - lemma: "عَيِّنَة"
        examples:
          - text: "أخذ الطبيب عينة من أنسجة المريض لإجراء فحص حيوي دقيق."
            type: usage
      - lemma: "مُقايَسَة"
        examples:
          - text: "تُستخدم المقايسة الجافة لتحليل المعادن في الخامات المأخوذة من المنجم."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "توضع عينة الفحص في أنبوب اختبار نظيف ومعقم قبل البدء بالتحليل الكيميائي."

