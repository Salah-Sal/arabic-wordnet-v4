      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "رُبَاعِيُّ الصِّيغَةِ المُتَخَالِفِ", pos: n}
