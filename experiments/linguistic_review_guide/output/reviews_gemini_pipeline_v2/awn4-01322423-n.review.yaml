    current: "(في علم الوراثة) كائن أو خلية تحتوي على مجموعة مزدوجة الصيغة الصبغية من الكروموسومات من كل والد"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على صياغة غير دقيقة 'مجموعة مزدوجة الصيغة الصبغية' والصحيح أن الكائن يحتوي على مجموعتين صبغيتين مضاعفتين من نوعين مختلفين."
    authored:
      - type: terminological
        text: "كائن حي أو خلية تحتوي على مجموعتين صبغيتين مضاعفتين مستمدتين من أبوين ينتميان إلى نوعين مختلفين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-01322423-n", definition_index: 0, text: "كائن حي أو خلية تحتوي على مجموعتين صبغيتين مضاعفتين مستمدتين من أبوين ينتميان إلى نوعين مختلفين."}
