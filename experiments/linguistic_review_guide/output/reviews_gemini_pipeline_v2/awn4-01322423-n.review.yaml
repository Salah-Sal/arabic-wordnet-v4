        examples:
          - text: "يُعَدُّ القمحُ رُبَاعِيَّ الصِّيغَةِ المُتَخَالِفِ نتيجة تهجين أنواع نباتية مختلفة."
            type: usage
      - lemma: "ضِعْفَانِيٌّ ثُنَائِيُّ الأَصْلِ"
        examples:
          - text: "تستطيع الخلايا الضِّعْفَانِيَّةُ ثُنَائِيَّةُ الأَصْلِ أن تتكاثر خضرياً للحفاظ على تركيبتها الجينية."
