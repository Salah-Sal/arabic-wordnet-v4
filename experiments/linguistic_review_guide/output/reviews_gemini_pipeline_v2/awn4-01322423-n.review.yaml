    - lemma: "مُزْدَوِجُ الضِّعْفَانِيَّةِ"
      entry_id: "{auto}"
      roots:
        - word: "مزدوج"
          root: "زوج"
          maqayis_quote: "«الزَّاءُ وَالْوَاوُ وَالْجِيمُ أَصْلٌ يَدُلُّ عَلَى مُقَارَنَةِ شَيْءٍ لِشَيْءٍ. مِنْ ذَلِكَ [الزَّوْجُ زَوْجُ الْمَرْأَةِ. وَالْمَرْأَةُ] زَوْجُ بَعْلِهَا...»"
