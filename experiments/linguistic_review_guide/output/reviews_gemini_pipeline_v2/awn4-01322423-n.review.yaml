stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'مزدوج الصيغة الصبغية المزدوج' ركيكة جداً وتتضمن تكراراً غير مبرر لكلمة 'المزدوج'."
      - "الترجمة لا تعكس بدقة مصطلح amphidiploid في سياقه العلمي بل تبدو ترجمة آلية."
    observations: "مصطلح amphidiploid يشير إلى كائن ناتج عن تهجين نوعين مختلفين بحيث يحتوي على مجموعتين صبغيتين مزدوجتين. الأنسب استخدام 'ضعفانية' أو 'متخالف' للتعبير عن هذا التكوين."
  blind_candidates:
    - lemma: "مُزْدَوِجُ الضِّعْفَانِيَّةِ"
      generation_method: tarkib
      justification: "تركيب يعبر عن أن الكائن يحتوي على ضعفانية مزدوجة (amphi + diploid)."
    - lemma: "رُبَاعِيُّ الصِّيغَةِ المُتَخَالِفِ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن كونه يحتوي على أربع مجموعات صبغية (tetraploid) من أصلين مختلفين (allo)."
    - lemma: "ضِعْفَانِيٌّ ثُنَائِيُّ الأَصْلِ"
      generation_method: tarkib
      justification: "تركيب يوضح حالة الضعفانية وكونها تنحدر من أبوين مختلفين."
    - lemma: "مُزْدَوِجُ الصِّيغَةِ الصِّبْغِيَّةِ"
      generation_method: tarkib
      justification: "ترجمة مباشرة لمكونات الكلمة، رغم أنها قد تشير للdiploid العادي."

stage2_evidence:
  per_lemma:
    - lemma: "مزدوج الصيغة الصبغية المزدوج"
      evidence_status: "no_material_found"
    - lemma: "مُزْدَوِجُ الضِّعْفَانِيَّةِ"
      confirm:
        - text: "مزدوجة الضِّعْفَانِيَّةِ (مُتَغايِرَةُ الصِّيْغَةِ الرُّباعِيَّةِ الصِّبْغِيَّة): amphidiploid (allotetraploid)"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "رُبَاعِيُّ الصِّيغَةِ المُتَخَالِفِ"
      confirm:
        - text: "رباعيّ الصيغ متخالف: كائن يحتوي على مضاعفات مجموعتين من الصبغيات من نوعين مختلفين، ويحدث هذا في النباتات ذات التضاعف الخلطيّ الصبغيّ بين الصبغيات المستمدة من سلفين مختلفين ثنائييْ المجموعة الصبغية. (allotetraploid; amphidiploid)"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "ضِعْفَانِيٌّ ثُنَائِيُّ الأَصْلِ"
      confirm:
        - text: "ضعفانيّ ثنائيّ الأصل: amphidiploid"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "مُزْدَوِجُ الصِّيغَةِ الصِّبْغِيَّةِ"
      evidence_status: "no_material_found"

