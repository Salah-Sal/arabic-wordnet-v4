        - word: "الصيغة"
          root: "صوغ"
          maqayis_quote: "«الصَّادُ وَالْوَاوُ وَالْغَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ تَهْيِئَةٌ عَلَى شَيْءٍ عَلَى مِثَالٍ مُسْتَقِيمٍ...»"
        - word: "المتخالف"
          root: "خلف"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْفَاءُ أُصُولٌ ثَلَاثَةٌ: أَحَدُهَا أَنْ يَجِيءَ شَيْءٌ بَعْدَ شَيْءٍ يَقُومُ مَقَامَهُ، وَالثَّانِي خِلَافُ قُدَّامٍ، وَالثَّالِثُ التَّغَيُّرُ...»"
    - lemma: "ضِعْفَانِيٌّ ثُنَائِيُّ الأَصْلِ"
      entry_id: "{auto}"
      roots:
        - word: "ضعفاني"
          root: "ضعف"
          maqayis_quote: "«الضَّادُ وَالْعَيْنُ وَالْفَاءُ أَصْلَانِ مُتَبَايِنَانِ، يَدُلُّ أَحَدُهُمَا عَلَى خِلَافِ الْقُوَّةِ، وَيَدُلُّ الْآخَرُ عَلَى أَنْ يُزَادَ الشَّيْءُ مِثْلَهُ...»"
        - word: "ثنائي"
          root: "ثني"
          maqayis_quote: "«الثَّاءُ وَالنُّونُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَكْرِيرُ الشَّيْءِ مَرَّتَيْنِ، أَوْ جَعْلُهُ شَيْئَيْنِ مُتَوَالِيَيْنِ أَوْ مُتَبَايِنَيْنِ...»"
        - word: "الأصل"
          root: "اصل"
          maqayis_quote: "«الْهَمْزَةُ وَالصَّادُ وَاللَّامُ، ثَلَاثَةُ أُصُولٍ مُتَبَاعِدٍ بَعْضُهَا مِنْ بَعْضٍ، أَحَدُهَا: أَسَاسُ الشَّيْءِ...»"
