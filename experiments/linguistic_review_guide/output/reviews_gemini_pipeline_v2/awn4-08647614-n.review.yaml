    - command: set_metadata
      params: {entity_type: sense, entity_id: "{auto}", key: note, value: '{"nuance":"يشير إلى الفراغ الفيزيائي أو المتوهم الذي يشغله الجسم.","mwe":false}'}
    - command: set_metadata
      params: {entity_type: sense, entity_id: "{auto}", key: note, value: '{"nuance":"لفظ تراثي يدل على الناحية أو الجهة من الأرض.","mwe":false}'}
