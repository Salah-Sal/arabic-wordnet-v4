stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'دُنْيَوِيّ' هي في الأصل صفة (Adjective)، واستخدامها كاسم (Noun) لتعريف الشخص (worldling) هو من قبيل النقل الدلالي أو الترجمة الحرفية عن الإنجليزية."
      - "تفتقر المجموعة لأسماء الذوات المركبة التي تعبر عن هذا المفهوم في التراث العربي بدقة مثل 'عَبْدُ الدُّنْيَا'."
    observations: "المفهوم يشير إلى الشخص الذي يحصر اهتمامه في العالم المادي، وهو ما يعبر عنه في العربية بأسماء مركبة إضافية غالباً."
  blind_candidates:
    - lemma: "عَبْدُ الدُّنْيَا"
      generation_method: tarkib
      justification: "تعبير تراثي مسكوك يصف من استغرقت الدنيا همّه وخدمته، ورد في الحديث الشريف (تعس عبد الدنيا)."
    - lemma: "مُحِبُّ الدُّنْيَا"
      generation_method: tarkib
      justification: "تعبير وصفي اصطلاحي يطابق دلالة 'worldling' في المعاجم الحديثة."
    - lemma: "مُنْكَبٌّ عَلَى الدُّنْيَا"
      generation_method: tarkib
      justification: "وصف لمن انغمس في شؤون الدنيا ومصالحها."
    - lemma: "مَادِّيّ"
      generation_method: ishtiqaq
      justification: "منسوب إلى المادة، ويطلق على من يهتم بالجانب المادي والمصالح العاجلة."

stage2_evidence:
  per_lemma:
    - lemma: "دُنْيَوِيّ"
      confirm:
        - text: "«دُنْيَوِيّ؛ زمنيّ»"
          source: "المورد الحديث"
      expands:
        - text: "«دُنيويّ التَّفكير؛ منصرفٌ إلى شؤون الدُّنيا أو منهمكٌ فيها»"
          source: "المورد الحديث"
    - lemma: "عَبْدُ الدُّنْيَا"
      confirm:
        - text: "«عبد الدنيا: المعتكف على خدمتها ومراعاتها، وإياه قصد المصطفى بقوله: تعس عبد الدنيا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "مُحِبُّ الدُّنْيَا"
      confirm:
        - text: "«مُحِبّ الدُّنيا: المنغمس في شؤون الدُّنيا ومباهجها إلخ»"
          source: "المورد الحديث (ترجمة لـ worldling)"
    - lemma: "مَادِّيّ"
      confirm:
        - text: "«أو نسبة إلى المادية: مذهب يسلم بوجود المادة وحدها وبها يفسر الكون والمعرفة والسلوك»"
          source: "موسوعة السلطان قابوس"

stage3_analysis:
  per_lemma:
    - lemma: "دُنْيَوِيّ"
      decision: confirmed
      decision_reason: "رغم كونها صفة في الأصل، إلا أنها مستخدمة في المعاجم الحديثة (كالمورد) كترجمة للمصطلح الإنجليزي وللدلالة على من انصرف لبه للدنيا."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُنْيَوِيّ"
    - lemma: "عَبْدُ الدُّنْيَا"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي فصيح ومسكوك يطابق التعريف بدقة عالية وله مرجعية في الأدب الأخلاقي العربي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "عَبْدُ الدُّنْيَا"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مُحِبُّ الدُّنْيَا"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معاصر واضح الدلالة، استعمله المترجمون كمعادل دقيق لكلمة worldling."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "مُحِبُّ الدُّنْيَا"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "شخص مستغرق في هموم ومصالح وملذات العالم الحالي (الدنيا)"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكنه يحتاج لسبك معجمي أكثر رصانة وتجنب الأقواس."
    authored:
      - type: terminological
        text: "شخصٌ غارقٌ في هُمومِ الحَياةِ الدُّنْيَا ومَصالحِها ومَلَذَّاتِها، مُنْصَرِفٌ عَمَّا سِواها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخصٌ غارقٌ في هُمومِ الحَياةِ الدُّنْيَا ومَصالحِها ومَلَذَّاتِها، مُنْصَرِفٌ عَمَّا سِواها."
  examples:
    per_lemma:
      - lemma: "دُنْيَوِيّ"
        examples:
          - text: "يَبْدُو أَنَّهُ رَجُلٌ دُنْيَوِيٌّ لَا يَأْبَهُ لِلْمَثُلِ العُلْيَا."
            type: usage
      - lemma: "عَبْدُ الدُّنْيَا"
        examples:
          - text: "تَعِسَ عَبْدُ الدُّنْيَا الذِي لَا يَسْعَى إِلَّا لِجَمْعِ حُطَامِهَا."
            type: usage
      - lemma: "مُحِبُّ الدُّنْيَا"
        examples:
          - text: "مُحِبُّ الدُّنْيَا لَا يَشْبَعُ مِنْ مَلَذَّاتِهَا الزَّائِلَةِ."
            type: usage

