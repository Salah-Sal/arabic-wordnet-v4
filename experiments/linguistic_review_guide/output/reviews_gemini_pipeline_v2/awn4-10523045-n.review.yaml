stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دوري (circular) حيث يستخدم كلمة 'راديكالية' لتعريف 'راديكالي'."
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "غياب مصطلح 'جذري' وهو المقابل العربي الأدق دلالياً واشتقاقياً لكلمة radical."
    observations: "المفهوم يشير إلى الشخص الذي يتبنى آراءً تدعو لتغيير جذري وشامل. المصطلح يراوح بين التعريب (راديكالي) والاشتقاق الدلالي (جذري) والوصف السلوكي (متطرف)."
  blind_candidates:
    - lemma: "جِذْرِيّ"
      generation_method: ishtiqaq
      justification: "اشتقاق مباشر من 'الجذر' وهو المقابل المعنوي لـ radix اللاتينية، ويستخدم لوصف الشخص الذي يطلب التغيير من الجذور."
    - lemma: "مُتَطَرِّف"
      generation_method: ishtiqaq
      justification: "من 'الطرف'، وهو الشائع في العربية للتعبير عن الخروج عن المألوف والذهاب إلى أقصى حدود الفكرة."
    - lemma: "ثَوْرِيّ"
      generation_method: ishtiqaq
      justification: "كثيراً ما يتداخل الراديكالي مع الثوري في السياق السياسي والاجتماعي."
    - lemma: "رَادِيكَالِيّ"
      generation_method: taarib
      justification: "المصطلح العالمي المعرب والشائع في الكتابات الأكاديمية والسياسية."

stage2_evidence:
  per_lemma:
    - lemma: "راديكالي"
      confirm:
        - text: "الراديكاليّ: نزّاع إلى إحداث تغيّرات متطرِّفة في الفكرات والعادات السائدة أو في الأحوال والمؤسَّسات القائمة."
          source: "المورد الحديث"
    - lemma: "متطرف"
      confirm:
        - text: "مَن يَخْرُج بِعَنْفٍ على الآراء الْمُعتادَة والسُّلُوكِ المألوفِ صاحبُ نَزْعَةٍ سياسية أو دينية مُغالية"
          source: "المعجم الكبير"
        - text: "شخص متطرّف أو راديكالي"
          source: "المورد الحديث"
    - lemma: "جذري"
      confirm:
        - text: "(1) جَذْريّ ... (3) شخص متطرّف أو راديكالي"
          source: "المورد الحديث"
      expands:
        - text: "نسبة إلى الجِذْر: أصل كل شيء."
          source: "موسوعة السلطان قابوس"

stage3_analysis:
  per_lemma:
    - lemma: "راديكالي"
      decision: confirmed
      decision_reason: "مصطلح معرب مستقر في اللغة السياسية والاجتماعية المعاصرة، وموثق في المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَادِيكَالِيّ"
    - lemma: "متطرف"
      decision: confirmed
      decision_reason: "يعبر عن الجانب السلوكي والفكري للراديكالية من حيث الخروج عن المألوف والذهاب إلى الأطراف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَطَرِّف"
    - lemma: "جذري"
      source: stage1
      decision: confirmed
      decision_reason: "هو المقابل العربي الأصيل (كاشتقاق دلالي) لكلمة radical، ويستخدم بكثرة في السياقات السياسية والفكرية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "جِذْرِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10523045-n"}

stage4_content:
  definition:
    current: "شخص لديه أفكار أو آراء راديكالية"
    assessment:
      decision: revise
      reason: "التعريف الحالي دوري ولا يشرح طبيعة المفهوم بوضوح."
    authored:
      - type: terminological
        text: "شخصٌ يَدْعُو إلى إِحْدَاثِ تَغْيِيرَاتٍ جِذْرِيَّةٍ وَشَامِلَةٍ فِي النِّظَامِ السِّيَاسِيِّ أَوِ الِاجْتِمَاعِيِّ السَّائِدِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-10523045-n", definition_index: 0, text: "شخصٌ يَدْعُو إلى إِحْدَاثِ تَغْيِيرَاتٍ جِذْرِيَّةٍ وَشَامِلَةٍ فِي النِّظَامِ السِّيَاسِيِّ أَوِ الِاجْتِمَاعِيِّ السَّائِدِ."}
  examples:
    per_lemma:
      - lemma: "رَادِيكَالِيّ"
        examples:
          - text: "يُعْرَفُ هَذَا الْكَاتِبُ بِمَوَاقِفِهِ الرَّادِيكَالِيَّةِ الَّتِي تُطَالِبُ بِإِلْغَاءِ الْمُؤَسَّسَاتِ التَّقْلِيدِيَّةِ."
            type: usage
      - lemma: "مُتَطَرِّف"
        examples:
          - text: "كَانَ يُنْظَرُ إِلَيْهِ عَلَى أَنَّهُ مُتَطَرِّفٌ بِسَبَبِ مُطَالَبَتِهِ بِتَغْيِيرِ الدُّسْتُورِ بِالْكَامِلِ."
            type: usage
      - lemma: "جِذْرِيّ"
        examples:
          - text: "هِيَ حَرَكَةٌ جِذْرِيَّةٌ تَسْعَى لِإِعَادَةِ بِنَاءِ الْمُجْتَمَعِ عَلَى أُسُسٍ جَدِيدَةٍ تَمَاماً."
            type: usage

