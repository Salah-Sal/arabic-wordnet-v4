      maqayis_quote: "«الضَّادُ وَالْخَاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عِظَمٍ فِي الشَّيْءِ. يُقَالُ: هَذَا ضَخْمٌ وَضُخَامٌ.»"
