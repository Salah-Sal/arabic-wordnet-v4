stage4_content:
  definition:
    current: "زيادة عامة ومستمرة في الأسعار"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد كبداية، لكن يفضل إضافة تعريف أكثر دقة يشرح الجانب الاقتصادي للظاهرة لتمييزها عن الارتفاع العارض."
    authored:
      - type: terminological
        text: "حالة اقتصادية تتميز بزيادة مطردة في المستوى العام للأسعار، ناتجة عادة عن اختلال التوازن بين كمية النقد المتداول وحجم السلع والخدمات المعروضة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ظاهرة تؤدي إلى انخفاض القوة الشرائية للعملة، حيث تتطلب شراء نفس الكمية من السلع مبالغ نقدية أكبر بمرور الوقت، وقد تكون ناتجة عن زيادة التكاليف أو قوة الطلب."
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13520031-n", definition_index: 0, text: "زيادة عامة ومستمرة ومطردة في المستوى العام للأسعار تؤدي إلى انخفاض القوة الشرائية للعملة."}
      - command: add_definition
        params: {synset_id: "awn4-13520031-n", text: "حالة من الخلل الاقتصادي ناتجة عن زيادة النقد المتداول عن حاجة المعاملات الحقيقية، مما يسبب ارتفاعاً في أثمان الخدمات والمنتجات."}

  examples:
    per_lemma:
      - lemma: "تَضَخُّمٌ"
        examples:
          - text: "يؤدي التضخم المتسارع إلى تآكل القيمة الشرائية للمدخرات الوطنية."
            type: usage
      - lemma: "ارْتِفَاعُ الأَسْعَارِ"
        examples:
          - text: "تشتكي الأسر من الارتفاع المستمر في أسعار المواد الغذائية الأساسية."
            type: usage
      - lemma: "غَلَاءٌ"
        examples:
          - text: "شهدت البلاد موجة غلاء طالت معظم المرافق والسلع."
            type: usage
      - lemma: "تَضَخُّمٌ مَالِيٌّ"
        examples:
          - text: "اتخذ البنك المركزي إجراءات نقدية صارمة للحد من التضخم المالي."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-13520031-n", text: "يعتبر التضخم أحد أكبر التحديات التي تواجه الاستقرار الاقتصادي في العصر الحديث."}

