          maqayis_quote: "«السِّينُ وَالْعَيْنُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى اشْتِعَالِ الشَّيْءِ وَاتِّقَادِهِ وَارْتِفَاعِهِ... فَأَمَّا سِعْرُ الطَّعَامِ فَهُوَ مِنْ هَذَا أَيْضًا ; لِأَنَّهُ يَرْتَفِعُ وَيَعْلُو.»"
    - lemma: "تَضَخُّمٌ مَالِيٌّ"
