      maqayis_quote: "«الْغَيْنُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ فِي الْأَمْرِ يَدُلُّ عَلَى ارْتِفَاعٍ وَمُجَاوَزَةِ قَدْرٍ. يُقَالُ: غَلَا السِّعْرُ يَغْلُو غَلَاءً، وَذَلِكا ارْتِفَاعُهُ.»"
    - lemma: "ارْتِفَاعُ الأَسْعَارِ"
