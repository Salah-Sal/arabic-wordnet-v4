stage1_review:
  assessment:
    concerns:
      - المصطلحات الحالية جيدة ولكن يمكن إغناؤها بالمصطلحات الاقتصادية الأكثر دقة والكلمات التراثية الشائعة.
    observations: "المجموعة تعبر عن ظاهرة اقتصادية أساسية. المصطلح 'تضخم' هو المصطلح التقني المعاصر، بينما 'ارتفاع الأسعار' هو الوصف الظاهري المباشر. يوجد مصطلح 'غلاء' وهو المصطلح العربي الأصيل لهذه الحالة."
  blind_candidates:
    - lemma: "تَضَخُّمٌ"
      generation_method: ishtiqaq
      justification: "المصطلح الاقتصادي القياسي المشتق من الضخامة (الزيادة)."
    - lemma: "ارْتِفَاعُ الأَسْعَارِ"
      generation_method: tarkib
      justification: "تعبير إضافي وصفي مباشر للظاهرة."
    - lemma: "غَلَاءٌ"
      generation_method: majaz
      justification: "لفظ تراثي أصيل يعبر عن تجاوز السعر للقدر المعتاد."
    - lemma: "تَضَخُّمٌ مَالِيٌّ"
      generation_method: tarkib
      justification: "تعبير مركب أكثر تخصصاً في السياق الاقتصادي والنقدي."

stage2_evidence:
  per_lemma:
    - lemma: "تَضَخُّمٌ"
      confirm:
        - text: "«(في علم الاقتصاد) Inflation: تناقصُ قيمة العُمْلة الشرائية؛ نتيجةَ الزيادةِ المفرطة في النقد المتداول... الأمرُ الذي يُؤَدِّي إلى ارتفاع أسعار الخدمات والمنتجات»"
          source: "المعجم الكبير"
        - text: "«زيادة في المستوى العام للأسعار على مدى فترة من الزمن»"
          source: "ArabTerm"
      expands:
        - text: "«(في الطب) Enlargement: زيادةٌ في حجم عضو، أو نسيج»"
          source: "المعجم الكبير"
          addition: "معنى طبي يشترك في اللفظ"
    - lemma: "ارْتِفَاعُ الأَسْعَارِ"
      confirm:
        - text: "«الأمرُ الذي يُؤَدِّي إلى ارتفاع أسعار الخدمات والمنتجات»"
          source: "المعجم الكبير (ضمن تعريف التضخم)"
    - lemma: "غَلَاءٌ"
      confirm:
        - text: "«ارتفاع السعر»"
          source: "المعجم الوسيط"
        - text: "«الغين واللام والحرف المعتل أصل صحيح في الأمر يدل على ارتفاع ومجاوزة قدر. يقال: غلا السعر يغلو غلاءً، وذلك ارتفاعه»"
          source: "مقاييس اللغة"
    - lemma: "تَضَخُّمٌ مَالِيٌّ"
      confirm:
        - text: "«زيادة في نسبة العملة فيما يخص توافر الأصول والسلع والبضائع والخدمات»"
          source: "ArabTerm"

