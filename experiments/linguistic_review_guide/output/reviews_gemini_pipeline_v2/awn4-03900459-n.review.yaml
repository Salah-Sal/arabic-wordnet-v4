    - lemma: "تَوْزِيعَة"
      evidence_status: "no_material_found"
    - lemma: "تَذْكَارُ الْحَفْلِ"
      evidence_status: "no_material_found"
    - lemma: "هَدِيَّةُ الزَّائِرِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "هدية الحفل"
      decision: confirmed
      decision_reason: "مصطلح مركب إضافي شفاف يعبر بدقة عن مفهوم الهدية الصغيرة التي تقدم للضيوف في الحفلات، وهو مفهوم مستخدم بشكل واسع وإن لم يُنص عليه في المعاجم القديمة بهذا التركيب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَدِيَّةُ الْحَفْلِ"

    - lemma: "تَوْزِيعَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معاصر وشائع جداً (وخاصة بصيغة الجمع 'توزيعات') للتعبير عن الهدايا التذكارية التي توزع على ضيوف المناسبات والحفلات، وصيغته الصرفية سليمة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَوْزِيعَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03900459-n"

    - lemma: "تَذْكَارُ الْحَفْلِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب إضافي يميل إلى الوصف، وليس له ثبات واستقرار المعنى الاصطلاحي مثل 'هدية الحفل' أو 'توزيعات'."

    - lemma: "هَدِيَّةُ الزَّائِرِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي عام يمكن أن ينطبق على أي زائر في أي سياق، وليس مخصوصاً بضيوف الحفلات."

stage4_content:
  definition:
    current: "تذكار عبارة عن هدية صغيرة تعطى للضيوف في حفلة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مفهوم ولكنه أقرب للترجمة الحرفية وركيك التركيب؛ تم إعادة الصياغة لتكون أدق وبأسلوب معجمي أنسب."
    authored:
      - type: terminological
        text: "هديّة رمزيّة صغيرة تُوزّع على ضيوف الحفل تذكاراً لهم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-03900459-n"
          definition_index: 0
          text: "هديّة رمزيّة صغيرة تُوزّع على ضيوف الحفل تذكاراً لهم."

  examples:
    per_lemma:
      - lemma: "هدية الحفل"
        examples:
          - text: "وزع العروسان هدايا الحفل على المدعوين في نهاية الزفاف."
            type: usage
      - lemma: "تَوْزِيعَة"
        examples:
          - text: "تضمنت التوزيعات التي قُدمت للأطفال حلوى وألعاباً صغيرة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وزع العروسان هدايا الحفل على المدعوين في نهاية الزفاف."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تضمنت التوزيعات التي قُدمت للأطفال حلوى وألعاباً صغيرة."

