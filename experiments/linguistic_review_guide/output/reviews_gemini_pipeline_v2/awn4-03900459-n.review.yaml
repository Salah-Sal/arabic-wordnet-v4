stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (هدية الحفل) تعتبر تركيباً وصفياً مباشراً وليس مصطلحاً مسكوكاً قديماً."
      - "يغيب عن المجموعة مصطلح 'توزيعات/توزيعة' وهو الشائع جداً في الاستخدام المعاصر للدلالة على هدايا الحفلات."
    observations: "المفهوم يشير إلى الهدايا الرمزية التي يتلقاها ضيوف الحفل، سواء كان زفافاً أو عيد ميلاد أو غيره، كتذكار. في الثقافة العربية المعاصرة، أصبحت هذه الهدايا تُعرف باسم 'توزيعات'."
  blind_candidates:
    - lemma: "تَوْزِيعَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الفعل وزع، وتطلق في العرف المعاصر على الهدايا التي توزع في الحفلات."
    - lemma: "هَدِيَّةُ الْحَفْلِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف بدقة الهدية المقدمة بمناسبة الحفل."
    - lemma: "تَذْكَارُ الْحَفْلِ"
      generation_method: tarkib
      justification: "تركيب إضافي يشير إلى الجانب التذكاري من الهدية."
    - lemma: "هَدِيَّةُ الزَّائِرِ"
      generation_method: tarkib
      justification: "تركيب إضافي لبيان أن الهدية مخصصة للضيف والزائر."

