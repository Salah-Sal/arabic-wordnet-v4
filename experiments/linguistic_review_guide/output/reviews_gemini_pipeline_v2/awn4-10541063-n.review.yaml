stage1_review:
  assessment:
    concerns:
      - "المصطلح الإنجليزي (repeater) له دلالات متعددة (شخص، جهاز إلكتروني، سلاح). المجموعة هنا تقتصر على الدلالة البشرية (الشخص الذي يكرر)."
    observations: "مصطلح 'مُكَرِّر' كاسم فاعل يعبر بدقة عن من يقوم بفعل التكرار، وهو قياسي وصحيح صرفياً للعمل كمدخل معجمي دال على الفاعل."
  blind_candidates:
    - lemma: "مُكَرِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل كَرَّرَ، يدل على من يقوم بفعل التكرار."
    - lemma: "مُرَدِّد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل رَدَّدَ، يدل على من يكرر الكلام أو الفعل."
    - lemma: "مُعِيد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل أَعَادَ، بمعنى من يعيد أو يكرر الفعل."
    - lemma: "رَدَّاد"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال تدل على كثرة التكرار أو الإعادة."

stage2_evidence:
  per_lemma:
    - lemma: "مُكَرِّر"
      evidence_status: "no_material_found"
    - lemma: "مُرَدِّد"
      contradicts:
        - text: "الشَّديدُ الحَيْرَةِ. يُقال: رَجُلٌ مُرَدَّدٌ: حائِرٌ, بائِرٌ"
          source: "المعجم الكبير"
          conflict: "دلالة معجمية مختلفة تماماً (الحائر)، واسم الفاعل منه عادة مقصور على ترديد الكلام (مردد الشعارات)."
    - lemma: "مُعِيد"
      contradicts:
        - text: "الحاذق المجرِّب للأمور العالم بها من يتولى إعادة شرح ما غمض من شرح الأستاذ لتلاميذه من يتولى منصباً تعليمياً فى الجامعة قبل أن يحصل على منصب المدرس"
          source: "المعجم الوسيط"
          conflict: "الدلالة مخصصة أكاديمياً لوظيفة المعيد في الجامعات، ولا تستخدم في السياق العام للتكرار كفاعل."
    - lemma: "رَدَّاد"
      contradicts:
        - text: "المُجَبِّرُ اسم رَجُلٍ يُنْسَبُ إليه المُجَبِّرون. فكلُّ مُجَبِّرٍ يقال له: رَدَّادٌ, والنِّسْبَةُ إليه رَدَّادِيّ"
          source: "المعجم الكبير"
          conflict: "دلالة مختلفة تشير إلى المجبّر للعظام."

stage3_analysis:
  per_lemma:
    - lemma: "مُكَرِّر"
      decision: confirmed
      decision_reason: "صيغة اسم الفاعل القياسية من الفعل كَرَّرَ، وتدل بوضوح على الشخص الذي يقوم بفعل التكرار وهي تناسب المفهوم الإنجليزي (repeater) بدقة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُكَرِّر"
    - lemma: "مُرَدِّد"
      source: stage1
      decision: removed
      decision_reason: "دلالته المعجمية تعني الشخص الحائر، واستخدامه الشائع يقتصر على إعادة الكلام (كالببغاء) وليس الأفعال."
      evidence_assessment:
        case: contradicts_only
    - lemma: "مُعِيد"
      source: stage1
      decision: removed
      decision_reason: "مخصصة دلالياً واصطلاحياً للمنصب الأكاديمي (المعيد الجامعي)."
      evidence_assessment:
        case: contradicts_only
    - lemma: "رَدَّاد"
      source: stage1
      decision: removed
      decision_reason: "دلالته الأساسية تعني المجبّر للكسور، أو الشخص كثير الرجوع، ولا تناسب هذا المفهوم بدقة."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "شخص يكرر فعل الشيء"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ومباشر ويفي بالغرض."
  examples:
    per_lemma:
      - lemma: "مُكَرِّر"
        examples:
          - text: "كان اللاعب مُكَرِّراً لأخطائه السابقة مما أدى إلى خسارة فريقه."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كان اللاعب مُكَرِّراً لأخطائه السابقة مما أدى إلى خسارة فريقه."

