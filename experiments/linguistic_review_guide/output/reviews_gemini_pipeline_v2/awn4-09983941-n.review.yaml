# المرحلة ١: المراجعة والتوليد (بدون أدلة)
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة صحيحة لغوياً ولكنها تفتقر إلى الألفاظ التي تعكس الدلالة المجازية أو التراثية المقابلة لـ copycat و emulator."
    observations: "المفهوم يشير إلى الشخص الذي يكرر أفعال غيره، وهو مفهوم مركزي في علم الاجتماع واللغة. اللمّات الحالية 'مقلد' و'محاك' هي اللمّات الوصفية الأساسية."
  blind_candidates:
    - lemma: "مُقَلِّد"
      generation_method: ishtiqaq
      justification: "الاسم المشتق القياسي لمن يقوم بفعل التقليد، وهو الأكثر شيوعاً ودقة."
    - lemma: "مُحَاكٍ"
      generation_method: ishtiqaq
      justification: "اسم الفاعل من حاكى، ويستخدم في السياقات الأدبية (المحاكاة الأرسطية) والتقنية (المحاكي)."
    - lemma: "إِمَّعَة"
      generation_method: majaz
      justification: "لفظ تراثي بليغ يعبر عن الشخص الذي يتبع غيره بلا رأي ولا بصيرة، وهو مقابل دقيق لـ copycat في دلالته السلبية."
    - lemma: "مُحْتَذٍ"
      generation_method: ishtiqaq
      justification: "من 'احتذى'، ويستخدم لمن يتبع مثالاً أو نموذجاً معيناً (احتذى حذوه)."

# المرحلة ٢: جمع الأدلة
stage2_evidence:
  per_lemma:
    - lemma: "مُقَلِّد"
      confirm:
        - text: "«المحاكي المتبع غيره فيما يقوله أو يفعل من غير حجة ولا دليل»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«المقلِّد؛ المُحاكي» ترجمة لـ copycat"
          source: "المورد الحديث"
    - lemma: "مُحَاكٍ"
      confirm:
        - text: "«جهاز أو برنامج يجري عملية المحاكاة»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«المحاكي؛ المقلِّد» ترجمة لـ copycat"
          source: "المورد الحديث"
      expands:
        - text: "«اصطلاح أرسطي لإبراز العلاقة بين الأدب والواقع كمحاكاة لنموذج»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "إِمَّعَة"
      confirm:
        - text: "«المقلِّد الذى جعل دينه تابعا لدين غيره بلا رويَّة ولا تحصيل بُرهان»"
          source: "المعجم الكبير"
        - text: "«الضعيف الرأي القائل لكل أحد أنا معك»"
          source: "مقاييس اللغة"
        - text: "«الموافق على رأي أو سياسة من غير تفكير أو مناقشة» ترجمة لـ copycat"
          source: "المورد الحديث"
    - lemma: "مُضَاهٍ"
      confirm:
        - text: "«المُنافِس؛ المُحاكي؛ المُضاهي» ترجمة لـ emulator"
          source: "المورد الحديث"
        - text: "«مُضَاهٍ ، مُقلِّد» ترجمة لـ emulator"
          source: "معجم مصطلحات المعلوماتية"
    - lemma: "مُحْتَذٍ"
      evidence_status: "no_material_found"

# المرحلة ٣: التحليل اللغوي للّمات
stage3_analysis:
  per_lemma:
    - lemma: "مُقَلِّد"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والمباشر للمفهوم، مدعوم بقوة في المعاجم الحديثة والقديمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقَلِّد"
    - lemma: "مُحَاكٍ"
      decision: confirmed
      decision_reason: "لفظ فصيح يستخدم في سياق محاكاة الأفعال والأنماط، وهو مرادف قوي للمقلد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَاكٍ"
    - lemma: "إِمَّعَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل يعبر عن التقليد الأعمى والتبعية، وهو مكافئ ثقافي ممتاز لـ copycat."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِمَّعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُضَاهٍ"
      decision: confirmed
      decision_reason: "يستخدم غالباً للتعبير عن المضاهاة في المحاكاة، وهو ترجمة معتمدة لـ emulator."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُضَاهٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُحْتَذٍ"
      source: stage1
      decision: removed
      decision_reason: "رغم صحته اللغوية، إلا أنه يميل إلى معنى الاقتداء الحسن ولا يعبر بدقة عن 'النسخ' المحض المقصود في المجموعة."

# المرحلة ٤: التعريف والأمثلة
stage4_content:
  definition:
    current: "شخص ينسخ كلمات أو سلوك شخص آخر"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً؛ يفضل صياغته بأسلوب معجمي يجمع بين الجوانب السلوكية واللفظية."
    authored:
      - type: terminological
        text: "مَنْ يَتَّبِعُ غَيْرَهُ فِي قَوْلِهِ أَوْ فِعْلِهِ، أَوْ يُحَاكِي سُلُوكَهُ أَوْ كَلَامَهُ تَقْلِيدًا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مَنْ يَتَّبِعُ غَيْرَهُ فِي قَوْلِهِ أَوْ فِعْلِهِ، أَوْ يُحَاكِي سُلُوكَهُ أَوْ كَلَامَهُ تَقْلِيدًا."}
  examples:
    per_lemma:
      - lemma: "مُقَلِّد"
        examples:
          - text: "الطفلُ مُقَلِّدٌ بارعٌ لكلِّ ما يَسمعُه ويَراهُ من الكبارِ."
            type: usage
      - lemma: "إِمَّعَة"
        examples:
          - text: "«لاَ يَكُونَنَّ أَحَدُكُمْ إِمَّعَةً، يَقُولُ: أَنَا مَعَ النَّاسِ»"
            type: hadith
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "الطفلُ مُقَلِّدٌ بارعٌ لكلِّ ما يَسمعُه ويَراهُ من الكبارِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُوصَفُ التَّابِعُ الذي لا رَأْيَ له بِأَنَّهُ إِمَّعَةٌ."}

# المرحلة ٥: الإثراء (البيانات الوصفية)
stage5_enrichment:
  per_entry:
    - lemma: "مُقَلِّد"
      entry_id: "{auto}"
      root: "قلد"
      maqayis_quote: "«الْقَافُ وَاللَّامُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدَهُمَا عَلَى تَعْلِيقِ شَيْءٍ عَلَى شَيْءٍ وَلِيَهُ بِهِ، وَالْآخَرُ عَلَى حَظٍّ وَنَصِيبٍ... وَأَصْلُ الْقَلْدِ: الْفَتْلُ، يُقَالُ قَلَدْتُ الْحَبْلَ أَقْلِدُهُ قَلْدًا، إِذَا فَتَلْتُهُ.»"
    - lemma: "مُحَاكٍ"
      entry_id: "{auto}"
      root: "حكي"
      maqayis_quote: "«الْحَاءُ وَالْكَافُ وَمَا بَعْدَهَا مُعْتَلٌّ أَصْلٌ وَاحِدٌ... يُقَالُ حَكَيْتُ الشَّيْءَ أَحْكِيهِ، وَذَلِكَ أَنْ تَفْعَلَ مِثْلَ فِعْلِ الْأَوَّلِ.»"
    - lemma: "إِمَّعَة"
      entry_id: "{auto}"
      root: "أمع"
      maqayis_quote: "«الْهَمْزَةُ وَالْمِيمُ وَالْعَيْنُ، لَيْسَ بِأَصْلٍ، وَالَّذِي جَاءَ فِيهِ رَجُلٌ إِمَّعَةٌ، وَهُوَ الضَّعِيفُ الرَّأْيِ، الْقَائِلُ لِكُلِّ أَحَدٍ أَنَا مَعَكَ.»"
    - lemma: "مُضَاهٍ"
      entry_id: "{auto}"
      root: "ضهي"
      maqayis_quote: "«الضَّادُ وَالْهَاءُ وَالْيَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مُشَابَهَةِ شَيْءٍ لِشَيْءٍ. يُقَالُ: ضَاهَاهُ يُضَاهِيهِ، إِذَا شَاكَلَهُ.»"
  per_sense:
    - lemma: "مُقَلِّد"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشامل لكل أنواع المحاكاة والاتباع."
      mwe: false
    - lemma: "مُحَاكٍ"
      sense_id: "{auto}"
      nuance: "يركز على الجانب الفني أو التقني أو الشكلي في النسخ."
      mwe: false
    - lemma: "إِمَّعَة"
      sense_id: "{auto}"
      nuance: "يدل على التبعية العمياء وضعف الشخصية، وهو مكافئ سلبي."
      mwe: false
    - lemma: "مُضَاهٍ"
      sense_id: "{auto}"
      nuance: "يشير إلى محاكاة الشيء للوصول إلى مرتبته أو مشابهته في القوة والوظيفة."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قلد","maqayis":"«الْقَافُ وَاللَّامُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حكي","maqayis":"«الْحَاءُ وَالْكَافُ وَمَا بَعْدَهَا مُعْتَلٌّ أَصْلٌ وَاحِدٌ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"أمع","maqayis":"«الْهَمْزَةُ وَالْمِيمُ وَالْعَيْنُ، لَيْسَ بِأَصْلٍ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ضهي","maqayis":"«الضَّادُ وَالْهَاءُ وَالْيَاءُ أَصْلٌ صَحِيحٌ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ العام والشامل لكل أنواع المحاكاة والاتباع.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
