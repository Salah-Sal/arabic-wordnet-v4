          params:
            entry_id: "{auto}"
            new_lemma: "جَوْهَر"
    - lemma: "مُسْتَخْلَص"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح التقني المعاصر الأكثر دقة لعملية الاستخلاص (Extract)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
