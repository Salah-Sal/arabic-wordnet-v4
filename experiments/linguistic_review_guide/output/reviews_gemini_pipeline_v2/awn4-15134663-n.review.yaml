stage1_review:
  assessment:
    concerns:
      - "اللفظ 'جَوْهَر' قد يكون واسع الدلالة (فلسفياً) مقارنة بالسياق الصيدلاني/النباتي الدقيق لهذه المجموعة."
      - "المجموعة تفتقر إلى المصطلحات التقنية الحديثة مثل 'مُسْتَخْلَص'."
    observations: "المجموعة تدور حول المادة المستخرجة ذات الخصائص المركزة. الألفاظ الموجودة (جوهر، خلاصة) صحيحة ولكنها تحتاج إلى تشكيل كامل ودعم بمرادفات تقنية وعلمية."
  blind_candidates:
    - lemma: "خُلَاصَة"
      generation_method: ishtiqaq
      justification: "الاسم الأشهر لزبدة الشيء وما استخلص من خصائصه."
    - lemma: "مُسْتَخْلَص"
      generation_method: ishtiqaq
      justification: "اسم المفعول من استخلص، وهو المصطلح العلمي الدقيق لعملية الـ (extraction)."
    - lemma: "رُوح"
      generation_method: majaz
      justification: "تستخدم في الصيدلة والطب القديم والحديث للدلالة على المادة الطيارة أو الجوهر المقطر (مثل روح النعناع)."
    - lemma: "عُصَارَة"
      generation_method: ishtiqaq
      justification: "ما ينتج عن عصر النبات، وهي نوع من الاستخراج الميكانيكي للجوهر."

stage2_evidence:
  per_lemma:
    - lemma: "خُلَاصَة"
      confirm:
        - text: "«زُبْدة الشيء... ما يُسْتَخْرَجُ من المادَّةِ حاوِيًا لخصائِصِها»"
          source: "المعجم الوسيط"
        - text: "«مركب عياري مركز يحتوي على المواد الفعالة المستخلصة من نبات أو حيوان»"
          source: "معجم المصطلحات الطبية"
    - lemma: "جَوْهَر"
      confirm:
        - text: "«مستحضر محتو على الجواهر الفعّألة المخرجة بمذيب أو بالعصر»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
        - text: "«(1) جوهر الشَّيء أو كُنْهُهُ... (3) الرُّوح: مادة مستخلصة من نبات...»"
          source: "المورد الحديث"
    - lemma: "مُسْتَخْلَص"
      confirm:
        - text: "«المادة التي تكون عادة فعالة متحصل عليها بواسطة مذيب مناسب من نسيج حيويّ»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
        - text: "«مستحضر محتو على الجواهر الفعّألة المخرجة بمذيب أو بالعصر»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "رُوح"
      confirm:
        - text: "«خلاصةُ بعض العقاقير وما يُقطَّر من بعض النباتات «رُوح الزَّهْر»»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«رُوحُ النَّعْناع: essence of peppermint»"
          source: "المعجم الطبي الموحد"
    - lemma: "عُصَارَة"
      confirm:
        - text: "«ما يتحلب من الشيء إذا عصر»"
          source: "مقاييس اللغة"
        - text: "«كل سائل من الأنسجة النباتية أو الحيوانية»"
          source: "معجم المصطلحات الطبية"

stage3_analysis:
  per_lemma:
