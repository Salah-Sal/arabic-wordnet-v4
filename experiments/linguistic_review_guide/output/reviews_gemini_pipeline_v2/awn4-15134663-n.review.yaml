        - command: create_entry
          params: {lemma: "عُصَارَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15134663-n"}

stage4_content:
  definition:
    current: "أي مادة تمتلك بدرجة عالية الخصائص الغالبة لنبات أو دواء أو منتج طبيعي آخر يتم استخراجها منه"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي طويل، ويفضل صياغته بأسلوب معجمي أكثر تركيزاً."
    authored:
      - type: terminological
        text: "مادة مُرَكَّزة تُسْتَخْرَج من نسيج نباتي أو حيواني أو دواء، وتحتفظ بخصائصه الجوهرية وفعاليته."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "خُلَاصَة"
        examples:
          - text: "تُسْتخدم خُلَاصَة الفانيليا الطبيعية في صناعة الأغذية."
            type: usage
      - lemma: "جَوْهَر"
        examples:
          - text: "قام الباحث بعزل الجَوْهَر الفعّال من أوراق الشجر."
            type: usage
      - lemma: "مُسْتَخْلَص"
        examples:
          - text: "يحتوي هذا الدواء على مُسْتَخْلَص مائي من جذور الجينسنغ."
            type: usage
      - lemma: "رُوح"
        examples:
          - text: "يُستخدم رُوح النعناع لتهدئة آلام المعدة."
            type: usage
      - lemma: "عُصَارَة"
        examples:
          - text: "تُعدُّ عُصَارَة الصبّار مفيدة لترطيب الجلد."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-15134663-n", definition_index: 0, text: "مادة مُرَكَّزة تُسْتَخْرَج من نسيج نباتي أو حيواني أو دواء، وتحتفظ بخصائصه الجوهرية وفعاليته."}

