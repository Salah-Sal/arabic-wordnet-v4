          params: {lemma: "مُسْتَخْلَص", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15134663-n"}
    - lemma: "رُوح"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم بكثرة في تقطير النباتات العطرية والمواد الطبية (مثل روح الخل، روح النعناع)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رُوح", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15134663-n"}
    - lemma: "عُصَارَة"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الجوهر المستخرج عن طريق الضغط أو العصر، وهو نوع محدد من الاستخلاص."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
