stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جداً ('شخص يمرح أو يلهو') ولا يقدم فصلاً نوعياً يميز الحالة المعجمية."
    observations: "المجموعة تعبر عن مفهوم الشخص الكثير اللعب والمرح (romper/frolicker). اللمات الموجودة 'لَاهٍ' و'مَارِح' صحيحة لغوياً وتعبر عن اسم الفاعل المباشر. يمكن إثراء المجموعة بصفات مشبهة وصيغ مبالغة تدل على ثبوت صفة المرح واللعب."
  blind_candidates:
    - lemma: "مَرِح"
      generation_method: ishtiqaq
      justification: "مشتقة على وزن (فَعِل) كصفة مشبهة تدل على من يتصف بالمرح كطبع أصيل."
    - lemma: "لَعُوب"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن (فَعُول) وتدل على كثرة اللعب والمزاح."
    - lemma: "طَرُوب"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة تدل على من يسهل اهتزازه وفرحه وتأثره، وتناسب معنى الابتهاج."
    - lemma: "عَابِث"
      generation_method: majaz
      justification: "استخدام مجازي لمن يكثر اللعب وتجاوز الجدية، رغم احتمال وجود دلالة سلبية."

stage2_evidence:
  per_lemma:
    - lemma: "لَاهٍ"
      evidence_status: "no_material_found"
    - lemma: "مَارِح"
      confirm:
        - text: "«مَارِح: من (م ر ح) من اشتد فرحه ونشاطه، والمختال، والسحاب الذي يرسل المطر.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مَرِح"
      confirm:
        - text: "«شِدَّةُ الفرح أو النَّشاط العُجْب والاختيال»"
          source: "المعجم الوسيط"
    - lemma: "لَعُوب"
      confirm:
        - text: "«امرأة لَعُوبٌ: حسنة الدَّلِّ الكثيرة اللَّعِب»"
          source: "المعجم الوسيط"
    - lemma: "طَرُوب"
      contradicts:
        - text: "«السريع الهزَّة والتأثر بما يُطرِب»"
          source: "المعجم الوسيط"
          conflict: "تدل على التأثر العاطفي والموسيقي أكثر من اللعب الحركي والمرح الجسدي المستهدف في المجموعة."
    - lemma: "عَابِث"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "لَاهٍ"
      decision: confirmed
      decision_reason: "اسم فاعل صحيح من الفعل (لَهَا)، ويدل بدقة على من يمارس اللهو واللعب، وهو مناسب للمفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions: []
    
    - lemma: "مَارِح"
      decision: confirmed
      decision_reason: "اسم فاعل من (مَرِحَ)، يصف الشخص أثناء ممارسته الفرح والنشاط البدني بصورة مباشرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions: []

    - lemma: "مَرِح"
      source: stage1
      decision: confirmed
      decision_reason: "صفة مشبهة فصيحة وشائعة جداً لوصف الشخص الذي يغلب عليه الفرح والمرح كطبع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَرِح", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "لَعُوب"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة مبالغة صحيحة فصيحة ومناسبة جداً لوصف الشخص (خاصة الأطفال والنساء) الكثير اللعب والمرح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "لَعُوب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "طَرُوب"
      source: stage1
      decision: removed
      decision_reason: "ارتباطها بالطرب والانفعال الوجداني يجعلها أبعد عن مفهوم اللعب والمرح الحركي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "عَابِث"
      source: stage1
      decision: removed
      decision_reason: "تحمل دلالة سلبية تفيد عدم المبالاة أو الإفساد، ولا تلائم المعنى الصافي للمرح واللعب البريء."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "شخص يمرح أو يلهو"
    assessment:
      decision: revise
      reason: "التعريف الحالي هو ترجمة حرفية ومجرد تكرار لأفعال، الأفضل تقديم تعريف مصطلحي يعكس الجانب الحركي وثبوت الصفة."
    authored:
      - type: terminological
        text: "شخص يغلب عليه اللعب والمرح وتكثر حركته ونشاطه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شخص يغلب عليه اللعب والمرح وتكثر حركته ونشاطه."}

  examples:
    per_lemma:
      - lemma: "لَاهٍ"
        examples:
          - text: "كان الطفل لاهياً بألعابه طوال اليوم في ساحة الدار."
            type: usage
      - lemma: "مَارِح"
        examples:
          - text: "ركض الطفل المارح في الحديقة مسروراً متجاهلاً من حوله."
            type: usage
      - lemma: "مَرِح"
        examples:
          - text: "يُعرف صديقي بأنه شخص مَرِح ينشر البهجة أينما حل."
            type: usage
      - lemma: "لَعُوب"
        examples:
          - text: "تلك الطفلة اللعوب لا تتوقف عن الحركة والابتسام."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "كان الطفل لاهياً بألعابه طوال اليوم في ساحة الدار."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "ركض الطفل المارح في الحديقة مسروراً متجاهلاً من حوله."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعرف صديقي بأنه شخص مَرِح ينشر البهجة أينما حل."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تلك الطفلة اللعوب لا تتوقف عن الحركة والابتسام."}

stage5_enrichment:
  per_entry:
    - lemma: "لَاهٍ"
      entry_id: "{auto}"
      root: "لهو"
      maqayis_quote: "«اللَّامُ وَالْهَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى شُغْلٍ عَنْ شَيْءٍ بِشَيْءٍ...»"
    - lemma: "مَارِح"
      entry_id: "{auto}"
      root: "مرح"
      maqayis_quote: "«الْمِيمُ وَالرَّاءُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى مَسَرَّةٍ لَا يَكَادُ يَسْتَقِرُّ مَعَهَا طَرَبًا.»"
    - lemma: "مَرِح"
      entry_id: "{auto}"
