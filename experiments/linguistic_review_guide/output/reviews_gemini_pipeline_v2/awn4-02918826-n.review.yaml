          - text: "صُمِّمَ الأُنْبُوبُ الزُّجَاجِيُّ بِحَيْثُ يَنْتَهِي بِاِنْتِفَاخٍ كُرَوِيٍّ صَغِيرٍ."
            type: usage
      - lemma: "بُصَيْلَة"
        examples:
          - text: "تَحْتَوِي بُصَيْلَةُ مِقْيَاسِ الحَرَارَةِ الطِّبِّيِّ عَلَى مَادَّةِ الزِّئْبَقِ."
            type: usage
      - lemma: "بَصَلَة"
        examples:
          - text: "يُسْحَبُ السَّائِلُ عَنْ طَرِيقِ الضَّغْطِ عَلَى بَصَلَةِ المِصَاصَةِ المَطَّاطِيَّةِ."
