stage1_review:
  assessment:
    concerns:
      - التعريف الحالي "عملية تنموية" واسع جداً وقد لا يعكس خصوصية المعنى المرتبط بكلمتي (unfolding) و(flowering).
      - المصطلح "ازدهار" غالباً ما يرتبط بالنتيجة النهائية الإيجابية (الرخاء)، بينما "unfolding" يركز على العملية التدريجية نفسها.
    observations: "المجموعة تعبر عن العملية التطورية التي ينكشف فيها الشيء تدريجياً، وهو ما يعبر عنه في العربية بالاستعارة المأخوذة من تفتح الزهور (flowering) أو بسط الشيء (unfolding)."
  blind_candidates:
    - lemma: "تَفَتُّح"
      generation_method: ishtiqaq
      justification: "استعارة لغوية من تفتح الزهور للدلالة على انكشاف مراحل النمو وتطوره تدريجياً، وهو ما يطابق تماماً (flowering)."
    - lemma: "تَكَشُّف"
      generation_method: majaz
      justification: "يعبر عن ظهور المراحل المتتابعة لعملية ما كانت خفية أو في طور التكوين، ويطابق دلالة (unfolding)."
    - lemma: "تَكَوُّن"
      generation_method: ishtiqaq
      justification: "يشير إلى عملية الحدوث والنشأة التدريجية لشيء ما (process of becoming)."
    - lemma: "تَبَلْوُر"
      generation_method: majaz
      justification: "يدل على اتخاذ الشيء شكلاً واضحاً ومحدداً تدريجياً خلال عملية النمو."

stage2_evidence:
  per_lemma:
    - lemma: "تفتح"
      confirm:
        - text: "«(تفتح) مُطَاوع فتح والأكمام عَن النُّور... وَفِي الْكَلَام توسع فِيهِ وتطاول بالفخر»"
          source: "المعجم الوسيط"
      expands:
        - text: "«كتفتح بعض الثمار وأكياس البوغ وغيرها»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
          addition: "استعمال المصطلح في سياق علمي لوصف عمليات حيوية تنموية."
    - lemma: "ازدهار"
      confirm:
        - text: "«من (ز ه ر) الإشراق والتقدم.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«تستخدم المعاجم الموحدة (الاقتصاد والتجارة) المصطلح للدلالة على فترات التقدم والنماء.»"
          source: "المعاجم الموحدة (arabterm)"
    - lemma: "تكشف"
      confirm:
        - text: "«(تكشف) الشَّيْء انْكَشَفَ»"
          source: "المعجم الوسيط"
        - text: "«تستخدم الكلمة للتعبير عن انكشاف مراحل عملية أو واقعة ما.»"
          source: "تحليل سياقي"
    - lemma: "تكون"
      confirm:
        - text: "«(تكون) الشَّيْء حدث يُقَال كَونه فَتكون»"
          source: "المعجم الوسيط"
        - text: "«(تكون) الشىءُ: حدث. يقال: كَوَّنه فتكوَّن»"
          source: "المعجم الوسيط (OCR)"

stage3_analysis:
  per_lemma:
    - lemma: "تفتح"
      decision: confirmed
      decision_reason: "مطابقة تامة للمفهوم الإنجليزي (flowering) ولتعريف المجموعة، وتشكيله ضروري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَتُّح"
    - lemma: "ازدهار"
      decision: confirmed
      decision_reason: "يعبر عن الازدهار العلمي والثقافي كعملية نمو وتقدم مطابقة للمفهوم المجازي لـ (flowering)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِزْدِهَار"
    - lemma: "تَكَشُّف"
      source: stage1
      decision: confirmed
      decision_reason: "إضافة ضرورية للتعبير عن مفهوم (unfolding) الذي يركز على جلاء المراحل ووضوحها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَكَشُّف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَكَوُّن"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر بدقة عن 'العملية التنموية' من حيث كونها عملية حدوث ونشوء (becoming)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَكَوُّن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عملية تنموية"
    assessment:
      decision: revise
      reason: "التعريف الحالي عام جداً؛ المصطلح يركز على التدرج والانكشاف."
    authored:
      - type: terminological
        text: "عملية تطور أو انكشاف تدريجي لمراحل شيء ما نحو مرحلة أكثر اكتمالاً أو وضوحاً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية تطور أو انكشاف تدريجي لمراحل شيء ما نحو مرحلة أكثر اكتمالاً أو وضوحاً."}
  examples:
    per_lemma:
      - lemma: "تَفَتُّح"
        examples:
          - text: "نراقب تَفَتُّح مواهب الطفل الفنية يوماً بعد يوم."
            type: usage
      - lemma: "اِزْدِهَار"
        examples:
          - text: "شهد العصر العباسي اِزْدِهَاراً منقطع النظير في العلوم والترجمة."
            type: usage
      - lemma: "تَكَشُّف"
        examples:
          - text: "أدى تَكَشُّف خيوط المؤامرة تدريجياً إلى إفشالها قبل وقوعها."
            type: usage
      - lemma: "تَكَوُّن"
        examples:
          - text: "تدرس الجيولوجيا عملية تَكَوُّن سلاسل الجبال عبر ملايين السنين."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "كان تفتح أفكاره السياسية عملية تدريجية بدأت منذ أيام دراسته الجامعية."}

