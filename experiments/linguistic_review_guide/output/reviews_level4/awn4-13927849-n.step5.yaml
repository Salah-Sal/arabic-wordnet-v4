    figurative_analysis: "الكلمات في هذه المجموعة تميل للمعنى المادي (Literal) غالباً، مع وجود استخدامات مجازية راسخة مثل 'شق عصا' و'حز النفوس'."
    cultural_fit_reasoning: "المصطلحات أصيلة في اللغة العربية وتغطي طيفاً واسعاً من الآثار المادية (من الخفيف كالخدش والوخز إلى العميق كالشق والحز)."

  actions:
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "وخزة"
        note: "اللمة أقل حضوراً في الشواهد التراثية مقارنة بـ 'شق' و'حز'، لكنها ضرورية لاستكمال طيف المعنى (العمق والسطحية)."