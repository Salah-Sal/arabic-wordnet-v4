step3_definition:
  definition_review_flag: true
  current_definition: "انخفاض مخدوش أو محفور في سطح"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي يحتوي على كلمة 'مخدوش' المشتقة من اللمّة 'خدش'، وهو تعريف دوري. كما أن التعريف ضيّق لا يشمل طبيعة 'الوخزة' كأثر نقطي."
  
  authored_definitions:
    - type: "terminological"
      text: "أثر غائر طولي أو نقطي على سطح مادة ما، يحدثه تأثير أداة حادة أو صلبة."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

    - type: "linguistic"
      text: "علامة أو أثر غائر يظهر على سطح الجسم بفعل أداة حادة."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

  reasoning:
    revision_justification: "التعريف الحالي يقع في الدور اللفظي باستخدام 'مخدوش' لتعريف 'خدش'. التعريف الجديد يحدد الجنس ('أثر غائر') والفصل ('بفعل أداة حادة') بشكل محايد وشامل."
    dictionary_comparison: "المعاجم العربية تصف هذه الحالات بـ 'الأثر' أو 'الغؤور' الناتج عن فعل القطع أو الضغط، وهو ما تم تبنيه في التعريف المقترح."
    terminological_strategy: "استخدام 'أثر غائر' كجنس قريب، وتحديد السبب والأدوات كفصل نوعي لتمييزه عن الانخفاضات العرضية."
    linguistic_strategy: "تبسيط التعريف المصطلحي ليكون مفهوماً لغوياً عاماً يغطي كافة اللمات في المجموعة."

  actions:
    - command: "عدّل نص التعريف"
      params:
        definition_index: 0
        new_text: "أثر غائر طولي أو نقطي على سطح مادة ما، يحدثه تأثير أداة حادة أو صلبة."

    - command: "ألّف تعريفاً جديداً"
      params:
        type: "terminological"
        text: "أثر غائر طولي أو نقطي على سطح مادة ما، يحدثه تأثير أداة حادة أو صلبة."

    - command: "ألّف تعريفاً جديداً"
      params:
        type: "linguistic"
        text: "علامة أو أثر غائر يظهر على سطح الجسم بفعل أداة حادة."