step1_lemma_validation:
  per_lemma:
    - lemma: "عمق"
      decision: "confirmed"
      decision_reason: "الأدلة توسّع المعنى — اللمّة نجحت في اختبار الإبدال"
      evidence_assessment:
        case: "expands"
        notes:
          - "الأدلة المعجمية توسّع المعنى — تكشف بُعداً دلالياً مادياً ومعرفياً"
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "هذه الحكمة تتسم بالعمق والغموض"
            substituted: "هذه الحكمة تتسم بالعمق والغموض"
            preserved_meaning: true
      reasoning:
        evidence_weight: "أدلة توسيع من عدة معاجم — لا تناقض مع التعريف"
        nuance_differentiation: "يتميّز عن أخواته بدلالة الشمول — يشمل العمق المادي والمعرفي والمعنوي"
        split_justification: "الأدلة تكشف معنى مادياً (قعر البئر) قد يستقل بمفرده"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "عمق"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "عمق"
            note: "الأدلة المعجمية توسّع المعنى — تحقق من نطاق التعريف"

    - lemma: "عوص"
      decision: "removed"
      decision_reason: "لا سند معجمي ولا ارتباط دلالي بتعريف المجموعة — فشلت في اختبار الإبدال"
      evidence_assessment:
        case: "no_material"
        notes:
          - "لا سند معجمي ولا ارتباط دلالي بتعريف المجموعة"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "هذه الحكمة تتسم بالعمق والغموض"
            substituted: "هذه الحكمة تتسم بالعوص والغموض"
            preserved_meaning: false
            why_failed: "«عوص» تعني الخبث أو الضعف أو الجلفة — لا علاقة لها بالحكمة أو العمق"
      reasoning:
        evidence_weight: "لا سند معجمي — اللمّة لا تحمل المعنى المطلوب"
        removal_justification: "لا سند معجمي ولا ارتباط دلالي بتعريف المجموعة — فشلت في اختبار الإبدال"
      actions:
        - command: "احذف ارتباط اللمّة بالمجموعة"
          params:
            lemma: "عوص"
            reason: "لا سند معجمي ولا ارتباط دلالي بتعريف المجموعة"

  synset_flags: {}

  added_lemmas:
    - lemma: "حكمة باطنية"
      reason: "مصطلح ثابت في التراث يشير إلى الحكمة العميقة الخفية — يتوافق مع التعريف"
      via_command: "أضف لمّة جديدة إلى المجموعة"