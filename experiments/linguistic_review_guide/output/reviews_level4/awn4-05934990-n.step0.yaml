        - «عَمَّقَ النَّظَرَ فِي الأُمُورِ تَعْمِيقاً وتَعَمَّق في كلامه أَي تَنَطَّعَ.» — لسان العرب لابن منظور
        - «عَمَّقَ النَّظَرَ فِي الأمورِ: بالَغَ.» — تاج العروس لمرتضى الزبيدي
        - «تعمق في الأمر: تنوق فيه، فهو متعمق.» — لسان العرب لابن منظور
        - «تعمّق فِى الأَمْرِ He was, or became, nice, exquisite, refined, or scrupulously nice and exact; or he chose what was excellent, or best to be done; and exceeded the usual bounds; in the affair.» — المعجم العربي الإنجليزي لإدوارد وليام لين
    عوص:
      confirm:
