    عمق:
      evidence:
      - text: "«العُمقُ والعَمْقُ: قعر البئر والفجِّ والوادي. وتَعْميق البئر وإعْماقها: جعلها عَمِيقةً. وقد عَمُقَ الرَكِيُّ عَماقَةً. وعَمَّقَ النظرَ في الأمور تَعْميقاً. وتَعَمَّقَ في كلامه، أي تنطَّعَ.» — تاج اللغة وصِحاح العربية للجوهري"
        type: expands
      - text: "«الْعُمْقُ إِذَا كَانَ صِفَةً لِلطَّرِيقِ فَهُوَ الْبُعْدُ، وَإِذَا كَانَ صِفَةً لِلْبِئْرِ فَهُوَ طُولُ جِرَابِهَا. وَمِنَ الْبَابِ: تَعَمَّقَ الرَّجُلُ فِي كَلَامِهِ، إِذَا تَنَطَّعَ.» — مقاييس اللغة لابن فارس"
        type: expands
      - text: "«العُمق والعّمْق: البُعْد إِلَى أَسْفَل. بِئْر عميقة: بعيدَة القعر. وَقد عَمُقَتْ وأعْمَقْتُها. وفَجٌّ عميق: بعيد. وَكَذَلِكَ الطَّرِيق. وأعماق الأَرْض: نَوَاحِيهَا. وَرجل عُمْقِىُّ الْكَلَام: لكَلَامه غور.» — المحكم والمحيط الأعظم لابن سيده الأندلسي"
        type: expands
      - text: "«جاءوا من كل بلد سحيق، وفج عميق؛ وهو المضرب البعيد. وتعمّق في الكلام: تنطّع.» — أساس البلاغة للزمخشري"
        type: expands
      - text: "«المُتَعَمِّق: المُبَالِغ فِي الأمْر المُتَشَدِّد فِيهِ، الَّذِي يَطْلُبُ أقْصَى غايَتِه.» — النهاية في غريب الحديث والأثر لأبي السعادات ابن الأثير الجزري"
        type: expands
      - text: "«العمق: البعد عن الشيء، وعكسه القرب. وتعمق في الأمر: تدبره وتأمله.» — مختار الصحاح للرازي"
        type: expands
      - text: "«العمق: البعد عن الشيء، وعكسه القرب. وتعمق في الأمر: تدبره وتأمله. والعُمْق: قعر البئر.» — لسان العرب لابن منظور"
        type: expands
