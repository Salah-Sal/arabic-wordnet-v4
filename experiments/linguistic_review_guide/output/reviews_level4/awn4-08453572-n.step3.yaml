step3_definition:
  definition_review_flag: true
  current_definition: "الناس الذين يؤدون نوعاً معيناً من العمل الماهر"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي يركز فقط على الجانب الفردي (أهل الحرفة) ويتجاهل الجانب المؤسسي (نقابة) الذي يمثل جوهر المفهوم، كما أنه عام جداً."
  authored_definitions:
    - type: "terminological"
      text: "جماعة من المشتغلين بمهنة أو حرفة واحدة، أو الهيئة التنظيمية التي تمثلهم وترعى مصالحهم."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
  reasoning:
    revision_justification: "التعريف الحالي يقتصر على وصف الأفراد، بينما 'نقابة' تعني أيضاً التنظيم المؤسسي لهم، لذا وجب الجمع بين المفهومين."
    dictionary_comparison: "المعاجم العربية تعرف النقابة بكونها هيئة أو جماعة منظمة لأهل الحرفة، وليس مجرد تجمع للأفراد."
    terminological_strategy: "الجنس القريب: (جماعة/هيئة)، الفصل النوعي: (المشتغلون بمهنة أو حرفة + التنظيم المؤسسي)."
  actions:
    - command: "عدّل نص التعريف"
      params:
        definition_index: 0
        new_text: "جماعة من المشتغلين بمهنة أو حرفة واحدة، أو الهيئة التنظيمية التي تمثلهم وترعى مصالحهم."
    - command: "ألّف تعريفاً جديداً"
      params:
        type: "terminological"
        text: "جماعة من المشتغلين بمهنة أو حرفة واحدة، أو الهيئة التنظيمية التي تمثلهم وترعى مصالحهم."