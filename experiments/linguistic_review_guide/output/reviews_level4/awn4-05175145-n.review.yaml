step3_definition:
  definition_review_flag: true
  current_definition: صفة تتميز بالشك المعتاد والميل لإنكار أو معارضة أو مقاومة الاقتراحات أو الأوامر
  assessment:
    decision: revise
    reason: التعريف الحالي يميل للترجمة الحرفية من الإنجليزية. يحتاج إلى صياغة معجمية عربية تركز على الجنس القريب (سِمَة/نزوع) والفصل النوعي (الممانعة والتشكيك).
  authored_definitions:
  - type: terminological
    text: سِمَةٌ نفسيةٌ تَتَمَثَّلُ في المَيْلِ المُسْتَمِرِّ لِلتَّشْكيكِ، وَرَفْضِ المُبادَراتِ، وَمُقاوَمَةِ الاِقْتراحاتِ.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  - type: linguistic
    text: نزوعٌ نحو التشاؤم والممانعة الدائمة في التعامل مع المواقف أو الاقتراحات.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  reasoning:
    revision_justification: التعريف الحالي يحتاج إلى صياغة أكثر دقة لغوياً ليتخلص من البناء التركيبي الأجنبي (characterized by).
    dictionary_comparison: التعريف الجديد يربط السلبية بالنزوع النفسي والممانعة، وهو ما يتوافق مع الاستخدام العربي الفصيح للكلمة كمرادف للموقف غير البنّاء.
    terminological_strategy: الجنس القريب = 'سِمَة نفسية' + الفصل المميّز = 'الميل المستمر للتشكيك ورفض المبادرات'.
    linguistic_strategy: تبسيط المعنى في صيغة 'نزوع نحو...' لبيان الطبيعة السلوكية للكلمة.
  actions:
  - &id003
    command: عدّل نص التعريف
    params:
      new_text: سِمَةٌ نفسيةٌ تَتَمَثَّلُ في المَيْلِ المُسْتَمِرِّ لِلتَّشْكيكِ، وَرَفْضِ المُبادَراتِ، وَمُقاوَمَةِ الاِقْتراحاتِ.
