      evidence_weight: أدلة قوية من المعاجم (الوسيط، المحيط) تؤكد معنى القطع أو الحفر في العظم أو العود.
      nuance_differentiation: يتميّز عن 'خدش' بكونه أعمق وأكثر تعمداً (قطع)، وعن 'شق' بكونه غالباً ما يكون عرضياً أو على سطح صلب.
