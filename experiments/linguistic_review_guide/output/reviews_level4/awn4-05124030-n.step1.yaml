step1_lemma_validation:
  per_lemma:
    - lemma: "كثرة هائلة"
      decision: "confirmed"
      decision_reason: "تعبير مركب اصطلاحي يطابق تعريف المجموعة"
      evidence_assessment:
        case: "no_material"
        notes:
          - "لا سند معجمي مباشر كتركيب، لكن المكونات تطابق المفهوم دلالياً"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "واجه العلماء كثرة هائلة من البيانات"
            substituted: "واجه العلماء وفرة مذهلة من البيانات"
            preserved_meaning: true
      reasoning:
        evidence_weight: "مقبولة بناءً على التحليل التركيبي والمطابقة الدلالية للتعريف"
        mwe_justification: "تركيب مستقر في اللغة المعاصرة للتعبير عن الوفرة المذهلة"
        nuance_differentiation: "تؤكد على الكم الضخم الذي يثير الذهول"
      actions:
        - command: "اقبل التعبير المركب"
          params:
            lemma: "كثرة هائلة"
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "كثرة هائلة"

    - lemma: "متاهة"
      decision: "confirmed"
      decision_reason: "استخدام استعاري مدعوم بأدلة التوسيع"
      evidence_assessment:
        case: "expands"
        notes:
          - "الأدلة المعجمية تشير إلى السعة والتيه، وتوسيعها يشمل الكثرة المحيرة"
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "ضاع في متاهة من التفاصيل"
            substituted: "ضاع في كثرة هائلة من التفاصيل"
            preserved_meaning: true
      reasoning:
        evidence_weight: "أدلة قوية على المعنى الحسي (التيه) مع وجود شواهد استعارية للسعة والضياع"
        nuance_differentiation: "تضيف بُعد الحيرة والارتباك الناتج عن الكثرة والتعقيد"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "متاهة"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "متاهة"
            note: "تُستخدم هنا بالمعنى الاستعاري للدلالة على الكثرة المربكة"

  synset_flags:
    definition_review_needed: true