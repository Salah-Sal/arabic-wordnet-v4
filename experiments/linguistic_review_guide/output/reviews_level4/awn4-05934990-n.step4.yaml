step4_relations:
  hypernymy:
    current_hypernym: "حكمة"
    test_result: "wrong"
    suggested_hypernym: "صعوبة"
    
  antonymy:
    per_lemma:
      - lemma: "عمق"
        antonym_found: true
        antonym: "سطحية"
      - lemma: "عوص"
        antonym_found: true
        antonym: "سهولة"

  verb_checks:
    applicable: false

  selectional_restrictions:
    - lemma: "عمق"
      constraint: "سمة لمفهوم مجرد أو معرفي"
    - lemma: "عوص"
      constraint: "سمة لمفهوم مجرد أو معرفي"

  reasoning:
    hypernymy_justification: "المجموعة تصف 'صعوبة الفهم' أو 'الغموض' (abstruseness)، وليس 'الحكمة' ذاتها. الحكمة هي المعرفة، بينما 'العمق/العوص' هما صفتان للكيفية أو الصعوبة."
    antonymy_justification: "العمق (بمعنى التعقيد) يضاده السطحية، والعوص (بمعنى الصعوبة) يضاده السهولة."
    selectional_reasoning: "هذه الكلمات تصف سمات مجردة مرتبطة بالاستيعاب والتعقيد، وليست أشياء مادية."

  actions:
    - command: "اقترح تغيير الأعم المباشر"
      params:
        current: "حكمة"
        suggested: "صعوبة/غموض"
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "عمق"
        note: "يجب التمييز بين العمق بمعنى 'البُعد' (depth) والعمق بمعنى 'الغموض' (profoundness/abstruseness)."
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "عوص"
        note: "كلمة 'عوص' نادرة الاستخدام وتستخدم غالباً لوصف المسائل المعقدة."