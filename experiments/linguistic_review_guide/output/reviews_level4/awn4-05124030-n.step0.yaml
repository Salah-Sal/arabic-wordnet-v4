
step0_evidence:
  per_lemma:
    متاهة:
      confirm:
        - "«(المتاهة) من الأَرْض التيه» — المعجم الوسيط"
        - "«تاهَ في الأرض، أي ذهب متحيّراً» — تاج اللغة وصِحاح العربية"
        - "«التِّيهُ وَالتَّيْهَاءُ: الْمَفَازَةُ يَتِيهُ فِيهَا الْإِنْسَانُ» — مقاييس اللغة"
      expands:
        - "«شبه أَجْوَاف الْإِبِل فِي سعتها بالتِّيهِ، وَهُوَ الْوَاسِع من الأَرْض» — المحكم والمحيط الأعظم"
        - "«تيمة أساسية في الأدب، للتعبير عن حالة ضياع بوهيمية وهجرة عبر الأصقاع» — المعجم الموحد لمصطلحات اللسانيات"
    كثرة هائلة:
      evidence_status: "no_material_found"
      peripheral_observations:
        - "التركيب يجمع دلالة الوفرة (كثرة) مع دلالة الذهول أو الحيرة (هائلة)، وهو ما يطابق تعريف المجموعة 'وفرة مذهلة ومحيرة'."
