step4_relations:
  hypernymy:
    current_hypernym: "ثراء، غزارة، فيض، وفرة"
    test_result: "correct"

  antonymy:
    per_lemma:
      - lemma: "كثرة هائلة"
        antonym_found: true
        antonym: "ندرة شديدة"
      - lemma: "متاهة"
        antonym_found: true
        antonym: "بساطة"

  verb_checks:
    applicable: false

  selectional_restrictions:
    - lemma: "متاهة"
      constraint: "تستخدم مجازياً لوصف الكثرة التي تسبب الحيرة"

  reasoning:
    hypernymy_justification: "الكثرة الهائلة والمتاهة (بمعنى الفيض) هما نوع من الوفرة المطلقة، لذا الارتباط بـ 'وفرة' صحيح دلالياً."
    antonymy_justification: "الندرة هي النقيض المباشر للكثرة، والبساطة هي نقيض المتاهة المربكة."
    selectional_reasoning: "كلمة 'متاهة' هنا ليست مكاناً فيزيائياً بل حالة ذهنية ناتجة عن وفرة المعلومات أو الأشياء."

  actions:
    - command: "أقرّ صحة العلاقات"
    - command: "أضف علاقة دلالية"
      params:
        source_lemma: "كثرة هائلة"
        relation: "antonym"
        target: "ندرة شديدة"
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "متاهة"
        note: "تستخدم هنا بمعنى الوفرة المربكة (مجاز)"