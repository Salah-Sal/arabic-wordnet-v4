step2_missing_lemmas:
  synset_id: awn4-05124030-n
  per_candidate:
  - candidate_lemma: لجة
    status: added
    evidence:
    - source: Linguistic Analysis & Substitution Test
      reasoning: تعبر اللجة مجازاً عن الكثرة المتلاطمة والمحيّرة التي تغمر المرء، مما يطابق تماماً معنى 'bewildering profusion' وتنجح في اختبار الاستبدال (لجة من المعلومات).
    usage_example: وقع الباحث في لُجّة من المصادر المتضاربة.
  - candidate_lemma: غابة
    status: added
    evidence:
    - source: English Bridge & Metaphorical Usage
      reasoning: تستخدم 'غابة' مجازاً للتعبير عن التشابك والوفرة التي تحجب الرؤية وتسبب التيه، وهي المرادف الدقيق لكلمة 'wilderness' في سياق 'a wilderness of details'.
    usage_example: توهنا في غابة من التفاصيل الإدارية المعقدة.
  - candidate_lemma: بحر
    status: added
    evidence:
    - source: Linguistic Analysis
      reasoning: البحر في السياق المجازي العربي يدل على الكثرة والعمق الذي يسبب الحيرة والارتباك لعدم القدرة على الإحاطة به.
    usage_example: وجد نفسه أمام بحر من البيانات المذهلة.
  - candidate_lemma: تيه
    status: rejected
    evidence:
    - source: Semantic Analysis
      reasoning: التيه يصف حالة الضياع أو المكان الذي يضل فيه الإنسان، لكنه لا يحمل في دلالته المعجمية معنى 'الوفرة' أو 'الكمية' بحد ذاته.
  - candidate_lemma: غزارة
    status: rejected
    evidence:
    - source: Semantic Analysis
      reasoning: الغزارة تدل على الكثرة والفيض الكمي المحايد وتفتقر إلى عنصر 'الحيرة' أو 'التشابك' الذي تتطلبه المجموعة.
  - candidate_lemma: مقدار ضخم
    status: rejected
    evidence:
    - source: Substitution Test
      reasoning: تعبير كمي مباشر يفتقر إلى البعد الاستعاري الذي يربط الكثرة بالارتباك الذهني.
  - candidate_lemma: خضم
    status: rejected
    evidence:
    - source: Linguistic Critique
      reasoning: كلمة 'خضم' تعني الوسط أو القلب، واستخدامها للدلالة على الوفرة (خضم من...) يعتبر غير فصيح لغوياً.
