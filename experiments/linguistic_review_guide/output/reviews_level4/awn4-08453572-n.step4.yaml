    antonymy_justification: "لا يوجد تضاد مباشر لهذه الأسماء."
    frame_analysis: "لا ينطبق (أسماء)."
    selectional_reasoning: "يوجد خلط دلالي جذري بين 'أهل الحرفة' (بشر) و 'نقابة' (مؤسسة). القيود الدلالية لكل منهما مختلفة تماماً."

  synset_flags:
    split_needed: true

  actions:
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "نقابة"
        note: "يجب فصلها في مجموعة خاصة بالمنظمات المهنية"
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "أهل الحرفة"
        note: "مجموعة بشرية"
    - command: "صعّد للمراجع البشري"
      params:
        reason: "وجود خلط بين كائن بشري (أهل الحرفة) ومؤسسة (نقابة)"