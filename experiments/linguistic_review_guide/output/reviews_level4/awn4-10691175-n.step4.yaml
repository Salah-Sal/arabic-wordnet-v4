step4_relations:
  hypernymy:
    current_hypernym: "قَرِين / كُفْؤ / نَظِير / نِدّ"
    test_result: "needs_closer"
    # التبرير: "الخلف" لا يشترط أن يكون "نداً" أو "نظيراً"، بل هو "مَن يلي غيره في الترتيب".

  antonymy:
    per_lemma:
      - lemma: "خَلَف"
        antonym_found: false
      - lemma: "خَلِيفَة"
        antonym_found: false

  verb_checks:
    applicable: false

  selectional_restrictions:
    - lemma: "خَلَف"
      constraint: "فاعل عاقل"
    - lemma: "خَلِيفَة"
      constraint: "فاعل عاقل"

  reasoning:
    hypernymy_justification: "التعميم الحالي 'قرين/ند' يركز على المساواة في المكانة، بينما 'خلف/خليفة' يركز على الترتيب الزمني/الوظيفي. الاقتراح: تغيير التعميم إلى مفهوم 'من يأتي بعد' أو 'شخص'."
    selectional_reasoning: "كلا اللمّتين تدلان على شخص (عاقل) يتولى دوراً بعد شخص آخر."

  actions:
    - command: "مراجعة التعميم"
      params:
        issue: "Hypernym mismatch"
        note: "التعميم الحالي 'قرين' غير دقيق؛ يجب البحث عن أعمٍّ يتعلق بالترتيب أو التتابع."
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "خَلَف"
        note: "فاعل عاقل"
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "خَلِيفَة"
        note: "فاعل عاقل"