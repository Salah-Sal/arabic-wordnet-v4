step0_raw: "step0_evidence:\n  per_lemma:\n  - lemma: كثرة هائلة\n    confirm:\n    - «الكَثْرَةُ، ويكسرُ: نَقيضُ القِلَّةِ،كالكُثْرِ، بالضم، وهو مُعْظَمُ الشيءِ وأكثَرُهُ. كثُرَ، ككَرُمَ، فهو كَثْرٌ، كعَدْلٍ\
  \ وأميرٍ وغُرابٍ وصاحبٍ وصيْقَلٍ، وكثَّرَهُ تكثيراً، وأكْثَرَهُ.ورجُلٌ مُكْثِرٌ: ذو مالٍ.ومِكْثارٌ ومِكْثيرٌ، بكسرهما: كثيرُ الكلامِ.وأكثَرَ: أتَى بكثيرٍ،وـ النَّخْلُ: أطْلَعَ، وكثُرَ مالُهُ.والكُثَارُ،\
  \ كغُرابٍ وكِتابٍ: الجَماعاتُ.وكاثَرُوهُم فكَثَرُوهُم: غالَبُوهُم فَغَلَبوهُم.وكاثَرَهُ الماءَ،واسْتَكْثَرَهُ إِياهُ: أرادَ لِنَفْسِهِ منه كثيراً ليَشْرَبَ منه.واسْتَكْثَرَ من الشيءِ: رَغِبَ في الكثيرِ\
  \ منه.والكَوْثَرُ: الكثيرُ من كلِّ شيء، والكثيرُ المُلْتَفُّ من الغُبارِ، والإِسلامُ، والنُّبُوَّةُ،وة بالطائِفِ كانَ الحجَّاجُ مُعَلِّماً بها، والرجُلُ الخَيِّرُ المِعْطاءُ،كالكَيْثَرِ، كصَيْقَلٍ، والسَّيِّدُ،\
  \ والنَّهْرُ، ونَهْرٌ في الجَنَّةِ تَتَفَجَّرُ منه جميعُ أنْهارِها.والكَثْرُ، ويُحَرَّكُ: جُمَّارُ النخلِ أو طَلْعُها. وكأميرٍ: اسمٌ، وبالتَّصْغيرِ: صاحِبُ عَزَّةَ، وسَمَّوْا: كَثيرةَ ومُكَثِّراً، كمحدِّثٍ.وكَثْرَى،\
  \ كسَكْرَى: صَنَمٌ لجَديسٍ وطَسْمٍ، كَسَرَهُ نَهْشَلُ بنُ الرُّبَيْسِ، ولَحِقَ بالنبيِّ صلى الله عليه وسلم، فأَسْلَمَ.والكَثِيْرَاءُ: رُطُوبَةٌ تَخْرُجُ من أصْلِ شَجَرَةٍ، تكونُ بِجِبالِ بَيْروتَ ولُبْنَانَ.والكُثْرَى،\
  \ كبُشْرَى، من النَّبِيذِ: الاسْتِكْثارُ منه.» — القاموس المحيط للفيروزآبادي\n    - «الكثرة:[في الانكليزية] Multiplicity [ في الفرنسية] multiplicite بالفتح وسكون المثلثة ضدّ الوحدة.» — كشّاف اصطلاحات\
  \ الفنون والعلوم للتهانوي\n    - «(الْكَثْرَة) نَمَاء الْعدَد وَقد تسْتَعْمل فِي زِيَادَة الْفضل» — المعجم الوسيط لمجموعة من المؤلفين\n    - «نَمَاءُ الْعَدَدِ. وَقَدْ تُسْتَعْمَلُ فِي زِيَادَةِ الْفَضْلِ»\
