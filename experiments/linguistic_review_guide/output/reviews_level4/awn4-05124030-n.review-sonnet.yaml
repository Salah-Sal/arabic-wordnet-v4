step1_raw: "```yaml\nstep1_lemma_validation:\n  per_lemma:\n    - lemma: \"كثرة هائلة\"\n      decision: \"confirmed\"\n      decision_reason: \"تركيب وصفي مستقر — أدلة مؤكدة\"\n      \n      evidence_assessment:\n\
  \        case: \"confirm_only\"\n      \n      mwe_check:\n        is_mwe: true\n        accepted: true\n      \n      substitution_test:\n        result: \"pass\"\n        pass_sentences:\n         \
  \ - original: \"في السوق كثرة هائلة من البضائع\"\n            substituted: \"في السوق متاهة من البضائع\"\n            preserved_meaning: true\n      \n      reasoning:\n        evidence_weight: \"أدلة\
  \ مؤكدة من معاجم متعددة (القاموس المحيط، المعجم الوسيط، كشّاف اصطلاحات الفنون) — «الكثرة» موثقة بمعنى نقيض القلّة ونماء العدد، و«هائلة» موثقة في موسوعة السلطان قابوس\"\n        mwe_justification: \"تركيب\
  \ وصفي مستقر لغوياً (موصوف + صفة) — يُستعمل كوحدة دلالية للتعبير عن الكمية الضخمة المدهشة\"\n        nuance_differentiation: \"يتميّز عن «متاهة» بالصراحة — تركيب وصفي مباشر يُبرز الكمية والضخامة، بينما\
  \ «متاهة» استعارة تُبرز الحيرة والتعقيد\"\n      \n      actions:\n        - command: \"اقبل التعبير المركب\"\n          params:\n            lemma: \"كثرة هائلة\"\n        \n        - command: \"أكّد\
  \ صلاحية اللمّة\"\n          params:\n            lemma: \"كثرة هائلة\"\n        \n        - command: \"سجّل ملاحظة دلالية\"\n          params:\n            lemma: \"كثرة هائلة\"\n            note: \"\
  يتميّز عن «متاهة» بالصراحة — تركيب وصفي مباشر يُبرز الكمية والضخامة\"\n    \n    - lemma: \"متاهة\"\n      decision: \"confirmed\"\n      decision_reason: \"استعمال مجازي راسخ — مع تحفظ على الفجوة المعجمية\"\
  \n      \n      evidence_assessment:\n        case: \"expands\"\n        notes:\n          - \"الأدلة المعجمية تعرّف «متاهة» بـ«التيه» (المكان) — الاستعمال بمعنى «وفرة محيّرة» مجازي غير موثق صراحة\"\n\
  \      \n      substitution_test:\n        result: \"pass\"\n        pass_sentences:\n          - original: \"في السوق متاهة من البضائع\"\n            substituted: \"في السوق كثرة هائلة من البضائع\"\n\
  \            preserved_meaning: true\n      \n      reasoning:\n        evidence_weight: \"الأدلة المعجمية (المعجم الوسيط، مسرد الجغرافيا) تؤكد المعنى الحقيقي «التيه من الأرض» — لكن الاستعمال المجازي\
  \ «متاهة من X» بمعنى «كثرة محيّرة من X» شائع ومفهوم في الاستعمال المعاصر\"\n        metaphorical_extension: \"الانتقال من المعنى الحقيقي (مكان التيه) إلى المعنى المجازي (كثرة محيّرة) قائم على الاستعارة\
  \ — الكثرة الهائلة تُشبه المتاهة في إحداث الحيرة\"\n        lexical_gap_note: \"الاستعمال المجازي غير موثق صراحة في المعاجم — لكنه راسخ في الاستعمال ويجتاز اختبار الإبدال\"\n        nuance_differentiation:\
  \ \"يتميّز عن «كثرة هائلة» بالاستعارة — صورة مجازية تُبرز الحيرة والتعقيد الناتج عن الكثرة، لا مجرد الكمية\"\n      \n      actions:\n        - command: \"أكّد صلاحية اللمّة\"\n          params:\n   \
  \         lemma: \"متاهة\"\n        \n        - command: \"سجّل ملاحظة دلالية\"\n          params:\n            lemma: \"متاهة\"\n            note: \"استعمال مجازي — المعنى المعجمي الأساسي «التيه من الأرض»،\
  \ والاستعمال هنا بمعنى «كثرة محيّرة» قائم على الاستعارة\"\n        \n        - command: \"سجّل ملاحظة دلالية\"\n          params:\n            lemma: \"متاهة\"\n            note: \"يتميّز عن «كثرة هائلة»\
  \ بالاستعارة — صورة مجازية تُبرز الحيرة والتعقيد\"\n        \n        - command: \"عيّن حقل إثراء\"\n          params:\n            lemma: \"متاهة\"\n            key: \"usage_note\"\n            value:\
  \ \"استعمال مجازي — الأصل المعجمي «مكان التيه»، والمعنى المقصود هنا «كثرة محيّرة»\"\n      \n      enrichment:\n        usage_note: \"استعمال مجازي — الأصل المعجمي «مكان التيه»، والمعنى المقصود هنا «كثرة\
  \ محيّرة»\"\n  \n  synset_flags:\n    definition_review_needed: true\n```"
