step0_raw: "step0_evidence:\n  synset: awn4-05934990-n\n  per_lemma:\n    عمق:\n      confirm:\n        - «الدرجة التي تكون فيها المعرفة المشتركة بين المتحاورين شخصية جدا أو سرية للغاية.» — مسرد الإعلام\
  \ والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)\n        - «وتَعَمَّقَ في كلامه، أي تنطَّعَ.» — تاج اللغة وصِحاح العربية للجوهري\n        - «وَمِنْهُ كَلَامٌ عَوِيصٌ، وَكَلِمَةٌ عَوْصَاءُ...\
  \ وَيُقَالُ أَعْوَصَ فِي الْمَنْطِقِ وَأَعْوَصَ بِالْخَصْمِ، إِذَا كَلَّمَهُ بِمَا لَا يَفْطِنُ لَهُ.» — مقاييس اللغة لابن فارس\n        - «ورجل عُمْقِىُّ الْكَلَام: لكَلَامه غور.» — المحكم والمحيط الأعظم\
  \ لابن سيده الأندلسي\n        - «وتعمّق في الكلام: تنطّع.» — أساس البلاغة للزمخشري\n        - «المُتَعَمِّق: المُبَالِغ فِي الأمْر المُتَشَدِّد فِيهِ، الَّذِي يَطْلُبُ أقْصَى غايَتِه.» — النهاية في غريب\
  \ الحديث والأثر لأبي السعادات ابن الأثير الجزري\n        - «وَ (تَعَمَّقَ) فِي كَلَامِهِ تَنَطَّعَ.» — مختار الصحاح للرازي\n        - «وتَعَمَّق في كلامه أَي تَنَطَّعَ.» — لسان العرب لابن منظور\n    \
  \    - «وتَعَمَّقَ في كلامه: تَنَطَّعَ.» — القاموس المحيط للفيروزآبادي\n        - «وتعمّق فِى كَلَامِهِ He went deeply, or far, in in his speech; syn. تَنَطَّعَ.» — المعجم العربي الإنجليزي لإدوارد وليام\
  \ لين\n        - «تعمَّقَ في البحث: استقصاه، دقَّقه وبالغ في النَّظرِ فيه \"باحِثٌ متعمِّقٌ- أفكارٌ مُتعمِّقةٌ- تعمَّق في دراسة اللغة الفرنسيّة\".» — معجم اللغة العربية المعاصرة لأحمد مختار عمر\n    \
  \    - «عمُقت أفكارُه: بلغت أقصى الأمر وكُنْهه.» — معجم اللغة العربية المعاصرة لأحمد مختار عمر\n        - «تعمق في كلامه: تنطع وتشدق فيه» — كتاب العين\n      expands:\n        - «(3) مُعَقّد؛ عويص a deep\
  \ problem (4) خَفِيّ؛ غامض a deep mystery (6) حكيم؛ حصيف (7) ماكر؛ ذو دهاء (9) مستغرق deep in thought» — المورد الحديث (2008)\n        - «(2) عميق؛ بعيد الغَور (3) عميق: عويص؛ صعب فهمه a profound book»\
  \ — المورد الحديث (2008)\n        - «(1) عُمق التفكير (2) شيء عميق أو عويص» — المورد الحديث (2008)\n        - «عَمَّقَ النَّظَرَ فِى الأُمُورِ... He exceeded the usual bounds [in looking, or examining,\
  \ or rather he looked, or examined, deeply, into affairs, or the affairs].» — المعجم العربي الإنجليزي لإدوارد وليام لين\n        - «عَمَّقَ النَّظَرَ فِي الأمورِ: بالَغَ.» — القاموس المحيط للفيروزآبادي\n\
  \        - «عمَّق الرأيَ: دقّقه واستقصاه وبالغ فيه \"عمَّق البحثَ في الموضوع المدروس\".» — معجم اللغة العربية المعاصرة لأحمد مختار عمر\n        - «عَمَّقَ النَّظَرَ فِي الأُمُورِ تَعْمِيقاً وتَعَمَّق\
  \ في كلامه أَي تَنَطَّعَ.» — مختار الصحاح للرازي\n        - «عَمَّقَ النَّظَرَ فِي الأُمُورِ تَعْمِيقاً وتَعَمَّق في كلامه أَي تَنَطَّعَ.» — لسان العرب لابن منظور\n        - «عَمَّقَ النَّظَرَ فِي الأمورِ:\
  \ بالَغَ.» — تاج العروس لمرتضى الزبيدي\n        - «تعمق في الأمر: تنوق فيه، فهو متعمق.» — لسان العرب لابن منظور\n        - «تعمّق فِى الأَمْرِ He was, or became, nice, exquisite, refined, or scrupulously\
  \ nice and exact; or he chose what was excellent, or best to be done; and exceeded the usual bounds; in the affair.» — المعجم العربي الإنجليزي لإدوارد وليام لين\n    عوص:\n      confirm:\n        - «والعويص\
  \ من الشعر: ما يصعُب استخراج معناه.» — تاج اللغة وصِحاح العربية للجوهري\n        - «وَمِنْهُ كَلَامٌ عَوِيصٌ، وَكَلِمَةٌ عَوْصَاءُ... وَيُقَالُ أَعْوَصَ فِي الْمَنْطِقِ وَأَعْوَصَ بِالْخَصْمِ، إِذَا كَلَّمَهُ\
  \ بِمَا لَا يَفْطِنُ لَهُ.» — مقاييس اللغة لابن فارس\n        - «وقد اعْتاصَ وأعْوَص فِي الْمنطق: غمضه.» — المحكم والمحيط الأعظم لابن سيده الأندلسي\n        - «كلام عويص وأعوص، وكلمة عوصاء، وقد أعوصت\
  \ في منطقك: جئت فيه بالعويص» — أساس البلاغة للزمخشري\n        - «وَكَلَامٌ عَوِيصٌ يَعْسُرُ فَهْمُ مَعْنَاهُ» — المصباح المنير للفيّومي\n        - «الكلامُ: خفِي معناه وصعُب فهمُه. فهو عَوِيص» — معجم\
  \ اللغة العربية المعاصرة لأحمد مختار عمر\n        - «Language Difficult to be understood: obscure; or not comprehended or understood» — المعجم العربي الإنجليزي لإدوارد وليام لين\n      expands:\n    \
  \    - «وفلان يركب العَوْصاءَ، أي يركب أصعبَ الامور.» — تاج اللغة وصِحاح العربية للجوهري\n        - «والعَوْصَاءُ: الشدة... وداهية عَوصاءُ: شديدة.» — لسان العرب لابن منظور\n        - «والعَوْصَاءُ من\
  \ الدَّواهي: الشَّديدَةُ، والعَوْصَاءُ: الأَمْرُ الصَّعْبُ.» — تاج العروس لمرتضى الزبيدي\n        - «والعَوْصَاءُ: الشِّدَّةُ. والمَكانُ الصَّعْبُ من الوادي» — المحيط في اللغة للصاحب بن عباد\n       \
  \ - «عويص: صيد صعب اقتناصه.» — تكملة المعاجم العربية لرينهارت دوزي"
