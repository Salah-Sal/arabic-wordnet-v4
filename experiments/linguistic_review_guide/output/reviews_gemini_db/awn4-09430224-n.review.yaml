step0_evidence:
  per_lemma:
    - lemma: "بقايا"
      confirm:
        - text: "«(الْبَقِيَّة) مَا بَقِي من الشَّيْء... وجَمْعُ البَقِيَّة: بَقَايا» — المعجم الكبير"
          source: "المعجم الكبير"
        - text: "«بقايا: ما يتبقى من النفايات بعد الانتهاء من عمليات فرز ما هو قابل لإعادة الاستعمال... عادة ما يتم التخلص من البقايا في مدافن النفايات.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          source: "ArabTerm"
        - text: "«بقايا: remains (remnants)» — المعجم الموحد لمصطلحات علوم الزلازل (1999)"
          source: "ArabTerm"
      expands:
        - text: "«بقايا حيوانات متحجرة: remains (fossil)» — المعجم الموحد لمصطلحات علوم الزلازل (1999)"
          source: "ArabTerm"
          addition: "تخصيص البقايا للمتحجرات والأحافير"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "بَقِيَّة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(الْبَقِيَّة) مَا بَقِي من الشَّيْء» — المعجم الوسيط"
      justification: "المفرد الأصيل للمّة «بقايا» ويمثل المفهوم في حالته المفردة."
    - lemma: "مُخَلَّفَات"
      source_section: "step5_english_bridge"
      evidence_citation: "«مُخلَّفات: شيء احتفظ به وحوفظ عليه نظرا لقيمته التاريخية وللذكرى. عموما شيء احتفظ به وحوفظ عليه نظرا لقيمته التاريخية وللذكرى. قطع أثرية /متبقيات» — ArabTerm"
      justification: "يدل على الأشياء التي تُترك (تُخلف) بعد زوال أصلها أو انتهاء استعمالها، ويشمل البقايا الأثرية."
  knowledge_candidates:
    - lemma: "فَضَلَات"
      justification: "آلية التوليد: اشتقاق. من الفضل (ما زاد عن الحاجة). يدل على ما يتبقى من الشيء بعد استعمال حاجته، وغالباً ما يُترك لعدم الفائدة."
    - lemma: "رَوَاسِب"
      justification: "آلية التوليد: اشتقاق. من الرسوب. يُستخدم لوصف ما يتبقى ويترسب من المواد بعد فنائها أو تغير حالتها، خاصة في السياقات المادية والكيميائية."
  generation_notes: "التركيز في التوليد على مفهوم 'ما يُترك' و'ما يتبقى' بمستويات مختلفة (عامة، أثرية، نفايات)."

step1_lemma_validation:
  per_lemma:
    - lemma: "بقايا"
      decision: confirmed
      decision_reason: "اللمّة الأساسية للمجموعة، مدعومة بقوة في المعاجم وتطابق التعريف تماماً."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الكثرة والتعدد، وتُستخدم غالباً للأشياء المتفرقة المتبقية من شيء زائل (مثل بقايا الطعام، بقايا مدينة)."
      example: "عثر المنقبون على بقايا أثرية تعود للعصر الحجري في هذا الموقع."
    
    - lemma: "بَقِيَّة"
      source: step05
      decision: confirmed
      decision_reason: "المفرد اللغوي للبقايا، ويصلح لتمثيل الشيء الواحد المتبقي."
      step05_citation: "«(الْبَقِيَّة) مَا بَقِي من الشَّيْء» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الوحدة أو الجزء المتبقي من الكل، وقد تُستخدم معنوياً (بقية أمل) أو مادياً (بقية طعام)."
      example: "احتفظت ببقية المال في حصالتي الصغيرة."
      actions:
        - command: create_entry
          params:
            lemma: "بقية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09430224-n"

    - lemma: "مُخَلَّفَات"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مستقر يدل على ما يتبقى من عمليات الإنتاج أو ما يُترك كذكرى تاريخية."
      step05_citation: "«مُخلَّفات: نتائج غير مستهدفة من عمليات الإنتاج... شيء احتفظ به وحوفظ عليه نظرا لقيمته التاريخية» — ArabTerm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص غالباً بمخرجات العمليات الصناعية (مخلفات كيميائية) أو الأشياء المتروكة عمداً أو عرضاً للذكرى (مخلفات تاريخية)."
      example: "تعمل الدولة على إعادة تدوير المخلفات الصناعية لحماية البيئة."
      actions:
        - command: create_entry
          params:
            lemma: "مخلفات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09430224-n"

    - lemma: "فَضَلَات"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح شائع لما يتبقى من الشيء ولا يُستخدم لعدم الحاجة إليه."
      step05_citation: "«فضلات: مواد غير مرغوب فيها أو غير صالحة للاستعمال بالنسبة لصاحبها» — ArabTerm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تغلب عليها دلالة عدم النفع أو ما يُطرح بعد الاستعمال (فضلات الطعام، فضلات الجسم)."
      example: "تُجمع الفضلات في حاويات خاصة ليتم التخلص منها بعيداً عن العمران."
      actions:
        - command: create_entry
          params:
            lemma: "فضلات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09430224-n"

