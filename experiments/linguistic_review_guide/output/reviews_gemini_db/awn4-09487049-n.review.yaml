step0_evidence:
  per_lemma:
    - lemma: "عشب"
      confirm:
        - text: "«العُشب: الكلأ الرَّطب»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«نبات طري غير متخشب ساقه خضراء قليلة الاحتمال»"
          source: "المعجم الوسيط"
      expands:
        - text: "«رجل عشب وامرأة عشبة، أي: قصير في دمامة وذلّة»"
          source: "المحيط في اللغة"
          addition: "معنى إنساني وصفي بعيد عن الدلالة النباتية"
    - lemma: "مرج"
      confirm:
        - text: "«المَرْجُ: أرضٌ ذاتُ نَباتٍ كَثيرٍ تُمرَجُ فيه الدَّوابُّ»"
          source: "لسان العرب"
        - text: "«أرض واسعة ذات نبات ومرعى للدواب»"
          source: "المعجم الوسيط"
      expands:
        - text: "«المَرَجُ: الفَسادُ، والقَلَقُ، والاخْتِلاطُ، والاضْطِرابُ»"
          source: "القاموس المحيط"
          addition: "معانٍ مجردة واجتماعية تتعلق بالاختلاط والفساد"
    - lemma: "طبقة عشبية"
      confirm:
        - text: "«تضرر كبير للطبقة العشبية عند نقل تربة كانت قد وضعت فوق العشب»"
          source: "مسرد المناخ والبيئة (ArabTerm)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مَخْضَرة"
      source_section: "step5_english_bridge"
      evidence_citation: "«المَخْضَرة: الطبقة العليا من التربة المشتملةُ على العُشْب وجذوره» — المورد الحديث"
      justification: "مصطلح معجمي حديث يطابق تعريف المجموعة بدقة متناهية"
    - lemma: "خضير"
      source_section: "step5_english_bridge"
      evidence_citation: "«خضير (Turf)» — المكنز الزراعي"
      justification: "مصطلح تقني مستخدم في السياق الزراعي للدلالة على العشب المقتلع مع تربته"
  knowledge_candidates:
    - lemma: "سجاد عشبي"
      justification: "تعبير وصفي شائع في الفصحى المعاصرة للدلالة على كثافة العشب وتداخله كالسجاد (آلية التركيب)"
    - lemma: "لِبْدَةُ عُشْب"
      justification: "استعارة قائمة على الجذر (ل-ب-د) للدلالة على تداخل العشب وتراكمه (آلية المجاز)"

step1_lemma_validation:
  per_lemma:
    - lemma: "طبقة عشبية"
      decision: confirmed
      decision_reason: "تعبير وصفي مستقر في المصطلحات التقنية الحديثة"
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "التعبير الأكثر صراحة ومباشرة لوصف المفهوم في السياقات التقنية"
      example: "يجب المحافظة على الطبقة العشبية عند تسوية الأرض لضمان نمو النبات."
    - lemma: "عشب"
      decision: confirmed
      decision_reason: "استخدام عام شائع للمادة النباتية المكونة للطبقة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يطلق على النبات نفسه، ويستخدم للمجموعة من باب إطلاق اسم المادة على الهيكل"
      example: "كان العشب في الملعب كثيفاً ومتماسكاً."
    - lemma: "مرج"
      decision: confirmed
      decision_reason: "يدل على المكان الواسع ذي النبات، وهو مرتبط دلالياً وثيقاً بالمجموعة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الامتداد المكاني (الحقل) أكثر من تركيزه على بنية الطبقة السطحية نفسها"
      example: "تنتشر المروج الخضراء في أعالي الجبال."
    - lemma: "مَخْضَرة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح معجمي دقيق يطابق تعريف المجموعة تماماً"
      step05_citation: "«المَخْضَرة: الطبقة العليا من التربة المشتملةُ على العُشْب وجذوره» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح العربي المخصص بدقة لهذا المفهوم التقني (Sod)"
      example: "قام المزارعون بقلع المخضرة وتجهيزها للنقل إلى الحديقة الجديدة."
      actions:
        - command: create_entry
          params:
            lemma: "مَخْضَرة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09487049-n"
    - lemma: "خضير"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تقني زراعي مستقر"
      step05_citation: "«خضير (Turf)» — المكنز الزراعي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح زراعي متخصص للطبقة العشبية الجاهزة للزرع"
      example: "تستخدم قطع الخضير لتغطية مساحات واسعة من الحدائق بسرعة."
      actions:
        - command: create_entry
          params:
            lemma: "خضير"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09487049-n"

