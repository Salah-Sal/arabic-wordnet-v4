step0_evidence:
  per_lemma:
    - lemma: "فَاصِل"
      confirm: []
      contradicts: []
      expands:
        - text: "«يقال : حُكْمٌ فاصل , وقضاء فاصل : ماض قاطع»"
          source: "المعجم الوسيط"
        - text: "«خط يفصل بين المكونات الهيكلية والختم؛ أو قطع أو انقطاع في الهيكل للسماح بالاختلافات في الحركة أو السلوك بين أجزاء»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "المعنى الهندسي والمادي للفاصل"
      peripheral_observations:
        - "تُستخدم الكلمة بكثرة في المعاجم العلمية الحديثة بمعنى (separator) أو (joint) وليس لتمييز الخصائص."
    - lemma: "مُمَيِّز"
      confirm:
        - text: "«المميِّز: مَنْ أو ما يميِّز»"
          source: "المورد الحديث (2008)"
      contradicts: []
      expands:
        - text: "«جزء من شبكة توليدية تنافسية يفحص ما إذا كان المثال الذي أنشأه المُولِّد حقيقيًّا أم مزيفًا.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "الاستخدام التقني في الذكاء الاصطناعي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُفَاضِل"
      source_section: "step5_english_bridge"
      evidence_citation: "«مُفاضِل: دارةٌ يكون خرجُها هو تفاضل (المشتق الأول) إشارة دخلها.» — معجم مصطلحات المعلوماتية (2000)"
      justification: "وردت الكلمة كترجمة للمصطلح الإنجليزي (differentiator) في سياقات هندسية ورياضية."
  knowledge_candidates:
    - lemma: "مُفَرِّق"
      justification: "اشتقاق: اسم فاعل من الفعل (فرّق) الوارد في التعريف بمعنى (يُفرّق)، ليدل على الشخص أو الشيء الذي يفرّق بين الأشياء."
  generation_notes: "تم استبعاد (مفاضل) من التأكيد لاحقاً لأن دلالتها يغلب عليها الاستخدام الرياضي والإلكتروني ولا تناسب المعنى العام المذكور في التعريف."

step1_lemma_validation:
  per_lemma:
    - lemma: "فَاصِل"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع، ويُستخدم للتعبير عن ما يفصل ويفرّق بين الأشياء سواء مادياً أو معنوياً."
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركّز (الفاصل) على إيجاد حد أو عزل بين الأشياء لئلا تختلط، بينما يُركّز (المميز) على إدراك الفروق والاختلافات."
      example: "كان قوله هو القول الفاصل في القضية."
    - lemma: "مُمَيِّز"
      decision: confirmed
      decision_reason: "مصطلح فصيح ويطابق تماماً التعريف العربي والإنجليزية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركز على إدراك الخصائص الفارقة واستخراج الاختلافات بين الأشياء."
      example: "يُعدُّ العقل هو المميز بين الإنسان والحيوان."
    - lemma: "مُفَاضِل"
      source: step05
      decision: removed
      decision_reason: "دلالة الكلمة تكاد تنحصر في المجال الرياضي (الاشتقاق والتفاضل) أو الإلكتروني، ولا تناسب المعنى العام الوارد في التعريف."
      step05_citation: "«مُفاضِل: دارةٌ يكون خرجُها هو تفاضل (المشتق الأول) إشارة دخلها.»"
    - lemma: "مُفَرِّق"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح (اسم فاعل) ويطابق الفعل الوارد في التعريف (يفرق)."
      step05_citation: "اشتقاق من المعرفة اللغوية والفعل (يفرق)."
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركز (المُفرّق) على تفريق الأشياء المتشابهة وإبعاد بعضها عن بعض دلالياً أو حسياً."
      example: "وقف المُفرّق بين المتخاصمين ليُنهي النزاع."
      actions:
        - command: create_entry
          params:
            lemma: "مُفَرِّق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10032560-n"
  added_lemmas:
    - lemma: "مُفَرِّق"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

