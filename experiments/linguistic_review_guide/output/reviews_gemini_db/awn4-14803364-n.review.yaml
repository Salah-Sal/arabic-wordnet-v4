      justification: "تركيب وصفي شائع ومستعمل في المعاجم الحديثة (المورد) كمرادف لـ whitener."
  generation_notes: "تم التركيز على الجذر (بيض) للجوانب اللونية، والجذر (قصر) للعملية الكيميائية التقليدية."

