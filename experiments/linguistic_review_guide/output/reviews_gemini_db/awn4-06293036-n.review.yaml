step0_evidence:
  per_lemma:
    - lemma: "سريان"
      contradicts:
        - text: "«السَّرَيَانُ الآليَة (Gravity flow): نوعٌ من حركة الجليد... حيث يسرى الجليدُ بفِعْل الجَاذبيَة... ومنه سريانُ البترول أيضًا» — المعجم الكبير"
          conflict: "المعنى المعجمي محصور في الجريان والتدفق المادي للسوائل والأشياء المادية، ولا يتضمن الدلالة النفسية أو العاطفية"
        - text: "«كمية السائل المُتدفقة في وحدة زمنية مُعينة خلال مقطع مُستعرض مُعين» — المعجم الموحد لمصطلحات المياه"
          conflict: "معنى فيزيائي مادي يختلف عن الانتقال العاطفي"
    - lemma: "عدوى"
      confirm:
        - text: "«العَدْوَى: انتقال سريع لأيّما شعور، كالحماسة أو القلق، من شخصٍ إلى آخر. شعور أو تأثير منتقل بسرعة» — المورد الحديث"
        - text: "«إعداء الآخرين مجازيًا [بجعلهم يحذون حذو المرء في عواطفه أو صفاته من طريق الاحتكاك أو الاقتداء]» — المورد الحديث"
      expands:
        - text: "«انْتِقَال الدَّاء من الْمَرِيض بِهِ إِلَى الصَّحِيح بوساطة مَا» — المعجم الوسيط"
          addition: "المعنى الأصلي المادي (الطبي) الذي اشتُق منه المعنى النفسي مجازاً"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "سراية"
      source_section: "step5_english_bridge"
      evidence_citation: "«عَدْوَى؛سِرَايَة (contagion)» — المعجم الطبي الموحد"
      justification: "مصدر الفعل سرى، ويُستخدم للتعبير عن انتقال الأثر والامتداد، ويصلح بديلاً لعدوى أو مرادفاً لها في سياق انتقال المشاعر (سراية المشاعر)."
    - lemma: "إعداء"
      source_section: "step4_fts_keyword"
      evidence_citation: "«إعداء الآخرين مجازيًا [بجعلهم يحذون حذو المرء في عواطفه أو صفاته]» — المورد الحديث"
      justification: "مصدر الفعل أعدى، يدل على عملية نقل التأثير النفسي أو العاطفي للآخرين (التركيز على فعل التسبب بالانتقال)."
  knowledge_candidates:
    - lemma: "تأثر عاطفي"
      justification: "تركيب وصفي يصف النتيجة المترتبة على هذا الانتقال."
  generation_notes: "تم التركيز على المصادر التي تعبر عن عملية الانتقال ذاتها سواء من جهة الفاعل (إعداء) أو الحدث (سراية)."

step1_lemma_validation:
  per_lemma:
    - lemma: "سريان"
      decision: removed
      decision_reason: "الكلمة تدل في أصلها وتداولها المعجمي على الجريان المادي (سريان السائل) أو النفاذ القانوني (سريان المفعول). ولا تؤدي المعنى النفسي (العدوى العاطفية) إلا إذا أُضيفت (سريان الشعور/الحماس)، فهي وحدها قاصرة عن أداء معنى المجموعة الترادفية وتشكل اشتراكاً لفظياً مضللاً."
      evidence_assessment:
        case: "contradicts_only"
      substitution_test:
        result: "fail"
      nuance_differentiation: "تدل على التدفق المادي الصرف أو الامتداد المكاني والزماني، وتفتقر للدلالة النفسية المستقلة."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "عدوى"
      decision: confirmed
      decision_reason: "مصطلح دقيق ومستقر، يُستخدم مجازياً بشكل شائع وموثق معجمياً للتعبير عن انتقال المشاعر والحالات النفسية بين الأفراد بالمخالطة."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تستعير مفهوم انتقال المرض العضوي لتصف قوة وسرعة انتقال الحالة النفسية بين أفراد الجماعة."
      example: "انتشرت عدوى الحماس بين الجماهير فور إحراز الهدف المرجو."
    - lemma: "سراية"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على الامتداد وانتقال الأثر ببطء وخفاء، ويستخدم بكثرة في السياقات النفسية والأدبية (سراية الشعور)."
      step05_citation: "«عَدْوَى؛سِرَايَة (contagion)» — المعجم الطبي الموحد"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميز عن العدوى بأنها توحي بالانتقال التلقائي الخفي أو التدريجي للحالة، دون استدعاء الصورة المرضية الفجة للعدوى."
      example: "تعد سراية الضحك في المجموعات من أبرز مظاهر التفاعل الاجتماعي الإيجابي."
      actions:
        - command: create_entry
          params:
            lemma: "سراية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06293036-n"
    - lemma: "إعداء"
      source: step05
      decision: confirmed
      decision_reason: "مصدر فصيح يعبر عن عملية نقل التأثير للآخرين، وهو موثق معجمياً بهذا المعنى المجازي."
      step05_citation: "«إعداء الآخرين مجازيًا [بجعلهم يحذون حذو المرء في عواطفه أو صفاته]» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز الإعداء على الجانب الفاعل أو المتسبب في نقل الحالة (الفعل)، بينما تركز العدوى على الحالة المنتقلة ذاتها."
      example: "كان له قدرة عجيبة على إعداء من حوله بطاقته الإيجابية العالية."
      actions:
        - command: create_entry
          params:
            lemma: "إعداء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06293036-n"
  added_lemmas:
    - lemma: "سراية"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "إعداء"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

