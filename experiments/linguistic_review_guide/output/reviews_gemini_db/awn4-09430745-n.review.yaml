        - text: "«أجاز مجمع اللغة المصري استعمال كلمة «مستودَع» بمعنى «مخزن»؛ وذلك لورودها في المعاجم القديمة بمعنى المكان الذي تجعل فيه الوديعة، والمعنى الجديد يعد امتدادًا للمعنى القديم» — المعجم الوسيط"
    - lemma: "مصدر"
      confirm:
        - text: "«مَا يصدر عَنهُ الشَّيْء» — المعجم الوسيط"
        - text: "«مصدر، منبع» (source) — المعجم الموحد لمصطلحات علوم الزلازل"

