      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح ودقيق يصف طالب الخدمة المهنية الذي يراجع العيادات أو المكاتب."
      step05_citation: "«من يرجع إلى غيره الأمر مشاورا إياه» — موسوعة السلطان قابوس لأسماء العرب"
