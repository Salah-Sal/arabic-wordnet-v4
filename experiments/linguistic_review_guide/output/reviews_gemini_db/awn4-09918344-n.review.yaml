step05_lemma_generation:
  evidence_candidates:
    - lemma: "عَمِيل"
      source_section: "step5_english_bridge"
      evidence_citation: "«(العميل) من يُعَامل غَيره فِي شَأْن من الشؤون» — المعجم الوسيط لمجموعة من المؤلفين"
      justification: "اشتقاق. وردت الكلمة كترجمة للمصطلح الإنجليزي (client) في عدة معاجم، وتدل معجمياً على من يعامل المهنيين للحصول على خدماتهم."
    - lemma: "زَبُون"
      source_section: "step5_english_bridge"
      evidence_citation: "«زبون، عميل» — المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      justification: "تدل على المستفيد من الخدمة المهنية والتجارية."
  knowledge_candidates:
    - lemma: "مُرَاجِع"
      justification: "اشتقاق (اسم فاعل) من الفعل (راجع) للدلالة على من يقصد أصحاب المهن (كالطبيب أو المحامي) طلباً للخدمة أو الاستشارة."
  generation_notes: "تم التركيز على الكلمات التي تعبر عن متلقي الخدمة المهنية في مختلف السياقات (طبية، قانونية، تجارية)."

