      decision: escalated
      decision_reason: "اللمة تصغير غير قياسي لكلمة (حيوان)، فالقياس (حُيَيّ) أو (حُوَيْوِين)، ولم ترد اللمة بهذا الرسم في المعاجم المتوفرة، وتحتاج لمراجعة من مختص في الاصطلاح الأحيائي للتأكد من شيوعها رغم شذوذها الصرفي."
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تصغير لحيوان يُراد به الإشارة إلى الوحدة الحية الفردية."

    - lemma: "فرد مستعمرة"
      decision: confirmed
      decision_reason: "مركب إضافي وصفي مستقر في علم الأحياء للإشارة إلى الوحدة العضوية في المستعمرات الحيوانية."
