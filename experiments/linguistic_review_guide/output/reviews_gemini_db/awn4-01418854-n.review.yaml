step3_definition:
  definition_review_flag: true
  current_definition: "أحد الأفراد المتميزين الذين يشكلون حيواناً مستعمراً مثل الحيوانات الطحلبية أو الهيدرية"
  assessment:
    decision: revise
    reason: "التعريف الحالي يحتوي على ركاكة في عبارة (حيواناً مستعمراً) التي تترجم حرفياً للعبارة الإنجليزية colonial animal، والأفضل اصطلاحاً استخدام (مستعمرة حيوانية)، كما أن تحسين الصياغة يزيد من دقة المعنى العلمي."
  authored_definitions:
    - type: terminological
      text: "كائن أو وحدة عضوية مستقلة وظيفياً تشكل جزءاً من مستعمرة حيوانية، كما في الحيوانات الطحلبية أو الهيدريات."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-01418854-n"
        definition_index: 0
        text: "كائن أو وحدة عضوية مستقلة وظيفياً تشكل جزءاً من مستعمرة حيوانية، كما في الحيوانات الطحلبية أو الهيدريات."

