      example: "يؤدي كل فرد مستعمرة في المرجان وظيفة محددة لخدمة المجموع."

    - lemma: "شِبْحَيَوان"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح منحوت (مركب مزجي) دقيق، معتمد في القواميس الحديثة لترجمة (zooid)."
      step05_citation: "«الشِّبْحَيَوان؛ شبه الحيوان: خلِيّةٌ أو جسمٌ عُضويّ قادر على الحركة المستقِلّة أو الذّاتيّة» — المورد الحديث"
