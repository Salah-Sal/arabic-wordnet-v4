step05_lemma_generation:
  evidence_candidates:
    - lemma: "شِبْحَيَوان"
      source_section: "step5_english_bridge"
      evidence_citation: "«الشِّبْحَيَوان؛ شبه الحيوان: خلِيّةٌ أو جسمٌ عُضويّ قادر على الحركة المستقِلّة أو الذّاتيّة» — المورد الحديث"
      justification: "نحت (مركب مزجي) للمصطلح الإنجليزي (zooid) المكون من سابقتي (zoo- حيوان) و (-oid شبيه)، مسجل في المورد الحديث."
    - lemma: "شَبِيه حَيَوَان"
      source_section: "step5_english_bridge"
      evidence_citation: "«شبيه الحيوان» — المعجم الطبي الموحد"
      justification: "مركب إضافي يترجم المصطلح بدقة ومسجل في المعجم الطبي الموحد كترجمة مباشرة لـ zooid."
  knowledge_candidates:
    - lemma: "حُيَيّ"
      justification: "اشتقاق (تصغير) قياسي للحيوان للدلالة على الكائن الصغير المستقل، ومسجل في المورد الحديث ضمن ترجمة مصطلح (zoon) القريب منه."
  generation_notes: "المصطلح يشير إلى الأفراد أو الوحدات العضوية التي تتكون منها المستعمرات الحيوانية كالشعاب المرجانية، والتراجم المعجمية المعتمدة تركز إما على صفة الشبه بالحيوان أو كونها فرداً ضمن المجموع."

step1_lemma_validation:
