step0_evidence:
  per_lemma:
    - lemma: "شيء"
      confirm:
        - text: "«(الشَّيْء) الْمَوْجُود وَمَا يتَصَوَّر ويخبر عَنهُ»"
          source: "المعجم الوسيط"
        - text: "«الشَّيْءُ: مَا يجوز أَن يخبر عَنهُ، وَتَصِح الدّلَالَة عَلَيْهِ»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الشَّيْءُ: الموجودُ: ما يصح أن يُعلم ويُخبر عنه؛ الأمرُ الذى يتعلقُّ به القصدُ (فى الفلسفة)»"
          source: "المعجم الكبير"
        - text: "«شيء: كيان مادي أو مفاهيمي قد يكون له سمة واحدة أو أكثر.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
      expands:
        - text: "«الشّيء: اسم لما يصحّ أن يعلم أو يحكم عليه أو به، موجودا كان أو معدوما، محالا كان أو ممكنا»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
          addition: "شمول المعدوم والمحال في الاصطلاح الكلامي/الفلسفي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "موجود"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الموجود: هو الذي يمكن أن يخبر عنه» — كتاب التعريفات للجرجاني"
      justification: "يرادف 'الشيء' في معناه الأعم بوصفه موضوعاً للإخبار والعلم."
  knowledge_candidates:
    - lemma: "ذات"
      justification: "تُستخدم في السياقات المنطقية والمعجمية للدلالة على الوحدة المستقلة (الوحدة المعجمية هي ذات معجمية)."
  generation_notes: "التعريف يركز على الكيانية المحضة بدون تخصيص اسمي؛ 'شيء' هو اللفظ الفطري والعام لهذه الدلالة."

step1_lemma_validation:
  per_lemma:
    - lemma: "شيء"
      decision: confirmed
      decision_reason: "اللفظ الأصيل والشامل للمفهوم، مدعوم بقوة في جميع المعاجم التراثية والمعاصرة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ الأكثر عمومية في اللغة العربية للدلالة على أي كيان مادي أو معنوي دون تخصيص."
      example: "ناولني هذا الشيء الموجود على الطاولة من فضلك."

    - lemma: "موجود"
      source: step05
      decision: removed
      decision_reason: "على الرغم من ترادفه مع 'شيء' في السياق الفلسفي، إلا أنه يمثل مفهوم 'Entity' (المُشتمل) بدقة أكبر، حيث يركز على صفة الوجود لا على كونه مجرد بديل اسمي (placeholder)."
      step05_citation: "«الموجود: هو الذي يمكن أن يخبر عنه» — كتاب التعريفات للجرجاني"
      substitution_test:
        result: "fail"
      nuance_differentiation: "يركز على صفة الثبوت والوجود في الخارج أو الذهن، بينما 'شيء' يُستخدم كأداة إشارة عامة لكيان غير مسمى."

    - lemma: "ذات"
      source: step05
      decision: removed
      decision_reason: "تركز على الماهية والجوهر (Essence) أكثر من كونها لفظاً عاماً للكيان غير المسمى."
      step05_citation: "«ذات الشيء نفسه وعينه» — مجمع بحار الأنوار"

