step0_evidence:
  per_lemma:
    - lemma: "قيمة"
      confirm:
        - text: "«قيمَة الشَّيْء قدره وَقِيمَة الْمَتَاع ثمنه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«القيمة: هي شرعا ما يدخل تحت تقويم مقوّم وقد سبق في لفظ الثمن.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«القِيمة: الثمنُ الذي يقاوم المتاع، أي يقوم مقامه»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«لفظ نطلقه ليدل على عملية تقويم يقوم بها الإنسان وتنتهي بإصدار حكم على شيء أو موضوع أو موقف»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "البعد المعنوي والتربوي للقيمة"
      peripheral_observations:
        - "تأتي بمعنى الأمة المستقيمة (الأمة القيمة)."
    - lemma: "قيمة اقتصادية"
      confirm:
        - text: "«قيمة إقتصادية»"
          source: "المَكنَز الزراعي متعدد اللغات"
      expands:
        - text: "«القيمة النفعية للنظم الإيكولوجية»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: "تتضمن قيم الاستخدام وقيم عدم الاستخدام"

