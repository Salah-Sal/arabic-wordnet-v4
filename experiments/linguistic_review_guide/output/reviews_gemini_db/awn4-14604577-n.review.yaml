step0_evidence:
  per_lemma:
    - lemma: "مَادَّة"
      confirm:
        - text: "«كل جسم ذي امتداد وَوزن ويشغل حيزا من الْفَرَاغ... ومادة الشَّيْء: أُصُوله وعناصره الَّتِي مِنْهَا يتكون حسية كَانَت أَو معنوية»"
          source: "المعجم الوسيط"
        - text: "«حقيقة الشّيء وذاته أو أصله ومادّتُه»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«في العلوم الطبيعية مُصطلح يشمل كافة الأجسام المرئية التي لها كُتلة»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      contradicts:
        - text: "«كل شيء يكون مدداً لغيره»"
          source: "المعجم الوسيط"
          conflict: "يشير إلى معنى الإمداد والمساعدة (مدد) وليس المادة الفيزيائية"
      expands:
        - text: "«مادة الشيء: هي التي يحصل الشيء معها بالقوة»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "البعد الفلسفي للمادة كمحل للإمكان والوجود بالقوة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جَوْهَر"
      source_section: "step5_english_bridge"
      evidence_citation: "«حقيقة الشّيء وذاته أو أصله ومادّتُه» — معجم اللغة العربية المعاصرة"
      justification: "يرد في المعاجم كمرادف للمادة في أصلها وماهيتها، ويقابل المصطلح الإنجليزي substance"
  knowledge_candidates:
    - lemma: "هَيُولَى"
      justification: "آلية التوليد: مجاز/إحياء لفظ ميت. مصطلح فلسفي تراثي دقيق يصف المادة الأولية أو المحل الذي تتشكل فيه الصور، وهو مرادف تاريخي لمفهوم المادة"
  generation_notes: "التركيز على المفاهيم التي تربط بين الكيان المادي والماهية النوعية (Constitution)"

step1_lemma_validation:
  per_lemma:
    - lemma: "مَادَّة"
      decision: confirmed
      decision_reason: "مطابقة تامة للتعريف العلمي واللغوي المستقر في المعاجم الحديثة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام والأساسي لوصف المادة الفيزيائية ذات الخصائص المحددة"
      example: "يتحول الماء من مادة سائلة إلى مادة صلبة بالتبريد الشديد."
    - lemma: "جَوْهَر"
      source: step05
      decision: confirmed
      decision_reason: "مرادف دقيق في السياقات الفلسفية واللغوية العميقة التي تصف ماهية المادة"
      step05_citation: "«حقيقة الشّيء وذاته أو أصله ومادّتُه» — معجم اللغة العربية المعاصرة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الماهية أو الأصل النوعي للمادة (Substance in its essence)"
      example: "الجواهر المادية هي الأجسام التي تشغل حيزاً من الفراغ وتتميز بالامتداد والثقل."
      actions:
        - command: create_entry
          params:
            lemma: "جَوْهَر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14604577-n"
    - lemma: "هَيُولَى"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تقني متخصص يثري الشبكة الدلالية بمفهوم المادة الأولية"
      step05_citation: "«المادة هي الهيولى وهي محل الجوهر» — دستور العلماء"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يصف المادة من حيث هي المادة الخام أو المحل الذي يقبل الصور والأشكال المختلفة"
      example: "تعد الهيولى في الفلسفة القديمة هي الأصل الذي تتكون منه الأجسام المادية."
      actions:
        - command: create_entry
          params:
            lemma: "هَيُولَى"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14604577-n"
