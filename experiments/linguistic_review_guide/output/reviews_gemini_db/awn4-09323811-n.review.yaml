step0_evidence:
  per_lemma:
    - lemma: "وابل"
      confirm:
        - text: "«الوابل: كبار المطر لأنه يشتد وقعه على الأرض، وكل ثقيل وبيل ومنه أخذا وبيلا.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«وابلٌ كالبَرَد a hail of bullets»"
          source: "المورد الحديث"
        - text: "«يُمْطِرُهُ بوابل من... hailed curses on him.»"
          source: "المورد الحديث"
      expands:
        - text: "«وكل ثقيل وبيل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعميم المعنى من المطر إلى كل ما هو ثقيل ومؤثر"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رشق"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الرِّشْقُ: الْوَجْهُ مِنَ الرَّمْيِ، إِذَا رَمَى الْقَوْمُ جَمِيعُهُمْ قَالُوا: رَمَيْنَا رِشْقًا.» — مقاييس اللغة"
      justification: "يدل على الرمي الجماعي المتتابع للسهام والمقذوفات، وهو مطابق تماماً لتعريف 'many objects thrown forcefully'."
    - lemma: "حاصب"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الحاصب: السحاب يرمي بالبرد والثلج... والريح الشديدة تحمل التراب والحصباء.» — المعجم الوسيط"
      justification: "يصف ظاهرة طبيعية (ريح أو سحاب) تقوم برمي الأشياء (حجارة أو برد) بقوة."
  knowledge_candidates:
    - lemma: "زخ"
      justification: "يُستخدم في المعاصر (زخة من الرصاص) كاستعارة من زخة المطر الشديدة، ويؤدي معنى الانهمار القوي للمقذوفات."
  generation_notes: "التركيز على المفاهيم التي تدل على الرمي الجماعي (رشق) أو الانهمار القوي (وابل، زخ)."

step1_lemma_validation:
  per_lemma:
    - lemma: "وابل"
      decision: "confirmed"
      decision_reason: "أدلة معجمية صريحة تؤكد المعنى الحرفي (للمطر) والمجازي (للمقذوفات والكلام) بما يطابق تعريف المجموعة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على التتابع الكثيف والقوة في الهطول أو الرمي، كأنه انهمار مطر غزير."
      example: "انهمر على مواقع العدو وابل من قذائف المدفعية."
    - lemma: "رشق"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مصطلح تراثي دقيق لوصف عملية الرمي الجماعي للمقذوفات في وقت واحد."
      step05_citation: "«الرِّشْقُ: الْوَجْهُ مِنَ الرَّمْيِ، إِذَا رَمَى الْقَوْمُ جَمِيعُهُمْ قَالُوا: رَمَيْنَا رِشْقًا.» — مقاييس اللغة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بالرمي العمدي للمقذوفات (سهام، حجارة) في دفعات أو جولات."
      example: "أطلق الجنود رشقاً من النبال باتجاه الحصن."
      actions:
        - command: "create_entry"
          params:
            lemma: "رشق"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09323811-n"
    - lemma: "حاصب"
      source: "step05"
      decision: "confirmed"
      decision_reason: "يدل على الريح أو السحاب الذي يرمي بالحجارة أو البرد، وهو من صميم دلالة المجموعة."
      step05_citation: "«السحاب يرمي بالبرد والثلج» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يرتبط غالباً بالعوامل الطبيعية القوية التي تحمل وتقذف الأجسام الصلبة."
      example: "أرسل الله عليهم حاصباً من السماء."
      actions:
        - command: "create_entry"
          params:
            lemma: "حاصب"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09323811-n"
    - lemma: "زخ"
      source: "step05"
      decision: "removed"
      decision_reason: "اللفظ مرتبط أساساً بالمطر والسوائل (زخة مطر)، واستعماله للمقذوفات (زخة رصاص) مجازي معاصر أقل قوة من 'وابل' في هذا السياق المعجمي."
      step05_citation: "«زخ المطر: هطل بقوة» — محيط المحيط"

