step0_evidence:
  per_lemma:
    - lemma: "مائع"
      confirm:
        - text: "«أي مادة تتدفق أو تتحرك سواء كانت في حالة شبه صلبة أو سائلة أو حمأة أو غاز»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«يشمل هذا المصطلح السوائل والغازات، أي المواد التي تأخذ شكل الوعاء الموضوعة فيه.»"
          source: "مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«مصطلح يطلق على ما هو سائل أو غاز.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«السائل، والرجل الأحمق الفاتر.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "استعمال وصفي بشري (الأحمق) لا يدخل في السياق المادي."

