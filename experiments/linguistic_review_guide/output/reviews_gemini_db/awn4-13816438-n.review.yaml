step0_evidence:
  per_lemma:
    - lemma: "انْفِصَال"
      confirm:
        - text: "«الِانْفِصَال: عدم الِاتِّصَال عَمَّا من شَأْنه الِاتِّصَال وَقيل الِانْفِصَال حُدُوث هويتين»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الانفصال: هو ضد الاتصال. والحكماء يطلقونه أيضا على كون الشيء بحيث لا يمكن أن يفرض فيه أجزاء مشتركة في الحدود»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
    - lemma: "عَدَم التَّرَابُط"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عَدَم ارْتِبَاط"
      source_section: "step4_fts_keyword"
      evidence_citation: "«عدم ارتباط [بموضوع البحث]» — المورد الحديث (2008)"
      justification: "التركيب الإضافي الوصفي (عدم + ارتباط) دقيق في الدلالة على انتفاء الصلة."
  knowledge_candidates:
    - lemma: "عَدَم اتِّصَال"
      justification: "توليد بالتركيب الإضافي (إضافة 'عدم' إلى المصدر 'اتصال'). يطابق المفهوم تماماً ويعبّر عن حالة انتفاء الصلة بين الأشياء."
    - lemma: "تَفَكُّك"
      justification: "توليد بالاشتقاق (صيغة تفعّل). يعبر عن زوال الترابط بين أجزاء كانت متصلة."

step1_lemma_validation:
  per_lemma:
    - lemma: "انْفِصَال"
      decision: confirmed
      decision_reason: "كلمة فصيحة ومعتمدة معجمياً، وتوافق التعريف الدلالي بدقة باعتباره ضد الاتصال."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على حالة افتراق أشياء عن بعضها أو غياب نقطة تماس بينها."
      example: "يُلاحظ انفصالٌ تامّ بين القول والعمل في سياساتهم."
    - lemma: "عَدَم التَّرَابُط"
      decision: confirmed
      decision_reason: "تعبير مركب (إضافي) فصيح وشائع في الاستعمال للتعبير عن انتفاء الصلة بين المكونات."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يبرز غياب الروابط والعلاقات المتبادلة التي تشد الأجزاء إلى بعضها."
      example: "انتقد الناقد عدم الترابط بين فصول الرواية."
    - lemma: "عَدَم ارْتِبَاط"
      source: step05
      decision: removed
      decision_reason: "رغم صحته، إلا أن 'عدم الترابط' المتوفر يفي بالغرض بشكل أدق، ولا داعي لتكثير المترادفات المركبة المتقاربة جداً."
      step05_citation: "«عدم ارتباط [بموضوع البحث]» — المورد الحديث"
    - lemma: "عَدَم اتِّصَال"
      source: step05
      decision: confirmed
      decision_reason: "تعبير مركب (إضافي) دقيق ومباشر ومضاد لـ 'اتصال'، ويغطي المعنى التجريدي للمفهوم بوضوح."
      step05_citation: "توليد بالتركيب الإضافي يطابق المفهوم تماماً."
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على غياب أي صلة أو تماس مباشر بين الكيانات بشكل أعم من الترابط."
      example: "أدى عدم الاتصال بالشبكة إلى توقف المعاملات."
      actions:
        - command: create_entry
          params:
            lemma: "عَدَم اتِّصَال"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13816438-n"
    - lemma: "تَفَكُّك"
      source: step05
      decision: removed
      decision_reason: "التفكك يدل على زوال بنية كانت مترابطة، وهو أخص بكثير من مجرد انتفاء الصلة المجرد."
      step05_citation: "توليد بالاشتقاق"
  added_lemmas:
    - lemma: "عَدَم اتِّصَال"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

