step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُعَيَّن"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُعَيَّن [في وظيفةٍ ما]» — المورد الحديث (2008)"
      justification: "ترجمة دقيقة لمفهوم appointee وتشير إلى الشخص الذي وقع عليه فعل التعيين في منصب."
  knowledge_candidates:
    - lemma: "مُنْتَدَب"
      justification: "استخدام آلية (الاشتقاق) من الفعل (انتدب) على وزن (مُفْتَعَل) كاسم مفعول؛ وهو مستعمل في السياقات الإدارية للشخص المكلّف بمهمة أو منصب."
    - lemma: "مُكَلَّف"
      justification: "استخدام آلية (الاشتقاق) من الفعل (كلّف) للدلالة على الشخص الذي أسندت إليه وظيفة."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُعَيَّن"
      decision: confirmed
      decision_reason: "مصطلح سليم لغوياً واشتقاقاً، ويشيع استخدامه في السياقات الإدارية والوظيفية المعاصرة للتعبير عن شخص تم تنصيبه أو إسناد مهمة إليه."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل بدقة على الشخص الذي أسندت إليه الوظيفة بقرار رسمي (التركيز على فعل التعيين)."
      example: "أصدر المدير قراراً بأن يتسلم المُعَيَّن الجديد مهام وظيفته فوراً."
    - lemma: "مُنْتَدَب"
      source: step05
      decision: removed
      decision_reason: "المنتدب غالباً يشير إلى شخص نُقل مؤقتاً لمهمة أو جهة أخرى، ولا يطابق تماماً مفهوم التعيين الأصلي في الوظيفة (appointee)."
      step05_citation: "اقتراح لغوي (معرفة سابقة)"
    - lemma: "مُكَلَّف"
      source: step05
      decision: removed
      decision_reason: "المكلف أعم وقد تشمل أي تكليف بمهمة حتى وإن لم تكن وظيفة أو منصباً رسمياً، فكلمة 'معين' أدق وأخص."
      step05_citation: "اقتراح لغوي (معرفة سابقة)"
  synset_flags:
    definition_review_needed: false

