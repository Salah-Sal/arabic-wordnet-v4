step0_evidence:
  per_lemma:
    - lemma: "مُدَّعٍ"
      confirm:
        - text: "«(1) المدَّعي (2) المتكلِّف؛ المتصنِّع»"
          source: "المورد الحديث (2008)"
        - text: "«الدَّجّال؛ المدَّعي؛ الأفّاك؛ المحتال»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(فِي الْقَضَاء) المخاصم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "مُدَّعٍ دُونَ حَقّ"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُتَبَجِّح"
      source_section: "step4_fts_keyword"
      evidence_citation: "«متفاخِر؛ متباهٍ؛ مُتَبَجِّح.» — المورد الحديث (2008)"
      justification: "اشتقاق (اسم فاعل) من الفعل 'تبجح'. ورد في القواميس الثنائية بمعنى المتفاخر والمتباهي ادعاءً."
    - lemma: "مُتَصَنِّع"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) المدَّعي (2) المتكلِّف؛ المتصنِّع.» — المورد الحديث (2008)"
      justification: "اشتقاق (اسم فاعل) من الفعل 'تصنع'. ورد كمرادف للمدعي في ترجمة (poseur)، ويفيد ادعاء صفات لا يمتلكها."
  knowledge_candidates:
    - lemma: "مُدَّعٍ بِالبَاطِل"
      justification: "تركيب وصفي يعبر عن الادعاء دون وجه حق وبطريقة زائفة."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُدَّعٍ"
      decision: confirmed
      decision_reason: "مصطلح فصيح شائع يعبر بدقة عن الشخص الذي ينسب لنفسه ما ليس له أو فيها، ويستعمل في السياق العام بهذا المعنى بخلاف معناه القانوني (المخاصم)."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تفيد مطلق ادعاء ما لا يملكه الشخص من صفات أو حقوق، وقد ترتبط بالغرور أو التكلف."
      example: "لم يكن في الحقيقة خبيراً كما زعم، بل كان مجرد مُدَّعٍ يبحث عن الشهرة."
    - lemma: "مُدَّعٍ دُونَ حَقّ"
      decision: removed
      decision_reason: "تركيب وصفي حر (شبه جملة ظرفية) وليس مصطلحاً مسكوكاً مستقراً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير وصفي يشرح المعنى."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "مُتَبَجِّح"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح يركز على عنصر التباهي والافتخار بما قد لا يملكه أو بما لا يستحق الفخر، وهو يطابق جزءاً مهماً من التعريف (يدعي بتباهٍ)."
      step05_citation: "«متفاخِر؛ متباهٍ؛ مُتَبَجِّح.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يضيف ظل المباهاة والوقاحة في الادعاء أو الافتخار والصلف."
      example: "وقف المُتَبَجِّحُ يتحدث عن إنجازاتٍ وهميةٍ أمام الحاضرين مستخفاً بعقولهم."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَبَجِّح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09829769-n"
    - lemma: "مُتَصَنِّع"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح يركز على ادعاء الصفات وتكلف ما ليس في طبع الإنسان."
      step05_citation: "«(1) المدَّعي (2) المتكلِّف؛ المتصنِّع.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على ادعاء الصفات والأخلاق والمظاهر التي لا يمتلكها الشخص (الرياء والتكلف)، بينما المدعي قد يدعي حقوقاً أو مكانة."
      example: "لا أحب التعامل مع شخص مُتَصَنِّعٍ يظهر غير ما يبطن."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَصَنِّع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09829769-n"
  added_lemmas:
    - lemma: "مُتَبَجِّح"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "مُتَصَنِّع"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

