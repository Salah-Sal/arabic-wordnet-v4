    decision: revise
    reason: "التعريف الحالي يذكر 'أربع' كميات وهو غير دقيق علمياً (النظام الدولي يعتمد سبع كميات أساسية)، ويحتاج لضبط مصطلحي."
  authored_definitions:
    - type: terminological
      text: "كمية فيزيائية لا تُشتق من غيرها من الكميات، وتُتّخذ أساساً لاشتقاق سائر المقادير في أنظمة القياس."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
