step05_lemma_generation:
  evidence_candidates:
    - lemma: "وَحْدَة أَسَاسِيَّة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الوحدة الأساسية التقنية ويقصد بها بنية أو جهاز...» — مسرد هندسة وتكنولوجيا السيارات"
      justification: "تركيب وصفي ظهر في البحث بالكلمات المفتاحية، قد يتداخل مع مفهوم وحدة القياس ولكنه مرتبط دلالياً."
  knowledge_candidates:
    - lemma: "مِقْدَار أَسَاسِيّ"
      justification: "تركيب وصفي يعتمد على اللفظة 'مقدار' المرادفة لـ 'كمية' والمناسبة للمقادير الفيزيائية."

step1_lemma_validation:
  per_lemma:
    - lemma: "كَمِّيَّة أَسَاسِيَّة"
      decision: confirmed
      decision_reason: "مصطلح علمي مستقر ومؤكد في المعاجم المتخصصة"
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ المعتمد علمياً للدلالة على المقادير الفيزيائية التي لا تُشتق من غيرها"
      example: "الطول والكتلة والزمن هي أمثلة على الكميات الأساسية في الفيزياء."

    - lemma: "مِقْيَاس أَسَاسِيّ"
      decision: removed
      decision_reason: "كلمة 'مقياس' تدل على الآلة أو المعيار وليس على الكمية بحد ذاتها، وهي ترجمة حرفية لـ fundamental measure لا تناسب المفهوم العلمي."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "تختلف عن 'كمية' بكونها تدل على معيار القياس لا مقداره"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وَحْدَة أَسَاسِيَّة"
      source: step05
      decision: removed
      decision_reason: "مرفوض علمياً: 'الوحدة' تختلف عن 'الكمية'. الكتلة هي الكمية، والكيلوغرام هو الوحدة."
      step05_citation: "«الوحدة الأساسية التقنية...» — مسرد هندسة وتكنولوجيا السيارات"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "تعبير عن معيار القياس وليس الكمية المقاسة"

    - lemma: "مِقْدَار أَسَاسِيّ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح وصفي سليم علمياً، و'مقدار' مرادف فصيح لـ'كمية'"
      step05_citation: "معرفة لغوية — تركيب وصفي"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "مرادف لـ'كمية أساسية' يعتمد لفظ 'مقدار' الذي قد يُفضل في بعض السياقات الرياضية"
      example: "تعتمد المعادلات الفيزيائية على المقادير الأساسية لتشتق منها المقادير الأخرى."
      actions:
        - command: create_entry
          params:
            lemma: "مِقْدَار أَسَاسِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13597072-n"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "مِقْدَار أَسَاسِيّ"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

