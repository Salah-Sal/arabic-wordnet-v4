      justification: "التعريف ينص على أن الشخص من أصل أوروبي، والمصطلح يستخدم كمرادف للعرق الأبيض في سياقات معينة."
    - lemma: "قفقاسي"
      source_section: "step4_fts_keyword"
      evidence_citation: "«قوقازيّ؛ قفقاسيّ: ... أحد أفراد العرق الأبيض.» — المورد الحديث (2008)"
      justification: "شكل بديل (variant) لمصطلح قوقازي ناتج عن اختلاف التعريب."
  knowledge_candidates:
    - lemma: "رجل أبيض"
      justification: "تعبير مركّب (MWE) شائع الاستخدام لوصف الشخص من هذا العرق (تركيب وصفي)."

