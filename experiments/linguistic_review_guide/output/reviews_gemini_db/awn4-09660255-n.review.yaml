      example: "يُصنف علماء الأعراق البشرية معظم سكان أوروبا ضمن العرق القوقازي."
    - lemma: "قفقاسي"
      source: step05
      decision: confirmed
      decision_reason: "شكل بديل (variant) مقبول ومستخدم في المعاجم الحديثة."
      step05_citation: "«قوقازيّ؛ قفقاسيّ: ... أحد أفراد العرق الأبيض.» — المورد الحديث (2008)"
