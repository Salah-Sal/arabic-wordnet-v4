step0_evidence:
  per_lemma:
    - lemma: "أبيض"
      confirm:
        - text: "«البيضانُ من الناس: خِلافُ السُّودانِ منهم»"
          source: "المعجم الكبير"
        - text: "«الأبيض: أحد أفراد العرق الأبيض»"
          source: "المورد الحديث (2008)"
        - text: "«البِيضانُ: ... ضِدُّ السُّودانِ»"
          source: "القاموس المحيط للفيروزآبادي"
      expands:
        - text: "«وجه أبيض نقي اللون من الكلف والسواد الشائن»"
          source: "المعجم الوسيط"
          addition: "يصف البياض في الوجه تحديداً"
    - lemma: "قوقازي"
      confirm:
        - text: "«(ب) أحد أفراد العرق الأبيض»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«نسبة إلى القوقاز بمعنى مجموعة سلاسل جبلية...»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكد الأصل الجغرافي للمصطلح"

step05_lemma_generation:
