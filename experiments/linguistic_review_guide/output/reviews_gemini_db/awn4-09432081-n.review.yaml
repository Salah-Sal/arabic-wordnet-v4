      example: "ربطت الهدية بشريط أحمر طويل."

    - lemma: "سلك"
      source: "step05"
      decision: "confirmed"
      decision_reason: "أدلة معجمية صريحة في المعجم الوسيط"
      step05_citation: "«السِّلكُ: الخيط الذى ينظم فيه الخرز ونحوه» — المعجم الوسيط"
