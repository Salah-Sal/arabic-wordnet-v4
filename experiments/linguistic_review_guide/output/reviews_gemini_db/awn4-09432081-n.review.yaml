step0_evidence:
  per_lemma:
    - lemma: "خيط"
      confirm:
        - text: "«الخَيْطُ: السِّلْكُ»"
          source: "القاموس المحيط"
        - text: "«(الْخَيط) السلك يخاط بِهِ أَو ينظم فِيهِ الشَّيْء أَو يرْبط بِهِ»"
          source: "المعجم الوسيط"
        - text: "«سلك رفيع من النسيج يخاط به أو يُنْظَم فيه خرز أو نحوه»"
          source: "معجم اللغة العربية المعاصرة"
      contradicts:
        - text: "«خيط من النعام والبقر والجراد ونحوها: جماعة منه»"
          source: "المعجم الوسيط"
          conflict: "المعنى هنا يدل على الجماعة لا على الجسم المادي الطويل"
        - text: "«خيط الرَّقبة: نُخاعها»"
          source: "المعجم الوسيط"
          conflict: "معنى تشريحي خاص (النخاع الشوكي) يختلف عن المفهوم العام للخط الرفيع"
      expands:
        - text: "«خيط البناء: خيط يمده على الجدار ليُبنى بحذائه»"
          source: "المعجم الوسيط"
          addition: "استعمال تخصصي كأداة هندسية لضمان الاستقامة"
        - text: "«خيوط الكرم: براعم لولبية يستمسك بها الكرم»"
          source: "تكملة المعاجم العربية"
          addition: "إزاحة دلالية لوصف أجزاء النبات الطويلة الملتفة"

    - lemma: "شريط"
      confirm:
        - text: "«وسير من نَسِيج وَنَحْوه مَمْدُود ضيق الْعرض»"
          source: "المعجم الوسيط"
        - text: "«سَيْرٌ من نَسِيجٍ ونحوه ممدودٌ ضَيِّقُ العَرْضِ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«حقيبة صَغِيرَة تضع الْمَرْأَة فِيهَا طيبها»"
          source: "المعجم الوسيط"
          conflict: "معنى الحقيبة (الغرض المنزلي) يختلف جوهرياً عن مفهوم الجسم الطويل"
      expands:
        - text: "«شَرِيطُ تسجيل: شريطٌ مُمَغْنَط تُسَجَّل عليه الأصوات»"
          source: "المعجم الكبير"
          addition: "تطور تقني للمصطلح ليشمل وسائط التخزين الممغنطة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "سلك"
      source_section: "step4_fts_keyword"
      evidence_citation: "«السِّلكُ: الخيط الذى ينظم فيه الخرز ونحوه، أو الذى يخاط به؛ خيط من المعدن دقيق أو غليظ» — المعجم الوسيط"
      justification: "الكلمة تدل صراحة على الخيط أو الجسم المعدني الطويل الرفيع، وهو مطابق تماماً للتعريف"
    - lemma: "سير"
      source_section: "step4_fts_keyword"
      evidence_citation: "«سَيْرٌ من نَسِيجٍ ونحوه ممدودٌ ضَيِّقُ العَرْضِ» — المعجم الكبير"
      justification: "السير هو نوع من الأشرطة الطويلة الرفيعة المصنوعة من الجلد أو النسيج"
  knowledge_candidates:
    - lemma: "فتيل"
      justification: "الفتيل (آلية: اشتقاق) هو كل ما فتل من خيط أو غيره وأصبح طويلاً رفيعاً، ويستخدم في سياقات متنوعة مشابهة للخيط والشريط"

