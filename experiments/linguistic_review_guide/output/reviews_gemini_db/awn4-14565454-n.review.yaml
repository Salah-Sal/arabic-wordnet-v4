step0_evidence:
  per_lemma:
    - lemma: "خطر"
      confirm:
        - text: "«الخَطَر: الإشراف على الهلاك وخوف التلف» — التوقيف على مهمات التعاريف"
        - text: "«الخَطَر: الإشراف على الهلاك إن لم يكن مقروناً بالحذر...» — التعريفات الفقهيّة"
        - text: "«الخطر هو احتمال حصول ضرر في ظل ظروف محددة. وهو مزيج من عاملين: احتمال وقوع حدث ضار، وعواقب الحدث السلبية» — مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«إشارةٌ تُسْتَخْدمُ للتَحذير من الهلاكِ أو الضَرَرِ الشَّديد» — المعجم الكبير"
        - text: "«إمكانية وقوع عواقب على أثر حدث معيّن، ويشمل تقديراً لاحتمال الحدث وتقييماً لنتائجه» — المعجم الموحد لمصطلحات المياه"

    - lemma: "مجازفة"
      confirm:
        - text: "«المُجَازَفة: مصدر خاطر بـ» — معجم اللغة العربية المعاصرة"
        - text: "«ركِب الأخطار: جازف بنفسه، عرّض نفسه للخطر» — معجم اللغة العربية المعاصرة"
      expands:
        - text: "«قياس لاحتمال نشوء ضرر للحياة أو للصحة أو للممتلكات أو للبيئة نتيجة مجازفة معينة» — المعجم الموحد لمصطلحات الهندسة المدنية"

    - lemma: "مخاطرة"
      confirm:
        - text: "«مُخاطَرَة: ما قد ينجم عنه مكروه أو ضرر، عملٌ لا تَروِّي فيه» — معجم اللغة العربية المعاصرة"
        - text: "«خاطر بحياته وغيرِها: عرَّضها للهلاك والخطر» — معجم اللغة العربية المعاصرة"
      expands:
        - text: "«الربط بين احتمال وقوع حدث والآثار المترتبة على حدوثه» — مسرد التربية (ArabTerm)"

