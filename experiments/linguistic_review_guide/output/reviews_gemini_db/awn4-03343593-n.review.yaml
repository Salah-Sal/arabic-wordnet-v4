        - text: "«الغشاء: الغطاء» — المعجم الوسيط"
        - text: "«الغِشاء: طبقة رقيقة جداً كتلك التي تغلف فقاعة الصابون» — المعجم الموحد لمصطلحات الهندسة المدنية"
      expands:
        - text: "«الغِشَاءُ: جسم منتج من لِيف عصباني غير محسوس قَلِيل الثخن» — معجم مقاليد العلوم للسيوطي"
          addition: "تخصيص المعنى دلالياً للمجال العصبوني/الحيوي"
        - text: "«حاجز رقيق يسمح بمرور جسيمات ذات حجم معين أو ذات خاصية فيزيائية أو كيميائية معينة» — المعجم الموحد لمصطلحات الهندسة المدنية"
          addition: "إضافة وظيفة النفاذية (Membrane) للمفهوم"

    - lemma: "طبقة رقيقة"
      confirm:
        - text: "«لا تتجاوز سماكتها الميلمترات والتي يتم ملاحظتها في عينة غضارية» — المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "«ضئيلة السمك» — المعجم الموحد لمصطلحات علوم الزلازل"
        - text: "«Thin layer / Thin seam» — المعاجم الموحدة (مهنية، تقنية، جيولوجيا)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "فيلم"
      source_section: "step5_english_bridge"
      evidence_citation: "«فيلم: Film» — المعجم الموحد للمصطلحات المهنية والتقنية"
      justification: "المصطلح المعاصر الأكثر شيوعاً في الأوساط العلمية والتقنية للمفهوم، ولا يقتصر على السينما."
    - lemma: "رقاقة"
      source_section: "step5_english_bridge"
      evidence_citation: "«الرُّقاقة: قطعة من السِّلوفان ونحوِهِ يُلَفّ بها» — المورد الحديث"
      justification: "تدل على الطبقة الرقيقة جداً من مادة مرنة أو معدنية."
  knowledge_candidates:
    - lemma: "غلالة"
      justification: "لفظ تراثي فصيح يُستخدم لوصف الطبقة الرقيقة جداً الشفافة أو شبه الشفافة التي تغطي شيئاً ما (إزاحة دلالية مجازية من غلالة الثوب)."
    - lemma: "قشرة"
      justification: "تُستخدم دلالياً لوصف الطبقة السطحية الرقيقة التي تتكون فوق سائل أو جسم صلب (استعارة)."
  generation_notes: "تم التركيز على المصطلحات التقنية المستقرة (فيلم، رقاقة) مع استحضار الألفاظ الفصيحة ذات البعد الوصفي (غلالة)."

