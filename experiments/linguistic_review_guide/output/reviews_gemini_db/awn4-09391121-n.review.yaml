step0_evidence:
  per_lemma:
    - lemma: "جار"
      confirm:
        - text: "«تصور من الجار معنى القرب فقيل لكل ما يقرب من غيره جاره ومنه {وَفِي الْأَرْضِ قِطَعٌ مُتَجَاوِرَات}» — التوقيف على مهمات التعاريف للمناوي"
        - text: "«الجار: الملاصق أو القريب في المسكن» — المعجم الوسيط"
        - text: "«وقد تصوّر من الجار معنى القرب، فقيل لمن يقرب من غيره: جاره، وجاوره، وتجاور» — المفردات في غريب القرآن للراغب الأصفهاني"
    - lemma: "مجاور"
      confirm:
        - text: "«مجاور، جار: neighbour» — المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«المجاور: الملاصق في المسكن» — المعجم الوسيط"
      expands:
        - text: "«مجاور المسجد: المعتكف فيه» — المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "متاخم"
      source_section: "step4_fts_keyword"
      evidence_citation: "«مُتاخِم: مُجاوِر» — المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      justification: "مصطلح مرادف لمجاور في السياق الفيزيائي والهندسي."

step1_lemma_validation:
  per_lemma:
    - lemma: "جار"
      decision: confirmed
      decision_reason: "مصطلح عربي فصيح مستقر دلالياً للتعبير عن القرب والمجاورة، وقد استُعمل تراثياً وحديثاً للتعبير عن القرب بين الذوات والأشياء."
      evidence_assessment:
        case: "confirm"
      nuance_differentiation: "يركز على العلاقة المتبادلة في القرب (اسم متضايف) والاشتراك في حيز دلالي واحد."
      example: "تنجذب النواة إلى الذرة الجارة لها بقوى الترابط الكيميائي."
    - lemma: "مجاور"
      decision: confirmed
      decision_reason: "اسم فاعل من جاور، وهو الأكثر شيوعاً في الاستعمال التقني والعلمي الحديث لوصف الأجسام المتقاربة في حيز مكاني."
      evidence_assessment:
        case: "confirm"
      nuance_differentiation: "يركز على الموقع المكاني والوضعية الفيزيائية (الوقوع في جوار الشيء) دون ضرورة التضايف المعنوي العميق."
      example: "يُحسب السطح بناءً على النقاط المجاورة له في النموذج الرقمي."
    - lemma: "متاخم"
      source: step05
      decision: removed
      decision_reason: "مصطلح 'متاخم' يفترض التماس المباشر (Contact) أو وجود حدود مشتركة، بينما 'جار' و'مجاور' يعبران عن القرب (Nearby) بشكل أعم سواء كان بتماس أو بدون."
      step05_citation: "«مُتاخِم: مُجاوِر» — معجم الهندسة المدنية"

step3_definition:
  current_definition: "جسم قريب من نفس النوع"
  assessment:
    decision: retain
    reason: "التعريف دقيق ومباشر ومطابق للمفهوم الدولي (OEWN) مع وضوح لغوي تام."

step4_relations:
  hypernymy:
    current_hypernym: "جسم"
    test_result: "correct"
  antonymy:
    per_lemma:
      - lemma: "جار"
        antonym_found: true
        antonym: "ناءٍ/بعيد"

step5_enrichment:
  per_lemma:
    - lemma: "جار"
      enrichment:
        root: "ج-و-ر"
      examples:
        - text: "أقرب جار (nearest neighbor) هو مصطلح فيزيائي يستخدم لوصف أقرب كيان لكيان آخر من نفس الصنف."
          type: usage
          source: "المعجم الموحد لمصطلحات الفيزياء"
    - lemma: "مجاور"
      enrichment:
        root: "ج-و-ر"
      examples:
        - text: "تأثير المجموعة المجاورة (neighboring group effect) يصف التفاعل الكيميائي الذي يتأثر بكيانات قريبة."
          type: usage
          source: "المعجم الموحد لمصطلحات الكيمياء"
  cultural_fit:
    assessment: native
