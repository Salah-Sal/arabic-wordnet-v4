    - lemma: "تنفيذ"
      confirm:
        - text: "«إجرائيةُ إنجازِ تعليمةٍ (أو تعليمات) لبرنامجٍ حاسوبي بواسطة الحاسوب.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«آمرة تطلب من الحاسوب تنفيذ برنامج»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
    - lemma: "إجراء"
      contradicts:
        - text: "«في برنامجٍ ما: متتاليةٌ من العبارات تَحمِلُ اسماً محدَّداً... وتُنفِّذُ عادةً مهمةً واحدة.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "المصطلح يشير إلى 'Procedure' (الكيان البرمجي) وليس 'Execution' (الحدث)"
      peripheral_observations:
        - "يستخدم بالمعنى العام (measure/action) كما في معجم الصواب اللغوي."

