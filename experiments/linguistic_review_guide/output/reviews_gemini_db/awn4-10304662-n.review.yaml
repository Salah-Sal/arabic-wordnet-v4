      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى من يكثر الشكوى والتعبير اللفظي عن عدم رضاه وامتعاضه."
      example: "حاول المدير تهدئة الموظف المتذمر من طول ساعات العمل."
