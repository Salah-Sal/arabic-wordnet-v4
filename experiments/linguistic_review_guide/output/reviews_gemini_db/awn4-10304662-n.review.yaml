step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُسْتَاء"
      source_section: "step5_english_bridge"
      evidence_citation: "«ساخط؛ مُستاء؛ قلِقُ البال.» — المورد الحديث (2008)"
      justification: "وردت الكلمة كترجمة مباشرة لكلمة discontented في المعاجم الثنائية، وهي تعبر بدقة عن حالة عدم الرضا التي يشير إليها التعريف."
    - lemma: "مُتَبَرِّم"
      source_section: "step5_english_bridge"
      evidence_citation: "«ساخط؛ ممتعض؛ متبرّم.» — المورد الحديث (2008)"
      justification: "وردت الكلمة في المعاجم ضمن سياق السخط والامتعاض، وهي تعبر عن كثرة التضجر وإظهار عدم الرضا."
  knowledge_candidates:
    - lemma: "مُتَأَفِّف"
      justification: "اشتقاق (اسم فاعل) من الفعل تأفّف، أي قال أف وتضجر، وتستخدم لوصف الشخص الذي يظهر السخط والضيق من الأمور."

step1_lemma_validation:
