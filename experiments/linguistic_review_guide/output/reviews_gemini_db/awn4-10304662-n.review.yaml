    - lemma: "نَاقِم"
      decision: confirmed
      decision_reason: "مصطلح قوي وشائع للتعبير عن السخط الشديد الذي قد يرافقه رغبة في الانتقام أو الثورة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى من يضمر الكراهية والرفض الشديد للأوضاع وقد يميل للثورة أو الانتقام."
      example: "انضم إلى صفوف المعارضة شاب ناقم على سياسات الحكومة."
      actions: []
    - lemma: "مُسْتَاء"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع ومطابق لدلالة الكلمة الإنجليزية (discontented)."
      step05_citation: "«ساخط؛ مُستاء؛ قلِقُ البال.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى الشعور الداخلي بعدم الرضا والضيق دون أن يصل بالضرورة إلى درجة الغضب أو الثورة."
      example: "غادر الزبون المستاء المتجر بعد أن طال انتظاره."
      actions:
        - command: create_entry
          params:
            lemma: "مُسْتَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10304662-n"
    - lemma: "مُتَبَرِّم"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر بدقة عن حالة الضجر والامتعاض من الأوضاع."
      step05_citation: "«ساخط؛ ممتعض؛ متبرّم.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على إظهار الضجر والملل والضيق من تكرار شيء مزعج أو وضع غير مريح."
      example: "استمع المعلم إلى التلميذ المتبرم من كثرة الواجبات المدرسية."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَبَرِّم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10304662-n"
    - lemma: "مُتَأَفِّف"
      source: step05
      decision: removed
      decision_reason: "تعتبر 'متبرم' و'متذمر' أكثر دقة واصطلاحية في تمثيل المفهوم من 'متأفف' التي ترتبط بلفظ محدد (أف) وتعتبر أقل شمولاً."
      step05_citation: "اقتراح مبني على المعرفة اللغوية"

