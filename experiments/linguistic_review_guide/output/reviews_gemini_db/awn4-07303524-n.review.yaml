step0_evidence:
  per_lemma:
    - lemma: "معجزة"
      confirm:
        - text: "«أمرٌ خارق للعادة يُظهرهُ اللهُ على يد نبيّ تأييدًا لنبوَّتِهِ ما يعجز البشر أن يأتوا بمثله» — المعجم الوسيط"
        - text: "«أمر خارق للعادة، داعٍ إلى الخير والسعادة، مقرون بدعوى النبوة، قصد به إظهار صدق من ادعى أنه رسول من الله.» — كتاب التعريفات للشريف الجرجاني"
        - text: "«المعجزة:[في الانكليزية] Miracle ،prodigy [ في الفرنسية] Miracle ،prodige اسم فاعل من الإعجاز وهي في الشرع أمر خارق للعادة من ترك أو فعل مقرون بالتحدّي مع عدم المعارضة» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      peripheral_observations:
        - "المعنى التراثي الإسلامي يخصص المعجزة بالأنبياء المقترنة بالتحدي، بخلاف الاستعمال المعاصر الذي يطلقها على أي تدخل إلهي خارق للعادة."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "أعجوبة"
      source_section: "step5_english_bridge"
      evidence_citation: "«مُعْجِزة؛ أعجوبة.» — المورد الحديث (2008)"
      justification: "وردت في المعاجم ثنائية اللغة كمرادف للمعجزة، لكنها أعم منها (دلالة على كل ما يدعو للعجب)."
  knowledge_candidates:
    - lemma: "كرامة"
      justification: "مجاز إسلامي/تخصيص: تطلق الكرامة على الحدث الخارق للعادة الذي يجريه الله على يد عبد صالح (ولي) دون دعوى النبوة، وهي تندرج تحت مفهوم التدخل الإلهي الخارق (miracle)."

step1_lemma_validation:
  per_lemma:
    - lemma: "معجزة"
      decision: confirmed
      decision_reason: "مصطلح أساسي ومستقر للتعبير عن التدخل الإلهي الخارق للعادة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام والشائع للحدث الخارق للعادة بفعل إلهي، ويختص تراثياً بخوارق الأنبياء."
      example: "نجا من الحادث المروع بمعجزة إلهية."

    - lemma: "كرامة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح دقيق يعبر عن الخوارق الإلهية التي تظهر على أيدي الأولياء والصالحين، وتعد نوعاً من المعجزات في المفهوم العام."
      step05_citation: "«الْأَمر الخارق للْعَادَة غير المقرون بالتحدي وَدَعوى النُّبُوَّة يظهره الله على أَيدي أوليائه» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص تراثياً بما يظهر من خوارق على يد الأولياء دون دعوى النبوة، مقابل المعجزة للأنبياء."
      example: "يتناقل القرويون قصصاً عن كرامات الولي المدفون في قريتهم."
      actions:
        - command: create_entry
          params:
            lemma: "كرامة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07303524-n"

    - lemma: "أعجوبة"
      source: step05
      decision: removed
      decision_reason: "دلالتها أعم من التدخل الإلهي، فهي تشمل أي أمر يثير العجب حتى لو كان من صنع البشر أو الطبيعة المعتادة."
      step05_citation: "«(الأعجوبة) مَا يَدْعُو إِلَى الْعجب (ج) أَعَاجِيب» — المعجم الوسيط"

  added_lemmas:
    - lemma: "كرامة"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

