      justification: "ترجمة شائعة ودقيقة تصف الوظيفة (حمل الماء)."
  knowledge_candidates:
    - lemma: "مستودع جوفي"
      justification: "استخدام آلية (المجاز/الاشتقاق): استعارة مفهوم المستودع (مكان الحفظ) للتكوين الجيولوجي الذي يحفظ المياه الجوفية."
  generation_notes: "المصطلحات العربية تتراوح بين التركيز على 'الطبقة' (layer) و'المكان' (خزان، مكمن، مستودع)."

