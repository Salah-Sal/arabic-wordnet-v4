      source_section: "step5_english_bridge"
      evidence_citation: "«المَكْمَنُ المائيّ: طبقة صخرية غنيّة بالماء (جي).» — المورد الحديث (2008)"
      justification: "مصطلح معتمد في المعاجم الحديثة للدلالة على الطبقة الحاملة للماء."
    - lemma: "طبقة مائية"
      source_section: "step5_english_bridge"
