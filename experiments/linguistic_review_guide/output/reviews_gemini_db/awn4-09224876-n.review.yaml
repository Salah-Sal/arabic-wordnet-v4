    decision: revise
    reason: "التعريف الحالي هو ترجمة حرفية ركيكة ('تنتج المياه الجوفية'). الأفضل صياغة تعريف مصطلحي دقيق يعكس الطبيعة الجيولوجية والهيدرولوجية للمفهوم."
