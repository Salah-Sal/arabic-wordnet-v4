step0_evidence:
  per_lemma:
    - lemma: "خزان جوفي"
      confirm:
        - text: "«خزان جوفي»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«خزان جوفي»"
          source: "المَكنَز الزراعي متعدد اللغات"
    - lemma: "طبقة مياه جوفية"
      confirm:
        - text: "«طبقة من الصخور القابلة للاختراق والرمل والحصى، حاملة للمياه أو قادرة على توفير كميات كبيرة من المياه.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«كتلة صخرية ذات فجوات تصلح لاحتواء ونقل المياه الجوفية، وكانت تُعرف سابقاً بتكوين حامل للمياه أو بطبقة حاوية للمياه وقد انتشرت أيضاً باسم (Aquifer) المأخوذ في الأصل من اللغة الإنجليزية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"

step05_lemma_generation:
