      - lemma: "عَارِف"
        antonym_found: true
        antonym: "جَاهِل"
      - lemma: "مُدْرِك"
        antonym_found: true
        antonym: "غَافِل"
      - lemma: "وَاعٍ"
        antonym_found: true
        antonym: "غَافِل"
  verb_checks:
    applicable: false
  selectional_restrictions:
    - lemma: "عَارِف"
      constraint: "يُشترط أن يكون فاعلاً عاقلاً قادراً على المعرفة."
    - lemma: "مُدْرِك"
      constraint: "يُشترط أن يكون فاعلاً عاقلاً قادراً على الاستيعاب."

