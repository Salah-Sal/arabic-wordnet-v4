step0_evidence:
  per_lemma:
    - lemma: "تَوَّاق"
      confirm:
        - text: "«صيغة مبالغة من تاقَ/ تاقَ إلى: كثير الرغبة والشوق (المرء توّاق إلى ما لم ينل- نفس توّاقة)» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«توّاق؛ شديد الرغبة في» — المورد الحديث (2008)"
    - lemma: "مُتَلَهِّف"
      confirm:
        - text: "«تلهَّف إلى سماع القصَّة/ تلهَّف على سماع القصَّة: تشوَّق، رغب فيه (نظرة متلهِّفة- تلهَّف المحبّ لرؤية محبوبه)» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«توّاق إلى؛ مُتَلَهِّف على eager to leave» — المورد الحديث (2008)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُشْتَاق"
      source_section: "step4_fts_keyword"
      evidence_citation: "«من تنزع نفسه إلى الشيء وترغب فيه بشدة.» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "اشتقاق لاسم الفاعل من (اشتاق)، يدل على من تنزع نفسه لشيء وتطلبه بقوة."
  knowledge_candidates:
    - lemma: "طَامِح"
      justification: "اشتقاق لاسم الفاعل من الجذر (ط-م-ح)، ويُطلق على من ترتفع همته ويرغب بشدة في بلوغ غاية أو تحقيق هدف."
    - lemma: "رَاغِب"
      justification: "اشتقاق لاسم الفاعل من الجذر (ر-غ-ب)، يعبر عن من يطلب الشيء ويريده."

step1_lemma_validation:
  per_lemma:
    - lemma: "تَوَّاق"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر، ويطابق التعريف بدقة، وصيغة المبالغة (فَعَّال) تناسب قوة الرغبة المذكورة في التعريف."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على شدة النزوع والطموح إلى الشيء بخفة وميل، وكثيراً ما تقترن بالرغبة في المعالي أو الأمور المستقبلية."
      example: "الشبابُ تَوَّاقٌ إلى استكشافِ العالَمِ وتجربةِ كُلِّ جَديدٍ."
      
    - lemma: "مُتَلَهِّف"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع، يعبر عن الشوق الشديد المصحوب باستعجال."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على فرط الشوق المصحوب بحرقة أو استعجال شديد للحصول على الشيء المرغوب، وقد تتضمن دلالة على التحسر أحياناً."
      example: "وقَفَ الجُمهورُ مُتَلَهِّفًا لِسماعِ النَّتيجَةِ النِّهائِيَّةِ لِلمُباراةِ."
      
    - lemma: "مُشْتَاق"
      source: step05
      decision: confirmed
      decision_reason: "الكلمة صحيحة فصيحة وتؤدي المعنى، ولكن يغلب عليها الاستعمال في الحنين إلى أشخاص أو أماكن مألوفة، وهي صالحة لتمثيل المفهوم."
      step05_citation: "«من تنزع نفسه إلى الشيء وترغب فيه بشدة.» — موسوعة السلطان قابوس لأسماء العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يغلب عليه الحنين ونزوع النفس إلى ما غاب أو بَعُد، مقارنة بـ(التوّاق) الذي ينزع إلى الجديد غالباً."
      example: "عادَ المُغترِبُ إلى وَطَنِهِ مُشْتَاقًا لِرُؤيَةِ أَهلِهِ وأَحبَابِه."
      actions:
        - command: create_entry
          params:
            lemma: "مُشْتَاق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10290575-n"

    - lemma: "طَامِح"
      source: step05
      decision: confirmed
      decision_reason: "كلمة فصيحة، تعبر عن الرغبة القوية الممتزجة بعلو الهمة والسعي للأفضل."
      step05_citation: "«يقال: طَمَحَ إلى الأمر فهو طامح، إذا تطلع واستشرف» — معجم الصواب اللغوي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بالرغبة القوية الموجهة نحو المعالي وتطوير الذات وتحقيق الأهداف الكبيرة."
      example: "كانَ الشَّابُّ طَامِحًا إلى تَحقيقِ إِنجازٍ عِلمِيٍّ غَيرِ مَسبُوقٍ."
      actions:
        - command: create_entry
          params:
            lemma: "طَامِح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10290575-n"

    - lemma: "رَاغِب"
      source: step05
      decision: removed
      decision_reason: "الرغبة مجرد الإرادة ولا تعبر بالضرورة عن (رغبة قوية) كما ينص التعريف، فهي أضعف دلالة من توّاق ومتلهف."
      step05_citation: "معرفة لغوية"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "مُشْتَاق"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "طَامِح"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

