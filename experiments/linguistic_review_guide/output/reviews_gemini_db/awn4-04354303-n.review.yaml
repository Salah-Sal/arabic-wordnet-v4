step0_evidence:
  per_lemma:
    - lemma: "موضوع"
      confirm:
        - text: "«موضوع» — مسرد الفن، التسلية والرياضة (ArabTerm)"
          source: "ArabTerm"
      expands:
        - text: "«الْمَوْضُوع: الْمَادَّة الَّتِي يبْنى عَلَيْهَا الْمُتَكَلّم أَو الْكَاتِب كَلَامه... (فِي الفلسفة) الْمدْرك ويقابل الذَّات» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«الموضوع... الشيء المشار إليه إشارة حسّية» — كشاف اصطلاحات الفنون"
          source: "كشاف اصطلاحات الفنون"

    - lemma: "محتوى"
      confirm:
        - text: "«محتوًى: مضمون؛ موضوع؛ مادة» — المورد الحديث"
          source: "المورد الحديث"
      contradicts:
        - text: "«(المحتوى) بيُوت النَّاس من الْوَبر مجتمعة على مَاء» — المعجم الوسيط"
          source: "المعجم الوسيط"
          conflict: "المعنى التراثي يشير إلى بيوت الوبر، بينما المقصود في المجموعة هو المضمون الفني."
      expands:
        - text: "«المضمون هو الجانب المجد في الخطاب وهو موضوعه ومظهره التصوري» — المعجم الموحد لمصطلحات اللسانيات"
          source: "المعجم الموحد لمصطلحات اللسانيات"

    - lemma: "غرض مصور"
      evidence_status: "no_material_found"

step05_lemma_generation:
