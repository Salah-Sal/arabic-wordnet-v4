      justification: "ترادف 'محتوى' و'موضوع' في سياق المادة العلمية أو الفنية (آلية التوليد: مجاز/إزاحة دلالية من الحاوي إلى المحوى)."
  generation_notes: "تم استبعاد 'غرض مصور' لكونها ترجمة حرفية غير مستقرة معجمياً."

