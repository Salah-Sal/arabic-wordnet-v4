    - lemma: "مادة"
      source_section: "step5_english_bridge"
      evidence_citation: "«موضوع؛ مادة» — المورد الحديث"
      justification: "وردت كمرادف لـ subject matter و content في المعاجم الحديثة."
  knowledge_candidates:
