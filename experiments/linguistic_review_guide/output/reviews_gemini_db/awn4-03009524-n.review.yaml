step0_evidence:
  per_lemma:
    - lemma: "بديل"
      confirm:
        - text: "«البديل: الخلف والعوض»"
          source: "المعجم الوسيط"
        - text: "«يطلق اسم البديل على الضمائر وأسماء الإشارة التي لها وظيفة أساسية وهي أن تأتي بدلا من كلمة...»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«بديل: منظور مغاير لمعالجة قضية من القضايا»"
          source: "مسرد الإعلام والتواصل"
    - lemma: "مُغايِر"
      confirm:
        - text: "«مغاير: مكون من أنسجة تختلف عن طبيعة العضو»"
          source: "معجم المصطلحات الطبية"
      expands:
        - text: "«مغاير: صفة لبنية تشريحيّة تتسم بأبعاد متغايرة»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"
          addition: "يستخدم غالباً كصفة ولكن يمكن استعماله اسمياً للدلالة على الشيء المختلف"
    - lemma: "شيء مختلف"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تغيير"
      source_section: "step5_english_bridge"
      evidence_citation: "«(10) تغيير؛ تبديل (11) تغيُّر؛ تبدُّل» — المورد الحديث"
      justification: "يقابل لفظ change في معجم المورد ويشير إلى الحدث أو نتيجة الحدث (الشيء المختلف)."
    - lemma: "تغيُّر"
      source_section: "step5_english_bridge"
      evidence_citation: "«تغيُّر؛ تحوُّل [إلى ما هو أفضل عادةً]» — المورد الحديث"
      justification: "يشير إلى حالة الشيء الذي اختلف عما كان عليه."
  knowledge_candidates:
    - lemma: "تبديل"
      justification: "آلية: اشتقاق (مصدر). يستعمل للدلالة على جعل الشيء مختلفاً أو استبداله."
  generation_notes: "التركيز على المصطلحات التي تعبر عن 'الشيء المتبدل' أو 'الوضعية المختلفة' نتيجة التغيير."

step1_lemma_validation:
  per_lemma:
    - lemma: "بديل"
      decision: confirmed
      decision_reason: "مصطلح مستقر للدلالة على الشيء الذي يحل محل غيره ويكون مختلفاً عنه في السياق."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "يركز على وظيفة 'التعويض' أو 'الاستبدال' (substitute)."
      example: "طرح الباحث فرضية بديلة لتفسير النتائج."
    - lemma: "مُغايِر"
      decision: confirmed
      decision_reason: "على الرغم من شيوعه كصفة، إلا أنه يستخدم اسمياً في السياقات الفلسفية والمنطقية للدلالة على الآخر أو المختلف."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "يركز على صفة 'المغايرة' والتباين مع الأصل (unlike/different)."
      example: "تبنى الكاتب منظوراً مغايراً للسائد في عصره."
    - lemma: "شيء مختلف"
      decision: removed
      decision_reason: "تركيب وصفي حر وليس مصطلحاً مسكوكاً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "تغيير"
      source: step05
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً للتعبير عن المفهوم العام للتبدل (change) والشيء الذي استجد."
      step05_citation: "«التغيير: هو إحداث شيء لم يكن قبله» — كتاب التعريفات للجرجاني"
      nuance_differentiation: "يشير إلى الفعل وإلى النتيجة (الشيء الجديد المختلف)."
      example: "سيكون هذا التغيير مفيداً للجميع."
      actions:
        - command: create_entry
          params:
            lemma: "تغيير"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03009524-n"
    - lemma: "تغيُّر"
      source: step05
      decision: confirmed
      decision_reason: "يعبر عن الصيرورة والحالة المختلفة التي آل إليها الشيء."
      step05_citation: "«تغيُّر؛ تحوُّل [إلى ما هو أفضل عادةً]» — المورد الحديث"
      nuance_differentiation: "يركز على الجانب الانفعالي (الحالة التي طرأت على الشيء) أكثر من الفعل المتعمد."
      example: "لاحظ العلماء تغيراً مفاجئاً في المناخ."
      actions:
        - command: create_entry
          params:
            lemma: "تغيُّر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03009524-n"
  added_lemmas:
    - lemma: "تغيير"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "تغيُّر"
      reason: "مصدر: الخطوة ٠٫٥"
