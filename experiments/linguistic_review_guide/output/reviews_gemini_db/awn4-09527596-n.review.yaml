      source_section: "step5_english_bridge"
      evidence_citation: "«theurgy: the effect of supernatural or divine intervention in human affairs» — OEWN"
      justification: "الترجمة المباشرة والمستقرة لمفهوم 'divine intervention' الذي يعرّف به المصطلح الإنجليزي."
    - lemma: "ثيورجيا"
      source_section: "step4_fts_keyword"
      evidence_citation: "«سِحريّ إلخ (را. theurgy)» — المورد الحديث"
      justification: "التعريب الصوتي للمصطلح التقني المستخدم في الأدبيات الفلسفية (خاصة الأفلاطونية المحدثة)."
  knowledge_candidates:
    - lemma: "خرق العادة"
      justification: "المصطلح الكلامي التراثي الدقيق لوصف التدخل الإلهي الذي يكسر سنن الطبيعة (الاستمرارية العادية)."
  generation_notes: "المصطلحات في AWN تركز على الوصف (خوارق إلهية) أو الممارسة (سحر ديني)، بينما يفتقر النظام للمصطلح المفاهيمي العام (تدخل إلهي)."

