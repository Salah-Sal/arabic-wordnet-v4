step0_evidence:
  per_lemma:
    - lemma: "خوارق إلهية"
      confirm:
        - text: "«خارِق (في الفلسفة): ما جاوز قُدْرَةَ العَبْدِ أو طَبِيعة المخلوقات كالمُعْجِزة والكرامة» — المعجم الكبير"
        - text: "«(الخارق) ... (عِنْد الْمُتَكَلِّمين) مَا خَالف الْعَادة وَهُوَ معجز إن قَارن التحدي» — المعجم الوسيط"
        - text: "«theurgy: (2) اجتراح المعجزات [بمساعدة فَوْقطبيعية]» — المورد الحديث"
      expands:
        - text: "«المعجزة: أمر خارق للعادة يدعو إلى الخير والسعادة، مقرون بدعوى النبوة قصد به إظهار صدق من ادعى أنه رسول الله» — التوقيف على مهمات التعاريف"
    - lemma: "سحر ديني"
      confirm:
        - text: "«theurgy: (1) سِحْر» — المورد الحديث"
      contradicts:
        - text: "«السِّحْرُ: كل أمر يَخْفَى سببُه ويُتخيَّل على غير حقيقته ويجري مجرى التمويه والخداع» — المعجم الوسيط"
        - conflict: "التعريف المعجمي يربط السحر بالخداع والتمويه، بينما 'السحر الديني' (Theurgy) في السياق اللاهوتي يقصد به فعل مقدس حقيقي."
      peripheral_observations:
        - "المورد الحديث يستخدم 'سحر' كترجمة أولى لـ theurgy، مما يدعم استخدام 'سحر ديني' كمصطلح مركب لتمييزه."

step05_lemma_generation:
