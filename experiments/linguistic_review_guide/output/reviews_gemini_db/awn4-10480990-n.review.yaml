step0_evidence:
  per_lemma:
    - lemma: "سلطة"
      confirm:
        - text: "«(السلطة) التسلط والسيطرة والتحكم»"
          source: "المعجم الوسيط"
        - text: "«ذوو السيطرة والتحكم. (في علم الاجتماع) (Authority :E): القدرة القانونية أو المجتمعية على ممارسة نفوذ على فرد أو جماعة»"
          source: "المعجم الكبير"
      expands:
        - text: "«إصدار الأوامر والنواهي ممن يملكها إلى الخاضعين لها، وإثابتهم أو عقابهم»"
          source: "المعجم الكبير"
          addition: "توسيع في مهام السلطة ووظائفها الإجرائية."
    - lemma: "قوة"
      confirm:
        - text: "«(2) «أ» قوة عسكرية. «ب» pl.: جيش. «ج» قوةٌ منظمة a police force»"
          source: "المورد الحديث"
        - text: "«القوات المسلحة فيالق الجيش في البر والبحر والجو (محدثة)»"
          source: "المعجم الوسيط"
      expands:
        - text: "«مبعث النشاط والنمو والحركة»"
          source: "المعجم الوسيط"
          addition: "تشمل القوة في هذا السياق الكيانات الحيوية والاجتماعية الفاعلة."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "سلطة"
      source_section: "step5_english_bridge"
      evidence_citation: "«Authority : القدرة القانونية أو المجتمعية على ممارسة نفوذ» — المعجم الكبير"
      justification: "اللمّة تطابق المفهوم في اللغتين العربية والإنجليزية."
    - lemma: "قوة"
      source_section: "step5_english_bridge"
      evidence_citation: "«force : قوة عسكرية، قوة منظمة» — المورد الحديث"
      justification: "اللمّة تعبّر عن الكيان الممارس للقدرة أو التأثير."
  knowledge_candidates:
    - lemma: "سلطان"
      justification: "تستخدم في النصوص الكلاسيكية للتعبير عن ذي القوة أو السيطرة، وإن كانت تميل للشخصنة أكثر من المؤسسية."
    - lemma: "هيئة"
      justification: "تستخدم لوصف الكيان التنظيمي الذي يمارس سلطة محددة (مثل هيئة الرقابة)، آلية التوليد: مجاز مرسل (المحلّ للحالّ)."

step1_lemma_validation:
  per_lemma:
    - lemma: "سلطة"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبّر عن الكيان (الجهة) الذي يملك الحق القانوني والمجتمعي في ممارسة النفوذ، وهو مطابق لتعريف المجموعة."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "تختص 'السلطة' بالجانب المؤسسي والنظامي والشرعي (Legal Authority)، وعادة ما ترتبط بهيئات الدولة أو التنظيمات المعترف بها."
      example: "تمارس السلطةُ حقها في فرض القوانين وضمان تطبيقها."
    - lemma: "قوة"
      decision: confirmed
      decision_reason: "تُستخدم للتعبير عن الكيان الفاعل الذي يمتلك قدرة تأثيرية أو مادية (مثل القوة العظمى أو القوة العسكرية)، وتطابق المفهوم الإنجليزي force/power."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "تختص 'القوة' بالقدرة الفعلية أو المادية على التأثير والضغط (Physical/Dynamic Might)، سواء كانت سياسية أو عسكرية أو اقتصادية، دون اشتراط الشرعية القانونية دائماً."
      example: "برزت هذه الدولةُ كقوةٍ اقتصاديةٍ عظمى في العقد الأخير."

step3_definition:
  definition_review_flag: false
  current_definition: "جهة تمتلك أو تمارس قوة أو نفوذاً أو سلطة"
  assessment:
    decision: retain
    reason: "التعريف دقيق وشامل، حيث استخدم لفظ 'جهة' ليعبّر عن الكيان (one/entity) ووصف الوظيفة الأساسية وهي ممارسة النفوذ أو القوة."

