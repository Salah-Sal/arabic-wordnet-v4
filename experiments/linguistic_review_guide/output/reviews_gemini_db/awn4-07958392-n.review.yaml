      nuance_differentiation: "تؤكد على الطبيعة البيولوجية والجوهرية للإنسان مقابل الكائنات الأخرى"
      example: "﴿وَهُوَ الَّذِي خَلَقَ مِنَ الْمَاءِ بَشَرًا فَجَعَلَهُ نَسَبًا وَصِهْرًا﴾"
    - lemma: "ناس"
      decision: confirmed
      decision_reason: "أدلة معجمية قوية، وهو اللفظ الأشيع للمجموع البشري"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام والأشمل للمجموع البشري في السياقات الاجتماعية واليومية"
      example: "﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾"
    - lemma: "خلق"
      source: step05
