            synset_id: "awn4-07958392-n"
    - lemma: "أنام"
      source: step05
      decision: confirmed
      decision_reason: "لفظ تراثي فصيح مخصص للبشر (والجن أحياناً) كجماعة"
      step05_citation: "«الأنام: الخلق، وهم كل ما على ظهر الأرض من دابة» — لسان العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "لفظ أدبي كلاسيكي يستحضر شمولية الوجود البشري على الأرض"
      example: "﴿وَالْأَرْضَ وَضَعَهَا لِلْأَنَامِ﴾"
