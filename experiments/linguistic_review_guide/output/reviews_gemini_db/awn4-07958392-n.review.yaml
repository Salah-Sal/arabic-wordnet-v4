      example: "كان هناك ثلاثة أشخاص ينتظرون في الخارج."
    - lemma: "بشر"
      decision: confirmed
      decision_reason: "أدلة معجمية قطعية تؤكد دلالتها على الجنس البشري واحداً وجمعاً"
