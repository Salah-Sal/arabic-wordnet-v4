step0_evidence:
  per_lemma:
    - lemma: "أشخاص"
      confirm:
        - text: "«ثلاثة أشخاص: امرأتان وفتاة»"
          source: "معجم الصواب اللغوي"
        - text: "«أَشْخَاص: جمع شخص»"
          source: "القاموس المحيط"
    - lemma: "بشر"
      confirm:
        - text: "«البَشَرُ: الإِنْسَانُ ذَكَراً أو أُنْثَى، واحداً أو جَمْعاً»"
          source: "القاموس المحيط"
        - text: "«البَشَرُ: الإِنْسَان (الْوَاحِد وَالْجمع والمذكر والمؤنث فِيهِ سَوَاء)»"
          source: "المعجم الوسيط"
        - text: "«الْبَشَرُ الإِنسانُ والواحدُ والجميعُ والمذكَّرُ والمؤَنَّثُ في ذلك سواء»"
          source: "لسان العرب"
    - lemma: "ناس"
      confirm:
        - text: "«الناس: (اسم) اسم جمع لبني آدم، لا مفرد له من لفظه»"
          source: "المعجم الوسيط"
        - text: "«الناس: البشر، الخلق»"
          source: "المورد الحديث"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "خلق"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الخَلْقُ: الناس» — لسان العرب"
      justification: "كلمة واسعة الانتشار في التراث واللغة المعاصرة تدل على مجموع الناس"
    - lemma: "أنام"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الأَنَامُ: جَمِيع مَا على الأَرْض من الْخلق» — المعجم الوسيط"
      justification: "لفظ تراثي فصيح يشير إلى البشر كجماعة مخلوقة"
  knowledge_candidates:
    - lemma: "ورى"
      justification: "مجاز — لفظ كلاسيكي يُطلق على البشر عامة (الخلق)، يُستخدم في السياقات الأدبية والفصيحة"
    - lemma: "أناسي"
      justification: "اشتقاق — جمع إنسان، ويُستخدم للدلالة على جماعات البشر (أناسي كثيرًا)"

