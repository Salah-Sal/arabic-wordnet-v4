step0_evidence:
  per_lemma:
    - lemma: "تكملة"
      confirm:
        - text: "«(التكملة) مَا يتم بِهِ الشَّيْء» — المعجم الوسيط"
          source: "المعجم الوسيط"
      expands:
        - text: "«سلعة ينخفض الطلب عليها عندما يرتفع سعر سلعة مرتبطة بها ارتباطا وثيقا» — ArabTerm"
          source: "ArabTerm"
          addition: "دلالة اقتصادية تخصصية (السلعة المكملة)"

    - lemma: "حشو"
      confirm:
        - text: "«(الحشو) مَا يحشى بِهِ الشَّيْء» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«ما يُجْعَلُ في الوسادة ونَحْوها من قُطْنٍ ونَحْوه مِلْءُ الشيء» — المعجم الكبير"
          source: "المعجم الكبير"
      expands:
        - text: "«من الكلام: فَضْلُه الذى لا يُعْتَمَدُ عليه» — المعجم الكبير"
          source: "المعجم الكبير"
          addition: "الدلالة المجازية للزيادة غير المفيدة في الكلام"
        - text: "«من النَّاسِ: صِغارُهم لا كبار فيهم رُذَالُهُمْ» — المعجم الكبير"
          source: "المعجم الكبير"
          addition: "دلالة اجتماعية للرذالة أو الصغار"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تتمة"
      source_section: "step1_headword_lookup"
      evidence_citation: "«(التَّتِمَّة) مَا يكون بِهِ تَمام الشَّيْء» — المعجم الوسيط"
      justification: "مرادف دقيق لـ «تكملة» ومعبر عن جوهر التعريف (إكمال الكل)."
    - lemma: "حشوة"
      source_section: "step1_headword_lookup"
      evidence_citation: "« wood pannel: زخرفة في الخشب أو القطع، اسْتُخْدِمَتْ على نطاق واسع في العصور الإسلامية لملء الفراغات المِعْمارية» — المعجم الكبير"
      justification: "الاسم العيني لما يُستخدم للملء (filler)، وهو أكثر دقة في التعبير عن المادة أو الشيء الفيزيائي المضاف."
  knowledge_candidates:
    - lemma: "مالئ"
      justification: "آلية التوليد: اشتقاق (اسم فاعل من ملأ). يُستخدم في السياقات التقنية (مثل مالئ الأسفلت) للتعبير عن المادة المضافة لملء الفراغات."
  generation_notes: "التعريف يركز على الوظيفة (الإكمال/الملء)، مما يجعل المشتقات من جذور 'ك-م-ل' و'ح-ش-و' و'ت-م-م' هي الأقوى دلالياً."

