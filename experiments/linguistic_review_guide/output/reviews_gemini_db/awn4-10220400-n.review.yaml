      nuance_differentiation: "تركز على المكانة والاعتبار الاجتماعي أو الوظيفي (مثل المناصب العليا) بغض النظر عن التأثير الفعلي."
      example: "استقبل المطار شخصية هامة وسط إجراءات أمنية مشددة."

    - lemma: "شخصية بارزة"
      source: step05
      decision: confirmed
      decision_reason: "مركب وصفي مستقر في اللغة المعاصرة ويقابل بدقة المفهوم الإنجليزي (personage/figure)."
      step05_citation: "«شخصية بارزة one of the great figures of this age» — المورد الحديث"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على الشهرة والظهور والبروز في مجتمع أو مجال معين."
      example: "كان من بين الحضور شخصية بارزة في مجال الأدب."
