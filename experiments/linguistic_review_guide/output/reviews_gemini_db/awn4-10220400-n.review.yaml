step0_evidence:
  per_lemma:
    - lemma: "شخصية مؤثرة"
      evidence_status: "no_material_found"
    - lemma: "شخصية هامة"
      expands:
        - text: "«قاعة في المطار مخصصة لاستقبال الشخصيات الهامة» — المعجم الموحد لمصطلحات النقل (2010)"
          addition: "إثبات ورود المركب بصيغة الجمع للدلالة على فئة معينة من الناس."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "شخصية بارزة"
      source_section: "step5_english_bridge"
      evidence_citation: "«شخصية بارزة one of the great figures of this age» — المورد الحديث (2008)"
      justification: "تركيب: مركب وصفي ثابت. وردت مرادفاً للكلمة الإنجليزية figure و personage في سياق الشخصيات، وهي مركب وصفي واسع الانتشار للمفهوم."
    - lemma: "قطب"
      source_section: "step4_fts_keyword"
      evidence_citation: "«القُطْب: شخصٌ عظيم الشأن» — المورد الحديث (2008)"
      justification: "مجاز (إزاحة دلالية): استعارة القطب الذي تدور حوله الرحى وإطلاقها على الشخص المحوري ذي النفوذ الواسع."
    - lemma: "شخص عظيم الشأن"
      source_section: "step5_english_bridge"
      evidence_citation: "«شخص عظيم الشّأن. VIP» — المورد الحديث (2008)"
      justification: "تركيب: عبارة تصف المفهوم بدقة ووردت كترجمة للمختصر VIP."
  knowledge_candidates:
    - lemma: "وجيه"
      justification: "مجاز: أُطلقت صفة الوجاهة على من له قدر ومكانة في قومه، وهو ما يتلاقى مع مفهوم الشخصية المؤثرة أو الهامة."
  generation_notes: "تم استخراج مرادفات تؤدي نفس وظيفة المفهوم في سياقات مختلفة، فبعضها يركز على الشهرة (شخصية بارزة)، وبعضها على النفوذ (قطب)."

step1_lemma_validation:
  per_lemma:
    - lemma: "شخصية مؤثرة"
      decision: confirmed
      decision_reason: "مركب وصفي شائع ومستقر في الاستعمال المعاصر للتعبير عن الشخصيات العامة ذات النفوذ."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على الأثر الفعلي والقدرة على تغيير مجرى الأحداث والتأثير في محيطها."
      example: "لعبت شخصية مؤثرة في الحكومة دوراً حاسماً في تمرير القرار."
    
    - lemma: "شخصية هامة"
      decision: confirmed
      decision_reason: "مصطلح معاصر ثابت يقابل الاختصار VIP في الاستعمالات الرسمية والإعلامية."
