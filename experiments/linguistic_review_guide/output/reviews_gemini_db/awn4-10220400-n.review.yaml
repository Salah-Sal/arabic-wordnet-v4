            synset_id: "awn4-10220400-n"

    - lemma: "شخص عظيم الشأن"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر (شخص + صفة) وليس مصطلحاً مسكوكاً."
      step05_citation: "«شخص عظيم الشّأن. VIP» — المورد الحديث (2008)"

    - lemma: "وجيه"
      source: step05
      decision: confirmed
      decision_reason: "لفظ عربي فصيح يدل على من له وجاهة وقدر، يتقاطع بقوة مع مفهوم الشخصية الهامة."
      step05_citation: "«وجيه ج. وجهاء: figure» — مسرد الإعلام والتواصل، موقع ArabTerm"
