            entry_id: "{auto}"
            synset_id: "awn4-10220400-n"

    - lemma: "قطب"
      source: step05
      decision: confirmed
      decision_reason: "لفظ عربي فصيح يستخدم مجازاً للدلالة على الشخص المحوري ذي النفوذ، وهو موثق معجمياً."
      step05_citation: "«القُطْب: شخصٌ عظيم الشأن» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تشير إلى شخصية محورية ومركزية ذات نفوذ واسع غالباً في مجال محدد (قطب سياسي، قطب اقتصادي)."
      example: "اجتمع قطب من أقطاب المعارضة مع رئيس الحكومة لمناقشة الأزمة."
