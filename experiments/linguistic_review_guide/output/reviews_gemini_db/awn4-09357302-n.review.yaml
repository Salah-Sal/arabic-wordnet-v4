      justification: "اشتقاق: وجه الأرض والمرتفع منها، ويُستخدم للدلالة على السطح الصلب المتاح للاستعمال (كالتيمم)"
  generation_notes: "التعريف يركز على الحالة الفيزيائية (الصلابة) والموقع (السطح)؛ اللمات المقترحة تغطي الجانب العلمي والجانب الوصفي التراثي"

