      nuance_differentiation: "تركز على خاصية الجفاف (الصلابة وعدم الرطوبة) وغالباً ما تُستخدم في سياق التقسيم الجغرافي لسطح الأرض (يابسة وماء)"
      example: "تغطي اليابسة حوالي ثلاثين بالمئة من مساحة سطح الأرض"

    - lemma: "صعيد"
      source: step05
      decision: confirmed
      decision_reason: "مرادف فصيح يصف وجه الأرض وسطحها الصلب"
      step05_citation: "«الصعيد: وجه الأرض تراباً كان أو غيره» — التعريفات الفقهية للبركتي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يخص وجه الأرض الظاهر المرتفع، وله دلالة شرعية مرتبطة بالسطح الطاهر"
      example: "ضرب بيده على صعيد الأرض ليؤدي تيممه"
