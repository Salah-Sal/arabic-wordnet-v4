      nuance_differentiation: "غالباً ما يُستخدم في سياق التنقل والترحال (البر والبحر)، ويوحي بالاتساع"
      example: "سافر القوم في البر لعدة أيام قبل الوصول إلى الشاطئ"

    - lemma: "يابسة"
      decision: confirmed
      decision_reason: "تدل على الجزء الجاف من الأرض، وهي مقابلة للماء، ومستخدمة كمصطلح جغرافي"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
