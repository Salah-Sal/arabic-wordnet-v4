step0_evidence:
  per_lemma:
    - lemma: "أرض"
      confirm:
        - text: "«الأرض: التي نحن عليها، وتجمع أرضين»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«سطح الأرض الصلب، قد يكون مغطى بماء (قاع البحر) أو نبات»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«كل ما سفل فهو أرض»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          addition: "تعميم المفهوم ليشمل كل ما هو تحت (كقوائم الدابة)"

    - lemma: "بر"
      confirm:
        - text: "«البَرُّ: خِلاَفُ البَحْرِ»"
          source: "المحيط في اللغة للصاحب بن عباد"
        - text: "«البَرُّ خلاف البحر، وتصوّر منه التوسع فاشتق منه البِرُّ»"
          source: "مفردات الراغب الأصفهاني"

    - lemma: "يابسة"
      confirm:
        - text: "«اليابسة: البر»"
          source: "مقاييس اللغة (ضمن سياق يبس)"
        - text: "«مكانٌ يَبَسٌ: كان فيه ماءٌ فذهب»"
          source: "المعجم الوسيط"

