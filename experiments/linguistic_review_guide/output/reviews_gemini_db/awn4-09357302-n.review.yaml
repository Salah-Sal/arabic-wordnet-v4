      example: "يعيش الإنسان على كوكب الأرض ويمشي على سطحها"

    - lemma: "بر"
      decision: confirmed
      decision_reason: "مصطلح مستقر تقابلاً مع البحر، شائع الاستعمال في النصوص التراثية والحديثة"
