  current_definition: "شخص يفتقر إلى معرفة الشر"
  assessment:
    decision: revise
    reason: "التعريف الحالي ترجمة حرفية من الإنجليزية. يجب إعادة صياغته بأسلوب معجمي عربي سليم يغطي مفهوم الافتقار للحنكة ومعرفة الشرور."
  authored_definitions:
    - type: terminological
      text: "شخص بسيط يفتقر إلى الحنكة والتجربة ومعرفة مكامن الشر ومكائد الناس."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
