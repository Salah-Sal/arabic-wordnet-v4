step0_evidence:
  per_lemma:
    - lemma: "بريء"
      confirm:
        - text: "«بَرِىّ (pl. أَبْرِيَآء) a. Free, exempt; innocent.»"
          source: "حبيب سالمون، قاموس عربي انجليزي متقدم للمتعلمين"
      expands:
        - text: "«البَرِيء: الخالص الخالي خلاف المذنب والمتهم.»"
          source: "التعريفات الفقهيّة للبركتي"
    - lemma: "قليل الخبرة"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "غِرّ"
      source_section: "step5_english_bridge"
      evidence_citation: "«الغِرُّ: الذي لم يجرب الأمور مع حداثة السن، وهو كالغَمْرِ» — كتاب العين للخليل بن أحمد الفراهيدي"
      justification: "لفظ تراثي دقيق يعبر عن افتقار الشخص لمعرفة الشر والتجارب الدنيوية، مما يجعله حسن النية وقابلاً للانخداع. آلية التوليد: الاستدعاء التراثي للمعنى المجازي."
  knowledge_candidates:
    - lemma: "ساذج"
      justification: "مصطلح معاصر يستخدم بكثرة للدلالة على بساطة التفكير والافتقار إلى الحنكة ومعرفة مكامن الشر. آلية التوليد: التعريب (من الفارسية: ساده) والاشتقاق الدلالي."

step1_lemma_validation:
  per_lemma:
    - lemma: "بريء"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع ومطابق للمفهوم، لاسيما في سياق الطهارة من الشر."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُركز على صفاء النية وخلو القلب من السوء والذنب."
      example: "بقي الطفل بريئاً لم تلوثه قسوة الحياة."
      actions: []

    - lemma: "قليل الخبرة"
      decision: removed
      decision_reason: "تركيب وصفي حر وليس وحدة معجمية مسكوكة. يفشل في اختبار السك المصطلحي حيث يمكن الاستعاضة عنه بـ 'عديم الخبرة' أو 'ضعيف الخبرة'."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "وصف عام لافتقار التجربة العملية، ولا يرتبط بالضرورة بالبراءة والافتقار إلى معرفة الشر كسمة شخصية."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غِرّ"
      source: step05
      decision: confirmed
      decision_reason: "لفظ تراثي فصيح ومطابق تماماً للمفهوم؛ فهو من لم يجرب الأمور ولا يعرف الشر."
      step05_citation: "«الغِرُّ: الذي لم يجرب الأمور مع حداثة السن، وهو كالغَمْرِ» — كتاب العين للخليل بن أحمد الفراهيدي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص بالدلالة على نقص التجربة الحياتية والانخداع بسهولة لعدم معرفة الشر."
      example: "كان في شبابه غِرّاً يثق بكل من يبتسم له."
      actions:
        - command: create_entry
          params:
            lemma: "غِرّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09644529-n"

    - lemma: "ساذج"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مستقر وشائع في الاستعمال المعاصر للتعبير عن البراءة المفرطة والافتقار إلى الحنكة."
      step05_citation: "«ساذج؛ بسيط. naiveness» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُشير إلى بساطة التفكير المفرطة التي قد تصل إلى حد الغفلة والجهل بالشرور."
      example: "من الخطر أن تكون ساذجاً في بيئة العمل التنافسية."
      actions:
        - command: create_entry
          params:
            lemma: "ساذج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09644529-n"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "غِرّ"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "ساذج"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

