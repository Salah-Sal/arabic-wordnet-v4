step0_evidence:
  per_lemma:
    - lemma: "بشرية"
      confirm:
        - text: "«human kind»"
          source: "مسرد الفلسفة وعلم النفس"
      expands:
        - text: "«الفَصيلة البَشَرِيَّة (Hominidae): فصيلة من رتبة الرئيسيات»"
          source: "المعجم الكبير"
          addition: "يستخدم في التصنيف الأحيائي كفصيلة."
      peripheral_observations:
        - observation: "طائفة بشر بن المعتمر من المعتزلة"
          source: "القاموس المحيط"
          note: "معنى تاريخي مستقل تماماً لا علاقة له بالمفهوم."

    - lemma: "جنس بشري"
      confirm:
        - text: "«mankind»"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "عالم"
      confirm:
        - text: "«الخلْق كلُّه, وقيل: كلُّ ما حواه بطنُ الفلك كلُّ صنف من أصناف الخلق, كعالم الحيوان, وعالم النبات»"
          source: "المعجم الوسيط"
        - text: "«world»"
          source: "مسرد الفلسفة وعلم النفس"
      expands:
        - text: "«مجموعة الناس الممثَّلين في العيِّنة»"
          source: "مسرد الإعلام والتواصل"
          addition: "استخدام اللفظ للدلالة على مجموعة من الناس."

step05_lemma_generation:
