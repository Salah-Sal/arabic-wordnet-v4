      justification: "ترجمة مباشرة ودقيقة لمفهوم 'humanity' الذي يشير إلى مجموع البشر."
    - lemma: "بشر"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الإنسان الواحد رجلا كان أو امرأة لا يثنى ولا يجمع» — كتاب العين"
      justification: "كلمة تطلق على الجنس البشري بأسره، وهي أصل اشتقاق كلمة بشرية."
  knowledge_candidates:
    - lemma: "بنو آدم"
      justification: "تركيب إضافي يُستخدم بشكل واسع في العربية للتعبير عن الجنس البشري ككل نسبةً إلى أصلهم المشترك."
    - lemma: "بنو الإنسان"
      justification: "تركيب إضافي مرادف يُعبر عن مجموع البشر."

