step0_evidence:
  per_lemma:
    - lemma: "مؤيد"
      confirm:
        - text: "«(1) فا support. وبخاصة: المؤيِّد؛ النَّصير؛ المُعِيل» — المورد الحديث (2008)"
      expands:
        - text: "«potentiator» — المعجم الطبي الموحد (2009)"
    - lemma: "مدافع"
      confirm:
        - text: "«(1) الحامي؛ المُدافع» — المورد الحديث (2008)"
        - text: "«من (د ف ع) مزيل الشيء بقوة، والمزاحم والذائد عن عِرْضه وأرضه وماله.» — موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«defendant» — المعجم الطبي الموحد (2009)"
    - lemma: "مناصر"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "اللمة فصيحة ومستعملة جداً كاسم فاعل من الفعل (ناصر)، وتعني النصير والمؤيد."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نصير"
      source_section: "step4_fts_keyword"
      evidence_citation: "«من (ن ص ر) الكثير العون والتأييد لغيره من الناس.» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "كلمة فصيحة قوية الدلالة على التأييد والمناصرة، ووردت كمرادف لـ advocate و supporter."
    - lemma: "محام"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(1) محام» — المورد الحديث (2008)"
      justification: "وردت كترجمة لـ advocate، لكنها تستعمل مجازاً للدلالة على المدافع عن فكرة."
  knowledge_candidates:
    - lemma: "داع"
      justification: "اشتقاق (اسم فاعل من الفعل دعا): الداعي إلى الفكرة هو الذي يطرحها ويدافع عنها، وهو ما يطابق proponent و exponent."

step1_lemma_validation:
  per_lemma:
    - lemma: "مؤيد"
      decision: confirmed
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على إظهار الدعم والموافقة لفكرة أو قضية."
      example: "كان من أبرز المؤيدين لهذه المبادرة الإصلاحية."
      actions: []
    - lemma: "مدافع"
      decision: confirmed
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على الحماية ودفع الهجوم أو الانتقاد عن القضية أو الفكرة."
      example: "وقف مدافعاً شرساً عن حقوق العمال في المحافل الدولية."
      actions: []
    - lemma: "مناصر"
      decision: confirmed
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على الانضمام والوقوف في صف صاحب القضية أو الفكرة ومؤازرته."
      example: "تجمع المناصرون للقضية أمام مقر البرلمان."
      actions: []
    - lemma: "نصير"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل بكثرة في السياقات التي تتطلب قوة في التأييد والدعم."
      step05_citation: "«من (ن ص ر) الكثير العون والتأييد لغيره من الناس.» — موسوعة السلطان قابوس لأسماء العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "صيغة مبالغة (فعيل) تدل على ثبات واستمرار النصرة والتأييد."
      example: "عُرف بكونه نصيراً للضعفاء والمظلومين طوال حياته."
      actions:
        - command: create_entry
          params:
            lemma: "نصير"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09794206-n"
    - lemma: "محام"
      source: step05
      decision: removed
      decision_reason: "دلالتها الأساسية قانونية بحتة (الذي يترافع في المحاكم)، واستعمالها بمعنى المدافع عن فكرة هو استعمال مجازي واستعارة من اللغات الأجنبية (مثل محامي الشيطان)."
      step05_citation: "«(1) محام» — المورد الحديث (2008)"
    - lemma: "داع"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح ودقيق يعبر عن من يطرح فكرة ويدعو إليها (proponent)."
      step05_citation: "المعرفة اللغوية (اشتقاق اسم فاعل)."
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على المبادرة في الطرح والتبشير بالفكرة ونشرها، وتقابل propounder."
      example: "كان من أوائل الداعين إلى تبني مصادر الطاقة المتجددة."
      actions:
        - command: create_entry
          params:
            lemma: "داع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09794206-n"
  added_lemmas:
    - lemma: "نصير"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "داع"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

step3_definition:
  assessment:
    decision: retain
    reason: "التعريف دقيق وشامل ومصاغ بأسلوب فصيح، ويغطي كلا الجانبين (الدفاع عن قضية advocate) و(طرح الفكرة proponent)."

