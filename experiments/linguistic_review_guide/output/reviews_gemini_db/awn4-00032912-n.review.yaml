step0_evidence:
  per_lemma:
    - lemma: "حِيَازَة"
      confirm:
        - text: "حيازة الرجل: ما في حَوْزَتِه من مال أو عقار"
          source: "المعجم الوسيط"
        - text: "حيازةُ الشيء: ما ضمَّه الإنسانُ إلى نَفْسِه من مالٍ أو غيره"
          source: "المعجم الكبير"
        - text: "(الْحِيَازَة) حِيَازَة الرجل مَا فِي حوزته من مَال أَو عقار وَالْأَرْض الزراعية"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "مِلْكِيَّة"
      confirm:
        - text: "الملكية الخاصة: ما يملكه الفرد"
          source: "المعجم الوسيط"
        - text: "(الملكية الْخَاصَّة) مَا يملكهُ الْفَرد و (الملكية الْعَامَّة) مَا تملكه الدولة"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "المِلْكُ أو التمليك. يقال: بيدى عَقْد مِلكيّة هذه الأرض"
          source: "المعجم الوسيط"
          addition: "يدل على حالة التملك والعقد أكثر من دلالته على الشيء المادي المملوك نفسه، وإن كان ينسحب عليه مجازاً"

