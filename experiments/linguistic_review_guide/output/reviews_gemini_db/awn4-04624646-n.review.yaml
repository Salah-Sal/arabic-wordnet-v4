step0_evidence:
  per_lemma:
    - lemma: "أمر"
      confirm:
        - text: "«الأَمْرُ: الحادِثَةُ، ج: أُمورٌ»"
          source: "القاموس المحيط"
        - text: "«الأَمْرُ: واحدُ الأُمورِ»"
          source: "الصحاح في اللغة"
        - text: "«الأَمْرُ مِنَ الْأُمُورِ»"
          source: "مقاييس اللغة"
        - text: "«الأَمْرُ الحادِثَةُ والجَمعُ أُمورٌ»"
          source: "لسان العرب"
        - text: "«(5) «ب» أمر»"
          source: "المورد الحديث"
    - lemma: "شيء"
      confirm:
        - text: "«شَيْء (pl. أَشْيَآء) a. Thing; something. b. Affair, matter.»"
          source: "Steingass Dictionary"
        - text: "«(5) «أ» شيء»"
          source: "المورد الحديث"
      expands:
        - text: "«thing-in-itself = noumenon»"
          source: "المورد الحديث"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "كيان"
      source_section: "step4_fts_keyword"
      evidence_citation: "«حقيقة الشيء أو وجوده المستقل» — معجم المصطلحات الطبية"
      justification: "اللفظ الأكثر دقة للتعبير عن 'الوجود المستقل' المذكور في التعريف، وهو مستعمل بكثرة في المصطلحات الحديثة (Entity)."
    - lemma: "ذات"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الذَّات: النَّفس والشَّخص... حقيقة الموجود ومقوّماته، ويقابلها العرض» — المعجم الكبير"
      justification: "مصطلح أصيل في الفلسفة وعلم الكلام للدلالة على المفهوم الذي له وجود مستقل بذاته ولا يحتاج لغيره ليقوم به، بخلاف 'الصفة' أو 'العرض'."
  knowledge_candidates:
    - lemma: "موجود"
      justification: "بآلية الاشتقاق (اسم مفعول من وجد)، للدلالة على كل ما له تحقق في الواقع."
  generation_notes: "ركزت العملية على البحث عن مصطلحات تعبر عن 'الاستقلال الوجودي' للصفة، مما أدى لاكتشاف 'كيان' و'ذات' في القواميس المتخصصة والفلسفية."

step1_lemma_validation:
  per_lemma:
    - lemma: "أمر"
      decision: confirmed
      decision_reason: "لفظ عام وشائع الاستعمال للدلالة على الحادثة أو الشأن، وهو مرادف معجمي مستقر لكلمة thing."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركز 'أمر' على الجانب الحدثي أو الشأن الملموس (Affair/Matter)، وغالباً ما يُجمع على 'أمور' للإشارة إلى الشؤون العامة."
      example: "هذا أمرٌ عجيبٌ لم أسمع بمثله من قبل."
    - lemma: "شيء"
      decision: confirmed
      decision_reason: "أعمّ كلمة في اللغة العربية للدلالة على الموجود أو المتصور، وهي الترجمة المباشرة للفظ thing."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "هو اللفظ الأكثر تجريداً وشمولاً، ويُستعمل للدلالة على أي وحدة وجودية سواء كانت مادية أو معنوية."
      example: "لا يوجد شيءٌ مستحيلٌ أمام الإصرار والعزيمة."
    - lemma: "كيان"
      source: step05
      decision: confirmed
      decision_reason: "يتطابق تماماً مع وصف 'الوجود المستقل' الوارد في التعريف، وهو مصطلح مستقر في العلوم الحديثة."
      step05_citation: "«حقيقة الشيء أو وجوده المستقل» — معجم المصطلحات الطبية"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُؤكد 'كيان' على الوحدة البنائية أو الوجودية المستقلة (Entity)، وغالباً ما يُستخدم للمفاهيم التي لها هوية متميزة."
      example: "يُعامل كل قسم في الشركة ككيانٍ ماليٍّ مستقل."
      actions:
        - command: create_entry
          params:
            lemma: "كيان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04624646-n"
    - lemma: "ذات"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فني دقيق في التراث الفلسفي واللغوي العربي للتعبير عن الشيء في نفسه مقابل صفاته."
      step05_citation: "«الذَّات: النَّفس والشَّخص... حقيقة الموجود ومقوّماته، ويقابلها العرض» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُشير 'الذات' إلى الجوهر أو الماهية التي تقوم بنفسها (Essence/Self)، وتُستخدم للتمييز بين الشيء وعوارضه."
      example: "الذَّاتُ الإلهيَّةُ منزَّهةٌ عن التَّشبيهِ والتَّمثيلِ."
      actions:
        - command: create_entry
          params:
            lemma: "ذات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04624646-n"

step3_definition:
  definition_review_flag: true
  current_definition: "أي سمة أو صفة تعتبر ذات وجود مستقل"
  assessment:
    decision: revise
    reason: "التعريف الحالي يميل للغموض الفلسفي؛ يفضل صياغة أكثر شمولاً تعكس الطبيعة المعجمية للفظ 'شيء' و'كيان'."
  authored_definitions:
    - type: terminological
      text: "كلُّ ما لهُ حقيقةٌ عينيَّةٌ أو ذهنيَّةٌ، ويُمكنُ الإشارةُ إليهِ أو التَّفكيرُ فيهِ بوصفِهِ وحْدَةً مستقلَّة."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-04624646-n"
        definition_index: 0
        text: "كلُّ ما لهُ حقيقةٌ عينيَّةٌ أو ذهنيَّةٌ، ويُمكنُ الإشارةُ إليهِ أو التَّفكيرُ فيهِ بوصفِهِ وحْدَةً مستقلَّة."

