step0_evidence:
  per_lemma:
    - lemma: "مُرَحِّب"
      evidence_status: "no_material_found"
    - lemma: "مُسْتَقْبِل"
      contradicts:
        - text: "«المستقبل: ما يترقب وجوده بعد الزمن الحاضر سمي به لأن الزمان يستقبله.» — التوقيف على مهمات التعاريف للمناوي"
        - text: "«المستقبل زمن يكون اللفظ ليعبر عن لحظة بعد الوقت الحاضر...» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«جهاز أو نظام يستعمل لتلقي المعطيات ويقابله الباث أو المرسل في تراسل المعطيات» — المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
        - text: "«منطقة صغيرة تتلقى التنبيه المناسب والنوعيّ وتستجيب لتأثيره.» — المعجم الموحد لمصطلحات علم الصيدلة (2009)"

step05_lemma_generation:
  knowledge_candidates:
    - lemma: "مُحَيٍّ"
      justification: "اشتقاق: اسم فاعل من الفعل (حيّا)، يعبر عن الشخص الذي يلقي التحية، ويقابل المصطلح الإنجليزي (saluter)."
    - lemma: "مُسْتَقْبِل الضُّيُوف"
      justification: "تركيب إضافي: تعبير شائع يستخدم للدلالة على الشخص المكلّف بالاستقبال والترحيب في المناسبات أو الفنادق."
  generation_notes: "تم الاعتماد على الاشتقاق من الجذور المتعلقة بالتحية والسلام وتوليد مركب إضافي شائع."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُرَحِّب"
      decision: confirmed
      decision_reason: "اسم فاعل قياسي من (رَحَّبَ)، وهو مستعمل وصحيح للدلالة على من يقوم بالترحيب، رغم عدم وروده كمدخل مستقل في المعاجم القديمة."
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مُرَحِّب: يركز على إظهار السرور والحفاوة بالقول أو الفعل عند لقاء القادمين."
      example: "وقف المُرَحِّبُ عند باب القاعة لاستقبال المدعوين بابتسامة."

    - lemma: "مُسْتَقْبِل"
      decision: confirmed
      decision_reason: "صيغة فصيحة ومستعملة (اسم فاعل من استقبل) للدلالة على من يتلقى القادمين، وهي أقرب للسياق الرسمي أو الوظيفي."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مُسْتَقْبِل: يركز على الحضور والتواجد لتلقي الشخص القادم وتوجيهه، وقد يترافق مع الترحيب."
      example: "كان مُسْتَقْبِلُ الوفد في المطار شخصية دبلوماسية بارزة."

    - lemma: "مُحَيٍّ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح وملائم لمقابلة (saluter)، يدل على من يلقي التحية."
      step05_citation: "مستنتج من المعرفة اللغوية بالاشتقاق من (حَيَّا)."
      substitution_test:
        result: "pass"
      nuance_differentiation: "مُحَيٍّ: يركز على الفعل اللفظي أو الحركي لإلقاء التحية وتأدية السلام."
      example: "كان المُحَيِّي يقف على المنصة لرد السلام على الحشود المتجمعة."
      actions:
        - command: create_entry
          params:
            lemma: "مُحَيٍّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10166447-n"

    - lemma: "مُسْتَقْبِل الضُّيُوف"
      source: step05
      decision: removed
      decision_reason: "تركيب إضافي وصفي حر وليس وحدة مصطلحية مسكوكة معجمياً، كما أن دلالته تتحقق بكلمة (مستقبل) وحدها في هذا السياق."
      step05_citation: "مستنتج من المعرفة اللغوية بالتركيب."

  added_lemmas:
