  current_definition: "أي شخص يكون في صفك"
  assessment:
    decision: revise
    reason: "التعريف الحالي أشبه بترجمة حرفية عامية وتركيبه ركيك. تمت صياغة تعريف لغوي أدق يعبر عن الوقوف إلى جانب الشخص."
  authored_definitions:
    - type: linguistic
      text: "مَن يُناصرك ويقف إلى جانبك مُؤَيِّداً ومُعِيناً"
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
