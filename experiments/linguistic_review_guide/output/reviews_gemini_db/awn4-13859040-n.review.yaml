step0_evidence:
  per_lemma:
    - lemma: "عَلَاقَة تِجَارِيَّة"
      confirm:
        - text: "«علاقات تجارية: commercial relations / trade relations»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
      expands:
        - text: "«شؤون. وبخاصة: شؤون تجارية أو مهنية أو عامة»"
          source: "المورد الحديث"
          addition: "يضيف معنى الشؤون التجارية العامة التي تندرج تحتها علاقات المؤسسات."
    - lemma: "عَلَاقَة عَمَل"
      contradicts:
        - text: "«علاقة شغل، علاقة عمل: العلاقة التي تنشأ بين المشغل والأجير بمقتضى عقد الشغل أو العمل.»"
          source: "المعجم الموحد لمصطلحات القانون"
          conflict: "تدل على علاقة التوظيف بين المشغل والأجير (Employment/Labor Relation)، بينما تعبر المجموعة الترادفية عن العلاقة بين مؤسسات تجارية (Business Relation)."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عَلَاقَة أَعْمَال"
      source_section: "step5_english_bridge"
      evidence_citation: "«business: تجارة؛ أعمال» — المورد الحديث"
      justification: "تركيب إضافي يعكس الترجمة الدقيقة لمصطلح (business relation) مع تخصيص (الأعمال) بالمعنى التجاري للمؤسسات."
  knowledge_candidates:
    - lemma: "رَابِطَة تِجَارِيَّة"
      justification: "تركيب وصفي يعبر عن الارتباط التجاري بين المؤسسات، ويمكن استخدامه مرادفاً لـ (علاقة تجارية)."
  generation_notes: "تم استبعاد (علاقة عمل) لأنها تُحيل إلى قوانين الشغل، واقتُرحت تراكيب تركز على جانب الأعمال والتجارة."

step1_lemma_validation:
  per_lemma:
    - lemma: "عَلَاقَة تِجَارِيَّة"
      decision: confirmed
      decision_reason: "مصطلح دقيق (مركب وصفي) ومستعمل للتعبير عن العلاقات البينية للشركات."
      evidence_assessment:
        case: "confirm"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير عام وشائع يركز على طبيعة العلاقة المرتبطة بتبادل المنافع التجارية بين الأطراف أو المؤسسات."
      example: "عقدت الشركتان علاقة تجارية تهدف إلى توسيع نطاق المبيعات."
    - lemma: "عَلَاقَة عَمَل"
      decision: removed
      decision_reason: "مصطلح يشير في العرف القانوني والإداري إلى العلاقة بين المشغّل والأجير (Labor Relation) وليس بين مؤسسات تجارية."
      evidence_assessment:
        case: "contradicts_only"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "يخص التوظيف وقانون العمل وليس الشراكات التجارية."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "عَلَاقَة أَعْمَال"
      source: step05
      decision: confirmed
      decision_reason: "تركيب إضافي سليم وشائع في سياق المؤسسات والشركات لوصف علاقات العمل بين المؤسسات."
      step05_citation: "«business: تجارة؛ أعمال» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز عن العلاقة التجارية بأنه قد يشمل العلاقات التأسيسية والاستراتيجية (Business) التي تكون أوسع من التبادل المادي البحت للمنتجات (Commercial)."
      example: "تحرص المؤسسة على بناء علاقة أعمال متينة مع شركائها الإقليميين."
      actions:
        - command: create_entry
          params:
            lemma: "عَلَاقَة أَعْمَال"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13859040-n"
    - lemma: "رَابِطَة تِجَارِيَّة"
      source: step05
      decision: removed
      decision_reason: "رغم صحة التركيب، إلا أن (علاقة تجارية) و(علاقة أعمال) أشد شيوعاً ودقة في هذا السياق، و(رابطة) قد تحيل إلى كيان مؤسسي (Association) وليس علاقة مجردة."
      step05_citation: "اقتراح من المعرفة اللغوية"

  synset_flags:
    definition_review_needed: false
  added_lemmas:
    - lemma: "عَلَاقَة أَعْمَال"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

