step0_evidence:
  per_lemma:
    - lemma: "مثقف"
      confirm:
        - text: "«مُثَقَّف: متوسِّع، مُتبحِّر في الثقافة والمطالعة؛ أهل الفكر والثَّقافة الذين يشكّلون نخبة سياسيّة أو اجتماعيّة أو فنيَّة»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«(2) مُثقَّف»"
          source: "المورد الحديث (ترجمة لـ intellectual)"
      expands:
        - text: "«مُثقّفون: كَفاءة فهم وذكاء وقدرة إدراك مفهومي لجماعة تمتلك رُوح عصرها وتتعامل مع المعرفة وتنتجها مُؤكدة سُمو وظائفها»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "مفكر"
      confirm:
        - text: "«مُفَكِّر: من يعمل عقله في الأمر ويرتب بعض ما يعلم ليصل به إلى مجهول»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«المفكر: شخص مفكر... منهمك في نشاط يتطلب اصطناع العقل على نحو إبداعي»"
          source: "المورد الحديث"

step05_lemma_generation:
  knowledge_candidates:
    - lemma: "مستنير"
      justification: "لفظ يطلق على المثقف الواعي الذي ينشد التنوير والإصلاح، وهو قريب من المعنى الوظيفي للمثقف."
    - lemma: "عقلاني"
      justification: "يستخدم أحياناً لوصف الشخص الذي يعتمد العقل مرجعاً وحيداً، وهو من آلية الاشتقاق (المصدر الصناعي/النسبة)."

step1_lemma_validation:
  per_lemma:
    - lemma: "مثقف"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشائع جداً في العربية المعاصرة للدلالة على الـ intellectual، وموثق في المعاجم الحديثة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب التحصيلي والمعرفي والاجتماعي (الثقافة والاطلاع)."
      example: "يؤدي المثقف دوراً محورياً في توجيه الرأي العام ونشر الوعي."
    - lemma: "مفكر"
      decision: confirmed
      decision_reason: "مصطلح دقيق يركز على العمليات الذهنية وإنتاج الأفكار، وهو ترجمة دقيقة لـ thinker وintellectual."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب التحليلي والإنتاجي للذهن (إعمال الفكر والبحث عن المجهول)."
      example: "كرس المفكر حياته لدراسة التحولات الاجتماعية العميقة."
    - lemma: "مستنير"
      source: step05
      decision: removed
      decision_reason: "رغم قربه الدلالي، إلا أنه يعبر عن صفة (enlightened) أكثر من كونه اسماً للمهنة أو الدور الاجتماعي كالمثقف."
    - lemma: "عقلاني"
      source: step05
      decision: removed
      decision_reason: "يغلب عليه الجانب الوصفي أو المذهب الفلسفي (Rationalist) ولا يطابق المفهوم العام للمثقف في جميع السياقات."

step3_definition:
  definition_review_flag: false
  current_definition: "شخص يستخدم عقله بشكل إبداعي"
  assessment:
    decision: retain
    reason: "التعريف الحالي دقيق ومطابق للتعريف الإنجليزي ويغطي اللمتين المؤكدتين."

step4_relations:
