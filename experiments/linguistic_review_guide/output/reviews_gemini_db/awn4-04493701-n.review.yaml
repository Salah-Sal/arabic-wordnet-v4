          type: usage
          source: "مؤلَّف"
    - lemma: "شيء تافه"
      enrichment:
        root: "ت-ف-ه"
      examples:
        - text: "لا تغضب من أجل شيء تافه."
          type: usage
          source: "مؤلَّف"
    - lemma: "سفساف"
      enrichment:
        root: "س-ف-س-ف"
      examples:
        - text: "«إنَّ اللهَ تَعَالَى يُحِبُّ مَعَالِيَ الأُمُورِ وأَشرافَهَا، ويَكْرَهُ سَفْسَافَهَا»"
          type: hadith
          source: "الطبراني في الكبير"
      pos_check:
