    - lemma: "مُتَبَجِّح"
      source: "step05"
      decision: "confirmed"
      decision_reason: "تعبير دقيق يعكس الجرأة الممزوجة بالافتخار بالباطل والصلف"
      step05_citation: "توليد بالاشتقاق من المعرفة اللغوية"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تضيف إلى الوقاحة معنى التباهي والافتخار بالسلوك الجريء الخاطئ."
      example: "تحدث اللص المتبجح عن جرائمه وكأنها إنجازات يفتخر بها."
