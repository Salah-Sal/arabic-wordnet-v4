step0_evidence:
  per_lemma:
    - lemma: "جَرِيء"
      confirm:
        - text: "«جرُؤ على الأمر: أقدم عليه ... فهو جريء»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«والجرئ: المقدام، تقول منه: جرؤ الرجل جراءة»"
          source: "تاج اللغة وصِحاح العربية"
      expands:
        - text: "«الجرئ: المقدام»"
          source: "تاج اللغة وصِحاح العربية"
          addition: "المعجم يركز على الإقدام والشجاعة المطلقة، بينما تعريف المجموعة يربطه بالجرأة الزائدة أو الوقاحة"
    - lemma: "وَقِح"
      confirm:
        - text: "«وقُح الشخص: قل حياؤه واجترأ على فعل القبائح ولم يعبأ بها»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«الرجل قل حياؤه واجترأ على اقتراف القبائح ولم يعبأ بها فهو وقح»"
          source: "المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "صَفِيق"
      source_section: "step5_english_bridge"
      evidence_citation: "«وقاحة؛ صفاقة. — impudence» — المورد الحديث"
      justification: "كلمة 'صفاقة' وردت كمقابل لـ impudence في جسر اللغة الإنجليزية، و'صفيق' هو وصف مشتق يدل على قلة الحياء وغلظة الوجه، وهو مرادف دقيق لـ 'وقح' ومناسب للمجموعة."
  knowledge_candidates:
    - lemma: "مُتَبَجِّح"
      justification: "توليد بالاشتقاق: اسم فاعل من الجذر ب-ج-ح. يدل على التباهي والوقاحة والجرأة في الباطل، وهو يغطي بدقة دلالة chutzpanik الإنجليزية (الوقاحة المصحوبة بالغرور والصلف)."
  generation_notes: "المفهوم الإنجليزي chutzpanik يجمع بين الجرأة، الوقاحة، والصلف. اللغة العربية غنية بالصفات المشبهة وأسماء الفاعلين التي تعبر عن هذه الدلالات مثل: وقح، صفيق، متبجح."

step1_lemma_validation:
  per_lemma:
    - lemma: "جَرِيء"
      decision: "confirmed"
      decision_reason: "أدلة مؤكدة؛ تعبر عن الجرأة والإقدام وتمثل الشق الأول من التعريف"
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على الإقدام والشجاعة المطلقة وعدم التردد، وقد تحمل دلالة إيجابية محمودة خلافا لـ 'وقح' التي هي سلبية دائما."
      example: "واجه الصحفي الجريء المسؤولين بأسئلة صريحة."
    - lemma: "وَقِح"
      decision: "confirmed"
      decision_reason: "أدلة مؤكدة تتطابق تماما مع الشق الثاني من التعريف (الوقاحة)"
