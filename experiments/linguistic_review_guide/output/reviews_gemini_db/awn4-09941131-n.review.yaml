        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على قلة الحياء والاجتراء على المعايب، وتحمل دلالة سلبية محضة."
      example: "تطاول الرجل الوقح على جيرانه بألفاظ نابية."
    - lemma: "صَفِيق"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مرادف دقيق ومستقر لـ 'وقح' وشائع في الاستعمال للتعبير عن قلة الحياء والتبلد تجاه النقد"
      step05_citation: "«وقاحة؛ صفاقة. — impudence» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تشير إلى تبلد الإحساس وقلة الحياء (من صلافة الوجه) مما يجعله لا يبالي باللوم."
      example: "رد الموظف الصفيق على الانتقادات الموجهة إليه ببرود تام."
