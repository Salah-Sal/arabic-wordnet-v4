step0_evidence:
  per_lemma:
    - lemma: "أَمِين صُنْدُوق"
      confirm:
        - text: "«من تعهد إليه المعاملات المالية في مؤسسة ما» — معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«أمين الصندوق: cashier» — المعجم الموحد لمصطلحات التجارة والمحاسبة"
      expands:
        - text: "«شيك أمين الصندوق: شيك يحرّره البنك على نفسه ويوقّعُهُ أمين صندوقِهِ.» — المورد الحديث"
    - lemma: "صَرَّاف"
      confirm:
        - text: "«الصَّرَّافُ: مَن يتولَّى تسليمَ الرواتب لأصحابها (فى البنك): من يتولى تنفيذَ طلبات العملاء إيداعًا أو سَحْبًا» — المعجم الكبير"
        - text: "«صراف المطعم: restaurant cashier» — مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«الصراف: من يبدل نقداً بنقد المستأمن على أموال الخزانة يقبض ويصرف ما يستحق» — المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُحَصِّل"
      source_section: "step5_english_bridge"
      evidence_citation: "«المحصل: من يجمع المستحق للدولة والشركات ونحو ذلك» — المعجم الوسيط"
      justification: "ترجمة لمصطلح collection teller، وقد يدل على من يستلم المدفوعات."
  knowledge_candidates:
    - lemma: "أَمِين خَزِينَة"
      justification: "تركيب إضافي؛ يعبر عن الشخص المسؤول عن حفظ النقد في الخزينة، وهو مرادف قريب لأمين الصندوق."
  generation_notes: "تم استخراج 'مُحَصِّل' من الأدلة، واقتراح 'أمين خزينة' من المعرفة اللغوية لصلته بالمفهوم."

step1_lemma_validation:
  per_lemma:
    - lemma: "أَمِين صُنْدُوق"
      decision: confirmed
      decision_reason: "مصطلح تقني مركب (إضافي) مستقر وشائع الاستعمال للدلالة على الموظف المختص بتلقي وحفظ الأموال الفورية في المتاجر والمطاعم."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح إداري ومالي حديث، يركز على العهدة والمسؤولية عن صندوق النقد المباشر."
      example: "دَفَعَ الزَّبُونُ ثَمَنَ البَضَاعَةِ إلَى أَمِينِ الصُّنْدُوقِ قَبْلَ مُغَادَرَةِ المَتْجَرِ."
      actions: []
    - lemma: "صَرَّاف"
      decision: confirmed
      decision_reason: "لفظ عربي فصيح ومستقر، يعبر بدقة عن وظيفة القابض والدافع للنقود."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "لفظ عام يدل على من يتولى استلام وصرف النقود، وقد يطلق أيضاً على بائع النقد (الصيرافة)، ولكنه يشيع كمرادف لموظف الصندوق."
      example: "دَفَعَ المُشْتَرِي قِيمَةَ الفَاتُورَةِ لِلصَّرَّافِ فِي المَطْعَمِ."
      actions: []
    - lemma: "مُحَصِّل"
      source: step05
      decision: removed
      decision_reason: "المحصل مخصص لجمع الديون والمستحقات الدورية (كفواتير الكهرباء أو الرسوم)، وليس لمن يجلس في صندوق المتجر لاستلام المدفوعات الفورية."
      step05_citation: "«المحصل: من يجمع المستحق للدولة والشركات ونحو ذلك» — المعجم الوسيط"
    - lemma: "أَمِين خَزِينَة"
      source: step05
      decision: removed
      decision_reason: "أمين الخزينة أقرب للمسؤول عن حفظ الأموال الكبيرة أو في المؤسسات الكبرى والبنوك، بينما أمين الصندوق أدق في سياق المتاجر والمطاعم."
      step05_citation: "اقتراح من المعرفة"

