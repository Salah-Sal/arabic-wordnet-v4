step0_evidence:
  per_lemma:
    - lemma: "أُلْفَة"
      confirm:
        - text: "«الاجتماع والالتئام... (في الأخلاق): وشيجة بين شخصين أو أكثر, يحدثها تجاذب الميول النفسية, كصلة الصداقة ولحمة القرابة»"
          source: "المعجم الوسيط"
        - text: "«الألفة: إتفاق الآراء في المعاونة على تدبير المعاش.»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«تجاذب بين المواد المختلفة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
          conflict: "معنى كيميائي وفيزيائي بحت لا يتعلق بالتشابه في الطبيعة أو الشخصية."
        - text: "«ميل عنصرين أو مركبين للارتباط ببعضهما بروابط أكثر قوة من روابطهما مع غيرهما.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          conflict: "معنى كيميائي."
    - lemma: "قَرَابَة رُوحِيَّة"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تَآلُف"
      source_section: "step5_english_bridge"
      evidence_citation: "«(3) تآلُف؛ تجانُس» — المورد الحديث"
      justification: "اشتقاق: مصدر تفاعل يدل على الانسجام والارتباط المتبادل بين الأطراف المتشابهة في الطباع أو المصالح، ويقابل (affinity) في السياق النفسي والاجتماعي."
  knowledge_candidates:
    - lemma: "تَقَارُب"
      justification: "اشتقاق: مصدر تفاعل من الجذر (ق ر ب) يدل على الدنوّ المعنوي وتشابه الآراء والميول."

step1_lemma_validation:
  per_lemma:
    - lemma: "أُلْفَة"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع يدل على الارتباط الروحي والنفسي والاجتماعي ويتوافق تماماً مع المفهوم."
