          params:
            entry_id: "{auto}"
            synset_id: "awn4-13833622-n"

    - lemma: "تَقَارُب"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مستقر يدل على الدنو المعنوي وتشابه وجهات النظر والطباع."
      step05_citation: "معرفة لغوية"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على تقلص الفجوة في الآراء والميول والاقتراب المعنوي."
      example: "يوجد تقارب كبير في أفكارهما."
