        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على المودة والارتباط النفسي والاجتماعي الناشئ عن العِشرة أو التشابه."
      example: "تجمع بين الصديقين ألفة كبيرة ومصالح مشتركة."

    - lemma: "قَرَابَة رُوحِيَّة"
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق ومستعمل في السياقات الأدبية للتعبير عن التشابه العميق وكأن هناك رابطة نسب بين الأرواح (spiritual kinship)."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على التشابه العميق في الميول والأرواح مجازاً."
      example: "شعر بقرابة روحية مع الكاتب عندما قرأ أفكاره."

    - lemma: "تَآلُف"
      source: step05
      decision: confirmed
      decision_reason: "مصدر يدل على حالة الانسجام والارتباط، مستعمل بكثرة في السياقات النفسية لترجمة المفهوم."
      step05_citation: "«(3) تآلُف؛ تجانُس» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على حالة الانسجام والتناغم الناتجة عن التشابه والمصالح."
      example: "أظهر الفريقان تآلفاً ملحوظاً في وجهات النظر."
