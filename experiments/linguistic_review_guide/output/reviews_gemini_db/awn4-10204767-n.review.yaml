step0_evidence:
  per_lemma:
    - lemma: "آمِل"
      confirm:
        - text: "«آمِلٌ: [Hoping: or] expecting.»"
          source: "المعجم العربي الإنجليزي لإدوارد وليام لين"
        - text: "«أمَلَ/ أمَلَ في يَأمُل/ يأمِل، أَمَلاً، فهو آمل، والمفعول مأمول... أمَل النَّجاحَ/ أمَل في النَّجاح ونحوه: رجاه وترقَّب الحصولَ عليه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      peripheral_observations:
        - "«الآمِل: عَوْن الرجل وساعده» — المعجم الوسيط (معنى مستقل تماماً)"
    - lemma: "رَاجٍ"
      confirm:
        - text: "«راجي: من (ر ج و) الآمل والخائف»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«والراجي مؤمل ما يرجوه وخائف فوته»"
          source: "مجمع بحار الأنوار للفَتِّنيّ"

