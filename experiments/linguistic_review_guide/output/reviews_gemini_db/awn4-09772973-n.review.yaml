step0_evidence:
  per_lemma:
    - lemma: "مَوْلُود بُرْج الدَّلْو"
      confirm:
        - text: "«(1) الدَّلْو؛ السّاقي (فل) (2) بُرْج الدَّلو [في التنجيم] (3) مولودُ برج الدلو.»"
          source: "المورد الحديث"
    - lemma: "الدَّلْو"
      confirm:
        - text: "«بُرْجٌ مِن بُروجِ السَّماء بين الجدْىِ والحُوتِ...»"
          source: "المعجم الكبير"
      expands:
        - text: "«بُرْجٌ في السماءِ، وسِمَةٌ للإِبِلِ، والداهِيَةُ.»"
          source: "القاموس المحيط"
      peripheral_observations:
        - "تُطلق الدلو على الإناء الذي يُستقى به من البئر، وعلى الداهية، وعلى نصيب المرء من الشيء."

