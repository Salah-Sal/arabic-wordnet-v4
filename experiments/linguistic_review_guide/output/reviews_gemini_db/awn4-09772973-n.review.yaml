      source_section: "step9_specialized"
      justification: "تعبير اصطلاحي شائع جداً في كتب التنجيم والمجلات للإشارة إلى الشخص المنتمي للبرج."
  knowledge_candidates:
    - lemma: "الدَّلْويّ"
      justification: "اسم منسوب (Relational Noun) شائع الاستعمال في العربية المعاصرة للإشارة إلى الأشخاص المنتمين لبرج الدلو، على غرار 'الحملي' و'العقربي'."
      generation_mechanism: "اشتقاق (النسبة)"
  generation_notes: "تم استبعاد 'الساقي' لأنه يشير إلى الكوكبة أو الرمز الفلكي نفسه وليس الشخص."

