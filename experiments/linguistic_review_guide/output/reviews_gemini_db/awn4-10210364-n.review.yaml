      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح مشتق يدل بدقة على وضعية الجلوس المطلوبة، وهو مستعمل وشائع."
      step05_citation: "«مُقَرْفِص: جالسٌ القُرْفُصاء» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الجالس بحيث يضم ركبتيه إلى صدره ويلف يديه حولهما."
      example: "جلس الطفل مُقَرْفِصًا من شدة البرد."
