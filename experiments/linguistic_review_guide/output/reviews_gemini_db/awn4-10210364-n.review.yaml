step0_evidence:
  per_lemma:
    - lemma: "مُتَجَمِّع"
      contradicts:
        - text: "«متجمع: aggregate» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "الكلمة تعني المتراكم أو المجتمع مع غيره (aggregate/gregarious)، ولا تدل على الشخص الذي يجلس القرفصاء أو يجثم."
        - text: "«حطام أو فتات صخري متراكم» — المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "تتعلق بالتراكم للجماد."
    - lemma: "مُتَكَوِّم"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "الفعل (تكوّم) يعني تجمّع في شيء مع ارتفاع فيه، ويُقال (يتكوم على نفسه) مجازاً، ولكن كصفة مفردة (متكوّم) تعني المكدّس أو المتراكم."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُقَرْفِص"
      source_section: "step4_fts_keyword"
      evidence_citation: "«مُقَرْفِص: جالسٌ القُرْفُصاء» — المورد الحديث (2008)"
      justification: "اشتقاق من (القرفصاء) وهو الجلوس بانضمام وانكماش، وهو المعنى الدقيق للكلمة الإنجليزية (huddler/croucher)."
    - lemma: "جاثِم"
      source_section: "step4_fts_keyword"
      evidence_citation: "«جاثِم: من لزم مكانه فلم يبرح» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      justification: "اسم فاعل من جثم، يعبر عن اللاصق بالأرض والمتكوم في مكانه (اشتقاق)."
  generation_notes: "تم البحث عن مرادفات الجلوس بانكماش واستخراج أسماء الفاعل الدالة على ذلك."

