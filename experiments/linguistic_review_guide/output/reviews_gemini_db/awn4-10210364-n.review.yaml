    - lemma: "مُتَجَمِّع"
      decision: removed
      decision_reason: "الكلمة لا تدل على وضعية الجلوس بانكماش أو الجثوم، بل تعني التجمع والتكتل للأشخاص أو الأشياء."
      evidence_assessment:
        case: "contradicts_only"
      substitution_test:
        result: "fail"
      nuance_differentiation: "مُتجمِّع من التجمع، وهو انضمام الأشياء إلى بعضها، بخلاف الانطواء على الذات."
