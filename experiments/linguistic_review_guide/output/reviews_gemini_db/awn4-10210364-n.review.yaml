      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح دقيق يعبر عن من يلزم مكانه ملتصقاً بالأرض."
      step05_citation: "«جاثِم: من لزم مكانه فلم يبرح أو لصق بالأرض» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
