    - lemma: "مُتَكَوِّم"
      decision: removed
      decision_reason: "تدل على التكدس والتراكم. وتستخدم للدلالة على الجثوم فقط مقيدة بشبه الجملة (متكوم على نفسه)، ولا تُستعمل منفردة لهذا المعنى في السياقات المعجمية."
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "fail"
      nuance_differentiation: "المتكوم هو المتجمع المتكدس فوق بعضه، ككومة التراب."
