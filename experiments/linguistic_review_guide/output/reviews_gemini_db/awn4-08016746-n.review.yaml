step0_evidence:
  per_lemma:
    - lemma: "صورة"
      confirm:
        - text: "«صورة - image»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      expands:
        - text: "«الصورة الذهنية أي المعلوم المتميز في الذهن وحاصله الماهية الموجودة بوجود ظلي»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
          addition: "البعد الفلسفي والمنطقي لمفهوم الصورة كتمثيل لشيء ما في العقل."
    - lemma: "مدى"
      confirm:
        - text: "«مدَى - range»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«المَدَى: الفرق بين أعلى قيمة وأقلّ قيمة في التَّوزيع»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مدى الدالة"
      confirm:
        - text: "«مدى الدالّة - range of function»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نطاق"
      source_section: "step5_english_bridge"
      evidence_citation: "«نطاق - range» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      justification: "يستخدم 'نطاق' كمرادف لـ 'مدى' (range) في مجالات تقنية وعلمية متعددة، وقد يمتد استعماله للرياضيات."
  knowledge_candidates:
    - lemma: "حيز القيم"
      justification: "تركيب وصفي مستخدم في الأدبيات الرياضية العربية للتعبير عن مجموعة القيم التي يأخذها متغير ما (range of values)."
    - lemma: "مجموعة الصور"
      justification: "تسمية وصفية دقيقة تعبر عن تعريف المدى في نظرية المجموعات والدوال (the set of images)."

step1_lemma_validation:
  per_lemma:
    - lemma: "صورة"
      decision: confirmed
      decision_reason: "مصطلح أساسي في الرياضيات يقابل image، ويعبر عن نتيجة الدالة لكل عنصر من عناصر المجال."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "تركز اللمة على القيمة (أو القيم) الناتجة عن تطبيق الدالة (mapping)."
      example: "تكون صورة الدالة د(س) = س² هي مجموعة الأعداد الحقيقية غير السالبة."
    - lemma: "مدى"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً في المناهج العربية للتعبير عن range في سياق الدوال الإحصائية والرياضية."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "تؤكد اللمة على الامتداد أو الحيز القيمي الذي تغطيه الدالة (interval/span)."
      example: "يقع مدى هذه الدالة بين الصفر والواحد."
    - lemma: "مدى الدالة"
      decision: confirmed
      decision_reason: "تركيب إضافي ثابت ومعرف معجمياً لتخصيص المفهوم بالسياق الرياضي."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
        type: "إضافي"
      nuance_differentiation: "تحديد صريح للمجال الذي ينتمي إليه المدى (contextual specialization)."
      example: "نحتاج لتحديد مدى الدالة قبل رسم منحناها البياني."
    - lemma: "نطاق"
      source: step05
      decision: removed
      decision_reason: "على الرغم من وروده كترجمة لـ range في مجالات أخرى، إلا أنه في الرياضيات (خاصة في المناهج الخليجية والأردنية) يُستعمل غالباً كمرادف لـ Domain (المجال)، مما قد يسبب خلطاً دلالياً."
      step05_citation: "«نطاق - range» — مسرد المناخ والبيئة"
    - lemma: "مجموعة الصور"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تفسيري دقيق يربط المفهوم بتعريفه الرياضي الأساسي، مستخدم في سياق التعليم الأكاديمي."
      substitution_test:
        result: "pass"
      nuance_differentiation: "توصيف المدى بكونه 'مجموعة' من 'الصور' الفردية."
      example: "يمثل المدى مجموعة الصور الناتجة عن تطبيق الدالة على عناصر منطلقها."
      actions:
        - command: create_entry
          params:
            lemma: "مجموعة الصور"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08016746-n"

step3_definition:
  definition_review_flag: true
  current_definition: "مجموعة قيم المتغير التابع التي يتم تعريف الدالة لها"
  assessment:
    decision: revise
    reason: "العبارة 'يتم تعريف الدالة لها' قد توحي بأنها تشير إلى قيم المتغير المستقل (Domain)، والأدق استخدام فعل يدل على 'الناتج' أو 'الأيلولة'."
  authored_definitions:
    - type: terminological
      text: "مجموعة القيم (الصور) التي يؤول إليها المتغير التابع بعد تطبيق الدالة على كافة عناصر مجالها (نطاقها)."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-08016746-n"
        definition_index: 0
        text: "مجموعة القيم (الصور) التي يؤول إليها المتغير التابع بعد تطبيق الدالة على كافة عناصر مجالها (نطاقها)."

