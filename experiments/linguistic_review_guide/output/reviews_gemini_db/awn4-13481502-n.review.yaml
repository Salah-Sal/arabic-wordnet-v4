step0_evidence:
  per_lemma:
    - lemma: "انحطاط"
      confirm:
        - text: "«ارتبط الاصطلاح بعصر الانحطاط وتقهقر القيم خلال العصر الوسيط» — المعجم الموحد لمصطلحات اللسانيات"
        - text: "«(انحطاط) [في الانكليزية] Descent ... هو عند أهل الهيئة مقابل الارتفاع» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«انحلال؛ تفسُّخ؛ فساد؛ حَرَضٌ؛ انحطاط [فكريّ أو أخلاقيّ]» — المورد الحديث"
          addition: "ربط اللفظ بالفساد الأخلاقي والفكري والتحلل"

    - lemma: "تدهور"
      confirm:
        - text: "«تدهور: انخفاض تدريجي في فعالية بعض المواد بمضي الزمن كما في حالة بعض الأدوية عند تخزينها» — المعجم الموحد لمصطلحات الكيمياء"
        - text: "«(تدهور) الشيء سقط من أعلى إلى أسفل» — المعجم الوسيط"
        - text: "«الأُمُورُ، أو العلاقاتُ: تَأَزَّمَت. (محدثة)» — المعجم الكبير"
      expands:
        - text: "«التدهور أو الشيخوخة يشير إلى انخفاض كفاءة الخلايا الشمسية مع مرور الوقت» — المعجم الموحد لمصطلحات الطاقة المتجددة"
          addition: "استعمال المصطلح في سياق الفيزياء والطاقة المتجددة (الشيخوخة التقنية)"

    - lemma: "تنكس"
      confirm:
        - text: "«تدهور وظيفة الأنسجة إلى درك أقل كفاءة في أداء الوظيفة» — معجم المصطلحات الطبية"
        - text: "«(تنكس) الشيء انتكس يقال نكسه فتنكس» — المعجم الوسيط"
      expands:
        - text: "«تنكس: [في الانكليزية] degeneration» — المعجم الطبي الموحد"
          addition: "تثبيت المقابل الإنجليزي الدقيق للمصطلح الطبي"

