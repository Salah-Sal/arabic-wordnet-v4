step0_evidence:
  per_lemma:
    - lemma: "متغير"
      confirm:
        - text: "«في الرياضيات، يُشير المُتغيّر إلى حرف بديل لمقدار مُقاس، وليكن عدداً على سبيل المثال. وفي البرمجة، يُشيرُ المُتغيِّر إلى 'خزّان' للقيم العددية التي تظهر أثناء إجراء العمّلية الحسابية.»"
          source: "مسرد الهندسة الكهربائية — ArabTerm"
        - text: "«في اللسانيات، كم يحمل قيما مختلفة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«في البرمجة: موضعُ تخزينٍ يَحملُ اسماً، ويمكِن أن يحويَ معطياتٍ قابلةً للتغيّر أثناء تنفيذ البرنامج.»"
          source: "معجم مصطلحات المعلوماتية"
        - text: "«(5) المتغيِّر أو رَمْزُه (ر).»"
          source: "المورد الحديث (2008)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "متحول"
      source_section: "english_bridge"
      evidence_citation: "«متحول: يطلق في المعلوماتية والاتصال على المتغير.» — مسرد الإعلام والتواصل (ArabTerm)"
      justification: "مصطلح فني واسع الانتشار كمرادف للمتغير في العلوم والرياضيات والبرمجة."
  knowledge_candidates:
    - lemma: "متقلب"
      justification: "لفظ عربي فصيح يدل على الشيء الذي يكثر تغيره أو تقلبه، وإن كان أقل تداولاً كمصطلح رياضي."

step1_lemma_validation:
  per_lemma:
    - lemma: "متغير"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والمستقر في جميع السياقات العلمية والتقنية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على الكيان الرياضي أو البرمجي الذي يمثل القيمة المتغيرة."
      example: "يُستخدم المتغير 'س' في المعادلة لتمثيل القيمة المجهولة."

    - lemma: "متحول"
      source: step05
      decision: confirmed
      decision_reason: "مرادف تقني فصيح وشائع في الكتب المدرسية والجامعية، خاصة في بلاد الشام والمغرب العربي."
      step05_citation: "«متحول: variable» — مسرد الإعلام والتواصل"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يميل للاستخدام في السياقات الإحصائية والاحتمالية والتحولات النصية (Linguistics)."
      example: "يعتمد استقرار النظام على القيم التي يتخذها المتحول العشوائي."
      actions:
        - command: create_entry
          params:
            lemma: "متحول"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09492089-n"

    - lemma: "متقلب"
      source: step05
      decision: removed
      decision_reason: "على الرغم من دلالته اللغوية على التغير، إلا أنه لا يُستخدم كمصطلح مسكوك (fixed term) لهذا المفهوم الرياضي/البرمجي؛ فهو وصف حر أكثر منه مصطلحاً."
      step05_citation: "«متقلب أو قابل للتغيير» — المورد الحديث"

step3_definition:
  definition_review_flag: true
  current_definition: "شيء من المحتمل أن يتغير؛ شيء يخضع للتغيير"
  assessment:
    decision: revise
    reason: "التعريف الحالي وصفي عام؛ يفضل صياغته بأسلوب مصطلحي يجمع بين الدلالة الرياضية والبرمجية العامة."
  authored_definitions:
    - type: terminological
      text: "مقدارٌ أو رمزٌ يُمثّلُ قيمةً غيرَ ثابتةٍ قابلةً للتغيّرِ ضِمْنَ نِطاقٍ أو مجموعةٍ مُعيّنةٍ."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09492089-n"
        definition_index: 0
        text: "مقدارٌ أو رمزٌ يُمثّلُ قيمةً غيرَ ثابتةٍ قابلةً للتغيّرِ ضِمْنَ نِطاقٍ أو مجموعةٍ مُعيّنةٍ."

