step0_evidence:
  per_lemma:
    - lemma: "عُضْوِيَّة"
      confirm:
        - text: "«جسم الكائن الحيّ» — المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          source: "arabterm"
        - text: "«organism» — مسرد علم الاجتماع والأنثروبولوجيا"
          source: "arabterm"
      expands:
        - text: "«(العضوية) صفة الْعُضْو فِي جمَاعَة» — المعجم الوسيط"
          source: "hawramani"
          addition: "المعنى الاجتماعي (عضوية في جماعة) هو الأصل اللغوي، بينما 'كائن حي' معنى مصطلحي حديث."
    - lemma: "كَائِن حَيّ"
      confirm:
        - text: "«نبات أو حيوان أو كائن وحيد الخلية أو أي شكل من أشكال الحياة، منظومة لها مكونات مترابطة ومتكاملة تمكن من تحقيق الاستمرارية عن طريق النمو والتكاتر.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          source: "arabterm"
        - text: "«شكل من أشكال الحياة: نبات أو حيوان أو فطريات أو بكتيريا.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          source: "arabterm"
    - lemma: "مُتَعَضٍّ"
      confirm:
        - text: "«(1) المُتَعضّي؛ الكائن الحيّ (أح) (2) نظام the social organism .» — المورد الحديث (2008)"
          source: "arabterm"
        - text: "«كائن حي متعض، متعضية — organism» — المعجم الموحد لمصطلحات الجيولوجيا"
          source: "arabterm"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نَسَمَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«النَّسَمَةُ: كلُّ كائن حيٍّ فيه روح» — المعجم الوسيط"
      justification: "مصطلح تراثي جامع لكل ما فيه حياة وروح، وهو مرادف دقيق للمفهوم العام لـ 'being' و 'organism'."
    - lemma: "مُتَعَضِّيَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«كائن حي متعض، متعضية — organism» — المعجم الموحد لمصطلحات الجيولوجيا"
      justification: "صيغة المؤنث من 'متعضّ' وهي شائعة جداً في النصوص العلمية، خاصة عند الحديث عن الكائنات الدقيقة (متعضيات مجهرية)."
  knowledge_candidates:
    - lemma: "كَائِن"
      justification: "اللفظ الأكثر شيوعاً للتعبير عن الوجود (being) أو الشيء الموجود (entity) في سياقات الفلسفة والعلوم العامة، وغالباً ما يُستخدم وحده ليدل على الكائن الحي في السياق المناسب."
    - lemma: "مَوْجُود"
      justification: "لفظ عربي فصيح يدل على الذات أو الكائن (being)، ويُستخدم كمرادف للفظ 'كائن' في سياقات الوجود."
  generation_notes: "التعريف يركز على الكائن الحي كمنظومة مستقلة؛ لذا تم استحضار المصطلحات التراثية (نسمة) والحديثة (متعضية، كائن)."

step1_lemma_validation:
  per_lemma:
    - lemma: "عُضْوِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مستقر في التخصصات العلمية (صيدلة، كيمياء) ليدل على جسم الكائن الحي أو الكائن كمنظومة أعضاء."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على الجانب العضوي (التركيبي) للكائن الحي كمنظومة من الأعضاء."
      example: "تتأثر عضوية الإنسان بالعوامل البيئية المحيطة بها."
    - lemma: "كَائِن حَيّ"
      decision: confirmed
      decision_reason: "المصطلح العربي الأساسي والأكثر شيوعاً للمفهوم، مدعوم بقوة في المعاجم الحديثة والتقنية."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام والشامل الذي يصف أي شكل من أشكال الحياة."
      example: "يُعتبر الفطر كائناً حياً لا ينتمي إلى مملكة النباتات ولا إلى مملكة الحيوانات."
    - lemma: "مُتَعَضٍّ"
      decision: confirmed
      decision_reason: "مصطلح علمي (أحيائي) دقيق، يُستخدم كترجمة مباشرة لـ organism."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح تقني يُبرز صفة 'التعضي' (وجود الأعضاء) في الكائن."
      example: "تتميز المتعضيات بقدرتها على تحويل الطاقة لضمان بقائها."
    - lemma: "نَسَمَة"
      source: step05
      decision: confirmed
      decision_reason: "لفظ تراثي فصيح ذكره المعجم الوسيط كمرادف لكل كائن حي فيه روح."
      step05_citation: "«النَّسَمَةُ: كلُّ كائن حيٍّ فيه روح» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "لفظ تراثي يحمل إيحاءً بوجود الروح (النفس)، ويُكثر استخدامه في السياقات الفقهية والأدبية."
      example: "أمر الحاكم بإحصاء كل نسمة في المدينة لتوفير المؤن."
      actions:
        - command: create_entry
          params:
            lemma: "نَسَمَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00004475-n"
    - lemma: "مُتَعَضِّيَة"
      source: step05
      decision: confirmed
      decision_reason: "صيغة قياسية شائعة في المعاجم العلمية الموحدة كمرادف لـ organism."
      step05_citation: "«كائن حي متعض، متعضية — organism» — المعجم الموحد لمصطلحات الجيولوجيا"
      substitution_test:
        result: "pass"
      nuance_differentiation: "صيغة مؤنثة للمصطلح التقني 'متعضّ'، وغالباً ما تُستخدم للدلالة على الوحدة البيولوجية المستقلة."
      example: "تنمو المتعضيات المجهرية في البيئات الرطبة والغنية بالمواد العضوية."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَعَضِّيَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00004475-n"
    - lemma: "كَائِن"
      source: step05
      decision: confirmed
      decision_reason: "اللفظ الأساسي لمفهوم الوجود (being) في العربية، ويتطابق مع المعنى العام للمجموعة."
      step05_citation: "«كائن — being» — مسرد الفلسفة وعلم النفس"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أكثر تجريداً، يُستخدم للدلالة على الموجود بحد ذاته (being) سواء كان بسيطاً أو معقداً."
      example: "يُعتبر الإنسان كائناً اجتماعياً بطبعه."
      actions:
        - command: create_entry
          params:
            lemma: "كَائِن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00004475-n"

step3_definition:
  definition_review_flag: false
  current_definition: "كائن حيّ قادر على الفعل أو الأداء الوظيفيّ بشكل مستقلّ، أو لديه القدرة على ذلك"
  assessment:
    decision: retain
    reason: "التعريف دقيق ومطابق للمفهوم العلمي واللغوي لـ 'organism' و 'living thing'."

step4_relations:
  hypernymy:
    current_hypernym: "سَبَب (awn4-00007347-n)"
    test_result: "needs_closer"
    # مبرر: في WordNet، المشتمِل المباشر هو 'living thing' (كائن حي/موجود). 'سبب' (causal agent) هو مشتمِل بعيد جداً أو في مسار دلالي مختلف.
  antonymy:
    per_lemma:
      - lemma: "كَائِن"
        antonym_found: true
        antonym: "لا وجود"
  actions:
