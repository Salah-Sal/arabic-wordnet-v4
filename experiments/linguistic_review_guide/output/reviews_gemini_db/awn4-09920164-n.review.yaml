step0_evidence:
  per_lemma:
    - lemma: "محفز"
      confirm:
        - text: "«الحَفّاز؛ الوسيط: ... «ب» كلُّ من يسرِّع حدثًا.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مادة تغير أو تزيد من معدل التفاعل الكيميائي دون أن تستهلك في هذه العملية.»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "المعنى التقني الكيميائي للمصطلح"
    - lemma: "عامل مساعد"
      confirm:
        - text: "«عاملٌ مساعدٌ على إعادة الوعي أو الصحة.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«أيٌّ من المواد الكيميائية التي تسمح بتكوّن الندفات (الخثرات) أو بتسريع تكوّنها، إلا أنها لا تكوِّنها هي ذاتها.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          addition: "الاستعمال التقني كمرادف للمحفز في الكيمياء"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "حفاز"
      source_section: "step5_english_bridge"
      evidence_citation: "«(الحفاز) (فِي علم الكيمياء) كل مَادَّة تزيد عَادَة فِي سرعَة التفاعل دون أَن تتأثر هِيَ بِهَذَا التفاعل عِنْد نهايته» — المعجم الوسيط"
      justification: "المصطلح العربي القياسي المقابل لـ Catalyst في العلوم، ويُستخدم مجازاً للأحداث."
    - lemma: "وسيط"
      source_section: "step5_english_bridge"
      evidence_citation: "«الحَفّاز؛ الوسيط: «أ» مادة تُحْدِث أو تُسَرِّع التفاعل الكيميائيّ. «ب» كلُّ من يسرِّع حدثًا.» — المورد الحديث"
      justification: "مرادف صريح للمحفز والحفاز في المعاجم الحديثة للدلالة على من يسرع الأحداث."
  knowledge_candidates:
    - lemma: "باعث"
      justification: "آلية التوليد: مجاز (إزاحة دلالية). اللفظ يدل أصلاً على المرسل والموقظ، ويُستخدم للدلالة على ما يحمل على الفعل ويسببه."
    - lemma: "دافع"
      justification: "آلية التوليد: اشتقاق (اسم فاعل من دفع). يدل على القوة المحركة والمنشطة التي تسبب الفعل أو الحدث."
  generation_notes: "التركيز على المفاهيم التي تدل على التسريع أو التسبب في وقوع الحدث."

