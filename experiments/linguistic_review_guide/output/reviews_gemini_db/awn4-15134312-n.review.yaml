step0_evidence:
  per_lemma:
    - lemma: "انبعاث"
      confirm:
        - text: "«صدور المواد في صورة غازية أو سائلة أو صلبة في البيئة عن مرفق أو بِناية أو وسيلة مواصلات. كما أن إطلاق الحرارة والأشعة والضجيج والروائح يُعتبر من أنواع الانبعاثات.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«إطلاق المواد (الغازات والغبار) أو الطاقة (الإشعاع والحرارة والضوضاء) في البيئة، وعادة في الغلاف الجوي»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
        - text: "«إطلاق إشعاع، وليكن إشعاعاً حرارياً مثلاً، إلى الوسط المُحيط.»"
          source: "مسرد الهندسة الكهربائية"
      expands:
        - text: "«يُقصد به طرد المواد الضارة مع العادم»"
          source: "مسرد هندسة وتكنولوجيا السيارات"
          addition: "يخصّص المعنى في سياق المواد الضارة والعوادم الميكانيكية"
        - text: "«تسرُّب غازات دفيئة، تنشأ خلال عمليات الانتاج والأنشطة الاستهلاكية، إلى البيئة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يركز على غازات الاحتباس الحراري والنشاط البشري"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "انبثاق"
      source_section: "step5_english_bridge"
      evidence_citation: "«انبعاث غاز أو رائحة أو ضوء من جسم ما، دون تغيير ظاهر لشكل أو حجم الجسم.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      justification: "التعريف يطابق تعريف المجموعة تماماً، ويستخدم في السياقات العلمية (الفيزياء والجيولوجيا) للتعبير عن الانبعاث (emanation)."
    - lemma: "فيض"
      source_section: "step5_english_bridge"
      evidence_citation: "«صُدور؛ انبثاق... فَيْض» — المورد الحديث (2008)"
      justification: "يدل على صدور شيء من شيء آخر وسيلانه أو انتشاره."
  knowledge_candidates:
    - lemma: "إشعاع"
      justification: "اشتقاق (إفعال من ش-ع-ع)؛ مناسب جداً لتمثيل الدلالة في حالة الضوء والحرارة والطاقة (radiation/emitted energy)."
    - lemma: "نفح"
      justification: "مجاز؛ يُستخدم للروائح (emitted odor) لكنه يغلب على الروائح الطيبة."

