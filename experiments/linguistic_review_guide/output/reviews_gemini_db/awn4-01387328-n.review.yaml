step0_evidence:
  per_lemma:
    - lemma: "طفيلي"
      confirm:
        - text: "«كائن حي يعيش متطفلاً على كائن حي آخر في داخله أو خارجه (في علم الأحياء)»"
          source: "المعجم الوسيط"
        - text: "«كائن حي يعيش داخل أو على جسم كائن حي آخر من نوع مختلف (المضيف) ويستمد المواد الغذائية منه.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«كل كائن - نبات أو حيوان - يعيش عالة على غيره»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
      expands:
        - text: "«تكون الاستفادة من جانب واحد، جانب الطفيلي. أما من جانب المضيف فيكون هناك عموما ضرر، صغير أو كبير.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يوضح طبيعة الضرر والعلاقة الأحادية الجانب."
      peripheral_observations:
        - "«من يدخل الوليمة من غير ان يدعى إليها» — التوقيف على مهمات التعاريف للمناوي"
        - "«الذي يَغْشَى الولائمَ والأَعْراسَ والمَجالِسَ ولم يُدْعَ إليها» — المعجم الكبير"

