      example: "بَلَغ إِجْمالِيّ الأَرْباح هَذا العام مَبْلَغًا كَبيرًا."
    - lemma: "كُلِّيَّة"
      decision: confirmed
      decision_reason: "لفظ تراثي ومعاصر يدل على حالة المجموع والشمول."
