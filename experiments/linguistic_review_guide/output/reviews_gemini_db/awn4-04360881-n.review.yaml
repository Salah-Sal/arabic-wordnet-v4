      nuance_differentiation: "تدرك المجموع في حالته التجريدية ككيان واحد شامل لكل أفراده."
      example: "الاسْتِقراء هوَ الحُكْم على الكُلِّيَّة لِوُجود ذَلِك الحُكْم في جُزْئِيّاتها."
    - lemma: "مَجْمُوع"
