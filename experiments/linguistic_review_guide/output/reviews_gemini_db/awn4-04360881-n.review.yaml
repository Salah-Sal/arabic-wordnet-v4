      nuance_differentiation: "يدل على نتيجة عملية الضم أو الجمع، ويستخدم في الرياضيات والحياة اليومية."
      example: "مَجْموع الزَّوايا الداخِلِيَّة لِلْمُثَلَّث مِائَة وثَمانون دَرَجَة."
