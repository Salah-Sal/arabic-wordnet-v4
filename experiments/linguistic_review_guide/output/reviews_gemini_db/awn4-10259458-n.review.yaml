      decision: confirmed
      decision_reason: "مصطلح عربي فصيح، وهو اسم الفاعل من 'طرق'، ويعبر بدقة عن الشخص الذي يدق الباب طلباً للدخول. ورغم ارتباطه تراثياً بالآتي ليلاً، إلا أن دلالته اللغوية العامة متطابقة مع المفهوم."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ الأصلي والأكثر شيوعاً للتعبير عن من يدق الباب، وغالباً ما يرتبط في الاستعمال التراثي بالزائر ليلاً."
      example: "أسرع الرجل لفتح الباب عندما سمع صوت الطارق."
    
    - lemma: "قَارِع"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل من 'قرع'، وهو مرادف دقيق ومستعمل للتعبير عن من يضرب الباب."
      step05_citation: "«فا .rap وبخاصة: قارعُ الباب» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مرادف لـ'طارق'، غير أن الفعل 'قرع' قد يوحي بشدة وقوة أكبر في الدق مقارنة بالطرق."
      example: "وقف القارع أمام الباب منتظراً أن يُؤذن له بالدخول."
      actions:
        - command: create_entry
          params:
            lemma: "قَارِع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10259458-n"
            
