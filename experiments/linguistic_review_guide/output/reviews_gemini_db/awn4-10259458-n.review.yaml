      source: step05
      decision: removed
      decision_reason: "تركيب إضافي وصفي حر وليس مصطلحاً مسكوكاً مستقلاً، ويمكن الاستغناء عنه بلفظتي 'قارع' و'طارق' المفردتين."
      step05_citation: "مرشح من المعرفة اللغوية"
