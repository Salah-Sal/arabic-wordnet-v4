      source_section: "step4_fts_keyword"
      evidence_citation: "«الموضع العريض الواسع... الأرض المستوية لا شجر فيها» — المعجم الكبير"
      justification: "مصطلح أصيل يدل على وجه الأرض المنبسط الواسع."
    - lemma: "بسيطة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«أرض بسيطة: واسعة منبسطة» — المعجم الكبير"
      justification: "تستعمل اسماً وناعتة للأرض الواسعة المنبسطة."
  knowledge_candidates:
    - lemma: "بساط"
      justification: "آلية: مجاز. تصوير انبساط الأرض وامتدادها كالفراش الممهد."
  generation_notes: "تم التركيز على المصطلحات العربية التي تصف طبيعة الأرض من حيث الاستواء والاتساع."

