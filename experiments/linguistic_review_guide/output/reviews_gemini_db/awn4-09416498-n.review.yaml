step0_evidence:
  per_lemma:
    - lemma: "حقل"
      confirm:
        - text: "«الأرض الفضاء الطيبة يزرع فيها»"
          source: "المعجم الوسيط"
        - text: "«قراح طيب يزرع فيه»"
          source: "القاموس المحيط"
      expands:
        - text: "«حقل البترول: المكان الذي يستنبط منه البترول للاستغلال»"
          source: "المعجم الوسيط"
          addition: "التوسع في الدلالة ليشمل الحقول الاصطلاحية والتقنية"
    - lemma: "سهل"
      confirm:
        - text: "«من الأرض خلاف الحزن وهي أرض منبسطة لا تبلغ الهضبة»"
          source: "المعجم الوسيط"
        - text: "«نقيض الحزنة»"
          source: "كتاب العين"
      expands:
        - text: "«كل شيء يميل إلى اللين وقلة الخشونة»"
          source: "المعجم الوسيط"
          addition: "الدلالة الصفاتية العامة للكلمة"

step05_lemma_generation:
