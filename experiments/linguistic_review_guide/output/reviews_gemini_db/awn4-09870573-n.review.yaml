step0_evidence:
  per_lemma:
    - lemma: "الْأَفْضَل"
      confirm:
        - text: "«(5) الأفضل»"
          source: "المورد الحديث (2008)"
        - text: "«مثال: تحقيق الحياة الأَفْضَل»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      peripheral_observations:
        - "المعجم الوسيط ذكر الكلمة كفعل ماضٍ (أفضل عليه: أحسن إليه)، وهو معنى مستقل وصيغة مختلفة عن صيغة التفضيل."
    - lemma: "الْأَمْثَل"
      expands:
        - text: "«(الأمثل) تَفْضِيل من مثل وَيُقَال فلَان أمثل بني فلَان أَدْنَاهُم للخير وَهَؤُلَاء أماثل الْقَوْم خيارهم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يضيف معنى القرب من الخير وكون الشخص خيار القوم."
        - text: "«تفضيلٌ من مَثُلَ فلانٌ أَمْثَلُ بنى فلان : أدناهم للخير المريض اليومَ أمْثَلُ : أحسنُ حالاً من حالةٍ كانت قبلها»"
          source: "المعجم الوسيط"
          addition: "يؤكد المعنى المرجعي كصيغة تفضيل بمعنى أدناهم للخير."

step05_lemma_generation:
