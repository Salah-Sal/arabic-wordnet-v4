step0_evidence:
  per_lemma:
    - lemma: "فتات صخري"
      expands:
        - text: "«تآكل الصخور بفعل الفتات الصخري الذي تحمله العوامل الطبيعية كالريح والماء والجليد»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "استخدام المصطلح لوصف العامل المسبب للسحج في الجيولوجيا مما يؤكد انتمائه لنفس المجال الدلالي"
        - text: "«سَحْج [مفرد]: (جو) تآكل الصخور بفعل الفتات الصخريّ الذي تحمله العوامل الطبيعيّة كالرِّيح والماء والجليد»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "رواسب منحدرات"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "اللمّة عبارة عن تركيب وصفي دقيق للمعنى الإنجليزي (slope deposits) لكنها لم ترد كمدخل معجمي مستقل"

step05_lemma_generation:
