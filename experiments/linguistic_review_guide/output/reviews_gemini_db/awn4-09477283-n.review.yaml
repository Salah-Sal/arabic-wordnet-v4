    - lemma: "رُكام"
      source_section: "step4_fts_keyword"
      evidence_citation: "«رُكام: (في الجيولوجيا) scree: ما يتفتت من الصخور على المنحدرات بالمؤثرات الجوية الطبيعية... تتراكم عند السفوح بفعل الجاذبية الأرضية» — المعجم الكبير"
      justification: "مطابقة تامة للمفهوم الجيولوجي المقصود (scree) في المعاجم العربية الكبرى"
    - lemma: "نُقاضة السفح"
      source_section: "step5_english_bridge"
      evidence_citation: "«نُقاضة السفح (scree/talus)» — مسرد الجغرافيا والتاريخ (ArabTerm)"
      justification: "مصطلح جغرافي متخصص معتمد في المجامع اللغوية العربية للمفهومين talus وscree"
  knowledge_candidates:
    - lemma: "فتات منحدرات"
      justification: "اشتقاق تركيبي يجمع بين طبيعة المادة (فتات) ومكان تواجدها (منحدرات) وهو مألوف في الكتابات الجيولوجية"

