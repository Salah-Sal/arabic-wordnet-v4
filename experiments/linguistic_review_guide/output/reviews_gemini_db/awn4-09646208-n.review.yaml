      nuance_differentiation: "يركز على التوجيه الميداني والريادة (أصله من قيادة الجيش)."
      example: "القَائِدُ النَّاجِحُ هُوَ مَنْ يُلْهِمُ فَرِيقَهُ لِتَحْقِيقِ الأَهْدَافِ."

    - lemma: "رئيس"
      source: "step05"
