step0_evidence:
  per_lemma:
    - lemma: "زَعِيم"
      confirm:
        - text: "«(الزَّعِيمُ) الرَّئيس الكفيل»"
          source: "المعجم الوسيط"
        - text: "«سَيِّد القَوْمِ ورَئِيسُهم المتكلِّمُ عنهم»"
          source: "المعجم الكبير"
        - text: "«الرئيس والكفيل والسيد المتكلم عن قومه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

    - lemma: "قَائِد"
      confirm:
        - text: "«مَنْ يَقُودُ الجَيْشَ»"
          source: "المعجم الوسيط"
        - text: "«رئيس القوم والقائم على أمرهم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رئيس"
      source_section: "step4_fts_keyword"
      evidence_citation: "«سيد القوم والشريف القدر» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "الرأس هو السيد والمقدم في القوم، وهو مرادف مباشر لمفهوم القائد في السياقات العامة والرسمية."
    - lemma: "حاكم"
      source_section: "step4_fts_keyword"
      evidence_citation: "«صفة تطلق على الحاكم الذي يجمع بين يديه جميع السلطات» — المعجم الموحد لمصطلحات القانون (2017)"
      justification: "التعريف يتضمن 'شخص يحكم'، والحاكم هو من يمارس سلطة الحكم والقيادة."
  knowledge_candidates:
    - lemma: "إمام"
      justification: "الإمام هو من يؤتم به ويقتدى بقوله أو فعله، وهو يجسد معنى 'الإلهام والإرشاد' الوارد في التعريف، خاصة في السياق الثقافي العربي."
    - lemma: "سيد"
      justification: "يستخدم 'سيد القوم' في التراث العربي للدلالة على القائد والمقدم الذي ترجع إليه الأمور."
  generation_notes: "تم التركيز على اللمّات التي تغطي الجوانب الثلاثة للتعريف: الحكم (حاكم)، الإرشاد (إمام)، والرياسة العامة (رئيس/سيد)."

step1_lemma_validation:
