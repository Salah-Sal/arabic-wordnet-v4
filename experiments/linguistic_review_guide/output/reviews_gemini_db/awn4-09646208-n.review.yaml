      nuance_differentiation: "يؤكد على جانب الكفالة والتمثيل (المتحدث باسم القوم)."
      example: "بَرَزَ كَزَعِيمٍ لِلحَرَكَةِ الوَطَنِيَّةِ فِي تِلْكَ الفَتْرَةِ."

    - lemma: "قَائِد"
      decision: "confirmed"
