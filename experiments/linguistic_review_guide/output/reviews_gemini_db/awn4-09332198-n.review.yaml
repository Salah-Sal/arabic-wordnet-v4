step0_evidence:
  per_lemma:
    - lemma: "كتلة جليدية"
      expands:
        - text: "«كتلة جليدية: تكتل أو تجمع لقطع جليدية عائمة بفعل الرياح أو الأمواج أو هما معا» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          addition: "يخصصه بتجمع القطع الجليدية العائمة في السياق البيئي."
      peripheral_observations:
        - "اللفظ يرد كجزء من تعابير أخص مثل «كتلة جليدية ضخمة» (serac)، ويُستعمل كجنس للتعريف كما في معجم اللغة العربية المعاصرة: «جَبَل جَليديّ: كتلة كبيرة من الجليد تطفو على سطح المحيط»."

