step05_lemma_generation:
  evidence_candidates:
    - lemma: "وَظِيفَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«وظيفة» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
      justification: "ظهرت كترجمة شائعة للمصطلح الإنجليزي (function)، لكن في المجالات غير الرياضية للدلالة على الغرض أو العمل."
  knowledge_candidates:
    - lemma: "اِقْتِرَان"
      justification: "مصطلح مستخدم في المناهج التعليمية في عدة دول عربية (كالأردن وفلسطين) للتعبير عن المفهوم الرياضي (Function). (آلية التوليد: اشتقاق من الجذر ق-ر-ن على وزن افتعال للدلالة على الربط بين المتغيرات)."

step1_lemma_validation:
  per_lemma:
    - lemma: "تَابِع"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستخدم بكثرة للتعبير عن مفهوم التبعية والعلاقة التي يعتمد فيها شيء على آخر (في الرياضيات وغيرها)."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يبرز في مصطلح (التابع) معنى الاعتمادية المباشرة للمتغير التابع على غيره، ويشيع استخدامه في بعض الأقطار العربية بتأثير من المدرسة الفرنسية."
      example: "معدل النمو الاقتصادي تابع لمستوى الاستثمار في الدولة."
    - lemma: "دَالَّة"
      decision: confirmed
      decision_reason: "المصطلح العلمي والرياضي الأكثر شيوعاً في غالبية الأقطار العربية للتعبير عن العلاقة الاعتمادية (Function)."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تبرز (الدالة) معنى الإرشاد والدلالة على القيمة، وتستخدم للتعبير عن التبعية الرياضية أو المنطقية بين المتغيرات أو الأحداث."
      example: "يُعدّ السعر دالةً في العرض والطلب؛ إذ يتغير بتغيرهما."
    - lemma: "وَظِيفَة"
      source: step05
      decision: removed
      decision_reason: "ترجمة حرفية للمصطلح الإنجليزي (Blind Literal) عندما يُستخدم في سياقات غير رياضية (مثل علم الأحياء والاجتماع). ولا تعبر عن علاقة التبعية والارتباط المقصودة في التعريف."
      step05_citation: "«وظيفة» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "اِقْتِرَان"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح رياضي معتمد وشائع في المناهج التعليمية لعدة دول عربية لتمثيل المفهوم ذاته (الارتباط والتبعية)."
      step05_citation: "مصدر: معرفة لغوية وتخصصية"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز مصطلح (الاقتران) على دلالة الربط والجمع بين عناصر المنطلق والمستقر، ويُستخدم كمرادف دقيق في السياقات الرياضية والتعليمية."
      example: "يُعرَّف الاقتران بأنه علاقة رياضية تربط كل عنصر في المجال بعنصر واحد في المدى."
      actions:
        - command: create_entry
          params:
            lemma: "اِقْتِرَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13803376-n"

  synset_flags:
