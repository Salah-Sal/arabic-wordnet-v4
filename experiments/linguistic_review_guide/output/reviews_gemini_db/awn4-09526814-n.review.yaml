step0_evidence:
  per_lemma:
    - lemma: "طبيعة"
      confirm:
        - text: "«الطبيعة: ... «ج» قوَّة خلّاقة ومهيمنة في الكون.»"
          source: "المورد الحديث"
        - text: "«والطبيعة في اصطلاح العلماء تطلق على معان. منها مبدأ أول لحركة ما هي فيه وسكونه بالذات لا بالعرض.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«والطبيعة في أكثر استعمالاتها مقيّدة بعدم الإرادة.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تحديد قيد 'عدم الإرادة' في التصور الفلسفي للطبيعة كعامل مسبب."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "طبيعة طابعة"
      source_section: "step7_english_bridge"
      evidence_citation: "«طبيعة طابعة — naturing nature» — مسرد الفلسفة وعلم النفس (ArabTerm)"
      justification: "مصطلح فلسفي دقيق يعبر عن الطبيعة بوصفها قوة خالقة وفاعلة (Natura naturans)، وهو ما يطابق تماماً تعريف المجموعة (causal agent)."
  knowledge_candidates:
    - lemma: "قوة خلاقة"
      justification: "وردت في المعاجم (المورد) كمرادف دلالي لوصف الطبيعة في هذا السياق، وإن كانت أقرب للوصف منها للاسم الجامد."
      mechanism: "مجاز"

step1_lemma_validation:
  per_lemma:
    - lemma: "طبيعة"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والشائع للمفهوم، وموثق في المعاجم الحديثة والقديمة بهذا المعنى الفلسفي/الكوني."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الاسم العام الذي يشمل القوة المحركة للكون بمفهومها الواسع."
      example: "يؤمن بعض الفلاسفة أن الطبيعة هي القوة التي تمنح الأشياء خصائصها الجوهرية وتتحكم في نموها."
    
    - lemma: "طبيعة طابعة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح اصطلاحي (MWE) فني دقيق مستعمل في السياقات الفلسفية للتمييز بين الطبيعة كـ 'فاعل' (طابعة) والطبيعة كـ 'مفعول' (مطبوعة)."
      step05_citation: "«طبيعة طابعة — naturing nature» — مسرد الفلسفة وعلم النفس"
      mwe_check:
        is_mwe: true
        accepted: true
        type: "وصفي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تخصيص الجانب الفاعلي/السببي للطبيعة (Active nature) تمييزاً لها عن المادة المخلوقة."
      example: "تعتبر الطبيعة الطابعة في الفكر السبينوزي هي المبدأ المنتج لكل الوجود."
      actions:
        - command: create_entry
          params:
            lemma: "طبيعة طابعة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09526814-n"

    - lemma: "قوة خلاقة"
      source: step05
      decision: removed
      decision_reason: "تعبير وصفي حر (Free phrase) وليس مصطلحاً معجمياً مستقراً لهذه المجموعة، رغم وروده في تعريفات المعاجم."
      step05_citation: "«قوة خلّاقة؛ سلطة حاسمة» — المورد الحديث"

