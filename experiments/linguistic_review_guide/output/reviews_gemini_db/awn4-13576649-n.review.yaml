step0_evidence:
  per_lemma:
    - lemma: "تحديد"
      confirm:
        - text: "«عمليةُ تَحديد أَو تأكيد الحدودِ وامتداد بَعْض الأنسجة...»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"
        - text: "«وضع حدود شيء ما.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«عملية تروم تحديد الوحدات الصغرى بتقطيع السلسلة الكلامية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "تحديد الحدود الفاصلة بين الوحدات اللغوية"

    - lemma: "تشكيل"
      confirm:
        - text: "«إعطاء المنتج شكلاً معيناً بوضعه في قالب.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
        - text: "«قَوَلَبَةُ الموادِّ المُنْصَهِرَةِ فى عملياتِ السَّبْكِ وغيرها.»"
          source: "المعجم الكبير"
        - text: "«تشكيل سطح التربة أو الطريق لإعطائه المنسوب الصحيح.»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
      expands:
        - text: "«إدخالُ موجة تحمل خصائص الصوت أو الصورة على موجة أخرى... ينتج عنه تغيرُ هذه الموجة فى اتساع ذبذبتها...»"
          source: "المعجم الكبير"
          addition: "التشكيل بمعنى التعديل الموجي (Modulation)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نحت"
      source_section: "step4_fts_keyword"
      evidence_citation: "«عالج بغية إعطاء شكل معين؛ نحو: نحت كتلة رخام» — معجم الصواب اللغوي"
      justification: "عملية فيزيائية تهدف مباشرة إلى إعطاء شكل محدد للمادة."
    - lemma: "قولبة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«إعطاء المنتج شكلاً معيناً بوضعه في قالب» — المعجم الموحد لمصطلحات تقانات الأغذية"
      justification: "عملية حصر المادة في قالب لتحديد شكلها النهائي."
  knowledge_candidates:
    - lemma: "صياغة"
      justification: "آلية: مجاز. تعبر عن تهيئة الشيء على مثال أو هيئة محددة، وتستخدم في المعنويات والماديات (صياغة الحلي)."

step1_lemma_validation:
  per_lemma:
    - lemma: "تحديد"
      decision: confirmed
      decision_reason: "مصطلح مركزي يعبر عن عملية وضع الحدود والتعريف (defining)."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب الذهني أو المعياري في رسم الحدود والمواصفات (defining/delimiting)."
      example: "تتطلب الهندسة الدقيقة تحديد أبعاد كل قطعة بدقة متناهية."

    - lemma: "تشكيل"
      decision: confirmed
      decision_reason: "مصطلح دقيق يعبر عن منح المادة هيئة محسوسة (shaping)."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب الفيزيائي أو العملي في إعطاء الهيئة الخارجية للمادة (physical shaping)."
      example: "تبدأ عملية تشكيل الفخار بوضع الصلصال على عجلة الخزاف."

    - lemma: "صياغة"
      source: step05
      decision: confirmed
      decision_reason: "تؤدي معنى التشكيل والتهيئة في سياقات فنية ومعنوية مستقرة."
      step05_citation: "«الصياغة: هيأه على مثال» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على الإخراج الفني أو المنطقي للشيء في قالب محكم (fashioning/formulating)."
      example: "تستغرق صياغة الوثيقة القانونية وقتاً طويلاً لضمان دقة المصطلحات."

    - lemma: "نحت"
      source: step05
      decision: removed
      decision_reason: "عملية نوعية خاصة بالمواد الصلبة (حجر، خشب) وليست عملية عامة للتعريف أو التشكيل."
      step05_citation: "«نحت الحجر: براه بغية إعطاء شكل معين» — المعجم المعاصر"

    - lemma: "قولبة"
      source: step05
      decision: removed
      decision_reason: "عملية تقنية محددة باستخدام القالب (moulding)، وهي فرع من التشكيل وليست مرادفاً عاماً."

