step0_evidence:
  per_lemma:
    - lemma: "شخص معروف"
      evidence_status: "no_material_found"
    - lemma: "معارف"
      confirm:
        - text: "«وهو من المعارف: من المعروفين»"
          source: "المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مَعْرِفَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) معرفة؛ خبرة (2) المام؛ معرفة سطحية (3) احد معارف المرء.» — المورد الحديث"
      justification: "الترجمة المباشرة للكلمة الإنجليزية 'acquaintance' بمعنى الشخص الذي تعرفه."
  knowledge_candidates:
    - lemma: "مَعْرُوف"
      justification: "مجاز: إطلاق اسم المفعول للدلالة على من وقعت عليه المعرفة، فيقال 'هذا وجه معروف'."

step1_lemma_validation:
  per_lemma:
    - lemma: "شخص معروف"
      decision: removed
      decision_reason: "تركيب وصفي حر (نعت ومنعوت) وليس مصطلحاً مسكوكاً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "مرفوضة لعدم التقييد الاصطلاحي، فهي وصف عام."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "معارف"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل للدلالة على الأشخاص الذين نعرفهم، وجاء بصيغة الجمع للدلالة على الكثرة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الجمع والكثرة للأشخاص الذين تربطك بهم علاقة سطحية."
      example: "دعا إلى حفل زفافه الأهل وعدداً كبيراً من المعارف."
    - lemma: "مَعْرِفَة"
      source: step05
      decision: confirmed
      decision_reason: "المصطلح المفرد الأدق للتعبير عن الشخص الذي تعرفه معرفة سطحية."
      step05_citation: "«احد معارف المرء» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على المفرد المذكر والمؤنث، وهي الأصل في الدلالة على الشخص المعروف."
      example: "التقيت به صدفة، وهو معرفة قديمة من أيام الجامعة."
      actions:
        - command: create_entry
          params:
            lemma: "مَعْرِفَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09783207-n"
  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "مَعْرِفَة"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

step3_definition:
  definition_review_flag: true
  current_definition: "شخص تعرفه (وليس صديقاً مقرباً)"
  assessment:
    decision: revise
    reason: "التعريف الحالي صياغته أقرب إلى الشرح العام، ويمكن جعله معجمياً أدق."
  authored_definitions:
    - type: terminological
      text: "شخص تربطك به صلة أو معرفة دون أن يصل إلى مرتبة الصداقة المقربة."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09783207-n"
        definition_index: 0
        text: "شخص تربطك به صلة أو معرفة دون أن يصل إلى مرتبة الصداقة المقربة."

