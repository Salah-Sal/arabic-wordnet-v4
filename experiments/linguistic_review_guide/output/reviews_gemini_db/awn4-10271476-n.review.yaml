  assessment:
    decision: revise
    reason: "التعريف الأصلي مترجم بحرفية ('كما من معلم' و'المعتقدات') وتبدو صياغته ركيكة في العربية."
  authored_definitions:
    - type: terminological
      text: "شخص يتلقى العلم ويدرس على يد معلم، أو يسعى بنفسه لتحصيل المعرفة واكتساب المهارات."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
