step0_evidence:
  per_lemma:
    - lemma: "تلميذ"
      confirm:
        - text: "«خادمُ الأستاذ من أهل العِلم أو الفنِّ أو الحِرْفَة طالبُ العِلم , وخَصَّه أهلُ العَصْر بالطالب الصغير»"
          source: "المعجم الكبير"
    - lemma: "طالب"
      confirm:
        - text: "«المتعلم الذي يسعى إلى تحصيل العلم, ويطلق عرفا على التلميذ في مرحلتي التعليم الثانوية والعالية.»"
          source: "المعجم الكبير"
    - lemma: "متعلم"
      confirm:
        - text: "«تسمية تطلق على الفرد الذي يتعلم موضوعا معينا أو مهارة معينة أو كيفية القيام بشيء ما.»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (2020)"
        - text: "«المتعلم؛ التلميذ؛ الطالب المبتدئ.»"
          source: "المورد الحديث (2008)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "متمدرس"
      source_section: "step5_english_bridge"
      evidence_citation: "«المتمدرس في المدرسة» — المعرفة اللغوية"
      justification: "اشتقاق: اسم فاعل لمن ينخرط في مدرسة."
  knowledge_candidates:
    - lemma: "دارس"
      justification: "اشتقاق: اسم فاعل على وزن فاعل لمن يقوم بفعل الدراسة، وهو يعبر عن الطالب الذي يدرس علماً أو تخصصاً."
  generation_notes: "تم التركيز على الاشتقاق للتعبير عن مفهوم المتعلم."

step1_lemma_validation:
  per_lemma:
    - lemma: "تلميذ"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع للدلالة على المتعلم وخاصة في المراحل الأولى."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يغلب إطلاقه على الصغار في مراحل التعليم الأولى، أو على من يتلقى العلم مباشرة من أستاذ فيتبعه."
      example: "راقب المعلم تلاميذه وهم يؤدون الاختبار بتركيز."
    - lemma: "طالب"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر للدلالة على المتعلم، ويغلب على المراحل المتقدمة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يغلب إطلاقه على من يسعى لتحصيل العلم في المراحل المتقدمة كالثانوية والجامعة، وفيه معنى السعي والطلب المستقل."
      example: "تخرج الطالب من الجامعة بتقدير ممتاز."
    - lemma: "متعلم"
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر عن اكتساب العلم بشكل عام."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "صفة عامة تطلق على كل من يكتسب معرفة أو مهارة بغض النظر عن سنه أو مرحلته الدراسية، أو من نال قسطاً من التعليم مقابل الأمي."
      example: "يجب على المتعلم أن يوظف ما اكتسبه من معرفة في خدمة مجتمعه."
    - lemma: "دارس"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح دقيق وفصيح يعبر عن الانخراط في دراسة موضوع أو منهج."
      step05_citation: "«دارس من الجذر درس» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على فعل الدراسة والتأمل في الكتب أو المناهج المحددة، ويطلق على المنخرط في دراسة موضوع معين."
      example: "عكف الدارس على مراجعة المصادر التاريخية لإنجاز بحثه."
      actions:
        - command: create_entry
          params:
            lemma: "دارس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10271476-n"
  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "دارس"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

