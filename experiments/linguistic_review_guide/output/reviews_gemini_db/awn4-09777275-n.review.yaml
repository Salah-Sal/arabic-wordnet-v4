step0_evidence:
  per_lemma:
    - lemma: "عَازِف عَنِ الْكُحُول"
      evidence_status: "no_material_found"
    - lemma: "مُمْتَنِع"
      contradicts:
        - text: "«المُمْتَنِعُ: مَا اقْتَضَت ذَاته عدم وجوده فِي الْخَارِج» — معجم مقاليد العلوم للسيوطي"
          conflict: "المعنى الفلسفي يشير إلى المستحيل عقلاً وليس الشخص الممتنع عن الشرب."
      expands:
        - text: "«ممتنِع (abstentionist)» — المعجم الموحد لمصطلحات القانون (2017)"
          addition: "استخدام عام في القانون للامتناع (كالتصويت) وليس خاصاً بالمسكرات."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُمْسِك عَنِ الْمُسْكِرَات"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) المُمْسِك [عن المُسْكرات] (2) المُمتنِع.» — المورد الحديث (2008)"
      justification: "تركيب وصفي ورد في المعاجم الثنائية كترجمة لمفهوم abstainer، وهو يسد الفجوة المعجمية للفظ المفرد."
  knowledge_candidates:
    - lemma: "تَارِكُ الْخَمْرِ"
      justification: "تركيب إضافي (اسم فاعل + مضاف إليه) دقيق وموجز يعبر عن المفهوم بوضوح، وهو جارٍ على سنن العربية في بناء الصفات الملازمة للمتروك."

step1_lemma_validation:
  per_lemma:
    - lemma: "عَازِف عَنِ الْكُحُول"
      decision: removed
      decision_reason: "تركيب وصفي حر غير دقيق، فاستخدام 'عازف' يوحي بالنفور العاطفي (averse) وليس بالضرورة الامتناع المبدئي عن الشرب."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "تعبير حر عن حالة نفسية وليس مصطلحاً مسكوكاً."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "مُمْتَنِع"
      decision: removed
      decision_reason: "لفظ عام يدل على الامتناع عن أي شيء (كالتصويت أو العمل)، ولا يختص بالمسكرات إلا بقرينة، ووجوده مفرداً يجعله مبهماً وموقعاً في الاشتراك اللفظي."
      evidence_assessment:
        case: "contradicts"
      substitution_test:
        result: "fail"
      nuance_differentiation: "مطلق الامتناع دون تخصيص بمفعول."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "مُمْسِك عَنِ الْمُسْكِرَات"
      source: step05
      decision: confirmed
      decision_reason: "تعبير اصطلاحي (مركب وصفي) ورد في المعاجم الحديثة لسد الفجوة المعجمية للتعبير عن المفهوم بدقة."
      step05_citation: "«(1) المُمْسِك [عن المُسْكرات] (2) المُمتنِع.» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير يركز على الامتناع كحالة مستمرة (الإمساك) ويسد الفجوة المعجمية للفظ المفرد."
      example: "عُرف في أوساط أصدقائه بأنه ممسك عن المسكرات التزاماً بنظام صحي صارم."
      actions:
        - command: create_entry
          params:
            lemma: "مُمْسِك عَنِ الْمُسْكِرَات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09777275-n"
    - lemma: "تَارِكُ الْخَمْرِ"
      source: step05
      decision: confirmed
      decision_reason: "تركيب إضافي دقيق جارٍ على سنن العربية ويعبر عن المفهوم بوضوح ويسد الفجوة المعجمية."
      step05_citation: "اقتراح لغوي (تركيب إضافي)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركيب إضافي يركز على فعل الترك المباشر للمادة المسكرة."
      example: "أصبح تارك الخمر قدوة لغيره في التعافي من الإدمان."
      actions:
        - command: create_entry
          params:
            lemma: "تَارِكُ الْخَمْرِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09777275-n"
  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "مُمْسِك عَنِ الْمُسْكِرَات"
      reason: "مصدر: الخطوة ٠٫٥"
