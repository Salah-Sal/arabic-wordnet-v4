step0_evidence:
  per_lemma:
    - lemma: "خَارِج عَنِ الطَّبَقَة"
      evidence_status: "no_material_found"
    - lemma: "مَنْبُوذ"
      confirm:
        - text: "«المنبوذ: «أ» هنديّ مطرودٌ من طائفته أو طبقتِهِ لخَرْقِهِ تقاليدَها أو أنظمتها. «ب» مَن لا طائفة أو طبقة له.»"
          source: "المورد الحديث (2008)"
        - text: "«المنبوذ: «أ» عضوٌ في طبقة اجتماعية دُنيا في بورما وجنوبيّ الهند.»"
          source: "المورد الحديث (2008)"
        - text: "«والمنبوذون طَائِفَة فِي الْهِنْد يتجنبهم الْمُجْتَمع الْهِنْدِيّ ويزدريهم لضعتهم وفقرهم وهوانهم على الله فِي أصل الْخلقَة فِيمَا يَزْعمُونَ (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«منبوذ: outcaste, pariah»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (موقع ArabTerm)"

step05_lemma_generation:
  knowledge_candidates:
    - lemma: "لا طَبَقِيّ"
      justification: "الاشتقاق (بإضافة لا النافية وياء النسب) للتعبير عن الشخص الذي لا ينتمي لطبقة، على غرار (لا سلكي، لا منتمٍ)."
  generation_notes: "تشير الأدلة المعجمية الإنجليزية-العربية بوضوح إلى مصطلح (منبوذ) كترجمة مستقرة لـ (outcaste) و(pariah)، ونظراً لأنها لمة موجودة مسبقاً، تم التركيز على توليد بدائل قياسية كمرشحات للاختبار."

step1_lemma_validation:
  per_lemma:
    - lemma: "خَارِج عَنِ الطَّبَقَة"
      decision: removed
      decision_reason: "تركيب وصفي حر وترجمة حرفية عمياء (Blind Literal) للمصطلح الإنجليزي (outcaste)، وليس مصطلحاً مسكوكاً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "وصف لحالة الشخص وليس اسماً للكيان أو المفهوم المستقر."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    
    - lemma: "مَنْبُوذ"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر في الاستعمال التخصصي لترجمة مفهوم (outcaste) أو (pariah)، وله شواهد معجمية قوية في المعاجم الحديثة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح الأساسي والمستقر للتعبير عن الشخص الذي لا ينتمي لأي طبقة أو يُطرد منها، وبخاصة في السياق الهندي."
      example: "يعاني المنبوذون في بعض المجتمعات التقليدية من التهميش المستمر والإقصاء الاجتماعي."
      actions: []

    - lemma: "لا طَبَقِيّ"
      source: step05
      decision: removed
      decision_reason: "المصطلح يُستعمل عادة لوصف المجتمع (مجتمع لا طبقي classless) وليس للفرد المطرود من الطبقة (outcaste)، لذا قد يسبب لبساً دلالياً كبيراً."
      step05_citation: "مرشح معرفي (استنتاج)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "يصف طبيعة النظام الاجتماعي (غياب الطبقات) أكثر من وصفه للفرد المعزول عن الطبقة."

  synset_flags:
    definition_review_needed: false

