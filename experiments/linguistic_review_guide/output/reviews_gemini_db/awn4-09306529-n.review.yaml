step0_evidence:
  per_lemma:
    - lemma: "مخاضة"
      confirm:
        - text: "«موضعُ الخَوْضِ فى الماءِ, كالمَخاضِ ما جازَ فيه النَّاسُ مُشاةً ورُكْبانًا (فى الجغرافيا) Fard: الجُزْءُ الضِّحْلُ من مَجْرَى النَّهْر ــ أو من أىِّ سَطْحٍ مائِيٍّ ــ يُمْكِنُ عُبُورُه بالقَدَمِ»"
          source: "المعجم الكبير"
      expands:
        - text: "«من النهر الكبير: المَخاض»"
          source: "المعجم الوسيط"
    - lemma: "معبر"
      contradicts:
        - text: "«ما يُعْبَر به النهر من قنطرة أو سفينة الشَّطُّ المهيَّأ للعبور»"
          source: "المعجم الوسيط"
          conflict: "المعبر يشير إلى أداة العبور (قنطرة أو سفينة) أو المكان المهيأ مطلقاً، ولا يقتصر على الموضع الضحل الذي يُخاض بالأقدام."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مخاض"
      source_section: "step0_evidence"
      evidence_citation: "«من النهر الكبير: الموضع القليل الماء الذى يعبر فيه الناسُ النهرَ مُشاةً ورُكباناً» — المعجم الوسيط"
      justification: "ورد في المعاجم كمرادف مباشر لمعنى المخاضة، مشتق من جذر (خوض) ليدل على مكان الخوض."
  knowledge_candidates:
    - lemma: "مجازة"
      justification: "اسم مكان من (جاز) بمعنى عبر (اشتقاق)، وقد ورد في بعض المعاجم المتخصصة كمرادف، إلا أن (مخاضة) أدق وألصق بالمعنى."
  generation_notes: "التركيز على الجذر (خوض) لكونه يعبر بدقة عن الحركة في الماء الضحل."

step1_lemma_validation:
  per_lemma:
    - lemma: "مخاضة"
      decision: confirmed
      decision_reason: "مصطلح دقيق ومستقر جغرافياً ولغوياً للتعبير عن الموضع الضحل من النهر الذي يمكن خوضه."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل تحديداً على الموضع الضحل من النهر الذي يُعبر سيراً أو بالدواب (خوضاً)."
      example: "عبرت القافلة النهر من المخاضة لانخفاض منسوب المياه فيها."

    - lemma: "معبر"
      decision: removed
      decision_reason: "مصطلح عام يشير لأي وسيلة أو مكان مهيأ للعبور (جسر، قارب، نفق) ولا يختص بالموضع الضحل المائي."
      evidence_assessment:
        case: "contradicts_only"
      substitution_test:
        result: "fail"
      nuance_differentiation: "أعم دلالة، يشمل أي وسيلة أو نقطة عبور ولا يفيد معنى الخوض بالقدم."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مخاض"
      source: step05
      decision: confirmed
      decision_reason: "مرادف فصيح ومسجل معجمياً يؤدي نفس المعنى الدقيق للمخاضة."
      step05_citation: "«من النهر الكبير: الموضع القليل الماء الذى يعبر فيه الناسُ النهرَ مُشاةً ورُكباناً» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مذكر (مخاضة) ويحمل الدلالة نفسها على مكان الخوض."
      example: "تلمس القوم مخاضاً آمناً في النهر ليعبروا منه."
      actions:
        - command: create_entry
          params:
            lemma: "مخاض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09306529-n"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
