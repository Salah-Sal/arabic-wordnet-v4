        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بالذي يعطي الشيء تمليكاً بلا عوض أو مقابل."
      example: "الله هو الواهب الذي يرزق عباده بغير حساب."
    - lemma: "مُعْطٍ"
      source: step05
      decision: confirmed
      decision_reason: "مرادف دقيق وأشمل من سابقيه، مشتق من الفعل الوارد في التعريف ذاته."
      step05_citation: "«المُعْطي؛ المانح؛ الواهب» — المورد الحديث"
