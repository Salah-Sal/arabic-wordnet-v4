step0_evidence:
  per_lemma:
    - lemma: "مَانِح"
      confirm:
        - text: "«منَحَ يَمنَح، مَنْحًا، فهو مانِح، والمفعول مَمْنوح»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«شخصي يعطي أنسجته أو دمه لغيره.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
    - lemma: "وَاهِب"
      confirm:
        - text: "«وَاهِب: من (و ه ب) الذي يعطي الشيء بلا عوض.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«وهَبَ يهَب، هَبْ، هِبَةً ووَهْبًا، فهو واهِب»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«الشخص الذي يهب شيئا للموهوب له بدون عوض»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُعْطٍ"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُعْطي؛ المانح؛ الواهب» — المورد الحديث"
      justification: "اشتقاق اسم الفاعل من الفعل أعطى المذكور في التعريف، وهو مرادف مباشر."
    - lemma: "مُتَبَرِّع"
      source_section: "step5_english_bridge"
      evidence_citation: "«مُتَبَرِّع ؛ مانِح ؛ مُعْطٍ» — المعجم الطبي الموحد"
      justification: "استخدام شائع للدلالة على من يمنح شيئاً (كالدم أو المال) طوعاً، لكنه يحمل طابعاً تخصصياً."
  knowledge_candidates: []

