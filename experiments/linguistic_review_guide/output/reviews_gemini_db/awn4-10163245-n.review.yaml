        result: "pass"
      nuance_differentiation: "اللفظ الأعم والأشمل لأي نوع من أنواع البذل والمناولة والتمليك، دون قيد عدم العوض بالضرورة."
      example: "كان الشيخ معطياً للفقراء والمساكين لا يرد سائلاً."
