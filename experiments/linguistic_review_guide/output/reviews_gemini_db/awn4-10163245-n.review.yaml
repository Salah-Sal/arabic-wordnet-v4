      source: step05
      decision: removed
      decision_reason: "يحمل دلالة أضيق تتعلق بالمنح الطوعي في السياقات الخيرية أو الطبية، ولا يطابق العموم في التعريف."
      step05_citation: "«مُتَبَرِّع ؛ مانِح ؛ مُعْطٍ» — المعجم الطبي الموحد"

  added_lemmas:
