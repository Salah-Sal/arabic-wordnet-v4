      justification: "وردت كمرادف مباشر للخصلة في أغلب المعاجم الكلاسيكية."
  knowledge_candidates:
    - lemma: "سجية"
      justification: "السجية هي الطبيعة والخلق الذي جبل عليه الإنسان، وهي تناسب 'طبيعتك الشخصية'. (آلية التوليد: إحياء لفظ تراثي)."
    - lemma: "طابع"
      justification: "الطابع هو الخلق الغالب والسمة المميزة التي تطبع الشخصية. (آلية التوليد: اشتقاق من الجذر ط-ب-ع)."
    - lemma: "طبع"
      justification: "الطبع هو ما جبل عليه الإنسان من أخلاق وسجايا لا تزول. (آلية التوليد: اشتقاق من الجذر ط-ب-ع)."
  generation_notes: "تم استبعاد 'منزع' لكونه يشير إلى الميل أو المذهب أكثر من السمة الثابتة."

