step0_evidence:
  per_lemma:
    - lemma: "خصلة"
      confirm:
        - text: "«الخَصْلَةُ: الخَلَّةُ، والفَضيلَةُ، والرَّذيلَةُ، أو قد غَلَبَ على الفَضيلَةِ»"
          source: "القاموس المحيط"
        - text: "«خلق فِي الْإِنْسَان يكون فَضِيلَة أَو رذيلة»"
          source: "المعجم الوسيط"
        - text: "«الخَلَّةُ, وهى الصِّفَةُ, فَضِيلةً كانت أو رَذِيلَةً, تكون فى الإنسان»"
          source: "المعجم الكبير"
      expands:
        - text: "«كانت فيه خصلةٌ من خِصال النِّفاق»"
          source: "المعجم الوسيط (حديث)"
    - lemma: "سمة"
      confirm:
        - text: "«سمة: trait»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا"
        - text: "«سمة: هيئة، طريقة air, maniére»"
          source: "تكملة المعاجم العربية (دوزي)"
      expands:
        - text: "«مَا وسم بِهِ الْحَيَوَان من ضروب الصُّور والعلامة»"
          source: "المعجم الوسيط"
          addition: "يشير إلى الأصل المادي للكلمة كعلامة أو أثر."
    - lemma: "صفة"
      confirm:
        - text: "«الصِّفَةُ: الحالةُ التي يكون عليها الشيءُ من حِلْيَته ونَعْتِه»"
          source: "المعجم الوسيط"
        - text: "«صفة: character; trait»"
          source: "معجم علم الوراثة"
      expands:
        - text: "«الاسم الدال على بعض أحوال الذات، وذلك نحو طويل وقصير وعاقل وأحمق»"
          source: "التوقيف على مهمات التعاريف"

