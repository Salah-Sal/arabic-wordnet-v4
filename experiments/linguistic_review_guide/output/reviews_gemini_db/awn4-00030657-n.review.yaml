step0_evidence:
  per_lemma:
    - lemma: "فِعْل"
      confirm:
        - text: "«الفِعْلُ: حَرَكَةُ الإِنْسانِ، أو كِنايةٌ عن كُلِّ عَمَلٍ مُتَعَدٍّ»"
          source: "القاموس المحيط"
        - text: "«الفِعْل: العَمَل»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الفعل التأثير من جهة مؤثر، وهو عام لما كان في الإنسان والحيوان والجماد»"
          source: "التوقيف على مهمات التعاريف"
          addition: "تعميم الفعل ليشمل الجمادات والحيوانات"

    - lemma: "عَمَل بَشَرِيّ"
      confirm:
        - text: "«عمل تجاريّ: عمل يقوم به التاجر» — «عمل إنسانيّ: Humanitarian act»"
          source: "المعجم الموحد لمصطلحات القانون"
        - text: "«تعرُّف على الأفعال البشرية: Human Action Recognition»"
          source: "معجم البيانات والذكاء الاصطناعي"

    - lemma: "نَشَاط إِنْسَانِيّ"
      confirm:
        - text: "«نشاط بشري: human activity»"
          source: "مسرد الجغرافيا والتاريخ"
        - text: "«تعرُّف على النشاط البشري: Human Activity Recognition»"
          source: "معجم البيانات والذكاء الاصطناعي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "صَنِيع"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) عَمَلٌ؛ فِعْل؛ صنيع» — المورد الحديث (ترجمة act)"
      justification: "كلمة تراثية حية تدل على الفعل وما يُصنع، وتناسب المفهوم تماماً."
    - lemma: "تَصَرُّف"
      source_section: "step5_english_bridge"
      evidence_citation: "«تصرُّف قانونيّ: legal act» — المعجم الموحد للقانون"
      justification: "يدل على السلوك أو الفعل الصادر عن إرادة، وهو مستعمل بكثرة."
  knowledge_candidates:
    - lemma: "عَمَل"
      justification: "اللفظ الأكثر شيوعاً وبساطة للدلالة على الفعل البشري (human action/act)."
  generation_notes: "تم التركيز على الألفاظ التي تجمع بين الدقة المعجمية والشيوع الاستعمالي."

