step05_lemma_generation:
  evidence_candidates:
    - lemma: "بَوَّاب"
      source_section: "step5_english_bridge"
      evidence_citation: "«البوّاب.» — المورد الحديث (2008)"
      justification: "ترجمة مباشرة لمصطلح gatekeeper، وتدل بصيغة المبالغة على من يتولى وظيفة المراقبة والحراسة للباب أو المدخل."
  knowledge_candidates:
    - lemma: "حَاجِب"
      justification: "مجاز (إزاحة دلالية). نُقلت دلالة المنع من الرؤية (حجب) إلى منع الدخول والوصول، وأطلقت على من يقف على الباب وينظم الدخول (حاجب الأمير)، وهو لفظ تراثي أصيل يطابق المفهوم."

step1_lemma_validation:
  per_lemma:
    - lemma: "حَارِس الْبَوَّابَة"
      decision: confirmed
      decision_reason: "اقتراض مفهومي (Calque) من الإنجليزية 'gatekeeper'، شاع استخدامه في السياقات الإدارية والإعلامية والتقنية الحديثة (مثل 'نظرية حارس البوابة') للدلالة على المتحكم في الوصول إلى الموارد."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يميل للاستعمال المجازي في السياقات التقنية والإعلامية، بخلاف (البواب) الذي يغلب عليه المعنى الحسي."
      example: "يقوم مدير الشبكة بدور حارس البوابة في التحكم في وصول الموظفين إلى البيانات الحساسة."

    - lemma: "مُرَاقِب الدُّخُول"
      decision: removed
      decision_reason: "تركيب وصفي حر يفتقر للتثبيت المعجمي، ويمكن استبداله بعبارات عديدة مثل 'متحكم في الوصول' أو 'منظم الدخول'، ولا يرقى لمستوى المصطلح المسكوك."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "وصف عام للوظيفة وليس مصطلحاً مستقراً."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "بَوَّاب"
      source: step05
      decision: confirmed
      decision_reason: "لفظ عربي فصيح مطرد ومستعمل، يدل على المهنة بصيغة المبالغة والنسب (فعَّال)، ويطابق المفهوم بدقة."
      step05_citation: "«البوّاب.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشيع في الاستعمال المادي والحسي (من يحرس الباب الفعلي)، ويمثل الأصل العربي للمفهوم."
      example: "وقف البواب على مدخل المبنى يتأكد من هويات الزوار قبل السماح لهم بالدخول."
      actions:
        - command: create_entry
          params:
            lemma: "بَوَّاب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10141785-n"

    - lemma: "حَاجِب"
      source: step05
      decision: confirmed
      decision_reason: "لفظ عربي تراثي فصيح ومستعمل، ينقل المعنى الدلالي للمنظم والمتحكم في الدخول، ويفضل في السياقات الرسمية."
      step05_citation: "«حاجب الأمير: بوّابه» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يحمل دلالة رسمية وتراثية (غالباً للجهات العليا والمسؤولين)."
      example: "أمر الملك حاجبه بأن يأذن للوفد بالدخول إلى المجلس."
      actions:
        - command: create_entry
          params:
            lemma: "حَاجِب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10141785-n"

  added_lemmas:
    - lemma: "بَوَّاب"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "حَاجِب"
