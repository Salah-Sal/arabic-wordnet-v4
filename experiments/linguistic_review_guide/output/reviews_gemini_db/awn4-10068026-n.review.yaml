step0_evidence:
  per_lemma:
    - lemma: "أَكْبَر سِنّاً"
      evidence_status: "no_material_found"
    - lemma: "مُسِنّ"
      contradicts:
        - text: "«من بدتْ عليه أعراضُ الشَّيخوخة أو الهِرَم» — المعجم الكبير"
          conflict: "المدخل يصف حالة الشيخوخة المطلقة، بينما تعريف المجموعة يركز على الكبر النسبي (أكبر منك وإن لم يكن شيخاً)."
        - text: "«بضم الميم وكسر السين هو ما دخل في السّنة الثالثة مأخوذ من الأسنان وهو طلوع السّنّ في هذه السّنة» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المدخل يصف بلوغ سن متقدمة للحيوان ولا يعكس الدلالة النسبية الواردة في التعريف."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "أَسَنّ"
      source_section: "step5_english_bridge"
      evidence_citation: "«الأرشد؛ الأسنّ (elder)» — المورد الحديث"
      justification: "اسم تفضيل من الجذر (سنن) يعبر بدقة عن الكبر النسبي في العمر مقارنة بشخص آخر، وهو مطابق للتعريف."
    - lemma: "أَرْشَد"
      source_section: "step5_english_bridge"
      evidence_citation: "«الأرشد؛ الأكبر سنًّا (senior)» — المورد الحديث"
      justification: "لفظ يعبر عن الأكبر سناً والذي يُفترض فيه نضج العقل والرشد تبعاً لزيادة السن."
  knowledge_candidates:
    - lemma: "أَكْبَر"
      justification: "آلية التوليد: اشتقاق. استخدام لغوي أصيل (اسم تفضيل من كبر) يعبر عن من يفوق غيره في العمر، ويشيع استخدامه اسماً للدلالة على هذا المعنى (مثل: الأخ الأكبر)."
  generation_notes: "تم التركيز على أسماء التفضيل التي شاع استعمالها كأسماء للدلالة على الكبر النسبي بين شخصين، لتجاوز الخلل الدلالي في إقحام (مسن) الذي يدل على كبر مطلق."

