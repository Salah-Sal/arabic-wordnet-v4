step0_evidence:
  per_lemma:
    - lemma: "انقباض"
      confirm:
        - text: "«الانقباض: جمع الأطراف ويستعمل في ترك التبسط.» — التوقيف على مهمات التعاريف للمناوي"
          source: "التوقيف على مهمات التعاريف"
      expands:
        - text: "«حركة تقارب الحبال الصوتية دون أن تتماس بشكل تام خلال عملية التصويت» — المعجم الموحد لمصطلحات اللسانيات"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "معنى تقني في اللسانيات (Adduction)"
        - text: "«قصر في طول عضلة ما» — معجم المصطلحات الطبية"
          source: "معجم المصطلحات الطبية"
          addition: "معنى طبي (Contraction)"

    - lemma: "كآبة"
      confirm:
        - text: "«الحزن الشديد» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«جاهزية الرّوح للحزن دون سبب مُباشر، وهي حافز أدبي للإلهام المشترك» — المعجم الموحد لمصطلحات اللسانيات"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      contradicts:
        - text: "«كابة: موضع في بلاد تميم» — معجم البلدان"
          source: "معجم البلدان"
          conflict: "اسم علم لمكان (Toponym) لا علاقة له بالمعنى الدلالي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "غم"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الغَمُّ: الكرب أو الحزن يحصل للقلب بسبب ما... سُمي غماً لأنه يغطي السرور» — المعجم الوسيط / التوقيف للمناوي"
      justification: "يدل على حالة من الحزن والكرب تذهب بالبهجة والسرور"
    - lemma: "كدر"
      source_section: "step4_fts_keyword"
      evidence_citation: "«كدُرت حياته: كانت بها هموم ومتاعب- كدُرت نفسُه: اغتمّ» — معجم اللغة العربية المعاصرة"
      justification: "يعبر عن تعكر صفو النفس وغياب البهجة"
  knowledge_candidates:
    - lemma: "تجهم"
      justification: "آلية التوليد: مجاز. يعبر عن الحالة النفسية المنقبضة التي تنعكس عبوساً على الوجه، مما يجعل الفرد غير مرح (uncheerful)"
    - lemma: "عبوس"
      justification: "آلية التوليد: اشتقاق. صفة تدل على انقباض الوجه والضيق، وهي مرتبطة ارتباطاً وثيقاً بقلة البهجة"

step1_lemma_validation:
  per_lemma:
    - lemma: "انقباض"
      decision: confirmed
      decision_reason: "أدلة مؤكدة تشير إلى ترك التبسط، مما يطابق معنى قلة البهجة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى حالة من التحفظ النفسي والانكماش الداخلي وغياب الانشراح"
      example: "يشعر الفرد بانقباض نفسي في الأجواء المعتمة أو المغلقة."

    - lemma: "كآبة"
      decision: confirmed
      decision_reason: "أدلة معجمية صريحة تربط اللفظ بالحزن الشديد وغياب البهجة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على حزن عميق مستقر في النفس يغطي على كل مظاهر الفرح"
      example: "عاش الشاعر سنواته الأخيرة في كآبة وانعزال تام عن الناس."

    - lemma: "غم"
      source: step05
      decision: confirmed
      decision_reason: "مرادف قوي يدل على الحزن الساتر للسرور، وهو مستقر في المعاجم"
      step05_citation: "«الغَمُّ: الكرب أو الحزن... لأنه يغطي السرور» — التوقيف للمناوي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز بدلالة التغطية والإطباق على القلب، مما يمنع نفوذ البهجة"
      example: "بدد العلم اليقين كل ما خالط قلبه من شك وغم."
      actions:
        - command: create_entry
          params:
            lemma: "غم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04638655-n"

    - lemma: "كدر"
      source: step05
      decision: confirmed
      decision_reason: "يعبر عن تعكر صفو الحياة والنفس، وهو مقابل دقيق لغياب الروح المعنوية الجيدة"
      step05_citation: "«كدُر عيشه: كانت بها هموم ومتاعب» — مختار عمر"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى اضطراب السكينة النفسية واختلاطها بالهموم المنغصة للبهجة"
      example: "الحياة الدنيا لا تخلو من كدر ومنغصات تعكر صفو الإنسان."
      actions:
        - command: create_entry
          params:
            lemma: "كدر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04638655-n"

