      justification: "اشتقاق (اسم فاعل) من الجذر (ل ب س) للتعبير عن الشخص الذي يلبس الثياب ويتصف بصفة ما في لبسه (استخدام مباشر)."
    - lemma: "مُكْتَسٍ"
      justification: "اشتقاق (اسم فاعل) من الجذر (ك س و) للتعبير عن الشخص الذي يرتدي الكسوة."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُرْتَدٍ لِلْمَلَابِس"
      decision: removed
      decision_reason: "تركيب وصفي حر وترجمة حرفية لكلمة (dresser)، ولا يشكل وحدة معجمية مسكوكة."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "مرفوضة لعدم المعيارية."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "لَابِس"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل فصيح ومطرد الاستعمال للتعبير عن الشخص من حيث طريقته في اللبس."
      step05_citation: "معرفة لغوية — اشتقاق"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام والمباشر الدال على من يرتدي الثياب وطريقته في ذلك."
      example: "كَانَ فِي شَبَابِهِ لَابِساً أَنِيقاً يَخْطَفُ الْأَنْظَارَ."
      actions:
        - command: create_entry
          params:
            lemma: "لَابِس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10052950-n"
    - lemma: "مُكْتَسٍ"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل فصيح الدلالة على من يلبس الكسوة."
      step05_citation: "معرفة لغوية — اشتقاق"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أكثر تكلفاً من (لابس) وتدل على التغطية بالكسوة."
      example: "رَأَيْتُهُ مُكْتَسِياً بِحُلَّةٍ زَاهِيَةٍ."
      actions:
        - command: create_entry
          params:
            lemma: "مُكْتَسٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10052950-n"
