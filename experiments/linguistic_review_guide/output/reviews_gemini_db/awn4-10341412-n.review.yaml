      justification: "التركيب الإضافي 'مجترح المعجزات' مسجل في المعاجم ثنائية اللغة ترجمةً لمصطلحات 'wonderworker' و 'thaumaturgist'، وهو تعبير فصيح بليغ يؤدي المعنى المراد."
