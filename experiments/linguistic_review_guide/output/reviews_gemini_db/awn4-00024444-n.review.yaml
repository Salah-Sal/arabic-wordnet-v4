step0_evidence:
  per_lemma:
    - lemma: "خَاصِّيَّة"
      confirm:
        - text: "«الخاصية: كلية مقولة على أفراد حقيقة واحدة فقط قولا عرضيا...»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الخاصيّة: Characteristic ،property... تستعمل في الموضع الذي يكون السبب فيه مخفيا كقول الأطباء هذا الدواء يعمل بالخاصية.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«خاصية تعطى لملف أو مجلد من طرف برنامج تطبيقي أو نظام تشغيل وتشير إلى كيفية التعامل معها.»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
      expands:
        - text: "«الخَاصِّيَّة الشَّعرِيَّة (فى الفيزيقا): ظاهرة ارتفاع السَّوائل فى بعض الأَنابِيب الشَّعرِيَّة وانخفاضِها فى البَعْض الآخر»"
          source: "المعجم الكبير"
          addition: "تخصيص المعنى في سياق الفيزياء"

    - lemma: "سِمَة"
      confirm:
        - text: "«(السمة) مَا وسم بِهِ الْحَيَوَان من ضروب الصُّور والعلامة»"
          source: "المعجم الوسيط"
        - text: "«صفة تميز ملفا أو سجلا أو حقلا وتبين نوعه أو كيفية التعامل معه، أو تبين أي معلومات عن البيانات المخزونة فيه.»"
          source: "مسرد التربية"
        - text: "«صفة أو ميزة لشيء ما بمقدور البشر أو الطُّرُق المؤتمتة التعرُّف عليها، وغالبًا ما تستخدم كمرادف لكلمة (خاصية)»"
          source: "معجم البيانات والذكاء الاصطناعي"
      contradicts:
        - text: "«(السمة) كل شَيْء كالودع يسْتَخْرج من الْبَحْر وينظم للزِّينَة...»"
          source: "المعجم الوسيط"
          conflict: "بمعنى الودع المزين، وليس التجريد الميز للكيان"
        - text: "«السِّمَّةُ: الاستُ»"
          source: "المعجم الكبير"
          conflict: "معنى تشريحي/سوقي لا علاقة له بالمفهوم المجرد"

    - lemma: "صِفَة"
      confirm:
        - text: "«الصّفة: بيان المجمل وبيان الأهلية للشيء وبيان معنى في الشيء... تطلق الصفة أيضا على المحمول على الشيء ويقابلها الذّات»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الحالةُ التي يكون عليها الشيءُ من حِلْيَته ونَعْتِه: كالسَّواد والبياض, والعلم والجهل»"
          source: "المعجم الوسيط"
        - text: "«الصفة: هي الاسم الدال على بعض أحوال الذات... وهي الأمارة اللازمة بذات الموصوف الذي يعرف بها.»"
          source: "معجم لغة الفقهاء"
      expands:
        - text: "«(عِنْد النَّحْوِيين): النَّعت, واسم الفاعل, واسم المفعول, والصفة المشبهة واسم التفضيل أيضاً»"
          source: "المعجم الوسيط"
          addition: "توسيع المعنى ليشمل المصطلحات النحوية"
      contradicts:
        - text: "«الصّفّة: الظلة والبهو الْوَاسِع العالي السّقف...»"
          source: "المعجم الوسيط"
          conflict: "بمعنى الموضع المظلل (Suffa)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "خَصِيصة"
      source_section: "step5_english_bridge"
      evidence_citation: "«خَصائصُ نوعية — character / property (attribute)» — المعجم الموحد لمصطلحات المياه"
      justification: "الخَصيصة (مفرد خصائص) مصطلح تراثي ومعاصر دقيق للدلالة على السمة المميزة للشيء."
  knowledge_candidates:
    - lemma: "مِيزة"
      justification: "توليد بالاشتقاق من (ماز - يميز)، تدل على العلامة التي يُمتاز بها الشيء عن غيره، وهي مطابقة لتعريف 'يميّزه'."
    - lemma: "خَلّة"
      justification: "توليد بإحياء الممات/التراثي، الخَلّة هي الخصلة أو السمة الثابتة في الكيان."

step1_lemma_validation:
  per_lemma:
    - lemma: "خَاصِّيَّة"
      decision: confirmed
      decision_reason: "مصطلح مركزي ومستقر في المعاجم القديمة والحديثة لوصف سمات الكيانات."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "تركز على الجانب النوعي أو الخاص الذي ينفرد به الكيان أو يتميز به في سياق علمي أو فني."
      example: "تتميز المعادن بخاصية التوصيل الكهربائي العالي."

    - lemma: "سِمَة"
      decision: confirmed
      decision_reason: "شائعة جداً في الاستعمال المعاصر والتقني لوصف الخصائص والأوصاف."
      evidence_assessment:
        case: "mixed"
        notes:
          - "يوجد اشتراك لفظي مع معانٍ محسوسة (ودع، است) لكن المعنى المقصود مؤكد في المعاجم الحديثة."
      nuance_differentiation: "غالباً ما تشير إلى العلامة الفارقة أو السمة الظاهرة التي يُعرف بها الكيان."
      example: "تعتبر السرعة سمة أساسية في المعالجات الحديثة."

    - lemma: "صِفَة"
      decision: confirmed
      decision_reason: "اللفظ العربي الأشمل والأكثر أصالة لوصف أحوال الذات والكيانات."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "أعمّ الألفاظ، تشمل كل ما يوصف به الكيان سواء كان ذاتياً أو عرضياً، مادياً أو معنوياً."
      example: "الأمانة صفة أخلاقية رفيعة."

    - lemma: "خَصِيصة"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح وعالٍ يضيف دقة للمجموعة."
      step05_citation: "«خَصائصُ نوعية» — المعجم الموحد"
      nuance_differentiation: "تؤكد على 'الاختصاص' والامتياز الدقيق الذي ينفرد به الكيان."
      example: "التفكير التجريدي خصيصة ينفرد بها الإنسان."
      actions:
        - command: create_entry
          params:
            lemma: "خَصِيصة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00024444-n"

    - lemma: "مِيزة"
      source: step05
      decision: confirmed
      decision_reason: "لفظ شائع ومناسب دلالياً للمفهوم، خاصة في سياق التمييز."
      nuance_differentiation: "تركز على جانب التفضيل أو التمييز الإيجابي الذي يجعل الكيان مختلفاً عن أقرانه."
      example: "تمتلك هذه السيارة ميزات أمان متقدمة."
      actions:
        - command: create_entry
          params:
            lemma: "مِيزة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00024444-n"

