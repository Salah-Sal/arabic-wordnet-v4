      justification: "وصف للشيء الذي يضل طريقه أو يهيم بلا وجهة محددة، ويطابق دلالة 'vagabond' للأشياء."
  knowledge_candidates:
    - lemma: "هائم"
      justification: "آلية التوليد: مجاز. يُطلق في الأصل على الإنسان والحيوان الذي يسير بلا وجهة، ويُستعار لكل ما يتحرك بلا مستقر ثابت."
    - lemma: "ضالّ"
      justification: "آلية التوليد: مجاز. يُستخدم لوصف الجرم أو الشيء الذي انفصل عن مكانه الأصلي أو مساره وأصبح بلا مقر."

step1_lemma_validation:
