      nuance_differentiation: "يركز على طبيعة الجسم (كتلة مادية) وصفتها (التيه وعدم الاستقرار)."
      example: "رصد العلماء جسماً تائهاً يقترب من مدار الأرض."

    - lemma: "تائه"
      source: step05
      decision: confirmed
      decision_reason: "مرادف قوي ومباشر يعبر عن فقدان الوجهة والمستقر."
      step05_citation: "«كأنما هو في السماء كوكب تائه» — التشبيه في القرآن"
