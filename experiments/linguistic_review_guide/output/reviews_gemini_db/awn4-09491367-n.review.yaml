      example: "وجدت نفسي كقارب تائه في عرض البحر لا يعرف له مرسى."

    - lemma: "هائم"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح يعبر عن الحركة العشوائية بلا هدف أو مكان ثابت."
      step05_citation: "«الهائم: طائف لا يدري أين يذهب» — لسان العرب (بالمعنى العام)"
