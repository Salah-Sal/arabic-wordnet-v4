  current_definition: "منطقة رملية تنحدر نحو مياه البحر أو البحيرة"
  assessment:
    decision: revise
    reason: "توسيع التعريف ليشمل الأنهار وتوضيح مكونات الشاطئ بما يتوافق مع الاستعمال الجغرافي الدقيق والمألوف للفظ (الشاطئ) الذي قد يشمل الحصى بالإضافة إلى الرمال."
  authored_definitions:
    - type: terminological
      text: "منطقة منحدرة من اليابسة تحاذي مسطحاً مائياً كالبحر أو النهر، وتتكون غالباً من الرواسب كالرمال أو الحصى."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09240137-n"
        definition_index: 0
        text: "منطقة منحدرة من اليابسة تحاذي مسطحاً مائياً كالبحر أو النهر، وتتكون غالباً من الرواسب كالرمال أو الحصى."

