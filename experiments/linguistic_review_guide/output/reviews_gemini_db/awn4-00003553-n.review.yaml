step0_evidence:
  per_lemma:
    - lemma: "كُلّ"
      confirm:
        - text: "«الكُلُّ، بالضم: اسمٌ لجميعِ الأَجْزاءِ»"
          source: "القاموس المحيط"
        - text: "«الكل: في اللغة اسمٌ مجموع المعنى ولفظه واحد، وفي الاصطلاح: اسم لجملة مركبة من أجزاء»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«كلمة تفِيد الِاسْتِغْرَاق لأفراد مَا تُضَاف إِلَيْهِ أَو أَجْزَائِهِ»"
          source: "المعجم الوسيط"
      peripheral_observations:
        - "يأتي الكل بمعنى الثقيل واليتيم والعبء في المعاجم القديمة."

    - lemma: "وَحْدَة مُتَكَامِلَة"
      confirm:
        - text: "«الوحدة هي وصول الكمية المسحوبة من السلعة، وقد تتكون من عدة تفصيلات منفردة يمكن ضمها جميعا في وحدة واحدة.»"
          source: "المعجم الموحد لمصطلحات النقل (عن مفهوم وحدة الاستخراج)"
      evidence_status: "mixed"

