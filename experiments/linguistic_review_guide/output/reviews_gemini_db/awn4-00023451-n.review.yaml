      decision_reason: "أصل المفهوم في العربية ويعبر عن اليقين وحصول صورة الشيء في العقل."
      step05_citation: "«العِلمُ: إِدْرَاك الشَّيْء بحقيقته، وَيُطلق على حُصُول صور المعلومات فِي النَّفس» — معجم مقاليد العلوم للسيوطي"
      substitution_test:
