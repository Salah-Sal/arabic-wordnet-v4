      decision_reason: "مصطلح تقني دقيق يعبر عن الجانب التجريدي من الإدراك (Noesis)."
      step05_citation: "«التّعقّل: قسم من الإدراك. وهو إدراك الشيء مجردا عن اللواحق المادية» — كشاف اصطلاحات الفنون"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بإدراك الكليات والمجردات عبر القوة العاقلة."
      example: "يسمو الإنسان بقدرته على التعقل والتدبر في ملكوت الكون."
