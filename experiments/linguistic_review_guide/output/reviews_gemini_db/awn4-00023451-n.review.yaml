step0_evidence:
  per_lemma:
    - lemma: "إِدْرَاك"
      confirm:
        - text: "«الإدراك: هو حصول الصورة عند النفس الناطقة.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«عملية نفسية ترتبط بمفهوم مجرد أو شيء حسي... حيث يكون الشخص قادراً على التفكير في هذا المفهوم أو الشيء وأن يستعمل مفاهيم للتعامل المناسب مع الغرض.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      expands:
        - text: "«الإدراك: تمثيل حقيقة الشيء وحده من غير حكم عليه بنفي أو إثبات، ويسمى تصورا.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يربط المصطلح بالتصور المنطقي."
    - lemma: "مَعْرِفَة"
      confirm:
        - text: "«المعرفة إدراك الشيء عليه ما هو عليه»"
          source: "الكليات لأبي البقاء الكفوي"
        - text: "«موضوع سيّار يفرض إنتاجه وتلقيه حضوره وغيابه، وهو عبارة عن كفاءة إدراكية لتنظيم برنامج سردي.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«المعرفة تقال لإدراك الجزئي أو البسيط ولهذا يقال: عرفت الله دون علمته»"
          source: "الكليات لأبي البقاء الكفوي"
          addition: "يفرّق بين المعرفة والعلم من حيث الجزئية والكلية."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عِلْم"
      source_section: "step5_english_bridge"
      evidence_citation: "«العِلم: حُصُول صُورَة الشَّيْء فِي الْعقل. وَقيل: تمثل حَقِيقَة الشَّيْء عِنْد الْمدْرك.» — معجم مقاليد العلوم للسيوطي"
      justification: "المصطلح العربي الأساسي المقابل لـ knowledge وcognition في التراث المعجمي."
    - lemma: "تَعَقُّل"
      source_section: "step5_english_bridge"
      evidence_citation: "«التّعقّل: [في الانكليزية] Intellection... وهو إدراك الشيء مجردا عن اللواحق المادية... وقد يطلق على الإدراك مطلقا.» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      justification: "يقابل noesis وintellection بدقة في السياق الفلسفي والنفسي."
  knowledge_candidates:
    - lemma: "دِرَايَة"
      justification: "اشتقاق من (د ر ي) يفيد المعرفة العميقة أو الناتجة عن تروٍ واستدلال."
  generation_notes: "تم التركيز على المصطلحات التي تعبر عن 'الناتج' (العلم، الدراية) و'العملية' (التعقل) لتغطية جوانب المفهوم."

step1_lemma_validation:
  per_lemma:
    - lemma: "إِدْرَاك"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن عملية تحصيل المعرفة ونتاجها النفسي."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب النفسي والعملياتي (Perception/Cognition) وبداية تشكل الصورة الذهنية."
      example: "يعتبر الإدراك عملية معقدة تشمل استقبال المعلومات وتفسيرها عقلياً."
    - lemma: "مَعْرِفَة"
      decision: confirmed
      decision_reason: "المصطلح العربي الأكثر شيوعاً للتعبير عن ناتج التعلم والاستدلال (Knowledge)."
