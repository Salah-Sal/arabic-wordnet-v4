      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على المحتوى المعرفي الحاصل (Knowledge) والقدرة على تمييز الأشياء."
      example: "يسعى العلماء دائماً إلى توسيع آفاق المعرفة البشرية في شتى المجالات."
    - lemma: "عِلْم"
