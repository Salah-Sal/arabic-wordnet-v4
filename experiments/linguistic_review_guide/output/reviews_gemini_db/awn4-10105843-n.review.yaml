    decision: revise
    reason: "التعريف الحالي ترجمة حرفية من الإنجليزية وركيك الصياغة، ويجب أن يغطي جانبي الحفظ والإدارة كما تقره المصطلحات الفقهية والقانونية."
  authored_definitions:
