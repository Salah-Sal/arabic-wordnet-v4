step0_evidence:
  per_lemma:
    - lemma: "مؤتمن"
      confirm:
        - text: "«مُؤْتَمَن؛ موثوق؛ موضع ثِقة.»"
          source: "المورد الحديث"
    - lemma: "وصي"
      confirm:
        - text: "«الوَصيُّ: شرعاً من يقام لأجل الحفظ والتصرّف في مال الرجل وأطفاله بعد الموت.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«نائب شرعي عن القاصر يتم اختياره من طرف الأب أو الأم، ويقوم بالعناية بشؤون المحجور الشخصية من توجيه ديني وتكويني وإعداد للحياة، كما يقوم بكل ما يتعلق بأعمال الإدارة العادية لأموال المحجور.»"
          source: "المعجم الموحد لمصطلحات القانون"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "أمين"
      source_section: "step5_english_bridge"
      evidence_citation: "«الوصيّ؛ الأمين؛ القيِّم» — المورد الحديث"
      justification: "وردت كترجمة للمصطلح الإنجليزي trustee."
    - lemma: "قيّم"
      source_section: "step5_english_bridge"
      evidence_citation: "«الوصيّ؛ الأمين؛ القيِّم» — المورد الحديث"
      justification: "وردت كترجمة للمصطلح الإنجليزي trustee."
  knowledge_candidates:
    - lemma: "وكيل ائتماني"
      justification: "تركيب وصفي (تركيب): يجمع بين الوكالة والائتمان، وهو مستخدم في السياقات المالية لوصف المؤتمن على الأصول (fiduciary)."

step1_lemma_validation:
  per_lemma:
    - lemma: "مؤتمن"
      decision: confirmed
      decision_reason: "مصطلح عربي فصيح يدل على من أُودع أمانة ويستعمل في السياقات المالية والقانونية للدلالة على الشخص المؤتمن."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على صفة الائتمان وحفظ الأصول بشكل عام دون تخصيص لحالة الوفاة أو القصور."
      example: "عينت المحكمة طرفاً ثالثاً كمؤتمن على أموال الشركة طوال فترة النزاع."
    - lemma: "وصي"
      decision: confirmed
      decision_reason: "مصطلح فقهي وقانوني دقيق ومستقر للدلالة على من يتولى حفظ أموال القاصر أو الميت."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص غالباً بمن يتولى شؤون القاصرين أو يتصرف في تركة الميت بناءً على عهد مسبق أو تعيين قضائي."
      example: "أوصى الرجل لصديقه ليكون الوصي على أبنائه القصر بعد وفاته."
    - lemma: "أمين"
      source: step05
      decision: confirmed
      decision_reason: "كلمة فصيحة ومستعملة للدلالة على الشخص الذي تحفظ لديه الأصول والودائع وتؤتمن عنده."
      step05_citation: "«الوصيّ؛ الأمين؛ القيِّم» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على صفة الأمانة المطلقة في الحفظ دون اشتراط الإدارة الكاملة للتركة كالوصي."
      example: "أودع التاجر أمواله لدى أمين مالي معتمد لحفظها."
      actions:
        - command: create_entry
          params:
            lemma: "أمين"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10105843-n"
    - lemma: "قيّم"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فقهي وقانوني مستقر يدل على من يتولى شؤون وحفظ أموال من لا يستطيع التصرف فيها."
      step05_citation: "«الوصيّ؛ الأمين؛ القيِّم» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص بتولي الإدارة والحفظ نيابة عن جهة أو فرد يفتقر للأهلية كالمجنون أو عن الأوقاف."
      example: "عُينت الجمعية كقيّم على الوقف الخيري لضمان حسن إدارته."
      actions:
        - command: create_entry
          params:
            lemma: "قيّم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10105843-n"
    - lemma: "وكيل ائتماني"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حديث غير مثبت في المعاجم التراثية، ونكتفي بالكلمات المفردة الأصيلة والمقرة قانونياً (مؤتمن، وصي، قيّم، أمين)."
      step05_citation: "توليد معرفي"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "أمين"
      reason: "مصدر: الخطوة ٠٫٥ (الجسر الإنجليزي)"
      via_command: create_entry + add_sense
    - lemma: "قيّم"
      reason: "مصدر: الخطوة ٠٫٥ (الجسر الإنجليزي)"
      via_command: create_entry + add_sense

