  assessment:
    decision: revise
    reason: "التعريف الحالي دقيق منطقياً لكنه يفتقر للجزالة اللغوية المعجمية."
  authored_definitions:
    - type: terminological
      text: "مجموعة من العناصر أو الأفراد أو الكيانات التي تُعامل بوصفها وحدة مستقلة أو كياناً واحداً."
