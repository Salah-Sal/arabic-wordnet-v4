      decision_reason: "مصطلح 'زمرة' غالباً ما يحمل ظلالاً دلالية سلبية أو يدل على مجموعة مغلقة صغيرة جداً (clique)، ولا يصلح كمرادف عام شامل لمفهوم 'social group'."
