      confirm:
        - text: "«عُمْق [مفرد]: ... عُمْقُ الحُبِّ/ عُمْقُ الحُزن: شِدَّته»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«العُمقُ والعَمْقُ: قعر البئر والفجِّ والوادي»"
          source: "تاج اللغة وصِحاح العربية"
          addition: "يضيف المعنى الحسي للعمق (البعد إلى أسفل)."
        - text: "«العمق:[في الانكليزية] Depth [ في الفرنسية] Profondeur ... الامتداد الثالث المقاطع لكلّ واحد من الامتدادين الأولين أي الطول والعرض»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "البعد الهندسي."

step05_lemma_generation:
