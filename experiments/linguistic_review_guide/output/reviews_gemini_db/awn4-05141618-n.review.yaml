    - lemma: "غَوْر"
      source_section: "step5_english_bridge"
      evidence_citation: "«عمق، غور: depth» — المعجم الموحد لمصطلحات علوم البحار"
      justification: "المرادف المباشر للعمق، ويستعمل مجازاً للتعبير عن شدة الشيء وخفائه (بعيد الغور)."
  knowledge_candidates:
    - lemma: "عَمَاقَة"
      justification: "اشتقاق: مصدر قياسي للفعل 'عَمُقَ'، ويدل على صفة العمق كسمة مجردة."
  generation_notes: "تم استبعاد 'شدة' أو 'قوة' لأنها مصطلحات عامة جداً تشكل مجموعات ترادفية منفصلة، بينما العمق هنا هو شدة نابعة من البعد المجازي والغور."

