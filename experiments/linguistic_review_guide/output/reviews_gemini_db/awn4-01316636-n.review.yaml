  current_definition: "(في علم الوراثة) كائن يمتلك جيناً متنحياً يتم إخفاء تأثيره بواسطة أليل سائد؛ السمة المرتبطة لا تكون ظاهرة ولكن يمكن نقلها إلى النسل"
  assessment:
    decision: retain
    reason: "التعريف دقيق علمياً وشامل للأركان الدلالية للمفهوم (الجين المتنحي، الإخفاء بالأليل السائد، إمكانية النقل)."

