step0_evidence:
  per_lemma:
    - lemma: "حامل"
      confirm:
        - text: "«فرد يحمل جينا متنحيا بصورة غير نقية مع المورث السائد، ولذلك لا تظهر عليه صفة الجين المتنحي وينقلها إلى أبنائه أو أحفاده»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«من يوجد في جسمه ميكروب مرض ما، ويمكنه أن ينشر العدوى دون أن تظهر عليه أعراض ذلك المرض»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      peripheral_observations:
        - "يُستعمل في اللغة الكلاسيكية بمعنى المرأة الحبلى، أو البرج الفلكي (برج الحمل)، وهو معنى بعيد عن السياق الوراثي المعاصر."

