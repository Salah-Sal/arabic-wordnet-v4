      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير وصفي مباشر يدل على التأثير المشترك في كلا الاتجاهين."
      example: "هناك علاقة متبادلة بين النمو الاقتصادي والاستقرار السياسي."
      actions: []
    - lemma: "تَعَالُق"
      source: step05
      decision: confirmed
      decision_reason: "كلمة فصيحة على وزن (تفاعل) تفيد المشاركة والتبادل الدلالي بشكل دقيق."
      step05_citation: "«ارتباط؛ تعالق» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى تعلق كل طرف بالآخر واعتماده عليه، ويتميز بصيغة (تفاعل) الدالة على المشاركة."
      example: "يوجد تعالق واضح بين الظاهرتين بحيث تتأثر كل منهما بالأخرى."
