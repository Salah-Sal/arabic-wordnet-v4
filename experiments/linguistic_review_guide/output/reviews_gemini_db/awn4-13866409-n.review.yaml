          params:
            lemma: "تَعَالُق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13866409-n"
    - lemma: "ارْتِبَاط مُتَبَادَل"
      source: step05
      decision: confirmed
      decision_reason: "تعبير اصطلاحي شائع في السياقات العلمية للتعبير عن الترابط الثنائي."
      step05_citation: "«علاقة تربط بين قيم متغيرين اثنين أو متغيرات، مستمرة في مجال قياس إما مفتوح أو محدود.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يؤكد على الاشتراك في الربط، وغالباً ما يستخدم في السياقات الإحصائية والعلمية."
      example: "كشفت التحليلات عن ارتباط متبادل بين المتغيرين."
      actions:
