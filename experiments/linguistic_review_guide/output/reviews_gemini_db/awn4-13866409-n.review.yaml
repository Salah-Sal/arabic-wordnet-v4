step0_evidence:
  per_lemma:
    - lemma: "تَرَابُط"
      expands:
        - text: "«(في علم الفلسفة): قيام علاقة بين مدرَكين لاقترانهما فى الذهن بسبب ما»"
          source: "المعجم الوسيط"
        - text: "«درجة العلاقة، أو التوافق، بين سلسلتي معطيات أو أكثر.»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
    - lemma: "عَلَاقَة مُتَبَادَلَة"
      confirm:
        - text: "«علاقة متبادَلة.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«علاقة متبادلة بين بلدين أو بلدان، بين شخصين أو مؤسستين أو مجالين أو نوعين الخ.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تَعَالُق"
      source_section: "step4_fts_keyword"
      evidence_citation: "«ارتباط؛ تعالق» — المورد الحديث (2008)"
      justification: "اشتقاق على وزن (تفاعل) من الجذر (علق) الذي يدل على المشاركة والارتباط المتبادل."
    - lemma: "ارْتِبَاط مُتَبَادَل"
      source_section: "step4_fts_keyword"
      evidence_citation: "«علاقة تربط بين قيم متغيرين اثنين أو متغيرات، مستمرة في مجال قياس إما مفتوح أو محدود.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      justification: "تركيب وصفي مستعمل بكثرة في السياقات العلمية والبيئية للتعبير عن التأثير المشترك."
  knowledge_candidates:
    - lemma: "تَبَادُلِيَّة"
      justification: "مصدر صناعي مصوغ من الفعل (تبادل) للدلالة المجردة على الحالة المشتركة (توليد بالاشتقاق)."

step1_lemma_validation:
  per_lemma:
    - lemma: "تَرَابُط"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع الاستعمال ويؤدي المعنى المطلوب."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركز على قوة الوصل والشد بين الأطراف بحيث يصعب فصلها."
      example: "أظهرت الدراسة وجود ترابط قوي بين مستوى التعليم والدخل."
      actions: []
    - lemma: "عَلَاقَة مُتَبَادَلَة"
      decision: confirmed
      decision_reason: "تعبير وصفي اصطلاحي دقيق وشائع."
