step0_evidence:
  per_lemma:
    - lemma: "فرداني"
      confirm:
        - text: "«(1) «أ», الفردانيّ: «ب» من ينهج في الفكر أو العمل نهجًا مستقلًا إلى حدّ بارز. «ج» الداعي إلى الفردانية أو ممارسُها»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«اسم منسوب إلى فَرْد: على غير قياس "فلسفة/ نظرة فردانيَّة".»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "مستقل"
      confirm:
        - text: "«استقلَّ الشَّخصُ بالحكم: تحرَّر، انفردَ بتدبير أمره [...] استقلَّ برأيه: استبدَّ به.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«عضو برلمانيّ مُستقِلّ: من لا يرتبط بحزب أو منظمة سياسيّة.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«مستقل؛ متمتع بالحكم الذاتي»"
          source: "المورد الحديث (2008)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "استقلالي"
      source_section: "step4_fts_keyword"
      evidence_citation: "«استقلاليّ. مستقلّ؛ متمتع بالحكم الذاتي» — المورد الحديث (2008)"
      justification: "مصطلح متداول يدل على من يتمتع بالاستقلالية في فكره وعمله، ويشتق من 'استقلال'."
  knowledge_candidates:
    - lemma: "مُتفرِّد"
      justification: "اشتقاق (اسم فاعل) من الفعل 'تفرّد'، يعبر عن الشخص الذي يستبد برأيه وعمله دون إشراك الآخرين."
  generation_notes: "التركيز على صفات الاستقلال والتفرد المستمدة من جذور (ق ل ل) و(ف ر د)."

step1_lemma_validation:
  per_lemma:
    - lemma: "فرداني"
      decision: confirmed
      decision_reason: "مصطلح مستعمل وشائع كمقابل لـ individualist، وله دلالة فلسفية ومجتمعية واضحة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الشخص الذي يعتنق الفردانية كمذهب أو سلوك، وتميل أكثر إلى الجانب الفلسفي والاجتماعي."
      example: "كان الكاتب فردانياً في توجهاته لا يتبع المدارس الأدبية السائدة."
    - lemma: "مستقل"
      decision: confirmed
      decision_reason: "كلمة فصيحة ومستقرة تستعمل بكثرة في السياقات السياسية والفكرية للدلالة على الاستقلالية وعدم التبعية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أعم في دلالتها من 'فرداني'، وتشير إلى من لا يخضع في رأيه أو قراره لتأثير أو توجيه من الآخرين، وتكثر في السياق السياسي والمهني."
      example: "ترشح للانتخابات بصفته سياسياً مستقلاً لا ينتمي لأي حزب."
    - lemma: "استقلالي"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح (اسم منسوب) يؤدي معنى الاتصاف بالاستقلال الفكري أو العملي بشكل دقيق."
      step05_citation: "«استقلاليّ. مستقلّ؛ متمتع بالحكم الذاتي» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تؤكد على النزعة أو الميل الذاتي نحو الاستقلال، وتستخدم غالباً كوصف لتوجه الشخص الفكري."
      example: "عُرف بكونه مفكراً استقلالياً يبني آراءه على قناعاته الشخصية."
      actions:
        - command: create_entry
          params:
            lemma: "استقلالي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09642994-n"
    - lemma: "مُتفرِّد"
      source: step05
      decision: removed
      decision_reason: "التفرد يميل أكثر إلى معنى التميز وعدم وجود النظير، أو الاستبداد بالرأي، وليس بالضرورة الاستقلال الفكري المنهجي."
      step05_citation: "لا حاجة لدليل نظراً لرفضه بسبب ظلال المعنى."
      substitution_test:
        result: "fail"
      nuance_differentiation: "يختلف عن الاستقلال في أنه يركز على الانفراد والتميز أو الاستبداد."
  added_lemmas:
    - lemma: "استقلالي"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

