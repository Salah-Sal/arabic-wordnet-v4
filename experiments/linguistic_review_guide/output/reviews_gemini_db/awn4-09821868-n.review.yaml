step0_evidence:
  per_lemma:
    - lemma: "مُتَذَوِّق"
      expands:
        - text: "«الذي يتذوق الأطعمة بهدف مقارنة صفاتها الحسية» — المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      peripheral_observations:
        - "يتعلق المعنى المعجمي المسترجع بالتذوق المادي الحسي (تذوق الأطعمة) ولكنه يمتد مجازياً في الاستعمال المعاصر ليشمل التذوق الفني والمعنوي وهو المقصود في المجموعة الترادفية."
    - lemma: "مُقَدِّر"
      expands:
        - text: "«قَدَّرَ فلانٌ : تمهَّلَ وفكَّر في تسوية أمْرٍ وتهيئته الشىءَ : بيَّن مقداره» — المعجم الوسيط"
        - text: "«مقدِّر: estimator» — المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      peripheral_observations:
        - "يرتبط المعنى المعجمي بالتقدير الحسابي أو الرياضي (estimator)، ولكن الاستعمال يمتد إلى التقدير المعنوي والإدراك الواعي للقيمة."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "خَبِير"
      source_section: "step5_english_bridge"
      evidence_citation: "«الجِهْبِذ؛ العارف؛ الخبير: المتمكِّن من تقنيَّة فنّ من الفنون أو أصوله إلى حدّ يؤهِّله لإطلاق حُكمٍ نقديّ فيه» — المورد الحديث"
      justification: "يرد اللفظ ترجمة للمقابل الإنجليزي (connoisseur) في المعاجم ثنائية اللغة، ويدل على العارف بالأمور وصاحب الخبرة فيها."
    - lemma: "ذَوَّاق"
      source_section: "step4_fts_keyword"
      evidence_citation: "«جيد الذوق: الخبير» — المعجم الوسيط"
      justification: "صيغة مبالغة على وزن فَعَّال للدلالة على شدة التذوق، وهو تعبير دقيق عن الشخص العارف الذي يمتلك حساً عالياً للإدراك والتمييز (مجاز)."
  generation_notes: "تم استخراج كلمات تدل على الخبرة والذوق الرفيع بالاعتماد على المقابلات الإنجليزية والبحث عن معنى التذوق."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُتَذَوِّق"
      decision: confirmed
      decision_reason: "مصطلح فصيح واسع الاستعمال للتعبير عن الشخص الذي يمتلك القدرة على فهم وإدراك الجوانب الجمالية والفنية (كالتذوق الفني أو الأدبي)، وهو انتقال مجازي سليم من التذوق الحسي."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الاستمتاع الجمالي والحسي (كالفنون والآداب) والقدرة على تمييز مواطن الجمال."
      example: "كان الناقد متذوقاً رفيعاً للشعر الجاهلي."

    - lemma: "مُقَدِّر"
      decision: confirmed
      decision_reason: "كلمة فصيحة (اسم فاعل من قدر)، وتستعمل للتعبير عن من يدرك القيمة الحقيقية للشيء، أو المعترف بالفضل والقيمة."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الإدراك العقلي للقيمة والاعتراف بالفضل أو الجهد، أكثر من التركيز على الاستمتاع الحسي."
      example: "وقف المدير مقدراً لجهود فريقه في إنجاح المشروع."

    - lemma: "خَبِير"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح يعبر بدقة عن الشخص ذي المعرفة العميقة والإدراك التام في مجال معين."
      step05_citation: "«الخبير: المتمكِّن من تقنيَّة فنّ من الفنون أو أصوله إلى حدّ يؤهِّله لإطلاق حُكمٍ نقديّ فيه» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يبرز الجانب المعرفي التراكمي والإلمام العميق بأصول الأشياء وتقنياتها."
      example: "عُين في المتحف خبيراً لتقييم اللوحات الكلاسيكية."
      actions:
        - command: create_entry
          params:
            lemma: "خَبِير"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09821868-n"

    - lemma: "ذَوَّاق"
      source: step05
      decision: confirmed
      decision_reason: "صيغة مبالغة فصيحة ومناسبة جداً لمفهوم الشخص ذي الحس الرفيع والإدراك العميق للجمال والجودة."
      step05_citation: "«جيد الذوق: الخبير» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يؤكد على شدة الرهافة والحس الدقيق في التمييز والإدراك، ويميل للمبالغة أكثر من 'متذوق'."
      example: "عُرف بين أقرانه بأنه ذواق للطرب الأصيل."
      actions:
        - command: create_entry
          params:
            lemma: "ذَوَّاق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09821868-n"
  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "خَبِير"
      reason: "مصدر: الخطوة ٠٫٥ - ترجمة معجمية متداولة ومطابقة للمفهوم الإدراكي."
      via_command: create_entry + add_sense
    - lemma: "ذَوَّاق"
      reason: "مصدر: الخطوة ٠٫٥ - صيغة مبالغة صحيحة ومثبتة معجمياً تناسب معنى connoisseur."
      via_command: create_entry + add_sense

step3_definition:
  definition_review_flag: true
  current_definition: "شخص يدرك شيئاً ما تماماً ويفهمه"
  assessment:
    decision: revise
    reason: "التعريف الحالي عام جداً ويمكن أن يطلق على أي شخص يفهم مسألة ما. يجب أن يبرز التعريف بُعد 'التذوق' وإدراك القيمة (الفنية أو المعنوية) وجودتها كما توحي به اللمات المؤكدة (متذوق، مقدر، ذواق، خبير) والمقابل الإنجليزي (appreciator / connoisseur)."
  authored_definitions:
    - type: terminological
      text: "شخص يمتلك قدرة عالية على إدراك القيمة الجمالية أو المعنوية لشيء ما وفهم تفاصيله الدقيقة."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09821868-n"
        definition_index: 0
        text: "شخص يمتلك قدرة عالية على إدراك القيمة الجمالية أو المعنوية لشيء ما وفهم تفاصيله الدقيقة."

