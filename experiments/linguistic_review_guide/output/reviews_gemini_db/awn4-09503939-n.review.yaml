step0_evidence:
  per_lemma:
    - lemma: "دُنْيَا"
      confirm:
        - text: "«ويقال : هو يعيش في دنيا الأحلام , ودنيا السرور . وشاع مثل هذا الاستعمال»"
          source: "المعجم الوسيط"
        - text: "«(في علم الجيولوجيا) world (E) , monde (F): الأرضُ من حَيْثُ تَوْزيعها الجُغرافِيّ»"
          source: "المعجم الكبير"
    - lemma: "عَالَم"
      confirm:
        - text: "«وكل صنف من أصناف الخلق كعالم الحيوان وعالم النبات»"
          source: "المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نِطَاق"
      source_section: "step4_fts_keyword"
      evidence_citation: "«النِّطاقُ : شُقَّةٌ تُلْبَس فوقَ القَمِيص» — المعجم الكبير"
      justification: "النطاق يدل على الحيز المحدد أو المجال، وتم استخراجه بناءً على دلالة الجزء المنفصل."
  knowledge_candidates:
    - lemma: "مَجَال"
      justification: "توليد بالاشتقاق والمجاز: كلمة (مجال) تُستخدم للدلالة على نطاق نشاط أو حيز حيوي/معنوي كأن نقول (مجال العلوم) أو (المجال الحيوي)، وهي توافق معنى الجزء المعتبر منفصلاً."
  generation_notes: "تم التركيز على المفاهيم التي تدل على التقسيم الجغرافي أو المعنوي للكيانات والبيئات."

step1_lemma_validation:
  per_lemma:
    - lemma: "دُنْيَا"
      decision: confirmed
      decision_reason: "المصطلح فصيح ومستقر ويُستعمل لتخصيص بيئات ونطاقات معينة مجازاً كقولنا دنيا الأحلام ودنيا المال."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على المجال أو النطاق بمسحة عاطفية أو ذاتية غالباً (دنيا الفن، دنيا الأطفال)."
      example: "انغمستُ في قراءة الرواية حتى انعزلتُ في دنيا أخرى بعيدة عن الواقع."
    - lemma: "عَالَم"
      decision: confirmed
      decision_reason: "المصطلح فصيح وعلمي ومستقر، ويُستخدم كثيراً في التصنيف للإشارة إلى فئات أو أجزاء مستقلة (عالم الحيوان، العالم الثالث، العالم الغربي)."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أكثر تجريداً وشمولية من (دنيا)، وتستخدم في التقسيمات العلمية والموضوعية (عالم الحشرات، عالم السياسة)."
      example: "يمتلئ عالم البحار بالكائنات العجيبة التي لم تُكتشف بعد."
    - lemma: "نِطَاق"
      source: step05
      decision: removed
      decision_reason: "كلمة نطاق تركز على المدى أو الحدود، وهي أقل شمولية وتجسيداً للكيان المتكامل من كلمة (عالم) أو (دنيا) في هذا السياق الدلالي."
      step05_citation: "«النِّطاقُ : شُقَّةٌ تُلْبَس فوقَ القَمِيص» — المعجم الكبير"
      substitution_test:
        result: "fail"
      nuance_differentiation: "النطاق هو الحيز المقيد أو المدى، بينما العالم هو المنظومة الشاملة داخل هذا الحيز."
    - lemma: "مَجَال"
      source: step05
      decision: removed
      decision_reason: "المجال يعبر عن الساحة أو المساحة المتاحة للحركة والنشاط، ولا يحمل نفس الزخم الدلالي للتجمع والشمولية الموجود في كلمة (عالم)."
      step05_citation: "اقتراح من معرفة لغوية مبني على الإزاحة الدلالية."
      substitution_test:
        result: "fail"
      nuance_differentiation: "مجال تركز على المساحة الحرة للفعل، بينما العالم هو البيئة والكيانات معاً."
  synset_flags:
    definition_review_needed: true

