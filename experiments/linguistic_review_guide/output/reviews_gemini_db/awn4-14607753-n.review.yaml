step0_evidence:
  per_lemma:
    - lemma: "طين"
      confirm:
        - text: "«التراب المختلط بالماء، وقد يسمى بذلك وإن زالت عنه رطوبة الماء» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«الوحل» — المعجم الكبير"
          source: "المعجم الكبير"
        - text: "«التراب والماء المختلط» — التوقيف على مهمات التعاريف للمناوي"
          source: "المناوي"
      contradicts:
        - text: "«مادة يكوِّنها معدن الميكا مختلطاً بالمرو والفلسبار وبعض المواد العضوية» — المعجم الوسيط"
          source: "المعجم الوسيط"
          conflict: "التعريف الجيولوجي دقيق ومحدد بمكونات كيميائية، بينما المفهوم يشمل أي مادة صمغية عديمة الشكل"
      expands:
        - text: "«الخلقة والجبّلة» — تاج اللغة وصِحاح العربية"
          source: "الجوهري"
          addition: "دلالة مجازية تشير إلى أصل الخلقة"
    - lemma: "مادة لزجة"
      evidence_status: "no_material_found"
      peripheral_observations:
        - lemma: "مادة لزجة"
           المعنى_الملاحَظ: "تعبير مركب وصفي يطابق دلالة التعريف (sticky/gummy matter) لكنه لم يرد كمدخل مستقل في المعاجم القديمة."
          source: "تحليل اللغوي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "حمأة"
      source_section: "step5_english_bridge"
      evidence_citation: "«بقايا شبه صلبة تنتج خلال عدد من عمليات معالجة الهواء والمياه» — مسرد المناخ والبيئة (ArabTerm)"
      justification: "تطابق دلالة المادة عديمة الشكل غير السارة (sludge/glop) في سياق النفايات والترسبات."
  knowledge_candidates:
    - lemma: "وحل"
      justification: "آلية: مجاز/توسيع. الوحل هو الطين الرقيق الذي ترتطم فيه الدواب، وهو مادة عديمة الشكل وغير سارة عند الارتطام بها، ويعد مرادفاً شائعاً للطين في سياق المواد اللزجة."
  generation_notes: "تم استبعاد 'هلام' لكونه مادة لزجة لكنها غالباً ما تكون منظمة أو صافية، بينما المفهوم يركز على كونها غير سارة (unpleasant)."

step1_lemma_validation:
  per_lemma:
    - lemma: "طين"
      decision: "confirmed"
      decision_reason: "أدلة مؤكدة بكونه المادة الأساسية التي تمثل التراب والماء المختلط، وهي المادة النموذجية (prototype) للمفهوم."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى المادة الطبيعية المكونة من التراب والماء، ويستخدم للدلالة على المواد اللزجة الكثيفة."
      example: "إِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي خَالِقٌ بَشَرًا مِّن طِينٍ"
    - lemma: "مادة لزجة"
      decision: "confirmed"
      decision_reason: "تعبير وصفي دقيق ومباشر للمفهوم يغطي نطاقه الدلالي بالكامل."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير عام يشمل أي مادة تتصف باللزوجة والتميع، سواء كانت طبيعية أو كيميائية أو غذائية."
      example: "تَفْرِزُ بَعْضُ الْكَائِنَاتِ مَادَّةً لَزِجَةً لِحِمَايَةِ نَفْسِهَا مِنَ الْجَفَافِ."
    - lemma: "حمأة"
      source: "step05"
      decision: "confirmed"
      decision_reason: "أدلة معجمية حديثة تؤكد دلالتها على المواد اللزجة غير السارة (sludge)."
      step05_citation: "«بقايا شبه صلبة تنتج خلال عمليات معالجة المياه» — مسرد المناخ والبيئة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص بالمواد اللزجة الكريهة أو المترسبة الناتجة عن تعفن أو معالجة نفايات، وهي الأقرب لمعنى unpleasant في التعريف."
      example: "تَتَرَاكَمُ الْحَمْأَةُ فِي قَاعِ خَزَّانَاتِ الصَّرْفِ الصِّحِّيِّ."
      actions:
        - command: "create_entry"
          params:
            lemma: "حمأة"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14607753-n"
    - lemma: "وحل"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مرادف فصيح مستقر للطين الرقيق اللزج."
      step05_citation: "«الطين الرقيق ترتطم فيه الناس والدواب» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز عن الطين بكونه أكثر رقة وتميعاً، مما يجعله أكثر ملاءمة لوصف المادة عديمة الشكل (shapeless)."
      example: "تَحَوَّلَتِ الطَّرِيقُ إِلَى وَحْلٍ بَعْدَ هُطُولِ الْأَمْطَارِ الْغَزِيرَةِ."
      actions:
        - command: "create_entry"
          params:
            lemma: "وحل"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14607753-n"

