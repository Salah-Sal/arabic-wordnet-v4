step0_evidence:
  per_lemma:
    - lemma: "رمام"
      confirm:
        - text: "«(فى علوم الأحياء): كائِن حى يغتذِى بالموادّ العُضويَّة الْمُتحلِّلة، وقد يكون نباتًا أو حيوانًا» — المعجم الكبير"
        - text: "«منسوب إلى الرمة ، وهو ما يعيش على الأعضاء البالية. [Saprophyte]» — المعجم الموحد لمصطلحات الطب البيطري"
        - text: "«[Saprobe/Saprophyte]» — المعجم الطبي الموحد"
      contradicts:
        - text: "«القشَّاشُ الذى يَقُشُّ أَرْذَلَ الطعام وما سقط منه ليأكله، ولا يتوقَّى قَذَرَه» — المعجم الوسيط"
          conflict: "معنى تراثي يتعلق بسلوك إنساني (الفقر والقذارة) لا المعنى البيولوجي المقصود"
      expands:
        - text: "«البقل حِين يبقل» — المعجم الوسيط"
          addition: "معنى نباتي تراثي (بداية خضرة الأرض)"

    - lemma: "كائن رمي"
      expands:
        - text: "«نبات يغتدي بالمتعضيات المتحللة [Saprophyte]» — المعجم الموحد لمصطلحات علم الأحياء"
          addition: "استخدام وصف 'رمي' (رِمِّيّ) كمرادف للمفهوم يدعم تركيب 'كائن رمي' وصفياً"

