step0_evidence:
  per_lemma:
    - lemma: "غَجَرِيّ"
      confirm:
        - text: "«واحد الغَجَر؛ وهم قوم جفاة متجوِّلون... متشدِّد، متسكِّع، متحلّل من مواصفات المجتمع وقيَمِه \"إنّك غجريّ السلوك\"»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«غَجَرِيّ، والجمع غَجَر: البوهيمي»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«الغجر قوم من العرب جفاة يسكنون الحولة ونواحي الأردن والواحد غجري»"
          source: "محيط المحيط (نقلاً عن تكملة المعاجم العربية)"
      expands:
        - text: "«غَجَرِيّ: أخرق، أرعن عديم المهارة»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "استخدام اللفظ للدلالة على الرعونة وقلة المهارة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "بُوهِيمِيّ"
      source_section: "step4_fts_keyword"
      evidence_citation: "«بُوهيمي، متشرد... تقدم موضة تخيل فنطازمي يُشيدُ بالتيه والتشرد المنتقد لمادية البورجوازية» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "المرادف الأدق للشخص الذي يعيش حياة غير تقليدية ومتحللة من القيود، وهو مصطلح مستقر في الأدبيات العربية لهذا المفهوم."
    - lemma: "نُورِيّ"
      source_section: "step5_english_bridge"
      evidence_citation: "«نوري والجمع نور: غجري» — تكملة المعاجم العربية لرينهارت دوزي"
      justification: "اسم مرادف للغجري في بعض البيئات العربية (خاصة بلاد الشام والعراق)، ويستخدم للدلالة على الشخص المتنقل أو الذي يعيش حياة تشبه الغجر."
  knowledge_candidates:
    - lemma: "مُتَجَوِّل"
      justification: "اشتقاق؛ يصف جوهر المفهوم وهو التنقل المستمر (itinerant) الذي يميز هذا النوع من الأشخاص."
    - lemma: "بَهْلَوَان"
      justification: "مجاز؛ يُستخدم أحياناً لوصف الشخص المتنقل الذي يعيش حياة غير تقليدية تعتمد على المهارات اليدوية أو العروض المتجولة، وإن كان له معنى خاص بالسيرك."

step1_lemma_validation:
  per_lemma:
    - lemma: "غَجَرِيّ"
      decision: "confirmed"
      decision_reason: "اللمّة الأساسية للمفهوم، ومدعومة بأدلة معجمية صريحة تدل على نمط العيش غير التقليدي."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الشخص الذي يتخذ نمط حياة الغجر (التنقل، عدم الاستقرار) سواء كان منهم عرقياً أم لا، وغالباً ما تحمل دلالة سلبية أو وصفية للتحلل من القيود."
      example: "يعيش هذا الفنان حياة غجرية يطوف فيها البلاد سعياً وراء إلهامه دون مسكن ثابت."

    - lemma: "بُوهِيمِيّ"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مصطلح مستقر ومعترف به معجمياً للشخص الذي يعيش حياة غير تقليدية ومتمردة على الأعراف."
      step05_citation: "«بُوهيمي، متشرد... يُشيدُ بالتيه والتشرد المنتقد لمادية البورجوازية» — المعجم الموحد لمصطلحات اللسانيات"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على الجانب الفكري والأدبي والفني في نمط العيش غير التقليدي، وتوحي بالتمرد الشعوري أو الفني أكثر من مجرد التنقل المكاني."
      example: "عُرف هذا الكاتب بطبعه البوهيمي وتمرده المستمر على الأعراف الاجتماعية السائدة في عصره."

    - lemma: "نُورِيّ"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مرادف معجمي معترف به للغجري، وشائع الاستخدام في بعض المناطق العربية."
      step05_citation: "«نوري والجمع نور: غجري» — تكملة المعاجم العربية لرينهارت دوزي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مرادف إقليمي لـ«غجري»، وقد يستخدم في سياقات معينة للدلالة على الشخص المشاكس أو الذي لا يلتزم بالقيود."
      example: "وُصف بأنه نوريٌّ في ترحاله الدائم وعدم مبالاته بالأعراف الاجتماعية المتوارثة."

    - lemma: "مُتَجَوِّل"
      source: "step05"
      decision: "removed"
      decision_reason: "وصف عام للتنقل وليس مصطلحاً مسكوكاً لهذا النوع الخاص من الأشخاص (itinerant as a lifestyle person)."
      step05_citation: "«مُتَجوِّل: هي اسم الفاعل من تَجوَّل» — معجم الصواب اللغوي"

    - lemma: "بَهْلَوَان"
      source: "step05"
      decision: "removed"
      decision_reason: "مصطلح مخصص لعروض السيرك والمهارات الحركية، ولا يدل بدقة على عيش حياة بدوية غير تقليدية."

