      decision_reason: "بديل عربي فصيح للمصطلح الأجنبي 'ليبرالي' وموثق معجمياً في هذا السياق."
      step05_citation: "«(5) «أ» تحرّريّ: مؤيّد للنظم الديموقراطيّة والإصلاحات الاجتماعية.» — المورد الحديث"
