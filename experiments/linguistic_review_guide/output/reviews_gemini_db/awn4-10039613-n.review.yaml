          source: "موسوعة السلطان قابوس لأسماء العرب"

step05_lemma_generation:
  evidence_candidates: []
  knowledge_candidates:
    - lemma: "مُجَزِّئ"
      justification: "اشتقاق (اسم فاعل) من الفعل (جزَّأ)، يعبر عن الشخص أو الأداة التي تقوم بتقطيع الشيء إلى أجزاء."
    - lemma: "فَاصِل"
      justification: "اشتقاق (اسم فاعل) من الفعل (فَصَلَ)، يدل على من أو ما يقوم بالفصل بين الأشياء."
  generation_notes: "تم استبعاد الأدلة المعجمية الإنجليزية لأنها تركز على الأجهزة المادية (Separator/Divider) بينما المفهوم هنا عن (شخص)."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُقَسِّم"
      decision: confirmed
      decision_reason: "مصطلح فصيح (اسم فاعل) يدل صراحة على من يقوم بفعل التقسيم أو التوزيع، ويطابق المفهوم."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ الأساسي للدلالة على من يمارس فعل تقسيم الأشياء إلى حصص أو أجزاء."
      example: "كُلّف المُقَسِّم بتوزيع الغنائم بين المستحقين بالعدل."

    - lemma: "مُجَزِّئ"
      source: step05
      decision: removed
      decision_reason: "اشتقاق صحيح، لكنه يغلب في الاستعمال المعاصر على الأجهزة والأدوات التقنية وليس الأشخاص."
      step05_citation: "توليد ذاتي (اشتقاق)"

    - lemma: "فَاصِل"
      source: step05
      decision: removed
      decision_reason: "أكثر شيوعاً للدلالة على الأداة المادية أو الحاجز المكاني، أو الشخص الذي يفصل في الخصومات، مما يجعله غير دقيق لهذا المفهوم."
      step05_citation: "توليد ذاتي (اشتقاق)"

  synset_flags:
