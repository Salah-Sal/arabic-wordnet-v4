      justification: "المصطلح القرآني والعقدي الأساسي المقابل لـ (Fall of Man) في السياق الإسلامي."
    - lemma: "السقوط في الخطيئة"
      source_section: "step5_english_bridge"
      evidence_citation: "«يقع في الخطيئة — fall from grace» — المورد الحديث (2008)"
      justification: "تعبير مركب دقيق يخصص معنى السقوط العام بالمجال اللاهوتي."
