step0_evidence:
  per_lemma:
    - lemma: "السقوط"
      confirm:
        - text: "«يقع في الخطيئة — fall from grace»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«طرح الشيء إما من مكان عال إلى مكان منخفض كسقوط الإنسان من السطح»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المعنى الحسي العام للسقوط الذي استُعير للمفهوم اللاهوتي."

    - lemma: "سقوط الإنسان"
      confirm:
        - text: "«سقوط البشرية في الخطيئة بسبب خطيئة آدم وحواء»"
          source: "تعريف المجموعة (دليل سياقي)"
      # evidence_status: "confirm"

