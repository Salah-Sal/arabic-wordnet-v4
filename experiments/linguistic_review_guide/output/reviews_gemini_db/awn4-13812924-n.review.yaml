step0_evidence:
  per_lemma:
    - lemma: "أَسَاس"
      confirm:
        - text: "«(الأساس) قَاعِدَة الْبناء الَّتِي يُقَام عَلَيْهَا وأصل كل شَيْء ومبدؤه وَمِنْه أساس الفكرة وأساس الْبَحْث»"
          source: "المعجم الوسيط"
        - text: "«الأساس: القاعدة التي يبنى عليها.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "قَاعِدَة"
      confirm:
        - text: "«(الْقَاعِدَة) من الْبناء أساسه وَالضَّابِط أَو الْأَمر الْكُلِّي ينطبق على جزئيات»"
          source: "المعجم الوسيط"
        - text: "«القاعدة: ما يقعد عليه الشيء، أي يستقر ويثبت.»"
          source: "التوقيف على مهمات التعاريف"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رَكِيزَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(الركيزة) مَا يرتكز عَلَيْهِ» — المعجم الوسيط"
      justification: "كلمة معجمية دقيقة تؤدي معنى ما يُستند إليه ويُعتمد عليه في بناء الأشياء المادية أو المعنوية."
    - lemma: "دِعَامَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(الدعامة) عماد الْبَيْت الَّذِي يقوم عَلَيْهِ وَيُقَال هُوَ دعامة الضَّيْف معينه وَهُوَ دعامة قومه سيدهم وسندهم» — المعجم الوسيط"
      justification: "تُستخدم مجازاً وحقيقة للتعبير عن الأساس والسند الذي يقوم عليه بناءٌ أو مفهوم."
  knowledge_candidates:
    - lemma: "مُرْتَكَز"
      justification: "اشتقاق من الفعل 'ارتكز'، للدلالة على موضع الارتكاز والأساس الذي يُستند إليه (اشتقاق اسم مكان/مفعول)."
  generation_notes: "تم التركيز على الكلمات التي تدل على السند والأساس المعنوي الذي تُبنى عليه الأفكار أو المشاريع، لكون المُشتمِل المباشر (علاقة) يدل على التجريد."

