    - lemma: "بقايا جيولوجية"
      decision: confirmed
      decision_reason: "تعبير وصفي مستقر وواضح في الأدبيات الجيولوجية لوصف ما يتبقى من تكوينات مندثرة."
      evidence_assessment:
