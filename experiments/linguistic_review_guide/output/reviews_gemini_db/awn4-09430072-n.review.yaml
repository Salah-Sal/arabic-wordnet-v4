      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح عام يشير إلى الكيان المادي المتبقي من التكوين الجيولوجي دون تخصيص شكل محدد."
      example: "عثر الجيولوجيون على بقايا جيولوجية تشير إلى وجود قاع محيط قديم في هذه المنطقة."
    - lemma: "تكوين متبق"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مركب وصفي يعبر بدقة عن (relict formation) ويقاس على المصطلحات المعتمدة في المجالات العلمية."
      step05_citation: "مُقاس على «الرواسب المتبقية» و«البحيرات المتبقية» الواردة في المكنز الزراعي للمصطلح relict."
