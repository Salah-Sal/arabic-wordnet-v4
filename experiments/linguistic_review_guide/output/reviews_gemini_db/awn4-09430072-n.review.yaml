      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب الأثري أو المعلم (trace/feature) الذي بقي من التكوين الأصلي، ليكون دليلا عليه."
