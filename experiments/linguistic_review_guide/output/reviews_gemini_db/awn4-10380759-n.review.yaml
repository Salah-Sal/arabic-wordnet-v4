      justification: "لفظ تراثي، يقال «رجل غُفْل» أي لا يُعرف ما عنده ولا علامة تميزه، وهو أدق تعبير عن غياب التصنيف (مجاز/استعارة من الأرض الغفل)."
  generation_notes: "تم توليد مرشحات تعكس معنى غياب السمات المميزة وعدم الجاذبية، بالاعتماد على الجسر الإنجليزي والاستعمالين التراثي والمعاصر."

