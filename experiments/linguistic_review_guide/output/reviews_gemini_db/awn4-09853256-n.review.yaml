step0_evidence:
  per_lemma:
    - lemma: "أَصْلَع"
      confirm:
        - text: "«المنحسِرُ شعر رأْسه»"
          source: "المعجم الوسيط"
        - text: "«(الأصلع) المنحسر شعر رَأسه و السنان المجلو وكل براق أملس وَهِي صلعاء (ج) صلع وصلعان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"

step05_lemma_generation:
  knowledge_candidates:
    - lemma: "أَقْرَع"
      justification: "استخدام مجازي شائع (إزاحة دلالية: إطلاق اسم ما به مرض القرع على كل من لا شعر برأسه)."
    - lemma: "حَلِيق الرَّأْس"
      justification: "تركيب إضافي يعبر عن الشطر الثاني من التعريف (محلوق)."
  generation_notes: "تم استخراج مرادفات من المعاجم والاستخدام الشائع."

step1_lemma_validation:
  per_lemma:
    - lemma: "أَصْلَع"
      decision: confirmed
      decision_reason: "مصطلح فصيح ودقيق ومطابق للمفهوم."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على من انحسر شعر رأسه طبيعياً."
      example: "كان الرجل أصلع لا يغطي رأسه قبعة."

    - lemma: "أَقْرَع"
      source: step05
      decision: removed
      decision_reason: "في الأصل تطلق على من فقد شعره بسبب مرض القرع، واستخدامها للصلع الطبيعي يعد من باب التوسع وربما يميل للعامية."
      step05_citation: "«مَن أصابه القَرَع» — المعجم الوسيط"
      substitution_test:
        result: "fail"
      nuance_differentiation: "تدل على من فقد شعره لمرض القرع."

    - lemma: "حَلِيق الرَّأْس"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر وليس مصطلحاً مسكوكاً."
      step05_citation: "تركيب مستنتج"
      substitution_test:
        result: "fail"
      nuance_differentiation: "تعني من حلق شعره بآلة."

  synset_flags:
    definition_review_needed: false

