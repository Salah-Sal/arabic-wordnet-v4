step0_evidence:
  per_lemma:
    - lemma: "إِمَّعَة"
      contradicts:
        - text: "«الذي يقول لكل أنا معك الذي يتردد في غير ضيعة» — كتاب العين"
          conflict: "يدل على التبعية وضعف الرأي وتقليد الآخرين (Yes-man) وليس على التبلد والشعور الآلي وانعدام المبالاة"
        - text: "«المحقِّب الناس دينه: المقلِّد الذى جعل دينه تابعا لدين غيره بلا رويَّة ولا تحصيل بُرهان» — المعجم الكبير"
          conflict: "يدل على التقليد الأعمى في المعتقد وليس على التصرف الميكانيكي المجرد"
    - lemma: "زُومْبِي"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "آلِيَّانِيّ"
      source_section: "step5_english_bridge"
      evidence_citation: "«الآليّانيّ: شخص يعمل بطريقةٍ آليّة أو روتينيّة» — المورد الحديث"
      justification: "مصطلح ورد في المورد الحديث (معجم معاصر) مقابلاً لـ automaton للدلالة على الشخص الذي يتصرف بآلية وروتينية (توليد بالاشتقاق)."
  knowledge_candidates:
    - lemma: "مُتَبَلِّد"
      justification: "اشتقاق (اسم فاعل) من الفعل تبلّد، يدل على الشخص الذي فقد الإحساس والتفاعل الحيّ وبات يتصرف بلا مبالاة (apathetic)."
    - lemma: "مَسْلُوب الإِرَادَة"
      justification: "تركيب إضافي يُطلق مجازاً على من فقد القدرة على اتخاذ القرار ويتصرف بتلقائية عمياء كالآلة (توليد بالتركيب)."

step1_lemma_validation:
  per_lemma:
    - lemma: "إِمَّعَة"
      decision: removed
      decision_reason: "كلمة 'إمعة' تدل على الشخص المقلد الذي لا رأي له ويتبع الآخرين (Yes-man)، ولا تدل على التبلد والشعور الآلي الميكانيكي أو انعدام المبالاة الذي يقصده المفهوم (Automaton)."
      evidence_assessment:
        case: "contradicts_only"
      substitution_test:
        result: "fail"
      nuance_differentiation: "الإمعة يتبع آراء الناس لضعف رأيه، بينما المفهوم يعبر عن شخص فاقد للإرادة والتفاعل الحي يتصرف كآلة بلا مبالاة."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "زُومْبِي"
      decision: removed
      decision_reason: "كلمة 'زومبي' مقترضة (دخيلة) وتُستخدم في الثقافة الشعبية للدلالة على الموتى الأحياء، واستخدامها المجازي للدلالة على المتبلد أو مسلوب الإرادة هو اقتراض مفهومي غير فصيح ولا يقرّه الاستعمال المرجعي للمعجم العربي."
      evidence_assessment:
        case: "no_material_found"
      substitution_test:
        result: "fail"
      nuance_differentiation: "مصطلح أعجمي غير فصيح يستعمل مجازياً في العاميات لفاقد الإرادة، ولا يصلح كلَمّة معجمية فصيحة."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "آلِيَّانِيّ"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح اشتق من (آلة) بإضافة اللاحقة (ـاني) للنسبة والمبالغة، وهو مصطلح معتمد في المعاجم الحديثة للتعبير عن الشخص الذي يتصرف بآلية."
      step05_citation: "«الآليّانيّ: شخص يعمل بطريقةٍ آليّة أو روتينيّة» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يعبر بدقة عن الجانب الميكانيكي والروتيني في تصرفات الشخص واستجابته للأوامر كأنه آلة."
      example: "أصبح الموظف آليّانياً ينفذ الأوامر دون تفكير أو شعور."
      actions:
        - command: create_entry
          params:
            lemma: "آلِيَّانِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09844921-n"
    - lemma: "مُتَبَلِّد"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل فصيح يدل على فاقد الإحساس والتفاعل، وهو يطابق الشق الثاني من التعريف (apathetic)."
      step05_citation: "من المعرفة اللغوية (توليد مصطلحي بالاشتقاق)."
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب الشعوري وانعدام المبالاة وتبلد الإحساس (Apathy)."
      example: "ظل المريض متبلداً طوال الجلسة ولم يستجب لأي مؤثر خارجي."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَبَلِّد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09844921-n"
    - lemma: "مَسْلُوب الإِرَادَة"
      source: step05
      decision: confirmed
      decision_reason: "تركيب وصفي متعارف عليه للتعبير عن الشخص الذي فقد قدرته على التصرف الذاتي وبات يستجيب كالآلة."
      step05_citation: "من المعرفة اللغوية (توليد مصطلحي بالتركيب)."
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على انعدام الإرادة والمبادرة الحرة، مما يجعله يتصرف بتلقائية مسلوبة."
      example: "وقف المتهم أمام المحكمة مسلوب الإرادة لا يبدي أي تفاعل مع ما يدور حوله."
      actions:
        - command: create_entry
          params:
            lemma: "مَسْلُوب الإِرَادَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09844921-n"
  added_lemmas:
    - lemma: "آلِيَّانِيّ"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "مُتَبَلِّد"
