      nuance_differentiation: "يدل على العملية الكيميائية والطبية لربط المعادن الثقيلة وتكوين مركب مخلبي، وهو أعمّ وأدق من المصطلحات الوصفية."
      example: "تعد عملية الاستخلاب ضرورية في علاج التسمم بالرصاص في جسم الإنسان."
    - lemma: "علاج بالاستخلاب"
      decision: confirmed
      decision_reason: "تعبير مركب فصيح ومستقر في الاستعمال الطبي العربي للدلالة على التطبيق العلاجي للاستخلاب."
