  knowledge_candidates:
    - lemma: "تطبيب خلبي"
      justification: "اشتقاق وصفي مستعمل نادراً في الأدبيات الطبية لوصف العلاج (chelation therapy)"
  generation_notes: "المصطلحات العربية تتراوح بين استخدام الجذر (خلب) بصيغ مختلفة (استخلاب، تمخلب، تكليب) وبين تعبيرات مركبة وصفيّة."

