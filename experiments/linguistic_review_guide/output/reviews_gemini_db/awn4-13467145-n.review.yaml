      source: step05
      decision: removed
      decision_reason: "على الرغم من وروده في المعجم الطبي الموحد، إلا أن دلالته اللغوية الأصلية (الخداع أو المخالب) قوية جداً مما يجعله ملتبساً في السياق العام مقارنة بـ «استخلاب»."
      step05_citation: "«خلب: chelation» — المعجم الطبي الموحد (2009)"
