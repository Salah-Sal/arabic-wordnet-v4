      source: step05
      decision: removed
      decision_reason: "أقل شيوعاً من «استخلاب» وقد يؤدي إلى التباس مع دلالات أخرى متعلقة بالكلاب."
      step05_citation: "«تكليب: chelation» — المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
