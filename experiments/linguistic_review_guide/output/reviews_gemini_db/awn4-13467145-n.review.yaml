        result: "pass"
      nuance_differentiation: "يخصص المفهوم بالجانب العلاجي (therapy) بخلاف «استخلاب» الذي قد يكون مجرد عملية كيميائية."
      example: "يخضع المرضى المصابون بفرط الحديد المزمن لجلسات علاج بالاستخلاب بانتظام."
