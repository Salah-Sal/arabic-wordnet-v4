  current_definition: "(في الطب) عملية إزالة المعادن الثقيلة من مجرى الدم عن طريق مخلب كما هو الحال في علاج التسمم بالرصاص أو الزئبق"
  assessment:
    decision: retain
    reason: "التعريف دقيق علمياً وموافق للمعنى المقصود في الطب والكيمياء."

