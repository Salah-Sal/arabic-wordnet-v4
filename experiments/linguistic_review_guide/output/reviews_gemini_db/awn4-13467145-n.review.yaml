      nuance_differentiation: "يُستخدم غالباً في الكيمياء لوصف حالة المركب أو عملية التفاعل ذاتها (formation of chelate)."
      example: "تتم عملية تمخلب المعادن لزيادة قدرة النبات على امتصاص المغذيات الدقيقة."
