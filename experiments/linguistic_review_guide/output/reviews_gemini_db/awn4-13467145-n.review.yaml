  per_lemma:
    - lemma: "استخلاب"
      decision: confirmed
      decision_reason: "المصطلح العلمي الأكثر شيوعاً ودقة والمؤكّد في المعاجم العلمية المتعددة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
