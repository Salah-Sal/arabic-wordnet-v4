step0_evidence:
  per_lemma:
    - lemma: "عَامِل"
      confirm:
        - text: "«الْعَامِل: من يعْمل فِي مهنة أَو صَنْعَة»"
          source: "المعجم الوسيط"
        - text: "«الذي يعمل على تشغيل الحاسوب أو النظام»"
          source: "معجم تقانة المعلومات"
      contradicts:
        - text: "«(فِي النَّحْو) مَا يَقْتَضِي أثرا إعرابيا فِي الْكَلم»"
          source: "المعجم الوسيط"
          conflict: "التعريف النحوي يخرج عن مفهوم الشخص"
        - text: "«(فِي الْحساب) الْعدَد الصَّحِيح الَّذِي يقسم عددا صَحِيحا آخر بِدُونِ بَاقٍ»"
          source: "المعجم الوسيط"
          conflict: "المعنى الرياضي يخرج عن المفهوم البشري"
      expands:
        - text: "«عنصر أو مؤثر يساهم في إنتاج أو ظهور النتائج»"
          source: "معجم علم الصيدلة"
          addition: "المعنى التجريدي للعامل كعنصر مسبب"
    - lemma: "فَاعِل"
      confirm:
        - text: "«الْفَاعِل: الْعَامِل والقادر والنجار وَمن يسْتَأْجر لأعمال الْبناء والحفر وَنَحْوهمَا»"
          source: "المعجم الوسيط"
        - text: "«الفاعل المختار: هو الذي يصح أن يصدر عنه الفعل مع قصد وإرادة»"
          source: "كتاب التعريفات للجرجاني"
      contradicts:
        - text: "«(فِي اصْطِلَاح النُّحَاة) اسْم أسْند إِلَيْهِ فعل أُصَلِّي الصِّيغَة أَو شبه فعل مُتَقَدم عَلَيْهِ»"
          source: "المعجم الوسيط"
          conflict: "المصطلح النحوي لا يقصد به الشخص لذاته"
      expands:
        - text: "«الفَاعِل: مَا يكون فِي الشَّيْء مؤثرا»"
          source: "معجم مقاليد العلوم"
          addition: "الدلالة على الفاعل كقوة مؤثرة عامة"

