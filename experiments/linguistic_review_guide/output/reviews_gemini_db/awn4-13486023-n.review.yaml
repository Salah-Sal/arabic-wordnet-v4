    - lemma: "نمو"
      source_section: "step7_english_bridge"
      evidence_citation: "«نمو: عملية نمو أو تطور، مع زيادة في الحجم أو في عدد» — مسرد المناخ والبيئة (ArabTerm)"
      justification: "يربط بين النمو والتطور كعملية تدريجية (development)"
    - lemma: "تقدم"
      source_section: "step7_english_bridge"
      evidence_citation: "«تقدم: وجود فيما مضى كما أن البقاء وجود فيما يستقبل» — التوقيف على مهمات التعاريف"
      justification: "يحمل دلالة التحرك للأمام (progress) وهو مرادف أساسي لـ development"
  knowledge_candidates:
    - lemma: "ترقٍ"
      justification: "اشتقاق من الجذر (رقي) على وزن (تَفَعُّل) للدلالة على الصيرورة والتدريج"

