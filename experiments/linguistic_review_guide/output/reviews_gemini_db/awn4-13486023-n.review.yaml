step0_evidence:
  per_lemma:
    - lemma: "ارتقاء"
      confirm:
        - text: "«ارتقى الشاعر بالصفة إلى ثلاث درجات»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
      expands:
        - text: "«الارتقاء في اصطلاح البلغاء هو البدء بالوصف ثم الارتقاء إلى أعلى»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
          addition: "يؤكد دلالة التدريج والمراحل الصاعدة"
    - lemma: "تطور"
      confirm:
        - text: "«التغير التدريجي الذي يحدث في بنية الكائنات الحية وسلوكها»"
          source: "المعجم الوسيط"
        - text: "«تحول من طور إلى طور»"
          source: "المعجم الوسيط"
        - text: "«نمو عضو ما أو كائن بحيث يمر من مراحل بسيطة إلى مراحل أكثر تعقيداً»"
          source: "معجم المصطلحات الطبية"
    - lemma: "نماء"
      confirm:
        - text: "«ما أحسن نمية أموالكم: أي نموها»"
          source: "المحيط في اللغة للصاحب بن عباد"
        - text: "«نماء الشيء: زاد وكثر»"
          source: "المحكم والمحيط الأعظم"

step05_lemma_generation:
