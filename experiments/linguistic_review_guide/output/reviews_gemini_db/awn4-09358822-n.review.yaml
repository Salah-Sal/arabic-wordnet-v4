    - lemma: "رقعة يابسة"
      source_section: "step5_reverse_lookup"
      evidence_citation: "«رقعة مترامية الأطراف [من ثلج أو ماء أو فضاء]» — المورد الحديث"
      justification: "تعبير وصفي دقيق للمساحات الواسعة من الأرض."
  knowledge_candidates:
    - lemma: "البر الرئيسي"
      justification: "يستخدم غالباً للإشارة إلى الكتل الأرضية الكبرى في مقابل الجزر (آلية التركيب)."
    - lemma: "متن اليابسة"
      justification: "استخدام 'المتن' للدلالة على الجزء العريض والأساسي من الشيء (آلية المجاز)."

step1_lemma_validation:
  per_lemma:
    - lemma: "كتلة أرضية"
      decision: confirmed
