    - lemma: "كتلة أرضية"
      confirm:
        - text: "«الكتلة الأرضية: مساحة واسعة من الأرض.» — المورد الحديث (2008)"
          source: "المورد الحديث"
      expands:
        - text: "«كتلة الأرض المقاومة للضغط...» — المعجم الكبير"
          source: "المعجم الكبير"
          addition: "استخدام المصطلح في سياق جيولوجي تخصصي"
    - lemma: "كتلة يابسة"
      confirm:
        - text: "«جزيرة العالَم: كتلة اليابسة المؤلَّفة من أوروبا وآسيا وإفريقيا.» — المورد الحديث (2008)"
          source: "المورد الحديث"
    - lemma: "يابسة"
      confirm:
        - text: "«يابسة: تأنيث الشيء اليابس ضد النديّ» — معجم البلدان"
          source: "معجم البلدان"
      peripheral_observations:
        - "تستخدم اليابسة كاسم جنس لليابس من الأرض في مقابل البحر."

step05_lemma_generation:
