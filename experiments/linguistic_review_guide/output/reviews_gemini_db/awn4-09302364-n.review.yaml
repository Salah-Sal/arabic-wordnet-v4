step0_evidence:
  per_lemma:
    - lemma: "لُقطة"
      confirm:
        - text: "«اللُّقَطة: الشيء الذي تجده مُلقىً فتأخذه»"
          source: "المعجم الوسيط"
        - text: "«اللُّقَطة: مال يوجد على الأرض ولا يعرف له مالك»"
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: "«المنظر في الفيلم تؤخذ صورته على حدة (محدثة)»"
          source: "المعجم الوسيط"
          addition: "معنى تقني معاصر في السينما مستقل عن المفهوم العام"

    - lemma: "مُكتشف"
      evidence_status: "no_material_found"
      peripheral_observations:
        - lemma: "مُكتشِف"
          meaning_observed: "اسم فاعل بمعنى الشخص الذي يكتشف (Discoverer)"
          source: "المعجم الوسيط"
          note: "اللمة في المجموعة قد تكون بكسر الشين (اسم فاعل) وهو ما يناقض كون المجموعة (جسم)، أو بفتحها (اسم مفعول) وهو غير شائع كاسم للشيء الملقوط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "لُقْيَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«اللُّقية: شيء نفيس يُكتشف» — المورد الحديث"
      justification: "مقابل مباشر لـ (find) ويختص بالأشياء ذات القيمة المكتشفة"
    - lemma: "ضَالَّة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الضَّالَّة: كل ما ضاع وفقد من المحسوسات» — المعجم الوسيط"
      justification: "تستخدم في السياق التراثي والمعاصر لكل ما يُفقد ثم يُعثر عليه"
  knowledge_candidates:
    - lemma: "مَوْجُودَات"
      justification: "تستخدم في السياق العملي للأشياء التي يتم العثور عليها أو حصرها (ترجمة لـ findings)"
    - lemma: "مُكْتَشَفَات"
      justification: "جمع (مُكتشف) ويشيع استخدامه للدلالة على الأشياء المكتشفة في الحفريات والبحوث (archaeological findings)"

step1_lemma_validation:
  per_lemma:
    - lemma: "لُقطة"
      decision: "confirmed"
      decision_reason: "أدلة معجمية قوية تؤكد المعنى في السياق العام والشرعي"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الشيء الملقى على الأرض الذي يُؤخذ صدفة"
      example: "أعلنَ المذيعُ عن العثور على لُقطة ثمينة أمام مدخل المسرح."

    - lemma: "مُكتشف"
      decision: "removed"
      decision_reason: "خلط في نوع الكلمة (POS)؛ فالمُكتشِف (بالكسر) هو الشخص، والمُكتشَف (بالفتح) هو اسم مفعول نادر الاستخدام كوحدة معجمية مفردة لهذا المفهوم مقارنة بـ (اكتشاف) أو (لقية)"
      evidence_assessment:
        case: "no_material"
      actions:
        - command: "remove_sense"
          params:
            sense_id: "{auto}"

    - lemma: "لُقْيَة"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مرادف قوي وشائع الاستخدام للأشياء المكتشفة، خاصة النفيسة منها"
      step05_citation: "«اللُّقية: شيء نفيس يُكتشف» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص بالأشياء ذات القيمة أو الأهمية التي يتم العثور عليها"
      example: "تُعدّ هذه اللُّقية الأثرية من أهم اكتشافات العصر البرونزي."
      actions:
        - command: "create_entry"
          params:
            lemma: "لُقْيَة"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09302364-n"

    - lemma: "ضَالَّة"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مصطلح عربي تراثي وفصيح يدل على الشيء المفقود الذي يُعثر عليه"
      step05_citation: "«الضَّالَّة: كل ما ضاع وفقد من المحسوسات» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على كون الشيء مفقوداً أو ضائعاً قبل العثور عليه"
      example: "أخيراً وجدَ الباحثُ ضالتَه في المخطوطات القديمة."
      actions:
        - command: "create_entry"
          params:
            lemma: "ضَالَّة"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09302364-n"

