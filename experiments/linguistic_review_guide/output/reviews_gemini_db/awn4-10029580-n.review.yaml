step0_evidence:
  per_lemma:
    - lemma: "المدد الغيبي"
      confirm:
        - text: "«المدد: العون، الغوثُ»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«(المدد) مَا يمد بِهِ الشَّيْء يُقَال مددته بمدد قويته وأعنته بِهِ»"
          source: "المعجم الوسيط"
        - text: "«الغيب: ما غاب عن الحس»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      # المدد الغيبي تركيب إضافي وصفي يدل على المعونة التي تأتي من عالم الغيب، وهو ما يوافق دلالة "deus ex machina" في التدخل الخارق لحل مشكلة.

    - lemma: "حل من الغيب"
      confirm:
        - text: "«(الْغَيْب) خلاف الشَّهَادَة وكل مَا غَابَ عَن الْإِنْسَان»"
          source: "المعجم الوسيط"
        - text: "«الغيب: ما غاب عن الحس»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      # حل من الغيب تركيب يدل على مخرج أو حل يأتي من مصدر غير معلوم أو خارق للعادة.

