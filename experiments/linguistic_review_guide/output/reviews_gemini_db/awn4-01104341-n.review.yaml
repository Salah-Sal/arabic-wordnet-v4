step0_evidence:
  per_lemma:
    - lemma: "إشهار"
      confirm:
        - text: "«إشهار الخَبَر... الصواب والرتبة: -إشهار الخبر [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«الإعلان عن منتوج ما والترويج له.»"
          source: "مسرد الإعلام والتواصل"
    - lemma: "نشر"
      confirm:
        - text: "«عملية تعميم خبر أو معلومة على الناس.»"
          source: "مسرد الإعلام والتواصل"
        - text: "«ونشرت الخبر أنشره وأننشره، إذا أذعته.»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      expands:
        - text: "«طبع الكتب والصحف وبيعها (محدثة)»"
          source: "المعجم الوسيط"

step05_lemma_generation:
  knowledge_candidates:
    - lemma: "إذاعة"
      justification: "اشتقاق من الجذر (ذ-ي-ع) على وزن إفْعالة، ويدل على نشر الأخبار والمعلومات بين الناس وإفشائها."
    - lemma: "إعلان"
      justification: "اشتقاق من الجذر (ع-ل-ن) على وزن إفْعال، بمعنى الإظهار والمجاهرة وإعلام الجمهور."

step1_lemma_validation:
  per_lemma:
    - lemma: "إشهار"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل للدلالة على الإعلان وإظهار الأمر للجمهور (كإشهار الإفلاس أو الزواج)."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب الرسمي أو الإعلاني في جعل الأمر معلوماً للجمهور، ويغلب استخدامه في السياقات القانونية أو التجارية."
      example: "تم إشهار الجمعية الخيرية في الجريدة الرسمية لتبدأ نشاطها."
    - lemma: "نشر"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومطرد يمثل المعنى بدقة، سواء في نشر الأخبار أو المطبوعات."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "هو اللفظ الأعم والأشمل الدال على بث المعلومات وإذاعتها أو طباعتها وتوزيعها."
      example: "أسهم نشر المقال في توعية الناس بأهمية الموضوع."
    - lemma: "إذاعة"
      source: step05
      decision: removed
      decision_reason: "رغم تقارب المعنى، إلا أن (إذاعة) قد استقرت كمصطلح مستقل يدل غالباً على البث الصوتي (Radio) أو إفشاء السر، والأفضل قصر المجموعة على النشر والإشهار."
      step05_citation: "معرفة لغوية"
      substitution_test:
        result: "fail"
      nuance_differentiation: "مستبعد"
    - lemma: "إعلان"
      source: step05
      decision: removed
      decision_reason: "يحمل دلالة إضافية تتعلق بالبيانات التجارية أو الإخبار الرسمي، ويفضل إبقاؤه في مجموعة ترادفية مستقلة تعبر عن (Announcement)."
      step05_citation: "معرفة لغوية"
      substitution_test:
        result: "fail"
      nuance_differentiation: "مستبعد"
  synset_flags:
    definition_review_needed: true

