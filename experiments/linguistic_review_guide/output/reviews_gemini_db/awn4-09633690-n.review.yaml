step0_evidence:
  per_lemma:
    - lemma: "مُبَلِّغ"
      confirm:
        - text: "«الذي يُبَلِّغُ للناسِ بعضِهم حدِيثَ بعض»"
          source: "لسان العرب"
        - text: "«بَلَّغْتُ الرِّسالة»"
          source: "لسان العرب"
        - text: "«الإبلاغ: الإيصال»"
          source: "لسان العرب"
      contradicts:
        - text: "«المبلغ: المنتهى والمقدار من المال»"
          source: "المعجم الوسيط"
          conflict: "يشير النص إلى الاسم (مَبْلَغ) بينما اللمّة هي اسم الفاعل (مُبَلِّغ)"
      expands:
        - text: "«مُبَلِّغ: مَن يُخبر عن وقوع جريمة»"
          source: "استعمال معاصر"
          addition: "دلالة المُخبِر أو المُخطِر"

    - lemma: "مُتَوَاصِل"
      confirm:
        - text: "«التواصل هو تبادل الكلام بين متكلم ينتج ألفاظا موجهة لمتكلم آخر يقوم بدور المخاطب المستمع»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      contradicts:
        - text: "«متواصل: مستمر»"
          source: "المعجم الوسيط"
          conflict: "المعنى الشائع هو الصفة بمعنى الاستمرار"
      expands:
        - text: "«تواصل الثقافات: مجال يهتم بكيفية تواصل/تحاور أطراف وفاعلين من ثقافات مختلفة»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          addition: "دلالة التفاعل الثقافي"

