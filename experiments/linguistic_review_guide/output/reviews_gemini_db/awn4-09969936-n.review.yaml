step0_evidence:
  per_lemma:
    - lemma: "قهري"
      confirm:
        - text: "«قَهْرِيّ: compulsive»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«قَسْريّ؛ قَهْريّ: قويّ؛ مُؤثِّر؛ فعّال.»"
          source: "المورد الحديث (2008)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "موسوس"
      source_section: "step4_fts_keyword"
      evidence_citation: "«مُوَسْوَس: تنتابُهُ الوساوسُ أو الهواجس.» — المورد الحديث (2008)"
      justification: "كلمة تستعمل لمن يعاني من إلحاح وهواجس قهرية تدفعه للقيام بأفعال معينة (توليد بالاشتقاق من الوسوسة)."
  knowledge_candidates:
    - lemma: "مضطر"
      justification: "الذي يشعر بقوة داخلية تقهره على الفعل، من الاضطرار وهو الاحتياج القسري (توليد بالاشتقاق)."
  generation_notes: "تم استخراج 'موسوس' من المعاجم كمرادف قريب للمريض الذي يعاني من أفعال قهرية."

step1_lemma_validation:
  per_lemma:
    - lemma: "قهري"
      decision: confirmed
      decision_reason: "مصطلح طبي مستقر يقابل (compulsive)، ويمكن استعماله اسماً للشخص (القهري)."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على من يندفع للقيام بأفعال قسرية لا إرادية."
      example: "لا يستطيع القهريّ التوقف عن تكرار غسل يديه."
      actions: []

    - lemma: "موسوس"
      source: step05
      decision: removed
      decision_reason: "مصطلح يشير عادةً إلى الاستحواذ والأفكار الملحّة (obsessive) وليس الأفعال القهرية (compulsive)، فالطب النفسي يميز بينهما (وسواسي قهري)."
      step05_citation: "«مُوَسْوَس: تنتابُهُ الوساوسُ أو الهواجس.» — المورد الحديث (2008)"

    - lemma: "مضطر"
      source: step05
      decision: removed
      decision_reason: "مضطر تعني المجبر على الفعل من قوة خارجية أو ظروف قاهرة، بينما القهري مدفوع بدوافع نفسية داخلية مَرَضية."
      step05_citation: "«مكره؛ مضطر» — المورد الحديث (2008)"

  synset_flags:
    definition_review_needed: false
    split_needed: false

step3_definition:
  definition_review_flag: false
  current_definition: "شخص ذو طبع قهري؛ شخص يشعر بأنه مضطر للقيام بأشياء معينة"
  assessment:
    decision: retain
    reason: "التعريف دقيق وواضح ويغطي المعنى الطبي والعام للمصطلح الإنجليزي."

step4_relations:
  hypernymy:
    current_hypernym: "عَامِل"
    test_result: "correct"
  antonymy:
    per_lemma: []
  verb_checks:
    applicable: false
  selectional_restrictions:
    - lemma: "قهري"
      constraint: "يطلق على الإنسان (المريض أو صاحب الطبع)"

step5_enrichment:
  per_lemma:
    - lemma: "قهري"
      enrichment:
        root: "ق-ه-ر"
      examples:
        - text: "لا يستطيع القهري التوقف عن تكرار أفعاله."
          type: usage
          source: "مؤلَّف"
      pos_check:
        pos: noun
  cultural_fit:
    assessment: native
