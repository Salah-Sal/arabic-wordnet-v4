step0_evidence:
  per_lemma:
    - lemma: "شخصية"
      confirm:
        - text: "«الشخصية: صِفات تميز الشَّخْص من غَيره وَيُقَال فلَان ذُو شخصية قَوِيَّة ذُو صِفَات متميزة وَإِرَادَة وكيان مُسْتَقل (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الشخصية: صفات تميز الشخص عن غيره»"
          source: "المعجم الكبير"
        - text: "«الشخصية: كامل خصائص الفرد الذاتية المميِّزة، مجموع نزعات الفرد السلوكيّة والعاطفية»"
          source: "المورد الحديث"
      expands:
        - text: "«الشخصية (في الأدب): أحد الأفراد الخياليين أو الواقعيين الذين تدور حولهم القصة أو المسرحية»"
          source: "المعجم الكبير"
          addition: "استعارة المفهوم للأدب والتمثيل"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "طبع"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الطَّبْع (في علم النَّفس) مجموعَةُ مَظاهِر الشُّعورِ والسُّلوكِ المكتسبةِ والْمَوْرُوثة التي تميزُّ فردًا عن آخر» — المعجم الكبير"
      justification: "مطابقة تامة لتعريف المجموعة في علم النفس"
    - lemma: "خلق"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الخُلُق: السَّجِيَّة والطَّبع صُورَة الإنسان الباطِنَة، وهي نَفْسه وأوصافها ومعانيها المختصة بها» — المعجم الكبير"
      justification: "المرادف التراثي الأصيل لمفهوم الشخصية الباطنة"
  knowledge_candidates:
    - lemma: "سجية"
      justification: "تشير إلى الطبيعة الراسخة في النفس التي تميز الفرد، وهي من آلية المجاز (الإزاحة من السكون إلى الثبات النفسي)"
  generation_notes: "تم التركيز على المفردات التي تعبر عن 'مجموعة الصفات' ككتلة واحدة (طبع، خلق، سجية)"

