step0_evidence:
  per_lemma:
    - lemma: "خبير"
      confirm:
        - text: "«ذو الخِبْرة الذي يُخْبِرُ الشئَ بعِلْمِهِ» — المعجم الوسيط"
        - text: "«الذي يعلم الأشياء ويقف على حقيقتها بعلمه وقدرته» — موسوعة السلطان قابوس لأسماء العرب"
        - text: "«العليمُ بظواهر الأشياءِ وبِبَواطِنِها» — المعجم الكبير"
      expands:
        - text: "«expert; competent person; skilled person» — موسوعة الكهرباء (IEC 60050)"
    - lemma: "متخصص"
      confirm:
        - text: "«specialist» — المعجم الموحد لمصطلحات علم الصحة وجسم الانسان"
        - text: "«specialized» — المعجم الموحد لمصطلحات علم الأحياء"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "اختصاصي"
      source_section: "step5_english_bridge"
      evidence_citation: "«specialist» — المورد الحديث"
      justification: "اللفظ المعاصر الأكثر شيوعاً كلقب مهني للشخص المتخصص."
    - lemma: "ماهر"
      source_section: "step5_english_bridge"
      evidence_citation: "«skilled person» — موسوعة الكهرباء"
      justification: "يؤكد جانب المهارة (skillfully) المذكور في التعريف."
    - lemma: "حاذق"
      source_section: "step9_specialized"
      evidence_citation: "«الماهر في كل شيء» — كتاب العين"
      justification: "لفظ تراثي فصيح يجمع بين المهارة والذكاء في الأداء."
  knowledge_candidates:
    - lemma: "ضليع"
      justification: "تعبير مجازي شائع (اشتقاق من قوة الأضلاع) للشخص المتمكن جداً من علمه."
  generation_notes: "تم التركيز على اللمات التي تجمع بين المعرفة العلمية (knowledge) والقدرة الأدائية (ability) كما في التعريف."

