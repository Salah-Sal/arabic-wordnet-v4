      nuance_differentiation: "يركز على الوصف الحركي البنيوي (الاختراق) كبديل فصيح للمصطلح المعرب (ديابير)."
      example: "تتميز الطية الاختراقية بقدرتها على اختراق الطبقات الصخرية الهشة التي تعلوها."
