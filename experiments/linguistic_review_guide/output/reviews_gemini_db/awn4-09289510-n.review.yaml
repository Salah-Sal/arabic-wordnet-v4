      example: "تنتشر قباب ملحية ضخمة في منطقة الخليج العربي كمصائد نفطية هامة."

    - lemma: "طية اختراقية"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح عربي فصيح ودقيق (مركب وصفي) يصف الآلية والشكل وموثق معجمياً، ويفضل على المعرب."
      step05_citation: "«طية اختراقية: diapir fold» — المعجم الموحد لمصطلحات النفط (1999)"
      mwe_check:
        is_mwe: true
