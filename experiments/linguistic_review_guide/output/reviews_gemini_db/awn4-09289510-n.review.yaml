      decision_reason: "الصيغة المفردة (مركب وصفي) للمصطلح المؤكد (قباب ملحية)، وتتطابق مع الإفراد في التعريف (تكوين صخري)."
      step05_citation: "«قبة ملحية: salt dome» — المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      mwe_check:
