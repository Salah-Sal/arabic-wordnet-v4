step0_evidence:
  per_lemma:
    - lemma: "شيء لا يوصف"
      confirm:
        - text: "«لا يوصف: ما لا يمكن التعبير عنه باللغة بطريقة دقيقة، يستحيل الإلمام بوصفهما والإحاطة بوضعهما»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«لا يمكن وصفه / يفوق الوصف (indescribable)»"
          source: "المورد الحديث"
        - text: "«متعذّرٌ تعريفُهُ أو تحديدُه (indefinable)»"
          source: "المورد الحديث"
        - text: "«فأقبل إليه من الحيتان ما لا يوصف»"
          source: "تكملة المعاجم العربية (دوزي)"
        - text: "«من الغنائم ما لا يوصف»"
          source: "معجم البلدان (ياقوت)"
      peripheral_observations:
        - lemma: "شيء لا يوصف"
           المعنى_الملاحَظ: "التركيب لا يوجد كمدخل مستقِل في المعاجم التقليدية بل يُستعمل كبناء نحوي وصفي (نعت)، لكنه معجم في المعاجم المتخصصة الحديثة."
          source: "المعجم الموحد"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "ما لا يوصف"
      source_section: "step4_fts_keyword"
      evidence_citation: "«من الغنائم ما لا يوصف» — معجم البلدان"
      justification: "تعبير اسمي (موصول) مستقر في التراث والمعاصرة للدلالة على الكثرة أو العظمة التي تعجز اللغة عن حصرها، وهو أقرب للسك المعجمي من 'شيء لا يوصف'."
    - lemma: "متعذر الوصف"
      source_section: "step4_fts_keyword"
      evidence_citation: "«تعذُّر الوصف: متعلق بما لا يمكن وصفه أو التعبير عنه» — مسرد الإعلام والتواصل (ArabTerm)"
      justification: "مصطلح تقني دقيق يطابق تعريف المجموعة تماماً."
  knowledge_candidates:
    - lemma: "يفوق الوصف"
      justification: "تعبير اصطلاحي (Idiomatic expression) شائع جداً في العربية المعاصرة كمرادف دقيق لـ indescribable."
    - lemma: "فائق الوصف"
      justification: "مصطلح معجم في لسانيات السيميائية للدلالة على ما يستعصي على التعبير اللغوي الدقيق."
  generation_notes: "المفهوم يتأرجح بين 'الشيء غير القابل للوصف' (indescribable thing) وبين 'السمة الخفية' (je ne sais quoi). الأدلة العربية تدعم الجانب الوصفي للكثرة أو الاستعصاء الدلالي."

