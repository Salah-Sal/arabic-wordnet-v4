  current_definition: "شخص يجادل؛ شخص يجيد أو يستمتع بالجدل"
  assessment:
    decision: retain
    reason: "التعريف دقيق ومباشر ويغطي الجانبين الوظيفي والنفسي (الاستمتاع بالجدل) للكلمة."

