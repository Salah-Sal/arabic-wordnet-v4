step0_evidence:
  per_lemma:
    - lemma: "مُجادِل"
      confirm:
        - text: "«المجادل: هو صاحب الجدل أو صاحب المجادلة كما عرفت.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«جادل الشَّخْصُ: ناقش وخاصم»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "مُخاصِم"
      confirm:
        - text: "«الخَصْمُ: المُخاصِمُ»"
          source: "المعجم الوسيط"
        - text: "«الخَصْمُ: المُنازِع»"
          source: "المعجم الكبير"
      expands:
        - text: "«الخَصْمُ: يستوِى فيه المُذَكَّرُ والمؤنَّثُ، والمُفْرَدُ والمُثَنَّى والجمعُ، لأنّه فى الأصلِ مَصَدَرٌ، سُمَّى به»"
          source: "المعجم الكبير"
          addition: "تشير الأدلة إلى أن 'خصم' تطلق على المذكر والمؤنث والواحد والجمع بنفس الصيغة."
    - lemma: "مُنازِع"
      confirm:
        - text: "«المنازع: المخالف، كأن كل واحد من المتخالفين ينزع ما في يد صاحبه أي يستخرجه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«مُنَازِع: المخاصم، والمغالب، والمتصل بالشيء والمجاذب له.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُناظِر"
      source_section: "step5_english_bridge"
      evidence_citation: "«المجادل؛ المناظر: المشارك في جدل أو مناظرة» — المورد الحديث"
      justification: "يرد 'مناظر' كمرادف للمجادل في سياق الجدل والمناظرة."
  knowledge_candidates:
    - lemma: "مُحاجّ"
      justification: "اسم فاعل من 'حاجَّ' بمعنى جادلَ وأقام الحجة، وهو آلية اشتقاق من الجذر (ح-ج-ج) للتعبير عن الشخص الممارس للمحاجة."
    - lemma: "مُمَارٍ"
      justification: "اسم فاعل من 'مارى' (wrangled/disputed)، والمماراة هي الجدال على وجه التعنت."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُجادِل"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والأكثر شيوعاً للمفهوم، مدعوم بأدلة معجمية واضحة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب الكلامي والمحاججة المنطقية أو الكلامية (الجدل)."
      example: "كان سقراط مُجادِلاً بارعاً يستنطق خصومه ليُظهر عجزهم."
    - lemma: "مُخاصِم"
      decision: confirmed
      decision_reason: "مرادف قوي، ويُستعمل للمنازع في الخصومة والجدل."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على وجود طرف مضاد في خصومة (opposition)، وقد يكون في سياق قانوني أو عدائي."
      example: "يصعب إقناع المُخاصِم العنيد حتى لو قُدمت له أوضح البراهين."
    - lemma: "مُنازِع"
      decision: confirmed
      decision_reason: "مرادف فصيح يعبر عن ممانعة الآخر ومحاولة غلبته في الرأي أو الحق."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الفعل المباشر للتصدي أو التنازع (contention)، ويوحي بمحاولة سلب الحق أو الرأي من الآخر."
      example: "المُنَازِعُ في الحقائق الثابتة يهدف غالباً إلى إثارة الشك."
    - lemma: "مُناظِر"
      source: step05
      decision: removed
      decision_reason: "أكثر تخصصاً في الجلسات الرسمية والمناظرات المنظمة، بينما المفهوم العام للـ disputant يشمل الجدل العفوي أو الدائم."
      step05_citation: "«المجادل؛ المناظر: المشارك في جدل أو مناظرة» — المورد الحديث"
    - lemma: "مُحاجّ"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح يعبر بدقة عن 'من يقدم الحجج' في سياق الجدال."
      step05_citation: "«مُحّاجّ: المجادل» — موسوعة السلطان قابوس لأسماء العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يبرز قدرة الشخص على صياغة وتقديم الحجج (arguments) لإفحام الخصم."
      example: "اشتهر كبار المتكلمين بأنهم مُحاجُّون أقوياء في قضايا العقيدة."
      actions:
        - command: create_entry
          params:
            lemma: "مُحاجّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09638495-n"

step3_definition:
