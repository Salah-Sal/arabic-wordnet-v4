step0_evidence:
  per_lemma:
    - lemma: "تيار مائي"
      expands:
        - text: "«تيار مائي»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: "مصطلح تقني لتيار المياه يتقاطع مع المفهوم"
    - lemma: "مجرى مائي"
      confirm:
        - text: "«يقصد بالمجرى المائي- طبقاً للمادة 2 من اتفاقية الأمم المتحدة لعام 1997 بشأن الاستخدامات لغير أغراض الملاحة للمجاري المائية الدولية- نظام المياه السطحية والمياه الجوفية التي تشكل بحكم علاقاتها الطبيعية (المادية) ببعضها البعض كتلة واحدة، والتي تتدفق وتندفع نحو نقطة وصول واحدة.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«هي مجاري بمياه متدفقة مواقع مائية، وتشمل الطبيعية والاصطناعية، على أن يكون هناك انحدار.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "ماء جار"
      source_section: "step4_fts_keyword"
      evidence_citation: "«المجاري المائية السطحية المُتدفقة باستمرار أو على فترات زمنية مُعينة. وهو المُسمى العام للجداول، والأنهار، والتيارات المائية، والقنوات، وما شابه ذلك.» — المعجم الموحد لمصطلحات المياه (2000)"
      justification: "مصطلح يطابق التعريف بدقة ويعبر عن عموم المياه الجارية، وقد ورد في المعاجم الحديثة كمقابل لـ flowing water."
    - lemma: "جدول"
      source_section: "step5_english_bridge"
      evidence_citation: "«مجرى مائي صغير» — المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      justification: "الجدول هو مجرى مائي مستمر الجريان يعبر عن المفهوم."
  knowledge_candidates:
    - lemma: "مسيل مائي"
      justification: "تركيب وصفي من اشتقاق 'مسيل' (ما سال من الماء أو موضع السيل) و'مائي'، يطلق على المجرى الطبيعي للماء المطابق لمفهوم stream."

