          addition: "معنى تقني مستعار من مفهوم القاعدة/الأرضية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "صعيد"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الصعيد: وجه الأرض ترابا كان أو غيره» — المعجم الوسيط"
      justification: "مصطلح عربي كلاسيكي وأصيل يعبر بدقة عن 'وجه الأرض' أو السطح الذي يطأه الناس والحيوانات."
  knowledge_candidates:
    - lemma: "وجه الأرض"
      justification: "تركيب وصفي (إضافي) شائع جداً للتعبير عن سطح الأرض الخارجي."
    - lemma: "أديم الأرض"
      justification: "تعبير أدبي (مجازي) يشير إلى ظاهر الأرض، وهو من الفصيح التراثي."

step1_lemma_validation:
  per_lemma:
    - lemma: "أرضية"
      decision: confirmed
      decision_reason: "المصطلح الحديث الشائع للتعبير عن سطح المكان (سواء كان بناءً أو غابة أو غيرهما) الذي يُتحرك عليه."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على المساحة أو السطح المحصور أو الممهد (كأرضية الغرفة أو أرضية الغابة)."
      example: "تم تنظيف أرضية القاعة استعدادًا للحفل."
    
    - lemma: "صعيد"
      source: step05
      decision: confirmed
      decision_reason: "لفظ أصيل يعبر عن سطح الأرض بوجه عام، وهو المرادف الأقوى لكلمة ground في سياقها الطبيعي."
      step05_citation: "«الصعيد: وجه الأرض» — القاموس المحيط والمعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يميل للاستخدام في السياقات الطبيعية والمفتوحة والأرض الفضاء، بخلاف 'أرضية' التي تميل للمساحات المحددة."
      example: "سار المسافر فوق صعيد وعر."
      actions:
        - command: create_entry
          params:
            lemma: "صعيد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09305114-n"

    - lemma: "وجه الأرض"
      source: step05
      decision: confirmed
      decision_reason: "تركيب إضافي ثابت ومعجمي يعبر عن السطح الظاهر من الأرض."
      step05_citation: "«الصعيد: وجه الأرض» — المعجم الوسيط"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير وصفي مباشر لسطح الأرض."
      example: "انتشرت الكائنات الحية على وجه الأرض."
      actions:
        - command: create_entry
          params:
            lemma: "وجه الأرض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09305114-n"

