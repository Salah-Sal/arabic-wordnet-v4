        - text: "«فى الجغرافيا gulf: امتدادٌ من مياه البِحارِ أو الأَنْهارِ مُتَوغِّلٌ فى اليابسِ»"
          source: "المعجم الكبير"
        - text: "«امتدادٌ من الماء متوغِّلٌ في اليابس»"
          source: "المعجم الوسيط"
    - lemma: "خليج كبير"
