step1_lemma_validation:
  per_lemma:
    - lemma: "شرذمة"
      decision: confirmed
      decision_reason: "مصطلح أصيل وموثق في المعاجم لوصف الجماعات المنقطعة أو القليلة، ويتفق تماماً مع جوهر المفهوم."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "توحي بالانفصال عن الأصل والقلة، وغالباً ما تحمل ظلالاً من الازدراء أو وصف المجموعات الخارجة عن النظام العام في الاستعمال المعاصر."
      example: "﴿ إِنَّ هَٰؤُلَاءِ لَشِرْذِمَةٌ قَلِيلُونَ ﴾"

    - lemma: "مجموعة متفرقة"
      decision: confirmed
      decision_reason: "تعبير وصفي مستقر وشائع، يخدم الدلالة المحايدة للمجموعة غير المنتظمة مكانياً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "وصف موضوعي يركز على التباعد المكاني وعدم الانتظام، دون إيحاءات قيمية إيجابية أو سلبية."
      example: "رأيت مجموعة متفرقة من الأشجار على قمة الجبل."

    - lemma: "أوزاع"
      source: step05
      decision: confirmed
      decision_reason: "إحياء للفظ تراثي فصيح يصف الجماعات المتفرقة بدقة عالية، ويملأ فجوة معجمية للمصطلحات غير المركبة."
      step05_citation: "«أَتَيْتُهُمْ وَهُمْ أَوْزَاعٌ أَي مُتَفَرِّقُون» — لسان العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على تعدد الوحدات الصغيرة المنفصلة التي لا يجمعها نظام واحد، ويصلح للاستعمال في السياقات الأدبية والفصيحة."
      example: "خرج الناس من القاعة أوزاعاً بعد انتهاء الحفل."
      actions:
        - command: create_entry
          params:
            lemma: "أوزاع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07955399-n"

