step0_evidence:
  per_lemma:
    - lemma: "تميمة الحظ"
      expands:
        - text: "«التميمة: خرزة رقطاء... كانوا يعتقدون أنها تمام الدواء والشفاء»"
          source: "المعجم الكبير"
          addition: "المعجم يربطها بالشفاء، والترجمة الحديثة تربطها بالحظ."
        - text: "«سوار الحظ: سوار تتدلى منه أشكال ورموز صغيرة جالبة للحظ»"
          source: "مسرد صناعة النسيج (ArabTerm)"
          addition: "استعمال مركب مشابه يؤكد سك المصطلح."
    - lemma: "جالب للحظ"
      confirm:
        - text: "«الحظ: النصيب، والجد، أو خاص بالنصيب من الخير والفضل»"
          source: "القاموس المحيط"
        - text: "«جالب: الذي يسوق الشيء من موضع إلى آخر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

