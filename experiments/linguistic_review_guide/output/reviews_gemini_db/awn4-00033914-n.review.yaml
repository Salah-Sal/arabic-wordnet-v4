step0_evidence:
  per_lemma:
    - lemma: "كَمِّيَّة"
      confirm:
        - text: "«الكمية: الكم (مو)» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«رقم يدل على حجم أو وزن معين من مادة مصحوب بوحدة القياس المستعملة» — ArabTerm"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«عددٌ، موجبٌ أو سالب، صحيحٌ أو كسري، يُستعمَلُ للدلالة على قيمةٍ ما» — ArabTerm"
          source: "معجم مصطلحات المعلوماتية (ArabTerm)"
          addition: "تشمل الأعداد المجردة والقيم المنطقية"

    - lemma: "مِقْدَار"
      confirm:
        - text: "«مقدار الشيء مثله في العدد أو الكيل أو الوزن أو المساحة» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«لغة: هو الكمية، واصطلاحًا: هو الكمية المتصلة المتناولة للجسم والخط والسطح والثخن» — التعريفات للجرجاني"
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: "«السمة المُميِّزة لشيءٍ ما (= جسم ، حالة، عملية). يُستخدم مُصطلح مقدار لوصف هذه السمة المُميِّزة (مثل: الطول، الوزن، الزمن)» — ArabTerm"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          addition: "دلالة اصطلاحية تقنية تشمل السمات الفيزيائية القابلة للقياس"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "كَمّ"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الكم: مقدار الشيء. (مو)» — المعجم الوسيط"
      justification: "اللفظ الأصيل الذي تشتق منه الكمية، ويُستخدم في الاصطلاح المنطقي والرياضي للدلالة على ذات المفهوم."
  knowledge_candidates:
    - lemma: "قَدْر"
      justification: "لفظ عربي أصيل يُعبر عن المقدار أو المبلغ من الشيء، ويُستخدم بكثرة في السياقات العامة (بقدر كذا، قدر كافٍ)."
      generation_mechanism: "مجاز (توسع دلالي من التقدير)"
  generation_notes: "المفهوم مركزي في الرياضيات والفيزياء؛ الألفاظ المختارة تغطي الجانبين التقني (كم) والعام (قدر)."

