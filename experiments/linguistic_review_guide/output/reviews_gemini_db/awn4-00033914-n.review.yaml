      example: "يجب تحديد مقدار الشحنة الكهربائية بدقة لضمان استقرار الدائرة."

    - lemma: "كَمّ"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مصطلح أساسي في المنطق والرياضيات مرادف للمقدار، ومدعوم بأدلة المعجم الوسيط."
      step05_citation: "«الكم: مقدار الشيء. (مو)» — المعجم الوسيط"
