step0_evidence:
  per_lemma:
    - lemma: "سَبَب"
      confirm:
        - text: "«ما يُؤدّي إلى حدوث أمر أو نتيجة، ما يتوصّل به إلى غيره»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«كل ما يتوصل به إلى شيء»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«وعند الحكماء... هو ما يحتاج إليه الشيء إمّا في ماهيته أو في وجوده... وترادفه العلّة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«الحبل»"
          source: "لسان العرب"
          conflict: "المعنى الحسي (الحبل) هو الأصل اللغوي، لكنه يبتعد عن المفهوم المجرد للكيان المحدث للأثر."
      expands:
        - text: "«النسب بالولادة والسبب بالزواج»"
          source: "مجمع بحار الأنوار"
          addition: "استعمال في فقه القرابة (المصاهرة)."

    - lemma: "عَامِل مُسَبِّب"
      confirm:
        - text: "«العامل الذي يعزى إليه المرض أو الإصابة أو الحالة.»"
          source: "معجم المصطلحات الطبية (ArabTerm)"
      contradicts:
        - text: "«antenna feed»"
          source: "المعجم الموحد لمصطلحات المياه (ArabTerm)"
          conflict: "استعمال تقني متخصص في هندسة الهوائيات بعيد عن المفهوم العام للسببية."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عِلَّة"
      source_section: "step5_english_bridge"
      evidence_citation: "«العلة عند الحكماء: ما يتوقف عليه وجود الشيء ويكون خارجًا مؤثرًا فيه.» — كتاب التعريفات للجرجاني"
      justification: "مصطلح مركزي في الفلسفة والعلوم العربية للدلالة على الكيان المحدث للأثر (العلة الفاعلة)."
    - lemma: "مُسَبِّب"
      source_section: "step4_fts_keyword"
      evidence_citation: "«Causer; cause» — قاموس حبيب سالمون"
      justification: "اسم فاعل من «سبّب»، يدل مباشرة على الكيان الذي يقوم بفعل التسبيب."
  knowledge_candidates:
    - lemma: "مُؤَثِّر"
      justification: "اشتقاق: اسم فاعل من «أثر»، وهو ما يحدث الأثر المذكور في التعريف، مستعمل بكثرة في السياقات العلمية والفلسفية."
  generation_notes: "التركيز على اللمّات التي تعزز مفهوم 'الكيان' (Agent) تماشياً مع موقع المجموعة تحت 'كيان مادي'."

