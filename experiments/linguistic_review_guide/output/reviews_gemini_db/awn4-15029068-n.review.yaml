step0_evidence:
  per_lemma:
    - lemma: "بقية"
      confirm:
        - text: "«ما بَقِي من الشَّيْء» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«الشيء الباقى» — المعجم الكبير"
          source: "المعجم الكبير"
      expands:
        - text: "«ما ادخر عِنْده من الثَّوَاب» — المعجم الوسيط"
          source: "المعجم الوسيط"
          addition: "دلالة معنوية (الثواب المدخر) مضافة للمعنى المادي"
        - text: "«الإبقاء، تقول العرب للعدوّ إذا غلب: البَقِيَّة، أى ابْقُوا علينا» — المعجم الكبير"
          source: "المعجم الكبير"
          addition: "دلالة المصدر (الإبقاء) وطلب الرحمة"

    - lemma: "ثمالة"
      confirm:
        - text: "«الْبَقِيَّة فِي أَسْفَل الْإِنَاء من شراب وَنَحْوه» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«بَقِيَّةُ الماءِ في الغُدْرانِ والحفير، أى شَىْءٍ كانَ» — المعجم الكبير"
          source: "المعجم الكبير"
      contradicts:
        - text: "«لقَبُ عَوْفِ بنِ أَسْلَم، من الأزْدِ» — المعجم الكبير"
          source: "المعجم الكبير"
          conflict: "اسم علم لقبيلة أو شخص لا علاقة له بالمادة المتبقية"

    - lemma: "مخلفات"
      confirm:
        - text: "«كل المواد التي يتم التخلّص منها، أو يُراد التخلّص منها، أو يلزم التخلّص منها» — المعجم الموحد لمصطلحات المياه"
          source: "المعجم الموحد لمصطلحات المياه"
        - text: "«الجزء المتبقي من أفراد نوع كان سابقا منتشرا على نطاق واسع» — مسرد المناخ والبيئة (ArabTerm)"
          source: "ArabTerm"
      expands:
        - text: "«بقايا مادية أو أمتعة لشخص مقدس أو مبجل حفظت كمعطى تذكاري ملموس» — مسرد المناخ والبيئة (ArabTerm)"
          source: "ArabTerm"
          addition: "دلالة دينية وتذكارية (الذخائر/Relics)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "فُضَالة"
      source_section: "step5_english_bridge"
      evidence_citation: "«المواد الصلبة المتبقية بعد التقطير أو الترشيح أو الحرق» — المعجم الموحد لمصطلحات الهندسة المدنية"
      justification: "مصطلح تقني دقيق للمواد المتبقية بعد عمليات فيزيائية أو كيميائية (residue)."
    - lemma: "ثُفْل"
      source_section: "step4_fts_keyword"
      evidence_citation: "«ما يتبقى من المادّة بعد عصيرها» — المعجم الوسيط"
      justification: "لفظ تراثي دقيق للمادة الصلبة المتبقية بعد استخراج السائل (اللب/residue)."
  knowledge_candidates:
    - lemma: "بقايا"
      justification: "اللفظ الجمعي الأشيع في اللغة العربية المعاصرة للدلالة على المواد المتبقية من أي شيء (remains/residue)."
    - lemma: "رواسب"
      justification: "تُستخدم في السياق العلمي والعملي للدلالة على المواد المتبقية التي تستقر في قاع السوائل (sediment/residue)."

