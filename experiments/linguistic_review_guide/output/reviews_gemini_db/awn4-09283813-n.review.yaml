step0_evidence:
  per_lemma:
    - lemma: "أرض زراعية"
      confirm:
        - text: "«أراضي مستعملة في الإنتاج الفلاحي أو صالحة لهذا الاستخدام.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
        - text: "«agricultural land» — المعجم الموحد لمصطلحات علم الأحياء"
      expands:
        - text: "«تُرْبة، طبقة التراب السطحيَّة التي تتناولها آلات الحراثة (أرض صحراويَّة/ زراعيَّة)» — معجم اللغة العربية المعاصرة"
    - lemma: "أرض محروثة"
      confirm:
        - text: "«التربة التي تم حرثها بشكل جيد تكون مسامية، مما يسمح للمياه بالتسرب بسهولة، ويسمح للجذور بالنمو دون إعاقة.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
        - text: "«أرض محروثة أو صالحة للحراثة. (plowland)» — المورد الحديث"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "أرض مزروعة"
      source_section: "step7_english_bridge"
      evidence_citation: "«cultivated land — أرض مزروعة» — المعجم الموحد لمصطلحات التجارة والمحاسبة"
      justification: "مطابقة دقيقة للمصطلح الإنجليزي cultivated land."
    - lemma: "حقل"
      source_section: "step6_fts_keyword"
      evidence_citation: "«الحَقْل: قَرَاح طَيّب يُزْرَع فيه... والمَحاقِل: المَزارِع.» — لسان العرب"
      justification: "المصطلح العربي التراثي والأصيل للمساحة المزروعة."
  knowledge_candidates:
    - lemma: "أرض أريضة"
      justification: "وصف تراثي للأرض الزكية الطيبة للزراعة (Fertile/Thriving land) كما ورد في القاموس المحيط وتاج العروس."
      mechanism: "إحياء التراث"
  generation_notes: "تم التركيز على المصطلحات التي تميز بين الحالة القانونية (زراعية) والحالة الميكانيكية (محروثة) والحالة النباتية (مزروعة)."

