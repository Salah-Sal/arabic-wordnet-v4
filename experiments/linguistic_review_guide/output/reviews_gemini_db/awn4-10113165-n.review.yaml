      decision_reason: "لفظ عربي فصيح يدل على من برز وفاق أقرانه، وهو يعبر بقوة عن منزلة المتميزين."
      step05_citation: "«كَانَ شاعرًا مُبَرِّزًا» — معجم الصواب اللغوي"
      substitution_test:
        result: pass
      nuance_differentiation: "تركز على الظهور والبروز والسبق في المضمار مقارنة بالآخرين."
      example: "كان باحثاً مُبَرِّزاً في مجاله متقدماً على أقرانه جميعاً."
