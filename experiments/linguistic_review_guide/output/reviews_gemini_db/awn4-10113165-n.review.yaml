step05_lemma_generation:
  knowledge_candidates:
    - lemma: "فَذّ"
      justification: "مجاز (تخصيص دلالي): من الانفراد إلى التفرد والتميز في المكانة والكفاية، وهو ما يقابل (first-rater) بدقة في الاستعمال العربي الفصيح."
    - lemma: "مُبَرِّز"
      justification: "اشتقاق: اسم فاعل من الفعل (بَرَّزَ) بمعنى فاق أقرانه، للدلالة على الشخص الممتاز والمتقدم."
    - lemma: "مُتَفَوِّق"
      justification: "اشتقاق: اسم فاعل من (تفوق)، يدل على الشخص الذي يتجاوز أقرانه في المرتبة أو الأداء."
  generation_notes: "تم استبعاد عبارة 'شخص من الطراز الأول' لكونها تركيباً وصفياً حراً وتوليد أسماء فاعل وصفات مشبهة تدل على الشخص المتميز."

