      decision_reason: "مصطلح فصيح دقيق وشائع للدلالة على الشخص المنقطع النظير والمتفرد في مجاله، ووزنه ملائم."
      step05_citation: "«(الْفَذ) الْفَرد والمتفرد فِي مكانته أَو كِفَايَته» — المعجم الوسيط"
      substitution_test:
        result: pass
      nuance_differentiation: "تدل على التفرد والانقطاع عن النظير في التميز والإبداع."
      example: "أثبت أنه عالمٌ فَذٌّ لا يُشقّ له غبار في تخصصه الدقيق."
