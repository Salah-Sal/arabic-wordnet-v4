            synset_id: "awn4-10113165-n"

    - lemma: "مُتَفَوِّق"
      source: step05
      decision: confirmed
      decision_reason: "لفظ مستقر وشائع الاستعمال للدلالة على الشخص صاحب المرتبة العالية أو الامتياز."
      step05_citation: "«تفوق على قومه فاقهم وترفع عليهم» — المعجم الوسيط"
