step0_evidence:
  per_lemma:
    - lemma: "درجة الكحول"
      confirm:
        - text: "«درجة الكُحول: القوة المعيارية للكحول. قوة المُسْكِر بالقياس إلى هذه القوة المعيارية»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مِخْمار [مفرد]: ج مخاميرُ: جهاز يُبَيِّن درجة الكحول في الخمر.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "عيار الكحول"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates: []
  knowledge_candidates:
    - lemma: "قوة الكحول"
      justification: "تركيب إضافي يُعبر مباشرة عن المفهوم من خلال إضافة القوة إلى الكحول (تركيب وصفي)."
  generation_notes: "تعد درجة الكحول التعبير الأكثر اصطلاحية للمفهوم."

step1_lemma_validation:
  per_lemma:
    - lemma: "درجة الكحول"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع في الاستعمال الفني، ومدعوم بأدلة المعاجم كمقابل لمصطلح (proof) المعياري."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح تقني مسكوك يُركز على مقياس رقمي للقوة الكحولية."
      example: "أثبتت التحاليل أن درجة الكحول في المزيج ضمن الحدود المسموحة."
    - lemma: "عيار الكحول"
      decision: confirmed
      decision_reason: "مصطلح سليم لغويا حيث إن 'العيار' يدل على المقياس والمعيار، ويستخدم كمرادف للدرجة في السياقات العلمية والصناعية."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُشير إلى المعيار أو القياس الدقيق لنسبة الكحول، مرادفة لدرجة الكحول ولكن تميل للاستخدام في المعايرة الصناعية."
      example: "تختلف المشروبات باختلاف عيار الكحول فيها."
    - lemma: "قوة الكحول"
      source: step05
      decision: removed
      decision_reason: "عبارة وصفية حرة تفيد المعنى العام لكنها لا تُشكل مصطلحا قياسيا مسكوكا مقارنة بالدرجة والعيار."
      step05_citation: "توليد من التعريف"
      substitution_test:
        result: "fail"
      nuance_differentiation: "أوسع دلالة من المصطلح الدقيق ولا تدل حصرا على المقياس المعياري."
  synset_flags:
    definition_review_needed: false

