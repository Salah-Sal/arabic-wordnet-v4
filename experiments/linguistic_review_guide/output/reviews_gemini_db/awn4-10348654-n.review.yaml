step0_evidence:
  per_lemma:
    - lemma: "أُحَادِيّ اللُّغَة"
      confirm:
        - text: "«أُحاديّ اللغة: «أ» معبَّر عنه بلغة واحدة فقط. «ب» عارفٌ أو مستخدِمٌ لُغةً واحدةً فقط.»"
          source: "المورد الحديث (2008)"
        - text: "«أحادي اللغة: صفة الشخص الذي يستعمل لغة واحدة.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«أُحاديّ اللُّغَة: معبَّر عنه بلغة واحدة فقط، أو مَنْ يعرف أو يستخدم لغة واحدة فقط»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"

