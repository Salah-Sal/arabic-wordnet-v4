step0_evidence:
  per_lemma:
    - lemma: "إصدار"
      confirm:
        - text: "«مطبوعٌ ورقيٌّ أو إلكترونيٌّ, له رقمٌ أو ترتيبٌ» — المعجم الكبير"
        - text: "«يتعلق الأمر عادة بإصدار جديد لبرمجية يحسن أداءها ويصحح الأخطاء» — المعجم الموحد لتقانة المعلومات"
      expands:
        - text: "«إصدارٌ أو سحبٌ خاصّ لمنتَجٍ عتادي أو اسم برمجية» — معجم مصطلحات المعلوماتية"
      contradicts:
        - text: "«إصدار النقود» — المعجم الموحد لمصطلحات الاقتصاد"
          conflict: "يتعلق بالجانب المالي (العملة) وليس بنسخ متطابقة من عمل فكري أو فني."

    - lemma: "طبعة"
      confirm:
        - text: "«مجموعُ النُّسَخِ الْمَطْبوَعَة في مرَّة واحدة من كِتابٍ , أو جريدة» — المعجم الكبير"
        - text: "«طبعة [من كتاب].. مجموع النسخ المطبوعة دفعة واحدة» — المورد الحديث"
        - text: "«الكتب والأفلام والجرائد والصور التي تصدر بكيفية رقمية (طبعة رقمية)» — مسرد الإعلام والتواصل"

