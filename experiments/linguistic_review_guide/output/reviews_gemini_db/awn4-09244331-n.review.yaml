step0_evidence:
  per_lemma:
    - lemma: "خطر بيولوجي"
      confirm:
        - text: "«كل عملية أو ظاهرة من أصل عضوي أو التي تنقلها ناقلات بيولوجية بما في ذلك الإصابة بكائنات حية دقيقة مسببة للأمراض، والسموم والمواد الحيوية النشطة التي قد تسبب خسائر في الأرواح والإصابات والمرض أو آثار صحية سلبية أخرى... تُعَرَّف بأنها تمثل خطراً بيولوجياً.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
    - lemma: "عامل بيولوجي"
      confirm:
        - text: "«عامل بيولوجي أو كيميائي يوقف نمو أو تكاثر كائن حي، خاصة كائنات دقيق.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      expands:
        - text: "«أي كائن حي، جهاز، نسيج، أو خلية تخضع لتأثير ملوثات أو مؤثرات أخرى كيميائية، أو فيزيائية، أو عامل بيولوجي.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُمَرِّض"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُمْرِض: عاملٌ مسبِّبٌ للأمراض (ط).» — المورد الحديث (2008)"
      justification: "المرشح يصف العامل البيولوجي (بكتيريا أو فيروس) من حيث وظيفته كسبب للمرض، وهو المعنى الملازم لمصطلح الحرب البيولوجية."
  knowledge_candidates:
    - lemma: "عامل مُمْرِض"
      justification: "تركيب وصفي يجمع بين المفهوم العام (عامل) والصفة الوظيفية (ممرض)، وهو مستعمل بكثرة في السياقات الطبية والوقائية (آلية التوليد: تركيب وصفي)."
    - lemma: "جرثومة"
      justification: "لفظ شائع (مجاز مرسل بإطلاق الجزء على الكل) يُستخدم تاريخياً لوصف عوامل الحرب البيولوجية (Germ warfare → حرب جرثومية)."

