      justification: "آلية التوليد: مجاز. يشير إلى الشيء الذي يحرر الإنسان من ضغوط القلق."

step1_lemma_validation:
  per_lemma:
    - lemma: "مصدر أمان"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ تُستعمل للشرح أكثر من التسمية."
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تسمية عامة تصف الوظيفة دون تخصيص معجمي."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ملاذ نفسي"
      decision: removed
      decision_reason: "تركيب وصفي حر؛ كلمة 'ملاذ' وحدها كافية للتعبير عن المعنى المعجمي، وإضافة 'نفسي' هي للتوضيح السياقي فقط."
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تخصيص للملاذ بالجانب النفسي، وهو مفهوم ضمناً من سياق المجموعة."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سكن"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تراثي فصيح ومستقر في المعاجم الكبرى (الوسيط، الكبير) بنفس المعنى المقصود بدقة."
      step05_citation: "«السَّكَن: كلُّ ما سكنت إليه واستأنست به» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب العاطفي والطمأنينة النفسية (الاستئناس)."
      example: "كانت الهواية التي يمارسها بمثابة سكنٍ له يبدد مخاوفه وتوتره."
      actions:
        - command: create_entry
          params:
            lemma: "سكن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04172872-n"

    - lemma: "بطانية الأمن"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تقني معتمد في المعاجم الطبية (المعجم الطبي الموحد) كترجمة مباشرة لـ (security blanket)."
      step05_citation: "«بَطَّانِيَّةُ الأَمْن» — المعجم الطبي الموحد (2009)"
      mwe_check:
        is_mwe: true
        accepted: true
        type: "إضافي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح حديث يُستخدم غالباً في السياق النفسي والترجمة من الإنجليزية."
      example: "يلجأ بعض البالغين إلى طقوس معينة كبطانية أمن لمواجهة نوبات القلق."
      actions:
        - command: create_entry
          params:
            lemma: "بطانية الأمن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04172872-n"

    - lemma: "ملاذ"
      source: step05
      decision: confirmed
      decision_reason: "لفظ أصيل يعبر عن معنى الملجأ والحماية النفسية."
      step05_citation: "«المَلَاذُ: الملجأُ والحصن» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى الجانب الحمائي والهروب من الضغوط الخارجية."
      example: "وجد في الكتابة ملاذًا من القلق الذي يحيط به في العمل."
