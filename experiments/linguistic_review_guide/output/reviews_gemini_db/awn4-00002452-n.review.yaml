    reason: "التعريف الحالي دقيق لغوياً لكنه يتضمن تفصيلاً يمكن اختصاره بأسلوب المعاجم المصطلحية، وللإشارة إلى التناقض المحتمل بين دلالته العامة وتبعيته لـ 'كيان مادي'."
