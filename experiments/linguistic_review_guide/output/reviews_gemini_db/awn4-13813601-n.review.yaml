step0_evidence:
  per_lemma:
    - lemma: "اتِّصَال"
      confirm:
        - text: "«(1) «أ», رَبْطٌ أو ارتباط. مثل: «ب» علاقة سببيّة أو منطقيّة. «ج» سِياق؛ قَرينة»"
          source: "المورد الحديث (2008)"
        - text: "«اتصال شيء بآخر بواسطة وسيلة ما.»"
          source: "مسرد الإعلام والتواصل"
      expands:
        - text: "«اتحاد الأشياء بعضها ببعض، كاتصال طرفي الدائرة، ويضاده الانفصال.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يوسع المعنى ليشمل الاتحاد المادي المباشر بين أطراف الأشياء"
    - lemma: "تَرَابُط"
      confirm:
        - text: "«(الترابط) (فِي علم الفلسفة) قيام علاقَة بَين مدركين لاقترانهما فِي الذِّهْن بِسَبَب مَا»"
          source: "المعجم الوسيط"
        - text: "«التماسُك الاجتماعى: ترابط أجزاء المجتمع الواحد.»"
          source: "المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "ارْتِبَاط"
      source_section: "step4_fts_keyword"
      evidence_citation: "«العلاقة التي تنتج عندما يرتبط تغيير في متغير باستمرار مع تغيير في متغير آخر.» — معجم عربي عام"
      justification: "مصطلح يعبر بدقة عن وجود علاقة بين متغيرين أو حدثين بحيث يؤثر أحدهما في الآخر، وهو ما يتطابق مع تعريف المجموعة الترادفية."
  knowledge_candidates:
    - lemma: "صِلَة"
      justification: "اشتقاق من الجذر (و-ص-ل)، وتستخدم بكثرة للتعبير عن العلاقة والرابطة بين شيئين أو شخصين، سواء كانت مادية أو معنوية، وهي أعم وأبسط من الاتصال والترابط."
  generation_notes: "تمت إضافة المرادفات التي تعبر عن أنواع مختلفة من العلاقات السببية والمنطقية بين الأشياء."

step1_lemma_validation:
  per_lemma:
    - lemma: "اتِّصَال"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل وشائع للتعبير عن وجود رابطة أو التقاء بين شيئين."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يعبر عن الوصول والالتقاء، ويميل إلى الدلالة على وجود رابطة مباشرة أو تواصل، وقد يكون فيزيائياً أو معنوياً."
      example: "توجد نقطة اتصال وثيقة بين الظاهرتين تبرر دراستهما معاً."
    
    - lemma: "تَرَابُط"
      decision: confirmed
      decision_reason: "مصطلح فصيح ودقيق، يدل على تماسك الأجزاء واشتراكها في منظومة واحدة."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على التماسك والاشتراك القوي بين الأجزاء في منظومة واحدة، كالعلاقة السببية أو المنطقية، وفيه معنى التبادل والتفاعل."
      example: "أثبتت الدراسة وجود ترابط قوي بين مستوى التعليم والنمو الاقتصادي."

    - lemma: "ارْتِبَاط"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح شائع ومستقر للتعبير عن العلاقة والصلة بين الأشياء كالعلاقات الإحصائية أو السببية."
      step05_citation: "«العلاقة التي تنتج عندما يرتبط تغيير في متغير باستمرار مع تغيير في متغير آخر.» — معجم عربي عام"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يفيد وجود علاقة تبعية أو اقتران بين أمرين بحيث يتأثر أحدهما بالآخر، وهو أعم من الترابط الذي يوحي بالتماسك القوي والمتبادل."
      example: "كشفت الإحصاءات عن ارتباط وثيق بين التدخين وأمراض القلب."
      actions:
        - command: create_entry
          params:
            lemma: "ارْتِبَاط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13813601-n"

    - lemma: "صِلَة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر للتعبير عن العلاقة بين شيئين، ويستخدم في السياقات المادية والمعنوية."
      step05_citation: "معرفة لغوية (اشتقاق)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبر عن مجرد وجود علاقة أو رابطة، وهي أعم وأبسط من الاتصال والترابط."
      example: "لا توجد أي صلة بين الحادثين كما أظهرت التحقيقات الجنائية."
      actions:
