step1_lemma_validation:
  per_lemma:
    - lemma: "لِيبِرَالِيّ"
      decision: confirmed
      decision_reason: "مصطلح معرب شائع الاستعمال في الكتابات الاقتصادية والسياسية للدلالة على مؤيد الاقتصاد الحر."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح الأعم والأكثر تداولاً للدلالة على المذهب القائم على الحرية الفردية وعدم التدخل."
      example: "يُعَدُّ الخبير الاقتصادي ليبراليًّا لرفضه تدخل الدولة في تسعير السلع."

    - lemma: "رَأْسُمالِيّ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح راسخ في المعاجم الاقتصادية يتقاطع بقوة مع مفهوم الليبرالي الاقتصادي الداعي لعدم التدخل."
      step05_citation: "«الرأسماليّ: ... المؤيِّد للنظام الرأسماليّ» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الرأسمالي يركز في دلالته على الجانب المالي وتوظيف الأموال وتراكمها، بينما الليبرالي يركز على المبدأ الفلسفي لحرية السوق وعدم تدخل الدولة."
      example: "دافع الرأسمالي عن ضرورة تقليل الضرائب وتسهيل القوانين لتنشيط حركة الأسواق."
      actions:
        - command: create_entry
          params:
            lemma: "رَأْسُمالِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10276781-n"

    - lemma: "مُؤَيِّدُ الاقْتِصادِ الحُرِّ"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر وليس مصطلحاً مسكوكاً مستقراً في المعاجم، رغم صحة دلالته الوصفية."
      step05_citation: "ابتكار لغوي من المعرفة العامة."

  added_lemmas:
