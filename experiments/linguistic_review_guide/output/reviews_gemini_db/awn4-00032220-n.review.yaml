step0_evidence:
  per_lemma:
    - lemma: "عَلَاقَة"
      confirm:
        - text: "«العلاقة: شيء بسببه يستصحب الأول الثاني كالعلية والتضايف.» — التوقيف على مهمات التعاريف للمناوي"
        - text: "«العلاقة: [في الانكليزية] Relation ،relationship ،link ... وفي اصطلاح المنطقيين شيء بسببه يستصحب شيء شيئا.» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(العلاقة) ... و(في علم البيان) المناسبة بين المعنى الأصلي والمعنى المراد في المجاز والكناية.» — المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«رابط موجود بين لفظين على الأقل، قد يكونان صوتين أو صرفيتين أو صوتيتين أو كلمتين أو جملتين.» — المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«ارتباط بين المواضيع أو بين المعطيات. ويسمى علاقة أحد جداول قاعدة معطيات علائقية.» — المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
      expands:
        - text: "«علاقة بالفتح تستعمل في المعاني وبالكسر في الأمور المحسوسة.» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التفرقة بين الضبط بالفتح (للمعاني والمجردات) والكسر (للمحسوسات كالوشاح)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رَابِطَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الرابطة: العلاقة والوصلة بين الشيئين» — المعجم الوسيط"
      justification: "الرابطة تعبر بدقة عن 'الشيء الذي يجمع أو يربط بين كيانين' وهو جوهر تعريف المجموعة."
    - lemma: "ارْتِبَاط"
      source_section: "step5_english_bridge"
      evidence_citation: "«ارتباط: linkage; correlation; affiliation» — المعاجم الموحدة (لسانيات، هندسة، كهرباء)"
      justification: "مصطلح شائع يعبر عن وجود علاقة أو صلة دلالية أو مادية بين طرفين."
  knowledge_candidates:
    - lemma: "صِلَة"
      justification: "آلية: اشتقاق (من الوصل). تعبر عن الربط القائم بين الكيانات (Relation) وتُستخدم بكثرة في السياقات العلمية والاجتماعية."
  generation_notes: "التعريف يركز على الجانب التجريدي للرابط بين الكيانات. اللمات المقترحة تغطي الجوانب المنطقية (رابطة) واللغوية/العامة (صلة) والتقنية (ارتباط)."

