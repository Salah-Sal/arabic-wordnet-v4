      evidence_citation: "«التغير: هو انتقال الشيء من حالة إلى حالة أخرى.» — كتاب التعريفات للشريف الجرجاني"
      justification: "التعريف ينطبق تماماً على مفهوم الاختلاف بين الحالات قبل وبعد الحدث، وهي مطاوعة تناسب معنى (الانتقال من حالة إلى حالة) (اشتقاق)."
    - lemma: "تَحَوُّل"
      source_section: "step5_english_bridge"
      evidence_citation: "«تحول طوري، تغير الطور» — المعجم الموحد لمصطلحات المياه (2000)"
      justification: "مصطلح يدل على الانتقال من حالة (طور) إلى أخرى، ويقارب مفهوم التغير والاختلاف الجذري بين الحالات (اشتقاق)."
  knowledge_candidates:
    - lemma: "تَبَدُّل"
      justification: "مرادف لغوي شائع يفيد معنى التغير وانتقال الحالة إلى حالة أخرى، ويستخدم لوصف التغيرات في الحالات والظروف (آلية التوليد: اشتقاق من الجذر ب-د-ل)."
  generation_notes: "المفهوم مجرد يدل على الاختلاف في الحالة. الجذور الأساسية المعبرة عنه في العربية هي غ-ي-ر، ح-و-ل، ب-د-ل."

