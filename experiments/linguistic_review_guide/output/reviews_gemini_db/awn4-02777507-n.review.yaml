          source: "hawramani"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "بَهْرَج"
      source_section: "step5_english_bridge"
      evidence_citation: "«البهارج: ملابس أو حلًى رخيصة مبهرجة» — المورد الحديث (2008)"
      justification: "مصطلح عربي قديم (معرب) يُطلق على الرديء من الدراهم ثم استعير لكل رديء حقير أو زينة زائفة."
    - lemma: "سَفْسَاف"
      source_section: "step4_fts_keyword"
      evidence_citation: "«السَّفْسَافُ من كُلِّ شيءٍ: الرَّدِيءُ... الأمرُ التَّافِهُ الحقيرُ» — المعجم الكبير"
      justification: "لفظ تراثي دقيق يصف الشيء الرديء الحقير الذي لا يُعتدّ به."
  knowledge_candidates:
    - lemma: "تَافِهَة"
      justification: "استخدام صيغة الاسم (التافهة) للدلالة على المفهوم المجرد أو الشيء العيني التافه (triviality) كما في 'توافه الأمور'."
  generation_notes: "تم التركيز على الألفاظ التي تجمع بين قلة القيمة وبين كونها أعياناً (objects) تماشياً مع اللمات الإنجليزية."

step1_lemma_validation:
  per_lemma:
    - lemma: "شيء تافه"
      decision: confirmed
      decision_reason: "مصطلح شائع ومستقر في المعاجم الحديثة والقديمة لوصف هذا المفهوم."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
        type: "وصفي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير عام وشامل يغطي الجانبين المادي والمعنوي للشيء قليل القيمة."
      example: "لا تضيع وقتك في الجدال حول كل شيء تافه."
    - lemma: "زينة رخيصة"
      decision: confirmed
      decision_reason: "ترجمة دقيقة لمصطلح (frippery) وتؤكدها المعاجم الحديثة."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
        type: "وصفي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص بالجانب المادي للزينة والحلي الرخيصة التي تفتقر للأصالة والقيمة."
      example: "كانت الغرفة مليئة بالزينة الرخيصة التي لا ذوق فيها."
    - lemma: "بَهْرَج"
      source: step05
      decision: confirmed
      decision_reason: "لفظ أصيل (معرب) يغني عن الوصف الطويل (زينة رخيصة) وله جذور عميقة في الدلالة على الزيف والرداءة."
      step05_citation: "«البهرج: الباطل والرديء من الشيء» — مختار الصحاح"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على زيف المظهر وخداع العين (الرداءة المغطاة بزينة)."
      example: "ابتعد عن بهرج الحياة الزائف وركز على الجوهر."
      actions:
        - command: create_entry
          params:
            lemma: "بهرج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-02777507-n"
    - lemma: "سَفْسَاف"
      source: step05
      decision: confirmed
      decision_reason: "لفظ تراثي فصيح يعبر عن الرداءة والحقارة بدقة."
      step05_citation: "«السفساف: الرديء الحقير من كل شيء» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يوحي بالشيء الهباء أو الحقير الذي لا وزن له (مثل غبار الدقيق)."
      example: "تجنب سفساف القول وركز على ما ينفع الناس."
      actions:
        - command: create_entry
          params:
            lemma: "سفساف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-02777507-n"
    - lemma: "تَافِهَة"
      source: step05
      decision: confirmed
      decision_reason: "الاسم المؤنث من (تافه) ويستعمل كاسم للواقعة أو الشيء التافه (trifle)."
      step05_citation: "«قضية تافهة» — معجم اللغة العربية المعاصرة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تستخدم غالباً في سياق الأمور المعنوية أو القضايا (triviality)."
      example: "شغل نفسه بالتافهات من الأمور وترك جليلها."
