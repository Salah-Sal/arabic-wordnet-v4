          source: "arabterm"
        - text: "«(3) شيء تافه (4) غلطة فاضحة» — المورد الحديث (2008) (عن fluff)"
          source: "arabterm"
        - text: "«التافه: الحقير اليسير، وقيل الخسيس القليل» — لسان العرب"
