step0_evidence:
  per_lemma:
    - lemma: "جسم لامع"
      confirm:
        - text: "«سطح جسم لامع براق (مجوهرات مثلا)» — مسرد الفن، التسلية والرياضة (ArabTerm)"
          source: "ArabTerm"
      expands:
        - text: "«(2) شيء برّاق [كنجم أو ماسةٍ أو قطعة نقدية]» — المورد الحديث"
          source: "Al-Mawrid Al-Hadeeth"
          addition: "يؤكد دلالة 'الشيء البراق' كمرادف للجسم اللامع في سياق 'shiner'."
    - lemma: "لامع"
      confirm:
        - text: "«(الالامع) البراق المضيء» — المعجم الوسيط"
          source: "Al-Waseet"
      peripheral_observations:
        - "يُستعمل كصفة غالبًا، ولكن وروده كاسم معرف (اللامع) في المعاجم يشير إلى إمكانية استعماله كاسم دلالة على الشيء المضيء."
    - lemma: "براق"
      confirm:
        - text: "«(2) شيء برّاق [كنجم أو ماسةٍ أو قطعة نقدية]» — المورد الحديث"
          source: "Al-Mawrid Al-Hadeeth"
        - text: "«ذو البريق» — موسوعة السلطان قابوس لأسماء العرب"
          source: "Sultan Qaboos Encyclopedia"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "شيء براق"
      source_section: "step5_english_bridge"
      evidence_citation: "«(2) شيء برّاق [كنجم أو ماسةٍ أو قطعة نقدية]» — المورد الحديث"
      justification: "ترجمة مباشرة للمصطلح الإنجليزي 'shiner' في المعاجم الحديثة."
  knowledge_candidates:
    - lemma: "نيّر"
      justification: "مصطلح تراثي وعلمي يُطلق على الجسم المضيء أو المشرق (خاصة الأجرام السماوية)، ويُجمع على 'النيران' (الشمس والقمر)."
    - lemma: "جسم مضيء"
      justification: "اشتقاق علمي (تركيب وصفي) للجسم الذي ينبعث منه الضوء، وهو أحد شقي التعريف."
    - lemma: "جسم منير"
      justification: "اشتقاق علمي (تركيب وصفي) للجسم الذي يعكس الضوء، وهو الشق الثاني للتعريف."

