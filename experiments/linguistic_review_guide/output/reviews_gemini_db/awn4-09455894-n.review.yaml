      example: "رصد العلماء جسماً لامعاً يتحرك في الفضاء الخارجي."

    - lemma: "لامع"
      decision: confirmed
      decision_reason: "اسم فاعل يُستعمل كاسم دلالة على الشيء الذي يلمع، مدعوم بتعريف المعجم الوسيط كاسم (اللامع)."
