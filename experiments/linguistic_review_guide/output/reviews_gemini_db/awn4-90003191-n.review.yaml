step0_evidence:
  per_lemma:
    - lemma: "ملاذ"
      confirm:
        - text: "«الملجأ والحصن»"
          source: "المعجم الوسيط"
        - text: "«بناية صغيرة وبسيطة... تستخدم كملجأ للوقاية»"
          source: "ArabTerm"
      contradicts:
        - text: "«المُطَرْمِذُ المُتَصَنِّعُ الذي لا تَصِحُّ مَوَدَّتُهُ»"
          source: "القاموس المحيط"
          conflict: "معنى قديم يشير إلى الشخص الكاذب في مَودته، وهو بعيد عن دلالة الملجأ أو الخيار المفضل"

    - lemma: "خيار أول"
      evidence_status: "no_material_found"

    - lemma: "خيار مُفَضَّل"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "أثير"
      source_section: "step5_english_bridge"
      evidence_citation: "«الأثير؛ المفضَّل؛ المَحْظيّ» — المورد الحديث"
      justification: "لفظ تراثي فصيح يدل على التفضيل والمكانة الخاصة، وهو مرادف قوي لـ 'Favorite'"
    - lemma: "أفضلية"
      source_section: "step5_english_bridge"
      evidence_citation: "«حق الأولويّة؛ حق يخول بعض الدائنين... استيفاء ديونهم بالأولوية» — المعجم الموحد للمصطلحات القانونية"
      justification: "يدل على التفضيل والأولوية في الاختيار"
  knowledge_candidates:
    - lemma: "مُؤثَر"
      justification: "اسم مفعول من آثر (فصّل)، يدل على الشيء الذي يُؤثره المرء على غيره"
    - lemma: "ملاذ أول"
      justification: "تعبير مركب (MWE) يخصّص دلالة 'ملاذ' لتكون الخيار الأول (First resort)، وهو أدق من اللفظ المفرد"

step1_lemma_validation:
  per_lemma:
    - lemma: "خيار أول"
      decision: "confirmed"
      decision_reason: "تعبير مركب اصطلاحي مستقر في الاستعمال المعاصر كترجمة دقيقة لـ 'First choice'"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الرتبة والترتيب الزمني أو الرتبي في عملية الاختيار"
      example: "يُعد التخصص الطبي هو الخيار الأول للطلاب المتفوقين في القسم العلمي"

    - lemma: "خيار مُفَضَّل"
      decision: "confirmed"
      decision_reason: "تعبير مركب فصيح يدل على الاختيار المصحوب بالرغبة والتقديم على غيره"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على البعد النفسي (التفضيل والمحبة) أكثر من الترتيب الإجرائي"
      example: "أصبح العمل عن بُعد هو الخيار المفضل للكثير من الموظفين في العصر الرقمي"

    - lemma: "ملاذ"
      decision: "confirmed"
      decision_reason: "دلالة الملجأ والحصن تتضمن معنى الاستناد إلى الشيء كخيار أول في حالات معينة (المنتجع أو الملاذ)"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب الحمائي أو الاستنجادي (المنتجع الذي يذهب إليه المرء) أكثر من كونه مجرد بديل مفاضلة"
      example: "تظل القراءة هي الملاذ الأخير —والأول أحياناً— للمثقفين في أوقات الشدة"

    - lemma: "أثير"
      source: "step05"
      decision: "confirmed"
      decision_reason: "لفظ تراثي فصيح مستقر لدلالة التفضيل والمكانة الخاصة"
      step05_citation: "«الأثير؛ المفضَّل؛ المَحْظيّ» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "لفظ بليغ يدل على شدة القرب والحظوة؛ يُقال: هو أثيري، أي المُفضل عندي"
      example: "هذا الكتاب هو الأثير عندي، لا أملّ من إعادة قراءته"
      actions:
        - command: "create_entry"
          params:
            lemma: "أثير"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-90003191-n"

    - lemma: "ملاذ أول"
      source: "step05"
      decision: "confirmed"
      decision_reason: "تعبير مركب أدق في التعبير عن دلالة 'First resort' من اللفظ المفرد"
      step05_citation: "مركب من 'ملاذ' و'أول' لتحقيق دلالة synset_id"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يجمع بين دلالة الملجأ (Resort) ودلالة الأسبقية (First)، مما يطابق التعريف تماماً"
      example: "تعتبر السندات الحكومية الملاذ الأول للمستثمرين في فترات التقلب الاقتصادي"
      actions:
        - command: "create_entry"
          params:
            lemma: "ملاذ أول"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-90003191-n"

