      justification: "اشتقاق (مصدر) — يفيد معنى إحداث النظام في مجموعة من الأشياء، ويطلق على نتيجة هذا الفعل بحيث تعتبر الأشياء كوحدة متسقة."
  generation_notes: "المجموعة تركز على النتيجة المترتبة على فعل الترتيب والتجميع."

