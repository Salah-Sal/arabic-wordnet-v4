step0_evidence:
  per_lemma:
    - lemma: "ترتيب"
      confirm:
        - text: "«جعل الأشياء الكثيرة بحيث يطلق عليها اسم الواحد ويكون لبعض أجزائه نسبة إلى بعضها بالتقدم والتأخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«جعل الْأَشْيَاء المتعددة بِحَيْثُ يُطلق عَلَيْهَا اسْم الْوَاحِد، وَيكون لبعضها نِسْبَة إِلَى بعض بالتقدم والتأخر»"
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "«شيء منظَّم بطريقةٍ ما: منظومة؛ نَسَقٌ a floral arrangement»"
          source: "المورد الحديث (2008)"
    - lemma: "تنسيق"
      confirm:
        - text: "«من النسق بسكون السين المهملة الترتيب وإجراء الكلام على سياق واحد ونظام واحد»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«تنسيق معماري: architectural arrangement or order»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 2: بناء - تجارة (1999)"

