step0_evidence:
  per_lemma:
    - lemma: "خشخيشة"
      confirm:
        - text: "«خُشْخَيْشَة» الأطفال."
          source: "المورد الحديث"
        - text: "الخَشْخَشَةُ: صَوْتُ السِّلَاحِ وَنَحْوِهِ"
          source: "مختار الصحاح"
      expands:
        - text: "الخَشْخَشَةُ: حَرَكَةٌ لهَا صَوْتٌ كصَوْتِ السِّلاحِ."
          source: "تاج العروس"
        - text: "الخَشْخَشَةُ: صَوْتُ الثَّوْبِ الجَدِيدِ إِذا حُرِّكَ."
          source: "لسان العرب"

    - lemma: "شيء ذو رنين"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جُلْجُل"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الجُلْجُل: الجَرَس الصَّغير» — المعجم الوسيط"
      justification: "الجرس الصغير يصدر صوتاً معدنياً رناناً عند تحريكه، وهو مطابق تماماً لتعريف المجموعة."
  knowledge_candidates:
    - lemma: "رَنَّان"
      justification: "صيغة مبالغة على وزن فعّال تدل على الشيء الذي يكثر منه الرنين، وتُستخدم لوصف الأجسام المصوتة."
  generation_notes: "التركيز على الأدوات التي تصدر رنيناً معدنياً كما ورد في التعريف."

step1_lemma_validation:
  per_lemma:
    - lemma: "خشخيشة"
      decision: confirmed
      decision_reason: "مصطلح مستقر وشائع الاستعمال للأداة التي تصدر صوتاً معدنياً أو قعقعة عند تحريكها."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل في الاستعمال الحديث على لعبة الأطفال (rattle)، وفي اللغة تشير إلى أي جسم يصدر صوتاً عند تحريكه."
      example: "هزّ الطفلُ خشخيشته ليسمع صوتها."

    - lemma: "شيء ذو رنين"
      decision: removed
      decision_reason: "تعبير وصفي حر (phrase) وليس وحدة معجمية أو مصطلحاً مسكوكاً."
      evidence_assessment:
        case: "no_material"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جُلْجُل"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تراثي فصيح يطلق على الجرس الصغير الذي يصدر رنيناً، وهو مطابق للدلالة المطلوبة."
      step05_citation: "«الجُلْجُل: الجَرَس الصَّغير» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بالجرس المعدني الصغير، وهو أقدم وأفصح في سياق الأدوات المعدنية المرنة."
      example: "علق الراعي جُلْجُلاً في عنق الشاة."
      actions:
        - command: create_entry
          params:
            lemma: "جُلْجُل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-92464675-n"

  added_lemmas:
    - lemma: "جُلْجُل"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

step3_definition:
  current_definition: "شيء يصدر صوتاً معدنياً (رنيناً)."
  assessment:
    decision: revise
    reason: "التعريف الحالي وصفي بسيط؛ يحتاج إلى صياغة معجمية أكثر دقة تحدد كونه أداة أو جسماً صلبًا."
  authored_definitions:
    - type: terminological
      text: "أداة أو جِسم يُحدِث صوتاً معدنيّاً أو رنيناً متكرراً عند تحريكه أو ضربه."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-92464675-n"
        definition_index: 0
        text: "أداة أو جِسم يُحدِث صوتاً معدنيّاً أو رنيناً متكرراً عند تحريكه أو ضربه."

step4_relations:
  hypernymy:
    current_hypernym: "جِسْم، شَيْء مَادِّيّ، غَرَض"
    test_result: "correct"

step5_enrichment:
  per_lemma:
    - lemma: "خشخيشة"
      enrichment:
        root: "خ-ش-خ-ش"
      examples:
        - text: "هزّ الطفلُ الخشخيشةَ ليسمع قعقعتها."
          type: usage
          source: "مؤلَّف"
      pos_check:
        pos: noun
    - lemma: "جُلْجُل"
      enrichment:
        root: "ج-ل-ج-ل"
      examples:
        - text: "لاَ تَصْحَبُ الْمَلاَئِكَةُ رُفْقَةً فِيهَا جُلْجُلٌ."
          type: hadith
          source: "النهاية في غريب الحديث"
      pos_check:
        pos: noun
  cultural_fit:
    assessment: native
  actions:
    - command: add_synset_example
      params:
        synset_id: "awn4-92464675-n"
        text: "لاَ تَصْحَبُ الْمَلاَئِكَةُ رُفْقَةً فِيهَا جُلْجُلٌ."
