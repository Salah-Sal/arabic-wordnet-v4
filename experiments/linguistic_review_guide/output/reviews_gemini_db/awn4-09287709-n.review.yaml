step0_evidence:
  per_lemma:
    - lemma: "دلتا"
      confirm:
        - text: "«مساحة من الأرض تكوَّنت من رواسب فيضية مروحية الشكل, يلقيها النهر عند مصبه, ويتشعب فيها النهر إلى فرعين أو أكثر (مج)»"
          source: "المعجم الوسيط"
        - text: "«مِساحةٌ من الأَرْضِ, مِرْوَحِيَّة الشَّكل, تكوَّنت من رُساباتٍ فَيْضِيَّة يُلْقِيها النَّهرُ عند مَصَبِّه, ويَتَشعَّبُ فيها إلى فَرعَيْن أو أَكْثر, ويُقال لها \"دال\" أيضًا»"
          source: "المعجم الكبير"
        - text: "«1 - (جغ) مساحَةٌ من الأرض مِرْوحيَّة الشَّكْل تكوّنت من رواسب طينيّة يلقيها النَّهر عند مصبِّه، ويتشعّب فيها إلى فرعين أو أكثر \"دِلتا النيل/ المسيسبّي\". 2 - أرض واقعة بين فرعين أو أكثر من نهر عند مصبِّه.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«مسطّح أرضي مثلث الشكل يتكوّن عند مصب النهر أو بقربه، حيث يلقي النهر ما يحمله من مواد عالقة، فتتراكم الترسبات عبر الزمن، وتتّسع لتضمّ مساحات كبيرة من الأراضي تعبرها فروع كثيرة من المجرى الرئيسي.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"

