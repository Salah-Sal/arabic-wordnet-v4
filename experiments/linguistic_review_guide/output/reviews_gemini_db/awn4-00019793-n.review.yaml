step0_evidence:
  per_lemma:
    - lemma: "جَوْهَر"
      confirm:
        - text: "«جوهر الشيء حقيقته وذاته»"
          source: "المعجم الوسيط"
        - text: "«substance (فى المنطق): ما قام بنَفْسِه , فهو مُتَقَوِّمٌ بذاتِه ومُتَعَيِّنٌ بماهيَّتِه , وهو المَقُولَةُ الأولى من مَقُولات أرسطو , وبه تقومُ الأعراضُ والكَيْفِيَّات»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«من الأحجار: كل ما يستخرج منه شيء ينتفع به والنفيس الذي تتخذ منه الفصوص»"
          source: "المعجم الوسيط"
          conflict: "هذا المعنى يشير إلى الحجر الكريم (الجوهرة) وهو معنى مادي مختلف عن مفهوم المادة المكونة للشيء."
      expands:
        - text: "«أصل الشيء ومادّتُه»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "يربط صراحة بين الجوهر والمادة، مما يدعم التعريف الفيزيائي للمجموعة."

    - lemma: "مَادَّة أَسَاسِيَّة"
      contradicts:
        - text: "«المادة البينية للنسيج خاصة في النسيج الرابط الضام كالغضروف والعظم»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
          conflict: "المصطلح تقني تخصصي في علم الأحياء (ground substance) ولا يعبر عن المفهوم العام للمادة المكونة للشيء."
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "ذَات"
      source_section: "step5_english_bridge"
      evidence_citation: "«الذات: حقيقة الشيء وهويته» — دوزي"
      justification: "ترد كثيراً كمرادف للجوهر في سياق حقيقة الشيء وما يتكون منه."
    - lemma: "كُنْه"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) جَوْهر؛ كُنْهُ؛ زُبْدة... (4) مادة» — المورد الحديث"
      justification: "تشير إلى جوهر الشيء ومادته الأصلية."
  knowledge_candidates:
    - lemma: "قِوام"
      justification: "اشتقاق: من القيام، يقال 'قوام الشيء' لما يعتمد عليه في وجوده المادي وتكوينه."

step1_lemma_validation:
  per_lemma:
    - lemma: "جَوْهَر"
      decision: confirmed
      decision_reason: "مصطلح أصيل ومدعوم معجمياً وفلسفياً للتعبير عن المادة التي يقوم بها الشيء."
      evidence_assessment:
        case: "mixed"
      nuance_differentiation: "يتميز الجوهر بأنه يعبر عن المادة الدائمة الثابتة في الشيء التي تقوم بها الصفات (الأعراض)، وهو المصطلح الأدق فلسفياً وعلمياً."
      example: "يُعد الحديد الجوهر المادي الذي تتشكل منه أجزاء المحرك."

    - lemma: "مَادَّة أَسَاسِيَّة"
      decision: removed
      decision_reason: "تعبير وصفي حر يفتقر للتثبيت المعجمي كمرادف عام، كما أنه يمثل مصطلحاً بيولوجياً تخصصياً مختلفاً (ground substance)."
      evidence_assessment:
        case: "no_material"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ذَات"
      source: step05
      decision: removed
      decision_reason: "رغم ترادفها مع الجوهر، إلا أنها تميل للجانب التجريدي (Identity/Essence) أكثر من الجانب المادي الفيزيائي المقصود في هذا السينست."
      step05_citation: "«الذات: حقيقة الشيء وهويته» — دوزي"

    - lemma: "كُنْه"
      source: step05
      decision: removed
      decision_reason: "تُستعمل غالباً للتعبير عن الحقيقة الخفية أو الجانب المعنوي للشيء، وليست شائعة في السياق الفيزيائي للمادة."
      step05_citation: "«كُنْه الشَّيء: حقيقتُه وجَوْهرُه» — المعجم الوسيط"

step3_definition:
  definition_review_flag: false
  current_definition: "المادّة الفيزيائيّة الحقيقيّة التي يتكوّن منها شخص أو شيء"
  assessment:
    decision: retain
    reason: "التعريف دقيق علمياً ولغوياً ويغطي المفهوم الفيزيائي والفلسفي للـ (Substance) بشكل جيد."

step4_relations:
  hypernymy:
    current_hypernym: "مادة (awn4-00021007-n)"
    test_result: "correct"

step5_enrichment:
  per_lemma:
