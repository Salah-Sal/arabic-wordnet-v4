step0_evidence:
  per_lemma:
    - lemma: "واقف"
      confirm:
        - text: "«وَقَفَ: قام من جلوس» — المعجم الوسيط"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الْوَاقِف (عِنْد الْفُقَهَاء) الحابس لعَينه إِمَّا على ملكه وَإِمَّا على ملك الله تَعَالَى وخادم الْبيعَة لِأَنَّهُ وقف نَفسه على خدمتها» — المعجم الوسيط"
          source: "المعجم الوسيط"
          conflict: "المعنى الاصطلاحي الفقهي (الواقف للوقف) يختلف عن المعنى الفيزيائي العام (الكائن الذي يقف)"
      expands:
        - text: "«الواقف: موضع في أعالي المدينة» — معجم البلدان"
          source: "معجم البلدان"
          addition: "اسم موضع جغرافي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "قائم"
      source_section: "step4_fts_keyword"
      evidence_citation: "«جَذَا: ثبت قائماً» — المعجم الوسيط"
      justification: "آلية: اشتقاق. ورد استخدامه في المعاجم لوصف حالة الوقوف البدنية (وهو قائم)، وهو اسم فاعل من الفعل 'قام' (ضد جلس)."
  knowledge_candidates:
    - lemma: "منتصب"
      justification: "آلية: اشتقاق. يدل على الوقوف باستقامة (منتصب القامة)، ويستخدم لوصف الكائنات في حالة الانتصاب."

step1_lemma_validation:
  per_lemma:
    - lemma: "واقف"
      decision: "confirmed"
      decision_reason: "الاسم هو الفاعل القياسي من الفعل 'وقف' (بمعنى قام) وهو مستقر في الاستعمال لوصف الكائن الذي يقف."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على حالة الثبات والوقوف بعد حركة أو جلوس، وهو الأكثر شيوعاً في الاستعمال المعاصر."
      example: "ظلَّ الواقفُ في الحافلةِ متمسكاً بالمقبضِ حتى وصولِه."
    - lemma: "قائم"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مصطلح أصيل ومرادف دقيق لـ 'واقف'، وهو اسم الفاعل من 'قام' (ضد قعد وجلس)."
      step05_citation: "«جَذَا: ثبت قائماً» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز بدلالة النهوض والانتصاب، ويستخدم كثيراً في السياقات الفصحى والتركيبات (مثل: زاوية قائمة، شكل قائم)."
      example: "رأيتُ الحارسَ قائماً أمامَ البوابةِ طوالَ الليل."
      actions:
        - command: "create_entry"
          params:
            lemma: "قائم"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10667472-n"
    - lemma: "منتصب"
      source: "step05"
      decision: "removed"
      decision_reason: "يغلب عليه الوصف (نعت) أكثر من الاسمية (اسم فاعل لموصوف مجهول)، ولا يشيع استخدامه كاسم مستقل للدلالة على 'الكائن الذي يقف' بمفرده."
      step05_citation: "اسم فاعل من انتصب"
  synset_flags:
    definition_review_needed: true

