    source_section: step4_fts_keyword
    evidence_citation: «معلومات سرية has the inside on what happened» — المورد الحديث (2008)
    reasoning: التعريف يشير إلى استخدام معلومات لم يتم الإعلان عنها، وهو ما يطابق مفهوم المعلومات السرية في هذا السياق.
