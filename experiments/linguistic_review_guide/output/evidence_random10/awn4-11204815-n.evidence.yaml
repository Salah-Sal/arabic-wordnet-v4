        text: 'رُومَانُ الرُّومِيُّ - وسمَّاهُ الرَّسولُ - صلَّى الله عليه وسلَّم - سَفِينَةَ -: صحابِيٌّ, مَوْلَى رسول الله'
        is_raw: 0
      - sense_index: 2
        text: 'رومان رولان (1944م): كاتبٌ مسرحيٌّ, وروائيٌّ فرنسيٌّ, نـال جائزة نوبـل للأدب عام 1915م'
