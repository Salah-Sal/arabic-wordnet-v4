      definitions_text: 'عَلَمٌ على غَيْرِ واحِدٍ, منهُمْ: رومانُ بنُ جُنْدُبِ بنِ خارجةَ, من جديلة طيئ: جَدٌّ جاهِليٌّ رُومَانُ
