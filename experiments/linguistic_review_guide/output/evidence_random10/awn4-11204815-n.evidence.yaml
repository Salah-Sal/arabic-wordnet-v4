        كاتبٌ مسرحيٌّ, وروائيٌّ فرنسيٌّ, نـال جائزة نوبـل للأدب عام 1915م ميخائيل رومان (١٣٩٩هــ =١٩٧٩م): كاتب مسرحيٌّ مصرى'
