              (قَصَبَ)[هـ] فِي صِفَتِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «سَبْطُ القَصَب» القَصَب مِنَ العِظام: كلُّ عَظْمٍ أجْوَفَ فِيهِ مُخٌّ، واحدَته: قَصَبة. وكلُّ عَظْم عَريض: لَوْح.[هـ] وَفِي حَدِيثِ خَدِيجَةَ «بَشِّرْ خَدِيجَةَ ببَيْتٍ مِنْ قَصَبٍ فِي الْجَنَّةِ» القَصَب فِي هَذَا الْحَدِيثِ: لُؤْلُؤٌ مُجَوَّف وَاسِعٌ كالقَصْر المُنِيف. والقَصَب مِنَ الجَوْهر: مَا اسْتَطال مِنْهُ فِي تَجْويف.(هـ) وَفِي حَدِيثِ سَعِيدِ بْنِ الْعَاصِ «أَنَّهُ سَبقَ بَيْنَ الخَيْل فجَعَلَهَا مِائَةَ قَصَبة» أَرَادَ أَنَّهُ ذَرَع الغايةَ بالقَصَب فجَعَلها مِائَةً قَصَبة. وَيُقَالُ إِنَّ تِلْكَ القَصَبة تُرْكَز عِنْدَ أقْصَى الْغَايَةِ، فَمن سَبَق إِلَيْهَا أخذَها واسْتَحَقَّ الخَطَر، فَلِذَلِكَ يُقَالُ: حازَ قَصَب السَّبْق، واسْتَوْلَى عَلَى الأمَدِ.
              (س) وَفِيهِ «رَأَيْتُ عَمْرو بنَ لُحَيًّ يَجُرّ قُصْبَه فِي النَّارِ» القُصْب بِالضَّمِّ: المِعَي، وجَمْعه:
              أَقْصَاب. وَقِيلَ: القُصْب: اسْمٌ لِلأْمْعاء كُلَّها. وَقِيلَ: هُوَ مَا كَانَ أسْفَل البَطْن مِنَ الأمْعاء.
              وَمِنْهُ الْحَدِيثُ «الَّذِي يَتَخَطَّى رِقابَ النَّاسِ يَوْمَ الجُمعة كالجارِّ قُصْبَه فِي النَّار» .
              (س) وَفِي حَدِيثِ عَبْدِ الْمَلِكِ «قَالَ لعُرْوة بْنِ الزُّبَيْرِ: هَلْ سَمِعْتَ أَخَاكَ يَقْصِبُ نِساءنا؟
              قَالَ: لَا» يُقال: قَصَبَه يَقْصِبُه إِذَا عَابَه. وَأَصْلُهُ القَطْع. وَمِنْهُ القصَّاب. ورَجُلٌ قَصَّابة: يَقَعُ فِي النَّاسِ.
