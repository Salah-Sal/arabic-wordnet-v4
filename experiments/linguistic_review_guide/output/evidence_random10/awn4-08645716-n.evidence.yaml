          - entry_id: 860376
            dictionary_id: 130
            headword: قصب
            headword_bare: قصب
            headword_norm: قصب
            root: قصب
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              قصبقصَبَ يَقصِب، قَصْبًا، فهو قاصِب، والمفعول مَقْصوب• قصَب الجزّارُ الشَّاةَ: فصل عظامَها وقطّعها عُضْوًا عُضْوًا. 
              قصَّبَ يقصِّب، تقْصيبًا، فهو مُقصِّب، والمفعول مُقصَّب• قصَّب الثَّوبَ: نسجه بخيوط الذَّهبِ والفِضّة "قصَّبَتِ الخيّاطة فُستانَ العَرُوس- مشت تزهو في ثوبها المقصَّب" ° حرير مقصَّب: مزيَّن بخيوط الذهب أو الفضّة.• قصَّب الجزّارُ الشَّاةَ: قصبها؛ فصل عظامَها، وقطّعها عُضْوًا عُضْوًا.• قصَّب شعرَه: لَوَاه وجعَّده.• قصَّب الحجرَ: نحته وسوَّاه "قصَّب أرضَه قبل بذرها: سَوّاها". 
              قِصابة [مفرد]: حرفة القصّاب، ذبح الماشية وبيع لحومها بالمفرَّق، جِزارة "رفض أن يعمل مع أبيه في القِصابة". 
              قَصْب [مفرد]: مصدر قصَبَ. 
              قَصَب [جمع]: مف قصَبَة:1 - كلُّ نبات له أنابيب وكعوب "قصب السُّكّر" ° أحرز قَصَبَ السَّبْق: سبَق غيره إلى الفوز في أمرٍ، تفوّق على غيره.2 - خطوط ذهبيّة أو فضيّة توشى بها ثياب المرأة "وشت فستانها بالقصب".3 - (نت) نبات مائيّ من الفصيلة النجيليّة، ينمو حول الأنهار وقد يزرع، وساقه جوفاء تُستعمل في صناعة الحواجز والسِّلال ويسمى في مصر: الغاب البلديّ، وقصب النيل.4 - قلم من بوص "يكتب الخطَّاط بقلم القَصَب".• قصب السُّكَّر: (نت) جنس نبات مُعَمَّر من فصيلة النجيليّات، مهده البلاد الآسيويّة الحارّة، أزهاره صغيرة الحجم، سوقه مُنتصبة مصقولة يُستخرج منها السُّكّر، وتُعطى أوراقه علفًا للماشية. 
              قَصَبَة [مفرد]: ج قَصَبات وقَصَب:1 - كلُّ أنْبُوبة في ساق الشَجَرة تنتهي بعُقْدَتين.2 - قطعة من القَصَب مُثَقَّبة يَنفخ فيها الزَّامرُ، وهي النَّاي "قَصَبَة الرَّاعي".3 - (رع) مقياس تُقاس به الأرض في مصر يبلغ طوله ثلاثة أمتار و 55 سم "قَصَبَة مربَّعة: مساحة مربَّعة طولها قَصَبَة وعرضها قَصَبَة".4 - (شر) كُلُّ عَظْم مستدير أجْوَف ذي مُخٍّ "قَصَبَة الإصبع: أنملتها/ عظامها- قَصَبَة الأنف: عظمه".• القَصَبة الهوائيَّة: (شر) القصبة الرِّئويّة، أنبوبة مدعَّمة بحلقات غضروفيّة لتظلّ مفتوحة دائمًا، تمتدّ من الحنجرة إلى الشُّعبتين الرِّئويَّتين، يسلكها هواء الشّهيق إلى الرِّئتين، ويخرج منها هواء الزَّفير إلى الخارج. 
              قَصَّاب [مفرد]:1 - جزّار "ذبح القصَّابُ الشَّاةَ".2 - بائع اللَّحم.3 - زمّار؛ مَنْ يزمِّر بالقَصَبة "عزف القصّابُ بالنّاي فأطرَبَنا". 
              قَصّابَة [مفرد]: أداة تجرّها الدّوابُّ أو قوّة آليّة، تستعمل لقطع الأرض وتسويتها. 
              مَقْصَبَة [مفرد]: ج مَقْصَبات ومَقاصِبُ: منْبَت القَصَب ومَوْضِعه.• أرض مَقْصَبَة: كثيرة القَصَب.
