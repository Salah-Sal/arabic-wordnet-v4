            definitions_text: 'القَصَبُ، محرَّكةً: كُلُّ نباتٍ ذي أنابيبَ، الواحدةُ: قَصَبَةٌ، وقَصْباةٌ.والقَصْباءُ: جَماعَتُها،
              ومَنْبِتُها. وقد أقْصَبَ المَكانُ، وأرْضٌ قَصِبَةٌ ومَقْصَبَةٌ.وقَصَبَه يَقْصِبُه: قَطَعَه،كاقْتَصَبَه،وـ الشَّاةَ:
              فَصَّلَ قَصَبَها،وـ البعيرُ قَصْباً وقُصوباً: امْتَنَعَ من شُرْبِ الماءِ، فَرَفَعَ رَأْسه عنه، بَعِيرٌ وناقةٌ
              قَصيبٌ وقاصِبٌ،وـ فلاناً: مَنَعَه من الشُّرْبِ قبلَ أن يَرْوَى، وعابَه، وشَتَمَه،كقَصَّبَهُ.والقَصَبُ، محرَّكةً
              أيضاً: عِظامُ الأَصابعِ، وشُعَبُ الحَلْقِ، ومَخارِجُ الأنْفاسِ، وما كان مُسْتَطيلاً من الجَوْهَرِ، وثِيابٌ ناعِمَةٌ
              من كَتَّانٍ، الواحدُ: قَصَبِيُّ، والدُّرُّ الرَّطْبُ المُرَصَّعُ بالياقوتِ، ومنه: "بَشِّرْ خَديجَةَ ببيتٍ في
              الجَنَّةِ منقَصَبٍ"، ومَجاري الماءِ من العُيونِ.والقُصْبُ، بالضم: الظَّهْرُ، والمِعَى، ج: أقْصابٌ.والقَصَّابُ:
              الزَّمَّارُ، والنافِخُ في القَصَبِ، والجَزَّارُ،كالقاصِبِ فيهما.والقَصْبَةُ: البِئْرُ الحَدِيثَةُ الحَفْرِ،
              والقَصْرُ، أو جَوْفُه، والمدينةُ، أو مُعظَمُ المُدُنِ، والقَرْيَةُ،وة بالعِراقِ، والخُصْلَةُ المُلْتَوِيةُ من
              الشَّعَرِ،كالقُصَّابَةِ، كرُمَّانَةٍ،والقَصِيبَةِ، والتَّقْصِيبةِ، والتَّقْصِبَةُ، وقد قَصَّبَه تَقْصيباً، وكُلُّ
              عَظْمٍ ذي مُخٍّ.والقَصَّابَةُ، مُشَدَّدةً: الأُنْبوبَةُ،كالقَصِيبَةِ، والمِزْمارُ، والوَقَّاعُ في الناسِ. وككِتابٍ:
              مُسَنَّاةٌ تُبْنَى في اللِّحْفِ لِئَلاَّ يَسْتَجْمِعَ السَّيْلُ فَيَنْهَدِمَ عِراقُ الحائطِ بسببهِ، والدِّيارُ،
              الواحدةُ: قَصَبَةٌ.وذُو قِصابٍ: فَرَسٌ لمالِكِ بنِ نُوَيْرَةَ.والقاصِبُ: الرَّعْدُ المُصَوِّتُ.والقَصَباتُ:
              د بالمَغْرِبِ،وة باليَمامَةِ.والقُصَيْبَةُ، كجُهَيْنَةَ: ع بأرضِ اليَمامَةِ (لِتَيْمٍ وعَدِيٍّ وثَوْرٍ بَنِي
              عبد مَناةَ) ،وع بينَ يَنْبُعَ وخَيْبَرَ،وع بالبَحْرَيْنِ.وأقْصَبَ الرَّاعِي: عافَتْ إبِلُه الماءَ.والتَّقْصِيبُ:
              تجعيدُ الشَّعَر، وشدُّ اليدينِ إلى العُنُق.والمُقَصِّبُ،(بكسر الصادِ المُشَدَّدةِ) : الذي يُحْرِزُ قَصَبَ السِّباقِ،
              واللَّبَنُ كَثُفَتْ عليه الرَّغْوَةُ.و"رعى فأقْصَبَ": يُضْرَبُ للرَّاعي، لأنَّهُ إذا أساءَ رَعْيَها لم تَشْرَبْ.والقَصوبُ
              من الغَنَم: التي تَجُزُّها.وتُدْعى النَّعْجَةُ فيقالُ: قَصَبْ قَصَبْ.'
