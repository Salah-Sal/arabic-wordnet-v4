          قيروان: قيروان: معجم القافلة، أو معظم الكتيبة من الجيش. (معجم البلاذري).
          قيروان: معسكر (معجم البلاذري) أو بالأحرى البلد الرئيس للحامية من الجند.
          ففي أخبار (4: 7): افتتح طنجة واختطها قيروانا للمسلمين وأوطنها إياهم.
          وفي المقري (1: 155) في كلامه عن قرطبة: وهي اليوم قصبة الأندلس وقيروانها وموضع ملكها.
          قيروان: قصبة محافظة (معجم البلاذري).
          قيرون قيرون: وع من خبث المعادن= منطقي (المستعيني في مادة خبث الفضة).
