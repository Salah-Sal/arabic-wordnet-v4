            definitions:
            - sense_index: 0
              text: 'قصب: (القَصَبُ، محرّكةً: كلُّ نباتٍ ذِي أَنابِيبَ، الواحدةُ قَصَبَةٌ) ، أَي بالهاءِ، وَهَذَا مِمّا خالفَ
                فِيهِ قاعِدتَهُ.(و) كلّ نَبَاتٍ كَانَ ساقُه أَنَابِيبَ وكُعُوباً، فَهُوَ قَصَبٌ.والقَصَبُ: الأَبَاءُ، الواحدةُ
                (قَصْبَاةٌ) ، بِالْفَتْح، مَقْصُورا بأَلفِ الإِلحاقِ، وآخِرُهُ هاءُ تأْنيثٍ (و) قَالَ سِيبَوَيْهِ: الطَّرْفاءُ،
                والحَلْفَاءُ (والقَصْباءُ) ، ونحوُها: اسمٌ واحدٌ، يَقع على جميعٍ، وَفِيه علامةُ التَّأْنيث، وواحدُهُ على بِنائِهِ
                ولَفْظِهِ، وَفِيه عَلامَة التّأْنيث الَّتي فِيهِ، وذالك قولُك للْجَمِيع حلْفَاءُ، والواحدة حَلفاءُ، وسيأْتي
                تَحْقِيق ذالك فِي حلف، (جَماعتُهَا) ، أَي: القَصبِ النّابتِ الْكثير فِي مَقْصَبةٍ. (و) عَن ابْنِ سِيدهْ: القَصْبَاءُ:
                (مَنْبِتُهَا، وَقد أَقْصبَ المكانُ) .(وأَرْضٌ) قَصِبَةٌ كفَرِحَةٍ (ومَقْصَبَةٌ) بِالْفَتْح، أَيْ: ذاتُ قَصبٍ.وقَصَّبَ
                الزَّرْعُ، تَقْصِيباً، واقْتَصَبَ صَار لَهُ قَصَبٌ، وذالك بعدَ التَّفريخ.(و) القَصْبُ: القَطْعُ، يُقَال: (قَصَبَهُ)
                ، أَي الشَّيْءَ، (يَقْصِبُهُ) ، من بَاب ضَرَبَ، قَصْباً، إِذا (قَطَعَهُ، كاقْتَصَبَه) .(و) قَصَبَ الجَزَّارُ
                (الشَّاةَ) يَقْصِبُهَا قَصْباً: (فَصَلَ قَصَبَها) ، وقَطَّعَها عُضْواً عُضْواً.(و) قَصَبَ (البَعِيرُ) الماءَ،
                يَقصِبه، (قَصْباً) : مَصَّهُ.(و) قد قَصَب يَقْصِب (قُصُوباً: امْتَنَع مِنْ شُرْبِ الماءِ) قَبْلَ أَنْ يَرْوَى،
                (فرَفَعَ رَأْسَهُ عَنهُ) ، وَقيل: القُصُوبُ: الرِّيُّ من وُرُودِ الماءِ وغيرِهِ و (بَعِيرٌ) قَصِيبٌ: يَقْصِبُ
                المَاءَ، (و) كذالك (ناقَةٌ قَصِيبٌ) ، أَي: يَمُصُّهُ (وقاصِبٌ) : مُمْتَنِعٌ من شُرْبِ الماءِ رافِعٌ رأْسَهُ.
                وبَعِيرٌ قاصِبٌ، وناقةٌ قاصِبٌ أَيضاً، عَن ابْنِ السِّكِّيت. وَقَالَ قَيْسُ بْنُ عاصِم:سَتحْطِمُ سَعْدٌ والرِّبابُ
                أُنُوفَكُمْكَمَا حَزّ فِي أَنْفِ القَصِيبِ جَرِيرُهاوَوجدت فِي حَاشِيَة كتاب البَلاذُرِيِّ: ويُقَال: ناقَةٌ
                مُقْتَصَبَةٌ.(و) قَصَبَ (فُلاناً) ، أَو دَابَّةً، أَو بَعِيراً، يَقْصِبُهِ، قَصْباً: (مَنَعَه من الشُّرْبِ)
                وقَطَعَهُ عليهِ (قَبْلَ أَنْ يَرْوَى) . وَعَن الأَصْمَعِيِّ: قَصَبَ البَعِيرُ، فَهُوَ قاصِبٌ: إِذا أَبَى أَنْ
                يَشرَبَ، والقومُ مُقْصِبُون: إِذَا لم تَشْرَبْ إِبلُهُمْ. ودخَلَ رُؤْبَةُ على سُلَيْمَانَ بْنِ عَلِيَ، وَهُوَ
                والِي البَصْرَةِ، فقَالَ: أَيْنَ أَنْتَ من النِّسَاءِ؟ فَقَالَ: أُطِيلُ الظِّمْءَ، ثُمَّ أَرِدُ فأُقْصِبُ.(و)
                قَصَبَه، يَقْصِبُهُ، قَصْباً: (عابَهُ، وشتَمَهُ) ، ووَقَعَ فِيهِ.وأَقْصَبَه عِرْضَهُ: أَلْحَمَهُ إِيَّاه،
                وقالَ الكُميت:وكُنْتُ لَهُمْ من هاؤُلاكَ وهاؤُلاَمِجَنّاً على أَنِّي أُذَمُّ وأُقْصَبُورَجُلٌ قَصَّابَةٌ لِلنَّاسِ:
                إِذا كانَ يَقَعُ فيهم، وسيأْتي. وَفِي حَدِيث عبد المَلِكِ قَالَ لِعُرْوَةِ بْنِ الزُّبَيْرِ: (هَلْ سَمِعتَ
                أَخاكَ يَقْصِبُ نِساءَنَا؟ قَالَ: لَا) ، (كقَصَّبَه) تَقصيباً.(والقَصَبُ، محرَّكَةً أَيضاً: عِظامُ الأَصابِعِ)
                من اليَدَيْنِ والرِّجْلَيْنِ. وامْرَأَةٌ تامَّةٌ القَصَبِ، وَهُوَ مَجازٌ. وَقيل: هِيَ مَا بَين كُلِّ مَفْصِلَيْنِ
                من الأَصَابِع، وَفِي صفته، صلى الله عَلَيْهِ وَسلم (سَبْطُ القَصَبِ) . وَفِي المِصْبَاح: القَصَبُ: عِظامُ
                اليَدَيْنِ والرِّجْلَيْنِ ونَحْوِهِما. وقَصَبَةُ الإِصبَعِ: أُنْمُلَتُها. وَفِي الأَساس: فِي كُلِّ إِصْبَعٍ
                ثلاثُ قَصَباتٍ، وَفِي الإِبْهامِ قَصَبتانِ، انْتهى. (و) فِي التّهذيب: عَن الأَصْمعيّ: (شُعَبُ الحلْقِ) .(و)
                القَصَبُ: عُرُوقُ الرِّئَةِ، وَهِي (مخارِجُ الأَنْفَاسِ) ومَجَارِيها، وَهُوَ مَجازٌ.(و) القَصبُ: (مَا كَانَ
                مُسْتَطِيلاً) أجْوَفَ (من الجوْهِرِ) ، وَفِي بَعضِ الأُمَّهاتِ: من الجَواهِرِ، قَالَه ابنُ الأَثيرِ وَقيل:
                القصبُ: أَنابِيبُ من جَوْهَرٍ.(و) القَصبُ: (ثِيابٌ ناعِمَةٌ) رِقاقٌ، تُتَّخَذُ (من كَتَّانٍ، الوَاحِدَةُ قَصَبِيٌّ)
                ، مِثْلُ عَرَبيَ وعَرَبٍ. وَفِي الأَسَاسِ، فِي المجازِ: وَمَعَ فلانٍ قَصَبُ صنْعاءَ، وقَصبُ مِصْرَ، أَيْ:
                قَصبُ العقِيقِ، وقَصبُ الكتَّانِ.(و) القَصَب: (الدُّرُّ الرَّطْبُ) ، والزَّبَرْجدُ الرَّطْبُ (المُرَصَّعُ
                بالياقُوتِ) ، قَالَه أَبُو العبَّاسِ عَن ابْنِ الأَعْرابيِّ حِينَ سُئِلَ عَن تفْسِيرِ الحديثِ الْآتِي، (ومِنْهُ)
                الحَدِيث: (أَنَّ جِبْرِيلَ قالَ لِلنَّبيّ، صلى الله عَلَيْهِ وَسلم (بَشِّرْ خَدِيجَةَ بِبَيْتٍ فِي الجنَّةِ
                مِنْ قَصَبٍ) ، لَا صَخَبَ فِيهِ وَلَا نَصَبَ) . هاكذا فِي أُصُولنا، وَفِي نسخةِ الطّبْلاوِيّ وغيرِه، وَهُوَ
                الصَّواب، ويُوجَدُ فِي بعض النّسخ: وَمِنْه: (بُشِّرَتْ) ، بتاء التَّأْنيث الساكنة، كأَنّهُ حكايةٌ لِلَّفْظ
                الْوَارِد فِي الحَدِيث. قَالَ ابْنُ الأَثِيرِ: القَصَبُ هُنا: لُؤْلُؤٌ مُجَوَّفٌ واسعٌ، كالقَصْرِ المُنِيف؛
                وَمثله فِي التَّوشِيح، وَعَن ابْنِ الأَعرابيّ: البيْتُ، هُنا، بِمَعْنى: القَصْر والدّارِ، كقولكِ: بَيْتُ المَلِكِ،
                أَي: قصرُهُ، وسيأْتي. قَالَ شيخُنا: وأَخرجَ الطَّبرانِيُّ عَن فاطمةَ، رضيَ اللَّهُ عَنْهَا، قالتْ: (قُلْتُ:
                يَا رَسُولَ اللَّهِ، أَيْنَ أُمِّي؟ قَالَ: فِي بَيْتٍ من قَصَبٍ. قلتُ: أَمِنْ هَذَا القَصَبِ؟ قَالَ: لَا،
                من القَصَبِ المنظومِ بالدُّرِّ والياقُوتِ واللُّؤْلُؤِ) . ثمّ قَالَ: قلتُ: وَقد قَالَ بعضُ حُذّاقِ المُحَدِّثينَ:
                إِنَّهُ إِشارةٌ إِلى أَنّها حازَتْ قَصَبَ السَّبْقِ، لاِءَنَّهَا أَوَّلُ مَنْ أَسلَمَ مُطْلَقاً، أَو من النِّساءِ،
                انْتهى.(و) من المَجَاز: خَرَجَ الماءُ من القَصَبِ، وَهِي (مَجارِي الماءِ من العُيُونِ) ، ومَنَابِعها. وَفِي
                التَّهْذِيب عَن الأَصْمَعِيّ: القَصَبُ: مَجارِي ماءِ البِئْرِ من العُيُونِ، واحِدَتُهَا قَصَبَةٌ؛ قالَ أَبو
                ذُؤَيْب:أَقامَتْ بِهِ فَابْتَنَتْ خَيْمَةًعلى قَصَبِ وفُرَاتٍ نَهِرْقَالَ الأَصْمَعِيُّ: قَصَبُ البَطْحاءِ:
                مياهٌ تَجرِي إِلى عُيُونِ الرَّكَايا، يَقُول: أَقامتْ بَين قَصَبٍ، أَيْ: رَكَايا، وماءٍ عَذْبٍ. وكُلُّ ماءٍ
                عَذْبٍ: فُراتٌ؛ وكُلُّ كثيرٍ جَرَى فقَدْ نَهَرَ واسْتَنْهَرَ.(والقُصْبُ، بالضَّمِّ: الظَّهْرُ) هاكذا فِي نسختنا،
                وَقد تصفَّحْتُ أُمَّهاتِ اللُّغَة، فَلم أَجِدْ مَنْ ذَكَرَهُ، وإِنّمَا فِي لِسَان الْعَرَب قَالَ: وأَما قَوْلُ
                امْرِىءِ القَيْسِ:والقُصْبُ مُضْطَمِرٌ والمَتْنُ مَلْحُوبُفيُرِيدُ بِهِ الخَصْرَ، وَهُوَ على الاستِعارة، وَالْجمع
                أَقْصابٌ. قلتُ: فلَعَلَّهُ (الخَصْرُ) بدل: (الظَّهْرِ) ، وَلم يتعرَّضْ شيخُنا لَهُ، وَلم يَحُمْ حِماهُ، فليُحَقَّقْ.(و)
                القُصْبُ أَيضاً: المِعَى، بِالْكَسْرِ، (ج: أَقْصَابٌ) ، وَفِي الحَدِيث: (أَنّ عَمْرَو بْنَ لُحَيَ أَوَّلُ من
                بَدَّلَ دِينَ إِسماعيلَ، عَلَيْهِ السَّلامُ) ، قَالَ النَّبيُّ، صلى الله عَلَيْهِ وَسلم (فرَأَيْتُهُ يَجُرُّ
                قُصْبَهُ فِي النّارِ) وَقيل: القُصْب: اسْمٌ لِلأَمْعاءِ كُلِّهَا، وَقيل: هُوَ مَا كَانَ أَسفلَ الْبَطن من
                الأَمعاءِ، وَمِنْه الحَدِيث: (الَّذِي يَتخطَّى رِقَابَ النَّاسِ يومَ الجُمُعةِ كالجارِّ قُصْبَهُ فِي النّارِ)
                . وَقَالَ الرّاعي:تَكْسُو المَفَارِقَ واللَّبَّاتِ ذَا أَرَجٍمِنْ قُصْبِ مُعْتَلِفِ الكافورِ دَرَّاجِ(والقَصّابُ)
                ، كشَدّادٍ: (الزَّمّارُ، والنَّافِخُ فِي القَصَبِ) ، قالَ:وقاصِبُونَ لنا فِيهَا وسُمّارُوَقَالَ رُؤْبَةُ يَصِفُ
                الحِمَارَ:فِي جَوْفِهِ وَحْيٌ كوَحْيِ القَصَّابْيَعْنِي عَيْراً يَنْهَقُ.(و) القَصَّابُ: (الجَزّارُ، كالقاصِب
                فيهِمَا) ، والمسموعُ فِي الأَولِ كثيرٌ، وحِرْفَهُ الأَخِيرِ القِصَابَةُ، كَذَا فِي الْمِصْبَاح. وكلامُ الجَوْهَرِيّ
                يَقتضِي أَنّ هاذا التَّصريفَ فِي الزَّمْرِ أَيضاً، قَالَه شيخُنا؛ فإِمَّا أَنْ يكونَ من القَطْعِ، وإِمّا أَنْ
                يكونَ من أَنَّهُ يأْخُذُ الشَّاةَ بقَصَبَتِها، أَي: بسَاقِها. وَقيل: سُمِّيَ القَصّابُ قَصّاباً، لِتَنْقِيَتِهِ
                أَقْصَابَ البَطْنِ. وَفِي حديثِ عليّ، كرَّمَ اللَّهُ وَجهَهُ: (لَئنْ وَلِيتُ بنِي أُمَيَّةَ لأَنْفُضَنَّهُمْ
                نَفْضَ القَصّابِ التِّرَابَ الوذِمَة) ، يُرِيدُ اللحُومَ الّتي تَتَرَّبُ بسُقُوطِها فِي التُّرَاب؛ وَقيل:
                أَرادَ بالقَصَّابِ السَّبُعَ. والتِّرابُ: أَصْلُ ذِرَاعِ الشَّاةِ، وَقد تقدم فِي ترب.وَعَن ابْنِ شُمَيْلٍ:
                أَخَذَ الرَّجُلُ الرَّجُلَ فقَصَّبَه. والتَّقْصِيبُ: أَنْ يَشُدَّ يَدَيْهِ إِلى عُنُقِهِ، وَمِنْه سُمِّيَ
                القَصّابُ قَصّاباً. كَذَا فِي لِسَان الْعَرَب.(و) من المَجَاز: (القَصْبَة) ، بِفَتْح فسُكُون، كَذَا هُوَ مضبوطاً
                فِي نسختنا: (البِئرُ الحَدِيثَةُ الحَفْرِ) ، وَيُقَال: بِئْرٌ مستقيمةُ القَصبةِ.(و) القَصبَة: (القَصْرُ، أَوْ
                جَوْفه) . يُقَال: كنت فِي قَصبَةِ البلدِ، والقَصر، والحِصْن، أَي: فِي جَوْفه.(و) القَصبَةُ من البَلَدِ: (المَدِينة،
                أَوْ) لَا تُسَكَّنُ، قَصَبُ الأَمصار: (مُعْظَمُ المُدُنِ) ، وقَصبةُ السَّوَادِ: مَدِينَتُها. والقَصبَةُ: جَوْفُ
                الحِصْنِ، يُبْنَى فِيهِ بناءٌ، هُوَ أَوْسَطُه. وقَصبةُ البِلاد: مدينَتُها. (و) القَصبَة: (القَرْيَةُ) . وقَصبَةُ
                القَرْيةِ: وَسَطُهَا، كَذَا فِي لِسَان الْعَرَب.(و) القَصبَةُ: (ة بالعِرَاقِ) ، وَهِي واسِطُ القَصَب، لأَنَّها
                كَانَت قبلَ بنائِهَا قَصَباً، وإِليها نُسِبَ أَبو حنيفةَ محمَّدُ بْنُ حَنِيفَةَ بْنِ ماهانَ. سكن بغْدَادَ،
                ويقالُ لَهُ أَيضاً: الواسِطِيّ.(و) القَصبَةُ: (الخُصْلَةُ المُلْتَوِيَةُ مِنَ الشَّعَرِ، كالقُصَّابَةِ، كَرُمّانَةٍ
                والقَصِيبَةُ) ، ككَرِيمَةٍ، (والتّقصِيبَةُ والتَّقْصِبَةُ) على تَفْعِلَةٍ. (وقَدْ قَصَّبَهُ تَقْصِيباً) ،
                ومثلُهُ فِي الْفرق، لاِبْنِ السِّيدِ. قَالَ بِشْر بْنُ أَبي خازمٍ:رَأَى دُرَّةً بَيْضاءَ يَحْفِلُ لَوْنَهَاسُخامٌ
                كغُربانِ البَرِيرِ مُقَصَّبُوالقَصَائبُ: الذَّوَائِبُ المُقَصَّبَةُ، تُلْوَى لَيَّاً حتّى تَتَرَجَّلَ، وَلَا
                تُضْفَرُ ضَفْراً.وشَعَرٌ مُقَصَّبٌ: أَي مُجَعَّد. وقَصَّبَ شَعْرَه: جَعَّدَه، وَلها قُصّابَتانِ: أَيْ غَدِيرَتَانِ.
                وَقَالَ اللَّيْثُ: القَصْبَةُ: خُصْلَةٌ من الشَّعَر تلتوِي، فإِنْ أَنت قَصَّبْتَها، كَانَت تَقْصِيبَةً، والجمعُ
                التَّقاصِيبُ. وتقصيبُكَ إِياها: لَيُّكَ الخُصْلَةَ إِلى أَسفلِها، تَضُمُّها وتَشُدُّها، فتُصْبِحُ وَقد صارَت
                تقاصِيبَ، كأَنَّها بَلابِلُ جاريةٍ. وَعَن أَبِي زيد: القَصائبُ: الشَّعَرُ المُقَصَّبُ، وَاحِدَتُها قَصِيبَةٌ. (و)
                القَصَبَة (كُلُّ عَظْمِ ذِي مُخَ) ، على التَّشْبيه بالقَصَبة، وَالْجمع قَصَبٌ. والقَصَب: كلُّ عَظمٍ مستديرٍ
                أَجوَفَ، وكذالك مَا اتُّخِذَ من فِضَّةٍ، وغيْره الواحدةُ قَصَبة.(والقُصّابَة، مشَدَّدةً) : هِيَ (الأُنْبُوبَةُ،
                كالقَصِيبَةِ) ، وَجمعه القَصائبُ.(و) القُصّابَةُ: (المِزْمارُ) ، والجمعُ قُصّابٌ، قَالَ الأَعْشَى:وشاهِدُنا
                الجُلُّ والياسَمِينُ والمُسْمِعاتُ بقُصَّابِهاوَقَالَ الأَصمَعِيُّ: أَراد الأَعْشى بالقُصّابِ الأَوتارَ الّتي
                سُوِّيَتْ من الأَمعاءِ، وَقَالَ أَبو عمرٍ و: هِيَ المزامِيرُ.(و) القَصّابَة: الرَّجُلُ (الوقّاعُ فِي النّاسِ)
                ، وَفِي حَدِيث عبد المَلكِ، قَالَ لعُرْوةَ بْنِ الزُّبَيْرِ، هلْ سمِعْتَ أَخَاكَ يَقْصِبُ نِساءَنا؟ قَالَ:
                لَا) .(و) القِصَابُ، (كَكِتَابٍ) ، وَفِي نسخَةٍ ككِتَابَةٍ: (مُسَنَّاةٌ، تُبْنَى فِي اللِّحْفِ) بالكَسْرِ،
                هَكَذَا فِي النُّسَخ وَفِي بعض الأُمَّهات: فِي اللهجِ (لَئلاّ يَسْتَجْمِعَ السَّيْلُ) ، ويُوبَلَ (فَيَنْهدِمَ
                عِرَاقُ الحائِطِ) ، أَي أَصْلُهُ، (بسَبَبِه) .(و) القِصَابُ: (الدِّبَارُ) ، الواحِدةُ (قَصَبَة) .(وذُو قِصَابٍ)
                : اسمُ (فَرسٍ لمالِكِ بْنِ نُوَيْرَةَ) اليرْبُوعِيّ، رَضِي الله عنهُ.(و) من المجازِ (القاصِبُ: الرَّعْدُ المُصَوِّتُ)
                ، قالَ الأَصمعيّ، فِي بَاب السَّحابِ الَّذي فِيهِ رَعْدٌ وبَرْقٌ: مِنْهُ المُجَلْجِلُ، والقاصِبُ، والمُدَوِّي،
                والمُرْتَجِسُ.قَالَ الأَزْهَرِيّ: شُبِّهَ السَّحَابُ ذُو الرَّعْدِ بالزَّامِر.(والقَصَبَات) ، مُحَركَة: (د،
                بالمغرِبِ) نُسِب إِليه جماعةٌ. (و: ة، باليَمامةِ) ، نَقله الصّاغانيّ.(والقُصَيْبَة، كجُهيْنةَ: ع، بِأَرْضِ
                اليَمامَةِ لِتَيْمٍ وعَدِيّ وثَوْرٍ بني عبدِ مَنَاةَ) قَالَت وجِيهةُ بِنتُ أَوْسٍ الضَّبِّيَّة:فمَالِيَ إِن
                أَحْببْتُ أَرْضَ عَشِيرتِيوأَبْغَضْتُ طَرْفَاءَ القُصَيْبةِ مِن ذَنْبِكَذَا قرأْتُ فِي ديوَان الحَمَاسة، لأِبِي
                تَمّامٍ.(و) قُصَيْبة: (ع) آخَرُ (بيْن يَنْبُعَ وخَيْبَرَ) ، لَهُ ذِكرٌ فِي كُتُب السِّيَرِ، قِيل: هُو لِبَنِي
                مالكِ بْنِ سعْدٍ، بالقُرْب من أُوَارةَ، كَانَ بِهِ منزِلُ العَجَّاجِ وَولده (و: ع) آخر (بالبَحْرَينِ) .والقُصَيْبات:
                موضِعٌ بنواحِي الشَّام.(وأَقصَب الرَّاعِي: عَافَتْ إِبلُهُ الماءَ) ، عَن ابْن السِّكيت.وَعَن الأَصمَعِيّ:
                قَصَبَ البعِيرُ، فَهُوَ قاصِبٌ: إِذا أَبَى أَنْ يَشْربَ، والقَوْمُ مُقْصِبُون: إِذا لم تَشْرَبْ إِبِلُهُم.(والتَّقْصِيبُ:
                تَجْعِيدُ الشَّعَرِ) يُقال: شَعَرٌ مُقَصَّبٌ: أَيْ مُجَعَّدٌ، وقَصَّبَ شَعَرَهُ: أَي جَعَّدَهُ، وَلها قُصَّابَتانِ:
                أَي غَدِيرَتَانِ.(و) التَّقْصِيبُ أَيضاً: (شَدُّ اليَدَيْنِ إِلى العُنُق) وَعَن ابْن شُمَيْلٍ: يُقَال: أَخَذَ
                الرَّجُلُ الرَّجُلَ فَقصَّبَه: أَي شَدَّ يَدَيْهِ إِلى عُنُقِه، وَمِنْه سُمِّيَ القَصَّابُ قَصَّاباً. (والمُقَصِّبُ،
                بِكَسْر الصّادِ المشَدَّدةِ) ، أَي على صِيغَة اسمِ الْفَاعِل: الفَرسُ الجَوادُ السّابقُ. قَالَ شيخُنَا: وهاذا
                الضَّبْطُ جَرى على خِلافِ اصطلاحِه، والأَوفقُ لَهُ قولُه: والمُقَصِّبُ كمُحَدِّثٍ، أَو هُوَ (الَّذي يُحْرِزُ
                قَصَبَ السِّباقِ) ، أَي: يأْخُذُهَا ويَحُوزُهَا. وَهُوَ فِي معْنَيَيْهِ من الْمجَاز كَذَا فِي الأَساس.وَيُقَال
                للمُرَاهِن إِذا سبَقَ: أَحْرَزَ قَصبةَ السَّبْقِ، وَقيل للسّابق: أَحْرَزَ القَصبَ، لاِءَنَّ الغايةَ الَّتِي
                يَسبق إِليها تُذرعُ بالقَصَب، وتُرْكَزُ تِلْكَ القَصَبةُ عِنْد مُنْتَهَى الغايَةِ، فَمن سَبقَها، حازَها واسْتَحَقَّ
                الخَطَر، وَيُقَال: حازَ قَصَبَ السَّبْقِ: أَي استولى على الأَمَدِ؛ وَقَالَ شيخُنا: وأَصلُه أَنهم كانُوا ينْصِبُونَ
                فِي حَلْبَةِ السِّبَاق قَصَبَةً، فمَنْ سبقَ، اقتَلَعَها وأَخَذَها، ليُعْلَمَ أَنَّهُ السّابقُ من غيرِ نِزَاعٍ،
                ثمّ كَثُر حَتَّى أُطْلِقَ على المُبَرِّزِ الّذِي يسْبِق الخَيْلَ فِي الحَلْيَة، والمُشمِّرِ المُسْرِعِ الْخَفِيف،
                وَهُوَ كثير فِي الِاسْتِعْمَال، انْتهى. وَفِي حَدِيث سعِيد بْنِ العاصِ: (أَنَّهُ سَبَقَ بينَ الخَيْل، فجَعَلَها
                مائَةَ قَصَبَةٍ) أَرادَ أَنه ذَرَعَ الغايةَ بالقَصَبِ، فَجَعلهَا مِائَةَ قَصَبَةٍ.(و) المُقَصِّبُ، أَيضاً:
                هُوَ (اللَّبَنُ) قَدْ (كَثُفَتْ عَلَيْهِ الرَّغْوَةُ. و) فِي المَثَل: (رَعَى فأَقْصَبَ) ، مثلُه للجَوْهَرِيّ
                والمَيْدَانِيّ (يُضْرَبُ للرَّاعِي، لأَنَّه إِذا أَساءَ رَعْيَها، لم تَشْرَبِ) الماءَ، لأَنّها إِنَّما تَشْرَبُ
                إِذا شَبِعَتْ من الكَلإِ؛ زادَ المَيْدانِيُّ: يُضْرَبُ لِمَنْ لَا يَنْصَحُ، وَلَا يُبالغُ فِيمَا تَوَلَّى
                حتّى يَفْسُدَ الأَمْرُ.(والقَصُوبُ، من الغَنَمِ: الَّتي تَجُزُّها) ، من بَاب ضَرَبَ. (وتُدْعَى النَّعْجَةُ،
                فيُقَالُ: قَصَبْ قَصَبْ) ، بالتسْكِين فيهمَا.وَفِي الأَساس: تَقول: قَصَبُ الحَظِّ. أَنْفَذُ من قَصَبِ الخَطِّ.وَفِيه
                فِي المَجَاز: وضَرَبَهُ على قَصَبَةِ أَنْفِه: عَظْمِه.وفُلانٌ لم يُقْصَبْ: أَي لم يُخْتَنْ.وَزَاد شيخُنا نَقْلاً
                عَن بعضِ الدَّواوين: القَصَبُ عُرُوقُ الجَنَاحِ، وعِظامُها.والحَسَنُ بْنُ عبدِ اللَّهِ القَصَّابُ، وأَبو عبدِ
                اللَّهِ حَبِيبُ بْنُ أَبي عمْرَة القَصَّابُ، وأَبو نَصْرٍ مذكورُ بْنُ سُلَيْمَانَ المُخَرِّميّ القَصَبانيُّ،
                بالنُّون، وأَبو حَمْزَةَ عِمْرَانُ بْنُ أَبِي عَطَاءٍ القَصَّابُ القَصَبِيُّ، مُحَدِّثُونَ.ومَحَلَّةُ القَصَبِ:
                قَرْيتانِ بِمِصْرَ من الغَرْبِيَّة، وَقد دخَلْتُ إِحداهما.ووَاسِطُ القَصَبِ: مدينةٌ مَشْهُورَة بالعِرَاق،
                وَقد يأْتي فِي وسط. سُمِّيَت بِهِ، لاِءَنَّها كَانَت قبل بِنائها قَصَباً.'
