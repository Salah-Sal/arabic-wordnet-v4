      - entry_id: 675108
        dictionary_id: 94
        headword: |-
          (1) جِسْر
          (2) «أ», شيء كالجسر شكلًا أو وظيفةً. مثل: «ب» جسر الأنف: جزء الأنفِ العُلْوِيُّ العظميُّ الواقعُ بين العينين. «ج» جسر النظارتين: ذلك الجزء من النظارتين الذي يجمع بين العَدَستين ويستقرّ على قصبة الأنف. «د» مُشْط العُود؛ مُشْط الكمان: القطعة الرافعة لأوتار العود أو الكمان. «هـ» البُرْج: منصّة رُبّان السفينة
          (3) الجسر: صفّ من أسنان صُنعيّة
