      - entry_id: 674402
        dictionary_id: 94
        headword: |
          (1) يضرب أو يقرع برفق
          (2) «أ» يهزّ to bob the head. «ب» يعبّر بهزّة رأس to bob a greeting
          (3) يَصْقُل؛ يُلمِّع
          (4) يتذبذب؛ يعلو ويهبط
          (5) يَبْرز: ينشأ على نحو غير متوقَّع
          (6) يحني الرأس احترامًا
          (7) يحاول العضّ على شيء بالنّواجذ to bob for apples
          (8) .أ» تذبذُب؛ ذبذبة. .ب» هزّة رأس إلخ
          (9) رقصة شعبية (اسك)
          (10) ضربة (ا.م).
          ---
          (1) عنقود؛ حُزْمة
          (2) باقة زَهْر (إسك)
          (3) «أ» كتلة ديدان إلخ [تُتَّخذ طُعمًا في الصَّيد بالقصبة]. «ب» فلِّينة قصبة الصيد
          (4) «أ» عُقْدة أو عَقْصة [من شَعْر أو غَزْل أو عصائب]. «ب» خُصلة شَعْر
          (5) قَصَّة شَعْر قصيرة [للنساء أو للأطفال]
          (6) الثِّقْل: ثِقْلٌ أو كُرة تكون في طرف البندول وذيل الفادِن وذيل الطائرة الورقية إلخ
          (7) شيء تافه
          (8) .أ» يَجُزّ. .ب» يَقُصّ الشعر قصيرًا.= shilling
          (9) = shilling
