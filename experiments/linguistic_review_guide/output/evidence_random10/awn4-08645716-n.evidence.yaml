            definitions_text: "باب القاف والصاد والباء معهما ق ص ب، ص ق ب، ق ب ص، ب ص ق مستعملات\nقصب: القَصَبُ: ثياب من كتان\
              \ ناعمة رقاق، والواحد قصَبيُّ. وكل نبت ساقه ذو أنابيب فهو قَصبٌ، وقصب الزرع تقصيباً. والقَصَبُ: عظام اليدين\
              \ والرجلين، وقصَبةُ الأنف عظمه، وكل عظيم مستدير أجوف. وما اتخذ من فضة أو غيرها قصب. والقَصْباءُ: القَصَبُ الكثير\
              \ في مَقْصَبَتِه. وقَصَبُ الرئة عروق غلاظ فيها، وهي مخارج النفس ومجاريه. والقَصَبةُ: جوف القصر أو جوف الحصن\
              \ يبنى فيه بناء هو أوسطه. والقَصبةُ خصلة من الشعر تلتوي فإذا أنت قَصَّبْتَها كانت تَقصيبةً، وتجمع تَقاصيبَ،\
              \ قال بشار:\nوفرعٌ زانَ متنيكِ ... وزانته التَّقاصيبُ \nوهو أن تضمها لياً إلى أصلها وتشدها فتصبح تَقَاصيبَ.\
              \ وفلان يقصِبُ فلاناً: يمزقه ويذكره بالقبيح. والقَصْبُ: القطع، والقَصّابُ يقصب الشاة ويفصل أعضاءها تقصيباً.\
              \ والقَصَبُ من الجوهر: ما كان مستطيلاً أجوف.\nولخديجة بيت في الجنة من قَصَبٍ لا وصب فيه ولا نصب\nأي لا داء فيه\
              \ ولا عناء. والقَصَبَ: الأمعاء كلها، وجمعه أقصابٌ. والقاصِبُ: الزامر.\nصقب: الصَّقبُ والسَّقبُ الطويل مع ترارة\
              \ في كل شيء. والصِّقَبُ: القرب، وبالسين لغة. ويقال للفصيل والفصيلة سَقْبٌ وسَقْبَةٌ ويقال للغصن الطويل الريان\
              \ سَقْبٌ، قال ذو الرمة:\nسَقْبانِ لم يتقشرْ عنهما النجب  قبص: القَبْصُ: التناول بأطراف الأصابع. ويروى: فَقَبَصْتُ\
              \ قَبْصَةً  ، أي أخذت من أثر دابة جبرئيل- ع. من التراب بأطراف أصابعي. وفرس قَبُوصٌ أي إذا جرى لم يصب الأرض إلا\
              \ أطراف سنابكه من قدم، ويقال: هو الرشيق الخلق، قال:\nسليم الرجع طهطاه قَبوصُ \nوالقَبْصُ، والقِبْصُ أجود،: مجمع\
              \ النمل الكثير. وتقول: إنهم لفي قِبْصٍ من العدد، وفي قِبْصِ الحصى أي في كثرة لا يستطاع عده. والقَبَصُ: ارتفاع\
              \ في الرأس وعظم، وقَبِصَ قَبَصاً فهو رجل أَقَبصُ الرأس ضخم مدور، قال:\nقَبْصاءُ لم تنطح ولم تكتل \nبصق: بَصَقَ\
              \ لغة في بَسَق، وبُصاقُ الجراد لعابه. والبِصاقُ: هنات من الحرة تبدو منها إلى المستوى، الواحدة بَصْقةٌ كأن الحر\
              \ بَصَقَها بَصْقاً"
