              text: |-
                قصب
                1 قَصَبَهُ, aor. ـِ (M, K,) inf. n. قَصْبٌ, (S, M, O,) He cut it, (S, * M, O, * K,) namely, a thing; (M;) as also ↓ اقتصبهُ. (M, K.) And قَصَبَ الشَّاةَ, (S, M, O, Msb, K,) aor.  as above, (M, Msb,) and so the inf. n., (S, M, O, Msb,) said of the butcher, (O,) He cut up the sheep, or goat, into joints, or separate limbs: (S, O, Msb:) or he separated the [bones called] قَصَب of the sheep, or goat. (M, K.) b2:  فُلَانٌ لَمْ يُقْصَبٌ meaning (tropical:)  Such a one has not been circumcised, is from القَصْبُ signifying “ the act of cutting. ” (A.) b3:  And قَصَبَهُ, (S, M, A, O, K,) aor. ـِ inf. n. قَصْبً; (M;) and ↓ قصّبهُ, (M, K,) inf. n. تَقْصِبٌ, (K,) (tropical:)  He attributed, or imputed, to him, or accused him of, a vice, or fault, or the like; (S, M, A, O, K;) and reviled, or vilified, him; (M, A, K;) meaning he cut him with censure. (A.) A2:  And قَصَبَهُ, (S, M, O, K,) namely, a camel, and [any] other [animal], (S, O,) or a man, (M, K,) and a beast, (M,) aor.  and inf. n. as above, (M,) He stopped, or cut short, (S, O,) or prevented, (M, K,) his drinking, before he had satisfied his thirst. (S, M, O, K.) b2:  And قَصَبَ شُرْبَهُ He (a camel) abstained from his drinking before he had satisfied his thirst: (ISk, S, O:) or قَصَبَ [alone], said of a camel, (As, M, K, TA,) aor.  as above, inf. n. قَصْبٌ and قُصُوبٌ, (M, K,) he refused to drink: (As, TA:) or he abstained from drinking the water, raising his head from it, (M, K, TA,) before he had satisfied his thirst: (TA:) or, as some say, قُصُوبٌ signifies the satisfying of thirst by coming to the water &c. (M, TA.) b3:  And قَصَبَ المَآءَ, aor. ـِ inf. n. قَصْبٌ, He (a camel) sucked up, or sucked in, the water. (M, TA.) A3:  It seems to be applied in the S that قَصَبَ, aor.  as above, also signifies He played upon a musical reed, or pipe. (MF.) 2 قَصَّبَ see the preceding paragraph.
                A2:  قصّب الزَّرْعُ, (S, M, O,) inf. n. تَقْصِيبٌ; (S;) and ↓ اقصب; (M;) The زرع [i. e. seed-produce, or wheat or the like,] produced its قَصَب [or jointed stalks, or culms:] (M:) this is the case after the تَفْرِيخ. (S, O. [See 2 in art. فرخ.]) [Hence the saying,] إِنِّى أَرَى الشَّرَّ قَصَّبَ (assumed tropical:)  [Verily I see evil, or the evil, to have grown, like corn producing its culms]. (TA voce نَبَّبَ.) b2:  And قصّب الشَّعَرَ, (M, K,) inf. n. تَقْصِيبٌ, (O, K,) (assumed tropical:)  He twisted the locks of the hair [in a spiral form so that they became like hollow canes]: (M, K:) or قَصَّبَتْ شَعَرَهَا (tropical:)  she (a woman) twisted the locks of her hair so that they became like قَصَب [i. e. hollow canes]: (A:) and (K) (assumed tropical:)  he curled the hair; syn. جَعَّدَهُ. (O, K.) b3:  And قصّبهُ, (ISh, TA,) inf. n. as above, (O, K,) He bound his hands to his neck, (ISh, O, K, TA,) namely, a man's: (ISh, TA:) [and app., in like manner, his fore-legs, namely, a sheep's or a goat's: sea  قَصَّابٌ, last sentence.]4 اقصبهُ عِرْضَهُ (assumed tropical:)  He empowered him to revile, or vilify, him. (M.) [Agreeably with an explanation of قَصَبَهُ in the A, mentioned above, it may rather be rendered (tropical:)  He caused him to cut, with censure, or to wound, his honour, or reputation.]
                A2:  اقصب said of a pastor, (ISk, S, M, O, K,) [He performed his service ill, so that] his  camels disliked, and refused to drink, the water; (ISk, M, K;) or, [so that] his camels abstained from drinking before they had satisfied their thirst. (S, O.) رَعَى فَأَقْصَبَ [He pastured, and performed his service ill, &c.,] is a prov., (S, M, O, K,) applied to a [bad] pastor; because, if he pasture the camels ill, they will not drink; (S, O, K;) for they drink only when they are satiated with the herbage: (S, O:) or, as Meyd says, it is applied to him who will not act sincerely, or honestly, and with energy, or vigour, in an affair which he has undertaken, so that he mars, or vitiates, it. (TA.) A3:  اقصب said of a place, It produced reeds, or canes. (M, K.) b2: See also 2.8 إِقْتَصَبَ see 1, first sentence.
                قُصْبٌ A gut; syn. مِعًى: (S, M, Mgh, O, K:) or all the أَمْعَآء [or guts]: or the guts [امعآء] that are in the lower part of the belly: TA:) pl. أَقْصَابٌ. (S. M, Mgh, O, K.) One  says, هُوَ يَجُرُّ قُصْبَهُ [expl. by what here follows]. (S, O.) The Prophet said, respecting 'Amr Ibn-'Ámir El-Khurá'ee, who first set at liberty سَوَائِب [pl. of سَائِبَةٌ, q. v.], (O,) or respecting 'Amr Ibn-Kamee-ah, who first changed the religion of Ishmael, (TA,) رَأَيْتُهُ يَجُرُّ قُصْبَهُ فِى النُّارِ [I saw him dragging his guts in the fire of Hell]. (O, TA.) b2:  El-Aashà in his saying وَشَاهِدُنَا الجُلَّ وَاليَاسَمِى
                نُ وَالمُسْمِعَاتُ بِأَقْصَابِهَا means [The rose being present with us, and the jasmine, and the songstresses] with their chords of gut: or, as some relate it, (and as it is cited in the M,) he said ↓ بِقُصَّابِهَا, meaning with their musical reeds, or pipes. (S, O.) b3:  And (tropical:)  The middle of the body; metaphorically applied thereto: so in the saying of Imra-el-Keys, (S, O, L,) or, accord. to the people of El-Koofeh and ElBasrah, it is falsely ascribed to him, (O,) والقُصْبُ مُضْطَمِرٌ وَالمَتْنُ مَلْحُوبُ [And the middle of the body slender and lean, and the portion next the back-bone, on either side, smooth, and sloping downwards]. (S, O, L.) b4: And (assumed tropical:)  The back. (O, K. [SM, not having found this in any lexicon but the K, supposed that الظَّهْرُ might be substituted in it for الخَصْرُ, which is not therein mentioned as a meaning of القُصْبُ.]) قَصَبٌ [a coll. gen. n., signifying Reeds, or canes; and the like, as the culms of corn, &c.; and sometimes signifying a reed, or cane, and the like, as meaning a species thereof;] any plant having (M, A, Mgh, Msb, K) its stem composed of (Mgh, Msb) أَنَابِيب [or internodial portions] (M, A, Mgh, Msb, K) and [their] كُعُوب [or connecting knots, or joints]; (Mgh, Msb;) [i. e. any kind, or species, of plant having a jointed stem;] i. q. أَبَآءٌ [a word comparatively little known]; (S; [in the O اَناء, a mistranscription;]) and [it is said that] ↓ قَصْبَآءُ signifies the same: (S, O: [but see what follows:]) the n. un. of the former is ↓ قَصَبَةٌ (S, M, Mgh, Msb, K) and ↓ قَصْبَاةٌ or ↓ قَصَبَاةٌ: (K accord. to different copies; the former accord. to the TA: [but each of these I believe to be a mistake for ↓ قَصُبْآءَةٌ, which is said to be a n. un. of قَصْبَآءُ, and therefore held by some to be syn. with قَصَبَةٌ:]) ↓ قَصْبَآءُ [appears, however, to differ somewhat from قَصَب, for it is said that it] signifies an assemblage of قَصَب; (M, K;) and its n. un. is ↓ قَصَبَةٌ and ↓ قَصْبَآءَةٌ [like حَلَفَةٌ and حَلْفَآءَةٌ which are both said to be ns. un. of حَلْفَآءٌ; and طَرَفَةٌ and طَرْفَآءَةٌ, said to be ns. un. of طَرْفَآءٌ; the former in each case anomalous]: (M: [see also Ham p. 201:]) or, accord. to Sb, ↓ قَصْبَآءُ is sing. and pl., (S, M, Mgh, O,) and so طَرْفَآءُ, (S, M, O,) and حَلْفَآءُ; (S, O;) as pl. and as sing. also having the sign of the fem. gender; therefore, when they mean to express the sing. signification, they add the epithet وَاحِدَةٌ; thus, and thus only, distinguishing the sing. meaning from the pl., and making a difference between a word of this class and a noun that denotes a pl. meaning and has not the sign of the fem. gender such as تَمْرٌ and بُسْرٌ, and such as أَرْطًى and عَلْقًى of which the ns. un. are أَرْطَاةٌ and عَلْقَاةٌ: (M:) or, as some say, ↓ قَصْبَآءُ signifies many قَصَب growing in a place: (Mgh:) and it signifies also a place in which قَصَب grow: (M, K:) [or] ↓ مَقْصَبَةٌ has this last meaning; (Mgh, Msb;) or signifies, like ↓ أَرْضٌ قَصِبَةٌ, a land having قَصَب. (M, K. *) b2:  أَحْرَزَ قَصَبَ السَّبْقِ, (Msb,) or السَّبْقِ ↓ قَصَبَةَ, (TA,) [meaning (assumed tropical:)  He won, or acquired, the canes, or cane, of victory in racing,] is said of the winner in horseracing: they used to set up, in the horse-course, a cane (قَصَبَة,) and he who outstripped plucked it up and took it, in order that he might be known to be the one who outstripped, without contention: this was the origin of the phrase: then, in consequence of frequency of usage, it was applied also to the expeditious, quick, and light, or active: (Msb, * TA:) [accord. to the TA, it is a tropical phrase, but perhaps it is so only when used in the latter way:] it is said in a trad. of Sa'eed Ibn-El-Ás, that he measured the horse-course with the cane, making it to be a hundred canes in length, and the cane was stuck upright in the ground at the goal, and he who was first in arriving at it took it, and was entitled to the stake. (O, TA. [See also مُقَصِّبٌ.]) b3:  [The ↓ قَصَبَة here mentioned as A certain measure of length, used in measuring race-courses, was also used in other cases, in measuring land, and differed in different countries and in different times: accord. to some, it was ten cubits; thus  nearly agreeing with our “ rod: ” (see جَرِيبٌ:) accord. to others, six cubits and a third of a cubit: (see فَدَّانٌ:) the modern Egyptian قَصَبَة, until it was reduced some years ago, was about twelve English feet and a half; its twentyfourth part, called قَبْضَةٌ, being the measure of a man's fist with the thumb erect, or about six inches and a quarter.] b4:  القَصَبُ الفَارِسِىُّ [The Persian reed] is a kind whereof writing-reeds are made: (Mgh, Msb:) and another kind thereof is hard and thick; and of this kind are made musical reeds, or pipes; and with it houses, or chambers, are roofed. (Msb) One says, قَصَبُ الخطِّ أَنْفَذُ مِنْ قَصَبِ الخَطِّ [meaning Writingreeds are more penetrating, or effective, than the canes of El-Khatt (which are spears); i. e., words wound more than spears]. (A, TA.) b5: قَصَبُ السُّكَّرِ is well-known [as meaning The sugar-cane]: (Msb:) this is of three kinds; white and yellow and black: of the first and second, but not of the third, the juice [of which sugar is made] is expressed; and this expressed juice is called عَسَلُ القَصَبِ. (Mgh.) b6:  قَصَبُ الذَّرِيرَةِ [is Calamus aromaticus; also called قَصَبُ الطِّيبِ]: a species thereof has the joints near together, and breaks into many fragments, or splinters, and the internodial portions thereof are filled with a substance like spiders' webs: when  chewed, it has an acrid taste, and it is aromatic (Mgh, Msb) when brayed, or powdered; (Mgh;) and inclines to yellowness and whiteness. (Mgh, Msb. [See also ذَرِيرَةٌ, in art. ذر.]) b7:  قَصَبٌ also signifies (assumed tropical:)  Any round and hollow bone [or rather bones]; (S, O;) it is pl. [or rather a coll. gen. n.] of which ↓ قَصَبَةٌ is the sing. [or n. un,], this latter signifying any bone containing marrow; (M, K;) thus called by way of comparison [to the reed, or cane]. (M.) b8:  And (tropical:)  The bones of the يَدَانِ and رِجْلَانِ [i. e. arms and legs, or hands and feet, but here app. meaning the latter], (A, Msb,) and the like: (Msb:) [or] (assumed tropical:)  the [phalanges, or] bones of the fingers and toes; (M, K, * TA;) (tropical:)  the bones whereof there are three in each finger and two in the thumb [and the like in the feet]; (A, TA;) and Zj says, the bones of the أَصَابِع [or fingers and toes] which are also called سُلَامَى: (Msb in art. سلم:) or, as some say, the portions between every two joints of the أَصَابِع: (M, TA:) and الأَصَابِعِ ↓ قَصَبَةُ [or قَصَبُةُ الإِصْبَعِ] signifies the أَنْمَلَة [here perhaps meaning the ungual phalanx] of the finger or toe. (Msb, TA.) b9:  And (assumed tropical:)  The bones and veins of a wing. (MF.) b10:  [And (assumed tropical:)  Quills: thus in the phrase صَارَ الرِّيشُ قَصَبًا, in the K, voce أَنُوقٌ, meaning The feathers became quills: n. un. ↓ قَصَبَةٌ: see صَنَمَةٌ.] b11:  And (tropical:)  [The bronchi;] the branches of the windpipe; (M, K;) and outlets of the breath; (K;) [i. e.] القَصَبُ, (S, M, O,) or فَصَبُ الرِّئَةِ, (A, Msb,) signifies the ducts (عُرُوق) of the lungs; (S, A, O, Msb;) through which the breath passes forth. (S, M, A, O, Msb.) [See حَلْقٌ.] b12:  And (assumed tropical:)  Any  things made of silver, and of other material, resembling [in form] the kind of round and hollow bone [or bones] thus called: n. un. ↓ قَصَبَةٌ. (S, O.) And (assumed tropical:)  Jewels (S, M, K) having the form of tubes (أَنَابِيب), (S,) or oblong, (M, K,) and hollow. (M.) b13:  And (assumed tropical:)  Brilliant pearls, and brilliant chrysolites, interset with jacinths. (IAar, O, K.) So in the saying, in a trad., (O, K,) related as uttered by Gabriel, (O,) [cited in the S app. as an ex. of the meaning next preceding this last,] بَشِّرْ خَدِيجَةَ بِبَيْتِ فِى الجَنَّةِ مِنْ قَصَبٍ (IAar, O, K) i. e. [Rejoice thou Khadeejeh by the announcement of] a pavilion [in Paradise] of brilliant pearls, &c.: (IAar, O:) or the meaning is, of hollow pearls [or pearl], spacious, like the lofty palace: (IAth, TA:) or of emerald: (TA voce بَيْتٌ:) and it is said by some to convey an allusion to Khadeejeh's acquiring what is termed قَصَبُ السَّبْقِ [expl. above], because she was the first person, or the first of women, who embraced El-Islám. (MF, TA.) b14:  And (tropical:)  Fine, thin, or delicate, (S, O,) or soft, (M, Msb, K,) garments, or cloths, of linen: (S, M, O, Msb, K:) a single one thereof is called ↓ قَصَبِىٌّ. (M, O, Msb, K.) One says, مَعَ فُلَانٍ قَصَبُ صَنْعَآءَ وَقَصَبُ مِصْرَ (tropical:)  [In the possession of such a one are]
                قَصَب [meaning the cylindrical, or oblong, hollow pieces] of carnelian [of San'à], and قَصَب [meaning the fine, or soft, garments, or cloths,] of linen [of Egypt]. (A.) b15:  Also (tropical:)  The channels by which water flows from the springs, or sources: (S, M, A, O, K:) or the channels by which the water of a well flows from the springs, or sources: (As, T, TA:) n. un. ↓ قَصَبَةٌ. (M.) And قَصَبُ البَطْحَآءِ (assumed tropical:)  The waters [of the kind of water-course  called بطحآء (q. v.)] that run to the springs, or sources, of the wells. (As, S, O.) Aboo-Dhueyb says, أَقَامَتْ بِهِ فَابْتَنَتْ خَيْمَةً
                عَلَى قَصَبٍ وَفُرَاتٍ نَهَرْ (As, S, M, O,) meaning She remained [in it, and constructed for herself a booth, or a tent,] amid  wells and sweet water that flowed copiously. (As, S, O.) b16:  See also قَصَبَةٌ below, in the next paragraph.
                A2:  القَصَبُ is also a name for The ewe. (O.) b2:  And قَصَبْ قَصَبْ is A call to the ewe (O, K) to be milked. (O.) قَصَبَةٌ: see the next preceding paragraph, in nine places. b2:  [It also, app., signifies The caneroll of a loom: see نِيرٌ. b3:  And, app., (assumed tropical:)  The mouth, which has the form of a short cylinder, in the middle of the upper part, of the kind of leathern water-bag called مَزَادَة: see خُرْتَةٌ.] b4: (tropical:)  The bone of the nose; قَصَبَةُ الأَنْفِ signifying the nasal bone. (S, A.) b5:  [And (assumed tropical:)  The shaft of a well.] You say بِئْرٌ مُسْتَقِيمَةُ القَصَبَةِ (assumed tropical:)  [A well of which the shaft is straight]. (TA.) b6:  and (tropical:)  A well recently dug. (M, K, TA.) b7:  and (tropical:)  The interior part of a country or town; (A;) and of a قَصْر [i. e. pavilion, or palace]; (M, A, K;) and of a fortress; (A:) or of a fortress containing a building or buildings; or the middle of such a fortress, (TA,) and of a town or village: (S, L, Msb, TA: [Golius, reading قِرْيَة قَرْيَة, assigns to it also the signification of the “ middle of a water-skin: ”]) or a قَصْر [i. e. pavilion, or palace,] itself; (M, K;) and [a fortress itself, or] a fortified castle such as is occupied by a commander and his forces: (TA in art. خوج:) and a town or village [itself]: (M, K:) and the حَرِيم [as meaning interior, or middle,] of a house. (T and TA in art. حرم.) Also A city: (K:) or the [chief] city (S, M, Msb) of the Sawád, (S,) or, [by a general application,] of a country: (M, Msb:) or the chief, or main, part (M, K) of a city (M) or of cities. (K: but in the TA this last meaning is given as the explanation of الأَمْصَارِ ↓ قَصَبُ.) b8:  See also قَصِيبَةٌ, in two places: b9:  and see قِصَابٌ.
                أَرْضٌ قَصِبَةٌ: see قَصَبٌ, first quarter.
                قَصْبَآءُ: see قَصَبٌ, first quarter, in four places.
                قَصْبَاةٌ or قَصَبَاةٌ: see قَصَبٌ, first sentence.
                قَصْبَآءَةٌ: see قَصَبٌ, first sentence, in two places.
                قَصَبِىٌّ: see قَصَبٌ, last quarter.
                قِصَابٌ, (so in the K, there said to be like كِتَابٌ,) or ↓ قِصَابَةٌ, (so in the M and L,) A dam that is constructed in the place that has been eaten away by water, [for لَجْف in the CK, and لِحْف in other copies of the K, (in the place of which I find لُهْج in a copy of the M, app. a mistranscription,) I read, and thus render لَجَف, supposing it to mean such a place in the side of a rivulet for irrigation,] lest the torrent should collect itself together from every place, and consequently the border of the rivulet for irrigation of the garden of palm-trees [thus I render عِرَاقُ الحَائِطِ (see art. عرق)] should become demolished. (M, K.) b2:  And قِصَابٌ signifies دِبَارٌ: (so accord. to a copy of the M:) or دِيَارٌ: (so in copies of the K:) [the former I think to be the preferable reading; but its meaning is doubtful: accord. to the K it signifies Small channels for irrigation between tracts of seed-produce; and ISd says the like: accord. to AHn, patches of sown ground: see more voce دَبْرٌ: it is a pl.,] and the sing. is ↓ قَصَبَةٌ. (M, K.) قَصُوبٌ A sheep or goat that one shears. (O, K.) قَصِيبٌ, applied to a he-camel, (M, TA,) and likewise to a she-camel, (TA, [but this I think doubtful, as it has the meaning of an act. (not pass.) part. n.,]) That sucks up, or sucks in, the water. (M, TA.) b2:  See also قَاصِبٌ.
                قِصَابَةٌ The art of playing upon the musical reed, or pipe. (S, O.) b2:  [And] The craft, or occupation, of the butcher. (M, Msb.) A2: See also قِصَابٌ.
                قَصِيبَةٌ: see قُصَّابَةٌ. b2:  Also, and ↓ قُصَّابَةٌ, (S, M, O, K,) and ↓ قَصَبَةٌ, (Lth, M, K,) and ↓ تَقْصِيبَةٌ, (M, O, K,) and ↓ تَقْصِبَةٌ, (M, K,) (tropical:)  A lock of hair having a [spiral] twisted form [so as to be like a hollow cane]: (Lth, M, K:) or a pendent lock of hair that is twisted so as to curl [in a spiral form]; not plaited: (S, O:) or قَصِيبَةٌ signifies a lock of hair that curls naturally so as to be like a hollow cane; (A;) and its pl. is قَصَائِبٌ: (S, A:) [and,] accord. to Lth, such is termed ↓ قَصَبَةٌ (TA) [and app. ↓ قُصَّابَةٌ also]: and ↓ تَقْصِيبَةٌ, (Lth, A, TA,) of which the pl. is تَقَاصِيبُ, (Lth, A, O, TA,) signifies such as is twisted and made to curl by a woman; (Lth, * A, TA;) [and so, app., ↓ تَقْصِبَةٌ;] i. e., such as, being [naturally] lank, is curled by means of canes and thread. (A.) قَصَّابٌ A blower in reeds or canes (نَافِخٌ فِى
                القَصَبِ); as also ↓ قَاصِبٌ. (M, K. [In the former, this explanation is given in such a manner as plainly shows that it is meant to be understood as being distinct from that which next follows: but I incline to think that the two explanations are taken from different sources and have one and the same application.]) And (M, K) A player on the musical reed, or pipe; (AA, S, M, O, K;) and so ↓ قَاصِبٌ. (S, O.) Ru-beh  says, (S, M, O, TA,) describing an ass, (S, O, TA,) braying, (TA,) فِى جَوْفِهِ وَحْىٌ كَوَحْىِ القَصَّابْ [In his chest is, or was, a sound like the sound of the player on the musical reed]. (S, M, O, TA.) b2:  and A butcher; (S, M, O, Msb, K;) as also ↓ قَاصِبٌ: (M, K:) so called from قَصَبَ in the first of the senses expl. in this art.; (M, O, Msb, TA;) or because he takes the sheep or goat by its قَصَبَة, i. e. its shank-bone; (M, TA;) or because he cleanses the أَفْصَاب, or guts, of the belly; or from قَصَّبَهُ signifying as expl. in the last sentence of the second paragraph of this article. (O, TA.) قُصَّابٌ: see قُصَّابَهٌ, in two places.
                قَصَّابَةٌ (O, K, accord. to my MS. copy of the K قُصَّابَةٌ [which is wrong]) لِلنَّاسِ (O) (tropical:)  One who reviles men, vilifies them, or defames them, much: (O, K:) [or, very much; for] the ة is added to render the epithet [doubly] intensive. (O.) [See 1, third sentence.]
                قُصَّابَةٌ, (S, O, and so accord. to my MS copy of the K, accord. to other copies of the K قَصَّابَةٌ [which is wrong,]) with damm and teshdeed, (S,) An internodial portion of a reed or cane; such a portion thereof as intervenes between two joints, or knots; syn. أَنْبُوبَةٌ; (S, O, K;) [a n. un. of the coll. gen. n. ↓ قُصَّابٌ;] and ↓ قَصِيبَةٌ, (O, K,) of which the pl. is قَصَائِبُ, (TA,) signifies the same. (O, K.) b2:  And A musical reed, or pipe; syn. مِزْمَارٌ: (S, M, K:) pl. [or rather coll. gen. n.] ↓ قُصَّابٌ. (S, M, O.) See an ex. of the latter in a verse of El-Aashà (accord. to one relation thereof) cited voce قُصْبٌ. (S, M, O.) b3:  See also قَصِيبَةٌ, in two places.
                قَاصبٌ, applied to a he-camel and a she-camel, (ISk, S, M, O, K,) Abstaining from drinking before having satisfied thirst: (ISk, S, O:) or abstaining from drinking the water, and raising the head from it; (M, K;) and so ↓ قَصيبٌ, likewise applied to the he-camel and the she-camel: (K: [but this latter I think doubtful:]) or a camel (بَعِيرٌ) refusing to drink: (As, TA:) and ↓ مُقْتَصِبَةٌ is also said to be applied to a she-camel. (TA.) A2:  And A raiser, or grower, of قَصَب [i. e. reeds, or canes]. (Mgh.) b2:  See also قَصَّابٌ, in two places. b3:  Also (assumed tropical:)  Sounding  thunder: (M:) and a cloud in which is thunder and lightning: (As, TA:) or, accord. to As, a cloud in which is thunder; (O;) [and] so says Az; (TA;) likened to a player on a musical reed, or pipe. (O, TA.) b4:  And دِرَّةٌ قَاصِبَةٌ (assumed tropical:)  A stream of milk coming forth easily (M, O) from the teat of the udder (O) as though it were a rod of silver. (M, O.) b5:  See, again, قَصَّابٌ, last sentence.
                تَقْصِبَةٌ and تَقْصِيبَةٌ: see قَصِيبَةٌ; each in two places.
                مَقْصَبَةٌ: see قَصَبٌ, first quarter.
                مُقَصَّبٌ (tropical:)  Hair curled in the manner expl. above, voce قَصِيبَةٌ. (S, A, O.) b2:  And (assumed tropical:)  A garment, or piece of cloth, folded. (Msb.) مُقَصِّبٌ (tropical:)  One who wins, or acquires, the canes of the contest for victory (in racing يُحْرِزُ قَصَبَ السِّبَاقِ, A, O, K, TA, in the CK قَصَبَاتِ السِّباقِ) [i. e. in horse-racing]: and (tropical:)  a fleet horse, that outstrips others. (A.) b2:  And (assumed tropical:)  Milk upon which the froth is thick. (O, K.) مِقْصَابٌ may mean A place abounding with قَصَب [i. e. reeds, or canes]; like as مِعْشَابٌ means“ a place abounding with [herbage of the kind termed] عُشْب. ” (Ham p. 490.) مُقْتَصِبَهٌ: see قَاصِبٌ.
