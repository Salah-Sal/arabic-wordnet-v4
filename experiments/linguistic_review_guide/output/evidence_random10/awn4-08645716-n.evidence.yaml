            definitions_text: |-
              ق ص ب : قَصَبْتُ الشَّاةَ قَصْبًا مِنْ بَابِ ضَرَبَ قَطَعْتُهَا عُضْوًا عُضْوًا وَالْفَاعِلُ قَصَّابٌ وَالْقِصَابَةُ الصِّنَاعَةُ بِالْكَسْرِ وَالْقَصَبُ كُلُّ نَبَاتٍ يَكُونُ سَاقُهُ أَنَابِيبَ وَكُعُوبًا قَالَهُ فِي مُخْتَصَرِ الْعَيْنِ الْوَاحِدَةُ قَصَبَةٌ وَالْمَقْصَبَةُ بِفَتْحِ الْمِيمِ وَالصَّادِ مَوْضِعُ نَبْتِ الْقَصَبِ.
              وَقَصَبُ السُّكَّرِ مَعْرُوفٌ وَالْقَصَبُ الْفَارِسِيُّ مِنْهُ صُلْبٌ غَلِيظٌ يُعْمَلُ مِنْهُ الْمَزَامِيرُ وَيُسَقَّفُ بِهِ الْبُيُوتُ وَمِنْهُ مَا يُتَّخَذُ مِنْهُ الْأَقْلَامُ وَقَصَبُ الذَّرِيرَةِ مِنْهُ مَا يَكُونُ مُتَقَارِبَ الْعُقَدِ يَتَكَسَّرُ شَظَايَا كَثِيرَةً وَأَنَابِيبُهُ مَمْلُوءَةٌ مِنْ شَيْءٍ كَنَسْجِ الْعَنْكَبُوتِ وَفِي مَضْغِهِ وَالْحَرَافَةُ عِطْرٌ إلَى الصُّفْرَةِ وَالْبَيَاضِ.
              وَالْقَصَبُ عِظَامُ الْيَدَيْنِ وَالرِّجْلَيْنِ وَنَحْوِهِمَا وَالْقَصَبُ ثِيَابٌ مِنْ كَتَّانٍ نَاعِمَةٌ وَاحِدُهَا قَصَبِيٌّ عَلَى النِّسْبَةِ وَثَوْبٌ مُقَصَّبٌ مَطْوِيٌّ.
              وَقَصَبَةُ الْبِلَادِ مَدِينَتُهَا وَقَصَبَةُ الْقَرْيَةِ وَسَطُهَا وَقَصَبَةُ الْإِصْبَعِ أُنْمُلَتُهَا وَقَصَبَةُ الرِّئَةِ عُرُوقُهَا الَّتِي هِيَ مَجْرَى النَّفَسِ وَقَوْلُهُمْ أَحْرَزَ قَصَبَ السَّبْقِ أَصْلُهُ أَنَّهُمْ كَانُوا يَنْصِبُونَ فِي حَلْبَةِ السِّبَاقِ قَصَبَةً فَمَنْ سَبَقَ اقْتَلَعَهَا وَأَخَذَهَا لِيُعْلَمَ أَنَّهُ السَّابِقُ مِنْ غَيْرِ نِزَاعٍ ثُمَّ كَثُرَ حَتَّى أُطْلِقَ عَلَى الْمُبَرِّزِ وَالْمُشَمِّرِ.
