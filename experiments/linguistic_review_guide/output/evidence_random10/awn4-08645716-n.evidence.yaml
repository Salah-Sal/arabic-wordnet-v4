              القَصَبَاتُ:
              بالفتح، جمع قصبة، وقصبة القرية والقصر: وسطه، وقصبة الكورة: مدينتها العظمى، والقصبات: مدينة بالمغرب من بلاد البربر، والقصبات من قرى اليمامة لم تدخل في صلح خالد أيام مسيلمة.
