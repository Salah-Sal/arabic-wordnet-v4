            definitions_text: 'ق ص ب: (الْقَصَبُ) مَعْرُوفٌ. وَ (الْقَصْبَاءُ) كَالْحَمْرَاءِ مِثْلُهُ وَالْوَاحِدَةُ (قَصَبَةٌ)
              . قَالَ سِيبَوَيْهِ: (الْقَصْبَاءُ) وَالْحَلْفَاءُ وَالطَّرْفَاءُ وَاحِدٌ وَجَمْعٌ. وَ (الْقَصَبُ) أَيْضًا أَنَابِيبُ
              مِنْ جَوْهَرٍ وَفِي الْحَدِيثِ: «بَشِّرْ خَدِيجَةَ بِبَيْتٍ فِي الْجَنَّةِ مِنْ قَصَبٍ» . وَ (قَصَبَةُ) الْأَنْفِ
              عَظْمُهُ. وَقَصَبَةُ الْقَرْيَةِ وَسَطُهَا. وَقَصَبَةُ السَّوَادِ مَدِينَتُهَا. وَ (الْقَصْبُ) الْقَطْعُ وَبَابُهُ
              ضَرَبَ وَمِنْهُ (الْقَصَّابُ) .'
