            definitions_text: '(ق ص ب) : (الْقَصَبُ) كُلُّ نَبَاتٍ كَانَ سَاقُهُ أَنَابِيبَ وَكُعُوبًا وَالْوَاحِدَةُ قَصَبَةٌ
              وَالْقَصْبَاءُ وَاحِدٌ وَجَمْعٌ عَنْ سِيبَوَيْهِ وَقِيلَ هِيَ (الْقَصَبُ) الْكَثِيرُ النَّابِت فِي الْغَيْضَةِ
              (وَمِنْهَا) وَلَوْ اشْتَرَى أَجَمَةً وَفِيهَا قَصْبَاءُ (وَالْمَقْصَبَةُ) مَنْبِتُهُ وَمَوْضِعُهُ (وَقَوْلُهُ)
              وَإِذَا اتَّخَذَ الْأَرْضَ مَقْصَبَةً فَالْخَرَاجُ عَلَى الْقَاصِبِ أَيْ عَلَى الْمُسْتَنْبِتِ وَهُوَ مِنْ بَابِ
              لَابْن وَقَامِر وَأَنْوَاعُ الْقَصَبِ الْفَارِسِيُّ وَهُوَ مَا يُتَّخَذُ مِنْ أَنَابِيبِهِ الْأَقْلَامُ (وَمِنْهَا)
              قَصَبُ السُّكَّرِ وَهُوَ أَسْوَدُ وَأَبْيَضُ وَأَصْفَرُ وَإِنَّمَا يُعْتَصَرُ النَّوْعَانِ دُونَ الْأَسْوَدِ
              وَيُقَالُ لِتِلْكَ الْعُصَارَةِ عَسَل الْقَصَبِ (وَقَصَبُ الذَّرِيرَةِ) ضَرْبٌ مِنْهُ مُتَقَارِبُ الْعُقَدِ
              يَتَكَسَّرُ شَظَايَا كَثِيرَة وَأُنْبُوبهُ مَمْلُوءٌ مِنْ مَثَلِ نَسْجِ الْعَنْكَبُوتِ وَفِي مَضْغِهِ حَرَافَةٌ
              وَمَسْحُوقُهُ عِطْرٌ إلَى الصُّفْرَة وَالْبَيَاضِ (وَالْقُصْبُ) بِالضَّمِّ الْمِعَى وَالْجَمْعُ أَقْصَابٌ (وَمِنْهُ)
              (الْقَصَّابُ) لِأَنَّهُ يُعَالِجُ الْأَقْصَابَ أَيْ الْأَمْعَاءَ.'
