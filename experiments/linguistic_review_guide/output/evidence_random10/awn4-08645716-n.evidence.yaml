            definitions:
            - sense_index: 0
              text: "قصب: القَصَبُ: كلُّ نَباتٍ ذي أَنابيبَ، واحدتُها قَصَبةٌ؛ وكلُّ نباتٍ كان ساقُه أَنابيبَ وكُعوباً، فهو\
                \ قَصَبٌ. والقَصَبُ: الأَباء.\nوالقَصْباءُ: جماعةُ القَصَب، واحدتُها قَصَبة وقَصباءةٌ. قال سيبويه: الطَّرْفاءُ،\
                \ والـحَلْفاءُ، والقَصْباءُ، ونحوها اسم واحدٌ يقع على جميع، وفيه علامةُ التأْنيث، وواحدُه على بنائه ولفظه،\
                \ وفيه علامة التأْنيث التي فيه، وذلك قولك للجميع حَلْفاء، وللواحدة حَلْفاء، لَـمَّا كانت تقع للجميع، ولم تكن\
                \ اسماً مُكَسَّراً عليه الواحدُ؛ أَرادوا أَن يكون الواحدُ من بناءٍ فيه علامةُ التأْنيث، كما كان ذلك في الأَكثر\
                \ الذي ليس فيه علامة التأْنيث، ويقع مذكراً نحو التمر والبُسْر والبُرّ والشَّعيرِ، وأَشباه ذلك؛ ولم يُجاوِزوا\
                \ البناء الذي يقع للجميع حيثُ أَرادوا واحداً، فيه علامة تأْنيث لأَنه فيه علامة التأْنيث، فاكتفوا بذلك، وبَيَّنُوا\
                \ الواحدة\nبِأَن وصفوها بواحدة، ولم يَجِـيئُوا بعَلامة سوى العلامة التي في الجمع، ليُفْرَقَ بين هذا وبين الاسم،\
                \ الذي يقع للجميع، وليس فيه علامة التأْنيث نحو التمر والبُسْر.\nوتقول: أَرْطى وأَرْطاةٌ، وعَلْقَى وعَلْقاة،\
                \ لأَن الأَلِفات لم تُلْحَقْ للتأْنيث، فَمِن ثم دخلت الهاء؛ وسنذكر ذلك في ترجمة حلف، إِن شاء اللّه تعالى.\n\
                والقَصْباءُ: هو القَصَبُ النابت، الكثير في مَقْصَبته. ابن سيده:\nالقَصْباءُ مَنْبِتُ القَصَب. وقد أَقصَبَ\
                \ المكانُ، وأَرض مُقْصِـبة\nوقَصِـبةٌ: ذاتُ قَصَبٍ.\n وقَصَّبَ الزرعُ تَقْصيباً، وأَقْصَبَ: صار له قَصَبٌ،\
                \ وذلك بعد التَّفْريخ.\nوالقَصَبة: كلُّ عظمٍ ذي مُخٍّ، على التشبيه بالقَصَبة، والجمع قَصَبٌ.\nوالقَصَبُ: كل\
                \ عظمٍ مستدير أَجْوَفَ، وكلُّ ما اتُّخِذَ من فضة أَو\nغيرها، الواحدة قَصَبةٌ. والقَصَبُ: عظام الأَصابع من\
                \ اليدين والرجلين؛ وقيل: هي ما بين كل مَفْصِلَيْن من الأَصابع، وفي صفته، صلى اللّه عليه وسلم: سَبْطُ القَصَب.\
                \ القَصَبُ من العظام: كلُّ عظم أَجوفَ فيه مُخٌّ، واحدتُه قَصَبة، وكلُّ عظمٍ عَريضٍ لَوْحٌ. والقَصْبُ: القَطْع.\
                \ وقَصَبَ الجزارُ الشاةَ يَقْصِـبُها قَصْباً: فَصَل قَصَبَها، وقطعها عُضْواً عُضْواً.\nودِرَّة قاصبة إِذا\
                \ خرجت سَهْلة كأَنها قضِـيبُ فِضَّةٍ. وقَصَبَ الشيءَ يَقْصِـبُه قَصْباً، واقْتَصَبَه: قطَعه. والقاصِبُ والقَصَّابُ:\n\
                الجَزَّارُ وحِرْفَته القِصَابةُ. فإِما أَن يكون من القَطْع، وإِما أَن يكون من أَنه يأْخذ الشاةَ بقَصَبَتِها\
                \ أَي بساقِها؛ وسُمِّي القَصَّابُ\nقَصَّاباً لتَنْقيته أَقْصابَ البَطْن. وفي حديث علي، كرّم اللّه وجهه: لئن\
                \ وَلِـيتُ بني أُمَيَّةَ، لأَنْفُضَنَّهم نَفْضَ القَصَّابِ التِّرابَ\nالوَذِمةَ؛ يريدُ اللُّحومَ التي تَعَفَّرَتْ\
                \ بسقوطها في التُّراب؛ وقيل: أَراد بالقصَّاب السَّبُعَ. والتِّراب: أَصلُ ذراع الشاةِ، وقد تقدم ذلك في فصل\
                \ التاءِ مبسوطاً.\nابن شميل: أَخَذ الرجُل الرجلَ فقَصَّبه؛ والتَّقْصِـيبُ أَن يَشُدَّ\nيديه إِلى عُنُقه، ومنه\
                \ سُمي القَصَّابُ قَصَّاباً. والقاصِبُ: الزامِرُ.\nوالقُصَّابة: المِزْمارُ(1) \n(1 قوله «والقصابة المزمار\
                \ إلخ» أي بضم القاف وتشديد الصاد كما صرح به الجوهري وإن وقع في القاموس إطلاق الضبط المقتضي الفتح على قاعدته\
                \ وسكت عليه الشارح.) والجمع قُصَّابٌ؛ قال الأَعشى:\nوشاهِدُنا الجُلُّ والياسَمِـيـ *  ـنُ والـمُسْمِعاتُ بقُصَّابِها\n\
                وقال الأَصمعي: أَراد الأَعشى بالقُصَّاب الأَوْتارَ التي سُوِّيَتْ مِنَ الأَمْعاءِ؛ وقال أَبو عمرو: هي المزامير،\
                \ والقاصِبُ والقَصَّاب النافخُ في القَصَب؛ قال:\nوقاصِـبُونَ لنا فيها وسُمَّارُ \nوالقَصَّابُ، بالفتح: الزَّمَّارُ؛\
                \ وقال رؤبة يصف الحمار:\nفي جَوْفِه وَحْيٌ كوَحْيِ القَصَّاب\nيعني عَيراً يَنْهَقُ. والصنعة القِصابةُ والقُصَّابة\
                \ والقَصْبة والقَصِـيبة والتَّقْصِـيبة والتَّقْصِـبةُ: الخُصْلة الـمُلْتَوِيةُ من الشَّعَر؛ وقد قَصَّبه؛ قال\
                \ بشر بن أَبي خازم:\nرَأَى دُرَّةً بَيْضاءَ يَحْفِلُ لَوْنَها *  سُخامٌ، كغِرْبانِ البريرِ، مُقَصَّبُ\nوالقَصائبُ:\
                \ الذَّوائبُ الـمُقَصَّبةُ، تُلْوى لَيّاً حتى تَتَرَجَّلَ، ولا تُضْفَرُ ضَفْراً؛ وهي الأُنْبوبة أَيضاً. وشَعْر\
                \ مُقَصَّبٌ أَي مُجَعَّدٌ. وقَصَّبَ شَعره أَي جَعَّدَه. ولها قُصَّابَتانِ أَي غَديرتانِ؛ وقال الليث: القَصْبة\
                \ خُصْلة من الشعر تَلْتَوي، فإِنْ أَنتَ قَصَّبْتَها\nكانت تَقْصِـيبة، والجمع التَّقاصِـيبُ؛ وتَقْصِـيبُك إِيّاها\
                \ لَيُّك\nالخُصلة إِلى أَسْفلها، تَضُمُّها وتَشُدُّها، فتُصْبِـحُ وقد صارت\nتَقاصِـيبَ، كأَنها بلابِلُ جاريةٍ.\
                \ أَبو زيد: القَصائبُ الشَّعَر الـمُقَصَّبُ، واحدتُها قَصِـيبة. والقَصَبُ: مَجاري الماءِ من العيون، واحدتُها\
                \ قَصَبة؛ قال أَبو ذؤيب:\nأَقامتْ به، فابْتَنَتْ خَيْمةً *  على قَصَبٍ وفُراتٍ نَهَرْ\nوقال الأَصمعي: قَصَبُ\
                \ البَطْحاءِ مِـياهٌ تجري إِلى عُيونِ الرَّكايا؛\nيقول: أَقامتْ بين قَصَبٍ أَي رَكايا وماءٍ عَذْبٍ. وكل ماءٍ\
                \ عذبٍ:\nفراتٌ؛ وكلُّ كثيرٍ جَرى فقد نَهَرَ واسْتَنْهَرَ.\nوالقَصَبةُ: البئر الحديثةُ الـحَفْرِ.\nالتهذيب،\
                \ الأَصمعي: القَصَبُ مَجاري ماءِ البئر من العيون. والقَصَبُ: شُعَبُ الـحَلْق. والقَصَبُ: عُروق الرِّئَة، وهي\
                \ مَخارِجُ الأَنْفاس ومجاريها.\nوقَصَبةُ الأَنْفِ: عَظْمُه. والقُصْبُ: الـمِعَى، والجمع أَقْصابٌ. الجوهري:\
                \ القُصْبُ، بالضم: الـمِعَى. وفي الحديث: أَنَّ عَمْرو ابنَ لُـحَيٍّ أَوَّلُ من بَدَّل دينَ إِسمعيل، عليه السلام؛\
                \ قال النبي، صلى اللّه عليه وسلم: فرأَيتُه يَجُرُّ قُصْبَه في النار؛ قيل: القُصْبُ اسم للأَمْعاءِ كُلِّها؛\
                \ وقيل: هو ما كان أَسْفَلَ البَطْن من الأَمْعاءِ؛ ومنه الحديثُ: الذي يَتَخَطَّى رِقابَ الناسِ يومَ الجمعة،\
                \ كالجارِّ قُصْبَهُ في النار؛ وقال الراعي: \nتَكْسُو الـمَفارِقَ واللَّبَّاتِ ذَا أَرَجٍ، *  من قُصْبِ مُعْتَلِفِ\
                \ الكافورِ دَرَّاجِ\nقال: وأَما قول امرئِ القيس:\nوالقُصْبُ مُضْطَمِرٌ والـمَتْنُ مَلْحوبُ\nفيريد به الخَصْرَ،\
                \ وهو على الاستعارة، والجمع أَقْصابٌ؛ وأَنشد بيتَ الأَعشى:\nوالـمُسْمِعاتُ بأَقْصابِها \nوقال: أَي بأَوتارها،\
                \ وهي تُتَّخَذُ من الأَمْعاءِ؛ قال ابن بري: زعم\nالجوهري أَنَّ قول الشاعر:\nوالقُصْبُ مُضْطَمِرٌ والمتنُ مَلْحوبُ\n\
                لامرئِ القيس؛ قال: والبيت لإِبراهيم بن عمران الأَنصاري؛ وهو بكماله:\nوالماءُ مُنْهَمِرٌ، والشَّدُّ مُنْحَدِرٌ،\
                \ *  والقُصْبُ مُضْطَمِرٌ، والـمَتْنُ مَلْحوبُ\nوقبله:\nقد أَشْهَدُ الغارةَ الشَّعواءَ، تَحْمِلُني *  جَرْداءُ\
                \ مَعْروقَةُ اللَّحْيَـيْن، سُرْحُوبُ\nإِذا تَبَصَّرَها الرَّاؤُونَ مُقْبِلةً، *  لاحَتْ لَـهُمْ، غُرَّةٌ،\
                \ منْها، وتَجْبِـيبُ\nرَقاقُها ضَرِمٌ، وجَرْيُها خَذِمٌ، *  ولَـحْمها زِيَمٌ، والبَطْنُ مَقْبُوبُ\nوالعَينُ\
                \ قادِحَةٌ، واليَدُّ سابِحَةٌ، *  والرِّجْلُ ضارِحةٌ، واللَّوْنُ غِرْبيبُ\nوالقَصَبُ من الجَوْهر: ما كان مُسْتَطِـيلاً\
                \ أَجْوَفَ؛ وقيل: القَصَبُ\nأَنابِـيبُ من جَوْهَرٍ. وفي الحديث: أَنَّ جبريلَ، عليه السلام، قال\nللنبي، صلى\
                \ اللّه عليه وسلم: بَشِّرْ خديجةَ ببيتٍ في الجنة من قَصَبٍ، لا صَخَب فيه ولا نَصَب؛ ابن الأَثير: القَصَبُ\
                \ في هذا الحديث لُؤْلُؤٌ مُجَوَّف واسعٌ، كالقَصْرِ الـمُنيف. والقَصَبُ من الجوهر: ما اسْتطالَ منه في تَجْويف.\
                \ وسأَل أَبو العباس ابنَ الأَعرابي عن تفسيره؛ فقال: القَصَبُ، ههنا: الدُّرُّ الرَّطْبُ، والزَّبَرْجَدُ الرَّطْبُ\
                \ الـمُرَصَّعُ بالياقوت؛ قال: والبَيتُ ههنا بمعنى القَصْر والدار، كقولك بيت الـمَلِك أَي قَصْرُه. والقَصَبةُ:\
                \ جَوْفُ القَصْرِ؛ وقيل: القَصْرُ. وقَصَبةُ البَلد: مَدينَتُه؛ وقيل: مُعْظَمُه. وقَصَبة السَّوادِ: مَدينتُها.\
                \ والقَصَبَةُ: جَوْفُ الـحِصْن، يُبْنى فيه بناءٌ، هو أَوسَطُه. وقَصَبةُ البلاد: \nمَدينَتُها. والقَصَبة: القَرية.\
                \ وقَصَبةُ القَرية: وسَطُها.\nوالقَصَبُ: ثيابٌ، تُتَّخَذ من كَتَّان، رِقاقٌ ناعمةٌ، واحدُها قَصَبـيٌّ، مثل\
                \ عَربيٍّ وعَرَبٍ. وقَصَبَ البعيرُ الماءَ يَقْصِـبُه قَصْباً: مَصَّه.\nوبعير قَصِـيبٌ، يَقصِبُ الماءَ، وقاصِبٌ:\
                \ ممتنع من شُرْب الماءِ، رافعٌ رأْسه عنه؛ وكذلك الأُنثى، بغير هاء. وقد قَصَبَ يَقْصِبُ قَصْباً وقُصُوباً،\
                \ وقَصَبَ شُرْبَه إِذا امتنع منه قبل أَن يَرْوَى. الأَصمعي: قَصَبَ البعيرُ، فهو قاصِبٌ إِذا أَبى أَن يَشْرَب.\
                \ والقومُ مُقْصِـبُونَ إِذا لم تَشْرَب إِبِلُهم.\nوأَقْصَبَ الراعي: عافَتْ إِبلُه الماءَ. وفي المثل: رَعَى\
                \ فأَقْصَبَ،\nيُضْرَب للراعي، لأَنه إِذا أَساءَ رَعْيَها لم تَشْرَبِ الماءَ، لأَنها\nإِنما تَشْرَبُ إِذا شَبِعَتْ\
                \ من الكَلإِ. ودَخَلَ رُؤْبة على سليمان بن\nعلي، وهو والي البصرة؛ فقال: أَين أَنْتَ من النساءِ؟ فقال: أُطِـيلُ\
                \ الظِّمْءَ، ثم أَرِدُ فأُقْصِبُ.\nوقيل: القُصُوبُ الرِّيُّ من وُرود الماءِ وغيره. وقَصَبَ الإِنسانَ\nوالدَّابةَ\
                \ والبعيرَ يَقْصِـبُهُ قَصْباً: منعه شُرْبَه، وقَطَعه عليه، قبل\nأَن يَرْوَى. وبعيرٌ قاصِبٌ، وناقة قاصِبٌ\
                \ أَيضاً؛ عن ابن السكيت.\nوأَقْصَبَ الرجلُ إِذا فَعَلَت إِبلُه ذلك.\nوقَصَبَه يَقْصِـبُه قَصْباً، وقَصَّبه:\
                \ شَتَمَه وعابه، ووَقعَ فيه.\nوأَقْصَبَهُ عِرْضَه: أَلْحَمَه إِياه؛ قال الكميت:\nوكنتُ لهم، من هؤلاكَ وهؤُلا،\
                \ *  مُحِـبّاً، على أَنـِّي أُذَمُّ وأُقْصَبُ\nورجلٌ قَصّابَةٌ للناس إِذا كان يَقَعُ فيهم. وفي حديث عبدالملك،\
                \ قال لعروة بن الزبير: هل سمعتَ أَخاكَ يَقْصِبُ نساءَنا؟ قال: لا.\nوالقِصابةُ: مُسَنَّاة تُبْنى في اللَّهْج\
                \ (1)\n(1 قوله «تبنى في اللهج» كذا في المحكم أيضاً مضبوطاً ولم نجد له معنى يناسب هنا. وفي القاموس تبنى في\
                \ اللحف أي بالحاء المهملة. قال شارحه وفي بعض الامهات في اللهج اهـ. ولم نجد له معنى يناسب هنا أيضاً والذي يزيل\
                \ الوقفة ان شاء اللّه ان الصواب تبنى في اللجف بالجيم محركاً وهو محبس الماء وحفر في جانب البئر. وقوله والقصاب\
                \ الدبار إلخ بالباء الموحدة كما في المحكم جمع دبرة كتمرة. ووقع في القاموس الديار بالمثناة من تحت ولعله محرف\
                \ عن الموحدة.) ، كراهيةَ أَن يَسْتَجْمِـعَ السيلُ فيُوبَلَ الحائطُ أَي يَذْهَبَ به الوَبْلُ، ويَنْهَدِمَ عِراقُه.\n\
                والقِصابُ: الدِّبارُ، واحِدَتُها قَصَبَة.\nوالقاصِبُ: الـمُصَوِّتُ من الرعد. الأَصمعي في باب السَّحاب الذي\
                \ فيه رَعْدٌ وبَرْقٌ: منه الـمُجَلْجِلُ، والقاصِبُ، والـمُدَوِّي،\nوالـمُرْتَجِسُ؛ الأَزهري: شَبَّه السَّحابَ\
                \ ذا الرعد بالقاصبِ أَي\nالزامر.ويقال للـمُراهِنِ إِذا سَبَقَ: أَحْرَزَ قَصَبَة السَّبْق. وفرس\nمُقَصِّبٌ:\
                \ سابقٌ؛ ومنه قوله:\nذِمارَ العَتِـيك بالجَوادِ الـمُقَصِّبِ\nوقيل للسابق: أَحْرَزَ القَصَبَ، لأَنَّ الغاية\
                \ التي يسبق إِليها، تُذْرَعُ بالقَصَبِ، وتُرْكَزُ تلكَ القَصَبَةُ عند مُنْتَهى الغاية، فَمَنْ سَبَقَ إِليها\
                \ حازها واسْتَحَقَّ الخَطَر. ويقال: حازَ قَصَبَ السَّبْق أَي اسْتَولى على الأَمَد. وفي حديث سعيد بن العاص:\
                \ أَنه سَبَقَ بين الخَيْل في الكوفة، فَجَعلها مائة قَصَبةٍ وجَعَل لأَخيرها قَصَبَةً أَلفَ درهم؛\nأَراد: أَنه\
                \ ذَرَع الغاية بالقَصَبِ، فجَعَلَها مائة قَصَبةٍ.\nوالقُصَيْبَة: اسم موضع؛ قال الشاعر:\nوهَلْ لِـيَ، إِنْ\
                \ أَحْبَبْتُ أَرضَ عَشِـيرتي *  وأَحْبَبْتُ طَرْفاءَ القُصَيْبة، من ذنْب؟"
