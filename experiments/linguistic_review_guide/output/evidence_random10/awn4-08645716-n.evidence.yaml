                [قصب] القَصَبُ: الأباء. والقَصْباء مثله، الواحدة قصبة. قال سيبويه: القصباء واحدٌ وجمع. قال: وكذلك الحلفاء والطَرفاء. والقَصَب: كلُّ عظمٍ مستديرٍ أجوف، وكذلك كلُّ ما اتُّخذَ من فضَّة وغيرها ، الواحدة قَصَبة. والقَصَب: مجاري الماء من العيون. قال أبو ذؤيب: أقامتْ به فابْتَنَتْ خيمةً * على قَصَبٍ وفراتٍ نَهَرْ وقال الأصمعيّ: قَصَبُ البطحاء: مياهٌ تجري إلى عيون الرَكايا. يقول: أقامت بين قَصَبٍ، أي ركايا، وماء عذب. وكل عذب فرات وكل كثير جرى فقد نهر واستنهر. والقصب: عروق الرئة، وهي مخارج النَفَس ومجاريه. والقَصَب: ثيابُ كتَّانٍ رِقاقٌ. والقَصَب: أنابيبُ من جوهرٍ. وفي الحديث: " بَشِّرْ خديجةَ ببيتٍ في الجنَّة من قَصَب ". وقَصَبَةُ الأنف: عظمه. وقَصَبَةُ القَريةَ: وسطها. وقَصَبَةُ السَواد: مدينتها. والقصب، بالضم: المعى. يقال: هو يجرُّ قُصْبَهُ. قال الراعي: تكسو المفارقَ واللَبَّاتِ ذا أرَجٍ * من قُصْبِ مُعْتَلِفِ الكافورِ درَّاجِ وأما قول امرئ القيس:
                والقصب مضْطَمِرٌ والمَتْنُ مَلْحوبُ * فيريد الخَصْرَ، وهو على الاستعارة، والجمع أقصاب. قال الأعشى: وشاهِدُنا الجُلُّ والياسَمي‍ * نُ والمُسْمِعاتُ بأقصابِها أي بأوتارها، وهي تُتَّخذ من الأمعاء. ويروى " بِقُصَّابِها "، وهي المزامير. وشَعَر مقصَّب، أي مجعَّد. وقد قصَّب الزرعُ تقصيباً ، وذلك بعد التفريخ. والقصائب: الذوائب المقصَّبة تُلوى لياً حتَّى تترجَّل، ولا تُضفر ضفراً، واحدتها قصيبة وقصابة، بالضم والتشديد. وهى الانبوبة أيضا، والمزمار، والجمع قُصَّاب . والقَصَّاب بالفتح: الزمار، عن أبى عمرو. قال رؤبة يصف الحمار:
                في جوفه وحى كوحى القصاب * وكذلك القاصب، والصنعة القصابة. والقَصْب: القطع. وقَصَب القَصَّاب الشاةَ قَصْباً، إذا قطَّعها عضواً عضواً. وقصَبْت البعيرَ وغيرَه، إذا قطعت عليه شربه قبل أن يَروى. وقَصَب البعير أيضاً شُرْبه، إذا امتنع منه قبل أن يَروى، فهو بعيرٌ قاصب، وناقةٌ قاصب أيضا، عن ابن السكيت. وأقصب الرجل، إذا فعلت إبله ذلك. وفى المثل: " رعى فأقصب "، يضرب للراعي، لانه إذا أساء رعيها لم تشرب الماء، لانها إنما تشرب إذا شبعت من الكلا. وقصبه، أي عابه. قال الكميت:
                على أنِّي أُذَمُّ وأقصب
