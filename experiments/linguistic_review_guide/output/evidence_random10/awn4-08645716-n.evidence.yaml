            definitions_text: |-
              قصب
              القَصَبُ: ثِيابٌ من كَتّانٍ رِقَاقٌ ناعِمَةٌ، الواحِدُ قَصَبِيٌ.
              وثَوْبٌ مُقَصّب: مَطْوِيٌ.
              وكُلّ نَبْتٍ كانَ ساقُه ذا أنابِيْبَ فهو قَصبٌ. وقَصبَ الزَّرْعُ تَقْصِيباً.
              والقَصَبُ: عِظَامُ اليَدَيْن والرِّجْلَيْنِ. وقَصبَاتُ الأشاجِع.
              والقَصَبَةُ: عَظْمُ الفَخِذِ. ووَسَطُ الحِصنِ وجوْفُه. وكُلُّ عَظْمٍ مستدير أجْوَفَ. والقَصْبَاءُ: هي القَصَبُ النابِتُ في المَقْصَبَة. والقَصَبَةُ: الخَشَبَةُ التي فيها مِحْوَرُ البَكْرَةِ.
              والقُصْبَة: خُصْلَةٌ من الشَعر تَلْتَوي، وإذا قَصَبْتَها كانَتْ تَقْصِيْبَةً، والجميع التَقاصِيْبُ.
              والقَصْبُ: الثَّلْبُ، فلانٌ يَقْصِبُ فلاناً ويَقْصُبُه: إذا مَزَّقَه. وهو القَطْعُ أيضاً، ومنه القَصّاب. وأنْ تُدْخِلَ إحدى عُرْوَتَي الجُوالِقِ في الأخْرى ثمَّ تثَنِّيْها مَرَةً أُخرى.
              والقُصْبُ: الأمْعَاءُ كلُّها، وجَمْعُها أقْصَابٌ.
              والقُصّابُ: الأوْتارُ، وكذلك الأقْصَابُ. وقيل: المَزامِيْرُ. والقَصّابُ: الزَّمّارُ.
              وإذا وَرَدَتِ الإِبلُ الماءَ فما امْتَنَعَ منها عن الشُّرْب فهو قاصِبٌ، قَصبَ يَقْصبُ. وأقْصَبَ الراعي: قَصبَتْ إبِلُه. ومن أمثالِهم في سُوْءِ الرَّعْي: " رَعى فأقْصَبَ ".
              والقِصَابُ: الدِّبَارُ، الواحدةُ قَصبَةٌ، وقَصَبَ أرْضَه. وهي البِئارُ أيضاً.
              والقَصْبُ: الماءُ الكثيرُ. والقَلِيْبُ. وإذا كَثفَتِ الرُّغْوَةُ على اللَبَنِ فهو مقَصِّبٌ.
              وقُصْبُ البَعِيرِ: ما يَمَسُّ منه الأرْضَ إذا بَرَكَ، والجميع القُصُوبُ.
              والقاصِبُ: السَّحَابُ المُرْتَجِسُ. وهذا رَجُلٌ لم يُقَصَّبْ: أي لم يُخْتَنْ.
              والتَّقْصِيْبُ: كَيٌّ على أخْدَعٍ أو نَسًى من قَطْع العِرْقِ.
              والقُصّابى: طائرٌ يَتَتَبَّعُ الشَّجَرَ كثيرُ الصِّيَاح.
              والمُقَصِّبُ: هو الذي يُحْرِزُ في السِّبَاقِ قَصَبَ السَّبْقِ.
              والنَّعْجَةُ تُسَمّى: القَصَبَ، وتُدْعى فيُقال: قَصَبْ قَصَبْ.
              وقَصيْبَةُ البِئْرِ: جِرَابُها. وقَصْبَاءَةُ الرِّيْش: مَنْبِتُه، كقَصْباءِ الأجَمَة.
