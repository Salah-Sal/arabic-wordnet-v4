            definitions_text: |-
              الْقَاف وَالصَّاد وَالْبَاء
              الْقصب: كل نَبَات ذِي انابيب، واحدتها: قَصَبَة.
              والقصباء: جمَاعَة الْقصب، واحدتها: قَصَبَة، وقصباءة.
              قَالَ سِيبَوَيْهٍ: الطرفاء والقصباء وَنَحْوهمَا، اسْم وَاحِد يَقع على جَمِيع. وفيع عَلامَة التَّأْنِيث، وواحده على بنائِهِ وَلَفظه، وَفِيه عَلامَة التَّأْنِيث الَّتِي فِيهِ، وَذَلِكَ قَوْلك للْجَمِيع: حلفاء، وللواحدة: حلفاء لما كَانَت تقع للْجَمِيع، وَلم تكن اسْما مكسَّرا عَلَيْهِ الْوَاحِد، أراوا أَن يكون الْوَاحِد من بِنَاء فِيهِ عَلامَة التانيث، كَمَا كَانَ ذَلِك فِي الْأَكْثَر الَّذِي لَيْسَ فِيهِ عَلامَة التَّأْنِيث وَيَقَع مذكرا، نَحْو التَّمْر وَالْبر وَالشعِير واشباه ذَلِك، وَلم يجاوزا الْبناء الَّذِي يَقع للْجَمِيع، حَيْثُ أَرَادوا وَاحِدًا فِيهِ عَلامَة تَأْنِيث، لِأَنَّهُ فِيهِ عَلامَة التَّأْنِيث، فاكتفوا بذلك، وبينوا الْوَاحِدَة بِأَن وصفوها بِوَاحِدَة، وَلم يجيئوا بعلامة سوى الْعَلامَة الَّتِي فِي الْجمع، ليفرق بَين هَذَا، وَبَين الِاسْم الَّذِي يَقع للْجَمِيع وَلَيْسَ فِيهِ عَلامَة التَّأْنِيث، نَحْو التَّمْر والبسر، وَتقول: أرطى وأرطاة، وعلقى وعلقاة، لِأَن الألفات لم تلْحق للتأنيث، فَمن ثمَّ دخلت الْهَاء. وَقد تقدم ذَلِك فِي حرف الْحَاء عِنْد ذكر الحلفاء.
              والقصباء: منبت الْقصب.
              وَقد اقصب الْمَكَان. وَأَرْض قَصَبَة، ومقصبة: ذَات قصب.
              وقصب الزَّرْع، وأقصب: صَار لَهُ قصب.
              والقصبة: كل عظم لَهُ مخ، على التَّشْبِيه بالقصبة. وَالْجمع: قصب.
              والقصب: عِظَام الْأَصَابِع من الْيَدَيْنِ وَالرّجلَيْنِ وَقيل: مَا بَين كل مفصلين من الْأَصَابِع.
              وقصب الشَّاة يقصبها قصباً: فصل قصبها.
              ودرة قاصبة: إِذا خرجت سهلة كَأَنَّهَا قضيب فضَّة.
              وقصب الشَّيْء يقصبه قصباً، واقتصبه: قطعه.
              والقاصب والقصاب: الجزار.
              وحرفته: القصابة، فإمَّا أَن يكون من الْقطع، وَإِمَّا أَن يكون من أَنه يَأْخُذ الشَّاة بقصبتها: أَي بساقها.
              والقصابة: المزمار.
              وَالْجمع: قصاب، قَالَ الْأَعْشَى:
              وشاهدنا الجل والياسمي ... ن والمسمعات بقصابها
              والقاصب، والقصاب: النافخ فِي الْقصب، قَالَ:
              وقاصبون لنا فِيهَا وسمار
              والقصاب: الزمار، وَقَالَ رؤبة يصف الْحمار:
              فِي جَوْفه وَحي كوحي القصاب
              والقصابة، والقصبة، والقصيبة، والتقصيبة، والتقصبة: الْخصْلَة الملتوية من الشّعْر.
              وَقد قصبه: قَالَ بشر بن لبي خازم:
              رأى درة بَيْضَاء يحفل لَوْنهَا ... سخام كغربان البرير مقصب والقصب: مجاري المَاء من الْعُيُون.
              واحدتها: قَصَبَة، قَالَ أَبُو ذُؤَيْب:
              أَقَامَت بهَا فابتنت خيمة ... على قصب وفرات نهر
              والقصبة: الْبِئْر الحديثة الْحفر.
              والقصب: شعب الْحلق.
              والقصب: عروق الرئة، وَهِي مخارج الانفاس وَالْوَاحد: كالواحد.
              والقصب: المعي. وَالْجمع: أقصاب.
              والقصب من الْجَوْهَر: مَا كَانَ مستطيلا أجوف.
              والقصبة: جَوف الْقصر. وَقيل: الْقصر.
              وقصبة الْبَلَد: مدينته. وَقيل: معظمه.
              والقصبة: الْقرْيَة.
              والقصب: ثِيَاب كتَّان ناعمة.
              وَاحِدهَا: قصبى مثل: عَرَبِيّ وعرب.
              وقصب الْبَعِير المَاء يقصبه قصباً: مصَّه.
              وبعير قصيب. يقصب المَاء.
              وقاصب: مُمْتَنع من شرب المَاء، وَرَافِع رَأسه عَنهُ، وَكَذَلِكَ: الْأُنْثَى بِغَيْر هَاء.
              وَقد قصب يقصب قصباً، وقصوبا.
              وأقصب الرَّاعِي: عافت إبِله المَاء، وَفِي الْمثل: " رعى فأقصب ".
              وَدخل، رؤبة على سُلَيْمَان بن عَليّ، وَهُوَ وَالِي الْبَصْرَة، فَقَالَ: أَيْن أَنْت من النِّسَاء؟ فَقَالَ: أطيل الظمء ثمَّ ارد فأقصب.
              وَقيل: القصوب: الرّيّ من وُرُود المَاء وَغَيره.
              وقصب الْإِنْسَان وَالدَّابَّة وَالْبَعِير يقصبه قصباً: مَنعه شربه قبل أَن يرْوى. وقصبه يقصبه قصباً، وقصبه: شَتمه وعابه.
              وأقصبه عرضه: الحمه إِيَّاه.
              والقصابة: مسناة تنبي فِي اللهج كَرَاهِيَة أَن يستجمع السَّيْل فيربل الْحَائِط: أَي يذهب بِهِ الوبل وينهدم عراقه.
              والقصاب: الديار، واحدتها: قَصَبَة.
              والقاصب: المصوت من الرَّعْد.
              والقصيبة: اسْم مَوضِع، قَالَ:
              وَهل ي إِن أَحْبَبْت أَرض عشيرتي ... وأحببت طرفاء القصيبة من ذَنْب
