              text: |-
                قصبقصَبَ يَقصِب، قَصْبًا، فهو قاصِب، والمفعول مَقْصوب• قصَب الجزّارُ الشَّاةَ: فصل عظامَها وقطّعها عُضْوًا عُضْوًا. 
                قصَّبَ يقصِّب، تقْصيبًا، فهو مُقصِّب، والمفعول مُقصَّب• قصَّب الثَّوبَ: نسجه بخيوط الذَّهبِ والفِضّة "قصَّبَتِ الخيّاطة فُستانَ العَرُوس- مشت تزهو في ثوبها المقصَّب" ° حرير مقصَّب: مزيَّن بخيوط الذهب أو الفضّة.• قصَّب الجزّارُ الشَّاةَ: قصبها؛ فصل عظامَها، وقطّعها عُضْوًا عُضْوًا.• قصَّب شعرَه: لَوَاه وجعَّده.• قصَّب الحجرَ: نحته وسوَّاه "قصَّب أرضَه قبل بذرها: سَوّاها". 
                قِصابة [مفرد]: حرفة القصّاب، ذبح الماشية وبيع لحومها بالمفرَّق، جِزارة "رفض أن يعمل مع أبيه في القِصابة". 
