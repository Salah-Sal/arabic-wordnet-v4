          - entry_id: 811245
            dictionary_id: 116
            headword: قصب
            headword_bare: قصب
            headword_norm: قصب
            root: قصب
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '[قصب] في صفته صلى الله عليه وسلم: سبط «القصب»، هو كل عظم أجوف فيه مخ، جمع قصبة. وفيه: بشر خديجة
              ببيت من «قصب»، هو لؤلؤ مجوف واسع كالالمنيف، والقصب من الجوهر ما استطال منه في تجويف. ك: وفيه إشارة إلى قصب سبقها
              في الإسلام، وقائل هذه خديجة جبرئيل، وأو إناء - شك من الراوي هل قال: إناء فيه طعام، أو أطلق الإناء ولم يذكر ما
              فيه - وصخب مر في ص. نه: وفيه: إنه سبق بين الحيل فجعلها مائة «قصبة»، أراد أنه ذرع الغابة بالقصب وتركز تلك القصبة
              عند أقصى الغاية فمن سبق إليها أخذها واستحق الخطر، فلذا يقال: حاز قصب السبق واستولى على الأمد. وفيه: رأيت عمرو
              بن لحى يجر «قصبه» في النار، هو بالضم: المعى، وجمعه أقصاب، واختلف انه اسم للأمعاء كلها أو لما كان أسفل البطن
              من الأمعاء. ط: هو بسكون صاد وهو أول من سيب السوائب وأول من سن عبادة الأصنام بمكة، ولعله كوشف من شأن ما كان يعاقب
              به في النار، يجر قصبه - لأنه استخرج من باطنه بدعة جر بها الجريرة إلى قومه. ك: وروي: عمرو بن عامر، ولعلهما واحد
              أو أحدهما أبوه والآخر جده. نه: ومنه ح: من يتخطى رقاب الناس كالجار «قصبه» في النار. وقال عبد الله لعروة: هل سمعت
              أخاك «يقصب» نساءنا؟ قال: لا، قصبه - إذا عابه، وأصله القطع، ومنه القصاب، ورجل قصابة: يقع في الناس. ك: هو من يقطع
              المذبوح عضوًا عضوًا.'
            translation_en: null
            translation_fr: null
            domain: null
