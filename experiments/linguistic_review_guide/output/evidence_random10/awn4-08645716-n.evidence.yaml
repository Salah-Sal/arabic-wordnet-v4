              (الْقصب) كل نَبَات كَانَت سَاقه أنابيب وكعوبا وَمِنْه قصب السكر ونبات مائي من الفصيلة النجيلية لَهُ سوق طوال يَنْمُو حول الْأَنْهَار وَقد يزرع وَيُسمى فِي مصر الغاب الْبَلَدِي وقصب النّيل ومجاري المَاء من الْعُيُون وَيُقَال للسابق (أحرز قصب السَّبق) أَصله أَنهم كَانُوا ينصبون فِي حلبة السباق قَصَبَة فَمن سبق اقتلعها وَأَخذهَا ليعلم أَنه السَّابِق وَعِظَام الْيَدَيْنِ وَالرّجلَيْنِ والأصابع والدر الرطب المرصع بالياقوت وَمَا كَانَ مستطيلا أجوف من الْفضة وَالذَّهَب وَنَحْوهمَا وَشعب الرئة (الْوَاحِد فِي كل هَذَا قَصَبَة) وَثيَاب من كتَّان رقاق ناعمة (وَاحِدهَا قصبي) وشرائط مذهبَة أَو مفضضة تحلى بهَا الثِّيَاب وَنَحْوهَا (مو)
