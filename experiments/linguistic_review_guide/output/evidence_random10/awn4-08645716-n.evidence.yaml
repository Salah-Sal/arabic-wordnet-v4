      is_partial: 0
      definitions_text: |-
        إفريقياإفريقيا [مفرد]: إحدى قارات العالم السَّبع، يحيط بها البحر الأبيض المتوسط والمحيط الأطلسيّ والمحيط الهنديّ والبحر الأحمر، وهي ثانيّة أكبر قارات العالم، وتبلغ مساحتها ثلاثة أمثال قارة أوربا إذ تبلغ 30150000 كم2 ° إفريقيا السّوداء: المناطق التي تقع جنوب الصّحراء الإفريقيّة. 
        إفريقيّ [مفرد]: اسم منسوب إلى إفريقيا.• منظمة الوَحْدَة الإفريقيَّة: (سة) منظَّمة تضمّ جميع الدُّول الإفريقيّة وتسعى لتدعيم التعاون فيما بينها.
