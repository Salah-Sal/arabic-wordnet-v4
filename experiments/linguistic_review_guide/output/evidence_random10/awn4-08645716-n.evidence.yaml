        definitions:
        - sense_index: 0
          text: المعروف من الأحجار
          is_raw: 0
        - sense_index: 1
          text: حطيم مكة وهو المدار بالبيت
          is_raw: 0
        - sense_index: 2
          text: موضع كان لثمود ينزلونه
