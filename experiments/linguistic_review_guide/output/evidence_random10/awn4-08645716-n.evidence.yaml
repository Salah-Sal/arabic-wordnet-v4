        examples:
        - idx: 0
          type: poetry
          text: لا ناقصي حسب ولا % أيد إذا مدت قصارة
          attribution: null
        - idx: 1
          type: poetry
          text: وإن امرءا قد زرته قبل هذه % بحجر لخير منك نفسا ووالدا
          attribution: الأعشى
        - idx: 2
          type: poetry
          text: حتى دعونا بأرحام لهم سلفت % وقال قائلهم إني بحاجور
          attribution: null
        - idx: 3
          type: poetry
          text: وتخالها في البيت إذ فاجأتها % وكأن محجرها سراج الموقد
          attribution: النابغة
        - idx: 4
          type: usage
          text: يأكل خضرة ويربض حجرة
          attribution: مثل
        - idx: 5
          type: poetry
          text: إذا اجتمعوا فضضنا حجرتيهم % ونجمعهم إذا كانوا بداد
          attribution: null
