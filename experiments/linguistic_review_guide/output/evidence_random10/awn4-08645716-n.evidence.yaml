      - entry_id: 688517
        dictionary_id: 94
        headword: |
          (1) عَوْم؛ طَفْو
          (2) «أ», شيء عائم أو طافٍ؛ مثل: «ب» فلّينة؛ قصبة الصيد. «ج» الطَّوْف؛ المنصة العائمة: منصة عائمة قرب الشاطئ يستخدمها السباحون أو تُتّخَذ لتسهيل الصعود إلى المراكب أو النزول منها
          (3) العَوّامة: كُرة جوفاء في أعلى البرميل
          (4) المِصْقَلة: أداة لصَقْل سطح أو تنعيمِهِ
          (5) المِنصَّة السيّارة: عربة ذات مِنصَّةٍ يُعْرَض عليها شيء في موكب
          (6) شيكات برَسْم التحصيل (اد)
          (7) المُعَوَّم: شراب تطفو على سطحه قِطَع من المثلوجات
          (8) يعوم؛ يطفو
          (9) يجري برفق على سطح الماء [أو وكأنه على سطح الماء]
          (10) يَخفُق؛ يُرفرِف
          (11) ينتشر
          (12) .أ» يَهيمُ [شاردًا]. .ب» يَتردَّد؛ يَتقلَّب؛ يُكثِر من تغيير مَقَرِّه أو مهنته
          (13) يُعَوِّم
          (14) يَغْمُر
          (15) يَصْقُل؛ يُنَعِّم
          (16) «أ» يُرَوِّج [لفكرة أو مشروع]؛ يدعو الناس إلى مناصرة فكرة أو تمويل مشروع. «ب» يَطْرَح الأسهمَ الماليةَ في السّوق. «ج» يُؤسِّس شركةً [بطَرْح أسهُمها في السّوق].
