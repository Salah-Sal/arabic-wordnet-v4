      - entry_id: 23392
        dictionary_id: 1
        headword: الْقَصَبُ
        headword_bare: القصب
        headword_norm: القصب
        root: قصب
        root_source: ocr
        pos: noun
        form: null
        is_partial: 0
        definitions_text: 'كلُّ نبات كانت ساقُه أنابيبَ وكعوباً. ومنه: قَصَبُ السُّكَّر نبات مائيّ من الفصيلة النجيلية, له
          سوق طوال, ينمو حول الأنهار. وقد يزرع, ويسمى فى مصر: الغاب البلدىّ, وقصَب النيل مجارى الماء من العُيون يقال للسابق:
          «أَحْرَزَ قَصَبَ السَّبْق»: أصلُه أنهم كانوا ينصبون فى حلبة السِّباق قصبةً فمن سبق اقتلعها وأخذها ليُعْلَمَ أنَّه
          السَّابِقُ عظامُ اليدين والرجلين والأصابع الدُّرُّ الرَّطْبُ المُرَصَّعُ بالياقوت ما كان مستطيلا أجوف من الفضة والذهب
          ونحوهما شُعَبُ الرِّئَةِ [ الواحد فى كل هذا: قَصَبَةٌ ] ثيابٌ من كتان رِقاق ناعمة [ واحدها: قَصَبيّ ] شرائط مذهبة
          أو مفضَّضة تحلَّى بها الثياب ونحوها (مو)'
        translation_en: null
