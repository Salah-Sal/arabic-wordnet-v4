            definitions_text: 'دليلُ جذرٍ يراه المستخدِمُ عند اتصالِه بمخدِّمِ إنترنت (كمخدِّم HTTP أو FTP). الجذرُ الافتراضيُّ
              هو في الواقع مؤشر إلى دليل الجذر الحقيقي الذي قد يكون موجوداً في موضعٍ آخر، على مخدِّم آخر مثلاً. من فوائد استخدام
              الجذر الافتراضي: إمكانُ إنشاء عنوان URL مبسّط لموقع إنترنت، ونقْلُ الدليل الجذري دون التأثير في URL.'
