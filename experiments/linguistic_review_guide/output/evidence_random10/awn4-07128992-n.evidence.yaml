          - entry_id: 797063
            dictionary_id: 113
            headword: الجَذْرُ
            headword_bare: الجذر
            headword_norm: الجذر
            root: جذر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'الجَذْرُ: القَطْعُ، والأَصْلُ، أو أصْلُ اللِّسانِ والذَّكَرِ والحِسابِ، ويكسرُ فيهنِّ، أو في
              أصْلِ الحِسابِ، بالكسر فقط، والاسْتِئْصالُ،كالإِجْذَارِ، ومَغْرِزُ العُنُقِ، ج: جُذورٌ.والجُؤْذُرُ، وتفتحُ الذالُ،والجِيذَرُ
              والجُوذَرُ، بالواوِ كفُوفَلٍ وكَوْكَبٍ،والجَوْذِرُ، بفتح الجيمِ وكسر الذالِ: ولَدُ البَقَرَةِ الوَحْشِيَّةِ،
              وبَقَرَةٌ مُجْذِرٌ.وانْجَذَرَ: انْقَطَعَ،واجْذَأَرَّ: انْتَصَبَ للسِّبابِ،وـ النَّباتُ: نَبَتَ ولم يَطُلْ.والجَيْذَرَةُ:
              سَمَكَةٌ كالزَّنْجِيِّ الأَسْوَدِ الضَّخْمِ.والمُجَذَّرُ، كمُعَظَّمٍ: عبدُ اللهِ بنُ زِيادٍ البَلَوِيُّ، وعَلْقَمَةُ
              بنُ المُجَذَّرِ الكِنانِيُّ: صحابِيَّانِ،وـ: القصيرُ الغَليظُ، الشَّثْنُ الأَطْرافِ،كالجَيْذَرِ، أو هذه بالمهملةِ،
              ووَهِمَ الجوهريُّ، والبَعيرُ الذي لَحْمُه في أطْرافِ عِظامِهِ وحُجومِهِ.'
