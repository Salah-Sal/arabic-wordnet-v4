            definitions_text: |-
              جذرجذَرَ يَجذُر، جَذْرًا، فهو جاذِر، والمفعول مَجْذور• جذَر الشَّجرةَ وغيرَها: قطعها واستأصلها، قلعها من جذورها "جذر أعشابًا/ غُصْنًا/ الفتنةَ/ عُنقَه". 
              جذَّرَ يجذِّر، تجذيرًا، فهو مُجذِّر، والمفعول مُجذَّر• جذَّر العددَ: (جب) أخرج جَذْرَه وهو العدد المضروب في نفسه.• جذَّر العدوُّ حضورَه العسكريّ بالاستيطان: أصَّله ورسَّخه "لابد من تجذير الأفكار قبل طرحها".• جذَّر الشَّيءَ: استأصله، قطعه. 
              جَذْر1 [مفرد]: مصدر جذَرَ. 
              جَذْر2/ جِذْر [مفرد]: ج جُذور:1 - أصل كُلّ شيء "الحضارة المصريّة ذات جذور عميقة" ° يضرب جذوره في الأرض: يتأصَّل.2 - (لغ) أصل تُشتقّ منه الكلمة، فجذر مصنع وصناعة وصانع هو: ص ن ع.3 - (نت) جزء النَّبات الذي يتشعّب في الأرض ويحصل على غذائه منها عن طريق امتصاصه الماء والمعادن من التربة المحيطة وهو العضو الذي يثبِّت النباتَ في الأرض "جذْر الشَّجرة- اقتلع الحشائشَ من جذورها".• جذْر العدد: (جب) العدد الذي يُضرب في نفسه أو في إحدى قواه فينتج ذلك العدد، فجذر مائة عشرة ° الجذر التَّربيعيّ للعدد: هو عدد إذا ضُرب بنفسه أوجد ذلك العدد، فالجذر التربيعيّ لـ (25) هو (5) - الجذر التَّكعيبيّ للعدد: هو عدد إذا رفع للقوّة الثالثة أوجد ذلك العدد، فالجذر التكعيبيّ لـ (125) هو (5) - جذر معادلة: هو قيمة المجهول التي يتحقّق بها تساوي طرفي المعادلة. 
              جَذْريّ/ جِذْريّ [مفرد]: اسم منسوب إلى جَذْر2/ جِذْر: أساسيّ، جوهريّ "تطوّرات جذريّة" ° إصلاح جذريّ/ تحوُّل جذريّ/ تغيير جذريّ: أساسيّ أو جوهريّ يمسّ الأصول- جذريًّا: بصورة أو بطريقة جذريّة. 
              مُجذَّر [مفرد]:1 - اسم مفعول من جذَّرَ.2 - (جب) عدد أو مقدار يوضع تحت علامة الجذر، أو مقدار مطلوب إيجاد جذره الأساسيّ.
