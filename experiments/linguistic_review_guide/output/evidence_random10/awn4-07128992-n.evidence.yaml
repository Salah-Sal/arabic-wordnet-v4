            definitions_text: 'يمثل المحرك قلب كل سيارة، ومصدر الطاقة لها، فهو يقوم بتحويل الطاقة الكيميائية، وأحياناً الكهربائية
              كذلك، إلى قوة ميكانيكية دافعة. وفي المركبات بشتى أنواعها تُستخدم محركات الاحتراق الداخلي، (انظر: المحركات ذات
              الكبّاس الترددي، أو المحركات ذات الكبّاس الدوراني، أو المحرك التوربيني)، وأحياناً الموتورات الكهربائية كذلك.'
