            is_partial: 0
            definitions_text: 'مصطلح عام لحركة انحدار مواد، تمت تجويتها، تحت تأثير الجاذبية. ويشمل رفع، تدفق، وانزلاق شرائح
              والسقوط. التدفقات الطينية: نوع من حركة كتل حيث كتلة من المواد الصخرية، التي تمت تجويتها، بما في ذلك نسبة عالية
              من الطين، والتي حصل تسييلها، وربما بعد هطول أمطار غزيرة، وتدفقت إلى أسفل. في بعض الأحيان ينتج شكلا مميزا يسمى
              ''الأنهار الجليدية الطين''، على سبيل المثال فوق درج هول، دورست.'
