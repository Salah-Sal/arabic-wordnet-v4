          - entry_id: 357539
            dictionary_id: 60
            headword: جذر
            headword_bare: جذر
            headword_norm: جذر
            root: جذر
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: امتداد محوري نحو الأسفل للنبات، عادة تحت سطح الأرض، والذي يعمل على تثبيت النبات في التربة، واستيعاب
              وتوصيل الماء والمعادن إلى النبات. تنتقل معظم المعادن في الجذور عبر مسارات حشوية (سيتوبلازمية)، في حين تتبع المياه
              مسار الجدار الخلوي من خلال القشرة. في القشرة الداخلية، يمر كل من الماء والمعادن عبر السيتوبلازم (يقوم القطاع
              الكاسبارياني الشمعي بمنع تدفق غير منضبط). تستهلك الطاقة لنقل الأيونات عبر النسيج الوعائي الخشبي (عن طريق الضخ)،
              أما المياه فتتدفق عن طريق التناضح (إمكانات المياه منخفضة).
            translation_en: root
            translation_fr: racine
            domain: Climate, Environment and Solid Waste management
            external_id: arabterm:68530
