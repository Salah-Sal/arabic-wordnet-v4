            d.author          AS dict_author,
            d.death_year      AS dict_death_year,
            def.sense_index,
            def.text          AS definition_text,
            def.is_raw
        FROM entries e
        JOIN dictionaries d ON e.dictionary_id = d.id
        JOIN definitions def ON def.entry_id = e.id
        WHERE e.headword_norm IN (?1, ?2)
