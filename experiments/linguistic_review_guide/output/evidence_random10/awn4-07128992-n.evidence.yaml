            definitions_text: هو اندماج نظامي إدارة ودفع مختلفين سوياً. حيث يتم في الغالب دمج محرك كهربائى و[محرك احتراق داخلي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87925)
              سوياً، ممّا يوفر ميزة إبقاء المواد الضارة الموجودة في غاز العادم في حدود ضيقة بالأماكن المزدحمة بالسكان، حيث
              يتم تشغيل نظام الدفع الكهربائي فقط مع السرعات المنخفضة. ومع السرعات العالية يمكن تشغيل محرك الاحتراق الداخلي
              عن طريق ذراع انتقاء. لشحن البطاريات يتم استخدام الموتور الكهربائي كـمُولد كهربائي. ويقوم محرك الاحتراق الداخلي
              بتشغيل المُولد.
