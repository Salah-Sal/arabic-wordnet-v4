            pos: null
            form: null
            is_partial: 0
            definitions_text: يتحرك الهواء أفقيا عند اختلاف في الضغط الجوي بين منطقتين، ينتقل الهواء من منطقة الضغط المرتفع
              إلى منطقة الضغط المنخفض. هذا الاختلاف في الضغط ينتج عن اختلافات في درجة الحرارة، فالهواء الساخن أقل كثافة من
              الهواء البارد، مما يتسبب في انتقال الهواء الأقل كثافة إلى أعلى (ينتج عن ذلك انخفاض للضغط) ويتم تعويضه بالهواء
              البارد.
