            definitions_text: 'هو محرك تكتمل فيه حركة الكبّاسات في خط مستقيم بين [النقطة الميتة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87906)
              العليا والنقطة الميتة السفلى. وفي المقابل يتحرك الكبّاس في المحرك ذي الكبّاس الدوّار، (انظر: محرك ''فانكل'')،
