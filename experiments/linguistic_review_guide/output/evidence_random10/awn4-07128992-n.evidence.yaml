          - entry_id: 819382
            dictionary_id: 119
            headword: الجذر
            headword_bare: الجذر
            headword_norm: الجذر
            root: جذر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: "الجذر:[في الانكليزية] Square root ،mathematics [ في الفرنسية] Racine carree ،mathematique \n\
              بالفتح وسكون الذال المعجمة باللغة الفارسية: بريدن، أي القطع واز بيخ بركندن أي الاجتثاث. وأصل كلّ شيء. وورد أيضا\
              \ بهذا المعنى بكسر الجيم. وفي اصطلاح أهل الحساب: يقال للعدد المضروب في نفسه كذا في المنتخب. وفي خلاصة الحساب\
              \ وشرحه العدد المضروب في نفسه يسمّى جذرا في المحاسبات وضلعا في المساحة وشيئا في الجبر والمقابلة. والحاصل يسمّى\
              \ مجذورا ومربعا ومالا. والتجذير هو تحصيل الجذر. ثم الجذر قسمان: منطق وهو ما له جذر صحيح كالتسعة فإنّ له جذرا\
              \ صحيحا وهو الثلاثة، وأصم وهو ما ليس له جذر صحيح كالعشرة فإنّ جذرها هو ثلاثة وسبع تقريبا ليس صحيحا. إن قيل الكسر\
              \ أيضا يكون منطقا وأصم مع أنّ جذر الكسر لا يكون صحيحا قط. قلت المراد بكون الكسر منطقا أن يكون عدد الكسر بعد\
              \ تجنيسه أو قبل تجنيسه على أنّه يعتبر كأنه عدد صحيح منطقا.وقد يطلق الجذر على معنى يعمّ المساحة والجبر والمقابلة،\
              \ كذا في شرح خلاصة الحساب للخلخالي."
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:24:819
