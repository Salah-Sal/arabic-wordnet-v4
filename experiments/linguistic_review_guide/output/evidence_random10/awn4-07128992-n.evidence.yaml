          - entry_id: 990617
            dictionary_id: 152
            headword: جذر
            headword_bare: جذر
            headword_norm: جذر
            root: جذر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              الْجِيم والذال وَالرَّاء
              جَذَر الشَّيْء يَجْذُره جَذْرا: قطعه.
              وجَذْرُ كل شَيْء: أَصله. وجَذْرُ الْعُنُق: مغرزها، عَن الهجري، وَأنْشد:
              تَمُجُّ ذَفَارِيهنَّ مَاء كَأَنَّهُ ... عَصِيم على جَذْر السوالفْ مُغْفُر
              وَالْجمع: جُذُور.
              والمجذَّر: الْقصير الغليظ، الشَّثْن الْأَطْرَاف، قَالَ:
              إِن الْخلَافَة لم تَزَلْ مجعولة ... أبدا على جاذي الْيَدَيْنِ مُجَذَّر
              وَالْأُنْثَى بِالْهَاءِ.
              وناقة مجذَّرة: قَصِيرَة شَدِيدَة.
              والجُؤْذُر، والجُؤْذَر: ولد الْبَقَرَة.
              وبقرة مُجْذِر: ذَات جؤذر، وَلذَلِك حكمنَا بِزِيَادَة همزَة جؤذر، وَلِأَنَّهَا قد تزاد ثَانِيَة كثيرا.
              وَحكى ابْن جني: جُوذُرا وجُوذَرا فِي هَذَا الْمَعْنى وكسره على جواذر، فَإِن كَانَ ذَلِك فجؤذُر: فُؤْعُل، وجُؤذَر: فُؤْعَل، وَيكون جوُذُر وجُؤذَر مخففا من ذَلِك تَخْفِيفًا بدليا أَو لُغَة فِيهِ.
              وَحكى ابْن جني: أَن جَوْذراً على مِثَال كوثر لُغَة فِي جُوذُر، وَهَذَا مِمَّا يشْهد لَهُ أَيْضا بِالزِّيَادَةِ؛ لِأَن الْوَاو ثَانِيَة لَا تكون أصلا فِي بَنَات الْأَرْبَعَة.
              والجَيْذَر: لُغَة فِي الجُوذَر.
              وَعِنْدِي: أَن الجَيْذَر، والجَوْذر عربيان، والجؤذُر والجؤذَر فارسيان.
