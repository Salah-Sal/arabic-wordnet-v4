          - entry_id: 372268
            dictionary_id: 52
            headword: محرك 'إيتا'
            headword_bare: محرك 'إيتا'
            headword_norm: محرك 'ايتا'
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'يُعبّر الحرف اليوناني eta عن الرمز الرياضي للكفاءة. ومحرك إيتا (ETA) هو محرك بنزين رباعي الأشواط
              طورته شركة بي.إم.دبليو (BMW). ويتسم هذا المحرك بكبر سعة الأسطوانات (2.7 لتر) مع نفس خرج [القدرة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91798)،
              مثله في ذلك مثل محركات BMW التي تبلغ السعة الحجمية لكل منها 2 لتر. تُولد هذه المحركات أقصى قدرة لها عندما تبلغ
              [سرعة الدوران](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=92384) 4250 لفة/دقيقة، بينما
              تحتاج المحركات التي تبلغ سعة الأسطوانات 2 لتر إلى 5800 لفة/دقيقة لتُولد أقصى قدرة لها. كما أنه من المُستهدف
              بالفعل مع هذه المحركات الوصول إلى أقصى عزم دوران في حالة سرعات الدوران الأدنى من ذلك. وقد أدت هذه المواصفات
              جميعاً، من كبر سعة الأسطوانات والوصول للحد الأقصى من القدرة ومن عزم الدوران مع سرعة دوران منخفضة، إلى انخفاض
              مُعدل استهلاك الوقود نسبيا. ومن خلال إجراء تعديلات شاملة على رأس الأسطوانة، بجانب ما يتمتع به المحرك من سعة
              أسطوانات أكبر، تم الوصول إلى مستوى أمثل لعزم الدوران. وفي هذا الإطار تم إجراء التالي تفصيلاً: 1.) تقليص مساحة
              [تداخل الصمامات](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88207)، فصارت صمامات السحب
              تنغلق مبكراً عن المُعتاد، حتى يمكن تحسين عملية ملء الأسطوانات بشحنات جديدة من الغازات. 2.) زيادة طول ماسورة
              السحب بنسبة 20%. وبذلك يمكن توليد التأثير الدينامي للشحن الإضافي. وهذا يعني: الاستفادة الكاملة من تأرجح عمود
              الوقود والهواء، علاوة على ضغط كمية كبيرة من [خليط الهواء والوقود](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88248)
              إلى داخل حيوز الاحتراق عندما تكون صمامات السحب مفتوحة. 3.) زيادة نسبة الانضغاط من 1:9.8 لتصل إلى 1:11. تشتمل
              منظومة محرك إيتا (ETA) على عامل رئيسي آخر، يتمثل في تقليل مُعدلات الفقد بالاحتكاك في المحرك إلى أدنى حد من خلال
              استخدام أربعة - بدلاً من سبعة - محامل لأعمدة الكامات، وانخفاض الشد الأولي لحلقات الكبّاسات ويايات الصمامات مع
              انخفاض قوة الياي. وتُستكمل هذه الإجراءات الميكانيكية بمجموعة إلكترونيات المحرك الرقمية (انظر: [نظام ''موترونيك''
              (Motronic)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88334)). يسمح كل من التحكم الدقيق
              في [الإشعال](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=94616) وعملية تكوين الخليط بوجود
              نسبة الانضغاط المرتفعة هذه. ومن ضمن الطرق الأخرى التي يتم اتباعها لتقليل مُعدل الاستهلاك: [قطع الإمداد بالوقود
              أثناء الاندفاع الذاتي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88450) عند الدوران
              بسرعة تتجاوز 1200 لفة/دقيقة، وانخفاض سرعة دوران اللاحمل لتصل إلى 700 لفة/دقيقة.'
            translation_en: eta engine
            translation_fr: moteur ETA [m.]
            domain: Automotive Engineering
            external_id: arabterm:87962
