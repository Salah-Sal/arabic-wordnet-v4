            headword: محرك بشاحن
            headword_bare: محرك بشاحن
            headword_norm: محرك بشاحن
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: يمكن تشبيه الشواحن بمنافيخ الهواء التي تقوم بإمداد غرفة الاحتراق بالهواء المسحوب بكثافة عالية
              وتحت ضغط عالٍ، وبذلك يتم تحسين عملية الشحن. وهناك نوعان من الشواحن، النوع الأول الشواحن التوربينية العاملة بغاز
              العادم التي تستفيد من طاقة التدفق - غير المستغلة عادةً - لغازات العادم، والنوع الثاني هو الشواحن الميكانيكية
              التي يُديرها العمود المرفقي. ويعتبر الشاحن ذو الموجات الضغطية توليفة من الشاحن الميكانيكي والشاحن العامل بغاز
              العادم.
            translation_en: supercharged engine
