              (Transporter) من فولكس فاجن (VW)، وتُصنع كتلة الأسطوانة والعمود المرفقي وكذلك [رأس الأسطوانة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88050)
              من سبائك معدنية خفيفة عالية المتانة، كما تُستخدم بطانات الأسطوانات المُبتلة. ويعمل القميص المائي على خمد الضوضاء،
              ويُزيد من الراحة أثناء القيادة.
