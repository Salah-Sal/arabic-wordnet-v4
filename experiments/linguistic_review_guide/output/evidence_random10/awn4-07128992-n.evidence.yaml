          - entry_id: 373039
            dictionary_id: 52
            headword: محرك ثنائي الشوط
            headword_bare: محرك ثنائي الشوط
            headword_norm: محرك ثنائي الشوط
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: لا يحتاج هذا المحرك إلا إلى شوطين للكبّاس أو لفة واحدة للعمود المرفقي ليتم دورة تشغيل واحدة.
              وعلى الرغم من أن دورة التشغيل لا تختلف عن مثيلتها في [محرك أوتّو رباعي الأشواط](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87905)،
              إلا أنه يقتصر هنا على لفة واحدة للعمود المرفقي، وذلك لأن سحب [خليط الهواء والوقود](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88248)
              يتم عن طريق [علبة المرافق](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88060) المُحكمة
              ضد تسرّب الغاز. ويعمل كل من علبة المرافق والجانب السفلي من الكبّاس معاً كمضخة تحميل، تقوم في نفس الوقت بملء
              الأسطوانة عن طريق منفذ الكسح، كما تعمل على طرد غازات العادم. يتفرد المحرك ثنائي الشوط بميزة تصميمه البسيط، حيث
              يخلو من عناصر التحكم الخاصة ب[التبدّل الغازي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87891).
              ويتم التحكم في دخول وخروج الغازات عن طريق القنوات الموجودة في جدار الأسطوانة التي يتحكم بها الكبّاس. وعلى الرغم
              من أن المحرك ثنائي الشوط يحقق ضعف عدد دورات تشغيل المحرك رباعي الأشواط، إلا أنه لا يحقق قدرة أداء مماثلة، وبذلك
              تصبح هذه الميزة بلا حيثية، لاسيما إذا قارنا المحركين معاً في إطار ما يتميز به محرك أوتّو رباعي الأشواط من مستوى
              تقني عال، وما يعيب المحرك ثنائي الشوط من درجة الامتلاء الرديئة. ويتمتع المحرك ثنائي الشوط بعزم دوران منتظم للغاية.
              وفي أثناء عملية التبدّل الغازي على وجه الخصوص يحدث فقدان كبير في شحنات الغاز الجديدة، في المحرك ثنائي الشوط،
              وذلك لأن الغازات الجديدة تنظف الأسطوانة. كما تضغط شحنات الغاز الجديدة الغازات العادمة إلى قناة العادم فتختلط
              تلك الغازات معاً، ممّا يؤدي إلى خفض قدرة المحرك وزيادة [مُعدل استهلاك الوقود](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87964).
              وتُعرف هذه العملية باسم التبدّل الغازي المفتوح. وحيث أنه يتم استخدام علبة المرافق لشوط السحب، فلا يمكن استخدامها
              كـحوض زيت. لذلك يجب خلط زيت التزليق مع الوقود بنسب خلط معينة (تكون غالباً إمّا 1:25 أو 1:40). يكوّن الزيت الموجود
              في الوقود طبقة رقيقة داخل المحرك تعمل على تزليق المحامل وأسطح الأسطوانة الداخلية بدرجة كافية. ويُعتبر التحميل
              الحراري للمحرك ثنائي الشوط أعلى ممّا هو عليه في المحرك رباعي الأشواط بسبب زيادة عدد دورات التشغيل بمقدار الضعف.
              لذلك ينبغي تبريد المحركات ثنائية الشوط بشكل جيد، كما لا يجوز تصميمها بأبعاد كبيرة على نحو اعتباطي غير مُقيد.
            translation_en: two-stroke engine
            translation_fr: moteur à deux temps [m.]
            domain: Automotive Engineering
            external_id: arabterm:88733
            dict_key: arabterm_arabterm_automotive_engineering
