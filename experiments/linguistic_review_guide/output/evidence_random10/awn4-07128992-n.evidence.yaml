            definitions_text: 'الجذر: بِفَتْح الْجِيم عِنْد الاصمعي - وكسره عِنْد أبي عمر وَسُكُون الذَّال الْمُعْجَمَة وَالرَّاء
              الْمُهْملَة بِمَعْنى الأَصْل. وَلما كَانَ الْمَضْرُوب فِي نَفسه أصلا لجَمِيع الْأَعْدَاد الْحَاصِلَة فِي الْمنَازل
              سمي بِهِ. وَقَالَ الْجَوْهَرِي أصل كل شَيْء جذره. وَفِي الحَدِيث أَن الْأَمَانَة نزلت فِي جذر قُلُوب الرِّجَال.
              أَي فِي أَصْلهَا وَرُوِيَ بِكَسْر الْجِيم. وَفِي عرف الْحساب الْعدَد الْمَضْرُوب فِي نَفسه يُسمى جذرا فِي مَا
              دون المساحة وَعلم الْجَبْر والمقابلة لِأَن الْمَضْرُوب فِي نَفسه يُسمى ضلعا فِي المساحة وَفِي علم الْجَبْر والمقابلة
              يُسمى شَيْئا. وَقد يُطلق الجذر على كل عدد مَضْرُوب فِي نَفسه وَيُسمى الْحَاصِل من ذَلِك الضَّرْب مجذورا فِي
              المحاسبات العددية ومربعا فِي المساحة وَمَا لَا فِي الْجَبْر والمقابلة والمحاسبات العددية هِيَ الْحساب الَّذِي
              لَا يتَعَلَّق بالمقادير من حَيْثُ نسبتها إِلَى مِقْدَار معِين وَهُوَ المساحة. وَلَا يتَعَلَّق بِمَجْهُول يتَصَرَّف
              فِيهِ بِحَسب معطيات السَّائِل وَهُوَ علم الْجَبْر والمقابلة. جذر الْمنطق وجذر الْأَصَم: أَي جذر الْعدَد الَّذِي
              منطق بجذره تَحْقِيقا وجذر الْعدَد لَا ينْطق بجذره تَحْقِيقا فالجذر على نَوْعَيْنِ: (منطق) و (أَصمّ) واطلب تَعْرِيف
              كل مِنْهُمَا فِي مَوْضِعه. والفاضل الْكَامِل الْمُحَقق أستاذ الْكل فِي الْكل سعد الْملَّة وَالدّين التَّفْتَازَانِيّ
              رَحمَه الله ذكر فِي شرح الْمَقَاصِد فِي الْحسن والقبح مغلطة سَمَّاهَا مغلطة جذر الْأَصَم لِأَن الجذر فِي اللُّغَة
              بِمَعْنى الْحجر أَيْضا والأصم جَاءَ بِمَعْنى الصلب أَيْضا فَحِينَئِذٍ التَّرْكِيب توصيفي وَلما لم يظفر أحد بحلها
              وجوابها كَانَت فِي غَايَة الصلابة فَكَانَت حجرا صلبا. وَهَذَا الْوَجْه يَقْتَضِي أَن يكون الجذر مُعَرفا بِاللَّامِ
              وَالْوَاقِع فِي الْكتاب تركيب إضافي أَو توصيفي على اخْتِلَاف النّسخ. قيل يجوز أَن يكون الجذر اسْما لصَاحب تِلْكَ
              المغلطة وَكَانَ هُوَ أَصمّ بِمَعْنى زائل السّمع. وَلَا يخفى أَن هَذَا لَا يُنَاسب بِمَا ذكره الْمُحَقق الْمَذْكُور
              حَيْثُ قَالَ هُنَاكَ وَهَذِه مغلطة تحير فِي حلهَا عقول الْعُقَلَاء وفحول الأذكياء وَلذَا نسميها مغلطة جذر الْأَصَم.
              وَأَيْضًا لَا يُنَاسب بِمَا نقل أَن صَاحبهَا ابْن كموني وَيُمكن دَفعه بِأَنَّهُ يجوز أَن يكون ابْن كموني كنيته
              والجذر اسْمه فَلَا مُنَافَاة وَالْأولَى أَن يُقَال إِن الْعُقَلَاء لما عجزوا عَن حلهَا وَمَعْرِفَة جوابها كعجزهم
              عَن معرفَة الجذر الْأَصَم سَمَّاهَا بِهِ.وَاخْتلف الْعلمَاء فِي تَقْرِير تِلْكَ الشُّبْهَة وَبَيَان أجوبتها
              وَإِنِّي تركتهَا خوفًا للإطناب. واخترت الْمُخْتَصر الصَّوَاب. مستعينا بِاللَّه الْملك الْوَهَّاب لَو قَالَ قَائِل
              كَلَامي فِي هَذَا الْيَوْم كَاذِب وَلم يقل فِي ذَلِك الْيَوْم غير هَذَا الْكَلَام لزم أَن يكون الْكَلَام صَادِقا
              وكاذبا مَعًا لِأَنَّهُ إِن كَانَ صَادِقا فِي نفس الْأَمر لزم أَن يكون الْمَحْمُول وَهُوَ كَاذِب صَادِقا على
              مَوْضُوعه وَهُوَ قَول الْقَائِل كَلَامي فَيكون كَلَامه كَاذِبًا فَيلْزم أَن يكون كَاذِبًا وَقد فرض أَنه صَادِق
              وَإِن كَانَا كَاذِبًا فِي نفس الْأَمر يلْزم أَن يكون الْمَحْمُول وَهُوَ كَاذِب غير صَادِق على مَوْضُوعه فَصدق
              عَلَيْهِ أَنه صَادِق لِأَن الْمَوْضُوع كَلَام الْقَائِل وَالْكَلَام وَاجِب الاتصاف بِأَحَدِهِمَا فَيكون كَلَامه
              صَادِقا وَلَيْسَ كَلَامه إِلَّا كَلَامي كَاذِب فَيكون صَادِقا وَقد فرض أَنه كَاذِب. وَقد يُقرر هَذِه الشُّبْهَة
              فِي قَول الْقَائِل كَلَامي هَذَا كَاذِب وَالْجَوَاب أَنه لَيْسَ بِخَبَر فضلا عَن أَن يكون صَادِقا أَو كَاذِبًا
              فَإِن الْحِكَايَة عَن الْوَاقِع مُعْتَبرَة فِي مَفْهُوم الْخَبَر لِأَن الْخَبَر قَول مُشْتَمل على نِسْبَة هِيَ
              حِكَايَة عَن أَمر وَاقع وَمن شَأْن الْحِكَايَة أَن تتصف بالمطابقة وَعدمهَا وَلِهَذَا يحْتَمل الْخَبَر الصدْق
              وَالْكذب أَي مُطَابقَة النِّسْبَة للْوَاقِع وَعدم مطابقتها لَهُ بِخِلَاف النّسَب الإنشائية فَإِنَّهَا وَإِن
              كَانَت مُعْتَبرَة فِي الإنشاءات لَكِن لَا من حَيْثُ كَونهَا حِكَايَة عَن الْوَاقِع. وَإِذا عرفت أَن الْحِكَايَة
              عَن الْوَاقِع مُعْتَبرَة فِي مَفْهُوم الْخَبَر. فَاعْلَم أَن قَول الْقَائِل كَلَامي هَذَا كَاذِب مثلا مُشِيرا
              إِلَى نفس هَذَا الْكَلَام لَيْسَ خَبرا أصلا. وَإِن كَانَ فِي صُورَة الْخَبَر لانْتِفَاء الْحِكَايَة الْمَذْكُورَة
              الَّتِي تَقْتَضِي مُغَايرَة بَين الْحِكَايَة والمحكى عَنهُ وَتقدم المحكى عَنهُ على الْحِكَايَة لِأَن المحكى
              عَنهُ هُوَ مصداق الْقَضِيَّة ومصداقها لزم أَن يتَقَدَّم عَلَيْهَا فَلَا يتَصَوَّر أَن يكون نَفسهَا. وَأَيْضًا
              لَا يُمكن أَن يحكم فِي هَذَا القَوْل على نَفسه لِأَن الْمَحْكُوم عَلَيْهِ يجب أَن يكون مُسْتقِلّا بالمفهومية
              ومتحققا قبل الحكم وَهَذَا القَوْل لاشْتِمَاله على نَفسه غير مُسْتَقل بالمفهومية وَلَيْسَ لَهُ تحقق إِلَّا بعد
              الحكم فَهَذَا القَوْل على ذَلِك التَّقْدِير لَا يكون لَهُ معنى محصلا فَلَا يكون خَبرا وَلَا إنْشَاء وَلَو كَانَ
              على فرض الْمحَال كلَاما تَاما لَكَانَ إنْشَاء على صُورَة الْخَبَر. وَأَنت تعلم أَن المنحصر فِي الْأَمر وَالنَّهْي
              والاستفهام وَغَيرهَا من الْأَقْسَام الْمَذْكُورَة فِي الْكتب هُوَ الْإِنْشَاء الَّذِي لَا يكون على صُورَة الْخَبَر
              فَلَا يرد أَن ذَلِك القَوْل لَو كَانَ إنْشَاء فَأَي قسم من أَقسَام الْإِنْشَاء وَلَا يصلح قسما مِنْهَا.'
