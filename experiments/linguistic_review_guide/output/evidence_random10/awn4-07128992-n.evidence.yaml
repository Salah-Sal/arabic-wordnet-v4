            definitions_text: 'العَدَدُ الذي إذا ضُرِبَ في نَفْسِه مَرّات عدَدُهَا " ن " يَنْتُج العددُ الأصْليُّ , وعلى ذلك
              يكون الجَذْرُ التّربيعِيُّ للعدد (١٠٠) هو ( ± ١٠ ) , والجذر التكعيبي للعدد (١٠٠٠) هو (١٠) وعَلَامَةُ الجَذْر
              هكذا √ . الجَذْرُ الأصمُّ: هو الجذْرُ الذي لا يُمْكِنُ وَضْعُه على صُورَةِ كَسْرٍ, حَدّاهُ عَددَانِ صَحيحانِ
              , ولا يُمْكِنُ إيجادُ قِيمَتِهِ إلّا على وَجْهِ التَّقْرِيب . جَذْرُ البَقَرَةِ: قَرْنها . جَذْرُ الكَعْبَة:
              الفارغ من البناءِ جَوْلَها . جَذْرُ الكلامِ: هو أن يكونَ الرَّجُلُ مُحكَمًا لا يَستعِينُ بأحدٍ, ولا يُرَدُّ
