            definitions_text: '[جذر] في ح الزبير: احبس الماء حتى يبلغ "الجذر" يريد مبلغ تمام الشرب من جذر الحساب، وهو بالفتح
              والكسر أصل كل شيء. وروى بمهملة ومر. ومنه: نزلت الأمانة في "جذر" قلوب الرجال أي في أصلها، ومر في الأمانة. ك:
              الرجال أي المؤمنين كانت لهم بحسب الفطرة وحصلت بالكسب. نه وح: سألته عن "الجذر" قال: هو الشاذروان الفارغ من البناء
              حول الكعبة.'
