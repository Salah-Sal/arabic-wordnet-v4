            definitions_text: هو محرك حراري مُصنّع على هيئة آلة ذات كبّاسات، وفيه تُحوّل الحرارة الناتجة بداخل أسطوانة التشغيل
              - بفعل عملية احتراق الخليط القابل للاحتراق والمُكوّن من وقود وهواء - إلى طاقة ميكانيكية تظهر على هيئة تحرك الكبّاسات.
              ويدخل في فئة محركات الاحتراق الداخلي [محرك أوتّو رباعي الأشواط](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87905)،
              ومحرك ديزل، والمحرك ثنائي الشوط، ومحرك 'فانكل'، وتصميمات أخرى خاصة.
