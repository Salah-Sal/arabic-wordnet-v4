                الموجود في الوقود طبقة رقيقة داخل المحرك تعمل على تزليق المحامل وأسطح الأسطوانة الداخلية بدرجة كافية. ويُعتبر
                التحميل الحراري للمحرك ثنائي الشوط أعلى ممّا هو عليه في المحرك رباعي الأشواط بسبب زيادة عدد دورات التشغيل
                بمقدار الضعف. لذلك ينبغي تبريد المحركات ثنائية الشوط بشكل جيد، كما لا يجوز تصميمها بأبعاد كبيرة على نحو اعتباطي
                غير مُقيد.
