                هَذَا الْكَلَام لَيْسَ خَبرا أصلا. وَإِن كَانَ فِي صُورَة الْخَبَر لانْتِفَاء الْحِكَايَة الْمَذْكُورَة الَّتِي
                تَقْتَضِي مُغَايرَة بَين الْحِكَايَة والمحكى عَنهُ وَتقدم المحكى عَنهُ على الْحِكَايَة لِأَن المحكى عَنهُ
                هُوَ مصداق الْقَضِيَّة ومصداقها لزم أَن يتَقَدَّم عَلَيْهَا فَلَا يتَصَوَّر أَن يكون نَفسهَا. وَأَيْضًا لَا
                يُمكن أَن يحكم فِي هَذَا القَوْل على نَفسه لِأَن الْمَحْكُوم عَلَيْهِ يجب أَن يكون مُسْتقِلّا بالمفهومية ومتحققا
                قبل الحكم وَهَذَا القَوْل لاشْتِمَاله على نَفسه غير مُسْتَقل بالمفهومية وَلَيْسَ لَهُ تحقق إِلَّا بعد الحكم
                فَهَذَا القَوْل على ذَلِك التَّقْدِير لَا يكون لَهُ معنى محصلا فَلَا يكون خَبرا وَلَا إنْشَاء وَلَو كَانَ
                على فرض الْمحَال كلَاما تَاما لَكَانَ إنْشَاء على صُورَة الْخَبَر. وَأَنت تعلم أَن المنحصر فِي الْأَمر وَالنَّهْي
                والاستفهام وَغَيرهَا من الْأَقْسَام الْمَذْكُورَة فِي الْكتب هُوَ الْإِنْشَاء الَّذِي لَا يكون على صُورَة
                الْخَبَر فَلَا يرد أَن ذَلِك القَوْل لَو كَانَ إنْشَاء فَأَي قسم من أَقسَام الْإِنْشَاء وَلَا يصلح قسما مِنْهَا.'
              is_raw: 1
