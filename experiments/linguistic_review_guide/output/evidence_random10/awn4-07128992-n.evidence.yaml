          - entry_id: 70954
            dictionary_id: 2
            headword: الجَذْرُ
            headword_bare: الجذر
            headword_norm: الجذر
            root: جذر
            root_source: ocr
            pos: noun
            form: null
            is_partial: 1
            definitions_text: 'أَصْلُ كُلِّ شيءٍ. ويقال: نَزَلَتِ المَحَبَّةُ في جَذْرِ قلبه, أي: ثَبَتت وتمكنت أَصْلُ الشجرة
              أَصْلُ اللِّسان. يقال: إنّه لشَدِيدُ جِذْرِ اللِّسان أَصْلُ الذَّكر أَصْلُ العُنُقِ ومَغْرِزُه أَصْلُ العَدَدِ.
              وفي الأساس: يقالُ: ما جِذْرُ هذا العَدَدِ؟ وما جُدَاؤُه؟ أي: أصْلُه ومَبْلَغُه, فإذا ضُرب ثلاثة في ثلاثة, فالجذر
              الثلاثة أَصْلُ النَّسَبِ ( عند اللغويين ): الأصل الذي تُشتَقُّ منه الكلمات ( في علم النبات ): جُزءُ النَّباتِ
              الذي يُثبته في الأرْض وبه يَحْصُلُ على غِذائِه ( في علوم الرياضيات ): الجَذْرُ النونِيُّ لعددٍ مَا هو'
