          - entry_id: 903673
            dictionary_id: 132
            headword: جذر
            headword_bare: جذر
            headword_norm: جذر
            root: جذر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'جذر: الجَذْرُ: أصْلُ اللِّسانِ. وأصْلُ الذَّكَرِ. والحِسَاب. وقَصْبُ الأعراضِ والوَقِيْعَةُ
              فيها. والقَطْعُ والاسْتِئْصَالُ، جَذَرْتُه أجْذُرُه جَذّراً. وحَبُّ القُلُوبِ التي تَضُمُّ عليها؛ في الحَدِيث.
              ويقولونَ: بَلَغَ الماءُ جَذْرَه: إذا سُقِيَتِ الدَّبَرَةُ من الأرْضِ. والمُجْذَّرُ: القَصِيرُ الغَلِيْظُ. وناقَةٌ
              مُجَذَّرَةُ اللَّحْمِ: أي لَحْمُها في أطْرَافِ عِظَامِها وحُجُوْمِها. واجْذَأْرَرْتُ: أي غَضِبْت وانْتَصبْت.
              والمُجْذَئِرُّ: القاعِدُ المُنْتَصُّ للسِّبَابِ. وهو الوَتِدُ. والقَرْنُ حَتّى يُجَاوِزَ النُّجُومَ ولم يَغْلُظْ.
              ومن النَّباتِ: الذي نَبَتَ ولم يَطُلْ. والجِذْرِيَّةُ: السِّنُّ التي بَعدَ الرَّبَاعِيَةِ. والجَيْذَرُ: سَمَكَةٌ
              مِثْلُ الزَّنْجِيِّ الأسْوَدِ الضَّخْمِ، والجَميع الجَيْذَرُ والجَيَاذِرُ.'
