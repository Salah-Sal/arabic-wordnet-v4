          - entry_id: 373106
            dictionary_id: 52
            headword: محرك خلفي
            headword_bare: محرك خلفي
            headword_norm: محرك خلفي
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: يتم تركيب المحركات الخلفية أعلى أو خلف المحور الخلفي المُدار. ويمكن دمج كل من المحرك والقابض
              وصندوق التروس ووحدة الإدارة النهائية الخلفية في وحدة واحدة، وذلك بهدف توفير الحيز والتكلفة. إن الحمل الكبير
              على عجلات الإدارة الناتج عن ذلك يؤدي من ناحية إلى تحسن سلوك السير في فصل الشتاء، ومن ناحية أخرى تميل السيارة
              إلى التوجيه المفرط والتأثر بالرياح الجانبية. وبجانب ما تتمتع به السيارة من خاصية جيدة للسير على الطرق المبتلة
              أو على الجليد الزلق بسبب الحمل الكبير على العجلات الخلفية فإنها تتمتع كذلك بميزة التوجيه السهل بسبب التحميل
              القليل على المحور الأمامي. إلا أنه في حالة السير على جليد زلق تكون السيارة صعبة التوجيه بسبب قلة الحمل الواقع
              على المحور الأمامي. ومن العيوب الأخرى كذلك التبريد السيء للمحرك، واستهلاك جهاز التدفئة لقدر كبير من الطاقة (طول
              مسافة وصول الماء الدافئ أو الهواء الدافئ) والموالفة الصعبة لمنظومة العادم بسبب قصر المسافة.
            translation_en: rear engine
            translation_fr: moteur à l'arrière [m.]
            domain: Automotive Engineering
            external_id: arabterm:88800
            dict_key: arabterm_arabterm_automotive_engineering
