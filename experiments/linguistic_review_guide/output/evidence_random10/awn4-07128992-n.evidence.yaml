                عَلَيْهِ السَّلامُ، فِيمَا وَرَدَ. (وعَلْقمَةُ بنُ المُجَذَّرِ) ، واسمُه الأَعْوَرُ بنُ جَعْدَة (الكِنانِيُّ)
                المُدْلجيا، اسْتَعْملهُ النبيُّ صلَّى اللهُ عليْه وسلَّم على سَرِيَّة، (صَحَابِيّانِ) .(و) المُجَذَّرُ: (القصِيرُ
                الغلِيظُ، الشَّثْنُ الأَطْرَافِ) ، وَزَاد فِي التَّهْذِيب: من الرِّجَال، والأُنثى بالهَاءِ (كالجَيْذَرِ) .
                وأَنشد أَبو عَمْرو لأَبي السَّوْداءِ العِجْلِيّ:تعَرَّضتْ مُرَيْئَةُ الحَيّاكِلناشِيءٍ دَمَكْمَكٍ نَيّاكِالبُهْتُرِ
                المُجَذَّرِ الزَّوّاكِ(أَو هاذه) ، أَي الجَيْذر، (بالمهملَة، ووهِمَ الجوهريُّ) فِي إِعجام الذّالِ مِنْهَا.
                قَالَ شيخُنا:وجَزَم القاضِي زَكَرِيّاءُ فِي حَاشِيَتِه على البَيْضَاوِيِّ بأَنه بالموحَّدة بعد الجِيم والذّال
                المعجَمَة، وتَبِعَه السُّيُوطِيُّ فِي حاشِيَتِه، وتَعَقَّبَهما الخَفَاجِيُّ وعبدُ الحَكِيم. أَي فِي أَصْلها.والجَذْرُ
                أَصلُ شَجَرَةٍ.وَعَن ابْن جَنْبَةَ: الجَذْرُ جَذْرُ الْكَلَام، وَهُوَ أَن يكونَ الرجلُ مُحَكَّماً لَا يستعينُ
                بأَحَد، وَلَا يَرُدُّ عَلَيْهِ أَحدٌ، وَلَا يُعَابُ، فَيُقَال: قاتَلَه اللهُ كَيفَ يَجْذِرُ فِي المُجَادَلَة:
                وَفِي حَدِيث الزُّبَيْر: (احْبس الماءَ حَتَّى يَبْلُغَ الجَذْرَ) ؛ يريدُ مَبْلَغَ تَمَامِ الشُّرْب؛ مِن جَذْر
                الحسَاب. وَقيل: أَرادَ أَصْلَ الْحَائِط. والمحفوظُ بالدّال المهملَة وَقد تقدَّم. وَفِي حَدِيث عَائِشَة: (سأَلتُه
                عَن الجَذْر، فَقَالَ: هُوَ الشّاذَرْوَانُ الفارغُ من البناءِ حَولَ الكعبةِ) .والمُجْذَئِرُّ مِن القُرُون حِين
                يُجَاوِزُ النُّجُومَ وَلم يَغْلُظ.وَمن النّبات: الَّذِي نَبَت وَلم يَطُلْ.والمُجْذئِرُّ أَيضاً: الوَتِدُ.والجِذْرِيَّة،
                بِالْكَسْرِ: السِّنُّ الَّتِي بعد الرَّبَاعِيَةِ.والجِذُرَة، بِالْكَسْرِ: بَطْنٌ مِن كَعْب بن القَيْن. وجُذْران،
                كعُثمان: بَطْنٌ من غافِق، مِنْهُم: أَبو يعقوبَ إِسحاقَ بن يَزيد الجُذْرانيُّ.'
