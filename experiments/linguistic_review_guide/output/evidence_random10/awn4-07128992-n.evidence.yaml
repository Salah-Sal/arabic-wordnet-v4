            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              جذر وكت مجل مجل نبر أَبُو عبيد: فِي حَدِيث حُذَيْفَة أَنه قَالَ: حَدثنَا رَسُول الله صلى الله عَلَيْهِ وَسلم حديثين: قد رَأَيْت أَحدهمَا وَأَنا أنْتَظر الآخر حَدثنَا أَن الْأَمَانَة نزلت فِي جذر قُلُوب الرِّجَال ثمَّ نزل الْقُرْآن فَعَلمُوا من الْقُرْآن وَعَلمُوا من السّنة قَالَ: ثمَّ حَدثنَا عَن رفع الْأَمَانَة فَقَالَ: ينَام الرجل النومة فتُقبَض الْأَمَانَة من قلبه فيظلّ أَثَرهَا كأثر الوَكْتِ ثمَّ ينَام النومة فتُقبَض الْأَمَانَة من قلبه فيظلّ أَثَرهَا كأثر المَجَل كجمرٍ دحرجتَه على رجلك فتراه منتثرا وَلَيْسَ فِيهِ شَيْء وَلَقَد أَتَى عليّ زمَان وَمَا أُبَالِي أَيّكُم بَايَعت لَئِن كَانَ مُسلما ليردنه عَليّ إِسْلَامه وَلَئِن كَانَ يَهُودِيّا أَو نَصْرَانِيّا ليردنه عليّ ساعيه فَأَما الْيَوْم فَمَا كنت لأبايع إِلَّا فلَانا وَفُلَانًا. قَالَ الْأَصْمَعِي وَغَيره: جَذْر قُلُوب الرِّجَال الجَذْر: الأَصْل من كل شَيْء [وَقَالَ زُهَيْر: (الطَّوِيل)
              وسامِعتَين تَعرِف العِتق فيهمَا ... إِلَى جَذْرِ مدلوك الكُعوب محدَّدِ
              يَعْنِي قرن بقرة وصفهَا -] . وَقَالَ أَبُو عَمْرو: هُوَ الجِذر بِالْكَسْرِ والأصمعي يَقُول: هُوَ بِالْفَتْح. وَقَوله: كأثر الوَكْت الوَكْت هُوَ أثر الشَّيْء الْيَسِير مِنْهُ قَالَ الْأَصْمَعِي: يُقَال للبسر إِذا بدا فِيهِ الإرطاب: بسر مُوَكت. وَأما المَجْل هُوَ أثر الْعَمَل فِي الْكَفّ يعالج بهَا الْإِنْسَان الشَّيْء حَتَّى يغلظ جلدهَا يُقَال مِنْهُ: مَجَلتُ يَده ومَجِلتْ لُغَتَانِ. وَأما المنتبر فالمُتَنفط. وَقَوله: أَتَى عليّ زمَان وَمَا أُبَالِي أَيّكُم بايعتُ كَانَ كثير من النَّاس يحملهُ على بيعَة الْخلَافَة وَهَذَا خطأ فِي التَّأْوِيل وَكَيف يكون على بيعَة الْخلَافَة / وَهُوَ يَقُول: لَئِن كَانَ يَهُودِيّا أَو نَصْرَانِيّا ليردنه عَليّ ساعيه فَهَل 6 / ب يُبَايع على الْخلَافَة الْيَهُودِيّ وَالنَّصْرَانِيّ وَمَعَ هَذَا أَنه لم يكن يجوز أَن يُبَايع كل وَاحِد فَيَجْعَلهُ خَليفَة وَهُوَ لَا يرى أَو لَا يرضى بِأحد بعد عمر فَكيف يتَأَوَّل عَلَيْهِ هَذَا إِنَّمَا مذْهبه فِيهِ أَنه أَرَادَ مبايعة البيع والشرى إِنَّمَا ذكر الْأَمَانَة وَأَنَّهَا قد ذهب من النَّاس يَقُول: فلستُ أَثِق الْيَوْم بِأحد [أتَّمِنه -] على بيع وَلَا شرى إِلَّا فلَانا وَفُلَانًا يَقُول لقلَّة الإمانة فِي النَّاس. وَقَوله: ليردنه عَليّ ساعيه يَعْنِي الْوَالِي الَّذِي عَلَيْهِ يَقُول: يُنصفني مِنْهُ إِن لم يكن لَهُ إِسْلَام وكل من ولي شَيْئا على قوم فَهُوَ ساع عَلَيْهِم وَأكْثر مَا يُقَال ذَلِك فِي وُلَاة الصَّدَقَة: هم السعاة [وَقَالَ الشَّاعِر:
              (الْبَسِيط)
              سعى عِقالا فَلم يَتْرُك لنا سَبَداً ... فَكيف لَو قد سعى عَمْرو عِقالين -]
              [سعى عَلَيْهَا: عمل عَلَيْهَا -] .
