              text: '(ج ذ ر) : (الْجَذْرُ) أَصْلُ الْحِسَابِ كَالْعَشَرَةِ تُضْرَبُ فِي عَشَرَةٍ فَيَكُونُ جَذْرُ الْمِائَةِ
                وَيُسَمَّى الْمُجْتَمِعُ مِنْهُ مَجْذُورًا وَهُوَ نَوْعَانِ نَاطِقٌ وَأَصَمُّ وَفِي كَلَامِ عَائِشَةَ - رَضِيَ
                اللَّهُ عَنْهَا - سُبْحَانَ مَنْ لَا يَعْرِفُ الْجَذْرَ الْأَصَمَّ إلَّا هُوَ.'
