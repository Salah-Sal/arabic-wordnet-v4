              جذر: الجَذرُ أصل اللِّسان وأصل الذِّكر، وأصل كل شيء. وأصل الحِساب الذي يقال: عشرة في عشرة أو كذا في كذا، نقول: ما جذره؟ أي ما مبلغُ تمامه فتقول: عشرة في عشرة، مائةٌ، (وخمسةٌ في خمسة، خمسة وعشرون، فجَذرُ مائةٍ عشرة، وجَذرُ خمسةٍ وعشرين خمسةٌ)  . ويقال لِسِقي الماء إذا سُقيت الدَّبَرةُ: قد بَلَغَ الماء جَذره. ويقال للرجل القصير الغليظ: المجذر. والغربة تسمى الجذرة، وهي شجرة يدبغ بها. والذَّغرةُ تسمى الجذرة لسوادها.
              جرذ: الجَرَذُ: داءٌ يأخذ في قوائم الدَّوابِّ، وبِرذَون جَرِذٌ. والجرذ: اسم الذكر من الفأر، والجميع الجِرذانُ. قال زائدة: الجِرذانُ: أكبر من الفأرة. والمُجَرَّذ والمُجَرَّسُ والمُضَرَّسُ والمُقَتَّل: المجرَّب للأمور.
