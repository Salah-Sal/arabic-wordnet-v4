            definitions_text: 'جذر: (الجَذْرُ) بِفَتْح فَسُكُون: (القَطْعُ) ، يُقَال: جَذَرَ الشيْءَ جَذْراً، إِذا قَطَعَه.(و)
              الجَذْرُ: (الأَصْلُ) من كلِّ شيْءٍ (أَو) هُوَ (أَصْلُ اللِّسانِ، و) أَصْلُ (الذَّكَرِ) . قَالَ شَمِرٌ: إِنِ
              لَشَديدُ جَذْر اللِّسَان، وشَديدُ جذْر الذَّكَر، أَي أَصْلِه، قَالَ الفرزدق:رَأَتْ كَمَراً مثلَ الجَلَامِيدِ
              أَفْتَحَتْأَحاليلَها حَتَّى اسْمأَدَّتْ جُذُورُهَا(و) الجَذْرُ: أَصْلُ (الحِسَابِ) والنَّسَب، (ويُكْسَرُ فيهنّ،
              أَو فِي أَصْل الحِسَاب بِالْكَسْرِ فَقَط) ، بالفَتْحُ عَن الأَصمعيِّ، والكسرُ عَن أَبي عمْرٍ وَفِي الكلِّ. وَقَالَ
              ابْن جبَلَةَ: سأَلتُ ابنَ الأَعْرَابيِّ عَنهُ، فَقَالَ: هُوَ جَذْرٌ، قَالَ: وَلَا أَقول جِذْر.وَفِي الأَساس:
              يُقَال: مَا جَذْرُ هاذا العَددِ وَمَا جُدَاؤُه أَي أصلُه ومَبْلَغُه. إِذا ضَرَبَ ثَلَاثَة فِي ثَلَاثَة؛ فالجَذْرُ
              الثلاثةُ، والجُداءُ التِّسْعةُ.وَفِي اللِّسان: والحِسابُ الَّذِي يُقال لَهُ عشَرَةٌ فِي عَشَرة، وَكَذَا فِي
              كَذَا، تَقول: مَا جَذْرُه؟ أَي مَا يبلغُ تَمامُه؟ فَتَقول: عشرةٌ فِي عشرَة مائةٌ، وخمسةٌ فِي خَمْسَة خمسةٌ وَعِشْرُونَ؛
              أَي فجَذْرُ مائَة عشرةٌ، وجَذْرُ خَمْسَة وَعشْرين خمسةٌ، وعشرةٌ فِي حِسَاب الضَّرْب جَذْرُ مائَة.(و) الجَذْرُ:
              (الاسْتِئْصَالُ) ، يُقَال: جَذَرتُ الشيءَ جَذْراً، استأْصلتُه، (كالإِجْذَار) ، عَن أَبي زَيْد.(و) الجَذْرُ:
              (مَغْرِزُ العُنُقِ) ، عَن الهَجَريّ، وأَنشدَ:تَمُجُّ ذَفارِيهنَّ مَاء كأَنَّهعَصِيمٌ على جَذْرِ السَّوالفِ مُغْفُرُ(ج
              جُذُورٌ) بالضمّ.(والجُؤْذُرُ) ، بضمّ الْجِيم والذال مهموزاً (وتُفْتَحُ الذّالُ) أَيضاً، (والجيذَرُ) ، بِكَسْر
              الْجِيم وَسُكُون التحتيَّةِ، وَفِي بعض النُّسَخ بِفَتْح الجيمِ، (والجُوذَرُ، بِالْوَاو) من غير هَمْز (كفُوفَل،
              و) الجَوْذَرُ، مثلُ (كَوْكَب، والجَوْذِرُ، بفتحِ الْجِيم وكسرِ الذّالِ) ، فَهِيَ سِتُّ لُغَات، ذَكَر الجوهَريُّ
              مِنْهَا لُغَتَيْن، وَزَاد الصغانيُّ اثنتَيْن، وهما كفُوفَل وكَوْكَبٍ، وَهِي (ولَدُ البَقَرَةِ الوَحْشِيَّةِ)
              ، كَذَا فِي الصّحاح، والجمعُ جآذِرُ.(وبَقَرَةٌ مُجْذِرٌ) ، كمُحْسِنٍ: ذَات جُوذَرٍ. قَالَ ابْن سِيدَه: ولذالك
              حَكَمنا بِزِيَادَة همزةِ جُؤْذر، ولأَنها تُزاد ثَانِيَة كثيرا. وحَكَى ابنُ جِنِّي أَنْ جَوْذَراً مثْل كَوْثَرٍ
              لغةٌ فِي جُؤْذَر، وهاذا مِمَّا يَشهدُ لَهُ أَيضاً بالزِّيادَة؛ لأَن الْوَاو ثَانِيَة لَا تكون أَصلاً فِي بَنَات
              الأَربعة.والجَيْذَرُ: لغةٌ فِي الجَوْذَرِ، قَالَ ابْن سِيدَه: وَعِنْدِي أَن الجَيْذَرَ والجَوْذَرَ عربيّان،
              والجُؤْذُر والجُؤْذَرُ فارسيّانِ.(وانْجَذَرَ) الحَبْلُ والصّاحِبُ، وَمن كلِّ شيْءٍ (انْقَطَعَ) قَالَ الشَّاعِر:يَا
              طَيْبَ حالَ قضاءُ اللهِ دُونكمُواسْتحْصَدَ الحَبْلِ مِنْكِ الْيَوْم فانْجَذرَا(واجْذَأَرَّ) كاقْشعَرَّ: (انْتصَبَ)
              فَلم يبْرَحْ، هُوَ مُجْذئِرٌّ، قَالَه ابْن بُزرْج.وَعَن اللَّيْث: اجْذأَرَّ: انْتصَبَ (للِسّبَابِ) والمُخاصَمَةِ،
              قَالَ الطِّرِمّاح:تَبيتُ على أَطْرَافِهَا مُجْذئِرَّةًتُكابِدُ هَمًّا مثلَ هَمِّ المُرَاهِنِ(و) اجْذأَرٌ (النَّبَات:
              نبَتَ وَلم يَطلُ) ، فَهُوَ مُجْذئِرٌّ.(والجَيْذَرَة: سَمَكةٌ كالزَّنْجِيِّ الأَسْوَدِ الضَّخْمِ) القصِيرِ.(والمُجَذَّرُ:
              كمُعظَّمٍ) : لقبُ (عبد اللهِ بنِ ذِيَادٍ) ككِتابٍ (البَلَوِيّ) قتلَ سُوَيْدَ بن الصّامِتِ فِي الجاهليّة، فهاج
              قتلُه وَقعةَ بُعاث، ثمَّ استشهِدَ يومَ أُحُد، قَتله الحارثُ بنُ سُوَيْدِ بنِ الصامتِ بأَبِيه، وارتدَّ ولَحِق
              بمكّة، ثمَّ أَتَى مُسْلِماً بعد الفَتْح، فقتلَه النبيُّ صلَّى اللهُ عليْه وسلّم بالمُجَذَّر، بأَمْرِ جِبْرِيل
              عَلَيْهِ السَّلامُ، فِيمَا وَرَدَ. (وعَلْقمَةُ بنُ المُجَذَّرِ) ، واسمُه الأَعْوَرُ بنُ جَعْدَة (الكِنانِيُّ)
              المُدْلجيا، اسْتَعْملهُ النبيُّ صلَّى اللهُ عليْه وسلَّم على سَرِيَّة، (صَحَابِيّانِ) .(و) المُجَذَّرُ: (القصِيرُ
              الغلِيظُ، الشَّثْنُ الأَطْرَافِ) ، وَزَاد فِي التَّهْذِيب: من الرِّجَال، والأُنثى بالهَاءِ (كالجَيْذَرِ) . وأَنشد
              أَبو عَمْرو لأَبي السَّوْداءِ العِجْلِيّ:تعَرَّضتْ مُرَيْئَةُ الحَيّاكِلناشِيءٍ دَمَكْمَكٍ نَيّاكِالبُهْتُرِ
              المُجَذَّرِ الزَّوّاكِ(أَو هاذه) ، أَي الجَيْذر، (بالمهملَة، ووهِمَ الجوهريُّ) فِي إِعجام الذّالِ مِنْهَا. قَالَ
              شيخُنا:وجَزَم القاضِي زَكَرِيّاءُ فِي حَاشِيَتِه على البَيْضَاوِيِّ بأَنه بالموحَّدة بعد الجِيم والذّال المعجَمَة،
              وتَبِعَه السُّيُوطِيُّ فِي حاشِيَتِه، وتَعَقَّبَهما الخَفَاجِيُّ وعبدُ الحَكِيم. أَي فِي أَصْلها.والجَذْرُ أَصلُ
              شَجَرَةٍ.وَعَن ابْن جَنْبَةَ: الجَذْرُ جَذْرُ الْكَلَام، وَهُوَ أَن يكونَ الرجلُ مُحَكَّماً لَا يستعينُ بأَحَد،
              وَلَا يَرُدُّ عَلَيْهِ أَحدٌ، وَلَا يُعَابُ، فَيُقَال: قاتَلَه اللهُ كَيفَ يَجْذِرُ فِي المُجَادَلَة: وَفِي
              حَدِيث الزُّبَيْر: (احْبس الماءَ حَتَّى يَبْلُغَ الجَذْرَ) ؛ يريدُ مَبْلَغَ تَمَامِ الشُّرْب؛ مِن جَذْر الحسَاب.
              وَقيل: أَرادَ أَصْلَ الْحَائِط. والمحفوظُ بالدّال المهملَة وَقد تقدَّم. وَفِي حَدِيث عَائِشَة: (سأَلتُه عَن
              الجَذْر، فَقَالَ: هُوَ الشّاذَرْوَانُ الفارغُ من البناءِ حَولَ الكعبةِ) .والمُجْذَئِرُّ مِن القُرُون حِين يُجَاوِزُ
              النُّجُومَ وَلم يَغْلُظ.وَمن النّبات: الَّذِي نَبَت وَلم يَطُلْ.والمُجْذئِرُّ أَيضاً: الوَتِدُ.والجِذْرِيَّة،
              بِالْكَسْرِ: السِّنُّ الَّتِي بعد الرَّبَاعِيَةِ.والجِذُرَة، بِالْكَسْرِ: بَطْنٌ مِن كَعْب بن القَيْن. وجُذْران،
              كعُثمان: بَطْنٌ من غافِق، مِنْهُم: أَبو يعقوبَ إِسحاقَ بن يَزيد الجُذْرانيُّ.'
