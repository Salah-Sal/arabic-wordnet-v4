            headword: محرك ذو كباسين متضادين
            headword_bare: محرك ذو كباسين متضادين
            headword_norm: محرك ذو كباسين متضادين
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'هو [محرك ثنائي الشوط](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88733)
              مُزود بكبّاسين تابعين لحيز احتراق واحد (انظر: الكبّاسان المتضادان). يعمل كلا الكبّاسين على مسمار مرفقي مشترك
              للعمود المرفقي، حيث يتحكم أحدهما في دخول الشحنة الجديدة (دفق زائد)، بينما يتحكم الآخر في صرف العادم. ويتزامن
              دائماً وجود الكبّاسين عند النقطتين الميتتين. وتبعاً لترتيب أذرع التوصيل على [العمود المرفقي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88102)
              فإن الكبّاسين يتحركان إمّا لأعلى أو لأسفل في وقت واحد (تزامنياً) أو يتحركان أثناء الأشواط بنسبة تفاوت زمني متبادلة.
              جدير بالذكر أن المحرك ذو الكبّاسين المتضادين قد بَطَل تصنيعه حالياً.'
            translation_en: double piston engine
            translation_fr: moteur à piston double [m.]
            domain: Automotive Engineering
