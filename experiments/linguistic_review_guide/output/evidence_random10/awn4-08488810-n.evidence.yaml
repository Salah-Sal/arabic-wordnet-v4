      headword: نظام فعَّال لتعزيز اتزان مجموعة الحركة على الطريق
      headword_bare: نظام فعال لتعزيز اتزان مجموعة الحركة على الطريق
      headword_norm: نظام فعال لتعزيز اتزان مجموعة الحركة علي الطريق
      root: نظم
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: هو التحكم الفعال في التأرجح طبّقته شركة ستروين (Citroen) عام 1995، وهو مبني على أساس نظام التعليق
        الهيدروبنيوماتي المعروف. وعند القيادة في المنحنيات، تُملأ بضغط الزيت نهايات قضبان الموازنة المصممة على هيئة أسطوانات
        هيدرولية خطية، وبذلك يكاد ينعدم تماماً حدوث ميل جانبي للسيارة. ويشبه النظام في بنيته التصميمية نظام التحكم الفعال
        في التعليق (ASCS)
