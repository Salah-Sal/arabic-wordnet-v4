          - entry_id: 372797
            dictionary_id: 52
            headword: محرك CHT
            headword_bare: محرك CHT
            headword_norm: محرك CHT
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'يعني الاختصار CHT في اللغة الإنجليزية: Controlled High Turbulence، أي التدويم المحكوم للخليط،
              وهو النظام المُزود به المحرك ذو قدرة 66 كيلو واط لسيارات فيات (Fiat). ويقوم هذا النظام على وجود قناتي سحب متباينتى
              الحجم لكل أسطوانة من أسطوانات المحرك. إذا كانت سرعة دوران المحرك أقل من 3000 لفة/الدقيقة، فإنه يتم ضخ [خليط
              الهواء والوقود](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88248) عبر القناة الصغيرة،
              الأمر الذي يظهر أثره في زيادة سرعات دفق الخليط ويؤدي إلى إحداث تدويم يتسم بالكثافة الشديدة بفضل الشكل الخاص
              للقناة. أمّا إذا تجاوزت سرعة المحرك 3000 لفة/الدقيقة، فإن نظام الصمامات الخانقة يفتح أيضاً القناة الكبيرة المؤدية
              إلى صمامات السحب.'
