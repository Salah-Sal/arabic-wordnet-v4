        definitions_text: 'engine : آلةٌ تُحوِّل الطاقة إلى شغل ( الشغل = قوة x مسافة ). وهو أنواع: منها ما هو حرارى ( تردُّدى
          أو دَوَّار), وهو يُحَوِّلُ الطَّاقة الحرارية إلى شغل, ومنه مُحَرِّك احتراق داخلى... وكذلك هناك ما هو كَهْربائىّ
          يُحَوِّل الطاقة الكهربائيّة إلى شغل ويسمّى عادة "مُوتورا كهرِبائِيًّا"'
