                ذات الشوط القصير بانخفاض [سرعة الكبّاس](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88133).
                ويمكن بسبب الطول الكبير نسبياً ل[رأس الأسطوانة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88050)
                تركيب صمامات وقنوات أكبر فيها، كما يمكن تزويد [العمود المرفقي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88102)
                بعدد أمثل من المحامل (محمل رئيسي بين كل مرفقين في العمود المرفقي).
