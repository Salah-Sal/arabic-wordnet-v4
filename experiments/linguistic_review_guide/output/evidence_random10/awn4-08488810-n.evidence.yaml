          - entry_id: 373043
            dictionary_id: 52
            headword: محرك 'فانكل' ذو كبّاس دوّار
            headword_bare: محرك 'فانكل' ذو كباس دوار
            headword_norm: محرك 'فانكل' ذو كباس دوار
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'هو [محرك احتراق داخلي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87925)
              مُزود بمكبس دوّار (يُطلق عليه أيضاً اسم العضو الدوّار) أو بعدة مكابس دوّارة. وعلى الرغم من أن مُصطلح ''محرك
              فانكل''، المُسمى كذلك على اسم مُخترعه فيلكس فانكل (Felix Wankel)، قد تأصَّل اليوم لغوياً في استخدامات الألمان
              اليومية، إلا أنه من الأفضل أن نُطلق عليه اسم المحرك ذي المكبس الدائر أو المحرك الدوّار. ولا يحتوي محرك ''فانكل''
              على أجزاء إدارة مُتحركة ترددية الحركة، مثلما هي الحال مع المحرك ذي المكبس الترددي. مما يكفل ضبط اتزان المحرك
              بالكامل، وهو يتسم لذلك بصفة خاصة بسلاسة وهدوء الدوران، وقلة الاهتزازات. ويتم تشغيل المحرك العامل بطريقة الأربعة
              أشواط على نحو مُشابه للمحرك ثُنائي الشوط، وذلك بدون آليات مُعقدة للصمامات عن طريق فتحات التحكم، ممّا يجعل تصميم
              المحرك بسيطاً إلى حد ما، حيث يتكوّن من مبيت - يُسمى ''الدثار'' - ذي مسار مِدْوَدِيّ الشكل، وعمود لامركزي، ومكبس
              (يُسمى كذلك القرص أو العضو الدوّار). ويتم إحكام حركة المكبس على الدثار والقطاعات الجانبية في جميع مواضع تلامُسه
              بواسطة عناصر منع تسرب. ويتخذ مكبس محرك ''فانكل'' في مقطعه العرضي شكل مُثلث ذي جوانب مُقوسة. كما أن أركان المكبس
              الثلاث أثناء الدوران تنزلق على جدران المبيت، بحيث تنشأ ثلاث غُرف تصغر وتكبر بالتناوب، وتكون كذلك مُنغلقة في
              مقابل بعضها البعض، ومُرحّلة بزاوية مقدارها 120°. ويدور المكبس دورة واحدة فقط في الوقت الذي يدور فيه العمود اللامركزي
              ثلاث دورات. وفي هذه الدورة الواحدة للمكبس تحدث دورة تشغيل كاملة في كل غُرفة من الغُرف الثلاث، ومع وجود الغُرف
              الثلاث فإن هذا يعني إتمام دورة تشغيل مع كل لفة للعمود اللامركزي، مثلما هي الحال مع المحرك رُباعي الشوط ذي أسطوانتين.
              ويتميّز محرك ''فانكل'' بهدوء كبير أثناء الدوران، وسلاسة في التشغيل، مع بساطة في التصنيع، وعدم الحاجة إلى وقود
              ذي رقم أوكتيني مرتفع، فضلاً عن تميّزه بصغر الحجم. إلا أنه لايزال يعيبه [مُعدل استهلاك الوقود](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87964)
              المُرتفع نسبياً، ووجود نسبة عالية من المواد الضارة في غازات العادم. أمّا طريقة عمله فهي على النحو التالي من
              حيث المبدأ: للمحرك أربع أشواط: الشكل A) بعد طرد الجزء المُتبقي من الغازات المُحترقة عن طريق جانب المكبس a (الغُرفة
              a)، يبدأ شوط السحب. بينما في الغُرفة b الممتلئة بشحنات الغاز الجديدة، يحدث الانضغاط، وفي الغُرفة c تتمدد الغازات
              المُشتعلة مُولّدةً القدرة. الشكل B) تواصل الغرفة a عملية السحب، وتقوم الغُرفة b بالضغط. وفي الغُرفة c تكون الغازات
              المُشتعلة قد حققت تأثيرها الكامل، ويكون عنصر منع التسرب قد غادر فتحة التحكم في الطرد، فتخرج منها الغازات المُشتعلة.
              الشكل C) تواصل الغُرفة a سحب خليط البنزين والهواء. أمّا الغُرفة b فتكون قد ضغطت الخليط بالكامل، وبالتالي تقوم
              شرارة إشعال بإشعال خليط البنزين والهواء المضغوط. ويستمر طرد الغازات المُشتعلة من الغُرفة c. الشكل D) الغُرفة
              a أصبحت ممتلئة بشحنات الغاز الجديدة، ويبدأ شوط الانضغاط بمجرد أن يُغلق عنصر منع التسرب فتحة الدخول. وفي الغُرفة
              b تتمدد الغازات المُشتعلة، فتدفع العمود اللامركزي في اتجاه الدوران عن طريق المكبس ويتواصل طرد الغازات المُشتعلة
              من الغُرفة c. ويكاد الشكل التالي - لو تم رسمه - يتطابق مع الشكل A. باستثناء أن المكبس يكون قد دار ثُلْث دورة
              (120°) في المسار مِدْوَدي الشكل مغيراً بذلك الجوانب (يحل الجانب c محل الجانب a) لتتكرر الأشواط الأربعة من جديد.'
