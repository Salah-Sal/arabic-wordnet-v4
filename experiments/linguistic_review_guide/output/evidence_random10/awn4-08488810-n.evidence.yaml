              text: "الحركة:\n[في الانكليزية] Movement ،motion \n[ في الفرنسية] Mouvement \nبفتح الحاء والراء المهملة في العرف\
                \ العام النقل من مكان إلى مكان، هكذا ذكر العلمي في حاشية شرح هداية الحكمة، وهذا هو الحركة الأينية المسماة\
                \ بالنقلة. قال صاحب الأطول: لا تطلق الحركة عند المتكلمين إلّا على هذه الحركة الأينية وهي المتبادرة في استعمالات\
                \ أهل اللغة. وقد تطلق عند أهل اللغة على الوضعية دون الكميّة والكيفية انتهى.\nوهكذا في شرح المواقف. ويؤيد الإطلاقين\
                \ ما وقع في شرح الصحائف من أنّ الحركة في العرف العام انتقال الجسم من مكان إلى مكان آخر، أو انتقال أجزائه كما\
                \ في حركة الرّحى انتهى.\nوعند الصوفية الحركة السلوك في سبيل الله تعالى، كذا في لطائف اللغات:\nثم المتكلمون\
                \ عرّفوا الحركة بحصول جوهر في مكان بعد حصوله في مكان آخر أي مجموع الحصولين لا الحصول في الحيز الثاني المقيّد\
                \ بكونه بعد الحصول في الحيز الأول، وإن كان متبادرا من ظاهر التعريف. ولذا قيل الحركة كونان في آنين في مكانين،\
                \ والسكون كونان في آنين في مكان واحد. ويرد عليه أنّ ما أحدث في مكان واستقر فيه آنين وانتقل منه في الآن الثالث\
                \ إلى مكان آخر لزم أن يكون كون ذلك الحادث في الآن الثاني جزءا من الحركة والسكون، فإنّ هذا الكون مع الكون الأول\
                \ يكون سكونا، ومع الثالث يكون حركة، فلا تمتاز الحركة عن السكون بالذات، بمعنى أنّه يكون الساكن في آن سكونه\
                \ أعني الآن الثاني شارعا في الحركة. فالحق هو المعنى المتبادر من التعريف. ولذا قيل الحركة كون أول في مكان ثان،\
                \ والسكون كون ثان في مكان أول.\nويرد عليه وعلى القول الأول أيضا أنّ الكون في أول زمان الحدوث لا يكون حركة\
                \ ولا سكونا.\nاعلم أنّ الأشاعرة على أنّ الأكوان وسائر الأعراض متجدّدة في كل آن. والمعتزلة قد اتفقوا على أنّ\
                \ السكون كون باق غير متجدّد، واختلفوا في الحركة هل هي باقية أم لا؟ فعلى القول ببقاء الأكوان يردّ على كلا الفريقين\
                \ أنه لا معنى للكونين ولا لكون الكون أولا، وثانيا لعدم تعدّده اللهم إلّا أن يفرض التجدّد فرضا.\nوعلى القول\
                \ بعدم بقائها يرد أن لا يكون الحركة والسكون موجودين لعدم اجتماع الكونين في الوجود، اللهم إلّا أن يقال يكفي\
                \ في وجود الكل وجود أجزائه ولو على سبيل التعاقب.\nوقيل الحق أنّ السكون مجموع الكونين في مكان واحد، والحركة\
                \ كون أول في مكان ثان.\nومما يجب أن يعلم أنّ المراد بكونين في مكان أنّ أقل السكون ذلك وبالكون الثاني في مكان\
                \ أول ما يعمّ الكون الثالث. وعلى هذا قس سائر التعاريف.\nواعلم أيضا أنّ جميع التعاريف لا يشتمل الحركة الوضعية\
                \ لأنّه لا كون للمتحرك بها إلّا في المكان الأول، هكذا يستفاد مما ذكره المولوي عصام الدين والمولوي عبد الحكيم\
                \ في حواشيهما على شرح العقائد النسفية. ويجيء ما يدفع بعض الشكوك في لفظ الكون.\nوأمّا الحكماء فقد اختلفوا في\
                \ تعريف الحركة. فقال بعض القدماء هي خروج ما بالقوة إلى الفعل على التدريج. بيانه أنّ الشيء الموجود لا يجوز\
                \ أن يكون بالقوة من جميع الوجوه وإلّا لكان وجوده أيضا بالقوة، فيلزم أن لا يكون موجودا، فهو إمّا بالفعل من\
                \ جميع الوجوه وهو البارئ تعالى، والعقول على رأيهم أو بالفعل، من بعضها وبالقوة من بعض. فمن حيث إنّه موجود بالقوة\
                \ لو خرج ذلك البعض من القوة إلى الفعل فهو إمّا دفعة وهو الكون والفساد فتبدل الصورة النارية بالهوائية انتقال\
                \ دفعي، ولا يسمّونه حركة بل كونا وفسادا، وإمّا على التدريج وهو الحركة. فحقيقة الحركة هو الحدوث أو الحصول أو\
                \ الخروج من القوة إلى الفعل إمّا يسيرا يسيرا أو لا دفعة أو بالتدريج.\nوكل من هذه العبارات صالحة لإفادة تصوّر\
                \ الحركة. لكن المتأخّرين عدلوا عن ذلك لأنّ التدريج هو وقوع الشيء في زمان بعد زمان، فيقع الزمان في تعريفه،\
                \ والزمان مفسّر بأنّه مقدار الحركة، فيلزم الدور. وكذا الحال في اللادفعة، وكذا معنى يسيرا يسيرا. فقالوا الحركة\
                \ كمال أول لما هو بالقوة من جهة ما هو بالقوة.\nوهكذا قال أرسطو. وتوضيحه أنّ الجسم إذا كان في مكان مثلا وأمكن\
                \ حصوله في مكان آخر فله [هناك] إمكانان، إمكان الحصول في المكان الثاني، وإمكان التوجّه إليه. وكلّ ما هو ممكن\
                \ الحصول له فإنه إذا حصل كان كمالا له، فكل من التوجه إلى المكان الثاني والحصول فيه كمال، إلّا أنّ التوجّه\
                \ متقدّم على الحصول لا محالة، فوجب أن يكون الحصول بالقوة ما دام التوجّه بالفعل. فالتوجّه كمال أول للجسم الذي\
                \ يجب أن يكون بالقوة في كماله الثاني الذي هو الحصول. ثم إنّ التوجّه ما دام موجودا فقد بقي منه شيء بالقوة.\
                \ فالحركة تفارق سائر الكمالات بخاصتين: إحداهما أنها من حيث إنّ حقيقتها هي التأدّي إلى الغير، والسلوك إليه\
                \ تستلزم أن يكون هناك مطلوب ممكن الحصول غير حاصل معها بالفعل ليكون التأدّي تأدّيا إليه، وليس شيء من سائر الكمالات\
                \ بهذه الصفة، إذ ليست ماهيتها التأدّي إلى الغير ولا يحصل فيها واحد من هذين الوصفين. فإنّ الشيء مثلا إذا كان\
                \ مربعا بالقوة ثم صار مربعا بالفعل فحصول المربعية من حيث هو هو لا يستعقب شيئا ولا يبقى عند حصولها شيء منها\
                \ بالقوة. وأما الإمكان الاستعدادي وإن كان يستلزم أن لا يكون المقبول غير حاصل معه بالفعل فإنّ التحقيق أنّ الاستعداد\
                \ يبطل مع الفعل لكن حقيقتها ليس التأدّي. وثانيتهما أنها تقتضي أن يكون شيء منها بالقوة فإنّ المتحرّك إنما يكون\
                \ متحركا إذا لم يصل إلى المقصد، فإنّه إذا وصل إليه فقد انقطع حركته، وما دام لم يصل فقد بقي من الحركة شيء بالقوة.\
                \ فهوية الحركة مستلزمة لأن يكون محلها حال اتصافه بها يكون مشتملا على قوتين، قوة بالقياس إليها وقوة أخرى بالقياس\
                \ إلى ما هو المقصود بها. أما القوة التي بالنسبة إلى المقصد فمشتركة بلا تفاوت بين الحركة، بمعنى القطع والحركة\
                \ بمعنى التوسط. فإنّ الجسم ما دام في المسافة لم يكن واصلا إلى المنتهى، وإذا وصل إليه لم تبق الحركة أصلا. وأما\
                \ القوة الأخرى ففيها تفاوت بينهما، فإنّ الحركة بمعنى القطع حال اتصاف المتحرّك بها يكون بعض أجزائها بالقوة\
                \ وبعضها بالفعل. فالقوة والفعل في ذات شيء واحد. والحركة بمعنى التوسّط إذا حصلت كانت بالفعل، ولم تكن هناك قوة\
                \ متعلّقة بذاتها، بل بنسبتها إلى حدود المسافة. وتلك النسبة خارجة عن ذاتها عارضة لها كما ستعرف. فقد ظهر أنّ\
                \ الحركة كمال بالمعنى المذكور للجسم الذي هو بالقوة في ذلك الكمال وفيما يتأدّى إليه ذلك الكمال. وبقيد الأول\
                \ تخرج الكمالات الثانية، وبقيد الحيثية المتعلّقة بالأول تخرج الكمالات الأولى على الإطلاق، أعني الصورة النوعية\
                \ لأنواع الأجسام والصور الجسمية للجسم المطلق فإنّها كمالات أولى لما بالقوة، لكن لا من هذه الحيثية بل مطلقا،\
                \ لأنّ تحصيل هذه الأنواع والجسم المطلق في نفسه إنّما هو بهذه الصور وما عداها من أحوالها تابعة لها، بخلاف الحركة\
                \ فإنّها كمال أول من هذه الحيثية فقط، وذلك لأنّ الحركة في الحقيقة من الكمالات الثانية بالقياس إلى الصور النوعية.\n\
                وإنّما اتصفت بالأولية لاستلزامها ترتّب كمال آخر عليها بحيث يجب كونه بالقوة معها فهي أول بالقياس إلى ذلك الكمال،\
                \ وكونه بالقوة معها لا مطلقا. فالحاصل أنّ الحركة كمال أول للجسم الذي هو بالقوة في كماله الثاني بحيث يكون أوليته\
                \ من جهة الأمر الذي هو له بالقوة بأن تكون أولية هذا الكمال بالنسبة إليه.\nوهاهنا توجيهان آخران. الأول أن يكون\
                \ قولهم من جهة ما هو بالقوة متعلّقا بما يتعلّق به قولهم لما هو بالقوة كالثابت والحاصل، فيكون المعنى كمال أول\
                \ حاصل للجسم الذي يجب كونه معه بالقوة في كماله الثاني، ومتعلّق به من جهة كونه بالقوة، وذلك لأنّ الحركة كمال\
                \ بالنسبة إلى الوصول أو بقية الحركة للجسم الذي يجب كونه معه بالقوة في كماله الثاني، وحصوله له من جهة كونه\
                \ بالقوة إذ على تقدير الوصول أو بقية الحركة بالفعل تكون الحركة منقطعة غير حاصلة للجسم. وبيان فائدة القيود\
                \ مثل ما مرّ، لكن بقي انتقاض تعريف الحركة بالإمكان الاستعدادي إذ يصدق أنّه كمال بالنسبة إلى ما يترتب عليه\
                \ سواء كان قريبا أو بعيدا للجسم الذي يجب كونه معه بالقوة في الكمال الثاني، من جهة كونه بالقوة، فإنّه إذا حصل\
                \ ما يترتّب عليه بطل استعداده، وكذلك أولية الاستعداد بالنسبة إلى ما يترتب. والثاني أن يكون متعلّقا بلفظ الكمال\
                \ ويكون المعنى أنّ الحركة كمال أول للجسم الذي هو بالقوة في كماله الثاني من جهة المعنى الذي هو به بالقوة، بأن\
                \ يكون ذلك المعنى سببا لكماليته، وذلك فإنّ الحركة ليست كمالا له من جهة كونه جسما أو حيوانا بل إنما هي كمال\
                \ من الجهة التي باعتبارها كان بالقوة، أعني حصوله في أين مخصوص أو وضع مخصوص أو غير ذلك؛ وفيه نظر، وهو أنّ الحركة\
                \ ليست كمالا من جهة حصوله في أين أو وضع أو غير ذلك، فإنّ كماليتها إنما هو باعتبار حصولها بعد ما كان بالقوة.\n\
                ويردّ على التوجيهات الثلاثة أنه يخرج من التعريف الحركة المستديرة الأزلية الأبدية الفلكية على زعمهم، إذ لا\
                \ منتهى لها إلّا بالوهم، فليس هناك كمالان أول هو الحركة وثان هو الوصول إلى المنتهى إلّا إذا اعتبر وضع معين\
                \ واعتبر ما قبله دون ما بعده؛ إلّا أنّ هذا منتهى بحسب الوهم دون الواقع المتبادر من التعريف. وفي الملخص أنّ\
                \ تصور الحركة أسهل مما ذكر فإنّ كل عاقل يدرك التفرقة بين كون الجسم متحركا وبين كونه ساكنا. وأمّا الأمور المذكورة\
                \ فمما لا يتصورها إلّا الأذكياء من الناس.\nوقد أجيب عنه بأنّ ما أورده يدلّ على تصورها بوجه والتصديق بحصولها\
                \ للأجسام لا على تصوّر حقيقتها.\nاعلم انهم اختلفوا في وجود الحركة.\nفقيل بوجوده وقيل بعدم وجوده. وحاكم بينهم\
                \ ارسطو، فقال: الحركة يقال بالاشتراك اللفظي لمعنيين. الأول التوجّه نحو المقصد وهو كيفية بها يكون الجسم أبدا\
                \ متوسطا بين المبدأ والمنتهى، أي مبدأ المسافة ومنتهاها، ولا يكون في حيّز آنين بل يكون في كل آن في حيّز آخر،\
                \ وتسمّى الحركة بمعنى التوسط. وقد يعبر عنها بأنها كون الجسم بحيث أي حدّ من حدود المسافة يفرض لا يكون هو قبل\
                \ الوصول إليه ولا بعده حاصلا فيه، وبأنها كون الجسم فيما بين المبدأ والمنتهى بحيث أي آن يفرض يكون حاله في ذلك\
                \ الآن مخالفا لحاله في آنين يحيطان به، والحركة بهذا المعنى أمر موجود في الخارج، فإنّا نعلم بمعاونة الحسّ أنّ\
                \ للمتحرك حالة مخصوصة ليست ثابتة له في المبدأ ولا في المنتهى، بل فيما بينهما، وتستمر تلك الحالة إلى المنتهى\
                \ وتوجد دفعة. ويستلزم اختلاف نسب المتحرك إلى حدود المسافة فهي باعتبار ذاتها مستمرة وباعتبار نسبتها إلى تلك\
                \ الحدود سيالة وبواسطة استمرارها وسيلانها تفعل في الخيال أمرا ممتدا غير قارّ هو الحركة بمعنى القطع. فالحركة\
                \ بمعنى التوسّط تنافي استقرار المتحرّك في حيّز واحد سواء كان منتقلا عنه أو منتقلا إليه، فتكون ضدا للسكون في\
                \ الحيّز المنتقل عنه وإليه، بخلاف من جعل الحركة الكون في الحيّز الثاني كما يجيء في لفظ الكون. الثاني الأمر\
                \ الممتد من أول المسافة إلى آخرها ويسمّى الحركة بمعنى القطع ولا وجود لها إلّا في التوهم، إذ عند الحصول في\
                \ الجزء الثاني بطل نسبته إلى الجزء الأول منها ضرورة، فلا يوجد هناك أمر ممتد من مبدأها إلى منتهاها. نعم لما\
                \ ارتسم نسبة المتحرك إلى الجزء الثاني الذي أدركه في الخيال قبل أن يزول نسبته إلى الجزء الأول الذي تركه عنه،\
                \ أي عن الخيال، يخيّل أمر ممتد، كما يحصل من القطرة النازلة والشعلة المدارة أمر ممتد في الحسّ المشترك فيرى\
                \ لذلك خطّا ودائرة.\nالتقسيم\nالحركة إمّا سريعة أو بطيئة. فالسريعة هي التي تقطع مسافة مساوية لمسافة أخرى في\
                \ زمان أقلّ من زمانها، ويلزمها أن تقطع الأكثر من المسافة في الزمان المساوي. أعني إذا فرض تساوي الحركتين في\
                \ المسافة كان زمان السريعة أقلّ، وإذا فرض تساويهما في الزمان كانت مسافة السريعة أكثر. فهذان الوصفان لا زمان\
                \ للسريعة مساويان لها. ولذلك عرفت بكلّ واحد منهما.\nوأمّا قطعها لمسافة أطول في زمان أقصر فخاصة قاصرة. والبطيئة\
                \ عكسها فتقطع المساوي من المسافة في الزمان الأكثر أو تقطع الأقل من المسافة في الزمان المساوي، وربما قطعت مسافة\
                \ أقل في زمان أكثر لكنه غير شامل لها. والاختلاف بالسرعة والبطء ليس اختلافا بالنوع إذ الحركة الواحدة سريعة\
                \ بالنسبة إلى حركة والبطيئة بالنسبة إلى أخرى، ولأنهما قابلان للاشتداد والنقص.\nفائدة:\nقالوا علّة البطء في\
                \ الطبيعة ممانعة المخروق الذي في المسافة، فكلما كان قوامه أغلظ كان أشدّ ممانعة للطبيعة وأقوى في اقتضاء بطء\
                \ الحركة كالماء مع الهواء، فنزول الحجر إلى الأرض في الماء أبطأ من نزوله إليها في الهواء.\nوأمّا في الحركات\
                \ القسرية والإرادية فممانعة الطبيعة إمّا وحدها لأنه كلما كان الجسم أكبر أو كانت الطبيعة السارية فيه أكبر كان\
                \ ذلك الجسم بطبيعته أشدّ ممانعة للقاسر، والمحرك بالإرادة وأقوى في اقتضاء البطء وإن اتحد المخروق والقاسر والمحرّك\
                \ الإرادي. ومن ثمّ كان حركة الحجر الكبير أبطأ من حركة الصغير في مسافة واحدة من قاسر واحد، أو ممانعة الطبيعة\
                \ مع ممانعة المخروق كالسهم المرمي بقوة واحدة تارة في الهواء، وكالشخص السائر فيهما بالإرادة، وربّما عاوق أحدهما\
                \ أكثر والآخر أقل فتعادلا، مثل أن يحرك قاسر واحد الجسم الكبير في الهواء والصغير في الماء الذي يزيد معاوقة\
                \ الهواء بمقدار الزيادة التي في طبيعته. وأيضا الحركة إمّا أينية وهي الانتقال من مكان إلى مكان تدريجا وتسمّى\
                \ النقلة، وإمّا كمية وهي الانتقال من كم إلى كم آخر تدريجا وهو أولى مما ذكره الشارح القديم من أنّها انتقال\
                \ الجسم من كمّ إلى كمّ على التدريج، إذ قد ينتقل الهيولى والصورة أيضا من كم إلى كم، وهذه الحركة تقع على وجوه\
                \ التخلخل والتكاثف والنمو والذبول والسّمن والهزال، وإمّا كيفية وهي الانتقال من كيفية إلى أخرى تدريجا وتسمّى\
                \ بالاستحالة أيضا، وإمّا وضعية وهي أن يكون للشيء حركة على الاستدارة، فإنّ كلّ واحد من أجزاء المتحرّك يفارق\
                \ كلّ واحد من أجزاء مكانه لو كان له مكان، ويلازم كله مكانه، فقد اختلفت نسبة أجزائه إلى أجزاء مكانه على التدريج.\
                \ وقولهم لو كان له مكان ليشمل التعريف فلك الأفلاك.\nوالمراد بالحركة المستديرة ما هو المصطلح وهو ما لا يخرج\
                \ المتحرّك بها عن مكانه لا اللغوي فإنّ معناها اللغوي أعمّ من ذلك، فإنّ الجسم إذا تحرك على محيط دائرة يقال\
                \ إنه متحرك بحركة مستديرة، فعلى هذا حركة الرحى وضعية وكذا حركة الجسم الآخر الذي يدور حول نفسه من غير أن تخرج\
                \ عن مكانه حركة وضعية. وقيل الحركة الوضعية منحصرة في حركة الكرة في مكانها وليس بشيء إذ الحركة في الوضع هي\
                \ الانتقال من وضع إلى وضع آخر تدريجا. وقيل حصر الوضعية في الحركة المستديرة أيضا ليس بشيء على ما عرفت من معنى\
                \ الحركة في الوضع، كيف والقائم إذا قعد فقد انتقل من وضع إلى وضع آخر مع أنّه لا يتحرك على الاستدارة وثبوت الحركة\
                \ الأينية لا ينافي ذلك.\nنعم لا توجد الوضعية هناك على الانفراد.\nوبالجملة فالحق أنّ الحركة الوضعية هي الانتقال\
                \ من وضع إلى وضع كما عرفت، فكان الحصر المذكور بناء على إرادة الحركة الوضعية على الانفراد. ولذا قيل الحركة\
                \ الوضعية تبدل وضع المتحرك دون مكانه على سبيل التدريج، وتسمّى حركة دورية أيضا انتهى.\nوهذا التقسيم بناء على\
                \ أنّ الحركة عند الحكماء لا تقع إلّا في هذه المقولات الأربع، وأما باقي المقولات فلا تقع فيها حركة لا في الجوهر\
                \ لأنّ حصوله دفعي ويسمّى بالكون والفساد، ولا في باقي مقولات العرض لأنها تابعة لمعروضاتها، فإن كانت معروضاتها\
                \ مما تقع فيه الحركة تقع في تلك المقولة الحركة أيضا وإلّا فلا. ومعنى وقوع الحركة في مقولة عند جماعة هو أنّ\
                \ تلك المقولة مع بقائها بعينها تتغير من حال إلى حال على سبيل التدريج، فتكون تلك المقولة هي الموضوع الحقيقي\
                \ لتلك الحركة، سواء قلنا إنّ الجوهر الذي هو موضوع لتلك المقولة موصوف بتلك الحركة بالعرض وعلى سبيل التبع أو\
                \ لم نقل وهو باطل، لأنّ التسود مثلا ليس هو أنّ ذات السواد يشتدّ لأنّ ذلك السواد إن عدم عند الاشتداد فليس فيه\
                \ اشتداد قطعا، وإن بقي ولم تحدث فيه صفة زائدة فلا اشتداد فيه أيضا، وإن حدثت فيه صفة زائدة فلا تبدل ولا اشتداد\
                \ قطعا ولا حركة في ذات السواد، بل في صفة والمفروض خلافه.\nوعند جماعة معناه أنّ تلك المقولة جنس لتلك الحركة،\
                \ قاموا إنّ من الأين ما هو قارّ ومنه ما هو سيّال، وكذا الحال في الكم والكيف والوضع. فالسيّال من كل جنس من\
                \ هذه الأجناس هو الحركة فتكون الحركة نوعا من ذلك الجنس وهو باطل أيضا إذ لا معنى للحركة إلّا تغيّر الموضوع\
                \ في صفاته على سبيل التدريج، ولا شك أنّ التغيّر ليس من جنس المتغيّر والمتبدّل لأنّ التبدّل حالة نسبية إضافية\
                \ والمتبدّل ليس كذلك، فإذا كان المتبدّل في الحركة هذه المقولات لم يكن شيء منها جنسا للتبدل الواقع فيها. والصواب\
                \ أنّ معنى ذلك هو أنّ الموضوع يتحرك من نوع لتلك المقولة إلى نوع آخر من صنف إلى صنف آخر أو من فرد إلى فرد آخر.\n\
                وأيضا الحركة إمّا ذاتية أو عرضية. قالوا ما يوصف بالحركة إمّا أن تكون الحركة حاصلة فيه بالحقيقة بأن تكون الحركة\
                \ عارضة له بلا توسط عروضها لشيء آخر أو لا تكون، بأن تكون الحركة حاصلة في شيء آخر يقارنه فيوصف بالحركة تبعا\
                \ لذلك، والثاني يقال له إنّه متحرك بالعرض وبالتبع وتسمّى حركته حركة عرضية وتبعية كراكب السفينة، والأول يقال\
                \ له إنّه متحرك بالذات وتسمّى حركته حركة ذاتية.\nوالحركة الذاتية ثلاثة أقسام لأنه إمّا أن يكون مبدأ الحركة\
                \ في غيره وهي الحركة القسرية أو يكون [مبدأ] الحركة فيه إمّا مع الشعور أي شعور مبدأ الحركة بتلك الحركة، وهي\
                \ الحركة الإرادية أو لا مع الشعور وهي الحركة الطبعية.\nفالحركة النباتية طبعية وكذلك حركة النّبض لأنّ مبدأ\
                \ هاتين الحركتين موجود في المتحرّك ولا شعور له بالحركة الصادرة عنه. وقد أخطأ من جعل الحركة الطبعية هي الصاعدة\
                \ والهابطة وحصرها فيهما إذ تخرج عنها حينئذ هاتان الحركتان، وكذا أخطأ من جعل الحركة الطبعية هي التي على وتيرة\
                \ واحدة من غير شعور بخروج هاتين الحركتين. ومنهم من قسّم الحركة إلى ذاتية وعرضية، والذاتية إلى ستة أقسام، لأنّ\
                \ القوة المحركة إن كانت خارجة عن المتحرك فالحركة قسرية، وإن لم تكن خارجة عنه فإمّا أن تكون الحركة بسيطة أي\
                \ على نهج واحد وإمّا أن تكون مركّبة أي لا على نهج واحد.\nوالبسيطة إمّا أن تكون بإرادة وهي الحركة الفلكية أو\
                \ لا بإرادة وهي الحركة الطبعية.\nوالمركّبة إمّا أن يكون مصدرها القوة الحيوانية أو لا. الثانية الحركة النباتية.\
                \ والاولى إمّا أن تكون مع شعور بها وهي الحركة الإرادية الحيوانية أو مع عدم شعور وهي الحركة التسخيرية كحركة\
                \ النبض.\nفائدة:\nالحركة تقتضي أمورا ستة. الأول ما به الحركة أي السبب الفاعلي. الثاني ما له الحركة أي محلها.\
                \ الثالث ما فيه الحركة أي إحدى المقولات الأربع. الرابع ما منه الحركة أي المبدأ. والخامس ما إليه الحركة أي\
                \ المنتهى وهما أي المبدأ والمنتهى بالفعل في الحركة المستقيمة وبالفرض في الحركة المستديرة.\nالسادس المقدار\
                \ أي الزمان فإنّ كل حركة في زمان بالضرورة فوحدتها متعلّقة بوحدة هذه الأمور، فوحدتها الشخصية بوحدة موضوعها\
                \ وزمانها وما هي فيه ويتبع هذا وحدة ما منه وما إليه، ولا يعتبر وحدة المحرك وتعدده، ووحدتها النوعية بوحدة ما\
                \ فيه وما منه وما إليه ووحدتها الجنسية بوحدة ما فيه فقط. فالحركة الواقعة في كل جنس جنس من الحركة، فالحركات\
                \ الأينية كلّها متحدة في الجنس العالي، وكذا الحركات الكمية والكيفية. ويترتّب أجناس الحركات بترتب الأجناس التي\
                \ تقع تلك الحركة فيها فالحركة في الكيف جنس هي فوق الحركة في الكيفيات المحسوسة وهي فوق الحركة في المبصرات وهي\
                \ [جنس] فوق الحركة في الألوان، وهكذا إلى أن ينتهي إلى الحركات النوعية المنتهية إلى الحركات الشخصية. وتضاد\
                \ الحركتين ليس لتضاد المحرّك والزمان وما فيه بل لتضاد ما منه وما إليه إمّا بالذات كالتسوّد والتبيّض أو بالعرض\
                \ كالصعود والهبوط، فإنّ مبدأهما ومنتهاهما نقطتان متماثلتان عرض لهما تضاد من حيث إنّ إحداهما صارت مبدأ والأخرى\
                \ منتهى، فالتضاد إنّما هو بين الحركات المتجانسة المتشاركة في الجنس الأخير. ففي الاستحالة كالتسوّد والتبيّض\
                \ وفي الكم كالنمو والذبول وفي النقلة كالصاعدة والهابطة وأمّا الحركات الوضعية فلا تضاد فيها.\nفائدة:\nانقسام\
                \ الحركة ليس بالذات بل بانقسام الزمان والمسافة والمتحرك؛ فإنّ الجسم إذا تحرّك تحركت أجزاؤه المفروضة فيه، والحركة\
                \ القائمة بكل جزء غير القائمة بالجزء الآخر، فقد انقسمت الحركة بانقسام محلها.\nفائدة:\nذهب بعض الحكماء كأرسطو\
                \ وأتباعه والجبّائي من المعتزلة إلى أنّ بين كل حركتين مستقيمتين كصاعدة وهابطة سكونا، فالحجر إذا صعد قسرا ثم\
                \ رجع فلا بد أن يسكن فيما بينهما فإنّ كل حركة مستقيمة لا بدّ أن تنتهي إلى سكون لأنها لا تذهب على الاستقامة\
                \ إلى غير النهاية، ومنعه غيرهم كأفلاطون وأكثر المتكلّمين من المعتزلة. وإن شئت تحقيق المباحث فارجع إلى شرح\
                \ المواقف وشرح الطوالع والعلمي وغيرها.\nتذنيب\nالحركة كما تطلق على ما مرّ كذلك تطلق على كيفية عارضية للصوت\
                \ وهي الضم والفتح الكسر ويقابلها السكون. قال الإمام الرازي الحركات أبعاض المصوّتات. أمّا أولا فلأنّ الحروف\
                \ المصوتة قابلة للزيادة والنقصان، وكلّما كان كذلك فله طرفان ولا طرف في النقصان للمصوّتة إلّا بهذه الحركات\
                \ بشهادة الاستقراء.\nوأمّا ثانيا فلأنّ الحركات لو لم تكن أبعاض المصوّتات لما حصلت المصوتات بتمديدها، فإن الحركة\
                \ إذا كانت مخالفة لها ومددتها لم يمكنك أن تذكر المصوّت إلّا باستئناف صامت آخر يجعل المصوّت تبعا له، لكن الحسّ\
                \ شاهد بحصول المصوتة بمجرّد تمديد الحركات، كذا في شرح المواقف في بحث المسموعات.\nحركات الأفلاك وما في أجرامها\
                \ لها أسماء\nالحركة البسيطة وتسمّى متشابهة وبالحركة حول المركز أيضا، وبالحركة حول النقطة أيضا، وهي حركة تحدث\
                \ بها عند مركز الفلك في أزمنة متساوية زوايا متساوية. وبعبارة أخرى تحدث بها عند المركز في أزمنة متساوية قسي\
                \ متساوية. والحركة المختلفة وهي ما لا تكون كذلك. والحركة المفردة وهي الحركة الصادرة عن فلك واحد وقد تسمّى\
                \ بسيطة، لكن المشهور أنّ البسيطة هي المتشابهة. والحركة المركّبة وهي الصادرة عن أكثر من فلك واحد. وكل حركة\
                \ مفردة بسيطة وكل مختلفة مركبة وليس كل بسيطة مفردة وليس كل مركّبة مختلفة. والحركة الشرقية وهي الحركة من المشرق\
                \ إلى المغرب سمّيت بها بظهور الكوكب بها من الشرق، وتسمّى أيضا حركة إلى خلاف التوالي لأنّها على خلاف توالي\
                \ البروج، والبعض يسمّيها بالغربية لكونها إلى جهة الغرب. والحركات الشرقية أربع: الأولى الحركة الأولى وهي حركة\
                \ الفلك الأعظم حول مركز العالم سمّيت بها لأنها أول ما يعرف من الحركات السماوية بلا إقامة دليل، وتسمّى بحركة\
                \ الكلّ أيضا إذ الفلك الأعظم يسمّى أيضا بفلك الكل لأنّ باقي الأجرام في جوفه وتسمّى أيضا بالحركة اليومية، لأنّ\
                \ دورة الفلك الأعظم تتم في قريب من يوم بليلته على اصطلاح الحساب، وتسمّى أيضا بالحركة السريعة لأنّ هذه الحركة\
                \ أسرع الحركات. الثانية حركة مدير عطارد حول مركزه وتسمّى حركة الأوج إذ في المدير الأوج الثاني لعطارد فيتحرك\
                \ هذا الأوج بحركة المدير ضرورة. الثالثة حركة جوزهر القمر حول مركزه وتسمّى بحركة الرأس والذنب لتحركهما بهذه\
                \ الحركة. الرابعة حركة مائل القمر حول مركزه وتسمّى حركة أوج القمر لتحركه بحركته. ولما كان الأوج كما يتحرك\
                \ بهذه الحركة كذلك يتحرك بحركة الجوزهر أيضا. ويسمّى البعض مجموع حركتي الجوزهر والمائل بحركة الأوج صرّح به\
                \ العلّامة في النهاية. والحركة الغربية كحركة فلك الثوابت وهي الحركة من المغرب إلى المشرق وتسمّى أيضا بالحركة\
                \ إلى التوالي لأنها على توالي البروج والبعض يسميها شرقية أيضا لكونها إلى جهة الشرق، وتسمّى أيضا بالحركة البطيئة\
                \ لأنها أبطأ من الحركة الأولى، وبالحركة الثانية لأنها لا تعرف أولا بلا إقامة دليل. وحركات السبعة السيارة أيضا\
                \ تسمّى بالحركة الثانية والبطيئة وإلى التوالي والغربية أو الشرقية. فمن الحركات الغربية حركة فلك الثوابت. ومنها\
                \ حركات الممثلات سوى ممثل القمر حول مراكزها وتسمّى حركات الأوجات والجوزهرات، وحركات العقدة. ومنها حركات الأفلاك\
                \ الخارجة المراكز حول مراكزها. وحركة خارج مركز كل كوكب يسمّى بحركة مركز ذلك الكوكب اصطلاحا ولا تسمّى حركة\
                \ مركز التدوير كما زعم البعض وإن كانت يطلق عليها بحسب اللغة. وحركة مركز القمر تسمّى بالبعد المضعف أيضا.\n\
                اعلم أنّ خارج مركز ما سوى الشمس يسمّى حاملا فحركة حامل كل كوكب كما تسمّى بحركة المركز كذلك تسمّى بحركة العرض\
                \ لأنّ عرض مركز التداوير إنّما حصل بها فلهذه الحركة دخل في عرض الكوكب وهي أي حركة العرض هي حركة الطول بعينها\
                \ إذا أضيفت وقيست إلى فلك البروج.\nاعلم أنّ مركز التدوير إذا سار قوسا من منطقة الحامل في زمان مثلا تحدث زاوية\
                \ عند مركز معدّل المسير ويعتبر مقدارها من منطقة معدل المسير، وبهذا الاعتبار يقال لهذه الحركة حركة المركز المعدّل\
                \ الوسطى وتحدث أيضا زاوية عند مركز العالم ويعتبر مقدارها من منطقة البروج. وبهذا الاعتبار يقال لهذه الحركة\
                \ حركة المركز المعدل. وإذا أضيفت إلى حركة المركز المعدّل حركة الأوج حصل الوسط المعدّل فإذا زيد التعديل الثاني\
                \ على الوسط المعدّل أو نقص منه يحصل التقويم المسمّى بالطول وهذا في المتحيرة، ويعلم من ذلك الحال في النيرين.\n\
                فلهذا سميت بهذه الحركة المضافة إلى فلك البروج بحركة الطول. ومعنى الإضافة إلى فلك البروج أن تعتبر هذه الحركة\
                \ بالنسبة إلى مركز فلك البروج الذي هو مركز العالم.\nاعلم أنّ مجموع حركة الخارج والممثل في الشمس والمتحيّرة\
                \ تسمّى حركة الوسط وقد تسمّى حركة المركز فقط بحركة الوسط وأهل العمل يسمّون مجموع حركة الممثل وفضل حركة الحامل\
                \ على المدير في عطارد بالوسط، فإنهم لما سمّوا فضل حركة الحامل على حركة المدير في عطارد بحركة المركز سمّوا\
                \ مجموع حركة الممثل والفضل المذكور بحركة الوسط.\nوأما الوسط في القمر فهو فضل حركة المركز على مجموع حركتي الجوزهر\
                \ والمائل، وتسمّى حركة مركز القمر في الطول أيضا وقد يسمّى جميع الحركات المستوية وسطا.\nوحركة الاختلاف وهي\
                \ حركة تدوير كل كوكب سمّيت بها لأنّ تقويم الكوكب يختلف بها، فتارة تزاد تلك الحركة على الوسط وتارة تنقص منه\
                \ ليحصل التقويم وتسمّى أيضا حركة خاصة الكوكب لأنّ مركزه يتحرك بها بلا واسطة وهذه الحركة ليست من الشرقية والغربية\
                \ لأنّ حركات أعالي التداوير لا محالة مخالفة في الجهة لحركات أسافلها لكونها غير شاملة للأرض فإن كانت حركة أعلى\
                \ التدوير إلى التوالي أي من المغرب إلى المشرق كانت حركة الأسفل إلى خلافه، وإن كانت بالعكس فبالعكس. هذا كله\
                \ مما يستفاد مما ذكره الفاضل عبد العلي البرجندي في تصانيفه في علم الهيئة والسيّد السّند في شرح الملخص."
