            definitions_text: 'movement : تَغَيُّرُ مُتَّصِلٌ, ذُو سُرْعَةِ مُعَيَّنَةٍ, لوَضْعِ الشيء في المكان , وهو للدَّلالَةِ
              على الزَّمان. وتطْلَقُ الكلمة مَجازا على حَرَكاتِ النَّفْسِ والذَّهْنِ والحركاتِ الاجتماعية (عند الفلاسفة):
              ضِدُّ السُّكونِ , وهي الانتقالُ مِنْ مكان إلى مكان , والاستحالةُ مِنْ كَيْفِيَّةٍ إلى كَيْفِيَّةٍ , أو هي تَبَدُّلُ
              حال الذَّاتِ وخُروج ما هو بالقُوَّة إلى الفِعْل (في الطبيعة): عَمَلِيَّةُ انْتِقالِ جِسْمِ مِنْ مَوْضِعِ إلى
              آخر'
