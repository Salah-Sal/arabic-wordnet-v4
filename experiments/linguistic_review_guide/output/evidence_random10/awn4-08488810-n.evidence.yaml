          - entry_id: 373105
            dictionary_id: 52
            headword: محرك أوسط
            headword_bare: محرك أوسط
            headword_norm: محرك اوسط
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: يوجد هذا المحرك أمام وحدة الإدارة النهائية، ممّا يؤدي إلى توزيع متساوٍ للكتل على كلا المحورين
              وتهيئة موضع مناسب لمركز الثقل. في السيارات ذات المحركات من هذا النوع يصعب الوصول إلى المحرك (لإجراء أعمال الصيانة
              والإصلاح)، كما لا يمكن تجهيز تلك السيارات بأكثر من مقعدين أو ثلاثة. ويشغل هذا المحرك حيزاً كبيراً، كما أن تكلفة
              عزل الضجيج والحرارة الناجمين عنه تكون مرتفعة. لذلك لا يُستخدم المحرك الأوسط إلا في السيارات الرياضية وسيارات
              السباقات.
            translation_en: mid-engine
            translation_fr: moteur central
            domain: Automotive Engineering
            external_id: arabterm:88799
