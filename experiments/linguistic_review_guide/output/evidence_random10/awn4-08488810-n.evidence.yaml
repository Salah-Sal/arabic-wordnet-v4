          - entry_id: 372214
            dictionary_id: 52
            headword: محرك ديزل
            headword_bare: محرك ديزل
            headword_norm: محرك ديزل
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'سُمّي محرك ديزل بهذا الاسم نسبةً إلى مُخترعه رودولف ديزل Rudolf Diesel 1858-1913. يُستخدم محرك
              ديزل كمحرك تشغيل لسيارات الركوب أو للشاحنات أو في مواقع العمل الثابتة كماكينة تشغيل. لا يحتوي محرك ديزل، مُقارنةً
              بمحرك أوتّو، على كاربوراتير ولا منظومة إشعال، وإنما يحتوي على منظومة حقن، ويتمتع بخاصية [الاشتعال الذاتي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87910).
              كما أنه لا يسحب إلا هواءً نقياً ويقوم بضغطه. وتقوم مضخة الحقن بتوليد ضغط الحقن اللازم وتنظيم عملية الإمداد بكمية
              الوقود. يتكوّن [خليط الهواء والوقود](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88248)
              أولاً في غرفة الاحتراق، (انظر: [التكوين الداخلي للخليط](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88501))،
              كما يتسم الخليط بخاصية الاشتعال الذاتي في الهواء المضغوط بدرجة عالية. وتُصنّع محركات ديزل إمّا ثنائية الشوط
              أو رباعية الأشواط. وفي أغلب الأحيان تُستخدم المحركات رباعية الأشواط في الشاحنات. وفي شوط السحب، عندما يكون الكبّاس
              متحركاً لأسفل، يُسحب هواء نقي عبر صمام السحب. وفي شوط الانضغاط، عندما تكون الصمامات مُغلقة، تُضغط كمية الهواء
              المسحوب بنسبة انضغاط تتراوح من 14:1 إلى 22:1 على ضغط تتراوح قيمته من 40 إلى 60 بار. وعندئذ ترتفع درجة الحرارة
              لتصل إلى ما بين 700 و 900 °س. يبدأ شوط الاحتراق عندما تكون زاوية دوران العمود المرفقي متراوحة بين °20 و 30°
              قبل الوصول إلى النقطة الميتة العليا (ن.م.ع)، حيث يقوم الحاقن بحقن الوقود في الهواء المنضغط بدرجة عالية دقيقة
              التوزيع. بعد ذلك يتم ترذيذ الوقود بنسب دقيقة تحت تأثير قيم ضغط تتراوح بين 80 إلى 500 بار وشكل حاقن مناسب. ويُخلط
              الوقود ذاتياً مع الهواء، ثم يتبخر ويبدأ في الاشتعال في الهواء الساخن. وفي شوط العادم تتدفق غازات العادم بضغط
              يبلغ 4 بار تقريباً عبر صمام العادم إلى منظومة العادم. كما يعمل الكبّاس المتحرك إلى أعلى على إزاحة بقايا غازات
              العادم. نظراً للإجهادات العالية نسبياً (ارتفاع ضغط الاحتراق الأقصى) التي يتعرّض لها محرك ديزل، فإنه يجب تصنيعه
              بحيث يكون أكثر متانة وتحملاً من محرك أوتّو، وهو ما يفسر ثقل وزنه نسبياً. ويعمل محرك ديزل في النطاق الكامل لسرعة
              الدوران بنسبة زيادة في الهواء تُقدر بحوالي 20%. وهو ما ينتج عنه قيم استهلاك مناسبة وخرج عادم أقل نسبياً. وفي
              حالة الحمل الكامل تتراوح درجات حرارة غازات العادم المنبعثة من محرك ديزل من 600° إلى 800° س، أمّا درجات حرارة
              غازات العادم المُنبعثة من محركات أوتّو فتتراوح من 750° إلى 1000° س. كذلك فإن قيم سرعة الدوران الإسمية المناسبة
              لمحرك ديزل تُثبت تحقيق درجة استفادة أفضل من الوقود مقارنة بمحرك أوتّو، ولذلك يندر حالياً وجود أول أكسيد الكربون
              في غازات العادم الناتجة عن محرك ديزل. كما أن استفادة محرك ديزل من الوقود المُستخدم بنسبة أعلى من محرك أوتّو
              تنتج عنها كفاءة أفضل. ويتيح ضغط الاحتراق العالي في محرك ديزل إمكانية توليد عزم دوران عال، إلا أن سرعة دوران
              محرك ديزل تكون أقل من نظيرتها لمحرك أوتّو.'
            translation_en: diesel engine
            translation_fr: moteur diesel [m.]
            domain: Automotive Engineering
