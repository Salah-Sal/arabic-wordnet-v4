          - entry_id: 372256
            dictionary_id: 52
            headword: محرك مُتقابل الأسطوانات مُبرّد بالماء
            headword_bare: محرك متقابل الأسطوانات مبرد بالماء
            headword_norm: محرك متقابل الاسطوانات مبرد بالماء
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: محرك أسطوانات مُتقابلة رباعي الأسطوانات طوّرته شركة فولكس فاجن (VW)، مزود بنظام [تبريد بالماء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=160509).
              وقد حل هذا المحرك محلّ محرك أوتّو رباعي الأسطوانات المُبرّد بالهواء الذي كان يستخدم نمطياً في طراز السيارة 'ترانسبورتر'
              (Transporter) من فولكس فاجن (VW)، وتُصنع كتلة الأسطوانة والعمود المرفقي وكذلك [رأس الأسطوانة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88050)
              من سبائك معدنية خفيفة عالية المتانة، كما تُستخدم بطانات الأسطوانات المُبتلة. ويعمل القميص المائي على خمد الضوضاء،
              ويُزيد من الراحة أثناء القيادة.
            translation_en: water-cooled boxer engine
            translation_fr: moteur à plat à refroidissement par eau
            domain: Automotive Engineering
            external_id: arabterm:87950
