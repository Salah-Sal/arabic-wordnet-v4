          - entry_id: 372315
            dictionary_id: 52
            headword: محرك متعدد الصمامات
            headword_bare: محرك متعدد الصمامات
            headword_norm: محرك متعدد الصمامات
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'تتسم هذه المحركات بأن لها أكثر من صمامين لكل أسطوانة. ونجد في التصميمات الحديثة نسبياً أربعة
              صمامات: صمامي دخول وصمامي خروج. كما يمكن أن تكون ثلاثة صمامات، مثلاً صمامي دخول صغيرين نسبياً وصمام خورج كبير،
              أو العكس. وتتمثل مزايا المحركات مُتعددة الصمامات فيما يلي: 1) تسمح المقاطع العرضية الكبيرة نسبياً لفتحات دخول
              وخروج الغاز في أجزاء الثانية المُتاحة بدرجة ملء أفضل (انظر[درجة الامتلاء (الكفاءة الحجمية λL)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87933))،
              وبالتالي زيادة قدرة المحرك وعزم الدوران (Nm) 2) تعمل كل من غرفة الاحتراق المُدمجة التي تتخذ قصرياً شكل غطاء،
              والموضع الأمثل لشمعات الشرر في مُنتصف حيز الاحتراق، وكذلك عملية التدويم المُكثّفة للخليط على تحسين [عملية الاحتراق](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87913).
              3) بالتالي يسمح ذلك بإتمام عملية الانضغاط على مستوى أعلى، ممّا يُحسّن من الكفاءة الحرارية، وبالتالي من استخدام
              الوقود. البدائل المستقبلية مع البنزين الخالي من الرصاص: في حالة تساوي قيم الانضغاط تتحمّل المحركات رُباعية صمامات
              وقود ذي رقم أوكتان (ON) يقل بمقدار أربع إلى ست نقاط. 4) يقل [مُعدل استهلاك الوقود](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87964)
              النوعي وانبعاث أكاسيد النيتروجين بفعل توقيتات التحكم التي يتم مواءمتها طبقاً لذلك. وتتسم أنواع المواد المُستخدمة
              لصناعة رأس الأسطوانة وكذلك عملية إنتاجها بأنها أكثر تعقيداً وتكلفةً ممّا عليه الحال بالنسبة للمحركات ثنائية
              الصمام. وتبعاً للتصميم يكون من الضروري استخدام عمودي كامات، وضعف عدد آليات تشغيل الصمامات، وعناصر إدارة أكثر.
              وعلى الرغم من الملء المُناسب تسري بالنسبة للمحركات مُتعددة الصمامات القواعد الهامة الخاصة بتصميم حيز الاحتراق.
              ويُعد شكل حيز الاحتراق وشكل الكبّاس مع أسطح السحق المُوزعة بشكل جيد ذي أهمية كبيرة بالنسبة للمحركات مُتعددة
              الصمامات، ويأتي إلى جانبهم التواءم المُناسب لأنبوب السحب وتوقيتات التحكم ومنظومة شمعات الشرر. ولم تُحسم مسألة
              ''زاوية الصمام'' بعد، حيث تبلغ زاوية الصمام حالياً 20°-25° في المُعتاد. وترتبط قيمة الزاوية بموضع المحرك في
              السيارة بدرجة أكبر من ارتباطها ب[عملية الاحتراق](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87913)
              المُثلى. وبالتالي لم يتم بعد استنفاذ إمكانيات تطوير المحركات مُتعددة الصمامات.'
            translation_en: multi-valve engines
            translation_fr: moteurs multisoupapes [m.]
            domain: Automotive Engineering
            external_id: arabterm:88009
            dict_key: arabterm_arabterm_automotive_engineering
