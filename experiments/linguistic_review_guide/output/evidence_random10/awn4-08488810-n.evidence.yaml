          - entry_id: 372330
            dictionary_id: 52
            headword: محرك مزدوج (Twin)
            headword_bare: محرك مزدوج (Twin)
            headword_norm: محرك مزدوج (Twin)
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'يعني المصطلح الانجليزي ''Twin'': ''الثنائي'' أو ''المزدوج''. وفي مجال السيارات يُقصد بالمحرك
              المزدوج: محرك رباعي الأشواط ذي أسطوانتين في صف واحد، تكون فيه المرافق الخاصة ب[العمود المرفقي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88102)
              على نفس مستوى الارتفاع. وتكمن ميزة هذا التصميم في تباعُد الإشعال المُتساوي لهذه المحركات. إلا أنه يعيبه توجب
              استخدام أوزان موازنة لتحقيق [موازنة الكتل](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88106)،
              وبالتالي سلاسة دوران عالية للمحرك.'
