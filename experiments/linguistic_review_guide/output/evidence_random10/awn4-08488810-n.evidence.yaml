            definitions_text: |-
              الْحَرَكَة: هِيَ الَّتِي تعرض للحرف عرضا يحله. وَعند الْحُكَمَاء خُرُوج صفة الشَّيْء وانتقالها من الْقُوَّة إِلَى الْفِعْل على سَبِيل التدريج. وتفصيلها أَن الشَّيْء الْمَوْجُود لَا يكون بِالْقُوَّةِ من جَمِيع الْوُجُود وَإِلَّا لَكَانَ وجوده بِالْقُوَّةِ فَيلْزم أَن يكون بِالْقُوَّةِ فِي كَونه بِالْقُوَّةِ فَيكون الْقُوَّة حَاصِلَة وَغير حَاصِلَة وَيلْزم أَيْضا أَن لَا يكون مَوْجُودا وَقد فرضناه مَوْجُودا هَذَا خلف. فَذَلِك الشَّيْء الْمَوْجُود إِمَّا مَوْجُود من جَمِيع الْوُجُوه وَهُوَ الْمَوْجُود الْكَامِل الَّذِي لَيْسَ لَهُ كَمَال متوقع كالباري تَعَالَى عز اسْمه والعقول - أَو بِالْفِعْلِ من بعض الْوُجُوه وبالقوة من بَعْضهَا فَمن حَيْثُ إِنَّه مَوْجُود بِالْقُوَّةِ من بعض الْوُجُوه لَو خرج من الْقُوَّة إِلَى الْفِعْل فَذَلِك الْخُرُوج - إِمَّا أَن يكون دفْعَة وَاحِدَة وَهُوَ الْكَوْن وَالْفساد كانقلاب المَاء هَوَاء فَإِن الصُّورَة الهوائية كَانَت للْمَاء بِالْقُوَّةِ فَخرجت مِنْهَا إِلَى الْفِعْل دفْعَة فَذَلِك الانقلاب فَسَاد من جِهَة زَوَال الصُّورَة المائية وَكَون من حَيْثُ حُدُوث الصُّورَة الهوائية. وَإِمَّا أَن يكون ذَلِك الْخُرُوج على التدريج فَهُوَ الْحَرَكَة.
              ثمَّ الْحَرَكَة: قد تطلق على الْحَرَكَة بِمَعْنى التَّوَسُّط.
              وَقد تطلق على الْحَرَكَة بِمَعْنى الْقطع: فالحركة بِمَعْنى التَّوَسُّط هُوَ كَون الْجِسْم فِيمَا بَين المبدأ والمنتهى بِحَيْثُ أَي حد يفْرض يكون حَاله فِي ذَلِك الْآن مُخَالفا لحاله فِي آنين يحيطان بِهِ - وَبِعِبَارَة أُخْرَى أَن يكون الْجِسْم واصلا إِلَى حد من حُدُود الْمسَافَة فِي كل آن لَا يكون ذَلِك الْجِسْم واصلا إِلَى ذَلِك الْحَد قبل ذَلِك الْآن وَبعده - وَالْحَرَكَة بِمَعْنى الْقطع أَمر ممتد من أول الْمسَافَة إِلَى آخرهَا لِأَنَّهَا إِنَّمَا تحصل عِنْد وجود الْجِسْم المتحرك إِلَى الْمُنْتَهى.
              وتفصيلهما مَا قَالَه أرسطو من أَن الْحَرَكَة قد تطلق على كَون الْجِسْم بِحَيْثُ أَي حد من حُدُود الْمسَافَة الَّتِي تفرض لَا يكون ذَلِك الْجِسْم قبل آن الْوُصُول إِلَى حد من حُدُود الْمسَافَة وَلَا بعد آن الْوُصُول حَاصِلا فِي الْحَد الْمَذْكُور فَيكون فِي كل آن فِي جِهَة أُخْرَى وَيُسمى الْحَرَكَة بِمَعْنى التَّوَسُّط لكَونهَا حَاصِلَة للجسم فِيمَا بَين المبدأ والمنتهى فَهِيَ صفة شخصية مَوْجُودَة فِي الْخَارِج دفْعَة مستمره إِلَى الْمُنْتَهى تَسْتَلْزِم اخْتِلَاف نسب المتحرك إِلَى حُدُود الْمسَافَة فَهِيَ بِاعْتِبَار ذَاتهَا مستمرة - وَبِاعْتِبَار نسبتها إِلَى تِلْكَ الْحُدُود سيالة - فباعتبار استمرارها وسيلانها تفعل فِي الخيال أمرا ممتدا غير قار تطلق عَلَيْهِ الْحَرَكَة بِمَعْنى الْقطع لِأَنَّهُ يقطع الْمسَافَة بهَا وَإِنَّمَا هِيَ أَمر ممتد لِأَنَّهُ لما ارتسم نِسْبَة المتحرك إِلَى الْجُزْء الثَّانِي فِي الخيال قبل أَن يَزُول نسبته إِلَى الْجُزْء الأول عَنهُ يتخيل أَمر ممتد ينطبق على الْمسَافَة كَمَا يحصل من القطرات النَّازِلَة والشعلة الجوالة أَمر ممتد فِي الْحسن الْمُشْتَرك فَيرى لذَلِك خطا أَو دَائِرَة - وَالْحَرَكَة بِهَذَا الْمَعْنى لَا وجود لَهَا إِلَّا فِي التَّوَهُّم لِأَن المتحرك مَا لم يصل إِلَى الْمُنْتَهى لم يُوجد الْحَرَكَة بِتَمَامِهَا وَإِذا وصل فَقَط انْقَطَعت الْحَرَكَة فالحركة بِمَعْنى الْقطع أَمر ممتد غير قار الْأَجْزَاء حَاصِل فِي الخيال بسيلان الْحَرَكَة بِمَعْنى التَّوَسُّط.
              ثمَّ اعْلَم أَن فِي وجود الْحَرَكَة اخْتِلَافا ذهب بَعضهم إِلَى أَن الْحَرَكَة مَوْجُودَة بالبداهة. وَعبارَة الطوسي فِي التَّجْرِيد تنظر إِلَى هَذَا حَيْثُ قَالَ وجودهَا ضَرُورِيّ. وَبَعْضهمْ ذهب إِلَى أَنَّهَا لَيست مَوْجُودَة إِذْ لَو كَانَ لَهَا وجود لَكَانَ فِي أحد الْأَزْمِنَة الثَّلَاثَة والتالي بَاطِل فالمقدم مثله إِمَّا الْمُلَازمَة فظاهرة. وَإِمَّا بطلَان التَّالِي فَلِأَن الْمَوْجُود مِنْهَا لَيْسَ مَا فِي الْمَاضِي وَلَا فِي الْمُسْتَقْبل وَذَلِكَ ظَاهر وَلَا فِي الْحَال لوُجُوب كَونه منقسما إِذْ لَو كَانَ غير منقسم لكَانَتْ الْمسَافَة الْمُطَابقَة لَهُ أَيْضا كَذَلِك وَيلْزم مِنْهُ الْجُزْء الَّذِي لَا يتجزئ وَإِذا انقسم فَيكون بعضه مَاضِيا وَبَعضه مُسْتَقْبلا وهما معدومان فَإِذن لَا وجود للحركة أصلا.
              وَأجَاب الشَّيْخ عَن هَذَا الِاسْتِدْلَال بِأَن الْحَرَكَة الْحَاضِرَة وَإِن كَانَت منقسمة لَكِن انقسامها بِالْقُوَّةِ لَا بِالْفِعْلِ إِذْ انقسامها إِنَّمَا هُوَ بِالْعرضِ لِأَنَّهُ تَابع لانقسام الْمسَافَة وَالزَّمَان وانقسام هذَيْن الْأَمريْنِ بِالْقُوَّةِ لَا بِالْفِعْلِ.
              وَلَا يخفى أَن الْكَلَام الْمَنْقُول عَن أرسطو كالمحاكمة بَين الْقَوْلَيْنِ.
              وَتَحْقِيق الْحق من المذهبين أَن الْحَرَكَة إِن أُرِيد مِنْهَا مَا هُوَ بِمَعْنى الْقطع فَالْحق مَا ذكره النافون لوجودها - وَإِن أُرِيد مِنْهَا مَا هُوَ بِمَعْنى التَّوَسُّط - فَالْحق مَا نقل عَن الْقَائِلين بوجودها.
