    - entry_id: 361126
      dictionary_id: 60
      headword: أهداف التنمية المستدامة
      headword_bare: أهداف التنمية المستدامة
      headword_norm: اهداف التنمية المستدامة
      root: هدف
      root_source: camel
      pos: null
      form: null
      is_partial: 0
      definitions_text: 'ولد مفهوم أهداف التنمية المستدامة (SDGs) في مؤتمر الأمم المتحدة للتنمية المستدامة ريو + 20، في عام
        2012. وكان الهدف هو إنتاج مجموعة من الأهداف القابلة للتطبيق عالميا، توازن بين الأبعاد الثلاثة للتنمية المستدامة: البيئية،
        الاجتماعية والاقتصادية. في الوقت الحاضر، وعمليات أهداف التنمية المستدامة تتجه نحو الانتهاء منها في عام 2015، يطري
        التحضير لما بعد عام 2015، وعندما يتم إطلاق جدول الأعمال المستدامة العالمي الجديد للتنمية، فمن المرجح أن يمتد حتى عام
        2030.'
      translation_en: sustainable development goals (sdgs)
      translation_fr: objectifs de développement durable (odd)
      domain: Climate, Environment and Solid Waste management
