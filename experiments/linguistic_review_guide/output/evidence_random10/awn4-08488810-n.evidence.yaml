          - entry_id: 372490
            dictionary_id: 52
            headword: محرك CVH
            headword_bare: محرك CVH
            headword_norm: محرك CVH
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'يشير الاختصار CVH إلى المصطلحين الإنجليزيين: Compound Valve Angle و Hemispherical Chamber،
              أي زاوية الصمام المُركّبة والتصميم نصف الكروي لحيز الاحتراق. ويُقصد بهذا تصميم من تصميمات المحركات يكون فيها
              كلا الصمامين في كل أسطوانة من الأسطوانات مرتبين على شكل حرف V ويميلان على المحور العرضي بزاوية 15°. وبهذه الكيفية
              تتواءم أقراص الصمامات مع الشكل نصف الكروي لحيز الاحتراق، وتُزود شحنات الغاز الجديدة المتدفقة بتيار دفق مماسي.
              وعلى الرغم من أن الصمامات مرتبة على شكل حرف V، إلا أنه يلزم مع ذلك وجود عمود كامات واحد فقط يعلوها نظراً لميلها.
              وقد قامت شركة فورد (Ford) بتطوير محرك CVH.'
            translation_en: CVH engine
            translation_fr: moteur CVH [m.]
            domain: Automotive Engineering
