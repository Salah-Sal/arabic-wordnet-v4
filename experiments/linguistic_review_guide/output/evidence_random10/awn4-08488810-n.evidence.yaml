          - entry_id: 375196
            dictionary_id: 52
            headword: محرك مؤازر لغطاء التهوية
            headword_bare: محرك مؤازر لغطاء التهوية
            headword_norm: محرك مؤازر لغطاء التهوية
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'هو موتور كهربائى أو مغناطيس كهربائي في مُكيّفات الهواء المُزوّدة بنظام تحكم أوتوماتي (انظر:
              [مكيف الهواء، بنظام التحكم الأوتوماتي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90899)).
              ويمكن بواسطته تحويل إشارات الخرج الكهربائية إلى حركة ميكانيكية. وتتمثل وظيفته في فتح وإغلاق [أغطية التهوية](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91020)
              الخاصة بإمداد الهواء في [جهاز التدفئة/التكييف](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90963)،
              الأمر الذي يحدث من خلال تشغيل الموتور المؤازر عن طريق [وحدة التحكم في نظام التحكم الأوتوماتي في درجة الحرارة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90931).
              وهو يوجد مُركّباً على جهاز التدفئة/التكييف من الخارج على مستوى ارتفاع محور الدوران، وهو مُزوّد [ببوتنشيومتر](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90851).
              ومن خلال ذلك تتعرّف وحدة التحكم على وضعية غطاء التهوية. وينبغي ألا يتم تبديل المحركات المؤازرة عند تركيبها،
              حيث أن زاوية دورانها مضبوطة بإحكام بالنسبة لغطاء التهوية المعني.'
            translation_en: actuator for ventilating valve
            translation_fr: servomoteur de volet de ventilation [m.]
