          وأهداف المناهج الدراسية، وتشتمل على: اتساق الأهداف مع طبيعة العصر وطبيعة مجتمع المعرفة، ملاءمة الأهداف لطبيعة المتعلمين،
          توازن الأهداف وتكاملها، شمولية الأهداف وتنوعها، وضوح الأهداف وشفافيتها، وواقعية الأهداف وقابليتها للتحقق.'
