          - entry_id: 376329
            dictionary_id: 52
            headword: محرك توربيني
            headword_bare: محرك توربيني
            headword_norm: محرك توربيني
            root: حرك
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'هو محرك حراري تتحرك فيه الأجزاء المُنتجة لعزم الدوران حركة دورانية، وليست حركة ترددية كما هي
              الحال في المحركات ذات الكبّاس الترددي. وتجري عملية الاحتراق في المحرك التوربيني دون انقطاع مع وجود فائض كبير
              من الهواء. تُعد تجهيزة الإشعال ضرورية فقط لإدارة المحرك، وتعمل الأجزاء المتحركة بدون أن تلامس بعضها البعض -
              باستثناء محامل الأعمدة - ولذا فهي لا تتعرّض للبلى. وكما هي الحال في محركات الطائرات فإنه يتم أيضاً في المحركات
              التوربينية للسيارات ضغط الهواء المسحوب في الضاغط ثم دفعه بقوة إلى داخل غرفة الاحتراق، حيث يتم حقن وحرق الوقود
              فيها. ينتج عن [عملية الاحتراق](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87913) ارتفاع
              كبير في درجة الحرارة، ويتمدد الخليط الساخن في التوربينة التالية لغرفة الاحتراق، ومن ثم يطلق طاقته الحركية هناك.
              يلي التوربينة صندوق تروس مُخفّض للسرعة، يقوم بتوجيه عزم الدوران المُتولّد. وتعد الخصائص التالية من مزايا المحرك
              التوربيني: 1) توفير مُنحنى عزم دوران مناسب، 2) تشغيل خال من الاهتزازات، 3) قلة نسبة المواد الضارة في العادم،
              4) سهولة الصيانة، 5) قلة البلى. أمّا عيوبه فهي: 1) يعمل مع الحمل الجزئي بشكل غير اقتصادي، 2) يستجيب ببطء لمتطلبات
              الأداء المُتغيرة. لم تُستخدم المحركات التوربينية حتى الآن سوى في الشاحنات عالية القدرة وفي الحافلات التجريبية،
              كما أنها لم تتمكن حتى الآن من منافسة محركات أوتّو ومحركات ديزل.'
            translation_en: gas turbine
            translation_fr: turbine à gaz [f.]
            domain: Automotive Engineering
            external_id: arabterm:92023
            dict_key: arabterm_arabterm_automotive_engineering
            dict_name_ar: مسرد هندسة وتكنولوجيا السيارات، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)
