            definitions_text: باعتبار أن الماء يتمدد حين يتجمد، فإن أي صدع صخري، في منطقة تنزل درجة الحرارة فيها لفترات تحت
              الصفر ويتجمد الماء بداخله، يتسع ويطول عند تجمد الماء. لما يذوب الجليد يتسرب الماء إلى عمق أكبر داخل الصخر. يتكرر
              تجمد الماء واتساع الصدع إلى أن ينكسر الصخر.تأثير تجمد المياه وانصهار الجليد (المرادف العربي)
