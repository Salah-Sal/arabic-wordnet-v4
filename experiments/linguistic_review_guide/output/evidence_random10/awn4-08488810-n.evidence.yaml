            definitions_text: 'يعني الاختصار CIH في اللغة الإنجليزية: Camshaft In Head، أي عمود الكامات في الرأس. يدور الأمر
              هنا حول محرك ذي صمامات علوية يتميز بوجود عمود كامات في [رأس الأسطوانة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88050)،
              وتكون الصمامات مُرتبة بشكل مُعلق. يتم تشغيل الصمامات عن طريق غمّازات قصيرة وذراع ترجّحية انكفائية. في هذا النوع
              من نظام التحكم في الصمامات يتم تشغيل الصمامات بشكل أكثر مباشرة، أي بأجزاء بينية أقل، عمّا هو الحال عندما يكون
              عمود الكامات مُركباً بالأسفل. وفي هذه الحالة يقل القصور الذاتي لمجموعة إدارة الصمامات.'
