step1_lemma_validation:
  per_lemma:
    - lemma: "ظل"
      decision: "confirmed"
      decision_reason: "اللمّة هي المفهوم العام والأشمل للظاهرة، مدعومة بقوة في المصادر المعجمية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "احتمى المسافر بظل الشجرة"
            substituted: "احتمى المسافر بفيء الشجرة"
            preserved_meaning: true
      reasoning:
        evidence_weight: "أدلة مؤكّدة من أمهات المعاجم (القاموس المحيط، مقاييس اللغة، لسان العرب)."
        nuance_differentiation: "يتميّز عن «فيء» بأنه المصطلح العام لكل حجب للضوء، ولا يتقيّد بوقت معين."
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "ظل"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "ظل"
            note: "مصطلح عام لكل حجب للضوء، ولا يتقيّد بوقت معين."

    - lemma: "فيء"
      decision: "confirmed"
      decision_reason: "اللمّة مرادف جزئي (أخص) للظل، مع ضرورة تقييد المعنى."
      evidence_assessment:
        case: "mixed"
        notes:
          - "توسيع: اللمّة تحمل معنى 'الغنيمة' وهو خارج نطاق تعريف المجموعة."
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "جلسنا في فيء الشجرة بعد الظهر"
            substituted: "جلسنا في ظل الشجرة بعد الظهر"
            preserved_meaning: true
      reasoning:
        evidence_weight: "أدلة مؤكّدة على معنى الظل بعد الزوال، مع ملاحظة وجود توسع دلالي (غنيمة) يجب استبعاده."
        conflict_analysis: "المعاجم تخصص الفيء بالظل بعد الزوال، بينما الظل عام. المعنى الآخر (غنيمة) لا يندرج تحت هذا التعريف."
        nuance_differentiation: "يتميّز عن «ظل» بأنه الظل الحاصل بعد الزوال (في العشي)، ولا يُستخدم بمعنى الغنيمة في هذا السياق."
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "فيء"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "فيء"
            note: "يختص بالظل الحاصل بعد الزوال (في العشي)."
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "فيء"
            note: "يجب استبعاد معنى 'الغنيمة' أو 'الخراج' من هذا السياق."

  synset_flags:
    definition_review_needed: true