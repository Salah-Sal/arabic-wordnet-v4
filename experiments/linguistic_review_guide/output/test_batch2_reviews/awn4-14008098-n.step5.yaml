step5_enrichment:
  per_lemma:
    - lemma: "ظل"
      enrichment:
        root: "ظ-ل-ل"
        figurative_relation: "metaphor"
      examples:
        - text: "أَلَمْ تَرَ إِلَىٰ رَبِّكَ كَيْفَ مَدَّ الظِّلَّ"
          type: "quran"
          source: "الفرقان/ ٤٥"
      pos_check:
        pos: "noun"

    - lemma: "فيء"
      enrichment:
        root: "ف-ي-ء"
      examples:
        - text: "فَلا الظِّلُّ من بَرْدِ الضُّحَى تَسْتَطِيعُهُ / ولا الفَيْءُ من بَرْدِ العَشِي تَدُوقُ"
          type: "poetry"
          source: "حميدُ بنُ ثورٍ"
      pos_check:
        pos: "noun"

  cultural_fit:
    assessment: "native"

  reasoning:
    cultural_fit_reasoning: "كلا اللفظتين أصيلتان في اللغة العربية، وتعبران عن ظاهرة فيزيائية مرصودة بدقة في التراث العربي، حيث يُستخدم 'الظل' للظلام الناتج عن حجب الضوء عامةً أو قبل الزوال، بينما يختص 'الفيء' بالظل الذي يرجع بعد الزوال."

  actions:
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "ظل"
        note: "يُستخدم مجازاً في الثقافة العربية للدلالة على العز والحماية والمنعة، كما في قولهم 'في ظل فلان'."