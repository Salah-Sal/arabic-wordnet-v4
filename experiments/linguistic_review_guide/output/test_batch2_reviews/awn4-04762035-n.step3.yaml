step3_definition:
  definition_review_flag: false
  current_definition: "شيء تم إثباته بوضوح"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي وصفيّ (مبني للمجهول) ولا يعكس الطبيعة الاصطلاحية للمفهومين (الثبات واليقين) اللذين يعبران عن حالة ذهنية أو واقعية مستقرة لا تقبل الشك أو التغير."
  
  authored_definitions:
    - type: "terminological"
      text: "حالةٌ ذهنيةٌ أو واقعيةٌ تتسمُ بالجزمِ والرسوخِ، بحيثُ لا يطرأُ عليها شكٌّ أو زوالٌ."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

    - type: "linguistic"
      text: "العلمُ التامُّ الذي لا شُبهةَ فيه، أو استقرارُ الشيءِ وعدمُ تزلزلِهِ."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

  reasoning:
    revision_justification: "التعريف الحالي ضعيف دلالياً لأنه يصف حالة الإثبات (الفعل) بدلاً من تعريف المفهوم (الاسم). التعريف الجديد يربط بين «اليقين» كحالة ذهنية و«الثبات» كحالة واقعية."
    dictionary_comparison: "المعاجم (مثل الجرجاني والمناوي) تشير إلى «اليقين» كعلم لا شك معه، و«الثبات» كعدم احتمال الزوال، لذا دُمج المعنيان."
    terminological_strategy: "الجنس القريب = «حالة ذهنية أو واقعية» + الفصل المميّز = «تتسم بالجزم والرسوخ، بحيث لا يطرأ عليها شك أو زوال»."
    linguistic_strategy: "تبسيط التعريف ليشمل العلم التام (اليقين) والاستقرار (الثبات)."

  actions:
    - command: "عدّل نص التعريف"
      params:
        definition_index: 0
        new_text: "حالةٌ ذهنيةٌ أو واقعيةٌ تتسمُ بالجزمِ والرسوخِ، بحيثُ لا يطرأُ عليها شكٌّ أو زوالٌ."