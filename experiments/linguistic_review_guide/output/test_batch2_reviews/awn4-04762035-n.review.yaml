step0_raw: "synset: awn4-04762035-n\nper_lemma:\n  ثَبَات:\n    confirm:\n      - «الثبات: ضد الزوال، والثبات والثبوت ضد التزلزل، وثبت الأمر صح، وأثبت الكاتب الاسم كتبه عنده. ورجل ثبت بسكون الباء متثبت\
  \ في أموره. وثبت الجنان أي ثابت القلب، والاسم ثبت بالفتح ومنه قيل للحجة ثبت، ورجل ثبت بفتحتين إذا كان عدلا ضابطا.» — التوقيف على مهمات التعاريف للمناوي\n      - «الثّبات: [في الانكليزية] Stability ،permanence\
  \ [ في الفرنسية] Stabilite ،permanence هو عدم احتمال الزّوال بتشكيك المشكّك. وقيل هو الجزم المطابق الذي ليس بثابت، وهو تقليد المصيب، كذا في شرح العقائد وحواشيه في بيان خبر الرسول.» — كشّاف اصطلاحات الفنون\
  \ والعلوم للتهانوي\n      - «(1) يُثبت (ق) (2) يؤكِّد؛ يَجْزِم.» — المورد الحديث (2008)\n      - «(1) إثبات (ق) (2) تأكيد؛ جزم (3) توكيد.» — المورد الحديث (2008)\n      - «(1) إثبات الوصية: إثبات صحة\
  \ وصية المتوفَّى [أمام القضاء] (2) الوصية المُثْبَتَة: نسخة مصدَّقة عن وصيةٍ أُثبتت صحَّتُها (3) يُثبت صحّة الوصية.» — المورد الحديث (2008)\n    contradicts:\n      - «ثُبات: الجذر: ث ب ت مثال: وَجَدتُه\
  \ في ثُبَات عميق الرأي: مرفوضة عند بعضهم السبب: لأن هذه الكلمة بالثاء لا تؤدي المعنى المراد هنا. المعنى: نَوْم الصواب والرتبة: وجدتُه في سُبَاتٍ عميق [فصيحة] التعليق: الوارد في المعاجم «السُّبات: النوم»\
  \ بالسين لا بالثاء. وفي القرآن الكريم: {وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا} النبأ/9.» — معجم الصواب اللغوي لأحمد مختار عمر\n      - «داءٌ ثُباتٌ: معجز عن الحركة» — المعجم الوسيط\n      - «داءٌ ثُباتٌ : مُعْجِزٌ\
  \ عن الحركة» — المعجم الكبير\n    expands:\n      - «عندما يطبق على مادة كيميائية فإنه يعني القدرة على البقاء دون تغيير رغم تأثيرات البيئة.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية\
  \ للتربية والثقافة والعلوم (موقع ArabTerm)\n      - «خاصية بيانات لها توزيع ثابت على بُعد واحد أو أكثر.» — معجم البيانات والذكاء الاصطناعي (2024)\n      - «خاصية بقاء المستحضر أو الشكل الصيدلاني ّ على\
  \ حالة واحدة.» — المعجم الموحد لمصطلحات علم الصيدلة (2009)\n      - «انسجام بين الإدراك والتوقعات.» — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)\n      - «يتصف الاختبار\
  \ بالثبات عندما يعطي النتائج تقريبًا في كل مرة يطبق فيها على نفس الطلاب وفي ظل ظروف متشابهة.» — مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)\n      - «سَيْرٌ يُشَدُّ به الرَّحْل\
  \ شِباَمُ البُرْقُعِ , وهما شِباَمانِ : خَيْطان في البُرْقُعِ تَشُدُّه المرأةُ بهما في مُؤَخَّرِ رَأْسِها» — المعجم الكبير\n      - «الثبة: عشرة فما فوق ذلك.» — غريب القرآن في شعر العرب لعبد الله بن عباس\n\
  \  يَقِين:\n    confirm:\n      - «اليقين: في اللغة: العلم الذي لا شك معه، وفي الاصطلاح: اعتقاد الشيء بأنه كذا مع اعتقاد أنه لا يمكن إلا كذا، مطابقًا للواقع غير ممكن الزوال» — كتاب التعريفات للشريف الجرجاني\n\
  \      - «اليَقِينُ: علم يحصل بعد اسْتِدْلَال وروية» — معجم مقاليد العلوم للسيوطي\n      - «اليقين: لغة: العلم الذي لا شك معه. واصطلاحا: العلم الشيء بعد أن كان صاحبه شاكا فيه» — التوقيف على مهمات التعاريف\
  \ للمناوي\n      - «اليقين: في عرف علماء الرسوم الاعتقاد الجازم المطابق الثابت أي الذي لا يزول بتشكيك المشكّك» — كشّاف اصطلاحات الفنون والعلوم للتهانوي\n      - «اليَقِين: في اللغة: العلمُ الذي لا شكَّ\
  \ معه وفي الاصطلاح: اعتقاد الشيء بأنه كذا مع اعتقاد أنه لا يمكن إلا كذا مطابقاً للواقع غير ممكنِ الزوال» — التعريفات الفقهيّة للبركتي\n      - «(الْيَقِين) الْعلم الَّذِي لَا شكّ مَعَه» — المعجم الوسيط\
  \ لمجموعة من المؤلفين\n      - «اليَقِين فِي الْعرف هُوَ التَّصْدِيق الْجَازِم المطابق الثَّابِت» — دستور العلماء للأحمدنكري\n      - «العِلْمُ الذى لا شكَّ معه» — المعجم الوسيط\n      - «اليَقِينُ: العلم\
  \ وزوالُ الشك» — تاج اللغة وصِحاح العربية للجوهري\n      - «الْيَقَنُ وَالْيَقِينُ: زَوَالُ الشَّكِّ» — مقاييس اللغة لابن فارس\n      - «الْيَقِين: إزاحة الشَّك» — المحكم والمحيط الأعظم لابن سيده الأندلسي\n\
  \      - «يقن الأمر يقناً، وهو يقين» — أساس البلاغة للزمخشري\n      - «(الْيَقِينُ) الْعِلْمُ وَزَوَالُ الشَّكِّ» — مختار الصحاح للرازي\n      - «اليَقِينُ: العِلْم وإزاحة الشك وتحقيقُ الأَمر» — لسان\
  \ العرب لابن منظور\n      - «الْيَقِينُ الْعِلْمُ الْحَاصِلُ عَنْ نَظَرٍ وَاسْتِدْلَالٍ» — المصباح المنير للفيّومي\n      - «واليَقينُ: إزاحَةُ الشَّك» — القاموس المحيط للفيروزآبادي\n      - «اليَقِينُ:\
  \ إزاحَةُ الشَّكِّ والعِلْمُ وتَحْقِيقُ الأمْرِ» — تاج العروس لمرتضى الزبيدي\n      - «He knew it; he was, or became, certain, or sure, or he made sure, of it» — المعجم العربي الإنجليزي لإدوارد وليام\
  \ لين\n      - «Was certain, positive about; knew; assured himself of» — حبيب سالمون، قاموس عربي انجليزي متقدم للمتعلمين\n      - «(يقن) الشيء (ييقن) يقنا ويقينا ثَبت وَتحقّق ووضح» — المعجم الوسيط لمجموعة\
  \ من المؤلفين\n      - «يقِنَ الشَّيءُ: ثبَت وتحقّق ووضَح» — معجم اللغة العربية المعاصرة لأحمد مختار عمر\n      - «اليَقِينُ من صفة العلم فوق المعرفة والدّراية وأخواتها» — المفردات في غريب القرآن للراغب\
  \ الأصفهاني\n      - «اليَقَنُ: اليَقِيْنُ وإزَاحَةُ الشَّك» — المحيط في اللغة للصاحب بن عباد\n      - «اليقين وهو إزاحة الشك وتحقيق الأمر» — كتاب العين للخليل بن أحمد الفراهيدي\n      - «زوال الشك» —\
  \ مجمل اللغة لابن فارس\n"
