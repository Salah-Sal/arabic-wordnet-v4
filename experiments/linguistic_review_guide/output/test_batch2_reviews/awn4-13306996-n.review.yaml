step0_evidence:
  per_lemma:
    طريقة:
      confirm:
      - «والطبقة (ج) طرائق و(الطرائق) الطَّبَقَات بَعْضهَا فَوق بعض وَالْفرق الْمُخْتَلفَة الْأَهْوَاء وَيُقَال ثوب طرائق خلق أَو قطع» — المعجم الوسيط
      - «تحليلية تقيم العلاقة بين الجزء والكل كوحدة متسعة.» — المعجم الموحد لمصطلحات اللسانيات
      - «طريقة التنصيف (split-half method) ... إحدى طرائق قياس مدى ثبات الاختبار، بواسطة تقسيم أسئلة إلى نصفين» — مسرد الفن، التسلية والرياضة (موقع ArabTerm)
      expands:
      - «نَسِيجَةٌ تُنْسَجُ من صُوفٍ أو شَعْر تُسْتَعمل في الخيام وغيرها» — المعجم الكبير
      - «الخَطُّ في الدِّرْع أو السَّيْفِ ونحوهما» — المعجم الكبير
      - «كل لَحْمَةٍ مُسْتَطِيلَةٍ فيها عَصَبٌ» — المعجم الكبير
      contradicts:
      - '«الطريقة: هي السيرة المختصة بالسالكين إلى الله تعالى من قطع المنازل والترقي في المقامات.» — كتاب التعريفات للشريف الجرجاني'
      - '«الطريقة: هي السيرة المُختصَّة بالسالكين إلى الله من قطع المنازل والترقي في المقامات» — التعريفات الفقهيّة للبركتي'
      - '«في البرمجة الغرضية التوجه: إجرائيةٌ يُنفِّذها غرضٌ object عند تلقيه رسالة.» — معجم مصطلحات المعلوماتية'
      - '«الطَّرِيقَة: هِيَ السِّيرَة المختصة بالسالكين إِلَى الله تَعَالَى من قطع الْمنَازل والترقي فِي المقامات.» — دستور العلماء للأحمدنكري'
      - «طريقة العمل.» — المورد الحديث (2008)
      - «طريقة بَسِّمَر [في إنتاج الفولاذ].» — المورد الحديث (2008)
      - '«طريقة مونتيسّوري: مذهب في التربية وضعته ماريا مونتيسّوري» — المورد الحديث (2008)'
      - '«طريقة مباشرة: في تعليم اللغات» — مسرد الفن، التسلية والرياضة (موقع ArabTerm)'
      - '«طريقة الحفظ: طريقة يركز فيها المدرس على حفظ التلاميذ لما تعلموه وترديده شفويا» — مسرد الفن، التسلية والرياضة (موقع ArabTerm)'
    قسمة:
      confirm:
      - «القسمة إما بتية أو قسمة مهايأة، فالأولى هي أداة لفرز نصيب كل شريك في ملك مشاع وينقضي بها الشيوع، أما الثانية فهي تقتصر على المنافع.» — المعجم الموحد لمصطلحات القانون (2017)
      - '«قسمة: aliquot» — المعجم الموحد لمصطلحات الطب البيطري (2010)'
      - '«القسمة: لغة: من الاقتسام، وفي الشريعة: تمييز الحقوق وإفراز الأنصباء. قسمة الدين قبل قبض الدين: ما إذا استوفى أحد الشريكين نصيبه شركه الآخر فيه؛ لئلا يلزم قسمة الدين قبل القبض.» — كتاب التعريفات
        للشريف الجرجاني'
      - '«القسْمَة: إِفْرَاز حق كل ذِي حق من الْملك شرعا.» — معجم مقاليد العلوم للسيوطي'
      - '«القِسمة: هي تعيين الحصَّة الشائعة يعني إفراز الحصص بعضها من بعض بقياس وغيره.» — التعريفات الفقهيّة للبركتي'
      - «اسم من اقتسام الشَّيْء والنصيب» — المعجم الوسيط
      - «تجزئة الشيء وتوزيعه على مستحقيه والنصيب.» — موسوعة السلطان قابوس لأسماء العرب
      - «قسمة بالتراضي» — المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)
      contradicts:
      - '«قسمة: division» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)'
      - '«القسمة: الأولية: أن يكون الاختلاف بين الأقسام بالذات، كانقسام الحيوان إلى الفرس والحمار.» — التوقيف على مهمات التعاريف للمناوي'
      - «عن العبرية بمعنى سحر وتنجيم وتنبؤ وفتنة وجاذبية والتاء للتأنيث.» — موسوعة السلطان قابوس لأسماء العرب
      - «جُونَةُ العطَّار» — المعجم الوسيط
      expands:
      - «يقسِّم إلى فئات أو مقصورات.» — المورد الحديث (2008)
      - '«قسمة ثلاثية: للإيقاع» — مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)'
      - '«تقسيم الدائرة الفرملية: تُقَسم منظومة الفرامل الهيدرولية إلى دائرتين فرمليتين مُستقلتين، وذلك للتأكيد على ضمان تشغيلها.» — مسرد هندسة وتكنولوجيا السيارات، المنظمة العربية للتربية والثقافة والعلوم
        (موقع ArabTerm)'
      - '«تقسيم الصور: عملية تقسيم الصورة الرقمية إلى مجموعات من البكسلات.» — معجم البيانات والذكاء الاصطناعي (2024)'
      - '«تقسيم العمل: إسناد مهام محددة للعمال وللموارد الإنتاجية؛ إنه انعكاس للتخصص الاقتصادي.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)'
step1_lemma_validation:
  per_lemma:
  - lemma: طريقة
    decision: removed
    decision_reason: 'تناقض دلالي: المعنى المعجمي للملمة (منهج/أسلوب) يختلف عن تعريف المجموعة (جزء/حصة)'
    evidence_assessment:
      case: contradicts
      notes:
      - 'تناقض: المعنى المعجمي لـ ''طريقة'' لا يندرج تحت مفهوم ''جزء من شيء مقسم'''
    substitution_test:
      result: fail
      failure_sentences:
      - original: حصلتُ على قسمةٍ عادلةٍ من الميراث
        substituted: حصلتُ على طريقةٍ عادلةٍ من الميراث
        preserved_meaning: false
        why_failed: تغير المعنى من الحصة المادية إلى الأسلوب أو المنهج
    reasoning:
      evidence_weight: أدلة التناقض أقوى من أدلة التأكيد (التي كانت مجرد أمثلة تقنية لمصطلح 'طريقة تقسيم')
      removal_justification: فشل اختبار الاستبدال وتناقض المعنى المعجمي
    actions:
    - &id001
      command: احذف ارتباط اللمّة بالمجموعة
      params:
        lemma: طريقة
        reason: تناقض دلالي مع تعريف المجموعة
  - lemma: قسمة
    decision: confirmed
    decision_reason: أدلة مؤكّدة وتطابق دلالي مع تعريف المجموعة
    evidence_assessment:
      case: confirm_only
    substitution_test:
      result: pass
    reasoning:
      evidence_weight: أدلة قوية من المعجم القانوني والفقهي تدعم المعنى
      nuance_differentiation: يتميّز عن 'حصة' بتركيزه على عملية التجزئة وإفراز النصيب، بينما 'حصة' تشير إلى الجزء الناتج
    actions:
    - &id002
      command: أكّد صلاحية اللمّة
      params:
        lemma: قسمة
    - &id003
      command: سجّل ملاحظة دلالية
      params:
        lemma: قسمة
        note: يتميّز عن 'حصة' بتركيزه على عملية التجزئة وإفراز النصيب
  synset_flags:
    definition_review_needed: true
