    dictionary_comparison: المعاجم العربية تركز على كون القسمة هي الحظ أو النصيب المفرز.
    terminological_strategy: الجنس القريب = «نصيب» + الفصل المميّز = «مفرز من شيء تم تقسيمه».
    linguistic_strategy: تبسيط التعريف ليركز على معنى الحصة/النصيب.
