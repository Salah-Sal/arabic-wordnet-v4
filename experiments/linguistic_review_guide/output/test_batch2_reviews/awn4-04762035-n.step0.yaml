synset: awn4-04762035-n
per_lemma:
  ثَبَات:
    confirm:
      - «الثبات: ضد الزوال، والثبات والثبوت ضد التزلزل، وثبت الأمر صح، وأثبت الكاتب الاسم كتبه عنده. ورجل ثبت بسكون الباء متثبت في أموره. وثبت الجنان أي ثابت القلب، والاسم ثبت بالفتح ومنه قيل للحجة ثبت، ورجل ثبت بفتحتين إذا كان عدلا ضابطا.» — التوقيف على مهمات التعاريف للمناوي
      - «الثّبات: [في الانكليزية] Stability ،permanence [ في الفرنسية] Stabilite ،permanence هو عدم احتمال الزّوال بتشكيك المشكّك. وقيل هو الجزم المطابق الذي ليس بثابت، وهو تقليد المصيب، كذا في شرح العقائد وحواشيه في بيان خبر الرسول.» — كشّاف اصطلاحات الفنون والعلوم للتهانوي
      - «(1) يُثبت (ق) (2) يؤكِّد؛ يَجْزِم.» — المورد الحديث (2008)
      - «(1) إثبات (ق) (2) تأكيد؛ جزم (3) توكيد.» — المورد الحديث (2008)
      - «(1) إثبات الوصية: إثبات صحة وصية المتوفَّى [أمام القضاء] (2) الوصية المُثْبَتَة: نسخة مصدَّقة عن وصيةٍ أُثبتت صحَّتُها (3) يُثبت صحّة الوصية.» — المورد الحديث (2008)
    contradicts:
      - «ثُبات: الجذر: ث ب ت مثال: وَجَدتُه في ثُبَات عميق الرأي: مرفوضة عند بعضهم السبب: لأن هذه الكلمة بالثاء لا تؤدي المعنى المراد هنا. المعنى: نَوْم الصواب والرتبة: وجدتُه في سُبَاتٍ عميق [فصيحة] التعليق: الوارد في المعاجم «السُّبات: النوم» بالسين لا بالثاء. وفي القرآن الكريم: {وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا} النبأ/9.» — معجم الصواب اللغوي لأحمد مختار عمر
      - «داءٌ ثُباتٌ: معجز عن الحركة» — المعجم الوسيط
      - «داءٌ ثُباتٌ : مُعْجِزٌ عن الحركة» — المعجم الكبير
    expands:
      - «عندما يطبق على مادة كيميائية فإنه يعني القدرة على البقاء دون تغيير رغم تأثيرات البيئة.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)
      - «خاصية بيانات لها توزيع ثابت على بُعد واحد أو أكثر.» — معجم البيانات والذكاء الاصطناعي (2024)
      - «خاصية بقاء المستحضر أو الشكل الصيدلاني ّ على حالة واحدة.» — المعجم الموحد لمصطلحات علم الصيدلة (2009)
      - «انسجام بين الإدراك والتوقعات.» — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)
      - «يتصف الاختبار بالثبات عندما يعطي النتائج تقريبًا في كل مرة يطبق فيها على نفس الطلاب وفي ظل ظروف متشابهة.» — مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)
      - «سَيْرٌ يُشَدُّ به الرَّحْل شِباَمُ البُرْقُعِ , وهما شِباَمانِ : خَيْطان في البُرْقُعِ تَشُدُّه المرأةُ بهما في مُؤَخَّرِ رَأْسِها» — المعجم الكبير
      - «الثبة: عشرة فما فوق ذلك.» — غريب القرآن في شعر العرب لعبد الله بن عباس
  يَقِين:
    confirm:
      - «اليقين: في اللغة: العلم الذي لا شك معه، وفي الاصطلاح: اعتقاد الشيء بأنه كذا مع اعتقاد أنه لا يمكن إلا كذا، مطابقًا للواقع غير ممكن الزوال» — كتاب التعريفات للشريف الجرجاني
      - «اليَقِينُ: علم يحصل بعد اسْتِدْلَال وروية» — معجم مقاليد العلوم للسيوطي
      - «اليقين: لغة: العلم الذي لا شك معه. واصطلاحا: العلم الشيء بعد أن كان صاحبه شاكا فيه» — التوقيف على مهمات التعاريف للمناوي
      - «اليقين: في عرف علماء الرسوم الاعتقاد الجازم المطابق الثابت أي الذي لا يزول بتشكيك المشكّك» — كشّاف اصطلاحات الفنون والعلوم للتهانوي
      - «اليَقِين: في اللغة: العلمُ الذي لا شكَّ معه وفي الاصطلاح: اعتقاد الشيء بأنه كذا مع اعتقاد أنه لا يمكن إلا كذا مطابقاً للواقع غير ممكنِ الزوال» — التعريفات الفقهيّة للبركتي
      - «(الْيَقِين) الْعلم الَّذِي لَا شكّ مَعَه» — المعجم الوسيط لمجموعة من المؤلفين
      - «اليَقِين فِي الْعرف هُوَ التَّصْدِيق الْجَازِم المطابق الثَّابِت» — دستور العلماء للأحمدنكري
      - «العِلْمُ الذى لا شكَّ معه» — المعجم الوسيط
      - «اليَقِينُ: العلم وزوالُ الشك» — تاج اللغة وصِحاح العربية للجوهري
      - «الْيَقَنُ وَالْيَقِينُ: زَوَالُ الشَّكِّ» — مقاييس اللغة لابن فارس
      - «الْيَقِين: إزاحة الشَّك» — المحكم والمحيط الأعظم لابن سيده الأندلسي
      - «يقن الأمر يقناً، وهو يقين» — أساس البلاغة للزمخشري
      - «(الْيَقِينُ) الْعِلْمُ وَزَوَالُ الشَّكِّ» — مختار الصحاح للرازي
      - «اليَقِينُ: العِلْم وإزاحة الشك وتحقيقُ الأَمر» — لسان العرب لابن منظور
      - «الْيَقِينُ الْعِلْمُ الْحَاصِلُ عَنْ نَظَرٍ وَاسْتِدْلَالٍ» — المصباح المنير للفيّومي
      - «واليَقينُ: إزاحَةُ الشَّك» — القاموس المحيط للفيروزآبادي
      - «اليَقِينُ: إزاحَةُ الشَّكِّ والعِلْمُ وتَحْقِيقُ الأمْرِ» — تاج العروس لمرتضى الزبيدي
      - «He knew it; he was, or became, certain, or sure, or he made sure, of it» — المعجم العربي الإنجليزي لإدوارد وليام لين
      - «Was certain, positive about; knew; assured himself of» — حبيب سالمون، قاموس عربي انجليزي متقدم للمتعلمين
      - «(يقن) الشيء (ييقن) يقنا ويقينا ثَبت وَتحقّق ووضح» — المعجم الوسيط لمجموعة من المؤلفين
      - «يقِنَ الشَّيءُ: ثبَت وتحقّق ووضَح» — معجم اللغة العربية المعاصرة لأحمد مختار عمر
      - «اليَقِينُ من صفة العلم فوق المعرفة والدّراية وأخواتها» — المفردات في غريب القرآن للراغب الأصفهاني
      - «اليَقَنُ: اليَقِيْنُ وإزَاحَةُ الشَّك» — المحيط في اللغة للصاحب بن عباد
      - «اليقين وهو إزاحة الشك وتحقيق الأمر» — كتاب العين للخليل بن أحمد الفراهيدي
      - «زوال الشك» — مجمل اللغة لابن فارس
