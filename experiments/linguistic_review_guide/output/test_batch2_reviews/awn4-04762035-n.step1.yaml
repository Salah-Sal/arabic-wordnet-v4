step1_lemma_validation:
  per_lemma:
    - lemma: "ثَبَات"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة في المعاجم بمعنى الاستقرار والرسوخ"
      evidence_assessment:
        case: "confirm_only"
        notes:
          - "التناقضات الواردة في الأدلة تخص كلمة (ثُبات) بمعنى النوم، وهي كلمة مختلفة وليست اللمّة المقصودة."
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "هذا الأمر فيه ثبات"
            substituted: "هذا الأمر فيه يقين"
            preserved_meaning: true
      reasoning:
        evidence_weight: "أدلة قوية ومتعددة في المعاجم المعتبرة (التهانوي، المناوي، المورد)"
        nuance_differentiation: "يتميّز عن «يقين» بكونه صفة للشيء نفسه (الاستقرار، الدوام، والقدرة على البقاء) وليس صفة للحالة الإدراكية."
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "ثَبَات"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "ثَبَات"
            note: "يتميّز عن «يقين» بكونه صفة للشيء نفسه (الاستقرار، الدوام، والقدرة على البقاء) وليس صفة للحالة الإدراكية."

    - lemma: "يَقِين"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة وإجماع معجمي"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "وصلت إلى يقين بشأن الأمر"
            substituted: "وصلت إلى ثبات بشأن الأمر"
            preserved_meaning: true
      reasoning:
        evidence_weight: "إجماع معجمي واسع (الجرجاني، السيوطي، ابن منظور، الوسيط)"
        nuance_differentiation: "يتميّز عن «ثبات» بكونه صفة للحالة الإدراكية (العلم الذي لا شك فيه) وليس صفة للشيء المادي أو المعنوي."
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "يَقِين"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "يَقِين"
            note: "يتميّز عن «ثبات» بكونه صفة للحالة الإدراكية (العلم الذي لا شك فيه) وليس صفة للشيء المادي أو المعنوي."