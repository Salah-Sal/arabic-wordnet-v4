step3_definition:
  definition_review_flag: true
  current_definition: "ظلام نسبي ناتج عن اعتراض الأشعة الضوئية بواسطة جسم معتم"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي يركز على الجانب الفيزيائي فقط، ويتجاهل التمييز اللغوي التراثي بين «الظل» و«الفيء»، حيث يُعد الفيء نوعاً خاصاً من الظل يرجع بعد الزوال."
  scope_note: "التعريف الكلاسيكي يميّز بين الظل (عام) والفيء (خاص بما بعد الزوال)، لذا يجب أن يعكس التعريف هذا التمييز."

  authored_definitions:
    - type: "terminological"
      text: "منطقة تتكون نتيجة حجب جسم معتم لمصدر ضوئي، وتتفاوت شدة عتمتها بحسب طبيعة المصدر وحجم الجسم الحاجب."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

    - type: "linguistic"
      text: "موضع استكنانٍ عن الشمس أو الضوء، ويُخصّ ما كان منها بعد الزوال باسم «الفيء» لرجوعه من جانب إلى جانب."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

  reasoning:
    revision_justification: "التعريف الحالي ضيّق ولا يستوعب الفروق الدلالية بين «الظل» و«الفيء» الموجودة في المعاجم العربية."
    dictionary_comparison: "المعاجم (القاموس المحيط، لسان العرب، التعريفات للجرجاني) تؤكد أن الفيء هو الظل بعد الزوال لرجوعه، وهذا مفقود في التعريف الحالي."
    terminological_strategy: "الاعتماد على «منطقة» كجنس قريب، وتحديد الفصل النوعي بالظاهرة الفيزيائية (حجب الضوء)."
    linguistic_strategy: "الاعتماد على «موضع استكنان» كجنس قريب، وتحديد الفصل النوعي بالجانب الزمني (بعد الزوال) للتمييز بين اللمّتين."

  actions:
    - command: "عدّل نص التعريف"
      params:
        definition_index: 0
        new_text: "موضع استكنانٍ عن الشمس أو الضوء، وتتفاوت شدته بحسب اعتراض الأجسام للمصدر الضوئي، ويُخصّ ما كان منها بعد الزوال باسم «الفيء»."

    - command: "ألّف تعريفاً جديداً"
      params:
        type: "terminological"
        text: "منطقة تتكون نتيجة حجب جسم معتم لمصدر ضوئي، وتتفاوت شدة عتمتها بحسب طبيعة المصدر وحجم الجسم الحاجب."

    - command: "ألّف تعريفاً جديداً"
      params:
        type: "linguistic"
        text: "موضع استكنانٍ عن الشمس أو الضوء، ويُخصّ ما كان منها بعد الزوال باسم «الفيء» لرجوعه من جانب إلى جانب."

    - command: "سجّل ملاحظة دلالية"
      params:
        note: "التمييز بين الظل والفيء ضروري لغوياً؛ فالظل أعم، والفيء ما كان بعد الزوال."