step0_raw: "step0_evidence:\n  synset_id: awn4-14008098-n\n  per_lemma:\n    ظل:\n      confirm:\n        - «القسم المعتم الذي حجب عنه الإشعاع الكهرمغنطيسي المباشر المنبعث من منبع ما. وفي الرادار، منطقة\
  \ بلا إشعاع مرتد، وظل الرادار مشابه للظل الناتج عن الضوء المرئي» — المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)\n        - «الظل: ما نسخته الشمس، وهو من الطلوع إلى الزوال» — كتاب التعريفات للشريف الجرجاني\n\
  \        - «الظل: ما نسخته الشمس، وهو من الطلوع إلى الزوال، كذا عبر ابن الكمال. وقال الراغب: الظل ضد الضح وهو أعم من الفيء، فإنه يقال ظل الليل وظل الجنة، ويقال لكل موضع لم تصل إليه الشمس ظل» — التوقيف\
  \ على مهمات التعاريف للمناوي\n        - «الظّل: [في الانكليزية] Shadow [ في الفرنسية] Ombre بالكسر قيل هو الضوء الثاني وهو الحاصل من مقابلة المضيء بغيره، وقيل هو الضوء الثاني الحاصل من مقابلة الهواء المضيء...\
  \ ثم للظلّ مراتب كثيرة متفاوتة بالشّدّة والضّعف، وطرفاه النور والظلمة» — كشّاف اصطلاحات الفنون والعلوم للتهانوي\n        - «الظِلُّ، بالكسر: نَقِيضُ الضِّحِّ، أو هو الفَيْءُ، أو هو بالغَداةِ، والفَيْءُ\
  \ بالعَشِيِّ... ومن كلِّ شيءٍ: شَخْصُه، أو كِنُّه... ومن السحابِ: ما وارَى الشمسَ منه، أو سَوادهُ» — القاموس المحيط للفيروزآبادي\n        - «فَالظِّلُّ: ظِلُّ الْإِنْسَانِ وَغَيْرِهِ، وَيَكُونُ بِالْغَدَاةِ\
  \ وَالْعَشِيِّ... وَأَظَلَّتْنِي الشَّجَرَةُ» — مقاييس اللغة لابن فارس\n        - «والظِّلُّ لون النَهار تغلِبُ عليه الشَّمْسُ... والمِظَلَّة: البُرْطُلَّة، والظُّلَّة والمِظَلَّة سواء وهما ما يُستَظَلُّ\
  \ به من الشمْس» — كتاب العين للخليل بن أحمد الفراهيدي\n      expands:\n        - «الظل: هو الوجود الإضافي الظاهر بتعينات الأعيان الممكنة وأحكامها التي هي معدومات ظهرت باسمه النور...» — كتاب التعريفات\
  \ للشريف الجرجاني\n        - «ويعبر بالظل عن العز والرفاهية، الظل في اصطلاح أهل الحقيقة: وجود الراحة خلف الحجاب» — التوقيف على مهمات التعاريف للمناوي\n        - «في اصطلاح المشايخ هو الوجود الإضافي الظاهر\
  \ بتعيّنات الأعيان الممكنة وأحكامها التي هي معدومات ظهرت باسمه النور...» — كشّاف اصطلاحات الفنون والعلوم للتهانوي\n        - «وقال الرياضيون الظلّ هو الخط المستقيم في السطح الذي قام عليه المقياس عمودا\
  \ بين مركز قاعدة المقياس وطرف الخط الشعاعي المار برأس المقياس...» — كشّاف اصطلحات الفنون والعلوم للتهانوي\n        - «والليلُ أو جُنْحُهُ... والعِزُّ والمَنَعَةُ... ومن الشَّبابِ: أوَّلهُ، ومن القَيْظِ:\
  \ شِدَّتُه» — القاموس المحيط للفيروزآبادي\n        - «والليلُ ظِلٌّ... وأظَلَّكَ فُلَانٌ، كَأَنَّهُ وَقَاكَ بِظِلِّهِ، وَهُوَ عِزُّهُ وَمَنَعَتُهُ» — مقاييس اللغة لابن فارس\n        - «وسَواد الليل يُسَمَّى\
  \ ظِلاًّ... والإِظْلالُ: الدُّنُوُّ، يقال: أظَلَّكَ فلانٌ، أي كأنَّه أَلْقَى عليكَ ظِلَّه من قُرْبه... والظِّلُّ من الخيال سِترٌ من الجن» — كتاب العين للخليل بن أحمد الفراهيدي\n      peripheral_observations:\n\
  \        - «shade» — المَكنَز الزراعي متعدد اللغات\n        - «shade» — المعجم الموحد لمصطلحات الكيمياء (1992)\n        - «shadow» — المعجم الموحد لمصطلحات التقنيات التربوية (1999)\n        - «من أشكال\
  \ ترئية النصوص والرسوم تظهرها وكأن لها ظلاَّ» — المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)\n        - «shade» — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)\n\
  \        - «umbra» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)\n        - «shadow; umbra» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)\n        - «ظَلَّ فلانٌ نَهارَه صائماً... ظَلَّ\
  \ يَفْعَلُ كذا، وذلك إذا فعله نهاراً» — كتاب العين للخليل بن أحمد الفراهيدي\n        - «ظَلَّ يَفْعَلُ كَذَا، وَذَلِكَ إِذَا فَعَلَهُ نَهَارًا» — مقاييس اللغة لابن فارس\n        - «ظَلَّ نَهارَهُ يَفْعَلُ\
  \ كذا» — القاموس المحيط للفيروزآبادي\n        - «الأَظَلُّ: باطِن مَنْسِم البعير» — كتاب العين للخليل بن أحمد الفراهيدي\n        - «الْأَظَلُّ، وَهُوَ بَاطِنُ خُفِ الْبَعِيرِ» — مقاييس اللغة لابن فارس\n\
  \        - «الأَظَلُّ: بَطْنُ الإِصْبَعِ، ومن الإِبِلِ: باطِنُ المَنْسِمِ» — القاموس المحيط للفيروزآبادي\n        - «الإِلظاظ: الإِلْحاحُ على الشيء، وألظ به» — كتاب العين للخليل بن أحمد الفراهيدي\n  \
  \  فيء:\n      confirm:\n        - «الفَيْءُ: ما كانَ شَمْساً فَيَنْسَخُهُ الظِّلُّ» — القاموس المحيط للفيروزآبادي\n        - «فيء: Shade, shadow; shelter, protection» — حبيب سالمون، قاموس عربي انجليزي\
  \ متقدم للمتعلمين\n      expands:\n        - «فَاءَ الظِّلُّ يَفِيءُ فَيْئًا رَجَعَ مِنْ جَانِبِ الْمَغْرِبِ إلَى جَانِب الْمَشْرِقِ» — المصباح المنير للفيّومي\n        - «الفيء: ما ينسخ الشمس، وهو من\
  \ الزوال إلى الغرب، كما أن الظل ما نسخته الشمس، وهو من الطلوع إلى الزوال» — كتاب التعريفات للشريف الجرجاني\n        - «سمّي به الظّلّ في عرف الرياضيين لرجوعه من جانب إلى جانب، وبعضهم يخصّه بالظلّ بعد\
  \ الزوال» — كشّاف اصطلاحات الفنون والعلوم للتهانوي\n        - «الظِّلُّ بعد الزوال ينبسط شرقا» — المعجم الوسيط\n        - «الظل إذا رجع من جانب المغرب إلى المشرق» — مجمل اللغة\n        - «وَإِنَّمَا سمي\
  \ الظل الَّذِي من الزَّوَال إِلَى الْغُرُوب فَيْئا لرجوعه من جَانب إِلَى جَانب» — دستور العلماء للأحمدنكري\n      peripheral_observations:\n        - «فَاءَ الرَّجُلُ يَفِيءُ فَيْئًا مِنْ بَابِ بَاعَ\
  \ رَجَعَ... وَالْفَيْءُ الْخَرَاجُ وَالْغَنِيمَةُ... وَالْفِئَةُ الْجَمَاعَةُ» — المصباح المنير للفيّومي\n        - «الفيء: ما ردَّه الله تعالى على أهل دينه من أموال من خالفهم في الدين بلا قتال» — كتاب\
  \ التعريفات للشريف الجرجاني\n        - «الفَيْءُ: مَا حصل من الْكفَّار بِلَا إيجَاف خيل، وركاب» — معجم مقاليد العلوم للسيوطي\n        - «الفيء: الرجوع إلى ما كان منه الانبعاث... وهو عرفا: ما حصل من الكفار\
  \ بلا قتال» — التوقيف على مهمات التعاريف للمناوي\n        - «الفَيْء: يُطلق على ما يحلُّ أخذ أموال الكُفَّار» — التعريفات الفقهيّة للبركتي\n        - «الْخَرَاجُ وَالْغنيمَةُ تنَال بِلَا قتال» — المعجم\
  \ الوسيط\n        - «الرُّجُوع من فَاء يفِيء إِذا رَجَعَ... وَأَيْضًا الْفَيْء الْغَنِيمَةُ» — دستور العلماء للأحمدنكري\n        - «غنائم المشركين» — مجمل اللغة"
