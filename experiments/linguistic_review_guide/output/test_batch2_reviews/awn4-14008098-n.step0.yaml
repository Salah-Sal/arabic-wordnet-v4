step0_evidence:
  synset_id: awn4-14008098-n
  per_lemma:
    ظل:
      confirm:
        - «القسم المعتم الذي حجب عنه الإشعاع الكهرمغنطيسي المباشر المنبعث من منبع ما. وفي الرادار، منطقة بلا إشعاع مرتد، وظل الرادار مشابه للظل الناتج عن الضوء المرئي» — المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)
        - «الظل: ما نسخته الشمس، وهو من الطلوع إلى الزوال» — كتاب التعريفات للشريف الجرجاني
        - «الظل: ما نسخته الشمس، وهو من الطلوع إلى الزوال، كذا عبر ابن الكمال. وقال الراغب: الظل ضد الضح وهو أعم من الفيء، فإنه يقال ظل الليل وظل الجنة، ويقال لكل موضع لم تصل إليه الشمس ظل» — التوقيف على مهمات التعاريف للمناوي
        - «الظّل: [في الانكليزية] Shadow [ في الفرنسية] Ombre بالكسر قيل هو الضوء الثاني وهو الحاصل من مقابلة المضيء بغيره، وقيل هو الضوء الثاني الحاصل من مقابلة الهواء المضيء... ثم للظلّ مراتب كثيرة متفاوتة بالشّدّة والضّعف، وطرفاه النور والظلمة» — كشّاف اصطلاحات الفنون والعلوم للتهانوي
        - «الظِلُّ، بالكسر: نَقِيضُ الضِّحِّ، أو هو الفَيْءُ، أو هو بالغَداةِ، والفَيْءُ بالعَشِيِّ... ومن كلِّ شيءٍ: شَخْصُه، أو كِنُّه... ومن السحابِ: ما وارَى الشمسَ منه، أو سَوادهُ» — القاموس المحيط للفيروزآبادي
        - «فَالظِّلُّ: ظِلُّ الْإِنْسَانِ وَغَيْرِهِ، وَيَكُونُ بِالْغَدَاةِ وَالْعَشِيِّ... وَأَظَلَّتْنِي الشَّجَرَةُ» — مقاييس اللغة لابن فارس
        - «والظِّلُّ لون النَهار تغلِبُ عليه الشَّمْسُ... والمِظَلَّة: البُرْطُلَّة، والظُّلَّة والمِظَلَّة سواء وهما ما يُستَظَلُّ به من الشمْس» — كتاب العين للخليل بن أحمد الفراهيدي
      expands:
        - «الظل: هو الوجود الإضافي الظاهر بتعينات الأعيان الممكنة وأحكامها التي هي معدومات ظهرت باسمه النور...» — كتاب التعريفات للشريف الجرجاني
        - «ويعبر بالظل عن العز والرفاهية، الظل في اصطلاح أهل الحقيقة: وجود الراحة خلف الحجاب» — التوقيف على مهمات التعاريف للمناوي
        - «في اصطلاح المشايخ هو الوجود الإضافي الظاهر بتعيّنات الأعيان الممكنة وأحكامها التي هي معدومات ظهرت باسمه النور...» — كشّاف اصطلاحات الفنون والعلوم للتهانوي
        - «وقال الرياضيون الظلّ هو الخط المستقيم في السطح الذي قام عليه المقياس عمودا بين مركز قاعدة المقياس وطرف الخط الشعاعي المار برأس المقياس...» — كشّاف اصطلحات الفنون والعلوم للتهانوي
        - «والليلُ أو جُنْحُهُ... والعِزُّ والمَنَعَةُ... ومن الشَّبابِ: أوَّلهُ، ومن القَيْظِ: شِدَّتُه» — القاموس المحيط للفيروزآبادي
        - «والليلُ ظِلٌّ... وأظَلَّكَ فُلَانٌ، كَأَنَّهُ وَقَاكَ بِظِلِّهِ، وَهُوَ عِزُّهُ وَمَنَعَتُهُ» — مقاييس اللغة لابن فارس
        - «وسَواد الليل يُسَمَّى ظِلاًّ... والإِظْلالُ: الدُّنُوُّ، يقال: أظَلَّكَ فلانٌ، أي كأنَّه أَلْقَى عليكَ ظِلَّه من قُرْبه... والظِّلُّ من الخيال سِترٌ من الجن» — كتاب العين للخليل بن أحمد الفراهيدي
      peripheral_observations:
        - «shade» — المَكنَز الزراعي متعدد اللغات
        - «shade» — المعجم الموحد لمصطلحات الكيمياء (1992)
        - «shadow» — المعجم الموحد لمصطلحات التقنيات التربوية (1999)
        - «من أشكال ترئية النصوص والرسوم تظهرها وكأن لها ظلاَّ» — المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)
        - «shade» — مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)
        - «umbra» — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)
        - «shadow; umbra» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)
        - «ظَلَّ فلانٌ نَهارَه صائماً... ظَلَّ يَفْعَلُ كذا، وذلك إذا فعله نهاراً» — كتاب العين للخليل بن أحمد الفراهيدي
        - «ظَلَّ يَفْعَلُ كَذَا، وَذَلِكَ إِذَا فَعَلَهُ نَهَارًا» — مقاييس اللغة لابن فارس
        - «ظَلَّ نَهارَهُ يَفْعَلُ كذا» — القاموس المحيط للفيروزآبادي
        - «الأَظَلُّ: باطِن مَنْسِم البعير» — كتاب العين للخليل بن أحمد الفراهيدي
        - «الْأَظَلُّ، وَهُوَ بَاطِنُ خُفِ الْبَعِيرِ» — مقاييس اللغة لابن فارس
        - «الأَظَلُّ: بَطْنُ الإِصْبَعِ، ومن الإِبِلِ: باطِنُ المَنْسِمِ» — القاموس المحيط للفيروزآبادي
        - «الإِلظاظ: الإِلْحاحُ على الشيء، وألظ به» — كتاب العين للخليل بن أحمد الفراهيدي
    فيء:
      confirm:
        - «الفَيْءُ: ما كانَ شَمْساً فَيَنْسَخُهُ الظِّلُّ» — القاموس المحيط للفيروزآبادي
        - «فيء: Shade, shadow; shelter, protection» — حبيب سالمون، قاموس عربي انجليزي متقدم للمتعلمين
      expands:
        - «فَاءَ الظِّلُّ يَفِيءُ فَيْئًا رَجَعَ مِنْ جَانِبِ الْمَغْرِبِ إلَى جَانِب الْمَشْرِقِ» — المصباح المنير للفيّومي
        - «الفيء: ما ينسخ الشمس، وهو من الزوال إلى الغرب، كما أن الظل ما نسخته الشمس، وهو من الطلوع إلى الزوال» — كتاب التعريفات للشريف الجرجاني
        - «سمّي به الظّلّ في عرف الرياضيين لرجوعه من جانب إلى جانب، وبعضهم يخصّه بالظلّ بعد الزوال» — كشّاف اصطلاحات الفنون والعلوم للتهانوي
        - «الظِّلُّ بعد الزوال ينبسط شرقا» — المعجم الوسيط
        - «الظل إذا رجع من جانب المغرب إلى المشرق» — مجمل اللغة
        - «وَإِنَّمَا سمي الظل الَّذِي من الزَّوَال إِلَى الْغُرُوب فَيْئا لرجوعه من جَانب إِلَى جَانب» — دستور العلماء للأحمدنكري
      peripheral_observations:
        - «فَاءَ الرَّجُلُ يَفِيءُ فَيْئًا مِنْ بَابِ بَاعَ رَجَعَ... وَالْفَيْءُ الْخَرَاجُ وَالْغَنِيمَةُ... وَالْفِئَةُ الْجَمَاعَةُ» — المصباح المنير للفيّومي
        - «الفيء: ما ردَّه الله تعالى على أهل دينه من أموال من خالفهم في الدين بلا قتال» — كتاب التعريفات للشريف الجرجاني
        - «الفَيْءُ: مَا حصل من الْكفَّار بِلَا إيجَاف خيل، وركاب» — معجم مقاليد العلوم للسيوطي
        - «الفيء: الرجوع إلى ما كان منه الانبعاث... وهو عرفا: ما حصل من الكفار بلا قتال» — التوقيف على مهمات التعاريف للمناوي
        - «الفَيْء: يُطلق على ما يحلُّ أخذ أموال الكُفَّار» — التعريفات الفقهيّة للبركتي
        - «الْخَرَاجُ وَالْغنيمَةُ تنَال بِلَا قتال» — المعجم الوسيط
        - «الرُّجُوع من فَاء يفِيء إِذا رَجَعَ... وَأَيْضًا الْفَيْء الْغَنِيمَةُ» — دستور العلماء للأحمدنكري
        - «غنائم المشركين» — مجمل اللغة