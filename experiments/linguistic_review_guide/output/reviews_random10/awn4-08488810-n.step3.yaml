step3_definition:
  definition_review_flag: false
  current_definition: "مجموعة من الأشخاص يعملون معاً لتعزيز أهداف ثقافية معينة"
  assessment:
    decision: "retain"
    reason: "التعريف الحالي دقيق ويصف المفهوم بوضوح، ويستوفي شروط التعريف الاصطلاحي (الجنس والفصل)، ولا يوجد تعارض مع الأدلة السياقية المتاحة."
  reasoning:
    revision_justification: "لا حاجة للتعديل؛ التعريف الحالي كافٍ وشامل للمفهوم ولا يعاني من غموض أو حشو."
    dictionary_comparison: "يتوافق التعريف مع الاستخدامات الاصطلاحية للمصطلح في العلوم الاجتماعية."