step0_evidence:
  per_lemma:
    وصية:
      confirm:
      - «(1) أمر؛ وصيّة (2) إحدى الوصايا العشر.» — المورد الحديث (2008)
      - «أَمْر؛ وصيّة [في اليهودية].» — المورد الحديث (2008)
      contradicts:
      - «عقد يوجب حقا في ثلث مال عاقده يلزم بموته. ويشترط في صحته خلوه من التناقض والتخليط مع سلامته مما منع شرعا.» — المعجم الموحد لمصطلحات القانون (2017)
      - «تمليك مضاف إلى ما بعد الموت.» — كتاب التعريفات للشريف الجرجاني
      - «تبرع مُضَاف إِلَى مَا بعد الْمَوْت.» — معجم مقاليد العلوم للسيوطي
      - «تمليكٌ مضافٌ إلى بعد الموت والمُمَلِّك هو المُوصِي ولِمَنْ له التمليك هو المُوصى له.» — التعريفات الفقهيّة للبركتي
      - «ما يُوصَى به» — المعجم الوسيط
      - «ما يوصى به من مال ونحوه، وجريدة النخل يحزم بها وهي من الغسيل خاصة، والعامة يطلقونها على من تقوم على شئون اليتيمن حتى يرشد.» — موسوعة السلطان قابوس لأسماء العرب
      expands:
      - '«الوصية: تمليك مضاف لما بعد الموت. وقال الراغب: التقدم إلى الغير بما يعمل مقترنا بوعظ، من قولهم: أرض واصية متصلة النبات.» — التوقيف على مهمات التعاريف للمناوي'
      - '«الوَصِيَّةُ: ما أَوْصَيْتَ به، وسميت وَصِيَّةً لاتصالها بأَمر الميت... وقوله تعالى {يوصيكم الله في أولادكم} النساء 11 معناه يَفْرِضُ عليكم لأَن الوصيَّةَ من الله إِنما هي فَرْضٌ والدليلُ على ذلك
        قولُه تعالى {ولا تقتلوا النفس التي حرم الله إلا بالحق ذلكم وصاكم به} الأنعام 151» — لسان العرب لابن منظور'
      - '«الوَصِيَّةُ: ما أَوْصَيْتَ به، وسميت وَصِيَّةً لاتصالها بأَمر الميت... وقوله تعالى {يُوصِيكُمُ اللهُ فِي أوْلادِكُم} (أَي يَفْرِضُ عَلَيْكُم) ، لأنَّ الوَصِيَّةُ، من اللهاِ إنَّما هِيَ فَرْضٌ،
        والدَّليلُ على ذلكَ قولهُ تَعَالَى: {وَلَا تَقْتُلوا النَّفْسَ الَّتِي حَرَّمَ ااُ إلاَّ بالحقِّ ذلكُم {وَصَّاكُم بِهِ} ؛ وَهَذَا مِن الفَرْضَ المُحْكم علينا.» — تاج العروس لمرتضى الزبيدي'
      - '«الوَصِيَّةُ: التّقدّمُ إلى الغير بما يعمل به مقترنا بوعظ... ووَصَّى: أنشأ فضله... ووَصَّى اللهُ الناسَ بفعل الخيرات واجتناب المحرمات» — المفردات في غريب القرآن للراغب الأصفهاني'
      - «(1) أمرٌ؛ وصيّة (2) طَلَب؛ رغبة.» — المورد الحديث (2008)
    ميتزفاه:
      evidence_status: no_material_found
step1_lemma_validation:
  per_lemma:
  - lemma: ميتزفاه
    decision: confirmed
    decision_reason: مصطلح ديني متخصص (Loanword) يُستخدم للإشارة للمفهوم في سياقه الثقافي
    evidence_assessment:
      case: no_material
      notes:
      - لا سند معجمي — مقبولة بحكم اللغوي كلفظ معرّب متخصص
    reasoning:
      evidence_weight: لا سند معجمي مباشر — القبول مبني على شيوع المصطلح في الخطاب الديني المتخصص
      linguist_justification: المصطلح يمثل المفهوم بدقة في سياقه الديني ولا بديل عربي يغني عنه دون فقدان الخصوصية الثقافية
      nuance_differentiation: يتميّز عن «وصية» بكونه مصطلحاً تقنياً غير قابل للخلط مع مفاهيم الميراث
    actions:
    - &id001
      command: أكّد صلاحية اللمّة
      params:
        lemma: ميتزفاه
    - &id002
      command: سجّل ملاحظة دلالية
      params:
        lemma: ميتزفاه
        note: مصطلح ديني متخصص (Loanword) يُستخدم للإشارة للمفهوم في سياقه الثقافي
    enrichment:
      eloquence: loanword
  - lemma: وصية
    decision: escalated
    decision_reason: تناقض مع التعريفات الفقهية والقانونية السائدة للكلمة
    evidence_assessment:
      case: mixed
      notes:
      - 'تناقض: المعنى المعجمي الفقهي (تمليك لما بعد الموت) يختلف عن تعريف المجموعة (أمر ديني)'
    substitution_test:
      result: fail
      failure_sentences:
      - original: التزم اليهودي بالميتزفاه
        substituted: التزم اليهودي بالوصية
        preserved_meaning: false
        why_failed: «الوصية» في السياق العربي غالباً ما تُفهم بمعنى الميراث أو التركة، مما يغير المعنى المقصود
    reasoning:
      evidence_weight: تعارض حقيقي — أدلة التأكيد (عامة) تصطدم بأدلة التناقض (قانونية/فقهية قوية)
      conflict_analysis: الكلمة تعاني من تعدد معانٍ (Polysemy) حاد، حيث يطغى المعنى الفقهي المالي على المعنى العام
      escalation_justification: 'لا يمكن حسم التعارض آلياً — يحتاج مراجعاً بشرياً ليقرر: هل يجب الإبقاء عليها مع تقييد (مثل: وصية دينية) أم حذفها؟'
    actions:
    - &id003
      command: سجّل ملاحظة دلالية
      params:
        lemma: وصية
        note: 'تناقض: المعنى المعجمي الفقهي يختلف عن تعريف المجموعة'
    - &id004
      command: صعّد للمراجع البشري
      params:
        reason: أدلة متضاربة — اللفظ يحمل دلالة فقهية/قانونية قوية تتعارض مع السياق الديني للمجموعة
  synset_flags:
    definition_review_needed: true
