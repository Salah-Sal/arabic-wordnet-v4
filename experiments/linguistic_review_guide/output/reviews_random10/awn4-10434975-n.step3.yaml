step3_definition:
  definition_review_flag: false
  current_definition: "شخص يستاء من أي شيء لا يفي بمعايير عالية جداً"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي وصفي أكثر منه معجمي؛ يركز على الشعور (الاستياء) بدلاً من السمة الشخصية الجوهرية (الحرص على الكمال). التعديل يهدف إلى دقة الصياغة."

  authored_definitions:
    - type: "terminological"
      text: "فردٌ يحرص على إنجاز الأعمال بأعلى درجات الإتقان، ويشعر بعدم الرضا تجاه ما دون ذلك من مستوى."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

    - type: "linguistic"
      text: "شخصٌ لا يرضى إلا بالعمل الكامل أو المثالي، ويصعب عليه قبول الأخطاء أو التقصير."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

  reasoning:
    revision_justification: "التعريف الحالي يميل إلى الوصف السيكولوجي، بينما التعريف المعجمي يجب أن يحدد السمة بوضوح."
    terminological_strategy: "الجنس القريب = (فرد) + الفصل المميّز = (يحرص على الإتقان + عدم الرضا عما دون ذلك)."
    linguistic_strategy: "تبسيط السمة الشخصية لغوياً بالتركيز على (عدم الرضا عن النقص)."

  actions:
