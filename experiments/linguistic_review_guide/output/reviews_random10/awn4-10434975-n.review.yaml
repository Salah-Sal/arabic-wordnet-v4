        note: تعبير وصفي نشط (Active) يدل على السعي المستمر للكمال
  - lemma: كمالي
    decision: escalated
    decision_reason: تعارض دلالي — اللفظ يُستخدم بمعنى (إضافي/accessory) أكثر من (شخص كمالي)
    evidence_assessment:
      case: no_material
      notes:
      - لا سند معجمي — اللفظ يُستخدم في سياقات أخرى (كماليات)
    substitution_test:
      result: fail
      failure_sentences:
      - original: اشترى غرضاً كمالياً للسيارة
        substituted: اشترى غرضاً باحثاً عن الكمال للسيارة
        preserved_meaning: false
        why_failed: اللفظ «كمالي» يحمل معنى (accessory) لا معنى الشخص
    reasoning:
      evidence_weight: غياب سند معجمي كاسم فاعل/صفة للشخص — وجود استخدامات متناقضة
      escalation_justification: اللفظ غامض؛ يُستخدم في العربية بمعنى «إضافي/accessory» أكثر من «شخص يسعى للكمال». يحتاج مراجعاً بشرياً لتقرير صلاحيته كاصطلاح نفسي
    actions:
    - &id003
      command: صعّد للمراجع البشري
      params:
        reason: تعارض دلالي شديد بين معنى (الشخص الكمالي) ومعنى (الشيء الإضافي/الكمالي)
