            note: "تناقض: المعنى المعجمي الفقهي يختلف عن تعريف المجموعة"
        - command: "صعّد للمراجع البشري"
          params:
            reason: "أدلة متضاربة — اللفظ يحمل دلالة فقهية/قانونية قوية تتعارض مع السياق الديني للمجموعة"

