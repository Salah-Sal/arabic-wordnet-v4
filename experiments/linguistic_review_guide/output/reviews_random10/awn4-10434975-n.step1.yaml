step1_lemma_validation:
  per_lemma:
    - lemma: "باحث عن الكمال"
      decision: "confirmed"
      decision_reason: "مقبولة بحكم اللغوي — تعبير وصفي دقيق وشائع"
      evidence_assessment:
        case: "no_material"
        notes:
          - "لا سند معجمي مباشر — مقبولة بحكم اللغوي كاصطلاح وصفي"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "إنه باحث عن الكمال في عمله"
            substituted: "إنه كمالي في عمله"
            preserved_meaning: true
      reasoning:
        evidence_weight: "لا سند معجمي مباشر — القبول مبني على الشيوع اللغوي والوضوح الدلالي"
        nuance_differentiation: "يتميّز بكونه تعبيراً وصفياً صريحاً (Active search) مقارنة باللفظ المختصر"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "باحث عن الكمال"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "باحث عن الكمال"
            note: "تعبير وصفي نشط (Active) يدل على السعي المستمر للكمال"

    - lemma: "كمالي"
      decision: "escalated"
      decision_reason: "تعارض دلالي — اللفظ يُستخدم بمعنى (إضافي/accessory) أكثر من (شخص كمالي)"
      evidence_assessment:
        case: "no_material"
        notes:
          - "لا سند معجمي — اللفظ يُستخدم في سياقات أخرى (كماليات)"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "اشترى غرضاً كمالياً للسيارة"
            substituted: "اشترى غرضاً باحثاً عن الكمال للسيارة"
            preserved_meaning: false
            why_failed: "اللفظ «كمالي» يحمل معنى (accessory) لا معنى الشخص"
      reasoning:
        evidence_weight: "غياب سند معجمي كاسم فاعل/صفة للشخص — وجود استخدامات متناقضة"
        escalation_justification: "اللفظ غامض؛ يُستخدم في العربية بمعنى «إضافي/accessory» أكثر من «شخص يسعى للكمال». يحتاج مراجعاً بشرياً لتقرير صلاحيته كاصطلاح نفسي"
      actions:
        - command: "صعّد للمراجع البشري"
          params:
            reason: "تعارض دلالي شديد بين معنى (الشخص الكمالي) ومعنى (الشيء الإضافي/الكمالي)"

  synset_flags:
    definition_review_needed: false
    split_needed: false