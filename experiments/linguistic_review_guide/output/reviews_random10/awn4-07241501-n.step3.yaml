step3_definition:
  definition_review_flag: true
  current_definition: "وعد رسمي، يستشهد عادة بشاهد إلهي، بخصوص أفعالك أو سلوكك المستقبلي"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي يحصر القسم في الأفعال المستقبلية، بينما القسم قد يكون لتأكيد خبرٍ ماضٍ أو حاضرٍ، كما أن الصياغة تحتاج إلى سبكٍ عربيٍّ أكثر فصاحة."
  
  authored_definitions:
    - type: "terminological"
      text: "التزامٌ مؤكَّدٌ بيمينٍ، يُقصد به تأكيدُ صدقِ الخبرِ أو العزمِ على فعلِ أمرٍ أو تركِهِ، وغالباً ما يكونُ مشفوعاً بالاستشهادِ باللهِ أو بمقدَّسٍ."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

    - type: "linguistic"
      text: "حَلِفٌ باللهِ أو بمقدَّسٍ لتأكيدِ وقوعِ أمرٍ أو التزامٍ بفعلهِ أو تركِهِ."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

  reasoning:
    revision_justification: "توسيع النطاق ليشمل تأكيد الأخبار (وليس فقط الأفعال المستقبلية) وتحسين الصياغة لتكون أكثر طبيعيةً في السياق العربي."
    dictionary_comparison: "التعريفات المعجمية العربية تركز على 'التأكيد' و'الاستشهاد بالله' كعنصر جوهري، وهو ما غاب عن صياغة AWN الحالية."
    terminological_strategy: "الجنس القريب = 'التزام مؤكد'، الفصل المميّز = 'بيمين مشفوع بالاستشهاد بالله لتأكيد خبر أو فعل'."
    linguistic_strategy: "تركيز على الجانب الإجرائي للقسم كحلفٍ مقترنٍ بالاستشهاد."

  actions:
