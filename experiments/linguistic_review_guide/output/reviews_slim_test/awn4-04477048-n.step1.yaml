step1_lemma_validation:
  per_lemma:
    - lemma: "ترامواي"
      decision: "removed"
      decision_reason: "تناقض مع المعنى المعجمي؛ المصطلح يشير إلى 'ترام' (على قضبان) وليس وسيلة معلقة بكابلات"
      evidence_assessment:
        case: "contradicts"
        notes:
          - "المعنى المعجمي يختلف عن تعريف المجموعة"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "ركب السياح التلفريك للصعود للجبل"
            substituted: "ركب السياح الترامواي للصعود للجبل"
            preserved_meaning: false
            why_failed: "الترامواي لا يصعد الجبال عبر الكابلات"
      reasoning:
        evidence_weight: "أدلة معجمية قوية تناقض انتماء اللمّة للمفهوم"
        removal_justification: "اللمّة تشير لوسيلة نقل قضبانية (ترام)، مما يسبب خلطاً دلالياً مع وسيلة النقل بالكابلات"
      actions:
        - command: "احذف ارتباط اللمّة بالمجموعة"
          params:
            lemma: "ترامواي"
            reason: "تناقض مع المعنى المعجمي"

    - lemma: "تلفريك"
      decision: "confirmed"
      decision_reason: "مصطلح دقيق ومعتمد معجمياً"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "أدلة قوية من المعجم الكبير ومعجم اللغة العربية المعاصرة"
        nuance_differentiation: "المصطلح المعياري الشائع لوسائل النقل المعلقة بالكابلات"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "تلفريك"

    - lemma: "قطار هوائي"
      decision: "removed"
      decision_reason: "غموض دلالي وتداخل مع أنظمة قطارات أخرى (مثل المونوريل)"
      evidence_assessment:
        case: "mixed"
        notes:
          - "تناقض: المصطلح غالباً ما يشير إلى قطار معلق (Monorail) وليس نظام كابلات"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "تستخدم المحطة كابلات لجر العربات"
            substituted: "تستخدم المحطة القطار الهوائي لجر العربات"
            preserved_meaning: false
            why_failed: "القطار الهوائي نظام مستقل بذاته غالباً"
      reasoning:
        evidence_weight: "أدلة متضاربة؛ يميل الاستخدام المعجمي لوصف القطارات المعلقة"
        removal_justification: "احتمالية عالية للخلط بين الأنظمة التقنية (كابلات مقابل قضبان معلقة)"
      actions:
        - command: "احذف ارتباط اللمّة بالمجموعة"
          params:
            lemma: "قطار هوائي"
            reason: "غموض دلالي وتداخل مع أنظمة أخرى"
        - command: "أضف لمّة جديدة إلى المجموعة"
          params:
            new_lemma: "مِعْبَر هوائي"

  synset_flags:
    definition_review_needed: true
    split_needed: false

  added_lemmas:
    - lemma: "مِعْبَر هوائي"
      reason: "مرادف فصيح دقيق ورد في المعجم الكبير"
      via_command: "أضف لمّة جديدة إلى المجموعة"