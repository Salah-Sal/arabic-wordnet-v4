  current_definition: وسيلة نقل تنقل الركاب أو البضائع في عربات معلقة بكابلات ومحمولة بواسطة سلسلة من الأبراج
  assessment:
    decision: revise
    reason: التعريف الحالي دقيق ولكنه يفتقر إلى الإشارة لطبيعة التشغيل (الكهربائية) كما في المعاجم الحديثة، ولإضافة سياق الاستخدام.
  authored_definitions:
  - type: terminological
    text: وسيلة نقل تعتمد على عربات معلّقة بأسلاك أو كابلات معدنية، تنتقل في الهواء بين أبراج مخصصة.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  - type: encyclopedic
