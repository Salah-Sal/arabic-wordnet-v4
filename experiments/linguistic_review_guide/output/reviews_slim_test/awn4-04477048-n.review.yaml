step0_raw: "\nstep0_evidence:\n  per_lemma:\n    ترامواي:\n      contradicts:\n        - \"«ترام؛ ترامواي.» — المورد الحديث (2008)\"\n        - \"«tramway» — المعجم الموحد لمصطلحات النقل (2010)\"\n    \
  \  peripheral_observations: \"التعريف المستهدف في الطلب يصف بدقة 'التلفريك' (Cable car/Aerial tramway)، بينما تشير الأدلة المعجمية المتاحة لـ 'ترامواي' إلى 'الترام' (Streetcar/Tram) الذي يسير على قضبان\
  \ حديدية في الشوارع.\"\n    تلفريك:\n      confirm:\n        - \"«تلفريكتِلِفْريك [مفرد]: وسيلة مواصلات معلّقة تعمل بالكهرباء وتسير على أسلاك معلقة في الهواء \"طالب الصحفيّ بإقامة تلفريك لنقل السائحين\
  \ بين ضفتي النهر\".» — معجم اللغة العربية المعاصرة لأحمد مختار عمر\"\n        - \"«(Téléfereque): وَسِيلة لِنَقْل الناس فى مركَبَاتٍ هَوائِيَّة كَهْربيَّة معلَّقة, ويُطلَق عليه أيضاً مِعْبَر هوائى.» —\
  \ المعجم الكبير\"\n      expands:\n        - \"«تلفريكتِلِفْريك [مفرد]: وسيلة مواصلات معلّقة تعمل بالكهرباء وتسير على أسلاك معلقة في الهواء...» — معجم اللغة العربية المعاصرة لأحمد مختار عمر\"\n      \
  \  - \"«(Téléfereque): وَسِيلة لِنَقْل الناس فى مركَبَاتٍ هَوائِيَّة كَهْربيَّة معلَّقة, ويُطلَق عليه أيضاً مِعْبَر هوائى.» — المعجم الكبير\"\n      peripheral_observations: \"المعجم الكبير أشار إلى الأصل\
  \ الأجنبي للكلمة (Téléfereque). التعريفات ركزت على نقل 'الناس'، بينما التعريف المستهدف أضاف 'البضائع'.\"\n    قطار هوائي:\n      confirm:\n        - \"«القطار المعلَّق: نظام لنقل الكهرباء بواسطة عربات\
  \ معلّقة.» — المورد الحديث (2008)\"\n        - \"«elevated railway» -> «قطار معلق» — مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)\"\n      contradicts:\n     \
  \   - \"«مجموعة من مَرْكبات السكة الحديدية تجرها قاطرة» — المعجم الوسيط\"\n        - \"«قاطرات منفصلة أو متصلة ببعضهما بهما عربات أو بدون عربات تم نقلها للمسار» — المعجم الموحد لمصطلحات النقل (2010)\"\
  \n        - \"«مجموعة من مركبات السكة الحديدية تجرها قاطرة (محدثة)» — المعجم الوسيط لمجموعة من المؤلفين\"\n      peripheral_observations: \"المصطلح «قطار معلق» هو الأقرب دلالياً للمصطلح المطلوب، رغم وجود\
  \ تداخل مع أنظمة القطارات المعلقة (Monorail) التي قد لا تكون معلقة بكابلات.\"\n"
step1_lemma_validation:
  per_lemma:
  - lemma: ترامواي
    decision: removed
    decision_reason: تناقض مع المعنى المعجمي؛ المصطلح يشير إلى 'ترام' (على قضبان) وليس وسيلة معلقة بكابلات
    evidence_assessment:
      case: contradicts
      notes:
      - المعنى المعجمي يختلف عن تعريف المجموعة
    substitution_test:
      result: fail
      failure_sentences:
      - original: ركب السياح التلفريك للصعود للجبل
        substituted: ركب السياح الترامواي للصعود للجبل
        preserved_meaning: false
        why_failed: الترامواي لا يصعد الجبال عبر الكابلات
    reasoning:
      evidence_weight: أدلة معجمية قوية تناقض انتماء اللمّة للمفهوم
      removal_justification: اللمّة تشير لوسيلة نقل قضبانية (ترام)، مما يسبب خلطاً دلالياً مع وسيلة النقل بالكابلات
    actions:
    - &id001
      command: احذف ارتباط اللمّة بالمجموعة
      params:
        lemma: ترامواي
        reason: تناقض مع المعنى المعجمي
  - lemma: تلفريك
    decision: confirmed
    decision_reason: مصطلح دقيق ومعتمد معجمياً
    evidence_assessment:
      case: confirm_only
    substitution_test:
      result: pass
    reasoning:
      evidence_weight: أدلة قوية من المعجم الكبير ومعجم اللغة العربية المعاصرة
      nuance_differentiation: المصطلح المعياري الشائع لوسائل النقل المعلقة بالكابلات
    actions:
    - &id002
      command: أكّد صلاحية اللمّة
      params:
        lemma: تلفريك
  - lemma: قطار هوائي
    decision: removed
    decision_reason: غموض دلالي وتداخل مع أنظمة قطارات أخرى (مثل المونوريل)
    evidence_assessment:
      case: mixed
      notes:
      - 'تناقض: المصطلح غالباً ما يشير إلى قطار معلق (Monorail) وليس نظام كابلات'
    substitution_test:
      result: fail
      failure_sentences:
      - original: تستخدم المحطة كابلات لجر العربات
        substituted: تستخدم المحطة القطار الهوائي لجر العربات
        preserved_meaning: false
        why_failed: القطار الهوائي نظام مستقل بذاته غالباً
    reasoning:
      evidence_weight: أدلة متضاربة؛ يميل الاستخدام المعجمي لوصف القطارات المعلقة
      removal_justification: احتمالية عالية للخلط بين الأنظمة التقنية (كابلات مقابل قضبان معلقة)
    actions:
    - &id003
      command: احذف ارتباط اللمّة بالمجموعة
      params:
        lemma: قطار هوائي
        reason: غموض دلالي وتداخل مع أنظمة أخرى
    - &id004
      command: أضف لمّة جديدة إلى المجموعة
      params:
        new_lemma: مِعْبَر هوائي
  synset_flags:
    definition_review_needed: true
    split_needed: false
  added_lemmas:
  - lemma: مِعْبَر هوائي
    reason: مرادف فصيح دقيق ورد في المعجم الكبير
    via_command: أضف لمّة جديدة إلى المجموعة
