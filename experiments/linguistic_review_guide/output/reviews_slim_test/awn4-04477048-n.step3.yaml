    dictionary_comparison: "المعجم الكبير والمعجم الوسيط ركزا على الطبيعة الكهربائية والتعليق الهوائي، وهو ما تم دمجه في التعريف الموسوعي."
    terminological_strategy: "الجنس القريب = «وسيلة نقل» + الفصل المميّز = «تعتمد على عربات معلّقة بأسلاك أو كابلات معدنية»."
    linguistic_strategy: "تم تقديم تعريف موسوعي يوضح آلية العمل والبيئة التشغيلية (مناطق جبلية)."

