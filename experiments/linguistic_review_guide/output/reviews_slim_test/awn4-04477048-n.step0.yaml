
step0_evidence:
  per_lemma:
    ترامواي:
      contradicts:
        - "«ترام؛ ترامواي.» — المورد الحديث (2008)"
        - "«tramway» — المعجم الموحد لمصطلحات النقل (2010)"
      peripheral_observations: "التعريف المستهدف في الطلب يصف بدقة 'التلفريك' (Cable car/Aerial tramway)، بينما تشير الأدلة المعجمية المتاحة لـ 'ترامواي' إلى 'الترام' (Streetcar/Tram) الذي يسير على قضبان حديدية في الشوارع."
    تلفريك:
      confirm:
        - "«تلفريكتِلِفْريك [مفرد]: وسيلة مواصلات معلّقة تعمل بالكهرباء وتسير على أسلاك معلقة في الهواء "طالب الصحفيّ بإقامة تلفريك لنقل السائحين بين ضفتي النهر".» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - "«(Téléfereque): وَسِيلة لِنَقْل الناس فى مركَبَاتٍ هَوائِيَّة كَهْربيَّة معلَّقة, ويُطلَق عليه أيضاً مِعْبَر هوائى.» — المعجم الكبير"
      expands:
        - "«تلفريكتِلِفْريك [مفرد]: وسيلة مواصلات معلّقة تعمل بالكهرباء وتسير على أسلاك معلقة في الهواء...» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - "«(Téléfereque): وَسِيلة لِنَقْل الناس فى مركَبَاتٍ هَوائِيَّة كَهْربيَّة معلَّقة, ويُطلَق عليه أيضاً مِعْبَر هوائى.» — المعجم الكبير"
      peripheral_observations: "المعجم الكبير أشار إلى الأصل الأجنبي للكلمة (Téléfereque). التعريفات ركزت على نقل 'الناس'، بينما التعريف المستهدف أضاف 'البضائع'."
    قطار هوائي:
      confirm:
        - "«القطار المعلَّق: نظام لنقل الكهرباء بواسطة عربات معلّقة.» — المورد الحديث (2008)"
        - "«elevated railway» -> «قطار معلق» — مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      contradicts:
        - "«مجموعة من مَرْكبات السكة الحديدية تجرها قاطرة» — المعجم الوسيط"
        - "«قاطرات منفصلة أو متصلة ببعضهما بهما عربات أو بدون عربات تم نقلها للمسار» — المعجم الموحد لمصطلحات النقل (2010)"
        - "«مجموعة من مركبات السكة الحديدية تجرها قاطرة (محدثة)» — المعجم الوسيط لمجموعة من المؤلفين"
      peripheral_observations: "المصطلح «قطار معلق» هو الأقرب دلالياً للمصطلح المطلوب، رغم وجود تداخل مع أنظمة القطارات المعلقة (Monorail) التي قد لا تكون معلقة بكابلات."
