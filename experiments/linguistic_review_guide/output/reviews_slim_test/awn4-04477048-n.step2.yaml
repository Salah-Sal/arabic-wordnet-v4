
step2_missing_lemmas:
  per_candidate:
    - headword: "الطريق الحَبْليّ"
      status: "added"
      justification: "مصطلح دقيق يصف وسيلة النقل المعلقة بكابلات (Ropeway) وهو مرادف وظيفي ممتاز."
    - headword: "خطُّ الترام"
      status: "rejected"
      justification: "يشير المصطلح إلى الترام الأرضي الذي يسير على قضبان حديدية، وليس وسيلة نقل معلقة بكابلات."
    - headword: "خط ترام كهربائي"
      status: "rejected"
      justification: "مصطلح تقني خاص بالترام الأرضي الكهربائي، ولا ينطبق على التلفريك."
    - headword: "ترام"
      status: "rejected"
      justification: "استخدامها في العربية يشير عرفاً إلى الترام الأرضي، لذا إضافتها هنا ستسبب لبساً دلالياً."
    - headword: "عَرَبة ترام"
      status: "rejected"
      justification: "تشير إلى عربة الترام الأرضي."
