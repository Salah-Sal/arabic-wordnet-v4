step1_lemma_validation:
  per_lemma:
    - lemma: "بندقية القادح"
      decision: "removed"
      decision_reason: "مصطلح عام يفتقر للدقة التقنية — القادح يشمل آليات لاحقة غير الصوانية"
      evidence_assessment:
        case: "no_material"
        notes:
          - "لا سند معجمي — المصطلح وصفي وعام"
      reasoning:
        evidence_weight: "لا سند معجمي مباشر — المصطلح وصفي"
        removal_justification: "اللمّة غامضة تقنياً؛ «القادح» مصطلح عام لا يحدد آلية «قفل الصوان»"
      actions:
        - command: "احذف ارتباط اللمّة بالمجموعة"
          params:
            lemma: "بندقية القادح"
            reason: "مصطلح وصفي عام يفتقر للدقة التقنية"

    - lemma: "بندقية صوانية"
      decision: "confirmed"
      decision_reason: "المصطلح التقني المعياري (Standard Term) — مقبول بحكم اللغوي"
      evidence_assessment:
        case: "no_material"
        notes:
          - "لا سند معجمي — مقبولة بحكم اللغوي (مصطلح تقني تخصصي)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "لا سند معجمي مباشر — القبول مبني على التوافق الدلالي التقني"
        nuance_differentiation: "يتميّز بدقة التحديد التقني لآلية «قفل الصوان»"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "بندقية صوانية"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "بندقية صوانية"
            note: "المصطلح التقني المعياري لهذا النوع من الأسلحة"

    - lemma: "المصوَّنة"
      decision: "confirmed"
      decision_reason: "مصطلح تقني دقيق مرادف للمفهوم"
      evidence_assessment:
        case: "no_material"
        notes:
          - "مرشح من الخطوة ٠٫٥ — مصطلح تقني دقيق"
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "مرشح تقني — مقبول بحكم اللغوي"
        nuance_differentiation: "يتميّز بالاختصار والتركيز على آلية الزند المصوّن"
      actions:
        - command: "أضف لمّة جديدة إلى المجموعة"
          params:
            new_lemma: "المصوَّنة"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "المصوَّنة"
            note: "مصطلح تقني دقيق يشير إلى البندقية ذات الزند المصوّن (قفل الصوان)"

  added_lemmas:
    - lemma: "المصوَّنة"
      reason: "مصطلح تقني دقيق مرادف"
      via_command: "أضف لمّة جديدة إلى المجموعة"