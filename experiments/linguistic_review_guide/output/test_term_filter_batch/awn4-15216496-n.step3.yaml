    terminological_strategy: "تم الاعتماد على التعريف الموسوعي لربط المفهوم بدلالته التاريخية (دخول القدس) والرمزية (سعف النخيل)."
    linguistic_strategy: "تم الحفاظ على التعريف الحالي لكونه تعريفاً لغوياً مباشراً ومقبولاً."

