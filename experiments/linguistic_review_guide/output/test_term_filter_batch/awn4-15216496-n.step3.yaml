  current_definition: "الأحد الذي يسبق عيد الفصح"
  assessment:
    decision: "retain"
    reason: "التعريف الحالي دقيق وموجز ويطابق الحقائق المعرفية، مع إمكانية إضافة تعريف موسوعي لإثراء المحتوى."
  
  authored_definitions:
    - type: "encyclopedic"
      text: "عيد مسيحي يوافق الأحد الأخير قبل عيد الفصح، وهو ذكرى دخول السيد المسيح إلى مدينة القدس؛ سُمي بهذا الاسم نسبةً إلى سعف النخيل الذي استُقبل به."
