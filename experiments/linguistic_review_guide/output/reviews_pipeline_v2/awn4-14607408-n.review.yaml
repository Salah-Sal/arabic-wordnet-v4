# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14607408-n — phlogiston
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «فلوجستون» بدون ياء، بينما المعاجم المعتمدة تُثبت «فلوجيستون» بالياء"
      - "اللمّة الموجودة بدون تشكيل"
      - "لا توجد لمّة عربية أصيلة بجانب المعرَّبة؛ والمورد الحديث يقترح «اللّاهوب»"
    observations: "المفهوم تاريخي علمي محدد (نظرية الفلوجيستون في الكيمياء القديمة)، لا يوجد له مقابل عربي تراثي. المعاجم المصطلحية الحديثة تستعمل التعريب «فلوجيستون» حصراً. المورد الحديث لمنير البعلبكي ابتكر «اللّاهوب» من جذر ل-ه-ب (اللهب) على وزن فاعول، وهو توليد موفق يجمع بين الاشتقاق العربي والدقة الدلالية."
  blind_candidates:
    - lemma: "لَاهُوب"
      generation_method: ishtiqaq
      justification: "من جذر ل-ه-ب (اللهب) على وزن فاعول، يدلّ على المادة المتّصلة باللهب والاشتعال، وهو وزن يُستعمل للدلالة على الفاعلية والاستمرار"
    - lemma: "حُرَاقِيَّة"
      generation_method: ishtiqaq
      justification: "من جذر ح-ر-ق (الحرق) بالمصدر الصناعي -يَّة، للدلالة على المادة المرتبطة بالاحتراق كمفهوم مجرد"
    - lemma: "مَادَّةُ الِاشْتِعَالِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف المادة التي تنطلق عند الاشتعال"
    - lemma: "فُلُوجِسْتُون"
      generation_method: taarib
      justification: "تعريب مباشر من اليونانية phlogiston (φλογιστόν = قابل للاحتراق)، وهو الشائع في المعاجم المصطلحية العربية"

stage2_evidence:
  per_lemma:
    - lemma: "فلوجستون"
      evidence_status: "no_material_found"

    - lemma: "فُلُوجِسْتُون"
      confirm:
        - text: "«فلوجيستون (مادة مفترضة في الاحتراق)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«نظرية الفلوجيستون»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"

    - lemma: "لَاهُوب"
      confirm:
        - text: "«اللّاهوب: مادة كيميائية وهميّة كان يُعْتَقَد، قبل اكتشاف الأكسجين، أنها من المُقَوِّمات الأساسية للأجسام الملتهبة.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«لَهُوب: قابل للاحتراق»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "وزن فَعُول من نفس الجذر ل-ه-ب مستعمل بمعنى القابلية للاشتعال، مما يدعم اشتقاق لاهوب من نفس الحقل الدلالي"

    - lemma: "حُرَاقِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مَادَّةُ الِاشْتِعَالِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "فلوجستون"
      decision: removed
      decision_reason: "الصيغة خاطئة؛ المعاجم المعتمدة تُثبت «فلوجيستون» بالياء. يُستبدل بالصيغة الصحيحة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فُلُوجِسْتُون"
      source: stage1
      decision: confirmed
      decision_reason: "تعريب مُثبَت في المعجم الطبي الموحد ومعجم الكيمياء الموحد، وهو الشكل المعتمد دولياً في المصطلحية العربية. صُحِّح التهجّي بإضافة الياء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح معرَّب دقيق يُستعمل في السياقات العلمية والطبية والكيميائية، وهو الشكل المعروف عالمياً"
      actions:
        - command: create_entry
          params: {lemma: "فُلُوجِسْتُون", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "لَاهُوب"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل مسكوك في المورد الحديث (2008) لمنير البعلبكي، مشتق من جذر ل-ه-ب على وزن فاعول. يحمل تعريفاً دقيقاً يطابق مفهوم الفلوجيستون تماماً. يُفضَّل إدراجه لأن مبدأ إيثار العربي ينصّ على تقديم المصطلح المشتقّ على المعرَّب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح عربي مولَّد من جذر ل-ه-ب يُستعمل في سياق الترجمة الأدبية والتعريب الاشتقاقي، بديل عن التعريب الصوتي"
      actions:
        - command: create_entry
          params: {lemma: "لَاهُوب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حُرَاقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعمال هذا اللفظ بمعنى الفلوجيستون، ولا يرد في أي معجم مصطلحي. التوليد ممكن صرفياً لكنه غير مسكوك."

    - lemma: "مَادَّةُ الِاشْتِعَالِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ وليس مصطلحاً مسكوكاً؛ يمكن استبدال «الاشتعال» بـ«الاحتراق» مع بقاء المعنى العام، مما يُخفق في اختبار السكّ. كما أن «مادة الاشتعال» قد تُفهم خطأ على أنها الوقود."

stage4_content:
  definition:
    current: "مادة افتراضية كان يعتقد سابقاً بوجودها في جميع المواد القابلة للاحتراق ويتم إطلاقها أثناء الاحتراق"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية، يفتقر إلى السياق التاريخي ويحتاج إلى إعادة صياغة بأسلوب معجمي عربي"
    authored:
      - type: terminological
        text: "مادّةٌ وهميّةٌ افترض الكيميائيّون القدماء وجودَها في كلّ جسمٍ قابلٍ للاحتراق، وأنّها تنطلق منه عند اشتعاله"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مادّةٌ افتراضيّةٌ طرحها الكيميائيّ الألمانيّ غيورغ إرنست شتال في أواخر القرن السابع عشر الميلاديّ، زاعماً أنّها تكمن في جميع الأجسام القابلة للاحتراق وتتحرّر منها عند اشتعالها، وقد دحض أنطوان لافوازييه هذه النظريّة باكتشافه دور الأكسجين في الاحتراق"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ وهميّةٌ افترض الكيميائيّون القدماء وجودَها في كلّ جسمٍ قابلٍ للاحتراق، وأنّها تنطلق منه عند اشتعاله"

  examples:
    per_lemma:
      - lemma: "فُلُوجِسْتُون"
        examples:
          - text: "سيطرت نظريّة الفُلُوجِسْتُون على الفكر الكيميائيّ في أوروبا طوال القرن الثامن عشر قبل أن يدحضها لافوازييه."
            type: usage
      - lemma: "لَاهُوب"
        examples:
          - text: "كان أنصار نظريّة اللَّاهُوب يعتقدون أنّ المعادن تفقد هذه المادّة عند تكلّسها في الهواء."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "سيطرت نظريّة الفُلُوجِسْتُون على الفكر الكيميائيّ في أوروبا طوال القرن الثامن عشر قبل أن يدحضها لافوازييه."
