# مراجعة المجموعة الترادفية awn4-13581394-n (spiral — economic)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تغير متسارع» عبارة وصفية حرّة لا مصطلح مسكوك، وتكاد تكرّر نصّ التعريف (دوران معجمي)"
      - "اللمّة «دوامة» دلالتها الأصلية فيزيائية (دوّامة الماء/الهواء)، ولم تُوثَّق في سياق اقتصادي في المعاجم المتاحة"
      - "المصطلح الاقتصادي المُثبت في المعجم الموحد هو «تضخم لولبي» (inflationary spiral)، وهو نوع خاصّ لا المفهوم العامّ"
      - "التعريف العربي الحالي سطحيّ ولا يبيّن الطابع الدوري التراكمي الذي يميّز الـ spiral عن مجرد التسارع"
    observations: "المفهوم هو العملية الاقتصادية التي يُفضي فيها كلّ تغيُّر إلى تغيُّر أشدّ في الاتجاه نفسه، فتتولّد حلقة تغذية راجعة موجبة (أسعار ← أجور ← تكاليف ← أسعار...). العربية تملك مصطلح «تضخم لولبي» للنوع التضخمي، و«حلقة مفرغة» للدوران المغلق، لكنّها تفتقر إلى مصطلح مفرد جامع لمفهوم spiral الاقتصادي العامّ."
  blind_candidates:
    - lemma: "دُوَّامَة"
      generation_method: majaz
      justification: "استعارة من الدوّامة المائية (وسط البحر الذي تدوم عليه الأمواج بسرعة وشدة)؛ تنقل صورة الحركة الدورانية المتسارعة إلى المجال الاقتصادي"
    - lemma: "لَوْلَبٌ اقْتِصَادِيّ"
      generation_method: tarkib
      justification: "مركّب إضافي وصفي: اللولب (الشكل الحلزوني) + اقتصادي؛ على غرار «تضخم لولبي» المُثبت في المعجم الموحد للاقتصاد"
    - lemma: "تَصَاعُدٌ حَلَزُونِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي يجمع بين التصاعد (من صعد: الارتفاع) والحلزونية (الدورانية)، فيعبّر عن التسارع الدوري"
    - lemma: "لَوْلَبَة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي/اسم مرّة من لولب على وزن فَوْعَلَة، يدلّ على عملية التحوّل اللولبي المتسارع"

stage2_evidence:
  per_lemma:
    - lemma: "تَغَيُّر مُتَسَارِع"
      expands:
        - text: "«التغير: انتقال الشيء من حالة لأخرى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف عامّ للتغيُّر دون تخصيص اقتصادي أو دوري"
        - text: "«التغيّر الدفعي وهو أن يتغيّر الشيء في ذاته حقيقة... والتغيّر التدريجي وهو أن يتغيّر في كيفيته مع بقاء صورته النوعية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تمييز بين التغيّر الدفعي والتدريجي، لكن لا ذكر للتسارع أو الدورية"
        - text: "«متسارع = accelerated»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "المصطلح يُستعمل صفةً في العلوم الرياضية والطبية"
      contradicts:
        - text: "لا يوجد مدخل معجمي للمركّب «تغير متسارع» بوصفه وحدة معجمية ثابتة"
          source: "قاعدة البيانات المعجمية (760,660 مدخل)"
          conflict: "المركّب عبارة وصفية حرّة لا مصطلح مسكوك"

    - lemma: "دَوَّامَة"
      confirm:
        - text: "«(الدوامة) من البحر أو النهر وسطه الذي تدوم عليه الأمواج بسرعة وبشدة وهي مستديرة وأعلاها متسع وأسفلها ضيق»"
          source: "المعجم الوسيط"
        - text: "«جريان ذو حركة دورانية مشكلاً فجوة في المركز تشفط نحوها الجسيمات»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«دوّامة؛ دُرْدُور = vortex»"
          source: "المورد الحديث (2008)"
          addition: "ترجمة إنجليزية vortex، وليس spiral"
        - text: "«حركة دورانية تحدث عند جريان سائل معيّن = eddy / vortex»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "الاستعمال محصور في السوائل والفيزياء"
        - text: "«دوامة أيكمن = Ekman spiral»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "حالة وحيدة تُرجم فيها spiral بدوامة في سياق علمي"

    - lemma: "لَوْلَبٌ اقْتِصَادِيّ"
      confirm:
        - text: "«تضخم لولبي: ارتفاع الأسعار يؤدي إلى المطالبة بزيادة الأجور التي يؤدي بدورها إلى ارتفاع التكاليف وزيادة جديدة في الأسعار..وهكذا دواليك»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
      expands:
        - text: "«اللولب: الماء الكثير يخرج مندفعاً من الصنبور أو فم قناة ضيقة فيستدير كأنه مصبّ كوز. أداة من خشب أو معدن تنتهي بشكل حلزوني»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية فيزيائية، لكن النسبة اللولبية مُثبتة في المصطلح الاقتصادي"
        - text: "«لولبيّ = spiral»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "الصفة اللولبية مُثبتة في معاجم متعددة كمقابل لـ spiral"

    - lemma: "تَصَاعُدٌ حَلَزُونِيّ"
      expands:
        - text: "«تصاعد = updraught / convection»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
          addition: "تصاعد يعني الصعود لا الدوران"
        - text: "«حلزونيّ: ملتفّ حول محور في سلسلة من المستويات المتغيّرة باستمرار، لولبيّ الشكل»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "الصفة حلزوني مؤكدة"
      contradicts:
        - text: "لا يوجد مدخل معجمي للمركّب «تصاعد حلزوني» بوصفه وحدة"
          source: "قاعدة البيانات المعجمية"
          conflict: "مركّب غير مسكوك"

    - lemma: "لَوْلَبَة"
      evidence_status: "no_material_found"

    - lemma: "دُوَّامَة"
      confirm:
        - text: "«(الدوامة) من البحر أو النهر وسطه الذي تدوم عليه الأمواج بسرعة وبشدة»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَغَيُّرٌ مُتَسَارِعٌ"
      decision: confirmed
      decision_reason: "رغم أنّه عبارة وصفية أقرب إلى الشرح منها إلى المصطلح، فإنّه مُثبت في الشبكة ويصف المفهوم بوضوح. يُبقى مع تصحيح التشكيل وتسجيل التحفّظ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركّز على البُعد الخطّي التصاعدي للتغيُّر (التسارع)، دون إبراز الطابع الدوري أو التغذية الراجعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَغَيُّرٌ مُتَسَارِعٌ"

    - lemma: "دَوَّامَة"
      decision: confirmed
      decision_reason: "استعارة حيّة من الحقل الفيزيائي (الدوّامة المائية) إلى الاقتصاد، تنقل صورة الحركة الدورانية المتسارعة التي تشفط نحو مركزها. الدلالة الاستعارية شائعة في الاستعمال الإعلامي والاقتصادي المعاصر (دوّامة التضخم، دوّامة الديون)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الطابع الدوري والانجذابي للعملية (كالدوّامة التي تشفط نحو مركزها)، بخلاف «تغيُّر متسارع» الذي يصف مسارًا خطيًّا"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَوَّامَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لَوْلَبٌ اقْتِصَادِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركّب غير مسكوك؛ لا يوجد كوحدة معجمية في أيّ معجم. المصطلح المُثبت هو «تضخم لولبي» وهو نوع خاصّ (تضخمي) لا المفهوم العامّ. لا يجتاز اختبار التثبيت المعجمي."

    - lemma: "تَصَاعُدٌ حَلَزُونِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركّب غير مسكوك؛ «تصاعد» يدلّ على الارتفاع لا على الدورانية. الجمع بين المكوّنين لا يشكّل وحدة اصطلاحية ثابتة."

    - lemma: "لَوْلَبَة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي؛ والوزن فَوْعَلَة يدلّ على فعل اللولبة (تحويل شيء إلى شكل لولبي)، لا على العملية الاقتصادية المجردة."

    - lemma: "دُوَّامَة"
      source: stage1
      decision: removed
      decision_reason: "مكرّرة مع اللمّة الموجودة «دوامة» — نفس الكلمة بتشكيل مطابق."

