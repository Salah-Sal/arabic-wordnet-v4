# ── المرحلة ١: التوليد الأعمى والتقييم الأولي ─────────────────
# قُرئ الملف المُقنَّع أولاً (بدون لمّات) → توليد ٤ مرشحات عمياء،
# ثم قُرئ الملف الكامل → تقييم أولي.
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان كلتاهما تعبيران تركيبيان إضافيان (MWE) يفتقران إلى التثبيت المعجمي في المعاجم كوحدة اصطلاحية ثابتة."
      - "«طَالِب الْمَشُورَة» يحمل دلالة الفاعلية والمبادرة (الطَّلَب)، في حين أن advisee قد يكون متلقِّياً سلبياً لا يبادر بطلب النصيحة بالضرورة — وهو انزياح دلالي يُضعف الدقة."
      - "غياب لمّة مفردة مشتقة مباشرة من الجذر نصح (كمَنْصُوح أو مُسْتَنْصِح)، وهي الأنسب صرفياً لتكون نواة المجموعة."
      - "التعريف العربي «شخص يتلقى النصيحة» سليم لكنه مُبسَّط ويخلو من الفصل النوعي."
    observations: >
      المجموعة تُغطّي مفهوم متلقّي النصيحة (advisee). المفهوم ذو جذر راسخ في الثقافة
      العربية والإسلامية (النصيحة ركن أخلاقي أصيل)، غير أن العربية تفتقر إلى مصطلح
      مفرد شائع راسخ يقابل advisee بدقة. اللمّتان الحاليتان وصفيتان لا اصطلاحيتان:
      الأولى (طالب المشورة) تنزلق نحو معنى الساعي للنصيحة بفاعلية، والثانية (متلقي
      النصيحة) أدق لكنها عبارة حرة. يوصى بضم مَنْصُوح ومُسْتَنْصِح اللتين تؤيدهما
      المعاجم الحديثة.

  blind_candidates:
    - lemma: "مَنْصُوح"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من نَصَحَ على وزن مَفْعُول القياسي — الشخص الذي نُصِحَ ووُجِّهَ
        إلى ما فيه صلاحه. مباشر ودقيق في الدلالة على متلقّي النصيحة، ويطّرد قياساً
        مع ناصح (الفاعل) / منصوح (المفعول). لا دوران ولا اشتراك مع التعريف.

    - lemma: "مُسْتَرْشِد"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من استرشدَ على وزن مُسْتَفْعِل — الشخص الذي يطلب الرشد والتوجيه.
        يقترب دلالياً من advisee في سياق الإرشاد والتوجيه المنظَّم.

    - lemma: "آخِذُ النَّصِيحَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي: آخِذ (اسم فاعل من أخذ) + النصيحة. يُفيد من يستقبل النصيحة
        ويأخذها. أكثر دلالةً على الاستقبال الإيجابي مقارنةً بلمّة طالب المشورة.

    - lemma: "مُوصَى"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من أوصى على وزن مُفْعَل — الشخص الموجَّه والمُوصَى إليه برأي
        أو توجيه من آخر. يُعبِّر عن تلقّي الإرشاد دون مبادرة من الشخص ذاته.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة (٥ استعلامات):
#   Q1 — دفعي: طالب المشورة, متلقي النصيحة, منصوح, مسترشد,
#              اخذ النصيحة, موصي, مستنصح (+ صيغ ال-)
#   Q2 — جسر إنجليزي: advisee, counselee, advice receiver, counselled
#   Q3 — إثراء بالمعرّف: entry_ids {562049, 562051, 669106, 680590}
#   Q4 — FTS كلمات مفتاحية: نصيحة، مشورة، يتلقى، نصح
#   Q5 — مقاييس اللغة: جذور نصح، لقي، شور (dictionary_id=151)
stage2_evidence:
  per_lemma:

    - lemma: "طَالِب الْمَشُورَة"
      evidence_status: "no_material_found"

    - lemma: "مُتَلَقِّي النَّصِيحَة"
      evidence_status: "no_material_found"

    - lemma: "مَنْصُوح"
      confirm:
        - text: "«المنصوح؛ المُرْشَد (تر).» [translation_en: advisee]"
          source: "المورد الحديث (2008) — Al-Mawrid Al-Hadeeth"
        - text: "«نَصَحَ فلاناً, وله: أرشده إلى ما فيه صلاحه (فهو ناصِح، وهى ناصِحَة... والمفعول منصوح)»"
          source: "المعجم الوسيط"
        - text: "«نصَح ولدَه/ نصَح لولدِه: أرشده إلى ما فيه نفعُه وصلاحُه... والمفعول منصوح (للمتعدِّي)»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«وَقَمِيصٌ مَنْصُوحٌ: مَخِيطٌ» — النُّونُ وَالصَّادُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى مُلَاءَمَةٍ بَيْنَ شَيْئَيْنِ وَإِصْلَاحٍ لَهُمَا"
          source: "مقاييس اللغة لابن فارس (مادة نصح)"
          addition: "الأصل المعجمي يُفيد الملاءمة والإصلاح بين شيئين؛ والمنصوح من وقع عليه النصح (الإرشاد إلى ما فيه الصلاح). المعنى النسيجي (مخيط) مهجور في الاستعمال الحديث."

    - lemma: "مُسْتَرْشِد"
      contradicts:
        - text: "«المُسْتَرْشِد بالله: لقب الخليفة العباسى الفضل بن أحمد بن المقتدى، أبو منصور (529هـ = 1135م)، بويع بالخلافة بعد وفاة أبيه وكان عالي الهِمَّة، شجاعًا، فصيحًا»"
          source: "المعجم الكبير"
          conflict: "المدخل الوحيد في قاعدة البيانات لمسترشد هو اسم عَلَم (لقب خليفة عباسي) لا اسم نكرة بمعنى طالب الإرشاد."

    - lemma: "آخِذُ النَّصِيحَة"
      evidence_status: "no_material_found"

    - lemma: "مُوصَى"
      evidence_status: "no_material_found"

    - lemma: "مُسْتَنْصِح"
      confirm:
        - text: "«مُسْتَنْصِح» [translation_en: counselee, domain: The Unified Medical Dictionary]"
          source: "المعجم الطبي الموحد (2009) — entry_id: 562049"
        - text: "«استنصحَ والدَه: 1 - استشاره، طلب منه النَّصيحةَ «شابٌّ مستنصِح». 2 - عدّه ناصحًا له. فهو مُستنصِح، والمفعول مُستنصَح»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«مُسْتَنْصَح — counseller» [translation_en: counseller]"
          source: "المعجم الطبي الموحد (2009) — entry_id: 562051"
          addition: "الصيغة باسم المفعول (مُسْتَنْصَح) تعني الناصح/المستشار، أما اسم الفاعل (مُسْتَنْصِح) فهو المتلقّي = counselee. التمييز الصرفي دقيق وحاسم."
        - text: "«انتصح الشَّابُّ: قبل النصيحةَ «تلميذ منتصِح». انتصح صديقَه: اتَّخذه ناصحًا ومرشدًا إلى ما فيه النفع والصّلاح»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "مُنْتَصِح (اسم فاعل من انتصح) بديل فصيح بمعنى من يقبل النصيحة بإيجاب — يُمكن النظر فيه مستقبلاً."


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ─────────────────────────────────────────
    - lemma: "طَالِب الْمَشُورَة"
      decision: removed
      decision_reason: >
        ثلاثة أسباب للحذف:
        (١) انزياح دلالي: «طالب» اسم فاعل يحمل معنى المبادرة النشطة، في حين أن
        advisee هو مَن تُقدَّم إليه النصيحة وقد لا يكون الطالب لها.
        (٢) فشل اختبار التثبيت: يمكن إبدال «طالب» بـ«ملتمس» أو «راغب» ويبقى
        الوصف صالحاً — دليل على أنه عبارة حرة لا وحدة اصطلاحية.
        (٣) لا أدلة معجمية للمركب. المورد الحديث يترجم advisee بـ«المنصوح؛ المُرْشَد»
        لا بـ«طالب المشورة».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة ٢ ─────────────────────────────────────────
    - lemma: "مُتَلَقِّي النَّصِيحَة"
      decision: confirmed
      decision_reason: >
        اللمّة دقيقة دلالياً: «تَلَقَّى» يُفيد الاستقبال والأخذ دون اشتراط المبادرة،
        مما يعكس المعنى الكامل لـadvisee بصورة أفضل من «طالب». وإن لم يكن المركّب
        وحدةً معجميةً كلاسيكية مُسجَّلة، فهو مركّب إضافي شفاف تستوعبه المعجمية
        الحديثة. يُبقى بوصفه الصياغة الوصفية الأدق في سياق الاستقبال، مع ضمّ لمّات
        مفردة مشتقة. التشكيل الكامل صحيح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُبرز الطابع الاستقبالي السلبي للفعل — يُستخدم حين يُراد التأكيد على فعل التلقّي ذاته دون اشتراط مبادرة من الشخص."

    # ── مرشح المرحلة ١ — أ ────────────────────────────────────
    - lemma: "مَنْصُوح"
      source: stage1
      decision: confirmed
      decision_reason: >
        أدلة قاطعة: المورد الحديث (2008) يضعه صراحةً مقابل advisee، والمعجم الوسيط
        ومعجم المعاصر يُثبتانه اسم مفعول من نَصَحَ. الاشتقاق سليم على وزن مَفْعُول
        القياسي. يجتاز اختبار الصكّ: لا يمكن تعويضه بمرادف مع الإبقاء على الدلالة
        الاصطلاحية. لا لهجية. مفرد يُيسّر التداول. يختلف عن مُسْتَنْصِح في أنه
        لا يُضمّن المبادرة بطلب النصيحة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "وزن مَفْعُول يُفيد وقوع النصح على صاحبه — يُناسب السياق الأدبي والرسمي، ويشمل من وقعت عليه النصيحة سواء طلبها أم لا."
      actions:
        - command: create_entry
          params:
            lemma: "مَنْصُوح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — ب ────────────────────────────────────
    - lemma: "مُسْتَرْشِد"
      source: stage1
      decision: removed
      decision_reason: >
        قاعدة البيانات لا تُوثّق مُسْتَرْشِد بمعنى «متلقّي النصيحة» كاسم نكرة؛
        المدخل الوحيد هو الاسم العَلَم (الخليفة العباسي). فضلاً عن ذلك، استرشدَ
        يعني طلب الرشد والهداية (أعمّ من النصيحة)، مما يُبعده عن الدلالة الدقيقة
        لـadvisee. المعجم الطبي يُؤثر مُسْتَنْصِح على مُسْتَرْشِد.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ — ج ────────────────────────────────────
    - lemma: "آخِذُ النَّصِيحَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية للمركب. يفشل اختبار التثبيت: يمكن إبدال «آخذ» بـ«قابل» أو
        «مُتَلَقِّي» وتبقى العبارة وصفاً صالحاً. يتراكب مع مُتَلَقِّي النَّصِيحَة الأدق
        صياغةً ولا يضيف فارقاً دلالياً مُستقلاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١ — د ────────────────────────────────────
    - lemma: "مُوصَى"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية لهذا الاستخدام في سياق المجموعة. «مُوصَى» في المعجمية العربية
        مرتبط أساساً بالوصية (الإرث والعهد)، لا بالنصيحة المجردة — انزياح دلالي
        نحو سياق أضيق وأخص. لا تأييد من المعاجم على المعنى المراد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── اكتشاف المرحلة ٢ — مدخل قائم في قاعدة البيانات ─────────
    - lemma: "مُسْتَنْصِح"
      decision: confirmed
      decision_reason: >
        اكتُشف في استعلام قاعدة البيانات (entry_id: 562049). المعجم الطبي الموحد (2009)
        يُثبته صراحةً مقابل counselee. معجم المعاصر يُعرّف مُسْتَنْصِح بأنه اسم فاعل
        من استنصح = طلب النصيحة الصادقة. الاشتقاق سليم على وزن مُسْتَفْعِل (Form X
        من نصح). الفارق الدقيق عن مَنْصُوح: المُسْتَنْصِح يُضمّن مبادرة نشطة في طلب
        النصيحة. المدخل قائم في قاعدة البيانات فلا يحتاج create_entry، بل add_sense.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اسم فاعل من استنصح (Form X) يُضمّن السعي النشط لاستخلاص النصيحة الصادقة — يُناسب السياق الطبي والتوجيهي الأكاديمي المنظَّم."
      actions:
        - command: add_sense
          params:
            entry_id: "562049"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
# اللمّات المؤكدة: مُتَلَقِّي النَّصِيحَة، مَنْصُوح، مُسْتَنْصِح
stage4_content:
  definition:
    current: "شخص يتلقى النصيحة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي سليم لكنه قاصر: (أ) يخلو من الفصل النوعي الكافي الذي يُميّز
        متلقّي النصيحة عن غيره كالمستشار أو المُرشِد. (ب) لا يُشير إلى أن النصيحة
        تصدر من شخص آخر. (ج) يُعيد صياغة اللمّة مُتَلَقِّي النَّصِيحَة الموجودة
        فيتعرّض للدوران الجزئي.
    authored:
      - type: terminological
        text: "شَخْصٌ يَتَلَقَّى النَّصِيحَةَ أَوِ التَّوْجِيهَ مِن غَيْرِهِ، سَوَاءٌ أَكانَ ذَلِكَ بِطَلَبِهِ أَمْ بِمُبادَرَةٍ مِنَ النَّاصِح."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَنْ نَصَحَهُ غَيْرُهُ وَأَرْشَدَهُ إِلَى مَا فِيهِ صَلَاحُهُ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَتَلَقَّى النَّصِيحَةَ أَوِ التَّوْجِيهَ مِن غَيْرِهِ، سَوَاءٌ أَكانَ ذَلِكَ بِطَلَبِهِ أَمْ بِمُبادَرَةٍ مِنَ النَّاصِح."
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "مَنْ نَصَحَهُ غَيْرُهُ وَأَرْشَدَهُ إِلَى مَا فِيهِ صَلَاحُهُ."

  examples:
    per_lemma:
      - lemma: "مُتَلَقِّي النَّصِيحَة"
        examples:
          - text: "اسْتَمَعَ مُتَلَقِّي النَّصِيحَةِ بِإِمْعَانٍ إِلَى تَوْجِيهَاتِ مُرْشِدِهِ وَأَخَذَ بِزِمَامِ التَّغْيِيرِ."
            type: usage

      - lemma: "مَنْصُوح"
        examples:
          - text: "الْمَنْصُوحُ الَّذِي يَتَقَبَّلُ الرَّأْيَ الصَّائِبَ وَيَعْمَلُ بِهِ خَيْرٌ مِمَّن يَرُدُّ النُّصْحَ اسْتِكْبَاراً."
            type: usage

      - lemma: "مُسْتَنْصِح"
        examples:
          - text: "لَجَأَ الْمُسْتَنْصِحُ إِلَى ذَوِي الْخِبْرَةِ يَطْلُبُ رَأيَهُمْ فِيمَا أَشْكَلَ عَلَيْهِ مِنْ أُمُورِ حَيَاتِهِ."
            type: usage

    actions:
      - command: add_sense_example
