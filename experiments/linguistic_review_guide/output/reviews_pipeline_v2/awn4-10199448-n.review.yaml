# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-10199448-n — hoister / مشغل رافعة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مشغل رافعة» بدون تشكيل"
      - "التعريف العربي «مشغل لآلة الرفع» يكاد يكون دوراناً لفظياً — يستعمل مشغل لتعريف مشغل رافعة"
      - "المجموعة تحتوي لمّة واحدة فقط، ممّا يُضعف التغطية المعجمية"
    observations: "المفهوم يدل على شخص يُشغِّل آلة رفع (رافعة أو ونش). في الاستعمال العربي الفني، يُعبَّر عنه عادةً بتركيب إضافي (مُشَغِّلُ رَافِعَة أو عَامِلُ الرَّافِعَة). لم يُسَكّ لهذه المهنة مصطلح مفرد ثابت في المعاجم العربية الكلاسيكية أو الحديثة."
  blind_candidates:
    - lemma: "رَفَّاع"
      generation_method: ishtiqaq
      justification: "على وزن فَعَّال الدال على الحِرفة والمبالغة في الفعل، من الجذر ر-ف-ع. يُفيد معنى مَن يرفع الأشياء حِرفةً، كحدَّاد وبنَّاء ونجَّار."
    - lemma: "عَامِلُ الرَّافِعَة"
      generation_method: tarkib
      justification: "تركيب إضافي من عامل + الرافعة، يصف الشخص الذي يعمل على الرافعة. مستعمل في لغة المهن والصناعة."
    - lemma: "مُشَغِّلُ الرَّافِعَة"
      generation_method: tarkib
      justification: "تركيب إضافي من مُشَغِّل (اسم فاعل من شَغَّلَ) + الرافعة. صيغة تقنية دقيقة تُميّز بين مُشَغِّل الرافعة وعاملها."
    - lemma: "وِنْشِيّ"
      generation_method: taarib
      justification: "نسبة إلى الوِنش (المعرَّب من الإنجليزية winch)، على وزن فِعْلِيّ. يدل على المتخصص في تشغيل الونش. مستعمل في اللهجات المهنية."


stage2_evidence:
  per_lemma:
    - lemma: "مُشَغِّلُ رَافِعَة"
      confirm:
        - text: "«(الرافعة) كل جماعة مبلغة تبلغ وتذيع الأخبار والأسرار وآلة يرفع بها الشيء (مج)(ج) روافع»"
          source: "المعجم الوسيط"
        - text: "«رافعة — hoist — المعجم الموحد لمصطلحات الفن والتسلية والرياضة»"
          source: "ArabTerm"
        - text: "«(1) يرفع [علمًا أو شراعًا] (2) يرتفع (3) رَفْعٌ (4) الرّافعة: آلة رافعة»"
          source: "المورد الحديث (2008) — ترجمة hoist"
      expands:
        - text: "«المِرفاع؛ الرافعة؛ الوِنش — crane»"
          source: "المورد الحديث (2008)"
          addition: "المرفاع والونش مرادفان للرافعة في السياق التقني"
        - text: "«مرفاع — رافعة تقليدية حيث تتم عملية الحمل عن طريق سلك مروراً بذراع الرافعة»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "المرفاع صيغة مِفعال من رفع تدل على الآلة"

    - lemma: "رَفَّاع"
      confirm:
        - text: "«رَفَّاع — من (ر ف ع) معلي الشيء ومطوّله، والمكرم غيره»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«رَفَّاع — من (ر ف ع) معلي الشيء ومطوّله، والمكرم غيره»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المدخل من معجم أسماء لا من معجم لغوي عام، ويصف صفة عامة لا مهنة محددة"

    - lemma: "عَامِلُ الرَّافِعَة"
      expands:
        - text: "«عامل برج الحفر — derrick man»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "نمط تركيبي مُنتج (عامل + آلة) مستعمل في المصطلحات التقنية"

    - lemma: "مُشَغِّلُ الرَّافِعَة"
      confirm:
        - text: "«(الرافعة) آلة يُرفَع بها الشيءُ. (مج)»"
          source: "المعجم الوسيط"
      expands:
        - text: "«رافعة مَشْغَل — workshop crane»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "المَشْغَل هنا بمعنى الورشة لا المُشَغِّل، مما يؤكد ضرورة التشكيل للتمييز"

    - lemma: "وِنْشِيّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "مُشَغِّلُ رَافِعَة"
      decision: confirmed
      decision_reason: "تركيب إضافي واضح الدلالة ومطابق للنمط التقني العربي (مُشَغِّل + اسم الآلة). يحتاج تصحيح التشكيل من «مشغل رافعة» إلى «مُشَغِّلُ رَافِعَة». الرافعة مصطلح ثابت في المعاجم الموحدة كمقابل لـ hoist و crane."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُشَغِّلُ رَافِعَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "رَفَّاع"
      source: stage1
      decision: removed
      decision_reason: "وزن فَعَّال منتج نظرياً لكن لم يُسجَّل رَفَّاع بمعنى مُشَغِّل الرافعة في أي معجم لغوي. الشاهد الوحيد من معجم أسماء لا من معجم لغوي عام. بالإضافة إلى أن رَفَّاع يوحي بمن يرفع الأشياء بيده لا بمن يُشَغِّل آلة رفع."
      evidence_assessment:
        case: mixed

    - lemma: "عَامِلُ الرَّافِعَة"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب إضافي منتج ومقبول على نمط عامل + آلة (قياساً على عامل برج الحفر المسجّل في معجم النفط). أعمّ من مُشَغِّل رافعة لأن العامل قد يشمل مهام الصيانة والمراقبة لا التشغيل فحسب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "عامل الرافعة أعمّ من مُشَغِّل الرافعة — يشمل كل من يعمل على الرافعة بما فيه الصيانة، بينما المُشَغِّل مقصور على من يُديرها"
      actions:
        - command: create_entry
          params: {lemma: "عَامِلُ الرَّافِعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10199448-n"}

    - lemma: "مُشَغِّلُ الرَّافِعَة"
      source: stage1
      decision: removed
      decision_reason: "مطابق دلالياً للّمة الموجودة «مُشَغِّلُ رَافِعَة» مع اختلاف شكلي طفيف (إضافة ال التعريف). الفرق بين الصيغتين نحوي لا دلالي، والتنكير أولى في المداخل المعجمية."
      evidence_assessment:
        case: confirm_only

    - lemma: "وِنْشِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي عليها. نسبة إلى لفظ أعجمي معرَّب (ونش) بإلحاق ياء النسبة. الكلمة دارجة في بعض اللهجات العامية المصرية لكنها لم تُسجَّل في المعاجم الفصيحة ولا في المعاجم الموحدة."
      evidence_assessment:
        case: no_material


