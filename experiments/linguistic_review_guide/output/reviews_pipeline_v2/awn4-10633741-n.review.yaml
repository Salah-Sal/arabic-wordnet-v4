# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10633741-n
# smasher — شخص يهشم شيئاً ما
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم الفعل «يهشم» وهو من جذر إحدى اللمّات (مُهَشِّم)، مما يُحدث دوراناً معجمياً"
      - "التعريف مبهم بعبارة «شيئاً ما» دون تحديد طبيعة المهشوم"
      - "اللمّتان الموجودتان (مُحَطِّم، مُهَشِّم) كلتاهما اسم فاعل من فَعَّلَ على وزن مُفَعِّل، فلا تنوُّع صرفي"
    observations: >
      المفهوم بسيط ومباشر: شخص يقوم بكسر الأشياء وتحطيمها. اللمّتان الموجودتان
      مُحَطِّم ومُهَشِّم كلتاهما اسم فاعل من الثلاثي المزيد (فَعَّلَ)، وهما مترادفتان
      تقريبياً مع فرق دلالي دقيق: الهَشْم يختص بكسر الشيء الأجوف أو اليابس،
      والحَطْم أعمّ ويشمل كسر أي شيء. المفهوم أصيل في العربية وله ألفاظ كثيرة.
  blind_candidates:
    - lemma: "مُحَطِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من حَطَّمَ على وزن مُفَعِّل، والتحطيم يدل على الكسر الشديد الشامل، مرادف للتهشيم"
    - lemma: "هَشَّام"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من هَشَمَ على وزن فَعَّال، تدل على من يُكثر الهَشْم والكسر"
    - lemma: "كَسَّار"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من كَسَرَ على وزن فَعَّال، تدل على من شأنه كسر الأشياء بكثرة"
    - lemma: "دَقَّاق"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من دَقَّ على وزن فَعَّال، يدل على من يَدُقّ الأشياء ويُفتّتها بقوة"

stage2_evidence:
  per_lemma:
    - lemma: "مُحَطِّم"
      confirm:
        - text: "«مُحطِّم [مفرد]: اسم فاعل من حطَّمَ. محطِّم الرَّقم القياسيّ: الذي يحقِّق رقمًا يتفوَّق فيه على منافسيه في رياضةٍ ما. محطِّم الذَّرَّات: مسرّع ذرِّيّ يزيد من سرعة الجزيئات المشحونة إلى درجة عالية من الطَّاقة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«مُحَطِّم الذرّة = atom smasher»"
          source: "المورد الحديث (2008)"
        - text: "«حطَّمَ يحطِّم، تحطيمًا، فهو محطِّم، والمفعول محطَّم. حطَّم زجاجَ النَّافذة: كسَّره ودمَّره»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«المِحْطَمُ: الشَّديدُ الحطم، اسمٌ للأسدِ، صِفَةٌ غَالِبَةٌ»"
          source: "المعجم الكبير"
          addition: "وزن مِفْعَل من نفس الجذر يُستعمل للدلالة على الشدة في الحطم، مما يؤكد ثراء الجذر الاشتقاقي"

    - lemma: "مُهَشِّم"
      confirm:
        - text: "«هشَّمَ يهشِّم، تهشيمًا، فهو مُهشِّم، والمفعول مُهشَّم. هشَّم الزُّجاجَ ونحوَه: هشَمه، كسَّره وهدَّمه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«مُهشِّم: منخل دائري له قواطع تطحن المواد الصلبة الكبيرة في المجاري وتحولها إلى جسيمات أصغر، مُفتِّت قاذورات»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«هَشَّمَ الشيءَ الأجوفَ أو اليابس: مبالغة في هَشَم»"
          source: "المعجم الوسيط"
          addition: "التهشيم مبالغة في الهشم، ويختص بالأشياء الجوفاء أو اليابسة"
        - text: "«الهَشْمُ: كسر الشيء الرّخو كالنّبات»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "يضيف تقييداً بالأشياء الرخوة"

    - lemma: "هَشَّام"
      contradicts:
        - text: "«الْهَشَامُ: الجودُ»"
          source: "المعجم الوسيط"
          conflict: "هِشَام/الهِشَام مسجّل في المعاجم بمعنى الجود والكرم، لا بمعنى كثرة الهشم، فيقع اشتراك لفظي مُربِك"
        - text: "«هِشَام: من (ه ش ش) الجود»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "العَلَم هِشَام منسوب إلى الجود لا إلى الكسر، مما يُبعد صيغة فَعَّال عن دلالة التهشيم"

    - lemma: "كَسَّار"
      confirm:
        - text: "«كَسَّار: من (ك س ر) المكثر من تهشيم الأشياء وتحطيمها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«الكُسَارُ: ما تكسَّر من الشىء: مثل كُسار الزجاج، وكسار العُود والخبز»"
          source: "المعجم الوسيط"
          conflict: "كُسَار (بضم الكاف) اسم لما تكسّر من الشيء لا لفاعل الكسر، وكَسَّار (بفتح وتشديد) ورد في سياق أسماء الأعلام فقط"

    - lemma: "دَقَّاق"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُحَطِّم"
      decision: confirmed
      decision_reason: >
        اسم فاعل قياسي من حَطَّمَ، مُثبَت في معجم اللغة العربية المعاصرة كاسم فاعل
        مستقل بمعنى من يُحطّم، ومُستعمل في التراكيب الاصطلاحية (مُحطِّم الذرّات، مُحطِّم
        الأرقام القياسية). الأدلة المعجمية تؤكد الاستعمال بلا تعارض.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على التحطيم الشامل والتدمير الكامل للشيء سواء أكان أجوف أم صلباً،
        وهو أعمّ دلالةً من مُهَشِّم. يُستعمل في سياقات مجازية (تحطيم الأرقام، تحطيم القيود).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَطِّم"

    - lemma: "مُهَشِّم"
      decision: confirmed
      decision_reason: >
        اسم فاعل قياسي من هَشَّمَ، مُثبَت في معجم اللغة العربية المعاصرة ومُستعمل
        مصطلحاً تقنياً في الهندسة المدنية (comminutor). الجذر «هشم» أصيل في العربية
        بمعنى كسر الشيء الأجوف أو اليابس.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختصّ بكسر الأشياء الجوفاء أو اليابسة أو الرخوة، وأصل الهشم أخصّ من الحطم.
        يُستعمل في السياق التقني (المُهشِّم = جهاز تفتيت في الهندسة المدنية).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُهَشِّم"

    - lemma: "هَشَّام"
      source: stage1
      decision: removed
      decision_reason: >
        هِشَام/الهِشَام مسجّل في المعاجم العربية (الوسيط وغيره) بمعنى «الجُود»
        لا بمعنى كثرة الهشم. صيغة فَعَّال من هَشَمَ بمعنى الكاسر غير مسجّلة
        معجمياً، واستعمالها يُحدث اشتراكاً لفظياً مع العَلَم المشهور هِشَام.

    - lemma: "كَسَّار"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد كَسَّار بمعنى فاعل الكسر إلا في موسوعة أسماء الأعلام (سياق اشتقاق
        الأسماء لا الاستعمال المعجمي الحي). وكُسَار في المعجم الوسيط يعني «ما تكسَّر
        من الشيء» (اسم لا وصف). المصطلح غير مُثبَّت في المعاجم اللغوية بوصفه صفة فاعل.

    - lemma: "دَقَّاق"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استعمال دَقَّاق بمعنى من يَدُقّ الأشياء ويُحطّمها.
        الدَّقَّاق في المعاجم يعني بائع الدقيق أو طاحنه، وهو بعيد عن دلالة التهشيم والتحطيم.

