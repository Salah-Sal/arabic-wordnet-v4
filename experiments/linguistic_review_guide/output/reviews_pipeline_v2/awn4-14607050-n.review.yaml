# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14607050-n
# philosopher's stone / elixir
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لفظة «الإكسير» معرّفة بأل التعريف في اللمّة، والأصل أن تكون اللمّة نكرة (إِكْسِير) ما لم يكن لام التعريف جزءاً من الوحدة المعجمية"
      - "التعريف العربي الحالي يصف المادة بأنها «افتراضية» وهي ترجمة حرفية لـ hypothetical، والأدق في العربية: «خيالية» أو «موهومة» أو «مزعومة»"
      - "التعريف يذكر «المعادن الخسيسة» وهو تعبير مقبول لكن يمكن توضيحه بـ«المعادن الرخيصة» كما في المعاجم العربية"
    observations: >
      المجموعة تضم لمّتين: «الإكسير» و«حجر الفلاسفة»، وكلتاهما مصطلحان
      ثابتان في التراث الكيميائي العربي القديم (الخيمياء/السيمياء). الإكسير
      كلمة معرّبة راسخة في العربية منذ القرون الوسطى، وحجر الفلاسفة مركب
      إضافي ثابت. المفهوم له حضور عميق في التراث العربي الإسلامي عبر أعمال
      جابر بن حيان والرازي وغيرهما. الترادف بين اللمّتين ليس مطلقاً: الإكسير
      يشمل أيضاً معنى «إكسير الحياة» (شراب يطيل العمر)، بينما حجر الفلاسفة
      أخص بمعنى تحويل المعادن.
  blind_candidates:
    - lemma: "إِكْسِير"
      generation_method: taarib
      justification: >
        لفظ معرّب راسخ في العربية من العصور الوسطى، يُطلق على المادة التي
        زعم الخيميائيون أنها تحوّل المعادن الرخيصة إلى ذهب. مسجّل في المعاجم
        العربية الحديثة والقديمة.
    - lemma: "حَجَرُ الفَلاسِفَةِ"
      generation_method: tarkib
      justification: >
        مركب إضافي ثابت يقابل المصطلح الإنجليزي philosopher's stone، مسجّل
        في المعاجم الاصطلاحية الكيميائية العربية. وحدة معجمية ثابتة لا يمكن
        استبدال أحد مكوّناتها بمرادف.
    - lemma: "الكِبْرِيتُ الأَحْمَرُ"
      generation_method: majaz
      justification: >
        تعبير مجازي عربي قديم يُطلق على ما يندر وجوده ويعزّ نيله، استُعمل في
        سياق الكيمياء القديمة للإشارة إلى المادة النادرة القادرة على التحويل.
        لكنه أقرب إلى المجاز الأدبي منه إلى المصطلح الكيميائي الدقيق.
    - lemma: "حَجَرُ الحُكَمَاءِ"
      generation_method: tarkib
      justification: >
        صيغة بديلة لـ«حجر الفلاسفة» تستعمل لفظ «الحكماء» بدل «الفلاسفة»،
        إذ كان الكيميائيون القدماء يُسمَّون «الحكماء» في بعض المصادر العربية.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "الإِكْسِير"
      confirm:
        - text: "«مادة مركبة, كان الأقدمون يزعمون أنها تحول المعدن الرخيص إلى ذهب»"
          source: "المعجم الوسيط"
        - text: "«(الإكسير) مَادَّة مركبة كَانَ الأقدمون يَزْعمُونَ أَنَّهَا تحول الْمَعْدن الرخيص إِلَى ذهب وشراب فِي زعمهم يُطِيل الْحَيَاة»"
          source: "المعجم الوسيط (حولي)"
        - text: "«مادة مركبة كان الأقدمون يزعمون أنها تُحوِّل المعدن الرخيص إلى ذهب»"
          source: "المعجم الكبير"
        - text: "«مادَّة مركَّبة كان الأقدمون يعتقدون أنّها تحوِّل المعدن الرخيص إلى ذهب»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«شراب في زعمهم يطيل الحياة»"
          source: "المعجم الوسيط"
          addition: "الدلالة الثانية للإكسير: شراب الحياة الخالدة"
        - text: "«مستحضر صيدلاني يطيب نكهة المركبات الدوائية»"
          source: "المعجم الكبير"
          addition: "دلالة صيدلانية حديثة لا علاقة لها بالخيمياء"
        - text: "«شكل صيدلانيّ يتكون من محلول مادة دوائية أوأكثر في سواغ يحتوي شراب السكروز أو السوربيتول مع مستخلصات كحولية»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          addition: "المعنى الصيدلاني المعاصر المتخصص"
        - text: "«مسحوق مُجفِّف يوضع فوق الجروح»"
          source: "المعجم الكبير"
          addition: "دلالة طبية قديمة أخرى"

    - lemma: "حَجَرُ الفَلاسِفَةِ"
      confirm:
        - text: "«حجر الفلاسفة» (مقابل philosopher's stone)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«حجر الفلاسفة: حجر [أو مادة أو مستحضر كيميائي] خيالي اعتقد أصحاب الكيمياء القديمة أنّه قادرٌ على تحويل المعادن الخسيسة إلى ذهب أو فضة وعلى إطالة الحياة»"
          source: "المورد الحديث (2008)"

    - lemma: "الكِبْرِيتُ الأَحْمَرُ"
      evidence_status: "no_material_found"

    - lemma: "حَجَرُ الحُكَمَاءِ"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١: الإكسير ──
    - lemma: "الإِكْسِير"
      decision: confirmed
      decision_reason: >
        لفظ معرّب راسخ في المعاجم العربية الحديثة والوسيطة، يدل في معناه
        الأول على المادة التي زعم القدماء أنها تحوّل المعادن الرخيصة إلى ذهب.
        التعريف مطابق تماماً لدلالة المجموعة الترادفية. اللفظ مقبول بأل التعريف
        لأنه اسم جنس يُعرَّف عادة في الاستعمال.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الإكسير أعمّ من حجر الفلاسفة: يشمل فكرة المادة المحوِّلة للمعادن
        وأيضاً إكسير الحياة (شراب الخلود). كما استُعير مجازاً لكل ما يُصلح
        الفاسد أو يحقق المستحيل. ويُستعمل في الصيدلة الحديثة بمعنى مختلف تماماً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الإِكْسِير"

    # ── اللمّة الموجودة ٢: حجر الفلاسفة ──
    - lemma: "حَجَرُ الفَلاسِفَةِ"
      decision: confirmed
      decision_reason: >
        مركب إضافي ثابت مسجّل في المعجم الموحد لمصطلحات الكيمياء والمورد الحديث،
        يدل على المادة الخيالية التي اعتقد الكيميائيون القدماء أنها تحوّل المعادن
        الخسيسة إلى ذهب أو فضة. التعريف مطابق تماماً لدلالة المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        حجر الفلاسفة أخصّ من الإكسير: يقتصر على فكرة المادة المحوِّلة
        للمعادن، ولا يشمل فكرة إكسير الحياة. وهو أقرب إلى المصطلح العلمي
        الكيميائي التاريخي، بينما الإكسير أقرب إلى الاستعمال العام والأدبي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَجَرُ الفَلاسِفَةِ"

    # ── مرشح المرحلة ١: الكبريت الأحمر ──
    - lemma: "الكِبْرِيتُ الأَحْمَرُ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر على أدلة معجمية تربط هذا التعبير بمفهوم المادة المحوِّلة
        للمعادن. «الكبريت الأحمر» تعبير مجازي عربي يُضرب مثلاً للنادر
        العزيز الوجود في السياق الأدبي والصوفي، لكنه ليس مصطلحاً كيميائياً
        مرادفاً لحجر الفلاسفة أو الإكسير في الاستعمال المعجمي المُوثّق.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: حجر الحكماء ──
    - lemma: "حَجَرُ الحُكَمَاءِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر على أدلة معجمية لهذا المركب. رغم أن «الحكماء» استُعملت
        في بعض المصادر التراثية للإشارة إلى الكيميائيين القدماء، إلا أن
        «حجر الحكماء» ليس وحدة معجمية ثابتة مسجّلة في أي معجم عربي.
        المصطلح المعتمد هو «حجر الفلاسفة».
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "مادة افتراضية اعتقد الخيميائيون أنها قادرة على تحويل المعادن الخسيسة إلى ذهب"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي فيه لفظة «افتراضية» وهي ترجمة حرفية لـ hypothetical
        ولا تُستعمل في المعاجم العربية في هذا السياق. المعاجم العربية تستعمل
        «مادة مركبة كان الأقدمون يزعمون...». كذلك يقتصر التعريف على تحويل
        المعادن إلى ذهب، بينما المصادر تذكر أيضاً الفضة وإطالة الحياة.
    authored:
      - type: terminological
        text: >
          مادَّةٌ مركَّبة زعم أصحاب الكيمياء القديمة (الخِيمْياء) أنَّها
          قادرة على تحويل المعادن الرَّخيصة إلى ذهب أو فضّة، وعلى إطالة الحياة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مادَّةٌ أو مُسْتَحضَرٌ كيميائيٌّ خياليٌّ شغل أصحابَ الكيمياء
          القديمة (الخِيمْياء) قروناً طويلة، اعتقدوا أنَّه يقدر على تحويل
          المعادن الخسيسة كالرصاص والنحاس إلى ذهب أو فضّة، وأنَّ منه
          شراباً يُطيل الحياة يُعرف بإكسير الحياة. وقد بحث عنه كثيرٌ من
          علماء العرب كجابر بن حيّان وأبي بكر الرازيّ.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادَّةٌ مركَّبة زعم أصحاب الكيمياء القديمة (الخِيمْياء) أنَّها قادرة على تحويل المعادن الرَّخيصة إلى ذهب أو فضّة، وعلى إطالة الحياة"

  examples:
    per_lemma:
      - lemma: "الإِكْسِير"
        examples:
          - text: "أفنى جابر بن حيّان حياته في البحث عن الإكسير الذي يحوّل النحاس ذهباً."
            type: usage
      - lemma: "حَجَرُ الفَلاسِفَةِ"
        examples:
          - text: "ظلّ حجر الفلاسفة حلماً راود الكيميائيين القدماء حتى أثبت العلم الحديث استحالة تحويل العناصر بالطرق الكيميائية التقليدية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أفنى جابر بن حيّان حياته في البحث عن الإكسير الذي يحوّل النحاس ذهباً."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "ظلّ حجر الفلاسفة حلماً راود الكيميائيين القدماء حتى أثبت العلم الحديث استحالة تحويل العناصر بالطرق الكيميائية التقليدية."

