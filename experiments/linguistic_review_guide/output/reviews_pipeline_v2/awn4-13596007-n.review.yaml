        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْرِيض"

    - lemma: "تَوْسِيع"
      decision: confirmed
      decision_reason: "مصدر وَسَّعَ بمعنى صيّره واسعاً، مثبت في الوسيط ومعتمد في عشرات المعاجم التقنية (ARABTERM) مقابل expansion/widening/broadening. شائع ومتداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ من «تعريض»؛ يدلّ على جعل الشيء أوسع في أيّ اتجاه، ويُستعمل مجازاً في التوسيع المعنوي أيضاً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوْسِيع"

    - lemma: "اتِّسَاع"
      source: stage1
      decision: removed
      decision_reason: "اتِّسَاع مصدر الفعل اللازم اتَّسَعَ (صار واسعاً)، فهو يدلّ على الحالة أو الصيرورة لا على فعل الزيادة. كما أنّ استخداماته المعجمية الغالبة في الطبّ (dilation) واللسانيات (extension) بعيدة عن مفهوم widening المحض."
      evidence_assessment:
        case: mixed

    - lemma: "تَوَسُّع"
      source: stage1
      decision: removed
      decision_reason: "تَوَسُّع مصدر تَوَسَّعَ (لازم مطاوع)، يدلّ على التمدّد الذاتي والانبساط العامّ (expansion/sprawl)، وهو أبعد دلالياً عن مفهوم الزيادة المحدّدة في العرض. كما أنّ له معنى بلاغياً اصطلاحياً."
      evidence_assessment:
        case: mixed


