# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13596007-n
# an increase in width — زيادة في العرض
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «تعريض» مشترك لفظي؛ معناه الغالب في المعاجم الكلاسيكية هو الكلام غير المباشر (مقابل التصريح)، والتعريض الضوئي (exposure)، لا جعل الشيء عريضاً"
      - "لفظ «توسيع» أعمّ من المطلوب؛ يدلّ على الزيادة في السعة مطلقاً لا في العرض خاصّةً"
      - "التعريف العربي الحالي «زيادة في العرض» مقتضب وصحيح لغوياً لكنه ترجمة حرفية للتعريف الإنجليزي"
    observations: "المجموعة تعبّر عن مفهوم هندسي/فيزيائي بسيط: ازدياد البُعد العرضي للشيء. الأب المباشر هو «زيادة/نمو/تصاعد». اللمّتان الموجودتان تمثّلان: تعريض (خاصّ بالعرض، وزن تفعيل من عَرُضَ) وتوسيع (عامّ، وزن تفعيل من وَسِعَ). كلاهما مصدر الفعل المزيد على وزن تَفْعِيل، وهو مناسب للدلالة على الفعل المتعدّي (جعل الشيء عريضاً/واسعاً)."

  blind_candidates:
    - lemma: "تَعْرِيض"
      generation_method: ishtiqaq
      justification: "مصدر عَرَّضَ (فعّل) من الجذر ع ر ض، بمعنى جعل الشيء عريضاً. الأقرب دلالةً لمفهوم الزيادة في العرض تحديداً."
    - lemma: "تَوْسِيع"
      generation_method: ishtiqaq
      justification: "مصدر وَسَّعَ (فعّل) من الجذر و س ع، بمعنى جعل الشيء واسعاً. شائع في المعجمية التقنية المعاصرة للدلالة على التمديد والتوسعة."
    - lemma: "اتِّسَاع"
      generation_method: ishtiqaq
      justification: "مصدر اتَّسَعَ (افتعل) من و س ع، يدلّ على صيرورة الشيء واسعاً. وارد في المعاجم الطبية بمعنى التمدّد (dilation)."
    - lemma: "تَوَسُّع"
      generation_method: ishtiqaq
      justification: "مصدر تَوَسَّعَ (تفعّل) من و س ع، يدلّ على الانبساط والامتداد ذاتياً. يُستعمل في السياقات العلمية بمعنى expansion."


stage2_evidence:
  per_lemma:
    - lemma: "تَعْرِيض"
      confirm:
        - text: "«عَرَّضَ الشيءَ: جعله عريضاً»"
          source: "المعجم الوسيط"
        - text: "«وَعَرَّضَ الشَّيْءَ تَعْرِيضًا: جَعَلَهُ عَرِيضًا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«تعريض، توسيع = widening / élargissement»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
      contradicts:
        - text: "«التعريض في الكلام: ما يفهم به السامع مراده من غير تصريح»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "المعنى البلاغي الغالب للتعريض هو الكلام غير المباشر، لا الزيادة في العرض"
        - text: "«تعريض = exposure (للضوء)»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          conflict: "في السياق التقني الشائع، التعريض يعني التعرّض للضوء (exposure)، لا التوسيع"
      expands:
        - text: "«عَرَّضَ الشيءَ: جعله عريضاً. نصبَه بالعَرْض. الرُّمْحَ: جعله بالعرض... له بالقول: لم يبينه ولم يصرِّح به»"
          source: "المعجم الوسيط"
          addition: "الوسيط يثبت تعدّد دلالات عَرَّضَ؛ المعنى الأول (جعله عريضاً) يدعم الاستخدام المطلوب"

    - lemma: "تَوْسِيع"
      confirm:
        - text: "«وَسَّعَ الشيءَ, توسيعاً, وتوسِعَةً: صيَّره واسعاً»"
          source: "المعجم الوسيط"
        - text: "«توسيع = amplification / expansion / extension / uprating»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«توسيع = enlargement / expansion / extension / increase»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«يوسِّع؛ يُعرِّض = widen»"
          source: "المورد الحديث (2008)"
        - text: "«توسيع نبضي = pulse broadening»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«توسيع = expansion: طريقةٌ لزيادة إمكانات الحواسيب بإضافة عتاديات»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُستخدم التوسيع في سياقات تقنية متنوعة تتجاوز المعنى الهندسي المحض"

    - lemma: "اتِّسَاع"
      confirm:
        - text: "«الاتّساع: هو عند الأطباء أن تتسع العصبة المجوّفة مع سعة الحدقة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«اتساع المَسَار = lane widening: زيادة عرض الممر لمراعاة الخطأ»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      contradicts:
        - text: "«اتساع = Extension: تحديد مجموعة معينة بواسطة الحصر»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "في اللسانيات، الاتساع مصطلح منطقي (extension) لا علاقة له بالعرض الفيزيائي"
      expands:
        - text: "«اتساع الحافة المتقدمة = leading-edge broadening»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يُستخدم الاتساع في الإلكترونيات بمعنى broadening"

    - lemma: "تَوَسُّع"
      confirm:
        - text: "«(توسع) الشَّيْء وسع وَالْقَوْم فِي الْمجْلس تَفَسَّحُوا فِيهِ»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«التوسع: الإتيان في عجز الكلام بمثنى مفسر باسمين ثانيهما معطوف على الأول»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الاصطلاحي البلاغي بعيد عن مفهوم الزيادة في العرض"


stage3_analysis:
  per_lemma:
    - lemma: "تَعْرِيض"
      decision: confirmed
      decision_reason: "مصدر عَرَّضَ بمعنى جعل الشيء عريضاً، مثبت في الوسيط ومقاييس اللغة، ومعتمد في معجم النفط مقابل widening. رغم الاشتراك اللفظي مع المعنى البلاغي، فإنّ السياق يميّز المعنيين."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بالزيادة في البُعد العرضي تحديداً (العَرْض خلاف الطول)، وهو أدقّ من «توسيع» الذي يشمل الزيادة في أي بُعد."
