# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13539046-n
# المفهوم: a multiplicative increase — زيادة مضاعفة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «زيادة مضاعفة» مقتضب جداً ولا يميّز المفهوم عن مجرد الزيادة أو المضاعفة"
      - "اللمّة «تكاثر» تُستعمل غالباً بدلالة بيولوجية (reproduction/proliferation) لا بدلالة رياضية/كمّية"
      - "اللمّتان الموجودتان بلا تشكيل"
    observations: "المجموعة تدلّ على زيادة بطريقة الضرب (multiplicative)، أي أن المقدار يتضاعف بنسبة ثابتة لا بمقدار ثابت. هذا المفهوم رياضي/كمّي في الأصل، يختلف عن التكاثر البيولوجي وعن مجرد التزايد التراكمي. المفرط العلوي (hypernym) هو التصاعد/الزيادة/النمو، فالمطلوب لمّات تدلّ على نوع خاص من الزيادة هو المضاعفة."
  blind_candidates:
    - lemma: "مُضَاعَفَة"
      generation_method: ishtiqaq
      justification: "مصدر مُفَاعَلة من ضاعَفَ، يدلّ على الزيادة على المقدار بمثله أو أكثر، وهو الأقرب لمفهوم multiplicative increase"
    - lemma: "تَضْعِيف"
      generation_method: ishtiqaq
      justification: "مصدر تَفعيل من ضَعَّفَ، مصطلح حسابي كلاسيكي عند الخليل يعني زيادة العدد بمثله"
    - lemma: "تَزَايُد"
      generation_method: ishtiqaq
      justification: "مصدر تَفَاعُل من زاد، يدلّ على الزيادة المتبادلة أو المتتالية"
    - lemma: "إِكْثَار"
      generation_method: ishtiqaq
      justification: "مصدر إفعال من كَثُرَ، يدلّ على جعل الشيء كثيراً، يُستعمل في سياقات زراعية وبيولوجية بمعنى multiplication"

stage2_evidence:
  per_lemma:
    - lemma: "تَضَاعُف"
      confirm:
        - text: "«(تضَاعف) مُطَاوع ضاعفه وَصَارَ ضعف مَا كَانَ»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«الشيءُ: صار مِثْلَيْ ما كانَ عليه وكثُرَ. يقال: ضاعَفَهُ فتضاعَفَ»"
          source: "المعجم الكبير"
        - text: "«ازدياد عدد الوحدات إلى الضعف كعدد الصبغيات (الكروموسومات) مثلا عند الاخصاب»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
        - text: "«(1) «أ» مضاعَفة. «ب» تضاعُف (2) الضَّرْب (ر).» — ترجمة multiplication"
          source: "المورد الحديث"
      expands:
        - text: "«(1) «ا» الاخلاف (نب). «ب» تضاعف: تكاثر سريع (2) انتشار» — ترجمة proliferation"
          source: "المورد الحديث"
          addition: "يربط تضاعف بالتكاثر السريع في سياق proliferation"
        - text: "«تضاعف المواقع في الصبغيّ بسبب تضاعف مادته الجينية»"
          source: "المعجم الموحد لمصطلحات علم الوراثة"
          addition: "استعمال متخصص في الوراثة بمعنى duplication"

    - lemma: "تَكَاثُر"
      confirm:
        - text: "«تكاثر» — ترجمة multiplication في مجال الأحياء"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
      contradicts:
        - text: "«عملية متميزة ومميزة، تتكون من عدد من المراحل وتستلزم العديد من الشروط، لكنها أساس استمرار الحياة وتطورها، إذ تمكن الكائنات الحية من إنتاج مثيلاتها» — ترجمة reproduction"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          conflict: "الدلالة الأساسية بيولوجية (reproduction) لا كمّية عامّة"
        - text: "«تَكاثُر» — ترجمة proliferation في المعجم الطبي الموحد"
          source: "المعجم الطبي الموحد"
          conflict: "proliferation تعني التكاثر السريع غير المنضبط (خصوصاً الخلايا)، وهي دلالة مختلفة عن multiplicative increase"

    - lemma: "مُضَاعَفَة"
      confirm:
        - text: "«المضاعفة: الزيادة على المقدار بمثلها أو أكثر. وقال الحرالي مفاعلة من الضعف بالكسر، وهو أن تثني الشيء بمثله مرة أو مرات»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«مضاعفة» — ترجمة doubling"
          source: "مسرد الفن والتسلية والرياضة"
        - text: "«مضاعفة» — ترجمة duplication في التشريح"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"
      expands:
        - text: "«(المضاعفة) من الدروع الَّتِي ضوعف حلقها ونسجت حلقتين والأضعاف المضاعفة الأمثال المتعددة وَفِي التَّنْزِيل الْعَزِيز {لَا تَأْكُلُوا الرِّبَا أضعافا مضاعفة}»"
          source: "المعجم الوسيط (هورماني)"
          addition: "دلالة موسّعة تشمل الأضعاف المتعددة وليس المضاعفة لمرة واحدة"

    - lemma: "تَضْعِيف"
      confirm:
        - text: "«التضعيف: أن يزاد على أصل الشيء فيجعل مثليه، ذكره الخليل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«التّضعيف: هو عند المحاسبين زيادة عدد على نفسه كزيادة الأربعة على الأربعة التي تحصل منها ثمانية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«في النطق والكتابةِ: التَّشديدُ»"
          source: "المعجم الكبير"
          conflict: "في الاستعمال المعاصر أصبح المصطلح يدلّ أساساً على التشديد الصوتي (gemination)"
        - text: "«تشديد التلفظ الصامتي الذي يمدد الفترة التمفصلية» — ترجمة Gemination"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          conflict: "المعاجم المصطلحية الحديثة تخصصه بالدلالة الصوتية"

    - lemma: "تَزَايُد"
      contradicts:
        - text: "«(تزايد) زَاد وَفِي قَوْله أَو فعله زَاد فِيهِ وَتجَاوز مَا يَنْبَغِي وَالنَّاس فِي السّلْعَة وَعَلَيْهَا زَاد كل على الآخر حَتَّى بلغ منتهاه»"
          source: "المعجم الوسيط (هورماني)"
          conflict: "الدلالة المعجمية هي المزايدة في الثمن أو التجاوز، لا الزيادة الضربية"
        - text: "«الازدياد المتدرج في حجم الجسم بضم مزيد من المادة إليه» — ترجمة accretion"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          conflict: "الترجمة المصطلحية هي accretion (تراكم تدريجي) لا multiplication"

    - lemma: "إِكْثَار"
      confirm:
        - text: "«اكثار البذار» — ترجمة seed multiplication"
          source: "المَكنَز الزراعي متعدد اللغات"
      expands:
        - text: "يُستعمل في السياق الزراعي بمعنى الإكثار النباتي (multiplication)"
          source: "المَكنَز الزراعي"
          addition: "الاستعمال محصور في المجال الزراعي/البيولوجي وليس كمّياً عامّاً"

stage3_analysis:
  per_lemma:
    - lemma: "تَضَاعُف"
      decision: confirmed
      decision_reason: "مصطلح ثابت في المعاجم الحديثة بدلالة المضاعفة الكمّية (duplication/multiplication)، مؤيَّد من المعجم الوسيط والمعجم الكبير والمعاجم المصطلحية العلمية. هو المقابل الأدق لـ multiplicative increase بوصفه مصدراً يدلّ على صيرورة الشيء ضعف ما كان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على النتيجة الحاصلة تلقائياً من فعل المضاعفة (مطاوع ضاعَفَ)؛ يُستعمل للزيادة التي تحصل بنسبة ضربية لا بمقدار ثابت"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَضَاعُف"

    - lemma: "تَكَاثُر"
      decision: removed
      decision_reason: "الأدلة المعجمية تؤكد أن «تكاثر» يُستعمل أساساً بدلالة بيولوجية (reproduction/proliferation)، وترجمته multiplication في الأحياء تعني التكاثر لا الزيادة الكمّية الضربية. إدراجه في هذه المجموعة يخلط بين مفهومين مختلفين."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُضَاعَفَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر ضاعَفَ على وزن مُفَاعَلة، عرّفه المناوي بأنه «الزيادة على المقدار بمثلها أو أكثر»، وهو تعريف يطابق مفهوم المجموعة تماماً. يُستعمل في المعاجم المصطلحية الحديثة بمعنى doubling/duplication. يكمّل «تضاعف» بكونه يدلّ على الفعل لا النتيجة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على فعل المضاعفة نفسه (الفاعلية)، بخلاف تضاعُف الذي يدلّ على المطاوعة والنتيجة"
      actions:
        - command: create_entry
          params: {lemma: "مُضَاعَفَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَضْعِيف"
      source: stage1
      decision: removed
      decision_reason: "رغم أن المصطلح كان يُستعمل عند المحاسبين القدماء بمعنى زيادة العدد على نفسه، فقد تخصّص في الاستعمال المعاصر بالدلالة الصوتية (التشديد/gemination). إدراجه يولّد لبساً مع المصطلح اللساني الشائع."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَزَايُد"
      source: stage1
      decision: removed
      decision_reason: "دلالته المعجمية هي المزايدة في الثمن أو الازدياد التدريجي (accretion/increment)، وهو أقرب إلى additive increase منه إلى multiplicative increase."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "إِكْثَار"
      source: stage1
      decision: removed
      decision_reason: "استعماله المصطلحي محصور في المجال الزراعي (إكثار البذار/النبات)، ولا يدلّ على الزيادة الضربية بمعناها الكمّي العام."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

