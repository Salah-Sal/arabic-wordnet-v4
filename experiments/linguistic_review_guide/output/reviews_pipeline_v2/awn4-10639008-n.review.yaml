# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'شَخْص اجْتِمَاعِيّ' مركبٌ وصفيٌّ حرٌّ لا يجتاز اختبار السكّ؛ يمكن إبدال «شخص» بـ«إنسان» أو «فرد» أو «امرؤ» فيبقى التعبير صالحاً وصفاً — وهذا يكشف غياب التثبيت المعجمي."
      - "التعريف 'شخص يشارك في الأنشطة الاجتماعية' ترجمةٌ حرفية للإنجليزية، ويتشارك مع لمّة «شَخْص اجْتِمَاعِيّ» في مادة (ا-ج-ت-م-ا-ع) مما يُوجِد دوراناً جزئياً."
      - "المجموعة خاليةٌ من الأمثلة الاستعمالية على مستوى المجموعة والمعنى."
      - "الجذر الأكثر ملاءمةً للمفهوم (خ ل ط) غير مستثمَر في التعريف الحالي."
    observations: >
      المجموعة تُترجم الوحدتين الإنجليزيتين socializer / socialiser وتصف
      شخصاً يميل طبيعياً نحو الحياة الاجتماعية المشتركة. الجذران الأكثر
      ملاءمةً للمفهوم هما (خ ل ط) الدالّ على الاندماج والمزج، و(ع ش ر)
      الدالّ في أصله الثاني على المداخلة والمخالطة. لمّة «مُخَالِط» هي
      الأجود في المجموعة بوصفها اشتقاقاً قياسياً على وزن مُفَاعِل يفيد
      الفاعليةَ التشاركية. تجدر الإشارة إلى أن المعاجم الحديثة تستعمل
      «الاجتماعي» منفرداً اسماً للشخص المحبّ للاختلاط، مما يُضعف مبرِّرَ
      وجود «شَخْص اجْتِمَاعِيّ» وحدةً معجمية مستقلة.

  blind_candidates:
    - lemma: "مُعَاشِر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من عاشَرَ (باب المفاعلة) من جذر (ع ش ر) الدالّ في أصله
        الثاني على المداخلة والمخالطة؛ عاشَرَ القومَ: خالطهم وعاش بينهم.
        الوزن مُفَاعِل يفيد الفاعليةَ التشاركية المناسبة لمن يُشارك
        الآخرين في حياتهم الاجتماعية.
    - lemma: "مُؤَانِس"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من آنَسَ (باب المفاعلة) من جذر (أ ن س) الدالّ على ضدّ
        التوحُّش والألفة؛ آنَسَهُ مُؤانَسةً: لاطفه وأزال وحشتَه. يصف من
        يُنشّط الاجتماع بحضوره ومشاركته الفاعلة.
    - lemma: "مُجَالِس"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من جالَسَ (باب المفاعلة) من جذر (ج ل س)؛ جالَسَ القومَ:
        شاركهم في مجالسهم وتجمّعاتهم. يصف من يحرص على حضور مجالس الناس
        والانتساب إلى تجمّعاتهم الاجتماعية.
    - lemma: "مُنَادِم"
      generation_method: majaz
      justification: >
        إحياء لوزن مُفَاعِل من (ن د م)؛ نادَمَهُ: صارا نديمَيْن في مجلس
        أُنسٍ. المنادَمة في أصلها مصاحبةٌ في مجالس السَّمَر والأُنس؛
        يمكن مجازاً توسيعها لتشمل المشاركة في الأنشطة الاجتماعية عموماً.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "شَخْص اجْتِمَاعِيّ"
      expands:
        - text: "«الاجتماعي: شخص يُحبّ الاختلاط بالناس — My brother is a good mixer»"
          source: "المورد الحديث (2008)"
          addition: >
            يُؤكد أن «الاجتماعي» يُستعمل وحده دالاً على محبّ الاختلاط،
            مما يُضعف مبرِّرَ وجود «شخص» في التركيب.

    - lemma: "مُخَالِط"
      confirm:
        - text: "«(1) مُخالِط؛ اجتماعيّ النزعة: محبّ للاختلاط بالآخرين (2) أنيس؛ حَسَن المخالَطة؛ حُلوُ العِشرة»"
          source: "المورد الحديث (2008) — ترجمة sociable"
        - text: "«الخِلْطَةُ بالكسر: العِشْرَةُ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«الخليطُ المخالِط، كالنديم المُنادِم، والجليس المُجالِس»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      contradicts:
        - text: "«ب- الشخص الذي يعرف عنه مخالطته لمريض بمرض معدٍ والذي يمكن أن ينقل إليه العدوى أو يصاب بالمرض.»"
          source: "معجم المصطلحات الطبية ج.١ (1985)"
          conflict: >
            في الاصطلاح الطبي يحمل «مُخالِط» معنىً إپيدميولوجياً محدداً
            (contact) يختلف عن الدلالة الاجتماعية العامة المقصودة هنا.
      expands:
        - text: "«الْخَاءُ وَاللَّامُ وَالطَّاءُ أَصْلٌ وَاحِدٌ... تَقُولُ: خَلَطْتُ الشَّيْءَ بِغَيْرِهِ فَاخْتَلَطَ. وَرَجُلٌ مِخْلَطٌ، أَيْ حَسَنُ الْمُدَاخَلَةِ لِلْأُمُورِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يُرسّخ أن الجذر (خ ل ط) يفيد الاندماج والمداخلة، وأن مِخْلَطاً
            يعني حسن المداخلة — قريبٌ جداً من دلالة مُخَالِط.
        - text: "«بَاب المخالطة: شابهم وخالطهم ومازجهم وحالفهم وماشجهم وساطهم»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
          addition: "يُرسّخ المخالطة مفهوماً معجمياً راسخاً في التراث العربي."

    - lemma: "مُعَاشِر"
      confirm:
        - text: "«مُعَاشِر من (ع ش ر) المخالط المعايش.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«الْعَيْنُ وَالشِّينُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا فِي عَدَدٍ مَعْلُومٍ ثُمَّ يُحْمَلُ عَلَيْهِ غَيْرُهُ، وَالْآخَرُ يَدُلُّ عَلَى مُدَاخَلَةٍ وَمُخَالَطَةٍ. فَالْعِشْرَةُ وَالْمُعَاشَرَةُ. وَعَشِيرُكَ: الَّذِي يُعَاشِرُكَ. وَإِنَّمَا سُمِّيَتْ عَشِيرَةُ الرَّجُلِ لِمُعَاشَرَةِ بَعْضِهِمْ بَعْضاً.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يُثبت أن الأصل الثاني لـ(ع ش ر) هو المداخلة والمخالطة وأن
            المُعَاشَرة مفهومٌ جذري راسخ — وهو ما يُسند مُعَاشِر سنداً أصيلاً.
        - text: "«صُحْبَان: جمع صاحب بمعنى معاشر ومرافق.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُظهر ترادف معاشر مع الصاحب والمرافق في الاستعمال."

    - lemma: "مُؤَانِس"
      confirm:
        - text: "«(آنسه) مؤانسةً لاطفه وأزال وحشته فَهُوَ مؤانس»"
          source: "المعجم الوسيط"
        - text: "«منشط سياحي، مؤانس سياحي»"
          source: "مسرد الفن والتسلية والرياضة — ArabTerm (ALECSO)"
      contradicts:
        - text: "«(3) مُؤنس: مُتّسِم بالمودّة أو بحُسْن العلاقات الاجتماعيّة أو مُفْضٍ إليهما»"
          source: "المورد الحديث (2008)"
          conflict: >
            المؤانِس يدلّ على من يُزيل وحشةَ غيره ويُلاطفه (فعل متعدٍّ
            موجَّه نحو الآخر)، وليس على من يُشارك هو بنفسه في الأنشطة
            الاجتماعية (فعل ذاتي التوجّه). الفرق في بنية الحدث الدلالية جوهري.
      expands:
        - text: "«الْهَمْزَةُ وَالنُّونُ وَالسِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ ظُهُورُ الشَّيْءِ، وَكُلُّ شَيْءٍ خَالَفَ طَرِيقَةَ التَّوَحُّشِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الأصل يدلّ على ضدّ التوحُّش وعلى الألفة، لكن مُؤانِس يميل
            نحو الإيناس الوظيفي أكثر من المشاركة الاجتماعية الفاعلة.

    - lemma: "مُجَالِس"
      evidence_status: "no_material_found"

    - lemma: "مُنَادِم"
      expands:
        - text: "«نادم: دعا، استضاف. نادم: صار نديمَيْن.»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: >
            المنادَمة في أصلها مصاحبةٌ في مجالس الأُنس؛ غير أنها مقيَّدة
            تاريخياً بمجالس الشراب والسَّمَر الخاصة.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "شَخْص اجْتِمَاعِيّ"
      decision: removed
      decision_reason: >
        مركبٌ وصفيٌّ (نعتي) حرٌّ يفشل اختبارَ السكّ: يمكن القول «إنسان
        اجتماعي» و«فرد اجتماعي النزعة» بالمعنى ذاته، فهو ليس وحدةً معجمية
        ثابتة. علاوةً على ذلك تستعمل المعاجم الحديثة «الاجتماعي» منفرداً
        دالاً على الشخص المحبّ للاختلاط، مما يُضعف مبرِّرَ إدراجه مركّباً.
        وجود مُخَالِط ومُعَاشِر يُغني عنه بأفضل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُخَالِط"
      decision: confirmed
      decision_reason: >
        اسم فاعل فصيح قياسي على وزن مُفَاعِل من الجذر (خ ل ط)، ورد في
        المورد الحديث (2008) ترجمةً لـ sociable بمعنى «محبّ الاختلاط
        بالآخرين»، وأيّدته المعاجم الكلاسيكية (الصحاح: الخِلْطَة هي
        العِشرة، والخليط هو المُخالِط). الاستعمال الطبي (contact) تخصّصي
        لا يُلغي الدلالةَ الاجتماعية العامة الأوسع والأسبق.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على فعل المداخلة والاندماج الفعلي بالناس وعلى حسن المداخلة
        في الأوساط المتنوعة؛ يصف السلوك الاجتماعي الديناميكي المتكرَّر،
        بصرف النظر عن امتداده الزمني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَالِط"

    - lemma: "مُعَاشِر"
      source: stage1
      decision: confirmed
      decision_reason: >
        اسم فاعل من عاشَرَ (باب المفاعلة) من الجذر (ع ش ر) الدالّ في
        أصله الثاني —وفق مقاييس ابن فارس— صراحةً على المداخلة والمخالطة.
        موثَّقٌ في موسوعة السلطان قابوس بتعريف صريح «المخالط المعايش»،
        ويُضيف إلى المجموعة بُعدَ الصحبة المديدة والعيش المشترك.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُفيد الصحبةَ المستمرة والعيش بين الناس ومشاركتهم الحياةَ
        اليومية؛ أشدُّ استمراريةً وعمقاً من مُخَالِط الذي يصف فعل
        الاختلاط دون الإشارة الضرورية إلى امتداده الزمني.
      actions:
        - command: create_entry
          params: {lemma: "مُعَاشِر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُؤَانِس"
      source: stage1
      decision: removed
      decision_reason: >
        المؤانِس يدلّ على من يُلاطف غيره ويُزيل وحشتَه — فعلٌ متعدٍّ
        موجَّه نحو الآخر. أما المفهوم المقصود (socializer) فهو من يُشارك
        هو نفسه في الأنشطة الاجتماعية — فعلٌ ذاتي التوجّه. الفرق في
        بنية الحدث الدلالية جوهري. فضلاً عن ذلك، استعماله المسجَّل في
        المصادر (مؤانس سياحي = tourist entertainer) يُرسّخ معنى الترفيه
        الوظيفي لا الاندماج الاجتماعي الذاتي.
      evidence_assessment:
        case: mixed

    - lemma: "مُجَالِس"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على مُجَالِس بوصفه اسم فاعل دالاً على الشخص المشارك
        في الأنشطة الاجتماعية في قاعدة البيانات؛ الصيغة المسجَّلة
        «مجالس» هي جمع مجلس لا اسم فاعل. مُخَالِط ومُعَاشِر يُغنيان
        عنه بأدلّة أوثق.

    - lemma: "مُنَادِم"
      source: stage1
      decision: removed
      decision_reason: >
        دلالته الأصيلة مقيَّدة تاريخياً بمجالس الشراب والسَّمَر الخاصة؛
        توسيعها للمشاركة في الأنشطة الاجتماعية عموماً يقتضي إزاحةً
        دلالية واسعة غير موثَّقة في المعاجم الحديثة.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "شخص يشارك في الأنشطة الاجتماعية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمةٌ حرفية للإنجليزية وليس فيه جنس قريب واضح
        ولا فصل نوعي دقيق. كلمة «أنشطة» عامةٌ جداً، ولا يُميّز الشخصَ
        الانطوائي الذي يحضر نشاطاً اجتماعياً عَرَضياً من المُكثِر للمخالطة
        الذي يصفه المصطلح.
    authored:
      - type: terminological
        text: "مَن يُحِبُّ مُخَالَطةَ النَّاسِ وَمُعَاشَرَتَهُم وَيَحرِصُ عَلَى المُشَارَكةِ فِي مَجَالِسِهِم وَمُنَاسَبَاتِهِم"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَن يَألَفُ النَّاسَ وَيَألَفُونَهُ وَيُكثِرُ الاختِلَاطَ بِهِم"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَن يُحِبُّ مُخَالَطةَ النَّاسِ وَمُعَاشَرَتَهُم وَيَحرِصُ عَلَى المُشَارَكةِ فِي مَجَالِسِهِم وَمُنَاسَبَاتِهِم"

  examples:
    per_lemma:
      - lemma: "مُخَالِط"
        examples:
          - text: "كَانَ مُخَالِطاً بِطَبعِهِ، لا يُطِيقُ الانفِرَادَ، يَرتَادُ المَجَالِسَ وَيَسعَى إِلَى كُلِّ تَجَمُّعٍ."
            type: usage
      - lemma: "مُعَاشِر"
        examples:
          - text: "عُرِفَ بِأَنَّهُ مُعَاشِرٌ لَطِيفٌ، يَأْلَفُ النَّاسَ وَيَأْلَفُونَهُ فِي كُلِّ مَحفِلٍ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "كَانَ مُخَالِطاً بِطَبعِهِ، لا يُطِيقُ الانفِرَادَ، يَرتَادُ المَجَالِسَ وَيَسعَى إِلَى كُلِّ تَجَمُّعٍ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "عُرِفَ بِأَنَّهُ مُعَاشِرٌ لَطِيفٌ، يَأْلَفُ النَّاسَ وَيَأْلَفُونَهُ فِي كُلِّ مَحفِلٍ."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
