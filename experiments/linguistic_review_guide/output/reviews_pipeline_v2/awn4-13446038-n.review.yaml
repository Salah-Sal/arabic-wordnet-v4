# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13446038-n
# accretion / accumulation — تراكم / تكدس
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تكدس» تدل على التجميع المادي والرص لا على الزيادة بالنمو أو الإضافة التدريجية"
      - "التعريف العربي ترجمة حرفية من الإنجليزية ويحتاج صياغة معجمية"
      - "تشكيل اللمّات غير موجود في بيانات المجموعة"
    observations: "المجموعة تعبّر عن مفهوم الزيادة التدريجية الناتجة عن النمو العضوي أو الإضافة الخارجية، وهو مفهوم متجذّر في العربية. لفظة «تراكم» من جذر ركم تؤدّي المعنى بدقة، لكن «تكدس» أقرب إلى التراصّ والتجمّع الفيزيائي منه إلى الزيادة التدريجية."
  blind_candidates:
    - lemma: "تَنَامٍ"
      generation_method: ishtiqaq
      justification: "مصدر تَنَامَى من جذر نمو على وزن تَفَاعُل، يدلّ على الزيادة المتدرّجة بالنمو العضوي أو الإضافة، وهو مطابق دلالياً للتعريف"
    - lemma: "تَزَايُد"
      generation_method: ishtiqaq
      justification: "مصدر تَزَايَدَ من جذر زيد على وزن تَفَاعُل، يفيد الازدياد التدريجي المتبادل أو المتتابع"
    - lemma: "تَعَاظُم"
      generation_method: ishtiqaq
      justification: "مصدر تَعَاظَمَ من جذر عظم على وزن تَفَاعُل، يفيد الزيادة المتواصلة في الحجم أو القدر"
    - lemma: "ازْدِيَاد"
      generation_method: ishtiqaq
      justification: "مصدر ازْدَادَ من جذر زيد على وزن افتعال، يدلّ على مطلق الزيادة والنمو"


stage2_evidence:
  per_lemma:
    - lemma: "تَرَاكُم"
      confirm:
        - text: "«تَجَمُّع الأشياء بعضها إلى بعض, ومِنْ أَمْثِلَتِه تَجَمُّعُ بَعْضِ الأَدْوِيَةِ فى أَجْزاءِ الجِسم المُخْتَلِفَة»"
          source: "المعجم الكبير (اسم)"
        - text: "«الشَّيْءُ: ارْتَكَمَ. يقال: ركَمَه فَتَراكم. تَرَاكَمَتِ الأَشْغالُ. تَرَاكَم السَّحابُ: تَنَامَى وتَكَاثَفَ»"
          source: "المعجم الكبير (فعل)"
        - text: "«(تراكم) ارتكم يُقَال تراكمت الأشغال»"
          source: "المعجم الوسيط"
        - text: "«إضافات متتالية من مادة إلى كائن مستهدف، أو إلى جهاز، أو إلى جزء من البيئة، مما يؤدي إلى زيادة كمية أو تركيز المادة»"
          source: "مسرد المناخ والبيئة (ARABTERM)"
        - text: "«تزايد رقعة الأرض بالتطمي أو التغريم»"
          source: "المعجم الموحد لمصطلحات النفط"
        - text: "«(1) تكديس the accumulation of money (2) تراكُم the accumulation of sorrows (3) رُكام؛ شيء متراكم»"
          source: "المورد الحديث"
      expands:
        - text: "«يقع التراكم في تأريخ الأدب عبر تصنيف يقتضي موضعة الأجيال والإنتاج لتحليلهما كتعبير عن خلاصات كمية تبرز الدلالات النوعية للأحداث التاريخية»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "يوسّع الاستعمال إلى المجال الأدبي والفكري"

    - lemma: "تَكَدُّس"
      contradicts:
        - text: "«الحالة التي تكون فيها الأشجار متقاربة بشكل وثيق مما يرفع من التنافس على الموارد ويحد من إمكانات النمو الكامل»"
          source: "مسرد المناخ والبيئة (ARABTERM)"
          conflict: "التكدس هنا بمعنى التزاحم والتكاثف لا الزيادة بالنمو"
        - text: "«1-رصف مسطح لقواعد نيتروجينية مسطحة في الدنا ثنائيّ اللولب. 2-تجمع جزيئات الملون على الرنا»"
          source: "المعجم الموحد لمصطلحات علم الوراثة"
          conflict: "التكدس بمعنى الرصف والتراكب الفيزيائي لا الزيادة التدريجية"
        - text: "«تجمع المواد بشكل كتلة، كالصفيحات الدموية مثلا»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          conflict: "التكدس بمعنى التجمع الكتلي (aggregation) لا التراكم بالنمو"
      expands:
        - text: "«الْكَافُ وَالدَّالُ وَالسِّينُ ثَلَاثُ كَلِمَاتٍ لَا يُشْبِهُ بَعْضُهَا بَعْضًا. فَالْأُولَى: كُدْسُ الطَّعَامِ. وَالثَّانِيَةُ التَّكَدُّسُ، وَهُوَ مَشْيُ الْفَرَسِ كَأَنَّهُ مُثْقَلٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر كدس لا يحمل معنى الزيادة أو النمو أصلاً، بل التكويم والإثقال"

    - lemma: "تَنَامٍ"
      confirm:
        - text: "«تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "«(1) تزايُد؛ تنامٍ؛ تعاظُم [من طريق النموّ العُضوي أو بواسطة إضافات خارجية تدريجية]»"
          source: "المورد الحديث"

    - lemma: "تَزَايُد"
      confirm:
        - text: "«الازدياد المتدرج في حجم الجسم بضم مزيد من المادة إليه»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
      contradicts:
        - text: "«(انظر: مرحلة أولية)»"
          source: "مسرد الهندسة الكهربائية"
          conflict: "تزايد في السياق الهندسي بمعنى increment الرياضي لا accretion"

    - lemma: "تَعَاظُم"
      confirm:
        - text: "«إضافة جسيمات من الهواء لقطرات مائية (الثلج والمطر والصقيع) من خلال التخثر لتكوين قطرات أكبر تقع من السماء»"
          source: "مسرد المناخ والبيئة"

    - lemma: "ازْدِيَاد"
      confirm:
        - text: "«augmentation»"
          source: "المعجم الطبي الموحد (ARABTERM)"
      contradicts:
        - text: "ازدياد مقابل augmentation يدلّ على مطلق الزيادة دون تخصيص بالنمو الطبيعي أو الإضافة التدريجية"
          source: "تحليل دلالي"
          conflict: "عموم الدلالة: ازدياد أعمّ من accretion/accumulation"


stage3_analysis:
  per_lemma:
    - lemma: "تَرَاكُم"
      decision: confirmed
      decision_reason: "لمّة راسخة في الاستعمال المعجمي والاصطلاحي، مثبتة في أكثر من عشرين معجماً تخصّصياً مقابل accumulation وaccretion. جذر ركم يدلّ على تجمّع الشيء بعضه فوق بعض، وصيغة تَفاعُل تفيد التدرّج."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الجانب الكمّي التراكمي: إضافة طبقات أو كمّيات متتالية بعضها فوق بعض، ويُستعمل في السياقات العلمية والاقتصادية والعامة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرَاكُم"

    - lemma: "تَكَدُّس"
      decision: removed
      decision_reason: "الأدلة المعجمية تُظهر أن تكدُّس يدلّ على التجمّع الكتلي (aggregation/stacking) والتراصّ المادي، لا على الزيادة التدريجية بالنمو أو الإضافة. جذر كدس في مقاييس اللغة لا يحمل معنى الزيادة أصلاً. الترجمات الاصطلاحية تقابل overstocked وaggregation وstacking، وكلها تختلف دلالياً عن accretion/accumulation بوصفه عملية زيادة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَنَامٍ"
      source: stage1
      decision: confirmed
      decision_reason: "مطابقة دلالية دقيقة: المعجم الموحد للهندسة المدنية يعرّف تنامٍ بـ«تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات» مقابل accretion، والمورد الحديث يذكره صراحةً مقابل accretion. صيغة تَفاعُل من جذر نمو تؤكد الزيادة العضوية التدريجية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الجانب العضوي والنموّي: الزيادة الناتجة عن نمو طبيعي أو إضافة جزيئات، أقرب إلى accretion منه إلى accumulation"
      actions:
        - command: create_entry
          params: {lemma: "تَنَامٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَزَايُد"
      source: stage1
      decision: removed
      decision_reason: "رغم وروده مقابل accretion في معجمَي الجيولوجيا والزلازل، فإن تزايُد أعمّ دلالياً ويُستعمل لمطلق الزيادة العددية (increment)، ولا يتضمّن بذاته معنى النمو العضوي أو الإضافة المادية الذي تتطلّبه المجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "تَعَاظُم"
      source: stage1
      decision: removed
      decision_reason: "ورد في مسرد المناخ مقابل accretion لكنه محصور في سياق تعاظم قطرات الماء بالتخثّر. دلالته العامة أقرب إلى الاستعظام والتفاقم منها إلى الزيادة بالإضافة التدريجية."
      evidence_assessment:
        case: mixed

    - lemma: "ازْدِيَاد"
      source: stage1
      decision: removed
      decision_reason: "يدلّ على مطلق الزيادة (augmentation) وهو أعمّ بكثير من المفهوم المطلوب. لا يتضمّن معنى التدرّج أو الإضافة الطبقية أو النمو العضوي."
      evidence_assessment:
        case: mixed


