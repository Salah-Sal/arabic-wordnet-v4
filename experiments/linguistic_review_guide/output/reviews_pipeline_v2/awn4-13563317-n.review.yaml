# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13563317-n (proliferation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «انتشار» عامة جداً (تشمل الانتشار الفيزيائي والبيولوجي) وقد لا تختص بالزيادة العددية السريعة"
      - "لمّة «تكاثر» تُستعمل غالباً في السياق البيولوجي (التكاثر الجنسي واللاجنسي) وقد يُلبس بين الدلالتين"
      - "اللمّتان بدون تشكيل في المجموعة الأصلية"
    observations: "المفهوم يدور حول الزيادة العددية المتسارعة، خاصةً في سياق الأسلحة الفتاكة (proliferation). هذا مفهوم سياسي-عسكري بالدرجة الأولى، له مصطلح مستقر في الخطاب العربي المعاصر. المجموعة الفائقة (hypernym) هي «تصاعد/زيادة/نمو»، فاللمّات ينبغي أن تدل على نوع خاص من الزيادة يتميز بالسرعة والكثرة."
  blind_candidates:
    - lemma: "تَكَاثُر"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَاعُل من جذر كثر، يدل على التزايد في العدد والتضاعف السريع، وهو أقرب لفظ عربي أصيل لمفهوم proliferation العددي"
    - lemma: "اسْتِشْرَاء"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من جذر شري، يدل على تفاقم الشيء وانتشاره بقوة، يُستعمل في سياق تفاقم الظواهر السلبية"
    - lemma: "تَفَشٍّ"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من جذر فشو، يدل على الاتساع والانتشار، ورد في المعجم الوسيط بمعنى انتشار المرض في القوم"
    - lemma: "انْتِشَار"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من جذر نشر، يدل على التوسع والامتداد والذيوع، وهو الأكثر شيوعاً في الخطاب السياسي المعاصر لترجمة proliferation"


stage2_evidence:
  per_lemma:
    - lemma: "انْتِشَار"
      confirm:
        - text: "«(1) «أ» الإخلاف (نب). «ب» تضاعُف: تكاثرٌ سريع (2) انتشار proliferation of nuclear weapons.»"
          source: "المورد الحديث (2008)"
        - text: "«propagation / spread»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«prevalence»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«النُّونُ وَالشِّينُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَتْحِ شَيْءٍ وَتَشَعُّبِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الجذري يدل على الفتح والتشعب، وهو أساس دلالة الامتداد والذيوع"
        - text: "«هو مصدر من باب الافتعال وهو عند الأطباء صيرورة الثقبة العنبية أوسع مما هي عليه في الطبع، ويطلق على نعوظ الذّكر وانتفاخ عصبة الدابة من تعب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة طبية قديمة مغايرة (التوسع الفيزيولوجي) تبيّن تعدد معاني اللفظ"

    - lemma: "تَكَاثُر"
      confirm:
        - text: "«proliferation»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تشعب، تكاثر = proliferation»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
        - text: "«(1) «ب» تضاعُف: تكاثرٌ سريع... proliferation»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْكَافُ وَالثَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ خِلَافَ الْقِلَّةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على ضد القلة مطلقاً، فالتكاثر يعني التزايد العددي"
        - text: "«عملية متميزة ومميزة، تتكون من عدد من المراحل وتستلزم العديد من الشروط، لكنها أساس استمرار الحياة وتطورها، إذ تمكن الكائنات الحية من إنتاج مثيلاتها»"
          source: "مسرد المناخ والبيئة (ALECSO)"
          addition: "الدلالة البيولوجية (reproduction) سائدة في المعاجم المتخصصة وقد تسبب لبساً مع دلالة الزيادة العددية"
        - text: "«multiplication»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "يُستعمل أيضاً بمعنى التضاعف العددي غير البيولوجي"

    - lemma: "تَفَشٍّ"
      confirm:
        - text: "«(تفشى) الشَّيْء اتَّسع وانتشر يُقَال تفشت القرحة اتسعت وتفشى الْخَبَر انْتَشَر وَالْمَرَض الْقَوْم وبهم انْتَشَر فيهم وعمهم»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
      contradicts:
        - text: "«(التفشي) (فِي علم الْقرَاءَات) انتشار الْهَوَاء فِي الْفَم عِنْد النُّطْق بالحرف وَله حرف وَاحِد وَهُوَ الشين»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "التفشي مصطلح تجويدي ثابت في علم القراءات، واستعماله بمعنى proliferation يُحدث اشتراكاً لفظياً غير مرغوب"
        - text: "«التّفشّي: لغة الاتساع. وفي اصطلاح القرّاء انتشار الريح في الفم حتى يتصل بمخرج الظاء المعجمة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "اصطلاح مستقر في التجويد، واللفظ يدل على الاتساع المكاني لا الزيادة العددية"

    - lemma: "اسْتِشْرَاء"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "انْتِشَار"
      decision: confirmed
      decision_reason: "لفظ عربي فصيح مستقر في الخطاب السياسي المعاصر بمعنى proliferation، والمورد الحديث ينص صراحة على «انتشار proliferation of nuclear weapons». جذره (نشر) أصيل يدل على الفتح والتشعب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد المكاني والجغرافي للظاهرة — أي ذيوعها وامتدادها إلى أماكن ومجالات جديدة — أكثر من التركيز على العدد المجرد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْتِشَار"

    - lemma: "تَكَاثُر"
      decision: confirmed
      decision_reason: "مصدر عربي أصيل من جذر كثر على وزن تَفَاعُل، يدل على التزايد العددي. المعجم الطبي الموحد يترجمه مباشرة بـ proliferation، والمورد الحديث يقرنه بـ «تكاثر سريع» في معنى proliferation."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد الكمّي — أي التضاعف والتزايد في العدد ذاته — وأصله البيولوجي يجعله أنسب حين يكون التكرار الذاتي سمةً للظاهرة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَاثُر"

    - lemma: "تَفَشٍّ"
      source: stage1
      decision: removed
      decision_reason: "لفظ تَفَشٍّ يدل على الاتساع والانتشار المكاني (خاصة للأمراض والأخبار)، لكنه مصطلح تجويدي ثابت في علم القراءات، مما يُحدث اشتراكاً لفظياً. كما أنه لا يركّز على الزيادة العددية السريعة بقدر ما يدل على الشيوع العام."
      evidence_assessment:
        case: mixed

    - lemma: "اسْتِشْرَاء"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أي أدلة معجمية في قاعدة البيانات. اللفظ غير مسجّل في المعاجم المتاحة، وإن كان قياسياً صرفياً فإنه غير مستعمل بمعنى الزيادة العددية السريعة."
      evidence_assessment:
        case: no_material


