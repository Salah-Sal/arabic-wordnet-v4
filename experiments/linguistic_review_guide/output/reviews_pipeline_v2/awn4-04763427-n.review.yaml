stage1_review:
  assessment:
    concerns:
      - "التعريف دائري: يستخدم 'محتملاً' و'احتمالاً' (مشتقان من الجذر ح-م-ل) لتعريف 'احتمالية' (من الجذر ذاته)، مما يُفقد التعريف قدرته التفسيرية"
      - "التعريف يخلط بين مستويين دلاليين: (أ) الاحتمالية بوصفها صفة مجردة قابلة للقياس الرياضي، و(ب) الحدث المحتمل بوصفه واقعة وقوع"
      - "المصدر المجرد 'احتمال' — الأكثر توثيقاً في المعاجم التقنية لترجمة probability — غائب عن قائمة اللمّات؛ وقد حالت قاعدة منع الدوران دون توليده كمرشح أعمى"
    observations: "تُعبِّر هذه المجموعة عن مفهوم رياضي-فلسفي متجذِّر في التراث العربي؛ فـ'الراجح' في الفلسفة هو ما ترجَّح وجوده على عدمه، و'الاحتمال' أصله الحمل والتحمُّل ثم امتدَّ دلالياً إلى التوقُّع والإمكان. اللمّتان الموجودتان — إن تأكَّدت صلاحيتهما بعد الاطلاع على الملف الكامل — تُغطيان هذا الحقل بصورة جيدة. قاعدة منع الدوران أفضت إلى إغفال 'احتمال' (المصدر المجرد) في التوليد الأعمى رغم سيادته في المصادر التقنية."
  blind_candidates:
    - lemma: "رُجْحَان"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر ر-ج-ح على وزن فُعْلان. في الفلسفة العربية 'الراجح' = ما ترجَّح وجوده على عدمه، فيكون الرجحان الصفةَ المجردة لهذا الترجيح. يُعبِّر عن معنى الغلبة الاحتمالية مقابل الندرة."
    - lemma: "تَرَجُّح"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من الجذر ر-ج-ح. 'ترجَّح الرأيُ عنده' = غلب على غيره. يُعبِّر عن الحالة الديناميكية لكون الشيء راجحَ الحدوث بين احتمالين."
    - lemma: "ظَنِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الجذر ظ-ن-ن بإضافة (-يَّة). في أصول الفقه 'الظني' يقابل 'القطعي'، وهو ما لم يبلغ اليقين. الظنية = الصفة المجردة لكون الشيء غير يقيني ومحتملاً."
    - lemma: "إِمْكَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الجذر م-ك-ن (إمكان + -يَّة). يُعبِّر عن كون الشيء ممكن الحدوث. يقترب من معنى الاحتمالية في السياقات التي يُقصد بها 'قرب الوقوع' لا مجرد 'إمكان الوقوع'."


stage2_evidence:
  per_lemma:

    - lemma: "أَرْجَحِيَّة"
      confirm:
        - text: "«أرجحية: احتمال حدوث حدث ما ضمن فئة أو صنف معين» — ترجمة: Likelihood"
          source: "معجم البيانات والذكاء الاصطناعي — SDAIA (2024)"
        - text: "«(1) الاحتمال (2) أرجحيّة (3) «أ» أمرٌ مُحتمَل. «ب» أمرٌ مُرَجَّح الحدوث. in all probability: على الأرجح» — ترجمة: probability"
          source: "المورد الحديث (2008)"
        - text: "«احتمال؛ توقُّع؛ إمكانيّة؛ ترجُّح؛ أرجحيّة» — ترجمة: likelihood"
          source: "المورد الحديث (2008)"
        - text: "«تقدير الأرجحية الأعلى: طريقة لتحديد قيم المعامِلات التي تزيد من احتمالية البيانات المرصودة» — ترجمة: Maximum Likelihood Estimation (MLE)"
          source: "معجم البيانات والذكاء الاصطناعي — SDAIA (2024)"

    - lemma: "احْتِمَالِيَّة"
      confirm:
        - text: "«احتمالية» — ترجمة: probability"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«تيار الاحتمالية» — ترجمة: probability current"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«احتمالية الافلات الرنيني» — ترجمة: resonance escape probability"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«احتماليـة: قواعد نوع عند تودوروف، وهي عند جُنيت (حافز / اعتباطية) بحكم أن كل خِطاب يُعدّ تركيباً احتمالياً» — ترجمة: likelihood"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«احتمال؛ توقُّع؛ إمكانيّة؛ ترجُّح؛ أرجحيّة» — ترجمة: likelihood"
          source: "المورد الحديث (2008)"

    - lemma: "رُجْحَان"
      contradicts:
        - text: "«رُجْحان» — ترجمة: preponderance"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الرجحان يُقابل preponderance (التفوق الكمي) لا probability (الاحتمالية الرياضية). الترجمة الموثَّقة تُثبت بُعده عن المجال الدلالي المقصود."
      expands:
        - text: "«رُجْحَان: من (ر ج ح) ثقل الشيء واكتمال العقل أو الرأي ورفع الشيء باليد لمعرفة ما ثقله»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الرجحان يتضمن معنى الثقل واكتمال الرأي؛ وهو قريب من الترجيح لكنه لا يُفيد الاحتمالية الرياضية المقيسة."
        - text: "«الراجح (فى الفلسفة) probable: ما ترجَّح وجوده على عدمه، أو صِدقُه على كذبه»"
          source: "المعجم الكبير"
          addition: "الراجح (الصفة) يُقابل probable، لكن مصدره رُجْحَان لا يُسكَّ مصطلحاً مستقلاً لـprobability في أي معجم تقني مستعمَل."

    - lemma: "تَرَجُّح"
      contradicts:
        - text: "«ترجُّح: في التصوير المساحي، دوران آلة التصوير أو جملة إحداثيات الصورة، إما حول محور الصورة وإما حول المحور الخارجي» — ترجمة: pitch; tip"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          conflict: "التَّرجُّح مُسكَّك في المصطلح التقني بمعنى pitch/tip (الميل الزاوي للآلة) لا بمعنى الاحتمالية."
      expands:
        - text: "«تَرَجَّحَ: تَهَزَّزَ وتَحَرَّك بينَ شَيْئَين»"
          source: "المعجم الكبير"
          addition: "الدلالة الأصلية هي التأرجح بين شيئين؛ قابلة للتأويل الاحتمالي مجازاً لكنها لا تُفيد الاحتمالية الرياضية مباشرةً."
        - text: "«(ترجح) تهزز وتحرك ويُقال ترجحت به الأرجوحة مالَت والرأي عنده غلب على غيره»"
          source: "المعجم الوسيط (رواية هوراماني)"
          addition: "'ترجَّح الرأيُ عنده' = غلب؛ قريب من الترجيح الاحتمالي، لكن المصدر لا يُرادف الاحتمالية."

    - lemma: "ظَنِّيَّة"
      expands:
        - text: "«ظَنِّيَّة: من (ظ ن ن) مؤنث ظني: نسبة إلى الظن: إدراك الذهن الشيء مع ترجيحه وقد يكون مع اليقين»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الظنية = كون الشيء مظنوناً مع ترجيح. مصطلح أصولي-إبستيمي، مجاور للاحتمالية المعرفية لكنه لا يُقابل probability الرياضية."
        - text: "«(ظَنَّ) الظَّاءُ وَالنُّونُ أُصَيْلٌ صَحِيحٌ يَدُلُّ عَلَى مَعْنَيَيْنِ مُخْتَلِفَيْنِ: يَقِينٍ وَشَكٍّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ظ-ن-ن يجمع اليقينَ والشكَّ معاً؛ ازدواجية تجعل الظنية مصطلحاً غير دقيق للاحتمالية القابلة للقياس."

    - lemma: "إِمْكَانِيَّة"
      expands:
        - text: "«احتمال؛ توقُّع؛ إمكانيّة؛ ترجُّح؛ أرجحيّة» — ترجمة: likelihood"
          source: "المورد الحديث (2008)"
          addition: "الإمكانية تظهر ضمن قائمة مترادفات likelihood، مما يُشير إلى استخدامها في هذا السياق. لكنها ليست مدخلاً مستقلاً لـprobability في أي معجم متخصص."


stage3_analysis:
  per_lemma:

    - lemma: "أَرْجَحِيَّة"
      decision: confirmed
      decision_reason: "أَرْجَحِيَّة مصطلح مسكوك ومُوثَّق في معاجم تقنية حديثة معتمدة (SDAIA 2024، المورد الحديث 2008) لترجمة likelihood/probability. مشتق من الجذر ر-ج-ح على الوزن أَفْعَلِيَّة، جارٍ على قياس الاشتقاق العربي. لا تعارض معجمي. التشكيل الحالي كامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُركِّز على الجانب التقابلي-النسبي للاحتمالية: أرجحية حدث ما ضمن فئة أو تصنيف (likelihood بمعناه الإحصائي الدقيق). تسود في سياقات الذكاء الاصطناعي ومعالجة البيانات. أقل شيوعاً من 'احتمالية' في الرياضيات النظرية العامة."

    - lemma: "احْتِمَالِيَّة"
      decision: confirmed
      decision_reason: "احتمالية مُوثَّقة في عشرات المعاجم التقنية (الهندسة، الفيزياء، الرياضيات، اللسانيات، المعلوماتية) لترجمة probability. مشتقة من مصدر الفعل الثامن اِحْتِمَال + المصدر الصناعي -يَّة. التشكيل الحالي ناقص: الألف الأولى في اِحْتِمَال هي همزة وصل (Form VIII) تأخذ الكسرة في حالة النطق المنفرد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الأعم والأشمل للاحتمالية الرياضية كصفة مجردة. يُستخدم في نظرية الاحتمالات والإحصاء والفيزياء والهندسة دون تقييد بسياق أو تصنيف. يُعبِّر عن المفهوم الكلي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِحْتِمَالِيَّة"

    - lemma: "رُجْحَان"
      source: stage1
      decision: removed
      decision_reason: "الرجحان في المعاجم التقنية يُقابل preponderance (المعجم الطبي الموحد)، لا probability الرياضية. وإن كان الراجح (الصفة) يُقابل probable في الفلسفة، فإن المصدر المجرد رُجْحَان لا يُسكَّك مصطلحاً مستقلاً للاحتمالية في أي معجم متخصص. لا يجتاز اختبار التثبيت المعجمي."
      evidence_assessment:
        case: mixed

    - lemma: "تَرَجُّح"
      source: stage1
      decision: removed
      decision_reason: "التَّرجُّح مُسكَّك في الاستشعار عن بعد بمعنى pitch/tip (الميل الزاوي). الدلالة الأصلية (التأرجح) مجاورة للاحتمالية لكنها لا تُرادفها. لا يُستخدم في أي معجم تقني لترجمة probability."
      evidence_assessment:
        case: mixed

    - lemma: "ظَنِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "الظنية مصطلح أصولي-إبستيمي يُعبِّر عن غياب اليقين (ظني مقابل قطعي)، لا عن درجة الاحتمال القابلة للقياس الرياضي. الجذر ظ-ن-ن يحمل اليقينَ والشكَّ معاً (ابن فارس)، مما يُضعف دقته كمصطلح للاحتمالية. لا ترد في أي معجم تقني بمعنى probability."
      evidence_assessment:
        case: no_material

    - lemma: "إِمْكَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الإمكانية تُقابل possibility (إمكان الوقوع)، وهي مختلفة جوهرياً عن probability (احتمالية الوقوع المقيسة). الفرق: الإمكانية ثنائية (ممكن/مستحيل)، أما الاحتمالية فمتدرجة (0–1). لا مدخل مستقل لها بهذا المعنى في المعاجم المتخصصة."
      evidence_assessment:
        case: no_material


