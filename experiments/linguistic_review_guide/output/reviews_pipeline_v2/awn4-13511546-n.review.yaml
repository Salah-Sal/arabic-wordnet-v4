# مراجعة المجموعة الترادفية awn4-13511546-n
# growth — a progression from simpler to more complex forms
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «نمو» بدون تشكيل كامل"
      - "المجموعة تحتوي على لمّة واحدة فقط — مفهوم الارتقاء من البسيط إلى المعقد يحتاج ترادفات إضافية"
      - "تعريف المجموعة العربي قريب من الترجمة الحرفية للتعريف الإنجليزي"
    observations: "المفهوم المقصود هو النمو بمعنى الارتقاء التدريجي من أشكال أبسط إلى أشكال أكثر تعقيداً، وهو أقرب إلى دلالة النشوء والتطور منه إلى النمو الحجمي المحض. الفائق المعجمي (hypernym) يتضمن ارتقاء وتطور ونماء، مما يدل على أن المجموعة الحالية تحتاج إلى تمييز دقيق عن فائقها."
  blind_candidates:
    - lemma: "نُشُوء"
      generation_method: ishtiqaq
      justification: "مصدر نَشَأَ على وزن فُعُول، يدل على الارتفاع والبروز التدريجي من حال إلى حال أرقى. يُستخدم في سياق التطور البيولوجي والفكري للدلالة على الانتقال من البسيط إلى المعقد."
    - lemma: "تَنَامٍ"
      generation_method: ishtiqaq
      justification: "مصدر تَنَامَى على وزن تَفَاعُل من الجذر ن م و، يفيد التدرج والتراكم في النمو، أي أن النمو يحدث بصورة متصاعدة ومتتابعة."
    - lemma: "تَدَرُّج"
      generation_method: ishtiqaq
      justification: "مصدر تَدَرَّجَ على وزن تَفَعُّل من الجذر د ر ج، يفيد الانتقال المرحلي من حال إلى حال، ويناسب دلالة الارتقاء من الأبسط إلى الأعقد."
    - lemma: "تَرَقٍّ"
      generation_method: ishtiqaq
      justification: "مصدر تَرَقَّى على وزن تَفَعُّل من الجذر ر ق ي، يفيد الصعود التدريجي والارتقاء من مرتبة إلى أخرى أعلى."

stage2_evidence:
  per_lemma:
    - lemma: "نُمُوّ"
      confirm:
        - text: "«النمو: هو ازدياد حجم الجسم، بما ينضم إليه ويداخله في جميع الأقطار، نسبة طبيعية، بخلاف السمن والورم»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«النُّمُوُّ: ازدياد جسم باتصال جسم آخر بِهِ مداخلا فِي أَجْزَائِهِ فِي الأقطار على نِسْبَة طبيعية»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«نَمَا الشَّيْءُ يَنْمُوْ نُمُوّا زادَ وَكَثُرَ»"
          source: "المحكم والمحيط الأعظم لابن سيده"
        - text: "«نمو: عملية نمو أو تطور، مع زيادة في الحجم أو في عدد»"
          source: "مسرد المناخ والبيئة"
        - text: "«نُمُوّ: تطور متتابع ومتناسق يلحق الأداء بفضل مجموعة من الأساليب والإجراءات»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي"
      expands:
        - text: "«نُمُوّ: ١- مصدر نما. ٢- (حي) ازدياد حجم الجسم بما ينضمّ إليه نسبة طبيعيّة. ٣- (نف) تغيُّر مطّرد في الكائن الحيّ يتّجه به نحو تمام النُّضج»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "المعجم المعاصر يوسّع الدلالة لتشمل التغير المطّرد نحو النضج، وهو أقرب لمفهوم المجموعة"
        - text: "«النّموّ: هو والذّبول من أنواع الحركة الكمية، وفسّر بازدياد حجم الأجزاء الأصلية للجسم بما ينضمّ إليه ويداخله في جميع الأقطار على نسبة طبيعية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التهانوي يصنّف النمو ضمن الحركة الكمية ويفصّل بينه وبين السمن والورم تفصيلاً دقيقاً"
    - lemma: "نُشُوء"
      confirm:
        - text: "«(١) نُموّ؛ نشوء (٢) شيء تامّ»"
          source: "المورد الحديث (2008) — مدخل upgrowth"
        - text: "«(١) «أ» نماء؛ نموّ. «ب» تطوّر. «ج» نشوء. «د» ازدياد»"
          source: "المورد الحديث (2008) — مدخل growth"
        - text: "«(١) «أ» تحوّل. «ب» نموّ. «ج» تقدّم. «د» تطوّر... (٤) «أ» نشوء. «ب» النُّشوء (أح). «ج» نظرية النُّشوء (أح)»"
          source: "المورد الحديث (2008) — مدخل evolution"
      expands:
        - text: "«(نَشَأَ) النُّونُ وَالشِّينُ وَالْهَمْزَةُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي شَيْءٍ وَسُمُوٍّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ن ش أ يدل أصالةً على الارتفاع والسمو، وهو مطابق لمفهوم الارتقاء من البسيط إلى المعقد"
    - lemma: "تَنَامٍ"
      evidence_status: "no_material_found"
    - lemma: "تَدَرُّج"
      evidence_status: "no_material_found"
    - lemma: "تَرَقٍّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "نُمُوّ"
      decision: confirmed
      decision_reason: "لمّة أصيلة مؤصّلة في المعاجم الكلاسيكية والمعاصرة. المعنى الأصلي يركّز على الازدياد الحجمي، لكنّ المعاجم المعاصرة توسّع الدلالة لتشمل التغيّر المطّرد نحو النضج. تحتاج إلى إضافة التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُمُوّ"

    - lemma: "نُشُوء"
      source: stage1
      decision: confirmed
      decision_reason: "نُشُوء مصطلح مسكوك مؤصّل في المعاجم، يُستخدم في سياق التطور البيولوجي والعلمي. المورد الحديث يقرنه بالنمو والتطور صراحةً. ابن فارس يؤكد أن الجذر ن ش أ يدل على الارتفاع والسمو، وهو مطابق لمفهوم الارتقاء التدريجي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نُشُوء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَنَامٍ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تدعم هذه الصيغة بوصفها مصطلحاً مستقلاً. وزن تَفَاعُل من ن م و ليس مسكوكاً في المعاجم المرجعية."

    - lemma: "تَدَرُّج"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تدعم استخدامه بمعنى النمو من البسيط إلى المعقد. التدرج أقرب إلى الانتقال المرحلي العام منه إلى النمو البيولوجي أو التطوري."

    - lemma: "تَرَقٍّ"
      source: stage1
      decision: removed
      decision_reason: "جذره ر ق ي مشترك مع «ارتقاء» الموجودة في المجموعة الفائقة (hypernym)، فإضافته تخلق تداخلاً دلالياً مع الفائق. كما لم تُوجد أدلة معجمية تخصّصه بمعنى النمو التطوري."

