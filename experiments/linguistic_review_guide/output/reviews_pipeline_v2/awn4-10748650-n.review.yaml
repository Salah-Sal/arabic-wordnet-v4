# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10748650-n
# one who tries — trier / attempter / essayer
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «من يحاول» دائري؛ يُعرِّف اسم الفاعل بفعله دون إضافة فصل نوعي"
      - "المجموعة تحتوي على لمّة واحدة فقط (مُحَاوِل)، وهو قليل لمفهوم عام كهذا"
    observations: >
      المفهوم يدلّ على شخص يبذل جهداً لإنجاز أمر ما دون يقين بالنجاح.
      الرتبة الفوقية (عَامِل / فَاعِل) تؤكد أنه نوع من العاملين.
      التعريف الإنجليزي بسيط ومباشر «one who tries» ويقابله في العربية
      عدة اشتقاقات من جذور مختلفة: حول (محاولة)، جرب (تجربة)، سعي (مسعى).
      التعريف العربي الحالي ضعيف بنيوياً لأنه يعيد الفعل نفسه.
  blind_candidates:
    - lemma: "مُجَرِّب"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من جَرَّبَ (فعَّل) على وزن مُفَعِّل، يدلّ على من يختبر الأشياء
        ويبلوها. ورد في المورد الحديث ترجمةً لـ trier.
    - lemma: "مُخْتَبِر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من اخْتَبَرَ (افتعل) على وزن مُفْتَعِل، يدلّ على من يبلو الشيء
        ويمتحنه. الجذر خ ب ر يفيد الاختبار والمعرفة بالتجربة.
    - lemma: "مُتَصَدٍّ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من تَصَدَّى (تفعَّل) على وزن مُتَفَعِّل، يدلّ على من يتعرّض
        لأمر ما ويسعى إليه. الجذر ص د ي يفيد المواجهة والتعرّض.
    - lemma: "بَاذِل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من بَذَلَ على وزن فاعِل، يدلّ على من يبذل وسعه وجهده
        في تحقيق غاية. الجذر ب ذ ل يفيد بذل الجهد والمال.


stage2_evidence:
  per_lemma:
    - lemma: "مُحَاوِل"
      confirm:
        - text: "«(1) ‹أ›, فا try. وبخاصة: ‹ب› القاضي. ‹ج› الفاحص. ‹د› المُجرِّب. ‹هـ› المُحاوِل»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْحِيلَةُ وَالْحَوِيلُ وَالْمُحَاوَلَةُ مِنْ طَرِيقٍ وَاحِدٍ، وَهُوَ الْقِيَاسُ الَّذِي ذَكَرْنَاهُ; لِأَنَّهُ يَدُورُ حَوَالَيِ الشَّيْءِ لِيُدْرِكَهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "المحاولة من أصل حول (التحرّك في دور)، فالمحاوِل يدور حول الشيء ليدركه"

    - lemma: "مُجَرِّب"
      confirm:
        - text: "«(1) ‹أ›, فا try. وبخاصة: ‹ب› القاضي. ‹ج› الفاحص. ‹د› المُجرِّب. ‹هـ› المُحاوِل»"
          source: "المورد الحديث (2008)"
        - text: "«جرّب، عاير، قدّر» (ترجمة essayer)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      contradicts:
        - text: "«رجل عرف الأمور وخبرها»"
          source: "المعجم الكبير"
          conflict: "المعنى السائد لمُجَرِّب هو صاحب الخبرة والدراية لا من يحاول فحسب"
        - text: "«برنامجٌ يجرِّب نموذجاً من العتاديات أو البرمجيات بتنفيذ مجموعة كبيرة من العمليات عليه» (exerciser)"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "معنى تقني مختلف: مُختبِر برمجيات لا مُحاوِل عام"
      expands:
        - text: "«مُجَرِّب — الجذر: ج ر ب — مُجَرَّب ومُجَرِّب بفتح الراء وكسرها فصيحتان؛ لأنه يقال: جَرَّبتْه الأمورُ وجرَّبها فهو مجرَّب ومجرِّب»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "مُجَرِّب (بكسر الراء) اسم فاعل صحيح وفصيح"

    - lemma: "مُخْتَبِر"
      evidence_status: "no_material_found"

    - lemma: "مُتَصَدٍّ"
      evidence_status: "no_material_found"

    - lemma: "بَاذِل"
      evidence_status: "no_material_found"

    - lemma: "مُجْتَهِد"
      contradicts:
        - text: "«هُوَ الْفَقِيه المستفرغ لوسعه لتَحْصِيل ظن بِحكم شَرْعِي وَله شُرُوط مقررة فِي علم أصُول الْفِقْه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "مُجْتَهِد مصطلح فقهي متخصص يدلّ على الفقيه الباذل وسعه في الأحكام الشرعية، لا على مجرّد من يحاول"


stage3_analysis:
  per_lemma:
    - lemma: "مُحَاوِل"
      decision: confirmed
      decision_reason: >
        اسم فاعل مباشر من حاوَلَ (فاعَل)، وهو المقابل الطبيعي الدقيق لـ trier/attempter.
        مؤيَّد بالمورد الحديث ومقاييس اللغة. جذره (حول) يفيد الدوران حول الشيء لإدراكه،
        وهو أصل المحاولة والحيلة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على من يسعى إلى فعل شيء ما ببذل الجهد والتكرار دون يقين بالنتيجة، وهو الأعمّ والأشمل بين المرادفات المحتملة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَاوِل"

    - lemma: "مُجَرِّب"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وروده في المورد الحديث ترجمةً لـ trier، فإن المعنى السائد في المعاجم العربية
        لمُجَرِّب هو «صاحب الخبرة والدراية» أو «المختبِر المتخصص»، لا «من يحاول».
        إدراجه سيخلط بين المحاولة والتجربة/الخبرة. كما أن مُجَرَّب (بفتح الراء) أشيع
        وأقرب للمعنى المقصود في أكثر السياقات.
      evidence_assessment:
        case: mixed

    - lemma: "مُخْتَبِر"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تدعم استخدامه بمعنى «من يحاول».
        معناه الشائع «من يختبر» أي يفحص ويمتحن، وهو أقرب إلى الفحص والاختبار
        منه إلى المحاولة المجردة.
      evidence_assessment:
        case: no_material

    - lemma: "مُتَصَدٍّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية. معناه «من يتعرّض لأمر ويواجهه»، وفيه دلالة المواجهة
        والتصدّي أكثر من مجرّد المحاولة. ليس مرادفاً دقيقاً لـ trier.
      evidence_assessment:
        case: no_material

    - lemma: "بَاذِل"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تربطه بمعنى المحاولة. معناه «من يبذل» ويستلزم مفعولاً
        (باذل جهده، باذل ماله) ولا يُستعمل مطلقاً بمعنى «من يحاول».
      evidence_assessment:
        case: no_material


