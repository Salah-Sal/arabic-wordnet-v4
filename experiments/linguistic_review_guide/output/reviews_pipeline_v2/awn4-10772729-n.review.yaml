# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10772729-n (Victorian)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «فِيكْتُورِيّ» معرَّبة من الإنجليزية Victorian، والمفهوم مرتبط بعَلَم أجنبي خاص (الملكة فيكتوريا) فلا يمكن اشتقاق بديل عربي صرف"
      - "المُدَرَّج الأعلى (hypernym) هو awn4-09786620-n بتعريف «شخص يعمل ويُنجِز الأمور» وهو لا يناسب مفهوم «شخص عاش في عهد ملكة»؛ الأنسب أن يكون المُدَرَّج الأعلى «شخص» (person) لا «عامل/فاعل»"
      - "المجموعة تحتوي لمّة واحدة فقط، وهو متوقَّع لمفهوم ثقافي أجنبي بحت"
    observations: "المفهوم منسوب إلى الملكة فيكتوريا ملكة بريطانيا (١٨٣٧-١٩٠١)، وهو مفهوم تاريخي ثقافي غربي لا نظير عربي أصيل له. اللجوء إلى التعريب هو الخيار الوحيد المتاح لأن المصطلح مشتقّ من عَلَم أعجمي لا يقبل الترجمة ولا المجاز ولا الاشتقاق من جذر عربي. المورد الحديث (٢٠٠٨) يوثّق المصطلح بصيغتين: فيكتوريّ (صفة) والفيكتوريّ (اسم)."
  blind_candidates:
    - lemma: "فِيكْتُورِيّ"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي Victorian بنسبة عربية (-يّ) إلى العَلَم فيكتوريا، وهو النمط المعتمد في المعاجم العربية الحديثة للنِّسَب إلى الأعلام الأجنبية"
    - lemma: "فِكْتُورِيّ"
      generation_method: taarib
      justification: "صيغة تعريب بديلة بدون مدّ الياء (فِكْتُوريّ بدل فِيكْتُوريّ)، تُستعمل في بعض المعاجم الطبية العربية"
    - lemma: "فِيكْتُورِيَانِيّ"
      generation_method: taarib
      justification: "تعريب يحافظ على اللاحقة الإنجليزية الكاملة -ian قبل ياء النسبة العربية، لكنه أثقل صوتياً ولا يُستعمل في المعاجم المعتمدة"
    - lemma: "ابْنُ العَصْرِ الفِيكْتُورِيّ"
      generation_method: tarkib
      justification: "مركب إضافي يصف المنتسب إلى العصر الفيكتوري، لكنه عبارة وصفية حرة وليس مصطلحاً مسكوكاً ثابتاً"

stage2_evidence:
  per_lemma:
    - lemma: "فِيكْتُورِيّ"
      confirm:
        - text: "«(1) فيكتوريّ: منسوب إلى الملكة فيكتوريا الإنكليزية (1837-1901) (2) الفيكتوريّ: أحد أبناء عصر الملكة فيكتوريا.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«فيكتوريا — عن اللاتينية بمعنى زهرة البنفسج.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "أصل الاسم اللاتيني وعلاقته بزهرة البنفسج"
    - lemma: "فِكْتُورِيّ"
      expands:
        - text: "«الفِكْتوريَّة: «أ» مركبة أو سيّارة مكشوفة. «ب» نبات أميركيّ مائيّ.»"
          source: "المورد الحديث (2008)"
          addition: "الصيغة فِكْتوريّة (بدون مدّ الياء) موجودة لكن بدلالة مختلفة (مركبة/نبات)، لا بدلالة النسبة إلى العصر"
    - lemma: "فِيكْتُورِيَانِيّ"
      evidence_status: "no_material_found"
    - lemma: "ابْنُ العَصْرِ الفِيكْتُورِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "فِيكْتُورِيّ"
      decision: confirmed
      decision_reason: "المصطلح موثّق في المورد الحديث (٢٠٠٨) بتعريفين: صفةً واسماً. الصيغة الاسمية «الفيكتوريّ» تطابق تعريف المجموعة (شخص عاش في عهد الملكة فيكتوريا). التعريب مقبول لأن المصطلح مشتقّ من عَلَم أعجمي لا بديل عربي أصيل له."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِيكْتُورِيّ"
    - lemma: "فِكْتُورِيّ"
      source: stage1
      decision: removed
      decision_reason: "الصيغة بدون مدّ الياء (فِكْتُوريّ) لم تُوثَّق في المعاجم بدلالة النسبة إلى العصر الفيكتوري. الشواهد الموجودة تخصّ «الفِكْتوريّة» بمعنى مركبة أو نبات، وهي دلالة مختلفة تماماً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "فِيكْتُورِيَانِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على هذه الصيغة. هي أثقل صوتياً ولا حاجة إليها مع وجود «فِيكْتُوريّ» الموثّقة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "ابْنُ العَصْرِ الفِيكْتُورِيّ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً مسكوكاً. يمكن إبدال «ابن» بـ«أحد أبناء» أو «من أهل» فتبقى مفهومة، مما يثبت أنها ليست وحدة معجمية ثابتة (فشلت في اختبار السَّكّ)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

