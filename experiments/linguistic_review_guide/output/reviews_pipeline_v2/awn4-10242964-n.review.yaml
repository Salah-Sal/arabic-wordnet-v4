# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10242964-n (jockey)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «خبير» تعني العالم ذا الخبرة ولا علاقة لها بتشغيل المركبات أو الآلات"
      - "اللمّة «مُشَغِّل» مطابقة للمّة في المجموعة الأعلى (hypernym) awn4-10398111-n مما يُلغي التمايز بين المستويَيْن"
      - "التعريف العربي «مشغل لمركبة أو آلة أو جهاز ما» يكاد يطابق تعريف المجموعة الأعلى"
    observations: "المفهوم الإنجليزي jockey بمعنى المشغّل غير الرسمي للآلات مفهوم عامّي إنجليزي لا يقابله مصطلح عربي فصيح مستقل. الأقرب هو التعريب «جُوكِي» المثبت في المورد الحديث بمعنى السائق والقائد والمُشَغِّل. اللمّتان الحاليتان إحداهما خاطئة (خبير) والأخرى مكرّرة مع المستوى الأعلى (مُشَغِّل)."
  blind_candidates:
    - lemma: "سَائِس"
      generation_method: majaz
      justification: "من جذر س-و-س، معناه الأصلي رائض الدواب ومدربها، يمكن توسيعه مجازياً ليشمل من يُحكم التعامل مع المركبات والآلات"
    - lemma: "مُتَحَكِّم"
      generation_method: ishtiqaq
      justification: "من جذر ح-ك-م على وزن مُتَفَعِّل، يدل على من يسيطر على جهاز أو آلة ويتحكم في تشغيلها"
    - lemma: "قَائِد"
      generation_method: ishtiqaq
      justification: "من جذر ق-و-د على وزن فاعل، يدل على من يقود مركبة أو يسوقها، مثبت في المورد الحديث مقابلاً لـ jockey"
    - lemma: "جُوكِي"
      generation_method: taarib
      justification: "تعريب مباشر للفظة الإنجليزية jockey، مثبت في المورد الحديث (2008) بمعنى فارس السباق والسائق والمُشَغِّل"

stage2_evidence:
  per_lemma:
    - lemma: "خَبِير"
      contradicts:
        - text: "«اسم من أسماء الله عز وجل: العالم بما كان وبما يكون ذو الخِبْرة الذي يُخْبِرُ الشئَ بعِلْمِهِ المُخْبِر الحَرَّاث النبات العُشْب الوبر نُسالة الشعر زَبَدُ أفواه الإبل»"
          source: "المعجم الوسيط"
          conflict: "الخبير يعني العالم ذا الخبرة والمعرفة، لا المشغّل أو السائق"
        - text: "«من أسماءِ الله الحُسْنَى, فهو العالِم بما كان وما يكونُ. وهو العليمُ بظواهر الأشياءِ وبِبَواطِنِها العالمُ بالله تعالى, بِمَعْرِفَةِ أسمائه وصفاته المُتَمَكِّنُ مِن الأخبار بما عَلِمَهُ الذي يَخْبُرُ الشيءَ بِعِلْمِهِ الفَقِيه»"
          source: "المعجم الكبير"
          conflict: "لا علاقة بتشغيل الآلات أو المركبات"
      expands:
        - text: "«الْخَاءُ وَالْبَاءُ وَالرَّاءُ أَصْلَانِ: فَالْأَوَّلُ الْعِلْمُ، وَالثَّانِي يَدُلُّ عَلَى لِينٍ وَرَخَاوَةٍ وَغُزْرٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر خ-ب-ر يدور على العلم واللين، لا على التشغيل أو السياقة"

    - lemma: "مُشَغِّل"
      confirm:
        - text: "«شركة تتولّى تشغيل مُنشأة تقنية»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«(2) السائق؛ القائد؛ المُشَغِّل» (ضمن مدخل jockey)"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الشِّينُ وَالْغَيْنُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الْفَرَاغِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ش-غ-ل يدل على الانشغال بشيء والعمل فيه"

    - lemma: "سَائِس"
      confirm:
        - text: "«رائض الدواب ومدربُها»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«رائِضُ الدَّوابِّ ومُدَرِّبُها»"
          source: "المعجم الكبير"
          conflict: "المعنى مقصور على الدواب لا يشمل المركبات والآلات الحديثة"
      expands:
        - text: "«سايس = Car attendant»"
          source: "مسرد الفن والتسلية والرياضة (ALECSO)"
          addition: "في الاستعمال العامي المعاصر يُطلق على خادم السيارات لا على مشغّلها"

    - lemma: "مُتَحَكِّم"
      evidence_status: "no_material_found"

    - lemma: "قَائِد"
      confirm:
        - text: "«برمجية خاصة ببطاقة ما (بطاقة الصوت أو الشبكة مثلا) تمكن من تشغيل تلك البطاقة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
      contradicts:
        - text: "«(2) السائق؛ القائد؛ المُشَغِّل» (ضمن مدخل jockey)"
          source: "المورد الحديث (2008)"
          conflict: "قائد في هذا السياق مرادف عام لسائق ومُشَغِّل، لا مصطلح مستقل للمفهوم"

    - lemma: "جُوكِي"
      confirm:
        - text: "«(1) الجُوْكيّ: فارس يمتهن ركوب الخيل في السِّباق (2) السائق؛ القائد؛ المُشَغِّل»"
          source: "المورد الحديث (2008)"
        - text: "«قبعة جوكي: قبعة خفيفة من القماش تتقدمها مظلة»"
          source: "مسرد صناعة النسيج (ALECSO)"

stage3_analysis:
  per_lemma:
    - lemma: "خَبِير"
      decision: removed
      decision_reason: "الخبير في جميع المعاجم العربية يعني العالم ذا الخبرة والمعرفة (من خ-ب-ر = العلم)، ولا يحمل أي دلالة على تشغيل المركبات أو الآلات. إدراجه خطأ ترجمي واضح."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُشَغِّل"
      decision: confirmed
      decision_reason: "مُشَغِّل مثبت في المعاجم المصطلحية بمعنى operator وورد في المورد الحديث ضمن ترجمة jockey. وإن تشارك مع المجموعة الأعلى فهو الأقرب عربياً لهذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على من يتولى تشغيل جهاز أو آلة أو مركبة فعلياً، وهو أعم من جُوكِي الذي يحمل ظلالاً من المهارة والاحتراف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُشَغِّل"

    - lemma: "سَائِس"
      source: stage1
      decision: removed
      decision_reason: "السائس في الفصحى مقصور على رائض الدواب ومدربها، وتوسيعه ليشمل الآلات استعمال عامي (سايس السيارة) غير مقبول في المعجم الفصيح."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُتَحَكِّم"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية، والمتحكم يدل على السيطرة والضبط لا على التشغيل المباشر، فهو مختلف دلالياً عن المفهوم المطلوب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "قَائِد"
      source: stage1
      decision: removed
      decision_reason: "القائد لفظ عام جداً يشمل القيادة العسكرية والإدارية والسياقة، ولا يختص بمفهوم المشغّل الماهر. استعماله المصطلحي في تقانة المعلومات (driver) مجال مختلف."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "جُوكِي"
      source: stage1
      decision: confirmed
      decision_reason: "مثبت في المورد الحديث (2008) بمعنى السائق والقائد والمُشَغِّل مقابلاً للإنجليزية jockey. التعريب مقبول لأن اللفظة ذات صيغة عالمية ولا بديل فصيح دقيق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يحمل ظلال المهارة والاحتراف في التعامل مع الآلات أو المركبات، مستعار من عالم سباق الخيل"
      actions:
        - command: create_entry
          params: {lemma: "جُوكِي", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

