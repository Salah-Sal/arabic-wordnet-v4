# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-87779642-n
# التعريف: شخص يتلقى التوجيه والإرشاد من مرشد
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «مُتَلَقِّي التَّوْجِيه» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ يمكن إبدال «التوجيه» بـ«الإرشاد» أو «النصح» دون تغيّر في المعنى، فتفشل في اختبار السكّ"
      - "المفهوم (mentee/protégé) قريب من مفهوم التلمذة والإرادة في التراث العربي لكنه يفتقر إلى مصطلح عربي مخصوص ومتداول"
    observations: "المجموعة تصف شخصاً يتلقّى التوجيه والإرشاد من مُرشد، وهو المفهوم المقابل لـ mentee أو protégé في الإنجليزية. الفعل «استرشد» يعطي اسم فاعل «مُسْتَرْشِد» وهو القرين الطبيعي لـ«مُرْشِد»، والثنائية مُرشِد/مُسْتَرْشِد متداولة في أدبيات التربية والإرشاد النفسي. أما «مُتَدَرِّب» فيركّز على تلقّي التدريب العملي أكثر من التوجيه. اللمّة الثانية «مُتَلَقِّي التَّوْجِيه» تبدو شرحاً للمفهوم لا مصطلحاً."
  blind_candidates:
    - lemma: "مُسْتَرْشِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «استرشد» على وزن مُسْتَفْعِل، وهو القرين الصرفي الطبيعي لـ«مُرْشِد»؛ يدلّ على طالب الرُّشد والتوجيه، ويُستعمل في أدبيات الإرشاد التربوي والنفسي"
    - lemma: "مُرِيد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «أراد» على وزن مُفْعِل؛ يُطلق في التراث الصوفي والعلمي على من يطلب العلم والتوجيه من شيخ أو أستاذ، فهو تابع يسعى وراء الإرشاد"
    - lemma: "صَنِيعَة"
      generation_method: majaz
      justification: "الصنيعة في الأصل: من اصطنعه الرجل فأحسن إليه وربّاه وتعهّده؛ وبالمجاز يُطلق على من يُرعى ويُوجَّه من قِبل كبير أو مُرشد، ويقابل protégé"
    - lemma: "تِلْمِيذ"
      generation_method: ishtiqaq
      justification: "من «تَلْمَذَ»؛ يُطلق على خادم الأستاذ من أهل العلم أو الفنّ أو الحرفة وطالب العلم، وهو أقرب المرادفات التراثية لمفهوم المتعلّم تحت إشراف"


stage2_evidence:
  per_lemma:
    - lemma: "مُتَدَرِّب"
      confirm:
        - text: "«الشخص الذي يتلقى تدريبا في تخصص أو تكوين أو في عمل معين.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«مُتَدَرِّب» — translation_en: trainee"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      expands:
        - text: "«متدرب حرفيّ، متعلّم» — translation_en: apprentice"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 2 (1999)"
          addition: "يوسّع الاستعمال ليشمل التدرّب على الحِرَف"

    - lemma: "مُتَلَقِّي التَّوْجِيه"
      evidence_status: "no_material_found"

    - lemma: "مُسْتَرْشِد"
      expands:
        - text: "«المُسْتَرْشِد بالله: لقب الخليفة العباسى الفضل بن أحمد بن المقتدى»"
          source: "المعجم الكبير"
          addition: "ورد اسم فاعل كعلم فقط، لكن الوزن (مُسْتَفْعِل) منتج ومتداول في الاستعمال الحديث كاسم عام"

    - lemma: "مُرِيد"
      confirm:
        - text: "«المُرِيد؛ التابع؛ التلميذ (2) الحَواريّ (نص).» — translation_en: disciple"
          source: "المورد الحديث (2008)"

    - lemma: "صَنِيعَة"
      confirm:
        - text: "«المَحْمِيّ؛ الصنيعة: شخص تحت حماية أو رعاية متنفِّذٍ أو ذي سلطان.» — translation_en: protégé"
          source: "المورد الحديث (2008)"

    - lemma: "تِلْمِيذ"
      confirm:
        - text: "«(التلميذ) خَادِم الْأُسْتَاذ من أهل الْعلم أَو الْفَنّ أَو الحرفة وطالب الْعلم وَخَصه أهل الْعَصْر بالطالب الصَّغِير (ج) تلاميذ وتلامذة»"
          source: "المعجم الوسيط"
        - text: "«خادمُ الأستاذ من أهل العِلم أو الفنِّ أو الحِرْفَة طالبُ العِلم , وخَصَّه أهلُ العَصْر بالطالب الصغير»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«وَخَصه أهل الْعَصْر بالطالب الصَّغِير»"
          source: "المعجم الوسيط"
          conflict: "التلميذ في الاستعمال المعاصر يُخصّ بالطالب الصغير في المدرسة، مما يُبعده عن مفهوم المتوجَّه (mentee) الذي قد يكون بالغاً في بيئة مهنية"


stage3_analysis:
  per_lemma:
    - lemma: "مُتَدَرِّب"
      decision: confirmed
      decision_reason: "لمّة مثبتة في عدة معاجم مصطلحية حديثة (القانون، الصيدلة، المهن) بمعنى «الشخص الذي يتلقى تدريباً في تخصص أو عمل»، وهي الأقرب دلالياً لمفهوم من يتلقى التوجيه والإرشاد في سياق مهني"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الجانب العملي التطبيقي من التلقّي؛ يُستعمل غالباً في السياقات المهنية والحرفية"
      actions: []

    - lemma: "مُتَلَقِّي التَّوْجِيه"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست وحدة معجمية ثابتة؛ لم تُوثّق في أي معجم؛ تفشل في اختبار السكّ إذ يمكن إبدال «التوجيه» بـ«الإرشاد» أو «النصح» دون تغيّر في المعنى"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُسْتَرْشِد"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من «استرشد» على وزن مُسْتَفْعِل، وهو القرين الصرفي المقابل لـ«مُرْشِد» (mentor/guide) المذكور في التعريف؛ الوزن منتج والثنائية مُرشِد/مُسْتَرْشِد مستعملة في أدبيات الإرشاد التربوي والنفسي الحديثة؛ الجذر «رشد» يدلّ على استقامة الطريق وإصابة الحقّ"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على طلب الرُّشد والهداية من المُرشد؛ أدقّ دلالياً لمفهوم mentee لأنه يُشير إلى علاقة التوجيه تحديداً لا التدريب العملي"
      actions:
        - command: create_entry
          params:
            lemma: "مُسْتَرْشِد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُرِيد"
      source: stage1
      decision: removed
      decision_reason: "دلالته محصورة في السياق الصوفي (تابع الشيخ الطريقي) أو الديني؛ يحمل شحنة ثقافية خاصة تُبعده عن المفهوم العام للمتوجَّه في السياقات المهنية والتعليمية الحديثة"
      evidence_assessment:
        case: mixed

    - lemma: "صَنِيعَة"
      source: stage1
      decision: removed
      decision_reason: "دلالتها الأساسية على الحماية والرعاية السلطوية (protégé بالمعنى السياسي) لا على التوجيه والإرشاد العلمي أو المهني؛ تحمل إيحاءً سلبياً بالتبعية"
      evidence_assessment:
        case: mixed

    - lemma: "تِلْمِيذ"
      source: stage1
      decision: removed
      decision_reason: "دلالته أعمّ من المطلوب؛ يُطلق على كل طالب علم أو تابع أستاذ، وقد خصّه الاستعمال المعاصر بالطالب الصغير في المدرسة؛ له مجموعة ترادفية خاصة بمفهوم الطالب"
      evidence_assessment:
        case: mixed


