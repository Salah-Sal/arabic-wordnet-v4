# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10811530-n (worldling)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (دُنْيَوِيّ) صفة نسبة وليست اسمًا صريحًا للشخص، وإن كان استخدامها الاسمي مقبولًا قياسًا"
      - "المجموعة تحتوي لمّة واحدة فقط، وهي قليلة لمفهوم ثري في العربية"
      - "التعريف العربي ترجمة حرفية شبه كاملة للتعريف الإنجليزي"
    observations: "المفهوم (شخص مستغرق في شؤون الدنيا وملذاتها) مفهوم أصيل في الثقافة العربية الإسلامية، ويزخر التراث الديني والأدبي بألفاظ تدور حوله. النسبة إلى الدنيا (دنيوي/دنياوي) هي الصيغة الأكثر شيوعًا، لكنها تصف الصفة لا الشخص حصرًا. ثمّة ألفاظ تراثية مثل (دهري) تقترب من المفهوم لكن بدلالة عقدية أضيق."
  blind_candidates:
    - lemma: "دُنْيَوِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الدنيا على وزن فُعْلَوِيّ، تُستعمل استعمالَ الأسماء للدلالة على الشخص المنسوب إلى الدنيا وشؤونها، كما يُقال: مِصْرِيّ للشخص المصري"
    - lemma: "دَهْرِيّ"
      generation_method: majaz
      justification: "من الدَّهْر بمعنى الزمن الدنيوي، أُطلق في الاصطلاح العقدي على من ينكر الآخرة ويتعلق بالحياة الدنيا، فيه إزاحة دلالية من الزمن إلى التعلق بالزمني"
    - lemma: "ابْنُ الدُّنْيَا"
      generation_method: tarkib
      justification: "مركب إضافي شائع في الأدب العربي للدلالة على المنغمس في الدنيا، على نمط ابن السبيل وابن البلد"
    - lemma: "مُحِبُّ الدُّنْيَا"
      generation_method: tarkib
      justification: "مركب إضافي يدل على من غلب عليه حب الدنيا وشؤونها، شائع في النصوص الدينية والوعظية"


stage2_evidence:
  per_lemma:
    - lemma: "دُنْيَوِيّ"
      confirm:
        - text: "«(1) دُنيَوِيّ؛ أرضيّ (2) عاديّ؛ مُبْتذَل.»"
          source: "المورد الحديث (2008) — ترجمة mundane"
        - text: "«(1) أرضيّ (2) دُنْيَويّ (3) معقول؛ ممكِن.»"
          source: "المورد الحديث (2008) — ترجمة earthly"
        - text: "«(1) «أ» دنيوي secular interests. «ب» غير دينيّ secular drama...»"
          source: "المورد الحديث (2008) — ترجمة secular"
      expands:
        - text: "«(1) جَسَديّ؛ غير روحيّ (2) شهوانيّ (3) دُنْيَوِيّ؛ زمنيّ.»"
          source: "المورد الحديث (2008) — ترجمة carnal"
          addition: "يتوسع استعمال دنيوي ليشمل معنى الجسدي والزمني في مقابل الروحي"
        - text: "«وَسُمِّيَتِ الدُّنْيَا لِدُنُوِّهَا، وَالنِّسْبَةُ إِلَيْهَا دُنْيَاوِيٌّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يذكر صيغة دُنْيَاوِيّ بالألف كنسبة قياسية إلى الدنيا"

    - lemma: "دَهْرِيّ"
      contradicts:
        - text: "«المَنْسوبُ إلى الدَّهْرِ. غَلبَ على المُلْحِدِ الذى لا يُؤْمِن بالآخِرَة, يَقولُ ببقاءِ الدَّهْرِ, ولا يُؤْمِنُ بالبَعْثِ. (مُوَلَّد). مِنَ النَّاسِ: المُسِنُّ.»"
          source: "المعجم الكبير"
          conflict: "الدلالة المعجمية الغالبة للدهري هي الملحد المنكر للآخرة أو المسن، وليست المستغرق في ملذات الدنيا"
        - text: "«رجل دَهْريّ : ملحد لا يؤمن بالآخرة , يقول ببقاء الدهر»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يحصر المعنى في الإلحاد وإنكار الآخرة"
        - text: "«الدهري: من يَقُول بقدم الدَّهْر واستناد الْحَوَادِث إِلَيْهِ وَلكنه يَقُول بِوُجُود الْبَارِي تَعَالَى»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "مصطلح عقدي كلامي محدد لا يشمل مطلق الانغماس في الدنيا"
      expands:
        - text: "«(الدهري) الْقَدِيم المسن والحاذق»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
          addition: "للكلمة معنًى ثانٍ هو المسن الحاذق، بعيد عن المفهوم المطلوب"

    - lemma: "ابْنُ الدُّنْيَا"
      evidence_status: "no_material_found"

    - lemma: "مُحِبُّ الدُّنْيَا"
      confirm:
        - text: "«مُحِبّ الدُّنيا: المنغمس في شؤون الدُّنيا ومباهجها إلخ.»"
          source: "المورد الحديث (2008) — ترجمة worldling"
      expands:
        - text: "«مُحِبّ الدُّنيا: المنغمس في شؤون الدُّنيا ومباهجها إلخ.»"
          source: "المورد الحديث (2008)"
          addition: "هذا هو المقابل المباشر لـ worldling في المعجم ثنائي اللغة الأبرز"


stage3_analysis:
  per_lemma:
    - lemma: "دُنْيَوِيّ"
      decision: confirmed
      decision_reason: "نسبة إلى الدنيا مستعملة استعمالَ الأسماء للدلالة على الشخص المتعلق بالدنيا، وهي الصيغة الأكثر تداولًا في العربية المعاصرة. استعمال النسبة اسمًا للشخص قياسيّ في العربية (كقولك: مصريّ، عراقيّ). ثبت استعمالها في عدة معاجم ثنائية اللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الشخص المنسوب إلى الدنيا عمومًا دون تحديد وجه الانغماس، فهي الأعمّ والأشمل بين ألفاظ المجموعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُنْيَوِيّ"

    - lemma: "دَهْرِيّ"
      source: stage1
      decision: removed
      decision_reason: "الدلالة المعجمية المستقرة للدهري هي الملحد المنكر للآخرة القائل ببقاء الدهر (مصطلح عقدي)، أو المسنّ القديم. وهذا لا يطابق مفهوم المستغرق في ملذات الدنيا. الفرق جوهري: الدهري ينكر الآخرة عقديًّا، بينما worldling قد يؤمن بالآخرة لكنه منغمس في الدنيا عمليًّا."
      evidence_assessment:
        case: contradicts_only

    - lemma: "ابْنُ الدُّنْيَا"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي دليل معجمي يثبت هذا التعبير مدخلًا مستقلًا. وهو تعبير حرّ قابل للاستبدال (ابن الدنيا ← صاحب الدنيا ← رجل الدنيا) فيَفشل في اختبار السكّ ولا يصلح مصطلحًا معجميًّا ثابتًا."
      evidence_assessment:
        case: no_material

    - lemma: "مُحِبُّ الدُّنْيَا"
      source: stage1
      decision: removed
      decision_reason: "رغم وروده في المورد الحديث ترجمةً لـ worldling، فإنه يفشل في اختبار السكّ: يمكن إبدال (محب) بـ(عاشق) أو (هاوي) مع بقاء المعنى، مما يدل على أنه وصف حرّ لا مصطلح مسكوك. كذلك لم يُسجَّل مدخلًا مستقلًّا في أي معجم عربي-عربي."
      evidence_assessment:
        case: mixed


