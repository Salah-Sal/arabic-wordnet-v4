# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10646711-n
# sounding board — شخص تُستخدم ردود أفعاله كمؤشر على مدى القبول
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «صَدَى» استعمال مجازي غير مسجّل في المعاجم العربية بمعنى الشخص الذي يعكس ردود الأفعال"
      - "اللمّة «مُسْتَشَار لِقِيَاس الرَّأْي» عبارة وصفية حرة من أربع كلمات، لا تجتاز اختبار السَّكّ ولا اختبار التثبيت المعجمي"
      - "المفهوم (sounding board بمعنى الشخص) فجوة معجمية في العربية؛ لا يوجد مصطلح مفرد مسكوك لهذا المدلول"
    observations: >
      المجموعة تمثّل مفهوماً مجازياً إنجليزياً (sounding board = لوح الترنّم → شخص يُختبر عليه القبول).
      التعريف يدور حول شخصٍ تُتّخذ ردود أفعاله مقياساً لمدى قبول أمرٍ ما عند العامة.
      الفوقية المباشرة (عامل/فاعل) صحيحة: هو شخص يؤدي دوراً وظيفياً.
      التحدّي الأساسي أن العربية لا تمتلك مصطلحاً مفرداً شائعاً لهذا المفهوم التخصصي.
  blind_candidates:
    - lemma: "مِسْبَار"
      generation_method: majaz
      justification: >
        من جذر «سبر» بمعنى اختبار الأمر وتعرّف قدره. المِسْبَار أداة السَّبْر،
        يُستعمل مجازاً للشخص الذي يُسبَر به مدى القبول، على وزن مِفْعَال للأدوات.
    - lemma: "مِجَسّ"
      generation_method: majaz
      justification: >
        من جذر «جسس» بمعنى اللمس والتحسس. المِجَسّ أداة الجس (قرن الحشرة)،
        ويُستعمل في تعبير «مِجَسّ النبض» بمعنى ملاحظة تُلقى لاستطلاع آراء الآخرين.
        يُنقل مجازاً إلى الشخص الذي تُجسّ ردود أفعاله.
    - lemma: "مُسْتَطْلَع"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من «استطلع» على وزن مُسْتَفْعَل، أي الشخص الذي يُستطلَع رأيه
        لمعرفة مدى قبول أمرٍ ما. الاشتقاق منتظم والدلالة قريبة من المفهوم.
    - lemma: "مُخْتَبَر"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من «اختبر» على وزن مُفْتَعَل، أي الشخص الذي تُختبر ردود أفعاله.
        غير أن اللفظ مشترك مع «المختبر» بمعنى المعمل، مما يُضعف صلاحيته.


stage2_evidence:
  per_lemma:
    - lemma: "صَدَى"
      contradicts:
        - text: "«الصَّدَى: الذَّكَرُ مِنَ الْبُومِ. والصَّدَى: الدِّمَاغُ نَفْسُهُ. والصَّدَى: صَدَى الصَّوْتِ، وَهُوَ الَّذِي يُجِيبُكَ إِذَا صِحْتَ بِقُرْبِ جَبَلٍ. والصَّدَى: الرَّجُلُ الْحَسَنُ الْقِيَامِ عَلَى مَالِهِ. والصَّدَى: الْعَطَشُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "لا يذكر ابن فارس ولا غيره من المعجميين دلالة «الشخص الذي تُختبر ردود أفعاله» ضمن معاني صَدَى"
      expands:
        - text: "«الصَّدَى: الصَّوتُ بين الجَبَل ونحوِه يُجيبُكَ مثل صَوْتِكَ»"
          source: "كتاب العين للخليل بن أحمد"
          addition: "دلالة الارتداد الصوتي قد تُوظَّف مجازاً لمن يعكس ردود الأفعال"

    - lemma: "مُسْتَشَار لِقِيَاس الرَّأْي"
      contradicts:
        - text: "«(المستشار) العَلِيمُ الَّذِي يُؤْخَذُ رَأْيُهُ فِي أَمْرٍ هَامٍّ عِلْمِيٍّ أَوْ فَنِّيٍّ أَوْ سِيَاسِيٍّ أَوْ قَضَائِيٍّ أَوْ نَحْوِهِ»"
          source: "المعجم الوسيط"
          conflict: "المستشار يُؤخذ رأيه لخبرته لا لاختبار ردود أفعاله؛ العلاقة الدلالية مختلفة عن مفهوم sounding board"

    - lemma: "مِسْبَار"
      confirm:
        - text: "«السَّبْرُ: رَوْزُ الْأَمْرِ وَتَعَرُّفُ قَدْرِهِ. يُقَالُ خَبَرْتُ مَا عِنْدَ فُلَانٍ وَسَبَرْتُهُ. وَيُقَالُ لِلْحَدِيدَةِ الَّتِي يُعْرَفُ بِهَا قَدْرُ الْجِرَاحَةِ مِسْبَارٌ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«المِسْبارُ الفَضائِيّ Space probe: مركبةٌ غير آهلة بالإنسان. المِسْبار اللاسلكِيّ Radiosonde: جهازٌ لاسلكيّ مجهَّز بأجهزة لقياس الضغط الجوىّ»"
          source: "المعجم الكبير"
          conflict: "المسبار راسخ في الاستعمال الحديث كأداة فيزيائية/فضائية، ونقله إلى الشخص يُحدث لبساً"

    - lemma: "مِجَسّ"
      confirm:
        - text: "«اللّامس؛ الحاسّ؛ المتلمِّس. وبخاصة: «أ» المِجَسّ: قرن الحشرة. «ب» مِجَسّ النَّبْض: ملاحظة أو اقتراح يُلْقَى رغبةً في جسّ نبض الآخرين أو استطلاع آرائهم وأهدافهم»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«المِجَسّ: قرن الحشرة»"
          source: "المورد الحديث (2008)"
          conflict: "المِجَسّ يدل على الأداة أو الملاحظة المُلقاة، لا على الشخص نفسه"

    - lemma: "مُسْتَطْلَع"
      expands:
        - text: "«استطلاع الرأي»"
          source: "المعجم الموحد لمصطلحات الإعلام"
          addition: "مُسْتَطْلَع اسم مفعول منتظم من استطلع، لكنه يدل على كل من يُستطلع رأيه وليس خاصاً بمن تُتّخذ ردود أفعاله مقياساً"

    - lemma: "مُخْتَبَر"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "صَدَى"
      decision: confirmed
      decision_reason: >
        رغم عدم تسجيل هذا الاستعمال المجازي في المعاجم الكلاسيكية، فإن نقل صَدَى (ارتداد الصوت)
        إلى الشخص الذي يعكس ردود الأفعال مجازٌ شفاف ومفهوم. وهو يوازي المجاز الإنجليزي
        (sounding board → person). المفهوم فجوة معجمية حقيقية في العربية، وصَدَى أفضل
        الخيارات المتاحة من حيث الإيجاز والشفافية الدلالية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد الانعكاسي: الشخص بوصفه مرآة صوتية تعكس ردود الأفعال تلقائياً"
      actions: []

    - lemma: "مُسْتَشَار لِقِيَاس الرَّأْي"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة من أربع كلمات لا تجتاز اختبار السَّكّ (يمكن إبدال «لقياس» بـ«لاستطلاع»
        أو «لسبر» وتبقى العبارة صالحة). كذلك «المستشار» يدل على من يُؤخذ برأيه لخبرته،
        وليس على من تُختبر ردود أفعاله. العلاقة الدلالية مختلفة جوهرياً عن المفهوم المطلوب.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مِسْبَار"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن جذر «سبر» يحمل معنى اختبار الأمر وتعرّف قدره، فإن المِسْبَار ترسّخ في
        الاستعمال الحديث بمعنى الأداة الفيزيائية (مسبار فضائي، مسبار طبي). نقله إلى
        الشخص يُحدث لبساً مع هذه الدلالات الراسخة. كما أن وزن مِفْعَال يدل على
        الأداة لا على الشخص.
      evidence_assessment:
        case: mixed

    - lemma: "مِجَسّ"
      source: stage1
      decision: removed
      decision_reason: >
        المِجَسّ مسجّل في المورد بمعنى «قرن الحشرة» و«ملاحظة تُلقى لجسّ نبض الآخرين»،
        أي أنه يدل على الأداة أو الفعل لا على الشخص. والمجموعة الترادفية تحتاج اسماً
        يدل على شخص (pos: n، فوقية: شخص يعمل). كذلك وزن مِفْعَل يدل على الآلة لا على الفاعل.
      evidence_assessment:
        case: mixed

    - lemma: "مُسْتَطْلَع"
      source: stage1
      decision: removed
      decision_reason: >
        اسم مفعول منتظم من «استطلع» لكنه عام جداً: كل من يُستطلع رأيه مُسْتَطْلَع، سواء
        في استبيان أو مقابلة أو غيرها. المفهوم المطلوب أخصّ: شخص تُتّخذ ردود أفعاله
        التلقائية مقياساً لمدى القبول، وليس مجرد شخص يُسأل عن رأيه.
      evidence_assessment:
        case: no_material

    - lemma: "مُخْتَبَر"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ مشترك بقوة مع «المختبَر» بمعنى المعمل (laboratory)، مما يجعله ملتبساً.
        كذلك هو عام جداً: كل شخص يُختبر هو مُختبَر.
      evidence_assessment:
        case: no_material


