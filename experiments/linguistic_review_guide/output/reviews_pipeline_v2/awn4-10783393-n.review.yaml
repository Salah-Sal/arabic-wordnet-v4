# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10783393-n
# a person who waits or awaits / شخص ينتظر أو يترقب
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (مُنْتَظِر)، وهو مفهوم عام يتيح إضافة مرادفات"
      - "التعريف الإنجليزي waiter قد يلتبس مع نادل المطعم، لكن التعريف العربي واضح"
    observations: "المفهوم يدور حول شخص في حالة انتظار أو ترقّب، وهو مفهوم عربي أصيل تتعدد ألفاظه في التراث العربي. اسم الفاعل من أفعال الانتظار والترقّب والتربّص كلها واردة، لكن لكلٍّ ظلاله الدلالية."
  blind_candidates:
    - lemma: "مُتَرَقِّب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من ترقَّب على وزن مُتَفَعِّل من جذر رقب، ومعناه من انتظر الأمر وتوقّعه. والترقّب يتضمّن معنى المراقبة مع الانتظار."
    - lemma: "مُتَرَبِّص"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تربَّص على وزن مُتَفَعِّل من جذر ربص، والتربّص في اللغة هو الانتظار والتمكّث. ورد في القرآن: {قُلْ هَلْ تَرَبَّصُونَ بِنَا}."
    - lemma: "رَاصِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رصد على وزن فاعِل، والرصد فيه معنى المراقبة والانتظار في الموضع."
    - lemma: "مُتَلَبِّث"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تلبَّث على وزن مُتَفَعِّل من جذر لبث، والتلبّث هو التريّث والمكث في الانتظار."

stage2_evidence:
  per_lemma:
    - lemma: "مُنْتَظِر"
      confirm:
        - text: "«مُنْتَظِر: من (ن ظ ر) المترقب والمتوقع، والمتأني.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الانتظار: الثبات لتوقع ما يكون من الحال.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«وَيَقُولُونَ: نَظَرْتُهُ، أَيِ انْتَظَرْتُهُ. وَهُوَ ذَلِكَ الْقِيَاسُ، كَأَنَّهُ يَنْظُرُ إِلَى الْوَقْتِ الَّذِي يَأْتِي فِيهِ.»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«مُنْتَظَر: من (ن ظ ر) المترقَب والمتوقَع والمتأنّى عليه.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الصيغة المبنية للمفعول (مُنْتَظَر) تدلّ على المفعول لا الفاعل، وهي صيغة مختلفة عن لمّة المجموعة"

    - lemma: "مُتَرَقِّب"
      confirm:
        - text: "«تَرَقَّبَ فلانٌ فلانًا أو الشيءَ: انْتَظَرَه. وقيل: رَصَدَه»"
          source: "المعجم الكبير"
      expands:
        - text: "«التربص: إمهال وتمكث يتحمل فيه الصبر... قال الراغب: الانتظار.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يؤكد الترادف بين الترقّب والانتظار"

    - lemma: "مُتَرَبِّص"
      confirm:
        - text: "«تَرَبَّصَ فلانٌ: انتظر وتَرقَّب»"
          source: "المعجم الكبير"
        - text: "«التربص: إمهال وتمكث يتحمل فيه الصبر الذي هو مقلوب لفظه، قال الحرالي. وقال الراغب: الانتظار.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«تربص احتكر وَبِه ربص وَيُقَال تربص بِهِ الشَّيْء وَفِي التَّنْزِيل الْعَزِيز {قل هَل تربصون بِنَا إِلَّا إِحْدَى الحسنيين} وتربص بسلعته الغلاء»"
          source: "المعجم الوسيط"
          conflict: "التربّص يغلب عليه معنى التربّص بالعدو أو الاحتكار، وفيه دلالة سلبية لا تلائم المعنى المحايد للانتظار"

    - lemma: "رَاصِد"
      contradicts:
        - text: "«الرَّاصِدُ: الرقيب، من يَرْصُد النجوم، الأسَد»"
          source: "المعجم الوسيط"
          conflict: "الراصد مخصّص لرصد النجوم والمراقبة، لا للانتظار العام"
        - text: "«راصد: observer»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
          conflict: "مصطلح فلكي متخصّص (observer) لا يفيد معنى المنتظر"

    - lemma: "مُتَلَبِّث"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُنْتَظِر"
      decision: confirmed
      decision_reason: "اسم فاعل من انتظر (وزن مُفْتَعِل) من جذر نظر، مؤيَّد بنصوص المعاجم الكلاسيكية والحديثة. ابن فارس نفسه أثبت أن نظرتُه بمعنى انتظرتُه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الانتظار المحايد العام دون إيحاء بالمراقبة أو التوجّس، وهو الأقرب للمعنى المباشر."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْتَظِر"

    - lemma: "مُتَرَقِّب"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من ترقّب (وزن مُتَفَعِّل) من جذر رقب. المعجم الكبير يعرّف ترقّب بأنه انتظره. الترقّب يضيف بُعد المراقبة والتوقّع إلى مجرد الانتظار، فيثري المجموعة بظلال دلالية مميزة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يتضمّن معنى المراقبة اليقظة مع الانتظار، فالمترقّب لا ينتظر فحسب بل يراقب ما ينتظره."
      actions:
        - command: create_entry
          params: {lemma: "مُتَرَقِّب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُتَرَبِّص"
      source: stage1
      decision: removed
      decision_reason: "رغم أن التربّص يعني الانتظار لغةً، إلا أنه يغلب عليه في الاستعمال الحديث معنى التربّص بالعدو والتحيّن السلبي والاحتكار. هذه الدلالة السلبية تجعله غير ملائم لمفهوم الانتظار المحايد."
      evidence_assessment:
        case: mixed

    - lemma: "رَاصِد"
      source: stage1
      decision: removed
      decision_reason: "الراصد مصطلح متخصّص يعني المراقب ورصّاد النجوم، وهو مثبت في المعاجم الحديثة بمعنى observer الفلكي. لا يتضمّن معنى الانتظار والترقّب الذي هو جوهر هذه المجموعة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُتَلَبِّث"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثر على شواهد معجمية لهذه الصيغة. التلبّث بمعنى التمكّث والإقامة أقرب إلى اللبث منه إلى الانتظار المقصود."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "شخص ينتظر أو يترقب"
    assessment:
      decision: retain
      reason: "التعريف موجز ودقيق، يجمع بين فعلي الانتظار والترقّب اللذين يمثّلان صُلب المفهوم. لا يعاني من دَوَران ولا غموض."
  examples:
    per_lemma:
      - lemma: "مُنْتَظِر"
        examples:
          - text: "وقف المنتظرون أمام بوابة المستشفى يتطلّعون إلى أخبار المصابين."
            type: usage
      - lemma: "مُتَرَقِّب"
        examples:
          - text: "ظلّ المتداولون المترقّبون يرصدون مؤشرات السوق قبل إعلان النتائج الفصلية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "وقف المنتظرون أمام بوابة المستشفى يتطلّعون إلى أخبار المصابين."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "ظلّ المتداولون المترقّبون يرصدون مؤشرات السوق قبل إعلان النتائج الفصلية."}

