# مراجعة المجموعة الترادفية — awn4-10604529-n
# sex symbol — رَمْز الْإِغْرَاء / رَمْز جِنْسِيّ
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«رَمْز جِنْسِيّ» نقل حرفي (calque) من الإنجليزية sex symbol، وقد لا يكون مسكوكاً في العربية الفصيحة"
      - "المُرادِف المفرط العام «عَامِل/فَاعِل» في فوق المجموعة لا يعكس طبيعة المفهوم بدقة"
      - "المفهوم ثقافي غربي بالدرجة الأولى، ويحتاج إلى تعبير مركب في العربية"
    observations: >
      المجموعة تشير إلى شخص (خاصة من المشاهير) يُعرَف بجاذبيته الجنسية.
      المفهوم حديث مرتبط بثقافة الإعلام والسينما، وليس له مقابل مفرد تراثي في العربية.
      اللمّتان الموجودتان كلتاهما تعبيران مركبان: أحدهما إضافي (رمز الإغراء) والآخر وصفي (رمز جنسي).
      رمز الإغراء أكثر ملاءمة ثقافية لأنه يستخدم مفهوم الإغراء العربي بدلاً من الترجمة الحرفية.
  blind_candidates:
    - lemma: "فَاتِن"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الجذر (ف ت ن) على وزن فَاعِل، يدل على من يَفتِن ويَسلب العقول بجماله.
        موثق في موسوعة السلطان قابوس: «الجميل وما يبهر الإنسان ويستهويه».
        لكنه صفة عامة لا تخصّ مفهوم «الرمز الجنسي» تحديداً.
    - lemma: "رَمْز الْفِتْنَة"
      generation_method: tarkib
      justification: >
        مركب إضافي: رمز + الفتنة. الفتنة في العربية تدل على الابتلاء والإعجاب والافتتان.
        لكن كلمة «فتنة» متعددة الدلالات (فتنة سياسية، فتنة دينية) مما يُحدث لبساً.
    - lemma: "أَيْقُونَة الْإِغْرَاء"
      generation_method: tarkib
      justification: >
        مركب إضافي: أيقونة (من اليونانية εἰκών) + الإغراء.
        أيقونة تدل على الصورة الرمزية والشخصية المؤثرة، لكنها لفظة معرّبة
        والمركب غير مسكوك في المعاجم.
    - lemma: "مُسْتَمْلَح"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من استملح (وزن مُسْتَفْعَل) من الجذر (م ل ح)، أي من يُستحسَن ويُستملَح.
        لكن الدلالة على الملاحة والظرف لا على الجاذبية الجنسية تحديداً.


stage2_evidence:
  per_lemma:
    - lemma: "رَمْز الْإِغْرَاء"
      confirm:
        - text: "«الرَّمْزُ: الإيماء والإشارة العلامة الكناية الخفيَّة»"
          source: "المعجم الوسيط"
        - text: "«(رَمَزَ) الرَّاءُ وَالْمِيمُ والزَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَرَكَةٍ وَاضْطِرَابٍ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(غَرَوَ) الْغَيْنُ وَالرَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ، وَهُوَ يَدُلُّ عَلَى الْإِعْجَابِ وَالْعَجَبِ لِحُسْنِ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر إغراء (غرو) يدل أصلاً على الإعجاب بحسن الشيء، مما يؤيد استعمال إغراء بمعنى الجاذبية"
        - text: "«(فى النحو): تنبيه المخاطب على أمر محمود ليلزمه»"
          source: "المعجم الوسيط"
          addition: "الإغراء في النحو العربي يعني الحثّ على لزوم أمر محمود، وهو قريب من معنى الجذب والاستمالة"

    - lemma: "رَمْز جِنْسِيّ"
      confirm:
        - text: "«(جِنْسٌ) الْجِيمُ وَالنُّونُ وَالسِّينُ أَصْلٌ وَاحِدٌ وَهُوَ الضَّرْبُ مِنَ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«ذو جنسٍ أو غريزة جنسيّة أو جاذبية جنسية.»"
          source: "المورد الحديث (2008)"
          addition: "يوثق استعمال «جنسي» و«جاذبية جنسية» في سياق الإشارة إلى الخصائص الجنسية للشخص"
        - text: "«رَمْز: اصطلاح متعدِّد السمات، غير مستقر، لاستحالة رسم مفارقات معناه، وهو علامة تحيل على موضوع وتسجله طبقا لقانون ما»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يؤكد أن الرمز علامة تحيل على موضوع، مما يدعم استعمال «رمز» مع نعت يحدد نوع الإحالة"

    - lemma: "فَاتِن"
      confirm:
        - text: "«فَاتِن: من (ف ت ن) الجميل وما يبهر الإنسان ويستهويه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«جَذّاب؛ فاتن؛ ساحر؛ مُغْرٍ.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(فَتَنَ) الْفَاءُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاءٍ وَاخْتِبَارٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل اللغوي يدل على الابتلاء والاختبار لا على الجاذبية الجنسية تحديداً، وفاتن صفة عامة لا تدل على «الرمز» بل على «الوصف»"

    - lemma: "رَمْز الْفِتْنَة"
      contradicts:
        - text: "«(فَتَنَ) الْفَاءُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاءٍ وَاخْتِبَارٍ. مِنْ ذَلِكَ الْفِتْنَةُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الفتنة لها دلالات سلبية قوية (الفتنة بين الناس، الحرب الأهلية) مما يُربك المعنى المراد"
      expands:
        - text: "«(1) فتنة؛ سِحر (2) جاذبية جنسية (3) حيوية؛ حماسة.»"
          source: "المورد الحديث (2008) — مدخل oomph"
          addition: "يجمع المورد الحديث بين الفتنة والجاذبية الجنسية في مدخل واحد لكن كمعانٍ متجاورة لا مترادفة"

    - lemma: "أَيْقُونَة الْإِغْرَاء"
      expands:
        - text: "«لوحة لها موضوع ديني وذات تقاليد راسخة، وتمثل الشخصيات الدينية والقديسين»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "أيقونة لفظة معربة من اليونانية، دلالتها الأصلية دينية، واستُعملت حديثاً بمعنى الصورة الرمزية"

    - lemma: "مُسْتَمْلَح"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "رَمْز الْإِغْرَاء"
      decision: confirmed
      decision_reason: >
        تعبير مركب إضافي عربي أصيل يجمع بين «رمز» (العلامة والدلالة) و«الإغراء» (الجذب والاستمالة).
        جذر «غرو» يدل في مقاييس اللغة على الإعجاب بحسن الشيء، وهو أدق ثقافياً من الترجمة الحرفية.
        المركب متداول في الإعلام العربي المعاصر ومفهوم بلا لبس.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يركز على بُعد الإغراء والاستمالة بوصفهما صفتين ثقافيتين عامتين،
        وهو أكثر تهذيباً ولباقة من «رمز جنسي»، ويصلح للسياقات الرسمية والإعلامية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَمْز الْإِغْرَاء"

    - lemma: "رَمْز جِنْسِيّ"
      decision: confirmed
      decision_reason: >
        ترجمة حرفية (calque) من الإنجليزية sex symbol لكنها شائعة ومفهومة في الاستعمال الإعلامي العربي المعاصر.
        المركب الوصفي «رمز + جنسي» واضح الدلالة ويصف المفهوم بدقة.
        رغم كونه اقتراضاً مفهومياً، فإنه مستقر في الاستعمال.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        أصرح وأكثر مباشرة في الإشارة إلى البُعد الجنسي من «رمز الإغراء»،
        وهو أقرب إلى الاستعمال الإعلامي المترجم عن الإنجليزية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَمْز جِنْسِيّ"

    - lemma: "فَاتِن"
      source: stage1
      decision: removed
      decision_reason: >
        فاتن صفة (اسم فاعل) تدل على من يفتن بجماله عموماً، ولا تدل على مفهوم «الرمز» أو «الأيقونة» الذي يتضمنه المفهوم المطلوب.
        يمكن أن يُوصف بها أي شيء جميل (منظر فاتن، لحن فاتن)، فهي صفة لا اسم دالّ على نوع من الأشخاص.

    - lemma: "رَمْز الْفِتْنَة"
      source: stage1
      decision: removed
      decision_reason: >
        الفتنة في العربية متعددة الدلالات السلبية (الحرب الأهلية، الاضطراب الديني، الابتلاء) مما يُحدث لبساً شديداً.
        المركب غير مسكوك ولم يُعثَر عليه في أي معجم. اختبار السكّ: يمكن إبدال «الفتنة» بـ«السحر» أو «الجمال» والعبارة لا تزال وصفية حرة.

    - lemma: "أَيْقُونَة الْإِغْرَاء"
      source: stage1
      decision: removed
      decision_reason: >
        أيقونة لفظة معربة من اليونانية (تعريب)، والمركب غير مسكوك في المعاجم.
        زائدة عن الحاجة مع وجود «رمز الإغراء» الأصيل. كما أن دلالة أيقونة الأصلية دينية.

    - lemma: "مُسْتَمْلَح"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على أدلة معجمية. الملاحة والاستملاح يدلان على الظرف والخفة لا على الجاذبية الجنسية.
        الدلالة أخفّ وأضعف من المطلوب.


