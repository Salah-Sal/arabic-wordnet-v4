# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "ضابط"
      decision: confirmed
      decision_reason: >
        رغم غلبة الدلالة العسكرية، يحمل «ضابط» معنى «المتحكم/المنظِّم» موثَّقاً في المعاجم
        التقنية (controller في الهندسة الكهربائية) وفي المورد الحديث (ضابط الأمر = مقياسه
        ومعياره). الجذر ض-ب-ط يدل بطبيعته على الإمساك بالشيء وإحكامه من جميع الجوانب، وهو
        ما يتوافق مع دلالة «يوجّه ويضبط». الاختلاط مع المعنى العسكري لا يُفضي إلى خلط في
        السياق (المجموعة تحدد التعريف). يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُفيد الضبط التنظيمي والإحكام المنهجي — يُستخدم لوصف من يُخضع الأمور لمعايير
        ثابتة ويُقنّنها (regulatory/disciplinary control)؛ جذره يدل على الإمساك من
        جميع الجوانب وعدم التفلّت، ويختلف عن «مُتَحَكِّم» بتركيزه على التقنين والإحكام
        لا على امتلاك السلطة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ضَابِط"

    - lemma: "متحكم"
      decision: confirmed
      decision_reason: >
        «متحكم» مشتق من الجذر ح-ك-م الذي يدل في أصله على المنع والضبط (حكمة الدابة تمنعها).
        المعجم القانوني يعتمد «مُراقِب، مُراجِع» و«متحكِّم» بمعنى controller. وإن كان
        الاستخدام التقني يستعمله للأجهزة، فإن الاستخدام الإنساني (متحكِّم في الأمور، من يمسك
        بزمام الإدارة) راسخ في الفصحى المعاصرة. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُفيد الاستحواذ على السلطة التنفيذية وامتلاك زمام القرار — يُستخدم لوصف من
        يُمسك بأداة التحكم الفعلية ويمارس السيطرة المباشرة (executive/volitional control)؛
        جذره يدل على المنع والحكم، ويختلف عن «ضَابِط» بتركيزه على فاعلية الإمساك بمقاليد
        الأمور وتدخّله الفعّال المستمر
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَحَكِّم"

    - lemma: "رَادِع"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الأولى لـ«رادع» في المعاجم الحديثة هي الثوب المطيّب لا الشخص الكافّ.
        وفي الاستخدام العام هو وصف للأشياء والأفكار الرادعة لا اسماً لنوع من الأشخاص.
        علاوة على ذلك لا يشمل «رادع» البُعد الثاني في التعريف (يوجّه)؛ يعبّر عن الكبح
        فحسب. لم تُثبته المعاجم الحديثة اسماً لشخص بعينه بهذه الدلالة.
      evidence_assessment:
        case: mixed

    - lemma: "كَابِح"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توافر أدلة معجمية تربطه بمعنى restrainer (موسوعة السلطان قابوس + المورد الحديث)،
        فإن الاستخدام المعاصر جعله مصطلحاً للأجهزة الميكانيكية والكهربائية (brake, inhibitor)
        في عشرات التركيبات التقنية الموثّقة. كما أنه لا يشمل البُعد التوجيهي (يوجّه) المطلوب
        في التعريف؛ فهو يصف الكبح فحسب لا الجمع بين التوجيه والضبط.
      evidence_assessment:
        case: mixed

    - lemma: "مُسَيطِر"
      source: stage1
      decision: removed
      decision_reason: >
        «مسيطر» يحمل حمولة دلالية قوية بالهيمنة والسلطة المطلقة، وهو ما يزيد على المعنى
        المقصود (شخص يوجّه ويضبط لا يهيمن). كما أن استخدامه التقني المعتمد هو ultradominant
        في الجيولوجيا وعلم الزلازل، بعيداً عن دلالة المجموعة. لم تُثبته المعاجم الكلاسيكية.
      evidence_assessment:
        case: contradicts_only

    - lemma: "قَيِّم"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق الدلالة التوجيهية/الرعائية في المعاجم الكلاسيكية (سائس الأمر، من يقوم
        بشأن القوم)، يفتقر «قيّم» إلى تغطية البُعد الكابح (يضبط). كما أن المشتقات
        الحديثة من نفس الجذر (قيمة/قِيَم/قيَّم/تقييم) تُشيع الاشتراك اللفظي وتُضعف
        الوضوح الاصطلاحي مما يُفضي إلى لبس مع «القيم الأخلاقية» و«التقييم».
      evidence_assessment:
        case: mixed


