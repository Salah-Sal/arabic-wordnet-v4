# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «ضابط» تحمل دلالة عسكرية راسخة (رتبة في الجيش والشرطة) قد تُحدث التباساً مع المعنى المقصود هنا (الشخص الضابط/المتحكم)"
      - "لمّة «متحكم» تُستعمل في المعاجم التقنية أساساً للأجهزة لا للأشخاص (device controller)"
      - "كلتا اللمّتين خاليتان من التشكيل الكامل في بيانات المجموعة"
      - "التعريف الحالي «شخص يوجه ويضبط» مختزل جداً ويفتقر إلى الجنس القريب الدقيق والفصل النوعي"
      - "لا يوجد توثيق للفارق الدلالي بين اللمّتين داخل بيانات المجموعة"
    observations: >
      المجموعة تمثّل مفهوماً إنسانياً عاماً يقابل الثنائية الإنجليزية restrainer/controller،
      أي شخص يجمع بين التوجيه الفاعل والضبط الكابح في آنٍ واحد. «ضابط» جذره ض-ب-ط يدل
      على الإمساك بالشيء وإحكامه، وهو تعبير دقيق للمعنى المقصود غير أن المعنى العسكري
      طغى عليه في الاستخدام الحديث. «متحكم» مشتق من الجذر ح-ك-م الدال على المنع والحكم،
      يصوّر الاستحواذ على أداة السيطرة، لكنه يغلب في السياقات التقنية على الأجهزة لا البشر.
      كلا المصطلحين صحيحان لغوياً ويحتاجان إلى تشكيل كامل في المخرجات.
  blind_candidates:
    - lemma: "رَادِع"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن فَاعِل من الجذر (ر د ع) بمعنى «الكافّ عن الشيء والزاجر المانع»؛
        يُعبّر عن البُعد الكابح في التعريف (يضبط/يردع). الوزن فَاعِل لاسم الفاعل من فعل
        ثلاثي مجرد شائع لتسمية الفاعل الإنساني.
    - lemma: "كَابِح"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن فَاعِل من الجذر (ك ب ح)، أصله «جذب لجام الدابة ليوقفها»، ثم
        توسّع ليشمل من يكبح سلوك الآخرين ويمنع تجاوزاتهم. الكبح أخصّ من الردع بدلالته
        على الضبط الفوري والمباشر.
    - lemma: "مُسَيطِر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من سَيطَر على وزن مُفَعلِل، بمعنى من يهيمن ويمسك بزمام الأمور ويوجّهها،
        يجمع بين بُعدَي التوجيه والضبط في استخدام عربي معاصر واسع الانتشار.
    - lemma: "قَيِّم"
      generation_method: majaz
      justification: >
        إحياء للفظ التراثي الفصيح على وزن فَيعِل من الجذر (ق و م)، بمعنى «من يقوم بأمور
        القوم ويسوس شؤونهم»؛ استخدمه العرب لوصف من يتولى إدارة جماعة بالتوجيه والإشراف.
        إزاحة دلالية من «القائم على الأمر» الكلاسيكي نحو «الشخص الضابط والموجّه».


