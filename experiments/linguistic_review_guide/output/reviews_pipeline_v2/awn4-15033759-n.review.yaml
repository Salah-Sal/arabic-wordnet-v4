# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15033759-n (evaporite)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «متبخرات» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط — قد تحتاج إلى إثراء بمرادفات"
      - "التعريف العربي مقتضب ولا يذكر أنواع الأملاح المترسبة (هاليت، جبس، أنهيدريت)"
    observations: >
      المفهوم جيولوجي متخصص يدل على الرواسب الملحية الناتجة عن تبخر المياه المالحة.
      المصطلح «متبخرات» مشتق من الفعل «تبخّر» على صيغة اسم الفاعل الجمع (مُتَفَعِّلات)،
      وهو مصطلح حديث مُقَرّ من المعاجم الموحدة (أليكسو). الجذر «بخر» أصله
      الرائحة أو الريح التي تثور كما ذكر ابن فارس، ومنه البخار.
      العلاقة بين التبخر والراسب المتخلف واضحة اصطلاحياً.

  blind_candidates:
    - lemma: "تَبَخُّرِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «تبخّر» على وزن فَعَلُلِيَّة، يدل على المادة الناتجة عن التبخر،
        قياساً على نظائر مثل «بركانية» و«رسوبية» في علوم الأرض.
    - lemma: "رَاسِب تَبَخُّرِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «راسب» (الجنس القريب — المذكور في فوقيّ المجموعة) و«تبخري»
        (الفصل النوعي)، يصف الراسب الناتج تحديداً عن عملية التبخر.
    - lemma: "مَلَّاحَة"
      generation_method: majaz
      justification: >
        من الجذر «ملح»، والمَلَّاحة في المعجم الوسيط: مكان تكوّن الملح.
        إزاحة مجازية من المكان إلى المادة المترسبة فيه (مجاز مرسل — علاقة المحلّية).
    - lemma: "إِيفَابُورِيت"
      generation_method: taarib
      justification: >
        تعريب للمصطلح الإنجليزي evaporite على وزن يقبل لام التعريف والجمع
        (إيفابوريتات). ملاذ أخير لا يُلجأ إليه إلا عند عدم وجود بديل عربي.


stage2_evidence:
  per_lemma:
    - lemma: "مُتَبَخِّرَات"
      confirm:
        - text: "«مترسبات من الأملاح (على سبيل المثال، الهاليت والجبس والأنهيدريت) التي خلفها تبخر مياه البحر، وتشكلت عادة في مجال أحواض مغلقة جزئيا أو كليا.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (أليكسو)"
        - text: "«رواسب محلية تترسب من تبخر المحاليل»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«رواسب محلية تترسب من تبخر المحاليل»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
      expands:
        - text: "«متبخّرات — evaporits»"
          source: "مسرد الجغرافيا والتاريخ (أليكسو)"
          addition: "يؤكد شيوع المصطلح في مجالات متعددة (جغرافيا وتاريخ) لا الجيولوجيا فحسب"
        - text: "«ترسيب ناتج من محاليل الأملاح — evaporites»"
          source: "المكنز الزراعي متعدد اللغات (AGROVOC)"
          addition: "صيغة بديلة وصفية مطوّلة تؤكد أن «متبخرات» هي الصيغة المختصرة المعتمدة"

    - lemma: "تَبَخُّرِيَّة"
      contradicts:
        - text: "«تبخُريَّة — evaporativity»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
          conflict: "المصطلح «تبخرية» يدل على خاصية التبخر (evaporativity) وليس على المادة المترسبة (evaporite)"

    - lemma: "رَاسِب تَبَخُّرِيّ"
      evidence_status: "no_material_found"

    - lemma: "مَلَّاحَة"
      contradicts:
        - text: "«مكان تكوُّن الملح أو بيعه»"
          source: "المعجم الوسيط"
          conflict: "المَلَّاحة تدل على المكان (salina/salt pan) لا على المادة المترسبة ذاتها"
        - text: "«منجم الملح أو المكان المعد لصنع الملح — salina»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "في المعجم الجيولوجي نفسه المَلَّاحة = salina وليس evaporite، فلا يصح استعمالها للدلالة على المتبخرات"

    - lemma: "إِيفَابُورِيت"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "مُتَبَخِّرَات"
      decision: confirmed
      decision_reason: >
        مصطلح مُقَرّ من المعاجم الموحدة (أليكسو) في أربعة معاجم متخصصة على الأقل
        (الجيولوجيا، الزلازل، المناخ والبيئة، الجغرافيا). مشتق اشتقاقاً سليماً من
        الجذر «بخر» على صيغة اسم الفاعل المؤنث الجمع من «تبخّر». لا يوجد بديل
        عربي أفضل منه من حيث الشيوع والدقة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح القياسي المعتمد من أليكسو للدلالة على الرواسب الملحية الناتجة عن التبخر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَبَخِّرَات"

    - lemma: "تَبَخُّرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح «تبخرية» مسجّل في المعجم الموحد للأرصاد الجوية بمعنى evaporativity
        (خاصية التبخر)، وهو مفهوم مختلف تماماً عن evaporite (المادة المترسبة).
        استخدامه هنا يُحدث اشتراكاً لفظياً مُضرّاً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَاسِب تَبَخُّرِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ وليس مصطلحاً مسكوكاً. لم يُعثر عليه في أي معجم متخصص.
        يفشل في اختبار السكّ: يمكن إبدال «راسب» بـ«رسوب» أو «ترسّب» وتبقى العبارة
        وصفية صالحة. كما أن المصطلح المعتمد «متبخرات» أقصر وأكثر شيوعاً.
      evidence_assessment:
        case: no_material

    - lemma: "مَلَّاحَة"
      source: stage1
      decision: removed
      decision_reason: >
        المَلَّاحة في المعاجم الكلاسيكية والحديثة تدل على مكان تكوّن الملح (salina)
        أو على حرفة الملاح (navigation)، ولا تدل على المادة المترسبة ذاتها.
        في المعجم الموحد للجيولوجيا نفسه، المَلَّاحة = salina بينما متبخرات = evaporites،
        فهما مفهومان مختلفان ولا يصح الخلط بينهما.
      evidence_assessment:
        case: contradicts_only

    - lemma: "إِيفَابُورِيت"
      source: stage1
      decision: removed
      decision_reason: >
        لا حاجة للتعريب ما دام البديل العربي المشتق «متبخرات» مُقَرّاً وشائعاً
        في المعاجم الموحدة. التعريب ملاذ أخير ولا يُلجأ إليه مع وجود مصطلح عربي سليم.
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "الراسب المتبقي بعد تبخر مياه البحر"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في جوهره لكنه مقتضب: لا يذكر أنواع الأملاح الرئيسية
        ولا يوضح أن التبخر لا يقتصر على مياه البحر بل يشمل أي محاليل ملحية.
        كما أن صيغة المفرد «الراسب» لا تتسق مع اسم الجمع «متبخرات».
    authored:
      - type: terminological
        text: "رَوَاسِبُ مِلْحِيَّةٌ تَتَرَسَّبُ مِنْ تَبَخُّرِ المَحَالِيلِ المَائِيَّةِ المَالِحَةِ، كَالهَالِيتِ وَالجِبْسِ وَالأَنْهِيدْرِيتِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
