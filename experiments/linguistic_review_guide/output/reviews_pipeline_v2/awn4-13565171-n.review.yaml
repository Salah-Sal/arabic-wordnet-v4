stage1_review:
  assessment:
    concerns:
      - "«تكاثر سريع» تعبير وصفي حرّ وليس مصطلحاً مسكوكاً — يمكن استبدال «سريع» بـ«عاجل» أو «متسارع» دون تغيّر المدلول"
      - "«توالد» يدلّ في الأصل على التناسل والإنجاب، لا على مطلق الزيادة السريعة الغزيرة"
      - "التعريف العربي «زيادة سريعة وغزيرة» موجز جداً ويفتقر إلى الجنس القريب والفصل النوعي"
    observations: "المجموعة تمثّل مفهوم pullulation أي التزايد السريع الغزير في العدد. اللمّتان الموجودتان تغطّيان الجانب البيولوجي (توالد) والجانب الوصفي (تكاثر سريع)، لكن ينقص المجموعةَ لفظٌ مفرد يدلّ مباشرة على التكاثر/التضاعف السريع مثل «تكاثُر» أو «تضاعُف»."
  blind_candidates:
    - lemma: "تَكَاثُر"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَاعُل من الجذر كثر، يدلّ على التزايد والتضاعف في العدد، وهو مصطلح مستقرّ في المعجمات الطبية والبيولوجية بمعنى proliferation"
    - lemma: "اسْتِفْحَال"
      generation_method: ishtiqaq
      justification: "مصدر اسْتَفْحَل على وزن اسْتِفْعَال من الجذر فحل، يدلّ على التعاظم والاشتداد، يمكن أن يُستعمل مجازاً في سياق الزيادة المتسارعة"
    - lemma: "فَيْض"
      generation_method: majaz
      justification: "من الجذر فيض الدالّ على الجريان والغزارة، مجاز عن الزيادة الكثيرة المتدفّقة، والوسيط يعرّفه بالكثير الغزير"
    - lemma: "تَنَاسُل"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَاعُل من الجذر نسل، يدلّ على التوالد وكثرة النسل، والوسيط يعرّفه بـ«توالدوا وأنسل بعضهم بعضاً»"

stage2_evidence:
  per_lemma:
    - lemma: "تكاثر سريع"
      confirm:
        - text: "«(1) «أ» الإخلاف (نب). «ب» تضاعُف: تكاثرٌ سريع (2) انتشار proliferation of nuclear weapons.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التكاثر السريع — speed breeding»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "مصطلح زراعي يعني التربية السريعة للنباتات، وليس الزيادة الغزيرة"

    - lemma: "توالد"
      confirm:
        - text: "«(1) «أ» موالدة؛ توليد؛ تفريخ. «ب» توالد؛ تكاثر (2) «أ» نَشْر؛ بَثّ. «ب» انتشار»"
          source: "المورد الحديث (2008)"
        - text: "«توالُد، تكاثُر، تناسُل — reproduction: الإكثار الذاتيّ لكائن حيّ والذي قد يكون جنسيا أو لا جنسيا. تكوين نسخ أكثر من الصنف نفسه.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«تَوالُد؛إِنْجَاب — reproduction»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«التوالد: عند أهل الله الخلع التي تخص بعض الأفراد، وقد تطلق على مطلق الخلع.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "معنى صوفي اصطلاحي مغاير تماماً للدلالة البيولوجية"

    - lemma: "تَكَاثُر"
      confirm:
        - text: "«تَكاثُر — proliferation»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تكاثر — multiplication»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«تشعب، تكاثر — proliferation»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
        - text: "«انتشار، تكاثُر — propagation»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      expands:
        - text: "«التكاثر: تكاثر جنسي: التعاقب المنتظم للانقسام الاختزالي والإخصاب — reproduction»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          addition: "يشمل التكاثر الجنسي واللاجنسي في السياق البيولوجي"

    - lemma: "اسْتِفْحَال"
      contradicts:
        - text: "«(1) «أ» مُفاقَمة. «ب» تفاقُم؛ استفحال (2) إثارة. — exacerbation»"
          source: "المورد الحديث (2008)"
          conflict: "الاستفحال يدلّ على التفاقم والاشتداد السلبي، لا على الزيادة العددية الغزيرة"
      expands:
        - text: "«(4) تنامٍ؛ تعاظم؛ اشتداد؛ استفحال — buildup»"
          source: "المورد الحديث (2008)"
          addition: "يُستعمل بمعنى التعاظم التدريجي لا التكاثر البيولوجي"

    - lemma: "فَيْض"
      expands:
        - text: "«الكثير الغزير رجلٌ فَيْضٌ: كثير الخير فرَسٌ فيضٌ: غزير»"
          source: "المعجم الوسيط"
          addition: "يدلّ على الغزارة والكثرة لا على التزايد العددي"
        - text: "«فيض — flooding / flux»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "المعنى الاصطلاحي المعاصر هو الفيضان والتدفّق"
      contradicts:
        - text: "«الفيض: الموت، يقال فاضت نفسه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "معنى مغاير تماماً"

    - lemma: "تَنَاسُل"
      confirm:
        - text: "«تَنَاسَلَ القومُ: توالدوا وأَنْسَل بعضُهم بعضاً بنو فلان: كثر نَسْلُهم»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(تناسل) الْقَوْم تَوَالَدُوا وأنسل بَعضهم بَعْضًا وَبَنُو فلَان كثر نسلهم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
          addition: "الفعل لازم يدلّ على التوالد المتبادل وكثرة النسل"

stage3_analysis:
  per_lemma:
    - lemma: "تَكَاثُرٌ سَرِيع"
      decision: confirmed
      decision_reason: "مركّب وصفيّ مُثبَت في المورد الحديث ترجمةً لـ proliferation بمعنى التضاعف السريع. يجتاز اختبار التثبيت المعجمي لوروده مصطلحاً في معجم ثنائي اللغة موثوق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على بُعد السرعة في التزايد، ويُستعمل خاصّة في سياق الانتشار النووي والبيولوجي السريع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَاثُرٌ سَرِيع"

    - lemma: "تَوَالُد"
      decision: confirmed
      decision_reason: "مصطلح مستقرّ في المعاجم الطبية والبيولوجية العربية بمعنى reproduction. وإن كان أعمّ من pullulation، فإنه يغطّي الجانب التوليدي للزيادة الغزيرة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الإنجاب والتناسل البيولوجي ذاته — أي آلية الزيادة — بينما «تكاثر سريع» يصف وتيرة الزيادة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَالُد"

    - lemma: "تَكَاثُر"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح راسخ في المعجمات الطبية والعلمية العربية الموحّدة بمعنى proliferation وmultiplication. يسدّ فجوة في المجموعة إذ يمثّل اللفظ المفرد الأدقّ للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على مطلق التزايد العددي الغزير دون تقييد بالسرعة أو بالآلية البيولوجية، وهو الأعمّ بين ألفاظ المجموعة"
      actions:
        - command: create_entry
          params: {lemma: "تَكَاثُر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "اسْتِفْحَال"
      source: stage1
      decision: removed
      decision_reason: "الاستفحال يدلّ على التفاقم والاشتداد السلبي (exacerbation/buildup) لا على الزيادة العددية الغزيرة. الأدلة المعجمية تناقض ملاءمته لهذه المجموعة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "فَيْض"
      source: stage1
      decision: removed
      decision_reason: "الفيض يدلّ على الجريان والتدفّق والغزارة، لا على التزايد العددي. معانيه المعاصرة (flooding, flux) بعيدة عن مفهوم pullulation."
      evidence_assessment:
        case: mixed

    - lemma: "تَنَاسُل"
      source: stage1
      decision: removed
      decision_reason: "التناسل قريب جداً من التوالد ويكاد يكون مرادفاً تامّاً له في سياق التكاثر البيولوجي. إضافته لا تُثري المجموعة دلالياً لأنّ «توالد» يؤدّي الوظيفة ذاتها."
      evidence_assessment:
        case: confirm_only

stage4_content:
  definition:
    current: "زيادة سريعة وغزيرة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب ويفتقر إلى الجنس القريب الواضح والفصل النوعي الدقيق. ينبغي صياغته بأسلوب معجمي أدقّ يربطه بالمفهوم العلوي (تصاعد/زيادة/نمو)."
    authored:
      - type: terminological
        text: "نَماءٌ مُتسارِعٌ غَزيرٌ في العَدَدِ أَوِ الحَجمِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "تَزايُدٌ سَريعٌ وافِرٌ يَتَّسِمُ بِغَزارَةِ الإِنتاجِ العَدَدِيِّ في فَترَةٍ وَجيزَةٍ، كَتَكاثُرِ الخَلايا أَوِ انتِشارِ الأَحياءِ الدَّقيقَةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "نَماءٌ مُتسارِعٌ غَزيرٌ في العَدَدِ أَوِ الحَجمِ"}

  examples:
    per_lemma:
      - lemma: "تَكَاثُرٌ سَرِيع"
        examples:
          - text: "أدّى التكاثرُ السريعُ للبكتيريا في مياه الصرف إلى تلوّث المنطقة المحيطة بالمصبّ."
            type: usage
      - lemma: "تَوَالُد"
        examples:
          - text: "يُسهم توالدُ الحشرات في البيئات الرطبة في انتشار الأمراض المعدية."
            type: usage
      - lemma: "تَكَاثُر"
        examples:
          - text: "رصد الباحثون تكاثراً غير مسبوق للطحالب في مياه البحيرة خلال فصل الصيف."
            type: usage
    actions:
