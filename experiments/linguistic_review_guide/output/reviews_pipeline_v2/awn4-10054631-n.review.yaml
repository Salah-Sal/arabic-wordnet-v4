# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10054631-n (driver — سائق)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «قائد مركبة» تعبير وصفي حرّ وليس وحدة معجمية ثابتة — يمكن استبدال «مركبة» بـ«سيارة» أو «شاحنة» دون تغيير في البنية"
      - "التعريف الحالي «مشغل مركبة آلية» ترجمة حرفية لـ operator of a motor vehicle، ولفظ «مشغّل» لا يُستعمل عادة للدلالة على سائق المركبة في العربية"
    observations: "المفهوم أصيل في الثقافة العربية وله ألفاظ متعددة متجذّرة في التراث. الجذر «سوق» هو المحور الدلالي الرئيس، ومنه اشتُقّت السيارة والسائق والسوق. القيادة من «قود» تدلّ على التوجيه بالأمام خلافاً للسَّوق من الخلف. الحوذي لفظ تراثي لسائق العربة."
  blind_candidates:
    - lemma: "سَائِق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من ساقَ يسوقُ على وزن فاعِل، وهو الاشتقاق الطبيعي للدلالة على من يسوق المركبة ويحرّكها"
    - lemma: "سَوَّاق"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من الجذر سوق، تدلّ على الاحتراف والملازمة، أقرّها مجمع اللغة العربية بالقاهرة"
    - lemma: "قَائِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من قادَ يقودُ، يدلّ على من يوجّه المركبة من الأمام، شائع في الاستعمال الرسمي والقانوني"
    - lemma: "حَوْذِيّ"
      generation_method: majaz
      justification: "لفظ تراثي أصله سائق العربة المجرورة بالدوابّ، يمكن توسيعه مجازاً ليشمل سائق المركبة الآلية، مسجّل في الوسيط والكبير"

stage2_evidence:
  per_lemma:
    - lemma: "سَائِق"
      confirm:
        - text: "«من يقود السيارة أو القطار ونحوهما»"
          source: "المعجم الوسيط"
        - text: "«مَنْ يقُودُ السَّيَّارَة والقطارَ وَنَحْوهما»"
          source: "المعجم الكبير"
        - text: "«(السَّائِق) من يَقُود السيارة أَو القطار وَنَحْوهمَا (ج) ساقة»"
          source: "المعجم الوسيط (حوراماني)"
      expands:
        - text: "«الزمان؛ لأنه المُفْنِى المبيدُ فى اعتقاد بعضهم»"
          source: "المعجم الكبير"
          addition: "دلالة مجازية ثانوية لا تتعارض مع الدلالة الأساسية"

    - lemma: "قَائِد مَرْكَبَة"
      contradicts:
        - text: "«مَنْ يَقُودُ الجَيْشَ. مَنْ يَقُودُ فِرْقَةً مُوسِيقِيَّةً أَوْ نَحْوَهَا (مُحْدَثَة). كُلُّ مُسْتَطِيلٍ مِنْ أَرْضٍ أَوْ جَبَلٍ عَلَى وَجْهِ الأَرْضِ»"
          source: "المعجم الوسيط"
          conflict: "لفظ «قائد» مفرداً لا يدلّ على سائق المركبة في المعاجم، بل على قائد الجيش أو الفرقة"
      expands:
        - text: "«برمجية خاصة ببطاقة ما (بطاقة الصوت أو الشبكة مثلا) تمكن من تشغيل تلك البطاقة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          addition: "لفظ «قائد» يُستعمل في المصطلحية الحاسوبية بمعنى driver البرمجي لا سائق المركبة"

    - lemma: "سَوَّاق"
      confirm:
        - text: "«السائق»"
          source: "المعجم الوسيط (مدخل السَّوَّاق)"
        - text: "«ورد بناء فَعّال للدلالة على الحرفة بقلَّة، ثم شاع هذا الاستعمال في مراحل العربية المتأخرة؛ ولذا فقد أقرّ مجمع اللغة المصري قياسيّة صيغة فَعّال للدلالة على الاحتراف أو ملازمة الشيء، وقد وردت السَّوّاق في المعاجم الحديثة كالوسيط والأساسي والمنجد»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«الطويلُ الساق. بائعُ السويق. صانعُه»"
          source: "المعجم الوسيط (مدخل السَّواقُ بفتح السين بلا تشديد)"
          addition: "يوجد لفظ «السَّواق» (بدون تشديد) بمعنى مختلف: الطويل الساق — يجب التمييز بالتشكيل"

    - lemma: "قَائِد"
      contradicts:
        - text: "«مَنْ يَقُودُ الجَيْشَ. مَنْ يَقُودُ فِرْقَةً مُوسِيقِيَّةً أَوْ نَحْوَهَا (مُحْدَثَة)»"
          source: "المعجم الوسيط"
          conflict: "الدلالة المعجمية الأولى قيادة الجيش، لا قيادة المركبة"
      expands:
        - text: "«رغبة قائد السيارة» (مصطلح في هندسة السيارات)"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
          addition: "يُستعمل «قائد السيارة» في المصطلحية التقنية الحديثة"

    - lemma: "حَوْذِيّ"
      confirm:
        - text: "«الطارد المستحثُّ على السير. سائق العربة»"
          source: "المعجم الوسيط"
        - text: "«الطَّارِدُ المُسْتَحِيثُ على السَّيْرِ. سائِقُ العَرَبَةِ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«سائق العربة» (لا المركبة الآلية)"
          source: "المعجم الوسيط والكبير"
          conflict: "التعريف المعجمي يخصّ العربة المجرورة لا المركبة الآلية"

stage3_analysis:
  per_lemma:
    - lemma: "سَائِق"
      decision: confirmed
      decision_reason: "لفظ أصيل مشتقّ من الجذر «سوق»، مؤكَّد في المعجم الوسيط والكبير بالدلالة المطلوبة تماماً: «من يقود السيارة أو القطار ونحوهما». هو اللفظ الأكثر شيوعاً واستعمالاً في الفصحى المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ العامّ المحايد لمن يتولّى قيادة المركبة، يُستعمل في جميع السجلّات اللغوية من العامّية إلى الرسمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَائِق"

    - lemma: "قَائِد مَرْكَبَة"
      decision: removed
      decision_reason: "تعبير وصفي حرّ يفشل في اختبار السكّ: يمكن إبدال «مركبة» بـ«سيارة/شاحنة/حافلة» ويبقى صالحاً كوصف. لفظ «قائد» مفرداً دلالته المعجمية الأولى قيادة الجيش لا المركبة. ولم يُسجَّل «قائد مركبة» كوحدة معجمية ثابتة في أيّ معجم."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سَوَّاق"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة فَعَّال المعتمدة من مجمع اللغة المصري للدلالة على الاحتراف، مسجّلة في الوسيط والأساسي والمنجد بمعنى السائق. يضيف بُعداً دلالياً مميّزاً (الاحتراف) غير موجود في «سائق»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الاحتراف والمهنة بصيغة فَعَّال، بخلاف «سائق» الذي يصلح لكلّ من يقود مركبة سواء احترف ذلك أم لا"
      actions:
        - command: create_entry
          params: {lemma: "سَوَّاق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "قَائِد"
      source: stage1
      decision: removed
      decision_reason: "دلالته المعجمية الأساسية «من يقود الجيش»، ولا يُستعمل مفرداً للدلالة على سائق المركبة في المعاجم. استعماله بمعنى driver في المصطلحية الحاسوبية (البرمجي) يزيد الالتباس."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "حَوْذِيّ"
      source: stage1
      decision: removed
      decision_reason: "دلالته المعجمية محصورة في «سائق العربة» المجرورة بالدوابّ، ولم يُوسَّع في المعاجم الحديثة ليشمل المركبة الآلية. إدراجه قد يوحي بمعادلة خاطئة مع driver الحديث."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

