# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13577452-n (slippage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «انزلاق» هي نفسها المستخدمة في التعريف (بسبب الانزلاق)، مما يُحدث دوراناً تعريفياً"
      - "المجموعة تحتوي لمّة واحدة فقط، وهي تدلّ على فعل الانزلاق ذاته لا على النتيجة (فقد القدرة)"
      - "التعريف ترجمة شبه حرفية للتعريف الإنجليزي"
    observations: "المفهوم المُعرَّف هو الأثر الناتج عن الانزلاق في المنظومات الميكانيكية (نقص القدرة المنقولة)، لا فعل الانزلاق نفسه. في الاصطلاح التقني العربي يُستخدم «انزلاق» للدلالة على slip وslippage معاً بالتعميم، لكنّ المورد الحديث يميّز بينهما فيترجم slippage بـ«التفويت» في السياق الميكانيكي. الجذر ز-ل-ق في مقاييس اللغة يدلّ على تزلّج الشيء عن مقامه."
  blind_candidates:
    - lemma: "تَفْوِيت"
      generation_method: ishtiqaq
      justification: "مصدر تفعيل من الجذر ف-و-ت الدالّ على خلاف الإدراك والوصول إلى الشيء. التفويت يدلّ على إضاعة جزء من القدرة المنقولة، وهو ما يقابل المفهوم الدقيق لـ slippage بوصفه النقص الناجم عن الانزلاق لا الانزلاق ذاته"
    - lemma: "تَزَلُّق"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من الجذر ز-ل-ق، يؤدّي دلالة مقاربة لـ«انزلاق» مع إيحاء بالتكرار والتدرّج"
    - lemma: "هَدْر"
      generation_method: majaz
      justification: "مجاز من هَدَرَ الدمُ (بَطَلَ وذهب سُدًى) إلى ضياع القدرة الميكانيكية. المعنى الأصلي في مقاييس اللغة: سقوط الشيء وإسقاطه"
    - lemma: "فَقْد"
      generation_method: ishtiqaq
      justification: "مصدر فَقَدَ على وزن فَعْل، يدلّ على ضياع الشيء. يُستخدم في المصطلحات التقنية: فقد القدرة = power loss"

stage2_evidence:
  per_lemma:
    - lemma: "اِنْزِلَاق"
      confirm:
        - text: "«انزلاق — slip»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«انزلاق — slip»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«انزلاق — slippage; wheelspin»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "«انـزلاق — slippage: فعل نزوع نحو شيء دون إرادة، يلخِّص الإسراع النسبي في التعبير عن حالة انزياح عن الموضوع لتعزيزه بشكل مساعد»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«انزلاق — slip»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
        - text: "«انزلاق — slipping»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«(فِى عِلْمِ النبات): وَصْفٌ لِنُمُوِّ مُحيط الكمبيوم إذا كان ناشِئًا عـن انْزلاقِ الخلايا بـعـد انْقِسامِها بحيث تَتَجاوَزُ مُحيطِيًّا بـدلَ أن تَتَجاوَزَ قُطْرِيًّا»"
          source: "المعجم الكبير"
          addition: "دلالة نباتية متخصصة للانزلاق تختلف عن الدلالة الميكانيكية"
        - text: "«الزَّاءُ وَاللَّامُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَزَلُّجِ الشَّيْءِ عَنْ مَقَامِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الجذري يدلّ على الزحلقة والتزحلق، وهو الأساس الاشتقاقي لاستعمال انزلاق في السياق الميكانيكي"

    - lemma: "تَفْوِيت"
      confirm:
        - text: "«(1) مص slip (2) التَّفويت أو نسبة التَّفويت (مك).» [مقابل slippage]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْفَاءُ وَالْوَاوُ وَالتَّاءُ أُصَيْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ إِدْرَاكِ الشَّيْءِ وَالْوُصُولِ إِلَيْهِ. يُقَالُ: فَاتَهُ الشَّيْءُ فَوْتًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ف-و-ت يدلّ على عدم إدراك الشيء، فالتفويت هو إضاعته وعدم الوصول إليه، وهو ما يناسب مفهوم فقد جزء من القدرة المنقولة"

    - lemma: "تَزَلُّق"
      contradicts:
        - text: "«التَّزَلُّقُ على الماءِ (فى التربية الـريـاضية): انْزْلاقُ الـلاعِـبِ فَوْقَ المـاءِ مصحوبًا بقاربٍ بُخارِىّ وهـو مُرْتَدٍ زَلَّاجاتٍ فِى قدميهِ»"
          source: "المعجم الكبير"
          conflict: "التزلّق مرتبط بالتزلّج الرياضي على الماء وليس بفقد القدرة الميكانيكية"

    - lemma: "هَدْر"
      contradicts:
        - text: "«الْهَاءُ وَالدَّالُ وَالرَّاءُ [يَدُلُّ] عَلَى سُقُوطِ شَيْءٍ وَإِسْقَاطِهِ، وَعَلَى جِنْسٍ مِنَ الصَّوْتِ. وَهَدَرَ السُّلْطَانُ دَمَ فُلَانٍ هَدْرًا: أَبَاحَهُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الهدر يدلّ على البطلان والضياع المطلق، وليس على النقص الجزئي الناجم عن الانزلاق تحديداً"
      expands:
        - text: "«تبديد القُدرة: فقدان الطاقة المفيدة في وحدة زمنية مُعينة» [مقابل power loss]"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "المصطلح التقني لـ power loss هو «تبديد» أو «فقد» لا «هدر»"

    - lemma: "فَقْد"
      confirm:
        - text: "«فقد (القدرة) — (power) loss»"
          source: "موسوعة الكهرباء (IEC 60050)"
      contradicts:
        - text: "«فقد القدرة (لآلة) الفقد الكلي (لآلة) — power losses (of a machine); total loss (of a machine)»"
          source: "موسوعة الكهرباء (IEC 60050)"
          conflict: "«فقد القدرة» مصطلح عامّ لأيّ نقص في القدرة (حراري، كهربائي، ميكانيكي...)، وليس خاصاً بالانزلاق"

stage3_analysis:
  per_lemma:
    - lemma: "اِنْزِلَاق"
      decision: confirmed
      decision_reason: "مصطلح راسخ في المعاجم التقنية العربية الموحّدة عبر مجالات عديدة (فيزياء، كهرباء، نقل، جيولوجيا) كمقابل لـ slip وslippage. رغم أنّ الدلالة الأصلية تركّز على فعل الانزلاق أكثر من نتيجته، فإنّ التعميم الاصطلاحي جعله يشمل المفهومين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْزِلَاق"

    - lemma: "تَفْوِيت"
      source: stage1
      decision: confirmed
      decision_reason: "المورد الحديث (2008) يذكره صراحةً كمقابل لـ slippage في السياق الميكانيكي (مك). الجذر ف-و-ت يدلّ على خلاف الإدراك والوصول، فالتفويت يعني إضاعة جزء من القدرة، وهو أدقّ من «انزلاق» في التعبير عن النتيجة (فقد القدرة) لا السبب (الانزلاق)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَفْوِيت", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13577452-n"}

    - lemma: "تَزَلُّق"
      source: stage1
      decision: removed
      decision_reason: "المعجم الكبير يقصره على التزلّج الرياضي على الماء. لم يرد في أيّ معجم تقني كمقابل لـ slippage أو slip في السياق الميكانيكي."

    - lemma: "هَدْر"
      source: stage1
      decision: removed
      decision_reason: "الهدر يدلّ على البطلان والضياع الكلي (هدر الدم)، لا على النقص الجزئي المقيّد بسبب محدد (الانزلاق). المصطلح التقني لفقد القدرة هو «تبديد» أو «فقد» لا «هدر»."

    - lemma: "فَقْد"
      source: stage1
      decision: removed
      decision_reason: "فقد القدرة مصطلح عامّ يشمل جميع أسباب نقص القدرة (حرارية، كهربائية، احتكاكية...)، وليس خاصاً بالانزلاق. إضافته ستوسّع الدلالة بما يتجاوز حدود المجموعة."

