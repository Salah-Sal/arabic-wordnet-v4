# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10757088-n
# a person who unfastens or unwraps or opens
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «فَاكّ» لها معنى معجمي سلبي مسجَّل في المعجم الوسيط (الشديد الحمق والهرم)، مما قد يوقع لبساً دلالياً"
      - "المفهوم بسيط (شخص يفك/يفتح) وقد لا يحتاج إلى أكثر من لمّتين"
    observations: "المجموعة تصف فاعلاً بشرياً يقوم بفعل الفكّ أو الفتح أو الحلّ. المفهوم عامّ غير متخصص، واسم الفاعل العربي من الأفعال الثلاثة (حلّ، فكّ، فتح) هو الطريقة الطبيعية للتعبير عنه. الاسم الفوقي (عامل/فاعل) يتّسق مع كون المدخل يصف شخصاً يؤدّي عملاً."

  blind_candidates:
    - lemma: "فَاتِح"
      generation_method: ishtiqaq
      justification: "اسم فاعل من فَتَحَ يَفْتَحُ على وزن فَاعِل، يدلّ على مَن يقوم بفعل الفتح وهو أحد المعاني الأساسية في التعريف"
    - lemma: "حَلَّال"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من حَلَّ يَحُلُّ على وزن فَعَّال، تدلّ على كثير الحلّ والفكّ"
    - lemma: "نَاقِض"
      generation_method: ishtiqaq
      justification: "اسم فاعل من نَقَضَ يَنْقُضُ بمعنى حلّ الشيء المبرم وفكّه"
    - lemma: "كَاشِف"
      generation_method: majaz
      justification: "مجاز من كشف الغطاء عن الشيء، إذ الكشف يستلزم الفتح والإزالة"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    # === اللمّات الموجودة ===
    - lemma: "حَالّ"
      confirm:
        - text: "«الحالّ: بتشديد اللام»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(حَلَّ) الْحَاءُ وَاللَّامُ لَهُ فُرُوعٌ كَثِيرَةٌ وَمَسَائِلُ، وَأَصْلُهَا كُلُّهَا عِنْدِي فَتْحُ الشَّيْءِ، لَا يَشِذُّ عَنْهُ شَيْءٌ. يُقَالُ حَلَلْتُ الْعُقْدَةَ أَحُلُّهَا حَلًّا. وَيَقُولُ الْعَرَبُ: يَا عَاقِدُ اذْكُرْ حَلًّا»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«وَالْحَلَالُ: ضِدُّ الْحَرَامِ، وَهُوَ مِنَ الْأَصْلِ الَّذِي ذَكَرْنَاهُ، كَأَنَّهُ مِنْ حَلَلْتُ الشَّيْءَ، إِذَا أَبَحْتَهُ وَأَوْسَعْتَهُ لِأَمْرٍ فِيهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر حلّ أصله فتح الشيء وحلّ العقدة، والحلال فرع منه"

    - lemma: "فَاكّ"
      confirm:
        - text: "«(فَكٌّ) الْفَاءُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَفَتُّحٍ وَانْفِرَاجٍ. مِنْ ذَلِكَ فَكَاكُ الرَّهْنِ، وَهُوَ فَتْحُهُ مِنَ الِانْغِلَاقِ. وَيُقَالُ: فَكَكْتُ الشَّيْءَ أَفُكُّهُ فَكًّا»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«(الفَاكُّ) من الرجال: الشديدُ الحُمق الهَرِمُ»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي المسجّل للفاكّ كاسم هو الأحمق الهرم، لا مَن يَفُكُّ الأشياء"

    # === مرشحات المرحلة ١ ===
    - lemma: "فَاتِح"
      confirm:
        - text: "«فَاتِح: من (فت ح) الغازي والبادئ والمهيئ للأمر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(فَتَحَ) الْفَاءُ وَالتَّاءُ وَالْحَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الْإِغْلَاقِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«فَاتِح (ملامس فتح)»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ARABTERM)"
          addition: "يُستخدم فَاتِح في المصطلحية الحديثة بمعنى الأداة أو الملامس الذي يفتح"
        - text: "«وَالْفَتْحُ وَالْفِتَاحَةُ: الْحُكْمُ. وَاللَّهُ تَعَالَى الْفَاتِحُ، أَيِ الْحَاكِمُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الفَاتِح أيضاً بمعنى الحاكم في الاستعمال القرآني والكلاسيكي"

    - lemma: "حَلَّال"
      contradicts:
        - text: "«الحَلال: كل شيء لا يعاقَب عليه باستعماله. الحلال: ما أطلق الشرع فعله»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "صيغة حَلَّال قريبة لفظاً من حَلَال الفقهي، مما يوقع لبساً شديداً"

    - lemma: "نَاقِض"
      expands:
        - text: "«(نَقَضَ) النُّونُ وَالْقَافُ وَالضَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نَكْثِ شَيْءٍ. وَنَقَضْتُ الْحَبْلَ وَالْبِنَاءَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "النقض يدلّ على نكث الشيء المبرم وهدمه، وهو أقرب إلى التخريب منه إلى الفكّ المحايد"

    - lemma: "كَاشِف"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "حَالّ"
      decision: confirmed
      decision_reason: "اسم فاعل صحيح من حَلَّ يَحُلُّ (فكّ العقدة وفتح الشيء). الجذر مؤصَّل في مقاييس اللغة بمعنى «فتح الشيء». الصيغة فصيحة مطّردة على وزن فَاعِل من المضعَّف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على فكّ العُقَد والأربطة وحلّ ما كان مشدوداً أو مُحكماً، وفيه دلالة على الإتاحة والتيسير بعد المنع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالّ"

    - lemma: "فَاكّ"
      decision: confirmed
      decision_reason: "اسم فاعل صحيح من فَكَّ يَفُكُّ. الجذر في مقاييس اللغة يدلّ على «تفتّح وانفراج». رغم أنّ المعجم الوسيط سجّل للفاكّ معنى سلبياً (الأحمق الهَرِم)، فإنّ ذلك معنى مستقلّ لا يُلغي الاستعمال الاشتقاقي المنتظم كاسم فاعل. التعارض المعجمي يستدعي التنبيه لا الحذف."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الفكّ المادّي المباشر: فصل الأجزاء المتّصلة وإزالة القيود والأقفال، بخلاف حَالّ الذي يغلب عليه حلّ العُقَد والأربطة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَاكّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "فَاتِح"
      source: stage1
      decision: removed
      decision_reason: "رغم صحّة الاشتقاق (اسم فاعل من فتح)، فإنّ الدلالة المعجمية الغالبة لـ«الفاتح» هي الغازي المنتصر أو الحاكم (من أسماء الله الحسنى)، والاستعمال التقني الحديث خاصّ بالأدوات (فتّاحة) لا بالأشخاص. إضافته ستوقع لبساً مع المعاني الراسخة."
      evidence_assessment:
        case: mixed

    - lemma: "حَلَّال"
      source: stage1
      decision: removed
      decision_reason: "صيغة المبالغة فَعَّال غير مسجّلة معجمياً بمعنى «مَن يحلّ الأشياء»، والقرب اللفظي الشديد من «حَلَال» (ضدّ الحرام) يجعلها مصدر لبس خطير."
      evidence_assessment:
        case: contradicts_only

    - lemma: "نَاقِض"
      source: stage1
      decision: removed
      decision_reason: "دلالة النقض في التراث العربي تتمحور حول الهدم والنكث (نقض العهد، نقض البناء)، وهي أقرب إلى التخريب منها إلى الفكّ المحايد الذي يصفه التعريف. لا يصلح بديلاً دلالياً."
      evidence_assessment:
        case: no_material

    - lemma: "كَاشِف"
      source: stage1
      decision: removed
      decision_reason: "الكشف يدلّ على إزالة الغطاء والستر وإظهار المخفيّ، وهو بعيد دلالياً عن مفهوم فكّ الأربطة وفتح المغلقات. لا أدلّة معجمية تدعم هذا الاستعمال."
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يفك أو يفتح شيئاً ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول البنية لكنه أقرب إلى الترجمة الحرفية للتعريف الإنجليزي. يحتاج إلى صياغة أدقّ بأسلوب المعجم الوسيط مع ذكر الحلّ إلى جانب الفكّ والفتح."
    authored:
      - type: terminological
        text: "مَنْ يَحُلُّ الرِّبَاطَ أَوْ يَفُكُّ الْقَيْدَ أَوْ يَفْتَحُ الْمُغْلَقَ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ يَحُلُّ الرِّبَاطَ أَوْ يَفُكُّ الْقَيْدَ أَوْ يَفْتَحُ الْمُغْلَقَ"

  examples:
    per_lemma:
      - lemma: "حَالّ"
        examples:
          - text: "جاءَ الحَالُّ فَفَكَّ عُقَدَ الحِبَالِ الَّتِي تُثَبِّتُ الخَيْمَةَ اسْتِعْدَادًا لِلرَّحِيلِ."
            type: usage
      - lemma: "فَاكّ"
        examples:
          - text: "اسْتَعَانُوا بِفَاكٍّ مَاهِرٍ لِفَتْحِ الْقُفْلِ الصَّدِئِ الَّذِي اسْتَعْصَى عَلَيْهِمْ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "جاءَ الحَالُّ فَفَكَّ عُقَدَ الحِبَالِ الَّتِي تُثَبِّتُ الخَيْمَةَ اسْتِعْدَادًا لِلرَّحِيلِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اسْتَعَانُوا بِفَاكٍّ مَاهِرٍ لِفَتْحِ الْقُفْلِ الصَّدِئِ الَّذِي اسْتَعْصَى عَلَيْهِمْ."

