    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي. يحتاج إلى صياغة عربية أصيلة تستعمل المصطلحات العربية المعتمدة (النشادر بدل الأمونيا) وتضيف السياق التاريخي"
    authored:
      - type: terminological
        text: "طريقةٌ صناعيةٌ لتخليق النُّشادر (الأمونيا) بدمج النِّتروجين والهِيدروجين تحت ضغط مرتفع بحضور حَفَّاز من الحديد"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "طريقةٌ صناعيةٌ ابتكرها الكيميائي الألماني فريتس هابر عام 1909م وطوّرها كارل بوش صناعياً، تقوم على تفاعل النِّتروجين الجوّي مع الهِيدروجين عند ضغط يتراوح بين 150 و300 جوّ ودرجة حرارة نحو 500°م بحضور حَفَّاز حديدي لإنتاج النُّشادر (NH₃)، وتُعدّ أساس صناعة الأسمدة النِّتروجينية في العالم"
