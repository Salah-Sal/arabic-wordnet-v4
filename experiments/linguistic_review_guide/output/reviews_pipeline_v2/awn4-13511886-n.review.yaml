# مراجعة المجموعة الترادفية: awn4-13511886-n — عملية هابر
# Review Pipeline v2.0
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عملية هابر، عملية هابر-بوش) كلتاهما تعتمدان على تعريب اسم العَلَم الأجنبي (هابر، بوش) دون وجود بديل عربي صرف"
      - "اللمّتان بدون تشكيل كامل — تحتاجان إلى ضبط"
      - "لا يوجد مصطلح عربي أصيل يعبّر عن هذه العملية المحددة تاريخياً دون الإحالة إلى اسم مخترعها"
    observations: >
      هذه المجموعة تمثّل عملية كيميائية صناعية محددة تاريخياً مسمّاة باسم مخترعيها (فريتس هابر وكارل بوش).
      المفهوم متخصص جداً ولا يوجد له مقابل عربي تراثي. التسمية بالنسبة (عملية هابر) هي السائدة
      في الأدبيات العلمية العربية وفي المعاجم المصطلحية المعتمدة (المعجم الموحد لمصطلحات الكيمياء).
      البديل الوصفي «تخليق النشادر» يصف الناتج لا العملية المحددة ذاتها.
  blind_candidates:
    - lemma: "تَخْلِيقُ النُّشَادِر"
      generation_method: tarkib
      justification: "مركب إضافي من «تخليق» (صناعة مركّب كيميائي) و«النشادر» (المقابل العربي التراثي للأمونيا)، يصف جوهر العملية وهو إنتاج النشادر صناعياً"
    - lemma: "إِجْرَاءُ هَابِر"
      generation_method: taarib
      justification: "بديل لـ«عملية» بلفظ «إجراء» مع تعريب اسم العَلَم هابر، على نمط التسميات المصطلحية في الكيمياء العربية"
    - lemma: "تَصْنِيعُ النُّشَادِر"
      generation_method: tarkib
      justification: "مركب إضافي يستخدم «تصنيع» بدلاً من «تخليق» للدلالة على الطابع الصناعي للعملية مع «النشادر» العربي"
    - lemma: "عَمَلِيَّةُ هَابِر"
      generation_method: taarib
      justification: "تعريب مباشر لاسم العملية المنسوبة إلى مخترعها، وهو النمط السائد في المصطلحات الكيميائية العربية للعمليات المسمّاة"

stage2_evidence:
  per_lemma:
    - lemma: "عَمَلِيَّةُ هَابِر"
      confirm:
        - text: "«عملية هابر، إجراء هابر»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«(العملية) جملة أعمال تُحدث أثراً خاصّاً مثل عملية جراحية»"
          source: "المعجم الوسيط"
          addition: "تعريف العملية كجملة أعمال تحدث أثراً خاصاً ينطبق على المفهوم"
    - lemma: "عَمَلِيَّةُ هَابِر-بُوش"
      evidence_status: "no_material_found"
    - lemma: "تَخْلِيقُ النُّشَادِر"
      expands:
        - text: "«نُشادر: (كم) غاز عديم اللّون، نفّاذ الرائحة أخفّ من الهواء، شديد الذوبان في الماء، يستخدم في الصناعة والطبِّ والزِّراعة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يؤكد أن النشادر هو المقابل العربي للأمونيا"
      contradicts:
        - text: "«توليد الأمونيا: عمليات وتفاعلات بيوكيميائية حيث يتم تحويل نيتروجين مركبات عضوية إلى نشادر»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          conflict: "توليد الأمونيا يشير إلى العمليات البيوكيميائية لا الصناعية، مما يبيّن أن «تخليق النشادر» وصفي عام لا يحدد عملية هابر بعينها"
    - lemma: "إِجْرَاءُ هَابِر"
      confirm:
        - text: "«عملية هابر، إجراء هابر»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "تَصْنِيعُ النُّشَادِر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "عَمَلِيَّةُ هَابِر"
      decision: confirmed
      decision_reason: >
        مصطلح مثبت في المعجم الموحد لمصطلحات الكيمياء (1992) الصادر عن مكتب تنسيق التعريب بالرباط.
        هو التسمية الأكثر شيوعاً في الأدبيات الكيميائية العربية لهذه العملية الصناعية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم المختصر للعملية المنسوبة إلى فريتس هابر وحده، يُستعمل في السياقات العامة والتعليمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّةُ هَابِر"

    - lemma: "عَمَلِيَّةُ هَابِر-بُوش"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للعملية الذي يُنسب الفضل لكل من فريتس هابر (المخترع) وكارل بوش (المطوّر الصناعي).
        وإن لم يُعثر عليه في قاعدة البيانات المعجمية، فهو الاسم الدقيق المستعمل في المراجع الكيميائية المتخصصة
        وفي ترجمات الموسوعات العلمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل الذي يُنسب العملية إلى هابر وبوش معاً، يُستعمل في السياقات الأكاديمية والمتخصصة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّةُ هَابِر-بُوش"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَخْلِيقُ النُّشَادِر"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي عام يصف ناتج العملية (إنتاج النشادر) لا العملية التاريخية المحددة ذاتها.
        يمكن أن يشمل أي طريقة لإنتاج النشادر (بيولوجية أو كيميائية أخرى)، فلا يصلح مرادفاً دقيقاً.
      evidence_assessment:
        case: mixed

    - lemma: "إِجْرَاءُ هَابِر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وروده في المعجم الموحد لمصطلحات الكيمياء كمرادف لـ«عملية هابر»، فإن لفظ «إجراء»
        أقل شيوعاً في الاستعمال العلمي العربي من «عملية» في سياق العمليات الكيميائية الصناعية.
        إبقاؤه قد يُثقل المجموعة دون فائدة تمييزية واضحة. يمكن إضافته كصيغة بديلة (form) لا كلمّة مستقلة.
      evidence_assessment:
        case: confirm_only

    - lemma: "تَصْنِيعُ النُّشَادِر"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ لا يُعدّ مصطلحاً مسكوكاً، ولم يُعثر عليه في أي معجم مصطلحي.
        يصف العملية الصناعية عموماً لا عملية هابر تحديداً.
      evidence_assessment:
        case: no_material

    - lemma: "عَمَلِيَّةُ هَابِر"
      source: stage1
      decision: removed
      decision_reason: "مكرر مع اللمّة الموجودة — لا حاجة لإضافته"

stage4_content:
