stage1_review:
  assessment:
    concerns:
      - "لمّة «جوهر» تظهر أيضاً في المجموعة الأمّ (awn4-00019793-n = المادّة/الجَوْهَر)، ممّا يُوقع التباساً بين المادّة العامّة والخُلاصة المُستخرَجة"
      - "اللمّتان بلا تشكيل: «جوهر» و«خلاصة» — يجب إضافة التشكيل الكامل"
      - "التعريف العربيّ ترجمة حرفيّة للإنجليزيّ، ركيكُ التركيب (يتم استخراجها منه)"
    observations: "المفهوم يدور حول المادّة المُركَّزة المُستخلصة من نبات أو عقار تحمل خصائصه الغالبة بدرجة عالية. هذا مفهوم كيميائيّ-صيدلانيّ له مقابلات عربيّة راسخة في لغة الطبّ والصيدلة."
  blind_candidates:
    - lemma: "رُوح"
      generation_method: majaz
      justification: "الرُّوح في الاصطلاح الطبّيّ والصيدلانيّ العربيّ تعني المادّة الطيّارة المُستخلصة بالتقطير من نبات أو عقار، فكأنّها روح ذلك النبات وحقيقته الكامنة فيه"
    - lemma: "مُسْتَخْلَص"
      generation_method: ishtiqaq
      justification: "اسم مفعول من اسْتَخْلَصَ (استفعل من خَلَصَ)، على وزن مُسْتَفْعَل الدالّ على ناتج فعل الاستخلاص، وهو مصطلح معياريّ في الكيمياء والصيدلة"
    - lemma: "عُصَارَة"
      generation_method: ishtiqaq
      justification: "من الجذر ع ص ر على وزن فُعَالَة الدالّ على ما يتحلّب من الشيء بالعصر، وهو لفظ فصيح قديم أقرّه المعجم الوسيط"
    - lemma: "زُبْدَة"
      generation_method: majaz
      justification: "مجاز من الزُّبْدة بمعنى صفوة الشيء وخالصه، يُقال زُبْدة الكلام وزُبْدة الشيء أي خُلاصته"

stage2_evidence:
  per_lemma:
    - lemma: "جَوْهَر"
      confirm:
        - text: "«جوهر، روح، عِطْر»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«(1) جوهر الشَّيء أو كُنْهُهُ (2) الماهيّة؛ الذات (3) «أ», الرُّوح: «ب» مادة مستخلصة من نبات أو مخدِّر بطريق التقطير. «ج» محلول هذه المادة في الكحول (4) عِطْر»"
          source: "المورد الحديث (2008)"
        - text: "«1- ما قام بنفسه ويكون سبباً لخواص الجنس. 2- الجزء الطيار من المادة بعد تقطيرها مثل روح النعناع»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«حقيقة الشّيء وذاته أو أصله ومادّتُه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "الدلالة الأساسيّة لجوهر هي الحقيقة والذات، وليس الاستخلاص الكيميائيّ"
        - text: "«الجوهر: ماهية إذا وجدت في الأعيان كانت لا في موضع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المعنى الفلسفيّ الاصطلاحيّ (المقابل لـ substance) هو الأغلب في المعاجم الكلاسيكيّة"

    - lemma: "خُلاصَة"
      confirm:
        - text: "«زُبْدة الشيء ... ما يُستخرجُ من المادة حاوياً لخصائصها»"
          source: "المعجم الوسيط"
        - text: "«زُبْدَةُ الشَّىءِ ما يُسْتَخْرَجُ من المادَّةِ حاوِيًا لخصائِصِها»"
          source: "المعجم الكبير"
        - text: "«شكل صيدلانيّ يحصل عليه من معالجة مادة نباتية أو حيوانية بسائل ثم تبخيره»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مركب عياري مركز يحتوي على المواد الفعالة المستخلصة من نبات أو حيوان»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«عصارة»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"

    - lemma: "رُوح"
      confirm:
        - text: "«رُوح، خُلاصة — مادة مستخلصة من نبات أو عقار بطريقة التقطير»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«روح — essence»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«1- جوهرة 2- روح — الجزء الطيار من المادة بعد تقطيرها مثل روح النعناع»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«الرُّوحُ، بالضم: ما به حَياةُ الأَنْفُسِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "المعنى الأصليّ هو ما به حياة النفس، واستُعير في الكيمياء والصيدلة للمادّة الطيّارة الجامعة لخصائص المنبت"

    - lemma: "مُسْتَخْلَص"
      confirm:
        - text: "«مستحضر محتو على الجواهر الفعّالة المخرجة بمذيب أو بالعصر»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«المادة التي تكون عادة فعالة متحصل عليها بواسطة مذيب مناسب من نسيج حيويّ»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«السائل الرائق الناتج عن غلي القهوة بالماء» (مُسْتَخلَص القهوة)"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "المستخلَص أعمّ من الخلاصة والروح إذ يشمل أيّ ناتج استخلاص بغضّ النظر عن درجة التركيز"

    - lemma: "عُصَارَة"
      confirm:
        - text: "«نفايةُ ما عُصِرَ»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«العصار وَيُقَال اشتف فلَان عصارة أرضي أَخذ غَلَّتهَا وَهُوَ كريم العصارة جواد كريم عِنْد الْمَسْأَلَة ونفاية مَا عصر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
          conflict: "العصارة في المعجم الوسيط نُفاية ما عُصِر وليست الخلاصة المركّزة ذات الخصائص الغالبة، بل الفضلة المتبقّية"

    - lemma: "زُبْدَة"
      contradicts:
        - text: "«المنتج الدهنيّ المستخرج من الحليب أو القشد ويحتوي على %15ـ20 ماء ومواد حليبية غير دهنية»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "زُبْدَة في المعاجم المصطلحيّة تعني الزبدة الغذائيّة فقط، واستعمالها بمعنى الخُلاصة مجازيّ غير مصطلحيّ"

