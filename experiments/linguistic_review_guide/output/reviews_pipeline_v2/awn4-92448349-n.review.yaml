stage4_content:
  definition:
    current: "حالة يمتلك فيها البائعون معلومات لا يمتلكها المشترون (أو العكس) حول جانب من جوانب جودة المنتج."
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية عن الإنجليزية، يفتقر إلى الجنس القريب الواضح ولا يذكر
        الأثر الاقتصادي الجوهري (إخلال بتوازن السوق). كما أن عبارة «أو العكس» مبهمة.
    authored:
      - type: terminological
        text: "ظاهرةٌ اقتصاديّةٌ تنشأ من عدم تماثل المعلومات بين طرفَيِ الصفقة، بحيث يستغلّ الطرفُ الأكثرُ اطّلاعاً على حقيقة السلعة أو الخدمة تفوُّقَه المعلوماتيَّ، فتنسحب السلعُ الجيّدة من السوق وتبقى الرديئة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ظاهرةٌ في أسواق التأمين والائتمان والسلع المستعملة وغيرها، تحدث حين يملك أحدُ طرفَيِ المعاملة معلوماتٍ خافيةً على الطرف الآخر بشأن جودة المنتج أو درجة المخاطرة، فيختلّ التوازن السعريّ ويُطرَد المنتجون الجيّدون من السوق. وصفها الاقتصاديُّ جورج أكرلوف (١٩٧٠) في نموذج «سوق الليمون» (سوق السيّارات المعيبة)."
