        mwe_type: wasfi
      nuance_differentiation: >
        الأكثر شيوعاً في الكتابات الاقتصادية الأكاديمية العربية، ويُفضَّل في السياقات النظرية
        والأكاديمية. يحمل دلالة «العكس» أي أن الاختيار يأتي بنتيجة معاكسة لما يتوقعه الطرف
        الأقل اطلاعاً.
