# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92448349-n
# adverse selection — الاختيار العكسي / الانتقاء السلبي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «اختيار عكسي» تترجم adverse بـ«عكسي» (= reverse/inverse) لا بـ«سلبي» أو «ضائر» (= adverse/harmful)؛ وقد وُجد في ARABTERM أن «اختيار عكسي» يعني reverse selection في علم الوراثة وهو مفهوم مختلف تماماً"
      - "اللمّة «انتقاء سلبي» وُجدت في ARABTERM بمعنى negative picking في اللوجستيات لا بمعنى الاختيار العكسي الاقتصادي"
      - "المصطلح المعتمد في ARABTERM للاختيار العكسي الاقتصادي هو «اختيار سلبي» (مسرد المناخ والبيئة) و«انتقاء ضائر» (المعجم الطبي الموحد)"
      - "التعريف العربي الحالي ترجمة حرفية عن الإنجليزية ولا يميّز المفهوم الاقتصادي بوضوح"
    observations: >
      المجموعة تعبّر عن مفهوم «الاختيار المعاكس» (adverse selection) وهو ظاهرة اقتصادية ناجمة عن
      عدم تماثل المعلومات بين طرفي الصفقة. المفهوم وثيق الصلة بمفهوم «الغَرَر» في الفقه الإسلامي
      (بيع ما يُجهل عاقبتُه) لكنه أضيق نطاقاً وأكثر تخصصاً. اللمّتان الموجودتان كِلتاهما من باب
      النقل الاصطلاحي (calque) من الإنجليزية وهما مقبولتان في الاستعمال الاقتصادي العربي المعاصر
      رغم عدم دقة الترجمة اللفظية.

  blind_candidates:
    - lemma: "غَرَرٌ"
      generation_method: majaz
      justification: >
        مصطلح فقهي إسلامي يدلّ على الخطر والجهالة في المعاملات التجارية، من بيع ما لا يُدرى
        أيكون أم لا. يشترك مع المفهوم في عنصر جهالة أحد الطرفين بحقيقة المبيع، لكنه أعمّ
        من الاختيار العكسي المحدّد بعدم تماثل المعلومات.
    - lemma: "اِنْتِقَاء مُعَاكِس"
      generation_method: tarkib
      justification: >
        مركب وصفي من «انتقاء» (= selection) و«معاكس» (= adverse/opposing). الوصف «معاكس»
        أقرب دلالياً إلى adverse من «عكسي» لأنه يحمل معنى المقاومة والضرر لا مجرد العكس الرياضي.
    - lemma: "اِخْتِيَار سَلْبِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «اختيار» و«سلبي» (= negative/adverse). يجمع بين جذر «خير» الشائع
        في سياق الانتقاء والتفضيل، والوصف «سلبي» الذي يؤدي معنى adverse في الاستعمال
        الاقتصادي العربي المعاصر.
    - lemma: "تَغَابُن"
      generation_method: ishtiqaq
      justification: >
        مصدر تفاعل من الجذر «غبن» الدالّ على الخديعة والاهتضام في البيع والشراء. وزن تَفَاعُل
        يفيد المشاركة، فيدلّ على تبادل الغبن بين المتبايعَيْن. لكنه مصطلح قرآني ثابت (يوم التغابن)
        ودلالته أعمّ من المفهوم الاقتصادي المحدّد.

stage2_evidence:
  per_lemma:
    - lemma: "اِخْتِيَار عَكْسِيّ"
      contradicts:
        - text: "«انتقاء صفة أثناء التجربة عكس الصفة التي اختيرت سابقا فيها.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          conflict: "المدخل يعرّف «اختيار عكسي» بمعنى reverse selection في علم الوراثة وهو مفهوم مختلف تماماً عن adverse selection الاقتصادي"
      expands:
        - text: "«الاختيار: طلب ما فعله خير.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الأصل اللغوي لكلمة اختيار: طلب الأفضل والأخير"

    - lemma: "اِنْتِقَاء سَلْبِيّ"
      contradicts:
        - text: "«يتم استخدام إجراءالانتقاء السلبي في حالات التفريغ فقط في حالة ما إذا توفير يكون مخزون الوحدة أقل بنسبة طفيفة من الكمية المطلوبة.»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "المدخل يعرّف «انتقاء سلبي» بمعنى negative picking في اللوجستيات لا بمعنى الاختيار المعاكس الاقتصادي"

    - lemma: "غَرَرٌ"
      confirm:
        - text: "«الغرر: ما يكون مجهول العاقبة لا يدرى أيكون أم لا.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الغَرَر: الخطر والتعريض للهلكة، وبيع الغرر: بيع ما يجهله المتبايعان أو ما لا يوثق بتسلمه كبيع السمك في الماء أو الطير في الهواء»"
          source: "المعجم الوسيط"
        - text: "«الغرر: بالفتح، الخطر، وهو من الغرر، ومنه نهى عن بيع الغرر.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«الغرر: بفتحتين اسم من التغرير بالراء وهو التعريض للهلاك. وشرعا ما يوهم أنه ليس بموجود»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "البُعد الشرعي للمصطلح: ما يوهم وجوده وليس بموجود"
        - text: "«غرر، خطر»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "المصطلح مسجّل في المعجم القانوني بمعنى hazard"

    - lemma: "اِنْتِقَاء مُعَاكِس"
      evidence_status: "no_material_found"

    - lemma: "اِخْتِيَار سَلْبِيّ"
      confirm:
        - text: "«المبدأ الذي يقول أن معظم أولئك الذين يشترون عقدة التأمين يميلون إلى أن يكونون الأكثر عرضة للخطر، ولكن عقد تأمين بثمن باهظ (لتغطية مخاطر عالية) سوف تثبط من هم في خطر أقل من شراء التأمين على الإطلاق. عند مفاوضات بين شخصين مع معلومات غير متماثلة فإن ذلك يحد من جودة المفاوضات.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"

    - lemma: "تَغَابُن"
      contradicts:
        - text: "«القومُ: غبنَ بعضهم بعضاً. له: تقاعد حتى غُبِنَ»"
          source: "المعجم الوسيط"
          conflict: "التغابن يدلّ على التبادل العام للغبن والخديعة وليس على عدم تماثل المعلومات تحديداً"
      expands:
        - text: "«يوم التغابن في التنزيل العزيز: {يَوْمَ يَجْمَعُكُمْ لِيَوْمِ الْجَمْعِ ذَلِكَ يَوْمُ التَّغَابُنِ}؛ المراد به: يوم القيامة»"
          source: "المعجم الوسيط"
          addition: "المصطلح مثقل بدلالة قرآنية ثابتة (يوم القيامة) تجعل استعماله في السياق الاقتصادي ملتبساً"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِخْتِيَار عَكْسِيّ"
      decision: confirmed
      decision_reason: >
        رغم أن المدخل الوحيد في ARABTERM يعرّف «اختيار عكسي» بمعنى reverse selection في علم
        الوراثة، فإن المصطلح شائع ومستقرّ في الأدبيات الاقتصادية العربية بمعنى adverse selection.
        الاشتراك اللفظي مع المصطلح الوراثي لا يمنع اعتماده لأن السياق التخصصي كافٍ للتمييز.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
