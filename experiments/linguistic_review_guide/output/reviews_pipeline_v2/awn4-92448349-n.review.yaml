      nuance_differentiation: >
        يُستخدم أكثر في السياقات التطبيقية والإعلامية. «انتقاء» أدقّ من «اختيار» لأنه يحمل
        معنى الفرز والتصفية، و«سلبي» أقرب إلى adverse من «عكسي».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْتِقَاء سَلْبِيّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "اِخْتِيَار سَلْبِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح معتمد في ARABTERM (مسرد المناخ والبيئة) كمقابل رسمي لـ adverse selection مع
        تعريف تفصيلي يطابق المفهوم الاقتصادي. يجمع بين جذر «خير» الشائع في سياق الاختيار
        ووصف «سلبي» الأقرب إلى معنى adverse. أقوى المرشحات من حيث الاعتماد المعجمي.
