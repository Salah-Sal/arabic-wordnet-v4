        مفهوم «الغرر» الفقهي أعمّ من «الاختيار العكسي» الاقتصادي. الغرر يشمل كل بيع
        مجهول العاقبة (جهالة ثنائية الطرف)، بينما الاختيار العكسي يختصّ بعدم تماثل المعلومات
        (طرف يعلم أكثر من الآخر). إدراجه في المجموعة يوسّع نطاقها بما يخالف المعنى المحدّد.

