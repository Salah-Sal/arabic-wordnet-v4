      decision: confirmed
      decision_reason: >
        مصطلح مقبول يجمع بين «انتقاء» بمعنى الاصطفاء و«سلبي» بمعنى الضارّ أو غير الموات.
        رغم وجود مدخل لوجستي مختلف في ARABTERM بنفس الصيغة، فالسياق الاقتصادي يميّزه.
