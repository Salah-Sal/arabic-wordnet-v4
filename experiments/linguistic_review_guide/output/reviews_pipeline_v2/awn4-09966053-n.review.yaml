# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-09966053-n
# company operator — مشغل يعمل لصالح شركة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «عامل شركة» عامّة جداً ولا تحمل دلالة «التشغيل» (operator) المطلوبة؛ فهي تصدق على أي موظف في شركة"
      - "التعريف العربي «مشغل يعمل لصالح شركة» يستخدم كلمة «مشغل» لكن اللمّة تستخدم «عامل» مما يُحدث تفاوتاً دلالياً"
      - "اللمّة تفتقر إلى التشكيل الكامل"
    observations: "المفهوم يدلّ على شخص يشغّل أجهزة أو آلات لصالح شركة، وهو أخصّ من مجرد «عامل» عام. الأعلى في الهرم هو «عامل تشغيل / مُشَغِّل» أي مَن يشغّل جهازاً أو آلة. الفارق هو التبعية لشركة لا لنفسه. المصطلح يحتاج إلى ما يميّز وظيفة التشغيل عن مجرد العمل."
  blind_candidates:
    - lemma: "مُشَغِّلُ شَرِكَةٍ"
      generation_method: tarkib
      justification: "مركب إضافي من «مُشَغِّل» (اسم فاعل من شَغَّلَ الرباعي، بمعنى مَن يتولّى تشغيل الأجهزة) و«شَرِكَة»، يطابق المفهوم تماماً ويوافق التعريف الإنجليزي company operator"
    - lemma: "عَامِلُ تَشْغِيلٍ مُؤَسَّسِيّ"
      generation_method: tarkib
      justification: "مركب إضافي-وصفي يجمع «عامل تشغيل» (الأعلى في الهرم) مع صفة «مؤسسي» للدلالة على التبعية لمؤسسة/شركة"
    - lemma: "مُنَاوِبُ شَرِكَةٍ"
      generation_method: tarkib
      justification: "من الجذر ن و ب بمعنى التداول والنيابة، على وزن مُفاعِل، مركب إضافي يدلّ على مَن يتناوب على تشغيل المعدّات لصالح شركة"
    - lemma: "مُشَغِّلٌ مُؤَسَّسِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «مُشَغِّل» وصفة «مؤسسي» للتفريق بين المشغّل المستقل والمشغّل التابع لمؤسسة"

stage2_evidence:
  per_lemma:
    - lemma: "عَامِلُ شَرِكَةٍ"
      confirm:
        - text: "«(الْعَامِل) من يعمل فِي مهنة أَو صَنْعَة وَالَّذِي يتَوَلَّى أُمُور الرجل فِي مَاله وَملكه وَعَمله»"
          source: "المعجم الوسيط"
        - text: "«الشَّرِكَة: خلط مالين لا يتميّز أحدهما عن الآخر بشرط»"
          source: "معجم مقاليد العلوم للسيوطي"
      contradicts:
        - text: "«العامل الميكانيكيّ [كعامل التلغراف إلخ]. مدير مؤسّسة صناعيّة أو تجاريّة»"
          source: "المورد الحديث (2008)"
          conflict: "في المورد الحديث، كلمة operator تُترجم بـ«العامل الميكانيكي» أو «مُشَغِّل» وليس مجرد «عامل»؛ كلمة «عامل» وحدها أعمّ من operator"
      expands:
        - text: "«وتشير الكلمة كذلك إلى الشخص الذي يعمل على تشغيل الحاسوب أو النظام — مُؤَثِّر (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "يُبيّن أنّ operator بمعنى الشخص المشغِّل يُترجم بـ«عامل» في سياق التقانة لكن مع تخصيص بالتشغيل"

    - lemma: "مُشَغِّلُ شَرِكَةٍ"
      confirm:
        - text: "«مُشَغِّل» = operator"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«مُشَغِّل المصنع» = plant operator"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«مُشغِّل شبكة التوزيع: شركة تكون مسئولة عن تشغيل شبكة التوزيع»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«مشغل النظام؛ مشغل الشبكة» = system operator; network operator"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "نمط إنتاجي: مُشَغِّل + مضاف إليه يدلّ على ما يُشغَّل أو الجهة التي يعمل لها"
        - text: "«مُشغِّل محطة كهربائية: كل جهة أو شخص طبيعيّ أو اعتباريّ يُطلب منه أن يأخذ على عاتقه الالتزام بدور المتعهّد نحو توفير تشغيل آمن»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يؤكد استخدام «مُشَغِّل» للدلالة على الشخص أو الجهة المسؤولة عن التشغيل لصالح مؤسسة"

    - lemma: "عَامِلُ تَشْغِيلٍ مُؤَسَّسِيّ"
      evidence_status: "no_material_found"

    - lemma: "مُنَاوِبُ شَرِكَةٍ"
      evidence_status: "no_material_found"

    - lemma: "مُشَغِّلٌ مُؤَسَّسِيّ"
      evidence_status: "no_material_found"

