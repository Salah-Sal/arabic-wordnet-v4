      decision: confirmed
      decision_reason: "مركّب إضافي منتج ومتّسق مع نمط معجمي مُثبت في المعاجم الموحّدة (مُشَغِّل المصنع، مُشَغِّل الشبكة، مُشَغِّل محطة). يوافق التعريف الإنجليزي company operator مباشرة، ويُميّز وظيفة التشغيل عن مطلق العمل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يخصّص وظيفة التشغيل (تشغيل أجهزة أو آلات) لصالح شركة، وهو أدقّ من «عامل شركة»"
