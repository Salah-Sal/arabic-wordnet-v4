    - lemma: "عَامِلُ تَشْغِيلٍ مُؤَسَّسِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركّب ثلاثي ثقيل الاستعمال، لا شواهد معجمية عليه، ولا يتميّز بميزة دلالية على «مُشَغِّل شركة» الأخفّ والأوضح."

    - lemma: "مُنَاوِبُ شَرِكَةٍ"
      source: stage1
      decision: removed
      decision_reason: "«مُنَاوِب» يدلّ على التناوب والنوبة لا على التشغيل، فيُحدث انزياحاً دلالياً عن المفهوم المطلوب. لا أدلة معجمية تدعمه."

    - lemma: "مُشَغِّلٌ مُؤَسَّسِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركّب وصفي غير مسكوك وغير مستعمل، والصفة «مؤسسي» عامّة، بينما المطلوب التخصيص بالشركة. «مُشَغِّل شركة» أفضل اتّساقاً مع النمط الإضافي السائد."

