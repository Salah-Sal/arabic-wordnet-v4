          addition: "قاطرة هي المقابل المعتمد لـlocomotive، فالمركب سائق قاطرة أدقّ مطابقة للتعريف"

    - lemma: "مُقَطِّر"
      expands:
        - text: "«قِطَارُ الْإِبِلِ. وَتَقَاطَرَ الْقَوْمُ، إِذَا جَاؤُوا أَرْسَالًا، مَأْخُوذٌ مِنْ قِطَارِ الْإِبِلِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ق ط ر يتضمن معنى القِطار (سلسلة متتابعة)، لكن مُقَطِّر بمعنى قائد قطار الإبل لم يُنقل إلى السكك الحديدية"
      contradicts:
