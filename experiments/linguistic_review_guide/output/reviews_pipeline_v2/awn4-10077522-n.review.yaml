# AWN4 Review — awn4-10077522-n (locomotive engineer / سائق قطار)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «مهندس قطار» ناسخة دلالية (calque) من الإنجليزية الأمريكية حيث engineer تعني سائق القاطرة، بينما «مهندس» في العربية تعني حصراً من يمارس الهندسة"
      - "التعريف يقول «مشغل قاطرة» لكن اللمّتين تستخدمان «قطار» لا «قاطرة» — فرق بين القطار (المركبات مجتمعة) والقاطرة (عربة الجرّ)"
      - "اللمّتان غير مشكّلتين"
    observations: "المجموعة تصف مهنة سائق القاطرة في السكك الحديدية. المصطلح المعتمد في المعجم الموحد لمصطلحات النقل (٢٠١٠) هو «سائق القطار» ويقابل train driver وengine driver وengineer معاً. استعمال «مهندس» بمعنى السائق غريب عن العربية ولا سند معجمي له."

  blind_candidates:
    - lemma: "سَائِقُ قَاطِرَةٍ"
      generation_method: tarkib
      justification: "مركب إضافي من «سائق» (اسم فاعل من ساق) و«قاطرة» (عربة الجرّ)، أدقّ من «سائق قطار» لأن التعريف ينصّ على قاطرة لا قطار"
    - lemma: "مُقَطِّر"
      generation_method: ishtiqaq
      justification: "على وزن مُفَعِّل من «قَطَّرَ» بمعنى قاد قطار الإبل بعضه خلف بعض، فيُنقل مجازاً إلى من يقود قطار السكك الحديدية"
    - lemma: "مُهَنْدِسُ قَاطِرَةٍ"
      generation_method: tarkib
      justification: "مركب إضافي على نمط المصطلحات المهنية، يوازي الإنجليزية locomotive engineer، لكنه قد يلتبس مع مهندس الصيانة"
    - lemma: "قَاطِرِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى قاطرة على وزن فاعِلِيّ، كـ«بحريّ» و«جويّ»، للدلالة على المنتسب إلى القاطرة مهنةً"


