          source: "معجم البلدان لياقوت الحموي"
          conflict: "الصيغة قَطَّار مشغولة كاسم موضع، ومُقَطِّر غير مسجّل معجمياً في السياق الحديث"

    - lemma: "مُهَنْدِسُ قَاطِرَةٍ"
      contradicts:
        - text: "«(المهندس) من يلم بعلم من العلوم الهندسية ومن يمارس فنّا من الفنون الهندسية»"
          source: "المعجم الوسيط"
          conflict: "المهندس في العربية يعني صاحب الهندسة لا السائق — نفس إشكال مهندس قطار"

    - lemma: "قَاطِرِيّ"
      evidence_status: "no_material_found"


