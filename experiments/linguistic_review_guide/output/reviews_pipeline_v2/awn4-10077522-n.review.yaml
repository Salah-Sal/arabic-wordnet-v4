          conflict: "المهندس في العربية هو صاحب علم الهندسة لا سائق المركبات"
        - text: "«المهندس الذي يقدر الماء ومجاري القني حيث تحفر، وهي فارسية»"
          source: "المحيط في اللغة للصاحب بن عباد"
          conflict: "أقدم استعمال لمهندس يخصّه بتقدير مجاري المياه والقنوات — لا علاقة بالسياقة"
      expands:
        - text: "«سائق القطار» — translation_en: train driver, engine driver, engineer"
          source: "المعجم الموحد لمصطلحات النقل (٢٠١٠)"
          addition: "المعجم الموحد يردّ جميع المرادفات الإنجليزية (بما فيها engineer) إلى سائق القطار لا مهندس القطار"

