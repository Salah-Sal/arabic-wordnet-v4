# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10766014-n (vanisher)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (مُخْتَفٍ)"
      - "التعريف العربي «شخص يختفي» بسيط جداً ودائري (يستعمل نفس الجذر خ ف ي)"
      - "المفهوم ضيّق جداً: اسم فاعل يدل على من يقوم بفعل الاختفاء"
    observations: "المجموعة تقابل الإنجليزية vanisher وهو اسم فاعل من vanish. في العربية يمكن التعبير عن هذا المفهوم بعدة أوزان لاسم الفاعل من أفعال الاختفاء: اختفى (مُخْتَفٍ)، توارى (مُتَوَارٍ)، تخفّى (مُتَخَفٍّ)، تغيّب (مُتَغَيِّب). لكن ثمة فروق دلالية بين هذه الاشتقاقات."
  blind_candidates:
    - lemma: "مُخْتَفٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من اختفى (افتعل) على وزن مُفْتَعِل من الجذر خ ف ي، وهو أدقّ ما يقابل المفهوم لأن اختفى يدلّ على الاستتار والتواري دون لزوم القصد"
    - lemma: "مُتَوَارٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من توارى (تفاعل) على وزن مُتَفَاعِل من الجذر و ر ي، يدلّ على من غاب عن الأنظار واستتر"
    - lemma: "مُتَخَفٍّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تخفّى (تفعّل) على وزن مُتَفَعِّل من الجذر خ ف ي، يدلّ على من تعمّد الاختفاء والتنكّر"
    - lemma: "مُتَغَيِّب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تغيّب (تفعّل) على وزن مُتَفَعِّل من الجذر غ ي ب، يدلّ على من غاب وتوارى"

stage2_evidence:
  per_lemma:
    - lemma: "مُخْتَفٍ"
      confirm:
        - text: "«(اختفى) الشَّيْء استتر وتوارى وَيُقَال اختفى مِنْهُ»"
          source: "المعجم الوسيط"
        - text: "«مُخْتَفٍ (مُخْتَفِي)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«يَخْتَفِي — translation_en: disappear»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«(اختفى) ... وَدم فلَان قَتله من غير أَن يعلم بِهِ أحد وَالشَّيْء أظهره واستخرجه وَالْمَيِّت نبش قَبره واستخرج كَفنه والبئر احتفرها»"
          source: "المعجم الوسيط"
          addition: "لاختفى معانٍ أخرى غير الاستتار: القتل سراً، والإظهار (من الأضداد)، ونبش القبر، واحتفار البئر"
    - lemma: "مُتَوَارٍ"
      confirm:
        - text: "«(اختفى) الشَّيْء استتر وتوارى»"
          source: "المعجم الوسيط"
        - text: "«(1) يغيب [عن النَّظر]: يختفي؛ يتوارى»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«وغل في الشجر وغولاً: توارى فيه»"
          source: "أساس البلاغة للزمخشري"
          addition: "التواري يستعمل في سياق الاختفاء في مكان أو خلف شيء"
    - lemma: "مُتَخَفٍّ"
      confirm:
        - text: "«وأمر خاف وخفي... وهو يخفي صوته... وتخفى: استتر»"
          source: "أساس البلاغة للزمخشري"
      contradicts:
        - text: "«تَخَفَّيَ: Hid, concealed himself; disguised, cloaked himself»"
          source: "قاموس حبيب سالمون"
          conflict: "تخفّى يحمل دلالة التنكّر والتستّر المتعمّد، لا مجرّد الاختفاء"
    - lemma: "مُتَغَيِّب"
      evidence_status: "no_material_found"
    - lemma: "غَائِب"
      confirm:
        - text: "«غَائِب: من (غ ي ب) المستور عن العين، والمسافر، ومن يذكر عيوب غيره»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«غائِب — translation_en: absent»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: "«غَائِب: من (غ ي ب) المستور عن العين، والمسافر، ومن يذكر عيوب غيره»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الغائب أعمّ من المختفي — يشمل المسافر والمستتر عن العين، وليس مخصوصاً بمن يختفي"

stage3_analysis:
  per_lemma:
    - lemma: "مُخْتَفٍ"
      decision: confirmed
      decision_reason: "اسم الفاعل من اختفى هو أدقّ مقابل عربي لمفهوم vanisher. المعجم الوسيط يؤكد أن اختفى بمعنى استتر وتوارى، والمعاجم الطبية الحديثة تستعمل مُخْتَفٍ بهذا المعنى. اللمة مشكّلة تشكيلاً صحيحاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions: []

    - lemma: "مُتَوَارٍ"
      source: stage1
      decision: removed
      decision_reason: "التواري يحمل دلالة الاختفاء خلف شيء أو في مكان (توارى بالحجاب)، وكثيراً ما يُستعمل مع متعلّق (متوارٍ عن الأنظار). كما أن المفهوم ضيّق جداً (vanisher) ولمّة واحدة تكفي."
      evidence_assessment:
        case: mixed

    - lemma: "مُتَخَفٍّ"
      source: stage1
      decision: removed
      decision_reason: "تخفّى يحمل دلالة التنكّر والتعمّد في الاستتار (disguised himself)، وهذا أخصّ من مجرّد الاختفاء الذي يدل عليه المفهوم."
      evidence_assessment:
        case: mixed

    - lemma: "مُتَغَيِّب"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على هذه الصيغة، والتغيّب يُستعمل عادةً في سياق التغيّب عن العمل أو المكان، لا الاختفاء الكلّي."
      evidence_assessment:
        case: no_material

