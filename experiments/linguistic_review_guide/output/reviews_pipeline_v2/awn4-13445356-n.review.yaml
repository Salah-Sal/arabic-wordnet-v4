# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13445356-n — absorption (physics)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (امتصاص)، وهي كافية لكنّها تفتقر إلى بدائل تراثية أو مرادفات تخصصية"
      - "اللمّة الموجودة بدون تشكيل كامل"
    observations: >
      المفهوم الفيزيائي للامتصاص (absorption) راسخ في المصطلحية العربية الحديثة.
      المصطلح «امتصاص» مشتق من جذر م-ص-ص على وزن افتعال، وهو اشتقاق قياسي
      يدل على التذوق وأخذ الخالص كما في مقاييس اللغة. الدلالة الفيزيائية مجازية
      انطلاقاً من المعنى الحسي (مص السائل) إلى استيعاب الوسط للطاقة الإشعاعية.
      المصطلح موحّد ومعتمد في جميع المعاجم العلمية العربية الصادرة عن أليكسو ومكتب
      تنسيق التعريب.
  blind_candidates:
    - lemma: "اِمْتِصَاص"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل امتصّ على وزن افتعال من جذر م-ص-ص، يدل على أخذ الشيء
        واستخلاصه. نُقل مجازياً إلى استيعاب الوسط للطاقة الإشعاعية. مصطلح
        موحّد في جميع المعاجم العلمية العربية.
    - lemma: "تَشَرُّب"
      generation_method: ishtiqaq
      justification: >
        مصدر تشرّب على وزن تفعّل من جذر ش-ر-ب، يدل على امتصاص الشيء على مهل.
        وارد في المعجم الكبير بمعنى امتصاص مادة صلبة لسائل في الكيمياء.
    - lemma: "اِسْتِيعَاب"
      generation_method: majaz
      justification: >
        مصدر استوعب على وزن استفعال من جذر و-ع-ب، يدل على أخذ الشيء كله.
        يُستخدم مجازياً في بعض السياقات العلمية بمعنى احتواء المادة لإشعاع أو مادة أخرى.
    - lemma: "اِحْتِبَاس"
      generation_method: ishtiqaq
      justification: >
        مصدر احتبس على وزن افتعال من جذر ح-ب-س، يدل على حجز الشيء والاحتفاظ به.
        التعريف يذكر «الاحتفاظ بالطاقة»، فقد يصلح لمّةً للعملية ذاتها.

stage2_evidence:
  per_lemma:
    - lemma: "اِمْتِصَاص"
      confirm:
        - text: "«استيعاب مادةٍ ما لمادة أخرى، وتوزيع الثانية في الأولى توزيعاً متجانساً. ولعملية الامتصاص أهمية كبيرة في مجال تنقية غاز المداخن»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«يُشيرُ مُصطلح الامتصاص إلى استيعاب المادة لإشعاع، وليكن إشعاعاً حرارياً مثلاً، من البيئة المُحيطة»"
          source: "مسرد الهندسة الكهربائية (أليكسو)"
        - text: "«الظاهرة التي من خلالها تنتقل طاقة الأشعة، كليا أو جزئيا، إلى الجسم الذي تخترقه»"
          source: "مسرد المناخ والبيئة (أليكسو) — مدخل: امتصاص (أشعة)"
        - text: "«عملية امتصاص الأشعة الضوئية»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
        - text: "«امتصاص المادة، كالسائل مثلاً، للطاقة الضوئية»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«امتصاص والاحتفاظ بسائل أو غاز في جسم مادة صلبة أو سائلة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (أليكسو)"
      expands:
        - text: "«(1) امتصاص (2) استغراق؛ انهماك»"
          source: "المورد الحديث (2008)"
          addition: "المصطلح يحمل في الإنجليزية دلالة مجازية (الانهماك) إلى جانب الدلالة الفيزيائية"
        - text: "«وينقسم الامتصاص إلى نوعين: امتصاص فيزيائي، وامتصاص كيميائي»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "تفريع المصطلح إلى نوعين يؤكد استقراره في الاستعمال العلمي"

    - lemma: "تَشَرُّب"
      contradicts:
        - text: "«تشرُّب = imbibition» (في الفيزياء)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "تشرّب مصطلح موحّد لمفهوم الاسترطاب (imbibition) لا الامتصاص (absorption)"
        - text: "«تشرُّب = impregnation» (في الكيمياء)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "في الكيمياء يُقابل التشرّب مفهوم التشريب (impregnation) المختلف عن الامتصاص"
      expands:
        - text: "«(فى علم الكيمياء): امتصاصُ مادةٍ صلبةٍ لسائلٍ حتـى درجـةِ التَّشبعِ»"
          source: "المعجم الكبير"
          addition: "التشرّب في الكيمياء خاص بامتصاص المادة الصلبة للسائل حتى التشبع، أضيق من الامتصاص الفيزيائي للإشعاع"
        - text: "«(تشرب) المَاء وَنَحْوه امتصه على مهل وَيُقَال تشرب الثَّوْب الْعرق أَو الصَّبْغ»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية هي الامتصاص التدريجي البطيء للسوائل"

    - lemma: "اِسْتِيعَاب"
      contradicts:
        - text: "«استيعاب = assimilation» (في الهندسة المدنية)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "استيعاب مصطلح موحّد لمفهوم التمثّل (assimilation) لا الامتصاص (absorption)"
        - text: "«الاستيعاب: أخذ الشيء كله، يقال وعبته وعبا وأوعبته إيعابا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الدلالة المعجمية الأصلية هي الاستيفاء والأخذ الكامل، لا امتصاص الطاقة الإشعاعية"
      expands:
        - text: "«العملية التي من خلالها، عندما يلتقي وسطان لا يتمازجان، يتم انتقال عنصر أو مكون معين من وسط إلى آخر. التمييز بين الاستيعاب والامتزاز قد يكون صعبا... في مثل هذه الحالات يتم استخدام مصطلح 'الامتصاص'»"
          source: "مسرد المناخ والبيئة (أليكسو) — مدخل: استيعاب (الكيمياء الغروية)"
          addition: "في الكيمياء الغروية يُستخدم استيعاب بدلالة مختلفة عن الامتصاص، ويُنصّ على أنّ 'الامتصاص' هو المصطلح الجامع"

    - lemma: "اِحْتِبَاس"
      contradicts:
        - text: "«احتباس = occlusion» (في الجيولوجيا والأحياء)"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "احتباس مصطلح موحّد لمفهوم الاحتجاز (occlusion) لا الامتصاص (absorption)"
        - text: "«احتباس = retention» (في الطب البيطري والتشريح)"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: "في الطب يُقابل الاحتباسُ الاحتجازَ (retention) وهو مفهوم مختلف"
        - text: "«الاحتباس: بالباء الموحدة عند الأطباء هو احتقان المواد في البدن»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الدلالة الطبية التراثية هي الاحتقان لا الامتصاص"

stage3_analysis:
  per_lemma:
    - lemma: "اِمْتِصَاص"
      decision: confirmed
      decision_reason: >
        مصطلح موحّد ومعتمد في أكثر من ٣٠ معجماً تخصصياً عربياً صادراً عن أليكسو
        ومكتب تنسيق التعريب. مشتق اشتقاقاً قياسياً من جذر م-ص-ص على وزن افتعال.
        الأدلة المعجمية تؤكد استخدامه الحصري لمفهوم الامتصاص الفيزيائي والكيميائي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِمْتِصَاص"

    - lemma: "تَشَرُّب"
      source: stage1
      decision: removed
      decision_reason: >
        تشرّب مصطلح موحّد لمفهومَيْ الاسترطاب (imbibition) والتشريب (impregnation)
        في المعاجم العلمية الرسمية، وهما مفهومان مختلفان عن الامتصاص الفيزيائي
        للإشعاع. الدلالة في المعجم الوسيط خاصة بالسوائل (امتصه على مهل)، ولا
        تشمل الطاقة الإشعاعية. إضافته ستُحدث تداخلاً مع مفهوم imbibition.
      evidence_assessment:
        case: contradicts_only

    - lemma: "اِسْتِيعَاب"
      source: stage1
      decision: removed
      decision_reason: >
        استيعاب مصطلح موحّد لمفهوم التمثّل (assimilation) في عدة معاجم تخصصية.
        وفي الكيمياء الغروية يُميَّز صراحةً عن الامتصاص، إذ يُنصّ على أنّ 'الامتصاص'
        هو المصطلح الجامع. الدلالة التراثية (أخذ الشيء كله) بعيدة عن المعنى الفيزيائي
        المطلوب.
      evidence_assessment:
        case: contradicts_only

    - lemma: "اِحْتِبَاس"
      source: stage1
      decision: removed
      decision_reason: >
        احتباس مصطلح موحّد لمفهومَيْ الاحتجاز (occlusion) والاستبقاء (retention)
        في المعاجم العلمية، وكلاهما مختلف عن الامتصاص. الدلالة التراثية عند التهانوي
        هي احتقان المواد في البدن. إضافته ستُحدث تداخلاً مع مجموعات ترادفية أخرى.
      evidence_assessment:
        case: contradicts_only

