# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14943423-n
# inoculant / inoculum — لقاح / مادة التلقيح
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «لقاح» واردة بدون تشكيل؛ يجب تحديد حركة اللام (كسرة للمعنى الطبّي)"
      - "اللمّة «مادة التلقيح» عبارة وصفية حرّة وليست مصطلحاً مسكوكاً ثابتاً"
      - "المجموعة تفتقر إلى المصطلح الشائع «طُعْم» الذي يُرادف «لِقَاح» في المعجم الوسيط"
      - "المصطلح الطبّي الدقيق «لَقِيحَة» (inoculant/inoculum) غائب عن المجموعة"
    observations: >
      المفهوم المستهدف هو المادّة المُلقَّح بها (virus/toxin/serum) لا عملية التلقيح ذاتها.
      جذر ل-ق-ح أصيل في العربية ودالّ على الإحبال والتخصيب ثم نُقل إلى المعنى الطبّي.
      المعجم الوسيط يوثّق «لِقَاح» و«طُعْم» مرادفَيْن صريحَيْن في هذا المعنى المحدث.
      المعجم الطبّي الموحّد يستعمل «لَقِيحَة» مقابلاً دقيقاً لـ inoculant/inoculum.
  blind_candidates:
    - lemma: "لِقَاح"
      generation_method: ishtiqaq
      justification: "من جذر ل-ق-ح الدالّ على الإحبال والتخصيب، على وزن فِعَال المناسب للمصادر والأسماء، نُقل إلى المعنى الطبّي بإطلاقه على ما يُدخَل في الجسم لإكسابه مناعة"
    - lemma: "طُعْم"
      generation_method: majaz
      justification: "أصله من ط-ع-م ما يُلقى للصيد (الطُّعْم)، ثم أُطلق مجازاً على المصل المحقون في الجسم لاكتساب المناعة، بجامع الإدخال في الشيء لتحقيق غرض"
    - lemma: "لَقِيحَة"
      generation_method: ishtiqaq
      justification: "من ل-ق-ح على وزن فَعِيلة بمعنى المفعول (ما يُلقَّح به)، اسم وحدة للمادّة المُلقَّح بها، مناسب لتسمية الجرعة أو العيّنة الواحدة"
    - lemma: "مَادَّة مُمَنِّعَة"
      generation_method: tarkib
      justification: "مركّب وصفي من «مادّة» واسم الفاعل «مُمَنِّعَة» من م-ن-ع (منح المناعة)، يصف المادّة التي تُكسب الجسم مناعة"

stage2_evidence:
  per_lemma:
    - lemma: "لِقَاح"
      confirm:
        - text: "«قَدْرٌ من الجراثيم يسير يُدخل في جسم الإنسان أو الحيوان ليكسبه مناعة من المرض الذى تحدثه هذه الجراثيم, وهو الطُّعْم أيضاً, كلقاح الجُدَرِىّ والتِّيفوس»"
          source: "المعجم الوسيط"
        - text: "«مادة حيويّة مناعية، تستخدم للتمنيع الفاعل، وهي عبارة عن العامل المسبب للمرض الحيّ أو المقتول أو الموهن أو المعطل أو ذيفانه إلى الجسم بهدف إثارة استجابة مناعية.»"
          source: "المعجم الموحّد لمصطلحات علم الصيدلة"
        - text: "«مادة تحقن بغرض التلقيح.»"
          source: "معجم المصطلحات الطبّية"
        - text: "«مصْل يُحقن به الجسم لاكتساب مناعة ضد الأمراض.»"
          source: "المعجم الموحّد لمصطلحات تقانات الأغذية"
        - text: "«اللَّقاح: مادة التلقيح.»"
          source: "المورد الحديث"
      expands:
        - text: "«ماء الفحل وما يلقح به الشجر والنبات»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية لـ«لِقَاح»: ماء الفحل وما يُلقَّح به النبات، ثم نُقل إلى المعنى الطبّي"
        - text: "«مستحضرات اللَّقاح: خلاصات تستخرج من اللَّقاحات النباتية لتشخيص الحساسية عند المرضى بالتَّحساس (مج)»"
          source: "المعجم الوسيط"
          addition: "استعمال مجمعي خاصّ بمستحضرات الحساسية"

    - lemma: "مَادَّة التَّلْقِيح"
      confirm:
        - text: "«اللَّقاح: مادة التلقيح.»"
          source: "المورد الحديث"
      contradicts:
        - text: "«مادة تحقن بغرض التلقيح.»"
          source: "معجم المصطلحات الطبّية"
          conflict: "المعجم يستعمل «لقاح» لا «مادّة التلقيح» مصطلحاً مستقلّاً؛ و«مادّة التلقيح» تظهر شرحاً لا مدخلاً"

    - lemma: "طُعْم"
      confirm:
        - text: "«المصل يحقن به الجسم ليكتسب مناعة من المرض (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«لقاح، طُعْم» = vaccine — «مصْل يُحقن به الجسم لاكتساب مناعة ضد الأمراض.»"
          source: "المعجم الموحّد لمصطلحات تقانات الأغذية"
        - text: "«لقاح، طعم» = vaccine"
          source: "المعجم الموحّد لمصطلحات علم الأحياء"
      expands:
        - text: "«الطَّعَام وما يلقى للسمك وغيره لاصطياده ويُطلق مجازاً على كل ما يتوصَّل به إلى شيء كالرشوة والهبة والهدية»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية: ما يُلقى للصيد، ثم مجاز لكلّ وسيلة توصّل إلى غرض"

    - lemma: "لَقِيحَة"
      confirm:
        - text: "«لَقيحَة» = inoculant (inoculum)"
          source: "المعجم الطبّي الموحّد"
        - text: "«لَقيحَة [ج:لَقائِح]» = inoculum [pl.inocula]"
          source: "المعجم الطبّي الموحّد"
        - text: "«لَقائِح [ف:لَقيحَة]» = inocula [sing.inoculum]"
          source: "المعجم الطبّي الموحّد"

    - lemma: "مَادَّة مُمَنِّعَة"
      evidence_status: "no_material_found"

stage3_analysis:
