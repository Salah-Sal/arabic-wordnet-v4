        مرادفاً صريحاً لـ vaccine/inoculum. الجذر ل-ق-ح عربي أصيل دالّ على التلقيح.
        يحتاج تصحيح التشكيل: اللمّة الحالية بدون تشكيل، والصواب «لِقَاح» بكسر اللام
        (كما في المعجم الوسيط لمعنى ماء الفحل وما يُلقَح به والمعنى الطبّي).
