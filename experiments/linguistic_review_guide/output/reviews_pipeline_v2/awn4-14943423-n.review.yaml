        مرادف صريح لـ«لِقَاح» موثَّق في المعجم الوسيط بنصّه: «المصل يحقن به الجسم ليكتسب
        مناعة من المرض (محدثة)». ورد كذلك في معاجم المصطلحات (تقانات الأغذية، علم الأحياء)
        مقروناً بـ«لقاح» مقابلاً لـ vaccine. المعنى الطبّي محدث لكنّه مقبول مجمعيّاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
