        وتبقى العبارة صالحة وصفاً، ممّا يعني أنّها لم تتجمّد اصطلاحاً. المورد الحديث يذكرها
        شرحاً لـ«لقاح» لا مدخلاً مستقلّاً. وجود «لِقَاح» يُغني عنها.
