        text: "مادّةٌ لا تقاوم قوى القصّ المؤثّرة فيها فتنساب وتتشكّل بشكل حاويها، وتشمل السوائل والغازات معاً، وتتميّز عن المواد الصلبة بعدم احتفاظها بشكل محدّد"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
