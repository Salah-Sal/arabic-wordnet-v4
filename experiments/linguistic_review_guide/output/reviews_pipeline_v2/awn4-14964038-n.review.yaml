# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14964038-n — fluid
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مائع» مسجّلة بدون تشكيل، وينبغي تشكيلها: مَائِع"
      - "التعريف العربي يتضمّن كلمة «مائعة» وهي مشتقة من اللمّة ذاتها — دوران جزئي"
      - "المجموعة تحتوي لمّة واحدة فقط؛ يمكن إثراؤها بمرادفات"
    observations: >-
      المفهوم يشمل كلّ مادة في حالة سيلان (سائل أو غاز) عند الظروف العادية.
      المصطلح «مائع» من الجذر م-ي-ع (ماع يميع = ذاب وسال) هو اسم فاعل على وزن فاعِل،
      وهو المصطلح العلمي المعتمد في المعاجم المتخصصة العربية للدلالة على fluid بمعناه الشامل
      (سوائل + غازات)، بخلاف «سائل» الذي يختصّ بالحالة السائلة (liquid) دون الغازية.
  blind_candidates:
    - lemma: "سَائِل"
      generation_method: ishtiqaq
      justification: >-
        اسم فاعل من سال يسيل (جذر س-ي-ل) على وزن فاعِل، يدلّ على ما يجري ويتدفّق.
        شائع الاستعمال في اللغة العامّة والعلمية، لكنّه يختصّ بالحالة السائلة دون الغازية.
    - lemma: "سَيَّال"
      generation_method: ishtiqaq
      justification: >-
        صيغة مبالغة على وزن فَعَّال من الجذر س-ي-ل، تدلّ على كثرة السيلان.
        استُعمل قديماً في الفيزياء بمعنى fluid (السيّال الكهربائي مثلاً)، لكنّه يميل إلى الدلالة
        على التدفّق لا على الحالة الفيزيائية.
    - lemma: "ذَائِب"
      generation_method: majaz
      justification: >-
        اسم فاعل من ذاب يذوب (جذر ذ-و-ب) على وزن فاعِل. أصل الذوب: سيلان الجامد بالحرارة.
        التوسّع المجازي ممكن نظرياً لكنّه يحمل معنى التحوّل من الجمود إلى السيولة لا مطلق المائعية.
    - lemma: "جَارٍ"
      generation_method: majaz
      justification: >-
        اسم فاعل من جرى يجري (جذر ج-ر-ي) على وزن فاعِل. يدلّ على ما يتحرّك وينساب.
        لكنّه عامّ جدّاً في الاستعمال اللغوي (الماء الجاري، المرتّب الجاري) ولا يُستخدم مصطلحاً علمياً.

stage2_evidence:
  per_lemma:
    - lemma: "مَائِع"
      confirm:
        - text: "«المَائِعُ كلُّ شيءٍ ذائبٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«ماعَ السَّمْنُ يَمِيعُ، إذا ذاب. والمَيْعُ: سيلان الشئ المصبوب. وقد ماع الشئ يَميعُ، إذا جرى على وجه الأرض»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«إن كان مائعاً فألقه كله وإن كان جامساً فألق الفأرة وما حولها» — حديث ابن عمر"
          source: "غريب الحديث لأبي عبيد القاسم بن سلام"
        - text: "«مائع: أي مادة تتدفق أو تتحرك سواء كانت في حالة شبه صلبة أو سائلة أو حمأة أو غاز»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«يشمل هذا المصطلح السوائل والغازات، أي المواد التي تأخذ شكل الوعاء الموضوعة فيه. تتميز الغازات بقابلية انضغاط كبيرة لا تمتلكها السوائل.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«مصطلح يطلق على ما هو سائل أو غاز»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«المائع: مادّة مائعة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«ماعَ الجِسمُ مَيْعًا: ذاب وسال. الجِسمُ: امتص بخار الماء من الجو وسال. (مو). السائلُ: جرى على وجه الأرض منبسطاً في هينَةٍ. الرَّجُلُ: فتَرَ وحَمُقَ»"
          source: "المعجم الوسيط"
          addition: "يُضيف الوسيط معنى مجازياً سلبياً: الفتور والحُمق"
        - text: "«مائِعٌ Anything in a melted state, fluid, or liquid: opposed to جَامِدٌ»"
          source: "المعجم العربي الإنجليزي لإدوارد وليام لين"
          addition: "يؤكّد أنّ المائع ضدّ الجامد"

    - lemma: "سَائِل"
      confirm:
        - text: "«(السَّائِلُ) (فِي الكيمياء) حَالَة من حالات الْمَادَّة الثَّلَاث وَسَط بَين الصلابة والغازية (ج) سوائل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«(فى الكيمياء): حالة من حالات المادة الثلاث, وسط بين الصلابة والغازية»"
          source: "المعجم الوسيط (ocr)"
      contradicts:
        - text: "«(فى الكيمياء) (Liquid (E: حالَةٌ من حالات المادة الثلاث, وَسَطٌ بين الصلابة والغازية... له حجم ثابت عند ثبوت الحرارة والضغط, ويأخذ شكل الإناء الذى يحتويه»"
          source: "المعجم الكبير (ocr)"
          conflict: "السائل = liquid (حالة سائلة فقط)، بينما fluid = مائع (يشمل السوائل والغازات). الفرق جوهري علمياً"
        - text: "«السَّائِلُ: مَا من شَأْنه أَن تبسط أجزاؤه إِلَى أَسْفَل»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "يحصر السائل فيما تنبسط أجزاؤه إلى أسفل (= السائل تحديداً)، لا ما يشمل الغاز"

    - lemma: "سَيَّال"
      confirm:
        - text: "«السَّيّال الموجب (كب)» — ترجمة positive fluid"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(سَيِلَ) السِّينُ وَالْيَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى جَرَيَانٍ وَامْتِدَادٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر س-ي-ل يدلّ على الجريان والامتداد، لكنّ سَيَّال لم يُوظَّف مصطلحاً شائعاً للمائع"

    - lemma: "ذَائِب"
      evidence_status: "no_material_found"

    - lemma: "جَارٍ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مَائِع"
      decision: confirmed
      decision_reason: >-
        اسم فاعل من ماع يميع (جذر م-ي-ع) على وزن فاعِل. المصطلح مُعتمَد في جميع المعاجم العلمية
        العربية المتخصصة (الفيزياء، الكيمياء، الهندسة المدنية، الجيولوجيا، الطبّ، الصيدلة) للدلالة
        على fluid بمعناه الجامع (سوائل + غازات). موثّق في التراث اللغوي منذ القرن الثاني (أبو عبيد،
        الجوهري، ابن فارس) بمعنى «الذائب السائل». تعريفات ArabTerm تؤكّد تمييزه عن «السائل» (liquid).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَائِع"

    - lemma: "سَائِل"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم شيوع «سائل» في الاستعمال اليومي، إلا أنّه يختصّ في المصطلحية العلمية بالحالة السائلة
        (liquid) دون الغازية. المعجم الوسيط والمعجم الكبير يعرّفانه بأنّه «حالة من حالات المادة
        الثلاث، وسط بين الصلابة والغازية» — وهذا تعريف liquid لا fluid. إضافته إلى هذه المجموعة
        سيُخلّ بالتمييز العلمي الضروري بين fluid (مائع) وliquid (سائل).
      evidence_assessment:
        case: contradicts_only

    - lemma: "سَيَّال"
      source: stage1
      decision: removed
      decision_reason: >-
        صيغة فَعَّال من الجذر س-ي-ل لم تُعتمَد مصطلحاً عامّاً لـ fluid في المعاجم المتخصصة.
        وردت في سياق محدود («السيّال الموجب» في الفيزياء الكلاسيكية) لكنّها لم تترسّخ
        مصطلحاً بديلاً عن «مائع». إضافتها ستُشوّش التمييز المصطلحي المستقرّ.
      evidence_assessment:
        case: mixed

    - lemma: "ذَائِب"
      source: stage1
      decision: removed
      decision_reason: >-
        لا سند معجمي لاستعمال «ذائب» مصطلحاً علمياً بمعنى fluid. الجذر ذ-و-ب يدلّ على
        التحوّل من الجمود إلى السيولة (الإذابة/الانصهار)، وهو عملية لا حالة. لم يرد في
        أيّ معجم متخصص بهذا المعنى.
      evidence_assessment:
        case: no_material

    - lemma: "جَارٍ"
      source: stage1
      decision: removed
      decision_reason: >-
        لفظ عامّ جدّاً يدلّ على الجريان والتحرّك. لا يُستعمل مصطلحاً فيزيائياً أو كيميائياً
        للدلالة على fluid. الاستعمالات المعجمية (الماء الجاري، الأجر الجاري) بعيدة عن
        المفهوم العلمي المطلوب.
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "مادة تكون في حالة مائعة عند درجة حرارة وضغط الغرفة"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي فيه دوران: يعرّف المائع بأنّه «في حالة مائعة»، وهذا لا يُفيد المعنى.
        كما أنّ «درجة حرارة وضغط الغرفة» ترجمة حرفية لـ room temperature and pressure.
        يحتاج إلى تعريف مصطلحي واضح يبيّن الجنس القريب والفصل النوعي.
    authored:
      - type: terminological
        text: "مادّةٌ لا تحتفظ بشكلٍ ثابت، وتتّخذ شكل الوعاء الذي تُوضَع فيه، سواء أكانت سائلةً أم غازيّة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
