# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14897207-n (fomentation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «كمادة ساخنة» مركّب وصفي يقابل hot pack لا fomentation؛ المفهوم الإنجليزي أعمّ"
      - "التعريف العربي دوري جزئياً: يستخدم «ككمادة» في تعريف مجموعة لمّتها «كمادة ساخنة»"
      - "اللمّة بلا تشكيل كامل"
    observations: "المجموعة تدلّ على مادّة دوائيّة رَطْبة دافئة تُوضع على موضع الألم للعلاج (fomentation). التعريف الإنجليزي يشير إلى «substance» أي المادّة نفسها لا الخرقة. في التراث الطبي العربي يُفرَّق بين الكِمَادة (الخرقة المسخّنة) واللَّبْخة (العجينة الدوائية). لفظ «fomentation» يجمع المفهومين بوصفه المادّة المستعملة في التكميد."
  blind_candidates:
    - lemma: "لَبْخَة"
      generation_method: ishtiqaq
      justification: "من الجذر ل ب خ، على وزن فَعْلة. اللبخة في الطبّ: دواء كالمرهم يوضع فوق العضو عند الألم، وهي أقرب المصطلحات العربية لمفهوم المادّة الدوائية الموضعية."
    - lemma: "ضِمَادَة"
      generation_method: ishtiqaq
      justification: "من الجذر ض م د (ضَمَدَ الجرحَ)، على وزن فِعَالة. تدلّ على كلّ ما يُضمَد به الجرح وغيره، وقد تُستعمل بمعنى الكمّادة."
    - lemma: "تَكْمِيدَة"
      generation_method: ishtiqaq
      justification: "من الجذر ك م د على وزن تَفْعِيلة (اسم المرّة من التكميد). التكميد: تسخين خرقة ووضعها على العضو الوجِع. والتكميدة هي الفعل الواحد من ذلك."
    - lemma: "نَقُوعَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن ق ع على وزن فَعُولة بمعنى مادّة مَنْقوعة رَطْبة، وقد يُقاس على دَلُوكة ونَشُوقة."


stage2_evidence:
  per_lemma:
    - lemma: "كِمَادَة سَاخِنَة"
      confirm:
        - text: "«كِمادَةٌ ساخِنَة» = hot pack"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(1) تكميد (2) كِمادة (3) إثارة [الفتن]» = fomentation"
          source: "المورد الحديث (2008)"
        - text: "«1- تكميد - كمادة 2- لبخة» = fomentation. التعريف: «1- علاج بوضع لبخة دافئة أو نحوها رطبة على موضع المرض. 2- ما يوضع على موضع الألم لعلاجه بالحرارة والرطوبة.»"
          source: "معجم المصطلحات الطبية (ج.٢، 2003)"
      expands:
        - text: "«والكِمَادَةُ: خِرْقَةٌ دَسِمَة تُسَخَّنُ وتُوضَعُ على مَوْضِع الوَجَع، كَمَدْتُهُ فهو مَكْمُودٌ»"
          source: "المحيط في اللغة للصاحب بن عبّاد"
          addition: "الكمادة في التراث خرقة لا مادّة دوائية؛ الساخنة صفة ملازمة أصلاً"
        - text: "«والكمادة: خرقة دسمة وسخة تسخن وتوضع على موضع الوجع فيستشفى بها»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "تأكيد أن الكمادة هي الخرقة (الأداة) لا المادّة"
        - text: "«وتَكْميدُ العضوِ: تسخينهُ بخرقٍ ونحوِها، وكذلك الكماد، بالكسر. وفى الحديث: الكماد أحبّ إليّ من الكيّ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          addition: "الكِمَاد مصدر أو اسم جنس للتكميد لا للمادّة"
        - text: "«التَّكْميدُ: أن تُسَخَّنَ خِرْقَةٌ فتُوضَعَ على العُضْوِ الوَجِع، فهو مَكمُودٌ ومُكمَّدٌ. وتلك الخِرقَة الكِمَاد والكِمادَة»"
          source: "المجموع المغيث في غريبي القرآن والحديث لأبي موسى المديني"
          addition: "تأكيد أن الكمادة هي الخرقة المستعملة في التكميد"

    - lemma: "لَبْخَة"
      confirm:
        - text: "«دواء كالمرهم يوضع حارًّا أو بارداً فوق العضو عند الألم. (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«(طب) خِرْقة يُجْعل فيها دواءٌ كالمرهم توضَع حارّة أو باردة على مكان الألم لِتُسَكِّنَه. كتلة من الطِّين أو أيّة مادّة لزجة أخرى تسخّن وتفرد على قطعة من القماش ثم توضع على الجزء المؤلم أو الملتهب من الجسم.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«عجينة طبية تحتوي على مواد علاجية تستعمل من الظاهر»"
          source: "معجم المصطلحات الطبية (ج.١، 1985)"
        - text: "«لَبْخَة» = poultice"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«لَبْخَة» = cataplasm"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«لَبْخَة (تطبيق خارجي لمادة دوائية لينة)» = cataplasm"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "ضِمَادَة"
      contradicts:
        - text: "«كل ما يضمد به الجرح وغيره. العصابة. حرفة المضمِّد»"
          source: "المعجم الكبير"
          conflict: "الضمادة رباط الجرح والعصابة، وليست مادّة دوائية دافئة رطبة"
        - text: "«ضِمادَة» = pledget"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "تقابل pledget (قطعة شاش صغيرة) لا fomentation"

    - lemma: "تَكْمِيدَة"
      evidence_status: "no_material_found"

    - lemma: "نَقُوعَة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "كِمَادَة سَاخِنَة"
      decision: confirmed
      decision_reason: "مصطلح طبّي مُعجَمي ثابت في المعجم الطبي الموحد (= hot pack) والمورد الحديث (= fomentation). المركّب الوصفي راسخ في الاستعمال الطبّي العربي المعاصر وإن كان أضيق دلاليّاً من fomentation. تشكيل اللمّة الأصلية ناقص."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يدلّ على الكمّادة الساخنة تحديداً (hot pack)، ويُركّز على الحرارة بوصفها عنصراً علاجيّاً جوهريّاً في التكميد، بخلاف اللبخة التي قد تكون باردة أيضاً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِمَادَة سَاخِنَة"

    - lemma: "لَبْخَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح طبّي مُعجَمي ثابت في الوسيط والمعاصرة والمعجم الطبي الموحد. يدلّ على مادّة دوائيّة (عجينة/مرهم) توضع على الجسم للعلاج، وهو أدقّ مطابقةً لتعريف OEWN الذي يتحدّث عن «substance». مسجّل في ستّة معاجم طبّية عربية على الأقلّ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المادّة الدوائية نفسها (العجينة أو المرهم) التي تُوضع على الجسم، وقد تكون حارّة أو باردة، بخلاف «كمادة ساخنة» التي تدلّ على الخرقة المسخّنة."
      actions:
        - command: create_entry
          params:
            lemma: "لَبْخَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "ضِمَادَة"
      source: stage1
      decision: removed
      decision_reason: "الضمادة في المعاجم العربية رباط الجرح والعصابة، وفي المعجم الطبي الموحد تقابل pledget (قطعة شاش). لا تدلّ على مادّة دوائيّة دافئة رطبة بل على أداة الربط والتضميد."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَكْمِيدَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية للفظ «تكميدة» بوصفه اسم مرّة مستقلّاً. التكميد مصدر يدلّ على العملية لا المادّة، والمفهوم المستهدف هو المادّة (substance) لا الفعل."
      evidence_assessment:
        case: no_material

    - lemma: "نَقُوعَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية للفظ. القياس على فَعُولة ممكن صرفيّاً لكنّه غير مسكوك ولا مسجّل في أيّ معجم."
      evidence_assessment:
        case: no_material


