# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14616790-n (plastic)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بلاستيك» معرَّبة بدون تشكيل"
      - "اللمّة «لدائن» بدون تشكيل، وهي جمع تكسير للمفرد «لَدِينَة» — ينبغي التحقق من ملاءمة الجمع كلمّة رئيسية"
      - "التعريف العربي يبدو ترجمة حرفية من الإنجليزية ويحتاج إلى صياغة معجمية عربية أصيلة"
    observations: >
      المجموعة تُعبّر عن مفهوم المواد اللدائنية (البلاستيكية)، وهو مفهوم حديث ليس له أصل تراثي.
      المقابل العربي الفصيح هو «لَدائِن» (جمع لَدِينَة) من الجذر ل-د-ن الدال على اللين والمرونة،
      وقد أقرّه مجمع اللغة العربية بالقاهرة. أما «بلاستيك» فهو تعريب شائع جداً في الاستعمال اليومي
      والتقني على السواء. الجمع بين اللفظين في المجموعة مقبول لأنهما يغطّيان السجلّين: الفصيح والعامّي/التقني.
  blind_candidates:
    - lemma: "لَدائِن"
      generation_method: ishtiqaq
      justification: >
        من الجذر ل-د-ن (اللين والمرونة)، جمع تكسير لـ«لَدِينَة» على وزن فَعائِل.
        أقرّه مجمع اللغة العربية بالقاهرة مصطلحاً للمواد القابلة للتشكيل.
    - lemma: "بِلَاسْتِيك"
      generation_method: taarib
      justification: >
        تعريب للمصطلح الأجنبي plastic، شائع الاستعمال في جميع البلدان العربية،
        يقبل لام التعريف (البلاستيك) والنسبة (بلاستيكيّ) والإضافة.
    - lemma: "مُتَشَكِّلَات"
      generation_method: ishtiqaq
      justification: >
        من الجذر ش-ك-ل على وزن مُتَفَعِّلَات (اسم فاعل مجموع)، بمعنى المواد القابلة للتشكُّل.
        يعكس الخاصية الجوهرية للمادة وهي قبولها التشكيل في القوالب.
    - lemma: "مَوَادّ لَدْنَة"
      generation_method: tarkib
      justification: >
        مركب وصفي من «مَوَادّ» + «لَدْنَة» (صفة من الجذر ل-د-ن)، يصف المواد
        بخاصية اللدونة. مستعمل في النصوص التقنية العربية.

stage2_evidence:
  per_lemma:
    - lemma: "بِلَاسْتِيك"
      confirm:
        - text: "«بلاستيك [مفرد]: (كم) مادّة لدائنيّة (مرنة) عضويّة الأصل أو مركّبة، يمكن سبكها تحت تأثير الحرارة أو الضَّغط، تقبل التَّشكيل، وتصنع منها أدواتٌ مختلفة.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«مركبات غير معدنية متفاعلة وأنتجت اعتمادا على تفاعلات كيميائية (جزيئات ضخمة)، يستعمل مصبوبا على شكل أجسام جامدة أو مرنة، أو أفلام أو خيوط في مواد البناء، والأقمشة، والتغليف وما إلى ذلك.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
        - text: "«مادة صلبة عضوية مكثفة (بوليمر) يتم إنتاجها صناعيا أو بشكل شبه صناعي من جزيئات عضوية أحادية أو مواد مكثفة (بوليمرات) حيوية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«(6) pl. عد: اللدائن؛ البلاستيك.»"
          source: "المورد الحديث (2008)"
          addition: "يربط بين المصطلح المعرّب والمصطلح الفصيح ويعدّهما مترادفَيْن"

    - lemma: "لَدائِن"
      confirm:
        - text: "«(اللدينة) مَادَّة مرنة تقبل التشكل (مج)(ج) لدائن»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«مادة مَرِنة تقبل التشكُل» [ج: لدائن]"
          source: "المعجم الوسيط (OCR)"
        - text: "«لدائن = plastics»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«لدائن = plastics»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 1 (1996)"
      expands:
        - text: "«صناعة اللدائن = plastics industry»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يدل على استعمال المصطلح في سياق صناعي"
        - text: "«لدائن حرارية = thermoplastics»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يؤكد إنتاجية المصطلح في التركيبات الوصفية"

    - lemma: "مُتَشَكِّلَات"
      evidence_status: "no_material_found"

    - lemma: "مَوَادّ لَدْنَة"
      contradicts:
        - text: "«مادَّةٌ لَدينَة = plastic material»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المصطلح «مادة لدينة» يُستعمل صفةً وليس اسماً للمادة ذاتها، أي يصف خاصية اللدونة لا المادة البلاستيكية تحديداً"

stage3_analysis:
  per_lemma:
    - lemma: "بِلَاسْتِيك"
      decision: confirmed
      decision_reason: >
        معرّب شائع مثبت في معجم اللغة العربية المعاصرة والمعاجم المصطلحية المتعددة.
        يقبل لام التعريف والنسبة والإضافة. لا غنى عنه في الاستعمال اليومي والتقني.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المعرّب الشائع في الاستعمال اليومي والإعلامي والتجاري، يُفهم من جميع شرائح المتحدثين
        بالعربية. يُستعمل أيضاً صفةً (كيس بلاستيك).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِلَاسْتِيك"

    - lemma: "لَدائِن"
      decision: confirmed
      decision_reason: >
        مصطلح عربي فصيح أقرّه مجمع اللغة العربية بالقاهرة، جمع تكسير لـ«لَدِينَة» من الجذر ل-د-ن.
        مثبت في المعجم الوسيط والمعاجم الموحدة. يُستعمل في السياقات العلمية والرسمية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المقابل الفصيح الرسمي، يُفضَّل في النصوص العلمية والأكاديمية والمعايير التقنية.
        أكثر دقة من «بلاستيك» لأنه مشتق من صفة اللدونة الجوهرية لهذه المواد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَدائِن"

    - lemma: "مُتَشَكِّلَات"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي على استعمال هذا اللفظ مصطلحاً للمواد البلاستيكية.
        هو وصف عام (مواد قابلة للتشكل) وليس مصطلحاً مسكوكاً.

    - lemma: "مَوَادّ لَدْنَة"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرّة وليست مصطلحاً ثابتاً. المعاجم تستعمل «مادة لدينة» صفةً
        لوصف خاصية اللدونة في أي مادة، لا حصراً للبلاستيك. يخفق في اختبار السكّ
        (يمكن إبدال «لدنة» بـ«مرنة» والعبارة تبقى صالحة).

stage4_content:
  definition:
    current: "اسم عام لمواد اصطناعية أو شبه اصطناعية معينة يمكن تشكيلها في قوالب أو سحبها لتكوين أجسام أو أغشية أو خيوط"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية، ويفتقر إلى الدقة المصطلحية (لا يذكر البنية
        الكيميائية البوليمرية ولا خاصية اللدونة). ينبغي إعادة صياغته بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: "مَوَادّ عُضْوِيَّة مُصَنَّعَة أو شِبْهُ مُصَنَّعَة، ذات بِنْيَة بُولِيمِرِيَّة، تتّصف باللُّدونة فتقبل التشكُّل بالحرارة أو الضغط، وتُصاغ منها أجسام وأغشية وخيوط وطلاءات."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مَوَادّ صِنَاعِيَّة تُنتَج من بُولِيمِرَات عُضْوِيَّة مُخَلَّقَة أو مُحَوَّرَة، تتميّز بقابليّتها للتشكُّل تحت تأثير الحرارة أو الضغط، فتُصَبّ في قوالب أو تُسحَب أغشيةً وخيوطاً، وتُستخدَم في صناعة الأدوات والتغليف والطلاء واللواصق. وتُقسَم إلى لدائن حرارية قابلة لإعادة التشكيل ولدائن متصلّدة بالحرارة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَوَادّ عُضْوِيَّة مُصَنَّعَة أو شِبْهُ مُصَنَّعَة، ذات بِنْيَة بُولِيمِرِيَّة، تتّصف باللُّدونة فتقبل التشكُّل بالحرارة أو الضغط، وتُصاغ منها أجسام وأغشية وخيوط وطلاءات."

  examples:
    per_lemma:
      - lemma: "بِلَاسْتِيك"
        examples:
          - text: "تسعى كثير من الدول إلى الحدّ من استهلاك البلاستيك أحاديّ الاستعمال حفاظاً على البيئة البحرية."
            type: usage
      - lemma: "لَدائِن"
        examples:
          - text: "تُصنَّف اللدائن إلى لدائن حرارية قابلة لإعادة التشكيل ولدائن متصلّدة لا تقبل الصهر مرة أخرى."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تسعى كثير من الدول إلى الحدّ من استهلاك البلاستيك أحاديّ الاستعمال حفاظاً على البيئة البحرية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُصنَّف اللدائن إلى لدائن حرارية قابلة لإعادة التشكيل ولدائن متصلّدة لا تقبل الصهر مرة أخرى."

