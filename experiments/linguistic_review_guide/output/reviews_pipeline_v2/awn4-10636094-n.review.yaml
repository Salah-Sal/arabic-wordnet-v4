# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10636094-n (sneezer)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (عَاطِس)، والمفهوم بسيط جداً (اسم فاعل مباشر)"
      - "التعريف العربي الحالي «شخص يعطس» مقتضب وقريب من الدوران اللفظي"
      - "المعاجم الكلاسيكية تسجّل لـ«العاطس» دلالات مجازية (الظبي المستقبِل، الصبح) أكثر من الدلالة الحرفية"
    observations: "المفهوم هو اسم فاعل صريح من الفعل الثلاثي عَطَسَ (باب ضَرَبَ ونَصَرَ). الصيغة الطبيعية هي عَاطِس على وزن فَاعِل. توجد صيغ مبالغة (عَطَّاس، عَطُوس) لكنها انزاحت دلالياً في المعاجم الكلاسيكية إلى معانٍ أخرى. المفهوم عامّ لا يحتاج إلى أكثر من اسم الفاعل المباشر."
  blind_candidates:
    - lemma: "عَاطِس"
      generation_method: ishtiqaq
      justification: "اسم فاعل مباشر من عَطَسَ يَعْطِسُ على وزن فَاعِل، وهو الصيغة الاشتقاقية الأولى لاسم الفاعل من الثلاثي المجرد"
    - lemma: "عَطَّاس"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من عَطَسَ، تدل على كثرة العطاس وشدّته"
    - lemma: "عَطُوس"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعُول من عَطَسَ، تدل على المداومة على الفعل"
    - lemma: "نَاثِر"
      generation_method: majaz
      justification: "من نَثَرَ بمعنى نثر ما في أنفه، إزاحة دلالية مجازية بعلاقة الاستنثار بالعطاس"


stage2_evidence:
  per_lemma:
    - lemma: "عَاطِس"
      confirm:
        - text: "«عَاطِس a. Sneezer. b. Dawn, daybreak.»"
          source: "حبيب سالمون، قاموس عربي انجليزي متقدم للمتعلمين"
        - text: "«عطَسَ يَعطِس، عَطْسًا وعُطاسًا، فهو عاطِس• عطَس الشَّخْصُ: اندفع الهواءُ من أنفه وفمه بقوّةٍ لعارضٍ مصحوبًا بصوت مسموع»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«وظبي عاطِسٌ: إِذا استقبلك من أمامك.»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
      expands:
        - text: "«(الْعَاطِس) من الظباء الَّذِي يستقبلك من أمامك وَالصُّبْح»"
          source: "المعجم الوسيط"
          addition: "العاطس في المعاجم الكلاسيكية يُطلق أيضاً على الظبي المستقبِل وعلى الصبح مجازاً"
        - text: "«والعاطِس: الصبح لذلك، صفة غالبة.»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
          addition: "العاطس صفة غالبة على الصبح في الاستعمال المجازي"
    - lemma: "عَطَّاس"
      confirm:
        - text: "«عَطَّاس من (ع ط س) الشديد العطس والكثيره.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«والعَطَّاس: اسم فرس لبعض بني المَدان»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
          conflict: "عَطَّاس ورد اسمَ عَلَمٍ لفرس، وصيغة المبالغة تدل على الكثرة لا على مجرد الفعل"
      expands:
        - text: "«عطاس: كثير العطاس. (فوك).»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "يؤكد أن عَطَّاس صفة للمبالغة في كثرة العطاس"
    - lemma: "عَطُوس"
      contradicts:
        - text: "«(العطوس) من الرِّجَال الَّذِي يَسْتَقْدِم فِي الغمرات والحروب»"
          source: "المعجم الوسيط"
          conflict: "عَطُوس لا يدل على العاطس بل على الجريء المقدام في الحروب"
        - text: "«واللُّجَم العَطُوس: الموت»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "عَطُوس وصف للموت في التراكيب الكلاسيكية، لا علاقة بالعطاس الحسّي"
    - lemma: "نَاثِر"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "عَاطِس"
      decision: confirmed
      decision_reason: "اسم فاعل قياسي من عَطَسَ على وزن فَاعِل، مؤكَّد في معجم اللغة العربية المعاصرة وقاموس سالمون بمعنى sneezer مباشرة. الدلالات المجازية الأخرى (الظبي، الصبح) لا تمنع الاستخدام الحقيقي الأصلي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَاطِس"
    - lemma: "عَطَّاس"
      source: stage1
      decision: removed
      decision_reason: "صيغة مبالغة تدل على كثرة العطاس وشدّته لا على مجرد من يعطس. المفهوم المطلوب هو «شخص يعطس» (فعل واحد) لا «من يُكثر العطاس». كما أن الصيغة وردت اسمَ عَلَمٍ لفرس، وتُستخدم اسماً علماً للأشخاص أيضاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "عَطُوس"
      source: stage1
      decision: removed
      decision_reason: "المعاجم الكلاسيكية متفقة على أن العَطُوس من الرجال هو المِقدام الجريء، وفي تركيب «اللُّجَم العطوس» يعني الموت. لا صلة بمعنى العطاس الحسّي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "نَاثِر"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استخدام ناثر بمعنى عاطس. العلاقة المجازية بين الاستنثار والعطاس ضعيفة ولا تسوّغ السكّ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


