# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-10353968-n
# the operator of streetcar — motorman
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم «مُشغّل» وهي لفظة ملتبسة بين الشخص والآلة والمكان"
      - "«عربة الشارع» ترجمة حرفية لـ streetcar وليست مصطلحاً عربياً مستقراً"
      - "اللمّات الحالية مركّبات إضافية طويلة، وليست مصطلحات مفردة"
      - "«سائق قطار كهربائي» أعمّ من المفهوم المقصود إذ يشمل قطارات المترو والسكك الكهربائية"
    observations: "المفهوم يدلّ على الشخص الذي يقود عربة الترام (الترامواي) تحديداً. العربية تفتقر إلى مصطلح مفرد لهذه المهنة، فتلجأ إلى التركيب الإضافي «سائق ترام». المورد الحديث يُورد «الموطوري» بوصفه مقابلاً لـ motorman، لكنّه لفظ معرّب غير شائع."
  blind_candidates:
    - lemma: "سَائِقُ تِرَام"
      generation_method: tarkib
      justification: "تركيب إضافي طبيعي يجمع بين «سائق» (اسم فاعل من ساقَ) و«ترام» (المعرّب المقبول). أقرب ما يُعبَّر به عن مشغّل عربة الترام."
    - lemma: "سَوَّاقُ تِرَام"
      generation_method: tarkib
      justification: "تركيب إضافي بديل باستعمال «سوّاق» على وزن فَعّال للحِرفة، أقرّه مجمع اللغة المصري، ووردت في الوسيط والأساسي."
    - lemma: "تَرَامِيّ"
      generation_method: taarib
      justification: "نسبة إلى «ترام» المعرّب، على غرار «تلفزيونيّ» و«سينمائيّ»، للدلالة على المنتسب إلى الترام أو العامل عليه."
    - lemma: "مُوَطْوِرِيّ"
      generation_method: taarib
      justification: "تعريب مباشر من motorman عبر «موطور» (المحرّك)، ورد في المورد الحديث (2008) بنصّ «الموطوري: سائق الترام»."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "سَائِقُ تِرَام"
      confirm:
        - text: "«السَّائِق: من يقود السيارة أو القطار ونحوهما»"
          source: "المعجم الوسيط"
        - text: "«التَّرَّام: مركب عامّ يسير بالكهرباء على قُضبان حديدية فى المدن وضواحيها»"
          source: "المعجم الوسيط"
        - text: "«الموطوري: «أ» سائق الترام. «ب» مشغِّل الموطور.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«السَّائِقُ: مَنْ يقُودُ السَّيَّارَة والقطارَ وَنَحْوهما. الزمان؛ لأنه المُفْنِى المبيدُ فى اعتقاد بعضهم.»"
          source: "المعجم الكبير"
          addition: "يوسّع دلالة «السائق» لتشمل قيادة أنواع المركبات عموماً"

    - lemma: "سَائِقُ قِطَارٍ كَهْرَبَائِيّ"
      confirm:
        - text: "«سائق القطار» [= train driver, engine driver, engineer]"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      contradicts:
        - text: "«القِطَار: مجموعة من مَرْكبات السكة الحديدية تجرها قاطرة»"
          source: "المعجم الوسيط"
          conflict: "القطار في الاستعمال المعجمي يدلّ على قطار السكة الحديدية لا على الترام تحديداً، فيكون المركّب أعمّ من المفهوم المقصود"
      expands:
        - text: "«الكهربائيّ: المتخصص فى علم الكهرباء، مَنْ مِهنَتُه الاشتغال بالشؤون الكهربائية»"
          source: "المعجم الوسيط"
          addition: "«كهربائي» وصفاً للقطار تميّزه عن القطار البخاري، لكنها لا تخصّصه بالترام"

    - lemma: "سَوَّاقُ تِرَام"
      confirm:
        - text: "«السَّوَّاقُ: السائق»"
          source: "المعجم الوسيط"
        - text: "«ورد بناء فَعّال للدلالة على الحرفة بقلَّة، ثم شاع هذا الاستعمال في مراحل العربية المتأخرة؛ ولذا فقد أقرّ مجمع اللغة المصري قياسيّة صيغة فَعّال للدلالة على الاحتراف أو ملازمة الشيء، وقد وردت السَّوّاق في المعاجم الحديثة كالوسيط والأساسي والمنجد.»"
          source: "معجم الصواب اللغوي"

    - lemma: "تَرَامِيّ"
      evidence_status: "no_material_found"

    - lemma: "مُوَطْوِرِيّ"
      confirm:
        - text: "«الموطوري: «أ» سائق الترام. «ب» مشغِّل الموطور.»"
          source: "المورد الحديث (2008)"

# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ١ ──
    - lemma: "سَائِقُ تِرَام"
      decision: confirmed
      decision_reason: "تركيب إضافي طبيعي مؤلَّف من «سائق» (اسم فاعل فصيح، ورد في الوسيط والكبير) و«ترام» (معرّب مقبول أقرّته المعاجم الحديثة). ورد صراحةً في المورد الحديث مقابلاً لـ motorman. يمثّل الاستعمال الأكثر شيوعاً ودقّةً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على فعل القيادة (السَّوْق) ويختصّ بمركبة الترام تحديداً، وهو الأفصح والأدقّ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَائِقُ تِرَام"

    # ── لمّة موجودة ٢ ──
    - lemma: "سَائِقُ قِطَارٍ كَهْرَبَائِيّ"
      decision: removed
      decision_reason: "التركيب أعمّ من المفهوم المقصود: «قطار كهربائي» يشمل قطارات السكك الحديدية الكهربائية وقطارات الأنفاق ولا يقتصر على الترام. فضلاً عن طوله (ثلاث كلمات) مما يُضعف مسكوكيّته. معجم النقل الموحد يُورد «سائق القطار» مقابلاً لـ train driver لا لـ motorman."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: سوّاق ترام ──
    - lemma: "سَوَّاقُ تِرَام"
      source: stage1
      decision: confirmed
      decision_reason: "«سوّاق» على وزن فَعّال للحِرفة، أقرّه مجمع اللغة المصري، وورد في الوسيط بمعنى «السائق». يضيف بُعد الاحتراف والملازمة، ويُستعمل في اللغة المعاصرة خاصّة في مصر والشام حيث ينتشر الترام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدلّ على الاحتراف وملازمة المهنة أكثر من «سائق» الذي يصلح للقيادة العارضة"
      actions:
        - command: create_entry
          params: {lemma: "سَوَّاقُ تِرَام", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    # ── مرشح المرحلة ١: تراميّ ──
    - lemma: "تَرَامِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على استعمال هذه النسبة بمعنى سائق الترام. والنسبة إلى «ترام» قد تدلّ على كل ما يتعلّق بالترام لا على قائده خاصّة، فتكون عامّة مبهمة."

    # ── مرشح المرحلة ١: موطوريّ ──
    - lemma: "مُوَطْوِرِيّ"
      source: stage1
      decision: removed
      decision_reason: "لفظ معرّب وارد في المورد الحديث فقط، وهو ثقيل على اللسان العربي ولم يشع في الاستعمال. وجود البديل الفصيح «سائق ترام» يُغني عنه وفقاً لمبدأ إيثار العربي."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مشغل الترام (عربة الشارع)"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعتريه ثلاث مشكلات: (١) «مشغل» لفظة ملتبسة بين الشخص والآلة والمكان، (٢) «عربة الشارع» ترجمة حرفية لـ streetcar ليست مستقرّة عربياً، (٣) التعريف لا يذكر الكهرباء وهي سمة جوهرية للترام."
    authored:
      - type: terminological
        text: "مَنْ حِرفَتُهُ قِيادَةُ عَرَبَةِ التِّرَام الكَهْرَبائِيَّة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مَنْ يَتَوَلَّى تَشْغيلَ عَرَبَةِ التِّرَام وقِيادَتَها على قُضْبانِها الحَديدِيَّةِ داخِلَ المُدُنِ وضَواحيها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ حِرفَتُهُ قِيادَةُ عَرَبَةِ التِّرَام الكَهْرَبائِيَّة"

  examples:
    per_lemma:
      - lemma: "سَائِقُ تِرَام"
        examples:
          - text: "أَضرَبَ سائِقو التِّرَام في الإسكندريَّة احتجاجاً على تأخُّر صَرْفِ مُستحقّاتِهِم."
            type: usage
      - lemma: "سَوَّاقُ تِرَام"
        examples:
          - text: "يَحتاجُ سَوَّاقُ التِّرَام إلى رُخصَةٍ خاصَّةٍ تُؤهِّلُهُ لتَشغيلِ المَركَبات السِّكِّيَّة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أَضرَبَ سائِقو التِّرَام في الإسكندريَّة احتجاجاً على تأخُّر صَرْفِ مُستحقّاتِهِم."

