        text: "مادّةٌ كيميائيّة تتكوّن أو تُستهلَك في أثناء عمليات الاستقلاب داخل الخليّة الحيّة، وتشمل الموادّ الوسيطة في المسارات الأيضيّة ونواتجها النهائيّة والموادّ اللازمة لبدء التفاعل"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
