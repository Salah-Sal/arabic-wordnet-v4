      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية من الإنجليزية، يحتوي على تعبير عاميّ «سواء كمنتج» والأنسب «سواء أكانت ناتجاً». كما يخلط بين «التمثيل الغذائي» و«الأيض» بلا مسوّغ، والمصطلح الأدقّ هو «الاستقلاب» أو «الأيض» وحده."
