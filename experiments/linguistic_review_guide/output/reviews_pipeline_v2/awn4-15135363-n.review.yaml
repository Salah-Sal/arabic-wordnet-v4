# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-15135363-n — metabolite
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «ناتج أيضي» تركيب وصفي يوحي بأن المادة ناتج فقط، بينما التعريف يشمل أيضاً المواد الضرورية للأيض وليس نواتجه فحسب"
      - "اللمّة «مستقلب» بدون تشكيل كامل"
      - "لا توجد لمّة «أَيْضَة» المعتمدة في المعجم الطبي الموحد والمورد الحديث"
    observations: "المفهوم يدلّ على أيّ مادة تدخل في عملية الأيض سواء بوصفها ناتجاً أو مادةً مُتفاعلة. مصطلح «مستقلب» على وزن مُسْتَفْعَل من الاستقلاب هو الأكثر شيوعاً في الأدبيات الطبية والكيميائية. مصطلح «ناتج أيضي» يُضيّق الدلالة إلى النواتج فقط مما يُخلّ بالتعريف."
  blind_candidates:
    - lemma: "مُسْتَقْلَب"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الفعل السداسي «استقلبَ» على وزن مُسْتَفْعَل، مشتق من «الاستقلاب» وهو المقابل العربي لـ metabolism، فالمُستقلَب هو ما يخضع للاستقلاب"
    - lemma: "أَيْضَة"
      generation_method: ishtiqaq
      justification: "اسم مرّة من «الأَيْض» على وزن فَعْلَة، يدلّ على المادة الناشئة عن الأيض أو المشاركة فيه، تسمية على نمط: أيض → أَيْضَة كما نقول حَرَكة من حَرْك"
    - lemma: "مُتَأَيِّض"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «تأيّض» (تفعّل) أي خضع للأيض، على وزن مُتَفَعِّل، يدلّ على المادة التي تتحوّل في عملية الأيض"
    - lemma: "نَاتِج الأَيْض"
      generation_method: tarkib
      justification: "تركيب إضافي من «ناتج» و«الأيض»، يدلّ على ما ينتج من عملية الأيض، وهو مصطلح مستعمل في بعض المعاجم الموحدة"

stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَقْلَب"
      confirm:
        - text: "«مستقلب — المنتج الكيميائي للتغييرات التي تطرأ على الجزيء السلفي، بما في ذلك المواد الكيميائية المشاركة في عملية التمثيل الغذائي.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«مستقلب، ناتج الأيض — metabolite»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
        - text: "«مُسْتَقْلَب [ج:مُسْتَقْلَبات]؛مَئِيْضَة — metabolite»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُسْتَقْلَبٌ أَساسِيّ — essential metabolite»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُسْتَقْلَبٌ ثانَوِيّ — secondary metabolite»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "نَاتِج أَيْضِيّ"
      confirm:
        - text: "«مستقلب، ناتج الأيض — metabolite»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
      contradicts:
        - text: "«ناتج — product / outcome»"
          source: "معاجم ARABTERM متعددة (التربية، الاقتصاد، الرياضيات)"
          conflict: "كلمة «ناتج» وحدها تدلّ على المنتَج أو الحاصل عموماً، والتركيب «ناتج أيضي» يُقصر الدلالة على نواتج الأيض فقط دون المواد الداخلة فيه"
      expands:
        - text: "«أيضيّ — metabolic»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          addition: "«أيضيّ» صفة نسبة مُقرّة في المعاجم الموحدة تقابل metabolic"
    - lemma: "أَيْضَة"
      confirm:
        - text: "«أيْضة — metabolite»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«الأَيْضة: مادّة ناشئة عن الأيض.»"
          source: "المورد الحديث (2008)"
        - text: "«مُسْتَقْلَب [ج:مُسْتَقْلَبات]؛مَئِيْضَة — metabolite»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«أيْضة — مادة ناشئة عن الأيض.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          addition: "التعريف في معجم الطب البيطري يحصر الأيضة في النواتج فقط (مادة ناشئة عن الأيض)، بينما المفهوم في WordNet أوسع"
    - lemma: "مُتَأَيِّض"
      evidence_status: "no_material_found"
    - lemma: "نَاتِج الأَيْض"
      confirm:
        - text: "«مستقلب، ناتج الأيض — metabolite»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
      contradicts:
        - text: "«ناتج — product / outcome»"
          source: "معاجم ARABTERM متعددة"
          conflict: "نفس إشكالية «ناتج أيضي»: يُقصر الدلالة على النواتج دون الموادّ الداخلة في الأيض"
    - lemma: "مَئِيضَة"
      confirm:
        - text: "«مُسْتَقْلَب [ج:مُسْتَقْلَبات]؛مَئِيْضَة — metabolite»"
          source: "المعجم الطبي الموحد (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "مُسْتَقْلَب"
      decision: confirmed
      decision_reason: "مصطلح مشتق اشتقاقاً قياسياً من «استقلب» على وزن مُسْتَفْعَل، معتمد في عدة معاجم موحدة (الطبي الموحد، علم الصحة، مسرد المناخ والبيئة). تعريفه في مسرد المناخ والبيئة يشمل المواد المشاركة في عملية التمثيل الغذائي مطابقاً للمفهوم المطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح تقني دقيق مبنيّ على جذر «قلب» عبر الاستقلاب، يُستخدم في السياقات الطبية والكيميائية الرسمية، ويقبل الجمع (مُسْتَقْلَبات) والتوصيف (مُسْتَقْلَب أساسيّ / ثانويّ)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَقْلَب"

    - lemma: "نَاتِج أَيْضِيّ"
      decision: removed
      decision_reason: "تركيب وصفي يُقصر الدلالة على نواتج الأيض فقط، بينما المفهوم يشمل أيضاً المواد الضرورية للأيض وليس نواتجه فحسب. كما أنّه ليس وحدة معجمية ثابتة مسكوكة، بل تعبير وصفي حرّ يمكن استبدال مكوّناته (ناتج استقلابيّ، حصيلة أيضية...). فضلاً عن ذلك، المعاجم تسجّل «ناتج الأيض» (تركيب إضافي) لا «ناتج أيضي» (تركيب وصفي)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "أَيْضَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسجّل في ثلاثة مصادر معجمية موحدة (الطب البيطري 2010، المورد الحديث 2008، المعجم الطبي الموحد 2009 كبديل). مشتق اشتقاقاً قياسياً من «الأَيْض» على وزن فَعْلة (اسم مرّة)، مختصر وسهل التداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مختصر مبنيّ مباشرة على جذر «أيض» العربي الأصيل، أقرب إلى الاستعمال البيولوجي العامّ، بينما «مُسْتَقْلَب» أدقّ في السياق الطبي التخصّصي"
      actions:
        - command: create_entry
          params:
            lemma: "أَيْضَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُتَأَيِّض"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثر على أي شواهد معجمية لهذا المصطلح. الوزن مُتَفَعِّل يدلّ على الفاعل (ما يتأيّض) لا على المادة نفسها، ولا يميّز بين الناتج والمادة الداخلة. كما أنّ الصيغة غير مسكوكة ولا مسجّلة في أيّ معجم."

    - lemma: "نَاتِج الأَيْض"
      source: stage1
      decision: removed
      decision_reason: "رغم وروده في معجم علم الصحة (1992) مقروناً بـ«مستقلب»، إلا أنّه تركيب إضافي يُقصر الدلالة على نواتج الأيض فقط ولا يشمل المواد الضرورية له. يفتقر إلى الاشتقاقية (لا يقبل جمعاً أو نسبة بسهولة)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

stage4_content:
  definition:
    current: "أي مادة تشارك في عملية التمثيل الغذائي (سواء كمنتج للأيض أو ضرورية له)"
