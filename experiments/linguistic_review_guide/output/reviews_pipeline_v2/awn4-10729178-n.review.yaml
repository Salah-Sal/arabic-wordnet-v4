# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10729178-n (thrower)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (رامي، قاذف) بدون تشكيل كامل"
      - "لمّة «رامي» اسم منقوص ينبغي ضبطها بالتنوين في حالة التنكير: رَامٍ"
    observations: >
      المجموعة تدلّ على فاعل الرمي والقذف، وهو مفهوم أصيل في العربية له ألفاظ
      متعددة من جذور مختلفة (رمي، قذف، حذف، رشق). اللمّتان الموجودتان مناسبتان
      لكنّهما تحتاجان إلى ضبط صرفي. التعريف العربي ترجمة حرفية نسبياً من
      الإنجليزية يمكن تحسينه بأسلوب معجمي عربي.
  blind_candidates:
    - lemma: "قَاذِف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من قَذَفَ يَقْذِفُ على وزن فَاعِل، والقذف هو الرمي بقوة كما في مقاييس اللغة"
    - lemma: "رَامٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رَمَى يَرْمِي على وزن فَاعِل (اسم منقوص)، والرمي أصل يدلّ على نبذ الشيء"
    - lemma: "حَاذِف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من حَذَفَ بمعنى رمى بالحصى ونحوه جانباً، وزن فَاعِل"
    - lemma: "رَاشِق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رَشَقَ بمعنى رمى بالسهام والحجارة، وزن فَاعِل"

stage2_evidence:
  per_lemma:
    - lemma: "رَامٍ"
      confirm:
        - text: "«مَنْ حِرْفَتُه الرِّمايَةُ»"
          source: "المعجم الكبير (مدخل: الرَّامِي)"
        - text: "«رَامي: من (ر م و) من حرفته الرماية، والقاذف، واسم آخر لبرج القوس.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«القاذِف؛ الرامي [وبخاصة في البَيْسْبول]»"
          source: "المورد الحديث (2008) — مدخل pitcher"
      expands:
        - text: "«(فى الفلك): اسمٌ آخَرُ لِبُرجِ القَوْس. ويقال أيضًا: القَوْسُ الرَّامِى»"
          source: "المعجم الكبير"
          addition: "للفظ «الرامي» دلالة فلكية أيضاً (برج القوس) إلى جانب دلالة الفاعلية"
        - text: "«جمع: رُماة»"
          source: "المعجم الكبير"
          addition: "جمع التكسير رُماة يؤكد الاستعمال الاسمي لا الوصفي فقط"
    - lemma: "قَاذِف"
      confirm:
        - text: "«وصف للذي يقذف.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«القاذِف؛ الرامي [وبخاصة في البَيْسْبول]»"
          source: "المورد الحديث (2008) — مدخل pitcher"
      expands:
        - text: "«بالحجر, وبالشىء: رمى به بقُوَّة»"
          source: "المعجم الوسيط (مدخل: قَذَفَ)"
          addition: "الجذر قذف يدلّ على الرمي بقوة، وهو أخصّ من الرمي العام"
        - text: "«قَاذِفَةُ القَنَابِلِ (فى سلاح الطيران): طائرةٌ أُعِدَّت لقذف القنابل على العدوّ. (محدثة)»"
          source: "المعجم الوسيط"
          addition: "اللفظ مستعمل في الاشتقاقات الحديثة بدلالة القذف والإطلاق"
    - lemma: "حَاذِف"
      evidence_status: "no_material_found"
    - lemma: "رَاشِق"
      contradicts:
        - text: "«راشَقَه: سايرَه وجاراه. بالسِّهام: بادَلَهُ الرَّمْىَ بها.»"
          source: "المعجم الكبير (مدخل: راشَقَ)"
          conflict: "الفعل راشَقَ مفاعلة تدلّ على التبادل لا على فعل الرمي المنفرد، ولم يُعثر على اسم الفاعل رَاشِق بمعنى الرامي"

stage3_analysis:
  per_lemma:
    - lemma: "رَامٍ"
      decision: confirmed
      decision_reason: >
        اسم فاعل فصيح من رَمَى على وزن فَاعِل (اسم منقوص)، مؤكَّد في المعجم الكبير
        بتعريف «مَنْ حِرْفَتُه الرِّمايَةُ» وفي موسوعة أسماء العرب. جمعه رُماة
        يدلّ على ثبوته الاسمي. اللمّة الموجودة «رامي» تحتاج تصحيح التشكيل إلى
        «رَامٍ» في حالة التنكير (اسم منقوص تُحذف ياؤه مع التنوين).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        رَامٍ أعمّ من قَاذِف؛ يشمل الرمي بالسهام والحجارة وغيرها بأي قوة،
        بينما القذف أخصّ بالرمي بقوة وعنف. ورَامٍ أكثر شيوعاً في السياق
        العسكري والرياضي التقليدي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَامٍ"

    - lemma: "قَاذِف"
      decision: confirmed
      decision_reason: >
        اسم فاعل فصيح من قَذَفَ على وزن فَاعِل، مؤيَّد بتعريف المعجم الطبي
        «وصف للذي يقذف» وبالمورد الحديث الذي يجمعه مع الرامي. الجذر قذف دالّ
        على الرمي بقوة كما في مقاييس اللغة والمعجم الوسيط. مستعمل في المركبات
        الحديثة (قاذفة القنابل).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        قَاذِف أخصّ من رَامٍ؛ يدلّ على الرمي بقوة وعنف واندفاع، ويُستعمل
        في السياقات التقنية والعسكرية الحديثة (قاذف صواريخ، قاذفة قنابل).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَاذِف"

    - lemma: "حَاذِف"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي لاسم الفاعل «حاذف» بمعنى الرامي.
        الجذر حذف في المعاجم يدلّ أساساً على القطع والإسقاط لا على
        الرمي، وإن ورد بمعنى رمي الحصى فهو استعمال محدود لا يكفي
        لتثبيته مرادفاً.

    - lemma: "رَاشِق"
      source: stage1
      decision: removed
      decision_reason: >
        الفعل رَشَقَ يدلّ على رمي السهام، لكنّ صيغة المفاعلة (راشَقَ)
        التي وُجدت في المعجم الكبير تدلّ على التبادل والمسايرة.
        لم يُعثر على اسم الفاعل «راشق» مثبتاً في المعاجم بمعنى
        الرامي المطلق، فيبقى استعمالاً وصفياً غير مسكوك.

