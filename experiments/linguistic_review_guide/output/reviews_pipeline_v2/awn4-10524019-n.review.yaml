# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-10524019-n
# radio operator — عامل لاسلكي / مشغل راديو
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان بلا تشكيل — يجب إضافة التشكيل الكامل"
      - "لمّة «مشغل راديو» تمزج بين مصطلح عربي مشتق (مُشَغِّل) ولفظ معرَّب (راديو)، في حين أن «عامل لاسلكي» عربية صرفة"
      - "التعريف العربي ترجمة حرفية شبه مباشرة من الإنجليزية ويحتاج تحسيناً أسلوبياً"
    observations: "المفهوم يشير إلى شخص متخصص في تشغيل أجهزة الإرسال اللاسلكي (الراديو). في التراث العربي لا يوجد مصطلح مفرد مخصص لهذه المهنة، وإنما يُعبَّر عنها بتركيب وصفي أو إضافي. المصطلح ينتمي إلى مجال الاتصالات الحديثة، واللفظان الموجودان يمثلان طريقتين مختلفتين للتعبير: الأولى بالوصف (عامل + لاسلكي) والثانية بالإضافة (مشغّل + راديو)."
  blind_candidates:
    - lemma: "لاسِلْكِيّ"
      generation_method: majaz
      justification: "استعمال مجازي للصفة «لاسلكيّ» اسماً للدلالة على الشخص الذي يعمل في مجال اللاسلكي، على سبيل المجاز المرسل (تسمية الفاعل بصفة مجاله)"
    - lemma: "مُشَغِّل لاسِلْكِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين اسم الفاعل من شَغَّلَ (مُشَغِّل) والصفة لاسلكيّ، على غرار تركيبات المهن الحديثة"
    - lemma: "عامِل الإرْسال"
      generation_method: tarkib
      justification: "تركيب إضافي يربط عامل بالإرسال اللاسلكي، لكنه يفتقر إلى التخصيص في مجال الراديو تحديداً"
    - lemma: "رادْيُوِيّ"
      generation_method: taarib
      justification: "نسبة إلى راديو المعرَّبة بإضافة ياء النسبة، للدلالة على المنتسب إلى مجال الراديو ومتخصصه — لكنها تصلح صفةً أكثر مما تصلح اسماً لشخص"

stage2_evidence:
  per_lemma:
    - lemma: "عامِل لاسِلْكِيّ"
      expands:
        - text: "«العَيْنُ وَالمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ، وَهُوَ عَامٌّ فِي كُلِّ فِعْلٍ يُفْعَلُ. ... وَالعَمَلَةُ: القَوْمُ يَعْمَلُونَ بِأَيْدِيهِمْ ضُرُوبًا مِنَ العَمَلِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر عمل يدل على الفعل والعمل عموماً، واشتقاق عامل منه ثابت ومطّرد"
        - text: "«اللاَّسِلْكيّ ... أجاز مجمع اللغة المصري دخول أل على حرف النفي لا المتصل بالاسم، مثل: اللامائي واللاهوائي واللاسلكي ... لشيوع هذه الكلمات في العصر الحديث واستعمالها في لغة العلم»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "لفظة لاسلكي مقبولة لغوياً بإقرار مجمع اللغة المصري"
        - text: "«صفةٌ للاتصالات التي تجري دون استخدام أسلاك توصيل أو كِبال، مثل استخدام الراديو، أو الموجة المكروية، أو تحت الحمراء»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "تعريف تقني للاسلكي يؤكد ارتباط اللفظ بمجال الاتصالات"
    - lemma: "مُشَغِّل رَادْيُو"
      expands:
        - text: "«الشِّينُ وَالغَيْنُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الفَرَاغِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر شغل يدل على الانشغال بالعمل، ومُشَغِّل اسم فاعل من شَغَّلَ الشيءَ أي جعله يعمل"
        - text: "«شركة تتولّى تشغيل مُنشأة تقنية»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "مُشَغِّل بمعنى مَن يتولى تشغيل مُنشأة — يدعم المعنى المطلوب"
        - text: "«مُصطلحٌ عامٌّ يُطلقُ على اسْتِعمال المَوْجاتِ الكهرَمغنطيسية للاتِّصال اللّاسِلْكيّ قد يُطلقُ أيضًا على جِهازِ اسْتقْبال هذه المَوْجات (المِذياع)»"
          source: "المعجم الكبير"
          addition: "راديو لفظ معرَّب ثابت يدل على الاتصال اللاسلكي أو جهاز استقباله"
    - lemma: "لاسِلْكِيّ"
      expands:
        - text: "«(2) اللّاسِلْكيّ: الإرسال التّلغرافيّ اللّاسلكيّ»"
          source: "المورد الحديث (2008)"
          addition: "اللاسلكيّ يُستخدم اسماً لمنظومة الإرسال، لا للشخص"
      contradicts:
        - text: "«صفةٌ للاتصالات التي تجري دون استخدام أسلاك توصيل أو كِبال»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "لاسلكيّ في المعاجم صفة أو اسم للمنظومة/التقنية، لا للشخص المشغّل"
    - lemma: "مُشَغِّل لاسِلْكِيّ"
      expands:
        - text: "«هو عنصر سيطرة ... ويُستخدَم للتدّخل في العملية»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          addition: "مُشَغِّل في السياق التقني يدل على من يتولى التشغيل — مقبول مع الصفة لاسلكيّ"
    - lemma: "عامِل الإرْسال"
      evidence_status: "no_material_found"
    - lemma: "رادْيُوِيّ"
      expands:
        - text: "«(1) إشعاعيّ (2) لاسلكيّ (3) إذاعيّ»"
          source: "المورد الحديث (2008)"
          addition: "radio كصفة تُترجم إشعاعيّ/لاسلكيّ/إذاعيّ، والنسبة إليها رادْيُويّ لكن لا شاهد على استعمالها اسماً لشخص"

stage3_analysis:
  per_lemma:
    - lemma: "عامِل لاسِلْكِيّ"
      decision: confirmed
      decision_reason: "تركيب وصفي عربي سليم من اسم فاعل (عامل) وصفة حديثة مقبولة مجمعياً (لاسلكيّ). يدل بوضوح على الشخص الذي يعمل في مجال الاتصال اللاسلكي. اللمّة الموجودة بلا تشكيل وتحتاج تحديثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركّز على كون الشخص «عاملاً» في مجال اللاسلكي بمعنى عام، ويصلح للسياقات العسكرية والمدنية على حدّ سواء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عامِل لاسِلْكِيّ"
    - lemma: "مُشَغِّل رَادْيُو"
      decision: confirmed
      decision_reason: "تركيب إضافي يجمع بين اسم فاعل مشتق (مُشَغِّل) واسم معرَّب ثابت (راديو). مُشَغِّل مُوثّق في المعاجم المصطلحية بمعنى مَن يتولى تشغيل منشأة أو جهاز. اللمّة الموجودة بلا تشكيل وتحتاج تحديثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُركّز على الوظيفة التقنية المباشرة (تشغيل جهاز الراديو)، وأقرب إلى السياق المهني التقني"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُشَغِّل رَادْيُو"
    - lemma: "لاسِلْكِيّ"
      source: stage1
      decision: removed
      decision_reason: "لاسلكيّ في المعاجم صفة للاتصالات أو اسم للمنظومة/التقنية، ولا شاهد على استعماله اسماً للشخص المُشَغِّل. إطلاقه على الشخص مجاز بعيد غير مأنوس."
    - lemma: "مُشَغِّل لاسِلْكِيّ"
      source: stage1
      decision: removed
      decision_reason: "تركيب صحيح لغوياً لكنه مزيج بين مفردتَي اللمّتَيْن الموجودتين (مُشَغِّل من الثانية + لاسلكيّ من الأولى) دون إضافة قيمة دلالية جديدة. إبقاؤه يُثقل المجموعة دون فائدة تمييزية."
    - lemma: "عامِل الإرْسال"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على تثبيت هذا التركيب. عبارة وصفية عامة لا تخصيص فيها لمجال الراديو أو اللاسلكي."
    - lemma: "رادْيُوِيّ"
      source: stage1
      decision: removed
      decision_reason: "نسبة صفتية إلى راديو، تصلح صفةً (بثّ رادْيُويّ) لا اسماً للشخص. لا شاهد معجمي على استعمالها اسماً لمُشَغِّل الراديو."

