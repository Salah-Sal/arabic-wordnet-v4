# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14604877-n (material, stuff)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي فيه دَور لفظي: يستخدم «المادّة» و«مادّيّ» وهما من الجذر نفسه (مدد)"
      - "اللمّة «مَادَّة خَام» تدلّ تحديداً على المادة الأولية غير المصنَّعة، بينما المجموعة أعمّ (material/stuff)"
    observations: "المجموعة تمثّل مفهوم «المادّة الملموسة الداخلة في تركيب جسم»، وهو مفهوم عامّ يشمل المواد الخام والمصنَّعة على السواء. الفائق (hypernym) هو «جَوْهَر / مَادَّة أَسَاسِيَّة» أي المادة الفيزيائية عموماً، فهذه المجموعة تمثّل تخصيصاً للمادة بما يدخل في التركيب والصنع. وينبغي التفريق بين الدلالة العامة للمجموعة والدلالة الخاصة بالمادة الخام."
  blind_candidates:
    - lemma: "مَادَّة"
      generation_method: ishtiqaq
      justification: "من الجذر مدد على وزن فاعِلة، أعمّ لفظ عربي للدلالة على الجوهر المحسوس الذي يدخل في تركيب الأشياء"
    - lemma: "خَامَة"
      generation_method: ishtiqaq
      justification: "من الجذر خوم، تدلّ في الاستعمال المعاصر على المادة التي يُصنع منها الشيء (خامة القماش، خامة البناء)"
    - lemma: "مُكَوِّن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من كَوَّنَ على وزن مُفَعِّل، يدلّ على ما يدخل في تكوين الشيء وتركيبه"
    - lemma: "مَادَّة أَوَّلِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي إضافي، مصطلح مستقرّ في المعاجم التقنية العربية للدلالة على المادة التي تُستخدم في الصنع"

# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "خَامَة"
      confirm:
        - text: "«المادة الأولية التي توجد على حالتها الطبيعية قبل أن تعالج أو تصنع (مج)»"
          source: "المعجم الوسيط"
        - text: "«Raw material : المادَّة الأَوَّلِيَّة التى تُوجَدُ على حالَتِها الطَّبيعِيَّة قَبْلَ أن تُعالَجَ أو تُصَنَّعَ»"
          source: "المعجم الكبير"
        - text: "«خامة [مفرد]: ج خامات: مادّة أوليّة لم يجر عليها التشغيل ولم تعالج أو تصنَّع. خامة هذا القماش جيّدة- خامة ممتازة. خامة الثَّوب: نوع حياكته»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«مَثَلُ المؤمِنِ كمَثَل الخامَةِ من الزَّرْعِ تُفِيئُها الرِّيحُ...»"
          source: "المعجم الكبير (حديث نبوي)"
          addition: "الأصل اللغوي للخامة: الطاقة اللينة من الزرع، ثم توسّعت دلالتها إلى المادة الأولية"
        - text: "«أرضٌ خامَةٌ: وخِمَةٌ... والخامَةُ: الفُجْلَةُ... والخامَةُ للزَّرْعِ يائِيَّةٌ»"
          source: "القاموس المحيط"
          addition: "الجذر الأصلي خوم، والمعنى القديم: الغضّة الرطبة من النبات"

    - lemma: "مَادَّة خَام"
      confirm:
        - text: "«موارد طبيعية لم تخضع بعد لأي مُعالجة بعد استخراجها من مصدرها الطبيعي، يتم استخلاصها من الطبيعة نظرا لقيمتها النفعية»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«مادَّة خام [كالخشب وموادّ البناء إلخ]»"
          source: "المورد الحديث (ترجمة stuff)"
      contradicts:
        - text: "«raw material» — جميع المصادر المصطلحية تُترجم مادة خام بـ raw material وليس material عموماً"
          source: "المعجم الموحد لمصطلحات المياه / القانون / الكيمياء"
          conflict: "المصطلح أخصّ من دلالة المجموعة: المجموعة تعني material/stuff عموماً لا raw material فقط"

    - lemma: "مَادَّة"
      confirm:
        - text: "«كل شَيْء يكون مدَدا لغيره وكل جسم ذِي امتداد وَوزن ويشغل حيزا من الْفَرَاغ (مو). مَادَّة الشَّيْء: أُصُوله وعناصره الَّتِي مِنْهَا يتكون حسية كَانَت أَو معنوية كمادة الْخشب ومادة الْبَحْث»"
          source: "المعجم الوسيط"
        - text: "«مادة الشيء»"
          source: "المعجم الموحد لمصطلحات الكيمياء (ترجمة stuff)"
      contradicts:
        - text: "«المادَّة: مَا يكون بِهِ الشَّيْء مَوْجُودا بِالْقُوَّةِ»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المادة بالمعنى الفلسفي (الهيولى) أعمّ من المادة بمعنى الخامة المحسوسة"
        - text: "«المادّة عند الحكماء هي المحل وتسمّى بالهيولى أيضا»"
          source: "كشّاف اصطلاحات الفنون والعلوم"
          conflict: "تعدّد دلالات المادة يجعلها لفظاً مشتركاً: مادة فلسفية / مادة فيزيائية / مادة دراسية"

    - lemma: "مُكَوِّن"
      evidence_status: "no_material_found"

    - lemma: "مَادَّة أَوَّلِيَّة"
      confirm:
        - text: "«وهي نوعان: المواد الخام الأولية وهي موارد طبيعية لم تخضع لأية معالجة غير الاستخراج من موقعها الطبيعي»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
      contradicts:
        - text: "«المادة الأوليّة؛ المادة الخام — raw material»"
          source: "المورد الحديث"
          conflict: "مرادف تامّ لـ«مادة خام» وليس مصطلحاً مستقلاً بدلالة مغايرة"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خَامَة"
      decision: confirmed
      decision_reason: "لمّة فصيحة مثبتة في المعجم الوسيط والكبير والمعاصر، دلالتها الأساسية «المادة الأولية»، لكنها توسّعت في الاستعمال المعاصر لتشمل مادة الصنع عموماً (خامة القماش، خامات البناء). الجذر خوم والوزن فَاعِلَة صحيحان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تؤكّد على المادة من حيث طبيعتها وجودتها قبل التصنيع أو أثناءه، وتُستعمل مفردةً للدلالة على نوع المادة (خامة ممتازة)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَامَة"

    - lemma: "مَادَّة خَام"
      decision: confirmed
      decision_reason: "مركب وصفي مثبت في المعاجم المصطلحية (الطاقة المتجددة، المياه، القانون، الكيمياء). دلالته أخصّ من المجموعة (raw material)، لكنه يصحّ عضواً فيها لأنّ المادة الخام نوع من المادة الداخلة في التركيب. ورد في المورد الحديث ترجمةً لـ stuff."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تدلّ تحديداً على المادة في حالتها الطبيعية غير المصنَّعة، أي المورد الأوّلي قبل المعالجة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة خَام"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَادَّة"
      source: stage1
      decision: removed
      decision_reason: "لفظ مشترك واسع الدلالة (مادة فلسفية، مادة فيزيائية، مادة دراسية، مادة قانونية). يتداخل مع الفائق «جَوْهَر / مَادَّة أَسَاسِيَّة» ويصعب تمييزه عنه. إدراجه يُحدث اشتراكاً لفظياً مع مجموعات أخرى."
      evidence_assessment:
        case: mixed

    - lemma: "مُكَوِّن"
      source: stage1
      decision: removed
      decision_reason: "يدلّ على العنصر الداخل في التركيب لا على المادة ذاتها. دلالته أقرب إلى component/ingredient منها إلى material/stuff. لا أدلة معجمية تربطه بهذا المعنى."
      evidence_assessment:
        case: no_material

    - lemma: "مَادَّة أَوَّلِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مرادف تامّ لـ«مادة خام» في جميع المصادر المصطلحية (المورد الحديث يساوي بينهما صراحةً). إضافته لا تثري المجموعة بدلالة جديدة وتكرّر المعنى نفسه بصياغة مختلفة."
