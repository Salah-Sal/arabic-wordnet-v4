stage1_review:

  # ١أ. التوليد الأعمى — قُرئ synset_info_masked.yaml أولاً
  # المعطيات المتاحة: التعريف فقط — لا لمّات مرئية
  blind_candidates:
    - lemma: "ضَيْغَمٌ"
      generation_method: majaz
      justification: "إحياء لاسم الأسد الكلاسيكي 'ضَيغَم' (الواسع الشدق، الكثير العضّ) بوصفه رمزاً للمحارب الشرس الجريء؛ ورد في شعر عنترة: 'إني في الكريهة ضيغمٌ شرسٌ'، وهو إحياء للفظ الميت لتجنّب الاشتراك اللفظي مع الأسد العامّ"

    - lemma: "شَرُوسٌ"
      generation_method: ishtiqaq
      justification: "مشتق من جذر (ش-ر-س) على وزن فَعُول الدال على الرسوخ في الصفة وكثرتها؛ يُعبِّر عن الشخص الذي تتأصَّل فيه الشراسة وتصير خُلُقاً دائماً لا عارضاً"

    - lemma: "جَرِيءٌ"
      generation_method: ishtiqaq
      justification: "مشتق من جذر (ج-ر-أ) على وزن فَعِيل الدال على الوصف الثابت؛ يُعبِّر عن بُعد الجرأة والإقدام في المفهوم الثاني للتعريف، موثَّق في الشعر الجاهلي والكلاسيكي للشجاع المقدام"

    - lemma: "صَنْدِيدٌ"
      generation_method: ishtiqaq
      justification: "إحياء للفظ التراثي من جذر (ص-ن-د-د) بمعنى السيد القوي الصعب المراس؛ ورد في أشعار الفرزدق وابن مقروم للإحالة على القوي الذي لا يُقهَر"

  # ١ب. التقييم الأولي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "التعريف الحالي دائري: يستخدم 'شرس' و'جريء' وهما من لمّات المجموعة أو مرشّحاتها مما يجعله تعريفاً بالمجهول"
      - "لمّة 'نَمِر' تدلّ أصالةً على الحيوان المفترس؛ استخدامها للشخص مجاز ثانوي غير مستوفٍ توثيقَهُ الاصطلاحيَّ المباشر"
      - "غياب لمّة تعبِّر تحديداً عن بُعد الجرأة والإقدام بمعزل عن سوء الخلق"
      - "اللمّتان الحاليتان لا تُغطّيان المفهوم من جميع زواياه (الشراسة الخُلُقية + الجرأة الوظيفية + الشراسة في المعركة)"
    observations: "المجموعة تصف شخصاً يجمع بين طَرَفَيْن: الشَّراسة (غلظ الطبع، عسر التعامل، شدة الخلاف) والجرأة (الإقدام، عدم الخوف من المواجهة). جذر شرس وفير التوثيق في أمهات المعاجم بمعنى سوء الخلق وورد في الحديث النبوي ('وأشدنا شريساً'). أما نَمِر فيدل أصالةً على السبع المفترس ويُستخدَم مجازاً للشخص الغاضب الشرس. المجموعة تحتاج تعريفاً معاداً صياغته وإثراءً بلمّات تُعبِّر عن جوانبها الدلالية المتعددة."


