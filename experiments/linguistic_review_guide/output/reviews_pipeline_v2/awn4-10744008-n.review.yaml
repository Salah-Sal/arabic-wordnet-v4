# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10744008-n  |  ILI: i93745  |  POS: n
# التعريف: شخص ينتقل أو يتم نقله من منصب إلى آخر
# الفوقيم: شخص يعمل ويُنجِز الأمور (awn4-09786620-n)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
# قُرئ أولاً: synset_info_masked.yaml (بدون اللمّات)
# ثم: synset_info الكامل للتقييم الأولي
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مَنْقُول ومُحَوَّل) كلتاهما أسماء مفعول تُعبِّر عن المفعولية فحسب، بينما يتضمن التعريف «ينتقل» — فعل فاعلي — مما يعني أن الجانب الإرادي للانتقال لا تُغطيه أي لمّة في المجموعة."
      - "مَنْقُول لفظٌ مشترك بين ثلاث دلالات راسخة في التراث: (أ) المعرفة المنقولة بالرواية والسماع مقابل المعقول، (ب) المال المنقول مقابل العقار، (ج) اللفظ المنقول معجمياً من معنى لآخر — وليس «الشخص» بين هذه الدلالات التراثية."
      - "مُحَوَّل (اسم المفعول) يتزاحم مع مُحَوِّل (اسم الفاعل) الذي هيمن في الاستخدام التقني الحديث بمعنى المحوّل الكهربائي، فضلاً عن كون «المُحَوَّل» اسمَ بلدة تاريخية قرب بغداد وردت في معجم البلدان لياقوت الحموي."
    observations: "المجموعة تعبِّر عن مفهوم إداري معاصر واضح (الموظف المنقول من منصب إلى آخر)، ذو جذور عربية أصيلة في مادَّتَي (ن ق ل) و(ح و ل). الإشكالية المحورية هي تكاثر المعاني المتنافسة على شكلَي مَنْقُول ومُحَوَّل. إضافة مُنْتَقِل (اسم الفاعل) تسدّ الثغرة الدلالية في الجانب الفاعلي."
  blind_candidates:
    - lemma: "مُنْتَقِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل على وزن مُفْتَعِل من الفعل (انتقَل) الثلاثي المزيد بحرفَي الافتعال؛ يعبّر عن الشخص الذي ينتقل من منصب إلى آخر بإرادته أو بموافقته على قرار النقل، ويغطي الجانب الفاعلي الغائب في التعريف «ينتقل»."
    - lemma: "نَقِيل"
      generation_method: ishtiqaq
      justification: "على وزن فَعِيل للدلالة المفعولية (كجَرِيح ورَهِين وحَصِيد) من جذر (ن ق ل)؛ ورد في المعجم الوسيط بمعنى «من يغترب» مما يُجيز توظيفه للشخص المنزوع من موضعه ومنقول إلى آخر."
    - lemma: "مُحَوَّل"
      generation_method: ishtiqaq
      justification: "اسم مفعول من (حوَّل) الثلاثي المضعَّف؛ يعبّر عن الشخص الذي أُعيد توجيهه وحُوِّل من منصبه إلى منصب آخر بقرار إداري، مع دلالة على شمولية التحوّل في المسار الوظيفي."
    - lemma: "مُبَدَّل"
      generation_method: ishtiqaq
      justification: "اسم مفعول من (بدَّل)؛ يدل على الشخص الذي أُبدِل في منصبه أو نُقِل ليحلّ آخر محله، مع دلالة الاستبدال والتناوب الوظيفي."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة (٣ استعلامات أساسية):
# (١) مطابقة دفعية: منقول/المنقول، محول/المحول، منتقل/المنتقل،
#     نقيل/النقيل، مبدل/المبدل
# (٢) الجسر الإنجليزي: transfer / transferee / transferor / reassignment
# (٣) FTS كلمات مفتاحية: منتقل، نقل من منصب، تحويل وظيفي
# + استعلام مقاييس اللغة (جذور: نقل، حول، بدل)
stage2_evidence:
  per_lemma:

    - lemma: "مَنْقُول"
      confirm:
        - text: "«(2) المنقول [من مكان إلى آخر]»"
          source: "المورد الحديث (2008) — ضمن مدخل transferee"
      contradicts:
        - text: "«مَا عُلِمَ من طريق الرِّواية أو السَّماع، كعلم اللُّغَة أو الحديث ونحوهما»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (مدخل المنقول)"
          conflict: "المعنى الأصيل في المعجم الوسيط هو المعرفة المنقولة بالسماع، لا الشخص."
        - text: "«المَنْقول: من الأموال ما يُنقل، والعَقارُ والضيعةُ خلافُه، وأيضاً من اللفظ ما وضع لمعنى بعد وضعه لمعنى آخر سمّي به لنقله من المعنى الأولِ»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
          conflict: "المنقول في الفقه = المال المنقول (مقابل العقار)، وفي اللغة = اللفظ المنقول دلالياً — كلاهما لا يعني شخصاً."
      expands:
        - text: "«(1) المَنْقول إليه؛ المُتَنازَل له (ق) (2) المنقول [من مكان إلى آخر]»"
          source: "المورد الحديث (2008) — كامل المدخل تحت transferee"
          addition: "المورد الحديث يُثبت مفرداً «المنقول» بمعنى (الشخص المنقول من مكان إلى آخر) كمعنى ثانٍ."
        - text: "«[في الانكليزية] Personal property, transcribed, modified, neologism»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
          addition: "يُظهر النطاق الدلالي الواسع للمنقول: المنقولات الشخصية والنقل اللغوي، مما يؤكد ثقل المعاني المتنافسة."

    - lemma: "مُحَوَّل"
      confirm:
        - text: "«محوّل إليه» = transferee"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM"
      contradicts:
        - text: "«المُحَوَّلُ: اشتقاقه واضح من حوّلت الشيء إذا نقلته من موضع إلى موضع: بليدة حسنة طيبة نزهة كثيرة البساتين والفواكه والأسواق والمياه بينها وبين بغداد فرسخ»"
          source: "معجم البلدان لياقوت الحموي (ت 1229م)"
          conflict: "مُحَوَّل في هذا المصدر اسم علم لبلدة قرب بغداد (باب محوَّل)، لا صفة لشخص."
        - text: "«جهاز به مِلْفافٌ، الغرض منه رفعُ أو خفضُ الجهد الكهربائي؛ أي: الفُلْطِيَّة»"
          source: "المعجم الوسيط — مجمع اللغة العربية (مدخل المحوِّل)"
          conflict: "الصيغة المسكوكة في الحداثة هي مُحَوِّل (اسم الفاعل = transformer) لا مُحَوَّل (اسم المفعول)، مما قد يُضعف قبول مُحَوَّل منفرداً بدون تشكيل."
      expands:
        - text: "«مرسل الحوالة» = remitter"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM (مدخل المحوِّل)"
          addition: "في المصطلح التجاري والمصرفي، الجذر (ح و ل) يرتبط بنقل الحقوق بين الأطراف، مما يدعم توظيف مُحَوَّل في سياق التحويلات الإدارية."

    - lemma: "مُنْتَقِل"
      confirm:
        - text: "«(10) المُنْتقِل [من مدرسة إلى أُخرى]»"
          source: "المورد الحديث (2008) — ضمن مدخل transfer"
        - text: "«وَالنَّقِيلُ: الطَّرِيقُ، لِأَنَّهُ لَا يَسْلُكُهُ إِلَّا مُنْتَقِلٌ»"
          source: "مقاييس اللغة لابن فارس — مادة (نقل)"

    - lemma: "نَقِيل"
      contradicts:
        - text: "«النَّقِيلُ: الحجارة تنقلُهَا قَوَائِم الدَّوابِّ / السَّيْل يجيء من أرض ممْطورة إلى غيرها / من يغترب من الرجال أو النِّساء / السَّريع في نقل القوائم»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: "نَقِيل يعني «الغريب في القوم / المغترب»، وهو مختلف عن «الشخص المنقول من منصب وظيفي إلى آخر»؛ دلالة الاغتراب والغربة أقوى من دلالة النقل الإداري."
        - text: "«نَقِيل: من (ن ق ل) الغريب في القوم، والسريع في نقل القوائم، والسيل يجيء من أرض ممطورة إلى غيرها»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
          conflict: "المعنى الإنساني لنَقِيل هو «الغريب في القوم» (stranger/foreigner)، لا «الموظف المنقول من منصبه»."

    - lemma: "مُبَدَّل"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مَنْقُول"
      decision: confirmed
      decision_reason: "اسم المفعول من (نقَل) هو التعبير الأكثر طبيعية للشخص الذي صدر بحقه قرار نقل إداري. المورد الحديث يُثبته صراحةً بمعنى «المنقول من مكان إلى آخر»، والاستعمال الحي في العربية المعاصرة «موظف مَنْقُول» شائع في لغة الأنظمة واللوائح. الدلالات التراثية المتنافسة لا تمنع القبول بشرط التشكيل الكامل في السياق الرسمي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبِّر عن الشخص بوصفه موضوع قرار نقل رسمي صادر عن سلطة إدارية؛ يركز على المفعولية واكتمال إجراء النقل. يناسب السياق القانوني والإداري الرسمي حيث يكون النقل أمراً مُبلَّغاً به لا مُبادَراً إليه."

    - lemma: "مُحَوَّل"
      decision: confirmed
      decision_reason: "مُحَوَّل (اسم مفعول من حوَّل، بضم الميم وفتح الواو المشددة) مختلف صوتياً عن مُحَوِّل (اسم الفاعل = transformer، بكسر الواو). بالتشكيل لا لبس بينهما. الأدلة: (أ) ARABTERM يُثبت «محوّل إليه» = transferee في المصطلح التجاري، (ب) الاستعمال العربي الحديث «الموظف المُحَوَّل» طبيعي ومفهوم. إزالة اللمّة استناداً لتشابه شكل غير المشكَّل ليست مبرراً كافياً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُوحي بتغيير شامل في المسار المهني وإعادة التوجيه من منصب لآخر بقرار إداري أعلى؛ أكثر شيوعاً حين يكون التحويل إلى قسم أو قطاع مختلف نوعياً (تحويل جوهري في الموضع والمهام)، بخلاف مَنْقُول الذي يناسب النقل الإجرائي البسيط."

    - lemma: "مُنْتَقِل"
      source: stage1
      decision: confirmed
      decision_reason: "اسم الفاعل من (انتقَل) يسدّ الفراغ الدلالي في المجموعة؛ يغطي الجانب الفاعلي «ينتقل» من التعريف الذي يفتقر إليه مَنْقُول ومُحَوَّل. موثَّق في المورد الحديث صراحةً «المُنتقِل [من مدرسة إلى أُخرى]»، وفي مقاييس اللغة. الوزن مُفْتَعِل شائع في أسماء فاعلي أفعال الافتعال. لا اشتراك لفظي مزعج."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الجانب الحركي الفاعلي؛ الشخص يتحرك وينتقل بنفسه (سواء طوعاً أو بموافقته)، لا يُنقَل فحسب. يشمل الانتقال الطوعي والإداري معاً، وهو الأوسع دلالةً من بين لمّات المجموعة."
      actions:
        - command: create_entry
          params:
            lemma: "مُنْتَقِل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10744008-n"

    - lemma: "نَقِيل"
      source: stage1
      decision: removed
      decision_reason: "نَقِيل يدل في المعاجم المعتمدة (الوسيط، موسوعة السلطان قابوس، مقاييس اللغة) على «الغريب في القوم / المغترب» وعلى الحجارة والطريق، لا على «الشخص المنقول من منصب وظيفي». الوزن فَعِيل وإن كان مفعولياً في بعض الألفاظ إلا أن نَقِيلاً رُسِّخ بمعنى الاغتراب لا النقل الإداري."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُبَدَّل"
      source: stage1
      decision: removed
      decision_reason: "لا شواهد معجمية على مُبَدَّل بمعنى «شخص نُقل من منصب إلى آخر». جميع مداخل قاعدة البيانات هي لمُبَدِّل (اسم الفاعل = commutator/switch) مفهوم كهربائي مختلف كلياً. فضلاً عن أن (بدَّل) يحمل دلالة الاستبدال والإحلال (إزالة شيء والإتيان بآخر) لا مجرد النقل، مما يتعارض مع روح المجموعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


