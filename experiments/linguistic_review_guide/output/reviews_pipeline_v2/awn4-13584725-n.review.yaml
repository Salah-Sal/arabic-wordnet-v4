# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13584725-n — supply (n)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي لمّة واحدة فقط (عرض) وهي بدون تشكيل"
      - "التعريف العربي مختصر جداً ولا يميّز المفهوم الاقتصادي عن المعنى اللغوي العام للعرض"
    observations: >
      المفهوم هو «العَرْض» بالمعنى الاقتصادي الاصطلاحي، أي كمّيّة السلع والخدمات
      المتاحة للبيع في السوق عند مستوى سعري معيّن، وهو الطرف المقابل لـ«الطلب»
      في نظرية العرض والطلب. اللمّة الموجودة «عرض» صحيحة لكنها بدون تشكيل،
      والمصطلح مستقرّ في الأدبيات الاقتصادية العربية. ينبغي التمييز بين العَرْض
      (المصدر، بمعنى إظهار السلع للبيع) والعَرْض (الاسم الاقتصادي الاصطلاحي).
  blind_candidates:
    - lemma: "عَرْض"
      generation_method: ishtiqaq
      justification: >
        مصدر «عَرَضَ» على وزن فَعْل، من جذر ع-ر-ض. المعنى الأصلي: إظهار الشيء
        وإبرازه للناظرين. انتقل في الاستعمال الاقتصادي إلى الدلالة على كمّيّة ما
        يُتاح من السلع والخدمات في السوق. وهو المصطلح المعتمد في المعاجم الاقتصادية
        الموحّدة (ALECSO) مقابل supply.
    - lemma: "إِمْدَاد"
      generation_method: ishtiqaq
      justification: >
        مصدر «أمَدَّ» على وزن إِفْعَال، من جذر م-د-د. يدلّ على توالي المنافع
        والإعانة بالشيء. يُستخدم في سياقات التوريد والإمداد بالبضائع والطاقة.
    - lemma: "تَزْوِيد"
      generation_method: ishtiqaq
      justification: >
        مصدر «زَوَّدَ» على وزن تَفْعِيل، من جذر ز-و-د. يدلّ على تقديم الزاد
        والمؤونة. ورد في المعجم الموحّد للتجارة والمحاسبة مقابل supply.
    - lemma: "تَوْرِيد"
      generation_method: ishtiqaq
      justification: >
        مصدر «وَرَّدَ» على وزن تَفْعِيل، من جذر و-ر-د. يدلّ على جلب البضائع
        وإيصالها. شائع في لغة العقود التجارية العربية المعاصرة.

stage2_evidence:
  per_lemma:
    - lemma: "عَرْض"
      confirm:
        - text: "«المتاعَ للبيع: أظهره لذوى الرغبة ليشتروه»"
          source: "المعجم الوسيط"
        - text: "«إظهار الشيء للبيع أو الهبة»"
          source: "كتاب العين"
        - text: "«عَرَضَ الْمَتَاعَ يَعْرِضُهُ عَرْضًا. وَهُوَ كَأَنَّهُ فِي ذَاكَ قَدْ أَرَاهُ عَرْضَهُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«عرض» = supply، مجال: Economics"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«العرض والطلب» = offer and demand، مجال: Commerce and Accounting"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«عرض كلي: يساوي مجموع السلع والخدمات الوطنية والمستوردة المعروضة» = aggregate supply"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "يؤكد استقرار المصطلح في الحقل الاقتصادي بمركّبات متعددة (عرض كلي، عرض فائض، عرض غير مرن، عرض مترابط)"
        - text: "«المتاعُ كلُّ شيءٍ سوى الدراهم والدنانير»"
          source: "المعجم الوسيط (مادة العُرْض)"
          addition: "العُرْض بالضم هو المتاع خلاف النقد، وهو معنى متصل بالسياق التجاري"

    - lemma: "إِمْدَاد"
      contradicts:
        - text: "«الإمداد: توالي المنافع، وأصله من المادة وهو كل ما لا ينقطع بالأخذ منه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الإمداد يدلّ على استمرار المنافع والإعانة، لا على عرض السلع للبيع في سوق تنافسية"
        - text: "«إِمْدَاد: من (م د د) الإعانة والإمهال»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الدلالة على الإعانة لا على العرض الاقتصادي بمعنى supply"
      expands:
        - text: "«إمداد» = supply، مجال: Renewable Energy"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يُستخدم في سياق الإمداد بالطاقة والكهرباء، وهو سياق تقني مختلف عن العرض الاقتصادي"

    - lemma: "تَزْوِيد"
      confirm:
        - text: "«تزويد» = supply، مجال: Commerce and Accounting"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "لم يرد المصطلح في المعاجم الكلاسيكية بدلالة العرض الاقتصادي"
          source: "قاعدة البيانات المعجمية"
          conflict: "التزويد يدلّ على فعل تقديم المؤونة لشخص بعينه، لا على مفهوم العرض الكلي في السوق"

    - lemma: "تَوْرِيد"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عَرْض"
      decision: confirmed
      decision_reason: >
        المصطلح مستقرّ ومعتمد في المعاجم الاقتصادية الموحّدة (ALECSO) والمعاجم
        الكلاسيكية. المعجم الوسيط يُثبت دلالة «عَرَضَ المتاعَ للبيع: أظهره لذوي
        الرغبة ليشتروه»، وكتاب العين يُثبت «إظهار الشيء للبيع أو الهبة»، ومقاييس
        اللغة يُثبت الأصل. وردت مركّبات اقتصادية كثيرة مبنية عليه (عرض كلي، عرض
        فائض، العرض والطلب). لا يوجد مصطلح أدق منه لهذا المفهوم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الاقتصادي الاصطلاحي المعتمد، يدلّ على الكمّيّة المتاحة من السلع والخدمات في السوق عند سعر معيّن"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرْض"

    - lemma: "إِمْدَاد"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تؤكد أن الإمداد يدلّ على «توالي المنافع والإعانة»، وهو
        مفهوم مختلف عن العرض الاقتصادي. يُستخدم في سياق الإمداد بالطاقة والمؤن
        (supply بمعنى provision/logistics)، لا في سياق العرض والطلب الاقتصادي
        (supply vs. demand). الفارق جوهري: الإمداد عملية إيصال، والعرض حالة سوقية.

    - lemma: "تَزْوِيد"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود المصطلح في معجم التجارة والمحاسبة مقابل supply، فإن دلالته
        الأصلية تتعلق بتقديم الزاد والمؤونة لشخص أو جهة (فعل تعدٍّ إلى مفعولين)،
        وهو أقرب إلى provision/furnishing منه إلى supply بالمعنى الاقتصادي
        الكلي. لا يصلح بديلاً لـ«عرض» في سياق «العرض والطلب».

    - lemma: "تَوْرِيد"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تدعم استخدامه بمعنى العرض الاقتصادي. التوريد في
        الاستعمال المعاصر يدلّ على جلب البضائع وإيصالها بموجب عقد (delivery/
        importation)، وهو عملية لوجستية لا مفهوم اقتصادي كلي.

stage4_content:
  definition:
    current: "عرض السلع والخدمات للبيع"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وصفي مختصر لا يميّز المفهوم الاقتصادي الاصطلاحي عن الفعل
        اللغوي العام. يحتاج إلى جنس قريب (عملية اقتصادية) وفصل نوعي (الكمّيّة
        المتاحة في السوق عند مستوى سعري معيّن).
    authored:
      - type: terminological
        text: "كَمِّيَّةُ السِّلَعِ وَالخِدْمَاتِ الَّتِي يَكُونُ المُنْتِجُونَ وَالبَائِعُونَ عَلَى اسْتِعْدَادٍ لِطَرْحِهَا فِي السُّوقِ عِنْدَ مُسْتَوًى سِعْرِيٍّ مُعَيَّنٍ فِي فَتْرَةٍ زَمَنِيَّةٍ مُحَدَّدَةٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "إِظْهَارُ السِّلَعِ وَالخِدْمَاتِ وَبَذْلُهَا لِلْبَيْعِ فِي السُّوقِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "كَمِّيَّةُ السِّلَعِ وَالخِدْمَاتِ الَّتِي يَكُونُ المُنْتِجُونَ وَالبَائِعُونَ عَلَى اسْتِعْدَادٍ لِطَرْحِهَا فِي السُّوقِ عِنْدَ مُسْتَوًى سِعْرِيٍّ مُعَيَّنٍ فِي فَتْرَةٍ زَمَنِيَّةٍ مُحَدَّدَةٍ"

  examples:
