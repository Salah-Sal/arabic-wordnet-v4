# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10655186-n
# sphinx: an inscrutable person who keeps their thoughts and intentions secret
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «غَامِض» صفة مشبّهة (adj) لا اسم (noun)، والمجموعة مصنّفة اسمًا (n)، فلا يصح إدراج صفة صرفة لمّةً في مجموعة اسمية ما لم تُستعمل استعمال الاسم استعمالاً ثابتًا"
      - "اللمّة «أَبُو الْهَوْل» ترتبط في المعاجم بالتمثال الفرعوني (اسم علم) لا بالشخص الغامض مجازيًّا؛ الاستعمال المجازي للدلالة على الشخص الغامض موجود في الصحافة المعاصرة لكنّه نقل ثقافي عن الإنجليزية"
      - "عُقدة المجموعة العُليا (hypernym) «عامل / فاعل» = شخص يعمل وينجز الأمور، وهي علاقة ضعيفة دلاليًّا مع مفهوم الشخص الغامض"
    observations: "المفهوم المستهدف هو نمط شخصي يُوصف به من يصعب استكناه أفكاره ونواياه — وهو مفهوم موجود في الثقافة العربية لكنّه يُعبَّر عنه غالبًا بأوصاف لا بأسماء جامدة (كتوم، مستغلق، غامض). المقابل الإنجليزي sphinx بمعناه المجازي مأخوذ من الأسطورة اليونانية، وقد انتقل إلى العربية بصيغة «أبو الهول» مع بقاء الدلالة الأولى على التمثال. يُحتاج إلى تأكيد الاستعمال المجازي العربي أو إيجاد بديل أصيل."

  blind_candidates:
    - lemma: "كَتُوم"
      generation_method: ishtiqaq
      justification: "من جذر «كتم» الدالّ على الإخفاء والستر، على وزن فَعُول الدالّ على المبالغة في الصفة، فالكتوم من يُكثر كتمان ما في نفسه"
    - lemma: "مُسْتَغْلِق"
      generation_method: ishtiqaq
      justification: "من جذر «غلق» الدالّ على نشوب الشيء في الشيء والانغلاق، على وزن مُسْتَفْعِل بمعنى من استغلق فهمه على الناس فلا يُنفذ إلى باطنه"
    - lemma: "أَبُو الْأَسْرَار"
      generation_method: tarkib
      justification: "مركب إضافي من «أبو» و«الأسرار»، على نسق الكُنى العربية (أبو كذا) للدلالة على صاحب الأسرار الذي لا يبوح بشيء"
    - lemma: "طَلْسَم"
      generation_method: majaz
      justification: "إزاحة دلالية من الطَّلْسَم بمعنى السرّ المكتوم واللغز الغامض المبهم، فيُطلق على الشخص الذي يشبه الطلسم في غموضه واستعصائه على الفهم"


stage2_evidence:
  per_lemma:
    - lemma: "أَبُو الْهَوْل"
      confirm:
        - text: "«تمثال برأس بشري وجسم حيوان»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
      contradicts:
        - text: "«تمثال فرعونىّ بجانب أهرام الجيزة»"
          source: "المعجم الكبير"
          conflict: "التعريف المعجمي يقصره على التمثال الفرعوني (اسم علم) ولا يذكر الاستعمال المجازي للشخص الغامض"
      expands:
        - text: "«sphinx» (translation_en)"
          source: "المورد الحديث (2008)"
          addition: "يؤكد أنّ المقابل الإنجليزي sphinx يشمل أبو الهول، لكن المورد الحديث يُدخله كعنوان إنجليزي لا كمدخل عربي مستقل بمعنى الشخص الغامض"

    - lemma: "غَامِض"
      contradicts:
        - text: "«رجل غامض: فاتر عن الحملة خامل»"
          source: "المعجم الوسيط"
          conflict: "دلالة «رجل غامض» في المعاجم هي الخامل المغمور لا الغامض المستعصي على الفهم، فضلاً عن كونها صفة لا اسمًا"
        - text: "«الخامِلُ الذليلُ، والحَسَبُ الغَيْرُ المَعْرُوف»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "يؤكد أنّ غامض صفة للخمول والذلّة لا للغموض بمعنى الاستعصاء على الفهم في وصف الأشخاص"
      expands:
        - text: "«غامض؛ مُبْهَم؛ مُلْغَز»"
          source: "المورد الحديث (2008) — ترجمة inscrutable"
          addition: "يُستعمل «غامض» في المعاجم الثنائية مقابلاً لـ inscrutable لكنّه يظلّ صفة لا اسمًا"

    - lemma: "كَتُوم"
      contradicts:
        - text: "«الكتوم: الكتمة، وسحاب كتوم: لا رعد فيه»"
          source: "المعجم الوسيط (الحواراني)"
          conflict: "تعريف الكتوم في المعجم الوسيط مقصور على السحاب والناقة والأشياء، ولا يُذكر استعماله صفةً للشخص الغامض المستعصي"
        - text: "«ناقةٌ كَتُومٌ: لا تَرْغُو إذا رُكِبَتْ، قُوَّةً وصَبْرًا. وسَحابٌ مُكْتَتِمٌ: لا رعدَ فيه. وخَرْزٌ كَتِيمٌ: لا يَنْضَحُ الماء»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "جميع شواهد كتوم في مقاييس اللغة لأشياء مادية (ناقة، سحاب، خرز) لا لأشخاص"
      expands:
        - text: "«كالأرض التي تمسك الماء ولا تنضح، أو الأرض التي يكون ترابها طينيًّا»"
          source: "المعجم الموحد لعلم الأحياء (ArabTerm)"
          addition: "يُستعمل كتوم في المصطلحات العلمية الحديثة بمعنى impermeable/impervious"

    - lemma: "مُسْتَغْلِق"
      expands:
        - text: "«مُسْتَغْلِق — cleidoic»"
          source: "المعجم الطبي الموحد (ArabTerm)"
          addition: "الاستعمال المسجّل الوحيد مصطلح طبّي (بيضة مستغلقة) لا وصف للشخص"

    - lemma: "أَبُو الْأَسْرَار"
      evidence_status: "no_material_found"

    - lemma: "طَلْسَم"
      confirm:
        - text: "«اسمٌ للسِّرِّ المَكْتُومِ، وقد كَثُرَ استعمالُ الصُّوفِيَّةِ في كلامهم فيقولون: سِرٌّ مُطَلْسَمٌ، وحِجَابٌ مُطَلْسَمٌ، وذَاتٌ مُطَلْسَمٌ»"
          source: "تاج العروس للزبيدي"
      contradicts:
        - text: "«(في عِلْمِ السِّحْرِ): خُطُوطٌ وأعدادٌ يَزْعُمُ كاتبُها أنَّهُ يربط بها روحانيَّاتِ الكواكب العُلْوية بالطبائع السفلية لجَلْبِ مَحْبُوبِ أو دفع أذًى»"
          source: "المعجم الوسيط"
          conflict: "الطلسم في الأصل شيء مادي (تعويذة/خطوط) لا شخص، والمعنى المجازي «لغز غامض» يُطلق على الأمور لا على الأشخاص عادةً"
      expands:
        - text: "«طَلْسَمَ الرجلُ: كَرَّه وَجْهَه وقَطَّبَه ... وطَلْسَمَ: أَطْرَقَ»"
          source: "لسان العرب لابن منظور"
          addition: "الفعل طلسم يُطلق على الشخص العابس المطرق، مما يدعم إمكان إطلاق الاسم مجازًا على الشخص المنغلق"


stage3_analysis:
  per_lemma:
    - lemma: "أَبُو الْهَوْل"
      decision: confirmed
      decision_reason: "رغم أنّ الدلالة الأولى لـ«أبو الهول» هي التمثال الفرعوني، فإنّ الاستعمال المجازي للشخص الغامض المستعصي على الفهم مُتداوَل في العربية المعاصرة (نقلاً عن الاستعمال الإنجليزي لـ sphinx)، وهو المقابل العربي الوحيد المسكوك لهذا المفهوم. المركّب إضافي ثابت (كنية) لا يقبل التبديل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدلّ على الشخص الذي يشبه تمثال أبي الهول في جموده وغموضه، مع إيحاء بالهيبة والرهبة — وهو استعارة ثقافية مسكوكة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَبُو الْهَوْل"

    - lemma: "غَامِض"
      decision: removed
      decision_reason: "«غامض» صفة مشبّهة (اسم فاعل) جنسها الصرفي adj لا noun، والمجموعة مصنّفة اسمًا. وتعريفات المعاجم التراثية للرجل الغامض تعني الخامل المغمور لا الغامض بمعنى المستعصي على الفهم، فالدلالة المطلوبة غير مؤكَّدة والتصنيف الصرفي مخالف."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كَتُوم"
      source: stage1
      decision: removed
      decision_reason: "شواهد المعاجم تقصر «كتوم» على الأشياء المادية (ناقة لا ترغو، سحاب لا رعد فيه، أرض لا تنضح الماء). الجذر «كتم» يدلّ على الإخفاء لكنّ الصيغة فَعُول لم تُنقل في المعاجم إلى وصف الأشخاص بمعنى الاستعصاء على الفهم. فضلاً عن ذلك، الكتوم يدلّ على فعل الإخفاء الإرادي لا على صفة الغموض الذاتي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُسْتَغْلِق"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على استعمال «مستغلق» وصفًا للشخص الغامض؛ الاستعمال المسجّل الوحيد مصطلح طبّي (cleidoic). وأصل الجذر «غلق» يدلّ على النشوب والانغلاق المادي لا على الغموض النفسي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "أَبُو الْأَسْرَار"
      source: stage1
      decision: removed
      decision_reason: "مركّب إضافي غير مسجّل في أيّ معجم ولا مُثبت في الاستعمال اللغوي. لا يجتاز اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "طَلْسَم"
      source: stage1
      decision: removed
      decision_reason: "الطلسم في المعاجم اسم للسرّ المكتوم والتعويذة، لا للشخص. والفعل «طلسم» يعني كرّه وجهه وأطرق، وهو أقرب إلى العبوس منه إلى الغموض. لا يُطلق الطلسم على الأشخاص في الاستعمال المعجمي المسجّل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


