# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-10721816-n
# termer — شخص يقضي فترة محددة
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «قَاضِي فَتْرَة» عبارة وصفية حرّة وليست مصطلحاً مسكوكاً ثابتاً"
      - "لفظ «القاضي» يثير التباساً شديداً مع المعنى السائد (الحاكم الشرعي/القانوني)"
      - "التعريف العربي شبه دوري: «شخص يقضي فترة محددة» يكاد يكون إعادة صياغة للّمّة ذاتها"
      - "المفهوم الإنجليزي termer عامّي غير رسمي، يحتاج تعريفاً عربياً أدقّ يحدّد سياق الاستخدام (سجن، رئاسة، خدمة)"
    observations: "المفهوم يدلّ على شخص يمضي مدّة معيّنة في منصب أو سجن أو خدمة. المفهوم ليس غريباً عن العربية لكنّه يُعبَّر عنه عادةً بعبارة لا بكلمة مفردة. البحث عن لفظ مفرد مشتقّ من جذر يدلّ على الفترة الزمنية هو المسار الأمثل."

  blind_candidates:
    - lemma: "مُفْتِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أَفْتَرَ (رباعي) على وزن مُفْعِل، بمعنى مَنْ يقضي فترةً. الجذر فتر يدلّ على المدّة الفاصلة بين زمنَيْن، والوزن مُفْعِل يصلح لمن يقوم بالفعل."
    - lemma: "مُدَّتِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى مُدَّة (مقدار من الزمان)، على قياس نِسَب مثل شَهْرِيّ ويَوْمِيّ، للدلالة على مَنْ يرتبط بمدّة محدّدة."
    - lemma: "ذُو أَمَدٍ"
      generation_method: tarkib
      justification: "مركب إضافي من ذو + أَمَد (الغاية الزمنية)، للدلالة على صاحب أجل زمني محدَّد."
    - lemma: "أَمَدِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى أَمَد (المنتهى والغاية الزمنية)، للدلالة على مَنْ تتحدّد خدمته أو إقامته بأمد معلوم."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "قَاضِي فَتْرَة"
      contradicts:
        - text: "«القَاضِي: القاطع للأمور المحكم لها، من يقضي بين الناس بحكم الشرع، من تعيّنه الدولة للنظر في الخصومات والدعاوى وإصدار الأحكام»"
          source: "المعجم الوسيط"
          conflict: "القاضي في جميع المعاجم العربية = الحاكم الشرعي أو القانوني، لا مَنْ يقضي فترةً زمنية"
        - text: "«القاضي: من نصبه الإمام بناحية مخصوصة لينفذ بها الأحكام ويأخذ على أيدي مرتكبي خلاف الحق»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى المعجمي الثابت للقاضي هو الحاكم الشرعي، لا وجود لمعنى «مَنْ يقضي فترة» كوحدة معجمية"
      expands:
        - text: "«الفَتْرَة: الضعف والانكسار، والمدة تقع بين زمنَيْن أو نبيَّيْن»"
          source: "المعجم الوسيط"
          addition: "فترة بمعنى المدّة الزمنية استعمال حديث مولّد، أصلها الضعف والسكون"

    - lemma: "مُفْتِر"
      confirm:
        - text: "«المُفْتِر: من يقضي فترةً في رئاسة أو سجن إلخ.»"
          source: "المورد الحديث (2008)"

    - lemma: "مُدَّتِيّ"
      evidence_status: "no_material_found"

    - lemma: "ذُو أَمَدٍ"
      expands:
        - text: "«الأَمَدُ: الغاية والمنتهى»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الأمد = الغاية لا المدّة نفسها، فذو أمد = صاحب غاية، لا صاحب مدّة خدمة"
        - text: "«الأمد: الغاية... والأمد مدة لها حد مجهول إذا أُطلق وقد ينحصر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الأمد يختلف عن المدّة بأنه يُعتبر باعتبار الغاية والمنتهى"

    - lemma: "أَمَدِيّ"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "قَاضِي فَتْرَة"
      decision: removed
      decision_reason: "عبارة وصفية حرّة وليست وحدة معجمية ثابتة. لفظ «القاضي» مشحون دلالياً بمعنى الحاكم الشرعي في جميع المعاجم العربية، فيثير التباساً شديداً. يمكن استبدال «قاضي» بـ«ماضي» أو «مُمْضي» والعبارة تبقى وصفاً صالحاً، مما يعني أنها ليست مصطلحاً مسكوكاً. كما أنها لم تُسجَّل في أيّ معجم كوحدة معجمية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُفْتِر"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من أَفْتَرَ على وزن مُفْعِل، مشتقّ من الجذر فتر الدالّ على المدّة بين زمنَيْن. مُثبَت في المورد الحديث (2008) ترجمةً دقيقة لـ termer بمعنى «مَنْ يقضي فترةً في رئاسة أو سجن». الوزن مُفْعِل قياسيّ لاسم الفاعل الرباعي، واللفظ يقبل الجمع السالم (مُفْتِرون) والنسبة والتعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُفْتِر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُدَّتِيّ"
      source: stage1
      decision: removed
      decision_reason: "نسبة اصطناعية لم تُسجَّل في أيّ معجم ولا مدوَّنة. المدّة مفهوم عامّ جداً والنسبة إليها لا تفيد معنى «مَنْ يقضي مدّة» بل تفيد الانتساب إلى المدّة عموماً."

    - lemma: "ذُو أَمَدٍ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة تصف صاحب غاية زمنية، والأمد في المعاجم = الغاية والمنتهى لا المدّة نفسها. ليست وحدة معجمية ثابتة وتفشل في اختبار السكّ."

    - lemma: "أَمَدِيّ"
      source: stage1
      decision: removed
      decision_reason: "نسبة غير مسجّلة في المعاجم ولا في المدوَّنات. الأمد يدلّ على الغاية لا على قضاء فترة، فالنسبة إليه لا تؤدّي المعنى المطلوب."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "شخص يقضي فترة محددة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مبهم وشبه دوري، لا يحدّد طبيعة الفترة (سجن، منصب، خدمة)، ولا يميّز المفهوم عن أيّ شخص يمضي وقتاً في أيّ شيء."
    authored:
      - type: terminological
        text: "شخصٌ يَمْضِي مُدَّةً مُعَيَّنَةً في مَنْصِبٍ أَوْ سِجْنٍ أَوْ خِدْمَةٍ مُحَدَّدَة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخصٌ يَمْضِي مُدَّةً مُعَيَّنَةً في مَنْصِبٍ أَوْ سِجْنٍ أَوْ خِدْمَةٍ مُحَدَّدَة"

  examples:
    per_lemma:
      - lemma: "مُفْتِر"
        examples:
          - text: "عُيِّنَ مُفْتِراً في مَجْلِسِ الإِدَارَةِ لِأَرْبَعِ سَنَوَاتٍ قَبْلَ أَنْ يُجَدَّدَ لَهُ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "عُيِّنَ مُفْتِراً في مَجْلِسِ الإِدَارَةِ لِأَرْبَعِ سَنَوَاتٍ قَبْلَ أَنْ يُجَدَّدَ لَهُ."

# ── المرحلة ٥: الإثراء ─────────────────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "مُفْتِر"
      entry_id: "{auto}"
      root: "فتر"
      maqayis_quote: "«الْفَاءُ وَالتَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ضَعْفٍ فِي الشَّيْءِ. مِنْ ذَلِكَ: فَتَرَ الشَّيْءُ يَفْتُرُ فُتُورًا.»"

  per_sense:
    - lemma: "مُفْتِر"
      sense_id: "{auto}"
      nuance: "يدلّ على مَنْ يقضي فترة محدّدة في منصب أو سجن أو خدمة، بصيغة اسم الفاعل الرباعي من أَفْتَرَ"

  synset:
    cultural_fit: lexical_gap

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فتر","maqayis":"«الْفَاءُ وَالتَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ضَعْفٍ فِي الشَّيْءِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يدلّ على مَنْ يقضي فترة محدّدة في منصب أو سجن أو خدمة"}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"lexical_gap"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.65
