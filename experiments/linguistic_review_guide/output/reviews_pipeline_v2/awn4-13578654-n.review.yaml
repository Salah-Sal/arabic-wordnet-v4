# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13578654-n
# social process — عملية اجتماعية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (عملية اجتماعية)، وهي تركيب وصفي عام قد يحتاج إلى إثراء بمرادفات"
      - "اللمّة الموجودة بدون تشكيل كامل"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي ويحتاج إلى صياغة معجمية أدق"
    observations: "المفهوم ينتمي إلى حقل علم الاجتماع، وهو مفهوم فوقي (hypernym) يشمل عمليات مثل التنشئة الاجتماعية والتكامل الاجتماعي وغيرها. المركّب «عملية اجتماعية» مثبت في المعاجم المصطلحية (ALECSO) ترجمةً لـ social process. البحث عن مرادف مفرد صعب لأنّ المفهوم تقني مجرد لا يقابله لفظ عربي تراثي واحد."

  blind_candidates:
    - lemma: "تَأَلُّف"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّلٍ من الجذر (ألف) الدالّ على انضمام الشيء إلى الشيء واجتماع القوم وتحابّهم، فيصلح للدلالة على عملية تكوين المجموعات البشرية"
    - lemma: "تَجَمُّع"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّلٍ من الجذر (جمع) الدالّ على تضامّ الشيء، وهو يدلّ على عملية الانضمام وتكوين المجموعات"
    - lemma: "سِيرُورَة اجْتِمَاعِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «سيرورة» (process في المعاجم المصطلحية الحديثة) و«اجتماعية»، على غرار عملية اجتماعية"
    - lemma: "تَكَتُّل"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّلٍ من الجذر (كتل) الدالّ على التجمّع، ويُستعمل حديثاً بمعنى صيرورة الناس كتلةً واحدة متّفقة"


stage2_evidence:
  per_lemma:
    - lemma: "عَمَلِيَّة اجْتِمَاعِيَّة"
      confirm:
        - text: "«عملية اجتماعية — social process — processus social» (مجال: Sociology and Anthropology)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO/ArabTerm)"
      expands:
        - text: "«(العملية) جملة أعمال تُحدث أثراً خاصّاً. يقال عملية جراحية أو حربية أو مالية (محدثة)»"
          source: "المعجم الوسيط"
          addition: "تعريف المكوّن الأول «عملية» بوصفه مصدراً صناعياً محدَثاً من «عمل»"
        - text: "«عملية — process: إجراء يمتد على مدى فترة زمنية محددة، وأثناء حدوثه ينشأ أو يتطوّر شيء ما (تدريجياً)»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "تعريف تقني أدقّ لمكوّن «عملية» بمعنى process"

    - lemma: "تَأَلُّف"
      confirm:
        - text: "«(تألف) القومُ: اجتمعوا تحابّوا. الشيءُ: تنظّم. إلى فلان: استجار به. فلاناً: داراه وقاربه وواصله حتى يستميله إليه»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«(تألف) مطاوع ألفه. ائتلف. فلاناً: استماله»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية هي المطاوعة والائتلاف والاستمالة، وليست عملية تكوين مجموعات بالمعنى الاجتماعي التقني"
        - text: "«تآلف — chord» (مجال: الفيزياء)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "اللفظ مشغول بدلالة مصطلحية أخرى في الفيزياء"

    - lemma: "تَجَمُّع"
      confirm:
        - text: "«(تجمع) انضمّ بعضه إلى بعض»"
          source: "المعجم الوسيط"
        - text: "«تجمّع — aggregate» (مجال: Sociology and Anthropology)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO/ArabTerm)"
      contradicts:
        - text: "«تجمّع — aggregate / agglomeration / aggregation» (مجالات: الفيزياء، الكيمياء، الجيولوجيا)"
          source: "معاجم ALECSO المصطلحية المتعددة"
          conflict: "اللفظ مصطلح مستقلّ في علم الاجتماع بمعنى aggregate (تجمّع عشوائي) لا social process (عملية اجتماعية منظمة)"

    - lemma: "سِيرُورَة اجْتِمَاعِيَّة"
      confirm:
        - text: "«سَيْرُورَة — Process» (مجال: Language and Literature: في اللسانيات العامة، تطور تدريجي ومتتابع للغة وفقاً لقوانين مطّردة)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«عملية تكرارية، سيرورة تكرارية — iterative process»"
          source: "مسرد الفن، التسلية والرياضة (ALECSO/ArabTerm)"
          addition: "يُظهر أنّ «سيرورة» تُستعمل بديلاً عن «عملية» في سياقات مصطلحية متعدّدة"

    - lemma: "تَكَتُّل"
      confirm:
        - text: "«(تكتل) الناسُ: صاروا كتلةً أي جماعةً متّفقة على رأي واحد (مج)»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«تكتّل — agglomeration: تجمع مواد مختلفة في كتلة واحدة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "الدلالة المادّية (تجمّع مواد في كتلة) هي الأصل، والدلالة البشرية مقتصرة على التحالف السياسي/الفكري لا العملية الاجتماعية العامة"
        - text: "«تَكَتَّل: الرأي: مرفوضة — السبب: لأنها لم ترد في المعاجم القديمة بهذا المعنى — الصواب: فصيحة (أجازها مجمع اللغة المصري)»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "الاستعمال بمعنى تجمّع الناس محدَث ومقبول، لكنّه أخصّ من مفهوم العملية الاجتماعية"


stage3_analysis:
  per_lemma:
    - lemma: "عَمَلِيَّة اجْتِمَاعِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مثبت في مسرد علم الاجتماع والأنثروبولوجيا (ALECSO) مقابل social process، ومكوّناه (عملية + اجتماعية) مستقرّان في الاستعمال المعاصر. التشكيل الكامل مطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح الاجتماعي الرسمي المثبت في معاجم ALECSO للدلالة على أيّ سيرورة تشترك في تشكيل الجماعات البشرية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّة اجْتِمَاعِيَّة"

    - lemma: "تَأَلُّف"
      source: stage1
      decision: removed
      decision_reason: "دلالته الأصلية هي المطاوعة والائتلاف والاستمالة، وليست عملية اجتماعية بالمعنى التقني. كذلك هو فعل (تألّف) لا اسم عملية، ومشغول بدلالات أخرى (chord في الفيزياء). لا يصلح بديلاً عن المصطلح المثبت."

    - lemma: "تَجَمُّع"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مستقلّ في علم الاجتماع بمعنى aggregate (تجمّع عشوائي غير منظّم)، وهو مفهوم مختلف عن social process. إضافته ستُحدث خلطاً مصطلحياً بين المفهومين في الحقل ذاته."

    - lemma: "سِيرُورَة اجْتِمَاعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ «سيرورة» بديل حيّ لـ«عملية» في عدة مجالات، فإنّ المركّب «سيرورة اجتماعية» غير مثبت كوحدة معجمية في أيّ مسرد مصطلحي، والمصطلح المعتمد في علم الاجتماع هو «عملية اجتماعية»."

    - lemma: "تَكَتُّل"
      source: stage1
      decision: removed
      decision_reason: "يدلّ على صيرورة الناس كتلةً سياسية أو فكرية واحدة (bloc formation)، وهو أخصّ بكثير من المفهوم الفوقي «عملية اجتماعية» الذي يشمل التنشئة والتكامل والتغيّر وغيرها."


