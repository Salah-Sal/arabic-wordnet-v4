# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14763071-n (substrate)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «مادة تفاعل» بدون تشكيل وقد تلتبس بمعنى المادة المُتفاعلة (reagent) لا المادة المُتفاعَل عليها (substrate)"
      - "التعريف العربي الحالي جيد لكنه يذكر «خميرة» بجانب «إنزيم» وهما مترادفان تقريباً في الاستعمال الحديث"
    observations: "المجموعة تنتمي إلى حقل الكيمياء الحيوية وعلوم الإنزيمات. المفهوم واضح: المادة التي يرتبط بها الإنزيم ويحوّلها إلى نواتج. المصطلح الإنجليزي substrate مستقر عالمياً. التحدي العربي يكمن في التمييز بين الركيزة بمعناها الكيميائي الحيوي وبين استعمالاتها الكثيرة في الهندسة والبناء والجيولوجيا."

  blind_candidates:
    - lemma: "رَكِيزَة"
      generation_method: ishtiqaq
      justification: "من الجذر ركز (الثبات والارتكاز)، على وزن فَعِيلة. المادة التي يرتكز عليها الإنزيم في عمله التحفيزي، كما يرتكز الرامح على رمحه. مجاز مبني على أصل الثبات في المكان."

    - lemma: "مُنْخَمِرَة"
      generation_method: ishtiqaq
      justification: "من الجذر خمر على وزن مُنْفَعِلة (انخمر)، بمعنى المادة الخاضعة لفعل الخميرة. تناسب الشق الثاني من التعريف (خميرة) وتشير إلى الانفعال بفعل العامل الحفزي."

    - lemma: "مَادَّةُ التَّفَاعُلِ"
      generation_method: tarkib
      justification: "تركيب إضافي شائع في المعجمات العلمية العربية، يصف المادة التي يجري عليها التفاعل الإنزيمي. مباشر ووصفي."

    - lemma: "طُعْمَة"
      generation_method: majaz
      justification: "مجاز استعاري من الجذر طعم: كما أن الطُّعمة ما يُطعم فكأن الإنزيم يتغذى على هذه المادة فيحوّلها. محاولة لإحياء لفظ تراثي بإزاحة دلالية."

stage2_evidence:
  per_lemma:
    - lemma: "رَكِيزَة"
      confirm:
        - text: "«المركب الخاص الذي يعمل عليه الإنزيم.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«المادة التي يقع عليها تأثير الإنزيم.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«المادة التي تخضع لتفاعل أنزيميّ معين.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«مادة يجري عليها التفاعل الكيميائيّ.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ركيزة كيميائية"
        - text: "«بروتين خلوي يسرع التفاعل الكيميائي لمادة ما (ركيزة) وغالبا ما يختص بها»"
          source: "معجم المصطلحات الطبية (ج.2، 2003) — مدخل إنزيم"
        - text: "«ركازة، ركيزة — مادة التفاعل»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«(الركيزة) مَا يرتكز عَلَيْهِ والقطعة من جَوَاهِر الأَرْض المركوزة فِيهَا (ج) ركاز وركائز»"
          source: "المعجم الوسيط"
          addition: "المعنى اللغوي الأصلي: ما يُرتكز عليه. الجمع: ركائز وركاز."
        - text: "«الرَّاءُ وَالْكَافُ وَالزَّاءُ أَصْلَانِ: أَحَدُهُمَا إِثْبَاتُ شَيْءٍ فِي شَيْءٍ يَذْهَبُ سُفْلًا، وَالْآخَرُ صَوْتٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر ركز يدل على التثبيت والاستقرار، وهو أساس المجاز في المصطلح العلمي."
        - text: "«مادةٌ داعمةٌ غيرُ فعّالة تُستخدَمُ في إجرائية التصنيع. في لوحات الدارات: القاعدةُ التي تُربَط إليها الخطوطُ»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "استعمال مُوسّع للركيزة في المعلوماتية بمعنى القاعدة الداعمة."

    - lemma: "مَادَّة تَفَاعُل"
      confirm:
        - text: "«ركازة، ركيزة — مادة التفاعل»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«ركيزة، مادة التفاعل — المادة التي تخضع لتفاعل أنزيميّ معين.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"

    - lemma: "مُنْخَمِرَة"
      confirm:
        - text: "«المُنْخَمِرة: المادة الخاضعة لفعل خميرةٍ ما (كح).»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«المُنْخَمِرة: المادة الخاضعة لفعل خميرةٍ ما (كح).»"
          source: "المورد الحديث (2008)"
          conflict: "المصطلح مقصور على فعل الخميرة فقط ولا يشمل الإنزيمات عموماً، فهو أضيق من المفهوم المطلوب."

    - lemma: "طُعْمَة"
      contradicts:
        - text: "«(الطعمة) كل مَا يطعم والرزق والإتاوة وَالْخَرَاج وَالْغنيمَة وَوجه الْكسْب»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي الثابت هو الرزق والكسب والغنيمة، ولا علاقة له بالمادة الكيميائية التي يعمل عليها الإنزيم. المجاز بعيد جداً."

    - lemma: "مَادَّةُ التَّفَاعُلِ"
      confirm:
        - text: "«ركيزة، مادة التفاعل — المادة التي تخضع لتفاعل أنزيميّ معين.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"

    - lemma: "مُرْتَكَز"
      expands:
        - text: "«المواد التي تشكل القاعدة التي يعيش عليها كائن حي أو التي يتمسك بها.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: "مُرتكز يُستخدم بمعنى substrate البيئي (الوسط الذي يعيش عليه الكائن) لا الكيميائي الحيوي."

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "رَكِيزَة"
      decision: confirmed
      decision_reason: "مصطلح مُعتمد في ستة معاجم موحدة على الأقل (الوراثة، الصيدلة، تقانات الأغذية، الكيمياء، المعلوماتية، الطب) بمعنى substrate. الجذر ركز يدل على الثبات والارتكاز، والوزن فَعِيلة مناسب للدلالة على المادة التي يرتكز عليها فعل الإنزيم. التشكيل الكامل مطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح العلمي المُعتمد في المعجمات الموحدة، أدق وأخص من «مادة تفاعل» لأنه يميّز المادة التي يعمل عليها الإنزيم عن سائر المواد المتفاعلة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَكِيزَة"

    - lemma: "مَادَّة تَفَاعُل"
      decision: confirmed
      decision_reason: "وارد في المعجم الموحد لمصطلحات الكيمياء (1992) وتقانات الأغذية (2004) كمرادف لركيزة بمعنى substrate. تركيب إضافي ثابت ومسجّل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير وصفي شفاف يُستخدم في السياقات التعليمية والتبسيطية حيث يُراد توضيح المفهوم دون اللجوء إلى المصطلح المتخصص «ركيزة». أقل تخصصاً وأوضح دلالةً للقارئ غير المتخصص."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة تَفَاعُل"

    # ── مرشحات المرحلة ١ ──
    - lemma: "رَكِيزَة"
      source: stage1
      decision: removed
      decision_reason: "مطابقة للمّة الموجودة فعلاً في المجموعة، لا حاجة لإضافتها."

    - lemma: "مُنْخَمِرَة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مقصور على المادة الخاضعة لفعل الخميرة (ferment) فقط، ولا يشمل الإنزيمات عموماً. المفهوم المطلوب أعمّ (enzyme or ferment)، فالمُنخمرة أضيق نطاقاً ولا تصلح بديلاً شاملاً."
      evidence_assessment:
        case: mixed

    - lemma: "مَادَّةُ التَّفَاعُلِ"
      source: stage1
      decision: removed
      decision_reason: "تتطابق مع اللمّة الموجودة «مادة تفاعل» مع اختلاف شكلي في التعريف بالألف واللام. لا حاجة لإضافة مدخل مكرر."

    - lemma: "طُعْمَة"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعجمي الثابت (الرزق، الكسب، الغنيمة) بعيد جداً عن المادة الكيميائية التي يعمل عليها الإنزيم. المجاز غير مسكوك ولا مسجّل في أي معجم علمي."
      evidence_assessment:
        case: contradicts_only

