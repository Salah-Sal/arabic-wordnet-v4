# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10070240-n
# an operator of an elevator — مُشغل للمصعد
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «عامل مصعد» بدون تشكيل"
      - "التعريف العربي «مُشغل للمصعد» مختصر جدًّا ولا يبيّن أنّ المقصود شخص"
      - "المفهوم شبه منقرض في الواقع المعاصر (المصاعد الحديثة آلية)"
    observations: >-
      المجموعة تصف شخصًا وظيفته تشغيل المصعد الكهربائي في المباني، وهي مهنة كانت
      شائعة قبل انتشار المصاعد الآلية. التعريف العربي الحالي يستخدم «مُشغل» وهو
      لفظ يُطلق عادةً على الأجهزة (actuator) لا على الأشخاص. اللمّة الموجودة
      «عامل مصعد» مركّب إضافي مناسب ومثبت في مسارد أليكسو، لكنّه يحتاج تشكيلاً.
      هرم المعنى (hypernym) هو «عامل تشغيل / مُشَغِّل» وهذا صحيح.
  blind_candidates:
    - lemma: "مِصْعَدِيّ"
      generation_method: ishtiqaq
      justification: >-
        نسبة إلى المِصْعَد على وزن فِعْلالِيّ، بمعنى المنسوب إلى المصعد
        والعامل عليه، على غرار «سِكِّينِيّ» و«قِطارِيّ».
    - lemma: "مُشَغِّلُ المِصْعَدِ"
      generation_method: tarkib
      justification: >-
        مركّب إضافي من اسم الفاعل «مُشَغِّل» (من شَغَّلَ، باب التفعيل)
        مضافًا إلى «المصعد». يوافق التعريف مباشرة.
    - lemma: "سَائِقُ المِصْعَدِ"
      generation_method: tarkib
      justification: >-
        مركّب إضافي يستعير «سائق» بمعنى من يتحكّم في حركة آلة نقل،
        على قياس «سائق القطار».
    - lemma: "رَافِعِيّ"
      generation_method: ishtiqaq
      justification: >-
        نسبة إلى «رافعة» (مرادف المصعد في بعض السياقات)، على وزن فاعِلِيّ.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    # ─ اللمّة الموجودة ─
    - lemma: "عَامِلُ مِصْعَدٍ"
      confirm:
        - text: "«عامل مصعد» — translation_en: lift attendant"
          source: "مسرد الفن والتسلية والرياضة (أليكسو/ArabTerm)"
      expands:
        - text: "«غلام مصعد، صبي مصعد» — translation_en: elevator boy"
          source: "مسرد الفن والتسلية والرياضة (أليكسو/ArabTerm)"
          addition: "مصطلح بديل يخصّ الفتى العامل على المصعد"
        - text: "«صبي مصعد» — translation_en: lift boy"
          source: "مسرد الفن والتسلية والرياضة (أليكسو/ArabTerm)"
          addition: "صيغة أخرى لنفس المفهوم بتقييد عمري"

    # ─ المرشّح ١ ─
    - lemma: "مِصْعَدِيّ"
      evidence_status: "no_material_found"

    # ─ المرشّح ٢ ─
    - lemma: "مُشَغِّلُ المِصْعَدِ"
      expands:
        - text: "«مُشَغِّل» — شركة تتولّى تشغيل مُنشأة تقنية."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "مُشَغِّل في المعاجم التقنية يعني عنصر تحكّم أو شركة تشغيل، لا شخصاً بعينه"
        - text: "«مُشَغِّل» — هو عنصر مُسَيطر (مثل المُحرِّك المُؤازر، ووحدة التحويل والقبض، والصمام المغناطيسي، والقاطع للقدرة العالية)، يؤثر في العملية عن طريق التحكم في تدفّق المواد والطاقة."
          source: "مسرد الهندسة الكهربائية (أليكسو/ArabTerm)"
          addition: "مُشَغِّل في السياق الهندسي = actuator (جهاز لا شخص)"
      contradicts:
        - text: "«مُشَغِّل» في جميع المعاجم التقنية المتاحة يرد بمعنى الجهاز (actuator) أو الشركة (operator)، ولم يرد بمعنى الشخص العامل على المصعد"
          source: "مسارد أليكسو المتعددة"
          conflict: "الاستعمال المعجمي المثبت لـ«مُشَغِّل» لا يدلّ على شخص عامل مصعد"

    # ─ المرشّح ٣ ─
    - lemma: "سَائِقُ المِصْعَدِ"
      evidence_status: "no_material_found"

    # ─ المرشّح ٤ ─
    - lemma: "رَافِعِيّ"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ─ اللمّة الموجودة ─
    - lemma: "عَامِلُ مِصْعَدٍ"
      decision: confirmed
      decision_reason: >-
        اللمّة مثبتة في مسرد أليكسو (الفن والتسلية والرياضة) بترجمة «lift attendant»
        وهي مركّب إضافي شفّاف وسليم صرفيًّا. «عامل» اسم فاعل من عَمِلَ يدلّ على
        من يمارس عملاً، و«مصعد» اسم آلة من صَعِدَ. المركّب متداول ومفهوم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِلُ مِصْعَدٍ"

    # ─ المرشّح ١ ─
    - lemma: "مِصْعَدِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا شاهد معجمي عليه. النسبة إلى «مصعد» ممكنة صرفيًّا لكنّها غير مسكوكة
        ولا مثبتة في أيّ مسرد، وقد تلتبس بالصفة النسبية (ما يتعلّق بالمصعد)
        لا بمعنى الشخص الذي يشغّله.
      evidence_assessment:
        case: no_material

    # ─ المرشّح ٢ ─
    - lemma: "مُشَغِّلُ المِصْعَدِ"
      source: stage1
      decision: removed
      decision_reason: >-
        «مُشَغِّل» في المعاجم التقنية العربية مثبت بمعنى الجهاز (actuator) أو
        الشركة المشغّلة (operator company)، ولم يُوثَّق بمعنى الشخص العامل على
        المصعد. فضلاً عن ذلك، هذا المركّب يكاد يكون إعادة صياغة للتعريف نفسه
        (دوران معجمي).
      evidence_assessment:
        case: mixed

    # ─ المرشّح ٣ ─
    - lemma: "سَائِقُ المِصْعَدِ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا شاهد معجمي. «سائق» يدلّ على من يقود مركبة متحرّكة أفقيًّا عادةً،
        واستعماله مع المصعد (حركة عمودية) غير مألوف ولا مثبت.
      evidence_assessment:
        case: no_material

    # ─ المرشّح ٤ ─
    - lemma: "رَافِعِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا شاهد معجمي. «رافعة» في المعاجم الطبية والتقنية تعني أداة جراحية
        (elevator/lever) أو آلة رفع، والنسبة إليها لا تفيد معنى الشخص
        المشغّل للمصعد.
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "مُشغل للمصعد"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مختصر جدًّا ولا يصرّح بأنّ المقصود شخص (إنسان).
        لفظ «مُشغل» قد يُفهم على أنّه جهاز. يحتاج إلى تعريف يبيّن الجنس
        القريب (شخص/عامل) والفصل النوعي (يتولّى تشغيل المصعد).
    authored:
      - type: terminological
        text: "شَخْصٌ يَتَوَلَّى تَشْغِيلَ المِصْعَدِ الكَهْرَبَائِيِّ وَتَوْجِيهَهُ بَيْنَ الطَّوَابِقِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "عَامِلٌ كَانَ يَقِفُ دَاخِلَ المِصْعَدِ الكَهْرَبَائِيِّ لِتَشْغِيلِهِ وَتَوْجِيهِهِ إِلَى الطَّابِقِ المَطْلُوبِ، وَقَدْ شَاعَتْ هَذِهِ المِهْنَةُ قَبْلَ انْتِشَارِ المَصَاعِدِ الآلِيَّةِ ذَاتِيَّةِ الخِدْمَةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَتَوَلَّى تَشْغِيلَ المِصْعَدِ الكَهْرَبَائِيِّ وَتَوْجِيهَهُ بَيْنَ الطَّوَابِقِ"

  examples:
    per_lemma:
      - lemma: "عَامِلُ مِصْعَدٍ"
        examples:
          - text: "ضَغَطَ عَامِلُ المِصْعَدِ عَلَى زِرِّ الطَّابِقِ العَاشِرِ بَعْدَ أَنْ أَغْلَقَ البَابَ الحَدِيدِيَّ يَدَوِيًّا."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "ضَغَطَ عَامِلُ المِصْعَدِ عَلَى زِرِّ الطَّابِقِ العَاشِرِ بَعْدَ أَنْ أَغْلَقَ البَابَ الحَدِيدِيَّ يَدَوِيًّا."

