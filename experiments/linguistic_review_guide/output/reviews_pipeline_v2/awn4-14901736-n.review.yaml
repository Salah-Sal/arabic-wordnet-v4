# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14901736-n (gas / غاز)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (غاز)، وهي كلمة معرَّبة من الهولندية/اللاتينية، مما يثير سؤالاً عن وجود بدائل عربية أصيلة"
      - "اللمّة الموجودة بدون تشكيل كامل"
    observations: "المفهوم المستهدف هو الحالة الغازية للمادة بوصفها مائعاً لا شكل له ولا حجم محدد وقابلاً للتمدد إلى ما لا نهاية. هذا مفهوم فيزيائي حديث نسبياً بصياغته العلمية الدقيقة، وإن كان العرب القدماء عرفوا مفاهيم قريبة كالهواء والبخار والدخان. المصطلح «غاز» مستقرّ في الاستعمال العلمي العربي المعاصر منذ أكثر من قرن، وأقرّته المجامع اللغوية."
  blind_candidates:
    - lemma: "غَازٌ"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح العالمي gas المصوغ من الهولندية/اللاتينية، وهو المصطلح المستقر في جميع المعاجم العلمية العربية الحديثة، أقرّه مجمع اللغة العربية بالقاهرة"
    - lemma: "هَوَاءٌ"
      generation_method: majaz
      justification: "الهواء في الأصل اسم لخليط الغازات المحيط بالأرض، يمكن توسيعه مجازاً ليشمل أي مادة في الحالة الغازية، لكنه أخصّ من المفهوم المطلوب"
    - lemma: "بُخَارٌ"
      generation_method: majaz
      justification: "البخار عند القدماء جسم مركب من أجزاء هوائية ومائية، والمحدثون يخصّونه بالطور الغازي لمادة سائلة أو صلبة في الأصل، فهو أضيق من مفهوم الغاز العام"
    - lemma: "لَطِيفٌ"
      generation_method: majaz
      justification: "اللطيف في الفلسفة الطبيعية القديمة يُطلق على ما رقّ قوامه وسهل تشكّله وقبل الانقسام إلى أجزاء صغيرة، وهي صفات الغاز، لكنه وصف عام لا مصطلح مخصوص"

stage2_evidence:
  per_lemma:
    - lemma: "غَازٌ"
      confirm:
        - text: "«حالة من حالات المادة الثلاث تكون فى العادة شفافة, تتميز بأنها تَشْغل كلَّ حيِّز توضع فيه وتتشكل بشكله, كالهواء والأكسجين وثانى أكسيد الكربون فى درجات الحرارة والضغط العاديين. (مج)»"
          source: "المعجم الوسيط"
        - text: "«حَالَة من حالات الْمَادَّة الثَّلَاث تكون فِي الْعَادة شفافة تتَمَيَّز بِأَنَّهَا تشغل كل حيّز تُوضَع فِيهِ وتتشكل بشكله كالهواء والأكسجين وَثَانِي أكسيد الكربون فِي دَرَجَات الْحَرَارَة والضغط العاديين (مج)»"
          source: "المعجم الوسيط (نسخة هورماني)"
        - text: "«(فز) حالة من حالات المادّة الثلاث تكون في العادة شفّافة، تتميَّز بأنّها تشغل كلّ حيِّز تُوضع فيه وتشكَّل بشكله، كالهواء والأكسجين وثاني أكسيد الكربون في درجات الحرارة والضغط العاديَّين، ويمكن عادة إسالة أيّ غاز بزيادة الضَّغط عليه مع خفض درجة حرارته»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«إحدى الحالات الثلاث للمادة. ليس له شكل أو حجم محدد وقادر على التمدد على نحو غير محدود»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«غاز الفحم: مخلوط من الغازات يسْتَعْمل فِي المواقد والإنارة. غاز الاستصباح: كل غاز يستخدم فِي الإضاءة بإشعاله. غاز الْخَرْدَل: غاز سَام يسْتَعْمل فِي الحروب»"
          source: "المعجم الوسيط (نسخة هورماني)"
          addition: "مركبات اصطلاحية متعددة تؤكد إنتاجية المصطلح في التركيب العلمي العربي"
    - lemma: "هَوَاءٌ"
      contradicts:
        - text: "«غاز يغلِّف الكرة الأرضية ويتكوَّن من الآزوت والأكسجين وغازات قليلة أخرى»"
          source: "المعجم الوسيط"
          conflict: "الهواء مادة بعينها (خليط غازي محدد) وليس مفهوم الغاز العام"
        - text: "«الهواء: بالمد، جسم بسيط حار رطب شفاف لطيف متحرك لمكان فوق كرة الأرض والماء، وتحت كرة النار»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "تعريف الهواء بوصفه عنصراً من العناصر الأربعة، لا مفهوماً عاماً للحالة الغازية"
    - lemma: "بُخَارٌ"
      contradicts:
        - text: "«كل ما يصعد كالدُّخان من السوائل الحارة الرائحة»"
          source: "المعجم الوسيط"
          conflict: "البخار مخصوص بما يتصاعد من السوائل الحارة، وليس مرادفاً للغاز بإطلاق"
        - text: "«الحالة الغازية لمادة والتي تكون في الحالة السائلة أو الصلبة عند ضغط ودرجة حرارة قياسيين»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "البخار (vapor) يُشترط فيه أن تكون المادة سائلة أو صلبة في الظروف القياسية، بخلاف الغاز (gas) الذي يكون غازياً في الظروف القياسية"
    - lemma: "لَطِيفٌ"
      contradicts:
        - text: "«اللَّطِيف: يُطلق على خَمْسَة معَان: الأول سهل التشكل، الثاني رَقِيق القوام، الثالث قَابل الانقسام إِلَى أَجزَاء صَغِيرَة جدا، الرابع سريع التأثر عَن الملاقي، الخامس الشفاف»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "اللطيف وصف عام لما رقّ ودقّ، وليس مصطلحاً مخصوصاً بالحالة الغازية"

stage3_analysis:
  per_lemma:
    - lemma: "غَازٌ"
      decision: confirmed
      decision_reason: "مصطلح مستقر أقرّه مجمع اللغة العربية بالقاهرة، واردٌ في المعجم الوسيط ومعجم اللغة العربية المعاصرة وعشرات المعاجم الاصطلاحية، وهو المصطلح الوحيد المتداول في الخطاب العلمي العربي للدلالة على هذا المفهوم الفيزيائي"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَازٌ"
    - lemma: "هَوَاءٌ"
      source: stage1
      decision: removed
      decision_reason: "الهواء مادة بعينها — خليط غازي محدد التركيب يغلّف الكرة الأرضية — وليس مرادفاً لمفهوم الغاز العام. في الفيزياء الحديثة، الهواء نوعٌ من الغاز وليس مساوياً له"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "بُخَارٌ"
      source: stage1
      decision: removed
      decision_reason: "البخار (vapor) مفهوم أضيق من الغاز (gas)؛ يُشترط فيه أن تكون المادة سائلة أو صلبة في الظروف القياسية، بينما الغاز يُطلق على ما هو في الحالة الغازية أصلاً في تلك الظروف. الفرق بينهما جوهري في الكيمياء والفيزياء"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "لَطِيفٌ"
      source: stage1
      decision: removed
      decision_reason: "اللطيف وصف عام ينطبق على أي شيء رقّ ودقّ، ولم يُسكّ مصطلحاً للحالة الغازية في أي معجم عربي قديم أو حديث. لا يصلح بديلاً لمصطلح علمي محدد"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

