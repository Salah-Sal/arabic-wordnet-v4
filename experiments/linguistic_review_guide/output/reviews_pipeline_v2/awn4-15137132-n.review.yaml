# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15137132-n (vitrification)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مادة مزججة» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ (يمكن إبدال «مزججة» بـ«محروقة» أو «مطلية» دون كسر البنية)"
      - "المجموعة تفتقر إلى مصطلح مفرد مشتقّ من جذر «زجج» رغم ثراء العائلة الاشتقاقية"
      - "التعريف العربي فيه دوران جزئي: يستخدم «التزجيج» لتعريف نتيجة التزجيج"
    observations: "المفهوم يتعلق بالمادة الناتجة عن عملية التحول إلى حالة زجاجية. الجذر «زجج» غزير الاشتقاق في العربية ومنه: زُجاج، تزجيج، مُزجَّج، زُجاجيّ. المصدر «تفعيل» (تزجيج) يدل في الاستعمال المصطلحي على العملية ونتيجتها معاً. المصدر «تفعُّل» (تزجُّج) يؤكد الجانب اللازم من التحوّل."

  blind_candidates:
    - lemma: "تَزْجِيج"
      generation_method: ishtiqaq
      justification: "مصدر تَفْعِيل من الجذر «زجج»، يدل على عملية التحويل إلى زجاج ونتيجتها، وهو الوزن المعياري للدلالة على الفعل المتعدي وأثره"
    - lemma: "تَزَجُّج"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من الباب الخامس (تزجَّجَ)، يدل على التحول الذاتي إلى حالة زجاجية — أنسب للدلالة على الحالة الناتجة"
    - lemma: "مُزَجَّج"
      generation_method: ishtiqaq
      justification: "اسم مفعول من زجَّجَ، يدل على المادة التي خضعت لعملية التزجيج — لكنه صفة وليس اسم مادة مستقلاً"
    - lemma: "زُجَاجِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «زجاج» على وزن فُعالِيَّة، يدل على الحالة أو الصفة الزجاجية كمفهوم مجرد"


stage2_evidence:
  per_lemma:
    - lemma: "مَادَّة مُزَجَّجَة"
      evidence_status: "no_material_found"

    - lemma: "تَزْجِيج"
      confirm:
        - text: "«تكنولوجيا تستخدم لمعلاجة بعض النفايات الخطيرة (نفايات مشعة) في درجات حرارة عالية مع إضافة مواد زجاجية حيث ينصهر الكل ويكون مادة متراصة تشبه الزجاج عندما تبرد»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«(1) تزجيج (2) تزجُّج.» — translation_en: vitrification"
          source: "المورد الحديث (2008)"
        - text: "«تحويل إلى مادة تشبه الزجاج في شفافيته.» — translation_en: hyalinization"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
      expands:
        - text: "«translation_en: vitrification» — domain: Chemistry"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يؤكد استعمال المصطلح في الكيمياء"
        - text: "«translation_en: glazing» — domain: Masonry - Carpentry"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
          addition: "يدل على أن تزجيج يُستخدم أيضاً بمعنى التزجيج السطحي (glazing) لا الذوبان الكلي فقط"

    - lemma: "تَزَجُّج"
      confirm:
        - text: "«تزجُّج، تزجيج: تحول المادة المتبلورة إلى زجاج» — translation_en: vitrification"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«تزجج، تزجيج: تحول المادة المتبلورة إلى زجاج» — translation_en: vitrification"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«(1) تزجيج (2) تزجُّج.» — translation_en: vitrification"
          source: "المورد الحديث (2008)"

    - lemma: "مُزَجَّج"
      confirm:
        - text: "«(1) مُزَجَّج (2) صقيل glazed paper.» — translation_en: glazed"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«آجرة مزجّجة» — translation_en: vitrified brick"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
          conflict: "مُزجَّج يُستخدم صفةً لموصوف لا اسماً مستقلاً للمادة"

    - lemma: "زُجَاجِيَّة"
      contradicts:
        - text: "«مادة شفافة زلالية تنتج عن حرض المادة النشوانية.» — translation_en: hyalin"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: "زجاجية في الاستعمال الطبي تعني الهيالين (مادة زلالية شفافة)، لا نتيجة التزجيج الحراري"


stage3_analysis:
  per_lemma:
    - lemma: "مَادَّة مُزَجَّجَة"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست وحدة معجمية ثابتة. تفشل في اختبار السكّ: يمكن القول «مادة محروقة» أو «مادة مصهورة» بالبنية نفسها دون أن تكون مصطلحاً. لا يوجد أي مدخل معجمي لها. المصدر «تزجيج» أو «تزجُّج» أدقّ وأرسخ في المعاجم المصطلحية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَزْجِيج"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح راسخ في المعاجم المصطلحية العربية الموحدة (الكيمياء، الجيولوجيا، البيئة، الطب) مقابل vitrification. المصدر على وزن تَفْعِيل يدل على العملية ونتيجتها. مؤيَّد بتعريف مسرد المناخ والبيئة الذي يذكر صراحة المادة الناتجة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الفعل المتعدي: عملية تحويل شيء إلى حالة زجاجية من الخارج، ونتيجة تلك العملية"
      actions:
        - command: create_entry
          params: {lemma: "تَزْجِيج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَزَجُّج"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مصطلحي مؤيَّد في معاجم الجيولوجيا وعلوم الزلازل والمورد الحديث. مصدر تفعُّل يدل على التحول الذاتي اللازم إلى حالة زجاجية، وهو أقرب دلالياً إلى مفهوم المجموعة (المادة التي تحولت)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الفعل اللازم: تحوُّل المادة ذاتها إلى حالة زجاجية — أقرب إلى وصف الحالة الناتجة"
      actions:
        - command: create_entry
          params: {lemma: "تَزَجُّج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُزَجَّج"
      source: stage1
      decision: removed
      decision_reason: "اسم مفعول يُستخدم صفةً (آجر مزجَّج، باب مزجَّج) لا اسماً مستقلاً للمادة الناتجة عن التزجيج. لا يصلح لمّةً اسمية في مجموعة ترادفية صنفها اسم."

    - lemma: "زُجَاجِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مشغول في الاستعمال الطبي بمعنى الهيالين (hyalin)، وهو مادة زلالية شفافة مختلفة تماماً عن المادة المُزجَّجة الناتجة عن الصهر الحراري. استعماله هنا يولّد اشتراكاً لفظياً مُربكاً."


stage4_content:
  definition:
    current: "مادة تحولت إلى زجاج؛ النتيجة الزجاجية لعملية التزجيج"
    assessment:
      decision: revise
      reason: "التعريف الحالي فيه دوران (يعرّف بـ«التزجيج» وهو المصطلح ذاته)، ويفتقر إلى الجنس القريب الدقيق. يُعاد صياغته بأسلوب المعجم الوسيط."
    authored:
      - type: terminological
        text: "مادّةٌ صُلْبَةٌ شِبْهُ شفّافةٍ ناتجةٌ عن صَهْرِ موادَّ بِلَّوْرِيَّة أو غيرها في درجات حرارةٍ عاليةٍ حتى تتحوَّلَ إلى كتلة تُشبِهُ الزُّجاجَ في بِنْيَتِها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ناتجُ عمليّةِ التَّزْجيج، وهو تحويلُ مادّةٍ بِلَّوْرِيَّة أو مَسْحوقيّة إلى كتلةٍ صُلْبةٍ مُتراصّة ذات بِنْيَةٍ زُجاجِيَّة غير مُنتَظَمة، بفعل الصَّهْرِ في درجات حرارة مرتفعة ثمّ التبريد السريع. يُستخدَم في معالجة النفايات المُشِعَّة وفي صناعة الخزف."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ صُلْبَةٌ شِبْهُ شفّافةٍ ناتجةٌ عن صَهْرِ موادَّ بِلَّوْرِيَّة أو غيرها في درجات حرارةٍ عاليةٍ حتى تتحوَّلَ إلى كتلة تُشبِهُ الزُّجاجَ في بِنْيَتِها."

  examples:
    per_lemma:
      - lemma: "تَزْجِيج"
        examples:
          - text: "يُعَدُّ التَّزْجِيجُ من أنجع الطرائق لتثبيت النفايات المُشِعَّة، إذ تُحبَسُ العناصر الضارّة داخل كتلة زجاجية متراصّة."
            type: usage
      - lemma: "تَزَجُّج"
        examples:
          - text: "لاحظ الجيولوجيّون تَزَجُّجَ الصخور البركانية عند سطح التدفّق نتيجةَ التبريد المفاجئ."
            type: usage
    actions:
