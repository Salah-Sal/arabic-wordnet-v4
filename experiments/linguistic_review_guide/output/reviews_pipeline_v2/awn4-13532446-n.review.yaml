# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13532446-n — market forces
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «قوى السوق» مركب إضافي بدون تشكيل"
      - "المجموعة تحتوي على لمّة واحدة فقط مما يحدّ من التغطية المعجمية"
    observations: >
      المفهوم اقتصادي حديث يعبّر عن التفاعل التلقائي بين العرض والطلب في تشكيل
      الأسعار والإنتاج. وهو مفهوم مستقر في الخطاب الاقتصادي العربي المعاصر،
      يُعبَّر عنه عادة بتراكيب إضافية. التعريف العربي الحالي واضح ومختصر
      لكنه يحتاج إلى تدقيق أسلوبي. المجموعة الأم «عملية اقتصادية»
      مناسبة كجنس أعلى.
  blind_candidates:
    - lemma: "قُوَى السُّوقِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «قُوَى» جمع «قُوَّة» بمعنى العامل المؤثّر، و«السُّوق»
        بمعنى ميدان التبادل التجاري. أقرب تعبير عربي للمفهوم الاقتصادي المراد.
    - lemma: "آلِيَّاتُ السُّوقِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «آليّات» جمع «آليّة» بمعنى الطريقة التلقائية للعمل،
        و«السُّوق». يُستعمل في الأدبيات الاقتصادية للدلالة على الميكانيزمات
        التي تُنظّم السوق ذاتياً.
    - lemma: "عَوَامِلُ السُّوقِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «عوامل» جمع «عامل» بمعنى المؤثّر والباعث،
        و«السُّوق». يُشير إلى العناصر المحرّكة لاقتصاد السوق كالعرض والطلب.
    - lemma: "مُحَرِّكَاتُ السُّوقِ"
      generation_method: ishtiqaq
      justification: >
        من الجذر «حرك» على وزن مُفَعِّلات، بمعنى ما يُحرّك السوق ويوجّهها.
        اشتقاق قياسي يدل على الفاعلية والتأثير في حركة الأسعار.

stage2_evidence:
  per_lemma:
    - lemma: "قُوَى السُّوقِ"
      confirm:
        - text: "«قوى السوق — market forces»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«قوى السوق — market forces»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
      expands:
        - text: "«(القُوَّةُ) خلافُ الضعف. وأصلُ ذلك من القُوَى، وهي جمع قُوَّة من قُوَى الحبل»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل «قوى» يدل على الشدة والتأثير، مما يناسب دلالة القوى المحرّكة"
        - text: "«(السُّوق) الموضع الذي يُجلب إليه المتاعُ والسلعُ للبيع والابتياع (تؤنث وتذكر) ... و(في الاقتصاد): السوقُ الرسمية: (البورصة) السوق المالية: سوق استغلال الأموال لأجَلٍ طويل»"
          source: "المعجم الوسيط"
          addition: "المعجم الوسيط يوثّق الاستعمالات الاقتصادية الحديثة لكلمة «سوق»"

    - lemma: "آلِيَّاتُ السُّوقِ"
      confirm:
        - text: "«آلية السوق — market mechanism»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
      contradicts:
        - text: "«آلية السوق — market mechanism»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "المصطلح يقابل «market mechanism» وليس «market forces»؛ الآلية تصف الطريقة التلقائية لعمل السوق، أما القوى فتصف العوامل المؤثّرة فيها"

    - lemma: "عَوَامِلُ السُّوقِ"
      evidence_status: "no_material_found"

    - lemma: "مُحَرِّكَاتُ السُّوقِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "قُوَى السُّوقِ"
      decision: confirmed
      decision_reason: >
        مصطلح اقتصادي مُوحَّد ومُثبَّت في معجمَيْن رسميَّيْن صادرَيْن عن
        المنظمة العربية للتربية والثقافة والعلوم (ALECSO)، يقابل «market forces»
        مباشرة. مركب إضافي شفّاف البنية، سهل التداول والاشتقاق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُوَى السُّوقِ"

    - lemma: "آلِيَّاتُ السُّوقِ"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح «آلية السوق» يقابل «market mechanism» لا «market forces»
        في المعجم الموحد لمصطلحات الاقتصاد. الفرق الدلالي جوهري: الآلية تصف
        كيفية عمل السوق (الكيفية)، أما القوى فتصف ما يُحرّك السوق ويؤثّر فيها (المؤثّرات).
        إدراجه هنا يُحدث خلطاً مفهومياً.
      evidence_assessment:
        case: mixed

    - lemma: "عَوَامِلُ السُّوقِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على شاهد معجمي يثبت هذا المركب كمصطلح اقتصادي مسكوك.
        كلمة «عوامل» أعمّ من «قوى» وتفتقر إلى الدلالة على الفاعلية الذاتية
        التي يحملها مصطلح «قوى السوق». كما أن «market factors» مفهوم مختلف
        عن «market forces» في الأدبيات الاقتصادية.
      evidence_assessment:
        case: no_material

    - lemma: "مُحَرِّكَاتُ السُّوقِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على شاهد معجمي. المصطلح مولَّد وغير مُثبَّت في أيّ معجم
        اقتصادي رسمي. دلالة «مُحرِّكات» تشير إلى عوامل التحفيز (market drivers)
        وهو مفهوم مختلف عن «market forces» الذي يركّز على التفاعل بين العرض والطلب.
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "التفاعل بين العرض والطلب الذي يشكل اقتصاد السوق"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في مضمونه لكنه يفتقر إلى الجنس القريب الصريح،
        ويصف النتيجة (تشكيل اقتصاد السوق) دون تحديد طبيعة القوى ذاتها.
        يحتاج إلى صياغة معجمية أدقّ بذكر الجنس (عوامل/قوى اقتصادية) والفصل النوعي.
    authored:
      - type: terminological
        text: "العَوَامِلُ الاقْتِصَادِيَّةُ النَّاشِئَةُ عَنْ تَفَاعُلِ العَرْضِ وَالطَّلَبِ، وَالَّتِي تُحَدِّدُ الأَسْعَارَ وَتُوَجِّهُ حَرَكَةَ الإِنْتَاجِ وَالاسْتِهْلاكِ فِي السُّوقِ الحُرَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَا يُؤَثِّرُ فِي حَرَكَةِ السُّوقِ مِنْ عَرْضٍ وَطَلَبٍ وَمُنَافَسَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "العَوَامِلُ الاقْتِصَادِيَّةُ النَّاشِئَةُ عَنْ تَفَاعُلِ العَرْضِ وَالطَّلَبِ، وَالَّتِي تُحَدِّدُ الأَسْعَارَ وَتُوَجِّهُ حَرَكَةَ الإِنْتَاجِ وَالاسْتِهْلاكِ فِي السُّوقِ الحُرَّةِ."

  examples:
    per_lemma:
      - lemma: "قُوَى السُّوقِ"
        examples:
          - text: "تَعْتَمِدُ السِّيَاسَةُ الاقْتِصَادِيَّةُ الجَدِيدَةُ عَلَى إِطْلاقِ قُوَى السُّوقِ لِتَحْدِيدِ أَسْعَارِ السِّلَعِ بَدَلاً مِنَ التَّسْعِيرِ الحُكُومِيِّ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تَعْتَمِدُ السِّيَاسَةُ الاقْتِصَادِيَّةُ الجَدِيدَةُ عَلَى إِطْلاقِ قُوَى السُّوقِ لِتَحْدِيدِ أَسْعَارِ السِّلَعِ بَدَلاً مِنَ التَّسْعِيرِ الحُكُومِيِّ."

