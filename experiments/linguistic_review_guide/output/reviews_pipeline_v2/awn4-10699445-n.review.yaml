# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. اللمّات المرشحة — توليد أعمى من التعريف المُقنَّع فقط
  # التعريف المُقنَّع: «شخص يرضخ أو يستسلم» (بدون لمّات)
  blind_candidates:
    - lemma: "مُذْعِن"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من أذعنَ يُذعِن إذعاناً (الباب الرابع من جذر ذعن)، دالٌّ
        على من انقاد وترك الإباء. الوزن مُفعِل مناسب لاسم الفاعل الإنساني
        المتصف بالانقياد. أصيل في العربية، يرد في التراث والمعاصر.

    - lemma: "خَاضِع"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من خضعَ يخضع خضوعاً (جذر خضع) على وزن فاعِل. يدل على
        التطامن والتذلل والانقياد. قريب من معنى «من يستسلم» في سياقات
        الإذعان للقوة أو السلطة.

    - lemma: "رَاضِخ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من رَضَخَ يرضخ رضوخاً (جذر رضخ) على وزن فاعِل. يُستعمل
        في الاستعمال المعاصر بمعنى من يقبل على مضض ويُذعن لضغط خارجي.
        والتعريف المُقنَّع يستعمل «يرضخ» بنفس هذه الدلالة.

    - lemma: "مُسَلِّم"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من سلَّمَ يُسلِّم تسليماً (الثلاثي المزيد بالتضعيف، باب
        التفعيل). يدل على من يُسلِّم نفسه أو أمره لغيره تاركاً المقاومة.
        الجذر سلم دالٌّ على الانقياد في العربية الكلاسيكية.

  # ب. التقييم الأولي بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة (مُسْتَسْلِم) مشتقة مباشرة من الفعل الوارد في التعريف (يستسلم)، مما يُثير شبهة الدوران المعجمي."
      - "التعريف يستخدم «يرضخ» في دلالتها الحديثة (= يستسلم)، بينما الأصل الكلاسيكي لرضخ هو الكسر والإعطاء القليل، لا الاستسلام. استعماله في التعريف يستدعي المراجعة."
      - "المجموعة تضم لمّة واحدة فقط مما يُفقدها التعبير عن الفروق الدلالية بين surrenderer وyielder."
      - "غياب أمثلة تطبيقية على مستوى المجموعة أو المعنى."
    observations: >
      المجموعة تصف شخصاً يُقدِم على فعل الاستسلام أو الرضوخ. المفهوم عربي
      أصيل تُعبّر عنه ألفاظ عديدة (مستسلم، مذعن، خاضع)، كل منها بظلاله
      الدلالية. اللمّة الوحيدة مُستسلِم صحيحة صرفياً (مُستفعِل من الفعل العاشر)
      وتُغطّي الدلالة المركزية (الاستسلام الكامل)، لكنها لا تُعبّر عن الإذعان
      الجزئي الذي يُلمح إليه yielder. المجموعة الفوقية (عامل/فاعل) عامة جداً،
      لكن الربط بها صحيح من حيث البنية الهرمية. يُوصى بإضافة مُذعِن تعزيزاً
      للتمييز الدلالي بين الاستسلام الكامل والانقياد الجزئي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
# (١) مطابقة دفعية: مستسلم / خاضع / مذعن / راضخ / مسلم وصيغ ال-
# (٢) جسر إنجليزي: surrenderer / yielder / surrender / yield
# (٣) FTS عربي: يرضخ، رضخ، يستسلم، استسلم، يذعن، اذعن
# (٤) عائلة الجذر سلم + مقاييس اللغة لابن فارس (dict 151)
stage2_evidence:
  per_lemma:

    # ── اللمّة الموجودة ──────────────────────────────────────
    - lemma: "مُسْتَسْلِم"
      confirm:
        - text: >
            «(١) يَسْتسلم [وبخاصة بشروط معيَّنة] (٢) يُذْعن؛ يكفّ عن المقاومة»
          source: "المورد الحديث (2008) — مدخل capitulate"
        - text: >
            «إرفعْ يديك! استسلِم!»
          source: "المورد الحديث (2008) — تعبير اصطلاحي"
      expands:
        - text: >
            «السِّينُ وَاللَّامُ وَالْمِيمُ مُعْظَمُ بَابِهِ مِنَ الصِّحَّةِ
            وَالْعَافِيَةِ... وَمِنَ الْبَابِ أَيْضًا الْإِسْلَامُ، وَهُوَ
            الِانْقِيَادُ؛ لِأَنَّهُ يَسْلَمُ مِنَ الْإِبَاءِ وَالِامْتِنَاعِ.
            وَالسِّلَامُ: الْمُسَالَمَةُ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يُرسِّخ ابن فارس معنى الانقياد وترك الإباء في جذر سلم، وهو المعنى
            المحوري لمُستسلِم.
        - text: >
            «الإسلام: الاستسلام لأمر الله تعالى، وهو الانقياد لطاعته والقبول
            لأمره»
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: >
            يثبت أن مصدر استسلم (الاستسلام) مستعمل في العربية الكلاسيكية بمعنى
            الانقياد الكامل؛ فاسم الفاعل مُستسلِم مشتق قياسي من هذا.

    # ── مرشح المرحلة ١: مُذْعِن ──────────────────────────────
    - lemma: "مُذْعِن"
      confirm:
        - text: >
            «الذَّالُ وَالْعَيْنُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى
            الْإِصْحَابِ وَالِانْقِيَادِ. يُقَالُ أَذْعَنَ الرَّجُلُ، إِذَا
            انْقَادَ، يُذْعِنُ إِذْعَانًا، وَبِنَاؤُهُ ذَعَنَ، إِلَّا أَنَّ
            اسْتِعْمَالَهُ أَذْعَنَ. وَيُقَالُ نَاقَةٌ مِذْعَانٌ: سَلِسَةُ
            الرَّأْسِ مُنْقَادَةٌ»
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «مطاوِع؛ مُذْعِن»
          source: "المورد الحديث (2008) — مدخل compliant"
        - text: >
            «مُطيع؛ مُذْعِن»
          source: "المورد الحديث (2008) — مدخل obedient"
        - text: >
            «يُذْعن لِـ؛ يَرْضَخ لِـ»
          source: "المورد الحديث (2008) — مدخل acquiesce"
      expands:
        - text: >
            «يراعي؛ يُذْعِن لِـ؛ ينزل عند إرادته أو رغبته»
          source: "المورد الحديث (2008) — مدخل defer to"
          addition: >
            يُبيّن أن الإذعان قد يكون تدريجياً («ينزل عند إرادته») لا مجرد
            استسلام كامل مفاجئ — فارق دلالي يُميّزه عن مُستسلِم.

    # ── مرشح المرحلة ١: خَاضِع ──────────────────────────────
    - lemma: "خَاضِع"
      confirm:
        - text: >
            «الْخُضُوعُ... هُوَ الذُّلُّ وَالِاسْتِخْذَاءُ. وَاخْتَضَعَ فُلَانٌ،
            أَيْ تَذَلَّلَ وَتَقَاصَرَ. وَرَجُلٌ أَخْضَعُ وَامْرَأَةٌ خَضْعَاءُ،
            وَهُمَا الرَّاضِيَانِ بِالذُّلِّ. وَرَجُلٌ خُضَعَةٌ: يَخْضَعُ
            لِكُلِّ أَحَدٍ»
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «خَضَعَ» — translation_en: yield (to)
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
      expands:
        - text: >
            «خَاضَعَ فُلانٌ فُلاناً: أَلانَ كلامَهُ معه»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            صيغة المفاعلة (خاضَعَ) تدل على الملاينة المتبادلة لا الاستسلام
            الأحادي، وهذا يُقيّد دلالة اسم الفاعل (خاضِع) بالسياق.

    # ── مرشح المرحلة ١: رَاضِخ ──────────────────────────────
    - lemma: "رَاضِخ"
      contradicts:
        - text: >
            «الرَّاءُ وَالضَّادُ وَالْخَاءُ كَلِمَةٌ تَدُلُّ عَلَى كَسْرٍ.
            وَيَكُونُ يَسِيرًا، ثُمَّ يُشْتَقُّ مِنْهُ. فَالرَّضْخُ: الْكَسْرُ;
            وَهُوَ الْأَصْلُ، ثُمَّ يُقَالُ رَضَخَ لَهُ، إِذَا أَعْطَاهُ شَيْئًا
            لَيْسَ بِالْكَثِيرِ، كَأَنَّهُ كَسَرَ لَهُ مِنْ مَالِهِ كِسْرَةً»
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            الدلالة الأصلية لرضخ هي الكسر والإعطاء القليل لا الاستسلام.
            المعنى المعاصر (الرضوخ = القبول القسري) تطور دلالي حديث لم يتثبّت
            معجمياً في صيغة اسم الفاعل (راضخ) تحديداً.
      confirm:
        - text: >
            «يُذْعن لِـ؛ يَرْضَخ لِـ»
          source: "المورد الحديث (2008) — مدخل acquiesce"

    # ── مرشح المرحلة ١: مُسَلِّم ─────────────────────────────
    - lemma: "مُسَلِّم"
      confirm:
        - text: >
            «مُسَلِّم: من (س ل م) المنقاد والراضي بالحكم والمُقِرّ والمتعرِّف»
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: >
            «الْمُسْلِمُ: مَنْ أَظْهَرَ الْخُضُوعَ وَالْقَبُولَ لِشَرِيعَةِ
            الْإِسْلَامِ»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            صيغة مُسْلِم (اسم فاعل من أسلمَ) مهيمنة دلالياً بالمعنى الديني.
            صيغة مُسَلِّم (من سلَّمَ بتشديد اللام) تلتبس بها خطياً بدون تشكيل
            مما يُعيق التوظيف الاصطلاحي.


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة: مُسْتَسْلِم ──────────────────────
    - lemma: "مُسْتَسْلِم"
      decision: confirmed
      decision_reason: >
        اسم فاعل سماعي من استسلمَ (الفعل العاشر من جذر سلم) على وزن مُستفعِل.
        الجذر موثَّق في مقاييس ابن فارس بمعنى الانقياد وترك الإباء. اللفظ فصيح
        شائع في كل مستويات الاستعمال، ويُطابق surrenderer مطابقة دقيقة. التشكيل
        موجود في synset_info ويبدو صحيحاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على الاستسلام الكامل والإطلاقي — إلقاء السلاح، الكفّ التام عن
        المقاومة. يغلب في السياقات العسكرية والمواجهات الحادة. أقوى وأشد
        حسماً من مُذعِن الذي قد يقتصر على الانقياد الجزئي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَسْلِم"

    # ── مرشح المرحلة ١: مُذْعِن — مقبول ──────────────────
    - lemma: "مُذْعِن"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في مقاييس ابن فارس بنص صريح: «أذعن الرجل إذا انقاد». اسم الفاعل
        مُذعِن (مُفعِل من الرباعي أذعن) صحيح قياساً، وهو شائع في الفصحى
        المعاصرة والتراثية. يُقابل yielder بظل الانقياد والإذعان الهادئ.
        اجتاز اختبار السكّ: مُذعِن وحدة معجمية مستقلة، لا تعبير وصفي.
        لم يُعثَر عليه كمدخل مستقل في القاعدة → يُنشأ مدخل جديد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على الانقياد والإذعان الذي قد يكون طوعياً أو تحت ضغط خفيف، وكثيراً
        ما يُستعمل في السياقات المدنية والقانونية والسياسية (أذعن للحكم، أذعن
        للقانون). أقل حدةً من مُستسلِم؛ يُعبّر عن التسليم الهادئ لا الهزيمة
        المُعلنة.
      actions:
        - command: create_entry
          params:
            lemma: "مُذْعِن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: خَاضِع — مرفوض ──────────────────
    - lemma: "خَاضِع"
      source: stage1
      decision: removed
      decision_reason: >
        رغم صحة الاشتقاق وثبوت الجذر، فإن خَاضِع أعمّ دلالياً مما يتطلبه
        السياق: يصف التذلل والتطامن والليونة بصفة مستمرة، لا فعل الاستسلام
        في لحظة محددة. الخاضع قد يكون متواضعاً بطبعه لا مستسلماً لقوة قاهرة.
        كذلك يرد كثيراً في السياق الديني الإيجابي (خاضع لله) بما يُعارض ظلال
        المجموعة.
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: رَاضِخ — مرفوض ──────────────────
    - lemma: "رَاضِخ"
      source: stage1
      decision: removed
      decision_reason: >
        مقاييس ابن فارس تُثبت أن أصل رضخ هو الكسر والإعطاء القليل، لا الاستسلام.
        الدلالة المعاصرة لـ«يرضخ» (= يستسلم للضغط) تطور حديث لم يتثبّت في
        صيغة اسم الفاعل «راضخ» — الشائع هو المصدر (رضوخ) أو الفعل (رضخ لـ)،
        لا اسم الفاعل المستقل. الإدراج يُكرّس خطأً دلالياً في التراث المعجمي.
      evidence_assessment:
        case: contradicts_only

    # ── مرشح المرحلة ١: مُسَلِّم — مرفوض ────────────────
    - lemma: "مُسَلِّم"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود مُسَلِّم بمعنى «المنقاد والراضي بالحكم» في موسوعة السلطان قابوس،
        فإن الالتباس الشديد مع مُسْلِم (المتّبع لدين الإسلام) يجعل اللفظ غير
        صالح عملياً. الفرق بين الصيغتين (مُسَلِّم بتشديد اللام / مُسْلِم بسكونها)
        لا يظهر في الكتابة بدون تشكيل، مما يُفضي إلى لبس مُربك.
      evidence_assessment:
        case: mixed


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────
stage4_content:

  definition:
    current: "شخص يرضخ أو يستسلم"
    assessment:
      decision: revise
      reason: >
        التعريف يعاني من مشكلتين: (أ) الدوران — «يستسلم» مشتق من نفس جذر اللمّة
        الرئيسية مُستسلِم. (ب) «يرضخ» — دلالتها الكلاسيكية عند ابن فارس
        «الكسر والإعطاء القليل» لا الاستسلام؛ استعمالها بمعنى يستسلم دلالة حديثة
        لم تتثبّت معجمياً. يُستبدل التعريف بصياغة أنقى تُحدّد الجنس القريب
        والفصل النوعي بدون دوران.
    authored:
      - type: terminological
        text: "مَن يكُفّ عن المقاومة وينقاد لإرادة غيره أو لقوة قاهرة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَن أذعنَ وأنزلَ نفسَه عن المقاومة مُقِرّاً بتفوّق الطرف الآخر، ضِدُّ المُقاوِم"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَن يكُفّ عن المقاومة وينقاد لإرادة غيره أو لقوة قاهرة"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "مَن أذعنَ وأنزلَ نفسَه عن المقاومة مُقِرّاً بتفوّق الطرف الآخر، ضِدُّ المُقاوِم"

  examples:
    per_lemma:
      - lemma: "مُسْتَسْلِم"
        examples:
          - text: "خرج الجنود من الحصن رافعين أيديهم، كلُّ واحد منهم مُسْتَسْلِمٌ لا يحمل سلاحاً."
            type: usage
      - lemma: "مُذْعِن"
        examples:
          - text: "وقف المتّهم أمام القاضي مُذْعِناً للحكم، لا يملك إلا القبول والامتثال."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
