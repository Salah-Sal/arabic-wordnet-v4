# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15057228-n
# chemical irritant — مادة مهيجة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «مهيج كيميائي» ترجمة حرفية للمصطلح الإنجليزي chemical irritant ولم تُسجَّل في أي معجم عربي مُوثَّق"
      - "اللمّتان الموجودتان بدون تشكيل كامل"
      - "التعريف العربي الحالي مقتضب جداً ولا يميّز عن مفهوم المُهَيِّج العام"
    observations: "المفهوم يشير إلى مادة كيميائية تسبب تهيُّجاً في الأنسجة الحية. المصطلح العربي المُوحَّد في المعاجم الطبية والكيميائية هو «مُهَيِّج» مُستعملاً استعمال الاسم (اسم فاعل مُجوهَر)، أو «مادة مهيِّجة» بالتركيب الوصفي. أما «مهيج كيميائي» فلا يرد في مصادر مُعجمية عربية."
  blind_candidates:
    - lemma: "مُهَيِّج"
      generation_method: ishtiqaq
      justification: "اسم فاعل من هَيَّجَ على وزن مُفَعِّل، يدلّ على ما يُحدِث التهيُّج. وهو الوزن الاشتقاقي الطبيعي للدلالة على الفاعلية السببية."
    - lemma: "مُثِير"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أَثَارَ على وزن مُفْعِل، يدلّ على ما يُثير استجابة. يُستعمل في السياق الطبي مرادفاً للمُهَيِّج."
    - lemma: "مُحَرِّش"
      generation_method: ishtiqaq
      justification: "اسم فاعل من حَرَّشَ على وزن مُفَعِّل، من جذر حرش الدال على الأثر والخشونة والتحزيز. يُستعمل في بعض المعاجم الطبية."
    - lemma: "هَيُوج"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعُول من هاجَ، تدلّ على ما شأنه إحداث الهَيْج والثوران."


stage2_evidence:
  per_lemma:
    - lemma: "مَادَّة مُهَيِّجَة"
      confirm:
        - text: "«مادَّةٌ مُهَيِّجَة» = irritant substance"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«مُهَيِّج: مادة يمكن أن تسبب تهيج البشرة أو العينين أو الجهاز التنفسي»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يوضّح أن التهيج يشمل البشرة والعيون والجهاز التنفسي"

    - lemma: "مُهَيِّج كِيمِيائيّ"
      evidence_status: "no_material_found"

    - lemma: "مُهَيِّج"
      confirm:
        - text: "«مُهَيِّج» = irritant"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُهَيِّج: مادة يمكن أن تسبب تهيج البشرة أو العينين أو الجهاز التنفسيمُثير (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«مهيِّج، مثير» = irritant"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«ا- صفة لما يسبب التهيج. ب- عامل يثير التهيج.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
      expands:
        - text: "«صفة لما يسبب التهيج أو يرتبط به.» = irritative"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "يُستعمل أيضاً صفةً بمعنى تهيُّجي"

    - lemma: "مُثِير"
      confirm:
        - text: "«(1) مثير؛ مهيِّج (2) المثير؛ المهيِّج.» = irritant"
          source: "المورد الحديث (2008)"
        - text: "«مهيِّج، مثير» = irritant"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      contradicts:
        - text: "«مُثير؛ مُقْلِق؛ مُهَيِّج.» = agitative"
          source: "المورد الحديث (2008)"
          conflict: "مُثِير يُستعمل بمعنى agitative أيضاً، وهو أعمّ من المُهَيِّج"
        - text: "«مُثير؛ مُهَيِّج إلخ.» = excitative/excitatory"
          source: "المورد الحديث (2008)"
          conflict: "مُثِير يدلّ كذلك على الإثارة العصبية والكهربائية، وليس على التهيُّج فحسب"

    - lemma: "مُحَرِّش"
      contradicts:
        - text: "«مُحَرِّش» = provocative"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "مُحَرِّش يُترجم provocative وليس irritant، فالدلالة تحريضية لا تهيُّجية"

    - lemma: "هَيُوج"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "مَادَّة مُهَيِّجَة"
      decision: confirmed
      decision_reason: "مُسجَّلة في المعجم الطبي الموحد بمعنى irritant substance، ومطابقة لتعريف المجموعة. التركيب وصفي ثابت معجمياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تُبرز الطبيعة المادية (substance) للمُهَيِّج، وتُستعمل حين يُراد التصريح بأن المُهَيِّج مادة لا عامل فيزيائي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة مُهَيِّجَة"

    - lemma: "مُهَيِّج كِيمِيائيّ"
      decision: removed
      decision_reason: "لا يرد في أي معجم عربي مُوثَّق. المعاجم الطبية والكيميائية تستعمل «مُهَيِّج» أو «مادة مهيِّجة» دون تقييد بـ«كيميائي». هو ترجمة حرفية لـ chemical irritant لا حاجة لها لأن المادة بطبيعتها كيميائية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُهَيِّج"
      source: stage1
      decision: confirmed
      decision_reason: "مُسجَّل في عدة معاجم مُوحَّدة (الطبي، الكيمياء، الهندسة المدنية) بمعنى irritant. تعريفه يتطابق مع تعريف المجموعة. هو المصطلح الأساسي المُعتمَد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المُفرد الجامع للمُهَيِّج، يشمل المادة والعامل والصفة، ويُستعمل في السياقات الطبية والكيميائية استعمالاً اسمياً."
      actions:
        - command: create_entry
          params: {lemma: "مُهَيِّج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُثِير"
      source: stage1
      decision: removed
      decision_reason: "مُثِير أعمّ دلالةً من مُهَيِّج؛ فهو يدلّ على الإثارة (excitation, agitation) عموماً ولا يختصّ بالتهيُّج. إدراجه يُوسِّع المجموعة عن مفهومها."
      evidence_assessment:
        case: mixed

    - lemma: "مُحَرِّش"
      source: stage1
      decision: removed
      decision_reason: "مُحَرِّش يُترجَم provocative في المعجم الطبي الموحد، ودلالته تحريضية (إغراء بالعداوة والشر) لا تهيُّجية بالمعنى الطبي/الكيميائي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "هَيُوج"
      source: stage1
      decision: removed
      decision_reason: "صيغة غير مسجّلة في المعاجم ولا مُستعملة في الاصطلاح العلمي. وزن فَعُول من هاجَ يدلّ على المبالغة في الهياج الذاتي لا على التسبُّب في التهيُّج."
      evidence_assessment:
        case: no_material


