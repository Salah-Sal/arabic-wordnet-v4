# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13482365-n — demand (الطَّلَب)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «طلب» غير مشكّلة، والمصطلح الاقتصادي يحتاج إلى تشكيل دقيق: «الطَّلَب» بفتح الطاء واللام"
      - "المجموعة تحتوي على لمّة واحدة فقط لمفهوم اقتصادي مركزي؛ يُستحسن التحقق من وجود مرادفات"
    observations: >
      المفهوم هو «الطَّلَب» الاقتصادي، أي القدرة والرغبة في اقتناء السلع والخدمات بثمن معيّن.
      هذا مصطلح محوري في علم الاقتصاد، مقابل «العَرْض» (supply).
      الجذر «ط ل ب» يدل في أصله على ابتغاء الشيء والسعي إليه،
      وقد استُعمل في الاصطلاح الاقتصادي الحديث للدلالة على هذا المفهوم بثبات عبر جميع المعاجم المتخصصة.
  blind_candidates:
    - lemma: "طَلَب"
      generation_method: ishtiqaq
      justification: >
        من الجذر «ط ل ب» على وزن فَعَل، يدلّ على ابتغاء الشيء والسعي في تحصيله.
        هو المصطلح المتبادر ذهنياً للدلالة على رغبة الاقتناء في سياق اقتصادي.
    - lemma: "إِقْبَال"
      generation_method: ishtiqaq
      justification: >
        من الجذر «ق ب ل» على وزن إفعال، يدلّ على التوجّه نحو الشيء والإقدام عليه.
        يمكن أن يُستعمل مجازاً للدلالة على توجّه المستهلكين نحو السلع.
    - lemma: "نَفَاق"
      generation_method: majaz
      justification: >
        من الجذر «ن ف ق»، ومنه «نَفَقَت السلعة» أي راجت وكثر طالبوها.
        النَّفاق بمعنى الرواج مسجّل في المعاجم الكلاسيكية، وقد يمتدّ مجازاً إلى الطلب.
    - lemma: "اسْتِطْلَاب"
      generation_method: ishtiqaq
      justification: >
        من الجذر «ط ل ب» على وزن استفعال، يدلّ على طلب الشيء والسعي في تحصيله.
        صيغة مبالغة في الطلب تناسب المفهوم الاقتصادي المتضمّن للقدرة والرغبة معاً.


stage2_evidence:
  per_lemma:
    - lemma: "طَلَب"
      confirm:
        - text: "«(في الاقتصاد): الكمية التي يقبل الأفراد شراءها من سلعة ما بثمن معين»"
          source: "المعجم الكبير"
        - text: "«(الطّلب) الْمَطْلُوب و (فِي الاقتصاد) الكمية الَّتِي يقبل الْأَفْرَاد شراءها من سلْعَة مَا بِثمن معِين (ج) طلبات»"
          source: "المعجم الوسيط"
        - text: "«عدد الوحدات التي يجري شراؤها من سلعة معيّنة بأسعار مختلفة في فترة زمنية محدّدة.»"
          source: "المعجم الموحد لمصطلحات المياه"
        - text: "«في علم الاقتصاد، هو البضائع المطلوبة أو المُراد الحصول عليها واستهلاكها فعلياً في سوق ما مثلاً.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«الكميات القصوى من بعض السلع التي سوف يختارونها (أو يشترونها) الناس بأسعار مختلفة.»"
          source: "المعجم الموحد لمصطلحات الاقتصاد"
      expands:
        - text: "«الطلب: الفحص عن وجود الشيء عينا أو معنى.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المعنى العام اللغوي للطلب: الفحص والبحث عن الشيء"
        - text: "«الطّلب: بفتح الطاء واللام لغة محبّة حصول الشيء على وجه يقتضي السّعي في تحصيله لولا مانع من الاستحالة والبعد»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "المعنى الاصطلاحي البلاغي: محبّة حصول الشيء مع السعي في تحصيله"
        - text: "«الطَّاءُ وَاللَّامُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ابْتِغَاءِ الشَّيْءِ. يُقَالُ: طَلَبْتُ الشَّيْءَ أَطْلُبُهُ طَلَبًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدل على ابتغاء الشيء والسعي إليه"

    - lemma: "إِقْبَال"
      contradicts:
        - text: "«اقبال: من (ق ب ل) الإقدام على الشيء، والسعد، والحظ الحسن.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعنى المعجمي هو الإقدام والسعد والحظ، لا الطلب الاقتصادي"
        - text: "«الإقْبال: كَون الْكَوْكَب فِي الْأَوْتَاد وَمَا يَليهَا.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "معنى فلكي لا علاقة له بالمفهوم الاقتصادي"

    - lemma: "نَفَاق"
      contradicts:
        - text: "«النِّفَاق: إِظْهَار الْإِيمَان بِاللِّسَانِ وكتمان الْكفْر فِي الْقلب.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "نَفَاق/نِفَاق مثبت في المعاجم بمعنى النفاق الديني حصراً، ورواج السلعة يُعبَّر عنه بـ«نَفَاق» لكنه يدل على الرواج لا على الطلب الاقتصادي"

    - lemma: "اسْتِطْلَاب"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "طَلَب"
      decision: confirmed
      decision_reason: >
        المصطلح مثبت في المعجم الكبير والمعجم الوسيط بمعنى اقتصادي صريح،
        ومعتمد في جميع معاجم ALECSO المتخصصة (الاقتصاد، التجارة، المياه، الطاقة، النقل).
        لا خلاف على استعماله مقابلاً لـ demand. يحتاج فقط إلى إضافة التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَلَب"

    - lemma: "إِقْبَال"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوثَّق في أي معجم بمعنى «الطلب الاقتصادي». المعاني المسجّلة هي:
        الإقدام على الشيء، والسعد، والمصطلح الفلكي. وإن استُعمل في لغة الصحافة
        بمعنى «الإقبال على الشراء» فهو يدل على فعل الشراء لا على المفهوم الاقتصادي
        المجرّد (القدرة والرغبة معاً). لذلك لا يصلح ترادفاً دقيقاً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "نَفَاق"
      source: stage1
      decision: removed
      decision_reason: >
        «نَفَاق السلعة» يدل على رواجها وكثرة مشتريها (= supply-side)،
        وليس على الطلب بوصفه قدرة ورغبة من جانب المشتري (= demand-side).
        فضلاً عن أنّ اللفظ مشترك لفظياً مع «النِّفاق» الديني، ما يُوقع في لبس شديد.
      evidence_assessment:
        case: contradicts_only

    - lemma: "اسْتِطْلَاب"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة غير مسجّلة في المعاجم ولا في المعاجم المتخصصة.
        وزن «استفعال» من «طلب» لم يُستعمل في التراث ولا في الاصطلاح الحديث.
        المصطلح «طَلَب» مستقرّ ولا حاجة إلى صيغة مستحدثة.
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "القدرة والرغبة في شراء السلع والخدمات"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي (the ability and desire to purchase goods and services).
        المعاجم العربية المتخصصة تعرّف الطلب بالكمية لا بالقدرة والرغبة فحسب.
        يحتاج إلى إعادة صياغة بأسلوب المعجم الوسيط مع مراعاة الدقة الاصطلاحية.
    authored:
      - type: terminological
        text: "الكَمِّيَّةُ الَّتِي يَرْغَبُ الأَفْرَادُ فِي شِرَائِهَا مِنْ سِلْعَةٍ أَوْ خِدْمَةٍ بِثَمَنٍ مُعَيَّنٍ فِي مُدَّةٍ مُحَدَّدَةٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَا يَبْتَغِيهِ المُسْتَهْلِكُونَ مِنَ السِّلَعِ وَالخِدْمَاتِ وَيَقْدِرُونَ عَلَى اقْتِنَائِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الكَمِّيَّةُ الَّتِي يَرْغَبُ الأَفْرَادُ فِي شِرَائِهَا مِنْ سِلْعَةٍ أَوْ خِدْمَةٍ بِثَمَنٍ مُعَيَّنٍ فِي مُدَّةٍ مُحَدَّدَةٍ"

  examples:
    per_lemma:
      - lemma: "طَلَب"
        examples:
          - text: "ارتفع الطَّلَبُ على النفط في الربع الأخير من العام بنسبة عشرين في المئة مقارنةً بالعام السابق."
            type: usage
          - text: "يتأثّر الطَّلَبُ على السلع الأساسية بمستوى الدخل الفردي والأسعار السائدة في السوق."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "ارتفع الطَّلَبُ على النفط في الربع الأخير من العام بنسبة عشرين في المئة مقارنةً بالعام السابق."
      - command: add_sense_example
