# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-10776309-n (visionary)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «صَاحِب خَيَال» تركيب إضافي حرّ وليس وحدة معجمية ثابتة — يمكن إبدال «خيال» بـ«تخيّل» أو «أوهام» فيبقى وصفاً صالحاً"
      - "المفهوم (visionary) يجمع بين التخيّل والحماس وعدم الواقعية، بينما «حَالِم» يركّز على التخيّل فقط دون دلالة صريحة على الحماس"
      - "الزمرة الأعلى (hypernym) هي «عامل/فاعل» وهي غير دقيقة دلالياً لأنّ الحالم ليس بالضرورة فاعلاً منجِزاً"
    observations: "المجموعة تعبّر عن مفهوم الشخص المنغمس في التخيّلات المثالية مع حماس وقلة اكتراث بالممكن عملياً. هذا المفهوم متجذّر في الثقافة العربية ويُعبَّر عنه بألفاظ متعددة: حالم، خيالي، صاحب رؤى. اللفظ «خَيَالِيّ» مسجّل في المعجم الكبير بمعنى «لا يعيش في عالم الواقع» وهو أقرب إلى دلالة المجموعة من التركيب الحرّ «صاحب خيال»."
  blind_candidates:
    - lemma: "خَيَالِيّ"
      generation_method: ishtiqaq
      justification: "مشتقّ من الجذر (خ ي ل) على وزن فَعَالِيّ (نسبة)، يدلّ على من يغلب عليه الخيال والانفصال عن الواقع"
    - lemma: "طُوبَاوِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى طُوبَى، يدلّ على التمسّك بمُثُل عُليا غير قابلة للتحقيق"
    - lemma: "حَالِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من حَلَمَ على وزن فَاعِل، يدلّ على من يعيش في أحلام ورؤى بعيدة عن الواقع"
    - lemma: "رُؤْيَوِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى رُؤْيَة، يدلّ على صاحب الرؤى والتصوّرات المستقبلية، ترجمة مباشرة لـ visionary"


stage2_evidence:
  per_lemma:
    - lemma: "حَالِم"
      confirm:
        - text: "«كثير الرّؤى. حالم. ... شخصٌ كثير الرؤى. الحالم: شخص تغلب الصفة غير العملية على فكراته ومشاريعه.»"
          source: "المورد الحديث (2008) — مدخل visionary"
        - text: "«الحالم. العائش أو السابح في دنيا الخيال.»"
          source: "المورد الحديث (2008) — مدخل dreamer"
      expands:
        - text: "«حالم؛ ذاهل. كثير الأحلام أو الأوهام. غامض. بهيج؛ سارّ؛ مثاليّ.»"
          source: "المورد الحديث (2008) — مدخل dreamy"
          addition: "يوسّع الدلالة لتشمل الذهول والغموض والمثالية"

    - lemma: "صَاحِب خَيَال"
      evidence_status: "no_material_found"

    - lemma: "خَيَالِيّ"
      confirm:
        - text: "«رجلٌ خَيالِيٌّ: لا يَعيش فى عالم الواقِع»"
          source: "المعجم الكبير"
        - text: "«وهميّ. خياليّ. مثاليّ؛ غير عمليّ»"
          source: "المورد الحديث (2008) — مدخل visionary"
      expands:
        - text: "«تطلق على الصورة المرتسمة في الخيال المتأدّية إليه من طرق الحواس. وقد يطلق على المعدوم الذي اخترعته المتخيّلة وركّبته من الأمور المحسوسة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يوضّح الأساس الفلسفي للخيالي عند المتقدّمين: ما لا وجود له إلا في المتخيّلة"

    - lemma: "طُوبَاوِيّ"
      contradicts:
        - text: "«يوطوبيّ: منسوب إلى اليوطوبيا أو مميِّز لها. منادٍ بإصلاحات اجتماعيّة وسياسيّة مثاليّة إلى حدٍّ يتعذَّر معه تطبيقها. اليوطوبيّ: مُصلِح سياسيّ أو اجتماعيّ متحمِّس ولكنه غير عمليّ.»"
          source: "المورد الحديث (2008) — مدخل utopian"
          conflict: "الطوباوي/اليوطوبي مخصّص بالإصلاح السياسي والاجتماعي المثالي، بينما visionary أعمّ ويشمل أيّ تخيّل مع حماس"

    - lemma: "رُؤْيَوِيّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "حَالِم"
      decision: confirmed
      decision_reason: "مؤكَّد بأدلة معجمية متعددة. المورد الحديث يترجم visionary بـ«حالم» و«شخص تغلب الصفة غير العملية على فكراته ومشاريعه» وهو مطابق تماماً لتعريف المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد الحُلمي والانغماس في التخيّلات، مع إيحاء بالسلبية والانفصال عن الواقع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالِم"

    - lemma: "صَاحِب خَيَال"
      decision: removed
      decision_reason: "تركيب إضافي حرّ وليس وحدة معجمية مسكوكة. يمكن إبدال «خيال» بمرادفاتها (تخيّل، أوهام، أحلام) ويظلّ التعبير صالحاً كوصف حرّ — يخفق في اختبار السكّ واختبار التثبيت المعجمي. لم يُسجَّل في أيّ معجم كمدخل مستقلّ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "خَيَالِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مسجّل في المعجم الكبير بمعنى «رجل لا يعيش في عالم الواقع» وهو مطابق لدلالة المجموعة. ورد أيضاً في المورد الحديث ضمن ترجمات visionary. وزنه الصرفي (فَعَالِيّ — نسبة) يناسب الوصف المنقول إلى الاسمية للدلالة على الشخص."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على غلبة الخيال والانفصال عن الواقع العملي، مع إيحاء بعدم الجدّية أكثر من الحماس"
      actions:
        - command: create_entry
          params:
            lemma: "خَيَالِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "طُوبَاوِيّ"
      source: stage1
      decision: removed
      decision_reason: "الطوباوي مخصّص بالسياق السياسي والاجتماعي (مُصلِح طوباوي) ولا يُغطّي المفهوم العامّ للحالم صاحب التخيّلات. كما أنّ الشكل المسجّل هو «يوطوبيّ» (تعريب) لا «طوباوي»."
      evidence_assessment:
        case: contradicts_only

    - lemma: "رُؤْيَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُسجَّل في أيّ معجم عربي. هو نحت جديد غير مثبت، والصيغة «كثير الرؤى» هي التعبير المسجّل في المورد لكنها عبارة وصفية لا لمّة مفردة."
      evidence_assessment:
        case: no_material


