# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10636295-n (sniffler / sniveler)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة مُخَنْفِر مشتقة من خَنْفَرَ التي تدل في المعاجم الحديثة على الشخير في النوم (غطيط)، وليس على التنفس بصوت من أنف محتقن أثناء اليقظة"
      - "الجذر خنفر رباعي وروده في المعاجم الكلاسيكية محصور في أعلام الأشخاص والأماكن (خَنْفَر: مدينة يمنية)، وأول توثيق لغوي للدلالة الصوتية جاء عند دوزي نقلاً عن مصادر عامية"
      - "المُسَمَّى العُلْوِيّ (hypernym) عامل/فاعل (شخص يعمل ويُنجِز الأمور) لا يناسب دلالياً مفهوم الشخص الذي يتنفس بصوت من أنفه"
    observations: >
      المجموعة تصف شخصاً يتنفس بصوت مسموع من خلال أنف محتقن، وهو مفهوم مرتبط بالحالة الصحية (الزكام/الرشح)
      أكثر منه بسمة شخصية ثابتة. في العربية الفصحى يُعبَّر عن هذا المعنى عادةً بعبارة وصفية
      لا بمصطلح مفرد. الألفاظ المتاحة تتوزع بين: (أ) مَزْكُوم — المصاب بالزكام عموماً،
      (ب) أَخَنّ/ذو خُنّة — من يخرج صوته من أنفه، (ج) مُخَنْفِر — الذي يُصدر صوتاً أنفياً
      (شخيراً في المعاجم الحديثة). لا يوجد لفظ عربي فصيح مسكوك يطابق مفهوم sniffler تماماً.

  blind_candidates:
    - lemma: "نَخَّار"
      generation_method: ishtiqaq
      justification: >
        من جذر نخر على وزن فَعَّال (صيغة المبالغة)، والنَّخِير صوت يخرج من المنخرين
        كما في مقاييس اللغة. يدل على من يُكثر إخراج الصوت من أنفه.
    - lemma: "مَزْكُوم"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من زُكِمَ (بُني على المجهول)، والزُّكام التهاب حاد بغشاء الأنف المخاطي
        يسبب احتقاناً وصعوبة في التنفس. لفظ فصيح مثبت في لسان العرب والمعجم الوسيط.
    - lemma: "خَانّ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من خَنَّ يَخِنُّ (الخُنّة: خروج الصوت أو النَّفَس من الأنف بسبب سدد في الخياشيم).
        يدل على من يتنفس أو يتكلم من أنفه. الخَنِين مصطلح طبي موحد يقابل nasonnement.
    - lemma: "مُتَنَشِّق"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من تَنَشَّقَ (استنشق بصوت مسموع). المورد الحديث يترجم sniffle
        بـ«يتنشَّق بصوت مسموع»، فالمُتَنَشِّق هو فاعل هذا الحدث.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُخَنْفِر"
      confirm:
        - text: "«خنفر: شخر، غَطّ (بوشر، ميهرن ص27). مُخَنْفر: أنافيّ، عظيم الأنف (شيرب).»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
      contradicts:
        - text: "«خنفرَ في يُخنفر، خَنفرةً، فهو مُخنفِر، والمفعول مُخَنْفَر فيه • خنفر النَّائمُ في نومه: شخَّر، غطَّ فيه.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "التعريف يقصر الخَنْفَرة على الشخير أثناء النوم، بينما المجموعة تصف التنفس بصوت أثناء اليقظة من أنف محتقن"
      expands:
        - text: "«خَنْفَرَة: 1- مصدر خنفرَ في. 2- أنف عظيم ضخم.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "الخَنْفَرة تحمل أيضاً دلالة على ضخامة الأنف، مما يربط الجذر بالمجال الأنفي عموماً"

    - lemma: "نَخَّار"
      expands:
        - text: "«(نَخَرَ) النُّونُ وَالْخَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى صَوْتٍ مِنَ الْأَصْوَاتِ... النَّخِيرُ: صَوْتٌ يَخْرُجُ مِنَ الْمَنْخِرَيْنِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر نخر يدل على الصوت الخارج من المنخرين عموماً، لكن لم يُوثَّق نَخَّار بمعنى من يتنفس بصوت من أنف محتقن"

    - lemma: "مَزْكُوم"
      confirm:
        - text: "«مَزْكُوم: من (ز ك م) المصاب بالزكام وهو التهاب حاد بغشاء الأنف المخاطي.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«جاء في لسان العرب: زُكمَ الرجلُ وأزْكَمَه اللهُ فهو مَزْكُومٌ، بني على زُكِمَ.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«(زَكَمَ) الزَّاءُ وَالْكَافُ وَالْمِيمُ لَيْسَ فِيهِ إِلَّا الزُّكْمَةُ وَالزُّكَامُ، وَيَسْتَعِيرُونَ ذَلِكَ فَيَقُولُونَ: فُلَانٌ زُكْمَةُ أَبَوَيْهِ، وَهُوَ آخِرُ أَوْلَادِهِمَا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر مقصور على الزكام ومعنى مجازي (آخر الأولاد)"

    - lemma: "خَانّ"
      confirm:
        - text: "«(الخنين) سدد في الخياشيم»"
          source: "المعجم الوسيط"
      expands:
        - text: "«خَنِين: من (خ ن ن) خروج صوت البكاء أو الضحك من الأنف أو خروج الكلام من الخياشيم، والخنين: سدد في الخياشيم.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الخنين يشمل خروج الصوت من الأنف عموماً سواء بكاءً أو ضحكاً أو كلاماً، وأيضاً السدد في الخياشيم"
        - text: "«خُنَّة»"
          source: "المعجم الطبي الموحد (مقابل nasonnement)"
          addition: "الخُنّة مصطلح طبي لخروج الصوت من الأنف"

    - lemma: "مُتَنَشِّق"
      confirm:
        - text: "«(1) يتنشَّق بصوت مسموع (2) يتنفَّس بصوت مسموع [وكأنَّ شيئًا يعترض سبيل النَّفَس في الأنف] (3) يَخِنّ: يتكلّم من أنفه ... (7) pl.: زُكام [مصحوب بسائل مُخاطيّ]»"
          source: "المورد الحديث (مقابل sniffle)"
      expands:
        - text: "«(1) يَشْهَق؛ يَنْشَق تكرارًا [مَنْعًا لسَيَلان المخاط أو كبتًا لانفعالات باكيةٍ]»"
          source: "المورد الحديث (مقابل sniffle)"
          addition: "التنشّق المتكرر يرتبط بمنع سيلان المخاط أو كبت الانفعال"


# ── المرحلة ٣: التحليل اللغوي ────────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُخَنْفِر"
      decision: confirmed
      decision_reason: >
        اللفظ موثّق في تكملة دوزي ومعجم اللغة العربية المعاصرة بمعنى يتصل بإصدار الصوت الأنفي
        (شخير/غطيط). وإن كان المعنى المعجمي الأساسي هو الشخير في النوم، فإن الجذر خنفر
        يرتبط بالمجال الأنفي (أنافيّ/عظيم الأنف عند دوزي)، ويمكن توسيعه لتغطية التنفس
        الأنفي المسموع عموماً. لا يوجد بديل مفرد أدق منه في هذا الحقل الدلالي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الصوت الأنفي الخشن (الشخير/الغطيط)، ويحمل ظلالاً من ضخامة الأنف
        أو التنفس الصاخب، بخلاف مَزْكُوم الذي يصف الحالة المرضية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَنْفِر"

    - lemma: "نَخَّار"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر نخر يدل على النخير (صوت المنخرين) وهو أقرب إلى الشخير منه إلى التنشق
        من أنف محتقن. لم يُوثَّق نَخَّار بهذا المعنى في المعاجم، والصيغة تتداخل دلالياً
        مع مُخَنْفِر دون إضافة جديدة.
      evidence_assessment:
        case: no_material

    - lemma: "مَزْكُوم"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ فصيح مثبت في لسان العرب والمعجم الوسيط ومعجم الصواب اللغوي، يدل على
        المصاب بالزكام (التهاب غشاء الأنف المخاطي مع احتقان). وإن كان أوسع دلالةً من
        sniffler (يشمل كل مزكوم لا المتنشّق فحسب)، فإنه يغطي الحالة الأساسية التي
        تسبب التنفس المسموع من أنف محتقن، ويسدّ فراغاً معجمياً في المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يصف الحالة المرضية (الزكام/احتقان الأنف) التي تسبب التنفس المسموع،
        وهو أعمّ من مُخَنْفِر الذي يركّز على الصوت الأنفي ذاته.
      actions:
        - command: create_entry
          params: {lemma: "مَزْكُوم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "خَانّ"
      source: stage1
      decision: removed
      decision_reason: >
        اسم الفاعل خَانّ من خَنَّ يَخِنُّ غير مسكوك كوصف للشخص في المعاجم. الخُنّة
        والخَنِين مصادر موثقة لكن اسم الفاعل لا يُستعمل مستقلاً للدلالة على الشخص.
        كما أن خَنَّ تتصل بالغُنّة في الكلام أكثر من التنفس من أنف محتقن.
      evidence_assessment:
        case: mixed

    - lemma: "مُتَنَشِّق"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن المورد الحديث يترجم sniffle بـ«يتنشّق بصوت مسموع»، فإن مُتَنَشِّق
        وصف فعلي (اسم فاعل من تَنَشَّقَ) وليس مصطلحاً مسكوكاً. يمكن إبدال «تنشّق»
        بـ«استنشق» أو «شمّ» دون تغيير المعنى، مما يُسقطه في اختبار السكّ.
      evidence_assessment:
        case: confirm_only


