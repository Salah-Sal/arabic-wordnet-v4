# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92426111-n (ion-exchange resin)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (بوليمر التبادل الأيوني، راتنج التبادل الأيوني) مركبات إضافية طويلة بلا تشكيل"
      - "لفظ «بوليمر» تعريب صرف للإنجليزية polymer بينما يوجد بديل عربي مسكوك: مُبَلْمَر أو مُتَمَاثِر"
      - "التعريف الحالي ترجمة حرفية تفتقر لأسلوب المعجم العربي ويستخدم ألفاظاً مثل «ركيزة» و«مصفوفة» بطريقة غير مألوفة"
    observations: "المفهوم تقني-كيميائي متخصص يتعلق بمادة صلبة بوليمرية عضوية تُستخدم في تبادل الأيونات. المصطلح راسخ في الأدبيات العلمية العربية بصيغة «راتنج التبادل الأيوني». الأقرب عربياً هو مُبَلْمَر التبادل الأيوني أو مُتَمَاثِر التبادل الأيوني عوضاً عن التعريب المباشر «بوليمر»."
  blind_candidates:
    - lemma: "رَاتِنْج مُبَادِل"
      generation_method: tarkib
      justification: "تركيب وصفي من «راتنج» (المادة الصمغية) و«مُبَادِل» (اسم فاعل من بادَلَ)، يصف وظيفة المادة في المبادلة"
    - lemma: "مُبَلْمَر التَّبَادُلِ الأَيُونِيّ"
      generation_method: tarkib
      justification: "تركيب إضافي يستبدل التعريب «بوليمر» بالمصطلح العربي المسكوك «مُبَلْمَر» (من بَلْمَرَ) المُثبت في معاجم المصطلحات العربية"
    - lemma: "مُتَمَاثِر التَّبَادُلِ الأَيُونِيّ"
      generation_method: tarkib
      justification: "تركيب إضافي باستخدام «مُتَمَاثِر» (المقابل العربي لـ polymer في معجم الصيدلة الموحد) بدلاً من التعريب"
    - lemma: "رَاتِينَج التَّبَادُلِ الأَيُونِيّ"
      generation_method: tarkib
      justification: "نفس تركيب اللمّة الموجودة لكن بإملاء المعجم الوسيط «راتينج» بدلاً من «راتنج»"


stage2_evidence:
  per_lemma:
    - lemma: "بُولِيمِر التَّبَادُلِ الأَيُونِيّ"
      confirm:
        - text: "«راتنج التبادل الأيوني أو مبلمرات التبادل الأيوني هي تراكيب غير ذائبة توجد عادة في شكل خرزات أو حبيبات صغيرة (بقطر 1-2 ملم)، وعادة ما تكون بيضاء أو صفراء، ومكونة من مبلمرات عضوية»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«بُولِيمر — polymer — polymère» (هندسة المياه)"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "لفظ بوليمر مُثبت كمصطلح معرَّب في عدة معاجم تخصصية (مياه، هندسة مدنية، وراثة)"
        - text: "«بوليمر: جزيء ضخم يتكون من وحدات متماثلة (مونوميرات)»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "تعريف عام للبوليمر كجزيء ضخم"

    - lemma: "رَاتِنْج التَّبَادُلِ الأَيُونِيّ"
      confirm:
        - text: "«راتنج التبادل الأيوني أو مبلمرات التبادل الأيوني هي تراكيب غير ذائبة توجد عادة في شكل خرزات أو حبيبات صغيرة (بقطر 1-2 ملم)، وعادة ما تكون بيضاء أو صفراء، ومكونة من مبلمرات عضوية»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«راتنجات التبادل الأيوني — ion exchange resins»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«راتنج: مادة صمغية لها خصائص التبادل الأيوني تستخدم في أنظمة التبادل الأيوني»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«راتنج: مواد راتنجية على صورة كروية صغيرة (مليمترات) توضع داخل المبادلة الأيوني»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يؤكد الشكل الكروي للمادة"
        - text: "«راتَنْج: مبلمر جزيئاته متشابكة مع بعضها البعض مما يجعله غير ذائب»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "يربط بين الراتنج والبلمرة وعدم الذوبان"

    - lemma: "رَاتِنْج مُبَادِل"
      expands:
        - text: "«راتينٌ مُبادِلٌ للأَيونات — ion exchange resin»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "صيغة قريبة لكنها «راتين مبادل للأيونات» لا «راتنج مبادل» فحسب"

    - lemma: "مُبَلْمَر التَّبَادُلِ الأَيُونِيّ"
      confirm:
        - text: "«راتنج التبادل الأيوني أو مبلمرات التبادل الأيوني هي تراكيب غير ذائبة»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«مُبَلْمر — polymer» (انظر: polymerization)"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "مُبَلْمَر مصطلح مسكوك للبوليمر"

    - lemma: "مُتَمَاثِر التَّبَادُلِ الأَيُونِيّ"
      expands:
        - text: "«مُتَمَاثِرٌ — بوليمر: مادة ناتجة عن تكاثف جزيئات بسيطة -موحود- بشكل متكرر لتصبح ذات وزن جزيئيّ كبير وخواص مختلفة»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "مُتَمَاثِر مقابل عربي آخر للبوليمر لكنه أقل شيوعاً من مُبَلْمَر"

    - lemma: "رَاتِينَج التَّبَادُلِ الأَيُونِيّ"
      confirm:
        - text: "«رَاتِينج: مادة تخرج من أشجار كثيرة عند شقها, وتكون غالباً مختلطة بالصموغ والزيوت»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(راتينج) مَادَّة تخرج من أَشجَار كَثِيرَة عِنْد شقها وَتَكون غَالِبا مختلطة بالصموغ والزيوت (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (حوراماني)"
          addition: "إملاء المعجم الوسيط هو «راتينج» لا «راتنج»، لكن المعاجم التخصصية الحديثة تستخدم «راتنج» بحذف الياء"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──

    - lemma: "بُولِيمِر التَّبَادُلِ الأَيُونِيّ"
      decision: confirmed
      decision_reason: "مصطلح مُعرَّب شائع في الأدبيات العلمية العربية الحديثة، ومُثبت في عدة معاجم تخصصية (مياه، هندسة مدنية، وراثة). ورد في تعريف معجم المياه كمرادف صريح لراتنج التبادل الأيوني بصيغة «مبلمرات التبادل الأيوني»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على البنية الكيميائية (كونه بوليمراً/مُبَلْمَراً) أكثر من المادة الخام (الراتنج)، ويُفضَّل في سياقات كيمياء البوليمرات والهندسة الكيميائية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُولِيمِر التَّبَادُلِ الأَيُونِيّ"

    - lemma: "رَاتِنْج التَّبَادُلِ الأَيُونِيّ"
      decision: confirmed
      decision_reason: "المصطلح الرئيسي في مجال هندسة المياه والكيمياء، مُثبت بتعريف كامل في المعجم الموحد لمصطلحات المياه وفي معجم الهندسة المدنية. يرد بصيغة الجمع أيضاً «راتنجات التبادل الأيوني»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على طبيعة المادة الفيزيائية (الراتنج = المادة الصمغية الصلبة)، وهو الأكثر شيوعاً في الاستخدام التقني وهندسة المياه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَاتِنْج التَّبَادُلِ الأَيُونِيّ"

    # ── مرشحات المرحلة ١ ──

    - lemma: "رَاتِنْج مُبَادِل"
      source: stage1
      decision: removed
      decision_reason: "التعبير غير مسكوك بهذه الصيغة. الصيغة المُثبتة في المعجم الطبي هي «راتين مبادل للأيونات» وهي مختلفة بنيوياً. حذف «للأيونات» يُفقد المصطلح تخصيصه الكيميائي."

    - lemma: "مُبَلْمَر التَّبَادُلِ الأَيُونِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «مبلمرات التبادل الأيوني» كمرادف في تعريف معجم المياه، فإن التركيب الإضافي «مُبَلْمَر التبادل الأيوني» بالمفرد لم يُثبت كمُدخل مستقل في أي معجم. يكفي وجود «بوليمر التبادل الأيوني» لتغطية هذا المحور الدلالي، ولا حاجة لتكرار المفهوم بمرادف أقل شيوعاً."

    - lemma: "مُتَمَاثِر التَّبَادُلِ الأَيُونِيّ"
      source: stage1
      decision: removed
      decision_reason: "لفظ «متماثر» بديل لـ«بوليمر» في معجم الصيدلة فحسب، ولم يُستخدم مع «التبادل الأيوني» في أي مصدر. شيوعه محدود جداً مقارنةً بـ«بوليمر» و«مبلمر»."

    - lemma: "رَاتِينَج التَّبَادُلِ الأَيُونِيّ"
      source: stage1
      decision: removed
      decision_reason: "إملاء «راتينج» هو الأصل في المعجم الوسيط، لكن المعاجم التخصصية الحديثة (الكيمياء، المياه، الهندسة المدنية، الصيدلة) استقرت على «راتنج» بحذف الياء. لا داعي لإضافة إملاء بديل قد يُشتّت."


stage4_content:
  definition:
    current: "مصفوفة غير قابلة للذوبان عادة ما تكون على شكل خرزات صغيرة (قطرها 0.5-1 مم) مصنوعة من ركيزة بوليمر عضوية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية يستخدم ألفاظاً غير مألوفة في العربية العلمية (مصفوفة بمعنى matrix، ركيزة بمعنى substrate). يفتقر لذكر الوظيفة الجوهرية (تبادل الأيونات)."
    authored:
      - type: terminological
        text: "مادَّةٌ صُلْبَةٌ عُضْوِيَّةٌ مُبَلْمَرَةٌ غَيْرُ ذَائِبَةٍ، تَكُونُ عَادَةً عَلَى هَيْئَةِ حُبَيْبَاتٍ كُرَوِيَّةٍ دَقِيقَةٍ، وَتَتَمَيَّزُ بِقُدْرَتِهَا عَلَى تَبَادُلِ الأَيُونَاتِ مَعَ المَحَالِيلِ المُمَرَّرَةِ خِلَالَهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مادَّةٌ بُولِيمِرِيَّةٌ عُضْوِيَّةٌ صُلْبَةٌ لَا تَذُوبُ فِي المَاءِ، تُصنَعُ عَادَةً عَلَى شَكْلِ خَرَزَاتٍ صَغِيرَةٍ يَتَرَاوَحُ قُطْرُهَا بَيْنَ نِصْفِ مِلِيمِتْرٍ وَمِلِيمِتْرَيْنِ. يَحْتَوِي سَطْحُهَا عَلَى مَسَامَّ قَادِرَةٍ عَلَى حَبْسِ الأَيُونَاتِ ثُمَّ إِطْلَاقِهَا، وَتُسْتَخْدَمُ فِي مُعَالَجَةِ المِيَاهِ وَتَنْقِيَتِهَا وَفِي التَّحَالِيلِ الكِيمِيَائِيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادَّةٌ صُلْبَةٌ عُضْوِيَّةٌ مُبَلْمَرَةٌ غَيْرُ ذَائِبَةٍ، تَكُونُ عَادَةً عَلَى هَيْئَةِ حُبَيْبَاتٍ كُرَوِيَّةٍ دَقِيقَةٍ، وَتَتَمَيَّزُ بِقُدْرَتِهَا عَلَى تَبَادُلِ الأَيُونَاتِ مَعَ المَحَالِيلِ المُمَرَّرَةِ خِلَالَهَا."

