# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14701646-n
# greaves / crackling — بقايا الشحم المذاب
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «بقايا الشحم» عبارة وصفية حرّة وليست مصطلحاً مسكوكاً؛ تفشل في اختبار السكّ (يمكن إبدال بقايا بـ«فضلات» أو «مخلّفات» دون تغيير المعنى)"
      - "التعريف العربي يكرّر جذر اللمّة نفسها (بقايا/تتبقى) ممّا يُوقع في الدَّور"
      - "المجموعة تحوي لمّة واحدة فقط لمفهوم له مقابلات عربية تراثية موثّقة"
    observations: "المفهوم هو البقيّة الصلبة (النسيج الضامّ والأغشية) التي تتخلّف بعد صَهر الدهون الحيوانية واستخلاص الوَدَك منها. هذا المفهوم معروف في الثقافة العربية لارتباطه بإذابة الشحوم (السَّلْء) وهي عملية قديمة في الطبخ العربي. ينبغي البحث عن مصطلح تراثي ثابت بدل العبارة الوصفية."
  blind_candidates:
    - lemma: "صُهَارَة"
      generation_method: ishtiqaq
      justification: "من جذر صهر (إذابة الشحم) على وزن فُعَالَة الذي يدلّ على ناتج الفعل أو بقيّته، فتكون صُهارة = ما ينتج عن الصَّهر"
    - lemma: "ثُفْل الشَّحْم"
      generation_method: tarkib
      justification: "مركب إضافي من ثُفْل (الراسب والخُثارة من كل شيء) وشَحْم (الدهن الحيواني)؛ الثُّفْل مصطلح معجمي ثابت للرواسب"
    - lemma: "حُثَالَة الدُّهْن"
      generation_method: tarkib
      justification: "مركب إضافي من حُثَالَة (الرديء والنُّفاية من كل شيء) ودُهْن (المادة الدهنية)؛ حثالة مستعملة في المعاجم للثُّفل والبقايا"
    - lemma: "خُثَارَة الشَّحْم"
      generation_method: tarkib
      justification: "مركب إضافي من خُثَارة (ما غلُظ وثخُن وترسّب من السائل) وشَحْم؛ يشير إلى الجزء الغليظ المتبقي بعد الإذابة"

# ── المرحلة ٢: جمع الأدلة ──────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بَقَايَا الشَّحْم"
      expands:
        - text: "«ثفل الشحم: بقايا الشحم المذاب، وبقايا شحم الخنزير المذاب (فوك)»"
          source: "تكملة المعاجم العربية لدوزي"
          addition: "يستخدم دوزي عبارة بقايا الشحم المذاب كشرح لمصطلح ثفل الشحم، مما يؤكد أنها وصف وليست مصطلحاً"
        - text: "«بقايا جافة — residue»"
          source: "المعجم الموحد لمصطلحات المياه"
          addition: "بقايا تُستعمل عامّةً بمعنى residue في المعاجم التقنية"

    - lemma: "صُهَارَة"
      contradicts:
        - text: "«وَالصُّهَارَةُ: مَا ذَابَ مِنْهَا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الصُّهَارَة هي المادة المُذابة نفسها (السائل) وليست البقيّة الصلبة المتخلّفة"
        - text: "«صهر الشحم: أذابه، وأكل صهارته وهي ذوبه»"
          source: "أساس البلاغة للزمخشري"
          conflict: "يؤكد أن الصهارة = الذَّوب أي الجزء المُذاب لا الراسب"
      expands:
        - text: "«المنصهر والشحم والمخ»"
          source: "المعجم الوسيط"
          addition: "يفسّر الصهارة بالمنصهر والشحم والمخ"
        - text: "«كلُّ ما أُذِيبَ من الشَّحْم ونحوه. المخُّ. يقال: ما بالبعير صُهارَةٌ. (فى الجيولوجيا) Magma»"
          source: "المعجم الكبير"
          addition: "في الاستعمال الحديث اختُصّت صُهَارة بالمعنى الجيولوجي (magma)"

    - lemma: "ثُفْل الشَّحْم"
      confirm:
        - text: "«ثفل الشحم: بقايا الشحم المذاب، وبقايا شحم الخنزير المذاب (فوك)»"
          source: "تكملة المعاجم العربية لدوزي"
        - text: "«الثُّفْلُ، بالضم، والثافِلُ: ما اسْتَقَرَّ تَحْتَ الشيءِ من كُدْرَةٍ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الثّفل: بالضم وسكون الفاء هو ما ثفل من كل شيء — Residue, dregs»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«(ثَفَلَ) الثَّاءُ وَالْفَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ الشَّيْءُ يَسْتَقِرُّ تَحْتَ الشَّيْءِ، يَكُونُ ذَلِكَ مِنَ الْكَدَرِ وَغَيْرِهِ. يُقَالُ هُوَ ثُفْلُ الْقِدْرِ وَغَيْرِهَا، وَهُوَ مَا رَسَا مِنَ الْخُثَارَةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الترسّب والاستقرار، ويُضاف إلى القِدر وغيرها"
        - text: "«المادة المتبقية من الفواكه والخضراوات بعد عصرها — pomace»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
          addition: "ثُفْل يُستعمل في المصطلحات الغذائية الحديثة بمعنى الراسب والبقيّة"

    - lemma: "حُثَالَة الدُّهْن"
      confirm:
        - text: "«حُثَالَةُ الدُّهْنِ وَمَا أَشْبَهَهُ: ثُفْلُهُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(الحثالة) الرَّدِيء من كل شيء والنفاية من الحبّ والتمر ونحوهما ومن الناس رذالهم وشرارهم»"
          source: "المعجم الوسيط"
          addition: "الحثالة أعمّ من الثُّفل، وتحمل دلالة سلبية (الرديء والنفاية)"

    - lemma: "خُثَارَة الشَّحْم"
      evidence_status: "no_material_found"

