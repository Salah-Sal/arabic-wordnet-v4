stage1_review:
  assessment:
    concerns:
      - "لفظ «مُرَاقِب» عامّ جداً ولا يحمل دلالة السهر التعبدي؛ دلالته الأولى في المعاجم: من يقوم بالرقابة والإشراف الإداري"
      - "التعريف العربي «يحافظ على سهر تعبدي» تركيب ثقيل نوعاً ما، والأفصح: يَسْهَرُ سَهَرًا تعبدياً"
    observations: >
      المفهوم يجمع بين عنصرين: (أ) السهر أي عدم النوم ليلاً، (ب) الغرض التعبدي أو الرعائي بجوار مريض أو ميت.
      العربية غنية بمادة «سهر» وما يتفرع عنها (ساهر، مِسهار، سَهَّار)، وكذلك مادة «سهد» (السُّهاد، المُسَهَّد).
      الدلالة المسيحية الغربية لمفهوم vigil (السهرة الليتورجية) لها مقابل عربي مسيحي شائع هو «سَهْرَانِيَّة»،
      لكن المفهوم هنا أعمّ ويشمل السهر بجوار المرضى والموتى لغرض تعبدي عام.

  blind_candidates:
    - lemma: "مُتَسَهِّد"
      generation_method: ishtiqaq
      justification: "من الجذر س-ه-د على وزن مُتَفَعِّل من تَسَهَّدَ: أرِقَ وسهِدَ. المتسهد هو من يتعمد السهاد والأرق"
    - lemma: "مُتَهَجِّد"
      generation_method: ishtiqaq
      justification: "من الجذر ه-ج-د على وزن مُتَفَعِّل من تَهَجَّدَ: استيقظ للصلاة وغيرها ليلاً. يجمع بين السهر والتعبد"
    - lemma: "سَمِير"
      generation_method: majaz
      justification: "من الجذر س-م-ر: السمير هو من يسهر ليلاً ويؤنس جليسه. إزاحة دلالية من السمر (التحدث ليلاً) إلى السهر بجوار المريض"
    - lemma: "رَاعٍ"
      generation_method: ishtiqaq
      justification: "من الجذر ر-ع-ي على وزن فاعل: كل من ولي أمراً بالحفظ والرعاية. فيه معنى الحفظ والمراقبة"

stage2_evidence:
