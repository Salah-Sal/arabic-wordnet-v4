          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يدل على الانتصاب للمراعاة والحفظ، وهو أعمّ من السهر التعبدي"

    - lemma: "مُتَسَهِّد"
      confirm:
        - text: "«تسهَّد المريضُ: مُطاوع سهَّدَ: سهِد؛ أرِق ولم يستطع النّوم»"
          source: "معجم اللغة العربية المعاصرة"
      contradicts:
        - text: "«تسهَّد المريضُ: مُطاوع سهَّدَ»"
          source: "معجم اللغة العربية المعاصرة"
