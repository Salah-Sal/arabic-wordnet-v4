        - text: "«السِّينُ وَالْهَاءُ وَالرَّاءُ مُعْظَمُ بَابِهِ الْأَرَقُ، وَهُوَ ذَهَابُ النَّوْمِ»"
          source: "مقاييس اللغة لابن فارس"
