          source: "المعجم الوسيط"
          conflict: "السمير هو المحدِّث ليلاً والمؤانس، وليس الساهر بغرض تعبدي أو رعائي"
        - text: "«الذى يَتَحدَّث معك بالليل خاصةً ثم أُطلق»"
          source: "المعجم الكبير"
          conflict: "الدلالة محصورة في التحدث والمؤانسة الليلية"

    - lemma: "رَاعٍ"
      contradicts:
        - text: "«(الراعي) من يحفظ الماشية ويرعاها وكل من ولي أمرا بالحفظ والسياسة كالملك والحاكم»"
          source: "المعجم الوسيط"
          conflict: "الراعي مخصوص برعي الماشية أو ولاية الأمر السياسي، لا بالسهر التعبدي بجوار المرضى والموتى"

stage3_analysis:
  per_lemma:
    - lemma: "سَاهِر"
      decision: confirmed
      decision_reason: >
        لفظ «ساهر» هو اسم الفاعل من «سهر» وهو الأصل اللغوي الأقرب للمفهوم. المورد الحديث يترجم watcher ترجمةً صريحةً
        بـ«الساهر أمام جثمان ميت» و«الساهر على صحة مريض»، وهذا مطابق تماماً لتعريف المجموعة.
        كما أن المعجم الكبير يسجل «سهر على راحته: راقبه وراعاه» و«ساهَرَ المريضَ: سهر معه».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "ساهِر يحمل دلالة السهر الليلي (عدم النوم) مع إيحاء بالرعاية والتعبد، وهو أخصّ من مُراقِب لأنه يستلزم البقاء يقظاً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَاهِر"

    - lemma: "مُرَاقِب"
      decision: confirmed
      decision_reason: >
        لفظ «مراقب» من الجذر رقب الدال على الانتصاب لمراعاة شيء، وهو يصلح لوصف من يراقب المريض أو الميت.
        إلا أن دلالته في الاستعمال المعاصر غلبت عليها معاني الإشراف الإداري والرقابة المؤسسية.
        يُبقى في المجموعة لأنه يغطي جانب المراقبة والملاحظة، مع تسجيل أنه أعمّ من ساهر.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مُراقِب يركز على جانب الملاحظة والإشراف دون استلزام السهر الليلي، ويُستعمل في سياقات إدارية ورسمية أوسع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرَاقِب"

    - lemma: "مُتَسَهِّد"
      source: stage1
      decision: removed
      decision_reason: >
        الفعل تسهَّد مطاوع لسهَّد، فالمتسهِّد هو من أصابه الأرق قسراً لا من يسهر عمداً.
        معجم اللغة المعاصرة ينصّ: «تسهَّد المريضُ» أي المريض نفسه الذي لا يستطيع النوم.
        لا يصلح للدلالة على من يسهر بجوار غيره اختياراً.

    - lemma: "مُتَهَجِّد"
      source: stage1
      decision: removed
      decision_reason: >
        التهجد مخصوص بالاستيقاظ للصلاة والعبادة (قيام الليل)، كما في قوله تعالى: {وَمِنَ اللَّيْلِ فَتَهَجَّدْ بِهِ نَافِلَةً لَكَ}.
        والمتهجد لا يستلزم الوجود بجوار مريض أو ميت، بل هو عابد يقوم الليل.
        هناك تقاطع جزئي في عنصر التعبد، لكن الفرق الجوهري في السياق والغرض.

    - lemma: "سَمِير"
      source: stage1
      decision: removed
      decision_reason: >
        السمير هو المحدِّث ليلاً والمؤانس في السهر. دلالته محصورة في التحدث والترفيه الليلي،
        وتنعدم فيه دلالة التعبد أو الرعاية الصحية. لا يصلح مقابلاً لمفهوم vigil watcher.

    - lemma: "رَاعٍ"
      source: stage1
      decision: removed
      decision_reason: >
        الراعي في المعاجم العربية غلبت عليه دلالة رعي الماشية أو ولاية الأمر السياسي.
        كما أنه موجود فعلاً في المجموعة العُلْيا (hypernym) كـ«عامل/فاعل»، فإضافته هنا ستُحدث خلطاً
        بين المستوى الأعمّ والأخصّ.

