          source: "المعجم الوسيط"
          conflict: "المعنى الأول في المعجم الوسيط للمراقب هو الشخص الموضوع تحت المراقبة الأمنية، وهو معنى سلبي بعيد عن دلالة السهر التعبدي"
      expands:
