      confirm:
        - text: "«(1) «أ» السّاهر. «ب» السّاهر أمام جثمان مَيْتٍ. «ج» السّاهر [ليلًا] على صِحّة مريض (2) الحارس (3) «أ» المراقِب. «ب» المُشاهِد.»"
          source: "المورد الحديث (2008) — ترجمة watcher"
        - text: "«سَهِرَ على راحته: راقبه وراعاه»"
          source: "المعجم الكبير"
        - text: "«سَاهَرَ فلانٌ المريضَ وغيرَه: سَهِرَ معه»"
          source: "المعجم الكبير"
        - text: "«(سهر) سهرا لم ينم كل الليل أو بعضه وأرق والبرق بات يلمع فهو ساهر وسهران وسهار وسهرة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(الساهر) يُقال ليل ساهر أي ذو سهر»"
