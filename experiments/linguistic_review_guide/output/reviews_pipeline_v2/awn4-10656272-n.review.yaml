# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10656272-n (spitter / expectorator)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (بَاصِق) وهي اسم فاعل عادي من بَصَقَ، غير مسجّل في المعاجم كمدخل مستقل"
      - "التعريف العربي ترجمة حرفية للإنجليزي ولا يتّبع أسلوب المعاجم العربية"
      - "المفهوم بسيط (اسم فاعل من فعل بصق) ولا يستدعي مصطلحاً مسكوكاً خاصاً"
    observations: >
      المجموعة تمثّل اسم فاعل من الفعل بَصَقَ، أي الشخص الذي يلفظ ريقه أو بلغمه من فمه.
      هذا مفهوم بسيط يُعبَّر عنه في العربية باسم الفاعل المباشر. الفعل بَصَقَ له لغات:
      بَزَقَ وبَسَقَ وتَفَلَ ونَفَثَ، وكلّها تحتمل اشتقاق اسم فاعل. غير أنّ هذا النوع
      من الأسماء لا يُعجَم عادةً لأنّه مُشتقّ قياسي لا يحمل دلالة اصطلاحية إضافية.
  blind_candidates:
    - lemma: "بَاصِقٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل قياسي من بَصَقَ يَبْصُقُ على وزن فاعِل، وهو الاشتقاق المباشر الأول للدلالة على من يقوم بفعل البَصْق"
    - lemma: "تَفَّالٌ"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من تَفَلَ (بمعنى بصق ورمى ما في الفم كراهةً) على وزن فَعَّال، تدلّ على كثرة الفعل"
    - lemma: "بَزَّاقٌ"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من بَزَقَ (لغة في بَصَقَ) على وزن فَعَّال، وبَزَقَ أصل مستقل في مقاييس اللغة بمعنى إلقاء الشيء"
    - lemma: "نَافِثٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من نَفَثَ (أخرج من فمه بأدنى جَرْس)، والنَّفْث أخصّ من البَصْق لأنّه يشمل الريق القليل"

stage2_evidence:
  per_lemma:
    - lemma: "بَاصِقٌ"
      evidence_status: "no_material_found"

    - lemma: "تَفَّالٌ"
      expands:
        - text: "«(التفال) البصاق والزبد»"
          source: "المعجم الوسيط"
          addition: "التُّفال اسم للبصاق ذاته وليس اسماً للفاعل، لكنّه يؤكّد العلاقة بين الجذر ت ف ل والبصق"
        - text: "«تَفَلْتَ بالشيء إذا رمَيتَ به من فمك متكرّهاً له»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدلّ على خبث الشيء وكراهته، والتفل رمي الشيء من الفم كراهةً — وليس مجرد البصق"

    - lemma: "بَزَّاقٌ"
      contradicts:
        - text: "«بَزَّاقُ: بالفتح وتشديد الزاي: موضع قرب تلّ فخّار من أعمال واسط»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "بَزَّاق بالتشديد اسم موضع لا اسم فاعل"
      expands:
        - text: "«بَزّاق: ذكره فوك في مادة spuere. وبزاق: حلزون»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "بَزَّاق يُستعمل بمعنى حلزون (لإفرازه المخاط) وبمعنى الباصق في الأندلسية واللاتينية"
        - text: "«(بَزَقَ) الْبَاءُ وَالزَّاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ وَهُوَ إِلْقَاءُ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر بزق = إلقاء، فبَزَّاق صيغة مبالغة ممكنة"

    - lemma: "نَافِثٌ"
      expands:
        - text: "«(نَفَثَ) النُّونُ وَالْفَاءُ وَالثَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خُرُوجِ شَيْءٍ مِنْ فَمٍ أَوْ غَيْرِهِ بِأَدْنَى جَرْسٍ. مِنْهُ نَفَثَ الرَّاقِي رِيقَهُ، وَهُوَ أَقَلُّ مِنَ التَّفْلِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "النفث أخصّ من البصق والتفل — فيه إخراج قليل من الفم مع صوت خفيف، يختصّ بالرقية والسحر"
      contradicts:
        - text: "«نفّاث — translation_en: jet / scramjet»"
          source: "المعجم الموحد لمصطلحات الفيزياء / النقل"
          conflict: "نفّاث في الاستعمال الحديث مصطلح تقني بمعنى jet، والنافث يرتبط بالرقية أكثر من البصق العادي"

stage3_analysis:
  per_lemma:
    - lemma: "بَاصِقٌ"
      decision: confirmed
      decision_reason: >
        اسم فاعل قياسي مطّرد من بَصَقَ يَبْصُقُ على وزن فاعِل. رغم عدم وروده مدخلاً
        مستقلاً في المعاجم، فإنّ القياس الصرفي سليم والاشتقاق شفّاف لا لبس فيه.
        والفعل بَصَقَ هو الأفصح بين لغاته (بَزَقَ وبَسَقَ) كما نصّ الخليل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة الأساسية المحايدة — اسم فاعل بسيط يدلّ على من يبصق دون إيحاء بالكثرة أو الكراهة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَاصِقٌ"

    - lemma: "تَفَّالٌ"
      source: stage1
      decision: removed
      decision_reason: >
        جذر تَفَلَ أصله يدلّ على خبث الشيء وكراهته كما في مقاييس اللغة، والتَّفْل هو
        رمي الشيء من الفم تكرّهاً — وليس مرادفاً تامّاً للبصق. كذلك لم يُسجَّل تَفَّال
        كمدخل معجمي بمعنى الباصق، وصيغة المبالغة تحمل دلالة مفرطة لا يقتضيها المفهوم.

    - lemma: "بَزَّاقٌ"
      source: stage1
      decision: removed
      decision_reason: >
        بَزَّاق وردت اسم موضع في معجم البلدان، واستعملها دوزي بمعنى حلزون (slug) في
        لهجات المغرب والأندلس. هذا الاشتراك اللفظي يُضعف صلاحيتها. كذلك بَزَقَ لغة
        في بَصَقَ وليست الأفصح، فلا حاجة لإضافة صيغة مبالغة من الأقلّ فصاحة.

    - lemma: "نَافِثٌ"
      source: stage1
      decision: removed
      decision_reason: >
        النَّفْث أخصّ من البصق — يدلّ على إخراج قليل من الريق مع ريح خفيفة، ويرتبط
        بالرقية والسحر (ومنه: النفّاثات في العُقد). كما أنّ نَفَّاث صار مصطلحاً تقنياً
        حديثاً بمعنى jet. الدلالة مختلفة جوهرياً عن مفهوم البصق.

