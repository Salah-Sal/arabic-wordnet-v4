# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10717015-n (telegrapher)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «عامل تلغراف» مركّب هجين يجمع بين كلمة عربية (عامل) ولفظ أعجمي (تلغراف)، والأَولى استعمال اللفظ العربي «البَرْق» بدل «التلغراف»."
      - "التعريف العربي الحالي يستخدم لفظ «التلغراف» الأعجمي بدلاً من «البَرْق» العربي الفصيح."
    observations: "المفهوم يدور حول شخص يُرسل الرسائل بواسطة جهاز البَرْق (التلغراف). في العربية الحديثة، استُخدم الفعل «أَبْرَقَ» (الرباعي) بمعنى أرسل برقية، فاسم الفاعل «مُبْرِق» مصطلح عربي فصيح دقيق يُغني عن اللفظ الأعجمي. أمّا «عامل تلغراف» فهو ترجمة حرفية للمصطلح الإنجليزي telegraph operator بمركّب هجين."

  blind_candidates:
    - lemma: "مُبْرِقٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أَبْرَقَ (الفعل الرباعي، باب الإفعال) من جذر «برق». أَبْرَقَ بمعنى أرسل برقية (محدثة)، فالمُبْرِق هو مَن يُرسل البرقيات عبر جهاز البرق."
    - lemma: "بَرَّاقٌ"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من جذر «برق»، تدلّ على كثرة الفعل. لكنّ الوزن فَعَّال ارتبط في الاستعمال بمعانٍ أخرى كاللمعان والتلألؤ."
    - lemma: "عَامِلُ البَرْقِ"
      generation_method: tarkib
      justification: "مركّب إضافي عربي خالص يُقابل «عامل تلغراف» باستبدال اللفظ الأعجمي بالعربي الفصيح «البَرْق» الذي أثبته المعجم الوسيط بمعنى جهاز نقل الرسائل."
    - lemma: "تِلِغْرَافِيٌّ"
      generation_method: taarib
      justification: "نسبة إلى «تلغراف» المعرَّب، على غرار telegraphist. لكنّ النسبة تدلّ على الصفة لا على الشخص الحِرَفي."

stage2_evidence:
  per_lemma:
    - lemma: "عَامِل تِلِغْرَاف"
      confirm:
        - text: "«عامل التِّلغراف.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«تِلِغراف [مفرد]: ج تِلِغرافات: ١- بَرْق، نظام يبثّ ويستقبل نبضات كهربائية تكون محطات الإرسال والاستقبال فيه موصولة بأسلاك بشكل مباشر. ٢- برقِيّة، رسالة تُرسل من مكان إلى آخر بواسطة جهاز البرق.»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "تأكيد أنّ تلغراف = بَرْق، ما يعني أنّ «عامل تلغراف» = «عامل البرق»."
        - text: "«التلغراف: البرق.»"
          source: "المعجم الوسيط"
          addition: "الوسيط يُرادف بين التلغراف والبرق صراحةً."

    - lemma: "مُبْرِقٌ"
      confirm:
        - text: "«أَبْرَقَ: ... أَرسل بَرْقيّةً. (محدثة).»"
          source: "المعجم الكبير"
      expands:
        - text: "«البَرْقُ: الضَّوْءُ يلمع فى السماء على إثر انفجار كهربائى فى السحاب؛ جهاز نقل الرسائل من مكان إلى آخر بعيد بوساطة إشارات خاصة.»"
          source: "المعجم الوسيط"
          addition: "البَرْق في الاستعمال الحديث يشمل جهاز التلغراف، فالمُبْرِق هو مُشغِّل هذا الجهاز."
        - text: "«مُبْرِقة: telegraph»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "المُبْرِقة هي الجهاز (بتاء التأنيث للآلة)، فالمُبْرِق بدونها يصلح للشخص المُشغِّل."
        - text: "«مبراق، إبراق: telegraph»"
          source: "مسرد الفن والتسلية (ALECSO)"
          addition: "صيغ أخرى من نفس الجذر للدلالة على جهاز البرق."

    - lemma: "بَرَّاقٌ"
      contradicts:
        - text: "«(بَرَقَ) الْبَاءُ وَالرَّاءُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا لَمَعَانُ الشَّيْءِ؛ وَالْآخَرُ اجْتِمَاعُ السَّوَادِ وَالْبَيَاضِ فِي الشَّيْءِ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المعنى الأصلي للجذر هو اللمعان واختلاط الألوان، و«بَرَّاق» في المعاجم بمعنى كثير اللمعان أو البريق، لا بمعنى مُرسِل البرقيات."

    - lemma: "عَامِلُ البَرْقِ"
      evidence_status: "no_material_found"

    - lemma: "تِلِغْرَافِيٌّ"
      expands:
        - text: "«تِلِغرافيّ [مفرد]: اسم منسوب إلى تِلِغراف. أسلوب تلغرافيّ: مختصر جدًّا.»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "النسبة صفة لا اسم فاعل، فلا تدلّ على الشخص المُشغِّل."

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "عَامِلُ تِلِغْرَافٍ"
      decision: confirmed
      decision_reason: "مصطلح مُثبت في المورد الحديث (2008) ترجمةً لـ telegrapher. رغم أنّه مركّب هجين (عربي + معرَّب)، إلا أنّه شائع ومفهوم ومسجّل معجمياً. يُبقى مع إيثار المُبْرِق عليه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير وصفي تحليلي يُفصح عن طبيعة العمل (تشغيل جهاز التلغراف)، يُفضَّل في السياقات التوضيحية أو عند مخاطبة غير المتخصصين."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِلُ تِلِغْرَافٍ"

    - lemma: "مُبْرِقٌ"
      decision: confirmed
      decision_reason: "اسم فاعل عربي فصيح من أَبْرَقَ (أرسل برقية)، مؤيَّد بنصّ المعجم الكبير. مُبْرِقة (الجهاز) مُثبتة في مصطلحات ALECSO، والمُبْرِق (الشخص) امتداد طبيعي. أفصح من المركّب الهجين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مفرد مشتقّ عربي، أكثر إيجازاً وفصاحة، يُفضَّل في الأسلوب المتخصص والرسمي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُبْرِقٌ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بَرَّاقٌ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استخدام «بَرَّاق» بمعنى مُشغِّل البرق. المعنى المعجمي الثابت هو كثير اللمعان والبريق، واستعماله بمعنى المُبرِق يُوقع في اللبس."
      evidence_assessment:
        case: contradicts_only

    - lemma: "عَامِلُ البَرْقِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على شاهد معجمي لهذا المركّب بوصفه وحدة اصطلاحية ثابتة. «البَرْق» يحتمل الظاهرة الطبيعية (البرق/الصاعقة) وجهاز التلغراف، فيقع لبس دلالي. لم يجتز اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material

    - lemma: "تِلِغْرَافِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "صفة نسبة لا اسم فاعل. لا تدلّ على الشخص المُشغِّل بل على ما يتصل بالتلغراف وصفاً. معجم اللغة المعاصرة يؤكد أنّها صفة فقط."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "شخص يرسل الرسائل عن طريق التلغراف"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم لفظ «التلغراف» الأعجمي بدل «البَرْق» العربي، ويفتقر إلى الدقة المصطلحية (الجنس القريب + الفصل النوعي)."
    authored:
      - type: terminological
        text: "مُشَغِّلٌ مُتَخَصِّصٌ فِي إِرْسَالِ الرَّسَائِلِ وَاسْتِقْبَالِهَا بِوَاسِطَةِ جِهَازِ البَرْقِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُشَغِّلٌ مُتَخَصِّصٌ فِي إِرْسَالِ الرَّسَائِلِ وَاسْتِقْبَالِهَا بِوَاسِطَةِ جِهَازِ البَرْقِ."

  examples:
    per_lemma:
      - lemma: "مُبْرِقٌ"
        examples:
          - text: "كَانَ المُبْرِقُ يَطْرُقُ مِفْتَاحَ مُورْس بِسُرْعَةٍ فَائِقَةٍ لِيُبَلِّغَ الرِّسَالَةَ قَبْلَ انْقِطَاعِ الخَطِّ."
            type: usage
      - lemma: "عَامِلُ تِلِغْرَافٍ"
        examples:
          - text: "عُيِّنَ عَامِلُ تِلِغْرَافٍ جَدِيدٌ فِي مَحَطَّةِ السِّكَّةِ الحَدِيدِيَّةِ لِتَأْمِينِ الِاتِّصَالِ بَيْنَ المَحَطَّاتِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "كَانَ المُبْرِقُ يَطْرُقُ مِفْتَاحَ مُورْس بِسُرْعَةٍ فَائِقَةٍ لِيُبَلِّغَ الرِّسَالَةَ قَبْلَ انْقِطَاعِ الخَطِّ."

