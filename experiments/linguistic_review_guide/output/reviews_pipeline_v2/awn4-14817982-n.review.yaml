# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14817982-n — carcinogen
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «مسبب للسرطان» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — يمكن إبدال «مسبب» بـ«مؤدٍّ» أو «مُحدِث» والمعنى لا يتغير"
      - "كلتا اللمتين الموجودتين مركبتان، ولا توجد لمّة مفردة رغم شيوع «مُسَرْطِن» في المعاجم الطبية"
      - "اللمتان تفتقران إلى التشكيل الكامل"
    observations: "المجموعة تدلّ على مفهوم طبي واضح — أي مادة تُحدث السرطان. المصطلح الإنجليزي carcinogen مشتقّ من اليونانية (karkinos + genesis). في العربية أُنتج المصطلح من الجذر الرباعي «سرطن» المشتق من «سرطان». اللمّة الأولى «مادة مسرطنة» تركيب وصفيّ مقبول ومُسجَّل في عدة معاجم موحّدة. أمّا «مسبب للسرطان» فعبارة تفسيرية لا ترقى لأن تكون مصطلحاً معجمياً ثابتاً."

  blind_candidates:
    - lemma: "مُسَرْطِن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل الرباعي «سَرْطَنَ» على وزن مُفَعْلِل، يدلّ على الفاعلية في إحداث السرطان — أقصر وأدقّ من التركيب"
    - lemma: "مُوَلِّدُ السَّرَطَانِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «مُوَلِّد» (اسم فاعل من وَلَّدَ) و«السرطان»، على غرار مصطلحات «مولِّد الحرارة» و«مولِّد الكهرباء»"
    - lemma: "مَادَّةٌ سَرَطَانِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من «مادّة» + النسبة «سرطانيّة» — يُحتمل شيوعه في الاستعمال العلمي"
    - lemma: "كَرْسِينُوجِين"
      generation_method: taarib
      justification: "تعريب المصطلح الإنجليزي carcinogen — ملاذ أخير، يُستخدم احتياطياً فقط في غياب بديل عربي"

# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّة الموجودة ١ ──
    - lemma: "مادة مسرطنة"
      confirm:
        - text: "«مادة مسرطنة» = carcinogen; carcinogenic"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«مادة مُسرطِنة» = carcinogen; substance, carcinogenic"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«مادة مسرطنة» = carcinogen — مادة محدثة للسرطان."
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«مواد مسرطنة» = carcinogens — مواد تسبب الإصابة بالسرطان."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      expands:
        - text: "«المُسَرْطَنَةُ»: الْمَوَادُّ الّتِى تُسَبِّبُ تَحَوُّل الخلايا إلى خلايا سَرَطانية مدمِّرة."
          source: "المعجم الكبير"
          addition: "صيغة اسم المفعول المُسَرْطَنَة استُخدمت في المعجم الكبير كمدخل مستقل بهذا المعنى"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "مسبب للسرطان"
      evidence_status: "no_material_found"

    # ── المرشح ١ ──
    - lemma: "مُسَرْطِن"
      confirm:
        - text: "«مُسرطِن» = carcinogen — عامل مسبب للسرطان أو للأورام الخبيثة"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«المُسَرْطِن: مادةٌ مُحْدِثةٌ للسَّرطان.» = carcinogen"
          source: "المورد الحديث (2008)"
        - text: "«مُسَرْطِن» = carcinogen"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُسَرْطِن» = cancerogenic"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُسَرْطِن» = oncogenic"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«هيدروكربونِيٌّ مُسَرْطِن» = carcinogenic hydrocarbon"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستخدم المصطلح وصفاً أيضاً في التركيبات الطبية"
        - text: "«فيروسٌ مُسَرْطِن» = oncogenic virus"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يدلّ على شمول المصطلح لعوامل غير مادية أيضاً (فيروسات)"

    # ── المرشح ٢ ──
    - lemma: "مُوَلِّدُ السَّرَطَانِ"
      confirm:
        - text: "«مولِّد السرطان» = carcinogenic — انظر: cancerogenic."
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      contradicts:
        - text: "«مولِّد السرطان» = cancerogenic — صفة لما يؤدي إلى ورم خبيث."
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          conflict: "المعجم يصنّفه صفةً (cancerogenic) لا اسماً (carcinogen)، فهو لا يدلّ على المادة ذاتها بل على صفة التسبب بالسرطان"

    # ── المرشح ٣ ──
    - lemma: "مَادَّةٌ سَرَطَانِيَّة"
      evidence_status: "no_material_found"

    # ── المرشح ٤ ──
    - lemma: "كَرْسِينُوجِين"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١ ──
    - lemma: "مَادَّة مُسَرْطِنَة"
      decision: confirmed
      decision_reason: "مصطلح مُسجَّل في عدة معاجم موحّدة (المياه، تقانات الأغذية، المناخ) بترجمة carcinogen. تركيب وصفي ثابت مسكوك. يُضاف التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُحدِّد الطبيعة المادية للعامل المُسَرْطِن — أي أنه «مادة» كيميائية أو فيزيائية، بخلاف «مُسَرْطِن» الذي يشمل أيّ عامل (فيروس، إشعاع، مادة)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة مُسَرْطِنَة"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "مُسَبِّب لِلسَّرَطَانِ"
      decision: removed
      decision_reason: "عبارة وصفية حرة لا مصطلح مسكوك — لم تُسجَّل في أيّ معجم كمدخل مستقل. يمكن إبدال «مسبب» بـ«مُحدِث» أو «مُوجِد» والمعنى لا يتغير، مما ينقض اختبار السكّ. المصطلح الصحيح المقابل هو «مادة مسببة للسرطان» (مسجَّل في ARABTERM) وهو أطول وأقل اقتصاداً من «مُسَرْطِن»."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── المرشح ١ (stage1) ──
    - lemma: "مُسَرْطِن"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مفرد مُثبَت في ستة معاجم موحّدة على الأقل (المعجم الطبي الموحد، المورد الحديث، الهندسة المدنية، الطب البيطري). مُعرَّف بوضوح: «مادةٌ مُحْدِثةٌ للسَّرطان» و«عامل مسبب للسرطان أو للأورام الخبيثة». اسم فاعل رباعي على وزن مُفَعْلِل، اشتقاقه شفاف ومطّرد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح عامّ يشمل أيّ عامل يُسبِّب السرطان سواء أكان مادة كيميائية أم فيروساً أم إشعاعاً — أعمّ من «مادة مسرطنة» التي تقتصر على المواد"
      actions:
        - command: create_entry
          params:
            lemma: "مُسَرْطِن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── المرشح ٢ (stage1) ──
    - lemma: "مُوَلِّدُ السَّرَطَانِ"
      source: stage1
      decision: removed
      decision_reason: "المعجم الطبي يُصنِّفه صفةً (cancerogenic = صفة لما يؤدي إلى ورم خبيث) لا اسماً للمادة ذاتها. لا يُستخدم اسمياً بمعنى carcinogen. كما أن «مُسَرْطِن» أكثر شيوعاً واقتصاداً."

    # ── المرشح ٣ (stage1) ──
    - lemma: "مَادَّةٌ سَرَطَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أيّ دليل معجمي. النسبة «سرطانيّة» تدلّ على الانتماء للسرطان لا على التسبُّب فيه، فقد يُفهم منها «مادة مصابة بالسرطان» لا «مادة مُسبِّبة للسرطان»."

    # ── المرشح ٤ (stage1) ──
    - lemma: "كَرْسِينُوجِين"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي، ولا حاجة للتعريب مع وجود البديل العربي المشتق «مُسَرْطِن» المُثبَت في معاجم متعددة."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
