      - type: encyclopedic
        text: "عاملٌ يُسبِّبُ تحوُّلَ الخلايا الطبيعية إلى خلايا سرطانيّة خبيثة، سواء أكان مادّةً كيميائيّة (كالبنزوبيرين والنتروزامين) أم إشعاعاً مُؤيِّناً أم فيروساً مُوَرِّماً، وذلك بإتلاف الحمض النووي أو تعطيل آليات التحكُّم في الانقسام الخلوي"
    actions:
