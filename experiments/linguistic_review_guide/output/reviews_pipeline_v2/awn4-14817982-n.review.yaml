    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط ومقبول لكنه يستخدم «أيّ» الإبهامية، ويفتقر إلى الجنس القريب الدقيق والفصل النوعي الكافي. كما أن إضافة «مُسَرْطِن» كلمّة مفردة يستدعي تعريفاً يشمل العوامل غير المادية أيضاً."
    authored:
      - type: terminological
        text: "عاملٌ كيميائيٌّ أو فيزيائيٌّ أو حيويٌّ يُحدِثُ السَّرَطانَ أو يُهيِّئُ لتكوُّنِهِ في الأنسجة الحيّة"
        quality_check:
          genus_present: true
          differentia_present: true
