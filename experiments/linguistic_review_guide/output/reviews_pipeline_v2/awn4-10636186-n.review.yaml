# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10636186-n
# a person who sniffs — شخص يشمشم
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «شخص يشمشم» يستخدم لفظة «يشمشم» المصنَّفة عامية عند دوزي ومحيط المحيط"
      - "التعريف مقتضب جداً ولا يميّز بين الشمّ العابر والتتبع بالأنف"
      - "اللمّة شَامّ اسم فاعل عام من شَمَّ، وقد يلتبس بمعنى مَن يشمّ أيّ شيء بلا قصد التتبع"
    observations: >
      المجموعة تصف شخصاً يمارس فعل الشمّ (sniffing) بوصفه سمة مميزة أو عادة.
      الجذر الأساسي «شمم» يدلّ على المقاربة والمداناة (ابن فارس)، والجذر «نشق» يدلّ
      أصلاً على النشوب ثم توسّع إلى معنى استنشاق الريح. اسم الفاعل «شَامّ» صيغة
      قياسية لكنها عامة، بينما «مُسْتَنْشِق» أقرب إلى معنى مَن يجذب الهواء بأنفه.
      ينبغي البحث عن صيغ مبالغة تدلّ على التكرار أو الاعتياد.
  blind_candidates:
    - lemma: "شَمَّام"
      generation_method: ishtiqaq
      justification: >
        صيغة مبالغة على وزن فَعَّال من الجذر «شمم»، تدلّ على كثرة الشمّ واعتياده،
        وهي صيغة قياسية في العربية للدلالة على الحرفة أو الإكثار من الفعل.
    - lemma: "نَشَّاق"
      generation_method: ishtiqaq
      justification: >
        صيغة مبالغة على وزن فَعَّال من الجذر «نشق» الذي يدلّ على الاستنشاق وجذب
        الريح بالأنف. المبالغة تناسب من يكثر من الشمّ والتنشّق.
    - lemma: "مُتَشَمِّم"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من تَشَمَّمَ (تَفَعَّلَ) بمعنى تتبّع الشيء بالشمّ مراراً.
        الوزن يفيد التكلّف والتدرّج في الفعل، وهو أقرب إلى معنى sniff المتكرر.
    - lemma: "مُشَمْشِم"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من شَمْشَمَ (رباعي مضاعف) بمعنى بالغ في الشمّ. الفعل وارد في
        المعجم الكبير بمعنى «تحسّس الشيء بأنفه»، لكنه مصنّف عامياً عند دوزي.


stage2_evidence:
  per_lemma:
    - lemma: "شَامّ"
      expands:
        - text: "«فلانٌ فلانًا: شَمَّ كُلٌّ منهما الآخَرَ اخْتَبَره ونَظر ما عِنْدَه قَارَبَه ودَنَا مِنْه»"
          source: "المعجم الكبير"
          addition: "المشامّة تفيد المقاربة والاختبار بالشمّ، وهو أساس اشتقاق اسم الفاعل شَامّ"
        - text: "«شَمَّ الشيءَ شَمّاً وشَمِيماً: أدرك رائحته»"
          source: "المعجم الوسيط"
          addition: "الفعل الثلاثي شَمَّ يفيد إدراك الرائحة مطلقاً، واسم الفاعل منه شَامّ"

    - lemma: "مُسْتَنْشِق"
      confirm:
        - text: "«المُسْتَنشِق: من يستنشق الهواء»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«استنشق الهواءَ: نشَقه، شمَّه، تنفَّسَه»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "الاستنشاق يشمل الشمّ والتنفس معاً"
        - text: "«اسْتَنْشَقَ الرِّيحَ شَمَّها»"
          source: "مختار الصحاح"
          addition: "الاستنشاق في الأصل شمّ الريح وجذبها بالأنف"

    - lemma: "شَمَّام"
      confirm:
        - text: "«الحادُّ الشَّمِّ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«مَنْ يتعاطى المخدِّرات»"
          source: "المعجم الكبير"
          conflict: "المعنى الثاني يحصر الشمّام في متعاطي المخدرات عبر الاستنشاق"
        - text: "«نبات من الفصيلة القرعية ثمره مدوّر مستطيل قليلاً وقشره مخطط»"
          source: "المعجم الوسيط"
          conflict: "الشمام كنبات (cantaloupe) هو الاستعمال الغالب اليوم، فيلتبس بالمعنى المراد"

    - lemma: "نَشَّاق"
      confirm:
        - text: "«المكثر من استعمال النشوق، والمبالغ في شم الرائحة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«نَشِقَ الرائحةَ: شمَّها»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "الجذر نشق يفيد الشمّ كمعنى ثانوي بعد النشوب"

    - lemma: "مُتَشَمِّم"
      evidence_status: "no_material_found"

    - lemma: "مُشَمْشِم"
      contradicts:
        - text: "«شَمْشَم: بالغ في الشم عامية (محيط المحيط) (بوشر)»"
          source: "تكملة المعاجم العربية لدوزي"
          conflict: "الفعل شمشم مصنّف عامياً، فاسم الفاعل منه عاميّ تبعاً"
      expands:
        - text: "«فلانٌ وغيرُه: تَحَسَّسَ الشىءَ بأنفه»"
          source: "المعجم الكبير"
          addition: "المعجم الكبير أورد الفعل دون وسم عاميّة، لكن دوزي وسمه"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "شَامّ"
      decision: confirmed
      decision_reason: >
        اسم فاعل قياسي من شَمَّ يَشُمُّ على وزن فَاعِل. الجذر «شمم» أصيل يدلّ
        على المقاربة وإدراك الرائحة (ابن فارس). وإن لم يرد شَامّ مدخلاً مستقلاً
        في المعاجم فهو اشتقاق قياسي لا يحتاج إلى سماع.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        شَامّ هو الوصف الأعمّ: مَن يُدرك الرائحة بأنفه دون إيحاء بالتكرار أو القصد،
        بخلاف مُسْتَنْشِق الذي يدلّ على جذب الهواء عمداً بالنَّفَس.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَامّ"

    - lemma: "مُسْتَنْشِق"
      decision: confirmed
      decision_reason: >
        مؤيَّد بنصّ المورد الحديث: «المُسْتَنشِق: من يستنشق الهواء».
        الوزن مُسْتَفْعِل يفيد الطلب والاجتهاد في الفعل، وهو ملائم لمعنى مَن
        يتعمّد جذب الريح إلى أنفه.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُسْتَنْشِق يدلّ على مَن يجذب الهواء أو الرائحة إلى أنفه قصداً عبر النَّفَس،
        وفيه معنى التعمّد والطلب، بخلاف شَامّ الذي يفيد مطلق الإدراك.
      actions: []

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَشَّاق"
      source: stage1
      decision: confirmed
      decision_reason: >
        صيغة مبالغة على وزن فَعَّال من الجذر «نشق» مؤيَّدة بموسوعة السلطان قابوس:
        «المبالغ في شم الرائحة». الوزن يفيد الإكثار والاعتياد، وهو أنسب صيغة
        لوصف مَن يشمّ بتكرار. الجذر أصيل ورد في مقاييس اللغة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        نَشَّاق يفيد المبالغة والإكثار من الشمّ والتنشّق، ويوحي بالاعتياد على
        جذب الروائح، بخلاف شَامّ (إدراك عام) ومُسْتَنْشِق (جذب متعمّد).
      actions:
        - command: create_entry
          params:
            lemma: "نَشَّاق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "شَمَّام"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود «الحادّ الشمّ» في المعجم الكبير، يغلب على الشمّام اليوم معنى
        النبات (البطيخ الأصفر/الكنتالوب)، فضلاً عن دلالته على متعاطي المخدرات
        في المعجم الكبير. تعدّد المعاني يُحدث لبساً غير مقبول.
      evidence_assessment:
        case: mixed

    - lemma: "مُتَشَمِّم"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد شواهد معجمية لاسم الفاعل «مُتَشَمِّم» بوصفه اسماً مستقلاً.
        الصيغة قياسية صرفياً لكنها لم تُسكّ مصطلحاً ثابتاً.
      evidence_assessment:
        case: no_material

    - lemma: "مُشَمْشِم"
      source: stage1
      decision: removed
      decision_reason: >
        الفعل «شمشم» وسمه دوزي بالعامية نقلاً عن محيط المحيط وبوشر. وإن أورده
        المعجم الكبير فالغالب أنه عاميّ دخيل على الفصحى. لا يصلح أساساً لمصطلح معجمي.
      evidence_assessment:
        case: contradicts_only


