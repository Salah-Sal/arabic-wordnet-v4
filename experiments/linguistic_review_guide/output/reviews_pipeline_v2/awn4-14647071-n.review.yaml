# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14647071-n — عنصر كيميائي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان بدون تشكيل كامل"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي، يحتوي على أرقام وأسلوب غير معجمي"
    observations: >
      المجموعة تمثّل مفهوم «العنصر الكيميائي» وهو مفهوم علمي أساسي له تجذّر عميق في التراث العربي.
      كلمة «عنصر» مستعملة منذ القدم بمعنى الأصل والحسب، ثم توسّعت دلالتها في العصر الحديث
      لتشمل المعنى الكيميائي. كان العرب يستعملون أيضاً لفظ «أُسْطُقُسّ» المعرّب من اليونانية
      للإشارة إلى العناصر الأربعة القديمة. التعريف الحالي يحتاج إلى إعادة صياغة بأسلوب معجمي عربي.
  blind_candidates:
    - lemma: "عُنْصُر"
      generation_method: ishtiqaq
      justification: >
        من الجذر ع ن ص ر، والعُنْصُر في الأصل بمعنى الأصل والأساس الذي يتألّف منه الشيء.
        استُعمل في المعاجم الحديثة بالمعنى الكيميائي. وزن فُعْلُل مناسب للدلالة على الجوهر والأصل.
    - lemma: "عُنْصُر كِيمِيَائِيّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي وصفي يخصّص المعنى العامّ لـ«عنصر» بالمجال الكيميائي،
        ويميّزه عن الاستعمالات الأخرى كالعنصر الرياضي أو العنصر العسكري.
    - lemma: "أُسْطُقُسّ"
      generation_method: taarib
      justification: >
        لفظ معرّب من اليونانية (στοιχεῖον)، استعمله العرب قديماً للعناصر الأربعة
        (النار والهواء والماء والأرض). ذكره الجرجاني والتهانوي والدوزي.
    - lemma: "جَوْهَرٌ بَسِيط"
      generation_method: tarkib
      justification: >
        مركّب وصفي من التراث الفلسفي العربي، يشير إلى المادّة التي لا تتركّب من أجسام مختلفة الطبائع.
        استعمله التهانوي في تعريف العنصر: «جسم بسيط فيه مبدأ ميل مستقيم».


stage2_evidence:
  per_lemma:
    - lemma: "عُنْصُر"
      confirm:
        - text: "«(العنصر) الأصلُ والحسبُ الجنس (فى الكيمياء) : مادَّة أوَّلية لا يمكن تحليلها كيمياوياً إلى ما هو أبسط منها المادة التى تدخل فى تكوّن جسم ما , كالهدر وجين والأكسجين فى تكوّن الماء»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(فِي الكيمياء) مَادَّة أولية لَا يُمكن تحليلها كيماويا إِلَى مَا هُوَ أبسط مِنْهَا والمادة الَّتِي تدخل فِي تكون جسم مَا كالهيدروجين والأكسجين فِي تكون المَاء»"
          source: "المعجم الوسيط (حوراماني)"
        - text: "«(كم) مادَّة أوّليَّة لا يمكن تحليلها إلى ما هو أبسط منها بالطرق الكيميائيَّة العاديَّة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«العنصر: الأصل الذي تتألف منه الأجسام المختلفة الطابع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«العُنْصُرُ: أصْلُ الحَسَب. إنما جاء عن الفُصَحاء مضمُومُ العَين منصُوب الصاد»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: "ضبط الكلمة الصرفي: فُعْلَر بضمّ العين وفتح الصاد عند الفصحاء، وبضمّهما عند أبي عبيد"
        - text: "«العُنْصُرُ، بفتح الصادِ وضمها: الدَّاهِيةُ، والهمَّةُ، والحاجةُ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "دلالات أخرى للعنصر غير الأصل: الداهية والهمّة والحاجة"
        - text: "«العنصر: ابتداء تركيب الشيء»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "تعريف اصطلاحي يربط العنصر ببداية التركيب"

    - lemma: "عُنْصُر كِيمِيَائِيّ"
      confirm:
        - text: "«عنصر كيميائى — chemical element — élément chimique»"
          source: "موسوعة الكهرباء (IEC 60050) — ARABTERM"
        - text: "«الجَوهَرُ القِصَائِيّ (عُنْصُرٌ كيميائِيّ) — ultimate principle (chemical element)»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"

    - lemma: "أُسْطُقُسّ"
      confirm:
        - text: "«أسطقس: هو لفظ يوناني بمعنى الأصل، وتسمّى العناصر الأربع التي هي الماء والأرض والهواء والنار أسطقسات لأنها أصول المركبات»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«إِسْطُقِسُ: وهذا الضبط في معجم فريتاج، وضبطت في معجم فوك: أُسْطُقُسَ وتجمع على اسطقسات في معجم الكالا (العناصر)»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
      contradicts:
        - text: "«الاسطقس: عبارة عن إحدى أربع طبائع»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الأُسْطُقُسّ عند القدماء مقصور على العناصر الأربعة (الماء والأرض والهواء والنار)، لا على العناصر الكيميائية الحديثة التي تزيد عن مئة"

    - lemma: "جَوْهَرٌ بَسِيط"
      expands:
        - text: "«وعرف العنصر بأنّه جسم بسيط فيه مبدأ ميل مستقيم، والبسيط بمعنى ما لا يتركّب من أجسام مختلفة الطّبائع»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التعبير فلسفي تراثي لا كيميائي حديث، ولم يُستعمل كمصطلح معجمي مستقل"


stage3_analysis:
  per_lemma:
    - lemma: "عُنْصُر"
      decision: confirmed
      decision_reason: >
        لفظ عربي أصيل مثبت في جميع المعاجم الكلاسيكية والحديثة. المعجم الوسيط
        يُدرج له صراحةً المعنى الكيميائي. هو المصطلح الأكثر شيوعاً واستعمالاً
        في الأوساط العلمية والأكاديمية العربية. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «عُنْصُر» هو اللفظ المفرد العامّ الذي يُستعمل وحده في السياقات الكيميائية
        حين يكون المجال واضحاً من القرينة، بينما «عنصر كيميائي» يُستعمل عند الحاجة
        إلى التمييز عن الاستعمالات الأخرى (الرياضية، العسكرية، إلخ).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُنْصُر"

    - lemma: "عُنْصُر كِيمِيَائِيّ"
      decision: confirmed
      decision_reason: >
        مركّب إضافي وصفي مسجّل في عدّة معاجم مصطلحية عربية موحّدة (موسوعة الكهرباء،
        المعجم الطبي الموحد). يخصّص المعنى الكيميائي ويُميّزه عن الدلالات الأخرى
        لكلمة «عنصر». مصطلح ثابت متداول في الأدبيات العلمية العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «عنصر كيميائي» مركّب تخصيصي يُستعمل حين يكون المقام غير كيميائي صرف
        أو عند الحاجة إلى التصريح بالمجال، بخلاف «عنصر» المفرد الذي يكفي
        في السياقات الكيميائية الصريحة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُنْصُر كِيمِيَائِيّ"

    - lemma: "أُسْطُقُسّ"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ معرّب من اليونانية مقصور في الاستعمال التراثي على العناصر الأربعة القديمة
        (الماء والأرض والهواء والنار). لا يُستعمل في الكيمياء الحديثة للدلالة على
        العناصر الكيميائية التي تتجاوز المئة. مهجور في الاستعمال العلمي المعاصر.
      evidence_assessment:
        case: mixed

    - lemma: "جَوْهَرٌ بَسِيط"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير فلسفي تراثي ورد في سياق تعريف العنصر عند التهانوي، لكنه لم يتحوّل
        إلى مصطلح معجمي مستقل ولا يُستعمل في الكيمياء الحديثة. لا يجتاز اختبار
        التثبيت المعجمي كمركّب اصطلاحي ثابت.
      evidence_assessment:
        case: no_material


