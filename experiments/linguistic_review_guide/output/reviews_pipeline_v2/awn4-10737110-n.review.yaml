# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10737110-n (totemist)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «طُوطَمِيّ» صفة نسبة مبنية على لفظ معرَّب، ولا يوجد لها شاهد معجمي مستقل كاسم فاعل"
      - "المجموعة تحتوي لمّة واحدة فقط، والمفهوم ذاته غريب ثقافياً عن البيئة العربية"
      - "الصنف الفائق (عامل/فاعل = شخص يعمل وينجز الأمور) لا يناسب دلالياً مفهوم الطوطمي الذي هو منتسب لا عامل"
    observations: >
      المفهوم ينتمي إلى علم الأنثربولوجيا ويصف شخصاً ينتمي إلى جماعة تتخذ طوطماً رمزاً لها.
      لفظ «طوطم» معرَّب مثبت في مسارد أليكسو والمورد الحديث، فالاشتقاق منه بالنسبة (-يّ)
      للدلالة على صاحب الطوطم مقبول صرفياً وإن لم يُسجَّل بمفرده في المعاجم.
      المجموعة أحادية اللمّة وهذا متوقع لمصطلح أنثربولوجي متخصص.
  blind_candidates:
    - lemma: "طُوطَمِيّ"
      generation_method: taarib
      justification: >
        نسبة إلى «طوطم» المعرَّب على وزن فَعْلَمِيّ، وهو الأسلوب المعياري لتوليد اسم المنتسب
        من الأسماء المعرَّبة في العربية المعاصرة. يقبل لام التعريف والجمع السالم (طوطميّون).
    - lemma: "صاحِبُ الطُّوطَم"
      generation_method: tarkib
      justification: >
        تركيب إضافي يدل على من ينتسب إلى طوطم. لكنه عبارة وصفية حرة أكثر من كونه
        مصطلحاً مسكوكاً، إذ يمكن إبدال «صاحب» بـ«ذو» أو «حامل» فيبقى المعنى قائماً.
    - lemma: "مُعْتَقِدُ الطُّوطَم"
      generation_method: tarkib
      justification: >
        تركيب إضافي من اسم الفاعل «معتقد» + الطوطم، يدل على من يؤمن بالطوطم.
        لكنه يقصر المفهوم على جانب الاعتقاد وحده دون جانب الانتساب القبلي.
    - lemma: "طُوطَمانِيّ"
      generation_method: taarib
      justification: >
        تعريب بديل بزيادة لاحقة -انيّ (على غرار: رُوحانيّ، رَبّانيّ) لتمييزه عن الصفة
        «طوطميّ». لكن اللاحقة -انيّ تفيد المبالغة أو الوصف لا الانتساب القبلي.

stage2_evidence:
  per_lemma:
    - lemma: "طُوطَمِيّ"
      confirm:
        - text: "«الطَّوْطميّة: أ- الإيمان بوجود صِلَة خفيّة بين جماعة أو شخص وبين طَوْطَم ما. ب- نظام اجتماعيّ قوامُه الانتماء الطَّوْطميّ»"
          source: "المورد الحديث (2008)"
        - text: "«العمود الطَّوْطَميّ: عمودٌ منحوتٌ مزدانٌ بِرُسُوم طوطميّة يقيمه بعض الهنود الحمر أمام منازلهم»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«أ- الطَّوْطم: ب- شيء [كحيوان أو نبات] يُتَّخذ رمزًا للأُسرة أو العشيرة. ج- وَثَنٌ يُمثِّل هذا الشيء. د- أسرة أو عشيرة يجمع ما بين أفرادها طوطمٌ مشترَك»"
          source: "المورد الحديث (2008)"
          addition: "يوضح المعنى الرابع (د) أن الطوطم يدل أيضاً على الجماعة نفسها لا الرمز فقط"
        - text: "«طوطم = totem»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (أليكسو)"
          addition: "يثبت تعريب اللفظ في المصطلحية الرسمية العربية"
        - text: "«طوطمية = totemism»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (أليكسو)"
          addition: "يثبت المصدر الصناعي من الأساس المعرَّب، مما يؤيد جواز النسبة طوطميّ"
    - lemma: "صاحِبُ الطُّوطَم"
      evidence_status: "no_material_found"
    - lemma: "مُعْتَقِدُ الطُّوطَم"
      evidence_status: "no_material_found"
    - lemma: "طُوطَمانِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "طُوطَمِيّ"
      decision: confirmed
      decision_reason: >
        النسبة إلى «طوطم» المعرَّب مقبولة صرفياً واصطلاحياً. لفظ «طوطم» مثبت في مسارد أليكسو
        (علم الاجتماع، الفلسفة، الجغرافيا) والمورد الحديث. والمشتق «طوطميّة» مسجّل رسمياً
        بوصفه مقابلاً لـ totemism، مما يؤيد استعمال النسبة «طوطميّ» للدلالة على الشخص (totemist)
        على نمط: اشتراكيّة → اشتراكيّ، شيوعيّة → شيوعيّ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة في المجموعة — لا مجال للمقارنة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طُوطَمِيّ"
    - lemma: "صاحِبُ الطُّوطَم"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب وصفي حرّ يفتقر إلى التثبيت المعجمي. يمكن إبدال «صاحب» بـ«ذو» أو «حامل»
        دون تغيّر المعنى، مما يُسقط اختبار السكّ. لم يُعثر على أي شاهد معجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
    - lemma: "مُعْتَقِدُ الطُّوطَم"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب حرّ غير مسكوك يقصر المفهوم على جانب الاعتقاد وحده، بينما الطوطمي
        هو المنتسب إلى جماعة لها طوطم وليس بالضرورة المؤمن به. لا شاهد معجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
    - lemma: "طُوطَمانِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مبتكرة لا شاهد لها. اللاحقة -انيّ تحمل معنى المبالغة أو الصفة الثابتة
        (رُوحانيّ، رَبّانيّ) لا الانتساب إلى جماعة. النسبة البسيطة «طوطميّ» أوضح وأشيع
        وتتسق مع المصدر الصناعي «طوطميّة» المثبت في أليكسو.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "شخص ينتمي إلى عشيرة أو قبيلة لها طوطم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في جوهره لكنه يفتقر إلى بيان ماهية الطوطم، مما يجعله
        غامضاً لمن لا يعرف المصطلح. ينبغي إضافة إيضاح مختصر وتحسين الصياغة.
    authored:
      - type: terminological
        text: "مَن ينتسب إلى عشيرة أو قبيلة تتخذ كائناً طبيعياً — كحيوان أو نبات — رمزاً مقدَّساً لها يُسمّى الطُّوطَم"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "فرد في مجتمع بدائيّ يؤمن بوجود صلة روحيّة بين جماعته وكائن طبيعيّ أو ظاهرة تُتَّخذ رمزاً مشتركاً يُعرف بالطُّوطَم، وتقوم عليه روابط القرابة والتحريمات الاجتماعية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَن ينتسب إلى عشيرة أو قبيلة تتخذ كائناً طبيعياً — كحيوان أو نبات — رمزاً مقدَّساً لها يُسمّى الطُّوطَم"
  examples:
