stage1_review:
  assessment:
    concerns:
      - "اللمّة «تسوندري» تعريب مباشر للفظة يابانية (ツンデレ tsundere) دون تشكيل"
      - "المفهوم خاص بثقافة الرسوم المتحركة اليابانية (أنيمي/مانغا)، وليس له مقابل طبيعي في العربية"
      - "لا يوجد ربط بفهرس ILI (ili: null)، ما يعني أنه مُضاف محلياً"
      - "التعريف يبدو مترجماً حرفياً ويحتاج صياغة عربية أصيلة"
    observations: >
      المفهوم يصف نمطاً سلوكياً شائعاً في ثقافة الأنيمي الياباني، يجمع بين طورَيْن:
      طور الجفاء والعداء الظاهري (تسن = ツン) وطور اللين والدفء المستتر (ديري = デレ).
      هذا النمط لا يكافئه مصطلح عربي تراثي واحد، إذ المعاجم العربية تفرّق بين الجفاء
      والتمنّع والتدلّل، لكن لا تجمعها في مفهوم واحد يصف تحوّلاً تدريجياً من البرود إلى الودّ.
      المرتبات المجازية والاشتقاقية لا تغطي هذا المفهوم المركّب بدقة، فالتعريب هو الخيار الأنسب.
  blind_candidates:
    - lemma: "تَمَنُّع"
      generation_method: ishtiqaq
      justification: >
        من جذر م-ن-ع على وزن تَفَعُّل، يدلّ على الامتناع والإعراض عمّن يُحَبّ قبل الإذعان.
        يُستعمل في سياق التدلّل والإعراض المصطنع، لكنه يفتقر إلى دلالة التحوّل التدريجي نحو الدفء.
    - lemma: "تَصَلُّف"
      generation_method: ishtiqaq
      justification: >
        من جذر ص-ل-ف على وزن تَفَعُّل، يدلّ على التكبّر وإظهار الغلظة. يغطّي طور البرود
        الأوّلي لكنه لا يتضمّن دلالة الانكشاف عن جانب ودّي.
    - lemma: "ظَاهِرُ الجَفَاء"
      generation_method: tarkib
      justification: >
        مركّب إضافي يصف مَن يبدي جفاءً في الظاهر مع إخفاء مشاعر أخرى. لكنه عبارة وصفية
        حرّة وليس مصطلحاً مسكوكاً، ويفشل في اختبار السكّ (يمكن إبدال «جفاء» بـ«غلظة» دون تغيّر).
    - lemma: "تْسُنْدِرِي"
      generation_method: taarib
      justification: >
        تعريب للفظة اليابانية ツンデレ (tsundere) على وزن يقبل لام التعريف (التسندري)
        والنسبة (تسندريّ) والجمع السالم (تسندريّون). هو الخيار الوحيد الذي يحفظ دقّة
        المفهوم الثقافي دون فقدان أو تعميم.

stage2_evidence:
  per_lemma:
    - lemma: "تسوندري"
      evidence_status: "no_material_found"
    - lemma: "تَمَنُّع"
      contradicts:
        - text: "«(تمنع) الشَّيْء امْتنع وَبِه احتمى وَعنهُ انكف»"
          source: "المعجم الوسيط"
          conflict: "التمنّع يدلّ على الامتناع والاحتماء بمعنى عام، ولا يتضمّن دلالة التحوّل من البرود إلى الدفء"
    - lemma: "تَصَلُّف"
      evidence_status: "no_material_found"
    - lemma: "ظَاهِرُ الجَفَاء"
      expands:
        - text: "«الجفاء بالفتح، الغلظ في العشرة والخرق في المعاملة وترك الرفق في الأمور»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يؤكّد أنّ الجفاء يعني الغلظة في المعاملة، وهو يغطّي الطور الأوّل فقط من المفهوم"
        - text: "«نَقِيضُ الصَّلَةِ وخِلافُ البِرِّ»"
          source: "المعجم الكبير"
          addition: "الجفاء نقيض الصلة والبرّ، ممّا يؤكّد تغطيته للطور البارد دون الدافئ"
    - lemma: "تْسُنْدِرِي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تسوندري"
      decision: confirmed
      decision_reason: >
        اللمّة تعريب مباشر للمصطلح الياباني المتداول عالمياً في ثقافة الأنيمي والمانغا.
        لا يوجد بديل عربي تراثي يحمل نفس الدلالة المركّبة. المصطلح شائع في المجتمعات
        العربية المتابعة للأنيمي ويُفهم بلا لبس. يحتاج إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: "تعريب لفظي من اليابانية (ツンデレ tsundere)"
        status: "مقبول — مصطلح ثقافي متخصّص لا مقابل عربي له"
      morphological_fit: "الكلمة أعجمية لا تخضع لأوزان الصرف العربي، لكنها تقبل لام التعريف والنسبة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تْسُونْدِرِي"

    - lemma: "تَمَنُّع"
      source: stage1
      decision: removed
      decision_reason: >
        التمنّع يدلّ على الامتناع والإعراض بشكل عام، ولا يتضمّن مفهوم التحوّل التدريجي من
        البرود إلى الدفء الذي هو جوهر المفهوم. الدليل المعجمي يُظهر أنّ المعنى أعمّ بكثير.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَصَلُّف"
      source: stage1
      decision: removed
      decision_reason: >
        التصلّف يدلّ على التكبّر وإظهار الأنفة فحسب، ولا يغطّي إلا الطور الأوّل (البرود).
        لا دليل معجمي على استعماله بمعنى التحوّل من الجفاء إلى الودّ.
      evidence_assessment:
        case: no_material

    - lemma: "ظَاهِرُ الجَفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرّة وليست مصطلحاً مسكوكاً. تفشل في اختبار السكّ (يمكن إبدال «جفاء»
        بـ«غلظة» أو «عبوس» والعبارة تبقى صالحة). كما أنها تصف الحالة الأولى فقط دون
        التحوّل نحو الدفء.
      evidence_assessment:
        case: mixed

    - lemma: "تْسُنْدِرِي"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بديلة للتعريب تختلف عن الموجودة (تسوندري) بحذف الواو. بما أنّ الصيغة الموجودة
        أقرب إلى النطق الشائع في المجتمع العربي وتحافظ على المدّ الياباني، فلا حاجة
        لإضافة صيغة مكرّرة. يمكن إضافتها كصيغة بديلة (form) عند الحاجة.
      evidence_assessment:
        case: no_material

