# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14643403-n (atom / ذرة)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ذرة» مسجّلة بلا تشكيل، والتشكيل ضروري للتمييز بين الذَّرَّة (atom) والذُّرَة (corn/maize)"
      - "المجموعة تحتوي لمّة واحدة فقط لمفهوم علمي أساسي واسع الاستعمال"
    observations: >
      المفهوم هو الذرة بمعناها الفيزيائي-الكيميائي الحديث: أصغر وحدة من العنصر تحتفظ بخصائصه الكيميائية.
      التعريف الحالي جيد ويغطي المعنى العلمي المراد. المصطلح «ذرة» راسخ في الاستعمال العلمي العربي
      المعاصر ومُعتمَد في جميع المعاجم الموحّدة (الكيمياء، الفيزياء، الهندسة الكهربائية، وغيرها).
      المفهوم له جذور في الفلسفة الإسلامية حيث عُرف بمصطلح «الجوهر الفرد» عند المتكلمين.
  blind_candidates:
    - lemma: "ذَرَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر «ذرر» على وزن فَعْلَة، الدال على اللطافة والانتشار.
        المصطلح الأصيل في العربية للدلالة على أصغر جزء من المادة،
        استُعمل في القرآن الكريم بمعنى أصغر شيء ثم نُقل إلى المعنى العلمي.
    - lemma: "جَوْهَرٌ فَرْدٌ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «جوهر» (مادة/ذات) و«فرد» (لا ينقسم).
        مصطلح المتكلمين المسلمين للجزء الذي لا يتجزأ، ورد في كشاف اصطلاحات الفنون
        ومقاليد العلوم. يقابل المفهوم الفلسفي للذرة (atomos = لا ينقسم).
    - lemma: "هَبَاءَة"
      generation_method: majaz
      justification: >
        مجاز من الهباء (دقاق التراب المنبثّ في ضوء الشمس) إلى أصغر جزء من المادة.
        العلاقة المجازية قائمة على تشابه الصِّغَر المتناهي والانتشار.
    - lemma: "أَتُوم"
      generation_method: taarib
      justification: >
        تعريب للمصطلح العالمي atom/atomos اليوناني. يقبل لام التعريف (الأتوم)
        والنسبة (أتومي) والجمع السالم (أتومات).

stage2_evidence:
  per_lemma:
    - lemma: "ذَرَّة"
      confirm:
        - text: "«(الذّرة) هِيَ أصغير جُزْء فِي عنصر مَا يَصح أَن يدْخل فِي التفاعلات الكيميائية (مج)»"
          source: "المعجم الوسيط (الحواماني)"
        - text: "«(في الفيزياء) atom: أصْغَرُ جُزْءٍ من عنصر يدخُلُ في التَّفاعُلات الكيميائيَّة»"
          source: "المعجم الكبير"
        - text: "«أصغر جزء من مادة عنصرية يدخل في التفاعلات الكيميائية»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«المُكوّن الأساسي للمادة. والذرة هي أصغر وحدة يُمكن أن ينقسم إليها مادة ما بالوسائل الميكانيكية أو الكيميائية. وهي تتكون من غلاف الذرة الذي يحتوي على الإلكترونات سالبة الشحنة، ومن النواة موجبة الشحنة.»"
          source: "مسرد الهندسة الكهربائية (ALECSO/ArabTerm)"
        - text: "«أصغر جسيم من المواد الذي يمكن أن يتواجد كعنصر كيميائي نقي.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«واحدة الذَّرِّ, قال ثَعْلب: إِنَّ مائةً منها زنةُ حبَّةٍ من شعير, فكأنَّها جُزْءٌ من مائةٍ. وقيل: الذَّرَّةُ ليس لها وَزْنٌ»"
          source: "المعجم الكبير"
          addition: "الأصل اللغوي: الذرّة واحدة الذرّ (صغار النمل)، ثم نُقلت إلى أصغر جزء"
        - text: "«(في الفلسفة) Atom: أصْغَرُ جُزْءٍ لا يتجزَّأُ من المادة, وهو ما لا يَنْقَسِمُ. وبها قال ديموقريطس, وسمَّاها المتكلمونَ: الجُزْءَ الذى لا يتجزأ, أو الجُزْء, أو الجَوْهَر الفَرْد»"
          source: "المعجم الكبير"
          addition: "يكشف التطور الدلالي: من المعنى الفلسفي (الجزء الذي لا يتجزأ) إلى المعنى الفيزيائي الحديث"
        - text: "«الذّرة:[في الانكليزية] Atom [في الفرنسية] Atome بالفتح هي نصف سدس القطمير»"
          source: "كشاف اصطلاحات الفنون والعلوم (التهانوي)"
          addition: "المعنى التراثي: وحدة وزن متناهية الصغر"

    - lemma: "جَوْهَرٌ فَرْدٌ"
      confirm:
        - text: "«الجَوْهَرُ الفَرْدُ: متحيز لَا يقبل الْقِسْمَة.»"
          source: "معجم مقاليد العلوم (السيوطي)"
        - text: "«الجوهر الفرد:[في الانكليزية] Atom ،indivisible part [في الفرنسية] Atome ،partie indivisible هو الجزء الذي لا يتجزأ.»"
          source: "كشاف اصطلاحات الفنون والعلوم (التهانوي)"
      contradicts:
        - text: "«جوهر فرد» → translation_en: «monade»"
          source: "مسرد الفلسفة وعلم النفس (ALECSO/ArabTerm)"
          conflict: "في المصطلحية الحديثة يُقابل «الجوهر الفرد» بـ monade (المونادة) لا بـ atom"
      expands:
        - text: "«وسمَّاها المتكلمونَ: الجُزْءَ الذى لا يتجزأ, أو الجُزْء, أو الجَوْهَر الفَرْد»"
          source: "المعجم الكبير"
          addition: "المعجم الكبير يسجّل «الجوهر الفرد» مرادفاً كلامياً للذرة الفلسفية"

    - lemma: "هَبَاءَة"
      contradicts:
        - text: "«(الهباءة) الْقطعَة من الهباء»"
          source: "المعجم الوسيط"
          conflict: "الهباءة تعني قطعة الغبار الدقيق، لا الذرة بالمعنى الفيزيائي"
        - text: "«هباءة» → translation_en: «dust grain»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "المصطلح المعياري يقابل grain of dust لا atom"

    - lemma: "أَتُوم"
      contradicts:
        - text: "«الأَتُوم: المفضاة من النساء الصغيرة الفرج (ضد)»"
          source: "المعجم الكبير"
          conflict: "اللفظة «أتوم» مسجّلة في العربية بمعنى مختلف تماماً (امرأة صغيرة الفرج)، من جذر «أتم»، فتعريب atom بهذه الصيغة يوقع في اشتراك لفظي مُربك"

stage3_analysis:
  per_lemma:
    - lemma: "ذَرَّة"
      decision: confirmed
      decision_reason: >
        اللمّة الأصيلة الراسخة في الاستعمال العلمي العربي المعاصر، مؤيَّدة بجميع المعاجم الموحدة
        (الكيمياء، الفيزياء، الهندسة، الطب) وبالمعجم الوسيط والمعجم الكبير. الجذر «ذرر» يدل
        على اللطافة والانتشار مما يلائم المعنى. التشكيل الصحيح ذَرَّة (بفتح الذال وتشديد الراء)
        ضروري للتمييز عن الذُّرَة (نبات الذرة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ذَرَّة"

    - lemma: "جَوْهَرٌ فَرْدٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ثبوت المصطلح في تراث المتكلمين كمرادف فلسفي للذرة (الجزء الذي لا يتجزأ)،
        إلا أنه في المصطلحية الحديثة يُقابل بـ «مونادة» (monade) في مسرد الفلسفة وعلم النفس (ALECSO).
        كما أن المفهوم الفلسفي (الجزء الذي لا يتجزأ = indivisible) يختلف عن المفهوم الفيزيائي
        الحديث (الذرة قابلة للانقسام إلى نواة وإلكترونات). إضافته قد تُوقع في خلط بين المفهومين.
      evidence_assessment:
        case: mixed

    - lemma: "هَبَاءَة"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تحصر معنى «هباءة» في القطعة من الغبار الدقيق (dust grain)،
        ولا يوجد أي شاهد على استعمالها بمعنى الذرة الفيزيائية. المعاجم الموحدة تقابلها
        بـ dust grain لا بـ atom.
      evidence_assessment:
        case: contradicts_only

    - lemma: "أَتُوم"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظة «أتوم» مسجّلة في المعجم الكبير بمعنى مختلف تماماً (المرأة المفضاة الصغيرة الفرج)
        من جذر «أتم»، فتعريب atom بهذه الصيغة يُوقع في اشتراك لفظي مُربك.
        فضلاً عن ذلك، المصطلح العربي «ذرّة» راسخ ومعتمد في جميع المعاجم فلا حاجة للتعريب.
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "(فيزياء وكيمياء) أصغر مكون لعنصر يمتلك الخصائص الكيميائية للعنصر"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في جوهره لكنه يستخدم لفظ «مكوّن» الذي يفتقر إلى الدقة المعجمية؛
        المعاجم العربية تستعمل «جزء» أو «وحدة». كما يمكن تحسينه بإضافة قيد التفاعلات الكيميائية
        كما في المعجم الوسيط والمعاجم الموحدة.
    authored:
      - type: terminological
        text: "(فيزياء وكيمياء) أصغرُ جُزْءٍ من عُنْصُرٍ كِيمِيائِيٍّ يَدخُلُ في التَّفاعُلاتِ الكِيمِيائِيَّةِ مُحتفِظاً بخصائصِ ذلك العُنصُر"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "(فيزياء وكيمياء) أصغرُ وَحْدَةٍ بِنائِيَّةٍ للعُنصُرِ الكِيمِيائيّ، تتألَّفُ من نَواةٍ مُوجَبَةِ الشِّحنَةِ تحتوي على بُروتوناتٍ ونيوتروناتٍ، يُحيطُ بها غِلافٌ من الإلِكتروناتِ سالِبَةِ الشِّحنَة، وتحتفظُ بالخصائصِ الكيميائيَّةِ للعُنصُر"
    actions:
