# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10803215-n (winker — غَامِز)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (غَامِز)، وهي مجموعة فقيرة تحتاج إثراء محتمل"
      - "التعريف العربي (شخص يغمز بعينه) يستخدم نفس الجذر غ-م-ز مما قد يُعدّ دوراناً جزئياً"
    observations: "المفهوم بسيط ومباشر: اسم فاعل لمن يغمز بعينه. الجذر غ-م-ز غني بالمشتقات في العربية، والمعنى الأصلي (النخس والعصر باليد) امتدّ مجازياً إلى الإشارة بالعين. وزن فَاعِل هو الوزن الطبيعي لاسم الفاعل هنا. الفعل يَغْمِز من باب ضَرَبَ."
  blind_candidates:
    - lemma: "غَمَّاز"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من غَمَزَ على وزن فَعَّال، تدلّ على من يكثر الغمز بعينه. وزن فَعَّال من أوزان المبالغة المطّردة في العربية."
    - lemma: "رَمَّاز"
      generation_method: ishtiqaq
      justification: "من الجذر ر-م-ز (الإشارة والإيماء) على وزن فَعَّال. الرمز يشمل الإشارة بالعين والحاجب واليد، وقد يصلح للدلالة على الغامز."
    - lemma: "طَرَّاف"
      generation_method: ishtiqaq
      justification: "من الجذر ط-ر-ف المتعلق بالعين والجفن (طَرَفَ بعينه)، على وزن فَعَّال. يدلّ على من يكثر تحريك جفنيه."
    - lemma: "مُغَامِز"
      generation_method: ishtiqaq
      justification: "اسم فاعل من غَامَزَ (باب المفاعلة) على وزن مُفَاعِل، يدلّ على المشاركة في الغمز أو المبالغة فيه."

stage2_evidence:
  per_lemma:
    - lemma: "غَامِز"
      confirm:
        - text: "«غَامِز: من (غ م ز) الأعرج، والساعي باشر والطاعن، والمشير بعينه إلى الغير.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(غمزت) ... وفلاناً بالعين أو الجفن أو الحاجب أشار إليها بها ... فهو غامز وغماز»"
          source: "المعجم الوسيط"
        - text: "«غَمَزَهُ غَمْزًا من باب ضرب أشار إليه بعين أو حاجب»"
          source: "المصباح المنير للفيّومي"
        - text: "«غ م ز: غَمَزَ الشيء بيده وغَمَزَهُ بعينه. قال الله تعالى: {وإذا مروا بهم يتغامزون}»"
          source: "مختار الصحاح للرازي"
      expands:
        - text: "«(المغمز) العيب والمطعن يقال ما فيه مغمز لغامز (ج) مغامز»"
          source: "المعجم الوسيط"
          addition: "الغامز يُستعمل أيضاً بمعنى الطاعن والعائب، لا الإشارة بالعين فحسب"
        - text: "«غَامِز: الأعرج»"
          source: "موسوعة السلطان قابوس (معنى ثانٍ)"
          addition: "للغامز معنى آخر وهو الأعرج (من غمز الدابة في مشيه)"

    - lemma: "غَمَّاز"
      confirm:
        - text: "«(الغماز) مُبالغة الغامز»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«وهنة تشد في خيط الشص تطفو على سطح الماء فإذا غطست دلّت على علوق السمكة بالشص (محدثة) ومن الناي والمزمار ونحوهما مفتاح يقوم في سد الثقب مكان الإصبع (مج)»"
          source: "المعجم الوسيط"
          conflict: "المعاني الحديثة المحدثة للغمّاز تقنية (عوّامة صيد، مفتاح آلة موسيقية) وليست دلالة على شخص"
        - text: "«طبقاً للمواصفة القياسية الألمانية DIN 6260 هو جزء دليلي يقوم بنقل حركة الرفع...»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
          conflict: "في الاستعمال التقني الحديث الغمّاز قطعة ميكانيكية لا شخص"

    - lemma: "رَمَّاز"
      contradicts:
        - text: "«الرَّمَّازُ: الإيماء والإشارة»"
          source: "المعجم الوسيط"
          conflict: "الرمّاز في الوسيط مصدر أو اسم معنى (الإيماء والإشارة) لا اسم فاعل لشخص"
        - text: "«(رَمَزَ) الراء والميم والزاء أصل واحد يدل على حركة واضطراب»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "أصل الجذر ر-م-ز في الحركة والاضطراب العام، لا في الإشارة بالعين تحديداً"

    - lemma: "طَرَّاف"
      contradicts:
        - text: "«طَرَّاف: من (ط ر ف) من يكثر تحريك جفنيه والنظر إلى الشيء ومن يصرف الرجل عن الشيء.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الطرّاف يدلّ على تحريك الجفنين عموماً (الطرف) وليس على الغمز بالعين قصداً، والفرق بين الطرف اللاإرادي والغمز القصدي جوهري"

    - lemma: "مُغَامِز"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "غَامِز"
      decision: confirmed
      decision_reason: "اسم فاعل مطّرد من غَمَزَ يَغْمِزُ على وزن فَاعِل، مؤكَّد في موسوعة السلطان قابوس بمعنى «المشير بعينه إلى الغير» وفي المعجم الوسيط «فهو غامز». الوزن مناسب لاسم الفاعل البسيط والمفهوم (شخص يغمز)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: "وزن فَاعِل هو الوزن القياسي لاسم الفاعل من الثلاثي المجرد (باب ضَرَبَ)، مطابق تماماً للوظيفة الدلالية."

    - lemma: "غَمَّاز"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ المعجم الوسيط يذكر أنّ الغمّاز مبالغة الغامز، فإنّ المعاني الحديثة السائدة (عوّامة الصيد، مفتاح الآلة الموسيقية، القطعة الميكانيكية) طغت على الدلالة الأصلية. كما أنّ صيغة المبالغة تدلّ على من يكثر الغمز لا على مطلق الغامز، والمجموعة الترادفية تصف الفاعل البسيط لا المبالِغ."
      evidence_assessment:
        case: mixed

    - lemma: "رَمَّاز"
      source: stage1
      decision: removed
      decision_reason: "الرمّاز في المعجم الوسيط مصدر أو اسم معنى بمعنى الإيماء والإشارة، لا اسم فاعل لشخص. وأصل جذر ر-م-ز في الحركة والاضطراب العام لا في الغمز بالعين تحديداً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "طَرَّاف"
      source: stage1
      decision: removed
      decision_reason: "الطرّاف يدلّ على من يكثر تحريك جفنيه (الطَّرْف) وهو حركة لا إرادية أو نظر عام، بينما الغمز فعل قصدي إشاري. الفرق دلالي جوهري بين الطرف والغمز."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُغَامِز"
      source: stage1
      decision: removed
      decision_reason: "لا شواهد معجمية لهذه الصيغة. المغامزة لم تُسجَّل بمعنى الغمز بالعين، وباب المفاعلة يقتضي مشاركة لا تناسب مفهوم المجموعة."
      evidence_assessment:
        case: no_material

