stage5_enrichment:
  per_entry:
    - lemma: "غَامِز"
      entry_id: "{auto}"
      root: "غمز"
      maqayis_quote: "«الْغَيْنُ وَالْمِيمُ وَالزَّاءُ أَصْلٌ صَحِيحٌ، وَهُوَ كَالنَّخْسِ فِي الشَّيْءِ بِشَيْءٍ، ثُمَّ يُسْتَعَارُ. مِنْ ذَلِكَ: غَمَزْتُ الشَّيْءَ بِيَدِي غَمْزًا. ثُمَّ يُقَالُ: غَمَزَ، إِذَا عَابَ وَذَكَرَ بِغَيْرِ الْجَمِيلِ. وَالْمَغَامِزُ: الْمَعَايِبُ. وَفِي عَقْلِ فُلَانٍ غَمِيزَةٌ، كَأَنَّهُ يُسْتَضْعَفُ. وَمِمَّا يُسْتَعَارُ: غَمَزَ بِجَفْنِهِ: أَشَارَ. وَمِنْهُ: غَمَزَ الدَّابَّةُ مِنْ رِجْلِهِ، كَأَنَّهُ يَغْمِزُ الْأَرْضَ بِرِجْلِهِ.»"

  per_sense:
