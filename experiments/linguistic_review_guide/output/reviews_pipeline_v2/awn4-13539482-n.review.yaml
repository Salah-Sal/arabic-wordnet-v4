# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13539482-n
# multiprogramming / concurrent execution
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «برمجة متعددة» غير مسكوكة معجمياً ولا مصطلحياً؛ المقابل المعتمد في المعاجم هو «البرمجة التعاقبية» (المورد الحديث)"
      - "اللمّة «تنفيذ متزامن» تخلط بين التزامن (synchronism) والتساير (concurrency)؛ المقابل الدقيق هو «تنفيذ متساير» (معجم المعلوماتية)"
      - "كلتا اللمّتين الحاليتين ترجمة حرفية عمياء من الإنجليزية دون مراعاة الاصطلاح العربي المعتمد"
    observations: "المجموعة تغطي مفهوم تنفيذ أكثر من برنامج حاسوبي بواسطة حاسوب واحد. المصطلحان الحاليان يعانيان من مشكلتين: أولاً، «برمجة متعددة» مركب وصفي لا يدل على المفهوم التقني المراد بل يوحي بتعدد عمليات البرمجة لا تعدد البرامج المنفَّذة. ثانياً، «تنفيذ متزامن» يستخدم «متزامن» التي تعني synchronous في المعاجم المتخصصة، بينما المراد هو concurrent أي «متساير» اصطلاحاً."
  blind_candidates:
    - lemma: "تَعَدُّد البَرْمَجَة"
      generation_method: tarkib
      justification: "مركب إضافي يتبع النمط المنتج في مصطلحات الحوسبة العربية: تعدد المهمات (multitasking)، تعدد المعالجة (multiprocessing). يعبّر عن المفهوم بوضوح: تعدد = multi، البرمجة = programming"
    - lemma: "بَرْمَجَة تَعَاقُبِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يدل على أسلوب البرمجة القائم على التعاقب بين البرامج في استخدام المعالج؛ وزن تَفَاعُل يناسب دلالة التبادل والتناوب"
    - lemma: "تَنْفِيذ مُتَسَايِر"
      generation_method: tarkib
      justification: "مركب وصفي يقابل concurrent execution؛ «متساير» من السير المتوازي وهو المصطلح الدقيق للتمييز عن «متزامن» (synchronous)"
    - lemma: "مُوَاكَبَة"
      generation_method: ishtiqaq
      justification: "مصدر من واكَبَ على وزن مُفَاعَلة بمعنى المصاحبة والمجاراة؛ يوحي بتنفيذ البرامج جنباً إلى جنب"

stage2_evidence:
  per_lemma:
    - lemma: "بَرْمَجَة مُتَعَدِّدَة"
      evidence_status: "no_material_found"

    - lemma: "تَنْفِيذ مُتَزَامِن"
      contradicts:
        - text: "«التَّزَامُنُ (فى العمل السينمائى أو التليفزيونى) Synchronism: عمليةٌ فنيةٌ يُقْصَدُ بها ضبطُ الصوت مع الصورة, وتلازمهما معًا»"
          source: "المعجم الكبير"
          conflict: "التزامن يعني synchronism (ضبط التوافق الزمني) لا concurrency (التنفيذ المتساير)"
        - text: "«تَزَامَنَ الشَّيْئَانِ: اتَّفَقا فى الزَّمَنِ الشَّخْصان: عاشا فى زَمَنٍ واحِدٍ»"
          source: "المعجم الكبير"
          conflict: "التزامن مبني على الاتفاق في الزمن نفسه (synchronism)، بينما concurrent execution يعني التنفيذ المتداخل وليس بالضرورة في اللحظة نفسها"
      expands:
        - text: "«تنفيذ: آمرة تطلب من الحاسوب تنفيذ برنامج»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "يؤكد أن التنفيذ مصطلح حاسوبي معتمد بمعنى execution/running"

    - lemma: "تَعَدُّد البَرْمَجَة"
      expands:
        - text: "«تعدد المهمات: نمطُ عمليةٍ يقدّمها نظامُ التشغيل بحيث يَعمل الحاسوبُ على أكثر من مهمة في وقتٍ واحد.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يثبت إنتاجية نمط «تعدد + المضاف إليه» في مصطلحات الحوسبة لكنه يخص multitasking لا multiprogramming"
        - text: "«تعدد المعالجة: نمطُ عمليةٍ تعالِجُ ضمنه عدةُ وحدات معالجة مرتبطة ومتماثلة تقريباً إجرائيةً أو عدة إجرائيات»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يثبت نمط «تعدد + ...» لكنه يخص multiprocessing"

    - lemma: "بَرْمَجَة تَعَاقُبِيَّة"
      confirm:
        - text: "«البَرمجة التعاقبيّة (ألك).»"
          source: "المورد الحديث (2008)"

    - lemma: "تَنْفِيذ مُتَسَايِر"
      confirm:
        - text: "«تنفيذ متساير: تنفيذٌ متواقتٌ ظاهريٌّ لبرنامجين (أو مَساقَيْن routines) أو أكثر. يمكِن إنجازُ التنفيذِ المتساير بإجرائيةٍ مفردة أو باستخدام تقنيات اقتسام الزمن، كتقسيم البرامج إلى مهماتٍ أو نَيَاسِبَ threads مختلفة في التنفيذ، أو باستخدام معالجات متعددة.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«متساير؛ تسايري: صفةٌ لعمليةٍ حاسوبيةٍ تَملكُ فيها إجرائيتان (برنامجان) - أو أكثر - حقَّ إشغالِ زمن المعالج الصغري، ولذا تُنفَّذان في آنٍ واحد تقريباً.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يوضح أن التساير يعني التنفيذ شبه المتواقت لأكثر من إجرائية، وهو المقابل الدقيق لـ concurrent"

    - lemma: "مُوَاكَبَة"
      contradicts:
        - text: "«المُواكبة: تنفيذ أكثر من برنامج واحد، في الكومبيوتر، في وقتٍ واحد (ألك).»"
          source: "المورد الحديث (2008)"
          conflict: "المواكبة في المورد مقابل لـ multiprocessing لا multiprogramming، رغم تشابه التعريف"
      expands:
        - text: "«يُواكب [وبخاصة للحراسة والحماية]... المواكِبة؛ قافلة الحراسة»"
          source: "المورد الحديث (2008)"
          addition: "المعنى الأصلي للمواكبة هو المرافقة والمصاحبة، لا التنفيذ المتعدد"

