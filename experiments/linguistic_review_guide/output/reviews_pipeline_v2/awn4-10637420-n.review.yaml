# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10637420-n
# snuffer — شخص يطفئ الشموع
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (مُطْفِئ الشُّمُوع)، وهي تركيب إضافي وصفي يكاد يكون ترجمة حرفية للتعريف"
      - "المفهوم (شخص مهنته إطفاء الشموع) مفهوم تاريخي أوروبي نادر في الثقافة العربية"
      - "التعريف العربي الحالي مختصر جداً ولا يميّز بين الشخص والأداة"
    observations: >
      المجموعة تصف مهنة تاريخية كانت موجودة في الكنائس والقصور الأوروبية، حيث كان شخص مخصص
      يُطفئ الشموع بعد انتهاء القداس أو الحفل. في الثقافة العربية لا توجد مهنة مقابلة مستقلة،
      وإنما كان إطفاء الشموع جزءاً من مهام الخادم أو السادن. اللمّة الموجودة تركيب إضافي شفاف
      المعنى من الجذر طفأ (أطفأ → مُطْفِئ) مضافاً إلى الشموع. الجذر طفأ أصل صحيح في العربية
      يدل على خمود النار وذهاب اللهب.
  blind_candidates:
    - lemma: "مُخْمِدُ الشُّمُوعِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من اسم الفاعل مُخْمِد (من أَخْمَدَ الرباعي، بمعنى أَطْفَأَ وأسكنَ اللهب)
        مضافاً إلى الشُّمُوع. الإخماد مرادف للإطفاء في المعاجم العربية.
    - lemma: "طَفَّاءُ الشُّمُوعِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من صيغة المبالغة طَفَّاء (على وزن فَعَّال من طَفِئَ)
        مضافاً إلى الشُّمُوع، يدل على من يكثر إطفاء الشموع أو يحترف ذلك.
    - lemma: "نَافِخُ الشُّمُوعِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من اسم الفاعل نَافِخ (من نَفَخَ) مع الشُّمُوع.
        النفخ هو الوسيلة الشائعة لإطفاء الشموع، فالنافخ يطفئها بالنفخ عليها.
    - lemma: "سَادِنُ الشُّمُوعِ"
      generation_method: majaz
      justification: >
        مجاز مرسل: السادن هو خادم المعبد أو البيعة، وكان من مهامه العناية بالشموع
        وإطفاؤها. إزاحة دلالية من عموم السدانة إلى خصوص إطفاء الشموع.

stage2_evidence:
  per_lemma:
    - lemma: "مُطْفِئ الشُّمُوعِ"
      confirm:
        - text: "«مُطفِئة الشّموع: أداة لإطفاء الشّموع»"
          source: "المورد الحديث (2008)"
        - text: "«(2) مُطْفِئة الحريق أو الشموع»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«أَطْفَأَ فلانٌ نار الحرب, أو الفِتْنَةَ, أو نَحْوَهُما: طَفَّأَها»"
          source: "المعجم الكبير"
          addition: "يؤكد أن أَطْفَأَ (مصدر اسم الفاعل مُطْفِئ) فعل رباعي متعدٍّ يدل على إخماد النار واللهب"
        - text: "«النَّارُ ونحوها: هَمَدَتْ؛ أَى ذَهَبَ لَهَبُها وبَرَدَ جَمْرُها النورُ أو السِّراجُ: خمد»"
          source: "المعجم الكبير"
          addition: "يؤكد شمول الجذر طفأ لإطفاء السراج والنور عموماً، مما يشمل الشموع"
    - lemma: "مُخْمِدُ الشُّمُوعِ"
      evidence_status: "no_material_found"
    - lemma: "طَفَّاءُ الشُّمُوعِ"
      expands:
        - text: "«الطَّفاءُ من السُّحُبِ: الرَّقِيقُ الْمُتَفَرِّقُ لا يُمْطِر»"
          source: "المعجم الكبير"
          addition: "الطَّفَاء بمعنى السحاب الرقيق مأخوذ من الجذر طفو لا طفأ، فلا علاقة مباشرة بالإطفاء"
    - lemma: "نَافِخُ الشُّمُوعِ"
      evidence_status: "no_material_found"
    - lemma: "سَادِنُ الشُّمُوعِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُطْفِئُ الشُّمُوعِ"
      decision: confirmed
      decision_reason: >
        تركيب إضافي شفاف من اسم الفاعل مُطْفِئ (من أَطْفَأَ، باب الإفعال) مع الشُّمُوع.
        الجذر طفأ أصل صحيح مُوثّق في المعاجم الكلاسيكية والحديثة بمعنى إخماد النار واللهب.
        التركيب يتّفق مع نمط اسم الفاعل المضاف الشائع في العربية (حارس الأمن، سائق الحافلة).
        وجد دعم في المورد الحديث بصيغة المؤنث (مُطْفِئة الشموع) للأداة، مما يؤكد تداول الجذع التركيبي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "التركيب الوحيد في المجموعة؛ يدل على الشخص (لا الأداة) بصيغة المذكر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُطْفِئُ الشُّمُوعِ"
    - lemma: "مُخْمِدُ الشُّمُوعِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية على استعمال هذا التركيب. الإخماد يُستعمل عادةً مع النار والحريق
        لا مع الشموع. مُطْفِئ أكثر ملاءمة ودقة لسياق الشموع.
      evidence_assessment:
        case: no_material
    - lemma: "طَفَّاءُ الشُّمُوعِ"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة طَفَّاء على وزن فَعَّال من طَفِئَ اللازم مشكلة صرفياً، إذ يصعب بناء صيغة مبالغة
        متعدية من فعل لازم. كما أن الطَّفَاء ورد في المعاجم بمعنى السحاب الرقيق (من طفو لا طفأ).
      evidence_assessment:
        case: contradicts_only
    - lemma: "نَافِخُ الشُّمُوعِ"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب وصفي حُر وليس وحدة معجمية ثابتة. النفخ وسيلة واحدة فقط من وسائل الإطفاء
        وليس مرادفاً له. لم تُوجد أدلة معجمية على تداوله.
      evidence_assessment:
        case: no_material
    - lemma: "سَادِنُ الشُّمُوعِ"
      source: stage1
      decision: removed
      decision_reason: >
        السادن خادم المعبد عموماً ولا يختص بإطفاء الشموع. المجاز بعيد والتركيب غير مسكوك.
        لم تُوجد أدلة معجمية على استعماله بهذا المعنى.
      evidence_assessment:
        case: no_material

