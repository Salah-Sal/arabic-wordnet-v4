# مراجعة المجموعة الترادفية: awn4-13467563-n
# chemical process / chemical change / chemical action
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «عملية كيميائية» لم تُوثَّق في المعاجم المصطلحية (أرابتيرم) رغم شيوعها الاستعمالي"
      - "اللمّات الثلاث جميعها مركّبات وصفية من النمط ذاته (اسم + صفة نسبة)؛ لا يوجد مصطلح مفرد للمفهوم"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي"
    observations: "المجموعة تمثّل مفهوماً كيميائياً عاماً يشمل كل عملية تتحكّم فيها البنية الذرية والجزيئية. اللمّات الثلاث تغطّي الأبعاد الثلاثة للمفهوم: العملية (process) والتغيّر (change) والفعل (action). هذا التمييز دقيق: التغيُّر يركّز على الانتقال من حال إلى حال، والعملية تركّز على المسار الإجرائي، والفعل يركّز على التأثير. المفهوم مستقرّ في الاصطلاح العلمي العربي."

  blind_candidates:
    - lemma: "تَفَاعُلٌ كِيمِيَائِيٌّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «تفاعُل» (تَفَاعُل من فعل، باب المشاركة) و«كيميائي». شائع جداً في الأدبيات العلمية العربية، لكنه يدلّ على «التفاعل» (reaction) وهو أخصّ من «العملية» (process)"
    - lemma: "تَحَوُّلٌ كِيمِيَائِيٌّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «تحوُّل» (مصدر تحوَّلَ) و«كيميائي». يقابل chemical transformation، ويركّز على نتيجة التغيُّر في البنية الكيميائية"
    - lemma: "اسْتِحَالَةٌ كِيمِيَائِيَّةٌ"
      generation_method: tarkib
      justification: "مركّب وصفي من «استحالة» بمعنى التحوّل التدريجي (كما في كشّاف اصطلاحات الفنون) و«كيميائية». مصطلح تراثي لكنّ الاستعمال المعاصر حصر «استحالة» في معنى impossibility"
    - lemma: "صَيْرُورَةٌ كِيمِيَائِيَّةٌ"
      generation_method: tarkib
      justification: "مركّب وصفي من «صيرورة» (مصدر صار يصير) و«كيميائية». يفيد التحوّل والانتقال، لكنه غير مسكوك في المصطلح الكيميائي"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَغَيُّرٌ كِيمِيَائِيٌّ"
      confirm:
        - text: "«تغير كيميائي — change (chemical)»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«التغير: هو انتقال الشيء من حالة إلى حالة أخرى»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يؤكّد البُعد الدلالي للتغيُّر بوصفه انتقالاً بين حالتين"
        - text: "«التَّغَيُّر: من بَاب التفعل انْتِقَال الشَّيْء من حَالَة إِلَى حَالَة أُخْرَى»"
          source: "دستور العلماء للأحمدنكري"
          addition: "تأكيد إضافي لدلالة الانتقال"
        - text: "«اختلاف التركيب الكيميائي أو الفيزيائي أو كليهما للصخر أو المعدن الأصلي»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "يوسّع المفهوم ليشمل التغيُّر الفيزيائي أيضاً في السياق الجيولوجي"

    - lemma: "عَمَلِيَّةٌ كِيمِيَائِيَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "فِعْلٌ كِيمِيَائِيٌّ"
      confirm:
        - text: "«فعل كيميائي — chemical action»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«فعل كيميائي — chemical action»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      expands:
        - text: "«الفِعْل: كناية عن كل عمل متعدٍّ أو غير متعدٍّ»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "يبيّن شمولية «الفعل» لكل عمل وتأثير"
        - text: "«الفعل: هو الهيئة العارضة للمؤثر في غيره بسبب التأثير»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يربط الفعل بمفهوم التأثير في الغير، وهو ما يناسب الفعل الكيميائي"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "تَفَاعُلٌ كِيمِيَائِيٌّ"
      confirm:
        - text: "«تفاعل كيميائي — chemical reaction»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«التفاعل الكيميائيّ — chemical reaction»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«chemical reaction» وليس «chemical process»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "التفاعل الكيميائي أخصّ من العملية الكيميائية؛ هو نوع منها وليس مرادفاً لها"

    - lemma: "تَحَوُّلٌ كِيمِيَائِيٌّ"
      confirm:
        - text: "«تحوّل كيميائي — chemical transformation»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      contradicts:
        - text: "«عملية يتمّ من خلالها إمّا تحويل المواد الخطِرة على البيئة إلى مُركّبات أقل خطورة...»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "التعريف يحصر التحوّل الكيميائي في معالجة المواد الخطرة بيئياً، وهو أضيق من المفهوم العام"

    - lemma: "اسْتِحَالَةٌ كِيمِيَائِيَّةٌ"
      contradicts:
        - text: "«استحالة — impossibility»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الاستعمال المعاصر الغالب لـ«استحالة» هو عدم الإمكان، لا التحوّل"
      expands:
        - text: "«اسْتِحَالَة — metamorphosis»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "في السياق الطبي تُستعمل بمعنى التحوّل، لكنها غير مألوفة في الكيمياء"

    - lemma: "صَيْرُورَةٌ كِيمِيَائِيَّةٌ"
      evidence_status: "no_material_found"

