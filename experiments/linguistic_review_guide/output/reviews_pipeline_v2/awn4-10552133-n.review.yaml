# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10552133-n (riser)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «مُسْتَيْقِظ» تدل على حالة اليقظة لا على فعل النهوض من الفراش، فثمة فرق دلالي بين الاستيقاظ (الخروج من النوم) والنهوض (القيام من المكان)"
      - "لمّة «نَاهِض» مشتركة لفظياً: تطلق على فرخ الطائر وعلى لحم العضد، وقد يُلبس استعمالها بمعنى النَّاهض من الفراش"
      - "المجموعة الترادفية مرتبطة بمفهوم hypernym عَامِل/فَاعِل وهو عام جداً، والمفهوم بسيط لا يستدعي تعقيداً"
    observations: "المفهوم المقصود هو الشخص الذي ينهض، وخاصة من فراشه. في العربية يُعبَّر عن هذا بصيغ اشتقاقية من جذر «ن هـ ض» بالدرجة الأولى. أما الاستيقاظ فمرحلة سابقة للنهوض، إذ يمكن أن يستيقظ المرء ولا ينهض. الصيغ الأنسب هي اسم الفاعل «نَاهِض» وصيغة المبالغة «نَهَّاض» التي تفيد التكرار والمداومة."

  blind_candidates:
    - lemma: "نَهَّاض"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من جذر «ن هـ ض» تفيد كثرة النهوض والمداومة عليه، وهي أنسب من اسم الفاعل لأنها تدل على السمة الملازمة لا الحدث الآني"
    - lemma: "قَوَّام"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من جذر «ق و م» بمعنى كثير القيام، إذ القيام من الفراش قيامٌ"
    - lemma: "بَكُور"
      generation_method: ishtiqaq
      justification: "على وزن فَعُول من جذر «ب ك ر» بمعنى من يُبكّر في النهوض، وهي صفة مشبهة تدل على الثبوت"
    - lemma: "يَقْظَان"
      generation_method: ishtiqaq
      justification: "على وزن فَعْلان من جذر «ي ق ظ» تدل على من يستيقظ وينهض من نومه"


stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَيْقِظ"
      confirm:
        - text: "«(1) المستيقظ من النوم an early riser»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) يستيقظ (2) يَنْهَض (3) يَعي؛ يُدْرِك ... (6) يَقْظان (7) متنبِّه؛ يقِظ؛ واعٍ»"
          source: "المورد الحديث (2008) — مادة awake"
          addition: "يبيّن أن الاستيقاظ والنهوض مفهومان متلازمان في الترجمة الإنجليزية لكنهما مختلفان في العربية"

    - lemma: "نَاهِض"
      confirm:
        - text: "«نَاهِض: من (ن ه ض) القائم اليقظ النشيط، والمسرع لملاقاة العدو، وفرخ الطائر الذي قدر على الطيران، واللحم الذي يلي العضد من أعلاه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الناهض: الجاد في الأمر، المشمر له»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«فرخ الطَّائر الذي قدر على الطَّيَرَان. اللَّحمُ الذي يلى العَضُدَ من أعلاه»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي للناهض في المعاجم هو فرخ الطائر المتهيئ للطيران، ثم توسع مجازياً إلى الشخص القائم النشيط"
        - text: "«عاملٌ ناهِضٌ: ماض في عمله بعزيمة صادقة. شباب ناهض: يقظٌ مهمٌّ بالقيام بواجباته»"
          source: "المعجم الوسيط (أمثلة)"
          addition: "يُستخدم وصفاً للنشاط والهمة أكثر من كونه اسماً لمن ينهض من الفراش"

    - lemma: "نَهَّاض"
      confirm:
        - text: "«النَّهَّاضُ: الدَّئُوب على أن يسلك سبيل التقدّم. الكثير النهوض»"
          source: "المعجم الوسيط"
      expands:
        - text: "«مكان نَهَّاض: مرتفع»"
          source: "المعجم الوسيط (مثال)"
          addition: "تُستعمل أيضاً وصفاً للمكان المرتفع، مما يؤكد دلالة الارتفاع والعلو في الصيغة"

    - lemma: "قَوَّام"
      contradicts:
        - text: "«القَوَّامُ: الحَسَن القامة. الحسن القيام بالأمور»"
          source: "المعجم الوسيط"
          conflict: "الدلالة المعجمية لقَوَّام هي حُسن القامة وحُسن القيام بالأمور (الإدارة)، لا القيام من الفراش"
        - text: "«القِوَامُ: قِوام كل شىء: عماده ونظامه. ما يُقِيم الإنسانَ من القُوت»"
          source: "المعجم الوسيط"
          conflict: "مادة «قوم» في المعاجم تدور حول الاستقامة والإدارة والقوت، لا حول النهوض من النوم"

    - lemma: "بَكُور"
      contradicts:
        - text: "«البَكُور: من النخل: التي تُبَكِّر بحملها. من الغيث: المُبَكِّر الذى جاء في أوّل الوَسْمي. من الناس: السارى في آخر الليل وأوّل النهار»"
          source: "المعجم الكبير"
          conflict: "بَكُور صفة للتبكير في الزمن (نخلة مبكرة الثمر، غيث مبكر، سارٍ مبكر) وليست اسماً لمن ينهض من الفراش. كما أنها مصنفة صفةً (adj) لا اسماً"

    - lemma: "يَقْظَان"
      contradicts:
        - text: "«اليَقْظَانُ: اليقِظ»"
          source: "المعجم الوسيط"
          conflict: "يَقْظان تعني المتنبه المتيقظ وهي حالة ذهنية لا فعل جسدي. يمكن أن يكون المرء يقظان وهو مضطجع في فراشه"
      expands:
        - text: "«رجل يَقْظان الفكر»"
          source: "المعجم الوسيط (مثال)"
          addition: "الاستعمال الشائع ليقظان مع الفكر يؤكد أن الدلالة ذهنية لا جسدية"


stage3_analysis:
  per_lemma:
    - lemma: "مُسْتَيْقِظ"
      decision: confirmed
      decision_reason: "اسم فاعل من «استيقظ» يدل على من خرج من النوم. وإن كان الفرق بين الاستيقاظ والنهوض قائماً في العربية، فإن المورد الحديث يترجم riser بـ«المستيقظ من النوم»، والاستعمال المعاصر يجعل مستيقظاً قريباً من المعنى المراد. يبقى في المجموعة مع بيان الفارق الدلالي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركز على الانتقال من حالة النوم إلى حالة اليقظة (البعد الذهني)، بينما نَاهِض يركز على الفعل الجسدي وهو القيام من المكان"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَيْقِظ"

    - lemma: "نَاهِض"
      decision: confirmed
      decision_reason: "اسم فاعل من «نهض» بمعنى القائم من مكانه. دلالته على النهوض الجسدي مباشرة وثابتة في المعاجم. وإن كان المعنى الأصلي في المعاجم فرخَ الطائر، فإن التوسع المجازي إلى الشخص القائم النشيط مستقر ومستعمل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركز على الفعل الجسدي وهو القيام والنهوض من المكان (خاصة الفراش)، ويحمل دلالة إضافية على النشاط والهمة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَاهِض"

    - lemma: "نَهَّاض"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة مبالغة ثابتة في المعجم الوسيط بمعنى «الكثير النهوض» و«الدؤوب على سلوك سبيل التقدم». تُضيف بعداً دلالياً مميزاً وهو التكرار والمداومة على النهوض، مما يجعلها أنسب لوصف من يُعرف بالنهوض المبكر أو المتكرر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تفيد صيغة المبالغة (فَعَّال) كثرة النهوض ومداومته، فهي للسمة الثابتة والعادة المتكررة، بخلاف نَاهِض الذي يصف الحدث الآني"
      actions:
        - command: create_entry
          params: {lemma: "نَهَّاض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "قَوَّام"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تثبت أن قَوَّام بمعنى حسن القامة وحسن القيام بالأمور (الإدارة)، لا بمعنى من ينهض من فراشه. لا صلة دلالية حقيقية بالمجموعة الترادفية."

    - lemma: "بَكُور"
      source: stage1
      decision: removed
      decision_reason: "بَكُور صفة تدل على التبكير في الزمن (نخلة أو سحابة أو إنسان يُبكّر)، وهي مصنفة صفةً لا اسماً. لا تدل على النهوض من الفراش تحديداً بل على الإتيان في وقت مبكر."

    - lemma: "يَقْظَان"
      source: stage1
      decision: removed
      decision_reason: "يَقْظان تعني المتنبه المتيقظ وهي حالة ذهنية. الفرق بينها وبين من ينهض واضح: يمكن أن يكون المرء يقظان وهو في فراشه. كما أن المعجم الوسيط لا يذكر لها دلالة على القيام الجسدي."


