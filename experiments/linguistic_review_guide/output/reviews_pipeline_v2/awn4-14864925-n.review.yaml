            entry_id: "{auto}"
            new_lemma: "عُنْصُر"

    - lemma: "أُسْطُقُسّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معرّب مستقرّ في التراث الفلسفي والطبي العربي، مثبت في المعجم الوسيط والمعجم الكبير وكشاف التهانوي والتعريفات للجرجاني. تعريفه يطابق تعريف المجموعة تماماً: إحدى أربع مواد أوّلية. رغم أنه معرّب فإنه أقدم في الاستعمال الاصطلاحي من «عنصر» ولا بديل عربي صرف يحلّ محلّه في هذا السياق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح فلسفي-طبي تراثي معرّب من اليونانية، يُستعمل حصراً في سياق الفلسفة الطبيعية القديمة والطب العربي الكلاسيكي، ولا يمتدّ إلى الاستعمال العلمي الحديث بخلاف «عنصر»"
      actions:
        - command: create_entry
          params:
            lemma: "أُسْطُقُسّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رُكْن"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود استعمال «الركن» بمعنى العنصر في النصوص الفلسفية والطبية القديمة، فإنّ هذا الاستعمال مقيّد باصطلاح خاصّ ولا يُفهم خارج سياقه. المعنى الأساسي للركن (الجانب القوي، الدعامة، الركيزة) مهيمن في اللغة العامة والمعاصرة، وإضافته إلى المجموعة ستولّد التباساً شديداً. كما أن الأدلة المعجمية مختلطة: التهانوي يؤكد التخصيص الطبي لكنّ المعاجم اللغوية لا تذكر هذا المعنى."
      evidence_assessment:
        case: mixed

    - lemma: "أُسّ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تدعم استعمال «أُسّ» بمعنى العنصر الطبيعي. اللفظ يدلّ على الأساس والقاعدة بوجه عام، ولم يُخصَّص في أيّ معجم للدلالة على العناصر الأربعة."
