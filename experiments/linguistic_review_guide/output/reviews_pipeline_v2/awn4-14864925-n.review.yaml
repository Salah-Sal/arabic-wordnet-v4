# AWN4 Review — awn4-14864925-n (element — العناصر الأربعة الكلاسيكية)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عنصر» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "لا توجد لمّة للمصطلح الكلاسيكي اليوناني المعرّب «أُسْطُقُسّ» المستعمل في التراث الفلسفي والطبي العربي"
      - "التعريف العربي ترجمة حرفية من الإنجليزية — يحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المجموعة تدلّ على مفهوم العناصر الأربعة في الكوزمولوجيا القديمة (النار والهواء والماء والتراب)، وهو مفهوم راسخ في التراث العلمي العربي الإسلامي. استعمل العرب لهذا المفهوم ألفاظاً عدّة أبرزها: العنصر، والأسطقس، والركن. المجموعة تحتاج إثراء بمصطلحات التراث الفلسفي."
  blind_candidates:
    - lemma: "عُنْصُر"
      generation_method: ishtiqaq
      justification: "من الجذر ع ن ص ر بمعنى الأصل، اللفظ العربي الأساسي للدلالة على المادة الأوّلية التي تتألف منها الأجسام، شائع في النصوص الفلسفية والعلمية"
    - lemma: "أُسْطُقُسّ"
      generation_method: taarib
      justification: "معرّب من اليونانية στοιχεῖον بمعنى الأصل، اصطلاح مستقرّ في الفلسفة الإسلامية والطب العربي للدلالة على كل واحد من العناصر الأربعة، مثبت في المعاجم الكبرى"
    - lemma: "رُكْن"
      generation_method: majaz
      justification: "إزاحة دلالية من معنى الجانب القوي إلى الجزء الأوّلي الذي يتركب منه الجسم، استعمله الأطباء والفلاسفة المسلمون مرادفاً للعنصر"
    - lemma: "أُسّ"
      generation_method: ishtiqaq
      justification: "من الجذر أ س س بمعنى الأساس والقاعدة، يمكن أن يدلّ على المادة الأصلية التي يُبنى عليها المركّب"

stage2_evidence:
  per_lemma:
    - lemma: "عُنْصُر"
      confirm:
        - text: "«العنصر: الأصل الذي تتألف منه الأجسام المختلفة الطابع، وهي أربعة: الأرض، والماء، والنار، والهواء»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العنصر: في اللغة العربية الأصل كالأسطقس في اللغة اليونانية وهو الأصل الذي يتألف منه الأجسام المختلفة الطبائع»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«(العنصر) الأصل والحسب ... و(في الكيمياء) مادة أولية لا يمكن تحليلها كيماوياً إلى ما هو أبسط منها ... والعناصر (عند القدماء) أربعة وهي النار والهواء والماء والتراب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«العنصر: بضم العين والصاد وفتحهما بينهما نون في اللغة الأصل جمعه العناصر، وتسمّى أيضا بالأمهات والأسطقسات والمواد والأركان»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«العُنْصُرُ: ابتداء تركيب الشيء»"
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "«(الْعُنْصُرُ): أَصْلُ الْحَسَبِ، وَهَذَا مِمَّا زِيدَتْ فِيهِ النُّونُ، وَهُوَ فِي الْأَصْلِ الْعَصَرُ، وَهُوَ الْمَلْجَأُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الكلمة اللغوي وعلاقتها بالعَصَر (الملجأ)"
        - text: "«العُنْصُرُ، بفتح الصادِ وضمها: الدَّاهِيةُ، والهمَّةُ، والحاجةُ، وذُكِرَ في ع ص ر»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "دلالات لغوية أخرى غير الاصطلاحية"

    - lemma: "أُسْطُقُسّ"
      confirm:
        - text: "«(الأسطقس) الأصل البسيط يتكون منه المركب والأسطقسات العناصر الأربعة عند القدماء وهي الماء والهواء والنار والتراب (مع)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الأصل البسيط يتكون منه المركب. الأسْطُقُسَّات: العناصر الأربعة عند القدماء؛ وهي الماء والهواء والنار والتراب. (مع)»"
          source: "المعجم الوسيط"
        - text: "«الأصل. الشيء البسيط يتكون منه المركب ويُسمى العنصر, والركن»"
          source: "المعجم الكبير"
        - text: "«الاسطقس: عبارة عن إحدى أربع طبائع»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«أسطقس: هو لفظ يوناني بمعنى الأصل، وتسمّى العناصر الأربع التي هي الماء والأرض والهواء والنار أسطقسات لأنها أصول المركبات التي هي الحيوانات والنباتات والمعادن»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الاسطقسات: لفظ يوناني، بمعنى الأصل، وتسمى العناصر الأربع؛ التي هي الماء والأرض والهواء والنار، اسطقسات؛ لأنه أصول المركبات»"
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: "«إِسْطُقِسُ: وهذا الضبط في معجم فريتاج، وضبطت في معجم فوك: أُسْطُقُسَ وتجمع على اسطقسات في معجم الكالا (العناصر) وهو يذكر أُسْطُقس مقابل: elementel»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "تعدد أوجه الضبط: إسطقس / أسطقس / أسطقسّ"
        - text: "«الإسطقس: منتهى تحليل الشيء»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "تعريف بالتحليل: ما ينتهي إليه تحليل المركبات"

    - lemma: "رُكْن"
      confirm:
        - text: "«الرّكن: لكن الأطباء خصّصوه بإحدى العناصر الأربع. فالأركان عندهم أجسام بسيطة هي أجزاء أوّلية للمواليد الثلاثة أي الحيوانات والنباتات والمعدنيات»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الأجسام المختلفة الطبائع ... يقال لها باعتبار أنها أجزاء للمركبات: أركان؛ إذ ركن الشيء هو جزؤه»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«هذه الأربعة تسمى بأربعة أسماء: العناصر والاسطقسات والأركان وأصول الكون والفساد»"
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: "«(الرُّكْن) أحد الجوانب التي يستند إليها الشيء ويقوم بها وجزء من أجزاء حقيقة الشيء ... والأمر العظيم وما يتقوى به من ملك وجند»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعنى الأساسي للركن هو الجانب القوي والدعامة، واستعماله بمعنى العنصر مقصور على الاصطلاح الفلسفي والطبي القديم"
        - text: "«(رَكَنَ) الرَّاءُ وَالْكَافُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى قُوَّةٍ. فَرُكْنُ الشَّيْءِ: جَانِبُهُ الْأَقْوَى»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدل على القوة والجانب، لا على الأصل البسيط"

    - lemma: "أُسّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عُنْصُر"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل، شائع الاستعمال في النصوص الفلسفية والعلمية والمعاصرة، مثبت في جميع المعاجم الكبرى بدلالة العنصر الطبيعي الأوّلي. هو اللفظ الأولّ عند العرب للدلالة على هذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ العربي الأصيل الشائع للدلالة على المادة الأوّلية، يُستعمل في السياقات العلمية والعامة على حدٍّ سواء، ويمتدّ استعماله المعاصر إلى الكيمياء الحديثة"
