    - lemma: "ضَحِيَّة"
      decision: confirmed
      decision_reason: "لفظ فصيح مستعمل بمعنى من يقع عليه ضرر من خداع أو جريمة أو حادث. ثابت في المعجم الكبير والمعاجم الحديثة. دلالته أعمّ من المجموعة لكنه يشملها."
