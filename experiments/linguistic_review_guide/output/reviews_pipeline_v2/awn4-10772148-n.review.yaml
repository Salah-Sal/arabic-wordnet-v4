# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10772148-n
# victim, dupe — ضحية، مغفل
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «ضحية» عامة جداً وتشمل ضحايا الحوادث والجرائم والجوائح، وليست مخصصة لمن يُخدَع أو يُحتال عليه"
      - "لمّة «مغفل» تصف صفة ملازمة (انعدام الفطنة) لا حدثاً وقع على الشخص، فهي تُركّز على طبيعة الشخص لا على كونه ضحية خداع"
      - "كلتا اللمّتين بدون تشكيل كامل"
    observations: "المجموعة تصف شخصاً وقع عليه فعل الخداع أو الاحتيال. اللمّتان الموجودتان تمثّلان بُعدين مختلفين: «ضحية» تُركّز على نتيجة الفعل (الوقوع ضحيةً)، و«مغفل» تُركّز على صفة الشخص التي سهّلت خداعه. يحتاج المجموعة إلى لمّة تدلّ مباشرة على من وقع عليه فعل الخداع، كـ«مخدوع» أو «غِرّ»."
  blind_candidates:
    - lemma: "مَخْدُوع"
      generation_method: ishtiqaq
      justification: "اسم مفعول من «خَدَعَ» على وزن مَفْعُول، يدلّ مباشرة على من وقع عليه فعل الخداع، وهو أقرب الألفاظ إلى مفهوم المجموعة"
    - lemma: "مَغْبُون"
      generation_method: ishtiqaq
      justification: "اسم مفعول من «غَبَنَ» على وزن مَفْعُول، يدلّ على من اهتُضِم في بيعه أو رأيه، فيه معنى الخداع مع التركيز على الخسارة المالية"
    - lemma: "غِرّ"
      generation_method: majaz
      justification: "لفظ عربي كلاسيكي من جذر «غرر» يعني من ينخدع إذا خُدِع، وردت في المعاجم الكلاسيكية بهذا المعنى تحديداً، وهو إحياء للفظ تراثي دقيق الدلالة"
    - lemma: "مُسْتَغْفَل"
      generation_method: ishtiqaq
      justification: "اسم مفعول من «اسْتَغْفَلَ» على وزن مُسْتَفْعَل، يدلّ على من استُغِلّت غفلته للإيقاع به، يجمع بين الغفلة وفعل الاستغلال الواقع عليه"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "ضَحِيَّة"
      confirm:
        - text: "«مَنْ يُلْقى مَصرَعَه في حادثٍ, أو جريمةٍ, أو جائحةٍ»"
          source: "المعجم الكبير"
        - text: "«(1) ضحيّة (2) الأُضْحِيّة البشريّة [في بعض الطقوس البدائيّة]»"
          source: "المورد الحديث (victim)"
        - text: "«الشخص المتضرر من جريمة سواء كان الضرر اللاحق به جسمانيا أو ماديا أومعنويا»"
          source: "المعجم الموحد لمصطلحات القانون (crime victim)"
      expands:
        - text: "«الضُّحَى والأُضحيَّة (ج) ضحايا»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية هي الأضحية (ما يُذبح)، والمعنى الحديث (ضحية حادث/جريمة) توسّع دلالي"
        - text: "«بخلاف العامل، تشكل الضحية الكائن الحي أو الشيء الذي يقع عليه العمل (الحدث)»"
          source: "المعجم الموحد لمصطلحات اللسانيات (Patient)"
          addition: "في علم اللسانيات، الضحية هي الدور الدلالي المقابل للعامل (الفاعل)"

    - lemma: "مُغَفَّل"
      confirm:
        - text: "«(الْمُغَفَّل) من لَا فطنة لَهُ»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«من لا فِطْنة له»"
          source: "المعجم الوسيط (OCR)"
        - text: "«مُغَفَّل — الجذر: غ ف ل — الصواب والرتبة: كان مُغَفَّلا فسرقته اللصوص [فصيحة] — التعليق: الكلمة فصيحة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«(1) السّاذَج؛ المُغَفَّل (2) يَخْدَع»"
          source: "المورد الحديث (dupe)"
      expands:
        - text: "«(1) المجنون؛ المغفَّل (2) «أ» مهرِّج البلاط. «ب» الساذج المخدوع»"
          source: "المورد الحديث (fool)"
          addition: "المغفّل يُستخدم مرادفاً للأحمق والأبله في سياقات عديدة، ما يوسّع دلالته عن مجرد ضحية الخداع"

    - lemma: "مَخْدُوع"
      confirm:
        - text: "«غَرَّه يغُرّه غَرّاً وغُرُوراً ... فَهُوَ مَغرور وغَرير: خَدعه وأطعمه بالباطل»"
          source: "المحكم والمحيط الأعظم لابن سيده"
        - text: "«(1) مُضْطَهَد (2) مخدوع؛ مُحتالٌ عليه»"
          source: "المورد الحديث (victimized)"
        - text: "«الساذج المخدوع»"
          source: "المورد الحديث (fool — المعنى ٢ب)"
      expands:
        - text: "«خَدَعَ — الْخَاءُ وَالدَّالُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ ... الْإِخْدَاعُ إِخْفَاءُ الشَّيْءِ ... خَدَعْتُ الرَّجُلَ خَتَلْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدور على إخفاء الشيء، فالمخدوع من أُخفِي عنه الحقيقة"

    - lemma: "مَغْبُون"
      confirm:
        - text: "«غَبَنَ — الْغَيْنُ وَالْبَاءُ وَالنُّونُ كَلِمَةٌ تَدُلُّ عَلَى ضَعْفٍ وَاهْتِضَامٍ. يُقَالُ غُبِنَ الرَّجُلُ فِي بَيْعِهِ فَهُوَ يُغْبَنُ غَبْنًا وَذَلِكَ إِذَا اهْتُضِمَ فِيهِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«غَبَنَ — كَلِمَةٌ تَدُلُّ عَلَى ضَعْفٍ وَاهْتِضَامٍ ... غُبِنَ الرَّجُلُ فِي بَيْعِهِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الغبن مخصص بالبيع والشراء والمعاملات المالية، وليس عامّاً في كل خداع"

    - lemma: "غِرّ"
      confirm:
        - text: "«من ينخدع إذا خُدِع [للذكر والأنثى]»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الشاب الذي لم يجرب الأمور مع حداثة السن — المؤمن اللين المنقاد الذي ينخدع لكرمه»"
          source: "كتاب العين (OCR)"
        - text: "«غِرّ — من (غ ر ر) من ينخدع بسهولة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الرجلُ - غَرارة, وغِرَّةً: جَهِل الأمور وغفل عنها ... الرجل: كان ذا غفلة وقلة فطنة»"
          source: "المعجم الوسيط (غرّ)"
      expands:
        - text: "«غَرَّ — الْغَيْنُ وَالرَّاءُ أُصُولٌ ثَلَاثَةٌ صَحِيحَةٌ: الْأَوَّلُ الْمِثَالُ، وَالثَّانِي النُّقْصَانُ، وَالثَّالِثُ الْعِتْقُ وَالْبَيَاضُ وَالْكَرَمُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الثاني (النقصان) هو المعنى المرتبط بالغِرّ: نقصان التجربة والخبرة"

    - lemma: "مُسْتَغْفَل"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي ────────────────────────────────
stage3_analysis:
  per_lemma:
