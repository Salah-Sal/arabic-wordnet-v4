    - lemma: "مَغْبُون"
      source: stage1
      decision: removed
      decision_reason: "الغبن مخصّص بالاهتضام في البيع والشراء والمعاملات المالية حسب مقاييس اللغة، ولا يشمل الخداع العام. لا يناسب المفهوم العام للمجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "مُسْتَغْفَل"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تدعم هذا اللفظ بوصفه اسماً مستقلاً. الصيغة مولّدة لكنها غير مسكوكة معجمياً."
