      nuance_differentiation: "يُركّز على كون الشخص متضرراً من فعل وقع عليه، بصرف النظر عن طبيعته الشخصية. أعمّ من أخواته إذ يشمل ضحايا الحوادث والكوارث فضلاً عن الخداع."
