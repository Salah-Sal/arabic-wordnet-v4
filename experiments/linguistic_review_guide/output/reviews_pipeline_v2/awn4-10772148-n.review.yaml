            new_lemma: "مُغَفَّل"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَخْدُوع"
      source: stage1
      decision: confirmed
      decision_reason: "اسم مفعول من «خدع» يدلّ مباشرة على من وقع عليه فعل الخداع. ورد في المورد الحديث بمعنى victimized (مخدوع؛ محتال عليه)، وفي المحكم بصيغة «مغرور» المرادفة. يسدّ فجوة دلالية في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على حالة ناتجة عن فعل الخداع الذي وقع فعلاً على الشخص. أخصّ من «ضحية» وأكثر ارتباطاً بالحدث من «مغفّل» الذي يصف صفة ملازمة."
      actions:
        - command: create_entry
          params: {lemma: "مَخْدُوع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "غِرّ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي ثابت في المعجم الوسيط وكتاب العين بمعنى «من ينخدع إذا خُدِع». يُحيي لفظاً كلاسيكياً دقيق الدلالة ويُثري المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على من يسهل خداعه بسبب قلة تجربته وحداثة سنّه أو طيبته، مع تأكيد الطابع الفطري لهذه الصفة. أقرب إلى gullible person منه إلى victim."
