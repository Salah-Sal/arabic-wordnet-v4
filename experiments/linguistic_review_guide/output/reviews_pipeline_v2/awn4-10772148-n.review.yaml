    - lemma: "مُغَفَّل"
      decision: confirmed
      decision_reason: "لفظ فصيح ثابت في المعجم الوسيط بمعنى «من لا فطنة له»، وأكّد معجم الصواب اللغوي فصاحته. يُستخدم في المورد الحديث ترجمةً لـ dupe."
