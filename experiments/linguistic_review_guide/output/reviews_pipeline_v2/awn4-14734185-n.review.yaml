# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14734185-n (denaturant)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم مصطلح «الفسخ» بين قوسين، وهو غير صحيح في هذا السياق؛ الفسخ في العربية يعني النقض والإلغاء (فسخ العقد)، بينما المقصود هنا التمسُّخ (denaturation) من جذر م س خ"
      - "اللمّة «مادة مفسدة» عامة جداً ولا تدلّ تحديداً على التمسُّخ الكيميائي بل على الإفساد العام"
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل"
      - "لا يوجد في المجموعة المصطلح المعتمد «مُمَسِّخ» الوارد في المعجم الطبي الموحد"
    observations: "المجموعة تصف المادة التي تُحدِث التمسُّخ (denaturation)، أي تغيير البنية الطبيعية للبروتينات أو الكحول. الجذر العربي الأنسب هو م س خ الذي يدلّ على تحويل الصورة وتشويه الخلقة، وقد استُعمل في المصطلحية العلمية الحديثة للدلالة على denaturation. اللمّة «عامل مسخ» مركب إضافي مقبول بنيوياً لكنه ليس مسكوكاً في المعاجم المتخصصة بقدر «مُمَسِّخ»."

  blind_candidates:
    - lemma: "مُمَسِّخ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من مَسَّخَ (فعّل) على وزن مُفَعِّل، يدلّ على الفاعل الذي يُحدِث المسخ/التمسُّخ. الوزن مُفَعِّل منتج للدلالة على المُسبِّب، والجذر م س خ يدلّ على تحويل الصورة وتغيير الطبيعة."
    - lemma: "مَادَّة مَاسِخَة"
      generation_method: tarkib
      justification: "مركب وصفي: مادّة + اسم فاعل من مَسَخَ (فعل ثلاثي)، أي المادة التي تمسخ البنية الطبيعية. نمط إنتاجي في المصطلحية الكيميائية (مادة مؤكسدة، مادة مختزلة)."
    - lemma: "عَامِل تَمَسُّخ"
      generation_method: tarkib
      justification: "مركب إضافي: عامل + تمسُّخ (مصدر تفعُّل). يوازي التركيب الإنجليزي denaturing agent. التمسُّخ مصطلح معتمد في عدة معاجم موحدة للدلالة على denaturation."
    - lemma: "مُغَيِّرُ الطَّبِيعَة"
      generation_method: tarkib
      justification: "مركب إضافي: اسم فاعل من غيَّر + الطبيعة. ترجمة تفسيرية للمفهوم (de-naturant = مُغيِّر الطبيعة). أقرب إلى الشرح منه إلى المصطلح، لكنه قد يصلح بديلاً توضيحياً."


stage2_evidence:
  per_lemma:
    - lemma: "عَامِل مَسْخ"
      evidence_status: "no_material_found"

    - lemma: "مَادَّة مُفْسِدَة"
      contradicts:
        - text: "«مفسد — pernicious»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
          conflict: "ترجمة مفسد في المعجم هي pernicious (ضارّ/خبيث) وليس denaturant؛ الدلالة مختلفة تماماً"

    - lemma: "مُمَسِّخ"
      confirm:
        - text: "«مُمَسِّخ — denaturant — dénaturant»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«تَمَسُّخ — عملية تؤدي إلى تغير صفات بعض المركبات الكيميائية العضوية واللاعضوية — denaturation»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يؤكد أن جذر مسخ هو الجذر المعتمد في المصطلحية العلمية العربية للدلالة على denaturation"
        - text: "«تَمَسُّخ، تحوُّل الصفات — تغيُّر في الصفات الطبيعية لشكل البروتين — denaturation»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "يُوسّع الدلالة لتشمل تغيُّر صفات البروتين تحديداً"
        - text: "«مسخ — تغيير طبيعة المادة كيميائياً أو فيزيقياً — denaturation»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "يُثبت أن المسخ يشمل التغيير الكيميائي والفيزيائي للطبيعة"

    - lemma: "مَادَّة مَاسِخَة"
      evidence_status: "no_material_found"

    - lemma: "عَامِل تَمَسُّخ"
      evidence_status: "no_material_found"

    - lemma: "مُغَيِّرُ الطَّبِيعَة"
      expands:
        - text: "«تغيير الطبيعة — denaturation»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "المصدر تغيير الطبيعة مسجّل كمصطلح لـ denaturation، لكن لم يُسجَّل اسم الفاعل مُغيِّر الطبيعة كمصطلح لـ denaturant"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "عَامِل مَسْخ"
      decision: confirmed
      decision_reason: "مركب إضافي صحيح بنيوياً (عامل + مسخ)، والجذر م س خ هو الجذر المعتمد في المصطلحية العلمية العربية. لم يُعثَر عليه مباشرة في المعاجم المتخصصة لكن مكوّنيه مُثبتان. يصلح كبديل توضيحي لـ مُمَسِّخ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مركب إضافي توضيحي يُبرز وظيفة المادة بوصفها عاملاً، أكثر شفافيةً دلالية من مُمَسِّخ المفرد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِل مَسْخ"

    - lemma: "مَادَّة مُفْسِدَة"
      decision: removed
      decision_reason: "جذر فسد يدلّ على الإفساد والضرر العام، لا على التمسُّخ الكيميائي تحديداً. المعجم المتخصص يترجم مفسد بـ pernicious لا denaturant. استبدالها بـ مُمَسِّخ المعتمد في المعجم الطبي الموحد."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُمَسِّخ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد في المعجم الطبي الموحد (2009) كترجمة مباشرة لـ denaturant. اسم فاعل على وزن مُفَعِّل من الجذر م س خ الذي اعتُمد في عدة معاجم موحدة للدلالة على التمسُّخ (denaturation). مفرد موجز قابل للاشتقاق والجمع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مفرد مشتق يدلّ على الفاعل مباشرةً دون حاجة إلى تركيب، أدقّ وأوجز من عامل مسخ"
      actions:
        - command: create_entry
          params: {lemma: "مُمَسِّخ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَادَّة مَاسِخَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثَر عليه في أي معجم متخصص. وزن فاعل من الثلاثي (ماسخ) أقل شيوعاً في المصطلحية العلمية من وزن مُفَعِّل (مُمَسِّخ). كذلك هو مركب وصفي يمكن استبداله بالمفرد المعتمد."

    - lemma: "عَامِل تَمَسُّخ"
      source: stage1
      decision: removed
      decision_reason: "لم يُسجَّل في المعاجم المتخصصة. وجود عامل مسخ كلمّة موجودة يُغني عنه، والفرق بينهما (مسخ/تمسُّخ) غير جوهري في هذا السياق."

    - lemma: "مُغَيِّرُ الطَّبِيعَة"
      source: stage1
      decision: removed
      decision_reason: "عبارة تفسيرية أقرب إلى الشرح منها إلى المصطلح. لم يُسجَّل كمصطلح لـ denaturant في أي معجم، رغم تسجيل المصدر تغيير الطبيعة لـ denaturation. يفتقر إلى السكّ المصطلحي."


stage4_content:
  definition:
    current: "أي مادة تعمل كعامل تغيير للطبيعة (الفسخ)"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على خطأ مصطلحي: «الفسخ» يعني النقض والإلغاء (cancellation) لا التمسُّخ (denaturation). كما أن عبارة «تغيير للطبيعة» ترجمة حرفية ضعيفة. يحتاج إلى إعادة صياغة بأسلوب معجمي سليم."
    authored:
      - type: terminological
        text: "مَادَّةٌ تُحدِثُ التَّمَسُّخَ في البِنْيَة الجُزَيئيَّة للبروتينات أو غيرها من المُركَّبات العُضويَّة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مَادَّةٌ كيميائيَّةٌ تُضافُ إلى البروتينات أو الكُحول أو نحوِها فتُغيِّرُ بنيتَها الطبيعيَّةَ وتُفقِدُها خصائصَها الأصليَّة، كإضافة مادَّة سامَّة إلى الكُحول الصناعيّ لجعلِه غيرَ صالحٍ للشُّرب."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَادَّةٌ تُحدِثُ التَّمَسُّخَ في البِنْيَة الجُزَيئيَّة للبروتينات أو غيرها من المُركَّبات العُضويَّة."

  examples:
    per_lemma:
      - lemma: "مُمَسِّخ"
        examples:
          - text: "يُضافُ المُمَسِّخُ إلى الكُحول الصِّناعيِّ لمَنعِ استهلاكِه البَشَريّ."
            type: usage
      - lemma: "عَامِل مَسْخ"
        examples:
          - text: "تُستخدَمُ الحرارةُ والأحماضُ بوصفِها عَوامِلَ مَسْخٍ لتغييرِ بِنْيَة البروتين في المختبرات."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُضافُ المُمَسِّخُ إلى الكُحول الصِّناعيِّ لمَنعِ استهلاكِه البَشَريّ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُستخدَمُ الحرارةُ والأحماضُ بوصفِها عَوامِلَ مَسْخٍ لتغييرِ بِنْيَة البروتين في المختبرات."


