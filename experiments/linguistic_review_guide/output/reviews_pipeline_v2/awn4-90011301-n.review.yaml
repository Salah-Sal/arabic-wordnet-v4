# مراجعة المجموعة الترادفية — awn4-90011301-n
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المفهوم ينتمي إلى ثقافة فرعية جنسية غربية (السيطرة المالية / findom) لا وجود معجمي لها في العربية"
      - "اللمّة «مُمَوِّل خَاضِع» متناقضة دلالياً: المُمَوِّل يدل على صاحب السلطة المالية، والخاضع يدل على التبعية"
      - "اللمّتان الموجودتان عبارتان وصفيتان حرّتان وليستا مصطلحين مسكوكين — تفشلان في اختبار السكّ"
      - "المعرّف الأعلى (عَامِل/فَاعِل = شخص يعمل ويُنجِز) لا يناسب دلالياً مفهوم الخضوع والتبعية"
      - "معرّف ILI فارغ (null)، مما يشير إلى أن المجموعة قد لا تُقابل مفهوماً في OEWN"
    observations: >
      التعريف يصف شخصاً ذكراً يدفع المال طوعاً كجزء من طقوس خضوع جنسي.
      هذا مفهوم شديد التخصص من ثقافة BDSM الغربية، ولا يوجد له مصطلح عربي ثابت في أي معجم عربي كلاسيكي أو حديث.
      اللمّتان الموجودتان ترجمتان حرفيتان للمصطلح الإنجليزي «financial submissive» دون سكّ معجمي.
      المركب «مُمَوِّل خَاضِع» مشكل لأن المُمَوِّل اسم فاعل من موَّل (= قدّم المال لغيره كمستثمر أو راعٍ)
      وهذا يناقض دلالة الخضوع والتبعية المقصودة.
  blind_candidates:
    - lemma: "مُسْتَعْبَد مَالِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «مُسْتَعْبَد» (اسم مفعول من استعبد = استرقّه وأذلّه) و«مَالِيّ» (نسبة إلى المال).
        يعكس بُعد الخضوع والإذلال الذي يتضمنه المفهوم مع ربطه بالجانب المالي.
    - lemma: "خَنُوع مَالِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «خَنُوع» (صيغة مبالغة على فَعُول من خَنَعَ = ذلّ وهان) و«مَالِيّ».
        الخنوع أشد من الخضوع ويتضمن معنى الذلّ الطوعي.
    - lemma: "بَذَّال"
      generation_method: ishtiqaq
      justification: >
        صيغة مبالغة على فَعَّال من بَذَلَ (= أعطى عن طيب نفس بلا مقابل).
        تحمل معنى الإنفاق الطوعي المفرط لكنها تفتقر إلى بُعد الخضوع الجنسي.
    - lemma: "دَافِع خَاضِع"
      generation_method: tarkib
      justification: >
        مركب وصفي من «دَافِع» (اسم فاعل من دَفَعَ = أدّى المال) و«خَاضِع».
        أدق من «مُمَوِّل» لأن الدافع يؤدي المال دون دلالة على السلطة المالية.

stage2_evidence:
  per_lemma:
    - lemma: "خَاضِع مَالِيّ"
      evidence_status: "no_material_found"

    - lemma: "مُمَوِّل خَاضِع"
      contradicts:
        - text: "«(الممول) من ينْفق على عمل مَا ودافع الضرائب (محدثة)»"
          source: "المعجم الوسيط"
          conflict: "المُمَوِّل هو من يُنفق على عمل ما بصفته صاحب السلطة المالية، لا بصفته خاضعاً"
        - text: "«مُمَوِّل — من (م و ل) المقدِّم إلى غيره ما يحتاج من مال»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "التعريف يؤكد أن المُمَوِّل هو المُقدِّم للمال (الفاعل المتحكم)، وهذا يناقض معنى الخضوع"

    - lemma: "مُسْتَعْبَد مَالِيّ"
      evidence_status: "no_material_found"

    - lemma: "خَنُوع مَالِيّ"
      evidence_status: "no_material_found"

    - lemma: "بَذَّال"
      evidence_status: "no_material_found"

    - lemma: "دَافِع خَاضِع"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خَاضِع مَالِيّ"
      decision: confirmed
      decision_reason: >
        رغم أنه مركب وصفي غير مسكوك معجمياً، فهو الأقرب دلالياً للمفهوم المقصود:
        «خَاضِع» اسم فاعل من خَضَعَ (= ذلّ واستكان) وهو المعنى المركزي،
        و«مَالِيّ» نسبة إلى المال تحدد مجال الخضوع.
        التركيب شفاف صرفياً ونحوياً ولا تناقض دلالي فيه.
        يُبقى عليه لعدم وجود بديل أفضل لمفهوم شديد الغرابة الثقافية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "التركيب الوحيد المُبقى — يصف الشخص بصفة الخضوع مع تحديد الجانب المالي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاضِعٌ مَالِيّ"

    - lemma: "مُمَوِّل خَاضِع"
      decision: removed
      decision_reason: >
        تناقض دلالي صريح: «مُمَوِّل» في المعاجم العربية (الوسيط، موسوعة السلطان قابوس)
        يعني «من يُنفق على عمل ما» أو «المقدِّم إلى غيره ما يحتاج من مال»،
        وهذا يدل على صاحب السلطة المالية لا على الخاضع.
        الجمع بين «مُمَوِّل» و«خَاضِع» يُنتج تركيباً متناقضاً داخلياً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُسْتَعْبَد مَالِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي ولا شيوع استعمالي. كلمة «مُسْتَعْبَد» تحمل حمولة سلبية شديدة
        مرتبطة بالعبودية الفعلية، وهذا أقوى مما يقتضيه المفهوم. كما أن التركيب وصفي حر غير مسكوك.
      evidence_assessment:
        case: no_material

    - lemma: "خَنُوع مَالِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي. «خَنُوع» صيغة مبالغة صحيحة صرفياً لكن التركيب لم يُسكّ ولا وجود له
        في أي مصدر. كما أن الخنوع يتضمن ذلّاً أشد من المقصود.
      evidence_assessment:
        case: no_material

    - lemma: "بَذَّال"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي. الكلمة تدل على كثرة البذل والعطاء دون أي بُعد خضوعي أو جنسي،
        فهي تصف جانباً واحداً فقط من المفهوم (الإنفاق) وتُغفل الجانب الجوهري (الخضوع).
      evidence_assessment:
        case: no_material

    - lemma: "دَافِع خَاضِع"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي. التركيب أدق من «مُمَوِّل خَاضِع» لكنه يظل عبارة وصفية حرة
        غير مسكوكة. وعند وجود «خَاضِع مَالِيّ» كبديل، لا حاجة لتركيب مرادف بلا ميزة.
      evidence_assessment:
        case: no_material

