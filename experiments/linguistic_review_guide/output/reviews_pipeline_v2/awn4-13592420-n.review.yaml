# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13592420-n
# ILI: i108028 | POS: n
# English: unfolding, flowering — "a developmental process"
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «عملية تنموية» مبهم للغاية ولا يميّز هذه المجموعة عن أيّ عملية نمو عامة"
      - "المفهوم الإنجليزي (unfolding/flowering) يشير إلى التفتح التدريجي والبلوغ — وهو أخصّ بكثير من «عملية تنموية»"
    observations: >
      المجموعة تقابل في الإنجليزية مفهوم التفتح (unfolding) والإزهار (flowering) بوصفهما عمليةً تنمويةً
      يبلغ فيها الشيءُ طَوْرَ الاكتمال. الأصل النباتي واضح (تفتح الأكمام، إزهار النبات)
      ثم توسّع مجازياً (ازدهار الحضارات). يحتاج التعريف العربي إلى تدقيق جوهري.
  blind_candidates:
    - lemma: "إِزْهَار"
      generation_method: ishtiqaq
      justification: "مصدر أَزْهَرَ على وزن إِفْعَال من الجذر (ز ه ر)، يدلّ على عملية خروج الزهر وبلوغ النبات طور النضج، ويُستعمل مجازياً للتقدم والتطور"
    - lemma: "نُشُوء"
      generation_method: ishtiqaq
      justification: "مصدر نَشَأَ على وزن فُعُول من الجذر (ن ش أ)، يدلّ على الارتفاع والسمو التدريجي حتى بلوغ الشيء تمامه"
    - lemma: "تَبَرْعُم"
      generation_method: ishtiqaq
      justification: "مصدر تَبَرْعَمَ على وزن تَفَعْلُل، يدلّ على بدء خروج البراعم وهو المرحلة الأولى من عملية التفتح النباتي"
    - lemma: "تَنَامٍ"
      generation_method: ishtiqaq
      justification: "مصدر تَنَامَى على وزن تَفَاعُل من الجذر (ن م و)، يدلّ على الزيادة والنمو التدريجي المتبادل"

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِزْدِهَار"
      confirm:
        - text: "«ازدياد حجم أصداء العصافات (الشذرات) المعدنية على شاشة الرادار، وذلك مع تشتُّت الشذرات مع الزمن.»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
      contradicts:
        - text: "«prosperity»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "الازدهار في الاقتصاد يدلّ على الرخاء لا على عملية تنموية بعينها"
        - text: "«bonanza»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "المقابل الإنجليزي bonanza يعني الطفرة المالية لا العملية التنموية"
      expands:
        - text: "«ازدهار — من (ز ه ر) الإشراق والتقدم. يستخدم للإناث.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الأصل الاشتقاقي يؤكد دلالة الإشراق والتقدم"
        - text: "«الزَّاءُ وَالْهَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حُسْنٍ وَضِيَاءٍ وَصَفَاءٍ. مِنْ ذَلِكَ الزُّهَرَةُ: النَّجْمُ. وَمِنْهُ الزَّهْرُ، وَهُوَ نَوْرُ كُلِّ نَبَاتٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يجمع بين الحُسن والضياء ونَوْر النبات"

    - lemma: "تَفَتُّح"
      confirm:
        - text: "«(تفتح) مُطَاوع فتح والأكمام عَن النُّور أَو اللوزة عَن الْقطن تشققت عَنهُ وَفِي الْكَلَام توسع فِيهِ»"
          source: "المعجم الوسيط"
        - text: "«كتفتح بعض الثمار وأكياس البوغ وغيرها»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«blooming»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«الْفَاءُ وَالتَّاءُ وَالْحَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الْإِغْلَاقِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على خلاف الإغلاق، وهو أساس دلالة التفتح التدريجي"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِزْهَار"
      confirm:
        - text: "«flowering»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«ظهور الإزهار في النباتات.» — anthesis; flowering"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«(٢) الإزهار؛ التنوير.» — flowering"
          source: "المورد الحديث (2008)"
        - text: "«إزهار؛ تَفَتُّح roses in full bloom»"
          source: "المورد الحديث (2008) — مادة bloom"

    - lemma: "نُشُوء"
      expands:
        - text: "«genesis»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
          addition: "نشوء يقابل genesis وهو أعمّ من مفهوم التفتح والإزهار"
        - text: "«النُّونُ وَالشِّينُ وَالْهَمْزَةُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي شَيْءٍ وَسُمُوٍّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الارتفاع والسمو عموماً لا على التفتح خصوصاً"

    - lemma: "تَبَرْعُم"
      evidence_status: "no_material_found"

    - lemma: "تَنَامٍ"
      contradicts:
        - text: "«تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "التنامي في الهندسة يعني التراكم المادي (accretion) لا العملية التنموية الحيوية"
      expands:
        - text: "«تطوّر، تَنَامٍ» — development"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          addition: "في التشريح يُستعمل تَنَامٍ بمعنى development لكنه مرادف لتطوّر وليس مصطلحاً مستقلاً"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِزْدِهَار"
      decision: confirmed
      decision_reason: >
        اللمّة مستعملة في العربية المعاصرة بمعنى الإشراق والتقدم والبلوغ،
        وهي مشتقة من الجذر (ز ه ر) الدال على الحسن والنور.
        رغم غلبة المعنى الاقتصادي (الرخاء) في الاستعمال المعاصر،
        فإنّ الدلالة الأصلية على الإزهار والنَّوْر تسوّغ استعمالها في هذه المجموعة.
        تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على بلوغ أوج التطور والإشراق، مع إيحاء بالنتيجة الإيجابية والتقدم — أقرب إلى الحصيلة منه إلى المسار"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِزْدِهَار"

    - lemma: "تَفَتُّح"
      decision: confirmed
      decision_reason: >
        المعجم الوسيط يؤكد دلالتها على تشقق الأكمام عن النور والانفتاح التدريجي.
        المعاجم المتخصصة تقابلها بـ dehiscence و blooming.
        تصلح للدلالة على العملية التنموية بوصفها انكشافاً تدريجياً.
        تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الانفتاح التدريجي كانبساط الأكمام — يُركّز على المسار والتدرّج في الانكشاف لا على النتيجة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَتُّح"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِزْهَار"
      source: stage1
      decision: confirmed
      decision_reason: >
        أدلة قوية من عدة معاجم متخصصة: AGROVOC وعلم الوراثة والمورد الحديث
        تؤكد أنّ إزهار يقابل flowering مباشرة. وهو مصدر أَزْهَرَ على وزن إِفْعَال
        ويدلّ تحديداً على عملية خروج الزهر، وهو أدقّ من ازدهار الذي توسّع مجازياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ تحديداً على العملية البيولوجية لخروج الزهر (anthesis)، أخصّ من ازدهار وأقرب إلى المعنى النباتي الحرفي"
      actions:
        - command: create_entry
          params: {lemma: "إِزْهَار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "نُشُوء"
      source: stage1
      decision: removed
      decision_reason: >
        نشوء يدلّ على البدء والنشأة (genesis) وهو أعمّ من مفهوم التفتح والإزهار.
        لا يحمل دلالة التطور التدريجي نحو الاكتمال بل يركّز على لحظة البدء.

    - lemma: "تَبَرْعُم"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية. والتبرعم يدلّ على مرحلة خروج البراعم تحديداً
        وهي أضيق من المفهوم المطلوب (عملية تنموية شاملة).

    - lemma: "تَنَامٍ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُظهر أنّ تَنَامٍ يُستعمل بمعنى التراكم المادي (accretion)
        في الهندسة المدنية. وفي التشريح لا يعدو كونه مرادفاً لتطوّر،
        دون أن يحمل دلالة التفتح والإزهار المميزة لهذه المجموعة.

