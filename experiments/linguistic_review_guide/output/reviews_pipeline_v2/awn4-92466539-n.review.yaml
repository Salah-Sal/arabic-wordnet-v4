# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-92466539-n
# المفهوم: عامل تفتيح — مادة تُستخدم لتفتيح مظهر الأسطح
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «مفتح» بدون تشكيل — يحتمل أن تكون مُفَتِّح (اسم فاعل من فتّح) أو مِفْتَح (اسم آلة/مكان)"
      - "اللمّة «مادة تفتيح» تعبير وصفي حرّ وليست مصطلحاً مسكوكاً ثابتاً — يمكن إبدال «مادة» بـ«عامل» أو «محلول» ويبقى صالحاً"
      - "التعريف الحالي ترجمة حرفية من الإنجليزية — يحتاج إعادة صياغة بأسلوب معجمي عربي"
      - "المفهوم يشمل التفتيح والتبييض معاً، لكن اللمّات الحالية تقتصر على حقل «فتح» دون «بيض» أو «قصر»"
    observations: "المجموعة تصف مادة كيميائية تُستخدم لتفتيح اللون في أسطح مختلفة (شعر، جلد، خشب). في المعجمية العربية الحديثة، يُستخدم مصطلحان رئيسيان: «تفتيح» في سياق التجميل والعناية بالبشرة، و«تبييض/قصر» في السياق الصناعي والكيميائي. المصطلح الكلاسيكي «المُفَتِّح» عند الأطباء القدماء يعني ما يخرج المادة السادّة عن المجرى (cathartic/deoppilant)، وهو معنى مختلف عن تفتيح اللون. أما مصطلح «مُبَيِّض» فهو أوثق ارتباطاً بالمعنى المقصود وله شواهد معجمية متعددة."
  blind_candidates:
    - lemma: "مُبَيِّض"
      generation_method: ishtiqaq
      justification: "اسم فاعل من بَيَّضَ (فعّل) على وزن مُفَعِّل، يدلّ على ما يجعل الشيء أبيض أو فاتح اللون. مُوثّق في المعاجم بمعنى من يبيّض الجدار أو النحاس، ويُستعمل حديثاً للمركبات الكيميائية المبيِّضة."
    - lemma: "مُفَتِّح"
      generation_method: ishtiqaq
      justification: "اسم فاعل من فَتَّحَ (فعّل) على وزن مُفَعِّل، يدلّ على ما يجعل اللون فاتحاً. شائع في الاستعمال المعاصر في مجال التجميل (مُفَتِّح البشرة)."
    - lemma: "عَامِل تَبْيِيض"
      generation_method: tarkib
      justification: "مركب إضافي من «عامل» (الجنس القريب: مادة فعّالة) و«تبييض» (الفصل النوعي: إزالة اللون). مصطلح تقني مُثبت في معاجم الكيمياء وتقانات الأغذية."
    - lemma: "مَادَّة قَاصِرَة"
      generation_method: tarkib
      justification: "مركب وصفي من «مادة» و«قاصرة» (من قَصَرَ الثوبَ = بيّضه). مصطلح «القصر» مُثبت في معاجم الكيمياء بمعنى التبييض، لكن «قاصرة» بهذا المعنى نادرة الاستعمال."

stage2_evidence:
  per_lemma:
    - lemma: "مَادَّة تَفْتِيح"
      evidence_status: "no_material_found"

    - lemma: "مُفَتِّح"
      confirm:
        - text: "«المُفَتِّحُ: مَا يخرج الْمَادَّة السَّادة عَن المجرى إِلَى الْخَارِج.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«المفتّح: على صيغة اسم الفاعل من التفتيح عند الأطباء دواء يخرج المادة السّادة عن المجرى إلى خارج عند فعل الحرارة الغريزية فيه كالكرفس»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«(المفتح) الْمِفْتَاح وقناة المَاء (ج) مفاتح»"
          source: "المعجم الوسيط"
          conflict: "الوسيط يذكر المِفْتَح بمعنى المفتاح وقناة الماء، لا بمعنى عامل التفتيح اللوني"
      expands:
        - text: "«مُفَتِّح — translation_en: deoppilant»"
          source: "المعجم الطبي الموحد"
          addition: "المصطلح الطبي الحديث يحتفظ بالمعنى الكلاسيكي (إزالة الانسداد) لا تفتيح اللون"

    - lemma: "مُبَيِّض"
      confirm:
        - text: "«مُبيِّض — مركب أكسدة يتضمن عادة الكلور متحدا مع الكالسيوم أو الصوديوم — translation_en: bleach»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "«(1) المبيِّض (2) مادّة مبيِّضة — translation_en: whitener»"
          source: "المورد الحديث"
        - text: "«مُبَيِّض — من (ب ي ض) من يجعل الشيء أبيض ومن يطلي الجدار أو الأواني النحاسية.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(المبيض) من يبيض الْجِدَار أَو النّحاس»"
          source: "المعجم الوسيط"
      expands:
        - text: "«قاصِر الألوان، مُبَيِّض — مادة تبيض المادة الغذائية التي تعامل بها مثل غاز الكلور المستعمل كمبيض للطحين — translation_en: bleaching agent»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
          addition: "يوسّع الاستعمال ليشمل المواد الغذائية والصناعية"
        - text: "«مُبَيِّض القهوة — مادة تضاف للقهوة تكسبها عادة لوناً فاتحاً — translation_en: coffee whitener»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
          addition: "يدلّ على أن المُبَيِّض يُستعمل بمعنى ما يجعل اللون فاتحاً لا أبيض فحسب"

    - lemma: "عَامِل تَبْيِيض"
      confirm:
        - text: "«عامل تبيض بصري — translation_en: optical bleaching agent»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية: طباعة - كهرباء"
      expands:
        - text: "«تبييض — قصر الألوان — translation_en: bleaching»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية: بناء - تجارة"
          addition: "يربط التبييض بقصر الألوان ويوسّع نطاق الاستعمال"
        - text: "«قصر الألوان — إزالة الألوان أو التبيض بواسطة المواد الكيميائية أو بالتعريض لضوء الشمس — translation_en: bleaching»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
          addition: "يؤكد أن التبييض يشمل التفتيح الكيميائي والطبيعي للأسطح"

    - lemma: "مَادَّة قَاصِرَة"
      contradicts:
        - text: "«مسحوقٌ قاصِر — translation_en: bleaching powder»"
          source: "المعجم الطبي الموحد"
          conflict: "المثبت هو «مسحوق قاصر» لا «مادة قاصرة» — الصياغة غير موثقة"
      expands:
        - text: "«(4) المُقَصِّرة: مادة كيميائية تُستخدم في التقصير»"
          source: "المورد الحديث"
          addition: "المورد يستعمل «المُقَصِّرة» لا «القاصرة» للدلالة على المادة المبيِّضة"

stage3_analysis:
  per_lemma:
    - lemma: "مَادَّة تَفْتِيح"
      decision: removed
      decision_reason: "تعبير وصفي حرّ لا مصطلح مسكوك — يصلح وصفاً لا مدخلاً معجمياً. يفشل في اختبار السكّ: يمكن إبدال «مادة» بـ«عامل/محلول/مستحضر» ويبقى صالحاً كوصف. لم تُعثر على شواهد معجمية تثبته كوحدة معجمية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُفَتِّح"
      decision: confirmed
      decision_reason: "اسم فاعل من فتّح مُوثّق في المعاجم الكلاسيكية والحديثة. وإن كان المعنى الكلاسيكي (إزالة الانسداد) يختلف عن المعنى المعاصر (تفتيح اللون)، فإن الاستعمال الحديث راسخ في مجال التجميل والعناية بالبشرة. اللمّة الأصلية بدون تشكيل — يجب تحديثها إلى مُفَتِّح."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل في سياق التجميل والعناية بالبشرة والشعر خصوصاً، ويدلّ على التدرج في جعل اللون أفتح دون بلوغ البياض الكامل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُفَتِّح"

    - lemma: "مُبَيِّض"
      source: stage1
      decision: confirmed
      decision_reason: "مُوثّق توثيقاً وافراً في المعاجم الحديثة بمعنى مادة التبييض (bleach/whitener). الوسيط والمورد الحديث ومعاجم أليكسو كلها تثبت هذا الاستعمال. يغطي الجانب الصناعي والكيميائي من المفهوم الذي لا يغطيه مُفَتِّح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل في السياق الصناعي والكيميائي والغذائي، ويدلّ على جعل الشيء أبيض أو إزالة لونه بالكامل، بخلاف مُفَتِّح الذي يدلّ على التدرج"
      actions:
        - command: create_entry
          params:
            lemma: "مُبَيِّض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "عَامِل تَبْيِيض"
      source: stage1
      decision: removed
      decision_reason: "رغم وروده في معاجم أليكسو (عامل تبيض بصري)، فإنه تعبير وصفي حرّ مثل «مادة تفتيح» — يفشل في اختبار السكّ. كما أن المُبَيِّض وحده يؤدي المعنى بصورة أوجز."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مَادَّة قَاصِرَة"
      source: stage1
      decision: removed
      decision_reason: "الصياغة غير موثقة معجمياً. المُثبت هو «مسحوق قاصر» و«المُقَصِّرة» و«قاصر الألوان» — أما «مادة قاصرة» فابتكار لا سند له. فضلاً عن أن «قاصر» مشحون بدلالات أخرى (القاصر = من لم يبلغ سن الرشد)."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

stage4_content:
  definition:
    current: "أي نوع من عوامل التفتيح التي يمكن استخدامها لتفتيح مظهر الشعر والجلد والخشب والأسطح الأخرى"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية ركيكة من الإنجليزية، فيه دوران (تفتيح...لتفتيح)، ولا يتبع أسلوب التعريف المعجمي العربي (جنس قريب + فصل نوعي)"
    authored:
      - type: terminological
        text: "مادّةٌ كيميائيّةٌ تُستعمَل لإزالة اللون أو تخفيفه في الشَّعر أو الجلد أو الخشب أو نحوها من الأسطح"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مادّةٌ كيميائيّةٌ مؤكسِدةٌ أو مُختزِلةٌ تعمل على تفكيك الأصباغ الطبيعيّة أو الصناعيّة في الأسطح المختلفة كالشَّعر والجلد والخشب والأقمشة، فتجعل لونها أفتح. من أشهر أنواعها: فوق أكسيد الهيدروجين (ماء الأكسجين) والكلور"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ كيميائيّةٌ تُستعمَل لإزالة اللون أو تخفيفه في الشَّعر أو الجلد أو الخشب أو نحوها من الأسطح"

