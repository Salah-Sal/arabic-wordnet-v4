# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14923681-n
# (biology) a substance in which specimens are preserved or displayed
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «وسط» مجرّدة من التشكيل، ويجب ضبطها: وَسَط"
      - "المجموعة تضمّ لمّة واحدة فقط؛ قد يكون من المفيد إثراؤها بمرادفات متخصّصة"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي ويحتاج صياغة معجمية"
    observations: >
      المفهوم المقصود هو «الوسط البيولوجي» أي المادّة التي تُحفَظ فيها العيّنات أو تُعرَض لأغراض الدراسة
      والفحص. هذا استعمال علمي حديث للفظ «وَسَط» العربي، اعتمدته المعاجم المتخصّصة (المعجم الموحّد
      لمصطلحات علم الأحياء، المعجم الطبّي الموحّد) ترجمةً للإنجليزية medium والفرنسية milieu. الجذر و-س-ط
      أصيل يدلّ على العدل والنصف والتوسّط، وقد نُقل مجازاً إلى معنى «البيئة» و«المجال» كما نصّ المعجم الوسيط
      بوسمه «محدثة». المفهوم قريب من «المُثبِّت» (fixative) لكنّه أعمّ، فالمُثبّت مادّة معالِجة، أمّا الوسط فهو
      الحاضن الذي تُوضَع فيه العيّنة.
  blind_candidates:
    - lemma: "وَسَط"
      generation_method: majaz
      justification: >
        إزاحة دلالية من المعنى الأصلي «ما بين الطرفين» إلى «البيئة الحاضنة للعيّنات»، وهو الاستعمال
        العلمي المعياري في المعاجم الموحّدة العربية ترجمةً لـ medium/milieu.
    - lemma: "مُثَبِّت"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «ثبّت» على وزن مُفَعِّل، يُطلَق على المادّة التي تحفظ الأنسجة وتثبّت بِنيتها
        التشريحية تمهيداً لفحصها؛ مقارب للمفهوم من جهة الحفظ.
    - lemma: "مُسْتَنْبَت"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من «استنبت» على وزن مُسْتَفْعَل، يُستعمَل في الصيدلة لوسط الاستنبات (culture medium)؛
        مقارب للمفهوم من جهة كونه وسطاً مادّياً تُوضَع فيه العيّنات.
    - lemma: "حَافِظ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «حَفِظَ» على وزن فَاعِل، يُستعمَل بمعنى «المادّة الواقية أو الحافظة»
        كما في المعجم الطبّي الموحّد (preservative).

stage2_evidence:
  per_lemma:
    - lemma: "وَسَط"
      confirm:
        - text: "«وسَطُ الشيءِ: ما بين طرفيه وهو منه المعتدل من كل شيء... مجال الشيء وبيئتُه. (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«وسط — medium — milieu — Biology»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«وَسَطٌ — milieu — The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«وَسَطٌ إِرْسائِيّ — mounting medium — milieu de montage»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«وَسَطٌ — المادة المستخدمة في مرشح لتشكيل حاجز أمام مرور بعض المواد العالقة أو الجزيئات المنحلة — medium»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«وَسَطَ — الْوَاوُ وَالسِّينُ وَالطَّاءُ: بِنَاءٌ صَحِيحٌ يَدُلُّ عَلَى الْعَدْلِ وَالنِّصْفِ. وَأَعْدَلُ الشَّيْءِ: أَوْسَطُهُ وَوَسَطُهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي للجذر و-س-ط يدلّ على التوسّط والاعتدال، وقد انتقل مجازاً إلى معنى البيئة والمجال"
        - text: "«وسط خارجي — external medium؛ وسط داخلي — internal medium»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "مركّبات وصفية تؤكّد إنتاجية المصطلح في المجال البيولوجي"

    - lemma: "مُثَبِّت"
      contradicts:
        - text: "«مثبّت — عامل يستخدم في تحضير العينات في علم الأنسجة للاحتفاظ بكل الخصائص البنوية للعينة المحفوظة — fixative»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          conflict: "المُثبِّت مادّة كيميائية تُعالِج الأنسجة لتثبيت بنيتها (fixative)، وليس الوسط الحاضن العامّ الذي تُحفَظ فيه العيّنات"
        - text: "«مُثَبِّت — fixative — fixateur — The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "fixative مفهوم مغاير لـ medium؛ هما مرحلتان مختلفتان في تحضير العيّنات"

    - lemma: "مُسْتَنْبَت"
      contradicts:
        - text: "«مُسْتَنْبَتٌ سَائِل — liquid medium؛ مُسْتَنْبَتٌ مُغَذٍّ — nutritive medium؛ مُسْتَنْبَتٌ جَامِد — solid medium»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "المُستَنبَت وسط استزراع (culture medium) لنموّ الأحياء الدقيقة، وليس وسط حفظ أو عرض للعيّنات"

    - lemma: "حَافِظ"
      contradicts:
        - text: "«حافِظ [ج:حَوافِظ] — preservative — conservateur»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الحافظ مادّة مضافة تمنع الفساد (preservative)، وليس الوسط الذي تُحفَظ فيه العيّنات وتُعرَض"
        - text: "«مادة حافظة مضادة للميكروبات — مادة تحفظ الأغذية بمنع نمو الأحياء الدقيقة فيها — antimicrobial preservative»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "سياق غذائي مغاير تماماً لسياق حفظ العيّنات البيولوجية"

stage3_analysis:
  per_lemma:
    - lemma: "وَسَط"
      decision: confirmed
      decision_reason: >
        لمّة راسخة في المعاجم المتخصّصة العربية (المعجم الموحّد لعلم الأحياء، المعجم الطبّي الموحّد،
        معاجم الفيزياء والكيمياء) بمعنى medium/milieu. المعجم الوسيط وسمها «محدثة» بمعنى
        «مجال الشيء وبيئتُه». المصطلح منتج ويدخل في مركّبات عديدة (وسط إرسائيّ، وسط خارجي، إلخ).
        تحتاج إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَسَط"

    - lemma: "مُثَبِّت"
      source: stage1
      decision: removed
      decision_reason: >
        المُثبِّت (fixative) مفهوم مغاير لمفهوم الوسط (medium): المثبّت مادّة كيميائية تعالِج الأنسجة
        وتحافظ على بنيتها الخلوية، أمّا الوسط فهو المادّة الحاضنة التي تُحفَظ فيها العيّنة أو تُعرَض.
        هما مرحلتان مختلفتان في تحضير العيّنات البيولوجية.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُسْتَنْبَت"
      source: stage1
      decision: removed
      decision_reason: >
        المُستنبَت (culture medium) مخصّص لوسط الاستزراع الذي تنمو فيه الأحياء الدقيقة،
        وليس لوسط حفظ العيّنات أو عرضها. الفرق جوهريّ: الاستنبات لنموّ الكائنات الحيّة،
        والحفظ لصون العيّنات الميتة أو المُعالَجة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "حَافِظ"
      source: stage1
      decision: removed
      decision_reason: >
        الحافظ (preservative) مادّة مُضافة تمنع التلف والفساد (في الأغذية أو الأدوية)،
        ولا يدلّ على الوسط الحاضن الذي تُوضَع فيه العيّنة. العلاقة بين المفهومَيْن
        علاقة وسيلة بغاية لا علاقة ترادف.
      evidence_assessment:
        case: contradicts_only

