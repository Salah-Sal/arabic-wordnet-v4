# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13570691-n
# relaxation (physiology): gradual lengthening of inactive muscle
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «استرخاء» بدون تشكيل — تحتاج إلى تشكيل كامل"
      - "المجموعة تحتوي على لمّة واحدة فقط لمفهوم فيزيولوجي متخصص"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي وفيه لفظة «الإطالة» التي قد لا تكون الأدق تعبيراً عن المراد الفيزيولوجي"
    observations: >
      المفهوم المستهدف هو الاسترخاء العضلي الفيزيولوجي، أي التمدد التدريجي للألياف العضلية
      غير النشطة. هذا مفهوم طبي/فيزيولوجي محدد يختلف عن الاسترخاء بمعناه العام (الراحة).
      الجذر «ر خ و» غني بالمشتقات الدالة على اللين والرخاوة، وهو المجال الدلالي المناسب.
      المرادف «ارتخاء» شائع في المعجمات الطبية كذلك.
  blind_candidates:
    - lemma: "اِسْتِرْخَاء"
      generation_method: ishtiqaq
      justification: "مصدر «استرخى» على وزن استفعال من الجذر ر-خ-و، يدلّ على طلب الرخاوة وحدوثها تدريجياً، وهو المصطلح الطبي الشائع للاسترخاء العضلي"
    - lemma: "اِرْتِخَاء"
      generation_method: ishtiqaq
      justification: "مصدر «ارتخى» على وزن افتعال من الجذر ر-خ-و، يدلّ على صيرورة الشيء رخواً، مستعمل في المعجمات الطبية لنقص التوتر العضلي"
    - lemma: "تَمَدُّد"
      generation_method: ishtiqaq
      justification: "مصدر «تمدّد» على وزن تفعُّل من الجذر م-د-د، يدلّ على الانبساط والاستطالة، وقد يُناسب معنى إطالة الألياف العضلية"
    - lemma: "تَرَاخٍ"
      generation_method: ishtiqaq
      justification: "مصدر «تراخى» على وزن تفاعُل من الجذر ر-خ-و، يدلّ على التباطؤ والتباعد والفتور التدريجي"


stage2_evidence:
  per_lemma:
    - lemma: "اِسْتِرْخَاء"
      confirm:
        - text: "«الاسترخاء: عند الأطباء ترهّل وضعف يظهر في العضو عن عجز القوّة المحرّكة، وهو مرادف للفالج عند القدماء. وأمّا المتأخرون فيطلقون الفالج على استرخاء يحدث في أحد شقّي البدن طولاً، ويضاف الاسترخاء بكل عضو حدث فيه كاللّثة واللهاة واللّسان وغيرها»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«ارتياح العضلات وعدم تشنجها أو انقباضها»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«واسترخاء القَدَم (في الطب): شَلَلٌ في عضلات السَّاق الأمامية ينشأ عنه استرخاؤها. واسترخاءُ اليَدِ: شَلَلٌ في عضلاتِ اليد ينشأ عنه استرخاؤها»"
          source: "المعجم الكبير"
      expands:
        - text: "«رأى مجمع اللغة المصري تسويغ استخدام لفظ الاسترخاء بمعنى: عدم الدقة أو عدم الانضباط، انتقالاً من الدلالة الحسية إلى الدلالة المعنوية»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "اللفظ ثابت في الاستعمال الحسي (العضلي) والمعنوي بإقرار المجمع"
        - text: "«relaxation → استرخاء» في مجالات الفيزياء وعلم الاجتماع وتقانات الأغذية"
          source: "معجمات أرابترم المتعددة"
          addition: "المصطلح معتمد في معجمات المنظمة العربية للتربية والثقافة والعلوم"

    - lemma: "اِرْتِخَاء"
      confirm:
        - text: "«نقص توتر العضلات التي تحيط بفتحة من فتحات الجسم، مثل الفتحة البابية في المعدة»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«relaxation → ارتخاء» و«chalasia → ارتخاء»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«ارتخاء، استرخاء، ليْن → relaxation»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«ارْتِخاءٌ إِسْوِيُّ القِيَاس (ارتخاء العضلة دون تغير الطول) → isometric relaxation»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستعمل «ارتخاء» في المصطلحية الطبية المركبة للدلالة على أنواع الاسترخاء العضلي"
        - text: "«ارتخاء الكبل الفولاذي داخل غمده بعد شده على الخرسانة سابقة الإجهاد → relaxation»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يُستعمل في الهندسة أيضاً بمعنى فقدان الشد التدريجي"

    - lemma: "تَمَدُّد"
      contradicts:
        - text: "«التمدُّدُ: مرض آلي يمنع انقباض الأعصاب»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "التمدد في الطب القديم يعني عدم قدرة الأعصاب على الانقباض (tetanus/spasm)، وهو عكس المراد"
        - text: "«زيادة سطح الجسم أو حجمه أو مساحته أو طوله واتساع تجويف أو قناة أو فتحة اتساعاً مرضياً أو عملياً»"
          source: "المعجم الوسيط"
          conflict: "التمدد يعني الزيادة في الحجم أو الطول (expansion/dilatation)، وهو مفهوم فيزيائي عام لا يختص بالاسترخاء العضلي"
        - text: "«expansion; dilatation → تمدد» في معجمات الفيزياء والكيمياء والهندسة"
          source: "معجمات أرابترم المتعددة"
          conflict: "المصطلح مستقر على معنى التمدد الفيزيائي (expansion) لا الاسترخاء العضلي (relaxation)"

    - lemma: "تَرَاخٍ"
      contradicts:
        - text: "«تَرَاخَى: فتر وتأخر وتباطأ. يقال تراخى عن الأمر تقاعد. وتراخت السماء أبطأت بالمطر. وما بينهما تباعد»"
          source: "المعجم الوسيط"
          conflict: "التراخي يدلّ على التباطؤ والتأخر والتقاعد عن الأمر، وهو معنى زمني/سلوكي لا فيزيولوجي"
        - text: "«التراخي: التمهل وامتداد الزمان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "التراخي مصطلح فقهي/زمني يدلّ على جواز التأخير، لا على الاسترخاء العضلي"


stage3_analysis:
  per_lemma:
    - lemma: "اِسْتِرْخَاء"
      decision: confirmed
      decision_reason: >
        لفظ «استرخاء» ثابت في المعجمات الطبية القديمة (كشاف التهانوي) والحديثة (المعجم الكبير، المعجم الموحد)
        بمعنى ترهّل العضو وفقدان قوته المحركة. وهو المقابل المعتمد لـ relaxation في معجمات المنظمة العربية.
        مشتق من الجذر ر-خ-و على وزن استفعال الدال على طلب الصفة، وهو مناسب تماماً للمعنى الفيزيولوجي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِرْخَاء"

    - lemma: "اِرْتِخَاء"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ «ارتخاء» مستعمل في المعجمات الطبية العربية مقابلاً لـ relaxation وchalasia، ويرد في تركيبات
        طبية مثل «ارتخاء إسوي القياس» و«ارتخاء العضلات». وهو على وزن افتعال من الجذر نفسه (ر-خ-و)
        ويدلّ على حدوث الرخاوة بصورة تلقائية، فيُكمّل «استرخاء» الذي يدلّ على طلبها.
        المعجم الطبي الموحد والمعجم البيطري يسجّلانهما معاً كمترادفين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "«ارتخاء» يدلّ على صيرورة العضو رخواً تلقائياً (افتعال = مطاوعة)، بينما «استرخاء» يدلّ على طلب الرخاوة وتحصيلها (استفعال = طلب). في الاستعمال الطبي: الارتخاء أقرب إلى فقدان التوتر المرضي، والاسترخاء أعمّ."
      actions:
        - command: create_entry
          params:
            lemma: "اِرْتِخَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَمَدُّد"
      source: stage1
      decision: removed
      decision_reason: >
        «التمدد» مستقر في المعجمات العلمية على معنى expansion/dilatation (زيادة الحجم أو الطول بفعل الحرارة أو الضغط)،
        وهو مفهوم فيزيائي مختلف عن الاسترخاء العضلي. والسيوطي عرّفه بأنه مرض آلي يمنع الانقباض (أقرب إلى التشنج).
        لا يصلح بديلاً لـ relaxation في السياق الفيزيولوجي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَرَاخٍ"
      source: stage1
      decision: removed
      decision_reason: >
        «التراخي» مصطلح فقهي/زمني يدلّ على التأخير والتباعد والتباطؤ، ولم يرد في أي معجم طبي
        بمعنى الاسترخاء العضلي. المعجم الوسيط والتهانوي والمناوي كلهم يحصرونه في المعنى الزمني/السلوكي.
      evidence_assessment:
        case: contradicts_only


stage4_content:
  definition:
    current: "(في علم وظائف الأعضاء) الإطالة التدريجية للعضلات أو ألياف العضلات غير النشطة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزي. لفظة «الإطالة» غير دقيقة لأن المراد ليس إطالة قصدية بل عودة
        الألياف العضلية إلى وضعها الطبيعي (الرخاوة) بعد زوال التنبيه. كما أن التعريف يفتقر إلى الجنس القريب الصحيح.
    authored:
      - type: terminological
        text: "عمليةٌ فيزيولوجيةٌ تعودُ فيها الأليافُ العضليةُ غيرُ النَّشِطةِ إلى طولِها الطبيعيِّ تدريجيّاً بعدَ زوالِ المُنبِّهِ العصبيّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ارتدادُ العضلةِ أو أليافِها إلى وَضْعِ الراحةِ بعدَ الانقباض، وذلك بامتدادِها التدريجيِّ حتى تبلغَ طولَها الأصليّ. ويحدثُ ذلك حينَ يتوقّفُ التنبيهُ العصبيُّ فتنفصلُ الجسورُ المستعرضةُ بينَ خيوطِ الأكتين والميوسين"
