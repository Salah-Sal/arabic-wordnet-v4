# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14608838-n (pyrogen)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مادة قابلة للاشتعال» عبارة وصفية طويلة وليست مصطلحاً مسكوكاً مفرداً"
      - "المصطلح الإنجليزي pyrogen في الاستعمال الطبي المعاصر يعني «مُوَلِّد الحُمَّى» لا «مادة قابلة للاشتعال»، مما يوحي بتعارض بين اللمّة الإنجليزية والتعريف"
      - "المجموعة تفتقر إلى مصطلح عربي مفرد على وزن صرفي مناسب كفَعُول الدالّ على القابلية"
    observations: >
      التعريف العربي واضح ويدلّ على مفهوم القابلية الشديدة للاشتعال، وهو مفهوم حاضر في التراث العربي
      إذ عرف العرب موادّ الإيقاد والحُراق. غير أنّ الاكتفاء بعبارة وصفية (مادة قابلة للاشتعال) دون
      مصطلح مفرد يُضعف المدخل المعجمي. توجد في العربية ألفاظ على وزن فَعُول تصلح لهذا المعنى
      مثل لَهُوب وحَرُوق وشَعُول.
  blind_candidates:
    - lemma: "لَهُوب"
      generation_method: ishtiqaq
      justification: >
        من جذر ل-ه-ب الدالّ على ارتفاع لسان النار والتهابها، على وزن فَعُول الذي يفيد
        المبالغة في القابلية، فاللَّهُوب ما يَلْتَهِب بسرعة ويسهل اشتعاله.
    - lemma: "حَرُوق"
      generation_method: ishtiqaq
      justification: >
        من جذر ح-ر-ق الدالّ على الاحتراق والالتهاب، على وزن فَعُول، والحَرُوق ما يَسهُل
        احتراقه. ورد في المعاجم القديمة أنّ الحَرُوقاء هي الحُرّاق أي ما تُقدح به النار.
    - lemma: "شَعُول"
      generation_method: ishtiqaq
      justification: >
        من جذر ش-ع-ل الدالّ على انتشار النار وتفرّقها، على وزن فَعُول، والشَّعُول ما يسرع
        اشتعاله وتنتشر فيه النار من جوانبه.
    - lemma: "وَقُود"
      generation_method: ishtiqaq
      justification: >
        من جذر و-ق-د الدالّ على اشتعال النار، على وزن فَعُول بمعنى الحطب وكلّ ما يُوقد
        به. وردت في المعجم الوسيط: «كلّ مادة تتولّد باحتراقها طاقة حرارية».


stage2_evidence:
  per_lemma:
    - lemma: "مَادَّة قَابِلَة لِلاشْتِعَال"
      confirm:
        - text: "«مادة قابلة للإشتعال» — flammable material; flammable substance"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«مادة قابلة للاشتعال» — flammable substance"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«قابل للاشتعال» — قابل للاحتراق أو التسبب في نشوب حريق."
          source: "مسرد المناخ والبيئة، المنظمة العربية"
          addition: "توسيع المعنى ليشمل التسبّب في الحريق"
        - text: "«مواد قَابِلَةٌ لِلِاشْتِعَالِ» — inflammable materials"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "صيغة الجمع المستعملة في المجال التقني"

    - lemma: "لَهُوب"
      confirm:
        - text: "«لَهُوب» — قابل للاحتراق."
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«(1) لَهُوب: سريع الالتهاب (2) سريع الاهتياج أو الغضب (3) اللَّهوبة: مادة سريعة الالتهاب.»"
          source: "المورد الحديث (2008)"
        - text: "«قَابِل للاشْتِعَال، لَهُوب» — inflammable"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«قابل للاشتعال، شَعول، لَهوب» — inflammable"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«بضاعة لهوبة» — شحنة قابلة للالتهاب — inflammable cargo"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "اللَّهوبة تُستعمل صفةً للبضائع والشحنات في المجال البحري"

    - lemma: "حَرُوق"
      confirm:
        - text: "«حَروق، قابل للاحتراق» — combustible"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«(1) حَرُوْق: قابل للاحتراق (3) الحَرُوق: مادة قابلة للاحتراق.»"
          source: "المورد الحديث (2008)"
        - text: "«قَابِل للاحْتِرَاق، حَرُوق» — combustible"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      expands:
        - text: "«الحَرُوقُ: ما يُقدح به النار. الشِّمراخُ الذى يُلقح به النخل»"
          source: "المعجم الكبير"
          addition: "المعنى التراثي: ما تُقدح به النار، أي مادة الإيقاد"
        - text: "«الحَرُوقاء هذا الذي يُقال له الحُرّاق»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ربط الحَرُوق بالحُرّاق وهو ما تقع فيه النار عند القدح"

    - lemma: "شَعُول"
      confirm:
        - text: "«قابل للاشتعال، شَعول، لَهوب» — inflammable"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      # شعول لم يرد مستقلاً كمدخل معجمي في أي معجم آخر

    - lemma: "وَقُود"
      contradicts:
        - text: "«كُلُّ مادَّةٍ تتولَّد باحتراقها طاقة حرارية»"
          source: "المعجم الوسيط"
          conflict: "الوَقُود أعمّ من المادة القابلة للاشتعال؛ فهو يشمل كلّ ما يُحرق لتوليد الطاقة بما فيه الوقود النووي"
        - text: "«مادة كيميائية يمكن تحويل الطاقة الكيميائية المختزنة فيها عن طريق الاحتراق إلى طاقة حرارية قابلة للاستخدام.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "الوقود مفهوم وظيفي (يُستخدم لتوليد الطاقة) لا مفهوم خاصّي (سريع الاشتعال)"
      expands:
        - text: "«الوقود: بالفتح: ما يوقد به النار: وبالضم التهابها، فهو مصدر والأول اسم.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "التفريق بين الوَقُود (بالفتح: الحطب) والوُقُود (بالضم: المصدر)"


stage3_analysis:
  per_lemma:
    - lemma: "مَادَّة قَابِلَة لِلاشْتِعَال"
      decision: confirmed
      decision_reason: >
        عبارة مصطلحية مسجّلة في قواعد بيانات المصطلحات الموحّدة (ALECSO) في مجالات
        الكهرباء والنقل والبيئة، وتقابل flammable material/substance. رغم كونها عبارة
        وصفية طويلة، فهي ثابتة ومتداولة في الأدبيات التقنية العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تعبير وصفي شامل يدلّ على أيّ مادة تتّصف بقابلية الاشتعال، يُستعمل في السياقات
        التقنية والتنظيمية كمصطلح رسمي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة قَابِلَة لِلاشْتِعَال"

    - lemma: "لَهُوب"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مفرد على وزن فَعُول الدالّ على المبالغة في القابلية، مسجّل في المعجم
        الموحد لمصطلحات الكيمياء والصيدلة (ALECSO) بمعنى flammable/inflammable،
        وفي المورد الحديث بمعنى «سريع الالتهاب». أدلّة متعدّدة ومتّسقة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على سرعة الالتهاب واللهب الظاهر، من جذر ل-ه-ب الدالّ على ارتفاع
        لسان النار. أقرب إلى flammable منه إلى combustible.
      actions:
        - command: create_entry
          params:
            lemma: "لَهُوب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حَرُوق"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مفرد على وزن فَعُول، مسجّل في المعجم الموحد لمصطلحات الكيمياء
        والصيدلة بمعنى combustible، وفي المورد الحديث بمعنى «قابل للاحتراق» و«مادة
        قابلة للاحتراق». له أصل تراثي في المعاجم القديمة (ما تُقدح به النار).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على قابلية الاحتراق عموماً، من جذر ح-ر-ق. أقرب إلى combustible
        منه إلى flammable. يحمل ظلالاً تراثية من الحُرّاق والحَرُوقاء.
      actions:
        - command: create_entry
          params:
            lemma: "حَرُوق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "شَعُول"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد مستقلاً كمدخل معجمي؛ ظهر فقط ضمن مدخل مركّب في معجم الكيمياء
        «قابل للاشتعال، شَعول، لَهوب» دون تعريف مستقلّ أو شواهد أخرى. التثبيت
        المعجمي غير كافٍ لإدراجه لمّةً مستقلّة.
      evidence_assessment:
        case: no_material

    - lemma: "وَقُود"
      source: stage1
      decision: removed
      decision_reason: >
        الوَقُود مفهوم أوسع يعني «كلّ مادة تتولّد باحتراقها طاقة حرارية» (المعجم الوسيط)،
        وهو مفهوم وظيفي (ما يُستخدم للإيقاد) لا خاصّي (ما يتميّز بسرعة الاشتعال).
        إدراجه هنا يخلط بين صنف المادة وصفتها.
      evidence_assessment:
        case: contradicts_only


stage4_content:
  definition:
    current: "أي مادة تتميز بقابليتها الشديدة للاشتعال"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية شبه مباشرة للتعريف الإنجليزي، ويفتقر إلى
        الجنس القريب الدقيق والفصل النوعي الواضح بأسلوب المعاجم العربية.
