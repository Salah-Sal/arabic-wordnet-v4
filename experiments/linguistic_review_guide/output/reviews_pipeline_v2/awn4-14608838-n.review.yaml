      - type: terminological
        text: "مَادَّةٌ يَسْرُعُ اشْتِعَالُهَا وَالْتِهَابُهَا عِنْدَ تَعَرُّضِهَا لِمَصْدَرِ حَرَارَةٍ أَوْ شَرَارَةٍ"
