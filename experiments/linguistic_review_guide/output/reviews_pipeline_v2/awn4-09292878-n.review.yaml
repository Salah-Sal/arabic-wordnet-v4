# مراجعة المجموعة الترادفية: awn4-09292878-n (dregs / settlings)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«رواسب القاع» تعبير وصفي حرّ وليس وحدة معجمية ثابتة — يمكن استبدال «القاع» بـ«الأسفل» أو «القعر» دون تغيّر المعنى"
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل"
      - "غياب مصطلح «دُرْدِيّ» و«رُسَابَة» وهما من أدقّ الألفاظ العربية دلالةً على هذا المفهوم"
    observations: >
      المفهوم يدور حول ما يستقرّ في قاع السوائل من كَدَر وخُثارة، وهو مفهوم عربي أصيل
      له ألفاظ تراثية عديدة. الجذر «ثفل» هو الأصل الجامع لهذا المعنى في مقاييس اللغة.
      لفظ «حثالة» يحمل دلالة تقييمية سلبية (الرديء من كل شيء) إضافة إلى الدلالة المادية.
      المجموعة تحتاج إلى إعادة هيكلة: حذف التعبير الحرّ وإضافة ألفاظ تراثية مسكوكة.
  blind_candidates:
    - lemma: "رُسَابَة"
      generation_method: ishtiqaq
      justification: "من الجذر «رسب» على وزن فُعَالَة الدالّ على البقية والفُضالة، وهو ما يرسب أسفل الإناء والنهر"
    - lemma: "دُرْدِيّ"
      generation_method: ishtiqaq
      justification: "لفظ تراثي يدلّ على ما يركد في أسفل كلّ مائع كالأشربة والأدهان، مذكور في المعجم الوسيط ولسان العرب"
    - lemma: "عُكَارَة"
      generation_method: ishtiqaq
      justification: "من الجذر «عكر» على وزن فُعَالَة، دردي الزيت وكَدَر المائعات، أقرّه مجمع اللغة العربية قياساً"
    - lemma: "ثُفَالَة"
      generation_method: ishtiqaq
      justification: "من الجذر «ثفل» على وزن فُعَالَة، مرادف للثُّفْل، ورد في المعجمات المصطلحية الحديثة بمعنى الراسب"

stage2_evidence:
  per_lemma:
    - lemma: "ثُفْل"
      confirm:
        - text: "«الثُّفْلُ، بالضم، والثافِلُ: ما اسْتَقَرَّ تَحْتَ الشيءِ من كُدْرَةٍ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الثفل) ما يبسط تحت الرحى عند الطحن وما استقرّ تحت الماء ونحوه من كدر وما يتبقى من المادة بعد عصيرها (مج)»"
          source: "المعجم الوسيط"
        - text: "«ثُفْل كلّ شيء وثافِلُه: ما استقرّ تحته من كَدَره. الليث: الثُّفْل ما رَسَب خُثَارته وعَلا صَفْوُه من الأشياء كلها»"
          source: "لسان العرب لابن منظور"
        - text: "«الثُّفْلُ مِثْلُ قُفْلٍ حُثَالَةُ الشَّيْءِ وَهُوَ الثَّخِينُ الَّذِي يَبْقَى أَسْفَلَ الصَّافِي»"
          source: "المصباح المنير للفيّومي"
      expands:
        - text: "«الثّفل: بالضم وسكون الفاء هو ما ثفل من كل شيء. وثفل الغذاء ما خرج من الدّبر. وثفل البول هو الذي يستفصله العروق عن الغذاء»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "توسيع الاستعمال ليشمل ثفل الغذاء وثفل البول في السياق الطبي"

    - lemma: "حُثَالَة"
      confirm:
        - text: "«الطِّيبِ والدُّهْنِ وما أَشْبَهَهُما: ثُفْلُه»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«(الحثالة) الرَّدِيء من كل شيء والنفاية من الحبّ والتمر ونحوهما ومن الناس رذالهم وشرارهم»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأولى والغالبة هي الرداءة والنفاية لا الترسّب المادي"
      expands:
        - text: "«حُثَالَةُ الدُّهْنِ وَمَا أَشْبَهَهُ: ثُفْلُهُ. وَالْمُحْثَلُ: السَّيِّئُ الْغِذَاءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على سوء وحقارة، والحثالة تُطلق على ثفل الدهن مجازاً من باب الرداءة"

    - lemma: "رواسب القاع"
      evidence_status: "no_material_found"

    - lemma: "رُسَابَة"
      confirm:
        - text: "«(الرسابة) ما يرسب أسفل الإناء والنهر والمسيل»"
          source: "المعجم الوسيط"
        - text: "«ما يَرْسُبُ أَسْفَلَ الإناءِ والنَّهْر والمَسِيل»"
          source: "المعجم الكبير"
        - text: "«(1) ثُفْل؛ ثُفالة (2) الرُّسابَة؛ الرَّسوب: مادة ترسّبها المياه أو الريح إلخ»"
          source: "المورد الحديث"
      expands:
        - text: "«ثفل، رسابة» = sediment"
          source: "المعجم الموحد لمصطلحات الكيمياء"
          addition: "المصطلح معتمد رسمياً في المعجمات المصطلحية العربية الموحّدة"

    - lemma: "دُرْدِيّ"
      confirm:
        - text: "«(الدردي) ما رسب أسفل العسل والزيت ونحوهما من كل شيء مائع كالأشربة والأدهان»"
          source: "المعجم الوسيط"
        - text: "«دُرْدِيُّ الزَّيْتِ وغَيْرِه: ما يَبْقَى فى أسْفَل وِعائِه»"
          source: "المعجم الكبير"
        - text: "«ما يَرْكُدُ في أَسْفَلِ كُلِّ مائِعٍ, كالأَشْرِبَةِ والأدْهانِ»"
          source: "المعجم الكبير"
      expands:
        - text: "«العَكِرُ: دُرْدِيُّ الزَّيتِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُربط الدُّرْدِيّ بجذر عكر الدالّ على التجمّع والتراكم"

    - lemma: "عُكَارَة"
      contradicts:
        - text: "«عُكَارة — الرأي: مرفوضة — السبب: لعدم ورودها في المعاجم القديمة. الصواب والرتبة: ترسَّبت العُكارة في قعر الإناء [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "اللفظ مرفوض تراثياً وإن أجازه المجمع قياساً، ودلالته الأساسية على العكورة والكدورة لا على الراسب المستقرّ"

    - lemma: "ثُفَالَة"
      confirm:
        - text: "«ثُفَالَة» = sediment"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"
      contradicts:
        - text: "«الثِّفَالُ مِثْلُ كِتَابٍ جِلْدٌ أَوْ نَحْوُهُ يُوضَعُ تَحْتَ الرَّحَى»"
          source: "المصباح المنير للفيّومي"
          conflict: "الثِّفال/الثِّفالة في المعاجم الكلاسيكية هو ما يُبسط تحت الرحى، لا الراسب. والثُّفَالَة بالضمّ استعمال مُحدَث"

stage3_analysis:
  per_lemma:
    - lemma: "ثُفْل"
      decision: confirmed
      decision_reason: >
        لفظ تراثي أصيل مؤصَّل في جميع المعاجم الكلاسيكية والحديثة بمعنى ما استقرّ تحت الشيء
        من كدرة وخثارة. الجذر «ثفل» في مقاييس اللغة أصل واحد يدلّ على الاستقرار تحت الشيء.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ العامّ الشامل لكلّ ما يستقرّ من كَدَر، سواء في إناء أو غيره، ويشمل الثُّفْل الجامد والسائل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثُفْل"

    - lemma: "حُثَالَة"
      decision: confirmed
      decision_reason: >
        اللفظ وارد في المعاجم بمعنى ثُفْل الدهن والطيب وإن كان المعنى الأوّل هو الرديء
        من كل شيء. الاستعمال في سياق الترسّب ثابت وإن كان أقلّ شيوعاً من المعنى التقييمي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يحمل دلالة تقييمية سلبية (الرديء/النفاية) إضافة إلى الدلالة المادية، ويُستعمل أكثر للدهون والطيوب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُثَالَة"

    - lemma: "رواسب القاع"
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ لا وحدة معجمية ثابتة. يمكن استبدال «القاع» بـ«الأسفل» أو «القعر»
        دون تغيّر المعنى (فشل في اختبار السكّ). لم يرد في أيّ معجم كمصطلح مستقلّ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "رُسَابَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ تراثي مؤصَّل في المعجم الوسيط والكبير بتعريف مطابق تماماً للمجموعة الترادفية:
        «ما يرسب أسفل الإناء والنهر والمسيل». معتمد في المعجمات المصطلحية الموحّدة (كيمياء، هندسة مدنية، مياه).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ تحديداً على المادة المترسّبة في السوائل والمجاري المائية، وهو الأقرب إلى المصطلح العلمي الدقيق"
      actions:
        - command: create_entry
          params: {lemma: "رُسَابَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "دُرْدِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ تراثي ثابت في المعجم الوسيط والكبير ولسان العرب بمعنى «ما يركد في أسفل كلّ مائع».
        التعريف مطابق لتعريف المجموعة. استعماله واسع في التراث العربي خاصة في سياق الأشربة والأدهان.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بما يركد في أسفل المائعات كالأشربة والأدهان والعسل، وله طابع حسّي ملموس أكثر من «ثُفْل»"
      actions:
        - command: create_entry
          params: {lemma: "دُرْدِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عُكَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ مرفوض تراثياً ولم يرد في المعاجم القديمة وإن أجازه المجمع قياساً.
        دلالته الأساسية على العكورة والكدورة (turbidity) لا على الراسب المستقرّ (sediment).
        لا يصحّ إدراجه في مجموعة الرواسب المستقرّة.

    - lemma: "ثُفَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        الثِّفَالَة في المعاجم الكلاسيكية هي ما يُبسط تحت الرحى عند الطحن، وليست الراسب.
        الاستعمال بمعنى الراسب مُحدَث ومقتصر على المعجمات المصطلحية ويُحدث لَبْساً مع المعنى التراثي.
        وجود «ثُفْل» من الجذر نفسه يُغني عنها.

