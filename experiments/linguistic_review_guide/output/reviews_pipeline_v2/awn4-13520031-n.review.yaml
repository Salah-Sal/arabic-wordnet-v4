stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي يصف المظهر (ارتفاع الأسعار) دون ذكر الآلية الاقتصادية (زيادة النقد المتداول وتناقص القوة الشرائية)"
      - "اللمّة «ارتفاع الأسعار» تصف العَرَض لا الظاهرة ذاتها، فهي أقرب إلى الوصف منها إلى المصطلح"
    observations: "المفهوم اقتصادي كلي (ماكرو) راسخ في الاستعمال العربي المعاصر. المصطلح الأساسي «تَضَخُّم» مولَّد حديث على وزن تَفَعُّل من جذر ض-خ-م، أُقِرّ مجمعيّاً. التعبير «ارتفاع الأسعار» شائع إعلامياً لكنه يصف النتيجة لا السبب. يحتاج التعريف إلى إعادة صياغة تُبرز البُعد النقدي."
  blind_candidates:
    - lemma: "تَضَخُّم"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من جذر ض-خ-م الدال على العِظَم ومجاوزة الحد، استُعمل مجازاً للدلالة على انتفاخ الكتلة النقدية وارتفاع الأسعار"
    - lemma: "غَلَاء"
      generation_method: ishtiqaq
      justification: "من جذر غ-ل-و الدال على الارتفاع ومجاوزة القدر، يدل على ارتفاع السعر عن حدّه المعتاد"
    - lemma: "ارْتِفَاعُ الأَسْعَارِ"
      generation_method: tarkib
      justification: "تركيب إضافي اصطلاحي ثابت في الخطاب الاقتصادي والإعلامي العربي للدلالة على صعود مستوى الأسعار"
    - lemma: "تَضَخُّمٌ نَقْدِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يخصّص التضخم بالجانب النقدي، مستعمل في المعاجم الموحدة (القانون والنقل)"

stage2_evidence:
  per_lemma:
    - lemma: "تَضَخُّم"
      confirm:
        - text: "«(في علم الاقتصاد) Inflation (E, F): تناقصُ قيمة العُمْلة الشرائية؛ نتيجةَ الزيادةِ المفرطة في النقد المتداول من غير غطاء ذهبيٍّ أو فضيٍّ؛ الأمرُ الذي يُؤَدِّي إلى ارتفاع أسعار الخدمات والمنتجات, وهو خلل في العلاقة بين النقد المتداول والمنتج القومي الفعليّ»"
          source: "المعجم الكبير"
        - text: "«(التضخم) (فِي الاقتصاد) زِيَادَة النُّقُود أَو وَسَائِل الدّفع الْأُخْرَى على حَاجَة الْمُعَامَلَات (مج)»"
          source: "المعجم الوسيط"
        - text: "«زيادة في المستوى العام للأسعار على مدى فترة من الزمن.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ARABTERM)"
        - text: "«inflation — تضخم»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«inflation — تضخم»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«يمكن تصويب استعمال الفعل «تضخَّم» على أنه مطاوع «ضَخَّمَ» لأن قياس المطاوعة لـ «فعَّل» هو «تفعَّل»، وقد ورد الفعل ومصدره في بعض المعاجم الحديثة، فقد قال الوسيط: ضخَّمه: جعله ضخمًا، كما ذكر «التضخّم» بمدلوله الاقتصادي. ويبدو أن من ولّد صيغتي «التضخم» و «التضخيم» قد لاحظ معنى الزيادة المفرطة، والخروج في الضخامة عن الحد المعتاد.»"
          source: "معجم الصواب اللغوي"
          addition: "تأصيل صرفي للمصطلح وتأكيد فصاحته"
        - text: "«(في الطب) Enlargement (E): زيادةٌ في حجم عضو, أو نسيج؛ بسبب زيادة حجم الخلايا فيه»"
          source: "المعجم الكبير"
          addition: "دلالة طبية موازية للمصطلح تؤكد المعنى الأصلي (الزيادة في الحجم)"

    - lemma: "ارْتِفَاعُ الأَسْعَارِ"
      confirm:
        - text: "«زيادة الأسعار — price increase»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
      expands:
        - text: "«(3) «ب» ارتفاع كبير في الأسعار ناشئ عن التضخُّم المالي (اد).»"
          source: "المورد الحديث"
          addition: "يعتبر ارتفاع الأسعار نتيجةً للتضخم لا مرادفاً له"

    - lemma: "غَلَاء"
      confirm:
        - text: "«(الغلاء) ارْتِفَاع السّعر»"
          source: "المعجم الوسيط"
        - text: "«ارتفاع السعر»"
          source: "المعجم الوسيط (OCR)"
      contradicts:
        - text: "«(الغلاء) ارْتِفَاع السّعر»"
          source: "المعجم الوسيط"
          conflict: "الغلاء يدل على ارتفاع السعر بشكل مطلق دون تخصيص بالظاهرة الاقتصادية الكلية المستمرة (التضخم)، فهو أعم من المطلوب"

    - lemma: "تَضَخُّمٌ نَقْدِيٌّ"
      confirm:
        - text: "«تضخم نقديّ — monetary inflation»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«تضخم مالي — زيادة في نسبة العملة فيما يخص توافر الأصول والسلع والبضائع والخدمات...»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      contradicts:
        - text: "«تضخم نقديّ — monetary inflation»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "التضخم النقدي نوع خاص من التضخم (ناتج عن زيادة عرض النقد تحديداً) وليس مرادفاً للمفهوم العام"

stage3_analysis:
  per_lemma:
    - lemma: "تَضَخُّم"
      decision: confirmed
      decision_reason: "مصطلح اقتصادي مستقر أقرّه مجمع اللغة العربية بالقاهرة، ورد في المعجم الوسيط والمعجم الكبير ومعاجم ALECSO المتخصصة بدلالة inflation، وصوّبه معجم الصواب اللغوي قياساً على باب المطاوعة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح فني دقيق يدل على الظاهرة الاقتصادية الكلية بأبعادها النقدية والسعرية، يُستعمل في السياقات العلمية والرسمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَضَخُّم"

    - lemma: "ارْتِفَاعُ الأَسْعَارِ"
      decision: confirmed
      decision_reason: "تعبير إضافي اصطلاحي ثابت في الخطاب الاقتصادي والإعلامي العربي، يصف المظهر الرئيسي للتضخم (صعود الأسعار)، وهو المقابل المباشر لـ rising prices في OEWN"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير وصفي يركّز على المظهر الخارجي للتضخم (صعود الأسعار) دون الإشارة إلى الآلية النقدية، أقرب إلى لغة الإعلام والتداول اليومي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ارْتِفَاعُ الأَسْعَارِ"

    - lemma: "غَلَاء"
      source: stage1
      decision: removed
      decision_reason: "الغلاء يدل على ارتفاع السعر بإطلاق (سواء أكان مؤقتاً أم دائماً، جزئياً أم شاملاً)، ولا يختص بالظاهرة الاقتصادية الكلية المستمرة التي يعبّر عنها التضخم. فالعلاقة بينهما عموم وخصوص: كل تضخم يُفضي إلى غلاء، وليس كل غلاء تضخماً"
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَضَخُّمٌ نَقْدِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "التضخم النقدي (monetary inflation) نوع خاص من التضخم ينتج تحديداً عن زيادة عرض النقد، بينما المجموعة الترادفية تعبّر عن المفهوم العام للتضخم بجميع أسبابه (نقدية وتكاليفية وهيكلية)"
      evidence_assessment:
        case: mixed

