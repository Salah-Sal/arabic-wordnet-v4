# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13475652-n
# coagulation / curdling / clotting
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تجلط، تخثر) غير مشكّلتين — يجب إضافة التشكيل الكامل"
      - "التعريف العربي الحالي ترجمة حرفية للتعريف الإنجليزي، ويمكن تحسينه بأسلوب المعجم الوسيط"
    observations: >
      المفهوم يشمل عملية طبيعية عامة تتحوّل فيها مادة سائلة إلى كتل شبه صلبة، سواء
      في الدم (تجلّط) أو اللبن (تخثّر/تروّب) أو غيرهما. الجذران «خثر» و«جلط» لهما
      أصول عربية صحيحة في المعاجم الكلاسيكية. الجذر «خثر» يدلّ على الغِلَظ في الشيء
      مع استرخاء (ابن فارس)، والجذر «جلط» أصله التجرّد، لكنّ «الجُلْطة» في القاموس
      المحيط هي الجُزعة الخاثرة من الرائب، مما يُثبت الصلة بالتخثّر.
  blind_candidates:
    - lemma: "تَخَثُّر"
      generation_method: ishtiqaq
      justification: >
        من الجذر «خثر» الدالّ على الغِلَظ في السائل، على وزن تَفَعُّل (مصدر الفعل
        الخماسي تَخَثَّرَ). أنسب مصطلح للدلالة على عملية التحوّل من الحالة السائلة
        إلى شبه الصلبة، وهو مستعمل في العلوم الطبيعية والطبية.
    - lemma: "تَرَوُّب"
      generation_method: ishtiqaq
      justification: >
        من الجذر «روب» على وزن تَفَعُّل. الرَّوْب هو اللبن الخاثر في العربية
        الكلاسيكية، والتَّرَوُّب عملية تحوّل السائل إلى حالة خاثرة، خاصةً في اللبن.
    - lemma: "تَجَبُّن"
      generation_method: ishtiqaq
      justification: >
        من الجذر «جبن» على وزن تَفَعُّل. تَجَبَّنَ اللبنُ أي صار كالجُبْن،
        وهو يصف تحوّل السائل إلى كتل شبه صلبة بفعل ترسّب البروتين.
    - lemma: "تَكَتُّل"
      generation_method: ishtiqaq
      justification: >
        من الجذر «كتل» على وزن تَفَعُّل. الكُتْلة هي القطعة المجتمعة من الشيء،
        والتَّكَتُّل عملية تشكّل الكتل في وسط سائل، وهو وصف مباشر للمفهوم.

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَجَلُّط"
      confirm:
        - text: "«(تجلط) الدَّم تجمد دَاخل الأوعية الدموية وخارجها (مج)»"
          source: "المعجم الوسيط"
        - text: "«الدَّمُ: تجمَّد داخل الأَوْعِيَةِ الدَّمَوِيَّةِ أو خَارِجها»"
          source: "المعجم الكبير"
        - text: "«تجمد الدم داخل الأوعية الدموية أو خارجها.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985) — clotting"
        - text: "«تكون الجلط.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985) — coagulation"
        - text: "«في معالجة المياه، يحدث التجلط عند إضافة مجلط إلى الماء بهدف زعزعة استقرار المادة الغروانية المعلقة»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«الجُلْطَةُ، بالضم: الجُزْعةُ الخاثِرةُ من الرائبِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الجذر «جلط» له صلة قديمة بالتخثّر عبر الجُلْطة (الكتلة الخاثرة من اللبن الرائب)"
        - text: "«(جَلَطَ) الْجِيمُ وَاللَّامُ وَالطَّاءُ أَصْلٌ عَلَى قِلَّتِهِ مُطَّرِدُ الْقِيَاسِ، وَهُوَ تَجَرُّدُ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يدلّ على التجرّد والانسلال، والدلالة الطبية مولّدة حديثاً"

    - lemma: "تَخَثُّر"
      confirm:
        - text: "«(في علم الأحياء): يُطلق على تكوين الخَثْرة فى اللبن أو في الدَّم»"
          source: "المعجم الكبير"
        - text: "«التَّخَثُّرُ التاجيُّ (في علم الطِّبِّ): تَجَلُّطُ الدَّم في الشَّرايين التاجيَّةِ بسَبب تغيُّيرٍ مَرَضيٍّ في جُدُرِها أو في الدَّم»"
          source: "المعجم الكبير"
        - text: "«تحويل الحالة الغروية السائلة إلى حالة هلامية دون إمكانية عكس العملية.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«في هندسة الصرف الصحيّ: توفير حالة من عدم الاستقرار للمواد غير الذائبة والموزّعة غروانياً، وذلك من أجل إتاحة تجميعها»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«(خَثِرَ) الْخَاءُ وَالثَّاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى غِلَظٍ فِي الشَّيْءِ مَعَ اسْتِرْخَاءٍ. يُقَالُ خَثِرَ اللَّبَنُ، وَهُوَ خَاثِرٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الدلالي للجذر خثر هو الغِلَظ مع الاسترخاء، وهو مطابق تماماً لمفهوم التخثّر"
        - text: "«تَرْوِيب (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يذكر التَّرْوِيب مرادفاً عربياً للتَّخَثُّر"

    # ── المرشحات ──
    - lemma: "تَرَوُّب"
      evidence_status: "no_material_found"

    - lemma: "تَجَبُّن"
      contradicts:
        - text: "«(في علم الطب caseation): تَحَوُّلُ الأَنْسِجَةِ المريضَة إلى كُتْلَةٍ مُحَبَّبَةٍ مُتَلَبِّكَةٍ تُشْبه الجُبْن وبخاصة في الإصاباتِ الدَّرَنِيّة»"
          source: "المعجم الكبير"
          conflict: "التَّجَبُّن مصطلح طبي مخصّص لتحوّل الأنسجة النخرة (caseation)، لا للتخثّر العام"
        - text: "«(تجبن) اللَّبن صَار كالجبن»"
          source: "المعجم الوسيط"
          conflict: "الفعل تجبّن يختصّ باللبن، ودلالته أضيق من التخثّر/التجلّط العام"
      expands:
        - text: "«تَجَبُّن = caseation»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المصطلح استقرّ في الطب بمعنى caseation وليس coagulation"

    - lemma: "تَكَتُّل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَجَلُّط"
      decision: confirmed
      decision_reason: >
        مصطلح مولّد أقرّه مجمع اللغة العربية بالقاهرة، ثابت في المعاجم الحديثة (الوسيط،
        الكبير) ومعاجم المصطلحات العلمية (الكيمياء، الطب، هندسة المياه). يدلّ على تجمّد
        السوائل وتشكّل الجلطات. الجذر «جلط» له سند كلاسيكي عبر «الجُلْطة» (الكتلة
        الخاثرة من الرائب) في القاموس المحيط.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستعمل خاصّةً في سياق تجمّد الدم وتكوّن الجلطات الدموية (clotting/thrombosis)،
        وفي الكيمياء وهندسة المياه بمعنى coagulation. أكثر تخصّصاً بالسياق الطبي
        والكيميائي مقارنةً بـ«تَخَثُّر» الأعمّ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجَلُّط"

    - lemma: "تَخَثُّر"
      decision: confirmed
      decision_reason: >
        مصطلح ذو جذر عربي أصيل (خثر = الغِلَظ مع الاسترخاء)، مثبت في المعجم الكبير
        بتعريف دقيق للعملية البيولوجية. شائع في معاجم المصطلحات العلمية عبر ميادين
        متعددة (الأحياء، الفيزياء، الصيدلة، الجيولوجيا، الأرصاد، تقانات الأغذية، المياه).
        هو الأعمّ والأشمل بين مرادفات المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الأعمّ والأشمل: يُستعمل لكل أنواع التخثّر (اللبن، الدم، الغرويات،
        السوائل الصناعية). جذره الكلاسيكي «خثر» يدلّ أصالةً على غِلَظ اللبن.
        يقابل coagulation في أغلب الميادين العلمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَخَثُّر"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَرَوُّب"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد مادة معجمية مباشرة لمصدر «تَرَوُّب»، والشكل المستعمل في المعاجم
        هو «تَرْوِيب» (مصدر رَوَّبَ، وزن تَفْعِيل)، وهو يدلّ على إيقاع الفعل
        (جعل الشيء يتخثّر) لا على العملية ذاتها. كما أنّه مقصور على اللبن
        ولا يشمل التخثّر العام.

    - lemma: "تَجَبُّن"
      source: stage1
      decision: removed
      decision_reason: >
        استقرّ مصطلحاً طبياً متخصّصاً بمعنى caseation (تحوّل الأنسجة النخرة إلى
        كتلة تشبه الجبن)، وهو أضيق بكثير من مفهوم المجموعة الترادفية (coagulation).
        إضافته ستُحدث خلطاً دلالياً بين التخثّر العام والتنخّر الجبني الخاص.

    - lemma: "تَكَتُّل"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد مادة معجمية تربط «تَكَتُّل» بعملية التخثّر تحديداً. التكتّل
        يدلّ على التجمّع في كتل (agglomeration/aggregation)، وهو مفهوم أعمّ
        لا يستلزم التحوّل من الحالة السائلة إلى شبه الصلبة.

