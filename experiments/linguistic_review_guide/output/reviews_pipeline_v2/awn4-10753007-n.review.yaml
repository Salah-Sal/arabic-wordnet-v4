stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مُدِير الْحَبْل» تعبير مركب وصفي وليست مصطلحاً معجمياً ثابتاً، لكنها الصيغة الطبيعية الوحيدة المتاحة لمفهوم متخصص في لعبة أطفال"
      - "المفهوم شديد التخصص (شخص يُدير الحبل في لعبة نط الحبل) ولا يوجد له مصطلح مفرد في المعجم العربي"
    observations: "المجموعة تصف دوراً وظيفياً محدداً في لعبة القفز بالحبل (نط الحبل)، وهو أحد شخصين يمسكان طرفَي الحبل ويُديرانه ليقفز فوقه اللاعبون. المفهوم معروف ثقافياً لكنه لا يحظى بتسمية مخصصة في العربية، إذ يُوصف عادةً بعبارة حرة. اللمّة الموجودة تركيب إضافي شفاف من اسم الفاعل «مُدِير» (من أَدَارَ، الرباعي من دور) و«الحبل»."
  blind_candidates:
    - lemma: "مُدَوِّرُ الْحَبْل"
      generation_method: tarkib
      justification: "تركيب إضافي من اسم الفاعل «مُدَوِّر» (الفعل الثلاثي المزيد دَوَّرَ، باب التفعيل) و«الحبل». يدل على مَن يجعل الحبل يدور."
    - lemma: "حَبَّال"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر «حبل» على وزن فَعَّال (صيغة المبالغة / اسم الحرفة)، يدل على مَن يعمل بالحبال."
    - lemma: "مُرَجِّحُ الْحَبْل"
      generation_method: tarkib
      justification: "تركيب إضافي من اسم الفاعل «مُرَجِّح» (من رَجَّحَ = أرجح وحرّك) و«الحبل»، بمعنى مَن يُرجّح الحبل ذهاباً وإياباً."
    - lemma: "لَاوِي الْحَبْل"
      generation_method: tarkib
      justification: "تركيب إضافي من اسم الفاعل «لَاوٍ» (من لَوَى = فتل وأدار) و«الحبل»، بمعنى مَن يلوي الحبل ويُديره."

stage2_evidence:
  per_lemma:
    - lemma: "مُدِير الْحَبْل"
      expands:
        - text: "«(المدير) من يتولى تصريف أمر من الأمور كمدير الشركة ومدير المكتب ورئيس المديرية (محدثة)»"
          source: "المعجم الوسيط"
          addition: "الاستعمال المعاصر لـ«مدير» يغلب عليه المعنى الإداري، لكن الأصل الاشتقاقي من «أدار» (جعله يدور) يسوّغ الاستعمال الحرفي"
        - text: "«(المدير) (انظر دور)»"
          source: "المعجم الوسيط"
          addition: "إحالة صريحة إلى مادة «دور» تؤكد أن المدير مشتق من الإدارة بمعنى الدوران"
        - text: "«مَن يَتَوَلَّى تصرِيفَ أَمْرٍ مِنَ الأُمورِ, وهـو رَأسُ المسؤوليَّة بالنسبة لعمل مـا. كمُديرِ الشَّـرِكَة, ومدير الإدارة»"
          source: "المعجم الكبير"
          addition: "التعريف يركّز على المعنى الإداري المعاصر"
        - text: "«ما فتل من ليف ونحوه ليربط أو يقاد به»"
          source: "المعجم الوسيط (مادة حبل)"
          addition: "تعريف الحبل بمعناه المادي الأصلي يتوافق مع المقصود في المركب"
        - text: "«(دَوَرَ) الدَّالُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِحْدَاقِ الشَّيْءِ بِالشَّيْءِ مِنْ حَوَالَيْهِ. يُقَالُ دَارَ يَدُورُ دَوَرَانًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «دور» أصله الدلالي الإحداق والدوران، وهو المعنى الحرفي المقصود في «مُدير الحبل»"
    - lemma: "مُدَوِّرُ الْحَبْل"
      evidence_status: "no_material_found"
    - lemma: "حَبَّال"
      evidence_status: "no_material_found"
    - lemma: "مُرَجِّحُ الْحَبْل"
      expands:
        - text: "«الحليمُ»"
          source: "المعجم الكبير (مادة المرجح)"
          addition: "المعنى المعجمي المسجّل لـ«المرجح» هو الحليم الرزين، لا علاقة له بتحريك الحبل"
    - lemma: "لَاوِي الْحَبْل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُدِير الْحَبْل"
      decision: confirmed
      decision_reason: "تركيب إضافي شفاف ومطابق للمفهوم: «مُدِير» اسم فاعل من أَدَارَ (أفعل من دور = جعل الشيء يدور)، و«الحبل» المفعول. الاشتقاق سليم والمعنى الحرفي لـ«أدار» يسبق المعنى الإداري المحدَث. هو التعبير الأقرب والأكثر وضوحاً لهذا المفهوم المتخصص."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions: []
    - lemma: "مُدَوِّرُ الْحَبْل"
      source: stage1
      decision: removed
      decision_reason: "قريب جداً من اللمّة الموجودة لكنه يستخدم الفعل الثلاثي المزيد «دَوَّرَ» (التفعيل) بدل «أَدَارَ» (الإفعال). صيغة أَدَارَ/مُدِير أشيع وأخفّ على اللسان من دَوَّرَ/مُدَوِّر في هذا السياق، ولا حاجة لمرادف قريب لا يضيف فارقاً دلالياً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
    - lemma: "حَبَّال"
      source: stage1
      decision: removed
      decision_reason: "وزن فَعَّال يدل على صاحب الحرفة أو الكثير الفعل، فـ«حَبَّال» يعني صانع الحبال أو بائعها، لا مَن يُدير الحبل في لعبة. المعنى المعجمي الراسخ يتعارض مع دلالة المجموعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "مُرَجِّحُ الْحَبْل"
      source: stage1
      decision: removed
      decision_reason: "«رَجَّحَ» يدل على الترجيح والتأرجح (حركة بندولية)، لا على الدوران الدائري المطلوب في لعبة نط الحبل. فضلاً عن أن «المرجح» مسجّل في المعجم الكبير بمعنى «الحليم»، مما يُحدث لبساً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
    - lemma: "لَاوِي الْحَبْل"
      source: stage1
      decision: removed
      decision_reason: "«لَوَى» يدل على الفتل والليّ، وهو حركة التواء لا حركة دوران دائرية. المعنى لا يتطابق مع فعل إدارة الحبل في الهواء."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

stage4_content:
  definition:
    current: "أحد شخصين يديران الحبال ليقفز فوقها اللاعبون في لعبة القفز بالحبل"
    assessment:
      decision: retain
      reason: "التعريف دقيق وشامل: يحدد العدد (أحد شخصين)، والفعل (يديران الحبال)، والغاية (ليقفز فوقها اللاعبون)، والسياق (لعبة القفز بالحبل). صياغته عربية سليمة وغير منقولة حرفياً من الإنجليزية."
  examples:
    per_lemma:
      - lemma: "مُدِير الْحَبْل"
        examples:
          - text: "وقف مُدِيرا الحبل على جانبَي الملعب وأخذا يُديران الحبلَ بانتظام بينما تناوب الأطفالُ على القفز."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "وقف مُدِيرا الحبل على جانبَي الملعب وأخذا يُديران الحبلَ بانتظام بينما تناوب الأطفالُ على القفز."

