# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-15134874-n (ligand)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «لاقط» متعددة الدلالة (ميكروفون، لاقط شمسي، لاقط تيار) ولا تدلّ بذاتها على معنى الارتباط بالذرة المركزية"
      - "التعريف العربي ترجم radical بـ«أيون» وهو خطأ؛ radical = شقّ حرّ أو جذر كيميائي"
      - "اللمّتان الموجودتان بلا تشكيل"
    observations: >
      المفهوم ينتمي إلى الكيمياء التناسقية (coordination chemistry). الليغاند مادة ترتبط
      بذرة فلزية مركزية لتكوين معقّد تناسقي. الجذر «ربط» مناسب دلالياً لأن الليغاند هو
      «المربوط» بالذرة المركزية. أما «لقط» فدلالته الأصلية أخذ الشيء من الأرض بغتة،
      وقد توسّع استعماله التقني ليشمل الالتقاط الكهربي والصوتي، مما يولّد اشتراكاً لفظياً
      مُربكاً. المعجم الطبي الموحد يستعمل «لَجين» للدلالة على ligand وهو مصطلح جدير بالاعتبار.

  blind_candidates:
    - lemma: "رَابِطَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ر ب ط على وزن فاعِلة، بمعنى ما يرتبط بالذرة المركزية ويشكّل معها
        معقّداً تناسقياً. الجذر يدلّ على الشدّ والثبات.
    - lemma: "مُحِيطَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ح و ط على وزن مُفعِلة، بمعنى ما يحيط بالذرة المركزية، إشارة إلى
        الترتيب الفراغي للّيغاندات حول الذرة المركزية.
    - lemma: "مُتَنَاسِقَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن س ق على وزن مُتَفاعِلة، إشارة إلى الكيمياء التناسقية التي ينتمي
        إليها المفهوم.
    - lemma: "لِيغَنْد"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الإنجليزي ligand، يقبل لام التعريف (اللِّيغَنْد)
        والنسبة (لِيغَنْدِيّ) والجمع السالم (لِيغَنْدات).


stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "رَبِيطَة"
      confirm:
        - text: "«(الربيطة) الدَّوَابّ المربوطة (ج) ربائط»"
          source: "المعجم الوسيط (هَوَرامَني)"
        - text: "«الرَّبِيطَةُ: ما ارْتُبِطَ من الدَّوَّابِّ»"
          source: "المعجم الكبير"
        - text: "«الرَّبِيطَةُ: الدواب المربوطة»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«ربيطي: من (ر ب ط) نسبة إلى ربيط: المربوط، والراهب والزاهد، والشجاع القلب، أو نسبة إلى ربيطة: الدواب المربوطة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكد أن ربيطة على وزن فعيلة بمعنى مفعولة (المربوطة)، وهو الأساس الصرفي لاستعمالها في الكيمياء بمعنى المادة المرتبطة بالذرة المركزية"
        - text: "«(رَبَطَ) الرَّاءُ وَالْبَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى شَدٍّ وَثَبَاتٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ر ب ط يدلّ على الشدّ والثبات، وهو ملائم دلالياً لمفهوم الليغاند الذي يرتبط بالذرة المركزية"

    - lemma: "لَاقِط"
      contradicts:
        - text: "«(اللاقط) الَّذِي يلقط السنابل وَنَحْوهَا بعد الحصد أَو الجنى»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي للّاقط هو من يلتقط السنابل، لا علاقة له بالارتباط الكيميائي"
        - text: "«لاقط» = pick-up (الفيزياء)، «لاقط» = gleaner (الأحياء)"
          source: "معاجم أَرَبْتِرْم الموحدة (الفيزياء والأحياء)"
          conflict: "لاقط مستعمل بالفعل في الفيزياء بمعنى pick-up وفي الأحياء بمعنى gleaner، مما يولّد اشتراكاً لفظياً مُربكاً"
      expands:
        - text: "«نظرية الحقل الرابط، نظرية المجالات المتصلات، نظرية الحقل اللاقط» = ligand-field theory"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يظهر استعمال لاقط في سياق ligand-field theory لكنه واحد من ثلاثة بدائل، ليس المفضّل"
        - text: "«(لَقَطَ) اللَّامُ وَالْقَافُ وَالطَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى أَخْذِ شَيْءٍ مِنَ الْأَرْضِ قَدْ رَأَيْتَهُ بَغْتَةً»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ل ق ط يدلّ على أخذ شيء من الأرض بغتة، وهو بعيد دلالياً عن مفهوم الارتباط التناسقي"

    # ── المرشحات ──
    - lemma: "رَابِطَة"
      contradicts:
        - text: "«رابطة» = bond (الكيمياء)، «رَابِطَة» = bond (الصيدلة)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) والصيدلة (2009)"
          conflict: "رابطة مصطلح راسخ في الكيمياء بمعنى bond (الرابطة الكيميائية)، واستعمالها بمعنى ligand يولّد لبساً"
      expands:
        - text: "«(الرابطة) العلاقة والوصلة بَين الشَّيْئَيْنِ»"
          source: "المعجم الوسيط"
          addition: "المعنى العام صلة بين شيئين، لكن الاستعمال الكيميائي الثابت هو bond لا ligand"

    - lemma: "مُحِيطَة"
      evidence_status: "no_material_found"

    - lemma: "مُتَنَاسِقَة"
      evidence_status: "no_material_found"

    - lemma: "لِيغَنْد"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "رَبِيطَة"
      decision: confirmed
      decision_reason: >
        ربيطة على وزن فَعِيلة بمعنى مفعولة (المربوطة)، وهو وزن عربي أصيل. الجذر ر ب ط
        يدلّ على الشدّ والثبات وهو ملائم تماماً لمفهوم الليغاند الذي يرتبط بالذرة المركزية.
        المصطلح مسكوك من مجامع اللغة العربية ومتداول في الأدبيات الكيميائية العربية.
        المعنى القديم (الدواب المربوطة) لا يولّد لبساً في السياق العلمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مجمعي كيميائي دقيق على وزن فَعِيلة بمعنى مفعولة، يدلّ على المادة المرتبطة بالفلز المركزي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَبِيطَة"

    - lemma: "لَاقِط"
      decision: removed
      decision_reason: >
        لاقط (من لقط = أخذ الشيء من الأرض) بعيد دلالياً عن مفهوم الارتباط التناسقي.
        اللفظة شديدة التعدد الدلالي في المصطلحية العربية الحديثة (ميكروفون، لاقط شمسي،
        لاقط تيار، pick-up)، مما يولّد لبساً. ظهورها في سياق الكيمياء محصور في
        «نظرية الحقل اللاقط» وهو واحد من ثلاثة بدائل وليس المفضّل. المعاجم المتخصصة
        لا تسجّل «لاقط» بمعنى ligand مستقلاً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── المرشحات ──
    - lemma: "رَابِطَة"
      source: stage1
      decision: removed
      decision_reason: >
        رابطة مصطلح راسخ في الكيمياء العربية بمعنى bond (الرابطة التساهمية، الرابطة
        الأيونية...). استعمالها بمعنى ligand يولّد لبساً خطيراً مع مصطلح أساسي في المجال نفسه.

    - lemma: "مُحِيطَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا سند معجمي ولا مصطلحي. اللفظة وصفية عامة (ما يحيط) ولا تحمل دلالة كيميائية
        محددة. لم تُسجَّل في أي معجم متخصص بهذا المعنى.

    - lemma: "مُتَنَاسِقَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا سند معجمي. اللفظة مشتقة من «تناسق» وهي وصفية عامة. الكيمياء التناسقية
        تستعمل «تناسقي» صفةً لا اسماً للدلالة على الليغاند.

    - lemma: "لِيغَنْد"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب غير ضروري مع وجود «ربيطة» المسكوكة من المجامع اللغوية. المعجم الطبي
        الموحد يستعمل «لَجين» لا «ليغند» كتعريب. لا داعي لإدخال تعريب إضافي.


stage4_content:
  definition:
    current: "مادة (ذرة أو جزيء أو أيون) تشكل معقداً حول ذرة مركزية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يترجم radical بـ«أيون» وهو خطأ (radical = شقّ حرّ، وأيون = ion).
        كما أنه يحتاج تدقيقاً أسلوبياً ليناسب المعجمية العربية. ينبغي ذكر السياق التناسقي
        صراحة.
    authored:
      - type: terminological
        text: "مادّةٌ — ذَرَّةً كانت أو جُزَيْئًا أو شَقًّا حُرًّا أو أَيُونًا — تَرتبِطُ بِذَرَّةٍ فِلِزِّيَّةٍ مَركزيَّةٍ لِتَكوينِ مُعَقَّدٍ تَناسُقِيّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "في الكيمياء التناسقيّة: كُلُّ ذَرَّةٍ أو جُزَيْءٍ أو أَيُونٍ أو شَقٍّ حُرٍّ يَمنَحُ زَوجًا إلكترونِيًّا أو أكثرَ لِذَرَّةٍ فِلِزِّيَّةٍ مَركزيَّةٍ فَيَنشأُ مُعَقَّدٌ تَناسُقِيٌّ. تُصَنَّفُ الرَّبائِطُ بِحَسَبِ عَدَدِ أَزواجِ الإلكتروناتِ المانِحَةِ إلى أُحادِيَّةِ السِّنِّ وثُنائِيَّتِهِ ومُتَعدِّدَتِهِ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ — ذَرَّةً كانت أو جُزَيْئًا أو شَقًّا حُرًّا أو أَيُونًا — تَرتبِطُ بِذَرَّةٍ فِلِزِّيَّةٍ مَركزيَّةٍ لِتَكوينِ مُعَقَّدٍ تَناسُقِيّ."

  examples:
    per_lemma:
      - lemma: "رَبِيطَة"
        examples:
          - text: "يَحتوي المُعَقَّدُ التَّناسُقِيُّ على سِتِّ رَبائِطَ من الأمُونْيا مُرتبِطَةٍ بِأَيُونِ الكوبَلْتِ المَركزيّ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يَحتوي المُعَقَّدُ التَّناسُقِيُّ على سِتِّ رَبائِطَ من الأمُونْيا مُرتبِطَةٍ بِأَيُونِ الكوبَلْتِ المَركزيّ."


