# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15061906-n (antigen)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مستضد، مولد الضد) بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "صيغة «مولد الضد» أقل شيوعاً في المعاجم الموحدة من «مولد المضاد» — تحتاج تحقيقاً"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي — يمكن تحسينه بأسلوب معجمي عربي"
    observations: >
      المفهوم مصطلح طبي/مناعي حديث لا أصل تراثي له في المعاجم العربية الكلاسيكية.
      لمّة «مستضد» مصوغة على وزن مُسْتَفْعِل (اسم فاعل من استفعل) من الجذر ض-د-د،
      بمعنى ما يستثير إنتاج الأضداد (الأجسام المضادة). وهي صياغة اشتقاقية عربية ناجحة
      حازت قبول المجامع اللغوية. أما «مولد الضد» فمركب إضافي يصف وظيفة المادة (توليد الضد).
  blind_candidates:
    - lemma: "مُسْتَضِدّ"
      generation_method: ishtiqaq
      justification: >
        على وزن مُسْتَفْعِل من استضدّ (استفعل من الضد)، أي المادة التي تستثير إنتاج الأضداد
        (الأجسام المضادة). الوزن مناسب دلالياً لأن مُسْتَفْعِل يدل على الطلب والاستثارة.
    - lemma: "مُوَلِّدُ المَنَاعَةِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «مُوَلِّد» (اسم فاعل من ولّد) و«المناعة»، يصف المادة
        بأنها تولّد الاستجابة المناعية. وهو أقرب إلى مفهوم immunogen منه إلى antigen.
    - lemma: "مُحَفِّزُ المَنَاعَةِ"
      generation_method: tarkib
      justification: >
        مركب إضافي يصف الوظيفة الأساسية للمستضد وهي تحفيز الجهاز المناعي.
        «محفّز» اسم فاعل من حفّز الرباعي على وزن مُفَعِّل.
    - lemma: "أَنْتِيجِين"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الأجنبي antigen. يقبل لام التعريف (الأنتيجين)
        والنسبة (أنتيجيني) والجمع السالم (أنتيجينات). ملاذ أخير لعدم وجود بديل تراثي.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَضِدّ"
      confirm:
        - text: "«مركب يحرض، إثر دخوله البدن، الجملة المناعية على تكوين أضداد نوعية له قادرة على إبطال مفعوله ومنع تأثيراته الحيوية.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مادة تنشأ عن حقنها في الجسم مادة مضادة لها.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«مادة أو جزيء غريبة يتم التعرف عليها من قبل النظام المناعي. جزيء دخيل يمكن أن يأتي من المواد الغريبة مثل البكتيريا أو الفيروسات.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«مُسْتضِدّ = antigen» (بدون تعريف — مصطلح فقط)"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          addition: "يؤكد اعتماد المصطلح في معاجم ALECSO المتعددة"
        - text: "«مُسْتَضِدٌّ مُنَشَّط = activated antigen»، «مُسْتَضِدٌّ نَوْعِيّ = specific antigen»، «مُسْتَضِدٌّ سَطْحِيّ = surface antigen»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "ورود المصطلح في عشرات المركبات الوصفية يدل على رسوخه واشتقاقيته العالية"

    - lemma: "مُوَلِّد الضِّدّ"
      confirm:
        - text: "«مستضِدّ، مُولِّد المضاد = antigen، مادة تنشأ من حقنها في الجسم أجسام مضادة لها.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«مولد المضاد = antigen»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      expands:
        - text: "«يتفاعل الضد مع المستضد فيبطل مفعوله» — ورد ذكر المستضد في تعريف الضد (antibody)"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "الصيغة الشائعة في المعاجم هي «مولد المضاد» وليس «مولد الضد» — فرق في الجزء الثاني من المركب"

    - lemma: "مُوَلِّدُ المَنَاعَةِ"
      contradicts:
        - text: "«مُسْتَمْنِع، مولِّد المناعة = immunogen»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: "مُوَلِّد المناعة مصطلح مقابل لـ immunogen وليس antigen — يوجد فرق دلالي بينهما"
        - text: "«مُسْتَمْنِع = immunogen»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "immunogen ≠ antigen في الاصطلاح الطبي الدقيق"

    - lemma: "مُحَفِّزُ المَنَاعَةِ"
      evidence_status: "no_material_found"

    - lemma: "أَنْتِيجِين"
      expands:
        - text: "«جلوبيولينات مناعية تتفاعل مع الأنتيجينات»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "ورد المصطلح المعرّب «الأنتيجينات» في معجم طبي واحد فقط، لكنه غير معتمد من ALECSO"

# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ١ ──
    - lemma: "مُسْتَضِدّ"
      decision: confirmed
      decision_reason: >
        مصطلح مشتق اشتقاقاً سليماً على وزن مُسْتَفْعِل من الجذر ض-د-د، معتمد من المجامع
        اللغوية العربية (ALECSO) وشائع في المعاجم الطبية الموحدة. ورد في أكثر من عشرة معاجم
        موحدة بتعريفات واضحة تتطابق مع دلالة المجموعة. يتميز باشتقاقية عالية (مُسْتَضِدّي،
        مُسْتَضِدّات، تَفاعُل مُسْتَضِدّي).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الأساسي المعتمد في المعاجم الموحدة العربية، يركّز على البُعد الاشتقاقي
        (استثارة إنتاج الأضداد) وهو أكثر إيجازاً واشتقاقية من المرادف المركب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَضِدّ"

    # ── لمّة موجودة ٢ ──
    - lemma: "مُوَلِّدُ الضِّدِّ"
      decision: confirmed
      decision_reason: >
        مركب إضافي وارد بصيغة قريبة «مولد المضاد» في معاجم ALECSO (الأحياء والبيطرة).
        صيغة «مولد الضد» مقبولة لأن «الضد» يُستعمل في الطب العربي بمعنى antibody
        كما في المعجم الطبي الموحد. المركب يصف الوظيفة (توليد الأضداد) وهو أوضح
        للقارئ غير المتخصص من «مستضد».
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        مركب إضافي وصفي يشفّ عن المعنى مباشرة (ما يولّد الضد/الجسم المضاد)،
        أوضح دلالياً من «مستضد» لكنه أطول وأقل اشتقاقية. يُفضَّل في السياقات التعليمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَلِّدُ الضِّدِّ"

    # ── مرشح المرحلة ١: مُوَلِّدُ المَنَاعَةِ ──
    - lemma: "مُوَلِّدُ المَنَاعَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تؤكد أن «مولّد المناعة» مقابل لـ immunogen وليس antigen.
        هناك فرق دلالي دقيق بين المصطلحين: المستضد (antigen) هو ما يُتعرَّف عليه
        مناعياً، والمُسْتَمْنِع (immunogen) هو ما يولّد استجابة مناعية فعلية.

    # ── مرشح المرحلة ١: مُحَفِّزُ المَنَاعَةِ ──
    - lemma: "مُحَفِّزُ المَنَاعَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثَر على أي شاهد معجمي لهذا المركب بوصفه مصطلحاً ثابتاً.
        لا يجتاز اختبار التثبيت المعجمي، وهو عبارة وصفية حرة وليس وحدة
        اصطلاحية مسكوكة.

    # ── مرشح المرحلة ١: أَنْتِيجِين ──
    - lemma: "أَنْتِيجِين"
      source: stage1
      decision: removed
      decision_reason: >
        ورد في معجم واحد فقط بصيغة الجمع «الأنتيجينات» وهو غير معتمد من ALECSO.
        وجود البديل العربي المشتق «مستضد» يجعل التعريب غير مبرر وفق مبدأ إيثار العربي.

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
