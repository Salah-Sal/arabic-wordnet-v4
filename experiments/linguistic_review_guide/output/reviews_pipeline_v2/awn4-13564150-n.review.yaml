# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13564150-n
# psychoanalytic process — عملية التحليل النفسي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة عبارة وصفية مركّبة من أربع كلمات (عملية التحليل النفسي)، وليست مصطلحاً مسكوكاً مستقلاً"
      - "التعريف العربي ترجمة حرفية شبه كاملة من التعريف الإنجليزي"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهي تكاد تكون إعادة صياغة للتعريف ذاته"
    observations: "المفهوم يشير إلى الأصناف العامة للعمليات المفترضة في نظرية التحليل النفسي (كالكبت والإسقاط والتحويل ونحوها)، وهو مفهوم تصنيفي تجريدي لا يقابله في العربية مصطلح واحد مسكوك، بل يُعبَّر عنه عادةً بتركيب إضافي. المجال متخصص (علم النفس التحليلي) والمفهوم فوقي (hypernym) يجمع تحته عمليات نفسية تحليلية متعددة."

  blind_candidates:
    - lemma: "سِيرُورَة تَحْلِيلنَفْسِيَّة"
      generation_method: tarkib
      justification: "سِيرُورَة مصطلح فلسفي-علمي راسخ يقابل process بدقة أكبر من عملية، وتَحْلِيلنَفْسِيَّة نسبة إلى التحليل النفسي كوحدة مفهومية واحدة على نمط التركيب النِّسبي الحديث"
    - lemma: "آلِيَّة تَحْلِيلنَفْسِيَّة"
      generation_method: tarkib
      justification: "آلية تُستعمل كثيراً في الخطاب النفسي (آلية دفاعية، آلية الكبت)، وهي أقرب إلى المفهوم من عملية حين يُراد الإشارة إلى طريقة اشتغال نفسية مفترضة"
    - lemma: "مُجْرَيَات التَّحْلِيل النَّفْسِيّ"
      generation_method: tarkib
      justification: "مُجريات جمع مُجرَى على وزن مَفْعَلة يدلّ على ما يجري ضمن إطار نظري، تركيب إضافي طبيعي"
    - lemma: "حَرَكِيَّة نَفْسَتَحْلِيلِيَّة"
      generation_method: ishtiqaq
      justification: "حركية من حرك على وزن المصدر الصناعي تدلّ على الدينامية والسيرورة، ونفسَتحليلية نسبة مركّبة إلى التحليل النفسي"


stage2_evidence:
  per_lemma:
    - lemma: "عَمَلِيَّة التَّحْلِيل النَّفْسِيّ"
      expands:
        - text: "«(التَّحْلِيل النفساني) فرع من علم النفس الحديث يبحث في العقل الباطن وما فيه من عُقَدٍ ورغبات تمهيداً لعلاجها»"
          source: "المعجم الوسيط"
          addition: "التحليل النفساني/النفسي مصطلح ثابت في المعجم الوسيط، والعملية مكوّن إضافي طبيعي"
        - text: "«جملة أعمال تُحدث أثراً خاصّاً مثل عملية جراحية»"
          source: "المعجم الوسيط"
          addition: "عملية بمعنى جملة أعمال مُحدَثة ومقبولة مجمعياً"
        - text: "«(في الفلسفة) Analysis: منهج عام يُراد به تقسيم الكلّ إلى أجزائه وردّ الشيء إلى عناصره المكوّنة له مادّيّة كانت أو معنوية»"
          source: "المعجم الكبير"
          addition: "التحليل بمعناه الفلسفي العام يشمل البُعد النفسي"

    - lemma: "سِيرُورَة تَحْلِيلنَفْسِيَّة"
      evidence_status: "no_material_found"

    - lemma: "آلِيَّة تَحْلِيلنَفْسِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مُجْرَيَات التَّحْلِيل النَّفْسِيّ"
      evidence_status: "no_material_found"

    - lemma: "حَرَكِيَّة نَفْسَتَحْلِيلِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "عَمَلِيَّة التَّحْلِيل النَّفْسِيّ"
      decision: confirmed
      decision_reason: "تركيب إضافي طبيعي يجمع بين (عملية) المقبولة مجمعياً و(التحليل النفسي) المصطلح الثابت في المعاجم الطبية واللسانية والنفسية. لا يوجد مصطلح مفرد مسكوك لهذا المفهوم في العربية، والتركيب هو الطريقة الطبيعية للتعبير عنه. اللمّة الموجودة تفتقر إلى التشكيل الكامل فيلزم تحديثها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّة التَّحْلِيل النَّفْسِيّ"

    - lemma: "سِيرُورَة تَحْلِيلنَفْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "سيرورة مصطلح فلسفي صالح نظرياً، لكن تحليلنفسية ككلمة منحوتة واحدة غير مثبتة معجمياً ولا مستعملة في الخطاب النفسي العربي. ولا دليل معجمي يدعم هذا التركيب."

    - lemma: "آلِيَّة تَحْلِيلنَفْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "آلية تشير إلى ميكانيزم محدد (كآلية الكبت) لا إلى عملية عامة مفترضة. كما أن تحليلنفسية منحوتة غير مثبتة. يوجد فرق دلالي: الآلية أخصّ من العملية."

    - lemma: "مُجْرَيَات التَّحْلِيل النَّفْسِيّ"
      source: stage1
      decision: removed
      decision_reason: "مُجريات تدل على وقائع وأحداث جارية لا على عملية نظرية مفترضة. لا يصحّ إطلاقها على عمليات نفسية افتراضية بل على أحداث فعلية."

    - lemma: "حَرَكِيَّة نَفْسَتَحْلِيلِيَّة"
      source: stage1
      decision: removed
      decision_reason: "حركية تقابل dynamics لا process، والمفهوم المقصود هو العملية لا الديناميكية. فضلاً عن أن نفسَتحليلية تركيب نسبي غير مألوف وغير مثبت."


stage4_content:
  definition:
    current: "عملية يفترض حدوثها في نظرية التحليل النفسي"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية، يفتقر إلى الجنس القريب الدقيق وإلى الفصل النوعي الكافي. ينبغي تحسين صياغته بأسلوب معجمي عربي أصيل."
    authored:
      - type: terminological
        text: "عمليةٌ نفسيةٌ نظريةٌ يُفترَض وقوعُها في إطار نظرية التحليل النفسي لتفسير السلوك البشري والظواهر النفسية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كلُّ فعاليةٍ ذهنيةٍ أو انفعاليةٍ يُسلِّم بها التحليلُ النفسيُّ افتراضاً لتعليل مظاهر السلوك والوجدان"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عمليةٌ نفسيةٌ نظريةٌ يُفترَض وقوعُها في إطار نظرية التحليل النفسي لتفسير السلوك البشري والظواهر النفسية"

  examples:
    per_lemma:
      - lemma: "عَمَلِيَّة التَّحْلِيل النَّفْسِيّ"
        examples:
          - text: "يُعَدّ الكبتُ من أبرز عمليات التحليل النفسي التي وصفها فرويد لتفسير نسيان التجارب المؤلمة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدّ الكبتُ من أبرز عمليات التحليل النفسي التي وصفها فرويد لتفسير نسيان التجارب المؤلمة."


