# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة مُنْزَلِق اسم فاعل من الخماسي (انزلق) تُستعمل في المصطلحات\
         \ الفنية غالباً صفةً للأشياء (نافذة منزلقة، وصلة منزلقة) لا وصفاً للأشخاص؛\
         \ مما يُضعف دقّة توظيفها وصفاً للشخص."
      - "المجموعة تحتوي على لمّة واحدة فقط — يفتقر إلى التغطية الترادفية الضرورية."
      - "التعريف الحالي ترجمة حرفية من الإنجليزية ولا يستوفي أسلوب المعجم الوسيط\
         \ (جنس قريب + فصل نوعي)."
      - "خلوّ المجموعة من البديل الاشتقاقي الثلاثي المباشر من زلق على وزن فاعِل."
    observations: >
      المفهوم المستهدف — شخص تزلّ قدمه بسبب فقدان الاحتكاك — يُعبَّر عنه
      في العربية تقليدياً بالجملة الفعلية (زَلَّت قَدَمُهُ، انزلقَ فلانٌ) أو
      باسم المكان (مَزلقة، مَزلقُ). الاسم الشخصي المنفرد الدالّ على "مَن يزلق"
      غير راسخ في المعجمية الكلاسيكية، وهو ما يُصنِّف المجموعة ضمن الفجوة
      المعجمية (lexical_gap). مُنْزَلِق اسم فاعل قياسي صحيح من انزلق (انفعل
      ← مطاوع أزلق ← مطاوع زلق)، يُبرز المطاوعة ولا إرادية الفعل، ومقبول
      بوصفه الأنسب المتاح. تستدعي المجموعة تحسين التعريف ومثالاً توضيحياً.

  blind_candidates:
    - lemma: "زَالِق"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الثلاثي زَلَقَ على الوزن القياسي فَاعِل؛ أخفّ وأقرب إلى
        الأصل الاشتقاقي من الخماسي (انزلق). يصف الشخص الذي تزلّ قدمه مباشرةً
        دون زيادة صرفية.
    - lemma: "مُتَزَلِّج"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من تَزَلَّجَ الخماسي على وزن مُتَفَعِّل؛ الجذر زلج يحمل معنى
        الانزلاق والانتقال السريع على السطح، وقد يُستعمل للانزلاق اللاإرادي
        بالإضافة إلى التزحلق الإرادي على الجليد.
    - lemma: "مُتَزَحْلِق"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من تَزَحْلَقَ السداسي المزيد؛ الجذر زحلق موثّق في الصحاح
        والمحيط بمعنى التدحرج والانزلاق، والزُّحلوقة هي مَزلقة الصبيان. يصف
        الانزلاق ذا الطابع الجسيم أو المتكرر.
    - lemma: "زَلِيق"
      generation_method: ishtiqaq
      justification: >
        صيغة فَعِيل من جذر زلق تُفيد القابلية اللصيقة بالشيء؛ يمكن توظيفها
        للشخص ذي الطبيعة الزلقة أو الكثير الانزلاق، على غرار: شريد (كثير الشرود)
        وحليم (راسخ الحلم).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "مُنْزَلِق"
      confirm:
        - text: >
            «(13) المنزلِق؛ المنزلِقة: جزء منزلِق أو أداة منزلقة (مك)
            (9) يجتاز مُنْزَلِقًا»
          source: "المورد الحديث (2008) — مدخل slide"
        - text: "«وُصْلَة مُنْزَلِقة، وُصْلَة زلقة — slide joint»"
          source: "المعجم الموحد لمصطلحات النفط (1999) — ARABTERM"
        - text: "«نافذة منزلقة — slide window»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2 (1999) — ARABTERM"
        - text: "«حامل منزلق — pickup shoe, slider»"
          source: "المعجم الموحد لمصطلحات النقل (2010) — ARABTERM"
        - text: "«(انزلق) زلق»"
          source: "المعجم الوسيط — مدخل انزلق"
      contradicts:
        - text: >
            «المنزلِق؛ المنزلِقة: جزء منزلِق أو أداة منزلقة (مك)»
          source: "المورد الحديث (2008)"
          conflict: >
            الاستعمال المعجمي والمصطلحي الراسخ لـ مُنْزَلِق يخصّ الأجزاء
            والأدوات الميكانيكية لا الأشخاص، مما يُضعف دقّة الدلالة الشخصية
            ويُوقع في لبس بين الوصف الاسمي والصفي.

    # ── مرشحات المرحلة ١ ──
    - lemma: "زَالِق"
      contradicts:
        - text: >
            «رُسْتَاقٌ كبيْرٌ مِنْ نواحى سِجِسْتَانَ. افـتـتـحـه الـربـيـعُ بنُ
            زيادٍ الحارِثِىُّ (سنة 30هـ = 652م)»
          source: "المعجم الكبير — مدخل زَالِقٌ"
          conflict: >
            مُصنَّف كاسم علم (proper_noun) في قاعدة البيانات ومؤكَّد من معجم
            البلدان؛ زالق اسم موضع جغرافي في سجستان لا وصف للشخص.
        - text: >
            «زَالِقُ: لامه مكسورة، وقاف: من نواحي سجستان، وهو رستاق كبير فيه
            قصور وحصون»
          source: "معجم البلدان لياقوت الحموي — مدخل زَالِقُ"
          conflict: "تأكيد ثانٍ: زالق علمٌ جغرافي ثابت، لا صفة للشخص."
      expands:
        - text: >
            «الزَّاءُ وَاللَّامُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَزَلُّجِ
            الشَّيْءِ عَنْ مَقَامِهِ. وَالْمَزْلَقَةُ وَالْمَزْلَقُ: الْمَوْضِعُ
            لَا يُثْبَتُ عَلَيْهِ»
          source: "مقاييس اللغة لابن فارس — مدخل زَلُقَ"
          addition: >
            الجذر زلق راسخ في مقاييس اللغة بمعنى الانزلاق عن المقام. يدعم
            قياسية اسم الفاعل زالق وإن عطّله وجوده علماً جغرافياً.

    - lemma: "مُتَزَلِّج"
      expands:
        - text: >
            «(زلج) زلجا وزلجانا وزليجا أسْرع فِي الْمَشْي وخف ... وَالْمَكَان
            زلجا: زلق واملاس فزلت فِيهِ الْقدَم»
          source: "المعجم الوسيط — مدخل زلج"
          addition: >
            الجذر زلج يحمل معنى الانزلاق واملاس السطح وزلق القدم، مما يدعم
            إمكانية بناء مُتَزَلِّج منه. غير أن المعجم لم يُقيِّد مُتَزَلِّج
            كمصطلح مستقل للشخص الزالق.
        - text: >
            «الزَّاءُ وَاللَّامُ وَالْجِيمُ أُصَيْلٌ يَدُلُّ عَلَى الِانْدِفَاعِ
            وَالدَّفْعِ ... وَالزَّلْجُ: السُّرْعَةُ فِي الْمَشْيِ وَغَيْرِهِ،
            وَكُلُّ سَرِيعٍ زَالِجٌ»
          source: "مقاييس اللغة لابن فارس — مدخل زَلِجَ"
          addition: >
            ابن فارس يُثبت زالج (اسم فاعل من زلج) بمعنى السريع المندفع. يُفرِّق
            هذا بين دلالة زلج (السرعة) ودلالة زلق (الانزلاق عن المقام)؛ مما
            يجعل مُتَزَلِّج أقل دقةً من مُنْزَلِق للمفهوم المستهدف.

    - lemma: "مُتَزَحْلِق"
      expands:
        - text: >
            «الزَّحاليقُ: لغة تميم في الزحاليف، الواحدة زُحْلوقَةٌ ... والزحلقة
            كالدحرجة، وقد تَزَحْلَقَ»
          source: "تاج اللغة وصِحاح العربية للجوهري — مدخل زحلق"
          addition: >
            تزحلق موثّق في الصحاح بمعنى التدحرج والانزلاق؛ واسم الفاعل مُتَزَحْلِق
            قياسي، غير أن الدلالة أثقل (تدحرج + انزلاق) من مجرد زلق القدم.
        - text: >
            «رِيْحٌ زِحْلِقٌ: شَديدةٌ. وتَزَحْلَقَ وَتَزَحْلَفَ: واحِدٌ، ومنه
            الزُّحْلُوْقَةُ: لِمَزْلَقَةِ الصِّبْيَانِ»
          source: "المحيط في اللغة للصاحب بن عباد — مدخل زِحْلِق"
          addition: >
            يؤكد أن تزحلق وتزحلف مترادفان وأن منهما الزحلوقة (مزلقة الصبيان)؛
            ويُثبت الجذور الصرفية لمُتَزَحْلِق.
        - text: >
            «زحلق: تزحلط أي نزل في انحدار منسحباً، تزلق ... زحلق: زق، انزلق، زلج»
          source: "تكملة المعاجم العربية لرينهارت دوزي — مدخل زحلق"
          addition: >
            دوزي يُثبت أن زحلق ومتزحلق يُرادف انزلق وتزلج في مصادر عربية متأخرة.

    - lemma: "زَلِيق"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "مُنْزَلِق"
      decision: confirmed
      decision_reason: >
        مُنْزَلِق اسم فاعل قياسي صحيح من الخماسي اِنْزَلَقَ (مطاوع أزلق، من
        الثلاثي زلق) على الوزن المنتظر مُنْفَعِل. صيغة المطاوعة تُبرز طابع
        اللاإرادية في وقوع الانزلاق. وإن كان الاستعمال المصطلحي الراسخ يخصّ
        الأجزاء الميكانيكية، فإن الوزن القياسي يسمح باستعماله للشخص قياساً
        مطّرداً، ولا يوجد بديل موثَّق أدق منه. يُحفَظ مع تصحيح التشكيل
        (التشكيل الحالي مُنْزَلِق صحيح، إثباتاً لا تعديلاً).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُفيد الانزلاق اللاإرادي الآني بسبب فقدان
        الاحتكاك. وزن مُنْفَعِل يُبرز المطاوعة: وقع عليه فعل الانزلاق ولم
        يختره. يتمايز عن مُتَزَلِّج (انزلاق إرادي رياضي) ومُتَزَحْلِق (تدحرج
        ثقيل).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْزَلِق"

    # ── مرشحات المرحلة ١ ──
    - lemma: "زَالِق"
      source: stage1
      decision: removed
      decision_reason: >
        رغم صحّته صرفياً كاسم فاعل من الثلاثي زلق، ثبت توثيقه في معجم البلدان
        والمعجم الكبير اسمَ علمٍ لموضع جغرافي في سجستان (مصنَّف proper_noun في
        قاعدة البيانات). استعماله في المجموعة وصفاً للشخص الزالق سيُنشئ اشتراكاً
        لفظياً مُشكِلاً مع العَلَم الجغرافي الموثَّق.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُتَزَلِّج"
      source: stage1
      decision: removed
      decision_reason: >
        يحمل دلالة التزحلق الإرادي المنظَّم (رياضة التزلج على الجليد) بحكم
        الاستعمال الحديث الغالب. والجذر زلج وفق ابن فارس يدلّ على السرعة
        والاندفاع لا على الانزلاق بفقدان الاحتكاك. الفرق الدلالي بين الإرادي
        واللاإرادي حاسم هنا؛ المفهوم المستهدف انزلاق طارئ لا نشاط مُختار.
      evidence_assessment:
        case: mixed

    - lemma: "مُتَزَحْلِق"
      source: stage1
      decision: removed
      decision_reason: >
        يفيد الانزلاق مع التدحرج والانحدار الثقيل (كالتدحرج عن المنحدر)، وهو
        أثقل دلالةً من الانزلاق البسيط بزلق القدم. كما أن الاستعمال المعاصر
        يربطه بالتزحلق الترفيهي كتزحلق الأطفال على الثلج، مما يُباعده عن
        الحادثة الطارئة في المفهوم المستهدف.
      evidence_assessment:
        case: mixed

    - lemma: "زَلِيق"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد أدلة معجمية على هذا الوزن كمصطلح للشخص الزالق. ووزن فَعِيل
        في هذا الجذر إما يُفيد المبالغة في الوصف اللصيق بالطبيعة (كشريد، حليم)
        وهو ما يُناقض الانزلاق كحادثة طارئة، وإما يُحيل إلى إجراء صوتي (كـ
        صفير، صهيل) — كلاهما بعيد عن المقصود.
      evidence_assessment:
        case: no_material


