# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10633879-n  |  ILI: i93087  |  POS: n
# Lemmas (existing): مُبْتَسِم
# English: smiler — "a person who smiles"
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يكرر الفعل «يبتسم» مرتين بصيغة واحدة دون تنويع، مما يدل على ترجمة آلية لم تُراجَع."
      - "اللمة الوحيدة مُبْتَسِم (اسم فاعل لحظي) تفتقر إلى مقابلها في صيغة المبالغة الدالة على الملازمة والكثرة."
    observations: "المجموعة تعبّر عن شخص يتّصف بالابتسام. الجذر ب-س-م أصيل وغني في المعجمية العربية؛ إذ يمتد من بَسَمَ إلى تبسَّم وابتسَمَ. للجذر صيغ اشتقاقية تفيد الملازمة (بَسَّام، مِبْسَام) وأخرى تفيد الحدوث اللحظي (باسِم، مُبتسِم). التعريف الحالي بحاجة إلى تنقية وإزالة التكرار، وتحرير بأسلوب المعجم الوسيط."
  blind_candidates:
    - lemma: "بَسَّام"
      generation_method: ishtiqaq
      justification: "وزن فَعَّال على جذر ب-س-م يفيد المبالغة والملازمة؛ أي الشخص الكثير التبسم. هذا الوزن منتج في العربية لأسماء الصفات الراسخة، وينسجم تماماً مع دلالة المجموعة."
    - lemma: "مُتَبَسِّم"
      generation_method: ishtiqaq
      justification: "اسم الفاعل من تبسَّم (الوزن الخامسي) يصف الشخص الذي يتبسم بتأنٍّ ولطف؛ وهو صيغة مستقلة عن الثماني ابتسم، يُفيد التكلف الخفيف في الابتسام."
    - lemma: "بَسِيم"
      generation_method: ishtiqaq
      justification: "وزن فَعِيل من ب-س-م يفيد الاتصاف الدائم بالبسمة وحسن الوجه، على غرار كريم ورحيم؛ أي مَن طابع وجهه الابتسام."
    - lemma: "طَلِيقُ الوَجْهِ"
      generation_method: tarkib
      justification: "تركيب إضافي وصفي يصف مَن يُقبل على الناس بوجه بشوش منفتح؛ الطلاقة في العربية تشمل الانبساط والبِشر والابتسام معاً."


stage2_evidence:
  per_lemma:
    - lemma: "مُبْتَسِم"
      confirm:
        - text: "«بَسَمَ يَبْسِمُ بَسْماً وابْتَسَمَ وتَبَسَّم: وهو أَقَلُّ الضَّحِك وأَحَسنُه»"
          source: "لسان العرب لابن منظور"
        - text: "«التَّبَسُّمُ دُونَ الضَّحِكِ وَقَدْ بَسَمَ مِنْ بَابِ ضَرَبَ فَهُوَ بَاسِمٌ وَابْتَسَمَ وَتَبَسَّمَ»"
          source: "مختار الصحاح للرازي"
        - text: "«بَسَمَ يَبْسِمُ بَسْماً وابْتَسَمَ وتَبَسَّم: وهو أقَلُّ الضَّحِكِ وأحْسَنُهُ، فهو باسِمٌ ومِبْسامٌ وبَسَّامٌ»"
          source: "القاموس المحيط للفيروزآبادي"
      expands:
        - text: "«(بَسَمَ) الْبَاءُ وَالسِّينُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ إِبْدَاءُ مُقَدَّمِ الْفَمِ لِمَسَرَّةٍ; وَهُوَ دُونَ الضَّحِكِ يُقَالُ: بَسَمَ يَبْسِمُ وَتَبَسَّمَ وَابْتَسَمَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يكشف عن المعنى الأصلي للجذر: إبداء الفم لمسرة دون ضحك مسموع؛ مما يؤصّل دلالة مُبتسِم ويحدد وظيفته الدلالية بدقة."

    - lemma: "بَسَّام"
      confirm:
        - text: "«ورجل بسّامٌ، وامرأة بسّامةٌ، وبسم وابتسم وتبسّم بمعنى واحد»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«رجلٌ مِبسامٌ وبَسَّامٌ: كثير التبسُّم»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«رجلٌ (مِبْسَامٌ) وَ(بَسَّامٌ) كَثِيرُ التَّبَسُّمِ»"
          source: "مختار الصحاح للرازي"
        - text: "«بَسَمَ يَبْسِمُ بَسْماً وابْتَسَمَ وتَبَسَّم: وهو أَقلُّ الضَّحِك وأَحَسنُه... وامرأَة بَسَّامةٌ ورجل بَسَّامٌ»"
          source: "لسان العرب لابن منظور"
        - text: "«فهو باسِمٌ ومِبْسامٌ وبَسَّامٌ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«هو أغر بسام. وأول مراتب الضحك التبسم»"
          source: "أساس البلاغة للزمخشري"
        - text: "«بَسَّام: من (ب س م) المكثر من البسم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

    - lemma: "بَسِيم"
      expands:
        - text: "«بَسِيم: من (ب س م) الضاحك أقل الضحك وأحسنه؛ أو مبالغة من بسم بمعنى ضحك بدون صوت»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المصدر معجم أسماء أعلام لا معجم لغوي؛ مما يدل على أن «بسيم» استقرت في باب الأعلام أكثر من كونها اسماً جامداً شائعاً."

    - lemma: "مُتَبَسِّم"
      confirm:
        - text: "«هو أغر بسام. وأول مراتب الضحك التبسم، ومتى جئته فهو متبسم. وكان ابتسامتها ومضة برق»"
          source: "أساس البلاغة للزمخشري"

    - lemma: "طَلِيقُ الوَجْهِ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "مُبْتَسِم"
      decision: confirmed
      decision_reason: "اسم الفاعل من ابتسم (الثماني) على وزن مُفتعِل؛ صيغة مشهورة مستعملة وفصيحة تصف الشخص حال ابتسامه. الجذر والوزن كلاهما أصيل في العربية، والتشكيل ورد صحيحاً في المدخل. الدليل المعجمي يؤكد الفعل ومنه يتفرع الاسم بالقياس المطرد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يصف الحالة اللحظية وقت وقوع الابتسام؛ اسم فاعل آني يحمل معنى الحدثية أكثر من الاستمرارية، يُستخدم حين يُوصف شخص بعينه في موقف بعينه."

    - lemma: "بَسَّام"
      source: stage1
      decision: confirmed
      decision_reason: "موثق في أمهات المعاجم الكلاسيكية (كتاب العين، الصحاح، لسان العرب، القاموس المحيط) بمعنى «كثير التبسم» تحديداً. صيغة المبالغة فَعَّال تفيد الصفة الراسخة وتُثري المجموعة بمعنى «الإكثار من الابتسام». شيوعه كاسم علَم لا يُسقط استعماله الوصفي الموثَّق في المعاجم اللغوية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "صيغة مبالغة فَعَّال تدل على الصفة الراسخة الملازمة للابتسام؛ يُستخدم في وصف من عُرِف بالبِشر الدائم وكثرة التبسم، على عكس مُبتسِم الذي يصف الحالة اللحظية."
      actions:
        - command: create_entry
          params:
            lemma: "بَسَّام"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "بَسِيم"
      source: stage1
      decision: removed
      decision_reason: "الدليل الوحيد المتوفر مصدره معجم أسماء أعلام لا معجم لغوي. كلمة «بسيم» تُستخدم اليوم علَماً شخصياً في الغالب، وليست اسماً جامداً متداولاً في الاستعمال الوصفي. المجموعة تغطي الدلالة بمُبتسِم وبَسَّام بشكل كافٍ."

    - lemma: "مُتَبَسِّم"
      source: stage1
      decision: removed
      decision_reason: "الشواهد المعجمية تستعمل «متبسم» وصفاً حالياً لا اسماً دالاً على الشخص بصفة ثابتة. لا يوجد مدخل مستقل له في المعاجم بما يُثبته مصطلحاً مسكوكاً للشخص المبتسم. دلالته تتداخل مع مُبتسِم دون فارق يُبرر إضافته."

    - lemma: "طَلِيقُ الوَجْهِ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة لا مصطلح مسكوك. يجتاز اختبار السكّ بالفشل: يمكن إبدال «طليق» بـ«مشرق» أو «بشوش» ويبقى الوصف صحيحاً ومفهوماً. ليست وحدة معجمية ثابتة تخص دلالة «الشخص المبتسم»."


