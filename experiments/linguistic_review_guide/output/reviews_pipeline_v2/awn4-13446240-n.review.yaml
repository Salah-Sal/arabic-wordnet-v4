# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13446240-n (accretion)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «زيادة» عامة جداً ولا تحمل أي تخصيص جيولوجي؛ بل إنها تتطابق مع لمّات المجموعة الأعلى (hypernym) التي تحتوي بالفعل على «زيادة»"
      - "لمّة «تراكم» أقرب إلى المفهوم العام (accumulation) منها إلى المفهوم الجيولوجي المحدد (accretion = تزايد رقعة الأرض)"
      - "التعريف العربي ترجمة حرفية من الإنجليزية ويحتاج إلى صياغة معجمية عربية أصيلة"
    observations: "المفهوم المستهدف هو الزيادة المتدرجة في مساحة اليابسة بفعل ترسّب الطمي والغرين المنقولَيْن بالماء. هذا مصطلح جيولوجي متخصص يحتاج إلى لمّات ذات دلالة أدق من «زيادة» و«تراكم». المعاجم المصطلحية العربية الموحدة تقدّم بدائل أفضل مثل «تزايُد» و«تنامٍ» في سياق accretion الجيولوجي."

  blind_candidates:
    - lemma: "تَزَايُد"
      generation_method: ishtiqaq
      justification: "مصدر «تزايَدَ» على وزن تَفَاعُل من الجذر (ز ي د)، يدلّ على الازدياد المتدرج التراكمي، وهو أدقّ من «زيادة» المفردة لأنه يحمل دلالة التدرّج والاستمرار"
    - lemma: "تَنَامٍ"
      generation_method: ishtiqaq
      justification: "مصدر «تنامى» على وزن تَفَاعُل من الجذر (ن م و)، يدلّ على النمو التدريجي بالإضافة، مناسب لوصف تزايد حجم اليابسة بترسّب المواد"
    - lemma: "إِطْمَاء"
      generation_method: ishtiqaq
      justification: "مصدر «أطمأ» على وزن إِفْعَال من الجذر (ط م ي)، يدلّ على عملية تراكم الطمي، وهو مصطلح مستعمل في هندسة المياه والجيولوجيا للدلالة على aggradation/silting"
    - lemma: "تَرَسُّب"
      generation_method: ishtiqaq
      justification: "مصدر «ترسَّب» على وزن تَفَعُّل من الجذر (ر س ب)، يدلّ على تجمّع المواد في الأسفل، مستعمل في الجيولوجيا بمعنى deposition/sedimentation"

stage2_evidence:
  per_lemma:
    - lemma: "تَرَاكُم"
      confirm:
        - text: "«تزايد رقعة الأرض بالتطمي أو التغريم»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«تَجَمُّع الأشياء بعضها إلى بعض»"
          source: "المعجم الكبير"
        - text: "«(تراكم) ارتكم يُقال تراكمت الأشغال»"
          source: "المعجم الوسيط"
      expands:
        - text: "«وصف عام يُطلق على المواد التي تنشأ نتيجة حدوث تفاعل ما في المياه، والتي تترسب مثلاً على الجدران الداخلية لخطوط الأنابيب.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يوسّع الدلالة لتشمل أي تراكم مادي في سياق مائي"
        - text: "«في سرير النهر أو بالتذرية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — lag deposit"
          addition: "يدلّ على استعمال «تراكم» في السياق الجيولوجي النهري"

    - lemma: "زِيَادَة"
      contradicts:
        - text: "«(الزِّيَادَة) مَا زَاد على الشَّيْء وَزِيَادَة الكبد زائدتها وحروف الزِّيَادَة (فِي الصّرْف) عشرَة حُرُوف يجمعها قَوْلك سألتمونيها»"
          source: "المعجم الوسيط"
          conflict: "التعريف عام جداً ولا يحمل أي دلالة جيولوجية أو ترسّبية"
        - text: "«الزيادة: أن ينضم إلى ما عليه الشيء في نفسه شيء آخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "تعريف فلسفي مجرد لا علاقة له بالمفهوم الجيولوجي المحدد"

    - lemma: "تَزَايُد"
      confirm:
        - text: "«الازدياد المتدرج في حجم الجسم بضم مزيد من المادة إليه»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«الازدياد المتدرج في حجم الجسم بضم مزيد من المادة إليه»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
      expands:
        - text: "«(1) تزايُد؛ تنامٍ؛ تعاظُم [من طريق النموّ العُضوي أو بواسطة إضافات خارجية تدريجية]»"
          source: "المورد الحديث (2008)"
          addition: "يؤكّد أن «تزايُد» هو المقابل العربي الأول لـ accretion في المعاجم ثنائية اللغة"

    - lemma: "تَنَامٍ"
      confirm:
        - text: "«تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«(1) تزايُد؛ تنامٍ؛ تعاظُم [من طريق النموّ العُضوي أو بواسطة إضافات خارجية تدريجية]»"
          source: "المورد الحديث (2008)"
          addition: "يرد «تنامٍ» مرادفاً ثانياً لـ accretion بعد «تزايُد»"

    - lemma: "إِطْمَاء"
      contradicts:
        - text: "«تراكم الرواسب والمواد العالقة في قاع النهر»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "إِطْمَاء يدلّ على aggradation (ترسّب الطمي في قاع النهر) لا على accretion (تزايد رقعة الأرض)"
      expands:
        - text: "«sanding / silting»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "الترجمة الإنجليزية تؤكد أن إِطْمَاء = silting/aggradation لا accretion"

    - lemma: "تَرَسُّب"
      contradicts:
        - text: "«(فى الجيولوجيا): تراكم فُتات الصخور بعضه فوق بعض فى هيئة طبقات»"
          source: "المعجم الكبير"
          conflict: "تَرَسُّب يدلّ على عملية الترسّب (sedimentation/deposition) لا على نتيجة زيادة الأرض (accretion)"
        - text: "«الشَّيْءُ: تَجَمَّع ذاهبًا إلى أسفل»"
          source: "المعجم الكبير"
          conflict: "الدلالة الأصلية هي الهبوط والغوص إلى الأسفل لا الزيادة في المساحة"

stage3_analysis:
  per_lemma:
    - lemma: "تَرَاكُم"
      decision: confirmed
      decision_reason: "ورد في المعجم الموحد لمصطلحات النفط بتعريف يطابق المجموعة تماماً: «تزايد رقعة الأرض بالتطمي أو التغريم» = accretion. كما أنه مصطلح شائع ومقبول في عدة مجالات علمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على جانب التجمّع والتكدّس المادي (من ركم = ألقى بعضه على بعض)، ويُستعمل في سياقات أوسع تشمل أي تراكم مادي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرَاكُم"

    - lemma: "زِيَادَة"
      decision: removed
      decision_reason: "لفظ عام جداً يدلّ على مطلق الزيادة والفضل دون أي تخصيص جيولوجي. كما أنه يتطابق مع لمّة المجموعة الأعلى (hypernym) التي تحتوي بالفعل على «زيادة»، مما يخلق دوراناً دلالياً. لم يُعثر على أي دليل معجمي يربط «زيادة» بمفهوم accretion الجيولوجي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَزَايُد"
      source: stage1
      decision: confirmed
      decision_reason: "ورد في المعجم الموحد لمصطلحات الجيولوجيا ومعجم علوم الزلازل بتعريف صريح: «الازدياد المتدرج في حجم الجسم بضم مزيد من المادة إليه» = accretion. وهو المقابل الأول في المورد الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على جانب الازدياد التدريجي المنتظم (من زيد = الفضل)، وهو المصطلح الجيولوجي الأدق والأكثر تخصصاً"
      actions:
        - command: create_entry
          params: {lemma: "تَزَايُد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَنَامٍ"
      source: stage1
      decision: confirmed
      decision_reason: "ورد في معجم الهندسة المدنية بتعريف: «تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات» = accretion. وفي المورد الحديث مرادفاً ثانياً لـ accretion. مصطلح فصيح من جذر (ن م و) يحمل دلالة النمو التدريجي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على جانب النمو العضوي التدريجي (من نمو = النماء والتكاثر)، ويوحي باستمرارية طبيعية أكثر من «تراكم»"
      actions:
        - command: create_entry
          params: {lemma: "تَنَامٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "إِطْمَاء"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تُظهر أن «إِطْمَاء» يقابل aggradation/silting (تراكم الطمي في القاع) لا accretion (تزايد رقعة الأرض). المفهومان مرتبطان لكنهما مختلفان: الأول عملية ترسّب، والثاني نتيجة زيادة مساحية."

    - lemma: "تَرَسُّب"
      source: stage1
      decision: removed
      decision_reason: "«تَرَسُّب» يدلّ على sedimentation/deposition (عملية هبوط المواد إلى الأسفل)، وهو مفهوم مغاير لـ accretion (زيادة اليابسة). الدلالة الأصلية من (ر س ب) هي الغوص والهبوط لا الزيادة والنمو."

