# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10785693-n
# wanter / needer — شخص يريد أو يحتاج شيئاً ما
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "العلاقة بين «راغب» و«محتاج» ليست ترادفاً تامّاً: الرغبة إرادية اختيارية، والاحتياج اضطراري"
      - "التعريف العربي عام جداً ولا يميّز هذه المجموعة عن مفاهيم أخرى كالسائل أو الطالب"
      - "المفرد الفوقي (عامل/فاعل) لا يبدو مناسباً دلالياً: الراغب أو المحتاج ليس بالضرورة عاملاً أو فاعلاً"
    observations: "المجموعة تمثّل مفهوم «مَن يريد شيئاً أو يحتاجه»، وهو مفهوم عام جداً في العربية يمكن التعبير عنه بأسماء فاعل متعدّدة من جذور مختلفة (رغب، حوج، طلب، أراد). الفارق الدلالي بين الإرادة والحاجة جوهري في العربية: الرغبة ميل اختياري، والحاجة افتقار واضطرار."

  blind_candidates:
    - lemma: "طَالِبٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «طَلَبَ» على وزن فاعِل، يدلّ على من يبتغي شيئاً ويسعى إليه، وهو أعمّ من المعنى المدرسي"
    - lemma: "مُرِيدٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «أَرَادَ» (فعل رباعي)، يدلّ على من له إرادة وطلب لشيء ما"
    - lemma: "رَاغِبٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «رَغِبَ في» على وزن فاعِل، يدلّ على الحريص على الشيء الطامع فيه"
    - lemma: "مُفْتَقِرٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «افْتَقَرَ» (فعل مطاوع)، يدلّ على من يفتقر إلى شيء ويحتاجه"


stage2_evidence:
  per_lemma:
    - lemma: "رَاغِب"
      confirm:
        - text: "«رَاغِب: من (ر غ ب) الحريص على الشيء الطامع فيه الطالب له.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الرَّغْبَةُ فِي الشَّيْءِ: الْإِرَادَةُ لَهُ. رَغِبْتُ فِي الشَّيْءِ.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«راغبٌ في؛ توّاق إلى.» — ترجمة desirous"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الرَّاءُ وَالْغَيْنُ وَالْبَاءُ أَصْلَانِ: أَحَدُهُمَا طَلَبٌ لِشَيْءٍ وَالْآخَرُ سَعَةٌ فِي شَيْءٍ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «رغب» يجمع بين معنيَي الطلب والسعة، والراغب مأخوذ من الأصل الأول"
        - text: "«(1) راغب؛ مهتمّ (2) مشارِك؛ ذو حصة أو أسهم» — ترجمة interested"
          source: "المورد الحديث (2008)"
          addition: "يُستعمل «راغب» أيضاً بمعنى المهتمّ والمشارك في السياق المعاصر"

    - lemma: "مُحْتَاج"
      confirm:
        - text: "«مُحْتَاج: من (ح و ج) المفتقر.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«مُحْتاج» — ترجمة needy"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الْحَاءُ وَالْوَاوُ وَالْجِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ الِاضْطِرَارُ إِلَى الشَّيْءِ، فَالْحَاجَةُ وَاحِدَةُ الْحَاجَاتِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «حوج» أصله الاضطرار، ممّا يؤكد أنّ المحتاج مَن دُفع إلى طلب الشيء اضطراراً لا اختياراً"

    - lemma: "طَالِبٌ"
      contradicts:
        - text: "«الطَّالِبُ: الَّذِي يطْلب الْعلم وَيُطلق عرفا على التلميذ فِي مرحلتي التَّعْلِيم الثانوية والعالية»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "في الاستعمال المعاصر اختُصّ «الطالب» بمعنى التلميذ، فقد كاد يفقد معناه العام"
      expands:
        - text: "«الطَّاءُ وَاللَّامُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ابْتِغَاءِ الشَّيْءِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي عام يدلّ على الابتغاء، لكن الاستعمال المعاصر قيّده"

    - lemma: "مُرِيدٌ"
      contradicts:
        - text: "«المُرِيدُ: من يُرِيد الله مُقبلا بكلية إِلَيْهِ.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "اختصّ المريد في المعاجم بالمعنى الصوفي: من انقطع إلى الله"
        - text: "«المريد: بالفتح، والمارد من شياطين الإنس، المتعري من الخيرات.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المَرِيد (بالفتح) يعني الخبيث المتمرّد، فيُشتبه مع المُرِيد"
      expands:
        - text: "«مُرِيد: من (ر و د) الراغب المحب ومنه المريد في الصوفية وهو أول مراتب الصوفي.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المعنى الأصلي قريب من الراغب لكنه غلب عليه الاستعمال الصوفي"

    - lemma: "مُفْتَقِرٌ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "رَاغِبٌ"
      decision: confirmed
      decision_reason: "اسم فاعل فصيح من «رَغِبَ في»، مؤكَّد في مقاييس اللغة وموسوعة قابوس بمعنى الحريص على الشيء الطامع فيه. يناسب الشقّ الأول من التعريف (من يريد شيئاً)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الميل الاختياري والحرص على الشيء والطمع فيه، بخلاف «محتاج» الذي يدلّ على الاضطرار والافتقار"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَاغِبٌ"

    - lemma: "مُحْتَاجٌ"
      decision: confirmed
      decision_reason: "اسم فاعل من «احتاج» (افتعال من حوج)، مؤكَّد في المعاجم بمعنى المفتقر. الجذر «حوج» أصله الاضطرار إلى الشيء. يناسب الشقّ الثاني من التعريف (من يحتاج شيئاً)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الافتقار والاضطرار إلى الشيء، بخلاف «راغب» الذي يدلّ على الرغبة الاختيارية والحرص"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحْتَاجٌ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "طَالِبٌ"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ الأصل اللغوي عام (ابتغاء الشيء)، فإنّ الاستعمال المعاصر قيّد «الطالب» بمعنى التلميذ في مرحلتي التعليم الثانوية والعالية، كما صرّح المعجم الوسيط. إدراجه قد يُوقع في لبس."
      evidence_assessment:
        case: mixed

    - lemma: "مُرِيدٌ"
      source: stage1
      decision: removed
      decision_reason: "غلب على «المريد» المعنى الصوفي (من انقطع إلى الله) في المعاجم الكلاسيكية والمعاصرة. كما يُشتبه مع «المَرِيد» (الخبيث المتمرّد). لا يصلح للدلالة العامة على مَن يريد شيئاً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَاغِبٌ"
      source: stage1
      decision: removed
      decision_reason: "مكرّر مع اللمّة الموجودة «رَاغِب»."
      evidence_assessment:
        case: confirm_only

    - lemma: "مُفْتَقِرٌ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجَد أدلة معجمية مباشرة. المعنى أقرب إلى الفقر والعوز منه إلى مطلق الحاجة. كما أنّه مرادف ضعيف لـ«محتاج» دون إضافة فارق دلالي حقيقي."
      evidence_assessment:
        case: no_material


