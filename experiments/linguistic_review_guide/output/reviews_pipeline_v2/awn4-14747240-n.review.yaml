# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14747240-n (activator)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «منشط» غير مُشكَّلة، ممّا يُوقع في لَبس بين المَنْشَط (ما يُخَفّ إليه) والمُنَشِّط (اسم الفاعل من نَشَّطَ) والمُنَشَّط (اسم المفعول)"
      - "المجموعة تحتوي لمّة واحدة فقط لمفهوم علمي شائع — قد تحتاج إلى إثراء"
      - "التعريف العربي ترجمة حرفية للإنجليزي وفيه ركاكة: «منتج جيني» و«نسخ الحمض النووي» تحتاجان صقلاً"
    observations: "المفهوم بيولوجي تخصّصي يدلّ على عامل كيميائي حيوي يُحدث التنشيط الإنزيمي أو يُعزّز الانتساخ الجيني. المصطلح العربي المتوقع يكون على وزن مُفَعِّل (اسم فاعل من الفعل الثلاثي المزيد) لأنّ الدلالة أداتية تأثيرية."

  blind_candidates:
    - lemma: "مُنَشِّط"
      generation_method: ishtiqaq
      justification: "اسم فاعل من نَشَّطَ (فعّل) على وزن مُفَعِّل، يدلّ على ما يُحدث النشاط والتفعيل، وهو الوزن العربي الطبيعي لأسماء العوامل المؤثّرة"
    - lemma: "مُحَفِّز"
      generation_method: ishtiqaq
      justification: "اسم فاعل من حَفَّزَ على وزن مُفَعِّل، شائع في الكيمياء الحيوية بمعنى ما يزيد سرعة التفاعل، وقد يتقاطع مع المفهوم البيولوجي"
    - lemma: "مُفَعِّل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من فَعَّلَ بمعنى جعل الشيء فاعلاً، يُستعمل في المعلوماتية والطبّ بمعنى ما يُحدث التفعيل"
    - lemma: "عَامِلُ تَنْشِيطٍ"
      generation_method: tarkib
      justification: "مركب إضافي من عامل + تنشيط (مصدر نَشَّطَ)، يصف الوظيفة التنشيطية مباشرة"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُنَشِّط"
      confirm:
        - text: "«المُنَشِّط: القائم بعملية التنشيط.»"
          source: "المورد الحديث (2008)"
        - text: "«منشِّط — activator»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«منشط — activator»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«محفِّز، منشِّط — مادة تضاف لتنشيط عملية معينة كتفاعل كيميائيّ.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«مُنَشِّط الرنا — جزيء منظم يتمكن من التعرف على مواقع التغيير الجينيّ في النواة.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«منشِّط (ن) — activator»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      expands:
        - text: "«مُنشّط — هو محلول تنظيف، يُستخدم في عملية المُعالجة الأولية لنطاقات اللصق.»"
          source: "مسرد هندسة وتكنولوجيا السيارات"
          addition: "دلالة تقنية خاصة بالهندسة لا تتعارض مع الدلالة البيولوجية العامة"
        - text: "«منشط — ما يمد بالطاقة أو ينشط أو يشحن.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "دلالة طبية عامة تشمل التنشيط والشحن"

    - lemma: "مُحَفِّز"
      contradicts:
        - text: "«محفِّز — مادة تُسَرِّع التفاعل الكيميائي ولكنها تظل دون تغيير في الشكل وفي الكم (على سبيل المثال، الإنزيمات).»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          conflict: "المُحَفِّز (catalyst) يختلف مفهومياً عن المُنَشِّط (activator): المحفز يُسرّع التفاعل دون أن يُستهلك، أمّا المنشط فيزيد نشاط الإنزيم أو يُفعّل الانتساخ الجيني"
        - text: "«مُحَفِّزْ — مادة كيميائية تزيد من سرعة التفاعل الكيمائيّ وتخرج من التفاعل دون أن تتغير.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "تأكيد أنّ المحفز = catalyst لا activator"
      expands:
        - text: "«محفِّز، منشِّط — مادة تضاف لتنشيط عملية معينة كتفاعل كيميائيّ.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "بعض المعاجم تعامل المحفز والمنشط كمترادفين في سياق تقانة الأغذية، لكنّ هذا خلط مصطلحي"

    - lemma: "مُفَعِّل"
      contradicts:
        - text: "«مُفَعِّل — آليةٌ في مِسْوَقِ قرصِ التخزين disk drive لتحريك رؤوس القراءة/الكتابة إلى الموضعِ الخاصِّ بالمسلك المرغوبِ فيه على القرص.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "المُفَعِّل يُستعمل بمعنى actuator (آلية تحريك ميكانيكية) لا activator البيولوجي"

    - lemma: "عَامِلُ تَنْشِيطٍ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "مُنَشِّط"
      decision: confirmed
      decision_reason: "مصطلح مُثبت في معاجم الأحياء والكيمياء والفيزياء والطبّ كمقابل دقيق لـ activator. اسم فاعل من نَشَّطَ على وزن مُفَعِّل المطّرد في أسماء العوامل المؤثرة. يحتاج تصحيح التشكيل من «منشط» إلى «مُنَشِّط»"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المُنَشِّط هو اللمّة الوحيدة المؤكدة في هذه المجموعة — لا مقارنة مطلوبة حالياً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنَشِّط"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُحَفِّز"
      source: stage1
      decision: removed
      decision_reason: "المُحَفِّز مقابل مُثبت لـ catalyst (العامل المُسَاعِد الذي لا يُستهلك في التفاعل)، وهو مختلف مفهومياً عن المُنَشِّط (activator) الذي يزيد نشاط الإنزيم مباشرة أو يُفعّل الانتساخ الجيني. الخلط بينهما خطأ مصطلحي شائع"
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُفَعِّل"
      source: stage1
      decision: removed
      decision_reason: "المُفَعِّل استُعمل في المعلوماتية بمعنى actuator (آلية ميكانيكية)، وفي طبّ الأسنان بمعنى appliance. ليس له سند معجمي بمعنى activator البيولوجي، ويُفضي استعماله إلى اشتراك لفظي مُضِرّ"
      evidence_assessment:
        case: contradicts_only

    - lemma: "عَامِلُ تَنْشِيطٍ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة وليست مصطلحاً مسكوكاً. لم يُعثر على أيّ شاهد معجمي لها كوحدة معجمية ثابتة. يمكن إبدال «تنشيط» بـ«تفعيل» والعبارة تبقى صالحة كوصف → تفشل في اختبار السكّ"
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "(بيولوجيا) أي عامل يؤدي إلى التنشيط؛ جزيء يزيد من نشاط إنزيم أو بروتين يزيد من إنتاج منتج جيني في نسخ الحمض النووي"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية فيها ركاكة: «منتج جيني» غير مألوفة، و«نسخ الحمض النووي» يُقصد بها الانتساخ (transcription) لا النسخ (copying). يحتاج إعادة صوغ بأسلوب المعجم العربي"
    authored:
      - type: terminological
        text: "(أحياء) مادّةٌ تزيد من فاعليّة إنزيمٍ ما، أو بُرُوتينٌ يُعزّز إنتاج نواتج المورّثات أثناء عمليّة الانتساخ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "(كيمياء حيويّة) عاملٌ جُزَيئيّ يرتبط بالإنزيم أو بمنطقة مُنظِّمة على الحمض النوويّ الريبيّ المنزوع الأكسجين فيُعزّز نشاطه التحفيزيّ أو يُطلق عمليّة الانتساخ الوراثيّ"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "(أحياء) مادّةٌ تزيد من فاعليّة إنزيمٍ ما، أو بُرُوتينٌ يُعزّز إنتاج نواتج المورّثات أثناء عمليّة الانتساخ"

  examples:
    per_lemma:
      - lemma: "مُنَشِّط"
        examples:
          - text: "يرتبط المُنَشِّطُ بالموقع التنظيميّ للإنزيم فيُحدث تغييراً في بنيته الفراغيّة يُعزّز كفاءته التحفيزيّة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يرتبط المُنَشِّطُ بالموقع التنظيميّ للإنزيم فيُحدث تغييراً في بنيته الفراغيّة يُعزّز كفاءته التحفيزيّة."


