# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14762931-n (ferment)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «إنزيم التخمير» تضيّق المفهوم إلى الإنزيمات فقط، بينما المجموعة تشمل أيّ مادة تُحدث التخمير (خميرة، بكتيريا، إلخ)"
      - "اللمّة «مادة مخمرة» عبارة وصفية حرة وليست مصطلحاً مسكوكاً، وهي ملتبسة صرفياً: مُخَمِّرة (فاعلة) أم مُخَمَّرة (مفعولة)؟"
      - "غياب اللمّة العربية الأصيلة «خميرة» التي تطابق المفهوم تماماً وتشهد لها معاجم الكيمياء والصيدلة والطب"
    observations: "المجموعة تعبّر عن مفهوم «المادة المُحدِثة للتخمير» (ferment)، وهو مفهوم له تعبير عربي أصيل راسخ هو «خَمِيرَة» من جذر خ-م-ر الدال على التغطية والمخالطة في ستر. اللمّتان الحاليتان إمّا مركبة تضيّق المفهوم (إنزيم التخمير) أو وصفية فضفاضة (مادة مخمرة). المعاجم المصطلحية الحديثة (الكيمياء، الصيدلة، الطب) تُقابل ferment بـ«خميرة» صراحةً."
  blind_candidates:
    - lemma: "خَمِيرَة"
      generation_method: ishtiqaq
      justification: "مشتقة من جذر خ-م-ر على وزن فَعِيلَة، وهي اللفظ العربي الأصيل للمادة التي تُحدث التخمير، مستعملة في المعاجم الحديثة مقابلاً لـ ferment"
    - lemma: "مُخَمِّرَة"
      generation_method: ishtiqaq
      justification: "اسم فاعل من خَمَّرَ (الثلاثي المزيد بالتضعيف) على وزن مُفَعِّلَة، بمعنى المادة التي تُخَمِّر غيرَها"
    - lemma: "عَامِلُ تَخْمِيرٍ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين «عامل» (agent) و«تخمير» (fermentation)، يصف المادة الفعالة في عملية التخمير"
    - lemma: "إِنْزِيم"
      generation_method: taarib
      justification: "تعريب للمصطلح الأجنبي enzyme، يُستعمل في المعاجم العلمية العربية، لكنه أعمّ من المفهوم المطلوب إذ يشمل جميع الإنزيمات لا خمائر التخمير فحسب"

stage2_evidence:
  per_lemma:
    - lemma: "إنزيم التخمير"
      evidence_status: "no_material_found"

    - lemma: "مادة مخمرة"
      evidence_status: "no_material_found"

    - lemma: "خَمِيرَة"
      confirm:
        - text: "«العامل الذي يسبب عملية التخمير»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«العامل الذي يسبب عملية التخمير.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مادة تخمر مواد أخرى. انظر : enzyme.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«ما يُجْعَلُ فى العَجِينِ أو الطِّيبِ ونحوهما لتَخْمِيره»"
          source: "المعجم الكبير"
      expands:
        - text: "«نباتٌ وحيد الخلية غالباً من الفطريات الزقية, بيضيَّة أو مستديرة الشكل تتوالد بالتبرعم غالباً؛ تستعمل في تخمير العجين, وفي تحضير الكحول والفيتامينات»"
          source: "المعجم الوسيط"
          addition: "هذا المعنى يخصّ الخميرة الحيّة (yeast) لا عامل التخمير العام (ferment)، فالخميرة في الوسيط متعددة المعاني"
        - text: "«الخَمِيرَةُ الهَضْمِيَّةُ (فى الطِّبِّ) digestive enzyme : خَمِيرَةٌ تُسْهِمُ فى هَضْمِ الطَّعام»"
          source: "المعجم الكبير"
          addition: "يبيّن أن «خميرة» تُستعمل مرادفاً لـ enzyme في السياق الطبي"
        - text: "«ذكر محيط المحيط أن الخمير قطعة من العجين حامضة تُذاب في الماء الذي يُعجن به الدقيق فيختمر، وأن الخميرة: القطعة من خمير العجين، كما وردت كلمة خميرة في الوسيط بهذا المعنى، وذكر أنها مجمعية.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يؤكد فصاحة اللفظ وقبول المجمع اللغوي له"

    - lemma: "مُخَمِّرَة"
      contradicts:
        - text: "«آلة أو وعاء التخمير، له أنواع حسب الخلايا المستخدمة في التخمير.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "مُخَمِّر في المعاجم المصطلحية يعني آلة/وعاء التخمير (fermenter) لا المادة المُخَمِّرة"
        - text: "«الجهاز الذي تتم فيه عملية التخمير.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "يؤكد أن مُخَمِّر = fermenter (الجهاز) وليس ferment (المادة)"

    - lemma: "عَامِلُ تَخْمِيرٍ"
      evidence_status: "no_material_found"

    - lemma: "إِنْزِيم"
      confirm:
        - text: "«إفراز يخرج من الخلايا الحيّة يُحدث تغييرات كيميائية في المركَّبات التى تحتويه دون أن يتغير»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«بروتين يقوم بدور محفز حيوي.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          conflict: "الإنزيم حفّاز حيوي عام، والمجموعة تخصّ مادة التخمير فقط؛ فالعلاقة عموم وخصوص"
        - text: "«بروتين خلوي يسرع التفاعل الكيميائي لمادة ما (ركيزة) وغالبا ما يختص بها ويتم هذا التفاعل دون تغير في الإنزيم نفسه.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          conflict: "الإنزيم أعمّ من الخميرة/عامل التخمير؛ ليس كل إنزيم يُحدث تخميراً"

stage3_analysis:
  per_lemma:
    - lemma: "إنزيم التخمير"
      decision: removed
      decision_reason: "مركب إضافي يضيّق مفهوم المجموعة (ferment = مادة تُحدث التخمير) إلى الإنزيمات فحسب، بينما عوامل التخمير تشمل الخمائر الحيّة والبكتيريا وغيرها. كذلك لم يُعثر على هذا المركب في أيّ معجم مصطلحي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مادة مخمرة"
      decision: removed
      decision_reason: "عبارة وصفية حرة لا مصطلح مسكوك؛ يمكن إبدال «مادة» بـ«مركّب» أو «عنصر» وتبقى العبارة صالحة (فشل اختبار السكّ). كذلك هي ملتبسة صرفياً بين مُخَمِّرة (فاعلة) ومُخَمَّرة (مفعولة)، ولم تُسجَّل في أيّ معجم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "خَمِيرَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي أصيل من جذر خ-م-ر على وزن فَعِيلَة، تشهد له معاجم الكيمياء والصيدلة والطب مقابلاً دقيقاً لـ ferment بمعنى «العامل الذي يسبب عملية التخمير». أقرّه مجمع اللغة العربية ووثّقه المعجم الوسيط والمعجم الكبير."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح العربي الأصيل الجامع لكل مادة تُحدث التخمير، سواء أكانت إنزيماً أم كائناً حيّاً دقيقاً"
      actions:
        - command: create_entry
          params:
            lemma: "خَمِيرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُخَمِّرَة"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تُثبت أن «مُخَمِّر» يعني آلة التخمير أو وعاءها (fermenter) لا المادة المُسبِّبة للتخمير (ferment)، فهناك تعارض دلالي مع المجموعة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "عَامِلُ تَخْمِيرٍ"
      source: stage1
      decision: removed
      decision_reason: "مركب إضافي وصفي لم يُسجَّل في أيّ معجم مصطلحي، ويمكن إبدال «عامل» بـ«مسبّب» أو «محفّز» (فشل اختبار السكّ). وجود «خميرة» المصطلح الراسخ يُغني عنه."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "إِنْزِيم"
      source: stage1
      decision: removed
      decision_reason: "الإنزيم أعمّ من عامل التخمير (ferment)؛ فهو حفّاز حيوي يشمل إنزيمات الهضم والتنفس وغيرها، وليس كل إنزيم يُحدث تخميراً. العلاقة عموم وخصوص لا ترادف."
      evidence_assessment:
        case: mixed

