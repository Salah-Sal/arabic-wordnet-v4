# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10704021-n (switchman)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف يحصر المفهوم في الذكور (رجل) وهو تقييد غير ضروري؛ الأَوْلى: شخص أو عامل"
      - "المجموعة تحتوي على لمّة واحدة فقط (عامل التحويلة)؛ قد تحتاج إلى إثراء بمرادفات مسكوكة"
      - "اللمّة الموجودة مركب إضافي بدون تشكيل كامل"
    observations: >
      المفهوم يتعلق بعامل متخصص في تشغيل محوّلات (تحويلات) مسارات القطارات في السكك الحديدية.
      هذا المفهوم مرتبط بالبنية التحتية للنقل الحديدي، وله مقابلات في معاجم النقل العربية الموحدة.
      المرادف الأقرب في الأفق هو مُحَوِّل الاتِّجَاه المستخدم في معاجم النقل الموحدة.
  blind_candidates:
    - lemma: "حَوَّال"
      generation_method: ishtiqaq
      justification: "على وزن فَعَّال الدال على المهنة والمبالغة في الفعل، من الجذر ح-و-ل، بمعنى من يمارس التحويل مهنةً"
    - lemma: "مُحَوِّلاتِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى المحوّلات بياء النسبة المهنية، على غرار كهربائي وميكانيكي"
    - lemma: "مُشَغِّلُ التَّحْوِيلَاتِ"
      generation_method: tarkib
      justification: "مركب إضافي من مُشَغِّل (اسم فاعل من شَغَّلَ) + التحويلات، يطابق تعريف الفوقي (عامل تشغيل)"
    - lemma: "مُحَوِّلُ الِاتِّجَاهِ"
      generation_method: tarkib
      justification: "مركب إضافي يصف وظيفة الشخص: من يحوّل اتجاه القطارات عبر التحويلات"

stage2_evidence:
  per_lemma:
    - lemma: "عَامِلُ التَّحْوِيلَةِ"
      confirm:
        - text: "«(في الخَطِّ الحَديدِيّ): خَطٌّ جانِبيٌّ تُحوَّلُ إليه العَرَبَاتُ مؤقَّتًا لِعُبورِ سِواهَا على الخَطِّ الرَّئيسِيِّ.»"
          source: "المعجم الكبير — مدخل التَّحْويلَة"
      expands:
        - text: "«عملية التحويل التي من خلالها يتم تحويل أحد القطارات الموجودة بالفعل على محطة القطار من خلال وصلات تحويلات حتى يكون خط سيره على قضيب آخر.»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "يوضّح آلية التحويل في السكك الحديدية بتفصيل أكبر"
        - text: "«تمكن الأجهزة الهيكلية القطارات من الانتقال من رصيف إلى آخر بدون توقف»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "يبيّن أن التحويلة جهاز هيكلي يتيح التنقل بين الأرصفة"

    - lemma: "حَوَّال"
      contradicts:
        - text: "«قَناةٌ صغيرةٌ يَجْرِي فيها الماءُ من ناحيَةٍ إلى أخرى»"
          source: "المعجم الكبير"
          conflict: "حَوَّال في المعاجم بمعنى القناة المائية الصغيرة، لا علاقة له بعامل السكك الحديدية"
        - text: "«الحاجز بين الشيئين»"
          source: "المعجم الوسيط — مدخل الحَوَال"
          conflict: "الحَوال بمعنى الحاجز أو تغيّر الدهر، وليس له دلالة على شخص أو مهنة"

    - lemma: "مُحَوِّلاتِيّ"
      evidence_status: "no_material_found"

    - lemma: "مُشَغِّلُ التَّحْوِيلَاتِ"
      evidence_status: "no_material_found"

    - lemma: "مُحَوِّلُ الِاتِّجَاهِ"
      confirm:
        - text: "«شخص مكلف بتشغيل وصيانة الآلة المحوّلة في السِكَّة الحديدية»"
          source: "المعجم الموحد لمصطلحات النقل (2010) — مدخل مُحَوِّل الاتِّجَاه (pointsman)"
        - text: "«عون بالسكك الحديدية مكلف بتحويل اتجاه القطارات»"
          source: "المعجم الموحد لمصطلحات النقل (2010) — مدخل مُحوِّل اتّجاه (switchman US)"
        - text: "«المُحَوِّل: عامل تحويل القُطُر الحديدية.»"
          source: "المورد الحديث (2008) — مدخل المُحَوِّل (switchman)"

stage3_analysis:
  per_lemma:
    - lemma: "عَامِلُ التَّحْوِيلَةِ"
      decision: confirmed
      decision_reason: >
        مركب إضافي واضح الدلالة، مكوّن من عَامِل (اسم فاعل عام) + التَّحْوِيلَة (مصطلح حديدي مسجّل في المعجم الكبير).
        التحويلة مؤكدة معجمياً في سياق السكك الحديدية. المركب يفي باختبار التثبيت المعجمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير عام يركّز على كون الشخص عاملاً يتعامل مع التحويلة بوصفها جهازاً، أعمّ من مُحَوِّل الاتجاه الذي يركّز على الفعل ذاته"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِلُ التَّحْوِيلَةِ"

    - lemma: "مُحَوِّلُ الِاتِّجَاهِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك ومسجّل في المعجم الموحد لمصطلحات النقل (2010) بتعريفين صريحين كمقابل لـ pointsman و switchman.
        كذلك ورد في المورد الحديث (2008) بصيغة المُحَوِّل فقط. المصطلح مقبول صرفياً ودلالياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مصطلح تقني رسمي يركّز على فعل تحويل الاتجاه، أدقّ من عامل التحويلة، ومعتمد في معاجم النقل الموحدة"
      actions:
        - command: create_entry
          params:
            lemma: "مُحَوِّلُ الِاتِّجَاهِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حَوَّال"
      source: stage1
      decision: removed
      decision_reason: >
        حَوَّال في المعاجم العربية بمعنى القناة المائية الصغيرة أو الحاجز، ولم يُسجَّل بمعنى شخص يعمل في التحويلات.
        كما أن وزن فَعَّال هنا يوحي بالمبالغة في الحَوْل لا بالمهنة الحديدية المحددة.

    - lemma: "مُحَوِّلاتِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي على هذه الصيغة. ياء النسبة إلى الجمع (المحوّلات) صيغة مولّدة غير مسكوكة وغير مسجّلة
        في أيّ معجم متخصص. الأَوْلى استخدام المصطلحات المعتمدة في معاجم النقل.

    - lemma: "مُشَغِّلُ التَّحْوِيلَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرّة وليست مصطلحاً مسكوكاً. يمكن استبدال مُشَغِّل بعامل أو مُدير دون تغيير المعنى
        (فشل اختبار السكّ). لم تُسجَّل في أيّ معجم متخصص بهذه الصيغة.

stage4_content:
  definition:
    current: "رجل يقوم بتشغيل محولات (تحويلات) السكك الحديدية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي. يقيّد المفهوم بالذكور (رجل) دون مسوّغ،
        ويستخدم كلمة محولات التي تلتبس بالمحوّلات الكهربائية. يحتاج إعادة صياغة بأسلوب معجمي عربي.
    authored:
      - type: terminological
        text: "عَامِلٌ مُتَخَصِّصٌ في تَشْغِيلِ تَحْوِيلَاتِ السِّكَكِ الحَدِيدِيَّةِ لِتَوْجِيهِ القِطَارَاتِ مِنْ مَسَارٍ إِلَى آخَرَ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "عَامِلٌ في السِّكَكِ الحَدِيدِيَّةِ يَتَوَلَّى تَشْغِيلَ أَجْهِزَةِ التَّحْوِيلِ (المَحَالّ) الَّتي تُمَكِّنُ القِطَارَاتِ مِنَ الِانْتِقَالِ بَيْنَ القُضْبَانِ، وَيُشْرِفُ عَلَى صِيَانَتِهَا لِضَمَانِ سَلَامَةِ الحَرَكَةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عَامِلٌ مُتَخَصِّصٌ في تَشْغِيلِ تَحْوِيلَاتِ السِّكَكِ الحَدِيدِيَّةِ لِتَوْجِيهِ القِطَارَاتِ مِنْ مَسَارٍ إِلَى آخَرَ"

  examples:
    per_lemma:
      - lemma: "عَامِلُ التَّحْوِيلَةِ"
        examples:
          - text: "يَقِفُ عَامِلُ التَّحْوِيلَةِ بِجَانِبِ القُضْبَانِ مُسْتَعِدًّا لِتَغْيِيرِ مَسَارِ القِطَارِ القَادِمِ قَبْلَ وُصُولِهِ إِلَى التَّقَاطُعِ."
            type: usage
      - lemma: "مُحَوِّلُ الِاتِّجَاهِ"
        examples:
          - text: "أَبْلَغَ مُحَوِّلُ الِاتِّجَاهِ غُرْفَةَ التَّحَكُّمِ بِإِتْمَامِ عَمَلِيَّةِ التَّحْوِيلِ عَلَى المَسَارِ الفَرْعِيِّ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يَقِفُ عَامِلُ التَّحْوِيلَةِ بِجَانِبِ القُضْبَانِ مُسْتَعِدًّا لِتَغْيِيرِ مَسَارِ القِطَارِ القَادِمِ قَبْلَ وُصُولِهِ إِلَى التَّقَاطُعِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَبْلَغَ مُحَوِّلُ الِاتِّجَاهِ غُرْفَةَ التَّحَكُّمِ بِإِتْمَامِ عَمَلِيَّةِ التَّحْوِيلِ عَلَى المَسَارِ الفَرْعِيِّ."

