# مراجعة المجموعة الترادفية awn4-92440444-n
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف دوراني: يستخدم لفظ «كارتل» وهو أحد اللمّات"
      - "المجموعة تعبّر عن عملية (cartelization) لا عن الكيان (cartel)، لكنّ اللمّتَين الموجودتَين تدلّان على الكيان لا العملية"
      - "لمّة «كارتل» معرَّبة تدلّ على الكيان الاحتكاري لا على فعل تشكيله"
      - "لمّة «تكتل احتكاري» مركّب وصفي يمكن قراءته مصدريًّا (عملية التكتّل) لكنّه غير مسكوك بهذا المعنى الاصطلاحي"
    observations: "المجموعة تمثّل مفهوم التحوّل إلى نظام الكارتل (cartelization)، وهو مفهوم اقتصادي حديث. الألفاظ الموجودة تميل إلى تسمية الكيان الناتج لا العملية ذاتها. الأنسب استخدام مصدر يدلّ على فعل الإنشاء والتشكيل."
  blind_candidates:
    - lemma: "كَرْتَلَة"
      generation_method: taarib
      justification: "تعريب «cartelization» على وزن فَعْلَلَة المنتج للمصادر الدالة على الفعل، على نمط: بَرْمَجَة، هَنْدَسَة. يدلّ على عملية إقامة نظام الكارتل."
    - lemma: "تَكَرْتُل"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر المعرَّب ك-ر-ت-ل على وزن تَفَعْلُل (مصدر تَكَرْتَلَ)، على نمط تَفَلْسُف وتَبَرْعُم، ويدلّ على مطاوعة الفعل أي التحوّل التلقائي إلى نظام كارتل."
    - lemma: "تَحَالُفٌ احْتِكَارِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «تحالف» (مصدر تحالَفَ = تعاقدوا) و«احتكاري». يدلّ على عملية التعاقد الاحتكاري بين الشركات."
    - lemma: "اتِّحَادٌ احْتِكَارِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي مسجّل في المعجم الموحد للتجارة والمحاسبة بمعنى cartel/trust. يدلّ على الكيان لكنّ المصدريّة في «اتّحاد» تعطيه بُعداً عمليّاً."

stage2_evidence:
  per_lemma:
    - lemma: "تَكَتُّل احْتِكَارِيّ"
      expands:
        - text: "«(تكتل) القصيرُ الغليظُ في مَشْيه: قارب في خطوه كأنَّه يتدحرج الناسُ: صاروا كتلة: أى جماعة متفقة على رأى واحد. (مج)»"
          source: "المعجم الوسيط"
          addition: "تكتّل في الوسيط يدلّ على صيرورة الناس جماعة متفقة، وهو معنى حديث أقرّه المجمع"
        - text: "«تَكَتَّل — الوارد في المعاجم استعمال تكتَّل بمعنى تجمّع وتدوّر، وشاع على ألسنة المعاصرين استعماله بمعنى صاروا كتلة أو جماعة متفقة على رأي، وأجاز مجمع اللغة المصري هذا الاستعمال»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "تأكيد أنّ الاستعمال المعاصر بمعنى التجمّع السياسي/الاقتصادي مقبول مجمعيًّا"
        - text: "«احتِكاريّ — اسم منسوب إلى احتِكار: مؤسّسة احتكاريّة. اتِّحاد من الشَّركات أو المؤسَّسات التي تجتمع بهدف تقليل المنافسة والسَّيطرة على الأسعار»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "احتكاريّ في معناه الاسمي يدلّ على الكيان لا العملية"

    - lemma: "كَارْتِل"
      confirm:
        - text: "«مجموعة من المنتجين يجمعهم اتفاق على تحديد الأسعار والإنتاج.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      contradicts:
        - text: "«تحالف أو تنظيم يضم مجموعة من الأفراد أو الشركات يهدف إلى ممارسة نوع من التأثير المقيد أو الاحتكار على إنتاج أو بيع سلعة»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "جميع التعريفات تصف الكيان (مجموعة/تنظيم/تحالف) لا عملية تشكيله، والمجموعة الترادفية تدلّ على العملية"
      expands:
        - text: "«تكتل المنتجين، كارتل — تنظيم احتكاري ناتج عن اتفاق بين عدة شركات أو دول منتجة تمثل دول الأوبيك، على مجموعة من الشروط لإنتاج سلعة معينة، كالسعر وكمية الانتاج والتسويق»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "كارتل مرادف لتكتل المنتجين ويدلّ على التنظيم الناتج"

    - lemma: "كَرْتَلَة"
      confirm:
        - text: "«إقامة نظام الكارتل»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"

    - lemma: "تَكَرْتُل"
      evidence_status: "no_material_found"

    - lemma: "تَحَالُفٌ احْتِكَارِيّ"
      evidence_status: "no_material_found"

    - lemma: "اتِّحَادٌ احْتِكَارِيّ"
      confirm:
        - text: "«اتحاد احتكاري — cartel»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«اتحاد احتكاري — بين التجار والمنتجين — pool»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يستعمل أيضاً بمعنى pool الاقتصادي"
        - text: "«التّروست؛ شركة الائتمان: اتحاد احتكاريّ بين عدد من الشركات للحدّ من المنافسة»"
          source: "المورد الحديث (2008)"
          addition: "يُستعمل في تعريف trust أيضاً مما يوسّع دلالته لتشمل أشكالاً احتكارية متعددة"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَكَتُّلٌ احْتِكَارِيّ"
      decision: confirmed
      decision_reason: "مركّب وصفي مقبول مجمعيًّا: «تكتّل» بمعنى صيرورة جماعة متفقة (أقرّه مجمع اللغة المصري)، و«احتكاري» نسبة إلى الاحتكار. قراءته المصدرية تدلّ على عملية التجمّع الاحتكاري. لكنّه يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على البُعد التجمّعي للعملية: اندماج الشركات في كتلة واحدة ذات طابع احتكاري. أعمّ من كرتلة لأنّه يشمل أيّ تكتّل احتكاري لا الكارتل تحديداً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَتُّلٌ احْتِكَارِيّ"

    - lemma: "كَارْتِل"
      decision: removed
      decision_reason: "كارتل لفظ معرَّب يدلّ على الكيان الاحتكاري (المجموعة/التنظيم) لا على عملية تشكيله. جميع المعاجم تعرّفه بأنّه «مجموعة من المنتجين» أو «تنظيم» أو «تحالف» — وهذا يناسب مجموعة ترادفية للكيان لا لعملية الإنشاء. المجموعة الحالية تدلّ على cartelization (العملية)."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "كَرْتَلَة"
      source: stage1
      decision: confirmed
      decision_reason: "مسجّلة في المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) بتعريف «إقامة نظام الكارتل» وترجمة cartelisation — وهذا مطابق تماماً لتعريف المجموعة الترادفية. وزن فَعْلَلَة منتج ومقبول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح تقني دقيق يدلّ تحديداً على عملية إقامة نظام الكارتل. أخصّ من «تكتّل احتكاري» لأنّه مقصور على الكارتل دون غيره من أشكال التكتّل."
      actions:
        - command: create_entry
          params: {lemma: "كَرْتَلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَكَرْتُل"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أيّ شاهد معجمي. الاشتقاق على وزن تَفَعْلُل ممكن نظريًّا لكنّه غير مسكوك ولا مسجّل، ووجود «كرتلة» المسجّلة يغني عنه."

    - lemma: "تَحَالُفٌ احْتِكَارِيّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على شواهد معجمية بهذا التركيب. «تحالف» يوحي بالتحالف السياسي/العسكري أكثر من التنظيم الاقتصادي الاحتكاري."

    - lemma: "اتِّحَادٌ احْتِكَارِيّ"
      source: stage1
      decision: removed
      decision_reason: "مسجّل في المعاجم الموحّدة لكنّه يُترجم cartel وtrust أي الكيان الاحتكاري لا عملية تشكيله. إضافته ستوسّع المجموعة بعيداً عن دلالة العملية (cartelization)."

