# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13529536-n
# linguistic process — عملية لغوية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «عملية تشارك في اللغة البشرية» ترجمة حرفية ركيكة للتعريف الإنجليزي، ولا يتضح فيها معنى «تشارك في» (involved in)"
      - "اللمّة الوحيدة «عملية لغوية» مركب وصفي عامّ جداً، ولا يتبيّن هل هو مصطلح ثابت أم مجرد تركيب وصفي حرّ"
      - "المجموعة تحتوي لمّة واحدة فقط؛ يُستحسن إثراؤها بمرادف أو أكثر"
    observations: "المفهوم يمثّل جنساً أعلى لجميع العمليات المتصلة باللغة البشرية (كالتصنيف والتحليل الصرفي والنحوي والتأثيل وغيرها). هو مفهوم تصنيفي فوقي (hypernym) أكثر منه مصطلحاً تقنياً بعينه. التعريف بحاجة إلى إعادة صياغة بأسلوب معجمي عربي."
  blind_candidates:
    - lemma: "سَيْرُورَة لُغَوِيَّة"
      generation_method: tarkib
      justification: "سَيْرُورَة مصطلح لساني معتمد من المعجم الموحّد لمصطلحات اللسانيات بمعنى process، ولُغَوِيَّة نسبة إلى اللُّغَة. المركب الوصفي يؤدي معنى العملية اللغوية بدقة."
    - lemma: "عَمَلِيَّة لِسَانِيَّة"
      generation_method: tarkib
      justification: "عَمَلِيَّة بمعنى process كما في المعجم الوسيط، ولِسَانِيَّة نسبة إلى اللِّسَان (مرادف لُغَوِيَّة في الاصطلاح الحديث). مركب وصفي بديل."
    - lemma: "إِجْرَاء لُغَوِيّ"
      generation_method: tarkib
      justification: "إِجْرَاء مصدر أَجْرَى بمعنى العملية أو الخطوة، يُستخدم في السياق العلمي الحديث. مركب وصفي إضافي بمعنى process لغوي."
    - lemma: "تَسَيُّر لُغَوِيّ"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر س-ي-ر على وزن تَفَعُّل الدالّ على الحدوث التدريجي، مع صفة لُغَوِيّ. لكنه غير مسكوك ولا مألوف في الاستعمال."

stage2_evidence:
  per_lemma:
    - lemma: "عَمَلِيَّة لُغَوِيَّة"
      confirm:
        - text: "«عملية لغوية تقوم بتجزيء الوحدات اللغوية إلى طبقات أو مقولات تكون خصائصها (التوزيعية والدلالية، إلخ.) متماثلة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: تصنيف"
      expands:
        - text: "«(العملية) جملَة أَعمال تحدث أثرا خَاصّا يُقَال عملية جراحية أَو حربية أَو مَالِيَّة (محدثة)»"
          source: "المعجم الوسيط — مدخل: العملية"
          addition: "يؤكد أن عَمَلِيَّة مصدر صناعي محدَث أقرّه مجمع اللغة العربية، ويُستعمل بإضافة صفة تحدد المجال"
        - text: "«لُغَويّ نسبة إلى لُغَة، فحقُّ اللام الضَّمّ تبعاً لضمتها في المنسوب إليه.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يؤكد أن الضبط الصحيح لُغَوِيَّة بضم اللام لا بفتحها"

    - lemma: "سَيْرُورَة لُغَوِيَّة"
      confirm:
        - text: "«في اللسانيات العامة، تطور تدريجي ومتتابع للغة وفقا لقوانين مطردة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: سَيْرُورَة"
      contradicts:
        - text: "«في اللسانيات العامة، تطور تدريجي ومتتابع للغة وفقا لقوانين مطردة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "التعريف يقصر سَيْرُورَة على التطور التدريجي الخاضع لقوانين (أي التغيّر اللغوي التاريخي)، وهذا أخصّ من المعنى العام لـ process في هذه المجموعة"

    - lemma: "عَمَلِيَّة لِسَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "إِجْرَاء لُغَوِيّ"
      evidence_status: "no_material_found"

    - lemma: "تَسَيُّر لُغَوِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عَمَلِيَّة لُغَوِيَّة"
      decision: confirmed
      decision_reason: "المركب الوصفي مستعمَل فعلاً في المعجم الموحّد لمصطلحات اللسانيات ضمن تعريف «تصنيف»، وكلا مكوّنَيه ثابتان في المعاجم الحديثة. عَمَلِيَّة أقرّها مجمع اللغة المصري، ولُغَوِيَّة صفة نسبية سليمة. المركب يؤدي المعنى العام لـ process involved in language."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الاستعمال العام الشائع في الكتابة اللسانية والتربوية الحديثة لأي عملية مرتبطة باللغة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّة لُغَوِيَّة"

    - lemma: "سَيْرُورَة لُغَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "سَيْرُورَة في المعجم الموحّد للسانيات تعني تحديداً «التطور التدريجي والمتتابع للغة وفقاً لقوانين مطّردة»، وهذا أخصّ من المفهوم العام لـ linguistic process الذي يشمل أيّ عملية مرتبطة باللغة. إدراج سيرورة لغوية هنا سيخلط بين المعنى العام والمعنى التاريخي الخاص."
      evidence_assessment:
        case: mixed

    - lemma: "عَمَلِيَّة لِسَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثَر على شاهد معجمي للمركب «عملية لسانية» كوحدة ثابتة. ولِسَانِيَّة تُستخدم عادةً نسبةً إلى «علم اللسانيات» (= linguistics) لا إلى «اللغة» بعمومها، فتوحي بأنّ العملية تخصّ علم اللسانيات لا اللغة ذاتها."
      evidence_assessment:
        case: no_material

    - lemma: "إِجْرَاء لُغَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "إِجْرَاء يدلّ في العربية الحديثة على خطوة محدّدة أو تدبير يُتّخذ (= procedure/measure)، وهو أخصّ وأدنى رتبةً من process. لم يُعثَر عليه مركباً ثابتاً في المعاجم المتخصصة."
      evidence_assessment:
        case: no_material

    - lemma: "تَسَيُّر لُغَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "مشتق مصنوع غير مسكوك وغير مسجّل في أي معجم. لا أدلة على استعماله."
      evidence_assessment:
        case: no_material

