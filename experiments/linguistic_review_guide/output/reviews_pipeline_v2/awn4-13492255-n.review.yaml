# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13492255-n — نمو اقتصادي
# economic growth — Review Pipeline v2.0
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (نمو اقتصادي)، وهو مركّب وصفي شائع لكنه يحدّ من التنوع المعجمي"
      - "اللمّة الموجودة بدون تشكيل كامل"
    observations: >
      المفهوم المراد هو الزيادة المطّردة في القدرة الإنتاجية للاقتصاد، وهو مفهوم اقتصادي حديث
      راسخ في الخطاب العربي المعاصر. المصطلح «نمو اقتصادي» هو الأكثر شيوعاً واستقراراً في
      المعاجم الاقتصادية العربية الموحّدة. يمكن البحث عن بدائل من باب التنويع اللغوي لكن
      المصطلح الأساسي ثابت ومستقر.
  blind_candidates:
    - lemma: "نُمُوٌّ اقْتِصَادِيٌّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «نُمُوّ» (مصدر نَمَا يَنْمُو) و«اقتصاديّ» (نسبة إلى الاقتصاد).
        هو المصطلح المباشر الأكثر دقّة للمفهوم، مُستعمَل في جميع المعاجم الاقتصادية الموحّدة.
    - lemma: "تَنَامٍ اقْتِصَادِيٌّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «تَنَامٍ» (مصدر تَنَامَى على وزن تَفَاعَلَ من نمو، يفيد التدرّج والاستمرار)
        و«اقتصاديّ». يؤكّد البُعد التدريجي للنمو المطّرد الوارد في التعريف.
    - lemma: "ازْدِهَارٌ اقْتِصَادِيٌّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «ازدهار» (مصدر ازدَهَرَ، من جذر ز-ه-ر) و«اقتصاديّ».
        يُستعمل في سياق الرخاء الاقتصادي العام، لكنه أقرب إلى مفهوم الرخاء (prosperity) منه إلى النمو.
    - lemma: "نَمَاءٌ اقْتِصَادِيٌّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «نَمَاء» (مصدر نَمَى يَنْمِي، وهو الأصل اللغوي عند الخليل والجوهري)
        و«اقتصاديّ». لفظ تراثي فصيح للزيادة والكثرة، لكنه قليل الاستعمال في السياق الاقتصادي المعاصر.

stage2_evidence:
  per_lemma:
    - lemma: "نُمُوٌّ اقْتِصَادِيٌّ"
      confirm:
        - text: "«زيادة قدرة الاقتصاد على إنتاج السلع والخدمات خلال فترة زمنية محددة بالمقارنة مع فترة زمنية سابقة. يتم قياس النمو الاقتصادي من حيث القيمة الاسمية، والتي تشمل التضخم، أو من حيث القيمة الحقيقية، حيث يتم أخد التضخم بعين الاعتبار.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
        - text: "«زيادة مطردة في الناتج الإجمالي أو نصيب الفرد من ناتج الاقتصاد على مدى فترة طويلة من الزمن.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
        - text: "«تزايد المجاميع الاقتصادية كالدخل القومي، والناتج القومي، والأجور وما إليها»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«النُّمُوّ الاقتصاديّ: (قص) الزِّيادة النَّوعيَّة في دخل الفرد أو في النَّاتج القوميّ أو المحليّ الإجماليّ.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«يحظى باهتمام متزايد ربط النمو الاقتصادي بتحسن نوعية حياة المواطنين، وكمقاربة في هذا الاتجاه يمكن اعتبار مؤشر الناتج القومي الإجمالي للفرد الذي يأخذ بعين الاعتبار تعادل القوة الشرائية.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          addition: "يربط النمو الاقتصادي بمؤشرات نوعية الحياة وتعادل القوة الشرائية"

    - lemma: "تَنَامٍ اقْتِصَادِيٌّ"
      confirm:
        - text: "«تنام: تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      contradicts:
        - text: "«تنام: تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "التنامي في المعاجم الموحّدة مخصّص للتراكم الفيزيائي (accretion) لا للنمو الاقتصادي"

    - lemma: "ازْدِهَارٌ اقْتِصَادِيٌّ"
      contradicts:
        - text: "«ازدهار = prosperity»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "الازدهار يقابل prosperity وهو مفهوم مختلف عن النمو (growth)؛ الازدهار حالة رخاء والنمو عملية تزايد"
        - text: "«ازدهار = bonanza»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "يؤكّد أن الازدهار يُستعمل للرخاء المفاجئ لا للنمو المطّرد"

    - lemma: "نَمَاءٌ اقْتِصَادِيٌّ"
      contradicts:
        - text: "«النَّمَاء: الذي يتحدَّث مع القوم فينمَّ عليهم فيكشف ما يكرهون كشفَه.»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "النماء في هذا المعجم بمعنى النمّام، وهو معنى مختلف تماماً"
      expands:
        - text: "«نَمَا الشَّيْءُ: زَادَ، ونَمُوَ: لُغَةٌ. ونَمَاه يَنْمِيْهِ ويَنْمُوْهُ نِمَاءً ونَمَاءَةً»"
          source: "المحيط في اللغة للصاحب بن عباد"
          addition: "النماء مصدر من نَمَى بمعنى الزيادة لكنّه لم يُسجَّل في المعاجم الاقتصادية الحديثة"

stage3_analysis:
  per_lemma:
    - lemma: "نُمُوٌّ اقْتِصَادِيٌّ"
      decision: confirmed
      decision_reason: >
        مصطلح مستقرّ وراسخ في جميع المعاجم الاقتصادية العربية الموحّدة (الاقتصاد، التجارة، القانون،
        الزراعة، الإعلام). وُثّق بتعريفات اصطلاحية دقيقة في أكثر من مصدر. لا يوجد بديل أدقّ أو أشيع منه.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح الاقتصادي المعياري للدلالة على الزيادة المطّردة في القدرة الإنتاجية؛ يختلف عن الازدهار (حالة الرخاء) وعن التنمية (العملية المخطَّطة)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُمُوٌّ اقْتِصَادِيٌّ"

    - lemma: "تَنَامٍ اقْتِصَادِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        التنامي في المعاجم الموحّدة مصطلح هندسي بمعنى accretion (تراكم الجزيئات)، ولم يُسجَّل
        في المعاجم الاقتصادية بمعنى النمو الاقتصادي. رغم صحّته اللغوية إلا أنه لا يتمتّع بتثبيت
        معجمي اقتصادي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "ازْدِهَارٌ اقْتِصَادِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        الازدهار يقابل prosperity/bonanza في المعاجم الاقتصادية الموحّدة، وهو مفهوم مختلف عن
        النمو (growth). الازدهار حالة رخاء عامّة، أمّا النمو فعملية تزايد مطّرد في القدرة الإنتاجية.
        الفرق الدلالي جوهري ولا يصحّ الجمع بينهما في مجموعة ترادفية واحدة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "نَمَاءٌ اقْتِصَادِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        النماء لفظ تراثي بمعنى الزيادة لكنّه لم يُثبَّت في أيّ معجم اقتصادي حديث. بل وجدنا في
        بعض المعاجم «النماء» بمعنى النمّام. استعماله في السياق الاقتصادي قد يُحدث لَبساً، وليس
        له سابقة اصطلاحية في المجال.
      evidence_assessment:
        case: mixed

