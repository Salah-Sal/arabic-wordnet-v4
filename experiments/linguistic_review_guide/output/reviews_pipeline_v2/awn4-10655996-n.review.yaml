# مراجعة المجموعة الترادفية: awn4-10655996-n (spirit)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «روح» غير مشكّلة — يجب إضافة تشكيل كامل: رُوح"
      - "المجموعة تحتوي لمّة واحدة فقط — يُستحسن إثراؤها بمرادفات"
    observations: >
      المفهوم المستهدف هو «المبدأ الحيوي أو القوة المحركة داخل الكائنات الحية»،
      وهو مفهوم محوري في الثقافة العربية الإسلامية، له حضور كثيف في القرآن الكريم
      والحديث النبوي والفلسفة الإسلامية. الجذر ر و ح من أغنى الجذور العربية دلالياً،
      ويتراوح بين الريح والراحة والروح. النَّفْس مرادف قريب جداً في هذا السياق
      وقد ذكر ابن الأنباري أنهما واحد. المجموعة الأعلى (hypernym) هي «مبدأ الحياة /
      مبدأ حيوي» مما يؤكد أن المطلوب هو الجوهر اللطيف الباعث للحياة لا المعنى المجازي.
  blind_candidates:
    - lemma: "رُوح"
      generation_method: ishtiqaq
      justification: >
        من الجذر ر و ح على وزن فُعْل، وهو أشهر لفظ عربي يدلّ على المبدأ الحيوي
        الباعث للحياة في الكائن الحيّ. قال الفيروزآبادي: «ما به حياة الأنفس».
    - lemma: "نَفْس"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن ف س على وزن فَعْل، يدلّ على الذات والروح. قال ابن الأنباري:
        «الرُّوح والنَّفْس واحد». وفي القاموس المحيط: «النَّفْسُ: الرُّوحُ».
        وهي مرادف وثيق للروح في دلالة القوة المحركة للحياة.
    - lemma: "نَسَمَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن س م على وزن فَعَلَة، وفي التعريفات: «النَّسَمة: نفس الروح،
        الإنسان، كل دابة فيها روح». وعند المناوي: «النسمة: النفس لأنها التي تحس
        بالنسم. وهو روح الروح». فهي تدلّ على المبدأ الحيوي الدقيق.
    - lemma: "لَطِيفَة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من معنى الرقّة والدقّة إلى الجوهر الروحي اللطيف. في معجم
        مقاليد العلوم للسيوطي: «الروح: عين لطيف مودع في القالب». وعند السالكين
        اللطيفة هي الجوهر الروحاني الكامن في البدن. غير أنها تخصّصت في الاستعمال
        الصوفي أكثر من المعجمي العام.


stage2_evidence:
  per_lemma:
    - lemma: "رُوح"
      confirm:
        - text: "«الرُّوحُ، بالضم: ما به حَياةُ الأَنْفُسِ، ويُؤَنَّثُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«ما به حياةُ النَّفْس (يذكَّر ويؤنَّث)»"
          source: "المعجم الوسيط"
        - text: "«الرُّوح: عين لطيف مُودع فِي القالب أجْرى الله الْعَادة لخلق الْحَيَاة مَا دَامَ هُوَ فِي القالب»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«النَّفْسُ. قال ابن الأنباري: الرُّوحُ والنَّفْسُ واحِدٌ, غَيْر أن الرُّوح مُذكَّرٌ والنَّفْس مُؤَثَّةٌ. ما به حَياةُ الأَنْفُس. قال الفرَّاء: هو الذى يَعِيشُ به الإنسانُ»"
          source: "المعجم الكبير"
        - text: "«الروح الإنسانية: الجوهر البخاري اللطيف الحامل لقوة الحياة والحس والحركة الإرادية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«فالرُّوحُ رُوحُ الْإِنْسَانِ، وَإِنَّمَا هُوَ مُشْتَقٌّ مِنَ الرِّيحِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الاشتقاق من الريح يربط الروح بالنَّفَس والهواء"
        - text: "«(فى الفلسفة): مَبْدأُ الحياة والحركة في الكائن الحيّ»"
          source: "المعجم الكبير"
          addition: "المصطلح الفلسفي يطابق تعريف المجموعة تماماً"
    - lemma: "نَفْس"
      confirm:
        - text: "«النَّفْسُ: الرُّوحُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«النفس: الجوهر البخاري اللطيف الحامل لقوة الحياة والحس والحركة الإرادية، وسماها الحكيم الروح الحيوانية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«النُّونُ وَالْفَاءُ وَالسِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خُرُوجِ النَّسِيمِ كَيْفَ كَانَ، مِنْ رِيحٍ أَوْ غَيْرِهَا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يربط النَّفْس بالتنفّس والنسيم، مما يؤكد صلتها بالمبدأ الحيوي"
        - text: "«والنَّفْسُ قِوَامُهَا بِالنَّفَسِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "تلازم النَّفْس والنَّفَس يدعم دلالة القوة المحركة"
      contradicts:
        - text: "«النَّفْسُ: الرُّوحُ، والدَّمُ، والجَسَدُ، والعَيْنُ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "النَّفْس مشتركة لفظياً بين الروح والدم والجسد والعين، فقد تلتبس بدلالات أخرى"
    - lemma: "نَسَمَة"
      confirm:
        - text: "«النسمة: النفس لأنها التي تحس بالنسم. وهو روح الروح»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«النَّسَمة: نفسُ الروح، الإنسانُ، كل دابَّة فيها روح»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: "«النُّونُ وَالسِّينُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خُرُوجِ نَفَسٍ، أَوْ رِيحٍ غَيْرِ شَدِيدَةِ الْهُبُوبِ. وَنَفَسُ الْإِنْسَانِ نَسِيمٌ. وَلِذَلِكَ سُمِّيَتِ النَّفْسُ نَسَمَةً»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يفسّر تسمية النَّفْس نسمةً بربطها بالنَّفَس والنسيم"
      contradicts:
        - text: "«كلُّ كائن حيٍّ فيه روح»"
          source: "المعجم الوسيط"
          conflict: "في الاستعمال المعاصر تدلّ النَّسَمة على الكائن الحي ذاته لا على المبدأ الحيوي فيه"
    - lemma: "لَطِيفَة"
      contradicts:
        - text: "«مؤنث اللَّطيف. ومن الكلام: الرقيقة. وجارية لطيفة الخصر: ضامرة البطن»"
          source: "المعجم الوسيط"
          conflict: "الدلالة المعجمية العامة للّطيفة لا تتصل بالمبدأ الحيوي بل بالرقّة والصغر"
        - text: "«اللّطيفة عند السّالكين إشارة دقيقة يتّضح بها إشارة لمعنى لا يتّسع لها اللفظ»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "اللطيفة في الاصطلاح الصوفي تدلّ على المعرفة الذوقية لا على الروح بمعنى مبدأ الحياة"


stage3_analysis:
  per_lemma:
    - lemma: "رُوح"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة ثابتة في جميع المعاجم العربية الكلاسيكية والمعاصرة بدلالة «ما به حياة
        الأنفس». الأدلة متوافقة تماماً مع تعريف المجموعة. يجب تحديث التشكيل لأن
        اللمّة الموجودة «روح» غير مشكّلة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُوح"

    - lemma: "نَفْس"
      source: stage1
      decision: confirmed
      decision_reason: >
        النَّفْس مرادف وثيق للرُّوح في دلالة المبدأ الحيوي. قال ابن الأنباري:
        «الرُّوح والنَّفْس واحد». وأكّد المناوي أنها «الجوهر البخاري اللطيف الحامل
        لقوة الحياة». وإن كانت مشتركة لفظياً مع دلالات أخرى (الدم، الذات، العين)
        فإن السياق يُزيل اللبس. إضافتها تُثري المجموعة بمرادف تراثي راسخ.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        النَّفْس تُركّز على الذات الواعية والكيان الباطني للإنسان، بينما الرُّوح
        تُركّز على الجوهر اللطيف الباعث للحياة بوصفه قوة مفارقة للجسد.
        في الاستعمال القرآني: الرُّوح أعمّ وقد تُطلق على جبريل والوحي،
        والنَّفْس أخصّ بالذات الإنسانية.
      actions:
        - command: create_entry
          params: {lemma: "نَفْس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10655996-n"}

    - lemma: "نَسَمَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن النَّسَمة تعني «النفس» و«روح الروح» في بعض المصادر التراثية،
        فإن استعمالها المعاصر الغالب يدلّ على الكائن الحي ذاته (كقولهم:
        «ثلاثة ملايين نسمة») لا على المبدأ الحيوي. المعجم الوسيط يعرّفها
        بـ«كل كائن حيّ فيه روح» مما يجعلها مجازاً مرسلاً بعيداً عن المطلوب.
      evidence_assessment:
        case: mixed

    - lemma: "لَطِيفَة"
      source: stage1
      decision: removed
      decision_reason: >
        اللطيفة في المعاجم العامة تعني المؤنث من اللطيف أو الإشارة الدقيقة،
        واستعمالها بمعنى الجوهر الروحاني مقصور على الاصطلاح الصوفي ولا يصلح
        للمعجم العام. الأدلة المعجمية تناقض هذا الاستعمال.
      evidence_assessment:
        case: contradicts_only


