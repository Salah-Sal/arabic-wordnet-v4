# مراجعة المجموعة الترادفية: awn4-15118302-n
# volatile — مادة متطايرة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مادة متطايرة» تركيب وصفي طويل نسبياً، ولا يوجد لفظ مفرد يمثّل المفهوم"
      - "اللمّة بدون تشكيل كامل"
    observations: >
      المجموعة تمثّل مفهوم «المادة المتطايرة» في الكيمياء والفيزياء، وهو مفهوم تقني
      يُعبَّر عنه عادةً بتركيب وصفي (مادة + صفة). الجذر ط ي ر هو المحور الدلالي
      الأساسي، إذ يدلّ على الخفّة والانتشار في الهواء. يمكن البحث عن صيغ مفردة
      مشتقة من هذا الجذر تؤدّي المعنى نفسه دون الحاجة إلى التركيب.
  blind_candidates:
    - lemma: "مُتَطَايِر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من تطاير (تَفَاعَلَ) من جذر ط ي ر، على وزن مُتَفَاعِل.
        يدلّ على ما يتفرّق وينتشر في الهواء بسهولة. يمكن أن يُستعمل استعمال الاسم
        (اسم فاعل بمعنى الموصوف) فيغني عن التركيب الوصفي.
    - lemma: "طَيَّار"
      generation_method: ishtiqaq
      justification: >
        صفة مشبّهة على وزن فَعَّال من جذر ط ي ر، تدلّ على كثرة التطاير
        أو الميل إليه. تُستعمل في الاصطلاح العلمي بمعنى volatile.
    - lemma: "مادَّة طَيَّارَة"
      generation_method: tarkib
      justification: >
        تركيب وصفي (مادّة + طيّارة) مرادف للتركيب الموجود «مادة متطايرة»،
        موثّق في معاجم المصطلحات العلمية كبديل مقبول.
    - lemma: "نَفُوح"
      generation_method: majaz
      justification: >
        من جذر ن ف ح على وزن فَعُول الدالّ على كثرة الفعل، بمعنى ما ينتشر
        ريحه أو أثره في الهواء بسرعة. مجاز من النفح (انتشار الرائحة) إلى
        انتشار المادة في الحالة الغازية.

