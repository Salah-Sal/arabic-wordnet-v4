stage3_analysis:
  per_lemma:
    - lemma: "مادَّة مُتَطَايِرَة"
      decision: confirmed
      decision_reason: >
        تركيب وصفي مُوثّق في معاجم المصطلحات العلمية الموحّدة (الكيمياء والجيولوجيا
        والزلازل) وفي المورد الحديث كمقابل دقيق لـ volatile matter/substance.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تركيب وصفي صريح يُبرز طبيعة الموصوف (مادّة) ويصفها بالتطاير،
        أوضح من اللفظ المفرد في السياق غير المتخصّص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مادَّة مُتَطَايِرَة"

    - lemma: "مادَّة طَيَّارَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مرادف موثّق في المعاجم الموحّدة (الجيولوجيا والزلازل والأحياء) بجانب
        «مادة متطايرة»، وتمتاز بإيجاز الصفة (طيّارة بدلاً من متطايرة).
        مسجّلة كبديل في عدة معاجم مصطلحات.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تستعمل «طيّارة» (فَعَّالة) بدلاً من «متطايرة» (اسم فاعل)؛
        أقصر وأقرب إلى الأوزان العربية الأصيلة، وأكثر شيوعاً في
        المصطلحات الطبية والصيدلانية.
      actions:
        - command: create_entry
          params:
            lemma: "مادَّة طَيَّارَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُتَطَايِر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيقه في معاجم المصطلحات كصفة (volatile)، إلا أنه يظلّ اسم فاعل
        يصف خاصّية، لا يدلّ بمفرده على المادّة/الجوهر. المجموعة الترادفية تمثّل
        اسماً (المادّة نفسها)، واستعماله المعجمي يقتضي ذكر الموصوف (مادة/مركّب/زيت).
      evidence_assessment:
        case: mixed

    - lemma: "طَيَّار"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيقه بمعنى volatile في المصطلحات العلمية، إلا أن الدلالة الشائعة
        «قائد الطائرة» (المعجم الوسيط) تولّد اشتراكاً لفظياً حادّاً. كما أنه صفة
        لا تدلّ بمفردها على المادّة.
      evidence_assessment:
        case: mixed

    - lemma: "نَفُوح"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر على أي أدلة معجمية تدعم استعمال هذا اللفظ بمعنى المادة المتطايرة.
        مجرّد اقتراح قياسي لا سند له.
      evidence_assessment:
        case: no_material

