stage1_review:
  assessment:
    concerns:
      - "اللمّة «تركيب كيميائي» تغطّي جانب التركيب فقط دون الخصائص، فهي أضيق دلالياً من مفهوم المجموعة الذي يشمل التركيب والخصائص معاً"
      - "اللمّة «كيمياء» تدلّ في أصلها على العلم لا على خصائص مادة بعينها، واستعمالها بمعنى «كيمياء المادة» توسّع مجازي حديث يحتاج إلى توثيق"
      - "اللمّتان الموجودتان غير مشكَّلتين"
    observations: "المجموعة تصف مفهوم «كيمياء الشيء» أي تركيبه الكيميائي وخصائصه الكيميائية مجتمعَيْن، وهو استعمال مجازي مبنيّ على المجاز المرسل (إطلاق اسم العلم على موضوعه). الواقع الاصطلاحي يُظهر أنّ «كيمياء الحديد» تعبير شائع في العربية المعاصرة يؤدّي هذا المعنى بدقة، بينما «التركيب الكيميائي» يقتصر على بُعد التكوين دون الخصائص."
  blind_candidates:
    - lemma: "كِيمِيَاء"
      generation_method: taarib
      justification: "لفظ معرَّب من اليونانية (χημεία) أصبح مُتداوَلاً في العربية منذ القرون الوسطى، ويُستعمل مجازاً للدلالة على التركيب الكيميائي وخصائص مادة ما، نحو: «كيمياء الدم»"
    - lemma: "تَكْوِين كِيمِيَائِيّ"
      generation_method: tarkib
      justification: "مركّب إضافي-وصفي من «تكوين» (مصدر كَوَّنَ) و«كيميائي»، يدلّ على البنية التكوينية الكيميائية للمادة، مُثبت في المَكنَز الزراعي بمعنى chemical composition"
    - lemma: "كِيمِيَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من النسبة «كيميائيّ»، يدلّ على الطبيعة الكيميائية والخصائص الكيميائية للمادة على وزن فِعْلِيَائِيَّة"
    - lemma: "تَرْكِيبَة كِيمِيَائِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «تركيبة» (اسم هيئة من ركب) و«كيميائية»، يدلّ على الصيغة التركيبية الكيميائية للمادة"

stage2_evidence:
  per_lemma:
    - lemma: "تَرْكِيب كِيمِيَائِيّ"
      confirm:
        - text: "«تركيب كيميائي — chemical composition»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«تركيب كيميائي — chemical composition»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
        - text: "«تركيب كيميائي — chemical structure»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«تركيب (ال…) الكيميائي للتَّساقط — chemical composition of precipitation»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
      contradicts:
        - text: "«تركيب كيميائي — عملية إنتاج مركبات عضوية من طرف كائنات حية للبناء والتغذية تعتمد الطاقة الكيميائية كمحرك — chemosynthesis»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          conflict: "في هذا المصدر يدلّ المصطلح على عملية التخليق الكيميائي (chemosynthesis) لا على التركيب بمعنى composition"
        - text: "«التَّركيب الكيميائيّ: تكوين موادّ كيميائيّة معقَّدة من موادّ أبسط منها بالتَّفاعلات الكيميائيّة ذات الظُّروف الخاصّة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "في هذا السياق يدلّ التركيب الكيميائي على عملية التخليق (synthesis) لا على التكوين (composition)"
      expands:
        - text: "«(فى العلوم الطَّبيِعيَّةِ): تكوينُ مادَّةٍ جَديدةٍ مِنْ عناصرَ أو مرَكَّباتٍ أبسطَ منها, وبخاصَّةٍ في الكيمياءِ»"
          source: "المعجم الكبير"
          addition: "يوضّح أنّ التركيب في العلوم الطبيعية يعني تكوين مادة جديدة من عناصر أبسط"

    - lemma: "كِيمِيَاء"
      confirm:
        - text: "«(2) «أ», كيمياء: «ب» التركيب الكيميائي لمادة ما وخصائصُها الكيميائية the chemistry of iron. «ج» العمليات والظواهر الكيميائية لِـ... blood chemistry»"
          source: "المورد الحديث (2008)"
        - text: "«(الكيمياء) ... (عِنْد الْمُحدثين) علم يبْحَث فِيهِ عَن خَواص العناصر المادية والقوانين الَّتِي تخضع لَهَا فِي الظروف الْمُخْتَلفَة وبخاصة عِنْد اتِّحَاد بَعْضهَا بِبَعْض (التَّرْكِيب) أَو تَخْلِيص بَعْضهَا من بعض (التَّحْلِيل)»"
