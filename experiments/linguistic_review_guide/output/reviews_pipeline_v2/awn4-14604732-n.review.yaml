      expands:
        - text: "«الكِيمِيَاء: إكسير كانوا يزعمون أنه يُحيل المعادن ويجعلها ذهباً أو فضة. وعلمُ الكيمياء عند القدماء هو علم يراد به تحويل بعض المعادن إلى بعض ... وعند المتأخرين هو علمٌ يبحث فيه عن طبائع جميع الأجسام وخواصّها بواسطة الحل والتركيب»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "يبيّن التطوّر الدلالي من الإكسير إلى العلم الحديث"
        - text: "«كِيمْياء [مفرد]: حيلة وحذق وقدرة على التصَّرف في الأمور»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يحفظ المعنى القديم للكيمياء وهو الحيلة والحذق"

    - lemma: "تَكْوِين كِيمِيَائِيّ"
      confirm:
        - text: "«تكوين كيميائي — chemical composition»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"

