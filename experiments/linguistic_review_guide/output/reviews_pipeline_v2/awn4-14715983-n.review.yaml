# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14715983-n (propellant)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مادة دافعة، وقود دافع) تركيبان وصفيّان حُرّان وليسا مصطلحَيْن مسكوكَيْن؛ يجتازان اختبار الإبدال (مادة محرِّكة / وقود محرِّك) فلا يُعدّان وحدتَيْن معجميّتَيْن ثابتتَيْن"
      - "«وقود دافع» يخلط بين مفهومَيْ الوقود (fuel) والدافع (propellant)؛ الدافع في الكيمياء يشمل الوقود والمؤكسِد معاً"
      - "التعريف العربي الحالي «أي مادة تقوم بالدفع» عامّ جدّاً ولا يميّز المفهوم عن أيّ قوّة دافعة"
    observations: "المفهوم تقنيّ يتعلّق بالمادّة المستخدمة في الدفع الصاروخيّ أو في عبوات الرذاذ، وله مصطلح عربيّ مقنَّن في المعاجم الموحَّدة هو «دافع» و«داسر». اللمّتان الحاليّتان وصفيّتان تفسيريّة أكثر منها اصطلاحيّة."
  blind_candidates:
    - lemma: "دَافِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الجذر «دفع» على وزن فاعِل، يدلّ على المادّة التي تؤدّي فعل الدفع؛ مشتقّ مباشر من التعريف دون دوران"
    - lemma: "دَاسِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الجذر «دسر» (الدفع الشديد) على وزن فاعِل، جذر عربيّ أصيل ورد في القرآن ﴿ذاتِ أَلْواحٍ وَدُسُرٍ﴾ ويدلّ على القوّة الدافعة"
    - lemma: "مُسَيِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من سَيَّرَ (فعَّل) على وزن مُفَعِّل، يدلّ على ما يُسيِّر الأجسام ويحرّكها"
    - lemma: "نَافِث"
      generation_method: majaz
      justification: "من الجذر «نفث» بمعنى القذف والبثّ، إزاحة دلاليّة من النفث الحسّيّ إلى مادّة تقذف غازات للدفع؛ يتّسق مع مصطلح «الدفع النفّاث» المعروف"

stage2_evidence:
  per_lemma:
    - lemma: "مَادَّة دَافِعَة"
      evidence_status: "no_material_found"

    - lemma: "وَقُود دَافِع"
      expands:
        - text: "«الوَقُود: الوقّاد وكلّ مادّة تتولّد باحتراقها طاقة حراريّة»"
          source: "المعجم الوسيط"
          addition: "الوقود يُعرَّف بالاحتراق والطاقة الحراريّة، وهو أضيق من مفهوم الدافع الذي يشمل الوقود والمؤكسِد"
      contradicts:
        - text: "«دافع، داسر: وقود دفعيّ يتكوّن من مادة مشتعلة وأخرى مؤكسِدة»"
          source: "المعجم الموحّد لمصطلحات الكيمياء (1992)"
          conflict: "المعجم يعرّف الدافع بأنّه يتكوّن من مادّة مشتعلة ومؤكسِد، فليس وقوداً فحسب؛ تسمية «وقود دافع» تُوهم أنّه وقود فقط"

    - lemma: "دَافِع"
      confirm:
        - text: "«دافع، داسر: وقود دفعيّ يتكوّن من مادة مشتعلة وأخرى مؤكسِدة»"
          source: "المعجم الموحّد لمصطلحات الكيمياء (1992)"
        - text: "«دَافِع، مُسيِّر: propellant»"
          source: "المعجم الموحّد لمصطلحات علوم البحار (2000)"
        - text: "«دافع سائل، داسر سائل: وقود سائل للمحرك الصاروخي — liquid propellant»"
          source: "المعجم الموحّد لمصطلحات الكيمياء (1992)"
        - text: "«دافع نوويّ — nuclear propellant»"
          source: "المعجم الموحّد لمصطلحات الكيمياء (1992)"
        - text: "«غَازٌ دَافِع: في الرذاذات — propellent gas»"
          source: "المعجم الموحّد لمصطلحات علم الصيدلة (2009)"
      expands:
        - text: "«(دَفَعَ) الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر دفع يدلّ على التنحية والإزاحة، وهو الأصل الدلاليّ للدافع بمعنى المادّة المسيِّرة"

    - lemma: "دَاسِر"
      confirm:
        - text: "«دافع، داسر: وقود دفعيّ يتكوّن من مادة مشتعلة وأخرى مؤكسِدة»"
          source: "المعجم الموحّد لمصطلحات الكيمياء (1992)"
        - text: "«الداسِر الأُحاديّ: داسرٌ أو دافعٌ للصواريخ يشتمل على كلا الوقود والمؤكسِد في مادة واحدة — monopropellant»"
          source: "المورد الحديث (2008)"
        - text: "«(1) دَفْع؛ دَسْر؛ تسيير (2) الدافع؛ الدّاسر؛ المسيِّر — propulsion»"
          source: "المورد الحديث (2008)"
        - text: "«داسر: يميّز في المحرّكات الإشعاعيّة جزء من المحرّك، الذي فيه يتمّ تسريع أشعة الغاز المستهلك... — thruster»"
          source: "المعجم الموحّد لمصطلحات النقل (2010)"
      expands:
        - text: "«(دَسَرَ) الدَّالُ وَالسِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الدَّفْعِ. يُقَالُ دَسَرْتُ الشَّيْءَ دَسْرًا، إِذَا دَفَعْتَهُ دَفْعًا شَدِيدًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر دسر يدلّ على الدفع الشديد بقهر، أقوى في دلالته على الدفع من دفع"
        - text: "«دَسَرَ: الشيءَ دفعه دفعاً شديداً. دسرت السفينةُ الماءَ. دسره البحر: دفعه موج البحر وألقاه إلى الشطّ»"
          source: "المعجم الوسيط"
          addition: "الفعل دسر متعدٍّ يدلّ على الدفع القويّ، واستُعمل في سياق السفن والبحر"

    - lemma: "مُسَيِّر"
      confirm:
        - text: "«(1) دَفْع؛ دَسْر؛ تسيير (2) الدافع؛ الدّاسر؛ المسيِّر — propulsion»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«المسيِّر» ورد مرادفاً لـ propulsion (المصدر) لا لـ propellant (المادّة)"
          source: "المورد الحديث (2008)"
          conflict: "المسيِّر يدلّ على فعل التسيير أو الجهاز المسيِّر، لا على المادّة الدافعة ذاتها"

    - lemma: "نَافِث"
      expands:
        - text: "«الدَّفع النفثيّ أو النافوريّ. وبخاصّة: دفع الطائرة بواسطة محرِّكات نفّاثة — jet propulsion»"
          source: "المورد الحديث (2008)"
          addition: "النفث مرتبط بالدفع النفّاث لكنّه يصف آليّة القذف لا المادّة نفسها"

stage3_analysis:
  per_lemma:
    - lemma: "مَادَّة دَافِعَة"
      decision: removed
      decision_reason: "تركيب وصفيّ حرّ يجتاز اختبار الإبدال (مادّة محرِّكة / مادّة مسيِّرة) فليس وحدة معجميّة ثابتة، ولم يُوثَّق في أيّ معجم موحَّد كمصطلح مستقلّ. المصطلح المقنَّن هو «دافع» بإفراده"
