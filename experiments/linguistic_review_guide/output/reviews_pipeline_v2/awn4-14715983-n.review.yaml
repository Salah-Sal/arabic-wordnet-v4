        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وَقُود دَافِع"
      decision: removed
      decision_reason: "تركيب وصفيّ غير مقنَّن يخلط بين مفهوم الوقود (مادّة قابلة للاحتراق) ومفهوم الدافع (وقود + مؤكسِد). المعاجم الموحَّدة تستعمل «دافع» و«داسر» مصطلحَيْن مستقلَّيْن للدلالة على propellant"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "دَافِع"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مقنَّن في المعجم الموحَّد لمصطلحات الكيمياء (1992) وعلوم البحار (2000) والصيدلة (2009) مقابل propellant؛ اسم فاعل عربيّ صرف من جذر «دفع» على وزن فاعِل؛ شائع مطّرد في الاستعمال التقنيّ"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح العامّ والأكثر شيوعاً للدلالة على المادّة الدافعة؛ مشتقّ من جذر «دفع» الذي يدلّ على التنحية والإزاحة عموماً"
      actions:
        - command: create_entry
          params:
            lemma: "دَافِع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "دَاسِر"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مقنَّن مرادف لـ«دافع» في المعجم الموحَّد للكيمياء والمورد الحديث؛ من جذر «دسر» العربيّ الأصيل (ورد في القرآن) بمعنى الدفع الشديد؛ يضيف بُعداً دلاليّاً يميّزه عن «دافع»"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يحمل دلالة القوّة والشدّة في الدفع (من دسر = دفع بقهر)، ويُستعمل أكثر في السياق الصاروخيّ والبحريّ، بينما «دافع» أعمّ"
      actions:
        - command: create_entry
          params:
            lemma: "دَاسِر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُسَيِّر"
      source: stage1
      decision: removed
      decision_reason: "ورد في المورد الحديث مرادفاً لـ propulsion (فعل التسيير) لا لـ propellant (المادّة)؛ يدلّ على الفاعل المسيِّر أو الجهاز لا على المادّة الكيميائيّة ذاتها"

    - lemma: "نَافِث"
      source: stage1
      decision: removed
      decision_reason: "النفث يصف آليّة القذف لا المادّة الدافعة؛ لم يُوثَّق في أيّ معجم موحَّد مقابلاً لـ propellant، وإنّما ورد في سياق «الدفع النفّاث» (jet propulsion) وهو مفهوم مختلف"

