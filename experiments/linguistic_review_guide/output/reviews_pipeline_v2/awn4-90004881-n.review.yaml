# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-90004881-n
# synset: شخص يجهز نفسه ومؤونته تحسباً لوقوع كارثة (prepper)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "مُحْتَاط عامّ جدًّا: يدلّ على الحذر والأخذ بالثقة عمومًا، لا على شخص يجمع المؤونة تحسّبًا لكارثة خصوصًا"
      - "مُسْتَعِدّ لِلْكَوَارِث تعبير وصفيّ حرّ وليس مصطلحًا مسكوكًا؛ يمكن إبدال مُسْتَعِدّ بمُهَيَّأ أو جاهِز فيظل صالحًا كوصف"
      - "المفهوم (prepper) غربيّ حديث مرتبط بثقافة الادّخار تحسّبًا لنهاية العالم أو الكوارث الكبرى، ولا يوجد له مقابل عربي مسكوك"
    observations: "المجموعة تصف مفهوم الشخص الذي يُعِدّ نفسه ومؤونته لمواجهة كوارث محتملة. الأب المباشر (عامل/فاعل) يشير إلى شخص يعمل وينجز، وهو أب بعيد دلاليًّا. اللمّتان الحاليتان تغطّيان جانبَيْن: محتاط يركّز على الحيطة، ومستعد للكوارث يصف الاستعداد، لكنّ الثانية عبارة وصفية لا مصطلح."
  blind_candidates:
    - lemma: "مُتَأَهِّب"
      generation_method: ishtiqaq
      justification: "من تأهَّبَ = استعدّ (المعجم الوسيط)، على وزن مُتَفَعِّل. يدلّ على من يأخذ أهبته للأمر، وهو أقرب من محتاط لأنه يتضمّن فعل الإعداد لا مجرّد الحذر"
    - lemma: "مُتَحَسِّب"
      generation_method: ishtiqaq
      justification: "من تحسَّبَ = احتاط واحترس (المعجم الكبير)، والتعريف نفسه يستعمل «تحسّبًا». يدلّ على من يسعى في الاستطلاع والاحتراس"
    - lemma: "مُدَّخِر"
      generation_method: ishtiqaq
      justification: "من ادّخَرَ يدّخِر = جمع الذخيرة والمؤونة، على وزن مُفْتَعِل. يركّز على جانب تخزين المؤونة في المفهوم"
    - lemma: "مُتَزَوِّد"
      generation_method: ishtiqaq
      justification: "من تزوَّدَ = أخذ الزاد، على وزن مُتَفَعِّل. يدلّ على من يجمع الزاد والعتاد استعدادًا"

stage2_evidence:
  per_lemma:
    - lemma: "مُحْتَاط"
      confirm:
        - text: "«(احتاط) أَخذ فِي أُمُوره بأوثق الْوُجُوه وَيُقَال احتاط لنَفسِهِ وللشيء وَبِه الْخَيل أحدقت»"
          source: "المعجم الوسيط"
        - text: "«واحْتاطَ الرجلُ لنفسه، أي أخَذَ بالثقة»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«الاحتياط: في اللغة هو الحفظ، وفي الاصطلاح: حفظ النفس عن الوقوع في المآثم»"
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: "«(حَوَطَ) الْحَاءُ وَالْوَاوُ وَالطَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ الشَّيْءُ يُطِيفُ بِالشَّيْءِ. فَالْحَوْطُ مِنْ حَاطَهُ حَوْطًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر حوط يدور حول الإحاطة والحفظ، وهو أعمّ من الاستعداد لكارثة"

    - lemma: "مُسْتَعِدّ لِلْكَوَارِث"
      contradicts:
        - text: "«(1) استعداد (2) تأهُّب [للحرب]»"
          source: "المورد الحديث (2008)"
          conflict: "الاستعداد مصدر عام وليس مصطلحًا مسكوكًا لوصف شخص؛ التركيب وصفي حرّ"
      expands:
        - text: "«تأهب للكوارث: مجمل المعارف والقدرات التي تحضرها وتضعها الحكومات... لاستباق ومواجهة ومعالجة آثار أحداث المخاطر المحتملة... استعداد للكوارث (المرادف العربي)»"
          source: "مسرد المناخ والبيئة، أليكسو"
          addition: "المصطلح المؤسسي هو تأهب للكوارث أو استعداد للكوارث وهو يصف المفهوم المجرد (preparedness) لا الشخص"

    - lemma: "مُتَأَهِّب"
      confirm:
        - text: "«(تأهب) لَهُ استعدّ يُقَال تأهّب للسَّفر وللأمر»"
          source: "المعجم الوسيط"
      expands:
        - text: "«التأهب للكوارث — disaster preparedness»"
          source: "المكنز الزراعي متعدد اللغات (AGROVOC)"
          addition: "مصطلح مؤسسي يربط التأهب بالكوارث مباشرة"
        - text: "«(أَهَبَ) الْهَمْزَةُ وَالْهَاءُ وَالْبَاءُ كَلِمَتَانِ... وَالْكَلِمَةُ الثَّانِيَةُ التَّأَهُّبُ. قَالَ الْخَلِيلُ: تَأَهَّبُوا لِلسَّيْرِ. وَأَخَذَ فُلَانٌ أُهْبَتَهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر أهب فيه التأهب بمعنى الاستعداد وأخذ الأهبة"

    - lemma: "مُتَحَسِّب"
      confirm:
        - text: "«فلانٌ: قَعَدَ على الحُسْبانَةِ تَوَسَّد لكذا: احتاط له واحْتَرسَ. يقال: فعَلَ ذلك تَحَسُّبًا لكذا»"
          source: "المعجم الكبير"
        - text: "«(تحسب) الْأَمر سعى فِي مَعْرفَته»"
          source: "المعجم الوسيط"

    - lemma: "مُدَّخِر"
      evidence_status: "no_material_found"

    - lemma: "مُتَزَوِّد"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُحْتَاط"
      decision: confirmed
      decision_reason: "اسم فاعل من احتاط المُثبت في المعاجم الكلاسيكية والحديثة بمعنى أخذ بالثقة والحيطة. وإن كان عامًّا فهو أقرب لفظ مفرد للمفهوم، ويُفهم في السياق"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على جانب الحذر والأخذ بالثقة أكثر من الإعداد المادي؛ أعمّ من متأهّب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحْتَاط"

    - lemma: "مُسْتَعِدّ لِلْكَوَارِث"
      decision: removed
      decision_reason: "تعبير وصفيّ حرّ يخفق في اختبار السكّ: يمكن إبدال مُسْتَعِدّ بمُهَيَّأ أو جاهِز ويبقى صالحًا. المصطلح المؤسسي المسكوك هو تأهّب للكوارث (مصدر) لا مُسْتَعِدّ للكوارث (وصف). لا يصلح لمّةً معجمية"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُتَأَهِّب"
      source: stage1
      decision: confirmed
      decision_reason: "من تأهّب = استعدّ، مثبت في المعجم الوسيط ومقاييس اللغة. وجود مصطلح التأهب للكوارث في المعاجم المؤسسية (أليكسو) يدعم استعمال متأهّب لوصف الشخص المستعدّ. أدقّ من محتاط لأنه يتضمّن فعل الإعداد"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الإعداد الفعلي والاستعداد العملي، بخلاف محتاط الذي يركّز على الحذر الذهني"
      actions:
        - command: create_entry
          params: {lemma: "مُتَأَهِّب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُتَحَسِّب"
      source: stage1
      decision: removed
      decision_reason: "تحسّب في المعاجم يدور حول السعي في المعرفة والاستطلاع أكثر من الإعداد المادي. يكاد يكون مرادفًا تامًّا لمحتاط دون إضافة فارق دلالي واضح"
      evidence_assessment:
        case: mixed

    - lemma: "مُدَّخِر"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية على اللمّة، والمعنى يقتصر على جانب التخزين دون جانب الاستعداد للكوارث"
      evidence_assessment:
        case: no_material

    - lemma: "مُتَزَوِّد"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية، والمعنى ضيّق جدًّا: يقتصر على جمع الزاد دون الإعداد الشامل"
      evidence_assessment:
        case: no_material

