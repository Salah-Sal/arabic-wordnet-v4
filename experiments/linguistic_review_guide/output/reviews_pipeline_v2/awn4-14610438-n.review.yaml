# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14610438-n
# (chemistry) mixture — خَلِيط / مَزِيج
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «خَلِيط» في المعاجم الكلاسيكية يُطلق غالباً على المخالِط (الشريك/الصاحب/الجار)، والمعنى المادي (ما اختلط من صنفين) معنى ثانوي"
      - "لفظ «مَزِيج» بمعنى المفعول (أي الممزوج) لم يرد في المعاجم القديمة وأُقرّ حديثاً بقرار مجمعي"
    observations: "المجموعة تتناول مفهوم الخليط الكيميائي وهو مادة تتألف من مادتين فأكثر دون ترابط كيميائي. اللمّتان الموجودتان (خَلِيط ومَزِيج) كلتاهما على وزن فَعِيل بمعنى مفعول من جذرين مختلفين (خلط ومزج)، وكلتاهما مثبتتان في المعاجم الحديثة والمعجمات المصطلحية. التعريف العربي الحالي جيد ويتضمن التقييد الكيميائي (بنسب غير ثابتة ودون ترابط كيميائي)."
  blind_candidates:
    - lemma: "مَخْلُوط"
      generation_method: ishtiqaq
      justification: "اسم مفعول من خَلَطَ على وزن مَفْعُول، يدلّ على الشيء الذي وقع عليه الخَلْط. يُستخدم في الاصطلاح الكيميائي العربي مرادفاً للخليط."
    - lemma: "مَزِيج"
      generation_method: ishtiqaq
      justification: "فَعِيل بمعنى مفعول من مَزَجَ، أقرّه مجمع اللغة العربية بالقاهرة قياساً. يدلّ على ما مُزج من أشياء مختلفة."
    - lemma: "خَلِيط"
      generation_method: ishtiqaq
      justification: "فَعِيل من خَلَطَ، ورد في الوسيط بمعنى ما اختلط من صنفين أو أصناف، وهو المعنى المطابق للمفهوم الكيميائي."
    - lemma: "خِلْطَة"
      generation_method: ishtiqaq
      justification: "فِعْلَة من خَلَطَ، تدلّ على هيئة الاختلاط أو نتيجته. شائعة في الاستعمال العامي والمهني بمعنى التوليفة."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيط"
      confirm:
        - text: "«ما اختلَط من صنفين أو أصناف»"
          source: "المعجم الوسيط"
        - text: "«(الخليط) مَا اخْتَلَط من صنفين أَو أَصْنَاف والمخالط (للْوَاحِد وَالْجمع)»"
          source: "المعجم الوسيط (حوراماني)"
        - text: "«طِينٌ مُخْتَلِطٌ بتِبْنٍ, أو تِبْنٌ مُخْتَلِطٌ بقَتٍّ» و«لَبَنٌ حُلْوٌ مُخْتَلِطٌ بحامِض»"
          source: "المعجم الكبير"
        - text: "«خَلِيط — mixture / mélange» في ميادين: الكيمياء، الفيزياء، الصيدلة، هندسة المياه، الجيولوجيا، السيارات"
          source: "معجمات ARABTERM المتعددة"
        - text: "«خليط، مخلوط، مزيج — mixture» (المعجم الموحد لمصطلحات الكيمياء)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«الْخَاءُ وَاللَّامُ وَالطَّاءُ أَصْلٌ وَاحِدٌ... خَلَطْتُ الشَّيْءَ بِغَيْرِهِ فَاخْتَلَطَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «خلط» أصل واحد يدلّ على المزج والضمّ"
        - text: "«المخالِط. يُطلق على الشريك, والصاحب, والجار المصافي, والزوج, وابن العمّ»"
          source: "المعجم الوسيط"
          addition: "معنى كلاسيكي إضافي: الشريك والمخالط (للأشخاص)"
        - text: "«اسم يطلق في الطب على عدة عقاقير تعطى للمريض دفعة واحدة، كما يحدث في علاج السرطان بعدة كيماويات في وقت واحد»"
          source: "معجم المصطلحات الطبية"
          addition: "دلالة طبية خاصة: عدة عقاقير معاً (cocktail)"

    - lemma: "مَزِيج"
      confirm:
        - text: "«الشَّرَابُ ونحوه يتكون من شيئين أو أكثر ممتزجين»"
          source: "المعجم الوسيط"
        - text: "«(المزيج) اللوز المر وَالشرَاب وَنَحْوه يتكون من شَيْئَيْنِ أَو أَكثر ممتزجين (مو)»"
          source: "المعجم الوسيط (حوراماني)"
        - text: "«مَزِيج — mixture / mistura / mélange» في المعجم الطبي الموحد"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مزْج، مزيج، شائبة — admixture» (المعجم الموحد لمصطلحات الكيمياء)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«الْمِيمُ وَالزَّاءُ وَالْجِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خَلْطِ الشَّيْءِ بِغَيْرِهِ. وَمَزَجَ الشَّرَابَ يَمْزُجُهُ مَزْجًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «مزج» أصل صحيح يدلّ على خلط الشيء بغيره"
        - text: "«على الرغم من عدم ورود هذه الكلمة في المعاجم بمعنى الممزوج، فإنه يمكن تصحيحها استنادًا إلى قرار مجمع اللغة المصري بقياسية فَعيل بمعنى مفعول»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "أُقرّت بقرار مجمعي رغم عدم ورودها في المعاجم القديمة بهذا المعنى"
        - text: "«اللَّوْز المُرُّ»"
          source: "المعجم الوسيط"
          addition: "معنى قديم: اللوز المرّ، وهو المعنى الأصلي للمزيج"

    - lemma: "مَخْلُوط"
      expands:
        - text: "«خليط، مخلوط، مزيج — mixture» و«مزيج بوردو، مخلوط بوردو — Bordeaux mixture»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يُستخدم مخلوط مرادفاً لخليط ومزيج في المصطلحية الكيميائية، لكنه لا يرد مدخلاً مستقلاً في المعاجم اللغوية"

    - lemma: "خِلْطَة"
      contradicts:
        - text: "«اسم من الاختلاط / الشركة»"
          source: "المعجم الوسيط"
          conflict: "الخُلْطة في الوسيط تعني الشَّرِكة أو العِشْرة، لا المادة المختلطة"
        - text: "«الشَّرِكَةُ»"
          source: "المعجم الكبير"
          conflict: "الخُلْطة بضم الخاء = الشركة، والخِلْطة بكسرها = العِشرة. كلتاهما لا تدلان على المادة المخلوطة"

stage3_analysis:
  per_lemma:
    - lemma: "خَلِيط"
      decision: confirmed
      decision_reason: "لفظ مثبت في المعجم الوسيط والمعجم الكبير بمعنى «ما اختلط من صنفين أو أصناف»، وهو المصطلح المعتمد في عشرات المعجمات المصطلحية العربية (ARABTERM) في ميادين الكيمياء والفيزياء والصيدلة وغيرها. جذره «خلط» أصل عربي صحيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "خَلِيط أقدم تراثياً وأكثر شيوعاً في الاصطلاح العلمي العربي الحديث، وهو المصطلح الأول المعتمد في معظم معجمات ALECSO. يحمل دلالة إضافية كلاسيكية على المخالطة والمجاورة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيط"

    - lemma: "مَزِيج"
      decision: confirmed
      decision_reason: "لفظ أقرّه مجمع اللغة العربية بالقاهرة على وزن فَعِيل بمعنى مفعول قياساً، وأثبتته المعاجم الحديثة (الوسيط والأساسي والمنجد). يُستخدم على نطاق واسع في الاصطلاح الكيميائي والطبي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مَزِيج أعمّ استعمالاً في اللغة المعاصرة وأكثر شيوعاً في السياقات غير التقنية. يوحي بالامتزاج والاندماج أكثر من مجرد الخلط الآلي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَزِيج"

    - lemma: "مَخْلُوط"
      source: stage1
      decision: removed
      decision_reason: "لا يرد مدخلاً مستقلاً في المعاجم اللغوية الكبرى (الوسيط، الكبير). يظهر فقط مرادفاً ثالثاً في بعض المعجمات المصطلحية. وجود خَلِيط ومَزِيج يُغني عنه ويمنع التكرار."
      evidence_assessment:
        case: no_material

    - lemma: "مَزِيج"
      source: stage1
      decision: removed
      decision_reason: "مكرّر مع اللمّة الموجودة «مَزِيج»."
      evidence_assessment:
        case: confirm_only

    - lemma: "خَلِيط"
      source: stage1
      decision: removed
      decision_reason: "مكرّر مع اللمّة الموجودة «خَلِيط»."
      evidence_assessment:
        case: confirm_only

    - lemma: "خِلْطَة"
      source: stage1
      decision: removed
      decision_reason: "الخُلْطة (بالضم) في المعاجم تعني الشَّرِكة، والخِلْطة (بالكسر) تعني العِشْرة. كلتا الدلالتين لا علاقة لهما بالمادة المخلوطة فيزيائياً. لا تصلح مصطلحاً للمفهوم الكيميائي."
      evidence_assessment:
        case: contradicts_only

