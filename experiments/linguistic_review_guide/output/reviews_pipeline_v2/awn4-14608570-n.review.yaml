# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14608570-n
# assay — مادة تخضع لتحليل مكوناتها
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عينة الفحص، مادة الاختبار) مركّبتان إضافيتان بدون تشكيل"
      - "لا توجد لمّة مفردة تدلّ على المادة الخاضعة للتحليل بعينها"
      - "التعريف العربي الحالي مقبول لكنه يفتقر إلى تحديد نوع التحليل (كمّي أو نوعي)"
    observations: >
      المجموعة تدلّ على مادّة تخضع لتحليل مكوّناتها، وهي مفهوم علمي مختبري شائع.
      اللمّة الإنجليزية assay تُستعمل هنا بمعنى «المادة المرزونة» لا بمعنى «عملية الرزن» ذاتها.
      المفهوم يتقاطع مع «العيّنة» (sample) و«المحلَّل» (analyte) لكنه أعمّ من الأخير وأخصّ من الأول.

  blind_candidates:
    - lemma: "عَيِّنَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ع-ي-ن على وزن فَعِّلَة، تدلّ على الجزء المأخوذ من الكلّ لغرض الفحص.
        شائعة في المعجمات العلمية العربية بمعنى sample/specimen.
    - lemma: "حَلِيلَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ح-ل-ل على وزن فَعِيلَة بمعنى المفعول، أي المادة التي يُحَلَّل تركيبها.
        وردت في المعجم الطبي الموحد بمعنى analyte.
    - lemma: "مَادَّةُ التَّحْلِيل"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مادّة» و«التحليل»، يدلّ مباشرة على المادّة الخاضعة لعملية التحليل.
    - lemma: "مَفْحُوصَة"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من فَحَصَ على وزن مَفْعُولَة، تدلّ على ما يُفحَص ويُختبَر.

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "عينة الفحص"
      evidence_status: "no_material_found"

    - lemma: "مادة الاختبار"
      evidence_status: "no_material_found"

    # ── اللمّات المرشحة ──
    - lemma: "عَيِّنَة"
      confirm:
        - text: "«جزء من المادة يؤخد من أجزائها المختلفة نموذجا لسائرها»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«جزء مأخوذ من الكل لغرض الفحص أو إثبات الجودة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«نومذج صخري»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      expands:
        - text: "«عينة الاختبار — test piece / test sample / test specimen»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يوجد مركّب 'عينة الاختبار' بمعنى قريب من المجموعة"

    - lemma: "حَلِيلَة"
      confirm:
        - text: "«حَليلَة [ج:حَلائِل] (المادة التي يجرى تحليلها) — analyte»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«مركب أو عنصر معين يتم قياس كميته أو تركزه عند القيام بالتحليل الكيميائي.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          conflict: "الحليلة تدلّ على المُحلَّل (analyte) وهو المركّب المحدَّد المقاس، لا المادة الخام الخاضعة للتحليل"

    - lemma: "مَادَّةُ التَّحْلِيل"
      evidence_status: "no_material_found"

    - lemma: "مَفْحُوصَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "عَيِّنَةُ الفَحْصِ"
      decision: confirmed
      decision_reason: >
        تركيب إضافي مقبول يدلّ على العيّنة المأخوذة لغرض الفحص والتحليل.
        يقابل المصطلح الإنجليزي test specimen/sample. المركّب القريب
        «عينة الاختبار» مسجّل في المعجم الموحد لمصطلحات المياه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تركّز على جانب أخذ العيّنة والنموذج من المادة الأصلية لإجراء الفحص عليها،
        بخلاف «مادة الاختبار» التي تركّز على كون المادة موضوع الاختبار ذاتها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَيِّنَةُ الفَحْصِ"

    - lemma: "مَادَّةُ الِاخْتِبَارِ"
      decision: confirmed
      decision_reason: >
        تركيب إضافي صحيح يدلّ على المادة التي تُخضَع للاختبار والتحليل.
        «مادة» أعمّ من «عيّنة»، فتشمل المادة كاملة لا جزءاً منها فحسب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تدلّ على المادة بوصفها كتلة خاضعة للاختبار، دون اشتراط أخذ جزء منها.
        أعمّ من «عيّنة الفحص» التي تفترض اقتطاع نموذج.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّةُ الِاخْتِبَارِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "عَيِّنَة"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ عامّ يدلّ على أيّ نموذج مأخوذ من كلّ لأغراض شتّى (إحصائية، جيولوجية، تجارية...).
        المجموعة تخصّ المادة الخاضعة لتحليل مكوّناتها تحديداً، و«عيّنة» وحدها لا تفيد هذا التخصيص.
        إضافتها ستوسّع المجموعة أكثر من اللازم.

    - lemma: "حَلِيلَة"
      source: stage1
      decision: removed
      decision_reason: >
        تدلّ على المُحلَّل (analyte) وهو المركّب أو العنصر المحدَّد المُقاس في التحليل،
        لا على المادة الخام التي تخضع للتحليل. فرق دلالي جوهري:
        الحليلة هي ما يُبحث عنه داخل المادة، والمجموعة تدلّ على المادة المُحلَّلة نفسها.

    - lemma: "مَادَّةُ التَّحْلِيل"
      source: stage1
      decision: removed
      decision_reason: >
        مركّب إضافي غير مسجّل في المعاجم المتاحة، ويتداخل دلالياً مع «مادة الاختبار» الموجودة.
        لا يضيف تمييزاً دلالياً كافياً يبرّر إدراجه في المجموعة.

    - lemma: "مَفْحُوصَة"
      source: stage1
      decision: removed
      decision_reason: >
        اسم مفعول وصفي، لا مصطلح مسكوك. يمكن أن يُستعمل صفةً لأي شيء يُفحص
        (تربة مفحوصة، عيّنة مفحوصة)، وليس اسماً مستقلاً للمادة الخاضعة للتحليل.
        لم يُعثر على أي دليل معجمي لاستعماله اسماً.

stage4_content:
  definition:
    current: "مادة تخضع لتحليل مكوناتها"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في جوهره لكنه يفتقر إلى ذكر الغرض من التحليل
        (تحديد النسب الكمّية أو النوعية) وإلى ربطه بالسياق المختبري.
    authored:
      - type: terminological
        text: "مادّةٌ تُخضَع لتحليلٍ كيميائيّ أو فيزيائيّ بغرض تحديد مكوّناتها أو نسبها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يُرزَن ويُحلَّل من الموادّ لمعرفة عناصره وتركيبه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ تُخضَع لتحليلٍ كيميائيّ أو فيزيائيّ بغرض تحديد مكوّناتها أو نسبها"

  examples:
    per_lemma:
      - lemma: "عَيِّنَةُ الفَحْصِ"
        examples:
          - text: "أرسل المختبر عيّنةَ الفحص إلى قسم التحليل الطيفيّ لتحديد نسبة المعادن الثقيلة فيها."
            type: usage
      - lemma: "مَادَّةُ الِاخْتِبَارِ"
        examples:
          - text: "يجب حفظ مادّة الاختبار في درجة حرارة مناسبة حتى لا تتغيّر خصائصها قبل إجراء التحليل."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أرسل المختبر عيّنةَ الفحص إلى قسم التحليل الطيفيّ لتحديد نسبة المعادن الثقيلة فيها."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يجب حفظ مادّة الاختبار في درجة حرارة مناسبة حتى لا تتغيّر خصائصها قبل إجراء التحليل."

