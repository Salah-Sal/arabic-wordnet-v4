# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10737238-n (toucher)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحوي لمّة واحدة فقط (لَامِس)، وهو مفهوم بسيط (فاعل اللمس) يمكن أن يُثرى بمرادف من جذر م س س"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي، يمكن تحسينه بأسلوب معجمي عربي"
    observations: "المفهوم يشير إلى شخص يُوقع اللمس أو يُمكّن منه، أي اسم فاعل من فعل اللمس. الجذر الأساسي هو ل م س، ويوجد جذر مقارب هو م س س (مَسَّ). لَامِس على وزن فَاعِل من لَمَسَ وهو الوزن الطبيعي لاسم الفاعل من الثلاثي المجرد. المفهوم عربي أصيل ومعروف في الاستعمال اللغوي القديم."
  blind_candidates:
    - lemma: "لَامِس"
      generation_method: ishtiqaq
      justification: "اسم فاعل من لَمَسَ يَلْمِسُ على وزن فَاعِل، من الجذر ل م س الدال على المسيس والتطلب باليد. أقرب لفظ للمفهوم المطلوب."
    - lemma: "مَاسّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من مَسَّ يَمَسُّ على وزن فَاعِل (مع إدغام)، من الجذر م س س. المسّ أعمّ من اللمس وقد يفيد معنى الملامسة."
    - lemma: "مُلَامِس"
      generation_method: ishtiqaq
      justification: "اسم فاعل من لَامَسَ يُلَامِسُ (فَاعَلَ)، يدل على المشاركة في اللمس. الفعل مستعمل في القرآن: {أَوْ لَامَسْتُمُ النِّسَاءَ}."
    - lemma: "جَاسّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من جَسَّ يَجُسُّ، من الجذر ج س س الدال على تحسّس الشيء باليد واستكشافه باللمس."

stage2_evidence:
  per_lemma:
    - lemma: "لَامِس"
      confirm:
        - text: "«يقال: امرأةٌ لا تردُّ يَدَ لامِس: فاجِرةٌ. فلانٌ لا يَرُدُّ يدَ لامس: لا مَنَعَةَ له»"
          source: "المعجم الوسيط"
        - text: "«لَامِس: من (ل م س) من مس الشيء بيده وأدرك الحرارة أو البرودة ونحو ذلك. لَامِس: من (ل م س) من يلمس غيره بيده.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«اللَّامُ وَالْمِيمُ وَالسِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَطَلُّبِ شَيْءٍ وَمَسِيسِهِ أَيْضًا... قَالُوا: وَكُلُّ مَاسٍّ لَامِسٌ.»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«لامِسُ: بالسين مهملة، وكسر الميم: من قرى الغرب، ينسب إليها أبو سليمان الغربي اللامسي»"
          source: "معجم البلدان لياقوت الحموي"
          addition: "لَامِس أيضاً اسم موضع، لكنه استعمال مختلف (علم مكان) لا يؤثر على الدلالة المطلوبة"

    - lemma: "مَاسّ"
      contradicts:
        - text: "«المَاسُّ: وصف من مَسَّ. يقال: بينهم رَحِمٌ مَاسَّةٌ: قرابة قريبة. حاجة مَاسَّةٌ: مُهِمَّةٌ»"
          source: "المعجم الوسيط"
          conflict: "مَاسّ في المعجم الوسيط مصنّف صفةً (adj) لا اسم فاعل بمعنى الشخص الذي يمسّ، واستعماله الشائع في التعبيرات الوصفية (حاجة ماسّة، رحم ماسّة) لا في الدلالة على الفاعل"

    - lemma: "مُلَامِس"
      evidence_status: "no_material_found"

    - lemma: "جَاسّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "لَامِس"
      decision: confirmed
      decision_reason: "اسم فاعل قياسي من لَمَسَ، مثبت في المعجم الوسيط وموسوعة السلطان قابوس بمعنى «مَن يلمس غيره بيده»، ومقاييس اللغة ينصّ على أن «كلَّ ماسٍّ لامسٌ». الوزن (فَاعِل) مناسب تماماً لاسم الفاعل من الثلاثي المجرد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَامِس"

    - lemma: "مَاسّ"
      source: stage1
      decision: removed
      decision_reason: "مَاسّ في المعاجم وصفٌ من مَسَّ لا اسم فاعل دالّ على الشخص، واستعماله الحيّ محصور في التعبيرات الوصفية (حاجة ماسّة، رحم ماسّة). المعجم الوسيط صنّفه صفةً. إدراجه يُوهم بترادف غير دقيق."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُلَامِس"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على استعمال مُلَامِس اسمَ فاعل دالّاً على الشخص. وزن مُفَاعِل يوحي بالمشاركة والتفاعل بين طرفين، بينما المجموعة تصف فاعلاً أحاديّ الاتجاه."
      evidence_assessment:
        case: no_material

    - lemma: "جَاسّ"
      source: stage1
      decision: removed
      decision_reason: "الجَسّ في المعاجم مختصّ بالاستكشاف والتحسّس لغرض المعرفة (كجسّ الطبيب)، وليس مرادفاً للَمْس العامّ. لا أدلة معجمية على استعماله بمعنى toucher المطلق."
      evidence_assessment:
        case: no_material

