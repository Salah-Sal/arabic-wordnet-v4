# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14838786-n (coal / فحم)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «فحم» مشترك لفظي يشمل الفحم النباتي (charcoal) والفحم الحجري (coal)، والمجموعة خاصة بالفحم الحجري فقط"
      - "العُقدة الفائقة (hypernym) هي «مادة نباتية» وهي ترجمة لـ plant material، والأدق تصنيف الفحم الحجري تحت «وقود أحفوري» (fossil fuel)"
    observations: "المفهوم المقصود هو الفحم الحجري بوصفه وقوداً أحفورياً تكوّن من بقايا نباتية في باطن الأرض عبر عصور جيولوجية. لفظ «فحم» في العربية الكلاسيكية يعني أصلاً الجمر الطافئ أو ما تخلّف من إحراق الخشب، ثم توسّع في العصر الحديث ليشمل الفحم الحجري. المركّب «فحم حجري» هو المصطلح الدقيق المميِّز لهذا النوع."
  blind_candidates:
    - lemma: "فَحْم"
      generation_method: ishtiqaq
      justification: "من الجذر ف ح م، اللفظ الأساسي للمادة السوداء المتخلّفة من الاحتراق، توسّع دلالياً في الاستعمال الحديث ليشمل الوقود الأحفوري"
    - lemma: "فَحْم حَجَرِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي ثابت يميّز الفحم المعدني الأحفوري عن الفحم النباتي، مصطلح مسكوك في المعاجم الموحّدة"
    - lemma: "حُمَمَة"
      generation_method: majaz
      justification: "من الجذر ح م م الدال على السواد والاحتراق، الحُمَمَة هي الفحمة المحترقة، مجاز بالمشابهة في السواد والأصل الاحتراقي"
    - lemma: "رِكَاز"
      generation_method: majaz
      justification: "من الجذر ر ك ز بمعنى ما رُكِز في الأرض من المعادن، مجاز من المعدن المدفون إلى الوقود الأحفوري المترسّب في جوف الأرض"

stage2_evidence:
  per_lemma:
    - lemma: "فَحْم"
      confirm:
        - text: "«(الفحم) مَادَّة سَوْدَاء ذَات مسام تتخلف من إحراق الْخشب وَالْعِظَام وَنَحْوهمَا إحراقا جزئيا (ج) فحام وفحوم و (الفحم النباتي) مَا تخلف من إحراق النَّبَات خَاصَّةو (الفحم الحجري) مَعْدن أسود براق أَو ضَارب إِلَى السوَاد تكون من مواد نباتية فِي جَوف الأَرْض خلال عصور متطاولة»"
          source: "المعجم الوسيط"
        - text: "«صخور رسوبية صلبة، ذات لون بين الأسود والبني، تنشأ من خلال عملية كربنة بقايا النباتات. وتمثل مادة الكربون في الفحم ما يزيد على 70% من تكوينه، وأكثر من 50% من وزنه.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«الفَحَمُ، محرَّكةً، وبالفتح وكأَميرٍ: الجَمْرُ الطافِئُ، والفَحْمَةُ: واحِدَتُه»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الأصل اللغوي الكلاسيكي: الجمر الطافئ، أي ما انطفأ من الجمر"
        - text: "«الفَحْمُ: الجَمْرُ الطّافي. الواحدةُ: فَحْمة.»"
          source: "كتاب العين"
          addition: "تأكيد المعنى الأصلي في أقدم معجم عربي"

    - lemma: "فَحْم حَجَرِيّ"
      confirm:
        - text: "«(الفحم الحجري) مَعْدن أسود براق أَو ضَارب إِلَى السوَاد تكون من مواد نباتية فِي جَوف الأَرْض خلال عصور متطاولة»"
          source: "المعجم الوسيط"
        - text: "«صخر رسوبي أسود اللون، يتميّز بالخشونة والصلابة، وينشأ نتيجة حدوث عملية التكربن. ويُمثل الكربون أكثر من 50% من وزنه، وأكثر من 70% من حجمه. وعليه فإن الفحم الحجري مُصطلح جامع لأنواع الفحم عالية القيمة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«ما يوجد من الفحم في باطن الأرض»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«صخور صلبة رسوبية سوداء إلى بنية، والتي تكونت نتيجة تفحم ما يبقى من النبات.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"

    - lemma: "حُمَمَة"
      confirm:
        - text: "«الفَحْمَةُ ما أُحْرِقَ من خَشَبٍ ونحوه الجَمْرُ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الحُمَمُ الْفَحْمُ» — في سياق السواد والاحتراق المباشر لا الترسّب الأحفوري"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الحُمَمَة تدل على الفحمة الناتجة عن الاحتراق المباشر لا على الوقود الأحفوري المتكوّن جيولوجياً"

    - lemma: "رِكَاز"
      contradicts:
        - text: "«رِكَاز رديء — رِكَاز ضعيف المحتوى المعدني»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "الركاز يُستعمل في الجيولوجيا بمعنى الخام المعدني (ore) لا الفحم الحجري تحديداً"

stage3_analysis:
  per_lemma:
    - lemma: "فَحْم"
      decision: confirmed
      decision_reason: "لفظ «فَحْم» هو الاسم العام الشائع المستعمل في العربية المعاصرة للدلالة على الفحم بأنواعه، بما فيها الفحم الحجري. ورد في المعجم الوسيط بتعريف صريح للفحم الحجري كنوع فرعي. وإن كان اللفظ مشتركاً (يشمل الفحم النباتي)، فإن السياق كافٍ للتمييز، ويُستعمل مختصراً عن «فحم حجري» في الاستعمال الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ العام الشامل لجميع أنواع الفحم، يُستعمل اختصاراً للفحم الحجري في السياقات الواضحة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَحْم"

    - lemma: "فَحْم حَجَرِيّ"
      decision: confirmed
      decision_reason: "مصطلح مسكوك ثابت في المعاجم الموحّدة (الكيمياء، الجيولوجيا، الطاقة المتجددة) وفي المعجم الوسيط. هو الترجمة الدقيقة لـ coal بوصفه وقوداً أحفورياً، ويميّزه عن الفحم النباتي (charcoal)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح الدقيق المخصَّص للفحم المعدني الأحفوري، يُميّزه عن الفحم النباتي ولا لَبْس فيه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَحْم حَجَرِيّ"

    - lemma: "حُمَمَة"
      source: stage1
      decision: removed
      decision_reason: "الحُمَمَة في المعاجم تدل على الفحمة الناتجة عن الإحراق المباشر للخشب ونحوه (charcoal/ember)، ولا تُستعمل للدلالة على الوقود الأحفوري المتكوّن جيولوجياً. الفرق الدلالي جوهري بين الاحتراق الصناعي والترسّب الجيولوجي."

    - lemma: "رِكَاز"
      source: stage1
      decision: removed
      decision_reason: "الركاز في الاستعمال المعجمي يعني الخام المعدني المدفون في الأرض عموماً (ore)، وقد اصطُلح عليه في معاجم الجيولوجيا الحديثة بهذا المعنى العام. لا يختص بالفحم الحجري ولا يصح حصره فيه."

