# ═══════════════════════════════════════════════════════════════
# مراجعة: awn4-13459075-n — batch processing / معالجة دفعية
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط، وهي مركّب إضافي بدون تشكيل"
      - "التعريف العربي ترجمة حرفية للإنجليزي ولا يعكس الخصوصية الاصطلاحية للمعالجة الدُّفعية"
      - "التعريف يذكر «التنفيذ التسلسلي» وهذا جانب واحد فقط؛ السمة الجوهرية هي انعدام التفاعل مع المستخدم"
    observations: >
      المفهوم ينتمي إلى حقل الحوسبة والمعلوماتية، وهو مفهوم تقني مستقر
      له مقابلات عربية متعددة في معاجم المصطلحات (ALECSO وغيرها).
      التعريف الحالي يحتاج مراجعة لأنه لا يميّز المعالجة الدفعية عن أنماط
      التنفيذ الأخرى. اللمّة الموجودة «معالجة دفعية» هي الأكثر شيوعاً
      واطّراداً في المعاجم التقنية العربية.

  blind_candidates:
    - lemma: "مُعَالَجَة دُفْعِيَّة"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «معالجة» (مصدر ميمي من عالج) و«دفعية» (نسبة إلى دفعة).
        أقرب تركيب طبيعي للدلالة على تنفيذ البرامج على دفعات متتابعة دون تفاعل.
    - lemma: "تَشْغِيل دُفْعِيّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «تشغيل» (مصدر شغّل) و«دفعيّ» (نسبة إلى دفعة).
        يصف نمط التشغيل الذي تُنفَّذ فيه المهام على دفعات.
    - lemma: "مُعَالَجَة بِالدُّفُعَات"
      generation_method: tarkib
      justification: >
        مركّب من «معالجة» مع شبه جملة «بالدفعات» (جمع دُفعة).
        يصف أسلوب المعالجة القائم على تقسيم العمل إلى دفعات.
    - lemma: "تَجْمِيع"
      generation_method: ishtiqaq
      justification: >
        مصدر من جمّع (فعّل) على وزن تَفْعِيل، من جذر «جمع».
        يدلّ على ضمّ المهام في مجموعات لتنفيذها دفعةً واحدة.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُعَالَجَة دُفْعِيَّة"
      confirm:
        - text: "«عملية معالجة متقطعة تعالج فيها كمية معينة من السائل في كل مرة، أي على دفعات»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«1- تنفيذُ ملفٍّ دفعيّ (سلسلة من أوامر نظام التشغيل المُخزنة ضمن ملف، تنفذ تباعاً، بدون تدخل المستخدِم بعد بدء التنفيذ). 2- ممارسةُ استحصالِ البرامج ومجموعاتِ المعطيات من المستخدِمين، وتنفيذُها فرادى، أو بعضاً منها في كلِّ مرة، ثم تزويدُ المستخدِمين بالنتائج. 3- ممارسةُ تخزينِ المداولات لمدةٍ من الزمن قبل إرسالها إلى الملف الرئيسي، وتجري عادة في عملية منفصلة في الليل.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«معالجة متقطعة، إجرائية دفعية»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "يُستخدم أيضاً مصطلح «معالجة متقطعة» كمرادف في سياق النفط"

    - lemma: "تَشْغِيل دُفْعِيّ"
      evidence_status: "no_material_found"

    - lemma: "مُعَالَجَة بِالدُّفُعَات"
      confirm:
        - text: "«معالجة تلقائية لمتتالية من المعطيات في شكل دفعات حسب ترتيب متتال»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"

    - lemma: "تَجْمِيع"
      contradicts:
        - text: "«»"
          source: "مسرد الفن والتسلية والرياضة (ALECSO)"
          conflict: "المدخل يترجم batching (batch processing) لكن «تجميع» بذاته يدلّ على الجمع والتركيب عموماً، وهو أعمّ من المعالجة الدفعية بكثير"

    - lemma: "مُعَالَجَة الدُّفُعَات"
      confirm:
        - text: "«(مقابل batch processing)»"
          source: "مسرد الفن والتسلية والرياضة (ALECSO)"
      expands:
        - text: "«معالجة مجموعة من البيانات أو البرامج بأقل قدر من التفاعل البشري»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "معجم الذكاء الاصطناعي يستخدم «معالجة الحُزمة» بدل «معالجة الدفعات»"

    - lemma: "مُعَالَجَة الوَجِيبَة"
      confirm:
        - text: "«(مقابل batch processing)»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«الوجيبة» لفظة طبية غير مستعملة في سياق الحوسبة"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "اقتصار الاستعمال على المجال الطبي"

# ── المرحلة ٣: التحليل اللغوي ─────────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "مُعَالَجَة دُفْعِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك ثابت ومُوثّق في عدة معاجم مصطلحية عربية (الهندسة المدنية،
        المعلوماتية، النفط). اللفظ أصيل الاشتقاق: «معالجة» مصدر ميمي من عالج
        (وزن مُفاعَلة)، و«دُفعية» نسبة إلى دُفعة (مِن دَفَع). يجب تحديث
        التشكيل في الشبكة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح الأكثر شيوعاً واطّراداً في أدبيات الحوسبة العربية، يُستعمل في السياقات التقنية الرسمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعَالَجَة دُفْعِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُعَالَجَة دُفْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مطابقة تامة للّمّة الموجودة، لا حاجة لإنشاء مدخل مكرر"

    - lemma: "تَشْغِيل دُفْعِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي يوثّق هذا المركب بوصفه مصطلحاً ثابتاً
        للدلالة على المعالجة الدفعية. المدخل الوحيد الذي يحوي «تشغيل دفعي»
        يتعلق بالسكك الحديدية (push-pull operation).
      evidence_assessment:
        case: no_material

    - lemma: "مُعَالَجَة بِالدُّفُعَات"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مُوثّق في المعجم الموحد لمصطلحات تقانة المعلومات (ALECSO 2011)
        بتعريف واضح: «معالجة تلقائية لمتتالية من المعطيات في شكل دفعات».
        يُضيف تنويعاً تركيبياً مفيداً (شبه جملة بدل النسبة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "صيغة بديلة تُبرز مفهوم التقسيم إلى دفعات بوضوح أكبر، تُستعمل في المعاجم المصطلحية الرسمية (ALECSO)"
      actions:
        - command: create_entry
          params:
            lemma: "مُعَالَجَة بِالدُّفُعَات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَجْمِيع"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ عام يدلّ على الجمع والتركيب، ودلالته أوسع بكثير من المعالجة الدفعية.
        وروده مقابلاً لـ batching في معجم واحد لا يكفي لإثبات تخصّصه الدلالي في
        مجال الحوسبة.
      evidence_assessment:
        case: mixed

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "التنفيذ التسلسلي لبرامج الكمبيوتر"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزي، ويذكر «التسلسلي» فقط
        وهو جانب واحد. السمة المميزة للمعالجة الدفعية هي تنفيذ المهام
        على دفعات دون تفاعل مع المستخدم، وهو ما تؤكده المعاجم المتخصصة.
    authored:
      - type: terminological
        text: "أُسلوبٌ في الحَوسَبةِ تُنفَّذُ فيهِ مَجموعةٌ مِنَ البَرامِجِ أَوِ المَهامِّ دُفعةً واحِدةً وَفقَ تَرتيبٍ مُتتالٍ، دونَ تَفاعُلٍ مَعَ المُستخدِمِ أَثناءَ التَّنفيذِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "نَمَطٌ مِن أَنماطِ مُعالَجةِ البَياناتِ الحاسوبيَّةِ يُجمَعُ فيهِ عَدَدٌ مِنَ البَرامِجِ أَو مَجموعاتِ المُعطَياتِ ويُنفَّذُ تِباعاً دونَ تَدخُّلِ المُستخدِمِ بَعدَ بَدءِ التَّنفيذِ، وَيُقابِلُ ذلكَ نَمَطَ المُعالَجةِ التَّفاعُليَّةِ الذي يَتطلَّبُ حُضورَ المُستخدِمِ"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "أُسلوبٌ في الحَوسَبةِ تُنفَّذُ فيهِ مَجموعةٌ مِنَ البَرامِجِ أَوِ المَهامِّ دُفعةً واحِدةً وَفقَ تَرتيبٍ مُتتالٍ، دونَ تَفاعُلٍ مَعَ المُستخدِمِ أَثناءَ التَّنفيذِ"

  examples:
