# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14905454-n — glass / زُجَاج
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «زجاج» بدون تشكيل — يجب إضافة التشكيل الكامل: زُجَاج"
      - "التعريف العربي يبدو مترجماً حرفياً من الإنجليزية (بنية ذرية غير منتظمة) ولا يتوافق مع أسلوب المعاجم العربية"
    observations: "المفهوم المستهدف هو مادة الزُّجاج بوصفها جوهراً صلباً شفافاً هشّاً. المعاجم العربية تعرّفه بصفاته الفيزيائية (الصلابة، الشفافية، سهولة الكسر) وبطريقة صنعه (من الرمل والقِلي)، لا ببنيته الذرية. المجموعة تحتوي لمّة واحدة فقط وهو مقبول لأنّ «زُجَاج» هو اللفظ الأصيل المتفرّد بهذه الدلالة."
  blind_candidates:
    - lemma: "زُجَاج"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر ز ج ج الدالّ على الرقّة والدقّة. هو اللفظ الأصيل الذي تواترت عليه المعاجم العربية للدلالة على هذه المادة الصلبة الشفافة."
    - lemma: "بِلَّوْر"
      generation_method: taarib
      justification: "معرّب قديم من اليونانية، يُطلق على الحجر الأبيض الشفاف ونوع من الزجاج النقيّ. قد يصلح مرادفاً جزئياً."
    - lemma: "قَوَارِير"
      generation_method: majaz
      justification: "مجاز مُرسل من باب إطلاق اسم الوعاء على المادة. وردت في القرآن: {قَوَارِيرَ مِن فِضَّةٍ} وتُستعمل في الاستعمال الكلاسيكي."
    - lemma: "سَجَنْجَل"
      generation_method: taarib
      justification: "لفظ معرّب من الرومية يُطلق على المرآة وأجسام شفافة لامعة. اختبار مدى صلته بدلالة الزجاج."

# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "زُجَاج"
      confirm:
        - text: "«جوهرٌ صلب سهل الكسر, شفاف, يُصنع من الرمل والقِلْي»"
          source: "المعجم الوسيط"
        - text: "«مادة شفافةٌ صُلْبة قَصِفةٌ الكسر, يُحصلُ عليها من صَهْرِ الرِّمال الناعمة مع الصودا وبعض المكوِّنات الأُخرى فى درجات حرارة عالية»"
          source: "المعجم الكبير"
      expands:
        - text: "«القَوَارِيرُ. وقيل: الأقداحُ. ما تكسَّرَ مِنْه وتَفرَّقَ (رَفْضُ الزُّجاجِ)»"
          source: "المعجم الكبير"
          addition: "يبيّن أنّ الزجاج يشمل القوارير والأقداح، ويُطلق أيضاً على كِسَر الزجاج المتفرّقة"
        - text: "«إذا كان بَيْتُكَ من زُجاجٍ فلا تَرْمِ النَّاسَ بالحجارة»"
          source: "المعجم الكبير (مثل)"
          addition: "شاهد على استعمال الزجاج في الأمثال العربية بمعنى المادة الهشّة"

    - lemma: "بِلَّوْر"
      contradicts:
        - text: "«حجر أَبيض شفاف وَنَوع من الزّجاج»"
          source: "المعجم الوسيط"
          conflict: "البلّور نوعٌ من الزجاج أو حجرٌ شفاف، وليس مرادفاً تامّاً للزجاج كمادة عامة"
        - text: "«جَوْهَرٌ أبيضُ شَفَّاف (عن الزبيدي)، وهو نوعٌ من الزُّجاج النقِي»"
          source: "المعجم الكبير"
          conflict: "يؤكد أنّ البلور فرعٌ من الزجاج لا مرادفٌ له"
      expands:
        - text: "«مادة غير عضوية متجانسة بتركيب كيميائي واضح، تحدها أسطح منبسطة، والتي تشكل زوايا محددة مع بعضها البعض، لتعطي جسما بهيكل هندسي منتظم»"
          source: "مسرد المناخ والبيئة (أربتيرم)"
          addition: "البلور في الاصطلاح العلمي الحديث مادة ذات بنية هندسية منتظمة — عكس الزجاج تماماً الذي بنيته غير منتظمة"

    - lemma: "قَوَارِير"
      contradicts:
        - text: "«وعَاء من الزّجاج تحفظ فِيهِ السوائل ووعاء الطّيب وَالْمَرْأَة على التَّشْبِيه بهَا فِي سهولة الْكسر»"
          source: "المعجم الوسيط"
          conflict: "القارورة وعاء مصنوع من الزجاج وليست مادة الزجاج ذاتها. العلاقة احتواء لا ترادف."

    - lemma: "سَجَنْجَل"
      contradicts:
        - text: "«المِرْآة. الذَّهَب. سبائك الفضة. الزَّعْفَرَان. (رومي مُعرب)»"
          source: "المعجم الوسيط"
          conflict: "السجنجل يدلّ على المرآة والذهب والزعفران، ولا علاقة له بمادة الزجاج"
        - text: "«السَّجَنْجَلُ: الزَّعْفَرَانُ. والمِرْآةُ»"
          source: "المحيط في اللغة للصاحب بن عباد"
          conflict: "يؤكّد أنّ الدلالة محصورة في المرآة والزعفران"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ──
    - lemma: "زُجَاج"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل من الجذر ز ج ج، تواترت عليه المعاجم الكلاسيكية والحديثة بدلالة واحدة هي المادة الصلبة الشفافة سهلة الكسر. لا يُنازعه لفظ آخر في هذه الدلالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زُجَاج"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بِلَّوْر"
      source: stage1
      decision: removed
      decision_reason: "البلّور في المعاجم العربية حجر أبيض شفاف أو نوع من الزجاج النقي، وفي الاصطلاح العلمي الحديث مادة ذات بنية بلورية منتظمة — وهو نقيض تعريف الزجاج (بنية غير منتظمة). العلاقة اشتمال (hyponymy) لا ترادف."
      evidence_assessment:
        case: contradicts_only

    - lemma: "قَوَارِير"
      source: stage1
      decision: removed
      decision_reason: "القوارير جمع قارورة وهي وعاء من الزجاج. العلاقة هي أنّ المادة تُصنع منها الأوعية، فالقارورة مصنوعة من الزجاج لا مرادفة له. لا يصحّ إطلاق اسم الوعاء على المادة في سياق معجمي دقيق."
      evidence_assessment:
        case: contradicts_only

    - lemma: "سَجَنْجَل"
      source: stage1
      decision: removed
      decision_reason: "السجنجل لفظ معرّب يدلّ على المرآة والذهب والزعفران حصراً. لا تربطه بمادة الزجاج أي علاقة دلالية مباشرة في أيّ معجم."
      evidence_assessment:
        case: contradicts_only

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
