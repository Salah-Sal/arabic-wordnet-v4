    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية. عبارة «بنية ذرية غير منتظمة» ليست من أسلوب المعاجم العربية، والتعريف يغفل ذكر طريقة الصنع (من الرمل والقِلي) التي هي سمة تمييزية جوهرية."
