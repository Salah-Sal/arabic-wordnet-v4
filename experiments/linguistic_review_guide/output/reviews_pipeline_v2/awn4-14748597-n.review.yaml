# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14748597-n
# inhibitor — مادة تؤخر أو توقف نشاطاً ما
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مانع، مثبط) بدون تشكيل كامل"
      - "التعريف العربي مقبول لكنه يفتقر إلى ذكر طبيعة النشاط (كيميائي، بيولوجي، فيزيائي)"
    observations: >
      المجموعة تصف مادة (substance) تُبطئ أو تُوقف نشاطاً ما، وهي مفهوم علمي
      راسخ في الكيمياء والطب والبيولوجيا. المصطلح العربي المقابل لـ inhibitor
      مستقر في المعجمية العربية الحديثة عبر عدة مترادفات: مُثَبِّط (الأكثر دقة
      واختصاصاً)، ومَانِع (الأعم)، وكابِح (أقل شيوعاً). الجذور الثلاثة (ث-ب-ط،
      م-ن-ع، ك-ب-ح) كلها تحمل دلالة الإعاقة والحبس، لكن بفروق دقيقة.
  blind_candidates:
    - lemma: "مُثَبِّط"
      generation_method: ishtiqaq
      justification: >
        من الجذر ث-ب-ط على وزن مُفَعِّل (اسم فاعل من ثبَّطَ)، بمعنى ما يُبطئ
        ويُضعف النشاط. الوزن مناسب للدلالة على الفاعلية، والجذر يحمل أصل معنى
        التأخير والإعاقة.
    - lemma: "كَابِح"
      generation_method: ishtiqaq
      justification: >
        من الجذر ك-ب-ح على وزن فاعِل، من كبحَ الفرسَ بلجامه أي جذب رأسه ليقف.
        فيه مجاز من كبح الدابة إلى كبح التفاعل الكيميائي أو البيولوجي.
    - lemma: "مَانِع"
      generation_method: ishtiqaq
      justification: >
        من الجذر م-ن-ع على وزن فاعِل، بمعنى ما يحول دون حصول الشيء. أصل المنع
        في العربية خلاف الإعطاء، وفيه معنى الحيلولة والصد.
    - lemma: "مُعَوِّق"
      generation_method: ishtiqaq
      justification: >
        من الجذر ع-و-ق على وزن مُفَعِّل، بمعنى ما يحول دون إنفاذ الأمر ويؤخره.
        مستعمل في السياق العلمي بمعنى retardant.

stage2_evidence:
  per_lemma:
    - lemma: "مَانِع"
      confirm:
        - text: "«المانع أو المثبط، وهو عبارة عن مادة قادرة على التأثير على تفاعل (بطبيعة كيميائية، أو البيولوجية أو الفيزيائية) أو أكثر، بحيث تبطئه، أو تعوقه أو تمنعه.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«مانع — inhibitor»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«مَانِع، كابِح، كابِت — inhibitor»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«(1) المانع؛ الكابح إلخ (2) الصّادّ؛ المثبِّط: عاملٌ يُبطّئ النشاط الكيميائي أو يعوقُهُ (ك).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الْمَانِع) الضنين الممسك (ج) مَنْعَة وَمَا يمْنَع من حُصُول الشَّيْء وَهُوَ خلاف الْمُقْتَضى»"
          source: "المعجم الوسيط"
          addition: "المعنى اللغوي العام: ما يمنع حصول الشيء، وهو أوسع من المعنى الاصطلاحي الكيميائي"
        - text: "«المَانِعُ: مَا يلْزم من وجوده انْتِفَاء الحكم.»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "المعنى الأصولي الفقهي للمانع"

    - lemma: "مُثَبِّط"
      confirm:
        - text: "«كل مادة تمنع أو توقف تفاعلا كيميائيا — inhibitor»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«مُثَبّط — inhibitor»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«مُثَبِّط — inhibitor»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(أ) صفة لما يعوق أو يضعف الحركة. (ب) عامل يقلل أو يثبط النشاط الحركي.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«مُثَبِّط — paralyzer (inhibitor)»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«(1) مُعَوِّق؛ مُثَبِّط (2) المعوِّق (ك). — retardant»"
          source: "المورد الحديث (2008)"
          addition: "يُستعمل مُثَبِّط أيضاً بمعنى retardant (مُعَوِّق)"

    - lemma: "كَابِح"
      confirm:
        - text: "«كابِح — inhibitory; inhibitor»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«مُثَبِّط، كابِح — inhibitor»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مَانِع، كابِح، كابِت — inhibitor»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
      expands:
        - text: "«كَابِح — من (ك ب ح) الكابح الدابة بمعنى الذي جذب رأسها إليها باللجام وهو راكب لكي تقف ولا تجري»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الأصل اللغوي: كبح الدابة بالجذب باللجام، ثم توسّع إلى كبح التفاعل"
        - text: "«كابح (لعنفات الرياح) — brake»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "كابح يُستعمل أيضاً بمعنى الكابح الميكانيكي (brake)"

    - lemma: "مُعَوِّق"
      confirm:
        - text: "«مُعَوِّق — من (ع و ق) الحائل دون إنفاذ الأمر، والمثبط الهمم.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«(1) مُعَوِّق؛ مُثَبِّط (2) المعوِّق (ك). — retardant»"
          source: "المورد الحديث (2008)"
          conflict: "مُعَوِّق يُقابل retardant لا inhibitor، وهو أعم في الدلالة ويفيد الإعاقة لا المنع أو التثبيط بالمعنى الكيميائي المخصوص"

stage3_analysis:
  per_lemma:
    - lemma: "مَانِع"
      decision: confirmed
      decision_reason: >
        لمّة مُثبتة في عدة معاجم مصطلحية موحّدة (الطاقة المتجددة، النفط، الكهرباء)
        بمعنى inhibitor. التعريف في معجم الطاقة المتجددة يطابق تعريف المجموعة تماماً.
        الجذر م-ن-ع من أفصح الجذور العربية وأكثرها شيوعاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مَانِع يدل على الحيلولة الكاملة دون حصول النشاط (blocking)، وهو أعم
        من مُثَبِّط الذي يفيد الإبطاء والتقليل. يُستعمل مَانِع حين يكون التأثير
        قاطعاً أو حين لا يُراد التخصيص في نوع التأثير.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَانِع"

    - lemma: "مُثَبِّط"
      decision: confirmed
      decision_reason: >
        أدق المصطلحات العربية لـ inhibitor وأكثرها تخصصاً. معرَّف في معجم الكيمياء
        بنص يكاد يطابق تعريف المجموعة: «كل مادة تمنع أو توقف تفاعلا كيميائيا».
        مُستعمل في الطب والصيدلة والكيمياء على نطاق واسع.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُثَبِّط يدل على إبطاء النشاط أو إضعافه تدريجياً (suppression/retardation)،
        وهو أخص من مَانِع. يُستعمل غالباً في السياق الكيميائي والبيولوجي حين يكون
        التأثير جزئياً أو تدريجياً لا قاطعاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُثَبِّط"

    - lemma: "كَابِح"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبت في ثلاثة معاجم مصطلحية موحّدة (الطب البيطري، الصيدلة، النفط) كمرادف
        مباشر لـ inhibitor. الجذر ك-ب-ح عربي أصيل من كبح الدابة باللجام، وفيه
        مجاز حيّ. لكنه أقل تداولاً من مُثَبِّط ومَانِع في هذا السياق، ويُشارك
        معنى الكابح الميكانيكي (brake) في الهندسة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        كَابِح يدل على الكبح والإمساك بقوة (restraining)، من كبح الدابة بالجذب.
        فيه إيحاء بالقوة والحسم أكثر من مُثَبِّط. يُستعمل في الطب البيطري
        والنفط، وهو أقل شيوعاً من أخويه في السياق الكيميائي العام.
      actions:
        - command: create_entry
          params:
            lemma: "كَابِح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُعَوِّق"
      source: stage1
      decision: removed
      decision_reason: >
        مُعَوِّق يُقابل retardant لا inhibitor في المصطلحية الدقيقة، وهو أعم في
        الدلالة إذ يفيد مطلق الإعاقة والتأخير لا التثبيط الكيميائي المخصوص. لا يصلح
        مرادفاً دقيقاً في هذه المجموعة التي تصف مادة مُثبِّطة لا مُعَوِّقة عموماً.

