# Review: awn4-10684741-n — struggler (مُكَافِح / مُنَاضِل)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مُكَافِح ومُنَاضِل) تتضمّنان دلالة المواجهة والدفاع أكثر من دلالة مصارعة الصعوبات المجرّدة"
      - "المجموعة تفتقر إلى لمّة تركّز على بُعد المعاناة والمشقّة لا على بُعد القتال"
    observations: "المفهوم المطلوب هو شخص يصارع الصعوبات أو يبذل جهداً كبيراً، وهو مفهوم عامّ يشمل الكفاح والنضال والمكابدة. اللمّتان الموجودتان تغطّيان بُعد المواجهة الإرادية، لكن تغيب لمّة تدلّ على معاناة المشقّة الذاتية. الجذر (كبد) يملأ هذه الفجوة بدقّة."
  blind_candidates:
    - lemma: "مُكَابِد"
      generation_method: ishtiqaq
      justification: "من كابَدَ الأمرَ: قاساه في مشقّة. اسم فاعل على وزن مُفَاعِل من الجذر (كبد) الدالّ على الشدّة والمشقّة. يغطّي بُعد المعاناة المباشرة مع الصعوبات."
    - lemma: "مُجَاهِد"
      generation_method: ishtiqaq
      justification: "من جاهَدَ: بذل الجهد. الجذر (جهد) أصله المشقّة كما في مقاييس اللغة. لكنّه محمّل بدلالة الجهاد الديني في الاستعمال المعاصر."
    - lemma: "مُصَابِر"
      generation_method: ishtiqaq
      justification: "من صابَرَ: غالب في الصبر. الجذر (صبر) أصله الحبس. يدلّ على قوّة الاحتمال لكنّ دلالته أقرب إلى الصبر السلبي منها إلى الكفاح الفعّال."
    - lemma: "مُغَالِب"
      generation_method: ishtiqaq
      justification: "من غالَبَ: حاول الغلبة. الجذر (غلب) يدلّ على القوّة والقهر. يركّز على محاولة التغلّب أكثر من مصارعة الصعوبات."

stage2_evidence:
  per_lemma:
    - lemma: "مُكَافِح"
      confirm:
        - text: "«المُكافَحة: مُصادَفُة الوجْهِ بالوجْه عن مُفاجأة... والمُكافحةُ في الحَرْب: المُضاربة تِلقاءَ الوُجُوه.»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«كَافَحوهُم، إذا استقبلوهم في الحرب بوجوههم ليس دونها ترسٌ ولا غيره. ويقال: فلان يُكافِحُ الأمور، أي يباشرها بنفسه.»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      expands:
        - text: "«كافحه: لاقاه مواجهة عن مفاجأة... ومن المجاز: تكافحت الأمواج... وكافح الأمر: باشره بنفسه. وكافحه بما ساءه.»"
          source: "أساس البلاغة للزمخشري"
          addition: "الزمخشري يصرّح بأنّ استعمال المكافحة في غير الحرب مجازٌ، ممّا يعني أنّ توسيع الدلالة إلى مصارعة الصعوبات قديم ومقبول"
        - text: "«كِفَاح: من (ك ف ح) المُضَارَبَة، والجهاد المستمر والمقاومة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "تأكيد على دلالة الكفاح بوصفه جهاداً مستمرّاً ومقاومة"

    - lemma: "مُنَاضِل"
      confirm:
        - text: "«(ناضل) عَنهُ مناضلة ونضالا حامى ودافع وَتكلم عَنهُ بِعُذْرِهِ وَفُلَانًا باراه فِي الرَّمْي»"
          source: "المعجم الوسيط"
        - text: "«نِضَال: من (ن ض ل) المدافعة عن الشيء وحمايته، والمباراة في الرمي.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«النُّونُ وَالضَّادُ وَاللَّامُ: أُصَيْلٌ يَدُلُّ عَلَى رَمْيٍ وَمُرَامَاةٍ. وَنَضَلَ فُلَانًا: رَامَاهُ بِالنِّضَالِ فَغَلَبَهُ فِي ذَلِكَ. وَهُوَ يُنَاضِلُ عَنْ فُلَانٍ: يَتَكَلَّمُ عَنْهُ بِعُذْرِهِ، كَأَنَّهُ يُرَامِي دُونَهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل النضال في الرمي والمراماة، ثمّ توسّع مجازاً إلى الدفاع والمحاماة"

    - lemma: "مُكَابِد"
      confirm:
        - text: "«(كابد) الْأَمر كبادا ومكابدة قاسى شدته»"
          source: "المعجم الوسيط"
        - text: "«الْكَافُ وَالْبَاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شِدَّةٍ فِي شَيْءٍ وَقُوَّةٍ. مِنْ ذَلِكَ الْكَبَدُ، وَهِيَ الْمَشَقَّةُ... وَكَابَدْتُ الْأَمْرَ: قَاسَيْتُهُ فِي مَشَقَّةٍ.»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "مُجَاهِد"
      confirm:
        - text: "«مُجَاهِد: من (ج ه د) مقاتل العدو والمناضل في سبيل دعوة أو رسالة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«مُجَاهِد: من (ج ه د) مقاتل العدو والمناضل في سبيل دعوة أو رسالة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الدلالة المعجمية تقصر المجاهد على مقاتل العدو أو المناضل في سبيل دعوة، وهو أخصّ من مفهوم المجموعة العامّ (مصارع الصعوبات)"
      expands:
        - text: "«الْجِيمُ وَالْهَاءُ وَالدَّالُ أَصْلُهُ الْمَشَقَّةُ، ثُمَّ يُحْمَلُ عَلَيْهِ مَا يُقَارِبُهُ. يُقَالُ جَهَدْتُ نَفْسِي وَأَجْهَدْتُ وَالْجُهْدُ الطَّاقَةُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر في المشقّة والطاقة، لكنّ اسم الفاعل (مجاهد) تخصّص في الاستعمال"

    - lemma: "مُصَابِر"
      confirm:
        - text: "«مُصَابِر: من (ص ب ر) القوي الاحتمال.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«الصَّادُ وَالْبَاءُ وَالرَّاءُ أُصُولٌ ثَلَاثَةٌ، الْأَوَّلُ الْحَبْسُ... الصَّبْرُ، وَهُوَ الْحَبْسُ. يُقَالُ: صَبَرْتُ نَفْسِي عَلَى ذَلِكَ الْأَمْرِ، أَيْ حَبَسْتُهَا.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "أصل الصبر الحبس والاحتمال السلبي، وهو يختلف عن المصارعة الفعّالة للصعوبات"

    - lemma: "مُغَالِب"
      expands:
        - text: "«الْغَيْنُ وَاللَّامُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ وَقَهْرٍ وَشِدَّةٍ... وَالْغِلَابُ: الْمُغَالَبَةُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على القهر والغلبة، فالمغالب هو من يحاول التغلّب، وهو أقرب إلى المتنافس منه إلى المصارع للصعوبات"

stage3_analysis:
  per_lemma:
    - lemma: "مُكَافِح"
      decision: confirmed
      decision_reason: "اسم فاعل من كافَحَ على وزن مُفَاعِل، والكفاح في أصله مواجهة الشيء وجهاً لوجه، ثمّ توسّع مجازاً ليشمل مباشرة الأمور والمقاومة. الاستعمال المعاصر يؤكّد هذا التوسّع. أدلّة معجمية متعدّدة تؤيّد الدلالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على المواجهة المباشرة والإرادية للصعوبات، مع دلالة على الشجاعة والإقدام (مصادفة الوجه بالوجه)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُكَافِح"

    - lemma: "مُنَاضِل"
      decision: confirmed
      decision_reason: "اسم فاعل من ناضَلَ على وزن مُفَاعِل. أصل النضال في المراماة بالسهام، ثمّ توسّع إلى المحاماة والدفاع والكفاح. المعجم الوسيط يؤكّد الاستعمال في الدفاع والحماية. الاستعمال المعاصر شائع ومستقرّ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على بُعد الدفاع والمحاماة عن قضيّة أو حقّ، مع دلالة على المباراة والمنافسة (من أصل الرمي)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنَاضِل"

    - lemma: "مُكَابِد"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من كابَدَ على وزن مُفَاعِل. المعجم الوسيط صريح: كابد الأمرَ قاسى شدّته. ومقاييس اللغة: الكاف والباء والدال أصل يدلّ على شدّة ومشقّة. يملأ فجوة دلالية في المجموعة بتغطية بُعد المعاناة والمقاساة، وهو أقرب اللمّات إلى معنى struggles with difficulties."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على مقاساة الشدائد والمعاناة من المشقّة ذاتها، دون دلالة القتال أو الدفاع عن قضيّة"
      actions:
        - command: create_entry
          params: {lemma: "مُكَابِد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُجَاهِد"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ أصل الجذر (جهد) يدلّ على المشقّة، فإنّ اسم الفاعل (مجاهد) تخصّص في الاستعمال المعاصر والتراثي للدلالة على مقاتل العدو أو المناضل في سبيل دعوة دينية. هذا التخصّص يجعله أخصّ من مفهوم المجموعة."

    - lemma: "مُصَابِر"
      source: stage1
      decision: removed
      decision_reason: "أصل الصبر الحبس والاحتمال، والمصابر هو القويّ الاحتمال. هذا يدلّ على التحمّل السلبي أكثر من المصارعة الفعّالة للصعوبات التي يقتضيها تعريف المجموعة."

    - lemma: "مُغَالِب"
      source: stage1
      decision: removed
      decision_reason: "المغالب من غالَبَ، أي حاول التغلّب والقهر. هذا يركّز على نتيجة الانتصار أكثر من عمليّة المصارعة ذاتها، وهو أقرب إلى المنتصر أو المتغلّب."

