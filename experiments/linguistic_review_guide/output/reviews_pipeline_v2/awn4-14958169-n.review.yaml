# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14958169-n — leaven / leavening
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الثانية «مادة مخمرة» عبارة وصفية حرة وليست مصطلحاً مسكوكاً، وتفشل في اختبار السكّ"
      - "غياب التشكيل الكامل عن اللمّات الموجودة"
      - "«مادة مخمرة» ملتبسة صرفياً بين اسم الفاعل (مُخَمِّرَة) واسم المفعول (مُخَمَّرَة)"
    observations: "المفهوم — مادة تُحدث التخمير في العجين أو السائل — مفهوم عربي أصيل له لفظ راسخ في التراث المعجمي (خَمِيرَة). اللمّة الأولى كافية وحدها لتغطية الدلالة. اللمّة الثانية وصف حرّ لا يرقى إلى مرتبة المصطلح المعجمي."
  blind_candidates:
    - lemma: "خَمِيرَة"
      generation_method: ishtiqaq
      justification: "من جذر خ-م-ر الدالّ على التغطية والمخالطة في ستر، على وزن فَعِيلَة الدالّ على ما يُحدث الفعل؛ وهو اللفظ العربي الأصيل للمادة المُخمِّرة"
    - lemma: "مُخَمِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من خَمَّرَ (فعّل)، أي العامل الذي يُحدث التخمير"
    - lemma: "رَوْبَة"
      generation_method: majaz
      justification: "الرَّوبة في الأصل خميرة اللبن الحامضة، يمكن توسيعها مجازاً لتشمل كل مادة مُخمِّرة"
    - lemma: "مَادَّة التَّخْمِير"
      generation_method: tarkib
      justification: "مركب إضافي من مادّة + التخمير، واضح الدلالة على المادة المستخدمة لإحداث التخمير"

stage2_evidence:
  per_lemma:
    - lemma: "خَمِيرَة"
      confirm:
        - text: "«ما يُجْعَلُ فى العَجِينِ أو الطِّيبِ ونحوهما لتَخْمِيره»"
          source: "المعجم الكبير"
        - text: "«نباتٌ وحيد الخلية غالباً من الفطريات الزقية, بيضيَّة أو مستديرة الشكل تتوالد بالتبرعم غالباً؛ تستعمل في تخمير العجين, وفي تحضير الكحول والفيتامينات»"
          source: "المعجم الوسيط"
        - text: "«العامل الذي يسبب عملية التخمير»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
        - text: "«(1) خميرة (2) يُخَمِّر: يضيف خميرةً [إلى العجين] (3) يمزج بشيء ملطِّف أو منشِّط.»"
          source: "المورد الحديث"
        - text: "«الخميرة: القطعة من خمير العجين... وردت كلمة خميرة في الوسيط بهذا المعنى، وذكر أنها مجمعية»"
          source: "معجم الصواب اللغوي"
      expands:
        - text: "«خَمِيرةُ اللَّبَنِ: رَوْبَتُه التى تُصَبُّ عليه ليَخْتَمِرَ ويَرُوبَ سريِعًا»"
          source: "المعجم الكبير"
          addition: "الخميرة تشمل أيضاً خميرة اللبن (الروبة) لا العجين فحسب"
        - text: "«الخَمِيرَةُ الهَضْمِيَّةُ (فى الطِّبِّ) digestive enzyme : خَمِيرَةٌ تُسْهِمُ فى هَضْمِ الطَّعام»"
          source: "المعجم الكبير"
          addition: "في الطب تُستعمل خميرة بمعنى إنزيم (enzyme)"

    - lemma: "مادة مخمرة"
      evidence_status: "no_material_found"

    - lemma: "مُخَمِّر"
      contradicts:
        - text: "«آلة أو وعاء التخمير، له أنواع حسب الخلايا المستخدمة في التخمير.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          conflict: "مُخَمِّر في المعاجم المصطلحية يعني وعاء/جهاز التخمير (fermenter) لا المادة المُخمِّرة"
        - text: "«الجهاز الذي تتم فيه عملية التخمير.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
          conflict: "يؤكد أن مُخَمِّر = الجهاز لا المادة"

    - lemma: "رَوْبَة"
      confirm:
        - text: "«خميرة من الحامض تُلْقَى في اللَّبن ليروب»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«خَمِيرةٌ من الحامِض, تُلقَى فى اللَّبنِ ليَرُوب»"
          source: "المعجم الكبير"
          conflict: "الروبة مقصورة على خميرة اللبن خاصة، لا تشمل خميرة العجين أو السوائل عموماً"
      expands:
        - text: "«اللَّبن الخائر / إصلاحُ الشَّأْنِ والأمر / الحاجةُ / قوامُ العَيْش / العَقْلُ»"
          source: "المعجم الوسيط"
          addition: "الروبة مشتركة لفظياً في معانٍ كثيرة مما يُضعف تخصيصها"

    - lemma: "مَادَّة التَّخْمِير"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خَمِيرَة"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل مشتق من جذر خ-م-ر على وزن فَعِيلَة، مُثبت في المعجم الوسيط والمعجم الكبير ومعاجم المصطلحات الحديثة بدلالة مطابقة لتعريف المجموعة. أقرّه مجمع اللغة العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَمِيرَة"

    - lemma: "مادة مخمرة"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل في اختبار السكّ — يمكن إبدال «مخمرة» بـ«تُحدث التخمير» دون فقد الدلالة. لم تُسجَّل في أي معجم كوحدة معجمية ثابتة. كما أنها ملتبسة صرفياً بين اسم الفاعل (مُخَمِّرة = تُحدث التخمير) واسم المفعول (مُخَمَّرة = خُمِّرَت). وجود «خَمِيرَة» يُغني عنها تماماً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "خَمِيرَة"
      source: stage1
      decision: removed
      decision_reason: "مطابقة للمّة الموجودة المؤكدة، لا حاجة لإضافتها مرة أخرى."

    - lemma: "مُخَمِّر"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تُثبت أن مُخَمِّر يعني وعاء/جهاز التخمير (fermenter) لا المادة المُخمِّرة (leaven). استقرّ في معاجم الصيدلة وتقانات الأغذية بهذا المعنى، فاستعماله هنا يُوقع في الاشتراك اللفظي المُلبِس."
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَوْبَة"
      source: stage1
      decision: removed
      decision_reason: "الروبة في المعاجم مقصورة على خميرة اللبن الحامضة خاصة، لا تشمل خميرة العجين أو السوائل عموماً. فضلاً عن اشتراكها اللفظي في معانٍ كثيرة (العقل، الحاجة، قوام العيش، قطعة اللحم) مما يُضعف وضوحها الدلالي."
      evidence_assessment:
        case: mixed

    - lemma: "مَادَّة التَّخْمِير"
      source: stage1
      decision: removed
      decision_reason: "مركب إضافي وصفي حرّ لم يُسجَّل كوحدة معجمية في أي معجم. يفشل في اختبار التثبيت المعجمي. وجود «خَمِيرَة» يُغني عنه."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "مادة تستخدم لإحداث التخمير في العجين أو السائل"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي. يمكن تحسينه بأسلوب المعجم الوسيط مع الاستفادة من التعريفات المعجمية العربية الأصيلة."
    authored:
      - type: terminological
        text: "مَادَّةٌ تُضَافُ إِلَى العَجِينِ أَوِ السَّائِلِ فَتُحْدِثُ فِيهِ تَخَمُّرًا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مَادَّةٌ — كَالخَمِيرَةِ الحَيَّةِ أَوْ مَسْحُوقِ الخَبْزِ — تُجْعَلُ فِي العَجِينِ أَوِ السَّائِلِ لِتُخَمِّرَهُ، فَتُنْتِجَ غَازَاتٍ تَنْفُخُ العَجِينَ وَتُكْسِبُهُ قَوَامًا إِسْفَنْجِيًّا"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَادَّةٌ تُضَافُ إِلَى العَجِينِ أَوِ السَّائِلِ فَتُحْدِثُ فِيهِ تَخَمُّرًا"

  examples:
    per_lemma:
      - lemma: "خَمِيرَة"
        examples:
          - text: "أضافَ الخَبَّازُ الخَمِيرَةَ إلى العَجِينِ وتَرَكَهُ ساعَةً حتَّى اخْتَمَرَ وانْتَفَخَ."
            type: usage
          - text: "خُبْزَةٌ خَمِيرَةٌ: جُعِلَ فيها الخَمِيرُ"
            type: usage
            source: "المعجم الكبير — عن اللِّحيانيّ"
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أضافَ الخَبَّازُ الخَمِيرَةَ إلى العَجِينِ وتَرَكَهُ ساعَةً حتَّى اخْتَمَرَ وانْتَفَخَ."

