# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13595655-n — wastage
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «عملية الإهدار» مقتضب جداً ويقترب من الدوران (إهدار ← هدر)"
      - "اللمّتان الموجودتان بلا تشكيل"
      - "ضياع بمعنى الفَقْد والذهاب أعمّ من wastage؛ قد يحتاج تضييق"
    observations: "المجموعة تمثّل مفهوم «الفَقْد التدريجي بلا فائدة» (wastage) وهو نوع من التناقص. اللمّتان ضياع وهدر شائعتان في الاستعمال المعاصر لكنّهما تحتاجان إلى تشكيل كامل وتمييز دلالي واضح."
  blind_candidates:
    - lemma: "تَضْيِيع"
      generation_method: ishtiqaq
      justification: "مصدر ضَيَّعَ على وزن تَفْعِيل، يدلّ على فعل الإضاعة والتفريط في الشيء حتى يذهب سُدًى"
    - lemma: "تَبْدِيد"
      generation_method: ishtiqaq
      justification: "مصدر بَدَّدَ على وزن تَفْعِيل، يدلّ على تفريق الشيء وتشتيته بلا طائل، يُستعمل في الاقتصاد والفيزياء"
    - lemma: "إِتْلَاف"
      generation_method: ishtiqaq
      justification: "مصدر أَتْلَفَ على وزن إِفْعَال، من التَّلَف وهو ذهاب الشيء وفناؤه"
    - lemma: "نَزْف"
      generation_method: majaz
      justification: "أصله نزح الماء من البئر شيئاً بعد شيء، فيُستعار لكلّ فَقْد تدريجي"

stage2_evidence:
  per_lemma:
    - lemma: "ضَيَاع"
      confirm:
        - text: "«(ضَيَعَ) الضَّادُ وَالْيَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَوْتِ الشَّيْءِ وَذَهَابِهِ وَهَلَاكِهِ. يُقَالُ: ضَاعَ الشَّيْءُ يَضِيعُ ضَيَاعًا وَضَيْعَةً، وَأَضَعْتُهُ أَنَا إِضَاعَةً.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(فى الاقتصاد): إساءةُ استعمال الموارد الاقتصادية, حين تُستخدم لإشباع حاجاتٍ أقلَّ في كميتها أو أهميتها ممَّا كان يمكن إشباعه بها»"
          source: "المعجم الكبير"
        - text: "«فقد، خسارة، ضياع» = loss"
          source: "المعجم الموحد لمصطلحات الكيمياء"
      expands:
        - text: "«الوارد في المعاجم ‹ضَياع› بفتح الضاد مصدرًا للفعل ‹ضَاعَ›، أمّا ‹ضِياع› بكسر الضاد فهي جمع لكلمة ‹ضَيْعَة›.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "التشكيل الصحيح للمصدر هو ضَيَاع بفتح الضاد لا كسرها"
        - text: "«الضَّيَاعُ: العيالُ والأطفالُ والفقراءُ»"
          source: "المعجم الكبير"
          addition: "معنى آخر لضَياع: العيال الذين يُخشى ضياعهم"

    - lemma: "هَدْر"
      confirm:
        - text: "«(هَدَرَ) الْهَاءُ وَالدَّالُ وَالرَّاءُ [يَدُلُّ] عَلَى سُقُوطِ شَيْءٍ وَإِسْقَاطِهِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الهَدَرُ، محرَّكةً: ما يَبْطُلُ من دَمٍ وغيرِهِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«هدر» = wastage"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«تَسَرُّبٌ تَعَلُّمِي، هَدْر مَدْرَسِي» = educational wastage"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية"
      expands:
        - text: "«السَّاقِطُ الباطلُ. ذهب دمُه هَدْرًا: ليس فيه قَوَدٌ ولا عَقْلٌ. ذَهَبَ سَعْيُهُ هَدْرًا: باطلاً»"
          source: "المعجم الوسيط"
          addition: "هَدْر بالسكون مصدر ويُستعمل بمعنى الباطل الذاهب سُدًى، وهَدَر بالتحريك اسم لما بَطَل"

    - lemma: "تَضْيِيع"
      confirm:
        - text: "«إضاعة، تبذير» = wasting"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
        - text: "«(2) ‹أ› تبديد؛ إضاعة. ‹ب› تبدّد؛ ضياع» — ترجمة waste"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(ضَيَعَ) ... يَدُلُّ عَلَى فَوْتِ الشَّيْءِ وَذَهَابِهِ وَهَلَاكِهِ ... وَأَضَعْتُهُ أَنَا إِضَاعَةً»"
          source: "مقاييس اللغة لابن فارس"
          addition: "تَضْيِيع مصدر ضَيَّعَ وهو بمعنى الإضاعة، من الباب نفسه"

    - lemma: "تَبْدِيد"
      confirm:
        - text: "«تبديد، تبذير، إسراف» = waste"
          source: "المعجم الموحد لمصطلحات الاقتصاد"
      contradicts:
        - text: "«(التبديد) فى القانون: يُطلق على التَّصَرُّف فى الأشياء المحجوزة قبل بيعها على يد المُحْضِر, تهرباً من وفاء الحقوق المحجوزة من أجلها»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي الأساسي قانوني متخصص (التصرف في المحجوزات)، لا يُطابق wastage العام"
        - text: "«تبديد» = dissipation (في القانون والجيولوجيا)"
          source: "المعجم الموحد لمصطلحات القانون / الجيولوجيا"
          conflict: "الترجمة الغالبة dissipation وليس wastage"

    - lemma: "إِتْلَاف"
      confirm:
        - text: "«(تَلَفَ) التَّاءُ وَاللَّامُ وَالْفَاءُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ ذَهَابُ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«إِتْلاف: عملية حذف المعطيات من قرص أو غيره بحيث لا يمكن بعد ذلك استرجاع تلك المعطيات» = scratch"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          conflict: "الإتلاف يدلّ على الإفناء والتدمير القصدي لا على الفَقْد التدريجي (wastage)"

    - lemma: "نَزْف"
      contradicts:
        - text: "«(نَزَفَ) النُّونُ وَالزَّاءُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى نَفَادِ شَيْءٍ وَانْقِطَاعٍ. وَنُزِفَ دَمُهُ: خَرَجَ كُلُّهُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "النزف مختصّ بالسوائل (دم، ماء بئر) ولا يُعمَّم على مطلق الفَقْد"
        - text: "«نَزْف» = bleeding / hemorrhage (في جميع المعاجم الطبية والهندسية)"
          source: "المعجم الطبي الموحد / الهندسة المدنية"
          conflict: "الاستعمال المعاصر ثبّت النزف على معنى النزيف الدموي أو رشح السوائل"

stage3_analysis:
  per_lemma:
    - lemma: "ضَيَاع"
      decision: confirmed
      decision_reason: "جذر ض-ي-ع يدلّ على فوت الشيء وذهابه، وهو أصل صحيح في العربية. معجم الصواب أكّد أنّ التشكيل الصحيح هو ضَيَاع بالفتح. المعجم الكبير أثبت له معنى اقتصادياً مطابقاً. يحتاج تصحيح التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "ضَيَاع يدلّ على ذهاب الشيء وفواته ذاتياً من غير تركيز على فاعل، ويغلب فيه معنى الخسارة غير المقصودة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ضَيَاع"

    - lemma: "هَدْر"
      decision: confirmed
      decision_reason: "جذر هـ-د-ر يدلّ على سقوط الشيء وبطلانه. المكنز الزراعي يُقابله بـ wastage مباشرة، والمعجم التربوي يستعمل «هَدْر مدرسي» بمعنى educational wastage. مثبت في الاستعمال المعاصر. يحتاج تشكيلاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "هَدْر يتضمّن حُكماً قيمياً بأنّ المفقود ذهب سُدًى وباطلاً، ويغلب فيه سياق الموارد والجهد الذاهب بلا عائد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَدْر"

    - lemma: "تَضْيِيع"
      source: stage1
      decision: removed
      decision_reason: "تَضْيِيع مصدر الفعل المتعدي ضَيَّعَ ويقتضي فاعلاً يُضيّع، بينما المجموعة تصف عملية تناقص (wastage) لا فعل إضاعة مُتعمَّداً. كذلك ضَيَاع الموجود أصلاً يُغني عنه من الجذر نفسه."

    - lemma: "تَبْدِيد"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعجمي الأساسي في الوسيط قانوني (التصرف في المحجوزات)، والترجمة الغالبة dissipation لا wastage. كذلك يستدعي فاعلاً يُبدّد، ولا يدلّ على العملية ذاتها."

    - lemma: "إِتْلَاف"
      source: stage1
      decision: removed
      decision_reason: "الإتلاف يدلّ على الإفناء والتدمير الكلّي القصدي، لا على الفَقْد التدريجي. المسافة الدلالية بينه وبين wastage كبيرة."

    - lemma: "نَزْف"
      source: stage1
      decision: removed
      decision_reason: "النزف مختصّ بالسوائل (دم، ماء) وثُبّت في الاستعمال الطبي على معنى hemorrhage، فلا يصلح مصطلحاً عامّاً لـ wastage."

