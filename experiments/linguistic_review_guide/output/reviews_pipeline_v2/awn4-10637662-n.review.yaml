# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10637662-n (sobersides)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «شَخْص رَزِين» عبارة وصفية حرة وليست وحدة معجمية ثابتة — تفشل في اختبار السكّ (يمكن إبدال شخص بـ«إنسان» أو «رجل» دون تغيّر الدلالة)"
      - "اللمّة «جَادّ» صفة مشبّهة تُستعمل استعمال الاسم، لكنها تدلّ أساساً على الاجتهاد والبُعد عن الهزل دون دلالة صريحة على الرزانة والوقار المطلوبَين في المجموعة"
      - "المتن العلوي (hypernym) «عَامِل / فَاعِل: شخص يعمل ويُنجز الأمور» لا يبدو مناسباً دلالياً لمفهوم الشخص الجاد الرزين"
    observations: "المجموعة تمثّل مفهوم الشخص الذي يتّسم بالرزانة والوقار والجدّية في طبعه — وهو مفهوم له ألفاظ عربية غنية (وَقُور، رَزِين، رَصِين) تُستعمل اسمياً. الترجمة الإنجليزية sobersides كلمة واحدة مركّبة، لكن المقابل العربي يُعبَّر عنه بصفات تُستعمل استعمال الأسماء أو بتركيب وصفي."
  blind_candidates:
    - lemma: "وَقُور"
      generation_method: ishtiqaq
      justification: "اسم على وزن فَعُول من الجذر (وقر) الدالّ على الثقل والرزانة، يُستعمل للمذكر والمؤنث ويدلّ على ذي الوقار والحِلم"
    - lemma: "حَصِيف"
      generation_method: ishtiqaq
      justification: "صفة مشبّهة من الجذر (حصف) الدالّ على التشدّد والصلابة والإحكام، تدلّ على مُحكَم العقل متين الرأي"
    - lemma: "مُتَزَمِّت"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تزمَّتَ (زمت) بمعنى توقَّر وترزَّن، ورد في صفة النبي ﷺ «كان من أزمتهم» أي أرزنهم وأوقرهم"
    - lemma: "رَكِين"
      generation_method: ishtiqaq
      justification: "صفة مشبّهة من الجذر (ركن) الدالّ على القوة والثبات، قال ابن فارس: فلان ركين أي وقور ثابت"

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جَادّ"
      confirm:
        - text: "«جَادّ: من (ج د د) المجتهد المثابر والمبتعد عن الهزل»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(جاد) جودة صار جيداً ... والرجل أتى بالجيد من قول أو عمل ... وفلان جوداً سخا وبذل»"
          source: "المعجم الوسيط (حَوْرَمَني)"
          addition: "الجذر (جود) يدلّ على الجودة والسخاء، بينما الجذر (جدد) يدلّ على الجِدّ والعظمة — جَادّ بتشديد الدال من الثاني"
        - text: "«(1) وقور؛ رصين؛ رزين (2) جادّ: عاملٌ بجِدّ a serious worker»"
          source: "المورد الحديث (2008)"
          addition: "في ترجمة serious يُفرَّق بين الوقار/الرزانة (المعنى ١) والجدّية في العمل (المعنى ٢) — جادّ يرتبط بالعمل الجادّ أكثر من الطبع الرزين"

    - lemma: "شَخْص رَزِين"
      confirm:
        - text: "«شخص رصين أو رزين»"
          source: "المورد الحديث (2008) — مقابل sobersides"
      contradicts:
        - text: "«(الرزين) الثقيل من كل شيء والثابت الساكن ويقال هو رزين: حليم وقور ورزين الرأي: أصيله وهي رزينة»"
          source: "المعجم الوسيط"
          conflict: "رَزِين صفة مستقلة تُستعمل اسمياً وحدها، لا حاجة لإضافة «شخص» قبلها — التركيب وصفي حرّ"

    # ── المرشحات ──
    - lemma: "وَقُور"
      confirm:
        - text: "«(الوقور) ذو الوقار, وذات الوقار»"
          source: "المعجم الوسيط"
        - text: "«وَقُور: من (و ق ر) الرزين الحليم العظيم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(الوقور) ذو الوقار وذات الوقار (للمذكر والمؤنث)»"
          source: "المعجم الوسيط (حَوْرَمَني)"
      expands:
        - text: "«الوَقَار: الحِلْم والرزانة. ورجل ذو قِرَة أي وَقُور»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الدلالي ثِقَل في الشيء، ومنه وقار الشخصية"

    - lemma: "حَصِيف"
      confirm:
        - text: "«(الحصيف) ذو الحصافة, وهو المُحْكَمُ العقل المتينُ الرأي»"
          source: "المعجم الكبير"
        - text: "«حَصِيف: من (ح ص ف) الرجل المحكم العقل والجيد الرأي»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«ثوب حصيف: مُحكَم النسج كثيف ساتر»"
          source: "المعجم الكبير"
          conflict: "الدلالة الأصلية ماديّة (إحكام النسج والتشدّد) وامتدّت مجازاً للعقل — التركيز على إحكام العقل لا على الرزانة والوقار"

    - lemma: "مُتَزَمِّت"
      confirm:
        - text: "«(المتزمت) الوقور والمتشدد في دينه أو رأيه (مج)»"
          source: "المعجم الوسيط (حَوْرَمَني)"
        - text: "«المتزمِّتُ: الوقور المتشدد في دينه أو رأيه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«المذكور في المعاجم القديمة أنّ التزمُّت هو الرزانة والوقار ... ثم شاع في العصر الحديث استعمال المتزمت بمعنى المتشدد في الدين أو الرأي»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "الدلالة المعاصرة انزاحت نحو التشدّد والتعصّب، والمعنى الأصلي (الوقار) لم يعد هو المتبادر"

    - lemma: "رَكِين"
      confirm:
        - text: "«رَكِين: من (ر ك ن) الرزين والوقور»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«(الركين) الجبل العالي الشديد الأركان. رُكْنٌ ركينٌ: قويٌّ يُعتَمَد عليه»"
          source: "المعجم الكبير"
          conflict: "الاستعمال المعجمي الأوّل مادّي (جبل/ركن)، والاستعمال في صفة الأشخاص محدود وأدبي"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جَادّ"
      decision: confirmed
      decision_reason: "صفة مشبّهة من (جَدَّ يَجِدُّ) بمعنى المبتعد عن الهزل والمجتهد، تُستعمل استعمال الاسم. وردت في موسوعة السلطان قابوس والمورد الحديث بهذه الدلالة. وهي على وزن فاعِل من المضعَّف وتحمل دلالة الجدّية أكثر من الوقار."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الاجتهاد في العمل والابتعاد عن الهزل، بينما وَقُور يُركّز على هيبة الطبع والرزانة الفطرية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَادّ"

    - lemma: "شَخْص رَزِين"
      decision: removed
      decision_reason: "تركيب وصفي حرّ يفشل في اختبار السكّ — يمكن إبدال «شخص» بـ«إنسان» أو «رجل» أو «امرؤ» دون تغيّر الدلالة. ليس وحدة معجمية ثابتة. الصفة «رَزِين» وحدها تكفي وتُستعمل اسمياً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── المرشحات ──
    - lemma: "وَقُور"
      source: stage1
      decision: confirmed
      decision_reason: "صفة مشبّهة على وزن فَعُول من (وَقَرَ) مثبتة في المعجم الوسيط والمعجم الكبير بمعنى «ذو الوقار»، تُستعمل للمذكر والمؤنث. أصلها الدلالي في مقاييس اللغة الثِّقَل والحِلم. مطابقة تماماً لمفهوم المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الهيبة والرزانة الطبيعية والحِلم، بخلاف جَادّ الذي يركّز على الاجتهاد ونبذ الهزل"
      actions:
        - command: create_entry
          params: {lemma: "وَقُور", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حَصِيف"
      source: stage1
      decision: removed
      decision_reason: "دلالتها تتمحور حول إحكام العقل ومتانة الرأي (الذكاء العملي)، لا حول الرزانة والوقار في الطبع. الفرق الدلالي كبير: الحصيف قد يكون خفيف الروح غير وقور."

    - lemma: "مُتَزَمِّت"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ المعنى الأصلي هو الوقور (كما في صفة النبي ﷺ)، فإنّ الدلالة المعاصرة انزاحت نحو التشدّد والتعصّب كما وثّق معجم الصواب اللغوي. استعمالها بمعنى المجموعة سيُفهَم خطأ."

    - lemma: "رَكِين"
      source: stage1
      decision: removed
      decision_reason: "الاستعمال المعجمي السائد في وصف الجبال والأركان المادية. الاستعمال في صفة الأشخاص أدبي محدود ومقصور على النصوص التراثية، ولا يتداول في العربية المعاصرة بهذا المعنى."

