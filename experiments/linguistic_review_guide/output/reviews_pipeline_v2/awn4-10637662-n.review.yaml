      decision: revise
      reason: "التعريف الحالي مجرّد سرد صفتين دون جنس قريب واضح ولا فصل نوعي دقيق. يحتاج إلى صياغة معجمية أدق تبيّن طبيعة هذا الشخص."
    authored:
      - type: terminological
        text: "مَنْ يَتَّسِمُ بالوَقارِ والرَّزانَةِ في طَبْعِهِ ويَنْأَى عَنِ الهَزْلِ والطَّيْش"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "الرَّزِينُ الوَقُورُ الذي يَغْلِبُ عَلَيْهِ الجِدُّ وَثِقَلُ الطَّبْعِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
