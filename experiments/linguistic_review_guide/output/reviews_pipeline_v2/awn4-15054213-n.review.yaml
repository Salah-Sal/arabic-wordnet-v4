# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15054213-n (lysin / حَالٌّ)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «ليسين» غير مشكّلة وقد تلتبس بالحمض الأميني ليسين (lysine) الذي يختلف عن الحالّة (lysin)"
      - "اللمّة «حالّ» بصيغة المذكر، بينما المعاجم الطبية الموحّدة تستخدم «حالّة» بالتأنيث للدلالة على المادة"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي ويحتاج إلى صياغة معجمية أصيلة"
    observations: >
      المجموعة تدل على مفهوم في الكيمياء الحيوية والمناعة: مادة أو عامل يسبّب تحلّل الخلايا (lysis).
      الجذر العربي «حلل» هو الأساس المورفولوجي الأنسب، إذ يدل على فتح الشيء وتفكيكه.
      المصطلح العربي الموحّد المعتمد في المعاجم الطبية هو «حالّة» (بتاء التأنيث)
      مع استخدام «حالّ» في التركيبات الإضافية مثل «حالّ الدم» (hemolysin).
  blind_candidates:
    - lemma: "حَالَّة"
      generation_method: ishtiqaq
      justification: "اسم فاعل مؤنّث من حَلَّ يَحُلّ على وزن فَاعِلَة، للدلالة على المادة التي تسبّب الحلّ (التحلّل الخلوي). التأنيث يناسب الدلالة على المادة"
    - lemma: "مُحَلِّلَة"
      generation_method: ishtiqaq
      justification: "اسم فاعل من حَلَّلَ (فعَّل) للتكثير، على وزن مُفَعِّلَة، بمعنى ما يُحدث التحليل/التحلّل بقوّة"
    - lemma: "عَامِلُ التَّحَلُّل"
      generation_method: tarkib
      justification: "مركب إضافي: عامل + التحلّل، يصف المادة التي تسبّب عملية التحلّل الخلوي"
    - lemma: "لَيْزِين"
      generation_method: taarib
      justification: "تعريب المصطلح الإنجليزي lysin بإبدال السين زاياً (كما في ليزر/laser)، وهو الشكل المعتمد في بعض المعاجم الطبية"


stage2_evidence:
  per_lemma:
    - lemma: "حَالٌّ"
      confirm:
        - text: "«حالُّ الدم — مادة تحرر الهيموجلوبين من الكرات الحمر عن طريق حطمها.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997) — ARABTERM"
      expands:
        - text: "«حَلَّ — الحاء واللام لها فروع كثيرة ومسائل، وأصلها كلها عندي فتح الشيء، لا يشذّ عنه شيء.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي لحالّ هو فتح الشيء وتفكيكه، وهو مناسب دلالياً لمعنى التحلّل الخلوي"

    - lemma: "لَيْسِين"
      evidence_status: "no_material_found"

    - lemma: "حَالَّة"
      confirm:
        - text: "«حالَّة [ج:حالاَّت]»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "«حَالَّة — ضد يسبب حل الخلايا مثل الحالات الدموية والحالات الجرثومية.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — ARABTERM"
        - text: "«الحالَّة: مادة تُحدث الانحلال في الخلايا.»"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: "«حَالّة»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015) — ARABTERM"
      expands:
        - text: "«حالَّةٌ دَمَوِيَّة» = hemolysin؛ «حالَّةٌ مَناعِيَّة» = immune lysin؛ «حالَّةُ النُّطْفَة» = sperm lysin"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          addition: "حالّة تدخل في مركبات اصطلاحية متعددة في المجال الطبي ممّا يدل على رسوخها المعجمي"

    - lemma: "مُحَلِّلَة"
      evidence_status: "no_material_found"

    - lemma: "عَامِلُ التَّحَلُّل"
      evidence_status: "no_material_found"

    - lemma: "لَيْزِين"
      confirm:
        - text: "«ليزين»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992) — ARABTERM"


stage3_analysis:
  per_lemma:
    - lemma: "حَالٌّ"
      decision: confirmed
      decision_reason: >
        اسم فاعل من حَلَّ يَحُلّ بمعنى فكّ وأذاب. يُستخدم في التراكيب الإضافية الطبية
        مثل «حالّ الدم» (hemolysin). الصيغة المذكرة مقبولة كمصطلح عامّ للعامل المُحلِّل.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستخدم بصيغة المذكر للدلالة على العامل المُحلِّل عموماً، ويدخل في المركبات الإضافية (حالّ الدم، حالّ الخلايا)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالٌّ"

    - lemma: "لَيْسِين"
      decision: removed
      decision_reason: >
        لم يُعثر على «ليسين» (بالسين) في أيّ معجم طبي أو عام. الشكل المعتمد في المعاجم هو «ليزين» (بالزاي).
        فضلاً عن ذلك، «ليسين» يلتبس بالحمض الأميني lysine. المصطلح العربي الأصيل «حالّة» أولى وأوضح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حَالَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح معتمد في أربعة معاجم طبية موحّدة على الأقل: المعجم الطبي الموحد، معجم الصيدلة،
        معجم التشريح، والمورد الحديث. تعريفه في معجم الصيدلة: «ضد يسبب حل الخلايا»
        يطابق دلالة المجموعة تماماً. يدخل في مركبات اصطلاحية ثابتة كثيرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة المؤنثة المعتمدة في المعاجم الطبية للدلالة على المادة المُحلِّلة بذاتها، وتُجمع على حالّات"
      actions:
        - command: create_entry
          params: {lemma: "حَالَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُحَلِّلَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على شواهد معجمية لاستخدام «محلّلة» بمعنى lysin. الوزن مُفَعِّلَة يدل على الآلة أو الفاعل المكثّر، وهو مستخدم في سياقات أخرى (تحليل كيميائي) لا في التحلّل الخلوي"

    - lemma: "عَامِلُ التَّحَلُّل"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً مسكوكاً. يمكن استبدال «عامل» بـ«سبب» أو «مادة» مع بقاء العبارة صالحة، مما يُفشل اختبار السكّ"

    - lemma: "لَيْزِين"
      source: stage1
      decision: removed
      decision_reason: >
        وُجد في معجم واحد فقط (معجم الصحة 1992)، لكن المعاجم الطبية الأحدث والأكثر تخصصاً
        (المعجم الطبي الموحد 2009، معجم الصيدلة 2009) تعتمد «حالّة» بدلاً منه.
        كما يلتبس بالحمض الأميني lysine. وجود البديل العربي الأصيل «حالّة» يجعل التعريب غير ضروري.


