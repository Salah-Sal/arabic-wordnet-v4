# مراجعة المجموعة الترادفية — awn4-10700830-n
# suspect — شخص تحوم حوله الشكوك
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (مُشْتَبَه بِه) وهي تعبير مركب، والمفهوم يستحق إثراءً بمفردات عربية أصيلة"
      - "التعريف العربي «شخص تحوم حوله الشكوك» مقبول لكنه عامّ، يمكن تدقيقه بإضافة السياق القانوني/الجنائي"
      - "اللمّة الموجودة تستخدم حرف الجر «بِه» بينما المصادر تتراوح بين «بِه» و«فيه»"
    observations: "المفهوم يدور حول شخص لم تثبت إدانته بعدُ لكنّه موضع ريبة وشكّ. العربية غنية بمشتقات تعبّر عن هذا المعنى من جذور شبه وظنن وريب ووهم. الفارق الدقيق بين «المشتبه به» و«المتهم» جوهري: الأول لم تُوجَّه إليه تهمة رسمية بعدُ."
  blind_candidates:
    - lemma: "مَشْبُوه"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الشُّبْهَة على وزن مَفْعُول، يدلّ على من حامت حوله الشكوك. أجازه مجمع اللغة المصري وشاع في الاستعمال المعاصر."
    - lemma: "ظَنِين"
      generation_method: ishtiqaq
      justification: "صيغة فَعِيل بمعنى مَفْعول من الظَّنّ، أي المُتَّهَم ومن لا يُوثَق به. لفظ فصيح وارد في الحديث النبوي والشعر العربي القديم."
    - lemma: "مُتَّهَم"
      generation_method: ishtiqaq
      justification: "اسم مفعول من اتَّهَمَ على وزن مُفْتَعَل من جذر وهم، يدلّ على من وُجِّهت إليه تهمة أو شبهة."
    - lemma: "مُرْتَاب فِيهِ"
      generation_method: tarkib
      justification: "تركيب وصفي من اسم الفاعل المبني للمجهول معنوياً من الارتياب مع شبه جملة. يدلّ على من يُرتاب في أمره."

stage2_evidence:
  per_lemma:
    - lemma: "مُشْتَبَه بِهِ"
      confirm:
        - text: "«مُشْتَبَهٌ بهِ» — suspect"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«من كان موضعَ التباسٍ وإشكالٍ وَمَجالا للظَّنِّ»"
          source: "المعجم الكبير"
      expands:
        - text: "«مَشْبُوه — الصواب والرتبة: قبض على المشتبه فيه [فصيحة] — قبض على المشبوه [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "معجم الصواب يُصنّف «المشتبه فيه» فصيحةً و«المشبوه» صحيحةً، مما يدعم ورود الصيغة المركبة"
        - text: "«(5) مَشْبوه (6) مشتَبَهٌ به (7) مشكوك فيه (8) المَشْبوه؛ المشتبَهُ به»"
          source: "المورد الحديث (2008)"
          addition: "يورد المورد «مشتبه به» و«مشبوه» و«مشكوك فيه» كمترادفات لـ suspect"

    - lemma: "مَشْبُوه"
      confirm:
        - text: "«ما يُرْتَابُ فى أَمْرِه. يقال: أُلْقِيَ القَبْضُ على جَماعَةٍ مِنَ المشبوهينَ»"
          source: "المعجم الكبير"
        - text: "«مَنْ حامَتْ حولَه ظنونُ السُّوءِ فى اقترافِ الجرائم وفى الانحرافِ عن السُّلُوكِ الْمُسْتَقِيم»"
          source: "المعجم الكبير"
      expands:
        - text: "«أجاز مجمع اللغة المصري كلمة المشبوه صيغةً ومعنًى، أخذًا من الشُّبْهة الواردة في المعاجم بمعنى الالتباس، وهي اسم مصدر من الاشتباه باعتبار ذلك من قبيل استكمال المادة اللغوية، وقد سجَّلت هذا الاستعمال بعض المعاجم الحديثة كالأساسي والمنجد»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "صيغة مقرّة من مجمع اللغة المصري رغم أنّ الفعل الثلاثي «شَبَهَ» لم يرد في المعاجم القديمة"

    - lemma: "ظَنِين"
      confirm:
        - text: "«كلُّ ما لا يوثق به — المُتَّهَم — القليلُ الخير»"
          source: "المعجم الوسيط"
        - text: "«المتهم»"
          source: "المعجم الكبير"
      expands:
        - text: "«لا تَجوزُ شَهادَةُ خائِن ولا خائِنَةٍ ..., ولا ظَنِين في وَلاءِ ولا قَرابَةٍ»"
          source: "المعجم الكبير (شاهد حديثي)"
          addition: "شاهد حديثي يُظهر استعمال «ظنين» بمعنى المتّهم الذي لا يُوثَق بشهادته"
        - text: "«فلا ويمينُ الله لا عن جِنايَةٍ / هَجَرْتُ ولكنَّ الظَّنِينَ ظَنينُ» — عبدُ الرحمن بنُ حسّان"
          source: "المعجم الكبير (شاهد شعري)"
          addition: "شاهد شعري يؤكد استعمال الكلمة في معنى من تحوم حوله الشكوك"

    - lemma: "مُتَّهَم"
      contradicts:
        - text: "«المُتَّهَم» يرد تعريفاً لـ«الظَّنِين» في المعجم الوسيط والمعجم الكبير"
          source: "المعجم الوسيط / المعجم الكبير"
          conflict: "المُتَّهَم يدلّ على من وُجِّهت إليه تهمة رسمية، بينما المجموعة تخصّ من تحوم حوله الشكوك دون توجيه تهمة بعدُ. الفرق بين الشبهة والتهمة جوهري في السياق القانوني."

    - lemma: "مُرْتَاب فِيهِ"
      evidence_status: "no_material_found"

