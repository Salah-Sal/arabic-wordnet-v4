# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13539766-n
# narrowing — انخفاض في العرض
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تضييق» بدون تشكيل — تحتاج تشكيلاً كاملاً"
      - "تضييق مصدر الفعل المتعدي ضَيَّقَ (جَعَلَهُ ضَيِّقاً)، بينما التعريف يصف عملية لازمة (انخفاض في العرض) — قد يكون تَضَيُّق أدق"
      - "المجموعة تحوي لمّة واحدة فقط — تحتاج إثراء بمرادفات"
    observations: "المفهوم المطلوب هو عملية نقصان العرض، وهو مفهوم فيزيائي عام يشمل التضييق المتعمد والتضيق التلقائي. الجذر ض ي ق هو الأنسب لهذا المعنى، لكن ينبغي التمييز بين الصيغة المتعدية (تَفْعِيل: تَضْيِيق) والصيغة اللازمة (تَفَعُّل: تَضَيُّق). المعجم الأقدم يدلّ على أنّ الضِّيق خلاف السَّعة عموماً."
  blind_candidates:
    - lemma: "تَضْيِيق"
      generation_method: ishtiqaq
      justification: "مصدر ضَيَّقَ (فَعَّلَ) من الجذر ض ي ق، يدلّ على جَعْل الشيء ضيقاً أو إنقاص عرضه عمداً، على وزن تَفْعِيل الذي يفيد التعدية والمبالغة"
    - lemma: "تَضَيُّق"
      generation_method: ishtiqaq
      justification: "مصدر تَضَيَّقَ (تَفَعَّلَ) من الجذر ض ي ق، يدلّ على صيرورة الشيء ضيقاً تلقائياً، وهو أقرب للدلالة اللازمة في التعريف (انخفاض في العرض)"
    - lemma: "ضِيقَة"
      generation_method: ishtiqaq
      justification: "على وزن فِعْلَة من ضاق، اسم المرّة الدالّ على حدث واحد من الضيق، ورد في المعجم الطبي بمعنى narrowing"
    - lemma: "تَخَصُّر"
      generation_method: ishtiqaq
      justification: "مصدر تَخَصَّرَ من الجذر خ ص ر (الخَصْر)، يدلّ على صيرورة الشيء كالخَصْر أي ضيقاً في وسطه، استُعمل في علم الأحياء بمعنى constriction"


stage2_evidence:
  per_lemma:
    - lemma: "تَضْيِيق"
      confirm:
        - text: "«تَضْييق: من (ض ي ق) عدم التوسعة على الشيء وانضمام بعضه على بعض، والتألم والضجر والمشقة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«تضييق = pinching»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«تضييق، تضيُّق = constriction»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«تضييق، اختناق = constriction»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      expands:
        - text: "«التّضييق: عند أهل المعاني هو إيجاز التقدير»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة اصطلاحية بلاغية مختلفة عن المعنى الفيزيائي"
        - text: "«سياسة تضييق الائتمان: سياسة تؤدي إلى الحد من الاقتراض»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "استعمال مجازي في المجال الاقتصادي"

    - lemma: "تَضَيُّق"
      confirm:
        - text: "«تَضَيُّق = arctation»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَضَيُّق = coarctation»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَضَيُّق = stenosis»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَضَيُّق = stricture»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تضيّق: نقص قطر عضو أجوف، مثل المعي أو الحالب وغير ذلك»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«تَضَيَّقَ الشيءُ: ضاق»"
          source: "المعجم الكبير"
        - text: "«تضيُّق، ضيق = stenosis; narrowing»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«اختناق الوادي، تضيُّق الوادي = narrowing of valley»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"

    - lemma: "ضِيقَة"
      confirm:
        - text: "«ضِيْقَة = narrowing»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«ضِيْقَةُ المَريءِ الأَبْهَرِيَّة = aortic narrowing of esophagus»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "مستعملة في تركيبات طبية تشريحية متعددة"

    - lemma: "تَخَصُّر"
      confirm:
        - text: "«تخصر = constriction»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«تخصر مركزي = centric constriction»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      contradicts:
        - text: "«تخصر الخلية = constriction of the cell»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "الاستعمال مقصور على السياق البيولوجي الخلوي، لا يعمّ مطلق انخفاض العرض"


stage3_analysis:
  per_lemma:
    - lemma: "تَضْيِيق"
      decision: confirmed
      decision_reason: "لمّة ثابتة معجمياً من الجذر ض ي ق على وزن تَفْعِيل، مشهودة في معاجم الجيولوجيا والبيطرة والاقتصاد بدلالة إنقاص العرض أو الحجم. تدلّ على الفعل المتعدي (جَعْلُ الشيء ضيقاً) وهو أحد وجهَيْ narrowing."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على التضييق المتعدي الإرادي: فاعلٌ يُنقص عرض شيء عمداً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَضْيِيق"

    - lemma: "تَضَيُّق"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر تَضَيَّقَ اللازم، مشهود في المعجم الطبي الموحد بمعنى stenosis/narrowing/coarctation، وفي معجم الجيولوجيا بمعنى narrowing of valley، وفي المعجم الكبير بتعريف «ضاق». دلالته اللازمة (صيرورة الشيء ضيقاً) أقرب لتعريف المجموعة (انخفاض في العرض) الذي لا يستلزم فاعلاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على التضيّق اللازم التلقائي: الشيء يصير ضيقاً من تلقاء نفسه دون فاعل خارجي"
      actions:
        - command: create_entry
          params: {lemma: "تَضَيُّق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13539766-n"}

    - lemma: "ضِيقَة"
      source: stage1
      decision: removed
      decision_reason: "وردت في المعجم الطبي الموحد بمعنى narrowing لكن استعمالها مقصور على التشريح الطبي (ضيقة المريء، ضيقة الحالب). وهي اسم مرّة يدلّ على موضع الضيق لا على عملية الانخفاض في العرض. لا تصلح لمّةً عامة في هذه المجموعة."

    - lemma: "تَخَصُّر"
      source: stage1
      decision: removed
      decision_reason: "استعمالها محصور في علم الأحياء الخلوي (تخصّر الخلية، تخصّر مركزي). الجذر خ ص ر يحيل إلى الخَصْر وهو منطقة محددة من الجسم، فلا يعمّ مطلق انخفاض العرض."


