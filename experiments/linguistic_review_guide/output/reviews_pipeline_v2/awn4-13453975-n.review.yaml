stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «منع إعادة الترسيب» هي ترجمة حرفية للمصطلح الإنجليزي antiredeposition، وهي عبارة وصفية وليست مصطلحاً مسكوكاً"
      - "التعريف العربي «عملية منع إعادة الترسيب» دوراني — يكرر اللمّة نفسها داخل التعريف"
      - "المجموعة مصنّفة تحت «عملية طبيعية» وهي في الحقيقة عملية صناعية كيميائية تتعلق بالغسيل والمنظّفات"
      - "المجموعة تحتوي على لمّة واحدة فقط"
    observations: "المفهوم ينتمي إلى مجال كيمياء المنظّفات وصناعة النسيج، ويعني منع عودة الأوساخ والجسيمات المذابة في محلول الغسيل إلى التعلّق بألياف النسيج مجدداً. هذا مفهوم تقني دقيق لا يُعبَّر عنه في العربية إلا بعبارات مركّبة. وجود مدخل «ترسب الأتربة» (soil redeposition) في مسرد صناعة النسيج يؤكد استقرار مصطلح «ترسّب» بمعنى deposition في هذا المجال. المشكلة الرئيسة هي أن «منع إعادة الترسيب» عبارة وصفية حرة وليست وحدة معجمية ثابتة."

  blind_candidates:
    - lemma: "مُضَادَّةُ التَّرَسُّبِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «مُضادَّة» (مصدر ضادَّ يُضادُّ) و«التَّرَسُّب»، على نسق «مضادّة التآكل» و«مضادّة التكلّس» الشائعة في المعاجم التقنية العربية"
    - lemma: "صَدُّ التَّرَسُّبِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «صَدّ» (المنع والدفع) و«التَّرَسُّب». الصَّدُّ جذر عربي أصيل يفيد المنع والحجب، أخفّ من «منع إعادة» ويتوافق مع نمط التسمية في المصطلحات الكيميائية"
    - lemma: "مَنْعُ التَّرَسُّبِ المُعَادِ"
      generation_method: tarkib
      justification: "تركيب إضافي وصفي يجمع «مَنْع» و«التَّرَسُّب» مع صفة «المُعَاد» بدلاً من «إعادة»، وهو أكثر اختصاراً وأقرب إلى البنية الاصطلاحية"
    - lemma: "لَاتَرَسُّبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي مركّب من لا النافية + تَرَسُّب + ياء النسبة + تاء المصدر الصناعي، على نسق «لاعَكسيَّة» (irreversibility) و«لامركزيَّة» (decentralization)، يُوجز المفهوم في كلمة واحدة"

stage2_evidence:
  per_lemma:
    - lemma: "مَنْعُ إِعَادَةِ التَّرْسِيبِ"
      evidence_status: "no_material_found"

    - lemma: "مُضَادَّةُ التَّرَسُّبِ"
      evidence_status: "no_material_found"

    - lemma: "صَدُّ التَّرَسُّبِ"
      evidence_status: "no_material_found"

    - lemma: "مَنْعُ التَّرَسُّبِ المُعَادِ"
      evidence_status: "no_material_found"

    - lemma: "لَاتَرَسُّبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَرَسُّب (عنصر مكوّن)"
      confirm:
        - text: "«تَرَسَّبَ الشَّيْءُ: تَجَمَّع ذاهبًا إلى أسفل. يُقال: رَسَّبه فترسَّب»"
          source: "المعجم الكبير"
        - text: "«الرَّاءُ وَالسِّينُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، هُوَ ذَهَابُ الشَّيْءِ سُفْلًا مِنْ ثَِقَلٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«ترسُّب جسيمات السوائل أو الغازات بفعل تأثير الجاذبية الأرضية أو القوة الطاردة المركزية»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«ترسب الأوساخ بفعل الغسيل المتكرر على المواد النسيجية، خاصة بالنسبة للمواد الصناعية القابلة للشحن الكهربائي الساكن»"
          source: "مسرد صناعة النسيج — ArabTerm"
          addition: "هذا المدخل يقابل soil redeposition ويؤكد استخدام ترسّب في مجال النسيج بدلالة عودة الأوساخ"
        - text: "«في الكيمياء، يحدث الترسيب عندما تستقر جزيئات مخارج المحلول. الترسيب يمكن أن ينظر إليه باعتباره عملية عكسية لذوبان الجسيمات»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يُبيّن الطبيعة الكيميائية لعملية الترسيب"

    - lemma: "مَنْع (عنصر مكوّن)"
      confirm:
        - text: "«الْمِيمُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ هُوَ خِلَافُ الْإِعْطَاءِ. وَمَنَعْتُهُ الشَّيْءَ مَنْعًا، وَهُوَ مَانِعٌ وَمَنَّاعٌ. وَمَكَانٌ مَنِيعٌ»"
          source: "مقاييس اللغة لابن فارس"

stage3_analysis:
  per_lemma:
    - lemma: "مَنْعُ إِعَادَةِ التَّرْسِيبِ"
      decision: confirmed
      decision_reason: "رغم أنها عبارة وصفية طويلة، فهي الترجمة المباشرة المتداولة للمصطلح الإنجليزي antiredeposition في الأدبيات التقنية العربية. لا يوجد بديل مسكوك أقصر مثبت في المعاجم. يُبقى عليها مع تصحيح التشكيل وتعديل «الترسيب» إلى «التَّرَسُّب» لأن المقصود هو العملية الذاتية (تفعُّل) لا المتعدية (تفعيل)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنْعُ إِعَادَةِ التَّرَسُّبِ"

    - lemma: "مُضَادَّةُ التَّرَسُّبِ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على تثبيت هذا المركّب. كما أنه يفقد دلالة «الإعادة» (re-) الجوهرية في المفهوم، فمضادّة الترسّب تعني anti-deposition لا antiredeposition."

    - lemma: "صَدُّ التَّرَسُّبِ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي. يفقد كذلك دلالة الإعادة، كما أن «الصَّدّ» أكثر شيوعاً في السياق العسكري والمعنوي منه في السياق الكيميائي."

    - lemma: "مَنْعُ التَّرَسُّبِ المُعَادِ"
      source: stage1
      decision: removed
      decision_reason: "أوجز من اللمّة الأصلية لكنه لا يحمل ميزة كافية تبرر إدراجه بديلاً. لا دليل معجمي على تثبيته، والفرق في الطول ضئيل."

    - lemma: "لَاتَرَسُّبِيَّة"
      source: stage1
      decision: removed
      decision_reason: "صيغة مبتكرة ثقيلة صوتياً وغير مألوفة. النمط (لا + مصدر خماسي + ياء نسبة + تاء مصدر صناعي) لم يُسجَّل لهذا الجذر. كما أنها تنزاح عن الدلالة الأصلية إذ تعني «انعدام التَّرَسُّب» لا «منع إعادته»."

stage4_content:
  definition:
    current: "عملية منع إعادة الترسيب"
    assessment:
      decision: revise
      reason: "التعريف الحالي دوراني — يعيد استخدام كلمات اللمّة نفسها دون إضافة معلومات جديدة. لا يُبيّن المجال التطبيقي ولا طبيعة العملية الكيميائية."
    authored:
      - type: terminological
        text: "عمليّةٌ كيميائيّةٌ تُحولُ دونَ عَوْدِ الجُسَيْماتِ والأوساخِ المُنحلّةِ في مَحلولِ الغَسيلِ إلى الالتصاقِ بالأليافِ النَّسيجيّةِ مُجدَّداً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "في صِناعةِ المُنظِّفاتِ: عمليّةٌ تقومُ بها موادُّ فعّالةٌ سطحيّاً أو بوليمراتٌ تُضافُ إلى تركيبةِ المُنظِّفِ لتمنعَ الأوساخَ والجُسَيْماتِ المُتحرِّرةَ أثناءَ الغسيلِ من التَّرَسُّبِ ثانيةً على سطحِ الأقمشةِ"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عمليّةٌ كيميائيّةٌ تُحولُ دونَ عَوْدِ الجُسَيْماتِ والأوساخِ المُنحلّةِ في مَحلولِ الغَسيلِ إلى الالتصاقِ بالأليافِ النَّسيجيّةِ مُجدَّداً"

  examples:
    per_lemma:
      - lemma: "مَنْعُ إِعَادَةِ التَّرَسُّبِ"
        examples:
          - text: "تُضافُ مادَّةُ كَرْبوكسي ميثيل السِّليلوز إلى مَساحيقِ الغَسيلِ لتعزيزِ مَنْعِ إعادةِ التَّرَسُّبِ على الأنسجةِ القُطنيَّة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُضافُ مادَّةُ كَرْبوكسي ميثيل السِّليلوز إلى مَساحيقِ الغَسيلِ لتعزيزِ مَنْعِ إعادةِ التَّرَسُّبِ على الأنسجةِ القُطنيَّة."

