      generation_method: tarkib
      justification: "مركّب وصفي كالك من الإنجليزية dry ice، يستخدم «ثلج» (الماء المتجمّد) بدل «جليد» (الندى المتجمّد)، وهو بديل شائع في الأدبيات العلمية العربية"
    - lemma: "جَلِيدٌ جَافّ"
      generation_method: tarkib
      justification: "مركّب وصفي يجمع «جليد» (المادة الصلبة المتجمّدة) و«جاف» (لا يمرّ بالحالة السائلة عند التسامي)، وهو الترجمة الأكثر دقّة علمياً لأنّ الجليد يشمل تجمّد أيّ مادة لا الماء فحسب"
    - lemma: "جَلِيدٌ كَرْبُونِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي يربط المادة (جليد) بعنصرها الكيميائي (كربون)، أكثر تحديداً من «جاف» لأنه يصف التركيب لا المظهر"
    - lemma: "ثَلْجُ الكَرْبُون"
      generation_method: tarkib
      justification: "مركّب إضافي يسمّي المادة بنسبتها إلى عنصر الكربون، على نمط تسمية المركّبات الكيميائية العربية"

