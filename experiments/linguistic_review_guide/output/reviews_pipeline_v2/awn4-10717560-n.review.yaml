# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10717560-n
# telephone operator / telephonist / switchboard operator
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عامل هاتف، مأمور مقسم) بلا تشكيل"
      - "لفظ «مأمور» يغلب عليه الاستعمال الإداري المصري، وقد لا يكون مفهوماً في كل البلدان العربية"
      - "لفظ «مقسم» في اللمّة الثانية يحتاج توضيح أنه المِقسم الهاتفي لا مكان القسمة"
    observations: >
      المجموعة تصف شخصاً يعمل وسيطاً بين المتّصِلين في شبكة الهاتف، وهي مهنة كانت شائعة قبل انتشار التحويل الآلي.
      المفهوم له مقابلات عربية متعددة في المعاجم المصطلحية الحديثة (ALECSO)، منها: عامل المقسم، محوّل هاتفي، موزّع المكالمات الهاتفية.
      اللمّتان الموجودتان مقبولتان دلالياً لكنهما تحتاجان إلى تشكيل كامل.
  blind_candidates:
    - lemma: "عَامِلُ هَاتِفٍ"
      generation_method: tarkib
      justification: "مركّب إضافي من «عامل» (اسم فاعل من عَمِلَ: من يعمل في مهنة) و«هاتف» (التليفون)، يدلّ على الشخص الذي يعمل على جهاز الهاتف لتوصيل المكالمات"
    - lemma: "مَأْمُورُ مِقْسَمٍ"
      generation_method: tarkib
      justification: "مركّب إضافي من «مأمور» (المكلَّف بأمرٍ إداري) و«مِقسم» (لوحة توزيع المكالمات الهاتفية)، يدلّ على الموظف المسؤول عن تشغيل المِقسم"
    - lemma: "مُحَوِّلُ اتِّصَالَاتٍ"
      generation_method: tarkib
      justification: "مركّب إضافي من «محوّل» (اسم فاعل من حَوَّلَ: نقلَ من جهة إلى أخرى) و«اتصالات»، يدلّ على من يُحوِّل المكالمات الهاتفية ويوجّهها"
    - lemma: "سَنْتَرَالِيّ"
      generation_method: taarib
      justification: "تعريب لفظ «centralist» المستعمل عامّياً في عدة بلدان عربية للدلالة على عامل المقسم الهاتفي، مع إلحاق ياء النسبة"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "عَامِلُ هَاتِفٍ"
      confirm:
        - text: "«(الْعَامِل) من يعْمل فِي مهنة أَو صَنْعَة وَالَّذِي يتَوَلَّى أُمُور الرجل فِي مَاله وَملكه وَعَمله»"
          source: "المعجم الوسيط"
        - text: "«(الْهَاتِف) الصَّوْت يسمع دون أَن يرى شخص الصائح و (التليفون) أَو من يتَكَلَّم بِهِ (مج)»"
          source: "المعجم الوسيط"
        - text: "«عامل التَّلِفون.» — translation_en: telephone operator"
          source: "المورد الحديث (2008)"
        - text: "«عامل التَّلِفون (بر).» — translation_en: telephonist"
          source: "المورد الحديث (2008)"
        - text: "«عامل المَقْسَم» — translation_en: operator (مجال: الإعلام والتواصل)"
          source: "مسرد الإعلام والتواصل، ALECSO"
      expands:
        - text: "«عامِل — الذي ينفذ عملية ما.» — translation_en: operator"
          source: "مسرد الإعلام والتواصل، ALECSO"
          addition: "تعريف عام لـ«عامل» بمعنى المُشغِّل يشمل عامل الهاتف"

    - lemma: "مَأْمُورُ مِقْسَمٍ"
      confirm:
        - text: "«مقسم هاتفي، لوحة التحكم — في المكالمات الهاتفية» — translation_en: telephone switchboard"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
      contradicts:
        - text: "«(الْمَأْمُور) أحد رجال الإدارة المصرية (مج)»"
          source: "المعجم الوسيط"
          conflict: "لفظ «مأمور» في المعجم الوسيط مقصور على الاستعمال الإداري المصري، ولا يشير إلى عامل الهاتف"
      expands:
        - text: "«لقبٌ يطلق على من يشغل وظيفة في السلك الإداري تختلف درجته ومهامه باختلاف البلدان والعصور»"
          source: "المعجم الكبير"
          addition: "المعجم الكبير يوسّع دلالة «مأمور» لتشمل أي موظف إداري، مما يسمح بامتدادها إلى عامل المقسم"

    - lemma: "مُحَوِّلُ اتِّصَالَاتٍ"
      expands:
        - text: "«محول هاتفي» — translation_en: switchboard operator"
          source: "مسرد الفنون والتسلية والرياضة، ALECSO"
          addition: "المصطلح المسجّل في ALECSO هو «محوّل هاتفي» وليس «محوّل اتصالات»، والتركيب وصفيّ لا إضافي"
        - text: "«محوِّل» — translation_en: telephone operator"
          source: "مسرد الفنون والتسلية والرياضة، ALECSO"
          addition: "استُعمل «محوّل» مفرداً بمعنى عامل الهاتف في مسرد ALECSO"

    - lemma: "سَنْتَرَالِيّ"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١ ──
    - lemma: "عَامِلُ هَاتِفٍ"
      decision: confirmed
      decision_reason: >
        مركّب إضافي ثابت مدعوم بشواهد متعددة من المورد الحديث (عامل التلفون = telephone operator)
        ومسرد الإعلام والتواصل ALECSO (عامل المقسم = operator). الاستعمال فصيح ومفهوم في جميع البلدان العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير عام شائع يركّز على طبيعة الوظيفة (العمل على الهاتف) دون تحديد المكان أو الجهاز"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِلُ هَاتِفٍ"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "مَأْمُورُ مِقْسَمٍ"
      decision: confirmed
      decision_reason: >
        مركّب إضافي يربط بين «مأمور» (الموظف المكلَّف) و«مِقسم» (لوحة التحويل الهاتفي).
        رغم أن «مأمور» غلب عليه الاستعمال الإداري المصري في المعجم الوسيط، إلا أن المعجم الكبير يوسّع دلالته
        لتشمل أي موظف إداري. والمركّب مستعمل في السياق الهاتفي العربي ومفهوم في سياقه.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على الجانب الإداري والوظيفي (المأمور = الموظف المسؤول) وعلى مكان العمل (المِقسم = لوحة التحويل)، أكثر رسمية من «عامل هاتف»"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَأْمُورُ مِقْسَمٍ"

    # ── مرشح المرحلة ١: محوّل اتصالات ──
    - lemma: "مُحَوِّلُ اتِّصَالَاتٍ"
      source: stage1
      decision: removed
      decision_reason: >
        التركيب «محوّل اتصالات» غير مسجّل في أي معجم مصطلحي. المصطلح المسجّل في ALECSO هو «محوّل هاتفي»
        (مركّب وصفي) أو «محوّل» مفرداً. كما أن «محوّل» يلتبس مع المحوّل الكهربائي (transformer)، ولا يفي
        باختبار التثبيت المعجمي بصيغة «محوّل اتصالات».

    # ── مرشح المرحلة ١: سنترالي ──
    - lemma: "سَنْتَرَالِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ عامّي دارج لم يُسجَّل في أي معجم فصيح أو مسرد مصطلحي رسمي. لا يقبل الاشتقاق العربي
        ولا يتوافق مع معايير إيثار العربي والتراثي. يبقى في دائرة اللهجات المحكية.

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "شخص يساعد المتصلين في الوصول إلى الشخص الذي يتصلون به"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية، ويفتقر إلى الجنس القريب الدقيق (لم يذكر أنه موظف أو عامل)،
        ولا يشير إلى المِقسم أو شبكة الهاتف. يحتاج إعادة صياغة بأسلوب معجمي عربي.
    authored:
      - type: terminological
        text: "مُوَظَّفٌ يتولّى تشغيلَ المِقْسَمِ الهاتفيِّ لتحويلِ المكالماتِ وتوصيلِ المتّصِلينَ بالجهةِ المطلوبة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مُوَظَّفٌ يجلسُ إلى لوحةِ المِقْسَمِ الهاتفيّ، يتلقّى المكالماتِ الواردةَ ويُحوِّلُها إلى الخطوطِ الداخليّةِ المطلوبةِ، أو يُساعدُ المتّصِلينَ في الحصولِ على الأرقامِ وإتمامِ الاتّصالِ، وقد تراجعَتِ الحاجةُ إليه مع انتشارِ أنظمةِ التحويلِ الآليّ"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُوَظَّفٌ يتولّى تشغيلَ المِقْسَمِ الهاتفيِّ لتحويلِ المكالماتِ وتوصيلِ المتّصِلينَ بالجهةِ المطلوبة"

  examples:
    per_lemma:
      - lemma: "عَامِلُ هَاتِفٍ"
        examples:
          - text: "طلبتُ من عاملِ الهاتفِ تحويلَ المكالمةِ إلى قسمِ الصيانة"
            type: usage
      - lemma: "مَأْمُورُ مِقْسَمٍ"
        examples:
          - text: "يستقبلُ مأمورُ المِقسمِ عشراتِ المكالماتِ يومياً ويُوجِّهُها إلى الموظّفينَ المختصّين"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "طلبتُ من عاملِ الهاتفِ تحويلَ المكالمةِ إلى قسمِ الصيانة"
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يستقبلُ مأمورُ المِقسمِ عشراتِ المكالماتِ يومياً ويُوجِّهُها إلى الموظّفينَ المختصّين"

