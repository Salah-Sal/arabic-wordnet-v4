# مراجعة المجموعة الترادفية — awn4-14641117-n (adulterant)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «شائبة» بدون تشكيل كامل — يجب أن تكون «شَائِبَة»"
      - "اللمّة «مادة غاشة» بدون تشكيل — يجب أن تكون «مَادَّة غَاشَّة»"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزي ويحتاج تأليفاً معجمياً أصيلاً"
    observations: >
      المفهوم يدور حول مادة تُخلَط بمادة أخرى فتُنقِص من نقائها أو فاعليتها.
      الجذر «شوب» أصل صحيح في العربية يدل على الخلط (ابن فارس)، و«شائبة» مصطلح
      مُثبت في المعاجم المتخصصة (الفيزياء، الكيمياء، الطب، الجيولوجيا) بمعنى impurity/adulterant.
      أما التعبير «مادة غاشة» فمركب وصفي مسنود بالمورد الحديث. الحقل الدلالي يشمل
      أيضاً جذر «مذق» (خلط اللبن بالماء للغش) وجذر «لوث» (التلويث) لكنهما يختلفان
      دلالياً عن المفهوم المقصود.

  blind_candidates:
    - lemma: "شَائِبَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «شوب» بمعنى الخلط، على وزن فاعِلة.
        الشائبة هي ما يختلط بشيء فيُفسد نقاءه، وهو المعنى المطابق للتعريف.
    - lemma: "مَادَّة غَاشَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من «مادة» و«غاشّة» (اسم فاعل من غشّ).
        يدل على مادة تُستخدم في الغش لتقليل جودة مادة أخرى.
    - lemma: "مَاذِق"
      generation_method: ishtiqaq
      justification: >
        من الجذر «مذق» على وزن فاعِل، والمذق عند ابن فارس: خلط شيء
        لا على جهة النصاحة. مسجّل في معجم الكيمياء الموحد بمعنى adulterant.
    - lemma: "مُلَوِّث"
      generation_method: ishtiqaq
      justification: >
        من الجذر «لوث» على وزن مُفَعِّل (اسم فاعل مضعّف).
        يدل على مادة تُفسد صلاحية مادة أخرى. مصطلح واسع الانتشار في المعاجم التقنية.


stage2_evidence:
  per_lemma:
    - lemma: "شَائِبَة"
      confirm:
        - text: "«الشيء الغريب يختلط بغيره»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الدَّنَسُ والقَذَرُ ونَحْوُهما. الشيءُ الغريبُ يَخْتَلِطُ بغيره. يقال: ما فيه شائِبَةٌ: ليس فيه شُبْهَةٌ»"
          source: "المعجم الكبير (OCR)"
        - text: "«(الشائبة) الشَّيْء الْغَرِيب يخْتَلط بِغَيْرِهِ وَيُقَال مَا فِيهِ شَائِبَة لَيْسَ فِيهِ شُبْهَة والدنس والقذر وَنَحْوهمَا (ج) شوائب»"
          source: "المعجم الوسيط (هَوْرَماني)"
        - text: "«شائِبَة = adulterant»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«شائبة = impurity»"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989)"
        - text: "«شائبة = impurity»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«شائبة = impurity»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«شائبة كيميائية = chemical impurity; foreign atom; impurity atom»"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989)"
          addition: "يتوسع في الاستعمال العلمي للشائبة بوصفها ذرّة غريبة في مادة"
        - text: "«شائبة منشِّطة: شائبةٌ تُضاف بكميات صغيرة إلى مادةٍ نصفِ ناقلة أثناء تصنيع الديودات والترانزستورات»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يوسّع المفهوم ليشمل الشوائب المضافة قصداً لتغيير خصائص مادة"

    - lemma: "مَادَّة غَاشَّة"
      confirm:
        - text: "«(1) الغاشَّة: مادة تُستخدم في الغِش (2) غاشّ؛ غشّاش adulterant agents»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الغش: ما يخلط من الرديء بالجيد»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يؤصّل مفهوم الغش بوصفه خلط الرديء بالجيد"
        - text: "«غَشَّ صاحبَه: زيَّن له غير المصلحة وأظهر له غير ما يضمر»"
          source: "المعجم الوسيط (OCR)"
          addition: "يؤكد الدلالة على التدليس والخداع في فعل الغش"

    - lemma: "مَاذِق"
      confirm:
        - text: "«ماذق = adulterant / adultérant»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«مَذَقَ: الْمِيمُ وَالذَّالُ وَالْقَافُ أَصْلٌ يَدُلُّ عَلَى خَلْطِ شَيْءٍ لَا عَلَى جِهَةِ النَّصَاحَةِ. مِنْ ذَلِكَ مَذَقَ اللَّبَنَ بِالْمَاءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل أصلاً على خلط شيء على وجه الغش والتدليس"
        - text: "«يَمْذُق؛ يَغُشّ؛ يُزَيِّف to adulterate milk»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد استعمال الفعل مذق بمعنى الغش"

    - lemma: "مُلَوِّث"
      contradicts:
        - text: "«مصطلح عام يشير إلى أي مركب كيميائي يضاف إلى بيئة مستقبلة بقدر يتجاوز الظروف الطبيعية»"
          source: "مسرد المناخ والبيئة (ALECSO)"
          conflict: "المُلَوِّث مفهوم أعمّ يشمل أي مادة ملوثة بيئياً، بينما الشائبة/adulterant مادة تُخلط قصداً لإنقاص النقاء"
      expands:
        - text: "«مُلوِّث: أي مادة يُمكن أن تُسبب التلوث والاتساخ»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "تعريف عام يشمل التلوث العَرَضي والمقصود معاً"
        - text: "«مُلَوِّث عَرَضيّ: مادة ملوثة توجد في الأغذية بدون قصد»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "يؤكد أن التلويث قد يكون عرضياً لا قصدياً، بخلاف الغش"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١: شائبة ──
    - lemma: "شَائِبَة"
      decision: confirmed
      decision_reason: >
        لمّة متينة الجذر (شوب = الخلط)، مثبتة في المعجم الوسيط والمعجم الكبير
        بمعنى «الشيء الغريب يختلط بغيره»، ومسجّلة في المعجم الطبي الموحد
        مقابلاً لـ adulterant تحديداً، وفي عدة معاجم علمية بمعنى impurity.
        تشكيلها الكامل: شَائِبَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تدل على المادة الغريبة المختلطة بغيرها بذاتها دون إشارة إلى القصد أو الفعل،
        وهي أقرب إلى impurity منها إلى adulterant بالمعنى الضيق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَائِبَة"

    # ── اللمّة الموجودة ٢: مادة غاشة ──
    - lemma: "مَادَّة غَاشَّة"
      decision: confirmed
      decision_reason: >
        مركب وصفي مثبت في المورد الحديث بمعنى adulterant تحديداً.
        جذر «غشش» يدل على خلط الرديء بالجيد (المناوي)، مما يطابق المفهوم.
        التشكيل الكامل: مَادَّة غَاشَّة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تؤكد عنصر القصد والتدليس في الخلط (الغش)، بخلاف «شائبة» التي قد تكون
        عَرَضية. أقرب إلى adulterant بالمعنى الدقيق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة غَاشَّة"

    # ── مرشح المرحلة ١: ماذق ──
    - lemma: "مَاذِق"
      source: stage1
      decision: removed
      decision_reason: >
        رغم تسجيله في معجم الكيمياء الموحد (1992) مقابلاً لـ adulterant،
        فإنه محدود الاستعمال جداً ولا يرد في المعاجم اللغوية العامة بهذا المعنى الاسمي.
        الجذر «مذق» متخصص في مذق اللبن بالماء، واسم الفاعل «ماذق» يُفهم أصلاً
        على أنه وصف للشخص الذي يمذق لا للمادة. لا يحقق معيار شيوع الفصيح.
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: ملوّث ──
    - lemma: "مُلَوِّث"
      source: stage1
      decision: removed
      decision_reason: >
        المُلَوِّث مفهوم أعمّ يشمل أي مادة تسبب التلوث (contaminant/pollutant)
        بما فيه التلوث العَرَضي والبيئي. أما المجموعة الترادفية فتخص المادة التي
        تُقلّل النقاء أو الفعالية (adulterant)، وهو مفهوم أضيق يتضمن عنصر الخلط
        والإفساد. الفرق الدلالي واضح: ليس كل ملوّث شائبةً أو مادةً غاشّة.
      evidence_assessment:
        case: contradicts_only


