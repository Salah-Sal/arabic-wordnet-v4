# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10806193-n (witness)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «شاهد» بدون تشكيل كامل"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو ما يُفقر الشبكة الدلالية"
      - "التعريف العربي يتضمن تركيب «يشهد تحت القسم» وهو نقل حرفي من الإنجليزية (testifies under oath)"
    observations: >
      المفهوم هو الشاهد بالمعنى القانوني: شخص يُدلي بأقواله أمام القضاء بعد حلف اليمين.
      الجذر «ش هـ د» من أغنى الجذور العربية وأكثرها اشتقاقاً، ويدلّ على الحضور والعلم والإعلام.
      اسم الفاعل «شَاهِد» هو الأكثر استعمالاً ومباشرةً للدلالة على هذا المفهوم.
      يوجد أيضاً «شَهِيد» بوزن فعيل بمعنى فاعل، لكنه غلب عليه معنى المقتول في سبيل الله.
  blind_candidates:
    - lemma: "شَاهِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من شَهِدَ يَشْهَدُ على وزن فاعل، وهو الأصل في الدلالة على من يُدلي بالشهادة أمام القضاء"
    - lemma: "شَهِيد"
      generation_method: majaz
      justification: "فعيل بمعنى فاعل، ورد في القرآن والمعاجم بمعنى من يُؤدّي الشهادة، لكنّه محتمل اللبس مع المعنى الغالب (المقتول في سبيل الله)"
    - lemma: "مُسْتَشْهَد"
      generation_method: ishtiqaq
      justification: "اسم مفعول من استشهد بمعنى طُلبت شهادته؛ يحمل دلالة المفعولية أي من يُطلب منه الشهادة"
    - lemma: "شَاهِد عَدْل"
      generation_method: tarkib
      justification: "مركب إضافي-وصفي مستعمل في الفقه الإسلامي للدلالة على الشاهد المستوفي لشروط قبول الشهادة"

stage2_evidence:
  per_lemma:
    - lemma: "شَاهِد"
      confirm:
        - text: "«(الشَّاهِد) من يُؤَدِّي الشَّهَادَة وَالدَّلِيل وَشبه مخاط يخرج مَعَ الْمَوْلُود (ج) شُهُود وأشهاد وَشهد وَشهد»"
          source: "المعجم الوسيط"
        - text: "«(فى القانون) شَخصٌ مُكَلَّفٌ بالحُضُور أمام القضاء أو سُلْطَة التَّحقيق؛ لكى يُدْلِى بمعلوماته فى شَأْن واقعةٍ ذات أهميةٍ فى الدَّعوى الجنائِيَّة»"
          source: "المعجم الكبير"
        - text: "«العالِمُ الذى يُبَيِّنُ ما عَلِمَه من يُؤَدِّى الشَّهادَةَ»"
          source: "المعجم الكبير"
        - text: "«الشاهد: هو المخبر بقضية أو بحق شخص على غيره، عن مشاهدة وعيان، لا عن تخمين وحِسْبان»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الشَّاهِد: فِي اللُّغَة الْحَاضِر. وَفِي الشَّرْع الْمخبر بقضية أَو بِحَق شخص على غَيره عَن مُشَاهدَة وعيان لَا عَن تخمين وحسبان»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«شَاهِد — witness»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
          addition: "يؤكد المقابل الإنجليزي witness"
        - text: "«شهادة، شاهِد — witness / témoignage; témoin»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يثبت استعمال شاهد في المجال القانوني بمقابل witness"
        - text: "«شاهد نفي — defence witness» و«شاهد إثبات — prosecution witness»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يدلّ على إنتاجية المصطلح في التركيبات القانونية"
    - lemma: "شَهِيد"
      confirm:
        - text: "«(الشَّهِيد) من قتل فِي سَبِيل الله وَمن يُؤَدِّي الشَّهَادَة وَفِي التَّنْزِيل الْعَزِيز {وَلَا يضار كَاتب وَلَا شَهِيد} (ج) شُهَدَاء وأشهاد»"
          source: "المعجم الوسيط"
        - text: "«شَهِيد — من (ش ه د) من قتل في سبيل الله، ومن يؤدي الشهادة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«الشهيد: هو كل مسلم طاهر بالغ قتل ظلمًا ولم يجب بقتله مالٌ، ولم يرتث»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "التعريف يقصر الشهيد على المقتول في سبيل الله دون ذكر معنى الشاهد القانوني"
        - text: "«شهيد — martyr»"
          source: "مسرد الجغرافيا والتاريخ (ARABTERM)"
          conflict: "المقابل الإنجليزي martyr لا witness"
    - lemma: "مُسْتَشْهَد"
      evidence_status: "no_material_found"
    - lemma: "شَاهِد عَدْل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "شَاهِد"
      decision: confirmed
      decision_reason: >
        أدلة معجمية قوية ومتعددة المصادر تؤكد استعمال «شاهد» بمعنى من يُؤدّي الشهادة.
        المعجم الكبير يوثّق المعنى القانوني صراحةً. الكلمة مستعملة في المعاجم المتخصصة
        القانونية (ALECSO) بمقابل witness. وزن فاعل (اسم فاعل) مناسب تماماً للدلالة على
        الفاعل (من يقوم بفعل الشهادة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الاسم الأصلي والأكثر تداولاً للدلالة على من يُدلي بشهادته أمام القضاء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَاهِد"
    - lemma: "شَهِيد"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود «شهيد» بمعنى من يُؤدّي الشهادة في بعض المعاجم، فإنّ المعنى الغالب
        المتبادر هو «المقتول في سبيل الله» كما وثّقه الجرجاني والتهانوي وARABTERM
        (martyr). إضافته ستُحدث لبساً دلالياً كبيراً. كما أن الفقهاء يفرّقون بينهما تفريقاً
        واضحاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "مُسْتَشْهَد"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية تدعم استعمال «مستشهد» بمعنى الشاهد القانوني.
        الصيغة تحمل دلالة المفعولية (من طُلبت شهادته) لا الفاعلية، وليست مصطلحاً
        مسكوكاً في الاستعمال القانوني أو الفقهي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "شَاهِد عَدْل"
      source: stage1
      decision: removed
      decision_reason: >
        «شاهد عدل» مفهوم فقهي أخصّ يشترط العدالة في الشاهد (الاستقامة وعدم الفسق)،
        وهو أضيق من مفهوم المجموعة الذي يشمل كل شاهد في محكمة بصرف النظر عن
        صفته. لم يُعثر على المركب مدخلاً معجمياً مستقلاً في قاعدة البيانات.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

stage4_content:
  definition:
    current: "(قانون) شخص يشهد تحت القسم في محكمة قانونية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يتضمّن نقلاً حرفياً للتعبير الإنجليزي «testifies under oath» بترجمة
        «يشهد تحت القسم» وهو تركيب غير مألوف في العربية. كما أنّ «محكمة قانونية»
        حشو لأنّ المحكمة قانونية بطبيعتها. التعريف الفقهي والمعجمي العربي أدقّ وأفصح.
    authored:
      - type: terminological
        text: "(قانون) مَنْ يُدْلِي بِشَهَادَتِهِ أَمَامَ القَضَاءِ بَعْدَ حَلْفِ اليَمِينِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "المُخْبِرُ بِمَا عَلِمَ عَنْ مُشَاهَدَةٍ وَعِيَانٍ أَمَامَ جِهَةٍ قَضَائِيَّةٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "(قانون) مَنْ يُدْلِي بِشَهَادَتِهِ أَمَامَ القَضَاءِ بَعْدَ حَلْفِ اليَمِينِ"
  examples:
    per_lemma:
      - lemma: "شَاهِد"
        examples:
          - text: "أَدْلَى الشَّاهِدُ بِأَقْوَالِهِ أَمَامَ المَحْكَمَةِ بَعْدَ أَنْ أَقْسَمَ عَلَى قَوْلِ الحَقِّ."
            type: usage
          - text: "شاهداكَ أو يَمِينُه"
            type: hadith
            source: "خبر خصومة الأشعث بن قيس رضي الله عنه مع رجل في بئر"
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أَدْلَى الشَّاهِدُ بِأَقْوَالِهِ أَمَامَ المَحْكَمَةِ بَعْدَ أَنْ أَقْسَمَ عَلَى قَوْلِ الحَقِّ."
