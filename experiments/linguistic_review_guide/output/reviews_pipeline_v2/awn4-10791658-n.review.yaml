# مراجعة المجموعة الترادفية — awn4-10791658-n
# weasel: a person who is regarded as treacherous or sneaky
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «ثَعْلَب» دلالتها الأصلية الحيوان المعروف، واستعمالها للشخص الماكر من باب التشبيه البليغ لا الحقيقة، فينبغي التأكد من صحة هذا الاستعمال المجازي معجمياً"
      - "اللمّة «مَاكِر» صفة مشبّهة عامّة تدلّ على المكر دون تخصيص بالخيانة أو التستّر، فقد لا تغطّي كامل التعريف"
      - "المجموعة الإنجليزية الأصلية تُشير إلى weasel (ابن عِرْس) كاستعارة للشخص الخائن، بينما العربية تستعمل ثعلب (fox) — اختلاف في المصدر الاستعاري لكنّ المدلول واحد"
    observations: "التعريف يصف شخصاً يُنظر إليه على أنه خائن أو متستّر. هذا مفهوم مجازي يُعبَّر عنه في العربية باستعارات حيوانية (ثعلب) أو بصفات مشتقّة من أفعال الخداع والمكر. اللمّات الثلاث الموجودة تغطّي جوانب مختلفة: ثعلب (الصورة المجازية)، ماكر (صفة المكر)، مخادع (فعل الخداع). التعريف الحالي ترجمة مقبولة لكنّه يحتاج صياغة معجمية أصيلة."

  blind_candidates:
    - lemma: "دَسَّاس"
      generation_method: ishtiqaq
      justification: "من الجذر دسس (دخول الشيء تحت خفاء وسرّ) على وزن فَعَّال للمبالغة، يدلّ على كثير الدسّ والنميمة والتخفّي"
    - lemma: "خَتَّال"
      generation_method: ishtiqaq
      justification: "من الجذر ختل (الخَتْل = الخَدْع من غفلة) على وزن فَعَّال، يدلّ على المكثر من خداع غيره خُفيةً"
    - lemma: "غَدَّار"
      generation_method: ishtiqaq
      justification: "من الجذر غدر (نقض العهد وترك الوفاء) على وزن فَعَّال، يدلّ على كثير الغدر والخيانة"
    - lemma: "مُحْتَال"
      generation_method: ishtiqaq
      justification: "من الجذر حول على وزن مُفْتَعِل من الاحتيال، يدلّ على من يتّخذ الحِيَل ويتصنّع الخداع"


stage2_evidence:
  per_lemma:
    - lemma: "ثَعْلَب"
      confirm:
        - text: "«جنس حيوانات مشهورة من الفصيلة الكلبية ورتبة اللواحم يُضرب به المثل في الاحتيال»"
          source: "المعجم الوسيط"
        - text: "«فلان ثَعْلَب — الرأي: مرفوضة — السبب: لشيوعها على ألسنة العامة. المعنى: ماكر — الصواب والرتبة: فلانٌ ثَعْلَب [فصيحة] — فلانٌ ماكرٌ [فصيحة] — التعليق: هذا التركيب من باب التشبيه البليغ في الفصحى، وسرت هذه الجملة بنفس معناها البلاغي في لغة العامة.»"
          source: "معجم الصواب اللغوي"
        - text: "«فلان ثَعْلَب في سياسته: ماكرٌ مراوِغ، متصف بالدّهاء والاحتيال»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«مُثَعْلَب: ماكر، ماهر»"
          source: "تكملة المعاجم العربية لدوزي"
      expands:
        - text: "«ثعلب الرجلُ: تحايل وراغ كالثعلب»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "وجود فعل مشتقّ ثَعْلَبَ/تَثَعْلَبَ يدلّ على رسوخ الاستعارة في اللغة"
        - text: "«وتَثَعْلَبَ الرجُلُ: جَبُنَ وراغ كالثعلب»"
          source: "كتاب العين للخليل"
          addition: "إضافة دلالة الجبن والمراوغة إلى المكر"

    - lemma: "مَاكِر"
      confirm:
        - text: "«الْمَكْرُ: الِاحْتِيَالُ وَالْخِدَاعُ. وَمَكَرَ بِهِ يَمْكُرُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(2) ماكر cunning thieves»"
          source: "المورد الحديث (weasel entry)"
      expands:
        - text: "«وَالْأُخْرَى الْمَكْرُ: خَدَالَةُ السَّاقِ. وَامْرَأَةٌ مَمْكُورَةُ السَّاقَيْنِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "للجذر معنى ثانٍ بعيد (خدالة الساق) لا يؤثّر على الدلالة المطلوبة"

    - lemma: "مُخَادِع"
      confirm:
        - text: "«الْخَاءُ وَالدَّالُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ... الْإِخْدَاعُ إِخْفَاءُ الشَّيْءِ... فَمِنْهُ خَدَعْتُ الرَّجُلَ خَتَلْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(3) مُخادع»"
          source: "المورد الحديث (sneaky entry)"

    - lemma: "دَسَّاس"
      contradicts:
        - text: "«حيَّةٌ قصيرةٌ حمراء محدّدة الطرفين لا يُدرى أيهما رأسها تندَسُّ تحت التراب فلا تظهر في الشمس»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأول نوع من الحيّات، لا شخص"
        - text: "«النمام»"
          source: "المعجم الوسيط / المعجم الكبير"
          conflict: "المعنى الثاني النمّام (الساعي بالوشاية)، وهو أضيق من مفهوم الخائن المتستّر"
      expands:
        - text: "«الدَّالُ وَالسِّينُ... أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى دُخُولِ الشَّيْءِ تَحْتَ خَفَاءٍ وَسِرٍّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدعم دلالة الإخفاء والتستّر لكنّ الاستعمال المعجمي المسكوك مقصور على الحيّة والنمّام"

    - lemma: "خَتَّال"
      confirm:
        - text: "«خَتَّال: من (خ ت ل) المكثر من خداع غيره من غفلة والذي يداور خصمه في الحرب من حيث لا يشعر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«الْخَاءُ وَالتَّاءُ وَاللَّامُ أُصَيْلٌ فِيهِ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الْخَتْلُ، قَالَ قَوْمٌ: هُوَ الْخَدْعُ. وَكَانَ الْخَلِيلُ يَقُولُ: تَخَاتَلَ عَنْ غَفْلَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر أصيل في معنى الخدع من غفلة، لكنّ صيغة فَعَّال لم تُسجَّل في المعاجم اللغوية الكبرى"

    - lemma: "غَدَّار"
      confirm:
        - text: "«غَدَّار: من (غ د ر) كثير الشرب من ماء الغدير، وكثير النقض للعهد والمخلاف للوعود»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«(غدار) مَبْنِيّ على الكسر مُخْتَصّ بالنداء (ويستعمل في الشتم يُقال يا غدار للمرأة)»"
          source: "المعجم الوسيط"
          conflict: "الوسيط لم يسجّل إلا صيغة النداء المبنية على الكسر (غَدَارِ)، ولم يثبت غَدَّار على وزن فَعَّال كاسم فاعل مبالغة"

    - lemma: "مُحْتَال"
      evidence_status: "no_material_found"


