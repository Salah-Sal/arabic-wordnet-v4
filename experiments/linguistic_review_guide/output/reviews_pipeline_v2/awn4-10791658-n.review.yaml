    # ── مرشحات المرحلة ١ ──
    - lemma: "دَسَّاس"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعجمي المسكوك لدَسَّاس: (١) حيّة قصيرة، (٢) النمّام. المعنى الثاني (النمّام) أضيق من المفهوم المطلوب (خائن متستّر)، ولم يُسجَّل استعمال دَسَّاس للشخص الخائن المتستّر عموماً."
      evidence_assessment:
