# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10246226-n
# juggernaut / steamroller — قوة ساحقة لا تُقاوم
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «جبار» يدلّ في الأصل على شخص قاهر عاتٍ أو صفة من صفات الله تعالى، لا على قوة مجرّدة ساحقة"
      - "تركيب «قوة ساحقة» قريب من الدوران مع التعريف الذي يستخدم فعل «تسحق»"
      - "المجموعة تفتقر إلى لمّة مفردة تؤدي المعنى المجازي (juggernaut) دون تركيب وصفي"
    observations: "المفهوم المراد هو كيان أو قوة عاتية بالغة تمحق كلّ ما يعترض سبيلها، وهو مفهوم مجازي في الإنجليزية مأخوذ من اسم العربة الهندوسية (Jagannath). في العربية، أقرب الحقول الدلالية هي ألفاظ القهر والسحق والمحق والجحف. اللمّتان الحاليّتان تغطيان البُعد الشخصي (جبّار) والوصفي (قوة ساحقة) لكنّ المجموعة تحتاج إلى إثراء بلفظ يجمع بين العظمة والاندفاع المحطّم."
  blind_candidates:
    - lemma: "جَحْفَل"
      generation_method: majaz
      justification: "الجَحْفَل في الأصل الجيش الكثير الجرّار، والجذر «جحف» يدلّ على الذهاب بالشيء مستوعَباً كالسيل الجارف. نقله مجازاً إلى كلّ قوة عاتية تجتاح ما أمامها."
    - lemma: "حَطّامَة"
      generation_method: ishtiqaq
      justification: "من جذر «حطم» (الكسر والتهشيم) على وزن فَعّالة (صيغة المبالغة والآلة). الحُطْمة في العربية السنة الشديدة التي تحطم كل شيء."
    - lemma: "قُوَّة طَاحِنَة"
      generation_method: tarkib
      justification: "مركب وصفي من قُوَّة + طاحنة (من الطحن)، يُشير إلى قوة تطحن ما تلقاه كالرحى."
    - lemma: "جُغَرْنَوْت"
      generation_method: taarib
      justification: "تعريب للفظ الإنجليزي juggernaut ذي الأصل السنسكريتي (Jagannath)، كملاذ أخير عند غياب البديل العربي المناسب."

stage2_evidence:
  per_lemma:
    - lemma: "جَبَّار"
      confirm:
        - text: "«(الْجَبَّار) من أَسْمَائِهِ تَعَالَى والمتكبر والقاهر العاتي المتسلط وَيُقَال قلب جَبَّار لَا تدخله الرَّحْمَة وَلَا يقبل الموعظة (ج) جبابرة»"
          source: "المعجم الوسيط"
        - text: "«العاتى المُتَمرِّدُ المُتسلِّطُ القاهرُ... قلب جبار: لا تَدْخُلُه الرَّحْمةُ ولا يَقْبَلُ المَوْعِظة... الذى يَقْتُلُ على الغَضَبِ في غَيْرِ حقٍّ... العظيمُ القوىُّ الطويلُ»"
          source: "المعجم الكبير"
        - text: "«وإِذَا بَطَشْتُمْ بَطَشْتُمْ جَبَّارين»"
          source: "القرآن الكريم (الشعراء: ١٣٠)"
        - text: "«إن تُرِيدُ إلاَّ أن تَكُونَ جَبَّارًا في الأَرْضِ»"
          source: "القرآن الكريم (القصص: ١٩)"
      contradicts:
        - text: "«الجبار: فعال من الجبرية وهي غلظ طبع الظالم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "التعريف يحصر الجبّار في صفة الظلم الشخصية لا القوة المجرّدة الساحقة"
      expands:
        - text: "«(جَبَرَ) الجيم والباء والراء أصل واحد وهو جنس من العظمة والعلوّ والاستقامة. فالجبّار: الذي طال وفات اليد... ويقال أجبرت فلاناً على الأمر ولا يكون ذلك إلا بالقهر وجنس من التعظّم عليه»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يجمع بين العظمة والقهر والعلوّ، وهو ما يدعم البُعد المجازي للقوة الطاغية"

    - lemma: "قُوَّة سَاحِقَة"
      confirm:
        - text: "«(2) قوة ماحقة أو ساحقة [تُصْطَنَع لقمع المعارضة في غير ما رحمة]»"
          source: "المورد الحديث (2008) — مدخل steamroller"
      expands:
        - text: "«(سَحَقَ) السين والحاء والقاف أصلان: أحدهما البُعد، والآخر إنهاك الشيء حتى يبلغ به إلى حال البِلى... سحقت الشيء أسحقه سحقاً»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يفيد الإنهاك والإبلاء، مما يعزّز دلالة القوة المُهلِكة"

    - lemma: "جَحْفَل"
      confirm:
        - text: "«(الجحفل) الجيش الكثير (ج) جحافل»"
          source: "المعجم الوسيط"
        - text: "«الجَحْفَلُ: الجيش الكثير، ولا يكون كذلك حتى يكون فيه خيل»"
          source: "لسان العرب لابن منظور"
        - text: "«جَحْفَل: جيش كثير العدد جرّار... حشد، جمع غفير»"
          source: "معجم اللغة العربية المعاصرة"
      contradicts:
        - text: "«الجَحْفَلُ، كجعفرٍ: الجَيْشُ الكَثيرُ، والرجُلُ العَظيمُ، والسَّيِّدُ الكَريمُ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الدلالة الأصلية محصورة في الجيش أو الشخص العظيم، لا في القوة المجرّدة الساحقة"
      expands:
        - text: "«(جَحَفَ) الجيم والحاء والفاء أصل واحد قياسه الذهاب بالشيء مستوعَباً. يقال سيل جُحاف إذا جرف كل شيء وذهب به... وموت جُحاف مثل جُراف»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر الأصلي «جحف» يدلّ على الاجتياح والاستئصال، وهو قريب جدّاً من مفهوم المجموعة"

    - lemma: "حَطّامَة"
      contradicts:
        - text: "«الحُطامة: الحُطام»"
          source: "المعجم الكبير"
          conflict: "اللفظ المسجّل يعني الحُطام (الكُسارة)، لا القوة الكاسرة"
      expands:
        - text: "«(حَطَمَ) الحاء والطاء والميم أصل واحد وهو كسر الشيء... والحُطْمَة: السنة الشديدة لأنها تحطم كلّ شيء. وسُمّيت النار الحُطَمة لحطمها ما تلقى»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر غني بدلالة التحطيم لكنّ الوزن فعّالة غير مسجّل بهذا المعنى"

    - lemma: "قُوَّة طَاحِنَة"
      evidence_status: "no_material_found"

    - lemma: "جُغَرْنَوْت"
      confirm:
        - text: "«(1) القوة الماحقة: قوة هائلة عنيدة تمحق كل ما يعترض سبيلها the juggernaut of war (2) شاحنة ضخمة»"
          source: "المورد الحديث (2008) — مدخل juggernaut"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جَبَّار"
      decision: confirmed
      decision_reason: "لفظ فصيح ثابت بشواهد قرآنية متعددة، يدلّ على القاهر العاتي الذي لا يُقاوم. وإن كان الأصل في الشخص، فإنّ الاستعمال القرآني «بطشتم جبّارين» يُظهر البُعد المجازي للقوّة القاهرة. يبقى لفظاً أساسياً في المجموعة لتغطية البُعد الشخصي-الوصفي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الفاعل القاهر العاتي (شخصاً أو كياناً)، مع إيحاء بالظلم والتسلّط والتكبّر، بخلاف «قوة ساحقة» التي تصف الأثر لا الفاعل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَبَّار"

    - lemma: "قُوَّة سَاحِقَة"
      decision: confirmed
      decision_reason: "تركيب وصفي ثابت مؤكَّد من المورد الحديث كترجمة مباشرة لـ steamroller بمعنى القوة الغالبة التي لا ترحم. مسجّل في معجم ثنائي اللغة معتمد ومتداول في الخطاب الإعلامي والسياسي العربي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يصف الأثر والنتيجة (السحق) دون إسناد إلى فاعل بعينه، ويُستخدم وصفاً لقوى مجرّدة (عسكرية، سياسية، اقتصادية)، بخلاف «جبّار» الذي يحيل إلى كيان فاعل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُوَّة سَاحِقَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "جَحْفَل"
      source: stage1
      decision: removed
      decision_reason: "الجحفل في المعاجم كلّها يعني الجيش الكثير أو الحشد البشري، وهو كيان جمعي ملموس لا قوة مجرّدة. المجموعة تصف مفهوم القوة العاتية المجرّدة لا الجيش بذاته. الجذر «جحف» واعد دلالياً (الاجتياح والاستئصال) لكنّ اللفظ مقيّد بالاستعمال العسكري."
      evidence_assessment:
        case: mixed

    - lemma: "حَطّامَة"
      source: stage1
      decision: removed
      decision_reason: "الوزن فعّالة بهذا المعنى غير مسجّل في أيّ معجم. المدخل الوحيد «الحُطامة» في المعجم الكبير يعني الحُطام (الكُسارة) لا القوة الكاسرة. مصطلح مصنوع لا سند معجمي له."
      evidence_assessment:
        case: contradicts_only

    - lemma: "قُوَّة طَاحِنَة"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حرّ لا تثبيت معجمي له. يفشل في اختبار السكّ: يمكن إبدال «طاحنة» بـ«مطحنة/ساحقة/ماحقة» ويبقى وصفاً صالحاً. كما أنه مكرّر دلالياً مع «قوة ساحقة» المؤكَّدة."
      evidence_assessment:
        case: no_material

    - lemma: "جُغَرْنَوْت"
      source: stage1
      decision: removed
      decision_reason: "تعريب غير مسجّل في أيّ معجم عربي. المورد الحديث ترجم juggernaut بـ«القوة الماحقة» لا بتعريب اللفظ. وجود بدائل عربية أصيلة (جبّار، قوة ساحقة) يُغني عن التعريب."
      evidence_assessment:
        case: no_material

