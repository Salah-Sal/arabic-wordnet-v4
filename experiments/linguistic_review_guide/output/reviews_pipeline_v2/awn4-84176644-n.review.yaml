# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-84176644-n (aerogel)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «إيروجيل» تعريب صوتي غير مثبت في المعاجم العربية المعيارية"
      - "اللمّة «هلام هوائي» مركب وصفي لم يُسجَّل بوصفه وحدة معجمية ثابتة في معاجم الكيمياء"
      - "التعريف الحالي يبدأ بـ«مادة صناعية» وهو تعريف ترجمي يمكن تحسينه بأسلوب معجمي عربي"
    observations: "المفهوم حديث من مجال علم المواد (اختُرع الإيروجيل عام ١٩٣١م). لا يوجد مقابل عربي تراثي، والمصطلح يدور بين التعريب الصوتي والتركيب الوصفي. مركب «هلام هوائي» أقرب إلى التعبير الاصطلاحي منه إلى الوصف الحر، لأنه يحمل دلالة تقنية محددة لا تُستفاد من مجرد مجموع مكوّنيه. مادة «هلام نانوي» (Nanogel) المسجلة في معجم الطاقة المتجددة تؤكد إنتاجية نمط «هلام + صفة» في المصطلحية العربية الحديثة."
  blind_candidates:
    - lemma: "هُلَامٌ هَوَائِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «هُلَام» (gel) و«هَوَائِيّ» (aerial/air). نمط مُنتِج في المصطلحية الكيميائية العربية: هلام مائي (hydrogel)، هلام نانوي (nanogel). يصف المادة بأنها هلام حلّ الهواء فيه محلّ السائل."
    - lemma: "هُلَامٌ غَازِيّ"
      generation_method: tarkib
      justification: "مركب وصفي بديل يركّز على الطور الغازي الذي يحلّ محلّ السائل في الهلام. أدقّ علمياً من «هوائي» لأن الغاز ليس بالضرورة هواءً."
    - lemma: "هَبَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «هَبَاء» (الجسيمات الدقيقة المنبثّة في الهواء). مجاز بالتشابه في الخفة والمسامية. لكنه يفتقر إلى الدلالة على الهلام، فالهباء تراب دقيق لا مادة هلامية."
    - lemma: "إِيرُوجِيل"
      generation_method: taarib
      justification: "تعريب صوتي مباشر من الإنجليزية aerogel. يقبل لام التعريف (الإيروجيل) والنسبة (إيروجيلي) والجمع السالم (إيروجيلات). ملاذ أخير لكنه المصطلح المتداول عالمياً."

stage2_evidence:
  per_lemma:
    - lemma: "إِيرُوجِيل"
      evidence_status: "no_material_found"

    - lemma: "هُلَامٌ هَوَائِيّ"
      expands:
        - text: "«(الهلام) مرق السكباج المبرَّد المصفَّى من الدُّهن ومادة بروتينية شفافة تستخرج من الأنسجة الحيوانية المختلفة مثل الجلد والعظم والأربطة، وتكون جامدة عند جفافها ولكنها تتحول إلى سائل بالرطوبة»"
          source: "المعجم الوسيط"
          addition: "يؤكد أن الهلام مادة غروية تتحول بين الحالات، ما يدعم استعمال «هلام» أساساً لمفهوم gel"
        - text: "«مادة طرية متماسكة، شفافة إلى درجة ما، ترتج إذا ما هزّت»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "تعريف تقني مبسط للهلام يؤكد طبيعته الغروية"
        - text: "«نوع من المواد العازلة، يُستخدم في المباني. ويتكون من 95٪ من الهواء، ويتميز بمسام نانوية المقاس.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — مدخل: هلام نانوي"
          addition: "يُثبت نمط «هلام + صفة» في المصطلحية العربية ويصف مادة شديدة القرب من الإيروجيل (مسامية + معظمها هواء)"
        - text: "«هُلاَمَةُ السيليكا: مادة لابلورية من ثاني أكسيد السليكون، تكون إمّا مرنة أو صلبة. وهي أيضاً شديدة المسامية ولها سطح داخلي كبير»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "هلامة السيليكا مادة وثيقة الصلة بالإيروجيل (إيروجيل السيليكا هو أشهر أنواع الإيروجيل)"

    - lemma: "هُلَامٌ غَازِيّ"
      expands:
        - text: "«(الهلام) مرق السكباج المبرَّد المصفَّى من الدُّهن ومادة بروتينية شفافة تستخرج من الأنسجة الحيوانية المختلفة»"
          source: "المعجم الوسيط"
          addition: "يؤكد استعمال «هلام» مقابلاً لـ gel"
        - text: "«هلام مائي» = hydrogel"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يُثبت نمط «هلام + نسبة إلى الطور» (مائي/غازي/هوائي)"

    - lemma: "هَبَائِيَّة"
      contradicts:
        - text: "«(الهباءة) القطعة من الهباء»"
          source: "المعجم الوسيط"
          conflict: "الهباء هو دقاق التراب والغبار، لا علاقة له بالمواد الهلامية المسامية"
        - text: "«الْهَاءُ وَالْبَاءُ وَالْحَرْفُ الْمُعْتَلُّ: كَلِمَةٌ تَدُلُّ عَلَى غَبَرَةٍ وَرِقَّةٍ فِيهَا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المعنى الجذري يدور حول الغبار والرقة، لا المسامية أو البنية الهلامية"

stage3_analysis:
  per_lemma:
    - lemma: "إِيرُوجِيل"
      decision: confirmed
      decision_reason: "تعريب صوتي مقبول لمصطلح علمي عالمي (aerogel). رغم عدم تسجيله في المعاجم المعيارية بعد، فإنه المصطلح المتداول في الأوساط العلمية العربية ويحقق شروط التعريب: يقبل لام التعريف والنسبة والجمع."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح دولي مُعرَّب يُستعمل في السياقات العلمية التخصصية وعند التواصل مع المجتمع العلمي الدولي، بينما «هلام هوائي» أوضح دلالةً للقارئ العربي غير المتخصص."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيرُوجِيل"

    - lemma: "هُلَامٌ هَوَائِيّ"
      decision: confirmed
      decision_reason: "مركب وصفي منتظم يجري على نمط مُثبت في المصطلحية العربية (هلام مائي، هلام نانوي). المكوّنان مسجّلان في المعاجم المعيارية. دلالته شفافة: هلام حلّ فيه الهواء محلّ السائل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تعبير عربي وصفي شفاف الدلالة يُناسب النصوص التعليمية والتعريفية، بخلاف «إيروجيل» الذي يظل معتماً لغير المتخصص."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُلَامٌ هَوَائِيّ"

    - lemma: "هُلَامٌ غَازِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم دقته العلمية (الغاز ليس بالضرورة هواءً)، فإن المصطلح غير مسجّل في أي معجم، و«هوائي» أشيع في الاستعمال المصطلحي العربي للدلالة على الطور الغازي في سياق المواد (قياساً على هلام مائي = hydrogel). إضافته تُثقل المجموعة بمرادف لا يضيف فارقاً دلالياً جوهرياً."

    - lemma: "هَبَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الجذر «هبو/هبأ» يدل على الغبار والتراب الدقيق لا على المواد الهلامية المسامية. لا توجد علاقة دلالية حقيقية بين الهباء والإيروجيل سوى الخفة، وهي صفة عامة لا تكفي لنقل مفهوم تقني دقيق."

stage4_content:
  definition:
    current: "مادة صناعية مسامية خفيفة للغاية مشتقة من الهلام، حيث تم استبدال المكون السائل للهلام بالغاز"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية. يحتاج إلى إعادة صياغة بأسلوب معجمي عربي مع تحسين البنية: تقديم الجنس القريب وإضافة الفصل النوعي بوضوح."
    authored:
      - type: terminological
        text: "مادّةٌ هُلاميّةٌ صُلْبةٌ بالغةُ الخِفّة شديدةُ المسامِيّة، تُنتَج بتجفيف الهُلام فوقَ الحرِج فيَحِلّ الغازُ محلَّ السائلِ فيه مع بقاءِ بِنْيَتِهِ الشبكيّة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مادّةٌ مُصطنَعةٌ ذاتُ بِنْية شبكيّة نانَويّة تتألّف من هيكل صُلب تتخلّله مسامّ دقيقة مملوءة بالغاز، فيكون أكثرُ حجمها هواءً. تُعَدّ من أخفّ الموادّ الصُّلبة المعروفة، وتتميّز بعَزْلٍ حراريّ استثنائيّ. يُصنع أشهرُ أنواعها من هُلامة السِّيليكا بالتجفيف فوق الحرج."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ هُلاميّةٌ صُلْبةٌ بالغةُ الخِفّة شديدةُ المسامِيّة، تُنتَج بتجفيف الهُلام فوقَ الحرِج فيَحِلّ الغازُ محلَّ السائلِ فيه مع بقاءِ بِنْيَتِهِ الشبكيّة."

  examples:
