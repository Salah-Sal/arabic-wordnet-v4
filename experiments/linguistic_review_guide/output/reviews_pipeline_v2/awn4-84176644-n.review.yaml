      - lemma: "إِيرُوجِيل"
        examples:
          - text: "يُستخدَم الإيروجيل عازلاً حراريّاً في المركبات الفضائيّة لحماية المعدّات الحسّاسة من التقلّبات الحادّة في درجات الحرارة."
            type: usage
      - lemma: "هُلَامٌ هَوَائِيّ"
        examples:
          - text: "نجح الباحثون في تطوير هُلام هوائيّ من السيليكا بكثافة لا تتجاوز ثلاثة أضعاف كثافة الهواء."
            type: usage
    actions:
