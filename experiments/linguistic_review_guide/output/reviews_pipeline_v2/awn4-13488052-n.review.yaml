# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13488052-n (disinflation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «تراجع التضخم» عبارة وصفية حرّة وليست مصطلحاً مسكوكاً في المعاجم الاقتصادية المعتمدة"
      - "التعريف العربي يصف خفض الأسعار (أقرب إلى deflation) لا تباطؤ معدّل التضخم (disinflation)"
      - "المعاجم الاقتصادية العربية الموحّدة تستعمل مصطلحات مختلفة: انحسار التضخم، مكافحة التضخم، امتصاص التضخم"
    observations: "المفهوم اقتصادي تقني يصف إجراءً سياسياً مقصوداً لخفض الأسعار بهدف تصحيح ميزان المدفوعات. المصطلح الإنجليزي disinflation يُميَّز من deflation (انكماش) في أنّه إجراء هادف لا انكماش تلقائي. الفارِق الجوهري يقتضي مصطلحاً عربياً يدلّ على القصد والتدبير. الأقرب في المعاجم المعتمدة «انحسار التضخم» (المورد الحديث) و«امتصاص التضخم» (معجم الاقتصاد الموحّد)."
  blind_candidates:
    - lemma: "انْحِسَارُ التَّضَخُّمِ"
      generation_method: tarkib
      justification: "مركّب إضافي من «انحسار» (انكشاف وتراجع) و«التضخم» (ارتفاع الأسعار والنقد)؛ يُفيد تراجع موجة التضخم كما ينحسر الماء"
    - lemma: "خَفْضُ التَّضَخُّمِ"
      generation_method: tarkib
      justification: "مركّب إضافي يدلّ على الفعل المقصود لتقليل التضخم؛ «خفض» مصدر صريح يُفيد الإنقاص"
    - lemma: "انْكِمَاشٌ"
      generation_method: ishtiqaq
      justification: "من الجذر ك-م-ش على وزن انفعال؛ يدلّ على التقلّص والنقصان في الحجم النقدي"
    - lemma: "مُكَافَحَةُ التَّضَخُّمِ"
      generation_method: tarkib
      justification: "مركّب إضافي يجمع بين دلالة المواجهة الفعّالة (مكافحة) والظاهرة الاقتصادية (التضخم)"

stage2_evidence:
  per_lemma:
    - lemma: "تَرَاجُعُ التَّضَخُّمِ"
      expands:
        - text: "«(تراجع) القوم رجعوا إلى محلهم والقوم الكلام بينهم تداولوه»"
          source: "المعجم الوسيط"
          addition: "تراجع بمعنى الرجوع والتقهقر، لا خصوصية اقتصادية فيه"
        - text: "«(التضخم) (في الاقتصاد) زيادة النقود أو وسائل الدفع الأخرى على حاجة المعاملات (مج)»"
          source: "المعجم الوسيط"
          addition: "التضخم مصطلح اقتصادي مثبت في الوسيط"
        - text: "«(في علم الاقتصاد) Inflation: تناقص قيمة العملة الشرائية؛ نتيجة الزيادة المفرطة في النقد المتداول من غير غطاء ذهبيّ أو فضيّ»"
          source: "المعجم الكبير"
          addition: "تعريف مفصّل للتضخم في المعجم الكبير"

    - lemma: "انْحِسَارُ التَّضَخُّمِ"
      confirm:
        - text: "«انحسار التضخّم (اد).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(حسر) الحاء والسين والراء أصل واحد، وهو من كشف الشيء»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر حسر يدلّ على الكشف والانحسار، وهو مناسب لتراجع الظاهرة"

    - lemma: "خَفْضُ التَّضَخُّمِ"
      expands:
        - text: "«تخفيض معدل التضخم — تباطؤ في معدل التضخم»"
          source: "مسرد المناخ والبيئة، الألكسو"
          addition: "المصطلح المعتمد هو «تخفيض معدل التضخم» بزيادة «معدل» وبصيغة التفعيل لا المصدر"
        - text: "«تخفيض الأسعار»"
          source: "المعجم الموحد للتجارة والمحاسبة (1995)"
          addition: "«تخفيض الأسعار» = lowering of prices، مفهوم أعمّ من disinflation"

    - lemma: "انْكِمَاشٌ"
      contradicts:
        - text: "«(الانكماش) نقص المتداول من النقود الورقية (مج)»"
          source: "المعجم الوسيط"
          conflict: "الانكماش = deflation وهو مفهوم مختلف عن disinflation"
        - text: "«تقلّص، انكماش — ينشأ ذلك عن انخفاض حجم الإنفاق النقدي، وتصحبه أعراض منها: انخفاض مستوى الأسعار ومستوى الاستخدام، والدخل القومي…»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "الانكماش يدلّ على الركود الاقتصادي الشامل لا على إجراء مقصود لتحسين ميزان المدفوعات"
      expands:
        - text: "«(كمش) الكاف والميم والشين أصل صحيح يدلّ على لطافة وصغر»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الصغر والتقلّص المادي"

    - lemma: "مُكَافَحَةُ التَّضَخُّمِ"
      confirm:
        - text: "«مكافحة التضخم»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«امتصاص التضخم — إزالة التضخم بعدة وسائل منها رفع الفوائد لتشجيع الادخار»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "«امتصاص التضخم» مرادف آخر لـ disinflation في المعاجم الموحدة"

stage3_analysis:
  per_lemma:
    - lemma: "تَرَاجُعُ التَّضَخُّمِ"
      decision: confirmed
      decision_reason: "عبارة شائعة الاستعمال في الخطاب الاقتصادي العربي المعاصر للدلالة على تراجع معدّل التضخم؛ وإن لم تكن مسجّلة مدخلاً معجمياً مستقلاً فإنّها مفهومة ومتداولة"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُركّز على الجانب الوصفي لحركة التضخم التراجعية دون إيحاء بفاعل أو إجراء مقصود"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرَاجُعُ التَّضَخُّمِ"

    - lemma: "انْحِسَارُ التَّضَخُّمِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسجّل في المورد الحديث (2008) مقابلاً لـ disinflation؛ الجذر حسر يدلّ على الانكشاف والتراجع وهو أدقّ في وصف تراجع الظاهرة التضخمية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يحمل دلالة انكشاف الموجة وزوالها تدريجياً، أقرب إلى الوصف الطبيعي لتراجع التضخم من غير إيحاء بتدخّل"
      actions:
        - command: create_entry
          params: {lemma: "انْحِسَارُ التَّضَخُّمِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "خَفْضُ التَّضَخُّمِ"
      source: stage1
      decision: removed
      decision_reason: "غير مسجّل بهذه الصيغة؛ المعاجم الموحّدة تستعمل «تخفيض معدل التضخم» بصيغة التفعيل مع إضافة «معدل»، والاختلاف في البنية يجعله مصطلحاً مختلفاً"
      evidence_assessment:
        case: no_material

    - lemma: "انْكِمَاشٌ"
      source: stage1
      decision: removed
      decision_reason: "الانكماش يقابل deflation لا disinflation في المعاجم الاقتصادية المعتمدة؛ وهو نقص النقود المتداولة لا إجراء مقصود لخفض الأسعار"
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُكَافَحَةُ التَّضَخُّمِ"
      source: stage1
      decision: removed
      decision_reason: "رغم تسجيله في المعجم الموحّد للتجارة مقابلاً لـ disinflation، فإنّ «مكافحة» تدلّ على مواجهة عامة للتضخم بأيّ وسيلة، وهي أوسع نطاقاً من المفهوم المحدّد لهذه المجموعة (خفض الأسعار لتحسين ميزان المدفوعات)"
      evidence_assessment:
        case: mixed

