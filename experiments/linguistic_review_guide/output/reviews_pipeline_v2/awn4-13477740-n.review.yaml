# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13477740-n
# decay / decline — انخفاض تدريجي في الشحنة أو التيار
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يبدأ بكلمة «انخفاض» وهي ذاتها لمّة المجموعة الأعلى (hypernym)، فقد يُعدّ دوراناً جزئياً"
      - "اللمّتان الموجودتان بدون تشكيل كامل"
      - "المجموعة متخصصة في الفيزياء/الكهرباء لكن اللمّتين عامّتان وقد تُفهمان في سياقات أوسع"
    observations: >
      المفهوم يصف ظاهرة فيزيائية محددة: التناقص التدريجي في الشحنة المخزنة أو التيار الكهربائي.
      هذا المفهوم راسخ في المصطلحية العربية المعاصرة، إذ تستعمله المعاجم العلمية الموحّدة بلفظ «اضمحلال» بوصفه مقابلاً لـ decay
      في الفيزياء والكيمياء والهندسة الكهربائية. أمّا «تضاؤل» فيُستعمل أيضاً بمعنى decay في الكيمياء
      وبمعنى damping في المصطلحات الطبية. المجموعة الأعلى (hypernym) تحمل لمّات «انخفاض» و«تناقص» و«نقصان»
      مما يدلّ على أن المفهوم الحالي أخصّ: انخفاض مرتبط بالشحنة والتيار تحديداً.
  blind_candidates:
    - lemma: "خَبْو"
      generation_method: ishtiqaq
      justification: >
        مصدر «خَبَا يَخْبُو خَبْواً» ويدل على السكون والانطفاء التدريجي.
        استُعمل في الفيزياء الحرارية (الخبو الحراري). الوزن فَعْل مصدري بسيط.
    - lemma: "تَخَامُد"
      generation_method: ishtiqaq
      justification: >
        مصدر تَخَامَدَ (تفاعُل من خَمَدَ) ويدل على السكون المتبادل والخمود التدريجي.
        مُثبت في معاجم الفيزياء والكهرباء مقابلاً لـ damping.
    - lemma: "تَلَاشٍ"
      generation_method: ishtiqaq
      justification: >
        مصدر تَلَاشَى (تفاعُل) ويدل على الاختفاء التدريجي والزوال.
        ورد في موسوعة الكهرباء مرادفاً لـ اضمحلال مقابلاً لـ decay.
    - lemma: "نُضُوب"
      generation_method: ishtiqaq
      justification: >
        مصدر نَضَبَ يَنْضُبُ نُضُوباً بمعنى ذهاب الشيء وانكشافه تدريجياً.
        الجذر يدل على الانكشاف والذهاب (ابن فارس). يصلح استعارةً لتناقص الشحنة.

stage2_evidence:
  per_lemma:
    - lemma: "اضْمِحْلَال"
      confirm:
        - text: "«تناقصٌ في مطال الإشارة مع الزمن.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«اضمحلال — decay»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«اضمحلال — decay»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«اضمحلال — decay»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«اضمحلال ، تلاشي — decay»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«اضمحلال الاستضاءة: نقصان الضوء المنبعث من مادّة فسفوريّة مع الزمن»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«ضَعُفَ انحلَّ شيئاً فشيئاً حتى تلاشى يقال: اضمحلَّ السحاب: انقشع»"
          source: "المعجم الوسيط"
          addition: "يبيّن أن الدلالة الأصلية هي الضعف والانحلال التدريجي حتى الزوال"
        - text: "«اضْمَحَلَّ الشيءُ واضْمَحَنَّ على البدل... كلّ ذلك: ذهب»"
          source: "لسان العرب لابن منظور"
          addition: "يؤكد أصل الدلالة: الذهاب والزوال"
        - text: "«اضمحلَّ نفوذُه: تلاشى وفني، ذهب وزال»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "الاستعمال المعاصر العام يشمل التلاشي والفناء"

    - lemma: "تَضَاؤُل"
      confirm:
        - text: "«تضاؤل — decay»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«نقص مستمر في مدى تذبذب موجات الطاقة المختلفة مثل الكهرباء والصوت.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«(ضَأَلَ) الضَّادُ وَالْهَمْزَةُ وَاللَّامُ أُصَيْلٌ يَدُلُّ عَلَى ضَعْفٍ وَدِقَّةٍ فِي جِسْمٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الضعف والدقة، وتضاؤل مصدر تفاعُل يفيد التدرج في الضعف"
        - text: "«تَضَاءَلَ الشَّيْءُ إذا تَقَبَّضَ وانْضَمَّ بَعْضُهُ إِلى بَعْض»"
          source: "لسان العرب لابن منظور"
          addition: "الدلالة الأصلية: التقبّض والانضمام، أي التناقص والتصاغر"
        - text: "«تضاؤل إشعاعي، تفكك إشعاعي، تحلل إشعاعي — radioactive decay»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يُستعمل في سياق الاضمحلال الإشعاعي أيضاً"

    - lemma: "خَبْو"
      confirm:
        - text: "«الخَبْو الحراريّ: (كم) نقصان فجائيّ في الإشعاع يحدث أثناء تسخين المعدن»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      contradicts:
        - text: "«الخَبْو الحراريّ: نقصان فجائيّ في الإشعاع»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "الخبو الحراري يصف نقصاناً فجائياً لا تدريجياً، والمجموعة تشترط التدرج"
      expands:
        - text: "«خَبَتِ النَّارُ: هدأت وسكنت، همدت وخمد لهبُها، انطفأت»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "الدلالة الأصلية مرتبطة بانطفاء النار وسكون اللهب"
        - text: "«الخُبُوّ: تضاؤل تدريجي في الصوت أو الصورة عند الانتقال من مشهد إلى آخر في عرض سينمائي أو تلفزيوني»"
          source: "المورد الحديث (2008)"
          addition: "الخبوّ في السياق السمعبصري يدل على تضاؤل تدريجي، لكنه مخصص للإعلام لا الكهرباء"

    - lemma: "تَخَامُد"
      contradicts:
        - text: "«تخامد — damping»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (1996)"
          conflict: "التخامد مقابل لـ damping وليس decay؛ والتخميد/التخامد يعني مضاءلة سعة الذبذبة لا تناقص الشحنة المخزنة"
      expands:
        - text: "«(خَمَدَ) الْخَاءُ وَالْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى سُكُونِ الْحَرَكَةِ وَالسُّقُوطِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على سكون الحركة، والتخامد في الفيزياء مفهوم مختلف عن الاضمحلال"

    - lemma: "تَلَاشٍ"
      confirm:
        - text: "«اضمحلال ، تلاشي — decay»"
          source: "موسوعة الكهرباء (IEC 60050)"
      contradicts:
        - text: "«الانتقال من لقطة إلى أخرى بانصهار الأولى وظهور الثانية تدريجيا — dissolve (cinema)»"
          source: "مسرد الإعلام والتواصل"
          conflict: "الاستعمال السائد لتلاشٍ في المصطلحية هو في السينما والإعلام (dissolve) لا في الفيزياء"

    - lemma: "نُضُوب"
      contradicts:
        - text: "«نضوب — drying-up»"
          source: "مسرد الجغرافيا والتاريخ"
          conflict: "النضوب مخصص لذهاب الماء وجفافه، لا لتناقص الشحنة الكهربائية أو التيار"
      expands:
        - text: "«(نَضَبَ) النُّونُ وَالضَّادُ وَالْبَاءُ كَلِمَةٌ تَدُلُّ عَلَى انْكِشَافِ شَيْءٍ وَذَهَابِهِ. وَنَضَبَ الْمَاءُ: بَعُدَ، نُضُوبًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الدلالة مقيّدة بالسوائل والكشف المادي"

stage3_analysis:
  per_lemma:
    - lemma: "اضْمِحْلَال"
      decision: confirmed
      decision_reason: >
        لمّة راسخة في المصطلحية العلمية العربية المعاصرة. وردت في أكثر من عشرة معاجم موحّدة
        مقابلاً لـ decay في الفيزياء والكيمياء والجيولوجيا والهندسة الكهربائية.
        التعريف من معجم المعلوماتية («تناقص في مطال الإشارة مع الزمن») يطابق دلالة المجموعة.
        المعجم الوسيط ومعجم اللغة المعاصرة يؤكدان الدلالة العامة: الضعف والانحلال التدريجي حتى الزوال.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُفضَّل في السياقات الفيزيائية والتقنية حيث يُراد التناقص حتى الزوال التام
        (اضمحلال الشحنة، اضمحلال إشعاعي). يحمل دلالة الفناء والتلاشي النهائي أكثر من مجرد التناقص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اضْمِحْلَال"

    - lemma: "تَضَاؤُل"
      decision: confirmed
      decision_reason: >
        مثبتة في معجم الكيمياء الموحد مقابلاً لـ decay، وفي معجم المصطلحات الطبية بتعريف
        «نقص مستمر في مدى تذبذب موجات الطاقة المختلفة مثل الكهرباء والصوت» وهو مطابق لدلالة المجموعة.
        الجذر ض أ ل يدل على الضعف والدقة (ابن فارس)، ووزن تفاعُل يفيد التدرج في الحدث.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ من «اضمحلال» ويدل على النقص التدريجي المستمر دون اشتراط الوصول إلى الزوال التام.
        يُستعمل حيث يُراد التعبير عن التناقص المطّرد في الشدة أو المقدار (تضاؤل الموجات، تضاؤل الإشارة).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَضَاؤُل"

    - lemma: "خَبْو"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الأصلية مرتبطة بانطفاء النار وسكون اللهب. المصطلح الحديث «الخبو الحراري»
        يصف نقصاناً فجائياً لا تدريجياً. الاستعمال في المورد الحديث مخصص بالسياق السمعبصري.
        لم يُثبَت استعماله مقابلاً لـ decay في سياق الشحنة والتيار الكهربائي.
      evidence_assessment:
        case: mixed

    - lemma: "تَخَامُد"
      source: stage1
      decision: removed
      decision_reason: >
        التخامد مقابل لـ damping في المعاجم الموحدة، وهو مفهوم فيزيائي مختلف عن decay.
        التخميد/التخامد يعني مضاءلة سعة الذبذبة، أما decay فيعني تناقص الشحنة أو التيار المخزّن.
        الخلط بينهما خطأ مصطلحي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَلَاشٍ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وروده مرادفاً لاضمحلال في موسوعة الكهرباء، فإن الاستعمال السائد في المصطلحية
        هو في السينما والإعلام (dissolve). ليس له تعريف مستقل في سياق الشحنة والتيار.
        إضافته ستُربك أكثر مما تُفيد.
      evidence_assessment:
        case: mixed

    - lemma: "نُضُوب"
      source: stage1
      decision: removed
      decision_reason: >
        النضوب مخصص بذهاب الماء وجفاف المصادر المائية في المعاجم الموحّدة.
        الجذر (نضب) يدل على الانكشاف والذهاب المادي ولا يناسب التناقص الفيزيائي في الشحنة أو التيار.
      evidence_assessment:
        case: contradicts_only

