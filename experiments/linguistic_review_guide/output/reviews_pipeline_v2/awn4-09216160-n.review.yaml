# مراجعة المجموعة الترادفية — awn4-09216160-n (alluvium)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «غرين» بلا تشكيل — يجب تحديد الوزن: غِرْيَن (فِعْيَل) أم غَرِين (فَعِيل)"
      - "التعريف العربي يستعمل «غرين» وهي لمّة في المجموعة نفسها — دوران جزئي"
      - "اللمّة «طمي» بلا تشكيل — ينبغي ضبطها: طَمْيٌ"
    observations: >
      المجموعة تمثّل مفهوم «الطَّمْي/الغِرْيَن» (alluvium) وهو مفهوم أصيل في البيئة العربية
      مرتبط بفيضانات الأنهار. اللمّات الثلاث الموجودة متكاملة: «طَمْي» هو اللفظ الشائع
      المعاصر الذي أقرّه مجمع اللغة العربية بالقاهرة، و«غِرْيَن» هو اللفظ الفصيح القديم
      المسجَّل في المعاجم الكلاسيكية، و«رَوَاسِب طَمْيِيَّة» هو المصطلح التقني المركّب
      المستعمل في الجيولوجيا والنفط. التعريف الحالي مقبول لكنه يحتاج تعديلاً لتجنّب
      الدوران مع اللمّة «غرين».
  blind_candidates:
    - lemma: "رُسَابَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ر س ب على وزن فُعَالة، يدلّ على ما يرسب من المواد في الماء.
        الوزن فُعَالة يناسب الناتج المادي من فعل الترسّب.
    - lemma: "رَوَاسِب سَيْلِيَّة"
      generation_method: tarkib
      justification: >
        تركيب إضافي وصفي من «رواسب» (جمع راسب) و«سَيْلِيَّة» (نسبة إلى السيل)،
        يشير إلى المواد المترسبة بفعل السيول والتيارات المائية.
    - lemma: "لَحَقِيّ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ل ح ق، نسبة إلى اللَّحَق وهو ما يجيء بعد شيء يسبقه.
        ورد في المعاجم الجيولوجية مرادفاً لـ«طَمْيِيّ» (alluvial).
    - lemma: "أَلُّوفْيُون"
      generation_method: taarib
      justification: >
        تعريب للمصطلح اللاتيني alluvion/alluvium. ملاذ أخير لأن المصطلحات العربية
        الأصيلة متوفرة وكافية.

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "طمي"
      confirm:
        - text: "«الطين يحمله السيل ويستقر على الأرض رطباً أو يابساً الغِرْين»"
          source: "المعجم الوسيط"
        - text: "«رواسب النهر في مجراه»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
        - text: "«طَمْي [مفرد]: غِرْيَن، طينٌ يحمله السيل، ويستقر على الأرض رَطْبًا أو يابسًا»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«طمي» = alluvium"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«جاء في المعاجم طمى الماءُ: ارتفع وملأ النهر، والزراعيون الآن يستعملون الطمي بمعنى: الطين الذي يحمله السيل... مجمع اللغة المصري أجازه من باب إطلاق السبب على المسبب»"
          source: "معجم الصواب اللغوي"
          addition: "الطَّمْي أصله مصدر الفعل طَمَى (ارتفع الماء)، ثمّ أُطلق مجازاً على ما يحمله الماء المرتفع من طين"
        - text: "«جسيمات بقطر بين 0,002 و0,05 ملم. ولا يمكن رؤيتها إلا من خلال المجهر»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: "في بعض السياقات التقنية يُخصَّص الطمي بحجم حبيبي معيّن (silt)"

    - lemma: "غرين"
      confirm:
        - text: "«زَبَد الماء يبقى في الحوض لا يُقْدَر على شربه الطينُ يحمله السيل, وقد يبقى على وجه الأرض رطباً أو يابساً»"
          source: "المعجم الوسيط"
        - text: "«الطِينُ يَحْمِلُهُ السَّيْلُ فَيَبْقَى على وجهِ الأرض، رَطْباً أو يابِساً»"
          source: "القاموس المحيط"
        - text: "«غِرْيَن» = alluvium"
          source: "مسرد الجغرافيا والتاريخ (ALECSO)"
      expands:
        - text: "«(فى الجيولوجيا): صخر طيني حبيباته دقيقة يلتصق بعضها ببعض إذا ابتلت بالماء (مج)»"
          source: "المعجم الوسيط"
          addition: "المجمع أضاف معنى جيولوجياً حديثاً يخصّ الغرين بنوع صخري دقيق الحبيبات"
        - text: "«راسب فتاتي تتردد أقطار مكوناته بين 1/12 مم و1/256 مم»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          addition: "في الاستعمال الجيولوجي التقني يُحدَّد الغرين بمقاس حبيبي (silt) أدقّ من الرمل وأغلظ من الطين"

    - lemma: "رواسب طميية"
      confirm:
        - text: "«رواسب طميية، توضعات طميية» = alluvial deposits"
          source: "المعجم الموحد لمصطلحات النفط"
        - text: "«طَمْيِيّ، لحقي» = alluvial"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"

    # ── المرشحات ──
    - lemma: "رُسَابَة"
      confirm:
        - text: "«ما يَرْسُب أسفل الإناء والنهر والمسيل»"
          source: "المعجم الوسيط"
        - text: "«المادة الصلبة المترسبة من سائل ما»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
      contradicts:
        - text: "«مادة مترسبة من قبل المياه أو الريح أو الأنهار الجليدية»"
          source: "مسرد الجغرافيا والتاريخ"
          conflict: "الرُّسَابَة أعمّ من الطَّمْي: تشمل أي راسب من أي مصدر (ماء أو ريح أو جليد) وليست مخصوصة بالترسيب النهري"

    - lemma: "رَوَاسِب سَيْلِيَّة"
      evidence_status: "no_material_found"

    - lemma: "لَحَقِيّ"
      contradicts:
        - text: "«طَمْيِيّ، لحقي» = alluvial (صفة)"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          conflict: "لَحَقِيّ صفة (alluvial) وليس اسماً للمادة المترسبة (alluvium)؛ لا يصلح لمّةً لمجموعة اسمية"

    - lemma: "أَلُّوفْيُون"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "طَمْيٌ"
      decision: confirmed
      decision_reason: >
        لفظ عربي أقرّه مجمع اللغة العربية بالقاهرة من باب المجاز المرسل (إطلاق السبب
        على المسبب)، وسجّلته المعاجم الحديثة (الوسيط والمعاصر). شائع في الاستعمال
        الزراعي والعلمي المعاصر. يطابق المفهوم المطلوب (alluvium) تماماً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم الشائع المعاصر للطين الذي يحمله السيل ويرسبه؛ يغلب في السياق الزراعي
        والعام، وهو أعمّ من «غِرْيَن» الذي قد يُخَصَّص جيولوجياً بمقاس حبيبي معيّن.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَمْيٌ"

    - lemma: "غِرْيَنٌ"
      decision: confirmed
      decision_reason: >
        لفظ عربي فصيح قديم ثابت في المعاجم الكلاسيكية (القاموس المحيط، العين)
        والحديثة (الوسيط). جذره غ ر ن مسجّل في مقاييس اللغة. له معنيان: عام
        (الطين الذي يحمله السيل) وتقني جيولوجي (silt: حبيبات بمقاس محدد).
        كلاهما يناسب المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللفظ التراثي الفصيح؛ يُفضَّل في الكتابة الأدبية والعلمية الرصينة.
        في الجيولوجيا التقنية يميل إلى التخصّص بمقاس الحبيبات الدقيقة (silt)
        أدقّ من الرمل وأغلظ من الصلصال.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غِرْيَنٌ"

    - lemma: "رَوَاسِب طَمْيِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح تقني مركّب مسجَّل في معاجم النفط والجيولوجيا (ALECSO)
        مقابلاً لـ alluvial deposits. وحدة معجمية ثابتة لا يمكن إبدال
        أحد مكوّنيها بمرادف (لا يُقال «رواسب غِرْيَنِيَّة» اصطلاحاً).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        المصطلح التقني المركّب الذي يُستعمل في الجيولوجيا وهندسة النفط
        والمياه؛ يركّز على كون المادة «رواسب» (جمع) في سياق وصف التكوينات
        الأرضية، بخلاف «طَمْي» و«غِرْيَن» اللذَين يصفان المادة ذاتها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَوَاسِب طَمْيِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "رُسَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        الرُّسَابَة أعمّ من المفهوم المطلوب: تشمل كل ما يرسب من أي سائل أو غاز
        بفعل أي قوة (جاذبية، طرد مركزي)، سواء من ماء أو ريح أو جليد. المجموعة
        تخصّ الترسبات النهرية (alluvium) لا الرواسب عموماً (sediment).

    - lemma: "رَوَاسِب سَيْلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي لهذا التركيب كوحدة اصطلاحية ثابتة. المصطلح المعتمد
        هو «رواسب طميية» الموجود فعلاً في المجموعة.

    - lemma: "لَحَقِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        صفة (alluvial) وليس اسماً للمادة (alluvium). المجموعة اسمية (POS: n)
        فلا تصلح الصفة لمّةً فيها.

    - lemma: "أَلُّوفْيُون"
      source: stage1
      decision: removed
      decision_reason: >
        لا حاجة للتعريب مع وجود ألفاظ عربية أصيلة كافية (طَمْي، غِرْيَن).
        لم يُسجَّل في أيّ معجم عربي مطبوع.

