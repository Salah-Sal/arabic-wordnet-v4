# مراجعة المجموعة الترادفية — awn4-09360312-n (lees)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «ثفل الخمر» مركب إضافي، والثُّفْل بمفرده يكفي للدلالة على الرواسب عموماً لكن تقييده بالخمر يخصّصه"
      - "اللمّة «عكر» لفظ عام يدل على الكَدَر والدُّرْدِيّ لأي سائل، وليس مخصوصاً برواسب التخمير"
      - "المفهوم المقصود (رواسب تخمير المشروبات الكحولية) له مصطلحات عربية أدق لم تُذكر مثل «دُرْدِيّ»"
    observations: "المجموعة تصف مفهوماً متخصصاً في صناعة الأشربة المخمَّرة. العرب عرفوا هذا المفهوم جيداً واستعملوا ألفاظاً دقيقة له مثل الدُّرْدِيّ (ما يرسب في أسفل الإناء من كل مائع كالأشربة والأدهان) والثُّفْل (ما استقر تحت الشيء من كَدَرِه). اللمّتان الموجودتان إحداهما مركبة والأخرى عامة جداً."
  blind_candidates:
    - lemma: "دُرْدِيّ"
      generation_method: ishtiqaq
      justification: "مصطلح عربي كلاسيكي يدل تحديداً على ما يرسب في أسفل الأشربة والأدهان، وهو أدق لفظ لرواسب التخمير في التراث العربي"
    - lemma: "ثُفْل"
      generation_method: ishtiqaq
      justification: "من الجذر ث ف ل، يدل على ما استقر تحت الشيء من كَدَرِه، وهو اللفظ الجنسي للرواسب بعموم"
    - lemma: "عَكَر"
      generation_method: ishtiqaq
      justification: "من الجذر ع ك ر، يدل على الدُّرْدِيّ الراسب من كل شيء، ومنه عَكَر النبيذ والزيت"
    - lemma: "حُثَالَة"
      generation_method: ishtiqaq
      justification: "من الجذر ح ث ل، يدل على الرديء من كل شيء ونُفايته وثُفْله، ويشمل ثُفْل الأدهان والأشربة"

stage2_evidence:
  per_lemma:
    - lemma: "ثُفْلُ الخَمْرِ"
      confirm:
        - text: "«الثُّفْلُ: ما رَسَب خُثارتُه وعَلا صَفوُه من كل شيءٍ. وثُفْل القدر والدواء ونحوه»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«الثُّفْلُ: ما سَفَلَ من كل شئ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      expands:
        - text: "«الثّفل: بالضم وسكون الفاء هو ما ثفل من كل شيء. وثفل الغذاء ما خرج من الدّبر. وثفل البول هو الذي يستفصله العروق عن الغذاء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يوسّع دلالة الثُّفْل لتشمل الرواسب في سياقات طبية وعلمية متنوعة"
        - text: "«أثْفَلَ الشَّرابُ: صارَ فيه ثُفْلٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يثبت استعمال المادة في سياق الأشربة تحديداً"

    - lemma: "عَكَر"
      confirm:
        - text: "«العَكَرُ: رديء النبيذ والزّيت. يقال: عكّرته تعكيراً»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«والعَكَرُ: دُرْدِيُّ الزيت وغيره. وقد عَكِرَتِ المِسْرَجَةُ بالكسر، تَعْكَرُ عَكَراً، إذا اجتمع فيها الدُرْدِيُّ. وعكر الشراب والماء والدهن: آخره وخاثره»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«العَكَر: التربة والراسب من كل شيء»"
          source: "المعجم الوسيط"
      expands:
        - text: "«وإنْ صُبَّ الْعَكَرُ فَلَيْسَ بِنَبِيذٍ حَتَّى يَتَغَيَّر»"
          source: "المغرب في ترتيب المعرب للمُطَرِّزي"
          addition: "يثبت استعمال عَكَر في سياق النبيذ تحديداً"

    - lemma: "دُرْدِيّ"
      confirm:
        - text: "«الدردي: ما رسب أسفل العسل والزيت ونحوهما من كل شيء مائع كالأشربة والأدهان والخميرة تترك على العصير ليتخمَّر»"
          source: "المعجم الوسيط"
        - text: "«دُرْدِيُّ الزَّيْتِ وغَيْرِه: ما يَبْقَى فى أسْفَل وِعائِه. الرُّوبَةُ؛ وقيل: أراد به الخَمِيرةَ التى تُتْرَكُ على العَصِيرِ والنَّبِيذِ»"
          source: "المعجم الكبير"
        - text: "«ما يَرْكُدُ في أَسْفَلِ كُلِّ مائِعٍ, كالأَشْرِبَةِ والأدْهانِ»"
          source: "المعجم الكبير"
      expands:
        - text: "«وفي حديث الباقر: أَتَجْعَلُونَ فِي النَّبِيذ الدردي؟ قيل وما الدردي؟ قال: الروبة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يثبت استعمال الدُّرْدِيّ في سياق النبيذ تحديداً مع ربطه بالروبة (الخميرة)"

    - lemma: "ثُفْل"
      confirm:
        - text: "«الثُّفْلُ: ما سَفَلَ من كل شئ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«ثُفْلُ كلِّ شيء وثافِلُه: ما استقرَّ تحته من كَدَره»"
          source: "لسان العرب لابن منظور"
        - text: "«ثُفْل؛ عُكارة؛ رواسب»"
          source: "المورد الحديث (2008) — ترجمة lees"
      expands:
        - text: "«الثُّفْلُ مثلُ قُفْلٍ حُثَالَةُ الشيءِ وهو الثَّخِينُ الذي يَبْقَى أسْفَلَ الصَّافِي»"
          source: "المصباح المنير للفيّومي"
          addition: "يربط الثُّفْل بالحُثالة ويوضح أنه الجزء الثخين المترسب"

    - lemma: "حُثَالَة"
      confirm:
        - text: "«الحُثَالَةُ: الرَّديءُ من كُلِّ شىء. الطِّيبِ والدُّهْنِ وما أَشْبَهَهُما: ثُفْلُه»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الحثالة: الرَّدِيء من كل شَيْء والنفاية من الْحبّ وَالتَّمْر وَنَحْوهمَا وَمن النَّاس رذالهم وشرارهم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الدلالة الأولى للحُثالة هي الرديء والنُّفاية بشكل عام، وليست مخصوصة برواسب التخمير"

    - lemma: "عَكَر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "ثُفْلُ الخَمْرِ"
      decision: confirmed
      decision_reason: "مركب إضافي صحيح يخصّص الثُّفْل العام بالخمر، وهو تعبير مسكوك مبني على نمط إضافي عربي منتج (ثُفْل القِدر، ثُفْل الدواء). يناسب المفهوم المقصود تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يخصّص الرواسب بنوع المشروب (الخمر) ويحمل دلالة تركيبية وصفية مباشرة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثُفْلُ الخَمْرِ"

    - lemma: "عَكَر"
      decision: confirmed
      decision_reason: "لفظ فصيح ثابت في المعاجم الكلاسيكية بمعنى دُرْدِيّ الشراب والزيت. نصّ الجوهري صريح في ربطه بالنبيذ. وإن كان عاماً فهو يصلح للدلالة على رواسب أي سائل بما فيها المشروبات المخمَّرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ عام يدل على الراسب والدُّرْدِيّ من أي سائل، ويشمل الزيت والشراب والماء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَكَر"

    - lemma: "دُرْدِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "أدق الألفاظ العربية لرواسب التخمير. المعجم الوسيط ينصّ صراحة على أنه ما يرسب أسفل الأشربة والأدهان، ويذكر الخميرة التي تُترك على العصير ليتخمَّر. حديث الباقر يربطه بالنبيذ تحديداً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مخصوص بما يرسب في أسفل المائعات كالأشربة والأدهان، وله صلة مباشرة بالتخمير والخميرة"
      actions:
        - command: create_entry
          params: {lemma: "دُرْدِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "ثُفْل"
      source: stage1
      decision: removed
      decision_reason: "الثُّفْل بمفرده عام جداً يشمل رواسب كل شيء (القِدر، الدواء، الحبّ)، ووجود «ثُفْل الخمر» المقيَّد يغني عنه. إضافته ستُحدث تكراراً دون فائدة دلالية."

    - lemma: "عَكَر"
      source: stage1
      decision: removed
      decision_reason: "مرشح مكرر — اللمّة «عَكَر» موجودة أصلاً في المجموعة."

    - lemma: "حُثَالَة"
      source: stage1
      decision: removed
      decision_reason: "دلالتها الأولى هي الرديء والنُّفاية من كل شيء (حبّ، تمر، ناس)، وارتباطها بالرواسب السائلة ثانوي. لا تختص برواسب التخمير بل تدل على الردء بعموم."

