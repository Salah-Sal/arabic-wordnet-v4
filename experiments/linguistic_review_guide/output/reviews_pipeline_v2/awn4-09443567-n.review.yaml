# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-09443567-n (salt lick)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «لعقة ملح» مركب إضافي يبدو ترجمة حرفية (calque) لمصطلح salt lick الإنجليزي، ولم يُعثر عليه مداخلَ معجمية عربية مستقلة"
      - "اللمّة «مَلّاحة» تدل في المعاجم على مكان تكوُّن الملح أو بيعه (salina/salt flat)، وليس تحديداً على ترسّب ملحي تلعقه الحيوانات"
      - "لا تشكيل على اللمّتين الموجودتين؛ يجب إضافة تشكيل كامل"
    observations: "المفهوم المستهدف هو ترسُّب ملحي طبيعي تقصده الحيوانات البرية والماشية لتلعقه بانتظام تلبيةً لحاجتها من المعادن. يقع في حقل الجغرافيا الطبيعية وعلم البيئة. المورد الحديث (2008) يترجم salt lick بـ«المَلْحَة: موطن تلعقه الحيوانات لِما فيه من ملح»، مما يشير إلى وجود لفظ عربي دقيق غير مستثمَر في الشبكة. المصطلحان الموجودان أحدهما مركب ترجمي والآخر أعمّ دلالةً من المطلوب."

  blind_candidates:
    - lemma: "مَمْلَحَة"
      generation_method: ishtiqaq
      justification: "من جذر م-ل-ح على وزن مَفْعَلَة (اسم مكان)، للدلالة على موضع الملح الطبيعي"
    - lemma: "مَلْحَة"
      generation_method: ishtiqaq
      justification: "من جذر م-ل-ح على وزن فَعْلَة (اسم مرة/هيئة)، للدلالة على بُقعة ملحية محددة تقصدها الحيوانات"
    - lemma: "لَعُوق"
      generation_method: ishtiqaq
      justification: "من جذر ل-ع-ق على وزن فَعُول بمعنى المفعول (ما يُلعق)، للدلالة على كل ما يُلعق كالدواء والعسل والملح"
    - lemma: "سَبَخَة مِلْحِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من سَبَخَة (أرض مالحة) + مِلْحِيَّة (نسبة إلى الملح)، للدلالة على أرض ملحية تتردد عليها الحيوانات"


stage2_evidence:
  per_lemma:
    - lemma: "لَعْقَةُ مِلْحٍ"
      expands:
        - text: "«في الأرض لَعْقَةٌ من ربيع: قليلٌ من الرُّطْب»"
          source: "المعجم الوسيط"
          addition: "لَعْقَة تُستعمل للدلالة على المقدار اليسير مما يُلعق من الأرض، مما يدعم استخدامها بمعنى بقعة تُلعق"
        - text: "«الشيء القليل بقدر ما تأخذه الملعقة أو الإصبع»"
          source: "المعجم الوسيط"
          addition: "اللُّعْقَة (بالضم) هي المقدار الملعوق، وليست البقعة نفسها"
        - text: "«المَلْحة: .أ» موطن [كينبوع ماء إلخ] تلعقه الحيوانات لِما فيه من ملح. .ب» مستحضر مَلِحٌ يقدّم إلى الماشية كي تلعقَهُ.»"
          source: "المورد الحديث (2008)"
          addition: "المورد يترجم salt lick بالمَلْحَة لا بـ«لعقة ملح»، مما يشير إلى أن المركب غير معتمد معجمياً"

    - lemma: "مَلَّاحَة"
      confirm:
        - text: "«مكان تكوُّن الملح أو بيعه»"
          source: "المعجم الوسيط"
        - text: "«منجم الملح أو المكان المعد لصنع الملح»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      contradicts:
        - text: "«حِرْفَة المَلَّاح»"
          source: "المعجم الوسيط"
          conflict: "المِلاحة (بكسر الميم) = حرفة المَلّاح (navigation)، وهي مُشترك لفظي مع المَلّاحة (بفتح الميم وتشديد اللام)"
        - text: "«آلة تستعمل لتفريش الملح»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "في مجال النقل مَلّاحة = salt spreader، وهي آلة لا ترسّب طبيعي"
      expands:
        - text: "«سبخة — ملاحة»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
          addition: "السبخة تُرادف الملّاحة في سياق salina، مما يؤكد أن المَلّاحة = مكان تكوُّن الملح طبيعياً"

    - lemma: "مَمْلَحَة"
      contradicts:
        - text: "«ما يُجعَل فيه المِلْحُ»"
          source: "المعجم الوسيط"
          conflict: "المِمْلَحَة = وعاء الملح (salt cellar)، وليست ترسّباً طبيعياً"

    - lemma: "مَلْحَة"
      confirm:
        - text: "«المَلْحة: .أ» موطن [كينبوع ماء إلخ] تلعقه الحيوانات لِما فيه من ملح. .ب» مستحضر مَلِحٌ يقدّم إلى الماشية كي تلعقَهُ.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الزُّرقة الشديدة البركة الكلمة المليحة»"
          source: "المعجم الوسيط"
          addition: "المُلْحَة (بضم الميم) = النكتة/البركة، وهي مختلفة عن المَلْحَة (بفتح الميم) التي تدل على موطن الملح"
        - text: "«أصبْنَا مُلْحَة من الرّبيع شيئاً يسيراً منه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "المُلْحَة بالضم تدل أيضاً على الشيء اليسير من المطر، وليست هي المقصودة هنا"

    - lemma: "لَعُوق"
      contradicts:
        - text: "«كلُّ ما يُلعق كالدَّواء والعسل وغيرهما»"
          source: "المعجم الوسيط"
          conflict: "اللَّعُوق عامّ الدلالة يشمل كل ما يُلعق من دواء وعسل وغيرهما، وليس مخصوصاً بالترسّب الملحي"
        - text: "«أقَلُّ الزاد. يقال: ما معنا إلاّ لَعْوَقٌ: شىء يسير»"
          source: "المعجم الوسيط"
          conflict: "دلالة ثانوية على القلة والزاد اليسير، بعيدة عن المفهوم المستهدف"

    - lemma: "سَبَخَة مِلْحِيَّة"
      contradicts:
        - text: "«منخفضات تحتوي على مياه مالحة بعد هطول الأمطار، ولكنها جافة في الصيف ويكون سطحها مكسوا بالأملاح»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          conflict: "السبخة تكوين جيومورفولوجي واسع (salt flat/playa)، وليست ترسباً ملحياً محدداً تلعقه الحيوانات"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "لَعْقَةُ مِلْحٍ"
      decision: confirmed
      decision_reason: "مركب إضافي شفاف الدلالة يُفهم من مكوّناته مباشرةً. وإن كان ترجمةً حرفية لـ salt lick، فإن مفهوم اللَّعْقة من الأرض مؤصَّل في العربية (المعجم الوسيط: «في الأرض لعقة من ربيع»). يُبقى عليه لتغطية السياقات التي يشيع فيها هذا التعبير الوصفي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير وصفي شفاف يركّز على فعل اللعق والمادة الملحية، يُستخدم في السياقات التوضيحية والعامة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَعْقَةُ مِلْحٍ"

    - lemma: "مَلَّاحَة"
      decision: confirmed
      decision_reason: "مَلَّاحَة مثبتة في المعجم الوسيط بمعنى «مكان تكوُّن الملح» وفي معجم الجيولوجيا بمعنى salina. الترسّب الملحي الذي تلعقه الحيوانات يتكوّن طبيعياً في هذه المواطن، فالعلاقة الدلالية وثيقة وإن كانت المَلّاحة أوسع قليلاً. تُبقى مع بيان الفارق."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على مكان تكوُّن الملح الطبيعي عموماً (salina/salt flat)، وتشمل الترسبات الملحية التي تقصدها الحيوانات بوصفها نوعاً من المَلّاحات"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَلَّاحَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَلْحَة"
      source: stage1
      decision: confirmed
      decision_reason: "المورد الحديث (2008) يعرّف المَلْحَة صراحةً بأنها «موطن تلعقه الحيوانات لِما فيه من ملح» و«مستحضر مَلِحٌ يقدّم إلى الماشية كي تلعقه»، وهو تطابق دلالي تامّ مع تعريف المجموعة. اللفظ من جذر م-ل-ح على وزن فَعْلَة، فصيح مشتقّ ومتوافق صرفياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل تحديداً على الموطن أو المستحضر الملحي الذي تلعقه الحيوانات، وهي أدقّ اللمّات مطابقةً لمفهوم salt lick"
      actions:
        - command: create_entry
          params: {lemma: "مَلْحَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَمْلَحَة"
      source: stage1
      decision: removed
      decision_reason: "المعجم الوسيط يعرّف المِمْلَحَة بأنها «ما يُجعَل فيه المِلْحُ» أي وعاء الملح (salt cellar)، وهذا مفهوم مختلف تماماً عن الترسّب الملحي الطبيعي."

    - lemma: "لَعُوق"
      source: stage1
      decision: removed
      decision_reason: "اللَّعُوق في المعاجم يعني «كل ما يُلعق كالدواء والعسل وغيرهما» وهو عام الدلالة لا يختص بالترسّب الملحي. كما يدل على «أقل الزاد» وعلى «القليل العقل»، فتعدّد دلالاته يجعله غير مناسب مصطلحاً محدداً."

    - lemma: "سَبَخَة مِلْحِيَّة"
      source: stage1
      decision: removed
      decision_reason: "السبخة تكوين جيومورفولوجي واسع (salt flat/playa) يختلف عن الترسب الملحي المحدد الذي تلعقه الحيوانات. إضافة «ملحية» حشو لأن السبخة ملحية بطبيعتها. والمركب ليس مصطلحاً ثابتاً."


