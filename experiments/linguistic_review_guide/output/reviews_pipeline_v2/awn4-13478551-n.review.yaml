# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13478551-n
# decline, diminution — تغير نحو شيء أصغر أو أقل
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "انحدار دلالتها الأصلية مكانية (الهبوط من عُلوّ إلى سُفل)، واستعمالها بمعنى التراجع الكمي توسّع حديث"
      - "تدهور في اللغة الكلاسيكية تعني السقوط المادي، والمعنى المجرد (سوء الحال) محدث كما نصّ المعجم الكبير"
      - "اللمّات الثلاث بلا تشكيل — يلزم ضبطها ضبطاً كاملاً"
    observations: >
      المجموعة تضمّ ثلاث لمّات مصدرية من جذور مختلفة تشترك في دلالة النقص والتراجع،
      لكن كلاً منها تحمل ظلالاً دلالية مميّزة: انحدار تركّز على الاتجاه (من أعلى إلى أسفل)،
      وتدهور تركّز على فساد الحال وسوئها، وتضاؤل تركّز على النقص الكمي والصغر.
      التعريف الحالي «تغير نحو شيء أصغر أو أقل» أقرب لدلالة تضاؤل منه لدلالة انحدار أو تدهور.
      يُفتقد مصطلح شائع مثل «تراجع» الذي يغطّي دلالة decline في السياق الاقتصادي والاجتماعي.
  blind_candidates:
    - lemma: "تَقَلُّص"
      generation_method: ishtiqaq
      justification: "مصدر تَقَلَّصَ من الجذر ق ل ص على وزن تَفَعُّل، يدلّ على انضمام الشيء وانكماشه. قال ابن فارس: «أصل صحيح يدلّ على انضمام شيء بعضه إلى بعض»"
    - lemma: "ضُمُور"
      generation_method: ishtiqaq
      justification: "مصدر ضَمَرَ من الجذر ض م ر على وزن فُعُول، يدلّ على النقص والهزال. قال ابن فارس: «يدلّ على دقّة في الشيء»"
    - lemma: "اضْمِحْلَال"
      generation_method: ishtiqaq
      justification: "مصدر اضمحلّ من الجذر ض م ح ل على وزن افعِلال، يدلّ على الزوال والتلاشي التدريجي"
    - lemma: "تَرَاجُع"
      generation_method: ishtiqaq
      justification: "مصدر تراجَعَ من الجذر ر ج ع على وزن تَفَاعُل، يدلّ على العَود والنكوص. ورد في المعجم الكبير: «معدّل التنمية نقص عمّا كان مقدّراً له» وهو مطابق لدلالة decline"


stage2_evidence:
  per_lemma:
    - lemma: "اِنْحِدَار"
      confirm:
        - text: "«سطح مائل في تل أو جبل»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
        - text: "«(انحدر) انحطّ من علوّ إلى سفل»"
          source: "المعجم الوسيط (هوراماني)"
      expands:
        - text: "«هو شكل الحركة أو السير عند انخفاض معدّل الاحتكاك»"
          source: "مسرد هندسة وتكنولوجيا السيارات"
          addition: "استعمال تقني بمعنى الانزلاق لا النقص"
        - text: "«الحاء والدال والراء أصلان: الهبوط، والامتلاء. فالأوّل حدرتُ الشيء إذا أنزلته»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يدلّ على الهبوط المكاني لا النقص الكمي"
      contradicts:
        - text: "«انظر: تحليل الانحدار — Regression»"
          source: "معجم البيانات والذكاء الاصطناعي"
          conflict: "في الإحصاء انحدار مصطلح تقني لا يعني decline"

    - lemma: "تَدَهْوُر"
      confirm:
        - text: "«الشيء سقط من أعلى إلى أسفل»"
          source: "المعجم الوسيط"
        - text: "«صحّة فلان: ساءت. (محدثة). الأمور أو العلاقات: تأزّمت. (محدثة)»"
          source: "المعجم الكبير"
        - text: "«انخفاض تدريجي في فعالية بعض المواد بمضيّ الزمن»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
      expands:
        - text: "«الدال والهاء والراء أصل واحد، وهو الغلبة والقهر. والدهورة جمع الشيء وقذفه في مهواة»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدلّ على القهر والسقوط في هاوية، فالتدهور تحوّل مجازي من السقوط المادي إلى فساد الحال"

    - lemma: "تَضَاؤُل"
      confirm:
        - text: "«(تضاءل) ضؤل وتقبّض وانضمّ بعضه إلى بعض وأخفى شخصه وتصاغر»"
          source: "المعجم الوسيط (هوراماني)"
        - text: "«الضاد والهمزة واللام أُصَيل يدلّ على ضعف ودقّة في جسم. الضئيل: الضعيف»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«نقص مستمر في مدى تذبذب موجات الطاقة المختلفة مثل الكهرباء والصوت — damping»"
          source: "معجم المصطلحات الطبية"
          addition: "استعمال تقني فيزيائي بمعنى التخامد"

    - lemma: "تَقَلُّص"
      contradicts:
        - text: "«contraction — تقلّص»"
          source: "المعجم الموحد لمصطلحات الفيزياء"
          conflict: "تقلّص مستقرّ في المعاجم التقنية بمعنى الانقباض/الانكماش الفيزيائي (contraction/shrinkage) لا بمعنى decline"
      expands:
        - text: "«القاف واللام والصاد أصل صحيح يدلّ على انضمام شيء بعضه إلى بعض. وظلّ قالص إذا نقص»"
          source: "مقاييس اللغة لابن فارس"
          addition: "رغم وجود دلالة النقص في الجذر، إلا أنّ الاستعمال المعجمي استقرّ على الانكماش المادي"

    - lemma: "ضُمُور"
      contradicts:
        - text: "«(في الطب) Atrophy: نقص في حجم العضو أو النسيج»"
          source: "المعجم الكبير"
          conflict: "ضمور مصطلح طبي مستقرّ بمعنى atrophy، تخصيصه يبعده عن دلالة decline العامة"
      confirm:
        - text: "«الهزال وقلّة اللحم وخفّته»"
          source: "المعجم الكبير"

    - lemma: "اضْمِحْلَال"
      expands:
        - text: "«تناقص في مطال الإشارة مع الزمن — decay»"
          source: "معجم مصطلحات المعلوماتية"
          addition: "استعمال تقني بمعنى التلاشي الكامل (decay) لا مجرد النقص"

    - lemma: "تَرَاجُع"
      confirm:
        - text: "«مُعَدَّلُ التَّنْمِيَةِ: نَقَص عمّا كان مُقَدَّرًا له»"
          source: "المعجم الكبير"
        - text: "«إلى الوراء: انسحب وتقهقر»"
          source: "المعجم الكبير"
        - text: "«أحوالُ فلانٍ: عادت إلى ما كانت عليه»"
          source: "المعجم الكبير"
      expands:
        - text: "«الراء والجيم والعين أصل كبير مطّرد منقاس، يدلّ على ردّ وتكرار»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدلّ على الرجوع والعَود، والتراجع على وزن تفاعل يفيد التدرّج"


stage3_analysis:
  per_lemma:
    - lemma: "اِنْحِدَار"
      decision: confirmed
      decision_reason: >
        رغم أنّ الدلالة الأصلية مكانية (الهبوط من عُلو)، إلا أنّ الاستعمال المعاصر رسّخ
        انحدار بمعنى التراجع التدريجي (decline)، وهو شائع في الخطاب الإعلامي والاقتصادي.
        يتميّز عن أخويه بكونه يركّز على الاتجاه النزولي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الاتجاه التنازلي المستمرّ (downward trend)، ويُستعمل كثيراً مع المؤشرات والمنحنيات"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْحِدَار"

    - lemma: "تَدَهْوُر"
      decision: confirmed
      decision_reason: >
        نصّ المعجم الكبير على أنّ استعمال تدهور بمعنى سوء الحال محدث لكنه مقبول ومستقرّ.
        وهو أكثر اللمّات شيوعاً في الاستعمال المعاصر بمعنى deterioration/decline،
        خاصّة في السياقات الاقتصادية والصحية والسياسية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على فساد الحال وسوئها نوعياً (deterioration)، ويحمل ظلّ السقوط من حال حسنة إلى سيئة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَدَهْوُر"

    - lemma: "تَضَاؤُل"
      decision: confirmed
      decision_reason: >
        تضاؤل من جذر ض أ ل الدالّ على الصغر والضعف، وهو أدقّ اللمّات مطابقةً للتعريف
        «تغيّر نحو شيء أصغر أو أقلّ». نصّ المعجم الوسيط: «ضؤل وتقبّض وتصاغر».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على النقص الكمّي والتصاغر (diminution)، وهو أكثر اللمّات حيادية ودقّة في وصف النقص التدريجي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَضَاؤُل"

    - lemma: "تَقَلُّص"
      source: stage1
      decision: removed
      decision_reason: >
        تقلّص مستقرّ في المعاجم التقنية بمعنى الانكماش/الانقباض المادي (contraction/shrinkage)،
        لا بمعنى التراجع أو النقص المجرد (decline). تخصيصه المصطلحي يبعده عن هذه المجموعة.

    - lemma: "ضُمُور"
      source: stage1
      decision: removed
      decision_reason: >
        ضمور مصطلح طبي مستقرّ بمعنى atrophy (نقص حجم العضو أو النسيج)،
        تخصيصه الطبي يجعله غير ملائم لدلالة decline/diminution العامة.

    - lemma: "اضْمِحْلَال"
      source: stage1
      decision: removed
      decision_reason: >
        اضمحلال يدلّ على الزوال والتلاشي الكامل (decay/vanishing)، وهو أقوى من مجرّد
        النقص أو التراجع. المجموعة تصف تغيّراً نحو الأقلّ لا تلاشياً كلياً.

    - lemma: "تَرَاجُع"
      source: stage1
      decision: confirmed
      decision_reason: >
        تراجع ورد في المعجم الكبير بمعنى «نقص عمّا كان مقدّراً له» (عن معدّل التنمية)
        و«انسحب وتقهقر»، وهو شائع جداً في الاستعمال المعاصر بمعنى decline في
        السياقات الاقتصادية والاجتماعية. يسدّ ثغرة دلالية في المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على العَود إلى الوراء والنكوص عن مستوى سابق (regression/setback)، ويُستعمل في السياقات الاقتصادية والعسكرية"
      actions:
        - command: create_entry
          params:
            lemma: "تَرَاجُع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


