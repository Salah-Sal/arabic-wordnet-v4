# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14932834-n (humectant)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (حافظ للرطوبة، مادة مرطبة) عبارتان وصفيتان حرّتان وليستا مصطلحَيْن معجميَّيْن مسكوكَيْن"
      - "لا تشكيل على اللمّات الموجودة"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي"
    observations: "المفهوم يدلّ على مادة كيميائية تُضاف لمادة أخرى لحفظ رطوبتها، وهو مصطلح تقني يُستخدم في الكيمياء والصيدلة ومستحضرات التجميل. المفهوم فوقيّ (hypernym) هو المادة المتجانسة. ينبغي البحث عن مصطلح مشتق من جذر رطب على وزن يناسب الوظيفة الدلالية (اسم فاعل أو اسم آلة)."
  blind_candidates:
    - lemma: "مُرَطِّب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رَطَّبَ (فعّل) على وزن مُفَعِّل، يدلّ على الفاعل الذي يُحدِث الترطيب، وهو وزن منتج في العربية للدلالة على الأداة أو المادة الفاعلة"
    - lemma: "مُسْتَرْطِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استرطب (استفعل) على وزن مُسْتَفْعِل، يدلّ على ما يطلب الرطوبة ويجذبها"
    - lemma: "عَامِلُ تَرْطِيب"
      generation_method: tarkib
      justification: "مركب إضافي من عامل + ترطيب، يدلّ على العنصر الفعّال في عملية الترطيب"
    - lemma: "مَادَّةٌ مُرَطِّبَة"
      generation_method: tarkib
      justification: "مركب وصفي من مادة + مرطبة، يصف المادة التي تقوم بفعل الترطيب"

# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "حافظ للرطوبة"
      evidence_status: "no_material_found"

    - lemma: "مادة مرطبة"
      evidence_status: "no_material_found"

    - lemma: "مُرَطِّب"
      confirm:
        - text: "«مُرَطِّب — humectant»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«يُرطب - مُرطب — humectant — مادة تلين وتخفف من التركيز»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
      expands:
        - text: "«مُرَطِّب — humidifier — جهاز يُزيد من الرطوبة في غرفة ما»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "اللفظ مشترك بين دلالة المادة المُرطِّبة (humectant) ودلالة الجهاز المُرطِّب (humidifier)"
        - text: "«مُرَطِّب — humidifier»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "مدخل ثانٍ بدلالة الجهاز لا المادة"
        - text: "«مُرَطِّب — humidifier»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يؤكد الاشتراك اللفظي بين المادة والجهاز"

    - lemma: "مُسْتَرْطِب"
      contradicts:
        - text: "«مُسْتَرْطِب — hygroscopic — له خاصية امتصاص الرطوبة من الجو»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          conflict: "المسترطب يعني ما يمتص الرطوبة (hygroscopic) لا ما يُضاف لحفظها (humectant)"
        - text: "«مُسْتَرْطِب — hygroscopic»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "مصطلح ثابت بدلالة hygroscopic في مجال الصيدلة"
        - text: "«مُسْتَرْطِب — hydrophilic»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "دلالة إضافية على المحبّ للماء لا الحافظ للرطوبة"
        - text: "«مسترطب — ماص للرطوبة»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2"
          conflict: "يؤكد أن المسترطب = ماصّ للرطوبة وليس حافظاً لها"

    - lemma: "عَامِلُ تَرْطِيب"
      contradicts:
        - text: "«عامل ترطيب — wetting agent»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1: طباعة - كهرباء (1996)"
          conflict: "عامل الترطيب مصطلح ثابت بدلالة wetting agent لا humectant"
        - text: "«عامل الترطيب — wetting agent; surface-active agent»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "يؤكد الدلالة على عامل التبليل السطحي لا المادة الحافظة للرطوبة"

    - lemma: "مَادَّةٌ مُرَطِّبَة"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة: حافظ للرطوبة ──
    - lemma: "حافظ للرطوبة"
      decision: removed
      decision_reason: "عبارة وصفية حرّة وليست مصطلحاً معجمياً مسكوكاً. تفشل في اختبار السكّ: يمكن إبدال (حافظ) بـ(مُبقٍ) أو (صائن) والعبارة تظل صالحة كوصف. لم تُسجَّل في أي معجم مصطلحي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة: مادة مرطبة ──
    - lemma: "مادة مرطبة"
      decision: removed
      decision_reason: "عبارة وصفية حرّة تفشل في اختبار السكّ: يمكن استبدال (مادة) بـ(مركّب) أو (محلول) وتبقى وصفاً صالحاً. لم تُسجَّل كوحدة معجمية ثابتة في أي من المعاجم المصطلحية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: مُرَطِّب ──
    - lemma: "مُرَطِّب"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مشتق على وزن مُفَعِّل من الجذر رطب، مثبت في المعجم الطبي الموحد (2009) بدلالة humectant مباشرة، وفي معجم المصطلحات الطبية (1997) بتعريف «مادة تلين وتخفف من التركيز». يتمتع بالاشتقاقية ويُسر التداول. ملاحظة: اللفظ مشترك مع دلالة humidifier (الجهاز) لكن السياق يُزيل اللبس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مفرد مشتق على وزن اسم الفاعل من الفعل المزيد (رطَّب)، يدلّ على المادة أو الجهاز الذي يُحدث الترطيب. في سياق المجموعة يختصّ بالمادة الكيميائية."
      actions:
        - command: create_entry
          params:
            lemma: "مُرَطِّب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: مُسْتَرْطِب ──
    - lemma: "مُسْتَرْطِب"
      source: stage1
      decision: removed
      decision_reason: "المصطلح ثابت في المعاجم المصطلحية بدلالة hygroscopic (ماصّ للرطوبة من الجو) وhydrophilic (محبّ للماء)، وكلاهما مفهوم مختلف عن humectant (مادة تُضاف لحفظ الرطوبة). لا يصحّ استخدامه هنا لتجنّب الخلط الاصطلاحي."
      evidence_assessment:
        case: contradicts_only

    # ── مرشح المرحلة ١: عَامِلُ تَرْطِيب ──
    - lemma: "عَامِلُ تَرْطِيب"
      source: stage1
      decision: removed
      decision_reason: "المصطلح ثابت في معاجم الفيزياء والطباعة والمياه بدلالة wetting agent (عامل التبليل السطحي)، وهو مفهوم كيميائي فيزيائي مختلف عن humectant. استخدامه هنا يُحدث تداخلاً اصطلاحياً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١: مَادَّةٌ مُرَطِّبَة ──
    - lemma: "مَادَّةٌ مُرَطِّبَة"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة تفشل في اختبار السكّ (يمكن إبدال مادّة بمركّب أو محلول). لم تُسجَّل كوحدة معجمية ثابتة. الأولى الاكتفاء بالمصطلح المفرد مُرَطِّب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "أي مادة تضاف إلى مادة أخرى للحفاظ على رطوبتها"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية للإنجليزي، ويحتاج إلى صياغة معجمية عربية أصيلة بأسلوب الجنس القريب والفصل النوعي، مع إضافة تعريف موسوعي يوضّح آلية العمل."
    authored:
      - type: terminological
        text: "مادَّةٌ كِيمْيائِيَّةٌ تُضافُ إلى مُسْتَحْضَرٍ أو مُنْتَجٍ لِتَحْفَظَ رُطوبَتَهُ وتَمْنَعَ جَفافَهُ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مادَّةٌ كِيمْيائِيَّةٌ اسْتِرْطابِيَّةٌ تَعْمَلُ عَلى جَذْبِ جُزَيْئاتِ الماءِ مِنَ البِيئَةِ المُحيطَةِ والاحْتِفاظِ بِها، فتُبْقي المُنْتَجَ رَطْباً ولَيِّناً. تُسْتَخْدَمُ في مُسْتَحْضَراتِ التَّجْمِيلِ والأَغْذِيَةِ والأَدْوِيَة، ومِنْ أَشْهَرِها الغْلِيسِرين وحَمْضُ الهيالورونيك"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادَّةٌ كِيمْيائِيَّةٌ تُضافُ إلى مُسْتَحْضَرٍ أو مُنْتَجٍ لِتَحْفَظَ رُطوبَتَهُ وتَمْنَعَ جَفافَهُ"

  examples:
    per_lemma:
      - lemma: "مُرَطِّب"
        examples:
          - text: "يُعَدُّ الغْلِيسِرينُ من أكثرِ المُرَطِّباتِ شُيوعاً في صِناعَةِ مُسْتَحْضَراتِ العِنايَةِ بالبَشَرة"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ الغْلِيسِرينُ من أكثرِ المُرَطِّباتِ شُيوعاً في صِناعَةِ مُسْتَحْضَراتِ العِنايَةِ بالبَشَرة"

# ── المرحلة ٥: الإثراء ──────────────────────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "مُرَطِّب"
      entry_id: "{auto}"
      root: "رطب"
      maqayis_quote: "«الرَّاءُ وَالطَّاءُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الْيُبْسِ. مِنْ ذَلِكَ الرَّطْبُ وَالرَّطِيبُ.»"

  per_sense:
    - lemma: "مُرَطِّب"
      sense_id: "{auto}"
      nuance: "مصطلح مفرد مشتق من رطَّب (باب التفعيل)، يدلّ تحديداً على المادة الكيميائية التي تحفظ الرطوبة في المنتجات. قد يشترك لفظياً مع دلالة الجهاز المُرطِّب (humidifier) لكن السياق يُميّز."

  synset:
    cultural_fit: lexical_gap

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"رطب","maqayis":"«الرَّاءُ وَالطَّاءُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الْيُبْسِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح مفرد مشتق من رطَّب، يدلّ على المادة الكيميائية الحافظة للرطوبة"}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"lexical_gap"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.85
