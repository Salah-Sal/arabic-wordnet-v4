# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14713654-n — peat / خث
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بيتموس» نقحرة خام للإنجليزية peat moss وليست مصطلحاً عربياً معتمداً، ولا ترد في أيّ معجم عربي"
      - "«بيتموس» تشير في الإنجليزية إلى طحلب الإسفغنون (sphagnum) لا إلى الخُثّ نفسه، فهناك خلط مفهومي"
      - "المجموعة تفتقر إلى تنوع المترادفات؛ «خُثّ» وحدها كافية وراسخة"
    observations: "المفهوم (peat) له مقابل عربي أصيل هو «الخُثّ» المشتق من جذر خ ث ث، وقد ورد في المعاجم الكلاسيكية بمعنى غثاء السيل إذا يبس واسودّ، ثم وُظِّف في المعاجم الحديثة مصطلحاً جيولوجياً دقيقاً. المفهوم موجود ثقافياً في البيئة العربية لارتباطه بالسيول والمستنقعات."
  blind_candidates:
    - lemma: "خُثّ"
      generation_method: majaz
      justification: "إزاحة دلالية من المعنى الكلاسيكي «غثاء السيل إذا يبس واسودّ» إلى المادة النباتية المتحللة في المستنقعات؛ الانتقال طبيعي لأن كليهما بقايا نباتية متراكمة مشبعة بالماء ثم تجفّ وتسودّ"
    - lemma: "طُورَب"
      generation_method: taarib
      justification: "تعريب من الفرنسية tourbe، ورد في معجم الكيمياء الموحّد بديلاً عن خثّ؛ يقبل لام التعريف (الطورب) والنسبة (طوربيّ)"
    - lemma: "فَحْم مُسْتَنْقَعِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يصف طبيعة المادة: فحم (جنس) + مستنقعي (فصل مكاني)؛ لكنه وصف حرّ لا مصطلح مسكوك"
    - lemma: "غُثَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من غُثاء (ما يطفو على سطح السيل من بقايا نباتية)؛ محاولة اشتقاقية لكنها غير مسكوكة معجمياً"


stage2_evidence:
  per_lemma:
    - lemma: "بيتموس"
      evidence_status: "no_material_found"

    - lemma: "خُثّ"
      confirm:
        - text: "«غثاء السيل إذا خلَّفه ونضب عنه حتى يجف»"
          source: "المعجم الوسيط"
        - text: "«غُثاءُ السَّيْل, إذا خَلَّفَه ونَضَب عنه حتى يَجِفَّ ويَسْوَدَّ الطُّحْلُبُ إذا يَبِسَ وقَدُمَ عَهْدُه حتى يَسْوادَّ (في الجِيولُوجْيا) peat: مادةٌ ليفِيَّة ذات لَوْنِ بُنَّىّ أو أَسْوَدَ , تَنْتُج من تَحَلُّلِ المادَّة النباتِيَّة في المُسْتَنْقعات, وتَحْتَوى على نِسْبَةٍ مُرْتَفعةٍ من الماء. ويُعدُّ الخَثُّ أوَّلَ مَرْحلةٍ من مراحل التغيُّر من المادَّة العُضْوِيَّة إلى الفَحْم, وهو أردأُ أنواعه لاحتوائِه على نِسبةٍ ضعيفةٍ من الكربون»"
          source: "المعجم الكبير"
        - text: "«الخُثّ: فحم حجريّ لم يكتمل تحوُّله إلى كربون»"
          source: "المورد الحديث"
        - text: "«بقايا نباتية ناقصة التفحم ذات لون أسود أو بني قاتم تتكون في المستنقعات والأمكنة الرطبة»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
        - text: "«تراكُم نباتات مُتحّللة تَحَلُّلاً جُزئيّاً، ويكونُ في شكل نسيج نباتي مُتفحّم جُزئياً، تكوّن بفعل التحلّل الجزئي في مياه نباتات شَتَّى»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«نسيج نباتي نصف مهتم يتكون بتحلل النباتات تحللا جزئيا بالماء»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
      expands:
        - text: "«الخُثُّ، بالضم: غُثاءُ السَّيْلِ إذا خَلَفَه ونَضَبَ عنه، وطُحْلُبٌ يَبِسَ وقَدُمَ عَهْدُه. والخُثَّةُ: البَعْرَةُ اللَّيِّنَةُ، وطينٌ يُعْجَنُ بِبَعَرٍ أو رَوْثٍ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يضيف دلالات فرعية كلاسيكية: الخُثّة (القطعة)، والطحلب اليابس"
        - text: "«الخُثُّ: غثاء السَّيْل إِذا خَلفه ونضب عَنهُ حَتَّى يجِف، وَكَذَلِكَ الطحلب إِذا يبس وَقدم عَهده حَتَّى يسود. والخُثَّةُ: طين يعجن ببعر أَو رَوْث»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "يؤكد المعنى الكلاسيكي ويضيف الطحلب اليابس الأسود"
        - text: "«(خَثَّ) الْخَاءُ وَالثَّاءُ لَيْسَ أَصْلًا وَلَا فَرْعًا صَحِيحًا يُعَرَّجُ عَلَيْهِ، وَلَكُنَّا نَذْكُرُ مَا يَذْكُرُونَهُ. يَقُولُونَ: الْخُثُّ مَا أُوخِفَ مِنْ أَخْثَاءِ الْبَقْرِ وَطُلِيَ بِهِ شَيْءٌ، وَلَيْسَ هَذَا بِشَيْءٍ، وَيُقَالُ الْخُثُّ: غُثَاءُ السَّيْلِ إِذَا تَرَكَهُ السَّيْلُ فَيَبِسَ وَاسْوَدَّ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يشكّك في أصالة الجذر لكنه يوثّق المعنى"

    - lemma: "طُورَب"
      confirm:
        - text: "«خث، طورب (ال...): نسيج نباتي نصف مهتم يتكون بتحلل النباتات تحللا جزئيا بالماء»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
      expands:
        - text: "«مخثة: أرض يكثر فيها الخث أو الطورب»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          addition: "يُستخدم الطورب بديلاً عن الخثّ في بعض المعاجم العلمية"

    - lemma: "فَحْم مُسْتَنْقَعِيّ"
      evidence_status: "no_material_found"

    - lemma: "غُثَائِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خُثّ"
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل مشتق من جذر خ ث ث، ورد في المعاجم الكلاسيكية (القاموس المحيط، المحكم، المعجم الوسيط) بمعنى غثاء السيل اليابس الأسود، ثم اعتمدته المعاجم الموحّدة الحديثة (الجيولوجيا، الكيمياء، الطاقة المتجددة، الأحياء) مقابلاً دقيقاً لـ peat. أدلة تأكيدية قوية من أكثر من عشرة مصادر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الفصيح المعتمد في المعاجم الموحّدة والمعاجم الكلاسيكية؛ هو الاختيار الأول في السياقات العلمية والأدبية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُثّ"

    - lemma: "بيتموس"
      decision: removed
      decision_reason: "نقحرة خام من الإنجليزية peat moss لا ترد في أيّ معجم عربي؛ وpeat moss تعني في الأصل طحلب الإسفغنون (نبات) لا الخُثّ (مادة)، فهناك خلط مفهومي. المقابل العربي المعتمد لـ peat هو «خُثّ» لا «بيتموس»."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "طُورَب"
      source: stage1
      decision: removed
      decision_reason: "ورد بديلاً في معجم الكيمياء الموحّد فقط، لكنه تعريب من الفرنسية tourbe غير شائع ولا مستقل؛ يُذكَر دائماً مقروناً بـ«خثّ» ولم يُفرَد بمدخل مستقل في أيّ معجم. إضافته لا تُثري المجموعة بل تُرهقها بمترادف غير متداول."
      evidence_assessment:
        case: mixed

    - lemma: "فَحْم مُسْتَنْقَعِيّ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة لا مصطلح مسكوك؛ لا أدلة معجمية عليها، ويمكن استبدال «مستنقعي» بـ«مائي» أو «رطب» مع بقاء الوصف صالحاً — فشل اختبار السكّ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "غُثَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصدر صناعي مولّد غير مسكوك ولا مسجّل في أيّ معجم؛ وجود «خُثّ» الأصيل يغني عنه تماماً."
      evidence_assessment:
        case: no_material


