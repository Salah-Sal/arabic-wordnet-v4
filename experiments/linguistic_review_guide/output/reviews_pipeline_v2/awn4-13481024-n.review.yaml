# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13481024-n (deflation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دوريّ: يستخدم «انكماش» لتعريف مجموعة تحوي «انكماش» كلمّة"
      - "التعريف يصف الانكماش بأنه «انكماش النشاط الاقتصادي» وهو تكرار لفظي لا تعريفي"
      - "لمّة «انكماش اقتصادي» مركّب وصفي غير مسجّل كوحدة معجمية مستقلة في المعاجم الاصطلاحية"
    observations: >
      المفهوم المقصود هو الانكماش النقدي (deflation) أي انخفاض المستوى العامّ للأسعار الناتج عن نقص
      حجم النقد المتداوَل، وهو مفهوم اقتصادي راسخ في العربية المعاصرة. المعجم الوسيط يعرّفه بـ«نقص
      المتداول من النقود الورقية»، والمورد الحديث يعرّفه بـ«نقصٌ في حجم النقد المتداول يفضي إلى
      انخفاض الأسعار». اللمّة الأولى «انكماش» مصطلح مستقرّ، أما «انكماش اقتصادي» فهو تخصيص
      وصفي زائد لأنّ «الانكماش» وحده يُفهم في السياق الاقتصادي.
  blind_candidates:
    - lemma: "كَسَاد"
      generation_method: majaz
      justification: >
        من كَسَدَ السوقُ أي بارت وركدت حركتها. مجاز من بوار التجارة إلى تراجع
        النشاط الاقتصادي عموماً. لكنّ الكساد في الاصطلاح الحديث يقابل depression لا deflation.
    - lemma: "تَقَلُّص"
      generation_method: ishtiqaq
      justification: >
        مصدر تَقَلَّصَ على وزن تَفَعُّل من الجذر «قلص» الدالّ على الانضمام والانكماش.
        المعجم الموحد للاقتصاد يورد «تقلص، انكماش» مقابلاً لـ deflation.
    - lemma: "اِنْحِسَارٌ سِعْرِيّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي وصفي من «انحسار» (مصدر انحسر بمعنى تراجع وانكشف) و«سعري» (نسبة
        إلى السعر). يخصّص المفهوم بجانب انخفاض الأسعار.
    - lemma: "رُكُود"
      generation_method: ishtiqaq
      justification: >
        مصدر رَكَدَ على وزن فُعُول من الجذر «ركد» الدالّ على السكون والثبات.
        يُستعمل في الاقتصاد بمعنى الجمود والتباطؤ لكنّه أقرب إلى stagnation.

stage2_evidence:
  per_lemma:
    - lemma: "اِنْكِمَاش"
      confirm:
        - text: "«(الانكماش) نقص المتداول من النُّقُود الورقية (مج)»"
          source: "المعجم الوسيط"
        - text: "«الانكماش: نقصٌ في حجم النقد المتداول يفضي إلى انخفاض الأسعار.»"
          source: "المورد الحديث (2008)"
        - text: "«تقلص، انكماش: ينشأ ذلك عن انخفاض حجم الإنفاق النقدي، وتصحبه أعراض منها: انخفاض مستوى الأسعار ومستوى الاستخدام، والدخل القومي…»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«انكماش = deflation»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«إنكماش = deflation»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«انكماش = recession»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "لفظ «انكماش» يُستعمل أيضاً بمعنى الركود الاقتصادي (recession) لا الانكماش السعري فحسب"
        - text: "«انكماش = contraction»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يُستعمل أيضاً بالمعنى العامّ للتقلّص والانقباض"

    - lemma: "اِنْكِمَاشٌ اقْتِصَادِيّ"
      expands:
        - text: "«انكماش الأسعار = deflation of prices»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "المركّب المسجّل هو «انكماش الأسعار» لا «انكماش اقتصادي»"
        - text: "«انكماش نقدي = monetary deflation»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "المركّب المسجّل هو «انكماش نقدي» لا «انكماش اقتصادي»"
        - text: "«طور انكماش = downturn: أو تراجع في النشاط التجاري»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "الإضافة المسجّلة «طور انكماش» تختلف عن «انكماش اقتصادي»"

    - lemma: "كَسَاد"
      contradicts:
        - text: "«كساد = slackness»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "الكساد يقابل الركود والبوار (slackness/depression) لا الانكماش السعري (deflation)"
        - text: "«كساد اقتصادي = economic depression»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "كساد اقتصادي مصطلح مستقلّ يقابل depression وليس deflation"
        - text: "«كساد كبير = great depression»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "الكساد الكبير ظاهرة تاريخية محدّدة تختلف جوهرياً عن الانكماش"

    - lemma: "تَقَلُّص"
      confirm:
        - text: "«تقلص، انكماش = deflation: ينشأ ذلك عن انخفاض حجم الإنفاق النقدي…»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
      contradicts:
        - text: "«(تقلص) الشيء قَلَصَ»"
          source: "المعجم الوسيط"
          conflict: "التعريف المعجمي عامّ جداً ولا يخصّص المعنى الاقتصادي"
        - text: "«تقلُّص = contraction (فيزياء، كيمياء، طب، هندسة)»"
          source: "معاجم موحدة متعددة"
          conflict: "الاستعمال الغالب لـ«تقلّص» في المعاجم المصطلحية فيزيائي/طبي لا اقتصادي"

    - lemma: "اِنْحِسَارٌ سِعْرِيّ"
      evidence_status: "no_material_found"

    - lemma: "رُكُود"
      contradicts:
        - text: "«ركود؛ كساد = stagnation»"
          source: "المورد الحديث (2008)"
          conflict: "الركود يقابل stagnation وليس deflation"

stage3_analysis:
  per_lemma:
    - lemma: "اِنْكِمَاش"
      decision: confirmed
      decision_reason: >
        مصطلح مستقرّ في المعجمية الاقتصادية العربية، مثبت في المعجم الوسيط والمورد الحديث
        والمعاجم الموحدة مقابلاً لـ deflation. الجذر «كمش» يدلّ على اللطافة والصغر مما
        يناسب معنى التقلّص والنقصان.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الأساسي المجرّد للانكماش الاقتصادي، يُستعمل مطلقاً دون تخصيص، ويصلح
        في جميع السياقات الاقتصادية من أكاديمية وإعلامية وعامّة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْكِمَاش"

    - lemma: "اِنْكِمَاشٌ اقْتِصَادِيّ"
      decision: removed
      decision_reason: >
        مركّب وصفي غير مسجّل كوحدة معجمية ثابتة في أيٍّ من المعاجم المصطلحية المستقصاة.
        المركّبات المسجّلة هي «انكماش الأسعار» و«انكماش نقدي» و«انكماش الطلب». يفشل
        في اختبار السكّ: يمكن استبدال «اقتصادي» بـ«مالي» أو «تجاري» والعبارة تبقى
        وصفاً حراً لا مصطلحاً. فضلاً عن أنّ «الانكماش» وحده كافٍ للدلالة على المفهوم
        في السياق الاقتصادي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كَسَاد"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تؤكّد أنّ «الكساد» يقابل depression/slackness وليس deflation.
        الفرق جوهري: الكساد انخفاض حادّ في الناتج والتوظيف، بينما الانكماش انخفاض في
        المستوى العامّ للأسعار. لا يصحّ الخلط بينهما.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَقَلُّص"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود «تقلص» مرادفاً لـ«انكماش» في المعجم الموحد للاقتصاد، إلا أنّ الاستعمال
        الغالب لـ«تقلّص» في المعاجم المصطلحية فيزيائي وطبي (contraction عضلي/مادي).
        إدراجه يُحدث اشتراكاً لفظياً مُربكاً مع عشرات المصطلحات الطبية والهندسية.
        «الانكماش» أخصّ وأوضح في السياق الاقتصادي.
      evidence_assessment:
        case: mixed

    - lemma: "اِنْحِسَارٌ سِعْرِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على هذا المركّب. «انحسار» يُستعمل في سياقات جيولوجية ومائية
        (regression/reliction) لا اقتصادية. المركّب اجتهاد لا سند معجمي له.
      evidence_assessment:
        case: no_material

    - lemma: "رُكُود"
      source: stage1
      decision: removed
      decision_reason: >
        الركود يقابل stagnation/recession وهو مفهوم اقتصادي مختلف عن الانكماش (deflation).
        الركود تباطؤ في النموّ، أما الانكماش فانخفاض في مستوى الأسعار.
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "انكماش النشاط الاقتصادي مما يؤدي إلى انخفاض الأسعار"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دوريّ: يستخدم «انكماش» لتعريف مجموعة لمّتها «انكماش». كما أنّه
        يخلط بين السبب (تقلّص النشاط) والمفهوم نفسه (انخفاض الأسعار). التعريفات المعجمية
        المرجعية (الوسيط، المورد، المعجم الموحد) تركّز على نقص النقد المتداول كسبب وانخفاض
        الأسعار كنتيجة.
    authored:
      - type: terminological
        text: "انخفاضٌ مُستمرٌّ في المستوى العامّ للأسعار ناتجٌ عن نقصِ حجمِ النقدِ المتداوَل أو تراجُعِ الإنفاقِ الكلّيّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ظاهرةٌ اقتصاديةٌ تتمثّل في هبوط المستوى العامّ للأسعار هبوطاً متواصلاً، تنشأ عادةً من نقصٍ في كمّية النقد المتداوَل أو من انكماش الطلب الكلّيّ، وهي عكس التضخّم"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "انخفاضٌ مُستمرٌّ في المستوى العامّ للأسعار ناتجٌ عن نقصِ حجمِ النقدِ المتداوَل أو تراجُعِ الإنفاقِ الكلّيّ"

  examples:
    per_lemma:
      - lemma: "اِنْكِمَاش"
        examples:
          - text: "عانى الاقتصادُ اليابانيُّ من موجة انكماشٍ طويلة خلال تسعينيّات القرن العشرين أدّت إلى تراجع الأسعار وجمود الاستثمار."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "عانى الاقتصادُ اليابانيُّ من موجة انكماشٍ طويلة خلال تسعينيّات القرن العشرين أدّت إلى تراجع الأسعار وجمود الاستثمار."

