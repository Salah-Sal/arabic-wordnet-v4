# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13455579-n (assibilation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تحول إلى صوت صفيري» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ تفشل في اختبار السكّ واختبار التثبيت المعجمي"
      - "اللمّة «تصفير» بدون تشكيل — يلزم ضبطها بالتشكيل الكامل"
      - "التعريف العربي «تطور صوت ساكن إلى صوت صفيري» يستخدم «تطور» وهو غير دقيق؛ المصطلح اللساني يدل على تحويل (عملية فاعلة) لا تطور تلقائي"
    observations: "المجموعة تمثل مفهوماً لسانياً صوتياً متخصصاً (assibilation) يدل على تحوّل صوت انسدادي إلى صوت صفيري (كتحوّل /t/ إلى /s/ أو /ts/). المفهوم موجود في الدراسات اللسانية العربية الحديثة وله مقابل مُوحَّد في المعجم الموحد لمصطلحات اللسانيات. واحدة من اللمّتين الموجودتين عبارة وصفية لا ترقى إلى مستوى المصطلح."
  blind_candidates:
    - lemma: "تَصْفِير"
      generation_method: ishtiqaq
      justification: "مصدر صَفَّرَ على وزن تَفْعِيل، يدل على عملية جعل الصوت صفيرياً؛ الجذر «صفر» له أصل صوتي في مقاييس اللغة"
    - lemma: "تَصَفُّر"
      generation_method: ishtiqaq
      justification: "مصدر تَصَفَّرَ (الباب الخامس) على وزن تَفَعُّل، يدل على صيرورة الصوت صفيرياً تلقائياً (مطاوعة)"
    - lemma: "إِصْفَار"
      generation_method: ishtiqaq
      justification: "مصدر أَصْفَرَ (الباب الرابع) على وزن إِفْعَال، يدل على جعل الشيء ذا صفة الصفير"
    - lemma: "تَحَوُّل صَفِيرِيّ"
      generation_method: tarkib
      justification: "مركب إضافي وصفي من «تحوّل» و«صفيري»، يصف عملية التحول إلى صوت صفيري"

stage2_evidence:
  per_lemma:
    - lemma: "تصفير"
      confirm:
        - text: "«تحويل صوت انسدادي إلى صفيري.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«تحويل صوت انسدادي إلى صفيري.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«صامت احتكاكي يتحقق كنخروبي أو أسناني، وكأسلي أو ما قبل ظهر اللسان مثل س و(ز)و في المستوى الإصفائي تتميز الصوامت الصفيرية بأنها منتشرة وحادة واستمرارية وصريرية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل «صَفِيرِيّ»"
          addition: "يوضح ماهية الصوت الصفيري الذي ينتج عن عملية التصفير"
    - lemma: "تحول إلى صوت صفيري"
      evidence_status: "no_material_found"
    - lemma: "تَصَفُّر"
      evidence_status: "no_material_found"
    - lemma: "إِصْفَار"
      evidence_status: "no_material_found"
    - lemma: "تَحَوُّل صَفِيرِيّ"
      evidence_status: "no_material_found"
    - lemma: "الصَّفِير"
      expands:
        - text: "«صوتٌ على درجة كبيرة من الرخاوة؛ كالسين والزاى والصاد»"
          source: "المعجم الوسيط"
          addition: "يعرّف الصفير كصفة صوتية لا كعملية تحويل، ما يؤكد أن «تصفير» (المصدر) هو الأنسب للدلالة على العملية"
        - text: "«الصفير: الصوت الخالي عن الحروف.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف تراثي للصفير كصوت مجرد"
  maqayis:
    root: "صفر"
    quote: "«الصَّادُ وَالْفَاءُ وَالرَّاءُ سِتَّةُ أَوْجُهٍ... وَأَمَّا الرَّابِعُ فَالصَّفِيرُ لِلطَّائِرِ. وَقَوْلُهُمْ: مَا بِهَا صَافِرٌ مِنْ هَذَا، أَيْ كَأَنَّهُ يُصَوِّتُ.»"

stage3_analysis:
  per_lemma:
    - lemma: "تَصْفِير"
      decision: confirmed
      decision_reason: "مصطلح مُوحَّد معتمد من المنظمة العربية للتربية والثقافة والعلوم (ALECSO) في المعجم الموحد لمصطلحات اللسانيات (2002) ومسرد الإعلام والتواصل، مقابلاً لـ assibilation. مشتق اشتقاقاً قياسياً من الجذر «صفر» ذي الأصل الصوتي، على وزن تَفْعِيل الدال على التحويل والإحداث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصْفِير"

    - lemma: "تحول إلى صوت صفيري"
      decision: removed
      decision_reason: "عبارة وصفية حرة مؤلفة من أربع كلمات، تفشل في اختبار السكّ (يمكن إبدال «تحول» بـ«تحوير» أو «انتقال» وتبقى العبارة صالحة) واختبار التثبيت المعجمي (لم ترد في أي معجم كمدخل مستقل). ليست وحدة معجمية ثابتة بل شرح مباشر للمفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَصَفُّر"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعماله في السياق اللساني. وزن تَفَعُّل يدل على المطاوعة والصيرورة الذاتية، وهو أقل ملاءمة من تَفْعِيل الذي يدل على الفعل المتعدي والتحويل. المصطلح المعتمد «تصفير» يغطي المفهوم."
      evidence_assessment:
        case: no_material

    - lemma: "إِصْفَار"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعماله بهذه الدلالة. الصيغة الموجودة «اصْفارَّ» في المعجم الكبير تدل على اللون لا الصوت. المصطلح المعتمد «تصفير» يغطي المفهوم."
      evidence_assessment:
        case: no_material

    - lemma: "تَحَوُّل صَفِيرِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركب غير مُثبَّت معجمياً، ولا حاجة إليه مع وجود المصطلح المفرد المعتمد «تصفير» الذي هو أيسر تداولاً وأكثر اشتقاقية."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "تطور صوت ساكن إلى صوت صفيري"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم «تطور» وهو مصطلح عام، والأدق «تحوّل/تحويل». كما يستخدم «ساكن» (consonant) بدلاً من «انسدادي» (stop/plosive) وهو الأدق علمياً؛ فالتصفير يخصّ تحول الأصوات الانسدادية (مثل /t/ و /k/) لا كل الأصوات الساكنة."
    authored:
      - type: terminological
        text: "تحويل صوت صامت انسدادي إلى صوت صفيري احتكاكي أو مزجي"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "تحوّل الصوت الانسدادي إلى صفيري، كتحوّل التاء إلى سين أو صاد"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "تحويل صوت صامت انسدادي إلى صوت صفيري احتكاكي أو مزجي"

  examples:
    per_lemma:
      - lemma: "تَصْفِير"
        examples:
          - text: "يُعَدُّ التَّصْفِيرُ مِنْ أَبْرَزِ التَّحَوُّلاتِ الصَّوْتِيَّةِ فِي تَارِيخِ اللُّغاتِ الجِرْمانِيَّةِ، إِذْ تَحَوَّلَتِ التَّاءُ إِلَى سِينٍ فِي عَدَدٍ مِنَ الأَلْفاظِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ التَّصْفِيرُ مِنْ أَبْرَزِ التَّحَوُّلاتِ الصَّوْتِيَّةِ فِي تَارِيخِ اللُّغاتِ الجِرْمانِيَّةِ، إِذْ تَحَوَّلَتِ التَّاءُ إِلَى سِينٍ فِي عَدَدٍ مِنَ الأَلْفاظِ."

