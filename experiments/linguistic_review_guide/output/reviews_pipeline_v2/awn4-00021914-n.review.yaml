# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-00021914-n (nutrient)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عنصر غذائي، مادة مغذية) كلتاهما مركّبتان، ولا توجد لمّة مفردة"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج صياغة معجمية عربية"
      - "اللمّتان بدون تشكيل كامل"
    observations: "المفهوم يخصّ المادة التي يمتصّها النبات الأخضر ويستعملها في التمثيل الضوئي والتخليق العضوي، وهو مفهوم علمي زراعي/أحيائي. اللمّتان المركّبتان شائعتان في الاستعمال العلمي العربي المعاصر. يمكن البحث عن لمّة مفردة من جذر غ ذ و."
  blind_candidates:
    - lemma: "مُغَذٍّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من غَذَّى على وزن مُفَعِّل، يُستعمل اسماً بمعنى ما يُغذّي الكائن الحي، وهو استعمال شائع في المصطلحية العلمية العربية"
    - lemma: "غِذَاء"
      generation_method: majaz
      justification: "إطلاق اسم الغذاء مجازاً على العنصر الذي يمتصّه النبات ويتغذّى منه، من باب تسمية الجزء باسم الكل"
    - lemma: "غُذِيّ"
      generation_method: ishtiqaq
      justification: "صفة مشبّهة من غَذَا على وزن فُعِيل، بمعنى ما يُتغذّى به، وردت في بعض المعاجم المتخصصة"
    - lemma: "قُوتُ النَّبَات"
      generation_method: tarkib
      justification: "مركّب إضافي من قُوت (ما يقوم به البدن) والنبات، يدلّ على المادة التي يقتات بها النبات"


stage2_evidence:
  per_lemma:
    - lemma: "عُنْصُرٌ غِذَائِيّ"
      confirm:
        - text: "«عُنصر غذائيّ — fertiliser element / nutrient element»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«كثافة غذائية، كثافة العنصر الغذائيّ — nutrient density»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«مساعدة عنصر غذائيّ أو مادة في تقليل الحاجة إلى عنصر غذائيّ آخر»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«توازن العناصر الغذائية في النباتات — nutrient balance (plant)»"
          source: "المَكنَز الزراعي متعدد اللغات"
          addition: "يؤكد استعمال 'العناصر الغذائية' جمعاً في السياق النباتي"

    - lemma: "مَادَّةٌ مُغَذِّيَة"
      confirm:
        - text: "«(1) مُغَذٍّ؛ مُقيت (2) مادة مُغَذِّية — nutrient»"
          source: "المورد الحديث (2008)"
        - text: "«مغّذٍ، مادة مغدية — nutrient»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«مادَة غذائيَة — nutrient»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«مادة غذائية للنبات — plant nutrient»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "صيغة أطول تخصّص المادة المغذية بالنبات"

    - lemma: "مُغَذٍّ"
      confirm:
        - text: "«مغذ — nutrient; nutritive»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«مُغَذٍّ؛ مُقيت — nutritious»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«مغذّ — feeder»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "في الفيزياء والكهرباء يعني مُغَذٍّ 'feeder' لا 'nutrient'، مما يوقع في الاشتراك اللفظي"
        - text: "«مغذي — feeder»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "الدلالة على جهاز التغذية الكهربائية لا على العنصر الغذائي"
      expands:
        - text: "«مُغَذٍّ زَهيدُ المقدار — micronutrient»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستعمل اسماً في التراكيب الطبية بمعنى العنصر المغذي"

    - lemma: "غِذَاء"
      confirm:
        - text: "«غذاء — أي مادة تمتص من قبل الكائنات العضوية لتعزيز نموها أو تسهيله — nutrient»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      contradicts:
        - text: "«الْغِذَاءُ، وَهُوَ الطَّعَامُ وَالشَّرَابُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الغذاء في أصل اللغة عامّ يشمل كل مأكول ومشروب، لا يختصّ بالعنصر الكيميائي الذي يمتصّه النبات"

    - lemma: "غُذِيّ"
      confirm:
        - text: "«غُذيّ، عنصر مُغَذِّ — nutrient; nutriment»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«غَذِيُّ الْمَالِ وَغَذَوِيُّهُ: صِغَارُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الصيغة غَذِيّ في اللغة القديمة بمعنى الصغير الذي يُغذّى، لا بمعنى العنصر المغذي"

    - lemma: "قُوتُ النَّبَات"
      confirm:
        - text: "«قُوْت النبات: «أ» موادّ غير عضوية يمتصّها النبات على صورة غازٍ أو محلولٍ مائيّ. «ب» سماد — plant food»"
          source: "المورد الحديث (2008)"


stage3_analysis:
  per_lemma:
    - lemma: "عُنْصُرٌ غِذَائِيّ"
      decision: confirmed
      decision_reason: "مصطلح مركّب ثابت مسجّل في المعاجم الموحّدة (ALECSO) لعلوم المياه والأغذية، مطابق للمفهوم المقصود (nutrient element). واسع الشيوع في الأدبيات العلمية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركّز على البُعد الكيميائي للمُغذّي بوصفه عنصراً (element)، ويُستعمل غالباً في سياق علوم الزراعة والمياه والأغذية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُنْصُرٌ غِذَائِيّ"

    - lemma: "مَادَّةٌ مُغَذِّيَة"
      decision: confirmed
      decision_reason: "مصطلح مركّب وصفي ثابت، مسجّل في المعجم الموحد للكيمياء والطاقة المتجددة والمورد الحديث بمعنى nutrient. يُشير إلى المادّة بعمومها لا إلى العنصر الكيميائي تحديداً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركّز على الطبيعة المادّية للمُغذّي بوصفه مادّةً (substance)، أعمّ من 'عنصر غذائي' إذ يشمل المركّبات لا العناصر فحسب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّةٌ مُغَذِّيَة"

    - lemma: "مُغَذٍّ"
      source: stage1
      decision: removed
      decision_reason: "رغم تسجيله في معجم الأحياء بمعنى nutrient، فإنه يعاني اشتراكاً لفظياً حادّاً مع معنى feeder في الفيزياء والكهرباء والطاقة (٥ معاجم موحّدة على الأقل). وهو في الأصل اسم فاعل (صفة) لا اسم ذات، فاستعماله اسماً مفرداً بمعنى 'العنصر المغذي' يحتاج قرينة."

    - lemma: "غِذَاء"
      source: stage1
      decision: removed
      decision_reason: "الغذاء في أصل اللغة يشمل كل طعام وشراب (كما في مقاييس اللغة)، وهو أعمّ بكثير من المفهوم المقصود. وإن ورد في معجم الهندسة المدنية بمعنى nutrient فإن ذلك استعمال مجازي موسّع لا يصلح لمّةً محدّدة لهذا المفهوم الدقيق."

    - lemma: "غُذِيّ"
      source: stage1
      decision: removed
      decision_reason: "وردت في معجم واحد (الطب البيطري) مقرونة بـ'عنصر مُغَذٍّ'، وأصلها في اللغة القديمة بمعنى الصغير الذي يُغذّى (مقاييس اللغة). استعمالها النادر وانحصارها في معجم واحد لا يكفي لإدراجها لمّةً."

    - lemma: "قُوتُ النَّبَات"
      source: stage1
      decision: removed
      decision_reason: "ورد في المورد الحديث ترجمةً لـ plant food لا لـ nutrient. والتعريف يشمل الموادّ غير العضوية والسماد معاً، مما يجعله أوسع من المفهوم المقصود. كما أنّ 'قوت' في العربية يرتبط بقوت الإنسان لا بغذاء النبات، فالاستعمال غير مألوف."


stage4_content:
  definition:
    current: "أي مادة (مثل عنصر كيميائي أو مركب غير عضوي) يمكن أن يمتصها النبات الأخضر ويستخدمها في التخليق العضوي"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية، يحتاج صياغة عربية معجمية أصيلة مع تصحيح 'التخليق العضوي' إلى 'البناء الحيوي' أو 'التمثيل الضوئي'"
    authored:
      - type: terminological
        text: "مادّةٌ كيميائيّة — عنصراً كانت أو مركّباً غير عضويّ — يمتصّها النباتُ الأخضر من التربة أو الماء ويستعملها في بناء أنسجته وتخليق موادّه العضوية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "كلُّ عنصر أو مركّب لاعضويّ تحتاج إليه النباتات الخضراء لإتمام دورة حياتها، يُمتصّ عادةً من التربة على هيئة أيونات ذائبة في الماء. تشمل العناصر المغذّية الكبرى كالنيتروجين والفسفور والبوتاسيوم، والصغرى كالحديد والزنك والمنغنيز"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ كيميائيّة — عنصراً كانت أو مركّباً غير عضويّ — يمتصّها النباتُ الأخضر من التربة أو الماء ويستعملها في بناء أنسجته وتخليق موادّه العضوية"

  examples:
    per_lemma:
      - lemma: "عُنْصُرٌ غِذَائِيّ"
        examples:
          - text: "يُعدّ النيتروجين أهمّ عنصرٍ غذائيّ تحتاج إليه المحاصيل الزراعية في مراحل نموّها الأولى."
            type: usage
      - lemma: "مَادَّةٌ مُغَذِّيَة"
        examples:
          - text: "تمتصّ الجذور الموادّ المغذّية الذائبة في ماء التربة وتنقلها عبر الأوعية الخشبية إلى الأوراق."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعدّ النيتروجين أهمّ عنصرٍ غذائيّ تحتاج إليه المحاصيل الزراعية في مراحل نموّها الأولى."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تمتصّ الجذور الموادّ المغذّية الذائبة في ماء التربة وتنقلها عبر الأوعية الخشبية إلى الأوراق."


