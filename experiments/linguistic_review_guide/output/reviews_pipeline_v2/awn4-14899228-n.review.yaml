# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14899228-n (fuel / وقود)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «وقود» بدون تشكيل — يجب إضافة التشكيل الكامل: وَقُود"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية وغير دقيق: «يمكن استهلاكها» عبارة فضفاضة تشمل الغذاء أيضاً"
    observations: "المفهوم واضح ومستقرّ في العربية المعاصرة. لفظ «وقود» على وزن فَعُول بمعنى ما يُوقَد به هو اللفظ الأصيل المتوارث من العربية الكلاسيكية، وقد وسّعه مجمع اللغة العربية ليشمل كلّ مادّة تتولّد باحتراقها طاقة حرارية. المجموعة تحتوي لمّة واحدة فقط وهو كافٍ لأنّ «وقود» هو المصطلح المعياري الوحيد الجامع لهذا المفهوم."
  blind_candidates:
    - lemma: "وَقُود"
      generation_method: ishtiqaq
      justification: "من جذر و-ق-د الدالّ على اشتعال النار، على وزن فَعُول الذي يدلّ على ما يُفعَل به (ما يُوقَد به). هذا هو اللفظ العربي الأصيل للمفهوم."
    - lemma: "مَحْرُوقَات"
      generation_method: ishtiqaq
      justification: "جمع مَحْرُوق من جذر ح-ر-ق، يُستعمل في بعض البلدان العربية للدلالة على أنواع الوقود السائل كالبنزين والسولار."
    - lemma: "شَبُوب"
      generation_method: majaz
      justification: "من جذر ش-ب-ب (شَبَّ النارَ: أوقدها)، على وزن فَعُول. ورد في تعريف الحطب: «ما أُعِدَّ من الشجر شَبُوباً للنار». إزاحة دلالية من الإيقاد إلى مادّة الإيقاد."
    - lemma: "حُرَاقَة"
      generation_method: ishtiqaq
      justification: "من جذر ح-ر-ق على وزن فُعَالة، ورد في المعاجم بمعنى ما تقع فيه النار عند القدح من خرقة ونحوها. محاولة توسيع الدلالة لتشمل كلّ مادّة تُحرَق."

stage2_evidence:
  per_lemma:
    - lemma: "وَقُود"
      confirm:
        - text: "«كُلُّ مادَّةٍ تتولَّد باحتراقها طاقة حرارية»"
          source: "المعجم الوسيط"
        - text: "«الوقود: بالفتح: ما يوقد به النار: وبالضم التهابها، فهو مصدر والأول اسم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«مادة كيميائية يمكن تحويل الطاقة الكيميائية المختزنة فيها عن طريق الاحتراق إلى طاقة حرارية قابلة للاستخدام»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«مواد يمكن أن تولد طاقة (عموماً حرارية قابلة للتحويل إلى طاقة ميكانيكية أو كهربائية أو ...) عند حرقها (وقود أحفوري أو عضوي) أو انشطارها أو انصهارها (وقود نووي)»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      expands:
        - text: "«الوارد في المعاجم وَقود بمعنى ما تُوقد به النار من الحطب، أما وُقُود فهو مصدر الفعل وقد والمناسب للتخزين هو المادة التي يوقد بها وليس المعنى المصدري»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "التفريق بين وَقُود (بالفتح، اسم) ووُقُود (بالضمّ، مصدر)"
        - text: "«الْوَاوُ وَالْقَافُ وَالدَّالُ: كَلِمَةٌ تَدُلُّ عَلَى اشْتِعَالِ نَارٍ. وَقَدَتِ النَّارُ تَقِدُ وَاتَّقَدَتْ وَتَوَقَّدَتْ، وَأَوْقَدْتُهَا أَنَا. وَالْوَقُودُ: الْحَطَبُ. وَالْوُقُودُ: فِعْلُ النَّارِ إِذَا وَقَدَتْ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي: الوَقُود اسمٌ لما يُوقَد به، والوُقُود مصدر"

    - lemma: "مَحْرُوقَات"
      confirm:
        - text: "«أنواعُ الوُقُود المُستخْدَم فى توليد الطَّاقَة كالبنزين والسُّولار ونحوهما»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«محروقات سائلة» = hydrocarbon"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
          conflict: "محروقات في الاستعمال الاصطلاحي تُقيَّد بالسوائل البترولية، لا تشمل الوقود النووي أو الحيوي بإطلاق"

    - lemma: "شَبُوب"
      evidence_status: "no_material_found"

    - lemma: "حُرَاقَة"
      contradicts:
        - text: "«ما تقعُ فيه النار عند القدح من خرقةٍ ونحوها»"
          source: "المعجم الوسيط"
          conflict: "الحُراقة هي القدّاحة أو الصوفانة التي تشتعل عند القدح، وليست الوقود بمعناه العام"
        - text: "«ما تُقْدَح به النَّارُ مِنْ خِرْقَةٍ ونحوها»"
          source: "المعجم الكبير"
          conflict: "نفس الدلالة: أداة إشعال لا مادّة وقود"

stage3_analysis:
  per_lemma:
    - lemma: "وَقُود"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل من جذر و-ق-د على وزن فَعُول، أثبته مجمع اللغة العربية بالمعنى الحديث الشامل لكلّ مادّة تتولّد باحتراقها طاقة، وهو المصطلح المعياري في جميع المعاجم المتخصصة (فيزياء، كيمياء، نفط، طاقة متجدّدة، نقل). ضُبط بفتح الواو (وَقُود) تمييزاً له عن المصدر (وُقُود)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَقُود"

    - lemma: "مَحْرُوقَات"
      source: stage1
      decision: removed
      decision_reason: "رغم ورودها في المعجم الكبير بمعنى أنواع الوقود، فإنّ «محروقات» صيغة جمع لا مفرد لها بهذا المعنى، وتختصّ في الاستعمال الفعلي بالوقود السائل البترولي (بنزين، سولار)، ولا تشمل الوقود النووي أو الحيوي. كما أنّها اسم مفعول يدلّ على نتيجة الفعل (ما أُحرِق) لا على المادّة المُعدَّة للإحراق."

    - lemma: "شَبُوب"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر على شواهد معجمية لاستعمال «شبوب» مصطلحاً مستقلّاً للوقود. وردت حالاً في تعريف الحطب («ما أُعِدَّ من الشجر شَبُوباً للنار») أي بمعنى الوصف لا الاسم المستقلّ."

    - lemma: "حُرَاقَة"
      source: stage1
      decision: removed
      decision_reason: "الحُراقة في المعاجم تعني ما تقع فيه النار عند القدح من خرقة ونحوها، أي الصوفانة أو القدّاحة، وهي أداة إشعال لا مادّة وقود. الدلالة مختلفة جوهرياً عن المفهوم المطلوب."

stage4_content:
  definition:
