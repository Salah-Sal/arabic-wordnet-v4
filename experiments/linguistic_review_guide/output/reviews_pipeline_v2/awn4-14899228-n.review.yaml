      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية، وعبارة «يمكن استهلاكها لإنتاج الطاقة» فضفاضة تنطبق على الغذاء أيضاً. المعاجم العربية تُحدّد آلية التحويل (الاحتراق) وهو ما يميّز الوقود عن غيره من مصادر الطاقة."
    authored:
      - type: terminological
        text: "كلُّ مادَّةٍ تتولَّدُ باحتراقِها أو بتفاعُلِها طاقةٌ حراريّةٌ قابلةٌ للاستخدام"
        quality_check:
