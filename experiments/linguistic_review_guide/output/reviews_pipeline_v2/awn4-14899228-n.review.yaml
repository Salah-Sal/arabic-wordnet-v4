            type: usage
          - text: "ارتفعت أسعار الوَقُود في الأسواق العالمية بسبب التوتّرات الجيوسياسية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تسعى الدول إلى تنويع مصادر الوَقُود للحدّ من الاعتماد على النفط الخام."
