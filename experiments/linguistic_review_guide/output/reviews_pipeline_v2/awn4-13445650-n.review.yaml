stage1_review:
  assessment:
    concerns:
      - "لفظة «إضافة» مثقلة بدلالات نحوية وفلسفية كلاسيكية (مقولة الإضافة عند الحكماء، والإضافة النحوية)، وقد يلتبس استعمالها بالمعنى الاصطلاحي النحوي"
      - "لفظة «انضمام» تُستعمل حديثاً في سياق الانضمام إلى معاهدات ومنظمات، وهو أقرب إلى فعل الالتحاق منه إلى عملية الزيادة على مجموعة"
      - "التعريف العربي الحالي ترجمة حرفية للتعريف الإنجليزي ويحتاج إلى إعادة صياغة بأسلوب معجمي عربي"
    observations: "المفهوم يدور حول عملية تكثير مجموعة بإضافة عناصر جديدة إليها، كما في اقتناء الكتب في المكتبات أو ضمّ القطع إلى مجموعة. الجذران الأساسيان: ض ي ف (ميل الشيء إلى الشيء) و ض م م (ملاءمة بين شيئين). كلا اللفظين صالحان لكنهما يختلفان في الدقة الدلالية."
  blind_candidates:
    - lemma: "إِلْحَاق"
      generation_method: ishtiqaq
      justification: "مصدر أَلْحَقَ على وزن إِفْعال من الجذر ل ح ق، يدلّ على إدراك شيء وبلوغه إلى غيره، فيصلح للدلالة على عملية إضافة عنصر إلى مجموعة قائمة"
    - lemma: "ضَمّ"
      generation_method: ishtiqaq
      justification: "مصدر ضَمَّ من الجذر ض م م، يدلّ على ملاءمة بين شيئين وجمعهما، وهو أقرب الألفاظ إلى المعنى المادي للمفهوم"
    - lemma: "اسْتِزَادَة"
      generation_method: ishtiqaq
      justification: "مصدر اسْتَزَادَ على وزن اسْتِفْعَالَة، يدلّ على طلب الزيادة، فيناسب عملية التكثير والتنمية لمجموعة"
    - lemma: "تَكَاثُر"
      generation_method: ishtiqaq
      justification: "مصدر تَكَاثَرَ على وزن تَفَاعُل، يدلّ على التزايد والتكثّر، وقد يصلح للدلالة على عملية النمو بالإضافة"

stage2_evidence:
  per_lemma:
    - lemma: "إِضَافَة"
      confirm:
        - text: "«(1) إضافة؛ شيء مَزِيد a list of accessions»"
          source: "المورد الحديث (2008)"
        - text: "«إضافة، ضم — addition»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«إضافة؛ زيادة — addition»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«(1) إضافة؛ زيادة (2) الجَمْع (ر) (3) مُلْحَق؛ شيء مضاف — addition»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الإضافة: ضم شيء إلى شيء ومنه الإضافة في اصطلاح النحاة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الأصل اللغوي للإضافة هو ضمّ شيء إلى شيء، ثم اختُصّ في النحو والفلسفة"
        - text: "«الضَّادُ وَالْيَاءُ وَالْفَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ، يَدُلُّ عَلَى مَيْلِ الشَّيْءِ إِلَى الشَّيْءِ. يُقَالُ: أَضَفْتُ الشَّيْءَ إِلَى الشَّيْءِ: أَمَلْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل في الجذر: ميل الشيء إلى الشيء، ومنه الإضافة بمعنى الضمّ"
    - lemma: "انْضِمَام"
      confirm:
        - text: "«(2) انضمام accession to a treaty»"
          source: "المورد الحديث (2008)"
        - text: "«انضمام — عملية تصبح بموجبها الدولة طرفا في معاهدة تم التفاوض عليها وتوقيعها من قبل دول أخرى بالفعل»"
          source: "مسرد المناخ والبيئة، أليكسو (ArabTerm)"
      expands:
        - text: "«الانضمام: التلاقي بلا حجاب»"
          source: "دستور العلماء للأحمدنكري"
          addition: "المعنى الكلاسيكي أوسع: مطلق التلاقي والاجتماع"
        - text: "«إِنْضِمَام — مصدر انضمّ، وهمزته همزة وصل»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "تأكيد صحة الصيغة الصرفية وأن الهمزة همزة وصل"
    - lemma: "إِلْحَاق"
      contradicts:
        - text: "«الإلحاق: جعل مثال على مثال أزيد ليعامل معاملته، وشرطه اتحاد المصدرين»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "المعنى الاصطلاحي السائد للإلحاق صرفيّ بحت (إلحاق وزن بوزن أزيد)، لا علاقة له بالزيادة على مجموعة"
      expands:
        - text: "«اللَّامُ وَالْحَاءُ وَالْقَافُ أَصْلٌ يَدُلُّ عَلَى إِدْرَاكِ شَيْءٍ وَبُلُوغِهِ إِلَى غَيْرِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على اللحاق والإدراك، لا على الضمّ إلى مجموعة"
    - lemma: "ضَمّ"
      confirm:
        - text: "«الضَمُّ: ضمك الشيء إلى الشيء»"
          source: "كتاب العين للخليل بن أحمد"
        - text: "«ضمّ — annexation»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«الضَّادُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُلَاءَمَةٍ بَيْنَ شَيْئَيْنِ. وَهَذِهِ إِضْمَامَةٌ مِنْ خَيْلٍ، أَيْ جَمَاعَةٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الملاءمة والجمع، والإضمامة تعني الجماعة"
    - lemma: "اسْتِزَادَة"
      evidence_status: "no_material_found"
    - lemma: "تَكَاثُر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "إِضَافَة"
      decision: confirmed
      decision_reason: "لفظة مؤسسة في الاستعمال الحديث بمعنى الزيادة والضمّ، ومدعومة بالمعاجم الاصطلاحية المعاصرة (المورد، معاجم أليكسو). أصلها اللغوي (ضمّ شيء إلى شيء) يطابق المفهوم المطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على عملية الزيادة والضمّ بصورة عامة ومجردة، وتُستعمل في السياقات العلمية والرياضية والعامة دون تخصيص"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِضَافَة"

    - lemma: "انْضِمَام"
      decision: confirmed
      decision_reason: "لفظة صحيحة صرفياً (مصدر انضمّ على وزن انفعال)، مؤيَّدة بشواهد المعاجم الحديثة خاصة في سياق الانضمام إلى مجموعات ومعاهدات. المعنى الكلاسيكي (التلاقي) يدعم الاستعمال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على فعل الالتحاق بمجموعة قائمة من منظور العنصر المنضمّ، بينما «إضافة» من منظور المُضيف أو العملية ذاتها"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْضِمَام"

    - lemma: "إِلْحَاق"
      source: stage1
      decision: removed
      decision_reason: "المعنى الاصطلاحي المهيمن صرفيّ (إلحاق وزن بوزن)، والمعنى الحديث (الضمّ القسري) يختلف عن مفهوم الزيادة الطوعية على مجموعة. لا يضيف بُعداً دلالياً جديداً مفيداً."
      evidence_assessment:
        case: mixed

    - lemma: "ضَمّ"
      source: stage1
      decision: removed
      decision_reason: "رغم صحة المعنى اللغوي (ضمّ الشيء إلى الشيء)، فإنه يدلّ على الفعل المباشر لا على العملية المجردة التي يمثلها المفهوم. كما أن دلالته الحديثة تميل إلى الضمّ القسري (annexation) في السياق القانوني والسياسي."
      evidence_assessment:
        case: mixed

    - lemma: "اسْتِزَادَة"
      source: stage1
      decision: removed
      decision_reason: "لا شواهد معجمية تؤيّد استعمالها بهذا المعنى المحدد، وهي تدلّ على طلب الزيادة لا على عملية الزيادة ذاتها."
      evidence_assessment:
        case: no_material

    - lemma: "تَكَاثُر"
      source: stage1
      decision: removed
      decision_reason: "التكاثر يدلّ على التزايد الذاتي (كالتكاثر البيولوجي) لا على عملية إضافة عناصر خارجية إلى مجموعة. المفهوم مختلف جوهرياً."
      evidence_assessment:
        case: no_material

