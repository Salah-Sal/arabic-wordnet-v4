# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10660949-n  |  ILI: i93239  |  POS: n
# المفهوم: شخص يرفض (شخصاً أو شيئاً) بازدراء  [spurner]
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "رَافِض بَازْدِرَاء: عبارة وصفية حرة لا مصطلح مسكوك — يمكن إبدال «بازدراء» بـ«باحتقار» أو «باستخفاف» ويظل التعبير صالحاً، مما يُثبت أنه ليس وحدةً معجميةً ثابتة"
      - "لَافِظ: جذره «لفظ» يدل على طرح الشيء من الفم (كلاماً أو طعاماً) لا على الرفض بازدراء — واللافظة كلاسيكياً صفة للديك والبحر والرحى دون صلة بالإنسان الرافض المزدري"
      - "المجموعة تفتقر إلى مصطلح عربي أصيل مشتق يجمع بين معنى الرفض ومعنى الازدراء في بنية صرفية واحدة"
    observations: "المفهوم المطلوب (الشخص الرافض بازدراء = spurner) راسخٌ في العربية الفصحى عبر جذريْ «زرى» و«حقر». جذر «زري» في مقاييس ابن فارس دالٌّ صريح على «احتقار الشيء والتهاون به»، ومنه الفعل المزيد «ازدرى» الذي يجمع الرفضَ والازدراءَ في فعل واحد. جذر «حقر» يدل على الاستصغار والاستهانة. الأجدى استحضار اسمَيْ الفاعل من هذين الجذرين."
  blind_candidates:
    - lemma: "مُزْدَرٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل المزيد «ازدرى» على وزن مُفْتَعِل؛ الجذر «زري» في مقاييس اللغة يدل على «احتقار الشيء والتهاون به»، فيجمع هذا الاشتقاق معنى الرفض ومعنى الازدراء في وحدة اشتقاقية واحدة"
    - lemma: "مُحْتَقِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل المزيد «احتقر» على وزن مُفْتَعِل؛ الجذر «حقر» يدل على الاستصغار والاستهانة، ويُستعمل لمن يُعامل غيره بدونية وازدراء"
    - lemma: "نَابِذ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «نبذ» على وزن فَاعِل؛ الجذر «نبذ» يدل على الطرح والإلقاء، ويُستعمل مجازاً في ردّ الشيء ورفضه باستهانة وإعراض"
    - lemma: "مُسْتَخِفّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «استخفَّ» على وزن مُسْتَفْعِل؛ يدل على من يستهين بالشيء ويستخف به، وهو ملازم لموقف الازدراء والرفض"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة (٥ استعلامات):
#  Q1 — مطابقة دفعية لجميع اللمّات والمرشحات (headword_norm)
#  Q2 — جسر إنجليزي (spurner / scorner / contemner / rejecter / disdainer)
#  Q3 — إثراء بالمعرّف (definitions) لـ entry_ids الواردة في Q1/Q2
#  Q4 — مقاييس اللغة (dictionary_id=151) للجذور: رفض، لفظ، زري، نبذ، حقر، نكف
#  Q5 — FTS عربي بمفاتيح: يرفض، ازدراء، يزدري، احتقار، استخفاف
stage2_evidence:
  per_lemma:
    - lemma: "رَافِض بَازْدِرَاء"
      expands:
        - text: "«رَافِض: من (ر ف ض) تارك الشيء، وكاسره والمتسع من الوديان، والمنتشر عذقه من النخل، والساقط غلافه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "رافض بمعنى تارك مطلق، لكنه لا يحمل دلالة الازدراء بذاته"
        - text: "«الرَّاءُ وَالْفَاءُ وَالضَّادُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّرْكُ، ثُمَّ يُشْتَقُّ مِنْهُ. يُقَالُ رَفَضْتُ الشَّيْءَ: تَرَكْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على مطلق الترك والتفرق، دون دلالة على الازدراء أو الاحتقار، مما يُثبت أن «بازدراء» إضافة خارجية حرة لا صلة لها بالجذر"

    - lemma: "لَافِظ"
      contradicts:
        - text: "«اللَّامُ وَالْفَاءُ وَالظَّاءُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى طَرْحِ الشَّيْءِ؛ وَغَالِبُ ذَلِكَ أَنْ يَكُونَ مِنَ الْفَمِ. تَقُولُ: لَفَظَ بِالْكَلَامِ يَلْفِظُ لَفْظًا. وَلَفَظْتُ الشَّيْءَ مِنْ فَمِي. وَاللَّافِظَةُ: الدِّيكُ، وَيُقَالُ الرَّحَى، وَالْبَحْرُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدل على الطرح من الفم (كلام أو طعام)، واللافظة صفة غالبة للبحر والديك والرحى — لا للإنسان الرافض بازدراء؛ والإزاحة الدلالية المطلوبة غير مشهودة في التراث المعجمي"

    - lemma: "مُزْدَرٍ"
      confirm:
        - text: "«المُزْدَرِي: الأَسَدُ. (صِفَةٌ غالِبَةٌ) كأَنَّه يَسْتَهينُ بكُلِّ مَنْ سِواهُ»"
          source: "المعجم الكبير"
        - text: "«المُزْدَري؛ المُحْتَقِر»"
          source: "المورد الحديث (2008) — ترجمة contemner / contemnor"
        - text: "«الزَّاءُ وَالرَّاءُ وَالْحَرْفُ الْمُعْتَلُّ يَدُلُّ عَلَى احْتِقَارِ الشَّيْءِ وَالتَّهَاوُنِ بِهِ. يُقَالُ زَرَيْتُ عَلَيْهِ، إِذَا عِبْتَ عَلَيْهِ. وَأَزْرَيْتُ بِهِ: قَصَّرْتَ بِهِ»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "مُحْتَقِر"
      confirm:
        - text: "«المُزْدَري؛ المُحْتَقِر»"
          source: "المورد الحديث (2008) — ترجمة contemner / contemnor"
      expands:
        - text: "«الْحَاءُ وَالْقَافُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، اسْتِصْغَارُ الشَّيْءِ. يُقَالُ شَيْءٌ حَقِيرٌ، أَيْ صَغِيرٌ. وَأَنَا أَحْتَقِرُهُ: أَيْ أَسْتَصْغِرُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن فعل «احتقر» من الجذر حقر مشتق اشتقاقاً صحيحاً بمعنى الاستصغار والاستهانة، مما يُرسّخ الأساس الاشتقاقي لـ«مُحْتَقِر» اسم فاعل"

    - lemma: "نَابِذ"
      contradicts:
        - text: "«نَابِذٌ: طارد من مركز» (centrifugal)"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          conflict: "نابذ استقر مصطلحاً علمياً تقنياً في عدة معاجم موحدة (نفط، طب، تشريح، لسانيات)، مما يجعل توظيفه في المعنى الإنساني المطلوب ملتبساً ومصادراً للمصطلح التقني"
      expands:
        - text: "«النُّونُ وَالْبَاءُ وَالذَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى طَرْحٍ وَإِلْقَاءٍ. وَنَبَذْتُ الشَّيْءَ أَنْبِذُهُ نَبْذًا: أَلْقَيْتُهُ مِنْ يَدِي»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الطرح المادي دون دلالة صريحة على الازدراء والاحتقار"

    - lemma: "مُسْتَخِفّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "رَافِض بَازْدِرَاء"
      decision: removed
      decision_reason: "عبارة وصفية حرة لا مصطلح مسكوك — يمكن إبدال «بازدراء» بـ«باستهانة» أو «باحتقار» ويظل الوصف صالحاً، فهو يفشل اختبار التثبيت المعجمي. لم يُسجَّل هذا التركيب وحدةً في أي معجم. جذر «رفض» يدل على مطلق الترك لا على الرفض المصحوب بالاحتقار."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "لَافِظ"
      decision: removed
      decision_reason: "جذر «لفظ» يدل على طرح الشيء من الفم (كلام أو طعام) لا على الرفض بازدراء. اللافظة في المعجمية الكلاسيكية صفة للبحر والديك والرحى. لم يرد لافظ بمعنى «شخص يرفض بازدراء» في أي مصدر معجمي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُزْدَرٍ"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من «ازدرى» (وزن مُفتعِل من جذر زري). الجذر يدل — حسب مقاييس اللغة — على «احتقار الشيء والتهاون به». ورد في المعجم الكبير صفةً غالبة للأسد «كأنه يستهين بكل من سواه»، وفي المورد الحديث ترجمةً مباشرة لـ contemner. يجمع بين الرفض والازدراء في بنية صرفية واحدة. التشكيل: مُزْدَرٍ (اسم فاعل منصرف)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على فعل الازدراء والاستهانة النشطة، مستمداً من جذر «زري» الدال صراحةً على الاحتقار؛ وهو الأقرب إلى دلالة spurner بوصفه فاعلاً للرفض المصحوب بالاحتقار الإرادي"
      actions:
        - command: create_entry
          params: {lemma: "مُزْدَرٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُحْتَقِر"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من «احتقر» (وزن مُفتعِل من جذر حقر). ورد في المورد الحديث مقروناً بـ«المزدري» ترجمةً مشتركة لـ contemner. مقاييس اللغة تُثبت أن «أحتقره: أستصغره». يدل على من يرى غيره حقيراً لا يستحق الاعتبار."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الموقف النفسي الداخلي (استصغار الآخر وتهوين شأنه) أكثر من فعل الرفض الظاهر؛ أعمّ من مُزْدَرٍ في الاستعمال الحديث"
      actions:
        - command: create_entry
          params: {lemma: "مُحْتَقِر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "نَابِذ"
      source: stage1
      decision: removed
      decision_reason: "استقر نابذ مصطلحاً علمياً راسخاً بمعنى «طرد مركزي» (centrifugal) في معاجم موحدة متعددة (نفط، طب، لسانيات، تشريح)، مما يجعل توظيفه بمعنى الشخص الرافض بازدراء ملتبساً. كما أن جذر نبذ يدل على الطرح المادي دون دلالة صريحة على الاحتقار."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُسْتَخِفّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أدلة معجمية. الاستخفاف دلالته أقرب إلى عدم الاكتراث والتهاون منه إلى الرفض الإرادي المقترن بالاحتقار الصريح، فهو أقل دقةً في تمثيل المفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


