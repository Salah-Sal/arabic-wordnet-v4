      - lemma: "غَرَوَانِيٌّ مَائِيٌّ"
        examples:
          - text: "تُستخدَم الغروانيات المائية كالبكتين والصمغ العربي مُثخِّناتٍ ومُثبِّتاتٍ في صناعة الألبان والحلويات."
            type: usage
          - text: "يعتمد طبيب الأسنان على مادة الألجينات وهي غَرَوانيٌّ مائيٌّ لاعكوس في أخذ طبعات الفكّ."
            type: usage
