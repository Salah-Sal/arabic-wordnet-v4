# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14615155-n (hydrocolloid)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «غرواني مائي» خالية من التشكيل"
      - "المجموعة تحتوي لمّة واحدة فقط، والمفهوم تقني متخصص يحتاج إثراء"
      - "التعريف العربي مختصر جداً ولا يميّز الغرواني المائي عن الهلام العادي"
    observations: "المفهوم (hydrocolloid) مصطلح كيميائي-غذائي يصف مادة غروانية أليفة للماء تكوّن هلاماً عند مزجها بالماء. المصطلح العربي المعتمد في المعجم الطبي الموحد هو «غَرَوَانِيٌّ مَائِيّ» وهو مركب وصفي واضح الدلالة. التعريف الحالي يحتاج تدقيقاً لأنه لا يذكر الطبيعة الغروانية للمادة."

  blind_candidates:
    - lemma: "غَرَوَانِيٌّ مَائِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «غَرَوَانِيّ» (منسوب إلى الغَرَوان/الغراء) و«مَائِيّ» (منسوب إلى الماء)، يقابل hydrocolloid بتفكيكه: hydro=مائي + colloid=غرواني. مسجّل في المعجم الطبي الموحد."
    - lemma: "مُهَلِّمٌ مَائِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «مُهَلِّم» (اسم فاعل من هَلَّمَ بمعنى كوَّن الهُلام) و«مَائِيّ»، يصف وظيفة المادة في تشكيل الهلام مع الماء."
    - lemma: "هِيدْرُوغِرْوَانِيّ"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الأجنبي hydrocolloid بنقحرة عربية، على وزن يقبل لام التعريف والنسبة."
    - lemma: "غَرَا مَائِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «غَرَا» (المادة اللاصقة، أصل الغَرَوَانِيّ) و«مائيّ»، اقتراح مختصر يعتمد على الأصل اللغوي."


stage2_evidence:
  per_lemma:
    - lemma: "غَرَوَانِيٌّ مَائِيٌّ"
      confirm:
        - text: "«غَرَوانِيٌّ مائِيّ — hydrocolloid — hydrocolloïde»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«غَرَوانِيٌّ مائِيٌّ لاعَكوس — irreversible hydrocolloid»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«غَرَوانِيٌّ مائِيٌّ عَكوس — reversible hydrocolloid»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«طَبْعَةٌ غَرَوانِيَّةٌ مائِيَّة — hydrocolloid impression»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«المادَّةُ الغرَوانِيَّةُ المائِيَّةُ المُنْطَبِعَة — hydrocolloid impression material»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«غَرَوَانِيّ — جملة تتألف من طور مستمر تتبعثر في أرجائه جسيمات دقيقة يتراوح قطرها بين (1-1000) نانمتر ولا تترسب بتأثير الثقالة»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يوضّح طبيعة المادة الغروانية من حيث حجم الجسيمات"
        - text: "«(الغرواني) مَا يشبه الغرا (مج)»"
          source: "المعجم الوسيط"
          addition: "يردّ المصطلح إلى أصله اللغوي: الغَرَا (المادة اللاصقة)"
        - text: "«غَرَوَانيّ — حالة انتشار لِجُسيمات منفصلة (صلبة، سائلة، غازية) في وسط آخر (صلب، سائل، غازيّ)»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "تعريف عام للحالة الغروانية في سياق علوم الأغذية"

    - lemma: "مُهَلِّمٌ مَائِيٌّ"
      contradicts:
        - text: "«مُهَلِّم — gel-forming agent; gellant; gelling agent — gélifiant»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "المُهَلِّم هو عامل التهليم (gelling agent) وليس المادة الغروانية المائية (hydrocolloid)؛ هما مفهومان مختلفان"
      expands:
        - text: "«هُلام مائيّ — hydrogel»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "الهُلام المائي (hydrogel) مفهوم مقارب لكنه مختلف عن الغرواني المائي"
        - text: "«هُلاَمَةٌ مائِيَّة — hydrogel»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "الهُلامة المائية مرادف للهلام المائي، تختلف عن الغرواني المائي"

    - lemma: "هِيدْرُوغِرْوَانِيّ"
      evidence_status: "no_material_found"

    - lemma: "غَرَا مَائِيّ"
      contradicts:
        - text: "«غراء (إسم) — gel, noun»"
          source: "موسوعة الكهرباء (IEC 60050)"
          conflict: "الغراء يُستخدم بمعنى gel وليس hydrocolloid، فالدلالة مختلفة"
        - text: "«غراء — colloid»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "الغراء في الفيزياء يقابل colloid العام لا hydrocolloid تحديداً"


stage3_analysis:
  per_lemma:
    - lemma: "غَرَوَانِيٌّ مَائِيٌّ"
      decision: confirmed
      decision_reason: "المصطلح مسجّل في المعجم الطبي الموحد مقابلاً لـ hydrocolloid، ومدعوم بعدة مركبات مشتقة منه (غرواني مائي لاعكوس، غرواني مائي عكوس). يحتاج تصحيح التشكيل فقط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح المعياري المعتمد في المعاجم الموحدة العربية لمقابلة hydrocolloid"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَرَوَانِيٌّ مَائِيٌّ"

    - lemma: "مُهَلِّمٌ مَائِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "المُهَلِّم مصطلح مستقل يعني «عامل التهليم» (gelling agent) وليس «الغرواني المائي» (hydrocolloid). الخلط بينهما خطأ مفهومي: الغرواني المائي مادة غروانية أليفة للماء، أما المهلّم فهو العامل المسبّب للتهلّم."
      evidence_assessment:
        case: contradicts_only

    - lemma: "هِيدْرُوغِرْوَانِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعريب غير مبرّر لوجود المقابل العربي المعتمد «غَرَوَانِيٌّ مَائِيٌّ» المسجّل في المعاجم الموحدة. التعريب ملاذ أخير ولا حاجة إليه هنا."
      evidence_assessment:
        case: no_material

    - lemma: "غَرَا مَائِيّ"
      source: stage1
      decision: removed
      decision_reason: "الغَرَا في الاصطلاح العلمي يقابل gel أو colloid عموماً، لا hydrocolloid تحديداً. استعماله هنا يوقع في اشتراك لفظي مع الغراء بمعنى المادة اللاصقة. المصطلح المعتمد «غَرَوَانِيّ» أدقّ لأنه نسبة صرفية تخصّصية."
      evidence_assessment:
        case: contradicts_only


stage4_content:
  definition:
    current: "مادة تشكل هلاماً مع الماء"
    assessment:
      decision: revise
      reason: "التعريف الحالي لا يذكر الطبيعة الغروانية للمادة ولا يميّزها عن المواد الأخرى المكوّنة للهلام. يفتقر إلى الجنس القريب (مادة غروانية) والفصل النوعي الدقيق."
    authored:
      - type: terminological
        text: "مَادَّةٌ غَرَوَانِيَّةٌ أَلِيفَةٌ لِلْمَاءِ تُكَوِّنُ هُلَاماً لَزِجاً عِنْدَ تَفَاعُلِهَا مَعَهُ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مَادَّةٌ غَرَوَانِيَّةٌ مَحَبَّةٌ لِلْمَاءِ، تَتَشَكَّلُ مِنْ جُسَيْمَاتٍ دَقِيقَةٍ مُنْتَشِرَةٍ فِي وَسَطٍ مَائِيٍّ، وَتُكَوِّنُ مَعَهُ هُلَاماً لَزِجاً. مِنْ أَمْثِلَتِهَا: النِّشَا وَالْجِيلَاتِينُ وَالصَّمْغُ الْعَرَبِيُّ وَالْبِكْتِينُ. تُسْتَخْدَمُ فِي الصِّنَاعَاتِ الْغِذَائِيَّةِ وَالصَّيْدَلَانِيَّةِ وَطِبِّ الْأَسْنَانِ"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَادَّةٌ غَرَوَانِيَّةٌ أَلِيفَةٌ لِلْمَاءِ تُكَوِّنُ هُلَاماً لَزِجاً عِنْدَ تَفَاعُلِهَا مَعَهُ"

  examples:
