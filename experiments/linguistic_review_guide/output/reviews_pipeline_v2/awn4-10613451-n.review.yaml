    - lemma: "مُبْهِر"
      expands:
        - text: "«مُبْهِر: مثال: ضوء مُبْهِر. الرأي: مرفوضة عند بعضهم. السبب: لاستعمال اسم الفاعل من الفعل «أَبْهَر»، مع عدم وروده في المعاجم، بدلاً من الفعل «بَهَرَ». الصواب والرتبة: ضوء باهِر [فصيحة] — ضوء مُبْهِر [صحيحة]. التعليق: أجاز مجمع اللغة المصري ما شاع من الأفعال الثلاثية المزيدة بالهمزة على أن تكون الهمزة لتقوية المعنى؛ ويجوز استكمال كلمات المادة قياسًا بتكوين اسم الفاعل «مُبْهِر»»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الكلمة مُجازة مجمعيًّا بمعنى الباهر المُدهش، غير أنها موظَّفة نعتًا للشيء المُبهِر (ضوء، عرض) لا اسمًا للشخص المحترف في الاستعراض"

