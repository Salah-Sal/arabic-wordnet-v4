      justification: "وزن فَعَّال من الجذر (ع-ر-ض) للدلالة على المحترف المكثار من تقديم العروض وإتقانها، قياسًا على نجَّار وحدَّاد وخيَّاط؛ يُفيد الضلوع في صنعة العرض والتضلُّع منها"
    - lemma: "مُبْهِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (أَبْهَرَ) على وزن مُفْعِل، مستمَدٌّ من معنى البَهْر (الغلبة والعلو) في مقاييس ابن فارس؛ يصف من يُدهش الجمهور بعروضه ويطغى عليه أثرًا، محاولةُ إحياء دلالي بصلة وظيفية واضحة"
    - lemma: "فَنَّان اسْتِعْرَاضِيّ"
      generation_method: tarkib
      justification: "مركب وصفي (فنان + نسبة استعراضي) يُقيِّد الفنان بتخصص الاستعراض والعرض الجماهيري المؤثر؛ يجري على ألسنة النقاد والصحفيين في وصف أصحاب الحضور الأدائي الاستثنائي، ويجتاز اختبار السكّ: لا يصح إبدال (فنان) بـ(شخص) أو (فاعل) مع الاحتفاظ بالمعنى الاصطلاحي ذاته"
    - lemma: "بَرَّاز"
      generation_method: ishtiqaq
      justification: "وزن فَعَّال من الجذر (ب-ر-ز) الذي يدل في مقاييس ابن فارس على ظهور الشيء وبدوِّه وتميُّزه؛ يصف من يبرز في تقديم ما يظهره أمام الجمهور، تجنُّبًا للاشتراك اللفظي في مشتقات (ع-ر-ض)"


