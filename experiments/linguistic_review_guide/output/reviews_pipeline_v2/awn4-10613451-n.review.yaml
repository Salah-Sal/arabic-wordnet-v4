# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "فَنَّان اسْتِعْرَاضِيّ"
      decision: confirmed
      decision_reason: "مركب وصفي (wasfi) راسخ الاستعمال في الخطاب النقدي والصحفي العربي للدلالة على الفنان المتخصص في تقديم العروض الجماهيرية المؤثرة. يجتاز اختبار السكّ (لا يصح إبدال «فنان» بمرادف مع الاحتفاظ بالمعنى الاصطلاحي). يجتاز اختبار التثبيت المعجمي (وحدة معجمية ثابتة في الاستعمال المتداوَل رغم غياب مدخل مستقل في قاعدة البيانات). المكوِّنان (فنان + استعراضي) موثَّقان دلاليًّا كل على حدة. تطابق المركب مع المرشح الثالث من التوليد الأعمى تأكيدٌ إضافي على صواب اختياره. التشكيل الكامل حاضر دون حاجة لتصحيح."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يختصّ بالفنان الأدائي المتقن لصناعة الاستعراض الجماهيري في الفضاء الأدائي (مسرح، تلفزيون، فعاليات كبرى)؛ يتمايز عن المُؤَدِّي (مُؤَدٍّ) الذي يُنجز عرضًا دون اشتراط التأثير الجماهيري الشامل، وعن المُقَدِّم الذي يعرض مادةً معلوماتية دون اشتراط الإبداع الاستعراضي، وعن مخرج العرض الذي يُشرف على الإنتاج دون حضور أدائي مباشر أمام الجمهور"

    - lemma: "مُسْتَعْرِض"
      decision: removed
      decision_reason: "هيمنة دلالية حادة في المعجمية العلمية الحديثة: ثمانية مداخل أو أكثر في معاجم الفيزياء والتشريح والجيولوجيا والكهرباء تُثبِّت الكلمة بمعنى transverse (عرضي/متعامد). هذا التعارض يُعطِّل توظيفها بمعنى صاحب الاستعراض ويُوقع القارئ المتخصص في لبس حاد. فحص الاشتقاقية: الوزن الاستفعالي يُفيد الطلب لا الحِرفة المهنية. فحص المعيار: لا يستوفي شرط يُسر التداول لما يُحدثه من خلط بين دلالتين متضادتين في نصوص متاحة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عَرَّاض"
      source: stage1
      decision: removed
      decision_reason: "لم يرد في المعجمية العربية المتاحة بمعنى المحترف في تقديم العروض. الاشتقاق صحيح صرفيًّا (فَعَّال من ع-ر-ض) ومقبول نظريًّا، لكنه غير مُثبَّت معجميًّا؛ اعتماده يُفضي إلى نيولوجيزم غير مُسكَّك لا يجوز إدراجه في المعجم الشبكي دون توثيق استعمال فعلي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُبْهِر"
      source: stage1
      decision: removed
      decision_reason: "الكلمة مُجازة مجمعيًّا كصفة للشيء المُدهش (ضوء مُبْهِر، عرض مُبْهِر)، غير أن وظيفتها الصرفية (اسم فاعل نعتي على مُفْعِل) تدل على مَن يُحدث الإبهار في وصف شيء، لا على المحترف صاحب مهنة الاستعراض. فحص POS: صفة لا اسم ذات. فحص الملاءمة الصرفية: وزن مُفْعِل لا يقابل وظيفيًّا وزن فَعَّال الحرفي ولا وزن فَاعِل الذي يصف الشخص المحترف بصورة طبيعية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "بَرَّاز"
      source: stage1
      decision: removed
      decision_reason: "الكلمة مستخدمة في موسوعة الأسماء الشخصية فحسب بمعنى (كثير الظهور)، وهو سياق علَمي اسمي لا مصطلحي مهني. علاوةً على ذلك فإن الجذر (ب-ر-ز) يحمل في المعجمية العلمية والطبية الراسخة (8+ مداخل) دلالة (excrement) تُثبِّط توظيف أي مشتق منه بمعنى مهني إيجابي؛ يُفضي التداعي الذهني إلى إحراج غير مقبول."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


