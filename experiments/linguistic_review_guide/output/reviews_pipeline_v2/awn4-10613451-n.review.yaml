stage2_evidence:
  per_lemma:
    - lemma: "فَنَّان اسْتِعْرَاضِيّ"
      expands:
        - text: "«(1) عَرْض: إظهار للبراعة أو القوة أو الثروة إلخ. (2) استعراض عسكريّ. (3) موكب؛ رَتل. (6) يَعْرِض بتباهٍ to parade one's skill»"
          source: "المورد الحديث (2008)"
          addition: "يكشف أن (العرض/الاستعراض) في العربية المعاصرة يشمل إظهار البراعة والمهارة أمام الجمهور، مما يدعم الجذر الدلالي للمركب"
        - text: "«مُخرج العرض — showman»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
          addition: "يُثبّت أن المعجمية العربية ربطت (showman) بمصطلح آخر (مخرج العرض)، وهو ما يُفسّر غياب مصطلح قائم بذاته يقابل (showperson)"
        - text: "«مُخْرِج المسرحية أو الاستعراض المَسْرحي — showman»"
          source: "المورد الحديث (2008)"
          addition: "تأكيد على أن الترجمة الراسخة لـ(showman) في العربية تنحو نحو الإخراج لا الأداء المباشر"

    - lemma: "مُسْتَعْرِض"
      contradicts:
