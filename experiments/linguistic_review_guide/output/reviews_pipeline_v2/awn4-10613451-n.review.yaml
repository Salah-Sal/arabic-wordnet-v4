          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "الكلمة راسخة في اللغة العلمية بمعنى عرضي/متعامد (transverse)، وهو نقيض معنى صاحب الاستعراض"
        - text: "«مستعرض — عمودي على الاتجاه الرأسي»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "تكريس المعنى التقني الجيولوجي المناقض للمعنى المنشود"
        - text: "«مُسْتَعْرِض — transversalis NA / transverse / transversus NA»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "ثلاثة مداخل طبية تُثبِّت الكلمة في الاستخدام التشريحي المناقض كليًّا"
        - text: "«مستعرض — transverse / broadside»"
          source: "موسوعة الكهرباء (IEC 60050)"
          conflict: "مزيد من التوظيف التقني المناقض في علم الكهرباء"

    - lemma: "عَرَّاض"
