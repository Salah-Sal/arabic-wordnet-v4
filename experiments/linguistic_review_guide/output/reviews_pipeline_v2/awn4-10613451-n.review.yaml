stage1_review:
  assessment:
    concerns:
      - "لمّة (مُسْتَعْرِض) ذات تعارض دلالي حاد مع الاستخدام التقني الراسخ: موثَّقة في معاجم الفيزياء والتشريح والجيولوجيا والكهرباء بمعنى transverse (عرضي/متعامد) وهو نقيض المعنى المنشود كليًّا"
      - "التعريف الحالي مُستنسَخ ترجميًّا من الإنجليزية دون صياغة عربية أصيلة بأسلوب المعجم الوسيط"
      - "المركب (فَنَّان اسْتِعْرَاضِيّ) يميل نحو المجال الترفيهي الفني الضيّق، في حين أن (showperson) يشمل المقدِّمين والخطباء وأصحاب العروض الاحترافية على اختلاف مجالاتها"
      - "غياب مصطلح مفرد متثبَّت في المعجمية العربية يقابل (showperson) بمعناه الجامع الشامل"
    observations: "المجموعة تمثّل مفهوم الشخص المتقن لإنجاح العروض وإبهار الجمهور. الإشكالية الجوهرية أن (مُسْتَعْرِض) — الاشتقاق الصرفي الطبيعي من الباب الاستفعالي — قد هيمنت عليه الدلالة التقنية في المعجمية العلمية الحديثة مما يُعطِّل توظيفه لغرض هذه المجموعة. كذلك يتبيّن من جسر اللغة الإنجليزية أن معجميين عرباً ترجموا (showman) بـ(مخرج العرض) مما يكشف عن اختزال المفهوم في البُعد الإخراجي الفني. يبقى (فَنَّان اسْتِعْرَاضِيّ) أوفر اللمّات نسبةً إلى المفهوم المقصود رغم ميله نحو الدائرة الترفيهية الأدائية."
