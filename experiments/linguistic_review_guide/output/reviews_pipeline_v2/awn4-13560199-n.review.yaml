# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13560199-n — population growth
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (نمو سكاني)، وهي تركيب وصفي يحتاج إلى تأكيد تثبيته المعجمي"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي، يحتاج إلى صياغة معجمية أصيلة"
    observations: "المفهوم يندرج تحت مجال الديموغرافيا والعلوم الاجتماعية. المجموعة الأعلى (hypernym) هي عملية النمو/الزيادة العامة، وهذه المجموعة تخصّصها بالسكان. المصطلح مستقر في الاستعمال المعاصر في سياقات التنمية والاقتصاد والبيئة، لكنّه تركيب وصفي (نعتي) وليس لفظة مفردة."
  blind_candidates:
    - lemma: "تَكَاثُرٌ سُكَّانِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين تَكَاثُر (من كثر، على وزن تَفَاعُل الدال على التشارك والتزايد) وسُكَّانِيّ (نسبة إلى سُكَّان). يُفيد معنى تزايد أعداد السكان بالتوالد."
    - lemma: "تَزَايُدٌ سُكَّانِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من تَزَايُد (مصدر تزايَدَ، على وزن تَفَاعُل، يفيد الزيادة التدريجية المتبادلة) وسُكَّانِيّ. يؤدي معنى الازدياد التدريجي في عدد السكان."
    - lemma: "نَمَاءٌ سُكَّانِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من نَمَاء (مصدر نمى، بمعنى الزيادة والكثرة، لفظ تراثي أصيل) وسُكَّانِيّ. يحمل دلالة البركة والنماء الطبيعي في الزيادة."
    - lemma: "ازْدِيَادٌ سُكَّانِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من ازْدِيَاد (مصدر ازدادَ، افتعال من زيد) وسُكَّانِيّ. يركّز على مفهوم الفضل والزيادة المحضة في عدد السكان."


stage2_evidence:
  per_lemma:
    - lemma: "نُمُوٌّ سُكَّانِيّ"
      confirm:
        - text: "«يبلغ النمو السكاني العالمي الحالي ما بين 75 و 80 مليون نسمة سنويا، أو 1.1 % سنويا. ويتركز هذا التزايد السكاني أساسا بالدول النامية بإفريقيا وآسيا وأمريكا الوسطي والجنوبية.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«نمو سكاني — population growth»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«نمو سكاني — population growth»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
      expands:
        - text: "«نمو السكان — population growth»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
          addition: "صيغة إضافية بديلة للمركب الوصفي"
        - text: "«مُعَدَّلُ النُّمُوِّ السُّكَّانِيّ — population growth rate»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المصطلح مستخدم في تركيبات اصطلاحية أوسع"
        - text: "«نمو الجماعة — population growth»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "بديل إضافي يستخدم الجماعة بدل السكان"

    - lemma: "تَكَاثُرٌ سُكَّانِيّ"
      contradicts:
        - text: "«اولا: تكاثر جنسي: التعاقب المنتظم للانقسام الاختزالي والإخصاب، والذي تنتج عنه الذرية (النسل)... ثانيا: تكاثر لاجنسي...»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          conflict: "تكاثر مخصص للتكاثر البيولوجي (reproduction) وليس للنمو السكاني الديموغرافي"
        - text: "«تكاثر — reproduction»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "يقابل reproduction لا population growth"
        - text: "«تَكاثُر — proliferation»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "يقابل proliferation في السياق الطبي"

    - lemma: "تَزَايُدٌ سُكَّانِيّ"
      confirm:
        - text: "«ويتركز هذا التزايد السكاني أساسا بالدول النامية»"
          source: "مسرد المناخ والبيئة (ArabTerm) — ضمن تعريف نمو سكاني"
      expands:
        - text: "«تزايد السكان — demographic increase»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "الصيغة الإضافية مسجّلة، لكن الترجمة demographic increase وليس population growth تحديداً"

    - lemma: "نَمَاءٌ سُكَّانِيّ"
      contradicts:
        - text: "«النَّمَاء: الذي يتحدَّث مع القوم فينمَّ عليهم فيكشف ما يكرهون كشفَه.»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "النماء في هذا المصدر بمعنى النمّام، لا الزيادة"
      expands:
        - text: "«نَمَى — النُّونُ وَالْمِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَزِيَادَةٍ. وَنَمَى الْمَالُ يَنْمِي: زَادَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الزيادة لكن المصدر نَمَاء لم يُسجَّل في سياق ديموغرافي"

    - lemma: "ازْدِيَادٌ سُكَّانِيّ"
      expands:
        - text: "«ازْدِياد — augmentation»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "ازدياد مسجّل بمعنى augmentation عام، لكن المركب ازدياد سكاني غير مسجّل كوحدة معجمية"


stage3_analysis:
  per_lemma:
    - lemma: "نُمُوٌّ سُكَّانِيّ"
      decision: confirmed
      decision_reason: "مصطلح مثبّت في ثلاثة معاجم اصطلاحية عربية (مسرد المناخ والبيئة، معجم التجارة والمحاسبة، مسرد الجغرافيا والتاريخ) كمقابل لـ population growth. يحمل تعريفاً اصطلاحياً واضحاً. تركيب وصفي مستقر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُمُوٌّ سُكَّانِيّ"

    - lemma: "تَكَاثُرٌ سُكَّانِيّ"
      source: stage1
      decision: removed
      decision_reason: "تكاثر مصطلح بيولوجي مخصص لمعنى reproduction/proliferation في المعاجم الاصطلاحية العربية. استخدامه للنمو السكاني الديموغرافي يُحدث خلطاً مع دلالته الأصلية في علم الأحياء."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَزَايُدٌ سُكَّانِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "ورد التزايد السكاني في تعريف نمو سكاني ذاته كمرادف سياقي. كما سُجِّل تزايد السكان (الصيغة الإضافية) في معجم التجارة والمحاسبة بمعنى demographic increase. المركب الوصفي طبيعي ومنسجم مع النظام الاصطلاحي العربي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على الجانب الكمّي المحض (الزيادة العددية التدريجية)، بينما نُمُوّ سُكَّانِيّ أعمّ ويشمل أبعاد التطوّر والتحوّل لا الزيادة العددية فحسب."
      actions:
        - command: create_entry
          params: {lemma: "تَزَايُدٌ سُكَّانِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "نَمَاءٌ سُكَّانِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم أن الجذر (نمي) يدلّ على الزيادة في مقاييس اللغة، إلا أن المصدر نَمَاء لم يُسجَّل في أي معجم اصطلاحي في سياق ديموغرافي، كما أن النَّمَاء في بعض المصادر يُلتبس بالنمّام. المركب غير مثبّت معجمياً."
      evidence_assessment:
        case: mixed

    - lemma: "ازْدِيَادٌ سُكَّانِيّ"
      source: stage1
      decision: removed
      decision_reason: "ازدياد بمفرده مسجّل بمعنى عام (augmentation)، لكن المركب ازدياد سكاني غير مسجّل كوحدة معجمية في أي مصدر اصطلاحي. لا يجتاز اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material


