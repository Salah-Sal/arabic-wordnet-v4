# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14608682-n (pyrogen)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بيروجين» تعريب غير موحّد ولا مُعجَمي؛ لم يرد في أيّ معجم مصطلحي معتمد"
      - "اللمّة «مولد الحمى» بلا تشكيل، والصيغة الصحيحة المثبتة في المعجم الطبي الموحد هي «مُوَلِّدُ الحُمَّى»"
      - "غياب المصطلح المفرد «مُحِمّ» الوارد في معجمات الكيمياء والصيدلة والطب"
    observations: >
      المجموعة تدلّ على مفهوم طبّي/كيميائي واضح: مادّة تُسبّب ارتفاع حرارة الجسم (الحُمّى).
      الجذر العربي «ح م م» غنيّ بالدلالة الحرارية، ومنه اشتُقّ مصطلح «مُحِمّ» (اسم فاعل من أَحَمَّ)
      المُثبَت في عدّة معجمات مصطلحية عربية. التركيب الإضافي «مُوَلِّدُ الحُمَّى» مُثبَت أيضاً
      في المعجم الطبّي الموحّد. أمّا «بيروجين» فتعريب عامّي لا يرد في أيّ معجم معتمد.
  blind_candidates:
    - lemma: "مُحِمٌّ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من أَحَمَّ يُحِمُّ (أصاب بالحُمَّى)، على وزن مُفْعِل الدالّ على الإحداث والتسبيب.
        الجذر «ح م م» أصيل في الدلالة على الحرارة والحُمّى.
    - lemma: "مُسَعِّرٌ"
      generation_method: majaz
      justification: >
        مجاز من سَعَّرَ النارَ أي أوقدها وأشعلها، فالمُسَعِّر ما يُسعِر حرارة الجسم
        ويُوقد فيه الحُمَّى. إزاحة دلالية من إشعال النار إلى إثارة الحرارة في البدن.
    - lemma: "مُوَلِّدُ الحُمَّى"
      generation_method: tarkib
      justification: >
        تركيب إضافيّ من «مُوَلِّد» (اسم فاعل من وَلَّدَ) و«الحُمَّى»، واضح الدلالة على
        ما يُنتج الحُمَّى ويُحدثها. نمط تركيبي منتج في المصطلحية الطبية العربية.
    - lemma: "بَيْرُوجِين"
      generation_method: taarib
      justification: >
        تعريب المصطلح الإنجليزي pyrogen (من اليونانية πῦρ نار + γένος مُولِّد).
        يقبل لام التعريف والجمع السالم (بيروجينات). ملاذ أخير بعد المرشحات العربية.


stage2_evidence:
  per_lemma:
    - lemma: "بيروجين"
      evidence_status: "no_material_found"

    - lemma: "مُوَلِّدُ الحُمَّى"
      confirm:
        - text: "«مُوَلِّدٌ للحُمَّى» — pyrogen"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُوَلِّدٌ للحُمَّى» — pyretogen (pyrogen)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُوَلِّدُ الحُمَّى الجُرْثومِيّ (ذيفان داخِلِيّ)» — bacterial pyrogen (endotoxin)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مَوَلِّدُ الحُمَّى الدَّاخِلِيّ المَنْشَأ» — endogenous pyrogen"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مَوَلِّدُ الحُمَّى الخارِجِيُّ المَنْشَأ» — exogenous pyrogen"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«مولد» لاحقة تعني العامل المولد لشيء أو حالة ما"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "يؤكّد إنتاجية نمط «مُوَلِّد + المفعول» في المصطلحية الطبية"

    - lemma: "مُحِمٌّ"
      confirm:
        - text: "«محِمّ» — pyrogen"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«مُحِمّ: مسبب للحمى» — pyrogenic"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مُحِمّ: ما يحدث الحمى» — febricant"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«مُحِمّ» — febrifacient"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«المُحِمّة: مادّة مُوَلِّدةٌ للحُمَّى (ك)» — pyrogen"
          source: "المورد الحديث (2008)"
        - text: "«خالٍ من المُحِمَّة: خالٍ من المواد التي تسبب ارتفاع حرارة الجسم» — pyrogen free"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«مُحْدِثُ الحُمَّى» — febricant (pyrogen)"
          source: "المعجم الطبي الموحد (2009)"
          addition: "مرادف تركيبي بديل يُؤكّد الحقل الدلالي نفسه"

    - lemma: "مُسَعِّرٌ"
      contradicts:
        - text: "«مِسْعر» — calorimeter (مقياس كمية الحرارة)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "المِسْعَر مصطلح مُثبَت في الفيزياء والكيمياء بمعنى جهاز قياس الحرارة (calorimeter)، فاستعماله بمعنى pyrogen يُوقع في اشتراك لفظي مُضلِّل"
        - text: "«مسعّر» — rated (مُسَعَّر: محدّد السعر)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "اشتراك لفظي إضافي في مجال التجارة"
      expands:
        - text: "«المسعر: المسعار ويقال هو مسعر حرب لموقد الحرب»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية على إيقاد النار والحرب، ليس على إثارة الحُمَّى"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "بيروجين"
      decision: removed
      decision_reason: >
        تعريب عامّي غير مُوحَّد لا يرد في أيّ معجم مصطلحي معتمد (لا في المعجم الطبي الموحد
        ولا في معجمات ALECSO). في المقابل، المصطلحان العربيّان «مُحِمّ» و«مُوَلِّدُ الحُمَّى»
        مُثبَتان في عدّة معجمات. لا مسوّغ لإبقاء تعريب دون سند معجمي مع وجود بديل عربي راسخ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُوَلِّدُ الحُمَّى"
      decision: confirmed
      decision_reason: >
        مُثبَت في المعجم الطبي الموحد (2009) بصيغة «مُوَلِّدٌ للحُمَّى» مقابل pyrogen
        في عدّة مداخل، وكذلك في صيغ مركّبة (مُوَلِّدُ الحُمَّى الجُرْثومِيّ، الداخليّ المنشأ،
        الخارجيّ المنشأ). تركيب إضافي واضح الدلالة ومنتج في المصطلحية الطبية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تركيب إضافي تحليلي يُفصّل آلية العمل (توليد الحُمَّى)، أوضح للقارئ غير المتخصّص
        من المصطلح المفرد «مُحِمّ»، ويُستخدم في السياقات التوضيحية والتثقيفية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَلِّدُ الحُمَّى"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُحِمٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مفرد مُثبَت في أربعة معجمات مصطلحية معتمدة: معجم الكيمياء (1992) مقابل pyrogen،
        معجم الصيدلة (2009) مقابل pyrogenic، معجم المصطلحات الطبية (2003) مقابل febricant
        وfebrifacient، والمورد الحديث (2008) بصيغة «المُحِمّة» مقابل pyrogen. اسم فاعل
        من أَحَمَّ على وزن مُفْعِل، مطّرد صرفياً وواضح اشتقاقياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصطلح مفرد مختصر يُستخدم في السياق العلمي التخصّصي، أكثر إيجازاً
        من التركيب الإضافي «مُوَلِّدُ الحُمَّى» ومناسب للاستعمال الاصطلاحي الدقيق.
      actions:
        - command: create_entry
          params:
            lemma: "مُحِمٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُسَعِّرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المِسْعَر مصطلح مُثبَت في الفيزياء والكيمياء بمعنى calorimeter (جهاز قياس الحرارة)،
        واستعماله بمعنى pyrogen يُوقع في اشتراك لفظي مُضلِّل في المجال العلمي نفسه.
        كما أنّ «مُسَعَّر» يعني «محدَّد السعر» في مجال التجارة. لا مسوّغ لتحميل اللفظ
        دلالة ثالثة مع وجود بدائل عربية راسخة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُوَلِّدُ الحُمَّى"
      source: stage1
      decision: removed
      decision_reason: >
        مُطابق للمّة موجودة أُكِّدت أعلاه؛ لا حاجة إلى تكرارها.

    - lemma: "بَيْرُوجِين"
      source: stage1
      decision: removed
      decision_reason: >
        مُطابق للمّة موجودة حُذفت أعلاه لعدم ورودها في أيّ معجم مصطلحي معتمد.


stage4_content:
  definition:
    current: "أي مادة يمكن أن تسبب ارتفاعاً في درجة حرارة الجسم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزية، و«أيّ» أداة تعميم لا تناسب التعريف المعجمي،
        و«يمكن أن» تُضعف الحتمية الدلالية. يحتاج إلى صياغة اصطلاحية بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: "مادَّةٌ تُسَبِّبُ ارْتِفاعَ دَرَجَةِ حَرارَةِ الجِسْمِ (الحُمَّى)"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مادَّةٌ حَيَوِيَّةٌ أَوْ كِيمِيائِيَّةٌ تُثِيرُ ارْتِفاعَ حَرارَةِ الجِسْمِ عَنْ مُعَدَّلِها
          الطَّبِيعِيِّ؛ قَدْ تَكُونُ خارِجِيَّةَ المَنْشَأِ كَالذِّيفاناتِ الجُرْثُومِيَّةِ، أَوْ داخِلِيَّةً
          كَالسِّيتُوكِيناتِ الَّتِي تُفْرِزُها خَلايا المَناعَةِ.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادَّةٌ تُسَبِّبُ ارْتِفاعَ دَرَجَةِ حَرارَةِ الجِسْمِ (الحُمَّى)"

  examples:
    per_lemma:
      - lemma: "مُوَلِّدُ الحُمَّى"
        examples:
          - text: "يجب أن تكون المحاليل الوريدية خالية من أيّ مُوَلِّد للحُمَّى قبل حقنها في المريض."
            type: usage
      - lemma: "مُحِمٌّ"
        examples:
          - text: "أظهر التحليل المخبري أنّ العيّنة تحتوي على عامل مُحِمّ من أصل جرثومي."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يجب أن تكون المحاليل الوريدية خالية من أيّ مُوَلِّد للحُمَّى قبل حقنها في المريض."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أظهر التحليل المخبري أنّ العيّنة تحتوي على عامل مُحِمّ من أصل جرثومي."


