# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-00021445-n (food / nutrient)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «مُغَذٍّ» اسم فاعل من غَذَّى يدلّ على الفاعل (ما يُغذّي)، فقد يُلبس بالصفة (nourishing) لا بالاسم (nutrient)، لكنّه مقبول في الاصطلاح العلمي الحديث."
      - "التعريف يستعمل فعل «يستقلب» وهو مصطلح حديث دقيق، يُفضَّل التحقّق من شيوعه في المعاجم."
    observations: "المجموعة تمثّل مفهوم الغذاء بوصفه مادّة قابلة للاستقلاب عند الحيوان لإنتاج الطاقة وبناء الأنسجة. اللمّتان الموجودتان (غِذَاء ومُغَذٍّ) تغطّيان المفهوم من زاويتين: غِذَاء بوصفه الاسم العامّ للمادّة الغذائية، ومُغَذٍّ بوصفه المصطلح العلمي المقابل لـ nutrient. الفارق بينهما دقيق لكنّه قائم."
  blind_candidates:
    - lemma: "غِذَاء"
      generation_method: ishtiqaq
      justification: "من الجذر غ-ذ-و على وزن فِعَال، أشيع لفظ عربي فصيح يدلّ على ما يتغذّى به الجسم من طعام وشراب."
    - lemma: "قُوت"
      generation_method: ishtiqaq
      justification: "من الجذر ق-و-ت، يدلّ على ما يقوم به البدن ويُمسك الرمق، وزنه فُعْل."
    - lemma: "طَعَام"
      generation_method: ishtiqaq
      justification: "من الجذر ط-ع-م على وزن فَعَال، يدلّ على كلّ ما يُؤكل ويُتغذّى به."
    - lemma: "مُغَذٍّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من غَذَّى (فعّل) على وزن مُفَعِّل، يدلّ على المادّة ذات الخاصّية التغذوية، شائع في المصطلحات العلمية العربية بمعنى nutrient."

stage2_evidence:
  per_lemma:
    - lemma: "غِذَاء"
      confirm:
        - text: "«ما يكون به نماء الجسم وقوامه من الطعام والشراب»"
          source: "المعجم الوسيط"
        - text: "«ما مِن شأنه أن يصير بدَل ما يتحلّل، كالحنطة والخبز والأرزّ واللحم والسمك»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«أي مادة تمتص من قبل الكائنات العضوية لتعزيز نموها أو تسهيله»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«ما يُؤثر فيه بمادته فقط»"
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "«الغذاء في الطبّ يقال على معنيين: أحدهما على الجسم الذي خلع الصورة الغذائية ولبس الصورة العضوية وهو غذاء بالفعل، وثانيهما على الجسم الذي هو بالقوة كذلك»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تفصيل اصطلاحي طبّي يميّز بين الغذاء بالفعل والغذاء بالقوة"

    - lemma: "مُغَذٍّ"
      confirm:
        - text: "«مغذ = nutrient; nutritive»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«مغّذٍ، مادة مغدية = nutrient»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«مُغَذٍّ؛ مُقيت — مادة مُغَذِّية = nutrient»"
          source: "المورد الحديث (2008)"
        - text: "«غُذيّ، عنصر مُغَذِّ = nutrient; nutriment»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«مُغَذٍّ (مُغَذِّي) = nourishing»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستعمل أيضاً صفةً بمعنى مُغذٍّ (nourishing)، ممّا يؤكّد الازدواجية بين الاسمية والوصفية"

    - lemma: "طَعَام"
      confirm:
        - text: "«كلّ ما يُؤكل وبه قوام البدن»"
          source: "المعجم الوسيط"
        - text: "«كل ما يمكن أن يغذي الجسم أو يبني أنسجته أو يمدّه بالحرارة إذا ما أدخل إليه»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      contradicts:
        - text: "«الطعام: البُرُّ، وما يُؤكل»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "طَعَام يغلب عليه معنى المأكول الجاهز أو البُرّ عند أهل الحجاز، وليس المادّة الغذائية بالمعنى العلمي"
        - text: "«الطعام عند أهل الحجاز البرّ خاصة، وفي العرف الطعام اسم لما يؤكل والشراب اسم لما يشرب»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "طعام في الاستعمال اللغوي أعمّ من المادّة الغذائية، فهو يشمل كلّ مأكول سواء أغذّى أم لا"

    - lemma: "قُوت"
      contradicts:
        - text: "«ما يقوم به بدن الإنسان من الطعام»"
          source: "المعجم الوسيط"
          conflict: "القوت مقصور على الإنسان وعلى الحدّ الأدنى الذي يُمسك الرمق، والمجموعة تشمل الحيوان عموماً"
        - text: "«ما يمسك الرمق»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "القوت أضيق دلالياً من الغذاء، إذ يدلّ على الكفاف لا على كلّ مادة غذائية"
        - text: "«المُسكَة من الرزق»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "يدلّ على الحدّ الأدنى من الرزق، لا على المادّة المغذّية عموماً"

stage3_analysis:
  per_lemma:
    - lemma: "غِذَاء"
      decision: confirmed
      decision_reason: "لمّة عربية فصيحة أصيلة من الجذر غ-ذ-و، مؤكَّدة في المعجم الوسيط وكشّاف الاصطلاحات والمعاجم التقنية الحديثة. تدلّ على ما يتغذّى به الجسم من مادّة، وتطابق تعريف المجموعة تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الاسم العامّ للمادّة الغذائية بوصفها جنساً، يشمل الطعام والشراب معاً، ويُستعمل في السياقات العامّة والعلمية على حدٍّ سواء."

    - lemma: "مُغَذٍّ"
      decision: confirmed
      decision_reason: "مصطلح علمي عربي مُقَرّ في معاجم ALECSO (الأحياء والكيمياء والطبّ)، يقابل nutrient تحديداً. وإن كان في الأصل اسم فاعل، فقد استقرّ اصطلاحاً اسماً للمادّة ذات الخاصّية التغذوية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الوظيفة التغذوية للمادّة (ما يُغذّي)، ويُستعمل في السياقات العلمية والتقنية أكثر من الاستعمال العامّ، ويقابل nutrient تحديداً بخلاف غِذَاء الأعمّ."

    - lemma: "طَعَام"
      source: stage1
      decision: removed
      decision_reason: "طعام أوسع دلالياً من المجموعة المطلوبة: يدلّ على كلّ مأكول سواء أغذّى أم لا، ويغلب عليه معنى الطعام المُعَدّ للأكل لا المادّة القابلة للاستقلاب. كما أنّه يُقابل في ووردنت الإنجليزي مجموعة food (المأكول) لا food/nutrient (المادّة الغذائية)."
      evidence_assessment:
        case: mixed

    - lemma: "قُوت"
      source: stage1
      decision: removed
      decision_reason: "القوت أضيق دلالياً: يدلّ على الحدّ الأدنى الذي يُمسك الرمق ويقوم به البدن، وهو مقصور في المعاجم على الإنسان غالباً، بينما المجموعة تعمّ الحيوان. ودلالته على الكفاف تُبعده عن مفهوم المادّة الغذائية العامّ."
      evidence_assessment:
        case: contradicts_only

