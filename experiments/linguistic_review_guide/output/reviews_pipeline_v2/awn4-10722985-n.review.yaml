# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة مُوصٍ تفتقر إلى التشكيل الكامل: السكون على الواو غائب (الصواب: مُوْصٍ كما تكتبه المورد الحديث)"
      - "المجموعة تضم لمة واحدة فقط؛ المفهوم القانوني يستحق بحثاً عن مرادفات أو صيغ بديلة"
      - "التعريف العربي الحالي (شخص يكتب وصية) يحصر إنشاء الوصية في الكتابة ويُهمل الوصية الشفهية المعتبرة فقهاً"
    observations: >
      المجموعة تُعالج مفهوماً فقهياً-قانونياً أصيلاً: الشخص الذي يُنشئ وصيةً يُوزِّع بها تركته بعد وفاته.
      الجذر العربي وصي عريق، وابن فارس يردُّه إلى معنى الوصل (الوصيةُ كلامٌ يُوصَلُ من المُوصِي إلى الورثة).
      اسم الفاعل من أَوصى الرباعي هو مُوصٍ وهو الأنسب اشتقاقاً. الجدير بالذكر أن المُحكم لابن سيده نصَّ على
      أن وصيٌّ كان يُستخدم بمعنى المُوصِي أيضاً، وهو ما انقرض في الاستعمال الحديث الذي خصَّص وصيٌّ للمُنفِّذ
      (executor) لا للصانع.
  blind_candidates:
    - lemma: "مُوصٍ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل الرباعي أَوصى على وزن مُفعِل (مُوصِي)، يُقال في حالة الرفع مُوصٍ (الاسم المنقوص).
        الجذر وصي يدلُّ على الوصل، والوصيةُ كلامٌ يُوصَلُ من المُوصِي إلى الورثة. هذا هو المصطلح الفقهي
        الأمثل لصانع الوصية، مُستوفٍ لشروط الاشتقاق القياسي.
    - lemma: "مُوَرِّث"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من وَرَّثَ (فعَّل للتعدية)، يدلُّ على من يُورِّث غيره ماله. يُستعمل في السياق القانوني
        للإحالة إلى صاحب التركة الذي ترك وصية، وقد وردت له ترجمة testate في معاجم حديثة. غير أن دلالته
        أعمّ من مُوصٍ إذ يشمل المتوفَّى بلا وصية.
    - lemma: "كَاتِبُ الوَصِيَّة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من (كاتب) اسم فاعل من كتب و(الوصية). يصف الشخص من زاوية الفعل المادي (الكتابة)،
        وهو وصف شائع في الاستعمال اليومي، وإن كان أقل دقةً من المصطلح الفقهي مُوصٍ لقصوره عن الوصية
        الشفهية.
    - lemma: "وَاصٍ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل الثلاثي وصَى على وزن فَاعِل (وَاصٍ، منقوص). يستند إلى الجذر ذاته وصي بمعنى
        أوصى وعهد. غير أن هذا الوزن شاع في اللغة بمعنى (المتصل/المتواصل) ومنه أرضٌ واصية، مما يُثير
        التباساً دلالياً يستوجب التحقق المعجمي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات مُنفَّذة (٥ استعلامات):
# (١) مطابقة دفعية: موص، الموص، واص، الواص، وصي، الوصي، موصي، الموصي
# (٢) جسر إنجليزي: testator، testate، will maker، testamentary
# (٣) إثراء بالمعرِّف: entry_ids 414519، 414518، 722883، 722884
# (٤) FTS عربي: وصية، يوصي، الموصي، أوصى
# (٥) مقاييس اللغة لابن فارس (dictionary_id=151) لجذر وصي
stage2_evidence:
  per_lemma:
    - lemma: "مُوصٍ"
      confirm:
        - text: "«موصٍ — [ترجمة: testator] — [مجال: Law]»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«(1) مُوْصٍ: تاركٌ وصيّةً شرعية He died testate.»"
          source: "المورد الحديث (2008)"
        - text: "«المُوْصِي: من يترك وصيّة شرعيةً.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: >
            «(وَصَى) الواوُ والصادُ والحرفُ المعتلُّ: أصلٌ يدلُّ على وصلِ شيءٍ بشيءٍ. وَوَصَيْتُ الشَّيْءَ:
            وَصَلْتُهُ... والوصيَّةُ من هذا القياس، كأنَّهُ كلامٌ يُوصَى أي يُوصَلُ. يُقَالُ: وَصَّيْتُهُ
            تَوْصِيَةً، وَأَوْصَيْتُهُ إِيصَاءً.»
          source: "مقاييس اللغة لابن فارس (ت. 1004م)"
          addition: >
            يربط ابن فارس الوصيةَ بأصل الوصل، مما يُعمِّق الدلالة الاشتقاقية لمُوصٍ: هو من يصل كلامه
            وعهده إلى الورثة عبر وثيقة الوصية.
        - text: "«والوَصِيُّ المُوصِي والمُوصَى»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي (ت. 1066م)"
          addition: >
            يُثبِّت ابن سيده أن الجذر وصي كان يُنتج مُوصٍ بمعنى صانع الوصية، وأن وصيٌّ كان مشتركاً
            بين الصانع والمُنفِّذ قبل أن يتخصَّص للمُنفِّذ في الاستعمال الحديث.

    - lemma: "مُوَرِّث"
      confirm:
        - text: "«مورِّث (ال..) — [ترجمة: testate] — الذي ترك وصية أو كتب وصيته.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: "«الذي ترك وصية أو كتب وصيته» — مقابل testate (= من مات بعد أن ترك وصية)"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: >
            المُوَرِّث في الاستعمال القانوني العربي يُحيل إلى المتوفَّى صاحب التركة بصرف النظر عن
            وجود وصية؛ فكل مُوصٍ مُوَرِّث وليس كل مُوَرِّث مُوصِياً. الدلالة أعمّ مما تقتضيه
            المجموعة.

    - lemma: "كَاتِبُ الوَصِيَّة"
      evidence_status: "no_material_found"

    - lemma: "وَاصٍ"
      contradicts:
        - text: >
            «(وَأَصَ) الواوُ والهمزةُ والصادُ. يقولون: ما أدري أيُّ الوئيصةِ هو، أي أيُّ الناسِ هو.
            والوئيصة: الجماعة»
          source: "مقاييس اللغة لابن فارس (ت. 1004م)"
          conflict: >
            البحث عن (واص) يُفضي إلى جذر وأص (بالهمزة) بمعنى الجماعة أو الضرب، لا إلى جذر وصي.
        - text: "«وأص: وَأَصَ به الأرضَ وَأْصاً: ضَرَبَهَا»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي (ت. 1066م)"
          conflict: >
            الجذر وأص يعني الضرب بالأرض. أما واصٍ من جذر وصو/وصي فمعناه المعجمي المُثبَّت هو
            (أرض واصية = متصلة النبات)، لا صانع الوصية القانونية.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُوصٍ"
      decision: confirmed
      decision_reason: >
        المصطلح الفقهي-القانوني الأمثل لصانع الوصية، مُثبَّت في المعجم الموحد لمصطلحات القانون (2017)
        بمعنى testator وفي المورد الحديث (2008) بمعنى "تاركٌ وصيّةً شرعية". الجذر وصي عريق موثَّق في
        المقاييس والمحكم. يحتاج تكميل التشكيل بإضافة السكون على الواو (مُوصٍ → مُوْصٍ) كما تكتبه المورد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
        loanword: false
        calque: false
        blind_translation: false
      morphology_check: >
        اسم فاعل من أَوصى الرباعي، وزن مُفعِل. الاسم المنقوص في حالة الرفع: مُوصٍ (بتنوين الكسر على
        النون). السكون على الواو إلزامي في التشكيل الكامل: مُ(ضمة) + وْ(سكون) + صٍ(كسرة+تنوين).
      quality_gate:
        ittiraad: true
        yusr: true
        mulaama: true
        turaath: true
        arabiyya: true
        ishtiqaaqiyya: true
      nuance_differentiation: >
        مُوصٍ هو صانع الوصية (الطرف المُوجِب للعقد)، يتمايز بدقة عن: الوَصِيِّ (executor: المُنفِّذ
        والقيِّم على التركة)، والمُوصَى له (legatee: المُستفيد من الوصية)، والوَارِث (heir: المستحق
        بالنسب لا بالوصية)، والمُوَرِّث (decedent: المتوفَّى صاحب التركة بصرف النظر عن الوصية).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوْصٍ"

    - lemma: "مُوَرِّث"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود المُوَرِّث في المعجم الموحد للقانون مقابل testate، فإن دلالته في الاستعمال القانوني
        العربي أعمّ (= المتوفَّى صاحب التركة) ولا تقتصر على من كتب وصية. إضافته ستُوهم ترادفاً
        مطلقاً مع مُوصٍ وهو غير دقيق فقهاً: كل مُوصٍ مُوَرِّث وليس كل مُوَرِّث مُوصِياً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "كَاتِبُ الوَصِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السك: يمكن إبدال (كاتب) بـ(محرِّر) أو (صائغ) أو (واضع) وتبقى العبارة وصفاً
        صحيحاً → ليست وحدةً اصطلاحيةً مثبَّتةً. لا توجد أدلة معجمية تُسجِّلها مصطلحاً مستقلاً.
        فضلاً عن أن (كتابة) الوصية تقصر عن استيعاب الوصية الشفهية المعتبرة فقهاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "وَاصٍ"
      source: stage1
      decision: removed
      decision_reason: >
        البحث المعجمي يُثبِّت أن (واصٍ) في المعاجم إما يُحيل إلى جذر وأص (بالهمزة: الضرب والجماعة)
        أو إلى معنى (متصل النبات) من وصو/وصي — كلاهما بعيد عن المفهوم القانوني لصانع الوصية.
        الاستعمال الفقهي والقانوني المعتمد هو مُوصٍ من أَوصى الرباعي دون منازع.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


