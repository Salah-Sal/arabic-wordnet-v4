# مراجعة المجموعة الترادفية — awn4-14862709-n (dottle)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «بقايا التبغ» عبارة وصفية حرّة وليست مصطلحاً مسكوكاً؛ يمكن استبدال «بقايا» بـ«فُضالة» أو «بقية» دون تغيّر المعنى — لا تجتاز اختبار السكّ"
      - "المفهوم شديد التخصيص (بقايا التبغ المتكتّلة في وعاء الغليون تحديداً) وقد لا يوجد له مصطلح عربي مفرد مسكوك"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزية ويحتاج صياغة معجمية"
    observations: "المفهوم يخصّ بقايا التبغ المحترقة جزئياً التي تتكتّل في قعر وعاء الغليون بعد الانتهاء من التدخين. هذا مفهوم ثقافي غربي مرتبط بثقافة تدخين الغليون، وقد لا يكون له مقابل عربي دقيق مفرد. الفارق الجوهري بينه وبين «البقية» العامة هو التخصيص في التبغ والتكتّل في وعاء الغليون."
  blind_candidates:
    - lemma: "حُثَالَة"
      generation_method: majaz
      justification: "الحُثالة في المعاجم العربية: الرديء من كل شيء، والنفاية من الحبّ والتمر. يمكن توسيع دلالتها مجازاً لتشمل بقايا التبغ الرديئة المتبقية بعد الاحتراق، بجامع البقية المطروحة التي لا خير فيها."
    - lemma: "نُفَاثَة"
      generation_method: ishtiqaq
      justification: "من جذر نفث على وزن فُعَالة الدالّ على ما يتبقى من فعل. النُّفاثة: ما يُنفَث من الفم. والتدخين نفث، فبقاياه نُفاثة."
    - lemma: "سُحَالَة"
      generation_method: majaz
      justification: "السُّحالة: برادة الذهب والفضة وما يتساقط بعد البرد والسحل. مجاز لبقايا التبغ بجامع ما يتبقى من المادة بعد استهلاكها."
    - lemma: "رُكَامَةُ الغَلْيُون"
      generation_method: tarkib
      justification: "مركب إضافي من رُكامة (ما تراكم وتكتّل) والغليون، يصف التبغ المتكتّل في وعاء الغليون."

stage2_evidence:
  per_lemma:
    - lemma: "بَقَايَا التَّبْغ"
      expands:
        - text: "«بقايا القماش الصغيرة لم تتحلل بعد وناتجة عن معالجة الصّوف، وقد تؤدي إلى ظهور عيوب.»"
          source: "مسرد صناعة النسيج (ArabTerm)"
          addition: "يُظهر استعمال «بقايا» في السياق الصناعي بمعنى المخلفات المادية"
        - text: "«ما يتبقى من النفايات بعد الانتهاء من عمليات فرز ما هو قابل لإعادة الاستعمال»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يُعزّز استعمال «بقايا» بمعنى المخلفات المادية عموماً"
      contradicts:
        - text: "«التَّبَغُ: نباتٌ من الفَصيلة الباذنجانية تُستعمل تدخيناً, وسَعُوطاً, ومضغاً»"
          source: "المعجم الوسيط"
          conflict: "التبغ نبات وليس مادة محترقة؛ «بقايا التبغ» عبارة وصفية عامة لا تخصّ بقايا الغليون تحديداً"

    - lemma: "حُثَالَة"
      confirm:
        - text: "«الحُثَالَةُ: الرَّديءُ من كُلِّ شىء. القشارة من التَّمْرِ والشعير والأرز وما أشبهها. السُّفْلُ. البُرِّ والتَّمْرِ: أردؤه, وما يُخْرَجُ منه ولا خَيْرَ فيه فيُرْمى به. الطِّيبِ والدُّهْنِ وما أَشْبَهَهُما: ثُفْلُه.»"
          source: "المعجم الكبير"
        - text: "«الحُثَالَةُ: الرَّدِيء من كل شَيْء والنفاية من الْحبّ وَالتَّمْر وَنَحْوهمَا»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الْحَاءُ وَالثَّاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى سُوءٍ وَحَقَارَةٍ. فَحُثَالَةُ الْبُرِّ: رَدِيُّهُ. وَحُثَالَةُ الدُّهْنِ وَمَا أَشْبَهَهُ: ثُفْلُهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدلّ على السوء والحقارة، مما يناسب البقية المطروحة"
        - text: "«ما بقى مِن النَّاسِ إلا حُثالة»"
          source: "المعجم الكبير (حديث)"
          addition: "شاهد على استعمال الحثالة مجازاً لأسوأ ما يتبقى"

    - lemma: "نُفَاثَة"
      confirm:
        - text: "«النُّفَاثَةُ: ما يَنْفِثُه المصدور من فيه. ما يَعلَق بالأسنان من طعام أو نحوه فيُرْمَى به.»"
          source: "المعجم الوسيط"
      expands:
        - text: "«النُّونُ وَالْفَاءُ وَالثَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خُرُوجِ شَيْءٍ مِنْ فَمٍ أَوْ غَيْرِهِ بِأَدْنَى جَرْسٍ... لَوْ سَأَلَنِي نُفَاثَةَ سِوَاكٍ مَا أَعْطَيْتُهُ، وَهُوَ مَا بَقِيَ فِي أَسْنَانِهِ فَنَفَثَهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدلّ على خروج شيء من الفم؛ والنُّفاثة ما يُنفَث ويُطرَح"
      contradicts:
        - text: "«النَّفَّاثَةُ: طائرة سريعة تعتمد فى طيرانها على نفث الهواء»"
          source: "المعجم الوسيط"
          conflict: "النَّفَّاثة (بتشديد الفاء) مصطلح مستقرّ بمعنى الطائرة النفّاثة، لكن النُّفَاثة (بضم النون وتخفيف الفاء) مختلفة صرفياً ودلالياً"

    - lemma: "سُحَالَة"
      confirm:
        - text: "«السُّحَالَةُ: كُلُّ ما يَسْقُطُ مِن الشىءِ بَعدَ بَرْده. ما تَحاتَّ من الحديدِ, وبُرْدِ الذهبِ والفضَّةِ ونحوهما.»"
          source: "المعجم الكبير"
        - text: "«السحالة: برادة الذَّهَب وَالْفِضَّة وَنَحْوهمَا وقشر الْبر وَالشعِير وَغَيرهمَا»"
          source: "المعجم الوسيط"
      expands:
        - text: "«السِّينُ وَالْحَاءُ وَاللَّامُ... أَحَدُهَا كَشْطُ شَيْءٍ عَنْ شَيْءٍ... سَحَلْتُ الْحَدِيدَةَ أَسْحَلُهَا. وَذَلِكَ إِذَا بَرَدْتَهَا. وَيُقَالُ لِلْبُرَادَةِ السُّحَالَةُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدلّ على ما يتساقط بعد كشط أو برد، لكنه مخصوص بالبرادة المعدنية"
      contradicts:
        - text: "«السُّحَالَةُ: كُلُّ ما يَسْقُطُ مِن الشىءِ بَعدَ بَرْده»"
          source: "المعجم الكبير"
          conflict: "السحالة مخصوصة بما يتساقط بعد البرد والحكّ (المعادن)، لا بعد الاحتراق"

    - lemma: "رُكَامَةُ الغَلْيُون"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "بَقَايَا التَّبْغ"
      decision: confirmed
      decision_reason: "رغم أنها عبارة وصفية وليست مصطلحاً مسكوكاً، فهي اللمّة الوحيدة الموجودة في المجموعة، وتؤدي وظيفة التوصيل الدلالي. المفهوم (dottle) شديد التخصيص ولا يوجد له مقابل عربي مفرد ثابت، فيُبقى عليها كلمّة وصفية مع إضافة تشكيل كامل."
