      decision_reason: "الحُثالة مصطلح عامّ يعني الرديء من كل شيء والنفاية. ليست مخصّصة بالتبغ أو الاحتراق أو الغليون. استعمالها وحدها دون تقييد لا يوصل دلالة المجموعة الترادفية، وتقييدها بـ«حثالة التبغ» لا يضيف جديداً على «بقايا التبغ» الموجودة."

    - lemma: "نُفَاثَة"
      source: stage1
      decision: removed
      decision_reason: "النُّفاثة في المعاجم: ما يُنفَث من الفم أو ما يعلق بالأسنان. دلالتها مرتبطة بالنفث من الفم لا ببقايا المادة المحترقة في وعاء. التوسيع الدلالي بعيد جداً وقد يلتبس بالنَّفَّاثة (الطائرة)."

    - lemma: "سُحَالَة"
      source: stage1
      decision: removed
      decision_reason: "السُّحالة مخصّصة بالبرادة المعدنية (ما يتساقط بعد البرد والحكّ)، وليست مرتبطة بالاحتراق أو التبغ. القياس عليها بعيد لأن آلية الإنتاج مختلفة (كشط مقابل احتراق)."

    - lemma: "رُكَامَةُ الغَلْيُون"
      source: stage1
      decision: removed
      decision_reason: "مركب إضافي مُوَلَّد لا شاهد عليه في أي معجم، ولا يجتاز اختبار التثبيت المعجمي. كلمة «ركامة» نفسها غير مستعملة بهذا المعنى في المعاجم."

