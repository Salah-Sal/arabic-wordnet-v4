      nuance_differentiation: "عبارة وصفية عامة تشمل أي بقايا للتبغ وليست مقصورة على ما يتكتّل في الغليون، لكنها الأقرب تواصلياً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَقَايَا التَّبْغ"

    - lemma: "حُثَالَة"
      source: stage1
