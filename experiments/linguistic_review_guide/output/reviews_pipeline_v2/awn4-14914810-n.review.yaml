stage1_review:
  assessment:
    concerns:
      - "اللمّة «مزلق» بدون تشكيل — يلتبس بين المُزَلِّق (اسم فاعل من زلّق: المادة المزلّقة) والمَزْلَق (اسم مكان: الموضع الزلق)"
      - "اللمّة «زيت تشحيم» تحصر المفهوم في الزيوت، والمزلّقات تشمل الشحوم والمواد الصلبة أيضاً"
      - "اللمّة «مادة تشحيم» تستخدم «تشحيم» من جذر شحم (الدهن الجامد)، بينما المصطلح التقني الأدق هو «تزليق» من زلق"
    observations: "المجموعة تضمّ ثلاث لمّات: واحدة مفردة (مزلق) واثنتان مركبتان إضافيتان (زيت تشحيم، مادة تشحيم). اللمّة المفردة هي الأدق والأشمل، لكنها تحتاج تشكيلاً لتمييزها عن المَزْلَق (المكان). المركبتان الإضافيتان مقبولتان لكنهما أضيق دلالياً من المفهوم العام."
  blind_candidates:
    - lemma: "مُزَلِّق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من زلَّق (فعَّل) على وزن مُفَعِّل، يدلّ على ما يُحدث الزَّلَق والانزلاق. الجذر ز ل ق يدلّ على تزلّج الشيء عن مقامه (ابن فارس)، فالمُزَلِّق: ما يجعل السطح زَلِقاً فيخفّف الاحتكاك."
    - lemma: "مُشَحِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من شحَّم (فعَّل) على وزن مُفَعِّل، أي ما يُضاف إليه الشحم. الجذر ش ح م يدلّ على جنس من اللحم الدهني (ابن فارس)، فالمُشَحِّم: ما يؤدي وظيفة التشحيم."
    - lemma: "دَهُون"
      generation_method: ishtiqaq
      justification: "على وزن فَعُول من الجذر د ه ن الدال على اللين والسهولة (ابن فارس). فَعُول يفيد القابلية والمبالغة، فالدَّهُون: ما من شأنه الدَّهْن والتليين."
    - lemma: "زَيْت تَزْلِيق"
      generation_method: tarkib
      justification: "مركب إضافي من زيت + تزليق (مصدر زلَّق). يُقابل المصطلح التقني lube oil، وهو مسجّل في المعجم الموحد لمصطلحات الكيمياء والمسارد التقنية."

