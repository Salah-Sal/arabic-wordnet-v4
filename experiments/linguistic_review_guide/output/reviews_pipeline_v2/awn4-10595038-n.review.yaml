# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10595038-n
# cloud seeder — بَاذِر السُّحُب / مُسْتَمْطِر
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بَاذِر السُّحُب» مركب إضافي يبدو ترجمة حرفية لـ cloud seeder، ولا يُعرف له تثبيت معجمي مستقل"
      - "اللمّة «مُسْتَمْطِر» دلالتها الكلاسيكية طالب المطر أو طالب الخير، فهل تصلح لمفهوم البذر التقني الحديث؟"
      - "المجموعة تفتقر إلى أمثلة استعمالية"
    observations: >
      المفهوم تقني حديث يتعلق بالأرصاد الجوية وهندسة الطقس. في العربية يُعبَّر عن العملية بمصطلح
      «استمطار السحب» أو «بَذْر السحب» أو «تلقيح السحب»، لكنّ تسمية الفاعل (الشخص) أقلّ شيوعاً
      من تسمية العملية ذاتها. اسم الفاعل «مُسْتَمْطِر» من استمطر هو الأقرب اشتقاقاً، بينما «بَاذِر السُّحُب»
      مركب وصفي-وظيفي مقبول صرفياً لكنه أقرب إلى الترجمة الحرفية.
  blind_candidates:
    - lemma: "مُسْتَمْطِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استمطر (باب استفعل) على وزن مُسْتَفْعِل، والاستمطار هو طلب المطر أو استجلابه"
    - lemma: "مُلَقِّحُ السُّحُب"
      generation_method: tarkib
      justification: "مركب إضافي من اسم الفاعل مُلَقِّح (من لقّح) مضافاً إلى السُّحُب، إذ يشاع تعبير «تلقيح السحب» في الإعلام العربي"
    - lemma: "جَالِبُ المَطَر"
      generation_method: tarkib
      justification: "مركب إضافي من جَالِب (اسم فاعل من جلب) والمطر، يُستعمل في السياق العام لمن يستنزل المطر"
    - lemma: "مُمْطِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أمطر (باب أفعل) على وزن مُفْعِل، أي من يُنزل المطر"


stage2_evidence:
  per_lemma:
    - lemma: "بَاذِر السُّحُب"
      expands:
        - text: "«(بَذَرَ) الْبَاءُ وَالذَّالُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ نَثْرُ الشَّيْءِ وَتَفْرِيقُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر بذر يدل على النثر والتفريق، وهو الأساس الدلالي لمفهوم بذر السحب"
        - text: "«بَذْرُ سحابة»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999) — ALECSO"
          addition: "المصدر بَذْر مضافاً إلى سحابة مُثبت مصطلحاً للأرصاد الجوية مقابل cloud seeding"

    - lemma: "مُسْتَمْطِر"
      confirm:
        - text: "«استمطرَ يستمطر، استمطارًا، فهو مُسْتمطِر • استمطر الشَّخصُ: طلب المطرَ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«المُسْتَمْطِرُ: طَالِبُ الْخَيْرِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«(المُسْتَمْطِرُ) الموضعُ الظاهر البارز المنكشف»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يعرّف المُسْتَمْطَر (بفتح الطاء، اسم مكان) لا المُسْتَمْطِر (بكسرها، اسم فاعل)، لكن قد يُوهم الخلط بين الصيغتين"
      expands:
        - text: "«استمطرت فلاناً: طلبت معروفه. والمال يستمطر: يبرز للمطر. ومنه: قعدوا في المستمطر: في المكان البارز المنكشف»"
          source: "أساس البلاغة للزمخشري"
          addition: "استمطر في الكلاسيكية تعني طلب المطر أو طلب المعروف مجازاً، وتوسّعت حديثاً لتشمل الاستمطار الصناعي"
        - text: "«استمطار السحب»"
          source: "المَكنَز الزراعي متعدد اللغات — ALECSO"
          addition: "المصدر استمطار مضافاً إلى السحب مُثبت مصطلحاً مقابل cloud seeding"

    - lemma: "مُلَقِّحُ السُّحُب"
      evidence_status: "no_material_found"

    - lemma: "جَالِبُ المَطَر"
      confirm:
        - text: "«جالب المطر: «أ» من يستنزل المطر بوسائل صُنعيّة. «ب» شخص يحقِّق نتائج باهرة في الأعمال أو السياسة إلخ.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(مَطَرَ) الْمِيمُ وَالطَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ فِيهِ مَعْنَيَانِ: أَحَدُهُمَا الْغَيْثُ النَّازِلُ مِنَ السَّمَاءِ وَالْآخَرُ جِنْسٌ مِنَ الْعَدْوِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر مطر أصله الغيث، وجالب المطر مركب وصفي شفاف الدلالة"

    - lemma: "مُمْطِر"
      contradicts:
        - text: "«أمطرتِ السَّماءُ: مطَرت؛ نزل مطرُها ... أمطره: أصابه بالمَطَر»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "مُمْطِر اسم فاعل من أمطر ويُطلق على السماء أو السحاب الذي يُنزل المطر، لا على الشخص الذي يبذر السحب"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "بَاذِرُ السُّحُب"
      decision: confirmed
      decision_reason: >
        المركب الإضافي مبني على جذر بذر (نثر وتفريق) وهو الأساس المعتمد في مصطلحات الأرصاد الجوية
        العربية (بَذْر سحابة). اسم الفاعل بَاذِر على وزن فَاعِل مضافاً إلى السُّحُب يعطي مصطلحاً
        شفاف الدلالة مقبولاً صرفياً، وإن كان أقرب إلى الترجمة المصطلحية منه إلى التعبير العربي الأصيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على الفعل التقني (بذر المواد الكيميائية في السحب)، وهو أدقّ من مُسْتَمْطِر الذي يشمل الاستمطار بوجه عام"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَاذِرُ السُّحُب"

    - lemma: "مُسْتَمْطِر"
      decision: confirmed
      decision_reason: >
        اسم فاعل سماعي من استمطر على وزن مُسْتَفْعِل، جذره مطر، ومعناه الأصلي طالب المطر أو طالب الخير.
        توسّع المصطلح حديثاً ليشمل من يقوم بعملية الاستمطار الصناعي، وهو مُثبت في معجم اللغة العربية
        المعاصرة ومقاييس اللغة. لا يُخلط بالمُسْتَمْطَر (بفتح الطاء) الذي هو اسم مكان.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ دلالةً من بَاذِر السُّحُب، إذ يشمل كلّ من يسعى لاستجلاب المطر سواء ببذر السحب أو بغيره، وله بُعد تراثي (طالب الخير)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَمْطِر"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُلَقِّحُ السُّحُب"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أيّ دليل معجمي للمركب ولا لاستعمال تلقيح السحب في المعاجم المتخصصة المتاحة.
        المصطلح شائع إعلامياً لكنّه غير مُثبت معجمياً، والأولوية للمصطلحات المُوثّقة.

    - lemma: "جَالِبُ المَطَر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود المركب في المورد الحديث بمعنى «من يستنزل المطر بوسائل صنعية»، فإنّه ترجمة
        لـ rainmaker لا لـ cloud seeder. المفهومان مختلفان في الشبكة الدلالية: rainmaker أعمّ
        ويشمل المعنى المجازي (من يحقق نتائج باهرة)، فإدراجه هنا يُحدث خلطاً بين المجموعتين.

    - lemma: "مُمْطِر"
      source: stage1
      decision: removed
      decision_reason: >
        مُمْطِر اسم فاعل من أمطر، ويُطلق على السماء أو السحاب الذي يُنزل المطر لا على الشخص
        الذي يبذر السحب. الأدلة المعجمية تؤكد أنّ الفاعل في أمطر هو السماء لا الإنسان.


