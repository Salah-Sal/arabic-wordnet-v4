      decision: confirmed
      decision_reason: "تعريب مقبول لمصطلح علمي/روحاني أجنبي لا مقابل تراثي له. المصطلح شائع في الأدبيات العربية المترجمة عن ما وراء الطبيعة. يقبل الاشتقاق والتعريف."
