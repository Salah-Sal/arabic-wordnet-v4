            entry_id: "{auto}"
            new_lemma: "إِكْتُوبْلَازْم"

    - lemma: "جِبْلَة خَارِجِيَّة"
      decision: confirmed
      decision_reason: "مركب إضافي-وصفي مسجّل في المورد الحديث ومعجم الأحياء الموحد مقابل ectoplasm. الأصل بيولوجي لكن التوسيع إلى المعنى الروحاني مقبول كما في الإنجليزية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "مصطلح تقني ترجمي يُفضّل في النصوص العلمية والمتخصصة، بينما «إكتوبلازم» أقرب للاستعمال العام"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِبْلَة خَارِجِيَّة"

    - lemma: "هُيُولَى ظَاهِرَة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مسجّل في معجم التشريح العياني للمعنى البيولوجي حصراً (الطبقة الخارجية للسيتوبلازم / الغشاء الهيولي)، ولم يُستعمل في سياق الروحانيات. إضافته تُحدث خلطاً بين المعنيين البيولوجي والروحاني."

    - lemma: "جِبْلَة بَرَّانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعمال هذا المركب. صفة «برّانية» عامّية في كثير من اللهجات ولم تُسجّل في المعاجم المعيارية مقابل «خارجية» في هذا السياق العلمي."

    - lemma: "نَضْحَة رُوحِيَّة"
      source: stage1
      decision: removed
      decision_reason: "«النضحة» في المعاجم خاصة بالمطر اليسير المتفرق، ولا علاقة لها بانبعاث مادة من جسد. المركب غير مسكوك ولا مسجّل."

