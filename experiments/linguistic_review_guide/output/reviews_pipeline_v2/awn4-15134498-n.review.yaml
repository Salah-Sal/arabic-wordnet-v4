# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-15134498-n (ectoplasm — spiritualism)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «إكتوبلازم» بلا تشكيل وبلا همزة وصل/قطع واضحة"
      - "المفهوم خاص بالروحانيات الغربية (Spiritualism) وهو غريب عن الثقافة العربية الإسلامية"
      - "التعريف يستخدم «الغيبوبة» مقابل trance، والأدق في سياق الروحانيات «الجَذْبَة» أو «النَّشْوَة»"
      - "المركب «جبلة خارجية» مأخوذ من المعنى البيولوجي (ectoplasm = الطبقة الخارجية من السيتوبلازم)، وتطبيقه على المعنى الروحاني يحتاج توضيحاً"
    observations: "المجموعة تصف مفهوماً من ميدان ما وراء الطبيعة الغربي (parapsychology)، وهو مادة يُدَّعى أنها تنبعث من جسد الوسيط الروحي في حالة الجَذْبَة. المصطلح الإنجليزي ectoplasm مشتق من اليونانية (ecto = خارجي + plasma = مادة مُشَكَّلة). اللمّتان الحاليتان تمثّلان مقاربتَيْن مشروعتَيْن: التعريب المباشر والترجمة التركيبية. غير أن المفهوم نفسه لا يكاد يُعرف في التراث العربي، ما يجعل المجموعة ذات فجوة ثقافية واضحة."
  blind_candidates:
    - lemma: "إِكْتُوبْلَازْم"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح اليوناني-الإنجليزي ectoplasm، وهو الأنسب لمفهوم ليس له مقابل تراثي. يقبل لام التعريف (الإكتوبلازم) والنسبة (إكتوبلازميّ)."
    - lemma: "هُيُولَى ظَاهِرَة"
      generation_method: tarkib
      justification: "مركب وصفي من «هُيُولَى» (المادة الأولية/البلازما في المصطلح الطبي العربي) و«ظاهرة» (خارجية). مسجّل في معجم التشريح العياني الموحد مقابل ectoplasm."
    - lemma: "جِبْلَة بَرَّانِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي-وصفي بديل عن «جبلة خارجية»، يستعمل الصفة التراثية «برّانيّة» (من بَرّا = خارج) بدلاً من «خارجية»."
    - lemma: "نَضْحَة رُوحِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «نضحة» (ما ينضح ويرشح من سائل) و«روحية» (نسبة إلى الروح). محاولة لوصف المادة المنبعثة في السياق الروحاني."

stage2_evidence:
  per_lemma:
    - lemma: "إِكْتُوبْلَازْم"
      evidence_status: "no_material_found"

    - lemma: "جِبْلَة خَارِجِيَّة"
      confirm:
        - text: "«الجِبْلَة [أو البلازما] الخارجية (أح).»"
          source: "المورد الحديث (2008)"
        - text: "«بلازم خارجي» — ectoplasm"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      expands:
        - text: "«(فِي علم الْأَحْيَاء) مَادَّة شبه زلالية معقدة التَّرْكِيب الكيمياوي وتعد الأساس الطبيعي للحيوان والنبات (مج)»"
          source: "المعجم الوسيط"
          addition: "تعريف الجِبِلَّة بالمعنى البيولوجي (protoplasm)، والجبلة الخارجية هي الطبقة الخارجية منها"
        - text: "«البروتوبلازمة protoplasm: المادةُ الحيَّةُ الأوَّلية، وهى جُمْلَةُ المادةِ المُكَوِّنة لِلْبِنْيَة الأساسية في بناء الكائنات الحية، وهي الخَلِيّة، مُتَشَكِّلةً إلى الجَبْلَةِ الخَلَوِيَّةِ (السيتوبلازمة) وما بها من عُضَيَّاتٍ غِشائِيَّةٍ وغيرِ غِشائِيّةٍ، والجبلَة النَّووِيّة (النيوكليوبلازمة)»"
          source: "المعجم الكبير"
          addition: "تفصيل لأنواع الجبلة: خلوية ونووية، مما يدعم استعمال «جبلة خارجية» للطبقة الخارجية"

    - lemma: "هُيُولَى ظَاهِرَة"
      confirm:
        - text: "«هُيُولَى ظَاهِرة» — ectoplasm"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      expands:
        - text: "«ظَاهِرُ الهَيُولَى (الغِشاءُ الهَيُولِيّ)» — ectoplasm (plasma membrane)"
          source: "المعجم الطبي الموحد (2009)"
          addition: "صيغة إضافية بديلة مع توضيح أن المقصود الغشاء الهيولي"

    - lemma: "جِبْلَة بَرَّانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "نَضْحَة رُوحِيَّة"
      contradicts:
        - text: "«(النضحة) الشَّيْء الْيَسِير المتفرق من الْمَطَر (ج) نضحات»"
          source: "المعجم الوسيط"
          conflict: "النضحة في المعاجم خاصة بالمطر الخفيف المتفرق، لا بانبعاث مادة من جسد"

stage3_analysis:
  per_lemma:
