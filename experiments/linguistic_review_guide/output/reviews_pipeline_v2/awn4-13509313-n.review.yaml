# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13509313-n (globalization)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عولمة» بدون تشكيل كامل — يجب إضافة التشكيل"
      - "المجموعة تحتوي لمّة واحدة فقط — قد يكون هناك مرادفات مفقودة"
      - "التعريف العربي ترجمة حرفية مختصرة للتعريف الإنجليزي — يحتاج تأليفاً معجمياً أصيلاً"
    observations: >
      المفهوم حديث النشأة في العربية، يندرج تحت العمليات الاقتصادية. وزن فَوْعَلة المشتق من «العالَم»
      هو الأكثر شيوعاً. المفهوم يتجاوز البُعد الاقتصادي ليشمل الثقافي والسياسي.
      التعريف الحالي يركّز على النمو في النطاق وهو مختصر جداً.
  blind_candidates:
    - lemma: "عَوْلَمَة"
      generation_method: ishtiqaq
      justification: "مصدر الفعل عَوْلَمَ المشتق من «العالَم» على وزن فَوْعَلة (ملحق بالرباعي)، يدلّ على جعل الشيء عالمياً"
    - lemma: "كَوْنَنَة"
      generation_method: ishtiqaq
      justification: "من «الكَوْن» على وزن فَعْلَلة، بمعنى جعل الشيء كونياً شاملاً، مشتق من جذر ك-و-ن"
    - lemma: "كُرَوِيّانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي مركب من «كُرَوِيّ» (نسبة إلى الكُرة الأرضية) + لاحقة -انيّة، يدلّ على سياسة الانفتاح الكوني"
    - lemma: "تَعْوِيل"
      generation_method: ishtiqaq
      justification: "مصدر فَعّلَ من عَوْلَمَ بتصريف بديل، لكنه أضعف صرفياً من فَوْعَلة"

stage2_evidence:
  per_lemma:
    - lemma: "عَوْلَمَة"
      confirm:
        - text: "«عَوْلَمَة — الجذر: ع ل م. على الرغم من عدم ورود كلمة «عَوْلمة» في المعاجم، فقد أجاز مجمع اللغة المصري استعمالها لجريانها على قواعد التصريف، حيث اشْتُقَّت من «العالَم» - بفتح اللام - على «فَوْعَلة» لإفادة هذا المعنى الجديد، ويُعَدّ وزن «فوعل» في اللغة من أوزان الملحق بالرباعي التي تدل على تعدي الأثر إلى الغير.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«إنتاج عالم رأسمالي لمفهوم 'قرية كونية' يتم فيها التبادل بأسرع طريقة تقنية للسيطرة على المعرفة والكون.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«العولمة — globalization»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«عَوْلَمَةٌ — globalization»"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية (2020)"
      expands:
        - text: "«العَوْلَمة؛ الكُرَوِيّانيّة: سياسة تعتبر العالَم كلّه، أو الكرة الأرضيّة كلّها، ميدانًا صالحًا للنفوذ السياسيّ، وتسعى إلى توحيد المعايير الحضاريّة والاقتصاديّة بين مختلف الدول.»"
          source: "المورد الحديث (2008)"
          addition: "يضيف مرادف «الكُرَوِيّانيّة» ويوسّع الدلالة لتشمل البعد السياسي والحضاري"
    - lemma: "كَوْنَنَة"
      evidence_status: "no_material_found"
    - lemma: "كُرَوِيّانِيَّة"
      confirm:
        - text: "«العَوْلَمة؛ الكُرَوِيّانيّة: سياسة تعتبر العالَم كلّه، أو الكرة الأرضيّة كلّها، ميدانًا صالحًا للنفوذ السياسيّ، وتسعى إلى توحيد المعايير الحضاريّة والاقتصاديّة بين مختلف الدول.»"
          source: "المورد الحديث (2008)"
    - lemma: "تَعْوِيل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عَوْلَمَة"
      decision: confirmed
      decision_reason: "لمّة مُثبتة معجمياً ومُجازة من مجمع اللغة المصري، مشتقة على وزن فَوْعَلة من «العالَم»، شائعة في الاستعمال المعاصر والمعاجم المتخصصة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَوْلَمَة"

    - lemma: "كَوْنَنَة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية، ولم يثبت استعمالها في المعاجم أو المصطلحيات الرسمية. عَوْلَمَة أثبت وأشيع"

    - lemma: "كُرَوِيّانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "وردت في المورد الحديث مرادفةً للعولمة، لكنها صيغة نادرة الاستعمال جداً ومُثقلة صرفياً (أربع لواحق: كُرَة ← كُرَوِيّ ← كُرَوِيّان ← كُرَوِيّانِيَّة). لا تستوفي معيار يُسر التداول ولا شيوع الفصيح"

    - lemma: "تَعْوِيل"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية بهذا المعنى. صيغة تَفْعِيل من عَوْلَمَ غير مسموعة، والوزن المعتمد هو فَوْعَلة"

stage4_content:
  definition:
    current: "النمو إلى نطاق عالمي أو واسع النطاق"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية مختصرة لا تعكس أبعاد المفهوم الاقتصادية والثقافية والسياسية، ولا يتّبع أسلوب التعريف المعجمي العربي"
    authored:
      - type: terminological
        text: "عمليةٌ اقتصاديةٌ واجتماعيةٌ تتّجه بالأسواق والمؤسسات والثقافات نحو الاندماج على نطاقٍ عالَمِيٍّ شامل"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ظاهرةٌ معاصرةٌ تقوم على تزايد الترابط والتكامل بين اقتصادات الدول وثقافاتها ومجتمعاتها عبر حركة السلع والخدمات ورؤوس الأموال والأفكار والأشخاص عبر الحدود، بحيث يصبح العالَم أشبه بقريةٍ واحدة"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عمليةٌ اقتصاديةٌ واجتماعيةٌ تتّجه بالأسواق والمؤسسات والثقافات نحو الاندماج على نطاقٍ عالَمِيٍّ شامل"

  examples:
    per_lemma:
      - lemma: "عَوْلَمَة"
        examples:
          - text: "أسهمت العَوْلَمَةُ في تسريع وتيرة التبادل التجاري بين الدول النامية والمتقدمة على حدٍّ سواء."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أسهمت العَوْلَمَةُ في تسريع وتيرة التبادل التجاري بين الدول النامية والمتقدمة على حدٍّ سواء."

