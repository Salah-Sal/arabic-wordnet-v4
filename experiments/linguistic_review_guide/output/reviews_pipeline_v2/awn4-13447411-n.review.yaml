# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13447411-n (acidification)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تخليل» لا تدل على التحميض الكيميائي العام بل على التخليل بالخلّ (acetification) أو حفظ الأغذية (pickling)"
      - "اللمّتان بلا تشكيل كامل"
      - "لا يوجد تمييز دلالي واضح بين اللمّتين الحاليتين"
    observations: "المفهوم هو عملية التحوّل إلى حمض (acidification) وهو مصطلح كيميائي راسخ في العربية بصيغة «تَحْمِيض» (تَفْعِيل من حَمَّضَ). أما «تخليل» فمشتقة من الجذر خلل المتعلق بالخَلّ والتخليل (النقع في الخلّ أو إخراج الطعام من بين الأسنان)، ولا علاقة مباشرة لها بمفهوم acidification العام. الجذر حمض هو الجذر الأنسب لهذا المفهوم، ومنه يُشتق أيضاً «تَحَمُّض» (تَفَعُّل من تَحَمَّضَ) للدلالة على الصيرورة الذاتية."
  blind_candidates:
    - lemma: "تَحْمِيض"
      generation_method: ishtiqaq
      justification: "مصدر الفعل حَمَّضَ (باب التفعيل) على وزن تَفْعِيل، يدل على جعل الشيء حمضياً أو إضافة الحمض إليه"
    - lemma: "تَحَمُّض"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تَحَمَّضَ (باب التفعّل) على وزن تَفَعُّل، يدل على التحوّل الذاتي إلى حالة حمضية"
    - lemma: "حَمْضَنَة"
      generation_method: ishtiqaq
      justification: "على وزن فَعْلَنَة المولَّد للمصادر الصناعية الحديثة، قياساً على أَكْسَدَة ومَغْنَطَة"
    - lemma: "تَخْلِيل"
      generation_method: ishtiqaq
      justification: "مصدر الفعل خَلَّلَ من الخَلّ، بمعنى جعل الشيء حامضاً بالخلّ"


stage2_evidence:
  per_lemma:
    - lemma: "تَحْمِيض"
      confirm:
        - text: "«إضافة حمض إلى محلول ما حتى يصبح عدده الهيدروجيني أقل من سبعة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«إضافة حمض إلى محلول ما، حتى يصبح عدده الهيدروجينيّ أقل من سبعة.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«إضافة الحمض للأغذية لتصبح حامضية.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«(1) تحميض (2) تحمُّض.» — translation_en: acidification"
          source: "المورد الحديث (2008)"
        - text: "«معالجة بالحمض» — translation_en: acidizing"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
      expands:
        - text: "«التّحميض: بالميم هو القلي يستعمل في قلي البزور كالشّونيز ونحوه، وطريقه أن توضع البزور في قدر وتوقد النّار تحته حتى يخرج لها الرائحة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة تراثية مختلفة: القلي لا التحميض الكيميائي"
        - text: "«التَّفْخِيذُ في الجماع.»"
          source: "المعجم الكبير"
          addition: "دلالة أخرى غير كيميائية للتحميض"

    - lemma: "تَخْلِيل"
      contradicts:
        - text: "«التخليل: إخراج ما بقي من الطعام بين الأسنان.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الأصلي لتخليل هو إخراج الطعام من الأسنان بالخلال، لا التحميض"
        - text: "«حفظ المادة الغذائية في محلول ملحي وخل.» — translation_en: pickling"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "تخليل = pickling (الحفظ بالملح والخل) وليس acidification"
        - text: "«(1) تخليل (2) تخلُّل.» — translation_en: acetification"
          source: "المورد الحديث (2008)"
          conflict: "تخليل = acetification (تحويل إلى خلّ) وليس acidification"
        - text: "«استعمال حمض الخل في تحميض محلول ما» — أستلة، تخليل = acetification"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "التخليل في الكيمياء هو الأستلة (acetification) الخاصة بحمض الخل فقط"
      expands:
        - text: "«تخليل» — translation_en: intercalation"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "دلالة ثالثة مغايرة: الإدراج بين شيئين"

    - lemma: "تَحَمُّض"
      confirm:
        - text: "«تحمُّض» — translation_en: acidification"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«في الحالة الغازية يحدث التَحَمُّض عندما يتم تحويل مركبات مثل أكاسيد النيتروجين وأكاسيد الكبريت في تفاعل كيميائي... إلى مواد حمضية.» — translation_en: acidification"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
        - text: "«(1) تحميض (2) تحمُّض.» — translation_en: acidification"
          source: "المورد الحديث (2008)"
        - text: "«تحميض، تحَمُّض» — translation_en: acidification"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«(تحمض) الرَّاعِي انْتقل بالماشية من الْخلَّة إِلَى الحمض وَفُلَان تحول من حَال إِلَى حَال»"
          source: "المعجم الوسيط"
          addition: "الأصل اللغوي: التحوّل من حال إلى حال، ومنه اشتُقّ المعنى الكيميائي"
        - text: "«التَّحَمُّض» — translation_en: acidism/acidismus"
          source: "المعجم الطبي الموحد (2009)"
          addition: "في الطب يُستعمل تحمّض بمعنى acidism أيضاً"

    - lemma: "حَمْضَنَة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "تَحْمِيض"
      decision: confirmed
      decision_reason: "مصطلح راسخ في المعاجم الموحدة العلمية عبر عدة تخصصات (كيمياء، صيدلة، جيولوجيا، زراعة، طب) كمقابل لـ acidification. على وزن تَفْعِيل من حَمَّضَ، يدل على الفعل المتعدي: جعل الشيء حمضياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على الفعل المتعدي (transitive): إضافة حمض إلى مادة أو تحويلها إلى حمضية بفعل فاعل خارجي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْمِيض"

    - lemma: "تَخْلِيل"
      decision: removed
      decision_reason: "التخليل في المعاجم العربية يدل على: (١) إخراج الطعام من الأسنان بالخلال، (٢) الحفظ بالملح والخلّ (pickling)، (٣) الأستلة بحمض الخلّ (acetification)، (٤) الإدراج (intercalation). لا يرد في أيّ معجم عربي بمعنى acidification العام. وضعه هنا خلط بين acetification وacidification."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَحَمُّض"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مُثبت في معاجم المياه والبيئة والطب البيطري كمقابل لـ acidification. على وزن تَفَعُّل من تَحَمَّضَ، يدل على الصيرورة الذاتية. يُكمل «تحميض» بتغطية الجانب اللازم من المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على الصيرورة الذاتية اللازمة (intransitive): تحوّل المادة من تلقاء نفسها إلى حالة حمضية"
      actions:
        - command: create_entry
          params: {lemma: "تَحَمُّض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حَمْضَنَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أيّ شاهد معجمي لهذه الصيغة. ووزن فَعْلَنَة وإن كان قياسياً في المولَّد إلا أنه لا حاجة إليه مع وجود تَحْمِيض وتَحَمُّض الراسختين."


stage4_content:
  definition:
    current: "عملية التحول إلى حمض أو التحويل إلى مادة حمضية"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول في عمومه لكنه يحتاج تدقيقاً: (١) «التحول إلى حمض» غير دقيق لأن المادة لا تتحول إلى حمض بذاتها بل تصير حمضية، (٢) ينبغي ذكر المعيار الكيميائي (الرقم الهيدروجيني)"
    authored:
      - type: terminological
        text: "عملية جعل مادةٍ ما حمضيةً بإضافة حمض إليها، أو تحوُّلها ذاتياً إلى الحالة الحمضية، بحيث ينخفض رقمها الهيدروجيني عن سبعة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "صيرورة المادة حمضيةً أو جعلها كذلك"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية جعل مادةٍ ما حمضيةً بإضافة حمض إليها، أو تحوُّلها ذاتياً إلى الحالة الحمضية، بحيث ينخفض رقمها الهيدروجيني عن سبعة"

