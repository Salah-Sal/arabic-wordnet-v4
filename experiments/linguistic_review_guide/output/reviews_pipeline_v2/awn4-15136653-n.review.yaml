# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15136653-n
# vehicle (pharmaceutical/chemical sense)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «سواغ» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "اللمّة «وسط ناقل» تركيب وصفي غير مسكوك وغير موثّق في المعاجم المصطلحية"
      - "المعنى الأصلي للسواغ في العربية الكلاسيكية (ما تُساغ به الغصّة) يختلف عن المعنى الاصطلاحي الحديث (excipient/vehicle)"
    observations: "المجموعة تتناول مفهوم المادة الحاملة أو الوسيطة التي تُمزج مع الدواء أو الصبغة لتسهيل استعمالها. هذا مفهوم صيدلاني وكيميائي بحت، والمصطلح العربي المعتمد في المعاجم الموحدة هو «سِوَاغ» للدلالة على excipient، بينما «سائل حمل» يُستخدم للدلالة على vehicle في السياق الصيدلاني."
  blind_candidates:
    - lemma: "حَامِل"
      generation_method: ishtiqaq
      justification: "من الجذر ح-م-ل على وزن فاعِل، بمعنى المادة التي تحمل المادة الفعالة وتسهّل استعمالها، وهو شائع في المصطلحية العلمية العربية"
    - lemma: "سَائِل حَمْل"
      generation_method: tarkib
      justification: "تركيب إضافي يدلّ على السائل الذي يُستخدم لحمل المادة الفعالة في المستحضرات الصيدلانية، مقابل vehicle في الإنجليزية"
    - lemma: "مَادَّة حَامِلَة"
      generation_method: tarkib
      justification: "تركيب وصفي يدلّ على المادة التي تحمل غيرها من المواد الفعالة وتسهّل استخدامها"
    - lemma: "وَسِيط"
      generation_method: ishtiqaq
      justification: "من الجذر و-س-ط على وزن فَعيل، بمعنى المادة المتوسّطة بين المادة الفعالة والاستعمال النهائي"

stage2_evidence:
  per_lemma:
    - lemma: "سواغ"
      confirm:
        - text: "«كلُّ ما تساغ به الغُصَّة. يقال: الماءُ سواغُ الغُصص»"
          source: "المعجم الوسيط"
        - text: "«ما أَسَاغَ به الإنسانُ غُصَّتَه»"
          source: "المعجم الكبير"
        - text: "«مادة ليس لها تأثير دوائيّ تمزج مع المواد الدوائية الفعالة- لأهداف أخرى مثل إكساب القوام -لإعطاء المستحضر الصيدلانيّ.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مادة غير فعالة تضاف إلى تركيبة دوائية لتجعلها مناسبة للتناول.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«مادة عديمة المفعول كالنشا أو دقيق القمح لخلط مادة فعالة كالفيتامينات أو الأملاح المعدنية لإثراء الأغذية.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«سِواغ [ج:سواغات]» — ترجمة: vehicle"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستخدم سِواغ مقابل vehicle أيضاً وليس فقط مقابل excipient"
        - text: "«سِوَاغٌ، حامِل، ناقِل» — ترجمة: vehicle — بلازميدة ذاتية التكرر أو عاثية بكتيرية..."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "في سياق الوراثة يُستخدم سِواغ مرادفاً لحامل وناقل بمعنى vehicle"

    - lemma: "وسط ناقل"
      evidence_status: "no_material_found"

    - lemma: "حَامِل"
      confirm:
        - text: "«حامِل» — ترجمة: carrier"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      contradicts:
        - text: "«الحُبْلَى. فالأولى على أنه لا يكون إلا للمؤنث كحائض أو على النسب»"
          source: "المعجم الكبير"
          conflict: "المعنى الغالب للحامل هو الحُبلى أو حامل المرض، لا المادة الحاملة"
        - text: "«للعدوى مثلا: شخص يحمل في جسمه العامل المسبب للمرض دون أن تظهر عليه أعراض المرض»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "في سياق الصيدلة تحديداً، حامل يعني حامل العدوى لا المادة الحاملة للدواء"

    - lemma: "سَائِل حَمْل"
      confirm:
        - text: "«سَائِل حَمْل — في المستحضرات الصيدلانية.» — ترجمة: vehicle"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«عربة، مركبة، سائل حمل (في الصيدلية)» — ترجمة: vehicle"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"

    - lemma: "مَادَّة حَامِلَة"
      confirm:
        - text: "«سِواغ، مادة حاملة» — ترجمة: excipient"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      contradicts:
        - text: "«مادة حاملة — مادة تستخدم في أبراج التبريد لرفع مستوى الأداء» — ترجمة: tower packing material"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "مادة حاملة مصطلح عام يُستخدم في مجالات مختلفة بدلالات متباينة"

    - lemma: "وَسِيط"
      contradicts:
        - text: "«المتوسِّط بين المتخاصمين المتوسِّط بين المتبايعين أو المتعاملين المعتدل بين شيئين»"
          source: "المعجم الوسيط"
          conflict: "الوسيط يدلّ على الشخص المتوسّط بين طرفين، لا على المادة الحاملة"
        - text: "«يستخدم لتمييع اللون، كالزيوت والماء والورنيش» — ترجمة: medium"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          conflict: "وسيط بمعنى medium يدلّ على الوسط المُمدِّد لا على المادة المُسهِّلة للاستعمال"

stage3_analysis:
  per_lemma:
    - lemma: "سِوَاغ"
      decision: confirmed
      decision_reason: "مصطلح راسخ في الاستعمال المعجمي العربي الكلاسيكي والحديث. الجذر س-و-غ يدلّ على سهولة المرور في الحلق (مقاييس اللغة)، وقد توسّع المعنى في الاصطلاح الحديث ليشمل المادة المُسهِّلة لاستعمال الدواء. موثّق في المعجم الوسيط والمعجم الكبير والمعاجم الموحدة المتعدّدة (الصيدلة، الطب، تقانات الأغذية). يُستخدم مقابل excipient وvehicle معاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المادة غير الفعالة التي تُضاف للمستحضر الدوائي أو الغذائي لتسهيل استعماله، بدلالة عامة تشمل الأشكال الصلبة والسائلة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِوَاغ"

    - lemma: "وسط ناقل"
      decision: removed
      decision_reason: "تركيب وصفي غير مسكوك ولا موثّق في أي معجم مصطلحي عربي. لا يوجد أي دليل معجمي على استخدام هذا التركيب بمعنى vehicle أو excipient. يبدو أنه ترجمة حرفية عمياء أو تركيب حرّ لم يثبت في الاستعمال."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سَائِل حَمْل"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح موثّق في المعجم الموحد لمصطلحات علم الصيدلة (2009) والمعجم الموحد لمصطلحات الكيمياء (1992) مقابل vehicle تحديداً في السياق الصيدلاني. تركيب إضافي ثابت ومسجّل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدلّ تحديداً على الشكل السائل من المادة الحاملة المستخدمة في المستحضرات الصيدلانية، وهو أخصّ من سِواغ"
      actions:
        - command: create_entry
          params: {lemma: "سَائِل حَمْل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حَامِل"
      source: stage1
      decision: removed
      decision_reason: "لفظ شديد الاشتراك اللفظي (حُبلى، حامل مرض، حامل بضائع، دعامة...). في سياق الصيدلة تحديداً يدلّ على حامل العدوى لا المادة الحاملة للدواء. لا يصلح مصطلحاً مستقلاً للدلالة على vehicle بسبب تعدّد المعاني."

    - lemma: "مَادَّة حَامِلَة"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي عام يُستخدم في مجالات مختلفة بدلالات متباينة (مادة حشو في أبراج التبريد، مادة حاملة في الأغذية). ورد مرادفاً لسِواغ في معجم واحد (تقانات الأغذية) لكنه ليس مصطلحاً مختصّاً بمفهوم vehicle."

    - lemma: "وَسِيط"
      source: stage1
      decision: removed
      decision_reason: "الوسيط في المعاجم يدلّ على الشخص المتوسّط بين طرفين (mediator) أو القيمة الإحصائية الوسطى (median). استخدامه بمعنى medium (الوسط المُمدِّد) لا يتطابق مع مفهوم vehicle الصيدلاني."

stage4_content:
  definition:
    current: "أي مادة تسهل استخدام دواء أو صبغة أو مادة أخرى ممزوجة بها"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية. يحتاج إلى صياغة بأسلوب المعجم الوسيط مع تحديد الجنس القريب (مادة غير فعالة) والفصل النوعي (تُمزج مع المادة الفعالة لتيسير استعمالها)"
    authored:
      - type: terminological
        text: "مادَّةٌ غيرُ فعَّالة تُمزَجُ بالدَّواءِ أو الصِّبغةِ أو نحوِهما لتيسيرِ استعمالِها أو تحسينِ قَوامِها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مادَّةٌ غيرُ فعَّالة تُمزَجُ بالدَّواءِ أو الصِّبغةِ أو نحوِهما لتيسيرِ استعمالِها أو تحسينِ قَوامِها"}

  examples:
    per_lemma:
      - lemma: "سِوَاغ"
        examples:
          - text: "يُستخدَمُ النَّشا سِوَاغًا في تَصنيعِ الأَقراصِ الدَّوائيَّة لتَسهيلِ تَفكُّكِها في المَعِدة."
            type: usage
      - lemma: "سَائِل حَمْل"
        examples:
          - text: "يُعَدُّ الماءُ المُقطَّرُ أَكثَرَ سَوائِلِ الحَمْلِ شُيوعًا في المُستَحضَراتِ الصَّيدلانيَّةِ السَّائلة."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُستخدَمُ النَّشا سِوَاغًا في تَصنيعِ الأَقراصِ الدَّوائيَّة لتَسهيلِ تَفكُّكِها في المَعِدة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعَدُّ الماءُ المُقطَّرُ أَكثَرَ سَوائِلِ الحَمْلِ شُيوعًا في المُستَحضَراتِ الصَّيدلانيَّةِ السَّائلة."}

