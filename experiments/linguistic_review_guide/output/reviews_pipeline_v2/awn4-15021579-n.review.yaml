# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-15021579-n (powder / مسحوق)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بودرة» مقترضة من الفرنسية (poudre) وليست عربية الأصل، ويوجد بديل فصيح مُثبت هو «مسحوق»"
      - "التعريف العربي الحالي أقرب إلى الترجمة الحرفية للتعريف الإنجليزي منه إلى أسلوب المعجم العربي"
    observations: >
      المفهوم واضح: مادة صلبة سُحقت حتى صارت جزيئات دقيقة سائبة. الجذر العربي «سحق» يغطّي
      هذا المفهوم تغطية تامة، واسم المفعول «مسحوق» مُثبت في المعاجم العربية الحديثة والقديمة
      بهذا المعنى تحديداً. المجال الدلالي يتقاطع مع ألفاظ عربية أخرى مثل «دُقاق» و«ذَرُور» و«هَباء»
      لكن لكل منها حقل دلالي مختلف.
  blind_candidates:
    - lemma: "ذَرُور"
      generation_method: ishtiqaq
      justification: >
        من الجذر «ذ ر ر» على وزن فَعُول، يدلّ على ما يُذَرّ من مادة يابسة مسحوقة.
        ابن فارس في المقاييس: «الذال والراء المشددة أصل واحد يدلّ على لطافة وانتشار»،
        وهو ما يتوافق مع مفهوم الجزيئات الصغيرة المنتشرة.
    - lemma: "دُقَاق"
      generation_method: ishtiqaq
      justification: >
        من الجذر «د ق ق» على وزن فُعَال، ومعناه في المعاجم «فُتات كل شيء»
        أي ما نتج عن تفتيت مادة صلبة إلى أجزاء صغيرة.
    - lemma: "هَبَاء"
      generation_method: majaz
      justification: >
        إزاحة دلالية من المعنى الأصلي «دقاق التراب الذي تطيره الريح» إلى عموم
        الجزيئات الدقيقة من أي مادة صلبة مسحوقة. ورد في القرآن: ﴿فَكَانَتْ هَبَاءً مُنْبَثًّا﴾.
    - lemma: "بُودْرَة"
      generation_method: taarib
      justification: >
        تعريب من الفرنسية «poudre» شائع في الاستعمال العربي المعاصر، يقبل لام التعريف
        (البودرة) والجمع السالم (بودرات) والنسبة. لكنه ملاذ أخير لوجود «مسحوق» الفصيح.

stage2_evidence:
  per_lemma:
    - lemma: "مَسْحُوق"
      confirm:
        - text: "«المسحوق: المدقوق (ج) مساحيق، و(في الكيمياء) صفة للمادة الصلبة عندما توجد على شكل دقائق صغيرة (مج)»"
          source: "المعجم الوسيط (عبر هَوَرَماني)"
        - text: "«المدقوق. (فى الكيمياء) Powder: صِفَةٌ للمادةِ الصُّلْبَةِ عندما تُوجَدُ على شَكلِ دقائقَ صغيرةٍ. ومسحوق الغسيل Detergent: مُنَظِّفٌ على هيئةِ حُبَيْباتٍ يُستعمَلُ فى غسيل الثياب وغيرها»"
          source: "المعجم الكبير"
        - text: "«مسحوق — powder — poudre»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (ARABTERM)"
        - text: "«مَسْحوق — pulvis (powder) — poudre»"
          source: "المعجم الطبي الموحد (ARABTERM)"
        - text: "«مسحوق، ذرور — powder»"
          source: "المعجم الموحد لمصطلحات الكيمياء (ARABTERM)"
      expands:
        - text: "«والعَنْبَرُ الأَكْلَفُ المَسْحُوقُ خالَطَهُ ... والزَّنْجَبِيلُ ورَنْدٌ هَاجَهُ السَّحَرُ» — عمر بن أبي ربيعة"
          source: "المعجم الكبير (شواهد)"
          addition: "شاهد شعري يؤكد الاستعمال القديم لصيغة المسحوق بمعنى المَدْقوق"
        - text: "«(سحق) السين والحاء والقاف أصلان... والآخر إنهاك الشيء حتى يبلغ به إلى حال البلى... سحقت الشيء أسحقه سحقاً»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «سحق» يتضمن معنى الإنهاك والسَّحْق وهو أصل اسم المفعول «مسحوق»"

    - lemma: "بُودْرَة"
      expands:
        - text: "«(1) ذَرُور؛ مسحوق؛ بُوْدرة (2) ثلجٌ ناعمٌ خفيف (3) بارود»"
          source: "المورد الحديث (2008)"
          addition: "بودرة مذكورة كمرادف لـ«ذرور» و«مسحوق» في ترجمة powder"
        - text: "«بودرة منتفخة لمنع المياة؛ بودرة حاجزة للمياة — water blocking powder; swelling powder»"
          source: "موسوعة الكهرباء IEC 60050 (ARABTERM)"
          addition: "استعمال تقني حديث للفظة «بودرة» في مركبات اصطلاحية"

    - lemma: "ذَرُور"
      confirm:
        - text: "«الذَّرُورُ: كلُّ ما يُذَرُّ. ما يُذَرُّ في العين وعلى الجُرح من دَواءٍ يابس أو على الطَّعام من المِلْح والتَّوابل ونحوها. نوع من الطِّيب مَجموعٌ من أخْلاطٍ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«(الذرور) ما يُذَرّ في العين وعلى الجرح من دواء يابس وعلى الطعام من ملح مسحوق (ج) أذرة»"
          source: "المعجم الوسيط (عبر هَوَرَماني)"
          conflict: "الذرور في المعاجم العربية مقيّد بالسياق الطبي والغذائي (دواء يُذَرّ في العين أو ملح يُنثر)، وليس مطلق مادة صلبة مسحوقة"
        - text: "«ذرور — epipastic»"
          source: "معجم المصطلحات الطبية (ARABTERM)"
          conflict: "ARABTERM تترجم ذرور بـ epipastic (ذَرُور طبي يُنثر على الجلد) لا powder العام"
      expands:
        - text: "«(ذرّ) الذال والراء المشددة أصل واحد يدلّ على لطافة وانتشار. ومن ذلك الذرّ: صغار النمل... وذررت الملح والدواء. والذريرة معروفة»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على اللطافة والانتشار وهو متسق مع مفهوم الجزيئات الدقيقة لكن الاستعمال المعجمي مقيّد"

    - lemma: "دُقَاق"
      confirm:
        - text: "«الدُّقَاقُ: فتات كل شيء»"
          source: "المعجم الوسيط"
        - text: "«الدُّقَاقُ: الصَّغِيرُ الرَّدِىءُ. فُتَاتُ كُلِّ شىءٍ دُقَّ. وقيل: ما انْدَقَّ مِنَ الشَّىْءِ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الدُّقَاق: الذى لا غِلَظَ له، خلافُ الغليظ. من التُّراب: اللِّينُ الذى كَسَحَتْه الرِّيحُ من الأرض»"
          source: "المعجم الكبير"
          conflict: "الدقاق يتراوح بين معنى الفُتات (قطع صغيرة) والتراب الناعم، وليس مرادفاً دقيقاً للمسحوق الكيميائي المعدّ قصداً"

    - lemma: "هَبَاء"
      contradicts:
        - text: "«الهَبَاءُ: الترابُ الذي تُطِيرُه الريحُ ويلزق بالأشياء أو ينبثّ في الهواء فلا يبدو إلا في ضوء الشمس»"
          source: "المعجم الوسيط"
          conflict: "الهباء تراب مُعلّق في الهواء تحديداً، وليس مادة صلبة مسحوقة بعامة"
        - text: "«هباء — aerosols — aérosols»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (ARABTERM)"
          conflict: "ARABTERM تترجم هباء بـ aerosols لا powder، مما يؤكد اختلاف الحقل الدلالي"
      expands:
        - text: "«(هبو) الهاء والباء والحرف المعتل: كلمة تدل على غبرة ورقة فيها... والهباء: دقاق التراب»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الغبار المتطاير لا على المسحوق المُعَدّ"

stage3_analysis:
  per_lemma:
    - lemma: "مَسْحُوق"
      decision: confirmed
      decision_reason: >
        مُثبت في المعجم الوسيط والمعجم الكبير ومعاجم ARABTERM المتخصصة (الجيولوجيا، الطب، الكيمياء، الصيدلة، البيطرة)
        بمعنى «المادة الصلبة على شكل دقائق صغيرة» وهو المقابل الدقيق لـ powder. اسم مفعول من «سحق»
        على الوزن القياسي، جذره عربي أصيل، وله جمع تكسير مُثبت «مساحيق».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح العلمي الفصيح الأول لمفهوم المسحوق؛ يدلّ على نتاج عملية السَّحْق القصدية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَسْحُوق"

    - lemma: "بُودْرَة"
      decision: confirmed
      decision_reason: >
        لفظة معرّبة من الفرنسية (poudre) شائعة الاستعمال في العربية المعاصرة، وردت في المورد الحديث
        مرادفةً لـ«مسحوق» و«ذرور»، وفي موسوعة الكهرباء في مركبات تقنية. تقبل لام التعريف (البودرة)
        والجمع (بودرات). رغم وجود البديل الفصيح «مسحوق»، فإن شيوعها في الاستعمال المعاصر يبرر إبقاءها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظة معرّبة شائعة في الاستعمال اليومي والتجاري، تُستعمل أكثر في سياقات التجميل والمنتجات الاستهلاكية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُودْرَة"

    - lemma: "ذَرُور"
      source: stage1
      decision: removed
      decision_reason: >
        الذَّرُور في المعاجم العربية مقيّد بالسياق الطبي والغذائي: «ما يُذَرّ في العين وعلى الجرح من دواء يابس،
        أو على الطعام من الملح والتوابل». وفي ARABTERM يقابل epipastic لا powder.
        إضافته إلى هذه المجموعة ستوسّع دلالته بلا سند معجمي كافٍ.
      evidence_assessment:
        case: mixed

    - lemma: "دُقَاق"
      source: stage1
      decision: removed
      decision_reason: >
        الدُّقاق يعني «فُتات كل شيء» و«ما اندقّ من الشيء» وهو أقرب إلى الفتات والكِسَر الصغيرة
        منه إلى المسحوق الناعم المتجانس. كما أن المعجم الكبير يخصّصه بالتراب الناعم.
        الفرق الدلالي واضح: الدقاق نتاج تفتّت طبيعي، والمسحوق نتاج سحق قصدي لمادة صلبة.
      evidence_assessment:
        case: mixed

    - lemma: "هَبَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الهباء في المعاجم العربية يعني «التراب الذي تطيره الريح» وهو مُعلّق في الهواء تحديداً،
        لا مادة صلبة مسحوقة قابلة للتخزين. وفي ARABTERM يقابل aerosols.
        مقاييس اللغة: «كلمة تدل على غبرة ورقة فيها». الحقل الدلالي مختلف جوهرياً.
      evidence_assessment:
        case: contradicts_only

stage4_content:
