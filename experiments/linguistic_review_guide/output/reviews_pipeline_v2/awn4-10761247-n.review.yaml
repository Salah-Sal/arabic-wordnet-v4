      decision: confirmed
      decision_reason: "اسم فاعل فصيح من استخدمَ، شائع في العربية المعاصرة بمعنى user في السياقات التقنية والعامة. مُثبت في معاجم المصطلحات الحديثة (معجم البيانات والذكاء الاصطناعي، موسوعة الكهرباء) بهذه الدلالة تحديداً. التشكيل بكسر الدال (مُسْتَخْدِم — اسم فاعل) يُميّزه عن مُسْتَخْدَم (اسم مفعول = موظّف)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل بكثرة في السياقات التقنية والرقمية (مستخدم الحاسوب، مستخدم التطبيق)، وله دلالة إضافية على التفاعل مع الأنظمة. يحمل ظلالاً من التسخير والتوظيف (من الخِدْمَة)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَخْدِم"

    - lemma: "مُسْتَعْمِل"
      decision: confirmed
      decision_reason: "اسم فاعل فصيح من استعملَ، مُثبت في معاجم المصطلحات (معجم تقانة المعلومات، المورد الحديث، معجم اللسانيات) بمعنى user. أعمّ من مُسْتَخْدِم لأنه لا يقتصر على السياق التقني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ استعمالاً وأقرب إلى اللغة العامة — يشمل استعمال الأشياء المادية والمعنوية دون اختصاص بالسياق التقني. من العَمَل (التشغيل المباشر) لا من الخِدْمَة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَعْمِل"

    - lemma: "مُسْتَهْلِك"
      source: stage1
      decision: removed
      decision_reason: "المستهلك (consumer) يختص بمَن يقتني ويستنفد السلع والخدمات — أضيق من المفهوم المطلوب (user). لا يصح استبداله بمُسْتَخْدِم في كل سياق: نقول مُسْتَخْدِم الحاسوب لا مُسْتَهْلِك الحاسوب."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُنْتَفِع"
      source: stage1
      decision: removed
      decision_reason: "المنتفع (beneficiary) يدلّ على تلقّي المنفعة لا ممارسة الاستعمال. مصطلح قانوني/طبي مخصص (حق الانتفاع، المنتفع من الخدمة الصحية) لا يصلح مرادفاً عاماً لـ user."
      evidence_assessment:
