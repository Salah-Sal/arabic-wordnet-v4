stage1_review:
  assessment:
    concerns:
      - "التشكيل ناقص في اللمّتين الموجودتين: مُستخدِم ومُستعمِل — يحتاجان تشكيلاً كاملاً"
      - "تعريف AWN العربي يبدو ترجمة حرفية من الإنجليزية بتكرار لا فائدة منه (شخص يقوم باستخدام... شخص يستخدم)"
      - "المعجم الوسيط يُعرّف «المُسْتَخْدَم» بأنه مَن يؤدّي عملاً في الحكومة بأجر (أي موظّف)، لا مَن يستخدم شيئاً — فالدلالة المعجمية الأصلية مختلفة عن المراد"
    observations: "المجموعة تُعبّر عن مفهوم عام وأساسي — شخص يستخدم شيئاً ما — وهو مفهوم شائع في العربية المعاصرة خاصة في السياقات التقنية. اللمّتان الموجودتان (مُسْتَخْدِم ومُسْتَعْمِل) كلتاهما اسم فاعل من صيغة اسْتَفْعَلَ وتدلّان على الفاعلية والمباشرة في الاستخدام. الفرق بينهما دقيق: الأولى من الخِدْمَة (طلب تسخير الشيء) والثانية من العَمَل (طلب تشغيل الشيء). المفهوم عربي أصيل لا يحتاج اقتراضاً."

  blind_candidates:
    - lemma: "مُسْتَخْدِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استخدمَ (استفعل من خ د م) على وزن مُسْتَفْعِل، يدلّ على مَن يطلب خِدْمَة الشيء ويسخّره لحاجته"
    - lemma: "مُسْتَعْمِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استعملَ (استفعل من ع م ل) على وزن مُسْتَفْعِل، يدلّ على مَن يطلب عَمَل الشيء ويشغّله"
    - lemma: "مُسْتَهْلِك"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استهلكَ (استفعل من ه ل ك)، يدلّ على مَن يستنفد الشيء باستعماله — قريب من المعنى لكن فيه دلالة الإفناء"
    - lemma: "مُنْتَفِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من انتفعَ (انفعل من ن ف ع)، يدلّ على مَن ينال النفع من الشيء — يركّز على جانب الاستفادة لا الاستعمال"


stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَخْدِم"
      confirm:
        - text: "«شخص أو مجموعة تتفاعل مع نظام أو تستفيد منه.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«مستخدم — user»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«المُسْتخدِم؛ صاحب العمل.» — ترجمة employer"
          source: "المورد الحديث (2008)"
        - text: "«يعتبر أشخاصا مستخدمين الأشخاص الذين هم في علاقة عمل...»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      contradicts:
        - text: "«(المستخدم) من يُؤَدِّي عملاً في الحكومة ونحوها بأجر (محدثة)»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يُعرّف المُسْتَخْدَم (بفتح الدال — اسم مفعول) بمعنى الموظّف، لا المُسْتَخْدِم (بكسر الدال — اسم فاعل) بمعنى مَن يستخدم شيئاً. التشكيل حاسم في التفريق"
      expands:
        - text: "«مستخدم — employer» في مسرد الفلسفة وعلم النفس"
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
          addition: "في بعض السياقات يُستعمل مُسْتَخْدِم بمعنى صاحب العمل (employer) — وهو اسم الفاعل بكسر الدال أيضاً، مما يُحدث اشتراكاً لفظياً"

    - lemma: "مُسْتَعْمِل"
      confirm:
        - text: "«هو ذلك الشخص، أو الجهة، الذي يستعمل نظاماً ما مقابل الشخص أو الجهة التي طورته و/أو تقوم بصيانته»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
        - text: "«(1) المستعمِل (2) ... (3) مستخدِمُ الكومبيوتر.» — ترجمة user"
          source: "المورد الحديث (2008)"
        - text: "«مُشترِك، مستهلِك، مستعمِل» — ترجمة user"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«مُستعمِل، مُستخدِم — user» في مجال الخزانات: الشخص الذي يستفيد من خدمات المكتبة"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«(المُسْتَعْمَل) من الثياب ونحوها الذي مَهَن»"
          source: "المعجم الوسيط"
          conflict: "هذا تعريف اسم المفعول مُسْتَعْمَل (بفتح الميم الثانية) بمعنى البالي، لا اسم الفاعل مُسْتَعْمِل (بكسرها). لا تعارض حقيقي بل اختلاف في البنية الصرفية"

    - lemma: "مُسْتَهْلِك"
      confirm:
        - text: "«مُسْتَهلِك — consumer; user» في مجال الإعلام والتواصل"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«المُستعمِل النهائيّ للسلعة» — تعريف المستهلك"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      contradicts:
        - text: "«كل شخص طبيعي أو معنوي يقتني أو يستعمل لتلبية حاجاته غير المهنية منتجاتٍ أو سلعاً أو خدمات معدة لاستعماله الشخصي أو العائلي.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "المستهلك يختص بمَن يقتني ويستنفد السلع والخدمات لحاجته الشخصية — أضيق من مفهوم المستخدم العام"

    - lemma: "مُنْتَفِع"
      contradicts:
        - text: "«مُنتفِع — beneficiary» في المعجم الطبي الموحد"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المنتفع يعني المستفيد (beneficiary) لا المستخدم (user) — دلالته مُزاحة نحو تلقّي المنفعة لا ممارسة الاستعمال"
        - text: "«مُنتفِع — usufructuary» في معجم القانون"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "في القانون: صاحب حق الانتفاع — مصطلح قانوني مخصص لا يُعمَّم"


stage3_analysis:
