    assessment:
      decision: retain
      reason: "التعريف الحالي سليم من الناحية العلمية واللغوية: الجنس القريب (مادة مائعة) يربطه بالفوقيّ (مائع)، والفصل النوعي (ليس لها شكل ثابت ولكن لها حجم ثابت) يميّزه عن الغاز الذي ليس له حجم ثابت. يتّفق مع تعريفات المعجم الوسيط والمعجم الكبير والمعاجم الموحدة."
