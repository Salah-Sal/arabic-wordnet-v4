# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14964238-n (liquid)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (سائل)، وقد يكون من المفيد إثراؤها بمرادفات أو مصطلحات قريبة"
      - "اللمّة الموجودة (سائل) بدون تشكيل كامل — تحتاج إلى تشكيل"
    observations: "المفهوم (مادة سائلة لها حجم ثابت وشكل متغيّر) مفهوم فيزيائي أساسي له تعبير عربي فصيح مباشر. الجنس القريب هو المائع (fluid) الذي يشمل السوائل والغازات معاً. التعريف الحالي واضح ويميّز السائل عن الغاز بثبوت الحجم. المفهوم متجذّر في التراث العلمي العربي منذ العصر العباسي."
  blind_candidates:
    - lemma: "سَائِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من سَالَ يَسِيلُ (جذر س.ي.ل) على وزن فَاعِل، يدلّ على ما من شأنه الجريان والسيلان، وهو أقرب لفظ عربي لحالة المادة بين الصلابة والغازية"
    - lemma: "سَيَّال"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من سَالَ يَسِيلُ على وزن فَعَّال، تدلّ على شدة الجريان والسيولة، لكنها قد تتداخل مع مفهوم المائع (fluid) الأعمّ"
    - lemma: "ذَوْب"
      generation_method: majaz
      justification: "مصدر من ذَابَ يَذُوبُ، يدلّ في الأصل على ما ذُوِّب من الشيء، وقد يُستعمل مجازاً للمادة السائلة بوصفها ناتجة عن انصهار"
    - lemma: "قَطُور"
      generation_method: ishtiqaq
      justification: "صيغة فَعُول من قَطَرَ يَقْطُرُ (جذر ق.ط.ر)، تدلّ على ما يقطر ويتساقط، وهي صفة ملازمة للسوائل"

stage2_evidence:
  per_lemma:
    - lemma: "سَائِل"
      confirm:
        - text: "«(فى الكيمياء) : حالة من حالات المادة الثلاث , وسط بين الصلابة والغازية»"
          source: "المعجم الوسيط"
        - text: "«(فى الكيمياء) (Liquid (E: حالَةٌ مـن حالات المادة الثلاث, وَسَطٌ بين الصلابة والغازية, وذلك وفقًا لدرجة التجاذُبِ بين جُزَيْئاتها ومن ثَمَّ قُدْرتِها على الحركة. له حجم ثابت عند ثبوت الحرارة والضغط, ويأخذ شكل الإناء الذى يحتويه.»"
          source: "المعجم الكبير"
        - text: "«السَّائِلُ: مَا من شَأْنه أَن تبسط أجزاؤه إِلَى أَسْفَل.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«حالة من حالات المادة الثلاث وسط بين الصلابة والغازية»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«الحالة الوسطى للمادة بين الحالة الصلبة والغازية والتي تمتلك فيها المادة حجما محددا وتتدفق بسهولة لكن لا يكون لها شكل محدد»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«دواء من شأنه أن تنبسط أجزاؤه إلى أسفل عند فعل الحرارة الغريزية فيه، كالمائعات كلها»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يوسّع الاستعمال ليشمل السياق الطبي القديم ويربط السائل بالمائع"
    - lemma: "سَيَّال"
      contradicts:
        - text: "«مائع — أي مادة تتدفق أو تتحرك سواء كانت في حالة شبه صلبة أو سائلة أو حمأة أو غاز»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "السيّال أقرب إلى مفهوم المائع (fluid) العامّ الذي يشمل السوائل والغازات، وهو فوقيّ المجموعة (hypernym) لا مرادف"
      evidence_status: "no_material_found"
    - lemma: "ذَوْب"
      contradicts:
        - text: "«ما ذُوِّب من الشيء»"
          source: "المعجم الوسيط"
          conflict: "الذوب يدلّ على ناتج عملية الإذابة لا على حالة المادة السائلة بذاتها"
        - text: "«ما ذُوِّبَ من الشَّيْءِ — العَسَلُ عامَّةً — ما فى أبياتِ النَّحْل من العَسَل خاصَّةً — العَسَلُ الخالِصُ الذى نُقِّى من شمعه»"
          source: "المعجم الكبير"
          conflict: "الذوب مخصّص بالعسل في الاستعمال التراثي، وليس مصطلحاً لحالة المادة"
    - lemma: "قَطُور"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "سَائِل"
      decision: confirmed
      decision_reason: "مصطلح ثابت مُجمَع عليه في المعاجم العربية الحديثة والكلاسيكية لحالة المادة بين الصلابة والغازية. مثبت في المعجم الوسيط والمعجم الكبير ومقاليد العلوم والمعاجم الموحدة للعلوم والهندسة. جذره (س.ي.ل) يدلّ على الجريان والامتداد وهو مطابق للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَائِل"
    - lemma: "سَيَّال"
      source: stage1
      decision: removed
      decision_reason: "السيّال بصيغة فَعَّال يقترب دلالياً من المائع (fluid) الذي هو الفوقيّ المباشر لهذه المجموعة. لم يُعثر عليه في المعاجم كمرادف للسائل بمعنى حالة المادة، بل يُستعمل وصفاً عاماً لما يسيل بشدة."
      evidence_assessment:
        case: no_material
    - lemma: "ذَوْب"
      source: stage1
      decision: removed
      decision_reason: "الذوب في المعاجم يعني (ما ذُوِّب من الشيء) وتخصّص في التراث بالعسل، فهو يدلّ على ناتج عملية الإذابة لا على حالة السيولة بذاتها. التعارض واضح مع المفهوم الفيزيائي المطلوب."
      evidence_assessment:
        case: contradicts_only
    - lemma: "قَطُور"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أيّ شاهد معجمي لاستعمال (قطور) بمعنى السائل كحالة من حالات المادة. الجذر ق.ط.ر يدلّ على التقاطر والتساقط قطرةً قطرةً، وهو وصف لسلوك لا لحالة."
      evidence_assessment:
        case: no_material

