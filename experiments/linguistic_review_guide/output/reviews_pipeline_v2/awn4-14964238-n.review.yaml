            type: usage
          - text: "يأخذ السائلُ شكلَ الإناء الذي يُوضع فيه مع احتفاظه بحجمه الثابت."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يتحوّل الجليدُ إلى سائلٍ عند ارتفاع درجة الحرارة فوق الصفر المئوي."
      - command: add_sense_example
