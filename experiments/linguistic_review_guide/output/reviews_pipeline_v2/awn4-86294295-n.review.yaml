# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-86294295-n
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «شخص أسود» عبارة وصفية حرّة وليست مصطلحاً مسكوكاً؛ يمكن إبدال «أسود» بـ«داكن» أو «أسمر» وتبقى صالحة وصفاً — فتفشل في اختبار السَّكّ."
      - "المُسند الأعلى (hypernym) خاطئ: awn4-09786620-n (عامل/فاعل = شخص يعمل ويُنجِز الأمور) لا يصلح مُسنداً أعلى لمفهوم «شخص ذو بشرة داكنة من أصل أفريقي»؛ المُسند الصحيح ينبغي أن يكون «إنسان» أو «شخص»."
      - "المفهوم تصنيف عِرقي حسّاس ثقافياً؛ أغلب المصطلحات العربية التاريخية (زنجي، حبشي) تحمل شحنة سلبية في الاستعمال المعاصر."
    observations: "المجموعة تحاول تمثيل المفهوم الإنجليزي (Black person / Negro) في الشبكة الدلالية العربية. في التراث المعجمي العربي يوجد مصطلح «الزِّنج» (جمع) و«زِنجيّ» (مفرد) وهو مُعرَّف في المعجم الوسيط تعريفاً يكاد يطابق تعريف المجموعة. غير أن الاستعمال المعاصر ينفر من هذا اللفظ لما يحمله من دلالات عنصرية. المُسند الأعلى المُختار خاطئ بوضوح ويحتاج تصحيحاً بنيوياً."
  blind_candidates:
    - lemma: "زِنْجِيّ"
      generation_method: majaz
      justification: "لفظ عربي قديم مُعرَّف في المعاجم الكلاسيكية (القاموس المحيط، لسان العرب، المعجم الوسيط) بمعنى «الواحد من الزِّنج»، وهم جيل من السودان ذوو بشرة سوداء وأصول أفريقية. إزاحة دلالية من اسم القبيلة/الجِيل إلى الفرد."
    - lemma: "أَسْوَدُ"
      generation_method: ishtiqaq
      justification: "صفة مشبّهة من الجذر «سود» على وزن أَفْعَل، تُستعمل في العربية استعمالاً اسمياً (صفة غالبة) للدلالة على الشخص ذي البشرة السوداء، كما في «الأسودان» و«السُّودان»."
    - lemma: "إِفْرِيقِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى أفريقيا على وزن فِعْلِيلِيّ، تُستعمل اسمياً للدلالة على المنتمي إلى القارة الأفريقية، لكنها أوسع دلالة من المفهوم المستهدف."
    - lemma: "حَبَشِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الحبشة (شرق أفريقيا)، مصطلح تاريخي كان يُطلق على ذوي البشرة الداكنة من شرق أفريقيا. أضيق من المفهوم المستهدف إذ يقتصر على الإثيوبيين والإريتريين."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "شخص أسود"
      evidence_status: "no_material_found"

    - lemma: "زِنْجِيّ"
      confirm:
        - text: "«الزِّنْجُ جيلٌ من السودان يتميز بالجلد الأسود, والشعر الجعد, والشفة الغليظة, والأنف الأفطس يطلق الآن على بعض السلالات المنحدرة من القبائل الإفريقية التى استوطنت»"
          source: "المعجم الوسيط"
        - text: "«الزَّنْجُ ويُكْسَرُ والمَزْنَجَةُ والزُّنوجُ: جِيلٌ من السُّودانِ، واحِدُهُمْ: زَنْجِيُّ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الزنج جيل من السودان يتميز بالجلد الأسود والشعر الجعد والشفة الغليظة والأنف الأفطس يسكن حول خط الاستواء وتمتد بلادهم من المغرب إلى الحبشة وبعض بلادهم على نيل مصر ويطلق الآن على بعض السلالات المنحدرة من القبائل الإفريقية أنى استوطنت»"
          source: "المعجم الوسيط (حواماني)"
      expands:
        - text: "«زنجي: نوع من الطير»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "للفظ دلالة ثانوية على نوع من الطير، لا تتعارض مع الدلالة الإثنية الأساسية"

    - lemma: "أَسْوَدُ"
      contradicts:
        - text: "«الصندوقُ الأسودُ: صندوقٌ برتقاليُّ اللون... الموتُ الأسودُ: الغَرَقُ والشَّرَقُ... اليومُ الأسودُ: وقتُ الشِّدَّة... أسودُ البطن: المهزولُ... أسودُ القلب: حقودٌ»"
          source: "المعجم الكبير"
          conflict: "المداخل المعجمية لـ«أسود» تُركّز على اللون والمجاز منه، ولا يرد استعمال اسمي مستقل بمعنى «شخص من أصل أفريقي»"
      expands:
        - text: "«اسْوَدَّ الشَّىْءُ: صار أَسْوَد, وقيل: صار شديد السَّوَادِ»"
          source: "المعجم الكبير"
          addition: "الجذر «سود» أصله في اللون لا في الإثنية"

    - lemma: "إِفْرِيقِيّ"
      evidence_status: "no_material_found"

    - lemma: "حَبَشِيّ"
      contradicts:
        - text: "«حَبَشِيّ: من (ح ب ش) نسبة إلى الحَبَش»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "النسبة مقصورة على الحبشة (إثيوبيا) تحديداً، لا تشمل جميع ذوي البشرة الداكنة من أفريقيا"
      expands:
        - text: "«أي وإن كان الأخذ أسود حبشيًا أو زنجيًا»"
          source: "مجمع بحار الأنوار للفتّني"
          addition: "النص يُفرّق بين «حبشي» و«زنجي» مما يدل على أنهما ليسا مترادفين تامّين"

# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "شخص أسود"
      decision: removed
      decision_reason: "عبارة وصفية حرّة تفشل في اختبار السّكّ: يمكن إبدال «أسود» بـ«داكن» أو «أسمر» والعبارة تبقى صالحة كوصف. كذلك يمكن إبدال «شخص» بـ«رجل» أو «إنسان». لا يوجد أي شاهد معجمي يُسجّلها وحدة معجمية ثابتة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "زِنْجِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مُعرَّف في المعجم الوسيط والقاموس المحيط بتعريف يكاد يُطابق تعريف المجموعة الترادفية. لفظ عربي ذو جذر معروف (زنج) على وزن النسبة (فَعْلِيّ). رغم حساسيته في الاستعمال المعاصر، هو اللفظ المعجمي الوحيد المُسجَّل والمُعرَّف لهذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المعجمي المُعرَّف تعريفاً إثنياً-أنثروبولوجياً في المعاجم العربية الكبرى؛ يُستعمل في السياق العلمي والتاريخي."
      actions:
        - command: create_entry
          params: {lemma: "زِنْجِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "أَسْوَدُ"
      source: stage1
      decision: removed
      decision_reason: "صفة لونية في المقام الأول (أَفْعَل التفضيل/الصفة المشبّهة من «سود»). لا يرد في المعاجم بوصفه اسماً مستقلاً بمعنى «شخص من أصل أفريقي». الاستعمال الاسمي المجازي («الأسودان» = التمر والماء) لا علاقة له بالمفهوم المستهدف."
      evidence_assessment:
        case: contradicts_only

    - lemma: "إِفْرِيقِيّ"
      source: stage1
      decision: removed
      decision_reason: "أوسع دلالة من المفهوم المطلوب: يشمل كل منتسب إلى أفريقيا بصرف النظر عن لون البشرة (مثلاً: المغاربة والمصريون أفارقة لكنهم ليسوا من الزنج). لا يوجد شاهد معجمي يقصره على ذوي البشرة الداكنة."
      evidence_assessment:
        case: no_material

    - lemma: "حَبَشِيّ"
      source: stage1
      decision: removed
      decision_reason: "أضيق من المفهوم المطلوب: نسبة إلى الحبشة (إثيوبيا/إريتريا) تحديداً. النصوص المعجمية تُفرّق صراحة بين «الحبشي» و«الزنجي» مما يدل على أنهما مفهومان مختلفان."
      evidence_assessment:
        case: mixed

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص ذو بشرة داكنة ينحدر من أفريقيا (أو كان أسلافه من أفريقيا)"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول في مضمونه لكنه يحتاج إلى صياغة معجمية أدق على نمط المعجم الوسيط، مع الإشارة إلى أنّ المصطلح يُطلق أيضاً على السلالات المنحدرة من تلك الأصول أينما استوطنت."
    authored:
      - type: terminological
        text: "مَن ينتسب إلى الزِّنج، وهم جنس من البشر يتميّزون بالبشرة الداكنة والأصول الأفريقية، ويُطلَق على السلالات المنحدرة من القبائل الأفريقية أنّى استوطنت."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "الزِّنْجُ جِنسٌ من البشر يتميّز بالبشرة السوداء، يستوطنون المناطق الممتدّة حول خطّ الاستواء في أفريقيا من المغرب إلى الحبشة. ويُطلَق المصطلح في الاستعمال الحديث على كلّ مَن انحدر من تلك القبائل الأفريقية بصرف النظر عن موطنه الحالي."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَن ينتسب إلى الزِّنج، وهم جنس من البشر يتميّزون بالبشرة الداكنة والأصول الأفريقية، ويُطلَق على السلالات المنحدرة من القبائل الأفريقية أنّى استوطنت."

  examples:
    per_lemma:
      - lemma: "زِنْجِيّ"
        examples:
          - text: "أشار المؤرخون العرب إلى ثورة الزِّنج في جنوب العراق في القرن الثالث الهجري بوصفها من أكبر الانتفاضات الاجتماعية في التاريخ الإسلامي."
            type: usage
    actions:
      - command: add_synset_example
