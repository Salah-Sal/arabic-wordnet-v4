# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13545186-n — obsolescence
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «بطلان» دلالتها الراسخة في الفقه والقانون هي الفساد وعدم النفاذ (nullity)، لا التقادم أو الخروج عن الاستعمال"
      - "لمّة «تقادم» لها استعمال قانوني راسخ (سقوط الحق بمضي المدة = prescription) قد يُلبس مع المعنى العام"
      - "التعريف العربي الحالي يستعمل كلمة «التقادم» وهي إحدى لمّات المجموعة — دوران معجمي"
    observations: "المفهوم (صيرورة الشيء مهملاً خارجاً عن الاستعمال بمرور الزمن) مفهوم عربي أصيل عبّرت عنه العربية بألفاظ كثيرة منها: دَثَرَ، دَرَسَ، عَفَا، بَلِيَ. والجذر «قدم» في صيغة التفاعل (تقادم) يؤدي المعنى العام جيداً. أما «بطلان» فانزياحها نحو المعنى القانوني/الفقهي يجعلها غير دقيقة هنا."
  blind_candidates:
    - lemma: "دُثُور"
      generation_method: ishtiqaq
      justification: "مصدر دَثَرَ على وزن فُعُول، ويدل على اندراس الأثر وذهابه بمرور الزمن. قال ابن مالك: «باب الدثور: درس وطمس وأقوى وخوى واقفر وعفا». وفي الحديث: «حادثوا هذه القلوب فإنها سريعة الدثور»."
    - lemma: "اِنْدِثَار"
      generation_method: ishtiqaq
      justification: "مصدر اندثر على وزن انفعال من الجذر دثر، يدل على زوال الشيء واضمحلاله تدريجياً."
    - lemma: "بِلًى"
      generation_method: ishtiqaq
      justification: "مصدر بَلِيَ على وزن فِعَل، يدل على فناء الشيء ورثاثته بتقادم العهد. استُعمل في المعاجم الاصطلاحية مقابلاً لـ obsolescence."
    - lemma: "تَعَتُّق"
      generation_method: ishtiqaq
      justification: "مصدر تعتّق على وزن تفعُّل من الجذر عتق الدال على القِدَم. قال ابن فارس: «العين والتاء والقاف... معنى القدم». وكل شيء تقادم فهو عاتق وعتيق."

stage2_evidence:
  per_lemma:
    - lemma: "بُطْلَان"
      confirm:
        - text: "«بُطْلاَن» = obsolescence"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«بُطلان» = desuetude"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: "«الْبَاءُ وَالطَّاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ ذَهَابُ الشَّيْءِ وَقِلَّةُ مُكْثِهِ وَلُبْثِهِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل اللغوي عام (ذهاب الشيء)، لكن الاستعمال الاصطلاحي انحصر في البطلان القانوني والفقهي"
        - text: "«(فى العقود): جزاءُ يُرتبه القانون على عدم استجماع العقد لأركانه مستوفية شروطها، فيعتبر العقد منعدماً ولا ينتج أثراً»"
          source: "المعجم الكبير"
          conflict: "التعريف المعجمي الأساسي يحصر البطلان في المعنى القانوني (عدم نفاذ العقد)"
        - text: "«البطلان عند الحنفية هو كون الفعل بحيث لا يوصل إلى المقصود الدنيوي أصلاً... وعند الشافعية أعمّ من ذلك لأنه يشتمل الفساد أيضاً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المصطلح راسخ في الفقه بمعنى عدم الصحة والفساد، لا التقادم"
        - text: "«البُطلان: ضدها»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "تعريف مختصر يشير إلى ضد الصحة"
      expands:
        - text: "«بُطلان» = nullity — جزاء يقرره القانون إما لعدم توفر ركن من أركان العقد أو بذلك"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يؤكد أن الاستعمال القانوني السائد هو البطلان بمعنى عدم النفاذ لا التقادم"

    - lemma: "تَقَادُم"
      confirm:
        - text: "«تَقَادَمَ الشىءُ: قَدُم وطال عليه الأَمَدُ»"
          source: "المعجم الوسيط"
        - text: "«تقادُمٌ» = obsolescence"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
        - text: "«قدم، بلى» = obsolescence"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«تقادُم» = ageing"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«(التقادم) (فِي القانون) مُدَّة محدودة تسقط بانقضائها المطالبة بالحق أو بتنفيذ الحكم»"
          source: "المعجم الوسيط"
          addition: "للمصطلح معنى قانوني خاص (سقوط الحق بمرور المدة) إلى جانب المعنى العام"
        - text: "«مُضاد التقادم، مانع التيبس — مادة مضافة تعمل على تأخير ظاهرة تقادم وتيبس منتجات المخابز»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "يُستعمل التقادم في سياقات تقنية متنوعة بمعنى ageing/obsolescence"

    - lemma: "دُثُور"
      confirm:
        - text: "«بَاب الدُّثُور: درس وطمس وأقوى وخوى وجوى واقفر وعفا ومح»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
        - text: "«سيف داثر: بعيد عهد بالصقال، وقد دثر دثوراً. ومنه حديث الحسن: حادثوا هذه القلوب فإنها سريعة الدثور»"
          source: "أساس البلاغة للزمخشري"
        - text: "«رسم داثر... وذلك أنه يكون ظاهراً حتى تهبّ عليه الرياح وتأتيه الروامس فتصير له كالدثار فتغطّيه»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«(الدُّثُور) المتدثر والدثارى»"
          source: "المعجم الوسيط"
          conflict: "الوسيط يعرّف الدُّثُور كصفة للمتدثر لا كمصدر بمعنى الاندراس"
        - text: "«الدَّثور: الكسلان البطيء الثقيل الذي لا يكاد يبرح مكانه، الخامل النؤوم»"
          source: "المعجم الكبير"
          conflict: "الدَّثُور (بفتح الدال) صفة للكسلان، تختلف عن الدُّثُور (بضم الدال) المصدر"

    - lemma: "اِنْدِثَار"
      confirm:
        - text: "«نزعة... ميل أو نزعة إلى اندثار تدريجي لبعض الأشكال»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«اندثار — قياس للضعف الذي يصيب إشعاعاً... عند اختراقه لوسط ما»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          conflict: "اندثار مصطلح فيزيائي راسخ بمعنى absorbance"
        - text: "«انقراض، اندثار — انتهاء خط تطوريّ دون أن يترك أنسالاً»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          conflict: "اندثار = انقراض/زوال تام، وهو أقوى من مجرد الخروج عن الاستعمال"
      expands:
        - text: "«اختفاء الاستجابة الشرطية النفسية نتيجة عدم التعزيز»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "اندثار = extinction في علم النفس، يدل على الزوال لا على مرحلة ما قبل الزوال"

    - lemma: "بِلًى"
      confirm:
        - text: "«بِلَى» = obsolescence"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«قدم، بلى» = obsolescence"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
      expands:
        - text: "«مخزون بالٍ، مخزون متقادم — مخزون لم يعد صالحاً للاستعمال»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "بالٍ ومتقادم يُستعملان مترادفَيْن في السياق التجاري"

    - lemma: "تَعَتُّق"
      confirm:
        - text: "«تعتّق» = ageing"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (1996)"
      contradicts:
        - text: "«وَكُلُّ شَيْءٍ تَقَادَمَ فَهُوَ عَاتِقٌ وَعَتِيقٌ... والخمر العتيقة: التي عُتّقت زماناً حتى عتقت»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "العتق والتعتق يدلان على القِدَم المحمود (النبيذ المعتَّق، الأصل العتيق) لا على الخروج عن الاستعمال"

stage3_analysis:
  per_lemma:
    - lemma: "بُطْلَان"
      decision: removed
      decision_reason: "دلالة «بطلان» الراسخة في الاستعمال الفقهي والقانوني والمعجمي هي عدم الصحة وعدم النفاذ (nullity)، وجميع المعاجم الكبرى تعرّفها بهذا المعنى. وجودها في المعجم الطبي الموحد مقابلاً لـ obsolescence ترجمة ضعيفة لا تسندها الشواهد اللغوية. إبقاؤها يُوقع في اللبس مع المعنى القانوني السائد."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَقَادُم"
      decision: confirmed
      decision_reason: "الفعل «تقادم» بمعنى «قَدُمَ وطال عليه الأمد» ثابت في المعجم الوسيط، والاسم «تقادُم» مستعمل في معاجم اصطلاحية متعددة (جغرافيا، اقتصاد، مياه، نفط، أغذية) مقابلاً لـ obsolescence/ageing. وإن كان له معنى قانوني خاص (سقوط الحق بالمدة)، فإن المعنى العام واسع الانتشار في الاستعمال التقني المعاصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد الزمني — صيرورة الشيء قديماً بمرور الأمد — دون دلالة على الاندراس المادي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقَادُم"

    - lemma: "دُثُور"
      source: stage1
      decision: confirmed
      decision_reason: "الدُّثُور مصدر دَثَرَ بمعنى الاندراس والعفاء، شاهده حديث الحسن البصري «حادثوا هذه القلوب فإنها سريعة الدثور»، وعدّه ابن مالك باباً للدروس والطمس والعفاء. وهو لفظ تراثي فصيح يؤدي معنى الخروج عن الاستعمال تحديداً، ويُثري المجموعة بلفظ كلاسيكي مقابل اللفظ المعاصر «تقادم»."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على اندراس الأثر وخفاء المعالم — خروج الشيء عن الاستعمال حتى يُنسى — مع إيحاء بالتغطية والطمس"
      actions:
        - command: create_entry
          params:
            lemma: "دُثُور"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اِنْدِثَار"
      source: stage1
      decision: removed
      decision_reason: "الاندثار يدل على الزوال التام والانقراض (extinction)، وهو أقوى دلالياً من التقادم (obsolescence) الذي يصف مرحلة الخروج عن الاستعمال لا الفناء الكلي. كما أنه مصطلح فيزيائي راسخ بمعنى absorbance في الهندسة الكهربائية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "بِلًى"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «بِلَى» مقابلاً لـ obsolescence في معجمَي التجارة والاقتصاد، فإن دلالته الأصلية هي الفناء المادي والرثاثة الحسية (wearing out)، بينما المجموعة تصف عملية الخروج عن الاستعمال وليس البلى المادي. إضافته تُشوّش الحدود الدلالية للمجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَعَتُّق"
      source: stage1
      decision: removed
      decision_reason: "التعتّق يدل على القِدَم المحمود أو المحايد (ageing) كتعتيق الخمر والأصالة والنبل. دلالته إيجابية أو محايدة ولا تتضمن معنى الخروج عن الاستعمال والإهمال الذي تصفه المجموعة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

