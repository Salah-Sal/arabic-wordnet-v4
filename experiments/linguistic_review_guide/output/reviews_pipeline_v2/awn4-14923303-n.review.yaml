        text: "مادّةٌ تتخلَّلُ بين جسمين أو أكثر وتعمل قناةً لانتقال القُوى أو الطاقة أو التأثير من أحدهما إلى الآخر"
        quality_check:
          genus_present: true
          differentia_present: true
