      - type: encyclopedic
        text: "مادّةٌ فيزيائيّةٌ تتوسَّطُ بين مصدرِ تأثيرٍ ومُستقبِلِه، فتنتقلُ عبرها الموجاتُ أو القُوى أو الإشاراتُ؛ كالهواء وَسَطاً لانتشار الصوت، والماءِ وسطاً لانتقال الضوء"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
