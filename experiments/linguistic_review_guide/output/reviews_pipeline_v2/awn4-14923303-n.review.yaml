# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14923303-n
# medium — مادة وسيطة يتم من خلالها تحقيق شيء ما
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «وسط» بدون تشكيل — يجب تصحيحها إلى «وَسَط»"
      - "المجموعة تحتوي لمّة واحدة فقط، وهي عامّة جداً قد تلتبس بمعنى الظرف المكاني"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المفهوم يشير إلى الوَسَط بمعناه الفيزيائي والعلمي: المادة المتخلِّلة التي تنتقل عبرها الطاقة أو القوى أو يتحقق من خلالها أثرٌ ما (كالهواء وسطاً للصوت). الوسط المباشر (hypernym) هو جَوْهَر/مادّة أساسيّة، ما يؤكد أن المراد هو المعنى المادّي لا المجازي. مصطلح «وَسَط» مُقعَّد في المعاجم الموحّدة (فيزياء، كيمياء، أحياء، هندسة) بهذا المعنى تحديداً."
  blind_candidates:
    - lemma: "وَسِيط"
      generation_method: ishtiqaq
      justification: "من جذر وسط على وزن فَعِيل الدال على الثبوت والمبالغة. يُستعمل في بعض المجالات (فنون، تربية، لسانيات) بمعنى medium، لكنه أقرب إلى الشخص أو الأداة الوسيطة منه إلى المادة الفيزيائية"
    - lemma: "وَسِيلَة"
      generation_method: ishtiqaq
      justification: "من جذر وسل على وزن فَعِيلَة. تدل على ما يُتَقرَّب به ويُتوصَّل من خلاله إلى غاية. قد تُستخدم بمعنى medium في سياق الإعلام والاتصال"
    - lemma: "وَاسِطَة"
      generation_method: ishtiqaq
      justification: "من جذر وسط على وزن فَاعِلَة. تدل على ما يتوسط بين شيئين. واسطة القلادة: الجوهر الذي في وسطها"
    - lemma: "نَاقِل"
      generation_method: ishtiqaq
      justification: "من جذر نقل على وزن فَاعِل. يدل على ما ينقل أو يحمل شيئاً عبره. يُستعمل في الفيزياء بمعنى conductor/carrier"

stage2_evidence:
  per_lemma:
    - lemma: "وَسَط"
      confirm:
        - text: "«وسَطُ الشيءِ: ما بين طرفيه وهو منه المعتدل من كل شيء... مجال الشيء وبيئتُه. (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«الناقل؛ الوَسَط: مادة متخلِّلة تعمل عَبْرَها قوةٌ ما أو يُحْدَث أثرٌ ما The air is a medium for sound.»"
          source: "المورد الحديث (2008)"
        - text: "«وَسَطٌ — medium — milieu — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)»"
          source: "المعجم الموحد لمصطلحات الفيزياء"
        - text: "«وَسَطٌ — medium — milieu — المعجم الموحد لمصطلحات علم الأحياء (1993)»"
          source: "المعجم الموحد لمصطلحات الأحياء"
        - text: "«وَسَطٌ — المادة المستخدمة في مرشح لتشكيل حاجز أمام مرور بعض المواد العالقة أو الجزيئات المنحلة — medium»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«(وَسَطَ) الْوَاوُ وَالسِّينُ وَالطَّاءُ: بِنَاءٌ صَحِيحٌ يَدُلُّ عَلَى الْعَدْلِ وَالنِّصْفِ. وَأَعْدَلُ الشَّيْءِ: أَوْسَطُهُ وَوَسَطُهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على التوسط والاعتدال، والمعنى العلمي امتداد مجازي لمفهوم التوسط بين طرفين"

    - lemma: "وَسِيط"
      confirm:
        - text: "«وسيط — medium — médium — مسرد الفن، التسلية والرياضة»"
          source: "مسرد الفن والرياضة (ALECSO)"
        - text: "«وسيط — medium — médium — المعجم الموحد لمصطلحات التقنيات التربوية (1999)»"
          source: "المعجم الموحد للتقنيات التربوية"
      contradicts:
        - text: "«فلان وسيط في قومه، إذا كان أوْسَطَهُمْ نسبا وأرفعَهُم مَحَلاًّ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          conflict: "المعنى الأصيل للوسيط هو الشخص الشريف في قومه أو المتوسط بين الخصوم، لا المادة الفيزيائية"

    - lemma: "وَسِيلَة"
      contradicts:
        - text: "«وسيلة، واسطة — medium — médium; moyen — مسرد الإعلام والتواصل»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          conflict: "وسيلة بمعنى medium تُستعمل في سياق الإعلام (وسيلة اتصال) لا في سياق المادة الفيزيائية المتخلِّلة"

    - lemma: "وَاسِطَة"
      contradicts:
        - text: "«وواسِطَةُ القِلادةِ: الدُّرَّةُ التي في وَسَطها، وهي أنْفَسُ خَرَزِها»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          conflict: "الواسطة تدل على الشيء المركزي أو المتوسط بين أشياء، لا على مادة متخلِّلة تمرّ عبرها قوة"

    - lemma: "نَاقِل"
      contradicts:
        - text: "«وسيط ناقل — carrying medium — média porteur — المعجم الموحد لمصطلحات الطاقة المتجددة (1996)»"
          source: "المعجم الموحد للطاقة المتجددة"
          conflict: "الناقل يُستعمل صفةً للوسيط (وسيط ناقل) لا بديلاً عنه؛ دلالته على الحمل والنقل لا على التوسط"

stage3_analysis:
  per_lemma:
    - lemma: "وَسَط"
      decision: confirmed
      decision_reason: "مصطلح مُقعَّد في المعاجم الموحّدة العربية (فيزياء، كيمياء، أحياء، هندسة مدنية، طب) بمعنى medium بوصفه مادة متخلِّلة. أكّده المورد الحديث صراحةً بتعريف مطابق لتعريف المجموعة. جذره يدل على التوسط بين طرفين وهو أساس المعنى العلمي"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "وَسَط هو اللمّة الوحيدة المؤكّدة في هذه المجموعة. يدل تحديداً على المادة الفيزيائية المتخلِّلة التي تنتقل عبرها القوى أو الطاقة، وهو المصطلح العلمي المعياري في المعاجم الموحّدة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَسَط"

    - lemma: "وَسِيط"
      source: stage1
      decision: removed
      decision_reason: "رغم استعماله بمعنى medium في بعض المجالات (فنون، تربية)، فإن المعنى الأصيل هو الشخص المتوسط أو الشريف في قومه. في السياق العلمي الفيزيائي المقصود في هذه المجموعة، المصطلح المعياري هو وَسَط لا وَسِيط. إضافته تُحدث التباساً مع المعاني الأخرى للوسيط (mediator, intermediary)"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "وَسِيلَة"
      source: stage1
      decision: removed
      decision_reason: "الوسيلة تدل على ما يُتوصَّل به إلى غاية (means, instrument)، وهي أعمّ من المادة المتخلِّلة. تُستعمل في الإعلام (وسيلة إعلام) لا في الفيزياء. الفاصل الجنسي مختلف: الوسيلة أداة/طريقة، والوَسَط مادة/جوهر"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "وَاسِطَة"
      source: stage1
      decision: removed
      decision_reason: "الواسطة تدل على الشيء المتوسط بين أشياء أو الشخص المتوسط بين طرفين. لا تُستعمل في المعاجم الموحّدة العلمية بمعنى medium المادي. المعنى المعياري لها intermediary أو middle piece"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "نَاقِل"
      source: stage1
      decision: removed
      decision_reason: "الناقل يدل على ما ينقل أو يحمل (carrier/conductor)، وهو أخصّ من الوسط. في المعاجم الموحّدة يُستعمل صفةً للوسيط (وسيط ناقل) لا مرادفاً للوسط. دلالته على الفعل (النقل) لا على الحالة (التوسط)"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "مادة وسيطة يتم من خلالها تحقيق شيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية. عبارة «تحقيق شيء ما» مبهمة جداً ولا تُحدّد طبيعة الوَسَط العلمية. يحتاج إعادة صياغة بأسلوب معجمي عربي يُبيّن الجنس القريب (مادة/جوهر) والفصل النوعي (الانتقال عبرها)"
    authored:
