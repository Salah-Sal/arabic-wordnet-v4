# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14608440-n (allergen)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان عبارتان وصفيتان حرّتان وليستا مصطلحَيْن مسكوكَيْن"
      - "«مهيج للحساسية» يخلط بين مفهومَيْ المُهَيِّج (irritant) والمُسْتَأْرِج (allergen)"
      - "«مادة مسببة للحساسية» تفشل اختبار السكّ: يمكن إبدال «مسببة» بـ«مُحدِثة» أو «مُولِّدة» وتبقى العبارة صالحة"
      - "لا يوجد مصطلح اشتقاقي عربي رغم توفّر بدائل معجمية معتمدة"
    observations: "المفهوم طبّي متخصّص يدلّ على المادّة التي تُحدث تفاعلاً أرجيّاً (حساسيّاً) في الجسم. للعربية مصطلحات مشتقّة معتمدة من جذر «أرج» (أُرْجِيَّة = allergy) على وزن مُسْتَفْعِل، وكذلك مركّبات إضافية ثابتة من نوع «باعث الحساسية». اللمّتان الحاليتان وصفيّتان ولا ترقيان إلى مرتبة المصطلح."
  blind_candidates:
    - lemma: "مُسْتَأْرِج"
      generation_method: ishtiqaq
      justification: "مشتقّ من جذر «أرج» على وزن مُسْتَفْعِل بمعنى المادّة التي تستثير الأُرْجِيَّة (الحساسية). الوزن يدلّ على الطلب والاستجلاب، فالمُسْتَأْرِج هو ما يطلب إحداث الأَرَج."
    - lemma: "بَاعِثُ الْحَسَاسِيَّة"
      generation_method: tarkib
      justification: "مركّب إضافي من «باعث» (اسم فاعل من بعث = أثار) و«الحساسية». التركيب يفيد أنّ المادّة تبعث الحساسية وتثيرها."
    - lemma: "مُحَسِّس"
      generation_method: ishtiqaq
      justification: "من جذر «حسس» على وزن مُفَعِّل، اسم فاعل يدلّ على ما يُحدث التحسّس. قريب من المفهوم لكنّه أعمّ (sensitizer)."
    - lemma: "آرِج"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «أَرَجَ» على وزن فاعِل، بمعنى ما يُحدث الأُرْجِيَّة. صيغة مختصرة مباشرة."

stage2_evidence:
  per_lemma:
    - lemma: "مادة مسببة للحساسية"
      confirm:
        - text: "«مسبب للحساسية: يمكن استخدام هذا الوصف بالنسبة لكل مادة تنتج أو تتسبب في حساسية. مستأرج (المرادف العربي)»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      expands:
        - text: "«مسبب للحساسية [...] مستأرج (المرادف العربي)»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          addition: "المسرد نفسه يُرشد إلى أنّ «مستأرج» هو المرادف العربي المفضّل"

    - lemma: "مهيج للحساسية"
      contradicts:
        - text: "«مُهَيِّج: مادة يمكن أن تسبب تهيج البشرة أو العينين أو الجهاز التنفسي. مُثير (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "مهيّج = irritant وليس allergen. التهيّج (irritation) يختلف عن الأُرْجِيَّة (allergy) طبّياً"
        - text: "«مهيج: صفة لما يسبب التهيج أو يرتبط به»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: "المصطلح مرتبط بالتهيج لا بالحساسية الأرجية"
        - text: "«مُهَيِّج = irritant»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الترجمة الموحّدة هي irritant لا allergen"

    - lemma: "مُسْتَأْرِج"
      confirm:
        - text: "«مُسْتَأرِج = allergen»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«باعث الحساسية، مُسْتأْرِج = allergen»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«مسبب للحساسية [...] مستأرج (المرادف العربي)»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«مُسْتَأرِجٌ هَوائِيّ = aeroallergen»، «مُسْتَأرِجٌ طَلْعِيّ = pollen allergen»، «مُسْتَأْرِجٌ ضَوئِيّ = photoallergen»، «مُستَأْرِجٌ تَماسِّيّ = contactant»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المصطلح مُنتِج ويقبل التركيب الوصفي للأنواع الفرعية"
        - text: "«مَصْلٌ مُسْتَأْرِج (مَصْلٌ مُؤَرِّج) = allergenic serum»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستعمل وصفاً أيضاً للمَصْل"

    - lemma: "بَاعِثُ الْحَسَاسِيَّة"
      confirm:
        - text: "«باعث الحساسية، باعث التجاوب = allergen»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«باعث الحساسية، مُسْتأْرِج = allergen»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«باعث الحساسية: الجسم المضاد في العوار = anaphylaxin, sensitogen»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "في هذا المعجم استُعمل المصطلح أيضاً بمعنى anaphylaxin، ممّا يدلّ على تداخل دلالي"

    - lemma: "مُحَسِّس"
      contradicts:
        - text: "«مُحَسِّس = sensitizer»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المصطلح يعني sensitizer (المادة التي تزيد الحساسية) وليس allergen (المادة التي تثير تفاعلاً أرجيّاً)"

    - lemma: "آرِج"
      confirm:
        - text: "«آرج: ما يحدث الأرجية. انظر: allergy»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      expands:
        - text: "«أرجية - أليرجيّة: حساسية نوعية مفرطة أو غير عادية، تحدث لبعض الناس من مادة تضر بعض الناس ولا تضر الآخرين»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "التعريف يوضّح المنظومة المصطلحية: أرجية = allergy، آرج = allergen"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "مادة مسببة للحساسية"
      decision: removed
      decision_reason: "عبارة وصفية حرّة تفشل اختبار السكّ (يمكن إبدال «مسببة» بـ«مُحدِثة/مُولِّدة» مع بقاء المعنى). المسرد البيئي نفسه يُصرّح بأنّ «مستأرج» هو المرادف العربي المفضّل. لا ترقى إلى مصطلح معجمي ثابت."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مهيج للحساسية"
      decision: removed
      decision_reason: "«مهيّج» يعني irritant في جميع المعاجم الطبية الموحّدة، وهو مفهوم مختلف عن allergen. التهيّج (irritation) ردّ فعل موضعي غير مناعي، بينما الأُرْجِيَّة (allergy) تفاعل مناعي نوعي. الخلط بينهما خطأ طبّي ولغوي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُسْتَأْرِج"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح المعتمد في المعجم الطبي الموحد (2009) والطب البيطري (2010) ومسرد المناخ والبيئة. مشتقّ من جذر «أرج» على وزن مُسْتَفْعِل. مُنتِج اشتقاقيّاً (مستأرج هوائي، مستأرج طلعي، مستأرج ضوئي). يقبل الجمع السالم والنسبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح طبّي متخصّص دقيق يدلّ حصراً على المادّة المُثيرة لتفاعل أرجيّ مناعي، وهو الأكثر تداولاً في الأدبيات الطبّية العربية"
      actions:
        - command: create_entry
          params: {lemma: "مُسْتَأْرِج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "بَاعِثُ الْحَسَاسِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مركّب إضافي ثابت مسجّل في المعجم الموحد لمصطلحات الكيمياء (1992) والطب البيطري (2010). يجتاز اختبار السكّ لأنّ إبدال «باعث» بـ«مُثير» ينتج مصطلحاً مختلفاً مسجّلاً بمعنى sensitizer."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير شفّاف الدلالة يُستعمل في السياق الكيميائي والبيئي، أوسع استعمالاً من «مستأرج» خارج الطبّ البشري"
      actions:
        - command: create_entry
          params: {lemma: "بَاعِثُ الْحَسَاسِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُحَسِّس"
      source: stage1
      decision: removed
      decision_reason: "المعجم الطبي الموحد يُقابله بـ sensitizer لا بـ allergen. المُحَسِّس هو ما يزيد حساسية الجسم عموماً، بينما المُسْتَأْرِج هو ما يثير تفاعلاً أرجيّاً نوعيّاً. خلط المفهومَيْن غير مقبول."
      evidence_assessment:
        case: contradicts_only

    - lemma: "آرِج"
      source: stage1
      decision: removed
      decision_reason: "ورد في مصدر واحد فقط (معجم المصطلحات الطبية 1985) ولم يُعتمد في المعجم الطبي الموحد (2009) الذي فضّل «مستأرج». الصيغة غير شائعة وقد تلتبس مع «الأَرِج» (ذو الرائحة الطيّبة) في الاستعمال العام."
      evidence_assessment:
        case: confirm_only

stage4_content:
  definition:
    current: "أي مادة يمكن أن تسبب حساسية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية للإنجليزي وفيه عيوب: (١) يستعمل «حساسية» بدون تحديد طبّي (الحساسية أعمّ من الأُرْجِيَّة)، (٢) لا يذكر الآلية المناعية، (٣) أسلوبه عامّي لا معجمي."
    authored:
      - type: terminological
        text: "مادّةٌ تُثير في الجسم تفاعلاً أَرَجِيّاً (حساسيّاً) عند التعرّض لها بالاستنشاق أو التلامس أو البلع"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مادّةٌ — كحُبوب اللِّقاح أو وَبَر الحيوان أو بعض الأغذية — تستحثّ الجهاز المناعيّ على إنتاج أجسام مضادّة من نوع IgE، فتُحدث أعراضاً أَرَجِيَّة كالعُطاس والطَّفَح الجِلْدِيّ وضِيق التنفّس"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ تُثير في الجسم تفاعلاً أَرَجِيّاً (حساسيّاً) عند التعرّض لها بالاستنشاق أو التلامس أو البلع"

  examples:
    per_lemma:
      - lemma: "مُسْتَأْرِج"
        examples:
          - text: "أظهرت الاختبارات أنّ حبوب لقاح الزيتون تُعدّ المُسْتَأْرِج الأكثر شيوعاً في منطقة حوض المتوسّط."
            type: usage
      - lemma: "بَاعِثُ الْحَسَاسِيَّة"
        examples:
          - text: "يُنصح بتجنّب بواعث الحساسية المعروفة كالغُبار المنزلي ووَبَر القطط عند المرضى المصابين بالرَّبْو الأرجيّ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أظهرت الاختبارات أنّ حبوب لقاح الزيتون تُعدّ المُسْتَأْرِج الأكثر شيوعاً في منطقة حوض المتوسّط."

