# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-90016671-n
# شخص يعتبر مثيراً للإعجاب بسبب مواقفه أو سلوكه أو مظهره القوي للغاية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما تعبيران مركّبان وصفيان، ولا توجد لمّة مفردة تغني عنهما"
      - "«شَخْص جَبَّار» عبارة وصفية حرّة وليست مصطلحاً مسكوكاً؛ يمكن إبدال «شخص» بـ«رجل» أو «إنسان» دون تغيير المعنى"
      - "التعريف يبدو مترجماً ترجمة حرفية من الإنجليزية ويحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المجموعة تصف مفهوم الشخص المُثير للإعجاب بقوّته وحزمه — وهو مفهوم له تعبيرات عربية أصيلة عديدة في التراث العربي: الصِّنْدِيد والهُمَام والجَبَّار. التعبير «قَوِيّ الشَّكِيمَة» تعبير اصطلاحي ثابت في العربية يدلّ على شدة النفس والعزيمة، وهو أنسب من «شَخْص جَبَّار» الذي لا يعدو كونه وصفاً حرّاً."
  blind_candidates:
    - lemma: "صِنْدِيد"
      generation_method: majaz
      justification: "لفظ عربي كلاسيكي يدلّ على السيد الشريف الشجاع، مأخوذ من جذر (ص ن د) الدالّ على عِظَم القدر. يُستخدم للشخص الذي يُهاب ويُعجَب به لقوّته وشجاعته."
    - lemma: "هُمَام"
      generation_method: majaz
      justification: "من جذر (هـ م م)، يدلّ على الملِك العظيم الهِمّة والعزيمة. يُطلق على من يُعجَب به لحزمه ونشاطه وإقدامه."
    - lemma: "جَبَّار"
      generation_method: ishtiqaq
      justification: "من جذر (ج ب ر) على وزن فَعَّال للمبالغة، أصل الجذر يدلّ على العظمة والعلوّ. يُستخدم لمن يثير الإعجاب بقوّته وسلطانه."
    - lemma: "عِمْلَاق"
      generation_method: majaz
      justification: "إزاحة دلالية من الدلالة الحسّية (الضخامة الجسدية) إلى المعنى المجازي: شخص يفوق أقرانه قوّةً وتأثيراً."

stage2_evidence:
  per_lemma:
    - lemma: "شَخْص جَبَّار"
      evidence_status: "no_material_found"

    - lemma: "قَوِيّ الشَّكِيمَة"
      confirm:
        - text: "«الشَّكِيمَةُ: أَيْ شِدَّةُ النَّفْسِ. وَالشَّكِيمَةُ شَكِيمَةُ اللِّجَامِ، وَهِيَ الْحَدِيدَةُ الْمُعْتَرِضَةُ الَّتِي فِيهَا الْفَأْسُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الشِّينُ وَالْكَافُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى عَطَاءٍ، وَالْآخَرُ يَدُلُّ عَلَى شِدَّةٍ فِي شَيْءٍ وَقُوَّةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الشدة والقوة، مما يؤكد ملاءمة التعبير لمفهوم الشخص القوي المثير للإعجاب"

    - lemma: "صِنْدِيد"
      confirm:
        - text: "«السيد الشريف الشجاع هو صِنْدِيدٌ من الصَّنادِيدِ»"
          source: "المعجم الكبير"
        - text: "«صِنْديد: من (ص ن د د) السيد الشريف الشجاع والجواد الحليم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«الصَّادُ وَالنُّونُ وَالدَّالُ أَصْلٌ صَحِيحٌ، يَدُلُّ عَلَى عِظَمِ قَدْرٍ وَعِظَمِ جِسْمٍ. مِنْ ذَلِكَ الصِّنْدِيدُ، وَهُوَ السَّيِّدُ الشَّرِيفُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر صند يدلّ على عظم القدر والجسم، وهو مطابق لمفهوم الشخص المثير للإعجاب بقوّته"

    - lemma: "هُمَام"
      confirm:
        - text: "«ثُمَّ تُشْتَقُّ مِنَ الْهِمَّةِ: الْهُمَامُ: الْمَلِكُ الْعَظِيمُ الْهِمَّةِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«همَام: من (ه م م) السيد الشجاع السخي»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«هَمَّام: من (ه م م) مبالغة في الهم بمعنى العزم على القيام بالأمر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الوزن فُعَال يدلّ على كثرة الهمّة والعزيمة"

    - lemma: "جَبَّار"
      confirm:
        - text: "«من أسمائه تعالى المتكبر القاهر العاتى المتسلِّط... النخل يطول ويفوت اليد»"
          source: "المعجم الوسيط"
        - text: "«الجبّار: شخص عظيم القوة أو النفوذ»"
          source: "المورد الحديث (ترجمة powerhouse)"
      expands:
        - text: "«الْجِيمُ وَالْبَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ جِنْسٌ مِنَ الْعَظَمَةِ وَالْعُلُوِّ وَالِاسْتِقَامَةِ. فَالْجَبَّارُ: الَّذِي طَالَ وَفَاتَ الْيَدَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدلّ على العظمة والعلو، وهو جوهر مفهوم الشخص المثير للإعجاب بقوّته"
      contradicts:
        - text: "«جَبَّار: القتال... والعنيد: الذي يعند عن حق الله»"
          source: "غريب القرآن في شعر العرب لابن عباس"
          conflict: "في السياق القرآني يحمل دلالة سلبية (الظلم والتكبر)، لكنه في الاستعمال العام يدلّ على القوة والعظمة"

    - lemma: "عِمْلَاق"
      confirm:
        - text: "«عِملاَق وأبو العَمَالِقَةِ جَبَابِرَةٌ كانوا بالشّام»"
          source: "المحيط في اللغة للصاحب بن عباد"
      contradicts:
        - text: "«شخص أو كائن ذو حجم أضخم من السوي»"
          source: "معجم المصطلحات الطبية"
          conflict: "الدلالة الأصلية تتعلق بالضخامة الجسدية لا بالقوة المعنوية المثيرة للإعجاب"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "شَخْص جَبَّار"
      decision: removed
      decision_reason: "عبارة وصفية حرّة وليست مصطلحاً مسكوكاً ثابتاً. يمكن إبدال «شخص» بـ«رجل» أو «إنسان» أو «امرأة» دون تغيير المعنى، مما يُخفق في اختبار السكّ. اللمّة المفردة «جَبَّار» تؤدّي المعنى وحدها."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قَوِيّ الشَّكِيمَة"
      decision: confirmed
      decision_reason: "تعبير اصطلاحي ثابت في العربية يدلّ على شدة النفس والعزيمة وعدم الخضوع. مسجّل في المعاجم وجذره (شكم) يدلّ على الشدة والقوة. يجتاز اختبار السكّ: لا يمكن إبدال «الشكيمة» بمرادف والاحتفاظ بنفس المعنى الاصطلاحي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على الجانب الإرادي والنفسي — شدة العزيمة وعدم الانقياد — بخلاف «جَبَّار» الذي يركّز على القوة المطلقة، و«صِنْدِيد» الذي يجمع القوة والشرف"

    # ── مرشحات المرحلة ١ ──
    - lemma: "صِنْدِيد"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي كلاسيكي مسجّل في المعجم الكبير ومقاييس اللغة وموسوعة قابوس. يدلّ على السيد الشريف الشجاع — وهو مطابق تماماً لمفهوم الشخص المثير للإعجاب بقوّته. جذره (صند) يدلّ على عظم القدر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يجمع بين القوة والشرف والسيادة — يدلّ على المكانة الاجتماعية والشجاعة معاً، بخلاف «جَبَّار» الذي يركّز على القوة المحضة"
      actions:
        - command: create_entry
          params: {lemma: "صِنْدِيد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "هُمَام"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي مسجّل في مقاييس اللغة بمعنى «الملك العظيم الهمّة». يدلّ على الشخص ذي العزيمة الماضية والشجاعة، وهو مناسب لمفهوم الشخص المثير للإعجاب بسلوكه القوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الهمّة والعزيمة والنشاط الذاتي — الإعجاب ناتج عن الدافعية الداخلية والإقدام لا عن القوة الظاهرة"
      actions:
        - command: create_entry
          params: {lemma: "هُمَام", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "جَبَّار"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ مفرد من جذر (جبر) الدالّ على العظمة والعلو. مسجّل في المعجم الوسيط والمعجم الكبير. يترجم «powerhouse» في المورد الحديث بمعنى «شخص عظيم القوة أو النفوذ». أَوْلى من المركب «شَخْص جَبَّار» لأنه لفظ مفرد مكتفٍ بذاته."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على القوة المطلقة والسيطرة — الأقوى دلالةً على الهيبة والقوة المادية والمعنوية، لكنه قد يحمل ظلالاً سلبية (تسلّط) في بعض السياقات"
      actions:
        - command: create_entry
          params: {lemma: "جَبَّار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عِمْلَاق"
      source: stage1
      decision: removed
      decision_reason: "دلالته الأصلية تتعلق بالضخامة الجسدية (شخص أو كائن ذو حجم أضخم من السوي). الاستعمال المجازي للقوة المعنوية غير مثبّت بما يكفي في المعاجم التراثية. المحيط في اللغة يذكر العمالقة كجبابرة بالشام — وهذا سياق تاريخي لا معجمي عام."

