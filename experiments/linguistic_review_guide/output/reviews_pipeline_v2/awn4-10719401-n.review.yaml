          addition: "يُضيف بُعداً تعريفياً جوهرياً: الشيطانية هي الإعراض المطلق عن الخير، مما يُعمّق دلالة الإغواء"
        - text: "«القول الثاني أنّ الشياطين كلّ عات متمرّد من الإنس والجنّ. ولذا قال عليه السلام لأبي ذرّ: هل تعوذن بالله من شرّ شيطان الإنس والجنّ؟ قال: قلت: هل للإنسان شيطان؟ قال: نعم هو أشرّ من شياطين الجنّ»"
