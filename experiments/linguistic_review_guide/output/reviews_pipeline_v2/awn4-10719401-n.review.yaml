# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «شيطان» بلا تشكيل؛ الصواب «شَيْطَان»"
      - "اللمّة «مغوٍ» تشكيلها ناقص (غياب الضمة على الميم)؛ الصواب «مُغوٍ»"
      - "التعريف «شخص يغوي الآخرين» مقتضب ويُعيد لفظ الجذر ذاته (غوي) مما يُقرّبه من الدوران الاشتقاقي"
      - "المجموعة تفتقر إلى لمّة «فَتَّان» المُثبتة صراحةً بمعنى الشيطان في المقاييس والمعجم الوسيط"
    observations: >-
      المجموعة تدلّ على الشخص الذي يُمارس الإغواء ويُزيّن الباطل للناس حتى يَنزلق إليه.
      مفهوم المُغوي راسخ في الموروث العربي الإسلامي وتتشعب جذوره بين: البُعد عن الحق (شطن)،
      وخلاف الرشد والانهماك في الباطل (غوي)، والابتلاء والاختبار بالفتنة (فتن).
      اللمّتان الموجودتان صحيحتان دلالياً ومقبولتان غير أنهما تحتاجان إلى ضبط صرفي.
      يلفت النظر أيضاً غياب «فتّان» وهو لفظ قرآني-حديثي راسخ في هذا المعنى.

  blind_candidates:
    - lemma: "فَتَّان"
      generation_method: ishtiqaq
      justification: >-
        وزن فَعَّال من الجذر ف-ت-ن، صيغة مبالغة تدل على الاحتراف والكثرة في إيقاع
        الفتنة؛ الفِتنة في أصلها ابتلاء الذهب بالنار لاختباره، ثم انتقلت إلى الإيقاع
        في المحظور وتزيين الباطل. الوزن فَعَّال راسخ في المعجم العربي للمبالغة
        (كذبّاح، قتّال، خدّاع).

    - lemma: "مُوَسْوِس"
      generation_method: ishtiqaq
      justification: >-
        وزن مُفَوعِل (اسم الفاعل) من الفعل الرباعي وَسوَسَ؛ يُلقي الوساوس الخبيثة
        في نفوس الآخرين بالهمس الخفي ويُزيّن لهم الشر. الجذر وسوس موظَّف في النص
        القرآني: «الْوَسْوَاسِ الْخَنَّاسِ — الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ»،
        فصيغة اسم الفاعل منه مُوَسوِس طبيعية ومفهومة.

    - lemma: "مُضِلّ"
      generation_method: ishtiqaq
      justification: >-
        وزن مُفعِل (اسم الفاعل) من أَضَلَّ الرباعي، من الجذر ض-ل-ل؛ من يُضلّ
        غيره عن طريق الحق ويصرفه عنه. الإغواء كثيراً ما يُؤدي إلى الضلال،
        والمُضِلّ ملازم للمُغوي في السياق الديني والأخلاقي.

    - lemma: "وَسْوَاس"
      generation_method: majaz
      justification: >-
        إحياء للفظ القرآني الراسخ (سورة الناس: «الْوَسْوَاسِ الْخَنَّاسِ») الذي
        أُطلق فيه اسم الفعل (الوسوسة) على فاعله بالمجاز؛ وهو ضرب من إطلاق
        المصدر على الفاعل مبالغةً. اللفظ موظَّف في المعاجم الكلاسيكية بمعنى
        الشيطان.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# ميزانية الاستعلامات المُستخدمة: ٥ استعلامات
# ١. مطابقة دفعية (جميع اللمّات الموجودة + المرشحات + ال-)
