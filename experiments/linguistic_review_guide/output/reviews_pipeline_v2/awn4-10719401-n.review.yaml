# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "شَيْطَان"
      decision: confirmed
      decision_reason: >-
        المعاجم الكلاسيكية والحديثة تُثبت باطّراد أن الشيطان يُطلق على «كل عاتٍ متمرد
        مُفسد مُغوٍ من الجن والإنس»، وهو استعمال موثَّق قرآنياً (شياطين الإنس والجن)
        وحديثياً (الإنسان شيطانه أشرّ من شياطين الجن). المورد الحديث يُساوي صراحةً
        بين tempter وإبليس/الشيطان. مقاييس اللغة يُؤكد أن الاشتقاق من البُعد عن الحق
        والتمرد، مما يجعل المجاز المؤسَّس على صورة الشيطان راسخاً ومشروعاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يستحضر الطابعَ الشرير الشامل للمُغوي: التمرد والبُعد المطلق عن الخير والإفساد
        معاً في صورة واحدة؛ أثقل الثلاثة دلالةً وأشمل. يُناسب السياقات التي يكون فيها
        الإغواء مقروناً بالشر المطلق والعداء الصريح للفطرة السليمة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَيْطَان"

    - lemma: "مُغوٍ"
      decision: confirmed
      decision_reason: >-
        اسم الفاعل القياسي الصريح من أَغوَى (جذر غ-و-ي، باب الإفعال)؛ المورد الحديث
        يُعطيه أولاً كترجمة لـ tempter: «المُغْرِي؛ المُغْوي». ورغم غياب مدخل
        كلاسيكي مستقل له (لأن الكلاسيكيين يُدرجونه ضمن مادة غوي)، فإن الاشتقاق
        صحيح والاستعمال الحديث ثابت. التشكيل الصحيح: مُغوٍ (الميم بضمة).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        اسم الفاعل الصريح من فعل الإغواء وحده؛ يُصرّح بالوظيفة (الإغواء) دون إيحاءات
        التمرد أو الابتلاء. يُناسب الوصف الوظيفي المحايد لشخص يُمارس الإغراء والتزيين
        دون اشتراط طابع ديني مُحدد — أخف وطأةً من شيطان وأكثر تحديداً من فتّان.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُغوٍ"

    - lemma: "فَتَّان"
      source: stage1
      decision: confirmed
      decision_reason: >-
        موثَّق توثيقاً مزدوجاً قوياً: المقاييس يُصرّح «والفتّان: الشيطان»، والمعجم
        الوسيط يُعطيه معنى «الشيطان» أولاً، والحديث النبوي يوظّفه في السياق البشري
        تماماً (الشخص الذي يُغوي المسلم ويُفرّق بينه وبين أخيه). الوزن فَعَّال من
        فتن يُفيد الاحتراف والكثرة في إيقاع الفتنة. يُضيف بُعداً دلالياً غائباً عن
        اللمّتين الأخريين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُركّز على بُعد الابتلاء والاختبار في الإغواء؛ الفتّان لا يغوي فحسب بل يُوقع
        المرء في فتنة تختبر صموده. أشد ارتباطاً بالسياق الديني-الأخلاقي من «مُغوٍ»
        وأكثر تحديداً للوظيفة من «شيطان» الأعم.
      actions:
        - command: create_entry
          params:
            lemma: "فَتَّان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُوَسْوِس"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على مدخل معجمي موثوق يُثبت «مُوَسوِس» اسماً مستقلاً بمعنى شخص
        يغوي الآخرين. الجذر وسوس يُشير إلى صوت الهمس الخفي أو فعل الوسوسة،
        لا إلى الشخص الفاعل بهذا المعنى المستقل. فضلاً عن ذلك، فإن «وسواس» الأصل
        معروف بمعنى الشيطان لكن «مُوَسوِس» (اسم الفاعل) لم يُسكّ مصطلحاً معجمياً
        ثابتاً.

    - lemma: "مُضِلّ"
      source: stage1
      decision: removed
      decision_reason: >-
        الاستعمال المعجمي الراسخ لـ«المُضِلّ» يُحيل إلى السراب (ظاهرة طبيعية لا شخص)
        في المعجم الوسيط والمعجم الكبير واستعمله ياقوت الحموي اسماً لموضع. كما أن
        «الإضلال» يعني صرف الشخص عن الطريق لا تزيين الباطل وإغراءه به؛ والفرق
        جوهري: الإغواء يستلزم الجذب والتحسين، أما الإضلال فيستلزم الصرف والتشتيت.

    - lemma: "وَسْوَاس"
      source: stage1
      decision: removed
      decision_reason: >-
        وَسْوَاس (بالفتح) يدل على صوت الوسوسة وعمليتها أو على الشيطان ذاته، لكنه
        ليس لفظاً مُتداولاً لشخص بشري يغوي الآخرين. ثم إن دلالته الحديثة قد
        تثبّتت اصطلاحياً على الوسواس القهري (obsession) في المعجمية الطبية
        والنفسية، مما يُشوّش دلالته ويجعله غير صالح لهذه المجموعة.


