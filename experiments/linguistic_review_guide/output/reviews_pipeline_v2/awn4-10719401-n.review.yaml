      expands:
        - text: "«الْغَيْنُ وَالْوَاوُ وَالْحَرْفُ الْمُعْتَلُّ بَعْدَهُمَا أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى خِلَافِ الرُّشْدِ وَإِظْلَامِ الْأَمْرِ، وَالْآخَرُ عَلَى فَسَادٍ فِي شَيْءٍ. فَالْأَوَّلُ الْغَيُّ، وَهُوَ خِلَافُ الرُّشْدِ، وَالْجَهْلُ بِالْأَمْرِ، وَالِانْهِمَاكُ فِي الْبَاطِلِ»"
          source: "مقاييس اللغة لابن فارس — مادة غوي"
          addition: "يُثبت أن جذر الإغواء هو غ-و-ي لا م-غ-و، ويُؤكد دلالة خلاف الرشد والانهماك في الباطل"

    - lemma: "فَتَّان"
