# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «أخذ» مصدر فعلي عام جداً (التَّناوُل، حَوْز الشيء) ولا يحمل بذاته دلالة العملية المتخصصة (uptake/consuming)"
      - "«استيعاب» في المعاجم الكلاسيكية يدل على أخذ الشيء كله (الاستيفاء)، وفي الاستعمال الحديث يُستعمل بمعنى الفهم (assimilation)، فقد ينحرف عن المقصود"
      - "«امتصاص» يدل على عملية فيزيائية/كيميائية محددة (absorption) وهي أخص من المفهوم العام (uptake) الذي يشمل الأخذ والاستهلاك"
    observations: "المجموعة تمثّل مفهوم العملية العامة لأخذ شيء أو استنفاده أو استهلاكه. اللمّات الثلاث الحالية تقع على مستويات مختلفة من العموم والخصوص: «أخذ» عام جداً، «امتصاص» خاص جداً، و«استيعاب» بينهما لكن معناه انزاح في الاستعمال الحديث نحو الفهم. يُلاحَظ غياب مصطلحات من قبيل «تَنَاوُل» و«قَبْط» التي تُستعمل في المعاجم الاصطلاحية المتخصصة."
  blind_candidates:
    - lemma: "امْتِصَاص"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من مصص، يدل على عملية أخذ خالص الشيء واستخلاصه، وهو الأقرب دلالياً لمفهوم uptake بوصفه عملية أخذ واستهلاك"
    - lemma: "تَنَاوُل"
      generation_method: ishtiqaq
      justification: "مصدر تفاعل من نول، يدل على أخذ الشيء وتلقّيه، ويُستعمل في سياق الطعام والشراب والأدوية بمعنى الاستهلاك"
    - lemma: "اسْتِنْفَاد"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من نفد، يدل على استنزاف الشيء حتى فنائه، وهو يُناسب الجانب الاستهلاكي (using up/consuming) من التعريف"
    - lemma: "اسْتِغْرَاق"
      generation_method: majaz
      justification: "أصله الانتهاء في الشيء والبلوغ إلى أقصاه، فيُجاز به إلى الشمول والاستيعاب التام، مما يُناسب معنى الاستهلاك الكامل"

# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "أَخْذ"
      confirm:
        - text: "«الأَخْذُ: التَّناوُلُ، كالتَّأْخاذِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الأخذ: حوز الشيء وتحصيله، وذلك تارة بالتناول نحو {مَعَاذَ اللَّهِ أَنْ نَأْخُذَ}، وتارة بالقهر والغلبة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«أخذت الشئ آخذه أخذا: تناولته»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«أَخَذَ فَالْأَصْلُ حَوْزُ الشَّيْءِ وَجَبْيُهُ وَجَمْعُهُ. قَالَ الْخَلِيلُ: هُوَ خِلَافُ الْعَطَاءِ، وَهُوَ التَّنَاوُلُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«أَخْذ» = intake"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          addition: "يُستعمل في المعاجم الاصطلاحية الحديثة مقابلاً لـ intake"
        - text: "«(1) المَسْرَب: فتحة يدخل منها السائل... (2) «أ» أخْذ؛ امتصاص؛ استنشاق... (3) المقدار المأخوذ أو الممتَصّ أو المستنشَق»"
          source: "المورد الحديث (2008)"
          addition: "يُستعمل أَخْذ في المورد ضمن ترجمة intake جنباً إلى جنب مع امتصاص واستنشاق"

    - lemma: "اسْتِيعَاب"
      confirm:
        - text: "«الاستيعاب: أخذ الشيء كله، يقال وعبته وعبا وأوعبته إيعابا، واستوعبته، كلها بمعنى. وفي التهذيب: الوعب إيعابك الشيء في الشيء حتى تأتي عليه كله»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الاستيعاب: هو الاستيفاء والأخذ أجمعَ»"
          source: "التعريفات الفقهيّة للبركتي"
      contradicts:
        - text: "«استيعاب» = assimilation"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "في الاستعمال الاصطلاحي الحديث استيعاب = assimilation (تمثّل) وليس uptake"
        - text: "«تمثّل وكشف عن تكيف سلوك عبر انتقال من المُختلف إلى المُتشابه»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "في اللسانيات استيعاب = assimilation بمعنى التمثّل اللغوي"

    - lemma: "امْتِصَاص"
      confirm:
        - text: "«امتصاص» = absorption"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«مَصَّ: الْمِيمُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شِبْهِ التَّذَوُّقِ لِلشَّيْءِ، وَأَخْذِ خَالِصِهِ. مِنْ ذَلِكَ مَصِصْتُ الشَّيْءَ أَمَصُّهُ، وَامْتَصَصْتُهُ أَمْتَصُّهُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«استيعاب مادةٍ ما لمادة أخرى، وتوزيع الثانية في الأولى توزيعاً متجانساً»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«(1) فَهْم (2) أنبوبٌ أو مأخذ صاعد (3) امتصاص؛ تمثُّل»"
          source: "المورد الحديث (2008)"
          addition: "في ترجمة uptake يرد امتصاص وتمثّل معاً"
        - text: "«امتصاص الأكسجين» = oxygen uptake"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يُستعمل امتصاص مقابلاً لـ uptake في السياق العلمي"

    - lemma: "تَنَاوُل"
      confirm:
        - text: "«تناول» = intake"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      expands:
        - text: "«امتصاص؛ أخذ - استنشاق» = intake"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "تناول لم يرد مباشرة لكن المفهوم يتوزع على أخذ وامتصاص واستنشاق"

    - lemma: "اسْتِنْفَاد"
      confirm:
        - text: "«استنفاد» = exhaustion / consumption"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      contradicts:
        - text: "«الحالة التي تقع عندما يستنفد الكربون المنشط أو راتنج التبادل الأيوني أو مواد ماصة أخرى قدراته على الامتصاص»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "استنفاد يدل على حالة الفناء النهائية (exhaustion) وليس على عملية الأخذ المستمرة (uptake)"

    - lemma: "اسْتِغْرَاق"
      contradicts:
        - text: "«الاستغراق: الشمول لجميع الأفراد، بحيث لا يخرج عنه شيء»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الاستغراق في الاصطلاح المنطقي والنحوي يدل على الشمول والعموم لا على الاستهلاك"
        - text: "«الاستغراق: أن لا يلتفت قلب الذاكر إلى الذكر في أثناء الذكر...»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "في التصوف يدل على الفناء الروحي لا على الاستهلاك المادي"
      expands:
        - text: "«استغراق» = absorption (في الفلسفة وعلم النفس)"
          source: "مسرد الفلسفة وعلم النفس"
          addition: "يُستعمل بمعنى الانغماس الذهني/النفسي لا الفيزيائي"

