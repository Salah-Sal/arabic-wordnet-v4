# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10786688-n (ward)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الأولى «خاضع للوصاية» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ تفشل في اختبار السكّ (يمكن استبدال خاضع بـ«موضوع» أو «واقع» دون تغيير المعنى)"
      - "الفوقية المباشرة (عامل/فاعل = شخص يعمل ويُنجِز الأمور) لا تناسب مفهوم المكفول الذي هو شخص سلبي في العلاقة القانونية لا فاعل"
      - "لمّة «مكفول» قد تلتبس بمفهوم الكفالة المالية (الضمان) لا الوصاية على الشخص"
    observations: "المفهوم المراد هو الشخص الواقع تحت حماية أو وصاية غيره قانونياً أو شرعياً، سواء كان قاصراً أو سفيهاً أو عاجزاً. في التراث الفقهي العربي يُستعمل مصطلح «المحجور عليه» للدلالة على من مُنع من التصرف في ماله، ومصطلح «المولَّى عليه» للدلالة على من تولّى غيرُه أمره. أما «مكفول» فهو أقرب إلى منظومة الكفالة المعاصرة. المجال القانوني العربي الحديث يستعمل «ربيب» و«يتيم مكفول» مقابلاً لـ ward."

  blind_candidates:
    - lemma: "مَحْجُورٌ عَلَيْهِ"
      generation_method: tarkib
      justification: "مصطلح فقهي وقانوني راسخ يدلّ على من مُنع من التصرف في ماله وشؤونه بقرار من السلطة المختصة، من جذر «حجر» الذي يدلّ على المنع والإحاطة"
    - lemma: "مَوْلًى عَلَيْهِ"
      generation_method: tarkib
      justification: "تعبير فقهي يدلّ على من تولّى غيرُه أمرَه وشؤونَه، من جذر «ولي» بمعنى تولّي الأمر"
    - lemma: "قَاصِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «قصر» على وزن فاعل، يُستعمل في القانون الحديث بمعنى من لم يبلغ سنّ الرشد ويحتاج إلى وصاية"
    - lemma: "دَخِيل"
      generation_method: majaz
      justification: "من «دخل» على وزن فَعِيل، بمعنى من دخل في حماية غيره ولاذ به، نقلاً مجازياً من الدخول المادي إلى الاحتماء"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "خَاضِع لِلْوِصَايَة"
      evidence_status: "no_material_found"

    - lemma: "مَكْفُول"
      confirm:
        - text: "«ربيب، يتيم مكفول — ward»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«(1) رعاية؛ وصاية؛ كفالة (2) حجز قضائي (3) الحبس؛ السجن — custody»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الكاف والفاء واللام أصل صحيح يدلّ على تضمُّن الشيء للشيء... والكافل: الذي يكفل إنساناً يعوله»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر كفل يدلّ على الضمان والإعالة، فالمكفول هو من يُعال ويُضمن"
        - text: "«الكفيل: هو الذي ضمّ ذمّته إلى ذمة الآخر والآخر هو الأصيل والمكفول عنه»"
          source: "التعريفات الفقهية للبركتي"
          addition: "يوضح العلاقة بين الكفيل والمكفول عنه في الفقه"

    - lemma: "مَحْجُورٌ عَلَيْهِ"
      confirm:
        - text: "«المحجور: الممنوع من التصرف على وجه ينفذ فعل الغير عليه شاء أم أبى كما هو حال أهليته»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«كان كالمحجور عليه لا يملك من أمره شيئاً — فصيحة... والفقهاء يحذفون الصلة تخفيفاً لكثرة الاستعمال ويقولون: محجور وهو سائغ»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«الحاء والجيم والراء أصل واحد مطّرد، وهو المنع والإحاطة على الشيء. فالحجر حجر الإنسان... ويقال حجر الحاكم على السفيه حجراً؛ وذلك منعه إيّاه من التصرف في ماله»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على المنع والإحاطة، والحجر هو منع السفيه من التصرف"

    - lemma: "مَوْلًى عَلَيْهِ"
      evidence_status: "no_material_found"

    - lemma: "قَاصِر"
      confirm:
        - text: "«من الورثة: من لم يبلغ سِنَّ الرُّشد»"
          source: "المعجم الوسيط"
        - text: "«الحدث الذي لم يبلغ بعد سن الرشد — minor; under age»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: "«القاصر الموضوع تحت الوصاية — (6.أ) ward»"
          source: "المورد الحديث (2008)"
          conflict: "المورد يستخدم «القاصر» مع قيد «الموضوع تحت الوصاية»، مما يدلّ على أن القاصر وحده لا يكفي للدلالة على ward"
      expands:
        - text: "«القاف والصاد والراء أصلان صحيحان، أحدهما يدلّ على ألّا يبلغ الشيءُ مداه ونهايتَه، والآخر على الحبس»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على عدم بلوغ المدى، فالقاصر من لم يبلغ"

    - lemma: "دَخِيل"
      contradicts:
        - text: "«من دخل في قوم وانتسب إليهم وليس منهم، والضيف لدخوله على المضيف، وكل كلمة أدخلت في كلام العرب وليست منه»"
          source: "المعجم الوسيط"
          conflict: "الدلالات المعجمية للدخيل (الأجنبي، الضيف، المقترض اللفظي) بعيدة عن مفهوم الشخص الخاضع للوصاية"

# ── المرحلة ٣: التحليل اللغوي ────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خَاضِعٌ لِلْوِصَايَةِ"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل في اختبار السكّ: يمكن استبدال «خاضع» بـ«موضوع» أو «واقع» أو «خاضع» مع حروف جر مختلفة (خاضع للرقابة، خاضع للإشراف) دون فقدان البنية. ليست وحدة معجمية ثابتة ولا مصطلحاً مسكوكاً في أي معجم عربي مرجعي. لم يُعثر على أي دليل معجمي يثبتها مركّباً اصطلاحياً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مَكْفُول"
      decision: confirmed
      decision_reason: "مثبت في المعجم الموحد لمصطلحات القانون ضمن ترجمة ward بصيغة «يتيم مكفول»، وجذره «كفل» يدلّ على الضمان والإعالة. مستعمل في القانون العربي المعاصر ومنظومة الكفالة بمعنى من يكون في عهدة غيره."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على جانب الإعالة والضمان المالي والاجتماعي، ويشيع في سياق كفالة الأيتام والرعاية الاجتماعية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَكْفُول"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَحْجُورٌ عَلَيْهِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فقهي وقانوني راسخ مثبت في التوقيف على مهمات التعاريف للمناوي ومعجم الصواب اللغوي، يدلّ على الممنوع من التصرف في ماله وشؤونه بحكم قضائي أو شرعي. أقرب المصطلحات العربية الأصيلة لمفهوم ward."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على الجانب القانوني والمنع من التصرف، ويشمل السفيه والمجنون والقاصر، وهو أعمّ من مكفول الذي يختصّ بالإعالة"
      actions:
        - command: create_entry
          params:
            lemma: "مَحْجُورٌ عَلَيْهِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَوْلًى عَلَيْهِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي دليل معجمي يثبت هذا التعبير بوصفه مصطلحاً مسكوكاً في المعاجم المتاحة. رغم إمكانه القياسية في الفقه، لا يمكن تأكيده دون سند معجمي."

    - lemma: "قَاصِر"
      source: stage1
      decision: removed
      decision_reason: "القاصر يختصّ بمن لم يبلغ سنّ الرشد فقط (minor)، وهو أخصّ من مفهوم ward الذي يشمل كل شخص تحت وصاية أو حماية غيره. المورد الحديث نفسه يقيّده بـ«القاصر الموضوع تحت الوصاية» مما يدلّ على أن القاصر وحده لا يفي بالمعنى."

    - lemma: "دَخِيل"
      source: stage1
      decision: removed
      decision_reason: "الدلالات المعجمية المثبتة للدخيل (الأجنبي، الغريب، الضيف، المقترض اللفظي) بعيدة كلياً عن مفهوم الشخص الخاضع للوصاية. المجاز المقترح غير مسنود بأي استعمال."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "شخص تحت حماية أو وصاية شخص آخر"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول في بنيته لكنه يحتاج تدقيقاً أسلوبياً ليكون بصيغة المعجم الوسيط، مع إضافة القيد القانوني/الشرعي"
    authored:
      - type: terminological
        text: "مَنْ يكونُ في ولايةِ غيرِه وكفالتِه، فلا يملكُ التصرُّفَ في شؤونِهِ بنفسِه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كلُّ شخصٍ وُضِعَ تحت حمايةِ آخَرَ أو وصايتِهِ لعجزِهِ عن إدارةِ أمورِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ يكونُ في ولايةِ غيرِه وكفالتِه، فلا يملكُ التصرُّفَ في شؤونِهِ بنفسِه"

  examples:
    per_lemma:
      - lemma: "مَكْفُول"
        examples:
          - text: "أصدرت المحكمةُ قراراً بتعيين الجدّة وصيّةً على الطفل المكفول بعد وفاة والدَيْه."
            type: usage
      - lemma: "مَحْجُورٌ عَلَيْهِ"
        examples:
          - text: "لا يجوز للمحجور عليه أن يتصرّف في أمواله إلا بإذن من الوصيّ المعيّن من القاضي."
            type: usage
    actions:
