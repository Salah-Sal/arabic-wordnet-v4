# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13446598-n — accretion (فلك)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تراكم، تنامي) بدون تشكيل كامل"
      - "لمّة «تنامي» مكتوبة بالياء بدلاً من الصيغة المعجمية المنوّنة «تَنَامٍ»"
      - "التعريف يبدأ بـ«تشكل جسم سماوي» وهو أقرب إلى وصف عملية التشكّل منه إلى تسمية التراكم الجُذبي بدقة"
    observations: "المفهوم المقصود هو التراكم الفلكي (accretion) أي ازدياد حجم جسم سماوي تدريجياً بانضمام مادة محيطة إليه بفعل الجاذبية. هذا مفهوم علمي حديث له مقابلات عربية مصطلحية ثابتة في معاجم الفلك والجيولوجيا والأرصاد. التعريف الحالي يركّز على «التشكّل» وكأن المفهوم هو نشوء الجِرم لا تنامي حجمه، والأدق التركيز على الازدياد التدريجي."
  blind_candidates:
    - lemma: "تَرَاكُم"
      generation_method: ishtiqaq
      justification: "من جذر «ركم» على وزن تَفَاعُل، يدل على تجمّع الشيء بعضه فوق بعض، مناسب لعملية تراكم المادة الكونية"
    - lemma: "تَكَتُّل"
      generation_method: ishtiqaq
      justification: "من جذر «كتل» على وزن تَفَعُّل، يدل على صيرورة المواد كتلة واحدة، وقد يصلح للتجمّع الكتلي للمادة السماوية"
    - lemma: "تَضَامّ"
      generation_method: ishtiqaq
      justification: "من جذر «ضمم» على وزن تَفَاعُل، يدل على انضمام أجزاء متفرقة في كلّ واحد، مطابق لفكرة انضمام الأجسام بفعل الجاذبية"
    - lemma: "تَنَامٍ"
      generation_method: ishtiqaq
      justification: "من جذر «نمو/نمي» على وزن تَفَاعُل، يدل على الازدياد التدريجي، مناسب لتزايد حجم الجسم السماوي بإضافات خارجية"

stage2_evidence:
  per_lemma:
    - lemma: "تَرَاكُم"
      confirm:
        - text: "«تَجَمُّع الأشياء بعضها إلى بعض»"
          source: "المعجم الكبير"
        - text: "«تراكُم — تزايد رقعة الأرض بالتطمي أو التغريم» (accretion)"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«تراكُم» = accumulation (في مجال الرياضيات والفلك)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«تراكُم، تجمع بالتجاذب» = accretion"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«الشَّيْءُ: ارْتَكَمَ. يقال: ركَمَه فَتَراكم تَرَاكَمَتِ الأَشْغالُ تَرَاكَم السَّحابُ: تَنَامَى وتَكَاثَفَ»"
          source: "المعجم الكبير"
      expands:
        - text: "«إضافات متتالية من مادة إلى كائن مستهدف، أو إلى جهاز، أو إلى جزء من البيئة، مما يؤدي إلى زيادة كمية أو تركيز المادة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: "يوضح آلية التراكم: إضافات متتالية تؤدي إلى زيادة الكمية"
        - text: "«(تراكم) ارتكم يُقَال تراكمت الأشغال»"
          source: "المعجم الوسيط"
          addition: "يؤكد أن الفعل تراكم مطاوع ركم"

    - lemma: "تَنَامٍ"
      confirm:
        - text: "«تنام — تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات» = accretion"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«(1) تزايُد؛ تنامٍ؛ تعاظُم [من طريق النموّ العُضوي أو بواسطة إضافات خارجية تدريجية] (3) الالتحام؛ التنامي الالتحاميّ: التحام عضوين منفصلين طبيعيًا ونموُّهما معًا (ط)» = accretion"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«تنامٍ بحُزمة جزيْئِيّة — إجرائيةٌ تُستخدَمُ في تصنيع تجهيزات أنصاف النواقل» = molecular beam epitaxy"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُستخدم «تنامٍ» في سياقات تقنية أخرى بمعنى النمو الطبقي التدريجي"

    - lemma: "تَكَتُّل"
      contradicts:
        - text: "«تجمع مواد مختلفة في كتلة واحدة» = agglomeration"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "التكتّل يعني التجمّع في كتلة واحدة (agglomeration) لا الازدياد التدريجي (accretion)"
        - text: "«الناسُ: صاروا كتلة: أى جماعة متفقة على رأى واحد. (مج)»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال المعاصر لتكتّل يغلب فيه المعنى الاجتماعي-السياسي"

    - lemma: "تَضَامّ"
      contradicts:
        - text: "«الطرقُ الممكنةُ في وَصْفِ جُمْلَةٍ ما, فتَخْتَلِفُ طريقةُ كلِّ منها عن الأخرى؛ تقديمًا وتأخيرًا وفصلاً ووصلاً»"
          source: "المعجم الكبير"
          conflict: "في المعجم الكبير التضامّ مصطلح نحوي لا فلكي"
      expands:
        - text: "«التحام أجزاء متفرقة في كلٍ واحد» = coalescence"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "التضامّ يقابل coalescence (الالتحام) لا accretion (التراكم التدريجي)"
        - text: "«الشَّيءُ: اضْطَمَّ وقيل: انْضَمَّ شيئًا فشيئًا»"
          source: "المعجم الكبير"
          addition: "المعنى اللغوي الأصلي (انضمام شيئاً فشيئاً) قريب لكن المصطلح استقرّ على coalescence"

stage3_analysis:
  per_lemma:
    - lemma: "تَرَاكُم"
      decision: confirmed
      decision_reason: "لمّة مثبتة في معاجم الفلك والعلوم الطبيعية بمعنى accumulation/accretion، مدعومة بأدلة وافرة من المعجم الكبير والمعاجم المصطلحية المتعددة. الجذر «ركم» يدل أصلاً على تجمّع الشيء بعضه على بعض."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البعد المادي الكمّي: تجمّع المادة وتكدّسها طبقة فوق طبقة. أعمّ من «تنامٍ» إذ يشمل كل أنواع التراكم لا المتنامي فحسب."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرَاكُم"

    - lemma: "تَنَامٍ"
      decision: confirmed
      decision_reason: "مثبتة في معجم الهندسة المدنية مقابلاً لـ accretion بتعريف «تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات»، وفي المورد الحديث مقابلاً لـ accretion. الصيغة الصحيحة هي «تَنَامٍ» (بالتنوين) لا «تنامي»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البعد الحركي التدريجي: الازدياد المتنامي في الحجم. أدقّ من «تراكم» في سياق accretion الفلكي لأنه يشير إلى النمو التراكمي لا مجرد التكدّس."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنَامٍ"

    - lemma: "تَكَتُّل"
      source: stage1
      decision: removed
      decision_reason: "التكتّل مصطلح مستقر في المعاجم العلمية مقابلاً لـ agglomeration لا accretion. المفهومان مختلفان: التكتّل تجمّع في كتلة، والتراكم ازدياد تدريجي بضم مادة محيطة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَضَامّ"
      source: stage1
      decision: removed
      decision_reason: "التضامّ استقر مصطلحياً مقابلاً لـ coalescence (الالتحام) في المعاجم الطبية، وله معنى نحوي في المعجم الكبير. لا يطابق مفهوم accretion الفلكي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

