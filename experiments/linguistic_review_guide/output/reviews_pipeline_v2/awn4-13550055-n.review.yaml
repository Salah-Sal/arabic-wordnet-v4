# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13550055-n
# ossification (metaphorical) — التحجر الفكري
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «تحجر فكري» مركب إضافي وصفي قد يكون تركيباً حراً وليس مصطلحاً مسكوكاً"
      - "اللمّة بدون تشكيل كامل"
      - "لا توجد لمّات بديلة رغم ثراء الحقل الدلالي العربي في هذا المفهوم"
    observations: >
      المفهوم يدور حول عملية التصلّب والجمود الفكري — أي التحوّل إلى حالة ثابتة
      لا تقبل التغيير في أنماط التفكير أو السلوك. المجاز العربي غنيّ في هذا الباب:
      التحجّر (من الحجر)، والجمود (من الجمد)، والتصلّب (من الصلب)، وكلها
      تصلح مجازاً للدلالة على الجمود الذهني. المجموعة تحت «عملية بشرية»
      مما يؤكد أنّ المطلوب هو وصف العملية لا الحالة.
  blind_candidates:
    - lemma: "تَحَجُّر"
      generation_method: majaz
      justification: >
        مجاز من الحجر (الصخر) — التحجّر الحسي (تحوّل المادة إلى حجر) نُقل إلى
        المعنى المعنوي: تحوّل الفكر أو السلوك إلى حالة صلبة لا تقبل التغيير.
        وزن تَفَعُّل يدلّ على التحوّل التدريجي، وهو مطابق لمعنى العملية (process).
    - lemma: "جُمُود"
      generation_method: majaz
      justification: >
        مجاز من جمود الماء — انتقل إلى جمود النفس والفكر. الجمود هيئة حاصلة
        للنفس تمنعها من الحركة والتغيير. لكنه أعمّ من المفهوم المطلوب إذ يشمل
        السكون العامّ لا التثبيت في نمط بعينه.
    - lemma: "تَصَلُّب فِكْرِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من التصلّب (الشدة والقوة — من صلب) مع القيد «فكري».
        يدلّ على اكتساب الفكر صلابة تمنع مرونته. لكنه قد يتداخل مع
        المعنى الطبي للتصلّب.
    - lemma: "تَنَمُّط"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من «نمط» على وزن تَفَعُّل، بمعنى الانضباط في نمط واحد ثابت.
        النمط في العربية هو الطريقة والنوع، فالتنمّط هو التقيّد بنمط واحد لا يتغيّر.
        مصطلح جديد لكنه شفّاف الدلالة.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تحجر فكري"
      evidence_status: "no_material_found"

    - lemma: "تَحَجُّر"
      confirm:
        - text: "«(3) التحجُّر [في السّلوك أو المعتقدات أو العادات].»"
          source: "المورد الحديث (2008) — ترجمة ossification"
        - text: "«تكلّس، تحجّر — في الفكر و العاطفة»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm) — ترجمة ossification"
        - text: "«تحجُّر — تغير المواد العضوية إلى مادة حجرية بإحلال مواد معدنية محل أنسجتها العضوية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      expands:
        - text: "«التّحجّر: هو ورم صغير ينجمد ويتحجّر في العين، كذا في بحر الجواهر.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "معنى طبي قديم خاص بالعين — يوسّع نطاق الاستعمال الحسي"
        - text: "«(1) تحجير (2) شيء متحجّر (3) تحجُّر.»"
          source: "المورد الحديث (2008) — ترجمة petrifaction"
          addition: "يؤكد أن التحجّر يُستخدم أيضاً بمعنى petrifaction"

    - lemma: "جُمُود"
      confirm:
        - text: "«الجمود: هيئة حاصلة للنفس بها يقتصر عن استيفاء ما ينبغي وما لا ينبغي.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الجمود: علة إذا عرضت للإنسان بقي على الحالة التي أدركته عليها إما جالساً أو قائماً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المعنى الطبي (الجُمْدة/الكاتاتونيا) يختلف عن المعنى المجازي المطلوب"
      expands:
        - text: "«ثبات؛ جمود؛ لاتحرّكية.»"
          source: "المورد الحديث (2008) — ترجمة immobility"
          addition: "الجمود أعمّ — يشمل الثبات والسكون لا التثبيت في نمط بعينه"
        - text: "«القُصور الذاتي؛ قوة الاستمرار (فز) — جمود؛ كسَل.»"
          source: "المورد الحديث (2008) — ترجمة inertia"
          addition: "دلالة الجمود تميل إلى القصور والكسل أكثر من التحجّر في نمط محدد"

    - lemma: "تَصَلُّب فِكْرِيّ"
      contradicts:
        - text: "«(فى الطِّب): تيَبُّسٌ وقساوة فى الأنسجة اللينة لبعض أجزاء الجسمِ, ويحدث ذلك بسبب تغيُّرات مَرَضية فيه»"
          source: "المعجم الكبير"
          conflict: "التصلّب مصطلح طبي راسخ (تصلب الشرايين، تصلب الأذن) — استعماله المجازي يلتبس بالمعنى الطبي"
      expands:
        - text: "«(1) صلابة؛ تيبُّس؛ جُسوء (2) صرامة (3) قسوة (4) تصلُّب.»"
          source: "المورد الحديث (2008) — ترجمة rigidity"
          addition: "التصلّب يترجم rigidity لا ossification — فرق دلالي مهم"

    - lemma: "تَنَمُّط"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تَحَجُّر فِكْرِيّ"
      decision: confirmed
      decision_reason: >
        المركب الإضافي الوصفي «تحجّر فكري» يُقيّد المجاز بالمجال الذهني تحديداً،
        وهو يطابق التعريف الإنجليزي «rigidly fixed in a conventional pattern of thought».
        رغم أنه مركب حرّ نسبياً، إلا أنه مستعمل في الخطاب الفكري العربي المعاصر
        ويمثّل التعبير الأكثر صراحةً عن المفهوم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُقيّد التحجّر بالمجال الفكري صراحةً، فلا يلتبس بالتحجّر الجيولوجي أو الطبي.
        أدقّ من «تحجّر» المطلق حين يُراد تخصيص السياق الذهني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحَجُّر فِكْرِيّ"

    - lemma: "تَحَجُّر"
      source: stage1
      decision: confirmed
      decision_reason: >
        ثبت استعمال «التحجّر» بالمعنى المجازي (في السلوك أو المعتقدات أو العادات)
        في المورد الحديث ومسرد علم الاجتماع. هو المقابل العربي الأول لـ ossification
        بالمعنى المجازي، ولا يحتاج إلى قيد «فكري» لأن السياق يُحدّد المراد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ من «تحجّر فكري» — يشمل التحجّر في السلوك والعادات والمعتقدات
        لا الفكر فحسب. يُستعمل حين لا يُراد تقييد المجال.
      actions:
        - command: create_entry
          params: {lemma: "تَحَجُّر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13550055-n"}

    - lemma: "جُمُود"
      source: stage1
      decision: removed
      decision_reason: >
        الجمود أعمّ من المفهوم المطلوب — يدلّ على السكون والقصور العامّ
        (immobility, inertia) لا على التثبيت الصارم في نمط تقليدي بعينه.
        كما أن للجمود معنى طبياً (الكاتاتونيا) ومعنى فيزيائياً (القصور الذاتي)
        مما يولّد التباساً. الفرق الدلالي بين الجمود والتحجّر أن التحجّر يفترض
        تحوّلاً من حالة مرنة إلى حالة صلبة (عملية)، بينما الجمود حالة ساكنة.
      evidence_assessment:
        case: mixed

    - lemma: "تَصَلُّب فِكْرِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        التصلّب مصطلح طبي راسخ (تصلب الشرايين، تصلب الأذن) ويترجم rigidity
        لا ossification. المركب «تصلب فكري» لا يحمل دلالة العملية التدريجية
        للتحوّل إلى نمط ثابت، بل يصف حالة ثابتة من الصلابة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَنَمُّط"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي لهذا الاشتقاق. وإن كان شفّاف الدلالة
        صرفياً (التقيّد بنمط)، إلا أنه مولَّد لم يثبت استعماله، ومعناه أقرب
        إلى «الامتثال لنمط» منه إلى «التحوّل إلى حالة جامدة».
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "عملية التثبيت الصارم في نمط تقليدي من التفكير أو السلوك"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي. يحتاج إلى صياغة
        معجمية عربية أصيلة تبتعد عن أسلوب الترجمة وتقترب من أسلوب المعجم الوسيط.
        كلمة «التثبيت» توحي بفعل خارجي، بينما المعنى المراد هو تحوّل ذاتي تدريجي.
    authored:
      - type: terminological
        text: "تحوُّلُ الفِكْرِ أَوِ السُّلوكِ إِلَى حالَةٍ جامِدَةٍ لا تَقْبَلُ التَّغْيِيرَ، بِالتَّقَيُّدِ الصّارِمِ بِأَنْماطٍ مَوْروثَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "تَجَمُّدُ أَنْماطِ التَّفْكِيرِ وَالسُّلوكِ عَلَى هَيْئَةٍ واحِدَةٍ لا تَتَحَوَّلُ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13550055-n"
          definition_index: 0
          text: "تحوُّلُ الفِكْرِ أَوِ السُّلوكِ إِلَى حالَةٍ جامِدَةٍ لا تَقْبَلُ التَّغْيِيرَ، بِالتَّقَيُّدِ الصّارِمِ بِأَنْماطٍ مَوْروثَةٍ."

