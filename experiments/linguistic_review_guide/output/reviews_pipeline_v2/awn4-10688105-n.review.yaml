    # ── مرشحات المرحلة ١ ──
    - lemma: "مَفْحُوص"
      source: stage1
      decision: confirmed
      decision_reason: "اسم مفعول عربي صريح من الجذر ف ح ص على وزن مَفْعُول، مُوثّق في المورد الحديث بمعنى examinee. الجذر يدلّ على البحث والتحقيق بحسب مقاييس اللغة. مفردة مسكوكة لا لبس فيها، تدلّ مباشرة على من يقع عليه فعل الفحص"
