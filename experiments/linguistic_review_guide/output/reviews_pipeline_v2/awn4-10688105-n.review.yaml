# مراجعة المجموعة الترادفية: awn4-10688105-n
# subject / case / guinea pig
# شخص يخضع لإجراءات تجريبية أو رصدية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «خَاضِع لِلتَّجْرِبَة» تركيب وصفي حرّ يفشل في اختبار السكّ: يمكن إبدال «التجربة» بـ«الاختبار» أو «الفحص» ويبقى صالحاً كوصف"
      - "اللمّة «مَوْضُوع الدِّرَاسَة» تُستخدم عادةً للإشارة إلى موضوع البحث (topic) لا إلى الشخص الخاضع للبحث (human subject)، فيها لبس دلالي"
      - "كلتا اللمّتين تركيبان إضافيان لا مصطلحان مسكوكان أحاديان، والمجموعة تفتقر إلى مفردة عربية صرفة"
      - "التعريف العربي الحالي ترجمة شبه حرفية للتعريف الإنجليزي"
    observations: "المجموعة تدلّ على الشخص الذي يكون محلّ التجربة أو الرصد العلمي، وهو مفهوم مركزي في منهجية البحث العلمي. العربية العلمية المعاصرة تستعمل عدة صيغ لهذا المفهوم، أبرزها اسم المفعول «مَفْحُوص» و«مُخْتَبَر» و«مُمْتَحَن»، وكلها مشتقات على وزن مَفْعُول أو مُفْتَعَل تدلّ على من يقع عليه فعل الفحص أو الاختبار. أمّا المركبات الإضافية فهي أقرب إلى الوصف الحرّ منها إلى المصطلح المعجمي الثابت."
  blind_candidates:
    - lemma: "مَفْحُوص"
      generation_method: ishtiqaq
      justification: "اسم مفعول من فَحَصَ على وزن مَفْعُول، والفحص يعني البحث والتحقيق عن الشيء، فالمفحوص هو الشخص الذي يُجرى عليه الفحص والتحقيق"
    - lemma: "حَالَة"
      generation_method: majaz
      justification: "مجاز مُرسَل من باب إطلاق الحالة على صاحبها، كما يُقال في الطب «حالة» بمعنى المريض أو الشخص محلّ الدراسة، موافقاً للإنجليزية case بهذا المعنى"
    - lemma: "مُجَرَّب عَلَيْهِ"
      generation_method: tarkib
      justification: "تركيب من اسم المفعول «مُجَرَّب» من جَرَّبَ بمعنى اختبر، مع حرف الجر «عليه» لتخصيص الدلالة بمن تُجرى عليه التجربة"
    - lemma: "مُسْتَقْصًى"
      generation_method: ishtiqaq
      justification: "اسم مفعول من اسْتَقْصَى يَسْتَقْصِي بمعنى بالغ في البحث والتحقيق، فالمُستقصى هو من يُبحث عنه ويُحقَّق فيه تحقيقاً دقيقاً"

stage2_evidence:
  per_lemma:
    - lemma: "خَاضِع لِلتَّجْرِبَة"
      expands:
        - text: "«(خَضَعَ) الْخَاءُ وَالضَّادُ وَالْعَيْنُ أَصْلَانِ: أَحَدُهُمَا تَطَامُنٌ فِي الشَّيْءِ... فَالْأَوَّلُ الْخُضُوعُ. قَالَ الْخَلِيلُ: خَضَعَ خُضُوعًا، وَهُوَ الذُّلُّ وَالِاسْتِخْذَاءُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر خ ض ع يدلّ على التطامن والذل، وهو مناسب لمن يخضع لإجراء يُوقَع عليه"
        - text: "«فُلانٌ فلانًا: أَلانَ كلامَه معه»"
          source: "المعجم الكبير"
          addition: "معنى خَضَعَ في المعجم الكبير يركز على لين الكلام، وهو بعيد عن دلالة الخضوع للتجربة"

    - lemma: "مَوْضُوع الدِّرَاسَة"
      contradicts:
        - text: "«الموضوعُ: هُوَ الشَّيْءُ الْمَحْكُوم عَلَيْهِ فِي الْقَضِيَّة»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الموضوع هنا بمعنى المحكوم عليه منطقياً لا بمعنى الشخص الخاضع للتحقيق"
        - text: "«الموضوع: محل العرض المختص به»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الموضوع اصطلاحاً هو محل العرض، أي ما يُحمل عليه الحكم، وهو أقرب لمعنى topic منه لمعنى human subject"
      expands:
        - text: "«(5) الشَّخص؛ الموضوع: شخص تُدْرَس ارتكاساتُهُ أو استجاباته»"
          source: "المورد الحديث (2008) — مدخل subject"
          addition: "المورد يُثبت استعمال «الموضوع» بمعنى الشخص الخاضع للدراسة في السياق العلمي، لكنه أحد معانٍ كثيرة للكلمة"

    - lemma: "مَفْحُوص"
      confirm:
        - text: "«المفحوص؛ الممتحَن؛ المستنطَق.»"
          source: "المورد الحديث (2008) — مدخل examinee"
        - text: "«(فَحَصَ) الْفَاءُ وَالْحَاءُ وَالصَّادُ أَصْلٌ صَحِيحٌ، وَهُوَ كَالْبَحْثِ عَنِ الشَّيْءِ. يُقَالُ: فَحَصْتُ عَنِ الْأَمْرِ فَحْصًا»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "حَالَة"
      expands:
        - text: "«(5) الشَّخص؛ الموضوع: شخص تُدْرَس ارتكاساتُهُ أو استجاباته»"
          source: "المورد الحديث (2008) — مدخل subject"
          addition: "المورد يذكر الشخص والموضوع لكن لا يذكر «حالة» صراحةً بهذا المعنى في هذا المدخل"
      contradicts:
        - text: "«المُمْتَحَن: المُخْضَع لامتحان أو اختبار»"
          source: "المورد الحديث (2008) — مدخل testee"
          conflict: "المورد يُفضّل «الممتحن» و«المفحوص» على «حالة» للدلالة على الشخص الخاضع للاختبار"

    - lemma: "مُجَرَّب عَلَيْهِ"
      evidence_status: "no_material_found"

    - lemma: "مُسْتَقْصًى"
      evidence_status: "no_material_found"

