# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-10755509-n (ugly duckling)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «البطة القبيحة» ترجمة حرفية (calque) من الإنجليزية ugly duckling، وليست مصطلحاً عربياً أصيلاً"
      - "كلمة «بطة» تعني البطة البالغة لا الفرخ (duckling)، فثمة فقد دلالي في التصغير"
      - "المبالِغ الأعلى (hypernym) «عامل/فاعل» لا يناسب هذا المفهوم دلالياً؛ المقصود شخص يتحوّل لا شخص يعمل"
      - "المفهوم مستورد من حكاية أندرسن الدنماركية، وليس له تعبير عربي تراثي مستقل"
    observations: "المجموعة تمثّل مفهوماً مجازياً مستعاراً من الأدب الغربي، يُستخدم في الإعلام العربي المعاصر بصيغة «البطة القبيحة» استعمالاً شائعاً وإن لم يكن تراثياً. التعريف العربي الحالي مقبول من حيث المضمون لكنه أقرب إلى الترجمة منه إلى التأليف المعجمي. لا يوجد في التراث العربي مصطلح مسكوك لهذا المفهوم تحديداً."
  blind_candidates:
    - lemma: "البَطَّةُ الدَّمِيمَةُ"
      generation_method: tarkib
      justification: "مركب وصفي يستعمل صفة «دميم» الفصيحة التراثية بدل «قبيح» الأكثر عموماً، فيكون أدق في وصف قبح المنظر لا القبح المعنوي"
    - lemma: "البُطَيْطَةُ القَبِيحَةُ"
      generation_method: tarkib
      justification: "مركب وصفي يستعمل التصغير «بُطَيْطَة» الذي يوازي duckling في الإنجليزية، فيحافظ على دلالة الصغر المفقودة في «بطة»"
    - lemma: "الفَرْخُ الدَّمِيمُ"
      generation_method: tarkib
      justification: "مركب وصفي من ألفاظ عربية صرفة: فَرْخ (ولد الطائر) + دميم (قبيح المنظر)، بديل يتجنّب لفظ «بطة» الفارسي الأصل"
    - lemma: "الشَّرْنَقَةُ"
      generation_method: majaz
      justification: "مجاز من شرنقة (غلاف الحشرة) للدلالة على من يُخفي جماله في طور مبكر ثم يتحوّل إلى شيء جميل، كما تتحوّل دودة القز إلى فراشة"

stage2_evidence:
  per_lemma:
    - lemma: "الْبَطَّةُ الْقَبِيحَةُ"
      expands:
        - text: "«(البطة) نوع من الإوز (للأنثى والذكر) وإناء على شكل البطة يوضع فيه الدهن (ج) بط وبطط»"
          source: "المعجم الوسيط"
          addition: "بطة تعني البطة البالغة لا الفرخ، وهي للأنثى والذكر معاً"
        - text: "«(القبيح) ضد الحسن وهو ما نفر منه الذوق السوي وما كره الشرع اقترافه وما أباه العرف العام (ج) قباح وقباحى وقبحى»"
          source: "المعجم الوسيط"
          addition: "قبيح صفة عامة تشمل القبح المادي والمعنوي"
        - text: "«دَورُ الإِثْغارِ القبِيْح»"
          source: "المعجم الطبي الموحد"
          addition: "مصطلح طبي يترجم ugly duckling stage في طب الأسنان، يؤكد شيوع الاقتراض المفهومي في المصطلحية العربية"
    - lemma: "البَطَّةُ الدَّمِيمَةُ"
      expands:
        - text: "«دَمِيم: من (د م م) القبيح المنظر والصغير الجسم والحقير»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "دميم يجمع بين قبح المنظر وصغر الجسم، وهو أدق لوصف الفرخ القبيح"
        - text: "«فأما قولهم رجل دميم الوجه فهو من الباب، كأن وجهه قد طُلي بسواد أو قبح. يقال دمّ وجهه يدمّ دمامة، فهو دميم»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر دمم أصيل في العربية لوصف قبح الوجه تحديداً"
    - lemma: "البُطَيْطَةُ القَبِيحَةُ"
      expands:
        - text: "«البُطَيْطَة: بطّة صغيرة»"
          source: "المورد الحديث"
          addition: "بُطَيْطَة تصغير بطة وتوازي duckling، لكنها ترد في معجم ثنائي اللغة لا في معجم عربي تقليدي"
    - lemma: "الفَرْخُ الدَّمِيمُ"
      expands:
        - text: "«(الفَرْخ) الفاء والراء والخاء كلمة واحدة... فالفرخ: ولد الطائر. يقال: أفرخ الطائر»"
          source: "مقاييس اللغة لابن فارس"
          addition: "فَرْخ لفظ عربي أصيل يعني ولد الطائر عموماً، أعم من بطة"
        - text: "«أَفْرَخَ الأَمْرُ: اسْتَبَانَ بَعْدَ اشْتِبَاهٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "في الجذر ف ر خ دلالة مجازية على الاستبانة بعد الخفاء، وهي قريبة من مفهوم التحوّل من القبح إلى الجمال"
    - lemma: "الشَّرْنَقَةُ"
      contradicts:
        - text: "«(الشرنقة) غشاء واقٍ من خيوط دقيقة تنسجه بعض الحشرات حولها كدودة القز لتحتمي به في طور من أطوار حياتها (محدثة)»"
          source: "المعجم الوسيط"
          conflict: "الشرنقة غشاء حشري لا شخص، والامتداد المجازي للدلالة على شخص يتحوّل غير مسكوك ولا مسجّل"

stage3_analysis:
  per_lemma:
    - lemma: "الْبَطَّةُ الْقَبِيحَةُ"
      decision: confirmed
      decision_reason: "تعبير مسكوك شائع في الإعلام والأدب العربي المعاصر كترجمة ثابتة لـ ugly duckling، ورغم كونه اقتراضاً مفهومياً (calque) إلا أنه استقر في الاستعمال ويفهمه المتلقّي العربي فوراً"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      borrowing_check:
        calque: true
        calque_assessment: "اقتراض مفهومي مقبول لأن الهيكل التركيبي العربي (موصوف + صفة) واضح ومفهوم، والتعبير استقر في الاستعمال المعاصر"
      nuance_differentiation: "التعبير الرئيسي والأكثر شيوعاً في العربية المعاصرة لهذا المفهوم، يحمل ظلال القصة الأصلية ويُستعمل استعمالاً مجازياً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْبَطَّةُ الْقَبِيحَةُ"

    - lemma: "البَطَّةُ الدَّمِيمَةُ"
      source: stage1
      decision: removed
      decision_reason: "رغم أن «دميم» أدق لغوياً في وصف قبح المنظر، إلا أن هذا المركب غير مسكوك ولا مسجّل في أي معجم أو استعمال شائع؛ واختبار الاستبدال يظهر أنه مجرد إبدال صفة بمرادف وليس وحدة معجمية مستقلة"

    - lemma: "البُطَيْطَةُ القَبِيحَةُ"
      source: stage1
      decision: removed
      decision_reason: "رغم أن «بُطَيْطَة» أدق في نقل دلالة التصغير (duckling)، إلا أن هذا المركب غير مسجّل ولا شائع؛ كلمة «بطيطة» ذاتها لا ترد إلا في المورد الحديث (معجم ثنائي) وليست مستعملة في الفصحى المعاصرة"

    - lemma: "الفَرْخُ الدَّمِيمُ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حرّ وليس وحدة معجمية ثابتة؛ يمكن إبدال كلمة بأخرى (الفرخ القبيح، الفرخ البشع...) دون تغيّر المعنى، مما يدل على أنه ليس مصطلحاً مسكوكاً"

    - lemma: "الشَّرْنَقَةُ"
      source: stage1
      decision: removed
      decision_reason: "الشرنقة في المعاجم العربية تدل على غشاء الحشرة حصراً، والامتداد المجازي للدلالة على شخص يتحوّل غير مسجّل ولا شائع في العربية"

