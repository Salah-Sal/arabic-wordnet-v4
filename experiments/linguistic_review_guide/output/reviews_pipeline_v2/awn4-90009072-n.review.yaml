stage1_review:
  assessment:
    concerns:
      - "المفهوم مستورد من ثقافة الرسوم المتحركة اليابانية (أنمي) وليس له جذر في الثقافة العربية"
      - "اللمّة «تسونديري» نقحرة خام للمصطلح الياباني tsundere (ツンデレ) لا تخضع لقواعد التعريب العربي"
      - "اللمّة «مُتَقَلِّب الْوُدّ» عبارة وصفية حرة لا مصطلح مسكوك، وتفيد التذبذب لا التدرج من البرود إلى الدفء"
      - "المشمل الأعلى (عامل/فاعل) عام جداً ولا يفيد في تحديد المفهوم"
      - "لا يوجد مقابل ILI مما يعني أن المجموعة مُولَّدة محلياً"
    observations: >-
      المفهوم يصف نمطاً سلوكياً خاصاً بشخصيات المانغا والأنمي الياباني: شخص يُظهر الجفاء والعدائية
      في البداية ثم يتحول تدريجياً إلى إظهار المودة والدفء. هذا نمط ثقافي محدد لا عام، وتوليد
      مصطلح عربي أصيل له يتطلب إما المجاز أو التركيب الإضافي. البحث في المعاجم العربية لا يُسعف
      في إيجاد لفظ مفرد يجمع بين البرود الأولي والدفء اللاحق في آن واحد.
  blind_candidates:
    - lemma: "مُتَجَهِّم"
      generation_method: ishtiqaq
      justification: >-
        من جذر ج-هـ-م على وزن مُتَفَعِّل. التجهّم في مقاييس اللغة: «يدل على خلاف البشاشة والطلاقة»،
        وتجهّم الرجلَ: استقبله بوجه كريه. يلتقط الجانب الأول من المفهوم (البرودة/العدائية الأولية)
        لكنه لا يتضمن التحول إلى الدفء.
    - lemma: "مُتَمَنِّع"
      generation_method: ishtiqaq
      justification: >-
        من جذر م-ن-ع على وزن مُتَفَعِّل. التمنّع: الامتناع والانكفاف. يصف من يمتنع عن إظهار المودة
        رغم وجودها داخلياً. لكنه في الاستعمال المعاصر يميل إلى التدلّل والمراوغة العاطفية أكثر
        من التحول السلوكي التدريجي.
    - lemma: "بَارِدُ الظَّاهِرِ"
      generation_method: tarkib
      justification: >-
        مركب إضافي يعني: من يبدو بارداً في مظهره الخارجي. يلتقط فكرة الجفاء الظاهري لكنه عبارة
        وصفية حرة تفشل في اختبار السكّ (يمكن إبدال «بارد» بـ«جاف» أو «قاسي» وتبقى صالحة).
    - lemma: "تْسُونْدِيرِي"
      generation_method: taarib
      justification: >-
        تعريب مباشر للمصطلح الياباني tsundere بإلباسه صوتيات عربية. هذا الملاذ الأخير لأن المفهوم
        ثقافي بحت ولا يوجد مقابل عربي طبيعي. يتداوله متابعو الأنمي العرب شفهياً.

