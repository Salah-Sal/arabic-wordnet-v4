      evidence_status: "no_material_found"

    - lemma: "مُتَقَلِّب الْوُدّ"
      contradicts:
        - text: "«مُتَقَلِّب» = protean"
          source: "المعجم الطبي الموحد"
          conflict: "متقلب يفيد التذبذب والتحول المتكرر بين حالات مختلفة، لا التدرج الأحادي الاتجاه من البرود إلى الدفء"
      expands:
        - text: "«الوُدُّ والوِدادُ: الحُبُّ، ويُثَلَّثانِ، كالوِدَادَةِ والمَوَدَّةِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الود في العربية يعني المحبة والمودة، فـ«متقلب الود» يعني من يتذبذب في حبه"
        - text: "«(وَدَّ) الْوَاوُ وَالدَّالُ: كَلِمَةٌ تَدُلُّ عَلَى مَحَبَّةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر ودد أصل صحيح يدل على المحبة"

    - lemma: "مُتَجَهِّم"
      confirm:
        - text: "«تَجَهَّمَ لفلان: اسْتَقْبَلَه بِوَجْهِ كَرِيه. فلانًا: جَهَمَه، وقيل هو أَن يُغْلِظَ له في القَوْل»"
          source: "المعجم الكبير"
      expands:
        - text: "«(جَهْمٌ) الْجِيمُ وَالْهَاءُ وَالْمِيمُ يَدُلُّ عَلَى خِلَافِ الْبَشَاشَةِ وَالطَّلَاقَةِ. يُقَالُ رَجُلٌ جَهْمُ الْوَجْهِ أَيْ كَرِيهُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على العبوس والكراهة في الوجه، وهو الجانب الأولي من المفهوم فقط"

    - lemma: "مُتَمَنِّع"
      confirm:
        - text: "«(تمنع) الشَّيْء امْتنع وَبِه احتمى وَعنهُ انكف»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(مَنَعَ) الْمِيمُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ هُوَ خِلَافُ الْإِعْطَاءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على خلاف الإعطاء والبذل، لكن لا يتضمن معنى التحول التدريجي"

    - lemma: "بَارِدُ الظَّاهِرِ"
      evidence_status: "no_material_found"

    - lemma: "تْسُونْدِيرِي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تسونديري"
      decision: confirmed
      decision_reason: >-
        رغم أن اللمّة نقحرة خام من اليابانية ولا تخضع لقواعد التعريب المثالية، فإنها المصطلح
        الوحيد المتداول في مجتمع متابعي الأنمي العرب للإشارة إلى هذا النمط السلوكي بدقة.
        المفهوم ثقافي ياباني بحت ولا يوجد بديل عربي أصيل يجمع بين البرود الأولي والتحول
        التدريجي إلى الدفء. يُبقى عليها بوصفها تعريباً اصطلاحياً لمفهوم ثقافي مستورد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        المصطلح الدقيق المباشر للنمط الياباني (tsundere)، يحمل كامل الدلالة الثقافية
        الأصلية دون أي خسارة دلالية، لكنه غريب صوتياً على العربية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تْسُونْدِيرِي"

    - lemma: "مُتَقَلِّب الْوُدّ"
      decision: removed
      decision_reason: >-
        عبارة وصفية حرة تفشل في اختبار السكّ المعجمي: يمكن إبدال «متقلب» بـ«متذبذب» أو «متغير»
        والعبارة تظل صالحة كوصف. فضلاً عن ذلك، «التقلب» يفيد التذبذب العشوائي بين البرود والدفء
        لا التدرج الأحادي الاتجاه من الجفاء إلى المودة الذي هو جوهر المفهوم. ليست مصطلحاً مسكوكاً
        بل تفسير حر.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُتَجَهِّم"
      source: stage1
      decision: removed
      decision_reason: >-
        التجهم يدل على العبوس وخلاف البشاشة فحسب، ولا يتضمن أي إشارة إلى التحول التدريجي
        نحو الدفء. يصف نصف المفهوم فقط (الجانب البارد) ويُسقط جوهره (التحول).
      evidence_assessment:
        case: mixed

    - lemma: "مُتَمَنِّع"
      source: stage1
      decision: removed
      decision_reason: >-
        التمنع في الاستعمال المعاصر يميل إلى الدلالة على التدلل والمراوغة العاطفية (خاصة في
        السياق الرومانسي)، وهو أضيق من المفهوم المقصود الذي يشمل العدائية الحقيقية لا مجرد
        التدلل. كما أنه لا يتضمن بُعد التحول الزمني التدريجي.
      evidence_assessment:
        case: mixed

    - lemma: "بَارِدُ الظَّاهِرِ"
      source: stage1
      decision: removed
      decision_reason: >-
        عبارة وصفية حرة تفشل في اختبار السكّ: يمكن إبدال «بارد» بـ«جاف» أو «قاسي» وتبقى
        صالحة. ليست وحدة معجمية ثابتة ولا مصطلحاً مسجلاً.
      evidence_assessment:
        case: no_material

    - lemma: "تْسُونْدِيرِي"
      source: stage1
      decision: removed
      decision_reason: >-
        مكرر مع اللمّة الموجودة «تسونديري»، والفرق مقتصر على التشكيل. سيُعالج التشكيل
        عبر تحديث اللمّة الموجودة بدلاً من إنشاء مدخل مكرر.
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "شخص يكون بارداً أو حتى عدائياً تجاه شخص آخر في البداية قبل أن يظهر جانباً أكثر دفئاً تدريجياً بمرور الوقت"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة حرفية من الإنجليزية تفتقر إلى أسلوب المعجم العربي، ولا تشير إلى
        السياق الثقافي (أنمي/مانغا) الذي نشأ فيه المصطلح، مما يجعله يبدو كوصف نفسي عام.
    authored:
      - type: terminological
        text: "نَمَطٌ سُلُوكِيٌّ (في ثقافة الأنمي والمانغا اليابانية) يتّسم صاحبه بإظهار الجفاء والعدائية ابتداءً ثم التحوّل تدريجياً إلى إبداء المودّة واللطف."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مصطلح ياباني الأصل (ツンデレ tsundere) يُطلق في ثقافة الأنمي والمانغا على الشخصية التي تُبدي في أول أمرها جفاءً وغلظةً تجاه من حولها، ثم تكشف بمرور الوقت عن جانب أرقّ وأكثر وُدّاً. وقد شاع استعماله في وصف أنماط السلوك العاطفي خارج سياقه الأصلي."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نَمَطٌ سُلُوكِيٌّ (في ثقافة الأنمي والمانغا اليابانية) يتّسم صاحبه بإظهار الجفاء والعدائية ابتداءً ثم التحوّل تدريجياً إلى إبداء المودّة واللطف."

  examples:
    per_lemma:
      - lemma: "تْسُونْدِيرِي"
        examples:
          - text: "تُعَدّ شخصية «أسوكا» من مسلسل «إيفانغيليون» أبرزَ نموذج تسونديري في تاريخ الأنمي الياباني."
            type: usage
    actions:
      - command: add_synset_example
        params:
