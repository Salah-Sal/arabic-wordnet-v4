# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92427650-n
# clericalization: عملية زيادة قوة أو نفوذ التسلسل الهرمي الديني
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«تكليركية» تعريب شاذ غير مسجّل في أيّ معجم عربي مرجعي؛ الصيغة المعروفة هي «إكليركيّ/إكليروسيانيّة»."
      - "«هيمنة رجال الدين» عبارة وصفية حرة تفشل اختبار السكّ: يمكن استبدال «هيمنة» بـ«سيطرة» أو «تحكّم» دون تغيُّر الدلالة."
      - "المجموعة تفتقر إلى مصطلح عربي معجمي ثابت يقابل مفهوم clericalization."
    observations: "المفهوم المقصود هو عملية تعزيز نفوذ الطبقة الكهنوتية في الحكم والسياسة. هذا المفهوم مرتبط بالسياق المسيحي الغربي أساساً (الإكليروس)، وله امتدادات في السياق الإسلامي تحت مسمّيات أخرى. التعريف الحالي واضح لكنه يحتاج ضبطاً أدقّ. اللمّات الحالية ضعيفة: إحداهما تعريب مشوّه والأخرى تركيب وصفي حرّ."
  blind_candidates:
    - lemma: "تَكْهِين"
      generation_method: ishtiqaq
      justification: "تَفْعِيل من الجذر «كهن» على قياس تَمْدِين وتَحْدِيث، بمعنى إضفاء الطابع الكَهَنوتي على مؤسسة أو دولة. يُصاغ المصدر للدلالة على عملية التحويل."
    - lemma: "كَهْنَنَة"
      generation_method: ishtiqaq
      justification: "فَعْلَلَة من «كهن» على قياس عَصْرَنَة وعَلْمَنَة، بمعنى جعل الأمور خاضعة لسلطة الكَهَنة. الوزن منتج في الاستعمال المعاصر."
    - lemma: "نُفُوذ الإِكْلِيرُوس"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين «نُفوذ» (تأثير وسلطة) و«الإكليروس» (رجال الدين المسيحي). يصف المفهوم بشفافية."
    - lemma: "إِكْلِيرُوسِيَانِيَّة"
      generation_method: taarib
      justification: "مصدر صناعي معرَّب من «إكليروس» اليونانية، على نمط بروتستانتيّة وإمبرياليّة. يقبل لام التعريف والنسبة والجمع."

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تكليركية"
      expands:
        - text: "«الإكليروسيانية: أ. المبادئ الإكليركية. ب. النفوذ الإكليركيّ في الدولة أو السياسة. ج. الدعوة إلى الإبقاء على هذا النفوذ أو إلى تعزيزه.»"
          source: "المورد الحديث (2008)"
          addition: "المصطلح المسجّل لترجمة clericalism هو «الإكليروسيانية» لا «تكليركية»؛ هذا يدلّ على أنّ الشكل الحالي تعريب غير معياري."
        - text: "«(1) إكليركي (2) نَسْخيّ؛ كتابيّ (3) كاهن؛ قسّ (4) الإكليروسيانيّ: من يدعو إلى الإبقاء على نفوذ الكنيسة في الدولة.»"
          source: "المورد الحديث (2008)"
          addition: "الصفة النسبية المعيارية هي «إكليركيّ» لا «تكليركيّ»."

    - lemma: "هيمنة رجال الدين"
      expands:
        - text: "«هيمنة — hegemony»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
          addition: "«هيمنة» وحدها تعني السيطرة المطلقة (hegemony)، ليست مخصّصة للسياق الديني."

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَكْهِين"
      evidence_status: "no_material_found"

    - lemma: "كَهْنَنَة"
      evidence_status: "no_material_found"

    - lemma: "نُفُوذ الإِكْلِيرُوس"
      expands:
        - text: "«الإِكْلِيرُوس (في اليونانية Kliros «كليرِيكُوس»: قَسّ.): رجال الدِّين المُنتمون إلى الكنيسة المسيحية»"
          source: "المعجم الكبير"
          addition: "يؤكد أنّ «الإكليروس» مصطلح معجمي ثابت لرجال الدين المسيحيين."

    - lemma: "إِكْلِيرُوسِيَانِيَّة"
      confirm:
        - text: "«الإكليروسيانية: أ. المبادئ الإكليركية. ب. النفوذ الإكليركيّ في الدولة أو السياسة. ج. الدعوة إلى الإبقاء على هذا النفوذ أو إلى تعزيزه.»"
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تكليركية"
      decision: removed
      decision_reason: "تعريب شاذ غير مسجّل في أيّ معجم عربي. الصيغة المعيارية المسجّلة في المورد الحديث هي «إكليركيّ» (صفة) و«إكليروسيانيّة» (اسم). البادئة «تـ» لا أصل لها في العربية ولا في الأصل الأجنبي (clericalism). يُستبعد ويُستبدل بالمصطلح المعياري."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "هيمنة رجال الدين"
      decision: confirmed
      decision_reason: "تعبير وصفي شفّاف يؤدي المعنى المقصود رغم أنه ليس مصطلحاً معجمياً مسكوكاً. يُبقى عليه بوصفه عبارة تفسيرية (phraset) تُساعد المستخدم على فهم المفهوم، خاصة أنّ المفهوم غربيّ لا يُعبَّر عنه بكلمة عربية واحدة شائعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير وصفي عام يصف واقع سيطرة رجال الدين دون حمل دلالة أيديولوجية أو مذهبية محدّدة، بخلاف «إكليروسيانية» المختصّة بالسياق المسيحي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَيْمَنَة رِجَال الدِّين"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَكْهِين"
      source: stage1
      decision: removed
      decision_reason: "اشتقاق قياسي مقبول نظرياً (تفعيل من كهن) لكنه غير مسموع ولا مسجّل في أيّ معجم. كما أنّ الجذر «كهن» في الاستعمال العربي يرتبط بالعرافة والتنجيم أكثر من ارتباطه بالسلطة الدينية المؤسسية، مما يُحدث لبساً دلالياً."

    - lemma: "كَهْنَنَة"
      source: stage1
      decision: removed
      decision_reason: "وزن فَعْلَلَة غير منتج من جذر ثلاثي (كهن) إلا بتضعيف اللام أو زيادة، والصيغة «كَهْنَنَة» ثقيلة صوتياً ولا سابق لها في الاستعمال."

    - lemma: "نُفُوذ الإِكْلِيرُوس"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حرّ يفشل اختبار السكّ: يمكن قول «سلطة الإكليروس» أو «تأثير الإكليروس» بالمعنى نفسه. ليس وحدة معجمية ثابتة."

    - lemma: "إِكْلِيرُوسِيَانِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسجّل في المورد الحديث (2008) مقابل clericalism، بتعريف يتطابق مع معنى المجموعة: «النفوذ الإكليركيّ في الدولة أو السياسة» و«الدعوة إلى تعزيزه». المصطلح مبنيّ من «إكليروس» اليونانية المسجّلة في المعجم الكبير، مع لاحقة النسبة المزيدة (-يانيّة) والمصدر الصناعي (-ة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح متخصص يحمل دلالة أيديولوجية مؤسسية مرتبطة بسعي الإكليروس المسيحي إلى السلطة السياسية، بخلاف «هيمنة رجال الدين» الأعمّ."
      actions:
        - command: create_entry
          params:
            lemma: "إِكْلِيرُوسِيَانِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "عملية زيادة قوة أو نفوذ التسلسل الهرمي الديني."
    assessment:
      decision: revise
      reason: "التعريف الحالي يترجم التعريف الإنجليزي حرفياً. يحتاج إلى صياغة عربية أدقّ تُوضّح السياق (سلطة رجال الدين في الشأن السياسي والمدني) وتتجنّب عبارة «التسلسل الهرمي الديني» الثقيلة."
    authored:
      - type: terminological
        text: "تعزيزُ سُلطة رجال الدين ونفوذِهم في الحياة السياسية والمدنية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مسعى منظَّم يهدف إلى توسيع صلاحيات الطبقة الكهنوتية وتمكينها من التأثير في شؤون الحكم والتشريع والتعليم، وقد ارتبط تاريخياً بصراع الكنيسة والدولة في أوروبا."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "تعزيزُ سُلطة رجال الدين ونفوذِهم في الحياة السياسية والمدنية."

  examples:
    per_lemma:
      - lemma: "إِكْلِيرُوسِيَانِيَّة"
        examples:
          - text: "حذَّر المفكّرون الليبراليون من تنامي الإكليروسيانية في المؤسسات التعليمية."
            type: usage
      - lemma: "هَيْمَنَة رِجَال الدِّين"
        examples:
          - text: "أدّت هيمنة رجال الدين على مفاصل الدولة إلى تقييد الحريات المدنية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "حذَّر المفكّرون الليبراليون من تنامي الإكليروسيانية في المؤسسات التعليمية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أدّت هيمنة رجال الدين على مفاصل الدولة إلى تقييد الحريات المدنية."

