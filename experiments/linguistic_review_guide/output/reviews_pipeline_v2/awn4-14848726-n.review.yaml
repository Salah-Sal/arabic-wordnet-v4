        mwe_type: idafi
      nuance_differentiation: "مصطلح تقني زراعي معرّب من الفارسية، يخصّ المادة الصلبة المتماسكة (الكتلة/القالب) المتبقية بعد عصر بذور القطن، شائع في الاستعمال المصري والزراعي الحديث"
