stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «كُسب القطن» مركّب إضافي من أصل فارسي (كُسْب = الكنجارق بالفارسية)، ولا يوجد بديل عربي صرف في المجموعة"
      - "المجموعة تحتوي لمّة واحدة فقط، والأفضل إضافة مرادف عربي أصيل لتعزيز التغطية"
      - "التشكيل على اللمّة الحالية ناقص — يحتاج إلى ضبط كامل بالحركات"
    observations: "المفهوم هو المادة الصلبة المتبقية بعد استخلاص الزيت من بذور القطن، وهو مفهوم زراعي-صناعي شائع في البلاد المنتجة للقطن كمصر والسودان. اللفظ «كُسْب» معرّب من الفارسية «كُسبه» وقد شاع في الاستعمال الزراعي العربي، لا سيما في مصر. يوجد بديل عربي أصيل هو «ثُفْل» الذي يدلّ على ما رسب من خُثارة الشيء بعد عصره."

  blind_candidates:
    - lemma: "ثُفْلُ القُطْنِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «ثُفْل» (ما يتبقّى من المادّة بعد عصرها — أصل عربي صميم من جذر ث ف ل) و«القطن»، على نمط المركّبات الاصطلاحية المعجمية المسجّلة: ثُفْل الزيتون، ثُفْل العنب، ثُفْل بذور الزيت"
    - lemma: "كُسْبَة"
      generation_method: taarib
      justification: "اسم وحدة من «كُسْب» المعرّب عن الفارسية «كُسبه»، يدلّ على القطعة الواحدة من ثُفل البذور الزيتية بعد عصرها، ورد في موسوعة السلطان قابوس بمعنى علف للحاشية يُستخلَص من بذر القطن"
    - lemma: "حُثَالَةُ بِذْرِ القُطْنِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «حُثَالة» (بقيّة الشيء ورديئه) و«بذر القطن»، يصف المادة المتبقية بعد العصر بلفظ عربي كلاسيكي"
    - lemma: "نُخَالَةُ بِذْرِ القُطْنِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «نُخالة» (ما يتبقّى بعد طحن الحبّ أو عصره) و«بذر القطن»، على نسق المصطلحات الزراعية"


stage2_evidence:
  per_lemma:
    - lemma: "كُسْبُ القُطْنِ"
      confirm:
        - text: "«كُسْب القطن: كتلة من بذور القطن المعصورة.»"
          source: "المورد الحديث (2008)"
        - text: "«الكُسْب: ثُفل بزور القطن وغيره بعد عصرها.»"
          source: "المورد الحديث (2008)"
        - text: "«كُسْب — مخلفات البذور الزيتية (التفل المتماسك المتبقي) بعد عصرها.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«وَالْكَسْب: الكنجارق، فارسية، وَبَعض أهل السوَاد يُسَمِّيه: الكسبج.»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "يؤكّد الأصل الفارسي للّفظ"
        - text: "«كمُسْبة: (فارسية كُسْبه) ثفل عصير الفواكه. ثفل الزيتون، ثفل السمسم الذي سحب منه الزيت.»"
          source: "تكملة المعاجم العربية لدوزي"
          addition: "يوضّح أنّ كُسْبة فارسية الأصل وتُستعمل لثُفل أيّ بذور زيتية"
        - text: "«كُسْبَة — من (ك س ب) القطعة من الكسب بمعنى علف للحاشية يستخلص من ثقل بذر القطن بعد عصره.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يبيّن استخدام الكُسْب والكُسْبة علفاً للدوابّ"

    - lemma: "ثُفْلُ القُطْنِ"
      confirm:
        - text: "«ثُفْل — المادة المتبقية من الفواكه والخضراوات بعد عصرها.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«ثُفْل بذور الزيت — المتبقي من عصر البذور أو الثمار الزيتية.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«ثُفْل [مفرد]: ما يتبقى من المادة بعد عصيرها أو إغلائها.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«الثُّفْلُ: ما سَفَلَ من كل شئ.»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      expands:
        - text: "«الكُسْب: ثُفل بزور القطن وغيره بعد عصرها.»"
          source: "المورد الحديث (2008)"
          addition: "يُعرِّف الكُسْب بالثُّفل صراحةً، مما يؤكّد ترادف اللفظين"

    - lemma: "كُسْبَة"
      confirm:
        - text: "«كُسْبَة — من (ك س ب) القطعة من الكسب بمعنى علف للحاشية يستخلص من ثقل بذر القطن بعد عصره.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«كُسَيْبَة — تصغير كسبة المرة من الربح، أو كسبة بمعنى علف للدواب يخرج من بذور القطن بعد عصرها.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "كُسْبَة اسم وحدة (القطعة الواحدة)، لا اسم جنس — فيُعبِّر عن القطعة لا المادة الإجمالية المطلوبة في تعريف المجموعة"

    - lemma: "حُثَالَةُ بِذْرِ القُطْنِ"
      evidence_status: "no_material_found"

    - lemma: "نُخَالَةُ بِذْرِ القُطْنِ"
      evidence_status: "no_material_found"


