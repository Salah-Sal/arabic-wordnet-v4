    - lemma: "ثُفْلُ القُطْنِ"
      source: stage1
      decision: confirmed
      decision_reason: "مركّب إضافي عربي أصيل من «ثُفْل» (ما يتبقّى بعد العصر) مع «القطن». النمط مسجّل في المعاجم الموحّدة: ثُفْل بذور الزيت، ثُفْل الزيتون، ثُفْل العنب. والمورد الحديث يُعرِّف الكُسْب بالثُّفل صراحةً. يُضاف كمرادف عربي صرف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مصطلح عربي أصيل يركّز على طبيعة المادّة بوصفها بقيّة وراسباً (من ثَفَلَ = رسب)، أعمّ دلالةً من كُسْب في الأصل لكنّه يتخصّص بإضافة القطن"
      actions:
        - command: create_entry
          params:
            lemma: "ثُفْلُ القُطْنِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "كُسْبَة"
      source: stage1
      decision: removed
      decision_reason: "كُسْبَة اسم وحدة يدلّ على القطعة الواحدة من الكُسْب، والمجموعة الترادفية تصف المادّة بوصفها اسم جنس لا قطعة مفردة. فضلاً عن ذلك، لا تخصّص القطن دون غيره من البذور الزيتية."

    - lemma: "حُثَالَةُ بِذْرِ القُطْنِ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعمال «حُثَالة» في سياق عصر البذور الزيتية. الحُثَالة في الاستعمال الغالب تدلّ على الرديء والساقط من كلّ شيء، وليست مصطلحاً زراعياً مسجّلاً."

    - lemma: "نُخَالَةُ بِذْرِ القُطْنِ"
      source: stage1
