# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-05271349-n (body substance)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مادة جسدية» مركب وصفي وصفيّ لا يبدو مصطلحاً مسكوكاً في المعاجم العربية"
      - "التعريف «مادة الجسم» شبه دائري مع اللمّة نفسها"
      - "المجموعة تحتوي على لمّة واحدة فقط مما يُفقر التغطية المعجمية"
    observations: "المفهوم يشير إلى كلّ مادة فيزيائية يتركّب منها جسم الكائن الحيّ، وهو مفهوم عامّ يندرج تحته الدم والعظم والنسيج والسوائل وغيرها. المرادف العربي الأمثل ينبغي أن يكون شاملاً لا مقصوراً على نوع واحد من المواد الجسمية. اللمّة الحالية ترجمة حرفية وصفية للمصطلح الإنجليزي body substance."
  blind_candidates:
    - lemma: "جِبِلَّة"
      generation_method: majaz
      justification: "لفظ عربي تراثي يدلّ على الخِلقة والطبيعة المجبول عليها الكائن، ووُظِّف في علم الأحياء الحديث بمعنى البروتوبلازم (المادة الحية الأساسية). توسيع دلالته ليشمل المادة الجسدية عامّة ممكن بالمجاز"
    - lemma: "مَادَّة بَدَنِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من مادّة + بدنية، يوازي مادة جسدية لكن باستعمال البَدَن الذي يخصّ الجسم المادي دون الروح"
    - lemma: "خِلْط"
      generation_method: majaz
      justification: "مصطلح طبي تراثي يدلّ على المادة الرطبة السيّالة في الجسم (الأخلاط الأربعة)، يمكن توسيعه مجازاً ليشمل كل مادة جسمية"
    - lemma: "جِرْم"
      generation_method: ishtiqaq
      justification: "من جذر ج ر م بمعنى الجسد والجسم، قال صاحب المقاييس: والجسد جرم لأنّ له قدراً وتقطيعاً. يمكن استعماله بمعنى المادة الجسمانية"

stage2_evidence:
  per_lemma:
    - lemma: "مَادَّة جَسَدِيَّة"
      evidence_status: "no_material_found"

    - lemma: "جِبِلَّة"
      confirm:
        - text: "«(الجبلة) الجبلة وَالْأمة وَالْجَمَاعَة من النَّاس و (فِي علم الْأَحْيَاء) مَادَّة شبه زلالية معقدة التَّرْكِيب الكيمياوي وتعد الأساس الطبيعي للحيوان والنبات (مج)»"
          source: "المعجم الوسيط"
        - text: "«جِبْلَة = protoplasm (bioplasm)»"
          source: "المعجم الطبي الموحد"
        - text: "«جِبْلَة: مجموعة المواد البروتينية التي تتكون منها الخلية وفيها تتم التفاعلات الحيوية»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
      contradicts:
        - text: "«جبلة = protoplasm» وهو مصطلح أخصّ من body substance"
          source: "المعجم الطبي الموحد"
          conflict: "الجبلة مصطلح مقصور على البروتوبلازم (المادة الحية الخلوية) وليس مرادفاً للمادة الجسدية العامة التي تشمل العظم والدم والسوائل"
      expands:
        - text: "«الجبلة: بالكسر والتشديد كالخليقة والغريزة الطبيعة. وجبله الله على كذا، فطره عليه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الدلالة الأصلية للجبلة هي الطبيعة والخلقة والفطرة، لا المادة الفيزيائية"

    - lemma: "مَادَّة بَدَنِيَّة"
      evidence_status: "no_material_found"

    - lemma: "خِلْط"
      contradicts:
        - text: "«الخلط: بالفتح وسكون اللام هو عند الأطباء جسم رطب سيّال يستحيل إليه الغذاء أولا ويسمّى كيموسا ورطوبة أولى»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الخلط مصطلح طبي مقصور على السوائل الجسمية (الأخلاط الأربعة) ولا يشمل المواد الصلبة كالعظم والنسيج"
      expands:
        - text: "«(الْخَلْط) مَا خالط الشَّيْء وَالشَّيْء يؤلف مَعَ أَشْيَاء أُخْرَى (ج) أخلاط»"
          source: "المعجم الوسيط"
          addition: "الدلالة العامة للخلط هي ما يُخالط غيره، وهي أوسع من الاستعمال الطبي"

    - lemma: "جِرْم"
      contradicts:
        - text: "«(الجرم) الْجَسَد (ج) أجرام وجروم»"
          source: "المعجم الوسيط"
          conflict: "الجِرم يدلّ على الجسد ذاته أو الجسم الفلكي، لا على مادة الجسد"
        - text: "«الجرم هو الجسم، إلّا أنّ أكثر استعماله في الأجسام الفلكية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المعنى الاصطلاحي للجرم هو الجسم لا المادة المكوّنة له"
      expands:
        - text: "«وَالْجَسَدُ جِرْمٌ، لِأَنَّ لَهُ قَدْرًا وَتَقْطِيعًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يربط الجرم بالجسد من جهة القدر والتقطيع لا من جهة المادة"

stage3_analysis:
  per_lemma:
    - lemma: "مَادَّة جَسَدِيَّة"
      decision: confirmed
      decision_reason: "رغم عدم ورود المركب في المعاجم التقليدية، فإنه ترجمة شفافة ودقيقة لمفهوم body substance. المركب الوصفي (مادّة + صفة نسبية) نمط إنتاجي معتمد في المصطلحية العربية الحديثة، والمفهوم عامّ بما يكفي لتبرير التعبير الوصفي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة جَسَدِيَّة"

    - lemma: "جِبِلَّة"
      source: stage1
      decision: removed
      decision_reason: "الجبلة مصطلح بيولوجي مقنّن بمعنى البروتوبلازم (المادة الحية داخل الخلية)، وهو أخصّ بكثير من مفهوم المادة الجسدية العامة. إدخالها سيُحدث التباساً مع المجموعة الترادفية للبروتوبلازم."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَادَّة بَدَنِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي مرادف لـ«مادة جسدية» لكنه لا يضيف تمايزاً دلالياً ولا ورد في المعاجم. إضافته تُحدث ترادفاً تامّاً دون مسوّغ."
      evidence_assessment:
        case: no_material

    - lemma: "خِلْط"
      source: stage1
      decision: removed
      decision_reason: "الخلط مصطلح طبي تراثي مقصور على السوائل الجسمية (الأخلاط الأربعة: الدم والبلغم والصفراء والسوداء)، فلا يشمل المواد الصلبة كالعظم والغضروف. إدخاله يُضيّق المفهوم تضييقاً مُخِلّاً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "جِرْم"
      source: stage1
      decision: removed
      decision_reason: "الجرم يدلّ على الجسم أو الجسد ذاته وليس على المادة التي يتكوّن منها. الفرق بين الجسم (body) ومادة الجسم (body substance) جوهري."
      evidence_assessment:
        case: contradicts_only

