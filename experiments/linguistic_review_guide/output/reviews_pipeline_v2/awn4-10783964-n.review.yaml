# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-10783964-n (walk-in)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «زَائِر دُونَ مَوْعِد» عبارة وصفية حرة وليست مصطلحاً مسكوكاً ثابتاً"
      - "المفرط العلوي (hypernym) هو «عامل/فاعل» أي شخص يعمل، والزائر دون موعد ليس بالضرورة عاملاً — فالعلاقة الفوقية غير دقيقة"
      - "المفهوم خاص بنظام المواعيد في البيئة الغربية (عيادات، مكاتب) وقد يمثّل فجوة معجمية في العربية"
    observations: "المفهوم يشير إلى شخص يَحضُر إلى مكان (عيادة، مكتب، مؤسسة) دون ترتيب مسبق أو حجز موعد. في الاستعمال الإنجليزي walk-in يُستخدم اسماً ووصفاً. في العربية لا يوجد مصطلح مفرد مقابل، بل يُعبَّر عنه بعبارة وصفية. وجَدَ المورد الحديث في ترجمة walk-in المعنى: «طارئ: آتٍ من غير موعد» مما يؤكد أن العربية تلجأ إلى الوصف لا إلى مصطلح مفرد."

  blind_candidates:
    - lemma: "طَارِق"
      generation_method: majaz
      justification: "الطارق في الأصل: الآتي ليلاً أو من يطرق الباب. يمكن توسيعه مجازياً ليشمل من يأتي دون ترتيب مسبق، إذ يشترك مع المفهوم في عنصر المفاجأة وعدم التوقع."
    - lemma: "وَافِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من وَفَدَ (قَدِمَ)، يدل على القادم من مكان آخر. الوافد يحمل دلالة الحضور والقدوم، وقد يُستعمل للدلالة على من يحضر إلى مكان دون سابق إنذار."
    - lemma: "مُرَاجِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رَاجَعَ، يُستعمل في العربية المعاصرة بمعنى الشخص الذي يراجع مؤسسة أو عيادة أو دائرة حكومية. شائع في الاستعمال الإداري والطبي."
    - lemma: "دَاخِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من دَخَلَ، يدل على من يدخل مكاناً. التعريف نفسه يستخدم «يدخل» فهذا الاسم أقرب اشتقاقياً إلى المفهوم."


stage2_evidence:
  per_lemma:
    - lemma: "زَائِر دُونَ مَوْعِد"
      evidence_status: "no_material_found"

    - lemma: "زَائِر"
      confirm:
        - text: "«visitor»"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm)"
        - text: "«visitor»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الزَّاءُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْمَيْلِ وَالْعُدُولِ... وَمِنَ الْبَابِ: الزَّائِرُ، لِأَنَّهُ إِذَا زَارَكَ فَقَدْ عَدَلَ عَنْ غَيْرِكَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الزيارة في العربية يدل على الميل والعدول إلى شخص بعينه، لا على الدخول العشوائي"

    - lemma: "طَارِق"
      contradicts:
        - text: "«الآتى ليلًا. النَّجمُ الثَّاقِبُ. الحادث, أو الحادث ليلًا»"
          source: "المعجم الوسيط"
          conflict: "الطارق مقيّد بالليل في الأصل، والمفهوم المطلوب لا يرتبط بوقت محدد"
        - text: "«الطَّاءُ وَالرَّاءُ وَالْقَافُ أَرْبَعَةُ أُصُولٍ، أَحَدُهَا: الْإِتْيَانُ مَسَاءً... فَالْأَوَّلُ الطُّرُوقُ. وَيُقَالُ إِنَّهُ إِتْيَانُ الْمَنْزِلِ لَيْلًا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "ابن فارس يؤكد أن الأصل هو الإتيان ليلاً"
      expands:
        - text: "«من الناس: الآتي ليلًا طلبًا للضيافة, أو الاسْتِغاثَة, ونحوهما»"
          source: "المعجم الكبير"
          addition: "الطارق يحمل دلالة طلب الضيافة أو الاستغاثة، وهي أخص من مجرد الحضور دون موعد"

    - lemma: "وَافِد"
      contradicts:
        - text: "«الْوَاوُ وَالْفَاءُ وَالدَّالُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِشْرَافٍ وَطُلُوعٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "أصل الوفادة يدل على الإشراف والطلوع والقدوم بقصد (الوفد: القوم يقصدون ذا سلطان)، لا على القدوم العشوائي دون موعد"
      expands:
        - text: "«صفة للأمراض التي تنشأ عن أسباب وافدة من مكان بعيد»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "الوافد في الاستعمال الطبي المعاصر يعني القادم من بعيد (ecdemic)، لا الحاضر دون موعد"

    - lemma: "مُرَاجِع"
      confirm:
        - text: "«client»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«صحفي محرِّر ذو خبرة في الكتابة يقوم بمراجعة المقالات وإعادة كتابتها إن اقتضى الحال»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          conflict: "المراجع في السياق الإعلامي يعني المحرر المُصحّح، وهو معنى مختلف تماماً"
        - text: "«من النِّساء: الرَّاجِعُ»"
          source: "المعجم الكبير"
          conflict: "المراجع في المعاجم الكلاسيكية لها معانٍ أخرى بعيدة عن المفهوم المطلوب"
      expands:
        - text: "«من (ر ج ع) من يرجع إلى غيره الأمر مشاورا إياه والمجادل غيره»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المراجع أصلاً من يرجع إلى غيره في أمر، وقد توسّع استعماله في العربية المعاصرة ليشمل من يزور مؤسسة"

    - lemma: "دَاخِل"
      evidence_status: "no_material_found"

    - lemma: "walk-in (English bridge)"
      confirm:
        - text: "«(3) طارئ: آتٍ من غير موعد walk-in patients (4) ثلّاجَة ضخمة أو حجرة تبريد كبيرة (5) انتصار سهل [في الانتخابات]»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) ضخم [إلى درجة تمكّن من السَّير فيه] walk-in refrigerator (2) مباشر: مُعَدّ بحيث يُدْخَل إليه مباشرةً لا من خلال رَدْهة walk-in apartment»"
          source: "المورد الحديث (2008)"
          addition: "المورد يُترجم walk-in بمعانٍ متعددة حسب السياق، والمعنى المطابق هو «طارئ: آتٍ من غير موعد»"


stage3_analysis:
  per_lemma:
    - lemma: "زَائِر دُونَ مَوْعِد"
      decision: confirmed
      decision_reason: "رغم أنها عبارة وصفية وليست مصطلحاً مسكوكاً، فإنها التعبير الأوضح والأدق عن المفهوم في العربية. المورد الحديث يستخدم صيغة مشابهة «آتٍ من غير موعد». لا يوجد بديل مفرد مقبول."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "التعبير الوحيد في المجموعة — يجمع بين مفهوم الزيارة وشرط انعدام الموعد المسبق بصورة صريحة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَائِرٌ دُونَ مَوْعِدٍ"

    - lemma: "طَارِق"
      source: stage1
      decision: removed
      decision_reason: "الطارق في المعاجم العربية مقيّد بالإتيان ليلاً، وأكّد ذلك ابن فارس والمعجم الوسيط والمعجم الكبير. المفهوم المطلوب لا يرتبط بوقت محدد. كما أن الطارق يحمل دلالة طلب الضيافة أو الاستغاثة، وهي أخص من المفهوم المطلوب."
      evidence_assessment:
        case: contradicts_only

    - lemma: "وَافِد"
      source: stage1
      decision: removed
      decision_reason: "الوافد يدل على القادم من مكان بعيد بقصد وغاية (وفد على الأمير)، وفي الاستعمال الطبي يعني القادم من بعيد (ecdemic). لا يتضمن دلالة انعدام الموعد المسبق."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُرَاجِع"
      source: stage1
      decision: removed
      decision_reason: "المراجع يدل على من يزور مؤسسة عموماً (سواء بموعد أو بدونه)، فهو أعم من المفهوم المطلوب. كما أن له اشتراكاً لفظياً مع المراجع بمعنى المصادر المرجعية والمحرر المصحح، مما يُضعف وضوحه."
      evidence_assessment:
        case: mixed

    - lemma: "دَاخِل"
      source: stage1
      decision: removed
      decision_reason: "اسم فاعل عام جداً يدل على كل من يدخل مكاناً، ولا يتضمن شرط انعدام الموعد. كما أنه يكرر مفردة من التعريف نفسه (يدخل)، فيقع في الدوران."
      evidence_assessment:
        case: no_material


