# مراجعة المجموعة الترادفية awn4-15056943-n — poison / toxicant
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «سم» بدون تشكيل — ينبغي أن تكون «سُمّ» بضمّ السين وتشديد الميم"
      - "اللمّة «مادة سامة» مركّب وصفي وصفيّ يكاد يكون عبارة حرّة لا مصطلحاً مسكوكاً، لكنه شائع في الاستعمال التقني"
      - "التعريف العربي يبدو ترجمة حرفية من الإنجليزية ويفتقر إلى أسلوب المعجم العربي"
    observations: "المفهوم أصيل في الثقافة العربية وله رصيد معجمي غزير. الجذر «سمم» هو الأصل الأول في الدلالة على المادة القاتلة، وتتفرّع منه ألفاظ عديدة (سُمّ، سُموم، سامّ، مسموم). في التراث ألفاظ أخرى تدلّ على أنواع خاصة من السموم كالذِّيفان (السمّ القاتل ذو الأصل الحيوي) والذُّعاف (السمّ الذي يقتل من ساعته) والحُمَة (سمّ ما يلدغ أو يلسع). التعريف الحالي مقبول في مضمونه لكنه يحتاج صياغة عربية أصيلة."

  blind_candidates:
    - lemma: "سُمّ"
      generation_method: ishtiqaq
      justification: "من الجذر «سمم»، الاسم العربي الأصيل للمادة القاتلة، على وزن فُعْل. ذكره ابن فارس في أصل الدلالة على المدخل في الشيء، وسُمّي السمّ لأنه يرفي الجسم ويداخله."
    - lemma: "ذِيفَان"
      generation_method: ishtiqaq
      justification: "من الجذر «ذيف»، لفظ عربي قديم يدلّ على السمّ القاتل. ذكره الفيروزابادي والمعجم الكبير. يُستعمل اليوم مصطلحاً طبياً مقابلاً لـ toxin."
    - lemma: "حُمَة"
      generation_method: majaz
      justification: "أصل الحُمَة في اللغة: إبرة العقرب والزنبور التي تلسع بها، ثم أُطلقت مجازاً على سمّ كلّ ما يلدغ أو يلسع. من الجذر «حمو» على وزن فُعَة."
    - lemma: "ذُعَاف"
      generation_method: ishtiqaq
      justification: "من الجذر «ذعف» على وزن فُعال. في المعاجم: السمّ القاتل، أو سمّ ساعة أي الذي يقتل من ساعته. لفظ تراثي ورد في شعر طرفة بن العبد وغيره."


stage2_evidence:
  per_lemma:
    - lemma: "سُمّ"
      confirm:
        - text: "«(السم) كل مَادَّة سامة»"
          source: "المعجم الوسيط"
        - text: "«كلُّ مادة سامَّة (والضَّمُّ أفصح) سمُّ الحيَّة, وهو قاتِلٌ»"
          source: "المعجم الكبير"
        - text: "«السَّمُّ: القاتِلُ، وجَمْعُه سِمَام»"
          source: "المحيط في اللغة للصاحب بن عبّاد"
        - text: "«السَّمُّ: الثَّقْبُ، وهذا القاتِلُ المَعْروفُ، ويُثَلَّثُ فيهما»"
          source: "القاموس المحيط للفيروزابادي"
        - text: "«السَُّمُّ الْقَاتِلُ، يُقَالُ فَتْحًا وَضَمًّا. وَسُمِّيَ بِذَلِكَ لِأَنَّهُ يَرفِي الْجِسْمِ وَيُدَاخِلُهُ، خِلَافَ غَيْرِهِ مِمَّا يُذَاقُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«سُمٌّ — مادة قاتلة أو ضارة للكائن الحيّ»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
      expands:
        - text: "«كل مادة سامة سُمُّ الفأر : دواء يُهلك الفار كلُّ ثقب ضيق كثقب الإبرة والأنف والأذن سموم الإنسان : سِماهُ»"
          source: "المعجم الوسيط"
          addition: "للسُّمّ معانٍ أخرى غير المادة القاتلة: الثقب الضيق، ومسامّ الجسد"
        - text: "«وَضَعَ السُّمَّ في الطعام — الصواب: يجوز فيه التثليث (السَّمّ والسُّمّ والسِّمّ) والضمُّ أفصح»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يجوز في السمّ ثلاث حركات والضمّ أفصح"

    - lemma: "مَادَّة سَامَّة"
      confirm:
        - text: "«مادة سامة — أي مادة كيميائية يمكن أن تشكل خطرا على الصحة أو البيئة»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "«مادة سامة — السموم»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
      expands:
        - text: "«toxic substance — substances, toxic (pl.)»"
          source: "المعجم الموحد لمصطلحات هندسة المياه"
          addition: "يُستعمل المركّب في المعاجم التقنية الحديثة مقابلاً لـ toxic substance"

    - lemma: "ذِيفَان"
      confirm:
        - text: "«الذَّيْفَانُ، ويُكْسَرُ ويُحَرَّكُ: السَّمُّ القاتِلُ، ولُغاتُها في ذَأفَ»"
          source: "القاموس المحيط للفيروزابادي"
        - text: "«السَّمُّ القاتل»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«ذيفان — مادة سامة للعضوية الحية من أصل حيويّ»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          conflict: "في الاستعمال الاصطلاحي الحديث ذِيفان = toxin (سمّ ذو أصل حيوي)، وهو أضيق من المفهوم العامّ poison الذي يشمل السموم الكيميائية والمعدنية"
        - text: "«الذيفان هو السم الذي يقوم كائن حي بإنتاجه»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
          conflict: "يؤكّد تخصيص الذيفان بالسمّ الحيوي المنشأ"

    - lemma: "حُمَة"
      confirm:
        - text: "«(الْحمة) سم كل شَيْء يلْدغ أَو يلسع والإبرة الَّتِي تضرب بهَا الْعَقْرَب والزنبور وَنَحْو ذَلِك»"
          source: "المعجم الوسيط"
        - text: "«السُّمُّ سُمُّ كُلِّ شيءٍ يَلْدَغُ أو يَلْسَعُ»"
          source: "المعجم الكبير (مادة حمو)"
        - text: "«سم كل شيء يلدغ أو يلسع كالعقرب والزنبور»"
          source: "كتاب العين للخليل بن أحمد"
      contradicts:
        - text: "«الْحمة: بِفَتْح الْحَاء وَالْمِيم سم الْعَقْرَب»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "الحُمَة مقصورة على سمّ ما يلدغ ويلسع (العقارب والزنابير)، لا تشمل السموم عموماً"

    - lemma: "ذُعَاف"
      confirm:
        - text: "«(الذعاف) السم يقتل من سَاعَته (ج) ذعف»"
          source: "المعجم الوسيط"
        - text: "«الذُّعافُ، كغُرابٍ: السَّمُّ، أو سَمُّ ساعةٍ»"
          source: "القاموس المحيط للفيروزابادي"
        - text: "«السُّمُّ القاتلُ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«السم يقتل من ساعته — موتٌ ذعافٌ : سريع»"
          source: "المعجم الوسيط"
          conflict: "الذُّعاف مخصوص بالسمّ سريع القتل (سمّ ساعة)، لا يشمل كل سمّ"


stage3_analysis:
  per_lemma:
    - lemma: "سُمّ"
      decision: confirmed
      decision_reason: "اللفظ العربي الأصيل الجامع للدلالة على المادة القاتلة أو الضارة. ثابت في جميع المعاجم الكلاسيكية والحديثة. الجذر «سمم» أصل في الدلالة على المدخل في الشيء، وسُمّي السمّ لمداخلته الجسمَ. يحتاج إضافة التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الاسم العربي الأعمّ والأشمل لكلّ مادة ضارّة أو قاتلة، سواء أكانت حيوانية أم نباتية أم كيميائية أم معدنية. يُستعمل في جميع السجلّات اللغوية من الشعر الجاهلي إلى الخطاب العلمي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُمّ"

    - lemma: "مَادَّة سَامَّة"
      decision: confirmed
      decision_reason: "مركّب وصفي ثابت في المعاجم التقنية الحديثة (الهندسة المدنية، تقانات الأغذية، هندسة المياه) مقابلاً لـ toxic substance / poisonous substance. وإن كان وصفياً في الأصل فقد اكتسب ثباتاً اصطلاحياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "مركّب وصفي تقني يُستعمل في السياقات العلمية والقانونية والبيئية، أكثر تحديداً من «سُمّ» المفرد. يُبرز الطبيعة المادية للسمّ (أنه مادة لا صفة أو فعل)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة سَامَّة"

    - lemma: "ذِيفَان"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ الذِّيفان في المعاجم الكلاسيكية يعني «السمّ القاتل» عموماً، فقد تخصّص في الاصطلاح العلمي الحديث ليدلّ على السمّ ذي الأصل الحيوي (toxin)، وهو أضيق من مفهوم poison/toxicant الذي يشمل السموم الكيميائية والمعدنية. إدراجه هنا يُحدث خلطاً اصطلاحياً."
      evidence_assessment:
        case: mixed

    - lemma: "حُمَة"
      source: stage1
      decision: removed
      decision_reason: "الحُمَة في المعاجم مخصوصة بسمّ ما يلدغ ويلسع من الحيوانات (العقارب والزنابير ونحوها)، وتُطلق أيضاً على الإبرة التي تلسع بها. فهي أقرب إلى مفهوم venom منها إلى poison العامّ. لا تشمل السموم الكيميائية أو النباتية."
      evidence_assessment:
        case: mixed

    - lemma: "ذُعَاف"
      source: stage1
      decision: removed
      decision_reason: "الذُّعاف مقيَّد بالسمّ الذي يقتل من ساعته (سمّ سريع المفعول). هو نوع من السمّ لا مرادف له. إدراجه في هذه المجموعة يُسوّي بين العامّ والخاصّ."
      evidence_assessment:
        case: mixed


