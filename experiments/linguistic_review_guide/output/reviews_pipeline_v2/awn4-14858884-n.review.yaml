# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14858884-n
# any substance that promotes digestion / أي مادة تعزز عملية الهضم
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «مساعد للهضم» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ (يمكن إبدال «مساعد» بـ«معين» أو «مُعاوِن» والمعنى لا يتغيّر)"
      - "اللمّة «مهضم» بلا تشكيل: لا يُعرف هل المقصود مُهَضِّم (باب التفعيل) أم مُهْضِم (باب الإفعال)"
      - "غياب المصطلح العربي الكلاسيكي «هاضوم» الثابت في المعجم الوسيط والصحاح"
    observations: "المفهوم له جذور عميقة في المعجمية العربية عبر الجذر «هـ ض م». المعاجم الكلاسيكية والحديثة توفر ألفاظاً دقيقة مثل هاضوم وهاضم ومُهَضِّم، ما يجعل العبارة الوصفية «مساعد للهضم» زائدة عن الحاجة. الجوهري في الصحاح يذكر الهاضوم صراحة ويربطه بالجوارش الفارسي."
  blind_candidates:
    - lemma: "هَاضُوم"
      generation_method: ishtiqaq
      justification: "من الجذر «هـ ض م» على وزن فَاعُول، وهو وزن منتج للمبالغة والثبوت في الصفات. يدلّ على ما شأنه هضم الطعام بقوة واستمرار."
    - lemma: "هَضُوم"
      generation_method: ishtiqaq
      justification: "من الجذر «هـ ض م» على وزن فَعُول، وزن القابلية والمبالغة. صيغة مرادفة للهاضوم تدلّ على ما يهضم."
    - lemma: "هَاضِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من هَضَمَ على وزن فَاعِل، يدلّ على المادة أو الدواء الذي يُحدث فعل الهضم. مصطلح طبي كلاسيكي."
    - lemma: "جَوَارِشْن"
      generation_method: taarib
      justification: "معرّب من الفارسية «گوارشن»، استعمله الأطباء العرب القدماء للدواء المركب المُقوّي للمعدة الهاضم للطعام."

stage2_evidence:
  per_lemma:
    - lemma: "مساعد للهضم"
      evidence_status: "no_material_found"

    - lemma: "مُهَضِّم"
      confirm:
        - text: "«مُهضِّم [مفرد]: شيء مساعد على الهَضم، خاصّ بعمل العصارات الهضميَّة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«هضَّم الدَّواءُ الطَّعامَ: ساعد على هَضْمه (إحالته إلى موادّ قابلة لأن يمتصَّها الجسم). دواء فاتح للشَّهية ومُهضِّم وطارد للغازات»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«(٣) مُهَضِّم؛ هاضوم»"
          source: "المورد الحديث (2008) — مدخل eupeptic"
      expands:
        - text: "«(١) مُهْضِم: مساعد على الهضم»"
          source: "المورد الحديث (2008) — مدخل peptic"
          addition: "يوجد شكل ثانٍ مُهْضِم (من أهضمَ باب الإفعال) بالمعنى ذاته"

    - lemma: "هَاضُوم"
      confirm:
        - text: "«كلُّ دواءٍ يَهْضِم الطَّعام»"
          source: "المعجم الوسيط"
        - text: "«كل مادة تهضم الطعام, كاللعاب والصَّفراء وغيرها من المواد السائلة, التي تُفرزها غُدَدٌ معيَّنة في الجهاز الهَضْمِي وتصبُّ في القناة الهَضْمِيَّة فَتَهْضِمُ عناصر الطعام المختلفة»"
          source: "المعجم الوسيط"
        - text: "«والهاضومُ: الذي يقال له الجوارِشُ، لأنَّه يهضِمُ الطعام»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«الهَضُوم؛ الهاضوم: مادّة مساعدة على الهضم»"
          source: "المورد الحديث (2008) — مدخل digestant"
      expands:
        - text: "«المُنْفِق لماله»"
          source: "المعجم الوسيط"
          addition: "معنًى مجازيّ ثانوي: من يُنفق ماله بسخاء، لا يتعارض مع الدلالة الطبية"

    - lemma: "هَضُوم"
      confirm:
        - text: "«(الهضوم) الهاضوم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (حوراماني)"
        - text: "«الهاضوم»"
          source: "المعجم الوسيط (OCR) — تعريف ١"
        - text: "«الهَضُوم؛ الهاضوم: مادّة مساعدة على الهضم»"
          source: "المورد الحديث (2008) — مدخل digestant"
      expands:
        - text: "«يقال: يَدٌ هَضُومٌ: تجود بما لديها ولا تُبقِي»"
          source: "المعجم الوسيط"
          addition: "استعمال مجازي لليد الكريمة"

    - lemma: "هَاضِم"
      confirm:
        - text: "«هَاضِم [مفرد]: ١- اسم فاعل من هضَمَ. ٢- (طب) دواء أو مادّة تحوّل الطعامَ في جهاز الهضم إلى مادة صالحة لأن يتمثَّلها الجسم»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«(أ) صفة لما يساعد أو ينبه الهضم. (ب) عقار أو عامل يساعد على الهضم»"
          source: "معجم المصطلحات الطبية (ج.2، 2003) — مدخل digestant"
        - text: "«الهَاضِم: مَا يُفِيد الْغذَاء سرعَة إنضاج»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«هو عند الأطباء دواء يفيد الغذاء سرعة إنضاج عند فعل الحرارة الغريزية فيه كما في الموجز»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«الْهَاضِمُ: ما فيه رخاوة ولين»"
          source: "المعجم الوسيط"
          conflict: "الوسيط يعطي الهاضم معنًى غير طبّي: ما فيه رخاوة ولين، وهو مختلف تماماً عن الدلالة الطبية"

    - lemma: "جَوَارِشْن"
      confirm:
        - text: "«نوع من الأدْوِيَةِ المُرَكَّبَة, يُقَوِّى المَعِدة, ويَهْضِمُ الطَّعام»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«نوع من الأدوية المركبة»"
          source: "المعجم الكبير"
          conflict: "الجوارشن صنف محدد من الأدوية المركبة وليس أيّ مادة هاضمة عامة — أخصّ من المفهوم المطلوب"

stage3_analysis:
  per_lemma:
    # ── existing lemmas ──
    - lemma: "مساعد للهضم"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل في اختبار السكّ: يمكن إبدال «مساعد» بـ«معين/مُعاوِن» ولا يتغير المعنى. ليست وحدة معجمية ثابتة، ولا تُسجَّل في المعاجم مدخلاً مستقلاً. لا حاجة لها مع وجود مصطلحات مسكوكة كهاضوم ومُهَضِّم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُهَضِّم"
      decision: confirmed
      decision_reason: "اسم فاعل من هَضَّمَ (باب التفعيل) بمعنى ما يُعين على الهضم. مثبت في معجم اللغة العربية المعاصرة ومعجم المورد الحديث. اللمّة الأصلية بلا تشكيل تحتاج تحديث التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مُهَضِّم يركّز على الفاعلية والتأثير (ما يُحدث الهضم فعلاً)، ويُستعمل في السياق الطبي الحديث صفةً ومصطلحاً للعقاقير والأدوية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُهَضِّم"

    # ── Stage 1 candidates ──
    - lemma: "هَاضُوم"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل مثبت في المعجم الوسيط وصحاح الجوهري ومعجم اللغة العربية المعاصرة. تعريفه في الوسيط: «كل دواء يهضم الطعام» و«كل مادة تهضم الطعام» — مطابقة تامة للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "هاضوم هو المصطلح الكلاسيكي الشامل الذي يغطي الأدوية والمواد الطبيعية معاً، على وزن فاعول الدال على الثبوت والمبالغة في الوصف"
      actions:
        - command: create_entry
          params: {lemma: "هَاضُوم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "هَضُوم"
      source: stage1
      decision: removed
      decision_reason: "الوسيط يعرّفه بأنه مرادف تام للهاضوم دون فارق دلالي واضح، وله معنًى مجازي ثانٍ (اليد الكريمة) يُشوّش الدلالة. إدراجه مع وجود الهاضوم يخلق ترادفاً مطلقاً غير مبرّر."

    - lemma: "هَاضِم"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح طبي كلاسيكي ثابت منذ السيوطي والتهانوي، ومُثبت في معجم اللغة العربية المعاصرة ومعجم المصطلحات الطبية. تعريفه: «دواء أو مادة تحوّل الطعام إلى مادة صالحة لأن يتمثّلها الجسم». المعنى غير الطبي في الوسيط (ما فيه رخاوة) لا يمنع الاستعمال الطبي المُثبت."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "هاضِم يُستعمل في التراث الطبي العربي الكلاسيكي (السيوطي، التهانوي) بمعنى الدواء الذي يُسرّع إنضاج الغذاء، ويُركّز على الفعل المباشر (اسم فاعل) لا على الاستمرارية كالهاضوم"
      actions:
        - command: create_entry
          params: {lemma: "هَاضِم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "جَوَارِشْن"
      source: stage1
      decision: removed
      decision_reason: "الجوارشن صنف محدد من الأدوية المركبة المُقوّية للمعدة — أخصّ من مفهوم المجموعة العام «أيّ مادة تعزز الهضم». إدراجه يُضيّق الدلالة بما لا يتناسب مع تعريف المجموعة."

