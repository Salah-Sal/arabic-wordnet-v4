# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14949336-n (gel / jelly substance)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (جل، هلام) بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "التعريف العربي يذكر «الهلام» و«الجيلاتين» وهما من مفردات التعريف نفسه، مما قد يوحي بدورية جزئية"
      - "اللمّة «جل» معرَّبة من الإنجليزية gel وقد تلتبس بالجذر العربي جلل (عَظُمَ)"
    observations: >
      المجموعة تصف مفهوم المادة ذات القوام الهلامي (gel) وهو مفهوم علمي حديث.
      المصطلح «هلام» مستقرّ في المعاجم العربية الحديثة ومعتمد من مجامع اللغة.
      المصطلح «جل» تعريب مباشر للإنجليزية gel وشائع في الاستعمال العلمي المعاصر.
      المفهوم العلمي للهلام (مادة غروانية شبه صلبة) يختلف عن المعنى القديم
      للهلام (مرق السِّكباج المبرَّد).
  blind_candidates:
    - lemma: "جَلّ"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الإنجليزي gel على وزن فَعْل، معتمد في المعاجم
        الموحدة (الجيولوجيا، الزلازل، تقانات الأغذية)
    - lemma: "هُلَامَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر هـ ل م على وزن فُعَالَة، وهو وزن يدل على الوحدة أو
        الكتلة من المادة، مستعمل في معجم النفط وغيره كمرادف للهلام
    - lemma: "غِرَاء"
      generation_method: majaz
      justification: >
        إزاحة دلالية من الغراء (المادة اللاصقة اللزجة) إلى المادة الهلامية،
        بجامع القوام اللزج وشبه الصلب. وردت في موسوعة الكهرباء مقابلاً لـ gel
    - lemma: "مُتَخَثِّرَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر خ ث ر (تخثّر) على وزن اسم الفاعل المؤنث، يشير إلى
        المادة التي انتقلت من الحالة السائلة إلى شبه الصلبة

stage2_evidence:
  per_lemma:
    - lemma: "جَلّ"
      confirm:
        - text: "«جَلٌّ: مادة غَرَوانية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«جل» (مقابل gel)"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«هُلام، جَلٌّ: مادة ذات قوام شبه صلب وتتكون من ماء وجلاتين أو ماء وبكتين وسكر وحامض أو من مكونات أخرى»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«الجَلّ: مادة هُلامية القوام أو جامدة تتشكَّل من محلولٍ غَرَوانيّ»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الجَلَّ: ما تغطى به الدابة لتصان، وشراع السفينة، وقصب الزرع وسوقه إذا حصد عنه السنبل»"
          source: "المعجم الوسيط"
          conflict: "الجذر جلل في العربية الفصحى له معانٍ مختلفة تماماً (العظمة، غطاء الدابة)، واستعمال «جل» بمعنى gel هو تعريب حديث لا علاقة له بالجذر الأصلي"
    - lemma: "هُلَام"
      confirm:
        - text: "«الهُلَام: مرق السِّكباج المبرَّد المصفَّى من الدُّهن، ومادة بروتينية شفافة تستخرج من الأنسجة الحيوانية المختلفة مثل الجلد والعظم والأربطة، وتكون جامدة عند جفافها ولكنها تتحول إلى سائل بالرطوبة (مو)»"
          source: "المعجم الوسيط"
        - text: "«هلام» (مقابل gelatin)"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«هلام» (مقابل jelly)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«هُلَام: مادة غروية شفافة، تستخدم مع أملاح الفضة في طلاء الأفلام والأوراق الحساسة»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
        - text: "«هُلاَم (قِوَام): شكل صيدلاني نصف صلب تقريباً شفاف عادة وله عدة استعمالات»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      expands:
        - text: "«الهُلاميّة: حلوى رجراجة القَوام تُعَدّ بغلي السُّكَّر وعصير الفاكهة. بديلٌ للهُلاميّة شبيهٌ بها من حيث القوام أو الكثافة»"
          source: "المورد الحديث (2008)"
          addition: "توسيع الدلالة لتشمل المنتجات الغذائية الهلامية"
    - lemma: "هُلَامَة"
      confirm:
        - text: "«هُلامة، هُلام» (مقابل gel)"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«هُلامة، مُرَهِّم» (مقابل gel)"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«هلامة، جيل» (مقابل gel)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "غِرَاء"
      confirm:
        - text: "«غراء (إسم)» (مقابل gel, noun)"
          source: "موسوعة الكهرباء (IEC 60050)"
      contradicts:
        - text: "«غراء» (مقابل colloid)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "في معظم المعاجم العلمية، الغراء يُقابل colloid لا gel، وهناك فرق جوهري بين المفهومين"
    - lemma: "مُتَخَثِّرَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "هُلَام"
      decision: confirmed
      decision_reason: >
        مصطلح راسخ في المعجم الوسيط ومعتمد في عشرات المعاجم الموحدة
        (الكيمياء، الأحياء، الصيدلة، الطب، الأغذية، الجيولوجيا).
        جذره عربي (هلم) وإن كان أصل الاستعمال بهذا المعنى مولّداً.
        هو المصطلح الأوسع تداولاً والأكثر قبولاً في المجامع اللغوية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        هُلَام هو المصطلح العام الشامل الذي يُطلق على المادة الهلامية بجميع
        أنواعها (غذائية، صيدلانية، كيميائية)، وهو المفضّل في الاستعمال الرسمي
        والأكاديمي
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُلَام"

    - lemma: "جَلّ"
      decision: confirmed
      decision_reason: >
        تعريب معتمد في المعاجم الموحدة (الجيولوجيا، الزلازل، تقانات الأغذية)
        والمورد الحديث. رغم التباسه مع الجذر العربي جلل، فإنه مستقرّ في
        الاستعمال العلمي المعاصر وأقرب إلى المصطلح الدولي gel.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        جَلّ تعريب تقني مباشر يُستعمل في السياقات العلمية والتقنية المتخصصة
        (الكيمياء، الصيدلة، مستحضرات التجميل)، أقرب إلى المصطلح الدولي gel
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَلّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "هُلَامَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورودها في بعض المعاجم الموحدة (النفط، الطب البيطري، الكيمياء)
        كمرادف للهلام، إلا أنها لا تضيف تمييزاً دلالياً واضحاً عن «هُلَام».
        الصيغة بالتاء (فُعَالَة) توحي بالوحدة أو الكمية المحددة، لكن هذا
        التمييز غير مستقر في الاستعمال الفعلي. إضافتها ستخلق ترادفاً مطلقاً
        غير مرغوب.

    - lemma: "غِرَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الغراء في معظم المعاجم العلمية يُقابل colloid (المادة الغروانية)
        لا gel. وجوده في موسوعة الكهرباء وحدها لا يكفي لاعتماده، خاصة
        أنه يخلق التباساً مع مفهوم الغراء (اللاصق) والغرواني (colloid).

    - lemma: "مُتَخَثِّرَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أي أدلة معجمية تدعم استعمال هذا المصطلح بمعنى الهلام أو الجلّ.
        التخثّر (coagulation) مفهوم مختلف عن التهلّم (gelation)، فالتخثّر
        يشير إلى تجمّع الجسيمات وترسّبها بينما الهلام شبكة ثلاثية الأبعاد
        متماسكة تحتجز السائل.

