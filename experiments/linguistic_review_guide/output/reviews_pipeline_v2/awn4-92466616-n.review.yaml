# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92466616-n
# مادة مسببة للعُدّ (حب الشباب) — Comedogenic substance
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان عبارتان وصفيتان حُرّتان وليستا مصطلحتين مسكوكتين؛ تخفقان في اختبار السكّ (يمكن إبدال «سادة» بـ«حاجبة» أو «مغلقة» والعبارة تظل صالحة)"
      - "استعمال «الزيوان» غير معياري طبّياً؛ المصطلح المعتمد في المعجم الطبي الموحد هو «الزُّؤان» (comedone)"
      - "لا يوجد تمييز دلالي حقيقي بين اللمّتين الحاليتين: كلتاهما تصف المادة المسبّبة لحب الشباب بأسلوب مختلف دون إضافة فارق معنوي"
    observations: "المفهوم طبّي تخصصي (comedogenic substance)، ويوجد له تعبير معجمي معتمد في المعجم الطبي الموحد: «زُؤانِيّ» (comedogenic) و«مُحْدِثُ العُدّ» (acnegenic). كذلك يوجد في التراث العربي الجذر «بثر» الذي يدلّ على الخراج الصغير، ومنه اشتُقّ «مُبَثِّرَة» في النصوص الطبية القديمة (ابن البيطار). اللمّتان الحاليتان تفتقران إلى التثبيت المعجمي وتحتاجان إلى استبدال بمصطلحات مسكوكة."

  blind_candidates:
    - lemma: "مُبَثِّرَة"
      generation_method: ishtiqaq
      justification: "من الجذر «بثر» على وزن مُفَعِّلة (اسم فاعل مُكثَّر)، بمعنى المادة التي تُبَثِّر الجلد أي تُخرج فيه البثور. الوزن يناسب الدلالة على العامل المُسبِّب، وللّفظ شاهد في كتاب ابن البيطار."
    - lemma: "مُحْدِثَةُ العُدِّ"
      generation_method: tarkib
      justification: "مركب إضافي من «مُحْدِثة» (اسم فاعل من أحدث) و«العُدّ» (المصطلح الطبي المعتمد لحب الشباب في المعجم الوسيط والمعجم الطبي الموحد). تركيب اصطلاحي ثابت يقابل المصطلح الإنجليزي acnegenic."
    - lemma: "مَادَّة زُؤَانِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «مادة» و«زؤانية» (نسبة إلى الزُّؤان = comedone). الصفة «زؤاني» مثبتة في المعجم الطبي الموحد بمعنى comedogenic."
    - lemma: "كُومِيدُوجِين"
      generation_method: taarib
      justification: "تعريب للمصطلح الإنجليزي comedogen. يقبل لام التعريف (الكوميدوجين) والنسبة (كوميدوجيني) والجمع السالم (كوميدوجينات). ملاذ أخير لعدم وجود مقابل عربي أصيل أفضل."


stage2_evidence:
  per_lemma:
    - lemma: "مادة سادة للمسام"
      evidence_status: "no_material_found"

    - lemma: "مادة مسببة للزيوان"
      evidence_status: "no_material_found"

    - lemma: "مُبَثِّرَة"
      confirm:
        - text: "«بثّر بالتشديد: ولّد البثر وهو الخراج الصغير، ففي ابن البيطار (1: 145) مبثرة للفم أي تسبب خروج البثور في الفم، وفي ص146 منه: مبثر للفم بكثرة حلاوته.»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
      expands:
        - text: "«(بَثَرَ) الْبَاءُ وَالثَّاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ انْقِطَاعُ الشَّيْءِ مَعَ دَوَامٍ وَسُهُولَةٍ وَكَثْرَةٍ. قَالَ الْخَلِيلُ: بَثَرَ جِلْدُهُ تَنَفَّطَ. قَالَ الْخَلِيلُ: الْبَثْرُ خُرَّاجٌ صِغَارٌ، الْوَاحِدَةُ بَثْرَةٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «بثر» أصل واحد يدلّ على الخراج الصغير، مما يؤكد ملاءمة المشتقة «مُبَثِّرة» للدلالة على المادة المسببة للبثور"
        - text: "«(بثر) جلده بثرا ظهر به بثر فهو بثر»"
          source: "المعجم الوسيط"
          addition: "تأكيد الفعل الثلاثي وإمكانية الاشتقاق منه"
        - text: "«(1) أو: مُبَثَّر: مَكْسُوٌّ بالبثور (2) يُبَثِّر: يجعلُهُ متبثِّرًا (3) يبثِّر: يُصبح ذا بثور.»"
          source: "المورد الحديث (2008)"
          addition: "تأكيد الفعل «بثّر» المضعّف واسم المفعول والفاعل منه"

    - lemma: "مُحْدِثَةُ العُدِّ"
      confirm:
        - text: "«مُحْدِثُ العُدّ»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«العَدُّ: بَثْرٌ يظهر فى الوجه (فى الطب): طفحٌ بَثْرِيٌّ ينشأُ عن التهاب غُدَد الدهن مع تجمع الإفرزات, وهو حبُّ الشباب»"
          source: "المعجم الوسيط"
      expands:
        - text: "«عُدٌّ (أكْنة): مرض جلدي مزمن يصيب الغدد الدهنية (الزهمية) ولا سيما غدد الوجه والظهر والصدر، ويوّلد حبيبات حُمراً قد تتوسطها نقط سود أو يوّلد بثوراً أو درينات.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "تعريف مفصّل للعُدّ يؤكد مطابقته لمفهوم حب الشباب"

    - lemma: "مَادَّة زُؤَانِيَّة"
      confirm:
        - text: "«زُؤانِيُّ = comedogenic»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«الزُّؤَان: حب أسود مستدير يخالط القمح, فيكسبه رداءة»"
          source: "المعجم الكبير"
          conflict: "الزؤان في الأصل نبات يخالط القمح (tares/darnel)، واستعماله الطبي بمعنى comedone توسّع دلالي حديث قد يُلبس"
      expands:
        - text: "«(الزؤان) عشب ينبت بين أعواد الحنطة غالبا حبه كحبها إلا أنه أسود وأصفر وهو يخالط البر فيكسبه رداءة»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي للزؤان نباتي، والاستعمال الطبي مجازي"

    - lemma: "كُومِيدُوجِين"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "مادة سادة للمسام"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً مسكوكاً. تخفق في اختبار السكّ: يمكن قول «مادة حاجبة للمسام» أو «مادة مغلقة للمسام» بالمعنى نفسه. لم تُعثر لها على أي شاهد معجمي. فوق ذلك، وصف «سدّ المسام» يشير إلى آلية واحدة فقط من آليات الإحداث للعُدّ، فلا يشمل المفهوم كاملاً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مادة مسببة للزيوان"
      decision: removed
      decision_reason: "عبارة وصفية حرة غير مسكوكة. «الزيوان» صيغة غير معيارية لا ترد في المعاجم الطبية العربية المعتمدة؛ المصطلح المعتمد هو «الزُّؤان» (comedone). فوق ذلك، التعبير يخفق في اختبار السكّ: يمكن إبدال «مسببة» بـ«مولّدة» أو «محدثة» دون تغيّر المعنى."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُبَثِّرَة"
      source: stage1
      decision: confirmed
      decision_reason: "مشتقة من الجذر «بثر» على وزن مُفَعِّلة، وهي مثبتة في تكملة المعاجم العربية نقلاً عن ابن البيطار بمعنى «المادة التي تسبب خروج البثور». الوزن مناسب دلالياً (اسم فاعل مكثَّر يدلّ على العامل المُسبِّب)، والجذر عربي أصيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على المادة المسببة للبثور عموماً (أوسع من العدّ تحديداً)، وتحمل ظلالاً تراثية من الطب العربي القديم"
      actions:
        - command: create_entry
          params:
            lemma: "مُبَثِّرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُحْدِثُ العُدِّ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب إضافي مثبت في المعجم الطبي الموحد (2009) مقابلاً لـ acnegenic. المكوّن «العُدّ» مصطلح طبي معتمد لحب الشباب في المعجم الوسيط والمعاجم الطبية. التركيب وحدة معجمية ثابتة لا تقبل الإبدال الحر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مصطلح طبي حديث يدلّ تحديداً على المسبِّب للعُدّ (حب الشباب)، وهو أدقّ من «مبثِّرة» وأكثر تخصصاً في سياق الأمراض الجلدية"
      actions:
        - command: create_entry
          params:
            lemma: "مُحْدِثُ العُدِّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَادَّة زُؤَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم أن الصفة «زؤاني» مثبتة في المعجم الطبي الموحد بمعنى comedogenic، إلا أن المركب «مادة زؤانية» ليس وحدة معجمية ثابتة مسجلة. يخفق في اختبار السكّ: يمكن قول «مادة مولِّدة للزُّؤان» بالمعنى نفسه. فوق ذلك، «الزؤان» أصلاً نبات يخالط القمح، واستعماله الطبي قد يُلبس."

    - lemma: "كُومِيدُوجِين"
      source: stage1
      decision: removed
      decision_reason: "تعريب غير ضروري في وجود مقابلين عربيين أصيلين مثبتين معجمياً (مُبَثِّرة، مُحْدِث العُدّ). قاعدة إيثار العربي تمنع اللجوء إلى التعريب إلا عند انعدام البديل."


stage4_content:
