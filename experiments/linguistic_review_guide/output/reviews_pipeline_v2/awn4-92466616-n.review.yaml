      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية (tends to produce)، ويفتقر إلى الأسلوب المعجمي العربي. يستعمل «حب الشباب» العامّي بدلاً من المصطلح الطبي «العُدّ». الصياغة «تميل لإنتاج» ركيكة."
