# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10783546-n
# waker — شخص يستيقظ
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «شخص يستيقظ» شبه دائري مع اللمّة مُسْتَيْقِظ؛ يكاد يكون إعادة صياغة للاسم"
      - "المجموعة تحتوي على لمّة واحدة فقط؛ يمكن إثراؤها بمرادفات قريبة"
      - "الجنس الأعلى (عامل/فاعل = شخص يعمل وينجز) ليس الأدقّ لمفهوم المستيقظ"
    observations: "المفهوم بسيط ومباشر: شخص انتبه من نومه. الجذر «يقظ» غزير الاشتقاق في العربية ويوفّر عدة صيغ صالحة. اللمّة الحالية مُسْتَيْقِظ هي اسم فاعل من الفعل الخماسي «استيقظ» (باب الاستفعال) وهي الصيغة الأكثر تداولاً للدلالة على من صحا من نومه."
  blind_candidates:
    - lemma: "يَقْظَانُ"
      generation_method: ishtiqaq
      justification: "صفة مشبّهة على وزن فَعْلان من الجذر «يقظ»، تدلّ على من صحا من نومه، وهي الصيغة الأشهر في الاستعمال القرآني والأدبي: {وَتَحْسَبُهُمْ أَيْقَاظاً وَهُمْ رُقُودٌ}"
    - lemma: "يَقِظٌ"
      generation_method: ishtiqaq
      justification: "صفة على وزن فَعِل من «يقظ»، تدلّ على المنتبه الفطن الذي لا يغفل، وردت في المعاجم بمعنى المتيقّظ الحذر"
    - lemma: "صَاحٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «صحا يصحو» من الجذر «صحو»، يدلّ على من أفاق من نوم أو سُكر، فالصحو نقيض السُّكر والنوم"
    - lemma: "مُتَيَقِّظٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «تيقّظ» (باب التفعّل) من الجذر «يقظ»، يدلّ على من تنبّه وانتبه من نومه أو غفلته"

stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَيْقِظ"
      confirm:
        - text: "«استيقظ الشَّخصُ: صَحَا وفاق من نومه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«اليَقَظَة: نقيض النوم. وقد استَيْقَظَ وأيقظه واستيقظه»"
          source: "المحكم والمحيط الأعظم لابن سيده"
        - text: "«الْيَقَظَةُ بِفَتْحَتَيْنِ لَا غَيْرُ خِلَافُ النَّوْمِ وَأَيْقَظَ الْوَسْنَانَ نَبَّهَهُ يُوقِظُهُ إيقَاظًا فَاسْتَيْقَظَ اسْتِيقَاظًا»"
          source: "المغرب في ترتيب المعرب للمُطَرِّزي"
      expands:
        - text: "«استيقظ الشَّخصُ للأمر: تيقَّظ وتنبّه. استيقظت ذِكرياتُه: تجدّدت، عادت إلى الظهور»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "للفعل استيقظ استعمال مجازي يتعدّى الصحو الحسّي إلى التنبّه الذهني"

    - lemma: "يَقْظَانُ"
      confirm:
        - text: "«أيْقَظْتُهُ من نومه أي نبَّهته فَتَيَقَّظَ واسْتَيْقَظَ فهو يقظان»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«رَجُلٌ يَقْظَانٌ مِثْلُ سَكْرَانَ ج: أَيْقَاظٌ»"
          source: "تاج العروس لمرتضى الزبيدي"
        - text: "«(1) يَقْظان (2) يَقِظ؛ حَذِر»"
          source: "المورد الحديث (2008) — wide-awake"
      expands:
        - text: "«يقِظَ الشَّخصُ: صحَا عكسه نام. فطِن وتنبَّه وأخذ حذره»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يَقْظَان يجمع بين المعنى الحسّي (الصحو من النوم) والمعنى المجازي (الحذر والفطنة)"

    - lemma: "يَقِظٌ"
      confirm:
        - text: "«يَقِظ»"
          source: "المعجم الطبي الموحد (2009) — alert"
        - text: "«يَقِظ»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — awake"
      contradicts:
        - text: "«رجل يقِظ: ذكىٌّ فطن نبيه»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الغالبة في المعاجم التراثية للفظ «يَقِظ» هي الذكاء والفطنة والحذر كصفة ثابتة، لا مجرد الصحو من النوم"
        - text: "«رجلٌ يَقِظٌ ويَقُظٌ أي متيقّظٌ حذرٌ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          conflict: "التعريف بالحذر والتيقّظ المستمر يختلف عن مفهوم الشخص الذي يستيقظ (حدث آنيّ)"

    - lemma: "صَاحٍ"
      confirm:
        - text: "«صَاحِي من (ص ح و) المستيقظ المنتبه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«الصاحي: ضد سكران والصحو خلاف السُكر»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الدلالة الأولى لـ«صاحٍ» هي الإفاقة من السُّكر لا من النوم"
      expands:
        - text: "«الصَّادُ وَالْحَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْكِشَافِ شَيْءٍ. مِنْ ذَلِكَ الصَّحْوُ خِلَافُ السُّكْرِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «صحو» يدور حول الانكشاف والزوال عموماً لا خصوص الصحو من النوم"

    - lemma: "مُتَيَقِّظٌ"
      confirm:
        - text: "«تيقَّظ الشَّخصُ: استيقظ، صحا من نومه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«تيقَّظ الشَّخصُ للأمرِ: تنبَّه له وأفاق»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "الدلالة الغالبة للتيقّظ هي التنبّه للأمور والحذر أكثر من مجرد الصحو من النوم"

stage3_analysis:
  per_lemma:
    - lemma: "مُسْتَيْقِظٌ"
      decision: confirmed
      decision_reason: "اسم فاعل من «استيقظ» وهو الصيغة الأدقّ للدلالة على من صحا من نومه؛ الاشتقاق منتظم وشفّاف، والفعل «استيقظ» هو الأكثر تداولاً في هذا المعنى في العربية المعاصرة والتراثية على السواء"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ تحديداً على من انتبه من نومه (حدث آنيّ)، بخلاف يَقْظَان الذي يصف حالة الصحو المستمرة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَيْقِظٌ"

    - lemma: "يَقْظَانُ"
      source: stage1
      decision: confirmed
      decision_reason: "صفة مشبّهة على وزن فَعْلان وردت في القرآن الكريم وجميع المعاجم الكبرى بمعنى من صحا من نومه؛ تكمّل اللمّة الأولى بدلالتها على حالة اليقظة المستمرة بعد الصحو"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يصف حالة اليقظة القائمة (صفة ثابتة أو مؤقتة) بخلاف مُسْتَيْقِظ الذي يركّز على لحظة الانتقال من النوم إلى الصحو"
      actions:
        - command: create_entry
          params: {lemma: "يَقْظَانُ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "يَقِظٌ"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الغالبة في المعاجم التراثية هي الذكاء والفطنة والحذر كصفة طبعية ثابتة، وليس مجرد الصحو من النوم. الاستعمال الطبّي الحديث بمعنى awake لا يكفي لتثبيته في هذه المجموعة التي تخصّ الشخص الذي يستيقظ (حدث)"
      evidence_assessment:
        case: mixed

    - lemma: "صَاحٍ"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الأصلية لـ«صاحٍ» هي الإفاقة من السُّكر لا من النوم، والجذر «صحو» يدور حول الانكشاف عموماً؛ استعماله بمعنى المستيقظ من النوم محدود ولا يناسب هذه المجموعة تحديداً"
      evidence_assessment:
        case: mixed

    - lemma: "مُتَيَقِّظٌ"
      source: stage1
      decision: removed
      decision_reason: "مع أنّ «تيقّظ» يمكن أن يعني الصحو من النوم، فإنّ الدلالة الغالبة هي التنبّه والحذر والفطنة للأمور، وهو أقرب إلى مفهوم اليقظة الذهنية منه إلى الصحو الحسّي من النوم"
      evidence_assessment:
        case: mixed

