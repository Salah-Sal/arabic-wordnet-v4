            type: usage
          - text: "﴿فَأَمَّا ثَمُودُ فَأُهْلِكُوا بِالطَّاغِيَةِ﴾"
            type: quran
            source: "سورة الحاقة، الآية ٥"
      - lemma: "مُسْتَبِدّ"
        examples:
          - text: "أَدانَ المُجْتَمَعُ الدَّوْلِيُّ تَصَرُّفاتِ الحاكمِ المُسْتَبِدِّ الذي صادَرَ حُرِّيّاتِ المُواطِنِينَ."
            type: usage
