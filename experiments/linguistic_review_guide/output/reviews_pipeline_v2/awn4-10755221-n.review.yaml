# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10755221-n (tyrant)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي عام جداً («أي شخص يمارس السلطة بطريقة قاسية») ولا يحصر المفهوم في السلطة السياسية أو الحكم"
      - "الأب القريب (hypernym) هو «عامل/فاعل» (شخص يعمل ويُنجِز الأمور) وهو بعيد دلالياً عن مفهوم الطاغية؛ الأنسب أن يكون الأب «حاكم» أو «متسلّط»"
    observations: >-
      المفهوم راسخ في الثقافة العربية الإسلامية، ورد في القرآن الكريم (﴿فَأَمَّا ثَمُودُ فَأُهْلِكُوا بِالطَّاغِيَةِ﴾)
      وفي الشعر الجاهلي والإسلامي. اللمّتان الموجودتان (طاغية، مستبدّ) تمثّلان الاستعمال الفصيح المعاصر
      والتراثي، وتغطيان طيفاً دلالياً مناسباً: الأولى أدبية تراثية والثانية سياسية حديثة.
  blind_candidates:
    - lemma: "جَبَّار"
      generation_method: ishtiqaq
      justification: >-
        من جذر «جبر» على وزن فَعَّال للمبالغة، يدلّ على القاهر المتسلّط العاتي.
        ورد في القرآن: ﴿وَإِذَا بَطَشْتُمْ بَطَشْتُمْ جَبَّارِينَ﴾.
    - lemma: "غَاشِم"
      generation_method: ishtiqaq
      justification: >-
        من جذر «غشم» على وزن فَاعِل، يدلّ على من يظلم ويأخذ الشيء قسراً بلا تمييز.
        مستعمل في الفصحى المعاصرة بمعنى الحاكم الظالم.
    - lemma: "ظَلُوم"
      generation_method: ishtiqaq
      justification: >-
        من جذر «ظلم» على وزن فَعُول للمبالغة، يدلّ على كثير الظلم.
        ورد في القرآن: ﴿إِنَّ الْإِنسَانَ لَظَلُومٌ كَفَّارٌ﴾.
    - lemma: "بَاغٍ"
      generation_method: ishtiqaq
      justification: >-
        من جذر «بغي» على وزن فَاعِل، يدلّ على الظالم المتجاوز للحدّ.
        ورد في المعجم الوسيط: «الظالم المستعلي والخارج على القانون».

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "طَاغِيَة"
      confirm:
        - text: "«العظيم الظلم الكثير الطغيان , والتاء للمبالغة»"
          source: "المعجم الوسيط"
        - text: "«الجبَّارُ الظَّلُوم. (التَّاءُ للمبالغة) المُتَكَبِّرُ العَنِيدُ الحاكم الْمُسْتَبِدُّ, يَقْهَرُ النَّاس ويأكلُ حُقُوقَهم»"
          source: "المعجم الكبير"
        - text: "«طاغية — tyrant»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
        - text: "«طاغية، ظالم — tyrant»"
          source: "المعجم الموحد لمصطلحات القانون"
        - text: "«المستبدّ؛ الطّاغية — مغتصب الحكم — tyrant»"
          source: "المورد الحديث"
      expands:
        - text: "«لقبُ مَلِكِ الرُّوم. أُطْلقَ عليه لِكثرة ظُلْمِه»"
          source: "المعجم الكبير"
          addition: "إطلاق تاريخي على ملك الروم لكثرة ظلمه"
        - text: "«كلُّ ما يُعبَدُ من دون الله, كالأصنام, وغيرها»"
          source: "المعجم الكبير"
          addition: "دلالة دينية: كلّ ما يُعبد من دون الله"
        - text: "«الصاعقة»"
          source: "المعجم الوسيط"
          addition: "دلالة ثانوية: الصاعقة (معنى قرآني)"

    - lemma: "مُسْتَبِدّ"
      confirm:
        - text: "«مستبدّ — tyrant»"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
        - text: "«المستبدّ؛ الطّاغية — مغتصب الحكم — tyrant»"
          source: "المورد الحديث"
        - text: "«الحاكم المُطْلَق — autocrat»"
          source: "المورد الحديث"
      expands:
        - text: "«استبد به: انفرد به وذهب. ولأمر بفلان: غلبه فلم يقدر على ضبطه. وبأميره: غلب على رأيه فهو لا يسمع إلا منه»"
          source: "المعجم الوسيط"
          addition: "الفعل «استبدّ» يدلّ على الانفراد بالأمر والتغلّب على الآخرين"

    # ── مرشحات المرحلة ١ ──
    - lemma: "جَبَّار"
      confirm:
        - text: "«القاهر العاتي المتسلط وَيُقَال قلب جَبَّار لَا تدخله الرَّحْمَة وَلَا يقبل الموعظة»"
          source: "المعجم الوسيط"
        - text: "«من النَّاسِ: العاتى المُتَمرِّدُ المُتسلِّطُ القاهرُ»"
          source: "المعجم الكبير"
        - text: "«الذى يَقْتُلُ على الغَضَبِ في غَيْرِ حقٍّ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«من أَسْمَائِهِ تَعَالَى»"
          source: "المعجم الوسيط"
          conflict: "اسم من أسماء الله الحسنى، ممّا يجعله شديد التعدّد الدلالي"
        - text: "«وَالنَّخْل يطول ويفوت الْيَد»"
          source: "المعجم الوسيط"
          conflict: "دلالة على النخل الطويل لا علاقة لها بالطغيان"

    - lemma: "غَاشِم"
      evidence_status: "no_material_found"

    - lemma: "ظَلُوم"
      confirm:
        - text: "«صيغة مبالغة من ظلم, كثير الظلم»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«صيغة مبالغة من ظلم, كثير الظلم»"
          source: "المعجم الكبير"
          conflict: "صفة عامة تدلّ على كثرة الظلم دون تخصيص بمن يمارس السلطة؛ وهي صفة (adj) لا اسم"

    - lemma: "بَاغٍ"
      contradicts:
        - text: "«الظالم المستعلي والخارج على القانون»"
          source: "المعجم الوسيط"
          conflict: "الباغي في الاصطلاح الفقهي هو الخارج على الإمام الحقّ، أي المتمرّد لا الحاكم المتسلّط"
        - text: "«الباغي: هو الخارج على الإمام الحق بغير حق»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "المعنى الاصطلاحي الراسخ يتعارض مع مفهوم الطاغية (الحاكم)؛ الباغي متمرّد لا حاكم"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "طَاغِيَة"
      decision: confirmed
      decision_reason: >-
        لمّة أصيلة مؤيَّدة بأدلة معجمية غزيرة من المعجم الوسيط والكبير ومصادر حديثة.
        التعريف المعجمي («العظيم الظلم الكثير الطغيان»، «الحاكم المستبدّ يقهر الناس ويأكل حقوقهم»)
        يطابق مفهوم المجموعة تماماً. اللفظ متجذّر في التراث العربي والقرآني.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تركّز على تجاوز الحدود في الظلم والعتوّ (من طغى = جاوز الحدّ)، وتحمل شحنة
        أدبية تراثية وقرآنية. أثقل وقعاً وأشدّ ذمّاً من «مستبدّ».

    - lemma: "مُسْتَبِدّ"
      decision: confirmed
      decision_reason: >-
        اسم فاعل من «استبدّ» (الانفراد بالأمر والتغلّب)، مستعمل في الفصحى المعاصرة
        والمصطلحات السياسية بمعنى tyrant/despot. مؤيَّد بمصادر ArabTerm والمورد الحديث.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تركّز على الانفراد بالسلطة والتحكّم المطلق (من استبدّ = انفرد بالأمر)،
        وهي أقرب إلى المصطلح السياسي المحايد. أخفّ وطأةً أدبياً من «طاغية».

    # ── مرشحات المرحلة ١ ──
    - lemma: "جَبَّار"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم أنّ المعاجم تثبت معنى «القاهر العاتي المتسلّط»، فإنّ اللفظ شديد التعدّد الدلالي:
        هو أوّلاً اسم من أسماء الله الحسنى، كما يُطلق على النخل الطويل والهدر وغيرها.
        إدراجه في المجموعة يسبّب التباساً دلالياً غير مرغوب. فضلاً عن أنّ «جبّار» يصف
        القوّة والقهر عموماً لا بالضرورة ممارسة السلطة السياسية بقسوة.
      evidence_assessment:
        case: mixed

    - lemma: "غَاشِم"
      source: stage1
      decision: removed
      decision_reason: >-
        لم تُوجد أدلة معجمية في قاعدة البيانات. اللفظ مستعمل في الفصحى المعاصرة لكنّه
        ضعيف التوثيق في المعاجم التراثية، وقد يكون محدث الاستعمال بهذا المعنى.
      evidence_assessment:
        case: no_material

    - lemma: "ظَلُوم"
      source: stage1
      decision: removed
      decision_reason: >-
        صفة مبالغة عامّة تدلّ على كثرة الظلم دون تخصيص بالحاكم أو ممارس السلطة.
        جنسها الصرفي صفة (adj) لا اسم (noun)، وهي تصف طبع الظلم لا الشخص
        الذي يمارس السلطة بقسوة تحديداً.
      evidence_assessment:
        case: mixed

    - lemma: "بَاغٍ"
      source: stage1
      decision: removed
      decision_reason: >-
        المعنى الاصطلاحي الراسخ في الفقه هو «الخارج على الإمام الحقّ» أي المتمرّد،
        وهذا نقيض مفهوم الطاغية الذي هو الحاكم نفسه. اتجاه القوة معكوس:
        الباغي يتمرّد على السلطة، أمّا الطاغية فيمارسها بظلم.
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "أي شخص يمارس السلطة بطريقة قاسية"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي عامّ جداً ولا يميّز الطاغية عن أيّ شخص عنيف أو متسلّط في أيّ سياق.
        ينبغي تخصيصه بالحكم والسلطة السياسية وتجاوز حدود العدل، اتّساقاً مع المعاجم العربية.
    authored:
      - type: terminological
        text: "حاكمٌ يَتَفَرَّدُ بِالسُّلْطَةِ ويُمارِسُها بِالقَهْرِ والجَوْرِ مُتَجاوِزاً حُدودَ العَدْلِ والقانونِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كُلُّ مَنِ اسْتَأْثَرَ بِالحُكْمِ وأَسْرَفَ في ظُلْمِ الرَّعِيَّةِ وقَهْرِها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حاكمٌ يَتَفَرَّدُ بِالسُّلْطَةِ ويُمارِسُها بِالقَهْرِ والجَوْرِ مُتَجاوِزاً حُدودَ العَدْلِ والقانونِ"

