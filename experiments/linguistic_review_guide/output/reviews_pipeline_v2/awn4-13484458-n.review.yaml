# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13484458-n
# desensitization / إزالة التحسس
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «إزالة التحسس» مركب إضافي بلا تشكيل"
      - "المجموعة تحتوي لمّة واحدة فقط، والمفهوم له مترادفات عربية موثقة في معاجم مختلفة"
      - "كلمة «تحسّس» في المعاجم الكلاسيكية تعني طلب الخبر لا الحساسية الطبية، والاستعمال الطبي حديث"
    observations: >
      المفهوم هو عملية تقليل الحساسية أو إزالتها، وهو مصطلح يُستخدم في الطب والفيزياء والهندسة.
      اللمّة الموجودة «إزالة التحسس» مسجّلة في المعجم الطبي الموحد، لكنها ليست الصيغة الوحيدة؛
      إذ تُستعمل «إزالة الحساسية» و«تخفيض الحساسية» في مجالات أخرى. التعريف العربي الحالي
      «عملية تقليل الحساسية» مقبول لكنه يحتاج تدقيقاً ليكون أكثر دقة اصطلاحية.
  blind_candidates:
    - lemma: "تَخْفِيضُ الحَسَاسِيَّةِ"
      generation_method: tarkib
      justification: "مركب إضافي من «تخفيض» (مصدر خفَّض) و«الحساسية»، يطابق المفهوم مباشرة: تقليل الحساسية تدريجياً"
    - lemma: "إِزَالَةُ الحَسَاسِيَّةِ"
      generation_method: tarkib
      justification: "مركب إضافي يدلّ على إزالة الحساسية بالكامل، وهو أقرب لفظاً إلى التعريف من اللمّة الموجودة"
    - lemma: "نَزْعُ التَّحَسُّسِ"
      generation_method: tarkib
      justification: "مركب إضافي من «نزع» (القلع) و«التحسس»، على نمط «نزع السلاح»"
    - lemma: "تَبْلِيدٌ"
      generation_method: ishtiqaq
      justification: "مصدر «بلَّد» على وزن تَفْعِيل، من البلادة أي انعدام الحسّ، لكنه يحمل دلالة سلبية غير مناسبة للسياق العلمي"

stage2_evidence:
  per_lemma:
    - lemma: "إِزَالَةُ التَّحَسُّسِ"
      confirm:
        - text: "«إِزالَةُ التَّحَسُّس» = desensitization"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إِزالَةُ التَّحَسُّسِ التَّأقِّيّ» = anaphylactic desensitization"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إِزالَةُ التَّحَسُّسِ المَنْهَجِيَّةُ» = systematic desensitization"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إزالة التحسس المناعي» = immunologic desensitization"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«(تحسس) الخبرَ تطلب معرفته ويقال تحسس من القوم تتبع أخبارهم»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي للتحسس في المعاجم الكلاسيكية هو طلب الخبر والتتبع، والاستعمال بمعنى الحساسية الطبية حديث"
        - text: "«تَحَسَّسَ شعره بيديه [فصيحة] — الفعل المرفوض جارٍ على أقيسة العربية، فهو مطاوع للفعل حسَّس المأخوذ من حسَّ بقصد المبالغة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "تحسَّس فصيح قياساً على وزن تَفَعَّل مطاوعاً لفَعَّل، مما يسند صحة المصدر «تحسُّس» صرفياً"

    - lemma: "إِزَالَةُ الحَسَاسِيَّةِ"
      confirm:
        - text: "«إزالة الحساسية» = desensitization"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«إزالة الحساسية» = desensitizing"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«1- زوال الحساسية 2- إزالة الحساسية» — 1- عدم تجاوب الجسم للمستضدات 2- إزالة عقدة نفسية (في العلاج السلوكي النفسي)"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«يزيل الحساسية» — أ- يوقف الحساسية في عصب حسي بقطعة أو بالتخدير الموضعي. ب- يزيل الأجسام المضادة من الخلايا الحساسة بغرض منع الأرج."
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "تفصيل للآلية: إيقاف الحساسية العصبية أو إزالة الأجسام المضادة"

    - lemma: "تَخْفِيضُ الحَسَاسِيَّةِ"
      confirm:
        - text: "«تخفيض الحساسية» = desensitization"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"

    - lemma: "نَزْعُ التَّحَسُّسِ"
      evidence_status: "no_material_found"

    - lemma: "تَبْلِيدٌ"
      contradicts:
        - text: "«الباء واللام والدال أصل واحد... والأصل الصدر... ويقال تبلَّد الرجل إذا وضع يده على صدره عند تحيّره في الأمر»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر «بلد» يدور حول الأرض والتحيّر واللصوق، لا حول انعدام الحسّ بمعناه الطبي"

stage3_analysis:
  per_lemma:
    - lemma: "إِزَالَةُ التَّحَسُّسِ"
      decision: confirmed
      decision_reason: >
        مصطلح موثق في المعجم الطبي الموحد (2009) والمكنز الزراعي بمقابلات متعددة
        (desensitization, anaphylactic desensitization, systematic desensitization, immunologic desensitization).
        هو المصطلح الطبي المعتمد لهذا المفهوم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُستعمل أساساً في السياق الطبي والمناعي للدلالة على إزالة حالة التحسس المكتسبة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِزَالَةُ التَّحَسُّسِ"

    - lemma: "إِزَالَةُ الحَسَاسِيَّةِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثق في موسوعة الكهرباء (IEC 60050) ومعجم المصطلحات الطبية (2003) كمقابل لـ desensitization.
        يختلف عن «إزالة التحسس» في أنه يدلّ على إزالة الحساسية العامة (sensitivity) لا التحسس المكتسب (sensitization).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُستعمل في الهندسة والفيزياء والسياق الطبي العام للدلالة على إزالة الحساسية (sensitivity) بوصفها خاصية، لا حالة مكتسبة"
      actions:
        - command: create_entry
          params: {lemma: "إِزَالَةُ الحَسَاسِيَّةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَخْفِيضُ الحَسَاسِيَّةِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثق في المعجم الموحد لمصطلحات الفيزياء (1989) كمقابل لـ desensitization.
        يتميّز بدلالته على التقليل التدريجي لا الإزالة الكاملة، وهو أقرب للتعريف الحرفي «عملية تقليل الحساسية».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدلّ على التقليل التدريجي للحساسية (reduction) لا إزالتها التامة، ويُستعمل في الفيزياء والهندسة"
      actions:
        - command: create_entry
          params: {lemma: "تَخْفِيضُ الحَسَاسِيَّةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "نَزْعُ التَّحَسُّسِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد معجمية على استعمال هذا المركب. رغم صحته البنيوية
        (نزع + التحسس)، إلا أنه غير مسجّل في أي معجم متخصص، والمعاجم تفضّل «إزالة» على «نزع» في هذا السياق.
      evidence_assessment:
        case: no_material

    - lemma: "تَبْلِيدٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر «بلد» يدور حول الأرض والتحيّر واللصوق في مقاييس اللغة، ولا يحمل دلالة
        تقليل الحساسية الطبية أو العلمية. والمصطلح يحمل شحنة سلبية (البلادة) لا تناسب السياق العلمي المحايد.
      evidence_assessment:
        case: contradicts_only

