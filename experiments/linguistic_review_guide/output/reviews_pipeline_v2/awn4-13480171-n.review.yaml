# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13480171-n
# deepening — تعميق
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «تعميق» مصدر الفعل الثلاثي المزيد (فعّل/تفعيل) وهو متعدٍّ يدلّ على جعل الشيء أعمق، في حين أنّ التعريف يصف عملية لازمة (يصبح الشيء أعمق)، فالمصدر الأنسب صرفيًّا هو «تعمُّق» (تفعُّل) الدالّ على المطاوعة"
      - "المجموعة تحوي لمّة واحدة فقط، والأَولى إثراؤها بمرادف أو أكثر"
    observations: "المفهوم واضح ومباشر: عملية ازدياد العمق حسّيًّا أو معنويًّا. الجذر «ع م ق» غزير الاشتقاق في العربية، ويمكن توليد عدّة مصادر منه بحسب صيغة الفعل. التعريف الإنجليزي يجمع بين العمق الحسّي (deeper) والمعنوي (more profound)."
  blind_candidates:
    - lemma: "تَعَمُّق"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تَعَمَّقَ (باب التفعُّل/الخامس) الدالّ على المطاوعة واللزوم، أي صيرورة الشيء عميقًا من تلقاء نفسه، وهو أوفق للتعريف اللازم"
    - lemma: "تَغَوُّر"
      generation_method: ishtiqaq
      justification: "مصدر تَغَوَّرَ من الجذر «غ و ر» الدالّ على البعد في العمق والقعر، يُستخدم مجازًا في الدلالة على التعمّق الفكري"
    - lemma: "اسْتِعْمَاق"
      generation_method: ishtiqaq
      justification: "مصدر استعمق (استفعال) بمعنى طلب العمق أو بلوغه، وزن استفعال يفيد الطلب والتحوّل"
    - lemma: "تَعْمِيق"
      generation_method: ishtiqaq
      justification: "مصدر عَمَّقَ (تفعيل) بمعنى جعل الشيء أعمق، يُستخدم في العربية المعاصرة للدلالة على عملية التعميق سواء أكانت متعدّية أم لازمة"

stage2_evidence:
  per_lemma:
    - lemma: "تَعْمِيق"
      confirm:
        - text: "«تَعْميق» = deepening"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«تعميق» = incision"
          source: "مسرد الجغرافيا والتاريخ (ALECSO)"
          conflict: "في سياق الجغرافيا يُراد بالتعميق الحفر/الشقّ لا مجرّد ازدياد العمق"
      expands:
        - text: "«تَعْميقُ الجَيبَة» = deepening of pocket"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستخدم التعميق اسمًا في التراكيب الإضافية الطبّية"
    - lemma: "تَعَمُّق"
      confirm:
        - text: "«(تعمق) فِي الْأَمر دققه واستقصاه يُقَال تعمق فِي الْبَحْث أَو الرَّأْي وَفِي كَلَامه تنطع»"
          source: "المعجم الوسيط"
      expands:
        - text: "«تعمق المنخفض الجوي» = deepening of a depression"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
          addition: "يُستخدم تعمّق مصدرًا لازمًا في السياق الجوّي بمعنى ازدياد عمق المنخفض"
    - lemma: "تَغَوُّر"
      evidence_status: "no_material_found"
    - lemma: "اسْتِعْمَاق"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَعْمِيق"
      decision: confirmed
      decision_reason: "لمّة مُثبتة في المعجم الطبي الموحد بمعنى deepening، ومستعملة في العربية المعاصرة على نطاق واسع. وإن كان وزن تفعيل في الأصل للمتعدّي، فقد شاع استعماله للعملية ذاتها"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يغلب عليه دلالة الإرادة والقصد، أي أنّ فاعلًا يُعمِّق شيئًا ما، ويُستعمل في السياقات العملية والتقنية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْمِيق"
    - lemma: "تَعَمُّق"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر الفعل الخامس (تفعُّل) مُثبت في المعجم الوسيط ومستعمل في معاجم المصطلحات (الأرصاد الجوية). يدلّ على العملية اللازمة وهو أوفق لتعريف المجموعة الذي يصف صيرورة ذاتية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على عملية ذاتية لازمة لا تستلزم فاعلًا خارجيًّا، ويُستعمل في السياقات الفكرية والطبيعية (تعمّق في البحث، تعمّق المنخفض)"
      actions:
        - command: create_entry
          params:
            lemma: "تَعَمُّق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "تَغَوُّر"
      source: stage1
      decision: removed
      decision_reason: "لا شواهد معجمية على استعمال «تغوّر» مصدرًا بمعنى ازدياد العمق. الجذر «غور» حيّ لكنّ هذا المصدر غير مسكوك"
      evidence_assessment:
        case: no_material
    - lemma: "اسْتِعْمَاق"
      source: stage1
      decision: removed
      decision_reason: "صيغة غير مسموعة ولا مُثبتة في أيّ معجم. لا شواهد على استعمالها"
      evidence_assessment:
        case: no_material

