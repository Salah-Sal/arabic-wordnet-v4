# مراجعة المجموعة الترادفية — awn4-05440312-n (protoplasm)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بروتوبلازم» بدون تشكيل — تحتاج تشكيلاً كاملاً"
      - "اللمّة «جبلة» بدون تشكيل — تحتاج تشكيلاً كاملاً لتمييزها عن الأوزان الأخرى (جَبْلَة/جِبْلَة/جِبِلَّة)"
      - "التعريف العربي ترجمة حرفية عن الإنجليزية — يحتاج صياغة معجمية عربية أصيلة"
    observations: "المجموعة تدلّ على مفهوم بيولوجي أساسي هو مادة الخلية الحيّة الشاملة للسيتوبلازم والنواة. المصطلح العربي الأصيل «جِبْلَة» أقرّه مجمع اللغة العربية في القاهرة، وهو مشتق من الجذر «ج ب ل» الدالّ على الخَلْق والطبيعة والأصل — وهو مجاز بليغ من الفطرة والطبيعة إلى المادة الحيّة الأوّلية. أمّا «بروتوبلازم» فهو تعريب شائع في الاستعمال العلمي."

  blind_candidates:
    - lemma: "جِبِلَّة"
      generation_method: majaz
      justification: "من الجذر «ج ب ل» بمعنى الخِلقة والطبيعة الفطرية، نُقل مجازاً إلى المادة الحيّة الأولية التي تُجبَل عليها الكائنات — على وزن فِعِلَّة الدالّ على المبالغة والكثافة"
    - lemma: "هَيُولَى"
      generation_method: majaz
      justification: "لفظ معرَّب عن اليونانية (hyle) بمعنى المادة الأولى القابلة للصور، استُعمل فلسفياً للمادة الأصلية — يمكن نقله مجازاً إلى مادة الخلية الأساسية"
    - lemma: "بُرُوتُوبْلَازْم"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح العالمي protoplasm، مقبول لأنه مصطلح علمي ذو صيغة عالمية ثابتة، ويقبل لام التعريف والنسبة (بروتوبلازميّ)"
    - lemma: "مَادَّة حَيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «مادّة» + «حيّة»، يوافق اللمّة الإنجليزية living substance، لكنه قد يكون عامّاً جداً"


stage2_evidence:
  per_lemma:
    - lemma: "بُرُوتُوبْلَازْم"
      confirm:
        - text: "«بروتوبلازم [مفرد]: (شر) مادّة حيّة معقّدة مكوِّنة لخلايا الكائن الحيّ.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«بروتوبلازم — protoplasm»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«الجِبْلة الأولى (مج)؛ البروتوبلازما: مادةٌ لزِجة تُعتبر قِوامَ الخلايا الحيّة (أح).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«جبلة بروتوبلازم، هيولي: مادة شفافة هلامية تكون هي والنواة العنصر الحي الأساسي في الخلية الحية»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "يذكر المعجم ثلاثة مقابلات عربية للمصطلح: جبلة وبروتوبلازم وهيولي"

    - lemma: "جِبْلَة"
      confirm:
        - text: "«(الجبلة) الجبلة والأمة والجماعة من الناس و(في علم الأحياء) مادة شبه زلالية معقدة التركيب الكيمياوي وتعد الأساس الطبيعي للحيوان والنبات (مج)»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«الجِبِلَّةُ: ... (في علوم الأحياء): البروتوبلازمة protoplasm: المادةُ الحيّة الأوّلية, وهى جُملةُ المادةِ المُكوِّنة لِلْبِنْيَة الأساسية في بناء الكائنات الحية, وهي الخَلِيّة, مُتَشَكِّلةً إلى الجَبْلَةِ الخَلَوِيّةِ (السيتوبلازمة) وما بها من عُضَيَّاتٍ غِشائِيّةٍ وغيرِ غِشائِيّةٍ, والجبلَة النَّووِيّة (النيوكليوبلازمة)»"
          source: "المعجم الكبير (OCR)"
        - text: "«جِبْلَة: مجموعة المواد البروتينية التي تتكون منها الخلية وفيها تتم التفاعلات الحيوية. — protoplasm»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«جِبْلَة — protoplasm»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«جِبْلَة — bioplasm (protoplasm)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«جِبْلَة — sarcode (protoplasm)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«جِبْلة [مفرد]: ... 2- (شر) بروتوبلازم؛ مادّة شبه زلاليَّة، معقَّدة التَّركيب الكيماويّ، وتُعَدّ الأساس الطبيعيّ للحيوان والنَّبات.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«جِبلَِّة الخلية: القسم الذي يقوم بالأيض في الخلية والذي يحتوي النواة والسيتوبلازم وغشاء الخلية. — protoplasm»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "صيغة مركبة «جِبلَّة الخلية» تُستعمل أيضاً مقابلاً لـ protoplasm"

    - lemma: "جِبِلَّة"
      confirm:
        - text: "«(الجبلة) ... و(في علم الأحياء) مادة شبه زلالية معقدة التركيب الكيمياوي وتعد الأساس الطبيعي للحيوان والنبات (مج)»"
          source: "المعجم الوسيط"
        - text: "«الجِبِلَّةُ: ... (في علوم الأحياء): البروتوبلازمة protoplasm»"
          source: "المعجم الكبير"
      expands:
        - text: "«الجِبِلَّة: الخِلْقة والطبيعة»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي هو الخِلقة والطبيعة، ثم نُقل إلى المعنى البيولوجي بقرار مجمعي"

    - lemma: "هَيُولَى"
      contradicts:
        - text: "«هَيُولَى — cytoplasm»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          conflict: "الهَيُولَى في المعاجم العلمية الحديثة تقابل السيتوبلازم (مادة الخلية خارج النواة)، لا البروتوبلازم (مادة الخلية كاملة بما فيها النواة)"
        - text: "«الهَيولَى — cytoplasm»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي الموحد يخصّص الهيولى للسيتوبلازم فحسب"
        - text: "«هَيُولى (ال...)، سيتوبلازما (ال...) — cytoplasm»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: "تأكيد آخر أن الهيولى = سيتوبلازم وليس بروتوبلازم"
      expands:
        - text: "«(الهيولى) مادة الشيء التي يصنع منها كالخشب للكرسي والحديد للمسمار ... (عند القدماء) مادة ليس لها شكل ولا صورة معيّنة قابلة للتشكيل والتصوير»"
          source: "المعجم الوسيط"
          addition: "المعنى العام للهيولى هو المادة الخام، لكنه تخصّص في العلوم الحديثة للسيتوبلازم"

    - lemma: "مَادَّة حَيَّة"
      contradicts:
        - text: "«مادة حية — living matter»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "مادة حية تقابل living matter عموماً، وليست مصطلحاً مخصصاً للبروتوبلازم"
        - text: "«مادة حية — alive matter»"
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
          conflict: "تأكيد آخر أن التركيب عامّ وليس مصطلحاً علمياً محدداً"


