# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13447012-n
# Acheson process — عملية أتشيسون
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عملية أتشيسون» مركّب إضافي يتضمّن اسم عَلَم أجنبي معرَّب، ولا يوجد بديل عربي صرف لهذه العملية المسمّاة باسم مخترعها"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي ويفتقر إلى تفصيل تقني (لم يُذكر التسخين الكهربائي بالمقاومة وهو جوهر عملية أتشيسون)"
      - "المجموعة تحتوي لمّة واحدة فقط وهو أمر ضعيف لكنه متوقّع لمصطلح تقني مسمّى باسم عَلَم"
    observations: "هذه المجموعة تمثّل عملية صناعية مسمّاة باسم المخترع الأمريكي إدوارد غودريتش أتشيسون (1856–1931). في الاصطلاح العربي الصناعي والكيميائي، تُسمّى العمليات المنسوبة لمخترعيها بالتركيب الإضافي: عملية + اسم العَلَم. المفهوم غريب ثقافياً عن التراث العربي ولا يُتوقَّع وجود مصطلح تراثي بديل."

  blind_candidates:
    - lemma: "غَرْفَنَة حَرَارِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين «غَرْفَنَة» (مصدر صناعي من غرافيت على وزن فَعْلَنَة للدلالة على التحويل إلى غرافيت) و«حرارية» للدلالة على أنّ العملية تتم بالتسخين"
    - lemma: "تَغْرِيف"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفْعِيل من الجذر المولَّد غ-ر-ف (من غرافيت) للدلالة على عملية تحويل مادة كربونية إلى غرافيت"
    - lemma: "عَمَلِيَّةُ الغَرْفَنَة"
      generation_method: tarkib
      justification: "تركيب إضافي يجمع عملية (جنس قريب) مع غرفنة (فصل نوعي) للدلالة على العملية الصناعية لإنتاج الغرافيت"
    - lemma: "تَفَحُّمٌ غَرَافِيتِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يصف العملية بأنها تفحّم (تحوُّل إلى فحم/كربون) من النوع الغرافيتي، أي المنتهي بالغرافيت"


stage2_evidence:
  per_lemma:
    - lemma: "عَمَلِيَّةُ أَتْشِيسُون"
      evidence_status: "no_material_found"

    - lemma: "غَرْفَنَة حَرَارِيَّة"
