    - lemma: "تَغْرِيف"
      evidence_status: "no_material_found"

    - lemma: "عَمَلِيَّةُ الغَرْفَنَة"
      evidence_status: "no_material_found"

    - lemma: "تَفَحُّمٌ غَرَافِيتِيّ"
      evidence_status: "no_material_found"

    - lemma: "عَمَلِيَّة"
      confirm:
        - text: "«(العملية) جملَة أَعمال تحدث أثرا خَاصّا يُقَال عملية جراحية أَو حربية أَو مَالِيَّة (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (حولي)"
        - text: "«جملة أعمال تُحدث أثراً خاصّاً مثل عملية جراحية»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«إجراء يمتد على مدى فترة زمنية مُحددة، وأثناء حدوثه ينشأ أو يتطوّر شيءٌ ما (تدريجيًا).»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يوسّع الدلالة لتشمل العمليات التدريجية وليس الجراحية فقط"
        - text: "«العملية التقنية هي مجموع العمليات في وحدة تقنية، وتنقسم إلى: عمليات التصنيع، وعمليات الإنتاج...»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          addition: "يؤكد استخدام عملية في السياق الصناعي والتقني"

    - lemma: "جِرَافِيت"
      confirm:
        - text: "«(جرافيت) مَعْدن فحمي حديدي تصنع مِنْهُ مَادَّة الْكِتَابَة فِي أَقْلَام الرصاص (د)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (حولي)"
        - text: "«جِرافيتُ [مفرد]• الجِرافيتُ: (جو) إحدى صور عنصر الكربون النَّقيّ، سوداء اللون، دهنيّة الملمس، رِخوة، يُصنَع منها أقلام الرّصاص والأصباغ وموادّ التَّشحيم وغيرها.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«graphite: أحدُ صُور عُنْصُر الكَرْبُون, وهو أسودُ ناعمُ المَلْمَس, قشرِيُّ, يُسْتَعْمَلُ في صناعةِ جَفناتٍ مُقاومةٍ للحرارة وأقلامِ الرَّصاص, والأصْباغ, وموادِّ التَّشْحِيم وغيرها»"
          source: "المعجم الكبير"
      expands:
        - text: "«معدن فحمى حديدى تصنع منه مادة الكتابة فى أقلام الرصاص»"
          source: "المعجم الوسيط (OCR)"
          addition: "تعريف مختصر يؤكد الطبيعة الفحمية للجرافيت"
        - text: "«معدن مؤلف من الكربون الحرّ الأسود اللون رخو، يتبلور في النظام السداسي»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "يضيف التوصيف البلوري للغرافيت"


stage3_analysis:
  per_lemma:
    - lemma: "عَمَلِيَّةُ أَتْشِيسُون"
      decision: confirmed
      decision_reason: "هذا هو المصطلح العربي المعياري لعملية أتشيسون الصناعية، يتبع النمط الاصطلاحي العربي الثابت لتسمية العمليات المنسوبة: «عملية + اسم العَلَم». كلمة «عملية» مثبتة في المعاجم العربية الحديثة بمعنى process/operation، و«أتشيسون» تعريب مقبول لاسم العَلَم Acheson يخضع لقواعد التعريب المعتمدة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّةُ أَتْشِيسُون"

    - lemma: "غَرْفَنَة حَرَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مولَّد لا أساس له في الاستعمال المعجمي أو التقني، و«غرفنة» ليست مصدراً مسكوكاً معترفاً به. فضلاً عن ذلك، المصطلح يصف عملية عامة (تحويل حراري إلى غرافيت) ولا يخصّ عملية أتشيسون بعينها."
      evidence_assessment:
        case: no_material

    - lemma: "تَغْرِيف"
      source: stage1
      decision: removed
      decision_reason: "مصدر مولَّد غير مسكوك ولا مثبت في أي معجم. يخلط بين جذر «غرف» (الغَرْف: الأخذ) والكلمة المعرَّبة «غرافيت». كما أنّ المفهوم المراد ليس التحويل إلى غرافيت عموماً بل عملية صناعية محددة مسمّاة."
      evidence_assessment:
        case: no_material

    - lemma: "عَمَلِيَّةُ الغَرْفَنَة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير مثبت، و«الغرفنة» ليست مسكوكة في المعاجم التقنية العربية. كما أنّ المفهوم المقصود عملية مسمّاة باسم عَلَم وليست مجرد عملية غرفنة عامة."
      evidence_assessment:
        case: no_material

    - lemma: "تَفَحُّمٌ غَرَافِيتِيّ"
      source: stage1
      decision: removed
      decision_reason: "التفحّم (carbonization) يعني التحوّل إلى فحم، وهو عكس ما تفعله عملية أتشيسون التي تحوّل الفحم إلى غرافيت. المصطلح مضلّل دلالياً ولا أساس معجمي له."
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "عملية صناعية لصنع الجرافيت عن طريق تسخين خليط من فحم الكوك والطين"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية مقتضبة تفتقر إلى الدقة التقنية؛ فعملية أتشيسون تعتمد على التسخين الكهربائي بالمقاومة في فرن خاص (فرن أتشيسون)، وهذا الفارق جوهري يميّزها عن أي تسخين عادي. كما أن ذكر الطين وحده لا يكفي فالمادة المساعدة هي السيليكا (رمل الكوارتز)."
    authored:
      - type: terminological
        text: "عمليةٌ صناعيةٌ كيميائيةٌ حراريةٌ ابتكرها إدوارد أتشيسون، يُسخَّن فيها فحمُ الكوك مع مادة سيليكاتية في فُرن مقاومة كهربائية عند درجات حرارة تتجاوز 2500°م لتحويل الكربون غير المتبلور إلى غرافيت بلوري."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "طريقةٌ صناعيةٌ لإنتاج الغرافيت الاصطناعي، طوَّرها المخترع الأمريكي إدوارد غودريتش أتشيسون عام 1895م. تقوم على تمرير تيار كهربائي عبر قلب من حبيبات فحم الكوك محاط بخليط من الكوك والرمل (السيليكا) داخل فرن مقاومة، فترتفع الحرارة إلى نحو 3000°م، مما يحوِّل الكربون إلى غرافيت عالي النقاء. وتُستخدم هذه العملية أيضاً في إنتاج كربيد السيليكون."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عمليةٌ صناعيةٌ كيميائيةٌ حراريةٌ ابتكرها إدوارد أتشيسون، يُسخَّن فيها فحمُ الكوك مع مادة سيليكاتية في فُرن مقاومة كهربائية عند درجات حرارة تتجاوز 2500°م لتحويل الكربون غير المتبلور إلى غرافيت بلوري."

  examples:
    per_lemma:
      - lemma: "عَمَلِيَّةُ أَتْشِيسُون"
        examples:
          - text: "تُنتَج معظمُ أقطاب الغرافيت المستخدمة في أفران القوس الكهربائي بوساطة عَمَلِيَّة أَتْشِيسُون التي تحوِّل فحمَ الكوك البتروليّ إلى غرافيت عالي النقاء."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُنتَج معظمُ أقطاب الغرافيت المستخدمة في أفران القوس الكهربائي بوساطة عَمَلِيَّة أَتْشِيسُون التي تحوِّل فحمَ الكوك البتروليّ إلى غرافيت عالي النقاء."


