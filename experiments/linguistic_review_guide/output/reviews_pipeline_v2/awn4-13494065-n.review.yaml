# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ترسيب كهروستاتيكي» تستخدم لفظة «كهروستاتيكي» وهي تعريب صرف للّفظة الأجنبية electrostatic، في حين توجد بدائل عربية معتمدة من المجامع مثل «كهرساكن» و«كهراكدي» و«كهرسكوني»"
      - "المجموعة تحتوي على لمّة واحدة فقط — ينبغي إثراؤها بمرادفات عربية أصيلة"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي وينبغي إعادة صياغته بأسلوب معجمي عربي"
    observations: "المفهوم تقنيّ صناعيّ يصف عملية إزالة الجسيمات العالقة من الغازات بالشحنة الكهربائية الساكنة. المصطلح مركّب وصفيّ من «ترسيب» (مصدر رسَّبَ من الجذر ر س ب) و«كهروستاتيكي» (صفة معرَّبة). الجذر «رسب» يدلّ على ذهاب الشيء سُفلاً من ثِقَل، وهو مناسب دلالياً لعملية ترسيب الجسيمات. البدائل العربية للصفة «كهروستاتيكي» متعددة ومعتمدة في معاجم ألكسو."
  blind_candidates:
    - lemma: "تَرْسِيب كَهْرَسَاكِن"
      generation_method: tarkib
      justification: "مركّب وصفيّ من «ترسيب» (إسقاط الجسيمات) و«كهرساكن» (المقابل العربي المعتمد من ألكسو للصفة electrostatic في معاجم الفيزياء والكيمياء)"
    - lemma: "تَرْسِيب كَهْرَاكِدِيّ"
      generation_method: tarkib
      justification: "مركّب وصفيّ يستخدم الصفة «كهراكدي» المعتمدة في المعجم الموحّد للمصطلحات المهنية والتقنية بمعنى electrostatic"
    - lemma: "تَنْقِيَة كَهْرُوسُكُونِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفيّ من «تنقية» (إزالة الشوائب — جنس أعلى مناسب) و«كهروسكونية» (صيغة المورد الحديث لـ electrostatic)"
    - lemma: "تَرْسِيب إِلِكْتْرُوسْتَاتِيكِيّ"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الأجنبي electrostatic precipitation مع إخضاع اللفظة للصرف العربي — ملاذ أخير"

stage2_evidence:
  per_lemma:
    - lemma: "تَرْسِيب كَهْرُوسْتَاتِيكِيّ"
      expands:
        - text: "«ترسيب» — decantation; sedimentation; settling; settlement"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يؤكد استعمال «ترسيب» بمعنى إسقاط الجسيمات العالقة"
        - text: "«ترسيب» — طريقة كيميائية من طُرق مُعالجة المياه، الهدف منها تحويل المواد الذائبة إلى غير ذائبة داخل حوض الترسيب"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يوسّع مفهوم الترسيب ليشمل التحويل الكيميائي"
        - text: "«ترسيب كهربائي» — electrical depositions"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "مصطلح قريب لكنه يدلّ على الترسيب الكهربائي (الغلفنة) لا الكهروستاتيكي"

    - lemma: "تَرْسِيب كَهْرَسَاكِن"
      confirm:
        - text: "«كهربائي ساكن، كهرساكن» — electrostatic"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«كَهْرَساكن» — صفةٌ لما له صلةٌ بالكهرباء الساكنة. تُستعمَلُ الشحناتُ الكهربائية الساكنة في آلات النسخ والطابعات الليزرية لإبقاء جسيمات الصباغ على أسطوانةٍ حسّاسة للضوء"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«مجال كهرساكن» — electrostatic field؛ «مولد كهرساكن» — electrostatic generator؛ «حث كهرساكن» — electrostatic induction؛ «جهد كهرساكن» — electrostatic potential"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "سلسلة مركّبات تثبت إنتاجية الصفة «كهرساكن» في التركيب المصطلحي"

    - lemma: "تَرْسِيب كَهْرَاكِدِيّ"
      confirm:
        - text: "«ترسيب كهراكدي» — electrostatic precipitation"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"
      expands:
        - text: "«مولد كهراكدي» — electrostatic generator؛ «مجال كهراكدي» — electrostatic field؛ «جهاز كهراكدي» — electrostatic instrument"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"
          addition: "سلسلة مركّبات تثبت إنتاجية الصفة «كهراكدي» في نفس المعجم"

    - lemma: "تَنْقِيَة كَهْرُوسُكُونِيَّة"
      contradicts:
        - text: "«كَهْرَسُكونيّ؛ ألكتروستاتيّ» — electrostatic"
          source: "المورد الحديث (2008)"
          conflict: "الصفة «كهرسكوني» مؤكدة لكنها ترد في المورد فقط ولم تُعتمد في معاجم ألكسو الموحّدة، والأساس «تنقية» لا يُستعمل مقابل precipitation بل مقابل purification"

    - lemma: "تَرْسِيب إِلِكْتْرُوسْتَاتِيكِيّ"
      evidence_status: "no_material_found"

