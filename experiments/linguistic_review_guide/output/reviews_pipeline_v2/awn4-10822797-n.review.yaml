stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «شخص يتثائب» دائري، إذ يعيد الفعل دون بيان ماهية التثاؤب"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو أمر مقبول لمفهوم بسيط لكنه يحدّ من التنوّع الدلالي"
      - "الرأس الأعلى (hypernym) هو عَامِل/فَاعِل بمعنى «شخص يعمل ويُنجِز الأمور»، وهو تصنيف عام مقبول لاسم فاعل يدلّ على من يقوم بفعل ما"
    observations: "المفهوم بسيط: اسم فاعل يدلّ على الشخص الذي يتثاءب. الجذر ث أ ب جذر عربي أصيل ورد في المعاجم الكلاسيكية والحديثة. الاشتقاق على وزن مُتَفَاعِل من الفعل تَثَاءَبَ (تَفَاعَلَ) هو الصيغة الفصحى المعتمدة. المفهوم ليس غريباً ثقافياً ولا يحتاج إلى ترجمة أو اقتراض."
  blind_candidates:
    - lemma: "مُتَثَائِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تَثَاءَبَ على وزن مُتَفَاعِل، وهو الاشتقاق القياسي المباشر من الفعل الدالّ على التثاؤب"
    - lemma: "مَثْؤُوب"
      generation_method: ishtiqaq
      justification: "اسم مفعول من ثُئِبَ (المبني للمجهول) على وزن مَفْعُول، يدلّ على من أصابته الثُّؤَباء"
    - lemma: "ثَؤُوب"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعُول من الجذر ث أ ب، تدلّ على كثير التثاؤب"
    - lemma: "فَاغِرٌ"
      generation_method: majaz
      justification: "مجاز من فَغَرَ فاهُ أي فتحه واسعاً، وهو الفعل المصاحب للتثاؤب، فيُطلق على المتثائب من باب إطلاق اللازم على الملزوم"

stage2_evidence:
  per_lemma:
    - lemma: "مُتَثَائِب"
      confirm:
        - text: "«(1) المُتثائب (2) المُضْجِر: شيء يسبِّب الضَّجر.»"
          source: "المورد الحديث (2008)"
        - text: "«تثاءبَ يتثاءب، تثاؤبًا، فهو مُتثائب• تثاءب الشَّخصُ: فتح فمه وأطبقه بحركة لا إراديّة نتيجة كسل أو نُعاس أو ملل»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«أصابته الثُّؤباءُ تصنَّع الثُّؤباء الخبرَ : تحسَّسَه»"
          source: "المعجم الوسيط"
      expands:
        - text: "«التَّثَاؤُب: من الثؤباء وهي فترة من ثقل النعاس فيسترخي ويفتح فاه واسعاً من غير قصد.»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "يربط التثاؤب بالنعاس والاسترخاء وفتح الفم لا إرادياً"
        - text: "«فعل منعكس يفتح فيه الفم ويصحبه شهيق، ويحدث من كسل أو إجهاد أو ميل للنوم.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "تعريف طبي حديث يضيف بُعد الشهيق والإجهاد"
    - lemma: "مَثْؤُوب"
      expands:
        - text: "«ثُئِبَ الرَّجُلُ ثَأْبًا وتَثَأَبَ وتَثاءَبَ أَصابَه كَسَلٌ وتَوْصِيمٌ وهي الثُّؤَباءُ»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
          addition: "يثبت وجود الفعل المبني للمجهول ثُئِبَ لكن لم يرد اسم المفعول مَثْؤوب كلمّة مستقلة"
    - lemma: "ثَؤُوب"
      evidence_status: "no_material_found"
    - lemma: "فَاغِرٌ"
      contradicts:
        - text: "«(1) «أ» يَفْغر فمه. «ب» ينفرج؛ ينشقّ (2) يحدِّق فاغرًا فاه (3) يتثاءَب»"
          source: "المورد الحديث (2008)"
          conflict: "الفَغْر أعمّ من التثاؤب، فهو يشمل فتح الفم لأي سبب والانفراج والانشقاق، فلا يختصّ بالتثاؤب"

