# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14907357-n (crystal / بلورة)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بلورة» بدون تشكيل — يجب إضافة التشكيل الكامل: بِلَّوْرَة"
      - "اللمّة «كريستال» اقتراض حديث من الإنجليزية يُكرِّر دلالة «بلورة» المستقرة في المعاجم العلمية العربية منذ عقود"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج إلى صياغة معجمية أصيلة"
    observations: >
      المفهوم (جسم صلب ذو بنية ذرية منتظمة ناتج عن تصلّب مادة كيميائية) مستقرّ في الاصطلاح العلمي العربي
      تحت لفظة «بِلَّوْرَة» منذ إقرار مجمع اللغة العربية بالقاهرة. اللفظة معرَّبة قديمة من اليونانية عبر
      الفارسية، ذُكرت في المعاجم الكلاسيكية (القاموس المحيط، المصباح المنير) بوصفها حجراً أبيض شفافاً.
      أمّا «كريستال» فهي اقتراض حديث مباشر يُستعمل في السياق التجاري أكثر منه العلمي.

  blind_candidates:
    - lemma: "بِلَّوْرَة"
      generation_method: taarib
      justification: >
        معرَّبة قديمة من اليونانية κρύσταλλος عبر الفارسية، مستقرة في العربية منذ القرون الوسطى،
        ذكرها الفيروزآبادي والفيّومي ومجمع اللغة العربية. وحدة تاء الوحدة من «بِلَّوْر» الاسم الجمعي.
    - lemma: "جُمَّانَة"
      generation_method: majaz
      justification: >
        لفظة كلاسيكية تدلّ على الدُّرَّة أو الحبّة البيضاء الشفافة من الفضة، قد تُمَدّ مجازاً
        إلى الجسم الصلب المنتظم الشفاف، لكنها تحتاج إلى تحقق معجمي.
    - lemma: "مُتَبَلْوِرَة"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «تبلور» على وزن مُتَفَعْلِلَة، يصف المادة التي اتخذت شكلاً بلورياً.
        أقرّ مجمع اللغة العربية اشتقاق «تبلور» من الاسم الجامد المعرَّب «بلّور».
    - lemma: "كِرِسْتَالَة"
      generation_method: taarib
      justification: >
        تعريب حديث مباشر من الإنجليزية crystal مع إلحاق تاء التأنيث للدلالة على الوحدة،
        على غرار «كريستال» المسجلة في معجم اللغة العربية المعاصرة.


stage2_evidence:
  per_lemma:
    - lemma: "بِلَّوْرَة"
      confirm:
        - text: "«جِسْمٌ صلب طبيعى أو صناعى تترتب في داخله الذَّرَّات والأيونات ترتيباً مُنَظَّماً , وقد يُحِيط بهذا أوجُهٌ تُحدَّد تبعاً للترتيب الذَّرِّى الدَّاخلى»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«كل مادة صلبة مشكلة تشكيلا هندسيا خاصا بتوزيع منظم للذرات أو الجزيئات المكونة لها، والمواد المتبلورة تنصهر في درجات حرارة ثابتة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«جزيئة متجانسة من مادة تشكلت بتصلّب عنصر كيميائي، تكون سطوحها مستوية ومتناظرة وفق زوايا معينة وبشكل هندسي محدَّد»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
        - text: "«تكوّن المادة في شكل منتظم»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«مادة غير عضوية متجانسة بتركيب كيميائي واضح، تحدها أسطح منبسطة، والتي تشكل زوايا محددة مع بعضها البعض، لتعطي جسما بهيكل هندسي منتظم»"
          source: "مسرد المناخ والبيئة — أليكسو"
      expands:
        - text: "«جَوْهَرٌ أبيضُ شَفَّاف (عن الزبيدي)، وهو نوعٌ من الزُّجاج النقِي»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          addition: "الدلالة الأصلية على الحجر الأبيض الشفاف والزجاج النقي — تُكمّل المعنى العلمي الحديث"
        - text: "«الْبَلُّورُ حَجَرٌ مَعْرُوفٌ وَأَحْسَنُهُ مَا يُجْلَبُ مِنْ جَزَائِرِ الزَّنْجِ وَفِيهِ لُغَتَانِ كَسْرُ الْبَاءِ مَعَ فَتْحِ اللَّامِ مِثْلُ: سِنَّوْرٍ وَفَتْحُ الْبَاءِ مَعَ ضَمِّ اللَّامِ»"
          source: "المصباح المنير — الفيّومي"
          addition: "لغتان في الضبط: بِلَّوْر وبَلُّور — وتاريخ اللفظة في الاستعمال"
        - text: "«البَلُّورُ، كتَنُّورٍ وسِنَّوْرٍ وسِبَطْرٍ: جَوْهَرٌ م.»"
          source: "القاموس المحيط — الفيروزآبادي"
          addition: "إثبات اللفظة في المعاجم الكلاسيكية بوصفها جوهراً معروفاً"

    - lemma: "كريستال"
      confirm:
        - text: "«(كم) مادّة صُلبة متجانسة، يتمّ تشكيلُها بتكرير النَّمط الثُّلاثيّ الأبعاد من الذرّات أو الأيونات أو الجزيئات، وتكون المسافُة ثابتة بين المكوِّنات»"
          source: "معجم اللغة العربية المعاصرة — أحمد مختار عمر"
      contradicts:
        - text: "«بلورة» هي المصطلح المعتمد في جميع المعاجم الموحدة العلمية (كيمياء، فيزياء، جيولوجيا، صيدلة، استشعار عن بعد، مياه)"
          source: "المعاجم الموحدة — أليكسو"
          conflict: "لم يرد «كريستال» في أي معجم موحّد مصطلحي؛ المصطلح المعتمد دائماً «بلورة»"

    - lemma: "جُمَّانَة"
      contradicts:
        - text: "«اسمٌ للدُّرَّة حبَّةٌ تُعْمَلُ من الفِضَّة كالدُّرَّةِ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: "الجُمانة تدلّ على حبة الفضة أو اللؤلؤ، لا على الجسم البلوري بمفهومه العلمي"
        - text: "«من (ج م ن) واحدة الجُمان: اللؤلؤ، ونسيج من جلد مطرز بخرز ملون»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعنى مقصور على اللؤلؤ والحُلِيّ، لا علاقة له بالبنية الذرية المنتظمة"

    - lemma: "مُتَبَلْوِرَة"
      contradicts:
        - text: "«مُطاوع بلورَ: صار مثل البَلُّور في الشّكل أو في الصّفاء»"
          source: "معجم اللغة العربية المعاصرة — أحمد مختار عمر"
          conflict: "اسم فاعل يصف حالة المادة بعد التبلور (صفة)، لا اسم ذات يدل على الجسم البلوري نفسه"

    - lemma: "كِرِسْتَالَة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "بِلَّوْرَة"
      decision: confirmed
      decision_reason: >
        لفظة معرّبة قديمة مستقرة في جميع المعاجم العربية الكلاسيكية والحديثة، وهي المصطلح المعتمد
        في جميع المعاجم الموحدة العلمية الصادرة عن أليكسو. التعريف في المعجم الكبير يطابق مفهوم
        المجموعة الترادفية تماماً. تاء الوحدة تميّزها عن الاسم الجمعي «بِلَّوْر».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح العلمي العربي الأصيل المعتمد في المعاجم الموحدة والمجامع اللغوية؛ يُستعمل في
        السياقات العلمية والأكاديمية والتقنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِلَّوْرَة"

    - lemma: "كريستال"
      decision: confirmed
      decision_reason: >
        مسجّلة في معجم اللغة العربية المعاصرة بتعريف كيميائي واضح. رغم أنها اقتراض حديث مباشر
        ولم ترد في المعاجم الموحدة المصطلحية، فهي مستعملة في اللغة المعاصرة خاصة في السياق
        التجاري والعامّي. إبقاؤها يُثري المجموعة بتغطية الاستعمال المعاصر غير المتخصص.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اقتراض حديث مباشر من الإنجليزية/الفرنسية يُستعمل في السياق التجاري والعامّي المعاصر
        (أواني كريستال، ثريّات كريستال)؛ أقل تخصصاً علمياً من «بِلَّوْرَة».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِرِسْتَال"

    - lemma: "جُمَّانَة"
      source: stage1
      decision: removed
      decision_reason: >
        الجُمَّانَة تدلّ على حبّة اللؤلؤ أو الفضة المصنوعة كالدرّة، وهي من باب الحُلِيّ
        لا من باب البنية الذرية المنتظمة. لا مسوّغ لمدّ الدلالة مجازاً لعدم وجود علاقة
        وظيفية أو شكلية كافية بمفهوم البلورة العلمي.

    - lemma: "مُتَبَلْوِرَة"
      source: stage1
      decision: removed
      decision_reason: >
        اسم فاعل من «تبلور» يصف حالة المادة بعد التبلور (صفة)، لا يدلّ على الذات
        (الجسم البلوري نفسه). المطلوب في المجموعة اسم ذات (noun) لا صفة.

    - lemma: "كِرِسْتَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مولَّدة لم ترد في أي معجم. الصيغة المسجّلة هي «كريستال» بدون تاء الوحدة
        كما في معجم اللغة العربية المعاصرة. لا حاجة لاستحداث صيغة جديدة.

    - lemma: "بِلَّوْرَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        تطابق المرشح الأعمى مع اللمّة الموجودة «بلورة» بعد التشكيل — مما يؤكد صحة اللمّة الأصلية.
        لا حاجة لإجراء إضافي لأن التحديث مشمول في إجراءات اللمّة الموجودة أعلاه.


