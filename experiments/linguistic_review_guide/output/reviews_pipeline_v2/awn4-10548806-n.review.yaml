# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "ثري"
      decision: confirmed
      decision_reason: >
        ثَرِيّ لمّة أصيلة مؤصَّلة في المعجم الكبير والمعجم الوسيط ومعجم اللغة
        العربية المعاصرة للدلالة على الشخص كثير المال. التشكيل الحالي (ثري) ناقص
        — يجب تصحيحه إلى (ثَرِيّ) لدفع الالتباس بـ(الثَّرَى = التراب الندي).
        يجتاز جميع الفحوصات: فصيح متداول، لا لهجية، اشتقاقي سليم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        ثَرِيّ يدل على الثراء المادي المترسّخ والوفرة الكميّة الكبيرة في المال —
        أخصّ من غَنِيّ لأنه لا يُستعمل في الغنى المعنوي أو الاستغناء المجازي،
        ويختلف عن مُوسِر بأنه أقل ارتباطاً بالاصطلاح الفقهي، وعن مُثْرٍ بأنه
        يدل على الحال الثابتة لا الحالة المكتسبة حديثاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثَرِيّ"

    - lemma: "غني"
      decision: confirmed
      decision_reason: >
        غَنِيّ لمّة أصيلة واسعة الاستعمال في الفصحى قديماً وحديثاً، مؤكَّدة في
        مقاييس اللغة وجميع المعاجم الكبرى. التشكيل الحالي (غني) ناقص — يجب
        تصحيحه إلى (غَنِيّ) لتمييزه عن الاسم الإلهي (الغَنِيّ) في السياقات
        الدينية. يجتاز جميع الفحوصات الصرفية والملاءمة والاشتقاقية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        غَنِيّ أعمّ دلالةً من ثَرِيّ — يشمل كل مكتفٍ مستغنٍ عن الناس، سواء كان
        ثراؤه كبيراً أو متوسطاً. يُستخدم في القرآن الكريم والأدب للاستغناء المادي
        والمعنوي معاً، وله مراتب فقهية متدرجة. أكثر تداولاً في الكلام العام من
        ثَرِيّ الذي ينصرف خاصةً إلى الثراء الوافر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَنِيّ"

    - lemma: "مُثْرٍ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثْرٍ اسم فاعل مؤكَّد من أثرى-يُثري، مشهود في معجم اللغة العربية المعاصرة
        (أحمد مختار عمر) والمورد الحديث بوصفه مرادفاً لغنيّ وموسِر وثريّ.
        يجتاز اختبار السكّ (لا يمكن إبدال جزء منه بمرادف وصفي حرّ). الوزن
        الصرفي مُفْعِل مناسب لاسم الفاعل من باب الإفعال.
      evidence_assessment:
