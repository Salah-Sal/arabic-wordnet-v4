      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُثْرٍ يُركّز على حدوث الثراء واكتسابه — أي من أثرى وصار ذا ثروة. يحمل
        دلالة ديناميكية (الانتقال إلى الثراء) مقابل ثَرِيّ الذي يصف الحال الراسخة.
        يختلف عن غَنِيّ بتأكيد الكثرة، وعن مُوسِر بالتركيز على الكميّة لا اليُسر.
      actions:
