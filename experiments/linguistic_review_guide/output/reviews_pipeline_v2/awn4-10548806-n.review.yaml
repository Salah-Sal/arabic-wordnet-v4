      decision: confirmed
      decision_reason: >
        مُوسِر لمّة كلاسيكية راسخة، شهدها الفقه الإسلامي واللغة على حدٍّ سواء.
        ورد في المعجم الوسيط والتعريفات الفقهية للبركتي وموسوعة السلطان قابوس
        والمورد الحديث. مقاييس اللغة تؤكد أصله: (الْيَسَارُ: الْغِنَى).
        يجتاز جميع الفحوصات: صرفياً واشتقاقياً وملاءمةً وتراثاً وتداولاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُوسِر يُركّز على اليُسر والقدرة المالية على الوفاء — وكثيراً ما يُستخدم
        في السياق القانوني والفقهي للدلالة على القادر على الأداء. يُقابل المُعسِر
        ويختلف عن ثَرِيّ وغَنِيّ بطابعه الاصطلاحي-التقني الفقهي، وعن مُثْرٍ
