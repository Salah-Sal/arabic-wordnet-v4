# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (ثري، غني) مكتوبتان بدون تشكيل — خطر التباس: (ثري) قد تُقرأ على أنها (الثَّرَى = التراب النَّدي) بدلاً من (الثَّرِيّ = الغني)"
      - "المجموعة تفتقر إلى لمّات إضافية — (مُوسِر) و(مُثْرٍ) شائعا الاستعمال في المصادر الكلاسيكية والمعاصرة ولم يُدرجا"
      - "لمّة (غَنِيّ) فضفاضة الدلالة — تشمل كل من اكتفى بحاله وقد لا تقتصر على حيازة الثروة الكبيرة"
    observations: >
      المفهوم أصيل في الثقافة العربية وله حضور قوي في التراث اللغوي والفقهي.
      الجذران الأساسيان (ث-ر-و/ث-ر-ي) و(غ-ن-ي) غزيرا الاشتقاق ودارا في المعاجم
      الكلاسيكية والمعاصرة على حدٍّ سواء. اللمّتان الموجودتان صحيحتان لكنهما
      تفتقران إلى التشكيل ويمكن إثراء المجموعة بمُوسِر ومُثْرٍ — وكلاهما مؤصَّل.

  blind_candidates:
    - lemma: "مُثْرٍ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل الرباعي (أَثْرَى يُثْرِي) على وزن مُفْعِل — المعيار
        الصرفي لاسم الفاعل من باب الإفعال. الجذر ث-ر-و/ث-ر-ي يدل على الوفرة
        والكثرة في المال. لا يكرر مفردات التعريف. يجتاز اختبار السكّ.

    - lemma: "مُوسِر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من (أَيْسَرَ يُوسِرُ) على وزن مُفْعِل. الجذر ي-س-ر يدل على
        الانفتاح واليُسر. (اليَسَار = الغِنَى) في مقاييس اللغة وغيره. مصطلح
        راسخ في الفقه والأدب للدلالة على ذي المال والسَّعة.

    - lemma: "وَاجِد"
      generation_method: majaz
      justification: >
        أصله من وَجَدَ = أصاب وعثر، ثم انتقل مجازاً في الاستعمال الفقهي إلى
        القادر المالي (لَيُّ الوَاجِد يُحِلُّ عقوبته وعِرْضَه). يُمثّل إزاحة
        دلالية من "من يجد الشيء" إلى "من يجد ما يؤدّيه".

    - lemma: "مَيْسُور"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من (يَسَرَ) على وزن مَفْعُول، يُستخدم مصدراً وصفةً بمعنى
        اليُسر والثروة. (ميسور الحال) تعبير شائع للدلالة على اليسار المادي.
        مشتق من نفس جذر مُوسِر لكن يؤدي دلالة الحالة لا الفاعلية.


