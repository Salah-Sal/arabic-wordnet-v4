# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة مُمْتَنِع تدلّ في الاستعمال المعجمي على المستحيل (في الفلسفة) أو غير المنصرف (في النحو) أو الممتنع عن التصويت (في القانون)، لا على مَن يَمنع العطاء"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي ويحتاج إلى صياغة معجمية عربية أصيلة"
    observations: "المجموعة تمثّل مفهوم الشخص الذي يأبى المنحَ والعطاء. الجذر م ن ع هو الأساس الدلالي الأقوى، ومقاييس اللغة يعرّفه بأنه خلاف الإعطاء. اللمّة مَانِع مطابقة تماماً، لكن مُمْتَنِع انزاحت دلالتها نحو الاستحالة والامتناع الذاتي"

  blind_candidates:
    - lemma: "ضَنِينٌ"
      generation_method: ishtiqaq
      justification: "من الجذر ض ن ن على وزن فَعِيل بمعنى الشديد البخل بالشيء النفيس، وله شاهد قرآني ﴿وَمَا هُوَ عَلَى الْغَيْبِ بِضَنِينٍ﴾، والوسيط يعرّف المانعَ بأنه الضنين الممسك"
    - lemma: "مَنَّاعٌ"
      generation_method: ishtiqaq
      justification: "من الجذر م ن ع على وزن فَعَّال للمبالغة، ورد في مقاييس اللغة: وهو مَانِعٌ ومَنَّاعٌ، وفي القرآن ﴿مَنَّاعٍ لِلْخَيْرِ﴾"
    - lemma: "حَابِسٌ"
      generation_method: ishtiqaq
      justification: "من الجذر ح ب س على وزن فَاعِل بمعنى المانع الممسك، لكن دلالته الأساسية على الحبس المادي لا منع العطاء"
    - lemma: "مُمْسِكٌ"
      generation_method: ishtiqaq
      justification: "من الجذر م س ك على وزن مُفْعِل بمعنى من يمسك عن البذل، والوسيط يعرّف المانعَ بأنه الضنين الممسك"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مَانِع"
      confirm:
        - text: "«(الْمَانِع) الضنين الممسك (ج) مَنْعَة وَمَا يمْنَع من حُصُول الشَّيْء وَهُوَ خلاف الْمُقْتَضى»"
          source: "المعجم الوسيط"
        - text: "«(مَنَعَ) الْمِيمُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ هُوَ خِلَافُ الْإِعْطَاءِ. وَمَنَعْتُهُ الشَّيْءَ مَنْعًا، وَهُوَ مَانِعٌ وَمَنَّاعٌ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«المَانِعُ: مَا يلْزم من وجوده انْتِفَاء الحكم»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "دلالة اصطلاحية أصولية للمانع بوصفه وصفاً يمنع الحكم"
        - text: "«المانع: عند أهل الأصول: الوصف الوجودي الظاهر المنضبط المعرف نقيض الحكم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "توسيع في الدلالة الأصولية"
        - text: "«المانع أو المثبط، وهو عبارة عن مادة قادرة على التأثير على تفاعل... بحيث تبطئه، أو تعوقه أو تمنعه»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
          addition: "استعمال علمي حديث بمعنى inhibitor"

    - lemma: "مُمْتَنِع"
      contradicts:
        - text: "«المُمْتَنِعُ: مَا اقْتَضَت ذَاته عدم وجوده فِي الْخَارِج»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الدلالة فلسفية منطقية (المستحيل) لا علاقة لها بمنع العطاء"
        - text: "«الممتنع: هو ما يقول له النحويون: غير منصرف»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "دلالة نحوية (غير المنصرف) لا صلة لها بالمفهوم"
        - text: "«الْمُمْتَنع: هُوَ الَّذِي يكون عَدمه فِي الْخَارِج ضَرُورِيًّا»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "دلالة فلسفية أخرى تؤكد معنى الاستحالة"
      expands:
        - text: "«ممتنِع» translation_en: abstentionist"
          source: "المعجم الموحد لمصطلحات القانون"
          addition: "استعمال قانوني حديث بمعنى الممتنع عن التصويت، وهو أقرب لكنه لا يطابق المفهوم"

    - lemma: "ضَنِينٌ"
      confirm:
        - text: "«الشديد البخل, أو البخيل بالشيء النفيس»"
          source: "المعجم الوسيط"
        - text: "«﴿وَمَا هُوَ عَلَى الْغَيْبِ بِضَنِينٍ﴾»"
          source: "المعجم الوسيط (شاهد قرآني)"
        - text: "«(ضَنَّ) الضَّادُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى بُخْلٍ بِالشَّيْءِ. يُقَالُ: ضَنِنْتُ بِالشَّيْءِ أَضَنُّ بِهِ ضَنًّا وَضَنَانَةً، وَرَجُلٌ ضَنِينٌ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«ضنائِنُ الله: خواص خلقه»"
          source: "المعجم الوسيط"
          addition: "دلالة مجازية إيجابية: ما يُضَنّ به لنفاسته"

    - lemma: "مَنَّاعٌ"
      confirm:
        - text: "«وَمَنَعْتُهُ الشَّيْءَ مَنْعًا، وَهُوَ مَانِعٌ وَمَنَّاعٌ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(الْمَانِع) الضنين الممسك (ج) مَنْعَة»"
          source: "المعجم الوسيط"
          addition: "الوسيط يذكر المانع دون المنّاع، لكن مقاييس اللغة يثبت مَنَّاعاً صراحةً، وورد في القرآن ﴿مَنَّاعٍ لِلْخَيْرِ﴾"

    - lemma: "حَابِسٌ"
      contradicts:
        - text: "«شبه حوض يجمع فيه الماء، زق حابس: ممسك للماء، كلأ حابس: كثير يحبس الدواب»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية مادية (حبس الماء والدواب) لا معنوية (منع العطاء)"
      expands:
        - text: "«حَابِس: من (ح ب س) المانع الممسك والسجان»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "ورد بمعنى المانع والسجان في سياق الأسماء"

    - lemma: "مُمْسِكٌ"
      confirm:
        - text: "«(الْمَانِع) الضنين الممسك»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«البساط المنسوج من أوراق البردي أو الباري أو نحوهما، السِّجين، الحابس المانع من الحركة»"
          source: "المعجم الوسيط"
          conflict: "الدلالات الأساسية في الوسيط مادية (بساط، سجين) لا تتعلق بمنع العطاء"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة: مَانِع ──
    - lemma: "مَانِع"
      decision: confirmed
      decision_reason: "لمّة فصيحة مؤصَّلة، الوسيط يعرّفها بـ«الضنين الممسك»، ومقاييس اللغة ينصّ على أن م ن ع أصل واحد هو خلاف الإعطاء. وزن فَاعِل على القياس لاسم الفاعل من فَعَلَ الثلاثي"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على مَن يمنع الشيءَ عن غيره قصداً، سواء أكان حقّاً أم عطاءً أم معروفاً، وهو الأعمّ في باب المنع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَانِعٌ"

    # ── لمّة موجودة: مُمْتَنِع ──
    - lemma: "مُمْتَنِع"
      decision: removed
      decision_reason: "الأدلة المعجمية تكاد تُجمع على أن مُمْتَنِع يدلّ على المستحيل (فلسفة) أو غير المنصرف (نحو) أو الممتنع عن التصويت (قانون). لا شاهد معجمي على استعماله بمعنى مَن يَمنع العطاءَ عن غيره. الامتناع فعلٌ لازمٌ (يمتنع عن) بينما المطلوب وصفٌ متعدٍّ (يمنع غيرَه)"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: ضَنِينٌ ──
    - lemma: "ضَنِينٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تشهد له المعاجم الكلاسيكية والحديثة، وله شاهد قرآني. مقاييس اللغة ينصّ على أن ض ن ن أصل يدلّ على البخل بالشيء. والوسيط يعرّف المانعَ بأنه الضنين الممسك، ممّا يؤكد ترادفهما"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بالبخل بالشيء النفيس الذي يُضَنّ به، ويحمل ظلالاً وجدانية أقوى من مَانِع، ويُستعمل غالباً مع الباء (ضنين بكذا)"
      actions:
        - command: create_entry
          params: {lemma: "ضَنِينٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    # ── مرشح المرحلة ١: مَنَّاعٌ ──
    - lemma: "مَنَّاعٌ"
      source: stage1
      decision: removed
      decision_reason: "رغم ثبوته في مقاييس اللغة والقرآن ﴿مَنَّاعٍ لِلْخَيْرِ﴾، فإن صيغة فَعَّال تفيد المبالغة والتكرار، فهي أقرب لوصف السجية الراسخة (كثير المنع) لا لوصف فاعل المنع مطلقاً. إضافته قد تُحدث تداخلاً مع مَانِع دون فارق دلالي واضح على مستوى المجموعة"

    # ── مرشح المرحلة ١: حَابِسٌ ──
    - lemma: "حَابِسٌ"
      source: stage1
      decision: removed
      decision_reason: "الدلالة المعجمية الأساسية مادية (حبس الماء والدواب)، ولم يُعثر على شاهد معجمي لاستعماله بمعنى مَن يمنع العطاءَ أو المنح"

    # ── مرشح المرحلة ١: مُمْسِكٌ ──
    - lemma: "مُمْسِكٌ"
      source: stage1
      decision: removed
      decision_reason: "الوسيط يذكر الممسك بمعانٍ مادية (بساط، سجين، حابس من الحركة). وإن ورد في تعريف المانع (الضنين الممسك) فهو وصف عامّ للإمساك لا مصطلح مستقلّ للشخص الذي يمنع المنح"

