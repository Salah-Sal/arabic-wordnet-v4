# ════════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10680655-n  |  ILI: i93353  |  POS: n
# Concept: stranger — فرد لا تربطك به معرفة
# ════════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي لمّة وحيدة (غَرِيب)؛ مفهوم شائع في العربية يستحق إثراءً بالمرادفات التراثية التي تُعبّر عن فروق دلالية حقيقية"
      - "التعريف الحالي يستخدم 'فرد' بدلاً من 'شخص' الأدق في الدلالة على الإنسان المحدد"
      - "صياغة 'تربطك به' فيها طابع المحادثة المنطوقة؛ الأسلوب المعجمي يقتضي مزيداً من التجريد"
    observations: >
      مفهوم «الغريب» مفهوم اجتماعي أصيل في الثقافة العربية، حاضر في القرآن الكريم والحديث
      النبوي والشعر العربي. الجذر غ-ر-ب يحمل دلالة البُعد عن الوطن والانتقال إلى الأطراف،
      وهو وثيق الصلة بالمعنى المطلوب. التراث العربي يزخر بألفاظ تُعبّر عن هذا المفهوم من
      زوايا مختلفة: البُعد الانتمائي القبلي والمكاني (غريب)، وبُعد المباغتة والظهور الفجائي (طارئ)،
      وبُعد الدخول على الجماعة من خارجها (دخيل). المُفارَق أن كلمة "غريب" هي الأصيل الأكثر
      شيوعاً مع وجود مرادفات كلاسيكية معتبرة.
  blind_candidates:
    - lemma: "نَكِرَة"
      generation_method: majaz
      justification: >
        من الجذر نكر بمعنى الإنكار وعدم المعرفة؛ إزاحة دلالية من المصطلح النحوي
        (الاسم غير المعين) إلى الشخص المجهول الذي لا يُعرَف، إحياءً للمعنى الأصلي للجذر
        قبل اختصاصه بالدرس النحوي.
    - lemma: "مَجهول"
      generation_method: ishtiqaq
      justification: >
        من جذر جهل على وزن مفعول بمعنى "الذي يُجهَل / لا يُعرَف"؛ الوزن يفيد الموصوف
        بانعدام المعرفة، ويُعبّر عن الشخص الذي لا علاقة مسبقة بينك وبينه.
    - lemma: "وَافِد"
      generation_method: majaz
      justification: >
        من جذر وفد على وزن فاعل؛ إحياء للمعنى الاشتقاقي "من قدم من مكان آخر"، بإزاحة
        من الحركة الجغرافية إلى الغرابة الاجتماعية — وهو قريب من "stranger as newcomer".
    - lemma: "طَارِئ"
      generation_method: ishtiqaq
      justification: >
        من جذر طرأ على وزن فاعل — "من ظهر فجأة من مكان بعيد"؛ يُعبّر عن الشخص
        الذي طرأ على جماعة لا تعرفه ولا تعرف شأنه، وهو وصف دقيق لمن "لا تربطك به معرفة".


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفّذت: ٦ استعلامات
#   Q1: مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات)
#   Q2: إثراء مُركَّب (تعريفات + أمثلة + جموع) لأهم المداخل
#   Q3: الجسر الإنجليزي (stranger / outsider / unknown person)
#   Q4: بحث FTS بالكلمات المفتاحية (غريب / ليس من القوم)
#   Q5: مقاييس اللغة لجذر غرب  |  Q6: مقاييس لجذر طرأ (لم يُعثر)
stage2_evidence:
  per_lemma:
    - lemma: "غَرِيب"
      confirm:
        - text: "«الرجل ليس من القوم, ولا من البلد» — جمعه غُرباء"
          source: "المعجم الوسيط (OCR) — entry_id 20403"
        - text: "«(الْغَرِيب) الرجل لَيْسَ من الْقَوْم وَلَا من الْبَلَد (ج) غرباء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani) — entry_id 878677"
        - text: "«غَرِيب: من (غ ر ب) غير المعروف أو المألوف، والرجل ليس من القوم ولا من البلد»"
          source: "موسوعة السلطان قابوس لأسماء العرب — entry_id 936710"
      expands:
        - text: "«stranger: (1) الأجنبيّ (2) الغريب (3) الطارئ؛ الدّخيل (5) الجاهل بالشَّيء [أو غير المُطَّلع عليه]»"
          source: "المورد الحديث (ARABTERM) — entry_id 720392"
          addition: >
            يؤكد أن الغريب هو المقابل الثاني الأرسخ لـ stranger الإنجليزية،
            وأن الطارئ والدخيل مرادفات مستعملة في نفس الحقل الدلالي

    - lemma: "نَكِرَة"
      contradicts:
        - text: "«النكرة: ما وضع لشيء لا بعينه، كرجل، وفرس»"
          source: "كتاب التعريفات للشريف الجرجاني — entry_id 795796"
          conflict: "النكرة مصطلح نحوي صرف يدل على الاسم الشائع في جنسه لا على شخص لا يُعرَف"
        - text: "«النَّكِرَةُ: إنكار الشيء. (عند النحاة): اسم يدل على مسمى شائع في جنس موجود أو مقدَّر»"
          source: "المعجم الوسيط (OCR) — entry_id 30167"
          conflict: "المعنيان المُثبَتان (الإنكار والمصطلح النحوي) لا علاقة لهما بالشخص الغريب"

    - lemma: "مَجهول"
      contradicts:
        - text: "«ضد المعلوم»"
          source: "المعجم الكبير (OCR) — entry_id 68779"
          conflict: "المجهول مفهوم أبستيمي مجرد (ضد المعلوم) لا مفهوم اجتماعي علائقي"
        - text: "«مجهول: ممارسة لإخفاء هوية الكاتب... (anonymous)»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM) — entry_id 497664"
          conflict: "الاستعمال الاصطلاحي يتجه نحو anonymous/unknown لا نحو الغريب الاجتماعي"
      expands:
        - text: "«مَجْهُول: الأمر الذي لا تعرف عنه شيئاً، والحق الذي أضعته»"
          source: "موسوعة السلطان قابوس لأسماء العرب — entry_id 943039"
          addition: "يُستعمل للأشياء المجهولة لا للأشخاص في السياق الاجتماعي"

    - lemma: "وَافِد"
      contradicts:
        - text: "«الوَافِدُ: المرتفِعُ النَّاشِزُ من الخَدِّ عند المضغ (وهما وافدان)؛ من القطا والإبل: ما سبق سائرها»"
          source: "المعجم الوسيط (OCR) — entry_id 33485"
          conflict: "المعجم الوسيط يُعرّفه بمعنيين لا صلة لهما بالغريب: ناشز الخد وسابق الإبل"
        - text: "«وافد: صفة للأمراض التي تنشأ عن أسباب وافدة من مكان بعيد (ecdemic)»"
          source: "المعجم الطبي الموحد (ARABTERM) — entry_id 593586"
          conflict: "الاستعمال الاصطلاحي الحديث يربطه بالمصطلحات الطبية لا بالشخص الغريب"

    - lemma: "طَارِئ"
      confirm:
        - text: "«الطَّارِئ: الغريب» — الجمع: طُرَّاءٌ وطوارئ"
          source: "المعجم الوسيط (OCR) — entry_id 17217"
        - text: "«الطَّارِئُ: الغريب الحادثُ المفاجِئُ»"
          source: "المعجم الكبير (OCR) — entry_id 60299"
        - text: "«(الطَّارِئ) الْغَرِيب (ج) طراء وطرآء وَفِي غير الْعَاقِل طوارئ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani) — entry_id 877153"
        - text: "«stranger: (3) الطارئ؛ الدّخيل»"
          source: "المورد الحديث (ARABTERM) — entry_id 720392"
      contradicts:
        - text: "«طَارِئٌ: حدث صغير يأتي فجأة (incident)»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (ARABTERM) — entry_id 355181"
          conflict: "الاستعمال التقني الحديث طوّع الطارئ بمعنى incident/emergency مما يُفضي إلى التباس في السياقات الرقمية"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "غَرِيب"
      decision: confirmed
      decision_reason: >
        الأصيل في العربية والأوسع انتشاراً في هذا المعنى؛ مؤكَّد بأمهات المعاجم الكلاسيكية
        والمعاصرة. الجذر غرب يحمل دلالة البُعد عن الوطن (الغربة)، فـ"الغريب" من غرب أي
        ابتعد عن موطنه وقومه. يستوفي جميع معايير بوابة الجودة: الاطّراد، يُسر التداول،
        الملاءمة، إيثار التراثي، إيثار العربي، الاشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن البُعد الانتمائي والجغرافي-الاجتماعي: "ليس من القوم ولا من البلد"؛
        دلالته محايدة تصف غياب الانتماء دون إيحاء بالمباغتة أو التوجّس.
        يحمل أحياناً ظلالاً عاطفية تتصل بالوحشة والاغتراب وهو اللفظ المرجعي للمفهوم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَرِيب"

    - lemma: "نَكِرَة"
      source: stage1
      decision: removed
      decision_reason: >
        مصطلح نحوي صرف راسخ يدل على "الاسم الشائع في جنسه غير المعين"، ولا يُستعمل
        في أي مصدر معجمي موثوق بمعنى "شخص لا تعرفه". استعماله بهذا المعنى يُوقع في
        الخلط بين الدلالة النحوية والدلالة الاجتماعية. الجذر المعجمي نكر يدل على الإنكار
        لا على البُعد الشخصي الاجتماعي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مَجهول"
      source: stage1
      decision: removed
      decision_reason: >
        المجهول يدل دلالةً أبستيمية عامة على "ضد المعلوم" في السياقات المنطقية والنحوية
        والرياضية والمعلوماتية. يختلف عن الغريب في أنه وصف معرفي مجرد (epistemically
        unknown) بينما الغريب وصف اجتماعي علائقي (socially unacquainted). اختبار
        الاستبدال يفشل: "رأيت مجهولاً أمام البيت" ≠ "رأيت غريباً" في السياق اليومي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "وَافِد"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكلاسيكية (الوسيط) لا تُعرّف الوافد بأنه الغريب؛ المعنيان المُثبَتان هما
        "ناشز الخد عند المضغ" و"سابق الإبل"، وكلاهما بعيد عن حقل الشخص الغريب.
        الوافد في الاستعمال المعاصر يُستخدم للأمراض الوافدة والمقيمين الوافدين، وهو أخص
        من مفهوم "من لا تربطك به معرفة" ويفتقر إلى الدليل الكافي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "طَارِئ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مؤيَّد بثلاثة مصادر أساسية من أعلى درجات الموثوقية: المعجم الوسيط (OCR)،
        والمعجم الكبير (OCR)، والوسيط الجماعي (Hawramani) — وثلاثتها تُعرّفه صراحةً
        بأنه "الغريب". والمورد الحديث يُدرجه ضمن ترجمات "stranger". فعله طرأ يعني
        الظهور الفجائي من مكان بعيد. الالتباس مع "incident" في المصطلحية التقنية لا يُلغي
        الأصالة اللغوية؛ ويمكن دفعه بالسياق. اختبار الاستبدال نجح: "استقبلوا طارئاً
        لا يعرفونه" مفهوم وفصيح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُضيف إلى دلالة الغريب بُعدَ المباغتة والفجائية: "طرأ" أي ظهر بغتةً من مكان بعيد؛
        يُستعمل حين يُستهجَن وصول الشخص أو يُفاجأ به. أكثر إيحاءً بالحذر والتوجّس
        من "غريب" المحايد نسبياً، وهو أقل شيوعاً في المعاصرة للمعنى الاجتماعي.
      actions:
        - command: create_entry
          params:
            lemma: "طَارِئ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10680655-n"


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "فرد لا تربطك به معرفة"
    assessment:
      decision: revise
      reason: >
        "فرد" كلمة عامة تدل على العضو في مجموعة أو المفرد من شيء، وهي أقل خصوصية
        من "شخص" الذي يدل تحديداً على الإنسان المعيَّن. كما أن "تربطك به" فيه طابع
        المنطوق غير الرسمي، والأسلوب المعجمي يقتضي مزيداً من التجريد كـ"لا صلة بينك
        وبينه" أو "لا تجمعك به معرفة".
    authored:
      - type: terminological
        text: "شَخْصٌ لَيْسَ مِن أَهلِكَ وَلا مِمَّن تَعرِفُهم، لا تَجمَعُكَ بِهِ صِلَةٌ وَلا مَعرِفَة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَن لا تَربِطُهُ بِالمَرءِ مَعرِفَةٌ سابِقَة وَلا صِلَةٌ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10680655-n"
          definition_index: 0
          text: "شَخْصٌ لَيْسَ مِن أَهلِكَ وَلا مِمَّن تَعرِفُهم، لا تَجمَعُكَ بِهِ صِلَةٌ وَلا مَعرِفَة"
      - command: add_definition
        params:
          synset_id: "awn4-10680655-n"
          text: "مَن لا تَربِطُهُ بِالمَرءِ مَعرِفَةٌ سابِقَة وَلا صِلَةٌ"

