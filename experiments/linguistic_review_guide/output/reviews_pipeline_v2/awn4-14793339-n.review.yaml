# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14793339-n (ash / رماد)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «رماد» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط — يمكن التحقق من إمكانية إضافة مرادفات"
      - "التعريف العربي فيه حشو لفظي: «البقايا التي تتبقى» — تكرار دلالي بين المبتدأ والفعل"
    observations: "المفهوم أساسي ومعروف في الثقافة العربية منذ الجاهلية. الرماد حاضر في الشعر والأمثال والكنايات العربية (كثير الرماد = كريم). اللفظ «رماد» هو الأصيل الفصيح المتداول، ولا يحتاج إلى بديل. من المناسب فحص ألفاظ أخرى قريبة كـ«حُرَاقَة» و«خَبَث» لتحديد ما إذا كانت مرادفات حقيقية أم مفاهيم مجاورة."
  blind_candidates:
    - lemma: "رَمَاد"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر ر-م-د على وزن فَعَال، وهو اللفظ العربي الأصيل المعروف لما تخلّف من احتراق المواد، مذكور في جميع المعاجم العربية"
    - lemma: "حُرَاقَة"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر ح-ر-ق على وزن فُعَالَة الدال على بقايا الفعل، قد يدل على ما يتبقى من الحرق"
    - lemma: "خَبَث"
      generation_method: majaz
      justification: "مجاز من معنى نفاية المعدن عند الصهر إلى عموم ما يتخلف من الاحتراق — توسيع دلالي محتمل"
    - lemma: "دُقَاق"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر د-ق-ق على وزن فُعَال بمعنى فتات كل شيء ودقيقه، قد ينطبق على الرماد بوصفه دقاق الفحم"

stage2_evidence:
  per_lemma:
    - lemma: "رَمَاد"
      confirm:
        - text: "«ما تخلَّف من احتراق المواد»"
          source: "المعجم الوسيط"
        - text: "«ما تَخَلَّفَ من احتراقِ المواد, وهو دُقاقُ الفَحْم من حَرَّاقَة النَّار, وما هَبَا من الجمْر فطارَ دُقاقًا»"
          source: "المعجم الكبير"
        - text: "«بقايا صلبة ناتجة عن احتراق المواد العضوية (أي الكائنات الحيّة) مثل: النباتات أو الحيوانات أو الوقود الحفري»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«المواد المعدنية المتبقية بعد حرق المواد العضوية تحت ظروف محددة»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
      expands:
        - text: "«هو كثير الرماد: كريمٌ (كناية)»"
          source: "المعجم الوسيط"
          addition: "استعمال كنائي يدل على الكرم لكثرة الطبخ"
        - text: "«النَّاعِمُ من فُتات الحجارة, واليابسُ من الطين»"
          source: "المعجم الكبير"
          addition: "معنى ثانوي يتوسع فيه اللفظ ليشمل الفتات الناعم من غير المحترقات"
        - text: "«الرَّمَادُ، وَهُوَ مَعْرُوفٌ، فَإِذَا كَانَ أَرَقَّ مَا يَكُونُ فَهُوَ رِمْدِدٌ. وَهُوَ يُسَمَّى لِلَوْنِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ربط اللفظ بأصل اللون الرمادي، والرِّمْدِد للرماد الناعم جداً"
    - lemma: "حُرَاقَة"
      contradicts:
        - text: "«ما تقع فيه النارُ عند القدح من خرقة ونحوها»"
          source: "المعجم الوسيط"
          conflict: "الحُرَّاقة ليست بقايا الاحتراق بل المادة التي تُشعل بها النار (القدّاحة/الصوفانة)"
        - text: "«ضربٌ من السفن فيها مَرامي نيران يُرمى بها العدوُّ فى البحر»"
          source: "المعجم الوسيط"
          conflict: "معنى ثانٍ للحراقة: سفينة حربية، لا علاقة له بالرماد"
    - lemma: "خَبَث"
      contradicts:
        - text: "«ما ينفيه الكيرُ من الحديد ونحوه عند إحمائه وطَرْقه»"
          source: "المعجم الوسيط"
          conflict: "الخَبَث خاص بنفاية المعادن عند الصهر (slag)، وليس بقايا الاحتراق العام"
        - text: "«يُقصد به في مجال تقنية الاحتراق الرماد الذي يتعرّض إلى ما يزيد عن درجة حرارة الرخاوة، فتتغير حالته العادية»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
          conflict: "الخَبَث مصطلح تقني لنوع خاص من الرماد المنصهر في تقنية الاحتراق، وليس مرادفاً عاماً للرماد"
      expands:
        - text: "«الْخَاءُ وَالْبَاءُ وَالثَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الطَّيِّبِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على ضد الطيب عموماً، لا على بقايا الاحتراق"
    - lemma: "دُقَاق"
      contradicts:
        - text: "«فتات كل شيء»"
          source: "المعجم الوسيط"
          conflict: "الدُّقَاق عام جداً يشمل فتات أي شيء، وليس خاصاً ببقايا الاحتراق"
        - text: "«الصَّغِيرُ الرَّدِىءُ فُتَاتُ كُلِّ شىءٍ دُقَّ. وقيل: ما انْدَقَّ مِنَ الشَّىْءِ»"
          source: "المعجم الكبير"
          conflict: "المعنى المعجمي يؤكد العموم: فتات أي شيء مدقوق، لا خصوصية للاحتراق"

stage3_analysis:
  per_lemma:
    - lemma: "رَمَاد"
      decision: confirmed
      decision_reason: "اللفظ العربي الأصيل الوحيد الذي يدل مباشرة على ما تخلّف من الاحتراق. مؤكد في جميع المعاجم العربية الكلاسيكية والحديثة والمصطلحية. جذره ر-م-د مرتبط بالمفهوم لغوياً ودلالياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَمَاد"
    - lemma: "حُرَاقَة"
      source: stage1
      decision: removed
      decision_reason: "الحُرَّاقَة في المعاجم هي ما تقع فيه النار عند القدح (الصوفانة/القدّاحة) أو سفينة حربية. ليست بقايا الاحتراق بل مادة الإشعال. الدلالة مختلفة جوهرياً عن الرماد."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "خَبَث"
      source: stage1
      decision: removed
      decision_reason: "الخَبَث مصطلح خاص بنفاية المعادن عند الصهر والطرق (slag/dross)، وقد اكتسب في الاستعمال التقني الحديث معنى الرماد المنصهر. لكنه ليس مرادفاً عاماً للرماد بل مفهوم مجاور أضيق وأخص."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "دُقَاق"
      source: stage1
      decision: removed
      decision_reason: "الدُّقَاق يعني فتات كل شيء وما دُقّ منه، وهو أعم بكثير من الرماد. رغم أن المعجم الكبير وصف الرماد بأنه «دقاق الفحم»، فإن الدُّقَاق ليس مرادفاً للرماد بل واصفاً لهيئته. لا يصح مرادفاً معجمياً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

