# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-15028364-n (refrigerant)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما مركبتان إضافيتان وصفيتان، ولا يوجد مصطلح مفرد مشتق رغم شيوع «مُبَرِّد» في المعاجم المتخصصة"
      - "اللمّتان بلا تشكيل"
      - "التعريف العربي ترجمة حرفية من الإنجليزية وليس تعريفاً مصطلحياً دقيقاً"
    observations: "المفهوم هو المادة الكيميائية المُستخدمة في دارات التبريد (الثلاجات والمكيفات) لنقل الحرارة عبر التبخّر والتكثّف. المجموعة تندرج تحت «مادة متجانسة» وهو تصنيف صحيح. المصطلح الإنجليزي refrigerant يقابله في المعاجم العربية المتخصصة عدة ألفاظ أبرزها مُبَرِّد (اسم فاعل من بَرَّدَ) ووسيط التبريد ومادة التبريد."
  blind_candidates:
    - lemma: "مُبَرِّد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من بَرَّدَ على وزن مُفَعِّل، يدل على ما يحدث التبريد. مصطلح مفرد مشتق يغني عن المركب الإضافي."
    - lemma: "بَرُود"
      generation_method: ishtiqaq
      justification: "على وزن فَعُول الدال على الخاصية الذاتية، أي ما من شأنه البرد. له أصل في المعاجم الكلاسيكية."
    - lemma: "عَامِل تَبْرِيد"
      generation_method: tarkib
      justification: "مركب إضافي يصف المادة بوصفها عاملاً فاعلاً في عملية التبريد، مسجّل في المعجم الموحد للكيمياء."
    - lemma: "مُثَلِّج"
      generation_method: ishtiqaq
      justification: "اسم فاعل من ثَلَّجَ على وزن مُفَعِّل، يدل على ما يحدث التجميد/التبريد الشديد."

stage2_evidence:
  per_lemma:
    - lemma: "مَادَّة تَبْرِيد"
      confirm:
        - text: "«(1) مُبرِّد (2) مُلَطِّف [لحرارة الجسد والحمّى] (3) المُبَرِّد؛ مادة التبريد (4) المُلَطِّف: عقّار ملطِّفٌ للحرارة.»"
          source: "المورد الحديث (2008)"

    - lemma: "وَسِيط تَبْرِيد"
      confirm:
        - text: "«هو غاز سريع الغليان يُستخدم في مُكيّفات الهواء. وتتمثل وظيفته داخل دورة التبريد المُغلقة في امتصاص الحرارة من المقصورة الداخلية للسيارة، ونقلها إلى مكان آخر، وتصريفها من هناك إلى الخارج»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
        - text: "«وسيط التبريد = coolant»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«وسيط تبريد = cooling agent»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية: طباعة-كهرباء (1996)"
      expands:
        - text: "«مادة أو خليط من مواد غازية، سائلة أو صلبة، والتي تستخدم لتبديد الحرارة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يوسّع الدلالة لتشمل أي مادة لتبديد الحرارة لا التبريد الميكانيكي فحسب"

    - lemma: "مُبَرِّد"
      confirm:
        - text: "«السائل أو الغاز المستعمل في التبريد.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«سائل مثل الفريون، يُستخدم في أجهزة التبريد لامتصاص الحرارة من الهواء المُحيط أو السوائل أثناء تبخّرها.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«مائع يُستخدم لإجراء عملية التبريد في نظام تبريد معين، حيث يمتص هذا المائع الحرارة عند درجات حرارة وضغط منخفضين أثناء عملية التبخر ويطردها عند درجات حرارة وضغط مرتفعين أثناء عملية التكثيف.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«مبرِّد = coolant»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«مبرد = refrigerant»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"

    - lemma: "بَرُود"
      contradicts:
        - text: "«كُحْلٌ أو دواءٌ يُسكِّنُ حرارة العين. الخُبْرُ المَبْلولُ بالماء البارد تطعمه المرأة للسَّمن. من الثياب: ما ليس له زَغَب أو وَبَر.»"
          source: "المعجم الكبير"
          conflict: "البَرُود في المعاجم التقليدية يعني الكحل أو الدواء المسكّن للحرارة أو نوعاً من الثياب، ولم يُسجَّل كمصطلح تقني لمادة التبريد الصناعية"
      expands:
        - text: "«(البرود) كل ما يُبرَّد به شيء كالشراب تبرد به الغلة والكحل تبرد به العين»"
          source: "المعجم الوسيط"
          addition: "المعنى العام قريب لكنه مرتبط بالأدوية والأشربة لا بالمواد الصناعية"

    - lemma: "عَامِل تَبْرِيد"
      confirm:
        - text: "«عميل تبريد، عامل تبريد = cooling agent»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"

    - lemma: "مُثَلِّج"
      confirm:
        - text: "«مثلِّج = refrigerant»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "مَادَّة تَبْرِيد"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت مسجّل في المورد الحديث مرادفاً لـ refrigerant، شائع الاستعمال في الكتابة العامة والتقنية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير عامّ يصف المادة بوظيفتها التبريدية، يُستخدم في السياق غير التخصصي والإعلامي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة تَبْرِيد"

    - lemma: "وَسِيط تَبْرِيد"
      decision: confirmed
      decision_reason: "مصطلح تقني مسجّل في عدة معاجم موحّدة (هندسة السيارات، الكهرباء، الطاقة المتجددة) بدلالة refrigerant وcoolant"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على دور المادة بوصفها وسيطاً ناقلاً للحرارة ضمن دارة مغلقة، مصطلح تقني هندسي متخصص"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَسِيط تَبْرِيد"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُبَرِّد"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مفرد مشتق شائع جداً في المعاجم المتخصصة (الفيزياء، الكيمياء، تقانات الأغذية، الطاقة المتجددة، المياه) بدلالتَيْ refrigerant وcoolant. يسدّ فجوة غياب المصطلح المفرد في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المفرد الأكثر شيوعاً واختصاراً، يدل على المادة بصفتها فاعلة التبريد مباشرة، صالح للسياقات التقنية والعامة على السواء"
      actions:
        - command: create_entry
          params:
            lemma: "مُبَرِّد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "بَرُود"
      source: stage1
      decision: removed
      decision_reason: "الدلالة المعجمية التراثية للبَرُود مرتبطة بالكحل والأدوية والثياب، ولم يُسجَّل في أي معجم متخصص حديث كمصطلح لمادة التبريد الصناعية. إحياؤه هنا يُحدث لبساً مع دلالاته القديمة."
      evidence_assessment:
        case: mixed

    - lemma: "عَامِل تَبْرِيد"
      source: stage1
      decision: removed
      decision_reason: "مسجّل في معجم الكيمياء الموحد بدلالة cooling agent، لكنه مرادف ضعيف ومكرّر وظيفياً مع اللمّتين المركبتين الموجودتين (مادة تبريد، وسيط تبريد). إضافته لا تثري المجموعة."
      evidence_assessment:
        case: confirm_only

    - lemma: "مُثَلِّج"
      source: stage1
      decision: removed
      decision_reason: "مسجّل في معجم الفيزياء بدلالة refrigerant، لكن التثليج أقرب دلالياً للتجميد (freezing) منه للتبريد (cooling/refrigeration)، والمصطلح نادر الاستعمال في الأدبيات التقنية المعاصرة."
      evidence_assessment:
        case: confirm_only

