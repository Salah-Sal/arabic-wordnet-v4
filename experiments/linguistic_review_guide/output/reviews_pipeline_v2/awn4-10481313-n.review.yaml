# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10481313-n
# one having power to influence another
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «صاحب نفوذ» تعبير مركب إضافي يحتاج اختبار التثبيت المعجمي"
      - "اللمّة «مؤثر» بدون تشكيل في البيانات المصدرية"
      - "المجموعة تحتوي لمّتين فقط؛ يمكن إثراؤها بمرادفات إضافية"
    observations: >
      المفهوم يدلّ على شخص يملك القدرة على التأثير في غيره، وهو مفهوم اجتماعي-سياسي
      مركزي في الثقافة العربية. الجذران الأساسيان هما «ن-ف-ذ» (المضاء والسلطان)
      و«أ-ث-ر» (تقديم الشيء والبقيّة). التراث العربي غنيّ بألفاظ تدلّ على السلطة
      والجاه والنفوذ، ممّا يتيح اختيار مرادفات دقيقة.
  blind_candidates:
    - lemma: "مُتَنَفِّذ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من تنفّذ (الباب الخامس) من الجذر ن-ف-ذ، بمعنى من صار ذا نفوذ
        وسلطان. الوزن تَفَعَّلَ يفيد التكلّف والصيرورة، فالمتنفِّذ هو من حصّل النفوذ
        واستعمله.
    - lemma: "وَجِيه"
      generation_method: majaz
      justification: >
        من الوجاهة والجاه، أي ذو المكانة الاجتماعية التي تمكّنه من التأثير. الوزن
        فَعِيل يدلّ على الصفة الراسخة. ورد في القرآن الكريم: «وَجِيهًا فِي الدُّنْيَا
        وَالْآخِرَةِ».
    - lemma: "نَافِذ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من نفذ، والجذر ن-ف-ذ يدلّ على المضاء. يُقال «رجل نافذ في أموره»
        أي ماضٍ فيها. قد يُستعمل بمعنى ذي النفوذ.
    - lemma: "ذُو نُفُوذ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «ذو» (صاحب) + «نفوذ» (السلطان والقوة). ورد في المعجم
        الوسيط: «فلان ذو نفوذ عظيم».


stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "صَاحِبُ نُفُوذ"
      confirm:
        - text: "«(5) شخص ذو نفوذ»"
          source: "المورد الحديث (2008) — مدخل influence"
        - text: "«النّفُوذ: السُّلْطَان وَالْقُوَّة. يُقَال فلَان ذُو نُفُوذ عَظِيم»"
          source: "المعجم الوسيط — مدخل النفوذ"
        - text: "«الصَّاحِبُ: الرفيقُ مالكُ الشَّيءِ»"
          source: "المعجم الكبير — مدخل الصاحب"
        - text: "«صاحبُ الحاجةِ: طالِبُها... القائمُ على الشَّيْءِ»"
          source: "المعجم الكبير — مدخل صاحب"
      expands:
        - text: "«(10) أصحاب النفوذ»"
          source: "المورد الحديث (2008) — مدخل interest"
          addition: "صيغة الجمع «أصحاب النفوذ» مستعملة للدلالة على الجماعة ذات النفوذ"
        - text: "«(3) شخص [أو شيء] ذو سلطة ونفوذ»"
          source: "المورد الحديث (2008) — مدخل potency"
          addition: "يربط النفوذ بالسلطة والفعّالية"

    - lemma: "مُؤَثِّر"
      confirm:
        - text: "«(1) مُؤَثِّر (2) متنفّذ: ذو سلطةٍ أو نفوذ.»"
          source: "المورد الحديث (2008) — مدخل influential"
        - text: "«يظهر المؤثر في إطار جرد الأدوار السردية المطالبة بوظيفة تأثير في الآخرين»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«المُؤَثِّرُ: مَا ظهر تَأْثِيره فِي الحكم»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "الاستعمال الكلاسيكي يركّز على التأثير في الحكم (السببيّة) لا في الأشخاص"
        - text: "«الْمُؤثر: مَا لَهُ تَأْثِير فِي الشَّيْء إِمَّا تَامّ فَهُوَ الْعلَّة التَّامَّة أَو غير تَامّ فَهُوَ الْعلَّة النَّاقِصَة»"
          source: "دستور العلماء للأحمدنكري"
          addition: "الاستعمال الفلسفي/الكلامي للمؤثر بمعنى العلّة الفاعلة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُتَنَفِّذ"
      confirm:
        - text: "«(1) مُؤَثِّر (2) متنفّذ: ذو سلطةٍ أو نفوذ.»"
          source: "المورد الحديث (2008) — مدخل influential"
        - text: "«البلوتوقراطيّ: شخص متنفِّذٌ بسببٍ من ثروته.»"
          source: "المورد الحديث (2008) — مدخل plutocrat"
        - text: "«المَحْمِيّ؛ الصنيعة: شخص تحت حماية أو رعاية متنفِّذٍ أو ذي سلطان.»"
          source: "المورد الحديث (2008) — مدخل protégé"

    - lemma: "وَجِيه"
      confirm:
        - text: "«الْوَجِيه: ذُو الجاه وَسيد الْقَوْم»"
          source: "المعجم الوسيط — مدخل الوجيه"
        - text: "«الوجيه: من فيه خصال حميدة من شأنه أن يعرف ولا ينكر»"
          source: "كتاب التعريفات للجرجاني"
      contradicts:
        - text: "«(1) اعتبار؛ جاه؛ مقام: احترام أو نفوذ ناشئان عن الثروة أو النجاح»"
          source: "المورد الحديث (2008) — مدخل prestige"
          conflict: "الوجاهة تدلّ على المكانة والجاه لا على القدرة الفعلية على التأثير في الآخرين"

    - lemma: "نَافِذ"
      confirm:
        - text: "«رجل نَافِذ فِي أُمُوره: مَاض»"
          source: "المعجم الوسيط — مدخل النافذ"
      contradicts:
        - text: "«نَافِذ: من (ن ف ذ) الماضي في أموره، والطريق النافذ: السالك العام، وأمر نافذ: مطاع»"
          source: "موسوعة السلطان قابوس"
          conflict: "نافذ يدلّ على المضاء في الأمور الذاتية لا على التأثير في الآخرين كأشخاص"
        - text: "«السائل المار من خلال غشاء»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "الاستعمال الاصطلاحي الحديث تقني (نفاذية مادية) لا اجتماعي"

    - lemma: "ذُو نُفُوذ"
      confirm:
        - text: "«النّفُوذ: السُّلْطَان وَالْقُوَّة. يُقَال فلَان ذُو نُفُوذ عَظِيم»"
          source: "المعجم الوسيط — مدخل النفوذ"
        - text: "«(ب) ذو نفوذ a weighty merchant»"
          source: "المورد الحديث (2008) — مدخل weighty"
        - text: "«(ب) ذو نفوذ أو سلطان بسبب من ثروته»"
          source: "المورد الحديث (2008) — مدخل plutocratic"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "صَاحِبُ نُفُوذ"
      decision: confirmed
      decision_reason: >
        تعبير إضافي ثابت في الاستعمال العربي المعاصر للدلالة على الشخص ذي السلطان
        والقدرة على التأثير. ورد في المورد الحديث بصيغة «شخص ذو نفوذ» و«أصحاب
        النفوذ»، وهو متداول في الإعلام والسياسة. يحتاج تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يركّز على امتلاك النفوذ (السلطان والقوة) كسمة ذاتية للشخص، ويُستعمل غالباً
        في السياقات السياسية والإدارية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَاحِبُ نُفُوذ"

    - lemma: "مُؤَثِّر"
      decision: confirmed
      decision_reason: >
        اسم فاعل من أثّر (الباب الثاني)، مستعمل في العربية المعاصرة بمعنى «ذو تأثير
        في الآخرين». ورد في المورد الحديث ترجمةً لـ influential، وفي معجم اللسانيات
        بمعنى من يمارس وظيفة التأثير. الاستعمال الكلاسيكي فلسفي (العلّة المؤثرة)
        لكن المعنى المعاصر راسخ. يحتاج تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على فعل التأثير ذاته (إحداث تغيير في الآخرين)، وهو أعمّ من «صاحب نفوذ»
        إذ لا يشترط وجود سلطة رسمية بل مجرّد القدرة على التأثير.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُؤَثِّر"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُتَنَفِّذ"
      source: stage1
      decision: confirmed
      decision_reason: >
        اسم فاعل من تنفّذ، ورد في المورد الحديث ترجمةً صريحةً لـ influential بمعنى
        «ذو سلطة أو نفوذ». كذلك استُعمل في سياقات متعددة (البلوتوقراطي، المحمي)
        بما يؤكد ثبات الدلالة. لفظ فصيح مشتقّ من جذر عربي أصيل (ن-ف-ذ) على
        وزن متفعّل المنتج.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ على من حصّل النفوذ واستعمله فعلياً في ممارسة السلطة، ويتضمّن إيحاءً
        بالتكلّف والاكتساب (وزن تفعّل)، فهو أقرب إلى السلطة الفعلية من مجرّد
        القدرة على التأثير.
      actions:
        - command: create_entry
          params:
            lemma: "مُتَنَفِّذ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "وَجِيه"
      source: stage1
      decision: removed
      decision_reason: >
        الوجيه في المعاجم يدلّ على ذي الجاه والمكانة الاجتماعية (المعجم الوسيط:
        «ذو الجاه وسيد القوم»)، وهو أقرب إلى المنزلة والاحترام منه إلى القدرة
        الفعلية على التأثير في الآخرين. الفرق الدلالي واضح: الوجاهة صفة سلبية
        (تُمنح من المجتمع)، بينما التأثير فعل إيجابي (يمارسه الشخص).
      evidence_assessment:
        case: mixed

    - lemma: "نَافِذ"
      source: stage1
      decision: removed
      decision_reason: >
        نافذ في المعاجم يدلّ على المضاء في الأمور الذاتية (المعجم الوسيط: «رجل
        نافذ في أموره: ماض»)، والاستعمال الاصطلاحي المعاصر تقنّي (نفاذية مادية).
        لا يدلّ على التأثير في أشخاص آخرين كما يقتضي تعريف المجموعة. كما أنّ
        «أمر نافذ» يعني مُطاعاً، فالنفاذ صفة للأمر لا للشخص.
      evidence_assessment:
        case: mixed

    - lemma: "ذُو نُفُوذ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير مؤكَّد في المعاجم لكنّه يكاد يكون مطابقاً لـ«صاحب نفوذ» الموجود
        أصلاً في المجموعة. اختبار الاستبدال: «ذو» و«صاحب» متبادلان في هذا السياق
        دون تغيير في المعنى. إضافته تُحدث ازدواجاً لا ترادفاً حقيقياً.
      evidence_assessment:
        case: confirm_only


