step4_relations:
  hypernymy:
    current_hypernym: "جَوْدَة"
    test_result: "wrong"

  antonymy:
    per_lemma:
      - lemma: "ضَعْف"
        antonym_found: true
        antonym: "قُوَّة"
      - lemma: "عَجْز"
        antonym_found: true
        antonym: "قُدْرَة"

  verb_checks:
    applicable: false

  selectional_restrictions:
    - lemma: "ضَعْف"
      constraint: "عام (كيانات مادية، سمات، مجردات)"
    - lemma: "عَجْز"
      constraint: "كائن حي أو نظام وظيفي (يتطلب قدرة كامنة)"

  reasoning:
    hypernymy_justification: "التعميم الحالي (جودة) غير صحيح دلالياً؛ 'الضعف' و'العجز' هما حالات/سمات سلبية، وليستا نوعاً من 'الجودة' (التي غالباً ما تعني التميز)."
    antonymy_justification: "تم تحديد أضداد مباشرة لكل لمّة (قوة، قدرة) وهي غير موجودة في المجموعة، لذا لا يوجد تضاد داخلي."
    selectional_reasoning: "'العجز' يتطلب وجود قدرة مفترضة مسبقاً لدى الفاعل، بينما 'الضعف' مصطلح أكثر عمومية."

  actions:
    - command: "صعّد للمراجع البشري"
      params:
        issue: "خطأ في علاقة الاشتمال (Hypernym)"
        note: "يجب تغيير المشتمِل من 'جودة' إلى 'حالة' أو 'سِمَة'."

    - command: "أضف علاقة دلالية"
      params:
        source_lemma: "ضَعْف"
        relation: "antonym"
        target: "قُوَّة"

    - command: "أضف علاقة دلالية"
      params:
        source_lemma: "عَجْز"
        relation: "antonym"
        target: "قُدْرَة"

    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "عَجْز"
        note: "يتطلب كياناً ذا قدرة وظيفية (فاعل أو عضو)"