step1_lemma_validation:
  per_lemma:
    - lemma: "أسيتات"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة معجمياً، المصطلح الأكثر شيوعاً في السياق العلمي"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "أدلة قوية من المعجم الكبير والمراجع العلمية"
        nuance_differentiation: "يتميّز بأنه المصطلح العلمي الدولي المعرّب الأكثر شيوعاً في الاستخدام المعاصر"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "أسيتات"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "أسيتات"
            note: "المصطلح العلمي الدولي المعرّب الأكثر شيوعاً"

    - lemma: "خلات"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة معجمياً، المقابل العربي الأصيل"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "أدلة مؤكّدة من المعجم الموحد لمصطلحات تقانات الأغذية"
        nuance_differentiation: "يتميّز بأنه المقابل العربي الأصيل المشتق من الجذر (خلّ)"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "خلات"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "خلات"
            note: "المقابل العربي الأصيل المشتق من الجذر (خلّ)"

    - lemma: "إيثانوات"
      decision: "removed"
      decision_reason: "لا سند معجمي مباشر ولا ارتباط دلالي كافٍ لتوثيقها"
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "fail"
      reasoning:
        evidence_weight: "لا أدلة معجمية"
        linguist_justification: "على الرغم من كونها تسمية نظامية (IUPAC)، إلا أنها تفتقر إلى التوثيق المعجمي في المصادر المتاحة، والاكتفاء بالأسيتات والخلات كافٍ"
        removal_justification: "غياب الدليل المعجمي"
      actions:
        - command: "احذف ارتباط اللمّة بالمجموعة"
          params:
            lemma: "إيثانوات"
            reason: "غياب السند المعجمي"