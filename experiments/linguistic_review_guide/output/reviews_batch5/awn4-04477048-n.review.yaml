step0_evidence:
  per_lemma:
    تلفريك:
      evidence_status: expands
      evidence_details:
      - '«تلفريكتِلِفْريك [مفرد]: وسيلة مواصلات معلّقة تعمل بالكهرباء وتسير على أسلاك معلقة في الهواء» — معجم اللغة العربية المعاصرة لأحمد مختار عمر'
    ترامواي:
      evidence_status: contradicts
      evidence_details:
      - «ترام؛ ترامواي.» — المورد الحديث
      - «ترامواي» — المعجم الموحد لمصطلحات النقل (2010)
    قطار هوائي:
      evidence_status: no_material_found
step1_lemma_validation:
  per_lemma:
  - lemma: تلفريك
    decision: confirmed
    decision_reason: المصطلح الأكثر دقة وشيوعاً للمفهوم؛ الأدلة تدعم استخدامه
    evidence_assessment:
      case: expands
      notes:
      - الأدلة المعجمية تؤكد مطابقة المفهوم
    substitution_test:
      result: pass
    reasoning:
      evidence_weight: أدلة قوية ومتوافقة مع المفهوم
      nuance_differentiation: يتميّز بكونه المصطلح التقني الشائع والأكثر دقة للمركبات المعلقة بالكابلات
    actions:
    - &id001
      command: أكّد صلاحية اللمّة
      params:
        lemma: تلفريك
  - lemma: ترامواي
    decision: removed
    decision_reason: تناقض مع تعريف المفهوم؛ الترامواي وسيلة أرضية
    evidence_assessment:
      case: contradicts
      notes:
      - 'تناقض: المعنى المعجمي (ترام أرضي) يختلف عن تعريف المجموعة (وسيلة معلقة)'
    substitution_test:
      result: fail
      failure_sentences:
      - original: ركبنا التلفريك للوصول للقمة
        substituted: ركبنا الترامواي للوصول للقمة
        preserved_meaning: false
        why_failed: الترامواي لا يسير في الهواء عبر كابلات
    reasoning:
      evidence_weight: تناقض واضح مع المفهوم المقصود
      removal_justification: اللمّة تشير إلى وسيلة نقل أرضية (Tram) ولا تنطبق على المفهوم المعلق (Ropeway)
    actions:
    - &id002
      command: احذف ارتباط اللمّة بالمجموعة
      params:
        lemma: ترامواي
        reason: التناقض الدلالي مع تعريف المفهوم (وسيلة أرضية مقابل معلقة)
  - lemma: قطار هوائي
    decision: removed
    decision_reason: تعبير وصفي/ترجمة حرفية وليس مصطلحاً معجمياً مستقراً
    evidence_assessment:
      case: no_material
    substitution_test:
      result: fail
      failure_sentences:
      - original: استخدم التلفريك لنقل البضائع
        substituted: استخدم القطار الهوائي لنقل البضائع
        preserved_meaning: true
        why_failed: الاستبدال مقبول دلالياً لكنه ليس مصطلحاً بل وصفاً
    reasoning:
      evidence_weight: لا سند معجمي؛ اللمّة تعبير وصفي
      removal_justification: تعبير وصفي زائد، والمصطلح المعجمي 'تلفريك' يغني عنه
    actions:
    - &id003
      command: احذف ارتباط اللمّة بالمجموعة
      params:
        lemma: قطار هوائي
        reason: تعبير وصفي/ترجمة حرفية، وجود 'تلفريك' يغني عنه
step2_missing_lemmas:
  per_candidate:
  - lemma: الطريق الحَبْليّ
    status: added
    evidence_source: step5_english_bridge
    justification: مصطلح فصيح ودقيق يصف نظام النقل الذي يعتمد على الكابلات المعلقة (Ropeway) كما ورد في المورد الحديث، وهو مرادف دقيق لـ Aerial Tramway.
  - lemma: ترامواي
    status: rejected
    justification: يشير المصطلح إلى وسيلة نقل تسير على قضبان أرضية (Tram/Streetcar)، ولا ينطبق على الأنظمة المعلقة.
  - lemma: ترام
    status: rejected
    justification: مصطلح يشير إلى عربة السكة الحديدية الأرضية.
  - lemma: خط ترام
    status: rejected
    justification: يشير إلى البنية التحتية للنقل الأرضي (Tramway).
  - lemma: عربة ترام
    status: rejected
    justification: تسمية لعربة الترام الأرضية.
  - lemma: محطة ترام
    status: rejected
    justification: تسمية لمكان توقف الترام الأرضي.
  - lemma: قاطرة
    status: rejected
    justification: تشير إلى وسيلة جر أرضية للقطارات.
  - lemma: مقطورة
    status: rejected
    justification: تشير إلى عربة تجرها قاطرة أرضية.
  - lemma: قطار
    status: rejected
    justification: مصطلح عام يغلب استخدامه على النقل السككي الأرضي.
