step0_raw: "\nstep0_evidence:\n  per_lemma:\n    ضَعْف:\n      confirm:\n        - \"«ضعف الحيوية.» — المعجم الموحد لمصطلحات الطب البيطري (2010)\"\n        - \"«والضُّعْفْ: خلاف القوّة. ويقال: الضَّعْفُ\
  \ في العقل والرأي، والضُّعْفُ في الجسد.» — كتاب العين للخليل بن أحمد الفراهيدي\"\n        - \"«الضَعْفُ والضُعْفُ: خلاف القوَّة. وقد ضَعُفَ فهو ضعيفٌ» — تاج اللغة وصِحاح العربية للجوهري\"\n        - \"\
  «يَدُلُّ أَحَدُهُمَا عَلَى خِلَافِ الْقُوَّةِ... فَالْأَوَّلُ: الضَّعْفُ وَالضُّعْفُ، وَهُوَ خِلَافُ الْقُوَّةِ.» — مقاييس اللغة لابن فارس\"\n        - \"«فيه ضعف وضعف وهو ضعيف» — أساس البلاغة للزمخشري\"\
  \n        - \"«الضَّعْف بالفَتْح في الرَّأى والعَقْل، والضُّعْفُ بالضَّم. في البَدَن.» — المجموع المغيث في غريبي القرآن والحديث لأبو موسى المديني\"\n        - \"«الضَّعْفُ والضُّعْفُ: خْلافُ القوة، وقد\
  \ ضَعُفَ وضَعَفَ» — الشوارد للصغاني\"\n      expands:\n        - \"«hypodynamia» — المعجم الطبي الموحد (2009)\"\n        - \"«asthenia; weakness» — المعجم الموحد لمصطلحات الطب البيطري (2010)\"\n     \
  \   - \"«أضعفته إضعافاً، أي: صيرته ضعيفاً. واستضعفته: وجدته ضعيفاً فركبته بسوء. وفي معنى آخر : أضعفت الشيء إضعافاً، وضاعفته مضاعفة، وضعّفته تضعيفاً، وهو إذا زاد على أصله فجعله مثلين أو أكثر.» — كتاب العين\
  \ للخليل بن أحمد الفراهيدي\"\n        - \"«ذكر الخليل أن التَضْعيفَ أن يزاد على أصل الشئ فيجعل مثلين أو أكثر. وكذلك الإضعافُ والمُضاعَفَةُ.» — تاج اللغة وصِحاح العربية للجوهري\"\n        - \"«أَمَّا الْأَصْلُ\
  \ الْآخَرُ... وَهُوَ أَنْ يُزَادَ عَلَى أَصْلِ الشَّيْءِ فَيُجْعَلَ مِثْلَيْنِ أَوْ أَكْثَرَ.» — مقاييس اللغة لابن فارس\"\n        - \"«وضعفتهم بقومي: كثرتهم لأنهم أضعافهم. وأضعف له العطاء وضعفه وضاعفه.\
  \ ومن المجاز: هو في أضعاف الكتاب وتضاعيفه: في أثنائه وأوساطه» — أساس البلاغة للزمخشري\"\n        - \"«تَضْعُفُ صلاةُ الجماعةِ على صلاةِ الفَذِّ كَذا وكَذَا : أي تُزَادُ. ويقال: ضَعَّفتُه وأضْعَفْته وضاعَفْته:\
  \ إذا زِدْتَ عليه مثلَه أو أَكثَر.» — المجموع المغيث في غريبي القرآن والحديث لأبو موسى المديني\"\n        - \"«مَنْ كَانَ مُضْعِفاً فَلْيرْجِع أَيْ مَنْ كَانَتْ دَابَّتُه ضَعِيفَة... وَفِي حَدِيثِ أَبِي\
  \ الدَّحْدَاحِ: إِلَّا رَجَاءَ الضِّعْف فِي المَعادِ أَيْ مِثْلَيِ الأجْرِ» — النهاية في غريب الحديث والأثر لأبي السعادات ابن الأثير الجزري\"\n        - \"«لِفُلَانٍ عَلَيَّ دَرَاهِمُ (مُضَاعَفَةٌ) فَعَلَيْهِ\
  \ سِتَّةُ دَرَاهِمَ... وَعَنْ الشَّافِعِيِّ... أَعْطُوا فُلَانًا ضِعْفَ مَا يُصِيبُ وَلَدِي قَالَ يُعْطَى مِثْلَهُ مَرَّتَيْنِ» — المغرب في ترتيب المعرب للمُطَرِّزي\"\n    عَجْز:\n      confirm:\n   \
  \     - \"«عجز: أعجزني فلان إذا عجزت عن طلبه وإدراكه. والعجزُ نقيض الحزم. وعَجَزَ يَعْجِزُ عَجْزا فهو عاجزٌ ضعيفٌ.» — كتاب العين للخليل بن أحمد الفراهيدي\"\n        - \"«والعَجْزُ: الضعف. تقول: عَجَزْتُ\
  \ عن كذا أعْجِزُ بالكسر عَجْزاً ومَعْجِزَةً ومعجزة ومعجزا ومعجزا بالفتح أيضا على القياس.» — تاج اللغة وصِحاح العربية للجوهري\"\n        - \"«فَالْأَوَّلُ عَجِزَ عَنِ الشَّيْءِ يَعْجِزُ عَجْزًا، فَهُوَ\
  \ عَاجِزٌ، أَيْ ضَعِيفٌ. وَقَوْلُهُمْ إِنَّ الْعَجْزَ نَقِيضُ الْحَزْمِ فَمِنْ هَذَا; لِأَنَّهُ يَضْعُفُ رَأْيُهُ.» — معجم مقاييس اللغة لابن فارس\"\n        - \"«عجز: disability» — المَكنَز الزراعي متعدد\
  \ اللغات\"\n        - \"«عجز: disability» — موسوعة الكهرباء (IEC 60050)\"\n        - \"«عجز: disability» — المعجم الطبي الموحد (2009)\"\n        - \"«عَجْزٌ: infirmity» — المعجم الطبي الموحد (2009)\"\n\
  \        - \"«عجْز: invalidity» — المعجم الموحد لمصطلحات القانون (2017)\"\n        - \"«عجز: deficit» — المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)\"\n        - \"«عجْز: deficit» — مسرد الجغرافيا\
  \ والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)\"\n      expands:\n        - \"«وفي الحديث: \" لا تلثو بدار معجزة \"، أي لا تقيموا ببلدة تَعجِزون فيها عن الاكتساب والتعيُّش.» — تاج\
  \ اللغة وصِحاح العربية للجوهري\"\n        - \"«والعجوز: المرأة الشيخة. ويُجْمَعُ عجائز، والفعل: عجزت. وعجَزت تعجز عجْزاً، وعجّزت تعجيزاً، والتخفيف أحسن. ويقال للمرأة: اتقي الله في شيبتك، وعجزِكِ، أي:\
  \ حين تصيرين عجوزا.» — كتاب العين للخليل بن أحمد الفراهيدي\"\n        - \"«وَعَجَزَتِ الْمَرْأَةُ تَعْجُزُ بِالضَّمِّ عَجُوزًا، أَيْ صَارَتْ عَجُوزًا.» — معجم مقاييس اللغة لابن فارس\"\n        - \"«والعَجَزُ:\
  \ داءٌ يأخذ الدّابّة في عجُزِها فتثقل.» — كتاب العين للخليل بن أحمد الفراهيدي\"\n      contradicts:\n        - \"«عجز: sacrum (تركيب عظمي ينشأ من اتحاد الفقرات العجزية)» — المعجم الموحد لمصطلحات علم الأحياء\
  \ (1993)\"\n        - \"«عجز: sacrum» — المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)\"\n        - \"«العَجُز: sacrum NA» — المعجم الطبي الموحد (2009)\"\n        - \"«عجُز: sacrum; rump (عظم في\
  \ آخر العمود الفقريّ.)» — المعجم الموحد لمصطلحات الطب البيطري (2010)\"\n        - \"«العَجُزُ: يذكر ويؤنث، وتأنيثه أكثر؛ وهي العجيزة.» — المذكر والمؤنث لابن التستري الكاتب\"\n        - \"«العجز: مؤخر\
  \ الشئ، يؤنث ويذكَّر. وهو للرجل والمرأة جميعاً. والعَجيزَةُ، للمرأة خاصة.» — تاج اللغة وصِحاح العربية للجوهري\"\n        - \"«وَأَمَّا الْأَصْلُ الْآخَرُ فَالْعَجُزُ: مُؤَخَّرُ الشَّيْءِ، وَالْجَمْعُ\
  \ أَعْجَازٌ، حَتَّى إِنَّهُمْ يَقُولُونَ: عَجُزُ الْأَمْرِ، وَأَعْجَازُ الْأُمُورِ.» — معجم مقاييس اللغة لابن فارس\"\n"
