step3_definition:
  definition_review_flag: false
  current_definition: صفة الافتقار إلى القوة أو القدرة؛ الضعف والوهن
  assessment:
    decision: revise
    reason: التعريف الحالي يحتوي على دور منطقي (استخدام كلمة 'الضعف' في التعريف) ويحتاج إلى صياغة أكثر دقة وموضوعية لتشمل 'العجز' و'الضعف' دون تكرار.
  authored_definitions:
  - type: terminological
    text: حالة من نقص القدرة أو القوة المادية أو المعنوية تمنع الفرد من إتمام الفعل أو تحمّل المشقة.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  - type: linguistic
    text: فقدان القدرة أو القوة اللازمة للقيام بالفعل أو تحمّل الأمر.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  reasoning:
    revision_justification: التعريف الأصلي كان دائرياً (عرّف الضعف بالضعف). التعريف الجديد يفكك المفهوم إلى 'نقص القدرة أو القوة' وهو ما يغطي شقي المعنى (العجز والضعف) بشكل موضوعي.
    dictionary_comparison: المعاجم (مثل كتاب العين ومقاييس اللغة) تُعرّف الضُّعْف بخلاف القوة، والعجز بنقيض الحزم أو عدم القدرة على الفعل، وهو ما تم دمجه في التعريف المصطلحي.
    terminological_strategy: الجنس القريب = 'حالة' + الفصل المميّز = 'نقص القدرة أو القوة المادية أو المعنوية التي تمنع من الفعل'.
    linguistic_strategy: تبسيط التعريف ليكون 'فقدان القدرة أو القوة اللازمة' لسهولة الاستيعاب.
  actions:
  - &id006
    command: عدّل نص التعريف
    params:
      definition_index: 0
      new_text: حالة من نقص القدرة أو القوة المادية أو المعنوية تمنع الفرد من إتمام الفعل أو تحمّل المشقة.
  - &id007
    command: ألّف تعريفاً جديداً
    params:
      type: linguistic
      text: فقدان القدرة أو القوة اللازمة للقيام بالفعل أو تحمّل الأمر.
