step5_enrichment:
  per_lemma:
    - lemma: "ضَعْف"
      enrichment:
        root: "ض-ع-ف"
        usage: "common"
        eloquence: "eloquent"
        connotation: "negative"
        literal_figurative: "literal"
        source: "تاج اللغة وصِحاح العربية"
      collocations:
        - text: "ضعف الحيوية"
          type: "adj_noun"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
        - text: "خلاف القوة"
          type: "noun_noun"
          source: "كتاب العين"
      examples:
        - text: "اللَّهُ الَّذِي خَلَقَكُم مِّن ضَعْفٍ ثُمَّ جَعَلَ مِنْ بَعْدِ ضَعْفٍ قُوَّةً"
          type: "quran"
          source: "الروم/ ٥٤"
      pos_check:
        pos: "noun"

    - lemma: "عَجْز"
      enrichment:
        root: "ع-ج-ز"
        usage: "common"
        eloquence: "eloquent"
        connotation: "negative"
        literal_figurative: "literal"
        source: "معجم مقاييس اللغة"
      collocations:
        - text: "عجز عن الطلب"
          type: "verb_prep"
          source: "كتاب العين"
        - text: "عجز عن الاكتساب"
          type: "verb_prep"
          source: "تاج اللغة"
      examples:
        - text: "لن نعجز الله في الأرض"
          type: "quran"
          source: "Maqayis_Lugha"
      pos_check:
        pos: "noun"

  cultural_fit:
    assessment: "native"

  reasoning:
    enrichment_approach: "الاعتماد على المعاجم التراثية (العين، المقاييس، الصحاح) لتحديد الدلالة الجوهرية للضعف والقدرة."
    conflict_resolution: "تم استبعاد معاني 'التضعيف' لـ 'ضَعْف' ومعاني 'العجز التشريحي/العظمي' لـ 'عَجْز' لكونها خارج نطاق المجموعة الترادفية."
    morphology_notes: "لا توجد تصحيحات صرفية ضرورية، اللمتان مستخدمتان بصيغتهما الحالية في كافة العصور."
    cultural_fit_reasoning: "المفهومان من ركائز اللغة العربية التعبيرية، ولهما مقابلات دقيقة في المعاجم العربية."

  actions:
    - command: "سجّل ملاحظة دلالية"
      params:
        lemma: "عَجْز"
        note: "يجب التمييز دلالياً بين 'عَجْز' (نقيض الحزم/القدرة) وبين 'عَجُز' (عظم العجز في التشريح)، حيث تم استبعاد الأخير لعدم انتمائه للمجموعة."