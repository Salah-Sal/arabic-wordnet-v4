
step0_evidence:
  per_lemma:
    ضَعْف:
      confirm:
        - "«ضعف الحيوية.» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - "«والضُّعْفْ: خلاف القوّة. ويقال: الضَّعْفُ في العقل والرأي، والضُّعْفُ في الجسد.» — كتاب العين للخليل بن أحمد الفراهيدي"
        - "«الضَعْفُ والضُعْفُ: خلاف القوَّة. وقد ضَعُفَ فهو ضعيفٌ» — تاج اللغة وصِحاح العربية للجوهري"
        - "«يَدُلُّ أَحَدُهُمَا عَلَى خِلَافِ الْقُوَّةِ... فَالْأَوَّلُ: الضَّعْفُ وَالضُّعْفُ، وَهُوَ خِلَافُ الْقُوَّةِ.» — مقاييس اللغة لابن فارس"
        - "«فيه ضعف وضعف وهو ضعيف» — أساس البلاغة للزمخشري"
        - "«الضَّعْف بالفَتْح في الرَّأى والعَقْل، والضُّعْفُ بالضَّم. في البَدَن.» — المجموع المغيث في غريبي القرآن والحديث لأبو موسى المديني"
        - "«الضَّعْفُ والضُّعْفُ: خْلافُ القوة، وقد ضَعُفَ وضَعَفَ» — الشوارد للصغاني"
      expands:
        - "«hypodynamia» — المعجم الطبي الموحد (2009)"
        - "«asthenia; weakness» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - "«أضعفته إضعافاً، أي: صيرته ضعيفاً. واستضعفته: وجدته ضعيفاً فركبته بسوء. وفي معنى آخر : أضعفت الشيء إضعافاً، وضاعفته مضاعفة، وضعّفته تضعيفاً، وهو إذا زاد على أصله فجعله مثلين أو أكثر.» — كتاب العين للخليل بن أحمد الفراهيدي"
        - "«ذكر الخليل أن التَضْعيفَ أن يزاد على أصل الشئ فيجعل مثلين أو أكثر. وكذلك الإضعافُ والمُضاعَفَةُ.» — تاج اللغة وصِحاح العربية للجوهري"
        - "«أَمَّا الْأَصْلُ الْآخَرُ... وَهُوَ أَنْ يُزَادَ عَلَى أَصْلِ الشَّيْءِ فَيُجْعَلَ مِثْلَيْنِ أَوْ أَكْثَرَ.» — مقاييس اللغة لابن فارس"
        - "«وضعفتهم بقومي: كثرتهم لأنهم أضعافهم. وأضعف له العطاء وضعفه وضاعفه. ومن المجاز: هو في أضعاف الكتاب وتضاعيفه: في أثنائه وأوساطه» — أساس البلاغة للزمخشري"
        - "«تَضْعُفُ صلاةُ الجماعةِ على صلاةِ الفَذِّ كَذا وكَذَا : أي تُزَادُ. ويقال: ضَعَّفتُه وأضْعَفْته وضاعَفْته: إذا زِدْتَ عليه مثلَه أو أَكثَر.» — المجموع المغيث في غريبي القرآن والحديث لأبو موسى المديني"
        - "«مَنْ كَانَ مُضْعِفاً فَلْيرْجِع أَيْ مَنْ كَانَتْ دَابَّتُه ضَعِيفَة... وَفِي حَدِيثِ أَبِي الدَّحْدَاحِ: إِلَّا رَجَاءَ الضِّعْف فِي المَعادِ أَيْ مِثْلَيِ الأجْرِ» — النهاية في غريب الحديث والأثر لأبي السعادات ابن الأثير الجزري"
        - "«لِفُلَانٍ عَلَيَّ دَرَاهِمُ (مُضَاعَفَةٌ) فَعَلَيْهِ سِتَّةُ دَرَاهِمَ... وَعَنْ الشَّافِعِيِّ... أَعْطُوا فُلَانًا ضِعْفَ مَا يُصِيبُ وَلَدِي قَالَ يُعْطَى مِثْلَهُ مَرَّتَيْنِ» — المغرب في ترتيب المعرب للمُطَرِّزي"
    عَجْز:
      confirm:
        - "«عجز: أعجزني فلان إذا عجزت عن طلبه وإدراكه. والعجزُ نقيض الحزم. وعَجَزَ يَعْجِزُ عَجْزا فهو عاجزٌ ضعيفٌ.» — كتاب العين للخليل بن أحمد الفراهيدي"
        - "«والعَجْزُ: الضعف. تقول: عَجَزْتُ عن كذا أعْجِزُ بالكسر عَجْزاً ومَعْجِزَةً ومعجزة ومعجزا ومعجزا بالفتح أيضا على القياس.» — تاج اللغة وصِحاح العربية للجوهري"
        - "«فَالْأَوَّلُ عَجِزَ عَنِ الشَّيْءِ يَعْجِزُ عَجْزًا، فَهُوَ عَاجِزٌ، أَيْ ضَعِيفٌ. وَقَوْلُهُمْ إِنَّ الْعَجْزَ نَقِيضُ الْحَزْمِ فَمِنْ هَذَا; لِأَنَّهُ يَضْعُفُ رَأْيُهُ.» — معجم مقاييس اللغة لابن فارس"
        - "«عجز: disability» — المَكنَز الزراعي متعدد اللغات"
        - "«عجز: disability» — موسوعة الكهرباء (IEC 60050)"
        - "«عجز: disability» — المعجم الطبي الموحد (2009)"
        - "«عَجْزٌ: infirmity» — المعجم الطبي الموحد (2009)"
        - "«عجْز: invalidity» — المعجم الموحد لمصطلحات القانون (2017)"
        - "«عجز: deficit» — المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - "«عجْز: deficit» — مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      expands:
        - "«وفي الحديث: " لا تلثو بدار معجزة "، أي لا تقيموا ببلدة تَعجِزون فيها عن الاكتساب والتعيُّش.» — تاج اللغة وصِحاح العربية للجوهري"
        - "«والعجوز: المرأة الشيخة. ويُجْمَعُ عجائز، والفعل: عجزت. وعجَزت تعجز عجْزاً، وعجّزت تعجيزاً، والتخفيف أحسن. ويقال للمرأة: اتقي الله في شيبتك، وعجزِكِ، أي: حين تصيرين عجوزا.» — كتاب العين للخليل بن أحمد الفراهيدي"
        - "«وَعَجَزَتِ الْمَرْأَةُ تَعْجُزُ بِالضَّمِّ عَجُوزًا، أَيْ صَارَتْ عَجُوزًا.» — معجم مقاييس اللغة لابن فارس"
        - "«والعَجَزُ: داءٌ يأخذ الدّابّة في عجُزِها فتثقل.» — كتاب العين للخليل بن أحمد الفراهيدي"
      contradicts:
        - "«عجز: sacrum (تركيب عظمي ينشأ من اتحاد الفقرات العجزية)» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - "«عجز: sacrum» — المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
        - "«العَجُز: sacrum NA» — المعجم الطبي الموحد (2009)"
        - "«عجُز: sacrum; rump (عظم في آخر العمود الفقريّ.)» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - "«العَجُزُ: يذكر ويؤنث، وتأنيثه أكثر؛ وهي العجيزة.» — المذكر والمؤنث لابن التستري الكاتب"
        - "«العجز: مؤخر الشئ، يؤنث ويذكَّر. وهو للرجل والمرأة جميعاً. والعَجيزَةُ، للمرأة خاصة.» — تاج اللغة وصِحاح العربية للجوهري"
        - "«وَأَمَّا الْأَصْلُ الْآخَرُ فَالْعَجُزُ: مُؤَخَّرُ الشَّيْءِ، وَالْجَمْعُ أَعْجَازٌ، حَتَّى إِنَّهُمْ يَقُولُونَ: عَجُزُ الْأَمْرِ، وَأَعْجَازُ الْأُمُورِ.» — معجم مقاييس اللغة لابن فارس"
