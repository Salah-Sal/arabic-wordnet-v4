step3_definition:
  definition_review_flag: true
  current_definition: "ناخر أسود وذهبي يوجد من برمودا إلى الكاريبي إلى البرازيل"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي ترجمة حرفية ويفتقر إلى الصياغة الموسوعية الرصينة للأسماء العلمية."
  authored_definitions:
    - type: "encyclopedic"
      text: "سمكة بحرية استوائية من فصيلة الناخريات، تتميز بلونها المخطط بالأسود والذهبي، وتستوطن المياه الغربية للمحيط الأطلسي من برمودا وصولاً إلى البرازيل."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
  reasoning:
    revision_justification: "التعريف الحالي ضيّق وغير هيكلي. تم استبدال الترجمة الحرفية بتعريف موسوعي يحدد الجنس (سمكة بحرية) والفصيلة (الناخريات) والخصائص الفيزيائية والموطن الجغرافي."
    dictionary_comparison: "التعريفات الموسوعية العربية للأسماك تبدأ دائماً بالجنس القريب (سمكة) ثم تتبعها بالخصائص التمييزية."
    terminological_strategy: "استخدام 'سمكة بحرية استوائية' كجنس قريب، و'فصيلة الناخريات' مع الوصف اللوني والموطن كفصل نوعي."
  actions:
    - command: "عدّل نص التعريف"
      params:
        definition_index: 0
        new_text: "سمكة بحرية استوائية من فصيلة الناخريات، تتميز بلونها المخطط بالأسود والذهبي، وتستوطن المياه الغربية للمحيط الأطلسي من برمودا وصولاً إلى البرازيل."