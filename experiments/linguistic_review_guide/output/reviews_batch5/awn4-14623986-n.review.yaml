step3_definition:
  definition_review_flag: false
  current_definition: ملح أو إستر لحمض الأسيتيك (الخليك)
  assessment:
    decision: retain
    reason: التعريف الحالي دقيق علمياً ويغطي المفهوم بشكل كافٍ ولا توجد إشارة مراجعة سابقة.
  authored_definitions:
  - type: terminological
    text: مركب كيميائي ينتج عن تفاعل حمض الخليك (الأسيتيك) مع كحول أو قاعدة، ويُصنف كملح أو إستر.
    quality_check:
      genus_present: true
      differentia_present: true
      circular: false
      too_broad: false
      too_narrow: false
      passed: true
  reasoning:
    revision_justification: التعريف الحالي صحيح، لكن تم صياغة تعريف مصطلحي بديل أكثر تفصيلاً لتعزيز الدقة العلمية.
    dictionary_comparison: التعريف الحالي يطابق المعايير العلمية للمصطلح.
    terminological_strategy: الجنس القريب = 'مركب كيميائي' + الفصل المميّز = 'ينتج عن تفاعل حمض الخليك مع كحول أو قاعدة'.
  actions:
  - &id006
    command: تحديث نص التعريف
    params:
      new_text: مركب كيميائي ينتج عن تفاعل حمض الخليك مع كحول أو قاعدة، ويُصنف كملح أو إستر.
step4_relations:
  hypernymy:
    current_hypernym: ملح
    test_result: correct
  verb_checks:
    applicable: false
  reasoning:
    hypernymy_justification: «أسيتات» و«خلات» هما كيميائياً نوع من «الأملاح»، والعلاقة في قاعدة البيانات دقيقة ومباشرة.
    antonymy_justification: لا يوجد تضاد لغوي للمواد الكيميائية.
    frame_analysis: غير منطبق؛ المجموعة عبارة عن أسماء (جماد).
  actions:
  - &id007
    command: أقرّ صحة العلاقات
    params: {}
