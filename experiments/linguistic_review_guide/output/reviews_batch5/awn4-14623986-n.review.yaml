      - «تُطلق على أملاح وإسترات حامض الخلِّيك» — المعجم الكبير
      expands:
      - «أسيتات الرَّصاص؛ خلّات الرَّصاص (ك)» — المورد الحديث (2008)
      - «أسيتات الأمونيوم، خلاّت الأمونيوم» — المعجم الموحد لمصطلحات الكيمياء (1992)
      - '«أسيتات السلولوز: أحد مشتقات السلولوز تستعمل في صنع رقائق للتغليف وفي الطلاء» — المعجم الموحد لمصطلحات تقانات الأغذية (2004)'
    خلات:
      confirm:
      - '«خلاّت: مركبات حمض الخليك» — المعجم الموحد لمصطلحات تقانات الأغذية (2004)'
      expands:
      - '«خلات السليولوز: إستر الخلات للسليولوز، يستخدم على نحو أساسي كليف اصطناعي في صناعة النسيج» — مسرد صناعة النسيج'
