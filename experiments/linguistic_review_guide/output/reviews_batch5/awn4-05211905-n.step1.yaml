step1_lemma_validation:
  per_lemma:
    - lemma: "ضَعْف"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة قوية تطابق تعريف المجموعة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "أدلة معجمية متضافرة (ابن فارس، الجوهري، الزمخشري) تؤكد المعنى."
        nuance_differentiation: "يتميّز عن «عجز» بأنه يشير إلى نقص القوة أو الوهن العام، بينما «عجز» غالباً ما يركز على عدم القدرة على الفعل أو الإنجاز (inability)."
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "ضَعْف"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "ضَعْف"
            note: "يتميّز عن «عجز» بأنه يشير إلى نقص القوة أو الوهن العام."

    - lemma: "عَجْز"
      decision: "confirmed"
      decision_reason: "أدلة مؤكّدة للمعنى المقصود رغم وجود معانٍ أخرى (تجانس لفظي)"
      evidence_assessment:
        case: "mixed"
        notes:
          - "تناقض: المعاجم تذكر معانٍ أخرى (عظم الظهر/مؤخرة الشيء) لا علاقة لها بالضعف."
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "أدلة قوية (ابن فارس، كتاب العين) تؤكد المعنى المرتبط بالضعف وعدم القدرة."
        conflict_analysis: "التناقض الموجود (sacrum/rump) هو تجانس لفظي (Homonymy) وليس تناقضاً في المعنى المقصود في هذه المجموعة."
        nuance_differentiation: "يتميّز عن «ضعف» بارتباطه الوثيق بعدم القدرة على الإنجاز أو الفعل (inability)، وليس مجرد نقص القوة."
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "عَجْز"
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "عَجْز"
            note: "تنبيه: يجب استبعاد المعاني المتعلقة بـ (عظم الظهر/مؤخرة الشيء) فهي تجانس لفظي خارج نطاق هذا المفهوم."
        - command: "سجّل ملاحظة دلالية"
          params:
            lemma: "عَجْز"
            note: "يتميّز عن «ضعف» بارتباطه الوثيق بعدم القدرة على الإنجاز أو الفعل (inability)."