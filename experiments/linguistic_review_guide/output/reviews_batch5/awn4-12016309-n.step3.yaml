step3_definition:
  definition_review_flag: false
  current_definition: "شجيرة صغيرة كثيفة لها رؤوس زهرية تشبه الأستر بأشعة بيضاء عريضة؛ توجد في المناطق الصحراوية من أريزونا شرقاً إلى كانساس وجنوباً إلى المكسيك"
  assessment:
    decision: "retain"
    reason: "التعريف الحالي دقيق علمياً ويغطي الخصائص المورفولوجية والموطن الجغرافي للنبات بشكل وافٍ ومناسب للمعاجم المتخصصة."
  reasoning:
    revision_justification: null
    dictionary_comparison: "التعريف يطابق الوصف العلمي للنبات في المصادر المرجعية النباتية."
    terminological_strategy: "نبات (شجيرة) + خصائص مورفولوجية + موطن جغرافي"