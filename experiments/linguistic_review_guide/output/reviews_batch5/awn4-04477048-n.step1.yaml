step1_lemma_validation:
  per_lemma:
    - lemma: "تلفريك"
      decision: "confirmed"
      decision_reason: "المصطلح الأكثر دقة وشيوعاً للمفهوم؛ الأدلة تدعم استخدامه"
      evidence_assessment:
        case: "expands"
        notes:
          - "الأدلة المعجمية تؤكد مطابقة المفهوم"
      substitution_test:
        result: "pass"
      reasoning:
        evidence_weight: "أدلة قوية ومتوافقة مع المفهوم"
        nuance_differentiation: "يتميّز بكونه المصطلح التقني الشائع والأكثر دقة للمركبات المعلقة بالكابلات"
      actions:
        - command: "أكّد صلاحية اللمّة"
          params:
            lemma: "تلفريك"

    - lemma: "ترامواي"
      decision: "removed"
      decision_reason: "تناقض مع تعريف المفهوم؛ الترامواي وسيلة أرضية"
      evidence_assessment:
        case: "contradicts"
        notes:
          - "تناقض: المعنى المعجمي (ترام أرضي) يختلف عن تعريف المجموعة (وسيلة معلقة)"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "ركبنا التلفريك للوصول للقمة"
            substituted: "ركبنا الترامواي للوصول للقمة"
            preserved_meaning: false
            why_failed: "الترامواي لا يسير في الهواء عبر كابلات"
      reasoning:
        evidence_weight: "تناقض واضح مع المفهوم المقصود"
        removal_justification: "اللمّة تشير إلى وسيلة نقل أرضية (Tram) ولا تنطبق على المفهوم المعلق (Ropeway)"
      actions:
        - command: "احذف ارتباط اللمّة بالمجموعة"
          params:
            lemma: "ترامواي"
            reason: "التناقض الدلالي مع تعريف المفهوم (وسيلة أرضية مقابل معلقة)"

    - lemma: "قطار هوائي"
      decision: "removed"
      decision_reason: "تعبير وصفي/ترجمة حرفية وليس مصطلحاً معجمياً مستقراً"
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "استخدم التلفريك لنقل البضائع"
            substituted: "استخدم القطار الهوائي لنقل البضائع"
            preserved_meaning: true
            why_failed: "الاستبدال مقبول دلالياً لكنه ليس مصطلحاً بل وصفاً"
      reasoning:
        evidence_weight: "لا سند معجمي؛ اللمّة تعبير وصفي"
        removal_justification: "تعبير وصفي زائد، والمصطلح المعجمي 'تلفريك' يغني عنه"
      actions:
        - command: "احذف ارتباط اللمّة بالمجموعة"
          params:
            lemma: "قطار هوائي"
            reason: "تعبير وصفي/ترجمة حرفية، وجود 'تلفريك' يغني عنه"