stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي ترجمة حرفية ومختصرة للتعريف الإنجليزي."
    observations: "المصطلح ينتمي إلى المعجم السوسيولوجي الحديث. اللمة 'أقلية عرقية' هي الأكثر شيوعاً وتداولاً، ولكن هناك مرادفات أكاديمية هامة مثل 'أقلية إثنية' ينبغي النظر في إضافتها."
  blind_candidates:
    - lemma: "أَقَلِّيَّة"
      generation_method: ishtiqaq
      justification: "الاسم الجوهري للمفهوم (minority) كاسم ذات لمجموعة عددية."
    - lemma: "أَقَلِّيَّة إِثْنِيَّة"
      generation_method: tarkib
      justification: "ترجمة اصطلاحية دقيقة (ethnic minority) باستخدام المصطلح المعرب 'إثنية' الشائع في الدراسات الاجتماعية."
    - lemma: "جَمَاعَة عِرْقِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي بديل يؤكد على طبيعة الجماعة وارتباطها بالعرق."
    - lemma: "فِئَة أَقَلِّيَّة"
      generation_method: tarkib
      justification: "استخدام 'فئة' كبديل لـ 'مجموعة' مع وصف الأقلية."

stage2_evidence:
  per_lemma:
    - lemma: "أَقَلِّيَّة"
      confirm:
        - text: "«(الأقلية) خلاف الأكثرية (ج) أقليات»"
          source: "المعجم الوسيط"
        - text: "«أَقَلِّيَّة: الجذر: ق ل ل... المعنى: خلاف الأكثرية... وردت الكلمة في المعاجم الحديثة كالوسيط، والأساسي، والمنجد.»"
          source: "معجم الصواب اللغوي"
    - lemma: "عِرْقِيَّة"
      confirm:
        - text: "«الصِّفة [أو الرابطة] العرقية أوالأَثْنيّة. (ethnicity)»"
          source: "المورد الحديث (2008)"
    - lemma: "إِثْنِيَّة"
      confirm:
        - text: "«نَزْعة إثنية: كل ما يشير إلى أصل عرقي أو قبلي لجماعة أفراد ينخرطون في نوع من المركزية العرقية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
    - lemma: "أَقَلِّيَّة عِرْقِيَّة"
      confirm:
        - text: "«أقلية (سكانية): (Minority)»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
          addition: "يشير إلى المفهوم السكاني للمصطلح."

stage3_analysis:
  per_lemma:
    - lemma: "أقلية عرقية"
      decision: confirmed
      decision_reason: "المصطلح القياسي والأكثر شيوعاً في اللغة العربية المعاصرة للتعبير عن مفهوم 'ethnic minority'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَقَلِّيَّة عِرْقِيَّة"
    - lemma: "أَقَلِّيَّة إِثْنِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح أكاديمي رصين يستخدم بكثرة في الدراسات السوسيولوجية والأنثروبولوجية المعاصرة كمرادف دقيق لـ 'ethnic minority'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "أَقَلِّيَّة إِثْنِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "أَقَلِّيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "الاسم الجوهري، وغالباً ما يُكتفى به في السياق عند الحديث عن المجموعات الثقافية المتميزة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَقَلِّيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "مجموعة لها تقاليد وطنية أو ثقافية مختلفة عن غالبية السكان"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح دلالياً لكنه يفتقر إلى الصياغة المعجمية المحكمة."
    authored:
      - type: terminological
        text: "جماعة بشرية تتمايز عن أغلبية سكان المجتمع الذي تعيش فيه بانتمائها العرقي أو القومي أو الثقافي، وتحافظ على تقاليد وقيم خاصة بها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "أَقَلِّيَّة عِرْقِيَّة"
        examples:
          - text: "كفل الدستور الجديد لجميع الأقليات العرقية حق ممارسة شعائرها الثقافية واللغوية بحرية."
            type: usage
      - lemma: "أَقَلِّيَّة إِثْنِيَّة"
        examples:
          - text: "تعتبر هذه الأقلية الإثنية جزءاً لا يتجزأ من النسيج الاجتماعي للدولة."
            type: usage
      - lemma: "أَقَلِّيَّة"
        examples:
          - text: "كانت الأقلية تطالب بتمثيل سياسي يتناسب مع حجمها السكاني."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "أَقَلِّيَّة عِرْقِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "أقلية"
          root: "قلل"
          maqayis_quote: "«القَافُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نَزَارَةِ الشَّيْءِ. يُقَالُ شَيْءٌ قَلِيلٌ، وَقَدْ قَلَّ يَقِلُّ.» (ملاحظة: اللفظ مشتق من هذا الأصل) "
        - word: "عرقية"
          root: "عرق"
          maqayis_quote: "«الْعَيْنُ وَالرَّاءُ وَالْقَافُ أَرْبَعَةُ أُصُولٍ صَحِيحَةٌ... الثَّانِي السِّنْخُ الْمُتَشَعِّبُ. مِنْ ذَلِكَ الْعِرْقُ عِرْقُ الشَّجَرَةِ... فُلَانٌ مُعْرِقٌ لَهُ فِي الْكَرَمِ أَيْ لَهُ فِيهِ أَصْلٌ وَسِنْخٌ.»"
    - lemma: "أَقَلِّيَّة إِثْنِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "أقلية"
          root: "قلل"
          maqayis_quote: "«القَافُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نَزَارَةِ الشَّيْءِ.»"
        - word: "إثنية"
          root: "أثن"
          maqayis_quote: "«(لفظ معرب من اليونانية 'ethnos' بمعنى أمة أو شعب، ولا يوجد له جذر عربي أصيل في المعاجم القديمة بهذا المعنى).»"
    - lemma: "أَقَلِّيَّة"
      entry_id: "{auto}"
      root: "قلل"
      maqayis_quote: "«القَافُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نَزَارَةِ الشَّيْءِ.»"
  per_sense:
    - lemma: "أَقَلِّيَّة عِرْقِيَّة"
      sense_id: "{auto}"
      nuance: "المصطلح الشائع والأكثر تداولاً في الخطاب العام والإعلامي."
      mwe: true
    - lemma: "أَقَلِّيَّة إِثْنِيَّة"
      sense_id: "{auto}"
      nuance: "مصطلح أكثر دقة من الناحية الأنثروبولوجية، يشير إلى المكونات الثقافية والتاريخية للجماعة."
      mwe: true
    - lemma: "أَقَلِّيَّة"
      sense_id: "{auto}"
      nuance: "اللفظ المجرد، يستخدم كاسم جنس للمفهوم."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"أقلية","root":"قلل","maqayis":"«القَافُ وَاللَّامُ أَصْلٌ صَحِيحٌ...»"},{"word":"عرقية","root":"عرق","maqayis":"«الْعَيْنُ وَالرَّاءُ وَالْقَافُ... الثَّانِي السِّنْخُ الْمُتَشَعِّبُ.»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"أقلية","root":"قلل","maqayis":"«القَافُ وَاللَّامُ أَصْلٌ صَحِيحٌ...»"},{"word":"إثنية","root":"أثن","maqayis":"«لفظ معرب...»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قلل","maqayis":"«القَافُ وَاللَّامُ أَصْلٌ صَحِيحٌ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الشائع والأكثر تداولاً في الخطاب العام والإعلامي.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح أكثر دقة من الناحية الأنثروبولوجية، يشير إلى المكونات الثقافية والتاريخية للجماعة.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
