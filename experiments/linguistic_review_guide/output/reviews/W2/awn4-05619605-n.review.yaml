# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (مكان، مكانة) تفتقران إلى التشكيل الكامل"
      - "مكان لفظ عام مشترك بين الموضع الحسي والذهني، مما يُفضي إلى ضبابية دلالية دون قرينة"
      - "مكانة تميل في الاستخدام المعاصر نحو المنزلة الاجتماعية أكثر من الموقع الذهني المجرد"
      - "لفظة موقع في التعريف الحالي اكتسبت في العربية المعاصرة إيحاءً رقمياً (مواقع الإنترنت) وجغرافياً يُضعف دلالتها على المعنى الفلسفي المقصود"
    observations: |
      تمثّل هذه المجموعة مفهوماً فلسفياً معرفياً دقيقاً يندرج تحت منظومة الإدراك الحسّي والتعلّم؛
      فالموقع الذهني المجرد ليس موضعاً مكانياً بل منزلةٌ مفهومية في الفضاء العقلي. التراث العربي
      الفلسفي يعرف مفاهيم مقاربة كالمنزلة والمحل والمكانة واستعملها المتكلمون والحكماء، إلا أن
      مكان وحده يظل ملتبساً بين الدلالة الحسية والذهنية. كلتا اللمّتين بحاجة ماسّة إلى تشكيل.

  blind_candidates:
    - lemma: "مَظِنَّة"
      generation_method: majaz
      justification: "مظنة الشيء في العربية الكلاسيكية هي موضعه في الذهن الذي يُظن كونه فيه؛ فهي في جوهرها موقع ذهني مجرد لا حسي، وهو تطابق دلالي دقيق مع المفهوم المستهدف. أصلها من ظنّ (توقَّعَ/أيقن)، فهي تُحيل على الفضاء الذهني المتوقَّع لا على الموضع الحسي."
    - lemma: "مَثَابَة"
      generation_method: majaz
      justification: "من ثَابَ يثوب (رجع)؛ المثابة تعني المرجع والمنزلة، وتُستخدم في التعبير الاصطلاحي الراسخ (في مثابة كذا) للدلالة على منزلة مجردة أو موضع معنوي. وردت في الحديث النبوي بمعنى المجمع والمرجع مما يُتيح إزاحتها دلالياً نحو الموقع الذهني."
    - lemma: "مَنْزِلَة"
      generation_method: majaz
      justification: "من نزل؛ المنزلة في التراث الفلسفي والكلامي تدل على موضع مجرد في سلّم القيم أو المعرفة (له منزلة في العلم / منزلة بين المنزلتين). لا تُستعمل للموضع الحسي فحسب، وهي من أكثر المصطلحات رسوخاً للدلالة على الموقع المجرد في التراث الإسلامي."
    - lemma: "مَحَلٌّ ذِهْنِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي (موصوف+نعت) مستعمل في المنطق وعلم الكلام العربي للدلالة على الفضاء المعنوي الذي يُتصوَّر فيه المفهوم. ورد في مؤلفات الفلاسفة والمتكلمين العرب في مقابل المحل الخارجي الحسي."


