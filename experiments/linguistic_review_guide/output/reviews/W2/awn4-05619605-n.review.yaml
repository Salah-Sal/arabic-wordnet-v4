      confirm:
        - text: "«المكان: عند أهل الحقائق: يراد به المكانة، وهي منزلة في البساط لا تكون إلا للمتمكنين الذين جاوزوا الجلال والجمال، فلا وصف لهم ولا نعت»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«مكان» — translation_en: space — domain: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«المنزلة. يقال: هو رفيع المكان / الموضِعُ»"
          source: "المعجم الوسيط"
          addition: "يثبت أن مكان يُستعمل بمعنى المنزلة المجردة (رفيع المكان)، وليس الموضع الحسي فحسب"
        - text: "«المكان: عند المتكلمين: هو الفراغ المتوهم الذي يشغله الجسم وتنفذ فيه أبعاده. المكان المبهم: عبارة عن مكان له اسم نسميه به بسبب أمر داخل في مسماه»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يكشف أن للمكان بُعداً ذهنياً/توهّمياً في التراث الكلامي الإسلامي"
        - text: "«المكان: [في الانكليزية] Place, situation [في الفرنسية] Place, situation»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يؤكد تعادل مكان مع situation (الوضع/الحالة) وهو مفهوم ذهني مجرد"

    - lemma: "مكانة"
      confirm:
        - text: "«المكان بمعنييه السابقين»"
          source: "المعجم الوسيط (مدخل 25540، جذر: كون)"
        - text: "«المنزلة ورفعة الشأن»"
          source: "المعجم الوسيط (مدخل 27911)"
        - text: "﴿قُلْ يَا قَوْمِ اعْمَلُوا عَلَى مَكَانَتِكُمْ﴾"
          source: "القرآن الكريم — سورة الأنعام 6:135 / الزمر 39:39"
      contradicts:
        - text: "«التُّؤَدَة. يقال: مُرَّ على مكانته: مُتَّئِدًا وامشِ على مكانتك: برزانة»"
          source: "المعجم الوسيط"
          conflict: "في هذا السياق تعني مكانة الحال أو الهيئة لا الموقع الذهني المجرد"

    - lemma: "مَظِنَّة"
      confirm:
        - text: "«مَظِنَّةُ الشيء: مَوْضِعُهُ ومَأْلَفُه الذي يُظَن كونه فيه»"
          source: "المعجم الوسيط"
        - text: "«(مَظَنَّة) الشَّيْء مَوْضِعه ومألفه الَّذِي يظنّ كَونه فِيهِ. والمظان: المراجع التي ينشد فيها الباحث طلبته (مو)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«مَظَنَّة — الجذر: ظ ن ن / الصواب والرتبة: إِنَّه مَظِنَّة للخير [فصيحة]، إِنَّه مَظَنَّة للخير [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "السياقات الموثَّقة تنحصر في (مظنة للخير/للشر/للفساد) أي مرتكز ظنٍّ وتوقّع، لا موقع ذهني مجرد بالمعنى الإدراكي الفلسفي"

    - lemma: "مَثَابَة"
      expands:
        - text: "«الثَّاءُ وَالْوَاوُ وَالْبَاءُ قِيَاسٌ صَحِيحٌ مِنْ أَصْلٍ وَاحِدٍ، وَهُوَ الْعَوْدُ وَالرُّجُوعُ. يُقَالُ ثَابَ يَثُوبُ إِذَا رَجَعَ. وَالْمَثَابَةُ: الْمَكَانُ يَثُوبُ إِلَيْهِ النَّاسُ. قَالَ اللَّهُ تَعَالَى: وَإِذْ جَعَلْنَا الْبَيْتَ مَثَابَةً لِلنَّاسِ وَأَمْنًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدل على العود والمرجع؛ المثابة مكان تجمّع وعودة، لا موقع ذهني مجرد"
      contradicts:
        - text: "«مَثابَة البِئْرِ: مَبْلَغُ جُمُومِ مائِها / مَقامُ المُستَقِى على فَمِ البئر / ما أشْرَفَ من الحِجارَةِ حَوْلَ البئر / مَوْضِعُ حِبالَةِ الصائِدِ»"
          source: "المعجم الكبير"
          conflict: "المعاني الراسخة للمثابة حسية وملموسة (البئر، الساقي، الصيد)، لا تنسجم مع الموقع الذهني المجرد"

    - lemma: "مَنْزِلَة"
      expands:
        - text: "«الْمنزلَة: الدَّار والمكانة والمرتبة. يُقَال لَهُ منزلَة عِنْد الْأَمِير: مكانة. وَهُوَ رفيع الْمنَازل: الْمَرَاتِب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "تُثبت أن منزلة مرادفة لمكانة في معنى الموقع المجرد، مما يجعلها متداخلة مع الموجود لا مُكمِّلة"
