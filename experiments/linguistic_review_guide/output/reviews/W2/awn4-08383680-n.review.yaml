    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"نظام","root":"نظم","maqayis":"«النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتَأْلِيفِهِ...»"},{"word":"اقتصادي","root":"قصد","maqayis":"«الْقَافُ وَالصَّادُ وَالدَّالُ أُصُولٌ ثَلَاثَةٌ، يَدُلُّ أَحَدُهَا عَلَى إِتْيَانِ شَيْءٍ وَأَمِّهِ...»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
