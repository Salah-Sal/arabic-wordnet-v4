stage1_review:
  assessment:
    concerns:
      - "اللمّة (اقتصاد) تحتاج لتشكيل كامل."
      - "اللمّة (نظام اقتصادي) تحتاج لتشكيل كامل وتصنيفها كمركب (MWE)."
    observations: "المفهوم يشير إلى الكيان الكلي المنظم للنشاط المادي في المجتمع، واللمتان الموجودتان تعبران عنه بدقة عالية."
  blind_candidates:
    - lemma: "اِقْتِصَاد"
      generation_method: ishtiqaq
      justification: "المصطلح المعياري الحديث للمفهوم، مشتق من القصد بمعنى الاعتدال والتوسط وتدبير الموارد."
    - lemma: "نِظَامٌ اِقْتِصَادِيّ"
      generation_method: tarkib
      justification: "ترجمة دقيقة لـ economic system تعبر عن الهيكل التنظيمي للعمليات الاقتصادية."
    - lemma: "مَعِيشَة"
      generation_method: majaz
      justification: "لفظ تراثي يشير إلى ما يعاش به، وقد استخدم اتساعاً للإشارة إلى الحالة الاقتصادية."
    - lemma: "تَدْبِيرٌ مَالِيّ"
      generation_method: tarkib
      justification: "تعبير وصفي يشير إلى كيفية إدارة الموارد والأموال."

stage2_evidence:
  per_lemma:
    - lemma: "اقتصاد"
      confirm:
        - text: "«(الاقتصاد) علم يبحث في الظواهر الخاصة بالإنتاج والتوزيع»"
          source: "المعجم الوسيط"
        - text: "«economy»"
          source: "ArabTerm"
    - lemma: "نظام اقتصادي"
      confirm:
        - text: "«economic system»"
          source: "ArabTerm"
    - lemma: "معيشة"
      expands:
        - text: "«المعاش من المطعم والمشرب والدخل»"
          source: "المعجم الوسيط"
          addition: "تشير إلى الجانب الاستهلاكي والدخل الفردي أكثر من النظام الكلي."

stage3_analysis:
  per_lemma:
    - lemma: "اقتصاد"
      decision: confirmed
      decision_reason: "هو المصطلح الأساسي والأكثر شيوعاً للتعبير عن النظام الكلي للإنتاج والاستهلاك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِقْتِصَاد"
    - lemma: "نظام اقتصادي"
      decision: confirmed
      decision_reason: "مصطلح اصطلاحي ثابت يعبر عن الجانب الهيكلي والقانوني للاقتصاد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَامٌ اِقْتِصَادِيّ"

stage4_content:
  definition:
    current: "نظام الإنتاج والتوزيع والاستهلاك"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، يحتاج لجعله أكثر شمولاً ودقة معجمية."
    authored:
      - type: terminological
        text: "مجموع الوسائل والأنشطة والأنظمة التي تنظم عمليات الإنتاج والتوزيع والاستهلاك للسلع والخدمات في مجتمع معين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "اِقْتِصَاد"
        examples:
          - text: "يعتمد اقتصاد الدولة بشكل كبير على تصدير الموارد الطبيعية."
            type: usage
      - lemma: "نِظَامٌ اِقْتِصَادِيّ"
        examples:
          - text: "يهدف النظام الاقتصادي الناجح إلى تحقيق التوازن بين العرض والطلب."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموع الوسائل والأنشطة والأنظمة التي تنظم عمليات الإنتاج والتوزيع والاستهلاك للسلع والخدمات في مجتمع معين."

stage5_enrichment:
  per_entry:
    - lemma: "اِقْتِصَاد"
      entry_id: "{auto}"
      root: "قصد"
      maqayis_quote: "«الْقَافُ وَالصَّادُ وَالدَّالُ أُصُولٌ ثَلَاثَةٌ، يَدُلُّ أَحَدُهَا عَلَى إِتْيَانِ شَيْءٍ وَأَمِّهِ...»"
    - lemma: "نِظَامٌ اِقْتِصَادِيّ"
      entry_id: "{auto}"
      roots:
        - word: "نظام"
          root: "نظم"
          maqayis_quote: "«النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتَأْلِيفِهِ...»"
        - word: "اقتصادي"
          root: "قصد"
          maqayis_quote: "«الْقَافُ وَالصَّادُ وَالدَّالُ أُصُولٌ ثَلَاثَةٌ، يَدُلُّ أَحَدُهَا عَلَى إِتْيَانِ شَيْءٍ وَأَمِّهِ...»"
