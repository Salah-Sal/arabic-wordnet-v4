step0_evidence:
  per_lemma:
    - lemma: "دَاعِيَة حَرْب"
      evidence_status: "no_material_found"
    - lemma: "مُحِبّ لِلْحَرْب"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُثِير حَرْب"
      source_section: "step5_english_bridge"
      evidence_citation: "«مثير الحرب.» — المورد الحديث (2008)"
      justification: "تركيب إضافي ثابت وموثق معجمياً يقابل المصطلحات الإنجليزية."
  knowledge_candidates:
    - lemma: "صَقْر"
      justification: "مجاز (استعارة): يستعمل في لغة الصحافة والسياسة للتعبير عن السياسي الذي يميل إلى استخدام القوة العسكرية (يقابله الحمامة لمحب السلام)."
  generation_notes: "تم استبعاد التراكيب الوصفية الحرة والاعتماد على المركبات الإضافية والمجازات الصحفية المستقرة."

step1_lemma_validation:
  per_lemma:
    - lemma: "دَاعِيَة حَرْب"
      decision: confirmed
      decision_reason: "مركب إضافي مسكوك ومستعمل بكثرة في السياقات السياسية والإعلامية للتعبير عن المفهوم."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب الخطابي والترويجي للسياسات العدائية والتحريض على استخدام القوة."
      example: "حذر المحللون من صعود دعاة الحرب إلى سدة الحكم وتأثيرهم السلبي على استقرار المنطقة."

    - lemma: "مُحِبّ لِلْحَرْب"
      decision: removed
      decision_reason: "تركيب وصفي حر غير مسكوك (شبه جملة)، أقرب إلى الشرح والتفسير، ولا يرقى لأن يكون مصطلحاً معجمياً مستقلاً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "مرفوض لاعتماده على الوصف المباشر غير الاصطلاحي."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُثِير حَرْب"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مثبت معجمياً وذو بنية إضافية سليمة يعبر بدقة عن المفهوم."
      step05_citation: "«مثير الحرب.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الأفعال العملية والافتعال المباشر للأزمات التي تشعل النزاعات المسلحة."
      example: "تم إدانته دولياً بوصفه مثير حرب يسعى لزعزعة الأمن الإقليمي."
      actions:
        - command: create_entry
          params:
            lemma: "مُثِير حَرْب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10335671-n"

    - lemma: "صَقْر"
      source: step05
      decision: removed
      decision_reason: "رغم شيوعه كاستعارة سياسية، إلا أنه لفظ عام يحتاج إلى سياق مقيد ليتضح معناه (كأن يقال صقور الإدارة)، وقد يسبب لبساً مع الطائر الجارح في الشبكة الدلالية ما لم يُقيد."
      step05_citation: "معرفة لغوية"

  synset_flags:
    definition_review_needed: false
    split_needed: false
  added_lemmas:
    - lemma: "مُثِير حَرْب"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

