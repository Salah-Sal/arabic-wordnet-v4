# ── المرحلة ١: المراجعة والتوليد (أعمى) ────────────────────
stage1_review:
  assessment:
    concerns:
      - "لَا إِنْسَانِيَّة تركيبٌ نافٍ وصفي حر لا يرتقي إلى مستوى المصطلح المسكوك المعجمي"
      - "وَحْشِيَّة أوسع دلالةً من المفهوم المحدد؛ تشمل الفجاجة البهيمية الغريزية لا الافتقار إلى الرحمة وحده"
      - "كلتا اللمتين مكتوبتان بلا تشكيل كامل في البيانات الواردة"
      - "المجموعة تفتقر إلى لمة قسوة التي هي الوصف المعجمي الكلاسيكي الدقيق لهذا المفهوم"
    observations: "المجموعة تختص بصِفة انعدام الرحمة والرفق مع الآخرين كخصلة شخصية راسخة في الطبع. اللمة الأولى (لا إنسانية) تُعدّ عبارةً وصفيةً منفيّةً لا مصطلحاً محكماً، إذ يمكن إبدال (إنسانية) بـ(رحمة) أو (عطف) دون فقدان الدلالة — فشل اختبار السك. أما وحشية فهي أقرب إلى المعنى المستهدف، وتحمل ظلالاً تشبيهيةً بسلوك الوحش، غير أنها تجنح نحو الظاهر السلوكي أكثر من الباطن الوجداني. المعجمية العربية الكلاسيكية تُعبّر عن هذا المفهوم تحديداً بمصطلح (قسوة) بمعنى جمود القلب وذهاب الرحمة منه، وهو مصطلح قرآني راسخ."
  blind_candidates:
    - lemma: "قَسْوَة"
      generation_method: ishtiqaq
      justification: "من الجذر ق-س-و على وزن فَعْلَة؛ تدل على غلظ القلب وذهاب الرحمة واللين منه، مقابلةً لصلابة الحجر. المصطلح قرآني موثق في وصف انعدام الرقة والرحمة، ومشتقاته تتضمن جميع المعاني المطلوبة في التعريف"
    - lemma: "صُلُودَة"
      generation_method: ishtiqaq
      justification: "من الجذر ص-ل-د على وزن فُعُولة، يدل على الصلابة الشديدة والجمود التام؛ مجاز عن انعدام الرقة والرحمة في الطبع حيث يُشبَّه القلب القاسي بالحجر الصلود"
    - lemma: "جَفَاء"
      generation_method: majaz
      justification: "من الجذر ج-ف-و؛ أصل الجفاء نبوّ الشيء عن الشيء وعدم لزومه، ثم استُعير للغلظ في العشرة وترك الرفق في المعاملة، وهو وصف من يُعامل الآخرين دون اعتبار ولا مراعاة"
    - lemma: "غِلْظَة"
      generation_method: ishtiqaq
      justification: "من الجذر غ-ل-ظ على وزن فِعْلَة؛ تُستعار للمعاني الخُلُقية فتدل على خشونة الطبع وانعدام اللين في التعامل مع الآخرين، ومنه قوله في الحديث والقرآن (واغلظ عليهم)"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "لَا إِنْسَانِيَّة"
      expands:
        - text: "«(1) وحشية؛ بربرية (2) عمل وحشي أو بربري.»"
          source: "المورد الحديث (2008) — inhumanity"
          addition: "يكشف أن المعجم الثنائي المعتمد يُترجم inhumanity بـ(وحشية / بربرية) لا بـ(لا إنسانية)، مما يدل على أن (لا إنسانية) ليست الوحدة المعجمية المستقرة لهذا المفهوم في العربية المعاصرة"

    - lemma: "وَحْشِيَّة"
      confirm:
        - text: "«(1) وحشيَّة (2) عملٌ وحشيّ.»"
          source: "المورد الحديث (2008) — brutality"
        - text: "«(1) وحشية؛ بربرية (2) عمل وحشي أو بربري.»"
          source: "المورد الحديث (2008) — inhumanity"
        - text: "«(1) وحشية؛ هَمَجيّة إلخ (2) عملٌ وحشيّ.»"
          source: "المورد الحديث (2008) — savagery"
      expands:
        - text: "«الْوَاوُ وَالْحَاءُ وَالشِّينُ: كَلِمَةٌ تَدُلُّ عَلَى خِلَافِ الْإِنْسِ. تَوَحَّشَ: فَارَقَ الْأَنِيسَ. وَالْوَحْشُ: خِلَافُ الْإِنْسِ.»"
          source: "مقاييس اللغة لابن فارس (ت. 1004م)"
          addition: "يؤصّل المقاييس الوحشية في ضدية الإنس والأنس البشري، مما يمنح اللمة عمقاً تأصيلياً يناسب المجموعة؛ وَحْشِيَّة = انتفاء الطابع الإنساني في الروح والسلوك"

    - lemma: "قَسْوَة"
      confirm:
        - text: "«الْقَافُ وَالسِّينُ وَالْحَرْفُ الْمُعْتَلُّ يَدُلُّ عَلَى شِدَّةٍ وَصَلَابَةٍ. مِنْ ذَلِكَ الْحَجَرِ الْقَاسِي. وَالْقَسْوَةُ: غِلَظُ الْقَلْبِ، وَهِيَ مِنْ قَسْوَةِ الْحَجَرِ. قَالَ اللَّهُ تَعَالَى: {ثُمَّ قَسَتْ قُلُوبُكُمْ مِنْ بَعْدِ ذَلِكَ فَهِيَ كَالْحِجَارَةِ أَوْ أَشَدُّ قَسْوَةً} [البقرة: 74].»"
          source: "مقاييس اللغة لابن فارس (ت. 1004م)"
        - text: "«(الْقَسْوَة) الغلظ والصلابة والشدة في كل شيء وجمود القلب وعدم رحمته»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
        - text: "«القسوة: غلظ القلب، ذكره الراغب. وقال الحرالي: اشتداد المتصلب والمتحجر.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
        - text: "«قسا قلبه قَسْوة وقَسَاوة: فتأويل القسوة في القلب ذهاب اللين والرحمة والخشوع منه»"
          source: "لسان العرب لابن منظور (ت. 1311م)"
      expands:
        - text: "«قسا قلبُه غَلُظ واشتدَّ يقسو قَسَاءً وقَسْوةً وقَسَاوةً»"
          source: "مختار الصحاح للرازي (ت. 1266م)"
          addition: "يُثبت أن قَسَاوة وقَسْوة صيغتان متكافئتان للمصدر، غير أن الاستخدام التقني الحديث يُخصّص قساوة للصلادة المادية (hardness) لا الأخلاقية؛ لذا قَسْوَة هي الصيغة المرجّحة للمعنى الخُلُقي"

    - lemma: "صُلُودَة"
      evidence_status: "no_material_found"

    - lemma: "جَفَاء"
      confirm:
        - text: "«الجفاء بالفتح: الغلظ في العشرة والخرق في المعاملة وترك الرفق في الأمور.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
        - text: "«نقيض الصلة وخلاف البر»"
          source: "المعجم الكبير لمجمع اللغة العربية"
      expands:
        - text: "«الْجِيمُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ يَدُلُّ عَلَى أَصْلٍ وَاحِدٍ: نُبُوُّ الشَّيْءِ عَنِ الشَّيْءِ ... وَالْجَفَاءُ: خِلَافُ الْبِرِّ.»"
          source: "مقاييس اللغة لابن فارس (ت. 1004م)"
          addition: "يكشف أن أصل الجفاء هو التنافر والابتعاد لا انعدام الرحمة تحديداً؛ دلالته مركّزة على قطع الروابط الاجتماعية (نقيض الصلة) لا على الطبع القاسي"

    - lemma: "غِلْظَة"
      confirm:
        - text: "«الغلظة: ضد الرقة، وأصله أن يستعمل في الأجسام، لكن قد يستعار للمعاني.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
      expands:
        - text: "«الغِلْظَةُ، مثلثةً، والغِلاظَةُ: ضِدُّ الرِّقَّةِ ... وبينهما غِلْظَةٌ ومُغالَظَةٌ: عَداوَةٌ.»"
          source: "القاموس المحيط للفيروزآبادي (ت. 1414م)"
          addition: "يثبت الاستخدام المجازي للغلظة في دلالة العداوة وانعدام اللين، غير أنها تدل على الشدة عموماً لا الافتقار إلى الرحمة خصوصاً"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "لَا إِنْسَانِيَّة"
      decision: removed
      decision_reason: "ثلاثة أسباب تُوجب الحذف: (أ) لا يرد في أي معجم عربي كمدخل مستقل ذي وجود معجمي ثابت، (ب) يفشل اختبار السكّ: إبدال (إنسانية) بـ(رحمة) أو (عطف) ينتج وصفاً دلالياً مماثلاً (لا رحمة / لا عطف) مما يكشف أنه تعبير وصفي حر لا مصطلح مسكوك، (ج) المعاجم الثنائية المعتمدة تترجم inhumanity بـ(وحشية / بربرية) لا بـ(لا إنسانية)"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وَحْشِيَّة"
      decision: confirmed
      decision_reason: "موثقة في المعاجم الثنائية المعاصرة بوصفها الترجمة العربية المعتمدة لـinhumanity وbrutality وsavagery؛ جذرها في مقاييس اللغة (خلاف الإنس) يُعطيها بُعداً تأصيلياً دقيقاً يناسب المفهوم؛ المصطلح شائع فصيح مطّرد الاستخدام في الكتابة العربية الرسمية والإعلامية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُبرز الطابعَ البهيمي الغريزي للقسوة: انعدام الإنسانية من حيث التشبُّه بسلوك الوحوش. أقرب إلى السلوك الظاهر والفعل الموصوف، تحمل ظلالاً من الشناعة والتوحش"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَحْشِيَّة"

    - lemma: "قَسْوَة"
      source: stage1
      decision: confirmed
      decision_reason: "موثقة في أعمق مصادر المعجمية: مقاييس اللغة (غلظ القلب)، والمعجم الوسيط (جمود القلب وعدم رحمته)، ولسان العرب (ذهاب اللين والرحمة والخشوع)؛ تطابق تعريف المجموعة تطابقاً مباشراً. مصطلح قرآني راسخ في البقرة:74. معياريات جودة المصطلح: اطّراد ✓، يُسر التداول ✓، ملاءمة ✓، إيثار التراثي ✓، إيثار العربي ✓، اشتقاقية ✓"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُركّز على البُعد الداخلي الوجداني: جمود القلب وصلابته عن الانفعال بالرحمة كأنه حجر. وصف خُلُقي باطني عميق، لا يختص بسلوك ظاهر بل بمكوّن الشخصية الجوهري"
      actions:
        - command: create_entry
          params:
            lemma: "قَسْوَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "صُلُودَة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية في قاعدة البيانات على وجود هذه الصيغة أو تداولها في المصادر العربية الكلاسيكية أو الحديثة؛ لا يجوز توليد مصطلح لا سند معجمي له"

    - lemma: "جَفَاء"
      source: stage1
      decision: removed
      decision_reason: "الجفاء في أصل دلالته (نبو الشيء عن الشيء) ينصبّ على قطع الروابط الاجتماعية وترك الصلة، لا على انعدام الرحمة تحديداً. المقاييس يُعرّفه بـ(خلاف البر) وهو أعم وأميل نحو الهجران والإعراض؛ لا يُغطي كامل دلالة المجموعة المتعلقة بالطبع القاسي وجمود القلب"

    - lemma: "غِلْظَة"
      source: stage1
      decision: removed
      decision_reason: "أصلها الخشونة المادية وهي تُستعار للمعاني الخُلُقية على سبيل المجاز؛ المعجم الوسيط يُحيلها إلى (الغلاظة) دون تخصيص دلالة الرحمة. كما أن غلظة تدل على الشدة في الأسلوب والمعاملة لا على الافتقار الداخلي إلى الرحمة؛ تداخل دلالي مع قسوة ووحشية دون إضافة فصل نوعي"


