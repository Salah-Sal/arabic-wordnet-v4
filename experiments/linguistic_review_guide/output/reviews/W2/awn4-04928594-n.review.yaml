# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-04928594-n  |  ILI: i62845  |  POS: n
# الكلمة الإنجليزية: background (social heritage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة (خلفية) مكتوبة بلا تشكيل، وهذا يُخلّ بالضبط المعجمي المطلوب."
      - "كلمة (خلفية) في الأصل اسم نسبة مؤنث مشتق من (خَلْف) بمعنى الجهة الخلفية؛ استُعيرت حديثاً لتؤدي معاني متعددة لـ (background) الإنجليزية: بصرياً ومعلوماتياً واجتماعياً. هذا التعدد الدلالي يستدعي مراجعة دقيقة للتحقق من ملاءمة المصطلح للمفهوم المحدد في هذه المجموعة (الخبرة السابقة / التدريب)."
      - "التعريف الحالي (التراث الاجتماعي للشخص) يستخدم (التراث الاجتماعي) تعبيراً غير مألوف في العربية لهذا المعنى؛ إذ (التراث) في الاستعمال العربي الراسخ يتصل بالموروث الحضاري والثقافي الجمعي لا بالخبرات الشخصية."
      - "غياب أي مرادف أو مرشح إضافي للمجموعة يُضعف التمثيل المعجمي ويجعل المجموعة بلمّة واحدة فقط."
    observations: >
      المجموعة تُعبّر عن مفهوم (الخلفية الشخصية) بمعنى: ما يحمله الفرد من تدريب وخبرات مكتسبة
      تشكّل هويته المهنية والاجتماعية. في العربية لا يوجد لفظ تراثي قديم مفرد مُوكَّد لهذا المعنى
      بهذا الضبط، وإنما شاع استخدام (خلفية) مجازاً من معناها الحسي (ما كان خلف الشيء).
      الأب الدلالي (الإرث / الميراث) يُغطي الجانب الوراثي الحضاري، بينما هذه المجموعة تُركّز على
      الرصيد الشخصي المكتسب من التجربة والتدريب.

  blind_candidates:
    - lemma: "تَكْوِينٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ك و ن) على وزن تَفْعِيل، بمعنى عملية تشكيل شخصية الفرد وقدراته
        عبر التدريب والتجربة. يُستخدم في الأدبيات التربوية الحديثة (خاصة المغاربية) بمعنى
        (formation) الفرنسية أي التكوين المهني، وهو وجه من أوجه معنى المجموعة.
    - lemma: "سِيرَةٌ"
      generation_method: majaz
      justification: >
        لفظ عربي أصيل من الجذر (س ي ر) يعني في الأصل طريقة السير والسلوك، ثم اتّسع
        ليشمل تاريخ الشخص وحياته. (سيرة الشخص المهنية) تُعبّر عن خلفيته العلمية والعملية،
        وهو استعمال مجازي متداول لا يبتعد عن دلالة المجموعة.
    - lemma: "سَوَابِقُ"
      generation_method: majaz
      justification: >
        جمع (سابقة) من الجذر (س ب ق)، والسوابق في معجم اللغة هي الأمور التي تقدمت وسبقت.
        يُستخدم في تراكيب مثل (السوابق المهنية) للتعبير عن الخبرات السابقة، وهو مجاز
        بإحياء المعنى الوصفي (ما تقدّم) ليدل على تراكم الخبرة.
    - lemma: "مَاضِي الشَّخْصِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من (ماضٍ) + (الشخص). (الماضي) يحمل معنى ما سلف من تجارب وأحداث،
        والإضافة تُخصّصه بالشخص. التعبير يُستخدم فعلاً في العربية بمعنى (background)
        الشخصي. الاختبار: ليس وصفاً حرّاً لأن التركيب اصطلح عليه في السياقات السيرة الذاتية.


stage2_evidence:
  per_lemma:
    - lemma: "خلفية"
      confirm:
        - text: >
            «(فِى أمْرٍ من الأمورِ): المَعْلُوماتُ العامَّة عنه (فى الرَّسْم والتَّصْوير
            والمَسْرح) background: كُلُّ ما يَظْهَرُ فى السَّاحة الخَلْفِيَّة من الصُّورَةِ
            أو المَنْظَرِ»
          source: "المعجم الكبير (مجمع اللغة المصري)"
        - text: >
            ««د» الجذور الاجتماعية أو السياسية لحادثة أو وضع the background of the war.
            «هـ» المعلومات الضرورية لفهم حالةٍ أو مشكلةٍ ما»
          source: "المورد الحديث (2008)"
        - text: >
            «الإطار الذي يحكم الخبرات الحياتية للفرد كما تشكله عضويته في جماعة إنسانية ما
            استنادًا إلى الجنس والعرق والمستوى الاجتماعي والاقتصادي واللغة والدين
            والمنطقة الجغرافية.»
          source: "مسرد التربية — المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "خلفية اجتماعية = social background"
          source: "مسرد التربية — ALECSO (ArabTerm)"
      expands:
        - text: >
            «(الخلفية) فِي الرَّسْم والتصوير والمسرح كل مَا يظْهر فِي الساحة الخلفية
            من الصُّورَة أَو المنظر (مج)»
          source: "المعجم الوسيط (1998)"
          addition: >
            يُظهر أن المعنى الأصلي المسجَّل هو المعنى البصري (خلفية اللوحة / المسرح)،
            وأن المعنى الاجتماعي (خبرات الشخص) هو تطور دلالي حديث لا يزال في طور التثبيت.
        - text: >
            «(فِى أمْرٍ من الأمورِ): المَعْلُوماتُ العامَّة عنه»
          source: "المعجم الكبير"
          addition: >
            هذا أوسع تعريف معجمي يقترب من المعنى المراد؛ يُثبت استعمال (خلفية) للدلالة
            على المعلومات العامة حول موضوع أو شخص، وهو جسر دلالي للمعنى الاجتماعي.
        - text: "جملة المعتقدات والمعارف والافتراضات التي تكمن خلف موقف ما."
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
          addition: >
            يُثبت استخدام (خلفية) بمعنى ما يقف وراء الموقف أو المعلومة، وهو امتداد
            للدلالة نحو السياق والمرجعية الشخصية.

    - lemma: "تَكْوِينٌ"
      confirm:
        - text: "تكوين = training"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ALECSO (ArabTerm)"
        - text: "تكوين = formation"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — ALECSO (ArabTerm)"
      contradicts:
        - text: >
            «التكوين: إيجاد شيء مسبوق بمادة» / «إخراج المعدوم من العدم إلى الوجود»
          source: "كشاف اصطلاحات الفنون للتهانوي / كتاب التعريفات للجرجاني"
          conflict: >
            المعنى الكلامي/الفلسفي الراسخ لـ(التكوين) هو الإيجاد من العدم أو من المادة،
            وهو بعيد عن معنى (الخلفية الشخصية من تدريب وخبرات). استعماله بمعنى (training)
            حصر في المعاجم التقنية الحديثة ومرتبط بالمصطلح الفرنسي (formation).
        - text: >
            «تَكْوِين — الجذر: ك و ن — مثال: جمعوا مالاً لتكوين جمعية خيرية —
            الرأي: مرفوضة — السبب: لعدم ورودها بهذا المعنى في المعاجم القديمة»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: >
            حتى المعنى الإنشائي المستحدث للتكوين وُصف بأنه مرفوض في البداية؛ فالأصل
            فيه الإيجاد لا التدريب، مما يجعل استخدامه مرادفاً لـ(background) غير مستقر.

    - lemma: "سِيرَةٌ"
      evidence_status: "no_material_found"

    - lemma: "سَوَابِقُ"
      evidence_status: "no_material_found"

    - lemma: "مَاضِي الشَّخْصِ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "خلفية"
      decision: confirmed
      decision_reason: >
        (خلفية) هي الترجمة الاصطلاحية العربية الراسخة لـ(background) بمعنى الخلفية
        الشخصية من خبرات وتدريب. مؤكَّدة في المعجم الكبير والمورد الحديث ومسرد التربية
        (ALECSO) بما يشمل (خلفية اجتماعية) و(خلفية ثقافية). وإن كانت دخيلة دلالياً
        (calque من الإنجليزية) إلا أنها أصبحت جزءاً من المعجم العربي المُقنَّن. يستلزم
        التصحيح الصرفي ضبطها ضبطاً كاملاً: خَلْفِيَّة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        خَلْفِيَّة — اللمّة الوحيدة في المجموعة — تُعبّر عن الرصيد المكتسب من خبرات
        الشخص وتدريبه التي تقف (خلف) حاضره وتُشكّل هويته المهنية والاجتماعية؛ وتتميز
        عن (سيرة) بأنها لا تعني السرد التاريخي الكامل، وعن (تكوين) بأنها لا تتضمن
        الجانب الفلسفي للإيجاد، وعن (تراث) بأنها شخصية مكتسبة لا موروثة جمعية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلْفِيَّة"

    - lemma: "تَكْوِينٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود ترجمة (training) في بعض المعاجم التقنية، إلا أن المعنى الأصلي الراسخ
        لـ(تكوين) هو الإيجاد والإنشاء الفلسفي أو العلمي. معجم الصواب اللغوي وسّمه
        مرفوضاً حتى في معانيه الجديدة الأخف. فضلاً عن ذلك، (تكوين) بمعنى (background)
        يُفضي إلى الاشتراك اللفظي الحاد مع المعاني العلمية (التشريح، الجيولوجيا، الكيمياء)
        مما يتعارض مع شرط الوضوح الدلالي. استعماله محصور في السياق المغاربي الفرنكوفوني.

    - lemma: "سِيرَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        (سيرة) تعني تاريخ الشخص كله وسلوكه وحوادث حياته بالتفصيل، وهي أوسع من المفهوم
        المراد الذي يتمحور حول الخبرات السابقة والتدريب المهني تحديداً. (سيرة ذاتية) =
        biography، وليس background = خلفية معينة. لم تُعثر على أدلة تُثبّت (سيرة) في
        المعاجم بمعنى (background) المحدد.

    - lemma: "سَوَابِقُ"
      source: stage1
      decision: removed
      decision_reason: >
        (سوابق) في الاستعمال المعاصر تحمل دلالة سلبية غالبة (سوابق جنائية / سوابق
        قضائية). لم تُعثر على أدلة تُثبّتها مرادفاً لـ(background) بمعنى الخبرة السابقة
        الإيجابية. استخدامها في هذا السياق سيُوقع القارئ في التباس.

    - lemma: "مَاضِي الشَّخْصِ"
      source: stage1
      decision: removed
      decision_reason: >
        التركيب الإضافي (ماضي الشخص) فاشل في اختبار السك المعجمي: يمكن إبدال (الشخص)
        بـ(الفرد / المرشح / الموظف) وتبقى الجملة وصفاً حرّاً. لا يرقى إلى مصطلح
        معجمي ثابت. كذلك (الماضي) يشمل كل ما مضى بما فيه السلبي والإيجابي، وهو أعم
        من المفهوم المراد.


stage4_content:
  definition:
    current: "التراث الاجتماعي للشخص: الخبرة السابقة أو التدريب"
    assessment:
