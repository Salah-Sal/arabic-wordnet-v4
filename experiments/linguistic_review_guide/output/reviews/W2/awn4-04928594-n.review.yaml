        في العربية يختص بالموروث الحضاري الجمعي لا بالرصيد الشخصي المكتسب. كما أن
        الصياغة مُفتقرة إلى الجنس القريب والفصل النوعي الواضحين، وتبدو ترجمة حرفية
        للإنجليزية أكثر من أنها تعريف معجمي متقن.
    authored:
