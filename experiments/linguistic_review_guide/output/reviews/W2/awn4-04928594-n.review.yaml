        text: >
          مجموعُ ما يحمله الشخصُ من خبراتٍ مكتسبة ومهاراتٍ عملية، نتيجةَ ما مرَّ به
          من تدريبٍ سابق أو ممارسةٍ في ميدانٍ معيَّن، تُشكِّل قدراتِه الراهنة
          وتُعرَّف هويتَه المهنية والاجتماعية
        quality_check:
