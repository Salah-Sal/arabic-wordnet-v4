          يُقصد بـ(خلفية الشخص) ما اكتسبه عبر مسيرته التعليمية والمهنية من معارف
          ومهارات وتجارب؛ فالطبيبُ الذي عمل في جراحة الأعصاب عشر سنوات يملك (خلفية)
          في هذا التخصص تُؤهّله لمواجهة حالاته المعقدة. وتتضمن الخلفية عادةً: التعليم
          الرسمي، والتدريب المتخصص، والخبرة الميدانية المتراكمة
