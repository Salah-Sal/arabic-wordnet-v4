# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'إعلان ورقي' تعبيرٌ وصفيٌّ مُركَّب لا يجتاز اختبارَ السَّكّ؛ إذ
         يمكن إحلال 'ورقي' بـ'إلكتروني' أو 'جداري' دون أن يخرج التعبيرُ عن
         سياقه الوصفي العام، وهو غير مُسجَّل في المعاجم كمصطلح مسكوك."
      - "تفتقر لمّة 'ملصق' إلى التشكيل الكامل (يجب: مُلصَق)."
      - "التعريف العربي يستخدم 'لافتة' وهي موجودة في المجموعة الأمّ (awn4-06806088-n)،
         مما يُنشئ دوراناً ضمنياً في التعريف."
      - "لفظة 'منشورة' في التعريف توحي بمعنى النشر الورقي المُوزَّع لا الإلصاق
         على الجدران، وهو ما يُعبِّر عنه 'مُلصَق' بدقة أكبر."
    observations: "المجموعة تُعبِّر عن مفهوم 'الملصق الإعلاني' (poster/placard)،
      وهو مفهوم حيٌّ في العربية الحديثة بمصطلح راسخ هو 'مُلصَق'. اللمّة الحالية
      'ملصق' موثَّقة في معاجم متخصصة متعددة بهذا المعنى تحديداً، غير أنها تفتقر
      إلى التشكيل. أما 'إعلان ورقي' فعبارة وصفية حرة لا ترقى إلى مستوى المصطلح
      المسكوك، وينبغي حذفها من المجموعة مع الاكتفاء بـ'مُلصَق' بعد تشكيله."

  blind_candidates:
    - lemma: "مَلْصَقَة"
      generation_method: ishtiqaq
      justification: "مشتقة من جذر ل-ص-ق على وزن مَفْعَلَة الدال على الأداة أو
        المصدر المكاني؛ إذ اللافتة الإعلانية هي ما يُلصَق في الأماكن العامة."
    - lemma: "مَنْشُور"
      generation_method: ishtiqaq
      justification: "اسم مفعول من نشر على وزن مَفْعُول، بمعنى ما يُنشر ويُعمَّم
        في الأماكن العامة للإعلام العام والتبليغ."
    - lemma: "لَوْحَةُ إِعْلَان"
      generation_method: tarkib
      justification: "مُركَّب إضافي من 'لوحة' + 'إعلان': اللوحة المخصصة للإعلان
        العام وتعليق الرسائل في الأماكن المكشوفة."
    - lemma: "نُشْرَة"
      generation_method: majaz
      justification: "من جذر ن-ش-ر على وزن فُعْلَة، بمعنى ما يُنشر للإعلام؛
        مجاز قائم على الانتشار العلني في الأماكن العامة."


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دقيقة دفعية (الموجودة + المرشحات): headword_norm IN (...)
#   ٢. جسر إنجليزي: entries_translations_fts MATCH poster|placard|posting|notice|bill|card
#   ٣. إثراء بالمعرّف: definitions + examples لـ entry_ids المهمة
#   ٤. مقاييس اللغة (dictionary_id=151): جذور لصق، نشر، علن
#   ٥. FTS عربي: ملصق، لافتة، إعلان، جداري
stage2_evidence:
  per_lemma:
    - lemma: "إعلان ورقي"
      evidence_status: "no_material_found"

    - lemma: "ملصق"
      confirm:
        - text: "«المُلْصَق: إعلان أو بيان يُلْصَق في مكانٍ عامّ»"
          source: "المورد الحديث (2008) — ترجمة poster"
        - text: "«يرتبط الملصق بسجلَّين: إيقوني وكتابي للتعبير عن تضافر مُدونتين
            لإشهار عمل أو نشاط ثقافي لجلب انتباه جمهور نحو فعل أو حدث ثقافي،
            لهذا نجد تعاضُداً بين الكتابي والصّوري في الملصق الجداري كبيان وإعلان
            لحدث»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ترجمة poster"
        - text: "«مُلصَق» [= poster]"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«علامة ملصقة على عربة السكك الحديدية أو الشاحنة والتي تدل على
            إشارة خطيرة للمنتجات المنقولة في هذه العربة»"
          source: "المعجم الموحد لمصطلحات النقل (2010) — ترجمة placard"
        - text: "«ملصق مصوَّر» [= picture poster]"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
        - text: "«وكالة مُلصَقات: مؤسسة تختص بوضع المُلصَقات الإعلانية على حائطيَّات»
            [= poster agency]"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«مُلصَق خارجي» [= outdoor poster]"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«مُلصَق سياحي» [= tourist poster]"
          source: "مسرد الفن، التسلية والرياضة — المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«إعلان، مُلْصَق» [= poster]"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
        - text: "«ملصق إعلاني» [= bill]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.١: طباعة (1996)"
      contradicts:
        - text: "«(الملصق) الدَّعِيُّ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (مصدر hawramani)"
          conflict: "هذا معنى كلاسيكي يُعبِّر عن 'الدخيل في القوم'، وهو معنى منفصل
            تماماً عن المصطلح التقني الحديث 'ملصق' = poster."

    - lemma: "مَلْصَقَة"
      contradicts:
        - text: "«المُلْصَقَةُ، كمُكْرَمَةٍ: المرأةُ الضَّيِّقَةُ المُتَلاحِمَةُ»"
          source: "القاموس المحيط للفيروزآبادي (ت 1414هـ)"
          conflict: "المعنى المعجمي الوحيد الوارد للمُلصَقَة يُحيل إلى وصف إنساني
            جسدي لا صلة له بمفهوم الملصق الإعلاني."

    - lemma: "مَنْشُور"
      expands:
        - text: "«(المنشور): بيان بأمر من الأمور يذاع بين الناس ليعلموه»"
          source: "المعجم الوسيط (OCR)"
          addition: "هذا المعنى الإعلامي قريب من مفهوم الإعلان العام لكنه يُحيل
            إلى ما يُوزَّع أو يُذاع (bulletin/circular) لا إلى ما يُلصَق بصرياً."
      contradicts:
        - text: "«(في علم الهندسة): جسم كثير السطوح قاعدتاه مضلعان متساويان
            ومتماثلان ومتوازيان، وكل سطح من سطوحه الأخرى الجانبية متوازي أضلاع.
            (في علم الضوء): جسم منشوري ثلاثي مصنوع من مادة شفافة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المعنى الرئيسي المُثبَّت في المعاجم الحديثة هو المنشور الهندسي
            (prism)، مما يُشكِّل اشتراكاً لفظياً صارفاً عن استعمال المصطلح للملصق."
        - text: "«منشور» [= prism]"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)؛ مسرد الهندسة
            الكهربائية؛ مسرد هندسة السيارات"
          conflict: "تعدد الاستعمال التقني لـ'منشور' بمعنى prism في معاجم متخصصة
            متعددة يجعله غير صالح لهذه المجموعة."

    - lemma: "نُشْرَة"
      expands:
        - text: "«(النشرة): بيان يكتب وينشر ليعلم ما فيه (مو)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          addition: "يُشير إلى مفهوم الإعلام الكتابي المُوزَّع، لكنه أقرب إلى
            bulletin/notice لا إلى poster المُلصَق بصرياً."
        - text: "«كراس مطبوع لغايات دعائية» [= prospectus]"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "يُشير إلى الوظيفة الدعائية لكنه يعني prospectus/brochure."
        - text: "«نشرة» [= brochure]"
          source: "مسرد الفن، التسلية والرياضة — المنظمة العربية للتربية والثقافة والعلوم"
          addition: "الترجمة المعتمدة في المسارد العربية لـ'نشرة' هي brochure/bulletin
            لا poster."

    - lemma: "لَوْحَةُ إِعْلَان"
      expands:
        - text: "«لوحة البيانات؛ لوحة الإعلانات» [= notice board]"
          source: "المورد الحديث (2008)"
          addition: "يتقاطع مع المفهوم في البنية اللغوية لكن المصطلح يُحيل إلى
            'لوحة الإعلانات' (notice board) لا إلى الملصق (poster)."
        - text: "«لافتة إعلانية» [= billboard]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.١ (1996)"
          addition: "billboard يختلف عن poster في الحجم والموضع."


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إعلان ورقي"
      decision: removed
      decision_reason: "لا يجتاز اختبار السكّ: تستطيع إبدال 'ورقي' بـ'مطبوع' أو
        'جداري' أو 'إلكتروني' والتعبير يظل صالحاً وصفياً، مما يدل على أنه عبارة
        تفسيرية لا مصطلح مسكوك. فضلاً عن ذلك، غياب قيده في أي معجم تخصصي أو
        عام يُؤكد افتقاره إلى التثبيت المعجمي. كما أن 'إعلان' وحده مُقيَّد في
        الـ hypernym، فلا داعي لتكراره مُقيَّداً بصفة ضعيفة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ملصق"
      decision: confirmed
      decision_reason: "موثَّق بصورة متينة في معاجم متخصصة متعددة (اللسانيات،
        الإعلام، الفنون، النقل، التقنيات التربوية) بوصفه المصطلح العربي المعتمد
        لـ poster وplacard. اشتقاقه من جذر ل-ص-ق على وزن مُفعَل (اسم مفعول من
        أَلصَق) يجعله مُحكَم الصياغة صرفياً. المعنى الكلاسيكي 'الدعيّ' معنى
        منفصل لا يتعارض مع الاستعمال التقني المتأخر. يحتاج إلى ضبط التشكيل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يتخصص في الإعلان المطبوع ذي الطابع البصري (صورة +
        نص) الذي يُلصَق على الجدران والأسطح العامة، بخلاف 'الإعلان' الأشمل الذي
        يعم كل وسائل الإعلام والإخبار، و'اللافتة' التي قد تكون ثابتة مُعلَّقة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُلصَق"

    - lemma: "مَلْصَقَة"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعجمي الكلاسيكي الوحيد الوارد ('المرأة الضيقة
        المتلاحمة' في القاموس المحيط) يتعارض تعارضاً صريحاً مع المفهوم المنشود.
        ولا يوجد أي شاهد معجمي يُثبِّت 'ملصقة' بمعنى poster. كما أن الوزن
        مَفْعَلَة في السياق التقني أقل انتشاراً من مُفعَل (مُلصَق)."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مَنْشُور"
      source: stage1
      decision: removed
      decision_reason: "تُثبِّت المعاجم الحديثة المتخصصة 'منشور' ترجمةً لـprism
        في الرياضيات والبصريات والهندسة الكهربائية، وهو اشتراك لفظي صارف يحول
        دون استعماله في مجموعة poster. والمعنى الإعلامي 'بيان يذاع بين الناس'
        يُحيل إلى circular/flyer لا إلى الملصق الجداري المُلصَق."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "نُشْرَة"
      source: stage1
      decision: removed
      decision_reason: "المسارد التقنية العربية تُثبِّت 'نشرة' ترجمةً لـ
        brochure/bulletin/prospectus، وهذه مفاهيم مختلفة عن poster في طريقة
        التوزيع (توزيع يدوي أو بريدي لا إلصاق). المعنى الأصيل 'بيان يكتب وينشر'
        يُحيل إلى النشرة الإخبارية لا الملصق الجداري."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "لَوْحَةُ إِعْلَان"
      source: stage1
      decision: removed
      decision_reason: "المعاجم تُثبِّت 'لوحة الإعلانات' = notice board وهو مفهوم
        مختلف. اختبار السكّ: يمكن إحلال 'إعلان' بـ'مطلوب' أو 'شرف' دون أن يخرج
        التعبير عن بنيته الوصفية، مما يدل على أنه ليس مصطلحاً مسكوكاً لـposter.
        فضلاً عن ذلك، 'لافتة' في الـ hypernym تجعل 'لوحة' هنا تشويشاً إضافياً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


