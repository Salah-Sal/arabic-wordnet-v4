      decision_reason: "صفة مشبهة دقيقة ومباشرة في التعبير عن الشخص الذي يتميز بالنشاط والحيوية المستمرة."
      step05_citation: "معرفة لغوية: اشتقاق (صفة مشبهة)."
      substitution_test:
