      example: "كان الشابُّ شعلةَ نشاطٍ في تنظيم الفعالية."
    - lemma: "مُتَحَمِّس"
      decision: confirmed
      decision_reason: "مصطلح شائع يعبر عن الجانب النفسي والدافعي للنشاط واليقظة، وهو مقبول كمترادف جزئي للمفهوم."
