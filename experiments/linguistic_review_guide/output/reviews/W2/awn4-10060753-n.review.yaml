step0_evidence:
  per_lemma:
    - lemma: "شُعْلَة نَشَاط"
      confirm:
        - text: "«شعلة نشاط وحماس: شخص عالي الهمَّة والنشاط» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«وَيُقَال كَأَنَّهُ شعلة نشاط أَو شعلة ذكاء» — المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "مُتَحَمِّس"
      expands:
        - text: "«(1) مُتحمِّس (2) حَمَاسيّ.» — المورد الحديث (2008)"
          addition: "تضيف بُعداً نفسياً وعاطفياً (الشغف والدافعية) على مجرد النشاط واليقظة البدنية."
        - text: "«المتحمِّس؛ المندفع [للقيام بواجباته أو أكثر منها].» — المورد الحديث (2008)"
          addition: "تضيف معنى الاندفاع لإنجاز الواجبات."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مِقْدَام"
      source_section: "step5_english_bridge"
      evidence_citation: "«شخص يقِظ أو نشيط أو مقدام.» — المورد الحديث (2008)"
      justification: "تُقابل المصطلح الإنجليزي (live wire) وتركز على جانب الجرأة والمبادرة."
    - lemma: "مُنْدَفِع"
      source_section: "step5_english_bridge"
      evidence_citation: "«المتحمِّس؛ المندفع [للقيام بواجباته أو أكثر منها].» — المورد الحديث (2008)"
      justification: "تُعبر عن الحماس الزائد والمبادرة في العمل."
  knowledge_candidates:
    - lemma: "نَشِيط"
      justification: "اشتقاق (صفة مشبهة): تدل على ثبوت صفة النشاط والحيوية في الشخص، وهي المقابل المباشر للتعريف الإنجليزي (energetic)."
    - lemma: "دِينَامُو"
      justification: "تعريب ومجاز (إزاحة دلالية): استعارة شائعة جداً في الاستعمال المعاصر لوصف الشخص المليء بالطاقة والمحرك للآخرين في بيئة العمل."
  generation_notes: "تم التركيز على الصفات المشبهة والاستعارات الشائعة للتعبير عن الحيوية والنشاط العاليين."

