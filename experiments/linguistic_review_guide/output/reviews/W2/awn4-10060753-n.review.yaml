      decision_reason: "لفظ معرّب مستقر في الاستعمال المعاصر كاستعارة وظيفية للشخص الذي يحرك العمل بنشاطه الفائق."
      step05_citation: "معرفة لغوية: تعريب ومجاز."
      substitution_test:
        result: "pass"
      nuance_differentiation: "تحمل دلالة التأثير في الآخرين وتحريكهم (مثل المحرك)، أي نشاط يتعدى الشخص إلى محيطه."
