      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على الجانب النفسي والشغف الداخلي والرغبة في الإنجاز، أكثر من مجرد النشاط البدني."
      example: "انضم إلى الفريق موظفٌ متحمِّسٌ أضاف حيوية لبيئة العمل."
    - lemma: "مِقْدَام"
