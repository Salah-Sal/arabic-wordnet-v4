stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي 'زمن بلا نهاية' موجز جداً، ويفتقر إلى الصياغة المعجمية الدقيقة."
      - "المجموعة تفتقر إلى المصطلح العلمي الحديث 'لانهائية' الذي يقابل infinity بدقة."
    observations: "المصطلحات الموجودة (أبدية، خلود، سرمدية) تغطي الجوانب التراثية والعامة للمفهوم، حيث تركز الأبدية على عدم النهاية، والخلود على البقاء، والسرمدية على الاتصال الدائم. يحتاج المفهوم إلى إضافة 'لانهائية' لتمثيل الجانب الرياضي والمنطقي للمصطلح الإنجليزي infinity."
  blind_candidates:
    - lemma: "أَبَدِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من 'الأبد' وهو الدهر الطويل أو الزمن الذي لا نهاية له."
    - lemma: "سَرْمَدِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من 'السرمد' وهو الدائم الذي لا ينقطع."
    - lemma: "خُلُود"
      generation_method: ishtiqaq
      justification: "مصدر خلد، ويدل على البقاء الدائم والثبات."
    - lemma: "لَانِهَائِيَّة"
      generation_method: tarkib
      justification: "مركب مزجي (لا + نهاية + ية) يعبر بدقة عن مفهوم infinity في السياقات العلمية والمنطقية الحديثة."

stage2_evidence:
  per_lemma:
    - lemma: "أَبَدِيَّة"
      confirm:
        - text: "«(الأبَدِيَّة) الدَّيمومة التي لا تنقطع»"
          source: "المعجم الكبير"
        - text: "«مصدر صناعي من الأبد»"
          source: "المعجم الوسيط"
    - lemma: "خُلُود"
      confirm:
        - text: "«البقاء والدوام، ودار الخلود: الجنة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الخُلُود: يومُ البقاءِ الدَّائِمِ»"
          source: "المعجم الكبير"
    - lemma: "سَرْمَدِيَّة"
      confirm:
        - text: "«السَّرْمَدُ: الدائم الذي لا ينقطع»"
          source: "لسان العرب"
        - text: "«السَّرْمَدُ: الدائِمُ الدّائم الذي لا يَنْقَطِع»"
          source: "المعجم الكبير"
      expands:
        - text: "«السرمدي: مَا لَا بداية لَهُ وَلَا نِهَايَة لَهُ»"
          source: "دستور العلماء"
    - lemma: "لَانِهَائِيَّة"
      confirm:
        - text: "«الأَبَدِية؛ السَّرمَدِية؛ اللّانهائية؛ الخلود» كمرادفات لـ eternity"
          source: "المورد الحديث"
        - text: "«اللانهاية» كترجمة لـ infinity"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "أبدية"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن الزمن الذي لا نهاية له، مدعوم بقوة في المعاجم القديمة والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَبَدِيَّة"
    - lemma: "خلود"
      decision: confirmed
      decision_reason: "يعبر عن البقاء الدائم، وهو مرادف قوي للأبدية وإن كان يغلب عليه سياق البقاء في حالة معينة (كالجنة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُلُود"
    - lemma: "سرمدية"
      decision: confirmed
      decision_reason: "تعبر عن الاتصال الدائم في الزمان الذي لا ينقطع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَرْمَدِيَّة"
    - lemma: "لانهائية"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح علمي ومنطقي ضروري لمقابلة infinity، شاع استخدامه في العصر الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "لَانِهَائِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "زمن بلا نهاية"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً؛ يفضل صياغة تعكس الديمومة والاتصال."
    authored:
      - type: terminological
        text: "ديمومة الزمن وامتداده المستمر الذي لا انقطاع له ولا آخر."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "ديمومة الزمن وامتداده المستمر الذي لا انقطاع له ولا آخر."}
  examples:
    per_lemma:
      - lemma: "أَبَدِيَّة"
        examples:
          - text: "تحدث الفلاسفة عن أبدية الكون واستحالة فنائه."
            type: usage
      - lemma: "خُلُود"
        examples:
          - text: "العمل الصالح هو السبيل الوحيد لخلود الذكر بعد الموت."
            type: usage
      - lemma: "سَرْمَدِيَّة"
        examples:
          - text: "تتجلى سرمدية الخالق في ديمومة ملكه التي لا بدء لها ولا منتهى."
            type: usage
      - lemma: "لَانِهَائِيَّة"
        examples:
          - text: "تعد اللانهائية مفهوماً مركزياً في الرياضيات الحديثة وحساب التفاضل."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "أَبَدِيَّة"
      entry_id: "{auto}"
      root: "أبد"
      maqayis_quote: "«الْهَمْزَةُ وَالْبَاءُ وَالدَّالُ يَدُلُّ بِنَاؤُهَا عَلَى طُولِ الْمُدَّةِ، وَعَلَى التَّوَحُّشِ. قَالُوا: الْأَبَدُ: الدَّهْرُ»"
    - lemma: "خُلُود"
      entry_id: "{auto}"
      root: "خلد"
      maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الثَّبَاتِ وَالْمُلَازَمَةِ، فَيُقَالُ: خَلَدَ: أَقَامَ... وَمِنْهُ جَنَّةُ الْخُلْدِ»"
    - lemma: "سَرْمَدِيَّة"
      entry_id: "{auto}"
      root: "سرد"
      maqayis_quote: "«وَمِنْ ذَلِكَ (السَّرْمَدُ): الدَّائِمُ، وَالْمِيمُ فِيهِ زَائِدَةٌ، وَهُوَ مِنْ سَرَدَ، إِذَا وَصَلَ، فَكَأَنَّهُ زَمَانٌ مُتَّصِلٌ بَعْضُهُ بِبَعْضٍ»"
    - lemma: "لَانِهَائِيَّة"
      entry_id: "{auto}"
      root: "نهي"
      maqayis_quote: "«النُّونُ وَالْهَاءُ وَالْيَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى بُلُوغِ الْغَايَةِ... وَالنِّهَايَةُ: الْغَايَةُ»"
  per_sense:
