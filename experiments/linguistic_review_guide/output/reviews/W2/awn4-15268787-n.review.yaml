      sense_id: "{auto}"
      nuance: "تؤكد على صفة الاتصال التام بين أجزاء الزمن بحيث لا يتخلله انقطاع."
      mwe: false
    - lemma: "لَانِهَائِيَّة"
      sense_id: "{auto}"
      nuance: "مصطلح علمي ورياضي يشير إلى ما لا يحده حد أو غاية، ويقابل infinity بدقة."
