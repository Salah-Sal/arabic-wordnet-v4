        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْشِيحٌ"
    - lemma: "فلترة"
      decision: confirmed
      decision_reason: "رغم كونه تعريباً، إلا أنه مستخدم بكثافة في المعاجم التقنية والزراعية المعاصرة كمرادف دقيق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِلْتَرَةٌ"
    - lemma: "تَصْفِيَةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح أصيل وشائع الاستخدام في السياقات العلمية والعامة للتنقية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَصْفِيَةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13501870-n"}
    - lemma: "رَشْحٌ"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم كمرادف للترشيح في علوم الأرض (الجيولوجيا) وصناعة النفط والري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رَشْحٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13501870-n"}
    - lemma: "تَرْوِيقٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي فصيح يصف عملية تصفية السوائل، ويضيف عمقاً تاريخياً للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَرْوِيقٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13501870-n"}

stage4_content:
  definition:
    current: "العملية التي تمر بها السوائل عبر مرشح أو وسط ترشيح"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب ويحتاج لبيان الغرض من العملية (الفصل) وتوسيع النطاق ليشمل الغازات والموائع عموماً."
    authored:
      - type: terminological
        text: "عملية ميكانيكية أو طبيعية تهدف إلى فصل المواد الصلبة العالقة من الموائع (سوائل أو غازات) عبر نفاذها من وسط مساميّ (مرشح) يمنع مرور الجسيمات."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13501870-n", definition_index: 0, text: "عملية ميكانيكية أو طبيعية تهدف إلى فصل المواد الصلبة العالقة من الموائع (سوائل أو غازات) عبر نفاذها من وسط مساميّ (مرشح) يمنع مرور الجسيمات."}
  examples:
    per_lemma:
      - lemma: "تَرْشِيحٌ"
        examples:
          - text: "تعتمد تنقية مياه الشرب على مرحلة الترشيح الرملي لإزالة العوالق الدقيقة."
            type: usage
      - lemma: "تَصْفِيَةٌ"
        examples:
          - text: "تجري تصفية الزيت من الشوائب المعدنية لضمان كفاءة المحرك."
            type: usage
      - lemma: "رَشْحٌ"
        examples:
          - text: "يتم استخراج النفط بعد عملية رشح معقدة عبر طبقات الصخور المسامية."
            type: usage
      - lemma: "تَرْوِيقٌ"
        examples:
          - text: "يُترك العصير لفترة حتى يترسب كدره ثم تبدأ عملية الترويق."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تعتمد تنقية مياه الشرب على مرحلة الترشيح الرملي لإزالة العوالق الدقيقة."}

