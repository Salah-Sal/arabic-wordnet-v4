stage1_review:
  assessment:
    concerns:
      - "غياب مصطلح 'تصفية' وهو ركن أساسي في هذا الحقل الدلالي رغم وروده في تعريفات المعاجم كمرادف للترشيح."
      - "لفظة 'فلترة' هي تعريب شائع ولكنها قد تُعتبر أقل فصاحة في السياقات اللغوية الصرفة مقارنة بـ 'تصفية'."
    observations: "المجموعة تغطي المفهوم الفيزيائي والتقني لعملية فصل المواد الصلبة عن الموائع. اللمّات الحالية جيدة ولكنها تحتاج إثراء بمرادفات فصيحة ومعجمية."
  blind_candidates:
    - lemma: "تَرْشِيحٌ"
      generation_method: ishtiqaq
      justification: "المصدر القياسي للفعل 'رَشَّح'، وهو المصطلح العلمي المتداول في الكيمياء والفيزياء."
    - lemma: "تَصْفِيَةٌ"
      generation_method: ishtiqaq
      justification: "من 'صَفَّى'، وهو مصطلح أصيل يدل على تنقية السائل من الشوائب، ويُستخدم بالتبادل مع الترشيح."
    - lemma: "رَشْحٌ"
      generation_method: ishtiqaq
      justification: "مصدر الفعل 'رَشَحَ'، ويُستخدم في السياق الطبيعي والجيولوجي للدلالة على نفاذ السائل عبر المسام."
    - lemma: "تَرْوِيقٌ"
      generation_method: ishtiqaq
      justification: "مصدر 'رَوَّقَ'، وهو لفظ تراثي فصيح لعملية تصفية السوائل (مثل الشراب) باستخدام المصفاة (الراووق)."

stage2_evidence:
  per_lemma:
    - lemma: "ترشيح"
      confirm:
        - text: "«فصل الأجسام الصُّلْبة العالقة فى سائل باستخدام مادة مساميّة تسمح للسائل بالنفاذ خلاله مُحْتَجِزَةً الأجسام العالقة»"
          source: "المعجم الوسيط"
        - text: "«تصفية الماء من المواد العالقة كالرمل و الطمي و غيرها»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
    - lemma: "تصفية"
      confirm:
        - text: "«أو ترشيح وهو فصل وإزالة الجسيمات العالقة من السوائل أو من الغازات»"
          source: "ArabTerm - مسرد المناخ والبيئة"
        - text: "«صفَّى الماء: أي نقاه»"
          source: "معجم الصواب اللغوي"
    - lemma: "فلترة"
      confirm:
        - text: "«تحلّ عملية الفلترة الغشائية محلّ المُعالجة اللاحقة لمياه الصرف الصحي»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«فلترة المياه»"
          source: "المكنز الزراعي (AGROVOC)"
    - lemma: "رشح"
      confirm:
        - text: "«عملية تمرير سائل عبر وسط راشح لإزالة المواد المعلقة أو الغروية»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«ترشيح، رشْح (Filtration)»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
    - lemma: "ترويق"
      confirm:
        - text: "«رَوَّقَ الشَّرَابَ: صفَّاهُ... الرَّاوُوقُ: المِصْفاةُ»"
          source: "المعجم الوسيط"
        - text: "«رَوَّقْتُهُ تَرْوِيقاً: صفَّيْتُهُ»"
          source: "تاج اللغة وصحاح العربية"

stage3_analysis:
  per_lemma:
