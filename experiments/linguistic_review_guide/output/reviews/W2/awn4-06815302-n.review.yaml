# ── المرحلة ١: المراجعة والتوليد (قراءة الملف المُقنّع أولاً) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'لمحة' تحمل في أصلها معنى النظرة البصرية السريعة (النظرة العجلى)، وهو معنى حسّي أوّلي، في حين أن المجموعة تعبّر عن 'إشارة غامضة' بمعنى دلالي أجرد يشمل غير البصري."
      - "التعريف الحالي 'إشارة غامضة' ترجمة حرفية للتعريف الإنجليزي، ويفتقر إلى عمق أسلوبي يناسب المعجم الوسيط؛ 'غامضة' تُوحي بالتعقيد والاشتباه أكثر من 'خافتة/غير صريحة' التي تُؤدّي المعنى المقصود."
      - "اللمّة الموجودة مكتوبة دون تشكيل كامل."
    observations: >
      المجموعة الترادفية awn4-06815302-n تُعبّر عن مفهوم 'الدلالة الغير صريحة الخافتة'
      التي تُلمّح إلى أمر دون أن تُفصح عنه. في العربية يُعبَّر عن هذا المفهوم بمسارين:
      الأوّل استعاري بصري (لمحة، وميض) يستحضر صورة اللمعة الخاطفة،
      والثاني اشتقاقي من دلالة الإشارة الضمنية (تلميح، إيماء، غمزة).
      اللمّة الحالية 'لمحة' تنتمي إلى المسار الأوّل، وهي مقبولة دلالياً إذ يُفيد معنى
      'في فلان لمحة من أبيه: شبه' في الاستخدام المجازي العام.
      الأولويات: تصحيح التشكيل، وتحسين التعريف، ودراسة إضافة لمّة ترادفية.

  blind_candidates:
    - lemma: "تَلْمِيح"
      generation_method: ishtiqaq
      justification: >
        من الجذر ل-م-ح على وزن تَفْعِيل، مصدر لَمَّحَ. يدلّ على الإشارة إلى الشيء دون التصريح به،
        وهو يناسب دلالة 'إشارة غامضة' من جهة انعدام الإفصاح. الوزن تَفْعِيل يُشير إلى عملية
        الإشارة المتعمَّد إخفاؤها.

    - lemma: "إِيمَاء"
      generation_method: ishtiqaq
      justification: >
        من الجذر و-م-أ على وزن إِفْعَال. عُرِّف في المعجمات بأنه 'إلقاء المعنى في النفس بخفاء وسرعة'،
        وهو يُناظر مفهوم 'الإشارة الغامضة' من جهة الخفاء وعدم التصريح.

    - lemma: "وَمِيض"
      generation_method: majaz
      justification: >
        من الجذر و-م-ض على وزن فَعِيل، أصله 'لمعان البرق'. يُوظَّف بالمجاز للدلالة على
        الأثر العابر الخاطف الذي يُلمح بشيء دون أن يُكشف تماماً، كما تُوظَّف 'لمحة البرق'
        في العربية للدلالة على القِصَر الشديد وعدم الإفصاح.

    - lemma: "غَمْزَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر غ-م-ز على وزن فَعْلَة. الجذر في مقاييس اللغة 'كالنخس في الشيء ثم يُستعار'،
        ومنه 'غمز بجفنه: أشار'. الغمزة إشارة خفية بالعين أو بالإيماء، وهي نوع من الدلالة
        الغامضة الضمنية غير المباشرة.


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────────────────────
# استعلامات منفَّذة: ١) مطابقة دفعية لجميع اللمّات ٢) إثراء بالمعرِّف ٣) جسر إنجليزي ٤) مقاييس اللغة
stage2_evidence:
  per_lemma:

    - lemma: "لَمْحَة"
      confirm:
        - text: >
            «النَّظرةُ العَجْلَى، يقال: رأيته لمحة البرق: قَدْرَ لمعة البَرْق من الزَّمان،
            يقال: فى فلان لمحةٌ من أبيه: شَبَهٌ»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >
            «(اللمحة) النظرة العجلى ويُقال رأيته لمحة البرق قدر لمعة البرق من الزمان
            ويُقال في فلان لمحة من أبيه شبه»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«خبر سريع ومختصر وغالباً ما يكون تمهيداً لتفصيلات لاحقة»"
          source: "مسرد الإعلام والتواصل، ALECSO (ARABTERM) — translation_en: flash"
      expands:
        - text: >
            «(1) يَرْمُق: يُلقي نظرة خاطفة على (2) يَلْمَح (3) glimmer (4) لمحة؛ نظرة خاطفة»
          source: "المورد الحديث (2008) — لمقابل: glimpse"
          addition: "يُؤكّد أن 'لمحة' هي المقابل العربي المعتمد لـ glimpse في المعاجم الثنائية الحديثة."
        - text: >
            «لَمْحَةٌ عَن — الجذر: ل م ح — المعنى: نظرة عاجلة —
            الصواب والرتبة: -هذه لمحة عن حياته [صحيحة]»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يُثبت صحة استخدام 'لمحة' بمعنى 'معلومة خاطفة غير مكتملة'، وهو قريب من الإشارة الغامضة."

    - lemma: "تَلْمِيح"
      confirm:
        - text: >
            «الإشارة إلى الشيء دون التصريح به مباشرة»
          source: "مسرد الإعلام والتواصل، ALECSO (ARABTERM) — translation_en: allusion"
        - text: >
            «إشارة من بعيد إلى فكرة أو موضوع أو شخص أثناء الحديث بطريقة يستطيع المخاطَب فهم المراد منها»
          source: "مسرد الإعلام والتواصل، ALECSO (ARABTERM) — translation_en: hinting"
      contradicts:
        - text: >
            «التلميح: هَكَذَا [=] التلميح: الإشارة في فحوى الكلام إلى قصة أو شعر من غير تصريح به»
          source: "معجم مقاليد العلوم للسيوطي + التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            التلميح في المصادر الكلاسيكية مصطلح بلاغي متخصص يُشير إلى الاستحضار الضمني
            لقصة أو شعر معروف في الكلام، وهو أخصّ من 'الإشارة الغامضة' التي تعني أيّ دلالة
            غير صريحة.
        - text: >
            «التلميح: أن يُشار في فحوى الكلام إلى قصة أو شعر أو مثل سائر من غير ذكره...
            أقسام التلميح ستة لأنه إما أن يكون في النظم أو النثر»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            تعريف مفصّل يُثبت أن التلميح فن بلاغي ذو تصنيف تقني محدد، مما يجعله بعيداً
            عن الاستخدام العام بمعنى 'إشارة غامضة'.

    - lemma: "إِيمَاء"
      confirm:
        - text: "«الْإِيمَاء: إِلْقَاء الْمَعْنى فِي النَّفس بخفاء وَسُرْعَة.»"
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: >
            «الإيماءُ: هُوَ الْكَلَام الْمُشَار بِهِ إِلَى الْمَطْلُوب من قُرْب لَا مَعَ الخفاء.»
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: >
            يُصرّح بأن الإيماء يكون 'لا مع الخفاء'، أي أنه إشارة واضحة من قريب،
            وهذا يتعارض مع طابع الغموض في تعريف المجموعة.
        - text: "«الإشارة باليد أو بالرأس»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي (OCR)"
          conflict: >
            الإيماء في أقدم مصادره إشارة جسدية حركية (باليد أو الرأس) لا دلالة
            لغوية غامضة.
        - text: >
            «الإيماء: هو التنبيه وأن تشير برأسك أو بيدك أو بحابك.
            وعند الأصوليين: هو من أقسام المنطوق غير الصريح»
          source: "التعريفات الفقهية للبركتي"
          conflict: >
            المعنى الأصولي 'غير الصريح' قريب من المجموعة، لكن المعنى الأصلي إشارة جسدية
            أو مصطلح أصولي متخصص، لا دلالة غامضة بالمعنى العام.

    - lemma: "وَمِيض"
      contradicts:
        - text: "«وَمِيض من (و م ض) لمعان البرق.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الوميض في جذره ومعجمياته دلالة بصرية مادية (لمعان البرق)، لا إشارة غامضة دلالية."
        - text: "«رسيلة ضوئية لجهاز ما تدلّ عادةً على وضع غير عادي»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          conflict: "الاستخدام التقني يُثبّت الوميض في دلالة الإشارة الضوئية التقنية، بعيداً عن المفهوم المجرد."

    - lemma: "غَمْزَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "لمحة"
      decision: confirmed
      decision_reason: >
        اللمّة مدعومة بأدلة معجمية متعددة من أبرز المصادر، وتحمل معنى 'الإشارة الغامضة'
        عبر استخدامها المجازي في 'في فلان لمحة من أبيه: شبه'، وهو شبه خفيف غير مُصرَّح
        به يُلامس دلالة 'vague indication'. كما أن المورد الحديث يُثبّتها مقابلاً لـ glimpse
        في المعاجم الثنائية. اللمّة تفتقر إلى التشكيل الكامل فتحتاج تحديثاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      quality_gate:
        ittiraad: "صحيح — اللمحة شائعة في الفصيح المعاصر والتراث"
        yusr_tadawul: "ميسور — مألوفة ومستعملة"
        mulaama: "ملائمة — تؤدّي المعنى بطريق المجاز المقبول"
        turaathi: "عربية تراثية من مقاييس اللغة"
        arabi: "جذر عربي أصيل ل-م-ح"
        ishtiqaqiyya: "مشتقة اشتقاقاً صحيحاً"
      morphological_fit: "فَعْلَة — وزن اسم المرة، يُفيد الدلالة الواحدة الخاطفة وهو ملائم للمفهوم"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَمْحَة"

    - lemma: "تَلْمِيح"
      source: stage1
      decision: removed
      decision_reason: >
        التلميح مصطلح بلاغي متخصص يعني الإشارة الضمنية إلى قصة أو شعر في الكلام دون ذكره
        صراحةً، وهو مصطلح تقني في علم البديع له تصنيف وأقسام محددة. وعلى الرغم من أن بعض
        التعريفات الحديثة (ARABTERM) قرّبته من 'الإشارة الغير مباشرة' عموماً، فإن التراث
        المعجمي يُثبّته في السياق البلاغي المتخصص. فضلاً عن ذلك، 'تلميح' مصدر فعلي يدلّ
        على الفعل لا على حاصله، خلافاً لهيكل المجموعة الترادفية التي تُشير إلى النتيجة/الكيان.
      evidence_assessment:
        case: mixed

    - lemma: "إِيمَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الإيماء في المصادر المعجمية إما إشارة جسدية حركية (باليد والرأس)، وإما مصطلح أصولي
        لقسم من المنطوق غير الصريح. التعريف الوحيد الذي يقترب من 'الإشارة الغامضة' هو
        'إلقاء المعنى في النفس بخفاء وسرعة' (الأحمدنكري)، غير أن التعريف المقابل
        'لا مع الخفاء' (السيوطي) يُشير إلى غياب الاتفاق في التراث حول خاصية الغموض.
        وبما أن الإيماء لا يُؤدّي دلالة 'الإشارة الغامضة' الكيانية المستقلة في المعجم الفصيح
        فهو مرفوض.
      evidence_assessment:
        case: mixed

    - lemma: "وَمِيض"
      source: stage1
      decision: removed
      decision_reason: >
        الوميض في جميع مصادره الكلاسيكية والحديثة يدلّ على لمعان البرق أو الإشارة الضوئية
        التقنية، ولا يُوجد في المعجمات ما يُثبّت توظيفه دلالياً بمعنى 'إشارة غامضة' مجردة.
        المجاز المقترح يبقى نظرياً غير مؤيَّد بنصوص معجمية.
      evidence_assessment:
        case: contradicts_only

    - lemma: "غَمْزَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على مادة معجمية مباشرة لـ'غمزة' في النصوص المفهرسة. الجذر غ-م-ز يدلّ
        في مقاييس اللغة على الإشارة بالجفن والنخس، وهي دلالة جسدية أكثر تخصصاً من
        'الإشارة الغامضة' العامة. تُرفض لغياب الأدلة ولضيق الدلالة.
      evidence_assessment:
        case: no_material


