        (جنس + فصل) لكنها تفتقر إلى دقة المعجم الوسيط. لفظ 'غامضة' يُوحي بالإبهام والاشتباه
        المقصود، في حين أن 'vague' تعني 'غير واضحة المعالم' أو 'خافتة'، مما يجعل 'خافتة'
