# ── المرحلة ١: المراجعة والتوليد ────────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لعنة تعني أصلاً فعل اللعن والطرد (إجراء إلهي)، لا الحالة الوجودية الناتجة عنه مباشرةً؛ وهذا انزياح بسيط عن المفهوم المطلوب"
      - "هلاك أبدي تعبير وصفي حر لا وحدة معجمية مسكوكة؛ الهلاك في أصله يدل على الفناء الجسدي والانكسار لا على الحالة الروحية للمحكوم عليه أبداً"
      - "التعريف الحالي «حالة الحكم بالعقاب الأبدي في الجحيم» صحيح دلالياً لكن «حالة الحكم» يحتمل أن تُقرأ حالةَ إصدار الحكم لا حالةَ الخضوع له"
      - "يغيب المصطلح الكلامي الإسلامي الأدق (الشقاوة الأبدية) عن اللمّات الحالية"
    observations: >
      تنتمي هذه المجموعة إلى حقل اللاهوت الأخروي (eschatology) المشترك بين الإسلام
      والمسيحية. المفهوم الإنجليزي «damnation» له وجهان: الوجه القضائي (صدور الحكم)
      ويقابله اللعنة أو الإدانة الإلهية، والوجه الوجودي (الحالة الناجمة) ويقابله
      الشقاوة الأبدية أو العذاب الأبدي. اللمّتان الحاليتان تُغطيان الوجه الأول جزئياً
      دون الوجه الثاني. المصطلح الجامع في التراث الكلامي الإسلامي هو «الشقاوة» في
      مقابل «السعادة»، وهو مصطلح مسكوك مُثبّت في المعجمية الكلاسيكية.

  blind_candidates:
    - lemma: "الشَّقَاوَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر شقو على وزن فَعَالة (اسم الحالة المستمرة)، وهو المصطلح الكلامي
        الإسلامي الرسيخ الدال على الحالة الوجودية لمن يُحكم عليه بالعذاب الأبدي،
        في مقابل السعادة الأخروية؛ ويقابل «damnation» من حيث الحالة الوجودية لا
        مجرد فعل الحكم.
    - lemma: "الخُسْرَان"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر خسر على وزن فُعْلان (المصدر الدال على التمكّن والاستمرار)؛
        مصطلح قرآني مكرّر (الخاسرون، الخسران المبين) يدل على الضياع الأبدي؛
        قد يغطي الجانب الكلّي للإدانة بمعنى خسارة الآخرة.
    - lemma: "الهَلَكَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر هلك على وزن فَعَلة (اسم المرة الواسعة)، دال على الهلاك التام
        والفناء الكلي؛ استُعمل في التراث بمعنى البوار والهلاك الروحي، ويمكن أن
        يحمل دلالة الإدانة الأبدية.
    - lemma: "الإِدَانَة الأَبَدِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي (إضافي + صفة) من: الإدانة (اشتقاق من دين/دان: أصدر حكماً)
        + الأبدية (نسبة إلى الأبد)؛ يعكس الجانب القضائي للمفهوم (صدور الحكم الإلهي)
        ويوازي المصطلح الفقهي الغربي «eternal condemnation».


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المنفَّذة:
# ١. مطابقة دفعية: لعنة + هلاك + شقاوة + خسران + هلكة + بوار
# ٢. جسر إنجليزي: damnation / eternal damnation / perdition / condemnation
# ٣. FTS عربي: عقاب أبدي + جهنم + الجحيم + الهلاك الأبدي
# ٤. مقاييس اللغة: جذور لعن / هلك / شقو / بور / خسر
stage2_evidence:
  per_lemma:

    - lemma: "لعنة"
      confirm:
        - text: >
            «اللّعنة: [في الأصل] الطَّرد، وشرعاً إبعادُ الله العبدَ من رحمته في
            الدنيا بانقطاع التوفيق وفي العُقبى بالابتلاء بالعقوبة»
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622)"
        - text: >
            «اللَّعْنة: شرعاً إبعادُ الله من رحمته في الدنيا بانقطاع التوفيق
            وفي العُقبى بالابتلاء بالعقوبة»
          source: "التعريفات الفقهية للبركتي (ت. 1975)"
        - text: >
            «اللعنة خلاف النصر. قال تعالى: {وَمَنْ يَلْعَنِ اللَّهُ فَلَنْ
            تَجِدَ لَهُ نَصِيرًا} وهي في اللغة: الطرد»
          source: "مفردات القرآن للفراهي (ت. 1930)"
      expands:
        - text: >
            «اللَّعْنة: العذاب، يُقال أصابته لعنة من السماء»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani، ت. 1998)"
          addition: >
            يُثبت استعمال اللعنة بمعنى العذاب الواقع من السماء — مما يُدعّم كونها
            تُعبّر عن الإدانة الأبدية لا مجرد فعل الطرد.
        - text: >
            «(1) «أ» الإدانة؛ اللَّعْن. «ب» المُدانيّة؛ الملعونيّة: كون الشيء
            مُدانًا أو ملعونًا. (2) الخطيئة المُمِيتة: خطيئة يستحق صاحبها
            العقوبة السرمدية (كن).»
          source: "المورد الحديث (2008) — مدخل translation_en: damnation"
          addition: >
            يُرادف المورد الحديث damnation بـ«اللعن» في أول المداخل ثم يُضيف
            معنى «الخطيئة المميتة» الموجِبة للعقوبة السرمدية، مما يؤكد
            الارتباط بمفهوم الإدانة الأبدية.

    - lemma: "هلاك أبدي"
      contradicts:
        - text: >
            «الهلاك: أعمُّ من الفناء وهو خروج الشيء عن الانتفاع المقصود به
            سواء بَقِيَ أو لم يبق أصلاً... والهلاكُ يُطلق أيضاً على الموت ولا
            يكون إلا في هيئة سوء»
          source: "التعريفات الفقهية للبركتي (ت. 1975)"
          conflict: >
            الهلاك في الأصل يعني الفناء الجسدي والإتلاف المادي، لا الحالة الروحية
            لمن حُكم عليه بالعذاب الأبدي؛ كما أنه يشترط «هيئة السوء» في الموت
            لا الاستمرار بعده.
        - text: >
            «الهلاك: السقوط، ولذلك يُقال للميت هَلَكَ»
          source: "مقاييس اللغة لابن فارس — مادة هَلَكَ"
          conflict: >
            ابن فارس يصدِّر الهلاك بالسقوط والموت، لا بحالة كونية أبدية ما
            بعد الموت؛ مما يُضعف «هلاك أبدي» كمصطلح للتدامة الأخروية.
      expands:
        - text: >
            «(1) هلاك؛ خراب (ا.ق). (2) الخَسار؛ البَوار: هلاك روحيّ أبديّ.
            (3) جَهَنَّم؛ دارُ البوار»
          source: "المورد الحديث (2008) — مدخل translation_en: perdition"
          addition: >
            المورد الحديث يُفرّق بين الهلاك المطلق والهلاك الروحي الأبدي؛ وأن
            «هلاك روحي أبدي» هو ما يقابل perdition — مما يعني أن «هلاك» وحده
            غير كافٍ دون التقييد بـ«روحي أبدي»، وهذا يُضعف «هلاك أبدي» كمصطلح
            مسكوك ثابت.

    - lemma: "الشَّقَاوَة"
      confirm:
        - text: >
            «الشقاوة: ضدّ السعادة، وكما أن السعادة ضربان: أخروية ودنيوية ثم
            الدنيوية ثلاثة أضرب: سعادة نفسية وبدنية وخارجية فالشقاء كذلك.
            وكل شقاوة تعب ولا عكس، فالتعب أعم»
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622)"
        - text: >
            «الشِّينُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى
            الْمُعَانَاةِ وَخِلَافِ السُّهُولَةِ وَالسَّعَادَةِ. وَالشِّقْوَةُ:
            خِلَافُ السَّعَادَةِ. وَرَجُلٌ شَقِيٌّ بَيِّنُ الشَّقَاءِ
            وَالشِّقْوَةِ وَالشَّقَاوَةِ»
          source: "مقاييس اللغة لابن فارس — مادة شَقُوَ"
        - text: "«(الشقاوة) الشَّقَاء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani، ت. 1998)"

    - lemma: "الخُسْرَان"
      expands:
        - text: >
            «الْخَاءُ وَالسِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى النَّقْصِ.
            فَمِنْ ذَلِكَ الْخُسْرُ وَالْخُسْرَانُ، كَالْكُفْرِ وَالْكُفْرَانِ»
          source: "مقاييس اللغة لابن فارس — مادة خَسِرَ"
          addition: >
            الخسران في أصل وضعه يدل على النقص المادي؛ واستُعمل قرآنياً بمعنى
            الخسارة الروحية الشاملة، لكنه لا يحمل بالضرورة دلالة الإدانة
            بالعقاب في جهنم تحديداً.

    - lemma: "الهَلَكَة"
      contradicts:
        - text: "«(الهلكة) السَّنَة الجدبة (ج) هلك وهلكات»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani، ت. 1998)"
          conflict: >
            الهلكة في المعاجم الموثوقة تعني السنة القحط والشدة لا التدامة
            الأبدية؛ مما يجعلها غير صالحة لهذا السياق.
        - text: "«(الهلكة) الساقطة من الناس»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani، ت. 1998)"
          conflict: "المعنى الثاني (الساقطة من الناس) أيضاً لا صلة له بالتدامة الأبدية."

    - lemma: "الإِدَانَة الأَبَدِيَّة"
      expands:
        - text: >
            «إدانة: صدور مقرر قضائي من طرف المحكمة يقضي بثبوت الجريمة أو
            الجرائم المرتكبة من طرف المتهم، ومعاقبته من أجل ذلك»
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: >
            الإدانة مصطلح قانوني حديث يُعبّر عن الجانب القضائي للمفهوم؛
            لكن التركيب «الإدانة الأبدية» لا وجود له كوحدة معجمية ثابتة
            في أي مصدر.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "لعنة"
      decision: confirmed
      decision_reason: >
        المعنى الشرعي للّعنة يشمل صريحاً إبعاد الله العبد من رحمته وابتلاءه
        بالعقوبة في العُقبى (التوقيف، البركتي)؛ وهو ما يُطابق «حالة الحكم
        بالعقاب الأبدي في الجحيم». التشكيل الكامل غائب — يلزم التصحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphology_check: >
        لَعْنَة: اسم مرة من لَعَنَ، على وزن فَعْلَة، جمعه لَعَنَات ولِعَان؛
        الوزن مناسب للاسم الدال على الفعلة الواحدة أو النوع، وهو مناسب لمعنى
        «حالة» الطرد والإبعاد الإلهي.
      nuance_differentiation: >
        تُعبّر عن الجانب القضائي-الإلهي للتدامة: صدور حكم الطرد من الرحمة
        والإبعاد عن الجنة؛ تنظر إلى الحالة من زاوية الفعل الإلهي (اللعن =
        الإبعاد). تُستعمل في الخطاب الديني الإسلامي والمسيحي على السواء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَعْنَة"

    - lemma: "هلاك أبدي"
      decision: removed
      decision_reason: >
        فشل في اختبار السكّ المعجمي: يمكن إبدال «هلاك» بـ«دمار» أو «خراب»
        أو «فناء» وتبقى العبارة وصفاً صحيحاً — مما يدل على أنها عبارة وصفية
        حرة لا مصطلح ثابت. فضلاً عن ذلك، الهلاك في أصله يدل على الفناء
        الجسدي والسقوط (ابن فارس: «الهاء واللام والكاف يدل على كسر وسقوط»)
        لا على الحالة الوجودية الروحية الأبدية ما بعد الموت. لا وجود لهذا
        المركب كوحدة معجمية ثابتة في أي من المعاجم المُستعلَمة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "شَقَاوَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        الشقاوة مصطلح كلامي إسلامي راسخ تُقابل به السعادة الأخروية؛ المناوي
        يُفصّلها ضرباً أخروياً ودنيوياً، والأخروية منها هي تحديداً حالة
        المحكوم عليه بالجحيم. مُثبَّتة في مقاييس اللغة والمعجم الوسيط وكتب
        التعريفات. تجتاز بوابة الجودة الاصطلاحية: عربية أصيلة، مشتقة قياساً،
        ذات دلالة محددة، تطّردُ اشتقاقاً (شقي، شقاء، شقاوة، شقوة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphology_check: >
        شَقَاوَة: مصدر صناعي شبه صرفي من شَقِيَ، على وزن فَعَالة (كـسَعَادة
        مقابلها)؛ الوزن يدل على الحالة المستمرة والطبيعة الثابتة — مناسب
        تماماً للحالة الوجودية المطلوبة.
      nuance_differentiation: >
        تُعبّر عن الحالة الوجودية الداخلية للمحكوم بالجحيم من منظور المعاناة
        والبُعد عن السعادة الأبدية؛ تنظر إلى الحالة من زاوية حال الشخص لا
        من زاوية الفعل الإلهي. وهي المصطلح الكلامي المقابل للسعادة الأخروية،
        مستعملة في الفقه والكلام والتصوف.
      actions:
        - command: create_entry
          params:
            lemma: "شَقَاوَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14482041-n"

    - lemma: "الخُسْرَان"
      source: stage1
      decision: removed
      decision_reason: >
        الخسران يدل على النقص والخسارة العامة (ابن فارس: «أصل يدل على النقص»)
        وهو مصطلح قرآني للخسارة الروحية الشاملة، لكنه لا يُحدّد الحالة من
        كون المرء محكوماً عليه بالعقاب في جهنم. إنه أوسع من المفهوم المطلوب
        ولا يحمل ضمنياً الدلالة المقيّدة بالجحيم.

    - lemma: "الهَلَكَة"
      source: stage1
      decision: removed
      decision_reason: >
        الهلكة في المعاجم الموثوقة تعني السنة الجدبة أو الساقطة من الناس
        (المعجم الوسيط، المعجم الكبير)؛ ليس لها صلة بمفهوم التدامة الأبدية.
        اتضح بعد الأدلة أن التخمين الأولي كان خاطئاً.

    - lemma: "الإِدَانَة الأَبَدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حر لا وحدة معجمية ثابتة: فشل في اختبار التثبيت المعجمي
        (لم يُعثر عليه في أي معجم)، وفي اختبار السكّ (يمكن إبدال «الأبدية»
        بـ«الإلهية» أو «الأخروية» وتبقى عبارة وصفية سليمة). فضلاً عن أن
        «إدانة» مصطلح قانوني حديث يحمل دلالة إجرائية لا وجودية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────────
