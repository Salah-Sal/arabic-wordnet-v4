        أكثر الصيغ دورانًا في الأدبيَّات العلميَّة العربيَّة. لذا يُحكَم بإبقائها مع تصحيح
        صيغتها الصرفيَّة (إزالة «ال» الزائدة على «القابلية» وإعادة بناء التركيب الإضافي)
