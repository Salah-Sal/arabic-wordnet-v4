        مما يجعلها الأكثر ملاءمةً للسياقَين الأكاديمي العام والهندسي، وتُقابلُ مباشرةً
        مصطلح «قابليَّة الذوبان» (solubility) باتِّساقٍ مصطلحيٍّ واضح.
