# insolubility — خاصية عدم القابلية للذوبان
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عدم القابلية للذوبان» عبارةٌ وصفيَّةٌ حرَّة لا مصطلحٌ مسكوك: يمكن إبدال «القابلية» بـ«الاستعداد» أو «الطاقة» دون أن يفقد الوصفُ دلالتَه، وهو ما يُوقِعُها في اختبار الاستبدال."
      - "دوران معجمي: مكوِّنات اللمّة تُعيد صياغة التعريف نفسَه، وهذا مرفوض في المنهجيَّة."
      - "اللمّة خاليةٌ من التشكيل، كما أن الصيغة الصرفيَّة (عدم + القابلية + للذوبان) تخالف الأنماط الإضافيَّة الأكثر رسوخًا في المعاجم التقنيَّة."
      - "التعريف الحالي يُعيد صياغة اللمّة ذاتها («خاصية عدم القابلية للذوبان وصعوبة الانحلال») دون إضافة جنس قريب أو فصل نوعي حقيقي."
    observations: >
      المفهوم insolubility ينتمي إلى حقل الكيمياء الفيزيائية وعلم المواد، وهو وصفٌ كمِّي-نوعي لخاصية
      مادَّة ما. الفرق بين «عدم الذوبان» (insolubility) و«قابلية الذوبان» (solubility) فرقٌ ثنائي
      كالأبيض والأسود في الطيف الكيميائي. المصطلح يحتاج إلى لمَّة مُفردة أو شبه مُفردة تمتلك وزنًا صرفيًّا
      يُميِّزها عن الوصف الحرّ، وأفضلها ما جاء على صيغة المصدر الصناعي (فعَّالية/لافعَّالية) أو التركيب
      الإضافي الثنائي الثابت.

  blind_candidates:
    - lemma: "اللاَّذَوَّابِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدرٌ صناعي على وزن الياء النسبة من الصفة «ذَوَّاب» (صيغة مبالغة من ذاب-يذوب) مع سابقة النفي
        «لا»، قياسًا على صياغة المصطلحات الكيميائية بضمِّ سابقة لا إلى المصدر الصناعي للصفة التقنيَّة،
        على غرار «اللامائيَّة» و«اللاهوائيَّة» وما إليهما. الصيغة تُعبِّر عن الخاصيَّة الكيميائيَّة
        دون دوران، وتقبل لام التعريف والجمع السالم والنسبة.
    - lemma: "عَدَمُ الذَّوَبَانِ"
      generation_method: tarkib
      justification: >
        تركيبٌ إضافيٌّ ثنائيٌّ من «عَدَم» (مصدر = فقدان) و«الذَّوَبَان» (مصدر من ذاب-يذوب).
        يُعبِّر عن الخاصيَّة بوصفها انعدامًا لعمليَّة الذوبان، وهو نمطٌ شائعٌ في المصطلح العلمي العربي
        («عدم التوافق»، «عدم الاستقرار»). اختُبر السكُّ: إبدال «الذوبان» بـ«الانحلال» يُعطي مصطلحًا
        مختلفًا نسبيًّا لا وصفًا حرًّا، مما يدلُّ على درجة من الثبات المعجمي.
    - lemma: "الرُّسُوخِيَّة"
      generation_method: majaz
      justification: >
        إحياءٌ لجذر «رَسَخَ» (رسخ الشيء في الأرض = ثبت وتمكَّن ولم يتحرَّك) بالإزاحة الدلاليَّة
        إلى مقاومة التغيُّر الفيزيائي (الذوبان). الرسوخيَّة تستحضر صورة الثبات أمام عوامل الإذابة،
        وكانت تُستخدم في النصوص الكيميائيَّة الكلاسيكيَّة للدلالة على الجسم المتماسك الذي لا يتحلَّل.
    - lemma: "اللاَّانْحِلَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدرٌ صناعي من «انْحِلَال» (مصدر انحلَّ-ينحلُّ) مع سابقة النفي «لا» + ياء النسبة،
        مُركَّزًا على عمليَّة الانحلال (dissolution) لا فقط الذوبان (dissolving)، مما يُغطِّي
        الطيف الأوسع للمفهوم. نمط الاشتقاق قياسيٌّ ومنتج في المصطلح العلمي الحديث.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عدم القابلية للذوبان"
      confirm:
        - text: "«عدم قابلية الذوبان» [ترجمة: insolubility / insolubilité]"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — أرابترم"
        - text: "«عدم قابلية الذوبان» [ترجمة: insolubility / insolubilité]"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999) — أرابترم"
      expands:
        - text: "«(1) لا يُفسَّر؛ لا يُحَلّ insoluble problems (2) غير ذوّاب؛ غير قابل للذوبان an insoluble salt.»"
          source: "المورد الحديث (2008) — أرابترم"
          addition: "يُثبت الاستعمال المزدوج لـ «غير قابل للذوبان» كصفة، وليس اسمًا للخاصيَّة ذاتها، مما يدعم استبدال اللمّة بمصطلح اسمي أدقّ."

    - lemma: "اللاَّذَوَّابِيَّة"
      confirm:
        - text: "«عدم الذوبان، لاذوبانية (ال...)، عدم الانحلال» [ترجمة: insolubility / insolubilité]"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — أرابترم"
        - text: "«لاذَوَّاب» [ترجمة: insoluble / insoluble]"
          source: "المعجم الطبي الموحد (2009) — أرابترم"
        - text: "«أَميدينٌ لاذَوَّابٌ (أميلوبكتين)» [ترجمة: insoluble amidine (amylopectin)]"
          source: "المعجم الطبي الموحد (2009) — أرابترم"
        - text: "«بروتينٌ لاذَوَّاب» [ترجمة: insoluble protein]"
          source: "المعجم الطبي الموحد (2009) — أرابترم"
      expands:
        - text: "«غير ذؤوب، غير حَلول، غير ذواب» [ترجمة: insoluble]"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — أرابترم"
          addition: "تُثبت النصوص تنوُّع المقابلات العربية للصفة insoluble، وتُبرز أن «ذَوَّاب» مصطلحٌ صرفيٌّ راسخٌ في الكيمياء، مما يدعم اشتقاق «اللاَّذَوَّابِيَّة» اسمًا للخاصيَّة."

    - lemma: "عَدَمُ الذَّوَبَانِ"
      confirm:
        - text: "«عدم الذوبان، لاذوبانية (ال...)، عدم الانحلال» [ترجمة: insolubility / insolubilité]"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — أرابترم"
      expands:
        - text: "«ذوبان» [ترجمة: dissolution / dissolving] — «عكس عملية التبخُّر»"
          source: "معجم الطاقة المتجددة (1996) + معجم الفيزياء (1989) — أرابترم"
          addition: "تُثبت أن «الذوبان» مصطلحٌ قائمٌ بذاته، وأن «عدم الذوبان» تركيبٌ سلبيٌّ طبيعيٌّ منه."
        - text: "«الذّوبانيّة؛ الذائبيّة؛ الانحلاليّة: قابلية الذوبان أو الانحلال»"
          source: "المورد الحديث (2008) — أرابترم"
          addition: "يُقدِّم المورد الحديث «الذوبانيَّة» مقابلًا لـ solubility، مما يُرسِّخ أن جذر «ذوب» هو المحور الاصطلاحي للباب."

    - lemma: "الرُّسُوخِيَّة"
      evidence_status: "no_material_found"

    - lemma: "اللاَّانْحِلَالِيَّة"
      confirm:
        - text: "«لاَ انْحِلاَلِيَّة» [ترجمة: insolubility / insolubilité]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — أرابترم"
        - text: "«لاَ مُنْحَلّ» [ترجمة: insoluble / insoluble]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — أرابترم"
      expands:
        - text: "«(1) الذّوبانيّة؛ الذائبيّة؛ الانحلاليّة: قابلية الذوبان أو الانحلال (2) الحَلِّيّة: قابلية الحلّ والتفسير.»"
          source: "المورد الحديث (2008) — أرابترم"
          addition: "يُثبت أن «الانحلاليَّة» مُرادفٌ لـ «الذوبانيَّة» في العربيَّة، وأن سابقة «لا» تنتج الضدَّ الاصطلاحي المناسب."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
