# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «عَدَم سَارِّيَّة» مركّب نفيّ غير مُثبَت معجمياً، يشبه الترجمة الحرفية لـ unpleasantness ولا يشكّل وحدة معجمية ثابتة."
      - "لمّة «كَرَاهَة» محمّلة بالمعنى الفقهي (المكروه شرعاً) بصورة قد تطغى على الدلالة النفسية العامة."
      - "لمّة «إِزْعَاج» تدل أساساً على فعل التسبب في القلق (مصدر حَدَثي) لا على الصفة الجوهرية المجردة، مما يخلق تنافراً مع تعريف المجموعة الذي يتطلب صفةً لا حدثاً."
      - "التعريف الحالي «صفة ما يسبب عدم الارتياح أو الانزعاج» يستخدم «الانزعاج» — وهو من جذر «زعج» الذي تنتمي إليه لمّة «إِزْعَاج» — فيقع في دوران جزئي."
    observations: >
      المجموعة تُعرِّف مفهوماً تجريدياً يصف الصفة الذاتية للشيء الذي يُولِّد عدم الرضا أو النفور في النفس. ثلاث لمّات موجودة:
      «إِزْعَاج» (مصدر أزعج)، «كَرَاهَة» (مصدر كرِه)، «عَدَم سَارِّيَّة» (مركب نفيّ).
      المشكلة الرئيسية أن المصادر الفعلية (كإزعاج) تميل إلى الدلالة على الحدث لا على الصفة الجوهرية،
      في حين أن صيغة «عدم + مصدر صناعي» غير رائجة في الاستخدام الفصيح المعجمي.
      الأجدى هو الاعتماد على أسماء المصادر/المصادر الجامدة على وزن فَعَالة أو نحوه للتعبير عن الصفة المجردة.

  blind_candidates:
    - lemma: "بَشَاعَة"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر (ب ش ع) على وزن فَعَالة. يدل على صفة الشيء الكريه البشيع الذي تنفر منه النفس.
        أصل الجذر عند الخليل: «طعم كريه فيه جفوف ومرارة»، ثم اتسع ليشمل كل ما يُكره ويُنفِّر.
        يناسب الدلالة على الصفة الجوهرية المجردة لكون الشيء منفِّراً وغير مستحسَن.

    - lemma: "نُفُور"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر (ن ف ر) على وزن فُعُول. أصل الجذر «تجافٍ وتباعد».
        يُستخدم لوصف ما يُقابله النفس بالإعراض والتباعد، فيُعبِّر عن صفة ما يُوجِب الهروب منه.
        من المورد الحديث: «نُفُور» = antipathy.

    - lemma: "مَرَارَة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من الطعم المُرّ (جذر م ر ر) إلى الصفة المجردة للتجربة غير السارّة.
        «مرارة التجربة» و«مرارة الموقف» استخدامان فصيحان راسخان يدلان على عدم الارتياح الناجم عن شيء ما.
        المجاز هنا مشابهة تأثيرية: كما أن الطعم المُرّ يُنفِّر، كذلك الشيء الكريه.

    - lemma: "مَكْرَهَة"
      generation_method: ishtiqaq
      justification: >
        اسم مكان/مصدر ميمي من جذر (ك ر ه) على وزن مَفعَلة. تعني «ما يكرهه الإنسان ويشق عليه».
        تعبِّر عن الصفة القائمة في الشيء التي تجعله مكروهاً، وهو ما يتوافق مع «the quality of giving displeasure».
        الوزن مَفعَلة يفيد الاشتمال على المعنى، كما في: مَضيَعة، مَذلَّة، مَهلكة.


