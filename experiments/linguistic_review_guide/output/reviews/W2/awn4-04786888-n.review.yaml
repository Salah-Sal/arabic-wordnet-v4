        المعجم الوسيط يُعرِّفها بـ«ما يكرهه الإنسان ويشق عليه» — وهذا يعني الشيء المكروه نفسه
        (الاسم) لا الصفة المجردة لكون شيءٍ ما موجِباً للكراهة. الفرق: unpleasantness =
        الصفة المجردة للشيء، في حين مَكرَهة = الشيء المكروه بعينه (اسم جنس). التمييز الفلسفي
        هنا ضروري لدقة الشبكة الدلالية.


