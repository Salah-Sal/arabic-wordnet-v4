# مراجعة المجموعة الترادفية — awn4-15315015-n
# period — الفترة المستغرقة لإكمال دورة واحدة من ظاهرة متكررة بانتظام
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «فترة الدورة» تعبير وصفي حرّ وليس مصطلحاً مسكوكاً — يمكن إبدال «فترة» بـ«مدة» أو «زمن» وتبقى العبارة صالحة"
      - "اللمّة «دورة» تحمل دلالة الحدث (المرة الواحدة من الدوران) أكثر من دلالة الفاصل الزمني المقاس"
      - "غياب المصطلح العلمي المعياري «دَوْر» الذي تعتمده المعاجم الموحدة للرياضيات والفيزياء"
    observations: "المفهوم المطلوب هو الفاصل الزمني اللازم لإتمام تكرار واحد لظاهرة دورية — وهو مفهوم فيزيائي-رياضي محدد. المصطلح العربي المعتمد في معاجم الرياضيات والفلك والفيزياء هو «دَوْر» (بفتح الدال وسكون الواو)، بينما «دَوْرَة» أقرب إلى مفهوم الحدث الدوري نفسه لا إلى مقدار زمنه. أمّا «فترة الدورة» فعبارة وصفية لا تعدّ مصطلحاً ثابتاً."

  blind_candidates:
    - lemma: "دَوْر"
      generation_method: ishtiqaq
      justification: "مشتقّ من الجذر «دور» على وزن فَعْل، يدلّ على الحركة الدائرية وعود الشيء إلى ما كان عليه. يُستعمل في العلوم الدقيقة بمعنى الزمن اللازم لذبذبة واحدة."
    - lemma: "زَمَنُ الذَّبْذَبَة"
      generation_method: tarkib
      justification: "مركّب إضافي يجمع بين «زمن» (الفاصل الزمني) و«الذبذبة» (الاهتزازة الواحدة)، يدلّ مباشرة على الفترة المستغرقة لذبذبة واحدة."
    - lemma: "مُدَّة"
      generation_method: ishtiqaq
      justification: "من الجذر «مدد» على وزن فُعْلَة، تدلّ على المقدار الزمني. وردت في بعض المعاجم التقنية بمعنى period."
    - lemma: "أَمَد"
      generation_method: majaz
      justification: "من الجذر «أمد» بمعنى الغاية والمنتهى، يُراد به مجازاً مقدار الزمن بين بداية الظاهرة ومنتهاها في دورة واحدة."


stage2_evidence:
  per_lemma:
    - lemma: "دَوْرَة"
      confirm:
        - text: "«المَرَّةُ الواحِدَةُ يَدُورُها الشَّىءُ فى زَمَنٍ مُعَيَّن, يُقال: دَورَةٌ أُسْبوعيَّة, أو شهريَّة, أو سنويَّة.»"
          source: "المعجم الكبير (OCR)"
        - text: "«(الدورة) فِي الْمَكْرُوه الدائرة و (الدورة الدموية) دوران الدَّم فِي الْبدن...»"
          source: "المعجم الوسيط"
      expands:
        - text: "«دورة» — period — Electropedia (IEC 60050)"
          source: "موسوعة الكهرباء"
          addition: "تُستعمل في المصطلحات الكهربائية بمعنى period"
        - text: "«دورة، زمن الذبذبة» — period — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          source: "المعجم الموحد لمصطلحات الفيزياء"
          addition: "تُقرن بـ«زمن الذبذبة» كمرادف تفسيري"

    - lemma: "فَتْرَة الدَّوْرَة"
      evidence_status: "no_material_found"

    - lemma: "دَوْر"
      confirm:
        - text: "«الزمن اللازم لذبذبة واحدة، وهو مقلوب التردد»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
        - text: "«الزمن اللازم لذبذبة واحدة، وهو مقلوب التردد.»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية — مدخل «مُدّة» (period)"
        - text: "«دَوْر» — period — المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
        - text: "«دوْر» — period — المعجم الموحد لمصطلحات الكيمياء (1992)"
          source: "المعجم الموحد لمصطلحات الكيمياء"
        - text: "«دَوْر» — period — المعجم الموحد لمصطلحات الفيزياء العامة والنووية، عبر «فترة زمنية» بالمرادف «دَوْر»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«الدّور بالفتح لغة الحركة وعود الشيء إلى ما كان عليه... والدور والدورة عند المهندسين وأهل الهيئة والمنجمين هو أن يعود كل نقطة من الكرة إلى الوضع الذي فارقته»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يؤكّد أنّ الدَّوْر مصطلح عند المهندسين والفلكيين بمعنى عودة النقطة إلى وضعها الأول"

    - lemma: "زَمَنُ الذَّبْذَبَة"
      confirm:
        - text: "«دورة، زمن الذبذبة» — period — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          source: "المعجم الموحد لمصطلحات الفيزياء"

    - lemma: "مُدَّة"
      contradicts:
        - text: "«(الْمدَّة) الْبرهَة من الدَّهْر تقع على الْقَلِيل وَالْكثير»"
          source: "المعجم الوسيط"
          conflict: "«مُدَّة» عامّة جداً تدلّ على أيّ برهة من الزمن دون تخصيص بالظواهر الدورية"
      expands:
        - text: "«مُدّة» — period — المعجم الموحد لمصطلحات الحرب الإلكترونية (2004): «الزمن اللازم لذبذبة واحدة، وهو مقلوب التردد.»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية"
          addition: "استُعملت في سياق تقني محدد لكنها ليست المصطلح السائد"

    - lemma: "أَمَد"
      contradicts:
        - text: "«(أَمَدَ) الْهَمْزَةُ وَالْمِيمُ وَالدَّالُ، الْأَمَدُ: الْغَايَةُ. كَلِمَةٌ وَاحِدَةٌ لَا يُقَاسُ عَلَيْهَا.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأمد يدلّ على الغاية والمنتهى لا على الفاصل الزمني الدوري"
        - text: "«(الأمد) الْغَايَة وَالنِّهَايَة يُقَال ضرب لَهُ أمدا أَي غَايَة»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي يركّز على نقطة النهاية لا على مقدار الزمن المتكرر"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "دَوْرَة"
      decision: confirmed
      decision_reason: "لمّة ثابتة معجمياً بمعنى المرة الواحدة من الدوران في زمن معيّن. وردت في معاجم الفيزياء والكهرباء بمعنى period. لكنها أقرب دلالياً إلى الحدث الدوري منها إلى الفاصل الزمني المقاس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الحدث الدوري نفسه (المرة الواحدة من الدوران) أكثر من دلالتها على مقدار الزمن المُقاس، وتُستعمل في السياقات العامة والتطبيقية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَوْرَة"

    - lemma: "فَتْرَة الدَّوْرَة"
      decision: removed
      decision_reason: "تعبير وصفي حرّ يفشل في اختبار السكّ — يمكن إبدال «فترة» بـ«مدة» أو «زمن» دون تغيّر المعنى. لم يُعثر عليه مصطلحاً ثابتاً في أيّ معجم. كما أنّ بنيته تكاد تكون ترجمة حرفية لـ«period of cycle»."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "دَوْر"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح العلمي المعتمد في المعاجم الموحدة للرياضيات والفلك والكيمياء والفيزياء والاستشعار عن بعد بمعنى period. تعريفه في معاجم متعددة: «الزمن اللازم لذبذبة واحدة، وهو مقلوب التردد» — وهو مطابق تماماً لتعريف المجموعة. وله أساس تراثي في كشاف اصطلاحات الفنون."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ تحديداً على المقدار الزمني المُقاس لتكرار واحد من ظاهرة دورية — المصطلح العلمي الدقيق في الفيزياء والرياضيات، وهو مقلوب التردد."
      actions:
        - command: create_entry
          params: {lemma: "دَوْر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "زَمَنُ الذَّبْذَبَة"
      source: stage1
      decision: removed
      decision_reason: "ورد في معجم الفيزياء كمرادف تفسيري لـ«دورة» لا كمصطلح مستقل. كما أنه مقيّد بالذبذبات فقط ولا يشمل جميع الظواهر الدورية (كالدوران الفلكي)."
      evidence_assessment:
        case: mixed

    - lemma: "مُدَّة"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام جداً يدلّ على أي برهة زمنية. استعماله في معجم واحد (الحرب الإلكترونية) لا يكفي لتثبيته مصطلحاً تقنياً مقابل «دَوْر» المعتمد في عدة معاجم موحدة."
      evidence_assessment:
        case: mixed

    - lemma: "أَمَد"
      source: stage1
      decision: removed
      decision_reason: "الأمد في اللغة يدلّ على الغاية والمنتهى، وابن فارس نصّ على أنه «كلمة واحدة لا يُقاس عليها». لا يناسب دلالة الفاصل الزمني الدوري المتكرر."
      evidence_assessment:
        case: contradicts_only


