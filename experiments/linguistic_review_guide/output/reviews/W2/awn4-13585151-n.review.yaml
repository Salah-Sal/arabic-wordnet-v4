stage1_review:
  assessment:
    concerns:
      - "التعريف يترجم الأصل الإنجليزي بشكل حرفي نوعاً ما ('growing together')، ويُفضّل إبراز فكرة التلاصق أو الاتحاد العضوي."
    observations: "المفهوم علمي (أحيائي/تشريحي) يتعلق بالتصاق ونمو الأجزاء معاً كالعظام (ارتفاق) أو الأعضاء (التحام)."
  blind_candidates:
    - lemma: "اِلْتِحَام"
      generation_method: ishtiqaq
      justification: "من الجذر (ل ح م)، على وزن (افتعال) للدلالة على التلاصق والاندماج بين الأجزاء الحية كأنها قطعة لحم واحدة."
    - lemma: "تَلَاحُم"
      generation_method: ishtiqaq
      justification: "على وزن (تفاعل)، يدل على المشاركة والارتباط الوثيق والنمو المزدوج بين الهياكل العضوية."
    - lemma: "تَرَاكُب"
      generation_method: ishtiqaq
      justification: "على وزن (تفاعل)، يُستخدم للدلالة على نمو أجزاء فوق بعضها أو تداخلها."
    - lemma: "اِنْدِمَاج"
      generation_method: ishtiqaq
      justification: "على وزن (انفعال)، يدل على دخول الهياكل في بعضها البعض لتكوين بنية واحدة."

stage2_evidence:
  per_lemma:
    - lemma: "ارتفاق"
      confirm:
        - text: "«الارتفاق: نموّ الأجزاء أو الأعضاء المتماثلة معًا. وبخاصة: التصاق العظام أو التحامها.»"
          source: "المورد الحديث"
        - text: "«التصاق العظام.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
      contradicts: []
      expands:
        - text: "«symphysis»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"
    - lemma: "التحام"
      confirm:
        - text: "«مكان الالتحام بين عظمين متناظرين على الجانبين»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
        - text: "«اتحاد أعضاء ليست من نوع واحد , وخاصة في الزهرة , كاتحاد البَتَلَات بالأَسْدِيَة»"
          source: "المعجم الوسيط"
      contradicts: []
      expands: []
    - lemma: "تلاحم"
      confirm: []
      contradicts:
        - text: "«طريقةُ ودرجةُ ارتباط المهمّات التي تُنجزها نَسِيقَةٌ module برمجيةٌ وحيدةٌ بعضِها ببعض»"
          source: "معجم مصطلحات المعلوماتية"
          conflict: "دلالة بعيدة عن النمو العضوي، وتستخدم أكثر في السياقات البرمجية واللسانية."
      expands: []
    - lemma: "تراكب"
      confirm: []
      contradicts:
        - text: "«(فى علم النبات): زيادة جدار الخليَّة فى الغِلظ بإضافة مادة التغليظ طبقة فوق أُخرى»"
          source: "المعجم الوسيط"
          conflict: "يدل على التراكم الطبقي (overlap) وليس نمو الأجزاء لتكوين بنية مترابطة (symphysis)."
      expands: []
    - lemma: "اندماج"
      confirm:
        - text: "«التحام الأجزاء المتجاورة.»"
          source: "معجم المصطلحات الطبية"
      contradicts:
        - text: "«اتحاد خليتين أو نواتين معا عند التناسل كاتحاد الأمشاج لتكوين اللاقحة»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
          conflict: "غالباً ما يُستخدم على المستوى الخلوي (syngamy) أو للاتحاد القانوني والفيزيائي (fusion)، وليس لنمو الهياكل الكبيرة معاً (symphysis)."
      expands: []

stage3_analysis:
  per_lemma:
    - lemma: "ارتفاق"
      decision: confirmed
      decision_reason: "المصطلح الدقيق والمقابل المباشر لـ symphysis في التشريح، ويشير إلى نمو الأجزاء المتماثلة والتصاقها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِرْتِفَاق"
    - lemma: "التحام"
      decision: confirmed
      decision_reason: "مصطلح أعم يغطي التصاق ونمو الأجزاء والهياكل العضوية معاً (مثل التحام أجزاء الزهرة أو العظام)، وهو مدعوم في المعاجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِلْتِحَام"
    - lemma: "تلاحم"
      source: stage1
      decision: removed
      decision_reason: "استخدامه العلمي أقل شيوعاً من الالتحام والارتفاق، ويدل على الترابط المعنوي والمادي بشكل عام."
    - lemma: "تراكب"
      source: stage1
      decision: removed
      decision_reason: "دلالته تركز على تراكم الأجزاء فوق بعضها (overlap/imbrication) وليس تمازجها ونموها معاً."
    - lemma: "اندماج"
      source: stage1
      decision: removed
      decision_reason: "يُفضل استخدامه على المستوى الخلوي (كالاندماج الخلوي) أو الفيزيائي، وهو أقل دقة من الارتفاق للمستوى الهيكلي."

stage4_content:
  definition:
    current: "نمو الأجزاء أو الهياكل معًا"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق لكنه يحتاج إلى ضبط الصياغة وتخصيص السياق العضوي بشكل أفضل."
    authored:
      - type: terminological
        text: "نمو الأجزاء أو الهياكل العضوية معاً وتلاصقها لتشكل بنية واحدة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نمو الأجزاء أو الهياكل العضوية معاً وتلاصقها لتشكل بنية واحدة."

  examples:
    per_lemma:
      - lemma: "اِرْتِفَاق"
        examples:
          - text: "أظهرت صورة الأشعة وجود خلل في منطقة الارتفاق العاني."
            type: usage
      - lemma: "اِلْتِحَام"
        examples:
          - text: "يُلاحظ في هذه الفصيلة النباتية التحام البتلات مع الأسدية."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أظهرت صورة الأشعة وجود خلل في منطقة الارتفاق العاني."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُلاحظ في هذه الفصيلة النباتية التحام البتلات مع الأسدية."

stage5_enrichment:
  per_entry:
    - lemma: "اِرْتِفَاق"
      entry_id: "{auto}"
      root: "رفق"
      maqayis_quote: "«الرَّاءُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُوَافَقَةٍ وَمُقَارَبَةٍ بِلَا عُنْفٍ»"
    - lemma: "اِلْتِحَام"
      entry_id: "{auto}"
      root: "لحم"
      maqayis_quote: "«اللَّامُ وَالْحَاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَدَاخُلٍ، كَاللَّحْمِ الَّذِي هُوَ مُتَدَاخِلٌ بَعْضُهُ فِي بَعْضٍ»"
  per_sense:
    - lemma: "اِرْتِفَاق"
      sense_id: "{auto}"
      nuance: "مختص تشريحياً بنمو والتحام العظام أو الهياكل المتماثلة كمنطقة الارتفاق العاني."
      mwe: false
    - lemma: "اِلْتِحَام"
      sense_id: "{auto}"
      nuance: "أعم دلالة ويُستخدم للنمو العضوي المتصل سواء في الحيوان (عظام، أنسجة) أو النبات (أجزاء الزهرة)."
      mwe: false
  synset:
    cultural_fit: native
  actions:
