      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"رفق","maqayis":"«الرَّاءُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُوَافَقَةٍ وَمُقَارَبَةٍ بِلَا عُنْفٍ»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"لحم","maqayis":"«اللَّامُ وَالْحَاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَدَاخُلٍ، كَاللَّحْمِ الَّذِي هُوَ مُتَدَاخِلٌ بَعْضُهُ فِي بَعْضٍ»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مختص تشريحياً بنمو والتحام العظام أو الهياكل المتماثلة كمنطقة الارتفاق العاني.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"أعم دلالة ويُستخدم للنمو العضوي المتصل سواء في الحيوان (عظام، أنسجة) أو النبات (أجزاء الزهرة).","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
