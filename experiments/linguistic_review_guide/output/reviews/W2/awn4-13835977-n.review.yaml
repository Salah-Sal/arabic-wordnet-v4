stage1_review:
  assessment:
    concerns:
      - "اللمّة «أُبُوَّة وَأُمُومَة» مركّبة بواو العطف وليست وحدة معجمية ثابتة مسكوكة؛ فضلاً عن أنها تعبّر عن «الوالدية» من جهة الوالدَيْن لا عن علاقة النسل بأصله"
      - "اللمّة «وِلَادَة» تعني في المقام الأول فعل الوضع والإنجاز البيولوجي، لا العلاقة القرابية ذاتها؛ وإن كان استخدامها بمعنى «الأصل والمنشأ» واردًا في السياق"
      - "المجموعة تفتقر إلى المصطلح الأنسب «نَسَب» الذي يعبّر في العربية الكلاسيكية والقانونية عن هذه الصلة تحديدًا"
    observations: >
      المفهوم المعبَّر عنه (parentage / birth بمعنى الانتساب) هو «علاقة القرابة المباشرة التي تصل الوَلَدَ بوالِدَيْهِ» وهو ما تُسمّيه
      العربية الفصحى «النَّسَب» أو «البُنُوَّة» حين يُنظر إليه من جهة الولد. اللمّتان الحاليتان إشكاليتان: «أُبُوَّة وَأُمُومَة» تصفان
      الوالدية (parenthood) من جهة الوالدَيْن لا الانتساب من جهة الولد، و«وِلَادَة» تصف الفعل البيولوجي وإن تضمّنت دلالة الأصل. يُقترح
      إعادة النظر في تمثيل المجموعة بلمّات أكثر دقة دلالية.
  blind_candidates:
    - lemma: "بُنُوَّة"
      generation_method: ishtiqaq
      justification: "مصدر على وزن فُعُولة من جذر «بنو»، يدل على حالة كون المرء ابنًا لوالديه، وهو المقابل العربي الدقيق لـ«filiation» ويعبّر عن علاقة الوَلَد بأصله"
    - lemma: "وَالِدِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي (ياء النسبة + تاء التأنيث) من «والد»، يُعبّر عن مفهوم العلاقة الوالدية في مجملها؛ مقابَل محتمَل لـ«parenthood/parentage»"
    - lemma: "مَوْلِد"
      generation_method: ishtiqaq
      justification: "اسم مكان/زمان على وزن مَفْعِل من «ولد»، يدل على المنشأ والأصل؛ واردٌ في العربية بمعنى «الأصل والمنبت» وهو أحد معاني birth الإنجليزية في هذا السياق"
    - lemma: "نَسَبِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من «نسب»، توليد نظري للتعبير عن طبيعة العلاقة النسبية الرابطة بين الأبناء والوالدين"


stage2_evidence:
  per_lemma:
    - lemma: "أُبُوَّة وَأُمُومَة"
      confirm:
        - text: "«أُبُوَّة — translation_en: paternity — domain: Law»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — arabterm"
        - text: "«الأمومة — نظام الأمومة: نظام تعلو فيه مكانة الأُم على مكانة الأب في الحكم، ويُرجع فيه إلى الأُم في النسب أو الوراثة»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«أُبوَّة — paternity» و«أمومة — maternity» كلٌّ منهما يدلّ على صفة الوالد/الوالدة ومكانته، لا على علاقة النسل بالوالدين"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الكلمتان تعبّران عن الوالدية (parenthood) من جهة الوالدَيْن، وليس عن الانتساب (parentage) من جهة الولد؛ والمركّب بالواو ليس وحدة معجمية ثابتة"
    - lemma: "وِلَادَة"
      confirm:
        - text: "«الولادة: وضع الوالدة ولدها الولد المولود، ويقال للواحد والجمع، والصغير والكبير وللمتبني»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(1) «أ» ولادة. «ب» مَوْلد — (2) نَسَبٌ — (3) أصل؛ مَنْبِت of German birth — (4) مَحْتِدٌ كريم»"
          source: "المورد الحديث (2008) — ترجمة birth الإنجليزية"
      expands:
        - text: "«الولادة — translation_en: birth — domain: Biology»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "تأكيد توافق المصطلح مع المعنى البيولوجي لـ birth لكن دون الدلالة القرابية الاجتماعية"
        - text: "«الولادة — childbirth / confinement / birth»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "المعاجم الطبية تحصر المصطلح في المعنى البيولوجي (عملية الوضع)، مما يُضعّف دلالته الاجتماعية-القرابية"
    - lemma: "بُنُوَّة"
      confirm:
        - text: "«البُنُوَّة: مصدر من الابن»"
          source: "المعجم الوسيط"
        - text: "«البُنُوَّة: شعور الابن نحو والديه, وما يترتب على ذلك من اتجاهات وسلوك»"
          source: "المعجم الكبير"
        - text: "«(الْبُنُوَّة) مصدر من الابْن»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
      expands:
        - text: "«الباء والنون والواو كلمة واحدة، وهو الشيء يَتَوَلَّدُ عن الشيء، كابن الإنسان وغيره»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: "الجذر يدل على التولّد عن الشيء، وهو الأساس الاشتقاقي الصحيح للعلاقة القرابية بين الوَلَد وأصله"
    - lemma: "وَالِدِيَّة"
      confirm:
        - text: "«وَالِدِيَّة — translation_en: parenthood — domain: The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«والدية = parenthood»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "parenthood (كونك والدًا) ≠ parentage (انتساب الولد لوالديه)؛ المصطلح يعبّر عن الجهة الوالدية لا عن علاقة الانتساب"
    - lemma: "مَوْلِد"
      confirm:
        - text: "«المَوْلِدُ: موضع الولادة وقتها»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«المولد: مَوضِع الْولادَة ووقتها (ج) موالد / المُحدث من كل شيء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المولد يدل على زمان/مكان الولادة أو الشيء المستحدث، لا على العلاقة القرابية بين الوَلَد والوالدين"
    - lemma: "نَسَبِيَّة"
      contradicts:
        - text: "«النِّسْبِيَّة: مبدأ النسبية — القول بتكافؤ صيغ القوانين الفيزيقية كيفما اختلفت حركات الراصدين»"
          source: "المعجم الوسيط"
          conflict: "النسبية في المعجم العربي المعاصر مصطلح فيزيائي (relativity) لا علاقة له بالقرابة والانتساب"
        - text: "«النِّسْبِيَّة — translation_en: relativity — domain: The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المصطلح محتلٌّ بالمعنى الفيزيائي، ولا يُفهم منه معنى النسب والقرابة في الاستخدام المعاصر"


stage3_analysis:
  per_lemma:
    - lemma: "أُبُوَّة وَأُمُومَة"
      decision: removed
      decision_reason: >
        هذا المركّب ليس وحدة معجمية ثابتة (اختبار السكّ: يمكن إبدال «أُمُومَة» بـ«رعاية» ويظل الوصف صالحًا). كلا المكوّنَيْن
        يدلّ على مفهوم الوالدية (parenthood) — أي صفة كوْن المرء والدًا — لا على مفهوم الانتساب (parentage) الذي يعبّر عن علاقة
        الوَلَد بأبويه. فضلاً عن أن «أُمُومَة» وُثِّقت في المعاجم بمعنى «نظام الأمومة» الاجتماعي لا العلاقة القرابية البيولوجية.
        المفهوم الصحيح للمجموعة محمول من جهة الولد (filiation) لا من جهة الوالدَيْن.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وِلَادَة"
      decision: confirmed
      decision_reason: >
        رغم أن الدلالة الأولى لـ«وِلَادَة» هي فعل الوضع البيولوجي، فإن المعجمية العربية توثّق استخدامها بمعنى «الأصل والمنشأ» —
        وهو ما يُقابل الاستخدام الإنجليزي الثاني لـ«birth» بمعنى «parentage/descent» (كما في «of noble birth» = من وِلادة أصيلة).
        يشهد على ذلك قاموس المورد الحديث الذي يُدرج «نَسَبٌ، أصل، مَنْبِت» ضمن معاني birth. يُحتفظ باللمّة مع التنبّه إلى
        ضرورة ربطها بهذه الدلالة القرابية دون المعنى البيولوجي الصرف.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُعبِّر عن العلاقة من جهة المنشأ والأصل (birth as descent/origin)، وتُستخدم حين الحديث عن أصل الشخص ومنبته لا عن طبيعة الرابطة القانونية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِلَادَة"

    - lemma: "بُنُوَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        «البُنُوَّة» مصطلح عربي فصيح مُوثَّق في المعجم الوسيط والمعجم الكبير، وجذره في مقاييس اللغة يدل على «الشيء يتولّد عن الشيء».
        يُستخدم في السياق القانوني والشرعي لإثبات علاقة انتساب الولد لوالديه (filiation)، وهو المقابل الأدق للمفهوم من جهة الولد.
        الوزن الصرفي (فُعُولة) مناسب للمصادر الدالة على الحالات والصفات. لا يناقض التعريف، وإن كان المعجم الكبير يُضيق دلالته
        إلى المشاعر والسلوك — إلا أن الاستخدام القانوني والفقهي يُثبّته بالمعنى المطلوب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُعبِّر عن العلاقة من جهة الوَلَد تُجاه والديه (filiation)، وتُستخدم خاصّةً في السياقَيْن القانوني والشرعي لإثبات انتساب الشخص"
      actions:
        - command: create_entry
          params:
            lemma: "بُنُوَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13835977-n"

    - lemma: "وَالِدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «وَالِدِيَّة» مقابَلٌ لـ«parenthood» (صفة كوْن المرء والدًا) لا لـ«parentage» (علاقة الانتساب). المعجم الطبي الموحد يُسجّلها
        صراحةً بمعنى parenthood وهو مغاير للمفهوم المستهدف. فضلاً عن أن الوزن الاشتقاقي (مصدر صناعي من «والد») يُحيل إلى
        الوالدية لا إلى الانتساب، مما يُخلّ بالدقة المصطلحية.

    - lemma: "مَوْلِد"
      source: stage1
      decision: removed
      decision_reason: >
        «مَوْلِد» يدل على زمان الولادة أو مكانها (اسم مكان/زمان على وزن مَفْعِل)، وقد استُعمل كذلك بمعنى الشيء المستحدث في اللغة.
        لا يعبّر عن علاقة القرابة بين الوَلَد والوالدين، وإنما عن ظرف الولادة. يُرفض.

    - lemma: "نَسَبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «النَّسَبِيَّة» محتلٌّ بالمعنى الفيزيائي (theory of relativity) في الاستخدام العربي المعاصر كما تشهد المعاجم المتعددة.
        استخدامه بمعنى طبيعة النسب القرابي سيُوقع في اللبس الشديد. يُرفض قطعًا.


