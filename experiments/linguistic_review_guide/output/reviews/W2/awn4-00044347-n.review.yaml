      maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالصَّصَادُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، وَهُوَ تَنْقِيَةُ الشَّيْءِ وَتَهْذِيبُهُ.»"
    - lemma: "تَصْرِيف"
      entry_id: "{auto}"
      root: "صرف"
      maqayis_quote: "«الصَّادُ وَالرَّاءُ وَالْفَاءُ مُعْظَمُ بَابِهِ يَدُلُّ عَلَى رَجْعِ الشَّيْءِ.»"
    - lemma: "نَبْذ"
