# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «قبلية» مكتوبة بلا تشكيل كامل، يجب ضبطها «قَبَلِيَّة»"
      - "الاشتراك اللفظي: «قبلية» في الفلسفة تعني apriorism (المعرفة القبليّة)، مما قد يُوقع القارئَ في التباس المجال"
      - "المجموعة مكتفية بلمّة واحدة، وقد يُغني إضافة مرادف أو بديل اصطلاحي"
    observations: >-
      المجموعة تُعبّر عن مفهوم أنثروبولوجي اجتماعي راسخ هو «القَبَلِيَّة»، أي نظام
      الحياة المنظَّمة في قبائل. الجذر «قبل» عربي أصيل ومثّل ابنُ فارس أصله بمعنى
      المواجهة والتوجّه، وقد اشتُقّت «القبيلة» من «قبائل الرأس» تشبيهاً لالتقاء
      أعضائها كالتقاء عظام الجمجمة. التعريف الحالي «حالة العيش معاً في قبائل»
      وصفٌ مباشر لكنه يفتقر إلى المستوى المصطلحي الكافي. يُلاحظ أن المورد الحديث
      يُعرّف «القَبَلِيَّة» بـ: «أ» الوعي القبلي، «ب» العصبيّة القبليّة، وهو أوسع
      من التعريف الحالي.

  blind_candidates:
    - lemma: "قَبَلِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي (المصدر الصناعي بـ «ية») من الصفة المنسوبة «قَبَلِيّ» (نسبة إلى
        القبيلة)، على القياس المعجمي الصرفي المطّرد لتحويل الأوصاف إلى مفاهيم
        مجرّدة. الوزن منتج في العربية المعاصرة: حُرِّيَّة، إنسانيَّة، قوميَّة.

    - lemma: "عَصَبِيَّة"
      generation_method: majaz
      justification: >-
        إحياء دلالي لمصطلح ابن خلدون الشهير الذي يعني الشعور الجمعي والولاء
        القبلي؛ وظيفياً يلامس مفهوم «حالة الحياة في قبائل» من جهة الرابط الداخلي
        المُعرِّف للقبيلة. اللفظ ميّت أو ضيّق التداول بمعناه الخلدوني في العصر
        الحديث مما يخفّف الاشتراك اللفظي.

    - lemma: "قَبَائِلِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من صيغة الجمع «قَبَائِل» بدلاً من المفرد؛ يُبرز الطابع الجمعي
        التعددي للمفهوم (العيش في قبائل متعددة)، وقد يُميَّز به عن نسبة المفرد
        «قبلية» لو أُريد التخصيص.

    - lemma: "النِّظَام القَبَلِيّ"
      generation_method: tarkib
      justification: >-
        مركب إضافي (إضافي وصفي) يُعبّر عن المفهوم وصفيّاً: «النظام الاجتماعي
        القائم على القبيلة». غير أن اختبار السكّ يكشف إمكانية إبدال «النظام» بـ
        «الإطار» أو «التنظيم» دون فقدان المعنى الوصفي العام، مما يُضعف احتمال
        كونه مصطلحاً مسكوكاً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات مُنفَّذة:
#   Q1 — batch headword: قبلية، القبلية، عصبية، العصبية، قبائلية، القبائلية
#   Q2 — English bridge: tribalism / tribal / tribe
#   Q3 — Arabic FTS: قبلي OR قبائل OR قبلية OR عصبية قبلية
#   Q4 — Maqayis al-Lugha (dict_id=151): headword_norm = قبل
stage2_evidence:
  per_lemma:

    - lemma: "قَبَلِيَّة"
      confirm:
        - text: >-
            «قبلية» — translation_en: "tribalism" — domain: "Sociology and
            Anthropology"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية
            والثقافة والعلوم (موقع ArabTerm) — entry_id: 399974"
        - text: >-
            «القَبَلِيّة: «أ» الوعي القَبَليّ. «ب» العصبيّة القَبَليّة.» —
            translation_en: "tribalism"
          source: "المورد الحديث (2008) — entry_id: 724726"
      contradicts:
        - text: >-
            «قبليّة» — translation_en: "apriorism" — domain: "Philosophy and
            Psychology"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة
            والعلوم (موقع ArabTerm) — entry_id: 489274"
          conflict: >-
            في الاصطلاح الفلسفي، «القبليّة» أو «القِبَلِيَّة» تُقابل
            «apriorism» (نظرية المعرفة القبليّة قبل التجربة)، وهي معنى مغاير
            تماماً للمعنى الاجتماعي-الأنثروبولوجي المقصود في هذه المجموعة.

    - lemma: "عَصَبِيَّة"
      expands:
        - text: >-
            «العَصَبيةُ: المحاماةُ عن العُصبة ونُصْرتُها»
          source: "المعجم الوسيط — entry_id: 18977"
          addition: >-
            يُبيّن أن العصبية في أصلها العربي تعني النصرة للجماعة القبلية
            (العصبة) والانحياز لها؛ وهو ذو صلة بروح القبلية لكنه لا يُرادفها
            مباشرة إذ يُركّز على الولاء والتحيّز لا على «حالة العيش في قبائل».
        - text: >-
            «المحاماة والمدافعةُ عمَّن يلزمُك أمرُه أو تَلْزَمُه لِغَرَض»
          source: "المعجم الوسيط — entry_id: 18989"
          addition: >-
            التعريف يُوسّع معنى العصبية ليشمل الدفاع عن المتصل بالفرد بعلاقة
            ما (نسب أو مصلحة)، مما يُبعد اللفظ عن الدلالة الحضارية والاجتماعية
            الشاملة لـ«tribalism».

    - lemma: "قَبَائِلِيَّة"
      evidence_status: "no_material_found"

    - lemma: "النِّظَام القَبَلِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "قَبَلِيَّة"
      decision: confirmed
      decision_reason: >-
        اللمّة مؤكَّدة توثيقياً في أكثر من مصدر معجمي متخصص بمعنى «tribalism»
        (مسرد علم الاجتماع والأنثروبولوجيا، والمورد الحديث). مشتقّة اشتقاقاً
        صحيحاً من الجذر العربي الأصيل «قبل» عبر النسبة «قَبَلِيّ» ثم المصدر
        الصناعي «قَبَلِيَّة». الاشتراك اللفظي مع «apriorism» الفلسفي محدود
        بمجال التخصص ولا يُفضي إلى التباس عملي في السياق الاجتماعي الأنثروبولوجي.
        اللمّة موجودة في المجموعة لكنها بلا تشكيل — تحتاج تحديثاً.
      evidence_assessment:
        case: mixed
      morphological_fit: >-
        الوزن «فَعَلِيَّة» (مصدر صناعي من نسبة) وزنٌ منتج قياسي لتجريد الأوصاف
        النسبية في العربية المعاصرة: قوميّة، وطنيّة، إنسانيّة. يناسب تماماً وظيفة
        المفهوم المجرد «حالة كون الشيء قبَلياً / قائماً على نظام القبائل».
      loanword_check:
        type: native_derivation
        verdict: مشتقّة عربية خالصة، لا اقتراض ولا ترجمة حرفية
      term_quality_gates:
        ittiraad: "مطّرد — المصدر الصناعي قياسي في العربية المعاصرة"
        yusr: "سهل التداول، مألوف في الكتابة الصحفية والأكاديمية"
        mulaama: "ملائم دلالياً وصرفياً"
        iithar_turathi: "الجذر عربي أصيل مؤصَّل في مقاييس اللغة"
        iithar_arabi: "لا حاجة إلى تعريب"
        ishtiqaqiyya: "مشتقة اشتقاقاً سليماً ذات وزن منتج"
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        «قَبَلِيَّة» هي المصطلح الاصطلاحي المُثبَت للمفهوم الاجتماعي-الأنثروبولوجي
        (tribalism). تتمايز عن «عَصَبِيَّة» (المصطلح الخلدوني) بأن الأولى تشير إلى
        نمط الحياة القائم على التنظيم القبلي ككلٍّ، فيما تُركّز «عَصَبِيَّة» على
        عنصر الولاء الجمعي والتحيّز للجماعة القبلية تحديداً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَبَلِيَّة"

    - lemma: "عَصَبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        «عَصَبِيَّة» تدلّ على الولاء القبلي والتحيّز للجماعة (مصطلح خلدوني)، لا على
        «حالة العيش في قبائل» كحالة اجتماعية تنظيمية. المفهومان متصلان لكنهما
        متمايزان: «tribalism» = النمط الاجتماعي القبلي كلياً، أما «عصبية» فهي
        «group solidarity / tribal partisanship». الأدلة المعجمية تؤكد هذا
        التمايز ولا تدعم جعل «عصبية» مرادفاً للقبلية بمعنى المجموعة الحالية.

    - lemma: "قَبَائِلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على أي وثيقة معجمية تُثبّت هذا المصطلح. الاشتقاق من صيغة الجمع
        غير قياسي في هذا الوزن، وفي وجود «قَبَلِيَّة» المُثبَّتة لا مسوّغ لإحداث
        مصطلح بديل غير موثَّق.

    - lemma: "النِّظَام القَبَلِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        فشل اختبار السكّ: إمكانية إبدال «النظام» بـ«الإطار» أو «التنظيم» دون فقدان
        المعنى الوصفي تدلّ على أنه عبارة وصفية حرّة لا مصطلح مسكوك. كذلك لا يوجد
        دليل معجمي على تثبيته كوحدة معجمية ثابتة.


