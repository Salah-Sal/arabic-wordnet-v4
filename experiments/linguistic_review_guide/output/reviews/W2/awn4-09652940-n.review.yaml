step0_evidence:
  per_lemma:
    - lemma: "رحّالة"
      confirm:
        - text: "«الكثير الرُّحلة. [ والتاء للمبالغة ]»"
          source: "المعجم الوسيط"
        - text: "«الكثيرُ الرِّحْلَةِ, يقال: رَجُلٌ رَحَّالَةٌ, وغَلَبَ على من كانوا يَرْحلون فى طَلَبِ الحديثِ, والتاء للمبالغة»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«السَّرْجُ سَرْجٌ من جُلُودٍ لا خَشَبَ فيه, كان يُتَّخَذُ للرَّكْضِ الشَّديدِ»"
          source: "المعجم الكبير"
          conflict: "هذا المعنى لكلمة رَحَالَة (بفتح الراء وتخفيف الحاء) وليس رَحَّالَة"
    - lemma: "مسافر"
      confirm:
        - text: "«ذو السفر»"
          source: "المعجم الكبير"
        - text: "«المسافر: هو من قصد سيرًا وسطًا ثلاثة أيام ولياليها، وفارق بيوت بلده.»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«مسافر الوجه : ما يَظهر منه»"
          source: "المعجم الوسيط"
          conflict: "معنى مخصص لتركيب إضافي"
      expands:
        - text: "«الثور الوحشي الذي يخرج من أرض إلى أخرى»"
          source: "المعجم الكبير"
          addition: "إطلاق الكلمة على الحيوان (الثور الوحشي)"

