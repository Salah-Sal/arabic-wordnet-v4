    - lemma: "رحّالة"
      decision: confirmed
      decision_reason: "صيغة فصيحة مستعملة، وتفيد المبالغة في السفر والترحال."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "صيغة مبالغة تدل على من يكثر السفر والترحال، وغالباً يكون لأغراض الاستكشاف."
      example: "دوّن الرحالة مشاهداته عن الشعوب التي زارها في كتاب."
    - lemma: "مسافر"
      decision: confirmed
      decision_reason: "الكلمة الأساسية الشائعة والفصيحة للتعبير عن هذا المفهوم."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على مطلق من يقوم بالسفر، سواء لمرة واحدة أو بشكل متكرر."
      example: "استراح المسافر في المحطة قبل أن يكمل طريقه."
    - lemma: "عابر سبيل"
      source: step05
      decision: removed
      decision_reason: "تركيب يغلب عليه طابع الانقطاع والاحتياج وليس مجرد السفر."
      step05_citation: "مرادف لغوي"
    - lemma: "مُرْتَحِل"
      source: step05
      decision: confirmed
      decision_reason: "كلمة فصيحة دقيقة في التعبير عن الانتقال والسفر."
      step05_citation: "توليد معرفي (اشتقاق)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تشير بشكل خاص إلى الانتقال من مكان الإقامة وترك الديار."
      example: "بقي المرتحل يتنقل بين القرى بحثاً عن الكلأ والماء."
      actions:
        - command: create_entry
          params:
            lemma: "مُرْتَحِل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09652940-n"
  added_lemmas:
