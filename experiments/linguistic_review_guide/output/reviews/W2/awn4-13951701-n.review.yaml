stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'علاقة' تفتقر للتشكيل الكامل."
      - "التعريف الحالي يحتاج إلى صياغة معجمية أكثر دقة وجزالة."
    observations: "المفهوم يعبر عن الحالة الناتجة عن التفاعل المستمر بين الأطراف، وهو ما تغطيه كلمة 'علاقة' بشكل أساسي، مع وجود مرادفات تقترب منها دلالياً في سياقات معينة مثل 'رابطة' و'صلة'."
  blind_candidates:
    - lemma: "عَلَاقَة"
      generation_method: ishtiqaq
      justification: "اللفظ الأشيع للتعبير عن الرابطة بين طرفين، مشتق من العَلَق وهو الالتزام والارتباط."
    - lemma: "رَابِطَة"
      generation_method: majaz
      justification: "تُستخدم للتعبير عن الوصلة القوية بين الأشياء أو الأشخاص، وكأنها حبل يربط بينهم."
    - lemma: "صِلَة"
      generation_method: ishtiqaq
      justification: "مصدر من الفعل وصل، ويعبر عن حالة الاتصال والارتباط بين الأطراف."
    - lemma: "تَعَامُل"
      generation_method: ishtiqaq
      justification: "يركز على الجانب الإجرائي (التعاملات) المذكور في التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "علاقة"
      confirm:
        - text: "«(العلاقة) العلاقة والوصلة بين الشيئين...»"
          source: "المعجم الوسيط"
        - text: "«اتصال متبادل بين أشخاص أو مجموعات.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«العلاقة: شيء بسببه يستصحب الأول الثاني كالعلية والتضايف.»"
          source: "كتاب التعريفات للجرجاني"
    - lemma: "رابطة"
      confirm:
        - text: "«(الرابطة) العلاقة والوصلة بين الشيئين... والجماعة يجمعهم أمر يشتركون فيه»"
          source: "المعجم الوسيط"
        - text: "«الرابطة: اللفظة الدالة على نسبة ارتباط المحمول بالموضوع.»"
          source: "مقاليد العلوم للسيوطي"
    - lemma: "صلة"
      confirm:
        - text: "«الصّلة: [في الانكليزية] Relation ،contact... بمعنى: الاتصال، والوصل، والقرابة»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
        - text: "«صلة: [في الانكليزية] affinity»"
          source: "مسرد علم الاجتماع (ArabTerm)"
    - lemma: "تواصل"
      expands:
        - text: "«التواصل يتضمن في تعريفه إعطاء المعلومة والحصول على رد الفعل.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يركز التواصل على عملية تبادل المعلومات بينما تركز العلاقة على الحالة الناتجة عن ذلك."

stage3_analysis:
  per_lemma:
    - lemma: "علاقة"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والمباشر للمفهوم، ومدعوم بقوة في المعاجم القديمة والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَلَاقَة"
    - lemma: "رَابِطَة"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم للتعبير عن العلاقة الوثيقة أو الرسمية بين الأطراف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رَابِطَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "صِلَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي يعبر عن طبيعة الاتصال والارتباط بين الكيانات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "صِلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حالة تتضمن تعاملات متبادلة بين الأشخاص أو الأطراف أو البلدان"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط، ويفضل صياغته بأسلوب المعاجم العربية ليكون أكثر شمولاً ودقة."
    authored:
      - type: terminological
        text: "ارتباطٌ أو وُصْلَةٌ مَعْنَوِيَّةٌ بَيْنَ طَرَفَيْنِ أَوْ أَكْثَرَ (أَشْخَاصٍ أَوْ دُوَلٍ أَوْ هَيْئَاتٍ)، تَقُومُ عَلَى التَّعَامُلِ المَتَبَادِلِ وَالمَصَالِحِ المُلْتَقِيَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "ارتباطٌ أو وُصْلَةٌ مَعْنَوِيَّةٌ بَيْنَ طَرَفَيْنِ أَوْ أَكْثَرَ (أَشْخَاصٍ أَوْ دُوَلٍ أَوْ هَيْئَاتٍ)، تَقُومُ عَلَى التَّعَامُلِ المَتَبَادِلِ وَالمَصَالِحِ المُلْتَقِيَةِ."}
  examples:
    per_lemma:
      - lemma: "عَلَاقَة"
        examples:
          - text: "تَحَسَّنَتِ العَلَاقَةُ الدِّبْلُومَاسِيَّةُ بَيْنَ البَلَدَيْنِ بَعْدَ سَنَوَاتٍ مِنَ القَطِيعَةِ."
            type: usage
      - lemma: "رَابِطَة"
        examples:
          - text: "تَجْمَعُ بَيْنَ الشَّعْبَيْنِ رَابِطَةُ الدِّينِ وَاللُّغَةِ وَالتَّارِيخِ."
            type: usage
      - lemma: "صِلَة"
        examples:
          - text: "أَقَامَ التَّاجِرُ صِلَةً تِجَارِيَّةً قَوِيَّةً مَعَ المَصَانِعِ العَالَمِيَّةِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَحَسَّنَتِ العَلَاقَةُ الدِّبْلُومَاسِيَّةُ بَيْنَ البَلَدَيْنِ بَعْدَ سَنَوَاتٍ مِنَ القَطِيعَةِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَجْمَعُ بَيْنَ الشَّعْبَيْنِ رَابِطَةُ الدِّينِ وَاللُّغَةِ وَالتَّارِيخِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أَقَامَ التَّاجِرُ صِلَةً تِجَارِيَّةً قَوِيَّةً مَعَ المَصَانِعِ العَالَمِيَّةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "عَلَاقَة"
      entry_id: "{auto}"
      root: "علق"
      maqayis_quote: "«الْعَيْنُ وَاللَّامُ وَالْقَافُ أَصْلٌ كَبِيرٌ صَحِيحٌ يَرْجِعُ إِلَى مَعْنًى وَاحِدٍ، وَهُوَ أَنْ يُنَاطَ الشَّيْءُ بِالشَّيْءِ الْعَالِي. ثُمَّ يَتَّسِعُ الْكَلَامُ فِيهِ... وَالْعَلَاقَةُ لِلْحَبِّ. وَالْعَلَاقَةُ: مَا ذَكَرْنَاهُ مِنَ الْعَلَاقِ الَّذِي يُتَعَلَّقُ بِهِ فِي مَعِيشَةٍ وَغَيْرِهَا.»"
    - lemma: "رَابِطَة"
      entry_id: "{auto}"
      root: "ربط"
      maqayis_quote: "«الرَّاءُ وَالْبَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى شَدٍّ وَثَبَاتٍ. مِنْ ذَلِكَ رَبَطْتُ الشَّيْءَ أَرْبِطُهُ رَبْطًا; وَالَّذِي يُشَدُّ بِهِ رِبَاطٌ.»"
    - lemma: "صِلَة"
      entry_id: "{auto}"
      root: "وصل"
      maqayis_quote: "«الْوَاوُ وَالصَّادُ وَاللَّامُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ضَمِّ شَيْءٍ إِلَى شَيْءٍ حَتَّى يَعْلَقَهُ. وَوَصَلْتُهُ بِهِ وَصْلًا. وَالْوَصْلُ: ضِدُّ الْهِجْرَانِ.»"
  per_sense:
