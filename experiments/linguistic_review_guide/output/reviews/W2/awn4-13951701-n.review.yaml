      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"علق","maqayis":"«الْعَيْنُ وَاللَّامُ وَالْقَافُ أَصْلٌ كَبِيرٌ صَحِيحٌ يَرْجِعُ إِلَى مَعْنًى وَاحِدٍ، وَهُوَ أَنْ يُنَاطَ الشَّيْءُ بِالشَّيْءِ الْعَالِي. ثُمَّ يَتَّسِعُ الْكَلَامُ فِيهِ... وَالْعَلَاقَةُ لِلْحَبِّ. وَالْعَلَاقَةُ: مَا ذَكَرْنَاهُ مِنَ الْعَلَاقِ الَّذِي يُتَعَلَّقُ بِهِ فِي مَعِيشَةٍ وَغَيْرِهَا.»"}'
    - command: set_metadata
