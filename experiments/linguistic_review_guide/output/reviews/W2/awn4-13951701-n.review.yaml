      mwe: false
    - lemma: "رَابِطَة"
      sense_id: "{auto}"
      nuance: "تشير غالباً إلى ارتباط قوي أو رسمي أو معنوي متين (مثل الروابط القومية أو الدينية)."
      mwe: false
    - lemma: "صِلَة"
      sense_id: "{auto}"
      nuance: "تؤكد على فعل الاتصال والارتباط، وتستخدم بكثرة في سياق القرابة (صلة الرحم) والارتباطات المنطقية أو العملية."
