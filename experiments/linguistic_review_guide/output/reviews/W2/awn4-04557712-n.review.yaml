stage1_review:
  assessment:
    concerns:
      - "اللمة (مجموعة ملابس) هي تركيب إضافي وصفي حر وليست مصطلحاً معجمياً مسكوكاً."
      - "اللمة (خزانة ملابس) تشير في الأصل إلى قطعة الأثاث التي تحفظ فيها الثياب، لكن استخدامها للتعبير عن محتوى الخزانة شائع ومقبول."
    observations: "المفهوم الإنجليزي (Wardrobe) يعبر عن كامل التشكيلة الملبسية التي يمتلكها الشخص. انتقال الدلالة في العربية من (الخزانة) كوعاء إلى (محتوياتها) من الأزياء هو مجاز مرسل علاقته المحلية، وهو أسلوب متعارف عليه في المعاجم الحديثة لترجمة هذا المفهوم."
  blind_candidates:
    - lemma: "مَلَابِس"
      generation_method: ishtiqaq
      justification: "جمع ملبس، وهي الكلمة الأعم للدلالة على كل ما يرتديه الإنسان، ويمكن أن تشير بالجمع إلى كل ما يملكه الشخص من ثياب."
    - lemma: "كِسْوَة"
      generation_method: ishtiqaq
      justification: "من الفعل كسا، وتعني الثياب التي يكتسي بها الإنسان، وتستخدم للإشارة إلى مجموعة الثياب المخصصة للمرء."
    - lemma: "حُلَّة"
      generation_method: majaz
      justification: "تدل في الأصل على طقم من الثياب (ثوبان فأكثر)، وقد تتسع مجازاً لتشمل الملابس الكاملة التي يقتنيها الشخص."
    - lemma: "أَزْيَاء"
      generation_method: majaz
      justification: "جمع زي، وتستخدم في العصر الحديث للدلالة على الملابس بصورة عامة وعلى تشكيلات الملبس."

stage2_evidence:
  per_lemma:
    - lemma: "خزانة ملابس"
      confirm:
        - text: "غرفة الملابس أو مِشْجَب الثِّياب، وأيضا تشكيلة الملابس الخاصة بشخص ما."
          source: "مسرد صناعة النسيج (موقع ArabTerm)"
    - lemma: "مجموعة ملابس"
      evidence_status: "no_material_found"
    - lemma: "ملابس"
      expands:
        - text: "مَا يلبس (ج) ملابس"
          source: "المعجم الوسيط"
          addition: "جمع ملبس، وتدل على الثياب بشكل عام."
    - lemma: "كسوة"
      expands:
        - text: "الثَّوْب يسْتَتر بِهِ ويتحلى (ج) كسا"
          source: "المعجم الوسيط"
          addition: "تشير إلى ما يستر البدن بشكل أساسي."
    - lemma: "حلة"
      contradicts:
        - text: "الثوب الجيّد الجديد غليظاً أو رقيقاً ثوبٌ له بطانة ثوبان من جنس واحد ثلاثة أثواب"
          source: "المعجم الوسيط"
          conflict: "تدل على طقم معين من الثياب يُلبس معاً، ولا تدل على كل ما يملكه الشخص من ملابس متفرقة."
    - lemma: "أزياء"
      expands:
        - text: "الزّي: الهيئة .. فجعل الزي مرتبطًا بهيئة اللباس، وهو المعنى الشائع الآن في لغة العصر"
          source: "معجم الصواب اللغوي"
          addition: "تدل على هيئة اللباس والموضة أكثر من كونها مجموعة شخصية."

stage3_analysis:
  per_lemma:
    - lemma: "خزانة ملابس"
      decision: confirmed
      decision_reason: "مصطلح معتمد وموثق في المعاجم المتخصصة الحديثة للدلالة على تشكيلة الملابس الخاصة بالشخص، وقد انتقلت الدلالة من الوعاء (الخزانة) إلى المظروف (الملابس) عبر المجاز المرسل بعلاقة المحلية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خِزَانَة مَلَابِس"
    - lemma: "مجموعة ملابس"
      decision: removed
      decision_reason: "تعبير وصفي حر وتركيب إضافي غير مسكوك، وهو ترجمة حرفية للتعريف ولا يشكل وحدة معجمية مستقلة."
      evidence_assessment:
        case: no_material
    - lemma: "ملابس"
      source: stage1
      decision: removed
      decision_reason: "كلمة عامة تدل على الثياب المفردة أو الجمع، ولا تعبر بدقة عن مفهوم التشكيلة المتكاملة للملابس التي يملكها الشخص ككيان واحد."
      evidence_assessment:
        case: no_material
    - lemma: "كسوة"
      source: stage1
      decision: removed
      decision_reason: "تشير إلى ما يُكسى به المرء أو الثوب الواحد، ولا تعبر عن مجموعة الثياب المتنوعة التي يقتنيها."
      evidence_assessment:
        case: no_material
    - lemma: "حلة"
      source: stage1
      decision: removed
      decision_reason: "تدل على الطقم أو البذلة الواحدة، وليس على المجموع الكلي للملابس."
      evidence_assessment:
        case: contradicts_only
    - lemma: "أزياء"
      source: stage1
      decision: removed
      decision_reason: "مصطلح يرتبط أكثر بتصميم الملابس والموضة والهيئة العامة، وليس بالمخزون الشخصي للملابس."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "مجموعة الملابس التي يملكها شخص واحد"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول ولكنه أقرب للترجمة الحرفية، ويمكن تحسينه بصياغة معجمية أدق تستخدم مصطلحات التشكيلة والاقتناء."
    authored:
      - type: terminological
        text: "مجموع الثياب والأزياء التي يقتنيها ويمتلكها شخص ما."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموع الثياب والأزياء التي يقتنيها ويمتلكها شخص ما."
  examples:
    per_lemma:
      - lemma: "خِزَانَة مَلَابِس"
        examples:
          - text: "تضم خزانة ملابسه تشكيلة واسعة من البذلات الرسمية والملابس اليومية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تضم خزانة ملابسه تشكيلة واسعة من البذلات الرسمية والملابس اليومية."

stage5_enrichment:
  per_entry:
    - lemma: "خِزَانَة مَلَابِس"
      entry_id: "{auto}"
      roots:
        - word: "خزانة"
          root: "خزن"
          maqayis_quote: "«الخاء والزاء والنون أصل يدل على صيانة الشيء.»"
        - word: "ملابس"
          root: "لبس"
          maqayis_quote: "«اللام والباء والسين أصل صحيح واحد، يدل على مخالطة ومداخلة. من ذلك لبست الثوب ألبسه.»"
  per_sense:
    - lemma: "خِزَانَة مَلَابِس"
      sense_id: "{auto}"
      nuance: "تدل على كل ما يمتلكه الشخص من ملابس وأزياء كتشكيلة متكاملة، عبر إطلاق اسم وعاء الحفظ على محتواه."
      mwe: true
  synset:
    cultural_fit: native
  actions:
