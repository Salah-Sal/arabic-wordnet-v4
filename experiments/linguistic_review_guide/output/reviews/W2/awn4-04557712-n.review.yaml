        value: '{"roots":[{"word":"خزانة","root":"خزن","maqayis":"«الخاء والزاء والنون أصل يدل على صيانة الشيء.»"},{"word":"ملابس","root":"لبس","maqayis":"«اللام والباء والسين أصل صحيح واحد، يدل على مخالطة ومداخلة. من ذلك لبست الثوب ألبسه.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تدل على كل ما يمتلكه الشخص من ملابس وأزياء كتشكيلة متكاملة، عبر إطلاق اسم وعاء الحفظ على محتواه.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
