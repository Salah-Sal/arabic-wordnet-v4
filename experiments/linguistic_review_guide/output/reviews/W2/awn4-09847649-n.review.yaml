      - type: terminological
        text: "شَخْصٌ وُلِدَ خِلَالَ فَتْرَةِ الزِّيَادَةِ المَلْحُوظَةِ فِي مُعَدَّلَاتِ المَوَالِيدِ، وَتَحْدِيداً فِي فَتْرَةِ مَا بَعْدَ الحَرْبِ العَالَمِيَّةِ الثَّانِيَةِ أَوْ فِي الْخَمْسِينِيَّاتِ."
