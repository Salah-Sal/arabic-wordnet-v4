  per_entry:
    - lemma: "مُؤَثِّرٌ"
      entry_id: "{auto}"
      root: "أثر"
      maqayis_quote: "«الْهَمْزَةُ وَالثَّاءُ وَالرَّاءُ، لَهُ ثَلَاثَةُ أُصُولٍ... والْأَثَرُ بَقِيَّةُ مَا يُرَى مِنْ كُلِّ شَيْءٍ وَمَا لَا يُرَى بَعْدَ أَنْ تَبْقَى فِيهِ عَلَقَةٌ.»"
    - lemma: "نَافِذٌ"
      entry_id: "{auto}"
