# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لَمَّة 'زَوْجِيَّة' إشكالية: دلالتها الأصيلة في جميع المعاجم الكلاسيكية والحديثة 'الزواج'؛ وحين تُستخدم للعدد تُغطّي نصف المفهوم فقط (الأعداد الزوجية) دون الأعداد الفردية، مما يجعلها غير صالحة للتعبير عن علاقة التكافؤ الرياضية المحايدة التي تشمل الصنفَين معاً"
      - "لَمَّة 'تَمَاثُل' واسعة الدلالة: تُستخدم في سياقات رياضية وعلمية متعددة (symmetry / homology / similarity) مما يُضعف دقّتها للمفهوم المحدد (parity)"
      - "التعريف العربي الحالي يستخدم 'الزوجية' في خاتمته للإحالة إلى المفهوم المُعرَّف ذاته، مما يُفضي إلى دوران اصطلاحي"
    observations: >
      المجموعة تُعبّر عن مفهوم parity في نظرية الأعداد: العلاقة التي تُصنّف كل زوج من الأعداد الصحيحة
      إلى متكافئَين (كلاهما فردي أو كلاهما زوجي) أو متخالفَين. الجذر اللاتيني لـ parity هو «par» = متساوٍ؛
      وهذا يُرجّح أن يكون مقابله العربي الأدق مشتقاً من مادة (كفأ) الدالة على التساوي المتبادل. اللمّة
      تَمَاثُل مقبولة من حيث التوثيق المعجمي، لكنها تعبّر عن التشابه العام لا عن علاقة التكافؤ الرياضي
      المحدد. أما زَوْجِيَّة فمصدر صناعي من (زوج) اختصّ بالزواج ثم بالعدد الزوجي، وكلا الدلالتَين
      يُناقضان استخدامها مصطلحاً محايداً يشمل الصنفَين.
  blind_candidates:
    - lemma: "تَكَافُؤ"
      generation_method: ishtiqaq
      justification: "مصدر من تَكَافَأَ على وزن تَفَاعُل من الجذر (كفأ)، يدلّ على التساوي المتبادل بين طرفَين. العلاقة بين عددين في كونهما معاً فرديَّين أو معاً زوجيَّين هي تكافؤ في الصنف؛ والوزن تَفَاعُل ملائم لأفعال الاشتراك والتبادل."
    - lemma: "تَشَاكُل"
      generation_method: ishtiqaq
      justification: "مصدر من تَشَاكَلَ على وزن تَفَاعُل من الجذر (شكل)، يدلّ على اشتراك الشيئَين في الصورة. العددان الفرديَّان أو الزوجيَّان يشتركان في 'شكل' رياضي واحد (الصنف ذاته)، وتَفَاعُل يُعبّر عن التشارك."
    - lemma: "تَوَافُق"
      generation_method: ishtiqaq
      justification: "مصدر من تَوَافَقَ على وزن تَفَاعُل من الجذر (وفق)، يدلّ على التوافق والاتفاق المتبادل. يُعبّر عن اجتماع العددين في صنف واحد (فردي-فردي أو زوجي-زوجي) بوصفه توافقاً في الخاصية."
    - lemma: "نَظِيرِيَّة الأَعْدَاد"
      generation_method: tarkib
      justification: "مركب إضافي من 'نَظِيرِيَّة' (المصدر الصناعي لنَظِير بمعنى المقابل) و'الأَعْدَاد'. يُعبّر عن خاصية التناظر العددي (فردي مقابل فردي، زوجي مقابل زوجي) بوصفها علاقة نظير."


