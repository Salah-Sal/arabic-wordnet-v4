# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تَمَاثُل"
      decision: confirmed
      decision_reason: >
        موثّق مباشرةً بمعنى parity في المعجم الموحد للفيزياء (1989)، وفي معاجم النفط لـ parity checking،
        وهو المعنى الأول لـ parity في المورد الحديث (2008). الجذر (مثل) يدلّ على المناظرة والنظير وفق
        مقاييس اللغة. التشكيل صحيح تَمَاثُل (مصدر من تَمَاثَلَ وزن تَفَاعُل). المصطلح مُعتمَد علمياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز جانب التشابه والتناظر بين العددين في خاصيتهما (كلاهما فردي أو كلاهما زوجي)؛ راسخ في الفيزياء (تماثل التعكّس في ميكانيكا الكم) ونظرية الأعداد التقليدية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَاثُل"

    - lemma: "زَوْجِيَّة"
      decision: removed
      decision_reason: >
        جميع المعاجم الكلاسيكية والحديثة تُعرّفها بـ'الزواج' دون أي سياق رياضي. والأهم أن المصطلح
        ينحاز نحو 'الزوجية' (كون العدد زوجياً) فقط، في حين يشمل مفهوم parity الصنفَين (فردي وزوجي)
        معاً على قدم المساواة؛ فاستخدامه لتسمية العلاقة المحايدة خطأ مصطلحي يُعيق الفهم.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَكَافُؤ"
      source: stage1
      decision: confirmed
      decision_reason: >
        الأنسب لهذا المفهوم: مُعرَّف في مقاييس اللغة صريحاً بـ'التساوي' (والتكافؤ: التساوي)، ومستخدم
        في المعاجم الموحدة للهندسة الكهربائية والحوسبة للدلالة على parity تحديداً (تكافؤ زوجي = even
        parity، تكافؤ فردي = odd parity، اختبار التكافؤ، بت التكافؤ، شفرة تكافؤ). يُرجّحه على تَمَاثُل
        أنه مُعيَّن للتساوي في الصنف العددي، لا للتشابه العام.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز جانب التساوي والتعادل في القيمة الصنفية بين العددين (تَكَافَأَ = تساوى)؛ أكثر تخصصاً من تَمَاثُل كونه يُركّز على العلاقة الرياضية التكافؤية لا على التشابه الوصفي، ومُعتمَد في معاجم الهندسة والحوسبة الحديثة"
      actions:
        - command: create_entry
          params:
            lemma: "تَكَافُؤ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَشَاكُل"
      source: stage1
      decision: removed
      decision_reason: "مقابل راسخ لـ isomorphism/homomorphism في المعاجم الرياضية والكيميائية والجيولوجية؛ لا صلة له بـ parity."

    - lemma: "تَوَافُق"
      source: stage1
      decision: removed
      decision_reason: "يُستخدم بمعنى compatibility/concordance في معاجم متعددة. والمعنى الاصطلاحي الحسابي القديم 'توافق العددين' (الجرجاني) يعني وجود قاسم مشترك، وهو مغاير تماماً لـ parity."

    - lemma: "نَظِيرِيَّة الأَعْدَاد"
      source: stage1
      decision: removed
      decision_reason: "لا وجود له في المعاجم. المركّب الإضافي لا يرقى لمستوى المصطلح المسكوك (يجتاز اختبار الاستبدال: يمكن إحلال 'نظيرية الأرقام' بدلاً منه دون خسارة في الدلالة، مما يدلّ على كونه وصفاً لا مصطلحاً)."


