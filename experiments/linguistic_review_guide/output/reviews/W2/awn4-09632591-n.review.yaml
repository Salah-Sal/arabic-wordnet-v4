      evidence_citation: "«احتجز الشَّخصَ: اعتقله» — معجم اللغة العربية المعاصرة"
      justification: "الاسم الفاعل من الفعل 'احتجز' الوارد في تعريف المجموعة، ويعبر بدقة عن دلالة الاحتجاز."
