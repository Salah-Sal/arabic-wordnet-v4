      justification: "آلية التوليد: إحياء لفظ قديم. وهو اسم الفاعل من 'سبى' (أسر)، ويستخدم تاريخياً للتعبير عن آخذ السبي في الحروب."
    - lemma: "مُقْتَنِص"
      justification: "آلية التوليد: مجاز/اشتقاق. يعبر عن البراعة في القبض على الحيوانات أو الأشخاص، ويناسب سياق التعريف الذي يشمل الحيوانات."

