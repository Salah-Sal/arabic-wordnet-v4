      value: '{"root":"شدد","maqayis":"الشِّينُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ، وَفُرُوعُهُ تَرْجِعُ إِلَيْهِ."}'
  - command: set_metadata
    params:
      entity_type: sense
