stage1_review:
  blind_generation:
    - lemma: الشَّدِيدُ
      generation_method: ishtiqaq
      justification: اسم مشتق من الشدة، وقد استخدمه قاموس المورد كترجمة لمصطلح forte بمعنى الجزء الأقوى من السيف.
    - lemma: مَتْنُ النَّصْلِ
      generation_method: tarkib
      justification: تركيب إضافي يشير إلى الجزء الغليظ والصلب من السيف الذي يعطيه القوة.
    - lemma: قُوَّةُ السَّيْفِ
      generation_method: tarkib
      justification: تركيب إضافي مجازي يطلق صفة القوة على الجزء الذي يمثلها في نصل السيف.
    - lemma: أَصْلُ النَّصْلِ
      generation_method: tarkib
      justification: تركيب إضافي يشير إلى قاعدة النصل المتصلة بالمقبض والتي تكون عادة الجزء الأقوى والأكثر سماكة.
  initial_assessment:
    concerns: []
    observations: "اللمة الموجودة 'الجزء القوي' تمثل ترجمة تفسيرية واضحة للمصطلح الإنجليزي. بالبحث المعجمي نجد أن قاموس المورد يترجم forte بـ 'الشديد: الجزء الأقوى من السيف'. يمكن إضافتها كلمّة معتمدة."

stage2_evidence:
  - lemma: الجُزْءُ القَوِيُّ
    evidence_status: no_material_found
    source: null
    text: null
    classification: null
  - lemma: الشَّدِيدُ
    evidence_status: confirm_only
    source: المورد الحديث (2008)
    text: "الشَّديد: الجزء الأقوى من السيف."
    classification: confirm

stage3_analysis:
  - lemma: الجُزْءُ القَوِيُّ
    evidence_evaluation: no_material_found
    mwe_test:
      is_mwe: true
      mwe_type: wasfi
    dialectal_check: "فصيحة"
    substitution_test: "يمكن استبدالها بـ الشديد"
    nuance: "تعبير وصفي شفاف يوضح المكون المراد الإشارة إليه."
    borrowing_check:
      is_borrowed: true
      borrowing_type: calque
    quality_gate: "تمثل ترجمة تفسيرية مقبولة للمصطلح"
    morphological_fit: "مقبول"
    decision: confirmed
    actions:
      - command: update_lemma
        params:
          lemma: الجُزْءُ القَوِيُّ
  - lemma: الشَّدِيدُ
    evidence_evaluation: confirm_only
    mwe_test:
      is_mwe: false
      mwe_type: null
    dialectal_check: "فصيحة"
    substitution_test: "يمكن استبدالها بـ الجزء القوي"
    nuance: "مصطلح معجمي محدد استخدم لترجمة forte للإشارة إلى الجزء الأقوى من السيف."
    borrowing_check:
      is_borrowed: false
      borrowing_type: null
    quality_gate: "مصطلح معجمي معتمد في المورد"
    morphological_fit: "صفة مشبهة تدل على الثبوت وتستخدم كاسم"
    decision: confirmed
    actions:
      - command: create_entry
        params:
          lemma: الشَّدِيدُ
          pos: n
      - command: add_sense
        params:
          entry_id: "{auto}"
          synset_id: awn4-03390266-n

stage4_content:
  definition:
    decision: retain
    ar_definition: "الجزء الأقوى من نصل السيف بين المقبض والجزء الضعيف"
  examples:
    - lemma: الجُزْءُ القَوِيُّ
      actions:
        - command: add_sense_example
          params:
            synset_id: awn4-03390266-n
            lemma: الجُزْءُ القَوِيُّ
            example: "يَتَلَقَّى المُبَارِزُ ضَرَبَاتِ الخَصْمِ عَلَى الجُزْءِ القَوِيِّ مِنْ سَيْفِهِ."
            type: usage
    - lemma: الشَّدِيدُ
      actions:
        - command: add_sense_example
          params:
            synset_id: awn4-03390266-n
            lemma: الشَّدِيدُ
            example: "اسْتَخْدَمَ الفَارِسُ شَدِيدَ سَيْفِهِ لِصَدِّ هُجُومِ العَدُوِّ."
            type: usage

