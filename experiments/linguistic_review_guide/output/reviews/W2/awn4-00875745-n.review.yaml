stage1_review:
  assessment:
    concerns:
      - "لفظ 'تقييم' يُعدّ من المولدات المعاصرة التي شاعت في اللغة الإدارية والتربوية، بينما يفضل بعض اللغويين 'تقويم' كلفظ تراثي أصح دلالة على الإصلاح والتقدير معاً."
      - "لفظ 'حكم' واسع الدلالة وقد يختلط بالقضاء السلطوي، لذا يحتاج إلى تقييد سياقي ليدل على 'التقدير الذهني'."
    observations: "المجموعة تعبر عن الفعل الذهني للتقييم أو الحكم، وهي تقع في نطاق النشاط الإنساني الإدراكي. الترادفات المقترحة (تقدير، تقويم) تغطي جوانب 'التقييم' (assessment) بشكل أدق في السياقات العلمية والتربوية."
  blind_candidates:
    - lemma: "تَقْدِير"
      generation_method: ishtiqaq
      justification: "من الجذر (ق د ر) الذي يدل على مبلغ الشيء وكنهه، وهو المعادل الدقيق لعملية الـ assessment."
    - lemma: "تَقْوِيم"
      generation_method: ishtiqaq
      justification: "اللفظ العربي الأصيل للتعبير عن تقدير القيمة وتعديل المسار، ويستخدم بكثرة في السياقات التربوية."
    - lemma: "تَثْمِين"
      generation_method: ishtiqaq
      justification: "تقدير الثمن أو القيمة، وهو جانب أساسي من جوانب التقييم."
    - lemma: "بَتّ"
      generation_method: ishtiqaq
      justification: "يدل على قطع الأمر وإمضائه، وهو يمثل المرحلة الختامية من فعل الحكم."

stage2_evidence:
  per_lemma:
    - lemma: "تَقْيِيم"
      confirm:
        - text: "أساليب تقييم مجردة لحساب توليد نفايات... (ترجمة لـ Rapid assessment methods)"
          source: "ArabTerm"
      expands:
        - text: "في اللغة بمعنى التصحيح أو التقييم."
          source: "كشّاف اصطلاحات الفنون للتهانوي"
          addition: "يربط بين التقويم والتقييم كمعنيين لغويين متداخلين."
    - lemma: "حُكْم"
      confirm:
        - text: "الحُكْم بالشيء: أن تقضي بأنّه كذا، أو ليس بكذا، سواء ألزمت ذلك غيره أو لم تلزمه."
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "الحُكم: قرار أصدرته المحكمة."
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "تَقْدِير"
      confirm:
        - text: "التقدير من الإنسان وجهان: أحدهما التفكر في الأمر بحسب نظر العقل وبناء الأمر عليه، وذلك محمود."
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "التقدير: تحديد كل مخلوق بحده الذي يوجد من حسن وقبح ونفع وضر."
          source: "التوقيف للمناوي"
    - lemma: "تَقْوِيم"
      confirm:
        - text: "تقويم: تقدير قيمة واقع وكائن ما، أو إصدار حكم قيمي انطلاقا من حدود موضوعية... ويشمل كل شيء."
          source: "ArabTerm (مسرد التربية)"
    - lemma: "تَثْمِين"
      confirm:
        - text: "تثمين: (بدون تعريف نصي، وارد في مسارد الاقتصاد والتجارة كمقابل لـ valuation/appraisal)."
          source: "ArabTerm"
    - lemma: "بَتّ"
      contradicts:
        - text: "البت: القطع المستأصل... مستعمل في كل أمر يمضى ولا يرجع فيه."
          source: "مقاييس اللغة"
          conflict: "البت يركز على القطع والنهائية (finality) أكثر من عملية التقييم (assessment) المستمرة."

stage3_analysis:
  per_lemma:
    - lemma: "تَقْيِيم"
      decision: confirmed
      decision_reason: "على الرغم من حداثة الاشتقاق (مصدر صناعي من القيمة)، إلا أنه أصبح المصطلح المهيمن والمعياري في اللغة العربية المعاصرة للتعبير عن الـ assessment."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْيِيم"
    - lemma: "حُكْم"
      decision: confirmed
      decision_reason: "يعبر عن الجانب المتعلق بالبت وإصدار القرار (judgment) وهو المعنى الأساسي المشترك مع الإنجليزية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُكْم"
    - lemma: "تَقْدِير"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي يركز على الجانب التقديري والكمي والكيفي قبل إصدار الحكم النهائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَقْدِير", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَقْوِيم"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح التراثي والتربوي الأدق، حيث يتضمن تقدير القيمة مع لمحة من التعديل والإصلاح (evaluation)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَقْوِيم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَثْمِين"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم في السياقات الاقتصادية والمالية لتقييم الأصول والأشياء، وهو جزء تخصصي من المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَثْمِين", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بَتّ"
      source: stage1
      decision: removed
      decision_reason: "يركز على النتيجة النهائية (القطع) أكثر من الفعل الإدراكي للتقييم نفسه."

stage4_content:
  definition:
    current: "فعل الحكم على أو تقييم شخص أو موقف أو حدث"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم الكلمات المرادفة نفسها (حكم، تقييم) مما يجعله تعريفاً دائرياً إلى حد ما. يفضل تعريف يوضح الطبيعة الذهنية للفعل."
    authored:
      - type: terminological
        text: "العمليّةُ الذهنيّةُ أو الإجرائيّةُ لإصدارِ قرارٍ أو تقديرِ قيمةِ شيءٍ أو شخصٍ أو مَوْقِفٍ بِنَاءً على مَعاييرَ مُحدَّدةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "العمليّةُ الذهنيّةُ أو الإجرائيّةُ لإصدارِ قرارٍ أو تقديرِ قيمةِ شيءٍ أو شخصٍ أو مَوْقِفٍ بِنَاءً على مَعاييرَ مُحدَّدةٍ."}
  examples:
    per_lemma:
      - lemma: "تَقْيِيم"
        examples:
          - text: "خضعَ الموظفُ لتقييمٍ سنويٍّ شاملٍ لأدائِهِ الوظيفيِّ."
            type: usage
      - lemma: "حُكْم"
        examples:
          - text: "لا تتسرَّع في إصدارِ الحُكْمِ على الناسِ قبلَ مَعرفتِهِم جَيِّداً."
            type: usage
      - lemma: "تَقْدِير"
        examples:
          - text: "أخطأَ المُديرُ في تقديرِ المخاطرِ الناجمةِ عن المشروعِ الجديدِ."
            type: usage
      - lemma: "تَقْوِيم"
        examples:
          - text: "يُعنى التقويمُ التربويُّ بقياسِ مدى تحقيقِ الأهدافِ التعليميَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يَتطلَّبُ النجاحُ في العملِ حُسْنَ تقييمِ المواقفِ وسُرعةَ اتخاذِ القرارِ."}

stage5_enrichment:
  per_entry:
    - lemma: "حُكْم"
      entry_id: "{auto}"
      root: "حكم"
      maqayis_quote: "«الْحَاءُ وَالْكَافُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ الْمَنْعُ. وَأَوَّلُ ذَلِكَ الْحُكْمُ، وَهُوَ الْمَنْعُ مِنَ الظُّلْمِ.»"
