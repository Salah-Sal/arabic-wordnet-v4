stage1_review:
  assessment:
    concerns:
      - "لمّة 'شَكّ' أضيق دلالةً من المجموعة؛ تغطي الشك المعرفي دون استيعاب 'precariousness' و'dependent on chance'"
      - "تَزَعْزُع تُصنَّف في المعجم الكبير والوسيط فعلاً (pos: verb)؛ استخدامها مصدراً (تَفَعْلُل) صحيح صرفياً لكن يحتاج توثيقاً"
      - "عَدَم يَقِين تعبير مركب تحليلي لا يرقى بيُسر إلى مصطلح مسكوك، وإن كان شائعاً في المصطلحية الحديثة"
      - "التشكيل ناقص في اللمّتين 'شَكّ' و'عَدَم يَقِين'"
      - "الصلة الفائقة awn4-04731092-n تحمل 'جَوْدَة' التي تعني excellence لا attribute؛ 'نَوْعِيَّة' أخف إشكالاً لكن الأدق 'صِفَة' أو 'خاصِّيَّة'"
    observations: "المجموعة تجمع ثلاثة أوجه دلالية: (١) غياب اليقين المعرفي، (٢) عدم الاستقرار الموضوعي، (٣) الاعتماد على الصدفة. اللمّات الثلاث تتوزع عليها: تَزَعْزُع للثانية، شَكّ للأولى، عَدَم يَقِين للمجموع. الحقل الدلالي العربي ثري (ريب، ارتياب، حيرة) مما يوفر بدائل جديرة بالفحص."
  blind_candidates:
    - lemma: "اِرْتِيَابٌ"
      generation_method: ishtiqaq
      justification: "مصدر ارتاب على وزن افتعال من الجذر ريب؛ يجمع الشك والخوف وقلق الاطمئنان مما يناسب 'مشكوك فيه ومعتمد على الصدفة'."
    - lemma: "اِضْطِرَابٌ"
      generation_method: ishtiqaq
      justification: "مصدر اضطرب على وزن افتعل من الجذر ضرب؛ يدل في الكلاسيكية على التردد في الأمور والاختلاف والتحرك، مما يغطي عدم الاستقرار."
    - lemma: "هَشَاشَةٌ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن فَعَالة من هشّ؛ يدل على ضعف البنية وعدم الصلابة، مرشّح لتغطية precariousness مجازاً."
    - lemma: "تَذَبْذُبٌ"
      generation_method: ishtiqaq
      justification: "مصدر تذبذب على وزن تَفَعْلُل من ذبذب؛ يدل على التأرجح وعدم الثبات، مرشّح للجانب الديناميكي من عدم الاستقرار."


stage2_evidence:
  per_lemma:
    - lemma: "تَزَعْزُع"
      confirm:
        - text: "«تَزَعْزَعَ الشَّيْءُ: تَحَرَّكَ وقَلِقَ فى موضعه، مطاوع زَعْزَعَه، اهْتَزَّ واضْطَرَبَ»"
          source: "المعجم الكبير (OCR)"
        - text: "«تَزَعْزَعَ فلانٌ فى آرائِه: اضْطَرَبَ وتَذَبْذَبَ»"
          source: "المعجم الكبير (OCR)"
        - text: "«تزعزع: تحرّك بشدّة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«زعزعة: عدم استقرار» [translation_en: instability]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM)"
      expands:
        - text: "«تزَعْزَعَ: تحرك بشدة» [pos: verb, root: زعزع (ocr)]"
          source: "المعجم الوسيط (OCR)"
          addition: "تُصنّف المعاجم تَزَعْزَعَ فعلاً، مما يعني أن لمّة AWN تَزَعْزُع تُستخدم مصدراً على وزن تَفَعْلُل؛ وهو توليد صرفي سليم لكن لا يُوجَد بوصفه مدخلاً مستقلاً في المعاجم المسحوبة"

    - lemma: "شَكّ"
      confirm:
        - text: "«الشَّكُّ: خِلافُ اليَقِينِ، ج: شُكوكٌ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الشَّك: تردد بَين أَمريْن لَا مزية لأَحَدهمَا على الآخر»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الشك: الوقوف بين النقيضين... التردد بين نقيضين لا ترجيح لأحدهما عند الشاك»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«شكٌّ، ارتياب» [translation_en: doubt, domain: Law]"
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM)"
      expands:
        - text: "«الشِّينُ وَالْكَافُ أَصْلٌ وَاحِدٌ... وَمِنْ هَذَا الْبَابِ الشَّكُّ الَّذِي هُوَ خِلَافُ الْيَقِينِ، إِنَّمَا سُمِّيَ بِذَلِكَ لِأَنَّ الشَّاكَّ كَأَنَّهُ شُكَّ لَهُ الْأَمْرَانِ فِي مَشَكٍّ وَاحِدٍ، وَهُوَ لَا يَتَيَقَّنُ وَاحِدًا مِنْهُمَا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يكشف ابن فارس أن أصل الشك التداخل والتشابك بين شيئين؛ مما يؤصّل للمعنى المعرفي 'التردد بين بديلين'"

    - lemma: "عَدَم يَقِين"
      confirm:
        - text: "«لاَّ يَقِينُ (ال..)» [translation_en: uncertainty, domain: الحكامة التربوية]"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية (ARABTERM، 2020)"
        - text: "«(يَقَنَ) الْيَاءُ وَالْقَافُ وَالنُّونُ: الْيَقَنُ وَالْيَقِينُ: زَوَالُ الشَّكِّ. يُقَالُ يَقِنْتُ، وَاسْتَيْقَنْتُ، وَأَيْقَنْتُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(عَدَمَ) الْعَيْنُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى فُقْدَانِ الشَّيْءِ وَذَهَابِهِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«عَدَمُ الاستِقْرار» [translation_en: instability, domain: الطب]"
          source: "المعجم الطبي الموحد (ARABTERM، 2009)"
          addition: "يُظهر أن صيغة 'عدم + اسم' إضافية إنتاجية في المصطلحية العربية الحديثة لتعبير السلب والانعدام، مما يؤيد شيوع 'عدم يقين'"

    - lemma: "اِرْتِيَابٌ"
      confirm:
        - text: "«الرَّيْبُ: الشَّكُّ... وَارْتَابَ: شَكَّ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الرَّيْبُ: التردد بين موقعي تهمة بحيث يمتنع من الطمأنينة على كل منهما. وأصله قلق النفس واضطرابها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الرَّاءُ وَالْيَاءُ وَالْبَاءُ أُصَيْلٌ يَدُلُّ عَلَى شَكٍّ، أَوْ شَكٍّ وَخَوْفٍ، فَالرَّيْبُ: الشَّكُّ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الارتياب الذاتيّ: عدم الثقة بالذات» [translation_en: self-doubt]"
          source: "المورد الحديث (ARABTERM، 2008)"
      expands:
        - text: "«يَشُكُّ؛ يرتاب في / شكٌّ؛ ارتياب» [translation_en: doubt]"
          source: "المورد الحديث (ARABTERM، 2008)"
          addition: "يؤكد أن ارتياب مرادف وثيق لشك، مع إضافة ظل من القلق والتوجس غائب في شَكّ المجرّد"

    - lemma: "اِضْطِرَابٌ"
      confirm:
        - text: "«الاضطراب: التحرك والاختلاف. واضطربت: الأمور اختلفت»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الاضْطِراب: في الأمور التردُّدُ»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: "«اضطراب» [translation_en: disturbance / turbulence / perturbation] في مجالات: هندسة مدنية، فيزياء، كيمياء، أرصاد جوية، جيولوجيا"
          source: "معاجم ARABTERM المتعددة"
          addition: "الاضطراب في العربية المعاصرة تخصّص في دلالة الاضطراب التقني والفيزيائي أكثر من غياب اليقين المعرفي؛ بُعد دلالي يُبعده عن هذه المجموعة"

    - lemma: "هَشَاشَةٌ"
      confirm:
        - text: "«الهشاشة» [translation_en: fragility, domain: AGROVOC]"
          source: "المكنز الزراعي متعدد اللغات (ARABTERM)"
      contradicts:
        - text: "«الهشاشة: هشاشَةُ العظام: مرض خِلْقِيٌّ نادر يصيب الهيكل العظمى»"
          source: "المعجم الوسيط (OCR)"
          conflict: "دلالة هشاشة في المعاجم مرتبطة بالهشاشة المادية والطبية (fragility/brittleness)، ولا توجد شواهد على استخدامها لعدم اليقين المعرفي أو الاضطراب الوجودي"
        - text: "«الهشاشة: [في الانكليزية] Fragility، frailty»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التهانوي يحصر الهشاشة في مقابل اللزوجة الطبية، مما يؤكد بُعدها عن الحقل الدلالي للمجموعة"

    - lemma: "تَذَبْذُبٌ"
      contradicts:
        - text: "«التَّذَبْذُبُ (فى الفيزياء) oscillation: تَغَيُّرٌ دَوْرِيٌّ فى طاقةِ نظامٍ ميكانيكِيٍّ أو كهربائيٍّ أو ذَرِّيٍّ»"
          source: "المعجم الكبير (OCR)"
          conflict: "التذبذب في المعجم محدود بالاهتزاز الدوري الفيزيائي (oscillation)؛ لا صلة له بغياب اليقين أو الاضطراب الوجودي في هذه المجموعة"


stage3_analysis:
  per_lemma:
    - lemma: "تَزَعْزُع"
      decision: confirmed
      decision_reason: "مصدر الفعل تزعزعَ (وزن تَفَعْلُل للرباعي المضعّف) يدل على الاهتزاز وعدم الثبات. وثّق المعجم الكبير استخدامه المجازي 'تزعزع في آرائه = اضطرب وتذبذب'. زعزعة = عدم استقرار في ARABTERM. يغطي جانب precariousness/being unsettled في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركز على الجانب الموضوعي الخارجي: اهتزاز الشيء أو الوضع ذاته وانعدام ثباته، مقارنةً بـشَكّ الذي يركز على الحالة الذهنية الداخلية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَزَعْزُعٌ"

    - lemma: "شَكّ"
      decision: confirmed
      decision_reason: "لمّة راسخة في التراث العربي بمعنى خلاف اليقين والتردد بين أمرين؛ موثّقة في المقاييس والقاموس المحيط والمناوي والسيوطي وغيرها. تغطي الجانب الإبستيمولوجي من المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يعبّر عن الحالة الذهنية الداخلية للمتردد: تساوي طرفي القضية في ذهنه. أقل إيحاءً بالاضطراب الخارجي أو المخاطرة من تَزَعْزُع."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَكٌّ"

    - lemma: "عَدَم يَقِين"
      decision: confirmed
      decision_reason: "تعبير مركب إضافي (عدم + يقين) موثّق في ARABTERM 2020 بالمعنى ذاته. جذرا مكوّنيه في المقاييس يؤسّسان له: عدم = فقدان، يقين = زوال الشك؛ فعدم اليقين = إعادة الشك. يغطي المفهوم بصورة أشمل من أختيه في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح الجامع: يشمل غياب اليقين سواء أكان شكاً ذاتياً أم اضطراباً خارجياً أم احتمالية واعتماداً على الصدفة. هو الأقرب إلى الإنجليزية uncertainty دون تمييز."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ يَقِينٍ"

    - lemma: "اِرْتِيَابٌ"
      source: stage1
      decision: removed
      decision_reason: "رغم ثرائه الدلالي (شك + خوف + توجس)، فهو يتداخل مع شَكّ في جوهر دلالته دون إضافة حقيقية لهذه المجموعة. المجموعة تحتاج إلى تنويع دلالي لا مزيداً من رادفات الشك. ارتياب يحمل أيضاً ظلاً من الاتهام والريبة يُضيّق نطاقه ليُبعده عن 'uncertainty' العامة."

    - lemma: "اِضْطِرَابٌ"
      source: stage1
      decision: removed
      decision_reason: "تخصّص في العربية المعاصرة للاضطراب التقني والفيزيائي (turbulence/disturbance) بشهادة مصطلحيات ARABTERM المتعددة. يتداخل مع تَزَعْزُع في جانب عدم الاستقرار، ودلالته الحديثة أبعد عن uncertainty وأقرب إلى disorder."

    - lemma: "هَشَاشَةٌ"
      source: stage1
      decision: removed
      decision_reason: "مجالها المعجمي المثبَت هو الهشاشة المادية والطبية (fragility/brittleness/osteoporosis). لا شاهد في المعاجم على استخدامها بمعنى غياب اليقين أو الاضطراب المعرفي."

    - lemma: "تَذَبْذُبٌ"
      source: stage1
      decision: removed
      decision_reason: "المعجم الكبير يحددها في الفيزياء بمعنى oscillation (تغير دوري في الطاقة)؛ لا صلة لها بالحقل الدلالي لهذه المجموعة."


