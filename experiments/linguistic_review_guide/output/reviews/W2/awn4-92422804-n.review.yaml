# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-92422804-n  |  POS: n
# المفهوم: minutiae (دقائق البصمة / سمات بصمة الإصبع في القياسات الحيوية)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تفاصيل دقيقة» عبارة وصفية عامة لا تشكّل مصطلحاً اصطلاحياً مسكوكاً لـ«minutiae» في علم دراسة البصمات؛ إذ يصحّ استبدال «دقيقة» بأوصاف أخرى (خفية، صغيرة) ويبقى الوصف واصفاً صالحاً — وهو دليل على أنها عبارة وصفية لا مصطلح."
      - "اللمّة «سمات البصمة» أكثر تخصصاً دلالياً، غير أنها هي الأخرى تركيب إضافي وصفي ولا تُعدّ مصطلحاً مسكوكاً في المعاجم المتخصصة في القياسات الحيوية."
      - "كلتا اللمّتين تفتقران إلى التشكيل الكامل."
      - "ربط المجموعة بالمفهوم الأعلى «جَوْدَة/نَوْعِيَّة» يحتاج تأمّلاً؛ فسمات البصمة هي تفاصيل مورفولوجية تقنية، وإن كان تصنيفها ضمن «الصفة الجوهرية المميِّزة» مبرَّراً من زاوية أنها ما يُمَيِّز بصمة عن أخرى."
    observations: "المجموعة تعنى بـ«minutiae» (جمع minutia) في علم دراسة البصمات (dactyloscopy) والقياسات الحيوية؛ وهي النقاط التشريحية المميِّزة في نسيج خطوط الإصبع — كنهايات الحواف وتشعُّباتها وانقطاعاتها — التي تُوظَّف أساساً في المقارنة الجنائية وبناء قوالب التعرّف الآلي على البصمات (AFIS). المفهوم حديث النشأة في الاستعمال العربي، ومعظم مقابلاته تعابير تركيبية لا كلمات مفردة مسكوكة، مما يجعل اختيار اللمّات محدوداً بالمتاح المُعجَّم."
  blind_candidates:
    - lemma: "دَقَائِقُ الْبَصْمَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «دقائق» (جمع دقيقة بمعنى الأمر الغامض الخفي) و«البصمة». يُجسِّد الترجمة الحرفية للاتينية minutiae — «الأشياء الصغيرة/الدقيقة». والدقائق في العربية الكلاسيكية: أمور الشيء الخفية التي تقابل جليله."
    - lemma: "مَعَالِمُ الإِصْبَعِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «معالم» (جمع مَعْلَم = العلامة الدالّة المميِّزة) و«الإصبع». يُبرِّز طبيعة هذه السمات بوصفها علامات ثابتة تُعرَّف بها هوية الإصبع وتُفرِّقها عن سواها."
    - lemma: "مُمَيِّزَاتُ الْبَصْمَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «مُمَيِّزات» (جمع مُمَيِّزة، من يَّزَ) و«البصمة». يُركِّز على الوظيفة التمييزية لهذه السمات في المقارنة البيومترية وإثبات الهوية."
    - lemma: "نِقَاطُ الإِفْرَادِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «نقاط» و«الإفراد» (مصدر أَفْرَدَ = جعله منفرداً متميزاً بذاته). يُشير إلى أن هذه النقاط هي ما يُحقِّق تفرُّد كل بصمة وإفراد هويتها البيومترية."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تفاصيل دقيقة"
      confirm:
        - text: "«تفاصيل؛ تفصيلات.» — (مقابل الإنجليزية: minutiae)"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«كَشَفَ عن تَفَاصِيلَ خطته [فصيحة] — كلمة «تفاصيل» من الكلمات الممنوعة من الصرف؛ لأنها على صيغة منتهى الجموع»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يؤكد أن «تفاصيل» لفظ فصيح صحيح الاستعمال. أصله من جذر فصل = تمييز الشيء عن الشيء، مما يوثّق علاقته بمفهوم التفريق والتمييز الذي هو جوهر «minutiae»."

    - lemma: "سمات البصمة"
      confirm:
        - text: "«سِمَات — الخصائص المميزة للشخص التي يختارها الفنان ليعبر عنه من خلالها» — (translation_en: characteristic)"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ALECSO"
        - text: "«انْطِباعُ باطنِ نهاية الإِصْبَع أو الإِبْهَام»"
          source: "المعجم الكبير (OCR)"
        - text: "«بصمة الإصبع» — (translation_en: fingerprint)"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ALECSO"
      expands:
        - text: "«بصمة — ميزة أو مجموعة ميزات لمادة ما، يمكن بواسطتها التعرف على هذه المادة»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000) — ALECSO"
          addition: "يؤكد توسُّع معنى «بصمة» ليشمل أيَّ خاصية تعريفية مميِّزة، مما يُقوِّي صياغة «سمات البصمة» للدلالة على السمات التعريفية لبصمة الإصبع."

    - lemma: "دَقَائِقُ الْبَصْمَةِ"
      contradicts:
        - text: "«دقائق — minutes» — (domain: Mathematics and Astronomy)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ALECSO"
          conflict: "اللفظ «دقائق» راسخ في المعاجم العلمية العربية بمعنى «الدقائق الزمنية أو الزاوية»، مما يُوقِع في اللبس عند توظيفه للدلالة على سمات بصمة الإصبع."
      expands:
        - text: "«الدقائق: جمع دقيقة.»"
          source: "دستور العلماء للأحمدنكري (القرن 18)"
          addition: "يؤكد أن «دقائق» جمع دقيقة في الاستعمال الكلاسيكي، مما يُقوِّي الأصل الاشتقاقي لكن لا يُرسِّخ الاستعمال التقني المقصود."

    - lemma: "مُمَيِّزَاتُ الْبَصْمَةِ"
      confirm:
        - text: "«مميزات — characteristics» — (domain: Chemistry)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — ALECSO"
        - text: "«مُمَيِّزَات — characteristics» — (domain: Pharmacy)"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — ALECSO"
        - text: "«مميزات — features» — (domain: AGROVOC)"
          source: "المَكنَز الزراعي متعدد اللغات — ALECSO"

    - lemma: "مَعَالِمُ الإِصْبَعِ"
      evidence_status: "no_material_found"

    - lemma: "نِقَاطُ الإِفْرَادِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────
    - lemma: "تفاصيل دقيقة"
      decision: confirmed
      decision_reason: "المورد الحديث (2008) يُترجم «minutiae» بـ«تفاصيل؛ تفصيلات» مباشرةً، مما يُعطي «تفاصيل» سنداً معجمياً معاصراً. التركيب «تفاصيل دقيقة» يُضيف صفة توضيحية وإن كانت مكرَّرة دلالياً (التفاصيل دقيقة بطبعها). تبقى اللمّة مقبولة بوصفها تعبيراً تركيبياً وصفياً معبِّراً عن المفهوم في السياق الطبي الشرعي، مع الإشارة إلى أن «دقيقة» هنا تُعمِّق الدلالة التخصصية رغم تضمّنها المنطقي في «تفاصيل»."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركِّز على صغر هذه السمات ودقتها وغموضها الشكلي (fine details)، مع إيحاء أشمل يتعدى مجال البصمات — اللفظ قابل للانتقال إلى سياقات أخرى دون إضافة «البصمة»."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَاصِيلُ دَقِيقَةٌ"

    - lemma: "سمات البصمة"
      decision: confirmed
      decision_reason: "«سمات» موثَّق في المعاجم التقنية بمعنى «الخصائص المميِّزة» (characteristics/features)، و«البصمة» موثَّقة بالمعنى التقني للبصمة الإصبعية في معاجم القانون والطب. التركيب الإضافي «سمات البصمة» يحقق التخصيص الميداني المطلوب ويُجسِّد المفهوم التقني بصورة أوضح من «تفاصيل دقيقة»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُبرِّز الانتماء الصريح إلى مجال «البصمة» وطبيعة هذه السمات بوصفها خصائص تعريفية مُلازِمة لبصمة الإصبع، لا مجرد تفاصيل صغيرة — أكثر تخصصاً ميدانياً من «تفاصيل دقيقة»."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِمَاتُ الْبَصْمَةِ"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────
    - lemma: "دَقَائِقُ الْبَصْمَةِ"
      source: stage1
      decision: removed
      decision_reason: "رغم أن «دقائق» تُعادل «minutiae» اشتقاقياً، فإن المعاجم العلمية العربية رسّخت «دقائق» بمعنى وحدات الزمن والزاوية (minutes)، مما يُولِّد لبساً تقنياً. علاوةً على ذلك، لم يُعثَر على المركب «دقائق البصمة» في أي مصدر معجمي، ولم تُوظِّفه المعاجم التقنية في المجال البيومتري."
      evidence_assessment:
        case: mixed

    - lemma: "مُمَيِّزَاتُ الْبَصْمَةِ"
      source: stage1
      decision: removed
      decision_reason: "«مميزات» موثَّق بمعنى «characteristics» لكن لا يختلف دلالياً اختلافاً واضحاً عن «سمات البصمة» المؤكَّدة. وجود لمّة مشابهة مؤكَّدة يجعل إضافة هذه اللمّة تكراراً دون قيمة تمييزية محدَّدة."
      evidence_assessment:
        case: confirm_only

    - lemma: "مَعَالِمُ الإِصْبَعِ"
      source: stage1
      decision: removed
      decision_reason: "«معالم» تحمل إيحاء المعالم البارزة والكبيرة (landmarks) في حين أن «minutiae» تُشير تحديداً إلى التفاصيل الدقيقة الخفية — وهو تعارض دلالي مع روح المصطلح. لم يُعثَر على المركب في أي مصدر."
      evidence_assessment:
        case: no_material

    - lemma: "نِقَاطُ الإِفْرَادِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثَر على المركب في أي مصدر معجمي. «الإفراد» بمعنى تفريد الهوية ليس مُصطلحاً راسخاً في السياق البيومتري. ضعف التوثيق يمنع تأكيده."
      evidence_assessment:
        case: no_material


