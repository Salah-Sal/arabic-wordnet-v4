    - lemma: "لَفْتَة"
      decision: confirmed
      decision_reason: >
        لفتة غير موثَّقة كمدخل اسمي مستقل في المعاجم الكلاسيكية المُستعلَمة. إلا أنها قياسية
        اشتقاقيًا من الجذر (لفت = التفت واجتذب الانتباه)، وهي راسخة الاستخدام في العربية
        المعاصرة المكتوبة (لفتة كريمة، لفتة إنسانية، لفتة لطيفة) في الإعلام والأدب. تُقبَل
        بوصفها مصطلحًا عاميًا-فصيحًا معاصرًا، مع الإشارة إلى ضعف توثيقها الكلاسيكي.
        التشكيل غائب → تطبيق update_lemma.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        لفتة تُلمح إلى الفعل الودّي العفوي الذي يلفت الانتباه إلى صاحبه ويعكس مشاعره
        الإنسانية؛ وهي أكثر ارتباطًا بالبُعد الوجداني والعاطفي من بادرة التي تُركّز
        على الخطوة والمبادرة.
      morphological_check:
        wazn: "فَعْلَة (اسم مرة)"
        root: "لفت"
        fitness: >
          وزن فعلة (اسم المرة) مناسب تمامًا لـ«فعل واحد يُصدَر» وهو ما يُطابق معنى المجموعة.
      quality_gate:
        consistency: "شائع في الكتابة الصحفية والأدبية المعاصرة"
        ease: "سهل التداول"
        fitness: "ملائم للسياق الاجتماعي"
        heritage_preference: "الجذر عربي تراثي لكن المعنى الحديث توسُّع"
        arabic_preference: "عربي خالص"
        derivability: "قابل للجمع (لفتات)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَفْتَة"

    - lemma: "إِيمَاءَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم التخصصية تُوظِّف «إيماءة» مقابلًا لـkineme، وهو مصطلح لسانياتي يعني
        الوحدة الحركية الأصغر لا «الفعل الكامل الدال على النية». والمعنى المراد في
        المجموعة هو فعل مقصود صادر كإشارة على النية، وليس وحدة حركية أو إيماءة جسدية
        بالمعنى الكيناسي التخصصي. فضلًا عن ذلك، إيماء (المصدر) أو إيماءة تُوحي بالإشارة
        الجسدية لا بالفعل الاجتماعي/الدبلوماسي الدال على النية.

    - lemma: "مَبَادَرَة"
      source: stage1
      decision: removed
      decision_reason: >
        مبادرة في العربية تعني «المبادرة/اتخاذ الخطوة الأولى» (initiative) وهو أشمل وأعمّ
        من «فعل يُصدَر كدلالة على نية» المراد في هذه المجموعة. الخلط بين دلالتي initiative
        وgesture يُفضي إلى اشتراك لفظي. بادرة (الاسم المرة الأقصر) أكثر تخصصًا في الدلالة
        على الفعل الفردي الواحد، بينما مبادرة تحمل معنى المشروع أو الخطة أو الحملة.

    - lemma: "إِشَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        إشارة تدل على العلامة الحسية أو العقلية الدالة على شيء ما (sign/signal/index)، وليس
        على «الفعل المقصود المُصدَر كدلالة على نية» بالمعنى الاجتماعي. كذلك إشارة مُستخدَمة
        في معاني تقنية متعددة (إشارة مرور، إشارة لاسلكية) مما يُضعف دلالتها في هذا السياق.
        المعاجم الكلاسيكية تُعرّفها بأنها التلويح لا الفعل الدال على النية.

    - lemma: "تَلْوِيح"
      source: stage1
      decision: removed
      decision_reason: >
        تلويح كلاسيكيًا يعني الإشارة غير المباشرة المبهمة من بُعد (وهو مرتبط بالكناية
        البلاغية). لا يناسب «فعل مباشر يُصدَر كدلالة على نية»، بل المعنى عكسي (يُخفي
        لا يُبيّن). والمعنى التقني «تغطية بألواح» بعيد تمامًا.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "شيء يتم كدلالة على نية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية (something done as an indication of intention)
        وتركيبه مغلوط بالعربية («شيء يتم كدلالة» — «يتم» هنا غير ملائمة، و«كدلالة» تراكيب
        غير فصيحة). يجب صياغة تعريف عربي أصيل يراعي أسلوب المعجم.
    authored:
      - type: terminological
        text: "فِعْلٌ إِرَادِيٌّ يُصْدِرُهُ شَخْصٌ تَعْبِيرًا عَنْ نِيَّتِهِ أَوْ مَوْقِفِهِ تِجَاهَ أَمْرٍ مَّا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كُلُّ فِعْلٍ أَوْ تَصَرُّفٍ يَصْدُرُ مِنَ الشَّخْصِ دَلَالَةً عَلَى قَصْدِهِ وَمَرَامِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
