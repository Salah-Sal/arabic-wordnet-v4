# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «شيء يتم كدلالة على نية» ركيك الصياغة ويبدو ترجمةً حرفيةً من الإنجليزية، ولا يُحاكي أسلوب المعاجم العربية"
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل في بيانات المجموعة"
      - "بادرة في معاجمها الكلاسيكية تعني «ما يبدر عن الإنسان في لحظة الغضب» لا «فعل يُصدر كدلالة على نية»، والاستخدام الحديث توسّع دلالي غير موثَّق في المعاجم الرئيسية"
      - "لفتة غائبة كمدخل اسمي مستقل عن المعاجم المُستعلَمة، وهي في الغالب استخدام صحفي/عامي حديث"
    observations: >
      المجموعة تصف مفهوم «الإيماء الإرادي أو الفعل الرمزي الدال على النية»، وهو ما يُعبَّر عنه في العربية المعاصرة
      غالبًا في السياقات الدبلوماسية والاجتماعية بـ«بادرة» (بادرة حسن النية، بادرة سلام). أما «لفتة»
      فتُستخدم في السياقات الإنسانية/الاجتماعية (لفتة كريمة، لفتة إنسانية). كلتا اللمتين توسُّع دلالي
      حديث غير موثَّق توثيقًا كلاسيكيًا صريحًا، لكنهما راسختان في الاستخدام المعاصر لغة الإعلام
      والدبلوماسية. يوصى بتحسين التعريف العربي ليعكس هذا المفهوم بصياغة معجمية فصيحة.

  blind_candidates:
    - lemma: "إِيمَاءَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر (ومأ/أومأ) على وزن إفعالة، تدل على حدث إشاري واحد؛ يُومئ المرء بها
        لدلالة على قصد أو نية، وهي ثابتة في المعجمية العربية بمعنى الحركة الجسدية الدالة.
    - lemma: "مَبَادَرَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر (بدر) على وزن مفاعلة، تعني الأخذ بزمام الأمر تعبيرًا عن قصد مُسبَق؛
        وتُستخدم في العربية المعاصرة للدلالة على الفعل الإرادي المُصدَر كعلامة على النية
        لا سيما في السياقين الدبلوماسي والسياسي.
    - lemma: "إِشَارَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر (شور) على وزن إفعالة، تعني علامة أو فعلًا يصدر للدلالة على أمر ما؛
        وهي ثابتة في المعاجم بمعنى «التلويح بشيء يُفهم منه المراد».
    - lemma: "تَلْوِيح"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (لوح) على وزن تفعيل، تعني الإشارة غير المباشرة من بُعد للتعبير عن
        مقصود؛ وهو ثابت كلاسيكيًا بمعنى «ما يُشار به إلى المطلوب من بعد مع خفاء».


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  queries_run:
