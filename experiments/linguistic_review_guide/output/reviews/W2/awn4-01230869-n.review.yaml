      nuance_differentiation: >
        بادرة تُلمح إلى أسبقية الفعل ومبادرة صاحبه (هو من أقدم أوّلًا)، ولا سيما في سياق
        المصالحة والتقارب الدبلوماسي؛ فهي تحمل ظلًا من معنى الشجاعة أو حسن الظن.
      morphological_check:
