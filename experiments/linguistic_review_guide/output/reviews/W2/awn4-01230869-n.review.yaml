          source: "المورد الحديث (2008)"
          addition: >
            المورد الحديث يُدرج «مبادرة» كأحد مقابلات gesture في السياق السياسي،
            مما يُثبت توثيق الصلة الدلالية بين جذر بدر ومفهوم الإيماء الإرادي الدال على النية.

    - lemma: "لَفْتَة"
      evidence_status: "no_material_found"

    - lemma: "إِيمَاءَة"
      confirm:
        - text: "«وحدة إشارة جسدية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«مجموعة من الحركات التي يمكن أن تحل واحدة منها محل الأخرى دون أن يتغير المعنى»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«(1) إيماء (2) إيماءة (3) مبادرة a political gesture»"
          source: "المورد الحديث (2008)"
      expands:
