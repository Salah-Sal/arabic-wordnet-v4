        - text: "«ما يبدر من رجل عند غَضبه من خطأ أو سقط — الغضبة السريعة — الكلمة العوراء»"
          source: "المعجم الوسيط"
        - text: "«وَمَا يبدر من رجل عِنْد غَضَبه من خطأ أَو سقط والغضبة السريعة والكلمة العوراء وَمِنْه قَوْلهم فِي الْحَلِيم (فلَان لَا تخشى بوادره)»"
          source: "المعجم الوسيط (رواية الحوراني)"
