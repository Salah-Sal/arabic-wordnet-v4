          source: "المعجم الوسيط"
          conflict: >
            المعاجم الكلاسيكية لا تذكر «دلالة على النية» ضمن معاني بادرة؛ المعنى الأصل هو
            «الخطأ أو الانفعال السريع في لحظة الغضب». الاستخدام الحديث في «بادرة حسن النية»
            هو توسُّع دلالي معاصر غير مُدرَج في المعاجم الكلاسيكية.
      expands:
