        - text: "«الإشارة: دلَالَة عقلية أَو حسية إِلَى الشَّيْء بِحَيْثُ لَا يُشَارِكهُ فِيهِ غَيره»"
          source: "معجم مقاليد العلوم للسيوطي (ت. 1505م)"
      contradicts:
        - text: "«signal, sign, indication»"
          source: "معاجم ArabTerm المتعددة"
          conflict: >
            المعاجم التقنية توظّف «إشارة» للدلالة على الإشارات الفيزيائية (signal) وعلامات
            قانون السير وما شابهها، بعيدةً عن معنى «الفعل الإرادي المُصدَر كدلالة على نية»
            بالمعنى الاجتماعي/الدبلوماسي. الإشارة علامة لا فعل.

    - lemma: "تَلْوِيح"
      confirm:
