# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "بَادِرَة"
      decision: confirmed
      decision_reason: >
        الاستخدام المعاصر لـ«بادرة» في السياقات الدبلوماسية والاجتماعية (بادرة حسن النية، بادرة
        سلام، بادرة ودّ) راسخ في الإعلام والدبلوماسية العربية. والأصل الاشتقاقي (بدر = أسرع
