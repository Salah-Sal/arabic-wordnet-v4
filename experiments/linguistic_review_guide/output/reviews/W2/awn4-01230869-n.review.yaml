          source: "المورد الحديث (2008)"
        - text: "«initiative — مُجموعات تنفيذية، مجموعة ذات اهتمامات مُشتركة، تبادر بفعل شئ ما»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (ArabTerm)"
        - text: "«initiative — اقتراح يقدمه أو عمل يقوم به أو قرار يأخذه شخص (صاحب المبادرة) قبل الآخرين»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      contradicts:
