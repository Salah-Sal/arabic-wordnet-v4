      contradicts:
        - text: "«kineme — وحدة إشارة جسدية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: >
            المعاجم التخصصية تُوظِّف «إيماءة» لمصطلح kineme وهو مفهوم لسانياتي تقني
            يعني وحدة حركية أصغر من الحركة التعبيرية الكاملة (gesture)، وليس «فعلًا يُصدر
            كدلالة على نية» بالمعنى المقصود في هذه المجموعة.

    - lemma: "مَبَادَرَة"
      confirm:
