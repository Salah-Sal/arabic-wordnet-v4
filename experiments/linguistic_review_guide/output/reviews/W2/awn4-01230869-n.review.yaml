          source: "معجم مقاليد العلوم للسيوطي (ت. 1505م)"
        - text: "«التَّلْوِيح: كِنَايَة تكون الوسائط فِيهَا كَثِيرَة من لوح إِذَا أَشَارَ عَن بعيد»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«التّلويح: في اللغة هو أن تشير إلى غيرك من بعيد»"
