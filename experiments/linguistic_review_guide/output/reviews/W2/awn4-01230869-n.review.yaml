          conflict: >
            معاجم ArabTerm تُوظِّف «مبادرة» لمعنى «المبادرة/الأسبقية» (initiative)
            وهو أوسع من «فعل يُصدر كدلالة على نية»؛ كما أن دلالة precession (حركة
            السبق الفيزيائية) مغايرة تمامًا. مبادرة بمعنى gesture مقتصر على السياق
