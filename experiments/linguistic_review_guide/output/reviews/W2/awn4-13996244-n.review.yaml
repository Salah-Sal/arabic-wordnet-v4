        الإسلامي يُضيف حمولةً إسكاتولوجية تُفسد استخدامه في السياق القانوني. شَغَب
        أدقُّ منه وأخلى من الإشكالات الدلالية.

    - lemma: "بَلْبَلَة"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على توثيق معجمي مستقل لبلبلة في سياق الإخلال بالنظام العام.
        وروده في المعجم الوسيط مقيَّد بتركيب «بلبلة الأفكار» (confusion of minds)
        لا بالإخلال الأمني. لا يجتاز اختبار السكّ: الوحدة غير ثابتة كمصطلح مستقل.

    - lemma: "فِتْنَة"
      source: stage1
      decision: removed
      decision_reason: >-
        فتنة تحمل دلالةً دينيةً-سياسيةً راسخةً (الابتلاء، الحرب الأهلية، الصراع
        الطائفي) تختلف عن مفهوم الإخلال البسيط بالنظام العام. في العربية المعاصرة
        تُحيل فتنة إلى الفتنة الطائفية أو الفتنة الدينية لا إلى اضطراب بوليسي
        عادي. غياب التطابق الدلالي مع ما يقصده القانون بـ«disturbance of the peace».


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "إخلال بالسلم أو النظام العام"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي صحيح لكنه يحتمل التحسين: لفظ «السلم» قد يُوحي بسياق السلام
        الدبلوماسي، والمصطلح القانوني الأدق هو «السكينة العامة» (public peace)؛ كما أن
        الصياغة تعتمد على «إخلال» التي هي فعل، بينما المفهوم يشمل الحالة الناتجة أيضاً.
    authored:
      - type: terminological
