    - lemma: "اضطراب"
      decision: confirmed
      decision_reason: >-
        اضطراب مُثبَّت في المعاجم التخصصية مقابل disturbance وdisorder، ويُستخدم في
        العربية الرسمية والإعلامية في السياق الأمني (اضطرابات أمنية، اضطرابات عمالية).
        رغم اتساع دلالته، فإنه رسخ في السياق القانوني والإداري بوصفه مرادفاً لـ
        disturbance. يحتاج إلى تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يدلُّ على الحالة العامة من عدم الاستقرار؛ أوسع دلالةً من شَغَب إذ يشمل
        الاضطرابات العلمية والطبية والاجتماعية، ويُستخدم في السياقات الرسمية والإدارية
        للإشارة إلى حالات الإخلال الأمني على المستوى الكلي
      actions:
