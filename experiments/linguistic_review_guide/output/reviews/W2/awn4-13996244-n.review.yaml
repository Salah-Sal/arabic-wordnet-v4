        المعاصرة للتعبير عن الفوضى الاجتماعية والإخلال الشامل بالنظام. معجم الصواب
        يُثبت "عاشت البلاد في فوضى عارمة" فصيحة. يُعدُّ استخدامها في هذا السياق
        مقبولاً وإن كانت أشدُّ حِدَّةً من مجرد الإخلال بالسلم. تحتاج تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تدلُّ على غياب السلطة والنظام وانهيار الحكم؛ أشدُّ حِدَّةً من اضطراب إذ تُفيد
        اللانظام الكامل لا مجرد الإخلال به، وتُستعمل في سياقات الفوضى الشاملة حيث
        تنهار الدولة لا مجرد اضطراب يُمكن احتواؤه
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَوْضَى"

    - lemma: "شَغَب"
      source: stage1
      decision: confirmed
      decision_reason: >-
        شَغَب أخصُّ مصطلح عربي لهذا المفهوم وأدقُّه: «تهييج الشر وإثارة الفتن والاضطراب
        والجلبة والخصام». ثبت بأسانيد متواترة من كتاب العين والقاموس المحيط ولسان العرب
        والمقاييس، ويُستعمل في العربية المعاصرة في «مكافحة الشَّغَب» (riot control) مما
        يُثبت استمرارية دلالته ودقته المصطلحية. ابن فارس حصر دلالته في الشر لا في الخير
        مما يجعله خاصاً تماماً بالإخلال الأمني لا بأي نوع من الاضطراب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        أخصُّ الألفاظ الثلاثة دلالةً؛ يُفيد تهييجَ الشرِّ وإثارةَ الفتنة بفعل متعمَّد
        من فاعل بعينه، وهو وحده المحصور بالشرِّ دون الخير (كما قال ابن فارس). يُستعمل
        في السياقات الأمنية المعاصرة (مكافحة الشَّغَب، شَغَب الملاعب) مما يجعله
        الأدقَّ لوصف الإخلال المتعمَّد بالنظام العام
      actions:
        - command: create_entry
          params:
