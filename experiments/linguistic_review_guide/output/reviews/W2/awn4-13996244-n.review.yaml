# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13996244-n
# ili: i110365 | pos: n
# التعريف الإنجليزي: a disturbance of the peace or of public order
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (اضطراب وفوضى) مجردتان من التشكيل الكامل"
      - "اضطراب مصطلح مبهم الحدود يغطي اضطرابات علمية وطبية وفيزيائية، وليس خاصاً بالإخلال الأمني العام"
      - "فوضى تدلُّ في أصلها على انعدام السلطة والحاكم (أنارشيا)، وليس تحديداً على الإخلال بالسلم العام الذي هو فعل متعمَّد"
      - "يغيب المصطلح الأدقُّ دلالةً على هذا المفهوم: شَغَب، الذي ثبتت له دلالة تهييج الشر وإثارة الفتن في اللغة العربية الكلاسيكية والمعاصرة"
      - "التعريف العربي الحالي (إخلال بالسلم أو النظام العام) مقبول لكن يمكن تحسينه: لفظ السلم يوحي بسياق دبلوماسي، والأدقُّ قانونياً: السكينة العامة"
    observations: >-
      المجموعة الترادفية تصف مفهوماً قانونياً-أمنياً محدداً هو «الإخلال بالنظام العام»
      أو «تشويش السكينة العامة»، وهو مصطلح له رصيد عريق في التراث العربي تحت مادة
      «شَغَب» (تهييج الشر وإثارة الفتن) وكذلك «هَرْج» (الفتنة والاختلاط). اللمّتان
      الموجودتان صحيحتان في مجال الاستخدام لكنهما أوسع دلالةً من المفهوم المُستهدَف.
      ينبغي إضافة شَغَب لما له من دقة مصطلحية فائقة وتوثيق معجمي متين.

  blind_candidates:
    - lemma: "شَغَب"
      generation_method: ishtiqaq
      justification: >-
        مصدر (فَعَل) من جذر ش-غ-ب، يدلُّ على تهييج الشر وإثارة الفتنة والاضطراب بين
        الناس، وهو أخصُّ مصطلح عربي لهذا المفهوم. مثبَّت في الاستخدام المعاصر في
        «مكافحة الشَّغَب» (riot control). لا يُستعمل إلا في سياقات الشرِّ لا الخير.

    - lemma: "هَرْج"
      generation_method: ishtiqaq
      justification: >-
        مصدر (فَعْل) من جذر ه-ر-ج، يدلُّ على الفتنة والاختلاط في المجتمع. وارد في
        الحديث النبوي «بين يدي الساعة هَرْج» بمعنى اختلاط وقتال. يُستعمل في تعبير
        «هَرْج ومَرْج» للتعبير عن الفوضى والاضطراب العام.

    - lemma: "بَلْبَلَة"
      generation_method: majaz
      justification: >-
        إزاحة دلالية من الصوت (بلبلة = ثرثرة الطائر) إلى الاضطراب والتشوش الاجتماعي.
        وردت في المعجم الوسيط في سياق «الاضطراب وبلبلة الأفكار». تُفيد الاضطراب الذي
        يُشوِّش العقول ويُقلقل النظام.

    - lemma: "فِتْنَة"
      generation_method: majaz
      justification: >-
        مجاز من «إدخال الذهب في النار لاختباره» إلى المحنة والاضطراب الاجتماعي.
        أفادت المعاجم أنها «الاضطراب وبلبلة الأفكار» و«اختلاف الناس في الآراء وما
        يقع بينهم من القتال»، وهو قريب من مفهوم الإخلال بالنظام العام.


