# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13923453-n (plume)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم «الريشة» وهي ذاتها لمّة في المجموعة، مما يُحدث دوراناً معجمياً"
      - "«عمود دخاني» مركب وصفي شديد التخصيص، يدل على عمود الدخان فقط ولا يغطي المفهوم العام «أي شيء يشبه الريشة»"
      - "التعريف ترجمة حرفية للتعريف الإنجليزي وليس بأسلوب المعجم الوسيط"
    observations: >
      المفهوم هو الشكل الريشي العام — أي هيئة ممتدة خفيفة تشبه الريشة في امتدادها أو رقتها.
      وهو مفهوم شكلي مجرد يندرج تحت جنس «الشكل/الهيئة». في العربية يُعبَّر عن هذا المفهوم
      غالباً بالاستعارة من «ريشة» أو بألفاظ تدل على الخفة والامتداد مثل «زفيف» أو «عُرْف».
      نتائج الجسر الإنجليزي كشفت عن لفظ «زَفيف» في المعجم الطبي الموحد بمعنى «plume (شكل شبيه بالريش)» وهو مصطلح حديث مبني على جذر زفف الدال على الخفة.
  blind_candidates:
    - lemma: "عُرْف"
      generation_method: majaz
      justification: >
        العُرْف في اللغة: شعر عنق الفرس ولحمة مستطيلة في أعلى رأس الديك،
        وهو بروز ريشي الشكل ممتد. يمكن توسيع دلالته مجازاً ليشمل كل شكل ممتد يشبه الريشة.
    - lemma: "ذُؤَابَة"
      generation_method: majaz
      justification: >
        الذؤابة أعلى الشيء وطرفه المتدلي، وضفيرة الشعر المرسلة،
        فيها معنى الامتداد والتدلي الخفيف الذي يشبه الريشة.
    - lemma: "خُصْلَة"
      generation_method: majaz
      justification: >
        الخُصلة: الشعر المجتمع، وأطراف الشجر المتدلية.
        فيها معنى التجمع الخفيف الممتد الذي يشبه الريشة.
    - lemma: "عُثْنُون"
      generation_method: majaz
      justification: >
        العُثنون: ما نبت على الذقن وتدلى، وعثنون الريح هيدبها في أوائلها.
        جذره «عثن» يدل على الانتشار والانتفاش، وهي صفات ريشية.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "رِيشَة"
      confirm:
        - text: "«الواحدة من الرِّيش استعاره أبو ذؤيب الهذلي لكسوة النحل وهو الزغب»"
          source: "المعجم الكبير"
        - text: "«تركيب متقرن من مشتقات الجلد»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
        - text: "«(1) «أ» ريشة كبيرة. «ب» ريش الطائر (2) ريشة أو مجموعة من الريش ونحوِهِ [يُتَزَيَّن بها]»"
          source: "المورد الحديث (ترجمة plume)"
      expands:
        - text: "«(الريشة) قلم مركب من نصاب من الخشب وسن من المعدن ونحوه (محدثة) ومن أجزاء العود (في الموسيقى) ما يضرب به على الأوتار»"
          source: "المعجم الوسيط"
          addition: "دلالات محدثة إضافية للريشة: القلم والمضراب الموسيقي"

    - lemma: "عَمُود دُخَانِيّ"
      contradicts:
        - text: "«(العمود) السيد الذي يعتمد عليه في الأمور و(من الإعصار) ما يسطع في السماء ومن الصبح ما تبلج من ضوئه»"
          source: "المعجم الوسيط"
          conflict: "العمود يدل على الاستقامة والارتفاع لا على الشبه بالريشة؛ والمركب «عمود دخاني» يخص عمود الدخان فقط ولا يغطي المفهوم العام"
      expands:
        - text: "«سحابة — مجال ثلاثي الأبعاد يحتوي على المادة المنبعثة يحيط بمصدر الانبعاث»"
          source: "مسرد المناخ والبيئة (ALECSO)"
          addition: "في المصطلحية البيئية العربية يُستخدم «سحابة» لا «عمود دخاني» لترجمة plume"

    - lemma: "عُرْف"
      confirm:
        - text: "«شَعْرُ عُنُقِ الفرس، لَحمةٌ مستطيلة في أعلى رأس الديك، المكانُ المرتفع، مَوْجُ البحر»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(عَرَفَ) الْعَيْنُ وَالرَّاءُ وَالْفَاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَتَابُعِ الشَّيْءِ مُتَّصِلًا بَعْضُهُ بِبَعْضٍ، وَالْآخَرُ عَلَى السُّكُونِ وَالطُّمَأْنِينَةِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدل على التتابع والسكون لا على الخفة والشبه بالريشة؛ والعرف مختص بالقنازع والأعراف لا بالأشكال الريشية العامة"

    - lemma: "ذُؤَابَة"
      contradicts:
        - text: "«(الذؤابة) من كل شيء أعلاه ويقال فلان ذؤابة قومه شريفهم والمقدم فيهم وطرفه يقال ذؤابة السوط وذؤابة العمامة وشعر مقدم الرأس»"
          source: "المعجم الوسيط"
          conflict: "الذؤابة تدل على أعلى الشيء وطرفه والضفيرة المتدلية، وهي مفهوم مختلف عن الشكل الريشي"

    - lemma: "خُصْلَة"
      contradicts:
        - text: "«الخَصْلَةُ: الخَلَّةُ، والفَضيلَةُ، والرَّذيلَةُ... وبالضم: الشَّعَرُ المُجْتَمِعُ»"
          source: "القاموس المحيط"
          conflict: "الخصلة بمعنى الشعر المجتمع تدل على كتلة شعرية لا على شكل ريشي خفيف"

    - lemma: "عُثْنُون"
      confirm:
        - text: "«عُثْنُونُ الرِّيحِ: هَيْدَبُهَا فِي أَوَائِلِهَا، إِذَا أَقْبَلَتْ تَجُرُّ الْغُبَارَ جَرًّا»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«(العثنون) ما نبت على الذقن وتحته سفلا وشعيرات طوال عند مذبح البعير والتيس وما تدلى تحت منقار الديك»"
          source: "المعجم الوسيط"
          conflict: "الدلالة المركزية للعثنون شعر الذقن والمذبح، واستعماله للريح مجاز بعيد عن الشكل الريشي"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ١ ──
    - lemma: "رِيشَة"
      decision: confirmed
      decision_reason: >
        رِيشَة هي اللفظ العربي الأصيل للريشة الواحدة، وقد استُعملت مجازاً في التراث
        (أبو ذؤيب الهذلي) لما يشبه الريش، كما أن المورد الحديث يترجم plume بـ«ريشة كبيرة».
        هي أنسب لفظ عربي للمفهوم العام «ما يشبه الريشة شكلاً أو خفةً».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِيشَة"

    # ── لمّة موجودة ٢ ──
    - lemma: "عَمُود دُخَانِيّ"
      decision: removed
      decision_reason: >
        «عمود دخاني» مركب وصفي شديد التخصيص يدل على عمود الدخان المتصاعد فقط.
        لا يصلح مرادفاً للمفهوم العام «أي شيء يشبه الريشة في الشكل أو الخفة» لأنه يحصر
        الدلالة في الدخان دون سائر الأشكال الريشية. كما أن المصطلحية البيئية العربية
        تستخدم «سحابة» لا «عمود دخاني» لترجمة plume. وهو تركيب حر وليس وحدة معجمية ثابتة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: عُرْف ──
    - lemma: "عُرْف"
      source: stage1
      decision: removed
      decision_reason: >
        العُرْف يدل على شعر عنق الفرس أو لحمة رأس الديك أو المكان المرتفع.
        هو مفهوم مختلف عن الشكل الريشي العام، إذ يختص بالقنازع والأعراف البارزة
        ولا يشمل كل ما يشبه الريشة في الخفة والرقة.
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: ذُؤَابَة ──
    - lemma: "ذُؤَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        الذؤابة تدل على أعلى الشيء وطرفه المتدلي وخصلة الشعر المرسلة.
        هي مفهوم مختلف عن الهيئة الريشية العامة، وتفتقر لمعنى الخفة
        والرقة اللتين تميزان الشكل الريشي.
      evidence_assessment:
        case: contradicts_only

    # ── مرشح المرحلة ١: خُصْلَة ──
    - lemma: "خُصْلَة"
      source: stage1
      decision: removed
      decision_reason: >
        الخصلة تدل على الشعر المجتمع أو الخَلّة (الصفة). وجذرها (خصل) يدل على
        القطع والقطعة. ليس فيها معنى الشكل الريشي أو الخفة أو الامتداد الرقيق.
      evidence_assessment:
        case: contradicts_only

    # ── مرشح المرحلة ١: عُثْنُون ──
    - lemma: "عُثْنُون"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «عثنون الريح» يدل على هيدبها المنتشر وهو قريب من الشكل الريشي،
        إلا أن الدلالة المركزية للعثنون هي شعر الذقن والمذبح. التوسع المجازي بعيد
        ولم يتثبّت معجمياً بمعنى الشكل الريشي العام.
      evidence_assessment:
        case: mixed

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "أي شيء يشبه الريشة في الشكل أو الخفة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي ويفتقر لأسلوب المعجم العربي.
        يحتاج إلى صياغة مصطلحية بجنس قريب وفصل نوعي واضح.
    authored:
      - type: terminological
        text: "هَيْئَةٌ مُمْتَدَّةٌ رَقِيقَةٌ تُشْبِهُ الرِّيشَةَ فِي شَكْلِهَا أَوْ خِفَّتِهَا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كُلُّ مَا كَانَ عَلَى صُورَةِ الرِّيشَةِ فِي امْتِدَادِهِ وَرِقَّتِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "هَيْئَةٌ مُمْتَدَّةٌ رَقِيقَةٌ تُشْبِهُ الرِّيشَةَ فِي شَكْلِهَا أَوْ خِفَّتِهَا"

  examples:
    per_lemma:
      - lemma: "رِيشَة"
        examples:
          - text: "تَصَاعَدَتْ مِنَ المِدْخَنَةِ رِيشَةٌ مِنَ الدُّخَانِ الأَبْيَضِ تَتَلَوَّى فِي الهَوَاءِ"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تَصَاعَدَتْ مِنَ المِدْخَنَةِ رِيشَةٌ مِنَ الدُّخَانِ الأَبْيَضِ تَتَلَوَّى فِي الهَوَاءِ"

# ── المرحلة ٥: الإثراء ─────────────────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "رِيشَة"
      entry_id: "{auto}"
      root: "ريش"
      maqayis_quote: "«الرَّاءُ وَالْيَاءُ وَالشِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حُسْنِ الْحَالِ، وَمَا يَكْتَسِبُ الْإِنْسَانُ مِنْ خَيْرٍ. فَالرِّيشُ: الْخَيْرُ. وَالرِّيَاشُ: الْمَالُ... وَمِنَ الْبَابِ رِيشُ الطَّائِرِ»"

  per_sense:
    - lemma: "رِيشَة"
      sense_id: "{auto}"
      nuance: "اللفظ الأصيل الوحيد في المجموعة؛ يدل على الهيئة الريشية العامة بامتدادها ورقتها وخفتها"

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ريش","maqayis":"«الرَّاءُ وَالْيَاءُ وَالشِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حُسْنِ الْحَالِ... وَمِنَ الْبَابِ رِيشُ الطَّائِرِ»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ الأصيل الوحيد في المجموعة؛ يدل على الهيئة الريشية العامة بامتدادها ورقتها وخفتها"}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.70
