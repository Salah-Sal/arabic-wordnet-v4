        المائية، مما يُقوِّي الحجة للإقصاء.

    - lemma: "نَجَاعَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد في أي مصدر معجمي استخدام «النجاعة» وصفاً للتعبير اللغوي أو الأسلوب.
        المعاجم الحديثة تحصرها في مجالَي الطب والتقنية التربوية. ومقاييس ابن فارس
        تُصوِّر أصلها الدلالي بـ«منفعة الطعام والدواء في الجسم»، وهو مجاز غير سائر
        في السياق البلاغي الاصطلاحي.


