# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "غياب «بَلَاغَة» عن المجموعة وهي المصطلح الكلاسيكي الجامع للمفهوم «لغة قوية وفعالة» في التراث البلاغي العربي"
      - "«بيان» لفظ مشترك متعدد المعاني يمتد من الإيضاح إلى علم البيان إلى البيانو (معرَّب)، وليس مرادفاً خالصاً للفصاحة والبلاغة"
      - "التعريف «لغة قوية وفعالة» ترجمة حرفية قاصرة من الإنجليزية، ولا تُحيط بالمفهوم في إطاره البلاغي العربي"
      - "الجمع بين eloquence وfluency وsmoothness في مجموعة واحدة يخلط مفاهيم ذات تفريقات اصطلاحية راسخة: البلاغة ≠ الطلاقة"
      - "اللمّات الثلاث مذكورة بلا تشكيل كامل في قاعدة البيانات"
    observations: >
      المجموعة تستهدف مفهوم «البلاغة والفصاحة» وهو من أعرق المفاهيم في التراث اللغوي العربي.
      غير أن اللمّات الحالية تُغطّي ثلاثة أوجه مختلفة: (١) فصاحة = خلوص الكلام وسلامته من العيوب،
      (٢) طلاقة = سلاسة اللسان وانسيابه دون عائق، (٣) بيان = إيضاح المعنى وإظهاره.
      أما المصطلح الجامع للقوة التأثيرية ومطابقة المقام فهو «البلاغة» وهو غائب بصورة لافتة.
      ابن فارس اشتقّ البلاغة من (بلغ) بمعنى الوصول إلى الغاية، قائلاً:
      «البلاغة التي يُمدَح بها الفصيح اللسان لأنه يبلغ بها ما يريده».
  blind_candidates:
    - lemma: "بَلَاغَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (بلغ) على وزن فَعَالَة الدال على الخصلة الراسخة؛
        والبلاغة في التراث العربي ملكة إيصال المعنى بأقوى تعبير مطابق لمقتضى الحال مع الفصاحة،
        وهو ما يعادل «لغة قوية وفعالة» تماماً. الوزن فَعَالَة مستخدم للصفات الراسخة كالشجاعة والكرامة.
    - lemma: "طَلَاقَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (طلق) على وزن فَعَالَة، ويدل على انطلاق اللسان وسلاسته دون عائق؛
        قال ابن فارس: «طلق اللسان وطليقه»، وهو يُعبِّر عن جانب الانسياب والسهولة
        في «اللغة الفعّالة».
    - lemma: "إِبَانَة"
      generation_method: ishtiqaq
      justification: >
        مصدر أَبَانَ من الجذر (بين) على وزن إِفَالَة، ويعني إظهار المعنى وإيضاحه؛
        قال ابن فارس في (بين): «وبانَ الشيءُ وأبانَ إذا اتَّضَح وانكشف»؛
        وهو صنو الفصاحة في بُعد الوضوح والكشف.
    - lemma: "نَجَاعَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (نجع) على وزن فَعَالَة، أصله «نفع الطعام في الجسم»،
        ثم اتُّسع فيه بمعنى «التأثير الفعلي»؛ ويمكن أن يُعبِّر عن «فعالية اللغة»
        في إحداث أثرها في المتلقي.


