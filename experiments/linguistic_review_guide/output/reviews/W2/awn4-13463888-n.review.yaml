stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية تفتقر إلى التشكيل."
    observations: "المصطلحان 'أسر' و'التقاط' يعبران بدقة عن المفهوم الفيزيائي (capture) ويستخدمان بشكل واسع في الترجمات العلمية."
  blind_candidates:
    - lemma: "اِلْتِقَاط"
      generation_method: ishtiqaq
      justification: "مصدر التقط، يعبر عن أخذ الجسيم الإضافي وجمعه."
    - lemma: "أَسْر"
      generation_method: majaz
      justification: "استعارة من أسر العدو، تُستخدم في الفيزياء للتعبير عن تقييد جسيم حر ضمن نظام ذري أو نووي."
    - lemma: "اِكْتِسَاب"
      generation_method: ishtiqaq
      justification: "مأخوذة من نص التعريف 'يكتسب فيها نظام ذري'، وتعني الحصول على شيء جديد."
    - lemma: "قَنْص"
      generation_method: majaz
      justification: "استعارة من الصيد، تُشير إلى اصطياد الجسيم المار وضمّه للنظام."

stage2_evidence:
  per_lemma:
    - lemma: "أَسْر"
      confirm:
        - text: "أسْر (ن): capture ... أسْر الكتروني (ن): electron capture ... أسر نترون (ن): neutron capture"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
    - lemma: "اِلْتِقَاط"
      confirm:
        - text: "التقاط نيوترون: neutron capture"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "اِكْتِسَاب"
      expands:
        - text: "الحصول على ما هو جديد في عالم المعرفة."
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يستخدم بمعنى عام للحصول على شيء، ولم نجده كأداة اصطلاحية لـ Capture الفيزيائية."
    - lemma: "قَنْص"
      contradicts:
        - text: "الصَّيدُ قَنْصاً : صاده , فهو قانِص"
          source: "المعجم الوسيط"
          conflict: "يستعمل في سياق الصيد العادي وليس في الفيزياء النووية."

stage3_analysis:
  per_lemma:
    - lemma: "أسر"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد في الفيزياء النووية للتعبير عن الـ Capture، مثل 'أسر إلكتروني' و'أسر نيوتروني'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَسْر"
    - lemma: "التقاط"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد ومستخدم لترجمة Capture في سياق التقاط النيوترونات والإلكترونات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِلْتِقَاط"
    - lemma: "اِكْتِسَاب"
      source: stage1
      decision: removed
      decision_reason: "كلمة عامة وليست المصطلح الدقيق المستقر علمياً (Capture) في السياق النووي والذري."
    - lemma: "قَنْص"
      source: stage1
      decision: removed
      decision_reason: "يستخدم في مجال الصيد البري أو العسكري، ولا يستخدم كمصطلح في الفيزياء."

stage4_content:
  definition:
    current: "أي عملية يكتسب فيها نظام ذري أو نووي جسيماً إضافياً"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويشرح المفهوم الفيزيائي بشكل سليم."
  examples:
    per_lemma:
      - lemma: "أسر"
        examples:
          - text: "يؤدي الأَسْر النيوتروني إلى إنتاج نظائر مشعة جديدة."
            type: usage
      - lemma: "التقاط"
        examples:
          - text: "تحدث عملية اِلْتِقَاط الإلكترون عندما تمتص النواة إلكتروناً من المدارات الداخلية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-13463888-n", text: "يؤدي الأَسْر النيوتروني إلى إنتاج نظائر مشعة جديدة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يؤدي الأَسْر النيوتروني إلى إنتاج نظائر مشعة جديدة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تحدث عملية اِلْتِقَاط الإلكترون عندما تمتص النواة إلكتروناً من المدارات الداخلية."}

