step3_definition:
  definition_review_flag: false
  current_definition: "(فيزياء) شيئان مرتبطان بوقوعهما تحت تأثير قوتين متساويتين ومتضادتين تعملان على خطين متوازيين"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي صياغته ركيكة ومترجمة حرفياً من الإنجليزية. المزدوجة ليست 'شيئين' بل هي نظام مكون من قوتين."
  authored_definitions:
    - type: "terminological"
      text: "نظام ميكانيكي يتكون من قوتين متساويتين في المقدار، ومتضادتين في الاتجاه، وخطّا عملهما متوازيان ولا يجمعان في خط مستقيم واحد، مما يُحدث أثراً دورانياً (عزماً)."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
    - type: "linguistic"
      text: "قوتان متساويتان متوازيتان تعملان في اتجاهين متضادين وتسببان الدوران."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: "update_definition"
      params:
        synset_id: "awn4-09280469-n"
        definition_index: 0
        text: "نظام ميكانيكي يتكون من قوتين متساويتين في المقدار، ومتضادتين في الاتجاه، وخطّا عملهما متوازيان ولا يجمعان في خط مستقيم واحد، مما يُحدث أثراً دورانياً (عزماً)."

