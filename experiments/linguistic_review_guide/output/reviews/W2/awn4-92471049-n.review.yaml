stage1_review:
  assessment:
    concerns:
      - "المصطلح الموجود يفتقر إلى التشكيل."
    observations: "مفهوم رياضي بحت (Wedge sum أو One-point union). 'مجموع إسفيني' ترجمة دقيقة ومستقرة للمصطلح، ويمكن إضافة 'اتحاد نقطي' كمرادف يشرح الماهية الهندسية للمفهوم."
  blind_candidates:
    - lemma: "مَجْمُوعٌ إِسْفِينِيّ"
      generation_method: tarkib
      justification: "ترجمة حرفية ومستقرة للمصطلح الرياضي (Wedge sum)، وهو مركب وصفي."
    - lemma: "اِتِّحَادٌ نُقَطِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر بدقة عن ماهية المفهوم الرياضي المتمثل في اتحاد عدة فضاءات عند نقطة واحدة (One-point union)."
    - lemma: "مَجْمُوعٌ وَتَدِيّ"
      generation_method: tarkib
      justification: "استخدام كلمة 'وتد' كمرادف لـ 'إسفين'، كلاهما يعبر عن (Wedge)."
    - lemma: "بَاقَةٌ طُوبُولُوجِيَّة"
      generation_method: tarkib
      justification: "ترجمة لمصطلح (Topological bouquet) والذي يمثل حالة خاصة أو مرادفة للمجموع الإسفيني في بعض السياقات."

stage2_evidence:
  per_lemma:
    - lemma: "مجموع إسفيني"
      evidence_status: "no_material_found"
    - lemma: "مَجْمُوعٌ إِسْفِينِيّ"
      evidence_status: "no_material_found"
    - lemma: "اِتِّحَادٌ نُقَطِيّ"
      evidence_status: "no_material_found"
    - lemma: "مَجْمُوعٌ وَتَدِيّ"
      evidence_status: "no_material_found"
    - lemma: "بَاقَةٌ طُوبُولُوجِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مجموع إسفيني"
      decision: confirmed
      decision_reason: "مصطلح رياضي معتمد وشائع في الطوبولوجيا، يمثل الترجمة المباشرة لـ (Wedge sum)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوعٌ إِسْفِينِيّ"

    - lemma: "اِتِّحَادٌ نُقَطِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح وصفي دقيق يعبر عن المفهوم الرياضي البديل (One-point union) وهو مستخدم في السياق الطوبولوجي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "اِتِّحَادٌ نُقَطِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-92471049-n"

    - lemma: "مَجْمُوعٌ وَتَدِيّ"
      source: stage1
      decision: removed
      decision_reason: "أقل شيوعاً واستخداماً من 'مجموع إسفيني' رغم صحته اللغوية كمرادف."
      evidence_assessment:
        case: no_material

    - lemma: "بَاقَةٌ طُوبُولُوجِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح (Bouquet) يمثل حالة خاصة من المجموع الإسفيني (مثل باقة من الدوائر)، وليس مرادفاً مطلقاً للمفهوم العام."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "(رياضيات) اتحاد بنقطة واحدة لعائلة من الفضاءات الطوبولوجية"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه عبارة اسمية مقتطعة، نُفضل صياغته كتعريف معجمي تام يبدأ بالجنس القريب."
    authored:
      - type: terminological
        text: "فضاءٌ طوبولوجيٌّ يَتَشَكَّلُ مِنِ اتِّحَادِ عائِلَةٍ مِنَ الفَضَاءَاتِ الطُّوبُولُوجِيَّةِ عِنْدَ نُقْطَةٍ وَاحِدَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-92471049-n"
          definition_index: 0
          text: "فضاءٌ طوبولوجيٌّ يَتَشَكَّلُ مِنِ اتِّحَادِ عائِلَةٍ مِنَ الفَضَاءَاتِ الطُّوبُولُوجِيَّةِ عِنْدَ نُقْطَةٍ وَاحِدَةٍ."

  examples:
    per_lemma:
      - lemma: "مَجْمُوعٌ إِسْفِينِيّ"
        examples:
          - text: "المَجْمُوعُ الإِسْفِينِيُّ لِدَائِرَتَيْنِ يُشَكِّلُ مَا يُعْرَفُ طوبولوجيًّا بِالبَاقَةِ."
            type: usage
      - lemma: "اِتِّحَادٌ نُقَطِيّ"
        examples:
          - text: "يُمْكِنُ تَبْسِيطُ الفَضَاءِ المُعَقَّدِ بِاعْتِبَارِهِ اتِّحَادًا نُقَطِيًّا لِعِدَّةِ مُكَوِّنَاتٍ بَسِيطَةٍ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "المَجْمُوعُ الإِسْفِينِيُّ لِدَائِرَتَيْنِ يُشَكِّلُ مَا يُعْرَفُ طوبولوجيًّا بِالبَاقَةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُمْكِنُ تَبْسِيطُ الفَضَاءِ المُعَقَّدِ بِاعْتِبَارِهِ اتِّحَادًا نُقَطِيًّا لِعِدَّةِ مُكَوِّنَاتٍ بَسِيطَةٍ."

