# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13865800-n (reciprocal)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «مُقَابِل» دلالتها في المعاجم الكلاسيكية تميل إلى المواجهة والتقابل لا إلى العكسية بالمعنى الرياضي/المنطقي"
      - "التعريف العربي يستعمل «علاقة عكسية» وهو من جذر عَكَسَ نفسه مما يُوقع في شبه دوران مع لمّة عَكْس"
    observations: >
      المفهوم يدور حول شيء (مصطلح أو تعبير) يربطه بشيء آخر علاقة عكسية أو تبادلية.
      المجموعة الأعلى هي «تبادلية» مما يشير إلى السياق المنطقي-الرياضي.
      المصطلح الإنجليزي reciprocal يُترجم عادة بـ«مقلوب» (رياضيات) أو «متبادَل» (عام)
      أو «عَكْس» (منطق). اللمّتان الموجودتان تغطيان البعد المنطقي (عكس) والتقابلي (مقابل)
      لكن تنقصهما الدلالة الرياضية الصرفة (مقلوب).
  blind_candidates:
    - lemma: "نَقِيض"
      generation_method: ishtiqaq
      justification: "من الجذر ن-ق-ض على وزن فَعِيل، يدلّ على ما يناقض الشيء ويدافعه، مستعمل في المنطق والفلسفة للدلالة على المُقابِل بالتمانع"
    - lemma: "مَعْكُوس"
      generation_method: ishtiqaq
      justification: "اسم مفعول من عَكَسَ على وزن مَفْعُول، يدلّ على الشيء الذي وقع عليه العكس فصار معكوساً في ترتيبه أو علاقته"
    - lemma: "مَقْلُوب"
      generation_method: ishtiqaq
      justification: "اسم مفعول من قَلَبَ على وزن مَفْعُول، مستعمل في الرياضيات والفيزياء بمعنى reciprocal العددي"
    - lemma: "ضِدّ"
      generation_method: ishtiqaq
      justification: "من الجذر ض-د-د، يدلّ على المخالف والمنافي، مستعمل في التراث بمعنى ما يقابل الشيء ويعاكسه"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "عَكْس"
      confirm:
        - text: "«العَكْسُ: ردُّكَ آخِرَ الشيءِ على أوّلِهِ»"
          source: "كتاب العين للخليل بن أحمد"
        - text: "«العَكْسُ، كالضَّرْبِ: قَلْبُ الكلامِ ونحوِهِ، ورَدُّ آخِرِ الشيءِ إلى أولِهِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«العكس في اللغة: عبارة عن رد الشيء إلى سننه، أي على طريقه الأول، مثل عكس المرآة»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«العكس يطلق على معان. منها نفي الشيء، قالوا عكس الإثبات نفي»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«عكس = converse (الرياضيات والفلك)»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
          addition: "مصطلح رياضي مقنّن لمعنى العكس المنطقي"
        - text: "«عكس = inverse (الرياضيات والفلك)»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
          addition: "يُستعمل أيضاً بمعنى المعكوس الرياضي"
        - text: "«وفي عرف الأصوليين: انتفاء الحكم لانتفاء العلة. وفي عرف الفقهاء: تعليق نقيض الحكم المذكور بنقيض علته المذكورة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "استعمال اصطلاحي أصولي وفقهي يؤكد دلالة العلاقة العكسية"

    - lemma: "مُقَابِل"
      confirm:
        - text: "«مقابل = opposite (الرياضيات والفلك)»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
      contradicts:
        - text: "«(الْمُقَابل) من الرِّجَال الْكَرِيم النّسَب من قبل أَبَوَيْهِ»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي الأول في الوسيط لا علاقة له بالعكسية بل بكرم النسب"
      expands:
        - text: "«الضّد عند المتكلّمين والفقهاء هو المقابل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يؤكد استعمال المقابل بمعنى الضد في السياق الاصطلاحي"
        - text: "«حسابات متقابلة = reciprocal accounts»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
          addition: "صيغة متقابل (لا مقابل) هي المستعملة في السياق التبادلي"

    - lemma: "نَقِيض"
      confirm:
        - text: "«(النقيض) الْمُخَالف يُقَال فلَان نقيضك وَهَذَا القَوْل نقيض ذَاك»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«النقيضان الأمران المتمانعان بالذات أي الأمران اللذان يتمانعان ويتدافعان بحيث يقتضي لذاته عدم صاحبه»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "النقيض في المنطق يعني التناقض (لا يمكن اجتماعهما) وهو أخصّ من مجرد العلاقة العكسية"
        - text: "«نقيض كل شيء: رفع تلك القضية»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "النقيض هو رفع القضية (النفي المنطقي) لا مجرد العلاقة العكسية"

    - lemma: "مَعْكُوس"
      confirm:
        - text: "«(1) معكوس (2) عكسيّ؛ معاكس (3) مقلوب رأسًا على عقب (4) عَكْس؛ ضدّ = inverse»"
          source: "المورد الحديث"
      expands:
        - text: "«فيديو معكوس = inverse video»"
          source: "معجم مصطلحات المعلوماتية"
          addition: "يُستعمل صفةً لا اسماً مستقلاً"

    - lemma: "مَقْلُوب"
      confirm:
        - text: "«مقلوب = reciprocal (الفيزياء)»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
        - text: "«مقلوب = inverse (الهندسة المدنية)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "«(3) مقلوب (ر) (4) المَقْلوب = reciprocal»"
          source: "المورد الحديث"
      expands:
        - text: "«مقلوب الأوم = reciprocal ohm»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
          addition: "مصطلح تقني مقنّن يؤكد استعمال مقلوب بالمعنى الرياضي للمقلوب العددي"

    - lemma: "ضِدّ"
      confirm:
        - text: "«الضِّدُّ: المِثْلُ، والمُخالِفُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الضِّدّ) الْمُخَالف والمنافي والمثل والنظير والكفء»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«المُتَضَادَّانِ: الشَّيْئَانِ لَا يَجُوزُ اجْتِمَاعُهُمَا فِي وَقْتٍ وَاحِدٍ، كَاللَّيْلِ وَالنَّهَارِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الضد يدلّ على التضاد والتمانع المطلق لا على مجرد العلاقة العكسية"
        - text: "«الضّد عند الحكماء هو قسم من المقابل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الضد أخصّ من المقابل عند الحكماء فلا يصلح مرادفاً للعكس العام"


# ── المرحلة ٣: التحليل اللغوي ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "عَكْس"
      decision: confirmed
      decision_reason: >
        لمّة راسخة في التراث اللغوي والاصطلاحي. العكس في المعاجم الكلاسيكية هو «ردّ آخر الشيء على أوّله»
        وفي الاصطلاح المنطقي والرياضي يدلّ على العلاقة العكسية (converse/inverse).
        مقنّن في معاجم ALECSO الموحدة بهذا المعنى.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على فعل القلب والردّ، فالعَكْس هو الشيء المقلوب في ترتيبه أو علاقته، ويغلب استعماله في السياق المنطقي والرياضي (عكس القضية، الدالة العكسية)"
      actions: []

    - lemma: "مُقَابِل"
      decision: confirmed
      decision_reason: >
        رغم أن المعنى المعجمي الأول في الوسيط (كريم النسب) لا علاقة له بالمفهوم، فإنّ اسم الفاعل مُقَابِل
        من قابَلَ (يقابل) يدلّ على ما يواجه الشيء ويناظره. استُعمل في ARABTERM بمعنى opposite،
        والتهانوي يقول «الضد عند المتكلمين هو المقابل». الجذر ق-ب-ل أصله مواجهة الشيء للشيء.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على بُعد المواجهة والمناظرة، فالمُقَابِل هو الشيء الذي يقع في مواجهة غيره ويناظره، ويغلب استعماله في سياق التقابل الهندسي والمكاني"
      actions: []

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَقِيض"
      source: stage1
      decision: removed
      decision_reason: >
        النقيض في الاصطلاح المنطقي يعني التناقض: أمران لا يجتمعان ولا يرتفعان. وهذا أخصّ وأشدّ
        من مجرد العلاقة العكسية. النقيض يرفع القضية بالكامل بينما العكس يقلب العلاقة فحسب.
        إضافته تُحدث خلطاً اصطلاحياً بين التناقض (contradiction) والعكس (reciprocal/inverse).

    - lemma: "مَعْكُوس"
      source: stage1
      decision: removed
      decision_reason: >
        اسم مفعول يُستعمل صفةً (فيديو معكوس، ترتيب معكوس) لا اسماً مستقلاً يدلّ على الشيء ذاته.
        لا يصلح لمّة اسمية مستقلة في هذه المجموعة لأنه يحتاج إلى موصوف دائماً.

    - lemma: "مَقْلُوب"
      source: stage1
      decision: removed
      decision_reason: >
        رغم تقنينه في معاجم ALECSO بمعنى reciprocal الرياضي (مقلوب العدد)، فإنّ هذا المعنى
        يخصّ المقلوب العددي (1/x) وهو مفهوم أضيق من المجموعة الترادفية التي تشمل العلاقة العكسية
        العامة بين المفاهيم والتعبيرات. كما أن مقلوب اسم مفعول من قَلَبَ ودلالته الأصلية
        الفيزيائية (قلب الشيء) تبتعد عن مجرد العلاقة العكسية المجردة.

    - lemma: "ضِدّ"
      source: stage1
      decision: removed
      decision_reason: >
        الضد يدلّ على التضاد والتمانع المطلق (ما لا يجتمع مع غيره في وقت واحد كالليل والنهار).
        وهو عند الحكماء قسم من المقابل لا مرادف للعكس. إضافته تُحدث خلطاً مع مجموعة ترادفية
        أخرى (التضاد/antonym) التي تختلف عن العلاقة العكسية.


