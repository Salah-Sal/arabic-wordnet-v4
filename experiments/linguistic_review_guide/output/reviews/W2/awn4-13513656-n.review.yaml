      - lemma: "تَكَوُّنُ الدَّمِ"
        examples:
          - text: "يُعَدُّ نِقْيُ العَظْمِ المركَزَ الأساسيَّ لِعَمَليَّةِ تَكَوُّنِ الدَّمِ في جِسْمِ الإنْسانِ."
            type: usage
      - lemma: "تَكَوُّنُ الكُرَيَّاتِ"
        examples:
          - text: "يُساعِدُ هِرْمونُ الإريثروبويتين على تَحْفيزِ تَكَوُّنِ الكُرَيَّاتِ الحَمْراءِ."
            type: usage
      - lemma: "تَخَلُّقُ الدَّمِ"
        examples:
          - text: "يُمْكِنُ أنْ يَحْدُثَ تَخَلُّقُ الدَّمِ خارِجَ النِّقْيِ في بَعْضِ الحالاتِ المَرَضِيَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ نِقْيُ العَظْمِ المركَزَ الأساسيَّ لِعَمَليَّةِ تَكَوُّنِ الدَّمِ في جِسْمِ الإنْسانِ."

