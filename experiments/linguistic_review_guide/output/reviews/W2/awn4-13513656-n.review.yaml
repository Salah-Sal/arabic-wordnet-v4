stage1_review:
  assessment:
    concerns:
      - "عدم دقة مصطلح 'تكون الكريات' كمرادف تام لـ 'تكون الدم' رغم تقاربهما دلالياً وارتباطهما في الترجمة الإنجليزية (hemocytopoiesis و hematopoiesis)."
    observations: "المصطلحان المعروضان هما تركيبان إضافيان يعبران عن المفهوم الطبي، والمصطلح الأول 'تكون الدم' هو الأكثر شيوعاً ودقة في المعاجم الطبية الحديثة."
  blind_candidates:
    - lemma: "تَكَوُّنُ الدَّمِ"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر بدقة ومباشرة عن عملية تولد الخلايا الدموية."
    - lemma: "تَخَلُّقُ الدَّمِ"
      generation_method: tarkib
      justification: "تركيب إضافي يستخدم في السياقات الطبية لوصف العملية الحيوية لخلق وتكوين الخلايا."
    - lemma: "صُنْعُ الدَّمِ"
      generation_method: tarkib
      justification: "تعبير مفهومي، لكنه أقل علمية من التكون والتخلق."
    - lemma: "بِنَاءُ الدَّمِ"
      generation_method: tarkib
      justification: "تعبير مجازي يشير إلى تشييد الخلايا الدموية وتوليدها."

stage2_evidence:
  per_lemma:
    - lemma: "تكون الدم"
      confirm:
        - text: "تَكَوُّنُ الدَّم ... hematopoiesis"
          source: "المعجم الطبي الموحد (2009)"
        - text: "تَكَوُّن الدم ... hematopoiesis; haematopoiesis"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
    - lemma: "تكون الكريات"
      evidence_status: no_material_found
    - lemma: "تخلق الدم"
      expands:
        - text: "تكوُّن الدم خارج النخاع: تخلق الخلايا الدموية و نموها خارج نخاع العظم كما في الطِّحال و الكبد و العقد اللمفاوية."
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "يستخدم لفظ 'تخلق' كمرادف وظيفي ومفسر لعملية التكون."

stage3_analysis:
  per_lemma:
    - lemma: "تكون الدم"
      decision: confirmed
      decision_reason: "المصطلح الطبي المعتمد والأكثر شيوعاً في المعاجم المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَوُّنُ الدَّمِ"
            
    - lemma: "تكون الكريات"
      decision: confirmed
      decision_reason: "ترجمة دقيقة لمصطلح (hemocytopoiesis) المترادف مع (hematopoiesis)، وهو مستخدم طبياً للإشارة إلى تكوين خلايا (كريات) الدم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَوُّنُ الكُرَيَّاتِ"

    - lemma: "تَخَلُّقُ الدَّمِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح طبي فصيح وصحيح دلالياً، ويستخدم في الشروح الطبية لوصف العملية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "تَخَلُّقُ الدَّمِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "تكوين خلايا الدم في الجسم الحي (خاصة في نخاع العظم)"
    assessment:
      decision: revise
      reason: "صياغة التعريف بأسلوب معجمي دقيق يتوافق مع بنية التعاريف العلمية."
    authored:
      - type: terminological
        text: "عمليَّة حيويَّة يتمُّ فيها تَكَوُّن خلايا الدَّم وتخَلُّقها في الجسم الحيّ، وتحدث أساساً في نخاع العظم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عمليَّة حيويَّة يتمُّ فيها تَكَوُّن خلايا الدَّم وتخَلُّقها في الجسم الحيّ، وتحدث أساساً في نخاع العظم."

  examples:
