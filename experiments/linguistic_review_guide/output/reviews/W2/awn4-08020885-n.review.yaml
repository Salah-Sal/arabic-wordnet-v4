        - text: "«فَرَغَ — يدل على خلو وسعة ذرع»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر فرغ يدل على الخلو ويُعزز صفة الفراغ"

    - lemma: "الفَرَاغُ الطُّوبُولُوجِيُّ"
