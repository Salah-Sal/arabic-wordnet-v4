          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM"
          addition: "يُثبت توظيف 'فراغ' بمعنى space في السياق الرياضي، لكن بمعنى 'فضاء' العام لا الفضاء الخالي"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────

    - lemma: "فضاء صفري"
      decision: confirmed
      decision_reason: >
        المصطلح متّسق مع النمط الاصطلاحي الراسخ في المعاجم الرياضية العربية الموحدة
        التي تُترجم 'null' بـ'صفري' (مصفوفة صفرية، متجه صفري، دائرة صفرية، متتالية صفرية).
        كما أن 'صفر' في أصله اللغوي يدل على الخلو التام مما يُعزز الملاءمة الدلالية.
        اللمّة تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
        note: "لم يُوجد مدخل مباشر للمركب، لكن النمط الاصطلاحي الاستدلالي قوي"
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُستخدم في النصوص الرياضية الرسمية والطوبولوجيا التقنية استناداً إلى المصطلح
        الموحد للجامعة العربية. يُوازي 'null' بالمعنى الرياضي (العدم الكامل من نقاط)
        ويُبقي على الانتساب إلى منظومة المصطلحات الصفرية في الجبر والطوبولوجيا.
      morphological_check:
        pattern: "فَعَال + فَعِيل (فضاء + صفري)"
        fitness: "الوزن وصفي مناسب؛ 'صفري' صفة نسبية مشتقة على النحو الصحيح"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَضَاءٌ صِفْرِيٌّ"

    - lemma: "فضاء فارغ"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة لغوياً وتُعبّر عن 'empty space' بصورة حرفية مفهومة.
        أدلة المرحلة ٢ تكشف أن المعجم الرياضي الموحد يستخدم 'مجموعة خالية' (لا 'مجموعة
        فارغة') للتعبير عن كلٍّ من 'null set' و'empty set'، مما يُرجَّح معه أن يكون
        'فضاء خالٍ' أكثر اتساقاً مع هذا النمط. مع ذلك، 'فضاء فارغ' مستخدمة في
        الأدبيات الرياضية العربية وتُوازي 'empty space' في OEWN، فتُبقى مع
        إضافة صيغة 'فضاء خالٍ' بديلة أكثر اتساقاً مع المعجمية الرياضية.
      evidence_assessment:
        case: mixed
        note: "أدلة تدعم المفهوم لكن تُشير إلى أن 'خالٍ' أنسب من 'فارغ' في السياق الرياضي"
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُستخدم في السياقات التعليمية والتوصيفية حيث يُراد تقريب المفهوم للقارئ
        العام. يُوازي 'empty space' في الإنجليزية ويُبرز صفةَ الخلو المباشرة دون
        ربط بالمنظومة الجبرية لمصطلحات 'null'. أكثر وضوحاً للقارئ غير المتخصص.
      morphological_check:
        pattern: "فَعَال + فَاعِل (فضاء + فارغ)"
        fitness: "الوصف باسم الفاعل 'فارغ' صحيح صرفياً ومناسب للدلالة على الخلو الراهن"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَضَاءٌ فَارِغٌ"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "فَضَاءٌ خَالٍ"

    # ── مرشحات المرحلة ١ ────────────────────────────

    - lemma: "الفَضَاءُ الصِّفْرِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح يُمثّل الصيغة المُعرَّفة (بال-) للمصطلح نفسه الموجود أصلاً
        في المجموعة ('فضاء صفري'). تُفضَّل الصيغة النكرة في تسمية المصطلحات التقنية
        العربية، وإدراج الصيغتين معاً يُضيف تكراراً غير مُفيد. الموجود يكفي.
      evidence_assessment:
        case: no_material

    - lemma: "الخَلَاءُ الرِّيَاضِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم الأصالة اللغوية الكلاسيكية لـ'الخلاء' (المكان الذي لا شيء به)، إلا أن
        المصطلح لم يُوثَّق في أي معجم رياضي عربي معاصر بهذه الصيغة المركبة. كذلك يتعارض
        مع الاتساق الهرمي: الحد الأعلى (direct_hypernym) هو 'فضاء رياضي / فضاء طوبولوجي'،
        وإدخال 'الخلاء' يُخلّ بتوحيد المصطلح عبر الهرمية الطوبولوجية. فضلاً عن ذلك
        'الخلاء' له دلالات كونية/فيزيائية شائعة (outer space, vacuum) قد تُوقع لبساً.
      evidence_assessment:
        case: mixed

    - lemma: "الفَضَاءُ الفَارِغُ"
      source: stage1
      decision: removed
      decision_reason: >
        يُمثّل الصيغة المُعرَّفة للمصطلح الموجود 'فضاء فارغ'. الصيغة النكرة مُفضَّلة
        في تسمية المصطلحات. الموجود يكفي.
      evidence_assessment:
        case: no_material

    - lemma: "الفَرَاغُ الطُّوبُولُوجِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        'فضاء' هو المصطلح المعتمد للتعبير عن mathematical space في جميع المعاجم
        الرياضية العربية التي استُعلمت. 'فراغ' في الاستخدام الرياضي يُترجم أحياناً
        بـ'space' (عام)، لكنه لم يُعتمد مقابلاً لـ'topological space'. استخدام 'فراغ'
        بدلاً من 'فضاء' يُخالف التوحيد الاصطلاحي في الهرمية (hypernym: فضاء رياضي /
        فضاء طوبولوجي). المصطلح غير مسكوك في الأدبيات التقنية.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فضاء لا يحتوي على نقاط؛ وفضاء فارغ"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يخلط بين محتوى التعريف وإدراج اسم بديل: الشطر 'وفضاء فارغ'
        بعد الفاصلة المنقوطة ليس فصلاً نوعياً بل اسم لمّة مرادف مُقحم في نص التعريف.
        هذا يُخل ببنية التعريف المعجمي السليم (جنس قريب + فصل نوعي). علاوة على ذلك،
        لا يُحدد التعريف الإطار الرياضي (طوبولوجيا) مما يُوقع لبساً مع 'null space'
        في الجبر الخطي (فضاء النواة).
    authored:
      - type: terminological
        text: >
          فضاءٌ طوبولوجيٌّ لا يشتملُ على أيِّ نقطةٍ، وهو المجموعةُ الخاليةُ
          حين تُعتبرُ فضاءً طوبولوجياً؛ يُمثِّلُ أدنى عنصرٍ في التسلسلِ الهرميِّ
          للفضاءاتِ الطوبولوجية.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما خَلَا مِن النِّقاطِ مِن الفَضاءاتِ الرياضيَّة، فلا يُوجَدُ فيهِ عنصرٌ واحد."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
