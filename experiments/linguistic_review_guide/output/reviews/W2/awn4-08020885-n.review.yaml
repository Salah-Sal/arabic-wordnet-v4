# ── المرحلة ١: المراجعة والتوليد (عمياء) ────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('فضاء صفري' و'فضاء فارغ') خاليتان من التشكيل الكامل"
      - "التعريف العربي يحتوي على خلط بين محتوى التعريف وتسمية اللمّة البديلة: 'فضاء لا يحتوي على نقاط؛ وفضاء فارغ' — الشطر الثاني (وفضاء فارغ) ليس فصلاً نوعياً في التعريف بل اسم مرادف مُقحم في نص التعريف، مما يُخل ببنيته المنطقية"
      - "غياب التمييز الدلالي الصريح بين اللمّتين داخل المجموعة"
      - "المفهوم يشتبك مع 'null space' في الجبر الخطي (فضاء النواة/فضاء الصفر) وهو مفهوم مختلف؛ ينبغي أن يُوضّح التعريف الطابع الطوبولوجي"
    observations: >
      المجموعة تصف مفهوماً طوبولوجياً دقيقاً: الفضاء الذي لا يحتوي على أيِّ نقطة،
      وهو المجموعةُ الخاليةُ حين تُعدُّ فضاءً طوبولوجياً. اللمّتان
      'فضاء صفري' و'فضاء فارغ' تُعبّران عن المفهوم ذاته من زاويتين: الأولى تُنسب إلى
      الصفر (null) استناداً إلى نمط اصطلاحي راسخ في المعاجم الرياضية العربية
      (مصفوفة صفرية، متجه صفري، دائرة صفرية)، والثانية تصف الخلوَّ المباشر. المفهوم
      موجود في الأدبيات الرياضية العربية الحديثة دون استقرار كافٍ على مصطلح وحيد.
  blind_candidates:
    - lemma: "الفَضَاءُ الصِّفْرِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (wasfi) يستند إلى النمط الاصطلاحي المعتمد في المعاجم الرياضية العربية
        لتعريب 'null': مصفوفة صفرية (null matrix)، متجه صفري (null vector)، دائرة صفرية
        (null circle)، متتالية صفرية (null sequence). قياساً عليها: فضاء صفري (null space).
        'الصفر' في المقاييس له أصل ثانٍ هو 'الشيء الخالي' مما يُعزز الملاءمة الدلالية.
    - lemma: "الخَلَاءُ الرِّيَاضِيُّ"
      generation_method: majaz
      justification: >
        مجاز بإحياء لفظ كلاسيكي: 'الخَلَاء' في مقاييس اللغة لابن فارس هو 'المكان الذي
        لا شيء به'، وهو يُعبّر بدقة عن فضاء لا يحتوي على أي نقطة. يُضاف إليه 'الرياضي'
        للتخصيص وتجنب الاشتراك مع 'الخلاء' الكوني الفيزيائي. إحياء هذا اللفظ الميت
        يتجنب الاشتراك اللفظي مع 'فضاء' المستخدم على نطاق واسع.
    - lemma: "الفَضَاءُ الفَارِغُ"
      generation_method: tarkib
      justification: >
        تركيب وصفي مباشر: الفضاء + الفارغ (من جذر فرغ = خلو وسعة ذرع). يُعبّر عن
        'empty space' بصورة حرفية مفهومة ويوازي المصطلح الإنجليزي البديل في OEWN.
        جذر فرغ في المقاييس 'يدل على خلو وسعة ذرع' مما يُناسب الفضاء الخالي من النقاط.
    - lemma: "الفَرَاغُ الطُّوبُولُوجِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي يستخدم 'فراغ' (مصدر فَرَغَ = خلو) مضافاً إليه الوصف الطوبولوجي
        تخصيصاً للمجال العلمي. يُبرز الطابعَ الهندسيَّ للمفهوم ويُميّزه عن الخلو
        الفيزيائي. استخدام 'الفراغ' بدلاً من 'الفضاء' يُفرّق بين الفضاء ذي المحتوى
        والفضاء الخالي منه.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  queries_run:
    - pattern: "batch headword lookup (lemmas + candidates)"
      terms: ["فضاء صفري", "الفضاء الصفري", "فضاء فارغ", "الفضاء الفارغ",
              "خلا رياضي", "الخلا الرياضي", "فراغ طوبولوجي", "الفراغ الطوبولوجي",
              "فضاء لانقطي", "فراغ", "خلا", "الفراغ"]
      result: "لا مداخل مطابقة للمركبات المطلوبة بوصفها وحدات معجمية مستقلة"
    - pattern: "english bridge (Pattern ٧)"
      terms: ["null space", "empty space", "zero space", "null set", "void space"]
      result: "وُجدت مداخل ذات صلة في المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
    - pattern: "arabic FTS + domain filter (Math فضاء/خالي/فارغ/صفري)"
      terms: ["فضاء", "خالي", "فارغ", "صفري"]
      result: >
        وُجد طيف كامل من مداخل فضاء رياضي (40 مدخلاً في المعجم الرياضي الموحد):
        فضاء إقليدي، فضاء متجهات، فضاء متري، فضاء نظيم، نصف فضاء... إلخ.
        لا يوجد مدخل 'فضاء صفري' أو 'فضاء فارغ' أو 'فضاء خالٍ' في القائمة.
        الكشف الحاسم: 'مجموعة خالية' لها مدخلان (entry_id 415865 و 416870)
        بترجمتَيْ 'empty set' و'null set' على التوالي — المعجم يستخدم 'خالية'
        للتعبير عن كلا المفهومَيْن (empty + null) حين يتعلق الأمر بالمجموعات.
    - pattern: "maqayis al-lugha (dictionary_id=151)"
      terms: ["خلو", "صفر", "فرغ", "فضا"]
      result: "وُجدت اقتباسات لكل الجذور"

  per_lemma:

    - lemma: "فضاء صفري"
      expands:
        - text: "«صفر — مصفوفة صفرية: null matrix»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM"
          addition: "يُثبت أن 'صفري' هو المقابل المعتمد في المعجم الرياضي الموحد لكلمة 'null' في الإطار الرياضي"
        - text: "«متجه صفري: null vector»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM"
          addition: "يُرسّخ النمط الاشتقاقي: X صفري = null X في المصطلح الرياضي العربي"
        - text: "«دائرة صفرية: null circle»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM"
          addition: "يُؤكد النمط للأشكال الهندسية الصفرية"
        - text: "«متتالية صفرية: null sequence»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM"
          addition: "يُعمّم النمط ليشمل المتواليات والفضاءات"
        - text: "«صَفَرَ — الأصل الثاني: الشيء الخالي، يقال هو صفر»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يكشف أن 'صفر' في أصله اللغوي يدل على الخلو والفراغ، لا على الرقم فحسب، مما يُعزز ملاءمته للفضاء الخالي من النقاط"

    - lemma: "فضاء فارغ"
      expands:
        - text: "«فراغ: space (رياضيات)»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM"
          addition: "يُثبت توظيف 'فراغ' بمعنى space في السياق الرياضي"
        - text: "«مجموعة خالية: empty set» (entry_id: 415865) و «مجموعة خالية: null set» (entry_id: 416870)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM"
