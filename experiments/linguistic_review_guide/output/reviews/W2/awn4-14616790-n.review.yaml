stage1_review:
  assessment:
    concerns:
      - اللمات الموجودة صحيحة ولكنها تحتاج لضبط كامل وتوسيع لتشمل المفرد التقني.
    observations: "المجموعة تغطي مفهوم (Plastic). اللمات الحالية هي (بلاستيك) وهو تعريب مقبول وشائع، و(لدائن) وهو المصطلح العربي العلمي المقابل. المفهوم واضح دلالياً."
  blind_candidates:
    - lemma: "لَدَائِن"
      generation_method: ishtiqaq
      justification: "الجمع العربي الفصيح لـ (لدينة)، وهو المصطلح المعياري للمواد البلاستيكية في المعاجم الحديثة (الوسيط، مختار عمر)."
    - lemma: "بِلَاسْتِيك"
      generation_method: taarib
      justification: "اللفظ المعرب العالمي الأكثر شيوعاً وتداولاً في الصناعة والحياة اليومية."
    - lemma: "لَدِينَة"
      generation_method: ishtiqaq
      justification: "المفرد التقني للفظ لدائن، ويُستخدم للدلالة على المادة الواحدة القابلة للتشكل."
    - lemma: "مَوَادّ لَدِنَة"
      generation_method: tarkib
      justification: "تعبير وصفي يصف طبيعة هذه المواد القابلة للتشكل واللينة في أصل اشتقاقها."

stage2_evidence:
  per_lemma:
    - lemma: "بلاستيك"
      confirm:
        - text: "«بلاستيك [مفرد]: (كم) مادّة لدائنيّة (مرنة) عضويّة الأصل أو مركّبة، يمكن سبكها تحت تأثير الحرارة أو الضَّغط، تقبل التَّشكيل، وتصنع منها أدواتٌ مختلفة.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«بلاستيك: مادة صلبة عضوية مكثفة (بوليمر) يتم إنتاجها صناعيا أو بشكل شبه صناعي...»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«بلاستيك: مركبات غير معدنية متفاعلة... يستعمل مصبوبا على شكل أجسام جامدة أو مرنة، أو أفلام أو خيوط...»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
    - lemma: "لدائن"
      confirm:
        - text: "«(اللدينة) مَادَّة مرنة تقبل التشكل (مج)(ج) لدائن»"
          source: "المعجم الوسيط"
        - text: "«لدينة [مفرد]: ج لَدَائِنُ: (كم) مادَّة عضويَّة تقبل التَّشكُّل بالحرارة والضَّغط.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "لدينة"
      confirm:
        - text: "«(اللَّدِينَةُ): مادة مَرِنة تقبل التشكُل»"
          source: "المعجم الوسيط"
    - lemma: "مادة لدنة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "بلاستيك"
      decision: confirmed
      decision_reason: "مصطلح معرب ذو شيوع عالمي ومستقر في الاستعمال العربي الحديث علمياً وصناعياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِلَاسْتِيك"
    - lemma: "لدائن"
      decision: confirmed
      decision_reason: "المصطلح العربي الفصيح المعتمد في المجامع العلمية، وهو جمع لدينة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَدَائِن"
    - lemma: "لَدِينَة"
      source: stage1
      decision: confirmed
      decision_reason: "المفرد التقني لمصطلح لدائن، وهو ضروري لاكتمال المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "لَدِينَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَوَادّ لَدِنَة"
      decision: removed
      decision_reason: "تعبير وصفي عام، والمصطلح التقني (لدائن) أو (بلاستيك) يغني عنه."

stage4_content:
  definition:
    current: "اسم عام لمواد اصطناعية أو شبه اصطناعية معينة يمكن تشكيلها في قوالب أو سحبها لتكوين أجسام أو أغشية أو خيوط"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكنه يحتاج لضبط الصياغة لتكون أكثر دقة علمية واصطلاحية."
    authored:
      - type: terminological
        text: "لَفْظٌ جَامِعٌ لِمَجْمُوعَةٍ مِنَ المَوَادِّ العُضْوِيَّةِ الاصْطِنَاعِيَّةِ أَوْ شِبْهِ الاصْطِنَاعِيَّةِ الَّتِي تَقْبَلُ التَّشَكُّلَ بِالحَرَارَةِ أَوِ الضَّغْطِ، وَتُصْنَعُ مِنْهَا أَدَوَاتٌ وَأَجْسَامٌ وَأَغْشِيَةٌ مُخْتَلِفَةٌ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "لَفْظٌ جَامِعٌ لِمَجْمُوعَةٍ مِنَ المَوَادِّ العُضْوِيَّةِ الاصْطِنَاعِيَّةِ أَوْ شِبْهِ الاصْطِنَاعِيَّةِ الَّتِي تَقْبَلُ التَّشَكُّلَ بِالحَرَارَةِ أَوِ الضَّغْطِ، وَتُصْنَعُ مِنْهَا أَدَوَاتٌ وَأَجْسَامٌ وَأَغْشِيَةٌ مُخْتَلِفَةٌ."}
  examples:
    per_lemma:
      - lemma: "بِلَاسْتِيك"
        examples:
          - text: "تُسْتَخْدَمُ الأَوَانِي الـبِلَاسْتِيكِيَّةُ عَلَى نِطَاقٍ وَاسِعٍ فِي التَّغْلِيفِ وَالحِفْظِ."
            type: usage
      - lemma: "لَدَائِن"
        examples:
          - text: "تَمْتَازُ اللَّدَائِنُ بِخِفَّةِ وَزْنِهَا وَقَابِلِيَّتِهَا العَالِيَةِ لِلتَّشْكِيلِ الصِّنَاعِيِّ."
            type: usage
      - lemma: "لَدِينَة"
        examples:
          - text: "تُعَدُّ هَذِهِ المَادَّةُ لَدِينَةً صَلْبَةً تَتَحَمَّلُ دَرَجَاتِ الحَرَارَةِ العَالِيَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "صُنِعَتْ قَوَارِيرُ المِيَاهِ مِنْ مَوَادَّ بِلَاسْتِيكِيَّةٍ قَابِلَةٍ لِلتَّدْوِيرِ."}

stage5_enrichment:
  per_entry:
    - lemma: "لَدَائِن"
      entry_id: "{auto}"
      root: "لدن"
      maqayis_quote: "«اللَّامُ وَالدَّالُ وَالنُّونُ كَلِمَةٌ وَاحِدَةٌ. يُقَالُ لِلَّيِّنِ مِنَ الْقُضْبَانِ لَدْنٌ. وَلَدُنْ بِمَعْنَى لَدَى، أَيْ عِنْدَ.»"
    - lemma: "لَدِينَة"
      entry_id: "{auto}"
      root: "لدن"
      maqayis_quote: "«اللَّامُ وَالدَّالُ وَالنُّونُ كَلِمَةٌ وَاحِدَةٌ. يُقَالُ لِلَّيِّنِ مِنَ الْقُضْبَانِ لَدْنٌ. وَلَدُنْ بِمَعْنَى لَدَى، أَيْ عِنْدَ.»"
    - lemma: "بِلَاسْتِيك"
      entry_id: "{auto}"
  per_sense:
    - lemma: "بِلَاسْتِيك"
      sense_id: "{auto}"
      nuance: "المصطلح المعرب الأكثر شيوعاً وتداولاً في الحياة اليومية."
      mwe: false
    - lemma: "لَدَائِن"
      sense_id: "{auto}"
      nuance: "المصطلح العربي العلمي الرسمي، ويُستخدم غالباً في السياقات التقنية والصناعية للدلالة على فئة المواد."
      mwe: false
