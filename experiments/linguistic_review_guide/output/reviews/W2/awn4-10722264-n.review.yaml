# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-10722264-n
# a person who inspires fear or dread — شخص يثير الخوف أو الفزع
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بَاعِث لِلرُّعْب» تعبير وصفي حر وليس وحدة معجمية ثابتة؛ يمكن إبدال مكوّناته (مثير للرعب، باعث للفزع) فيفقد صفة المصطلحية"
      - "المجموعة تضمّ لمّتين فقط وإحداهما مركّب وصفي غير مسكوك، فتحتاج إلى إثراء بألفاظ مفردة مرادفة"
    observations: "المفهوم (شخص يبعث الخوف في الناس) مفهوم أصيل في العربية ذو جذور متعددة: رعب، خوف، رهب، هول، فزع. العربية غنية بالمشتقات الدالة على من يُخيف: مُرْعِب، مُخِيف، رَهِيب، مَهُول. التعريف الحالي واضح ومختصر. اسم الفاعل من أَرْعَب (مُرْعِب) أجازه مجمع اللغة المصري رغم أن الفصيح القديم هو راعِب من الثلاثي."
  blind_candidates:
    - lemma: "مُخِيف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أخافَ يُخيفُ على وزن مُفْعِل، ومعناه الذي يُوقع الخوف في غيره. أجازه مجمع اللغة المصري، ومستعمل في الفصحى المعاصرة بكثرة"
    - lemma: "رَهِيب"
      generation_method: ishtiqaq
      justification: "فَعِيل بمعنى مَفْعول من رَهِبَ، أي مَرْهوب. ورد في شعر أبي ذؤيب الهذلي، وأجاز المجمع استعماله لكثرة نظائره في العربية"
    - lemma: "مَهُول"
      generation_method: ishtiqaq
      justification: "اسم مفعول من هالَ يَهُولُ على وزن مَفْعُول، بمعنى الذي يُهال ويُفزع منه. ذكره اللسان والتاج وأجازه بعض اللغويين المحدَثين"
    - lemma: "وَبَال"
      generation_method: majaz
      justification: "أصل المعنى الشدة والثقل وسوء العاقبة، يُستعمل مجازاً لمن يكون مصدر شدة وخوف على غيره، كقولهم: فلان وبال على قومه"

stage2_evidence:
  per_lemma:
    - lemma: "بَاعِث لِلرُّعْب"
      expands:
        - text: "«بَاعِث: من (ب ع ث) المرسل ومن يحمل غيره على فعل الشيء والموقظ غيره من نومه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "باعث اسم فاعل عام بمعنى المُرسِل والمُحرِّك، وليس مخصصاً لإثارة الرعب"
        - text: "«الباعث: اسم من أسماء الله تعالى»"
          source: "المعجم الوسيط"
          addition: "الاستعمال المعجمي لـ«الباعث» مقصور على الاسم الإلهي، لا على الشخص المُخيف"

    - lemma: "مُرْعِب"
      confirm:
        - text: "«مُرْعِب: من (ر ع ب) المخوف المفزع، والمقطع.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«مُرْعِب — الصواب والرتبة: أَمْرٌ مُرْعِب [صحيحة] — أَمْرٌ راعِب [فصيحة مهملة]. التعليق: يمكن تصحيح الاستعمال المرفوض اعتمادًا على إجازة مجمع اللغة المصري ما شاع استعماله من الأفعال الثلاثية المزيدة بالهمزة أفعل»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«الرُّعْبُ: الخوف. تقول منه: رَعَبْتُهُ فهو مرعوبٌ، إذا أفزعته، ولا تقل أرعبته»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          addition: "الجوهري يرفض أرعب ويقصر الفعل على الثلاثي رَعَب، لكن المجمع أجاز الرباعي"

    - lemma: "مُخِيف"
      confirm:
        - text: "«مُخِيف: من (خ و ف) المفزع المرعب.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«مُخِيف — الصواب والرتبة: طريق مَخُوف [فصيحة] — طريق مُخِيف [صحيحة]. التعليق: يمكن تصحيح الاستعمال المرفوض اعتمادًا على إجازة مجمع اللغة المصري»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«المَخِيفُ: مَوْضِعُ الخَوْفِ, كالمَخافِ. الأَسَدُ. من الطُّرُقِ ونَحْوِها: المَخُوفُ. ثَغْرٌ مَخِيفٌ: مُتَخَوَّفٌ.»"
          source: "المعجم الكبير"
          addition: "المعجم الكبير يفرّق بين المَخِيف (بفتح الميم) وهو اسم مكان، والمُخِيف (بضم الميم) وهو اسم فاعل"

    - lemma: "رَهِيب"
      confirm:
        - text: "«رَهِيب — الصواب والرتبة: هذا قائد مَرْهُوب [فصيحة] — هذا قائد رهيب [صحيحة]. التعليق: أجاز النحاة تحويل فعيل عن مفعول إما على أنه قياسي، وإما على أنه غالب كثير، وقد أجاز مجمع اللغة المصري استعمال هذه الكلمة لكثرة نظائرها، ولورودها في شعر لأبي ذؤيب الهذلي.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"

    - lemma: "مَهُول"
      confirm:
        - text: "«مَهُول — الصواب والرتبة: كان زلزالاً مَهُولاً [فصيحة] — كان زلزالاً هائلاً [فصيحة]. التعليق: ورد الفعل هال في المعاجم لازمًا؛ وبذا يكون الوصف منه بصيغة اسم الفاعل، ويمكن تصويب المثال المرفوض باعتباره اسم مفعول من الفعل المتعدي هال الذي ورد متعديًا بنفسه في بعض المعاجم القديمة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: "«ونسبه ابن جني (أي: مَهُول) إلى لغة العامة، فقال: والعامة تقول أمر مَهُول»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (نقلاً عن التاج)"
          conflict: "ابن جني نسب مهولاً إلى العامة، وإن أجازه بعض المحدَثين"

    - lemma: "وَبَال"
      contradicts:
        - text: "«الوَبَالُ: الفساد والشِّدَّة والثِّقَلُ وسوءُ العاقبة»"
          source: "المعجم الوسيط"
          conflict: "الوبال يدل على سوء العاقبة والثقل، لا على شخص يُثير الخوف تحديداً"
      expands:
        - text: "«(وَبَلَ) الْوَاوُ وَالْبَاءُ وَاللَّامُ: أَصْلٌ يَدُلُّ عَلَى شِدَّةٍ فِي شَيْءٍ وَتَجَمُّعٍ. وَالْوَبِيلُ: الرَّجُلُ الثَّقِيلُ فِي أَمْرٍ يَتَوَلَّاهُ لَا يُصْلِحُهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يذكر الوبيل للرجل الثقيل، لكنه ثقل في الإدارة لا في إثارة الخوف"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "بَاعِث لِلرُّعْب"
      decision: removed
      decision_reason: "تعبير وصفي حر يفشل في اختبار السكّ: يمكن إبدال «باعث» بـ«مثير» أو «مولّد»، وإبدال «الرعب» بـ«الفزع» أو «الخوف»، فيبقى التعبير صالحاً كوصف. ليس وحدة معجمية ثابتة مسجّلة في المعاجم"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُرْعِب"
      decision: confirmed
      decision_reason: "اسم فاعل من أرعب مؤيَّد بموسوعة السلطان قابوس (المخوف المفزع) ومعجم الصواب اللغوي الذي صحّحه اعتماداً على إجازة مجمع اللغة المصري. شائع في الاستعمال المعاصر"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل للشخص الذي يُوقع الرعب والذعر الشديد في النفوس؛ أقوى دلالةً من مُخِيف وأشدّ وقعاً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرْعِب"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُخِيف"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من أخاف، أجازه مجمع اللغة المصري، وورد في موسوعة السلطان قابوس بمعنى «المفزع المرعب». مُثبت في المعجم الكبير والوسيط. شائع جداً في الفصحى المعاصرة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ من مُرْعِب وأخفّ درجةً؛ يدل على إثارة الخوف عموماً لا الرعب الشديد بالضرورة"
      actions:
        - command: create_entry
          params: {lemma: "مُخِيف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "رَهِيب"
      source: stage1
      decision: confirmed
      decision_reason: "فعيل بمعنى مفعول من رَهِبَ، ورد في شعر أبي ذؤيب الهذلي، وأجاز مجمع اللغة المصري استعماله لكثرة نظائره. يُستعمل للشخص الذي يُرهَب ويُخشى جانبه"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على الهيبة والخشية المصحوبة بالتعظيم أو الإجلال؛ أقرب إلى المهابة منه إلى الفزع المحض"
      actions:
        - command: create_entry
          params: {lemma: "رَهِيب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَهُول"
      source: stage1
      decision: removed
      decision_reason: "نسبه ابن جني إلى لغة العامة، وهو عند أكثر المعجميين خاص بالأمور والأحداث (زلزال مهول، مشهد مهول) لا بالأشخاص، فلا يناسب المجموعة التي تنصّ على «شخص»"
      evidence_assessment:
        case: mixed

    - lemma: "وَبَال"
      source: stage1
      decision: removed
      decision_reason: "دلالته المعجمية على الشدة والثقل وسوء العاقبة، ولا يدل على شخص يُثير الخوف تحديداً. الوبيل عند ابن فارس هو الرجل الثقيل في أمر يتولاه لا يصلحه، وهو بعيد عن مفهوم المجموعة"
      evidence_assessment:
        case: contradicts_only

