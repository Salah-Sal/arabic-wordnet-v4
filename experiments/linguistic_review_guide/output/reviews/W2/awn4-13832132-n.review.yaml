# ══════════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13832132-n  |  ILI: i109477  |  POS: n
# detail / particular / item — جزء صغير يمكن النظر فيه بشكل منفصل عن الكل
# ══════════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────────
stage1_review:

  # أ. توليد اللمّات المرشحة (من الملف المُقنَّع، قبل الاطلاع على اللمّات الموجودة)
  blind_candidates:
    - lemma: "جُزْئِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر (جزأ) على وزن المصدر الصناعي (فُعْلِيَّة)، وهي تدل على
        كون الشيء جزءاً خاصاً مفرداً ضمن كلٍّ أوسع، وهو المعنى الجوهري للسينست.
        الوزن الصناعي مناسب لتحويل المفهوم المجرد إلى اسم دال على الخاصية.

    - lemma: "تَفْصِيلَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر (فصل) على وزن (تَفْعِيلَة)، والوزن منتج في العربية لدلالة
        الوحدة الواحدة من الجنس (كتَفْعِيلَة في العروض). تدل على الوحدة التفصيلية
        الواحدة التي يمكن فصلها عن مجموعها، وهو جانب التمييز والإفراد في التعريف.

    - lemma: "مُفْرَدَة"
      generation_method: majaz
      justification: >
        من (أفرد)، أي ما أُفرد وعُزل عن غيره؛ إزاحة دلالية من معنى الإفراد
        (جعل الشيء فرداً مستقلاً) إلى مدلول الجزء المستقل الذي يمكن النظر فيه
        وحده. المجاز وظيفي إذ يشترك المعنيان في الاستقلالية والانفصال عن الكل.

    - lemma: "فِقْرَة"
      generation_method: majaz
      justification: >
        أصل المعنى في الفقرة هو فقار العمود الفقري (وحدة عظمية مستقلة تؤلّف مع
        أخواتها بنية كاملة)، ومنه استُعير لأجود بيت في القصيدة ثم لجملة مختارة
        من كلام. الإزاحة الدلالية تعتمد المشابهة الوظيفية: الجزء المستقل القابل
        للتمييز داخل الكل.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمة (تفصيل) واردة بدون تشكيل في السينست — يلزم إضافة التشكيل الكامل."
      - "اللمة (جزئية) واردة بدون تشكيل — يلزم تشكيلها (جُزْئِيَّة)."
      - >
        (تفصيل) مصدر دالّ بالأصل على العملية لا على الحاصل؛ استعماله اسماً
        للجزء الواحد استعمالٌ ثانوي (جزء من كل) يحتاج إلى شاهد توثيقي
        صريح لهذا المعنى الحاصلي.
      - >
        المرشح الأعمى (جُزْئِيَّة) يتطابق مع اللمة الثانية الموجودة في السينست،
        مما يؤكد صواب اللمة الحالية.
    observations: >
      المجموعة الترادفية تقابل ثلاثة ألفاظ إنجليزية: detail / particular / item.
      الألفاظ العربية الحاضرة (تفصيل، جزئية) تغطي بصورة معقولة المعنيين الأول
      والثاني. تفصيل يُمثّل البُعد التحليلي التوضيحي للجزء، وجزئية تُمثّل
      البُعد المنطقي الفلسفي (الخاص في مقابل الكلي). لا يوجد مقابل مباشر
      لـ item بمعناه الإجرائي التقني (بند/مادة/عنصر)، غير أن السينست يعرّف
      المفهوم بصورة عامة كافية لتشمل الاستخدامَين. التعريف العربي الحالي
      مقبول لكن يستعمل "بشكل" العامية؛ يُستحسن تنقيحه.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────────
stage2_evidence:

  # ── ملاحظة الاستعلامات المُنفَّذة ──
  # Q1 — مطابقة دفعية: تفصيل/التفصيل، جزئية/الجزئية، تفصيلة/التفصيلة،
  #       مفردة/المفردة، فقرة/الفقرة  (1 استعلام)
  # Q2 — الجسر الإنجليزي: detail / particular / item  (1 استعلام)
  # Q3 — FTS عربي: "تفصيل" OR "جزئية" OR "تفاصيل" OR "جزئيات"  (1 استعلام)
  # Q4 — مقاييس اللغة: dictionary_id=151، فصل + جزأ  (1 استعلام)
  # Q5 — إثراء: examples + definitions بالـ entry_id  (1 استعلام)
  # المجموع: 5 استعلامات ✓

  per_lemma:

    # ── اللمة الموجودة: تفصيل ──
    - lemma: "تفصيل"
      confirm:
        - text: >
            «(1) جزء من كلّ. مثل: (ب) نقطة تفصيلية — Don't omit a single detail.
            (ج) جزء ثانوي من آلة أو من مبنى أو من لوحة»
          source: "المورد الحديث (2008)"
        - text: "لوحة ما"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          # translation_en: "detail"
      expands:
        - text: >
            «التّفصيل: هو مقابل الإجمال كما مرّ، وتفصيل المفصَّل وتفصيل
            المركَّب سيجيء في لفظ المغالطة. والمفصَّل يطلق أيضاً على نوع من
            السور القرآنية.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
          addition: >
            يوضح أن التفصيل يقابل الإجمال في الاصطلاح العلمي؛ والمعنى محوري
            في دلالة "البيان الجزئي" لكنه عملية لا حاصل.
        - text: "«التفصيل: جمع الشيء فصولاً متمايزة، ومنه المفصَّل سُمّي به لكثرة فصوله»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: "يكشف عن أصل المعنى الصرفي: الجمع في فصول متمايزة."
        - text: "«التفصيل: هو مقابل الإجمال.»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
          addition: "يؤكد الدلالة الاصطلاحية العلمية الراسخة."

    # ── اللمة الموجودة: جزئية ──
    - lemma: "جزئية"
      confirm:
        - text: "«من الكلام أو الموضوع: جانبٌ منه»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «تفصيل، جُزْئية: عناصر وجُزئيات تُعدّ غير ذات فائدة، لكنها تقود
            في الرواية والوصف إلى كشف حبكة الرواية البوليسية وتُغني السرد.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "sector 1"
          source: "مسرد الفن، التسلية والرياضة — ARABTERM"
          conflict: >
            الترجمة الإنجليزية (sector 1) لا تتوافق مع دلالة السينست (جزء صغير
            يُعالَج باستقلالية)، وتبدو خطأً تصنيفياً في قاعدة ARABTERM.
      expands:
        - text: >
            «الجزئية بالضم عند الحكماء والمنطقيين يطلق على معانٍ. الأول: كون
            المفهوم بحيث يمنع نفسُ تصوُّره من وقوع الشركة في ذلك المفهوم ويسمّى
            ذلك المفهوم جزئياً حقيقياً [...] والثاني: كون المفهوم مندرجاً تحت
            كلّي ويسمّى ذلك المفهوم جزئياً إضافياً.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
          addition: >
            يكشف عن الثراء الفلسفي للفظة وتعدد مستوياتها الاصطلاحية، ويُقرّب
            المعنى الثاني (الجزئي الإضافي = المندرج تحت الكلي) من دلالة السينست.
        - text: >
            «الجُزْئِيَّة: من الكلام أو الموضوع جانبٌ منه. القضية الجزئية
            (في علم المنطق): هي القضية التي يكون الحكم فيها على بعض أفراد
            الموضوع. المحكمة الجُزئية: المستوى الأول في الترتيب الثلاثي للمحاكم.»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "يُبيّن التوسع الدلالي للكلمة في حقول متعددة (منطق، قانون)."

    # ── مرشح المرحلة ١: جُزْئِيَّة (مطابق للمة الموجودة) ──
    - lemma: "جُزْئِيَّة"
      source: stage1
      confirm:
        - text: "«من الكلام أو الموضوع: جانبٌ منه»"
          source: "المعجم الكبير (مجمع اللغة العربية)"

    # ── مرشح المرحلة ١: تَفْصِيلَة ──
    - lemma: "تَفْصِيلَة"
      source: stage1
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١: مُفْرَدَة ──
    - lemma: "مُفْرَدَة"
      source: stage1
      confirm:
        - text: >
            «(1) مادة؛ بَنْد؛ مُفْرَدة. (ب) موضوع
            (2) نبأ قصير column of local items»
          source: "المورد الحديث (2008)"
          # (ترجمة: item)
      expands:
        - text: >
            «بند، مفردة» [مقابل للـ item في سياقات التربية والتقنية]
          source: "مسرد التربية — ARABTERM"
          addition: "يُثبت استخدام مُفردة مرادفاً لـ item في السياقات التقنية المتخصصة."

    # ── مرشح المرحلة ١: فِقْرَة ──
    - lemma: "فِقْرَة"
      source: stage1
      contradicts:
        - text: >
            «الفقرة: جملة من كلام أو جزء من موضوع أو شطر من بيت شعر؛ معنى
            مستقل مما تشتمل عليه المادة في القانون»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            الاستخدام المعاصر الراسخ لـ(فقرة) ينصبّ على الوحدة النصية (paragraph)
            ولا يعمّم على كل جزء صغير من أي كل؛ الدلالة أضيق من المطلوب.
        - text: "vertebra / paragraph"
          source: "معجمَي ARABTERM للعلوم الطبية واللسانيات"
          conflict: >
            المصطلح رُسّخ في الاستعمال التقني لدلالتين متخصصتين (فقرة الظهر،
            والفقرة النصية)، مما يُفقده القدرة على حمل الدلالة العامة للسينست.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:

    # ── تفصيل (موجودة) ──
    - lemma: "تفصيل"
      decision: confirmed
      decision_reason: >
        ثابت في المعاجم الحديثة والتقنية بمعنى "جزء من كل / نقطة تفصيلية"
        (المورد الحديث، ARABTERM)، ومعروف في الاستعمال الحي (التفاصيل). صحيح
        أنه مصدر في أصله، لكن العربية تُجري المصادر مُجرى الأسماء وتجمعها
        (تفاصيل)، وهذا الجمع التكسيري شائع جداً في العربية المعاصرة بما يُرسّخ
        الاسمية. يلزم تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphological_check: >
        مصدر فعّل (فَعَّلَ → تَفْعِيل)، الجذر فصل، الوزن تَفْعِيل. الجمع تَفَاصِيل
        على وزن تَفَاعِيل — شائع ومقيس.
      nuance_differentiation: >
        يُبرز الجانب التوضيحي والتحليلي في الجزء؛ يُستخدم حين يكون الجزء عنصراً
        شارحاً أو موضّحاً ضمن سياق أوسع (تفاصيل الخطة / تفاصيل الحادثة)، ويحمل
        ضمناً دلالة الإيضاح في مقابل الإجمال.
      borrowing_check:
        type: native_ishtiqaq
        verdict: مشتق عربي أصيل
      quality_gate:
        regular_fusha: true
        ease_of_use: true
        fit: true
        prefers_heritage: true
        prefers_arabic: true
        derivability: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفْصِيل"

    # ── جزئية (موجودة) ──
    - lemma: "جزئية"
      decision: confirmed
      decision_reason: >
        موثقة في المعجم الكبير ومعجم الوسيط ومعجم التهانوي، وتحمل المعنى الجوهري
        للسينست ("جانب من الكلام أو الموضوع") بصورة مباشرة. المعنى المنطقي
        (الجزئي الإضافي = المندرج تحت الكلي) يتوافق تماماً مع التعريف الهرمي في
        علم المعجم الحاسوبي (hyponym). تحتاج إلى تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphological_check: >
        مصدر صناعي: جُزْء → جُزْئِيَّة (فُعْلِيَّة). الجذر جزأ، الوزن صناعي
        قياسي. الجمع: جُزْئِيَّات (مقيس).
      nuance_differentiation: >
        تُركّز على الطابع الفردي والخصوصي للجزء؛ تُستخدم حين يُنظر إلى الجزء
        باعتباره وحدةً معزولة من كليّ أشمل (جزئيات القضية / جزئيات المسألة)،
        وتحمل دلالة المنطق والفلسفة في التمييز بين الكلي والخاص.
      borrowing_check:
        type: native_ishtiqaq
        verdict: مشتق عربي أصيل
      quality_gate:
        regular_fusha: true
        ease_of_use: true
        fit: true
        prefers_heritage: true
        prefers_arabic: true
        derivability: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُزْئِيَّة"

    # ── جُزْئِيَّة (مرشح ١ = مطابق للمة الموجودة) ──
    - lemma: "جُزْئِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المرشح متطابق مع اللمة الموجودة (جزئية) في السينست؛ التوليد الأعمى
        أكّد صواب اللمة الحالية ذاتها، لذا لا حاجة لإجراء إضافي.

    # ── تَفْصِيلَة (مرشح ٢) ──
    - lemma: "تَفْصِيلَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر لها على شاهد معجمي في قاعدة البيانات المتكاملة، وتفصيل بجمعه
        (تفاصيل) يكفي عن صيغة المرة المشتقة من الجذر نفسه. إضافتها ستُدخل
        لمةً غير مُثبتة في الاستعمال.

    # ── مُفْرَدَة (مرشح ٣) ──
    - lemma: "مُفْرَدَة"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال المعجمي يحصرها في السياق التقني الضيّق (بند الاختبار في
        التربية، مفردة البيانات في المعلوماتية)، ولا تعمل مقابلاً طبيعياً
        للمفهوم العام "جزء صغير يمكن النظر فيه بشكل منفصل". يُضاف إلى ذلك
        شيوعها بمعنى "مفردة لغوية" (vocabulary item) الذي يُلقي بظلاله
        ويُضيّق دلالتها.

    # ── فِقْرَة (مرشح ٤) ──
    - lemma: "فِقْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال المعاصر الراسخ يُخصّصها بالفقرة النصية (paragraph) والفقرة
        الفقرية (vertebra)؛ وهي في كلا الحالين تُحيل على نوع محدد من الأجزاء
        لا على الجزء الصغير المطلق. تحميلها معنى السينست العام سيُفضي إلى
        اشتراك لفظي ضار.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────────
stage4_content:

  definition:
    current: "جزء صغير يمكن النظر فيه بشكل منفصل عن الكل"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه لكن يستعمل "بشكل" وهي صياغة عامية/دارجة
        لا تناسب مستوى المعجم الفصيح. كذلك تفتقر العبارة إلى الجنس القريب
        الاصطلاحي الدقيق، وتصف الجزء بأنه "صغير" دون إيضاح طبيعة هذه
        الصغر النسبية.
    authored:
      - type: terminological
        text: >
          جُزءٌ مُفردٌ من أجزاء الشيء، يمكن تَناوُلُه أو دِراسَتُه على نحوٍ
          مستقلٍّ عن سياقه الكلّي
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          كل ما انفصل عن الكلّ وأمكن إفراده بالنظر والدراسة، وجمعه: جُزئيات
          وتفاصيل
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13832132-n"
          definition_index: 0
          text: "جُزءٌ مُفردٌ من أجزاء الشيء، يمكن تَناوُلُه أو دِراسَتُه على نحوٍ مستقلٍّ عن سياقه الكلّي"
      - command: add_definition
        params:
          synset_id: "awn4-13832132-n"
          text: "كل ما انفصل عن الكلّ وأمكن إفراده بالنظر والدراسة، وجمعه: جُزئيات وتفاصيل"

  examples:
    per_lemma:
      - lemma: "تَفْصِيل"
        examples:
          - text: "أغفل التقريرُ كثيراً من التفاصيل الجوهرية التي كانت ستُغيِّر مسارَ القضية."
            type: usage
      - lemma: "جُزْئِيَّة"
        examples:
          - text: "لا ينبغي أن تُغيَّر السياسةُ العامة بسبب جُزئيةٍ إجرائية طارئة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أغفل التقريرُ كثيراً من التفاصيل الجوهرية التي كانت ستُغيِّر مسارَ القضية."
