# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:

  # التقييم الأولي (بعد قراءة synset_info الكامل)
  assessment:
    concerns:
      - "اللمّة الوحيدة (انعكاسية) مكتوبة بدون تشكيل كامل"
      - "المجموعة تحتوي لمّةً واحدة فقط، وهو عدد شحيح لمفهوم رياضي-منطقي أساسي"
      - "التعريف الحالي يُعرّف الانعكاسيةَ بوصفها «علاقة» لا «خاصيّة علاقة»، مما يُحدث التباساً مع مجموعة reflexive_relation"
      - "اللمّة انعكاسية مُشتركة صوتياً بين معنيين تقنيين مختلفين: الانعكاسية الرياضية-المنطقية (reflexivity) والانعكاسية الفيزيائية (reflectance/reflectivity) — هذا التشارك يستحق توثيقاً صريحاً"
    observations: >
      المفهوم رياضي-منطقي أساسي يُعرَّف بأن العلاقة R على مجموعة A تُسمى انعكاسية
      إذا كان لكل عنصر أ في A: أ R أ. الجذر العربي (عكس) مناسب دلالياً إذ يعني
      «ردّ الشيء على نفسه»، وقد رسخ المصطلح في المعاجم العربية التقنية. التحدي
      الرئيسي هو الاشتراك اللفظي مع المعنى الفيزيائي (نسبة الإشعاع المنعكس).

  # التوليد الأعمى (من الملف المُقنَّع — بدون رؤية اللمّات الموجودة)
  blind_candidates:
    - lemma: "انْعِكَاسِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر ع-ك-س على وزن افتعالية. العَكْس في أصله هو «ردّ آخر الشيء
        على أوله» (ابن فارس)، وهذا يُشبه وظيفياً الانعكاسية: العلاقة «تعود» على
        العنصر نفسه. المصطلح مألوف في المعاجم التقنية ولو بمعانٍ متعددة.

    - lemma: "ذَاتِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من «ذات» على وزن فَعَلِيَّة (المصدر الصناعي)، تعبّر عن خاصية
        ارتباط كل شيء بنفسه/ذاته. العلاقة الانعكاسية هي بالضبط علاقة كل عنصر
        بذاته.

    - lemma: "رُجُوعِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من رجع على وزن فُعُولِيَّة. العلاقة الانعكاسية «ترجع» إلى نفس
        العنصر الابتدائي، فكأنها تؤدي عملية «رجوع». الجذر ر-ج-ع له أصل صحيح في
        معنى العودة إلى نقطة البداية.

    - lemma: "ارْتِدَادِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر ر-د-د على وزن افتعالية. الارتداد = الرجوع إلى نقطة الانطلاق،
        وهذا يُشابه المعنى الرياضي: كل عنصر «يرتدّ» إلى نفسه عبر العلاقة. الجذر
        قوي ومُنتج في العربية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:

  # ملاحظة الاستعلامات المُنفَّذة:
  # Q1 — مطابقة دفعية للمّات الأصلية + المرشحات (انعكاسية، ذاتية، رجوعية، ارتدادية، عودية)
  # Q2 — الجسر الإنجليزي: reflexivity / reflexiveness / reflexive / reflexive relation
  # Q3 — FTS عربي: انعكاسية / الانعكاسية / انعكاسي
  # Q4 — مقاييس اللغة: جذر عكس (dictionary_id=151)
  # المجموع: 4 استعلامات

  per_lemma:

    # ─── اللمّة الأصلية ───
    - lemma: "انعكاسية"
      confirm:
        - text: >
            «خاصية تعادلية المجموعة التي تعد مساوية لنفسها نحو: أ=أ.»
            [translation_en: Reflexivity]
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — entry_id: 497177"
        - text: >
            «خاصية انعكاسية» [translation_en: reflexivity]
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — entry_id: 417416"
        - text: >
            «علاقة انعكاسية» [translation_en: reflexive relation]
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — entry_id: 417415"
      contradicts:
        - text: >
            «نسبة الطاقة الإشعاعية المنعكسة عن جسم ما، إلى الطاقة الساقطة على هذا الجسم.»
            [translation_en: reflectance]
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004) — entry_id: 466927"
          conflict: >
            هذا المعنى فيزيائي (نسبة إشعاع منعكس) ولا صلة له بالمعنى الرياضي-المنطقي.
            الاشتراك اللفظي قائم ويستوجب ضبط السياق في التعريف.
        - text: >
            «خاصة لمادة ذات سطح عاكِس.» [translation_en: reflectivity]
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004) — entry_id: 466932"
          conflict: >
            معنى فيزيائي (خاصية السطوح العاكسة للضوء)، مغاير للمعنى المنطقي المقصود.
        - text: >
            «[translation_en: reversibility]»
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — entry_id: 423975"
          conflict: >
            هنا المصطلح يُترجم «قابلية الانعكاس/الرجوعية» وليس الانعكاسية الرياضية.
      expands:
        - text: >
            «(1) الانعكاسيّة («فز» و«بص»).» ويُذكر في سياق مقياس الانعكاسيّة.
          source: "المورد الحديث (2008) — entry_id: 712529، 712535، 712536"
          addition: >
            المورد الحديث يُقيّد الانعكاسية بالفيزياء والبصريات فقط، ولا يذكر المعنى
            المنطقي-الرياضي، مما يدل على ضرورة التوثيق الصريح للمعنى الرياضي في AWN4.

    # ─── مرشحات المرحلة ١ ───
    - lemma: "ذَاتِيَّة"
      contradicts:
        - text: >
            «[translation_en: subjectivity]»
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — entry_id: 489010"
          conflict: >
            «ذاتية» راسخة في المعاجم العربية بمعنى الذاتية (subjectivity) لا الانعكاسية
            (reflexivity). استخدامها بديلاً يُوقع في لبس مصطلحي خطير.
        - text: >
            «[translation_en: identity]» (domain: Pharmacy)
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — entry_id: 464108"
          conflict: >
            حتى في الصيدلة تُستعمل للتطابق (identity) لا للانعكاسية الرياضية.

    - lemma: "رُجُوعِيَّة"
      contradicts:
        - text: >
            «كمية طاقة التشوه المرن المخزّنة في وحدة الحجم من الجسم المرن»
            [translation_en: resilience]
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — entry_id: 351129"
          conflict: >
            «رجوعية» راسخة بمعنى resilience (المرونة الهندسية) لا reflexivity.
        - text: >
            «الدرجة التي عندها يرتد نظام إلى، أو يسترجع حالته الأصلية، أو يتعافى من
            تأثير سلبي لمحفز.» [translation_en: resilience]
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — entry_id: 359703"
          conflict: >
            المعنى بيئي-هندسي (المرونة أمام التغيير) وليس رياضياً منطقياً.

    - lemma: "ارْتِدَادِيَّة"
      evidence_status: "no_material_found"

    - lemma: "عَوْدِيَّة"
      contradicts:
        - text: >
            «إمكانُ استدعاءِ مَسَاقٍ نفسَه. تَسمحُ العوديَّةُ بتحقيق بعض الخوارزميات
            بِمَسَاقات صغيرة وبسيطة...» [translation_en: recursion]
          source: "معجم مصطلحات المعلوماتية (2000) — entry_id: 532136"
          conflict: >
            «عودية» راسخة بمعنى recursion (التعاود) في علوم الحاسوب. استخدامها
            للانعكاسية الرياضية سيُحدث تداخلاً مصطلحياً خطيراً.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ─── اللمّة الأصلية ───
    - lemma: "انعكاسية"
      decision: confirmed
      decision_reason: >
        المصطلح موثّق صراحةً بالمعنى الرياضي-المنطقي في المعجم الموحد لمصطلحات
        اللسانيات (2002) بالترجمة Reflexivity وتعريف «خاصية تعادلية المجموعة التي تعد
        مساوية لنفسها نحو: أ=أ.»، وفي المعجم الموحد للرياضيات والفلك (1990) بعنوان
        «خاصية انعكاسية». الجذر (عكس) يناسب الدلالة: العكس هو ردّ الشيء على نفسه.
        الاشتراك اللفظي مع المعنى الفيزيائي قائم لكن السياق الرياضي يزيله؛ المصطلح
        مقبول مع ضرورة التعريف الدقيق.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphological_check: >
        الوزن «انفعالية» (مصدر صناعي من المصدر انفعال) مناسب تماماً لخاصية مجردة في
        الرياضيات؛ الوزن منتج ومطّرد (كالانتقالية، والتناظرية، والتكافؤية).
      term_quality_gate:
        ittiraad: "مطّرد — قياسي على وزن المصادر الصناعية لخصائص العلاقات الرياضية"
        yusr: "سهل النطق والكتابة، يقبل الإعراب والنسبة والجمع (انعكاسيات)"
        mulaama: "مناسب للحقل المنطقي-الرياضي، الجذر يحمل دلالة العودة على النفس"
        iithar_turathi: "الجذر عكس عريق في التراث العربي"
        iithar_arabi: "عربي الجذر والوزن — أفضل من أي تعريب"
        ishtiqaqiyya: "مُشتق اشتقاقاً واضحاً قابلاً للتصريف"
      nuance_differentiation: >
        انعكاسية تُعبّر عن خاصيةٍ تربط كل عنصر بنفسه (أ=أ)، وتتمايز عن:
        تناظرية/تماثلية (التي تربط أ بب وب بأ)، وعن انتقالية (أ~ب و ب~ج تستلزم أ~ج)،
        وعن توافقية/تكافؤية (الجامعة للثلاث خصائص).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْعِكَاسِيَّة"

    # ─── مرشحات المرحلة ١ ───
    - lemma: "انْعِكَاسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو ذات اللمّة الأصلية الموجودة في المجموعة — تقاطع التوليد الأعمى
        مع اللمّة القائمة، مما يُؤكد صحة الاختيار الأصلي. لا حاجة لإجراء إضافي.

    - lemma: "ذَاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        راسخة في المعاجم العربية التقنية بمعنى «الذاتية» (subjectivity) في الفلسفة
        والإعلام، وبمعنى «التطابق» (identity) في الصيدلة. استخدامها للانعكاسية
        الرياضية سيُوقع في لبس مصطلحي خطير، ويخالف مبدأ يُسر التداول.

    - lemma: "رُجُوعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        راسخة في المعاجم العربية التقنية بمعنى «المرونة» (resilience) في الهندسة
        المدنية والبيئة. التزاحم مع هذا المعنى الراسخ يجعلها غير صالحة للانعكاسية
        الرياضية.

    - lemma: "ارْتِدَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر عليها في قاعدة البيانات المعجمية، وإن كان الجذر صحيحاً دلالياً.
        غياب التوثيق المعجمي يجعلها غير راسخة، والانعكاسية الموجودة أفضل منها توثيقاً
        وشيوعاً في المعاجم العربية التقنية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "(المنطق والرياضيات) علاقة تكون قائمة بين العنصر ونفسه"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يُعرّف الانعكاسيةَ (وهي خاصيّة) بوصفها «علاقةً»، مما يخلط
        بين المفهوم (الخاصية) وحاملته (العلاقة ذات الخاصية). كما أن عبارة «بين العنصر
        ونفسه» تحتاج تقييداً (كل عنصر في المجموعة). والتعريف يفتقر إلى الجنس القريب
        الصريح (خاصية علاقة) والفصل النوعي الكافي.
    authored:
      - type: terminological
        text: >
          خاصِيَّةٌ من خصائص العلاقات الرياضية تقضي بأن كل عنصر في مجموعة ما يرتبط
          بنفسه؛ فالعلاقة R على المجموعة A انعكاسيةٌ إذا كان لكل أ في A: أ R أ،
          كعلاقة المساواة (أ = أ) وعلاقة «أصغر من أو يساوي» (أ ≤ أ).
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          وصفٌ للعلاقة التي تصدق بين كل شيء وذاته، ومنه يقال: المساواةُ علاقة انعكاسية
          لأن كل عدد مساوٍ لنفسه.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
