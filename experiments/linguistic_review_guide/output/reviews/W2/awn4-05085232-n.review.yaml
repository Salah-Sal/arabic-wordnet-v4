          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "خاصية التواجد في المركز"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً، ويفضل صياغته بأسلوب معجمي يجمع بين المعنى المكاني والخاصية المجردة."
    authored:
      - type: linguistic
        text: "صِفَةُ مَا هُوَ مَرْكَزيّ، وَهِي كَوْنُ الشَّيْءِ فِي الوَسَطِ أَوْ المَرْكزِ، أَوْ نُزُوعُهُ نَحْوَ الاسْتِقْرارِ فِيهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "مَرْكَزِيَّة"
        examples:
          - text: "تُعدّ المركزية الجغرافية للمدينة عاملاً حاسماً في نموّها التجاري."
            type: usage
      - lemma: "تَمَرْكُز"
        examples:
          - text: "أدّى تمركز الصناعات في المدن الكبرى إلى زيادة الهجرة الريفية."
            type: usage
      - lemma: "تَمَرْكُزِيَّة"
        examples:
          - text: "تتميز هذه الشبكة بتمركزية عالية تجعل جميع البيانات تمرّ عبر نقطة واحدة."
            type: usage
      - lemma: "تَوَسُّط"
        examples:
          - text: "يُفضّل هذا الموقع لتوسطه بين مراكز التوزيع الرئيسية."
            type: usage

