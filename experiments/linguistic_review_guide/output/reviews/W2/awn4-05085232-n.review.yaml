stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (تمركز، مركزية) جيّدة، ولكن قد نحتاج إلى لمّات أدقّ للتعبير عن صفة المركزية كخاصية مكانية بحتة."
    observations: "المجموعة تعبّر عن خاصية 'المركزية' (Centrality). اللمّات الحالية تدور حول الجذر (ر ك ز)، وهو الجذر المعياري لهذا المفهوم في العربية المعاصرة."
  blind_candidates:
    - lemma: "مَرْكَزِيَّة"
      generation_method: ishtiqaq
      justification: "الاسم المجرد (المصدر الصناعي) من 'مركز'، وهو المقابل المباشر لـ Centrality."
    - lemma: "تَمَرْكُز"
      generation_method: ishtiqaq
      justification: "المصدر من 'تمركز'، ويعبر عن حالة الاستقرار في المركز."
    - lemma: "تَمَرْكُزِيَّة"
      generation_method: ishtiqaq
      justification: "النزوع أو الخاصية الكامنة في الشيء للبقاء أو التواجد في المركز."
    - lemma: "تَوَسُّط"
      generation_method: ishtiqaq
      justification: "خاصية الوقوع في الوسط، وهو مرادف مكاني لـ 'مركزية' في سياقات معينة."

stage2_evidence:
  per_lemma:
    - lemma: "مَرْكَزِيَّة"
      confirm:
        - text: "«(المركزية) نظام يقضي بتبعية البلاد لمركز رئيس واحد... مركزية الإنسان (في الفلسفة): كل نظرية تجعل الإنسان مركزا للعالم.»"
          source: "المعجم الكبير"
        - text: "«مركزية (Centrality) - المجموع الموحد لمصطلحات النقل»"
          source: "ArabTerm"
      expands:
        - text: "«نظام حيث يتركز صنع القرار في أعلى الهيكل التنظيمي.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "توسيع الدلالة إلى الجانب الإداري/التنظيمي."
    - lemma: "تَمَرْكُز"
      confirm:
        - text: "«تمركز (Concentration/Centralization) - مسرد علم الاجتماع»"
          source: "ArabTerm"
      expands:
        - text: "«تَمَرْكَزَ: استقر في المركز.»"
          source: "معجم الصواب اللغوي"
          addition: "تأكيد الفعل الذي يشتق منه المصدر."
    - lemma: "تَمَرْكُزِيَّة"
      confirm:
        - text: "«تمركزية (Centrality) - مسرد الجغرافيا والتاريخ»"
          source: "ArabTerm"
        - text: "«التَّمَرْكُزية: نزوعٌ إلى البقاء في المَرْكز.»"
          source: "المورد الحديث"
    - lemma: "تَوَسُّط"
      confirm:
        - text: "«التوسُّط؛ المَرْكَزانيّة: كون الشيء في الوسط أو المَرْكز.»"
          source: "المورد الحديث"
      expands:
        - text: "«توسط الشيء صار في وسطه.»"
          source: "المعجم الوسيط"
          addition: "تأكيد الدلالة المكانية."

