    - lemma: "تَوَسُّط"
      source: stage1
      decision: confirmed
      decision_reason: "يعبّر عن الجانب الهندسي والمكاني الصرف لكون الشيء في المركز أو الوسط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
