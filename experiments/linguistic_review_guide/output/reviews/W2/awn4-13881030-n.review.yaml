# مراجعة المجموعة الترادفية — awn4-13881030-n
# inverse / opposite — شيء معكوس في التسلسل أو الطابع أو التأثير
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي دائري: يستخدم «معكوس» لتعريف مجموعة لمّتها الوحيدة «مَعْكُوس»"
      - "المجموعة تحتوي على لمّة واحدة فقط رغم أنّ المفهوم له ألفاظ عربية متعددة"
      - "اللمّة الإنجليزية الثانية opposite أعمّ دلالياً من inverse، مما قد يسبب التباساً في نطاق المجموعة"
    observations: "المجموعة تمثّل مفهوم الشيء المعكوس أو المقلوب في ترتيبه أو طبيعته أو أثره، وهي منحدرة من مجموعة التضادّ والتعارض. المفهوم راسخ في العربية وله جذر غني (ع ك س) أنتج اشتقاقات كثيرة. اللمّة الحالية اسم مفعول مستعمل استعمال الاسم، وهو صحيح لغوياً لكنّه يحتاج إلى تعزيز بألفاظ أخرى تغطي الاستعمال المصطلحي الرياضي والمنطقي."
  blind_candidates:
    - lemma: "عَكْس"
      generation_method: ishtiqaq
      justification: "مصدر الفعل عَكَسَ على وزن فَعْل، يدلّ على ردّ آخر الشيء على أوّله. مستعمل اسمياً بمعنى النقيض الترتيبي أو المقلوب، شائع في الرياضيات والمنطق"
    - lemma: "نَقِيض"
      generation_method: ishtiqaq
      justification: "من جذر ن-ق-ض على وزن فَعِيل بمعنى المفعول، يدلّ على ما يناقض الشيء ويرفعه. مستعمل في المنطق والفقه للدلالة على القضية المقابلة"
    - lemma: "مُقَابِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من قابَلَ على وزن مُفَاعِل، يدلّ على ما يواجه الشيء ويضادّه. مستعمل في الرياضيات بمعنى opposite"
    - lemma: "ضِدّ"
      generation_method: ishtiqaq
      justification: "من جذر ض-د-د، يدلّ على المخالف والمنافي. مستعمل في الفلسفة والمنطق للدلالة على المقابل"

stage2_evidence:
  per_lemma:
    - lemma: "مَعْكُوس"
      confirm:
        - text: "«معكوس — reflected»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«مَعْكُوس — revertant»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(1) معكوس (2) عكسيّ؛ معاكس (3) مقلوب رأسًا على عقب (4) عَكْس؛ ضدّ (5) انقلاب؛ ارتكاس — inverse»"
          source: "المورد الحديث (2008)"
        - text: "«فيديو معكوس — inverse video»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«شكل معكوس — inverse figure»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      expands:
        - text: "«كَلَامٌ مَعْكُوسٌ مَقْلُوبٌ غَيْرُ مُسْتَقِيمٍ فِي التَّرْتِيبِ أَوْ فِي الْمَعْنَى»"
          source: "المصباح المنير للفيّومي"
          addition: "يبيّن أنّ المعكوس يشمل القلب في الترتيب والمعنى معاً"
        - text: "«جاوَزْتُها بأَمُنٍ ذاتِ مَعْجَمَةٍ تَنْجُو بكَلْكَلِها والرأْسُ مَعْكُوسُ»"
          source: "لسان العرب لابن منظور (شاهد شعري للمتلمّس)"
          addition: "شاهد شعري قديم يؤكد استعمال معكوس بمعنى المردود على أوّله"

    - lemma: "عَكْس"
      confirm:
        - text: "«العَكْسُ: ردّك آخر الشيء على أوّله»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«العَكْسُ رَدُّكَ الشَّيْءُ إلى أَوَّلِهِ»"
          source: "مختار الصحاح للرازي"
        - text: "«العكس: رد الشيء إلى سننه أي طريقه الأول»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العَكْسُ: قَلْبُ الكلامِ ونحوِهِ، ورَدُّ آخِرِ الشيءِ إلى أولِهِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«عكس — inverse»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«العكْس: المَقْتُ... (فى المنطق): تبديلٌ فى طرفى القضية لتنشأ قضية أخرى مساوية للأولى فى الصدق»"
          source: "المعجم الوسيط"
      expands:
        - text: "«العكس: في اللغة: عبارة عن رد الشيء إلى سننه... وفي عرف الأصوليين: انتفاء الحكم لانتفاء العلة. وفي عرف الفقهاء: تعليق نقيض الحكم المذكور بنقيض علته المذكورة ردا إلى أصل آخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يبيّن تعدد الاستعمالات الاصطلاحية للعكس في الفقه والأصول والمنطق"

    - lemma: "نَقِيض"
      confirm:
        - text: "«نقيض كل شيء: رفع تلك القضية، فإذا قلنا: كل إنسان حيوان بالضرورة، فنقيضها: أنه ليس كذلك»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«النَّقيض: نقيض كل شيء رفعُه، والنقيضان الأمران المتمانعان بالذات بحيث لا يمكن اجتماعهما بوجه كالإيجاب والسَّلب»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "النقيض في الاصطلاح مخصوص بالتناقض المنطقي (الإيجاب والسلب) لا مطلق العكس أو الانقلاب"
      expands:
        - text: "«النُّونُ وَالْقَافُ وَالضَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نَكْثِ شَيْءٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ أصلاً على النكث والحلّ لا على مجرّد القلب"

    - lemma: "مُقَابِل"
      confirm:
        - text: "«مقابل — opposite»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      contradicts:
        - text: "«(1) مواجِه؛ مقابل... (6) الضِّدّ؛ النقيض»"
          source: "المورد الحديث (2008)"
          conflict: "مقابل يفيد المواجهة المكانية أولاً، والمعنى الضدّي ثانوي فيه"

    - lemma: "ضِدّ"
      confirm:
        - text: "«الضِّدّ: المُخالِفُ والمُنافسُ. كلُّ شيءٍ خالفَ شيئًا ليغْلِبَهُ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الضِّدُّ، بالكسر، والضَّديدُ: المِثْلُ، والمُخالِفُ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الضدّ من ألفاظ الأضداد يدلّ على المثل والمخالف معاً، وهو أعمّ من مفهوم العكس الترتيبي"
        - text: "«كل شيء ضاد شيئا ليغلبه الشيء المقابل لغيره كالسواد للبياض»"
          source: "كتاب العين"
          conflict: "الضدّ يدلّ على التقابل النوعي (كالسواد والبياض) لا على الانعكاس الترتيبي الذي تمثّله المجموعة"

stage3_analysis:
  per_lemma:
    - lemma: "مَعْكُوس"
      decision: confirmed
      decision_reason: "اسم مفعول من عَكَسَ مستعمل استعمال الاسم بمعنى الشيء المقلوب في ترتيبه. ثابت في المعاجم التراثية (المصباح المنير، لسان العرب) وفي المعاجم الاصطلاحية الحديثة (الفيزياء، الطب، المعلوماتية). يطابق التعريف الإنجليزي something inverted تطابقاً دقيقاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الشيء الذي وقع عليه فعل العكس — أي الكيان المعكوس بوصفه نتيجة، بخلاف عَكْس الذي يدلّ على المفهوم المجرّد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْكُوس"

    - lemma: "عَكْس"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر عَكَسَ مستعمل اسمياً بمعنى المقلوب أو النقيض الترتيبي. شائع جداً في الاستعمال المعاصر والاصطلاحي (بالعكس، عكس ضربي، عكس النقيض). ثابت في جميع المعاجم التراثية الكبرى من العين إلى التاج. المعجم الموحد للرياضيات يترجم inverse بـ«عكس» مباشرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المفهوم المجرّد للانعكاس والتقابل الترتيبي — أي العكس بوصفه علاقة أو كياناً مجرّداً، بخلاف مَعْكُوس الذي يدلّ على الشيء الواقع عليه فعل العكس"
      actions:
        - command: create_entry
          params:
            lemma: "عَكْس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نَقِيض"
      source: stage1
      decision: removed
      decision_reason: "النقيض في الاصطلاح العربي مخصوص بالتناقض المنطقي (تمانع الإيجاب والسلب) لا بمطلق العكس أو الانقلاب الترتيبي. جذره (ن ق ض) يدلّ على النكث والحلّ لا على القلب. إضافته ستخلط بين مفهومي العكس (inversion) والتناقض (contradiction)."

    - lemma: "مُقَابِل"
      source: stage1
      decision: removed
      decision_reason: "مُقَابِل يفيد أساساً المواجهة المكانية أو التناظر (facing, counterpart)، ودلالته على الضدّية ثانوية. استعماله في الرياضيات (opposite side/angle) مختلف عن مفهوم العكس الترتيبي. إضافته ستوسّع نطاق المجموعة بلا مسوّغ."

    - lemma: "ضِدّ"
      source: stage1
      decision: removed
      decision_reason: "الضدّ أعمّ من العكس إذ يدلّ على مطلق المخالفة والمنافاة (كالسواد والبياض)، وهو من ألفاظ الأضداد. والأهمّ أنّ المجموعة الأعلى (hypernym) تحمل لمّة تَضَادّ، فإضافة ضِدّ هنا ستخلط بين المستويين الدلالي والتصنيفي."

