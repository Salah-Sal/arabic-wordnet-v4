# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-05099897-n (exceedance)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تجاوز» بدون تشكيل — يجب إضافة التشكيل الكامل: تَجَاوُز"
      - "اللمّة مسجّلة كاسم (n) لكنّ المعاجم الكلاسيكية تعرّفها فعلاً (تَجَاوَزَ) — المصدر المؤوَّل بمعنى الحدث مقبول في الاصطلاح الحديث"
      - "المجموعة تحوي لمّة واحدة فقط — فقر ترادفي"
    observations: >
      المفهوم المقصود هو «التجاوز» بالمعنى الاحتمالي الزلزالي: احتمال أن يتخطّى مستوى حركة الأرض عتبةً مرجعيّة.
      هذا مصطلح تخصّصي دقيق في هندسة الزلازل، يُترجَم عادةً بـ exceedance.
      المصدر «تَجَاوُز» على وزن تَفَاعُل من الجذر «جوز» يدلّ على المجاوزة والعبور والتخطّي،
      وهو شائع في المعاجم المصطلحية العربية الحديثة بمعنى overshoot / excess / transgression.
      المركّب «احتمالية التجاوز» مسجّل في معجم الطاقة المتجددة بمعنى exceedance probability وهو أقرب إلى مفهوم المجموعة لكنّه يعبّر عن الاحتمالية لا عن فعل التجاوز ذاته.
  blind_candidates:
    - lemma: "تَجَاوُز"
      generation_method: ishtiqaq
      justification: "مصدر تَفَاعُل من الجذر «جوز» يدلّ على تخطّي الحدّ، شائع في المصطلحية العلمية العربية بمعنى exceeding/overshoot"
    - lemma: "مُجَاوَزَة"
      generation_method: ishtiqaq
      justification: "مصدر مُفَاعَلَة من «جاوَزَ»، يفيد الخروج عن الحدّ كما في تعريف المناوي، ويناسب دلالة الحدث"
    - lemma: "تَخَطٍّ"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من «خطو» بمعنى تجاوز الشيء وتعدّيه، مستعمل في الفصحى بمعنى surpassing"
    - lemma: "اسْتِزَادَة"
      generation_method: ishtiqaq
      justification: "مصدر اسْتِفْعَالَة من «زيد» يدلّ على طلب الزيادة وتخطّي المقدار المحدّد"

stage2_evidence:
  per_lemma:
    - lemma: "تَجَاوُز"
      confirm:
        - text: "«overlap; transgression»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«overlap; transgression»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«excess»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«المقدار الذي تتجاوز به قيمة قياس القيمة المنتظرة. من حيث الاستدامة، غالبا ما يكون التجاوز قيمة متغير (مثل قياس الأثر البيئي) تجاوز ما هو مقصود أو ما يعتبر صحيا أو مقبولا.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«احتمال تجاوز قيمة مُعينة لإنتاج الطاقة.» [احتمالية التجاوز = exceedance probability]"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«(تجَاوز) عَن الشَّيْء أغضى وَعَن الرجل عَفا وَيُقَال تجَاوز عَن الذَّنب لم يُؤَاخذ بِهِ وَفِي الشَّيْء أفرط والموضع جازه»"
          source: "المعجم الوسيط"
          addition: "يبيّن الاستعمال الكلاسيكي للفعل: الإفراط في الشيء وتعدّي الموضع"
        - text: "«عن الشيءِ: أغْضَى عنه ... المَوْضِعَ: جازَه وتَعَدَّاه ... الشيءَ إلى غيرِه: أجازَه إليه»"
          source: "المعجم الكبير"
          addition: "يوسّع الدلالة الأصلية: التعدّي والمجاوزة من موضع إلى آخر"
        - text: "«حالة تُلاحظ عندما ترتفع القيمة الحقيقية مُتجّهةً صوب قيمة ضبط الوضع، ثم تجتازُها لفترةٍ قصيرة الأجل.» [overshoot]"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          addition: "يضيف الدلالة الاصطلاحية الهندسية: تخطّي القيمة المرجعية وهو أقرب للمفهوم الزلزالي"
        - text: "«ارتفاع في مستوى سطح البحر بالنسبة إلى مستوى اليابسة.» [transgression]"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يبيّن الاستعمال الجيولوجي: تخطّي مستوى مرجعي (سطح البحر مقابل اليابسة)"
    - lemma: "مُجَاوَزَة"
      confirm:
        - text: "«المجاوزة: الخروج عن الحد من إحدى الجهات، ذكره الحرالي. وقال مرة: المجاوزة مفاعلة من الجواز وهو العبور من عدوة دنيا إلى عدوة قصوى.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«overtaking»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "مسجّلة في المصطلحية الحديثة لكن بمعنى التخطّي المروري لا الاحتمالي"
    - lemma: "تَخَطٍّ"
      contradicts:
        - text: "«فلانٌ إلى الشَّىءِ: تَجاوَزَه ... فلانًا أو الشىءَ: تَجاوَزَه ... تَخَطَّى رِقابَ النَّاسِ: ركِبَهم وجاوَزَهم»"
          source: "المعجم الكبير"
          conflict: "الفعل تَخَطَّى يدلّ على تجاوز مادّي (مشي فوق) لا على تخطّي حدّ كمّي، ولم يُسجَّل المصدر «تَخَطٍّ» كمصطلح تقني"
    - lemma: "اسْتِزَادَة"
      contradicts:
        - text: "«auxoaction»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المصطلح مسجّل بمعنى طبّي مختلف تماماً (تأثير تنشيطي)، ولا علاقة له بتجاوز عتبة زلزالية"

stage3_analysis:
  per_lemma:
    - lemma: "تَجَاوُز"
      decision: confirmed
      decision_reason: >
        المصدر «تَجَاوُز» مسجّل في المعجم الموحد لمصطلحات الجيولوجيا (2000)
        ومعجم علوم الزلازل (1999) بترجمة overlap/transgression،
        وفي معجم البيئة بمعنى overshoot (تخطّي القيمة المرجعية).
        كما أنّ المركّب «احتمالية التجاوز» = exceedance probability مسجّل في معجم الطاقة المتجددة.
        المصطلح مطّرد اشتقاقياً (تَفَاعُل من جوز)، شائع في الاستعمال العلمي العربي، ويقبل الإضافة والوصف.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجَاوُز"

    - lemma: "مُجَاوَزَة"
      source: stage1
      decision: removed
      decision_reason: >
        «المجاوزة» مسجّلة كلاسيكياً بمعنى الخروج عن الحدّ (المناوي) وحديثاً بمعنى overtaking (النفط).
        لكنّها لم تُستعمَل في سياق الاحتمال الزلزالي، ووزن مُفَاعَلَة يحمل دلالة التفاعل بين طرفين
        وهو ما لا ينطبق على المفهوم هنا. يكفي «تَجَاوُز» وحده.

    - lemma: "تَخَطٍّ"
      source: stage1
      decision: removed
      decision_reason: >
        «تَخَطٍّ» مصدر تَفَعُّل من خطو، دلالته الأساسية المشي فوق الشيء وتجاوزه مادّياً.
        لم يُسجَّل كمصطلح تقني في أيّ معجم اصطلاحي جيولوجي أو زلزالي.

    - lemma: "اسْتِزَادَة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح مسجّل في المعجم الطبي الموحد بمعنى auxoaction وهو بعيد كلّياً عن دلالة التجاوز الزلزالي.
        لا شواهد تدعم استعماله في هذا الحقل.

stage4_content:
  definition:
    current: "(جيولوجيا) احتمال أن يولد زلزال مستوى من حركة الأرض يتجاوز مستوى مرجعياً محدداً خلال وقت تعرض معين"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للإنجليزية. العبارة «يولد مستوى من حركة الأرض»
        ليست مألوفة عربياً؛ والأَوْلى «يُحدِث حركةً أرضيةً» أو «يُنشئ اهتزازاً».
        كما أنّ «وقت تعرض» أصحّ بصيغة «مدّة تعرُّض».
    authored:
      - type: terminological
        text: "(جيولوجيا) احتمالُ أن تتخطّى حركةُ الأرض الناجمة عن زلزالٍ حدّاً مرجعيّاً مُعيَّناً خلال مدّة تعرُّض محدّدة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "(جيولوجيا) مقياسٌ احتماليّ يُعبِّر عن إمكانيّة أن يُحدِث زلزالٌ اهتزازاً أرضيّاً يفوق مستوًى مرجعيّاً محدّداً في غضون فترة رصد معيّنة، ويُستخدم في تقدير المخاطر الزلزاليّة وتصميم المنشآت المقاوِمة للزلازل"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "(جيولوجيا) احتمالُ أن تتخطّى حركةُ الأرض الناجمة عن زلزالٍ حدّاً مرجعيّاً مُعيَّناً خلال مدّة تعرُّض محدّدة"

  examples:
    per_lemma:
      - lemma: "تَجَاوُز"
        examples:
          - text: "تُقدَّر خرائطُ الخطر الزلزاليّ بناءً على احتمال التَّجَاوُز بنسبة عشرة بالمئة خلال خمسين سنة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُقدَّر خرائطُ الخطر الزلزاليّ بناءً على احتمال التَّجَاوُز بنسبة عشرة بالمئة خلال خمسين سنة."

