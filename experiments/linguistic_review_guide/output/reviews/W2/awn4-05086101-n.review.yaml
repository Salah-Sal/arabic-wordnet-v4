stage1_review:
  assessment:
    concerns:
      - "اللفظ 'دَاخِلِيَّة' يغلب عليه في الاستعمال المعاصر الدلالة على المؤسسة الأمنية (وزارة الداخلية)، مما قد يسبب التباساً في سياقات معينة، إلا أنه يظل صحيحاً لغوياً كاسم مجرد."
      - "اللفظ 'بَاطِنِيَّة' يرتبط في التراث الكلامي والفلسفي بفرق دينية معينة، لكنه في الفلسفة وعلم النفس يدل على الجانب الداخلي من الوجود."
    observations: "المجموعة تغطي المفهوم في مستوياته الثلاثة: العام (داخلية)، والفلسفي الروحي (جوانية)، والاصطلاحي المعرفي (باطنية). المفهوم يعبر عن 'الكيونة الداخلية' في مقابل 'الظاهرية'."
  blind_candidates:
    - lemma: "بَاطِنِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'باطن'، يعبر عن حالة أو صفة ما هو مستور أو داخل."
    - lemma: "جَوَّانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'جواني' (المنسوب إلى جو الشيء أي داخله)، وهو مصطلح فلسفي شهير للتعبير عن النزعة الباطنية."
    - lemma: "دَاخِلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'داخل'، وهو التعبير المباشر عن حالة الوجود في الداخل."
    - lemma: "اسْتِبْطَانِيَّة"
      generation_method: ishtiqaq
      justification: "من 'استبطن' الشيء أي دخل فيه أو عرف باطنه، وتستخدم في علم النفس للدلالة على تأمل الذات من الداخل."

stage2_evidence:
  per_lemma:
    - lemma: "بَاطِنِيَّة"
      confirm:
        - text: "«تُحيل على داخل في مواجهة الخارج، وتشير إلى تعليم موجه إلى المبتدئين والمريدين؛ أي إلى خاصة الخاصة في الصوفية وهو مذهب تقيّة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«فرقة من الشِّيعَة تعتقد أَن للشريعة ظَاهرا وَبَاطنا وتمعن فِي التَّأْوِيل»"
          source: "المعجم الوسيط"
          addition: "تشير إلى الجانب العقدي المرتبط بالمفهوم."
    - lemma: "جَوَّانِيَّة"
      confirm:
        - text: "«تَفَلْسُفُ مفتوحٌ على النَّفْس والدُّنيا... رؤية روحية»"
          source: "المعجم الكبير"
        - text: "«إنَّ لكُلِّ امْرئ جَوَّانِيًّا وبَرَّانِيًّا... أَيْ بَاطِنًا وَظَاهِرًا، وسِرًّا وعلاَنِيَة، وَهُوَ منْسُوب إِلَى جَوِّ الْبَيْت وَهُوَ دَاخِلُه»"
          source: "النهاية في غريب الحديث والأثر"
    - lemma: "دَاخِلِيَّة"
      confirm:
        - text: "«الداخلية: الصفة أو المادة الداخلية became aware of the inwardness of my body.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«وزارة الداخلية: وزارة تشرف على شؤون الأمن في البلاد»"
          source: "المعجم الكبير"
          conflict: "دلالة مؤسسية إدارية وليست دلالة على الصفة الوجودية."
    - lemma: "اسْتِبْطَانِيَّة"
      confirm:
        - text: "«الاستبطانيّة: استغراق المرء في حياته العقليّة أو الروحيّة.»"
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "بَاطِنِيَّة"
      decision: confirmed
      decision_reason: "مصطلح معجمي وفلسفي أصيل يدل على العمق والداخل في مقابل الظاهر، رغم استخدامه الطائفي إلا أنه يظل صالحاً للمفهوم العام."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَاطِنِيَّة"
    - lemma: "جَوَّانِيَّة"
      decision: confirmed
      decision_reason: "من أدق الألفاظ العربية المعاصرة للتعبير عن 'inwardness'، ولها جذور في الحديث النبوي الشريف وتراث الفلسفة المعاصرة (عثمان أمين)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَوَّانِيَّة"
    - lemma: "دَاخِلِيَّة"
      decision: confirmed
      decision_reason: "الاشتقاق المباشر والأكثر شيوعاً للمفهوم، ورغم تداخله مع معانٍ أخرى يظل ركناً في المجموعة الترادفية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَاخِلِيَّة"
    - lemma: "اسْتِبْطَانِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تضيف بعداً نفسياً وعقلياً للمفهوم، وهي مستخدمة في المعاجم الحديثة كمقابل لـ inwardness."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اسْتِبْطَانِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "صفة أو حالة الوجود في الداخل أو الباطن"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية بسيطة؛ يفضل تعريفه بأسلوب المعاجم العربية مع بيان المقابل الدلالي."
    authored:
      - type: terminological
        text: "كَوْنُ الشَّيْءِ دَاخِلِيًّا أَوْ بَاطِنِيًّا، وَهِيَ الصِّفَةُ الَّتِي تَقُومُ فِي عُمْقِ الذَّاتِ أَوْ صَمِيمِ الْأَمْرِ، وَتُقَابِلُ الظَّاهِرِيَّةَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "كَوْنُ الشَّيْءِ دَاخِلِيًّا أَوْ بَاطِنِيًّا، وَهِيَ الصِّفَةُ الَّتِي تَقُومُ فِي عُمْقِ الذَّاتِ أَوْ صَمِيمِ الْأَمْرِ، وَتُقَابِلُ الظَّاهِرِيَّةَ."}

  examples:
    per_lemma:
      - lemma: "بَاطِنِيَّة"
        examples:
          - text: "يَسْعى الْمُتَصَوِّفُ إلى دَرَكِ الْبَاطِنِيَّةِ لِلْوُصُولِ إلى حَقِيقَةِ الْأَشْيَاءِ."
            type: usage
      - lemma: "جَوَّانِيَّة"
        examples:
          - text: "تَمَيَّزَ فِكْرُ عُثْمَان أَمِين بِتَرْكِيزِهِ على الْجَوَّانِيَّةِ كَمَنْهَجٍ لِفَهْمِ الْإِنْسَانِ."
            type: usage
      - lemma: "دَاخِلِيَّة"
        examples:
          - text: "أَدْرَكَ الْفَنَّانُ الدَّاخِلِيَّةَ الْعَمِيقَةَ لِلْمَشْهَدِ الصَّامِتِ."
            type: usage
      - lemma: "اسْتِبْطَانِيَّة"
        examples:
          - text: "تَعْكِسُ رِوَايَاتُهُ اسْتِبْطَانِيَّةً عَمِيقَةً تَسْبُرُ أَغْوَارَ النَّفْسِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَمَيَّزَ فِكْرُ عُثْمَان أَمِين بِتَرْكِيزِهِ على الْجَوَّانِيَّةِ كَمَنْهَجٍ لِفَهْمِ الْإِنْسَانِ."}

stage5_enrichment:
  per_entry:
    - lemma: "بَاطِنِيَّة"
      entry_id: "{auto}"
      root: "بطن"
      maqayis_quote: "«الْبَاءُ وَالطَّاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ لَا يَكَادُ يُخْلِفُ، وَهُوَ إِنْسِيُّ الشَّيْءِ وَالْمُقْبِلُ مِنْهُ. فَالْبَطْنُ خِلَافُ الظَّهْرِ... وَبَاطِنُ الْأَمْرِ دُخْلَتُهُ، خِلَافُ ظَاهِرِهِ.»"
    - lemma: "جَوَّانِيَّة"
      entry_id: "{auto}"
      root: "جوو"
      maqayis_quote: "«الجَوُّ: ما اتسع من الأَرض واطْمَأَنَّ... وجَوُّ البيت: داخِلُه، شاميّة.» (عن لسان العرب لعدم توفر المادة في مقاييس اللغة بهذا المعنى)."
    - lemma: "دَاخِلِيَّة"
      entry_id: "{auto}"
      root: "دخل"
      maqayis_quote: "«الدَّالُ وَالْخَاءُ وَاللَّامُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ، وَهُوَ الْوُلُوجُ... وَالدُّخْلَةُ: بَاطِنُ أَمْرِ الرَّجُلِ.»"
    - lemma: "اسْتِبْطَانِيَّة"
      entry_id: "{auto}"
      root: "بطن"
      maqayis_quote: "«الْبَاءُ وَالطَّاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ... وَبَاطِنُ الْأَمْرِ دُخْلَتُهُ.»"

  per_sense:
    - lemma: "بَاطِنِيَّة"
      sense_id: "{auto}"
      nuance: "تركز على الجانب المستور والمعرفي الذي لا يدركه إلا الخواص."
      mwe: false
    - lemma: "جَوَّانِيَّة"
      sense_id: "{auto}"
