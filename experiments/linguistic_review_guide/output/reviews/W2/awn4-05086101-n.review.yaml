        value: '{"root":"دخل","maqayis":"«الدَّالُ وَالْخَاءُ وَاللَّامُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ... وَالدُّخْلَةُ: بَاطِنُ أَمْرِ الرَّجُلِ.»"}'
