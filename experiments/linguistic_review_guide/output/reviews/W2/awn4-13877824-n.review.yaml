# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13877824-n
# contrast / direct contrast — التعارض أو الاختلاف بين الأشياء التي تتم مقارنتها
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (تَبَايُن) وهي قليلة لتغطية مفهوم التقابل/التباين الذي يملك مرادفات عربية متعددة"
      - "التعريف العربي الحالي ترجمة حرفية للتعريف الإنجليزي وليس تأليفاً معجمياً أصيلاً"
    observations: "المفهوم المقصود هو العلاقة بين أشياء مُقارَنة تظهر فيها فروق واضحة أو تعارض. هو نوع فرعي من التضاد/التعارض (المجموعة الأعلى). في العربية عدة ألفاظ تؤدي هذا المعنى بدرجات متفاوتة من القوة والتخصص، منها: التباين والتغاير والمفارقة والتقابل."

  blind_candidates:
    - lemma: "تَبَايُن"
      generation_method: ishtiqaq
      justification: "مصدر تَبَايَنَ على وزن تَفَاعُل من الجذر ب ي ن، يدل على الافتراق والاختلاف الظاهر بين شيئين عند المقارنة"
    - lemma: "مُغَايَرَة"
      generation_method: ishtiqaq
      justification: "مصدر ميمي من غَايَرَ على وزن مُفَاعَلة من الجذر غ ي ر، يدل على إظهار الفرق بين شيئين بالمقابلة بينهما"
    - lemma: "تَقَابُل"
      generation_method: ishtiqaq
      justification: "مصدر تَقَابَلَ على وزن تَفَاعُل من الجذر ق ب ل، يدل على وضع شيئين بإزاء بعضهما لإبراز الفروق"
    - lemma: "تَغَايُر"
      generation_method: ishtiqaq
      justification: "مصدر تَغَايَرَ على وزن تَفَاعُل من الجذر غ ي ر، يدل على ظهور فروق صارخة عند المقارنة بين شيئين"


stage2_evidence:
  per_lemma:
    - lemma: "تَبَايُن"
      confirm:
        - text: "«التباين: ما إذا نسب أحد الشيئين إلى الآخر لم يصدق أحدهما على شيء مما صدق عليه الآخر، فإن لم يصدقا على شيء أصلا فبينهما تباين كلي كالإنسان والفرس»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«التّباين يرادف المباينة عند المحاسبين وكذا عند المنطقيين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«التباين: التباعد والافتراق»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«تمايُز الأشياء بضِدّها، وفي الفنون التشكيلية يعني تباين الألوان وبقع الضوء والظّل. أما في الأدب فهو حالات تعارض ومغايرة لتحديد الصراع الدرامي. لذلك كان التباين قانون ترابط وحالة موضوعين متساويين في الذهن.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«اختلاف صوتي بين وحدتين متجاورتين في السلسلة الكلامية، وهو علاقة ترتيب مركبيه، بخلاف الضد»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«القومُ: تهاجروا وتَقاطَعُوا. الشريكان: انفَصَلا»"
          source: "المعجم الكبير"
      expands:
        - text: "«(1) تباين؛ اختلاف (2) نقطةُ تبايُن»"
          source: "المورد الحديث (2008) — dissimilarity"
          addition: "يُستعمل التباين مقابلاً لـ dissimilarity أيضاً لا فقط contrast"
        - text: "«تقابل بين الألوان الداكنة والألوان الفاتحة على صورة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "تخصيص تقني في مجال الصور والشاشات"

    - lemma: "مُغَايَرَة"
      confirm:
        - text: "«(4) المغايَرة: المقابَلة بين شيئين بُغْيَةَ إظهار الفروق»"
          source: "المورد الحديث (2008) — contrast"
      expands:
        - text: "«(1) يُغاير: يقابل بين شيئين (3) التغاير؛ التباين: فرق كبير؛ تفاوتٌ يتبدَّى عند مقارنة شيء بآخر»"
          source: "المورد الحديث (2008) — contrast"
          addition: "المغايرة هي الفعل الإرادي للمقابلة، بينما التغاير هو الحالة الناتجة"

    - lemma: "تَقَابُل"
      confirm:
        - text: "«اختلاف بين وحدتين أو عدة وحدات مميزة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — Opposition"
        - text: "«التقابل: عند أهل البديع والحكماء هو المقابلة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«التقابل: أن يقبل بعض القوم على بعض إما بالذات وإما بالعناية والتوفيق والمودة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "هذا المعنى إيجابي (الإقبال والمودة) لا سلبي، يختلف عن معنى التعارض المقصود"
      expands:
        - text: "«التقابل: عدم إمكان اجتماع الأمرين في موضوع واحد من جهة واحدة... والتقابل أقسام أربعة»"
          source: "دستور العلماء للأحمدنكري"
          addition: "التقابل عند المناطقة أعم من التباين، يشمل التضاد والتضايف والسلب والإيجاب والعدم والملكة"

    - lemma: "تَغَايُر"
      confirm:
        - text: "«(2) يتغاير: يتكشَّف عن فروقٍ ووجوه اختلافٍ صارخة عند مقابلته بشيء آخر (3) التغاير؛ التباين: فرق كبير؛ تفاوتٌ يتبدَّى عند مقارنة شيء بآخر»"
          source: "المورد الحديث (2008) — contrast"
      expands:
        - text: "«تغاير، تباين»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "يُستعمل التغاير مرادفاً للتباين في المعاجم العلمية"


stage3_analysis:
  per_lemma:
    - lemma: "تَبَايُن"
      decision: confirmed
      decision_reason: "لمّة أصيلة مؤيَّدة بأدلة معجمية غزيرة من المعاجم الكلاسيكية والحديثة؛ من الجذر ب ي ن الدال على البُعد والانكشاف؛ مستعملة في جميع المجالات مقابلاً لـ contrast"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الاختلاف الجوهري بين شيئين بحيث لا يصدق أحدهما على ما يصدق عليه الآخر؛ أقوى دلالة على الانفصال التام من التغاير"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبَايُن"

    - lemma: "تَغَايُر"
      source: stage1
      decision: confirmed
      decision_reason: "مؤيَّد بدليل المورد الحديث ومعجم الأحياء مقابلاً صريحاً لـ contrast؛ على وزن تَفَاعُل من الجذر غ ي ر؛ يضيف بُعداً دلالياً يختلف عن تباين إذ يركّز على ظهور الفروق عند المقابلة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الفروق الصارخة التي تتكشّف عند وضع شيئين جنباً إلى جنب؛ يميل إلى السياق الأدبي والنقدي أكثر من التباين الذي يميل إلى السياق العلمي والمنطقي"
      actions:
        - command: create_entry
          params: {lemma: "تَغَايُر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُغَايَرَة"
      source: stage1
      decision: removed
      decision_reason: "المغايرة مصدر مُفَاعَلة يدل على فعل المقابلة الإرادية (action) لا على العلاقة (relation) بين الأشياء المُقارَنة؛ مفهوم المجموعة هو العلاقة لا الفعل"

    - lemma: "تَقَابُل"
      source: stage1
      decision: removed
      decision_reason: "التقابل في الاصطلاح المنطقي أعمّ من التباين (يشمل التضاد والتضايف والسلب والإيجاب) وليس مرادفاً له؛ وفي الاستعمال العام له معنى إيجابي (المواجهة والمودة) يتعارض مع المقصود؛ كما أنه يُستعمل في المعاجم مقابلاً لـ opposition (المجموعة الأعلى) لا لـ contrast"


