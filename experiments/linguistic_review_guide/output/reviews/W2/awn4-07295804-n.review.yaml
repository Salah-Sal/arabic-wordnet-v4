# مراجعة المجموعة الترادفية: awn4-07295804-n — packet
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي عام جداً («رسالة أو جزء من رسالة») ولا يميّز المفهوم الحاسوبي عن الرسالة العادية"
      - "اللمّة «حزمة بيانات» مركب إضافي لكنه أقرب دلالياً إلى datagram منه إلى packet"
      - "اللمّة «رزمة» بدون تشكيل في المدخل الأصلي"
    observations: "المفهوم هو وحدة البيانات المُرسَلة عبر شبكة حاسوبية، وهو مفهوم تقني غربي المنشأ لكن له مقابلات عربية راسخة. الجِنس القريب هو «رسالة» وهو صحيح. اللمّتان الموجودتان تنتميان إلى جذرين مختلفين (حزم، رزم) وكلاهما يدلّ على الجمع والضمّ، لكن ينقص المجموعة اللفظ المفرد «حُزْمَة» الذي هو الأكثر شيوعاً في الاستعمال الحاسوبي المعاصر."
  blind_candidates:
    - lemma: "حُزْمَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ح ز م) على وزن فُعْلَة، بمعنى ما جُمع ورُبط. استعمالها الحاسوبي توسيع دلالي طبيعي للمعنى اللغوي الأصلي: وحدة بيانات مجموعة ومغلّفة تُرسل عبر الشبكة."
    - lemma: "رُزْمَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ر ز م) على وزن فُعْلَة، بمعنى ما جُمع في شيء واحد. مرادف قريب لحُزْمَة في الاستعمال المصطلحي الحاسوبي."
    - lemma: "صُرَّة"
      generation_method: majaz
      justification: "من الجذر (ص ر ر) على وزن فُعْلَة، أصلها ما يُجمع فيه الشيء ويُشدّ كالحقيبة. إزاحة دلالية من الحقل المادي (صرة نقود) إلى الحقل الرقمي (صرة بيانات)."
    - lemma: "طَرْد"
      generation_method: majaz
      justification: "من الجذر (ط ر د)، بمعنى ما يُرسل من البضاعة في البريد من ناحية إلى أخرى. إزاحة دلالية من الإرسال البريدي المادي إلى إرسال وحدات البيانات عبر الشبكة."

stage2_evidence:
  per_lemma:
    - lemma: "حُزْمَة بَيَانَات"
      confirm:
        - text: "«حزمة قائمة بذاتها تستخدم في نظام التبديل الحزمي ولا تعتمد على غيرها ولا تحتاج إلى إخطار بوصولها وتحتوي عادة على معلومات كافية لتوجيهها من مصدر البيانات إلى المحطة النهائية لوصولها.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«حزمة قائمة بذاتها تستخدم في نظام التبديل الحزمي»"
          source: "مسرد التربية (ALECSO)"
          addition: "المصطلح مسجّل ترجمةً لـ datagram لا لـ packet، مما يشير إلى تخصيص دلالي أدق"

    - lemma: "رُزْمَة"
      confirm:
        - text: "«1- وحدةُ معلوماتٍ ترسَلُ كاملةً من تجهيزة إلى أخرى عبر الشبكة. 2- في شبكات ابتدال الرزم: وحدةُ إرسالٍ ذاتُ حجمٍ أعظمي ثابت، تتألف من أرقام اثنانية تمثل المعطياتِ وترويسةً تحوي رقْمَ تعريفٍ وعنوانَي المصْدر والوجهة»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«رزمة معطيات — انظر: packet»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«رزمة معلومات — انظر: packet»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«ما جُمِع فى شيء واحد. يقال: رزمة ثياب, ورزمة ورق, وهكذا»"
          source: "المعجم الوسيط"
          addition: "الأصل اللغوي للكلمة: ما جُمع في شيء واحد — توسيع دلالي طبيعي إلى المجال الحاسوبي"

    - lemma: "حُزْمَة"
      confirm:
        - text: "«قطعة من المعطيات، تنشأ نتيجة لتشطير الرسالة المتضمِنة للمعلومات المراد نقلها عبر الشبكة، إلى كتل صغيرة، تضاف إليها بيانات خاصة بالتحكم في النقل وعنوان الوجهة التي تقصدها. وترسل هذه الحزم فرادى عبر المسارات المتاحة في الشبكة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
        - text: "«مجموعة من البيانات حجمها ثابت ونمطها معروف، ترسل كوحدة مركبة خلال شبكة تبديل حزمي»"
          source: "مسرد التربية (ALECSO)"
      expands:
        - text: "«ما جُمع ورُبط من كلِّ شيء»"
          source: "المعجم الوسيط"
          addition: "الأصل اللغوي: الحُزْمَة ما جُمع ورُبط — أساس المجاز الحاسوبي"

    - lemma: "صُرَّة"
      contradicts:
        - text: "«ما يُجمع فيه الشيءُ ويُشدّ»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي محصور في الوعاء المادي (صرة نقود/دراهم)، ولا شاهد على استعمال حاسوبي أو مجازي تقني"

    - lemma: "طَرْد"
      expands:
        - text: "«ما يُرسل من البضاعة وغيرها في البريد ونحوه من ناحية إلى أخرى. وهو في الأصل مصدر ثم أُطبق على المطرود»"
          source: "المعجم الوسيط"
          addition: "يدل على الطرد البريدي المادي، لا على وحدة البيانات الرقمية"
        - text: "«رزمة، طرد — packet»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "وُضع مقابلاً لـ packet في سياق التجارة لا الحوسبة"

stage3_analysis:
  per_lemma:
    - lemma: "حُزْمَة بَيَانَات"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت مسجّل في معاجم المصطلحات الحاسوبية (مسرد التربية ALECSO) مقابلاً لـ datagram. وإن كان تخصيصه الأصلي لـ datagram، فهو يصلح أيضاً للدلالة على packet باعتبار أن الـ datagram نوع من الـ packet."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُستخدم للدلالة على الحزمة المستقلة القائمة بذاتها (datagram) التي تحمل بيانات كافية لتوجيهها دون الحاجة إلى اتصال مسبق، وهو أخصّ من «حُزْمَة» المفردة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُزْمَة بَيَانَات"

    - lemma: "رُزْمَة"
      decision: confirmed
      decision_reason: "مصطلح راسخ في معجم مصطلحات المعلوماتية (2000) بتعريف تقني دقيق لـ packet. استعمله المعجم الموحد بشكل منهجي في عشرات المركبات (ابتدال الرزم، تجميع الرزم، ترشيح الرزم)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المفضّل لدى معجم مصطلحات المعلوماتية السوري، يُستخدم خاصةً في سياق «ابتدال الرزم» (packet switching). يميل إلى الاستعمال في الأدبيات الحاسوبية المشرقية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُزْمَة"

    - lemma: "حُزْمَة"
      source: stage1
      decision: confirmed
      decision_reason: "أكثر المصطلحات شيوعاً واستعمالاً في الحوسبة العربية المعاصرة. مسجّل في المعجم الموحد لمصطلحات تقانة المعلومات (2011) ومسرد التربية (ALECSO) بتعريف تقني دقيق لـ packet. جذره (حزم) يدل على الجمع والربط وهو مطابق للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ المفرد الأعمّ والأشيع لوحدة البيانات المُرسلة عبر الشبكة، يُستعمل في معظم الأدبيات الحاسوبية العربية المعاصرة دون تمييز بين packet وdatagram."
      actions:
        - command: create_entry
          params:
            lemma: "حُزْمَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "صُرَّة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد على استعمال حاسوبي أو تقني. المعنى المعجمي محصور في الوعاء المادي (صرة نقود، صرة دراهم). لم تُسجَّل في أيّ معجم مصطلحات تقنية مقابلاً لـ packet."

    - lemma: "طَرْد"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «طرد» مقابلاً لـ packet في معجم التجارة والمحاسبة، فإن دلالته الأساسية بريدية مادية (parcel/package) لا حاسوبية. كما أن جذره (طرد = إبعاد) لا يناسب مفهوم تجميع البيانات. استعماله سيُحدث التباساً مع الطرد البريدي."

stage4_content:
  definition:
    current: "(علوم الحاسوب) رسالة أو جزء من رسالة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية مبسّطة لا تميّز الحُزْمَة عن الرسالة العادية، ولا تذكر خصائصها التقنية الجوهرية: التغليف بمعلومات التحكم، والإرسال عبر الشبكة، والحجم المحدود."
    authored:
      - type: terminological
        text: "وحدةٌ من البيانات محدودةُ الحجم، تتألف من جزء حامل للمعلومات وترويسة تحوي عنوانَي المصدر والوجهة ومعلومات التحكم، تُرسَل مستقلةً عبر شبكة حاسوبية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "في شبكات الحاسوب، يُقسَّم المحتوى المُراد إرساله إلى وحدات صغيرة تُسمّى حُزَماً، تضاف إلى كلٍّ منها ترويسةٌ تحمل عنوانَي المُرسِل والمُستقبِل ورقم تسلسل يُمكِّن من إعادة تجميع الرسالة الأصلية عند الوصول. وقد تسلك الحُزَم مسارات مختلفة في الشبكة قبل أن تلتقي في الوجهة النهائية."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "وحدةٌ من البيانات محدودةُ الحجم، تتألف من جزء حامل للمعلومات وترويسة تحوي عنوانَي المصدر والوجهة ومعلومات التحكم، تُرسَل مستقلةً عبر شبكة حاسوبية."

