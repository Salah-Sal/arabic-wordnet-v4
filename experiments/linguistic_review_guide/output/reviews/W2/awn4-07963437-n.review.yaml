# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-07963437-n
# any hostile group of people — أي مجموعة معادية من الناس
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «أعداء» جمع تكسير لـ«عدو» على وزن أَفْعَال، فوجودهما معاً في المجموعة قد يُعدّ تكراراً صرفياً"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي، يحتاج صياغة معجمية أصيلة"
    observations: "المجموعة تمثّل مفهوم الجماعة المعادية من البشر، وهو مفهوم أصيل في الثقافة العربية له ألفاظ متعددة. لفظ «عدوّ» في العربية يصلح للمفرد والجمع على السواء كما نصّ المعجم الوسيط، فهو اسم جنس جمعي. أمّا «أعداء» فهو الجمع الصريح. وفي التراث ألفاظ جمعية أخرى كـ«عِدًى» و«عُدَاة» و«أعادٍ»."
  blind_candidates:
    - lemma: "عِدًى"
      generation_method: ishtiqaq
      justification: "اسم جمع لـ«عدوّ» على وزن فِعَل، ورد في القرآن والشعر العربي، يدلّ على جماعة الأعداء دلالة جمعية صريحة"
    - lemma: "عُدَاة"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«عدوّ» على وزن فُعَلة، ذكره ابن فارس في مقاييس اللغة والخليل في العين ضمن جموع عدوّ"
    - lemma: "أَعَادٍ"
      generation_method: ishtiqaq
      justification: "جمع الجمع لـ«أعداء» على وزن أفاعِل، ورد في المعجم الوسيط: «(جج) أعادٍ»، يدلّ على الكثرة"
    - lemma: "خُصُوم"
      generation_method: ishtiqaq
      justification: "جمع «خَصْم» على وزن فُعُول، يدلّ على جماعة المنازعين والمعادين"


stage2_evidence:
  per_lemma:
    - lemma: "أَعْدَاء"
      confirm:
        - text: "«أَعْدَاءَ — الجذر: ع د. تستحق كلمة أعداء الصرف؛ لأنَّ همزتها منقلبة عن أصل، فهي ليست زائدة، ووزنها: أَفْعال، وقد وردت مصروفة في قوله تعالى: {إِنْ يَثْقَفُوكُمْ يَكُونُوا لَكُمْ أَعْدَاءً} الممتحنة/2»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«(العَدُوّ) ذُو العَدَاوَة (للمذكر والمؤنث والوَاحِد والجَمع) وقد يُثنّى ويُؤنّث ويُجمع على عِدًى وعلى أَعدَاء (جج) أعَادٍ»"
          source: "المعجم الوسيط"
      expands:
        - text: "«ويُجمع العدوّ على الأعداء والعِدَى والعُدَى والعُدَاة والأَعَادِي»"
          source: "كتاب العين للخليل"
          addition: "تعداد جموع عدوّ المختلفة"

    - lemma: "عَدُوّ"
      confirm:
        - text: "«(العَدُوّ) ذُو العَدَاوَة (للمذكر والمؤنث والوَاحِد والجَمع) وقد يُثنّى ويُؤنّث ويُجمع على عِدًى وعلى أَعدَاء»"
          source: "المعجم الوسيط"
        - text: "«العَدُوُّ: اسمٌ جامعٌ للواحد والجميع والتّثنية والتّأنيث والتّذكير، تقول: هو لك عدوٌّ، وهي وهما وهم وهنَّ لك عدوٌّ»"
          source: "كتاب العين للخليل"
        - text: "«ومِنَ البابِ: العَدُوُّ، وهو مُشتَقٌّ مِنَ الَّذِي قَدَّمنا ذِكرَهُ، يُقالُ للواحِدِ والاثنَيْنِ والجَمعِ: عَدُوٌّ. قالَ الله تعالى: {فَإِنَّهُمْ عَدُوٌّ لِي إِلَّا رَبَّ العَالَمِينَ}»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(1) خَصْم (2) عَدُوّ»"
          source: "المورد الحديث"
          addition: "enemy يُترجم بـ«خصم» و«عدوّ»"
        - text: "«العَدْوُ: الحُضْرُ... والعَدُوّ: ذو العداوة... والعِدَى والعُدَى والعَادِي والعُدَاةُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر عدو يدلّ على التجاوز، ومنه اشتُقّ العدوّ"

    - lemma: "عِدًى"
      confirm:
        - text: "«(العَدُوّ) ذُو العَدَاوَة... ويُجمع على عِدًى وعلى أَعدَاء»"
          source: "المعجم الوسيط"
        - text: "«والعِدَى والعُدَى والعَادِي والعُدَاةُ»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "عُدَاة"
      confirm:
        - text: "«ويُجمع العدوّ على الأعداء والعِدَى والعُدَى والعُدَاة والأَعَادِي»"
          source: "كتاب العين للخليل"
        - text: "«والعِدَى والعُدَى والعَادِي والعُدَاةُ»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "أَعَادٍ"
      confirm:
        - text: "«(العَدُوّ) ذُو العَدَاوَة... ويُجمع على عِدًى وعلى أَعدَاء (جج) أعَادٍ»"
          source: "المعجم الوسيط"

    - lemma: "خُصُوم"
      contradicts:
        - text: "«(خَصَمَ) الخَاءُ والصَّادُ والمِيمُ أَصلانِ: أحدُهما المُنازَعَةُ، والثاني جانبُ وِعاءٍ. فالأوَّلُ الخَصْمُ الذي يُخاصِمُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الخصم يدلّ على المنازعة والمخاصمة القضائية أو الجدلية، لا على العداوة والحرب بالضرورة"
        - text: "«(خصم) خصمًا وخصامًا أحكم الخصومة وجادل فهو خصم»"
          source: "المعجم الوسيط"
          conflict: "الخصومة مجادلة ومنازعة، وليست عداوة بالمعنى الدقيق"
      expands:
        - text: "«الخَصُومُ: الشَّدِيدُ الخُصُومَةِ»"
          source: "المعجم الكبير"
          addition: "الخَصُوم صفة مشبّهة لا جمع"


stage3_analysis:
  per_lemma:
    - lemma: "أَعْدَاء"
      decision: confirmed
      decision_reason: "جمع تكسير قياسي لـ«عدوّ» على وزن أَفْعال، مُثبت في المعجم الوسيط والقرآن الكريم، ويدلّ صراحةً على الجماعة المعادية وهو المعنى المطلوب في هذه المجموعة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الجمع الصريح الأكثر شيوعاً واستعمالاً في العربية المعاصرة للدلالة على جماعة الأعداء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَعْدَاء"

    - lemma: "عَدُوّ"
      decision: confirmed
      decision_reason: "لفظ أصيل يصلح للمفرد والجمع على السواء كما نصّ المعجم الوسيط والخليل وابن فارس، واستعماله جمعاً ثابت في القرآن: {فَإِنَّهُمْ عَدُوٌّ لِي}"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اسم جنس جمعي يدلّ على العدوّ مفرداً وجماعةً دون تمييز العدد، أعمّ من «أعداء» الذي يُصرّح بالجمع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدُوّ"

    - lemma: "عِدًى"
      source: stage1
      decision: confirmed
      decision_reason: "اسم جمع لعدوّ مُثبت في المعجم الوسيط ومقاييس اللغة وكتاب العين، يُضيف بُعداً تراثياً للمجموعة ويسدّ حاجة التعبير عن الجمعية بصيغة مختلفة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "صيغة جمعية تراثية فصيحة تُستعمل في السياقات الأدبية والشعرية، أقلّ شيوعاً من «أعداء» في الاستعمال المعاصر"
      actions:
        - command: create_entry
          params: {lemma: "عِدًى", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عُدَاة"
      source: stage1
      decision: removed
      decision_reason: "رغم ورودها في كتاب العين ومقاييس اللغة، فهي صيغة نادرة الاستعمال جداً وتكاد تكون ميتة، ووجود «عِدًى» يُغني عنها كبديل تراثي"

    - lemma: "أَعَادٍ"
      source: stage1
      decision: removed
      decision_reason: "جمع الجمع وهو صيغة قليلة الاستعمال، يكفي وجود «أعداء» كجمع صريح و«عِدًى» كصيغة تراثية"

    - lemma: "خُصُوم"
      source: stage1
      decision: removed
      decision_reason: "الخصم يدلّ على المنازعة والمجادلة القضائية لا على العداوة، فدلالته لا تتطابق مع مفهوم المجموعة المعادية. كما أنّ «خصوم» في الاستعمال المعاصر غلب عليها المعنى المالي (الخصوم المالية = liabilities)"


