stage1_review:
  assessment:
    concerns:
      - "التعريف العربي دائري: يستخدم لفظ «التكيف» الذي هو لمّة من لمّات المجموعة ذاتها"
      - "لمّة «تعديل» دخيلة دلالياً: معناها الأساسي التغيير/الإصلاح/التسوية لا التكيف البيولوجي"
      - "اللمّات الثلاث جاءت بدون تشكيل كامل"
      - "غياب أي لمّة تعبّر عن الانسجام المتبادل (accommodation/mutual fitting) كتلاؤم"
    observations: >
      المجموعة تصف عملية حيوية راسخة في التراث العلمي العربي؛ المعاجم الحديثة ترسّخ الفرق بين
      «التكيف» (adaptation — عام، يشمل التغيير الوراثي والفيزيولوجي والسلوكي) و«التأقلم»
      (acclimatization — فيزيولوجي قصير الأمد مرتبط بتغير الإقليم، رجعي لا يصبح وراثياً).
      هذا الفرق موثَّق صراحةً في مسرد المناخ والبيئة (ALECSO): «لا ينبغي أن يكون هناك خلط
      بين التأقلم وبين التكيف». إدراج «تعديل» بمعنى adaptation خلط مرفوض معجمياً؛ إذ يحيل
      «تعديل» على استواء الشيء وإصلاحه لا على اكتساب الكائن سمات بيئية جديدة.

  blind_candidates:
    - lemma: "تَلاؤُمٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعُل من جذر لَأَمَ (تلاءَمَ يتلاءمُ تَلاؤُماً). يدلّ الجذر على الاتفاق
        والاجتماع بين طرفين (كما في الالتئام: سدّ الصدع والجرح). النمط تَفَاعُل يحمل معنى
        الفعل المتبادل بين الكائن وبيئته، وهو ما يعبّر عنه "التكيف مع" بدقة. لا تكرار
        لكلمات التعريف.
    - lemma: "تَوَافُقٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعُل من جذر وَفَقَ. يدلّ على ملاءمة شيئين لبعضهما ومطابقتهما (توافق
        الكائن مع شروطه البيئية). الوزن تَفَاعُل يعبّر عن عملية ثنائية الطرف.
        وردت هذه الصيغة في مصادر عدة بمعنى adjustment/accord.
    - lemma: "مُسَايَرَةٌ"
      generation_method: majaz
      justification: >
        مجاز من "السير مع" نحو "الانسجام مع المستجدات". تعبّر مُسَايَرَةٌ في الأصل عن
        مواكبة المسير ومجاراته، وتُستعمل مجازاً في التعبير عن التكيف مع الظروف والمتغيرات.
        لا تكرار لمكوّنات التعريف.
    - lemma: "تَهَيُّؤٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَعُّل من جذر هَيَّأَ. يدلّ على إعداد الكائن لنفسه وتهيئته لاستقبال
        الظروف الجديدة، وهو ما يعبّر عنه الوجه الإعدادي للتكيف. الوزن تَفَعُّل يفيد
        التدرّج والاكتساب التلقائي للحال.


