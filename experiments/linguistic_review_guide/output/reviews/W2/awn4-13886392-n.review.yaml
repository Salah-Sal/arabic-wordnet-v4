        value: '{"root":"سير","maqayis":"«السِّينُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى مُضِيٍّ وَجَرَيَانٍ، يُقَالُ سَارَ يَسِيرُ سَيْرًا.»"}'
    - command: set_metadata
      params:
