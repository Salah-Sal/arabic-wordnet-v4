stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'خط' تفتقر إلى التشكيل الكامل."
    observations: "المفهوم هندسي بحت يمثل البعد الواحد. التعريف العربي الحالي دقيق وشامل، وهو مقتبس من التعاريف الكلاسيكية للمناوي والتهانوي."
  blind_candidates:
    - lemma: "خَطّ"
      generation_method: ishtiqaq
      justification: "اللفظ العربي القياسي للمفهوم الهندسي الذي له طول فقط."
    - lemma: "مَسَار"
      generation_method: ishtiqaq
      justification: "يركز على جانب 'أثر نقطة متحركة' في الفضاء أو الوسط."
    - lemma: "رَسْم"
      generation_method: majaz
      justification: "بمعنى الأثر الباقي، ويستخدم في سياق الخطوط المرسومة."
    - lemma: "أَثَر"
      generation_method: majaz
      justification: "يركز على النتيجة المادية لحركة النقطة."

stage2_evidence:
  per_lemma:
    - lemma: "خَطّ"
      confirm:
        - text: "«الخَطُّ: مَا لَهُ طول فَقَط ونهايته نقطتان.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«عند الحكماء والمهندسين عرض هو كم متّصل له طول فقط أي مقدار له طول فقط. وفي أشكال التأسيس الخط طول بلا عرض.»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«تصوير اللفظ بحروف هجائه... وعند الحكماء: عرض يقبل الانقسام طولا وعرضا لا عمقا... والنقطة نهاية الخط.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "مَسَار"
      confirm:
        - text: "«هو تعبير عن خط السير المؤمّن من خلال إشارات الأمان.»"
          source: "المعجم الموحد لمصطلحات النقل"
      expands:
        - text: "«السِّينُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى مُضِيٍّ وَجَرَيَانٍ... وَالْمُسَيَّرُ مِنَ الثِّيَابِ: الَّذِي فِيهِ خُطُوطٌ كَأَنَّهُ سُيُورٌ.»"
          source: "مقاييس اللغة"
    - lemma: "رَسْم"
      confirm:
        - text: "«الرَّسْمُ: بَقِيَّةُ الأثَرِ.»"
          source: "المحيط في اللغة للصاحب بن عباد"
      expands:
        - text: "«ما يَبْقَى من آثار الدَّار وغيرها بعد ذَهابِها... تمثيلُ شىءٍ أو شخص بالقَلَمِ ونَحْوه.»"
          source: "المعجم الكبير"
    - lemma: "أَثَر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خط"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والمباشر للمفهوم في الهندسة واللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَطّ"
    - lemma: "مَسَار"
      source: stage1
      decision: confirmed
      decision_reason: "يصلح للتعبير عن الخط من زاوية حركية (أثر نقطة متحركة) وهو مستعمل بكثرة في العلوم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَسَار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13886392-n"}
    - lemma: "رَسْم"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من دلالته على الأثر، إلا أنه ينصرف غالباً إلى عملية التصوير أو الوثائق الرسمية، و'خط' أوعى منه للمفهوم الهندسي."
    - lemma: "أَثَر"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام جداً لا يختص بالدلالة الهندسية للخط."

stage4_content:
  definition:
    current: "طول (مستقيم أو منحني) بدون عرض أو سمك؛ أثر نقطة متحركة"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً ولغوياً ويتفق مع المصادر المعجمية الكلاسيكية والحديثة."
  examples:
    per_lemma:
      - lemma: "خَطّ"
        examples:
          - text: "رَسَمَ الرِيَاضِيُّ خَطًّا مُسْتَقِيمًا يَصِلُ بَيْنَ نُقْطَتَيْنِ لِتَحْدِيدِ الوَتَرِ."
            type: usage
      - lemma: "مَسَار"
        examples:
          - text: "تَتَّخِذُ الأَجْرَامُ السَّمَاوِيَّةُ خُطُوطًا مُنْحَنِيَةً كَمَسَارَاتٍ لَهَا فِي الفَضَاء."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "خَطّ"
      entry_id: "{auto}"
      root: "خطط"
      maqayis_quote: "«الْخَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ ; وَهُوَ أَثَرٌ يَمْتَدُّ امْتِدَادًا. فَمِنْ ذَلِكَ الْخَطُّ الَّذِي يَخُطُّهُ الْكَاتِبُ.»"
    - lemma: "مَسَار"
      entry_id: "{auto}"
      root: "سير"
      maqayis_quote: "«السِّينُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى مُضِيٍّ وَجَرَيَانٍ، يُقَالُ سَارَ يَسِيرُ سَيْرًا.»"
  per_sense:
    - lemma: "خَطّ"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشامل للمفهوم الهندسي المجرد."
