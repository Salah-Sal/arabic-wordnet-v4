# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ──
    - lemma: "تصوير إشعاعي"
      decision: confirmed
      decision_reason: >
        مؤكَّد في معاجم الفيزياء والطب البيطري وAGROVOC بمعنى «radiography» مباشرةً،
        وفي المعجم الطبي الموحد بمعنى skiagraphy/scotography (مرادفَي roentgenography).
        التعارض في معجم الكيمياء («radiophotography») لا يُسقط اللمّة إذ يعكس استخداماً
        أضيق دلالةً. اللمّة مركّب وصفي ثابت اجتاز اختبار السكّ، ويحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُستخدم في السياقات الكيميائية والفيزيائية؛ صيغة «الإشعاعي» (من إشعاع = المصدر
        الرباعي لـش-ع-ع) تُوحي بالطابع الفيزيائي التقني. أكثر شيوعاً في فيزياء الأشعة
        والكيمياء النووية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصْوِيرٌ إِشْعَاعِيٌّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "التَّظْلِيلُ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية (المعجم الكبير، الطاقة المتجددة، الكهرباء، النسيج) تؤكد أن
        «التظليل» مُقيَّد بمعاني الظلّ الفني والزراعي والكهربائي في خمسة معاجم متخصصة.
        اختبار التثبيت المعجمي فشل: اللفظ موثَّق بمعانٍ مغايرة ومتضاربة مع المعنى المطلوب.
        الإزاحة المجازية نحو «radiography» تُصطدَم بالتثبيت الاصطلاحي القائم.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الإِشْعَاعِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        الإشعاعية راسخة في المعاجم الموحَّدة بثلاثة معانٍ مغايرة: «Irradiance» (كثافة
        الطاقة)، «Radiance» (اللمعان الإشعاعي)، «Radioactivity» (النشاط النووي). لا
        تدلّ على عملية التصوير في أيٍّ من المصادر المفحوصة. الفصل الدلالي بينها وبين
        «radiography» تامٌّ ومُوثَّق.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَصْوِيرُ الأَشِعَّةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على هذا التركيب الإضافي بعينه في قاعدة البيانات. الصيغة المُتداوَلة
        الأقرب هي «تصوير بالأشعة» (بالباء الجارة)، لا «تصوير الأشعة» (بالإضافة).
        اختبار التثبيت المعجمي: المركّب غير موثَّق كوحدة معجمية ثابتة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "رَادْيُوغرَافِيَا"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على أي توثيق في قاعدة البيانات المعجمية. في ظلّ وجود مصطلح عربي فصيح
        راسخ («التصوير الشعاعي»)، لا حاجة إلى التعريب وفق مبدأ إيثار العربي وترتيب
        الأولويات (تعريب = ملاذ أخير).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مصطلح مكتشَف من أدلة المرحلة ٢ ──
    - lemma: "تصوير شعاعي"
      decision: confirmed
      decision_reason: >
        اكتُشِف خلال مرحلة جمع الأدلة من الجسر الإنجليزي. «التَّصْوِيرُ الشُّعاعِيّ»
        هو المصطلح المعياري في المعجم الطبي الموحد (2009) — أعلى مرجعية في الاصطلاح
        الطبي العربي — بمقابلَي «radiography» و«roentgenography». يُثبته المورد الحديث
        (2008) وموسوعة الكهرباء (IEC) ومسرد الجغرافيا. صيغة «شعاعي» (من شعاع = الاسم
        الثلاثي) متميّزة دلالياً عن «إشعاعي» (من إشعاع). اجتاز اختبار السكّ وهو وحدة
        معجمية ثابتة ومُسجَّلة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        المصطلح الطبي المعياري في المعجم الطبي الموحد والمورد الحديث. «الشعاعي» (من
        شعاع = الحزمة المنبثّة) يُركِّز على الشعاع كوسيلة دون الإيحاء النووي. الأكثر
        تداولاً في الطب السريري وتقارير الأشعة التشخيصية.
      actions:
        - command: create_entry
          params:
            lemma: "تَصْوِيرٌ شُعَاعِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13566585-n"


