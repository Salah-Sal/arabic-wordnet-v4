    - lemma: "تصوير إشعاعي"
      confirm:
        - text: "«تصوير اشعاعي (ن) — translation_en: radiography / translation_fr: radiographie»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«تصوير شعاعي — translation_en: radiography / translation_fr: radiographie»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«تصوير شعاعي — translation_en: radiography / translation_fr: radiographie»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«تَصْويرٌ شُعاعِيّ — translation_en: skiagraphy (roentgenography)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَصْويرٌ شُعاعِيّ — translation_en: scotography (roentgenography)»"
