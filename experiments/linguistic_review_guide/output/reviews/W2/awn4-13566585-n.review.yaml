# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تصوير إشعاعي» خالية من التشكيل كليًّا"
      - "التعريف الحالي يتضمن «صورة شعاعية» في بنيته مما يُوجِد دوريّة جزئية مع اللمّة المرشّحة الأبرز"
      - "بنية الفاصلة المنقوطة تجمع تعريفَين متكرِّرَين بدلاً من تعريف واحد متكامل بجنس وفصل"
      - "المجموعة تحتوي على لمّة واحدة فقط مع وجود مرادفات طبية وعلمية راسخة في المعاجم الموحَّدة"
      - "الجذر المُسنَد في ARABTERM هو «صر» (خطأ في مُعلِّم CAMEL) والصواب «صور»"
    observations: >
      المجموعة تمثّل مفهوم «التصوير الإشعاعي/الشعاعي» وهو عملية تقنية طبية متخصصة تستخدم
      إشعاعاً غير مرئي (أشعة سينية أو كامية) لتكوين صور على سطح حساس. الجذران المحوريان
      هما «ص-و-ر» (الصورة والتشكيل) و«ش-ع-ع» (الانتشار والانبثاث)، وكلاهما أصيل في العربية.
      يُلاحَظ وجود نمطَين اشتقاقيَّين متنافسَين: «إشعاعي» (من إشعاع = المصدر الرباعي) و«شعاعي»
      (من شعاع = الاسم الثلاثي)، وقد أثبتت المعاجم الطبية الموحَّدة تفضيل «التصوير الشعاعي».
      التعريف الحالي مقبول مضموناً لكن يحتاج إعادة صياغة من حيث الأسلوب وإزالة الدوريّة.

  blind_candidates:
    - lemma: "التَّظْلِيلُ"
      generation_method: majaz
      justification: >
        المرادف الإنجليزي الثاني «skiagraphy» مشتقّ من σκιά (ظلّ) + γράφω (كتابة/رسم)،
        أي «رسم بالظلال». الصورة الإشعاعية تتكوّن بتفاوت الظلال الناجم عن امتصاص الأشعة.
        «التظليل» (ظ-ل-ل) لفظٌ عربي يُحيي هذا المفهوم الظلّي الكلاسيكي.
    - lemma: "الإِشْعَاعِيَّةُ"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي من «إشعاع» (ش-ع-ع) على نمط فِعَالِيَّة، يعني خاصية أو ممارسة
        التصوير بالإشعاع غير المرئي — قياساً على «فوتوغرافية» و«ضوئية».
    - lemma: "تَصْوِيرُ الأَشِعَّةِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي: المضاف (تصوير = العملية/الجنس) + المضاف إليه (الأشعة = الوسيلة/الفصل).
        يجمع الجنسَ القريب والفصلَ النوعي في وحدة معجمية مضغوطة مألوفة في الاستخدام الطبي.
    - lemma: "رَادْيُوغرَافِيَا"
      generation_method: taarib
      justification: >
        تعريب للصيغة الدولية «radiography» ذات التداول العالمي. تقبل لام التعريف
        (الراديوغرافيا) والنسبة (راديوغرافي) والجمع بالألف والتاء (راديوغرافيات).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
