step0_evidence:
  per_lemma:
    - lemma: "مُفَارَقَة تَارِيخِيَّة"
      confirm:
        - text: "«المُفارَقة التاريخيّة: (أ) خطأ تاريخيّ قوامه وضع الشيء في غير موضعه. (ب) شخص أو شيء في غير زمانه الصحيح.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«يمكن للمفارقة استعادة رؤية توقّع خارج زمانها، كإعادة إبداع هزلي في المعارضات، لتبرز المفارقة عبر السخرية والهزء.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يوسّع المعنى ليشمل الاستعمال الأدبي والجمالي لهذه المفارقة."
    - lemma: "شَخْص مِن زَمَن آخَر"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُفَارَقَة تَارِيخِيَّة"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُفارَقة التاريخيّة: ... (ب) شخص أو شيء في غير زمانه الصحيح.» — المورد الحديث (2008)"
      justification: "مصطلح معجمي صريح يعرّف المفهوم بأنه الشخص أو الشيء."
  knowledge_candidates:
    - lemma: "رَجُل مِن زَمَن آخَر"
      justification: "تعبير شائع في الاستعمال الأدبي والصحفي لوصف الشخص الذي لا ينتمي لعصره (تركيب وصفي)."
    - lemma: "كَائِن مِن عَصْر آخَر"
      justification: "صيغة بلاغية تطلق على الشخص الذي يبدو غريباً عن زمنه (تركيب إضافي وصفي)."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُفَارَقَة تَارِيخِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مستقر ومعجم بوضوح كدلالة على الشخص أو الشيء الذي في غير زمانه (المورد الحديث)."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
        type: "وصفي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح الفني الدقيق الذي يجمع بين الدلالة على الخطأ التاريخي وبين الشخص الذي يمثله."
      example: "يعدّ بطل هذه الرواية مفارقة تاريخية؛ فهو يتحدث ويفكر وكأنه يعيش في العصور الوسطى."
    - lemma: "شَخْص مِن زَمَن آخَر"
      decision: removed
      decision_reason: "تركيب وصفي حر (Free Phrase) وليس مصطلحاً مسكوكاً؛ يمكن استبدال مكوناته (فرد من عصر سابق) دون فقدان المعنى الوصفي."
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "pass"
      nuance_differentiation: "وصف عام غير معجم."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "رَجُل مِن زَمَن آخَر"
      source: step05
      decision: removed
      decision_reason: "تعبير وصفي حر مستعمل بكثرة لكنه يفتقر للثبات المصطلحي كلقب معجمي (اختبار السكّ)."
      step05_citation: "الاستعمال الشائع"

