stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي حرفي بعض الشيء من الإنجليزية (كنبات معمر)."
    observations: "المفهوم يشير إلى دورة حياة النباتات المعمرة التي تمتد لأكثر من عامين. اللمة (تعمير) مناسبة وهي مصدر الفعل (عمّر) وتدل على إطالة البقاء."
  blind_candidates:
    - lemma: "تَعْمِير"
      generation_method: ishtiqaq
      justification: "مصدر الفعل (عَمَّرَ) وهو ما يُشتق منه نعت (مُعَمِّر) الذي يطلق على النباتات التي تعيش لعدة سنوات."
    - lemma: "مُعَمَّرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من كلمة (مُعَمِّر) ليدل على خاصية أو عملية بقاء النبات لعدة سنوات."
    - lemma: "بَقَاء"
      generation_method: majaz
      justification: "الاستمرار في الحياة، ويُستخدم في السياق البيئي لوصف استمرار الكائنات وبقائها على قيد الحياة."
    - lemma: "خُلُود"
      generation_method: majaz
      justification: "استعارة مجازية لوصف النباتات التي لا تموت بمجرد انتهاء الموسم الزراعي، رغم أنها لا تعني الأبدية حقيقة."

stage2_evidence:
  per_lemma:
    - lemma: "تَعْمِير"
      confirm:
        - text: "«طول العمر.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«التعمير: إعطاء العمر... وقال الحرالي: تمادي العمر كأنه تكرار، والعمر أمد ما بين بدء الشيء وانقطاعه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "مُعَمَّرِيَّة"
      contradicts:
        - text: "«المعمرية: هم أصحاب معمر بن عباد السلمي، قالوا: الله تعالى لم يخلق شيئًا غير الأجسام...»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الكلمة محجوزة تاريخياً لاسم فرقة كلامية من المعتزلة ولا تُستخدم في علم النبات."
    - lemma: "بَقَاء"
      expands:
        - text: "«البقاء: ثبات الشيء على الحالة الأولى ويضاده الفناء.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "مصطلح عام ولا يختص بوصف طول دورة حياة النبات (perennation)."
    - lemma: "خُلُود"
      contradicts:
        - text: "«الخلود: طول الإقامة بالقرار ذكره الحرالي. وقال الراغب: تبرؤ الشيء من أعراض الفساد وبقاؤه على الحالة التي هو عليها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "مصطلح مطلق يدل على الأبدية وعدم الفساد، ولا يناسب علمياً وصف النبات المعمر الذي يموت في النهاية."

stage3_analysis:
  per_lemma:
    - lemma: "تَعْمِير"
      decision: confirmed
      decision_reason: "اللمة دقيقة لغوياً واصطلاحياً، فهي مصدر (عمّر) الذي اشتق منه مصطلح (نبات معمر) للتعبير عن النباتات التي تتجاوز دورتها الحياتية السنتين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْمِير"
    - lemma: "مُعَمَّرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصدر صناعي لم يثبت استخدامه في المعاجم العلمية كمقابل لـ perennation، وله دلالة تاريخية تخص فرقة كلامية."
    - lemma: "بَقَاء"
      source: stage1
      decision: removed
      decision_reason: "مصطلح شديد العمومية يدل على استمرار الوجود (survival)، ولا يحدد خاصية تجاوز النبات للموسمين الزراعيين."
    - lemma: "خُلُود"
      source: stage1
      decision: removed
      decision_reason: "يحمل دلالة لغوية مبالغ فيها (الأبدية) ولا يصلح للاستخدام الاصطلاحي العلمي لوصف النبات المعمر."

stage4_content:
  definition:
    current: "عملية العيش لعدد من السنوات (كنبات معمر)"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية بين القوسين، والأفضل صياغة تعريف علمي دقيق يوضح معنى التعمير في سياق النبات."
    authored:
      - type: terminological
        text: "عملية امتداد دورة حياة النبات لعدة سنوات تتجاوز الموسمين الزراعيين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية امتداد دورة حياة النبات لعدة سنوات تتجاوز الموسمين الزراعيين."

  examples:
    per_lemma:
      - lemma: "تَعْمِير"
        examples:
          - text: "تتميز بعض أنواع الأشجار بالتعمير لقدرتها العالية على التكيف مع قسوة المناخ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تتميز بعض أنواع الأشجار بالتعمير لقدرتها العالية على التكيف مع قسوة المناخ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتميز بعض أنواع الأشجار بالتعمير لقدرتها العالية على التكيف مع قسوة المناخ."

