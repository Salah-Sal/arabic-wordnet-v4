  per_entry:
    - lemma: "تَعْمِير"
      entry_id: "{auto}"
      root: "عمر"
      maqayis_quote: "«الْعَيْنُ وَالْمِيمُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى بَقَاءٍ وَامْتِدَادِ زَمَانٍ... فَالْأَوَّلُ الْعُمْرُ وَهُوَ الْحَيَاةُ.»"
  per_sense:
    - lemma: "تَعْمِير"
      sense_id: "{auto}"
      nuance: "المصطلح الأدق والأشيع اصطلاحاً لوصف امتداد حياة النبات المعمر."
