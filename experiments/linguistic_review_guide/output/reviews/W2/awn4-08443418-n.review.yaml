# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-08443418-n (formation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي لمّة واحدة فقط (تشكيل)، وهي لمّة بدون تشكيل كامل"
      - "اللمّة تشكيل مشتركة لفظياً: تدلّ على التشكيل العسكري/الإداري وعلى التشكيل الكهربائي (modulation) والقَوْلَبة (moulding)"
    observations: "المفهوم المقصود هو ترتيب أشخاص أو أشياء تعمل كوحدة واحدة، وهو أخصّ من مجرد الترتيب (المفهوم الأعلى). المفهوم شائع في السياق العسكري (تشكيل قتالي) والإداري (تشكيل وزاري) والرياضي (تشكيلة الفريق). اللغة العربية غنية بالمشتقات من الجذر (ش ك ل) وكذلك بألفاظ أخرى تدلّ على الترتيب المنظَّم."

  blind_candidates:
    - lemma: "تَشْكِيلَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ش ك ل) على وزن تَفْعِيلَة، وهي تاء الوحدة من تشكيل، تُستعمل في الجيولوجيا والعسكرية بمعنى formation، وفي الاستعمال العام بمعنى مجموعة مرتبة"
    - lemma: "صَفّ"
      generation_method: majaz
      justification: "الصفّ في الأصل السَّطر من الناس أو الأشياء، واستُعمل مجازاً في القرآن {إِنَّ اللَّهَ يُحِبُّ الَّذِينَ يُقَاتِلُونَ فِي سَبِيلِهِ صَفًّا} للدلالة على التنظيم القتالي المتراصّ"
    - lemma: "رَتْل"
      generation_method: majaz
      justification: "من الجذر (ر ت ل) الذي يدلّ على التناسق والانتظام، واستُعمل في اللغة العسكرية الحديثة للدلالة على رتل عسكري: مجموعة متحركة منظَّمة"
    - lemma: "تَكْوِين"
      generation_method: ishtiqaq
      justification: "مصدر كَوَّنَ من الجذر (ك و ن)، يُستعمل في الجيولوجيا والأحياء بمعنى formation: وحدة طبقية أو نباتية مؤلَّفة من عناصر متجانسة"

stage2_evidence:
  per_lemma:
    - lemma: "تَشْكِيل"
      confirm:
        - text: "«عدد أو مجموعة متجانسة من الأفراد أو الأشياء.»"
          source: "المعجم الكبير"
        - text: "«هاجم تشكيلٌ من الطائرات أهدافَ العدو.»"
          source: "المعجم الكبير (شاهد)"
        - text: "«التشكيل الوزارىّ, وتشكيلُ الفريق.»"
          source: "المعجم الكبير (شاهد)"
        - text: "«تشكيلُ لجنة الحكم على رسالة علميَّةٍ.»"
          source: "المعجم الكبير (شاهد)"
      expands:
        - text: "«وحدة طبقية مؤلفة من مجموعة من الطبقات ذات صفات صخرية معينة يسهل تمييزها في الحقل وتفيد في رسم الخرائط الجيولوجية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "يوسّع الاستعمال إلى المجال الجيولوجي"
        - text: "«تَشْكِيل — من (ش ك ل) التصوير ومنه الفنون التشكيلية، وضبط الكتاب بالشكل.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يوسّع الدلالة إلى التصوير والضبط الإعرابي"

    - lemma: "تَشْكِيلَة"
      confirm:
        - text: "«تشكيلة من طائرتين أو أكثر، تطير بطريقة بحيث تعطي حجيرات الإجراءات الإلكترونية المضادة ECM، المركبة أسفل كل منها، أقصى حماية متبادلة.»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
      contradicts:
        - text: "«مجموعة العناصر المادية والبرمجية المكونة لحاسوب»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          conflict: "تشكيلة في المعلوماتية تعني configuration لا formation"
        - text: "«هو عبارة عن إجمالي جميع السلع المقدمة من خلال الشركة»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "تشكيلة بمعنى assortment/تصنيف لا ترتيب يعمل كوحدة"

    - lemma: "صَفّ"
      contradicts:
        - text: "«صفّ — row / rang»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "الصفّ يدلّ على سطر أو صفّ واحد لا على تشكيل منظَّم يعمل كوحدة"
        - text: "«صف — queue / file d'attente»"
          source: "موسوعة الكهرباء (IEC 60050)"
          conflict: "الصفّ بمعنى الطابور، لا ترتيب يعمل كوحدة واحدة"

    - lemma: "رَتْل"
      expands:
        - text: "«الرتل: اتساق الشيء وانتظامه على استقامة.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المعنى الكلاسيكي يدلّ على الاتساق والانتظام، لا على مجموعة تعمل كوحدة"
      contradicts:
        - text: "«الرَّتَلُ، محرَّكةً: حُسْنُ تَناسُقِ الشيءِ، وبياضُ الأَسْنَانِ، وكَثْرَةُ مائِها»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الرَّتَل في المعاجم الكلاسيكية يدلّ على حسن التناسق لا على مجموعة منظمة"

    - lemma: "تَكْوِين"
      confirm:
        - text: "«في علم البيئة وحدة النبات الكبيرة التي تتألف منها جماعة الذروة في أرض تكون أهم خصائصها الشكلية متناسبة»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      contradicts:
        - text: "«تكوين — translation_en: formation»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "تكوين في الجيولوجيا مصطلح متخصص (وحدة طبقية)، ومعناه العام (إنشاء/تأسيس) لا يناسب ترتيب أشخاص يعملون كوحدة"

stage3_analysis:
  per_lemma:
    - lemma: "تَشْكِيل"
      decision: confirmed
      decision_reason: "لمّة مؤكدة بأدلة قوية من المعجم الكبير: التعريف «عدد أو مجموعة متجانسة من الأفراد أو الأشياء» يطابق معنى المجموعة الترادفية تماماً. والشواهد (تشكيلٌ من الطائرات، التشكيل الوزاري) تؤكد الاستعمال الحيّ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: "مصدر على وزن تَفْعِيل من الجذر (ش ك ل)، والوزن مناسب للدلالة على حدث التشكيل ونتيجته"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشْكِيل"

    - lemma: "تَشْكِيلَة"
      source: stage1
      decision: removed
      decision_reason: "أدلة مختلطة: تُستعمل بمعنى formation في العسكرية والجيولوجيا، لكن الاستعمال الغالب الحديث يميل إلى configuration (المعلوماتية) وassortment (التجارة). الاشتراك اللفظي يُضعف دقتها كمرادف لـ(تشكيل) في هذا السياق."
      evidence_assessment:
        case: mixed

    - lemma: "صَفّ"
      source: stage1
      decision: removed
      decision_reason: "الصفّ يدلّ على سطر واحد (row/queue)، وليس على ترتيب متكامل يعمل كوحدة واحدة. هو جزء من التشكيل لا مرادف له."
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَتْل"
      source: stage1
      decision: removed
      decision_reason: "المعنى الكلاسيكي (حسن التناسق/بياض الأسنان) لا يناسب المفهوم. والاستعمال العسكري الحديث (رتل = قافلة عسكرية) أخصّ من formation العام ولا يشمل التشكيل غير العسكري."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَكْوِين"
      source: stage1
      decision: removed
      decision_reason: "التكوين بمعناه العام يدلّ على الإنشاء والتأسيس (العملية) لا على الترتيب الناتج. واستعماله المصطلحي في الجيولوجيا والأحياء متخصص جداً. لا يصلح مرادفاً عاماً لتشكيل بمعنى ترتيب يعمل كوحدة."
      evidence_assessment:
        case: mixed

