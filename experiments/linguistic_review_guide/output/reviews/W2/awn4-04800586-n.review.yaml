# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة (عَدَم إِرْضَاء) تفتقر إلى الضبط الإعرابي الكامل؛ إذ ينبغي أن تُقرأ (عَدَمُ إِرْضَاءٍ) بضمة المضاف وكسرة التنوين على المضاف إليه"
      - "اللمّة (عَدَم إِرْضَاء) تُعبِّر عن الجانب الانطباعي للقصور من منظور المتلقي أكثر من كونها مصطلحاً راسخاً لـ(unsatisfactoriness) بوصفه صفةً ملازمةً للشيء"
      - "التعريف الحالي (صفة كون الشيء غير ملائم أو غير مناسب) ترجمة آلية حرفية، يفتقر إلى الجنس القريب والفصل النوعي بأسلوب المعجم"
    observations: "المجموعة تُمثّل مفهوماً مجرداً من مجال الجودة والتقييم، وهو ضد المجموعة التي تُعبِّر عن الكفاءة والملاءمة. اللمّة (قُصُور) هي العمود الفقري للمجموعة؛ جذرها (قصر) يدلّ في أصله على عدم بلوغ الشيء مداه كما أثبته ابن فارس، وهي مستعملة في المعاجم المتخصصة الحديثة للتعبير عن (inadequacy/insufficiency/deficiency). أما (عَدَم إِرْضَاء) فمركب إضافي يُعبِّر عن انعدام الإرضاء من حيث الأثر في المتلقي، وهو صحيح لكنه أقل رسوخاً من (قُصُور) كمصطلح ثابت. الفجوة في المجموعة هي غياب لمّة تُعبِّر بدقة عن (unsuitability) بمعنى انعدام الصلاحية الذاتية للشيء."
  blind_candidates:
    - lemma: "قَاصِرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الصفة (قاصر) على وزن فَاعِلِيَّة، قياساً على نظائر مستعملة كـ(محافظية وفاعلية)، يُعبِّر عن صفة القصور وعدم الاستيفاء كسمة ملازمة للشيء، مقابل (inadequacy) بما هي خاصية بنيوية"
    - lemma: "عَدَمُ الصَّلَاحِيَّة"
      generation_method: tarkib
      justification: "تركيب إضافي من (عدم) و(الصلاحية)؛ يُعادل (unsuitability) مباشرةً إذ يُفيد انعدام صلاحية الشيء للغرض المقصود، وهو من الأنماط الإضافية المنتجة في العربية الحديثة"
    - lemma: "دُونِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الظرف (دون) على وزن فُعْلِيَّة، يُعبِّر عن صفة النزول عن المستوى المطلوب وعدم الكفاءة، كالمعنى الضمني في (دون المستوى)"
    - lemma: "ضَحَالَة"
      generation_method: majaz
      justification: "من (ضَحْل) بمعنى الماء الرقيق القليل العمق، أُزيح دلالياً للتعبير عن ضآلة المحتوى وعدم الوفاء بالمتطلبات، كما في (ضحالة الفكر وضحالة المعلومات)"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "قُصُور"
      confirm:
        - text: "«قصور — translation_en: inadequacy — domain: Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
        - text: "«قُصُور — translation_en: insufficiency»"
          source: "المعجم الطبي الموحد (ArabTerm، 2009)"
        - text: "«قُصُور — translation_en: deficiency»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
        - text: "«القُصور: العجزُ.»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
        - text: "«القُصورُ: الخلوُّ عن المعاني الباعثة على تحري الخيرات والفضائل، وعدم التمكن من أسبابها.»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
        - text: "«(1) عدم كفاية [أخلاقية أو عقلية]. (2) نقص؛ قصور [في المؤن إلخ]. (3) القصور: عجز عضو من أعضاء الجسد عن أداء وظيفته بصورة سوية — translation_en: insufficience|insufficiency»"
          source: "المورد الحديث (2008)"
        - text: "«حالة نقص الأداء مثل: قصور الكظر insufficiency, adrenal ... قصور القلب insufficiency, cardiac: نقص كفاءة عضلة القلب.»"
          source: "معجم المصطلحات الطبية ج.3 (ArabTerm، 1997)"
      expands:
        - text: "«قُصُور — translation_en: inertia — domain: Transport and Infrastructure»"
          source: "المعجم الموحد لمصطلحات النقل (ArabTerm، 2010)"
          addition: "يُشير إلى امتداد دلالة (قصور) في الفيزياء إلى معنى (القصور الذاتي/inertia)، وهو معنى تقني مختلف يُعزِّز ثراء الجذر لكنه خارج نطاق هذه المجموعة"

    - lemma: "عَدَم إِرْضَاء"
      expands:
        - text: "«الرِّضَا: ضد السخط»"
          source: "المعجم الكبير"
          addition: "يُثبت أن جذر (رضو/رضي) يحمل دلالة الارتياح والقبول، فعَدَم الإرضاء ينعكس على هذه الدلالة ليُفيد انعدام الارتياح والقبول"
        - text: "«الرِّضَا: طيب النفس فيما يصيبه، ويفوته مع عدم التغير.»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يُوضح أن الإرضاء يرتبط بإحداث حالة الطيب النفسي، وعدم الإرضاء هو إخفاق في تحقيق هذه الحالة"
      contradicts:
        - text: "«لاملاءمة / نقص؛ عدم كفاية. — translation_en: inadequacy»"
          source: "المورد الحديث (2008)"
          conflict: "المورد الحديث يُترجم (inadequacy) بـ(لاملاءمة) و(نقص؛ عدم كفاية)، وليس بـ(عدم إرضاء)؛ مما يُشير إلى أن المصطلح الأكثر تداولاً للمفهوم هو (قصور/عدم كفاية) لا (عدم إرضاء)"

    - lemma: "قَاصِرِيَّة"
      evidence_status: "no_material_found"

    - lemma: "عَدَمُ الصَّلَاحِيَّة"
      contradicts:
        - text: "«الصلاحية: الاتساق في عمل ما. الصلاحية للعمل: حسن التهيؤ له. الصلاحية لذي السلطان: مدى ما يخوله القانون التصرف فيه.»"
          source: "المعجم الوسيط"
          conflict: "الصلاحية في المعاجم العربية تُفيد الإيجابية (الكفاءة والاتساق والتهيؤ)، وهي بعيدة في حقلها الدلالي عن معنى (inadequacy/unsatisfactoriness)؛ كما أن عدم الصلاحية في المعاجم المتخصصة قد يوحي بانتهاء صلاحية الاستعمال لا بانعدام الملاءمة النوعية"
        - text: "«صَلاَحِيَة/صَلاَحِيَّة — translation_en: validity — domain: Mathematics and Astronomy»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ArabTerm)"
          conflict: "في السياق التقني يُقابل (صلاحية) مصطلحَ (validity) لا (suitability/adequacy)؛ مما يُربك الاستعمال"

    - lemma: "دُونِيَّة"
      contradicts:
        - text: "«دُونيَّة: من (د و ن) مؤنث الدُّوني.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "دونية في قاعدة البيانات مُسجَّلة فقط كاسم علم (proper name) للإناث، مستمدة أصلاً من اللاتينية بمعنى هبة ومنحة، وليس لها وجود معجمي بمعنى النزول عن المستوى في المعاجم الفصيحة"

    - lemma: "ضَحَالَة"
      contradicts:
        - text: "«الضَّحالةُ: السَّطحِيَّةُ. يُقال: ضحالةُ الفِكر، وضحالةُ المعلومات.»"
          source: "المعجم الكبير"
          conflict: "ضحالة تُفيد السطحية وقلة العمق في التفكير، وهو معنى مجازي مشتق من قلة الماء، يختلف جوهرياً عن القصور الوظيفي وعدم الملاءمة الذي تُعبِّر عنه المجموعة"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "قُصُور"
      decision: confirmed
      decision_reason: "لمّة فصيحة راسخة تُعادل (inadequacy/insufficiency/deficiency) في المعاجم العربية المتخصصة والكلاسيكية على حدٍّ سواء. جذرها (قصر) يحمل الدلالة الأصلية بأقوى صورة: عدم بلوغ الشيء مداه ونهايته. مستعملة في سياقات التقييم والجودة والطب والاجتماع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُؤكِّد الجانبَ البنيوي والوظيفي للقصور — انعدام الكفاءة الذاتية في الشيء وعدم بلوغه مستواه المطلوب — وهو أعمّ وأشمل من أخته في المجموعة"

    - lemma: "عَدَم إِرْضَاء"
      decision: confirmed
      decision_reason: "مركب إضافي صحيح يُعبِّر عن انعدام الإرضاء وإخفاق الشيء في تحقيق الارتياح النفسي المأمول، مما يُشكّل وجهاً مكمِّلاً لقصور الشيء من منظور المتلقي. يحتاج تصحيح الضبط الإعرابي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُركِّز على الأثر التقييمي لدى المتلقي — إخفاق الشيء في تلبية توقعاته وإحداث رضاه — بخلاف (قُصُور) الذي يُعبِّر عن القصور الذاتي البنيوي في الشيء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ إِرْضَاءٍ"

    - lemma: "قَاصِرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أساس معجمي موثَّق لهذا المصدر الصناعي في قواعد البيانات المستعلَمة. صياغته جائزة قياسياً لكنها تفتقر إلى التثبيت المعجمي اللازم، والمفهوم مُغطَّى بـ(قُصُور) بصورة أوفى وأرسخ."

    - lemma: "عَدَمُ الصَّلَاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: "في المعاجم العربية تُفيد (صلاحية) الكفاءة والتهيؤ والسلطة القانونية أكثر مما تُفيد الملاءمة للغرض الدلالي الذي تُعبِّر عنه هذه المجموعة. كما أن (عدم الصلاحية) في السياقات التقنية يُحيل إلى انتهاء صلاحية الاستعمال (expiry) لا إلى انعدام الملاءمة النوعية."

    - lemma: "دُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تُثبت أن (دونية) في العربية المعاصرة مسجَّلة كاسم علم للإناث مستمَدّ من اللاتينية، ولا تُستعمل في الفصحى المعيارية بمعنى انعدام الكفاءة أو النزول عن المستوى."

    - lemma: "ضَحَالَة"
      source: stage1
      decision: removed
      decision_reason: "الضحالة معجمياً تُعني السطحية وقلة العمق (ضحالة الفكر، ضحالة المعلومات)، وهو معنى مجازي مختلف جذرياً عن (inadequacy/unsatisfactoriness). استعمالها في هذه المجموعة سيُحدث التباساً دلالياً مع مفهوم السطحية الفكرية."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
