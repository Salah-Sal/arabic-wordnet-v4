# مراجعة المجموعة الترادفية — awn4-08386147-n
# descendants / posterity — أحفاد، ذُرِّيَّة، نَسْل
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «أحفاد» بدون تشكيل وتحتاج إلى ضبط كامل"
      - "«أحفاد» جمع حفيد، ودلالتها الأصلية أضيق من المفهوم (أولاد الأولاد لا كل النسل)، لكنها توسّعت في الاستعمال المعاصر"
      - "المفردة الواسطية بين الثلاث هي «ذُرِّيَّة» (لفظ قرآني جامع)، و«نَسْل» (أعمّ بيولوجيًّا)"
    observations: >
      المجموعة تمثّل مفهوم مجموع المتحدّرين من سلف واحد، وهو مفهوم أصيل في الثقافة العربية
      ترتبط به ألفاظ قرآنية وتراثية كثيرة. اللمّات الثلاث الموجودة تغطي الدلالة جيدًا،
      لكن يمكن النظر في إضافة «عَقِب» لورودها في القرآن والمعاجم الكلاسيكية بمعنى
      نسل الرجل والباقين بعده.
  blind_candidates:
    - lemma: "سُلَالَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر س-ل-ل على وزن فُعَالَة، بمعنى ما انسلّ من الشيء، والولد.
        وردت في المعاجم بمعنى النطفة والولد والنوع البيولوجي.
    - lemma: "عَقِب"
      generation_method: ishtiqaq
      justification: >
        من الجذر ع-ق-ب على وزن فَعِل، بمعنى الولد وولد الولد والباقون بعد الرجل.
        لفظ قرآني: «وَجَعَلَهَا كَلِمَةً بَاقِيَةً فِي عَقِبِهِ». يدلّ على النسل المتعاقب.
    - lemma: "خَلَف"
      generation_method: ishtiqaq
      justification: >
        من الجذر خ-ل-ف على وزن فَعَل، بمعنى من يأتي بعد من مضى قائمًا مقامه.
        قال ابن فارس: أن يجيء شيء بعد شيء يقوم مقامه.
    - lemma: "أَخْلَاف"
      generation_method: ishtiqaq
      justification: >
        جمع خَلَف، يُستعمل للدلالة على الأجيال اللاحقة والذرية.
        ورد في المورد الحديث ترجمةً لـ posterity: «الذُّرِّيّة؛ الأخلاف».


stage2_evidence:
  per_lemma:
    - lemma: "أَحْفَاد"
      confirm:
        - text: "«أوردت المعاجم «حَفَدة»، و«حُفَدَاء» جمعين لـ«حَفِيد»، ويمكن تصحيح «أحفاد» اعتمادًا على قرار مجمع اللغة المصري بإجازة جمع «حَفِيد» على «أحفاد»»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«الْحَاءُ وَالْفَاءُ وَالدَّالُ أَصْلٌ يَدُلُّ عَلَى الْخِفَّةِ فِي الْعَمَلِ، وَالتَّجَمُّعِ. فَالْحَفَدَةُ: الْأَعْوَانُ... وَيُقَالُ الْحَفَدَةُ وَلَدُ الْوَلَدِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي أوسع من دلالة أولاد الأولاد فقط، ويشمل الأعوان والأختان"

    - lemma: "ذُرِّيَّة"
      confirm:
        - text: "«نَسْلُ الثَّقَلَيْن, مِن الجِنِّ والإِنْس, وقد تُطْلَق على الآباء والأُصولِ أيضًا, فهى مِن الأضْدادِ. وقد يُرادُ بها النِّساءُ»"
          source: "المعجم الكبير"
        - text: "«وَلَدُ الرجُلِ, وهو اسمٌ يَجْمَعُ نَسْلَ الإنسانِ من ذَكَرٍ وأُنْثى»"
          source: "المعجم الكبير"
        - text: "«(الذُّرِّيَّة) نسل الْإِنْسَان وَالنِّسَاء وَالصغَار»"
          source: "المعجم الوسيط"
        - text: "«(الذُّرِّيَّة) النَّسْل (وَأَصلهَا ذريئة فخففت الْهمزَة) (ج) ذَرَارِي»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الذَّالُ وَالرَّاءُ وَالْهَمْزَةُ أَصْلَانِ: أَحَدُهُمَا لَوْنٌ إِلَى الْبَيَاضِ، وَالْآخَرُ كَالشَّيْءِ يُبْذَرُ وَيُزْرَعُ... ذَرَأَ اللَّهُ الْخَلْقَ يَذْرَؤُهُمْ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ذرأ يدلّ على البذر والخلق، فالذرية مأخوذة من خلق الله للبشر"

    - lemma: "نَسْل"
      confirm:
        - text: "«الولد والذُّرِّيَّة»"
          source: "المعجم الوسيط"
        - text: "«(النَّسْل) الْوَلَد والذرية (ج) أنسال»"
          source: "المعجم الوسيط (هوراماني)"
        - text: "«النَّسْلُ: الخَلْقُ، والوَلَدُ، كالنَّسيلَة، ج: أنْسالٌ. نَسَلَ: وَلَدَ، كأَنْسَلَ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«النسل: الولد. لأنه يُنسل من والدته. وتناسلوا: وُلد بعضهم من بعض»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«النُّونُ وَالسِّينُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَلِّ شَيْءٍ وَانْسِلَالِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يدلّ على انسلال الشيء وخروجه، فالولد ينسلّ من أمه"
        - text: "«ذُرِّية، نَسْل: النسل المولد عن تزاوج معين أو بين أعضاء العائلة الحياتية الواحدة الذين تولدوا من نفس الأم والأب»"
          source: "المعجم الموحد لمصطلحات علم الوراثة"
          addition: "يُستعمل في السياق العلمي البيولوجي مرادفًا لذرية"

    - lemma: "سُلَالَة"
      contradicts:
        - text: "«ما اسْتُلَّ من الشيء وانتزع. النطفة. جماعةٌ من الكائنات الحية تتفق فى صفاتها العرفية الموروثة»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية هي السلالة بمعنى العرق أو النوع البيولوجي، لا مجموع المتحدّرين من سلف بعينه"
      expands:
        - text: "«الوَلَدُ. وقيل: الوَلَدُ حين يخرجُ من بطن أُمِّه. النوعُ»"
          source: "المعجم الكبير"
          addition: "وُجد معنى الولد لكنه ثانوي، والمعنى الغالب هو النوع والنطفة"

    - lemma: "عَقِب"
      confirm:
        - text: "«عظم مؤخر القدم. آخر كل شيء. الولد. ولد الولد الباقون بعده»"
          source: "المعجم الوسيط"
        - text: "«العَقْبُ: الجَرْيُ بَعْدَ الجَرْيِ، والوَلَدُ، وولَدُ الوَلَدِ. كالعَقِبِ... والعاقِبَةُ: الوَلَدُ، وآخِرُ كُلِّ شيءٍ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«العَقِب: هو الخلف ويُطلق على مؤخر القدم وفي الوصية: هو الذين يعقبونه أي يَبْقوْنَ موت الموصي وعَقِبُ الرجل نسلُه»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: "«الْعَيْنُ وَالْقَافُ وَالْبَاءُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى تَأْخِيرِ شَيْءٍ وَإِتْيَانِهِ بَعْدَ غَيْرِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على التعاقب والمجيء بعد، فالعقب هو ما يأتي بعد السلف"

    - lemma: "خَلَف"
      contradicts:
        - text: "«الْخَاءُ وَاللَّامُ وَالْفَاءُ أُصُولٌ ثَلَاثَةٌ: أَحَدُهَا أَنْ يَجِيءَ شَيْءٌ بَعْدَ شَيْءٍ يَقُومُ مَقَامَهُ، وَالثَّانِي خِلَافُ قُدَّامٍ، وَالثَّالِثُ التَّغَيُّرُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الدلالة الأساسية هي الخلافة والقيام مقام من سبق، لا مجموع النسل والذرية"
      expands:
        - text: "«القَرْنُ من النَّاسِ. من جاءَ بعد الأَوَّل, والتّابِعُ لمن مَضَى»"
          source: "المعجم الكبير"
          addition: "يمكن أن يعني الجيل اللاحق، لكنه أوسع من مجرد النسل البيولوجي"

    - lemma: "أَخْلَاف"
      confirm:
        - text: "«(1) الذُّرِّيّة؛ الأخلاف (2) الأجيال القادمةُ كلُّها»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الخِلْفُ: الواحد من أخلاف الضرع»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "أخلاف الضرع معنى مختلف تمامًا، والصيغة ملتبسة"


stage3_analysis:
  per_lemma:
    - lemma: "أَحْفَاد"
      decision: confirmed
      decision_reason: >
        جمع حفيد أقرّه مجمع اللغة المصري، واستقرّ في الاستعمال المعاصر بمعنى
        المتحدّرين من سلف. ورد في المعاجم وتوسّعت دلالته لتشمل كل النسل
        لا أولاد الأولاد فحسب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على صلة القرابة العائلية المباشرة، ويُستعمل غالبًا في السياق
        الاجتماعي والعاطفي. أضيق دلالةً من «ذُرِّيَّة» لأنه يستحضر علاقة
        الأجداد بالأحفاد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَحْفَاد"

    - lemma: "ذُرِّيَّة"
      decision: confirmed
      decision_reason: >
        لفظ قرآني أصيل جامع لنسل الإنسان من ذكر وأنثى. أوسع ألفاظ المجموعة
        وأكثرها شيوعًا في الفصحى. ورد في عشرات الآيات القرآنية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ ألفاظ المجموعة وأشيعها، لفظ قرآني يجمع نسل الإنسان من ذكر وأنثى.
        يُستعمل في السياقات الدينية والأدبية والرسمية. قد يُراد بها النساء
        والصغار في بعض السياقات.
      actions: []

    - lemma: "نَسْل"
      decision: confirmed
      decision_reason: >
        لفظ فصيح شائع بمعنى الولد والذرية. يتميّز بكونه أعمّ من حيث الكائنات
        الحية (يشمل الإنسان والحيوان)، ومستعمل في المصطلحات العلمية الحديثة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يتميّز بالاستعمال في السياق البيولوجي والعلمي، فيشمل نسل الإنسان والحيوان
        والنبات. يُفضَّل في المصطلحات العلمية (علم الوراثة، الطب البيطري).
        أقلّ حميميةً من «أحفاد» وأقلّ قرآنيةً من «ذرية».
      actions: []

    - lemma: "سُلَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        دلالتها الأساسية في المعاجم المعاصرة هي النوع البيولوجي أو العرق
        (جماعة من الكائنات الحية تتفق في صفاتها الموروثة)، وهو مفهوم مختلف
        عن مجموع المتحدّرين من سلف بعينه. معنى الولد فيها ثانوي قديم.

    - lemma: "عَقِب"
      source: stage1
      decision: confirmed
      decision_reason: >
        ورد في المعجم الوسيط بمعنى «الولد وولد الولد الباقون بعده»، وفي
        التعريفات الفقهية «عَقِبُ الرجل نسلُه»، وفي القرآن «وَجَعَلَهَا
        كَلِمَةً بَاقِيَةً فِي عَقِبِهِ». لفظ تراثي فصيح يُثري المجموعة
        بنُكتة دلالية مميزة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على البقاء والتعاقب بعد السلف. يُستعمل في السياق الفقهي
        والقانوني (الوصايا والمواريث) وفي الأدب القديم. يحمل دلالة الاستمرار
        والامتداد الزمني أكثر من مجرد الإنجاب.
      actions:
        - command: create_entry
          params:
            lemma: "عَقِب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08386147-n"

    - lemma: "خَلَف"
      source: stage1
      decision: removed
      decision_reason: >
        دلالتها الأولى الخلافة والقيام مقام من سبق، وهو مفهوم أوسع من النسل
        البيولوجي. كثرة معانيها (نقيض قدّام، التغيّر، الوعد المخلوف) تجعلها
        ملتبسة. معنى «الولد» فيها مقيّد بالصلاح أو الطلاح.

    - lemma: "أَخْلَاف"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة ملتبسة مع أخلاف الضرع، ولم ترد بهذا المعنى في المعاجم التراثية
        إلا في ترجمات حديثة. لا تضيف نُكتة دلالية مميزة على ما في المجموعة.


