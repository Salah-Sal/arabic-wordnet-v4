      maqayis_quote: "«فَأَمَّا الْعَهْدُ فَإِنَّهُ يُسَمَّى ذِمَامًا لِأَنَّ الْإِنْسَانَ يُذَمُّ عَلَى إِضَاعَتِهِ مِنْهُ.»"
