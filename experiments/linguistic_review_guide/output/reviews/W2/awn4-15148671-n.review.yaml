stage1_review:
  assessment:
    concerns:
      - "اللمّة 'متصل' قد تُقرأ كصفة (muttaṣil) بينما السياق يتطلب اسماً (muttaṣal) للتعبير عن المفهوم الفلسفي/العلمي."
      - "اللمّة 'استمرارية' تعبر عن الخاصية (continuity) أكثر من تعبيرها عن الكيان المستمر نفسه (continuum) في بعض السياقات التقنية."
    observations: "المفهوم يعبر عن 'المتصل' في الفلسفة والفيزياء، وهو الكيان الذي لا فواصل بين أجزائه. المصطلح العربي التراثي 'المتصل' يطابق تماماً تعريف 'continuum' في السياق الزماني أو الرياضي."
  blind_candidates:
    - lemma: "مُتَّصَل"
      generation_method: ishtiqaq
      justification: "الاسم المشتق من 'وصل' ليدل على المكان أو الكيان الذي يتصل فيه كل شيء بغيره، وهو المصطلح المعياري لترجمة 'continuum' فلسفياً وعلمياً."
    - lemma: "اِسْتِمْرَارِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'استمر'، يشيع استخدامه في العربية المعاصرة للدلالة على التواصل وعدم الانقطاع."
    - lemma: "تَتَابُع"
      generation_method: ishtiqaq
      justification: "مصدر من 'تتابع'، يعبر عن توالي الأجزاء دون فواصل، وهو ما يغطي شق 'succession' في التعريف الإنجليزي."
    - lemma: "مَدًى"
      generation_method: majaz
      justification: "كلمة تعبر عن الامتداد والفسحة، وتستخدم دلالياً للتعبير عن الحيز الذي يشغله المستمر."

stage2_evidence:
  per_lemma:
    - lemma: "مُتَّصَل"
      confirm:
        - text: "«المتَّصلُ: مَا من شَأْنه أَن يُوجد بَين أَجْزَائِهِ حد مُشْتَرك، وَقيل: الْقَابِل للانقسام بِغَيْر نِهَايَة.»"
          source: "مقاليد العلوم للسيوطي"
        - text: "«المُتَّصِل: «أ» كمية أو سلسلة متّصلة. «ب» مجموعة مترابطة متراصّة (ر).»"
          source: "المورد الحديث"
      expands:
        - text: "«متصل زماني مكاني: continuum of space-time»"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
    - lemma: "اِسْتِمْرَارِيَّة"
      confirm:
        - text: "«استمرارية: continuity»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
    - lemma: "تَتَابُع"
      confirm:
        - text: "«تتابع: succession»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
        - text: "«ترادفت وتواصلت وتتابعت وتوالت وتواترت وتعاقبت...»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
    - lemma: "مَدًى"
      confirm:
        - text: "«الْوَصِيلَةُ: الْأَرْضُ الْوَاسِعَةُ، كَأَنَّهَا وُصِلَتْ فَلَا تَنْقَطِعُ.»"
          source: "مقاييس اللغة (بمعنى الامتداد المتصل)"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "متصل"
      decision: confirmed
      decision_reason: "هو المصطلح المعياري الفلسفي والعلمي لترجمة continuum، ويؤيده تعريف السيوطي في مقاليد العلوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَّصَل"
    - lemma: "استمرارية"
      decision: confirmed
      decision_reason: "مصطلح شائع جداً في العربية المعاصرة للتعبير عن مفهوم التواصل وعدم الانقطاع في الزمن والأحداث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِمْرَارِيَّة"
    - lemma: "تَتَابُع"
      source: stage1
      decision: confirmed
      decision_reason: "يغطي الجانب المتسلسل من مفهوم الـ continuum الوارد في التعريف (succession)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَتَابُع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَدًى"
      source: stage1
      decision: confirmed
      decision_reason: "يغطي جانب الامتداد (extent) الوارد في التعريف، ويستخدم للتعبير عن الحيز المستمر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَدًى", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "كل مستمر غير مكاني أو مدى أو تتابع لا يكون فيه أي جزء أو قسم متميزاً أو قابلاً للتمييز عن الأجزاء المجاورة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية ركيكة. يفضل استخدام صياغة معجمية عربية أصيلة تعبر عن المفهوم الفلسفي واللغوي."
    authored:
      - type: terminological
        text: "مَوْجُودٌ كُلِّيٌّ مُسْتَمِرٌّ لا انْقِطَاعَ فيهِ، بحَيْثُ يَشْتَرِكُ كُلُّ جُزْءٍ مِنْهُ مَعَ ما يُجاوِرُهُ في حَدٍّ مُشْتَرَكٍ، ولا تَمَيُّزَ بَيْنَ أَجْزائِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مَوْجُودٌ كُلِّيٌّ مُسْتَمِرٌّ لا انْقِطَاعَ فيهِ، بحَيْثُ يَشْتَرِكُ كُلُّ جُزْءٍ مِنْهُ مَعَ ما يُجاوِرُهُ في حَدٍّ مُشْتَرَكٍ، ولا تَمَيُّزَ بَيْنَ أَجْزائِهِ."}
  examples:
    per_lemma:
      - lemma: "مُتَّصَل"
        examples:
          - text: "يُعَدُّ الزَّمَنُ مُتَّصَلًا لا يُمْكِنُ تَقْسِيمُهُ إِلى لَحَظاتٍ مُنْفَصِلَةٍ تَمامًا."
            type: usage
      - lemma: "اِسْتِمْرارِيَّة"
        examples:
          - text: "تُؤَمِّنُ الذاكِرَةُ استِمْرارِيَّةَ الهُوِيَّةِ الشَّخْصِيَّةِ عَبْرَ الزَّمَنِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُمَثِّلُ الوَعْيُ البَشَرِيُّ تَتَابُعًا مُسْتَمِرًّا مِنَ الأَفْكارِ والمَشاعِرِ."}

