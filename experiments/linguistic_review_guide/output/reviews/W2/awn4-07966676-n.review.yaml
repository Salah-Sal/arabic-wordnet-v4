# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-07966676-n (pocket: a small isolated group of people)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «بُؤْرَة» معناها الأصلي الحفرة وبؤرة الأشعة (Focus)، ولا علاقة لها بمعنى «مجموعة صغيرة معزولة من الناس»"
      - "لمّة «جَيْب» معناها الأصلي فتحة القميص (طوقه)، واستعمالها بمعنى «جيب مقاومة» توسّع دلالي حديث"
      - "المجموعة تفتقر إلى لمّة عربية أصيلة تدلّ صراحةً على الجماعة القليلة المنقطعة كـ«شِرْذِمَة»"
    observations: "المفهوم (مجموعة صغيرة ومعزولة من الناس) له مقابل عربي تراثي دقيق هو «شِرْذِمَة» الذي يجمع بين القلّة والانقطاع. أمّا اللمّتان الموجودتان فكلتاهما مجازيّتان: «بؤرة» مأخوذة من الفيزياء، و«جيب» من اللباس ثم الجيولوجيا. لفظ «جيب» أقرب دلاليًّا لأنه يحمل معنى الاحتواء والعزلة المكانية، بينما «بؤرة» تدلّ على المركز لا على العزلة."
  blind_candidates:
    - lemma: "شِرْذِمَة"
      generation_method: ishtiqaq
      justification: "من الجذر ش-ر-ذ-م، تعني القليل من الناس والجماعة المنقطعة. وردت في القرآن: {إِنَّ هَؤُلَاءِ لَشِرْذِمَةٌ قَلِيلُونَ}. تجمع بين دلالتَيِ القلّة والانقطاع، فهي أدقّ مقابل عربي للمفهوم."
    - lemma: "ثُلَّة"
      generation_method: ishtiqaq
      justification: "من الجذر ث-ل-ل، تعني الجماعة من الناس. وردت في القرآن: {ثُلَّةٌ مِنَ الْأَوَّلِينَ}. لكنها تدلّ على الجماعة دون تخصيص بالقلّة أو العزلة."
    - lemma: "عُصْبَة"
      generation_method: ishtiqaq
      justification: "من الجذر ع-ص-ب بمعنى الربط والشدّ، تعني الجماعة من الناس (عشرة فما فوق عند الخليل). لكنها تحمل دلالة التماسك والقرابة لا العزلة."
    - lemma: "فِلْذَة"
      generation_method: majaz
      justification: "من الجذر ف-ل-ذ بمعنى القطع، القطعة المفصولة من الكلّ. مجازاً: جماعة مقتطعة ومنفصلة عن مجتمعها الأكبر. لكنها في الأصل للأجسام المادية (كبد، لحم، ذهب) لا للبشر."


stage2_evidence:
  per_lemma:
    - lemma: "بُؤْرَة"
      contradicts:
        - text: "«الحفرة الحفرة توقد فيها النار ما يُدَّخَر (فى علم الطبيعة): نقطة تتلاقى أو تفترق عندها الأشعَّة الضوئِيَّة أو الحرارية أو الصوتية»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي حفرة أو نقطة بؤرية فيزيائية، لا علاقة له بمجموعة من الناس"
        - text: "«الحفرة يُطْبَخُ فيها، وقيل: هي موقد النار ما خُبِيءَ وادخر في علم الفيزياء (Focus): نقطة تتلاقى عندها - أو تتفرق منها - الأشعة الضوئية»"
          source: "المعجم الكبير"
          conflict: "التعريف مقصور على الحفرة والبؤرة الفيزيائية، لا يذكر دلالة اجتماعية"
      expands:
        - text: "«نقطة في عمق القشرة الأرضية حيث تتفكك الصخور مسببة حدوث زلزال»"
          source: "مسرد المناخ والبيئة"
          addition: "توسّع علمي حديث (focus/epicenter) يبقى في مجال الفيزياء والجيولوجيا لا البشر"

    - lemma: "جَيْب"
      confirm:
        - text: "«تعبير يصف جسمًا صغيرًا من الخام في الجيولوجيا الاقتصادية ويعدّ جزءًا منتفخًا من العرق»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
      expands:
        - text: "«جَيْبُ الأَرضِ: مَدْخَلُها. قال ذو الرمة: طَواها إلى حَيْزومِها وانْطَوَتْ لها جُيوبُ الفَيافي حَزْنُها ورِمالُها»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "دلالة «جيب الأرض» على المدخل والتجويف المكاني تدعم التوسّع إلى الجيب البشري المعزول"
        - text: "«كيس صغير، عادة ما يكون مخروطي الشكل، يستخدم في بعض الملابس»"
          source: "مسرد صناعة النسيج"
          addition: "المعنى الحديث للجيب (pocket) الذي انتقل مجازيًّا إلى الاستعمال العسكري والاجتماعي"
        - text: "«الجَيْبُ جَيْبُ القَمِيصِ. يُقَالُ جِبْتُ القَمِيصَ قَوَّرْتُ جَيْبَهُ، وَجَيَّبْتُهُ جَعَلْتُ لَهُ جَيْبًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي (التقوير والقطع) يسند مجاز الاحتواء والعزلة"

    - lemma: "شِرْذِمَة"
      confirm:
        - text: "«الشِّرْذِمَةُ، بالكسر: القليلُ من الناسِ، والقِطْعَةُ من السَّفَرْجَلَةِ وغيرِها ج: شَراذِمُ وشَراذيمُ. وثيابٌ شَراذِمُ: أخلاقُ مُتَقَطِّعَةٌ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الشرذمة: جماعة منقطعة من قولهم ثوب شراذم أي متقطع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الشرذمة) القطعة من الشيء ويقال شرذمة من الناس جماعة قليلة وفي التنزيل العزيز {إِنَّ هَؤُلَاءِ لَشِرْذِمَةٌ قَلِيلُونَ} (ج) شراذم»"
          source: "المعجم الوسيط"

    - lemma: "ثُلَّة"
      confirm:
        - text: "«(الثلَّة) الجماعة من الناس وفي التنزيل العزيز {ثلة من الأولين وقليل من الآخرين}»"
          source: "المعجم الوسيط"
        - text: "«الثلة: قطعة مجتمعة من صوف، ولذلك قيل في الغنم ثلة ولاعتبار الاجتماع، قيل {ثُلَّةٌ مِنَ الْأَوَّلِين}»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«وبالضم: الجماعةُ مِنَّا، والكثيرُ من الدَّراهِمِ»"
          source: "القاموس المحيط"
          conflict: "الثُّلَّة تدلّ على الجماعة مطلقاً دون تخصيص بالقلّة أو العزلة، بل قد تدلّ على الكثرة"

    - lemma: "عُصْبَة"
      contradicts:
        - text: "«(العصبة) الجماعة من الناس أو الخيل أو الطير... عصبة الرجل بنوه وقرابته لأبيه أو قومه الذين يتعصبون له وينصرونه»"
          source: "المعجم الوسيط"
          conflict: "العصبة تحمل دلالة القرابة والتماسك والتعصّب، لا العزلة والانقطاع. والمعنى الشرعي (الوراثة بالتعصيب) يطغى"
      expands:
        - text: "«الْعُصْبَةُ، قَالَ الْخَلِيلُ: هُمْ مِنَ الرِّجَالِ عَشَرَةٌ، وَلَا يُقَالُ لِمَا دُونَ ذَلِكَ عُصْبَةٌ. وَإِنَّمَا سُمِّيَتْ عُصْبَةً لِأَنَّهَا قَدْ عُصِبَتْ، أَيْ كَأَنَّهَا رُبِطَ بَعْضُهَا بِبَعْضٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "العصبة عند الخليل لا تقلّ عن عشرة، والأصل فيها الربط والشدّ لا الانقطاع"

    - lemma: "فِلْذَة"
      contradicts:
        - text: "«القطعة من الكبد واللحم والذهب والفضة أفلاذُ الأكباد: الأولاد أفلاذُ الأرض: كنوزها»"
          source: "المعجم الوسيط"
          conflict: "الفلذة للأجسام المادية المقطوعة (كبد، لحم، معادن)، ولا تُستعمل لمجموعة من الناس"
        - text: "«الْفَاءُ وَاللَّامُ وَالذَّالُ أُصَيْلٌ يَدُلُّ عَلَى قَطْعِ شَيْءٍ مِنْ شَيْءٍ. مِنْ ذَلِكَ الْفِلْذَةُ: الْقِطْعَةُ مِنَ الْكَبِدِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الاشتقاقي محصور في القطع المادي"


stage3_analysis:
  per_lemma:
    - lemma: "بُؤْرَة"
      decision: removed
      decision_reason: "بُؤْرَة تعني في المعاجم الحفرةَ وموقدَ النار، وفي الاصطلاح الحديث نقطةَ التقاء الأشعة (Focus). استعمالها بمعنى «مجموعة صغيرة معزولة من الناس» لا سند له في المعاجم العربية؛ فهي تدلّ على المركز والنقطة البؤرية لا على جماعة بشرية منعزلة. ربط اللمّة بهذا المعنى نقلٌ حرفي عن الإنجليزية (pocket/focus) دون مراعاة الفرق الدلالي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جَيْب"
      decision: confirmed
      decision_reason: "جَيْب في أصله فتحة القميص وتجويفه، ثم توسّع في العربية الحديثة إلى الكيس (pocket) وإلى الجيب الجغرافي والعسكري (جيب مقاومة، جيب سكّاني). دلالة الاحتواء المكاني والعزلة عن المحيط تسند استعماله لمجموعة صغيرة محاصرة أو منعزلة. ابن سيده ذكر «جَيْبُ الأرض: مدخلها» ممّا يعطي سنداً تراثيًّا للتوسّع المكاني."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد المكاني: مجموعة محاطة أو محاصَرة في رقعة جغرافية محدودة، كالجيب العسكري أو السكّاني"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَيْب"

    - lemma: "شِرْذِمَة"
      source: stage1
      decision: confirmed
      decision_reason: "شِرْذِمَة مصطلح عربي أصيل يجمع بين القلّة والانقطاع: «القليل من الناس» و«جماعة منقطعة». وردت في القرآن الكريم وفي أمّهات المعاجم. وهي أدقّ لمّة عربية لهذا المفهوم لأنها تتضمّن في بنيتها الدلالية عنصرَيِ الصِّغر والانفصال معاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على القلّة والانقطاع عن الجماعة الأكبر، مع إيحاء بالضعف والتفكّك (من «ثوب شراذم» أي ممزّق)"
      actions:
        - command: create_entry
          params: {lemma: "شِرْذِمَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "ثُلَّة"
      source: stage1
      decision: removed
      decision_reason: "ثُلَّة تعني الجماعة من الناس مطلقاً دون تخصيص بالقلّة أو العزلة. بل إنّ القاموس المحيط يذكر أنّها قد تدلّ على الكثرة. كما أنّها لا تحمل معنى الانقطاع أو العزلة الذي يميّز هذه المجموعة الترادفية."

    - lemma: "عُصْبَة"
      source: stage1
      decision: removed
      decision_reason: "عُصْبَة تدلّ على الجماعة المتماسكة المرتبطة بعضها ببعض (من العَصْب: الربط)، وتحمل دلالة القرابة والتعصّب. وهذا نقيض معنى العزلة والانقطاع المطلوب. فضلاً عن طغيان المعنى الشرعي (عَصَبة الميراث) على الاستعمال العام."

    - lemma: "فِلْذَة"
      source: stage1
      decision: removed
      decision_reason: "فِلْذَة تعني القطعة من الكبد واللحم والمعادن، وهي محصورة في الأجسام المادية المقطوعة. لا يصحّ توسيعها مجازيًّا إلى مجموعة من الناس لعدم وجود سابقة استعمالية."


