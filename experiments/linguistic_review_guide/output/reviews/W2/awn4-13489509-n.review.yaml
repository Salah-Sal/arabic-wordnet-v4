      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قطر","maqayis":"«وَالْقَطْرُ: قَطْرُ الْمَاءِ وَغَيْرِهِ. وَهَذَا بَابٌ يَنْقَاسُ فِي هَذَا الْمَوْضِعِ، لِأَنَّ مَعْنَاهُ التَّتَابُعُ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قطر","maqayis":"«وَالْقَطْرُ: قَطْرُ الْمَاءِ وَغَيْرِهِ. وَهَذَا بَابٌ يَنْقَاسُ فِي هَذَا الْمَوْضِعِ، لِأَنَّ مَعْنَاهُ التَّتَابُعُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح العام والأكثر شيوعاً وعلمية للتعبير عن عملية غلي السائل وتكثيف بخاره.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز بوزنه (استفعال) على معنى الاستخلاص والطلب، ويكثر استخدامه في سياق تقطير الأعشاب والأزهار.","mwe":false}'
