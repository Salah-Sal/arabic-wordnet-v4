      sense_id: "{auto}"
      nuance: "المصطلح العام والأكثر شيوعاً وعلمية للتعبير عن عملية غلي السائل وتكثيف بخاره."
      mwe: false
    - lemma: "اِسْتِقْطَار"
      sense_id: "{auto}"
      nuance: "يركز بوزنه (استفعال) على معنى الاستخلاص والطلب، ويكثر استخدامه في سياق تقطير الأعشاب والأزهار."
      mwe: false

  synset:
    cultural_fit: native

  actions:
