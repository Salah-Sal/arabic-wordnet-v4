stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل."
    observations: "مصطلح (distillation) يقابله في العربية بدقة «تَقْطِير»، وهو عملية فيزيائية معروفة. ويمكن إضافة «اِسْتِقْطَار» كمرادف فصيح يعبر عن استخلاص الخلاصات المقطرة."
  blind_candidates:
    - lemma: "تَقْطِير"
      generation_method: ishtiqaq
      justification: "مصدر قَطَّرَ، وهو المصطلح العلمي واللغوي الشائع للعملية."
    - lemma: "اِسْتِقْطَار"
      generation_method: ishtiqaq
      justification: "مصدر اسْتَقْطَرَ، وفيه دلالة طلب التقطير واستخلاص العصارة."
    - lemma: "تَصْعِيد"
      generation_method: ishtiqaq
      justification: "مصدر صَعَّدَ، استخدمه الأقدمون بمعنى مقارب، وإن كان يختص علمياً بتحول الصلب إلى غاز."
    - lemma: "تَكْرِير"
      generation_method: majaz
      justification: "مصدر كَرَّرَ، يُطلق على عمليات التنقية بشكل عام، ومنها تقطير النفط (تكرير النفط)."

stage2_evidence:
  per_lemma:
    - lemma: "تقطير"
      confirm:
        - text: "«الاستقطار تنقية الماء وتصفيته مما قد يعلق به من موادّ غريبة ضارَّة تحويل السائل إلى بخار بالحرارة ثم تبريده ليعود سائلاً كما كان , وذلك بجهاز التقطير»"
          source: "المعجم الوسيط"
        - text: "«تحويل سائل إلى بخار بالتسخين ثم تكثيفه إلى سائل بالتبريد بقصد تنقيته أو فصله عن غيره من الشوائب كتقطير ماء البحر للحصول على ماء عذب»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "استقطار"
      confirm:
        - text: "«استخلاص العناصر الأساسية السائلة من الأزهار ونحوها باستخدام جهاز معين يسمى الأنبيق»"
          source: "المعجم الوسيط"
    - lemma: "تصعيد"
      contradicts:
        - text: "«التحول من الحالة الصلبة إلى الغازية دون المرور بالحالة السائلة.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "التعريف العلمي للتصعيد (sublimation) يختلف عن التقطير لأنه يتعلق بالمواد الصلبة وليس السائلة."
    - lemma: "تكرير"
      expands:
        - text: "«المصطلح تكرير (تصفية أو تهذيب) يدل عموما على عملية تقنية لتنقية وتكرير وفصل و/أو تركيز المواد الخام والمواد الغذائية والمنتجات الصناعية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "مصطلح أعم يشمل التقطير وغيره من طرق التنقية والفصل."

stage3_analysis:
  per_lemma:
    - lemma: "تقطير"
      decision: confirmed
      decision_reason: "المصطلح العربي القياسي والمطابق تماماً للمفهوم العلمي للتقطير (distillation)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْطِير"

    - lemma: "اِسْتِقْطَار"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق وفصيح للتقطير، ويركز على جانب الاستخلاص بالتقطير."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اِسْتِقْطَار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَصْعِيد"
      source: stage1
      decision: removed
      decision_reason: "المصطلح يُقابل (sublimation) وهو التحول من الصلب إلى الغاز دون المرور بالحالة السائلة، فلا يطابق (distillation)."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَكْرِير"
      source: stage1
      decision: removed
      decision_reason: "المصطلح أعم من التقطير (refining)، ولا يقتصر على عملية الغليان والتكثيف."
      evidence_assessment:
        case: mixed

stage4_content:
  definition:
    current: "عملية تنقية سائل عن طريق غليه وتكثيف أبخرته"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يمكن أن يصاغ بأسلوب معجمي وعلمي أدق يشمل غرض التنقية والفصل."
    authored:
      - type: terminological
        text: "عملية تحويل سائل إلى بخار بالتسخين ثم تكثيفه بالتبريد بقصد تنقيته أو فصله عن شوائبه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية تحويل سائل إلى بخار بالتسخين ثم تكثيفه بالتبريد بقصد تنقيته أو فصله عن شوائبه."}

  examples:
    per_lemma:
      - lemma: "تَقْطِير"
        examples:
          - text: "تعتمد صناعة العطور على تقطير الأزهار لاستخلاص زيوتها العطرية."
            type: usage
      - lemma: "اِسْتِقْطَار"
        examples:
          - text: "يُستخدم جهاز الأنبيق في استقطار المواد الطيارة من النباتات الطبية."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تعتمد صناعة العطور على تقطير الأزهار لاستخلاص زيوتها العطرية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُستخدم جهاز الأنبيق في استقطار المواد الطيارة من النباتات الطبية."}

stage5_enrichment:
  per_entry:
    - lemma: "تَقْطِير"
      entry_id: "{auto}"
      root: "قطر"
      maqayis_quote: "«وَالْقَطْرُ: قَطْرُ الْمَاءِ وَغَيْرِهِ. وَهَذَا بَابٌ يَنْقَاسُ فِي هَذَا الْمَوْضِعِ، لِأَنَّ مَعْنَاهُ التَّتَابُعُ.»"
    - lemma: "اِسْتِقْطَار"
      entry_id: "{auto}"
      root: "قطر"
      maqayis_quote: "«وَالْقَطْرُ: قَطْرُ الْمَاءِ وَغَيْرِهِ. وَهَذَا بَابٌ يَنْقَاسُ فِي هَذَا الْمَوْضِعِ، لِأَنَّ مَعْنَاهُ التَّتَابُعُ.»"

  per_sense:
