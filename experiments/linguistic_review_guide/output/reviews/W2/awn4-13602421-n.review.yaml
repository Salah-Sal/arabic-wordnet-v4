# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13602421-n (plurality)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تعددية» تُستخدم عادة بمعنى pluralism (مذهب التعدد الفلسفي) لا plurality (عدد الأصوات الأكبر دون أغلبية مطلقة)، فهناك خلط دلالي محتمل"
      - "غياب لمّة «أغلبية نسبية» وهي المصطلح القانوني المعتمد في المعاجم الموحدة"
      - "لمّة «أكثرية نسبية» صحيحة لكنها أقل شيوعاً من «أغلبية نسبية» في النصوص القانونية"
    observations: "المفهوم يتعلق بنتائج الانتخابات حين يتنافس أكثر من مرشحَيْن، فيحصل أحدهم على أكبر عدد من الأصوات دون بلوغ النصف. المصطلح الشائع في الخطاب السياسي والقانوني العربي هو «الأغلبية النسبية» كما ورد في المعجم الوسيط والمعاجم الموحدة. أمّا «التعددية» فلها حقل دلالي مختلف تماماً (تعدد الآراء والأحزاب)."
  blind_candidates:
    - lemma: "أَغْلَبِيَّة نِسْبِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «أغلبية» (مصدر صناعي من أغلب) و«نسبية» (منسوب إلى النسبة)، وهو المصطلح القانوني المعتمد للدلالة على الفوز بأكبر عدد أصوات دون بلوغ النصف"
    - lemma: "أَرْجَحِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «أرجح» (اسم تفضيل من رجح)، يدل على الرجحان والتفوق النسبي في الكمّ، على وزن أَفْعَلِيَّة"
    - lemma: "كَثْرَة نِسْبِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «كثرة» (مصدر كثُر) و«نسبية»، يدل على التفوق العددي النسبي دون بلوغ الأغلبية المطلقة"
    - lemma: "فَوْز نِسْبِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «فوز» و«نسبي»، يدل على تحقيق النتيجة الأعلى نسبياً في الانتخاب"

stage2_evidence:
  per_lemma:
    - lemma: "أَكْثَرِيَّة نِسْبِيَّة"
      confirm:
        - text: "«(الأكثرية) الأغلبية (انظر غلب)»"
          source: "المعجم الوسيط"
        - text: "«أَكْثَرِيَّة — الجذر: ك ث ر — الصواب والرتبة: كانت أكْثَرِيَّة الناخبين من النساء [فصيحة] — التعليق: جاء ضمن قرارات مجمع اللغة المصري أنه إذا أريد صنع مصدر من كلمة يزاد عليها ياء النسب والتاء... وقد وردت هذه الكلمة في المعاجم الحديثة كالوسيط والأساسي»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«(3) أكثرية؛ أغلبيّة»"
          source: "المورد الحديث (مادة plurality)"
          addition: "المورد يترجم plurality بأكثرية وأغلبية"

    - lemma: "تَعَدُّدِيَّة"
      contradicts:
        - text: "«اصطلاح يهتم بتنويع مصادر الوحدة، للإحاطة بتعدد الظواهر بدل الأحادية الفقيرة، كتوسّع في الأفكار»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "تعددية = pluralism (مذهب فلسفي/سياسي) لا plurality (عدد أصوات)"
        - text: "«تعدّدية — pluralisme — Philosophy and Psychology»"
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
          conflict: "المصطلح مخصص لمجال الفلسفة بمعنى التعددية الفكرية لا الأصوات الانتخابية"
      expands:
        - text: "«(1) «أ» تعدُّد. «ب» جَمْع؛ عدد وافر (2) «أ» تعدُّد الوظيفة... (3) أكثرية؛ أغلبيّة»"
          source: "المورد الحديث (مادة plurality)"
          addition: "المورد يذكر «تعدد» (لا تعددية) كمعنى أول لـ plurality، والمعنى الثالث أكثرية/أغلبية"

    - lemma: "أَغْلَبِيَّة نِسْبِيَّة"
      confirm:
        - text: "«أغلبية نسبية — relative majority — majorité relative — القانون»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«الأغلبية النسبية: زيادة أحد المرشحين في الأصوات بالنسبة إلى غيره (محدثة)»"
          source: "المعجم الوسيط"

    - lemma: "أَرْجَحِيَّة"
      contradicts:
        - text: "«احتمال حدوث حدث ما ضمن فئة أو صنف معين — Likelihood — Data and AI Glossary»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          conflict: "أرجحية مصطلح مستقر في الإحصاء بمعنى Likelihood، لا علاقة له بالأصوات الانتخابية"

    - lemma: "كَثْرَة نِسْبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "فَوْز نِسْبِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "أَكْثَرِيَّة نِسْبِيَّة"
      decision: confirmed
      decision_reason: "مصطلح صحيح لغوياً: «أكثرية» مصدر صناعي أجازه مجمع اللغة المصري من اسم التفضيل «أكثر»، وورد في المعجم الوسيط بمعنى الأغلبية. المركب الوصفي «أكثرية نسبية» يؤدي المعنى المطلوب بدقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "«أكثرية» مرادف لـ«أغلبية» لكنه أقل شيوعاً في النصوص القانونية المعاصرة، ويُفضَّل في بعض السياقات الإعلامية والبرلمانية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَكْثَرِيَّة نِسْبِيَّة"

    - lemma: "تَعَدُّدِيَّة"
      decision: removed
      decision_reason: "تعددية (pluralism) مصطلح مستقر في الفلسفة وعلم السياسة بمعنى مذهب التعدد، وهو مفهوم مختلف تماماً عن plurality بمعنى الأغلبية النسبية في الانتخابات. المعاجم الموحدة (اللسانيات، الفلسفة) تؤكد هذا التخصيص. المورد الحديث يترجم plurality بـ«تعدّد» (مصدر) و«أكثرية» (معنى ثالث)، لا بـ«تعددية»."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أَغْلَبِيَّة نِسْبِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح القانوني المعتمد في المعجم الموحد لمصطلحات القانون (2017) وفي المعجم الوسيط. تعريف الوسيط مطابق تماماً لدلالة المجموعة: «زيادة أحد المرشحين في الأصوات بالنسبة إلى غيره»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "«أغلبية نسبية» هو المصطلح الأكثر شيوعاً في النصوص القانونية والدستورية العربية، ويُقابل relative majority في الإنجليزية مباشرة"
      actions:
        - command: create_entry
          params: {lemma: "أَغْلَبِيَّة نِسْبِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "أَرْجَحِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مستقر في مجال الإحصاء والذكاء الاصطناعي بمعنى Likelihood (الاحتمال)، واستعماله للأصوات الانتخابية يُحدث اشتراكاً لفظياً ضاراً. لا شواهد معجمية تدعم استعماله في السياق الانتخابي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "كَثْرَة نِسْبِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على تثبيت هذا المركب كمصطلح. «كثرة» مصدر عام لا يحمل الدلالة الاصطلاحية المطلوبة في سياق الانتخابات، بخلاف «أغلبية» و«أكثرية» اللتين تخصصتا في هذا الحقل."
      evidence_assessment:
        case: no_material

    - lemma: "فَوْز نِسْبِيّ"
      source: stage1
      decision: removed
      decision_reason: "المفهوم المطلوب هو عدد الأصوات لا نتيجة الفوز. «فوز نسبي» يصف النتيجة لا الكمّية العددية. كما أنه تعبير وصفي حر لا مصطلح مسكوك."
      evidence_assessment:
        case: no_material

