step0_evidence:
  per_lemma:
    - lemma: "مُثَبِّت"
      confirm: []
      contradicts: []
      expands:
        - text: "«(1) المُثَبِّت؛ المُوَثِّق؛ الممكِّن؛ المزرِّر؛ المُوْصِد إلخ» — المورد الحديث (2008)"
          addition: "يوسع المعنى ليشمل الأشخاص والأدوات التي تقوم بالتثبيت، وهو ترجمة مباشرة للمصطلح الإنجليزي (fastener)."
    - lemma: "مُغْلِق بِإِحْكَام"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُوَثِّق"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُثَبِّت؛ المُوَثِّق؛ الممكِّن؛ المزرِّر؛ المُوْصِد إلخ» — المورد الحديث (2008)"
      justification: "وردت كترجمة للمصطلح الإنجليزي وتدل كاسم فاعل على من يقوم بالتوثيق والربط بقوة."
  knowledge_candidates:
    - lemma: "رَابِط"
      justification: "اشتقاق: اسم فاعل على وزن (فَاعِل) من الفعل (رَبَطَ)، يدل على الشخص الذي يعقد ويربط الأشياء ببعضها."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُثَبِّت"
      decision: confirmed
      decision_reason: "مصطلح فصيح قياسي (اسم فاعل) يعبر بدقة عن الشخص الذي يقوم بالتثبيت والربط."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على من يضمن بقاء الشيء في مكانه وعدم تحركه (الاستقرار)."
      example: "عملَ مُثَبِّتاً للأحزمة والمعدات قبل بدء عملية التسلق."
      actions: []

    - lemma: "مُغْلِق بِإِحْكَام"
      decision: removed
      decision_reason: "عبارة وصفية حرة (تركيب وصفي حر) وليست مصطلحاً معجمياً أو مسكوكاً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "تعبير وصفي يفتقر لخصائص المصطلح الثابت."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُوَثِّق"
      source: step05
      decision: removed
      decision_reason: "على الرغم من دلالتها اللغوية الصحيحة، إلا أن الكلمة استقرت في الاستعمال المعاصر بمعنى (كاتب العدل - Notary) مما يسبب خلطاً دلالياً، ولذا تُرفض هنا درءاً للّبس."
      step05_citation: "«المُثَبِّت؛ المُوَثِّق؛ الممكِّن؛ المزرِّر؛ المُوْصِد إلخ» — المورد الحديث (2008)"

    - lemma: "رَابِط"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل قياسي فصيح يؤدي المعنى المطلوب بسلاسة ودقة."
      step05_citation: "اشتقاق من المعرفة اللغوية."
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على من يقوم بعملية العقد والوصل بين طرفين أو أكثر (الضم والجمع)."
      example: "أشرف الرابط على عقد الحبال لتأمين حمولة السفينة."
      actions:
        - command: create_entry
          params:
            lemma: "رَابِط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10100106-n"

  added_lemmas:
    - lemma: "رَابِط"
      reason: "مصدر: الخطوة ٠٫٥ (اسم فاعل من ربط)"
      via_command: create_entry + add_sense

