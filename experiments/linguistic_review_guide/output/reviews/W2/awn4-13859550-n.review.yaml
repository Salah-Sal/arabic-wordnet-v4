# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13859550-n
# clientage — علاقة العميل بالراعي أو المتبوع
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "مصطلح «وَلَاء» متعدد الدلالات في التراث الإسلامي (ولاء العتاقة، ولاء الموالاة، الولاء بمعنى المتابعة) مما قد يُوقِع في الالتباس"
      - "مصطلح «تَبَعِيَّة» عام جداً — يشمل التبعية السياسية والاقتصادية واللغوية — وقد لا يختص بعلاقة العميل بالراعي"
      - "التعريف العربي الحالي مقبول لكنه يحتاج تدقيقاً في لفظ «الراعي» الذي قد يُفهم بمعنى الحاكم لا الكفيل التجاري"
    observations: "المجموعة تعبّر عن مفهوم اجتماعي-تجاري يصف العلاقة بين طالب الخدمة (العميل/الزبون) ومقدّمها (الراعي/الكفيل). المفهوم له جذور عميقة في الفقه الإسلامي تحت باب «ولاء الموالاة» حيث يتعاقد شخص مع آخر على النصرة والإرث. اللمّتان الموجودتان تغطّيان بُعدَي المفهوم: التبعية (الخضوع) والولاء (الرابطة)."
  blind_candidates:
    - lemma: "عَمَالَة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «عميل» على وزن فَعَالَة، للدلالة على حرفة العمالة أو علاقة العميل. لكن الاستعمال المعاصر حصره في معنى التوظيف والأجرة."
    - lemma: "زَبُونِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «زبون» بإضافة ياء النسبة وتاء التأنيث، للدلالة على علاقة الزبون بمن يتعامل معه. غير مسجّل معجمياً."
    - lemma: "اسْتِتْبَاع"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من «تبع»، يدل على طلب التبعية والإلحاق. الجذر مناسب للمفهوم."
    - lemma: "مُوَالَاة"
      generation_method: ishtiqaq
      justification: "مصدر مفاعلة من «ولي»، يدل على التناصر والتعاقد بين طرفين — وهو عقد الولاء بين العميل والراعي في الفقه الإسلامي."

stage2_evidence:
  per_lemma:
    - lemma: "تَبَعِيَّة"
      confirm:
        - text: "«(التّبعِيَّة) كَون الشَّيْء تَابعا لغيره»"
          source: "المعجم الوسيط"
        - text: "«dependency»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
        - text: "«subordination» — قيام الأجير بعمله تحت إشراف وتوجيه المشغل وتحت رقابته."
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
      expands:
        - text: "«dependence (dependency)»"
          source: "مسرد الجغرافيا والتاريخ — ARABTERM"
          addition: "يتّسع المصطلح ليشمل التبعية الجغرافية والسياسية"
        - text: "«العلاقة الموجودة بين كلمة حاكمة (عاملة) وكلمة محكومة (معمولة) حيث يرتبط شكل الكلمة الثانية ضرورة بطبيعة الكلمة الأولى.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          addition: "استعمال لساني مجازي للتبعية"

    - lemma: "وَلَاء"
      confirm:
        - text: "«الْوَلَاء بالفتح لغة النصرة والمحبة... وشرعا قرابة حكمية حاصلة من العتق أو الموالاة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الولاء: هو ميراث يستحقه المرء بسبب عتق شخص في ملكه، أو بسبب عقد الموالاة.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«(الْوَلَاء) الْملك والقرب والقرابة والنصرة والمحبة»"
          source: "المعجم الوسيط"
        - text: "«المِلْك القُرب القرابة النُصْرة المحبة»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«allegiance»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
          addition: "يُستعمل في السياق القانوني بمعنى الولاء والانتماء"
        - text: "«loyalty»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — ARABTERM"
          addition: "يُستعمل في علم الاجتماع بمعنى الوفاء"
        - text: "«fidelity»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM"
          addition: "يُستعمل في علم الأحياء بمعنى الإخلاص/الدقة"
        - text: "«الوَلاء: هو ميراث يستحقّه المرء بسبب عتق شخص في ملك أو بسبب عقد الموالاة، والوَلاَء في الوضوء: هي المتتابعةُ... والولاء: بالفتح المِلك والمحبة والقرابة.»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "يتعدد المعنى بحسب حركة الواو: بالفتح (نصرة/محبة) وبالكسر (متابعة)"

    - lemma: "عَمَالَة"
      contradicts:
        - text: "«العِمَالَةُ: أجرة العامل حِرْفته»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المعنى المعجمي هو أجرة العامل أو حرفته، لا علاقة العميل بالراعي"
        - text: "«العمالة: بالضم وبالكسر رزقُ العامل وبالفتح عمل الناقة.»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "جميع الضبطات تدل على الأجرة أو عمل الناقة، لا على علاقة الزبونية"
        - text: "«employment»"
          source: "مسرد علم الاجتماع — ARABTERM"
          conflict: "المصطلح مستقر في الاستعمال المعاصر بمعنى التوظيف"

    - lemma: "زَبُونِيَّة"
      evidence_status: "no_material_found"

    - lemma: "اسْتِتْبَاع"
      contradicts:
        - text: "«الاستتباع: هو المدح بشيء على وجه يستتبع المدح بشيءٍ آخر.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "مصطلح بلاغي بديعي لا علاقة له بالعلاقة التجارية"
        - text: "«الاستتباعُ: الْوَصْف بِشَيْء يستتبع وَصفا آخر مدحا أَو ذما.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "تأكيد لكونه مصطلحاً بلاغياً"
      expands:
        - text: "«الاستتباع: فِي اللُّغَة طلب التّبعِيَّة وَعند أَرْبَاب البديع هُوَ الْمَدْح بِشَيْء على وَجه يستتبع الْمَدْح بِشَيْء آخر»"
          source: "دستور العلماء للأحمدنكري"
          addition: "المعنى اللغوي الأصلي (طلب التبعية) قريب من المفهوم لكن المعنى الاصطلاحي البلاغي طغى عليه"

    - lemma: "مُوَالَاة"
      confirm:
        - text: "«المُوَالاة: لغةً التناصرُ، وشرعاً: أن يُعاهد شخصٌ شخصاً آخر على أنه إن جنى فعليه أرشه وإن مات فميراثُه له.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«(الْمُوَالَاة) (شَرعاً) أن يعاهد شخص شخصاً آخر»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«ما يبذل للمريض الناقه من رعاية وبخاصة في العمليات الجراحية.» — after care"
          source: "معجم المصطلحات الطبية — ARABTERM"
          conflict: "في المجال الطبي تعني الرعاية اللاحقة لا علاقة العميل بالراعي"
      expands:
        - text: "«الموالاة: لغة التناصر. وشريعة أن يعاهد شخص شخصا آخر على أنّه إن جنى فعليه أرشه، وإن مات فميراثه له، سواء كانا رجلين أو امرأتين أو أحدهما رجلا والآخر امرأة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تفصيل شروط عقد الموالاة وأطرافه"

