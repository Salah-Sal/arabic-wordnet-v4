# مراجعة المجموعة الترادفية — awn4-04955065-n
# soapiness | AWN4 Review Pipeline v2 (5-Stage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين بدون تشكيل كامل"
      - "«ملمس صابوني» يقتصر على الحاسة اللمسية وحدها، وهو بُعد واحد من أبعاد الصابونية الشاملة"
      - "«رغوية صابونية» يُقيِّد المفهوم في الخاصية الرغوية فحسب، لا في مجموع خصائص الصابون"
      - "لم يُوثَّق أيٌّ من اللمّتين كمصطلح مُسكَّك في المعاجم العربية المعتمدة"
      - "المصطلح المعجمي الدقيق المقابل لـ soapiness هو «الصابونيّة» كما أثبته المورد الحديث (2008)"
    observations: >
      تعاني هذه المجموعة من غياب المصطلح الجوهري الدقيق لمفهوم الصابونيّة. اللمّتان الموجودتان
      تُجزِّئان المفهوم كلٌّ في بُعدٍ حسي واحد؛ إذ يحصر «ملمس صابوني» الدلالةَ في الجانب اللمسي،
      فيما تحصرها «رغوية صابونية» في الجانب الرغوي، وكلاهما لا يُعادل المفهوم الإنجليزي soapiness
      الذي يدل على مجموع خصائص الصابون كمادة كيميائية وحسية. وقد كان ينبغي اعتماد المصدر
      الصناعي «الصابونيّة» الذي ورد صريحاً في المعاجم بمعنى «كون الشيء صابونياً».

  blind_candidates:
    - lemma: "صَابُونِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مطَّرد (فَعْلُونِيَّة) من «صابون»، على أنماط العربية القياسية في تحويل
        الاسم الجامد إلى خاصية مجردة كـ«إنسانيّة» و«حيوانيّة». يدل مباشرةً على صفة كون
        الشيء صابوناً — وهو بالضبط ما تعرِّفه المجموعة.
    - lemma: "تَصَبُّن"
      generation_method: ishtiqaq
      justification: >
        مصدر باب تَفَعَّل من الفعل «تصبَّن»، يدل على اكتساب الشيء طبيعةَ الصابون أو
        التحول إليه. يُرشَّح لاحتمال أن يُغطِّي معنى «المغطّى بالصابون» في جزء من التعريف.
    - lemma: "رَغَوِيَّة"
      generation_method: majaz
      justification: >
        بالمجاز من «الرغوة» (جذر رغو)، وهي المظهر الأبرز والأكثر تمييزاً للصابون؛ فالرغوة
        هي علامة الصابون الظاهرة، وإحياء هذا المصطلح للدلالة على خاصية التراغي الصابوني
        وارد من الناحية المجازية.
    - lemma: "زَلَقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «زَلَق» (جذر زلق)، للدلالة على خاصية الانزلاق المميِّزة للصابون
        عند تبليله. الاشتقاق قياسي ومنتج، ويلتقط بُعداً محورياً من أبعاد الصابونية.


# ─────────────────────────────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "رغوية صابونية"
      evidence_status: "no_material_found"

    - lemma: "ملمس صابوني"
      confirm:
        - text: "«الحجر الصّابونيّ: حجر ناعم صابونيّ المَلْمَس.»"
          source: "المورد الحديث (2008) — ترجمة soapstone"
        - text: "«طلق: معدن مركب من سليكات مغنيزية، له ملمس دهني صابوني ويسهل قطعه وطحنه»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — ترجمة talc"
      contradicts:
        - text: "«الصابونيّة: كون الشيء صابونيًّا أو زَلِقًا إلخ.»"
          source: "المورد الحديث (2008) — ترجمة soapiness"
          conflict: >
            المصدر نفسه الذي يورد «ملمس صابوني» كوصف لـ soapstone يُسمِّي المفهوم
            المجرد soapiness بـ«الصابونيّة» لا بـ«ملمس صابوني»، مما يكشف أن «ملمس
            صابوني» مجرد وصف تقني لا مصطلح يُعبِّر عن الخاصية المجردة.

    - lemma: "صَابُونِيَّة"
      confirm:
        - text: "«الصابونيّة: كون الشيء صابونيًّا أو زَلِقًا إلخ.»"
          source: "المورد الحديث (2008) — entry_id 718199، ترجمة soapiness"
        - text: "«(1) مَكْسُوّ بالصابون (2) صابونيّ: مُشْبَع بالصابون (3) أَمْلس؛ زلِق (4) مُتَمَلّق»"
          source: "المورد الحديث (2008) — entry_id 718205، ترجمة soapy"
        - text: "«على نحوٍ صابونيّ أو أملَس أو زلِقٍ أو متملِّق.»"
          source: "المورد الحديث (2008) — entry_id 718198، ترجمة soapily"

    - lemma: "تَصَبُّن"
      contradicts:
        - text: "«تحول المادة الكيميائية إلى صابون، إثر حلمهة قلوية لمادة دسمة، أو إثر تعديل حمض دسم بمادة قلوية.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — entry_id 465349، ترجمة saponification"
          conflict: >
            تصبّن يعني «التحوّل الكيميائي إلى صابون» (saponification)، وهو عملية كيميائية
            لا صفة حسية؛ بينما المجموعة تعني «صفة كون الشيء صابوناً» (soapiness).
            المصطلحان مختلفان ولا يتداخلان.
        - text: "«تفاعل الدهون مع مادة قلوية ينتج عنها تحللها وتكون الصابون والغلسيرين.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — entry_id 482598، ترجمة saponification"
          conflict: "يؤكد أن تصبّن = saponification (عملية كيميائية)، لا soapiness (صفة)."

    - lemma: "رَغَوِيَّة"
      expands:
        - text: "«شوائب من مواد عضوية وغير عضوية تتكون على أسطح المياه»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — رغوة، ترجمة foam"
          addition: >
            الرغوة في المعاجم التقنية تدل على الزبد المائي، ولا تدل على الصابونية كخاصية.
            هذا يُضعف ترشيح «رغوية» مصطلحاً للصابونية.
        - text: "«(1) مُزْبِد؛ كثير الرَّغوة (2) صابونيّ.»"
          source: "المورد الحديث (2008) — entry_id 721011، ترجمة sudsy"
          addition: >
            «مزبد/ كثير الرغوة» و«صابوني» تحت ترجمة sudsy معاً يكشف أن الرغوية
            والصابونية مفهومان منفصلان في المعجم.

    - lemma: "زَلَقِيَّة"
      evidence_status: "no_material_found"


