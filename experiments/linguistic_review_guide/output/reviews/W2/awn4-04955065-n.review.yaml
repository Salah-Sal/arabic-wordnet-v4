stage3_analysis:
  per_lemma:

    - lemma: "رغوية صابونية"
      decision: removed
      decision_reason: >
        مركب وصفي (رغوية + صابونية) لم يُوثَّق في أي معجم كمصطلح مُسكَّك لمفهوم الصابونية
        المجردة. فضلاً عن ذلك، يُقيِّد المفهوم في الجانب الرغوي فحسب، وهو أضيق بكثير من
        معنى soapiness الشامل. ويفشل اختبار السكّ: «خاصية صابونية» تُحلّ محلّ «رغوية
        صابونية» بلا خسارة دلالية — دليل على أنه وصف حرّ لا مصطلح محكم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ملمس صابوني"
      decision: removed
      decision_reason: >
        مركب إضافي (ملمس + صابوني) يدل على الملمس الحسي اللمسي فحسب، وهو بُعد واحد من أبعاد
        الصابونية. والصابونية (soapiness) أشمل: تدل على كون الشيء صابوناً بمجمل خصائصه
        (الملمس والرغوة والرائحة والتركيب الكيميائي). وقد وثّق المورد الحديث أن المقابل
        العربي لـ soapiness هو «الصابونيّة» لا «ملمس صابوني». كما أن «ملمس صابوني» يستعمل
        فعلاً في سياقات الجيولوجيا والكيمياء وصفاً تقنياً للمعادن (كالطلق) لا مصطلحاً
        للمجموعة الدلالية المعنية بخاصية الصابون.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "صَابُونِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصدر صناعي مطَّرد على نمط (-يَّة) من «صابوني» المنسوب إلى «صابون». يُؤكِّده المورد الحديث
        (2008) صراحةً في حاشية soapiness بنص: «الصابونيّة: كون الشيء صابونيًّا أو زَلِقًا إلخ.»
        — وهو تعريف يُعادل معنى المجموعة تمام المعادلة. الاشتقاق قياسي، والاستعمال موثَّق،
        والمصطلح خالٍ من الدوران والاشتراك اللفظي في هذا السياق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «الصابونيّة» المصطلح الوحيد في المجموعة بعد المراجعة، وهو يُعبِّر عن الخاصية الشاملة
        للصابون كمادة (الزلوقة، والرغوة، والتركيب الكيميائي الصابوني)، في مقابل ما أُزيل
        من لمّات تجزئ المفهوم: «ملمس صابوني» (الجانب اللمسي) و«رغوية صابونية» (الجانب الرغوي).
      actions:
        - command: create_entry
          params:
            lemma: "صَابُونِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04955065-n"

    - lemma: "تَصَبُّن"
      source: stage1
      decision: removed
      decision_reason: >
        وثَّقت أربع مصادر من ARABTERM أن «تصبّن» يقابل saponification (التحوّل الكيميائي
        للدهون إلى صابون بالقلوي)، وهو مفهوم مختلف تماماً عن soapiness (صفة كون الشيء
        صابونياً). اقتراض مفهومي خاطئ لو استُعمل هنا.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "رَغَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الرغوية» مصطلح لخاصية التراغي (foaminess) وهي مختلفة عن الصابونية. الأدلة تُفرِّق
        بين الرغوة وبين صفة الصابون كمفهومين متمايزين (صادي = sudsy ترجمتها «مزبد؛ صابوني»
        أي هما خاصيتان منفصلتان). ولا يوجد توثيق معجمي لـ«رغوية» بمعنى soapiness.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "زَلَقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الزلقية» تدل على خاصية الانزلاق (slipperiness) وهي بُعد واحد من أبعاد الصابونية
        لا مرادف لها. لا دليل معجمي على استعمالها بمعنى soapiness. الزلوقة صفة لازمة للصابون
        لكنها ليست مُعرِّفة له: المواد الزيتية والجليد زَلِقان ولا تسمّى صابونيّين.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


