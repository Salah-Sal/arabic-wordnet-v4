# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-06026095-n  |  ILI: i68409  |  POS: n
# Lemmas: فترة جزئية  |  EN: sub-interval
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «فترة جزئية» مُضمَّنة دون تشكيل كامل"
      - "«جزئية» تحمل دلالة التجزّؤ والنقصان (partial) لا دلالة الاحتواء والاشتمال (contained within)، مما قد يُلتبس بـ«الفترة الجزئية» بمعنى المقطع الناقص"
      - "غياب تعريف موسوعي رياضي دقيق يربط المصطلح بمفهوم المجموعة الجزئية (subset)"
      - "لمّة واحدة فقط مسجَّلة، وهي مجموعة ترادفية رياضية تستحق توسيع المعجم"
    observations: >
      المفهوم رياضي بحت: sub-interval هي فترة [c,d] تقع بالكامل داخل فترة [a,b]
      بحيث a ≤ c ≤ d ≤ b. يرتبط ارتباطاً وثيقاً بمفهوم «المجموعة الجزئية»
      (subset) في نظرية المجموعات، إذ الفترة الجزئية هي مجموعة جزئية من الفترة
      الأشمل. يُلاحظ أن «فترة» في السياق الرياضي العربي المعاصر هي الترجمة
      الشائعة لـ interval، غير أن «مجال» تُستخدم أيضاً (مجال مفتوح = open
      interval). التعريف الحالي «فترة مشمولة ضمن فترة أخرى» صحيح لكنه يفتقر
      إلى الدقة الرياضية التي تُمثّلها العلاقة الاحتوائية الكاملة.

  blind_candidates:
    - lemma: "جُزْءُ الفَتْرَة"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «جزء» (الطائفة من الشيء — ابن فارس) و«فترة»؛ يصف
        العلاقة الاحتوائية بصورة شفّافة، غير أنه عبارة وصفية حرّة لا مصطلح
        مسكوك.
    - lemma: "فَتْرَةٌ فَرْعِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي قياسي يستعمل «فرعية» (منسوب إلى الفرع أي ما دون الأصل)،
        موازٍ لـ«مجموعة فرعية» و«مصفوفة فرعية» في المصطلحية الرياضية العربية؛
        يُبرز العلاقة التدرجية (sub-) بوضوح.
    - lemma: "فَتْرَةٌ مُشْتَمَلَة"
      generation_method: ishtiqaq
      justification: >
        وصف المفعول من الفعل «اشتمل» (الجذر شمل)، يُفيد أن الفترة مشتمَل
        عليها ضمن غيرها؛ مناسب دلالياً لكنه وصف حرّ لا يجتاز اختبار السكّ
        المصطلحي.
    - lemma: "فُتَيْرَة"
      generation_method: ishtiqaq
      justification: >
        تصغير «فترة» على وزن فُعَيلة يُفيد الفترة الصغيرة/المندرجة؛ غير أن
        التصغير في المصطلحية الرياضية نادر ويُفضي إلى التشابه مع الأفانيم
        العامية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "فترة جزئية"
      expands:
        - text: "«بعد جزئي»"
          source: "مسرد الفن، التسلية والرياضة — ALECSO (ArabTerm)"
          addition: >
            يُقابل «micro-interval» في الموسيقى، مما يُثبت أن «جزئي» يُستخدم
            في السياق الأكاديمي العربي للدلالة على الفترة الأدق أو الأصغر ضمن
            منظومة أوسع، وإن كان المقابل هنا للجزء الصغير لا للاحتواء الرياضي.
        - text: "«فترة مغلقة» = closed interval، «مجال مفتوح» = open interval"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك ١٩٩٠ — ALECSO (ArabTerm)"
          addition: >
            يؤكد أن «فترة» هو المصطلح المعياري للـ interval في الرياضيات
            العربية، وأن الصفة تلحق بها لتمييز الأنواع (مغلقة / مفتوحة).
            يدعم النمط الاشتقاقي «فترة + صفة» الذي تتبعه اللمّة الموجودة.

    - lemma: "جُزْءُ الفَتْرَة"
      evidence_status: "no_material_found"

    - lemma: "فَتْرَةٌ فَرْعِيَّة"
      expands:
        - text: "«مجموعة جزئية» = subset (نظرية المجموعات)، «مصفوفة فرعية» = sub-matrix"
          source: "الاستقراء من المصطلحية الرياضية العربية المعيارية"
          addition: >
            رصد النمط الاشتقاقي في التصطيح الرياضي العربي: «فرعي» يُستخدم
            للدلالة على العلاقة التدرجية (sub-) في المصطلحات المركّبة.

    - lemma: "فَتْرَةٌ مُشْتَمَلَة"
      evidence_status: "no_material_found"

    - lemma: "فُتَيْرَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "فترة جزئية"
      decision: confirmed
      decision_reason: >
        اللمّة مركّب وصفي قياسي موازٍ لـ«مجموعة جزئية» (subset)، وهو النمط
        المعياري في الرياضيات العربية لمصطلحات «sub-». دلالة «جزئي» (من الجذر
        جزء = الطائفة من الشيء) تُفيد الانتماء والاندراج، وإن كانت تحمل أيضاً
        دلالة النقص أو التجزّؤ. غياب الأدلة المعجمية المباشرة مردّه حداثة
        المفهوم الرياضي، لكن المصطلح صحيح صرفياً ومستعمَل في الأدبيات
        الرياضية العربية قياساً على «مجموعة جزئية». يستوجب تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُؤطِّر العلاقة من منظور الجزء والكل (part-whole)، إذ الفترة «جزء» من
        فترة أشمل؛ يُعدّ الأقرب إلى «مجموعة جزئية» في التراكيب الرياضية
        المستقرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَتْرَةٌ جُزْئِيَّة"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "فَتْرَةٌ فَرْعِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مركّب وصفي يعتمد «فرعية» (من الجذر فرع = العلو والتشعّب، ثم تطوّر
        إلى معنى الفرع المندرج تحت الأصل) وهو النمط المستخدم في «مصفوفة
        فرعية» و«شبكة فرعية» وغيرها. يُبرز الجانب التدرجي (sub-/hierarchical)
        للمفهوم بصورة أوضح من «جزئية»، ويتجنّب الالتباس مع «partial interval»
        أو الفترة الناقصة. لا أدلة تعارضه، والنمط الاشتقاقي راسخ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُؤطِّر العلاقة من منظور التدرج والتفرّع (hierarchy)؛ الفترة «فرع» من
        فترة أعلى مرتبةً، وهو ما يوافق المعنى الهندسي لـ sub-interval أكثر
        صراحةً.
      actions:
        - command: create_entry
          params:
            lemma: "فَتْرَةٌ فَرْعِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06026095-n"

    - lemma: "جُزْءُ الفَتْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ المصطلحي: يمكن إبدال «جزء» بـ«قطعة» أو «مقطع»
        ويظل الوصف صالحاً، مما يعني أنه عبارة وصفية حرّة لا وحدة معجمية
        ثابتة. كذلك يُشكّل التركيب الإضافي نمطاً أقل استقراراً في
        التصطيح الرياضي مقارنةً بالتركيب الوصفي.

    - lemma: "فَتْرَةٌ مُشْتَمَلَة"
      source: stage1
      decision: removed
      decision_reason: >
        وصف حرّ مشتق من اسم المفعول؛ يُخبر عن الحالة لا عن الحقيقة النوعية.
        يفشل اختبار السكّ: «مشتملة» يمكن إبدالها بـ«مندرجة / مضمَّنة /
        محتواة» وتبقى الجملة وصفاً صالحاً.

    - lemma: "فُتَيْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        التصغير في المصطلحية الرياضية العربية غير مألوف ويُفضي إلى دلالة
        التحقير أو الزمنية القصيرة لا الاندراج الرياضي. لا شاهد معجمي على
        استخدامه اصطلاحاً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فترة مشمولة ضمن فترة أخرى"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح لكنه مجمَل: لفظ «مشمولة» وحده لا يُحدد طبيعة
        العلاقة الرياضية الدقيقة (احتواء كلي بمعنى المجموعة الجزئية). يفتقر
        كذلك إلى الجنس القريب الصريح الذي يُفيد أنها «فترة» من نفس النوع، ولا
        يُبيّن شرط الاحتواء الكلي (الطرفان كلاهما ضمن الفترة الأم).
    authored:
      - type: terminological
        text: >
          فترةٌ رياضيةٌ تُمثِّل مجموعةً جزئيةً من فترةٍ أخرى أوسع، بحيث
          تقع نقطتا طرفَيها كلتاهما ضمن تلك الفترة الأشمل
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          ما كان من الفترات مندرجاً بكماله في داخل فترةٍ أخرى، فلا يتجاوز
          طرفاه حدَّيها
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-06026095-n"
          definition_index: 0
          text: >
            فترةٌ رياضيةٌ تُمثِّل مجموعةً جزئيةً من فترةٍ أخرى أوسع، بحيث
            تقع نقطتا طرفَيها كلتاهما ضمن تلك الفترة الأشمل
      - command: add_definition
        params:
          synset_id: "awn4-06026095-n"
          text: >
            ما كان من الفترات مندرجاً بكماله في داخل فترةٍ أخرى، فلا يتجاوز
            طرفاه حدَّيها

  examples:
    per_lemma:
      - lemma: "فَتْرَةٌ جُزْئِيَّة"
        examples:
          - text: >
              الفترةُ [١، ٣] فترةٌ جزئيةٌ من الفترة [٠، ٥]، إذ تقع
              نقطتاها ضمن حدود الفترة الأشمل
            type: usage
      - lemma: "فَتْرَةٌ فَرْعِيَّة"
        examples:
          - text: >
              إذا كانت a ≤ c ≤ d ≤ b، فإن الفترةَ [c, d] تُعدُّ فترةً
              فرعيةً من الفترة [a, b]
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-06026095-n"
          text: >
            الفترةُ [١، ٣] فترةٌ جزئيةٌ من الفترة [٠، ٥]، إذ تقع
            نقطتاها ضمن حدود الفترة الأشمل
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            إذا كانت a ≤ c ≤ d ≤ b، فإن الفترةَ [c, d] تُعدُّ فترةً
            فرعيةً من الفترة [a, b]


