# مراجعة المجموعة الترادفية — awn4-13878307-n
# polarity / mutual opposition
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تَقَابُل مُتَبَادَل» حشو اشتقاقي: وزن تَفَاعُل يدلّ على المشاركة أصلاً، فإضافة «مُتَبَادَل» تكرار دلالي لا مسوّغ له"
      - "لمّة «قُطْبِيَّة» جيّدة لكنها تُطلق في العلوم الطبيعية على خاصية فيزيائية (polarity)، وقد يلزم توثيق الدلالة المجرّدة (العلاقة بين صفتين متعاكستين)"
    observations: >
      المجموعة تقع تحت مفهوم التضادّ (hypernym) وتخصّصه بعلاقة القطبية بين صفتين أو نزعتين متعاكستين.
      التعريف الإنجليزي «a relation between two opposite attributes or tendencies» يوجّه نحو مصطلحات
      الاستقطاب والتناقض القطبي. المصطلح العربي الأشيع في المعاجم الاصطلاحية الحديثة هو «تَقَاطُب» و«قُطْبِيَّة»،
      بينما «تَقَابُل» أعمّ ويشمل أنواع التقابل الأربعة عند الحكماء (التضاد، التضايف، العدم والملكة، السلب والإيجاب).
  blind_candidates:
    - lemma: "تَقَاطُب"
      generation_method: ishtiqaq
      justification: "من الجذر ق-ط-ب على وزن تَفَاعُل الدالّ على المشاركة؛ يعني انشطار الشيء إلى قطبين متعاكسين، وهو المصطلح العلمي المقابل لـ polarity"
    - lemma: "تَنَاقُض"
      generation_method: ishtiqaq
      justification: "من الجذر ن-ق-ض على وزن تَفَاعُل؛ يدلّ على تدافع الأمرين وتعارضهما، غير أنّه أخصّ بالتناقض المنطقي بين القضايا"
    - lemma: "تَضَايُف"
      generation_method: ishtiqaq
      justification: "من الجذر ض-ي-ف على وزن تَفَاعُل؛ مصطلح فلسفي كلاسيكي يصف كون الشيئين لا يُتعقّل أحدهما إلّا بالقياس إلى الآخر"
    - lemma: "تَعَاكُس"
      generation_method: ishtiqaq
      justification: "من الجذر ع-ك-س على وزن تَفَاعُل؛ يدلّ على ردّ آخر الشيء على أوّله والتقابل في الاتجاه"

stage2_evidence:
  per_lemma:
    - lemma: "تَقَابُل مُتَبَادَل"
      evidence_status: "no_material_found"

    - lemma: "قُطْبِيَّة"
      confirm:
        - text: "«(1) القطبيّة؛ التقاطُب (فز) (2) التقاطب؛ التناقض الكامل: التكشُّف عن مبدأين أو نزعتين متناقضتين.»"
          source: "المورد الحديث (2008)"
        - text: "«قُطْبِيَّة — polarity — polarité»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«قُطْبِيَّة — polarity — polarité»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«قُطْبِيَّة — polarity»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«قطبية — نسبة الشحن إلى الجُهد بين إلكترودين في بطارية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "تعريف فيزيائي تطبيقي يوضّح الدلالة التقنية للمصطلح"

    - lemma: "تَقَاطُب"
      confirm:
        - text: "«(1) القطبيّة؛ التقاطُب (فز) (2) التقاطب؛ التناقض الكامل: التكشُّف عن مبدأين أو نزعتين متناقضتين.»"
          source: "المورد الحديث (2008)"
        - text: "«تقاطب — polarity — polarité»"
          source: "المَكنَز الزراعي متعدد اللغات"
        - text: "«تقاطب — polarity»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تقاطب — polarity»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"

    - lemma: "تَنَاقُض"
      contradicts:
        - text: "«التَّنَاقُضُ: اخْتِلَاف قضيتين بالسلب، والإيجاب بِحَيْثُ يَقْتَضِي لذاته أَن تكون إِحْدَاهمَا صَادِقَة وَالْأُخْرَى كَاذِبَة.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "التناقض مصطلح منطقي يدلّ على تقابل القضايا بالسلب والإيجاب، وليس على العلاقة بين صفتين متعاكستين"
        - text: "«(التَّنَاقُض) يُقَال فِي كَلَامه تنَاقض بعضه يَقْتَضِي إبِْطَال بعض و(فِي الْمنطق) النِّسْبَة بَين المتناقضين»"
          source: "المعجم الوسيط"
          conflict: "دلالة التناقض على إبطال بعض الكلام لبعض وعلى النسبة المنطقية أخصّ من مفهوم القطبية"

    - lemma: "تَضَايُف"
      contradicts:
        - text: "«التضايف: كون الشيئين بحيث يكون تعلق كل واحد منهما سببًا بتعلق الآخر به، كالأبوة والبنوة.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "التضايف يدلّ على الارتباط المتبادل (correlation) لا على التعاكس والتقابل"
        - text: "«(التضايف) الْإِضَافَة بمعناها عِنْد الْحُكَمَاء وَيُسمى مَا بَينهمَا تِلْكَ النِّسْبَة متضايفين»"
          source: "المعجم الوسيط"
          conflict: "التضايف عند الحكماء هو الإضافة المتبادلة، وهو نوع من التقابل يختلف عن تقابل التضاد"

    - lemma: "تَعَاكُس"
      expands:
        - text: "«تعاكس — inversion»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "يُستعمل في الرياضيات بمعنى الانعكاس لا القطبية"
        - text: "«التعاكس: هُوَ الْعَمَل بِالْعَكْسِ عِنْد أَرْبَاب الْحساب وَيُسمى بالتحليل أَيْضا عِنْدهم.»"
          source: "دستور العلماء للأحمدنكري"
          addition: "دلالة حسابية على العمل العكسي (التحليل)، بعيدة عن مفهوم القطبية"

stage3_analysis:
  per_lemma:
    - lemma: "تَقَابُل مُتَبَادَل"
      decision: removed
      decision_reason: >
        تعبير حشوي: وزن تَفَاعُل في «تَقَابُل» يدلّ أصلاً على المشاركة والتبادل، فإضافة «مُتَبَادَل» تكرار
        دلالي لا يزيد المعنى شيئاً. فضلاً عن ذلك لم يُعثر على هذا المركب في أيّ معجم عربي، ومصطلح «تَقَابُل» وحده
        أعمّ من المجموعة (يشمل أنواع التقابل الأربعة عند الحكماء). المصطلح الأنسب للقطبية هو «تَقَاطُب» أو «قُطْبِيَّة».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قُطْبِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح راسخ في المعجمية العربية الحديثة، مُثبت في معاجم الأحياء والكيمياء والفيزياء والمعلوماتية
        والحرب الإلكترونية بمعنى polarity. المورد الحديث يُعرّفه صراحةً بـ«التكشُّف عن مبدأين أو نزعتين متناقضتين»
        وهو مطابق لتعريف المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "قُطْبِيَّة مصدر صناعي يدلّ على الحالة والصفة (كون الشيء ذا قطبين)، ويُستعمل استعمالاً تقنياً شائعاً في العلوم"
      actions: []

    - lemma: "تَقَاطُب"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مُثبت في المعاجم الاصطلاحية العربية (المَكنَز الزراعي، المعجم الطبي الموحد، معجم التشريح العياني)
        بمعنى polarity. المورد الحديث يعرّفه: «التناقض الكامل: التكشُّف عن مبدأين أو نزعتين متناقضتين»، وهو مطابق
        لتعريف المجموعة. وزن تَفَاعُل من ق-ط-ب يدلّ على التشارك في الانقسام إلى قطبين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تَقَاطُب مصدر على وزن تَفَاعُل يدلّ على الفعل والحدث (عملية الانقسام إلى قطبين متعاكسين)، أكثر ديناميكية من قُطْبِيَّة"
      actions:
        - command: create_entry
          params: {lemma: "تَقَاطُب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَنَاقُض"
      source: stage1
      decision: removed
      decision_reason: >
        التناقض مصطلح منطقي يدلّ على اختلاف قضيتين بالسلب والإيجاب، وهو أخصّ وأضيق من مفهوم القطبية.
        المعاجم الكلاسيكية والحديثة تحصره في التعارض المنطقي بين القضايا، لا في العلاقة بين صفتين متعاكستين.

    - lemma: "تَضَايُف"
      source: stage1
      decision: removed
      decision_reason: >
        التضايف عند الحكماء يدلّ على الارتباط المتبادل (correlation) بين شيئين يُعقل كلّ منهما بالقياس
        إلى الآخر كالأبوّة والبنوّة. وهو نوع من التقابل يختلف جوهرياً عن القطبية؛ فالمتضايفان متلازمان
        لا متعاكسان.

    - lemma: "تَعَاكُس"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شواهد معجمية تدعم استعمال «تعاكس» بمعنى القطبية. المعاجم تحصره في الانعكاس الرياضي
        (inversion) والعمل بالعكس عند أرباب الحساب. ليس مصطلحاً مسكوكاً للدلالة على العلاقة بين صفتين متعاكستين.

