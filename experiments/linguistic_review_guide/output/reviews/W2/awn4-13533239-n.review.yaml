# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13533239-n  |  ILI: i107735  |  POS: n
# المفهوم: materialization / materialisation
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تجسد، تحقق) خاليتان من التشكيل — إلزامي التحديث."
      - "تحقُّق في الاستخدام الحديث تعني أساساً التثبّت والإثبات (verification) أكثر من دلالة الخروج إلى الوجود؛ مما يُوجب التأنّي في الاحتفاظ بها."
      - "التعريف الحالي مبنيٌّ على قالب ترجمي مباشر ويفتقر إلى الجنس القريب الصريح المأخوذ من المُفرَدِمة الأعلى (عملية طبيعية)."
      - "المجموعة تفتقر إلى مصطلح يُعبّر بوضوح عن الحدوث والنشأة من العدم دون تحيّز مادي أو معرفي."
    observations: >
      المجموعة تمثّل مفهوماً فلسفياً دقيقاً يعبّر عن الانتقال من طور الإمكان أو الكمون إلى
      طور الوجود الفعلي. تجسُّد يحمل بُعداً جسدياً/مادياً صريحاً يناسب تحوّل الأفكار إلى
      وجود محسوس. تحقُّق يحمل بُعداً معرفياً (إحكام الحق وصحّته) يُلائم التعبير عن تثبّت
      الشيء وصحة وقوعه. يُستحسن إضافة تكوُّن الذي يستمدّ قوّته من الأصل الفلسفي «كان
      يكون كوناً إذا وقع وحضر» دون أي تحيّز دلالي خاص.

  # أ. اللمّات المرشّحة — توليد أعمى انطلاقاً من التعريف المُقنَّع فقط
  # التعريف المقنَّع: "عملية الخروج إلى الوجود؛ التحول إلى واقع"
  blind_candidates:
    - lemma: "تَكَوُّن"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل تكوَّن، من الجذر (ك و ن)، على وزن تَفَعُّل. دلالته الأصيلة هي الحدوث
        والوقوع («كان الشيء يكون كوناً إذا وقع وحضر»). يُعبّر عن عملية لا عن حالة، فيُوافق
        كون المُفرَدِمة الأعلى «عملية طبيعية». يتجنّب الدوران: لا يتكرر فيه أي من ألفاظ
        التعريف (خروج، وجود، تحول، واقع).

    - lemma: "انْبِثَاق"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل انبثق، من الجذر (ب ث ق) الذي يدلّ على التفتّح والانبعاث. دلالته العامة:
        بروز الشيء وظهوره من مصدر كامن. يُدرج مرشحاً لتقييم ملاءمته للمعنى المجرّد مقابل
        الاستخدامات المادية الطاغية في المصطلحيات.

    - lemma: "تَجَلٍّ"
      generation_method: majaz
      justification: >
        من الجذر (ج ل و) الذي يدلّ على «انكشاف الشيء وبروزه» (مقاييس اللغة). الإزاحة
        الدلالية: من كشف النقاب والانكشاف الحسّي إلى ظهور الشيء في الواقع وخروجه إلى
        الوجود. تعبير مستعمل في الفلسفة العربية للتعبير عن manifestation.

    - lemma: "تَمَثُّل"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل تمثَّل، من الجذر (م ث ل)، وزن تَفَعُّل. الدلالة: أخذ الشيء صورته الفعلية
        (تمثَّل له: ظهر في صورة ملموسة). قد يُعبّر عن تحوّل الشيء من المجرّد إلى المحسوس،
        أي «التحول إلى واقع» — لكنه يحمل أيضاً معنى التصوّر والمحاكاة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة: ٥ استعلامات
#  ١. مطابقة دفعية للمّات الموجودة والمرشّحات (بصيغتَي ال- وبدونها) — ١٢ حداً
#  ٢. جسر إنجليزي: materialization/materialisation/actualization/realization/embodiment/manifestation
#  ٣. بحث FTS عربي: خروج/وجود/تحول/واقع/مادية/تجسيد
#  ٤. مقاييس ابن فارس: جسد/جل/جلو/كون/مثل/بثق
#  ٥. مقاييس ابن فارس: حقق/حق
stage2_evidence:
  per_lemma:

    - lemma: "تجسد"
      confirm:
        - text: "«الشَّيءُ: صار ذا جسدٍ»"
          source: "المعجم الكبير"
        - text: "«(تجسد) مُطَاوع جسده»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«التجسد: كل روح ظهر في جسم ناري أو نوري»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "embodiment → «(1) تجسيد؛ تجسُّد (2) تضمين؛ تضمّن (3) مثال؛ عنوان [الشجاعة أو الإخلاص]»"
          source: "المورد الحديث (2008)"
        - text: "incarnation → «(1) تجسيد. تجسُّد (2) تجسيد إلهٍ [في شكل أرضيّ]. التجسُّد؛ تجسُّد المسيح»"
          source: "المورد الحديث (2008)"

    - lemma: "تحقق"
      confirm:
        - text: "«(تحقق) الأمر صحَّ ووقع، والأمر: عرف حقيقته»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«الأمر: صح ووقع»"
          source: "المعجم الوسيط (OCR)"
        - text: "«هو عند الأشاعرة مرادف للثبوت والكون والوجود. وعند المعتزلة مرادف للثبوت وأعم من الكون والوجود»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "realization → «(1) تحقيق. تحقُّق. (2) تحويل الأسهم إلى نقد. (3) إدراك؛ فهم»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "تحقق — verification في مصطلحيات المناخ والتربية والطاقة المتجددة واللسانيات والكهرباء وعلم الاجتماع"
          source: "ARABTERM (مصطلحيات متعددة)"
          conflict: >
            الترجمة السائدة في المصطلحيات الحديثة تعني التثبّت والإثبات (verification)،
            وليس الخروج إلى الوجود؛ مما يُثير اشتراكاً لفظياً مع الدلالة المقصودة.
      expands:
        - text: "Actualization — «عملية تنتقل بواسطتها وحدة في اللغة من المستوى التجريدي إلى المستوى الفعلي في الإنجاز»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: >
            يُؤكد أن التحقيق/التحقّق تُستعمل في سياق الانتقال من التجريدي إلى الفعلي، وهو
            قريب من المعنى المقصود في المجموعة ويُسنده.

    - lemma: "تَكَوُّن"
      confirm:
        - text: "«(تكون) الشيء حدث»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«الشيء: حدث. يقال: كوَّنه فتكوَّن»"
          source: "المعجم الوسيط (OCR)"
        - text: "تَكَوُّن — genesis (en)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "تَكَوُّن — poiesis (en)"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«الكاف والواو والنون أصل يدل على الإخبار عن حدوث شيء، إما في زمان ماضٍ أو زمان راهن. يقولون: كان الشيء يكون كوناً إذا وقع وحضر»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "انْبِثَاق"
      confirm:
        - text: "emergence — «فعل انبجاس وحالة لما ينبثق للإشارة إلى مكان الفعل كإشعاع يخترق تعبير عصر أو مرحلة أدبية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«انبعاث غاز أو رائحة أو ضوء من جسم ما، دون تغيير ظاهر لشكل أو حجم الجسم» — emanation"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          conflict: "الدلالة المعجمية السائدة هي انبعاث المواد المادية (غازات، دخان، أبخرة)، لا الخروج المجرّد إلى الوجود."
        - text: "«الهواء والدخان من البركان» — exhalation / extrusion"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "دلالة جيولوجية/فيزيائية محددة تُناقض الاستخدام المجرّد."
        - text: "«الباء والثاء والقاف يدل على التفتّح في الماء وغيره. البثق: بثق الماء»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل اللغوي مرتبط بانبعاث الماء وتفتّح المجاري المائية، مما يُقيّد التوسّع المجازي."

    - lemma: "تَجَلٍّ"
      confirm:
        - text: "manifestation — «تجلّ / ج:تجليات»"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
        - text: "manifestation → «(1) إظهار؛ إبداء؛ جلاء. (ب) ظهور؛ تجلٍّ»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الجيم واللام والحرف المعتل أصل واحد، وقياس مطّرد، وهو انكشاف الشيء وبروزه. ويقال تجلّى الشيء إذا انكشف»"
          source: "مقاييس اللغة لابن فارس (جلو)"
          addition: >
            يُثبت أن الأصل اللغوي للتجلّي هو الانكشاف والبروز الحسّي، لا الحدوث والنشأة؛
            مما يُبعده عن محور المجموعة ويُضيّق دلالته.

    - lemma: "تَمَثُّل"
      contradicts:
        - text: "assimilation — «عملية حيوية يتمكن الكائن الحيّ بموجبها من تحويل المواد الغذائية المتناولة إلى مواد مماثلة»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "الدلالة البيولوجية (الاستيعاب الغذائي) بعيدة تماماً عن مفهوم الخروج إلى الوجود."
        - text: "representation — تمثُّل (en: representation)"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
          conflict: "دلالة فلسفية (التمثّل المعرفي) تُناقض معنى الخروج إلى الوجود."
        - text: "«(تمثل) الشيء تصوّر مثاله»"
          source: "المعجم الوسيط (hawramani)"
          conflict: "التصوّر الذهني نقيض الوجود الفعلي؛ يعكس المعنى المطلوب."
        - text: "«الميم والثاء واللام أصل صحيح يدل على مناظرة الشيء للشيء»"
          source: "مقاييس اللغة لابن فارس (مثل)"
          conflict: "الأصل اللغوي قائم على المماثلة والمطابقة، لا على الحدوث والنشأة."


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١: تجسد ──
    - lemma: "تجسد"
      decision: confirmed
      decision_reason: >
        اللمّة راسخة معجمياً بمعنى التحوّل إلى كيان ذي جسد/صورة فعلية (المعجم الكبير:
        «صار ذا جسدٍ»). ابن فارس يُعلي جذر جسد على «التجمّع والاشتداد»، وهو ما يُجسّد
        الانتقال من المجرّد إلى الملموس. علاقتها بـ embodiment ثابتة بشواهد متعددة. لا
        اشتراك لفظي مُقلق في الاستخدام الكلاسيكي. تستوجب إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على البُعد الجسدي/المادي: أخذ الشيء صورةً جسمانيةً ملموسةً. يُلائم تحوّل
        الأفكار والمجرّدات إلى وجود حسّي (الفكرة تجسَّدت في مشروع، الحلم تجسَّد في إنجاز).
        الأنسب في السياق الفني والديني والاجتماعي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجَسُّد"

    # ── لمّة موجودة ٢: تحقق ──
    - lemma: "تحقق"
      decision: confirmed
      decision_reason: >
        الشواهد الكلاسيكية قاطعة: المعجم الوسيط («الأمر صح ووقع») وكشّاف التهانوي
        («مرادف للثبوت والكون والوجود»). هذه الشواهد تُثبت صلةً وثيقة بمعنى الوقوع
        والتحقّق الفعلي. أما الاستخدام الحديث كـ verification فهو دلالة متفرّعة لاحقة لا
        تُلغي الدلالة الجوهرية الكلاسيكية. الاحتفاظ بها مع التنويه بمحدودية الدلالة في
        السياق المعاصر. تستوجب إضافة التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على البُعد المعرفي/الوجودي: إحكام الشيء وصحّته وانتقاله من المشكوك فيه
        أو المتوقَّع إلى المثبَت والواقع (أصل: إحكام الحق وصحّته). يُلائم السياقات التي
        تنطوي على مسار من التساؤل والترقّب إلى الثبوت (تحقّق التنبّؤ، تحقّق الأمل،
        تحقّق النظرية). أكثر ملاءمةً للسياق المعرفي والعلمي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحَقُّق"

    # ── مرشّح المرحلة ١: تَكَوُّن (مُؤكَّد) ──
    - lemma: "تَكَوُّن"
      source: stage1
      decision: confirmed
      decision_reason: >
        أدلة المعاجم قاطعة: المعجم الوسيط («الشيء حدث»)، وابن فارس («يدل على الإخبار
        عن حدوث شيء... كان الشيء يكون كوناً إذا وقع وحضر»). الجذر (ك و ن) هو الأصل
        الفلسفي للوجود في التراث العربي. تكوُّن مصدر على وزن تَفَعُّل يُعبّر عن عملية
        لا حالة. يُقابل genesis/poiesis في المصطلحيات. اجتاز بوابات الجودة الستة:
        اطّراداً وشيوعاً وملاءمةً وإيثاراً للتراثي وإيثاراً للعربي واشتقاقيةً. لا يحمل
        تحيّزاً مادياً (كتجسُّد) ولا معرفياً (كتحقُّق)، مما يُتيح تغطية المفهوم بأعمّ صورة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الحدوث والنشأة من العدم أو من مكوّنات سابقة دون أي تحيّز مادي أو
        معرفي. الأعمّ دلالةً بين أخواته: يصلح للوجود الفيزيائي والمجرّد على حدٍّ سواء
        (تكوُّن الكون، تكوُّن ظاهرة اجتماعية، تكوُّن مؤسسة).
      actions:
        - command: create_entry
          params:
            lemma: "تَكَوُّن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشّح المرحلة ١: انبثاق (مرفوض) ──
    - lemma: "انْبِثَاق"
      source: stage1
      decision: removed
      decision_reason: >
        الأصل اللغوي (بثق: تفتّح المياه وانبعاثها) والاستخدام المعجمي السائد في ARABTERM
        (غازات، دخان بركاني، exhalation/emanation) يُقيّدانه بالمعنى المادي الفيزيائي.
        لا يُلائم الانتقال المجرّد من الإمكان إلى الوجود.

    # ── مرشّح المرحلة ١: تَجَلٍّ (مرفوض) ──
    - lemma: "تَجَلٍّ"
      source: stage1
      decision: removed
      decision_reason: >
        أثبتت الأدلة ارتباطه بالانكشاف الحسّي (جلا السيف، تجلّى القمر) وبالظهور
        الصوفي/الديني (التجلّي الإلهي). لا يدلّ على النشأة والخروج إلى الوجود بل على
        الانكشاف لمن هو أصلاً موجود. حِمله الصوفي يُعيق قبوله مصطلحاً علمياً عاماً.

    # ── مرشّح المرحلة ١: تَمَثُّل (مرفوض) ──
    - lemma: "تَمَثُّل"
      source: stage1
      decision: removed
      decision_reason: >
        الشواهد تُثبت استقراره على معنيَيْن مُغايرَيْن: (١) التمثّل البيولوجي assimilation
        و(٢) التمثّل المعرفي representation. الأصل اللغوي (المناظرة والمماثلة) يُناقض اتجاه
        المجموعة (خروج إلى الوجود). اختبار الاستبدال: لا يُلائم سياقات materialization.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "عملية الخروج إلى الوجود؛ التحول إلى واقع"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مبنيٌّ على قالب ترجمي مباشر من الإنجليزية (coming into being →
        الخروج إلى الوجود). البنية الثنائية بالفاصلة المنقوطة غير اصطلاحية في معاجم
        الوسيط. يفتقر إلى الجنس القريب الصريح من المُفرَدِمة الأعلى (عملية طبيعية)
        وإلى الفصل النوعي الكافي. يلزم إعادة صياغة وفق أسلوب المعجم الوسيط.
