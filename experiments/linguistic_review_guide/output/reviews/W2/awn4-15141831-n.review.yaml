stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي طويل بعض الشيء ويمكن صياغته بأسلوب معجمي أوجز."
    observations: "المصطلح 'توقيت صيفي' هو المصطلح المعياري والشائع في اللغة العربية المعاصرة لهذا المفهوم، وهو مركب وصفي ثابت."
  blind_candidates:
    - lemma: "تَوْقِيتٌ صَيْفِيٌّ"
      generation_method: tarkib
      justification: "المركب الوصفي الأكثر شيوعاً لهذا المفهوم في المجامع اللغوية والاستعمال الرسمي."
    - lemma: "التَّوْقِيتُ الصَّيْفِيُّ"
      generation_method: tarkib
      justification: "الصيغة المعرفة التي غالباً ما تستخدم كمصطلح فني مستقل."
    - lemma: "نِظَامُ التَّوْقِيتِ الصَّيْفِيِّ"
      generation_method: tarkib
      justification: "تعبير إضافي وصفي يشير إلى النظام الزمني نفسه."
    - lemma: "تَوْقِيتُ الصَّيْفِ"
      generation_method: tarkib
      justification: "صيغة إضافية بديلة مقبولة لغوياً."

stage2_evidence:
  per_lemma:
    - lemma: "تَوْقِيتٌ صَيْفِيٌّ"
      confirm:
        - text: "«توقيت صيفي»، المقابل الإنجليزي: summer time."
          source: "مسرد الفن، التسلية والرياضة (ArabTerm)"
        - text: "«التوقيت الصيفي.»، المقابل الإنجليزي: daylight saving time."
          source: "المورد الحديث (2008)"
    - lemma: "صَيْفِيٌّ"
      confirm:
        - text: "«المنسوبُ إلى الصيف كلُّ ما حدث فى الصيف»"
          source: "المعجم الوسيط"
    - lemma: "تَوْقِيتٌ"
      confirm:
        - text: "«تحديد إلى وقت الشيء.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«هو التقدير للشيء زماناً.»"
          source: "التعريفات الفقهية للبركتي"

stage3_analysis:
  per_lemma:
    - lemma: "توقيت صيفي"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والشائع والمعتمد في المعاجم التقنية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوْقِيتٌ صَيْفِيٌّ"
    - lemma: "التَّوْقِيتُ الصَّيْفِيُّ"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة معرفة مستخدمة بكثرة في السياقات الرسمية كمصطلح تقني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "التَّوْقِيتُ الصَّيْفِيُّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الوقت الذي يتم فيه تقديم الساعات ساعة واحدة قبل التوقيت القياسي المحلي؛ يعتمد على نطاق واسع خلال الصيف لتوفير ضوء نهار إضافي في المساء"
    assessment:
      decision: revise
      reason: "الصياغة الحالية وصفية طويلة، ويفضل تبني أسلوب التعريف المصطلحي المركز."
    authored:
      - type: terminological
        text: "نِظَامٌ زَمَنِيٌّ يَقُومُ عَلَى تَقْدِيمِ السَّاعَةِ سَاعَةً وَاحِدَةً عَنِ التَّوْقِيتِ الْقِيَاسِيِّ فِي أَشْهُرِ الصَّيْفِ، بِقَصْدِ الِاسْتِفَادَةِ مِنْ طُولِ النَّهَارِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "نِظَامٌ زَمَنِيٌّ يَقُومُ عَلَى تَقْدِيمِ السَّاعَةِ سَاعَةً وَاحِدَةً عَنِ التَّوْقِيتِ الْقِيَاسِيِّ فِي أَشْهُرِ الصَّيْفِ، بِقَصْدِ الِاسْتِفَادَةِ مِنْ طُولِ النَّهَارِ."}

  examples:
    per_lemma:
      - lemma: "تَوْقِيتٌ صَيْفِيٌّ"
        examples:
          - text: "تُقَرِّرُ بَعْضُ الدُّوَلِ إِيقَافَ الْعَمَلِ بِالتَّوْقِيتِ الصَّيْفِيِّ لِتَوْفِيرِ الطَّاقَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يَبْدَأُ الْعَمَلُ بِالتَّوْقِيتِ الصَّيْفِيِّ فِي كَثِيرٍ مِنَ الدُّوَلِ مَعَ بِدَايَةِ فَصْلِ الرَّبِيعِ."}

