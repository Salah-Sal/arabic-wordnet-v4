          root: "وقت"
          maqayis_quote: "«الْوَاوُ وَالْقَافُ وَالتَّاءُ: أَصْلٌ يَدُلُّ عَلَى حَدِّ شَيْءٍ وَكُنْهِهِ فِي زَمَانٍ وَغَيْرِهِ. مِنْهُ الْوَقْتُ: الزَّمَانُ الْمَعْلُومُ.»"
        - word: "صيفي"
          root: "صيف"
          maqayis_quote: "«الصَّادُ وَالْيَاءُ وَالْفَاءُ أَصْلَانِ، أَحَدُهُمَا يَدُلُّ عَلَى زَمَانٍ... فَالْأَوَّلُ الصَّيْفُ، وَهُوَ الزَّمَانُ بَعْدَ الرَّبِيعِ الْآخِرِ.»"
