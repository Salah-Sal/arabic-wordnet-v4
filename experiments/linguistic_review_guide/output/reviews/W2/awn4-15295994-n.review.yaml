# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15295994-n
# pause / intermission / break / interruption / suspension
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «فترة توقف» تركيب وصفي حر وليس وحدة معجمية ثابتة — يمكن إبدال «فترة» بـ«مدة» أو «برهة» دون تغيير المعنى"
      - "التعريف العربي الحالي قريب من الترجمة الحرفية للتعريف الإنجليزي"
      - "اللمّتان «استراحة» و«توقف» تفتقران إلى التشكيل الكامل"
    observations: "المفهوم يدور حول فاصل زمني مؤقت يتوقف فيه شيء ما ثم يُستأنف. وهو مفهوم عام يشمل الاستراحة في العمل والوقفة في الكلام والتوقف في النشاط. اللمّات الموجودة تغطي جانب الراحة (استراحة) والكف عن الفعل (توقف) لكن تفتقر إلى لفظ يدل على الفاصل الزمني القصير بوصفه وقفة."
  blind_candidates:
    - lemma: "وَقْفَة"
      generation_method: ishtiqaq
      justification: "من الجذر «وقف» على وزن فَعْلة (اسم المرة)، تدل على لحظة توقف واحدة عن النشاط، وتُستعمل في اللسانيات والخطابة بمعنى pause"
    - lemma: "انْقِطَاع"
      generation_method: ishtiqaq
      justification: "من الجذر «قطع» على وزن انفعال (مصدر انقطع)، يدل على حدوث فصل أو توقف في سيرورة ما، يقابل interruption"
    - lemma: "هُدْنَة"
      generation_method: majaz
      justification: "أصلها المصالحة بعد الحرب والسكون، ويمكن توسيع دلالتها مجازاً لتشمل أي فترة سكون وتوقف مؤقت"
    - lemma: "تَعْلِيق"
      generation_method: ishtiqaq
      justification: "من الجذر «علق» على وزن تفعيل، بمعنى إيقاف شيء مؤقتاً مع نية استئنافه، يقابل suspension"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِسْتِرَاحَة"
      confirm:
        - text: "«الْانْقِطاعُ عن العَمَلِ أو نَحْوِه فتْرةً ما طلًبا للرَّاحَةِ الفَتْرَةُ أو المدَّةُ التِي يُسْتَرَاحُ فيها. ومنها الفَتْرَةُ الزمنِيَّةُ الَّتِى تتخلل فُصولَ عَمَل فَنَّىٍّ أو رياضى»"
          source: "المعجم الكبير"
        - text: "«استراحة — translation_en: pause»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«استراحة — translation_en: break»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "«فترة استراحة وانتعاش كائن بيولوجي بعد مجهود بدني و/أو عقلي»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "تُضيف بُعد الانتعاش البيولوجي بعد المجهود"
        - text: "«(2) فترة استراحة، وبخاصة في حفلة عامة أو بين فصول المسرحية»"
          source: "المورد الحديث (intermission)"
          addition: "تخصيص الاستراحة في السياق المسرحي والفني"

    - lemma: "تَوَقُّف"
      confirm:
        - text: "«(توقف) عَن كَذَا امْتنع وكف وَعَلِيهِ تثبت وَفِيه تمكث وانتظر»"
          source: "المعجم الوسيط"
        - text: "«التَّوَقُّف: هو التلوم والامتناع والكفُّ»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«(1) توقُّف مؤقّت (2) وَقْف قصير [في الكلام أو القراءة]»"
          source: "المورد الحديث (pause)"
        - text: "«توقف — translation_en: halt»"
          source: "المعجم الموحد لمصطلحات النقل"
      expands:
        - text: "«تَوَقُّف — الجذر: و ق ف — مثال: تَوَقُّف العمل — الرأي: مرفوضة — السبب: لأن فعله تَوقَّف لم يرد في المعاجم — الصواب والرتبة: تَوَقُّف العمل [فصيحة] — وَقْفُ العمل [فصيحة] — التعليق: جاء في القاموس المحيط وَقَفْتُه كوقَّفْته ولذا يُصوَّب استعمال المطاوع القياسيّ منه»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "تأكيد فصاحة المصدر تَوَقُّف رغم اعتراض بعض اللغويين"

    - lemma: "فَتْرَة تَوَقُّف"
      evidence_status: "no_material_found"

    # ── المرشحات ──
    - lemma: "وَقْفَة"
      confirm:
        - text: "«لحظة توقف نشاط أو عمل، يعتبر في الآداب استراحة محارب؛ بالنسبة لخطيب يتوقف خلال الخطبة لاسترجاع الأنفاس وقياس وقع كلامه على الجمهور أو لانتهاء المعنى أو المقطع»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«وَقْفة — translation_en: pause»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ArabTerm)"
      expands:
        - text: "«(الوقفة) الْمرة والريب وكل عقب لف على الْقوس و (يَوْم الوقفة) يَوْم الْوُقُوف بِعَرَفَات فِي الْحَج»"
          source: "المعجم الوسيط"
          addition: "للوقفة معانٍ أخرى: المرة من الوقوف، ويوم الوقفة (عرفات)"
        - text: "«الوقفة: الحبس بين مقامين لعدم استيفاء حقوق الذي خرج منه وعدم استحقاق دخوله في المقام الأعلى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "دلالة صوفية: مرحلة بين مقامين"

    - lemma: "انْقِطَاع"
      confirm:
        - text: "«انقطاع — translation_en: interruption»"
          source: "المعجم الموحد لمصطلحات القانون"
        - text: "«انقطاع — translation_en: break»"
          source: "المعجم الموحد للمصطلحات المهنية (طباعة-كهرباء)"
      contradicts:
        - text: "«انقطاع — عدم الاتصال — translation_en: discontinuity»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
          conflict: "في السياق الرياضي والفيزيائي يعني عدم الاتصال لا التوقف المؤقت"
        - text: "«الانقطاع: هو في اصطلاح المناظرة اختتام البحث... وعند المحدّثين هو كون الحديث منقطعاً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "في الاصطلاح الحديثي والمنطقي يدل على القطع النهائي لا المؤقت"

    - lemma: "هُدْنَة"
      contradicts:
        - text: "«المصالحة بعد الحرب, أو فترة تعقب الحرب يتهيأ فيها العدوان للصلح, ولها شروط خاصة»"
          source: "المعجم الوسيط"
          conflict: "مقصورة على السياق العسكري والدبلوماسي — لا تُستعمل للتوقف المؤقت العام"
        - text: "«هدنة — وقف الحرب أو الصراع بين دولتين أو أكثر — translation_en: armistice; truce»"
          source: "المعجم الموحد لمصطلحات القانون"
          conflict: "الترجمة الإنجليزية armistice/truce تؤكد التخصص العسكري"
      expands:
        - text: "«الهاء والدال والنون أُصَيْلٌ يدل على سكون واستقامة. تهادن الأمر: استقام. ومنه قياس الهدنة»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على السكون عموماً لكن الاستعمال تخصص في الهدنة العسكرية"

    - lemma: "تَعْلِيق"
      contradicts:
        - text: "«تعليمة يؤدي تنفيذها إلى توقف برنامج أو جزء منه»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          conflict: "المصطلح في السياق الحاسوبي يعني إيقاف البرنامج لا الفترة الزمنية"
      expands:
        - text: "«(1) يتوقَّف؛ يَكُفّ عن (2) يُنهي (3) تَوَقُّف [مؤقَّت]»"
          source: "المورد الحديث (surcease)"
          addition: "surcease يقابل التوقف المؤقت لكن المصطلح العربي المقابل هو توقف لا تعليق"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِسْتِرَاحَة"
      decision: confirmed
      decision_reason: "المعجم الكبير يؤكد دلالتها على الانقطاع عن العمل فترةً ما طلباً للراحة، والفترة الزمنية التي تتخلل فصول عمل فني أو رياضي. وهي مطابقة لمعنى المجموعة الترادفية. كما أن عدة معاجم مصطلحية (ArabTerm) تقابلها بـ pause وbreak."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تتضمن معنى طلب الراحة والانتعاش — فالتوقف فيها مقصود لغرض الاستجمام، بخلاف التوقف المحايد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِرَاحَة"

    - lemma: "تَوَقُّف"
      decision: confirmed
      decision_reason: "المعجم الوسيط والتعريفات الفقهية والمورد الحديث تؤكد دلالته على الامتناع والكف والتلوم. المورد الحديث يقابله صراحة بـ pause بمعنى «توقف مؤقت». معجم الصواب اللغوي يؤكد فصاحته."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على مطلق الكف والامتناع عن الفعل — أعمّ من الاستراحة لأنه لا يستلزم غرض الراحة، وأعمّ من الوقفة لأنه لا يستلزم القِصَر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَقُّف"

    - lemma: "فَتْرَة تَوَقُّف"
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل في اختبار السكّ: يمكن إبدال «فترة» بـ«مدة» أو «برهة» دون تغيير المعنى الاصطلاحي. لم يُعثر على أي دليل معجمي يسجله كوحدة معجمية ثابتة. فضلاً عن أنه يكرر مكوّنات التعريف نفسه (فترة + توقف)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "وَقْفَة"
      source: stage1
      decision: confirmed
      decision_reason: "المعجم الموحد لمصطلحات اللسانيات يعرّفها بأنها «لحظة توقف نشاط أو عمل» ويقابلها بـ pause. والمعجم الوسيط يذكرها بمعنى المرّة من الوقوف. وهي مصطلح فصيح مسجّل معجمياً يضيف بُعد القِصَر والآنيّة إلى المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على لحظة توقف قصيرة آنيّة — أقصر من الاستراحة وأخص من التوقف، وتُستعمل في سياق الكلام والخطابة"
      actions:
        - command: create_entry
          params: {lemma: "وَقْفَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "انْقِطَاع"
      source: stage1
      decision: removed
      decision_reason: "رغم أن بعض المعاجم المصطلحية تقابله بـ interruption وbreak، فإن الأدلة المعجمية الكلاسيكية (كشّاف التهانوي) تُظهر أنه يدل على الفعل ذاته (حدث القطع) لا على الفترة الزمنية. كما أن استعمالاته العلمية (discontinuity) تدل على عدم الاتصال لا التوقف المؤقت."
      evidence_assessment:
        case: mixed

    - lemma: "هُدْنَة"
      source: stage1
      decision: removed
      decision_reason: "جميع الأدلة المعجمية تحصر دلالتها في المصالحة بعد الحرب والسياق العسكري-الدبلوماسي. التوسيع المجازي إلى التوقف المؤقت العام غير مسجّل معجمياً وسيُوقع في الالتباس."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَعْلِيق"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على دليل معجمي يدعم استعماله بمعنى فترة التوقف المؤقت. دلالته في المعاجم تتركز على الإيقاف الحاسوبي أو التعليق بمعنى الإرجاء، وهو يدل على الفعل لا على الفترة الزمنية."
      evidence_assessment:
        case: contradicts_only


