          maqayis_quote: "«الضَّادُ وَالدَّالُ كَلِمَتَانِ مُتَبَايِنَتَانِ فِي الْقِيَاسِ. فَالْأُولَى: الضِّدُّ ضِدُّ الشَّيْءِ. وَالْمُتَضَادَّانِ: الشَّيْئَانِ لَا يَجُوزُ اجْتِمَاعُهُمَا فِي وَقْتٍ وَاحِدٍ.»"
