stage1_review:
  assessment:
    concerns:
      - "عدم وجود تشكيل للمات."
      - "صيغة 'طارد للغازات' مستخدمة كشبه جملة وصفية، والأفضل أن تُشكل كمركب وصفي 'طَارِدٌ لِلْغَازَاتِ'."
    observations: "المجموعة تمثل مفهوماً طبياً دقيقاً (Carminative / Antiflatulent). اللمات الحالية تمثل ترجمات معاصرة متداولة. يمكن تحسين المجموعة بإضافة مصطلحات أكثر دقة وتأصيلاً من المعاجم الطبية والصيدلانية مثل 'طارد الأرياح' و'مضاد التطبل'."
  blind_candidates:
    - lemma: "طَارِدُ الأَرْيَاحِ"
      generation_method: ishtiqaq
      justification: "مصطلح طبي تراثي ومعتمد في المعاجم الحديثة لمضادات الغازات."
    - lemma: "مُضَادُّ التَّطَبُّلِ"
      generation_method: tarkib
      justification: "تعبير دقيق عن الحالة الطبية لانتفاخ البطن بالغازات."
    - lemma: "طَارِدُ الرِّيحِ"
      generation_method: tarkib
      justification: "مصطلح صيدلاني معروف وموثق."
    - lemma: "مُنَفِّسٌ"
      generation_method: majaz
      justification: "اسم فاعل يدل على تخفيف الضغط والغازات من البطن."

stage2_evidence:
  per_lemma:
    - lemma: "طارد للغازات"
      evidence_status: "no_material_found"
    - lemma: "مضاد للانتفاخ"
      confirm:
        - text: "مضاد للانتفاخ - antibloat"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
    - lemma: "طارد الأرياح"
      confirm:
        - text: "طارِدُ الأَرْياح - carminative"
          source: "المعجم الطبي الموحد (2009)"
        - text: "طارد الأرياح: كل دواء يخرج الأرياح من القناة الهضمية."
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
    - lemma: "مضاد التطبل"
      confirm:
        - text: "مُضادُّ تَطَبُّلِ البَطْن - antiflatulent"
          source: "المعجم الطبي الموحد (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "طارد للغازات"
      decision: confirmed
      decision_reason: "مصطلح شائع جداً في الاستخدام الطبي الحديث لوصف الأدوية المخصصة لطرد الغازات، رغم عدم وروده نصاً في المعاجم المتوفرة، إلا أن بنيته صحيحة وواضحة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَارِدٌ لِلْغَازَاتِ"
    - lemma: "مضاد للانتفاخ"
      decision: confirmed
      decision_reason: "مصطلح طبي حديث وموثق في المعاجم المتخصصة، يشير إلى ما يمنع أو يعالج انتفاخ البطن الناجم عن الغازات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُضَادٌّ لِلانْتِفَاخِ"
    - lemma: "طَارِدُ الأَرْيَاحِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح طبي معتمد وموثق في المعاجم الصيدلانية والطبية المعاصرة ويحمل دلالة دقيقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "طَارِدُ الأَرْيَاحِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-02722862-n"
    - lemma: "مُضَادُّ التَّطَبُّلِ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير طبي دقيق يصف الأدوية المعالجة للتطبل الناجم عن غازات البطن، وموثق في المعجم الطبي الموحد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "مُضَادُّ التَّطَبُّلِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-02722862-n"

stage4_content:
  definition:
    current: "أي عامل يقلل من الغازات المعوية"
    assessment:
      decision: revise
      reason: "صياغة 'أي عامل' حرفية بعض الشيء، وتخصيص 'عامل طبي' أو 'دواء' يجعل التعريف أكثر دقة في السياق الطبي، مع إضافة وظيفة التخفيف."
    authored:
      - type: terminological
        text: "دَوَاءٌ أَو عَامِلٌ طِبِيٌّ يُسْهِمُ فِي طَرْدِ الغَازَاتِ المَعَوِيَّةِ وتَخْفِيفِ الانْتِفَاخِ النَّاجِمِ عَنْهَا."
