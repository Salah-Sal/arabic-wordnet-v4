        - word: "الأرياح"
          root: "روح"
          maqayis_quote: "«الرَّاءُ وَالْوَاوُ وَالْحَاءُ أَصْلٌ كَبِيرٌ مُطَّرِدٌ، يَدُلُّ عَلَى سَعَةٍ وَفُسْحَةٍ وَاطِّرَادٍ. وَأَصْلُ [ذَلِكَ] كُلِّهِ الرِّيحُ.»"
    - lemma: "مُضَادُّ التَّطَبُّلِ"
