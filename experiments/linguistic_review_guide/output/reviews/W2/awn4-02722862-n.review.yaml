          text: "دَوَاءٌ أَو عَامِلٌ طِبِيٌّ يُسْهِمُ فِي طَرْدِ الغَازَاتِ المَعَوِيَّةِ وتَخْفِيفِ الانْتِفَاخِ النَّاجِمِ عَنْهَا."
