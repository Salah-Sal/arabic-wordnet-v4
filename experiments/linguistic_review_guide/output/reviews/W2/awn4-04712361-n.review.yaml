        sense_id: "{auto}"
        text: "تُدْرَسُ قَابِلِيَّةُ القِسْمَةِ فِي عِلْمِ الحِسَابِ لِتَحْدِيدِ الأَعْدَادِ الأَوَّلِيَّةِ."

