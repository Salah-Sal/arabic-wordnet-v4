stage4_content:
  definition:
    current: "خاصية القابلية للقسمة؛ القدرة على التقسيم إلى أجزاء أو التوزيع بين عدد من الأشخاص"
    assessment:
      decision: revise
      reason: "تبسيط التعريف وإزالة التكرار (خاصية القابلية) وتجويد الصياغة المعجمية."
    authored:
      - type: terminological
        text: "صِفَةُ ما كانَ قابِلاً لِلقِسْمَةِ، وَهِيَ إِمْكانِيَّةُ التَّقْسيمِ إِلى أَجْزاءٍ أَوْ تَفْرِيقِ الحِصَصِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "قَابِلِيَّةُ القِسْمَةِ"
        examples:
          - text: "تُدْرَسُ قَابِلِيَّةُ القِسْمَةِ فِي عِلْمِ الحِسَابِ لِتَحْدِيدِ الأَعْدَادِ الأَوَّلِيَّةِ."
            type: usage
      - lemma: "قَابِلِيَّةُ التَّجْزِئَةِ"
        examples:
          - text: "تَتَمَيَّزُ المَوَادُّ السَّائِلَةُ بِقَابِلِيَّةِ التَّجْزِئَةِ لِأَنَّ جُزَيْئَاتِهَا غَيْرُ مُتَرَابِطَةٍ بِإِحْكَامٍ."
            type: usage
      - lemma: "انْقِسَامِيَّة"
        examples:
          - text: "جادَلَ بَعْضُ الفَلاسِفَةِ فِي الانْقِسَامِيَّةِ اللانِهائِيَّةِ لِلمادَّةِ."
            type: usage
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-04712361-n"
        definition_index: 0
        text: "صِفَةُ ما كانَ قابِلاً لِلقِسْمَةِ، وَهِيَ إِمْكانِيَّةُ التَّقْسيمِ إِلى أَجْزاءٍ أَوْ تَفْرِيقِ الحِصَصِ."
    - command: add_sense_example
