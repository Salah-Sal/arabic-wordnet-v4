stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي يحتوي على حشو لفظي (خاصية القابلية...)."
    observations: "المجموعة تعبّر عن مفهوم 'القابلية للقسمة' (Divisibility)، وهو مفهوم مركزي في الرياضيات والفيزياء والفلسفة. اللمّات الحالية دقيقة لكنها تقتصر على التراكيب الإضافية، بينما توفر العربية صيغاً اشتقاقية مجردة (اسم المصدر الصناعي) للتعبير عن هذا المفهوم في السياقات العلمية."
  blind_candidates:
    - lemma: "قَابِلِيَّةُ القِسْمَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي معياري للتعبير عن صفة القابلية للفعل، وهو المصطلح الرياضي الأشهر."
    - lemma: "انْقِسَامِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'انقسام'، يستخدم في السياقات الفلسفية والعلمية للتعبير عن مبدأ القابلية للقسمة."
    - lemma: "تَجَزُّؤِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'تجزؤ'، يعبر عن خاصية القابلية للتحول إلى أجزاء."
    - lemma: "قَسُومِيَّة"
      generation_method: ishtiqaq
      justification: "على وزن 'فعولية' للتعبير عن القابلية للفعل، مستمدة من 'قسوم' (قابل للقسمة)."

stage2_evidence:
  per_lemma:
    - lemma: "قابلية القسمة"
      confirm:
        - text: "قابلية القسمة (divisibility)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
        - text: "قابلية القسمة (divisibility)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
    - lemma: "قابلية التجزئة"
      confirm:
        - text: "وتكون هذه الخيوط إلى حد ما قابلة للتجزئة."
          source: "مسرد صناعة النسيج (أراب تيرم)"
        - text: "التزام قابل للتجزئة (divisible obligation)"
          source: "المعجم الموحد لمصطلحات القانون"
    - lemma: "انقسامية"
      evidence_status: "no_material_found"
    - lemma: "تجزؤية"
      evidence_status: "no_material_found"

