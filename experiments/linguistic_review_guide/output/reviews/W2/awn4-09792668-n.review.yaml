step0_evidence:
  per_lemma:
    - lemma: "خَصْم"
      confirm:
        - text: "«المُخاصِمُ. يستوِى فيه المُذَكَّرُ والمؤنَّثُ, والمُفْرَدُ والمُثَنَّى والجمعُ» — المعجم الكبير"
        - text: "«المُنازِع» — المعجم الكبير"
    - lemma: "غريم"
      expands:
        - text: "«الدائن، لأنه يلزم الذي عليه الدين، والمديون لأن الدين لازم له وأيضاً الخَصم» — التعريفات الفقهيّة للبركتي"
          addition: "يضيف دلالة الملازمة في الخصومة والارتباط الأصلي بالدين والمطالبة المالية"
    - lemma: "منافس"
      expands:
        - text: "«competitor» — المعجم الموحد لمصطلحات القانون"
          addition: "يركز على المجاذبة والمزاحمة في سياق المباريات أو الأسواق دون اشتراط العداوة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُخَاصِم"
      source_section: "step5_english_bridge"
      evidence_citation: "«مخاصِم؛ معادٍ؛ مُناوئ؛ منافِس» — المورد الحديث"
      justification: "اسم فاعل من خاصم، وهو يشير بدقة إلى من يباشر الخصومة، ورد كمرادف دقيق في المورد."
    - lemma: "مُنَاوِئ"
      source_section: "step5_english_bridge"
      evidence_citation: "«مخاصِم؛ معادٍ؛ مُناوئ؛ منافِس» — المورد الحديث"
      justification: "يعبر عن المعارضة وإظهار العداوة بقوة، وهو مناسب لدلالة opponent."
  knowledge_candidates:
    - lemma: "مُعَارِض"
      justification: "اشتقاق (اسم فاعل) من الفعل (عارض)، مأخوذ من نص التعريف (يبدي المعارضة)، وهو اللفظ الأشيع في السياقات السياسية والفكرية للتعبير عن هذا المفهوم."

step1_lemma_validation:
  per_lemma:
    - lemma: "خَصْم"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر للتعبير عن المنازع أو المخالف في قضية أو رأي."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يطلق على من يجادل وينازع غيره في دعوى أو حجة أو قضية (العداوة الإجرائية أو القانونية)."
      example: "تغلب المحامي على خصمه بالحجة والدليل."

    - lemma: "غريم"
      decision: confirmed
      decision_reason: "لفظ فصيح يستخدم في الاستعمال المعاصر بمعنى الخصم الملازم، رغم أصله المرتبط بالدَّين."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يطلق غالباً على الخصم الملازم لخصمه أو الملحّ عليه، وله دلالة أصلية ترتبط بالمديونية والدائنية، ويشيع استخدامه للخصم العنيد (الغريم التقليدي)."
      example: "التقى الفريقان في المباراة النهائية لمواجهة غريمهما التقليدي."

    - lemma: "منافس"
      decision: confirmed
      decision_reason: "مصطلح دقيق لوصف من يزاحم غيره للوصول إلى هدف مشترك."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يطلق على من يزاحم غيره في مسابقة أو مجال تجاري لبلوغ هدف مشترك، ولا يقتضي ذلك وجود عداوة شخصية."
      example: "قدمت الشركة عروضاً أفضل من منافسيها في السوق."

    - lemma: "مُخَاصِم"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل فصيح ومباشر من الفعل خاصم، ويؤدي المعنى بدقة."
      step05_citation: "«مخاصِم؛ معادٍ؛ مُناوئ؛ منافِس» — المورد الحديث"
