# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-14338498-n  |  ILI: i112173
# المعنى: حالة الضخامة / the state of being enlarged
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تضخم» مكتوبة بدون تشكيل كامل"
      - "اللمّة «توسع» مكتوبة بدون تشكيل كامل"
      - "التعريف «حالة التضخم» دائري: يستخدم لفظ «التضخم» نفسه مادةً تعريفيةً للمجموعة التي تحتوي على لمّة «تضخم»"
      - "«توسع» أقل دقة من «تضخم» لهذا المفهوم؛ إذ يدل التوسع على الانتشار في الفضاء والاتساع، لا على ضخامة الحجم الداخلي التي يعبّر عنها «تضخم»"
    observations: >
      المجموعة تعبّر عن مفهوم 'حالة الضخامة / الكون متضخّماً' (the state of being enlarged).
      اللمّتان الموجودتان مشتقتان من جذرَيْ ضخم ووسع. «التضخم» أدق توافقاً مع المفهوم لأنه
      المصطلح المعتمد في المعجمية الطبية والعلمية للتعبير عن enlargement/hypertrophy.
      أما «توسع» فيميل نحو دلالة dilatation/expansion — وهي حالة خاصة من الضخامة تتصل
      بالاتساع الأفقي لا بالتضخم الكلّي. الحاجة ملحّة: (أ) تشكيل اللمّتين، (ب) إصلاح التعريف
      تفادياً للدوران، (ج) النظر في إضافة مرادفات أدق.
  blind_candidates:
    - lemma: "اتِّساعٌ"
      generation_method: ishtiqaq
      justification: "مشتق من جذر وسع على وزن افتعال، يدل على الاتساع والتمدد في الحجم أو المساحة؛ خلاف الضيق"
    - lemma: "انتِفاخٌ"
      generation_method: ishtiqaq
      justification: "مشتق من جذر نفخ على وزن انفعال، يدل على تضخم الشيء وانتفاشه؛ مرتبط بالتضخم الناجم عن تراكم غاز أو سائل"
    - lemma: "تَفَخُّمٌ"
      generation_method: ishtiqaq
      justification: "مشتق من جذر فخم على وزن تفعّل؛ والفخامة في معاجم اللغة تدل على الجزالة والعِظَم وضخامة الجثة"
    - lemma: "انبِساطٌ"
      generation_method: ishtiqaq
      justification: "مشتق من جذر بسط على وزن انفعال؛ والبسط يدل على امتداد الشيء في عرضه واتساعه"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفّذت (٥ استعلامات):
#   Q1: مطابقة دفعية (تضخم+توسع+اتساع+انتفاخ+تفخم+انبساط + صيغ ال-)
#   Q2: إثراء بالمعرّف (definitions + examples لـ entry_ids المهمة)
#   Q3: جسر إنجليزي (enlargement / dilation / dilatation / hypertrophy / expansion / swelling)
#   Q4: بحث FTS بالكلمات المفتاحية (تضخم / توسع / ضخامة / تفخم)
#   Q5: تحقق من مرشحَي تفخم وضخامة
stage2_evidence:
  per_lemma:

    - lemma: "تضخم"
      confirm:
        - text: "«(في الطب) Enlargement (E): زيادةٌ في حجم عضو, أو نسيج؛ بسبب زيادة حجم الخلايا فيه,
            دون ازدياد ملحوظ في عددها, أو بسبب تراكم مواد غريبة في الخلايا, أو في الفضاءات
            المحيطة بها بكميات كبيرة, مثل زيادة حجم الكبد بسبب تراكم المواد الدهنية فيه,
            وتضخُّم اللوزتين»"
          source: "المعجم الكبير (entry_id=58218، المعنى الأول)"
        - text: "«تَضَخُّم ؛ ضَخامَة = hypertrophy»"
          source: "المعجم الطبي الموحد (2009) (entry_id=591866)"
        - text: "«تضخم = enlargement»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) (entry_id=453489)"
      expands:
        - text: "«تَضَخَّمَ الجذر: ض خ م — الصواب والرتبة: -تَضَخَّمت ثروته [فصيحة] -ضَخُمت ثروته [فصيحة]
            التعليق: يمكن تصويب استعمال الفعل «تضخَّم» على أنه مطاوع «ضَخَّمَ» لأن قياس
            المطاوعة لـ «فعَّل» هو «تفعَّل»»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (entry_id=851844)"
          addition: "يؤكد أن «تضخم» مصطلح فصيح مقبول، مطاوع «ضخّم»، ويدل على العِظَم والزيادة"
        - text: "«(في الاقتصاد) Inflation (E, F): تناقصُ قيمة العُمْلة الشرائية؛ نتيجةَ الزيادةِ
            المفرطة في النقد المتداول»"
          source: "المعجم الكبير (entry_id=58218، المعنى الثاني)"
          addition: "يدل على أن «تضخم» يحمل دلالة اقتصادية (inflation) إضافةً إلى الدلالة الطبية
            (enlargement)؛ مما قد يُوجب تحديد السياق"

    - lemma: "توسع"
      confirm:
        - text: "«تَوَسُّع = dilatation / ectasia / ectasis / ectasy»"
          source: "المعجم الطبي الموحد (2009) (entry_ids=571547,571559,571560)"
        - text: "«تَوَسُّع = expansion»"
          source: "مسرد الفلسفة وعلم النفس (entry_id=489629)"
      contradicts:
        - text: "«(توسع) الشَّيْء وسع وَالْقَوْم فِي الْمجْلس تَفَسَّحُوا فِيهِ»"
          source: "المعجم الوسيط (entry_id=892414)"
          conflict: "التعريف اللغوي يدل على التفسح والانتشار في المجلس أو الفضاء، لا على التضخم الكتلي.
            فمعنى «توسع» أقرب إلى spreading/expansion منه إلى enlargement/hypertrophy"
        - text: "«التوسع: الإتيان في عجز الكلام بمثنى مفسر باسمين ثانيهما معطوف على الأول»"
          source: "التوقيف على مهمات التعاريف للمناوي (entry_id=813452)"
          conflict: "في سياق البلاغة، التوسع مصطلح أسلوبي مختلف تماماً؛ مما يدل على إشكالية الاشتراك اللفظي"

    - lemma: "اتِّساعٌ"
      expands:
        - text: "«الاتّساع: هو عند الأطباء أن تتسع العصبة المجوّفة مع سعة الحدقة. وقيل هو اتساع ثقبة
            العنبية عن وضعها الطبيعي»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry_id=818850)"
          addition: "الاتساع في الاصطلاح الطبي القديم = Dilation — يدل على اتساع التجاويف والثقبات، وهو أخص
            من المعنى المطلوب (enlargement)"
      contradicts:
        - text: "«اتساع = extensification»"
          source: "المَكنَز الزراعي متعدد اللغات (entry_id=754268)"
          conflict: "في المصطلح الزراعي، اتساع تُرجِمت بـ extensification — مما يبعدها عن دلالة enlargement"
        - text: "«اتساع = Extension»"
          source: "المعجم الموحد لمصطلحات اللسانيات (entry_id=496438)"
          conflict: "في اللسانيات، اتساع = extension (امتداد التعيين)، وهو مفهوم مختلف عن حالة التضخم"

    - lemma: "انتِفاخٌ"
      confirm:
        - text: "«حالة من التضخم أو التوسع أو الانتفاخ»"
          source: "معجم المصطلحات الطبية ج.2 (2003) — distention (entry_id=736695)"
        - text: "«انتفاخ = swelling»"
          source: "المَكنَز الزراعي متعدد اللغات (entry_id=763682)"
        - text: "«انتفاخ = turgescence / turgidity»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) (entry_ids=457304,433923)"
        - text: "«انتفاخ = intumescence — خاصية الانتفاخ بالتسخين بسبب انطلاق غازات»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) (entry_id=431501)"
      expands:
        - text: "«النُّونُ وَالْفَاءُ وَالْخَاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْتِفَاخٍ وَعُلُوٍّ. مِنْهُ
            انْتَفَخَ الشَّيْءُ انْتِفَاخًا. وَيُقَالُ انْتَفَخَ النَّهَارُ: عَلَا»"
          source: "مقاييس اللغة لابن فارس (جذر نفخ)"
          addition: "الجذر نفخ أصيل يدل على الانتفاخ والعلو؛ ومنه انتفخ الشيء انتفاخاً"

    - lemma: "تَفَخُّمٌ"
      contradicts:
        - text: "«(فَخَمَ) الْفَاءُ وَالْخَاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى جَزَالَةٍ وَعِظَمٍ.
            يُقَالُ: مَنْطِقٌ فَخْمٌ: جَزْلٌ. وَيَقُولُونَ: الْفَخْمُ مِنَ الرِّجَالِ:
            الْكَثِيرُ لَحْمِ الْوَجْنَتَيْنِ»"
          source: "مقاييس اللغة لابن فارس (جذر فخم)"
          conflict: "الجذر فخم يدل على الجزالة والفخامة الصوتية والجسدية، لكن «تفخم» في الاصطلاح اللغوي
            العربي يعني بالحصر «الترقيق والتفخيم الصوتي» — وهو مصطلح علم التجويد والفونولوجيا،
            مختلف كلياً عن المعنى المقصود"

    - lemma: "انبِساطٌ"
      contradicts:
        - text: "«انبساط = extraversion / extroversion»"
          source: "مسرد الفلسفة وعلم النفس (entry_id=489646)"
          conflict: "في المصطلح النفسي، انبساط = extraversion (انطلاق الشخصية للخارج)، لا صلة بالتضخم"
        - text: "«انبساط = diastole»"
          source: "المعجم الطبي الموحد (2009) (entry_id=567233)"
          conflict: "في المصطلح الطبي، انبساط = diastole (ارتخاء عضلة القلب)؛ وهو مختلف عن enlarge"
      expands:
        - text: "«انْبسَاط: من (ب س ط) الانتشار وانطلاق اللسان والسرور وطول النهار وامتداد اليد»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry_id=914066)"
          addition: "الانبساط في اللغة يدل على الانتشار والامتداد والسرور؛ لا على الضخامة أو الكبر"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تضخم"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة توثيقاً قاطعاً في المعجم الكبير والمعجم الطبي الموحد وعشرات معاجم
        الاصطلاح بدلالة enlargement/hypertrophy. وأقرّها معجم الصواب اللغوي مصطلحاً فصيحاً.
        هي المصطلح الرئيسي في هذه المجموعة. تحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphology_check:
        pattern: "تَفَعُّل"
        root: "ضخم"
        note: "وزن تفعّل للمطاوعة — يدل على حصول الفعل في الشيء، مناسب لمفهوم 'state of being enlarged'"
      borrowing_check:
        type: native_derivation
        verdict: "مشتق عربي صحيح من جذر ضخم"
      nuance_differentiation: >
        يُعبّر تحديداً عن الضخامة الكتلية الناجمة عن زيادة حجم الخلايا (تضخم العضو)
        أو عن الزيادة المفرطة في الحجم بصفة عامة؛ يُستخدم في الطب للتعبير عن hypertrophy
        والضخامة المرضية، وفي الاقتصاد للتضخم المالي. أشمل وأعم من «توسع» و«انتفاخ».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَضَخُّم"

    - lemma: "توسع"
      decision: confirmed
      decision_reason: >
        رغم أن «توسع» يميل نحو دلالة expansion/dilatation أكثر من enlargement، إلا أن
        المعجم الطبي يثبت استخدامه مرادفاً طبياً مقبولاً في سياقات التضخم (كتوسع القولون
        وتوسع الأوعية). كما أن المعجم الموحد للطب البيطري يجمعه مع توسيع وتمديد = dilatation/dilation.
        يُقبل بوصفه مرادفاً فضفاضاً للمجموعة. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphology_check:
        pattern: "تَفَعُّل"
        root: "وسع"
        note: "وزن تفعّل للمطاوعة، جذر وسع يدل على خلاف الضيق — يدل على الاتساع لا الضخامة المطلقة"
      borrowing_check:
        type: native_derivation
        verdict: "مشتق عربي أصيل من جذر وسع"
      nuance_differentiation: >
        يُعبّر عن الضخامة الاتجاهية — أي التوسع في الحجم بالانتشار الأفقي أو اتساع التجاويف
        والمسالك. يُستخدم طبياً للتعبير عن dilatation (اتساع الأوعية والتجاويف) وليس
        hypertrophy (تضخم الكتلة). أخص من «تضخم» في السياق الطبي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَسُّع"

    - lemma: "اتِّساعٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن «اتساع» يُترجَم في المصطلح الحديث بـ extensification وExtension
        — بعيداً عن enlargement. واستخدامه الطبي القديم (اتساع الحدقة = Dilation) أخص من
        المفهوم المقصود ومنافس لـ «توسع» الموجودة أصلاً. لا يضيف قيمة دلالية مميزة.

    - lemma: "انتِفاخٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        الدليل المعجمي المباشر في معجم المصطلحات الطبية (entry_id=736695): «حالة من التضخم
        أو التوسع أو الانتفاخ» — وهذا تعريف الـ distention بالعربية. وهو مصطلح موثّق في
        عشرات المعاجم العلمية بمعاني swelling/turgescence/intumescence، وجذره نفخ عريق
        في اللغة وأصيل. يُضاف بوصفه نوعاً خاصاً من التضخم ينطوي على ضغط داخلي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphology_check:
        pattern: "انفِعال"
        root: "نفخ"
        note: "وزن انفعال للمطاوعة، يدل على حصول الانتفاخ في الشيء"
      borrowing_check:
        type: native_derivation
        verdict: "مشتق عربي أصيل من جذر نفخ"
      nuance_differentiation: >
        يُعبّر تحديداً عن التضخم الناجم عن ضغط داخلي (غاز أو سائل)؛ أكثر تخصصاً من
        «تضخم» ومن «توسع». يتضمن إيحاءً بالانتفاش والنفخ الداخلي. يُستخدم طبياً
        للتعبير عن distension/swelling/turgescence.
      actions:
        - command: create_entry
          params:
            lemma: "انتِفاخ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَفَخُّمٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «تفخم» محجوز في الاصطلاح العربي بمعنى التفخيم الصوتي في علم التجويد والفونولوجيا
        (مقابل الترقيق)؛ وهو مصطلح راسخ ومعتمد في اللسانيات العربية. استخدامه بمعنى
        «حالة الضخامة» سيُوقع في اشتراك لفظي مُضِلّ. لا يُقبل.

    - lemma: "انبِساطٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن «انبساط» مُعتمَد في مصطلح علم النفس بمعنى extraversion/extroversion،
        وفي الطب بمعنى diastole (ارتخاء عضلة القلب). كما أن أصله اللغوي (الانتشار والسرور)
        يبتعد عن دلالة الضخامة. لا صلة واضحة بمفهوم «حالة التضخم».


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "حالة التضخم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دائري: يستخدم لفظ «التضخم» لتعريف المجموعة التي تضم «تضخم» لمّةً فيها.
        كما أنه مُفتقر إلى الجنس القريب المُفيد والفصل النوعي. يجب صياغة تعريف غير دائري
        يُحدد الجنس (حالة) والفصل (الزيادة في الحجم عن المعتاد).
    authored:
      - type: terminological
        text: >
          حالةٌ يكون فيها حجمُ شيءٍ أو عضوٍ أكبرَ من حجمه الطبيعيّ أو المعتاد،
          نتيجةَ زيادةٍ في كتلته أو اتساعٍ في نطاقه
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          كونُ الشيء قد عَظُمَ وضَخُمَ حجمُه عمّا كان عليه أو عمّا هو معتاد له
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالةٌ يكون فيها حجمُ شيءٍ أو عضوٍ أكبرَ من حجمه الطبيعيّ أو المعتاد، نتيجةَ زيادةٍ في كتلته أو اتساعٍ في نطاقه"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "كونُ الشيء قد عَظُمَ وضَخُمَ حجمُه عمّا كان عليه أو عمّا هو معتاد له"

  examples:
    per_lemma:
      - lemma: "تَضَخُّم"
        examples:
          - text: "أثبتتِ الفحوصاتُ تَضَخُّمَ الغدةِ الدرقيةِ وتجاوُزَها الحجمَ الطبيعيَّ بأكثرَ من الضعف"
            type: usage
      - lemma: "تَوَسُّع"
        examples:
          - text: "كشفتِ الأشعةُ تَوَسُّعَ الأوعيةِ الدمويةِ الدقيقةِ في المنطقة المُصابة من الكبد"
