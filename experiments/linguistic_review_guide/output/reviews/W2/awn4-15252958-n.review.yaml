# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15252958-n
# half-hour / نصف ساعة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «نصف ساعة» مركب إضافي شفاف المعنى، وليست مصطلحاً مسكوكاً بالمعنى الدقيق، لكنها الوحدة المعجمية الطبيعية للمفهوم"
      - "اللمّة بدون تشكيل — يلزم إضافة التشكيل الكامل"
    observations: "المفهوم بسيط ومتداول جداً في الحياة اليومية: نصف الساعة الزمنية أي ثلاثون دقيقة. المركب الإضافي «نصف ساعة» هو التعبير الطبيعي والوحيد المتداول في الفصحى والعامية على السواء. لا يُتوقع وجود مفردة بسيطة تؤدي هذا المعنى لأنه مفهوم كسري يُعبَّر عنه تركيبياً في العربية."
  blind_candidates:
    - lemma: "نِصْفُ سَاعَة"
      generation_method: tarkib
      justification: "مركب إضافي من «نِصْف» (أحد جزأَي الكمال) و«سَاعَة» (وحدة الزمن المعروفة)، وهو التعبير الطبيعي الأول الذي يتبادر إلى الذهن من التعريف"
    - lemma: "شَطْرُ سَاعَة"
      generation_method: tarkib
      justification: "مركب إضافي من «شَطْر» وهو مرادف تراثي لـ«نِصْف» ثابت في المعاجم الكلاسيكية، قال ابن فارس: الشين والطاء والراء يدل أحدهما على نصف الشيء"
    - lemma: "ثَلَاثُونَ دَقِيقَة"
      generation_method: tarkib
      justification: "مركب عددي وصفي يعبّر عن المفهوم بصيغة مباشرة عبر تحديد عدد الدقائق المكوِّنة لنصف الساعة"
    - lemma: "نَصِيفُ سَاعَة"
      generation_method: tarkib
      justification: "مركب إضافي من «نَصِيف» وهو لفظ فصيح بمعنى النصف ورد في الحديث الشريف «ولا نصيفه»، على وزن فَعِيل كثُمْن وثَمِين"

stage2_evidence:
  per_lemma:
    - lemma: "نِصْفُ سَاعَة"
      confirm:
        - text: "«(1) نصف ساعة: ثلاثون دقيقة (2) منتصَف السّاعة.»"
          source: "المورد الحديث (2008)"
        - text: "«(1) «أ» نصف. «ب» نصف ساعة half past seven (2) «أ» شطر»"
          source: "المورد الحديث (2008) — مدخل half"
      expands:
        - text: "«النِّصْفُ والنُّصْفُ والنَّصِيفُ والنَّصَفُ... أَحَدُ جُزْأَيِ الكَمالِ»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "تعدد صيغ لفظة النصف في العربية: نِصْف ونُصْف ونَصِيف"
        - text: "«الساعة: جزء من أجزاء الزمان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف الساعة بوصفها جزءاً من الزمان"
        - text: "«السّاعة: عند المنجّمين وأهل الهيئة هي ثلث ثمن اليوم والليلة، يعني جزء من أربعة وعشرين جزءاً من مجموع اليوم والليل... وكلّ ساعة عبارة عن ستين دقيقة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تحديد الساعة بستين دقيقة يجعل نصفها ثلاثين دقيقة بالضبط"
    - lemma: "شَطْرُ سَاعَة"
      confirm:
        - text: "«شَطْرُ كلِّ شيءٍ: نصفُه، وشطرته: جعلته نصفين»"
          source: "كتاب العين للخليل بن أحمد"
        - text: "«أخذ شطره، وشطرت الشيء: جعلته شطرين»"
          source: "أساس البلاغة للزمخشري"
        - text: "«(شَطَرَ) الشِّينُ وَالطَّاءُ وَالرَّاءُ أَصْلَانِ، يَدُلُّ أَحَدُهُمَا عَلَى نِصْفِ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«شَطْرُ» لم يرد مركباً مع «ساعة» في أي مصدر معجمي"
          source: "استقراء المعاجم"
          conflict: "المركب «شطر ساعة» غير مسكوك معجمياً ولا متداول في الاستعمال الحديث"
    - lemma: "ثَلَاثُونَ دَقِيقَة"
      expands:
        - text: "«وكلّ ساعة عبارة عن ستين دقيقة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يثبت أن ثلاثين دقيقة تعادل نصف الساعة"
      contradicts:
        - text: "التعبير «ثلاثون دقيقة» عبارة وصفية حرة وليس وحدة معجمية ثابتة"
          source: "تحليل لغوي"
          conflict: "يمكن إبدال العدد بأي عدد آخر (عشرون دقيقة، أربعون دقيقة) فليس مصطلحاً"
    - lemma: "نَصِيفُ سَاعَة"
      confirm:
        - text: "«والنَّصِيفُ: نِصْفُ الشيء»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«فَالْأَوَّلُ نِصْفُ الشَّيْءِ وَنَصِيفُهُ: شَطْرُهُ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«النَصِيف» بمعنى النصف مهجور في الاستعمال المعاصر ومقصور على السياقات الحديثية والتراثية"
          source: "استقراء الاستعمال"
          conflict: "اللفظة حيّة في التراث لكنها ميتة في الاستعمال الحديث للقياس الزمني"

stage3_analysis:
  per_lemma:
    - lemma: "نِصْفُ سَاعَة"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت مسجّل في المورد الحديث بهذه الصيغة تحديداً كمقابل لـ half hour، وهو التعبير الوحيد المتداول في الفصحى المعاصرة لهذا المفهوم"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِصْفُ سَاعَة"
    - lemma: "شَطْرُ سَاعَة"
      source: stage1
      decision: removed
      decision_reason: "رغم أن «شَطْر» مرادف تراثي صحيح لـ«نِصْف»، إلا أن المركب «شطر ساعة» غير مسكوك في أي معجم ولا متداول في الاستعمال الحديث أو القديم. لا يجتاز اختبار التثبيت المعجمي"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
    - lemma: "ثَلَاثُونَ دَقِيقَة"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست وحدة معجمية ثابتة — يمكن إبدال العدد بأي رقم آخر فلا يفقد التعبير صلاحيته الوصفية، ما يعني أنه ليس مصطلحاً. لا يجتاز اختبار السكّ"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "نَصِيفُ سَاعَة"
      source: stage1
      decision: removed
      decision_reason: "لفظة «نَصِيف» بمعنى النصف صحيحة لغوياً ومؤيدة بالحديث النبوي والمعاجم الكلاسيكية، لكنها مهجورة تماماً في الاستعمال المعاصر للقياس الزمني. المركب «نصيف ساعة» لم يُسجَّل في أي مصدر ولا يمكن أن يُفهم بيسر في السياقات الحديثة"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

