stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (منوال، نمط) مكتوبتان بلا تشكيل — يجب تشكيلهما كاملاً"
      - "اللمّة 'نمط' تظهر كذلك في مجموعة الإشراف المباشرة (awn4-07080699-n) كجزء من المركب 'نمط تعبيري'، مما قد يوحي بدائرية هرمية"
      - "التعريف الحالي 'أسلوب أو طريقة مميزة' يستخدم 'أسلوب' وهو لمّة في مجموعة الإشراف — دائرية جزئية"
      - "المجموعة تفتقر إلى لمّة تُبرز جانب الطابع الخاص المُمَيِّز (distinctive hallmark) كـ'طابع'"
    observations: >
      المجموعة تُعبّر عن مفهوم الطريقة أو الأسلوب المميز الذي يُعرف به شخص أو جماعة أو عصر في تعبيرهم
      أو سلوكهم. اللمّتان الحاليتان (منوال ونمط) تحملان هذا المعنى في التراث المعجمي، غير أنهما
      تشتركان في مجال دلالي واسع يشمل: النوع والطراز والصنف، فضلاً عن الأسلوب والطريقة. المفهوم
      الإنجليزي 'vein' (بمعنى نمط مميز كـ"in a comic vein") يُحيل إلى البصمة والطابع الخاص،
      وهو ما يُتقنه 'طابع' بدقة أكبر.

  blind_candidates:
    - lemma: "طَابَع"
      generation_method: majaz
      justification: >
        مستعار من فعل "طَبَع" (ختم/بصم) — الطابع هو الأثر الدال المميِّز الذي يُبقيه الختم.
        يُقال: "له طابَعٌ يجري عليه" أي خاصية مميزة راسخة. المجاز واضح وشائع في العربية المعاصرة
        للتعبير عن الأسلوب الخاص المميز لفنان أو مجتمع أو عصر.
    - lemma: "وَتِيرَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من "وَتَر" على وزن فَعِيلة، يدل على الطريقة المُطَّردة والمتواصلة. يُقال:
        "ما زال على وتيرة واحدة" أي على نهج منتظم واحد. يُمكن أن يُعبّر عن أسلوب المرء
        المتسق المميز.
    - lemma: "مَسْلَك"
      generation_method: ishtiqaq
      justification: >
        مشتق من "سَلَك" على وزن مَفْعَل، يدل على الطريقة والمنهج. يُقال مجازاً: "خُذْ في
        مسالك الحق". يُعبّر عن المنهج الذي يسلكه المرء في سلوكه وتعبيره.
    - lemma: "مَذْهَب"
      generation_method: majaz
      justification: >
        مشتق من "ذَهَب" بمعنى الاتجاه والمسلك المعتقَد — "مذهب فلان": طريقته واعتقاده.
        يُستخدم في الأدب والفن للإشارة إلى الأسلوب المدرسي المميز (المذهب الكلاسيكي،
        المذهب الرومانسي).


