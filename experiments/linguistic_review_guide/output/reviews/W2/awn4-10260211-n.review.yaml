step05_lemma_generation:
  evidence_candidates:
    - lemma: "مَخْبُول"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) شخص غريب الاطوار (2) شخص مخبول وخطر.» — المورد الحديث (2008)"
      justification: "وردت في المورد الحديث كترجمة لمفهوم مشابه (weirdo) وتتقاطع مع التعريف في الدلالة على الجنون الخفيف أو الغرابة."
    - lemma: "أَحْمَق"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) الاحمق (2) الغريب الاطوار (3) المجنون.» — المورد الحديث (2008)"
      justification: "وردت كترجمة لمصطلح (kook) في المورد الحديث، وتعبر عن التصرفات غير العقلانية التي تميز الشخص عن المجموعة."
  knowledge_candidates:
    - lemma: "شَاذّ"
      justification: "اشتقاق: اسم فاعل من الفعل (شذّ) أي انفرد وخرج عن القاعدة، ويستعمل في علم النفس والاجتماع لوصف من ينحرف سلوكه عن النمط السوي (شاذ السلوك أو شاذ الطباع)."

step1_lemma_validation:
  per_lemma:
    - lemma: "غَرِيب الْأَطْوَار"
      decision: confirmed
      decision_reason: "مصطلح مركّب وصفي/إضافي شائع ومستقر في الاستعمال العربي للتعبير عن الشخص الذي يتصرف بطريقة غير مألوفة، ويقابله في الإنجليزية (eccentric)."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الغرابة في السلوك والتصرفات والتقلب دون الوصول إلى حد الجنون المطبق."
      example: "تجنبه الناس لأنه غريب الأطوار ولا يتوقعون ردود أفعاله."
    - lemma: "مَخْبُول"
      source: step05
      decision: confirmed
      decision_reason: "كلمة فصيحة تناسب جزءاً من التعريف (مجنوناً) وتستعمل للدلالة على من به خلل في عقله أو تصرفاته بطريقة لافتة وغريبة."
      step05_citation: "«(1) شخص غريب الاطوار (2) شخص مخبول وخطر.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تحمل دلالة أقوى من غريب الأطوار وتوحي بخلل عقلي أو مسّ من الجنون."
      example: "تصرف في الحفل وكأنه مخبول يثير سخرية الحاضرين."
      actions:
        - command: create_entry
          params:
            lemma: "مَخْبُول"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10260211-n"
    - lemma: "أَحْمَق"
      source: step05
      decision: removed
      decision_reason: "الأحمق هو قليل العقل أو من يسيء التقدير، ولا يتطابق بالضرورة مع (غريب الأطوار) الذي قد يكون شديد الذكاء ولكنه غريب السلوك."
      step05_citation: "«(1) الاحمق (2) الغريب الاطوار (3) المجنون.» — المورد الحديث (2008)"
    - lemma: "شَاذّ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على من خالف الجماعة في سلوكه، ويطابق الجزء الثاني من التعريف (يبرز عن المجموعة)، ويدعمه المعجم الكبير: (ما ينحرف عن النمط السوي)."
      step05_citation: "«من الناس: خلاف السوي المنفرد المتقطع النظير» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أعم من غريب الأطوار؛ فهي تدل على أي خروج عن المألوف أو السوي، سواء في السلوك أو الطباع، وتستخدم غالباً في السياق الاجتماعي والنفسي."
      example: "يُعدّ سلوكه شاذّاً عن عادات مجتمعه وتقاليده."
      actions:
        - command: create_entry
          params:
            lemma: "شَاذّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10260211-n"
  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "مَخْبُول"
      reason: "مصدر: الخطوة ٠٫٥"
