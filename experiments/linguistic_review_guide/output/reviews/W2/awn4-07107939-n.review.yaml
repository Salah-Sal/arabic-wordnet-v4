# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «شعر» تدل على الشعر الموزون المقفّى بمعناه الفنّي الصارم، وهو مفهوم مغاير للمجموعة التي تعني «أي تواصل يشبه الشعر في جمالياته وتأثيره العاطفي» — أي الطابع الشعري لا الشعر ذاته"
      - "التعريف العربي الحالي يستخدم «الشعر» مرجِعاً داخلياً مما يُوهِم بالدَّوَران؛ يُفضَّل توصيف المفهوم باستقلالية دون الاستناد إلى الكلمة المُعرَّفة"
      - "لمّة «شاعرية» مفقودة تشكيلها الكامل في السجلّ"
    observations: >
      المجموعة تُعبِّر عن المفهوم الإنجليزي poetry بمعناه الثاني (غير الأوّلي)، أي الجودة الجمالية
      والوقع العاطفي الشعري في أيّ خطاب، لا الفنّ الشعري الموزون تحديداً. يُعرِّفها المعجم الإنجليزي
      بـ «any communication resembling poetry in beauty or the evocation of feeling».
      وهذا يختلف جوهرياً عن «الشعر» بمعناه المعجمي المتداول (كلام موزون مقفّى).
      أمّا «الشاعرية» فمصطلح نقدي راسخ في المعجم الكبير يعني «عوامل التأثير على الشعور في عمل
      فني أو أدبي» وهو الأقرب إلى دلالة المجموعة.

