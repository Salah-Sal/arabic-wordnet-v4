      generation_method: ishtiqaq
      justification: "مصدر صناعي من «شِعْر» على وزن فِعْلِيَّة، يُفيد الخاصية الشعرية أو الطابع الشعري في التعبير، مستخدَم في النقد الأدبي الحديث"
    - lemma: "إِيقاعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «إيقاع» على وزن فِعَالِيَّة، يُحيل على الطابع الإيقاعي المؤثِّر في التعبير الشعري، إذ يُعدُّ الإيقاع جوهر التجربة الشعرية"
    - lemma: "وَجْدَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «وَجْد» على وزن فَعَلَانِيَّة، يُفيد القدرة على إثارة الوجد والمشاعر كما يفعل الشعر، وهو ما يعنيه التعريف بـ«evocation of feeling»"
    - lemma: "بَيانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «بيان» يُحيل على الجمال البياني في التعبير الذي يشبه الشعر في بلاغته وتأثيره"


