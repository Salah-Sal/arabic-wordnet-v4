# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "شاعرية"
      decision: confirmed
      decision_reason: >
        وثّقها المعجم الكبير (OCR، المرجع الأعلى جودةً) بتعريف صريح: «مَلَكَةُ الشِّعرِ — عواملُ التأثير
        على الشُّعورِ فى عمل فنىٍّ أو أدبىٍّ إذا كانَ يصطنعُ لغةَ الشعرِ الفنيةَ ووسائلَهُ فى
        الإقناعِ». يتطابق هذا التعريف مع دلالة المجموعة (الطابع الشعري الجمالي والعاطفي في أي
        تعبير). اللمّة فصيحة مشتقة اشتقاقاً سليماً من جذر شعر. تُعبِّر عن المفهوم المقصود بدقة
        وإيجاز دون غموض. تحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
        borrowing_type: native
        calque: false
      quality_gate:
        ittiraad: true
        yusr_tadawul: true
        mulaama: true
        ithaar_turathi: true
        ithaar_arabi: true
        ishtiqaqiyya: true
      morphological_fit: "مصدر صناعي على وزن فَاعِلِيَّة (من شاعِر)، وزن ملائم لإفادة الخاصية والملَكَة"
      nuance_differentiation: "«الشاعرية» هي اللمّة الوحيدة المُثبَتة في هذه المجموعة، وتُعبِّر عن الطابع الشعري والجمالي الكامن في أي خطاب أو تعبير بغضّ النظر عن وزنه أو قافيته"
      actions:
        - command: update_lemma
          params:
            entry_id: "51890"
            new_lemma: "شَاعِرِيَّة"

    - lemma: "شعر"
      decision: removed
      decision_reason: >
        «الشعر» في جميع المعاجم الكلاسيكية والحديثة يُعرَّف حصراً بـ«كلام موزون مقفّى قصداً»،
        وهو فنٌّ قائم بذاته يختلف عن دلالة هذه المجموعة التي تعني «أي تواصل يشبه الشعر في
        الجمال أو إثارة المشاعر» — أي الطابع الشعري الوجداني في أي خطاب. ضمُّ «شعر» إلى هذه
        المجموعة يخلط بين الشعر بوصفه فناً موزوناً وبين الشاعرية بوصفها خاصية وجمالية. اللمّة
        الصحيحة لهذا المفهوم هي «شاعرية» لا «شعر». المعنى المناسب لـ«شعر» ينتمي إلى المجموعة
        الترادفية لـ «الشعر الموزون» (formal/metrical poetry) لا هذه المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "شِعْرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «شعرية» في المعاجم العربية تحمل ثلاثة معانٍ مستقرّة كلها بعيدة عن دلالة المجموعة:
        (أ) نوع من المعكرونة (المعجم الوسيط والكبير)، (ب) الخاصية الشعرية الفيزيائية — capillarity —
        في المصطلحات العلمية، (ج) «الشعرية» بمعنى poetics أي علم نظرية الأدب (معجم اللسانيات).
        المعنى الثالث أقرب إلا أنه يُشير إلى الدراسة العلمية للشعر لا إلى جودة التعبير الشعري.
        الاشتراك اللفظي الواسع يُفضي إلى خلط معجمي خطير.

    - lemma: "إِيقاعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد مادة معجمية لهذا المصطلح بمعنى «الطابع الشعري التأثيري»، وإن وُجدت في سياقات
        تقنية (علم الصحة، مصطلحات النفط) بمعنى «إيقاعي» صفةً لأحداث فيزيائية. تجتاز اختبار
        الاشتقاق ولكن لم تثبت كوحدة معجمية مستقلة تُعبِّر عن دلالة المجموعة.

    - lemma: "وَجْدَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد مادة معجمية للمصطلح بمعنى «تعبير شعري مُثير للمشاعر». وإن كان «الوجدان» مفردةً
        عربية أصيلة، إلا أن «وجدانية» بمعناها المصطلحي تُشير إلى المذهب العاطفي في الفن
        والأدب وليس إلى التعبير الشعري الجميل تحديداً.

    - lemma: "بَيانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «البيانية» اسمٌ علَم راسخ في المعاجم الكلاسيكية والحديثة يُشير إلى طائفة دينية من غلاة
        الشيعة، ولا تربطه أيّ دلالة بالجمال التعبيري أو الطابع الشعري. استخدامه لمّةً في هذه
        المجموعة سيُفضي إلى خلط ديني-ثقافي خطير.


