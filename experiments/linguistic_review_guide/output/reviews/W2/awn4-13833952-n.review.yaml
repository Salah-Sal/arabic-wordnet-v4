# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────

stage1_review:

  # أ. المرشحات العمياء — توليد بدون الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "تَآلُف"
      generation_method: ishtiqaq
      justification: >
        من جذر (أ ل ف) على وزن تَفَاعُل، يدلّ على التقارب المتبادل وانضمام
        الشيء إلى الشيء، ويعبّر عن الرابطة الوجدانية التي تنشأ بين الناس
        نتيجة الاتفاق والتفاهم المشترك.

    - lemma: "انْسِجَام"
      generation_method: ishtiqaq
      justification: >
        من جذر (س ج م) على وزن انفعال، يعني الانصباب السلس والتوافق الطبيعي؛
        يُعبّر عن الانسيابية في العلاقة وغياب التنافر، وهو ما يلتقي به مفهوم
        التفاهم المتبادل وانسجام الطبائع.

    - lemma: "تَجَاوُب"
      generation_method: ishtiqaq
      justification: >
        من جذر (ج و ب) على وزن تَفَاعُل، يعني مجاوبة كلٍّ منهما الآخر؛
        يُجسّد الجانب التفاعلي والتبادلي للعلاقة حيث يلقى كل طرف صدىً
        وتجاوباً لدى الآخر، مما يعكس الانسجام الوجداني.

    - lemma: "تَوَادٌّ"
      generation_method: ishtiqaq
      justification: >
        من جذر (و د د) على وزن تَفَاعُل، يعني تبادل المودة والمحبة؛ يُركّز
        على الأساس العاطفي الدافئ في العلاقة، وهو ما يُشكّل البنية الوجدانية
        لمفهوم التفاهم والثقة المتبادلة بين الناس.

  # ب. التقييم الأولي — بعد الاطلاع على اللمّات الموجودة
  assessment:
    concerns:
      - >
        تَنَاغُم: اللفظ في أصله القديم مقيّد بالدلالة الصوتية/الموسيقية
        (جَرْس الكلام وحُسْن الصوت)، وتوسيعه إلى التفاهم الاجتماعي توسيعٌ
        حديث اضطراري لم تُقرّه المعاجم الكلاسيكية ابتداءً — صنّفه «معجم الصواب
        اللغوي» أصلاً في خانة «مرفوض» ثم وثّق قبوله المجمعي كاستثناء. ترجمات
        ARABTERM تُثبّته دائماً في الحقل الصوتي/الفيزيائي (consonance,
        harmony, modulation, assonance). بينما المورد الحديث يستخدم الصفةَ
        «مُتناغِم» لـ"en rapport"، وليس الاسمَ «تناغم» كمرادف لـ"rapport".
      - >
        غياب لفظ «وِفَاق» من المجموعة مع أنه كلاسيكي وثيق الصلة، لكنه قد
        يكون مُدرَجاً في مجموعة ترادفية أخرى.
    observations: >
      يتكوّن المجموعة من لمّتين: الأولى (وِئَام) تُلصق بالمفهوم بشكل مباشر
      واضح — جذرها (وأم) أثبت ابن فارس في المقاييس أنه يدلّ على المُوافَقَة
      والمُقَارَبَة، والمثلُ الموروث «لولا الوئام هلك الأنام» يُرسّخها في
      الوجدان العربي مُرادِفةً للتسالم والاتفاق بين الناس. أمّا الثانية
      (تَنَاغُم) فجذرها (نغم) في المقاييس لا يتجاوز «جَرْس الكلام وحُسْن
      الصوت»، ومعاجم التخصص تُترجمها إلى consonance/harmony في الحقل الصوتي؛
      إدراجها في هذا السياق الاجتماعي يُشوّش الدلالة. التعريف العربي الحالي
      صحيح من حيث المضمون لكنه يفتقر إلى أسلوب التأليف المعجمي الرصين.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────

stage2_evidence:

  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "تَنَاغُم"
      confirm:
        - text: >
            «تَنَاغَمت الأصوات [صحيحة] — التعليق: تذكر المعاجم القديمة أن
            النغمة جَرْس الكلمة، وحُسْن الصوت في القراءة وغيرها، والكلام
            الخفيّ الحسن. وقد أَقَرَّ مجمع اللغة المصري تصحيح استعمال الفعل
            «تناغم» بناءً على ما قرره من جواز تكملة فروع مادة لغوية لم
            تُذْكر بقيتها، ومن جواز استعمال اللفظ على غير استعمال العرب له
            ما دام جاريًا على أقيسة العرب من مجازٍ واشتقاق.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«مُنسجِم؛ مُتناغِم؛ مُتَّفِقٌ مع.» [ترجمة «en rapport»]"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: >
            «(نَغَمَ) النُّونُ وَالْغَيْنُ وَالْمِيمُ لَيْسَ إِلَّا
            النَّغْمَةُ: جَرْسُ الْكَلَامِ وَحُسْنُ الصَّوْتِ بِالْقِرَاءَةِ
            وَغَيْرِهَا. وَهُوَ النَّغْمُ. وَتَنَغَّمَ الْإِنْسَانُ
            بِالْغِنَاءِ وَنَحْوِهِ.»
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            الجذر (نغم) في المقاييس مقصور على الدلالة الصوتية (جَرْس الكلام
            وحُسْن الصوت بالغناء)، ولا أصل فيه لمعنى التفاهم الاجتماعي أو
            الثقة المتبادلة بين الناس.
        - text: >
            «تَنَاغَمَ — الجذر: ن غ م — مثال: تَنَاغَمت الأصواتُ — الرأي:
            مرفوضة — السبب: لأنه لم يرد في المعاجم.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: >
            المعجم ذاته يوثّق أن الاستخدام كان مرفوضاً في البداية لغياب
            الشاهد الكلاسيكي، وإن أُقرّ لاحقاً استثنائياً.
      expands:
        - text: >
            «تناغُم — [ترجمة إنجليزية:] consonance — [المجال:] Physics»
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: >
            التوظيف التقني لتناغم يُثبّت دلالته في حقل الفيزياء الصوتية
            (consonance = تآلف الأصوات في الترددات)، وليس في الحقل الاجتماعي.
        - text: >
            «انسجام الأصوات في تلاحُقِ كلماتها، وتوافُق حروفها، وهو ضد
            التنافر، ومنه جاء الحديث عن النغم كلحظة انفعالية.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: >
            اللسانيات تُعرّف التناغم بالانسجام الصوتي ضد التنافر، وتربطه
            بـ«النغم كلحظة انفعالية» — أي إنه يبقى في الدائرة الصوتية حتى
            حين يُستعمل مجازاً.

    # ── اللمّة الموجودة ٢ ──
    - lemma: "وِئَام"
      confirm:
        - text: >
            «(وَأَمَ) الْوَاوُ وَالْهَمْزَةُ وَالْمِيمُ. كَلِمَةٌ تَدُلُّ
            عَلَى مُوَافَقَةٍ وَمُقَارَبَةٍ. يَقُولُونَ: الْوِئَامُ:
            الْمُوَافَقَةُ; وَوَاءَمْتُهُ. وَمَثَلُهُمْ: لَوْلَا الْوِئَامُ
            هَلَكَ الْأَنَامُ»
          source: "مقاييس اللغة لابن فارس"
        - text: "«وئام — من (و أ م) الإنسجام والوفاق.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«صِلة؛ علاقة. وبخاصة: وِئام؛ أُلفة.» [ترجمة «rapport»]"
          source: "المورد الحديث (2008)"

    # ── مرشح المرحلة ١ ──
    - lemma: "تَآلُف"
      source: stage1
      expands:
        - text: >
            «(أَلَفَ) الْهَمْزَةُ وَاللَّامُ وَالْفَاءُ أَصْلٌ وَاحِدٌ،
            يَدُلُّ عَلَى انْضِمَامِ الشَّيْءِ إِلَى الشَّيْءِ، وَالْأَشْيَاءُ
            الْكَثِيرَةُ أَيْضًا. [...] وَالْأُلْفَةُ مَصْدَرُ الِائْتِلَافِ.
            وَإِلْفُكَ وَأَلِيفُكَ: الَّذِي تَأْلَفُهُ. وَكُلُّ شَيْءٍ ضَمَمْتَ
            بَعْضَهُ إِلَى بَعْضٍ فَقَدْ أَلَّفْتَهُ تَأْلِيفًا.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر (ألف) صالح دلالياً لمعنى الانضمام والاتحاد، غير أن المادة
            المُستعملة في المعاجم الحديثة هي «تَأَلَّف» فعلاً، لا «تَآلُف»
            اسماً بالمعنى المطلوب.
        - text: >
            «(تألف) مُطَاوع أَلفه وائتلف وَفُلَانًا استماله»
          source: "المعجم الوسيط"
          addition: >
            الوسيط يُثبّت «تألف» فعلاً بمعنى استمال واستأنس — وهو قريب من
            التفاهم المتبادل، لكنه يغلب عليه معنى الاستمالة الأحادية لا
            التفاهم الثنائي المتكافئ.
      contradicts:
        - text: >
            «تآلُف — [ترجمة إنجليزية:] chord — [المجال:] Physics»
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: >
            في التخصصات التقنية يُوظَّف تآلف لمعنى «chord» (وتر موسيقي)
            أو «agglomerating» (تكتل مادي)، مما يُعرّضه لاشتراك لفظي.

    # ── مرشح المرحلة ١ ──
    - lemma: "انْسِجَام"
      source: stage1
      expands:
        - text: >
            «حصول توافق بين أعضاء مجموعة معينة يجعل التواصل بينهم ناجحا.»
            [ترجمة: harmony]
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: >
            هذا التعريف يقترب من المعنى المطلوب (توافق يُيسّر التواصل)، لكن
            المصطلح الموظَّف هو «harmony» وليس «rapport» تحديداً.
        - text: >
            «الانسجام: [في الإنكليزية] Flow، harmony — بالجيم لغة جريان
            الماء. وعند البلغاء هو أن يكون الكلام لخلوه من العقادة منحدراً
            كتحدّر الماء المنسجم.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: >
            التهانوي يُرجع انسجام إلى جريان الماء ويستخدمه مصطلحاً بلاغياً
            لسلاسة الكلام — وهو تخصيص معجمي بعيد عن الدلالة الاجتماعية
            للتفاهم المتبادل.
      contradicts:
        - text: >
            «سلوك متكيف مع القواعد والأعراف والمواضعات السائدة في المجتمع.»
            [ترجمة: conformity]
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: >
            ARABTERM يُترجم انسجام بـ conformity (الامتثال للأعراف)، وهو
            مفهوم يختلف جوهرياً عن rapport (العلاقة الثنائية القائمة على
            الثقة والتفاهم).

    # ── مرشح المرحلة ١ ──
    - lemma: "تَجَاوُب"
      source: stage1
      expands:
        - text: >
            «(جَوَبَ) — وَأَصْلٌ آخَرُ، وَهُوَ مُرَاجَعَةُ الْكَلَامِ،
            يُقَالُ كَلَّمَهُ فَأَجَابَهُ جَوَابًا، وَقَدْ تَجَاوَبَا
            مُجَاوَبَةً.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            المقاييس يُثبّت تجاوب لمراجعة الكلام، أي التبادل الكلامي —
            وهو جانب من جوانب rapport ولكن ليس مرادفاً كاملاً له.
        - text: >
            «تَجَاوَبَ — القوم: جاوب بعضهم بعضاً»
          source: "المعجم الوسيط"
          addition: >
            الوسيط يقصره على التبادل الكلامي المتبادل دون الإشارة إلى بُعد
            الثقة أو التفاهم الوجداني الذي هو جوهر مفهوم المجموعة.
      contradicts:
        - text: >
            «تجاوب — القوم: تحاوروا، جاوب بعضُهم بعضًا. استُعيرَ للطير
            والإبل والخيل.»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المعجم الكبير يُثبّت استخدامه للطير والإبل في معنى التصويت
            المتبادل، مما يُعضّد كون الدلالة الأصيلة صوتية لا وجدانية
            اجتماعية.

    # ── مرشح المرحلة ١ ──
    - lemma: "تَوَادٌّ"
      source: stage1
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────

stage3_analysis:

  per_lemma:

    # ── تَنَاغُم (موجود) ──
    - lemma: "تَنَاغُم"
      decision: removed
      decision_reason: >
        أصل الجذر (نغم) في مقاييس اللغة مقصور على «جَرْس الكلام وحُسْن
        الصوت»، ولا يمتد إلى التفاهم الاجتماعي أو الثقة المتبادلة. معاجم
        التخصص الحديثة (الفيزياء، اللسانيات، الفنون) تُثبّته في الحقل
        الصوتي (consonance / harmony / modulation / assonance). معجم الصواب
        وثّق أنه كان «مرفوضاً» قبل أن يُقرّه مجمع اللغة المصري استثنائياً
        للمعنى المجازي «تلاءمت وتجانست» — وهو قبول مجازي وليس إثباتاً
        معجمياً أصيلاً. المورد الحديث يستخدم الصفة «مُتناغِم» لـ"en
        rapport" لا الاسم «تناغم» كمرادف لـ"rapport". وِئَام أدق وأصحّ
        وأعمق توثيقاً لهذا المعنى ولا حاجة إلى إثقال المجموعة بلمّة ذات
        دلالة مائعة في هذا السياق.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── وِئَام (موجود) ──
    - lemma: "وِئَام"
      decision: confirmed
      decision_reason: >
        الجذر (وأم) في مقاييس اللغة يدلّ صراحةً على المُوَافَقَة
        والمُقَارَبَة، والمثل «لولا الوئام هلك الأنام» يُرسّخه في الوجدان
        العربي. موسوعة السلطان قابوس تُعرّفه بـ«الانسجام والوفاق». المورد
        الحديث يُترجم «rapport» بـ«وِئَام؛ أُلفة» صراحةً. التشكيل موجود
        وصحيح. اللفظ فصيح كلاسيكي مُتداوَل، يتّسع لمعنى التفاهم والثقة
        والتسالم المتبادل بدقة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        وِئَام يُركّز على أصل المُوَافَقَة الإرادية والتسالم الطوعي بين
        الطرفين — وهو أعمق من مجرد الانسجام الصوتي أو التشابه الخارجي؛
        يجمع بين الاتفاق الفكري والثقة الوجدانية معاً، وهو اللفظ الوحيد
        المؤكد في المجموعة بعد إزالة تناغم.

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَآلُف"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر (ألف) قابل للتوظيف الدلالي لكن «تَآلُف» غلب في التداول
        المعجمي الحديث على وزن الفعل (تَأَلَّف) وليس الاسم. ARABTERM يُوظّفه
        لـchord (فيزياء) وagglomerating (زراعة)، مما يُعرّضه لاشتراك لفظي.
        والاسم المقصود (الأُلفة والتقارب) موجود بالفعل في المجموعة الأب
        (awn4-13833622-n) بلمّة «أُلْفَة»، فلا داعي لتكراره هنا.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "انْسِجَام"
      source: stage1
      decision: removed
      decision_reason: >
        انسجام يعني أساساً conformity (الامتثال/التوافق مع المعايير) أو
        flow/harmony في البلاغة — وهو مفهوم أعمّ وأشمل من rapport الذي
        ينصبّ على علاقة شخصية ثنائية قائمة على الثقة والتفاهم. التهانوي
        يُرجعه إلى «جريان الماء» وسلاسة الكلام — وهو تأصيل بعيد عن دلالة
        المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَجَاوُب"
      source: stage1
      decision: removed
      decision_reason: >
        تجاوب مُقيَّد في المعاجم بالتبادل الكلامي (مجاوبة بعضهم بعضاً)،
        وقد استُعير للطير والإبل في معنى التصويت المتبادل. يفتقر إلى بُعد
        الثقة والتفاهم الوجداني الذي هو جوهر مفهوم المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَوَادٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شاهد معجمي في قاعدة البيانات. الجذر (ودد) صالح دلالياً
        لكن توادّ يميل إلى التعبير عن المودة العاطفية الشخصية لا عن علاقة
        التفاهم والاتفاق التي هي محور المجموعة.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────

stage4_content:

  definition:
