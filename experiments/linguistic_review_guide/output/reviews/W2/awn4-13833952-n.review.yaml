    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي، وفيه إشكال
        تركيبي: «أو» تُوهم أن التفاهم المتبادل بديلٌ للثقة، وهو ليس كذلك
        — فالثقة والتفاهم عنصران مكوّنان معاً لا متبادلان. يفتقر إلى الجنس
        القريب الصريح ويخلو من أسلوب التأليف المعجمي الرصين.
    authored:
      - type: terminological
        text: >
