    - lemma: "شُحّ"
      entry_id: "{auto}"
      root: "شحح"
      maqayis_quote: "«الشِّينُ وَالْحَاءُ، الْأَصْلُ فِيهِ الْمَنْعُ، ثُمَّ يَكُونُ مَنْعًا مَعَ حِرْصٍ. مِنْ ذَلِكَ الشُّحُّ، وَهُوَ الْبُخْلُ مَعَ حِرْصٍ.»"
    - lemma: "إِمْسَاك"
      entry_id: "{auto}"
      root: "مسك"
      maqayis_quote: "«الْمِيمُ وَالسِّينُ وَالْكَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى حَبْسِ الشَّيْءِ أَوْ تَحَبُّسِهِ. وَالْبَخِيلُ مُمْسِكٌ. وَالْإِمْسَاكُ: الْبُخْلُ»"
    - lemma: "ضَنّ"
      entry_id: "{auto}"
      root: "ضنن"
      maqayis_quote: "«الضَّادُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى بُخْلٍ بِالشَّيْءِ. يُقَالُ: ضَنِنْتُ بِالشَّيْءِ أَضَنُّ بِهِ ضَنًّا وَضَنَانَةً.»"
