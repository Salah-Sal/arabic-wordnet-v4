      sense_id: "{auto}"
      nuance: "تعبير مركب يزيل اللبس ويخصص الحالة بالمجال السني."
      mwe: true
    - lemma: "عَضَّة"
      sense_id: "{auto}"
      nuance: "تعبير سريري يركز على نتيجة الإطباق أو طبعته."
      mwe: false
  synset:
    cultural_fit: native
  actions:
