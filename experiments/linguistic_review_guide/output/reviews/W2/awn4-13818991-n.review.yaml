# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو فقر في التمثيل المعجمي لمفهوم مركزي في علم اللسانيات."
      - "التعريف الحالي (علاقة لغوية يؤسسها النحو) ضعيف؛ فعل «يؤسسها» لا يُحدِّد طبيعة العلاقة ولا مجالها."
      - "اللمّة الموجودة (عَلَاقَة نَحْوِيَّة) مركب وصفي ويُحتمل وجود مرادفات تقنية مستخدمة في أدبيات النحو والألسنية العربية."
    observations: >
      المجموعة تمثّل مفهوم «grammatical relation» في الألسنية الحديثة، وهو مفهوم يشمل العلاقات
      الوظيفية في التركيب النحوي كالفاعلية والمفعولية والإضافة. اللمّة الموجودة «عَلَاقَة نَحْوِيَّة»
      مركب وصفي (موصوف + صفة) فصيح ومعجمي راسخ في أدبيات اللسانيات العربية الحديثة. الجذر «علق»
      يحمل دلالة الارتباط والتعلق، وهو أصل دلالي سليم للمفهوم. غير أن التعريف يحتاج إلى تحسين،
      إذ يفتقر إلى تمييز واضح بين هذه العلاقة وسواها من العلاقات اللغوية.

  blind_candidates:
    - lemma: "تَعَالُق نَحْوِيّ"
      generation_method: ishtiqaq
      justification: >
        وزن تَفَاعُل من جذر عَلَقَ يدل على الترابط المتبادل. المصدر تَعَالُق يعبّر عن ارتباط
        عنصرَي التركيب أحدهما بالآخر، مع وصف «نَحْوِيّ» لتقييد النوع. اشتقاق منتج يتجنب
        تكرار كلمة «علاقة» الواردة في التعريف مباشرة.
    - lemma: "رَابِطَة تَرْكِيبِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي: «رَابِطَة» (اسم فاعل من رَبَطَ) تدل على ما يصل الأجزاء بعضها ببعض،
        و«تَرْكِيبِيَّة» نسبة إلى التركيب النحوي. يُميِّز العلاقة النحوية عن غيرها من الروابط
        المنطقية أو الدلالية بتقييدها بالنظام التركيبي.
    - lemma: "صِلَة إِعْرَابِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي: «صِلَة» بمعنى الرابط والوصل بين الأجزاء (من جذر وصل)، و«إِعْرَابِيَّة»
        نسبة إلى الإعراب الذي هو التطبيق العملي لقواعد النحو. يُحيل مباشرة إلى الجانب
        الوظيفي للعلاقة النحوية.
    - lemma: "نَسَق نَحْوِيّ"
      generation_method: majaz
      justification: >
        «نَسَق» في أصله يدل على التتابع والانتظام في الشيء، ومن مجازه الاصطلاحي في علم النحو
        «نسق الكلام» للدلالة على العطف والترتيب. التوظيف هنا مجازي للدلالة على البنية العلائقية
        التي ينتظم بها الكلام نحوياً.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عَلَاقَة نَحْوِيَّة"
      confirm:
        - text: "«بنية نحوية: بنية من العناصر المرتبطة بتركيب الجملة»"
          source: "مسرد الإعلام والتواصل — المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«نَحْوِيّ: الوظيفة النحوية هي الدور الذي تلعبه بعض المركبات في الجملة. مثل وظيفتي الفاعل والمفعول»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
        - text: "«تركيبي: خاص بالتركيب أو بنظم الكلام»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
        - text: "«العلاقة: شيء بسببه يستصحب الأول الثاني كالعلية والتضايف»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العلاقة بالفتح في اصطلاح المنطقيين شيء بسببه يستصحب شيء شيئاً... فالعلاقة شيء بسببه يطلب الشيء الأول أن يكون الشيء الثاني مصاحباً له»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(الرابطة) العلاقة والوصلة بين الشيئين»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«تحليل نحوي: من المنظور التقليدي، تحليل عناصر الجملة من حيث طبيعتُها ووظيفتها. مثال: إعراب الجُمَل»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          addition: "يُبيّن أن التحليل النحوي ينصبّ على العناصر الوظيفية للجملة، مما يؤكد الطابع التركيبي-الوظيفي للعلاقة النحوية."

    - lemma: "تَعَالُق نَحْوِيّ"
      contradicts:
        - text: "«تَعَالُق: في تحليل إحصائي لعينة لغوية، ارتباط الخاصية بالأخرى حيث لا تتغير قيمتها إلا في الاتجاه نفسه أو في الاتجاه المتعارض»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          conflict: "«تَعَالُق» في المصطلحية العربية الحديثة مقيَّد بالمعنى الإحصائي (Correlation)، أي الارتباط بين المتغيرات، لا العلاقة النحوية الوظيفية. استخدامه هنا سيوقع في اشتراك لفظي."

    - lemma: "رَابِطَة تَرْكِيبِيَّة"
      confirm:
        - text: "«الرابطة: اللَّفْظَة الدَّالَّة على نِسْبَة ارتباط الْمَحْمُول بالموضوع»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«والرابطة عند المنطقيين هي الشيء الدالّ على النسبة... فلفظ هو وكان ليسا من الروابط إذ الرابطة إنّما تكون أداة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«تركيبي: خاص بالتركيب أو بنظم الكلام»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
      contradicts:
        - text: "«الرابطة: اللَّفْظَة الدَّالَّة على نِسْبَة ارتباط الْمَحْمُول بالموضوع» / «الرابطة إنما تكون أداة»"
          source: "معجم مقاليد العلوم للسيوطي / كشاف الفنون"
          conflict: "«رَابِطَة» في الاصطلاح الفلسفي-المنطقي تعني تحديداً «الرابط» (Copula) بين الموضوع والمحمول في القضية، وهو أضيق من «grammatical relation» الذي يشمل كل العلاقات النحوية الوظيفية."

    - lemma: "صِلَة إِعْرَابِيَّة"
      evidence_status: "no_material_found"

    - lemma: "نَسَق نَحْوِيّ"
      contradicts:
        - text: "«النَّسَق: النُّونُ وَالسِّينُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَتَابُعٍ فِي الشَّيْءِ. وَكَلَامٌ نَسَقٌ: جَاءَ عَلَى نِظَامٍ وَاحِدٍ قَدْ عُطِفَ بَعْضُهُ عَلَى بَعْضٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "«نَسَق» يدل على التتابع والانتظام التسلسلي لا على العلاقة الوظيفية بين العناصر. وهو يُستخدم في النحو تحديداً للعطف (نسق المعطوفات)، فيكون أخص من المطلوب."
        - text: "«نسق: كل نظام دالّ ومعقد يفرض نفسه على العالم»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          conflict: "المصطلحية الحديثة تستخدم «نسق» بمعنى system/système، وليس بمعنى relation، مما يُحدث التباساً."

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عَلَاقَة نَحْوِيَّة"
      decision: confirmed
      decision_reason: >
        مركب وصفي راسخ في أدبيات اللسانيات العربية الحديثة، ومطابق للمدلول الإنجليزي «grammatical relation».
        الجذر «علق» يحمل دلالة الارتباط والتعلق، والصفة «نحوية» تُقيّد النوع بالنحو. لم يُعثر على
        مدخل مفرد «علاقة نحوية» في قاعدة البيانات إلا أن المكوّنين موثّقان بشكل كافٍ وأن المركب
        مستعمل على نطاق واسع في المراجع اللسانية الحديثة. التشكيل الحالي صحيح (عَلَاقَة = فتحة
        للمعاني المجردة كما أفاد التعريف الفقهي للبركتي، و«نَحْوِيَّة» بتشديد الياء صحيح).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُميِّز العلاقة اللغوية المُحدَّدة بقواعد النحو عن سائر العلاقات
        اللغوية كالعلاقات الصوتية أو الدلالية. «نحوية» تُقيِّد بالبُعد التركيبي-الوظيفي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَلَاقَة نَحْوِيَّة"

    - lemma: "تَعَالُق نَحْوِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الاشتقاق صحيح من الناحية الصرفية، فإن «تَعَالُق» قد استقرّ في المصطلحية العربية
        بمعنى «Correlation» الإحصائي (كما في المعجم الموحد للسانيات)، مما يُحدث اشتراكاً لفظياً
        مع المعنى المقصود. استخدامه كمرادف لـ«grammatical relation» سيُوقع في لبس.

    - lemma: "رَابِطَة تَرْكِيبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «رَابِطَة» في الاصطلاح الفلسفي-المنطقي العربي الراسخ تعني «Copula» (رابط القضية بين
        الموضوع والمحمول)، وهو أضيق من «grammatical relation» الذي يشمل جميع العلاقات الوظيفية
        النحوية. كذلك «تركيبية» تُضيِّق الدلالة في اتجاه علم التركيب Syntax دون غيره من فروع النحو.
        المركب لا يُغطّي المفهوم بشموله المطلوب.

    - lemma: "صِلَة إِعْرَابِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «صِلَة» في علم النحو العربي لها استخدام اصطلاحي محدد (صلة الموصول)، مما يُحدث التباساً.
        و«إِعْرَابِيَّة» تقصر الدلالة على العلاقات المتعلقة بالإعراب الصرفي دون الوظائف النحوية
        الأشمل. لا دليل معجمي على المركب. مرفوض.

    - lemma: "نَسَق نَحْوِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        «نَسَق» يدل على التتابع والانتظام التسلسلي، وفي النحو التقليدي يُستخدم تحديداً للعطف
        (المعطوف نسق على المعطوف عليه). في اللسانيات الحديثة استقر بمعنى «system/système».
        لا يُعبِّر عن مفهوم «العلاقة» الذي يتضمن ربطاً وظيفياً بين عنصرَين، بل يُحيل إلى
        الترتيب والتتابع. مرفوض.

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
