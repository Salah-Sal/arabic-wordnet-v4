        أو مجالها في البنية النحوية. ثانياً، هو لا يُميِّز بين هذه العلاقة وسائر العلاقات اللغوية
        (يمكن أن يُقال عن أي علاقة لغوية إنها «يؤسسها» نظام ما). يحتاج التعريف إلى جنس أقرب
        وفصل نوعي يُحدِّد الوظيفة التركيبية.
