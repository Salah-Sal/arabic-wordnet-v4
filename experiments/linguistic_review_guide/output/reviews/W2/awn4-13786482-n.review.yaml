# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13786482-n (worth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم كلمة «قيمة» وهي نفس اللمّة الوحيدة في المجموعة، مما يُحدث دوراناً معجمياً"
      - "المجموعة تحتوي على لمّة واحدة فقط (قيمة) وهي عامة جداً، بينما المفهوم المقصود أخصّ: كمية من شيء تساوي مبلغاً بعينه"
    observations: >
      المفهوم المقصود هو «worth» بمعنى الكمية غير المحددة من شيء ذي قيمة محددة، كقولك: «ما يساوي عشرة دولارات من الوقود».
      وهذا مفهوم يتعلّق بالمقدار المُحدَّد بالثمن لا بالقيمة المجرّدة. اللمّة «قيمة» عامة تشمل القيمة المعنوية والمادية والثمن،
      لكنها تصلح بتضييق السياق. الرابط التصاعدي (hypernym) هو «كمية غير محددة / مقدار تقديري» وهو مناسب.
  blind_candidates:
    - lemma: "قَدْر"
      generation_method: ishtiqaq
      justification: "من الجذر ق د ر على وزن فَعْل، ومعناه مَبْلَغ الشيء ومقداره، يُستعمل في سياق: «قَدْرُ دينارٍ من الذهب»"
    - lemma: "مِقْدَار"
      generation_method: ishtiqaq
      justification: "من الجذر ق د ر على وزن مِفْعَال، ومعناه ما يُعرَف به قدر الشيء من كَيل أو وزن أو عدد"
    - lemma: "نَصِيب"
      generation_method: ishtiqaq
      justification: "من الجذر ن ص ب على وزن فَعِيل، ومعناه الحظّ والقسط من شيء، يُستعمل بمعنى ما يناله المرء من كمية"
    - lemma: "حِصَّة"
      generation_method: ishtiqaq
      justification: "من الجذر ح ص ص على وزن فِعْلَة، ومعناه القِسْم من الجملة والنصيب، وتُستعمل في سياق تحديد كمية بقيمة"

stage2_evidence:
  per_lemma:
    - lemma: "قِيمَة"
      confirm:
        - text: "«قيمة الشيء: قدره. قيمة المتاع: ثمنه»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(الْقيمَة) قيمَة الشَّيْء قدره وَقِيمَة الْمَتَاع ثمنه وَمن الْإِنْسَان طوله (ج) قيم»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«القِيمة: الثمنُ الذي يقاوم المتاع، أي يقوم مقامه»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«القيمة: هي شرعاً ما يدخل تحت تقويم مقوّم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يضيف البُعد الشرعي للقيمة بوصفها ما يقوّمه المقوِّم"
        - text: "«قِيمة: من (ق و م) ثمن الشيء، ودوام الأمر وثباته»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكد أن القيمة من جذر ق و م وتعني الثمن والدوام"
    - lemma: "قَدْر"
      confirm:
        - text: "«القَدْرُ: مَبْلَغُ كُلِّ شَيْءٍ. يُقَالُ: قَدْرُهُ كَذَا، أَيْ مَبْلَغُهُ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«والقَدْرُ: قَضَاءُ اللَّهِ تَعَالَى الْأَشْيَاءَ عَلَى مَبَالِغِهَا وَنِهَايَاتِهَا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الدلالة الأولى والأكثر شيوعاً لـ«قَدْر» هي القضاء والقدر الإلهي، مما يُحدث اشتراكاً لفظياً حاداً"
    - lemma: "مِقْدَار"
      contradicts:
        - text: "«المِقْدَار: ما يُعرف به قدر الشيء من معدود أو مكيل أو موزون»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "المقدار أداة القياس أو الكمية المُحدَّدة ذاتها، لا الكمية غير المحددة المُقوَّمة بثمن"
        - text: "«(الْمِقْدَار) مِقْدَار الشَّيْء مثله فِي الْعدَد أَو الْكَيْل أَو الْوَزْن أَو المساحة»"
          source: "المعجم الوسيط"
          conflict: "المقدار يعني المثل والمساوي في القياس المادي، وليس كمية مُحدَّدة بالقيمة المالية"
    - lemma: "نَصِيب"
      contradicts:
        - text: "«النَّصِيبُ: الحظّ من كل شيء»"
          source: "المعجم الوسيط"
          conflict: "النصيب يدل على الحظ والقسمة بين أطراف، لا على كمية مُقدَّرة بثمن معيّن"
    - lemma: "حِصَّة"
      contradicts:
        - text: "«الحِصَّة: القسم، وحصة من المال كذا حصل له نصيباً»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الحصة تعني القسم من الجملة والنصيب في توزيع، لا مقدار شيء بحسب قيمته المالية"
      expands:
        - text: "«الحِصَّة: قال الراغب: القطعة من الجملة وتستعمل استعمالَ النصيب»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "يؤكد أن الحصة قطعة من كلّ، تُستعمل بمعنى النصيب"

stage3_analysis:
  per_lemma:
    - lemma: "قِيمَة"
      decision: confirmed
      decision_reason: >
        اللمّة «قيمة» ثابتة في المعاجم بمعنى «قَدْر الشيء وثمنه»، وهي الأقرب دلالياً
        لمفهوم المجموعة. المعجم الوسيط يُعرّفها صراحة بـ«قيمة الشيء: قدره، وقيمة المتاع: ثمنه»،
        وهذا يشمل الدلالة على المقدار المُحدَّد بالثمن. اللمّة بحاجة إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِيمَة"
    - lemma: "قَدْر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «قَدْر» يعني «مَبْلَغ الشيء» وهو قريب من المفهوم، إلا أن الاشتراك اللفظي
        الحادّ مع «القَدَر» (القضاء الإلهي) والاستعمال الشائع بمعنى المنزلة والعظمة
        يجعلانه غير دقيق في هذا السياق. كما أنه أعمّ من المفهوم المطلوب.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "مِقْدَار"
      source: stage1
      decision: removed
      decision_reason: >
        «المقدار» يدل على أداة القياس أو الكمية المُحدَّدة بالكيل والوزن والعدد،
        وليس على الكمية المُقوَّمة بالثمن. هو أقرب إلى hypernym المجموعة (كمية غير محددة)
        منه إلى المفهوم المخصوص بالقيمة المالية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "نَصِيب"
      source: stage1
      decision: removed
      decision_reason: >
        «النصيب» يدل على الحظ والقسمة بين أطراف، ولا يتضمّن دلالة تحديد الكمية بثمن معيّن.
        لا يصلح مرادفاً لـ«worth» في هذا السياق.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "حِصَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الحصة» تعني القسم من الجملة والنصيب في توزيع بين أطراف،
        ولا تتضمّن دلالة التقويم بالثمن المطلوبة في المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "كمية غير محددة من شيء له قيمة محددة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية، ويستخدم كلمة «قيمة» وهي نفس اللمّة
        مما يُحدث دوراناً معجمياً. يحتاج إلى إعادة صياغة بأسلوب المعجم الوسيط
        مع تجنّب الدوران.
    authored:
      - type: terminological
        text: "مِقدارٌ غيرُ مُعيَّنٍ من شيءٍ يُقابِلُ ثَمَناً مُحدَّداً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يَعدِلُ مَبلغاً مُعيَّناً من المال في بابِ التَّقويم"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مِقدارٌ غيرُ مُعيَّنٍ من شيءٍ يُقابِلُ ثَمَناً مُحدَّداً"
  examples:
    per_lemma:
      - lemma: "قِيمَة"
        examples:
          - text: "اشترى قِيمَةَ عشرةِ دنانيرَ من القمحِ لإطعامِ أُسرتِه."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "اشترى قِيمَةَ عشرةِ دنانيرَ من القمحِ لإطعامِ أُسرتِه."

