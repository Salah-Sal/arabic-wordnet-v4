step0_evidence:
  per_lemma:
    - lemma: "قِطْعَة"
      confirm:
        - text: "«الْقطعَة: الْحصَّة من الشَّيْء»"
          source: "المعجم الوسيط"
        - text: "«طائفة من كل شيء»"
          source: "كتاب العين"
    - lemma: "كُتْلَة"
      confirm:
        - text: "«الكتلة: الْقطعَة المجتمعة من الشَّيْء»"
          source: "المعجم الوسيط"
        - text: "«الكُتْلَةُ... ما جُمِعَ، والفِدْرَةُ من اللَّحْمِ... المُدَوَّرُ المُجْتَمِعُ»"
          source: "القاموس المحيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "كُتْلَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«ترجمة lump» — المعجم الطبي الموحد"
      justification: "الكتلة في معناها المعجمي تعبر عن القطعة المجتمعة التي لا شكل محدد لها."
    - lemma: "قِطْعَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«ترجمة hunk: كتلة كبيرة؛ قطعة ضخمة» — المورد الحديث"
      justification: "القطعة تدل على الحصة المقتطعة من شيء أكبر."
  knowledge_candidates:
    - lemma: "فِدْرَة"
      justification: "تخصيص الدلالة: الفدرة تطلق في المعاجم على القطعة المجتمعة من اللحم أو الجبل، وهي تناسب مفهوم القطعة المكتلتة بلا شكل محدد."
  generation_notes: "المصطلحات المستخرجة تعبر عن معنى التجمع وعدم انتظام الشكل، والكتلة هي الأدق."

step1_lemma_validation:
  per_lemma:
    - lemma: "قِطْعَة"
      decision: confirmed
      decision_reason: "كلمة فصيحة ومستعملة وتؤدي معنى الحصة من الشيء، ورغم كونها أعم إلا أنها تناسب السياق."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "القطعة تدل على مطلق ما اقتطع من شيء آخر، بغض النظر عن حجمه أو كونه منتظم الشكل أم لا."
      example: "انفصلتْ قِطْعَةٌ كَبِيرَةٌ مِنَ الجَبَلِ الجَلِيدِيِّ."
    - lemma: "كُتْلَة"
      decision: confirmed
      decision_reason: "مصطلح دقيق جداً للمفهوم؛ فهو يدل على القطعة المجتمعة من الشيء دون أن يكون لها شكل هندسي أو تنظيم محدد."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الكتلة تزيد على القطعة بكونها مجتمعة ومكتتلة على نفسها بلا شكل محدد أو أبعاد هندسية منتظمة، وهي الأدق في تمثيل المفهوم."
      example: "تَكَوَّنَتْ كُتْلَةٌ مِنَ الطِّينِ إِثْرَ الأَمْطَارِ الغَزِيرَةِ."
    - lemma: "فِدْرَة"
      source: step05
      decision: removed
      decision_reason: "كلمة تراثية غريبة الاستعمال في السياقات المعاصرة العامة لوصف قطعة عشوائية الشكل من أي شيء، إذ يغلب استعمالها قديما لقطعة اللحم أو الجبل."
      step05_citation: "معرفة لغوية — الإزاحة الدلالية."
      substitution_test:
        result: "fail"
      nuance_differentiation: "تختص تقليديًا باللحم أو أجزاء الجبال ولا تشيع للمواد الأخرى."
  synset_flags:
    definition_review_needed: false
    split_needed: false

step3_definition:
