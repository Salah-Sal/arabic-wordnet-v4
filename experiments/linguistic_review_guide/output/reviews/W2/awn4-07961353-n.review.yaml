          source: "المعجم الوسيط"
          conflict: "التاجر معناه القانوني أخصّ: من يمارس الأعمال التجارية شخصياً باحتراف، لا مَن يدير مؤسسة تجارية"
      expands:
        - text: "«الذى مِهنتُه البَيْع والشِّراء»"
          source: "المعجم الكبير"
          addition: "يؤكد اختصاص التاجر بالبيع والشراء دون الإدارة التنفيذية"

