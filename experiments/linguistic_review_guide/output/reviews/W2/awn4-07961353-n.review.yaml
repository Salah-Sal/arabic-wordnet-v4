# مراجعة المجموعة الترادفية — awn4-07961353-n
# business people / رجال أعمال
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان مقيّدتان بالجنس (رجال / سيدات)، والمفهوم الإنجليزي محايد جنسياً (businesspeople)"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي، يحتاج صياغة معجمية أصيلة"
      - "لا يوجد مصطلح عربي محايد جنسياً واحد يغطّي المفهوم كاملاً"
    observations: "المجموعة تمثّل مفهوم الجماعة التي تمارس الأعمال التجارية ولا سيّما القيادات التنفيذية. في العربية يُفرَّق تقليدياً بين رجال الأعمال وسيدات الأعمال، وهذا التفريق طبيعي صرفياً وثقافياً. المصطلح «رجال أعمال» هو الأكثر شيوعاً وتداولاً في الإعلام والاقتصاد العربي المعاصر."
  blind_candidates:
    - lemma: "أَرْبَابُ أَعْمَال"
      generation_method: tarkib
      justification: "مركب إضافي من «أرباب» (أصحاب) و«أعمال»؛ يُستعمل في السياق الرسمي للإشارة إلى أصحاب المشاريع والمؤسسات التجارية"
    - lemma: "تُجَّار"
      generation_method: ishtiqaq
      justification: "جمع تاجر من الجذر «تجر» على وزن فُعَّال؛ يدل على من يمارس التجارة بيعاً وشراءً"
    - lemma: "أَهْلُ الأَعْمَال"
      generation_method: tarkib
      justification: "مركب إضافي من «أهل» بمعنى أصحاب الشأن و«الأعمال»؛ تعبير عربي كلاسيكي للإشارة إلى ذوي الشأن في ميدان ما"
    - lemma: "مُتَعَامِلُون"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تعامل (باب التفاعل) من الجذر «عمل»؛ يدل على من يتبادلون المعاملات التجارية"

