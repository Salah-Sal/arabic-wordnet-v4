stage1_review:
  assessment:
    concerns:
      - "استخدام (هامشية) لترجمة (fringe) في هذا السياق يعد ترجمة حرفية قد توحي بـ (المنبوذين أو غير المهمين) بدلاً من المعنى الدقيق وهو (أصحاب الآراء المتطرفة والخارجة عن المألوف)."
    observations: "مصطلحات (جماعة هامشية) و(فئة هامشية) شائعة جداً في لغة الإعلام الحديث والترجمات المعاصرة، إلا أن العربية تمتلك جذوراً تعبر عن المفهوم بدقة أكبر مثل (الغلو) و(التطرف)."
  blind_candidates:
    - lemma: "شِرْذِمَة"
      generation_method: majaz
      justification: "الشرذمة هي القطعة من الشيء أو القليل من الناس، وتطلق مجازاً على الجماعات المنعزلة ذات الشذوذ في الرأي."
    - lemma: "غُلَاة"
      generation_method: ishtiqaq
      justification: "الغلاة هم الذين يتجاوزون الحد المألوف في المعتقد أو الرأي، وهو المعنى الدقيق لـ (fringe views)."
    - lemma: "جَمَاعَة مُتَطَرِّفَة"
      generation_method: tarkib
      justification: "ترجمة معنوية ومباشرة لوصف المجموعات التي تتبنى آراء متطرفة."
    - lemma: "فِئَة هَامِشِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي شائع الاستخدام في الترجمات المعاصرة للتعبير عن المجموعات غير السائدة."

stage2_evidence:
  per_lemma:
    - lemma: "جَمَاعَة هَامِشِيَّة"
      evidence_status: "no_material_found"
    - lemma: "فِئَة هَامِشِيَّة"
      evidence_status: "no_material_found"
    - lemma: "غُلَاة"
      confirm:
        - text: "(4) الغُلاة: جماعة متطرِّفة"
          source: "المورد الحديث (2008)"
    - lemma: "جَمَاعَة مُتَطَرِّفَة"
      confirm:
        - text: "الغُلاة: جماعة متطرِّفة"
          source: "المورد الحديث (2008)"
        - text: "اليعقوبيّ: واحد اليعاقبة، وهم جماعة سياسية متطرفة عُرفت بنشاطها الإرهابي خلال الثورة الفرنسية."
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "جَمَاعَة هَامِشِيَّة"
      decision: confirmed
      decision_reason: "مصطلح معاصر شائع ومستقر في لغة الإعلام وعلم الاجتماع كترجمة لـ (fringe group)، رغم كونه ترجمة حرفية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَمَاعَة هَامِشِيَّة"
    - lemma: "فِئَة هَامِشِيَّة"
      decision: confirmed
      decision_reason: "مرادف متداول للمصطلح السابق، يعبر عن نفس المفهوم ضمن سياق الدراسات الاجتماعية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِئَة هَامِشِيَّة"
    - lemma: "غُلَاة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي أصيل يقابل مفهوم (fringe) في تبني الآراء المتطرفة، وقد اعتمده معجم المورد كترجمة مباشرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "غُلَاة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07991297-n"}
    - lemma: "جَمَاعَة مُتَطَرِّفَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مركب مباشر وواضح الدلالة على المجموعات ذات الآراء غير المألوفة والمتطرفة، ومثبت في المعاجم ثنائية اللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "جَمَاعَة مُتَطَرِّفَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07991297-n"}
    - lemma: "شِرْذِمَة"
      source: stage1
      decision: removed
      decision_reason: "تفيد معنى الجماعة القليلة المنعزلة ولكنها لا تتضمن بالضرورة تبني آراء متطرفة، كما أنها تحمل دلالة تحقيرية قوية قد لا تناسب الوصف الدلالي الموضوعي."

stage4_content:
  definition:
    current: "مجموعة اجتماعية تعتنق آراء هامشية أو متطرفة"
    assessment:
      decision: retain
      reason: "التعريف الحالي يجمع بشكل موفق بين الترجمة الحرفية (هامشية) والمعنى المقصود (متطرفة)، ويؤدي الوظيفة الدلالية بدقة."
  examples:
    per_lemma:
      - lemma: "جَمَاعَة هَامِشِيَّة"
        examples:
          - text: "لا يمثل هؤلاء سوى جماعة هامشية لا تأثير لها على مسار الأحداث."
            type: usage
      - lemma: "فِئَة هَامِشِيَّة"
        examples:
          - text: "حاولت إحدى الفئات الهامشية فرض آرائها الشاذة على المجتمع المعتدل."
            type: usage
      - lemma: "غُلَاة"
        examples:
          - text: "انفصل الغلاة عن التيار الرئيسي للحزب لتأسيس حركتهم الخاصة."
            type: usage
      - lemma: "جَمَاعَة مُتَطَرِّفَة"
        examples:
          - text: "تمكنت الأجهزة الأمنية من تفكيك جماعة متطرفة تنشر أفكاراً هدامة."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "لا يمثل هؤلاء سوى جماعة هامشية لا تأثير لها على مسار الأحداث."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "حاولت إحدى الفئات الهامشية فرض آرائها الشاذة على المجتمع المعتدل."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "انفصل الغلاة عن التيار الرئيسي للحزب لتأسيس حركتهم الخاصة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تمكنت الأجهزة الأمنية من تفكيك جماعة متطرفة تنشر أفكاراً هدامة."}

