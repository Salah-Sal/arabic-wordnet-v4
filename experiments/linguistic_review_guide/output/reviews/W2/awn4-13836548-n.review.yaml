# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13836548-n — brotherhood
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي لمّة واحدة فقط (أُخُوَّة) مما يجعلها فقيرة معجمياً"
      - "القيد (للذكور) ملحق باللمّة لا بالتعريف، والأصح أن يكون في التعريف"
      - "التعريف الحالي لا يميّز بوضوح بين أُخُوَّة النسب وأُخُوَّة الرضاعة أو الصداقة"
    observations: "المفهوم هو علاقة القرابة الخاصة بالذكر تجاه إخوته، وهو مفهوم عربي أصيل له عدة ألفاظ من جذر أخو (فُعُولة، إِفْعَال). التعريف الإنجليزي يحصره في النسب البيولوجي (offspring) بخلاف الاستعمال العربي الأوسع."
  blind_candidates:
    - lemma: "أُخُوَّة"
      generation_method: ishtiqaq
      justification: "مصدر على وزن فُعُولة من جذر أخو، وهو اللفظ المعجمي الأول للدلالة على صلة القرابة بين الإخوة"
    - lemma: "إِخَاء"
      generation_method: ishtiqaq
      justification: "مصدر على وزن إِفْعَال من جذر أخو، يدل على رابطة الأخوة والمودة بين الإخوة"
    - lemma: "أُخُوّ"
      generation_method: ishtiqaq
      justification: "مصدر مختصر من أخو، أقل شيوعاً من أُخُوَّة، قد يرد في النصوص القديمة"
    - lemma: "تَآخٍ"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَاعُل من أخو، يدل على التشارك في الأخوة والتعامل بها"


stage2_evidence:
  per_lemma:
    - lemma: "أُخُوَّة"
      confirm:
        - text: "«الصلة بين الأخوين بالقرابة أو بالرضاعة أو بالصداقة»"
          source: "المعجم الكبير"
        - text: "«أَخٌ وأَخَوانِ وإِخوةٌ وإِخوانٌ. وبيني وبينه أُخُوَّةٌ وإِخاءُ»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«(1) أُخُوَّة (2) إخاء (3) أَخَوِيّة؛ رَهْبنة؛ منظَّمة — brotherhood»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«كَسَوْنَا أُخُوَّتَنَا بِالصَّفـاء كما كُسِيَتْ بالكلام المعانى» — أبو فِراس"
          source: "المعجم الكبير"
          addition: "شاهد شعري يُظهر استعمال أُخُوَّة في سياق المودة والصلة"
        - text: "«بينى وبينه أُخُوَّة»"
          source: "المعجم الكبير"
          addition: "مثال استعمالي يؤكد الاستخدام في سياق العلاقة بين شخصين"

    - lemma: "إِخَاء"
      confirm:
        - text: "«وبيني وبينه أُخُوَّةٌ وإِخاءُ»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«(1) أُخُوَّة (2) إخاء — brotherhood»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«شد الله بينكما أواخي الإخاء، وحل أواري الرياء»"
          source: "أساس البلاغة للزمخشري"
          addition: "استعمال مجازي يُظهر أن الإخاء يميل إلى الدلالة على الرابطة المعنوية لا مجرد صلة النسب"

    - lemma: "أُخُوّ"
      evidence_status: "no_material_found"

    - lemma: "تَآخٍ"
      contradicts:
        - text: "«بين السماحة والحماسة تآخٍ»"
          source: "أساس البلاغة للزمخشري"
          conflict: "تَآخٍ هنا بمعنى التشابه والتماثل المجازي، لا بمعنى علاقة القرابة النسبية"


stage3_analysis:
  per_lemma:
    - lemma: "أُخُوَّة"
      decision: confirmed
      decision_reason: "لفظ معجمي أصيل مثبت في المعجم الكبير وكتاب العين والمورد الحديث، يدل على صلة القرابة بين الإخوة بدقة. التشكيل الموجود صحيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أُخُوَّة تدل على صلة القرابة النسبية أو الرضاعية بين الإخوة بوصفها حالة ثابتة (state)، وهي أدق من إِخَاء في الدلالة على الرابطة البيولوجية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُخُوَّة"

    - lemma: "إِخَاء"
      source: stage1
      decision: confirmed
      decision_reason: "مثبت في كتاب العين مقروناً بأُخُوَّة، وفي المورد الحديث ترجمةً لـ brotherhood. يضيف بُعداً دلالياً تكاملياً مع أُخُوَّة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "إِخَاء يدل على الرابطة المعنوية والوجدانية بين الإخوة (bond)، ويتسع للأخوة غير النسبية أكثر من أُخُوَّة"
      actions:
        - command: create_entry
          params: {lemma: "إِخَاء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13836548-n"}

    - lemma: "أُخُوّ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية على هذا اللفظ بوصفه مصدراً مستقلاً للدلالة على علاقة الأخوة"

    - lemma: "تَآخٍ"
      source: stage1
      decision: removed
      decision_reason: "تَآخٍ يدل على فعل التشارك والتعامل بالأخوة أو التشابه المجازي، لا على علاقة القرابة النسبية. الشاهد الوحيد في أساس البلاغة استعمال مجازي."


