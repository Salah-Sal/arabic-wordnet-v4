stage1_review:
  assessment:
    concerns:
      - اللمّات الموجودة تغطي جانبي الانفجار المادي (انفجار) والاندلاع (نار، حرب) ولكنها قد تفتقر إلى الشمولية لمفهوم "الهياج" أو "الثوران" العاطفي أو الطبيعي.
    observations: "التعريف الحالي 'حدث مفاجئ ومكثف' دقيق ولكنه يحتاج صياغة أكثر فصاحة. اللمّات المختارة (اندلاع، انفجار، فورة) تمثل المفهوم بشكل جيد في سياقات مختلفة."
  blind_candidates:
    - lemma: "اِنْدِلَاع"
      generation_method: ishtiqaq
      justification: "من الجذر (دلع) للدلالة على الظهور المفاجئ والخروج، ويشيع استخدامه مع الحروب والحرائق."
    - lemma: "اِنْفِجَار"
      generation_method: ishtiqaq
      justification: "من الجذر (فجر) للدلالة على التفتح والانبعاث المفاجئ بقوة."
    - lemma: "فَوْرَة"
      generation_method: ishtiqaq
      justification: "من الجذر (فور) للدلالة على الغليان والهيجان المفاجئ."
    - lemma: "ثَوَرَان"
      generation_method: ishtiqaq
      justification: "من الجذر (ثور) للدلالة على الانبعاث والهيجان، ويستخدم للبراكين والمشاعر."

stage2_evidence:
  per_lemma:
    - lemma: "اِنْدِلَاع"
      confirm:
        - text: "«حريق. وبخاصة: اندلاع النار فجأةً»"
          source: "المورد الحديث"
        - text: "«اندلاع الحرب»"
          source: "معجم الصواب اللغوي (سياق استشهاد)"
    - lemma: "اِنْفِجَار"
      confirm:
        - text: "«انفجار عاطفي [مفاجئ]»"
          source: "المورد الحديث"
        - text: "«عملية إطلاق الصوت بعد الانسداد في حيز النطق [Burst]»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "فَوْرَة"
      confirm:
        - text: "«فورة بحيرة جليدية: [glacial lake outburst]»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«الفورة من الحر شدته ومن الناس مجتمعهم»"
          source: "المعجم الوسيط"
    - lemma: "ثَوَرَان"
      confirm:
        - text: "«تفجر، ثوران: outburst»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
        - text: "«ثوران: eruption»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
    - lemma: "تَفَجُّر"
      confirm:
        - text: "«تفجر: outburst»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
        - text: "«تفجر عاطفي [مفاجئ]»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "اندلاع"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن البدء المفاجئ والعنيف للحرائق والحروب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْدِلَاع"
    - lemma: "انفجار"
      decision: confirmed
      decision_reason: "يعبر عن التفرقع المفاجئ والقوي، سواء كان مادياً أو معنوياً (انفجار غضب)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْفِجَار"
    - lemma: "فورة"
      decision: confirmed
      decision_reason: "تعبر عن الهيجان والنشاط المفاجئ (فورة نشاط، فورة غضب)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَوْرَة"
    - lemma: "ثَوَرَان"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي يعبر عن الهيجان الطبيعي (براكين) والاجتماعي (ثورة/ثوران)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ثَوَرَان", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07449542-n"}
    - lemma: "تَفَجُّر"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة المطاوعة من الفجر، وتدل على عملية الانبعاث والتدفق المفاجئ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَفَجُّر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07449542-n"}

stage4_content:
  definition:
    current: "حدث مفاجئ ومكثف"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، يحتاج لبيان طبيعة الحدث وضرب أمثلة سياقية لزيادة الوضوح."
    authored:
      - type: terminological
        text: "حُدُوثٌ مُفَاجِئٌ وَقَوِيٌّ لِأَمْرٍ مَا، كَالحَرْبِ أَوِ الغَضَبِ أَوِ النَّارِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "اِنْدِلَاع"
        examples:
          - text: "حذرت المنظمات الدولية من اندلاع حرب شاملة في المنطقة."
            type: usage
      - lemma: "اِنْفِجَار"
        examples:
          - text: "أدى انفجار الأنبوب إلى فيضان في الشارع."
            type: usage
      - lemma: "فَوْرَة"
        examples:
          - text: "في فورة غضبه، قال كلمات ندم عليها لاحقاً."
            type: usage
      - lemma: "ثَوَرَان"
        examples:
          - text: "راقب الجيولوجيون ثوران البركان من مسافة آمنة."
            type: usage
      - lemma: "تَفَجُّر"
        examples:
          - text: "شهدت البلاد تفجراً للمشاعر الوطنية بعد النصر."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07449542-n", definition_index: 0, text: "حُدُوثٌ مُفَاجِئٌ وَقَوِيٌّ لِأَمْرٍ مَا، كَالحَرْبِ أَوِ الغَضَبِ أَوِ النَّارِ."}

stage5_enrichment:
  per_entry:
    - lemma: "اِنْدِلَاع"
      entry_id: "{auto}"
      root: "دلع"
      maqayis_quote: "«الدَّالُ وَاللَّامُ وَالْعَيْنُ أُصَيْلٌ يَدُلُّ عَلَى خُرُوجٍ. تَقُولُ: دَلَعَ لِسَانُهُ: خَرَجَ... وَيُقَالُ انْدَلَعَ بَطْنُهُ، إِذَا أَخْرَجَ أَمَامَهُ.»"
    - lemma: "اِنْفِجَار"
      entry_id: "{auto}"
      root: "فجر"
      maqayis_quote: "«الْفَاءُ وَالْجِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّفَتُّحُ فِي الشَّيْءِ... انْفَجَرَ الْمَاءُ انْفِجَارًا: تَفَتَّحَ.»"
    - lemma: "فَوْرَة"
      entry_id: "{auto}"
      root: "فور"
      maqayis_quote: "«الْفَاءُ وَالْوَاوُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى غَلَيَانٍ، ثُمَّ يُقَاسُ عَلَيْهَا. فَالْفَوْرُ: الْغَلَيَانُ.»"
    - lemma: "ثَوَرَان"
      entry_id: "{auto}"
      root: "ثور"
      maqayis_quote: "«الثَّاءُ وَالْوَاوُ وَالرَّاءُ أَصْلَانِ... فَالْأَوَّلُ انْبِعَاثُ الشَّيْءِ... ثَارَ الشَّيْءُ يَثُورُ ثَوْرًا وَثُؤُورًا وَثَوَرَانًا.»"
    - lemma: "تَفَجُّر"
      entry_id: "{auto}"
      root: "فجر"
      maqayis_quote: "«الْفَاءُ وَالْجِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّفَتُّحُ فِي الشَّيْءِ.»"
  per_sense:
