stage1_review:
  assessment:
    concerns:
      - "اللمّة 'اتساع' عامّة جدًّا وقد تشير إلى الحجم الكلّي وليس بالضرورة الشكل المتسع للخارج."
    observations: "المجموعة تدور حول المفهوم الهندسي للشكل الذي يزداد عرضه تدريجيًا (flare)، وهو مفهوم يحتاج إلى مصطلحات دقيقة تميزه عن مجرد الاتساع العام."
  blind_candidates:
    - lemma: "اتِّسَاع"
      generation_method: ishtiqaq
      justification: "المصدر المباشر للفعل اتسع، وهو يعبر عن زيادة العرض."
    - lemma: "انْفِرَاج"
      generation_method: ishtiqaq
      justification: "يعبر عن تباعد طرفي الزاوية أو الفتحة، وهو جوهر معنى الـ flare."
    - lemma: "تَقَمُّع"
      generation_method: ishtiqaq
      justification: "مشتق من القمع، ويصف اتخاذ الشيء شكل القمع المتسع نحو الخارج."
    - lemma: "تَبَوُّق"
      generation_method: ishtiqaq
      justification: "مشتق من البوق، ويصف الاتساع التدريجي المشابه لنهاية آلة البوق."

stage2_evidence:
  per_lemma:
    - lemma: "اتِّسَاع"
      confirm:
        - text: "«الاتِّسَاعُ في الظرف بأن لا يقدر معه في فينصب نصب المفعول به...»"
          source: "كشاف اصطلاحات الفنون"
        - text: "«Extension: اتساع»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "انْفِرَاج"
      confirm:
        - text: "«انفراج: Aperture، انفتاح مخرج الفم حين إصدار صوت معين.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«انفراج: clearing; clearance»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية"
    - lemma: "تَقَمُّع"
      confirm:
        - text: "«يتقمَّع؛ يتبوَّق: يَتَّسع تدريجيًا نحو الخارج، كنهاية قمعٍ أو بوق The skirt flares at the knees.»"
          source: "المورد الحديث"
        - text: "«تقمُّع؛ تبوُّق the flare of a skirt.»"
          source: "المورد الحديث"
    - lemma: "تَبَوُّق"
      confirm:
        - text: "«يتقمَّع؛ يتبوَّق: يَتَّسع تدريجيًا نحو الخارج، كنهاية قمعٍ أو بوق.»"
          source: "المورد الحديث"
        - text: "«تطور أوراق النبات لتأخذ شكل قمع أو بوق... يستعمل البوق كمصيدة للحشرات.» (دليل على استخدام الهيئة البوقية لوصف الاتساع)"
          source: "مسرد المناخ والبيئة (ArabTerm)"

