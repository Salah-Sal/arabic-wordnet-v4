stage4_content:
  definition:
    current: "شكل يتسع للخارج"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جدًا، والأفضل إضافة صفة التدرج والتشبيه بالأشكال المعروفة (القمع والبوق) لزيادة الوضوح."
    authored:
      - type: terminological
        text: "شكلٌ يزدادُ عرضُه تدريجيًّا نحو الخارجِ كما في نهايةِ القمعِ أو البوقِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13885247-n", definition_index: 0, text: "شكلٌ يزدادُ عرضُه تدريجيًّا نحو الخارجِ كما في نهايةِ القمعِ أو البوقِ."}
  examples:
    per_lemma:
      - lemma: "اتِّسَاع"
        examples:
          - text: "يلاحظُ المصممونَ أنَّ اتساعَ قاعدةِ العمودِ يمنحُ البناءَ استقرارًا بصريًّا."
            type: usage
      - lemma: "انْفِرَاج"
        examples:
          - text: "تمَّ تعديلُ انفراجِ المدخنةِ لضمانِ خروجِ الغازاتِ بكفاءةٍ أكبر."
            type: usage
      - lemma: "تَقَمُّع"
        examples:
          - text: "يضفي تقمُّعُ الفستانِ عندَ الحاشيةِ مظهرًا كلاسيكيًّا جذابًا."
            type: usage
      - lemma: "تَبَوُّق"
        examples:
          - text: "صُممتْ نهايةُ الأنبوبِ بشكلِ تبوُّقٍ لتسهيلِ عمليةِ الربطِ."
            type: usage

