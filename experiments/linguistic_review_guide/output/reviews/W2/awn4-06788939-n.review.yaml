stage1_review:
  assessment:
    concerns:
      - "لفظ «ظَرْف» شديد الاشتراك اللفظي (وعاء، ظرف نحوي، كياسة)؛ يحتاج تنبيهاً دلاليّاً"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية وليس بأسلوب المعاجم العربية"
      - "المجموعة تجمع بين الملَكة (wit/wittiness) والنتاج (witticism/humor) وهما مستويان مختلفان"
    observations: "المفهوم أصيل في الثقافة العربية وله مصطلحات تراثية غنية: الدُّعابة من الدَّعْب وهو التبسّط، والفُكاهة من الفَكِه وهو الطيّب النفس، والظَّرْف وهو الكياسة والبراعة. يمكن إثراء المجموعة بلفظ «مُلْحَة» الذي يعني الكلمة المليحة المستملَحة، وهو أقرب إلى معنى witticism."
  blind_candidates:
    - lemma: "نُكْتَة"
      generation_method: ishtiqaq
      justification: "من جذر ن ك ت، تدلّ على الفكرة اللطيفة المؤثّرة في النفس التي تُخرَج بدقة نظر، وهي مقابل witticism في المعاجم الثنائية"
    - lemma: "مُلْحَة"
      generation_method: majaz
      justification: "من الملح مجازاً، والعرب تقول «حدَّثته بالمُلَح» أي بالكلام المستملَح الظريف؛ إزاحة دلالية من الملوحة إلى الاستملاح والاستطراف"
    - lemma: "طُرْفَة"
      generation_method: ishtiqaq
      justification: "من جذر ط ر ف على وزن فُعْلَة، بمعنى ما يُستطرف ويُستحدَث من الكلام العجيب"
    - lemma: "هَزْل"
      generation_method: ishtiqaq
      justification: "من جذر هـ ز ل، نقيض الجدّ، يدلّ على المزاح والمداعبة في الكلام"

stage2_evidence:
  per_lemma:
    - lemma: "دُعَابَة"
      confirm:
        - text: "«الدعابة: بالضم، اسم لما يستملح من المزاح.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الدعابة) اللّعب والممازحة والحمق»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«المُداعَبةُ والمِزَاحُ اللَّعِبُ»"
          source: "المعجم الكبير"
        - text: "«أَنَّه ـ صلى الله عليه وسلم ـ كان فيه دُعابةٌ»"
          source: "المعجم الكبير (شاهد حديثي)"
        - text: "«دُعابة: هزل يَصْطَنع الغفلة للتسلية الخفيفة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(الدعابة) الدُّعاب»"
          source: "المعجم الوسيط"
          addition: "الدُّعابة اسم مصدر للدُّعاب"
        - text: "«كان فيه صلى الله عليه وسلم دعابة أي مزاح»"
          source: "مجمع بحار الأنوار للفَتِّنيّ"
          addition: "توثيق الاستعمال النبوي للّفظ"

    - lemma: "ظَرْف"
      confirm:
        - text: "«الظَرْفُ: الوعاءُ... والكِياسة... أو البزَاعَةُ وذَكاءُ القَلْبِ، أو الحِذْقُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الظَّرْفُ: اجْتِمَاع عَامَّة الْفَضَائِل النفسية، والبدنية، والخارجية.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«ظَرْف؛ دُعابة مهذَّبة [اشتهر بها الأثينيون].»"
          source: "المورد الحديث (2008) — مقابل Attic wit"
        - text: "«براعة؛ ذَكاء؛ ظَرْف إلخ.»"
          source: "المورد الحديث (2008) — مقابل wittiness"
      contradicts:
        - text: "«الظَّرْفُ: المستقر، ما العامل فيه مقدرا نحو زيد في الدار.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "معنى نحوي (ظرف الزمان والمكان) لا علاقة له بالفكاهة"
      expands:
        - text: "«أو هو حُسْنُ الوَجْهِ والهَيْئَةِ، أو يكونُ في الوَجْهِ واللسانِ»"
          source: "القاموس المحيط"
          addition: "الظرف أشمل من الفكاهة: يشمل حسن الهيئة والبراعة اللسانية"

    - lemma: "فُكَاهَة"
      confirm:
        - text: "«الفكاهة: بالضم: المزاح لانبساط النفس به.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«المِزاحُ ما يُتمتَّع به من طُرَفِ الكلام»"
          source: "المعجم الوسيط"
        - text: "«حالة مُضْحكة في العمل الأدبي، وهي عَيْب أو تشويه عند أرسطو، واستهزاء لاكتشاف نقطة ضعف المواقف.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«موقف هزلي يعتمد على المفاجأة فيثير الضحك»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"

    - lemma: "نُكْتَة"
      confirm:
        - text: "«النكتة: مسألة لطيفة أخرجت بدقة نظر وإمعان فكر.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الفكرة اللطيفة المؤثِّرة فى النفس المسألة العِلميَّة الدَّقيقة يتوصَّل إليها بدقَّة وإِنعَام فِكْر»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«[في الانكليزية] Joke, anecdote, witticism... هي الدقيقة وجمعها النّكت»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "النكتة في الاستعمال المعاصر تخصّصت بمعنى joke (النادرة المضحكة القصيرة) وهو أخصّ من المجموعة"

    - lemma: "مُلْحَة"
      confirm:
        - text: "«الكلمة المليحة»"
          source: "المعجم الوسيط"
        - text: "«مُلْحة؛ لطيفة؛ نكتة؛ ملاحظة ساخرة.»"
          source: "المورد الحديث (2008) — مقابل witticism"
        - text: "«الطرفة والحديث الطيب.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(الملحة) الزرقة الشَّدِيدَة وَالْبركَة والكلمة المليحة (ج) ملح يُقَال حدثته بالملح»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الجمع مُلَح يُستعمل بمعنى الطرائف والنوادر المستملحة"

    - lemma: "طُرْفَة"
      contradicts:
        - text: "«نقطة حمراء من الدَّم تحدث في الْعين من ضَرْبَة أَو غَيرهَا»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأوّل طبّي (إصابة العين) لا علاقة له بالفكاهة"
      expands:
        - text: "«كلُّ شيء مستحدثٍ عجيب»"
          source: "المعجم الوسيط"
          addition: "المعنى الثاني عامّ (الشيء المستحدَث العجيب) وليس مختصّاً بالإضحاك"

    - lemma: "هَزْل"
      confirm:
        - text: "«الهزل: لغة المزح. وعرفا: أن لا يراد باللفظ معناه لا الحقيقي، ولا المجازي، وهو ضد الجد.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الهَزْلُ: نَقِيضُ الجِدِّ... والهُزالَةُ: الفُكاهةُ. والهُزالُ، بالضم: نقيضُ السِّمَنِ.»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الهزل يدلّ على ضعف عامّ (ضدّ الجدّ + ضدّ السِّمَن)، وهو أعمّ من رسالة بارعة تُضحِك"
        - text: "«الْهَاءُ وَالزَّاءُ وَاللَّامُ كَلِمَتَانِ فِي قِيَاسٍ وَاحِدٍ، يَدُلَّانِ عَلَى ضَعْفٍ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المادة تدلّ على الضعف لا على البراعة اللفظية المطلوبة في التعريف"

