        حالة الجفاف التام وانعدام الثمر، بنيةٌ صرفية قياسية كالصُّعُوبَة والوُضُوح.
    - lemma: "إِجْدَاب"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل أجدبَ على وزن إفعال، يدلّ على حصول الجدب وانعدام الإنتاج؛
        يفيد الحدث والنتيجة معاً على عكس جَدْب الذي هو الصفة الراسخة.

  # التقييم الأولي بعد الاطلاع على المجموعة الكاملة
  assessment:
