# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── جَدْب ────────────────────────────────────────────────
    - lemma: "جَدْب"
      decision: confirmed
      decision_reason: >
        لفظٌ فصيح راسخ في التراث العربي يدلّ على قلة الشيء وانعدام الخصب.
        الأدلة المعجمية تؤكد استعماله بالمعنى المادي والمجازي معاً (جدب الأرض،
        جدب القلوب). الجذر جدب ينطوي على دلالة "القلة" (مقاييس) مما يجعله
        صالحاً لصفة عدم الإنتاج. مقبول صرفياً: مصدر قياسي على فَعْل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز الجانب المادي الحسّي لانعدام الإنتاج — مأخوذ من صورة الأرض
        الجدباء والقحط؛ يستحضر غياب الثمار والنبات والمحصول تحديداً،
        بخلاف عُقْم الذي يمتد إلى البعد الذاتي والجوهري.

    # ── عُقْم ────────────────────────────────────────────────
    - lemma: "عُقْم"
      decision: confirmed
      decision_reason: >
        لفظٌ كلاسيكي معتمد في المعاجم الحديثة (الوسيط، الكبير) ويحمل أصلاً
        دلالة "اليُبس المانع من قبول الأثر" (التوقيف). مقاييس ابن فارس
        يوثّق التوسع المجازي: "عقل عقيم"، "الدنيا عقيم: لا ترد على صاحبها خيرًا"،
        "الريح العقيم"؛ وهذه الشواهد تطابق تماماً "صفة عدم إنتاج شيء ذي قيمة".
        تشكيل صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على القصور الجوهري والذاتي في طاقة الإنتاج — سواء أكانت
        بيولوجية أم فكرية أم إبداعية؛ الأثقل دلالةً من جَدْب، ويستحضر
        انعدام القدرة الباطنية على الإثمار لا مجرد غياب الظروف الملائمة.

    # ── لَا جَدْوَى ─────────────────────────────────────────
    - lemma: "لَا جَدْوَى"
      decision: confirmed
      decision_reason: >
        تعبيرٌ مركّب ثابت في الاستعمال العربي موثَّق في المعاجم الحديثة
        كترجمة لـ futility وكتعبير مصطلحي مستقل ("لا جدوى منه"، "بلا جدوى").
        يُستعمل اسماً وظرفاً، وقد يتصدّر الجملة بوظيفة اسمية. الجذر جدوى
        يعني النفع والعطاء الوافر؛ فنفيه يُعبّر عن انعدام النفع كلياً،
        وهو جانب من أجوانب المفهوم تكمّل اللمّتين الأخريين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز منظور النتيجة والمردود — انتفاء النفع والجدوى من الفعل أو
        المسعى؛ أكثر إجرائية من جَدْب وعُقْم اللذَين يصفان الحالة الذاتية.
        يُستخدم في السياقات التي يُراد فيها التأكيد على عدم المردود العملي.
      actions:
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "لَا جَدْوَى مِنْهُ"

    # ── عَقَامَة (مرشح مرفوض) ───────────────────────────────
    - lemma: "عَقَامَة"
      source: stage1
      decision: removed
      decision_reason: >
        في المعجمية العربية الحديثة استُقرّ مصطلح عَقَامَة بمعنى "تعقيم"
        (asepsis/sterilization) في المجالات الطبية والنسيجية؛ وهو معنى تقني
        مباين لمعنى المجموعة. فضلاً عن ذلك فإن إدراجها سيُحدث تداخلاً مع
        مجموعات ترادفية أخرى في المجال الطبي.

    # ── بَوَار (مرشح مرفوض) ────────────────────────────────
    - lemma: "بَوَار"
      source: stage1
      decision: removed
      decision_reason: >
        بَوَار يدلّ أصالةً على الهلاك والكساد وخلوّ الأرض من الزرع؛ المعجم
        الوسيط يقصره على "الأرض التي لم تزرع"، والمعجم الكبير يضيف "دار البوار:
        دار الهلاك". الدلالة مرتبطة بالهلاك لا بصفة عدم الإنتاج المجردة،
        مما يُضيّق نطاقه ويُبعده عن قصد المجموعة.

    # ── قُحُولَة (مرشح مرفوض) ──────────────────────────────
    - lemma: "قُحُولَة"
      source: stage1
      decision: removed
      decision_reason: >
        قُحُولَة مصطلح تقني خاص في الأرصاد الجوية والجغرافيا المناخية يُعبّر
        عن جفاف المناخ بمعادلة رياضية (نسبة التبخر إلى الأمطار). استقراره
        التقني في هذا المجال الضيق يجعل إدراجه في مجموعة ترادفية عامة مضلِّلاً.

    # ── إِجْدَاب (مرشح مرفوض) ──────────────────────────────
    - lemma: "إِجْدَاب"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود مُثبَت لـ"إِجْدَاب" كاسم جامد في المعجمية العربية؛ الفعل
        أجدبَ موجودٌ لكن مصدره بمعنى حصول الجدب للمكان (فعل متعدٍّ وصفة
        للأرض)، وليس صفةً مجردة للنوع المطلوب. لا مادة معجمية تدعم قبوله.


