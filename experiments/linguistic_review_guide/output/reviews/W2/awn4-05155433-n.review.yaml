      - >
        لَا جَدْوَى: تعبيرٌ مركّب من لا النافية للجنس + جَدْوَى، يؤدي وظيفة اسمية
        وظرفية معاً. تضمينه في مجموعة أسماء (n) يستوجب توثيق وظيفته النحوية
        الاسمية صراحةً.
      - >
        جَدْب وعُقْم متقاربان جداً في الدلالة داخل المجموعة، وغياب التمييز الدقيق
        بينهما في البيانات الوصفية يُضعف فائدة وجودهما معاً.
      - >
        التعريف الحالي "صفة عدم إنتاج أي شيء ذي قيمة" ترجمةٌ حرفية من الإنجليزية
        تفتقر إلى الأسلوب المعجمي العربي الأصيل.
    observations: >
      تضمّ المجموعة ثلاث لمّات تغطي مفهوم "صفة عدم إنتاج أي شيء ذي قيمة" من زوايا
      مختلفة: جَدْب يستحضر صورة القحط وجفاف الأرض، وعُقْم يستحضر العقر البيولوجي
      الممتدّ مجازاً إلى الفكر والعمل، ولَا جَدْوَى يُعبّر عن منظور النتيجة
      (انعدام النفع). جميعها ألفاظٌ فصيحة راسخة في التراث العربي، تتكامل لتصوير
      الفراغ من القيمة والإنتاج.


