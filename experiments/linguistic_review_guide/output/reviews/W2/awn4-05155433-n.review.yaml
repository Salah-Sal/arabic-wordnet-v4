        وَضِيقٍ وَشِدَّةٍ... وَمِنَ الْبَابِ عَقِمَتِ الرَّحِمُ عُقْمًا، وَذَلِكَ
        هَزْمَةٌ تَقَعُ فِي الرَّحِمِ فَلَا تَقْبَلُ الْوَلَدَ. وَالدُّنْيَا
