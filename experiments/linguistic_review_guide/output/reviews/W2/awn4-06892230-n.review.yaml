# ── المرحلة ١: المراجعة والتوليد (أعمى — بدون الاطلاع على اللمّات) ──

stage1_review:
  assessment:
    concerns:
      - "اللمّتان كلتاهما مركّبتان (MWE)، ولا يوجد في المجموعة مصطلح مفرد يغطّي المعنى"
      - "التعريف العربي الحالي فيه دوران: يستخدم «عرض» في التعريف بينما «عرض توضيحي» هي إحدى اللمّات"
      - "لمّة «عرض توضيحي» غير موثّقة في المعاجم العربية المُعتمدة (ARABTERM وغيرها) كمصطلح مُسكوك ثابت، بخلاف «عرض عملي» المُوثَّق"
      - "غياب التشكيل الكامل عن كلتا اللمّتين الموجودتَين"
    observations: >
      المفهوم هو «عرض مرئي يُبيّن آلية عمل شيء» أي ما يُعرف بالإنجليزية بـ demonstration. هذا نمط
      تواصلي يجمع الإيضاح البصري والتطبيق الحيّ. الأصيل في العربية أن يُصاغ هذا المفهوم إمّا
      بمصدر واحد من الجذور الدالّة على الإظهار والكشف (كالجذر و-ض-ح أو ب-ي-ن)، أو بمركّب
      وصفي يجمع المفهومَين. الفرع الأبوي «اتصال مرئي» يُحدّد السياق البصري بدقة.
      لمّة «بيان عملي» موثّقة ومشهورة في المصطلحيّة العربية التطبيقية، وهي أقوى اللمّتَين
      ارتكازاً معجمياً.

  blind_candidates:
    - lemma: "تِبْيَانٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر ب-ي-ن على وزن تِفْعَال، وهو صيغة تدل على الكمال والاستيفاء في الإيضاح.
        البَيَان الكامل يكشف كيفية عمل شيء؛ وقد ورد التِّبيان قديماً بمعنى الإيضاح التام.
    - lemma: "جَلْوَةٌ"
      generation_method: majaz
      justification: >
        من جذر ج-ل-و، يدل على الكشف والإظهار والإبراز. «جَلَا الشيءَ» أي كشف عنه وأبداه.
        بالمجاز الإزاحي: الجلوة هي إبراز ماهية الشيء وكشف حقيقته أمام الناظر؛ وهو جوهر
        الـ demonstration. إحياء لفظ ميت في المعجم الكلاسيكي.
    - lemma: "عَرْضٌ إِيضَاحِيّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي (إضافة نعتية): «عَرْض» (الاسم الجنس) + «إِيضَاحِيّ» (النعت المحدِّد).
        الإيضاحي يختلف عن التوضيحي بكونه أشد ارتباطاً بمفهوم الـ clarification الوظيفي.
    - lemma: "إِظْهَارٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر ظ-ه-ر على وزن إِفْعَال، ويعني «جَعْل الشيء ظاهراً بارزاً مكشوفاً».
        الـ demonstration في جوهره إظهارٌ مرئيٌّ لآلية عمل شيء. الصيغة الفعلية «يُظهِر»
        هي أحد الترجمات المُعتمدة لـ demonstrate في المعجمية الحديثة.


# ── المرحلة ٢: جمع الأدلة (استعلامات قاعدة البيانات) ──

stage2_evidence:
  query_log:
