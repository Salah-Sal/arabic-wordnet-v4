# ── المرحلة ٣: التحليل اللغوي للمّات ──

stage3_analysis:
  per_lemma:

    - lemma: "بيان عملي"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في ARABTERM (المعجم الموحد لمصطلحات الكيمياء 1992) بالترجمة
        demonstration، وهي مركّب وصفي سليم ومنتِج في المصطلحية العربية. الجذر بين
        يحمل دلالة الكشف والإيضاح الجوهرية. لكنها تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز الجانبَ التفسيري/المنهجي — كأنه يشرح المبدأ النظري تطبيقياً.
        «البيان» يحمل أثراً خطابياً وتعليمياً: يُبيَّن الشيء أي يُكشَف ويُوضَّح.
        يُفضَّل في السياقات العلمية والتعليمية التي تُركِّز على الشرح المنهجي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَيَانٌ عَمَلِيّ"

    - lemma: "عرض توضيحي"
      decision: confirmed
      decision_reason: >
        مركّب وصفي سليم فصيح، شائع في المعاجم التربوية والإعلامية العربية، حتى وإن لم
        يُوثَّق كمصطلح مُسكوك في قواعد البيانات المستعلَمة. الأقرب إليه في ARABTERM هو
        «عرض عملي» (entry_id=730970) لكن الاثنين يمثّلان فروقاً دلالية معتبرة تستدعي
        الإبقاء على كليهما كلمّتَين مستقلّتَين. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز الجانبَ البصري/التوضيحي — الأداة البصرية التي تجعل المفهوم مرئياً.
        «التوضيحي» يوحي بأن الغرض تبديد الغموض وتوضيح ما كان مبهماً.
        يُفضَّل في السياقات البصرية والتقنية التي تُركِّز على مشاهدة آلية العمل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرْضٌ تَوْضِيحِيّ"

    - lemma: "تِبْيَان"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الموثّقة في معجم المعلوماتية تختص بالنسخ التجريبية من البرمجيات (demo version)،
        لا بالعرض المرئي التوضيحي العام. الدلالة الكلاسيكية تتعلق بالإيضاح الخطابي اللغوي،
        لا بالعرض البصري التطبيقي. الفجوة بين الدلالة المعجمية المُوثَّقة والمفهوم المستهدف
        تحول دون إدراجه في هذه المجموعة.

    - lemma: "جَلْوَة"
      source: stage1
      decision: removed
      decision_reason: >
        جميع الشواهد المعجمية تُحدّد دلالة «جلوة» في: عطية الزوج للعروس يوم الزفاف،
        والمصطلح الصوفي (ضد الخلوة). لا شاهد واحد يدعم توظيفها في حقل «العرض المرئي
        التوضيحي»، ومحاولة إحياء المجاز الإزاحي هنا لن تكون مُتقبَّلة في الاستخدام المعاصر.

    - lemma: "عَرْضٌ إِيضَاحِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوثَّق كمصطلح مُسكوك في أيّ من القواعد المستعلَمة. فضلاً عن ذلك، الإبقاء
        على «عرض توضيحي» يكفي لتمثيل هذه البنية الوصفية؛ وإضافة «عرض إيضاحي» سيكون
        ترادفاً مطلقاً لا مبرر دلالياً له.

    - lemma: "إِظْهَار"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المصطلحية السائدة لـ «إظهار» في المعجمية العربية هي المصطلح التجويدي
        (نطق الحرف واضحاً). وأما الدلالة العامة (making visible/apparent) فلا تحمل
        التخصص الكافي لتمثيل «العرض المرئي الذي يوضّح كيفية عمل شيء» بخلاف إيضاح
        وبيان عملي التي تحمل هذا التخصص بشكل أوضح.


# ── المرحلة ٤: التعريف والأمثلة ──

stage4_content:
  definition:
    current: "عرض مرئي يوضح كيفية عمل شيء ما"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي فيه دوران: يستخدم «عرض» في التعريف بينما «عرض توضيحي» إحدى
        اللمّات. كما أن «كيفية عمل شيء ما» صياغة وصفية غير رسمية. التعريف لا يُميّز
        هذا المفهوم عن الرسم التوضيحي (illustration) أو البرهان المنطقي (demonstration
        بمعنى إثبات). يجب صياغة تعريف مصطلحي بجنس قريب وفصل نوعي واضح.
