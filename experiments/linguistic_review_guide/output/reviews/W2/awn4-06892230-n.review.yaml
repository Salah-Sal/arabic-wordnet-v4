      description: "جلب دفعي لجميع اللمّات (الموجودة + المرشحات) من headword_norm"
      terms_searched:
        - "بيان عملي / البيان العملي"
        - "عرض توضيحي / العرض التوضيحي"
        - "تبيان / التبيان"
        - "جلوة / الجلوة"
        - "عرض ايضاحي / العرض الايضاحي"
        - "اظهار / الاظهار"
        - "بيان / البيان"
        - "عرض / العرض"
        - "توضيح / التوضيح"
        - "ايضاح / الايضاح"
    - query_index: 2
      description: "جسر إنجليزي لـ demonstration / demo"
    - query_index: 3
      description: "بحث مباشر headword_norm لـ عرض توضيحي / عرض عملي / إيضاح"
    - query_index: 4
      description: "FTS عربي بالكلمات المفتاحية: عرض مرئي، يوضح، بيان عملي، عرض عملي"
    - query_index: 5
      description: "مقاييس اللغة لابن فارس (dictionary_id=151): بين، عرض، ظهر، وضح"
    - query_index: 6
