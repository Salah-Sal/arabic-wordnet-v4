    - lemma: "بيان عملي"
      confirm:
        - text: "«بيان عملي» (headword) — translation_en: demonstration"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — ALECSO ARABTERM، entry_id=426399"
      expands:
        - text: >
            «(1) إظهار؛ إبداء... (3) شرح؛ إيضاح [من طريق الاستعانة بالأمثلة أو التجارب]
            (4) إظهار محاسن السِّلعة [للزبون]... (6) مُظاهَرة؛ مَسِيرة»
          source: "المورد الحديث (2008) — entry_id=682676، translation_en: demonstration"
          addition: >
            يُثبت أن لـ demonstration طيفاً واسعاً من المعاني العربية؛ الحقل الدلالي الأقرب
            لمجموعتنا هو المعنى الثالث: شرح وإيضاح بالأمثلة والتجارب.
        - text: >
            «يُظهِر [بوضوح]؛ يُبدي... يشرح؛ يوضح [وبخاصة من طريق الاستعانة بأمثلة كثيرة]...
            يُعلِّم مستعيناً بالأمثلة والتجارب وما إليها»
          source: "المورد الحديث (2008) — entry_id=682675، translation_en: demonstrate (فعل)"
          addition: >
            الفعل «demonstrate» يُترجَم عربياً بـ يُظهِر/يشرح/يوضح، مما يؤكد أن الحقل الدلالي
            المركزي للمجموعة هو الإيضاح المرئي التطبيقي.

    - lemma: "عرض توضيحي"
      expands:
        - text: "«عَرْضٌ عَمَلِيٌّ» — translation_en: demonstration"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020) — entry_id=730970"
          addition: >
            الصيغة المُوثَّقة في ARABTERM هي «عرض عملي» لا «عرض توضيحي». مع ذلك فإن «عرض
            توضيحي» مركّب وصفي سليم نحوياً ومستخدم في الأدبيات العربية المعاصرة.
        - text: "«عَرْضٌ عَمَلِيٌّ اكْتِشَافِيٌّ» — translation_en: demonstration discovery"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020) — entry_id=730971"
          addition: "يُثبت إنتاجية قالب «عرض + نعت» في المصطلحية التربوية العربية."
      evidence_status: "no_material_found_as_exact_compound"

    - lemma: "تِبْيَان"
      confirm:
        - text: >
            «1 [عيّنة] تبيان ؛ 2 [عينة] تبيان — مختصر: demonstration. إصدارٌ جزئيٌّ أو محدودٌ
            لحزمةٍ برمجية توزَّع مجاناً بغيةَ تحصيل الإعلان عنها. تتألّفُ عيناتُ التبيان غالباً
            من عروضٍ متحركة تَصِفُ وتُبيِّن إمكانات البرنامج»
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM، entry_id=534363، translation_en: demo"
      contradicts:
        - text: >
            «التبيان: كيفية ترتيب الكلام في كشف ما تريد من تفهيم المعاني وآدائها»
          source: "التوقيف على مهمات التعاريف للمناوي — entry_id=813183"
          conflict: >
            الدلالة الكلاسيكية تتعلق بالإيضاح اللغوي/الخطابي لا بالعرض المرئي التطبيقي؛
            والدلالة المعلوماتية الحديثة تختص بالنسخ التجريبية من البرمجيات (demo version)
            لا بالعروض التوضيحية.

    - lemma: "جَلْوَة"
      contradicts:
        - text: "«الجَلْوَة: ما يُعطيها زوجها وقت الجَلْوَة» [جلوة العروس]"
          source: "المعجم الوسيط — entry_id=4472 (OCR)"
          conflict: "الدلالة الأساسية عطية الزوج عند الزفاف، لا صلة لها بالعرض المرئي."
        - text: >
            «الجِلْوَة: ما يُعطي الزوجُ عروسَه... (عند الصوفية): ضِدُّ الخَلوة»
          source: "المعجم الكبير — entry_id=73067 (OCR)"
          conflict: >
            الدلالتان الموثقتان: عطية الزفاف، والمصطلح الصوفي (ضد الخلوة). لا أيّ دلالة
            تقترب من «عرض مرئي يوضح كيفية عمل شيء».
        - text: >
            «الجلوة: خروج العبد من الخلوة بالنعوت الإلهية إذ عين العبد وأعضاؤه ممحوة عن الأنانية
            والأعضاء مضافة إلى الحق»
          source: "كتاب التعريفات للجرجاني — entry_id=794874"
          conflict: "مصطلح صوفي خالص، لا علاقة له بالمفهوم المستهدف."

    - lemma: "عَرْضٌ إِيضَاحِيّ"
      evidence_status: "no_material_found"

    - lemma: "إِظْهَار"
      contradicts:
        - text: >
            «الإظهار: [في الانكليزية] Discontraction — هو عند الصرفيين والقرّاء خلاف الإدغام
            أي فكّه وتركه ويُسمّى بالبيان أيضاً»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي — entry_id=818790"
