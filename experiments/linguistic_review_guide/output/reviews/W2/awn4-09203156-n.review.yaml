# ── المرحلة ١: المراجعة والتوليد (أعمى — بدون أدلة) ───────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين مركَّبتان وصفيَّتان حرَّتان لا تجتازان اختبار السكّ: يمكن إبدال 'دافع' بـ'باعث' أو 'حافز' وتبقى العبارة صالحة وصفاً، مما يكشف أنهما ليستا وحدتَيْن معجميَّتَيْن مثبَّتتَيْن."
      - "اللمَّتان متداخلتان دلالياً تداخلاً شبه تام: 'غير عقلاني' و'لا منطقي' يحيلان إلى الدلالة ذاتها تقريباً دون أن يُوثَّق بينهما فرق نوعي واضح في السياق المعجمي."
      - "التعريف الحالي 'دافع يتعارض مع العقل أو المنطق' يكاد يكون مرادفاً حرفياً لللمّتين لا تعريفاً مستقلاً، مما يُفضي إلى دوران مفاهيمي."
      - "غياب التشكيل الكامل عن اللمَّتين."
      - "المجموعة تفتقر إلى ألفاظ تراثية عربية راسخة؛ ومفهوم الدافع اللاعقلاني حاضر بقوة في الموروث العربي الإسلامي (الهوى، النزوة، الوسواس) وإغفاله يُضعف التمثيل المعجمي."
    observations: >
      المجموعة الترادفية تُعنى بمفهوم نفسي محوري هو الباعث الصادر عن الهوى والنزوة لا عن الحكم العقلي.
      وهذا المفهوم بالذات يحتلُّ مكانةً مركزيةً في الفلسفة الإسلامية والأخلاق العربية القديمة، إذ يقف
      الهوى في مقابل العقل في أعمال الراغب الأصفهاني والجرجاني وابن فارس وسواهم. غير أن اللمَّتين
      الحاليتَيْن لم تنتهجا مسار التراث، بل انتهجتا مسار الترجمة الوصفية المباشرة لـ"irrational motive".
      ويُلاحَظ كذلك أن "دافع" في المعجم الكبير يُفرَّق بينه وبين "الباعث" (الداخلي مقابل ما قد يكون خارجياً)،
      وهو تمييز ذو قيمة معجمية.

  blind_candidates:
    - lemma: "الهَوَى"
      generation_method: majaz
      justification: >
        لفظ عربي كلاسيكي راسخ منذ العصر الجاهلي؛ يعني ميل النفس إلى الشهوة والتشوّق إليها بغير سند من
        العقل أو الشرع. استُعمل في القرآن الكريم مقابلاً للوحي والعقل: ﴿وَمَا يَنطِقُ عَنِ الهَوَى﴾،
        وفي قوله: ﴿وَلَا تَتَّبِعِ الهَوَى فَيُضِلَّكَ عَن سَبِيلِ اللَّهِ﴾. يُجسّد الهوى دلالياً
        الباعث النفسي الخالي من التأسيس العقلي. إحياء لفظ تراثي بإزاحة دلالية طفيفة نحو السياق
        النفسي التقني الحديث.

    - lemma: "النَّزْوَة"
      generation_method: majaz
      justification: >
        من الجذر (ن ز و) بمعنى الوثبان والانطلاق المفاجئ؛ تعني في أصلها اللغوي الحدَّة والسورة
        الفجائية. تُوظَّف في معاجم علم النفس الحديث مقابلاً دقيقاً لـ"caprice" و"whim"، وهي تحيل
        تحديداً إلى الباعث الآني الطارئ غير المتأمَّل. صِيغتها على وزن فَعْلَة الدالة على المرة
        الواحدة تُبرز طابع الحدث الانفجاري المباغت. إحياء لفظ تراثي بتطبيق اصطلاحي في علم النفس.

    - lemma: "السَّفَاهَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (س ف ه) على وزن فَعَالَة المنتج لأسماء الصفات المجردة؛ يدل الجذر في مقاييس اللغة
        على الخفة والسخافة. السفاهة خفة الرأي وضعف الوازع العقلي، وهي بالتالي الحالة الباعثة التي
        تدفع صاحبها إلى أفعال لاعقلانية. تُسجَّل في معجم مقاليد العلوم وغيره بمعنى التسرع في القول
        والفعل دون رويَّة عقلية.

    - lemma: "حَافِزُ الهَوَى"
      generation_method: tarkib
      justification: >
        مركَّب إضافي (idafi) من "حافز" (المحرك النفسي الداخلي، راجع المعجم الكبير) و"الهوى" (الباعث
        الشهواني اللاعقلاني). الإضافة تُخصّص نوع الحافز وتربطه بالميل الشهواني لا بالتأمل العقلي.
        يُشبه مصطلحات التراكيب الإضافية النفسية كـ"وسواس القهر" و"دوافع البقاء".


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# ميزانية الاستعلامات المستخدمة: ٦ استعلامات
