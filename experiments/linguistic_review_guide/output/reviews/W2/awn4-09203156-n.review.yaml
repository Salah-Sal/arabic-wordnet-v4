            ﴿وَمَا يَنطِقُ عَنِ الْهَوَى﴾»
          source: "مقاييس اللغة لابن فارس، باب هـ و ي (entry 989467)"
          addition: "يكشف ابن فارس أن الهوى مشتق من الخلو والسقوط، مما يُعمّق دلالة اللاعقلانية: الهوى فراغ من كل خير."
