      decision: confirmed
      decision_reason: >
        تُبقى هذه اللمَّة بوصفها المصطلح الوصفي التقني المألوف في الكتابة النفسية والتعليمية العربية
        الحديثة، ويُستدل على شيوعه من مسرد التربية والمعجم الكبير. ورغم أنها لا تجتاز اختبار
        التثبيت المعجمي الصارم (مرفوضة كوحدة معجمية ثابتة) فإنها تؤدي وظيفة الواصف الشفاف
        للمفهوم في سياقات الاستخدام الأكاديمي الحديث، وتضمن قابلية الاسترجاع في محركات البحث.
        تُحتفظ بها على أن تُحرَّك تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
