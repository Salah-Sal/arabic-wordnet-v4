        (ArabTerm) إلى أن المصطلح المُستقرّ لـirrational في هذا الحقل هو 'لا معقول' لا 'لا منطقي'.
        حذفها يُنظِّف المجموعة من الترادف الحشوي ويُفسح المجال للألفاظ الكلاسيكية الأصيلة.
