stage2_evidence:
  per_lemma:
    - lemma: "دافع غير عقلاني"
      expands:
        - text: >
            «(في الفلسفة) mobile: الداعي, وماله يختار القادرُ الفعلَ. وهو العاملُ الخاصُّ بالإنسانِ
            والمَوْقِفِ. وقد اصطُلِحَ على إطلاق الدافع على الإثارة الداخلية الصادرة من داخل الكائن
            الحي، مقابل "الباعث" الخارجي.»
          source: "المعجم الكبير، مجمع اللغة العربية (entry 87981)"
          addition: "يُميّز المعجم الكبير بين الدافع الداخلي والباعث الخارجي، مما يعني أن 'دافع' أدق تقنياً في المجموعة الحالية."
        - text: >
            «(1) «أ» غير عاقل irrational animals. «ب» يُعوِزهُ التفكير السليم... «ج» لاعقلانيّ؛
            غير منطقيّ ألبتّة irrational fears»
          source: "المورد الحديث (2008)، عند مدخل irrational (entry 696159)"
          addition: "يُجيز المورد الحديث كِلا الصيغتَيْن: 'لاعقلاني' و'غير منطقي' كترجمتَيْن متوازيتَيْن لـirrational."
        - text: >
            «حالة داخلية جسمية أو نفسية تدفع الفرد نحو سلوك في ظروف معينة وتوجهه نحو إشباع حاجة
            أو هدف محدد؛ أي أنها قوة محركة منشِّطة.»
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (entry 398902)"
          addition: "يُعرِّف مسرد التربية الدافعَ تعريفاً عاماً بوصفه قوةً محرِّكة باتجاه هدف، دون التنصيص على العقلانية أو اللاعقلانية."

