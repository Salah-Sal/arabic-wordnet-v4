          source: "مسرد الفلسفة وعلم النفس، موقع ArabTerm (entry 489866)، عند مدخل irrational"
          addition: "يُشير إلى أن المصطلح النفسي الفلسفي المُستقرّ لـirrational هو 'لا معقول' لا 'لا منطقي'، وهو تمييز وثيق الصلة بدقة اللمّة."

    - lemma: "الهَوَى"
