stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي جيد ولكنه يمكن أن يكون أكثر دقة وشمولية من الناحية المصطلحية الجغرافية."
      - "اللمّات الموجودة تفتقر إلى التشكيل."
    observations: "تتضمن المجموعة اللمّة «بولدر» وهي تعريب مباشر للمصطلح الهولندي/الإنجليزي (Polder)، وهو مصطلح عالمي معتمد في الهندسة المائية والجغرافيا. أما «أرض مستصلحة» فهو تركيب وصفي يعبر عن المفهوم باللغة العربية وإن كان ذو دلالة أعم."
  blind_candidates:
    - lemma: "أَرْض مُسْتَصْلَحَة"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر بدقة عن طبيعة هذه الأراضي التي استُصلحت من البحر أو المستنقعات."
    - lemma: "مُسْتَصْلَحَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول يُستخدم كاسم للإشارة إلى الأراضي التي خضعت لعملية الاستصلاح."
    - lemma: "بُولْدَر"
      generation_method: taarib
      justification: "تعريب للمصطلح الهولندي/الإنجليزي وهو مصطلح عالمي يُستخدم في الجغرافيا والهندسة المائية لوصف هذا النوع من الأراضي."
    - lemma: "أَرْض مَحْجُوزَة"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن الأرض التي حُجزت مياهها بالسدود لتجفيفها."

stage2_evidence:
  per_lemma:
    - lemma: "أرض مستصلحة"
      confirm:
        - text: "«أراضٍ مستصلحةٌ»"
          source: "مسرد الجغرافيا والتاريخ (موقع ArabTerm)"
        - text: "«البَلْدَر: أرض منخفضة مُستَصلَحة من البحر.»"
          source: "المورد الحديث (2008)"
    - lemma: "بولدر"
      confirm:
        - text: "«منخفض (بولدر) التسرب الراجع: الأراضي المُحاطة بحاجز تجميع المياه المُتسرّبة عبر قاعدة الحاجز.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«البَلْدَر: أرض منخفضة مُستَصلَحة من البحر.»"
          source: "المورد الحديث (2008)"
    - lemma: "مُسْتَصْلَحَة"
      evidence_status: "no_material_found"
    - lemma: "أَرْض مَحْجُوزَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أرض مستصلحة"
      decision: confirmed
      decision_reason: "تركيب وصفي سليم ومستخدم للإشارة إلى الأراضي التي تم تجفيفها واستصلاحها، وهو يقابل المفهوم في غياب مصطلح عربي مفرد أدق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَرْض مُسْتَصْلَحَة"
    - lemma: "بولدر"
      decision: confirmed
      decision_reason: "تعريب دقيق ومعتمد في القواميس الهندسية والجغرافية الحديثة (Polder) للإشارة إلى هذا النوع الخاص من الأراضي المنخفضة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُولْدَر"
    - lemma: "مُسْتَصْلَحَة"
      source: stage1
      decision: removed
      decision_reason: "كلمة عامة جداً تحتاج إلى موصوف (أرض) لتوضيح دلالتها في هذا السياق."
    - lemma: "أَرْض مَحْجُوزَة"
      source: stage1
      decision: removed
      decision_reason: "غير شائعة الاستخدام كمصطلح مقارنة بـ «أرض مستصلحة»."

stage4_content:
  definition:
    current: "أرض منخفضة تم استصلاحها وحمايتها بالسدود (خاصة في هولندا)"
    assessment:
      decision: revise
      reason: "التعريف بحاجة إلى صياغة مصطلحية أمتن توضح طبيعة الاستصلاح (من المسطحات المائية) ونظام الحماية الهيدرولوجي."
    authored:
      - type: terminological
        text: "مساحة من الأراضي المنخفضة المُستصلحة من المسطحات المائية أو المستنقعات، تُحاط بسدود لحمايتها من الغمر المائي وتُزوَّد بنظام لتصريف المياه، وتشتهر بها هولندا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مساحة من الأراضي المنخفضة المُستصلحة من المسطحات المائية أو المستنقعات، تُحاط بسدود لحمايتها من الغمر المائي وتُزوَّد بنظام لتصريف المياه، وتشتهر بها هولندا."

  examples:
    per_lemma:
      - lemma: "أَرْض مُسْتَصْلَحَة"
        examples:
          - text: "تحولت المستنقعات الشاسعة إلى أراضٍ مستصلحة خصبة بفضل بناء السدود المنيعة."
            type: usage
      - lemma: "بُولْدَر"
        examples:
          - text: "تعتمد هولندا بشكل كبير على نظام البولدر لحماية أراضيها المنخفضة من زحف مياه البحر."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تحولت المستنقعات الشاسعة إلى أراضٍ مستصلحة خصبة بفضل بناء السدود المنيعة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تعتمد هولندا بشكل كبير على نظام البولدر لحماية أراضيها المنخفضة من زحف مياه البحر."

