  per_entry:
    - lemma: "أَرْض مُسْتَصْلَحَة"
      entry_id: "{auto}"
      roots:
        - word: "أرض"
          root: "ارض"
          maqayis_quote: "«(أَرَضَ) الْهَمْزَةُ وَالرَّاءُ وَالضَّادُ ثَلَاثَةُ أُصُولٍ... فَأَمَّا الْأَصْلُ الْأَوَّلُ فَكُلُّ شَيْءٍ يَسْفُلُ وَيُقَابِلُ السَّمَاءَ... وَالْأَرْضُ: الَّتِي نَحْنُ عَلَيْهَا»"
        - word: "مستصلحة"
          root: "صلح"
          maqayis_quote: "«(صَلَحَ) الصَّادُ وَاللَّامُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الْفَسَادِ.»"
