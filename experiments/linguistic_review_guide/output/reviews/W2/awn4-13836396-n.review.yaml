# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13836396-n (sisterhood/sistership)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «أُخُوَّة» مصحوبة بمحدِّد «(للإناث)» وهذا يشير إلى أنها ليست مصطلحاً مستقلاً بل لفظ عام مقيَّد بملاحظة، والأولى استخدام مصطلح يخصّ الأنوثة ذاتياً"
      - "المجموعة تحتوي لمّة واحدة فقط، وهي دون الحد الأدنى لمجموعة ترادفية فاعلة"
    observations: "المفهوم المستهدف هو علاقة القرابة من جهة الأنثى تحديداً (sisterhood) لا الأخوة العامة (brotherhood/siblinghood). في العربية لفظ «أُخُوَّة» يشمل الذكور والإناث معاً، فتخصيصه بالإناث يحتاج إما مقيِّداً أو مصطلحاً مشتقاً من «أُخْت». المصدر الصناعي «أُخْتِيَّة» خيار واعد."

  blind_candidates:
    - lemma: "أُخْتِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «أُخْت» على وزن فُعْلِيَّة، يدل على حالة كون المرأة أختاً أو على الرابطة بين الأخوات، وهو تخصيص دلالي للأنوثة لا يحتاج مقيِّداً خارجياً"
    - lemma: "أُخُوَّة"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر «أخو» على وزن فُعُولة، يدل على الصلة بين الإخوة عموماً، لكنه قابل للتخصيص بالسياق ليدل على علاقة الأنثى بإخوتها"
    - lemma: "رَابِطَةُ الأُخُوَّة"
      generation_method: tarkib
      justification: "مركب إضافي من «رابطة» و«أخوة»، يعبّر عن صلة القرابة بين الإخوة"
    - lemma: "صِلَةُ الأُخْتِ"
      generation_method: tarkib
      justification: "مركب إضافي من «صلة» و«أخت»، يخصّص العلاقة من جانب الأنثى"


stage2_evidence:
  per_lemma:
    - lemma: "أُخُوَّة"
      confirm:
        - text: "«الصلة بين الأخوين بالقرابة أو بالرضاعة أو بالصداقة»"
          source: "المعجم الكبير"
        - text: "«(1) أُخُوَّة (2) إخاء (3) أَخَوِيّة؛ رَهْبنة؛ منظَّمة؛ نقابةُ صُنّاع (4) أبناء المهنة الواحدة» (ترجمة brotherhood)"
          source: "المورد الحديث (2008)"
        - text: "«بينى وبينه أُخُوَّة»"
          source: "المعجم الكبير — شاهد استعمالي"
      expands:
        - text: "«كَسَوْنَا أُخُوَّتَنَا بِالصَّفـاء كما كُسِيَتْ بالكلام المعانى» (أبو فِراس)"
          source: "المعجم الكبير — شاهد شعري"
          addition: "اللفظ يُستعمل للدلالة على رابطة عامة بين الإخوة دون تخصيص بجنس"
        - text: "«أُخْوَة — الجذر: أ خ — الصواب والرتبة: أَيّها الأُخْوَة [فصيحة] — أَيّها الإِخْوَة [فصيحة] — وردت الكلمة في المعاجم بكسر الهمزة وضمها»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يجوز ضم الهمزة وكسرها في «أُخوة/إِخوة» وكلاهما فصيح"

    - lemma: "أُخْتِيَّة"
      confirm:
        - text: "«(1) الأُخْتِيّة: كون الفتاة أو المرأة أختًا (2) جماعة من الأخوات. وبخاصة: جمعية راهبات؛ رَهبنة نِسويّة» (ترجمة sisterhood)"
          source: "المورد الحديث (2008)"

    - lemma: "رَابِطَةُ الأُخُوَّة"
      evidence_status: "no_material_found"

    - lemma: "صِلَةُ الأُخْتِ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "أُخُوَّة"
      decision: confirmed
      decision_reason: "لفظ فصيح ثابت معجمياً يدل على صلة القرابة بين الإخوة. وإن كان عاماً يشمل الجنسين، فإن تقييده بالسياق «(للإناث)» مقبول في الشبكة الدلالية لتمييزه عن مجموعة brotherhood. يبقى التشكيل الحالي صحيحاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على صلة الأخوة العامة بين إخوة من أي جنس، ويُخصَّص هنا بمقيِّد «للإناث» للدلالة على علاقة الأنثى بإخوتها"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُخُوَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أُخْتِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي من «أُخت» مسجَّل في المورد الحديث بترجمة sisterhood تحديداً، ودلالته الأولى «كون الفتاة أو المرأة أختاً» تطابق مفهوم المجموعة. هذا اللفظ أدقّ من «أُخُوَّة» لأنه يخصّص الأنوثة ذاتياً دون حاجة إلى مقيِّد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل تحديداً على حالة كون الأنثى أختاً أو على الرابطة بين الأخوات، مقابل «أُخُوَّة» العام"
      actions:
        - command: create_entry
          params:
            lemma: "أُخْتِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رَابِطَةُ الأُخُوَّة"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ لم يُسجَّل في أي معجم كوحدة معجمية ثابتة. يمكن إبدال «رابطة» بـ«صلة» أو «علاقة» ويبقى صالحاً → يفشل في اختبار السكّ."

    - lemma: "صِلَةُ الأُخْتِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب إضافي وصفي حرّ غير مسكوك معجمياً، ويفشل في اختبار السكّ (يمكن إبدال «صلة» بـ«رابطة» أو «علاقة»)."


stage4_content:
  definition:
    current: "علاقة القرابة بين أنثى وإخوتها"
    assessment:
      decision: revise
      reason: "التعريف الحالي مختصر ويفتقر إلى الجنس القريب الدقيق. ينبغي توضيح أن المفهوم هو نوع من علاقة القرابة الأُسَرية مع تمييزه عن الأخوة العامة."
    authored:
      - type: terminological
        text: "صِلَةُ القَرَابَةِ الأُسَرِيَّةِ الَّتِي تَرْبِطُ الأُنْثَى بِإِخْوَتِهَا وَأَخَوَاتِهَا مِنْ جِهَةِ النَّسَبِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كَوْنُ الأُنْثَى أُخْتًا لِغَيْرِهَا مِنَ الإِخْوَة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صِلَةُ القَرَابَةِ الأُسَرِيَّةِ الَّتِي تَرْبِطُ الأُنْثَى بِإِخْوَتِهَا وَأَخَوَاتِهَا مِنْ جِهَةِ النَّسَبِ"

  examples:
    per_lemma:
      - lemma: "أُخُوَّة"
        examples:
          - text: "تجمعُ بين فاطمةَ وإخوتِها أُخُوَّةٌ وثيقةٌ تعودُ إلى نشأتِهم في بيتٍ واحد."
            type: usage
      - lemma: "أُخْتِيَّة"
        examples:
          - text: "أكَّدَ الباحثُ أنَّ الأُخْتِيَّةَ في المجتمعاتِ التقليديَّةِ تُرتِّبُ حقوقاً وواجباتٍ خاصَّةً بالإناث."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تجمعُ بين فاطمةَ وإخوتِها أُخُوَّةٌ وثيقةٌ تعودُ إلى نشأتِهم في بيتٍ واحد."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أكَّدَ الباحثُ أنَّ الأُخْتِيَّةَ في المجتمعاتِ التقليديَّةِ تُرتِّبُ حقوقاً وواجباتٍ خاصَّةً بالإناث."


