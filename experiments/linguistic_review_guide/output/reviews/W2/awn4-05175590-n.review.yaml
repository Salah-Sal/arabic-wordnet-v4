            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تتجلّى شرقيةُ هذه العمارة في الزخارف الهندسية المعقدة والأقواس المتشابكة التي تُميِّز مساجد القاهرة وأصفهان."
      - command: add_sense_example
