# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-05175590-n  |  ILI: i64139  |  POS: n
# المراجع: orientalism (الشرقية — الخاصية الوصفية)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "استشراق يحمل في المعجمية العربية الحديثة الدلالةَ الغالبة على الدراسة الأكاديمية الغربية للشرق (المعنى المؤسسي/النقدي كما عند إدوارد سعيد)، وهو ما يتعارض جوهرياً مع تعريف المجموعة المنصبّ على الصفات والعادات المميزة للحضارات الشرقية ذاتها"
      - "طابع شرقي عبارة وصفية حرة لا ترقى إلى مصطلح مسكوك: يجوز إحلال 'شرقي' بمشرقي أو آسيوي أو شرقاوي دون أن يتغيّر المعنى، مما يُخفِق في اختبار السكّ، ولم يرد في أي معجم كوحدة معجمية ثابتة"
      - "التعريف الحالي يستخدم 'الحضارات الآسيوية' وهو تعبير يُضيِّق نطاق المفهوم إلى آسيا الشرقية دون حضارات الشرق الأوسط والأدنى التي يشملها المصطلح عادةً"
      - "غياب لمّة عربية جوهرية مسكوكة ومتداولة تُعبِّر عن المعنى الوصفي المحدد (خاصية الكون شرقياً) بوصفه مفهوماً مستقلاً"
    observations: >
      المجموعة الترادفية تُعبِّر عن المعنى الوصفي الأول لـ orientalism: ما تتسِم به حضارات الشرق
      من صفات وعادات وأساليب تعبير مميِّزة. هذا المعنى غير المفهوم الأكاديمي-النقدي (الاستشراق
      بمعنى الدراسة الغربية للشرق). في العربية الحديثة يُستخدم مصدران صناعيان محتمَلان: الشرقية
      (نسبة إلى شرقيّ) والمشرقية (نسبة إلى مشرقيّ)، غير أن للثانية استخداماً فلسفياً راسخاً في
      حكمة الإشراق. يحتاج التعريف إلى تحرير من قيد 'الآسيوية' الضيّق، واللمّات إلى إعادة هيكلة
      جوهرية تُقصِي الاستشراق وتستبدله بالشرقية الوصفية الموثَّقة في المورد الحديث.

  blind_candidates:
    - lemma: "الشَّرْقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي قياسي مُشتَقّ من الصفة النسبية شرقيّ بإلحاق تاء النقل إلى المجرد، يدلّ على
        صفة الكون شرقياً ومجموع ما يُميِّز الحضارات الشرقية؛ على وزن: المدنيّة، الإنسانية،
        الوطنية. الاشتقاق من جذر شرق على الوزن الصناعي أنتج المصطلح المناسب للمفهوم المجرد.
    - lemma: "المَشْرَقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من النسبة إلى المشرق (بلاد المشرق العربي والفارسي)، يُركِّز على الحضارات
        الكلاسيكية للمشرق تحديداً بدلاً من آسيا الشرقية البعيدة؛ محاولة توسيع المرجعية الجغرافية
        مع الاشتقاق الاطّرادي.
    - lemma: "طِبَاعُ الشَّرْق"
      generation_method: tarkib
      justification: >
        مركب إضافي يجمع طِباع (جمع طَبْع بمعنى السجيّة والخُلُق الراسخ) والشرق، يُبرِز
        الجانب الخُلقي والسلوكي من المفهوم المحدد في التعريف (الصفات والسلوكيات المميِّزة).
    - lemma: "الطَّابَعُ الشَّرْقِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من طابع (الخاصيةُ المميِّزة والسِّمة الراسخة) وشرقيّ، يُعبِّر عن الطابع
        المخصوص بالحضارة الشرقية؛ طابع تدلّ على الختم والخاصية غير القابلة للمحو.


stage2_evidence:
  per_lemma:
    - lemma: "استشراق"
      confirm:
        - text: "«الاهتمامُ والعنايةُ بشؤونِ الشَّرقِ وثقافاتِهِ ولُغاتِهِ»"
          source: "المعجم الكبير — مجمع اللغة العربية بالقاهرة"
      contradicts:
        - text: "«توجّه غربي في دراسة الشرق عبر علاقة قوى تستلهم العجائبي والغرائبي في الرحلات والمذكرات وتوجهات الدراسات المقارنة التي اتخذت من الشرق موضوعاً لها، لاعتبارات ترتبط بالأمبراطوريات والاستعمار أو الفضول»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ALECSO"
          conflict: "يُقيِّد الاستشراق بالتوجه الأكاديمي الغربي ذي البُعد الاستعماري، لا بالصفات الذاتية للحضارة الشرقية؛ مما يجعله لمّةً لمفهومٍ مختلف"
        - text: "«(1) cap. أ.ك: الشَّرقية: سِمَةٌ أو عادةٌ أو طريقةُ تعبير مميّزةٌ لشعوب الشرق — (2) الاستشراق: الدراسة الأكاديميّة لثقافات الشَّرق ولغاتِهِ إلخ»"
          source: "المورد الحديث (2008)"
          conflict: >
            المعجم الثنائي الأكثر تداولاً يُفرِّق صراحةً بين معنيَيْ orientalism: يُسنِد الدلالة
            الوصفية (السمة والعادة المميِّزة) إلى الشرقية، ويُسنِد الدلالة الأكاديمية إلى الاستشراق.
            هذا يؤكد أن استشراق ليس المقابل المناسب لهذه المجموعة.

    - lemma: "طابع شرقي"
      evidence_status: "no_material_found"

    - lemma: "الشَّرْقِيَّة"
      confirm:
        - text: "«(1) cap. أ.ك: الشَّرقية: سِمَةٌ أو عادةٌ أو طريقةُ تعبير مميّزةٌ لشعوب الشرق»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«ريحُ السَّمُومِ؛ لأنَّها تَهُبُّ من ناحيةِ الشَّرقِ. مَحَلَّةٌ بالجانبِ الغربيِّ مِنْ بغدادَ، سُمِّيَتْ بذلك لكونها شرقيَّ الرُّصافة. اسمُ محافظةٍ في شرقِ مصرَ»"
          source: "المعجم الكبير — مجمع اللغة العربية بالقاهرة"
          addition: >
            تكشف أن للشرقية معانٍ جغرافية ومناخية (ريح، أسماء مناطق) موثَّقة في المعاجم الكبرى،
            مما يستوجب توثيق الفصل الدلالي بين المعنى المجرد (خاصية الحضارة الشرقية) وهذه
            المعاني الحسية الأخرى عند التعيين.

    - lemma: "المَشْرَقِيَّة"
      contradicts:
        - text: "«الحِكْمَةُ المشرِقيَّةُ: فلسفةُ الإشراقيِّين»"
          source: "المعجم الكبير — مجمع اللغة العربية بالقاهرة"
          conflict: "المشرقية مستأثَرة باصطلاح الحكمة الإشراقية الفلسفي، فلا يمكن إزاحتها دلالياً للخاصية الحضارية دون تزاحم مع هذا الاستعمال الراسخ"
        - text: "«(2) المَشْرِقيّة: ريحٌ شرقيّة متوسطيّة شديدة»"
          source: "المورد الحديث (2008)"
          conflict: "يُستخدَم للدلالة على ريح بحرية متوسطية محدَّدة، وهو ما يُضاعف الإشكال الاشتراكي"

    - lemma: "طِبَاعُ الشَّرْق"
      evidence_status: "no_material_found"

    - lemma: "الطَّابَعُ الشَّرْقِيّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "استشراق"
      decision: removed
      decision_reason: >
        الاستشراق راسخ الدلالة في المعجمية العربية الحديثة على الدراسة الأكاديمية الغربية للشرق،
        لا على الصفة المميِّزة للحضارات الشرقية. يُؤكِّد ذلك المعجم الموحد للسانيات (ALECSO)
        والمورد الحديث معاً؛ والأخير يُقابل الدلالة الوصفية بـ'الشرقية' لا بالاستشراق. ضمُّه إلى
        هذه المجموعة يُوجِد خلطاً دلالياً مع synset مفترض للحقل المعرفي الأكاديمي.
        فحص الاقتراض المفهومي: الترجمة العمياء لـ orientalism دون تمييز معنيَيْه أوقعت في الخطأ.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "طابع شرقي"
      decision: removed
      decision_reason: >
        يُخفِق في اختبار السكّ: إحلال 'شرقي' بمشرقي أو آسيوي يُنتِج نفس الوصف؛ وهو عبارة
        وصفية حرة لا وحدة معجمية ثابتة. اختبار التثبيت المعجمي: لم يرد في أي معجم كمدخل
        مستقل. فحص المركب: وصفي (wasfi) مفتوح لا مُغلَق، غير محصَّن من الاستبدال.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الشَّرْقِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        يُوثِّق المورد الحديث (2008) 'الشرقية' بوصفها الترجمة العربية الصحيحة للمعنى الوصفي
        لـ orientalism: 'سمة أو عادة أو طريقة تعبير مميزة لشعوب الشرق'، وهو يتطابق تطابقاً تاماً
        مع تعريف المجموعة. اشتقاقها: مصدر صناعي قياسي من شرقيّ على وزن مطّرد.
        فحص التشكيل: الشَّرْقِيَّة (فَعْلِيَّة). بوابة جودة المصطلح: اطّراد ✓، يُسر التداول ✓،
        ملاءمة ✓، اشتقاقية ✓. تستوجب الإشارة في التوثيق إلى الفصل عن المعنى الجغرافي (ريح، محافظة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُشير إلى الصفة والخاصية المجردة الذاتية المميِّزة لحضارات الشرق من الداخل، بخلاف
        'الاستشراق' الذي يدلّ على النظرة الأكاديمية الغربية الخارجية إلى تلك الحضارات؛ الأولى
        وصف ذاتي والثانية منهج دراسي خارجي.
      actions:
        - command: create_entry
          params:
            lemma: "الشَّرْقِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "المَشْرَقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الكبير يُقيِّد استعمالها على 'الحكمة المشرقية: فلسفة الإشراقيين'، وهو اصطلاح
        فلسفي راسخ في التراث الإسلامي. علاوةً على ذلك المورد الحديث يُورِدها لريح بحرية متوسطية.
        كلا الاستعمالين الراسخَيْن يحجبان الإزاحة الدلالية نحو الخاصية الحضارية.

    - lemma: "طِبَاعُ الشَّرْق"
      source: stage1
      decision: removed
      decision_reason: >
        مركب إضافي غير مسكوك معجمياً؛ يفشل في اختبار التثبيت المعجمي ولم يُعثَر له على شاهد.
        دلالة 'طباع' (السجايا والأخلاق الفطرية) أضيق من المفهوم المراد الذي يشمل العادات والأساليب
        الثقافية المكتسبة.

    - lemma: "الطَّابَعُ الشَّرْقِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        مركب وصفي حر يُشارك طابع شرقي في إشكالية عدم التثبيت المعجمي وفشل اختبار السكّ:
        'طابع' قابل للاستبدال بـ'سمة' أو 'خاصية' أو 'صفة' مع بقاء المعنى. لم يرد كوحدة معجمية
        مستقلة.


stage4_content:
  definition:
    current: "الصفات أو العادات أو السلوكيات المميزة للحضارات الآسيوية"
    assessment:
      decision: revise
      reason: >
        يستخدم 'الحضارات الآسيوية' بدلاً من 'حضارات الشرق وشعوبه'، مما يُوحي بالتقليص إلى
        شرق آسيا دون الشرق الأوسط والأدنى الذي يشملهما المفهوم عادةً.
        كذلك يفتقر التعريف إلى بنية الجنس والفصل المعجمية، ويبدو ترجمةً مباشرة للإنجليزية.
    authored:
      - type: terminological
        text: "سِمَةٌ أو عادةٌ أو طريقةُ تعبيرٍ مميِّزَةٌ لحضاراتِ الشَّرقِ وشعوبِه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "سِمَةٌ أو عادةٌ أو طريقةُ تعبيرٍ مميِّزَةٌ لحضاراتِ الشَّرقِ وشعوبِه"

  examples:
