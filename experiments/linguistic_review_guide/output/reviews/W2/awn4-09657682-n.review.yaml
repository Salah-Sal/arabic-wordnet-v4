    current: "مواطن أو ساكن في أفريقيا"
    assessment:
      decision: revise
      reason: "التعريف الحالي سليم المعنى لكن يحتاج إلى صياغة أكثر دقة ومطابقة للأسلوب المعجمي."
    authored:
      - type: terminological
        text: "مَنْ نُسِبَ إِلَى قَارَّةِ أَفْرِيقِيَا بِالمَوْلِدِ أَوْ السَّكَنِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09657682-n", definition_index: 0, text: "مَنْ نُسِبَ إِلَى قَارَّةِ أَفْرِيقِيَا بِالمَوْلِدِ أَوْ السَّكَنِ."}
  examples:
    per_lemma:
      - lemma: "أَفْرِيقِيّ"
        examples:
          - text: "يَفْتَخِرُ كُلُّ أَفْرِيقِيٍّ بِتَارِيخِ قَارَّتِهِ العَرِيقِ وَتَنَوُّعِهَا الثَّقَافِيِّ."
            type: usage
      - lemma: "إِفْرِيقِيّ"
        examples:
          - text: "يَسْعَى الاتِّحَادُ الإِفْرِيقِيُّ إِلَى تَعْزِيزِ الوَحْدَةِ وَالتَّضَامُنِ بَيْنَ دُوَلِ القَارَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-09657682-n", text: "يَعْتَزُّ المُواطِنُ الأَفْرِيقِيُّ بِانْتِمَائِهِ لِهَذِهِ القَارَّةِ الشَّاسِعَةِ."}

