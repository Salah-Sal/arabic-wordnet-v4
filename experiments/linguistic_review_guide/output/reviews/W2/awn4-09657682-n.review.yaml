# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط، رغم وجود بدائل هجائية وفصيحة شائعة."
      - "الارتباط الهرمي الحالي (Hypernym) للمجموعة (عامل/فاعل) غير دقيق دلالياً، فكون المرء أفريقياً لا يقتضي بالضرورة كونه عاملاً أو فاعلاً بالمعنى الاصطلاحي للكلمتين."
    observations: "المفهوم واضح وبسيط، وهو النسبة إلى القارة الأفريقية. التعريف الحالي مقبول لكنه يحتاج لضبط صياغته ليكون تعريفاً معجمياً جامعاً مانعاً."
  blind_candidates:
    - lemma: "أَفْرِيقِيّ"
      generation_method: ishtiqaq
      justification: "النسبة القياسية إلى قارة أفريقيا."
    - lemma: "إِفْرِيقِيّ"
      generation_method: ishtiqaq
      justification: "صيغة بديلة شائعة بكسر الهمزة، مستخدمة بكثرة في المعاجم والنصوص الحديثة."
    - lemma: "أَفْرِيقَانِيّ"
      generation_method: ishtiqaq
      justification: "صيغة نسبة ممتدة تستخدم أحياناً في السياقات السياسية والثقافية (مثل الحركة الأفريقانية)."
    - lemma: "ابْنُ أَفْرِيقِيَا"
      generation_method: tarkib
      justification: "تعبير كنائي شائع للدلالة على المواطن الأفريقي."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "أَفْرِيقِيّ"
      confirm:
        - text: "«إفريقيّ [مفرد]: اسم منسوب إلى إفريقيا.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«منظمة الوَحْدَة الإفريقيَّة: منظَّمة تضمّ جميع الدُّول الإفريقيّة وتسعى لتدعيم التعاون فيما بينها.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«بنك التنمية الأفريقي: يهدف إلى دعم التنمية الاقتصادية في الدول الإفريقية الأعضاء.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
    - lemma: "إِفْرِيقِيّ"
      confirm:
        - text: "«إفريقيا السوداء: المناطق التي تقع جنوب الصّحراء الإفريقيّة.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«قُطن غرب إفريقيا: مختلف أنواع القطن التي تزرع في غرب إفريقيا.»"
          source: "مسرد صناعة النسيج"
    - lemma: "أَفْرِيقَانِيّ"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "أَفْرِيقِيّ"
      decision: confirmed
      decision_reason: "اللمة الأساسية والمقابلة المباشرة للمصطلح الإنجليزي، وهي الأكثر شيوعاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَفْرِيقِيّ"
    - lemma: "إِفْرِيقِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة بديلة فصيحة وشائعة جداً بكسر الهمزة، والتبادل بين الفتح والكسر في الهمزة شائع في الأسماء الأعجمية المعربة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِفْرِيقِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09657682-n"}

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
