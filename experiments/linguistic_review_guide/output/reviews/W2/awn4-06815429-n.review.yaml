          source: "المعجم الطبي الموحد (2009) — translation_en: herald patch"
          addition: "توسّع طبي حديث للفظ نذير في صياغة وصفية، يدلّ على قبول اللفظ في سياق «ما يُنبئ بقدوم مرض»."

    # ── المرشحات (المرحلة ١) ──
    - lemma: "بَادِرَة"
      contradicts:
        - text: "«البادرة: الحدة، ويقال خطأ عن حدة، ما يقع عند الحدة مطلقا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الراسخ للبادرة هو الفعل المتسرع عند الغضب، لا الطليعة الدالة على قدوم شيء."
        - text: "«مؤنث البادر: ما يبدر من رجل عند غَضبه من خطاٍ أو سَقَط — الغضبة السريعة — الكلمة العوراء»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأول والأغلب للبادرة هو التصرف المتسرع لا السابق المُنبئ."
      expands:
        - text: "«(2) البادِر: شيء يمهِّد ظهورُهُ لظهور غيره»"
          source: "المورد الحديث (2008) — ترجمة precursor"
          addition: "المورد الحديث يستخدم «البادر» (لا البادرة) بمعنى المُمهِّد."

    - lemma: "إِرْهَاص"
      confirm:
        - text: "«مُقَدمَة الشَىْء الْمُؤْذِنَةُ بِه»"
