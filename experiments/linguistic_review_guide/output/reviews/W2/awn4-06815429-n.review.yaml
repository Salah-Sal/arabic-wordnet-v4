      expands:
        - text: "«من يتقدَّم القوم يبصر لهم الكلأَ ومساقط الغيث — رائد العين: القذى»"
          source: "المعجم الوسيط"
          addition: "يُستخدم رائد ليس فقط للشخص المستطلع بل لكل ما يتقدّم شيئًا ويُمهّد له، وهو أوسع من الإنسان ليشمل الأشياء والأحداث."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "بشير"
      decision: confirmed
      decision_reason: >
        بشير من الألفاظ العربية الراسخة لمن يُخبر بقدوم الخير أو يسبقه؛ يُعادل harbinger/herald
        بتلوين إيجابي. المورد الحديث يُصرّح بترجمة harbinger بـ«البشير». الدلالة الإيجابية الغالبة
        تجعله يُغطّي حالة الإنباء بالخير التي يفتقرها نذير، فالجمع بينهما يُكمل الصورة.
        اللمّة غير مُشكَّلة في القاعدة → تحتاج update_lemma.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بالإنباء عن الخير والبشارة؛ يُقابل نذير في الدلالة السلبية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَشِيرٌ"

    - lemma: "سلف"
      decision: removed
      decision_reason: >
        سلف يعني السابق في المنزلة أو النسب (الأسلاف والآباء المتقدّمون)؛ لا يحمل دلالة
        «الإشارة إلى الاقتراب» التي ينصّ عليها تعريف المجموعة. المورد الحديث يُترجم
        predecessor بـ«السلف» في سياق المنصب فقط، وهي دلالة أُفقية (من سبقني في هذا المنصب)
        لا دلالة طليعة منبئة. مقاييس اللغة ينصّ على أن الأصل «التقدّم والسبق» لا الإنباء.
        اللمّة لا تُسهم في تمييز هذه المجموعة عن hypernym «علامة/مؤشر».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "نذير"
      decision: confirmed
      decision_reason: >
        النذير هو المُنذِر أو الإنذار؛ يُقابل بشير في الدلالة السلبية (ما يُنبئ بقدوم خطر).
        المورد الحديث يُترجم harbinger بـ«النذير». الاستخدام الطبي «لطخة نذيرة» (herald patch)
        يُثبت امتداد اللفظ لوصف ما يُنبئ بظاهرة طبية. غير مُشكَّل → update_lemma.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بالإنذار والتحذير من قدوم شر أو خطر؛ ذو حمولة سلبية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَذِيرٌ"

    - lemma: "بَادِرَة"
      source: stage1
      decision: removed
      decision_reason: >
        البادرة في المعاجم الكلاسيكية تعني أولًا: التصرف المتسرع عند الغضب، وثانيًا: اللحمة
        بين المنكب والعنق. المعنى الاستعاري لـ«ما يتقدّم الحدث» ضعيف التوثيق ولا يصل إلى
        درجة المصطلح المسكوك. المورد الحديث يستخدم «البادر» (مذكر) لا «البادرة» للمفهوم المطلوب،
        مما يكشف عدم الاستقرار المصطلحي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "إِرْهَاص"
      source: stage1
      decision: removed
      decision_reason: >
        الإرهاص في المعجم الكبير يحمل المعنى المطلوب «مُقَدمَة الشَىْء الْمُؤْذِنَةُ بِه»
        وهو تعريف دقيق. غير أن الاستعمال الاصطلاحي الراسخ — في المعجم الوسيط والمعجم الموحد —
        قيّد الإرهاص بالمصطلح الكلامي الديني (ما يصدر من النبي قبل بعثته). هذا التقييد يجعله
        غير صالح كمصطلح عام للطليعة الدالة دون تخصّص ديني.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "طَلِيعَة"
      source: stage1
      decision: removed
      decision_reason: >
        طليعة جمعها طلائع وهي وحدة عسكرية جماعية؛ دلالتها الأصلية «مقدّمة الجيش». توسيعها
        لتعني «ما يُنبئ بقدوم ظاهرة» حاضر في الأرصاد (ARABTERM) لكنه خاص بالسياق التقني.
        استعمالها في السياق العام يحمل طابعًا عسكريًا يضيق به المفهوم المطلوب.
        رائد أكثر ملاءمة لهذا الدور لكونه يُستخدم صراحةً بمعنى «مقدمة الشيء».
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "رَائِد"
      source: stage1
      decision: confirmed
      decision_reason: >
        رائد موثّق توثيقًا صريحًا بمعنى «مقدمة الشيء»: «الحمى رائد الموت» (حديث نبوي)،
        «الفرات ودجلة رائدان لأهل العراق» (أثر تاريخي). المورد الحديث يُترجم harbinger بـ«الرائد».
        مقاييس اللغة تربطه بالانطلاق والتقدّم. الاستخدام في ARABTERM «رائد، ممهّد» يُثبت
        قبوله كمصطلح تقني بمعنى forerunner. الأوزن الصرفي (فاعل من راد) مناسب للاسم الدال على
        الفاعلية والتقدّم. إضافته تملأ الفراغ الذي تركه حذف سلف.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        حيادي الدلالة؛ يدلّ على ما يتقدّم الحدث ويمهّد له دون تخصيص بخير أو شر.
        يختلف عن بشير (الخير) ونذير (الشر) بعموم استخدامه للأحداث الطبيعية والبشرية.
      actions:
        - command: create_entry
          params:
            lemma: "رَائِدٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "شيء يسبق ويشير إلى اقتراب شيء أو شخص ما"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية. «يسبق ويشير إلى اقتراب» ركيك الصياغة،
        وكلمة «اقتراب» ليست أدقّ تعبير عن المفهوم. أسلوب المعجم يفضّل التعريف بالجنس
        والفصل مع استخدام «يُؤذِن» أو «يُنبئ» بدل «يشير إلى اقتراب».
    authored:
      - type: terminological
        text: "كُلُّ ما تَقَدَّمَ شيئًا أو شَخصًا وأنبأَ بوقوعِهِ أو قدومِه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يَسبِقُ الشيءَ أو الشخصَ ويُؤذِنُ بهما؛ كقولهم: الحمى رائدُ الموتِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "كُلُّ ما تَقَدَّمَ شيئًا أو شَخصًا وأنبأَ بوقوعِهِ أو قدومِه"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "ما يَسبِقُ الشيءَ أو الشخصَ ويُؤذِنُ بهما؛ كقولهم: الحمى رائدُ الموتِ"

  examples:
    per_lemma:
      - lemma: "بَشِيرٌ"
        examples:
          - text: "كانت تباشيرُ الفجرِ بشيرًا بيومٍ جديدٍ بعد ليلةٍ طويلةٍ من القلق."
            type: usage
      - lemma: "نَذِيرٌ"
        examples:
          - text: "لا يُصغي الغافلون إلى نذيرِ العاصفةِ حتى تحلَّ بهم."
            type: usage
      - lemma: "رَائِدٌ"
        examples:
          - text: "الحُمَّى رائدُ الموتِ وطليعتُه، فمن أحسَّ بها فليُداوِها قبل أن تستفحل."
            type: hadith
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كانت تباشيرُ الفجرِ بشيرًا بيومٍ جديدٍ بعد ليلةٍ طويلةٍ من القلق."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "لا يُصغي الغافلون إلى نذيرِ العاصفةِ حتى تحلَّ بهم."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "الحُمَّى رائدُ الموتِ وطليعتُه، فمن أحسَّ بها فليُداوِها قبل أن تستفحل."


# ── المرحلة ٥: الإثراء ──────────────────────────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "بَشِيرٌ"
      entry_id: "{auto}"
      root: "بشر"
      maqayis_quote: "«الْبَاءُ وَالشِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ: ظُهُورُ الشَّيْءِ مَعَ حُسْنٍ وَجَمَالٍ... وَتَبَاشِيرُ الصُّبْحِ أَوَائِلُهُ؛ وَكَذَلِكَ أَوَائِلُ كُلِّ شَيْءٍ»"

    - lemma: "نَذِيرٌ"
      entry_id: "{auto}"
      root: "نذر"
      maqayis_quote: "«النُّونُ وَالذَّالُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى تَخْوِيفٍ أَوْ تَخَوُّفٍ. مِنْهُ الْإِنْذَارُ: الْإِبْلَاغُ؛ وَلَا يَكَادُ يَكُونُ إِلَّا فِي التَّخْوِيفِ»"

    - lemma: "رَائِدٌ"
      entry_id: "{auto}"
      root: "رود"
      maqayis_quote: "«الرَّاءُ وَالْوَاوُ وَالدَّالُ مُعْظَمُ بَابِهِ يَدُلُّ عَلَى مَجِيءٍ وَذَهَابٍ مِنِ انْطِلَاقٍ فِي جِهَةٍ وَاحِدَةٍ... بَعَثْنَا رَائِدًا يَرُودُ الْكَلَأَ، أَيْ يَنْظُرُ وَيَطْلُبُ»"

  per_sense:
    - lemma: "بَشِيرٌ"
      sense_id: "{auto}"
      nuance: "يختصّ بالإنباء عن الخير والبشارة؛ يُستخدم لوصف ما يُبشّر بقدوم أمر محبوب. يُقابل نذير في القطب الإيجابي."
    - lemma: "نَذِيرٌ"
      sense_id: "{auto}"
      nuance: "يختصّ بالإنذار من قدوم شر أو خطر؛ ذو حمولة سلبية. يُقابل بشير في القطب السلبي."
    - lemma: "رَائِدٌ"
      sense_id: "{auto}"
      nuance: "حيادي الدلالة؛ يصف ما يتقدّم الحدث ويمهّد له دون تخصيص بخير أو شر. يُستخدم للأحداث الطبيعية والمرض والظواهر."

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"بشر","maqayis":"«الْبَاءُ وَالشِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ: ظُهُورُ الشَّيْءِ مَعَ حُسْنٍ وَجَمَالٍ... وَتَبَاشِيرُ الصُّبْحِ أَوَائِلُهُ؛ وَكَذَلِكَ أَوَائِلُ كُلِّ شَيْءٍ»"}'

    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نذر","maqayis":"«النُّونُ وَالذَّالُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى تَخْوِيفٍ أَوْ تَخَوُّفٍ. مِنْهُ الْإِنْذَارُ: الْإِبْلَاغُ؛ وَلَا يَكَادُ يَكُونُ إِلَّا فِي التَّخْوِيفِ»"}'

    - command: set_metadata
