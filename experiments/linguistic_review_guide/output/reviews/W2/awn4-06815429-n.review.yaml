# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «سلف» لا تحمل دلالة الإنباء والتنبؤ، بل تعني السابق في المنزلة أو النسب، مما يجعلها بعيدة عن جوهر التعريف «يشير إلى اقتراب شيء»."
      - "لمّة «بشير» ذات حمولة إيجابية خاصة بالبشارة والخبر السار، في حين أن المفهوم محايد."
      - "لمّة «نذير» ذات حمولة سلبية خاصة بالتخويف والإنذار من الشر، مما يُضيّق المفهوم المحايد الذي يشمل الحالتين."
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية، ويمكن تحسينه بأسلوب معجمي أصيل."
      - "اللمّات الثلاث بلا تشكيل في قاعدة البيانات."
    observations: >
      المجموعة الترادفية تمثل مفهوم «الطليعة الدالة»: ما يسبق حدثًا أو شخصًا ويُنبئ بقدومه.
      الإنجليزية تجمع في هذا المفهوم harbinger/herald (دلالة إيجابية أو سلبية) وforerunner/precursor
      (دلالة محايدة: ما مهّد للشيء) وpredecessor (ما سبق في المنصب). العربية لديها ثروة في هذا الباب:
      بشير ونذير يُغطيان القطبين، لكن المفهوم المحايد يحتاج إلى رائد أو طليعة. مدخل «سلف» يُغطي
      الدلالة الثالثة (المنصب السابق) ولا يتقاطع مع التعريف العربي المعطى.
  blind_candidates:
    - lemma: "بَادِرَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر بدر على وزن فاعلة؛ «بدر» يدلّ على الإسراع والتقدّم.
        البادرة: ما يسبق الحدث وينبئ به كأوّل ما يتفطّر من نبات يُنبئ بالربيع.
    - lemma: "إِرْهَاص"
      generation_method: ishtiqaq
      justification: >
        مصدر رباعي من رَهَصَ (أرهص): الإرهاص في اللغة بناء الأساس؛ مجازًا: ما يُمهِّد الطريق
        لحدث قادم ويُنبئ به. يُستخدم في المعاجم بمعنى «مقدّمة الشيء المؤذنة به».
    - lemma: "طَلِيعَة"
      generation_method: majaz
      justification: >
        مجاز: طليعة الجيش أوّل من يطلع ويُنبئ بقدومه؛ امتُدّ إلى كل ما يتقدّم الظاهرة
        ويدلّ على قدومها، ومنه الاستخدام في مصطلحات الأرصاد الجوية.
    - lemma: "رَائِد"
      generation_method: majaz
      justification: >
        مجاز: الرائد من يتقدّم القوم ليستطلع؛ امتُدّ لكل ما يسبق الحدث ويُنبئ به،
        كقولهم «الحمى رائد الموت»، أي مقدّمته ودليله.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "بشير"
      confirm:
        - text: "«الرائد؛ البشير؛ النذير»"
          source: "المورد الحديث (2008) — ترجمة harbinger"
        - text: "«(1) البشير؛ النذير — (2) البادِر: شيء يمهِّد ظهورُهُ لظهور غيره»"
          source: "المورد الحديث (2008) — ترجمة precursor"
        - text: "«مركبات تشتق منها مركبات ذات تأثير فعال تأتي في مرحلة تالية لها»"
