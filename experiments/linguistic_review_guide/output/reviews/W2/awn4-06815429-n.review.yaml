        - text: "«الرَّاءُ وَالْوَاوُ وَالدَّالُ مُعْظَمُ بَابِهِ يَدُلُّ عَلَى مَجِيءٍ وَذَهَابٍ مِنِ انْطِلَاقٍ فِي جِهَةٍ وَاحِدَةٍ... وَالرَّوْدُ: فِعْلُ الرَّائِدِ. يُقَالُ بَعَثْنَا رَائِدًا يَرُودُ الْكَلَأَ، أَيْ يَنْظُرُ وَيَطْلُبُ»"
