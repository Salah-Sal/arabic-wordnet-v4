        - text: "«وَتَبَاشِيرُ الصُّبْحِ أَوَائِلُهُ؛ وَكَذَلِكَ أَوَائِلُ كُلِّ شَيْءٍ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الْبَاءُ وَالشِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ: ظُهُورُ الشَّيْءِ مَعَ حُسْنٍ وَجَمَالٍ... وَالْبِشَارَةُ بِالْخَيْرِ وَالنِّذَارَةُ بِغَيْرِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر أصلًا للظهور الحسن؛ البشارة مختصّة بالخير مقابل النذارة بالشر، مما يعني أن بشير يحمل دلالة إيجابية لا محايدة."

    - lemma: "سلف"
      confirm:
        - text: "«السَّلَف: مَن كان يحتلّ سابقًا منصبًا أو مركزًا خَلَفَهُ فيه شخص آخر»"
          source: "المورد الحديث (2008) — ترجمة predecessor"
        - text: "«السِّينُ وَاللَّامُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى تَقَدُّمٍ وَسَبْقٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«السلف: التقدم، ولزيد سلف كريم أي آباء متقدمون جمعه أسلاف»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«كل من تقدمك من آبائك وذوى قرابتك في السنِّ أو الفضل»"
          source: "المعجم الوسيط"
          conflict: >
            دلالة سلف محصورة في التقدّم الزمني للأشخاص (الأسلاف والآباء)، لا في الإشارة
            إلى اقتراب شيء أو الإنباء عنه. المفهوم المطلوب يشترط عنصر «يُشير إلى اقتراب»
            وهو غائب عن دلالة سلف.
        - text: "«(1) البشير؛ النذير — (2) البادِر — (3) السَّلَف: مَن كان يحتلّ سابقًا منصبًا»"
          source: "المورد الحديث (2008) — ترجمة precursor"
          conflict: >
            المورد الحديث يُعدّد معاني precursor الأربعة؛ دلالة سلف مقيّدة بمعنى «شغل المنصب
            قبله» وليست دلالة الطليعة الدالة التي تُعبّر عنها تعابير البشير والنذير والبادر.

    - lemma: "نذير"
      confirm:
        - text: "«النذير: الإنذار والمُنْذِرُ»"
          source: "المعجم الوسيط"
        - text: "«الرائد؛ النذير؛ البشير»"
          source: "المورد الحديث (2008) — ترجمة harbinger"
        - text: "«النُّونُ وَالذَّالُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى تَخْوِيفٍ أَوْ تَخَوُّفٍ. مِنْهُ الْإِنْذَارُ: الْإِبْلَاغُ؛ وَلَا يَكَادُ يَكُونُ إِلَّا فِي التَّخْوِيفِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
