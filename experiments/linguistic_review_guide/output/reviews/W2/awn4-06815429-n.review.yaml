        key: note
        value: '{"root":"رود","maqayis":"«الرَّاءُ وَالْوَاوُ وَالدَّالُ مُعْظَمُ بَابِهِ يَدُلُّ عَلَى مَجِيءٍ وَذَهَابٍ مِنِ انْطِلَاقٍ فِي جِهَةٍ وَاحِدَةٍ... بَعَثْنَا رَائِدًا يَرُودُ الْكَلَأَ، أَيْ يَنْظُرُ وَيَطْلُبُ»"}'

    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يختصّ بالإنباء عن الخير والبشارة؛ يُستخدم لوصف ما يُبشّر بقدوم أمر محبوب. يُقابل نذير في القطب الإيجابي.","mwe":false}'

    - command: set_metadata
