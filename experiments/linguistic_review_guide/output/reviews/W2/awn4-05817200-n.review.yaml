          addition: "يكشف الدليل عن وجود مُنافس اصطلاحي «مضمون معرفي» مقابل «محتوى معرفي»، مما يُؤكد أنّ المفهوم مقنَّن في المصطلحية العربية الحديثة"

    - lemma: "حَصِيلَة"
