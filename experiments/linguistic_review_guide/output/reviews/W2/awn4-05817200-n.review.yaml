# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُحْتَوَى ذِهْنِيّ"
      decision: confirmed
      decision_reason: "المركّب الوصفي «محتوى ذهني» رسَخ في الأدبيات التربوية والنفسية الحديثة كمقابل لـmental content. كلمة «محتوى» اكتسبت في العربية المعاصرة معنى «مضمون / ما يشتمل عليه الشيء»، والنعت «ذهني» مُقنَّن في ALECSO بمعنى mental ومدعوم بالمعجم الكبير. التعارض مع المعنى الكلاسيكي مقبول لأنّ الكالك المتخصَّص سائغ حين تنعدم البدائل الكلاسيكية الدقيقة. اجتاز اختبار السكّ: التعبير ثابت ومقيَّد دلالياً بالحقل المعرفي-النفسي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُبرز البُعد النفسي-الوظيفي لما يختزنه الذهن (الذاكرة، المخيّلة، التصوّر الداخلي)؛ أعمّ وأقلّ تقنيةً من «معرفي»، ويصلح في السياقات النفسية العامة وفلسفة العقل"

    - lemma: "مُحْتَوَى مَعْرِفِيّ"
      decision: confirmed
      decision_reason: "المركّب الوصفي «محتوى معرفي» موثَّق في مصطلحية ALECSO بترجمة «content» وبالمعادل الموازي «مضمون معرفي» = cognitive content. «معرفي» مُقنَّن بمعنى cognitive في المعاجم الطبية والتربوية. المصطلح شائع في أدبيات علم النفس المعرفي والتربية العربية، ويجتاز اختبار التثبيت المعجمي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركّز على الجانب الإبستيمولوجي المنظَّم (المعرفة المكتسبة بالإدراك والاكتشاف والتعلّم)؛ أدقّ تقنيةً وأوثق ارتباطاً بنظرية المعرفة وعلم النفس المعرفي من «ذهني»"

    - lemma: "حَصِيلَة"
      source: stage1
      decision: removed
      decision_reason: "حصيلة مُسكوكة في المجالين المالي والهندسي بمعنى العائد أو الناتج المادّي. الدلالة المعجمية الراسخة هي «البقية وما يجمع من مال»، وليست المحتوى الذهني. الاستعمال المجازي يستلزم مضافاً إليه مخصِّصاً (حصيلة المعرفة، حصيلة التعلّم)، مما يجعلها عبارة وصفية لا مصطلحاً مسكوكاً. فشل اختبار السكّ."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُحَصَّل"
      source: stage1
      decision: removed
      decision_reason: "المعاجم لا تُثبت مُحصَّل (اسم مفعول) بمعنى المحتوى الذهني؛ المُثبَت هو المُحصِّل (الجامع للمال/منقّي المعدن) والمِحصَل (المنخل) والمحصَل (ما يبقى للرجل). الاستعمال الشائع «في المحصّلة» ظرف لا اسم. لا تثبيت معجمي بالدلالة المطلوبة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَصِيدٌ ذِهْنِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلّة معجمية. «رصيد ذهني» مجاز غير مُسكوك كمصطلح ثابت في أيّ معجم متخصّص. فشل اختبار التثبيت المعجمي: يمكن إبدال «ذهني» بـ«علمي» أو «معرفي» أو «ثقافي» دون تغيير الجوهر، مما يُثبت أنّه عبارة وصفية حرّة لا مصطلح مقيَّد."
      evidence_assessment:
        case: no_material

    - lemma: "مُدْرَكَات"
      source: stage1
      decision: removed
      decision_reason: "مُدرَكات مصطلح فلسفي موثَّق بمعنى percepts (وحدات الإدراك الحسّي الفردية). دلالته أضيق من دلالة المجموعة التي تشمل المُكتشَف والمتعلَّم لا المُدرَك حسّياً وحده. يُمثّل مفهوماً أكثر تخصّصاً (hyponym) لا مرادفاً للمحتوى الذهني الكلّي."
      evidence_assessment:
        case: mixed


