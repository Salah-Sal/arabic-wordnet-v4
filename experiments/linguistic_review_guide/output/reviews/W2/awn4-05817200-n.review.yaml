        - text: "«معرفي» → cognitive (Education)"
          source: "مسرد التربية، المنظمة العربية (ALECSO)"
        - text: "«مجموعة الخبرات الموجودة في المنهاج التربوي، والتي تحقق أهداف التعلم» لمصطلح «محتوى» في سياق تربوي"
          source: "مسرد التربية، المنظمة العربية (ALECSO)"
      contradicts:
        - text: "«المَحْتَوَى: بيوتُ الناس من الوبر مجتمعة على ماء»"
          source: "المعجم الوسيط"
