        - text: "«الذِّهْنِيُّ (في الفلسفة): ما له صِلةٌ بالذِّهْن في مَظْهره الوظيفيِّ، كالذاكرة والمُخَيِّلة، أو في مَضْمُونه ودلالته مما يَشْتَمِلُ عليه الذِّهن»"
