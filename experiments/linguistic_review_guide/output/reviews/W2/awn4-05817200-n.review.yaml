        - text: "«المُحْتَوَى: بيوت الناس من الوبر مجتمعة على ماء»"
          source: "المعجم الكبير"
          conflict: "نفس المعنى الكلاسيكي يُظهر أنّ «محتوى» مصطلح دخيل على الحقل الذهني"

    - lemma: "مُحْتَوَى مَعْرِفِيّ"
      confirm:
        - text: "«مضمون معرفي» → «cognitive content»: «محتوى الرسالة المتعلق بالجانب المعرفي»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«مَعْرِفِيّ» → cognitive (The Unified Medical Dictionary)"
