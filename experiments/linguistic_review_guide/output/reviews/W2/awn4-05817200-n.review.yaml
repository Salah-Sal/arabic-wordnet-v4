# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان مُركَّبتان وصفيّتان (محتوى + صفة)، ولا تُوجدان كمداخل مُفردة في المعاجم الكلاسيكية، مما يُشير إلى أنّهما كالكَيْ الإنجليزي (calque)"
      - "كلمة «محتوى» في معاجم OCR (الوسيط والكبير) تحمل المعنى الكلاسيكي «بيوت الناس من الوبر مجتمعة على ماء»، وهو بعيد تماماً عن دلالة المجموعة"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية، ويفتقر إلى الجنس القريب الصريح وإلى الأسلوب المعجمي الوسيط"
    observations: |
      المجموعة الترادفية تتناول مفهوماً فلسفياً-نفسياً: مجموع ما حصّله الذهن من إدراك واكتشاف وتعلّم.
      في التراث العربي الإسلامي يُعبَّر عن ذلك بمصطلحات «المُدرَكات» و«العلوم والمعارف» و«حصيلة الخبرة».
      المصطلح الحديث «محتوى» دخيل على هذا المجال، إذ أصله المعجمي الجمعُ المادّي لا الذهني؛
      غير أنّه رسَخ في الأدبيات التربوية والإعلامية. كما أنّ كلمة «مضمون» وردت في ALECSO
      بالمقابل الصريح لـcognitive content («مضمون معرفي»)، مما يُشير إلى وجود منافس اصطلاحي.
  blind_candidates:
    - lemma: "حَصِيلَة"
      generation_method: majaz
      justification: "من حَصَلَ يَحْصُلُ (جذر حصل)، على وزن فَعِيلَة. تُستعمل للدلالة على ما يجمعه المرء من مردود وعائد؛ والمجاز يمتدّ لتشمل حصيلة الإدراك والتعلّم. تتميّز بكونها مفردًا عربياً صرفاً دون إضافة وصف."
    - lemma: "مُحَصَّل"
      generation_method: ishtiqaq
      justification: "من حصَّل يحصّل (جذر حصل)، على وزن مُفَعَّل (اسم مفعول). يدلّ على المستخلَص أو ما آل إليه الجمع والتحصيل؛ يُستعمل في اللغة الحديثة للتعبير عن الناتج الكلّي. مناسب للدلالة على مجموع ما آل إليه الذهن من معرفة ومدركات."
    - lemma: "رَصِيدٌ ذِهْنِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «رصيد» (ما يُبقيه المرء في ذمّته من حقوق أو ما يختزنه) موصوفاً بـ«ذهني». يُعبّر عن المخزون المتراكم في الذهن من معارف ومدركات. الاستعارة من المجال المالي مألوفة في العربية."
    - lemma: "مُدْرَكَات"
      generation_method: ishtiqaq
      justification: "جمع مُدْرَكَة، من أَدْرَكَ يُدرِك (جذر درك)، على وزن مُفْعَلَات. تُستعمل في الفلسفة الإسلامية للدلالة على جملة ما يُحصّله العقل من تمثّلات ومفاهيم وإدراكات. مستمدّة مباشرةً من الفعل الوارد في تعريف المجموعة (أُدرِك)."


