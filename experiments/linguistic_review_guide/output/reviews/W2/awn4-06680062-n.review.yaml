# مراجعة المجموعة الترادفية: awn4-06680062-n
# code / codification — دستور، مدونة، نظام
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «نظام» شديد التعدد الدلالي؛ معناه الأصلي هو الخيط الذي يُنظم فيه الخرز، ثم التنظيم والاتساق، وهو أقرب إلى system منه إلى code"
      - "لفظ «دستور» معرَّب فارسي وقد تحوّل في الاستعمال المعاصر ليدلّ خاصة على القانون الأساسي للدولة (constitution) أكثر من مجرد مجموعة قواعد"
      - "لفظ «مدونة» تنازعه في الاستعمال المعاصر معنى blog"
    observations: >
      المجموعة الترادفية تُقابل المفهوم الإنجليزي code/codification بمعنى مجموعة
      منظَّمة من القواعد أو القوانين المكتوبة. اللمّات الثلاث الموجودة تمثّل مستويات
      مختلفة من العمومية: «مدونة» أقربها إلى المعنى الدقيق للمفهوم، و«دستور» تخصّص
      في الاستعمال الحديث، و«نظام» أعمّ وأشمل. المفهوم مُعَجَّم بقوة في العربية
      ولا فجوة معجمية حقيقية فيه.
  blind_candidates:
    - lemma: "تَقْنِين"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفْعِيل من الجذر ق ن ن، يدلّ على جمع القواعد في صيغة مدوَّنة منظَّمة. مستعمل في المعجم القانوني الموحَّد بمعنى codification"
    - lemma: "شِرْعَة"
      generation_method: majaz
      justification: "لفظ قرآني (المائدة: ٤٨) بمعنى الطريقة والمذهب المستقيم وما سنَّ الله من الدين؛ إحياء لمفهوم مجموعة الأحكام المقنَّنة"
    - lemma: "لَائِحَة"
      generation_method: ishtiqaq
      justification: "من الجذر ل و ح على وزن فاعلة؛ تعني في الاستعمال المعاصر مجموعة من المواد توضع لتنظيم العمل في هيئة أو مؤسسة"
    - lemma: "سُنَّة"
      generation_method: majaz
      justification: "من الجذر س ن ن بمعنى السيرة والطريقة المسلوكة؛ في مقاييس اللغة: جريان الشيء واطّراده. يمكن توسيعه ليشمل مجموعة القواعد المتّبعة"

stage2_evidence:
