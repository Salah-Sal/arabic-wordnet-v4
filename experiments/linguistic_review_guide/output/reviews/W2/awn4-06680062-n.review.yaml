stage3_analysis:
  per_lemma:
    - lemma: "دُسْتُور"
      decision: confirmed
      decision_reason: >
        لفظ معرَّب مستقرّ في العربية منذ القرن الرابع الهجري على الأقل، وردت فيه
        نصوص معجمية صريحة بمعنى «الذي تُجمع فيه قواعد الملك وقوانينه» و«القاعدة
        يعمل بمقتضاها». وإن كان قد تخصّص في الاستعمال المعاصر بالقانون الأساسي
        للدولة فإنّ المعنى الأعمّ (مجموعة قواعد مكتوبة) لا يزال حياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل في الأغلب للوثيقة التأسيسية العُليا التي تتضمّن القواعد الأساسية لنظام الحكم أو لمؤسسة ما"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُسْتُور"

    - lemma: "مُدَوَّنَة"
      decision: confirmed
      decision_reason: >
        أقوى اللمّات مطابقةً للمفهوم؛ وردت في المعجم الكبير بتعريف مباشر:
        «مجموعة أحكام أو قوانين فقهية»، وفي المعجم الموحد للقانون مقابلاً لـ code
        و corpus juris. لها شاهد تاريخي في «المدونة الكبرى» لسحنون.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على المجموعة المُصنَّفة المكتوبة من القوانين أو الأحكام، مع تأكيد بُعد التدوين والكتابة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدَوَّنَة"

    - lemma: "نِظَام"
      decision: confirmed
      decision_reason: >
        وإن كان المعنى الأصلي للنظام هو الخيط والترتيب، فإنّ الاستعمال المعاصر
        الراسخ في المجال القانوني والإداري (نظام المرافعات، نظام العمل، النظام
        الأساسي) يجعله مقبولاً في هذه المجموعة. هو المصطلح الرسمي في بعض الدول
        العربية (كالمملكة العربية السعودية) لما يسمّى «قانوناً» في غيرها.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل خاصة في السياق التنظيمي والإداري الرسمي للدلالة على مجموعة قواعد تنظيمية مقنَّنة ذات طابع تنفيذي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَام"

    - lemma: "تَقْنِين"
      source: stage1
      decision: removed
      decision_reason: >
        التقنين مصدر يدلّ على عملية جمع القواعد وتنظيمها في مدوَّنة (codification
        كعملية)، لا على ناتج العملية (المدوَّنة/الـ code نفسه). الفرق بين العملية
        وناتجها جوهري، والمجموعة الترادفية تصف الناتج لا العملية.

    - lemma: "شِرْعَة"
      source: stage1
      decision: removed
      decision_reason: >
        الشرعة في المعاجم مقصورة على الشريعة الدينية والطريقة الإلهية المستقيمة،
        ولا تشمل مجموعات القوانين الوضعية المكتوبة. توسيعها ليشمل code العام
        يتعارض مع استعمالها القرآني والمعجمي الراسخ.

    - lemma: "لَائِحَة"
      source: stage1
      decision: removed
      decision_reason: >
        اللائحة في الاستعمال الحديث مقصورة على مجموعة مواد تنظيمية داخلية لهيئة
        أو مؤسسة (bylaw/regulation)، وهي أدنى مرتبةً من الـ code الذي يشمل القوانين
        والمبادئ العامة. العلاقة بينهما اشتمال لا ترادف.

    - lemma: "سُنَّة"
      source: stage1
      decision: removed
      decision_reason: >
        السنة في الاستعمال الشرعي واللغوي الحيّ تدلّ على الطريقة النبوية والسيرة
        المتَّبعة شفاهاً أو عرفاً، لا على مجموعة مكتوبة من القوانين. إقحامها في
        هذه المجموعة يخلط بين مفهومَيْن مختلفين.

