        - text: "«المُدَوَّنَةُ المَدَنِيَّة: مُصَنَّفٌ يَضُمَّ قَواعِدَ القانُونِ المَدَنِيِّ»"
          source: "المعجم الكبير"
        - text: "«مدوَّنة: مجموعة قوانين» (مقابل corpus juris)"
