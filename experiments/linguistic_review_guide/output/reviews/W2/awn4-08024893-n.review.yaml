stage1_review:
  assessment:
    concerns:
      - "التعريف الموجود جيد، لكنه قد لا يبرز الطابع المؤسسي أو الرسمي للمفهوم بشكل كافٍ مقارنة ببعض المرادفات."
    observations: "المصطلح الموجود 'مُنَظَّمَة' هو الأدق والأكثر شيوعاً، ويمكن توسيع المجموعة الترادفية لتشمل مصطلحات أخرى تعبر عن الكيانات التي تجمع أفراداً لتحقيق هدف مشترك مثل 'هيئة' و'مؤسسة' و'جمعية' و'رابطة'."
  blind_candidates:
    - lemma: "هَيْئَة"
      generation_method: majaz
      justification: "إزاحة دلالية من معنى الحال والشكل إلى جماعة من الناس يعهد إليها بعمل خاص."
    - lemma: "مُؤَسَّسَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول من أسس، يدل على كيان مبني ومؤسس لتحقيق غرض معين."
    - lemma: "رَابِطَة"
      generation_method: ishtiqaq
      justification: "اسم فاعل يدل على ما يربط مجموعة من الأشخاص ببعضهم في إطار تنظيمي."
    - lemma: "جَمْعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الجمع، وتطلق على طائفة تتألف لغرض خاص."

stage2_evidence:
  per_lemma:
    - lemma: "مُنَظَّمَة"
      confirm:
        - text: "كيان اجتماعي يسعى إلى تحقيق أهداف جماعية توجه أداءه، وله حدود تفصله عن البيئة التي يعمل فيها."
          source: "المعجم الموحد لمصطلحات المياه (2000)"
    - lemma: "هَيْئَة"
      confirm:
        - text: "الجماعة من الناس يعهد إليها بعمل خاص، يقال هيئة الأمم المتحدة وهيئة مجلس الإدارة"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "مُؤَسَّسَة"
      confirm:
        - text: "institution"
          source: "مسرد علم الاجتماع والأنثروبولوجيا"
    - lemma: "رَابِطَة"
      confirm:
        - text: "الجماعة يجمعهم أمر يشتركون فيه يقال رابطة الأدباء ورابطة القراء ونحو ذلك"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "جَمْعِيَّة"
      confirm:
        - text: "طائفة تتألف من أعضاء لغرض خاص وفكرة مشتركة"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "مُنَظَّمَة"
      decision: confirmed
      decision_reason: "المصطلح الأدق والأكثر شيوعاً للتعبير عن كيان تنظيمي يجمع أفراداً لتحقيق هدف مشترك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنَظَّمَة"

    - lemma: "هَيْئَة"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم للدلالة على مجموعة من الأشخاص يُعهد إليهم بعمل محدد، وتتقاطع مع مفهوم المنظمة في جوانب عديدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "هَيْئَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08024893-n"}

    - lemma: "مُؤَسَّسَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي ومستخدم بكثرة للتعبير عن الكيانات المنظمة التي تضم مجموعة أفراد لتحقيق غرض مشترك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُؤَسَّسَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08024893-n"}

    - lemma: "رَابِطَة"
      source: stage1
      decision: confirmed
      decision_reason: "صحيحة ومناسبة لمفهوم مجموعة الأشخاص الذين يجمعهم هدف أو رابط مشترك، كالروابط المهنية والأدبية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رَابِطَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08024893-n"}

    - lemma: "جَمْعِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تطابق المفهوم تماماً، خاصة في السياقات الخيرية أو التعاونية حيث تتألف من أعضاء لغرض خاص."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "جَمْعِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08024893-n"}

stage4_content:
  definition:
    current: "مجموعة من الأشخاص يعملون معًا لتحقيق هدف مشترك"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويغطي الجوهر الدلالي للمجموعة الترادفية."
  examples:
    per_lemma:
      - lemma: "مُنَظَّمَة"
        examples:
          - text: "انضمت الدولة إلى منظمة التجارة العالمية."
            type: usage
      - lemma: "هَيْئَة"
        examples:
          - text: "عقدت هيئة كبار العلماء اجتماعاً طارئاً لمناقشة المستجدات."
            type: usage
      - lemma: "مُؤَسَّسَة"
        examples:
          - text: "تعمل هذه المؤسسة على دعم المشاريع الصغيرة والمتوسطة."
            type: usage
      - lemma: "رَابِطَة"
        examples:
          - text: "أسس الخريجون رابطة لتعزيز التواصل بينهم."
            type: usage
      - lemma: "جَمْعِيَّة"
        examples:
          - text: "تبرع المحسن بجزء من ثروته للجمعية الخيرية."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "انضمت الدولة إلى منظمة التجارة العالمية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "عقدت هيئة كبار العلماء اجتماعاً طارئاً لمناقشة المستجدات."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تعمل هذه المؤسسة على دعم المشاريع الصغيرة والمتوسطة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أسس الخريجون رابطة لتعزيز التواصل بينهم."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تبرع المحسن بجزء من ثروته للجمعية الخيرية."}

stage5_enrichment:
  per_entry:
    - lemma: "مُنَظَّمَة"
      entry_id: "{auto}"
      root: "نظم"
      maqayis_quote: "«النون والظاء والميم: أصل يدل على تأليف شيء وتأليفه، ونظمت الخرز نظما...»"
    - lemma: "هَيْئَة"
      entry_id: "{auto}"
      root: "هيا"
      maqayis_quote: "«الهاء والياء والألف كلمة تأتي وهاؤها زائدة. يقال: هيا، والمراد: يا.»"
    - lemma: "مُؤَسَّسَة"
      entry_id: "{auto}"
      root: "اسس"
      maqayis_quote: "«الهمزة والسين يدل على الأصل والشيء الوطيد الثابت، فالأسل البناء...»"
    - lemma: "رَابِطَة"
      entry_id: "{auto}"
      root: "ربط"
      maqayis_quote: "«الراء والباء والطاء أصل واحد يدل على شد وثبات.»"
    - lemma: "جَمْعِيَّة"
      entry_id: "{auto}"
