# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث (درجة، مرتبة، مستوى) مذكورة بدون تشكيل كامل."
      - "التعريف العربي الحالي قائم على ترجمة حرفية للتعريف الإنجليزي، ويفتقر إلى صياغة معجمية أصيلة."
      - "المجموعة تجمع مفاهيم دلالية متقاربة لكنها ليست مترادفة تماماً؛ الفوارق الدقيقة بين اللمات غير موثّقة."
    observations: >
      يُمثِّل هذا السينسِت مفهوم «الموقع على سلَّم قياسي» — وهو مفهوم مجرَّد يصف مَنزِلةً محدَّدةً تُحدَّدُ بها
      شدَّةُ الشيء أو كمِّيَّتُهُ أو جودتُهُ. اللمّات الثلاث المدرجة (درجة/مرتبة/مستوى) تُغطِّي هذا المعنى من
      زوايا متباينة: فـ«الدرجة» تؤكِّد التدرُّجَ الصاعد، و«المرتبة» تُركِّز على الهرميَّة التنظيميَّة، و«المستوى»
      يُفيد الامتدادَ الأفقيَّ. التعريف الحالي مقبول وظيفياً لكنه يستحق إعادة صياغة بأسلوب معجمي أوفق.
  blind_candidates:
    - lemma: "مَنْزِلَة"
      generation_method: ishtiqaq
      justification: >
        مشتقَّة من جذر (نزل) على وزن مَفْعِلة، وهي تُفيد الموقع والمكانة في سلَّم الأشياء؛
        فيُقال «له منزلة رفيعة» أي أنَّه في درجة عالية. الجذر يُعطي دلالة الاستقرار في موضع ما.
    - lemma: "رُتْبَة"
      generation_method: ishtiqaq
      justification: >
        مشتقَّة من جذر (رتب) على وزن فُعْلة، وتدلُّ على الموقع في سلَّم الترتيب.
        قالوا «رتبةٌ ورَتَبٌ، كقولك دَرَجَةٌ ودَرَجٌ» (ابن فارس)، مما يربطها بالدرجة التدرُّجية.
    - lemma: "طَبَقَة"
      generation_method: majaz
      justification: >
        من (طبق) بمعنى وضع شيء فوق شيء؛ فالطبقات هي المستويات المتراكمة فوق بعضها.
        تُستعمَل مجازاً بمعنى المرتبة والدرجة؛ «فلانٌ من شُعراء الطبقة الثانية».
    - lemma: "مِقْدَار"
      generation_method: ishtiqaq
      justification: >
        مشتقَّ من جذر (قدر) على وزن مِفْعَال، ويدلُّ على القياس والكمِّيَّة.
        يُستعمَل بمعنى مبلغ الشيء ونهايته، وهو يُفيد جانب الكمِّيَّة في المفهوم المُعرَّف.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "درجة"
      confirm:
        - text: "«الدَّرَجَةُ: الْمَنْزِلَةُ والمرْتَبَةُ فى الشَّرَفِ؛ الرِّفْعَةُ في الْمَنْزِلَةِ؛ (فى السُّلَّم الوظيفيّ): مَرْتَبةٌ فيه تُمَثِّلُ مُستوًى ما؛ (فى علم الفَلَك): جُزْءٌ من ثلاث مِئَةٍ وسِتِّينَ جُزْءا من دَوْرَة الفَلَك؛ ودَرَجَةُ الحَرارَةِ أو الرُّطُوبَةِ: جُزْءٌ مِن أجزاء المِقياسِ الخاصِّ بهما»"
          source: "المعجم الكبير [OCR]"
        - text: "«المِرْقاة الرُّتْبَةُ؛ له عليه دَرَجة: منزلة ورتبة فى الشرف؛ درجةُ الحرارة أو الرطوبة: جزء من أجزاء المقياس الخاص بهما»"
          source: "المعجم الوسيط [OCR]"
        - text: "«الدرجة: محركة نحو المنزلة لكن يقال للمنزلة درجة إذا اعتبرت بالصعود دون الامتداد على البسيطة كدرجة السطح والسلم، ويعبر بها عن المنزلة الرفيعة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الدّرجة: [Rank, degree, step] بفتح الدال والراء المهملتين في اللغة پايه ومرتبه، الدرجات والدرج جمع، ومنه درجة الدواء وهي مرتبة في التأثير»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "درجة — en: degree | domain: Mathematics and Astronomy"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ARABTERM)"
        - text: "درجة — en: grade | domain: Geology"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (ARABTERM)"
      expands:
        - text: "«ودَرَجَةُ الصَّوْتِ (فى الموسيقى): الحالُ التى عليها تَمْديدُ نَغْمَتِه مِنْ حَيْثُ مِقدارِها فى طَبَقَةٍ مُعَيَّنَةٍ مِن الحِدَّة أو الثِّقَل»"
          source: "المعجم الكبير [OCR]"
          addition: "يوسِّع الدلالة لتشمل الموقع على سلَّم الصوت، مما يعزِّز ملاءمتها للسينسِت"
        - text: "«والدَّرَجَةُ العِلْمِيَّةُ: لقبٌ علميٌّ أو مَرْتَبَةٌ أكاديميَّةٌ تمنحُها جامعةٌ أو كُلِّيَّةٌ»"
          source: "المعجم الكبير [OCR]"
          addition: "يُثبِت الاستعمال المؤسَّسي للّمة في سياق الرتب والمستويات"

    - lemma: "مرتبة"
      confirm:
        - text: "«المَرْتَبَةُ: الرُّتْبَةُ، وهى المَنْزِلة والمكانة؛ المَرْقَبَةُ؛ قال الخَلِيلُ: المَراتِبُ فى الجبال والصَّحارى: هي الأعلامُ التى تُرَتَّبُ فيها العُيونُ والرُّقباءُ»"
          source: "المعجم الكبير [OCR]"
        - text: "«المُرْتَبَةُ: الرُّتْبَة؛ المَرْقَبَة؛ كلُّ مقام شديد؛ (في علم الحساب): الموضع الذى يكون العدد المطلق فيها ذا قيمة خاصة بِحَسَبِها»"
          source: "المعجم الوسيط [OCR]"
        - text: "«الْمرتبَة: الرُّتْبَة والمرقبة وكل مقَام شَدِيد وَفِي الحَدِيث (من مَاتَ على مرتبَة من هَذِه الْمَرَاتِب بعث عَلَيْهَا) أَي الْعِبَادَات الشاقة؛ وَ(فِي علم الْحساب) الْموضع الَّذِي يكون الْعدَد الملطق فِيهِ ذا قيمَة خَاصَّة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "مَرْتَبَة — en: rank | domain: The Unified Medical Dictionary"
          source: "المعجم الطبي الموحد (ARABTERM)"
        - text: "مَرْتَبَة — en: status | domain: Education"
          source: "مسرد التربية (ARABTERM)"
      expands:
        - text: "«مرتبة الإنسان الكامل: عبارة عن جميع المراتب الإلهية والكونية، من العقول والنفوس الكلية والجزئية، ومراتب الطبيعة، إلى آخر تنزيلات الوجود»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يُبيِّن أن المرتبة تُستعمَل للدلالة على الموقع في سلسلة هرمية مرتَّبة"

    - lemma: "مستوى"
      confirm:
        - text: "«مُسْتَوى المعيشة (فى علم الاقتصاد) Standard of living: التكاليف المادية للحياة, وهى تختلف بحسب ظروف كلِّ مجتمع وأحواله»"
          source: "المعجم الكبير [OCR]"
        - text: "«مُسْتَوى سطح البحر (فى الجغرافيا) Sea level: الْمُسْتَوى المتوسطُ لسطح البحر ما لم يتأثَّر بمدٍّ أو جَزْر أو موج أو رياح»"
          source: "المعجم الكبير [OCR]"
        - text: "مستوى شدة الصوت — en: sound intensity level | domain: Electropedia"
          source: "موسوعة الكهرباء IEC 60050 (ARABTERM)"
        - text: "معبر تقاطع بنفس المستوى — en: level crossing; level grade crossing | domain: Electropedia"
          source: "موسوعة الكهرباء IEC 60050 (ARABTERM)"
      expands:
        - text: "«مُسْتَوى الصِّفْر (فى الجغرافيا) Datum level: المستوى الذى تُنسب إليه ارتفاعاتُ سطح الأرض»"
          source: "المعجم الكبير [OCR]"
          addition: "يُبيِّن أن المستوى يُفيد موقعاً مرجعياً على سلَّم قياسي — وهو جوهر معنى السينسِت"

    # ── مرشَّحات المرحلة ١ ────────────────────────────────────

    - lemma: "منزلة"
      confirm:
        - text: "«المَنْزِلَةُ: الدارُ؛ المكانة والمرتبة»"
          source: "المعجم الوسيط [OCR]"
        - text: "«الْمنزلَة: الدَّار والمكانة والمرتبة (ج) منَازِل؛ يُقَال لَهُ منزلَة عِنْد الْأَمِير: مكانة وهو رفيع الْمنَازل المراتب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"

    - lemma: "رتبة"
      confirm:
        - text: "«الرُّتْبَةُ: المَنْزِلَةُ والمكانة؛ درجَةٌ مِن دَرجاتِ الشَّرفِ تَمْنَحُها الدَّولَةُ مَن تَرَى تَكْرِيمه»"
          source: "المعجم الكبير [OCR]"
        - text: "«الرُّتْبَة: المنزلَة والمكانة أَو الْمنزلَة الرفيعة؛ ودرجة من درجات الشّرف تمنحها الدولة من ترى تكريمه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "رُتْبَة — en: Rank | domain: Data and AI Glossary: «الموضع الترتيبي لصنف في نموذج تعلُّم الآلة الذي يرتب الأصناف من الأعلى إلى الأدنى»"
          source: "معجم البيانات والذكاء الاصطناعي (ARABTERM)"
      contradicts:
        - text: "رتبة — en: order (taxa) | domain: AGROVOC / Biology: «إحدى وحدات التصنيف في عالم الأحياء وسط بين الفصيلة وبين الطائفة»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (ARABTERM)"
          conflict: "التخصُّص البيولوجي لرتبة (= order) يُضعِف استخدامها لمعنى «موقع على سلَّم قياس» العام"

    - lemma: "طبقة"
      confirm:
        - text: "«الطَّبَقَةُ: الْمَرْتَبَةُ والدَّرَجَةُ»"
          source: "المعجم الكبير [OCR]"
        - text: "«الطَّبَقَة: الجيل بعد الجيل أو القوم المتشابهون في سن أو عهد؛ الحال والمنزلة؛ المرتبة والدرجة»"
          source: "المعجم الوسيط [OCR]"
        - text: "«طَبَقة: من (ط ب ق) جماعة من الناس على مستوى واحد في العلم أو الحرفة أو الصناعة والمرتبة والدرجة والحال والمنزلة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "طبقة — en: layer / stratum (dominant in ARABTERM across Geology, Chemistry, IT, Medical)"
          source: "مصطلحيات ARABTERM المتعددة"
          conflict: "المعنى السائد في الاستعمال المعاصر هو «طبقة جيولوجية/مادية» وليس «موقع على سلَّم قياسي»؛ مما يُفضي إلى اشتراك لفظي مُضِرّ"

    - lemma: "مقدار"
      confirm:
