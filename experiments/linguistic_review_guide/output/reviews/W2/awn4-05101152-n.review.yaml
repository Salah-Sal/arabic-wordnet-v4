          conflict: "المقدار يعني «مثيل الشيء في الكمية» أي الكمية ذاتها، لا الموقع على سلَّم. هذا تناقض مع المفهوم المُعرَّف الذي يدور حول الموقع/المنزلة لا القياس الكمي."


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "درجة"
      decision: confirmed
      decision_reason: >
        موثَّقة في المعجم الكبير والمعجم الوسيط بصريح العبارة «جُزْءٌ مِن أجزاء المِقياسِ الخاصِّ بهما»
        للحرارة والرطوبة — وهذا يُطابق تعريف السينسِت مباشرةً. مستعملة على نطاق واسع في
        السياقات العلمية والتقنية (درجة الحرارة، درجة الحموضة، درجة الصوت). تجتاز جميع
        بوابات جودة المصطلح: اطِّراد، يُسر تداول، ملاءمة، أصالة عربية، اشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «دَرَجَة» تُبرِّز بُعد التدرُّج والصعود المتراكم — أُخِذَت من درَجَ الصبيُّ إذا مشى مشيته خطوة
        خطوة. تُستعمَل للمستويات القابلة للعدِّ والتقدير الدقيق (درجة الحرارة، الدرجة العلمية)،
        وتنطوي على دلالة التصاعد المنتظم على سلَّم ذي خطوات محدودة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَرَجَة"

    - lemma: "مرتبة"
      decision: confirmed
      decision_reason: >
        موثَّقة في المعجم الكبير والمعجم الوسيط بمعنى «الرُّتْبَة والمَنْزِلة والمكانة».
        تعريف المعجم الوسيط «الموضع الذى يكون العدد المطلق فيها ذا قيمة خاصة» يُثبِت
        دلالتها الصريحة على الموقع في سلَّم القيم، وهو قلب معنى السينسِت. تجتاز جميع
        بوابات جودة المصطلح وتوازن «دَرَجَة» في الاستعمال المعياري.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «مَرْتَبَة» تُركِّز على الهرميَّة والتصنيف في سُلَّمٍ مُنظَّمٍ ذي مستويات مُحدَّدة سلفاً.
        تغلب عليها دلالة المَقامِ الاجتماعي أو الوظيفي أو التنظيمي (مرتبة الآحاد، مراتب الشرف)،
        وتحمل ظلالاً من التكريم والتقدير أكثر مما تحمله «دَرَجَة» من دلالة التسلسل التصاعدي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَرْتَبَة"

    - lemma: "مستوى"
      decision: confirmed
      decision_reason: >
        موثَّق في المعجم الكبير (OCR) في تركيبات مستقرَّة: «مُسْتَوى المعيشة» و«مُسْتَوى سطح
        البحر» — وكلاهما يُجسِّد المفهوم المُعرَّف (موقع على سلَّم قياسي). مستعمَل شيوعاً في
        العربية المعاصرة مرادفاً لـ"level" دون اشتراك لفظي. اشتقاقُه من (استوى) على وزن
        اسم المفعول يُفيد الوصول إلى موضع محدَّد على سلَّم. مصطلح ثابت ومنتشر في العلوم
        الفيزيائية (مستوى الصوت، مستوى الطاقة) والاقتصاد والتعليم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «مُسْتَوى» يُفيد الامتداد الأفقي والثبات عند حدٍّ معيَّن — مأخوذٌ من استوى الشيءُ أي
        استقرَّ واعتدل. يُستعمَل للدلالة على الحالة الكلِّية لمتغيِّر ما أو موقعه العام على سلَّم متَّصِل
        (مستوى المعيشة، مستوى الصوت)، بينما لا يحمل دلالة التدرُّج الخطواتي الذي في «دَرَجَة».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَوى"

    # ── مرشَّحات المرحلة ١ ────────────────────────────────────

    - lemma: "مَنْزِلَة"
      source: stage1
      decision: removed
      decision_reason: >
        «مَنْزِلَة» موثَّقة بمعنى المكانة والمرتبة لكنها مخصَّصة أساساً للمكانة الاجتماعية والتقديريَّة
        («له منزلة عند الأمير»)، ولا تنسجم مع سياق «الموقع الكمِّي على سلَّم القياس» كما في درجة
        الحرارة أو درجة الجودة. إضافتها لن تُضيف قيمةً دلاليةً تمييزيَّة بل ستُربِك المجموعة
        بمصطلح ذي حمولة تقديريَّة-اجتماعية لا قياسية.

    - lemma: "رُتْبَة"
      source: stage1
      decision: removed
      decision_reason: >
        «رُتْبَة» مرادفٌ قوي لـ«مَرْتَبَة» بشهادة المعاجم نفسها («الرَّتَبُ كالدَّرَجِ»)؛ إضافتها
        تُقدِّم ترادفاً أفقياً مع «مَرْتَبَة» دون فارق دلالي مسوِّغ. فضلاً عن ذلك، يطغى عليها
        الاستعمال البيولوجي (رتبة = order) في العربية العلمية الحديثة مما يُفضي إلى التباس.

    - lemma: "طَبَقَة"
      source: stage1
      decision: removed
      decision_reason: >
        تمتلك «طَبَقَة» معنى ثانوياً «المرتبة والدرجة» لكنَّ معناها الأساسي والسائد هو الطبقة
        الجيولوجية أو المادية أو الاجتماعية (layer/stratum/class) — وهذا الاشتراك اللفظي مُضِرٌّ
        جداً لمجموعة ترادفية تُعنى بالموقع على سلَّم الشدَّة والجودة. اختبار الاستبدال يُثبِت
        عدمَ التبادليَّة: «طبقة الحرارة» لا تُعادل «درجة الحرارة».

    - lemma: "مِقْدَار"
      source: stage1
      decision: removed
      decision_reason: >
        «مِقْدَار» يدلُّ على الكمِّيَّة المطلقة (مثيل الشيء في العدد والكيل والوزن) لا على
        «الموقع» في سلَّم قياس. الفرق جوهري: المفهوم المُعرَّف هو الموضع/المنزلة على السلَّم
        لا القيمة الرقمية ذاتها. المقدار مناسب لسينسِتات «كمية» لكنَّه ليس مرادفاً لـdegree/level
        بمعنى الموقع. أدلة التناقض من المعجم الوسيط دامغة.


