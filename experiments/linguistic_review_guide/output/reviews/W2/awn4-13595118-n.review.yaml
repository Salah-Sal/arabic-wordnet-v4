    - lemma: "فَلْكَنَة"
      entry_id: "{auto}"
      root: "فلكن"
    - lemma: "كَبْرَتَة"
      entry_id: "{auto}"
      root: "كبر"
      maqayis_quote: "«الْكَافُ وَالْبَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الصِّغَرِ...»"
  per_sense:
    - lemma: "فَلْكَنَة"
      sense_id: "{auto}"
      nuance: "مصطلح معرب شائع الاستخدام لوصف عملية المعالجة الحرارية للمطاط بوجه عام."
