    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح معرب شائع الاستخدام لوصف عملية المعالجة الحرارية للمطاط بوجه عام.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح مشتق من مادة الكبريت المستخدمة في العملية، ويغلب استخدامه في السياقات الكيميائية والصناعية الدقيقة.","mwe":false}'
