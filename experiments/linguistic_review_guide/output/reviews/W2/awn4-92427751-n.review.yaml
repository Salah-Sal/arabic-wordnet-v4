# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التقييم الأولي (بعد قراءة الملف الكامل)
  assessment:
    concerns:
      - "اللمّة الوحيدة 'الطابع الأرجنتيني' مركب وصفي (MWE) لا يُثبَّت معجمياً بوصفه وحدة اصطلاحية ثابتة — يفشل اختبار السكّ واختبار التثبيت."
      - "استخدام 'جودة' في التعريف العربي خطأ دلالي: 'جودة' في العربية تعني الكمال والنضج لا 'property/quality' — الصواب 'صفة' أو 'خاصية'."
      - "المجموعة خالية من الربط بـ ILI، مما يُضعف التوافق مع شبكات لغوية أخرى."
      - "التعريف الحالي قائم على نمط الترجمة الحرفية (حالة أو جودة كون...) لا على أسلوب المعجم العربي."

    observations: >
      المجموعة تُمثّل مفهوماً مجرداً هو 'الأرجنتينية' — الصفة القومية المنسوبة إلى الأرجنتين.
      هذا النوع من المفاهيم يُعبَّر عنه في العربية المعيارية بالمصدر الصناعي (الاسم المنسوب + ياء النسب + تاء التأنيث):
      كالعروبة والفرنسية والأمريكية. اللمّة الموجودة 'الطابع الأرجنتيني' وإن كانت مفهومةً وفصيحةً،
      إلا أنها تُحيل إلى 'الطابع القومي للأرجنتين' (الخصائص المُشخَّصة) لا إلى المفهوم المجرد 'خاصية كون الشيء أرجنتينياً'.
      وقد اتضح بعد الاطلاع على الملف الكامل أن المرشح الثاني الذي ولّدته أعمى (الطابع الأرجنتيني)
      يطابق اللمّة الموجودة.

  # ب. اللمّات المرشحة (مولَّدة أعمى من التعريف قبل الاطلاع على اللمّات الموجودة)
  blind_candidates:

    - lemma: "الأَرْجَنْتِينِيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي من الصفة المنسوبة 'أَرْجَنْتِيني' (اسم منسوب + يَّة)؛ الوزن المنتج
        لتجريد الخصائص القومية في العربية المعاصرة (العروبة، الفرنسية، الهندية، الأمريكية).
        يُعبِّر بدقة عن 'حال كون الشيء أرجنتينياً' دون دلالة زائدة.

    - lemma: "الطَّابَع الأَرْجَنْتِيني"
      generation_method: tarkib
      justification: >
        مركب وصفي (wasfi) من 'الطابع' (بمعنى الخلق الغالب والسجية) و'الأرجنتيني'.
        يوازي 'الطابع القومي' الوارد في معاجم عربية. لكنه أوسع دلالةً من المفهوم المجرد
        المطلوب. [تبيّن لاحقاً أنه يطابق اللمّة الموجودة في المجموعة].

    - lemma: "الهُوِيَّة الأَرْجَنْتِينِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي يربط 'الهوية' (مجموع السمات المميزة لجماعة) بالانتماء الأرجنتيني.
        أوسع دلالةً من المطلوب وأقرب إلى الخطاب السياسي والاجتماعي.

    - lemma: "السِّمَة الأَرْجَنْتِينِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من 'السمة' (الخصيصة المميزة) و'الأرجنتينية'. يُحيل إلى الصفات الخاصة
        المُتجلّية في الانتماء الأرجنتيني، غير أن التعبير وصفي حر لا وحدة معجمية ثابتة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
# Q1: مطابقة دفعية — headword_norm IN (الطابع الأرجنتيني وصيغه، الارجنتينية، الهوية الارجنتينية، السمة الارجنتينية، الطابع، الارجنتيني، الارجنتين)
# Q2: جسر إنجليزي — translation_en:"Argentine" OR "Argentineness"
# Q3: إثراء بـ entry_id — تعريفات وأمثلة لمداخل الطابع والأرجنتيني
# Q4: مقاييس اللغة — جذر طبع (dictionary_id=151)

stage2_evidence:
  per_lemma:

    - lemma: "الطابع الأرجنتيني"
      confirm:
        - text: "«الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ»"
          source: "المعجم الكبير (مجمع اللغة العربية) — مادة الطابع"
        - text: "«الطَّابِعُ القَوْمِيّ: خصائصُ ظاهرةٌ تميِّزُ مجتمعًا ما, كقولنا: إن المصريّ يمتاز بكذا وكذا»"
          source: "المعجم الكبير — مادة الطابع (مثال استعمالي)"
        - text: "«الخُلُق الغالب»"
          source: "المعجم الوسيط — مادة الطابع (المعنى الثالث)"
        - text: "«يُقَال لَهُ طَابع حسن — الطابع والطبيعة»"
          source: "المعجم الوسيط (رواية حوراماني) — مادة الطابع"
      expands:
        - text: "«الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ مَثَلٌ عَلَى نِهَايَةٍ يَنْتَهِي إِلَيْهَا الشَّيْءُ حَتَّى يُخْتَمَ عِنْدَهَا... ثُمَّ يُقَالُ عَلَى هَذَا: طَبْعُ الْإِنْسَانِ وَسَجِيَّتُهُ»"
          source: "مقاييس اللغة لابن فارس — مادة طَبَعَ"
          addition: "يكشف الجذر اللغوي أن 'الطابع' يُحيل إلى الغاية المختومة التي ينتهي إليها الشيء، ومنها سجية الإنسان وطبيعته — وهذا يُسند معنى الخاصية المميزة الثابتة."

    - lemma: "الأَرْجَنْتِينِيَّة"
      expands:
        - text: "«(1) الأرجنتينيّ (2) أرجنتينيّ.»"
          source: "المورد الحديث (2008) — ترجمة 'Argentine' [entry_id=671104]"
          addition: "الصفة المنسوبة 'أرجنتيني' موثّقة في المعجم الحديث، وهي الأساس الاشتقاقي الذي تُبنى عليه الأرجنتينية بالمصدر الصناعي (+ يَّة). غياب الشكل المجرد 'الأرجنتينية' من المعاجم لا يدل على عدم صحته بل على ندرة الحاجة إليه معجمياً."

    - lemma: "الهُوِيَّة الأَرْجَنْتِينِيَّة"
      evidence_status: "no_material_found"

    - lemma: "السِّمَة الأَرْجَنْتِينِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "الطابع الأرجنتيني"
      decision: removed
      decision_reason: >
        رُفض لثلاثة أسباب متضافرة:
        (١) اختبار السكّ: يمكن إبدال 'الطابع' بـ'الهوية' أو 'السمة' وتظل العبارة صالحة كوصف
        (الهوية الأرجنتينية / السمة الأرجنتينية)، فدلّ ذلك على أنها ليست وحدة معجمية مسكوكة.
        (٢) اختبار التثبيت المعجمي: النمط 'الطابع + نسبة' منتج قياساً (الطابع الفرنسي / الياباني / البرازيلي)
        ولا يُشكّل وحدة ثابتة مسجّلة بذاتها.
        (٣) الدقة الدلالية: 'الطابع الأرجنتيني' يُحيل إلى السمات الشخصية والثقافية الظاهرة (الخلق القومي)،
        وهو أوسع وأكثر تشخيصاً من المفهوم المجرد 'خاصية كون الشيء أرجنتينياً'.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١ ──
    - lemma: "الأَرْجَنْتِينِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصدر الصناعي من الصفة المنسوبة (أَرْجَنْتِيني + يَّة) هو الصيغة العربية المعيارية لتعبير
        الخصائص القومية المجردة. النمط عالي الإنتاجية وذو طابع اطّرادي لا استثناء فيه (العروبة،
        الفرنسية، الأمريكية، الصينية). الصفة المنسوبة 'أرجنتيني' موثقة في المورد الحديث.
        لا تعارض مع أي نص معجمي. الوزن الصرفي (فَعَلِيَّة من المنسوب) يُلائم الوظيفة الدلالية
        لمفهوم الخاصية المجردة تمام الملاءمة. اجتاز اختبار الاشتقاقية وبوابة جودة المصطلح
        (الاطراد، يُسر التداول، الملاءمة، إيثار العربي، الاشتقاقية).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة بعد حذف 'الطابع الأرجنتيني'. تُركّز على البُعد المجرد:
        الخاصية القومية الجوهرية للانتماء، على خلاف اللمّة المحذوفة التي أحالت إلى الطابع
        الثقافي والسلوكي المُشخَّص.
      actions:
        - command: create_entry
          params:
            lemma: "الأَرْجَنْتِينِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── المرشحات المرفوضة ──
    - lemma: "الهُوِيَّة الأَرْجَنْتِينِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مركب وصفي يفشل في اختبار التثبيت المعجمي: 'الهوية الفرنسية / البرازيلية' تعمل بالقياس ذاته،
        مما يدل على أنها عبارة وصفية منتجة لا مصطلح ثابت. كما أن 'الهوية' أوسع دلالةً مما تقتضيه
        المجموعة (تشمل الانتماء السياسي والثقافي والأيديولوجي).

    - lemma: "السِّمَة الأَرْجَنْتِينِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مركب وصفي حر يفشل في اختبار السكّ: يمكن إبدال 'السمة' بـ'الصفة' أو 'الخاصية' وتبقى
        العبارة صالحة. لا دليل على تثبيته كوحدة معجمية مستقلة في أي مصدر.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
# (تعالج فقط اللمّات المؤكدة: الأَرْجَنْتِينِيَّة)
stage4_content:

  definition:
    current: "حالة أو جودة كون الشيء أرجنتينياً"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من نمط WordNet الإنجليزي (the state or quality of being...).
        يعاني من خطأين: (أ) 'جودة' لا تعني 'quality' بمعنى الخاصية في العربية بل تعني الكمال
        والنفاسة؛ (ب) النمط التعريفي (حالة كون الشيء كذا) ركيك أسلوباً ولا يتوافق مع المعجم العربي.
        يُستبدل بتعريف مصطلحي يتسق مع الجنس القريب (خاصية جوهرية) وأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: >
          خَاصِّيَّةٌ جَوْهَرِيَّةٌ مُشْتَرَكَةٌ بَيْنَ كُلِّ مَا يَنْتَمِي إِلَى الأَرْجَنْتِينِ مِنْ أَفْرَادٍ
          وَأَشْيَاءَ وَأَعْمَالٍ، مُتَجَلِّيَةً فِيمَا يُمَيِّزُهُمْ مِنْ سِمَاتٍ وَطَنِيَّةٍ وَثَقَافِيَّةٍ خَاصَّةٍ
          بِهَذِهِ الدَّوْلَةِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            خَاصِّيَّةٌ جَوْهَرِيَّةٌ مُشْتَرَكَةٌ بَيْنَ كُلِّ مَا يَنْتَمِي إِلَى الأَرْجَنْتِينِ مِنْ أَفْرَادٍ
            وَأَشْيَاءَ وَأَعْمَالٍ، مُتَجَلِّيَةً فِيمَا يُمَيِّزُهُمْ مِنْ سِمَاتٍ وَطَنِيَّةٍ وَثَقَافِيَّةٍ خَاصَّةٍ
            بِهَذِهِ الدَّوْلَةِ.

  examples:
    per_lemma:
      - lemma: "الأَرْجَنْتِينِيَّة"
        examples:
          - text: "تَجَلَّتِ الأَرْجَنْتِينِيَّةُ جَلِيَّةً فِي كُلِّ تَفَاصِيلِ المَهْرَجَانِ، مِنَ الرَّقَصَاتِ الشَّعْبِيَّةِ إِلَى النَّكَهَاتِ التَّقْلِيدِيَّةِ الأَصِيلَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَجَلَّتِ الأَرْجَنْتِينِيَّةُ جَلِيَّةً فِي كُلِّ تَفَاصِيلِ المَهْرَجَانِ، مِنَ الرَّقَصَاتِ الشَّعْبِيَّةِ إِلَى النَّكَهَاتِ التَّقْلِيدِيَّةِ الأَصِيلَةِ."


