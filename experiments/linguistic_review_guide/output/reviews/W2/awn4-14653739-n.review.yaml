stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمة واحدة فقط، وهي تعريب مباشر للاسم الأجنبي."
    observations: "عنصر الأستاتين هو أثقل الهالوجينات، ويسمى في العربية 'أستاتين' كتعريب قياسي لـ Astatine. الأدلة المعجمية تؤكد هذا الاسم في المعاجم العلمية المتخصصة (كيمياء، صيدلة، طب)."
  blind_candidates:
    - lemma: "أَسْتَاتِين"
      generation_method: taarib
      justification: "التعريب القياسي لاسم العنصر الكيميائي (Astatine)."
    - lemma: "أَسْتَاتِينِيُوم"
      generation_method: taarib
      justification: "صيغة تعريبية محتملة بإضافة اللاحقة المعتادة للعناصر (-ium)."
    - lemma: "عُنْصُر الأَسْتَاتِين"
      generation_method: tarkib
      justification: "تعبير وصفي مركب يشيع استخدامه في السياقات العلمية."
    - lemma: "أَسْتَاتُون"
      generation_method: taarib
      justification: "صيغة تعريبية بديلة قديمة أو نادرة لبعض الهالوجينات."

