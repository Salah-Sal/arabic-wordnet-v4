    assessment:
      decision: revise
      reason: "لتحسين الصياغة المعجمية وإضافة العدد الذري لزيادة الدقة العلمية."
    authored:
      - type: terminological
        text: "عنصرٌ كيميائيٌّ من فصيلة الهالوجينات، وهو مُشِعٌّ غير مستقر، عدده الذري (85)، ينتج عن تحلل اليورانيوم والثوريوم."
