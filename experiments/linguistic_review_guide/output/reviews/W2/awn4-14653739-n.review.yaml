        params: {synset_id: "awn4-14653739-n", definition_index: 0, text: "عنصرٌ كيميائيٌّ من فصيلة الهالوجينات، وهو مُشِعٌّ غير مستقر، عدده الذري (85)، ينتج عن تحلل اليورانيوم والثوريوم."}
