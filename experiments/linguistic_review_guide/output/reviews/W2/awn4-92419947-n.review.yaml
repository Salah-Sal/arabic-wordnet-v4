          addition: >
            يُثبت أن «بهرج» لفظٌ قديم يعني الرديء والباطل، وأنه معرَّب. هذا يُضعف صلاحيته
            كأساس لمصطلح عربي جديد وفق مبدأ «إيثار العربي على المعرَّب».
        - text: "«البَهْرَج: الباطل والرديء من الشيء. يُقال: كلام بهرج، وعمل بهرج.
                 ودم بهرج: هدر»"
          source: "أساس البلاغة للزمخشري"
          addition: >
            يُثبت استعمال «بهرج» مجازاً لكل رديء أو باطل، لكنه لا يدلّ على غياب
