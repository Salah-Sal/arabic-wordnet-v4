      contradicts:
        - text: "«ما يُشْكَى منه. البقيَّة من الشيء»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: >
            اللمّة مشتقّة من جذر شَكَا/يَشْكُو (التوجّع)، لا من شَكَّ (الشكّ والارتياب).
            معناها «ما يُشكَى منه» أو «بقيّة الشيء»، وهو مغاير تمام المغايرة لمعنى المجموعة.
        - text: "«إظهارُ ما يَصِفُك به غيرُك من المكروه. ما يُشْتَكَى منه. البقيَّةُ من الشَّيء.
                 يُقال: إنّ فيه لشَكِيَّةً من الودِّ وغيره»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: >
            المعجم الكبير يضبطها بكسر الشين والكاف (الشِّكِيَّة) من شَكا يَشكُو، وهو جذر
            مختلف كلياً عن شَكَّ يَشُكُّ. لا أثر للدلالة على الشك في الصحة أو انعدام الشرعية.

