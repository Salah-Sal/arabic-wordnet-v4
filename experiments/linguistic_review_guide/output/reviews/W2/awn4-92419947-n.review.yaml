          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يُثبت أن «منحول» صفةٌ موثَّقة بمعنى «المنسوب إلى غير صاحبه»، وهو الجانب الأدبي
            للمفهوم (النصوص المنسوبة زوراً). لكنّ منحوليّة بوصفها مصدراً صناعياً مجرَّداً
            غير مدوَّنة.
        - text: "«(1) أبوكريفاويّ: مشكوك في صحته (2) منحول؛ موضوع»"
          source: "المورد الحديث (2008) — ترجمة apocryphal"
          addition: >
            يُؤكّد استعمال «منحول» بمعنى مشكوك الصحة والنسبة في السياق الأدبي والديني
            في المعجمية الحديثة.
        - text: "«(1) نَغِل؛ غير شرعي (2) زائف؛ مزوَّر؛ كاذب (3) موضوع؛ منحول spurious lines
                 and passages (4) غير منطقي»"
          source: "المورد الحديث (2008) — ترجمة spurious"
          addition: >
            يُثبت أن «منحول» أحد المقابلات العربية لـ spurious في دلالتها الأدبية تحديداً
