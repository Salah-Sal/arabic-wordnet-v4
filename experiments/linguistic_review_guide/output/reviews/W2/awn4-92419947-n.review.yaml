stage1_review:
  assessment:
    concerns:
      - "لمّة «شكية» مستخرجة من جذر شَكَا/يَشْكُو (التوجّع والشكوى)، لا من جذر شَكَّ (الشك)،
         فهي تعني «ما يُشكَى منه» أو «البقيّة من الشيء»، لا علاقة لها بالمجموعة الترادفية."
      - "لمّة «منحولية» مصدر صناعي مُصطنع غير موثَّق معجمياً كمفردة مستقلة."
      - "التعريف الحالي يجمع ثلاثة مفاهيم متمايزة (الشك في الصحة، وافتقاد السلطة، وعدم الاعتراف
         القانوني)؛ يمكن توحيدها في صياغة أكثر إيجازاً وأدقّ."
      - "غياب المصطلح الأكثر شيوعاً في العربية المعاصرة لهذا المعنى وهو «اللاشرعيّة»."
    observations: >
      المجموعة تمثّل مفهوماً مجرّداً هو «الخاصيّةُ المشتركة بين كل ما هو مشكوك في صحّته
      أو فاقد السند الشرعي أو القانوني». يقابله في الإنجليزية spuriousness وillegitimacy
      بمعناهما المجرّد. المشكلة الجوهرية هي اعتماد «شكيّة» التي تعود إلى الشكوى لا الشكّ،
      وهو خلط اشتقاقي مُخلّ. «منحوليّة» وإن كانت مناسبة دلاليًّا من ناحية نسب الشيء إلى
      غير أصله، إلا أنها مولَّدة ولا مسوّغ لإدراجها دون بديل أقوى. يستلزم الأمر استبدال
      «شكيّة» واستحضار «اللاشرعيّة» المعجمية الموثَّقة.
  blind_candidates:
    - lemma: "بَهْرَجِيَّة"
      generation_method: majaz
      justification: >
        «بهرج» لفظٌ عربي معرَّب قديم يعني الرديء والباطل والمزيَّف؛ وُظِّف مجازياً في كلٍّ
        من الدراهم الرديئة والأعمال الباطلة. بَهْرَجِيَّة على المصدر الصناعي = خاصيّة الشيء
        الزائف الذي لا أصل صحيح له. يُحيي اللفظَ الكلاسيكيَّ الميّت تجنّباً لاشتراك لفظي.
    - lemma: "رِيبِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقّة من «ريبة/ريب» (الشك والتهمة) على المصدر الصناعي وزن فَعَلِيَّة.
        جذر «ريب» يدلّ على الشك والخوف معاً (مقاييس اللغة)، مما يجعله أقرب للمعنى المراد
        من «الشك في الصحة والمشروعية» مقارنةً بالجذر شك وحده.
    - lemma: "زَيْفِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقّة من «زيف» (الدرهم المردود الرديء الفضة) على المصدر الصناعي.
        «الزائف» و«الزيف» مستعملان في السياقين المادي والمجازي للدلالة على ما لا يقبله
        المعيار ولا تُقرّه السلطة؛ والزيفيّة تُجرّد هذه الخاصيّة.
    - lemma: "اللَّاشَرْعِيَّة"
      generation_method: tarkib
      justification: >
        مركّب سلبيٌّ (نفي + اسم): لا + شرعيّة = نفي الشرعيّة. التركيب من النمط
        الإضافي السلبي الشائع في العربية المعاصرة. تُعبّر عن غياب السند القانوني أو الشرعي
        المحدَّد في التعريف (يفتقر إلى السلطة، لا يُعتبر قانونياً).


