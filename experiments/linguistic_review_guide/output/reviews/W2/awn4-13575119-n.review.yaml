    assessment:
      decision: revise
      reason: >
        كلمة "عضوية" توقع في اللبس مع الكيمياء العضوية (organic chemistry)؛ والأدق "حيوية" للدلالة
        على ما يجري داخل الكائنات الحية. التعريف الحالي كالق من الإنجليزية دون تحديد الفاعل الخلوي
        (الخلايا الغُدِّية) ودون إبراز الطابع التصنيعي الذي يُميّز secretion عن excretion.
    authored:
      - type: terminological
        text: "عَمَلِيَّةٌ حَيَوِيَّةٌ تَقُومُ فيها الخَلايا بتصنيع مادَّةٍ كيميائيَّةٍ وإطلاقِها إلى الوسط المحيط بها أو إلى الدَّوْرَة الدَّمَوِيَّة"
