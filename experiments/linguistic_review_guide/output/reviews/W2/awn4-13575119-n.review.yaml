          والمخاط وإطلاقها إلى الفراغ خارج الخلية أو إلى الدَّورة الدَّمَوِيَّة؛ وهي عكس الامتصاص،
          وتنقسم إلى إفراز داخلي (endocrine) تُفرز فيه المادة مباشرةً في الدم،
