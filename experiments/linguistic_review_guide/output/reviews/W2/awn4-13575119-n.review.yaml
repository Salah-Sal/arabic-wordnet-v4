# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة 'إفراز' مكتوبة بدون تشكيل في السجل الحالي"
      - "بعض المعاجم الفنية تخلط بين 'إفراز' (secretion = تصنيع وإطلاق) و'إفراز/إخراج' (excretion = طرح فضلات)، مما قد يُسبب التباساً اصطلاحياً"
      - "المجموعة لا تحتوي إلا لمةً واحدة رغم وجود مصطلحات مرادفة محتملة تستحق الفحص"
    observations: >
      المجموعة تُعبّر عن المفهوم البيولوجي لعملية تصنيع مادة داخل الخلية وإطلاقها إلى الوسط المحيط —
      وهو ما يُعرف بـ secretion في المصطلح الإنجليزي. الجذر فَرَزَ (العزل والتمييز) يصف جوهر هذه
      العملية بدقة، وقد رسخ إفراز في المعجمية الطبية والحيوية العربية رسوخاً واسعاً. يضم الاسم الإنجليزي
      secernment إلى جانب secretion، والاثنان يُقابلهما إفراز بصورة وافية من حيث الأصل الجذري
      (عزل وإطلاق). التعريف الحالي وظيفي لكنه كالق من الإنجليزية يمكن تحسينه.

  blind_candidates:
    - lemma: "إِفْرَاز"
      generation_method: ishtiqaq
      justification: >
        من الجذر فَرَزَ (الفاء والراء والزاء: عزل الشيء عن غيره) على وزن إِفْعَال، وهو وزن المصدر
        المتعدي من الباب الرابع. يدلّ على إخراج الشيء بعد فصله وتمييزه — وهو جوهر العملية العضوية
        لتركيب مادة وإطلاقها. الاشتقاق قياسي وشائع في المعجمية الطبية والحيوية.
    - lemma: "إِدْرَار"
      generation_method: ishtiqaq
      justification: >
        من الجذر دَرَّ (تولُّد شيء عن شيء، خاصة اللبن والسوائل) على وزن إِفْعَال. يُستعمل كلاسيكياً
        للدلالة على سيلان السائل من مصدره العضوي (درَّ اللبنُ، درَّ العرق). قد يُغطي مفهوم 'إطلاق
        مادة من مصدرها الغُدِّي' وهو مكوِّن من مكوِّنَي العملية البيولوجية المطلوبة.
    - lemma: "نَتْح"
      generation_method: majaz
      justification: >
        نَتَحَ يعني رشح العرق ونضح السائل من مساماته (إحياء للفظ كلاسيكي). يمكن مجازاً تمديد معناه
        إلى إخراج الخلية مادةً من خلالها، كما يُستعمل في البيولوجيا للتعبير عن التسرب والرشح. المنتحة
        (المسام) تُعبّر عن مخارج الرشح الخلوي.
    - lemma: "تَفَرُّز"
      generation_method: ishtiqaq
      justification: >
        من الجذر فَرَزَ على وزن تَفَعُّل، وهو وزن يدلّ على الصيرورة والتحوّل الذاتي التدريجي.
        يُعبّر عن العملية الانعكاسية للانفصال والإطلاق كما تحدث داخل الخلية، ويمتاز عن إِفْرَاز
        (المصدر المتعدي) بإبراز البُعد الصيروري اللازم للعملية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات مُنفَّذة:
#  Q1 — مطابقة دفعية: افراز + الافراز + ادرار + الادرار + نتح + النتح + تفرز + التفرز
#  Q2 — جسر إنجليزي: secretion / secernment / biosynthesis / exudation / excretion
#  Q3 — FTS عربي: إفراز / الإفراز / إدرار / نضح / فرز
#  Q4 — مقاييس اللغة لابن فارس (dict 151): فرز / نتح / درر / حلب
stage2_evidence:
  per_lemma:
    - lemma: "إِفْرَاز"
      confirm:
        - text: "«كافراز الثدي للبن وافراز النبات لمختلف العصارات»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) [translation_en: secretion]"
        - text: "«(1) إفراز (2) المادة المفرزة (3) إخفاء.»"
          source: "المورد الحديث (2008) [translation_en: secretion]"
        - text: "«إِفْرَاز» [translation_en: secretion]"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إِفْرَاز» [translation_en: secretion]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«إفراز» [translation_en: secretion]"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«إفرَاز» [translation_en: secretion]"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«إفراز الصفراء: إفراز الكبد للصفراء.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«إفراز» [translation_en: secretion]"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
        - text: "«إفراز» [translation_en: secretion, domain: AGROVOC]"
          source: "المكنز الزراعي متعدد اللغات"
      contradicts:
        - text: "«عملية طرد الفضلات من الجسم عن طريق البول أو الغائط أو التعرق — تبرُّز (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) [translation_en: excretion]"
          conflict: >
            هذا المعجم يُعرّف إفراز بمعنى excretion (طرح الفضلات) لا secretion (تصنيع وإطلاق).
            خطأ اصطلاحي في هذا المصدر لا يعكس الاستعمال الطبي والحيوي الصحيح الذي تؤكده المعاجم
            الطبية والصيدلانية والبيطرية كلها.
        - text: "«إفراز» [translation_en: excretion, domain: Electropedia / Geology / Climate]"
          source: "موسوعة الكهرباء (IEC 60050) والمعجم الموحد للجيولوجيا ومسرد المناخ"
          conflict: >
            عدة معاجم تقنية متخصصة (هندسة، كهرباء، بيئة) تستعمل إفراز بمعنى excretion، مما يدلّ
            على اختلاط مصطلحي في المجالات غير الطبية. لا يؤثر في صحة المصطلح للمجال البيولوجي.
      expands:
        - text: "«الإِفْرازُ الدَّاخِلِيّ» [internal secretion] و«إِفْرازٌ خارِجِيّ» [external secretion]"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يتفرع إفراز إلى داخلي (endocrine) وخارجي (exocrine)، مما يُثبت أن المصطلح يغطي
            كلا الآليتين وليس نوعاً واحداً.
        - text: "«إفراز النصيب: هو عزله وجعله مميزاً.»"
          source: "التعريفات الفقهية للبركتي"
          addition: >
            يكشف عن الأصل الفقهي/اللغوي لإفراز (العزل والتمييز)، المنسجم تماماً مع معنى الجذر
            فَرَزَ (عزل الشيء عن غيره) ومع جوهر العملية البيولوجية المقصودة.
        - text: "«فرط الإفراز: إفراز زائد عن الحد السوي.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "يُثبت أن إفراز راسخ كحدٍّ معياري يُقاس إليه الزيادة والنقص في الإفراز البيولوجي."

    - lemma: "إِدْرَار"
      contradicts:
        - text: "«فى الخَيْل: أن يَرْفَعَ الفَرَسُ يَدَه حينَ يَعْنِقُ, وقد يضعُها فى الخَبَبِ, وهو من عُيوبِ الخيل التى تكون خِلْقَةً»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المعنى المُسجَّل في المعجم الكبير يخصّ عيباً في سير الخيل، لا صلة له بالإفراز
            البيولوجي. يدلّ على تشعّب دلالي مُخِلّ.
      expands:
        - text: "«إدرار الصفراء: إفراز الكبد للصفراء، ويشمل ذلك المكونات الصلبة والسائلة.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: >
            في السياق الطبي، إدرار يُستعمل مقيَّداً بسائل معيّن (إدرار البول، إدرار الصفراء)
            للدلالة على تحفيز إفراز ذلك السائل — لا على العملية العامة لتصنيع مادة وإطلاقها.
        - text: "«إدرار (البول): عملية زيادة إفراز البول.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "يؤكد أن إدرار يعني تحفيز أو زيادة إفراز سائل بعينه، لا العملية الأصيلة للتصنيع والإطلاق."
        - text: "«(دَرَّ) الدَّالُ وَالرَّاءُ ... يَدُلُّ عَلَى أَصْلَيْنِ: أَحَدُهُمَا تَوَلُّدُ شَيْءٍ عَنْ شَيْءٍ، وَالثَّانِي اضْطِرَابٌ فِي شَيْءٍ. فَالْأَوَّلُ الدَّرُّ دَرُّ اللَّبَنِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر درر في مقاييس اللغة يدلّ على تولُّد شيء (كاللبن) من شيء — وهو قريب من الإطلاق
            لكنه يغفل التصنيع (synthesis) الذي هو جزء لازم من المفهوم المطلوب.

    - lemma: "نَتْح"
      contradicts:
        - text: "«نتح» [translation_en: transpiration(bot.)]"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: >
            المعاجم العلمية الحديثة تُقابل نَتْح بـ transpiration (تبخر الماء من النباتات) لا
            secretion. المفهومان مختلفان بنيوياً: النتح تبخير ماء، والإفراز تصنيع مادة وإطلاقها.
        - text: "«نَتْح» [translation_en: transpiration]"
          source: >
            المعجم الموحد لمصطلحات المياه (2000) / المعجم الطبي الموحد (2009) /
            المعجم الموحد للجيولوجيا (2000) / المكنز الزراعي (AGROVOC) وغيرها
          conflict: >
            جميع معاجم ARABTERM المُتاحة تستعمل نتح بمعنى transpiration حصراً. المصطلح محتلٌّ
            اصطلاحياً بمعنى مغاير لا يسمح باستعماله بمعنى secretion.
      expands:
        - text: "«(نَتَحَ) النُّونُ وَالتَّاءُ وَالْحَاءُ. نَتَحَ الْعَرَقُ: رَشَحَ. وَمَنَاتِحُ الْعَرَقِ: مَخَارِجُهُ. وَنَتَحَ النِّحْيُ: رَشَحَ أَيْضًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر اللغوي يعني الرشح والنضح — قريب دلالياً من الإفراز لكن أضيق (يخصّ تسرب سائل
            موجود، لا تصنيع مادة وإطلاقها). هذا يُثبت أن الصلة مجازية وليست ترادفية.
        - text: "«نَتْحة ... سائل عُضويّ ينضح على مستوى الجزء الخارجيّ من الجلد، من الأغشية المخاطيّة أو الأغشية المصْليَّة»"
          source: "معجم اللغة العربية المعاصرة (أحمد مختار عمر)"
          addition: >
            المعجم المعاصر يُثبت استعمال نتح/نتحة في سياق بيولوجي (رشح سوائل خلوية) لكنه
            لا يعادل secretion الكاملة.

    - lemma: "تَفَرُّز"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إِفْرَاز"
      decision: confirmed
      decision_reason: >
        إفراز راسخ رسوخاً واسعاً في المعجمية الطبية والحيوية العربية الحديثة بمعنى secretion. الجذر
        فَرَزَ (العزل والتمييز عن الغير) منسجم مع جوهر العملية البيولوجية للتصنيع والإطلاق. وفَّى
        بمعايير الجودة الستة: الاطراد والشيوع، ويُسر التداول، الملاءمة، إيثار التراثي، إيثار العربي
        الأصيل، والاشتقاقية. الصيغة الحالية تفتقر إلى التشكيل الكامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        إفراز يدلّ على العملية الحيوية الكاملة: تصنيع الخلية مادةً (هرموناً، إنزيماً، مخاطاً...) وإطلاقها
        إلى الوسط. يمتاز عن 'الإخراج/الإفراغ' (excretion) الذي يقتصر على طرح الفضلات المستهلكة،
        وعن 'النتح' الذي يخصّ تبخر الماء من النباتات، وعن 'الإدرار' الذي يعني تحفيز سيلان سائل
        بعينه لا العملية التصنيعية العامة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِفْرَاز"

    - lemma: "إِدْرَار"
      source: stage1
      decision: removed
      decision_reason: >
        إدرار في الاستعمال الطبي الحديث يعني تحفيز سيلان سائل بعينه (إدرار البول، إدرار الصفراء)،
        لا العملية العضوية العامة لتصنيع مادة وإطلاقها. المعجم الكبير يُسجّله بمعنى يخصّ الخيل.
        دلالياً أضيق من المفهوم المطلوب ومُشترك اشتراكاً يُوقع في اللبس. لا تثبته شواهد بمعنى secretion.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "نَتْح"
      source: stage1
      decision: removed
      decision_reason: >
        جميع المعاجم العلمية الحديثة والتقنية تُقابل نَتْح بـ transpiration (تبخر الماء من النباتات)
        لا secretion. المصطلح محتلٌّ اصطلاحياً في حقل البيولوجيا النباتية بمعنى مغاير. إدخاله في
        مجموعة الإفراز يُسبب تعارضاً معجمياً صريحاً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَفَرُّز"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذه اللمة في أي مصدر معجمي من قاعدة البيانات. لم تثبت كوحدة معجمية مسكوكة.
        اجتياز اختبار التثبيت المعجمي غير ممكن في غياب الشواهد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
