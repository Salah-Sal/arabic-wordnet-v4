# ── المرحلة ١: المراجعة والتوليد ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'لغة قانونية' وصفٌ حرٌّ قابلٌ للتوليد القياسي (لغة طبية، لغة هندسية…)، لا مصطلحٌ مسكوك ثابت يحمل دلالة الغموض الاصطلاحي"
      - "اللمّة تفتقر إلى التشكيل الكامل"
      - "'لغة قانونية' أعمُّ مما تعنيه المجموعة؛ إذ تحيل إلى اللغة القانونية عموماً لا إلى الأسلوب الغامض الخاص بأهل القانون دون سواهم"
      - "لا تعكس اللمّة الحاليةُ الدلالةَ الضمنيَّة للإبهام المتعمَّد التي يحملها المصطلح الإنجليزي legalese"
    observations: "المجموعة تمثّل مفهوم 'لغة المحاكم' (legalese)، وهو الأسلوبُ التقني الغامض الذي يتحدَّث به رجال القانون ويصوغون به وثائقَهم وعقودَهم، مما يجعله بعيداً عن إدراك العامة. يتمايز هذا المفهوم عن 'اللغة القانونية' المحايدة بكونه يُشير تحديداً إلى الغموض الناجم عن كثافة المصطلحات الفنيَّة وتعقيد الصياغة. والجذر 'رطن' في العربية يحمل هذه الدلالة المزدوجة: الكلام الغير مفهوم لغير أصحابه والمُخصَّص بفئة مهنيَّة دون أخرى."
  blind_candidates:
    - lemma: "غَرِيبُ القانون"
      generation_method: majaz
      justification: "استحياءٌ للمصطلح المعجمي التراثي 'غريب' (غريب القرآن، غريب الحديث) الدالِّ على النادر الغامض من الألفاظ، ونقلُه بطريق المجاز إلى ميدان القانون ليشير إلى مفرداته التقنيَّة الغريبة عن فهم العوامّ"
    - lemma: "الإِغْرَابُ القانوني"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر غ-ر-ب على وزن الإفعال (أغرب: جاء بغريب الكلام وأعسره). المصدرُ 'الإغراب' يدلّ على توظيف الغريب من الألفاظ، مضافاً إليه 'القانوني' تخصيصاً بمجال القانون"
    - lemma: "التَّقَعُّرُ القانوني"
      generation_method: tarkib
      justification: "تركيب وصفي من 'التقعّر' (وزن التفعّل من ق-ع-ر؛ تقعَّر في كلامه: تعمَّق وتشدَّق وأتى بالغريب النادر) و'القانوني'؛ يصف الأسلوب المتعمِّق المتشدِّق المختصَّ بالقانون"
    - lemma: "رَطَانَةُ الحُقُوق"
      generation_method: tarkib
      justification: "تركيب إضافي من 'رطانة' (الكلام الذي لا يُفهم لغير أصحابه) و'الحقوق'؛ يصف رطانةَ أهل القانون والتقاضي بوصفها منظومةً لغويَّةً خاصَّةً لا يُدركها إلا المتخصصون"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "لغة قانونية"
      confirm:
        - text: "«لغة القانون: لغة المحامين ورجال القانون.» [مقابل: legalese]"
