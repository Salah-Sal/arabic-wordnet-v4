      expands:
        - text: "«لغة القانون: لغة المحامين ورجال القانون.»"
          source: "المورد الحديث (2008)"
          addition: "يُثبَّت التركيب الإضافي 'لغة القانون' في مرجع معياري حديث مقابلاً لـ legalese، مما يُرسِّخ أن الصيغة الوصفيَّة 'لغة قانونية' متداولةٌ بالمعنى ذاته وإن لم تُقيَّد في المعجم بهذه الصيغة تحديداً"

    - lemma: "رطانة الحقوق"
      confirm:
        - text: "«الرَّطَانَةُ: الكلام الأَعجمىّ, أو بكلام لا يفهمُه الجمهور, وإنما هو مواضعة بين اثنين أو جماعة»"
          source: "المعجم الوسيط"
        - text: "«مجموعة العبارات والتراكيب التي تتميز بها طائفة من الناس يعملون في حرفة واحدة»"
          source: "المعجم الكبير"
        - text: "«لهجة ذات مفردات خاصة يتكلمها ناس ذوو حرفة مشتركة، مثل رطانة عمال سكة الحديد أو رطانة عمال النظافة.» [مقابل: jargon]"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«أسلوب غريب، يدور داخل جماعة سوسيو-ثقافية، كلغة تميز الحقل والجماعة عبر حوار صوتي لغوي واحد لا يفهمه إلا أصحابه.» [مقابل: jargon]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«لغة خاصة ينفرد بها أفراد مهنة ما أو نشاط معين.» [مقابل: jargon]"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
      expands:
        - text: "«الرَّاءُ وَالطَّاءُ وَالنُّونُ بِنَاءٌ لَيْسَ بِالْمُحْكَمِ وَلَا لَهُ قِيَاسٌ فِي كَلَامِهِمْ، إِلَّا أَنَّهُمْ يَقُولُونَ: تَرَاطَنُوا، إِذَا أَتَوْا بِكَلَامٍ لَا يُفْهَمُ; وَيُخَصُّ بِذَلِكَ الْعَجَمُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يكشف الجذر (رطن) في المقاييس أنه أصيلٌ في الدلالة على الكلام الغير مفهوم المخصوص بفئة دون أخرى، وإن خُصَّ في الأصل بالعجم. وقد توسَّعت المعاجم الحديثة في تعميم الدلالة لتشمل رطانة أي مهنة أو جماعة"

    - lemma: "غريب القانون"
      contradicts:
        - text: "«الغَرِيبُ: مَا انْفَرد بِهِ عدل ضَابِط»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الغريب في الاصطلاح العلمي يعني الحديث الذي تفرَّد بروايته راوٍ واحد؛ وهو مصطلحٌ قائمٌ راسخٌ في علم الحديث لا يتَّسع لمعنى الأسلوب القانوني الغامض"
        - text: "«الغريب: في الحديث: ما تفرد بروايته شخص واحد في أي موضع وقع التفرد به من السند»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "ترسَّخ لفظ 'الغريب' في علوم الرواية والحديث بمعنى اصطلاحي دقيق؛ فتوظيفه في التركيب 'غريب القانون' يُوهم الاصطلاحَ الحديثي لا دلالةَ الأسلوب القانوني الغامض"

    - lemma: "الإغراب القانوني"
      evidence_status: "no_material_found"

    - lemma: "التقعر القانوني"
      contradicts:
        - text: "«تَقَعُّر» [في معجم الرياضيات والفلك، ومعجم التشريح، والمعجم الطبي الموحد، وموسوعة الكهرباء]"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) / المعجم الطبي الموحد (2009) / موسوعة الكهرباء IEC 60050"
