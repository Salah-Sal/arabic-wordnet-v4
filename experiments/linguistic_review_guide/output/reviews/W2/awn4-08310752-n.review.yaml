      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"أسطول","root":"سطل","maqayis":"«السِّينُ وَالطَّاءُ وَاللَّامُ لَيْسَ بِشَيْءٍ...»"},{"word":"جوي","root":"جوو","maqayis":"«الْجِيمُ وَالْوَاوُ كَلِمَةٌ وَاحِدَة...»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"سطل","maqayis":"«السِّينُ وَالطَّاءُ وَاللَّامُ لَيْسَ بِشَيْءٍ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"سرب","maqayis":"«السِّينُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ مُطَّرِدٌ...»"}'
    - command: set_metadata
