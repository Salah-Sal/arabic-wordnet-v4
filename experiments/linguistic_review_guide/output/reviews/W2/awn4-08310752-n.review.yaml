stage1_review:
  assessment:
    concerns:
      - "نقص اللّمات المفردة (أسطول، سرب) التي تُستخدم بكثرة في السياق المعاصر."
    observations: "التعريف الحالي دقيق ومبني بشكل جيد، لكن المجموعة تفتقر إلى المرادفات الأكثر شيوعاً في الاستعمال اللغوي الحديث."
  blind_candidates:
    - lemma: "أُسْطُول جَوِّيّ"
      generation_method: tarkib
      justification: "المصطلح القياسي لمجموعة من الطائرات (أو السفن) التي تعمل تحت قيادة أو ملكية واحدة."
    - lemma: "أُسْطُول"
      generation_method: majaz
      justification: "لفظ عام يُستخدم للمركبات (سفن، طائرات، سيارات) التابعة لجهة واحدة."
    - lemma: "سِرْب"
      generation_method: majaz
      justification: "يُستخدم تاريخياً لجماعة الطيور، واستُعير للطائرات المقاتلة أو المجموعة التي تطير معاً."
    - lemma: "تَشْكِيل"
      generation_method: tarkib
      justification: "يشير إلى وحدة من الطائرات في سياق تنظيمي أو عسكري."

stage2_evidence:
  per_lemma:
    - lemma: "أسطول جوي"
      confirm:
        - text: "«ويقال لمجموعة الطائرات أسطول جوي»"
          source: "المعجم الوسيط"
        - text: "«أسطول جوّيّ: مجموعة طائرات حربيَّة.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "أُسْطُول"
      confirm:
        - text: "«يطلق الأسطول أيضا فى الاستعمال الحديث على مجموعة سفن التجارة والصَّيْد وأسراب الطائرات»"
          source: "المعجم الكبير"
        - text: "«المركبات المتواجدة في نظام النَّقل. يشير الأسطول عادة إلى مركبات الطرق السريعة، وعربات السكك الحديدية إضافة السفن.»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
    - lemma: "سِرْب"
      confirm:
        - text: "«سِرْب من الطّائرات/ النَّحل»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«ويطلق الأسطول أيضا ... على ... أسراب الطائرات»"
          source: "المعجم الكبير"
    - lemma: "تَشْكِيل"
      expands:
        - text: "«عدد أو مجموعة متجانسة من الأفراد أو الأشياء.»"
          source: "المعجم الكبير"
          addition: "يدعم كونه مجموعة لكن لا يخصصه للطائرات كمرادف لـ Fleet."

stage3_analysis:
  per_lemma:
    - lemma: "أسطول جوي"
      decision: confirmed
      decision_reason: "المصطلح الأكثر دقة وتخصيصاً في المعاجم العربية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُسْطُول جَوِّيّ"
    - lemma: "أُسْطُول"
      source: stage1
      decision: confirmed
      decision_reason: "شائع جداً في الاستعمال الحديث كلفظ عام يشمل الطائرات، وموثق في المعاجم التقنية واللغوية المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أُسْطُول", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "سِرْب"
      source: stage1
      decision: confirmed
      decision_reason: "مستخدم بكثرة في السياق الجوي (خاصة العسكري) لوصف جماعة من الطائرات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سِرْب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَشْكِيل"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام يشير للترتيب أو الوحدة التنظيمية، وليس مرادفاً مباشراً لـ Fleet في معناه العام."

stage4_content:
  definition:
    current: "مجموعة من الطائرات تعمل معًا تحت نفس الملكية"
    assessment:
      decision: retain
      reason: "التعريف دقيق ومطابق للمعايير المعجمية (جنس وفصل)."
  examples:
    per_lemma:
      - lemma: "أُسْطُول جَوِّيّ"
        examples:
          - text: "تمتلك شركة الطيران الوطنية أُسْطُولاً جَوِّياً حديثاً يضم طائرات من طرازات مختلفة."
            type: usage
      - lemma: "أُسْطُول"
        examples:
          - text: "سعت الشركة لتحديث أُسْطُولِها من الطائرات لتقليل انبعاثات الكربون."
            type: usage
      - lemma: "سِرْب"
        examples:
          - text: "حلق سِرْبٌ من الطائرات المقاتلة في تشكيل دقيق خلال العرض الوطني."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "أُسْطُول جَوِّيّ"
      entry_id: "{auto}"
      roots:
        - word: "أسطول"
          root: "سطل"
          maqayis_quote: "«السِّينُ وَالطَّاءُ وَاللَّامُ لَيْسَ بِشَيْءٍ. عَلَى أَنَّهُمْ يُسَمُّونَ إِنَاءً مِنَ الْآنِيَةِ سَطْلًا.»"
        - word: "جوي"
          root: "جوو"
          maqayis_quote: "«الْجِيمُ وَالْوَاوُ كَلِمَةٌ وَاحِدَة، وَهِيَ الْجَوُّ، وَهُوَ مَا بَيْنَ السَّمَاءِ وَالْأَرْضِ.»"
    - lemma: "أُسْطُول"
      entry_id: "{auto}"
      root: "سطل"
      maqayis_quote: "«السِّينُ وَالطَّاءُ وَاللَّامُ لَيْسَ بِشَيْءٍ. عَلَى أَنَّهُمْ يُسَمُّونَ إِنَاءً مِنَ الْآنِيَةِ سَطْلًا.»"
    - lemma: "سِرْب"
      entry_id: "{auto}"
      root: "سرب"
      maqayis_quote: "«السِّينُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ مُطَّرِدٌ، وَهُوَ يَدُلُّ عَلَى الِاتِّسَاعِ وَالذَّهَابِ فِي الْأَرْضِ.»"
  per_sense:
