      sense_id: "{auto}"
      nuance: "التسمية الكاملة والرسمية للمجموعة، وتُستخدم لرفع اللبس عن الأساطيل البحرية."
      mwe: true
    - lemma: "أُسْطُول"
      sense_id: "{auto}"
      nuance: "لفظ عام يركز على الملكية الواحدة والضخامة، ويُفهم من السياق أنه جوي."
      mwe: false
    - lemma: "سِرْب"
      sense_id: "{auto}"
      nuance: "يركز على الوحدة الوظيفية أو التحليق الجماعي، ويشيع استخدامه في السياقات العسكرية."
      mwe: false
  synset:
    cultural_fit: native
  actions:
