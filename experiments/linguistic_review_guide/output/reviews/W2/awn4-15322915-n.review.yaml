# مراجعة المجموعة الترادفية — awn4-15322915-n (processing time)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «وقت المعالجة» بدون تشكيل — يلزم إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط — يُستحسن إثراؤها بمترادفات"
    observations: >
      المفهوم يدلّ على الفاصل الزمني اللازم لإتمام إجراء محدد، وهو مفهوم تقني حديث
      شائع في الحوسبة والهندسة والإدارة. التعريف العربي واضح ومباشر. المفهوم يندرج
      تحت «فاصل زمني» وهو تصنيف صحيح. التعبير عن هذا المفهوم في العربية يكون
      بالتركيب الإضافي الذي يجمع بين لفظ زمني (وقت، زمن، مدة) ومصدر الفعل الدال
      على العملية (معالجة، تنفيذ).
  blind_candidates:
    - lemma: "زَمَنُ المُعَالَجَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «زمن» (الزمان والحين) و«المعالجة» (مزاولة الشيء).
        «زمن» يُستعمل بكثرة في المصطلحات التقنية العربية كبديل لـ«وقت»
        مع تركيز على المقدار المنقضي.
    - lemma: "مُدَّةُ المُعَالَجَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مدة» (مقدار من الزمان) و«المعالجة». «المدة» تركّز
        على الامتداد الزمني المحدود ذي البداية والنهاية، وهو أنسب للسياقات
        التي يُراد فيها التأكيد على طول الفترة.
    - lemma: "مُدَّةُ التَّنْفِيذ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مدة» و«التنفيذ» (المضيّ في الأمر). يُعبّر عن الزمن
        المستغرق لإنجاز إجراء من منظور التنفيذ لا المعالجة.
    - lemma: "وَقْتُ الإِجْرَاء"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «وقت» (الزمان المعلوم) و«الإجراء» (ما يُتّخذ من خطوات).
        يُبرز الإجراء المحدد أكثر من العملية العامة.

stage2_evidence:
  per_lemma:
    - lemma: "وَقْتُ المُعَالَجَة"
      confirm:
        - text: "«الوَقْتُ: المِقْدارُ من الدَّهْرِ، وأكْثَرُ ما يُسْتَعْمَلُ في الماضي»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الوقت: المقدار المحدود من الزمن. وقيل الوقت الحد الواقع بين أمرين أحدهما معلوم سابق، والآخر معلوم به لاحق»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«مُعَالَجَة: لفظ عام يعبر عن مجموع العمليات الحسابية والمنطقية التي يقوم بها الحاسوب على معطيات محددة للحصول على نتائج محددة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      expands:
        - text: "«تداولُ المعطياتِ في نظامٍ حاسوبي. وهي مرحلةٌ أساسيةٌ بين استقبالِ المعطيات (دخل) وتوليدِ النتائج (خرج)»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يوضّح أن المعالجة تشمل مرحلة محددة بين الدخل والخرج"

    - lemma: "زَمَنُ المُعَالَجَة"
      confirm:
        - text: "«زمن المعالجة» = curing time"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«زمن المعالجة» = manipulating time"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«زمن المعالجة المركزية: الزمن اللازم لمعالجة مجموعة محددة من العمليات في وحدة المعالجة المركزية»"
          source: "مسرد التربية (ArabTerm)"
        - text: "«زمن المُعالَجة» = treatment time"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«الزَّمَنُ: العَصْرُ، واسْمانِ لقَليلِ الوَقْتِ وكثيرِه»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الزمن يصلح للقليل والكثير من الوقت"

    - lemma: "مُدَّةُ المُعَالَجَة"
      confirm:
        - text: "«مدة المعالجة» = processing time"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "«مبدأ مدة المعالجة طويلة المدى: يتم العمل على مهمة أطول وقت تشغيل لازم لمستوى التصنيع الحالي»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      expands:
        - text: "«المُدَّة: مِقْدَار من الزَّمَان يَقع على الْقَلِيل وَالْكثير يُقَال أَقمت عِنْده مُدَّة مديدة وقتا طَويلا»"
          source: "المعجم الوسيط"
          addition: "المدة تشير إلى مقدار زمني محدد بين بداية ونهاية"

    - lemma: "مُدَّةُ التَّنْفِيذ"
      contradicts:
        - text: "«زمن التنفيذ: مقدارُ الزمن المنقضي، أو زمن المعالِجِ المستخدَم في تنفيذ برنامجٍ حاسوبي»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "المصطلح المسكوك هو «زمن التنفيذ» وليس «مدة التنفيذ»، والمقابل الإنجليزي هو execution time لا processing time"
        - text: "«زمن التنفيذ: المدةُ التي يُنفَّذ البرنامج خلالها» = run time"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "زمن التنفيذ يُقابل execution/run time وهو مفهوم مختلف عن processing time"

    - lemma: "وَقْتُ الإِجْرَاء"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "وَقْتُ المُعَالَجَة"
      decision: confirmed
      decision_reason: >
        اللمّة مركب إضافي سليم من مكوّنين مؤصّلين: «وقت» (الزمان المعلوم)
        و«المعالجة» (مزاولة العمليات). المعالجة في الاصطلاح التقني الحديث
        تعني العمليات المنهجية المحددة، وهو ما يطابق المفهوم المطلوب.
        المركب ثابت ومسكوك في الاستعمال التقني العربي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الأعمّ استعمالاً في الحوسبة والسياقات التقنية العامة، يركّز على
        «الوقت» بوصفه نقطة أو مقداراً زمنياً محدداً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَقْتُ المُعَالَجَة"

    - lemma: "زَمَنُ المُعَالَجَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مركب إضافي مسكوك وثابت في معاجم المصطلحات العربية (موسوعة الكهرباء،
        مسرد التربية، معجم المياه). وُجد في أربعة مداخل معجمية مختلفة. الفرق
        بينه وبين «وقت المعالجة» دلالي دقيق: «الزمن» أعمّ ويشمل القليل والكثير
        ويُستعمل في السياقات الهندسية والعلمية بكثرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُفضَّل في السياقات الهندسية والعلمية (الكهرباء، المياه، التربية)
        حيث يُراد قياس المقدار الزمني المنقضي بدقة.
      actions:
        - command: create_entry
          params: {lemma: "زَمَنُ المُعَالَجَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُدَّةُ المُعَالَجَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مركب إضافي مسكوك ومُثبت في المعجم الموحد لمصطلحات النقل (2010) بمقابل
        إنجليزي مباشر «processing time». ورد أيضاً في سياق «مبدأ مدة المعالجة
        طويلة المدى». المدة تركّز على الامتداد الزمني المحسوب بين بداية ونهاية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُستعمل حين يُراد التأكيد على الفترة الزمنية الممتدة من بداية الإجراء
        إلى نهايته، ويشيع في سياقات النقل والتصنيع والإدارة.
      actions:
        - command: create_entry
          params: {lemma: "مُدَّةُ المُعَالَجَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُدَّةُ التَّنْفِيذ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المركب في أي معجم مصطلحي. المصطلح المسكوك هو
        «زمن التنفيذ» لا «مدة التنفيذ»، وهو يقابل execution time / run time
        وهو مفهوم مختلف عن processing time. لا يصلح مرادفاً لهذه المجموعة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "وَقْتُ الإِجْرَاء"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المركب في أي معجم مصطلحي. تركيب حرّ غير مسكوك،
        يمكن إبدال «الإجراء» بـ«العملية» أو «الخطوة» وتبقى العبارة صالحة،
        مما يدل على أنه ليس مصطلحاً ثابتاً.
      evidence_assessment:
        case: no_material

