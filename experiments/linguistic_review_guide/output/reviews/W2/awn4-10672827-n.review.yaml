# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10672827-n
# homebody / stay-at-home
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «بَيْتُوتِيّ» لا توجد في أيّ معجم عربي معتبر؛ يبدو أنها مولَّدة حديثاً من «بَيْتُوتَة» دون سند معجمي"
      - "العلاقة فوقية (hypernym) تربط المجموعة بـ«عامل/فاعل» (شخص يعمل ويُنجِز الأمور)، وهذا غير ملائم دلالياً لمن يلازم بيته ولا يتنقّل"
      - "المجموعة تحتوي لمّة واحدة فقط؛ مفهوم ملازمة البيت غنيّ في العربية ويستحقّ إثراءً"
    observations: "المفهوم المقصود هو الشخص الذي يلزم بيته ولا يميل إلى الترحال أو الأسفار. هذا المفهوم معروف في الثقافة العربية وله تعبيرات كلاسيكية مثل «قُعَدة» و«ملازم بيته». اللمّة الحالية «بَيْتُوتِيّ» مشتقة من بيتوتة (مصدر بات يبيت) بإضافة ياء النسبة، وهي صيغة مقبولة صرفياً لكنّها غير مسجّلة معجمياً. الجذر «بيت» يدلّ على المأوى والمآب، فالنسبة إلى «بيتوتة» تعني المنتسب إلى ملازمة البيت ليلاً، وهو أضيق من المفهوم المطلوب الذي يشمل ملازمة البيت مطلقاً."
  blind_candidates:
    - lemma: "قُعَدَة"
      generation_method: ishtiqaq
      justification: "من الجذر «قعد» على وزن فُعَلة للمبالغة في الوصف، يدلّ على كثير القعود الذي لا يبرح مكانه. الوزن فُعَلة من أوزان المبالغة المعروفة (نظير: ضُحَكة، لُعَبة، هُمَزة)."
    - lemma: "بَيْتِيّ"
      generation_method: ishtiqaq
      justification: "نسبة مباشرة إلى «البَيْت» على وزن فَعْلِيّ، أي المنتسب إلى البيت الذي يلازمه ولا يخرج منه كثيراً."
    - lemma: "جَثُوم"
      generation_method: ishtiqaq
      justification: "من الجذر «جثم» (لزم مكانه ولم يبرح) على وزن فَعُول للمبالغة، يدلّ على من يلزم مكانه دائماً."
    - lemma: "رَبِيض"
      generation_method: ishtiqaq
      justification: "من الجذر «ربض» (أقام في مكانه واستقرّ) على وزن فَعِيل، يدلّ على المستقرّ في مكانه الذي لا يرتحل."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بَيْتُوتِيّ"
      evidence_status: "no_material_found"

    - lemma: "قُعَدَة"
      confirm:
        - text: "«قُعَدة: ملازِمٌ بيتَهُ أو مَحلَّتَه إلخ.»"
          source: "المورد الحديث (2008)"
        - text: "«القُعَدَةُ: الكثير القُعُود»"
          source: "المعجم الوسيط"
        - text: "«رَجُلٌ ضُجَعَةٌ قُعَدَةٌ: كَثِيرُ الْقُعُودِ وَالِاضْطِجَاعِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«قُعَدة (حياة تخلو من النشاط)»"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "بَيْتِيّ"
      expands:
        - text: "«بيتي: عن الأوردية بايت بمعنى فصل في كتاب أو مهمة؛ أو عن الفارسية بابات بمعنى سعيد الحظ.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الشاهد المعجمي الوحيد يخصّ اسم علم من الأوردية/الفارسية، لا نسبة عربية إلى البيت"

    - lemma: "جَثُوم"
      evidence_status: "no_material_found"

    - lemma: "رَبِيض"
      contradicts:
        - text: "«الرَّبُوضُ: من الشَّجر: العظيمةُ الغَلِيظةُ [...] غَنَمٌ رَبُوضٌ: رابِضَةٌ»"
          source: "المعجم الكبير"
          conflict: "رَبُوض/رَبِيض صفة للأشياء الضخمة أو الغنم الجاثمة، لا تُطلق على الإنسان بمعنى ملازم البيت"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "بَيْتُوتِيّ"
      decision: confirmed
      decision_reason: "اللمّة مشتقة اشتقاقاً صحيحاً من «بَيْتُوتَة» (مصدر بات يبيت) بإضافة ياء النسبة، وهي صيغة مقبولة صرفياً وإن لم تُسجَّل في المعاجم التقليدية. تُبقى لأنها الصيغة المعتمدة حالياً في الشبكة ولها وجه صرفي سليم، لكنّها أضعف من «قُعَدة» من حيث التوثيق المعجمي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على ملازمة البيت ليلاً (من البيتوتة = المبيت)، ويوحي بحياة منزلية هادئة. أقرب إلى الدلالة على من يقضي لياليه في بيته."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَيْتُوتِيّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "قُعَدَة"
      source: stage1
      decision: confirmed
      decision_reason: "لمّة موثّقة في المعجم الوسيط («الكثير القُعود») وفي مقاييس اللغة («رجل ضُجَعَةٌ قُعَدَةٌ: كثير القعود والاضطجاع»)، ومقابَلة صريحاً بـ stay-at-home في المورد الحديث («قُعَدة: ملازِمٌ بيتَه أو محلّته»). صيغة فُعَلة للمبالغة من قعد، مطابقة تماماً للمفهوم المطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على كثرة القعود وملازمة المكان عموماً، وفيه ظلّ من الذمّ أو التخاذل (القعود عن العمل). أعمّ من «بَيْتُوتِيّ» لأنه لا يختصّ بالليل."
      actions:
        - command: create_entry
          params: {lemma: "قُعَدَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "بَيْتِيّ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوثّق في المعاجم العربية بمعنى ملازم البيت. الشاهد الوحيد المتاح يخصّ اسم علم من الأوردية/الفارسية. كما أنّ النسبة إلى «بيت» (بَيْتِيّ) تعني في الاستعمال المعاصر «منزلي» (صفة للأشياء) لا «ملازم البيت» (صفة للأشخاص)."

    - lemma: "جَثُوم"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تؤيّد استعمال «جَثُوم» للشخص الملازم بيته. الجذر «جثم» يدلّ على اللزوم والقعود لكنّ صيغة فَعُول لم تُسجَّل بهذا المعنى البشري، والكلمة قد تختلط بـ«الجاثوم» (الكابوس)."

    - lemma: "رَبِيض"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تُظهر أنّ مشتقات «ربض» على وزن فَعُول (ربوض) تُستعمل صفةً للأشجار العظيمة والسلاسل الضخمة والدروع الواسعة، ولا تُطلق على الإنسان بمعنى ملازمة البيت."

