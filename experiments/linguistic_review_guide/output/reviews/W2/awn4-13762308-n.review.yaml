# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13762308-n
# nothing / nil / zero — كمية لا أهمية لها؛ شيء ليس له وجود
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يمزج بين مفهومين مختلفين: الكمية المنعدمة (صفر) والانتفاء الوجودي (عدم)، دون تمييز واضح بينهما"
      - "لمّة «لا شيء» تتضمن كلمتين واردتين في التعريف نفسه (لا، شيء) مما يثير شبهة الدوران"
      - "اللمّات الثلاث تفتقر إلى التشكيل الكامل"
    observations: "المجموعة تمثّل مفهوماً أساسياً يتقاطع فيه المجال الرياضي (الصفر كرقم) والمجال الفلسفي (العدم كنقيض للوجود) والاستعمال اليومي (لا شيء). المُفرط العلوي هو «كمية نسبية» مما يدلّ على أن المقصود الأول هو الجانب الكمّي. اللمّات الإنجليزية متعددة جداً (nothing, nil, zero, zilch...) مما يعكس ثراء التعبير في الإنجليزية عن هذا المفهوم."
  blind_candidates:
    - lemma: "صِفْر"
      generation_method: ishtiqaq
      justification: "من جذر (صفر) بمعنى الخالي؛ الصفر عند الحسابيين رقم يدل على الرتبة الخالية من الكمية، وهو المقابل الدقيق للمفهوم الرياضي"
    - lemma: "عَدَم"
      generation_method: ishtiqaq
      justification: "من جذر (عدم) بمعنى فقدان الشيء وذهابه؛ العدم نقيض الوجود في الاصطلاح الفلسفي، ويعبّر عن الجانب الوجودي من المفهوم"
    - lemma: "هَبَاء"
      generation_method: majaz
      justification: "مجاز من الهباء وهو التراب الدقيق المنبثّ الذي لا يُرى إلا في الشمس؛ استُعمل قرآنياً للدلالة على الشيء المنعدم القيمة في قوله تعالى: فكانت هباء منبثّا"
    - lemma: "خَوَاء"
      generation_method: ishtiqaq
      justification: "من جذر (خوي) بمعنى خلوّ الشيء؛ الخواء يدل على الفراغ المطلق وانعدام المحتوى"

stage2_evidence:
  per_lemma:
    - lemma: "صِفْر"
      confirm:
        - text: "«(الصفر) الْخَالِي و (عِنْد الحسابيين) رقم يدل على الرُّتْبَة الخالية من الكمية وعلامته نقطة ودرجة الصفر نقطة البدء تقدر بعْدهَا الدَّرَجَات»"
          source: "المعجم الوسيط"
        - text: "«مفهوم رياضي مجرد يفيد الانعدام»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
        - text: "«(1) «أ» صِفْر. «ب» شيء أو شخص تافه لا شأن له»"
          source: "المورد الحديث (2008) — مقابل cipher"
      expands:
        - text: "«الْأَصْلُ الثَّانِي: الشَّيْءُ الْخَالِي، يُقَالُ هُوَ صِفْرٌ. وَيَقُولُونَ فِي الشَّتْمِ: مَا لَهُ صَفِرَ إِنَاؤُهُ، أَيْ هَلَكَتْ مَاشِيَتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يحمل أيضاً دلالة الخلوّ المادي (الإناء الفارغ) مما يعزز الصلة بالمعنى الكمّي"

    - lemma: "عَدَم"
      confirm:
        - text: "«(الْعَدَم) ضد الْوُجُود والفقر»"
          source: "المعجم الوسيط"
        - text: "«العَدَمُ: انْتِفَاء الْكَوْن»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«العدم يقابل الوجود كما أنّ العدمي يقابل الوجودي... في اصطلاح المتصوفة: العدم هو الأعيان الثّابتة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«الْعَيْنُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى فُقْدَانِ الشَّيْءِ وَذَهَابِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يدل على الفقدان عموماً وليس على نقيض الوجود فحسب؛ وقد غلب على فقدان المال (الفقر)"

    - lemma: "لَا شَيْءَ"
      confirm:
        - text: "«(1) «أ» لا شيء. «ب» عدم (2) صِفْر (3) دمار؛ هلاك أو إخفاق تام»"
          source: "المورد الحديث (2008) — مقابل naught"

    - lemma: "هَبَاء"
      contradicts:
        - text: "«الترابُ الذي تُطِيرُه الريحُ ويلزق بالأشياء, أو ينبثُّ في الهواء فلا يبدو إلا في ضوء الشمس»"
          source: "المعجم الوسيط"
          conflict: "الدلالة المعجمية الأصلية هي التراب الدقيق المنبثّ وليست العدم أو الصفر؛ الاستعمال القرآني مجازي ولا يكفي لإثبات دلالة كمّية"
      expands:
        - text: "«من النَّاس: القليلو العقل»"
          source: "المعجم الوسيط"
          addition: "معنى ثانٍ مجازي يدل على التفاهة لكنه وصف للأشخاص لا للكميات"

    - lemma: "خَوَاء"
      contradicts:
        - text: "«من الأرض: براحها الفراغ بين الأرض والسماء الفراغ بين الشيئين من الفرس: الفراغ بين رجليه ويديه»"
          source: "المعجم الوسيط"
          conflict: "الخواء يدل على الفراغ المادي والمكاني (الحيّز الخالي) لا على انعدام الكمية أو نقيض الوجود"
        - text: "«فضاء أزيل منه الهواء والغاز والضغط فيه أقل من الضغط الجوي — فراغ (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "المصطلح تقنّن كمقابل لـ vacuum وليس لـ nothing/zero"

