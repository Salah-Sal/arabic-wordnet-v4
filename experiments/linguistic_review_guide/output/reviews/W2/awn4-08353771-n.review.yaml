stage1_review:
  assessment:
    concerns:
      - "اللمة 'مخزون مهارات' هي عبارة وصفية مركبة حديثة وليست مصطلحاً معجمياً مسكوكاً."
      - "التعريف الحالي جيد ولكنه يحتاج صياغة معجمية أكثر رصانة."
    observations: "المفهوم يعبر عن المجموع الكلي للإمكانات (مهارات، أدوات، قطع فنية) التي يمتلكها فرد أو فرقة أو تتوفر في مجال ما. في العربية المعاصرة، استُعيرت ألفاظ 'ذخيرة' و'جعبة' و'رصيد' للتعبير عن هذا المفهوم بدقة."
  blind_candidates:
    - lemma: "جَعْبَة"
      generation_method: majaz
      justification: "استعارة من وعاء السهام (الكنانة) للتعبير عما يمتلكه المرء من مهارات أو معلومات جاهزة للاستخدام (في جعبته الكثير)."
    - lemma: "عُدَّة"
      generation_method: ishtiqaq
      justification: "من الإعداد، وتستخدم في المعاجم التقنية والطبية للتعبير عن مجموعة الأدوات أو الوسائل اللازمة لمهنة أو غرض معين (Instrumentarium)."
    - lemma: "رَصِيد"
      generation_method: majaz
      justification: "استعارة من الرصيد المالي للتعبير عن مجموع الإنجازات أو المهارات المتراكمة التي يمتلكها الشخص."
    - lemma: "حَصِيلَة"
      generation_method: ishtiqaq
      justification: "تعبر عن نتاج الجمع والتحصيل، وتستخدم لوصف مجموع المهارات أو الكفاءات المحصلة في مجال ما."

stage2_evidence:
  per_lemma:
    - lemma: "ذخيرة"
      confirm:
        - text: "«(في علم اللغة) repertory: مجموعة الرموز الصوتية أو الكتابية فى نظام لغوى محدد. و: مجموعة اللغات أو اللهجات التى يمكن للمتكلم أن يستخدم إحداها.»"
          source: "المعجم الكبير"
        - text: "«الذَّخيرة: «أ» مجموعة من المسرحيات والأدوار والألحان التي تدرَّبت عليها فرقة أو ممثِّل أو مغنٍّ أو موسيقي والتي يكون الموسيقي أو المغني أو الممثل أو الفرقة على استعداد لتقديمها أو أدائها.»"
          source: "المورد الحديث (2008)"
    - lemma: "عدة"
      confirm:
        - text: "«مجموعة الآلات أو التجهيزات المطلوبة لأداء عملية جراحية أو لتحقيق هدف طبي معين. (Instrumentarium)»"
          source: "معجم المصطلحات الطبية (1997)"
        - text: "«الأدوات والأجهزة والأدوية والكتب وغيرها من المعدات التي يستعملها الطبيب في مهنته. (Armamentarium)»"
          source: "معجم المصطلحات الطبية (1985)"
      expands:
        - text: "«العُدَّة: بالضم ما أعددته لحوادث الدهر.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "جعبة"
      confirm:
        - text: "«وعاء السهام والنبال. (مجازاً: مازال في جعبته الكثير)»"
          source: "المعجم الوسيط (بناءً على الاستخدام الشائع الموثق في معجم الصواب اللغوي)"
    - lemma: "حصيلة"
      confirm:
        - text: "«الحَصِيلُ. يقال: حصيلة الضرائب، وحصيلة الأرباح؛ بقية الشيء.»"
          source: "المعجم الكبير"
      expands:
        - text: "«البقية وما يجمع من مال أو جهد.»"
          source: "موسوعة السلطان قابوس"
    - lemma: "رصيد"
      confirm:
        - text: "«ما يبقى للمودع في المصرف من حسابه الجاري.»"
          source: "المعجم الوسيط"
      expands:
        - text: "«يملك رصيداً كبيراً في البنك [فصيحة]... ذكرها الوسيط على أنها مولدة.»"
          source: "معجم الصواب اللغوي"

