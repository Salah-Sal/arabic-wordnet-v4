      decision: removed
      decision_reason: "عبارة وصفية حديثة وليست وحدة معجمية مسكوكة؛ تغني عنها 'ذخيرة' أو 'جعبة'."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "جَعْبَة"
      source: stage1
