          params: {lemma: "حَصِيلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08353771-n"}

stage4_content:
  definition:
    current: "النطاق الكامل للمهارات أو الكفاءات أو الوسائل المستخدمة في مجال أو مهنة معينة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتاج صياغة أكثر دقة لتعكس طبيعة 'المخزون' أو 'المجموعة الجاهزة للاستعمال'."
    authored:
      - type: terminological
        text: "مجموعُ المهاراتِ أو الكفاءاتِ أو القطعِ الفنيّةِ أو الوسائلِ التي يمتلكُها الفردُ أو تتوفّرُ في مجالٍ معيّنٍ، وتكونُ جاهزةً للاستخدامِ أو العرضِ عندَ الحاجةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "ذَخِيرَة"
        examples:
          - text: "تمتلكُ الفرقةُ الموسيقيّةُ ذخيرةً واسعةً من المقطوعاتِ الكلاسيكيّةِ."
            type: usage
      - lemma: "جَعْبَة"
        examples:
          - text: "ما زالَ في جعبةِ المدرِّبِ الكثيرُ من الخططِ التكتيكيّةِ لمواجهةِ الخصمِ."
            type: usage
      - lemma: "عُدَّة"
        examples:
          - text: "تشملُ عُدَّةُ الجرّاحِ أحدثَ الأجهزةِ الطبيّةِ والوسائلِ العلاجيّةِ."
            type: usage
      - lemma: "رَصِيد"
        examples:
          - text: "يتمتّعُ المترجمُ برصيدٍ لغويٍّ ثريٍّ يمكّنُه من صياغةِ أدقِّ المفاهيمِ."
            type: usage
      - lemma: "حَصِيلَة"
        examples:
          - text: "حصيلةُ مهاراتِ الموظّفِ الجديدِ تؤهّلُه لتولّي مَنصبٍ قياديٍّ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-08353771-n", definition_index: 0, text: "مجموعُ المهاراتِ أو الكفاءاتِ أو القطعِ الفنيّةِ أو الوسائلِ التي يمتلكُها الفردُ أو تتوفّرُ في مجالٍ معيّنٍ، وتكونُ جاهزةً للاستخدامِ أو العرضِ عندَ الحاجةِ."}

