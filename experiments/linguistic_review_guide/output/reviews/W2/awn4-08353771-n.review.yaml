      actions:
        - command: create_entry
          params: {lemma: "جَعْبَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08353771-n"}
    - lemma: "عُدَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم في السياقات التقنية والطبية للتعبير عن مجموعة الوسائل (Armamentarium/Instrumentarium) المتاحة في مهنة ما."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
