    - lemma: "صِفَةٌ أُحَادِيَّةُ المُوَرِّثِ"
      sense_id: "{auto}"
      nuance: "المصطلح التقني الأكثر دقة في علم الوراثة الحديث."
      mwe: true
    - lemma: "خَاصَّةُ الوَحْدَاتِ"
      sense_id: "{auto}"
      nuance: "يستخدم غالباً في سياق الوراثة المندلية الكلاسيكية."
      mwe: true
  synset:
    cultural_fit: native
  actions:
