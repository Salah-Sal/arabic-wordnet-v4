stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'صفة أحادية' قد تكون ناقصة أو غير دقيقة مقارنة بالمصطلح العلمي الكامل 'صفة أحادية المورث'."
      - "التعريف العربي الحالي جيد ولكنه يفتقر إلى لمسات الصياغة المعجمية الفصحى."
    observations: "المجموعة تتعلق بمفهوم جيني محدد (Unit character) والذي يطلق عليه في العربية 'الصفة أحادية المورث' أو 'خاصة الوحدات' في السياق المندلي."
  blind_candidates:
    - lemma: "صِفَةٌ وَحِيدَةُ الجِينِ"
      generation_method: tarkib
      justification: "ترجمة دقيقة لمفهوم الاعتماد على جين واحد (monogenic)."
    - lemma: "صِفَةٌ مُفْرَدَةٌ"
      generation_method: tarkib
      justification: "ترجمة حرفية مبسطة لمصطلح unit character."
    - lemma: "صِفَةٌ وَحْدَوِيَّةٌ"
      generation_method: ishtiqaq
      justification: "اشتقاق من 'وحدة' للتعبير عن المفهوم الوحدوي للصفة."
    - lemma: "خَلَّةٌ جِينِيَّةٌ"
      generation_method: majaz
      justification: "استخدام 'خلة' كمرادف لصفة/سمة، مع نسبتها للجينات."

stage2_evidence:
  per_lemma:
    - lemma: "صفة أحادية"
      evidence_status: "no_material_found"
    - lemma: "صِفَةٌ أُحَادِيَّةُ المُوَرِّثِ"
      confirm:
        - text: "«صفة يعينها جين واحد فقط.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "خَاصَّةُ الوَحْدَاتِ"
      confirm:
        - text: "«خاصَّةُ الوَحْدات (خاصَّةٌ مَنْدِلِيَّة)»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "خَاصَّةٌ مَنْدِلِيَّةٌ"
      confirm:
        - text: "«خاصَّةٌ مَنْدِلِيَّة»"
          source: "المعجم الطبي الموحد (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "صفة أحادية"
      decision: confirmed
      decision_reason: "مصطلح مقبول بالرغم من كونه مختصراً لـ 'صفة أحادية المورث'."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صِفَةٌ أُحَادِيَّةٌ"
    - lemma: "صِفَةٌ أُحَادِيَّةُ المُوَرِّثِ"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح العلمي الأدق والأكثر شيوعاً في معاجم الوراثة الموحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "صِفَةٌ أُحَادِيَّةُ المُوَرِّثِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "صِفَةٌ أُحَادِيَّةُ الجِينِ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق لـ 'أحادية المورث' باستخدام المصطلح المعرب 'جين'."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "صِفَةٌ أُحَادِيَّةُ الجِينِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خَاصَّةُ الوَحْدَاتِ"
      source: stage1
      decision: confirmed
      decision_reason: "ترجمة معجمية معتمدة لمصطلح unit character في السياق الطبي والمندلي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "خَاصَّةُ الوَحْدَاتِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خَاصَّةٌ مَنْدِلِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف مشهور يشير إلى الصفات التي تتبع قوانين مندل وتورث كوحدات مستقلة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "خَاصَّةٌ مَنْدِلِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "(علم الوراثة) صفة تورث على أساس الكل أو لا شيء وتعتمد على وجود جين واحد"
    assessment:
      decision: revise
      reason: "لتحسين الصياغة المعجمية وجعلها أكثر دقة من الناحية الوراثية."
    authored:
      - type: terminological
        text: "(في علم الوراثة) صِفَةٌ وراثيّةٌ تُورَثُ وِفْقَ قَوانِين مَنْدِل وتَعتمِدُ في ظُهورِها على فِعْلِ جِينٍ واحدٍ، وتُنْقَلُ كَوِحْدَةٍ مُسْتَقِلَّةٍ إمّا أن تظْهَرَ كُلِّيًّا أو تغِيبَ تماماً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "صِفَةٌ أُحَادِيَّةٌ"
        examples:
          - text: "تعتبر شحمة الأذن الملتحمة صفة أحادية المورث تتبع الوراثة المندلية البسيطة."
            type: usage
      - lemma: "خَاصَّةُ الوَحْدَاتِ"
        examples:
          - text: "افترض مندل أن كل خاصة من خاصة الوحدات تتحكم فيها زوج من العوامل الوراثية."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "صِفَةٌ أُحَادِيَّةٌ"
      entry_id: "{auto}"
      roots:
        - word: "صفة"
          root: "وصف"
          maqayis_quote: "«الْوَاوُ وَالصَّادُ وَالْفَاءُ: أَصْلٌ وَاحِدٌ، هُوَ تَحْلِيَةُ الشَّيْءِ... وَالصِّفَةُ: الْأَمَارَةُ اللَّازِمَةُ لِلشَّيْءِ.»"
        - word: "أحادية"
          root: "وحد"
          maqayis_quote: "«الْوَاوُ وَالْحَاءُ وَالدَّالُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ. مِنْ ذَلِكَ الْوَحْدَةِ.»"
    - lemma: "صِفَةٌ أُحَادِيَّةُ المُوَرِّثِ"
      entry_id: "{auto}"
      roots:
        - word: "صفة"
          root: "وصف"
          maqayis_quote: "«الْوَاوُ وَالصَّادُ وَالْفَاءُ: أَصْلٌ وَاحِدٌ، هُوَ تَحْلِيَةُ الشَّيْءِ.»"
        - word: "أحادية"
          root: "وحد"
          maqayis_quote: "«الْوَاوُ وَالْحَاءُ وَالدَّالُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ.»"
        - word: "المورث"
          root: "ورث"
          maqayis_quote: "«الْوَاوُ وَالرَّاءُ وَالثَّاءُ: كَلِمَةٌ وَاحِدَةٌ، هِيَ الْوِرْثُ... وَهُوَ أَنْ يَكُونَ الشَّيْءُ لِقَوْمٍ ثُمَّ يَصِيرَ إِلَى آخَرِينَ بِنَسَبٍ أَوْ سَبَبٍ.»"
    - lemma: "خَاصَّةُ الوَحْدَاتِ"
      entry_id: "{auto}"
      roots:
        - word: "خاصة"
          root: "خص"
          maqayis_quote: "«الْخَاءُ وَالصَّادُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ... وَمِنَ الْبَابِ خَصَصْتُ فُلَانًا بِشَيْءٍ خَصُوصِيَّةً... إِذَا أُفْرِدَ وَاحِدٌ.»"
        - word: "الوحدات"
          root: "وحد"
          maqayis_quote: "«الْوَاوُ وَالْحَاءُ وَالدَّالُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ.»"
  per_sense:
    - lemma: "صِفَةٌ أُحَادِيَّةٌ"
      sense_id: "{auto}"
      nuance: "تعبير عام ومختصر يشير إلى الصفة الجينية الواحدة."
