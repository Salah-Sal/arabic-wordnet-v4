        value: '{"roots":[{"word":"صفة","root":"وصف","maqayis":"«الواو والصاد والفاء: أصل واحد، هو تحلية الشيء...»"},{"word":"أحادية","root":"وحد","maqayis":"«الواو والحاء والدال: أصل واحد يدل على الانفراد.»"}]}'
    - command: set_metadata
      params:
