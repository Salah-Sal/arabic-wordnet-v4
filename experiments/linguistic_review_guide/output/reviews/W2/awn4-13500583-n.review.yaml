stage1_review:
  assessment:
    concerns:
      - "المصطلحات الحالية تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي دقيق علمياً لكن يمكن صياغته بأسلوب معجمي أكثر إيجازاً."
    observations: "المفهوم ينتمي إلى السيبرانية ونظرية النظم، والمصطلحات العربية المستخدمة هي ترجمات دقيقة للمصطلح الإنجليزي 'feedback' مع تنوع في اختيار اللفظ المعبر عن العودة (راجعة، مرتدة، استرجاعية)."
  blind_candidates:
    - lemma: "تَغْذِيَةٌ رَاجِعَةٌ"
      generation_method: tarkib
      justification: "الترجمة الأكثر شيوعاً في العلوم التربوية والإنسانية."
    - lemma: "تَغْذِيَةٌ مُرْتَدَّةٌ"
      generation_method: tarkib
      justification: "شائعة في الهندسة والفيزياء للتعبير عن ارتداد الإشارة."
    - lemma: "تَغْذِيَةٌ اسْتِرْجَاعِيَّةٌ"
      generation_method: ishtiqaq
      justification: "تستخدم في سياق استرجاع المعلومات ومعالجتها."
    - lemma: "تَغْذِيَةٌ خَلْفِيَّةٌ"
      generation_method: tarkib
      justification: "مصطلح تقني مستخدم في الإلكترونيات والأنظمة الهاردوير."

stage2_evidence:
  per_lemma:
    - lemma: "تَغْذِيَةٌ رَاجِعَةٌ"
      confirm:
        - text: "عودةُ جزءٍ من خرْج النظام إلى دخْل النظام نفسه. تُصمَّم التغذيةُ الراجعة غالباً ضمن النظام..."
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "نشاط علاجي يعتمد على تشخيص عمل المتعلم، ويتم بطريقة موازية مع ممارسة العملية التعليمية التعلمية..."
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (2020)"
    - lemma: "تَغْذِيَةٌ مُرْتَدَّةٌ"
      confirm:
        - text: "إعادة جزء من إشارة صادرة من الخرج إلى الدخل الخاص بشبكة ثنائية المنفذ..."
          source: "مسرد الهندسة الكهربائية (1996)"
        - text: "تلقي المتعلم لمعلومات حول استجابته الخاطئة، مما يؤدي إلى تحصيل دراسي أفضل."
          source: "مسرد التربية (ArabTerm)"
    - lemma: "تَغْذِيَةٌ اسْتِرْجَاعِيَّةٌ"
      evidence_status: "no_material_found"
    - lemma: "تَغْذِيَةٌ خَلْفِيَّةٌ"
      confirm:
        - text: "بواسطة تحكُّم بمذبذب متحكم به بالجهد (VCO)، مع إشارة مشتقَّة من نظام تغذية خلفية خطيِّة لمسجِّل ذي زحزحة."
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"

