stage4_content:
  definition:
    current: "العملية التي يتم فيها إعادة جزء من مخرجات نظام ما إلى مدخلاته لتنظيم مخرجاته اللاحقة"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب أكثر شمولاً ليغطي جوانب المراقبة والتحكم."
    authored:
      - type: terminological
        text: "إِعَادَةُ جُزْءٍ مِنْ مَخْرُوجَاتِ نِظَامٍ مَا إِلَى مَدْخَلَاتِهِ لِلْمُرَاقَبَةِ أَوِ التَّحَكُّمِ فِي مَخْرُوجَاتِهِ اللَّاحِقَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَغْذِيَةٌ رَاجِعَةٌ"
        examples:
          - text: "تُعدُّ التغذية الراجعة من أهم أدوات تطوير العملية التعليمية."
            type: usage
      - lemma: "تَغْذِيَةٌ مُرْتَدَّةٌ"
        examples:
          - text: "تعتمد الدوائر الإلكترونية المستقرة على نظام تغذية مرتدة لضبط الجهد."
            type: usage
      - lemma: "تَغْذِيَةٌ اسْتِرْجَاعِيَّةٌ"
        examples:
          - text: "تستخدم أنظمة الذكاء الاصطناعي التغذية الاسترجاعية لتحسين خوارزميات التعلم."
            type: usage
      - lemma: "تَغْذِيَةٌ خَلْفِيَّةٌ"
        examples:
          - text: "يؤدي انقطاع التغذية الخلفية في نظام البث إلى تشويه الإشارة الصادرة."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13500583-n", definition_index: 0, text: "إِعَادَةُ جُزْءٍ مِنْ مَخْرُوجَاتِ نِظَامٍ مَا إِلَى مَدْخَلَاتِهِ لِلْمُرَاقَبَةِ أَوِ التَّحَكُّمِ فِي مَخْرُوجَاتِهِ اللَّاحِقَةِ."}

