        text: "صِفَةٌ فِي الأُسْلُوبِ تَتَجَلَّى فِي ضَعْفِ الصِّيَاغَةِ وَخُلُوِّهَا مِنَ الطَّاقَةِ التَّعْبِيرِيَّةِ وَالتَّأَلُّقِ"
