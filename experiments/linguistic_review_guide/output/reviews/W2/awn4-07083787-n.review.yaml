# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-07083787-n  |  ILI: i73834
# المراجع: AWN4 Review Pipeline v2
# التعريف الإنجليزي: a want of animation or brilliance
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «سطحية» لا أساس معجمي مستقل لها في قواعد البيانات المعجمية؛ تظهر فقط صفةً في تركيبات تقنية (مياه سطحية، كثافة سطحية)، ودلالتها «عدم العمق» تختلف عن «افتقار الحيوية والتألق» الذي يصف الأسلوب."
      - "التعريف الحالي «افتقار للحيوية أو التألق» ترجمةٌ حرفية للإنجليزية «a want of animation or brilliance»؛ ينبغي صياغته بأسلوب المعجم الوسيط."
      - "اللمّتان خاليتان من التشكيل الكامل في بيانات المجموعة."
    observations: >
      المجموعة تنتمي إلى الحقل الدلالي الأسلوبي (الجنس الأعلى: أسلوب/نمط تعبيري)، وتصف صفةً سلبية في الكتابة تتمثل في
      ضعف الحيوية وانعدام البريق. «الركاكة» لفظٌ تراثي راسخ في نقد الأسلوب العربي، وقد وثّقه المعجم الكبير صراحةً
      في هذا السياق. أما «السطحية» فهي لفظٌ مُحدث اكتسب دلالةً مجازية معاصرة (ضحالة الفكر)، وإدراجها في هذه المجموعة
      يُخلط بين مفهومَي «الضحالة الفكرية» و«الفتور الأسلوبي»؛ ولا تُؤيدها المعاجم في هذا المعنى.

  blind_candidates:
    - lemma: "فُتُورٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر ف-ت-ر على وزن فُعُول؛ قال ابن فارس: «أصل صحيح يدل على ضعف في الشيء».
        «فتور الأسلوب» يُقال في النقد الأدبي للدلالة على خفوت الحيوية وتراخي الطاقة التعبيرية.
        مصطلح مسكوك يُستعمل في نقد النصوص.
    - lemma: "خُمُولٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر خ-م-ل على وزن فُعُول؛ قال ابن فارس: «يدل على انخفاض واسترسال وسقوط».
        الخمول في الأسلوب غياب البروز والتألق، وهو مقابل العلو والجلاء في التعبير.
        المصدر مسكوك ويُستعمل استعمالاً موسّعاً في الوصف الأسلوبي.
    - lemma: "بُهُوتٌ"
      generation_method: majaz
      justification: >
        مجاز من بهت يبهُت: ذهب بريقه وانطفأ لمعانه — يُقال اللون الباهت. التوسع إلى الأسلوب يعني
        انعدام الإشراق والتألق في الصياغة. المجاز وظيفي لكنه ليس مصطلحاً أسلوبياً مسكوكاً.
    - lemma: "جُمُودٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر ج-م-د على وزن فُعُول؛ يدل على انعدام الحيوية والحركة.
        «جمود الأسلوب» يُستعمل في النقد الأدبي للدلالة على التصلب وافتقار التعبير إلى الحياة
        والنضارة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "ركاكة"
      confirm:
        - text: "«فى الأسلوب: ضَعْفُ الصِّياغَةِ اللُّغَوِيَّةِ وتهافُتُها. يقال: أُسْلُوبٌ فيه رَكَاكَةٌ»"
          source: "المعجم الكبير (مجمع اللغة العربية، القاهرة)"
      expands:
        - text: "«الرجل يستضعفه النساء فلا يهبنه؛ الذى لا يغار على أهله»"
          source: "المعجم الوسيط"
          addition: >
            هذا معنى آخر للفظ ركاكة (الرجل المستضعف)، يؤكد أن الجذر ركك يدل على الوهن والضعف
            بوجه عام، مما يُعزز الدلالة الأسلوبية.

    - lemma: "سطحية"
      evidence_status: "no_material_found"

    - lemma: "فُتُورٌ"
      confirm:
        - text: "«نقص مرضي في النشاط»"
          source: "معجم المصطلحات الطبية (ج.3، 1997) — translation_en: hypoactivity"
      expands:
        - text: "«الْفَاءُ وَالتَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ضَعْفٍ فِي الشَّيْءِ. مِنْ ذَلِكَ: فَتَرَ الشَّيْءُ يَفْتُرُ فُتُورًا. وَالطَّرْفُ الْفَاتِرُ: الَّذِي لَيْسَ بِحَدِيدٍ شَزْرٍ»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ)"
          addition: "يُثبت أن الجذر فتر يدل على الضعف والخفوت، وهو قريب من دلالة افتقار الحيوية."

    - lemma: "خُمُولٌ"
      confirm:
        - text: "«الخمول: خفاء القدر والذكر، وأصله السكون والخفاء، ومنه، خمل البساط لأنه يستر ما خلفه»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1031هـ)"
      expands:
        - text: "«الْخَاءُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى انْخِفَاضٍ وَاسْتِرْسَالٍ وَسُقُوطٍ. يُقَالُ خَمَلَ ذِكْرُهُ يَخْمُلُ خُمُولًا. وَالْخَامِلُ: الْخَفِيُّ»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ)"
          addition: "أصل الجذر يدل على الانخفاض والخفاء، وهو ذو صلة بانعدام البروز والتألق."

    - lemma: "بُهُوتٌ"
      contradicts:
        - text: "«المباِهِتُ الذى يَبْهَتُ السامِعَ بما يَفْتَرِيه عليه»"
          source: "المعجم الكبير (مجمع اللغة العربية، القاهرة)"
          conflict: >
            «البهوت» في المعجم يعني المبالغ في البهت (الافتراء والكذب)، وهو وصف للشخص لا للأسلوب،
            وليس له صلة بانعدام الحيوية والتألق في التعبير.
        - text: "«بَهُوتٌ: من يستقبل غيره بأمر يقذفه به هو منه بريء فيبهت السامع منه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            التعريف ذاته: «مَن يبهت الآخرين بالافتراء»، وهو وصف أخلاقي، لا وصف أسلوبي يتعلق بالتألق.

    - lemma: "جُمُودٌ"
      expands:
        - text: "«الجمود: هيئة حاصلة للنفس بها يقتصر عن استيفاء ما ينبغي وما لا ينبغي»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1031هـ)"
          addition: >
            الجمود هنا وصف نفسي للقصور وعدم السعي، مما يُشير إلى انعدام الحيوية بوجه عام.
        - text: "«أرْضٌ أَسْهَلُ من الجَمْدِ وأشدُّ مخالَطَةً للسُّهول»"
          source: "المعجم الكبير"
          addition: "هذا معنى آخر مغاير (نوع من الأرض)، يُثبت تعدد المعاني."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "ركاكة"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في المعجم الكبير صراحةً في سياق الأسلوب بمعنى «ضعف الصياغة اللغوية وتهافتها»،
        وهو المعنى المطلوب. وكلمة ركاكة مصطلح أسلوبي نقدي راسخ في التراث العربي. تحتاج إلى إضافة
        التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        ركاكة تشدد على ضعف الصياغة التعبيرية وتهافتها؛ هي مصطلح نقدي يصف قصور البناء اللغوي
        وعدم إتقان الأسلوب، لا مجرد الفتور العام.
      morphological_fit: >
        ركاكة على وزن فَعَالَة — وزن مصطلحي يدل على الخاصية أو الصفة المجردة (كالجزالة والفصاحة
        والرقاقة). مناسب تماماً لأسماء الصفات الأسلوبية.
      borrowing_check:
        loanword: false
        calque: false
        blind_translation: false
      quality_gate:
        ittiraad: true
        yusr_tadawul: true
        mulaama: true
        ithar_turathi: true
        ithar_arabi: true
        ishtiqaqiyya: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَكَاكَةٌ"

    - lemma: "سطحية"
      decision: removed
      decision_reason: >
        «سطحية» غائبة من المعاجم المعتمدة كمصطلح مستقل، ودلالتها «ضحالة التفكير وعدم العمق»
        تختلف اختلافاً دلالياً عن «افتقار الحيوية والتألق» في الأسلوب. إدراجها يُسبّب خلطاً
        بين مفهومَي الضحالة الفكرية وفتور الأسلوب. لا تجتاز اختبار السكّ: يمكن إبدال «سطحية»
        بـ«ضحلة» في أي جملة وصفية دون أن تتغير الدلالة، مما يُثبت أنها صفة وصفية لا مصطلح أسلوبي مستقل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فُتُورٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم صحة الجذر ودلالته على الضعف، «الفتور» في التراث المعجمي يصف حالة نفسية أو جسدية (فتور الشوق،
        فتور العزيمة)، أو النقص المرضي في النشاط. لا يُستعمل مصطلحاً نقدياً أسلوبياً ثابتاً للدلالة
        على ضعف الحيوية في الكتابة. لا يجتاز اختبار التثبيت المعجمي في المجال الأسلوبي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "خُمُولٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «الخمول» يعني خفاء القدر والذكر وانعدام الشهرة، لا انعدام الحيوية التعبيرية أو التألق
        الأسلوبي. الحقل الدلالي مختلف: الخمول يصف الشخص المجهول، لا الأسلوب الفاتر. تحققت
        المغايرة الدلالية ولا صلة وثيقة بالمفهوم المطلوب.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "بُهُوتٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم تُعرّف «البهوت» بمعنى من يبهت الآخرين بالافتراء والكذب — وصف أخلاقي للشخص،
        لا وصف أسلوبي. الأدلة المعجمية تُعارض هذا الاستعمال صراحةً. حتى المجاز من «باهت اللون»
        ليس مسكوكاً في سياق النقد الأدبي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "جُمُودٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «جمود الأسلوب» يُقال أحياناً لكنه يدل على التصلب والعجز عن التجدد والتطور، وهو مفهوم
        مختلف عن «افتقار الحيوية والتألق». الفارق: الركاكة وهنٌ في بنية الأسلوب، والجمود عجزٌ
        عن المرونة. لا يُرادف المفهوم المحدد في تعريف المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "افتقار للحيوية أو التألق"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزية «a want of animation or brilliance»؛ يفتقر إلى
        الجنس القريب الصريح (الأسلوب) ويصوّر المفهوم في فضاء دلالي مفتوح. ينبغي تأطيره
        ضمن سياق الأسلوب صراحةً وصياغته بمعجمية عربية.
