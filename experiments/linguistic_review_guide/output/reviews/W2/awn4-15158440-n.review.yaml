stage4_content:
  definition:
    current: "خاصية البقاء أو الاستمرار في الزمن"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكنه يحتاج لشمول معنى 'المدى الزمني' المستغرق."
    authored:
      - type: terminological
        text: "خاصية البقاء أو الاستمرار في الزمن، أو المدى الزمني الذي يستغرقه وجود شيء أو حدوثه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "خاصية البقاء أو الاستمرار في الزمن، أو المدى الزمني الذي يستغرقه وجود شيء أو حدوثه."}
  examples:
    per_lemma:
      - lemma: "اسْتِمْرَار"
        examples:
          - text: "نؤكد على استمرار التعاون المشترك بين البلدين."
            type: usage
      - lemma: "مُدَّة"
        examples:
          - text: "استغرقت الرحلة مدة قصيرة لم تتجاوز الساعة."
            type: usage
      - lemma: "دَيْمُومَة"
        examples:
          - text: "الديمومة هي سر نجاح واستقرار المؤسسات الكبرى."
            type: usage
      - lemma: "بَقَاء"
        examples:
          - text: "تصارع الكائنات الحية في الغابة من أجل البقاء."
            type: usage
      - lemma: "اسْتِمْرَارِيَّة"
        examples:
          - text: "نهدف إلى تحقيق استمرارية الإنتاج رغم التحديات."
            type: usage
      - lemma: "أَمَد"
        examples:
          - text: "وضعت الحكومة خطة تنموية طويلة الأمد."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تختلف ديمومة الأثر الفني باختلاف المواد المستخدمة في صنعه."}

stage5_enrichment:
  per_entry:
    - lemma: "اسْتِمْرَار"
      entry_id: "{auto}"
      root: "مرر"
      maqayis_quote: "«الْمِيمُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى مُضِيِّ شَيْءٍ... فَالْأَوَّلُ مَرَّ الشَّيْءُ يَمُرُّ، إِذَا مَضَى.»"
    - lemma: "مُدَّة"
      entry_id: "{auto}"
      root: "مدد"
      maqayis_quote: "«الْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ فِي طُولٍ، وَاتِّصَالِ شَيْءٍ بِشَيْءٍ فِي اسْتِطَالَةٍ.»"
    - lemma: "دَيْمُومَة"
      entry_id: "{auto}"
      root: "دوم"
      maqayis_quote: "«الدَّالُ وَالْوَاوُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى السُّكُونِ وَاللُّزُومِ. يُقَالُ دَامَ الشَّيْءُ يَدُومُ، إِذَا سَكَنَ.»"
    - lemma: "بَقَاء"
      entry_id: "{auto}"
      root: "بقي"
      maqayis_quote: "«الْبَاءُ وَالْقَافُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الدَّوَامُ. قَالَ الْخَلِيلُ: يُقَالُ: بَقِيَ الشَّيْءُ يَبْقَى بَقَاءً، وَهُوَ ضِدُّ الْفَنَاءِ.»"
    - lemma: "اسْتِمْرَارِيَّة"
      entry_id: "{auto}"
      root: "مرر"
      maqayis_quote: "«الْمِيمُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى مُضِيِّ شَيْءٍ...»"
    - lemma: "أَمَد"
      entry_id: "{auto}"
      root: "أمد"
      maqayis_quote: "«الْهَمْزَةُ وَالْمِيمُ وَالدَّالُ، الْأَمَدُ: الْغَايَةُ. كَلِمَةٌ وَاحِدَةٌ لَا يُقَاسُ عَلَيْهَا.»"
  per_sense:
