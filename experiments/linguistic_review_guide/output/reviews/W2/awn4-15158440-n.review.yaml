stage1_review:
  assessment:
    concerns:
      - "كلمة 'مدة' غالباً ما تشير إلى المقدار الزمني (interval) أكثر من خاصية البقاء (property)."
      - "كلمة 'استمرار' هي مصدر للفعل، بينما 'استمرارية' تعبر بشكل أدق عن 'الخاصية' (property) المطلوبة في التعريف."
    observations: "التعريف يركز على 'الخاصية' (property) وعلى 'البقاء في الزمن'. المصطلحات المرشحة يجب أن تغطي جانبي الدوام (endurance) والامتداد الزمني (duration)."
  blind_candidates:
    - lemma: "دَيْمُومَة"
      generation_method: ishtiqaq
      justification: "من الفعل 'دام'، وتعبر عن صفة الثبات والدوام والاستمرار في الزمن."
    - lemma: "بَقَاء"
      generation_method: ishtiqaq
      justification: "المصدر المباشر للفعل 'بقي'، ويعبر عن خاصية الصمود والوجود في الزمن وعدم الفناء."
    - lemma: "اسْتِمْرَارِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي يعبر عن 'خاصية' الاستمرار، وهو أدق من المصدر المجرد 'استمرار' في سياق التعريف."
    - lemma: "أَمَد"
      generation_method: ishtiqaq
      justification: "كلمة تدل على الغاية والمدة الزمنية، وتستخدم بكثرة في سياق الامتداد الزمني (long duration)."

stage2_evidence:
  per_lemma:
    - lemma: "اسْتِمْرَار"
      confirm:
        - text: "«عدد الأجيال التي يبقى فيها أليل ما في جماعة قبل أن يفقد.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة"
    - lemma: "مُدَّة"
      confirm:
        - text: "«(الْمِدَّة) مِقْدَار من الزَّمَان يَقع على الْقَلِيل وَالْكثير.»"
          source: "المعجم الوسيط"
        - text: "«مدة أو كمية الصوت أو انتشاره في الزمن، أو المدة التي يستمر فيها الصوت منذ إحداثه.»"
          source: "مسرد الإعلام والتواصل"
    - lemma: "دَيْمُومَة"
      confirm:
        - text: "«الديمومة: الدوام والثبات.»"
          source: "المعجم الكبير"
        - text: "«duration: ديمومة»"
          source: "مسرد الفلسفة وعلم النفس"
    - lemma: "بَقَاء"
      confirm:
        - text: "«البقاء: ثبات الشيء على الحالة الأولى ويضاده الفناء.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«duration: بقاء»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
    - lemma: "اسْتِمْرَارِيَّة"
      confirm:
        - text: "«continuance: استمرارية»"
          source: "المورد الحديث"
        - text: "«continuance: استمرارية»"
          source: "المعجم الطبي الموحد"
    - lemma: "أَمَد"
      confirm:
        - text: "«duration: أمد»"
          source: "المكنز الزراعي"
        - text: "«duration: أمد»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"

