      nuance: "تركز على استدامة الوجود في مواجهة عوامل الفناء أو التلاشي."
      mwe: false
    - lemma: "مُدَّة"
      sense_id: "{auto}"
      nuance: "تعبر عن الكمية الزمنية أو المقدار الفاصل بين نقطتين زمنيتين."
      mwe: false
    - lemma: "أَمَد"
      sense_id: "{auto}"
      nuance: "غالباً ما تستخدم للتعبير عن النطاق الزمني البعيد أو الغاية الزمنية."
      mwe: false
    - lemma: "اسْتِمْرَار"
      sense_id: "{auto}"
