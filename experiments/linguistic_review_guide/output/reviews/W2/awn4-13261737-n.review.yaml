      reason: "التعريف الحالي يخلط بين الملكية العامة (public ownership — ملك الدولة) والملكية المشتركة (common ownership — اشتراك أفراد في ملكية شيء). وهما مفهومان مختلفان في القانون. كما أنه يفتقر إلى الجنس القريب والفصل النوعي."
    authored:
      - type: terminological
        text: "حالة قانونية يشترك فيها شخصان أو أكثر في ملكية شيء واحد دون تقسيم أنصبتهم فيه."
