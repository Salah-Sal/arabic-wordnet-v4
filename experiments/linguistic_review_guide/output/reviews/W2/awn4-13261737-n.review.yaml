# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13261737-n (common ownership)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (مِلْكِيَّة مُشْتَرَكَة)، وهي تعبير مركب وصفي، ولا توجد لمّات مفردة تدلّ على المفهوم ذاته"
      - "التعريف العربي (الملكية العامة أو المشتركة) يخلط بين الملكية العامة (public/state ownership) والملكية المشتركة (common/joint ownership) وهما مفهومان مختلفان"
    observations: "المفهوم (common ownership) مفهوم قانوني واقتصادي يشير إلى حالة اشتراك شخصين أو أكثر في ملكية شيء واحد. في التراث الفقهي العربي يُعبَّر عنه بالشيوع أو المُشاع. المعرِّف الحالي بمقابل community يشير إلى المعنى السادس في المورد الحديث وهو المِلكيّة المشترَكة تحديداً."
  blind_candidates:
    - lemma: "شُيُوع"
      generation_method: ishtiqaq
      justification: "من جذر (شيع)، على وزن فُعُول. الشُّيوع مصدر شاعَ يشيعُ، ويُستعمل في الفقه والقانون للدلالة على حالة الاشتراك في الملكية دون تقسيم الأنصبة."
    - lemma: "مُشَاع"
      generation_method: ishtiqaq
      justification: "من جذر (شيع)، اسم مفعول أو صفة مشبّهة. المُشاع هو المِلك المشترك غير المقسّم، يُستعمل اسماً للدلالة على الملكية الشائعة."
    - lemma: "شِرْكَة"
      generation_method: ishtiqaq
      justification: "من جذر (شرك)، على وزن فِعْلَة. أصل الشِّركة الاشتراك في الملك، وهو معناها الأوّل في المعاجم قبل أن يغلب عليها معنى العقد التجاري."
    - lemma: "مِلْك شَائِع"
      generation_method: tarkib
      justification: "تركيب وصفي من (مِلْك) و(شائع). يُستعمل في القانون العربي للدلالة على الملكية المشتركة غير المقسّمة."

stage2_evidence:
  per_lemma:
    - lemma: "مِلْكِيَّة مُشْتَرَكَة"
      confirm:
        - text: "«الملكية التي تكون مشتركة بين مجموعة أشخاص أوبين شخصين كالملكية المشاعة والحائط المشترك والطريق الخاص المشترك.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«(6) المِلْكِيّة المشترَكة»"
          source: "المورد الحديث (2008) — مادة community"
        - text: "«(1) شَرِكة في الإرث (2) مِلْكيّة مُشتَرَكة.»"
          source: "المورد الحديث (2008) — مادة coparcenary"
      expands:
        - text: "«ملكية مشتركة = joint ownership»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "يقابل المصطلح joint ownership إضافة إلى community property"
        - text: "«ملكية مشتركة = collective property»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يقابل أيضاً collective property وcommon property وco-property"

    - lemma: "شُيُوع"
      confirm:
        - text: "«(فى القانون): حالةٌ قانونيةٌ تنشأُ حينَ يكونُ هنالك حقٌّ مشتركٌ بينَ اثنين أو أكثر»"
          source: "المعجم الكبير"
      expands:
        - text: "«لَهُ سَهْمٌ شَائِعٌ، إِذَا كَانَ غَيْرَ مَقْسُومٍ. وَكَأَنَّ مَنْ لَهُ سَهْمٌ وَنَصِيبٌ انْتَشَرَ فِي السَّهْمِ حَتَّى أَخَذَهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يربط الشيوع بالانتشار في النصيب المشترك"
        - text: "«(الْمشَاع) الشُّيُوع»"
          source: "المعجم الوسيط"
          addition: "المُشاع والشُّيوع مترادفان في الوسيط"

    - lemma: "مُشَاع"
      confirm:
        - text: "«مُشتركُ الملكِيَّة من غير تقسيمٍ»"
          source: "المعجم الكبير"
        - text: "«المُشَاع: ما يحتوي على حِصصَ شائعة.»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«(الْمشَاع) الشَّائِع والمشترك الْمُبْهم لم يحدد»"
          source: "المعجم الوسيط"
          addition: "المُشاع يُستعمل اسماً وصفةً للمشترك غير المحدد"
        - text: "«الْمشَاع: مُشْتَرك وتقسيم نيافته — وَبيع الْمشَاع جَائِز دون هِبته»"
          source: "دستور العلماء للأحمدنكري"
          addition: "يوضح الأحكام الفقهية المتعلقة بالمشاع"

    - lemma: "شِرْكَة"
      confirm:
        - text: "«الشَّرِكَة: خلط مالين لَا يتَمَيَّز أَحدهمَا عَن الآخر بِشَرْط.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الشركة: اختلاط نصيبين فصاعدا لامتزاج واجتماع... وقال أبو البقاء: أصل الشركة توزيع الشيء بين اثنين على جهة الشيوع.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«(الشّركَة) عقد بَين اثْنَيْنِ أَو أَكثر للْقِيَام بِعَمَل مُشْتَرك»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعاصر السائد هو العقد التجاري (company/corporation) لا مطلق الاشتراك في الملكية"

    - lemma: "مِلْك شَائِع"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مِلْكِيَّة مُشْتَرَكَة"
      decision: confirmed
      decision_reason: "مصطلح ثابت مُعتمد في معاجم القانون والاقتصاد والتجارة، يقابل community property وjoint ownership وcommon property. مُوثّق في المعجم الموحد لمصطلحات القانون بتعريف صريح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions: []

    - lemma: "شُيُوع"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح قانوني فصيح مُوثّق في المعجم الكبير بتعريف صريح: حالة قانونية تنشأ حين يكون هنالك حق مشترك. وهو مصدر عربي أصيل من جذر (شيع) على وزن فُعُول، ويُكمل المجموعة بإضافة لمّة مفردة غير مركبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "شُيُوع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُشَاع"
      source: stage1
      decision: removed
      decision_reason: "المُشاع يدلّ على المِلك المشترك ذاته (العين الشائعة) لا على حالة الاشتراك في الملكية. فهو يجيب عن سؤال (ما الشيء المملوك؟) لا (ما نوع العلاقة؟). والمجموعة الترادفية هنا عن علاقة الملكية لا عن العين المملوكة."

    - lemma: "شِرْكَة"
      source: stage1
      decision: removed
      decision_reason: "رغم أصلها اللغوي في الاشتراك بالملك، فقد غلب على الشِّركة في الاستعمال المعاصر معنى العقد التجاري (company/corporation). إدراجها سيُحدث التباساً شديداً مع المعنى السائد."

    - lemma: "مِلْك شَائِع"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية عليه كمصطلح ثابت. وهو أقرب إلى وصف العين المملوكة (المِلك الذي لم يُقسم) منه إلى وصف نوع العلاقة (common ownership). كما أنّ (المُشاع) أكثر تداولاً منه لهذا المعنى."

