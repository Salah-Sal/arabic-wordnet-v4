# مراجعة المجموعة الترادفية — awn4-05145473-n
# ili: i63991 | pos: n | lemmas_en: worth
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (جدارة وقيمة) مكتوبتان بلا تشكيل في AWN"
      - "التعريف العربي يستخدم «قيماً» وهو دوران مع اللمّة «قيمة»"
      - "لمّة «جدارة» تنتمي دلالياً إلى حقل الكفاءة والاستحقاق الشخصي لا إلى حقل قدر الأشياء وثمنها"
      - "مفردة «الجودة» في التعريف قد توحي بجودة الصنع (quality of workmanship) لا بالقيمة الذاتية"
    observations: "المجموعة تعبّر عن مفهوم «القيمة الذاتية الكامنة في الشيء» التي تجعله محلّ رغبة أو انتفاع. اللمّة المركزية هي «قيمة» وهي متجذّرة تجذّراً راسخاً في التراث المعجمي العربي بمعنى «قدر الشيء وثمنه». أما «جدارة» فدلالتها الأصيلة المتّفق عليها هي الاستحقاق والكفاءة، أي صفة الشخص الجدير بمنزلة أو مكانة — وهذا أقرب إلى «merit/worthiness» لا إلى «worth» في معنى قيمة الأشياء. حقل الجذر (جدر) في المقاييس يدور حول الجدار والثبات والحريّ بالشيء — لا حول الثمن والتقدير."

  blind_candidates:
    - lemma: "نَفَاسَة"
      generation_method: ishtiqaq
      justification: "مصدر من نَفِيس على وزن فَعَالَة — الصفة التي تجعل الشيء نفيساً مرغوباً ذا قدر يُتنافَس عليه؛ تغطّي البُعدَين الجماليَّ والمادي للمفهوم دون دوران مع «قيمة»."
    - lemma: "خَطَر"
      generation_method: majaz
      justification: "إحياء للمعنى الكلاسيكي الأصيل لـ«خطر» — القدر والمنزلة والشرف («هو عظيم الخطر» أي رفيع القدر) — كمرادف للقيمة الذاتية. فيه خطر الاشتراك مع المعنى الحديث (danger)."
    - lemma: "جَدْوَى"
      generation_method: ishtiqaq
      justification: "من ج-د-و/ج-د-ي، تدلّ على الفائدة والمنفعة والغناء — تغطّي الشقّ الوظيفي «مفيداً» من التعريف."
    - lemma: "رَغَابَة"
      generation_method: ishtiqaq
      justification: "مصدر من رَغِبَ على وزن فَعَالَة — صفة كون الشيء مرغوباً فيه مطلوباً؛ تغطّي الشقّ الأول «مرغوباً» من التعريف."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة:
#  Q1 — مطابقة دفعية: جدارة/قيمة/جدوى/خطر/نفاسة/رغابة (مع ال- وبدونها)
#  Q2 — إثراء بالمعرّف: تعريفات وأمثلة لمداخل جدارة وقيمة المحددة
#  Q3 — جسر إنجليزي: worth / worthiness / value / merit
#  Q4 — FTS كلمات مفتاحية: جدارة / نفاسة / مرغوب / قيمة الشيء
#  Q5 — مقاييس اللغة: جدر / قوم / نفس / رغب (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "جدارة"
      contradicts:
        - text: "«بَاب الجدارة والاستحقاق — اسْتوْجبَ وَاسْتحق واستأهل»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (ت674هـ)"
          conflict: "تُصنَّف اللمّة ضمن باب الاستحقاق الشخصي والأهليّة، لا ضمن دلالة قدر الأشياء أو ثمنها"
        - text: "«competence; jurisdiction; responsibility (competence)»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — أرابترم"
          conflict: "الترجمات التقنية المُثبَّتة تحصر معناها في الكفاءة والاختصاص، وهو حقل دلالي مختلف عن «worth»"
        - text: "«(1) جدارة؛ استحقاق؛ أهلية؛ كفاءة | (2) حَسَنَة؛ فضيلة؛ ميزة»"
          source: "المورد الحديث (2008) — ترجمة عكسية لـ merit"
          conflict: "المورد الحديث يترجم «merit» بـ«جدارة» لا «worth» — يؤكد أن الدلالتين متمايزتان"
      expands:
        - text: "«رقم الجدارة» — ترجمة لـ figure of merit"
          source: "موسوعة الكهرباء IEC 60050 — أرابترم"
          addition: "تُستخدم مضافةً في التعبير الاصطلاحي «رقم الجدارة» لوصف جودة الأنظمة التقنية، وهو استخدام محدود ومُقيَّد لا يثبت الترادف العام مع «worth»"

    - lemma: "قيمة"
      confirm:
        - text: "«قيمة الشيء: قدره | قيمة المتاع: ثمنه | ما لفلان قيمةٌ: ماله ثباتٌ ودوامٌ على الأمر»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
        - text: "«(الْقيمَة) قيمَة الشَّيْء قدره وَقِيمَة الْمَتَاع ثمنه وَمن الْإِنْسَان طوله»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35، ت1998م)"
        - text: "«القيمة: الثمنُ الذي يقاوم المتاع، أي يقوم مقامه»"
          source: "التعريفات الفقهية للبركتي (ت1975م)"
      expands:
        - text: "«القيمة:[في الانكليزية] Value — هي شرعاً ما يدخل تحت تقويم مقوّم وقد سبق في لفظ الثمن»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (ت1188هـ)"
          addition: "يُؤكّد أن القيمة تقوم على مبدأ الإحلال والتعادل — وهو الأصل الاشتقاقي من «قوم» (أن تُقيم هذا مكان ذاك)"
        - text: "«وَأَصْلُ الْقِيمَةِ الْوَاوُ، وَأَصْلُهُ أَنَّكَ تُقِيمُ هَذَا مَكَانَ ذَاكَ»"
          source: "مقاييس اللغة لابن فارس (ت395هـ) — مدخل قوم"
          addition: "يكشف الأصل الاشتقاقي: القيمة ما يقوم مقام الشيء في التبادل — دلالة جوهرية على الثمن والقدر"

    - lemma: "نَفَاسَة"
      evidence_status: "no_material_found"

    - lemma: "خَطَر"
      contradicts:
        - text: "«hazard; danger / risk»"
          source: "متعدد المعاجم الأرابترمية: مصطلحات المياه، القانون، البيئة، الطب البيطري، الكهرباء"
          conflict: "الاستخدام المعاصر المُرسَّخ في المعاجم التقنية يحصر «خطر» في معنى الخطر والمجازفة والأذى لا القيمة"
      expands:
        - text: "«الخَطَرُ: الشَّرَفُ, والمالُ, والمَنْزِلَةُ, وارتفاعُ القَدْرِ. والأصل فيه: هو السَّبَقُ يُتَراهَن عليه, ثم اسْتُعِير للشَّرَفِ والمَزِيَّة»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          addition: "يحمل «خطر» في التراث الكلاسيكي دلالة القدر والمنزلة المتقاطعة مع «worth» لكن هذا المعنى محتجَب خلف الاستخدام الحديث"
        - text: "«الْخَاءُ وَالطَّاءُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا الْقَدْرُ وَالْمَكَانَةُ، وَالثَّانِي اضْطِرَابٌ وَحَرَكَةٌ. فَالْأَوَّلُ قَوْلُهُمْ لِنَظِيرِ الشَّيْءِ خَطِيرُهُ. وَلِفُلَانٍ خَطَرٌ، أَيْ مَنْزِلَةٌ وَمَكَانَةٌ»"
          source: "مقاييس اللغة لابن فارس (ت395هـ) — مدخل خطر"
          addition: "يُثبت ابن فارس أن الأصل الأول للجذر خطر هو القدر والمكانة — مما يُعزّز إمكانية إحياء هذا المعنى نظرياً"

    - lemma: "جَدْوَى"
      contradicts:
        - text: "«الفائدةُ والمَنْفَعَةُ | دِرَاسَةُ الجَدْوَى (في الاقتصاد): دراسةٌ مُسْتَفِيضةٌ تسْبِقُ تَنْفِيذَ مَشْرُوعٍ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: "تدلّ على الفائدة المتحقّقة (utility/benefit) لا على الصفة الذاتية الكامنة التي تجعل الشيء ذا قيمة"
        - text: "«feasibility»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — أرابترم"
          conflict: "يستقرّ معناها التقني في دراسة الجدوى الاقتصادية — بعيدٌ كلّ البُعد عن مفهوم «worth»"

    - lemma: "رَغَابَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "جدارة"
      decision: removed
      decision_reason: "دلالة «جدارة» الأصيلة المُجمَع عليها في المعاجم هي الكفاءة والاستحقاق الشخصي (merit/competence/worthiness for a role)، وهي حقل دلالي مستقل عن «قيمة الشيء وقدره» (worth of an entity). الأدلة المعجمية تُصنّفها في «باب الاستحقاق والاستئهال» لا في باب الثمن والقدر. استخدامها في «رقم الجدارة» (figure of merit) جزئيٌّ ومتخصص ومُقيَّد بإضافة إليها. لا يصحّ إبقاؤها مرادفاً عاماً لـ«worth» في هذه المجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قيمة"
      decision: confirmed
      decision_reason: "اللمّة متجذّرة في التراث المعجمي بمعنى «قدر الشيء وثمنه» وهو معنى مطابق لـ«worth» المقصود في هذه المجموعة. أدلّتها قاطعة ومتعدّدة المصادر (الوسيط، الكبير، التعريفات الفقهية، المقاييس). تحتاج إلى إضافة تشكيل كامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "«قِيمَة» تعبّر عن القدر الذاتي الكامن في الشيء — يشمل ثمنه المادي ونفاسته وكلّ ما يجعله محلّ طلب — وهي أشمل وأدقّ من «جَدَارَة» التي تختصّ بالاستحقاق الشخصي وأهليّة نيل مرتبة أو مكانة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِيمَة"

    - lemma: "نَفَاسَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثَر على مدخل معجمي مُثبَّت لـ«نَفَاسَة» كوحدة معجمية مستقلة في أيٍّ من المعاجم المستعلَمة. نَفِيس موثَّق جيداً لكن «نَفَاسَة» كاسم مصدر لهذه الدلالة غير مُعجَّم. قد تُدرج مستقبلاً بعد التثبّت من تداولها."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "خَطَر"
      source: stage1
      decision: removed
      decision_reason: "رغم أن «خطر» يحمل في التراث الكلاسيكي معنى القدر والمنزلة الذي يتقاطع مع «worth»، فإن الاستخدام المعاصر يُحصره في الخطر والمجازفة والضرر. ترسيمه في هذه المجموعة سيُفضي إلى اشتراك لفظي مُضِرّ مع المجموعات الدلالية لـ hazard/risk."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "جَدْوَى"
      source: stage1
      decision: removed
      decision_reason: "تدلّ «جَدْوَى» على الفائدة المتحقّقة والنفع الملموس (utility/benefit)، لا على الصفة الذاتية الكامنة في الشيء التي تجعله ذا قيمة. الدلالتان متمايزتان: شيء له جدوى ≠ شيء له قيمة بالضرورة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "رَغَابَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثَر على مدخل معجمي لـ«رَغَابَة» بمعنى صفة كون الشيء مرغوباً فيه. الجذر (رغب) موثَّق ومعاجمه تُعطي «رغبة/رغائب» لا «رغابة». اشتقاقٌ غير مُعجَّم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "الجودة التي تجعل الشيء مرغوباً أو قيماً أو مفيداً"
    assessment:
      decision: revise
      reason: "التعريف مترجَم ترجمةً شبه حرفية من الإنجليزية، ويتضمّن «قيماً» وهو دوران مع اللمّة المؤكَّدة «قِيمَة». كما أن «الجودة» توحي بجودة الصنع (quality of workmanship) لا بالقيمة الذاتية. يُستحسن تعريفٌ بأسلوب المعجم الوسيط يُحدّد الجنس (صفة جوهرية) والفصل (ما تُحدثه في الشيء)."
    authored:
      - type: terminological
        text: "صِفَةٌ جَوْهَرِيَّةٌ فِي الشَّيْءِ تَجْعَلُهُ مَحَلَّ رَغْبَةٍ أَوِ انْتِفَاعٍ أَوِ اسْتِحْسَانٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَا يَنْطَوِي عَلَيْهِ الشَّيْءُ مِنْ خَصَائِصَ تُعَلِّي مِنْ شَأْنِهِ وَتَجْعَلُهُ مَطْلُوبًا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صِفَةٌ جَوْهَرِيَّةٌ فِي الشَّيْءِ تَجْعَلُهُ مَحَلَّ رَغْبَةٍ أَوِ انْتِفَاعٍ أَوِ اسْتِحْسَانٍ"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "مَا يَنْطَوِي عَلَيْهِ الشَّيْءُ مِنْ خَصَائِصَ تُعَلِّي مِنْ شَأْنِهِ وَتَجْعَلُهُ مَطْلُوبًا"

  examples:
    per_lemma:
      - lemma: "قِيمَة"
        examples:
          - text: "تَتَحَدَّدُ قِيمَةُ التُّحْفَةِ الأَثَرِيَّةِ بِمَا تَنْطَوِي عَلَيْهِ مِنْ نَدْرَةٍ وَأَصَالَةٍ تَارِيخِيَّةٍ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَتَحَدَّدُ قِيمَةُ التُّحْفَةِ الأَثَرِيَّةِ بِمَا تَنْطَوِي عَلَيْهِ مِنْ نَدْرَةٍ وَأَصَالَةٍ تَارِيخِيَّةٍ."


