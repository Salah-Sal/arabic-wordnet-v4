stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «درجة الحرارة» مركب إضافي بدون تشكيل كامل"
      - "المجموعة تحتوي لمّة واحدة فقط — يمكن إثراؤها بلمّات إضافية إذا توفرت مرادفات حقيقية"
      - "التعريف العربي يبدو ترجمة شبه حرفية للتعريف الإنجليزي، ويمكن تحسينه بأسلوب معجمي عربي"
    observations: "المفهوم المستهدف هو الكمية الفيزيائية التي تقيس مقدار سخونة جسم أو برودته، وهي إحدى الكميات الأساسية في النظام الدولي للوحدات. في الاستعمال العلمي العربي يُفرَّق بين «الحرارة» (heat = طاقة) و«درجة الحرارة» (temperature = كمية فيزيائية). المركب الإضافي «درجة الحرارة» هو المصطلح المعياري المعتمد في جميع المعاجم التقنية العربية."
  blind_candidates:
    - lemma: "حَرَارَة"
      generation_method: ishtiqaq
      justification: "من جذر «حرر» على وزن فَعَالَة، وهو المصدر الدال على حالة السخونة، يُستعمل أحياناً اختصاراً بدلاً من «درجة الحرارة» في السياق العلمي العام"
    - lemma: "حَرٌّ"
      generation_method: majaz
      justification: "لفظ تراثي يدل على ضد البرد، يمكن توسيعه مجازاً ليشمل مقدار السخونة والبرودة عموماً"
    - lemma: "دَرَجَةٌ حَرَارِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي (واصف + موصوف) بمعنى المقدار الحراري، بديل تركيبي للمركب الإضافي «درجة الحرارة»"
    - lemma: "حُرُورَة"
      generation_method: ishtiqaq
      justification: "من جذر «حرر» على وزن فُعُولَة الدال على الحالة المستقرة، محاولة لإحياء صيغة تراثية تدل على مقدار الحرارة"

