stage3_analysis:
  per_lemma:
    - lemma: "دَرَجَةُ الحَرَارَةِ"
      decision: confirmed
      decision_reason: "مصطلح معياري ثابت في أكثر من عشرة معاجم تقنية عربية معتمدة (فيزياء، كيمياء، أحياء، طب، صيدلة، مياه، طاقة، زراعة)، وهو المقابل الاصطلاحي الوحيد المتواتر لـ temperature بوصفها كمية فيزيائية أساسية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَرَجَةُ الحَرَارَةِ"

    - lemma: "حَرَارَة"
      source: stage1
      decision: removed
      decision_reason: "في المعاجم التقنية العربية المعتمدة (فيزياء، كيمياء، جيولوجيا، طب) تُقابل «حرارة» المصطلح الإنجليزي heat (طاقة حرارية)، وهي مفهوم فيزيائي مختلف عن temperature (درجة الحرارة). الخلط بينهما خطأ علمي اصطلاحي"

    - lemma: "حَرٌّ"
      source: stage1
      decision: removed
      decision_reason: "«الحرّ» يدل على حالة السخونة (ضد البرد)، وهو وصف نوعي لطرف واحد من الطيف الحراري، لا يشمل البرودة. أما temperature فكمية كمية تشمل السخونة والبرودة معاً. لا يصلح مرادفاً علمياً"

    - lemma: "دَرَجَةٌ حَرَارِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على ثبوت هذا المركب الوصفي. المصطلح المعياري المتواتر هو المركب الإضافي «درجة الحرارة» لا الوصفي. اختبار الاستبدال: يمكن قول «درجة سُخنية» أو «درجة حرورية» بنفس البنية، مما يدل على أنه ليس وحدة معجمية مسكوكة"

    - lemma: "حُرُورَة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على هذه الصيغة. الوارد في المعاجم «حُرور» (ريح حارة) و«حرارة» (مصدر)، لكن «حُرُورَة» على وزن فُعُولَة غير مسموعة ولا مقيسة لهذا الجذر"

