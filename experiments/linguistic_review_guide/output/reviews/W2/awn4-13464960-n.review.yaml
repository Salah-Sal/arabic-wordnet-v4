          root: "ايض"
          maqayis_quote: "«الْهَمْزَةُ وَالْيَاءُ وَالضَّادُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى الرُّجُوعِ وَالْعَوْدِ، يُقَالُ: آضَ يَئِيضُ: إِذَا رَجَعَ...»"
        - word: "هدمي"
          root: "هدم"
          maqayis_quote: "«الْهَاءُ وَالدَّالُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى حَطِّ بِنَاءٍ...»"
