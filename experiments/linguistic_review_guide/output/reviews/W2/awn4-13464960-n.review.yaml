stage1_review:
  assessment:
    concerns:
      - "خلو اللمة (أيض هدمي) من التشكيل."
      - "اللمة (هدم) واسعة الدلالة، ورغم صحتها في السياق البيولوجي كمقابل لـ(بناء)، يفضل إضافة مرادفات متخصصة."
    observations: "المفهوم يعبر عن (catabolism) أو عملية الهدم في الاستقلاب (الأيض). المصطلحات المستخدمة في المعاجم العلمية والطبية تشمل (أيض هدمي)، (هدم)، و(تقويض)."
  blind_candidates:
    - lemma: "هَدْم"
      generation_method: ishtiqaq
      justification: "مصطلح أساسي يقابل (بناء) في وصف العمليات الأيضية للكائن الحي."
    - lemma: "تَقْوِيض"
      generation_method: ishtiqaq
      justification: "مشتق من قوض (نقض البناء)، وهو شائع جداً في الاستخدام الطبي والبيولوجي الحديث للدلالة على الهدم الأيضي."
    - lemma: "أَيْض هَدْمِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يحدد نوع العملية الأيضية بشكل دقيق لا لبس فيه."
    - lemma: "تَحَلُّل حَيَوِيّ"
      generation_method: tarkib
      justification: "مصطلح يدل على تفكك المواد في الكائنات الحية، وإن كان يستخدم غالبا للـ (biodegradation)."

stage2_evidence:
  per_lemma:
    - lemma: "أَيْض هَدْمِيّ"
      confirm:
        - text: "«تقسيم جزيئات ضخمة لمواد غذائية رئيسية، كربوهدرات أو بروتينات أو دهون، بالاعتماد على سلاسل مختلفة من التفاعلات الحيوية، إلى جزيئات بسيطة وتعبئة الطاقة المختزنة بالمواد الغذائية.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«catabolism»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "هَدْم"
      confirm:
        - text: "«البناءَ: أسقطه ونقضه. فهو هَدْمٌ [فَعْلٌ بمعنى مفعول]»"
          source: "المعجم الوسيط"
        - text: "«الانتقاض؛ الأَيْض الهَدْميّ: انحلال المركَّبات المُعَقَّدة في المتعضّيات الحيّة (أح).»"
          source: "المورد الحديث (2008)"
    - lemma: "تَقْوِيض"
      confirm:
        - text: "«استقلاب لمواد داخل الكائن الحيّ يؤدي إلى جعلها أكثر بساطة من حيث التركيب.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«catabolism»"
          source: "المعجم الطبي الموحد (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "أَيْض هَدْمِيّ"
      decision: confirmed
      decision_reason: "مصطلح وصفي دقيق وشائع ومعتمد في المعاجم العلمية الحديثة، وهو يربط الهدم بالأيض بصراحة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَيْض هَدْمِيّ"
    - lemma: "هَدْم"
      decision: confirmed
      decision_reason: "مصطلح فصيح وأساسي في علم الأحياء يُستخدم في سياق العمليات الأيضية مقابلاً لمصطلح (بناء)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَدْم"
    - lemma: "تَقْوِيض"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح متخصص ودقيق معتمد في المعاجم الطبية والصيدلانية كترجمة لـ (catabolism)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَقْوِيض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "تحلل المواد الأكثر تعقيدًا في الكائنات الحية إلى مواد أبسط مع إطلاق الطاقة"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وعلمي وصحيح، ويعبر عن مفهوم (catabolism) بدقة ووضوح يتفق مع المعاجم المتخصصة."
  examples:
    per_lemma:
      - lemma: "أَيْض هَدْمِيّ"
        examples:
          - text: "تعتمد الكائنات الحية على الأيض الهدمي للحصول على الطاقة اللازمة لوظائفها الحيوية."
            type: usage
      - lemma: "هَدْم"
        examples:
          - text: "يُقسّم الأيض في علم الأحياء إلى عمليتين متكاملتين هما البناء والهدم."
            type: usage
      - lemma: "تَقْوِيض"
        examples:
          - text: "يؤدي التقويض الخلوي إلى تحطيم الجزيئات المعقدة وإنتاج جزيئات أبسط."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تعتمد الكائنات الحية على الأيض الهدمي للحصول على الطاقة اللازمة لوظائفها الحيوية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُقسّم الأيض في علم الأحياء إلى عمليتين متكاملتين هما البناء والهدم."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يؤدي التقويض الخلوي إلى تحطيم الجزيئات المعقدة وإنتاج جزيئات أبسط."

stage5_enrichment:
  per_entry:
    - lemma: "أَيْض هَدْمِيّ"
      entry_id: "{auto}"
      roots:
