# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# synset: awn4-07102630-n  |  ili: i73901  |  pos: n
# lemmas: إيجاز، اختصار   |  en: terseness
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمتان (إيجاز واختصار) مكتوبتان بدون تشكيل"
      - "التعريف العربي الحالي يشتمل على دوران معجمي: كلمة «موجز» في تعريف مفهوم الإيجاز"
      - "لا يوجد تمييز دلالي مدوَّن بين اللمتين داخل قاعدة البيانات"
      - "التعريف ترجمة حرفية للإنجليزية ولا يعكس الصياغة التي استقرَّ عليها التراث البلاغي العربي"
    observations: >
      تعالج هذه المجموعة مفهوم الإيجاز البلاغي، وهو من أجلّ مفاهيم علم المعاني في
      البلاغة العربية. كلتا اللمتين موثَّقتان توثيقاً وافياً في معاجم الاصطلاح الكلاسيكية
      (الجرجاني، المناوي، السيوطي، التهانوي)، وقد أفرد لهما العلماء مباحث مستقلة.
      والعلاقة بينهما محلّ خلاف في الاصطلاح الدقيق: فريق يُرادف بينهما، وآخر يُخصِّص
      اختصار بالحذف البنيوي. اللمة الأصلح للمفهوم (الأسلوب البلاغي) هي إيجاز، أما
      اختصار فمقبول بوصفه مُرادفاً متداولاً. التعريف الراهن «أسلوب تعبيري قصير وموجز
      بدقة» يفتقر إلى الدقة المعجمية ويحتاج مراجعة.
  blind_candidates:
    - lemma: "وَجَازَة"
      generation_method: ishtiqaq
      justification: "مصدر على وزن فَعَالة من وجُزَ، يحمل دلالة الخاصية المجردة للوجاز والإيجاز في التعبير"
    - lemma: "تَكْثِيف"
      generation_method: ishtiqaq
      justification: "وزن تَفْعِيل من كثَّف، دلالة ضغط المعنى الكثير في اللفظ القليل، وهو ما يُميَّز به الأسلوب الموجز"
    - lemma: "قِصَر"
      generation_method: ishtiqaq
      justification: "مصدر من قَصُرَ على وزن فِعَل، يدل على القِلَّة في التعبير والابتعاد عن الاسترسال والإطناب"
    - lemma: "بَتْر"
      generation_method: majaz
      justification: "مجاز من البتر (القطع)، يُستعمل مجازاً للأسلوب الذي يقطع الحشو ولا يستطرد"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# استعلامات مُنفَّذة: ٦
#  ١. مطابقة دفعية: إيجاز+اختصار+وجازة+تكثيف+قصر+بتر (ocr+hawramani)
#  ٢. جسر إنجليزي: terseness+brevity+conciseness+succinctness+laconism
#  ٣. FTS عربي: إيجاز+اختصار+موجز+اقتضاب+وجيز
#  ٤. إثراء بالمعرّف: إيجاز+اختصار (كلاسيكي مُفصَّل)
#  ٥. مقاييس اللغة: جذور وجز+خصر+قضب+قصر
#  ٦. تحقق المرشحات: وجازة+تكثيف+قصر+بتر+اقتضاب
stage2_evidence:
  per_lemma:
    - lemma: "إيجاز"
      confirm:
        - text: "«الإيجاز: أداء المقصود بأقل من العبارة المتعارفة»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الإيجاز: أداء المقصود بأقل من العبارة المتعارفة، ويقابله الإطناب»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الإيجاز: أداء المقصود بأقل من العبارة المتعارفة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الإيجاز: أداء المقصود بأقل من عبارة المتعارف»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«اقتصر واختصر واقتصد وأوجز وأقل»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
      expands:
        - text: "«إيجاز القصر وهو ما ليس بسبب حذف، وإيجاز حذف وهو ما كان بسبب حذف»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُميّز التراث البلاغي بين نوعين من الإيجاز: إيجاز قصر (تكثيف المعنى في اللفظ) وإيجاز حذف (إسقاط عناصر مع وجود قرينة)"
        - text: "«إيجاز (بغ): تضمين اللفظ القليل المعنى الكثير، يقابله الإطناب. بإيجاز: بشكل موجز، أو قصارى القول»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "التعريف الحديث يُقرّر المعنى ذاته ويُضيف التعبير الاصطلاحي «بإيجاز» المستعمل في اللغة المعاصرة"

    - lemma: "اختصار"
      confirm:
        - text: "«الاختصار: تقليل اللفظ مع كثرة المعنى»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«حذف الفضول من كل شيء / أخذ أوساط الكلام وترك شُعَبه»"
          source: "المعجم الكبير"
        - text: "«الاختصار في الكلام: ترك فضوله واستيجاز معانيه»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الاختصار عند بعض أهل العربية مرادف للإيجاز. وقيل أخص منه لأنه خاص بحذف الجمل بخلاف الإيجاز. وقيل الإيجاز عند السكاكي ما يكون بالنسبة إلى المتعارف والاختصار عنده ما يكون بالنسبة إلى مقتضى المقام»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "النص يُثبت الاستعمال المرادف مع الإشارة إلى فروق دقيقة في الاصطلاح"
        - text: "«الاختصار: مختصر عبارة يعبر عنها عادة بالحروف الأولى للكلمات التي تكونها»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "النص يُظهر انزياحاً دلالياً معاصراً نحو معنى abbreviation؛ هذا مختلف عن المعنى البلاغي الأصيل"

    - lemma: "وَجَازَة"
      confirm:
        - text: "«وَجازَة [مفرد]: مصدر وجُزَ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«وجُز الكلامُ: اختُصِرَ في بلاغة. وجَز الشخصُ الكلامَ: قصَّره وقلَّله»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "وجازة مصدر حقيقي يدل على خاصية الوجاز لا على الأسلوب ذاته"

    - lemma: "تَكْثِيف"
      evidence_status: "no_material_found"

    - lemma: "قِصَر"
      expands:
        - text: "«(1) قِصَر (2) إيجاز [في الكلام أو الكتابة]»"
          source: "المورد الحديث (2008)"
          addition: "المورد يُدرج قِصَر أول مقابل لـ brevity مع تقديم إيجاز بديلاً أدق؛ لكن قِصَر ليس مصطلحاً بلاغياً راسخاً"

    - lemma: "بَتْر"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إيجاز"
      decision: confirmed
      decision_reason: >
        مصطلح بلاغي أصيل موثَّق في كبريات معاجم الاصطلاح العربي بتعريف ثابت
        «أداء المقصود بأقل من العبارة المتعارفة»؛ وهو أدق توصيف للمفهوم المقصود
        وأعمقه تجذُّراً في التراث. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يمثّل إيجاز المصطلح الأشمل في البلاغة العربية؛ يضم نوعين: إيجاز القصر
        (تكثيف المعنى في اللفظ دون حذف) وإيجاز الحذف (إسقاط عنصر مع قرينة دالة
        عليه)؛ وهو في مقابل الإطناب لا في مقابل الحذف وحده
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيجَاز"

    - lemma: "اختصار"
      decision: confirmed
      decision_reason: >
        مستعمَل في التراث البلاغي مرادفاً للإيجاز في كثير من المصادر المعتمدة؛
        وقد أقرَّ التهانوي والجرجاني وغيرهما الترادف بينهما. وإن كان بعض الاصطلاح
        الدقيق يُخصِّصه بالحذف، فإن الاستعمال الشائع يجعله مقبولاً في هذه المجموعة.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز اختصار على الجانب البنيوي الحذفي: قطع فضول الكلام والاقتصار على
        لبّه؛ وعند التحقيق يُخصِّصه بعضهم بحذف الجمل بدليل. وهو في الاستعمال
        المعاصر يتجه نحو معنى abbreviation أكثر من الأسلوب البلاغي
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِخْتِصَار"

    - lemma: "وَجَازَة"
      source: stage1
      decision: removed
      decision_reason: >
        وجازة مصدر يدل على الخاصية المجردة (صفة الوجاز) لا على الأسلوب البلاغي
        ذاته؛ والمجموعة تُعرِّف مفهوم الأسلوب لا الخاصية. فضلاً عن ذلك، لا يرد
        وجازة في معاجم البلاغة بوصفه مصطلحاً تقنياً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَكْثِيف"
      source: stage1
      decision: removed
      decision_reason: >
        لم يثبت في المعاجم بوصفه مصطلحاً بلاغياً لأسلوب الإيجاز؛ دلالته على
        الضغط والتركيز العام لا على الأسلوب البلاغي المحدد الموروث.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "قِصَر"
      source: stage1
      decision: removed
      decision_reason: >
        قِصَر دالٌّ على الخاصية الكمية (ضد الطول) لا على الأسلوب البلاغي؛ وإن
        ورد في المورد الحديث مقابلاً لـ brevity فإنه ليس مصطلحاً بلاغياً راسخاً
        بمعنى الأسلوب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "بَتْر"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استخدام بتر مصطلحاً للأسلوب الموجز في المدونة
        البلاغية العربية؛ وهو محمول على المجاز دون توثيق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "أسلوب تعبيري قصير وموجز بدقة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزية وفيه دوران معجمي (موجز في تعريف
        الإيجاز)؛ كما أنه لا يعكس الصياغة المتعارف عليها في التراث البلاغي العربي
        التي تستند إلى «أداء المقصود بأقل من العبارة المتعارفة». يحتاج تعريفاً
        اصطلاحياً يستوفي الجنس القريب والفصل النوعي.
    authored:
      - type: terminological
        text: "أسلوبٌ بلاغيٌّ قِوامُه أداءُ المعنى المقصود في أقلَّ من العبارة المتعارفة، في مقابل الإطناب"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "تكثيفُ الدلالة الكثيرة في اللفظ القليل مع استيفاء المقصود وسلامة البيان"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07102630-n"
          definition_index: 0
          text: "أسلوبٌ بلاغيٌّ قِوامُه أداءُ المعنى المقصود في أقلَّ من العبارة المتعارفة، في مقابل الإطناب"
      - command: add_definition
        params:
          synset_id: "awn4-07102630-n"
          text: "تكثيفُ الدلالة الكثيرة في اللفظ القليل مع استيفاء المقصود وسلامة البيان"

  examples:
