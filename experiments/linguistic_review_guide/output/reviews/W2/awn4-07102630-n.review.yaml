        examples:
          - text: "اشتُهر الخطيبُ بإيجازه البليغ، إذ كان يُودِع في جملة واحدة ما يعجز غيره عن التعبير عنه في فقرات"
            type: usage
      - lemma: "اِخْتِصَار"
        examples:
          - text: "أشاد النقّادُ باختصار الكاتب وقدرته على تقديم الفكرة كاملةً دون حشو أو استطراد"
            type: usage
    actions:
