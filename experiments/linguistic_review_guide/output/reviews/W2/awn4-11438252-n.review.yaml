          source: "مقاييس اللغة لابن فارس (entry 987292)"
          addition: "الأصل الثاني (عرض) هو جذر اشتقاق دلالة الصدفة والمصادفة؛ إذ الصُّدفة عَرَضٌ يصيب المرء من غير توقع، وهو ما يُثبت صحة الاشتقاق."


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّات قائمة ─────────────────────────────────────────────
    - lemma: "حظ"
      decision: confirmed
      decision_reason: >
        الكلمة موثَّقة في المعاجم الكلاسيكية بإجماع من مقاييس اللغة والقاموس المحيط والمعجم الوسيط
        وسواها، وتُغطّي الجانب القدَري من المفهوم (النصيب المقدَّر). الشواهد القرآنية والشعرية
        وافرة. اللمّة بلا تشكيل في السجل الحالي، وتستوجب تحديثاً بالتشكيل الكامل (حَظٌّ).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على النصيب المقدَّر للمرء (ما خصَّه الله أو القدر)، ويحمل إيحاءً بالثبات النسبي
        (أحاظٍ قُسِّمَت). يختلف عن صُدفة بكونه نصيباً مُلازماً لا حدثاً طارئاً، وعن مُصادفة
        بغياب عنصر الخروج على النظام المتوقَّع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَظٌّ"

    - lemma: "صدفة"
      decision: confirmed
      decision_reason: >
        المعجم الكبير (OCR) يُثبت صُدفة (بضم) بمعنى «الملاقاة دون قصد؛ حدوث الشيء عرضاً دون
        اتفاق وقصد»، وهو يُطابق تماماً مفهوم المجموعة. مجمع اللغة المصري أقرّها رسمياً.
        الشاهد المَثَلي «رُبَّ صُدفةٍ خيرٌ من ألف ميعادٍ» يُثبت تداولها اصطلاحياً. تستوجب
        تحديث التشكيل الكامل (صُدْفَة) للتمييز القطعي من صَدَفَة (غطاء الأذن).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على الحدث العارض المفاجئ من حيث وقوعه على المرء (اللقاء العرضي، الحادثة الطارئة)،
        مع تركيز على البُعد الظاهراتي للحدث المفرد لا على الظاهرة الكلية. تختلف عن حَظّ بقِصَر
        الأفق الزمني (حدث واحد)، وعن مُصادَفة بخلوّها من الأثر المعرفي/الفلسفي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صُدْفَة"

    # ── مرشحات المرحلة ١ ─────────────────────────────────────────
    - lemma: "طَالِع"
      source: stage1
      decision: removed
      decision_reason: >
        جميع المعاجم الكلاسيكية والحديثة تُقيّد طالع بالسياق التنجيمي والفلكي (البرج عند الولادة،
        ما يتنبأ به المنجم). لا يقوم وحده دلالةً على ظاهرة الحظ المجهولة كما يُراد في المجموعة.
        استعماله يستلزم سياقاً علمياً لا يخدم المفهوم الفلسفي/اللغوي العام.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "جَدٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن جَدّ يعني الحظ في المعاجم القديمة، إلا أنه: (أ) مرادف لحَظّ الموجود أصلاً في
        المجموعة دون إضافة دلالية مميَّزة، (ب) يحمل الاشتراك اللفظي الأشد شيوعاً (الجد =
        الأب الأعلى) مما يُفضي إلى التباس ذهني قاطع، (ج) غير مستقل في المعاجم الحديثة
        بمعنى الظاهرة المجهولة. اجتاز اختبار التثبيت المعجمي الكلاسيكي لكنه رُسِب في معيار
        الاشتقاقية وانعدام الاشتراك اللفظي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "اتِّفَاق"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى الغالب في المعاجم المعاصرة والمصطلحية هو «العقد والتوافق بين طرفين» (agreement)؛
        وهذا يُعارض دلالة الظاهرة المنفردة المجهولة. والمعنى الكلاسيكي «موافقة القدر» يفتقر
        إلى الاستقلالية الاصطلاحية، إذ يبقى وصفاً لعلاقة الفعل الإنساني بالقدر لا وصفاً
        للظاهرة ذاتها. فشل في اختبار التثبيت المعجمي كمصطلح مستقل للمفهوم.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُصَادَفَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        الأصيل الفصيح المُقابل للمفهوم؛ المعجم الكبير (OCR) يُعرِّفها تعريفاً يُطابق التعريف
        الإنجليزي للمجموعة: «الخروج على النظام والقانون المعروف... النتائج غير المتوقعة».
        معجم الصواب يُقرّرها «فصيحة». المورد الحديث يُترجم chance بها أولاً. مأخوذة من جذر
        عربي صميم (صدف) على وزن المفاعلة الثابت في الصرف العربي. اجتازت جميع معايير
        بوابة جودة المصطلح السبعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُعبّر عن الظاهرة الموضوعية ذاتها من حيث خروجها على النظام المتوقع وانعدام السبب
        المعلوم. هي الأكثر دقةً في السياق الفلسفي والعلمي، وتختلف عن حَظّ (النصيب المقدَّر)
        وعن صُدفة (الحدث الطارئ الفردي) بتركيزها على الظاهرة الكلية كمفهوم مستقل.
      actions:
        - command: create_entry
          params:
            lemma: "مُصَادَفَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "ظاهرة غير معروفة وغير متوقعة تتسبب في حدوث حدث بطريقة ما بدلاً من أخرى"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية («an unknown and unpredictable phenomenon...»)
        وليس تأليفاً عربياً أصيلاً. الأسلوب وصفي خبري لا يتّبع بنية الجنس القريب + الفصل النوعي.
        كلمة «بطريقة ما» ترجمة مُقعَّرة لـ«one way rather than another». يحتاج تعريف مصطلحي
        دقيق يُوظِّف الجنس الأعلى (الظاهرة) مع فصول تُميِّزها (مجهولة السبب، غير خاضعة لقانون
        ثابت، تُوجِّه الأحداث) وتعريفٌ لغوي مُوجَز بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: "ظاهرةٌ مجهولةُ السببِ لا تخضع لقانونٍ ثابت ولا يمكن التنبُّؤُ بها، تتحكَّم في مسار الحوادث فتُوجِّهها وجهةً دون أخرى من غير سببٍ ظاهرٍ أو قصدٍ مُسبَق"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يُصادف المرءَ من نصيبٍ خيراً كان أم شرًّا، دون سببٍ معلومٍ أو ترتيبٍ مسبق"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "ظاهرةٌ مجهولةُ السببِ لا تخضع لقانونٍ ثابت ولا يمكن التنبُّؤُ بها، تتحكَّم في مسار الحوادث فتُوجِّهها وجهةً دون أخرى من غير سببٍ ظاهرٍ أو قصدٍ مُسبَق"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "ما يُصادف المرءَ من نصيبٍ خيراً كان أم شرًّا، دون سببٍ معلومٍ أو ترتيبٍ مسبق"

  examples:
    per_lemma:
      - lemma: "حَظٌّ"
        examples:
          - text: "أفلح في المقابلة بمزيج من الجهد الدؤوب وحُسن الحَظّ، إذ كان السؤالُ الأول موضوعَ تخصُّصه."
            type: usage
      - lemma: "صُدْفَة"
        examples:
          - text: "التقى بصديق طفولته صُدْفةً في محطة القطار بعد غياب طال عشرين عاماً."
            type: usage
      - lemma: "مُصَادَفَة"
        examples:
          - text: "قادَتْه مُصَادَفَةٌ علميةٌ عجيبة إلى اكتشاف المضاد الحيوي، حين لاحظ عَرَضاً نموَّ العفن في طبق تجاربه."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "الحظُّ والمُصَادَفَة وجهان لظاهرةٍ واحدة تعجز العقول عن استقصاء أسبابها."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أفلح في المقابلة بمزيج من الجهد الدؤوب وحُسن الحَظّ، إذ كان السؤالُ الأول موضوعَ تخصُّصه."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "التقى بصديق طفولته صُدْفةً في محطة القطار بعد غياب طال عشرين عاماً."
      - command: add_sense_example
