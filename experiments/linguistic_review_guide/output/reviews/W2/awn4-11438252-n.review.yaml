        - text: "«(الِاتِّفَاق) (فِي القانون الدولي) اتِّفَاق يتم بَين دولتين»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          conflict: "المعنى الغالب في الاستعمال المعاصر هو العقد والاتفاقية، وهو بعيد عن دلالة المفهوم المطلوب."
        - text: "«agreement»"
          source: "ARABTERM — المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "ترجمة موحَّدة لـagreement، وهو ما يُرسّخ معنى التعاقد والاتفاق بين أطراف لا ظاهرة الحظ."

    - lemma: "مُصَادَفَة"
      source: stage1
      confirm:
        - text: "«الصُّدفةُ: الخروجُ على النظام والقانون المعروف، ولا يبدو لهذا الخروج سببٌ ولا غايةٌ واضحةٌ، وهو أشبهُ ما يكون بالاتفاق؛ من الناحية العلمية تعنى المصادفةُ النتائجَ غيرَ المتوقَّعة والمترتبة على تداخل الظَّواهر الخاضعة لقوانينَ ثابتةٍ، دون أن تكون هذه النتائجُ أقلَّ ضرورةً من النتائج المتوقَّعة»"
          source: "المعجم الكبير (OCR) — entry 55164"
        - text: "«حالة صورتين وعنصرين يلتقيان لإنتاجهما في وقت واحد مع اختلاف فضاءَيْهِمَا»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — arabterm"
        - text: "«(1) مصادفة (2) حظّ (3) احتمال؛ إمكانية حدوث شيء... (9) تصادفيّ؛ اتفاقيّ»"
          source: "المورد الحديث (2008) — arabterm — ترجمة لـchance"
        - text: "«لقاء يجمع متكلماً بمخاطَب دون سابق ترتيب، أو ما ماثل ذلك»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — arabterm"
        - text: "«-قابلته مُصَادفَة [فصيحة]»"
