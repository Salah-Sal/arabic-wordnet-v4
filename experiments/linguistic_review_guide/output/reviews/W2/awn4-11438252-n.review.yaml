stage2_evidence:
  per_lemma:
    - lemma: "حَظّ"
      confirm:
        - text: "«الْحَاءُ وَالظَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ النَّصِيبُ وَالْجَدُّ. يُقَالُ فُلَانٌ أَحَظُّ مِنْ فُلَانٍ، وَهُوَ مَحْظُوظٌ. وَجَمْعُ الْحَظِّ أَحَاظٍ عَلَى غَيْرِ قِيَاسٍ.»"
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
        - text: "«الحَظُّ: النَّصيبُ، والجَدُّ، أو خاصٌّ بالنَّصيب من الخَيرِ والفَضْل»"
          source: "القاموس المحيط للفيروزآبادي (ت 1414م)"
        - text: "«الحظ: النصيب المقدر»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«الحظ: النصيب والجد»"
          source: "مجمل اللغة لابن فارس (مصدر OCR، ت 1004م)"
        - text: "«النصيب الجد والبخت»"
          source: "المعجم الوسيط (OCR)"
        - text: "«النَّصِيبُ النَّصِيبُ من الفضْلِ والخيْرِ, عِلْمًا أو مالاً أو غيرهما البَخْتُ والجدُّ»"
          source: "المعجم الكبير (OCR)"
      expands:
        - text: "«يُوصِيكُمُ اللَّهُ في أَوْلادِكُم لِلذَّكَرِ مِثْلُ حَظِّ الأُنثَيَيْنِ»"
          source: "المعجم الكبير (OCR) — شاهد قرآني"
          addition: "يُثبت أن حظّ تعني النصيب المحدَّد بصرف النظر عن عشوائيته؛ وهو ما يُميّزها عن الصدفة."
        - text: "«وَلَيْسَ الغِنَى والفَقْرُ من حِيلَةِ الفَتَى / ولكنْ أحاظٍ قُسِّمَتْ وجُدُودُ»"
          source: "المعجم الكبير (OCR) — شاهد شعري (سويد بن خذاق العبدي)"
          addition: "يُقيم توازناً بين حظ وجدود، مما يدل على المعنى الثابت للنصيب المقدَّر لا ظاهرة العشوائية."
        - text: "«(1) حظّ (2) «أ» حُسْن الطالع. «ب» نجاح؛ توفيق. to be down on one's luck: يُمْنَى بسوء الحظّ.»"
          source: "المورد الحديث (2008) — arabterm"
          addition: "يُثبت اتساع دلالة حظّ لتشمل مفهوم الـluck بمعنييه الإيجابي والسلبي."

    - lemma: "صدفة"
      confirm:
        - text: "«الصُّدْفَة: الملاقاةُ دُونَ قصدٍ وتدبير؛ حدوثُ الشَّيءِ عَرَضًا دُونَ اتِّفاقٍ وقصدٍ أو مَوعِدٍ»"
          source: "المعجم الكبير (OCR) — entry 55156"
        - text: "«رُبَّ صُدْفَةٍ خيرٌ من ألفِ ميعادٍ»"
          source: "المعجم الكبير (OCR) — مَثَل (entry 55156)"
        - text: "«يصح استخدام «صُدْفة» على اعتبارها مصدرًا مستحدثًا من الفعل «صَدِف» للدلالة على المعنى الجديد أو على اعتبارها اسم مصدر من «صادف»، وقد أقر مجمع اللغة المصري استعمالها بهذا المعنى. وقد وردت الكلمة في عدد من المعاجم الحديثة كالمنجد والأساسي.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: "«صَدَفَةُ الأُذُن: مَحارَتُها؛ الصَّدَفَتَان: النُّقْرَتَان اللتان فيهما مَغْرِزُ رأسي الفخِذَيْنِ»"
          source: "المعجم الوسيط (OCR) — entry 15854"
          conflict: "الصيغة المعجمية الأصيلة «صَدَفَة» (بفتحتين) تخصّ شكل الأذن وغطاء المحار، وهي غير الصُّدفة (بضم) التي تعني الحدث العارض. اللبس الإملائي قائم عند غياب التشكيل."
        - text: "«يستعملها العامة بمعنى المصادفة أي وقوع الأشياء من غير ترتيب ولا توقع»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry 932027)"
          conflict: "التوصيف بـ«العامية» يُشير إلى أن اللفظ لم يكن فصيحاً أصلاً، وإن أُقرّ لاحقاً."

    - lemma: "طَالِع"
      source: stage1
