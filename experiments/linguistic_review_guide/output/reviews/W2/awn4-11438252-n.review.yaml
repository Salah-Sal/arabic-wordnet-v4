# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الأولى (حظ) تحمل في الأصل معنى النصيب المقدر مع إيحاء بالقدرية، وقد لا تُغطّي بالكامل عنصرَ العشوائية وانعدام السبب المعلوم الذي هو جوهر المفهوم."
      - "اللمّة الثانية (صدفة) مستحدثة في هذا الاستعمال؛ إذ الأصيل الفصيح هو (مُصادَفة)، وقد ترددت المعاجم المعيارية في قبولها، وإن أقرّها مجمع اللغة المصري."
      - "التعريف العربي الحالي يبدو ترجمةً حرفيةً من الإنجليزية، ولا يتّبع أسلوب المعجم الوسيط القائم على الجنس والفصل."
      - "غياب لمّة (مُصادَفة) الأصيلة الفصيحة التي وثّقها المعجم الكبير بتعريف يُطابق المفهوم تمام المطابقة."
    observations: >
      المفهوم المُراد التعبير عنه هو «الظاهرة المجهولة غير المتوقعة التي تُوجّه الحوادث وجهةً دون أخرى»، وهو
      مفهوم يجمع بين مكوِّنَيْن: (أ) انعدام السبب المعلوم أو القانون الثابت، و(ب) التأثير الفعلي في مسار الأحداث.
      يُعبِّر عن المكوِّن الأول بـ«مُصادَفة» (الخروج على النظام)، وعن المكوِّن الثاني بـ«حظ» (النصيب الذي يُصيب
      المرء). غياب «مُصادَفة» من اللمّات الحالية نقصٌ يستوجب التصحيح. كما أن «صدفة» بضم أولها لفظ مستحدث
      يحتاج إلى تشكيل صريح (صُدْفَة) تمييزاً له عن «صَدَفة» (غطاء الأذن).

  blind_candidates:
    - lemma: "طَالِع"
      generation_method: majaz
      justification: >
        من (طَلَعَ): ما يطلع من المقادير ويُقبل على المرء. استُعمل في التراث العربي مجازاً للبخت
        والحظ المقبل؛ قال المنجمون: «طالع الميلاد» لما يُقبل على المرء من أحداث. يُحيي معنىً
        كلاسيكياً مرتبطاً بالظاهرة الآتية التي لا يُعلم مصدرها.
    - lemma: "جَدٌّ"
      generation_method: majaz
      justification: >
        إحياء معنى كلاسيكي: جَدّ (بفتح الجيم) تعني في المعاجم القديمة الحظ والبخت والحُظوة، وهو
        معنى ميّت في الاستعمال المعاصر مع بقاء «الجد» بمعنى الجَدّ (أبو الأب). التفريق الصوتي
        يُجيز إحياءه لدلالة الحظ العارض غير المتوقع.
    - lemma: "اتِّفَاق"
      generation_method: ishtiqaq
      justification: >
        من جذر (وفق) على وزن افتعال. يدل على ما يُوافق دون قصد مسبق، وهو المعنى المُطابق
        لـ«chance» الإنجليزية. جاء في كشاف التهانوي: «الاتفاق: موافقة فعل الإنسان للقدر في الخير
        والشر». يُلبّي المفهوم بالاشتقاق العربي الصميم من جذر ثلاثي.
    - lemma: "مُصَادَفَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (صدف) على وزن مُفاعَلة. دلّ المعجم الكبير (OCR) عليها صراحةً بأنها «الخروجُ على
        النظام والقانون المعروف، ولا يبدو لهذا الخروج سببٌ ولا غايةٌ واضحةٌ». اللفظ فصيح
        مستعمل في التراث الكلاسيكي، ويصلح مصطلحاً للظاهرة المجهولة التي يُعبِّر عنها الـsynset.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات قاعدة البيانات المُنفَّذة:
