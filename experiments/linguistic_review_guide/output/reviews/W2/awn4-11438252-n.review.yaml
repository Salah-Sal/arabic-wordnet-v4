          source: "معجم مقاليد العلوم للسيوطي (hawramani، ت 1505م)"
          conflict: "طالع في المعاجم الكلاسيكية والحديثة مصطلح فلكي/تنجيمي لا يدل على الظاهرة المجهولة بذاتها."
        - text: "«الطالع: ما تنبأ به المنجم من الحوادث بطلوع كوكب معين من النجوم»"
