          conflict: "المعنى ملازم للتنجيم والتنبؤ الفلكي، لا لدلالة الحظ كظاهرة مجهولة."

    - lemma: "جَدّ"
      source: stage1
      confirm:
        - text: "«الجَدُّ: أبو الأبِ، وأبو الأُمِّ... والبَخْتُ، والحَظُّ، والحُظْوَةُ، والرِّزْقُ، والعَظَمَةُ»"
          source: "القاموس المحيط للفيروزآبادي (hawramani، ت 1414م)"
        - text: "«البَخْتُ في الدُّنْيَا... الحظُّ»"
          source: "المعجم الكبير (OCR) — entry 70713"
      contradicts:
        - text: "«(الجد): أَبُو الأَب وَأَبُو الأُم (ج) أجداد وجدود وجدودة والرزق والمكانة والمنزلة عند الناس»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani، ت 1998م)"
          conflict: "المعنى الأول والغالب في المعاجم الحديثة هو الجَدّ (الأب الأعلى)، مما يُفضي إلى اشتراك لفظي مُخِلّ إذا استُعمل دلالةً على الحظ."

    - lemma: "اتِّفَاق"
      source: stage1
