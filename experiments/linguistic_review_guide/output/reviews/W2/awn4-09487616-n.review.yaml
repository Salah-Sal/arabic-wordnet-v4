step0_evidence:
  per_lemma:
    - lemma: "جسم متلألئ"
      confirm:
        - text: "«لأْلأَ النجمُ أو البرقُ: لمع فى اضطراب بعينه» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«تَلأْلأَ النجمُ أو البرقُ والقمرُ والنارُ ولأْلأَ: أَضاءَ ولَمع. وقيل هو: اضْطَرَب بَرِيقُه» — لسان العرب"
          source: "لسان العرب"
        - text: "«وميض: ظاهرة طبيعية تعبر على تلألؤ جسم... يتلألأ نتيجة اضطرابات... تجعل الضوء الذي يصل الناظر خافتا ومتغير الشدة أو متقطعا» — مسرد المناخ والبيئة (ArabTerm)"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«الدُّرِّيُّ: الكوكب المندفعُ فى مُضِيِّهِ من المشرق إلى المغرب المتوقد المتلألئ» — المعجم الوسيط"
          source: "المعجم الوسيط"
          addition: "ربط التلألؤ بالكواكب والنجوم (الأجرام السماوية)"
        - text: "«مُتَأَبِّل: متلألئ أو متغيّر الألوان» — المورد الحديث"
          source: "المورد الحديث"
          addition: "ربط التلألؤ بتغير الألوان"

step05_lemma_generation:
