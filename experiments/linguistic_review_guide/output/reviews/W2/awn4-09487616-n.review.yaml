      justification: "الوميض هو الظاهرة نفسها، وقد يُطلق على الجسم المصدر للوميض في سياقات معينة (مثل 'وامض')"
    - lemma: "جرم متلألئ"
      source_section: "step6_fts_keyword"
      evidence_citation: "«الدُّرِّيُّ: الكوكب... المتلألئ» — المعجم الوسيط"
      justification: "استخدام كلمة 'جرم' أكثر دقة في السياق الفلكي للأجسام التي تتلألأ"
  knowledge_candidates:
    - lemma: "وامض"
      justification: "اسم فاعل من 'ومض' يدل على الجسم الذي يبعث ضوءاً متقطعاً، ويستخدم كمصطلح تقني (scintillator)"
    - lemma: "نجم متلألئ"
      justification: "التطبيق الأكثر شيوعاً لمفهوم التلألؤ (twinkling) هو النجوم في السماء"

