# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-15297671-n — interlude
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «فاصل» بدون تشكيل — تحتاج تشكيلاً كاملاً"
      - "اللمّة «فترة بينية» تركيب وصفي حرّ وليست وحدة معجمية ثابتة — تفشل في اختبار السّكّ (يمكن إبدالها بـ«مدّة بينية» أو «حقبة بينية»)"
      - "المجموعة تفتقر إلى تمييز واضح بين الفاصل الزمني العام والفاصل الفنّي (بين فصول المسرحية مثلاً)"
    observations: >
      المفهوم المستهدف هو فترة أو حلقة تتخلّل حدثين أو طورين متتاليين.
      اللفظ «فاصل» من الجذر «فصل» الدالّ على التمييز والإبانة، وهو الأكثر شيوعاً
      في الاستعمال الفصيح المعاصر لهذا المعنى، ويُستخدم في المسرح والتلفزيون والإذاعة.
      أمّا «فترة بينية» فتركيب وصفي يصلح شرحاً لا مصطلحاً.
  blind_candidates:
    - lemma: "اسْتِرَاحَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «روح» على وزن اسْتِفْعَالَة، يدلّ على الانقطاع عن العمل فترةً ما طلباً للراحة،
        ويُستخدم للفترة الزمنية التي تتخلّل فصول عمل فنّي أو رياضي.
    - lemma: "بَرْزَخ"
      generation_method: majaz
      justification: >
        أصل البرزخ الحاجز بين الشيئين، ثمّ أُطلق مجازاً على ما بين الدنيا والآخرة
        وعلى كلّ فترة تفصل بين طورين. يمكن توظيفه مجازاً للفترة الفاصلة.
    - lemma: "مُتَنَفَّس"
      generation_method: ishtiqaq
      justification: >
        من الجذر «نفس» على وزن مُتَفَعَّل، بمعنى فسحة التنفّس أو الفُرجة بين أمرين.
        يصلح مجازاً للفترة القصيرة التي يُستراح فيها بين حدثين.
    - lemma: "خِلال"
      generation_method: ishtiqaq
      justification: >
        من الجذر «خلل»، بمعنى مُنْفَرَج ما بين الشيئين، وقد ورد في المعجم الوسيط
        بهذا المعنى. يمكن توظيفه للفترة المتخلّلة بين حدثين.


stage2_evidence:
  per_lemma:
    - lemma: "فَاصِل"
      confirm:
        - text: "«فاصل = interlude»"
          source: "مسرد الفنّ والتسلية والرياضة (ArabTerm)"
        - text: "«فاصِل = intermission»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«فاصل، استراحة = intermission — يرتبط الفاصل بالمسرحية التي تتوقف لإعطاء ممثليها فرصة استرداد الأنفاس بضبط الانتقالات الزمنية والفضائية للعمل المسرحي»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«يقال: حُكْمٌ فاصل، وقضاء فاصل: ماضٍ قاطع»"
          source: "المعجم الوسيط"
          addition: "دلالة صفتيّة على القطع والحسم، غير الدلالة الزمنية المطلوبة هنا"
        - text: "«interlude = (1) الفصل الإضافيّ: فصل صغير يتخلّل فصولَ مسرحية (2) فترة فاصلة (3) اللحن الإضافيّ: لحن يُعزف بين أجزاء مسرحية أو قدّاس أو قطعة موسيقية»"
          source: "المورد الحديث (2008)"
          addition: "يُظهر أنّ الفاصل يشمل الفترة الزمنية واللحن الموسيقي والفصل المسرحي القصير"

    - lemma: "فَتْرَة بَيْنِيَّة"
      evidence_status: "no_material_found"

    - lemma: "اسْتِرَاحَة"
      confirm:
        - text: "«الفَتْرَةُ أو المدَّةُ التِي يُسْتَرَاحُ فيها. ومنها الفَتْرَةُ الزمنِيَّةُ الَّتِى تتخلل فُصولَ عَمَل فَنَّىٍّ أو رياضى»"
          source: "المعجم الكبير"
        - text: "«intermission = فترة استراحة، وبخاصة في حفلة عامة أو بين فصول المسرحية»"
          source: "المورد الحديث (2008)"
        - text: "«استراحة = break / pause / intermission»"
          source: "مسارد ArabTerm متعددة"
      expands:
        - text: "«الْانْقِطاعُ عن العَمَلِ أو نَحْوِه فتْرةً ما طلبًا للرَّاحَةِ»"
          source: "المعجم الكبير"
          addition: "الدلالة الأصلية تتضمّن طلب الراحة، وهو قيد دلالي لا يشترطه مفهوم الفاصل"

    - lemma: "بَرْزَخ"
      contradicts:
        - text: "«الحاجز بين شيئين، ما بين الموت والبعث»"
          source: "المعجم الوسيط"
          conflict: "البرزخ حاجز مكاني أو وجودي، لا فترة زمنية فاصلة بين حدثين دنيويين"
        - text: "«الحائل بين الشيئين»"
          source: "مقاييس اللغة"
          conflict: "الدلالة الجذرية على الحيلولة والمنع، لا على الفترة الزمنية المتخلّلة"
      expands:
        - text: "«ما بَيْنَ كلّ شَيْئَيْن»"
          source: "المحيط في اللغة"
          addition: "أوسع دلالةً من الحاجز المادي، لكنّه يبقى أقرب إلى الفصل المكاني"

    - lemma: "مُتَنَفَّس"
      contradicts:
        - text: "«يقال: أنفٌ مُتَنَفِّس: أفطس»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال المعجمي الوحيد للمتنفّس صفةً للأنف الأفطس، لا علاقة له بالفترة الزمنية"
        - text: "«متنفس = Vent: تجهيز للسماح للغازات بالخروج»"
          source: "ArabTerm — مسرد البيئة"
          conflict: "استعمال تقني لمنفذ الغاز، لا للفترة الزمنية"

    - lemma: "خِلال"
      contradicts:
        - text: "«مُنفرَج ما بين الشيئين، وعود يُجعل في لسان الفصيل... والعود الذي يُتخلَّل به»"
          source: "المعجم الوسيط"
          conflict: "خِلال اسم جامد يدلّ على الفُرجة المكانية أو العود، ويُستعمل ظرفاً بمعنى «بين»، لا اسماً للفترة الزمنية الفاصلة"


stage3_analysis:
  per_lemma:
    - lemma: "فَاصِل"
      decision: confirmed
      decision_reason: >
        مؤيَّد بمعاجم حديثة متعددة (ArabTerm، المورد الحديث، معجم اللسانيات) بمعنى interlude
        وintermission. الجذر «فصل» يدلّ على التمييز والإبانة، واسم الفاعل «فاصل» يناسب
        الفترة التي تفصل بين حدثين. مُطّرد صرفياً، فصيح، شائع التداول.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَاصِل"

    - lemma: "فَتْرَة بَيْنِيَّة"
      decision: removed
      decision_reason: >
        تركيب وصفي حرّ وليس وحدة معجمية ثابتة. لم يُعثر عليه مدخلاً في أيّ معجم.
        يفشل في اختبار السّكّ: يمكن إبدال «فترة» بـ«مدّة» أو «حقبة» والتركيب يبقى
        صالحاً وصفياً، ممّا يدلّ على أنّه عبارة حرّة لا مصطلح. المورد الحديث يستعمل
        «فترة فاصلة» لا «فترة بينية».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اسْتِرَاحَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورودها في المعجم الكبير بمعنى «الفترة الزمنية التي تتخلّل فصول عمل فنّي»،
        فإنّ دلالتها الجذرية تتضمّن طلب الراحة والانقطاع عن الجهد، وهو قيد دلالي
        لا يشترطه مفهوم الفاصل (interlude) الذي قد يكون فترة نشاط كأداء موسيقي
        أو فصل مسرحي قصير. الاستراحة أقرب إلى intermission/break منها إلى interlude.
      evidence_assessment:
        case: mixed

    - lemma: "بَرْزَخ"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المعجمية المتواترة في جميع المصادر هي «الحاجز بين الشيئين»
        مع توظيف ديني (ما بين الموت والبعث) وجغرافي (شريط أرض بين بحرين).
        الإزاحة الدلالية نحو «فترة زمنية فاصلة بين حدثين عاديين» بعيدة جداً
        وتُحدث اشتراكاً لفظياً مع الاستعمالات الراسخة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُتَنَفَّس"
      source: stage1
      decision: removed
      decision_reason: >
        لا سند معجمي لاستعمال «متنفّس» بمعنى الفترة الزمنية الفاصلة.
        الوارد في المعجم الوسيط صفةٌ للأنف الأفطس، وفي ArabTerm منفذ للغاز.
        لا يصلح مصطلحاً لهذا المفهوم.
      evidence_assessment:
        case: contradicts_only

    - lemma: "خِلال"
      source: stage1
      decision: removed
      decision_reason: >
        خِلال اسم جامد يدلّ على الفُرجة المكانية أو عود الأسنان أو البلح،
        ويُستعمل ظرفاً بمعنى «بين» لا اسماً للفترة الزمنية. لا يصلح مرادفاً
        لـ«فاصل» بالمعنى الزمني المطلوب.
      evidence_assessment:
        case: contradicts_only


stage4_content:
  definition:
    current: "فترة أو حلقة فاصلة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مبهم وأقرب إلى ترجمة حرفية. «حلقة فاصلة» تعبير غير مألوف
        في العربية. يحتاج إلى تعريف مصطلحي يبيّن الجنس القريب (فترة زمنية)
        والفصل النوعي (التخلّل بين حدثين أو طورين).
    authored:
      - type: terminological
        text: "فَتْرَةٌ زَمَنِيَّةٌ تَتَخَلَّلُ حَدَثَيْنِ أَوْ طَوْرَيْنِ مُتَتَالِيَيْنِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مُدَّةٌ تَقَعُ بَيْنَ أَمْرَيْنِ مُتَعَاقِبَيْنِ وَتَفْصِلُ بَيْنَهُمَا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "فَتْرَةٌ زَمَنِيَّةٌ تَتَخَلَّلُ حَدَثَيْنِ أَوْ طَوْرَيْنِ مُتَتَالِيَيْنِ"

  examples:
    per_lemma:
      - lemma: "فَاصِل"
        examples:
          - text: "عُزِفَتْ مَقْطوعَةٌ موسيقِيَّةٌ في الفَاصِلِ بَيْنَ الفَصْلَيْنِ الثَّانِي وَالثَّالِثِ مِنَ المَسْرَحِيَّةِ."
            type: usage
          - text: "شَهِدَتِ المِنْطَقَةُ فَاصِلاً مِنَ الهُدوءِ بَيْنَ مَوْجَتَيْ القِتَالِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "عُزِفَتْ مَقْطوعَةٌ موسيقِيَّةٌ في الفَاصِلِ بَيْنَ الفَصْلَيْنِ الثَّانِي وَالثَّالِثِ مِنَ المَسْرَحِيَّةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "شَهِدَتِ المِنْطَقَةُ فَاصِلاً مِنَ الهُدوءِ بَيْنَ مَوْجَتَيْ القِتَالِ."


