# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تفاصح"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في المعجم الوسيط بمعنى "تكلّف الفصاحة"، وهو المعنى الجوهري للمجموعة؛
        إذ يُعبّر التفاصح عن التظاهر بالفصاحة عن تصنّع لا عن قدرة حقيقية، وهذا يطابق
        مفهوم euphuism تماماً. المصدر (تَفَاصُح على وزن تَفَاعُل) صالح للإدراج اسماً.
        تحتاج اللمّة إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُشدّد التفاصح على التظاهر بالفصاحة وادّعائها لا امتلاكها؛ فهو يُبرز الجانب
        الزائف والتمثيلي في الأسلوب. ويختلف عن "تكلف لغوي" في كونه أكثر تخصصاً بجانب
        ادّعاء الفصاحة الأدبية تحديداً لا مجرد التجشّم في انتقاء الألفاظ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَاصُح"

    - lemma: "تكلف لغوي"
      decision: confirmed
      decision_reason: >
        التعبير موثّق في المعجم الموحد لمصطلحات اللسانيات بما يُغطي المفهوم المقصود؛ حيث
        يُقابل affectation بوصف يتطابق مع euphuism في جوانب جوهرية (المبالغة، الابتعاد عن
        الطبيعي، استعمال الغريب من الألفاظ). وعلى الرغم من ضعف إحكام السكّ (مشكلة
        قابلية الإبدال)، إلا أن مصطلح "تكلف لغوي" سائر في الكتابة النقدية العربية
        المعاصرة بوصفه وحدة دلالية. يستوجب إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُعنى "تكلف لغوي" بجانب التجشّم والمشقة في انتقاء الألفاظ وصياغتها، مُركّزاً
        على الإرادة الواعية في الاصطناع. وعلى خلاف التفاصح الذي يُبرز ادّعاء الفصاحة،
        يُبرز التكلف اللغوي الجهد المبذول في البُعد عن السهل الطبيعي نحو الغريب المتعسَّف.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَلُّف لُغَوِيّ"

    - lemma: "تَقَعُّر"
      source: stage1
      decision: removed
      decision_reason: >
        على الرغم من الأصل الدلالي المناسب ("قعّر الرجل في كلامه: شدّق")، فإن تقعّر
        مصطلح علمي راسخ في ARABTERM ومعاجم الرياضيات والطب بمعنى "concavity" (التقعّر
        الهندسي)؛ مما يُوقع في اشتراك لفظي حاد يُعيق استخدامه في السياق اللغوي الأدبي.

    - lemma: "تَفَيْهُق"
      source: stage1
      decision: removed
      decision_reason: >
        التفيهق موثّق بمعنى "توسّع وتنطّع في الكلام" وهو قريب من المفهوم، لكنه يُعنى
        أساساً بالتفاخر والتكبّر عبر ملء الفم بالألفاظ (سواء بالكلام أو بالمال)، وهو
        أعمّ من الأناقة اللفظية المصطنعة. فضلاً عن أن الحديث النبوي المُستشهد به يضعه
        في سياق ذمّ أخلاقي لا نقد أسلوبي، مما يُعسّر توظيفه مصطلحاً أدبياً صرفاً.

    - lemma: "تَنَمُّق"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي مادة معجمية موثّقة تُثبت استعماله مصطلحاً أسلوبياً في المعاجم المتاحة."

    - lemma: "زَخْرَفَة"
      source: stage1
      decision: removed
      decision_reason: >
        الزخرفة مستعملة في المعاجم الحديثة والمصطلحية لتزيين الأشياء المادية (نقش، تطريز،
        تطعيم)، ولم يثبت تخصيصها اصطلاحاً للأسلوب اللغوي في أي من المصادر المتاحة.
        والاستعمال القرآني "زُخْرُفَ الْقَوْلِ" لا يُرسّخها مصطلحاً بل هو استعمال مجازي.


