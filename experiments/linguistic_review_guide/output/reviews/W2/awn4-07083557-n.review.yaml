# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'تفاصح' مسجّلة في المعاجم بوصفها فعلاً (تَفَاصَحَ)، وإدراجها في المجموعة الاسمية يعني إرادة المصدر (تَفَاصُح على وزن تَفَاعُل)؛ مما يستوجب إضافة التشكيل الصحيح للمصدر"
      - "لمّة 'تكلف لغوي' تعبير وصفي شبه حرّ؛ إذ يمكن إبدال 'لغوي' بـ'أسلوبي' أو 'بلاغي' مع بقاء المعنى الوصفي صالحاً، مما يُضعف اجتيازه اختبار السكّ المعجمي"
      - "التعريف الحالي 'أي أسلوب لغة أنيق بشكل مصطنع' ترجمة حرفية للإنجليزية تفتقر إلى الأسلوب المعجمي العربي"
    observations: >
      تتناول هذه المجموعة مفهوم التفاصح الزخرفي المصطنع المعروف إنجليزياً بـ Euphuism؛ وهو
      أسلوب تعبيري يُقدَّم فيه الشكل على المضمون، مع إغراق في التزيين اللفظي والبديعي بما
      يتجاوز الطبيعي إلى المصطنع. يمتلك التراث العربي رصيداً واسعاً من المصطلحات ذات الصلة:
      التفاصح، والتقعّر، والتفيهق، والتنطع، والتصنّع. وأدقّها للمفهوم المقصود هو "التفاصح"
      بوصفه مصدراً يعني تكلّف الفصاحة عن تصنّع. ومما يستوقف أن المورد الحديث (2008) يُقابل
      euphuism بـ"التأنق اللفظي أو البديعي"، وهو تعبير ثانوي مقبول لكنه وصفي.

  blind_candidates:
    - lemma: "تَقَعُّر"
      generation_method: ishtiqaq
      justification: "مصدر تقعَّر على وزن تَفَعُّل من قعر الشيء؛ واستُعمل في وصف التعمّق والتعسّف في الكلام وتجشّم غريبه. يلتقي دلالياً مع الأسلوب اللغوي الأنيق بشكل مصطنع من جهة الاصطناع والتكلّف."
    - lemma: "تَفَيْهُق"
      generation_method: ishtiqaq
      justification: "مصدر تفيهق على وزن تَفَيْعَل من فهق بمعنى الاتساع والامتلاء؛ يُقال تفيهق في كلامه: توسّع وتنطّع ومَلأ فمه بالألفاظ الجزلة تصنّعاً. يلتقي مع مفهوم الإغراق في الأسلوب المصطنع."
    - lemma: "تَنَمُّق"
      generation_method: ishtiqaq
      justification: "مصدر تنمّق على وزن تَفَعُّل من نمّق بمعنى زيّن وزخرف وأتقن الكتابة مفرطاً. يُعبّر عن التزيين المفرط للأسلوب اللغوي، وهو الجانب الأبرز في مفهوم الأناقة اللفظية المصطنعة."
    - lemma: "زَخْرَفَة"
      generation_method: majaz
      justification: "الزخرف أصله الذهب ثم الزينة؛ يمكن إحياؤه مجازاً ليدل على الزينة اللفظية الزائفة المصطنعة في الأسلوب، كما يُستعمل القرآن الكريم 'زُخْرُفَ الْقَوْلِ' للكلام المزيَّن زيفاً."


