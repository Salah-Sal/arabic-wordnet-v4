step0_evidence:
  per_lemma:
    - lemma: "مستنسخ"
      confirm:
        - text: "«المُسْتَنْسَخ: فَرْدٌ يُنشأ من خليّة واحدة تؤخذ من أحد الأشخاص» — المورد الحديث (2008)"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«نسخةٌ من حاسوب أكثر شدة، أو أعلى مقاماً، أو أغلى ثمناً، تشابه ذلك الحاسوبَ الأصلي من حيث المظهر والعمل» — معجم مصطلحات المعلوماتية (2000)"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "استعمال مجازي في مجال التقنية والحاسوب"

    - lemma: "نسيلة"
      confirm:
        - text: "«النَّسيلَةُ: واحدة النَّسِيل، الولد» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«نَسيلَة (clone)» — المعجم الطبي الموحد (2009)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«نسِيلة (clone)» — المعجم الموحد لمصطلحات الطب البيطري (2010)"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«الفتيلة، العسل إذا ذاب وفارق الشمع» — المعجم الوسيط"
          source: "المعجم الوسيط"
          addition: "معانٍ تراثية قديمة لا علاقة لها بالمفهوم البيولوجي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "كلون"
      source_section: "step5_english_bridge"
      evidence_citation: "«كلون (clone)» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
      justification: "تعريب مباشر للمصطلح العالمي (clone) مستخدم في معاجم علم الأحياء والوراثة"
  knowledge_candidates:
    - lemma: "مستنسخ"
      justification: "اسم مفعول من 'استنسخ'، يعبر عن الفرد أو الكائن الناتج عن عملية الاستنساخ (reproduction/cloning)"
    - lemma: "نسيلة"
      justification: "مصطلح عربي مستحدث (إحياء لمعنى الولد) استقر في المعاجم العلمية الحديثة للتعبير عن المستعمرة الخلوية أو الأفراد المتطابقين"
  generation_notes: "المصطلح علمي بامتياز، تتردد فيه الترجمة (مستنسخ) والتعريب (كلون) والمصطلح التراثي المحيا (نسيلة)."

step1_lemma_validation:
  per_lemma:
    - lemma: "مستنسخ"
      decision: confirmed
      decision_reason: "مصطلح مستقر ومدعوم بالمعاجم الحديثة (المورد) ويدل بوضوح على الفرد الناتج عن الاستنساخ."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على كونه 'نتاج' لعملية الاستنساخ، ويستخدم غالباً للأفراد (organism level)."
      example: "النعجة دوللي هي أول حيوان ثديي مستنسخ من خلية جسمية بالغة."

    - lemma: "نسيلة"
      decision: confirmed
      decision_reason: "مصطلح علمي متخصص معتمد في المعاجم الطبية والبيطرية العربية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يستخدم غالباً في السياق البيولوجي والوراثي للتعبير عن المجموعة (group level) أو السلالة المتطابقة."
      example: "تتكون النسيلة من خلايا متطابقة جينياً مشتقة من خلية واحدة."

    - lemma: "كلون"
      source: step05
      decision: confirmed
      decision_reason: "تعريب شائع جداً في الكتب الدراسية والمراجع الجامعية لعلم الأحياء."
      step05_citation: "«كلون (clone)» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "لفظ دخيل (loanword) يستخدم في الأوساط الأكاديمية كبديل للمصطلح العربي."
      example: "يتم عزل الكلون المتطابق في المختبر لدراسة التعبير الجيني."
      actions:
        - command: create_entry
          params:
            lemma: "كلون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07956482-n"

step3_definition:
  definition_review_flag: false
  current_definition: "مجموعة من الخلايا أو الكائنات المتطابقة وراثياً المشتقة من خلية واحدة أو فرد واحد عن طريق نوع من التكاثر اللاجنسي"
  assessment:
    decision: retain
    reason: "التعريف دقيق علمياً وشامل للمعنى البيولوجي المقصود."

step4_relations:
  hypernymy:
    current_hypernym: "كائن حي"
    test_result: "needs_closer"
    # مبرر: التعريف يقول 'مجموعة من الخلايا أو الكائنات'، والهايبرنيم الحالي هو 'كائن حي'. 
    # من الناحية المنطقية، المجموعة هي 'مجموعة حيوية' (biological group)، لكن AWN يفتقر لهذا التصنيف أحياناً.
    # بما أن اللمّة 'مستنسخ' تطلق أيضاً على الفرد، فالارتباط بـ 'كائن حي' مقبول جزئياً.
  antonymy:
    per_lemma:
      - lemma: "مستنسخ"
        antonym_found: false
  actions: []

