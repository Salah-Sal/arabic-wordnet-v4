# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائري: يستخدم الصفتين «السلمية» و«القياسية» اللتين تُشكّلان جوهر اللمّتين الموجودتين، فلا يُضيف معلومة تفسيرية جديدة"
      - "اللمّتان الموجودتان مكتوبتان بدون تشكيل كامل"
      - "التعريف لا يُحدد السياق الجبري المجرد (abstract algebra) الذي يُفرّق هذا الحقل عن «الحقل» العام في المجموعة الأم"
      - "لا يوجد ربط صريح بالفضاءات الشعاعية التي يُشكّل هذا الحقل أساسها"
    observations: >
      المجموعة تصف الحقلَ السُّلَّمي في الجبر المجرد، وهو حقل (بالمعنى الجبري الدقيق المُعرَّف في المجموعة الأم) تكون عناصره كميات
      سُلَّمية لامتجهة. اللمّتان «حقل سلمي» و«حقل قياسي» تعكسان الترادفَ الموثق في المعاجم الموحدة بين «سُلَّمي» و«قياسي»
      لمفهوم scalar الإنجليزي. غير أن التعريف الحالي يعاني من الدوران الاصطلاحي؛ إذ يستعمل نفس المادة المعجمية للمّتين شرحاً لهما.
      يُستحسن تعريف الحقل بجنسه القريب (حقل جبري) وفصله النوعي (عناصره أعداد لامتجهة). المصطلح من الجبر الحديث وليس له جذر
      تراثي عربي كلاسيكي مما يُصنّفه ضمن «الإهمال الثقافي» (omission).
  blind_candidates:
    - lemma: "حَقْلٌ سُلَّمِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (مركب إضافة صفة نسبية) من «حَقْل» (الجنس الجبري) و«سُلَّمِيّ» (نسبة إلى السُّلَّم بمعنى المقياس التدريجي).
        الصفة «سُلَّمي» تعكس اللاتجاهية: الكمية السُّلَّمية ذات قيمة عددية خالصة دون بُعد اتجاهي.
    - lemma: "حَقْلٌ قِيَاسِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «حَقْل» و«قِيَاسِيّ» (نسبة إلى القياس/التقدير). يُبرز أن عناصر الحقل مقادير قابلة للتقدير الكمي المعياري
        دون إضافة اتجاه؛ أساسه الجذر قوس/قيس (تقدير شيء بشيء).
    - lemma: "حَقْلٌ عَدَدِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «حَقْل» و«عَدَدِيّ» (نسبة إلى العَدَد). الكميات السُّلَّمية هي في جوهرها أعداد، والمعاجم الرياضية الموحدة
        توثّق «عددي» مرادفاً لـ«سُلَّمي» في السياق الرياضي والهندسي.
    - lemma: "حَقْلٌ لَامُتَّجِهٍ"
      generation_method: tarkib
      justification: >
        تركيب وصفي نافٍ: «حَقْل» + «لامُتَّجِه» (الكمية الخالية من الاتجاه). المعاجم الحديثة تستخدم «لامتجه» ترجمةً لـscalar
        في سياق تعريف الكميات اللافيزيائية الاتجاهية. يُبيّن الفصل النوعي مباشرةً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "حَقْلٌ سُلَّمِيٌّ"
      expands:
        - text: "«كَمِيَّةٌ سُلَّمِيَّة — scalar quantity»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "يوثق «سُلَّمي» مقابلاً رسمياً لـscalar في المعاجم الرياضية الصادرة عن ALECSO"
        - text: "«عامل سلّمي — scalar factor»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "يُثبت إنتاجية «سُلَّمي» في توليد المركبات الرياضية بالطريقة الوصفية ذاتها"
        - text: "«ضرب سلّمي — scalar multiplication»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "الضربُ السُّلَّمي هو العملية الجوهرية المعرَّفة على الحقل السُّلَّمي في الفضاءات الشعاعية"
        - text: "«جداء سلّمي — scalar product»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "يُرسّخ قبول المجتمع العلمي العربي لـ«سُلَّمي» في السياق الرياضي"
        - text: "«سُلَّمي: عاملٌ (أو مُعامل، أو متغيّر) مكوَّن من قيمة وحيدة (بعكس التسجيلة، أو الصفيفة، أو أي بنية معطيات معقّدة أخرى)»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُعرّف «سُلَّمي» بالقيمة الأحادية، مما يُجلّي طابع اللاتجاهية الكامن في الاسم"
        - text: "«(2) سُلَّميّ؛ عَدَديّ؛ لامُتَّجه: صفة للكمّيّة التي تعبِّر عن مقدار معيَّن من غير أن تعبِّر عن اتجاه»"
          source: "المورد الحديث (2008)"
          addition: "يُثبّت مرادفية سُلَّمي/عددي/لامتجه جميعاً لـscalar، ويُقدّم «سُلَّمي» أولاً دلالةً على شيوعه"
        - text: "«كَمِّيَّةٌ سُلَّمِيَّة — scalar quantity»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "تأكيد الاستعمال في المعاجم الطبية أيضاً"

    - lemma: "حَقْلٌ قِيَاسِيٌّ"
      expands:
        - text: "«كثافة الفيض الإشعاعى القياسى — scalar irradiance»"
          source: "موسوعة الكهرباء — IEC 60050 (Electropedia)"
          addition: "يوثق «قياسي» مقابلاً صريحاً لـscalar في المعاجم الفيزيائية والكهربائية الدولية"
        - text: "«الاستضاءة الكمية — scalar illuminance»"
          source: "موسوعة الكهرباء — IEC 60050 (Electropedia)"
          addition: "يُظهر تنوع ترجمات scalar في الفيزياء بين القياسي والكمي"
        - text: "«(2) سُلَّميّ؛ عَدَديّ؛ لامُتَّجه...»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت ترادف «سُلَّمي» و«قياسي» ضمن مجموعة الترجمات الموثقة لـscalar"

    - lemma: "حَقْلٌ عَدَدِيٌّ"
      confirm:
        - text: "«عددي — scalar»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«عددي: سُلَّمي (المرادف العربي) — scalar»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      contradicts:
        - text: "«عددي — numeral» | «عددي — numeric» | «عددي — numerical»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)، المعجم الطبي الموحد (2009)، معجم اللسانيات (2002)، المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: >
            «عددي» في الغالب يُترجم numeral/numerical/numeric لا scalar؛ وهذا التعدد الدلالي الموثق في معاجم متعددة
            يُضعف التخصيص الدلالي لـ«حقل عددي» في سياق الجبر المجرد ويُفتح بابه على الالتباس مع «الحقل العددي» (number field)

    - lemma: "حَقْلٌ لَامُتَّجِهٍ"
      expands:
        - text: "«(2) سُلَّميّ؛ عَدَديّ؛ لامُتَّجه: صفة للكمّيّة التي تعبِّر عن مقدار معيَّن من غير أن تعبِّر عن اتجاه»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت «لامتجه» ضمن المرادفات العربية لـscalar بوصفه صفة، غير أن توظيفه في مركب اسمي «حقل لامتجه» لم يُوثَّق مستقلاً"


