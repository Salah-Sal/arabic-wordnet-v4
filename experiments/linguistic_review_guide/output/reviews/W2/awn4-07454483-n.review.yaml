# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07454483-n
# radiation (biology): the spread of a group of organisms into new habitats
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم لفظة «انتشار» وهي إحدى لمّات المجموعة — دوران معجمي"
      - "لفظة «تشعب» فعل في الأصل (تَشَعَّبَ)، واللمّة المسجّلة بدون تشكيل فلا يُعرف أهي المصدر أم الفعل"
      - "المفهوم البيولوجي (adaptive radiation) يختلف عن الانتشار العام (diffusion/propagation)؛ اللمّتان عامّتان جدّاً"
    observations: "المجموعة تصف مفهوم الانتشار التطوّري الذي تتفرّق فيه مجموعة أحيائية لتستوطن بيئات جديدة وتتكيّف معها. المصطلح الإنجليزي radiation هنا مجازيّ (إشعاع ← انبثاق في اتجاهات متعدّدة). المعاجم المصطلحية العربية تستخدم «تشعُّع تكيُّفي» لهذا المفهوم تحديداً. اللمّتان الحاليتان (انتشار، تشعب) صالحتان لكنهما عامّتان ولا تختصّان بالمفهوم البيولوجي."
  blind_candidates:
    - lemma: "تَشَعُّع"
      generation_method: ishtiqaq
      justification: "مصدر تَشَعَّعَ على وزن تَفَعُّل من الجذر شعع، مقابل radiation بمعناه المجازي البيولوجي: الانبثاق في اتّجاهات متعدّدة. المعجم الموحّد لعلم الأحياء يستخدم «تشعُّع تكيُّفي» لـ adaptive radiation"
    - lemma: "تَبَيُّؤ"
      generation_method: ishtiqaq
      justification: "مصدر تَبَيَّأَ على وزن تَفَعُّل من الجذر بيأ (بيئة)، ويعني اتّخاذ بيئة جديدة والاستقرار فيها"
    - lemma: "اِنْبِثَاث"
      generation_method: ishtiqaq
      justification: "مصدر اِنْبَثَّ على وزن اِنْفِعَال من الجذر بثث (البثّ = النشر والإذاعة)، يدلّ على التفرّق والانتشار في الاتّجاهات"
    - lemma: "تَفَرُّع حَيَوِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي: تَفَرُّع (التشعّب) + حيويّ (بيولوجي)، يصف تفرّع الكائنات الحيّة في اتّجاهات تطوّرية مختلفة"

stage2_evidence:
  per_lemma:
    - lemma: "اِنْتِشَار"
      confirm:
        - text: "«انتشار الأفراد بعيدا عن بعضهم البعض، على سبيل المثال، انتقال النسل بعيدا عن آبائهم ومن المناطق ذات الكثافة العالية إلى المناطق المنخفضة الكثافة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm) — dispersal"
        - text: "«ويطلق على انتقال البذور من الثمار التي تكونت فيها إلى مكان بعيد بفعل عوامل متعددة»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — dispersal"
      expands:
        - text: "«خاصة في بعض الأجسام وهي أن تنتشر في كتلة مائعة وأن تخترق أغشية التنافذ»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — diffusion"
          addition: "الانتشار يُستخدم أيضاً بمعنى الانتشار الفيزيائي (diffusion)، ممّا يجعله متعدّد الدلالة"
        - text: "«النُّونُ وَالشِّينُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَتْحِ شَيْءٍ وَتَشَعُّبِهِ»"
          source: "مقاييس اللغة لابن فارس — مادة نشر"
          addition: "الجذر نشر يدلّ أصلاً على الفتح والتشعّب، وهو مناسب دلالياً"

    - lemma: "تَشَعُّب"
      confirm:
        - text: "«(تشعب) انْتَشَر وتفرق وَالزَّرْع وَنَحْوه صَار ذَا شعب»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«الشَّىْءُ: تَجَمَّعَ، تَفَرَّقَ, وَتَفَرَّعَ. (ضدٌّ)»"
          source: "المعجم الكبير"
        - text: "«تشعب تطوريّ، انتشار تطوريّ: أسلوب من أساليب التغيرات التطويرية (تطور نوعيّ)، وفيه تنشطر العشيرة على المدى الزمنيّ مما يؤدي إلى ظهور فروع نوعية مختلفة»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — evolutionary divergence"
      expands:
        - text: "«الشِّينُ وَالْعَيْنُ وَالْبَاءُ أَصْلَانِ مُخْتَلِفَانِ، أَحَدُهُمَا يَدُلُّ عَلَى الِافْتِرَاقِ، وَالْآخَرُ عَلَى الِاجْتِمَاعِ»"
          source: "مقاييس اللغة لابن فارس — مادة شعب"
          addition: "الجذر شعب من الأضداد: يدلّ على الافتراق وعلى الاجتماع معاً"

    - lemma: "تَشَعُّع"
      confirm:
        - text: "«تشعع تكيفي: تطور مجموعة حيوانية في اتجاهات متباينة متكيفة بالبيئات المختلفة التي تنتشر فيها»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — adaptive radiation"
      contradicts:
        - text: "لا يوجد مدخل مستقل لـ «تشعع» كمفرد؛ يرد فقط في المركّب «تشعع تكيفي»"
          source: "قاعدة البيانات المعجمية"
          conflict: "اللفظة غير مسجّلة كوحدة معجمية مستقلّة في أيّ معجم"

    - lemma: "تَبَيُّؤ"
      evidence_status: "no_material_found"

    - lemma: "اِنْبِثَاث"
      contradicts:
        - text: "«انبثاث: انتقال مركز المرض»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992) — metastasis"
          conflict: "اللفظة مخصّصة طبّياً لمعنى النقيلة (metastasis)، لا لانتشار الكائنات"

    - lemma: "تَفَرُّع حَيَوِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "اِنْتِشَار"
      decision: confirmed
      decision_reason: "لفظة فصيحة مصدرية من الجذر نشر، مؤكَّدة في معاجم علم الأحياء بمعنى dispersal (تفرّق الأفراد في بيئات جديدة). وإن كانت عامّة الدلالة، فهي تغطّي جانب «الانتقال المكاني» من المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد المكاني: انتقال الكائنات وتوزّعها في مواطن جديدة، دون التأكيد على التنوّع الشكلي أو التكيّفي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْتِشَار"

    - lemma: "تَشَعُّب"
      decision: confirmed
      decision_reason: "مصدر تَشَعَّبَ من الجذر شعب، معناه التفرّق والتفرّع. مؤكَّد في معجم الوراثة بمعنى evolutionary divergence (تشعب تطوري). يغطّي جانب التفرّع والتنوّع من المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد التطوّري: تفرّع المجموعة إلى فروع نوعية مختلفة متباينة الصفات، مع دلالة على التشجّر والتفرّع من أصل واحد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشَعُّب"

    - lemma: "تَشَعُّع"
      source: stage1
      decision: removed
      decision_reason: "لا يوجد مدخل معجمي مستقل لـ «تشعع» في أيّ معجم؛ اللفظة لا ترد إلا ضمن المركب «تشعع تكيفي». لا يصحّ اقتطاعها من مركبها واستخدامها مفردةً لهذا المفهوم."

    - lemma: "تَبَيُّؤ"
      source: stage1
      decision: removed
      decision_reason: "لا توجد أيّ شواهد معجمية لهذه اللفظة. الاشتقاق نظري غير مسكوك."

    - lemma: "اِنْبِثَاث"
      source: stage1
      decision: removed
      decision_reason: "اللفظة مخصّصة في المصطلحية الطبية بمعنى النقيلة (metastasis). استخدامها للانتشار البيولوجي يُحدث لبساً اصطلاحياً خطيراً."

    - lemma: "تَفَرُّع حَيَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي غير مسكوك، لا يوجد في أيّ معجم مصطلحي. يفشل في اختبار التثبيت المعجمي."

