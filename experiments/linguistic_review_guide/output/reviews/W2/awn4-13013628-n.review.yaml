      entry_id: "{auto}"
      root: "فطر"
      maqayis_quote: "«الْفَاءُ وَالطَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَتْحِ شَيْءٍ وَإِبْرَازِهِ... وَمِنْهُ الْفَطْرُ، بِفَتْحِ الْفَاءِ، وَهُوَ مَصْدَرُ فَطَرْتُ الشَّاةَ فَطْرًا، إِذَا حَلَبْتَهَا.»"
  per_sense:
    - lemma: "فُطْر"
      sense_id: "{auto}"
      nuance: "المصطلح العلمي الشامل والدقيق الدال على كائنات هذه المملكة."
