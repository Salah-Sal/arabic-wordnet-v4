stage1_review:
  assessment:
    concerns:
      - "اللمة (فطر) غير مشكولة، ويجب ضبطها لتصبح (فُطْر)."
      - "التعريف يميل إلى الترجمة الحرفية علمياً، لكنه دقيق وشامل لخصائص المملكة الفطرية."
    observations: "مصطلح (فُطْر) هو المعتمد علميا وتراثيا للدلالة على هذا الكائن الحي، ويشمل أنواعا عديدة كالمشروم والعفن والخميرة."
  blind_candidates:
    - lemma: "فُطْر"
      generation_method: majaz
      justification: "استخدام اللفظ التراثي الدال على نباتات معينة (كضرب من الكمأة) وتعميمه علمياً ليشمل المملكة الفطرية كلها."
    - lemma: "عُشّ الغُرَاب"
      generation_method: tarkib
      justification: "مركب إضافي شائع الاستخدام للإشارة إلى بعض أنواع الفطريات الكبيرة المأكولة."
    - lemma: "كَمْأَة"
      generation_method: majaz
      justification: "إطلاق اسم الجزء أو النوع (الكمأة تنمو تحت الأرض) على الكل مجازا."
    - lemma: "عَفَن"
      generation_method: majaz
      justification: "يطلق العفن على الفطريات الدقيقة، ويمكن استخدامه مجازا للإشارة للمجموعة بشكل عام."

stage2_evidence:
  per_lemma:
    - lemma: "فطر"
      confirm:
        - text: "«اسم يطلق على طائفة من اللازهريات (فطريات)»"
          source: "المعجم الوسيط"
        - text: "«مصطلح عام يشمل مجموعة من الكائنات الحية البدائية من حقيقيات النوى، تضم الفطور والخمائر، وتتميز بغياب اليخضور ووجود جدار خلويّ قاس.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
    - lemma: "عُشّ الغُرَاب"
      expands:
        - text: "«أحد أنواع عش الغراب لونه أبيض وصالح للأكل.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
          addition: "يدل على نوع محدد من الفطريات وليس كامل المملكة الفطرية."
    - lemma: "كَمْأَة"
      expands:
        - text: "«الفُطْرُ: ضَرْبٌ من الكَمْاةِ، الواحِدَةُ فُطْرَةٌ.»"
          source: "المحيط في اللغة"
          addition: "الكمأة نوع خاص من الفطريات ينبت تحت الأرض."
    - lemma: "عَفَن"
      expands:
        - text: "«نباتاتٌ فطْرِيَّة تعيش مترمِّمة وتسبب التعفُّن»"
          source: "المعجم الوسيط"
          addition: "العفن يمثل مجموعة جزئية مترممة من الفطريات، ولا يشمل الكائنات الأخرى كالمشروم."

stage3_analysis:
  per_lemma:
    - lemma: "فطر"
      decision: confirmed
      decision_reason: "هو المصطلح العلمي واللغوي الدقيق والأشمل لهذه المملكة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُطْر"
    - lemma: "عُشّ الغُرَاب"
      source: stage1
      decision: removed
      decision_reason: "لأنه يدل على نوع فرعي محدد (مشروم) ذي شكل مميز، ولا يشمل الفطريات المجهرية كالعفن والخميرة."
    - lemma: "كَمْأَة"
      source: stage1
      decision: removed
      decision_reason: "نوع خاص من الفطريات التي تنمو تحت الأرض، ولا يصلح مصطلحاً شاملاً للمملكة."
    - lemma: "عَفَن"
      source: stage1
      decision: removed
      decision_reason: "يدل على الفطريات الرمية المسببة للفساد، ولا يشمل الفطريات الكبيرة أو الخمائر."

stage4_content:
  definition:
    current: "كائن من مملكة الفطريات يفتقر إلى الكلوروفيل ويتغذى على المواد العضوية؛ يتراوح من كائنات وحيدة الخلية أو متعددة الخلايا إلى مدمجات خلوية حاملة للأبواغ"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق علميا وشامل ومناسب للمفهوم الأحيائي المعاصر."
  examples:
    per_lemma:
      - lemma: "فُطْر"
        examples:
          - text: "تَتَغَذَّى بَعْضُ أَنْوَاعِ الفُطْرِ عَلَى المَوَادِّ العُضْوِيَّةِ المُتَحَلِّلَةِ فِي التُّرْبَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-13013628-n"
          text: "تَتَغَذَّى بَعْضُ أَنْوَاعِ الفُطْرِ عَلَى المَوَادِّ العُضْوِيَّةِ المُتَحَلِّلَةِ فِي التُّرْبَةِ."

