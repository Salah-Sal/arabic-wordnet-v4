stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية غير مشكولة وتحتاج إلى ضبط البنية الصرفية."
    observations: "مفهوم الشمال هنا يخص الموقع الجغرافي كجزء من منطقة (the North)، وليس الاتجاه الجغرافي المطلق وحسب. اللمة (شمال) مناسبة تماماً وتفي بالغرض متى ما ضُبطت بالشكل الصحيح."
  blind_candidates:
    - lemma: "شَمَال"
      generation_method: ishtiqaq
      justification: "اللفظ القياسي للدلالة على الجهة والموقع الذي يقابل الجنوب."
    - lemma: "نَاحِيَةٌ شَمَالِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي يدل على الجزء الشمالي من المنطقة."
    - lemma: "جِهَةٌ شَمَالِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي مشابه يدل على موقع في الشمال."
    - lemma: "شَأْم"
      generation_method: majaz
      justification: "لفظ تراثي يطلق على جهة الشمال (وخصوصا إقليم الشام)."

stage2_evidence:
  per_lemma:
    - lemma: "شَمَال"
      confirm:
        - text: "«فِي الجغرافيا: الجهةُ التى تُقابِلُ الجنوبَ, وتكونُ على شمال المُتَّجِه إلى الشَّرْق. بُلْدانُ الشَّمال: البُلْدانُ الواقعةُ فى الْقِسْمِ الأَعْلَى من الكرة الأرضيَّة»"
          source: "المعجم الكبير"
      expands:
        - text: "«(الشمَال) الْجِهَة الَّتِي تقَابل الْجنُوب وَتَكون على شمالك وَأَنت مُتَّجه إِلَى الشرق وَالرِّيح الَّتِي تهب من تِلْكَ الْجِهَة»"
          source: "المعجم الوسيط"
    - lemma: "شَأْم"
      expands:
        - text: "«الإقليم الشمالى الغربي من شبه جزيرة العرب»"
          source: "المعجم الوسيط"
        - text: "«أرض سميت بذلك لأنها من مشأمة القبلة»"
          source: "مقاييس اللغة"
    - lemma: "نَاحِيَةٌ شَمَالِيَّةٌ"
      evidence_status: no_material_found
    - lemma: "جِهَةٌ شَمَالِيَّةٌ"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "شمال"
      decision: confirmed
      decision_reason: "اللمة صحيحة وفصيحة وتستخدم للدلالة على الموقع الجغرافي الذي يقع في جهة الشمال، مع ضرورة تشكيلها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance: "اللفظ العام والقياسي للموقع الجغرافي في شمال البلاد أو المنطقة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَمَال"
    - lemma: "نَاحِيَةٌ شَمَالِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي حر، وليس مصطلحا معجميا مستقلا مسكوكا."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
    - lemma: "جِهَةٌ شَمَالِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي حر لا يشكل لمة معجمية مستقلة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
    - lemma: "شَأْم"
      source: stage1
      decision: removed
      decision_reason: "يطلق تخصيصا على الإقليم الجغرافي المحدد (بلاد الشام) أو على الجهة اليسرى في السياق التراثي، ولا يصلح كمصطلح عام لـ'الجزء الشمالي من أي موقع'."
      evidence_assessment:
        case: expands_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "موقع في الجزء الشمالي من بلد أو منطقة أو مدينة"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق ويعبر عن المفهوم الجغرافي للمكان الواقع في الشمال بشكل صحيح."
  examples:
    per_lemma:
      - lemma: "شمال"
        examples:
          - text: "ازدهرت الصناعة في شَمَالِ البلاد."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "ازدهرت الصناعة في شَمَالِ البلاد."

stage5_enrichment:
  per_entry:
    - lemma: "شمال"
      entry_id: "{auto}"
      root: "شمل"
      maqayis_quote: "«وَالْأَصْلُ الثَّانِي يَدُلُّ عَلَى الْجَانِبِ الَّذِي يُخَالِفُ الْيَمِينَ. مِنْ ذَلِكَ: الْيَدُ الشِّمَالُ، وَمِنْهُ الرِّيحُ الشِّمَالُ لِأَنَّهَا تَأْتِي عَنْ شِمَالِ الْقِبْلَةِ...»"
  per_sense:
    - lemma: "شمال"
      sense_id: "{auto}"
      nuance: "اللفظ العام الذي يدل على الموقع في الجزء الشمالي، وهو المصطلح الجغرافي المعتمد."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"شمل","maqayis":"«وَالْأَصْلُ الثَّانِي يَدُلُّ عَلَى الْجَانِبِ الَّذِي يُخَالِفُ الْيَمِينَ. مِنْ ذَلِكَ: الْيَدُ الشِّمَالُ، وَمِنْهُ الرِّيحُ الشِّمَالُ لِأَنَّهَا تَأْتِي عَنْ شِمَالِ الْقِبْلَةِ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ العام الذي يدل على الموقع في الجزء الشمالي، وهو المصطلح الجغرافي المعتمد.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95