stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان (غافر ومسامح) جيدتان، لكنهما تفتقران إلى صيغ المبالغة (عَفُوّ، صَفُوح) التي تشيع في اللسان العربي للتعبير عن هذا المفهوم كسمة ملازمة للشخص."
      - "كلمة 'غافر' قد توحي بالسياق الإلهي أكثر من البشري في بعض الاستعمالات الحديثة."
    observations: "المجموعة الترادفية تمثل مفهوم الشخص الذي يمارس العفو (Pardoner). التعريف العربي الحالي دقيق وشامل للأفعال الثلاثة (عفا، غفر، سامح). من الأفضل إثراء المجموعة بصيغ المبالغة التراثية التي تعبر عن التمكن من هذه الصفة."
  blind_candidates:
    - lemma: "غَفُور"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن 'فَعُول' من الفعل 'غَفَرَ'، وتدل على كثرة الستر والمغفرة."
    - lemma: "صَفُوح"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن 'فَعُول' من الفعل 'صَفَحَ'، وهي أبلغ من العفو لأنها تتضمن ترك اللوم."
    - lemma: "عَفُوّ"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن 'فَعُول' من الفعل 'عَفَا'، وهو الذي يترك العقوبة استحقاقاً."
    - lemma: "مُتَجَاوِز"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'تجاوز'، ويستخدم في السياق القانوني والاجتماعي للتعبير عن الإغضاء عن الخطأ."

stage2_evidence:
  per_lemma:
    - lemma: "غَافِر"
      confirm:
        - text: "«(2) الغافر؛ الصافح.»"
        - source: "المورد الحديث"
    - lemma: "مُسَامِح"
      confirm:
        - text: "«(الصفوح) الْكَرِيم المسامح»"
        - source: "المعجم الوسيط"
      expands:
        - text: "«جمع مسمح بمعنى الكثير السماح أي التسامح والتساهل.»"
        - source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "عَفُوّ"
      confirm:
        - text: "«رَجُلٌ عَفُوٌّ عن الذَّنبِ: عافٍ.»"
        - source: "القاموس المحيط"
        - text: "«العَفُوُّ: الْكَثير الْعَفو.»"
        - source: "المعجم الوسيط"
    - lemma: "صَفُوح"
      confirm:
        - text: "«(الصفوح) الْكَرِيم المسامح»"
        - source: "المعجم الوسيط"
        - text: "«الصَّفُوحُ: الكريمُ المُسامِحُ»"
        - source: "المعجم الكبير"
    - lemma: "غَفُور"
      confirm:
        - text: "«غَفُّور من (غ ف ر) كثير الستر والعفو عن الذنوب.»"
        - source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُتَجَاوِز"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "غَافِر"
      decision: confirmed
      decision_reason: "اسم فاعل مباشر يعبر عن المدلول اللغوي والمصطلحي للمجموعة، وهو مدعوم في المعاجم الحديثة كترجمة لـ Pardoner."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
    - lemma: "مُسَامِح"
      decision: confirmed
      decision_reason: "مصطلح شائع الاستخدام قديماً وحديثاً، ويدل على السهولة والتساهل في ترك المؤاخذة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
    - lemma: "عَفُوّ"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة مبالغة بليغة تدل على كثرة العفو، وهي من أدق الألفاظ العربية لوصف الشخص الذي يعفو عن الذنب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عَفُوّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10418998-n"}
    - lemma: "صَفُوح"
      source: stage1
      decision: confirmed
      decision_reason: "لفظة تراثية تدل على العفو الكريم مع الإعراض عن اللوم، وهي مكملة دلالية هامة للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "صَفُوح", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10418998-n"}
    - lemma: "غَفُور"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة مبالغة قياسية تدل على كثرة المغفرة والستر، وتناسب سياق الشخص الذي يتكرر منه فعل الغفران."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "غَفُور", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10418998-n"}
    - lemma: "مُتَجَاوِز"
      source: stage1
      decision: removed
      decision_reason: "اللفظة في المعاجم المتوفرة تميل للسياق المادي والتقني (تجاوز الحدود)، واستخدامها في العفو غالباً ما يكون مركباً (متجاوز عن الخطأ) وليس كلفظة مفردة مسكوكة لهذا المعنى."

stage4_content:
  definition:
    current: "شخص يعفو أو يغفر أو يسامح عن خطأ أو جريمة"
    assessment:
      decision: retain
      reason: "التعريف دقيق ومباشر ويجمع بين الأبعاد الدلالية الثلاثة للمجموعة."
  examples:
    per_lemma:
      - lemma: "غَافِر"
        examples:
          - text: "كان القاضي غافراً لزلات المخطئين الذين أظهروا ندمهم."
            type: usage
      - lemma: "مُسَامِح"
        examples:
          - text: "لا يجد الحقد مكاناً في قلب الرجل المُسامح."
            type: usage
      - lemma: "عَفُوّ"
        examples:
          - text: "كان الحاكم عَفُوّاً، يميل إلى ترك العقوبة كلما وجد سبيلاً لذلك."
            type: usage
      - lemma: "صَفُوح"
        examples:
          - text: "يُعد الصَفُوح من أكرم الناس، لأنه يعفو ويترك اللوم تماماً."
            type: usage
      - lemma: "غَفُور"
        examples:
          - text: "يُثني الناس على من كان غَفُوراً لعيوب رفاقه."
            type: usage

