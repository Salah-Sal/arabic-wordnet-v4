      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَوْمَة"
    - lemma: "صُبْرَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ معجمي دقيق يضيف قيمة دلالية للمجموعة، حيث يختص بتجميع الطعام بلا كيل، وهو من تعابير 'الكومة' الأصيلة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "صُبْرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07978094-n"

stage4_content:
  definition:
    current: "مجموعة من الأشياء مكدسة فوق بعضها البعض"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم كلمة 'مكدسة' وهي مشتقة من اللمة 'كدس'، كما أن صياغة 'فوق بعضها البعض' يمكن تحسينها لتكون أكثر أصالة معجمية."
    authored:
      - type: terminological
        text: "ما اجتمع من الأشياء وتراكَمَ بَعضُه فوق بَعضٍ وارتفعَ له رَأْسٌ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "رُكَام"
        examples:
          - text: "عَمِلَ العُمَّالُ على إزالةِ رُكامِ المَباني بَعدَ الزِّلزالِ."
            type: usage
      - lemma: "كُدْس"
        examples:
          - text: "رَأَيْتُ على مَكْتَبِهِ أكْداساً من الكُتُبِ والأوراقِ."
            type: usage
      - lemma: "كَوْمَة"
        examples:
          - text: "جَمَعَ الفلّاحُ الحَطَبَ في كَوْمَةٍ كَبيرةٍ خَلْفَ الدّارِ."
            type: usage
      - lemma: "صُبْرَة"
        examples:
          - text: "اشْتَرى التّاجِرُ الحُبوبَ صُبْرَةً واحِدَةً بِلَا كَيْلٍ."
            type: usage
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-07978094-n"
        definition_index: 0
        text: "ما اجتمع من الأشياء وتراكَمَ بَعضُه فوق بَعضٍ وارتفعَ له رَأْسٌ."

stage5_enrichment:
