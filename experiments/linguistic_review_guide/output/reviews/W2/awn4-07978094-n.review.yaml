      entry_id: "{auto}"
      root: "ركم"
      maqayis_quote: "«الرَّاءُ وَالْكَافُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى [تَجَمُّعِ] الشَّيْءِ. تَقُولُ رَكَمْتُ الشَّيْءَ: أَلْقَيْتَ بَعْضَهُ عَلَى بَعْضٍ.»"
    - lemma: "كُدْس"
      entry_id: "{auto}"
      root: "كدس"
      maqayis_quote: "«الْكَافُ وَالدَّالُ وَالسِّينُ ثَلَاثُ كَلِمَاتٍ لَا يُشْبِهُ بَعْضُهَا بَعْضًا. فَالْأُولَى: كُدْسُ الطَّعَامِ.»"
    - lemma: "كَوْمَة"
      entry_id: "{auto}"
      root: "كوم"
      maqayis_quote: "«الْكَافُ وَالْوَاوُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَجَمُّعٍ فِي شَيْءٍ مَعَ ارْتِفَاعٍ فِيهِ... وَالْكَوْمَةُ: الصُّبْرَةُ مِنَ الطَّعَامِ وَغَيْرِهِ.»"
    - lemma: "صُبْرَة"
      entry_id: "{auto}"
      root: "صبر"
      maqayis_quote: "«الصَّادُ وَالْبَاءُ وَالرَّاءُ... الثَّالِثُ جِنْسٌ مِنَ الْحِجَارَةِ... الصُّبْرَةُ مِنَ الْحِجَارَةِ: مَا اشْتَدَّ وَغَلُظَ... ومنه صُبْرَة الطعام.»"
