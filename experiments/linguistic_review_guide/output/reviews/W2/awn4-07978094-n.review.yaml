stage1_review:
  assessment:
    concerns:
      - "تكرار كلمة 'مكدسة' في التعريف العربي، وهي مشتقة من إحدى اللّمات الموجودة (كدس)، مما قد يؤدي إلى الدوران."
    observations: "المجموعة واضحة دلالياً، واللّمات الحالية (ركام، كدس، كومة) تمثل النواة المركزية لهذا المفهوم في العربية. توجد فرصة لإثراء المجموعة بلمّات تراثية دقيقة مثل 'صبرة'."
  blind_candidates:
    - lemma: "كَوْمَة"
      generation_method: ishtiqaq
      justification: "الاسم الأشهر والأكثر شيوعاً للتعبير عن تجمع الأشياء المرتفع بعضها فوق بعض."
    - lemma: "كِدْس"
      generation_method: ishtiqaq
      justification: "لفظ فصيح يعبر عن تجميع الأشياء (كالحبوب أو الكتب) في كتلة واحدة."
    - lemma: "رُكَام"
      generation_method: ishtiqaq
      justification: "يدل على ما تراكم من الأشياء وتجمع بعضه فوق بعض، ويشيع في سياق الأنقاض والسحاب."
    - lemma: "صُبْرَة"
      generation_method: ishtiqaq
      justification: "لفظ تراثي دقيق يُطلق على الكومة من الطعام أو الحبوب المجموعة بلا كيل."

stage2_evidence:
  per_lemma:
    - lemma: "رُكَام"
      confirm:
        - text: "«(الركام) مَا اجْتمع من الْأَشْيَاء وتراكم بعضه فَوق بعض»"
          source: "المعجم الوسيط"
        - text: "«الرُّكامُ: ما اجْتَمَعَ من الأَشْياء وتَراكَمَ بعضُه فوقَ بَعْض»"
          source: "المعجم الكبير"
    - lemma: "كُدْس"
      confirm:
        - text: "«الْمُجْتَمِعُ مِنْ كُلِّ شَيْءٍ, نَحْوِ الْحَبِّ الْمَحْصُودِ, وَالتَّمْرِ, وَالدَّرَاهِمِ, وَالرَّمْلِ الْمُتَرَاكِبِ»"
          source: "المعجم الوسيط"
        - text: "«الكُدْس: جماعة طعام، وكذلك ما يجمع من دراهم ونحوه»"
          source: "لسان العرب"
    - lemma: "كَوْمَة"
      confirm:
        - text: "«(الكومة) كل مَا اجْتمع وارتفع لَهُ رَأس من تُرَاب أَو رمل أَو حِجَارَة أَو قَمح أَو نَحْو ذَلِك»"
          source: "المعجم الوسيط"
        - text: "«كومة قمح: كلُّ ما اجتمع وارتفع له رأس من تراب أو رمل أو حجارة أو قمح أو نحو ذلك»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "صُبْرَة"
      confirm:
        - text: "«(الصُّبْرَة) الكومة من الطَّعَام وَيُقَال اشْترى الطَّعَام صبرَة جزَافا بِلَا كيل أَو وزن»"
          source: "المعجم الوسيط"
        - text: "«ما جُمِع من الطَّعام بلا كَيْلٍ ولا وَزْنٍ, بعضُه فوقَ بعضٍ كالكومةِ»"
          source: "المعجم الكبير"

