stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'الفيل الأبيض' هي ترجمة حرفية (Calque) للمصطلح الإنجليزي، رغم شيوعها في الخطاب الحديث."
      - "نقص التشكيل في اللمة الحالية."
    observations: "المفهوم يعبر عن مفارقة بين القيمة الظاهرية والتكلفة التشغيلية المرهقة، وهو مفهوم حديث نسبياً في المعجمية العربية، يظهر بوضوح في معاجم المصطلحات الاقتصادية والسياسية."
  blind_candidates:
    - lemma: "فِيلٌ أَبْيَض"
      generation_method: majaz
      justification: "استعارة حديثة (Calque) شائعة جداً في العربية المعاصرة للتعبير عن الممتلكات التي تفوق كلفة صيانتها نفعها."
    - lemma: "عِبْءٌ ثَمِين"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين القيمة (ثمين) والعبء (كلفة الصيانة)."
    - lemma: "مُقْتَنًى مُكْلِف"
      generation_method: tarkib
      justification: "وصف مباشر للممتلكات ذات الكلفة العالية."
    - lemma: "خَسَارَةٌ ثَمِينَة"
      generation_method: majaz
      justification: "تعبير مجازي يصور الشيء النفيس كخسارة بسبب استنزافه للموارد."

stage2_evidence:
  per_lemma:
    - lemma: "الفيل الأبيض"
      confirm:
        - text: "«الفيل الأبيض: [...] مِلْكٌ يحتاج إلى عناية ونفقة ولكن مردوده ضئيل.»"
          source: "المورد الحديث (2008)"
    - lemma: "فِيلٌ أَبْيَض"
      confirm:
        - text: "«مشاريع مظهرية، مشاريع تفاخرية (الترجمة لـ white elephant projects)»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
    - lemma: "عِبْءٌ ثَمِين"
      evidence_status: "no_material_found"
    - lemma: "مُقْتَنًى مُكْلِف"
      evidence_status: "no_material_found"
    - lemma: "خَسَارَةٌ ثَمِينَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الفيل الأبيض"
      decision: confirmed
      decision_reason: "مصطلح اصطلاحي ثابت ومعترف به في المعاجم الحديثة (مثل المورد الحديث) كترجمة مطابقة للمفهوم الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الفِيلُ الأَبْيَض"
    - lemma: "فِيلٌ أَبْيَض"
      source: stage1
      decision: confirmed
      decision_reason: "الصيغة التنكيرية للمصطلح هي الأكثر شيوعاً عند استخدامه كخبر أو وصف (هذا المشروع فيل أبيض)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "فِيلٌ أَبْيَض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "عِبْءٌ ثَمِين"
      source: stage1
      decision: removed
      decision_reason: "مجرد وصف حر (free phrase) وليس وحدة معجمية مستقرة."
    - lemma: "مُقْتَنًى مُكْلِف"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي عام يفتقر إلى السمة الاصطلاحية."
    - lemma: "خَسَارَةٌ ثَمِينَة"
      source: stage1
      decision: removed
      decision_reason: "تعبير مجازي أدبي أكثر منه اصطلاحاً معجمياً."

stage4_content:
  definition:
    current: "ممتلكات قيمة تكون تكاليف صيانتها باهظة للغاية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يميل إلى الوصف، يفضل صياغته بأسلوب المعجم الوسيط مع التركيز على نقص المنفعة مقابل الكلفة."
    authored:
      - type: terminological
        text: "مِلْكٌ نَفِيسٌ تُرْهِقُ صَاحِبَهُ كُلْفَةُ صِيَانَتِهِ وَإِعَالَتِهِ، وَتَكُونُ نَفَقَتُهُ أَكْبَرَ مِنْ مَنْفَعَتِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "الفِيلُ الأَبْيَض"
        examples:
          - text: "أَصْبَحَتِ الحَامِلَةُ القَدِيمَةُ بِمَثَابَةِ الفِيلِ الأَبْيَضِ لِلأُسْطُولِ، فَنَفَقَاتُ صِيَانَتِهَا تَسْتَنْزِفُ المِيزَانِيَّةَ."
            type: usage
      - lemma: "فِيلٌ أَبْيَض"
        examples:
          - text: "يُحَذِّرُ الخُبَرَاءُ مِن تَحَوُّلِ المَلَاعِبِ الأُولِمْبِيَّةِ بَعْدَ انْتِهَاءِ الدَّوْرَةِ إِلَى فِيلٍ أَبْيَضَ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مِلْكٌ نَفِيسٌ تُرْهِقُ صَاحِبَهُ كُلْفَةُ صِيَانَتِهِ وَإِعَالَتِهِ، وَتَكُونُ نَفَقَتُهُ أَكْبَرَ مِنْ مَنْفَعَتِهِ."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تُعَدُّ بَعْضُ القُصُورِ التَّارِيخِيَّةِ فِيلًا أَبْيَضَ لِأَصْحَابِهَا بِسَبَبِ مَصَارِيفِ التَّرْمِيمِ البَاهِظَةِ."}

