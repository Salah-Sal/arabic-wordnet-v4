stage1_review:
  assessment:
    concerns:
      - "التعريف يصف ظاهرة فيزيائية أو كمية متغيرة (تزيد وتنقص بالتناوب)، بينما إحدى اللمات الموجودة (خفقان) تميل غالباً للدلالة الطبية والفسيولوجية (خفقان القلب) في هذا السياق، ولا تعبر عن التغير الدوري في كمية ما."
    observations: "المفهوم يعبر عن ظاهرة التذبذب أو النبض في الكميات الفيزيائية (Pulsation). استخدام مصطلحات مثل 'نبض' أو 'نبضان' دقيق علمياً ويتوافق مع الاستخدام التقني."
  blind_candidates:
    - lemma: "نَبَضَان"
      generation_method: ishtiqaq
      justification: "مصدر يدل على الحركة المتكررة والاضطراب، ويستخدم في السياقات الفيزيائية للدلالة على التغير الدوري للكميات."
    - lemma: "تَذَبْذُب"
      generation_method: ishtiqaq
      justification: "يدل على التغير الدوري والتردد بين قيمتين، وهو مطابق لتعريف الظاهرة التي تزيد وتنقص."
    - lemma: "نَبْضَة"
      generation_method: ishtiqaq
      justification: "اسم مرة من نبض، يعبر عن الدفعة الواحدة من الظاهرة المتكررة."
    - lemma: "ارْتِجَاف"
      generation_method: majaz
      justification: "يدل على الحركة السريعة المتكررة واستخدم مجازاً في بعض السياقات العلمية."

stage2_evidence:
  per_lemma:
    - lemma: "خفقان"
      contradicts:
        - text: "زيادة مؤقتة في سرعة نبضات القلب لانفعال أو إجهاد أو مرض"
          source: "المعجم الوسيط"
          conflict: "يقتصر على المعنى الطبي والفسيولوجي ولا يعبر عن التغير الدوري في كمية فيزيائية كما ينص التعريف."
    - lemma: "نبض"
      confirm:
        - text: "نبض التيار: current pulsation"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
      expands:
        - text: "الشيءُ نَبْضًا, ونَبَضَانًا: تحرَّك في مكانه ... نبض البرق: لَمَع لمعانًا خفِيًّا الماءُ ونحوه: علا وسال"
          source: "المعجم الوسيط"
          addition: "يدل على الحركة والظهور والخفاء الدوري، مما يتناسب مع التغير في الكمية."
    - lemma: "نَبَضَان"
      confirm:
        - text: "نَبَضَان: pulsation"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "نَبَضَ العِرْقُ يَنْبِضُ نَبْضاً ونَبَضَاناً، مُحَرَّكَةً، أَي تحرَّكَ وضَرَبَ"
          source: "تاج العروس لمرتضى الزبيدي"
          addition: "يؤكد أن النبضان مرادف للنبض في الدلالة على الحركة الدورية."
    - lemma: "تَذَبْذُب"
      confirm:
        - text: "(فى الفيزياء) oscillation: تَغَيُّرٌ دَوْرِيٌّ فى طاقةِ نظامٍ ميكانيكِيٍّ أو كهربائيٍّ أو ذَرِّيٍّ"
          source: "المعجم الكبير"
      expands:
        - text: "(تذبذب) تحرّك واضطرب"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يعبر بدقة عن التغير الدوري صعوداً وهبوطاً."
    - lemma: "نَبْضَة"
      contradicts:
        - text: "اسم مرَّة من نبَضَ: ضَرْبة ... موجة واحدة."
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "يدل على حدث مفرد (نبضة واحدة) بينما المجموعة الترادفية تشير إلى الظاهرة المتكررة (pulsation)."
    - lemma: "ارْتِجَاف"
      contradicts:
        - text: "تغيُّر الإشارة مع الزمن عند استقبالها من قبل الرادار، وهذا التغير مسبب من اضطراب جو الأرض"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية"
          conflict: "يشير إلى تشوه واضطراب الإشارة (jitter أو fluctuation) وليس التغير الدوري المنتظم (pulsation)."

stage3_analysis:
  per_lemma:
    - lemma: "خفقان"
      decision: removed
      decision_reason: "الكلمة تستخدم بشكل رئيسي في السياق الطبي للإشارة إلى اضطراب وتسارع ضربات القلب (palpitation)، ولا تستخدم لوصف ظاهرة التغير الدوري في الكميات الفيزيائية."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "نبض"
      decision: confirmed
      decision_reason: "تستخدم الكلمة في المعاجم العلمية الحديثة للتعبير عن التغير الدوري (pulsation) كما في 'نبض التيار'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَبْض"

    - lemma: "نَبَضَان"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر معتمد في المعاجم العلمية كمقابل دقيق للمصطلح الإنجليزي (pulsation)، ويدل بصيغته (فَعَلان) على الحركة الدورية المستمرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَبَضَان", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَذَبْذُب"
      source: stage1
      decision: confirmed
      decision_reason: "يتطابق دلالياً مع تعريف المجموعة بكونه تغيراً دورياً متناوباً في الكميات (oscillation/pulsation)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَذَبْذُب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "نَبْضَة"
      source: stage1
      decision: removed
      decision_reason: "اسم مرة يدل على وقوع الحدث مرة واحدة (pulse)، بينما الظاهرة المستمرة تتطلب مصدراً كـ 'نبض' أو 'نبضان' (pulsation)."
      evidence_assessment:
        case: contradicts_only

    - lemma: "ارْتِجَاف"
      source: stage1
      decision: removed
      decision_reason: "يدل على الاضطراب غير المنتظم (مثل الرجفة أو الارتعاش)، ولا يحمل معنى التغير الدوري المنتظم للكميات."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "ظاهرة تتكرر بشكل دوري وتزيد وتنقص كمية ما بالتناوب"
    assessment:
      decision: revise
      reason: "التعريف الحالي صياغته ركيكة ('تزيد وتنقص كمية ما'). تم تحسين الصياغة لتكون أدق لغوياً وعلمياً."
    authored:
      - type: terminological
        text: "ظاهرة دورية متكررة تتناوب فيها كمية معينة بين الزيادة والنقصان."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "ظاهرة دورية متكررة تتناوب فيها كمية معينة بين الزيادة والنقصان."}
  examples:
    per_lemma:
      - lemma: "نَبْض"
        examples:
          - text: "يؤدي نبض التيار الكهربائي في الدائرة إلى إحداث تداخلات مع الإشارات اللاسلكية."
            type: usage
      - lemma: "نَبَضَان"
        examples:
          - text: "سجلت أجهزة الرصد نبضان الإشعاع المنبعث من النجم البعيد."
            type: usage
      - lemma: "تَذَبْذُب"
        examples:
          - text: "تدرس الديناميكا الحرارية تذبذب الضغط داخل الأسطوانة المغلقة."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يؤدي نبض التيار الكهربائي في الدائرة إلى إحداث تداخلات مع الإشارات اللاسلكية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "سجلت أجهزة الرصد نبضان الإشعاع المنبعث من النجم البعيد."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تدرس الديناميكا الحرارية تذبذب الضغط داخل الأسطوانة المغلقة."}

