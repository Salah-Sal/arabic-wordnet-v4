      maqayis_quote: "«الخاء والطاء والحرف المعتل والمهموز، يدل على تعدي الشيء، والذهاب عنه... والخطاء من هذا ; لأنه مجاوزة حد الصواب.»"
    - lemma: "غَلَط"
