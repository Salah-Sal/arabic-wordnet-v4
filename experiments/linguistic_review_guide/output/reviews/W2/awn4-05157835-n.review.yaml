# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-05157835-n  |  ILI: i64048  |  POS: n
# Lemmas: عَدَم جَدْوَى ، لَا نَفْع
# Definition (EN): the quality of having no practical use
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # التقييم الأوّلي (بعد الاطّلاع على synset_info الكامل)
  assessment:
    concerns:
      - "لَا نَفْع ليست وحدة معجمية مستقرة؛ هي تركيب نفي حر يفشل اختبار الاستبدال (يُبدَّل بـ«لا فائدة»، «لا جدوى» بنفس القالب النحوي)"
      - "عَدَم جَدْوَى مكتوبة بدون ال على جدوى؛ الصيغة المعيارية كاسم لصفة هي «عَدَمُ الجَدوى» بالتعريف"
      - "غياب أي مصطلح أحادي الكلمة عريق في المجموعة — المعاجم تُوثِّق «العَبَث» كمقابل مباشر لـinutility/uselessness ولم يُضمَّن"
      - "التعريف الحالي «صفة عدم وجود فائدة عملية» ركيك الصياغة وترجمة حرفية مباشرة من الإنجليزية"
    observations: >
      المجموعة الترادفية تُعبِّر عن مفهوم «انعدام الجدوى العملية» بوصفه خاصِّيَّةً في الأشياء والأفعال.
      العربية تُعبِّر عن هذا المفهوم بثلاثة مسالك: (أ) المصطلح الاسمي المفرد «العَبَث» الذي يجمع اللعب
      والاشتغال بما لا ينفع؛ (ب) المركب الإضافي «عَدَم الجَدوى»؛ (ج) الصفة المشبهة «عقيم/عديم الجدوى».
      اللمّة «لَا نَفْع» المُدرَجة حالياً تركيبٌ نفيٌّ حر لا يرقى إلى مستوى المصطلح.
      التعريف الحالي يحتاج إعادة صياغة بأسلوب المعجم العربي.

  # المرشحات المولَّدة أعمى (قبل رؤية اللمّات الموجودة)
  blind_candidates:
    - lemma: "العُقْم"
      generation_method: majaz
      justification: >
        العُقْم في أصله انعدام القدرة على الإنجاب والإنتاج؛ والمجاز ظاهر في «ريح عقيم» (لا تُلقِح)
        و«مسعى عقيم» (لا يُثمر). يُمتدّ هذا المجاز ليُغطي صفة انعدام الجدوى العملية
        بوصف الشيء الذي لا ينتج نفعاً. والمجاز حيٌّ في الاستعمال.

    - lemma: "اللَّاجَدَوِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (جدو/جدي) بإضافة لا النافية + ياء النسبة + تاء المصدر الصناعي، على نمط
        «اللامعقولية»، «اللامبالاة». يُعطي مصدراً صناعياً يُسمِّي الخاصِّيَّة لا مجرد نفيها.
        الوزن: لا + فَعَل + يَّة (صيغة منتجة في العربية المعاصرة).

    - lemma: "انعدامُ الجَدوى"
      generation_method: tarkib
      justification: >
        مركب إضافي جامد: انعدام (المصدر من عدم، على وزن انفعال) + الجدوى (النفع والفائدة).
        أقوى دلالةً من «عدم الجدوى» لأن انعداماً يفيد الزوال التامّ. الوحدة ثابتة في الخطاب
        الأكاديمي والنقدي العربي ولا يُجيز الاستبدال بين مكوّنيها بمرادفَيْهما بلا تغيير في المستوى.

    - lemma: "العَقَامَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (عقم) على وزن فَعَالَة (الوزن الدالّ على خاصِّيَّة مجردة كالشجاعة والكرامة).
        يُعطي اسم خاصِّيَّة مجردة بمعنى «كون الشيء عقيماً لا يُنتج نفعاً»، على نمط «الفطنة»
        و«النجابة» من الجذور المزيدة. الصيغة منتجة صرفياً.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة (6 استعلامات):
#  Q1 — مطابقة دفعية لجميع اللمّات والمرشحات (headword_norm IN ...)
#  Q2 — جسر إنجليزي: inutility, uselessness, unusefulness, futility, useless
#  Q3 — بحث FTS عربي: جدوى, انعدام الجدوى, عدم الجدوى, لا جدوى, عديم الفائدة, بلا فائدة
#  Q4 — تحقق من مرشحات إضافية: عبث, لاجدوي, لاجدوية, لانفعية
#  Q5 — ابن فارس (id=151): جذور عقم, عدم, نفع, عبث, بطل
#  Q6 — ابن فارس: جذور جدو, جدي, جده
stage2_evidence:

  per_lemma:

    - lemma: "عَدَم جَدْوَى"
      expands:
        - text: >
            «(1) عَبَث؛ لاجَدْوَى (2) شيء تافه.» — ترجمة futility
          source: "المورد الحديث (2008) — مسرد ArabTerm"
          addition: >
            يُثبت أن «لاجَدْوَى» مكوِّنٌ في منظومة الترجمة العربية لـfutility؛ يُدعَم به
            المركب «عدم الجدوى» كوحدة دلالية قائمة.
        - text: >
            «عقيم؛ عديم الجدوَى؛ غير ذي غَناء.» — ترجمة useless
          source: "المورد الحديث (2008) — مسرد ArabTerm"
          addition: >
            «عديم الجدوى» مُقابِلٌ متداوَلٌ لـuseless، مما يُثبِّت «الجدوى» محوراً
            للمفهوم ويُسنِد استخدام «عدم الجدوى» كمصطلح.

    - lemma: "لَا نَفْع"
      evidence_status: "no_material_found"

    - lemma: "العُقْم"
      contradicts:
        - text: >
            «العُقْمُ، بالضم: هَزْمَةٌ تَقَعُ في الرَّحِمِ فلا تَقْبَلُ الوَلَدَ»
          source: "القاموس المحيط للفيروزآبادي"
          conflict: >
            المعنى المحوري هو العقم البيولوجي (انعدام الإنجاب)، وهو بعيد عن
            «صفة عدم وجود فائدة عملية».
        - text: >
            «(العقم) حَالَة تحول دون التناسل فِي الذّكر وَالْأُنْثَى (مج)»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: >
            المعجم الوسيط (المرجع المعياري) يحصر العقم في سياق التناسل البيولوجي.
        - text: >
            «حالةٌ تحولُ دون التناسل فى الذكر والأنثى. (مج)»
          source: "المعجم الوسيط — مصدر OCR"
          conflict: >
            لا إشارة إلى معنى «عدم الجدوى العملية» كمدخل مستقل.
      expands:
        - text: >
            «والمُلْكُ عَقيمٌ، أي: لا يَنْفَعُ فيه نَسَبٌ»؛ «ورِيحٌ عَقيمٌ: غيرُ لاقِحٍ»
          source: "القاموس المحيط للفيروزآبادي"
          addition: >
            يُثبِت أن المجاز الصفي (عقيم = لا ينفع) موجود في العربية الكلاسيكية، لكنه
            صفة لا اسم خاصِّيَّة مجردة.
        - text: >
            «الْعَيْنُ وَالْقَافُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى غُمُوضٍ وَضِيقٍ وَشِدَّةٍ.
            مِنْ ذَلِكَ قَوْلُهُمْ حَرْبٌ عَقَامٌ وَعُقَامٌ: لَا يَلْوِي فِيهَا أَحَدٌ عَلَى أَحَدٍ
            لِشِدَّتِهَا. وَدَاءٌ عَُقَامٌ: لَا يُبْرَأُ مِنْهُ. وَمِنَ الْبَابِ عَقِمَتِ الرَّحِمُ عُقْمًا»
          source: "مقاييس اللغة لابن فارس (entry_id: 987777)"
          addition: >
            ابن فارس يردّ الأصل إلى الغموض والضيق والشدة، ويذكر العقم الرحمي مشتقاً منه؛
            لا أصل معجمي يصله مباشرةً بصفة عدم الجدوى العملية.

    - lemma: "اللَّاجَدَوِيَّة"
      evidence_status: "no_material_found"

    - lemma: "انعدامُ الجَدوى"
      evidence_status: "no_material_found"

    - lemma: "العَقَامَة"
      contradicts:
        - text: >
            «خلو الضمادات الطبية من الميكروبات والكائنات الحية بفعل تأثير الحرارة والمُطَهِّرات.»
            translation_en: sterility
          source: "مسرد صناعة النسيج — مصطلحات ALECSO (ArabTerm)"
          conflict: >
            عقامة في المعاجم التقنية = التعقيم الطبي/الصناعي (إبادة الجراثيم)، لا صفة
            عدم الجدوى. المعنى متعارض كلياً مع المجموعة.


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة الأولى ──
    - lemma: "عَدَم جَدْوَى"
      decision: confirmed
      decision_reason: >
        المركب الإضافي «عَدَم الجَدوى» وحدةٌ اصطلاحية راسخة في العربية المعاصرة تُستخدم
        في الخطاب الأكاديمي والإعلامي والقانوني للدلالة على انعدام النفع العملي. وإن لم
        يُسجَّل مدخلاً معجمياً مستقلاً، فإن المكوّنَين (عدم + الجدوى) موثَّقان توثيقاً
        جيداً، والمركب مُستخدَم كوحدة ثابتة لا تقبل التفكيك في السياق. يستلزم تعديل الصيغة
        لإضافة التعريف على «جدوى».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الجانب الغائيّ (absence of utility/purpose)؛ يُشير إلى انعدام الأثر النافع
        من حيث التحقق الفعلي. أقلّ إيحاءً بالسخرية أو الاستهجان مقارنةً بـ«عبث»، وأكثر
        رسميةً وموضوعيةً في التقييم. يُناسِب خاصَّة سياقات التقييم العلمي والإداري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ الجَدوى"

    # ── اللمّة الموجودة الثانية ──
    - lemma: "لَا نَفْع"
      decision: removed
      decision_reason: >
        «لا نفع» تركيب نفيٍّ حرٌّ يفشل اختبار السكّ المعجمي: يمكن الإبدال الفوري بـ«لا فائدة»
        أو «لا جدوى» بالقالب نفسه دون تغيير في الدلالة، مما يُثبت أنه عبارة وصفية لا مصطلح
        ثابت. لم يُعثر له على توثيق معجمي كمدخل مستقل. بنيته النحوية (لا النافية + اسم نكرة)
        تجعله في رتبة الجملة الوصفية لا الاسم الدالّ على خاصِّيَّة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١ — العُقْم ──
    - lemma: "العُقْم"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكبرى (الوسيط، القاموس المحيط، مقاييس اللغة) تُجمِع على حصر العُقْم في
        معنى انعدام الإنجاب والتناسل البيولوجي. المجاز الثانوي (عقيم = لا يُثمر) موجود
        في الصفة المشبهة «عقيم» لا في المصدر المجرد «عُقْم». لا يصلح مصطلحاً لـ«صفة
        عدم وجود فائدة عملية» بوصفه خاصِّيَّةً عامة للأشياء، لاحتمال التباس المعنى الطبي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ — اللَّاجَدَوِيَّة ──
    - lemma: "اللَّاجَدَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد معجمية على هذه الصيغة في المعاجم المُتاحة. الاشتقاق سليم صرفياً
        على نمط «اللامعقولية» و«اللامبالاة»، لكن المصطلح لم يُسكَّ بعد في المعاجم المعتمدة
        ولم يُستخدَم استخداماً اصطلاحياً مُوثَّقاً يُسوِّغ إدراجه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ — انعدامُ الجَدوى ──
    - lemma: "انعدامُ الجَدوى"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على المركب مدخلاً معجمياً مستقلاً. وإن كان قوياً دلالياً، فإن وجود
        «عَدَمُ الجَدوى» المُقرَّر (بعد تعديله) يُغني عنه ويتجنّب تضخيم المجموعة بمرادفَيْن
        متشابهَين في البنية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١ — العَقَامَة ──
    - lemma: "العَقَامَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم التقنية المُتاحة (ALECSO) توثّق «عقامة» بمعنى التعقيم الطبي وخلوّ الضمادات
        من الجراثيم — معنى متعارض كلياً مع المجموعة. لا يصلح استخدامه للدلالة على
        «صفة عدم وجود فائدة عملية» خطراً من الالتباس بالمصطلح الطبي الراسخ.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "صفة عدم وجود فائدة عملية"
    assessment:
      decision: revise
      reason: >
        الصياغة الحالية ترجمة حرفية ركيكة من الإنجليزية ("the quality of having no
        practical use" → "صفة عدم وجود فائدة عملية"). التعبير «عدم وجود فائدة» ثقيل
        ويمكن صياغته بأسلوب المعجم الوسيط بأسلس. كما أن الكلمة «صفة» وحدها غير كافية
        لتمييز المجموعة عن الصفة الوصفية؛ الأنسب «خاصِّيَّة» بوصفها مصطلحاً معجمياً.
    authored:
      - type: terminological
        text: "خاصِّيَّةٌ جَوهريَّةٌ في الشَّيءِ أو الفعلِ تدلُّ على انعدامِ نفعِهِ العملي وعدمِ إجدائِهِ شيئاً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "انعدامُ النَّفعِ العمليِّ في الشَّيءِ؛ كَوْنُهُ عديمَ الجَدوى."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05157835-n"
          definition_index: 0
          text: "خاصِّيَّةٌ جَوهريَّةٌ في الشَّيءِ أو الفعلِ تدلُّ على انعدامِ نفعِهِ العملي وعدمِ إجدائِهِ شيئاً."
      - command: add_definition
