# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:

  per_entry:
    - lemma: "عَدَمُ الجَدوى"
      entry_id: "{auto}"
      roots:
        - word: "عَدَم"
          root: "عدم"
          maqayis_quote: >
            «الْعَيْنُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى فُقْدَانِ الشَّيْءِ
            وَذَهَابِهِ. مِنْ ذَلِكَ الْعَدَمُ. وَعَدِمَ فُلَانٌ الشَّيْءَ، إِذَا فَقَدَهُ.»
        - word: "جَدوى"
          root: "جدو"
          maqayis_quote: "لم يُعثر على مدخل للجذر (جدو/جدي) في مقاييس اللغة لابن فارس ضمن البيانات المتاحة."

  per_sense:
    - lemma: "عَدَمُ الجَدوى"
      sense_id: "{auto}"
      nuance: >
        يُشير إلى الانعدام الموضوعي للنفع العملي بوصفه خاصِّيَّةً في الشيء ذاته، بمعزل
