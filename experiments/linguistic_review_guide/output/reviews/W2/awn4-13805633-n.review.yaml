#   Q6: إضافية — تناف/التناف/تعارض/تناقض كمرشحات
stage2_evidence:
  per_lemma:

    - lemma: "تَضَادّ"
      confirm:
        - text: "«تضاد — contrariety»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm) — المجال: الفلسفة وعلم النفس"
        - text: "«تضادَّ الشَّيئان, أو الأمران: اختلفا»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«التّضاد... يطلق على معان. منها التقابل والتنافي في الجملة، وفي بعض الأحوال... ومنها كون المعنيين بحيث يمتنع لذاتيهما اجتماعهما في محلّ واحد من جهة واحدة، والمعنيان يسمّيان بالمتضادين والضّدين، وهو من مصطلحات المتكلّمين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت١١٥٨هـ/١٧٤٥م)"
      expands:
        - text: "«تضاد — علاقة بين مفردتين تتسم باختلافهما المطلق في المعنى»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يُظهر انتقال المصطلح من المنطق الرسمي إلى علم اللغة بدلالة أعمّ (اختلاف مطلق في المعنى)"
        - text: "«تضاد — وجه بلاغي يقوم على ائتلاف أو اجتماع كلمتين متضادتين في الظاهر»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يُثبت استعمال المصطلح في البلاغة بمعنى الطباق، وهو من المعاني التي رصدها التهانوي"
        - text: "«تضادّ — [في مصطلحات الفيزياء العامة والنووية]»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "انتشار المصطلح في حقول علمية متعددة يدلّ على قوة تداوله وثباته في المعجمية العربية الحديثة"

    - lemma: "تَضَادٌّ"
      confirm:
        - text: "«تضاد — contrariety»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"

    - lemma: "تَنَافٍ"
      evidence_status: "no_material_found"

    - lemma: "تَبَايُنٌ"
      contradicts:
        - text: "«التباين: ما إذا نسب أحد الشيئين إلى الآخر لم يصدق أحدهما على شيء مما صدق عليه الآخر، فإن لم يصدقا على شيء أصلاً فبينهما تباين كلي كالإنسان والفرس، ومرجعهما إلى سالبتين كليتين، وإن صدقا في الجملة فبينهما تباين جزئي كالحيوان والأبيض»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت١٠٣١هـ)"
          conflict: "التباين في المنطق العربي الكلاسيكي يعني الافتراق الكلي أو الجزئي بين المفهومين (أي: لا يصدق أحدهما على ما يصدق عليه الآخر)، وهو أشمل وأصعب مطابقةً للمفهوم الإنجليزي (contrary) الذي يخص القضايا لا المفاهيم"
        - text: "«التّباين... يرادف المباينة عند المحاسبين وكذا عند المنطقيين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت١١٥٨هـ)"
          conflict: "المصادر الكلاسيكية تعرّفه بوصفه تباين كلي أو جزئي بين الكليات، لا بوصفه علاقة بين القضايا بمعنى الـ contrary الأرسطي"

    - lemma: "تَعَارُضٌ"
      contradicts:
        - text: "«التعارض... هو كون الدليلين بحيث يقتضي أحدهما ثبوت أمر والآخر انتفاءه في محلّ واحد في زمان واحد بشرط تساويهما في القوة... ثم التعارض لا يقع بين القطعيين لامتناع وقوع المتنافيين، ولا يتصوّر الترجيح لأنّه فرع التفاوت في احتمال النقيض، فلا يكون إلّا بين ظنيين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت١١٥٨هـ)"
          conflict: "التعارض مصطلح أصولي فقهي يخص تعارض الأدلة الظنية المتساوية في القوة، لا علاقةً منطقيةً بين القضايا بالمعنى الأرسطي؛ فضلاً عن أن التعارض الأصولي لا يُشترط فيه مجرد التنافي"


