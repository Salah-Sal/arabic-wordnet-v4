# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية (تَضَادّ) تفتقر إلى تشكيل كامل؛ الصيغة الصحيحة هي تَضَادٌّ بضمة منوَّنة على الدال المشددة"
      - "التعريف الحالي يستخدم (متضادتين) في تعريف (تضادّ) مما يُوقع في الدَّوَر الاصطلاحي"
      - "صياغة التعريف قريبة من الترجمة الحرفية للإنجليزية وليست بأسلوب المعجم المتخصص"
    observations: "المفهوم المعجمي هو التضادّ المنطقي الأرسطي (Contrary Opposition): علاقة بين قضيتين يَمتنع فيه اجتماعهما في الصدق ويَجوز اجتماعهما في الكذب، وهو يفترق عن التناقض (Contradiction) الذي يَمتنع فيه الاجتماع صدقاً وكذباً على حدٍّ سواء. اللغة العربية تمتلك جذراً أصيلاً (ض-د-د) وصيغةً مصدريةً مطّردةً (تَفَاعُل) لهذا المفهوم المنطقي، مما يجعل المجموعة ذات تغطية طبيعية."

  blind_candidates:
    - lemma: "تَضَادٌّ"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تَضَادَّ يَتَضَادُّ من جذر (ض-د-د) على وزن تَفَاعُل، الدال على المشاركة المتبادلة؛ يفيد كون القضيتين تتقابل كل منهما الأخرى تقابلَ التضاد لا تقابلَ التناقض."
    - lemma: "تَنَافٍ"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تَنَافَى يَتَنَافَى من جذر (ن-ف-ي) على وزن تَفَاعُل، يفيد التنافي المتبادل وعدم إمكان الاجتماع؛ وقد وظّفه المناطقة العرب للتعبير عن عدم إمكان الاجتماع في الصدق."
    - lemma: "تَبَايُنٌ"
      generation_method: ishtiqaq
      justification: "مصدر تَبَايَنَ يَتَبَايَنُ من جذر (ب-ي-ن) على وزن تَفَاعُل، يُستعمل في المنطق العربي الكلاسيكي للدلالة على التقابل والافتراق بين القضايا أو المفاهيم."
    - lemma: "تَعَارُضٌ"
      generation_method: ishtiqaq
      justification: "مصدر تَعَارَضَ يَتَعَارَضُ من جذر (ع-ر-ض) على وزن تَفَاعُل، يدلّ على التقابل والتواجه المتبادل؛ يُستعمل في السياق المنطقي والأصولي للتعبير عن تعارض القضايا والحجج."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
