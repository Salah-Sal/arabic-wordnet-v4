# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'تعظم' مجرَّدة من التشكيل الكامل — الصواب: 'تَعَظُّم'"
      - "اللمّة 'تكون العظم' مجرَّدة من التشكيل — الصواب: 'تَكَوُّنُ الْعَظْمِ'"
      - "التعريف الحالي ترجمة حرفية عن الإنجليزية ولا يُراعي أسلوب التعريف الطبي المعجمي العربي"
      - "المجموعة خالية تماماً من الأمثلة الاستعمالية"
    observations: >
      المجموعة تُمثِّل مفهوماً طبياً تشريحياً دقيقاً هو 'التَّعَظُّم'، وهو العملية البيولوجية التي
      تتشكَّل فيها العظامُ إما بتحوُّل الغضروف الهيالي إلى نسيج عظمي (تعظُّم داخل الغضروف)
      وإما بتعظُّم النسيج الضامّ الغشائي مباشرةً (تعظُّم داخل الغشاء). اللمَّتان الموجودتان
      موثَّقتان في المعاجم الطبية الموحَّدة العربية وصحيحتان اشتقاقاً ومعنىً، غير أن كلتيهما
      تفتقران إلى التشكيل الكامل. كذلك يحتاج التعريف إلى إعادة صياغة بأسلوب المعجم الطبي
      العربي بدلاً من النقل الحرفي عن الإنجليزية.

  blind_candidates:
    - lemma: "تَعَظُّم"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفَعُّل من الجذر (ع-ظ-م)؛ والوزن يُفيد التحوُّل التدريجي والاستحالة
        التلقائية، مما يناسب تماماً دلالة تشكُّل العظام من الأنسجة الرخوة. أصل الجذر
        يربط بين معنيَيْ 'القوة والكِبَر' و'العَظْم' الذي سُمِّي لقوَّته وشدَّته.
    - lemma: "تَكَوُّنُ الْعِظَامِ"
      generation_method: tarkib
      justification: >
        مركب إضافي يجمع 'تَكَوُّن' (مصدر الفعل تَكَوَّنَ الدالّ على الحدوث والنشأة)
        + 'الْعِظَام' (جمع تكسير لـ'عَظْم')، فيُعطي معنى 'نشأة العظام وتشكُّلها التطوري'
        بصياغة تركيبية مباشرة واضحة.
    - lemma: "تَكَلُّس"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفَعُّل من الجذر (ك-ل-س)؛ وصلة المعنى بالتحجُّر والتصلُّب الناتج
        عن ترسُّب أملاح الكالسيوم — مسارٌ وثيق الصلة بتشكُّل الأنسجة الصلبة كالعظام
        وقد يُغطّي جزءاً من الدلالة المطلوبة.
    - lemma: "اسْتِحَالَةٌ عَظْمِيَّةٌ"
      generation_method: tarkib
      justification: >
        مركب وصفي يصف العملية بوصفها 'اسْتِحَالَةً' (أي تحوُّلاً جوهرياً في طبيعة النسيج
        وماهيَّته) موصوفةً بـ'عَظْمِيَّة' لتحديد المصير الذي تتحوَّل إليه الأنسجة،
        مما يُعبِّر عن الجانب النوعي للعملية.


