# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تعظم"
      decision: confirmed
      decision_reason: >
        موثَّقٌ في سبعة مصادر معجمية حديثة بوصفه المقابل الرسمي لـ ossification وbone formation
        وosteosis. الجذر (ع-ظ-م) عربي أصيل، والوزن تَفَعُّل ملائم للعملية البيولوجية التلقائية.
        يجتاز بوابات الجودة الستة: الاطِّراد (مُعتمد في معاجم موحَّدة متعددة)، يُسر التداول
        (مفردة واحدة)، الملاءمة (دقيق في دلالته)، إيثار التراثي (جذر قرآني)، إيثار العربي،
        الاشتقاقية. يحتاج فقط إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        لفظٌ اشتقاقيٌّ مُفرد يُعبِّر عن العملية باعتبارها تحوُّلاً تلقائياً وتدريجياً للنسيج
        نحو البنية العظمية؛ أكثر إيجازاً وأوسع انتشاراً في التداول الطبي الموحَّد، ويُقابل
        ossification بمعناه الشامل الذي يضمّ كلا المسارين (الغضروفي الداخلي والغشائي الداخلي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَظُّم"

    - lemma: "تكون العظم"
      decision: confirmed
      decision_reason: >
        موثَّقٌ في المعجم الطبي الموحد (2009) بوصفه المقابل الرسمي لـ osteogenesis وosteogeny،
        وهو مركب إضافي ثابت مسجَّل في المعجمية الطبية العربية ويُشكِّل قاعدةً إنتاجية
        لمصطلحات تخصصية أدق كـ'تكوُّن العظم الناقص' (osteogenesis imperfecta).
        يجتاز اختبار السكّ: لا يمكن إبدال 'العظم' بمكوّن آخر وإبقاء المصطلح في نفس الحقل الدلالي.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        مركب إضافي يُقابل تحديداً مصطلح osteogenesis بتركيزه على الجانب التكويني الإنشائي
        للعملية؛ يُستخدم في سياقات علم الأجنة والتشريح لوصف مراحل نشأة الهيكل العظمي
        وتطوره التدريجي، ويُوحي بالمسار المتسلسل أكثر من التحوُّل النسيجي اللحظي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَوُّنُ الْعَظْمِ"

    - lemma: "تَعَظُّم"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق مباشر للمَّة الموجودة 'تعظم' التي تمَّ تأكيدها وإضافة تشكيلها الكامل.
        لا حاجة لأي إجراء إضافي.

    - lemma: "تَكَوُّنُ الْعِظَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        تتقاطع مع اللمَّة الموجودة 'تكون العظم' — الفارق مجرد صيغة الجمع (الْعِظَام)
        مقابل المفرد (الْعَظْم). المصطلح الطبي المُعتمد في المعجم الطبي الموحد يستخدم
        المفرد 'تَكَوُّنُ الْعَظْمِ'، وهو الشكل الأكثر ضبطاً وانتشاراً في المعجمية الطبية.

    - lemma: "تَكَلُّس"
      source: stage1
      decision: removed
      decision_reason: >
        يدلُّ على التَّكَلُّس (calcification) وهو مسارٌ بيولوجيٌّ مختلف ومتمايز؛ يُشير
        إلى ترسُّب أملاح الكالسيوم غير الذائبة في أنسجة ليست عظماً بطبيعتها (كالغضاريف
        والأوتار)، في حين أن التَّعَظُّم يُشير إلى تشكُّل نسيج عظمي حقيقي متكامل. إدراجه
        في هذه المجموعة يُوقع في التباس مفاهيمي علمي مضرّ بدقة الشبكة الدلالية.

    - lemma: "اسْتِحَالَةٌ عَظْمِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوثَّق معجمياً كمصطلح مسكوك ثابت في أي مصدر معجمي. ولا يجتاز اختبار السكّ:
        يمكن إبدال 'عَظْمِيَّة' بـ'غضروفية' أو 'نسيجية' مع بقاء العبارة وصفاً مقبولاً
        دلالياً، مما يكشف أنها عبارة وصفية حرة لا وحدة معجمية مستقرة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "العملية التطورية لتكوين العظام"
    assessment:
      decision: revise
      reason: >
        التعريف ترجمة حرفية عن الإنجليزية ('the developmental process of bone formation')
        يفتقر إلى الجنس القريب التخصصي والفصل النوعي الكافي. كلمة 'العملية' مُبهمة لا
        تُميِّز هذا المسار عن غيره من العمليات البيولوجية، كما أن التعريف لا يُشير إلى
        آلية التحوُّل (تحوُّل الغضروف أو النسيج الضامّ إلى عظم). المعاجم الطبية العربية
        الموثَّقة تُعرِّفه بصياغة أدق وأوضح.
    authored:
      - type: terminological
        text: "مسارٌ بيولوجيٌّ تطوريٌّ يتشكَّل فيه النسيجُ العظميُّ بتحوُّلِ الغضروفِ أو النسيجِ الضامِّ إلى عَظْم"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          يشمل التَّعَظُّمُ مسارَيْن رئيسيَّيْن: التَّعَظُّمُ الغضروفيُّ الداخليُّ حيث يُستبدَل
          الغضروفُ الهيالي تدريجياً بنسيجٍ عظميّ عبر نشاط الخلايا الهادمة والبانية؛ والتَّعَظُّمُ
          الغشائيُّ الداخليُّ حيث تتمايز الخلايا اللحمية المتوسطية مباشرةً إلى بانيات العظم
