# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عرض"
      decision: confirmed
      decision_reason: >
        الأدلة المعجمية تؤيد «عَرْض» بمعنى الإظهار والإبراز أمام الجمهور تأييداً قاطعاً؛
        والمعجمية الإعلامية الحديثة رسّخته في تراكيب «عرض خاص»، «أول عرض»، «مدة العرض».
        وإن كانت «عرض» وحدها متعددة المعاني، فإن السياق السينمائي يُقيّدها دلالياً.
        ضرورة إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «عَرْضٌ» ينظر إلى الحدث من زاوية الفعل المجرد للإظهار دون تخصيص الوسيط
        (سينما/تلفزيون/مهرجان)، وهو أعم من «عَرْضٌ سِينِمَائِيّ»، ويُستخدم حين يكون
        السياق كافياً للتمييز: «العرض ليلة الجمعة»، «عرض خاص».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرْضٌ"

    - lemma: "عرض سينمائي"
      decision: confirmed
      decision_reason: >
        الأدلة تُثبّت المصطلح المركب الوصفي «عرض سينمائي» — المورد الحديث يُورد «عرض لفيلم
        سينمائي» مقابل «screening»، والمسرد الإعلامي يُورد «عرض خاص»، «عرض للعموم»، «قاعة
        العرض» كلها في سياق السينما. المركب الوصفي اجتاز اختبار التثبيت المعجمي: هو وحدة
        اصطلاحية ثابتة لا يمكن إبدال «سينمائي» بـ«مسرحي» والاحتفاظ بالدلالة ذاتها.
        يحتاج التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «عَرْضٌ سِينِمَائِيّ» يُضيف قيد التخصيص السينمائي إلى «عَرْضٌ» المجردة،
        فيُميّزه عن العروض التجارية والمسرحية والتلفزيونية؛ وهو الأنسب حين يُذكر المفهوم
        منعزلاً عن سياق يُوضحه: «عرض سينمائي في مهرجان برلين».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرْضٌ سِينِمَائِيّ"

    - lemma: "إسقاط"
      source: stage1
      decision: removed
      decision_reason: >
        جميع الأدلة المعجمية تُحيل «إسقاط» إلى حقول دلالية مغايرة (الهندسة المدنية،
        الإسقاط النفسي، علم الوراثة، المناخ)، ولا أثر لاستخدامه بمعنى عرض الفيلم على
        الشاشة في المعجمية العربية. وعلى الرغم من استخدام «جهاز الإسقاط» للبروجيكتور،
        فإن المصدر «إسقاط» لا يُثبت كمصطلح مستقل للعرض السينمائي؛ وهو يخفق في
        اختبار التثبيت المعجمي لهذه الدلالة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مشاهدة"
      source: stage1
      decision: confirmed
      decision_reason: >
        الأدلة تُؤكد «مُشَاهَدَة» بمعنى viewing في المعجمية الإعلامية الحديثة تأكيداً
        مباشراً («مشاهدة عمل فيديو للترفيه أو التقييم» = viewing). ويُقابل هذا المصطلحُ
        اللمّةَ الإنجليزية «viewing» التي تفتقدها المجموعة حالياً. الجذر ش-ه-د يُجيز
        الاشتقاق معجمياً (مُشَاهَدَة = وزن مُفَاعَلَة صريح). اجتاز جميع بوابات الجودة:
        الاطراد، يُسر التداول، الملاءمة، الاشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «مُشَاهَدَةٌ» تُقارب الحدث من منظور المتلقي/الجمهور (فعل الرؤية والاستقبال)،
        بينما «عَرْضٌ» يُقارب الحدث من منظور المُقدِّم/الموزّع (فعل الإظهار والتقديم)؛
        مما يُبرر التمييز الاصطلاحي بينهما كما في الإنجليزية: showing ≠ viewing.
      actions:
        - command: create_entry
          params:
            lemma: "مُشَاهَدَةٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تقديم"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُقيّد «التقديم» بالمفهوم النحوي والأدبي (نقل الشيء إلى ما
        قبله). ولا توجد أدلة في المعجمية الإعلامية أو السينمائية تُثبّت «تقديم» بوصفه
        مصطلحاً للعرض السينمائي. كما يُتداخل مع مفهوم «التعريف بالعمل» لا «إقامة العرض».
      evidence_assessment:
        case: contradicts_only

    - lemma: "جلسة سينمائية"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على تثبيت «جلسة سينمائية» مصطلحاً. وهي تخفق في اختبار السكّ:
        يمكن إبدال «جلسة» بـ«أمسية» أو «حصة» أو «سهرة» فيبقى الوصف صالحاً، مما يدل
        على أنها عبارة وصفية حرة لا مصطلح مسكوك.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────
stage4_content:
  definition:
    current: "عرض صورة متحركة (فيلم)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يعتمد أسلوب الاختزال التوضيحي بالقوسين («فيلم» توضيح لـ«صورة
        متحركة»)، وهو أسلوب شرح لا تعريف. كما تفتقر الصياغة إلى الجنس القريب والفصل
        النوعي اللذين يُميّزان التعريف المعجمي. ولا تُشير الصياغة إلى حضور الجمهور أو
        الطابع العلني، وهما من مكوّنات المفهوم الجوهرية بدليل المجموعة الأبوية.
    authored:
      - type: terminological
        text: "حَدَثُ إظهارِ فيلمٍ سينمائيٍّ لجمهورٍ لمشاهدتِهِ على شاشة العرض في زمنٍ ومكانٍ محدَّدَيْن."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          إقامةُ جلسةِ عرضٍ لفيلمٍ سينمائيٍّ أمام جمهور، سواء في دور العرض التجارية
          أو في إطار المهرجانات والعروض الخاصة، تشتمل عادةً على إسقاط الفيلم بجهاز
          البروجيكتور على شاشة كبيرة، أو ببثّه رقمياً بوسائل معاصرة.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حَدَثُ إظهارِ فيلمٍ سينمائيٍّ لجمهورٍ لمشاهدتِهِ على شاشة العرض في زمنٍ ومكانٍ محدَّدَيْن."
      - command: add_definition
