# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «عرض» منفردةً مشتركة لفظياً بشدة — لها أكثر من عشرة معانٍ في المعاجم (العَرَض الفلسفي، العِرض/الشرف، العَرْض ضد الطول، العَرَض المرضي، الجانب...)، مما يُخلّ بالتحديد الدلالي."
      - "كلا اللمّتين بلا تشكيل — «عرض» تُحتمل عَرْض وعِرض وعَرَض، و«عرض سينمائي» كذلك."
      - "التعريف «عرض صورة متحركة (فيلم)» يستخدم القوسين التوضيحيين وأسلوب الاختزال، وهو غير وافٍ بمعيار التعريف المعجمي المنطقي."
      - "غياب لمّة تقابل الإنجليزية «viewing» (وجهة نظر المتلقي)، إذ اقتصرت اللمّات على وجهة نظر المُقدِّم (عرض)."
    observations: >
      المجموعة الترادفية تدور حول مفهوم «حدث إظهار فيلم سينمائي أمام جمهور»، وهو مفهوم له
      ثلاثة جوانب دلالية: (أ) الإظهار/التقديم بوصفه فعلاً [عرض/عرض سينمائي]، (ب) المشاهدة
      بوصفها استقبالاً [viewing]، (ج) التخصيص السينمائي الذي يُميّزه عن العروض الأخرى.
      اللمّات الحالية تُغطّي الجانبَ (أ) بصورة مُعقولة، لكنها تُخفق في (ب). كما أن اشتراكية
      «عرض» اللفظية تستوجب حضور «عرض سينمائي» معها لأداء وظيفة التمييز الدلالي.
      الجذر العربي (ع-ر-ض) يُجيز الاستخدام ويُؤصِّله، ومفردة «عرض» في دلالة الإظهار والإبراز
      راسخة في التراث منذ كتاب العين.

  blind_candidates:
    - lemma: "إِسْقَاطٌ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من إسقاط الضوء المادي على الشاشة (وظيفة جهاز الإسقاط/البروجيكتور) إلى
        فعل عرض الفيلم ذاته. الجذر س-ق-ط يُفيد السقوط والوقوع، والمجاز أن الصورة «تسقط» على
        الشاشة أمام الجمهور. يُستخدم «جهاز الإسقاط» مرادفاً للبروجيكتور في المعجمية العربية.
    - lemma: "مُشَاهَدَةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر مُفَاعَلَة من الجذر ش-ه-د على وزن مُفَاعَلَة (شَاهَدَ → مُشَاهَدَة). يدل على
        الإدراك البصري المنظّم المشترك — أي مشاهدة فيلم في سياق جماعي علني.
        يُقابل الإنجليزية «viewing» مباشرةً، وهو مصطلح تقني في الإعلام الإلكتروني.
    - lemma: "تَقْدِيمٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفْعِيل من الجذر ق-د-م (قَدَّمَ → تَقْدِيم). يدل على الإظهار والتحضير
        للجمهور — «تقديم فيلم» بمعنى عرضه وإتاحته. شائع في الأسلوب الإعلامي والمهرجاني
        بوصفه فعل إيصال العمل إلى متلقيه.
    - lemma: "جَلْسَةٌ سِينِمَائِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي: «جَلْسَة» (اسم مرة دالة على نشاط زمني محدد) + «سِينِمَائِيَّة» (نسبة إلى
        سينما). يُشير إلى جلسة/حصة عرض في السينما بوصفها وحدة حدثية مُحدَّدة زمانياً ومكانياً.


