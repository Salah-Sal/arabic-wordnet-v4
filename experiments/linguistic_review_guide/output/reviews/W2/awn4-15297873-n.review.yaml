# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15297873-n
# interim / meantime / meanwhile / lag
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «أثناء ذلك» تعبير ظرفي يؤدي وظيفة الحال أكثر من الاسم، وقسم الكلام المسجَّل n"
      - "اللمّة «فترة مؤقتة» تعني مدة مؤقتة عموماً ولا تخصّص الفترة البينية بين حدثين"
      - "كلتا اللمّتين مركَّبتان ولا يوجد مفرد مسكوك يُقابل interim/meantime"
    observations: >
      المفهوم (الوقت الفاصل بين حدثين) يُعبَّر عنه في العربية غالباً بتراكيب ظرفية شبه جارّ ومجرور:
      «في أثناء ذلك»، «في غضون ذلك»، «في تلك الأثناء». ليس في العربية مفردة اسمية خالصة
      تُقابل الاسم الإنجليزي meantime تماماً؛ فالأقرب هو استعمال «أثناء» أو «غضون» في سياقاتها
      الظرفية. جذر ث ن ي يدلّ على التكرير والمثنوية، وجذر غ ض ن يدلّ على التثني والتكسر
      (طيّات الزمن مجازاً).
  blind_candidates:
    - lemma: "غُضُون"
      generation_method: majaz
      justification: >
        من جذر غ ض ن الدالّ على التثني والتكسر، يُستعمل مجازاً في «في غضون ذلك»
        بمعنى خلال تلك الفترة البينية. ورد في المعجم الوسيط: «جاء في غضون كلامك كذا:
        في أثنائه وطياته». نقلة مجازية من الطيّات الحسية إلى الطيّات الزمنية.
    - lemma: "بَرْزَخ"
      generation_method: majaz
      justification: >
        البرزخ في اللغة: الحاجز بين الشيئين. يُستعار للفترة الفاصلة بين حالتين أو حدثين.
        ورد في لسان العرب: «البرزخ ما بين كل شيئين». لكنه مُثقل بالدلالة الأخروية والجغرافية.
    - lemma: "مُهْلَة"
      generation_method: ishtiqaq
      justification: >
        من جذر م ه ل الدالّ على التؤدة. المهلة: زمن الإمهال الممنوح بين أمرين.
        لكنها تحمل دلالة الإمهال والرفق أكثر من دلالة الفترة البينية المحايدة.
    - lemma: "فُسْحَة"
      generation_method: majaz
      justification: >
        من جذر ف س ح الدالّ على السعة، تُستعار للفراغ الزمني بين عملين.
        ورد في المعجم الوسيط: «السعة بين عملين للراحة والتنزه (محدثة)».
        وفي معجم التجارة: «فسحة زمنية = time lag».

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "أَثْنَاءَ ذٰلِكَ"
      confirm:
        - text: "«في أثناء أو غضون ذلك.»"
          source: "المورد الحديث (2008) — مدخل in the interim"
        - text: "«خلال؛ أثناء؛ في غضون.»"
          source: "المورد الحديث (2008) — مدخل in the course of"
        - text: "«(1) فترة؛ فاصل interim between arrival and departure (2) مؤقّت interim committee. in the interim: في أثناء أو غضون ذلك.»"
          source: "المورد الحديث (2008) — مدخل interim"
      expands:
        - text: "«أَثْنَاء — الجذر: ث ن ي — مثال: زرت الأزهر أثناءَ وجودي في القاهرة — الرأي: مرفوضة — السبب: لاستعمال أثناء دون ذكر حرف جر قبلها. الصواب: زرت الأزهر أثناءَ وجودي في القاهرة [فصيحة] — زرت الأزهر في أثناءِ وجودي في القاهرة [فصيحة]. التعليق: قبِل مجمع اللغة المصري استخدام أثناء بدون حرف الجر.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "مجمع اللغة المصري أجاز استعمال أثناء ظرفاً منصوباً دون حرف جر"

    - lemma: "فَتْرَة مُؤَقَّتَة"
      contradicts:
        - text: "«interim (n) = (1) فترة؛ فاصل (2) مؤقّت interim committee. in the interim: في أثناء أو غضون ذلك.»"
          source: "المورد الحديث (2008)"
          conflict: "المورد يترجم interim الاسمي بـ«فترة» أو «فاصل» لا بـ«فترة مؤقتة»؛ والصفة مؤقّت تُستعمل لـ interim الوصفي فقط"
        - text: "«مُؤَقَّت — الرأي: مرفوضة — السبب: لأن الاشتقاق من وَقَّتَ لا من أَقَّتَ — الصواب: مُوَقَّت»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "الصيغة الصرفية مؤقَّت مرفوضة عند بعضهم والصواب مُوَقَّت"

    # ── مرشحات المرحلة ١ ──
    - lemma: "غُضُون"
      confirm:
        - text: "«(الغضن) كل تثن وتكسر في ثوب أو درع أو جلد أو أذن أو غيرها (ج) غُضُون ويُقال جاء في غُضُون كلامك كذا: في أثنائه وطياته»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«فِى غُضُوْن ذَلِك — Meanwhile, in the mean time.»"
          source: "المعجم العربي الإنجليزي لإدوارد وليام لين"
        - text: "«في غضون ذلك؛ في الوقت نفسه.»"
          source: "المورد الحديث (2008) — مدخل in the meantime"
        - text: "«(1) الوقت المتخلِّل: الوقت الواقع بين فترتين معيَّنتين (2) في غضون ذلك؛ خلال ذلك.»"
          source: "المورد الحديث (2008) — مدخل meantime"
      expands:
        - text: "«(غَضَنَ) الغين والضاد والنون أصل صحيح يدل على تثنٍّ وتكسُّر. من ذلك الغُضُون: مكاسر الجلد، ومكاسر كل شيء غُضُون.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي حسّي (طيّات الجلد)، والاستعمال الزمني مجازي"

    - lemma: "بَرْزَخ"
      contradicts:
        - text: "«(البرزخ) الحاجز بين شيئين ما بين الموت والبعث؛ فمن مات فقد دَخَل البرزخ (في علم الجغرافية): قطعة أرض ضيقة محصورة بين بحرين»"
          source: "المعجم الوسيط (OCR)"
          conflict: "الدلالة الغالبة أخروية (ما بين الموت والبعث) أو جغرافية (قطعة أرض)، لا زمنية بحتة"
        - text: "«البرزخ: العالم المشهور بين عالم المعاني المجردة والأجسام المادية»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "في الاصطلاح الفلسفي والصوفي: عالم المثال، وهو بعيد عن المعنى الزمني"
      expands:
        - text: "«البَرْزَخ ما بَيْنَ كل شَيْئين.»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: "المعنى اللغوي الأصلي عام يشمل الحاجز بين أي شيئين"

    - lemma: "مُهْلَة"
      contradicts:
        - text: "«(المهلة) التؤدة والرفق يقال: خذ المهلة في أمرك. أخذ عليه المهلة: تقدُّمه في سن أو أدب. بقية جمر في الرماد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المهلة تعني التؤدة والرفق أو الإمهال، لا الفترة الفاصلة بين حدثين"
      expands:
        - text: "«(مَهَلَ) الميم والهاء واللام أصلان صحيحان، يدل أحدهما على تؤدة، والآخر جنس من الذائبات.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على التؤدة والرفق لا على البينية الزمنية"

    - lemma: "فُسْحَة"
      contradicts:
        - text: "«(الفسحة) السعة (ج) فسح يقال في هذا الأمر فسحة أي سعة والسعة بين عملين للراحة والتنزه (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الفسحة في الأصل سعة مكانية، والاستعمال الزمني (بين عملين) محدث ومقصور على الاستراحة لا الفترة البينية عموماً"
        - text: "«فُسْحَة — الرأي: مرفوضة — السبب: لعدم ورودها في المعاجم بهذا المعنى. المعنى: للنزهة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "استعمال الفسحة بمعنى النزهة مرفوض عند بعض اللغويين"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "أَثْنَاءَ ذٰلِكَ"
      decision: confirmed
      decision_reason: >
        تعبير ظرفي مسكوك يؤدي معنى meanwhile/in the interim تماماً. مؤيَّد بالمورد الحديث
        الذي يترجم in the interim بـ«في أثناء أو غضون ذلك». مجمع اللغة المصري أجاز استعمال
        أثناء ظرفاً منصوباً. وهو الأكثر شيوعاً في الاستعمال المعاصر.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "التعبير الأكثر حياداً وشيوعاً في الفصحى المعاصرة للدلالة على الفترة البينية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَثْنَاءَ ذٰلِكَ"

    - lemma: "فَتْرَة مُؤَقَّتَة"
      decision: removed
      decision_reason: >
        التركيب «فترة مؤقتة» يعني مدة زمنية لها أجل محدود، وهذا يُقابل interim بوصفه صفة
        (مؤقت) لا بوصفه اسماً (الفترة البينية). المورد الحديث يترجم interim الاسمي بـ«فترة»
        أو «فاصل» دون صفة مؤقتة. فضلاً عن أن الصيغة «مؤقَّت» مرفوضة عند بعض اللغويين
        والصواب «مُوَقَّت». التركيب ليس مصطلحاً مسكوكاً بل عبارة وصفية حرة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "غُضُون"
      source: stage1
      decision: removed
      decision_reason: >
        غُضُون بوصفه مفرداً يعني مكاسر الجلد وطيّاته (معنى حسّي). الاستعمال الزمني بمعنى
        «في الأثناء» لا يتحقق إلا ضمن التركيب الظرفي «في غضون ذلك»، ولا يُستعمل مفرداً
        بمعنى meantime. وحيث إن المجموعة تحتوي بالفعل على «أثناء ذلك» المرادف له، فلا حاجة
        لإضافة «في غضون ذلك» كلمّة مستقلة لتجنب التكرار الدلالي.
      evidence_assessment:
        case: mixed

    - lemma: "بَرْزَخ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن المعنى اللغوي الأصلي «ما بين كل شيئين» قريب من المفهوم، فإن الدلالة الغالبة
        أخروية (ما بين الموت والبعث) أو جغرافية (شريط أرض بين بحرين)، والاستعمال الزمني
        للفترة البينية بين حدثين غير مأثور ولا شائع.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُهْلَة"
      source: stage1
      decision: removed
      decision_reason: >
        المهلة تدلّ على التؤدة والرفق وزمن الإمهال الممنوح عن قصد، وليست مرادفة للفترة
        البينية المحايدة بين حدثين. الفارق: المهلة تفترض فاعلاً يُمهِل ومفعولاً يُمهَل،
        بينما interim/meantime محايد لا يفترض ذلك.
      evidence_assessment:
        case: contradicts_only

    - lemma: "فُسْحَة"
      source: stage1
      decision: removed
      decision_reason: >
        الفسحة في الأصل سعة مكانية، واستعمالها الزمني (بين عملين) محدث ومقصور على معنى
        الاستراحة بين عملين، لا الفترة البينية عموماً. ورد في معجم التجارة «فسحة زمنية =
        time lag» لكنه مصطلح تقني لا مرادف عام.
      evidence_assessment:
        case: contradicts_only

