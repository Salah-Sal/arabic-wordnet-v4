      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَنَد دَيْن"

    - lemma: "سَنَد"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح اقتصادي راسخ في المعجم الوسيط والمعجم الكبير بمعنى «ورقة مالية مُثبتة لقرض حاصل وله فائدة ثابتة». يغطّي المفهوم العام لأداة الدين (bond) ويُكمل المجموعة."
