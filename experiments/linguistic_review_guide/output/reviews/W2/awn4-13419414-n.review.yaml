# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13419414-n
# debt instrument / obligation / certificate of indebtedness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «التزام» أعمّ من المفهوم المقصود؛ فهو يدلّ على الواجب والعهد عموماً لا على أداة دين مالية تحديداً"
      - "لمّة «سند دين» مركّب إضافي مقبول لكنّه يحتاج تشكيلاً كاملاً"
      - "التعريف العربي الحالي «وعد مكتوب بسداد دين» مقبول لكنّه مختصر ويمكن إثراؤه"
    observations: "المجموعة تمثّل مفهوماً مالياً اصطلاحياً (أداة دين) يشمل السندات والصكوك وشهادات الدين. اللمّتان الحاليتان تغطّيان جزءاً من الحقل الدلالي: «التزام» أعمّ (يشمل الالتزام القانوني والأخلاقي)، و«سند دين» أخصّ ومباشر. يُستحسن إضافة لمّة تدلّ على المفهوم المالي الدقيق."
  blind_candidates:
    - lemma: "صَكّ"
      generation_method: majaz
      justification: "الصكّ أصله الضرب والإطباق، ثمّ أُطلق مجازاً على الوثيقة المالية لأنّها تُطبَق وتُختَم. وهو مسجّل في المعجم الوسيط بمعنى وثيقة بمالٍ أو نحوه."
    - lemma: "سَنَد"
      generation_method: ishtiqaq
      justification: "من جذر س-ن-د الدالّ على الاعتماد والإسناد، على وزن فَعَل. استُعمل في الاقتصاد بمعنى ورقة مالية مُثبتة لقرض حاصل وله فائدة ثابتة (المعجم الوسيط)."
    - lemma: "مُسْتَنَد الدَّيْن"
      generation_method: tarkib
      justification: "مركّب إضافي من «مستند» (اسم مكان/مصدر ميمي من سند) و«الدين»، يُستعمل في المعاجم التجارية بمعنى debt instrument."
    - lemma: "سَنَد إِذْنِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي يُطلق على السند الذي يتعهّد حامله بالسداد (promissory note)، وهو نوع من أنواع أدوات الدين."

stage2_evidence:
  per_lemma:
    - lemma: "اِلْتِزَام"
      confirm:
        - text: "«التزام — obligation — obligation — domain: Law»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«التزام — commitment — engagement — domain: Commerce and Accounting»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«سند، التزام — obligation — domain: Commerce and Accounting»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«(1) التَّعهُّد: إلزام المرء نَفْسَهُ بأداء عمل ما (2) عهد؛ التزام (3) صك؛ سَنَد (4) واجب (5) مِنّة؛ فَضْل (6) المديونيّة»"
          source: "المورد الحديث (2008)"
          addition: "يبيّن أنّ «التزام» يقابل obligation بمعناه العام (التعهّد والواجب والصك) لا بمعنى أداة الدين تحديداً"
      contradicts:
        - text: "«الالتزام: عند أهل البديع هو لزوم ما لا يلزم، ويسمّى بالتشديد والإعنات والتضمين أيضاً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "دلالة بلاغية لا مالية، ممّا يؤكّد اشتراك اللفظ في عدّة حقول"

    - lemma: "سَنَد دَيْن"
      confirm:
        - text: "«سند دين — debenture — صادر عن شركة غالباً — domain: Commerce and Accounting»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«(1) سَنَد [دَيْنٍ] (2) الرّادّة: شهادة تخوّل حامِلَها حقّ استرداد الرسوم الجمركية»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«سند دين بلا ضمان — debenture bond»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يبيّن وجود تركيبات فرعية مبنية على سند دين"

    - lemma: "صَكّ"
      confirm:
        - text: "«وثيقةُ الإِقرار بمالٍ أو نحوه, وقد جَرَى به التَّبادلُ كالنُّقود»"
          source: "المعجم الكبير"
        - text: "«(الصَّك) وَثِيقَة بِمَال أَو نَحوه (مَعَ) وَمِثَال مطبوع بشكل خَاص يَسْتَعْمِلهُ الْمُودع فِي أحد المصارف لِلْأَمْرِ بِصَرْف الْمبلغ الْمُحَرر بِهِ (مج) (ج) صكوك»"
          source: "المعجم الوسيط"
        - text: "«الصَّكّ: كتابُ الإقرار بالمال وغيره (معرب)»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الصّكُّ: مَا يعْمل لكل طمع يجمع فِيهِ أسامي الْمُسْتَحقّين وعددهم ومبلغ مَالهم»"
          source: "معجم مقاليد العلوم للسيوطي"
      contradicts:
        - text: "«(فى الاقتصاد): نموذجٌ مطبوعٌ بشكلٍّ خاصٍّ يستعملهُ المودِعُ فى أحدِ المصارفِ للأمر بصرفِ المبلغِ المحرَّر به»"
          source: "المعجم الكبير"
          conflict: "هذا المعنى الحديث يخصّص الصكّ بالشيك المصرفي لا بأداة الدين"

    - lemma: "سَنَد"
      confirm:
        - text: "«(في الاقتصاد): ورقةٌ مالية مُثبتة لقرض حاصل, وله فائدة ثابتة»"
          source: "المعجم الوسيط"
        - text: "«صكُّ الدَّينِ وغيره»"
          source: "المعجم الكبير"
        - text: "«مُحَرَّرٌ ذو قيمةٍ قانونيةٍ في الإثباتِ»"
          source: "المعجم الكبير"
        - text: "«سَنَد — debenture — domain: Mathematics and Astronomy»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      expands:
        - text: "«سَنَدُ الخزينةِ: صكٌّ يثبتُ قرضًا أعطى للدولةِ إلى أجلِ معينٍ»"
          source: "المعجم الكبير"
          addition: "يبيّن أنّ السند يُستعمل بمعنى وثيقة مالية مُثبتة للقرض"
        - text: "«كلُّ ما يستندُ إليه ويعتمدُ عليه من حائط وغيره»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي (الاعتماد) الذي تفرّع منه المعنى المالي"

    - lemma: "مُسْتَنَد الدَّيْن"
      confirm:
        - text: "«مستند الدين — debt instrument — domain: Commerce and Accounting»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"

    - lemma: "سَنَد إِذْنِيّ"
      confirm:
        - text: "«سند اذني — promissory note — domain: Commerce and Accounting»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "«الكمبيالة؛ السَّنَد الإذنيّ (تج)»"
          source: "المورد الحديث (2008)"
          conflict: "السند الإذني يقابل promissory note تحديداً وهو نوعٌ خاصّ من أدوات الدين لا مرادف عامّ لها"

