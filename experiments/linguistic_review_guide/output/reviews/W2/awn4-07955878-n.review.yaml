    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"بوب","maqayis":"«الْبَاءُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ وَاحِدٌ... وَالْبَابُ أَصْلُ أَلِفِهِ وَاوٌ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ العام والشامل لعملية ونتيجة ترتيب الأشياء في فئات علمية أو عملية.","mwe":false}'
