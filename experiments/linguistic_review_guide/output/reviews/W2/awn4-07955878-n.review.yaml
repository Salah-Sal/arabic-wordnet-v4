stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "تصنيف" تفتقر للتشكيل الكامل.
      - التعريف الحالي هو ترجمة حرفية دقيقة للتعريف الإنجليزي، لكن يمكن صياغته بأسلوب معجمي عربي أمتن.
    observations: "المجموعة تدور حول مفهوم 'التصنيف' كنتيجة لترتيب الأشياء أو الأشخاص في فئات. اللفظ العربي 'تصنيف' هو الأنسب والأشيع لهذا المفهوم، مع إمكانية إضافة 'تبويب' كمرادف سياقي خاصة في مجالات تنظيم البيانات والمعارف."
  blind_candidates:
    - lemma: "تَصْنِيف"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من الفعل 'صَنَّفَ' الذي يعني جعل الشيء أصنافاً، وهو المصطلح الأساسي المقابل لـ classification."
    - lemma: "تَبْوِيب"
      generation_method: ishtiqaq
      justification: "يعني تقسيم الشيء إلى أبواب أو فصول، ويُستخدم في تصنيف البيانات والمعلومات (Categorization)."
    - lemma: "تَفْئِيَة"
      generation_method: ishtiqaq
      justification: "محاولة لاشتقاق مصدر من 'فئة' بمعنى التصنيف حسب الفئات، لكن تبيّن لاحقاً أن هذا اللفظ له معانٍ أخرى في المعاجم القديمة."
    - lemma: "تَنْوِيع"
      generation_method: ishtiqaq
      justification: "الترتيب حسب الأنواع، وإن كان يميل في الاستعمال الحديث إلى معنى التعدد والاختلاف (Diversification)."

stage2_evidence:
  per_lemma:
    - lemma: "تَصْنِيف"
      confirm:
        - text: "«ترتيب الكائنات الحية إلى مجموعات على أساس العلاقات التي تربطهم، والتي قد تكون من خلال التشابه أو أصل مشترك.»"
          source: "مسرد المناخ والبيئة - ArabTerm"
        - text: "«تقسيم المنتجات المختلفة حسب أسس أو معايير معينة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
        - text: "«التنظيم المنهجي للأشياء تبعاً لخصائص معينة بها.»"
          source: "معجم المصطلحات الطبية"
    - lemma: "تَبْوِيب"
      confirm:
        - text: "«عملية تقسيم المعطيات اللغوية أو غيرها إلى طبقات وفق معايير تأخذ في الاعتبار التماثل في الخصائص.»"
          source: "مسرد الإعلام والتواصل - ArabTerm"
        - text: "«تبويب الحسابات: classification of accounts»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
    - lemma: "تَفْئِيَة"
      contradicts:
        - text: "«(التفيئة) تفيئة الشَّيْء حِينه وزمانه»"
          source: "المعجم الوسيط"
          conflict: "المصطلح يشير إلى الزمان وليس التصنيف."
    - lemma: "تَنْوِيع"
      expands:
        - text: "«وحدات نصية تحكم بتشابهاتها، إلا أننا نميز فيها نوعين من المتغيرات... تساهم في دينامية النص.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "يشير إلى التنوع داخل الوحدة المصنفة وليس عملية التصنيف نفسها."

stage3_analysis:
  per_lemma:
    - lemma: "تصنيف"
      decision: confirmed
      decision_reason: "هو اللفظ الأساسي والمعياري المقابل لـ classification وcategorization في جميع المجالات العلمية والعملية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصْنِيف"
    - lemma: "تَبْوِيب"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي يُستخدم خاصة في السياقات التنظيمية والمنطقية والمالية (تبويب الحسابات/النفقات) ويناسب معنى categorization."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَبْوِيب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَفْئِيَة"
      decision: removed
      decision_reason: "اللفظ في المعجم يدل على الحين والزمان وليس له علاقة دلالية بالتصنيف."
    - lemma: "تَنْوِيع"
      decision: removed
      decision_reason: "يدل على جعل الشيء أنواعاً مختلفة (تعدد) وليس بالضرورة ترتيب المجموعة في أصناف."

stage4_content:
  definition:
    current: "مجموعة من الأشخاص أو الأشياء مرتبة حسب الفئة أو الصنف"
    assessment:
      decision: revise
      reason: "الصياغة الحالية هي ترجمة حرفية، ويفضل صياغتها بأسلوب يوضح طبيعة هذا الترتيب المنهجي."
    authored:
      - type: terminological
        text: "نَسَقٌ مُنَظَّمٌ لِتَقْسِيمِ الْأَشْيَاءِ أَوْ الْأَشْخَاصِ إِلَى مَجْمُوعَاتٍ مُتَمَايِزَةٍ بِنَاءً عَلَى صِفَاتٍ أَوْ خَصَائِصَ مُشْتَرَكَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَصْنِيف"
        examples:
          - text: "يَعْتَمِدُ عُلَمَاءُ الْأَحْيَاءِ تَصْنِيفاً دَقِيقاً لِلْكَائِنَاتِ يَقُومُ عَلَى الصِّفَاتِ الْوِرَاثِيَّةِ."
            type: usage
      - lemma: "تَبْوِيب"
        examples:
          - text: "يَسْهُلُ تَبْوِيبُ الْمَعْلُومَاتِ الْإِحْصَائِيَّةِ اسْتِرْجَاعَهَا عِنْدَ الْحَاجَةِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "نَسَقٌ مُنَظَّمٌ لِتَقْسِيمِ الْأَشْيَاءِ أَوْ الْأَشْخَاصِ إِلَى مَجْمُوعَاتٍ مُتَمَايِزَةٍ بِنَاءً عَلَى صِفَاتٍ أَوْ خَصَائِصَ مُشْتَرَكَةٍ."}

stage5_enrichment:
  per_entry:
    - lemma: "تَصْنِيف"
      entry_id: "{auto}"
      root: "صنف"
      maqayis_quote: "«الصَّادُ وَالنُّونُ وَالْفَاءُ أَصْلٌ صَحِيحٌ مُطَّرِدٌ فِي مَعْنَيَيْنِ، أَحَدُهُمَا الطَّائِفَةُ مِنَ الشَّيْءِ، وَالْآخَرُ تَمْيِيزُ الْأَشْيَاءِ بَعْضِهَا عَنْ بَعْضٍ. فَالْأَوَّلُ الصِّنْفُ... وَالتَّصْنِيفُ: تَمْيِيزُ الْأَشْيَاءِ بَعْضِهَا عَنْ بَعْضٍ.»"
    - lemma: "تَبْوِيب"
      entry_id: "{auto}"
      root: "بوب"
      maqayis_quote: "«الْبَاءُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ قَوْلُكَ تَبَوَّبْتُ بَوَّابًا، أَيِ اتَّخَذْتَ بَوَّابًا وَالْبَابُ أَصْلُ أَلِفِهِ وَاوٌ.»"
  per_sense:
    - lemma: "تَصْنِيف"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشامل لعملية ونتيجة ترتيب الأشياء في فئات علمية أو عملية."
      mwe: false
