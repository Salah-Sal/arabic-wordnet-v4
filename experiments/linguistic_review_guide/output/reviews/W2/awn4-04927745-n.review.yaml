# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "التعريف العربي ترجمة حرفية ركيكة من الإنجليزية، يفتقر إلى أسلوب المعجم الوسيط وإلى الإيجاز المصطلحي"
      - "عبارة 'بحقيقة أن' ترجمة مباشرة لـ 'by the fact that' غير ملائمة للصياغة المعجمية العربية"
      - "اللمّة 'ازدواجية' مفردة دون قيد يحدّدها قد تُحمل على معانٍ أخرى متداولة كالازدواجية اللغوية أو الشخصية"
      - "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) يستخدم صيغة 'ازدواجية الجسيم والموجه' بترتيب مختلف وباستخدام 'الموجه' عوض 'الموجة'"
    observations: >
      المجموعة الترادفية تعالج مفهوم ازدواجية الموجة والجسيم (wave-particle duality) في فيزياء الكم —
      وهو مفهوم علمي حديث لا جذر له في المعجمية العربية الكلاسيكية. المصطلح العربي 'ازدواجية' مشتقٌّ
      اشتقاقاً صحيحاً من الجذر الثلاثي 'زوج' على وزن المصدر الصناعي للمزيد (افتعل + يّة)، وهو مُثبَّتٌ
      في معاجم فيزيائية متخصصة. اللمّة المركبة 'ازدواجية الموجة والجسيم' تركيبٌ إضافي وافٍ بالمعنى
      الكامل للمصطلح. يحتاج كلا المصطلحين إلى تشكيل كامل. التعريف بحاجة إلى إعادة صياغة بعيداً عن
      الترجمة الحرفية نحو أسلوب المعجم الوسيط.

  blind_candidates:
    - lemma: "الثُّنَائِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر 'ثنى' على وزن فُعَالِيَّة — مصدر صناعي يُعبِّر عن كون الشيء ذا طبيعتين أو مبدأين
        متمايزين؛ ملائمة لوصف خاصية تجمع بين نظريتَي الموجة والجسيم في كيان مادي واحد.
    - lemma: "الازْدِوَاجِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر 'زوج' — مصدر صناعي من الفعل الخماسي 'ازدوجَ' (افتعل) على وزن الافتعالية المنسوبة —
        تُعبِّر عن خاصية الازدواج وانضمام طبيعتين متقابلتين في كيان واحد، وهو ما يصف حالة الجسيم
        الذي يجمع بين سلوكَي الموجة والجسيم تبعاً للظروف التجريبية.
    - lemma: "التَّنَاوُبِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر 'نوب' — وزن التَّفَاعُلِيَّة (تَفَاعُل + يّة) — تُعبِّر عن التناوب في ظهور الخصائص
        المتعاقبة؛ قد تصف كيفية تناوب سلوك الموجة وسلوك الجسيم في المادة تبعاً للشروط التجريبية
        لمبدأ هايزنبرغ.
    - lemma: "التَّقَابُلِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر 'قبل' — وزن التَّفَاعُلِيَّة — تُعبِّر عن التقابل بين طبيعتين ظاهرتا التناقض تكتمل
        إحداهما بالأخرى؛ تصف الجمع الجدلي بين طبيعة الموجة وطبيعة الجسيم في فيزياء الكم.


