# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى: الموجودة ──
    - lemma: "ازدواجية"
      decision: confirmed
      decision_reason: >
        مُثبَّتة في المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) بترجمة 'duality' في مجال
        الفيزياء مباشرةً. مشتقّة اشتقاقاً صحيحاً من الجذر 'زوج' الموثَّق في مقاييس اللغة بمعنى
        'مقارنة شيء لشيء'. مقبولة بمعايير بوابة الجودة المصطلحية الستة: تطّرد في الاشتقاق، تيسر
        التداول، ملائمة، تستحضر جذراً عربياً أصيلاً، عربية الأصل، قابلة للاشتقاق منها. تحتاج
        تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check: "الوزن الصرفي: مصدر صناعي من الفعل الخماسي 'ازدوجَ' (افتعل من زوج) + ياء النسب + تاء التأنيث الدالة على المصدرية = افتِعالِيَّة. الوزن مناسب تماماً للمفاهيم المجردة ذات الطابع الخاصِّيَّاتي."
      nuance_differentiation: "اللمّة المختصرة المطلقة تُستخدم في السياق الفيزيائي المتخصص حين يكون المرجع معروفاً ضمنياً؛ تُلاحق المصطلح الإنجليزي المجرد 'duality' في التعابير الاصطلاحية كـ'مبدأ الازدواجية'."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ازْدِوَاجِيَّة"

    # ── اللمّة الثانية: الموجودة — MWE ──
    - lemma: "ازدواجية الموجة والجسيم"
      decision: confirmed
      decision_reason: >
        مُثبَّتة في المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) بترجمة 'wave-particle duality'
        وإن جاءت بصيغة 'ازدواجية الجسيم والموجه'. التركيب الإضافي ثابتٌ معجمياً في أوثق مرجع فيزيائي
        عربي موحَّد. 'الموجة' أكثر معيارية وتداولاً من 'الموجه' في هذا السياق. الترتيب في AWN
        (الموجة أولاً) مقبول لغوياً. تجتاز اختبار السكّ: لا يمكن إبدال 'الموجة' بمرادف وبقاء المصطلح
        صالحاً دلالياً دون تغيير المعنى الأصلي. تحتاج تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "اللمّة الكاملة الصريحة تُستخدم في السياقات التعليمية والتوضيحية والموسوعية حين يلزم تحديد طبيعة الازدواجية المقصودة وتمييزها عن الازدواجية اللغوية والاجتماعية وغيرها."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ازْدِوَاجِيَّةُ الْمَوْجَةِ وَالْجُسَيْمِ"

    # ── المرشح ١: stage1 ──
    - lemma: "الثُّنَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        في الفيزياء تحديداً، تُقابل 'ثنائية' مصطلح 'doublet' (زوج طيفي أو جسيمي) لا 'duality'
        وفق المعجم الموحد لمصطلحات الفيزياء (1989). التداخل الدلالي مع 'dualism' في الفلسفة والطب
        يُضعف دقتها في هذا السياق الفيزيائي الكمي. 'ازدواجية' أرسخ في الاستخدام الفيزيائي وأدق
        تخصصاً. إضافة 'الثنائية' إلى المجموعة سيُنشئ التباساً مع المفاهيم المنطقية والفلسفية.

    # ── المرشح ٢: stage1 ──
    - lemma: "الازْدِوَاجِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة 'ازدواجية' مع إضافة أداة التعريف فحسب — لا يُشكّل قيمةً
        مضافة كمدخل مستقل. الصورتان (مع ال- وبدونها) متداولتان للكيان المعجمي ذاته ولا يستوجبان
        مدخلَيْن منفصلَيْن في شبكة WordNet.

    # ── المرشح ٣: stage1 ──
    - lemma: "التَّنَاوُبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي. ليست مصطلحاً مسكوكاً في أي معجم فيزيائي أو علمي متخصص.
        تفشل اختبار التثبيت المعجمي. لا يُنصح باستحداثها لأن 'ازدواجية' تفي بالغرض وهي مُعتمَدة
        رسمياً.

    # ── المرشح ٤: stage1 ──
    - lemma: "التَّقَابُلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي. مصطلح غير مسكوك في الأدبيات الفيزيائية. وإن كانت جيدة
        من الناحية الصرفية إلا أن غياب التداول يمنع إدراجها. 'التقابل' في الفيزياء له استخدام في
        سياقات أخرى (التقابل بين المادة والمادة المضادة) مما قد يُنشئ التباساً.


