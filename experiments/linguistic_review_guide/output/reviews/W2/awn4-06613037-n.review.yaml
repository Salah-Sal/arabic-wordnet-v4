stage1_review:
  assessment:
    concerns:
      - "اللمّة «خُرُوج عَن الْمَوْضُوع» عبارة وصفية حرة أكثر منها مصطلحاً مسكوكاً، لكنها مسجّلة في معجم مصطلحات المعلوماتية"
      - "اللمّة «جُمْلَة مُعْتَرِضَة» تدلّ في البلاغة العربية على الجملة الاعتراضية لا على مطلق الخروج عن الموضوع، فهي أخصّ من المفهوم العام"
      - "التعريف العربي الحالي شديد الإيجاز ولا يميّز المفهوم عن مفاهيم قريبة كالحشو والتذييل"
    observations: "المفهوم متجذّر في التراث البلاغي العربي تحت مصطلح «الاستطراد» بتعريفات دقيقة عند الجرجاني والسيوطي والتهانوي. وهو يختلف عن «الاعتراض» الذي يعني إقحام جملة لا محلّ لها من الإعراب لنكتة بلاغية. المجموعة تحتاج تدقيق الفروق الدلالية بين اللمّات الثلاث."
  blind_candidates:
    - lemma: "اسْتِطْرَاد"
      generation_method: ishtiqaq
      justification: "مصدر سداسي من «طَرَدَ» على وزن اسْتِفْعَال، مصطلح بلاغي كلاسيكي يعني سوق الكلام على وجه يلزم منه كلام آخر غير مقصود بالذات"
    - lemma: "حَيْدَة"
      generation_method: ishtiqaq
      justification: "من جذر «حيد» بمعنى الميل والانحراف، على وزن فَعْلَة للمرّة، أي الميلة الواحدة عن الموضوع"
    - lemma: "شُرُود"
      generation_method: majaz
      justification: "مجاز من شُرود الذهن عن المحيط، نُقل إلى شرود الكلام عن موضوعه الأصلي"
    - lemma: "اعْتِرَاض"
      generation_method: ishtiqaq
      justification: "مصدر خماسي من «عرض» على وزن افْتِعَال، مصطلح بلاغي يعني إدخال جملة في أثناء الكلام لنكتة بلاغية"

stage2_evidence:
  per_lemma:
    - lemma: "اسْتِطْرَاد"
      confirm:
        - text: "«الاستطراد: سوق الكلام على وجه يلزم منه كلام آخر، وهو غير مقصود بالذات بل بالعرض.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الاستطْراد: أَن يكون فِي شَيْء من الْفُنُون ثمَّ سنح لَهُ فن آخر يُنَاسِبه، فيورده فِي ذكره.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الاستطراد: ذكر الشيء في غير موضعه وقولهم وقع ذلك على وجه الاستطراد مأخود من الاجتذاب لأنك لم تذكره في موضعه بل مهدت له موضعا ذكرته فيه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«إقحامٌ لا يتصل بالموضوع مباشرة، لكنه يحيل على علاقة بعيدة كما أنه حالة موسوعية لتزاحم الأفكار والقوالب لحد إخراجه عن موضوعه.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«الاستطراد عند البلغاء هو أن يذكر عند سوق الكلام لغرض ما يكون له نوع تعلّق به، ولا يكون السّوق لأجله... والفرق بينه وبين حسن التّخلّص سيأتي في لفظ التّخلّص.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يميّز الاستطراد عن حسن التخلّص، ويوضّح أنه ذكر ما له نوع تعلّق بالموضوع لا ما هو مقصود بالذات"
    - lemma: "جُمْلَة مُعْتَرِضَة"
      confirm:
        - text: "«(1) كلمة أو جملة معترضة [توضع بين قاطعتين أو هلالين إلخ] (2) فترة فاصلة (3) هلال أو هلالان: ( ).»"
          source: "المورد الحديث (2008) — مقابل parenthesis"
      expands:
        - text: "«الاعتراض: هو أن يأتي في أثناء كلام، أو بين كلامين متصلين، معنىً بجملة أو أكثر لا محل لها من الإعراب، لنكتة سوى رفع الإبهام، ويسمى الحشو أيضًا.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "الجملة المعترضة مصطلح نحوي-بلاغي أخصّ من الاستطراد، إذ تشترط عدم المحلّ الإعرابي ووقوعها في أثناء كلام متّصل"
    - lemma: "خُرُوج عَن الْمَوْضُوع"
      confirm:
        - text: "«الجنوحُ في نقاشٍ موصول إلى الخط online إلى الانتقال من الموضوع الأساسيّ نحو اتجاهاتٍ أخرى تتعلق به أو لا. فمثلاً، إذا سأل شخصٌ في لقاءٍ تلفزِيّ عن برنامجٍ إخباري... فإن هذا يمثل خروجاً عن الموضوع.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
    - lemma: "حَيْدَة"
      contradicts:
        - text: "«(الحيدة) يُقَال مَا نظر إِلَيّ إِلَّا نظر الحيدة نظر سوء فِيهِ ميل وانصراف والعقدة فِي قرن الوعل»"
          source: "المعجم الوسيط"
          conflict: "الحيدة في المعاجم تعني نظر السوء أو العقدة الجسمية، لا الخروج عن الموضوع في الكلام"
        - text: "«الحيدة: ما يَعْتَرِى الإنسان من السِّنَّقِ والغَضَبِ»"
          source: "المعجم الكبير"
          conflict: "دلالة الحيدة على الغضب والنفور لا على الاستطراد في الخطاب"
    - lemma: "شُرُود"
      contradicts:
        - text: "«(الشرود) شرود الذِّهْن (فِي علم النَّفس) عدم الانتباه إِلَى الظروف المحيطة أَو الملابسات الطارئة»"
          source: "المعجم الوسيط"
          conflict: "الشرود مصطلح نفسي يعني عدم الانتباه الذهني لا الخروج الإرادي عن موضوع الكلام"
    - lemma: "اعْتِرَاض"
      confirm:
        - text: "«الاعتراضُ: أَن يُؤْتى فِي أثْنَاء الْكَلَام، أَو بَين كلامين متصلين معنى بجملة أَو أَكثر لَا مَحل لَهَا من الْإِعْرَاب لنكتة سوى دفع الْإِبْهَام.»"
          source: "معجم مقاليد العلوم للسيوطي"
      contradicts:
        - text: "«عدم الموافقة، احتجاج، إيقاف ومنع من متابعة مسار»"
          source: "مسرد المناخ والبيئة — المعنى العام"
          conflict: "المعنى السائد للاعتراض هو المعارضة والاحتجاج لا الخروج عن الموضوع، والمعنى البلاغي أخصّ (إقحام جملة اعتراضية) ويتداخل مع «جملة معترضة» لا مع مطلق الاستطراد"

