stage1_review:
  assessment:
    concerns:
      - "التعريف العربي ترجمة حرفية للإنجليزي، وفيه تعبيرات ركيكة مثل «صفر تعسفي» و«معبر عنها كزاوية»."
      - "المجموعة تجمع بين مفهومَيْن متقاربين: الطور (phase) وزاوية الطور (phase angle)، وقد يكون هذا مقبولاً لتقاربهما الشديد."
      - "اللمّتان الموجودتان بلا تشكيل."
    observations: "المفهوم ينتمي إلى مجال الفيزياء والرياضيات والهندسة الكهربائية: نقطة محددة في دورة زمنية تُقاس بوصفها زاوية انطلاقاً من مبدأ اختياري. الجنس القريب هو «نقطة زمنية» (hypernym). المصطلح العربي المتوقع ينبغي أن ينقل فكرة المرحلة أو الحالة الدورية المقاسة كزاوية."
  blind_candidates:
    - lemma: "طَوْر"
      generation_method: ishtiqaq
      justification: "من الجذر ط و ر الدال على الامتداد في الزمان والمكان، ويُستعمل في العربية بمعنى التارة والمرحلة، فيصلح للدلالة على نقطة في دورة زمنية."
    - lemma: "وَجْه"
      generation_method: majaz
      justification: "الوجه هو الجانب والناحية من الشيء، واستُعمل مجازاً للدلالة على الحالة أو الصفحة من الدورة، مما يناسب مفهوم الطور الفيزيائي."
    - lemma: "زَاوِيَةُ الدَّوْرَة"
      generation_method: tarkib
      justification: "مركب إضافي يصف المفهوم مباشرة: الزاوية المقيسة في سياق الدورة."
    - lemma: "زَاوِيَةُ الطَّوْر"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين مفهوم الزاوية ومصطلح الطور، ويُتوقع أن يكون المقابل الاصطلاحي لـ phase angle."

