stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي يعاني من الدور (circularity) باستخدامه لكلمة 'التواصل' لتعريف التواصل نفسه."
    observations: "اللمتان (اتصال، تواصل) تعبران بدقة عن المفهوم المطلوب، حيث يركز 'الاتصال' على فعل النقل والربط، بينما يركز 'التواصل' على الجانب التفاعلي والتبادلي للمعلومات."
  blind_candidates:
    - lemma: "تَوَاصُل"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تواصل، وهو التعبير الأشيع في اللغة المعاصرة للنشاط التفاعلي لتبادل المعلومات."
    - lemma: "اتِّصَال"
      generation_method: ishtiqaq
      justification: "مصدر الفعل اتصل، ويستخدم في السياقات التقنية والإعلامية لوصف عملية نقل الرسائل والبيانات."
    - lemma: "تَخَاطُب"
      generation_method: ishtiqaq
      justification: "يعبر عن التفاعل اللفظي أو المكتوب بين طرفين، وهو مرادف قوي في سياق 'نشاط التواصل'."
    - lemma: "نَقْلُ المَعْلُومَات"
      generation_method: tarkib
      justification: "مركب وصفي يعبر بدقة عن الوظيفة الأساسية للتواصل كما وردت في التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "اتِّصَال"
      confirm:
        - text: "«تماس بين مُوصِلين يسمح بمرور رسالة ما.»"
          source: "ArabTerm - مسرد الإعلام والتواصل"
        - text: "«الاتصال: [في الانكليزية] Junction ،communication [ في الفرنسية] Jonction ،communication في اللغة پيوستن ضد الانفصال وهو أمر إضافي يوصف به الشيء بالقياس إلى غيره.»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
    - lemma: "تَوَاصُل"
      confirm:
        - text: "«اتصال متبادل»"
          source: "ArabTerm - مسرد الإعلام والتواصل"
        - text: "«نقل الأخبار بواسطة العلامات والإشارات بين مرسل إلى متلقٍ عبر قناة ما...»"
          source: "ArabTerm - المعجم الموحد لمصطلحات اللسانيات"
        - text: "«التواصل يتضمن في تعريفه إعطاء المعلومة والحصول على رد الفعل. الإخبار لا يتضمن ذلك.»"
          source: "ArabTerm - مسرد المناخ والبيئة"
    - lemma: "تَخَاطُب"
      confirm:
        - text: "«تَكالما وتَحَادثا»"
          source: "المعجم الكبير (OCR)"
        - text: "«الْخَاءُ وَالطَّاءُ وَالْبَاءُ أَصْلَانِ: أَحَدُهُمَا الْكَلَامُ بَيْنَ اثْنَيْنِ»"
          source: "مقاييس اللغة لابن فارس"

stage3_analysis:
  per_lemma:
    - lemma: "اتصال"
      decision: confirmed
      decision_reason: "مصطلح أساسي ومستخدم بكثافة في سياق نقل المعلومات والتقنيات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اتِّصَال"
    - lemma: "تواصل"
      decision: confirmed
      decision_reason: "المصطلح الأكثر دقة للتعبير عن الجانب التفاعلي والاجتماعي للتواصل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَاصُل"
    - lemma: "تَخَاطُب"
      source: stage1
      decision: confirmed
      decision_reason: "يعزز المجموعة من خلال إضافة البعد التفاعلي اللفظي، وهو متوافق مع تعريف النشاط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَخَاطُب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "نشاط التواصل؛ نشاط نقل المعلومات"
    assessment:
      decision: revise
      reason: "تجنب الدور في التعريف (باستخدام كلمة تواصل لتعريف التواصل) وتقديم صياغة أكثر دقة ومصطلحية."
    authored:
      - type: terminological
        text: "عَمَلِيَّةُ تَبَادُلِ الأَفْكَارِ أَوْ المَعْلُومَاتِ أَوْ المَشَاعِرِ بَيْنَ الأَفْرَادِ أَوْ الأَنْظِمَةِ عَبْرَ نَقْلِ الرَّسَائِلِ بِوَاسِطَةِ أَنْظِمَةٍ مِنَ العَلَامَاتِ وَالرُّمُوزِ وَالإِشَارَاتِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "اتِّصَال"
        examples:
          - text: "تَقَدَّمَتْ تِكْنُولُوجِيَا الاتِّصَالِ بِشَكْلٍ كَبِيرٍ فِي القَرْنِ الحَادِي وَالعِشْرِينَ مِمَّا جَعَلَ العَالَمَ قَرْيَةً صَغِيرَةً."
            type: usage
      - lemma: "تَوَاصُل"
        examples:
          - text: "يُعَدُّ التَّوَاصُلُ الفَعَّالُ بَيْنَ المُرَبِّينَ وَأَوْلِيَاءِ الأُمُورِ أَسَاسَ النَّجَاحِ فِي العَمَلِيَّةِ التَّرْبَوِيَّةِ."
            type: usage
      - lemma: "تَخَاطُب"
        examples:
          - text: "يُسَاعِدُ هَذَا التَّطْبِيقُ الأَشْخَاصَ ذَوِي الإِعَاقَةِ السَّمْعِيَّةِ عَلَى التَّخَاطُبِ مَعَ الآخَرِينَ بِسُهُولَةٍ."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عَمَلِيَّةُ تَبَادُلِ الأَفْكَارِ أَوْ المَعْلُومَاتِ أَوْ المَشَاعِرِ بَيْنَ الأَفْرَادِ أَوْ الأَنْظِمَةِ عَبْرَ نَقْلِ الرَّسَائِلِ بِوَاسِطَةِ أَنْظِمَةٍ مِنَ العَلَامَاتِ وَالرُّمُوزِ وَالإِشَارَاتِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَقَدَّمَتْ تِكْنُولُوجِيَا الاتِّصَالِ بِشَكْلٍ كَبِيرٍ فِي القَرْنِ الحَادِي وَالعِشْرِينَ."

