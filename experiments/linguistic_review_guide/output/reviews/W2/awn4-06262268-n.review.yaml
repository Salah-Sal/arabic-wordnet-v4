      maqayis_quote: "«الْوَاوُ وَالصَّادُ وَاللَّامُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ضَمِّ شَيْءٍ إِلَى شَيْءٍ حَتَّى يَعْلَقَهُ.»"
