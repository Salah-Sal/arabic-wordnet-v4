      sense_id: "{auto}"
      nuance: "يركز على التتابع الزمني والمراحل التي يمر بها المرض."
      mwe: true
    - lemma: "عَمَلِيَّةٌ مَرَضِيَّةٌ"
      sense_id: "{auto}"
      nuance: "ترجمة دقيقة وشائعة تركز على التغيرات العضوية والآليات الناتجة عن المرض."
      mwe: true
    - lemma: "مَسَارُ المَرَضِ"
      sense_id: "{auto}"
      nuance: "تعبير شائع في السياقات السريرية لوصف تطور المرض عبر الزمن."
      mwe: true

  synset:
    cultural_fit: native

  actions:
