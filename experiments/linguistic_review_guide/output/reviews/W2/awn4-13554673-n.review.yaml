      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"سير","root":"سير","maqayis":"«السِّينُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى مُضِيٍّ وَجَرَيَانٍ...»"},{"word":"مرضي","root":"مرض","maqayis":"«الْمِيمُ وَالرَّاءُ وَالضَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَا يَخْرُجُ بِهِ الْإِنْسَانُ عَنْ حَدِّ الصِّحَّةِ...»"}]}'
    - command: set_metadata
