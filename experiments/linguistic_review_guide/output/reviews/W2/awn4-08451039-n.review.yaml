# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - اللفظان الحاليان "آلية" و"جهاز" دقيقان، ولكن يحتاجان إلى ضبط بالحركات لتمييزهما عن المعاني الحسية (مثل آلية بمعنى ميكانيكية أو جهاز بمعنى أداة).
    observations: "المفهوم يشير إلى المنظومة الإجرائية أو الهيكلية التي تسيّر عمل المؤسسات. المصطلحات العربية الحديثة استقرت على استخدام 'آلية' و'جهاز' في هذا السياق، وهناك تعابير مجازية مثل 'دولاب العمل' تعبر عن نفس المفهوم بدقة."
  blind_candidates:
    - lemma: "آلِيَّة"
      generation_method: ishtiqaq
      justification: "اسم منسوب إلى 'آلة'، ويُستخدم في السياق الحديث للدلالة على كيفية حدوث الشيء أو الإجراءات المنظمة."
    - lemma: "جِهَاز"
      generation_method: majaz
      justification: "انزياح دلالي من 'جهاز' (الأداة أو المتاع) إلى 'الجهاز الإداري' أو المنظومة الوظيفية."
    - lemma: "نَسَق"
      generation_method: ishtiqaq
      justification: "من 'النسق' وهو ما جاء على نظام واحد، ويناسب وصف 'نظام من الوسائل'."
    - lemma: "بِنْيَة"
      generation_method: majaz
      justification: "يُستخدم للدلالة على الهيكل التنظيمي للمؤسسة."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "آلِيَّة"
      confirm:
        - text: "«كيفية حدوث الشىء»"
          source: "المعجم الكبير"
        - text: "«آلية الجهاز الحكومي (machinery of government)»"
          source: "معجم المصطلحات التجارية والمحاسبية (ArabTerm)"
    - lemma: "جِهَاز"
      confirm:
        - text: "«تنظيم مكون من عدة أجزاء تعمل سوياً لأداء وظيفة معينة»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«جهاز إداري (administrative machinery)»"
          source: "معجم المصطلحات التجارية والمحاسبية (ArabTerm)"
    - lemma: "نَسَق"
      confirm:
        - text: "«من كل شيء ما كان على نظام واحد عام في الأشياء»"
          source: "كتاب العين"
        - text: "«كل نظام دالّ ومعقد يفرض نفسه على العالم»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
    - lemma: "دُولَاب العَمَل"
      confirm:
        - text: "«كلّ أداة تدور وتُحدث حركة تدفع غيرها: دار دولابُ العمل في المصنع»"
          source: "معجم اللغة العربية المعاصرة"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "آلية"
      decision: confirmed
      decision_reason: "مصطلح مركزي في العلوم الاجتماعية والإدارية الحديثة للتعبير عن 'Machinery/Mechanism'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "آلِيَّة"
    - lemma: "جهاز"
      decision: confirmed
      decision_reason: "يُستخدم بشكل واسع للدلالة على الهيكل التنظيمي أو الإداري (Apparatus)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِهَاز"
    - lemma: "نَسَق"
      source: stage1
      decision: confirmed
      decision_reason: "يتفق مع تعريف 'نظام من الوسائل' ويُستخدم في اللسانيات وعلم الاجتماع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَسَق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08451039-n"}
    - lemma: "دُولَاب العَمَل"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير اصطلاحي (MWE) فصيح وشائع يعبر بدقة عن حركة ونظام الأنشطة في مؤسسة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "دُولَاب العَمَل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08451039-n"}

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "نظام من الوسائل والأنشطة تعمل من خلاله مؤسسة اجتماعية"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه يحتاج صياغة معجمية أكثر سلاسة لبيان الجانب الوظيفي والتنظيمي."
    authored:
      - type: terminological
        text: "مجموعةُ الوسائل والأساليب والأنشطة التي تُنظِّمُ عَمَلَ مؤسسةٍ ما وتُسيِّرُ شؤونَها الوظيفية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08451039-n", definition_index: 0, text: "مجموعةُ الوسائل والأساليب والأنشطة التي تُنظِّمُ عَمَلَ مؤسسةٍ ما وتُسيِّرُ شؤونَها الوظيفية."}
  examples:
    per_lemma:
      - lemma: "آلِيَّة"
        examples:
          - text: "تعتمدُ الحكومةُ آلِيَّةً جديدةً لتقييمِ أداءِ الموظفين."
            type: usage
      - lemma: "جِهَاز"
        examples:
          - text: "يُعدُّ جِهَازُ القضاءِ من أهمِّ ركائزِ الدولةِ الحديثة."
            type: usage
      - lemma: "نَسَق"
        examples:
          - text: "تعملُ المؤسسةُ وفقَ نَسَقٍ إداريٍّ صارمٍ يضمنُ الكفاءة."
            type: usage
      - lemma: "دُولَاب العَمَل"
        examples:
          - text: "تحرصُ الإدارةُ على استمرارِ دورانِ دُولَابِ العَمَلِ رغمَ الأزمات."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-08451039-n", text: "تطورتْ آليّةُ اتخاذِ القرارِ داخلَ المنظمةِ بشكلٍ ملحوظ."}

# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    - lemma: "آلِيَّة"
      entry_id: "{auto}"
      root: "اول"
      maqayis_quote: "«الْهَمْزَةُ وَالْوَاوُ وَاللَّامُ أَصْلَانِ: ابْتِدَاءُ الْأَمْرِ وَانْتِهَاؤُهُ... وَالْإِيَالَةُ السِّيَاسَةُ... لِأَنَّ مَرْجِعَ الرَّعِيَّةِ إِلَى رَاعِيهَا.»"
    - lemma: "جِهَاز"
      entry_id: "{auto}"
      root: "جهز"
      maqayis_quote: "«الْجِيمُ وَالْهَاءُ وَالزَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ شَيْءٌ يُعْتَقَدُ وَيُحْوَى، نَحْوَ الْجَِهَازِ، وَهُوَ مَتَاعُ الْبَيْتِ.»"
    - lemma: "نَسَق"
      entry_id: "{auto}"
      root: "نسق"
      maqayis_quote: "«النُّونُ وَالسِّينُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَتَابُعٍ فِي الشَّيْءِ. وَكَلَامٌ نَسَقٌ: جَاءَ عَلَى نِظَامٍ وَاحِدٍ.»"
    - lemma: "دُولَاب العَمَل"
      entry_id: "{auto}"
      roots:
        - word: "دولاب"
          root: "دلب"
          maqayis_quote: "«الدَّالُ وَاللَّامُ وَالْبَاءُ لَيْسَ بِشَيْءٍ. وَالدُّلْبُ فِيمَا يُقَالُ: شَجَرٌ.» (الكلمة معربة)"
        - word: "العمل"
          root: "عمل"
          maqayis_quote: "«الْعَيْنُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ، وَهُوَ عَامُّ فِي كُلِّ فِعْلٍ يُفْعَلُ.»"
  per_sense:
    - lemma: "آلِيَّة"
      sense_id: "{auto}"
      nuance: "تركز على الطريقة والإجراءات والمسار الحركي للعمل (Mechanism)."
      mwe: false
    - lemma: "جِهَاز"
      sense_id: "{auto}"
      nuance: "يركز على الهيكل التنظيمي والأفراد والمكاتب التي تشكل المنظومة (Apparatus/Body)."
      mwe: false
    - lemma: "نَسَق"
      sense_id: "{auto}"
      nuance: "يركز على النظام العام والترابط بين الأجزاء (System/Pattern)."
      mwe: false
    - lemma: "دُولَاب العَمَل"
      sense_id: "{auto}"
      nuance: "تعبير مجازي يصور استمرارية النشاط وحركته الدائبة داخل المؤسسة."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"اول","maqayis":"«الْهَمْزَةُ وَالْوَاوُ وَاللَّامُ أَصْلَانِ... وَالْإِيَالَةُ السِّيَاسَةُ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جهز","maqayis":"«الْجِيمُ وَالْهَاءُ وَالزَّاءُ أَصْلٌ وَاحِدٌ... جَهَازِ الْمَتَاعِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نسق","maqayis":"«النُّونُ وَالسِّينُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَتَابُعٍ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"دولاب","root":"دلب","maqayis":"معرب"},{"word":"عمل","root":"عمل","maqayis":"«الْعَيْنُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ...»"}]}'
    - command: set_metadata
