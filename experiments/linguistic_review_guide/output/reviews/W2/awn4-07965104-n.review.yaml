stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عارفون، مطلعون) بصيغة جمع المذكر السالم بدون تشكيل"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي وليس بأسلوب معجمي عربي أصيل"
      - "المجموعة تمثّل مفهوم الجماعة (people) فاستعمال صيغة الجمع مقبول لكنّه غير معتاد معجمياً"
    observations: "المفهوم يدور حول من أُدخِل في أسرار مجالٍ أو نشاطٍ فصار من خاصّته وأهل باطنه. هذا المفهوم حاضر في التراث العربي الإسلامي بقوة، خاصة في الأدبيات الصوفية حيث «العارف» مصطلح محوري يدلّ على من بلغ مرتبة المعرفة بأسرار الحقيقة. كذلك «المطّلع» يدلّ على من أحاط بالبواطن. والمجال الدلالي غنيّ بالمترادفات الجزئية."

  blind_candidates:
    - lemma: "عَارِفُونَ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من عَرَفَ على وزن فاعِل بصيغة الجمع. العارف في الاصطلاح الصوفي من بلغ مرتبة المعرفة بأسرار الحقيقة، وهو أقرب لفظ عربي لمفهوم initiated/connoisseur"
    - lemma: "مُسْتَنِيرُونَ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استنار (باب الاستفعال) على وزن مُسْتَفْعِل. يدلّ على من أضاء فكره وبصيرته بالمعرفة، يقابل enlightened في الإنجليزية"
    - lemma: "مُبَصَّرُونَ"
      generation_method: ishtiqaq
      justification: "اسم مفعول من بَصَّرَ (فعّل) على وزن مُفَعَّل. يدلّ على من فُتحت بصيرته فأدرك ما كان خافياً، من قوله تعالى «بصائر من ربكم»"
    - lemma: "أَهْلُ الْبَاطِنِ"
      generation_method: tarkib
      justification: "مركب إضافي ثابت مسجّل في المعاجم. يُطلق على من يُعنى بباطن الأمور وأسرارها دون ظاهرها، وهو لقب معروف لجماعة الصوفية"


stage2_evidence:
  per_lemma:
    - lemma: "عَارِفُونَ"
      confirm:
        - text: "«العارف:[في الانكليزية] Connoisseur ،initiated [ في الفرنسية] Connaisseur ،initie»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«العارف: المختص بمعرفة الله، ومعرفة ملكوته، وحسن معاملته تعالى.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العارف: من أشهده الرب نفسه، فظهرت عليه الأحوال، والمعرفة حاله.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«العَارِفُ: من بدا لَهُ الشَّاهِد، وفنى الشواهد، ووهب الْخَواص، واضمحل الْإِخْلَاص، وَقيل: أَن يكون كَمَا كَانَ حَيْثُ كَانَ قبل أَن يكون.»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "تفصيل المراتب الصوفية للعارف"
        - text: "«عَارِف: من يدبر أمر القوم ويقوم بسياستهم، ومن يدرك الشيء بحاسة من حواسه، ومن يصبر للأمر.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "دلالات إضافية للعارف: المدبّر والصابر"

    - lemma: "مُطَّلِعُونَ"
      confirm:
        - text: "«المطّلع: شخص متيسّرةٌ له أسبابُ الاطّلاع على بواطن الأمور.»"
          source: "المورد الحديث (2008)"
        - text: "«(9) المطَّلع؛ الخبير.»"
          source: "المورد الحديث (2008) — مادة initiate"
        - text: "«عارف؛ مُطَّلِع.»"
          source: "المورد الحديث (2008) — مادة knowing"
      expands:
        - text: "«أَطْلَعْتُكَ عَلَى الْأَمْرِ إِطْلَاعًا. وَقَدْ أَطْلَعْتُكَ طِلْعَهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ط ل ع يدلّ على ظهور وبروز، والإطلاع: الإعلام بالأمر"

    - lemma: "مُسْتَنِيرُونَ"
      confirm:
        - text: "«مُسْتَنِير: من (ن و ر) المكان المضاء، والإنسان الواعي.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) مُتَنوِّر (2) مستنير an enlightened judgment.»"
          source: "المورد الحديث (2008) — مادة enlightened"

    - lemma: "مُبَصَّرُونَ"
      contradicts:
        - text: "«المُبْصِرُ: الحارِس»"
          source: "المعجم الكبير"
          conflict: "المُبصِر في المعاجم بمعنى الحارس أو المشرف لا بمعنى المُطّلع على الأسرار"
        - text: "«(المبصر) المشرف على الشَّيْء المحافظ عَلَيْهِ»"
          source: "المعجم الوسيط"
          conflict: "الدلالة المعجمية تتجه نحو الحراسة والإشراف لا نحو المعرفة بالأسرار"

    - lemma: "أَهْلُ الْبَاطِنِ"
      confirm:
        - text: "«لقب أطلق على جماعة الصوفية، لأنهم يُعنون بباطن الشريعة، وينفُذُون إلى أعماق القلوب، ولا يقفون عند أعمال الجوارح، وهم بهذا يتميزون من أهل الظاهر»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«لقب أطلق على جماعة الصوفية»"
          source: "المعجم الكبير"
          conflict: "المصطلح مقصور على الصوفية تحديداً، والمجموعة الترادفية أعمّ تشمل كل مَن أُدخل في أسرار أي مجال"


