# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلا اللمّتين خاليتان من التشكيل الكامل المطلوب"
      - "لمّة «موقف» متعددة الدلالات: تشمل المكان والحالة والمصطلح النفسي، مما يُفضي إلى اشتراك لفظي في سياق غير محدَّد"
      - "لمّة «اتجاه ذهني» تكاد تكون ترجمةً حرفية لـ mental attitude دون مراعاة التراث العربي الذي يتضمّن ألفاظاً أكثر أصالة"
      - "التعريف الحالي ترجمي الأسلوب وفيه «الميول للتصرف» التي يمكن استبدالها بما هو أجمع وأفصح"
    observations: >
      المجموعة تعالج مفهوم «الاتجاه النفسي» (attitude) بوصفه حالة ذهنية مركّبة
      تجمع المعتقد والوجدان والقيمة والاستعداد السلوكي. هذا المفهوم حديث النشأة
      في علم النفس ويعود إلى الدراسات الأمريكية في القرن العشرين. في العربية،
      اعتمد المصطلحيّون على «الاتجاه» (أو «الاتجاه النفسي» و«الاتجاه الذهني»)
      في معاجم التربية وعلم النفس، وعلى «الموقف» بدلالته التقييمية الإجرائية.
      والجذر الأنسب لغوياً هو وجه الذي يدل على المقابلة والمواجهة، وهو أصل
      «الاتجاه» وقد ذكره ابن فارس في المقاييس.

  blind_candidates:
    - lemma: "تَوَجُّهٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر وجه على وزن تَفَعُّل، يدل على إقبال المرء بوجهه نحو شيء
        بصورة نشطة؛ وهو ما يناسب الجانب الإجرائي من الاتجاه النفسي (توجيه
        الاستجابات نحو موضوع). يُستعمل في العربية المعاصرة للدلالة على التوجّه
        الفكري والنفسي.
    - lemma: "تَهَيُّؤٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر هيأ على وزن تَفَعُّل، يدل على استعداد الإنسان وتأهّبه
        للقيام بفعل معين؛ وهو ما يناسب مكوّن «الميل للتصرف» في التعريف.
        ويُفيد التهيّؤ دلالة الاستعداد الداخلي المنظَّم.
    - lemma: "نَزْعَةٌ"
      generation_method: majaz
      justification: >
        من الجذر نزع، مجازاً عن معنى الجذب والإقبال (نازعت النفس إلى الأمر:
        اشتهته وانجذبت إليه). يُستعمل في لغة علم النفس العربي للدلالة على الميل
        الداخلي والوجهة النفسية، وهو يناسب الجانب الوجداني من الاتجاه.
    - lemma: "سَجِيَّةٌ"
      generation_method: majaz
      justification: >
        من الجذر سجو (السكون والإطباق)، مجازاً إلى ما استقر في النفس من طبائع
        وميول راسخة. تُستعمل السجية عند فلاسفة الأخلاق للدلالة على الملكة
        الراسخة في النفس، وهو ما يناسب الجانب القيمي الثابت في الاتجاه النفسي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
