# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "اتجاه ذهني"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في معاجم المصطلحيات العربية المتخصصة (التربية، وعلم النفس،
        والاجتماع) بوصفها المقابل الرئيسي لـ attitude. يُؤيّدها المورد الحديث
        صراحةً: «الاتّجاه؛ الموقف النفسي». الجذر وجه يحمل دلالة المقابلة
        والتوجّه نحو موضوع بعينه، وهو ملائم للمفهوم النفسي. المركّب الوصفي
        «اتجاه + ذهني» صالح لغوياً ومستعمَل في السياق العلمي العربي.
        تحتاج اللمّة إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُمثّل المصطلح العلمي المعتمد في معاجم التربية وعلم النفس للدلالة على
        البنية النفسية الكامنة الجامعة للمكوّنات الثلاثة: المعرفي (المعتقدات
        والقيم) والوجداني (المشاعر) والسلوكي (الاستعداد للتصرف). يتسم بثبات
        أكبر وتجريد أوسع مقارنةً بـ«الموقف».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِتِّجَاهٌ ذِهْنِيٌّ"

    - lemma: "موقف"
      decision: confirmed
      decision_reason: >
        «الموقف» مستعمَل في العربية المعاصرة بمعنى الاتجاه النفسي التقييمي
        إزاء موضوع أو حدث (المورد الحديث: «موقف عقلي أو عاطفي»؛ و«الاتّجاه؛
        الموقف النفسي»). ثمة اشتراك لفظي مع المعنى المكاني لكن السياق يُزيل
        الإبهام. الجذر وقف (التمكّث في شيء) يحمل دلالة الثبات على رأي أو
        قضية. تحتاج اللمّة إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على البُعد التقييمي الإجرائي: وقوف الشخص مع قضية أو موضوع
        في سياق بعينه. أكثر ديناميكية من «الاتجاه الذهني» وأشد ارتباطاً
        بالحدث أو الموقف المحدد؛ لا يستلزم عمق المكوّنات المعرفية والوجدانية
        كاملةً بخلاف «الاتجاه الذهني».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْقِفٌ"

    - lemma: "تَوَجُّهٌ"
      source: stage1
      decision: removed
      decision_reason: >
        يُستعمَل في المصطلحيات الحديثة أساساً بمعنى «الاستهداف» في تقنية
        المعلومات و«التوجيه» في السياق الطبي، مما يُنشئ اشتراكاً لفظياً.
        يتداخل دلالياً مع «الاتجاه» الموجود أصلاً دون إضافة تمييزية، ولا
        يُقابل المفهوم النفسي المركّب الجامع للمعتقد والوجدان والقيمة.

    - lemma: "تَهَيُّؤٌ"
      source: stage1
      decision: removed
      decision_reason: >
        يدل على الاستعداد والتأهّب للفعل فحسب (أحد مكوّنات الاتجاه)، ولا
        يُعبّر عن الحالة الذهنية المركّبة الجامعة للمعتقدات والمشاعر والقيم.
        استعماله في مجال الرياضة بمعنى «الإحماء» يُبعده عن الدلالة النفسية.

    - lemma: "نَزْعَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الأساسية في المعاجم تشريحية (انحسار الشعر عن الجبهة). وإن
        كان الجذر نزع يُفيد الميل النفسي فإن «نزعة» بهذا المعنى غير مسكوكة
        معجمياً، مما يُفضي إلى اشتراك لفظي مع الدلالة التشريحية الراسخة.

    - lemma: "سَجِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        تدل على الطبع الفطري الراسخ والملكة غير القابلة للزوال (المعجم الكبير:
        «الملكة الراسخة في النفس التي لا تقبل الزوال بسهولة»)، وهو ما يعارض
        مفهوم الاتجاه النفسي الذي هو حالة مكتسبة قابلة للتعديل نسبياً.


