          source: "مسرد التربية — المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)، تعريف attitude في سياق التربية"
          addition: "تعريف تقني أكثر دقة يشمل التنظيم عبر الخبرة الشخصية وتوجيه الاستجابات؛ يُثبت أن الاتجاه في التربية العربية مصطلح راسخ بمفهوم دقيق"

    - lemma: "موقف"
      confirm:
