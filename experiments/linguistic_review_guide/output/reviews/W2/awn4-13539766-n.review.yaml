        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَقَلُّص", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13539766-n"}
    - lemma: "انْقِبَاض"
      source: stage1
      decision: confirmed
      decision_reason: "تضييق أو قصر في طول أو عرض العضلات أو الأوعية، مقبول في السياق الحيوي."
