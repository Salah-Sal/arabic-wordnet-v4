# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'تضييق' تشير غالباً إلى الفعل المتعدي (جعل الشيء ضيقاً)، بينما التعريف يشير إلى حالة أو عملية الانخفاض في العرض (Narrowing) والتي يعبر عنها الفعل اللازم أو المطاوع 'تضيق' بشكل أدق."
    observations: "المفهوم يشير إلى عملية نقص العرض (narrowing) أو الحالة الناتجة عنها. المصطلح التقني الأشيع هو 'تضيق' (بالمعنى الطبي والجيولوجي وغيره)، بينما 'تضييق' يشيع في سياق التقييد أو الإجراء المتعمد. 'ضيق' يعبر عن الصفة أو الحالة الثابتة."
  blind_candidates:
    - lemma: "تَضَيُّق"
      generation_method: ishtiqaq
      justification: "مصدر الفعل 'تضيّق' (على وزن تفعُّل)، وهو الأدق لوصف صيرورة الشيء ضيقاً أو عملية نقص العرض."
    - lemma: "تَقَلُّص"
      generation_method: ishtiqaq
      justification: "يشير إلى انضمام أجزاء الشيء ونقص حجمه أو عرضه."
    - lemma: "انْقِبَاض"
      generation_method: ishtiqaq
      justification: "يُستخدم في السياق البيولوجي والعضلي لوصف تضيق الممر أو العضو."
    - lemma: "انْضِمَام"
      generation_method: ishtiqaq
      justification: "انضمام الأطراف أو الأجزاء يؤدي إلى تضيق المسافة بينها."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَضَيُّق"
      confirm:
        - text: "«تضيُّق الوادي: [في الانكليزية] narrowing of valley»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
        - text: "«تضيُّق، ضيق: [في الانكليزية] stenosis; narrowing»"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
      expands:
        - text: "«تضيّق ثوبه: انضمّ بعضه إلى بعض فلم يتَّسع لما فيه وقصر عنه، تقلَّص»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "تَضْيِيق"
      confirm:
        - text: "«ضيَّق الطَّريقَ: جعلها تضيق، قلَّلل اتِّساعها»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "ضِيق"
      confirm:
        - text: "«الضِّيقُ: ضدّ السَّعة»"
          source: "المعجم الوسيط"
        - text: "«ضيق أفق: عدم اتساع في مدارك العقل»"
          source: "المعجم الكبير"
    - lemma: "تَقَلُّص"
      confirm:
        - text: "«الْقَافُ وَاللَّامُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْضِمَامِ شَيْءٍ بَعْضِهِ إِلَي بَعْضٍ. يُقَالُ: تَقَلَّصَ الشَّيْءُ، إِذَا انْضَمَّ»"
          source: "مقاييس اللغة"
    - lemma: "انْقِبَاض"
      confirm:
        - text: "«انقباض: [في الانكليزية] contraction»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
        - text: "«systole: انقباض»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
