        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13539766-n"}

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "انخفاض في العرض"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويستخدم 'انخفاض' وهو أقل دقة من 'نقصان' أو 'تراجع' في سياق الأبعاد الفيزيائية."
    authored:
      - type: terminological
        text: "نُقْصَانٌ في العَرْضِ أو الاتِّسَاعِ، ممَّا يَجعلُ الشَّيءَ ضَيِّقًا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13539766-n", definition_index: 0, text: "نُقْصَانٌ في العَرْضِ أو الاتِّسَاعِ، ممَّا يَجعلُ الشَّيءَ ضَيِّقًا."}
  examples:
    per_lemma:
      - lemma: "تَضْيِيق"
        examples:
          - text: "قامتِ البلديَّةُ بتضييقِ ممرَّاتِ المشاةِ لتوسيعِ الشَّارعِ."
            type: usage
      - lemma: "تَضَيُّق"
        examples:
          - text: "أدَّى تَضَيُّقُ المَجْرى المائيِّ إلى زيادةِ سرعةِ التَّيَّارِ."
            type: usage
      - lemma: "ضِيق"
        examples:
          - text: "يُعَانِي المُسَافِرُونَ من ضِيقِ مَسَاحَةِ المَقَاعِدِ في الطَّائِرَةِ."
            type: usage
      - lemma: "تَقَلُّص"
        examples:
          - text: "لاحَظَ المُهَنْدِسُ تَقَلُّصَ عَرْضِ الجِسْرِ بسببِ تَمَدُّدِ القَوَاعِدِ الجَانِبيَّةِ."
            type: usage
      - lemma: "انْقِبَاض"
        examples:
          - text: "يؤدِّي انْقِبَاضُ الأوعيةِ الدَّمويَّةِ إلى ارتفاعِ ضغطِ الدَّمِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-13539766-n", text: "تَسبَّبَ تَضَيُّقُ الطَّريقِ الجبليِّ في صُعُوبةِ مرورِ الشَّاحناتِ الكبيرةِ."}

