      decision_reason: "يعبر عن الحالة الناتجة عن نقص العرض (ضد السعة)، ويُستخدم كمرادف للعملية في سياقات معينة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ضِيق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13539766-n"}
    - lemma: "تَقَلُّص"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي يتضمن معنى انضمام الأجزاء ونقص الحجم أو العرض، وهو متسق مع دلالة المجموعة."
