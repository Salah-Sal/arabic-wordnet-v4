# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (فترة مفتوحة) خالية من التشكيل"
      - "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) يستخدم (مجال مفتوح) = open interval، وليس (فترة مفتوحة)، مما يُنشئ ازدواجاً اصطلاحياً رسمياً"
      - "المعجم الرياضي ذاته يستخدم (فترة مغلقة) = closed interval، فالتوازي الداخلي مكسور: فترة مغلقة ↔ مجال مفتوح"
      - "قد يختلط مفهوم (unbounded interval) الإنجليزي المذكور في OEWN عن (open interval) رياضياً: الأول يشير إلى فترة تمتد إلى اللانهاية، والثاني إلى فترة لا تحوي طرفيها — وهما ليسا مترادفَيْن بالمعنى الصارم"
    observations: >
      هذه المجموعة تصف مفهوماً رياضياً دقيقاً من مجال التحليل الحقيقي؛
      الفترة المفتوحة هي مجموعة من الأعداد الحقيقية تشمل كلَّ عدد واقع بين حدَّيْن
      دون أن تشمل الحدَّيْن أنفسيهما، ويُرمز إليها بـ]أ، ب[ أو (أ، ب).
      الجنس القريب هو "فترة" (awn4-06025625-n)، والفصل النوعي هو استبعاد الطرفين.
      اللمّة الموجودة (فترة مفتوحة) مبنيّة على النمط الوصفي الصحيح
      ومتوازنة مع المرادف المُقابِل (فترة مغلقة)، غير أن المعجم الرياضي الرسمي
      يعتمد (مجال مفتوح) للمفهوم ذاته، وهو تناقض ينبغي حلّه بإضافة المصطلحَيْن معاً.
  blind_candidates:
    - lemma: "مَجَالٌ مَفْتُوحٌ"
      generation_method: tarkib
      justification: >
        مركّب وصفي (مجال + مفتوح)؛ المجال في الرياضيات يُستعمل للدلالة على الفضاء
        أو المنطقة التي يسري فيها متغيّر، والمفتوح يقابل المغلق في المصطلح الرياضي.
        هذا المصطلح شائع في كتب التحليل الرياضي العربية للتعبير عن مجموعة مفتوحة
        أو فترة مفتوحة.
    - lemma: "قِطْعَةٌ مَفْتُوحَةٌ"
      generation_method: tarkib
      justification: >
        مركّب وصفي بالقياس على (قطعة مغلقة = closed segment) الموجود في المعجم
        الرياضي؛ القطعة تدلّ على الامتداد الخطي بين نقطتين، والمفتوحة تُبرز
        استبعاد الطرفين. يُستعمل هذا التعبير في بعض المصادر للفترة المفتوحة.
    - lemma: "فَتْرَةٌ مُنْفَتِحَةٌ"
      generation_method: tarkib
      justification: >
        مركّب وصفي يستخدم (منفتحة) اسمَ فاعل الفعل (انفتح)، وهو أبلغ دلالةً من
        (مفتوحة) في التعبير عن الطبيعة الهيكلية للفترة؛ إذ الانفتاح يُشير إلى
        صفة ذاتية في الفترة لا إلى فعل خارجي فُتحت به.
    - lemma: "الفَتْرَةُ اللَّامَحْدُودَةُ"
      generation_method: tarkib
      justification: >
        مركّب إضافي وصفي يُغطّي المعنى الثاني للمجموعة (unbounded interval)؛
        اللامحدودة من (لا + محدودة) = غير مقيّدة الطرفين، مما يعكس الفترة الممتدة
        إلى اللانهاية من جهة أو جهتين.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت (٥ استعلامات):
# ١. مطابقة دفعية: فترة مفتوحة، الفترة المفتوحة، مجال مفتوح، المجال المفتوح،
#    قطعة مفتوحة، القطعة المفتوحة، فترة منفتحة، الفترة اللامحدودة، فترة، المجال
# ٢. جسر إنجليزي: open interval، unbounded interval، open set، interval
# ٣. FTS عربي: فترة، مجال، نهاية، مفتوح، مغلق، محدود، طرف
# ٤. جوار رقمي في المعجم الرياضي (entry_ids 415289-416914) لرسم النمط الاصطلاحي
# ٥. مقاييس اللغة لابن فارس (dictionary_id=151): فتر، فتح، جول
stage2_evidence:
  per_lemma:
    - lemma: "فترة مفتوحة"
      expands:
        - text: "«فترة مغلقة» — translation_en: closed interval — translation_fr: intervalle fermé — domain: Mathematics and Astronomy"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك، أليكسو (1990) — entry_id: 415290"
          addition: >
            وجود (فترة مغلقة) كمصطلح رسمي للفترة المغلقة يُرسّخ النمط الاصطلاحي
            (فترة + صفة)، مما يُضفي مشروعيةً قياسيةً على (فترة مفتوحة) وإن غاب
            المصطلح صراحةً عن هذا المعجم.
        - text: "«الفترة: الضعف والانكسار المدة تقع بين زمنَيْن أو نبيَّيْن... فترة الحُمَّى: زمن سكونها بين نوبتين»"
          source: "المعجم الوسيط (ocr) — entry_id: 21196"
          addition: >
            (فترة) في الاستعمال العربي تُفيد المدةَ أو المساحةَ بين حدَّيْن، مما
            يُسوّغ توسيعها للدلالة على المجال الرياضي (الفترة الرياضية).
        - text: "«فترة» — translation_en: interval — domain: Electropedia / Veterinary Medicine / Physics"
          source: "ARABTERM متعدد المصادر (IEC 60050، معجم الطب البيطري، معجم الفيزياء)"
          addition: >
            (فترة) مُعتمَدة في عدة معاجم تقنية كمقابل لـ(interval)، مما يُعزّز
            استخدامها أساساً للتوصيف الرياضي (فترة مفتوحة / فترة مغلقة).

    - lemma: "مجال مفتوح"
      confirm:
        - text: "«مجال مفتوح» — translation_en: open interval — translation_fr: intervalle ouvert — domain: Mathematics and Astronomy"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك، أليكسو (1990) — entry_id: 416911"

    - lemma: "قطعة مفتوحة"
      contradicts:
        - text: "«قطعة مفتوحة» — translation_en: open segment — translation_fr: segment ouvert — domain: Mathematics and Astronomy"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك، أليكسو (1990) — entry_id: 416912"
          conflict: >
            (قطعة مفتوحة) تقابل (open segment) لا (open interval). القطعة المفتوحة
            مفهوم هندسي مستقل يختلف عن الفترة المفتوحة في التحليل الحقيقي.

    - lemma: "فترة منفتحة"
      evidence_status: "no_material_found"

    - lemma: "الفترة اللامحدودة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "فترة مفتوحة"
      decision: confirmed
      decision_reason: >
        مركّب وصفي صحيح بنيةً وقياساً؛ يتوازى مع (فترة مغلقة = closed interval)
        الموثَّق في المعجم الرياضي الرسمي. (فترة) معتمَدة في معاجم متعددة كمقابل
        لـ(interval)، و(مفتوح) من الجذر (فتح) الذي يدل على خلاف الإغلاق.
        التشكيل ناقص فيحتاج إلى تحديث.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز (فترة مفتوحة) الطابعَ الزمني-المساحي للمجال الرياضي، متّسقاً مع
        جنس المجموعة (فترة) ومع المصطلح الشقيق (فترة مغلقة). يُستحسن حين يُراد
        التوكيد على الانسجام الأسري في المصطلح (open/closed interval).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَتْرَةٌ مَفْتُوحَةٌ"

    - lemma: "مجال مفتوح"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مُعتمَد رسمياً في المعجم الموحد لمصطلحات الرياضيات والفلك (أليكسو
        1990) بوصفه المقابل العربي الوحيد لـ(open interval): entry_id 416911،
        translation_en: "open interval"، translation_fr: "intervalle ouvert".
        يجب إضافته لضمان تغطية الاستخدام الرياضي المعياري.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز (مجال مفتوح) الطابعَ الطوبولوجي-الفضائي للمفهوم؛ (المجال) في
        الرياضيات يُشير إلى الفضاء الذي يسري فيه متغيّر. هو المصطلح الرسمي
        المعتمَد في المعجم الرياضي الموحَّد، ويُستعمل في الكتابة الأكاديمية
        لما يُراد التوكيد على الطابع الطوبولوجي.
      actions:
        - command: create_entry
          params:
            lemma: "مَجَالٌ مَفْتُوحٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "قطعة مفتوحة"
      source: stage1
      decision: removed
      decision_reason: >
        (قطعة مفتوحة) موثَّقة في المعجم الرياضي الرسمي لكنها تقابل (open segment)
        لا (open interval). القطعة المفتوحة مفهوم هندسي مستقل؛ إضافتها ستُحدث
        اشتراكاً دلالياً مضلِّلاً في هذه المجموعة.

    - lemma: "فترة منفتحة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أساس معجمي لـ(منفتحة) في الاصطلاح الرياضي؛ وزن (مُنْفَتِح) اسم فاعل
        للفعل الانعكاسي (انفتح) يُفيد التلقّي الذاتي، بينما (مفتوحة) اسم مفعول
        أدقّ دلالةً لوصف خاصية بنيوية محددة في تعريف الفترة.

    - lemma: "الفترة اللامحدودة"
      source: stage1
      decision: removed
      decision_reason: >
        (اللامحدودة = unbounded) تصف فترةً تمتد إلى اللانهاية، وهو مفهوم مختلف
        رياضياً عن (المفتوحة = open) التي تصف استبعاد الطرفين الموجودَيْن. إدراجهما
        في مجموعة ترادفية واحدة مُشكِل علمياً؛ لا يُضاف هذا المصطلح لهذه المجموعة.


