stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يعاني من الدور (حالة كونه تقنياً)، حيث استخدم المشتق في تعريف المصدر."
      - "اللفظ 'فنية' قد يلتبس مع الجماليات الفنية (Artistry) بينما المقصود هنا الجانب التقني (Technicality)."
    observations: "المجموعة تغطي المفهوم المجرد للصفة التقنية أو الحالة التي يكون عليها الشيء من حيث تعقيده الإجرائي أو تخصصه."
  blind_candidates:
    - lemma: "تَقْنِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من 'تقني'، وهو اللفظ الأشيع للتعبير عن الحالة التقنية."
    - lemma: "تَقَانَة"
      generation_method: ishtiqaq
      justification: "لفظ عربي فصيح من الجذر (تقن) يعبر عن علم الصنائع أو الإحكام التقني."
    - lemma: "فَنِّيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من 'فني'، ويستخدم للتعبير عن الجودة التقنية أو الصفة المهنية المتخصصة."
    - lemma: "اصْطِلَاحِيَّة"
      generation_method: ishtiqaq
      justification: "للتعبير عن حالة كون الشيء مصطلحاً أو خاضعاً لمواصفات اصطلاحية معينة، وهو ما ورد في التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "تَقْنِيَّة"
      confirm:
        - text: "«(فى اليونانية Technicitechne الفنّ والصِّناعة)»"
          source: "المعجم الكبير"
        - text: "«الصِّفة التِّقنيّة»"
          source: "المورد الحديث"
      expands:
        - text: "«وسيلة تكيف حسب غاية، وطريقة خاصة تستعمل لإنجاز عمل جيد»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "فَنِّيَّة"
      confirm:
        - text: "«لما له قيمة فنية أو أثرية»"
          source: "المعجم الوسيط"
        - text: "«بخبرة فنية عالية»"
          source: "المعجم الكبير"
    - lemma: "تَقَانَة"
      confirm:
        - text: "«جُملة المَبادىء والوَسائِل التى تُعين على إنجاز شيء أو تَحْقِيق غايَة»"
          source: "المعجم الكبير"
        - text: "«علم الصنائع والفنون»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
    - lemma: "اصْطِلَاحِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَقْنِيَّة"
      decision: confirmed
      decision_reason: "هي اللفظ المعياري المعاصر للتعبير عن الصفة التقنية والحالة الإجرائية التخصصية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance: "تركز على الجانب الإجرائي والمنهجي الدقيق (Technique/Technicality)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْنِيَّة"
    - lemma: "فَنِّيَّة"
      decision: confirmed
      decision_reason: "تستخدم بكثرة للتعبير عن الخصائص المهنية أو التقنية لشيء ما، وإن كانت تشترك مع المعنى الجمالي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance: "تربط الجانب التقني بالمهارة والبراعة في التنفيذ (Artistry/Technical Skill)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَنِّيَّة"
    - lemma: "تَقَانَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي مُحيى، يدعمه المعجم الكبير ومعاجم المصطلحات الموحدة كمرادف للتقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance: "تُوحي بالعلم النظري الكامن وراء الصنعة (Technology)."
      actions:
        - command: create_entry
          params: {lemma: "تَقَانَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حالة كونه تقنياً كما في استخدام المصطلحات أو الأساليب التقنية"
    assessment:
      decision: revise
      reason: "التعريف الحالي دوري (استخدام المشتق في التعريف) ومحدود."
    authored:
      - type: terminological
        text: "الصِّفَةُ التِي يَتَّصِفُ بِهَا الشَّيْءُ مِنْ حَيْثُ ارْتِبَاطُهُ بِأُصُولِ عِلْمٍ أَوْ مِهْنَةٍ، أَوْ حَالَةُ كَوْنِ الأَمْرِ مُتَعَلِّقًا بِالجَوَانِبِ الإِجْرَائِيَّةِ التَّخَصُّصِيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الصِّفَةُ التِي يَتَّصِفُ بِهَا الشَّيْءُ مِنْ حَيْثُ ارْتِبَاطُهُ بِأُصُولِ عِلْمٍ أَوْ مِهْنَةٍ، أَوْ حَالَةُ كَوْنِ الأَمْرِ مُتَعَلِّقًا بِالجَوَانِبِ الإِجْرَائِيَّةِ التَّخَصُّصِيَّةِ."
  examples:
    per_lemma:
      - lemma: "تَقْنِيَّة"
        examples:
          - text: "يَتَمَيَّزُ هَذَا الكِتَابُ بِتَقْنِيَّةٍ عَالِيَةٍ فِي عَرْضِ المَعْلُومَاتِ."
            type: usage
      - lemma: "فَنِّيَّة"
        examples:
          - text: "تَحْتَاجُ هَذِهِ المَسْأَلَةُ إِلَى خِبْرَةٍ فَنِّيَّةٍ دَقِيقَةٍ لِحَلِّهَا."
            type: usage
      - lemma: "تَقَانَة"
        examples:
          - text: "تَقَانَةُ المَعْلُومَاتِ أَصْبَحَتْ جُزْءًا لا يَتَجَزَّأُ مِنَ الحَيَاةِ المُعَاصِرَةِ."
            type: usage

