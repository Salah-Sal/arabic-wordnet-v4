    concerns:
      - "التعريف الحالي سلبيّ المنطق (ليست اصطناعية) دون إيجاب دلالي يُميّز المفهوم"
      - "التعريف يُعيد كلمة «ظواهر» من الجنس القريب (المفردة الأمّ) دون إضافة تمييزية كافية"
      - "اللمّة الواحدة (ظاهرة طبيعية) تخلو من التشكيل الكامل"
      - "المجموعة تفتقر إلى تعريف موسوعي يُعدِّد أنماط الظواهر الطبيعية"
    observations: >
      المجموعة تمثّل مفهوماً مقابلاً لـ «الظاهرة الاصطناعية»، أي كل ما يجري في الطبيعة
      دون تدخّل إنساني. اللمّة الموجودة «ظاهرة طبيعية» تركيب وصفي شائعٌ في المعاجم
      التقنية العربية وقد أثبتته معاجم أليكسو ومكنز AGROVOC. الجذر الأساسي «ظهر» يحمل
      معنى البروز والانكشاف، مما يجعل «الظاهرة» مصطلحاً ملائماً لما يُدرَك بالحواس.
      أمّا القيد «الطبيعية» فمشتقٌّ من «طبع» الدالّ على السجيّة الفطرية للشيء.

  blind_candidates:
