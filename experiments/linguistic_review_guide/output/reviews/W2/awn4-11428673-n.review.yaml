        اشتقاق من الجذر (ط ب ع) على وزن فَعَلِيَّات، وهو وزن منتج في العربية لتجميع
        الظواهر والعلوم (رياضيات، كيميائيات). المراد: مجموع الظواهر الطبيعية الفطرية
        بوصفها حقلاً دلالياً متمايزاً عن الصناعي.

    - lemma: "كَوْنِيَّات"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من (ك و ن) على وزن فَعَلِيَّات، إذ الكون يدلّ على ما حدث وظهر في الوجود
        بقوى طبيعية. المصطلح يُركّز على البُعد الوجودي للظاهرة بعيداً عن التدخّل الإنساني،
        وهو مشابه لـ «cosmic phenomena» إنجليزياً.

    - lemma: "حَوَادِثُ طَبِيعِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي: حوادث (ج حادثة، من ح د ث) + طبيعية. يتجنّب لفظ «ظاهرة» الوارد في
        التعريف. «الحادثة» تعني الواقعة التي تبرز دون تخطيط، مما يُقابل الاصطناعي
        المقصود والمُدَبَّر.

    - lemma: "آيَاتُ الطَّبِيعَة"
      generation_method: majaz
      justification: >
        مجاز بإحياء لفظ «آية» (من أ ي ي) بمعنى العلامة الكونية. «آيات الكون» و«آيات
        الطبيعة» تعبيرٌ قرآني الأصل يدلّ على ظواهر الكون المُدرَكة بالحواس، ويُقابل
        تعريف المفردة الأمّ (يُعرف من خلال الحواس).


