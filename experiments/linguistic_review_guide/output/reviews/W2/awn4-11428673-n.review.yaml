      decision_reason: >
        «طبيعيات» في تراث العربية العلمي يُرادف «علم الطبيعيات» أي الفيزياء
        (Natural Philosophy/Physics)، لا مجموعة الظواهر الطبيعية بما تشمل من جيولوجيا
        وفلك وأحياء. استعماله هنا يُفضي إلى اشتراك لفظي مُضلِّل. علاوةً على ذلك،
        لم يُعثر له على مادة معجمية تثبّته بالمعنى المطلوب.

    - lemma: "كَوْنِيَّات"
