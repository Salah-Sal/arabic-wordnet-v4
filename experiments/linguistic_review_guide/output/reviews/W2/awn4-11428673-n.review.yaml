        أليكسو المتخصصة، وفي المعجم الكبير والوسيط. التركيب الوصفي «ظاهرة + طبيعية» نمطٌ
        معجمي عربي مُحكَم تكرّر في المعاجم الحديثة (ظاهرة جوية، ظاهرة مائية، ظاهرة
        اجتماعية). اللمّة تجتاز اختبار السكّ: لا يمكن إبدال «طبيعية» بـ«كونية» أو
        «فطرية» مع الإبقاء على الدلالة ذاتها في كل السياقات التقنية. تجتاز بوابة الجودة:
        اطّراد وشيوع، يُسر التداول، ملاءمة، تراثي الأصل، عربي الاشتقاق، واضح الاشتقاقية.
