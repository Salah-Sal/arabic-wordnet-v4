stage1_review:
  blind_generation:
    - lemma: خَبْزَة
      generation_method: ishtiqaq
      justification: "اسم مرة من الفعل خبز، يُطلق على المرة الواحدة من الخبز وما ينتج عنها من خبز في دفعة واحدة."
    - lemma: دُفْعَةُ خُبْزٍ
      generation_method: tarkib
      justification: "تركيب إضافي من دفعة (batch) وخبز، يعبر بدقة عن مجموعة الأرغفة المخبوزة معاً."
    - lemma: وَجْبَةُ خَبْزٍ
      generation_method: tarkib
      justification: "تركيب إضافي يُستعمل للدلالة على مقدار ما يُنجز أو يُحضّر في مرة واحدة."
    - lemma: طَرْحَةُ فُرْنٍ
      generation_method: majaz
      justification: "مجاز من طرح العجين في الفرن، تُستعمل في العامية وبعض الفصحى للتعبير عن دفعة المخبوزات."
  initial_assessment:
    concerns: []
    observations: "المفهوم مرتبط بعملية الخبز. اللمات الموجودة تعبر عنه إما باسم المرة (خبزة) أو بالتركيب الإضافي المباشر (دفعة خبز)."

stage2_evidence:
  - lemma: خَبْزَة
    status: confirm
    source: "المورد الحديث (2008)"
    text: "«(1) خَبْزَة؛ عَجْنة (2) «أ», الدُّفعة: «ب» كميّة المادة الضروريةُ لإنتاج شيءٍ ما بعملية واحدة a batch of dough.»"
  - lemma: دُفْعَةُ خُبْزٍ
    status: confirm
    source: "موقع ArabTerm"
    text: "«دَفْعَة: batch / batch size» وتركيبها مع (خبز) شائع وقياسي."

