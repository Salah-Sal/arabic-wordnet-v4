stage1_review:
  assessment:
    concerns:
      - "المصطلحات الحالية (تآزر، تعاضد) دقيقة جداً، غير أنها تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي يبدو كترجمة حرفية للتعريف الإنجليزي ويحتاج إلى صياغة معجمية أسلس."
    observations: "المفهوم يشير إلى التضافر والتآزر بين القوى (سواء أدوية، عضلات، جهود) لإنتاج أثر كلي يفوق مجموع الآثار الفردية (Synergy). الجذور 'أزر'، 'عضد'، 'ضفر' تعبر بامتياز عن هذه الدلالات."
  blind_candidates:
    - lemma: "تَضَافُر"
      generation_method: ishtiqaq
      justification: "من الجذر 'ضفر' (تداخل وتضافر الجهود) لإنتاج نتيجة أكبر وقوة مضاعفة."
    - lemma: "تَكَاتُف"
      generation_method: ishtiqaq
      justification: "من 'كتف'، ويعني التآزر والوقوف جنباً إلى جنب لتحقيق تأثير أو هدف مشترك."
    - lemma: "تَسَانُد"
      generation_method: ishtiqaq
      justification: "من 'سند'، حيث يستند كل جزء للآخر لتعزيز التأثير الكلي وتقويته."
    - lemma: "تَآزُرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'تآزر' للدلالة صراحة على مفهوم التآزر والتفاعل ذي الأثر المضاعف."

stage2_evidence:
  per_lemma:
    - lemma: "تآزر"
      confirm:
        - text: "«تراكم تأثير العوامل بحيث يكون مجموع تأثيراتها أكثر من مجرد المجموع الحسابيّ لها.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«القيام بعمل أو تأثير، جنبا إلى جنب وفي وقت واحد من طرف عاملين أو أكثر من القوى المؤثرة، بحيث يكون التأثير الكلي الناتج هو أكبر من مجموع التأثيرات لكل على حدة. ذلك هو تأثير عمل الشبكة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
    - lemma: "تعاضد"
      confirm:
        - text: "«(تعاضد) الْقَوْم تعاونوا وتناصروا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "تضافر"
      confirm:
        - text: "«تضافرَتِ الأَدِلَّةُ على كذا: تَسانَدَتْ وقَوَّى بعضُها بعضًا»"
          source: "المعجم الكبير"
    - lemma: "تكاتف"
      confirm:
        - text: "«(تكاتف) الْقَوْم تساعدوا وتعاضدوا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "تساند"
      confirm:
        - text: "«القومُ أو الجَيْشُ: خرجوا متعاونين؛ كأَنَّ كُلَّ واحدٍ يُسْنِدُ على الآخر ويستعينُ به. الناسُ: تعاونوا وساعد بعضُهم بعضًا.»"
          source: "المعجم الكبير"
    - lemma: "تآزرية"
      confirm:
        - text: "«synergy : تَآزُرِيَّة»"
          source: "المعجم الطبي الموحد (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "تآزر"
      decision: confirmed
      decision_reason: "المصطلح الأدق والمعتمد في المعاجم الطبية والعلمية الحديثة لمفهوم 'synergy' أو 'synergism' للتعبير عن الأثر المضاعف للتعاون."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَآزُر"
    
    - lemma: "تعاضد"
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على التعاون والتناصر، ويستخدم بكثرة في السياقات العلمية والبيولوجية (كتعاضد العضلات) ليدل على مساعدة الأعضاء لبعضها البعض."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَاضُد"

    - lemma: "تضافر"
      source: stage1
      decision: confirmed
      decision_reason: "معنى التقوية والمساندة المتبادلة ظاهر بوضوح، ويستخدم كثيراً للدلالة على العمل المشترك الذي يضاعف الأثر (تضافر الجهود، تضافر العوامل)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَضَافُر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تكاتف"
      source: stage1
      decision: confirmed
      decision_reason: "يعني التعاضد والمساندة ('تساعدوا وتعاضدوا')، ويصلح لتمثيل المفهوم بشكل عام وإن كان تركيزه أكثر على الجهد البشري أو المجتمعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَكَاتُف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تساند"
      source: stage1
      decision: removed
      decision_reason: "رغم تقاربه، إلا أنه أقرب للتعاون المجرد والمساعدة، ولا يحمل بقوة معنى تضاعف الأثر المُميِّز لمفهوم Synergy مقارنة بـ 'تآزر' أو 'تضافر'."

    - lemma: "تآزرية"
      source: stage1
      decision: removed
      decision_reason: "المصدر الصريح 'تَآزُر' أدق وأكثر شيوعاً كاسم (Noun) من المصدر الصناعي 'تآزرية' الذي يُفضل استخدامه غالباً كصفة أو اسم مجرد خالص."

stage4_content:
  definition:
    current: "عمل شيئين معاً (عضلات أو أدوية مثلاً) لإنتاج تأثير أكبر من مجموع تأثيراتهما الفردية"
    assessment:
      decision: revise
      reason: "التعريف الحالي قريب من الترجمة الحرفية، ويمكن تحسين صياغته لتكون أقرب لأسلوب المعاجم العربية وتزيد من دقة التعبير عن 'الأثر المضاعف'."
    authored:
      - type: terminological
        text: "تَفَاعُل أَوْ تَعَاوُن بَيْنَ عَامِلَيْنِ أَوْ أَكْثَرَ (كَالأَدْوِيَةِ أَوِ الْعَضَلَاتِ) لِإِنْتَاجِ تَأْثِيرٍ كُلِّيٍّ يَفُوقُ مَجْمُوعَ تَأْثِيرَاتِهَا مُنْفَرِدَةً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "تَفَاعُل أَوْ تَعَاوُن بَيْنَ عَامِلَيْنِ أَوْ أَكْثَرَ (كَالأَدْوِيَةِ أَوِ الْعَضَلَاتِ) لِإِنْتَاجِ تَأْثِيرٍ كُلِّيٍّ يَفُوقُ مَجْمُوعَ تَأْثِيرَاتِهَا مُنْفَرِدَةً."}

  examples:
    per_lemma:
      - lemma: "تآزر"
        examples:
          - text: "أَثْبَتَتِ الدِّرَاسَةُ وُجُودَ تَآزُرٍ بَيْنَ الدَّوَائَيْنِ فِي مُكَافَحَةِ الْمَرَضِ."
            type: usage
      - lemma: "تعاضد"
        examples:
          - text: "يَعْمَلُ تَعَاضُدُ الْعَضَلَاتِ عَلَى زِيَادَةِ قُوَّةِ الْحَرَكَةِ."
            type: usage
      - lemma: "تضافر"
        examples:
          - text: "أَدَّى تَضَافُرُ الْجُهُودِ إِلَى نَتَائِجَ تَفُوقُ التَّوَقُّعَاتِ."
            type: usage
      - lemma: "تكاتف"
        examples:
          - text: "يُعَدُّ تَكَاتُفُ أَعْضَاءِ الْفَرِيقِ عَامِلًا حَاسِمًا فِي إِنْجَازِ الْمَشْرُوعِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أَثْبَتَتِ الدِّرَاسَةُ وُجُودَ تَآزُرٍ بَيْنَ الدَّوَائَيْنِ فِي مُكَافَحَةِ الْمَرَضِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يَعْمَلُ تَعَاضُدُ الْعَضَلَاتِ عَلَى زِيَادَةِ قُوَّةِ الْحَرَكَةِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أَدَّى تَضَافُرُ الْجُهُودِ إِلَى نَتَائِجَ تَفُوقُ التَّوَقُّعَاتِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعَدُّ تَكَاتُفُ أَعْضَاءِ الْفَرِيقِ عَامِلًا حَاسِمًا فِي إِنْجَازِ الْمَشْرُوعِ."}

stage5_enrichment:
  per_entry:
    - lemma: "تآزر"
      entry_id: "{auto}"
      root: "ازر"
      maqayis_quote: "«الْهَمْزَةُ وَالزَّاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْقُوَّةُ وَالشِّدَّةُ، يُقَالُ: تَأَزَّرَ النَّبْتُ: إِذَا قَوِيَ وَاشْتَدَّ.»"
    - lemma: "تعاضد"
      entry_id: "{auto}"
      root: "عضد"
      maqayis_quote: "«الْعَيْنُ وَالضَّادُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عُضْوٍ مِنَ الْأَعْضَاءِ ; يُسْتَعَارُ فِي مَوْضِعِ الْقُوَّةِ وَالْمُعِينِ.»"
    - lemma: "تضافر"
      entry_id: "{auto}"
      root: "ضفر"
      maqayis_quote: "«الضَّادُ وَالْفَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ، وَهُوَ ضَمُّ الشَّيْءِ إِلَى الشَّيْءِ نَسْجًا أَوْ غَيْرَهُ عَرِيضًا... وَمِنَ الْبَابِ قَوْلُهُمْ: تَضَافَرُوا عَلَيْهِ، أَيْ تَعَاوَنُوا.»"
    - lemma: "تكاتف"
      entry_id: "{auto}"
      root: "كتف"
      maqayis_quote: "«الْكَافُ وَالتَّاءُ وَالْفَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عِرَضٍ فِي حَدِيدَةٍ أَوْ عَظْمٍ... وَمِنْهُ الْكَتِفُ.»"

  per_sense:
