# ── المرحلة ١: المراجعة والتوليد (أعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «حركية خلوية» تستخدم الصيغة الوصفية (wasfi) في حين المصطلح المعجمي المعتمد في أمهات المعاجم الطبية هو الإضافي «حركية الخلية»؛ مما يُثير تساؤلاً حول درجة التوثيق."
      - "التعريف الحالي يحتوي على خلل نحوي: «مما يؤدي إلى الانفصال لخليتين» — الصواب «إلى خليتين وليدتين» بحذف كلمة الانفصال أو إعادة صياغتها."
      - "صيغة «تتكون من انقسام» ركيكة في التعريف — الأسلوب المعجمي يستدعي «تتمثّل في» أو «تقوم على»."
      - "غياب التشكيل الكامل عن اللمّتين الموجودتين."
    observations: >
      المجموعة تُعبّر عن مفهوم بيولوجي دقيق هو «انقسام السيتوبلازم» (cytokinesis)، وهو
      مرحلة تعقُب انقسام النواة (karyokinesis) في دورة الخلية. المفهوم موثَّق في المعجمية
      العربية الحديثة توثيقاً جيداً بمصطلح «انقسام السيتوبلازم»، الذي يحتوي على مكوِّن
      معرَّب (سيتوبلازم). أما «حركية خلوية» فمصطلح طبي يستخدم استعارة الحركة (kinesis)
      للتعبير عن الفاعلية والنشاط الخلوي، وهو أقرب إلى لغة علم التشريح الطبي منه إلى لغة
      الوراثة. كلا المصطلحين يصلحان للمجموعة مع فارق في الدقة والاستخدام التخصصي.

  blind_candidates:
    - lemma: "اِنْفِلَاق الهَيُولَى"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «انفلاق» (مصدر انفعال من جذر فَلَقَ بمعنى الفُرجة والبَيْنونة في الشيء)
        و«الهيولى» (المقابل الكلاسيكي للسيتوبلازم في المعجمية الطبية العربية). يصف العملية
        المادية لانشقاق المادة الخلوية. جذر فلق قرآني (فَالِقُ الْحَبِّ وَالنَّوَى) مما يُكسب
        الاصطلاح بُعداً تراثياً، وفيه إحياء للفظ «الهيولى» بديلاً عن المعرَّب «السيتوبلازم».
    - lemma: "تَجَزُّؤ الهَيُولَى"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «تجزّؤ» (مصدر تفعّل من جذر جزأ على وزن التفعّل الدال على التلقائية)
        و«الهيولى». يُعبّر عن انفصام المادة الخلوية إلى أجزاء مستقلة. وزن تَفَعُّل منتج في
        المصطلحية العربية للعمليات الذاتية.
    - lemma: "الاِنْشِطَار الهَيُولِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «الانشطار» (مصدر انفعال من جذر شَطَرَ = التقسيم إلى نصفين)
        و«الهيولوي» (نسبة إلى الهيولى/السيتوبلازم). يُوحي بتقسيم المادة إلى نصفين
        متساويين، وهو ما يصف دلالياً عملية تقسيم الخلية بعد انقسام النواة.
    - lemma: "سَيْتُوكِينِيزِيَا"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح اليوناني-اللاتيني «cytokinesis» بإضافة ألف المد في النهاية
        (على نمط «ميتوكوندريا، فاكيوليا»). يقبل لام التعريف والنسبة والجمع السالم.
        ملاذٌ أخير بعد استنفاد الأصيل والاشتقاقي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٤ استعلامات):
# ١. مطابقة دفعية شاملة: جميع اللمّات الموجودة + المرشحات + المكوّنات
# ٢. جسر إنجليزي: cytokinesis + cytoplasm division + karyokinesis + cell division
# ٣. FTS بالكلمات المفتاحية: انقسام السيتوبلازم + هيولى + سيتوبلازم
# ٤. مقاييس اللغة: جذور قسم، حرك، فلق، شطر، هيل، جزأ، خلو
stage2_evidence:
  per_lemma:

    - lemma: "انقسام السيتوبلازم"
      confirm:
        - text: "«انقسام سيتوبلازم الخلية عقب انقسام نواتها.» [ترجمة: cytokinesis]"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ARABTERM"
        - text: "«الانقسام السَّيتوبلازميّ (أح).» [ترجمة: cytokinesis]"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«تكاثر تَقَسُّميّ: نوع من التكاثر في الأبواغ تتكون فيه الخلايا المولِّدة بالانشطار المتكرر لنواة الطفيليّ، يتلوه انقسام السيتوبلازم مكوِّناً كتلاً منفصلة حول كل من النويات.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ARABTERM"
          addition: "يُثبت أن «انقسام السيتوبلازم» مصطلح متداول في الوراثة للدلالة على هذه المرحلة بالتحديد."
        - text: "«جسم قطبيّ: خلية تنتج عن أيٍّ من الانقسامين الاختزاليين في الإناث، وتحتوي على نواة فيها مجموعة صبغية أحادية وقليل جداً من السيتوبلازم نتيجة الانقسام السيتوبلازميّ غير المتساوي.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ARABTERM"
          addition: "يُوثِّق استخدام الصفة «السيتوبلازمي» المنسوبة إلى الانقسام، مما يعزز سلامة المركَّب الاصطلاحي."

    - lemma: "حركية خلوية"
      confirm:
        - text: "«حركية الخلية: التغيرات التي تحدث في السيتوبلازم أثناء انقسام الخلية وإخصابها.» [ترجمة: cytocinesis = cytokinesis]"
          source: "معجم المصطلحات الطبية (ج.١، ١٩٨٥) — ARABTERM"
        - text: "«حَرَكِيَّةُ الخَلِيَّة» [ترجمة: cytocinesis (cytokinesis)]"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "«الحَرائِكُ الخَلَوِيَّة» [ترجمة: cytokinesis]"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
      contradicts:
        - text: "«حركية الخلية: التغيرات التي تحدث في السيتوبلازم أثناء انقسام الخلية وإخصابها.»"
          source: "معجم المصطلحات الطبية (ج.١، ١٩٨٥) — ARABTERM"
          conflict: >
            يُشمل التعريف المعجمي تغيُّرات الإخصاب (fertilization) إلى جانب الانقسام، مما يجعل
            دلالته أعمّ من cytokinesis التي تقتصر على انقسام السيتوبلازم بعد الانقسام النووي.
            يُلاحَظ أيضاً أن الصيغة المعجمية المعتمدة هي الإضافية «حركية الخلية» لا الوصفية
            «حركية خلوية».

    - lemma: "اِنْفِلَاق الهَيُولَى"
      expands:
        - text: "«الهَيُولَى» [ترجمة: cytoplasm] — مدخل مستقل"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          addition: "يُثبت أن «الهيولى» مصطلح طبي معتمد عربياً للسيتوبلازم، مما يُجيز استخدامها في مركَّب اصطلاحي."
        - text: "«هَيُولى (ال...)، سيتوبلازما (ال...)» [ترجمة: cytoplasm]"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — ARABTERM"
          addition: "يُسوّي الجمع بين الهيولى والسيتوبلازما كمصطلحَيْن مترادفَيْن."
        - text: "(مقاييس اللغة) «فَلَقَ: الْفَاءُ وَاللَّامُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فُرْجَةٍ وَبَيْنُونَةٍ فِي الشَّيْءِ... فَلَقْتُ الشَّيْءَ أَفْلِقُهُ فَلْقًا. وَالْفَلَقُ: الصُّبْحُ لِأَنَّ الظَّلَامَ يَنْفَلِقُ عَنْهُ.»"
          source: "مقاييس اللغة لابن فارس (ت. ٣٩٥هـ)"
          addition: "جذر فلق يدل على الانشقاق والبينونة؛ يصف دلالياً انقسام الخلية."

    - lemma: "تَجَزُّؤ الهَيُولَى"
      contradicts:
        - text: "(مقاييس اللغة) «جَزَّأَ: الْجِيمُ وَالزَّاءُ وَالْهَمْزَةُ أَصْلٌ وَاحِدٌ، هُوَ الِاكْتِفَاءُ بِالشَّيْءِ. يُقَالُ اجْتَزَأْتُ بِالشَّيْءِ اجْتِزَاءً، إِذَا اكْتَفَيْتُ بِهِ...»"
          source: "مقاييس اللغة لابن فارس (ت. ٣٩٥هـ)"
          conflict: >
            الجذر الأصلي لجزأ في مقاييس ابن فارس يدل على الاكتفاء والاستغناء لا على التقسيم
            المادي، مما يُضعف الأساس الاشتقاقي للمرشح بوصفه مصطلحاً للانقسام البيولوجي.

    - lemma: "الاِنْشِطَار الهَيُولِيّ"
      contradicts:
        - text: "«الانشطار» [ترجمة: strobilation]"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC — ARABTERM"
          conflict: >
            «الانشطار» مُحجوز في المعجمية العربية الحديثة لعملية «strobilation»
            (الانبثاق الحلقي عند الميدوزا)، لا لانقسام السيتوبلازم. استخدامه للـ cytokinesis
            يُنشئ اشتراكاً لفظياً في قاموس علم الأحياء.

    - lemma: "سَيْتُوكِينِيزِيَا"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: انقسام السيتوبلازم ──
    - lemma: "انقسام السيتوبلازم"
      decision: confirmed
      decision_reason: >
        مصطلح معياري موثَّق في معجم الوراثة (٢٠٠٩) والمورد الحديث (٢٠٠٨) بترجمة مباشرة
        لـ cytokinesis. يصف المفهوم وصفاً دقيقاً صريحاً. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُصرّح باسم المادة المنقسِمة (السيتوبلازم) صراحةً، مما يُوضّح الفرق عن انقسام النواة
        ويجعله الأدق في التحديد العلمي في حقل الوراثة والأحياء الجزيئية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْقِسَامُ السَّيْتُوبْلَازِم"

    # ── لمّة موجودة: حركية خلوية ──
    - lemma: "حركية خلوية"
      decision: confirmed
      decision_reason: >
        المصطلح مُثبَت في المعجم الطبي الموحد (٢٠٠٩) بصيغة «حركية الخلية» مع ترجمة
        cytocinesis (cytokinesis)، وفي معجم المصطلحات الطبية (١٩٨٥) كذلك. الصيغة الوصفية
        «حركية خلوية» مقبولة مصطلحياً وإن لم تُسجَّل بهذه الصيغة بعينها في الأدلة. التعريف
        القديم (١٩٨٥) أعمّ من المقصود، بينما الاستخدام الحديث (٢٠٠٩) يُخصِّصه في cytokinesis.
        يُقبل مع تشكيل وإضافة الصيغة الإضافية المعتمدة كشكل بديل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يستحضر استعارة الحركة (kinesis) المستمدة من الاشتقاق اليوناني، مُركِّزاً على الجانب
        الديناميكي للعملية الخلوية. أكثر شيوعاً في معاجم التشريح والطب السريري ويُعبّر عن
        المفهوم من زاوية النشاط الوظيفي للخلية لا من زاوية المادة المنقسمة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَرَكِيَّة خَلَوِيَّة"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "حَرَكِيَّةُ الخَلِيَّة"

    # ── مرشح المرحلة ١: انفلاق الهيولى ──
    - lemma: "اِنْفِلَاق الهَيُولَى"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «الهيولى» مصطلح طبي معتمد للسيتوبلازم وأن جذر «فلق» يدل على الانشقاق
        والبينونة، إلا أن المركَّب «انفلاق الهيولى» غير مسكوك في أي معجم متخصص.
        اختبار التثبيت المعجمي: يمكن تبديل «انفلاق» بـ«انقسام» وتبقى العبارة وصفاً صحيحاً،
        مما يدل على أنها عبارة وصفية لا مصطلح مسكوك. وجود مصطلحَيْن راسخَيْن يُغني عنه.

    # ── مرشح المرحلة ١: تجزؤ الهيولى ──
    - lemma: "تَجَزُّؤ الهَيُولَى"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر «جزأ» في مقاييس اللغة يدل على الاكتفاء والاستغناء لا على التقسيم المادي،
        مما يُقوّض الأساس الاشتقاقي. المركَّب يفتقر إلى أي توثيق معجمي في قواميس
        المصطلح البيولوجي أو الطبي.

    # ── مرشح المرحلة ١: الانشطار الهيولي ──
    - lemma: "الاِنْشِطَار الهَيُولِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        «الانشطار» مُحجوز في المعجمية البيولوجية العربية لمفهوم «strobilation» (تفتُّت
        الميدوزا إلى حلقات) حسب AGROVOC، وهو مغاير تماماً لـ cytokinesis.
        استخدامه يُنشئ اشتراكاً لفظياً مُضلِّلاً.

    # ── مرشح المرحلة ١: سيتوكينيزيا ──
    - lemma: "سَيْتُوكِينِيزِيَا"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب لا داعي له مع وجود مصطلحَيْن عربيَّيْن راسخَيْن موثَّقَيْن للمفهوم ذاته.
        تُخالف مبدأ إيثار العربي الأصيل وإيثار التراثي قبل اللجوء إلى التعريب.

  synset_actions:
    - command: create_entry
      params:
        lemma: "حَرَكِيَّةُ الخَلِيَّة"
        pos: n
    - command: add_sense
      params:
