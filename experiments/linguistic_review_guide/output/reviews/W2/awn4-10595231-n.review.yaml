# مراجعة المجموعة الترادفية: awn4-10595231-n
# seeker / searcher / quester — شخص يقوم بالبحث أو الاستفسار
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «طالب» غالبة الاستعمال بمعنى «التلميذ» في العربية المعاصرة، مما قد يُحدث لبساً دلالياً مع المعنى المقصود (مَن يبحث/يطلب شيئاً)"
      - "اللمّتان بدون تشكيل كامل"
    observations: "المجموعة تدلّ على فاعل البحث والاستفسار العام، وهو مفهوم مركزي في العربية له تعبيرات فصيحة متعددة. اللمّة «باحث» اسم فاعل من بَحَثَ وتغطّي جانب البحث والتفتيش، واللمّة «طالب» اسم فاعل من طَلَبَ وتغطّي جانب الطلب والابتغاء. المفهوم الأعلى (عامل/فاعل) يتّسق مع كون هذه اللمّات أسماء فاعلين لأشخاص يقومون بعمل ما."
  blind_candidates:
    - lemma: "مُتَقَصٍّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تَقَصَّى (وزن تَفَعَّلَ)، بمعنى تتبّع الشيء وبحث عن حقيقته. يغطّي دلالة البحث المتعمّق والاستقصاء."
    - lemma: "مُسْتَفْسِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من اسْتَفْسَرَ (وزن اسْتَفْعَلَ)، بمعنى طلب التوضيح والبيان. يغطّي جانب الاستفسار في التعريف مباشرة."
    - lemma: "مُنَقِّب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من نَقَّبَ (وزن فَعَّلَ)، بمعنى بحث وفتّش بدقة وتعمّق. وصفه ابن فارس بأنه العالم بالأمور المستنبِط لها."
    - lemma: "طَلَّاب"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من طَلَبَ على وزن فَعَّال، بمعنى الكثير الطلب. تفيد المبالغة في السعي والبحث."

stage2_evidence:
  per_lemma:
    - lemma: "بَاحِث"
      confirm:
        - text: "«بَاحِث — من (ب ح ث) المفتش عن الشيء والمجتهد في التعرف على حقيقته.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«باحث — researcher; researchist»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«الْبَاءُ وَالْحَاءُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى إِثَارَةِ الشَّيْءِ. قَالَ الْخَلِيلُ: الْبَحْثُ طَلَبُكَ شَيْئًا فِي التُّرَابِ. وَالْبَحْثُ أَنْ تَسْأَلَ عَنْ شَيْءٍ وَتَسْتَخْبِرَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يجمع بين المعنى الحسّي (إثارة التراب) والمعنى المعنوي (السؤال والاستخبار)، وكلاهما يدعم دلالة الباحث"
    - lemma: "طَالِب"
      confirm:
        - text: "«طَالِب — من (ط ل ب) الذي يطلب العلم ويطلق على التلميذ في مرحلتي التعليم الثانوية والعالية ومن يهم بتحصيل الشيء أو يلتمسه ويريده.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«(الطَّالِب) الَّذِي يطْلب الْعلم وَيُطلق عرفا عل التلميذ فِي مرحلتي التَّعْلِيم الثانوية والعالية»"
          source: "المعجم الوسيط"
          conflict: "المعاجم الحديثة تخصّص الطالب بمعنى التلميذ عرفاً، وهو أضيق من معنى المجموعة (الباحث/الطالب بالمعنى العام)"
      expands:
        - text: "«(طَلَبَ) الطَّاءُ وَاللَّامُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ابْتِغَاءِ الشَّيْءِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الابتغاء المطلق، وهو أعمّ من التخصيص العرفي الحديث"
    - lemma: "مُتَقَصٍّ"
      evidence_status: "no_material_found"
    - lemma: "مُسْتَفْسِر"
      evidence_status: "no_material_found"
    - lemma: "مُنَقِّب"
      confirm:
        - text: "«مُنَقِّب — من (ن ق ب) فاحص الشيء فحصا بليغا.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«رجلٌ مِنْقَبٌ: كثير البحث عن الأشياء»"
          source: "المعجم الوسيط"
      expands:
        - text: "«النَّقَّابُ: الْعَالِمُ بِالْأُمُورِ، كَأَنَّهُ نَقَّبَ عَلَيْهَا فَاسْتَنْبَطَهَا، أَوِ الْعَالِمُ بِهَا الْمُنَقِّبُ عَنْهَا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يحمل دلالة البحث العميق والاستنباط، أوسع من الحفر المادي"
    - lemma: "طَلَّاب"
      confirm:
        - text: "«(الطلاب) الْكثير الطّلب»"
          source: "المعجم الوسيط"
        - text: "«طَلَّاب — من (ط ل ب) الكثير الطلب.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«الطَّلَّابُ — الكثير الطلب» (مصنّف صفة لا اسماً)"
          source: "المعجم الوسيط"
          conflict: "صُنِّف في المعجم الوسيط صفةً (adj) لا اسماً، وهو صيغة مبالغة وصفية لا تدلّ بذاتها على الشخص"

