step0_evidence:
  per_lemma:
    - lemma: "قَاهِر"
      confirm:
        - text: "«(1) قوي: مفحم؛ مقنع (2) قاهر.»"
          source: "المورد الحديث (2008)"
        - text: "«قوة قاهرة؛ سبب قاهر.»"
          source: "المورد الحديث (2008)"
    - lemma: "مُحَطِّم"
      confirm:
        - text: "«مُحَطِّم الذرّة.»"
          source: "المورد الحديث (2008)"
        - text: "«قاصم؛ مُدَمِّر؛ محطِّم.»"
          source: "المورد الحديث (2008)"
    - lemma: "مُكَافِح"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُدَمِّر"
      source_section: "step5_english_bridge"
      evidence_citation: "«قاصم؛ مدمر؛ محطم.» — المورد الحديث (2008)"
      justification: "وردت في المعاجم كمرادف لمحطم ومعادل لبعض معاني التدمير والتغلب المادي."
  knowledge_candidates:
    - lemma: "قَامِع"
      justification: "اشتقاق من الجذر (ق-م-ع) على وزن (فَاعِل) للدلالة على القهر والإخضاع، ويشيع استخدامه للدلالة على من يقهر أو ينهي شيئاً بالقوة (مثل: قامع التمرد)."

step1_lemma_validation:
  per_lemma:
    - lemma: "قَاهِر"
      decision: confirmed
      decision_reason: "مصطلح فصيح يطابق المعنى الدلالي للمجموعة الترادفية ويشيع استخدامه لوصف من يتغلب على غيره ويخضعه."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على التغلب والإخضاع المعنوي أو المادي بقوة."
      example: "كان الجيش قاهراً لأعدائه في المعركة."

    - lemma: "مُحَطِّم"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع يدل على الكسر المادي أو المعنوي وإنهاء الشيء بقوة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تميل للدلالة على الكسر والتدمير المادي وإزالة الحواجز (مثل: محطم الأرقام القياسية)."
      example: "هو محطم القيود التي تكبل مجتمعه."

    - lemma: "مُكَافِح"
      decision: removed
      decision_reason: "المكافح هو المدافع والمقاوم، ولا يعني بالضرورة القهر والتغلب والتحطيم. تستخدم في سياقات معينة (مكافح الجريمة) لكنها لا تطابق المعنى العام للمجموعة."
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "fail"
      nuance_differentiation: "تدل على مجرد المقاومة والنضال وليس بالضرورة القهر أو التحطيم المنجز."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُدَمِّر"
      source: step05
      decision: removed
      decision_reason: "المصطلح يشير إلى التدمير الشامل (destroyer) وهو أقوى وأوسع من المعنى المقصود بـ (breaker/overpowerer)."
      step05_citation: "«قاصم؛ مدمر؛ محطم.» — المورد الحديث (2008)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "المدمر يقضي على الشيء تماماً ويمحوه، بينما المجموعة تركز على التحطيم والتغلب والقهر."

    - lemma: "قَامِع"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح دقيق للتعبير عن القهر والإخضاع والإنهاء، ويطابق الدلالة المطلوبة في المجموعة."
      step05_citation: "اقتراح من المعرفة المعجمية."
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص بإخماد الحركات والظواهر وإنهائها بالقوة والسطوة."
      example: "كانت الشرطة قامعة لأعمال الشغب."
      actions:
        - command: create_entry
          params:
            lemma: "قَامِع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09902904-n"

  added_lemmas:
    - lemma: "قَامِع"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

step3_definition:
  definition_review_flag: false
  current_definition: "شخص (أو شيء) يحطم أو يقهر شيئاً ما"
  assessment:
    decision: retain
    reason: "التعريف دقيق وواضح ويغطي المعنى المادي (يحطم) والمعنوي (يقهر)."

step4_relations:
  hypernymy:
    current_hypernym: "شخص يعمل ويُنجِز الأمور"
    test_result: "correct"
  antonymy:
    per_lemma:
      - lemma: "قَاهِر"
        antonym_found: true
        antonym: "مَقْهُور"
      - lemma: "مُحَطِّم"
        antonym_found: true
        antonym: "مُحَطَّم"
  verb_checks:
    applicable: false
  selectional_restrictions:
    - lemma: "قَاهِر"
      constraint: "يأخذ فاعلاً عاقلاً أو غير عاقل (كالقوة القاهرة)."
    - lemma: "مُحَطِّم"
      constraint: "يأخذ فاعلاً عاقلاً أو غير عاقل."

