stage1_review:
  assessment:
    concerns:
      - "العبارة 'تذرية بالقفز' وصفية أكثر من كونها وحدة معجمية، وتجمع بين التذرية (deflation) والقفز (saltation)، بينما المفهوم يركز على حركة القفز ذاتها."
      - "اللمة 'قفز' عامة جداً وتحتاج إلى التخصيص أو الإيضاح في السياق العلمي للجيولوجيا."
    observations: "المفهوم يشير إلى ظاهرة 'saltation' الجيولوجية المتعلقة بانتقال الرمال. وزن 'فَعَلَان' كـ'قَفَزَان' أو 'طَفَرَان' يعد مناسباً جداً للدلالة على الحركة المستمرة والمضطربة لهذه الجزيئات."
  blind_candidates:
    - lemma: "قَفَزَان"
      generation_method: ishtiqaq
      justification: "وزن 'فَعَلَان' يدل في العربية على الحركة والاضطراب المستمر، وهو مناسب جداً لوصف حركة الجزيئات الرملية المستمرة."
    - lemma: "طَفَرَان"
      generation_method: ishtiqaq
      justification: "من الفعل طفر بمعنى وثب وقفز، وصيغته تدل على الحركة والتنقل المستمر."
    - lemma: "وَثْبَةٌ رَمْلِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يحدد نوع الوثبة ومجالها لتمييزها عن القفز الحيواني أو البشري."
    - lemma: "قَفْز"
      generation_method: majaz
      justification: "استخدام مجازي لعملية القفز العادية وتطبيقها على حركة الجمادات في الفيزياء والجيولوجيا."

stage2_evidence:
  per_lemma:
    - lemma: "تذرية بالقفز"
      evidence_status: "no_material_found"
    - lemma: "قفز"
      confirm:
        - text: "«(قفز) الظَّبْيُ ونحوُه ـِ قَفْزاً, وقَفَزَاناً: وثب»"
          source: "المعجم الوسيط"
        - text: "«saltation: قفز»"
          source: "The Unified Medical Dictionary"
    - lemma: "قفزان"
      confirm:
        - text: "«(قفز) الظَّبْيُ ونحوُه ـِ قَفْزاً, وقَفَزَاناً: وثب»"
          source: "المعجم الوسيط"
        - text: "«القَفْزُ والقَفَزانُ: وثبان أكثر من النِّقَزانِ»"
          source: "كتاب العين"
    - lemma: "طفران"
      evidence_status: "no_material_found"
    - lemma: "وثبة رملية"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تذرية بالقفز"
      decision: removed
      decision_reason: "عبارة وصفية غير مثبتة معجمياً كمصطلح مسكوك، وتجمع بين مفهومين (التذرية والقفز)."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "قفز"
      decision: confirmed
      decision_reason: "مصطلح عربي فصيح وشائع في الترجمات العلمية لمفهوم (saltation)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَفْز"
    - lemma: "قَفَزَان"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صحيح للفعل قفز، ووزنه الصرفي (فَعَلَان) أبلغ في التعبير عن الحركة المستمرة والمضطربة للجزيئات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "قَفَزَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "طَفَرَان"
      source: stage1
      decision: removed
      decision_reason: "لم يثبت استخدامها كمصطلح جيولوجي في السياق المعاصر مقارنة بالقفز."
      evidence_assessment:
        case: no_material
    - lemma: "وَثْبَةٌ رَمْلِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي حر وليس وحدة معجمية مسكوكة."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "(في الجيولوجيا) الحركة القافزة لجزيئات الرمل أو التربة أثناء نقلها في وسط سائل فوق سطح غير مستو"
    assessment:
      decision: revise
      reason: "تعديل الصياغة لتكون تعريفاً مصطلحياً مباشراً يبدأ بالجنس القريب (حركة قفزية) بدلاً من الوصف."
    authored:
      - type: terminological
        text: "حَرَكَةٌ قَفْزِيَّةٌ لِجُزَيْئَاتِ الرَّمْلِ أَوِ التُّرْبَةِ أَثْنَاءَ نَقْلِهَا فِي وَسَطٍ سَائِلٍ فَوْقَ سَطْحٍ غَيْرِ مُسْتَوٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حَرَكَةٌ قَفْزِيَّةٌ لِجُزَيْئَاتِ الرَّمْلِ أَوِ التُّرْبَةِ أَثْنَاءَ نَقْلِهَا فِي وَسَطٍ سَائِلٍ فَوْقَ سَطْحٍ غَيْرِ مُسْتَوٍ."
  examples:
    per_lemma:
      - lemma: "قَفْز"
        examples:
          - text: "يُعَدُّ الْقَفْزُ مِنَ الْعَوَامِلِ الرَّئِيسِيَّةِ فِي تَشْكِيلِ الْكُثْبَانِ الرَّمْلِيَّةِ."
            type: usage
      - lemma: "قَفَزَان"
        examples:
          - text: "تَتَحَرَّكُ حُبَيْبَاتُ الرَّمْلِ بِقَفَزَانٍ مُسْتَمِرٍّ عِنْدَمَا تَشْتَدُّ الرِّيَاحُ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ الْقَفْزُ مِنَ الْعَوَامِلِ الرَّئِيسِيَّةِ فِي تَشْكِيلِ الْكُثْبَانِ الرَّمْلِيَّةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَتَحَرَّكُ حُبَيْبَاتُ الرَّمْلِ بِقَفَزَانٍ مُسْتَمِرٍّ عِنْدَمَا تَشْتَدُّ الرِّيَاحُ."

