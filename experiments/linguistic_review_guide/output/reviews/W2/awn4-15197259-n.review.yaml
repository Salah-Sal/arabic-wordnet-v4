      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدَّة"

    - lemma: "مَسَافَة زَمَنِيَّة"
      decision: removed
      decision_reason: "المركّب لم يُسجَّل في أيّ معجم كوحدة معجمية ثابتة. يخفق في اختبار السَّكّ: يمكن إبدال «مسافة» بـ«بُعد» أو «فجوة» دون تغيّر المعنى، ما يدلّ على أنه عبارة وصفية حرة لا مصطلح. كما أن «المسافة» أصلها مكاني، واستعمالها الزمني ثانوي مجازي."
