# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:

  # التوليد الأعمى (من synset_info_masked.yaml فقط)
  # التعريف المُقنَّع: "صفة الحاجة إلى الاهتمام والعاطفة والطمأنينة بدرجة ملحوظة"
  # المفهوم: صفة نفسية تتمثَّل في الشدة في طلب الاهتمام والحنان والطمأنة (neediness)
  blind_candidates:
    - lemma: "التَّعَوُّزُ"
      generation_method: ishtiqaq
      justification: >
        مصدر الوزن تَفَعُّل من جذر (ع-و-ز). الوزن يدلُّ على الحالة المطاوعة،
        أي اكتساب صفة العوز واستمرارها. يُعبِّر عن الحالة النفسية من التلبُّس
        بالحاجة لا عن مجرَّد واقعة الحاجة.

    - lemma: "الوَلَهُ"
      generation_method: majaz
      justification: >
        أصل اللفظ في المعاجم الاضطراب الشديد وذهاب العقل من الوَجْد، ويُستعار
        لمن يشتدُّ طلبه للحنان حتى يُضطرَّ إليه اضطرابًا. إحياء للّفظ القديم
        المتضمِّن معنى التعلُّق المُفرِط والاضطراب من فقدان الاهتمام.

    - lemma: "الشَّرَهُ الوِجْدَانِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (موصوف + نعت): الشَّرَه = الجشع المُفرِط، الوِجداني = نسبة
        إلى الوجدان (العالم العاطفي الداخلي). يُعبِّر عن الجشع العاطفي وطلب
        الاهتمام بصورة مُفرِطة. اختُير وِجْداني تفاديًا لتكرار مادة (ع-ط-ف)
        الموجودة في التعريف.

    - lemma: "الاِفتِقَارِيَّةُ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق بالمصدر الصناعي (-ية) من «افتقار» الذي يعني التلبُّس بالفقر
        والحاجة. صيغة (-يَّة) تحوِّل المصدر إلى مفهوم مجرَّد يُشير إلى الصفة
        (quality of being needy)، موازية لـ neediness في البنية الصرفية.

  # التقييم الأوَّلي (بعد قراءة synset_info الكامل)
  assessment:
    concerns:
      - "لمَّة «عوز» تدلُّ أساسًا على الحاجة المادية والفقر (الحاجة واختلال الحال) وليس على صفة الحاجة العاطفية كمُعطى نفسي."
      - "لمَّة «احتياج عاطفي» عبارة وصفية حرَّة لا تعبيرٌ مصطلحي مسكوك؛ يمكن إبدال «عاطفي» بـ «نفسي» أو «وجداني» دون خسارة المعنى، مما يكشف عن عدم التثبُّت المعجمي."
      - "المجموعة تفتقر إلى مصطلح مفرد ثابت في العربية يقابل «neediness» كصفة نفسية متخصِّصة."
      - "اللمَّتان خاليتان من التشكيل الكامل."
      - "التعريف الحالي يُعيد استخدام «العاطفة» وهي من مادة «احتياج عاطفي»، مما ينشئ دورانًا جزئيًّا."
    observations: >
      المجموعة تُمثِّل مفهومًا نفسيًّا حديثًا (neediness) يعني إفراط الشخص في
      طلب الاهتمام والحنان والطمأنة كسِمَة شخصية راسخة لا كحاجة آنيَّة. تقع
      المجموعة ضمن المفاهيم ذات الفجوة المعجمية في العربية الكلاسيكية. الجذر
      (ع-و-ز) قادر على تمثيل الحاجة العامة، غير أن المعاجم توثِّقه في سياق
      الفقر المادي في المقام الأول. لمَّة «احتياج عاطفي» هي الأقرب دلاليًّا
      رغم كونها وصفًا حرًّا لا مصطلحًا مسكوكًا.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:

  # الاستعلامات المنفَّذة (٥ استعلامات):
  # ١. مطابقة دفعية: احتياج عاطفي + عوز + مرشحات المرحلة ١
  # ٢. مقاييس اللغة لجذور: عوز، حوج، وله
  # ٣. جسر إنجليزي: neediness, needy, emotional need
  # ٤. عائلة جذر وله (OCR)
  # ٥. مقاييس اللغة لجذري: عطف، وجد

  per_lemma:

    # ── لمَّة موجودة ──
    - lemma: "احتياج عاطفي"
      evidence_status: "no_material_found"
      # لم يُعثَر على مدخل بهذا التعبير في قاعدة البيانات المعجمية العربية.
      # التعبير يُستخدَم في المصادر الحديثة كوصف لا كمصطلح مسكوك.

    # ── لمَّة موجودة ──
    - lemma: "عوز"
      contradicts:
        - text: "«الْعَوَزِ: أَنْ يُعْوِزَ الْإِنْسَانَ الشَّيْءُ الَّذِي هُوَ مُحْتَاجٌ إِلَيْهِ، يَرُومُهُ وَلَا يَتَهَيَّأُ لَهُ. وَأَعْوَزَ الرَّجُلُ: سَاءَتْ حَالُهُ.»"
          source: "مقاييس اللغة لابن فارس (ت 1004 م)"
          conflict: "السياق مادي بحت: الكلمة تدلُّ على سوء الحال والفقر وعدم وجود الشيء المطلوب، لا على صفة الحاجة العاطفية كصفة نفسية."
        - text: "«الحاجة واختلال الحال»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
          conflict: "التعريف ينصبُّ على الحالة الاقتصادية/المادية (اختلال الحال)، وهو غير ملائم لسياق الحاجة العاطفية كصفة نفسية."
        - text: "«(العوز) الْحَاجة واختلال الْحَال وَفِي الْمثل (سداد من عوز) يضْرب للقليل يسد الْحَاجة»"
          source: "المعجم الوسيط (رواية هوراماني)"
          conflict: "المثل المستشهَد به (سداد من عوز) يؤكِّد الدلالة المادية."
      expands:
        - text: "«عَوِزَ الشيءُ: لم يوجَدْ، والرَّجُلُ: افْتَقَرَ، كأَعْوَزَ، والأَمْرُ: اشْتَدَّ.»"
          source: "القاموس المحيط للفيروزآبادي (ت 1414 م)"
          addition: "الجذر يحتمل معنى الاشتداد (اشتدَّ الأمر) مما يُجيز إسقاطه مجازًا على اشتداد الحاجة العاطفية."

    # ── مرشح المرحلة ١ ──
    - lemma: "التَّعَوُّزُ"
      evidence_status: "no_material_found"
      # لم يُعثَر على مدخل بهذا الوزن في المعاجم. الوزن صرفيًّا صحيح لكنَّه غير مستعمَل.

    # ── مرشح المرحلة ١ ──
    - lemma: "الوَلَهُ"
      contradicts:
        - text: "«وَلَهَ: فلان وَلَهاً: اشتدَّ حزْنُه حتَّى ذهبَ عقلُه تحيَّرَ من شِدَّة الوَجْد.»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
          conflict: "الدلالة مقيَّدة بالحزن وذهاب العقل، لا بالحاجة إلى الاهتمام كصفة نفسية مستقلة."
        - text: "«الْوَاوُ وَاللَّامُ وَالْهَاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اضْطِرَابِ شَيْءٍ أَوْ ذَهَابِهِ»"
          source: "مقاييس اللغة لابن فارس (ت 1004 م)"
          conflict: "الأصل (الاضطراب والذهاب) بعيد عن الدلالة المطلوبة؛ المفهوم المستهدَف هو الحاجة الوجدانية لا فقدان العقل."
      expands:
        - text: "«الأُمُّ إلى طفلها: حنَّت إليه. الصبيُّ إلى أمه: فزِع إليها.»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
          addition: "ثمَّة حقل دلالي للشوق والتعلُّق وطلب الحنان، مما يُجيز مجازيًّا استعماله للحاجة العاطفية، لكنَّه يبقى مجازًا بعيدًا."

    # ── مرشح المرحلة ١ ──
    - lemma: "الشَّرَهُ الوِجْدَانِيُّ"
      evidence_status: "no_material_found"
      # التعبير المركَّب غير موثَّق كوحدة معجمية ثابتة.

    # ── مرشح المرحلة ١ ──
    - lemma: "الاِفتِقَارِيَّةُ"
      evidence_status: "no_material_found"
      # الصيغة قياسية صرفيًّا لكن غير موثَّقة في المصادر المعجمية.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── لمَّة موجودة ──
    - lemma: "احتياج عاطفي"
      decision: confirmed
      decision_reason: >
        رغم كونه تعبيرًا وصفيًّا حرًّا لا مصطلحًا مسكوكًا بالمعنى الصارم، فإنَّ
        «احتياج عاطفي» هو التعبير المستعمَل فعليًّا في الأدبيات النفسية العربية
        الحديثة للدلالة على هذا المفهوم. لا يوجد بديل مفرَد ثابت يملأ هذه الفجوة
        المعجمية. يُقرَّر إبقاؤه مع تصحيح التشكيل لتوحيد المخرجات.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرِز البُعد العاطفي-الوجداني للحاجة بوصفها صفة متكرِّرة تستهدف
        الاهتمام والحنان تحديدًا، ويُمايِزه عن «عوز» الذي يُشير أساسًا إلى
        الحاجة المادية وسوء الحال.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِحتِيَاجٌ عَاطِفِيٌّ"

    # ── لمَّة موجودة ──
    - lemma: "عوز"
      decision: removed
      decision_reason: >
        توثِّق جميع المصادر المعجمية «عوز» في سياق الحاجة المادية والفقر
        (الحاجة واختلال الحال)، وهو ما يُناقض تحديدًا موضع هذه المجموعة ضمن
        هرم الصفات النفسية. مقاييس اللغة تؤكِّد دلالته على «سوء الحال» المادي.
        استخدامه هنا بلا قيد وصفي (عوز عاطفي) يُحدِث خلطًا دلاليًّا مع سياق
        الفقر الاقتصادي. تُحذَف الصلة بالمجموعة مع بقاء المدخل في قاعدة البيانات.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١ ──
    - lemma: "التَّعَوُّزُ"
      source: stage1
      decision: removed
      decision_reason: >
        الوزن صرفيًّا قياسيٌّ لكنَّه غير مستعمَل في المعاجم. لا أدلَّة توثِّقه
        كمصطلح. الجذر (ع-و-ز) يحمل الدلالة المادية نفسها التي أعاقت «عوز»،
        فلا مكسب دلاليٌّ من اشتقاقه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ ──
    - lemma: "الوَلَهُ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم توثِّق «الوله» بمعنى اشتداد الحزن حتى ذهاب العقل، وهو مختلف
        عن مفهوم neediness كصفة نفسية مزمنة. التوسُّع المجازي مُمكِن نظريًّا
        (حنين الأمِّ إلى طفلها) لكنَّه بعيد ويحتاج إلى قيد سياقي. الدلالة
        تتداخل مع مفاهيم الحزن والهيام لا الحاجة العاطفية التعلُّقية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ ──
    - lemma: "الشَّرَهُ الوِجْدَانِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد أدلَّة معجمية على هذا التركيب كوحدة مسكوكة. يفشل اختبار
        التثبُّت المعجمي: «الشَّرَه النفسي / الشَّرَه العاطفي» كلاهما بديل سائغ،
        مما يكشف أنَّه وصف حرٌّ لا مصطلح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشح المرحلة ١ ──
    - lemma: "الاِفتِقَارِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة قياسية لكنَّها غير مستعمَلة في المصادر المعجمية. فضلًا عن ذلك،
        جذر (ف-ق-ر) يحمل دلالة الفقر المادي أيضًا، فلا تتحقَّق مزيَّة دلالية
        على «عوز».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:

  definition:
    current: "صفة الحاجة إلى الاهتمام والعاطفة والطمأنينة بدرجة ملحوظة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي. تشوبه عِلَلٌ:
        (أ) كلمة «العاطفة» مشتركة مع مادة اللمَّة المؤكَّدة «عاطفي» مما ينشئ
        دورانًا جزئيًّا.
        (ب) يفتقر إلى الجنس القريب الدقيق (صفة نفسية / سِمَة شخصية).
        (ج) «بدرجة ملحوظة» ترجمة حرفية لـ "to a marked degree" وهي ركيكة؛
        يُستحسَن إحلال «إفراطًا» أو «بصورة مُفرِطة» مكانها.
    authored:
      - type: terminological
        text: "سِمَةٌ شَخصِيَّةٌ تتجلَّى في الحاجة المُفرِطة إلى الاهتمامِ والحَنانِ والطَّمَأنينةِ من الآخرين"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "الشِّدَّةُ في طلَبِ الرِّعَايةِ والحَنانِ والاطمئنانِ بما يتجاوَزُ المعتادَ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04727081-n"
          definition_index: 0
          text: "سِمَةٌ شَخصِيَّةٌ تتجلَّى في الحاجة المُفرِطة إلى الاهتمامِ والحَنانِ والطَّمَأنينةِ من الآخرين"
      - command: add_definition
        params:
          synset_id: "awn4-04727081-n"
          text: "الشِّدَّةُ في طلَبِ الرِّعَايةِ والحَنانِ والاطمئنانِ بما يتجاوَزُ المعتادَ"

