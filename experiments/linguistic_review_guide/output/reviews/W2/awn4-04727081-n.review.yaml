# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:

  per_entry:
    # اِحتِيَاجٌ عَاطِفِيٌّ — تعبير مركَّب وصفي (wasfi MWE)
    - lemma: "اِحتِيَاجٌ عَاطِفِيٌّ"
      entry_id: "{auto}"
      roots:
        - word: "احتياج"
          root: "حوج"
          maqayis_quote: "«الْحَاءُ وَالْوَاوُ وَالْجِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ الِاضْطِرَارُ إِلَى الشَّيْءِ، فَالْحَاجَةُ وَاحِدَةُ الْحَاجَاتِ. وَالْحَوْجَاءُ: الْحَاجَةُ. وَيُقَالُ أَحْوَجَ الرَّجُلُ: احْتَاجَ.»"
        - word: "عاطفي"
          root: "عطف"
          maqayis_quote: "«الْعَيْنُ وَالطَّاءُ وَالْفَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى انْثِنَاءٍ وَعِيَاجٍ. يُقَالُ: عَطَفْتُ الشَّيْءَ، إِذَا أَمَلْتَهُ. وَتَعَطَّفَ بِالرَّحْمَةِ تَعَطُّفًا. وَعَطَفَ اللَّهُ تَعَالَى فُلَانًا عَلَى فُلَانٍ عَطْفًا.»"

  per_sense:
    - lemma: "اِحتِيَاجٌ عَاطِفِيٌّ"
      sense_id: "{auto}"
      nuance: >
        يُمثِّل البُعد العاطفي-الوجداني للحاجة المُفرِطة (الاهتمام، الحنان،
        الطمأنينة)، ويُمايِزه عن «عوز» المحذوف الذي ينصبُّ على الفقر المادي
        وسوء الحال. «احتياج عاطفي» يُسمِّي الصفة من حيث طبيعة الحاجة ومصدرها
