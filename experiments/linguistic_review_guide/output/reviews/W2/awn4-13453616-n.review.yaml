# enovulation / anovulation — اللاإباضة
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('انعدام الإباضة' و'لاإباضة') خاليتان من التشكيل الكامل"
      - "'انعدام الإباضة' تعبير وصفي حر قابل للإبدال بـ'غياب الإباضة' أو 'عدم الإباضة'، مما يطعن في كونها مصطلحاً مسكوكاً بالمعنى الصارم"
      - "الجذر المخزَّن في ARABTERM لـ'إباضة' هو 'بض' (مصدر CAMEL) وهو خطأ؛ الصواب 'بيض' وفق مقاييس اللغة لابن فارس"
      - "التعريف الحالي مترجم شبه حرفي من الإنجليزي ويفتقر إلى الجنس القريب المطلوب في أسلوب المعجم الوسيط"
    observations: >-
      المجموعة تعبّر عن مفهوم طبي حديث (anovulation) ليس له أصل في التراث اللغوي
      العربي القديم. اللمّة الأدق مصطلحيًّا هي 'لاإباضة' بالسابقة النافية 'لا-'
      المنتجة في التقنين الطبي العربي (لا-مناعة، لا-تزامن...). وقد كشفت
      الاستعلامات أن المعجم الطبي الموحد (2009) يجمع 'غياب الإباضة' و'لاإباضة'
      في مدخل واحد مما يُقرِّر ترادفهما الكامل، ويُستحسن إضافة 'غَيَابُ الإِبَاضَة'
      كلمّة ثالثة لأنها موثَّقة ومسكوكة في المعاجم الطبية الموحدة.
  blind_candidates:
    - lemma: "غَيَابُ الإِبَاضَة"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من 'غَيَاب' (مصدر غابَ = استتر واختفى، جذر غيب) و'الإِبَاضَة'.
        'الغياب' يُفيد التستُّر والاحتجاب لا مجرد الانعدام المطلق، وهو ما يناسب
        وصف حالة فيزيولوجية قد تكون مؤقتة. هذه الصيغة بعينها واردة في المعجم
        الطبي الموحد مقابل 'anovulation'.
    - lemma: "لا-إِبَاضَة"
      generation_method: tarkib
      justification: >-
        تركيب مزجي نافٍ بالسابقة 'لا-' المنتجة في المصطلحية الطبية العربية
        (لا-مناعة، لا-تزامن، لا-حيضية...). يوازي مباشرةً الصياغة اللاتينية
        'an-ovulation' بالبنية ذاتها. موجز ودقيق وقابل للاشتقاق (لاإباضي، دورة
        لاإباضية). مسكوك في المراجع الطبية العربية الموحدة.
    - lemma: "تَعَطُّلُ الإِبَاضَة"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من مصدر 'تَعَطُّل' (على وزن التفعُّل من جذر عطل = توقف
        عن العمل) و'الإِبَاضَة'. يُفيد التوقف الوظيفي للإباضة ويغطي سببَ الخلل
        الوظيفي في المبيض المذكور في التعريف.
    - lemma: "قُعُودُ الإِبَاضَة"
      generation_method: majaz
      justification: >-
        مجاز من 'قَعَدَ عَنِ الشَّيْء' = امتنع عنه وتركه وكفَّ، وهو تعبير
        عربي راسخ. إحياء لهذا المجاز الوظيفي لوصف كفّ المبيض عن الإباضة،
        يعكس الدلالة من زاوية الامتناع الفعلي لا الانعدام المطلق.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٢ استعلامات):
#   Q1 — مطابقة دفعية: اباضة، انعدام، غياب الاباضة، لااباضة (+ صيغ ال-)
#   Q2 — جسر إنجليزي: anovulation, anovulatory, ovulation, ovary dysfunction
stage2_evidence:
  per_lemma:
    - lemma: "انعدام الإباضة"
      expands:
        - text: "«غياب عضو أو جزء من عضو»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015) — مدخل: انعدام"
          addition: >-
            يُثبت أن 'انعدام' مصطلح طبي معتمد في معاجم التشريح بمعنى الغياب التام
            لعضو أو وظيفة، مما يدعم صلاحية تركيبه مع 'الإباضة' في سياق الغياب
            الوظيفي الكامل.

    - lemma: "لاإباضة"
      confirm:
        - text: "«لاإبَاضَة — anovulation»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)، مجمع اللغة العربية"
        - text: "«غِيَابُ الإِباضَة؛لاإِبَاضَة — anovulation»"
          source: "المعجم الطبي الموحد (2009)، مجمع اللغة العربية"

    - lemma: "غَيَابُ الإِبَاضَة"
      confirm:
        - text: "«غِيَابُ الإِباضَةِ — anovulia (anovulation)»"
          source: "المعجم الطبي الموحد (2009)، مجمع اللغة العربية"
        - text: "«غِيَابُ الإِباضَة؛لاإِبَاضَة — anovulation»"
          source: "المعجم الطبي الموحد (2009)، مجمع اللغة العربية"

    - lemma: "لا-إِبَاضَة"
      confirm:
        - text: "«لاإبَاضَة — anovulation»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)، مجمع اللغة العربية"

    - lemma: "تَعَطُّلُ الإِبَاضَة"
      evidence_status: "no_material_found"

    - lemma: "قُعُودُ الإِبَاضَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "انعدام الإباضة"
      decision: confirmed
      decision_reason: >-
        مستخدمة في التعريف الرسمي للمجموعة ومنتشرة في الأدبيات الطبية العربية.
        وإن كانت تعبيراً وصفياً قابلاً للإبدال، إلا أن 'انعدام' موثَّق في معجم
        التشريح العياني بمعنى "الغياب التام لعضو أو وظيفة"، مما يضفي عليها
        مشروعية مصطلحية عملية. يُحتفظ بها مع تصحيح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُركّز على الانعدام التام والكلّي للإباضة بمعنى زوال الظاهرة زوالاً
        مطلقاً؛ 'انعدام' أثقل دلالةً من 'غياب' وأقوى من 'عدم'، ويُستخدم تحديداً
        في السياقات التشريحية والإكلينيكية الرسمية والتعريفات الموسوعية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْعِدَامُ الإِبَاضَة"

    - lemma: "لاإباضة"
      decision: confirmed
      decision_reason: >-
        مصطلح طبي مسكوك موثَّق في المعجم الموحد لمصطلحات التشريح العياني (2015)
        والمعجم الطبي الموحد (2009) كمقابل مباشر لـ'anovulation'. يستوفي معايير
        الجودة المصطلحية: موجز، مطَّرد، مشتق بمنهج منتج (السابقة النافية لا-)،
        قابل للاشتقاق (لاإباضي، دورة لاإباضية، شبق لاإباضي).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: >-
        المصطلح الطبي الاختصاري المعيار، مكافئ بنيوياً ودلالياً لـ'anovulation'،
        يُستخدم في التشخيص السريري والتقارير الطبية المتخصصة دون توسع وصفي.
        يتميز عن 'انعدام الإباضة' بالإيجاز وعن 'غياب الإباضة' بالمباشرة الاصطلاحية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاإِبَاضَة"

    - lemma: "غَيَابُ الإِبَاضَة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        موثَّق في المعجم الطبي الموحد (2009) بمقابلين: 'anovulia (anovulation)'
        و'anovulation'. والمعجم الطبي الموحد نفسه يجمعه مع 'لاإباضة' في مدخل واحد
        مما يُقرِّر ترادفهما الكامل في المعجمية الطبية الموحَّدة. إضافته تُثري
        المجموعة بمصطلح مدعوم بجذر 'غيب' الراسخ في اللغة العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُفيد حالة الغياب الظرفي أو الدوري للإباضة، بما يشمل الحالات المؤقتة
        (كالحمل وموانع الحمل). جذره 'غيب' يُفيد التستُّر والاحتجاب لا الزوال
        المطلق، وهو ما يجعله أرق تعبيراً من 'انعدام' ويُستخدم في التعريفات
        الموسوعية والمعاجم الطبية الموحدة.
      actions:
        - command: create_entry
          params: {lemma: "غَيَابُ الإِبَاضَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "لا-إِبَاضَة"
      source: stage1
      decision: removed
      decision_reason: >-
        مطابق لـ'لاإباضة' الموجودة أصلاً في المجموعة، وهو مجرد إملاء بديل
        بالشرطة الوصلية. لا يُضيف قيمة مصطلحية مستقلة.

    - lemma: "تَعَطُّلُ الإِبَاضَة"
      source: stage1
      decision: removed
      decision_reason: >-
        'تعطُّل' يُفيد الخلل الوظيفي (dysfunction) لا الغياب التام (absence)،
        مما يجعله أقل دقةً في تمثيل مفهوم anovulation. لم يرد في أي معجم طبي
        كمقابل لـ'anovulation'، ولا تدعمه شواهد معجمية.

    - lemma: "قُعُودُ الإِبَاضَة"
      source: stage1
      decision: removed
      decision_reason: >-
        مجاز أدبي غير مسكوك في المعاجم الطبية المتخصصة. الاستخدام الطبي يستلزم
        مصطلحات موثَّقة في معاجم الجهات المعيارية. لا تدعمه شواهد في قاعدة البيانات.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "غياب الإباضة بسبب عدم النضج أو سن اليأس أو الحمل أو حبوب منع الحمل أو خلل في المبيض"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة شبه حرفية من الإنجليزية، يفتقر إلى الجنس القريب
        (genus proximum)، ويستخدم 'حبوب منع الحمل' بدلاً من المصطلح الأدق
        'موانع الحمل الفموية'. بنيته النحوية (غياب X بسبب Y) لا تنسجم مع أسلوب
        المعجم الوسيط القائم على الجنس والفصل.
    authored:
      - type: terminological
        text: >-
          حالةٌ فيزيولوجيَّةٌ أو مَرَضِيَّةٌ تتمثَّل في غيابِ إطلاقِ البُوَيضَة
          من المَبيض؛ تُصيبُ المرأةَ قبلَ بُلوغِها أو بعدَ انقِطاعِ طَمثِها أو
          أثناءَ الحَمل، وقد تَنشَأُ عن تَناوُلِ موانِع الحَمل الفَمَوِيَّة أو
          خَلَلٍ وَظيفِيٍّ في المَبيض
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          غيابُ إطلاقِ البُوَيضَة الناضِجة من جُريبِ غراف في المَبيض خِلال الدَّورةِ
          الشهريَّة؛ يحدث فيزيولوجيًّا أثناءَ الحمل وما قبلَ البُلوغ وبعدَ سِنِّ
          اليَأس، ويحدث مَرَضِيًّا نتيجةَ تَناوُلِ موانِع الحَمل الفَمَوِيَّة أو
          اضطِرابٍ هُرمونِيٍّ أو قُصورٍ وَظيفِيٍّ في المَبيض، ويُؤَدِّي إِلى
          عُقمٍ مُؤَقَّت
