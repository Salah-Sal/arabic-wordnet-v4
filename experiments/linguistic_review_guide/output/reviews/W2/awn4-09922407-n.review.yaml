          source: "المورد الحديث"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُعَيِّد"
      source_section: "step4_fts_keyword"
      evidence_citation: "«مُعَيِّد: من (ع و د) بمعنى الشاهد العيد والمحتفل به» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "اسم فاعل من (عَيّدَ) بمعنى مَن يحتفل بالعيد، وهو أخصّ قليلاً (اشتقاق)."
  knowledge_candidates:
    - lemma: "مُحْتَفٍ"
      justification: "اسم فاعل من الفعل (احْتَفَى) الذي يتضمن معنى الفرح والإكرام، وهو مقارب لمعنى الاحتفال (اشتقاق)."
  generation_notes: "المفهوم يدل على اسم الفاعل من الاحتفال، والمصطلحات المرادفة تميل إما للتخصيص (كالعيد) أو لظلال دلالية مختلفة كالإكرام."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُحْتَفِل"
      decision: "confirmed"
      decision_reason: "أدلة مؤكدة من المعاجم ثنائية اللغة واسم فاعل قياسي"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اسم فاعل قياسي يدل على مطلق المشاركة أو القيام بالاحتفال"
      example: "كان الشاب هو المُحْتَفِلَ الأبرزَ بنجاح المشروع."

    - lemma: "مُعَيِّد"
      source: "step05"
      decision: "removed"
      decision_reason: "أخصّ دلالياً من المفهوم؛ فهو يقتصر على الاحتفال بالأعياد فقط"
      step05_citation: "«مُعَيِّد: من (ع و د) بمعنى الشاهد العيد والمحتفل به» — موسوعة السلطان قابوس لأسماء العرب"

    - lemma: "مُحْتَفٍ"
      source: "step05"
      decision: "removed"
      decision_reason: "يختلف في الظل الدلالي؛ فهو يدل غالباً على المبالغة في الترحيب والإكرام (محتفٍ بشخص) ولا يطابق مطلق الاحتفال"
      step05_citation: "مرشح من المعرفة اللغوية"

