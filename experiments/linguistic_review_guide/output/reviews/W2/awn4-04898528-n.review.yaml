      maqayis_quote: "«السِّينُ وَالْفَاءُ وَالْهَاءُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى خِفَّةٍ وَسَخَافَةٍ. وَهُوَ قِيَاسٌ مُطَّرِدٌ. فَالسَّفَهُ: ضِدُّ الْحِلْمِ.»"
    - lemma: "طَيْش"
