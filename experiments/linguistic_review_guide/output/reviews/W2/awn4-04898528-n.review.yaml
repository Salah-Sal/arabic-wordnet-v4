stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (حماقة) تفتقر للتشكيل الكامل."
      - "المجموعة تحتوي على لمة واحدة فقط بينما توجد بدائل معجمية قوية تغطي جانبي الغباء والتهور."
      - "التعريف العربي الحالي مبسط للغاية ويحتاج صياغة معجمية أدق (أسلوب المعجم الوسيط)."
    observations: "المفهوم يغطي سمة شخصية تتجلى في سوء التقدير أو الخفة في التصرف، وهو ما تعبر عنه في العربية مجموعة من الألفاظ المتداخلة دلالياً مثل الحمق والرعونة والسفاهة والطيش."
  blind_candidates:
    - lemma: "حَمَاقَة"
      generation_method: ishtiqaq
      justification: "اللفظ العربي الأصيل الدال على نقصان العقل وفساد الرأي."
    - lemma: "رُعُونَة"
      generation_method: ishtiqaq
      justification: "تدل على الهوج والاضطراب في التصرف، وتناسب معنى 'acting rashly'."
    - lemma: "سَفَاهَة"
      generation_method: ishtiqaq
      justification: "تدل على خفة العقل وسخافة الرأي، وتناسب معنى 'acting stupidly'."
    - lemma: "طَيْش"
      generation_method: ishtiqaq
      justification: "تدل على النزق والخفة وعدم الرزانة."

stage2_evidence:
  per_lemma:
    - lemma: "حَمَاقَة"
      confirm:
        - text: "«الحَمَاقة: قلَّةُ العَقْلِ، أَو فَسَادُه، أو فِعْلُ فِعل الحَمْقَى»"
          source: "المعجم الوسيط"
        - text: "«الحماقة: وضع الشيء في غير موضعه مع العلم بقبحه»"
          source: "التعريفات للجرجاني"
    - lemma: "رُعُونَة"
      confirm:
        - text: "«الرعونة: الإتيان بما يخرج عن الصواب»"
          source: "مقاليد العلوم للسيوطي"
        - text: "«رَعُنَ الرَّجُلُ... فَهُوَ أَرْعَنُ، أَيْ أَهْوَجُ»"
          source: "مقاييس اللغة"
    - lemma: "سَفَاهَة"
      confirm:
        - text: "«السفاهة: خفة الرأي في مقابلة ما يراد منه من المتانة والقوة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«السفاهة: التسرع إلى القول القبيح أو فعله»"
          source: "مقاليد العلوم للسيوطي"
    - lemma: "طَيْش"
      confirm:
        - text: "«الطيش: خفة العقل، والنزق»"
          source: "لسان العرب"
        - text: "«الطيش: الخفة... ورجل طائش: خفيف العقل»"
          source: "مختار الصحاح"

stage3_analysis:
  per_lemma:
    - lemma: "حماقة"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والمباشر للمفهوم في العربية المعاصرة والتراثية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَمَاقَة"
    - lemma: "رُعُونَة"
      source: stage1
      decision: confirmed
      decision_reason: "تغطي جانب التهور (rashness) في التعريف، وهي سمة ملازمة للحمق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رُعُونَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04898528-n"}
    - lemma: "سَفَاهَة"
      source: stage1
      decision: confirmed
      decision_reason: "تغطي جانب الخفة والسخافة في القول والفعل (foolishness)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سَفَاهَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04898528-n"}
    - lemma: "طَيْش"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ شائع يدل على النزق والاندفاع بلا روية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "طَيْش", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04898528-n"}

stage4_content:
  definition:
    current: "سمة التصرف بغباء أو تهور"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط؛ الأفضل صياغته بأسلوب المعاجم العربية ليكون أشمل وأدق."
    authored:
      - type: terminological
        text: "خصلةٌ تعني قلّةَ العقل، أو فُسادَه، أو الإتيانَ بفعلٍ يخرجُ عن مقتضى الصَّواب والحكمة؛ إمّا لجهالةٍ أو لنزقٍ وتهوّر."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-04898528-n", definition_index: 0, text: "خصلةٌ تعني قلّةَ العقل، أو فُسادَه، أو الإتيانَ بفعلٍ يخرجُ عن مقتضى الصَّواب والحكمة؛ إمّا لجهالةٍ أو لنزقٍ وتهوّر."}
  examples:
    per_lemma:
      - lemma: "حَمَاقَة"
        examples:
          - text: "مِنَ الحَمَاقَةِ أَنْ تُكَرِّرَ نَفْسَ الخَطَأِ وَتَنْتَظِرَ نَتِيجَةً مُخْتَلِفَةً."
            type: usage
      - lemma: "رُعُونَة"
        examples:
          - text: "تَصَرَّفَ القَائِدُ بِرُعُونَةٍ أَدَّتْ إِلَى خَسَارَةِ المَعْرَكَةِ."
            type: usage
      - lemma: "سَفَاهَة"
        examples:
          - text: "يَنْبَغِي لِلْعَاقِلِ التَّرَفُّعُ عَنْ سَفَاهَاتِ الجُهَّالِ."
            type: usage
      - lemma: "طَيْش"
        examples:
          - text: "نَدِمَ الشَّابُّ عَلَى طَيْشِهِ بَعْدَ فَوَاتِ الأَوَانِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-04898528-n", text: "يُعْرَفُ المَرْءُ بِحَمَاقَتِهِ إِذَا آثَرَ الهَوَى عَلَى المَنْطِقِ."}

stage5_enrichment:
  per_entry:
    - lemma: "حَمَاقَة"
      entry_id: "{auto}"
      root: "حمق"
      maqayis_quote: "«الْحَاءُ وَالْمِيمُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى كَسَادِ الشَّيْءِ. وَالضَّعْفِ وَالنُّقْصَانِ. فَالْحُمْقُ: نُقْصَانُ الْعَقْلِ.»"
    - lemma: "رُعُونَة"
      entry_id: "{auto}"
      root: "رعن"
      maqayis_quote: "«الرَّاءُ وَالْعَيْنُ وَالنُّونُ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى تَقَدُّمٍ فِي شَيْءٍ، وَالْآخَرُ يَدُلُّ عَلَى هَوَجٍ وَاضْطِرَابٍ... رَعُنَ الرَّجُلُ... فَهُوَ أَرْعَنُ، أَيْ أَهْوَجُ.»"
    - lemma: "سَفَاهَة"
