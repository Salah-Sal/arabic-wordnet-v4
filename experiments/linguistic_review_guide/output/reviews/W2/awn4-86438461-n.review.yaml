stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «لغة ثانية» بدون تشكيل — يجب إضافة تشكيل كامل"
      - "المجموعة تحتوي على لمّة واحدة فقط — قد تحتاج إثراء بمرادفات أو صيغ بديلة"
      - "التعريف العربي مختصر ولا يميّز بوضوح بين اللغة الثانية واللغة الأجنبية"
    observations: "المفهوم ينتمي إلى حقل اللسانيات التطبيقية، وهو مفهوم حديث نسبياً يتعلق باكتساب اللغة. المصطلح «لغة ثانية» مركب وصفي ثابت في الاستعمال اللساني العربي المعاصر، وقد أقرّته المنظمة العربية للتربية والثقافة والعلوم. الفرق بين «اللغة الثانية» و«اللغة الأجنبية» دقيق في اللسانيات: الثانية تُكتسب في بيئة ناطقة بها، بينما الأجنبية تُتعلّم خارج بيئتها الطبيعية."
  blind_candidates:
    - lemma: "لُغَة ثَانِيَة"
      generation_method: tarkib
      justification: "مركب وصفي ثابت في الاستعمال اللساني العربي، يقابل المفهوم مباشرة: «لغة» (الجنس) + «ثانية» (الترتيب الزمني للاكتساب). مصطلح مُقَرّ من مجامع اللغة العربية."
    - lemma: "لِسَان ثَانٍ"
      generation_method: tarkib
      justification: "مركب وصفي بديل يستخدم «لسان» بدلاً من «لغة»، وكلاهما يدلّ على أداة التواصل اللغوي في التراث العربي. «لسان» أقدم استعمالاً وأقرب إلى النص القرآني."
    - lemma: "لُغَة طَارِئَة"
      generation_method: tarkib
      justification: "مركب وصفي يشير إلى أنّ اللغة طرأت على المتكلم بعد اللغة الأم، من «طرأ» بمعنى جاء بعدُ وحدَث. يُبرز البعد الزمني في التعريف (مرحلة المراهقة أو بعدها)."
    - lemma: "مُسْتَلْغَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول على وزن مُسْتَفْعَلَة من «استلغى» بمعنى تتبّع لغات القوم واستمع إليها. وزن الاستفعال يفيد طلب الشيء واكتسابه، فالمُستلغَة هي اللغة المطلوب اكتسابها."

