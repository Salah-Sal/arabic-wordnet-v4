      confirm:
        - text: "«لغة تكون عادة مكتوبة وتلقن في المدارس، وهي تختلف من حيث الإدراك والذاكرة والعوامل النفسية عن اللغة الأولى، وذلك لكونها لم تكتسب في محيط الأم أو الأسرة بل بواسطة معلم أو ملقن.»"
          source: "مسرد الإعلام والتواصل — المنظمة العربية (ARABTERM entry 488851)"
        - text: "«لغة تكون عادة مكتوبة وتلقن في المدارس، لغة تختلف من حيث الإدراك والذاكرة والعوامل النفسبة عن اللغة الأولى، وذلك لكونها لم تكتسب في محيط الأم أو الأسرة بل بواسطة معلم أو ملقن.»"
