          source: "مسرد الإعلام والتواصل — ARABTERM entry 487965 (لغة أجنبية)"
          addition: "يوضّح الفرق بين اللغة الثانية واللغة الأجنبية: الأجنبية أعمّ وتشمل كل لغة غير الأم"

    - lemma: "لِسَان ثَانٍ"
      evidence_status: "no_material_found"

    - lemma: "لُغَة طَارِئَة"
      evidence_status: "no_material_found"

    - lemma: "مُسْتَلْغَة"
      expands:
        - text: "«اسْتَلْغِ العَرَبَ: اسْتَمِعْ لُغاتِهِم من غيرِ مَسْأَلَةٍ.»"
          source: "القاموس المحيط للفيروزآبادي (entry 801288)"
          addition: "الفعل «استلغى» موجود في التراث بمعنى تتبّع اللغات، لكنه لم يُستعمل لتسمية نوع من اللغات"

