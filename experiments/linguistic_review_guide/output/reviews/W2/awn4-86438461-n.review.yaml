stage4_content:
  definition:
    current: "لغة اكتسبها الشخص في مرحلة المراهقة أو في وقت لاحق"
    assessment:
      decision: revise
      reason: "التعريف الحالي يقصر الاكتساب على مرحلة المراهقة وما بعدها، بينما المفهوم اللساني أوسع: اللغة الثانية هي أي لغة تُتعلّم بعد اللغة الأم بصرف النظر عن العمر. كما أنه لا يميّز بين اللغة الثانية واللغة الأجنبية."
    authored:
      - type: terminological
        text: "لُغَةٌ يكتسبها المتكلّمُ بعد لغته الأمّ، وتُتعلَّم عادةً في بيئة ناطقة بها أو في المدارس، وتختلف عن اللغة الأولى من حيث طريقة الاكتساب والإدراك."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "لُغَةٌ غير اللغة الأمّ يكتسبها الفردُ اكتساباً واعياً منظّماً، سواء بالتلقين المدرسيّ أو بالاحتكاك ببيئة ناطقة بها. وتختلف اللغة الثانية عن اللغة الأجنبيّة في أنّها تُستعمل عادةً وسيلةَ تواصلٍ في المجتمع المحيط بالمتعلّم، في حين تُتعلَّم اللغة الأجنبيّة خارج بيئتها الطبيعيّة."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "لُغَةٌ يكتسبها المتكلّمُ بعد لغته الأمّ، وتُتعلَّم عادةً في بيئة ناطقة بها أو في المدارس، وتختلف عن اللغة الأولى من حيث طريقة الاكتساب والإدراك."

  examples:
    per_lemma:
      - lemma: "لُغَة ثَانِيَة"
        examples:
          - text: "تُعدّ الإنجليزية لغةً ثانيةً لكثير من سكّان جنوب شرق آسيا الذين يستعملونها في التعليم والتجارة إلى جانب لغاتهم الأمّ."
            type: usage
    actions:
