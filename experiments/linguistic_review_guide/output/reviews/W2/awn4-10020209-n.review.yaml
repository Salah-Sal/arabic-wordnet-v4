step0_evidence:
  per_lemma:
    - lemma: "مُؤَجِّل"
      confirm:
        - text: "«أجَّلَ يؤجِّل، تأجيلاً، فهو مُؤجِّل... أجَّل المؤتمَرَ الصَّحفيّ: أخَّره وأرجأه»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مُسَوِّف"
      confirm:
        - text: "«سوَّفَ يسوِّف، تسويفًا، فهو مُسوِّف... سوَّف فلانًا: ساوَفه، ماطَلَه... سوَّف الأمرَ: قال: سوف أفعله ولم يفعلْه»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«التَّسْوِيف: المَطْل والتَّأخير، من السَّوْف وهو الشَّمُّ كأنها تُشِمُّه المُطاوعَةَ وتُطمِعهُ، ثم لا تَفى به.»"
          source: "المجموع المغيث"
      expands:
        - text: "«من يصنع ما يشاء لا يرده أحد»"
          source: "المعجم الكبير"
          addition: "المعنى يتوسع ليشمل من لا عائق لفعله"
    - lemma: "مُمَاطِل"
      confirm:
        - text: "«المَطْلُ: التسويف والمُدافَعة بالعِدَة والدَّيْن ولِيَّانِه... ورجل مَطُول ومَطَّال»"
          source: "لسان العرب"
        - text: "«مدين مماطل: المدين الذي يتأخر عن تنفيذ التزامه، كليا أو جزئيا، من غير سبب مقبول»"
          source: "المعجم الموحد لمصطلحات القانون"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُتَوَانٍ"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُتَواني؛ المُتَلكِّئ: المُضَيِّع وقتَهُ سُدًى.» — المورد الحديث"
      justification: "مصطلح مناسب يدل على الشخص الذي يتباطأ ويتأخر في إنجاز الأمور."
    - lemma: "مُتَلَكِّئ"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُتَواني؛ المُتَلكِّئ: المُضَيِّع وقتَهُ سُدًى.» — المورد الحديث"
      justification: "يشير إلى من يتردد ويتأخر في القيام بالفعل."
  knowledge_candidates:
    - lemma: "مَطَّال"
      justification: "اشتقاق على وزن مِفْعَال أو فَعَّال للمبالغة من مطل، ورد في لسان العرب: 'ورجل مطول ومطال' للدلالة على كثير المماطلة والتأخير."
  generation_notes: "تم استخراج المرشحات من المورد الحديث عبر البحث عن الترجمة الإنجليزية."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُؤَجِّل"
      decision: confirmed
      decision_reason: "صيغة اسم الفاعل من الفعل أجّل، وتدل على من يقوم بالتأجيل والتأخير، وهي فصيحة ومستعملة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المؤجل هو من يؤخر الأمور لوقت محدد بشكل عام، سواء بعذر أو بدونه."
      example: "كان المدير مؤجلاً لقراراته حتى تتضح الصورة أمامه."

    - lemma: "مُسَوِّف"
      decision: confirmed
      decision_reason: "مصطلح فصيح ودقيق يدل على من يعتاد التأخير بقوله 'سوف أفعل'."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المسوف هو من يؤخر إنجاز الأعمال تساهلاً وتكاسلاً مع الوعود الدائمة بالإنجاز مستقبلاً."
      example: "الطالب المسوف تتراكم عليه الواجبات حتى نهاية الفصل."

    - lemma: "مُمَاطِل"
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على من يتأخر في أداء ما عليه من حقوق أو وعود."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المماطل يختص بالتأخير في دفع الديون أو الوفاء بالحقوق والوعود تهرباً."
      example: "أنذر القاضي المدين المماطل بضرورة سداد ديونه."

    - lemma: "مُتَوَانٍ"
      source: step05
      decision: confirmed
      decision_reason: "صيغة فصيحة ومعبرة عن التأخر الناتج عن الكسل والفتور."
      step05_citation: "«المُتَواني؛ المُتَلكِّئ: المُضَيِّع وقتَهُ سُدًى.» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المتواني يتأخر بسبب الفتور والتقاعس والكسل عن الفعل."
      example: "لا ينجح المتواني في عمله لكثرة تقاعسه."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَوَانٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10020209-n"

    - lemma: "مُتَلَكِّئ"
      source: step05
      decision: confirmed
      decision_reason: "دقيقة في وصف من يتأخر ويتباطأ في القيام بالعمل."
      step05_citation: "«المُتَواني؛ المُتَلكِّئ: المُضَيِّع وقتَهُ سُدًى.» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المتلكئ يتأخر بسبب التردد أو التهرب غير المباشر من إنجاز الفعل."
      example: "بقي المتلكئ يختلق الأعذار ليؤخر انطلاق الرحلة."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَلَكِّئ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10020209-n"

    - lemma: "مَطَّال"
      source: step05
      decision: confirmed
      decision_reason: "صيغة مبالغة فصيحة وموثقة في المعاجم لمن يكثر المماطلة والتأخير."
      step05_citation: "«ورجل مطول ومطال» — لسان العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المطّال هو المبالغ في المماطلة وتأخير الوفاء بالحقوق."
      example: "احذر التعامل مع التاجر المطّال الذي لا يفي بوعوده."
      actions:
        - command: create_entry
          params:
            lemma: "مَطَّال"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10020209-n"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "مُتَوَانٍ"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "مُتَلَكِّئ"
      reason: "مصدر: الخطوة ٠٫٥"
