# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-07086377-n  |  ILI: i73846  |  POS: n
# المفهوم: pathos — أسلوب خطابي يثير العواطف
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "باثوس: تعريب بحت من اليونانية/الإنجليزية pathos دون مسوّغ مع وجود مصطلح عربي معتمد"
      - "شجن: يصف الشعور النفسي (الحزن والهم) لا الأسلوبَ المُثير له؛ الدلالة مزاحة عن المعنى الاصطلاحي"
      - "المجموعة تفتقر إلى المصطلح اللساني المعتمد لـ pathos في المعاجم العربية المتخصصة"
      - "التعريف الحالي صحيح لكنه مختصر ويفتقر إلى السياق البلاغي الأرسطي"
    observations: >
      المجموعة تُمثّل مفهوم pathos البلاغي الأرسطي، أي القدرة على استثارة عواطف المتلقي.
      اللمتان الموجودتان (باثوس وشجن) تُقصّران: باثوس تعريبٌ صوتي لا يستوفي معيار الاندراج
      الصرفي التام، وشجن اسمٌ للشعور النفسي (الحزن، الهم) لا للأسلوب المُنتج له. المفهوم
      في التراث البلاغي العربي أُطّر عبر مصطلحات كـ"استمالة القلوب" و"تحريك العواطف"
      لكنه لم يُصَكّ مصطلحاً موحداً حتى أصدرت مجامع اللغة والمنظمات الدولية معاجمها.

  blind_candidates:
    - lemma: "اسْتِمَالَة"
      generation_method: ishtiqaq
      justification: >
        من مَالَ يَمِيل، على وزن استفعالة. مصطلحٌ بلاغي تراثي يعني استمالة القلوب
        وإثارة العواطف نحو المتكلم أو قضيته. استخدمه الجاحظ وابن رشيق في سياق فنون
        الإقناع الخطابي؛ وهو أقرب المصطلحات العربية التراثية من pathos.
    - lemma: "وَجَدِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الوَجْد (الشعور الداخلي العميق)، بإلحاق ياء النسبة والتاء.
        يُشير إلى الخاصية الوجدانية في الأسلوب؛ نمطٌ اشتقاقي منتج على غرار عاطفية،
        وجدانية، انفعالية. يصف طبيعة الأسلوب دون أن يُقيّده بشعور بعينه.
    - lemma: "تَرْقِيق"
      generation_method: ishtiqaq
      justification: >
        من رَقَّقَ يُرقِّق، وزن تفعيل. يعني جعل القلب رقيقاً مُتأثراً؛ يُقال "رقّق
        الأسلوبُ قلوبَ السامعين". استُعمل في سياق التأثير العاطفي بالكلام.
    - lemma: "عَاطِفِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من عاطفة، يصف الخاصية العاطفية للأسلوب وقدرته على استثارة
        المشاعر. مستعمل في النقد الأدبي المعاصر وصفاً للأنماط الأسلوبية ذات الوقع
        الانفعالي على المتلقي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة (6 استعلامات):
#   Q1 — مطابقة دفعية: باثوس، شجن + المُقنَّعات الأربع
#   Q2 — مطابقة إضافية: وجد، شجو، استمالة، تهييج، مشجي
#   Q3 — جسر إنجليزي: pathos → وجد نتيجتَيْن (تهييج، المشجي)
#   Q4 — إثراء entry_ids 498597 و706522
#   Q5 — مقاييس اللغة: جذور شجن، هيج، عطف، بث
#   Q6 — FTS كلمات مفتاحية: مشاعر، إثارة، وجداني، عاطفة، استمالة
stage2_evidence:
  per_lemma:

    - lemma: "باثوس"
      evidence_status: "no_material_found"

    - lemma: "شجن"
      confirm:
        - text: "«الشَّجَنُ: الهَمُّ، والحَزَنُ، والغُصْنُ المُشْتَبِكُ، والشُّعْبَةُ من كلِّ شيءٍ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الشجن) الهمُّ والحزنُ. ووردت أرضاً ما كانت لي شَجَناً أي وطناً. والحديث ذو شُجُونٍ أي فُنونٍ وأعراض»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«(الشجن) الْغُصْن المشتبك والشعبة من كل شَيْء وَالهم والحزن وَالْحَاجة الشاغلة»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الشِّينُ وَالْجِيمُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى اتِّصَالِ الشَّيْءِ وَالْتِفَافِهِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            أصل الجذر شجن عند ابن فارس هو الاتصال والالتفاف لا الحزن، مما يكشف أن
            دلالة الحزن مجازية ثانوية؛ واستخدامه اصطلاحاً لـ pathos (الأسلوب لا الشعور)
            يُضيف إزاحة دلالية ثانية غير موثقة في المعاجم المتخصصة.

    - lemma: "اسْتِمَالَة"
      expands:
        - text: "«تهييج: ميزة خِطابية وكتابية لاستدرار عطف المتلقي. حافز فني لإثارة التعاطف والتقمص الوجداني لاستمالة النفوس استغلالا للمشاعر، كطريقة من بين ثلاث طرائق أرسطية فاعلة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ALECSO 2002)"
          addition: >
            الاستمالة مذكورة بوصفها جزءاً من تعريف تهييج لا مصطلحاً مستقلاً؛ مما يُشير
            إلى أنها وصف إجرائي لا اصطلاح معجمي مُفرد.

    - lemma: "وَجَدِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَرْقِيق"
      contradicts:
        - text: "«الترقيق: نحول يعتري الحرف فلا يملأ صداه الفم، وهو نوعان: ترقيق مفتوح كترقيق الراءات، وترقيق غير مفتوح وهو الإمالة»"
          source: "مختصر العبارات لمعجم مصطلحات القراءات للدوسري"
          conflict: "الترقيق مصطلح صوتي/تجويدي لا علاقة له بإثارة المشاعر"
        - text: "«ترقيق: lamination — Masonry / Carpentry»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (ALECSO 1999)"
          conflict: "الاستخدام التقني في البناء والنجارة يُنافي الدلالة الأسلوبية كلياً"
        - text: "«ترقيق: عملية رق العجينة وتحويلها إلى رقائق — flaking»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (ALECSO 2004)"
          conflict: "الاستخدام في الصناعات الغذائية يؤكد الدلالة المادية لا العاطفية"

    - lemma: "عَاطِفِيَّة"
      expands:
        - text: "«عاطفة: sentiment — Educational and Computer Techniques»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ALECSO 1999)"
          addition: "المعاجم توثّق عاطفة كمصطلح لـ sentiment لا لـ pathos؛ عاطفية أشمل وأعم"
        - text: "«عاطفة: affection / emotion — Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
          addition: "دلالة عامة تغطي طيف المشاعر كله لا خاصية أسلوبية معينة"

    # ── مصطلحات اكتُشفت عبر الجسر الإنجليزي (المرحلة ٢) ──
    - lemma: "تَهْيِيج"
      confirm:
        - text: "«تهييج: ميزة خِطابية وكتابية لاستدرار عطف المتلقي. حافز فني لإثارة التعاطف والتقمص الوجداني لاستمالة النفوس استغلالا للمشاعر، كطريقة من بين ثلاث طرائق أرسطية فاعلة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ALECSO 2002)"
      expands:
        - text: "«تهييج: irritation — Veterinary Medicine»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (ALECSO 2010)"
          addition: >
            الاستخدام البيطري بمعنى التهيّج الجسدي (irritation) يمثّل دلالة مستقلة
            لا تعارض بالضرورة الدلالة الأسلوبية الاستعطافية؛ لكنها تستوجب التنبيه
            إلى احتمال الاشتراك اللفظي في السياقات غير الأدبية.
        - text: "«هَيَجَ: الْهَاءُ وَالْيَاءُ وَالْجِيمُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى ثَوَرَانِ شَيْءٍ، وَالْآخَرُ عَلَى يُبْسِ نَبَاتٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الأصل الأول (ثوران الشيء) يُوطّد استخدام تهييج بمعنى إثارة العواطف وتحريكها؛
            فهو من الهيجان المجازي للمشاعر.

    - lemma: "مُشْجٍ"
      confirm:
        - text: "«(1) المُشْجي: العنصر المثير للشَّجا أو الأسَى أو الشفقة [في الحياة أو في التصوير الأدبيّ أو الفنيّ] (2) شفقة؛ رثاء.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الشَّجو: الهمُّ، وشجاه الهمُّ يشجوه شجواً فهو شَجٍ، أي مُهتمٌّ»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: >
            جذر شجو يُفيد الهم والحزن الذي يشغل القلب؛ واسم الفاعل من أشجى (مُشْجٍ)
            يُعني المُحزِن أو المُثير للشجا، مما يجعله ملائماً لـ pathos بوصفه صفة
            الأسلوب المؤثر.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──
    - lemma: "باثوس"
      decision: removed
      decision_reason: >
        تعريب صوتي من اليونانية/الإنجليزية pathos لا يستوفي معايير التعريب المقبول:
        الصيغة لا تقبل الاشتقاق الطبيعي (النسبة والجمع والتصغير) بيسر. فضلاً عن ذلك،
        يوجد مصطلح عربي معتمد (تهييج) في معاجم اللسانيات الصادرة عن مؤسسات أكاديمية
        عربية، مما يُسقط المسوّغ الرئيسي للتعريب. وفق مبدأ إيثار العربي على المعرَّب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "شجن"
      decision: removed
      decision_reason: >
        شجن اسمٌ للشعور النفسي (الحزن، الهم، الحاجة الشاغلة)، وليس مصطلحاً للأسلوب
        المُنتج لذلك الشعور. pathos هو الخاصية الأسلوبية لا الوجدان الناتج. ابن فارس
        يرجع الجذر إلى الاتصال والالتفاف لا الحزن أصلاً، والمعاجم الحديثة لا توثّق
        استخدامه مصطلحاً لـ pathos. اختبار الاستبدال: "أسلوب فيه شجن" وصفٌ حر،
        ليس مصطلحاً مسكوكاً يُحلّ محلّ pathos في السياق النقدي المتخصص.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "اسْتِمَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوثَّق استمالة مصطلحاً مستقلاً لـ pathos في أي معجم متخصص؛ هي وصف
        إجرائي يُذكر ضمن تعريف تهييج لا كمقابل معجمي مفرد. فضلاً عن ذلك، استمالة
        أعمّ من pathos إذ تشمل كل ضروب الإقناع العاطفي بما فيها اللاأسلوبي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "وَجَدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ مولَّد بالاشتقاق الصناعي ولا يرد في أي معجم. اختبار التثبيت المعجمي:
        لا وجود لوجدية كوحدة معجمية ثابتة في المعاجم العربية المتخصصة أو العامة.
        رفضٌ لغياب التثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تَرْقِيق"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المعجمية الموثقة للترقيق منصبّة على: (أ) ترقيق الأصوات في علم التجويد
        والقراءات، (ب) ترقيق المواد في الصناعة والبناء. لا علاقة لأيٍّ منهما بإثارة
        المشاعر. الاشتراك اللفظي شديد ومُضلِّل؛ الحذف إلزامي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "عَاطِفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        عاطفية مصطلح أعم يُقابل sentiment/emotion بشكل عام لا pathos بشكل خاص.
        pathos في الاصطلاح البلاغي هو الأسلوب المحدد لإثارة العواطف (الطريقة الأرسطية
        الثالثة في الإقناع)، وليس دلالةً عامة على العاطفة. عاطفية تصف النوع الجنسي
        لا النوع النوعي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مصطلحات مكتشفة من الجسر الإنجليزي (المرحلة ٢) ──
    - lemma: "تَهْيِيج"
      source: stage2
      decision: confirmed
      decision_reason: >
        المصطلح المعتمد لـ pathos في المعجم الموحد لمصطلحات اللسانيات (ALECSO 2002)
        بتعريف دقيق يُطابق المفهوم الأرسطي. على وزن تفعيل من هيّج، مصدر اسمي مذكر
        قياسي. يقبل الاشتقاق (تهييجي، تهييجية)، واضح الجنس (مصدر صناعي) والفصيلة
        (خطابي وجداني). اجتاز فحص السكّ (وحدة معجمية ثابتة في معجم متخصص).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تهييج يُبرز الجانب الديناميكي والفاعل: إثارة العواطف وتحريكها (فعل). الدلالة
        العلمية تتمحور حول التقنية الخطابية لاستدرار التعاطف وفق الإطار الأرسطي الثلاثي.
        يُقابل بالإنجليزية pathos بوصفه وسيلة لا غاية.
      actions:
        - command: create_entry
          params:
            lemma: "تَهْيِيج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُشْجٍ"
      source: stage2
      decision: confirmed
      decision_reason: >
        اسم فاعل من أشجى (رباعي)، يُعني "المُحزِن أو المثير للشجا والأسى". المورد
        الحديث (2008) يوثّقه مقابلاً مباشراً لـ pathos مع توسيعه ليشمل "شفقة؛ رثاء".
        مُشْجٍ وصف وظيفي للأسلوب ذي الوقع العاطفي. يقبل الاشتقاق (مُشْجِيَة،
        مُشْجِيَات). اجتاز فحص التثبيت المعجمي في معجم حديث معتمد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُشْجٍ يُبرز الجانب الوصفي والوجداني: الأسلوب الذي يُحزن ويُثير الشجا والشفقة
        (صفة). أكثر ارتباطاً بالحزن والرثاء، في حين تهييج أشمل ليغطي كل إثارة عاطفية
        (طرباً وحزناً وتعاطفاً). مُشْجٍ أدقّ للتعبير عن pathos في سياق التصوير الأدبي،
        وتهييج أنسب في السياق الخطابي والحجاجي.
      actions:
        - command: create_entry
          params:
            lemma: "مُشْجٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "أسلوب له القدرة على إثارة المشاعر"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في جوهره لكنه مبهم: (أ) لا يُشير إلى طبيعة الأسلوب
        الخطابية أو الأدبية أو الفنية، (ب) لا يُميّز بين إثارة المشاعر كحادث عارض
        وبين pathos كتقنية مقصودة لاستدرار التعاطف، (ج) يفتقر إلى السياق الأرسطي
        الذي يُعرَّف فيه المصطلح في المعاجم المتخصصة.
    authored:
      - type: terminological
        text: >
          أسلوبٌ خطابيٌّ أو فنيٌّ يستهدف استدرارَ عواطف المتلقي وإثارةَ تعاطفه
          واستمالةَ مشاعره؛ وهو إحدى الطرائق الثلاث في الإقناع الخطابي عند أرسطو
          إلى جانب الحجة العقلية (لوغوس) والمصداقية الأخلاقية (إيثوس)
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مصطلح بلاغي يوناني الأصل (πάθος) يُشير إلى الطاقة الانفعالية في الخطاب
          أو العمل الفني التي تُثير الحزنَ أو الشفقةَ أو التعاطفَ في نفس المتلقي.
