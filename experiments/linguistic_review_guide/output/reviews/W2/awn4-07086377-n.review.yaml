# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "تَهْيِيج"
      entry_id: "{auto}"
      root: "هيج"
      maqayis_quote: >
        «الْهَاءُ وَالْيَاءُ وَالْجِيمُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ
        عَلَى ثَوَرَانِ شَيْءٍ، وَالْآخَرُ عَلَى يُبْسِ نَبَاتٍ. فَالْأَوَّلُ:
        هَاجَ الْفَحْلُ هَيْجًا وَهِيَاجًا. وَكَذَلِكَ الدَّمُ: وَالْهَيْجَاءُ
        تُمَدُّ وَتُقْصَرُ. وَهِجْتُ الشَّرَّ وَهَيَّجْتُهُ.»

    - lemma: "مُشْجٍ"
      entry_id: "{auto}"
      root: "شجو"
      maqayis_quote: null
      # ملاحظة: جذر شجو/شجا لم يرد مستقلاً في مقاييس اللغة لابن فارس في قاعدة البيانات؛
      # بحث تحت شجن أعطى: «الشِّينُ وَالْجِيمُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ
      # عَلَى اتِّصَالِ الشَّيْءِ وَالْتِفَافِهِ» — وهو جذر مختلف.
      # المرجع المتاح: الخليل: «الشَّجو: الهمُّ، وشجاه الهمُّ يشجوه شجواً فهو شَجٍ»

  per_sense:
    - lemma: "تَهْيِيج"
      sense_id: "{auto}"
      nuance: >
        يُبرز الجانب الديناميكي والفاعل لـ pathos: إثارة العواطف وتهييجها (فعل
        الأسلوب في المتلقي). الدلالة تتمحور حول التقنية الخطابية الأرسطية لاستدرار
        التعاطف في السياق الحجاجي والخطابي. أنسب في مقام الدرس البلاغي الأكاديمي.

    - lemma: "مُشْجٍ"
      sense_id: "{auto}"
      nuance: >
        يُبرز الجانب الوصفي والوجداني لـ pathos: الصفة المُلصقة بالأسلوب أو العمل
        الذي يُثير الحزن والشجا والشفقة. أكثر ارتباطاً بالتصوير الأدبي والمرثاة منه
        بالخطابة. يُفيد الخاصية الانفعالية للنص أكثر من الإجراء الخطابي.

  synset:
    cultural_fit: lexical_gap
    # المفهوم موجود في الموروث البلاغي العربي (استمالة، تحريك العواطف، رقة الأسلوب)
