# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15319328-n
# float: the time interval between the deposit of a check in a bank and its payment
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (فترة التحصيل)، وهو مركب إضافي لا يغطي كل أبعاد المفهوم المالي"
      - "اللمّة الموجودة غير مشكّلة"
      - "المصطلح الإنجليزي float في السياق المصرفي له دلالة أوسع من مجرد collection period"
    observations: "المفهوم يتعلق بالفاصل الزمني بين إيداع الشيك في المصرف وصرف قيمته فعلياً، وهو مفهوم مالي مصرفي حديث. المصطلح العربي ينبغي أن يعبّر عن فكرة المدة العالقة بين الإجراءين المصرفيين. في العربية التراثية لا يوجد مقابل مباشر لهذا المفهوم لأنه نشأ مع النظام المصرفي الحديث."

  blind_candidates:
    - lemma: "مُهْلَةُ التَّحْصِيلِ"
      generation_method: tarkib
      justification: "مركب إضافي من «مُهْلَة» (المدة المحددة للانتظار) و«التحصيل» (جمع المال المستحق). يعبّر عن فكرة الانتظار الزمني قبل إتمام تحصيل قيمة الشيك."
    - lemma: "أَمَدُ التَّحْصِيلِ"
      generation_method: tarkib
      justification: "مركب إضافي من «أَمَد» (الغاية والمدة المحدودة) و«التحصيل». الأمد يشير إلى مدة لها نهاية معلومة، وهو أنسب من الفترة لأنه يوحي بالغاية المنتظرة."
    - lemma: "تَعْوِيم"
      generation_method: majaz
      justification: "مجاز من العَوْم (الطفو). في الاستعمال المالي الحديث، التعويم يدل على حالة المال العائم غير المستقر بين مرحلتين. هو ترجمة دلالية لـ float الإنجليزية عبر الإزاحة المجازية."
    - lemma: "عَائِمَة"
      generation_method: majaz
      justification: "اسم فاعل مؤنث من عام يعوم، استعمال مجازي للمبلغ أو المدة العائمة بين الإيداع والصرف. على وزن فاعلة الذي يصلح للدلالة على الحالة."

stage2_evidence:
  per_lemma:
    - lemma: "فَتْرَةُ التَّحْصِيلِ"
      confirm:
        - text: "«فترة التحصيل — collection period»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«(6) شيكات برَسْم التحصيل (اد)» ضمن مدخل float"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«تداول الائتمان بين البنوك — credit float»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يشير إلى وجود مصطلح مقابل لـ credit float في نفس المعجم، مما يعزز حقل التحصيل المصرفي"
        - text: "«فَترة فراغ — float time»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "مصطلح مقارب يستخدم «فترة» كمكوّن أول مع دلالة مغايرة (في إدارة المشاريع)"

    - lemma: "مُهْلَةُ التَّحْصِيلِ"
      expands:
        - text: "«مهلة — time limit»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "المهلة في المعجم التجاري تقابل time limit لا float"
        - text: "«مهلة عرفية — usance: لدفع الأوراق المالية في التجارة الخارجية»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "المهلة العرفية مصطلح مالي قريب لكنه مختلف: مدة سداد الأوراق المالية"
        - text: "«(مَهَلَ) الْمِيمُ وَالْهَاءُ وَاللَّامُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدَهُمَا عَلَى تُؤَدَةٍ، وَالْآخَرُ جِنْسٌ مِنَ الذَّائِبَاتِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر مهل يدل على التؤدة والإمهال، مما يوحي بمعنى الانتظار"

    - lemma: "أَمَدُ التَّحْصِيلِ"
      expands:
        - text: "«الأمد: الغاية، تقول بلغ أمده أي غايته... والأمد مدة لها حد مجهول إذا أطلق، وقد ينحصر فيقال أمد كذا كما يقال زمن كذا، والفرق بين الزمان والأمد أن الأمد يقال باعتبار الغاية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الأمد يركز على الغاية والنهاية لا على المدة الفاصلة بين حدثين"
        - text: "«(أَمَدَ) الْهَمْزَةُ وَالْمِيمُ وَالدَّالُ، الْأَمَدُ: الْغَايَةُ. كَلِمَةٌ وَاحِدَةٌ لَا يُقَاسُ عَلَيْهَا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر غير منقاس، مما يحد من إمكانيات الاشتقاق منه"

    - lemma: "تَعْوِيم"
      contradicts:
        - text: "«تعويم — flotation: عملية معالجة تدخل فيها الفقاعات الغازية في الماء فتلتصق بالجسيمات الصلبة»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "التعويم في المعاجم المتخصصة يقابل flotation (فصل معدني) لا float المصرفي"
        - text: "«تَعْوِيم — flotation: طريقة لفصل مسحوق المعدن عن الشوائب بتعويمه في سائل بنفخ الهواء»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          conflict: "المعنى نفسه: فصل صناعي بالتعويم، لا علاقة له بالمصرفية"

    - lemma: "عَائِمَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "فَتْرَةُ التَّحْصِيلِ"
      decision: confirmed
      decision_reason: "مصطلح مسجل في المعجم الموحد لمصطلحات التجارة والمحاسبة (ALECSO 1995) بوصفه مقابلاً لـ collection period، وهو ما يتوافق مع المفهوم المطلوب. كما ورد في المورد الحديث ربط التحصيل بالشيكات المصرفية. المركب ثابت معجمياً ومتداول في النصوص المالية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَتْرَةُ التَّحْصِيلِ"

    - lemma: "مُهْلَةُ التَّحْصِيلِ"
      source: stage1
      decision: removed
      decision_reason: "المهلة في المعاجم التجارية تقابل time limit أو delay، وتوحي بالإمهال والتأجيل الإرادي. أما float فهو فاصل زمني إجرائي لا إرادي، فلا تصح المهلة هنا. فضلاً عن أن المركب غير مسجل في أي معجم متخصص."

    - lemma: "أَمَدُ التَّحْصِيلِ"
      source: stage1
      decision: removed
      decision_reason: "الأمد يدل على الغاية والمنتهى لا على الفاصل الزمني بين حدثين. كما أن ابن فارس وصف الجذر بأنه كلمة واحدة لا يُقاس عليها. والمركب غير مسجل في المعاجم المتخصصة."

    - lemma: "تَعْوِيم"
      source: stage1
      decision: removed
      decision_reason: "التعويم في المعاجم العربية المتخصصة (هندسة مدنية، نفط) يقابل flotation (الفصل المعدني بالتعويم)، لا float المصرفي. استخدامه هنا سيولّد اشتراكاً لفظياً مع مصطلح راسخ في حقل مختلف. كما أن تعويم العملة (currency float) مصطلح شائع آخر قد يسبب لبساً."

    - lemma: "عَائِمَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على استخدام عائمة بالمعنى المصرفي. المصطلح غير مسكوك ولا مسجل، ويفتقر إلى التثبيت المعجمي اللازم."

stage4_content:
  definition:
    current: "الفترة الزمنية بين إيداع الشيك في البنك وصرفه"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد في مجمله لكنه يحتاج إلى تدقيق: (١) «البنك» أفصح منها «المصرف» في السياق المالي المتخصص لكنها مقبولة، (٢) «صرفه» غامضة قليلاً ويُستحسن توضيح أن المقصود هو تسوية قيمته المالية لا مجرد الصرف النقدي، (٣) إضافة الجنس القريب (مدة زمنية في العمليات المصرفية) يُحسّن التعريف."
    authored:
      - type: terminological
        text: "مُدَّةٌ زَمَنِيَّةٌ في العَمَلِيّاتِ المَصْرِفِيَّةِ تَقَعُ بَيْنَ إيداعِ الصَّكِّ في المَصْرِفِ وتَسْوِيَةِ قِيمَتِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "المُدَّةُ الفاصِلَةُ بَيْنَ إيداعِ الشِّيكِ وصَرْفِ قِيمَتِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُدَّةٌ زَمَنِيَّةٌ في العَمَلِيّاتِ المَصْرِفِيَّةِ تَقَعُ بَيْنَ إيداعِ الصَّكِّ في المَصْرِفِ وتَسْوِيَةِ قِيمَتِهِ"

  examples:
    per_lemma:
      - lemma: "فَتْرَةُ التَّحْصِيلِ"
        examples:
          - text: "تسعى المصارف إلى تقليص فترة التحصيل عبر أنظمة المقاصة الإلكترونية لتسريع إتاحة الأرصدة للعملاء."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تسعى المصارف إلى تقليص فترة التحصيل عبر أنظمة المقاصة الإلكترونية لتسريع إتاحة الأرصدة للعملاء."

