stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي واسع قليلاً وقد يختلط بجموع الجماهير العامة."
      - "اللمّات الموجودة في صيغة الجمع، وهو مناسب لتعريف 'مجموعة'، لكن يجب التأكد من ضبط التشكيل."
    observations: "المجموعة تعبّر عن كيان جماعي يربطه غرض مشترك (اتباع شخص أو فكرة)، وهو ما يعكسه الربط مع كلمة 'جماهير' كأصل عام."
  blind_candidates:
    - lemma: "أَتْبَاع"
      generation_method: ishtiqaq
      justification: "الجمع القياسي لـ 'تابع'، وهو اللفظ المباشر المقابل لـ followers."
    - lemma: "مُرِيدُونَ"
      generation_method: ishtiqaq
      justification: "يُطلق على المخلصين في اتباع شخص أو مذهب، خاصة في السياقات الروحية والفنية."
    - lemma: "مُعْجَبُونَ"
      generation_method: ishtiqaq
      justification: "اللفظ الشائع حديثاً للتعبير عن المتحمسين (enthusiasts/fans) لشخصية أو عمل ما."
    - lemma: "مُتَحَمِّسُونَ"
      generation_method: ishtiqaq
      justification: "ترجمة دقيقة لكلمة enthusiasts، وتعبر عن الشدة في التأييد أو الاهتمام."

stage2_evidence:
  per_lemma:
    - lemma: "أَتْبَاع"
      confirm:
        - text: "«(2) أتباع؛ أنصار.إثرَ؛ عَقِب.»"
          source: "المورد الحديث"
        - text: "«الأنصار: من (ن ص ر) الأتباع وأهل مدينة الرسول الكريم...»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "أَنْصَار"
      confirm:
        - text: "«(الْأَنْصَار) أهل مَدِينَة الرَّسُول الَّذين ناصروه حِين هَاجر إِلَيْهِم وهم خلاف الْمُهَاجِرين»"
          source: "المعجم الوسيط"
        - text: "«أَنْصَار: من (ن ص ر) الأتباع وأهل مدينة الرسول...»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُرِيدُونَ"
      confirm:
        - text: "«المُرِيد: هو المجرد عن الإرادة... من انقطع إلى الله عن نظر واستبصار»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«مُرِيد: من (ر و د) الراغب المحب ومنه المريد في الصوفية وهو أول مراتب الصوفي.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُعْجَبُونَ"
      confirm:
        - text: "«مُعْجَب: من (ع ج ب) المسرور بالشيء والمزهو بما يكون منه حسنا أو قبيحا.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«التابع؛ المُرِيد... المُعْجَب؛ النصير.»"
          source: "المورد الحديث (ترجمة follower)"

stage3_analysis:
  per_lemma:
    - lemma: "أتباع"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والأكثر شيوعاً للتعبير عن المتابعين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَتْبَاع"
    - lemma: "أنصار"
      decision: confirmed
      decision_reason: "يدل على المتابعين الذين يقدمون الدعم والتأييد (supporters)، وهو جزء أساسي من مفهوم المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَنْصَار"
    - lemma: "مُرِيدُونَ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق للتعبير عن الأتباع المخلصين أو المتحمسين لشيء ما."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُرِيدُونَ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08240184-n"}
    - lemma: "مُعْجَبُونَ"
      source: stage1
      decision: confirmed
      decision_reason: "يعبّر بدقة عن جانب 'المتحمسين' (enthusiasts) في الاستخدام المعاصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُعْجَبُونَ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08240184-n"}

stage4_content:
  definition:
    current: "مجموعة من المتابعين أو المتحمسين"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً، ويفضل صياغته بأسلوب معجمي يوضح طبيعة الجماعة."
    authored:
      - type: linguistic
        text: "جماعةٌ تَدينُ بالولاء لشخصٍ أو تَلْتفُّ حولَ فكرةٍ أو تُبدي إعجاباً بشيءٍ ما وتُناصره."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "أَتْبَاع"
        examples:
          - text: "ازدادَ عددُ أَتْبَاعِ الفيلسوفِ بعدَ نشرِ كتابِهِ الأخيرِ."
            type: usage
      - lemma: "أَنْصَار"
        examples:
          - text: "احتشدَ أَنْصَارُ الحزبِ في الميدانِ العامِ تأييداً لمرشحهم."
            type: usage
      - lemma: "مُرِيدُونَ"
        examples:
          - text: "التفَّ المُرِيدُونَ حولَ شيخِهم يستمعونَ إلى وعظِهِ."
            type: usage
      - lemma: "مُعْجَبُونَ"
        examples:
          - text: "تجمهرَ المُعْجَبُونَ أمامَ المسرحِ بانتظارِ ظهورِ النجمِ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-08240184-n", definition_index: 0, text: "جماعةٌ تَدينُ بالولاء لشخصٍ أو تَلْتفُّ حولَ فكرةٍ أو تُبدي إعجاباً بشيءٍ ما وتُناصره."}

