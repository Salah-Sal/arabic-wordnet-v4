# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15204935-n (deadline)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «موعد نهائي» مركب وصفي حديث لا يرد في المعاجم التراثية بوصفه وحدة معجمية ثابتة"
      - "غياب لمّة مفردة تراثية كـ«أَجَل» الذي يدل في أصل اللغة على غاية الوقت"
      - "المجموعة تحتوي لمّة واحدة فقط مما يُضعف تمثيلها الدلالي"
    observations: "المفهوم — النقطة الزمنية القصوى لإنجاز عمل — مفهوم أصيل في العربية يُعبَّر عنه بألفاظ متعددة: أَجَل (غاية الوقت)، أَمَد (الغاية والمنتهى)، مِيقَات (الوقت المضروب للفعل). التعبير الحديث «موعد نهائي» شائع في لغة الإدارة والإعلام لكنه مركب وصفي شفّاف وليس مصطلحاً مسكوكاً بالمعنى الدقيق."
  blind_candidates:
    - lemma: "أَجَل"
      generation_method: ishtiqaq
      justification: "من الجذر أ-ج-ل على وزن فَعَل، ومعناه في كتاب العين ومقاييس اللغة: غاية الوقت في محلّ الدَّيْن وغيره. يدل مباشرة على الحد الزمني الذي يجب إنجاز الأمر عنده."
    - lemma: "أَمَد"
      generation_method: ishtiqaq
      justification: "من الجذر أ-م-د على وزن فَعَل، ومعناه الغاية والمنتهى. يستعمل للدلالة على نهاية المدة الزمنية المحددة لأمر ما."
    - lemma: "حَدّ زَمَنِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من حَدّ (الغاية والنهاية) وزَمَنِيّ (نسبة إلى الزمن)، يدل على الحد الأقصى في الزمن لإتمام شيء."
    - lemma: "مِيقَات"
      generation_method: ishtiqaq
      justification: "من الجذر و-ق-ت على وزن مِفْعال (للآلة والظرف)، ومعناه في الوسيط: الوقت المضروب للفعل والموعد الذي جُعل له وقت."

stage2_evidence:
  per_lemma:
    - lemma: "مَوْعِد نِهَائِيّ"
      confirm:
        - text: "«الموعد الأخير [لإنجاز عمل ما]»"
          source: "المورد الحديث (2008)"
        - text: "«آخر موعد للتسجيل» — ترجمة Check-in time limit"
          source: "مسرد الفن والتسلية والرياضة، أليكسو"
        - text: "«أخر موعد — المدة الزمنية حاوية أو مقطورة يجب إدخالها ضمن البيانات الموجودة في المحطة بهدف استقبال قطار المخصص للتحميل»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      expands:
        - text: "«(الموعد) الوَعْد ومكانُه وزمانُه والعَهْد (ج) مواعد»"
          source: "المعجم الوسيط"
          addition: "الموعد يدل على الزمان والمكان والوعد عموماً، فإضافة نهائي تخصّصه بمعنى الحد الأقصى"
    - lemma: "أَجَل"
      confirm:
        - text: "«غاية الوقت في الموت محل الدين ونحوه»"
          source: "كتاب العين"
        - text: "«فالأَجَلُ غايةُ الوقتِ في مَحَلِّ الدَّيْنِ وغيرِه. وقد صرّفه الخليل فقال أَجِلَ هذا الشيءُ وهو يأجَل، والاسم الآجِل نقيض العاجل والأجيلُ المُرجَأُ أي المؤخَّر إلى وقت»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الأَجل: مدة الشيء ووقته الذي يحل فيه: هو الوقتُ المضروب المحدود في المستقبل»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«الأَجَلُ محرَّكةً: غاية الوَقْتِ في المَوْت وحُلولُ الدَّيْن ومُدَّةُ الشيءِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«غاية الوقت التأخر المُدّة والغاية التجمع»"
          source: "المعجم الكبير"
      expands:
        - text: "«أَجَلٌ — translation_en: term» (قانون)؛ «أَجَلٌ — due date» (رياضيات)؛ «أجل — time limit» (فنون)"
          source: "معاجم أليكسو الموحدة (أرابتيرم)"
          addition: "يُستعمل الأجل في المصطلحات الحديثة بدلالة المهلة والموعد المحدد في مجالات القانون والتجارة والرياضيات"
        - text: "«آخِرُ أَجَل — deadline» و«أجل أقصى — deadline»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) / مسرد الإعلام والتواصل"
          addition: "المركّبات آخر أجل وأجل أقصى تُستعمل ترجمةً مباشرة لـ deadline في المعاجم الموحدة"
    - lemma: "أَمَد"
      confirm:
        - text: "«الأَمَدُ: الغاية كالمَدَى»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«الأَمَدُ: الغاية والنهاية والمـدى، يقال: ضرب له أمَدًا»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الهمزة والميم والدال، الأَمَدُ: الغاية. كلمة واحدة لا يُقاس عليها»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأمد يدل على الغاية والمدة عموماً لا على نقطة زمنية محددة يجب الإنجاز عندها، وابن فارس يصفه بأنه كلمة واحدة لا يُقاس عليها"
        - text: "«الأمد يقال باعتبار الغاية والزمان عامّ في المبدأ والغاية... والفرق بين الزمان والأمد أنّ الأمد يقال باعتبار الغاية»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          conflict: "الأمد أعمّ من المفهوم المطلوب إذ يدل على مدة لها حدّ مجهول بخلاف الأجل الذي يحدد نقطة زمنية بعينها"
    - lemma: "حَدّ زَمَنِيّ"
      evidence_status: "no_material_found"
    - lemma: "مِيقَات"
      confirm:
        - text: "«(المِيقَاتُ) الوقتُ المضروب للفعل والموعدُ الذي جُعل له وقت والموضعُ الذي جُعل للشيء يُفعل عنده (ج) مواقيت»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الميقات: هو في الأصل الوقت المحدود ثم استعير للمكان أي موضع الإحرام»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الميقات غلب استعماله في السياق الشرعي (مواقيت الحج والصلاة) فيُلبس إذا استُعمل بمعنى deadline العام"

stage3_analysis:
  per_lemma:
    - lemma: "مَوْعِد نِهَائِيّ"
      decision: confirmed
      decision_reason: "مركب وصفي شائع الاستعمال في العربية المعاصرة للدلالة على النقطة الزمنية القصوى لإنجاز عمل. وإن لم يرد في المعاجم التراثية كوحدة معجمية ثابتة فهو مستقرّ في الاستعمال الإداري والإعلامي المعاصر، وشفافيته الدلالية تجعله سهل الفهم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يختص بالسياق الإداري والمهني المعاصر، ويؤكّد على صفة النهائية (عدم قابلية التمديد)، بخلاف أَجَل الذي قد يكون قابلاً للتأجيل."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْعِد نِهَائِيّ"
    - lemma: "أَجَل"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي أصيل مؤيَّد بأدلة معجمية واسعة من كتاب العين ومقاييس اللغة والقاموس المحيط والوسيط. معناه الأساسي «غاية الوقت» يتطابق مع المفهوم المطلوب. يُستعمل في المعاجم الاصطلاحية الحديثة (أليكسو) بدلالة term وdue date وtime limit."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ تراثي جامع يدل على غاية الوقت ومدة الشيء المحددة، يُستعمل في السياقات القانونية والتجارية والشرعية، أعمّ من موعد نهائي إذ قد يشمل مهلة قابلة للتأجيل."
      actions:
        - command: create_entry
          params:
            lemma: "أَجَل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "أَمَد"
      source: stage1
      decision: removed
      decision_reason: "الأمد يدل على الغاية والمنتهى من حيث المدة الزمنية عموماً، لا على نقطة زمنية محددة يجب الإنجاز عندها. وصفه ابن فارس بأنه «كلمة واحدة لا يُقاس عليها»، والراغب فرّق بينه وبين الأجل بأنه «مدة لها حد مجهول إذا أُطلق». دلالته أقرب إلى span/period منها إلى deadline."
      evidence_assessment:
        case: mixed
    - lemma: "حَدّ زَمَنِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي وصفي لا يرد في المعاجم وحدةً معجمية ثابتة. يفشل في اختبار السكّ: يمكن إبدال حدّ بـ«قيد» أو «سقف» وبقاء المعنى مفهوماً، مما يدل على أنه عبارة وصفية حرة لا مصطلح."
      evidence_assessment:
        case: no_material
    - lemma: "مِيقَات"
      source: stage1
      decision: removed
      decision_reason: "رغم أن معناه اللغوي (الوقت المضروب للفعل) قريب من المفهوم، إلا أنه غلب استعماله في السياق الشرعي (مواقيت الحج والصلاة) غلبة تمنع استعماله بمعنى deadline دون لَبْس. التهانوي نفسه نبّه على أنه «استعير للمكان أي موضع الإحرام»."
      evidence_assessment:
        case: mixed

