      decision: revise
      reason: "التعريف الحالي مقبول دلالياً لكنه ترجمة حرفية للإنجليزية. يحتاج إلى صياغة بأسلوب المعجم الوسيط مع تدقيق في الجنس القريب (الوقت المحدد) والفصل النوعي (وجوب إتمام العمل)."
