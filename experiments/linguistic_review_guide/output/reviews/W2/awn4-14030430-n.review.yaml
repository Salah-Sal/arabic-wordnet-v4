# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  # المرشحات العُمياء: وُلِّدت من التعريف فقط قبل الاطلاع على اللمّات
  blind_candidates:
    - lemma: "فَاعِلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (ف ع ل) على وزن المصدر الصناعي من اسم الفاعل "فَاعِل"
        (+يَّة)، يدل على الخاصية الكامنة في كل ما هو فاعل ومنطلق، وهو مناسب
        تماماً للدلالة على حالة كون الشيء فاعلاً نشطاً (الفاعلية المجردة).
    - lemma: "تَحَرُّك"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل (تحرَّك) من جذر (ح ر ك) على وزن تَفَعُّل، يدل على
        الدخول في حالة الحركة والانطلاق، وهو مرادف قريب لحالة النشاط.
    - lemma: "حَيَوِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من (حيوي) من جذر (ح ي ي)، يدل على حالة الحياة
        والنشاط الكامنة في الكائن، وهو يُعبّر عن طاقة الفعل والتوثُّب.
    - lemma: "اِشْتِغَال"
      generation_method: majaz
      justification: >
        مصدر (اشتغل) من جذر (ش غ ل) على وزن افتعال، أصله الانهماك في
        الشُّغل؛ استُعير للدلالة على حالة النشاط والعمل في مقابل التوقف،
        لما يقتضيه الشُّغل من فاعلية مستمرة.

  assessment:
    concerns:
      - "التعريف الحالي «حالة كونه نشطاً» مصاغ بأسلوب ترجمي حرفي وليس بأسلوب المعجمية العربية."
      - "لمّة «حركة» تعني في المقام الأول الانتقالَ المكاني أو الحركةَ الفيزيائية، وليست المفهومَ المجرد «الفاعلية»."
      - "لمّة «فعالية» تُستخدم في المصادر الحديثة للدلالة على الكفاءة والفعالية (effectiveness/efficiency) لا على النشاط المجرد."
      - "غياب التشكيل الكامل عن جميع لمّات المجموعة الثلاث."
    observations: >
      هذه المجموعة تمثل المفهوم الفلسفي المجرد «الفاعلية» أو «حالة كون الشيء
      نشطاً»، وهو ما يقابل activeness/activity في الإنجليزية. المفهوم عربيٌّ
      أصيل يُعبَّر عنه بـ«نَشَاط» بامتياز. أما «حركة» فمعناها الأصلي
      الانتقالُ المكاني وخروج الجسم من القوة إلى الفعل على سبيل التدريج،
      وهذا وصف للحركة الفيزيائية لا للفاعلية المجردة. أما «فعالية» فمعناها
      الغالب الكفاءة وإحداث الأثر (effectiveness)، لا حالة النشاط ذاتها.
      يستحسن الإبقاء على «نشاط»، واستبقاء «فعالية» بتحفظ، وإضافة «فاعلية»
      بوصفها الأدق تعبيراً عن المفهوم المجرد.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# ميزانية الاستعلامات المُستخدمة: ٥ استعلامات
# Q1: مطابقة دفعية للمّات الموجودة + المرشحات (مع ال- وبدونها)
# Q2: الجسر الإنجليزي (action / activity / activeness / active)
# Q3: إثراء بالمعرّف (definitions + examples لعينة entry_ids)
# Q4: مقاييس اللغة (dictionary_id=151) للجذور نشط / فعل / حرك / شغل / حيي
stage2_evidence:
  per_lemma:

    - lemma: "حَرَكَة"
      confirm:
        - text: "«تطْلَقُ الكلمة مَجازاً على حَرَكاتِ النَّفْسِ والذَّهْنِ والحركاتِ الاجتماعية»"
          source: "المعجم الكبير (ocr)"
      contradicts:
        - text: "«الحَرَكَةُ: حُصُول الْجَوْهَر فِي حيّز قبل حُصُوله فِي حيّز آخر»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani)"
          conflict: "التعريف يخصّ الحركة الفيزيائية الانتقالية، لا حالة النشاط المجردة."
        - text: "«(في العرف العام): انتقال الجسم من مكان إلى مكان آخر»"
          source: "المعجم الوسيط (ocr)"
          conflict: "المعنى الأساسي هو الانتقال المكاني، ويختلف عن مفهوم «الفاعلية» الذي تمثله المجموعة."
        - text: "«الحركة: الخروج من القوة إلى الفعل تدريجاً»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
          conflict: "المفهوم الفلسفي للحركة يختلف عن مفهوم الفاعلية؛ الحركة تدريجية وزمانية بينما الفاعلية حالة ثابتة."
      expands:
        - text: "«movement | تَغَيُّرُ مُتَّصِلٌ، ذُو سُرْعَةِ مُعَيَّنَةٍ لوَضْعِ الشيء في المكان»"
          source: "المعجم الكبير (ocr)"
          addition: "التعريف الاصطلاحي للحركة يؤكد ارتباطها بالتغير الفيزيائي لا بالحالة الذهنية أو المجردة."

    - lemma: "فَعَالِيَة"
      confirm:
        - text: "«فَعَاليَة — المعنى: نشاط وتأثير. الصواب والرتبة: فَعَالِيَة [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (hawramani)"
        - text: "«نشاط، فَعَّاليَّة — activity»"
          source: "المعجم الموحد لمصطلحات الكيمياء (arabterm)"
        - text: "«فَعالِيَّة، نَشَاط — activity (Pharmacy)»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (arabterm)"
      contradicts:
        - text: "«فَعَّالِيَّة — effectiveness (Veterinary Medicine)»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (arabterm)"
          conflict: "الترجمة الغالبة في المصادر التقنية هي effectiveness/efficiency لا activeness، مما يُشير إلى أن الكلمة تحمل بُعداً تقييمياً (الكفاءة) لا وصفياً حالياً."
        - text: "«فَعَّالِيَّة — efficiency (Information and Communication)»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (arabterm)"
          conflict: "ورودها بمعنى efficiency (الكفاءة) يُبيّن أن المعنى الأساسي يرتبط بإحداث الأثر لا بحالة النشاط."
      expands:
        - text: "«فَعَّالِيَّة — مرفوضة؛ السبب: لعدم ورودها في المعاجم القديمة. جاء ضمن قرارات مجمع اللغة العربية»"
          source: "معجم الصواب اللغوي (hawramani)"
          addition: "المجمع اللغوي المصري قَبِل فعالية اصطلاحاً حديثاً مما يُضفي عليها شرعيةً معجمية رسمية."

    - lemma: "نَشَاط"
      confirm:
        - text: "«ممارسة صادقة لعمل من الأعمال. يقال: لفلان نشاط زراعيّ أو تجاريّ»"
          source: "المعجم الوسيط (ocr)"
        - text: "«نشاط — activity (multiple domains: Education, Sociology, Geology, Biology, Seismology, Electropedia...)»"
          source: "مجمع المعاجم الموحدة للجامعة العربية (arabterm)"
        - text: "«(1) نشاط (2) حيوية (3) فعالية؛ فاعلية (4) رشاقة (5) ضرب من ضروب النشاط — activity»"
          source: "المورد الحديث (2008) (arabterm)"
        - text: "«نَشِطَ — النُّونُ وَالشِّينُ وَالطَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اهْتِزَازٍ وَحَرَكَةٍ. مِنْهُ النَّشَاطُ مَعْرُوفٌ وَهُوَ لِمَا فِيهِ مِنَ الْحَرَكَةِ وَالِاهْتِزَازِ وَالتَّفَتُّحِ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"

    - lemma: "فَاعِلِيَّة"
      confirm:
        - text: "«الفاعلية: وصف في كل ما هو فاعل»"
          source: "المعجم الوسيط (ocr)"
        - text: "«فاعليّة — activity (Philosophy and Psychology)»"
          source: "مسرد الفلسفة وعلم النفس للجامعة العربية (arabterm)"
        - text: "«نشاط (ن)، فاعلية — activity (Physics)»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (arabterm)"
        - text: "«فاعِلِيَّة، نشاط — activity (Gross Anatomy)»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (arabterm)"

    - lemma: "تَحَرُّك"
      contradicts:
        - text: "«تحرَّك: حَرُك في قوَّةٍ» — وصف فعلي لا مصدر حالة"
          source: "المعجم الوسيط (ocr)"
          conflict: "المعجم يُثبته فعلاً لا اسماً، وكمصدر هو يدل على الانتقال المكاني (locomotion)."
        - text: "«تَحَرُّك — locomotion / motility / mobility (Veterinary Medicine / Medical)»"
          source: "المعجم الطبي الموحد (arabterm)"
          conflict: "المصادر التقنية تترجمه locomotion/motility أي الحركة الانتقالية الفيزيائية، لا الفاعلية المجردة."

    - lemma: "حَيَوِيَّة"
      confirm:
        - text: "«حيوية — vitality (Education / Biology / Hygienics / Sociology)»"
          source: "المعاجم الموحدة للجامعة العربية (arabterm)"
      contradicts:
        - text: "«حيوية — viability (AGROVOC)»"
          source: "المَكنَز الزراعي متعدد اللغات (arabterm)"
          conflict: "تُترجم أيضاً بـviability (القابلية للحياة) مما يُبيّن تبايناً دلالياً يجعلها أبعد عن activeness."
      expands:
        - text: "«(2) حيوية — activity» (المرتبة الثانية)"
          source: "المورد الحديث (2008) (arabterm)"
          addition: "المورد الحديث يُدرجها كمرادف ثانوي لـactivity، مما يُثبت تداخلاً جزئياً مع المفهوم لكنه ليس المعنى الأساسي."

    - lemma: "اِشْتِغَال"
      expands:
        - text: "«الإشتغال: محاولة أسباب حصول المطلوب وممارسة ذلك ومعالجته»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
          addition: "يدل على التوجه نحو الفعل وممارسته، وهو قريب من معنى النشاط ولكن يُركّز على المحاولة والمعالجة."
        - text: "«اشتغال — working (تُقال عن حالة نظام أو برمجية مقابل حالة استراحة أو توقف)»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (arabterm)"
          addition: "في المصطلحية التقنية تحولت إلى مصطلح تقني (operational state) بعيداً عن المفهوم العام للنشاط."


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حَرَكَة"
      decision: removed
      decision_reason: >
        أدلة المعاجم المتعددة — الوسيط والكبير والسيوطي والمناوي — تؤكد أن
        «الحركة» تعني الانتقال المكاني وخروج الجسم من القوة إلى الفعل
        تدريجياً، وهو مفهوم الحركة الفيزيائية الفلسفية. والمجموعة الترادفية
        هنا تمثل المفهوم المجرد «الفاعلية» (activeness) لا «الحركة/النقلة».
        إدراج «حركة» يُحدث لبساً مع synsets أخرى خاصة بالحركة الفيزيائية
        والانتقال المكاني. المورد الحديث لم يُدرجها ضمن مرادفات activity.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فَعَالِيَة"
      decision: confirmed
      decision_reason: >
        يُثبت معجم الصواب اللغوي صراحةً أن المعنى الأصيل لفعالية هو «نشاط
        وتأثير»، كما تُدرجها معاجم تقنية متعددة (الكيمياء، الصيدلة) مقابل
        activity. رغم ميل المصادر التقنية نحو effectiveness، فإن المعنى
        الجامع للمصطلح يشمل النشاط والأثر معاً؛ وهو ما يُبرّر بقاءها في
        هذه المجموعة مع الإشارة في nuance إلى بُعدها التقييمي. التشكيل
        الصحيح هو فَعَالِيَة بعين مشددة بالفتحة (لا بالشدة) وفق الصواب.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز فعالية على الأثر الناتج عن النشاط وقدرته على إحداث التغيير،
        وهي مُحمَّلة ببُعد تقييمي يُوحي بأن النشاط كفء ومؤثر (effectiveness
        + activity)؛ وتختلف عن «نشاط» الذي يصف الحالة دون تقييم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَعَالِيَة"

    - lemma: "نَشَاط"
      decision: confirmed
      decision_reason: >
        الأقوى توثيقاً وأكثر اللمّات ملاءمةً للمجموعة. المعجم الوسيط يُعرّفه
        بـ«ممارسة صادقة لعمل من الأعمال»، ومقاييس اللغة تُرجع جذره نشط إلى
        «اهتزاز وحركة» — مما يُثبت دلالته الأصيلة على الفاعلية والتوثب.
        جميع المعاجم التقنية المعاصرة تُترجمه بـactivity. المورد الحديث يجعله
        المرادف الأول لـactivity. لا غموض في دلالته.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن الطاقة الداخلية والتوقُّد الذاتي والهمّة في الإنجاز؛
        وهو أعمُّ اللمّات وأكثرها توصيفاً للحالة الذاتية الداخلية في حد ذاتها
        (being active بالمعنى النفسي والعملي معاً)، بخلاف فعالية التي تتجه
        نحو الأثر الخارجي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَشَاط"

    - lemma: "فَاعِلِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        الأدلة المعجمية قاطعة: المعجم الوسيط يُعرّفها بـ«وصف في كل ما هو
        فاعل»، ومسرد الفلسفة وعلم النفس يترجمها بـactivity مباشرةً، ومعجم
        الفيزياء يُدرجها مقابل activity مقترنةً بنشاط. وزن الكلمة (فاعلية ←
        فاعل + ية) يُصوّر المصدر الصناعي الدال على الخاصية، وهو وزن مقيس
        للدلالة على المفاهيم المجردة. إضافتها تُثري المجموعة بمصطلح أكثر
        دقةً في التعبير عن «activeness» كخاصية ذاتية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على الخاصية الجوهرية الكامنة في الذات الفاعلة (being an agent,
        having agency)، وهي أقرب للمعنى الفلسفي لـactiveness، وتختلف عن
        «نشاط» الذي يصف الحالة الآنية، وعن «فعالية» التي تصف الأثر.
      actions:
        - command: create_entry
          params:
            lemma: "فَاعِلِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَحَرُّك"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الوسيط يثبته فعلاً لا مصدراً للحالة، والمعاجم التقنية تترجمه
        locomotion/motility أي الحركة الانتقالية الفيزيائية. اشتراط «التدرّج
        الزماني والمكاني» في دلالته يجعله بعيداً عن المفهوم المجرد للفاعلية.

    - lemma: "حَيَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مفهومها الأصلي هو vitality (الحيوية الحيّة)، وتُترجم أيضاً بـviability
        (القابلية للحياة) وهو ما يُبيّن سعتها الدلالية المتجاوزة للفاعلية
        المجردة. وإن كان المورد الحديث يضعها مرادفاً ثانوياً لـactivity، إلا
        أن تضمينها يزيد من غموض المجموعة دون إضافة حقيقية.

    - lemma: "اِشْتِغَال"
      source: stage1
      decision: removed
      decision_reason: >
        تحوّل في المصطلحية التقنية المعاصرة إلى مصطلح تقني لحالة التشغيل
        مقابل التوقف (operational/working state) في أنظمة المعلومات.
        الدلالة المعجمية الكلاسيكية (الانهماك في تحصيل المطلوب) قريبة من
        المفهوم لكنها أخصّ منه، وإضافته ستُربك حدود المجموعة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "حالة كونه نشطاً"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي بنية دخيلة مترجمة حرفياً من الإنجليزية "the state of being
        active" → "حالة كونه نشطاً". وزن الأسلوب غير عربي (كونه + صفة) ولا
        يُفيد الجنس القريب والفصل النوعي بالأسلوب المعجمي المعهود.
    authored:
      - type: terminological
        text: >
          حالةٌ تتسمُ بالانهماكِ في الفعل وأداءِ الأعمالِ والمهام، في مقابل
          الخمولِ أو التوقفِ عن العمل
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          التوقُّدُ والهِمَّةُ الدَّافعةُ إلى ممارسةِ الأعمالِ وإنجازِها؛
          يُقال: هو في نشاطٍ دائم
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
