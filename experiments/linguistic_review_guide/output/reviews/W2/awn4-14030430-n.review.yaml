        value: '{"root":"فعل","maqayis":"«الْفَاءُ وَالْعَيْنُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِحْدَاثِ شَيْءٍ مِنْ عَمَلٍ وَغَيْرِهِ»"}'
    # فاعلية — sense note
