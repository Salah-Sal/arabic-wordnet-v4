# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "نَشَاط"
      entry_id: "{auto}"
      root: "نشط"
      maqayis_quote: >
        «النُّونُ وَالشِّينُ وَالطَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اهْتِزَازٍ
        وَحَرَكَةٍ. مِنْهُ النَّشَاطُ مَعْرُوفٌ وَهُوَ لِمَا فِيهِ مِنَ
        الْحَرَكَةِ وَالِاهْتِزَازِ وَالتَّفَتُّحِ»

    - lemma: "فَعَالِيَة"
      entry_id: "{auto}"
      root: "فعل"
      maqayis_quote: >
        «الْفَاءُ وَالْعَيْنُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِحْدَاثِ
        شَيْءٍ مِنْ عَمَلٍ وَغَيْرِهِ. مِنْ ذَلِكَ: فَعَلْتُ كَذَا أَفْعَلُهُ
        فَعْلاً»

    - lemma: "فَاعِلِيَّة"
      entry_id: "{auto}"
      root: "فعل"
      maqayis_quote: >
        «الْفَاءُ وَالْعَيْنُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِحْدَاثِ
        شَيْءٍ مِنْ عَمَلٍ وَغَيْرِهِ. مِنْ ذَلِكَ: فَعَلْتُ كَذَا أَفْعَلُهُ
        فَعْلاً»

  per_sense:
    - lemma: "نَشَاط"
      sense_id: "{auto}"
      nuance: >
        يُعبّر عن الطاقة الداخلية والتوثُّب الذاتي وخِفَّة النفس في الإقبال
        على العمل؛ يصف الحالةَ الآنيةَ للنشاط في ذاتها بصرف النظر عن
        نتائجها، وهو الأعمّ والأشيع في الاستخدام العربي.

    - lemma: "فَعَالِيَة"
      sense_id: "{auto}"
      nuance: >
        تُركّز على البُعد الأثري للنشاط: فالفاعلية نشاطٌ مصحوب بالقدرة
        على إنتاج أثر ملموس (effectiveness + activity)؛ وهي لذلك مُحمَّلة
        ببُعد تقييمي يميّزها عن نشاط الذي هو وصفي محض.

    - lemma: "فَاعِلِيَّة"
      sense_id: "{auto}"
      nuance: >
        تُصوِّر الخاصيةَ الجوهريةَ الكامنةَ في الذات الفاعلة (agency)؛
        هي صفة كون الشيء فاعلاً بطبيعته لا بالعَرَض، وتنتمي لأسلوب
        التعبير الفلسفي أكثر من غيرها، مما يجعلها الأدق لـactiveness
        بالمعنى الفلسفي المجرد.

  synset:
    cultural_fit: native

  actions:
    # نشاط — entry note
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نشط","maqayis":"«النُّونُ وَالشِّينُ وَالطَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اهْتِزَازٍ وَحَرَكَةٍ. مِنْهُ النَّشَاطُ مَعْرُوفٌ وَهُوَ لِمَا فِيهِ مِنَ الْحَرَكَةِ وَالِاهْتِزَازِ وَالتَّفَتُّحِ»"}'
    # نشاط — sense note
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُعبّر عن الطاقة الداخلية والتوثّب الذاتي وخفة النفس في الإقبال على العمل؛ يصف الحالة الآنية للنشاط في ذاتها بصرف النظر عن نتائجها.","mwe":false}'
    # فعالية — entry note
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فعل","maqayis":"«الْفَاءُ وَالْعَيْنُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِحْدَاثِ شَيْءٍ مِنْ عَمَلٍ وَغَيْرِهِ»"}'
    # فعالية — sense note
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُركز على البُعد الأثري للنشاط: نشاط مصحوب بالقدرة على إنتاج أثر ملموس (effectiveness + activity)، مُحمَّلة ببُعد تقييمي.","mwe":false}'
    # فاعلية (جديدة) — entry note
