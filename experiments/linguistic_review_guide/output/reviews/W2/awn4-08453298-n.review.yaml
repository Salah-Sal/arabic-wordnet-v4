      maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا التَّجَمُّعُ... وَالْجُمْلَةُ: جَمَاعَةُ كُلِّ شَيْءٍ.»"
    - lemma: "كِيَان"
      entry_id: "{auto}"
      root: "كون"
      maqayis_quote: "«الْكَافُ وَالْوَاوُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ثَبَاتِ الشَّيْءِ وَوُجُودِهِ.»"
    - lemma: "بِنْيَة"
      entry_id: "{auto}"
      root: "بنى"
      maqayis_quote: "«الْبَاءُ وَالنُّونُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ ضَمُّ الشَّيْءِ إِلَى الشَّيْءِ عَلَى سَبِيلِ التَّأْسِيسِ.»"
  per_sense:
    - lemma: "مَجْمُوعَة"
      sense_id: "{auto}"
      nuance: "تستخدم للتعبير العام عن تجمع العناصر."
