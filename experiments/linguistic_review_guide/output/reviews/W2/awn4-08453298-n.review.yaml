stage1_review:
  assessment:
    concerns:
      - "كلمة 'مجموعة' عامة جداً وقد لا تخصيص فيها لكون المجموعة 'نظاماً'."
      - "كلمة 'هيئة' تميل دلالتها الحديثة إلى المنظمات (bodies) أو المظهر الخارجي، بينما المقصود هنا الكتلة المترابطة من التفاصيل."
    observations: "المجموعة الترادفية تعبر عن مفهوم 'الكتلة' أو 'الجسم المعرفي/المنطقي' الذي يجمع تفاصيل متفرقة في نظام واحد. المصطلحات العربية المرشحة يجب أن تعكس هذا التلاحم العضوي أو النظامي."
  blind_candidates:
    - lemma: "جُمْلَة"
      generation_method: majaz
      justification: "ورد في مقاييس اللغة أن الجملة هي جماعة كل شيء، وتستخدم للتعبير عن 'المجمل' أو 'الكتلة' المترابطة من العناصر."
    - lemma: "كِيَان"
      generation_method: ishtiqaq
      justification: "يعبر عن الوجود المستقل ذي البنية المترابطة، ويناسب وصف 'النظام' المكون من تفاصيل."
    - lemma: "بِنْيَة"
      generation_method: ishtiqaq
      justification: "تشير إلى هيئة البناء وجماع العناصر المكونة للشيء، مما يتفق مع تعريف النظام المكون من تفاصيل."
    - lemma: "جِسْم"
      generation_method: majaz
      justification: "استعارة من الجسم العضوي للتعبير عن الكتلة المترابطة من الحقائق أو الأدلة (body of facts/evidence)."

stage2_evidence:
  per_lemma:
    - lemma: "مَجْمُوعَة"
      confirm:
        - text: "«لفظ عام يطلق على مجموع عناصر منسجمة تكون وحدة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
        - text: "«مجموعة من الأشياء المتشابهة في خصائصها، والمنظَّمة حسب أوجه التشابه بينها»"
          source: "معجم البيانات والذكاء الاصطناعي"
    - lemma: "هَيْئَة"
      confirm:
        - text: "«الهيئة أو الشكل العام»"
          source: "مسرد صناعة النسيج"
        - text: "«configuration; formation»"
          source: "المعجم الموحد لمصطلحات المياه"
      expands:
        - text: "«شاع استعمالها حديثًا بمعنى الجماعة... الهيئة: الجماعة من الناس يُعْهَد إليها بعمل خاص»"
          source: "معجم الصواب اللغوي"
          addition: "يشير إلى أن الاستعمال بمعنى 'body' (جماعة) هو استعمال مولد."
    - lemma: "جُمْلَة"
      confirm:
        - text: "«الجملة: جماعة كل شيء»"
          source: "مقاييس اللغة"
        - text: "«أخذ الشيء جملة... أي متجمعاً لا متفرقاً»"
          source: "المعجم الكبير"
    - lemma: "كِيَان"
      confirm:
        - text: "«حقيقة الشيء أو وجوده المستقل»"
          source: "معجم المصطلحات الطبية"
        - text: "«شيء مادي أو غير مادي يمكن التعرف عليه وتمييزه بوضوح»"
          source: "معجم البيانات والذكاء الاصطناعي"
    - lemma: "بِنْيَة"
      confirm:
        - text: "«جماع ما يتركب منه الجسم من حيث عناصره الجوهرية»"
          source: "معجم المصطلحات الطبية"
        - text: "«ما بني هيئة البناء»"
          source: "المعجم الوسيط"
    - lemma: "جِسْم"
      confirm:
        - text: "«تجمع الشيء كل شخص مدرك»"
          source: "مقاييس اللغة"
        - text: "«جسم الجريمة: مادّة تشكِّل الجريمة»"
          source: "تكملة المعاجم (دوزي)"
      expands:
        - text: "«جَسِيمُ الأَمْرِ signifies the bulk, or the greater, main, principal, or chief, part, of the affair»"
          source: "Lane's Lexicon"
          addition: "يدل على استخدام الجسم للتعبير عن معظم الشيء أو جوهره."

stage3_analysis:
  per_lemma:
    - lemma: "مَجْمُوعَة"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشائع للتعبير عن أي تجمع من العناصر، ويتفق مع التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوعَة"
    - lemma: "هَيْئَة"
      decision: confirmed
      decision_reason: "مقبولة بمعنى التشكيل (configuration) أو الهيكل المترابط للنظام، وإن كان يغلب عليها الاستعمال المؤسسي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَيْئَة"
    - lemma: "جُمْلَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي دقيق يعبر عن 'الكتلة' أو 'المجمل' المكون من أجزاء، ويناسب سياق 'body of facts'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "جُمْلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "كِيَان"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الوجود النظامي المستقل، وهو ترجمة دقيقة لـ 'entity/body' في السياقات المجردة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "كِيَان", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بِنْيَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن جماع العناصر الجوهرية المكونة للهيكل، وهي قريبة جداً من مفهوم النظام المكون من تفاصيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بِنْيَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "جِسْم"
      source: stage1
      decision: removed
      decision_reason: "رغم صحة الاستعارة، إلا أنها أقل شيوعاً في هذا السياق المجرد مقارنة بـ 'جملة' أو 'كيان' في العربية الحديثة، وتجنباً للاشتراك مع المعنى البدني."

stage4_content:
  definition:
    current: "مجموعة من التفاصيل تُعتبر كنظام"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي بعض الشيء. يفضل صياغته بأسلوب معجمي يوضح التلاحم بين الأجزاء لتكوين وحدة نظامية."
    authored:
      - type: terminological
        text: "جماعُ عناصرَ أو تفاصيلَ مترابطة تُشكّل في مجموعها وَحدةً أو نظاماً متكاملاً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "جماعُ عناصرَ أو تفاصيلَ مترابطة تُشكّل في مجموعها وَحدةً أو نظاماً متكاملاً."}
  examples:
    per_lemma:
      - lemma: "مَجْمُوعَة"
        examples:
          - text: "تُشكل هذه القواعد مَجْمُوعَةً متكاملة لضبط العمل الإداري."
            type: usage
      - lemma: "هَيْئَة"
        examples:
          - text: "ظهرت المعطيات في هَيْئَةِ نظامٍ مترابطٍ يسهل تحليله."
            type: usage
      - lemma: "جُمْلَة"
        examples:
          - text: "استند الباحث إلى جُمْلَةٍ من الأدلة التي تدعم نظريته."
            type: usage
      - lemma: "كِيَان"
        examples:
          - text: "يُعتبر المجتمع كِياناً من الأفراد والروابط المعقدة."
            type: usage
      - lemma: "بِنْيَة"
        examples:
          - text: "تمتاز بِنْيَةُ هذا النظام بالمرونة والقدرة على التكيف."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "قدم الشاهد جُمْلَةً من الحقائق التي شكلت جِسماً متماسكاً من الأدلة."}

stage5_enrichment:
  per_entry:
    - lemma: "مَجْمُوعَة"
      entry_id: "{auto}"
      root: "جمع"
      maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى تضامِّ الشَّيْءِ.»"
    - lemma: "هَيْئَة"
      entry_id: "{auto}"
      root: "هيأ"
      maqayis_quote: "«الْهَاءُ وَالْيَاءُ وَالْهَمْزَةُ أَصْلٌ صَحِيحٌ، وَهُوَ حَالُ الشَّيْءِ وَكَيْفِيَّتُهُ.»"
    - lemma: "جُمْلَة"
      entry_id: "{auto}"
