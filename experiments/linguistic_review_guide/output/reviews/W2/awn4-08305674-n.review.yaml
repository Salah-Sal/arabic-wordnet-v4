stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة الموجودة (ثقافة فرعية) تفتقر إلى التشكيل الكامل."
      - "المجموعة تفتقر إلى ترادفات بديلة شائعة في المصادر المعجمية الحديثة."
    observations: "المفهوم اجتماعي حديث (Sociological)، واللمة 'ثقافة فرعية' هي الترجمة المصطلحِيّة الأكثر استقراراً في المعاجم المتخصصة مثل (ArabTerm) و(المورد الحديث). المفهوم يعبر عن مجموعة داخلية ذات خصائص دلالية وسلوكية مستقلة."
  blind_candidates:
    - lemma: "ثَقَافَةٌ فَرْعِيَّةٌ"
      generation_method: tarkib
      justification: "ترجمة مباشرة ومصطلح مستقر في علم الاجتماع للتعبير عن (subculture)."
    - lemma: "جَمَاعَةٌ فَرْعِيَّةٌ"
      generation_method: tarkib
      justification: "استخدام 'جماعة' يركز على الكيان البشري الحامل للأنماط الثقافية المميزة، وهو وارد في المعاجم الثنائية."
    - lemma: "ثَقَافَةٌ جُزْئِيَّةٌ"
      generation_method: tarkib
      justification: "وصف الثقافة بأنها 'جزئية' نسبة إلى الكل الثقافي السائد."
    - lemma: "نِحْلَةٌ ثَقَافِيَّةٌ"
      generation_method: majaz
      justification: "استخدام لفظ 'نحلة' التراثي (بمعنى العقيدة أو المذهب) لوصف جماعة ذات معتقدات خاصة، مع تخصيصه بوصف 'ثقافية'."

stage2_evidence:
  per_lemma:
    - lemma: "ثقافة فرعية"
      confirm:
        - text: "أسلوب في الحياة يميز مجموعة ما عن الثقافة السائدة في المجتمع."
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "الجماعة الفرعيّة: جماعة ذات أنماط من السُّلوك تميِّزها عن الجماعات الأخرى ضمن المجتمع الأشمل."
          source: "المورد الحديث (2008)"
          addition: "يربط المصطلح مباشرة بمفهوم subculture الإنجليزي ويؤكد تعريف المجموعة."
    - lemma: "جَمَاعَةٌ فَرْعِيَّةٌ"
      confirm:
        - text: "الجماعة الفرعيّة: جماعة ذات أنماط من السُّلوك تميِّزها عن الجماعات الأخرى ضمن المجتمع الأشمل."
          source: "المورد الحديث (2008)"
    - lemma: "طائفة"
      expands:
        - text: "جماعة من الناس يجمعهم مذهب أو رأي يمتازون به."
          source: "المعجم الوسيط"
          addition: "يقترب دلالياً من مفهوم المجموعة ذات المعتقدات المميزة."

stage3_analysis:
  per_lemma:
    - lemma: "ثقافة فرعية"
      decision: confirmed
      decision_reason: "المصطلح الفني المعتمد في المعاجم الحديثة والمطابق تماماً للتعريف الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثَقَافَةٌ فَرْعِيَّةٌ"
    - lemma: "جَمَاعَةٌ فَرْعِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي مدعوم من معجم المورد الحديث، يركز على الجانب البشري (social group) المذكور في التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "جَمَاعَةٌ فَرْعِيَّةٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "ثَقَافَةٌ جُزْئِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "أقل شيوعاً من 'فرعية' ولم يرد كمدخل مستقل في المعاجم المستعلمة."

stage4_content:
  definition:
    current: "مجموعة اجتماعية داخل ثقافة وطنية لها أنماط مميزة من السلوك والمعتقدات"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه يميل للترجمة الحرفية؛ يفضل صياغته بأسلوب معجمي أكثر تماسكاً."
    authored:
      - type: terminological
        text: "مَجْمُوعَةٌ بَشَرِيَّةٌ تَمْتَلِكُ أَنْمَاطاً سُلُوكِيَّةً وَقِيَماً وَمُعْتَقَدَاتٍ تُمَيِّزُهَا عَنِ الثَّقَافَةِ الْأُمِّ أَوِ الثَّقَافَةِ السَّائِدَةِ فِي الْمُجْتَمَعِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَجْمُوعَةٌ بَشَرِيَّةٌ تَمْتَلِكُ أَنْمَاطاً سُلُوكِيَّةً وَقِيَماً وَمُعْتَقَدَاتٍ تُمَيِّزُهَا عَنِ الثَّقَافَةِ الْأُمِّ أَوِ الثَّقَافَةِ السَّائِدَةِ فِي الْمُجْتَمَعِ."

  examples:
    per_lemma:
      - lemma: "ثَقَافَةٌ فَرْعِيَّةٌ"
        examples:
          - text: "تُعَدُّ ثَقَافَةُ الْهِيبيز نَمُوذَجاً كَلَاسِيكِيّاً لِلثَّقَافَةِ الْفَرْعِيَّةِ الَّتِي نَشَأَتْ فِي السِّتِّينِيَّاتِ."
            type: usage
      - lemma: "جَمَاعَةٌ فَرْعِيَّةٌ"
        examples:
          - text: "يَدْرُسُ عِلْمُ الِاجْتِمَاعِ كَيْفِيَّةَ تَشَكُّلِ الْجَمَاعَاتِ الْفَرْعِيَّةِ دَاخِلَ الْمُدُنِ الْكُبْرَى."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعَدُّ ثَقَافَةُ الْهِيبيز نَمُوذَجاً كَلَاسِيكِيّاً لِلثَّقَافَةِ الْفَرْعِيَّةِ الَّتِي نَشَأَتْ فِي السِّتِّينِيَّاتِ."

stage5_enrichment:
  per_entry:
    - lemma: "ثَقَافَةٌ فَرْعِيَّةٌ"
      entry_id: "{auto}"
      roots:
        - word: "ثقافة"
          root: "ثقف"
          maqayis_quote: "«الثَّاءُ وَالْقَافُ وَالْفَاءُ كَلِمَةٌ وَاحِدَةٌ إِلَيْهَا يَرْجِعُ الْفُرُوعُ، وَهُوَ إِقَامَةُ دَرْءِ الشَّيْءِ. وَيُقَالُ ثَقَّفْتُ الْقَنَاةَ إِذَا أَقَمْتَ عِوَجَهَا.»"
        - word: "فرعية"
          root: "فرع"
          maqayis_quote: "«الْفَاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عُلُوٍّ وَارْتِفَاعٍ وَسُمُوٍّ وَسُبُوغٍ. مِنْ ذَلِكَ الْفَرْعُ، وَهُوَ أَعْلَى الشَّيْءِ.»"
