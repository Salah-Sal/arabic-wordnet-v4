# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (ترتيب، تنسيق، وضع) جيّدة لكنها تفتقر للتشكيل الكامل."
      - "المجموعة تغطي جانبين: الهيئة الناتجة (Arrangement) وعملية أو حالة الوضع (Placement)."
    observations: "التعريف يركز على 'الخاصية المكانية'، مما يجعل المصطلحات التي تصف النسق والنظام المكاني أكثر ملاءمة من المصطلحات الإجرائية الصرفة."
  blind_candidates:
    - lemma: "تَمَوْضُع"
      generation_method: ishtiqaq
      justification: "مصدر من الفعل تموضع، يعبر بدقة عن حالة اتخاذ موضع مكاني معين (Placement/Positioning)."
    - lemma: "رَصّ"
      generation_method: ishtiqaq
      justification: "يعبر عن الترتيب المتراصف والمنضم لبعضه البعض في حيز مكاني."
    - lemma: "نَضْد"
      generation_method: ishtiqaq
      justification: "يعبر عن وضع الأشياء بعضها فوق بعض أو بجانب بعض في اتساق."
    - lemma: "تَنْضِيد"
      generation_method: ishtiqaq
      justification: "العملية الناتجة عن نضد الأشياء في نسق منظم."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَرْتِيب"
      confirm:
        - text: "«التَّرتيبُ: جعل الْأَشْيَاء المتعددة بِحَيْثُ يُطلق عَلَيْهَا اسْم الْوَاحِد، وَيكون لبعضها نِسْبَة إِلَى بعض بالتقدم والتأخر.»"
          source: "مقاليد العلوم للسيوطي"
        - text: "«الترتيب: لغة، جعل كل شيء في مرتبة.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "تَنْسِيق"
      confirm:
        - text: "«التنسيق: من النسق بِسُكُون السِّين الْمُهْملَة التَّرْتِيب وإجراء الْكَلَام على سِيَاق وَاحِد ونظام وَاحِد.»"
          source: "دستور العلماء"
        - text: "«إحداث انسجام بين مكونات موضوع ما...»"
          source: "مسرد الإعلام (ArabTerm)"
    - lemma: "وَضْع"
      confirm:
        - text: "«وَضْع [مفرد]: ج أوضاع... هيئة الشَّيء التي يكون عليها 'وَضْع اقتصاديّ/ سياسيّ/ ثقافيّ- كان جالسًا في وَضْع غير مريح: هيئة الإنسان وهو جالس'»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "تَمَوْضُع"
      confirm:
        - text: "«تموضَعَ في يتموضع، تَمَوْضُعًا، فهو مُتموضِع...»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "تَنْضِيد"
      confirm:
        - text: "«نضد: رتب، نظم، نسق الحديقة أو الأشجار المغروسة...»"
          source: "تكملة المعاجم لدوزي"
        - text: "«تَنْضِيد: فنُّ التّنضيد: صفّ أحرف الطباعة وترتيبها.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "نَسَق"
      confirm:
        - text: "«النَّسَقُ: ما جاء من الكلام على نِظام واحد... ورأَيت نَسَقاً من الرجال والمتاع أَي بعضُها إلى جنب بعض.»"
          source: "لسان العرب"
    - lemma: "تَنْظِيم"
      confirm:
        - text: "«تَنْظِيم: عملية ترتيب المعطيات وتصنيفها وتخطيط كيفية معالجتها.»"
          source: "مسرد الإعلام (ArabTerm)"

