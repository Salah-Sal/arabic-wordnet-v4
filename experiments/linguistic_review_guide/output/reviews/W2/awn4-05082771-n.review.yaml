# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "الخاصية المكانية للطريقة التي يتم بها وضع شيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية للانجليزية، يفضل صياغته بأسلوب معجمي عربي يركز على الهيئة والنسق."
    authored:
      - type: terminological
        text: "الهيئةُ المَكانيّةُ أو النَّسَقُ الذي تُشكِّلُه مَجموعةٌ مِن الأشياءِ أو أجزاءُ الشيءِ الواحِدِ تَبَعاً لمَواضعِها في الحَيِّز."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَرْتِيب"
        examples:
          - text: "أَعْجَبَنِي تَرْتِيبُ الكُتُبِ فِي المَكْتَبَةِ تَبَعاً لِمَوْضُوعَاتِهَا."
            type: usage
      - lemma: "تَنْسِيق"
        examples:
          - text: "يُعَدُّ تَنْسِيقُ الزُّهُورِ فِي المَزْهَرِيَّةِ فَنّاً يَعْتَمِدُ عَلَى الذَّوْقِ."
            type: usage
      - lemma: "وَضْع"
        examples:
          - text: "يَخْتَلِفُ وَضْعُ قِطَعِ الأَثَاثِ بِنَاءً عَلَى مِسَاحَةِ الغُرْفَةِ."
            type: usage
      - lemma: "تَمَوْضُع"
        examples:
          - text: "يُؤَثِّرُ تَمَوْضُعُ المَصَابِيحِ عَلَى مَدَى انْتِشَارِ الضَّوْءِ فِي المَكَانِ."
            type: usage
      - lemma: "تَنْضِيد"
        examples:
          - text: "يَتَطَلَّبُ تَنْضِيدُ الحُرُوفِ فِي المَطْبَعَةِ دِقَّةً وَصَبْراً."
            type: usage
      - lemma: "نَسَق"
        examples:
          - text: "اصْطَفَّ الجُنُودُ فِي نَسَقٍ وَاحِدٍ أَمَامَ القَائِدِ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "الهيئةُ المَكانيّةُ أو النَّسَقُ الذي تُشكِّلُه مَجموعةٌ مِن الأشياءِ أو أجزاءُ الشيءِ الواحِدِ تَبَعاً لمَواضعِها في الحَيِّز."}

