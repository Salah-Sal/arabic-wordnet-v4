  definition:
    current: "لغة يتم التعبير عنها بإيماءات اليد المرئية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية، يستعمل صيغة «يتم التعبير» المستهجنة، ويقصر اللغة على إيماءات اليد مع أن لغة الإشارة تشمل أيضاً تعبيرات الوجه وحركات الجسد"
    authored:
      - type: terminological
        text: "نظامٌ لُغَوِيٌّ بَصَرِيٌّ حَرَكِيٌّ يُعَبَّرُ فيه عن المعاني بإشاراتِ اليدَيْنِ وتعبيراتِ الوجه وحركاتِ الجسد، يَستخدمُه الصُّمُّ وضِعافُ السَّمعِ عِوَضاً عن الكلام المنطوق"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "لُغَةٌ طبيعيَّةٌ كاملةُ البِنية النَّحْوِيَّةِ والصَّرْفِيَّة، تقوم على الإشارات اليدويَّة وتعبيرات الوجه والجسد بَدَلاً من الأصوات، يستعملها مجتمعُ الصُّمّ وضِعافِ السَّمع. تختلف لُغاتُ الإشارة من بلدٍ لآخر ولا تُطابق بالضرورة اللُّغاتِ المنطوقةَ في تلك البلدان"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نظامٌ لُغَوِيٌّ بَصَرِيٌّ حَرَكِيٌّ يُعَبَّرُ فيه عن المعاني بإشاراتِ اليدَيْنِ وتعبيراتِ الوجه وحركاتِ الجسد، يَستخدمُه الصُّمُّ وضِعافُ السَّمعِ عِوَضاً عن الكلام المنطوق"

  examples:
