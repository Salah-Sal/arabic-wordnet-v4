# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06888747-n (sign language)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «لغة الإشارة» بلا تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط — يحتمل وجود مرادفات أخرى مثبتة معجمياً"
      - "التعريف العربي ترجمة حرفية من الإنجليزية — يحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المفهوم راسخ في الاستعمال العربي المعاصر، والمركب «لغة الإشارة» هو الأكثر شيوعاً في المعاجم الحديثة والمصطلحية. المفهوم يقع تحت فرع «التواصل اللغوي» وهو نظام تواصلي بصري حركي متكامل يستخدمه الصمّ والبكم، يختلف عن مجرد الإيماء العفوي بكونه نظاماً قواعدياً كاملاً."
  blind_candidates:
    - lemma: "لُغَة الإِشَارَة"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين «لغة» بمعنى نظام التواصل و«إشارة» بمعنى الحركة الدالة — أكثر المصطلحات تداولاً في المعاجم العربية المعاصرة للدلالة على هذا المفهوم"
    - lemma: "لُغَة الصُّمّ"
      generation_method: tarkib
      justification: "مركب إضافي ينسب اللغة إلى مستخدميها الرئيسيين (الصُّمّ)، مستعمل في المورد الحديث وفي عبارات شائعة كـ«لغة الصم والبكم»"
    - lemma: "تَخَاطُب إِشَارِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من المصدر «تخاطب» (تفاعل من خطب) والنسبة «إشاري» — يصف العملية التواصلية بالإشارات، لكنه يركّز على الفعل لا على النظام اللغوي"
    - lemma: "إِشَارِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «إشارة» على وزن فِعَالِيَّة، يحوّل المفهوم إلى اسم مجرد يدل على نظام الإشارات — لكنّه مستعمل في اللسانيات بمعنى gestuality وهو أعمّ"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "لُغَة الإِشَارَة"
      confirm:
        - text: "«إشارات محددة تستخدم للاتصال بالأشخاص الذين يفقدون قدرتهم على السمع (الصم). وهذه اللغة تستخدم في الكثير من بلدان العالم، وإن كان يوجد بعض الاختلافات من بلد لآخر.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«لُغة الإشارة: «أ» لُغة الصُّمّ. «ب» لغة العاجزين عن التفاهم بلُغةٍ واحدة.»"
          source: "المورد الحديث (2008)"
        - text: "«لغة الإشارة؛ لغة الصُّمّ.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مجموع ما ينتجه الإنسان من علامات دالة تستعمل للتواصل وفق قواعد ومواضعات اجتماعية محددة.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm) — تحت «لغة الإشارات»"
          addition: "يوسّع المفهوم ليشمل كل علامة دالة لا إيماءات اليد فحسب"

    - lemma: "لُغَة الصُّمّ"
      confirm:
        - text: "«لُغة الإشارة: «أ» لُغة الصُّمّ. «ب» لغة العاجزين عن التفاهم بلُغةٍ واحدة.»"
          source: "المورد الحديث (2008)"
        - text: "«لُغَة الصُّمّ والبُكْم: لُغَة تعتمد على الحركات اليدويَّة للوصول للمعنى.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر — تحت مدخل «بكم»"

    - lemma: "تَخَاطُب إِشَارِيّ"
      evidence_status: "no_material_found"

    - lemma: "إِشَارِيَّة"
      contradicts:
        - text: "«حقل إشكالي خاص في التأمل السيميائي، للتعبير عن ظاهرة ما فوق لسانية ووظيفة مساعدة في إطار التواصل، وهي عملية لتأطير التعبير (رقص، فولكلور، باليه، ميم).»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "إشارية في اللسانيات تعني gestuality وهو مفهوم أعمّ يشمل الحركات المصاحبة للكلام لا نظاماً لغوياً مستقلاً"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "لُغَة الإِشَارَة"
      decision: confirmed
      decision_reason: "مصطلح مثبت في عدة معاجم مصطلحية عربية حديثة (مسرد التربية، المورد الحديث، مسرد الإعلام والتواصل) ومطابق تماماً لدلالة المجموعة. وهو الأكثر تداولاً واستعمالاً في السياقات التربوية والإعلامية والقانونية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح المعياري الشائع الذي يركّز على طبيعة النظام التواصلي (الإشارة) بصرف النظر عن المستخدمين"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُغَة الإِشَارَة"

    - lemma: "لُغَة الصُّمّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مثبت في المورد الحديث (2008) وفي معجم اللغة العربية المعاصرة بصيغة «لغة الصم والبكم». يُستعمل كمرادف شائع في السياقات العامة، وإن كان أقلّ دقة علمياً لأنه ينسب اللغة إلى فئة المستخدمين لا إلى طبيعة النظام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على المستخدمين (الصمّ) لا على آلية التواصل، وقد يُعدّ أقلّ حياداً في السياق الأكاديمي المعاصر الذي يفضّل «لغة الإشارة»"
      actions:
        - command: create_entry
          params: {lemma: "لُغَة الصُّمّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَخَاطُب إِشَارِيّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي دليل معجمي يثبت هذا المركب كمصطلح مسكوك. وهو عبارة وصفية حرة تصف فعل التخاطب بالإشارات لا نظاماً لغوياً قائماً بذاته."

    - lemma: "إِشَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مسجّل في المعجم الموحد لمصطلحات اللسانيات (2002) بمعنى gestuality وهو مفهوم مختلف يشير إلى ظاهرة فوق لسانية عامة لا إلى نظام لغة الإشارة. استخدامه هنا يُحدث اشتراكاً لفظياً مضرّاً."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
