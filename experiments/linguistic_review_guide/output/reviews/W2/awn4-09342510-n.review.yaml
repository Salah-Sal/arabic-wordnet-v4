step0_evidence:
  per_lemma:
    - lemma: "برزخ"
      confirm:
        - text: "«(في علم الجغرافية): قطعة أرض ضيقة، محصورة بين بحرين، موصلة بين أرضين»"
          source: "المعجم الوسيط"
        - text: "«(في الجغرافيا: isthmus): شريطٌ من اليابس يفصل بين مائَيْن»"
          source: "المعجم الكبير"
        - text: "«(جغ) قطعةُ أرضٍ محصورة بين بحرين موصِّلة بين أرضين \"برزخ قناة السويس\"»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«isthmus — Geography and History»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
      expands:
        - text: "«الحاجز بين شيئين ما بين الموت والبعث»"
          source: "المعجم الوسيط"
          addition: "توسع دلالي غيبي (أخروي)"
        - text: "«(في علم الطب): البرزخ الدرقي جزء منقبض من الغدة الدرقية... ويصل بين الفصين الجانبيين»"
          source: "المعجم الوسيط"
          addition: "توسع في علم التشريح لوصف الوصلات الضيقة"

step05_lemma_generation:
