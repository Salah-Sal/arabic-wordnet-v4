      justification: "استخدام المجاز (اللسان) لوصف الامتداد الضيق لليابسة، وإن كان يغلب عليه وصف الرؤوس الأرضية."
    - lemma: "مضيق بري"
      justification: "توليد بالتركيب الوصفي للمقابلة مع المضيق المائي."

