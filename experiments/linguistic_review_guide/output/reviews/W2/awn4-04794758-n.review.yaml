      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي. يُحيل جذرُ (عسف) أصلاً إلى السير في غير الطريق المطروق والجور والتعدّي، وقد تطوّر في الاستخدام الحديث نحو (التعسّف) بمعنى الاستبداد والتحكّم؛ فلا يُعبّر عن اللاطبيعية الوصفية المحايدة بل يحمل دلالةً أخلاقية سلبية تتجاوز مراد المجموعة.
      evidence_assessment:
