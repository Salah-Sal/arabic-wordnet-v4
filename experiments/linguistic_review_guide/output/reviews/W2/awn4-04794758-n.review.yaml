# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّتا تَصَنُّع وتَكَلُّف تُعبّران عن الوجه السلوكي الإرادي للاطبيعية (الافتعال والتظاهر)، ولا تُغطّيان المعنى الأشمل للمصطلح الإنجليزي unnaturalness الذي يشمل الظواهر الفيزيائية والعلمية غير الطبيعية"
      - "مُخَالَفَة الطَّبِيعَة تركيب إضافي وصفي لا يرقى دائماً إلى مستوى المصطلح المسكوك إذ يمكن استبدال (مخالفة) بـ(مناقضة) دون تغيير المعنى"
      - "التعريف الحالي (صفة كون الشيء غير طبيعي) أسلوبه ركيك وهو ترجمة شبه حرفية من الإنجليزية لا تتوافق مع أسلوب المعجم الوسيط"
      - "المجموعة تفتقر إلى مصطلح مفرد يُعبّر عن اللاطبيعية بمعناها الفلسفي والعلمي المجرّد المحايد"
    observations: >
      المجموعة الترادفية تُعبّر عن مفهوم اللاطبيعية عبر ثلاثة أوجه: وجهان سلوكيان (تَصَنُّع وتَكَلُّف) يُشيران إلى الافتعال والتكلّف في السمت والمظهر والسلوك الإنساني، ووجه شامل (مُخَالَفَة الطَّبِيعَة) يُعبّر عن المفهوم العام. يدلّ هذا التوزيع على أنّ العربية تميل إلى توصيف اللاطبيعية من منظور الفعل والإرادة لا من منظور الصفة المجرّدة المحايدة. التعريف الإنجليزي الأشمل (the quality of being unnatural or not based on natural principles) يستدعي توسيع التغطية لتشمل السياق العلمي والفلسفي، وهو ما توفّره لمّة مُخَالَفَة الطَّبِيعَة نسبياً.

  blind_candidates:
    - lemma: "اِفْتِعَالِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من (افتعل) على وزن افتعال + ياء النسبة + تاء التأنيث؛ وافتعل يدل على صنع الشيء على غير صورته الطبيعية وادّعاء ما ليس في المرء، فاِفْتِعَالِيَّة تُعبّر عن صفة الشيء الذي جاء مفتعَلاً منافياً للطبيعة"

    - lemma: "تَعَسُّفِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من (تَعَسَّفَ) وهو السير في غير الطريق المطروق ومخالفة الوجه الطبيعي؛ صِيغَة المصدر الصناعي تُحوّله إلى صفة مجرّدة مناسبة لوصف اللاطبيعية في السياق الفلسفي"

    - lemma: "شُذُوذ"
      generation_method: majaz
      justification: "إحياء الدلالة الجذرية لشذَّ (الانفراد والمفارقة عن الأصل) وتوسيعها بالمجاز لتشمل خروج الشيء عن مقتضى الطبيعة وسُنَنِها؛ المجاز هنا انتقال من (الانفراد عن الجماعة) إلى (الانفراد عن الفطرة الطبيعية)"

    - lemma: "مُنَافَرَةُ الطَّبِيعَة"
      generation_method: tarkib
      justification: "تركيب إضافي من (مُنَافَرَة) بمعنى التنافر والتنافي + (الطبيعة)؛ يُعبّر عن صفة ما ينافر الطبيعةَ ويتعارض معها، وهو أدق من (مخالفة) في الدلالة على عدم الانسجام الجوهري مع المبادئ الطبيعية"


