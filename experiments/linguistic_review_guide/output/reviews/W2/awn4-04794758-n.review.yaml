# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تَصَنُّع"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة توثيقاً جيداً في المعاجم الكلاسيكية والحديثة بمعنى الافتعال ومجافاة الطبيعة في السمت والسلوك. مقاييس اللغة يُثبّت أصل الكلمة في الصنع والتعمّل. المعجم الموحد للسانيات يُقرنها صراحةً بالابتعاد عن الطبيعي. التشكيل كامل في synset_info. الوزن الصرفي (تَفَعُّل) وزن المصدر الطبيعي لأفعال المطاوعة والتكلّف وهو مناسب تماماً للدلالة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز تحديداً على البُعد الاجتماعي السلوكي للاطبيعية: التظاهر بما ليس في المرء والتزيّن بأكثر مما عنده؛ يختصّ بالفعل الإنساني المتعمَّد ويحمل غالباً دلالةَ الزيف والنفاق. يختلف عن تَكَلُّف في أنّ التصنُّع يُركّز على الظاهر والمظهر، بينما التكلُّف يُركّز على الجهد والمشقة.

    - lemma: "تَكَلُّف"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في المناوي ومقاييس اللغة والمعجم الوسيط. المناوي يُعرّفه تعريفاً دقيقاً يُميّز المحمود منه والمذموم. مقاييس اللغة يُثبّت الجذر (كلف) بمعنى الإيلاع والتعلّق بالشيء والمشقة في تحمّله. الوزن الصرفي (تَفَعُّل) مناسب لدلالة التكلّف والمطاوعة. التشكيل كامل في synset_info.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز الجهدَ والمشقةَ المصاحبَين لمخالفة الطبيعة: يشير إلى تحمّل ما يُنافي الطبع الفطري بلا ضرورة حقيقية، وادّعاء ما يُثقِل على النفس. يختلف عن تَصَنُّع في أنّ التكلُّف يُركّز على الجانب الداخلي (الجهد والمشقة) لا على المظهر الخارجي؛ وقد يكون غير مقصود بالضرورة (التكلُّف المحمود في اكتساب الفضائل).

    - lemma: "مُخَالَفَة الطَّبِيعَة"
      decision: confirmed
      decision_reason: >
        التعبير المركّب يُغطّي المعنى الأشمل لمفهوم اللاطبيعية الذي يفتقر إليه كلٌّ من تَصَنُّع وتَكَلُّف؛ فهو يصلح للسياقات العلمية والفلسفية (خروج ظاهرة أو عملية عن المبادئ الطبيعية) فضلاً عن السلوك البشري. اختبار التثبيت: بينما يمكن إبدال (مخالفة) بـ(مناقضة)، فإنّ (مخالفة الطبيعة) هي الصيغة الأكثر شيوعاً واستعمالاً في الخطاب الديني والفلسفي العربي لوصف ما يخرج عن النواميس الطبيعية، وهو ما يُعطيها درجة كافية من التثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تُعبّر عن المفهوم بمعناه الأشمل غير المقيَّد بالسلوك البشري ولا بدلالة الجهد أو المظهر؛ تصلح للسياق العلمي (مخالفة قوانين الطبيعة الكيميائية أو البيولوجية) والفلسفي والديني. تُكمّل تَصَنُّع وتَكَلُّف اللذَيْن يختصّان بالإنسان وفعله الإرادي.

    - lemma: "اِفْتِعَالِيَّة"
