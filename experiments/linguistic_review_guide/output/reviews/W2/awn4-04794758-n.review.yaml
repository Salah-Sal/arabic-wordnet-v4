      decision: removed
      decision_reason: >
        رغم وجود شواهد تدعم الدلالة على مخالفة القياس والنواميس الطبيعية، فإنّ الاستخدام المعاصر الواسع للمصطلح في المجالات الطبية والنفسية والاجتماعية قد صرفه نحو الانحراف الجنسي (الشذوذ الجنسي)، مما يُفضي إلى تلوّث دلالي حادّ يجعل إدراجه في هذه المجموعة مُوهِماً ومُشكِلاً. علاوةً على ذلك فإنّ شُذُوذ يُعبّر عن الانحراف عن المعيار لا عن المبدأ الطبيعي، وهو أضيق من مراد المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُنَافَرَةُ الطَّبِيعَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي. اختبار التثبيت يُثبت عدم السكّ: يمكن إبدال (مُنَافَرَة) بـ(مُخَالَفَة أو مُنَاقَضَة أو مُجَافَاة) والتعبير يبقى صالحاً كوصف — دليل على أنّه عبارة وصفية حرة لا مصطلح مسكوك. ويفتقر إلى وجود في أيّ مصدر معجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


