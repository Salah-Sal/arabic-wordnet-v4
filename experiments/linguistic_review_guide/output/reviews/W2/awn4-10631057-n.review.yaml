# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10631057-n (sleepyhead)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المُبهَم الأعلى (hypernym) هو «عامل/فاعل = شخص يعمل ويُنجز الأمور»، وهو لا يناسب دلالياً مفهوم «شخص يشعر بالنعاس»؛ الأنسب أن يكون المُبهَم الأعلى هو «شخص/إنسان»"
      - "التعريف العربي الحالي «شخص يشعر بالنعاس» أقرب إلى الشرح الحُرّ منه إلى التعريف المعجمي المُحكَم"
    observations: "المفهوم يدلّ على شخص يغلبه النوم أو النعاس كصفة بارزة. في العربية أوزان مبالغة متعددة تُعبّر عن هذا المعنى: فَعُول (نَؤُوم، نَعُوس)، فَعْلان (نَعْسان، وَسْنان)، فَعَّال (نَوَّام). المفهوم أصيل في الثقافة العربية وله تعبيرات تراثية غنية."

  blind_candidates:
    - lemma: "نَعُوس"
      generation_method: ishtiqaq
      justification: "من الجذر «نعس» على وزن فَعُول الدالّ على المبالغة في الصفة، أي كثير النعاس. الوزن مناسب لوصف الشخص الذي يغلبه النعاس كطبع."
    - lemma: "وَسْنَان"
      generation_method: ishtiqaq
      justification: "من الجذر «وسن» على وزن فَعْلان الدالّ على الحالة الطارئة، أي من أصابه الوَسَن (النعاس). مذكور في مقاييس اللغة: «رجل وَسْنان»."
    - lemma: "نَوَّام"
      generation_method: ishtiqaq
      justification: "من الجذر «نوم» على وزن فَعَّال الدالّ على كثرة الفعل، أي كثير النوم. اشتقاق قياسي."
    - lemma: "رَقُود"
      generation_method: ishtiqaq
      justification: "من الجذر «رقد» على وزن فَعُول الدالّ على المبالغة، أي كثير الرقاد. وارد في المعجم الكبير."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "نَؤُوم"
      confirm:
        - text: "«الكثيرُ النَّوْم. يقال: رجلٌ نَؤُومٌ, وامرأةٌ نَؤُومٌ»"
          source: "المعجم الوسيط"
        - text: "«(النؤوم) الكثير النوم يقال رجل نؤوم وامرأة نؤوم»"
          source: "المعجم الوسيط (حرماني)"
        - text: "«وهو نَؤُومٌ وَنُوَمَةٌ: كثيرُ النوم»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "نَعْسَان"
      confirm:
        - text: "«(1) نعسان (2) مُنَعِّس (3) ناشئ عن النُّعاس»"
          source: "المورد الحديث — ترجمة drowsy"
        - text: "«(1) «أ» نَعْسان. «ب» ناعس»"
          source: "المورد الحديث — ترجمة sleepy"
        - text: "«نَعْسان ؛ نَاعِس»"
          source: "المعجم الطبي الموحد — ترجمة drowsy"

    - lemma: "نَعُوس"
      confirm:
        - text: "«مبالغة ناعِس امرأة نَعُوسٌ: نَعَّاسَة»"
          source: "المعجم الوسيط"
        - text: "«(النعوس) مبالغة ناعس ويقال امرأة نعوس نعاسة»"
          source: "المعجم الوسيط (حرماني)"
        - text: "«النَّعُوس: الكثير النُّعاس»"
          source: "المورد الحديث — ترجمة sleepyhead"
        - text: "«من (ن ع س) الكثير النعاس. يستخدم للإناث والذكور»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«ناقة نَعُوسٌ، توصف بالسماحة بالدَّرّ، لأنها إذا دَرَّت نعست»"
          source: "مقاييس اللغة لابن فارس"
          addition: "لوزن نَعُوس استعمال آخر في وصف النوق، لكنه مجازي لا يتعارض مع المعنى الأصلي"

    - lemma: "وَسْنَان"
      confirm:
        - text: "«الوَسَنُ: النُّعاسُ، وكذا السِّنَةُ. ورجلٌ وَسْنانُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«وَسَن، سُبات»"
          source: "المعجم الموحد لمصطلحات الطب البيطري — ترجمة lethargy"
          addition: "الوَسَن يتراوح بين النعاس والسُّبات، فقد يحمل دلالة أقوى من مجرد النعاس"

    - lemma: "نَوَّام"
      evidence_status: "no_material_found"

    - lemma: "رَقُود"
      confirm:
        - text: "«كَثِيرُ الرُّقَادِ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«امْرأَةٌ رَقُودُ الضُّحَى: كِنايَةً عن تَنَعُّمِها (من المجاز)»"
          source: "المعجم الكبير"
          conflict: "الاستعمال الغالب كناية عن التنعّم والترفّه لا عن النعاس ذاته"
        - text: "«يقال: امرأة رقودُ الضُّحى: منعَّمة»"
          source: "المعجم الوسيط"
          conflict: "التعريف الوسيطي يؤكد أنّ الدلالة انزاحت إلى التنعّم"


# ── المرحلة ٣: التحليل اللغوي ────────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "نَؤُوم"
      decision: confirmed
      decision_reason: "لمّة فصيحة مُوثَّقة في المعجم الوسيط ومقاييس اللغة بمعنى «الكثير النوم»، على وزن فَعُول الدالّ على المبالغة. تتطابق مع مفهوم المجموعة تطابقاً تاماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على كثرة النوم كصفة ملازمة وطبع ثابت، مشتقّ من «نوم» (لا من «نعس»)، فيشمل النوم العميق لا مجرّد النعاس."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَؤُوم"

    - lemma: "نَعْسَان"
      decision: confirmed
      decision_reason: "صفة مشبّهة على وزن فَعْلان تدلّ على الحالة الطارئة، موثّقة في المورد الحديث والمعجم الطبي الموحّد ترجمةً لـ drowsy/sleepy. شائعة الاستعمال في الفصحى والعامّية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على حالة النعاس الآنيّة المؤقّتة (وزن فَعْلان = امتلاء بالصفة وقتياً)، بخلاف «نَؤُوم» الذي يدلّ على طبع دائم."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَعْسَان"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَعُوس"
      source: stage1
      decision: confirmed
      decision_reason: "مبالغة من ناعس على وزن فَعُول، مُوثّقة في المعجم الوسيط بمعنى «الكثير النعاس»، وفي المورد الحديث ترجمةً مباشرة لـ sleepyhead. تسدّ فجوة دلالية بين نَؤُوم (كثير النوم) ونَعْسان (حالة آنية)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على من يكثر نعاسه كصفة غالبة، مشتقّ من «نعس» فيختصّ بالنعاس (أخفّ من النوم)، وهو أقرب ترجمة عربية لـ sleepyhead."
      actions:
        - command: create_entry
          params: {lemma: "نَعُوس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "وَسْنَان"
      source: stage1
      decision: removed
      decision_reason: "صفة تدلّ على حالة الوَسَن (النعاس الثقيل القريب من السُّبات)، وهي أقرب إلى الوصف الحالي منها إلى اسم لنوع من الأشخاص. كما أنّ الوَسَن قد يتضمّن دلالة السُّبات الأعمق من مجرّد النعاس."

    - lemma: "نَوَّام"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثَر على توثيق معجمي لهذه الصيغة. الموجود هو «نُوَام» (فُعَال) بمعنى مرض النوم، و«نُوَمَة» (فُعَلَة) بمعنى كثير النوم والخامل. صيغة فَعَّال غير مسموعة هنا."

    - lemma: "رَقُود"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «كثير الرقاد» في المعجم الكبير، فإنّ الاستعمال الغالب — كما في الوسيط والكبير — كناية عن التنعّم والترفّه (امرأة رقود الضحى = منعَّمة)، لا عن النعاس. الدلالة المجازية الغالبة تُبعده عن مفهوم المجموعة."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يشعر بالنعاس"
    assessment:
      decision: revise
      reason: "التعريف الحالي شرح حُرّ مبسّط لا يرقى إلى مستوى التعريف المعجمي؛ يفتقر إلى الجنس القريب والفصل النوعي، ولا يميّز بين الحالة الآنية والصفة الملازمة."
    authored:
      - type: terminological
        text: "مَنْ يَغلِبُه النُّعاسُ ويَكثُرُ نَومُه حتَّى يُعرَفَ بذلك"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كَثيرُ النَّوْمِ والنُّعاسِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مَنْ يَغلِبُه النُّعاسُ ويَكثُرُ نَومُه حتَّى يُعرَفَ بذلك"}

  examples:
    per_lemma:
      - lemma: "نَؤُوم"
        examples:
          - text: "لا يَصلُحُ هذا العملُ لرَجُلٍ نَؤُومٍ لا يَستيقِظُ إلّا بعدَ الضُّحى."
            type: usage
      - lemma: "نَعْسَان"
        examples:
          - text: "جاءَ الطِّفلُ نَعْسانَ يَفرُكُ عَينَيهِ بعدَ يومٍ طويلٍ من اللَّعِب."
            type: usage
      - lemma: "نَعُوس"
        examples:
          - text: "فلانٌ نَعُوسٌ لا تَراهُ في مَجلِسٍ إلّا وقد خَفَقَ رأسُه."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "لا يَصلُحُ هذا العملُ لرَجُلٍ نَؤُومٍ لا يَستيقِظُ إلّا بعدَ الضُّحى."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "جاءَ الطِّفلُ نَعْسانَ يَفرُكُ عَينَيهِ بعدَ يومٍ طويلٍ من اللَّعِب."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "فلانٌ نَعُوسٌ لا تَراهُ في مَجلِسٍ إلّا وقد خَفَقَ رأسُه."}


