stage1_review:
  assessment:
    concerns:
      - "يوجد لمّة واحدة فقط في المجموعة الترادفية."
      - "اللمّة الموجودة غير مشكولة بالكامل."
    observations: "المصطلح الإنجليزي 'receivership' يشير إلى حالة قانونية (الحراسة القضائية) أو مركز الحارس القضائي. المصطلح العربي المقابل الأكثر دقة وشيوعاً هو 'حراسة قضائية'، وقد تُستخدم كلمة 'حراسة' مجردة في السياق القانوني للدلالة على المعنى نفسه."
  blind_candidates:
    - lemma: "حِرَاسَةٌ قَضَائِيَّةٌ"
      generation_method: tarkib
      justification: "الترجمة الاصطلاحية القياسية للمفهوم في المعاجم القانونية والحديثة."
    - lemma: "إِدَارَةٌ قَضَائِيَّةٌ"
      generation_method: tarkib
      justification: "وصف للحالة التي يتولى فيها القضاء إدارة أموال أو أعيان متنازع عليها."
    - lemma: "تَصْفِيَةٌ قَضَائِيَّةٌ"
      generation_method: tarkib
      justification: "حالة قريبة من الحراسة القضائية لكنها تتعلق بإنهاء وضع المقاولة أو الشركة."
    - lemma: "حِرَاسَةٌ"
      generation_method: ishtiqaq
      justification: "المصدر الأصلي للفعل حرس، ويُستخدم قانوناً للدلالة على وضع المال في يد أمين."

stage2_evidence:
  per_lemma:
    - lemma: "حِرَاسَةٌ قَضَائِيَّةٌ"
      confirm:
        - text: "séquestre judiciaire : حراسة تتقرر بحكم القاضي , في حال الاستعجال بناءً على طلب صاحب المصلحة"
          source: "المعجم الكبير"
        - text: "«أ» مركز الحارس القضائيّ أو وظيفته. «ب» كونُ الممتلكات خاضعةً لإشراف حارس قضائيّ to put a corporation into receivership ."
          source: "المورد الحديث"
    - lemma: "حِرَاسَةٌ"
      confirm:
        - text: "(في القانون) séquestre : وضع مال يقوم في شانه نزاع , أو يكون الحق فيه غير ثابت , ويتهدّده خطر , في يد أمين ( حارس ) يقوم بحفظه وإدارته"
          source: "المعجم الكبير"
        - text: "يُقَال وضع فلَانا تَحت الحراسة مَنعه من التَّصَرُّف فِي مَاله (محدثة)"
          source: "المعجم الوسيط"
    - lemma: "إِدَارَةٌ قَضَائِيَّةٌ"
      evidence_status: "no_material_found"
    - lemma: "تَصْفِيَةٌ قَضَائِيَّةٌ"
      expands:
        - text: "تفتتح متى تبين أن وضعية المقاولة مختلة بشكل لا رجعة فيه... ويؤدي الحكم بها إلى تخلي المدين بقوة القانون عن تسيير أمواله والتصرف فيها."
          source: "المعجم الموحد لمصطلحات القانون"
          addition: "تشير إلى مرحلة التصفية النهائية للمقاولة، وهي دلالة أضيق من مفهوم 'receivership' العام."

stage3_analysis:
  per_lemma:
    - lemma: "حراسة قضائية"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والدقيق للمفهوم في المعجم القانوني المعاصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِرَاسَةٌ قَضَائِيَّةٌ"
    - lemma: "حِرَاسَةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "وردت في المعجمين الوسيط والكبير ككلمة مستقلة تدل قانوناً على المفهوم (سيكوستر)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "حِرَاسَةٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "حالة الممتلكات التي تكون في يد حارس قضائي"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لكنه يفتقر للوظيفة القانونية (الحفظ والإدارة ومنع التصرف)."
    authored:
      - type: terminological
        text: "نظامٌ قانونيٌّ يقضي بوضع أموالٍ أو ممتلكاتٍ مُتنازعٍ عليها في عهدة شخصٍ محايد يتولّى حفظها وإدارتها بموجب حُكمٍ قضائيّ لضمان حقوق ذوي الشأن."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نظامٌ قانونيٌّ يقضي بوضع أموالٍ أو ممتلكاتٍ مُتنازعٍ عليها في عهدة شخصٍ محايد يتولّى حفظها وإدارتها بموجب حُكمٍ قضائيّ لضمان حقوق ذوي الشأن."
  examples:
    per_lemma:
      - lemma: "حِرَاسَةٌ قَضَائِيَّةٌ"
        examples:
          - text: "قضت المحكمة بوضع الشركة تحت الحراسة القضائية ريثما ينتهي النزاع بين الورثة."
            type: usage
      - lemma: "حِرَاسَةٌ"
        examples:
          - text: "تخضع ممتلكات المدين للحراسة لضمان عدم تهريب الأصول قبل سداد الديون."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "استمرت الشركة تحت الحراسة القضائية لمدة عامين قبل أن يُبَتَّ في أمر تصفيتها."

