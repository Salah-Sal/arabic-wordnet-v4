      expands:
        - text: "«(لَذَعَ) اللامُ والذالُ والعينُ يدلُّ على أصلٍ واحدٍ وهو الإحراقُ والحرارة. من ذلك اللَّذْع: لذع النار، وهو إحراقُها الشيءَ، ويُستعار ذلك فيقال: لذَعتُه بلساني إذا آذيتُه أذىً يسيراً. ومنه قولهم: جاء فلانٌ يتلذَّع أي يتلفَّت يميناً وشمالاً كأن شيئاً يُقلقه ويُحرقه. ومن الباب اللَّوذَعِيُّ: الظَّريف، أي كأنه من حركته وكَيسِه يُلذَع»"
          source: "مقاييس اللغة لابن فارس"
          addition: "اللَّوذَعِيُّ (الظريف الحاد الذهن) يُثبت مسار الاستعارة من الوخز الحسّي إلى الحِدَّة الذهنية، وهو سلفٌ تراثي لـ'لذاعة' المجازية. غير أن لذاعة كمصدر مستقل للصفة غير موثَّقة."
