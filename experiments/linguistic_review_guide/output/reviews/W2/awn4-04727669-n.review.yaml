# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'إثارة محببة' تركيبٌ وصفيٌّ حرٌّ لا يرقى إلى مستوى المصطلح المسكوك: يصحّ إبدال 'محببة' بـ'لطيفة' أو 'مستحسنة' أو 'مقبولة' مع بقاء التعبير وصفياً صالحاً، مما يُخفق في اختبار التثبيت المعجمي."
      - "لا يوجد في المعاجم العربية مصطلح مفرد متداول يعادل دلالة 'piquancy' (الإثارة الذهنية المستحسنة) بصورة دقيقة، مما يُشير إلى فجوة معجمية حقيقية."
      - "اللمّة 'جاذبية' تحمل قيمةً دلاليةً مسيطرة في الفيزياء (الجاذبية الأرضية) وفي المعاجم التقنية، مما يُفضي إلى اشتراك لفظي عند استخدامها للدلالة على الجاذبية الشخصية المُحفِّزة."
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية يفتقر إلى أسلوب المعجم الوسيط وصياغة الجنس القريب والفصل النوعي."
    observations: >
      تنتمي هذه المجموعة إلى حقل الدلالة المجردة (الصفات النوعية)، وتصف خاصيَّةً إيجابيَّةً
      من خواصِّ المُثيرات الذهنية والحسِّية الممتعة. الجذر الدلالي الأنسب يتراوح بين
      مجال الجذب والاستمالة (جذب) ومجال الحِدَّة المُبهِجة (لذع، حفز). المشكلة الجوهرية
      أن العربية لا تملك مصطلحاً مفرداً متداولاً يعادل 'piquancy' بدقَّة — وهو المزيج
      الخاص من الحِدَّة والمتعة الذهنية — فيُعبَّر عنه عادةً بعبارات وصفية. الاشتقاق
      على وزن المصدر الصناعي (-ية) من جذور التحفيز أو التشويق هو المسار الأجدى.

  blind_candidates:
    - lemma: "لَذَاعَة"
      generation_method: majaz
      justification: >
        من لَذَعَ (إحراق النار وحِدَّتها)؛ إزاحةٌ دلاليَّةٌ من الحرارة الحسِّية إلى الحِدَّة
        الذهنية الممتعة، على غرار اشتقاق 'piquant' الفرنسي من piquer (لسع/وخز).
        وقد أرسى التراث استعارة ذهنية منه في 'اللَّوذَعِيّ' (الظريف الحاد الذهن)،
        مما يُثبت وجود هذا المسار المجازي في العربية. يُحيي لفظاً تراثياً ميِّتاً
        بدلالةٍ دقيقة تناسب المفهوم.
    - lemma: "تَشْوِيقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدرٌ صناعيٌّ من 'تشويق' (باب II من ش-و-ق) على وزن تَفْعِيلِيَّة؛ أي صفةُ
        ما يشوِّق ويثير نزاع النفس إلى الشيء. شَوُقَ في مقاييس اللغة: 'نزاع النفس
        إلى الشيء ولا يكون إلا عن علق حُبٍّ' — يناسب البُعد الاستمالي في المفهوم.
    - lemma: "تَحْفِيزِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدرٌ صناعيٌّ من 'تحفيز' (باب II من ح-ف-ز) على وزن تَفْعِيلِيَّة؛ أي صفةُ
        ما يحفِّز ويحثُّ الذهن على الانتباه والتفاعل. حَفَزَ في مقاييس اللغة:
        'الحثّ وما قرب منه'. يعكس دلالة 'stimulating' في التعريف الإنجليزي.
    - lemma: "نَكْهَة"
      generation_method: majaz
      justification: >
        النكهة أصلاً رائحة الفم، ثم استُعيرت للطعم والمذاق. الإزاحة الدلالية نحو
        'الخاصية التي تمنح الشيء تميُّزاً محبَّباً' موثَّقة في معجم المعلوماتية.
        يُحيي استخدامها التراثي المجازي المعروف في التداول الأدبي ('لكلامه نكهة خاصة').


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "إثارة محببة"
      contradicts:
        - text: "«(الأثارة) العلامة وبقية الشيء وفي التنزيل العزيز: {ائْتُونِي بِكِتَابٍ مِن قَبْلِ هَٰذَا أَوْ أَثَارَةٍ مِّنْ عِلْمٍ إِن كُنتُمْ صَادِقِينَ}»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "الأثارة في المعجمين الوسيط والكبير تعني 'الأثر والبقية' لا الإثارة بمعنى التحفيز الذهني؛ مما يُشير إلى خلطٍ بين جذرَيْن مختلفَيْن."
        - text: "«(الأثارة) الْعَلامَة وَبَقِيَّة الشَّيْء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          conflict: "تأكيد على أن الأثارة = الأثر والبقية، لا الإثارة التحفيزية."
      expands:
        - text: "«الإثارة: إظهار الشيء من الثرى كأنها تخرج الثرى من محتوى اليبس ذكره الحرالي»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622)"
          addition: "الاستخدام الكلاسيكي يدل على الإخراج والإظهار. أما 'إثارة' (من أثار يُثير) بمعنى التحفيز فمن جذر مختلف (ث-و-ر) لا (أ-ث-ر)؛ هذا اللبس يُضعف المركب."
        - text: "«إثارة: stimulation — المنبه أو الحافز، وهو كل ما يثير حواسنا الخمس»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "إثارة منفردةً معترَف بها كمصطلح تربوي وبيولوجي للتحفيز، غير أن المركّب 'إثارة محببة' غير موثَّق في أي مصدر."

    - lemma: "جاذبية"
      confirm:
        - text: "«الجاذبية: الحالة التي يَجذبُ بها صاحبها غيره. يقال: فلان له جاذبية: يَستَميلُ غيرَه إليه. (مو)»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الجاذبية: الحالةُ التى يَجْذِبُ بها صَاحِبُها غَيْرَه»"
