stage1_review:
  assessment:
    concerns:
      - "تعدُّد السياقات التي تُستخدم فيها اللّمات (سياسي، كيميائي، بيولوجي، قانوني)."
      - "الحاجة لإضافة لمّة 'اندماج' لشيوعها في سياق اتحاد الأجزاء المنفصلة."
    observations: "المجموعة تغطي مفهوم صيرورة الأشياء المنفصلة واحدة. اللّمات الموجودة دقيقة ولكن تحتاج لضبط بالشكل الكامل وإضافة مرادفات معاصرة."
  blind_candidates:
    - lemma: "اتِّحَاد"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من اتحد، وهو الأكثر شيوعاً للتعبير عن صيرورة الأشياء المنفصلة واحدة."
    - lemma: "الْتِحَام"
      generation_method: majaz
      justification: "يُعبر عن الاتحاد الوثيق أو العضوي بين الأجزاء (مثل التحام العظام أو المعادن)."
    - lemma: "انْدِمَاج"
      generation_method: ishtiqaq
      justification: "يُستخدم بكثرة في السياقات الاقتصادية والبيولوجية للتعبير عن اتحاد كيانين في كيان واحد."
    - lemma: "تَكَتُّل"
      generation_method: majaz
      justification: "يُشير إلى اتحاد الأجزاء لتكوين كتلة واحدة، وغالباً ما يُستخدم في السياقات السياسية والاقتصادية."

stage2_evidence:
  per_lemma:
    - lemma: "اتحاد"
      confirm:
        - text: "«الاتحاد: هو تصيير الذاتين واحدة، ولا يكون إلا في العدد من الاثنين فصاعدًا.»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«الاتحاد: جعل الشيئين واحدا.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "التحام"
      confirm:
        - text: "«(الالتحام) (في علم الأحياء) اتحاد أعضاء ليست من نوع واحد وخاصة في الزهرة كاتحاد البتلات بالاسدية»"
          source: "المعجم الوسيط"
        - text: "«عملية التحام الصخور بمادة صخرية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
    - lemma: "اندماج"
      confirm:
        - text: "«اندماج: وهو اتحاد خليتين أو نواتين معا عند التناسل»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
        - text: "«اندماج: التحام الأجزاء المتجاورة.»"
          source: "معجم المصطلحات الطبية"

stage3_analysis:
  per_lemma:
    - lemma: "اتحاد"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشامل يعبر عن مفهوم صيرورة الأشياء المنفصلة واحدة في شتى المجالات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اتِّحَاد"
    - lemma: "التحام"
      decision: confirmed
      decision_reason: "دقيق في وصف الاتحاد الفيزيائي أو العضوي الذي تنمحي فيه الفواصل بين الأجزاء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْتِحَام"
    - lemma: "انْدِمَاج"
      source: stage1
      decision: confirmed
      decision_reason: "لمة ضرورية لتغطية الجوانب الاقتصادية والبيولوجية من مفهوم الاتحاد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "انْدِمَاج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07387877-n"}

stage4_content:
  definition:
    current: "حدوث توحيد لأجزاء منفصلة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، ويحتاج لبيان الغاية من التوحيد (تكوين كيان واحد)."
    authored:
      - type: terminological
        text: "حُدُوثُ تَوْحِيدٍ لِأَجْزَاءٍ كَانَتْ مُنْفَصِلَةً لِتُصْبِحَ كِيَانًا وَاحِدًا أَوْ مَجْمُوعَةً مُتَرَابِطَةً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07387877-n", definition_index: 0, text: "حُدُوثُ تَوْحِيدٍ لِأَجْزَاءٍ كَانَتْ مُنْفَصِلَةً لِتُصْبِحَ كِيَانًا وَاحِدًا أَوْ مَجْمُوعَةً مُتَرَابِطَةً."}
  examples:
    per_lemma:
      - lemma: "اتِّحَاد"
        examples:
          - text: "أَدَّى اتِّحَادُ هَذِهِ الْقَبَائِلِ إِلَى تَكْوِينِ دَوْلَةٍ قَوِيَّةٍ."
            type: usage
      - lemma: "الْتِحَام"
        examples:
          - text: "تَمَّ الْتِحَامُ عِظَامِ الْكَسْرِ بَعْدَ مُدَّةٍ مِنَ الْعِلَاجِ."
            type: usage
      - lemma: "انْدِمَاج"
        examples:
          - text: "يَسْتَهْدِفُ الِانْدِمَاجُ الْمَصْرَفِيُّ تَعْزِيزَ الِاسْتِقْرَارِ الْمَالِيِّ."
            type: usage

