# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "الصفات أو الخصائص الجوهرية التي يُعرف بها الشيء"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في جوهره لكنه يعاني من ثلاثة قصور: (١) العطف بـ«أو» بين
        «الصفات» و«الخصائص» يُوهم التبادل أو الاختيار بينهما وهما في حقيقتهما مفهوم واحد؛
        (٢) لفظ «يُعرف» يُحيل إلى الجانب الإدراكي-المعرفي بينما المعنى المطلوب هو الجانب
        الوجودي-التعريفي (ما به الشيء هو هو)؛ (٣) يمكن إثراؤه بتعريف لغوي يُفرِّق بين
        كل لمّة في المجموعة.
    authored:
      - type: terminological
        text: "مجموع الصفات الذاتية التي تُحدِّد هويةَ الشيء وتُميِّزه عما سواه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
