# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (طبيعة، ماهية) تفتقران إلى تشكيل كامل في قاعدة البيانات"
      - "طبيعة تحتمل دلالات متعددة (السجية الفطرية، الكون والطبيعة، المزاج) قد تُفضي إلى لبس مع تمثيلها لهذه المجموعة المتعلقة بالصفات الجوهرية التعريفية"
      - "المجموعة تفتقر إلى مصطلح فلسفي دقيق يُعبِّر عن المعنى المقصود تعبيراً حرفياً"
    observations: >
      المجموعة تدور حول مفهوم «الخصائص الجوهرية المُعرِّفة للشيء»، وهو مفهوم فلسفي راسخ يُعبَّر عنه في التراث العربي بعدة مصطلحات:
      «ماهية» (الأدق فلسفياً)، «طبيعة» (الأشمل والأكثر تداولاً)، «كنه» (الأعمق في الدلالة على الجوهر الباطن).
      الصلة التراثية قوية جداً لأن هذه المصطلحات موروثة من عصر الترجمة الإسلامي الكلاسيكي.

  blind_candidates:
    - lemma: "حَقِيقَة"
      generation_method: majaz
      justification: >
        الحقيقة في اللغة «الشيء الثابت»، ثم امتدت دلالياً لتعني «الخالص الجوهري من الشيء
        وكنهه» — وهو امتداد مجازي راسخ في المعاجم. يقال «حقيقة الإنسان: الحيوان الناطق»
        أي ما به الشيء هو هو؛ وهذا يلتقي مع «الصفات الجوهرية التي يُعرف بها الشيء».
    - lemma: "مَاهِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من «ما هو» بإلحاق ياء النسبة والتاء المصدرية؛ فهي «جواب ما هو الشيء».
        تُعبِّر بدقة عن «الخصائص الجوهرية التي يُعرف بها الشيء» لأنها حرفياً تعني
        «الحقيقة التعريفية التي يتميز بها الشيء عما سواه».
    - lemma: "كُنْه"
      generation_method: majaz
      justification: >
        إحياء لفظ عربي كلاسيكي راسخ؛ كُنه الشيء: «جوهره وحقيقته وغايته» (القاموس المحيط،
        المعجم الوسيط). المجاز: «الكنه» أصلاً «النهاية والغاية» فأُزيح دلالياً ليدل
        على «أعمق ما في الشيء وجوهره الكامن». يميل هذا المصطلح نحو الإدراك الباطني للجوهر.
    - lemma: "جَوْهَر"
      generation_method: majaz
      justification: >
        الجوهر في الأصل «الحجر النفيس» ثم امتد مجازاً ليصف «أصل الشيء وحقيقته وذاته».
        يُستعمل في المعاجم الكلاسيكية والحديثة تعبيراً عن جوهر الشيء أي ما به يقوم وما
        يميزه. غير أنه في الفلسفة مثقل بمعنى «الجوهر الأرسطي» (ما قام بنفسه في مقابل العرض).


