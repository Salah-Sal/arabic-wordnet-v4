stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "يمكن إضافة مصطلحات تراثية دقيقة مثل الطرين واللحق."
    observations: "المجموعة تغطي مفهوم الرواسب التي ينقلها الماء (Alluvium). اللمّات الحالية (طمي، غرين، رواسب طميية) دقيقة ومعبرة، وتحتاج فقط إلى ضبط صرفي وتوثيق معجمي."
  blind_candidates:
    - lemma: "طَمْيٌ"
      generation_method: ishtiqaq
      justification: "المصطلح الشائع في المعاجم العربية الحديثة والقديمة للدلالة على الطين الذي يحمله السيل."
    - lemma: "غِرْيَنٌ"
      generation_method: ishtiqaq
      justification: "صيغة فنية دقيقة وردت في المعاجم (مثل الوسيط) للدلالة على نوع خاص من طمي الأنهار."
    - lemma: "رَوَاسِبُ طَمْيِيَّةٌ"
      generation_method: tarkib
      justification: "تعبير وصفي مركب يستخدم في الجيولوجيا والجغرافيا لترجمة alluvial deposits."
    - lemma: "طِرْيَنٌ"
      generation_method: majaz
      justification: "لفظ تراثي (من القاموس المحيط) يصف الطين الرقيق الذي يترسب ويبقى على وجه الأرض."

stage2_evidence:
  per_lemma:
    - lemma: "طَمْيٌ"
      confirm:
        - text: "«الطَّمْيُ: الطين يحمله السيل ويستقر على الأرض رطباً أو يابساً»"
          source: "المعجم الوسيط"
        - text: "«طَمَى الماءُ: ارتفع وملأ النهر، والزراعيون الآن يستعملون الطمي بمعنى: الطين الذي يحمله السيل ويستقر على الأرض»"
          source: "معجم الأخطاء الشائعة (محمد العدناني)"
      expands:
        - text: "«طمي: رواسب النهر في مجراه»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
    - lemma: "غَرِينٌ"
      confirm:
        - text: "«الغَرِينُ... هو الطِرْيَنُ... والطِينُ يَحْمِلُهُ السَّيْلُ فَيَبْقَى على وجهِ الأرض، رَطْباً أو يابِساً»"
          source: "القاموس المحيط"
        - text: "«الغَرِين: (في الجيولوجيا) صخر طيني حبيباته دقيقة يلتصق بعضها ببعض إذا ابتلت بالماء»"
          source: "المعجم الوسيط"
    - lemma: "رَوَاسِبُ طَمْيِيَّةٌ"
      confirm:
        - text: "«طمي أو رسوبيات: alluvial deposit (alluvium)»"
          source: "المعجم الموحد لمصطلحات المياه"
    - lemma: "طِرْيَنٌ"
      confirm:
        - text: "«الطِّرِّينُ: الطِّينُ الرَّقِيقُ يَبْقَى عَلى وَجْهِ الأَرْضِ قد جفَّ وتَشَقَّقَ»"
          source: "المعجم الكبير"
    - lemma: "لَحَقٌ"
      confirm:
        - text: "«اللَّحَق: موضع من الوادي ينضب عنه الماء فيلقى فيه البذر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

stage3_analysis:
  per_lemma:
    - lemma: "طمي"
      decision: confirmed
      decision_reason: "مصطلح أصيل ومعاصر مدعوم بقوة في المعاجم العامة والمتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَمْي"
    - lemma: "غرين"
      decision: confirmed
      decision_reason: "مصطلح معجمي قديم وجيولوجي حديث دقيق جداً للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَرِين"
    - lemma: "رواسب طميية"
      decision: confirmed
      decision_reason: "تعبير اصطلاحي مستقر في الأدبيات الجغرافية والجيولوجية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَوَاسِب طَمْيِيَّة"
    - lemma: "طِرْيَن"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي دقيق يصف القشرة الطينية المترسبة، مما يغني المجموعة دلالياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "طِرْيَن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09216160-n"
    - lemma: "لَحَق"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح يصف الأرض المترسب فيها الطمي أو المادة نفسها في سياق زراعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "لَحَق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09216160-n"

stage4_content:
  definition:
    current: "طين أو غرين أو حصى تحمله التيارات المائية الجارفة ويترسب حيث تتباطأ سرعة التيار"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يحتاج إلى صياغة أكثر دقة ومصطلحية."
    authored:
      - type: terminological
        text: "مادةٌ مكوَّنةٌ من طينٍ أو غِرْينٍ أو حَصًى، تَنْقُلُها المِياهُ الجارِفَةُ وتُرَسِّبُها حيثُ تَضْعُفُ قُوَّةُ التَّيَّار."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "طَمْي"
        examples:
          - text: "تراكم الطمي خلف السد مما أدى إلى انخفاض سعة تخزين المياه."
            type: usage
      - lemma: "غَرِين"
        examples:
          - text: "يعتمد فلاحو الوادي على الغرين الخصب الذي تخلفه الفيضانات السنوية."
            type: usage
      - lemma: "رَوَاسِب طَمْيِيَّة"
        examples:
          - text: "تتكون السهول الفيضية من رواسب طميية سميكة تراكمت عبر العصور."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09216160-n"
          definition_index: 0
          text: "مادةٌ مكوَّنةٌ من طينٍ أو غِرْينٍ أو حَصًى، تَنْقُلُها المِياهُ الجارِفَةُ وتُرَسِّبُها حيثُ تَضْعُفُ قُوَّةُ التَّيَّار."

