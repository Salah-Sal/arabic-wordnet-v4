      maqayis_quote: "«الطَّاءُ وَالْمِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عُلُوٍّ وَارْتِفَاعٍ فِي شَيْءٍ خَاصٍّ. يُقَالُ: طَمَا الْبَحْرُ... إِذَا امْتَلأَ وَعَلَا.»"
