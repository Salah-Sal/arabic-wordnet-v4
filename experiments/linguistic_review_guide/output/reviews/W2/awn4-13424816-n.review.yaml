# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13424816-n
# record — وثيقة يمكن أن تكون بمثابة دليل قانوني على معاملة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «سجل» مجرّدة من التشكيل، مما يُوقِع التباساً بين السِّجِلّ (الكتاب) والسَّجْل (الدلو) والفعل سَجَلَ"
      - "المجموعة تحتوي على لمّة واحدة فقط لمفهوم واسع الاستعمال في الفقه والقانون"
      - "التعريف العربي يبدو ترجمة حرفية من الإنجليزية ولا يتّبع أسلوب المعاجم العربية"
    observations: "المفهوم المطلوب — وثيقة تُثبت معاملة وتصلح دليلاً قانونياً — مفهوم أصيل في الفقه الإسلامي والتراث القانوني العربي، وله ألفاظ متعددة مستقرة: السِّجِلّ والصَّكّ والمَحْضَر والحُجَّة. التعريف الحالي يحتاج إلى صياغة معجمية عربية أصيلة بدل الترجمة."

  blind_candidates:
    - lemma: "صَكّ"
      generation_method: majaz
      justification: "أصل الصَّكّ من الضرب والطبع (صَكَّ الباب)، ثم انتقل مجازاً إلى الوثيقة المختومة المُقِرّة بمعاملة مالية أو حقوقية. لفظ مستقر في الفقه الإسلامي منذ القرن الأول الهجري."
    - lemma: "مَحْضَر"
      generation_method: ishtiqaq
      justification: "مُشتقّ من الجذر ح-ض-ر على وزن مَفْعَل (اسم مكان/زمان)، ثم استُعمل بمعنى الصحيفة التي تُكتب في واقعة بحضور الشهود. يدلّ على وثيقة تُدوَّن فيها وقائع وتُوقَّع من الشهود."
    - lemma: "مُسْتَنَد"
      generation_method: ishtiqaq
      justification: "من الجذر س-ن-د على وزن مُسْتَفْعَل (اسم مفعول من استند)، بمعنى ما يُعتمد عليه حجةً. استُعمل حديثاً بمعنى الوثيقة الرسمية الدالة على حق أو التزام."
    - lemma: "حُجَّة"
      generation_method: majaz
      justification: "أصل الحُجَّة من القصد والبرهان (حَجَّ = قصد)، ثم انتقل مجازاً إلى وثيقة التملك والإثبات القانوني. مستعمل في التراث الفقهي بمعنى الوثيقة المُثبِتة."


stage2_evidence:
  per_lemma:
    - lemma: "سِجِلّ"
      confirm:
        - text: "«السِّجِلّ: كتاب الحكم وقد سجل عليه القاضي»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«(السّجل) الكتاب يدون فيه ما يراد حفظه (ج) سجلات (لا يكسر) والكاتب وفي التنزيل العزيز {كطي السجل للكتب}»"
          source: "المعجم الوسيط (الطبعة الرابعة)"
        - text: "«اسْمُ لِكتاب العَهْد ونحوه، الصَّكُّ، الكتابُ الكبيرُ، الصَّحِيفَةُ التى فيها الكتابُ»"
          source: "المعجم الكبير"
        - text: "«السِّجِلُّ: مَا يكْتب لرَسُول، أَو مجهز، أَو رحال بِإِطْلَاق نَفَقَته حَيْثُ بلغ إِلَى كل عَامل يجتاز بِهِ، وَيُقَال أَيْضا لما يَكْتُبهُ القَاضِي لفصل الْقَضَاء»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«السّجلّ [...] الصك وهو أي الصك كتاب الإقرار ونحوه، ثم سمّي به كتاب الحكم للتشبيه. [...] إذا حكم فالسّجل»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«سِجِلُّ كِتَابُ الْقَاضِي وَالْجَمْعُ سِجِلَّاتٌ وَأَسْجَلْتُ لِلرَّجُلِ إسْجَالًا كَتَبْتُ لَهُ كِتَابًا وَسَجَّلَ الْقَاضِي بِالتَّشْدِيدِ قَضَى وَحَكَمَ وَأَثْبَتَ حُكْمَهُ فِي السِّجِلّ»"
          source: "المصباح المنير للفيومي"
          addition: "يبيّن الاشتقاقات الفعلية: سجّل القاضي = أثبت حكمه، وأسجل = كتب كتاباً"

    - lemma: "صَكّ"
      confirm:
        - text: "«الصك: الكتاب الذي تكتب فيه المعاملات والأقارير»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الصَّك) وَثِيقَة بِمَال أَو نَحوه (مَعَ)»"
          source: "المعجم الوسيط (الطبعة الرابعة)"
        - text: "«الصَّكّ: كتابُ الإقرار بالمال وغيره (معرب)»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«وثيقةُ الإِقرار بمالٍ أو نحوه, وقد جَرَى به التَّبادلُ كالنُّقود»"
          source: "المعجم الكبير"
      expands:
        - text: "«والصّكّ ما كتب فيه البيع أو الرهن أو الإقرار ونحوها [...] والحجة والوثيقة تتناولان الثلاثة يعني السّجل والمحضر والصّك لأنّ في كلّ منها معنى الحجة والوثاق»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يبيّن أن الصكّ خاص بالبيع والرهن والإقرار، وأنه والسجل والمحضر تجمعها الحجة والوثيقة"

    - lemma: "مَحْضَر"
      confirm:
        - text: "«(الْمحْضر) [...] والسجل وصحيفة تكتب في واقعة وفي آخرها خطوط الشهود بما تضمنه صدرها»"
          source: "المعجم الوسيط (الطبعة الرابعة)"
      contradicts:
        - text: "«المَحْضَر: هو الذي كتبه القاضي فيه دعوى الخصمين مفصَّلاً ولم يحكم بما ثبت عنده بل كتبه للتذكُّر ويسمى توقيعاً»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "المحضر في الاصطلاح الفقهي أخصّ من السجل: هو ما يُكتب قبل الحكم (مرحلة الدعوى)، لا وثيقة المعاملة ذاتها"
        - text: "«أحدا إذا ادّعى على الآخر فالمكتوب المحضر وإذا أجاب الآخر وأقام البينة فالتوقيع وإذا حكم فالسّجل»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المحضر مقصور على مرحلة الادعاء عند القاضي، وليس وثيقة إثبات معاملة"

    - lemma: "مُسْتَنَد"
      confirm:
        - text: "«قَدَّمَ المستند المطلوب للمحكمة [...] الوثيقة الدالة على حقٍّ أو التزام في إطار القانون، وقد وافق مجمع اللغة المصري على هذا الاستعمال»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: "«المستند: مثل السند»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى الأصلي للمستند هو ما يُعتمد عليه (من الاتكاء)، لا الوثيقة المُثبِتة للمعاملة تحديداً"

    - lemma: "حُجَّة"
      confirm:
        - text: "«وثيقة التملك، ما دفع به الخصم، الوجه المشروع الذي يكون به الظفر عند الخصومة»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«والحجة والوثيقة تتناولان الثلاثة يعني السّجل والمحضر والصّك»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الحجة مصطلح جامع شامل للسجل والمحضر والصك معاً، فهي أعمّ من مفهوم المجموعة الذي يخصّ وثيقة المعاملة"


stage3_analysis:
  per_lemma:
    - lemma: "سِجِلّ"
      decision: confirmed
      decision_reason: "السِّجِلّ مصطلح عربي أصيل مستقر في التراث الفقهي والقانوني بمعنى كتاب العهد وكتاب الحكم، وهو المقابل الدقيق للإنجليزية record بمعنى الوثيقة الرسمية المُثبِتة. اللمّة الموجودة «سجل» بلا تشكيل تحتاج تصحيحاً إلى «سِجِلّ» لرفع الالتباس مع السَّجْل (الدلو)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "السِّجِلّ هو الكتاب الرسمي الذي يُدوَّن فيه ما يُراد حفظه من أحكام وعهود ومعاملات، وهو أعمّ من الصكّ إذ يشمل كل وثيقة رسمية مُسجَّلة، بينما الصكّ يخصّ الإقرار المالي والتعاقدي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِجِلّ"

    - lemma: "صَكّ"
      source: stage1
      decision: confirmed
      decision_reason: "الصَّكّ مصطلح مستقر في التراث الفقهي منذ القرون الأولى بمعنى «كتاب المعاملات والأقارير» و«وثيقة الإقرار بمال أو نحوه». وهو يتطابق مع تعريف المجموعة (وثيقة تكون دليلاً قانونياً على معاملة) تطابقاً دقيقاً، لا سيما في جانب المعاملات المالية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصَّكّ أخصّ من السجلّ: يُستعمل تحديداً في وثائق الإقرار بالمال والبيع والرهن والتعاقد، بينما السجلّ أشمل ويطال كل ما يُدوَّن رسمياً."
      actions:
        - command: create_entry
          params:
            lemma: "صَكّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَحْضَر"
      source: stage1
      decision: removed
      decision_reason: "المَحْضَر في الاصطلاح الفقهي الدقيق مقصور على مرحلة تدوين الدعوى عند القاضي قبل الحكم، لا على توثيق المعاملات. وإن كان يُستعمل حديثاً بمعنى محضر الجلسة، فهو يوثّق وقائع لا معاملات تجارية أو مالية، فلا يتطابق مع تعريف المجموعة."

    - lemma: "مُسْتَنَد"
      source: stage1
      decision: removed
      decision_reason: "المُسْتَنَد في أصله ما يُعتمد عليه، واستعماله الحديث للوثيقة القانونية مقبول لغوياً، لكنه أعمّ من المفهوم المطلوب: فهو يشمل أي وثيقة داعمة ولا يختصّ بتوثيق المعاملات. كما أن دلالته الحديثة لم تتبلور إلا بقرار مجمعي، فيُفضَّل عليه اللفظ التراثي المستقر."

    - lemma: "حُجَّة"
      source: stage1
      decision: removed
      decision_reason: "الحُجَّة مصطلح جامع يتناول السجلّ والمحضر والصكّ معاً كما نصّ التهانوي، فهي أعمّ من مفهوم المجموعة. إدراجها هنا يخلط بين المستوى الأعلى (hypernym) والمستوى المطلوب."


