stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي به دور لغوي (استخدام الكلمة لتعريف نفسها: بدء/بدء)."
      - "نقص في المرادفات الاصطلاحية التي تشير إلى الحدث مثل 'ابتداء' و'مستهل'."
    observations: "المجموعة تغطي المفهوم الأساسي للبداية كحدث، والكلمات الموجودة صحيحة تماماً لكن يمكن إثراؤها بمصطلحات أخرى تعبر عن نفس المفهوم في سياقات مختلفة."
  blind_candidates:
    - lemma: "بِدَايَة"
      generation_method: ishtiqaq
      justification: "اللفظ الأكثر شيوعاً وعمومية للدلالة على أول الشيء."
    - lemma: "بَدْء"
      generation_method: ishtiqaq
      justification: "المصدر الصريح الذي يعبر عن وقوع الحدث (فعل الابتداء)."
    - lemma: "مُسْتَهَلّ"
      generation_method: majaz
      justification: "لفظ مستخدم بكثرة في السياقات الزمنية والأدبية للدلالة على البداية."
    - lemma: "فَاتِحَة"
      generation_method: majaz
      justification: "تستخدم للدلالة على ما يُفتتح به الشيء، وتناسب سياق الكتب والخطب والأحداث."

stage2_evidence:
  per_lemma:
    - lemma: "بَدْء"
      confirm:
        - text: "«(البدء) أول كل شَيْء يُقَال فعلته بدءا وبدء بَدْء وَأول بَدْء»"
          source: "المعجم الوسيط"
        - text: "«(البدء) بسكون الدال المهملة في اللغة افتتاح الشيء.»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "بِدَايَة"
      confirm:
        - text: "«(بِدَايَة) من (ب د أ) أول كل شيء.»"
          source: "موسوعة السلطان قابوس"
        - text: "«ذكرت المعاجم كلمة «البداية» وأجازت استعمالها... مستعملة بين المؤلفين من قديم»"
          source: "معجم الصواب اللغوي"
    - lemma: "اِبْتِدَاء"
      confirm:
        - text: "«(الابتداء) هو لغة الافتتاح وفي عرف العلماء يطلق على معان منها ذكر الشيء قبل المقصود»"
          source: "كشاف اصطلاحات الفنون"
        - text: "«تقديم الشيء على غيره ضربا من التقديم»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "مُسْتَهَلّ"
      confirm:
        - text: "«وجئته عند مُهَلِّ الشهر ومُسْتَهَلِّه، ومن المجاز: ما أحسنَ مُسْتَهَلّ قصيدته! أي مطلعها. وفي الوسيط: استهللنا الشهر: ابتدأناه.»"
          source: "معجم الصواب اللغوي (عن أساس البلاغة)"
        - text: "«بدايته»"
          source: "معجم الصواب اللغوي"

stage3_analysis:
  per_lemma:
    - lemma: "بَدْء"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والمباشر للتعبير عن ابتداء الحدث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَدْء"
    - lemma: "بِدَايَة"
      decision: confirmed
      decision_reason: "مصطلح فصيح شائع ومقر من المجامع اللغوية للدلالة على أول الشيء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِدَايَة"
    - lemma: "اِبْتِدَاء"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن فعل الشروع والافتتاح بدقة في السياقات اللغوية والرسمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اِبْتِدَاء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُسْتَهَلّ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ بليغ يستخدم بكثرة في افتتاحيات المدد الزمنية والأعمال الإبداعية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُسْتَهَلّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الحدث المتمثل في بدء شيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعاني من الدور (استخدام المشتق لتعريف الأصل) ويحتاج لوصف أكثر بيانية."
    authored:
      - type: terminological
        text: "أوّلُ الشَّيْءِ وَمَا يُقَدَّمُهُ عَلَى غَيْرِهِ، وَاللَّحْظَةُ الَّتِي يُشْرَعُ فِيهَا فِي أَمْرٍ مَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "أوّلُ الشَّيْءِ وَمَا يُقَدَّمُهُ عَلَى غَيْرِهِ، وَاللَّحْظَةُ الَّتِي يُشْرَعُ فِيهَا فِي أَمْرٍ مَا."
  examples:
    per_lemma:
      - lemma: "بَدْء"
        examples:
          - text: "كَانَ بَدْءُ الاحْتِفَالِ بِكَلِمَةٍ تَرْحِيبِيَّةٍ مِنَ المُنَظِّمِينَ."
            type: usage
      - lemma: "بِدَايَة"
        examples:
          - text: "تُشَكِّلُ هَذِهِ المَرْحَلَةُ بِدَايَةً حَقِيقِيَّةً لِلنُّجَاحِ."
            type: usage
      - lemma: "اِبْتِدَاء"
        examples:
          - text: "تَمَّ تَحْدِيدُ مَوْعِدِ ابْتِدَاءِ العَمَلِ فِي المَشْرُوعِ الجَدِيدِ."
            type: usage
      - lemma: "مُسْتَهَلّ"
        examples:
          - text: "أَلْقَى رَئِيسُ الجَلْسَةِ كَلِمَتَهُ فِي مُسْتَهَلِّ المِلْتَقَى."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أَلقَى خِطابَهُ فِي بَدْءِ الاحتِفَال."}

