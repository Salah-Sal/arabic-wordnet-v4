          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: >
            توضح مصطلحات المياه أن (كفاءة) تُستخدم في السياقات التقنية مقابلاً
            لـ(efficiency) و(capability) معاً — ما يُربك التمييز بين دلالاتها
