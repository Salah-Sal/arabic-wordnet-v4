      entry_id: "{auto}"
      root: "طوع"
      maqayis_quote: >
        «الطَّاءُ وَالْوَاوُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى
        الْإِصْحَابِ وَالِانْقِيَادِ. يُقَالُ: طَاعَهُ يَطُوعُهُ، إِذَا انْقَادَ
        مَعَهُ وَمَضَى لِأَمْرِهِ. وَأَطَاعَهُ بِمَعْنَى طَاعَ لَهُ.
        وَالِاسْتِطَاعَةُ مُشْتَقَّةٌ مِنَ الطَّاعَةِ.»

    - lemma: "قُدْرَة"
