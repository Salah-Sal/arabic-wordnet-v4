          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الاستطاعة: هي عرض يخلقه الله تعالى في الحيوان، يفعل به الأفعال الاختيارية.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الاستطاعة: الحقيقية القدرة التامة التي يجب عندها صدور الفعل فلا تكون
