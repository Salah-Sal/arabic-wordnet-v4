          source: "مقاييس اللغة لابن فارس (جذر طوع)"

    - lemma: "قدرة"
      confirm:
        - text: "«القُدْرَةُ: الطاقةُ، القُوَّةُ على الشىء والتمكُّن منه.»"
          source: "المعجم الوسيط (OCR)"
        - text: "«القدرة: هي الصفة التي تمكن الحي من الفعل وتركه بالإرادة. القدرة: صفة
            تؤثر على قوة الإرادة.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«القُدرة: هي القوة على الشيء والتمكُّن منه.»"
