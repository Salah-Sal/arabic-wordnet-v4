# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────
stage3_analysis:
  per_lemma:

    # ─── لمّات قائمة ───────────────────────────────────────

    - lemma: "استطاعة"
      decision: confirmed
      decision_reason: >
        مُوثَّقة في كبريات المعاجم الكلاسيكية والفلسفية بالمعنى المطلوب (الصفة
        المُمَكِّنَة من الفعل). وزن الاستفعال يُفيد طلب الطوع والانقياد من النفس
        ويُمثّل بُعداً دلالياً مستقلاً. لا إشكال في الفصاحة أو الاطّراد.
        تحتاج فقط إلى تشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُصوِّر القدرةَ باعتبارها طاقةً انقياديَّةً يُستحضَر فيها توافق النفس مع
        مقتضى الفعل — وفق أصل الجذر (الإصحاب والانقياد). تستلزم في الاصطلاح
        الكلامي مقارنتها للفعل، فهي القدرة في لحظة تحقّقها لا القدرة المجرّدة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِطَاعَة"

    - lemma: "قدرة"
      decision: confirmed
      decision_reason: >
        أعمّ لمّات المجموعة وأرسخها. مُوثَّقة في جميع طبقات المعجم العربي من
        الكلاسيكي إلى الحديث. جذرها (قدر) يدلّ على مبلغ الشيء ونهايته. تُعادل
        ability في مراجع ALECSO وغيرها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تدلّ على التمكّن الجوهري من الفعل سواء أُعمل أم لم يُعمل — لا تستلزم
        الاقتران بالأداء الفعلي، وهي بذلك أعمّ من (اِسْتِطَاعَة) وأكثر تجريداً.
        تُستخدم في السياقات الفلسفية والتربوية والعامة على حدٍّ سواء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُدْرَة"

    - lemma: "مقدرة"
      decision: confirmed
      decision_reason: >
        المعجم الوسيط (OCR والنسخة الثانية) يُساوي بينها وبين (قدرة) مباشرةً.
        مصادر ALECSO تُوردها مقابلاً لـ(ability) و(capability). التعارض الوارد من
        دستور العلماء هو تعريف نحوي (الحال المقدَّرة) لا صلة له بالمعنى المقصود.
        وزن مَفْعُلَة يُلمح إلى السعة والاتساع.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        وزن مَفْعُلَة يُوحي بالسعة والوُسع المرافق للقدرة — تُستخدم أحياناً في
        سياق الإمكانية المتاحة للفرد أو المؤسسة من حيث الموارد والطاقة الكامنة،
        وليس مجرد التمكّن الذاتي. أقرب دلالياً من (قُدْرَة) لكنها تحمل إيحاء
        بالاتساع والتوافر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَقْدُرَة"

    # ─── مرشّحات المرحلة ١ ──────────────────────────────────

    - lemma: "مَلَكَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُوثَّقة توثيقاً ممتازاً في المعجم الوسيط والكشاف والتوقيف والمورد الحديث
        بمعنى "صفة راسخة في النفس تُمكّن من الأداء"، وهو بالضبط ما تصفه المجموعة.
        استُخدمت في مسردَي ALECSO للإعلام والاجتماع مقابلاً لـ(faculty).
        اجتازت اختبار السكّ: "مَلَكَة الكتابة / ملكة اللغة" تعبيرات جامدة
        لا يُبدَل فيها مكوّن بآخر. اجتازت اختبار التثبيت المعجمي بامتياز.
        لا إشكال في الفصاحة أو الصرف.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تخصّ القدرةَ المتأصِّلَةَ الراسخة في النفس نتيجة ممارسة ومران متواصلَيْن
        — تُفيد الاستعداد الفطري أو المكتسب ذا الوظيفة المحدَّدة، وهو بُعدٌ
        غائب عن أخواتها. تُصوِّر الصفةَ باعتبارها هيئةً نفسانيَّةً متجذِّرة
        لا قابلة للزوال بسهولة.
      actions:
        - command: create_entry
          params:
            lemma: "مَلَكَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أَهْلِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُوثَّقة في المعجم الوسيط والمعجم الكبير ومصادر ALECSO المتعددة بمعنى
        الصلاحية والجدارة للأداء. مقابل لـ(aptitude) و(competence) و(competency)
        في مصادر عدة. المعنى الفقهي (وجوب الحقوق) هو معنى اصطلاحي مقيَّد لا يلغي
        المعنى العام الموثَّق في المعجم الوسيط "الأهلية للأمر: الصلاحية له".
        اجتازت اختبار السكّ والتثبيت المعجمي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُشدِّد على الصلاحية الرسمية أو الاجتماعية المُعترَف بها — لها إيحاء
        بالاعتراف الخارجي والمعيار القابل للقياس، بخلاف (قُدْرَة) التي تصف
        التمكّن الذاتي البحت. تُستخدم في السياقات الإدارية والتعليمية والقانونية
        للإشارة إلى أهلية موثَّقة لتولّي مهمة أو منصب.
      actions:
        - command: create_entry
          params:
            lemma: "أَهْلِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "كَفَاءَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود دليل في المعجم الوسيط ("للعمل: القدرة عليه وحسن تصريفه")،
        إلا أن معجم الصواب اللغوي يرفض هذا الاستخدام صراحةً ويُحيل إلى (كِفاية).
        الاشتراك اللفظي الحادّ مع معنى (efficiency) التقني — السائد في آلاف المداخل
        في ARABTERM — يُنشئ غموضاً دلالياً يُضرّ بالمجموعة. المعنى النكاحي الكلاسيكي
        (المماثلة) يُزيد الاشتراكَ تعقيداً. تُغني عنها (قُدْرَة) و(مَلَكَة)
        و(أَهْلِيَّة) المُضافة.

    - lemma: "جَدَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        أصل الجذر في مقاييس اللغة يدلّ على الجدار والحائط لا على الاستحقاق،
        والتطوّر الدلالي نحو "الجدارة بالأمر" يبدو مستحدثاً ولم يُؤسَّس تأسيساً
        كافياً في المعاجم الكلاسيكية. وردت (جدارة) في السياقات الإدارية مقابلاً
        لـ(competence/jurisdiction) بمعنى الاختصاص أكثر من معنى القدرة الذاتية.
        مغطاة دلالياً بـ(أَهْلِيَّة) المُؤكَّدة.


