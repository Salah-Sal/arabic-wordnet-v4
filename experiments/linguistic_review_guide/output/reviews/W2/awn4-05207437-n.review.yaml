# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. التوليد الأعمى (من الملف المُقنَّع — قبل الاطلاع على اللمّات)
  blind_candidates:
    - lemma: "مَلَكَة"
      generation_method: majaz
      justification: >
        الجذر (م ل ك) يدلّ على القوة والصحة في الشيء. أُزيح المعنى من "الامتلاك"
        إلى "الاستعداد الراسخ في النفس" — تعبير اصطلاحي كلاسيكي راسخ يدلّ على
        صفة تُمكّن صاحبها من أداء أعمال بعينها بحذق ومهارة، وهو ما تصفه المجموعة
        من "صفة تسمح بالإنجاز". فُضِّل إحياء هذا اللفظ التراثي تجنّباً للاشتراك.

    - lemma: "أَهْلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن فَعْلِيَّة من جذر (أ هـ ل). يدلّ على الصلاحية الذاتية
        للقيام بأمر ما — وهي بالضبط "الصفة التي تسمح أو تُسهّل الإنجاز". الوزن
        الصناعي منتج لتحويل الأسماء إلى مفاهيم مجردة، وقد استُخدم "أهلية الأداء"
        في الاصطلاح القانوني والتربوي بمعنى قريب.

    - lemma: "كَفَاءَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (ك ف أ) على وزن فَعَالَة، يدلّ أصلاً على المماثلة وكفاية الشيء.
        طُوِّع للدلالة على "القدرة وحسن تصريف العمل"، وهو استخدام موثَّق في المعجم
        الوسيط. يُناسب دلالة المجموعة من حيث الارتباط بجودة الأداء والقدرة عليه.

    - lemma: "جَدَارَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (ج د ر) على وزن فَعَالَة، يدلّ على الجدارة بالأمر والأحقية به.
        استُخدم في تراكيب "جدارة بالاستحقاق والأداء"، ومنه يُعبَّر عن الصفة
        التي تُؤهّل صاحبها للإنجاز.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمّات الثلاث (استطاعة، قدرة، مقدرة) مكتوبة بلا تشكيل — يجب تشكيلها بالكامل."
      - "غياب لمّات موثَّقة معجمياً بالمعنى ذاته كـ(مَلَكَة) و(أَهْلِيَّة) رغم ورودهما في كبريات المعاجم."
      - "التعريف الحالي يتضمّن تكراراً بنيوياً (صفة ... صفة) وصياغة شبه ترجمية — يستدعي إعادة التأليف."
      - "ضبط (مقدرة) صرفياً متردِّد في المصادر بين مَقْدُرَة ومَقْدِرَة — يحتاج توحيداً."
    observations: >
      المجموعة تتمحور حول مفهوم "الكيفية الذاتية المُمَكِّنَة من الأداء" — وهو مفهوم
      عريق في التراث العربي الفلسفي والكلامي واللغوي. اللمّات الثلاث القائمة صحيحة
      ومستعملة، غير أن (استطاعة) و(قدرة) يتداخل بينهما التعريف الكلامي (الصفة
      التي يتمكن بها الحيّ من الفعل) دون تمييز دقيق في السياق الموسوعي الحديث.
      (مقدرة) صيغة موازية لـ(قدرة) ووزنها مَفْعُلَة أو مَفْعِلَة. غياب (مَلَكَة)
      لافت إذ هي المصطلح الكلاسيكي الأوفى في التعبير عن الصفة المكتسبة الراسخة.
      (أَهْلِيَّة) تُضيف بُعداً اجتماعياً وتقييمياً مفيداً. الإضافتان مطلوبتان
      لتكتمل المجموعة وتعكس التنوّع الدلالي الحقيقي.


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────
