# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "لفظ 'القيامة' بمفرده في العربية يرتبط في الذهن غالباً بـ 'يوم القيامة' (يوم الحشر) في السياق الإسلامي، لذا يحتاج المفهوم المسيحي المخصوص (قيامة المسيح) إلى تقييد أو سياق واضح لتمييزه."
    observations: "المفهوم يشير إلى واقعة لاهوتية محددة في العهد الجديد. الترجمة العربية المعتمدة في الكنيسة هي 'القيامة'، وتعرف بـ 'قيامة المسيح' للتمييز."
  blind_candidates:
    - lemma: "القِيَامَة"
      generation_method: majaz
      justification: "اللفظ العام للنهوض من الموت، ويُستخدم للدلالة على الواقعة المخصوصة في السياق الديني."
    - lemma: "قِيَامَةُ المَسِيح"
      generation_method: tarkib
      justification: "تعبير إضافي يحدد المفهوم بدقة كما في اللاهوت المسيحي، متبوعاً باسم العلم."
    - lemma: "انْبِعَاثُ المَسِيح"
      generation_method: tarkib
      justification: "استخدام لفظ 'الانبعاث' للدلالة على العودة للحياة بعد الموت (Resurrection)."
    - lemma: "قِيَامَةُ السَّيِّدِ الْمَسِيحِ"
      generation_method: tarkib
      justification: "الصيغة التشريفية الشائعة في الأدبيات المسيحية العربية."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "القيامة"
      confirm:
        - text: "(عند المسيحيين): عيد ذكرى قيامة السيد المسيح من الموت في اعتقادهم، ويعرف بالعيد الكبير."
          source: "المعجم الوسيط (مادة: الفصح)"
        - text: "ولهم فيها مقبرة يسمونها القيامة لاعتقادهم أن المسيح قامت قيامته فيها."
          source: "معجم البلدان للياقوت الحموي"
    - lemma: "قيامة المسيح"
      confirm:
        - text: "قيامة السيد المسيح من الموت."
          source: "المعجم الوسيط (مادة: الفصح)"
    - lemma: "انبعاث"
      confirm:
        - text: "(1) البعث؛ النشور (2) انبعاث."
          source: "المورد الحديث (ترجمة: Resurrection)"
    - lemma: "البعث"
      confirm:
        - text: "(يَوْم الْقِيَامَة) يَوْم بعث الْخَلَائق لِلْحسابِ."
          source: "المعجم الوسيط"
        - text: "Resurrection: (1) البعث؛ النشور."
          source: "المورد الحديث"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "القيامة"
      decision: confirmed
      decision_reason: "المصطلح العربي الأساسي والوحيد المستخدم للدلالة على الحدث في السياق المسيحي (خاصة عند تعريفه بأل)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "القِيَامَة"

    - lemma: "قيامة المسيح"
      decision: confirmed
      decision_reason: "تعبير إضافي دقيق يرفع اللبس ويُستخدم لوصف الحدث لاهوتياً وتاريخياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِيَامَةُ المَسِيح"

    - lemma: "انْبِعَاثُ المَسِيح"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح بديل يُستخدم في التراجم الحديثة (مثل المورد) والمقالات اللاهوتية للتعبير عن الـ Resurrection."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "انْبِعَاثُ المَسِيح", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "قِيَامَةُ السَّيِّدِ الْمَسِيحِ"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة تشريفية رسمية شائعة جداً في السياق الديني العربي المسيحي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "قِيَامَةُ السَّيِّدِ الْمَسِيحِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "(في العهد الجديد) قيامة المسيح في اليوم الثالث بعد الصلب"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري (يستخدم كلمة 'قيامة' لتعريف 'القيامة')، ويحتاج إلى توضيح المعنى الجوهري للحدث."
    authored:
      - type: terminological
        text: "(في اللاهوت المسيحي) واقعة عودة يسوع المسيح إلى الحياة ونهوضه من القبر في اليوم الثالث بعد موته صلباً، وهي الركيزة الأساسية في العقيدة المسيحية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "(في اللاهوت المسيحي) واقعة عودة يسوع المسيح إلى الحياة ونهوضه من القبر في اليوم الثالث بعد موته صلباً، وهي الركيزة الأساسية في العقيدة المسيحية."}

  examples:
    per_lemma:
      - lemma: "القِيَامَة"
        examples:
          - text: "يحتفل المسيحيون في جميع أنحاء العالم بعيد القيامة ذكرى لنهوض المسيح من الموت."
            type: usage
      - lemma: "قِيَامَةُ المَسِيح"
        examples:
          - text: "تُعتبر قِيامة المسيح الحدث المركزي الذي قامت على أساسه التبشيرية المسيحية الأولى."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُشار إلى قيامة المسيح في الأناجيل الأربعة كشهادة على انتصاره على الموت."}

# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    - lemma: "القِيَامَة"
      entry_id: "{auto}"
      root: "قوم"
      maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ... وَالْآخَرُ عَلَى انْتِصَابٍ أَوْ عَزْمٍ... قَامَ قِيَامًا، إِذَا انْتَصَبَ.»"
    - lemma: "قِيَامَةُ المَسِيح"
      entry_id: "{auto}"
      roots:
        - word: "قيامة"
          root: "قوم"
          maqayis_quote: "«قَامَ قِيَامًا، إِذَا انْتَصَبَ.»"
        - word: "المسيح"
          root: "مسح"
          maqayis_quote: "«الْمِيمُ وَالسِّينُ وَالْحَاءُ أَصْلٌ صَحِيحٌ، وَهُوَ إِمْرَارُ الشَّيْءِ عَلَى الشَّيْءِ بَسْطًا... وَلِذَلِكَ سُمِّيَ الْمَسِيحُ عَلَيْهِ السَّلَامُ مَسِيحًا، كَأَنَّ عَلَيْهِ مَسْحَةً مِنْ جَمَالٍ.»"

  per_sense:
