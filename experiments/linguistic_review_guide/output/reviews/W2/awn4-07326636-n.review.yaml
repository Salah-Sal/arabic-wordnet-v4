      mwe: false
    - lemma: "قِيَامَةُ المَسِيح"
      sense_id: "{auto}"
      nuance: "صيغة محددة تمنع الالتباس مع قيامة الساعة أو الحشر."
      mwe: true

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قوم","maqayis":"«الْقَافُ وَالْوَاوُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ... وَالْآخَرُ عَلَى انْتِصَابٍ أَوْ عَزْمٍ... قَامَ قِيَامًا، إِذَا انْتَصَبَ.»"}'
