        value: '{"root":"سقط","maqayis":"«السِّينُ وَالْقَافُ وَالطَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْوُقُوعِ، وَهُوَ مُطَّرِدٌ. مِنْ ذَلِكَ سَقَطَ الشَّيْءُ يَسْقُطُ سُقُوطًا.»"}'
    - command: set_metadata
