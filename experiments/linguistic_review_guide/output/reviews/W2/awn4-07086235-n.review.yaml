# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لُغَة رَسْمِيَّة: المصطلح مُستخدَم في المعاجم العربية بمعنيَيْن رئيسيَّيْن مغايرَيْن تمامًا
         للمعنى المقصود هنا — (١) اللغة الوطنية التي ينصُّ عليها دستور الدولة (المعجم الكبير)،
         و(٢) formal language في علوم الحاسوب (معجم البيانات والذكاء الاصطناعي 2024).
         استخدامها بمعنى officialese يُنشئ التباسًا دلاليًا خطيرًا."
      - "لُغَة بِيرُوقْرَاطِيَّة: مركب وصفي حر غير مسكوك معجمياً؛ لا يرد في المعاجم كوحدة
         معجمية ثابتة. والجزء «بيروقراطية» في المعاجم يُعرَّف بمعنى نظام الحكم أو الإدارة
         (البيروقراطية = الحكم بوساطة كبار الموظفين)، لا بمعنى أسلوب الكتابة."
      - "تفتقر المجموعة إلى لمّة مستقرة مسكوكة تصف هذا المفهوم الأسلوبي النقدي."
    observations: >
      يُمثِّل مفهوم officialese ظاهرةً أسلوبيةً ذات جذور في الثقافة العربية؛ إذ كانت الكتابة
      الديوانية في الدولة الإسلامية — سواء في العصر الأموي أو العباسي أو العثماني — تتَّسم
      بخصائص مماثلة من الرسمية الجافة والتكلُّف والغموض وادعاء الفخامة. الفجوة المعجمية
      الحالية قابلة للسدِّ باستحياء المصطلح التراثي «اللغة الديوانية» أو «الخطاب الديواني».
      وتجدر الإشارة إلى أن المعجم الكبير ومعجم الوسيط كلاهما يوثِّقان الارتباطَ الوثيق بين
      «الديواني» والكتابات الرسمية لمؤسسة الدولة.

  blind_candidates:
    - lemma: "اللُّغَةُ الدِّيوَانِيَّةُ"
      generation_method: tarkib
      justification: >
        مركب وصفي يُحيي مصطلح «الديوان» — مؤسسة الإدارة الحكومية في الدولة الإسلامية —
        دلالةً على أسلوب الكتابة الرسمي المميَّز لموظفيها. «الخطُّ الديواني» في التراث كان
        خطًّا خاصًّا بالكتابات الرسمية في ديوان الدولة العثمانية. اللغةُ الديوانيةُ قياسٌ عليه:
        الأسلوب الرسمي الجاف الغامض المميَّز للكتابة الحكومية. مركب مسكوك في أدبيات
        الكتابة الإدارية العربية القديمة.

    - lemma: "اللُّغَةُ الْخَشَبِيَّةُ"
      generation_method: majaz
      justification: >
        مجاز من «الخشب» للدلالة على الجمود والصلابة والبرود وانعدام المرونة، وهي سماتٌ
        جوهرية في officialese. استُعمل هذا المجاز في الخطاب النقدي العربي الحديث
        ترجمةً للمصطلح الفرنسي (langue de bois) ومقابلاً للروسي (деревянный язык)،
        وكلاهما يصف اللغة البيروقراطية الجامدة المصطنعة.

    - lemma: "التَّحَذْلُقُ الْوَظِيفِيُّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «التحذلق» (ادعاء الحذق والفصاحة والتعالم، واستعمال الألفاظ الصعبة
        تعمُّدًا) و«الوظيفي» (في سياق العمل الحكومي المؤسسي). المصطلح الإنجليزي
        pedantry يُترجَم في المورد الحديث بـ«حذلقة؛ تحذلق»، وهو وجهٌ بارز من officialese.

    - lemma: "التَّكَلُّفِيَّةُ"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مُشتَقٌّ من «التكلُّف» (جذر: كلف) على وزن التَّفَعُّلِيَّة. التكلُّفُ في
        اللغة هو الإفراط في التصنُّع والتعسُّر في الأسلوب، وهو السمة المحورية لـofficialese.
        يُحوِّل المصدرُ الصناعيُّ هذه السمةَ إلى مفهوم مجرد مستقل صالح للإسناد.


