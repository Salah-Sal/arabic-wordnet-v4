# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13777088-n — breakage
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تالف» اسم فاعل (صفة) من تَلِفَ بمعنى هالك/فاسد، وليست اسماً يدلّ على كمية الأشياء المكسورة"
      - "اللمّة «كسر» مصدر عام يدلّ على فعل الكسر، لكنه لا يدلّ بخصوصية على مقدار ما تكسّر"
      - "التعريف العربي «الكمية المكسورة أو التالفة» ترجمة حرفية مقبولة لكن تفتقر إلى الدقة المعجمية"
    observations: "المجموعة تدلّ على مفهوم تجاري/لوجستي هو مقدار البضائع التي تتكسّر أثناء النقل أو التخزين. اللمّتان الحاليتان لا تعبّران عن هذا المفهوم الكمّي بدقة؛ «تالف» صفة لا اسم كمية، و«كسر» مصدر فعلي عام. المصطلح الأنسب ينبغي أن يكون على وزن يدلّ على ما تبقّى من الكسر أو مقداره."
  blind_candidates:
    - lemma: "كُسَارَة"
      generation_method: ishtiqaq
      justification: "من الجذر كسر على وزن فُعَالَة الذي يدلّ على بقايا الفعل وما تخلّف عنه (كالنُّحاتة والقُلامة)، فيدلّ على مقدار ما تكسّر"
    - lemma: "اِنْكِسَار"
      generation_method: ishtiqaq
      justification: "مصدر انكسر (انفعال) من الجذر كسر، يدلّ على حدوث الكسر وقد يُستعمل للدلالة على مقداره في السياق الطبي والتجاري"
    - lemma: "تَلَف"
      generation_method: ishtiqaq
      justification: "مصدر تَلِفَ من الجذر تلف، يدلّ على الهلاك والعطب في كل شيء، وقد يُستعمل كاسم كتلة للدلالة على مقدار ما تلف"
    - lemma: "هَدَر"
      generation_method: majaz
      justification: "من الجذر هدر بمعنى سقوط الشيء وإسقاطه (ابن فارس)، فيه إزاحة دلالية من الإهدار إلى الكمية الضائعة بالكسر"

stage2_evidence:
  per_lemma:
    - lemma: "تالف"
      contradicts:
        - text: "«تَلِفَ تَلَفاً: هلك وعطب. فهو تَلِف وتَالِف»"
          source: "المعجم الوسيط (OCR)"
          conflict: "تالف اسم فاعل/صفة بمعنى هالك فاسد، وليس اسماً يدلّ على كمية مكسورة"
      expands:
        - text: "«تلِف الزَّرعُ: فسَد، عطِب. تلِف الشَّخصُ: هلَك وفني»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "يتأكد أن تالف صفة للشيء الفاسد لا اسم كمية"
    - lemma: "كسر"
      confirm:
        - text: "«(1) كَسْر؛ تَكَسُّر (2) الكُسارة: مقدار الأشياء المكسورة (3) حَسْمُ الكَسْر: حَسْمٌ لقاءَ الخسارة الناشئة عن السِّلع المكسورة. تعويض الكَسْر: تعويض عن الأذى اللاحق بالسِّلع المكسورة أثناء النقل»"
          source: "المورد الحديث (2008) — مقابل breakage"
      expands:
        - text: "«الكافُ والسِّينُ والراءُ أصلٌ صحيحٌ يدلُّ على هَشْمِ الشَّيْءِ وهَضْمِهِ. كَسَرْتُ الشَّيْءَ أكْسِرُهُ كَسْراً. والكِسْرَةُ: القِطْعَةُ مِنَ المَكْسُورِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على هشم الشيء، والكِسْرة هي القطعة من المكسور"
        - text: "«كَسَرَ الشىءَ: هَشَمَهُ وفَرَّقَ بين أجزائه»"
          source: "المعجم الوسيط (OCR)"
          addition: "المصدر كَسْر يدلّ على فعل الهشم والتفريق"
    - lemma: "كُسَارَة"
      confirm:
        - text: "«الكُسارة: مقدار الأشياء المكسورة»"
          source: "المورد الحديث (2008) — مقابل breakage"
        - text: "«(الكسارة) الكسار»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«الكُسَارَةُ: الكُسَار»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«الكُسارة: ما تكسَّر من أية مادة صُلْبة [كالجليد ونحوه]»"
          source: "المورد الحديث — مقابل rubble"
          addition: "الكسارة تدلّ أيضاً على ما تكسّر من المواد الصلبة عموماً"
        - text: "«كُسارة زجاج: زجاج مكسر ونظيف، يسحق ويستخدم لإنتاج أدوات زجاجية جديدة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          addition: "استعمال تقني حديث يدلّ على مادة مكسّرة بوصفها كمية"
        - text: "«السُّؤر: كُسارة الزجاج»"
          source: "المورد الحديث — مقابل cullet"
          addition: "كسارة الزجاج مصطلح ثابت في الصناعة"
    - lemma: "اِنْكِسَار"
      contradicts:
        - text: "«انْكِسار = breakage»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي يعني به الكسر العظمي (fracture) لا الكمية المكسورة"
        - text: "«انكسار = refraction»"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989)"
          conflict: "في الفيزياء والرياضيات انكسار = refraction (انكسار الضوء)، مما يولّد اشتراكاً لفظياً مربكاً"
    - lemma: "تَلَف"
      confirm:
        - text: "«(1) مص spoil (2) التَّلَف: شيء يَفْسُد أو يتلف أثناء العمل أو النَّقل. مقدار الخسارة الناشئة عن التَّلف»"
          source: "المورد الحديث (2008) — مقابل spoilage"
      expands:
        - text: "«التَّاءُ وَاللَّامُ وَالْفَاءُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ ذَهَابُ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على ذهاب الشيء وهلاكه، وهو أعمّ من الكسر"
        - text: "«التَّلَفُ: الهَلاكُ والعَطَبُ في كلِّ شيء»"
          source: "كتاب العين للخليل"
          addition: "التلف أعمّ من الكسر فيشمل كل أنواع الهلاك والفساد"
    - lemma: "هَدَر"
      contradicts:
        - text: "«الهاءُ والدالُ والراءُ يدلُّ على سقوطِ شيءٍ وإسقاطِه، وعلى جنسٍ من الصوت. وهَدَرَ السلطانُ دَمَ فلانٍ هَدْراً: أباحه»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدلّ على إسقاط الحقوق (هدر الدم) والصوت، لا على مقدار الأشياء المكسورة"

stage3_analysis:
  per_lemma:
    - lemma: "تالف"
      decision: removed
      decision_reason: "تالف اسم فاعل (صفة مشبّهة) من تَلِفَ بمعنى «هالك، فاسد». المجموعة تدلّ على مفهوم كمّي (مقدار ما تكسّر) لا على صفة الشيء الفاسد. لا يصحّ استعمال صفة بوصفها اسم كمية في هذا السياق."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كَسْر"
      decision: confirmed
      decision_reason: "المورد الحديث يترجم breakage إلى «كَسْر؛ تَكَسُّر» صراحةً. المصدر كَسْر يدلّ على فعل الكسر ونتيجته، ويُستعمل في السياق التجاري (حَسْم الكَسْر، تعويض الكَسْر). يحتاج تصحيح التشكيل من «كسر» إلى «كَسْر»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "كَسْر يدلّ على فعل الكسر ونتيجته المباشرة (المصدر)، ويُستعمل في التعبيرات التجارية كحَسْم الكسر وتعويض الكسر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَسْر"

    - lemma: "كُسَارَة"
      source: stage1
      decision: confirmed
      decision_reason: "المورد الحديث صراحةً: «الكُسارة: مقدار الأشياء المكسورة» وهو المعنى المطابق تماماً للمجموعة. المعجم الوسيط يثبت اللفظة. وزن فُعَالَة يدلّ على بقايا الفعل (كالنُّحاتة والقُلامة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "كُسَارَة تدلّ على مقدار الأشياء المكسورة وبقاياها بوصفها كمية محسوسة، على وزن فُعَالَة الدال على بقايا الفعل"
      actions:
        - command: create_entry
          params:
            lemma: "كُسَارَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اِنْكِسَار"
      source: stage1
      decision: removed
      decision_reason: "انكسار مثقل بالاشتراك اللفظي مع انكسار الضوء (refraction) في الفيزياء. المعجم الطبي يستعمله بمعنى fracture لا بمعنى الكمية المكسورة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَلَف"
      source: stage1
      decision: removed
      decision_reason: "التلف أعمّ من المطلوب؛ يدلّ على الهلاك والعطب في كل شيء (ابن فارس: ذهاب الشيء). المجموعة مخصّصة بالكسر (breakage) لا بالتلف العام (spoilage). إضافته تُضعف دقة المجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "هَدَر"
      source: stage1
      decision: removed
      decision_reason: "الجذر يدلّ على إسقاط الحقوق (هدر الدم) والأصوات (هدير)، لا على مقدار الأشياء المكسورة. الإزاحة الدلالية بعيدة جداً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

