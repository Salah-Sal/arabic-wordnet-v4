# مراجعة المجموعة الترادفية awn4-06518748-n — reminder
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تَذْكِير» هي مصدر (تَفْعِيل) يدلّ على الفعل/العملية لا على الرسالة ذاتها؛ والمجموعة تحتاج اسماً للشيء المُذَكِّر لا لفعل التذكير"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية باستخدام ضمير المخاطب «تساعدك» وهو أسلوب غير معجمي"
      - "المجموعة تحتوي لمّة واحدة فقط؛ المفهوم غني بالمرادفات العربية من جذر ذ ك ر"
    observations: "المفهوم — رسالةٌ تُعين على استرجاع أمرٍ من الذاكرة — مفهومٌ أصيل في الثقافة العربية وله تجذّر قرآني (تذكرة) ومعجمي واسع. الجذر «ذ ك ر» ينتج عدة مشتقات تغطي هذا الحقل الدلالي: تَذْكِرَة (ما تستذكر به الحاجة)، مُذَكِّرَة (رسالة تذكير)، تَذْكِير (فعل التذكير). كلها صالحة للتمثيل مع تفاوت في الزاوية الدلالية."

  blind_candidates:
    - lemma: "تَذْكِرَة"
      generation_method: ishtiqaq
      justification: "من الجذر «ذ ك ر» على وزن تَفْعِلَة، وهو وزن اسم المرة واسم الهيئة؛ ومعناها المعجمي الأصلي «ما تُستذكَر به الحاجة» أي الشيء الذي يُعين على التذكّر، وهو مطابق تماماً لتعريف المجموعة. وردت في القرآن الكريم بمعنى الموعظة والعبرة."
    - lemma: "مُذَكِّرَة"
      generation_method: ishtiqaq
      justification: "من الجذر «ذ ك ر» على وزن مُفَعِّلَة (اسم فاعل مؤنث من ذكَّرَ يُذكِّر)؛ تدلّ على الوثيقة أو الرسالة التي تُذكِّر بأمر ما، وهي مستعملة في العربية المعاصرة بمعنى المذكرة التذكيرية والمفكرة."
    - lemma: "تَنْبِيه"
      generation_method: ishtiqaq
      justification: "من الجذر «ن ب ه» على وزن تَفْعِيل (مصدر نبَّهَ)؛ يدلّ على ما يُلفت الانتباه ويُوقظ الذهن، وقد يُستعمل مجازاً للرسالة التي تُذكِّر بأمر."
    - lemma: "تَذْكَار"
      generation_method: ishtiqaq
      justification: "من الجذر «ذ ك ر» على وزن تَفْعَال؛ يدلّ على ما يُحفظ للتذكّر والاستعادة، وقد يتناسب مع الرسالة التي تحفظ أمراً في الذاكرة."


stage2_evidence:
  per_lemma:
    - lemma: "تَذْكِير"
      confirm:
        - text: "«أسلوب ينتهجه المتكلم للرجوع بالمخاطَب إلى حدث أو تعهد سابق.»"
          source: "مسرد الإعلام والتواصل (ALECSO/ArabTerm)"
        - text: "«(1) المُذكِّر (2) المذكِّرة: رسالة تذكير بشيء.»"
          source: "المورد الحديث (2008) — مدخل reminder"
      contradicts:
        - text: "«التذكير: عند النحاة أن لا يلحق الفعل وما أشبهه علامة التأنيث.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى النحوي (التذكير مقابل التأنيث) لا علاقة له بالتذكّر والاسترجاع"
        - text: "«(في النَّحو العربي): ألا يلحق الفعلَ وما أشبهه علامةُ التأنيث. والتأنيثُ بخلافه»"
          source: "المعجم الكبير"
          conflict: "المعنى ذاته — التذكير النحوي لا الذهني"
      expands:
        - text: "«التذكير: محاولة القوة العقلية لاسترجاع ما فات بالنسيان.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يؤكد أن التذكير في الاصطلاح الكلاسيكي عملية ذهنية (فعل) لا رسالة (شيء)، مما يعني أن اللمّة تدلّ على الحدث لا على الوسيلة"
        - text: "«(1) تذكير؛ حَثّ؛ حضّ (2) لوم؛ عتاب (3) نُصْح؛ تحذير.»"
          source: "المورد الحديث (2008) — مدخل admonition"
          addition: "التذكير قد يتداخل مع الحثّ والنُّصح والتحذير"

    - lemma: "تَذْكِرَة"
      confirm:
        - text: "«ما تستذكر به الحاجة ما يدعو إلى الذكر والعبرة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(التَّذْكِرَة) مَا تستذكر بِهِ الْحَاجة وَمَا يَدْعُو إِلَى الذّكر وَالْعبْرَة وَفِي التَّنْزِيل الْعَزِيز {كلا إِنَّهَا تذكرة فَمن شَاءَ ذكره}»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«ما تُسْتَذْكَرُ به الحاجةُ. وهو من الدَّلالة والأمارة ما يَبْعثُ على الذِّكر والعِبْرة»"
          source: "المعجم الكبير"
        - text: "«التذكرة: ما يتذكر به الشيء، وهو أعم من الدلالة والإمارة، والتذكير الوعظ.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«بطاقة يثبت فيها أجر الركوب في السكك الحديدية وما جرى مجراها (ج) تذاكر (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "المعنى المحدث (بطاقة السفر) أضاف دلالة ثانية لكنه لم يُلغِ الدلالة الأصلية"

    - lemma: "مُذَكِّرَة"
      confirm:
        - text: "«(المذكرة) دفتر صغير يدون فيه ما يراد تذكره»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«دفتر صغيرٌ يدون فيه مايُرادُ تذكُّره»"
          source: "المعجم الكبير"
        - text: "«(1) المُذكِّر (2) المذكِّرة: رسالة تذكير بشيء.»"
          source: "المورد الحديث (2008) — مدخل reminder"
      expands:
        - text: "«بيانٌ مجمل أو مفصل تشرح فيه بعض المسائل كالمذكرة التي تقدم إلى القاضي والمذكرة التفسيرية»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "للمذكرة دلالات أوسع: البيان الرسمي والمذكرة القانونية والمذكرة الدبلوماسية"
        - text: "«وثيقة صادرة عن رئيس إدارة معينة، وهي أنواع منها: مذكرة إخبارية أو إعلامية...»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي"
          addition: "تتوسع الدلالة إلى الوثائق الإدارية والتوجيهية"

    - lemma: "تَنْبِيه"
      contradicts:
        - text: "«إشارة أو رسيلة تنبه المستعمل إلى حالة طارئة أو خطيرة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          conflict: "التنبيه يتعلق بالتحذير من خطر أو حالة طارئة، لا بإعادة أمرٍ إلى الذاكرة"
        - text: "«التنبيه: إعلام ما في ضمير المتكلم للمخاطب.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الاصطلاحي هو الإعلام والإخبار عموماً، لا التذكير باسترجاع منسيّ"
      expands:
        - text: "«التَّنْبِيه: اعلام مَا فِي ضمير الْمُتَكَلّم للمخاطب. وَيُطلق أَيْضا على استحضار مَا سبق وانتظار مَا سَيَأْتِي.»"
          source: "دستور العلماء للأحمدنكري"
          addition: "المعنى الثاني «استحضار ما سبق» قريب من التذكير لكنه ليس مخصصاً بالرسالة"

    - lemma: "تَذْكَار"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "تَذْكِير"
      decision: confirmed
      decision_reason: "المصدر «تذكير» من ذكَّرَ يُذكِّر مستعمل في العربية المعاصرة بمعنى الرسالة التذكيرية (رسالة تذكير، إشعار تذكير). وإن كان المعنى الأصلي يدلّ على الفعل/العملية، فإن الاستعمال الحديث يُجيز إطلاقه على الرسالة ذاتها بالمجاز المرسل (إطلاق المصدر على الناتج). ورد في أرابتيرم بمعنى reminding مع تعريف يدعم الاستخدام التواصلي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على فعل التذكير وعمليته، ويُطلق مجازاً على الرسالة التي تؤدي هذا الفعل. يركّز على الجانب الوظيفي (ما يُذكِّر) لا على الشكل المادي."
      actions: []

    - lemma: "تَذْكِرَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعريفها في المعجم الوسيط والمعجم الكبير والمناوي «ما تُستذكر به الحاجة وما يدعو إلى الذكر والعبرة» مطابقٌ تماماً لتعريف المجموعة. وهي قرآنية الاستعمال {كلا إنها تذكرة}. وإن تعددت دلالاتها الحديثة (بطاقة السفر) فإن المعنى الأصلي لا يزال حيّاً في الفصحى المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الشيء الذي يُستذكر به — اسم آلة/وسيلة — وتركّز على الأثر (ما يدعو إلى الذكر والعبرة). أقرب المرادفات إلى تعريف المجموعة لأنها اسم للوسيلة لا للفعل."
      actions:
        - command: create_entry
          params: {lemma: "تَذْكِرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُذَكِّرَة"
      source: stage1
      decision: confirmed
      decision_reason: "وردت في المورد الحديث صراحةً بتعريف «رسالة تذكير بشيء» مقابل reminder، وفي المعجم الوسيط بمعنى «دفتر صغير يدون فيه ما يراد تذكره». هي اسم فاعل مؤنث يدلّ على الوثيقة أو الرسالة التي تؤدي وظيفة التذكير، وهي مستعملة بكثرة في الإدارة والمراسلات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الرسالة أو الوثيقة المكتوبة التي تُذكِّر بأمر ما. تركّز على الشكل المادي (رسالة/دفتر/بيان) وتُستعمل في السياقات الرسمية والإدارية أكثر من أخواتها."
      actions:
        - command: create_entry
          params: {lemma: "مُذَكِّرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَنْبِيه"
      source: stage1
      decision: removed
      decision_reason: "التنبيه يدلّ في المقام الأول على الإعلام والتحذير من أمر طارئ أو خطير (warning/alert)، لا على إعادة أمرٍ منسيّ إلى الذاكرة. المعنى الاصطلاحي «إعلام ما في ضمير المتكلم للمخاطب» أعمّ من التذكير ولا يختصّ باسترجاع المنسيّ. الفارق الدلالي واضح: التنبيه يلفت الانتباه إلى شيء جديد، والتذكير يسترجع شيئاً سابقاً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَذْكَار"
      source: stage1
      decision: removed
      decision_reason: "التَّذْكار يدلّ على ما يُحتفظ به للذكرى (souvenir/memento) وهو شيء مادي لا رسالة. لا ينتمي إلى جنس «الرسالة» الذي يُحدِّد المجموعة، ولم تُوجد أدلة معجمية تدعم استعماله بمعنى رسالة تذكيرية."
      evidence_assessment:
        case: no_material


