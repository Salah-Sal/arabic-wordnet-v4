# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06294112-n
# usage — الاستعمال اللغوي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «استخدام» عامة جداً ولا تحمل دلالة لغوية تخصيصية بذاتها؛ فهي تعني مطلق الاستعمال في أي مجال"
      - "اللمّة «استعمال لغوي» مركب إضافي وصفي جيد لكنه يفتقر إلى التشكيل"
      - "التعريف العربي ترجمة حرفية من الإنجليزية ويحتاج صياغة معجمية أصيلة"
    observations: >-
      المفهوم المقصود هو الطريقة المعتادة المتعارف عليها في استعمال لغة ما نطقاً أو كتابةً.
      وهو مفهوم لسانيّ مركزيّ له مصطلح ثابت في علم اللسانيات العربي هو «الاستعمال»،
      كما يُقال «العُرْف اللغويّ» و«السليقة» بمعانٍ قريبة لكنها ليست مرادفة تماماً.
      اللمّة «استخدام» بمفردها لا تدلّ تخصيصاً على الاستعمال اللغوي بل هي عامة.
  blind_candidates:
    - lemma: "سَلِيقَة"
      generation_method: majaz
      justification: >-
        السليقة في الأصل الطبيعة والسجيّة، ثم أُطلقت على اللغة التي يسترسل فيها
        المتكلّم على طبيعته، فهي إزاحة دلالية من المعنى العام إلى المعنى اللساني
    - lemma: "اسْتِعْمَال"
      generation_method: ishtiqaq
      justification: >-
        مصدر «استعمل» على وزن استفعال، يدلّ على كيفية توظيف الألفاظ والتراكيب
        في اللغة؛ وهو المصطلح المعتمد في المعاجم اللسانية العربية الحديثة
    - lemma: "عُرْف لُغَوِيّ"
      generation_method: tarkib
      justification: >-
        مركب إضافي وصفي يجمع بين العُرْف بمعنى ما تعارف عليه الناس واعتادوه،
        واللغوي للتخصيص؛ فيؤدي معنى العادة المتّبعة في استعمال اللغة
    - lemma: "أُسْلُوب"
      generation_method: ishtiqaq
      justification: >-
        من الجذر «سلب» على وزن أُفْعُول، يدلّ على الطريقة والمذهب في الكلام،
        ويستعمل في النقد الأدبي واللسانيات بمعنى قريب من الاستعمال اللغوي


stage2_evidence:
  per_lemma:
    - lemma: "اسْتِخْدَام"
      contradicts:
        - text: "«الاستخدام: هو أن يذكر لفظ له معنيان، فيراد به أحدهما، ثم يراد بالضمير الراجع إلى ذلك اللفظ معناه الآخر»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "في المعاجم الكلاسيكية الاستخدام مصطلح بلاغي لا يدلّ على الاستعمال اللغوي العام"
        - text: "«الاستخدام: ذكر لفظ له معنيان يراد به أحدهما وبالضمير العائد لذلك اللفظ معناه الآخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "تأكيد أن الاستخدام مصطلح بلاغي كلاسيكي"
      expands:
        - text: "«application / use»"
          source: "المعجم الموحد لمصطلحات المياه (ARABTERM)"
          addition: "في المعاجم الحديثة يُستعمل استخدام بمعنى عامّ: التطبيق والاستعمال، لكن بدون تخصيص لغوي"

    - lemma: "اسْتِعْمَال لُغَوِيّ"
      confirm:
        - text: "«استعمال لغوي أو لهجي تنفرد به عشيرة لغوية معينة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«استعمال لغوي متخصص، يشمل المصطلحات والتراكيب المستخدمة في حقل من حقول المعرفة العلمية أو التقنية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل لُغَيَّة"

    - lemma: "اسْتِعْمَال"
      confirm:
        - text: "«مجموع القواعد النحوية المثبتة نسبياً والمستخدمة من لدن أكبر عدد ممكن من المتكلمين في لحظة معطاة وفي وسط اجتماعي محدد»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«مجموع القواعد النحوية المثبتة نسبيا والمستخدمة من لدن اكبر عدد ممكن من المتكلمين في لحظة معطاة وفي وسط اجتماعي محدد»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
      expands:
        - text: "«الاستعمال: قيل مرادف العادة وقيل لا، وسيأتي في تعريف الحقيقة اللغوية. وأما الماء المستعمل فعند الفقهاء كل ماء أزيل به حدث»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يبيّن أن الاستعمال في الاصطلاح يُقارب العادة ويُستعمل في سياق نقل اللفظ"
        - text: "«الاستعمال: قيل: هو مرادف للعادة، وقيل: المراد من الاستعمال: نقل اللفظ عن موضعه الأصلي إلى معناه المجازيّ شرعاً، وغلبة استعماله فيه»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "تأكيد الدلالة الاصطلاحية للاستعمال على نقل الألفاظ وتداولها"

    - lemma: "سَلِيقَة"
      confirm:
        - text: "«الطبيعة. يُقال فلان يتكلّم بالسليقة أي ينطق بالكلام صحيحاً من غير تعلّم»"
          source: "المعجم الوسيط"
      expands:
        - text: "«اللغةُ التي يسترسل فيها المتكلّمُ على سجيّته وطبيعته من غير تعمُّدِ إعرابٍ ولا تجنّبِ لَحْن»"
          source: "المعجم الكبير"
          addition: "السليقة لغة الطبع والسجيّة لا العُرْف والعادة، فهي تدلّ على الكلام الفطري لا المتعارف عليه"
        - text: "«من الإنسان: الطبيعةُ والسجيّة»"
          source: "المعجم الكبير"
          addition: "تأكيد أن السليقة طبيعة لا عُرْف"

    - lemma: "عُرْف لُغَوِيّ"
      expands:
        - text: "«عرف (ال…) والعادة — translation_en: usage and custom»"
          source: "مسرد الجغرافيا والتاريخ (ARABTERM)"
          addition: "العُرف مرادف للعادة في السياق العام لكن المركب عُرْف لُغَوِيّ غير مسجّل كوحدة معجمية"

    - lemma: "أُسْلُوب"
      contradicts:
        - text: "«مجموعة من الملامح التعبيرية التي يختارها المتكلّم أو الكاتب من العناصر اللغوية القابلة للتبادل لنقل مقاصده إلى المتلقي»"
          source: "المعجم الكبير"
          conflict: "الأسلوب يعني الطريقة الفردية في التعبير (style) لا الطريقة المعتادة الجماعية في استعمال اللغة (usage)"
      expands:
        - text: "«الطريقةُ الفنّ في الأدب»"
          source: "المعجم الكبير"
          addition: "الأسلوب يتعلّق بالفنّ الأدبي والاختيار الفردي لا بالعُرْف اللغوي الجماعي"


stage3_analysis:
  per_lemma:
    - lemma: "اسْتِخْدَام"
      decision: removed
      decision_reason: >-
        لفظ «استخدام» بمفرده عامّ جداً يعني مطلق التوظيف والتطبيق في أي مجال.
        وفي المعاجم الكلاسيكية هو مصطلح بلاغي (ذكر لفظ له معنيان...).
        لا يوجد دليل معجمي على استعماله بمعنى «الاستعمال اللغوي» المتعارف عليه.
        اللمّة «استعمال» أدقّ وأوثق في هذا السياق اللساني.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اسْتِعْمَال لُغَوِيّ"
      decision: confirmed
      decision_reason: >-
        مركب إضافي وصفي مسجّل في المعجم الموحد لمصطلحات اللسانيات كمكوّن من
        تعريفات مصطلحات لسانية (لهجة خاصة، لغيّة). وهو واضح الدلالة ومتداول
        في الكتابة اللسانية العربية المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        يُخصّص الاستعمال بمجال اللغة تحديداً، فيُستعمل عندما يُراد الإشارة
        إلى طريقة استخدام الألفاظ والتراكيب في سياق لغوي محدد، بخلاف «استعمال»
        المجرّد الذي قد يحتاج سياقاً لتحديد المجال
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِعْمَال لُغَوِيّ"

    - lemma: "اسْتِعْمَال"
      source: stage1
      decision: confirmed
      decision_reason: >-
        المعجم الموحد لمصطلحات اللسانيات يعرّف «استعمال» تعريفاً لسانياً صريحاً
        بأنه «مجموع القواعد النحوية المثبتة نسبياً والمستخدمة من لدن أكبر عدد
        ممكن من المتكلمين». وهو الترجمة المعتمدة لـ usage في السياق اللساني.
        كذلك كشّاف التهانوي والتعريفات الفقهية تؤكدان دلالته على العُرْف والعادة
        في استعمال الألفاظ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يدلّ على الاستعمال اللغوي المتعارف عليه بصورة مجرّدة عامة دون تقييد
        بوصف «لغوي»، وهو أخصّ من «استخدام» لأنه المصطلح اللساني المعتمد،
        وأعمّ من «استعمال لغوي» لأنه لا يحتاج إلى مقيّد في السياق اللساني
      actions:
        - command: create_entry
          params:
            lemma: "اسْتِعْمَال"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "سَلِيقَة"
      source: stage1
      decision: removed
      decision_reason: >-
        السليقة تدلّ على الطبيعة والفطرة في الكلام — أي النطق الطبعي من غير
        تعلّم — وليست الطريقة المعتادة المتعارف عليها في استعمال اللغة.
        الفرق جوهري: السليقة فردية فطرية، والاستعمال جماعي عُرْفي.

    - lemma: "عُرْف لُغَوِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        المركب «عُرْف لُغَوِيّ» غير مسجّل كوحدة معجمية ثابتة في أيّ معجم
        لساني عربي. اختبار السكّ يدلّ على أنه تعبير وصفي حرّ (يمكن إبدال
        «عُرْف» بـ«عادة» أو «تقليد» دون تغيّر المعنى).

    - lemma: "أُسْلُوب"
      source: stage1
      decision: removed
      decision_reason: >-
        الأسلوب يعني الطريقة الفنّية الفردية في التعبير (style) وليس الطريقة
        الجماعية المعتادة في استعمال اللغة (usage). الفرق بينهما فرق بين
        الاختيار الفردي والعُرْف الجماعي.


