stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب ويحتاج إلى صياغة معجمية أدق لتوضيح المقصود بالمواد، وما إذا كانت مادية أو نصوصًا."
      - "المصطلحات الحالية جيدة ومناسبة للمعنى، لكنها تفتقر إلى التشكيل."
    observations: "المصطلح 'يهوديات' مبني على نمط الجمع القياسي للمصادر الصناعية (بإضافة ـيَّات) للإشارة إلى المجموعات أو الدراسات المتعلقة بحقل معين، وهو شائع. أما 'المقتنيات اليهودية' فهو مركب وصفي يفي بالغرض بشكل أكثر تحديداً للأشياء المادية التي يتم اقتناؤها."
  blind_candidates:
    - lemma: "اليَهُودِيَّات"
      generation_method: ishtiqaq
      justification: "جمع باللاحقة (ـيَّات) التي تدل على المجموعات أو الدراسات والمواد المتعلقة بحقل معين (مثل: إسلاميات، إسرائيليات)."
    - lemma: "المُقْتَنَيَات اليَهُودِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يشير مباشرة إلى الأشياء والمواد التي تُقتنى ولها صلة باليهودية."
    - lemma: "الأَشْيَاء اليَهُودِيَّة"
      generation_method: tarkib
      justification: "مركب عام وشامل لكل ما يتعلق باليهود من مواد."
    - lemma: "المَجْمُوعَة اليَهُودِيَّة"
      generation_method: tarkib
      justification: "تعبير يستخدم عادة في سياق المتاحف للإشارة إلى المقتنيات المتعلقة باليهود."

stage2_evidence:
  per_lemma:
    - lemma: "المقتنيات اليهودية"
      confirm:
        - text: "مُقْتَنَيات: ما يتم الحصول عليه من تحف أو أعمال فنية أو أشياء ثمينة."
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
    - lemma: "اليهوديات"
      confirm:
        - text: "(الْيَهُودِيَّة) مِلَّة الْيَهُود"
          source: "المعجم الوسيط"
      expands:
        - text: "اليهودية: ديانة اليهود. Translation: Judaism"
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "المقتنيات اليهودية"
      decision: confirmed
      decision_reason: "مصطلح مركب وصفي يعبر بدقة عن الجانب المادي والملموس من كلمة Judaica كتحف أو مقتنيات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "المُقْتَنَيَات اليَهُودِيَّة"

    - lemma: "اليهوديات"
      decision: confirmed
      decision_reason: "مصطلح مبني على نمط الاشتقاق بلاحقة (ـيَّات) للدلالة على المواد والدراسات المتعلقة بموضوع معين، وهو شائع ومناسب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اليَهُودِيَّات"

    - lemma: "اليَهُودِيَّات"
      source: stage1
      decision: removed
      decision_reason: "موجود بالفعل في المجموعة الترادفية."

    - lemma: "المُقْتَنَيَات اليَهُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: "موجود بالفعل في المجموعة الترادفية."

    - lemma: "الأَشْيَاء اليَهُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح عام جداً وغير مسكوك معجمياً، و'المقتنيات' أبلغ وأدق."

    - lemma: "المَجْمُوعَة اليَهُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر ولا يشكل مصطلحاً مسكوكاً مستقلاً."

