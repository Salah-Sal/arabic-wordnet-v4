stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "عرض الفيديو"
      decision: confirmed
      decision_reason: >
        اللمّة تركيب إضافي معقول للتعبير عن مفهوم «video display» في علوم الحاسوب؛ فـ«عرض»
        موثَّق في المعاجم التقنية بمعنى display وإظهار، و«الفيديو» معرَّب راسخ. لم يُعثر
        على هذا التركيب بالضبط في قاعدة البيانات المعجمية، لكنه متداول في الأدبيات التقنية
        العربية ويستوفي اختبار الوحدة المعجمية الثابتة. يلزم إضافة التشكيل الكامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على العرض بوصفه عملية ظهور وإظهار مقيَّدة بوسيط الفيديو، ويُستعمل للإشارة
        إلى مخرج الحاسوب المرئي من زاوية التنجيز التقني (ما تعرضه الشاشة).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرْضُ الفِيدِيُو"

    # ── مرشح المرحلة ١ — مَخرَجٌ مَرئِيٌّ ──
    - lemma: "مَخْرَجٌ مَرئِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي دليل معجمي يثبّته كوحدة اصطلاحية ثابتة. كذلك يصفّ المفهوم من زاوية
        الخروج والإخراج (output) لا المظهر والتصيير (appearance/rendering) الذي تصفه المجموعة.
        اختبار الاستبدال: يمكن إبدال «مرئي» بـ«سمعي» ويبقى تعبيراً وصفياً مقبولاً → ليس
        مصطلحاً مسكوكاً.

    # ── مرشح المرحلة ١ — مَظهَر الشَّاشَة ──
    - lemma: "مَظْهَر الشَّاشَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي دليل معجمي. التركيب الإضافي «مظهر الشاشة» عبارة وصفية حرة يمكن
        إبدال «الشاشة» فيها بـ«التلفاز» أو «الحاسوب» ويبقى مقبولاً كوصف → لا يجتاز اختبار
        التثبيت المعجمي. كما يحدث التباس مع «شكل الشاشة» أو «واجهتها».

    # ── مرشح المرحلة ١ — إِظهارٌ مَرئِيٌّ ──
    - lemma: "إِظْهَارٌ مَرئِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا التركيب بالضبط. أفادت الأدلة أن معجم المعلوماتية العربي يستعمل
        «إظهار فيديوي» (وصفي) لا «إظهار مرئي» (الذي قد يُلتبس بـ visual display بعموم). كما
        أن «إظهار» يشير إلى عملية الإظهار (الفعل) لا إلى المحتوى أو المظهر الناتج.

    # ── مرشح المرحلة ١ — فِيدِيُو ──
    - lemma: "فِيدِيُو"
      source: stage1
      decision: confirmed
      decision_reason: >
        دليل قوي ومباشر: معجم مصطلحات المعلوماتية (2000) يعرّفه في سياق الحاسوب تحديداً بـ
        «تصيير النص والصور البيانية على المظهار»، وهو ما يطابق تعريف المجموعة تماماً.
        تعريب راسخ يقبل لام التعريف والنسبة والجمع، مستعمَل في معاجم معتمدة متعددة بما فيها
        معجم مختار عمر. يستوفي اختبار السكّ المعجمي لكونه وحدة غير قابلة للتحليل الداخلي
        بإبدال المكوّنات. يأتي كملاذ أخير (تاريب) وهو مُبرَّر هنا بوصفه مصطلحاً ذا صيغة
        عالمية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُشير إلى المكوِّن المرئي بوصفه خاصيةً تقنية أو وسيطاً، بمعنى أشمل يمتد من الإشارة
        التلفزيونية إلى مخرجات الحاسوب؛ ويُستعمل صفةً أيضاً في تركيبات كـ«إظهار فيديوي»
        و«بطاقة فيديوية».
      actions:
        - command: create_entry
          params:
            lemma: "فِيدِيُو"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06288645-n"


