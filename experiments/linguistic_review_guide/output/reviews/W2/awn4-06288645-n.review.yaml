            «الْعَيْنُ وَالرَّاءُ وَالضَّادُ بِنَاءٌ تَكْثُرُ فُرُوعُهُ، وَهِيَ مَعَ
            كَثْرَتِهَا تَرْجِعُ إِلَى أَصْلٍ وَاحِدٍ، وَهُوَ الْعَرْضُ الَّذِي
            يُخَالِفُ الطُّولَ. فَالْعَرْضُ: خِلَافُ الطُّولِ. وَمِنَ الْبَابِ: عَرَضَ
