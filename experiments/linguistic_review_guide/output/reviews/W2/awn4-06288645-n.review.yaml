stage2_evidence:
  per_lemma:
    - lemma: "عرض الفيديو"
      confirm:
        - text: >
            «مَعالَجَةُ البيانات وإظهارُها على شاشةٍ تلفزية.»
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
        - text: >
            «العرضُ البياني (الصوري) لمخرجات جهاز أو نظام، على شاشة الرادار مثلاً.
            تُستعمَل شاشةُ الأشعة المهبطية لعرض مخرجات أجهزة الاستشعار الإلكترونية.»
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000) — ARABTERM"
        - text: >
            «عملية إسقاط صور الفِلم على الشاشة.»
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
      expands:
        - text: >
            «عَرْضٌ؛ إظهار» (كترجمة لـ display في سياق المعلومات والتواصل).
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
          addition: >
            يُثبت استعمال «عرض» مرادفاً لـ «display» في الأدبيات التقنية العربية المعياريّة،
            مما يدعم التركيب الإضافي «عرض الفيديو» لأداء هذا المعنى.

    - lemma: "مخرج مرئي"
      evidence_status: "no_material_found"

    - lemma: "مظهر الشاشة"
      evidence_status: "no_material_found"

    - lemma: "إظهار مرئي"
      confirm:
        - text: >
            «بطاقة (لوحة) إظهار فيديوي(ـة): تَنجيزُ implementation موائمةٍ فيديويةٍ باستخدام
            بطاقةِ توسيع، لا بطاقة نظام الحاسوب الرئيسية.»
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
        - text: >
            «صفحة إظهار فيديوي: قطعةٌ من صِوانِ buffer فيديو الحاسوب تحتفظ بصورةِ شاشةٍ
            كاملة. إذا كان الصوانُ يَستوعبُ أكثرَ من صفحة واحدة أو إطار frame، تصبح سرعةُ
            تحديث الشاشة أكبر.»
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
      expands:
        - text: >
            «مظهار: تجهيزةُ الإظهار لخرج الحاسوب، وهي عموماً مبنيةٌ على صِمام أشعة
            مهبطية للإظهار الفيديوي. أما في الحواسيب الشخصية الخفيفة والمحمولة، فالمظهارُ
            مسطحٌ ويَعتمد عادةً السائلَ الكريستالي أو غازَ بلاسما.»
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
          addition: >
            تكشف هذه المواد أن «إظهار فيديوي» (وصفي) هو النمط المستعمَل في المعجمية التقنية
            العربية للتعبير عن video display، لا «إظهار مرئي» (المرشح). كذلك يُثبت «مظهار»
            كمصطلح أحادي راسخ لأداة العرض.

    - lemma: "فيديو"
      confirm:
        - text: >
            «صفةٌ للمكوِّن المرئي للإشارة التلفزِيّة. وفي الحواسيب: تدلّ على تصيير النص
            والصور البيانية على المظهار.»
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
        - text: >
            «فيديو [مفرد]: ج فيديوهات: جهاز يسجّل المناسبات والأحداث صوتًا وصورة على
            أشرطة ممغنطة، ويقوم بعرض ما سُجِّل على هذه الأشرطة تلفزيونيًّا أو على شاشة
            عرض سينمائيّة.»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر — Hawramani"
      expands:
        - text: >
            «مرئيّ (ال..)» — سلسلة من صور متسلسلة ضمن إطار تم إنشاؤها بواسطة تسجيل
            الوقت الحقيقي لأحداث معينة. وقد يشتمل على صوت وقد لا يشتمل عليه.
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
          addition: >
            يُثبت استعمال «المرئي» بالأداة كمصطلح مستقل يوازي كلمة video في بعض المعاجم
            التقنية، وإن كان هذا الاستعمال أقل شيوعاً من «فيديو» المعرَّب.


