# مراجعة المجموعة الترادفية AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-06288645-n | ILI: i69501 | POS: n
# ═══════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عرض الفيديو» تفتقر إلى التشكيل الكامل في قاعدة البيانات"
      - "التعريف العربي الحالي يستعمل قوساً للمجال (علوم الحاسوب) كمقدمة لا تُعدّ أسلوباً معجمياً معياريًا"
      - "الاعتماد على المقطع الدخيل «فيديو» دون تقديم بديل عربي أو التحقق من التثبيت المعجمي"
      - "المجموعة تحتوي لمّة وحيدة فقط؛ ومن المستحسن إثراؤها بمرادفات أو بدائل تقنية راسخة"
    observations: >
      المجموعة تمثّل مفهوم «الفيديو» في سياق الحوسبة، أي المكوِّن المرئي لمخرجات الحاسوب
      المتمثّل في تصيير النصوص والرسوم على شاشة العرض. وهو مفهوم تقني حديث يصعب التعبير عنه
      بلفظ عربي صميم مفرد. اللمّة الحالية «عرض الفيديو» تركيبٌ إضافي يُعبّر عن هذا المعنى،
      والجذر ع-ر-ض يدلّ في أصله على الإظهار والبروز والعرض وهو ملائم دلالياً. الجنس القريب هو
      «اتصال مرئي» وهو ما تؤكده المجموعة المباشرة الأعلى رتبة. اللمّة الإنجليزية في OEWN هي
      «video» مفردةً لا «video display»، مما يشير إلى أن المفهوم أشمل من مجرد «شاشة العرض».

  blind_candidates:
    - lemma: "مَخْرَجٌ مَرئِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من مَخرَج (اشتقاق على وزن مَفعَل من خرج) + مَرئِيّ (اشتقاق من رأى). يصف
        المخرجَ البصري للحاسوب على الشاشة. غير أنه ينصبّ على فكرة «الخروج والإخراج» أكثر من
        «المظهر والتصيير».

    - lemma: "مَظْهَر الشَّاشَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من مَظهَر (اشتقاق على وزن مَفعَل من ظهر) + الشاشة. يُعبّر عن «ما يظهر
        على الشاشة» وهو ترجمة مباشرة لـ «appearance on the display». إلا أنه قد يقع في دائرة
        العبارات الوصفية الحرة غير الثابتة كوحدة معجمية.

    - lemma: "إِظْهَارٌ مَرئِيٌّ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن إِفعال من الجذر ظ-ه-ر بمعنى الإظهار والإبراز، مقيَّد بالوصف «مرئيّ».
        يُشير إلى عملية تصيير المحتوى المرئي وإبرازه على الشاشة. يحاكي النمط الذي استعمله
        معجم المعلوماتية في مصطلحات كـ«إظهار فيديوي» و«صفحة إظهار فيديوي».

    - lemma: "فِيدِيُو"
      generation_method: taarib
      justification: >
        تعريب للمصطلح الدولي «video»، وهو ملاذ أخير حين يكون المصطلح ذا صيغة عالمية راسخة.
        يقبل لام التعريف (الفيديو) والنسبة (فيديوي) والجمع (فيديوهات). وارد في معاجم عربية
        متعددة ومستعمل على نطاق واسع في الأدبيات التقنية العربية.


