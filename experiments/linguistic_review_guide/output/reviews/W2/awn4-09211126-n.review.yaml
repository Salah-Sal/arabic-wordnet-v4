    - lemma: "إِضَافَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الإضافة: شيء مُضاف.» — المورد الحديث (2008)"
      justification: "الإضافة قد تُطلق على الشيء المُضاف نفسه وليس عملية الضم فقط، وهو يتطابق مع التعريف."
    - lemma: "زَائِدَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«زائدة» ترجمة لـ appendage — المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      justification: "الزائدة هي الجزء المضاف إلى الأصل والذي يمكن الاستغناء عنه، وهو يطابق معنى الشيء الثانوي المُضاف."
  knowledge_candidates:
    - lemma: "تَكْمِلَة"
      justification: "ما يُكمّل به الشيء ويكون مضافاً إليه، كمال للشيء وليس من أجزائه الأساسية. (اشتقاق)"

