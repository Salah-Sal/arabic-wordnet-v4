step0_evidence:
  per_lemma:
    - lemma: "تابع"
      confirm:
        - text: "«(التَّابِع) التَّالِي وَالْخَادِم وَمَا يتبع غَيره»"
          source: "المعجم الوسيط"
      expands:
        - text: "«أيُّ تجهيزةٍ (ومنها الحاسوب) يُسيطَر عليها من حاسوب آخر»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "استعمال تقني للتابع في أنظمة الحواسيب والاتصالات كمرادف لـ (slave)"
    - lemma: "ملحق"
      confirm:
        - text: "«ما يضاف إلى موضوع رئيس كجزء مُكمّل وإضافي، كملحقات ملف وكتاب»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«موظف يعين فِي سفارة الدولة للْقِيَام بِعَمَل خَاص كالملحق العسكري»"
          source: "المعجم الوسيط"
          addition: "يُطلق اصطلاحاً على الموظف الدبلوماسي المُضاف إلى هيئة السفارة"
        - text: "«وثيقة تلحق مع رسالة إلكترونية»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
          addition: "مرفق الرسالة الإلكترونية"

step05_lemma_generation:
