# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06264501-n (heliogram)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «رسالة شمسية» مركب وصفي لا يرد في أيّ معجم عربي بوصفه وحدة معجمية ثابتة"
      - "التعريف العربي ترجمة حرفية شبه كاملة للتعريف الإنجليزي، ولا يذكر آلية الإرسال (انعكاس أشعة الشمس على مرآة)"
      - "المفهوم تقنيّ عسكري قديم (إشارات تلغرافية بالمرآة الشمسية) لا يُستعمل اليوم عملياً"
    observations: "المجموعة تصف الرسالة (heliogram) لا الجهاز (heliograph). المورد الحديث يذكر «المِشماس» و«المُبْرِقة الشمسية» اسمَيْن لجهاز الإرسال، ويذكر الفعل «يُمَشمِس» أي يُبرق بالمِشماس. لكنه لا يسجّل اسماً مستقلاً للرسالة ذاتها. التركيب «رسالة شمسية» تركيب وصفي شفّاف قابل لإبدال مكوّنيه (رسالة ↔ برقية) فلا يكاد يبلغ رتبة المصطلح المسكوك، لكنه الخيار الأقرب في غياب مصطلح مفرد."
  blind_candidates:
    - lemma: "بَرْقِيَّة شَمْسِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «برقية» (رسالة تلغرافية) و«شمسية» (نسبة إلى الشمس). الجهاز يُرسل إشارات تلغرافية بأشعة الشمس، فالرسالة المرسَلة برقية شمسية. أدقّ من «رسالة شمسية» لأنه يحدّد طبيعة الرسالة التلغرافية."
    - lemma: "مُشَمَّسَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول من «شَمَّسَ» على وزن مُفَعَّلَة، بمعنى ما أُرسل بوساطة الشمس. محاولة لاشتقاق اسم مفرد بدل المركب."
    - lemma: "لَمْعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «لَمْع» (البريق والإشارة بالضوء)، إذ يُرسل المِشماس الرسالة بلمعات ضوئية متقطعة."
    - lemma: "هِلْيُوغْرَام"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي heliogram. يقبل لام التعريف (الهِلْيُوغْرَام) والجمع السالم (هِلْيُوغْرَامَات)، لكنه ملاذ أخير لوجود بدائل عربية."


stage2_evidence:
  per_lemma:
    - lemma: "رِسَالَة شَمْسِيَّة"
      expands:
        - text: "«(2) المِشماس؛ المُبْرِقة الشمسية: أداة لإرسال الإشارات التلغرافية، بواسطة أشعة الشمس منعكسةً على مرآة»"
          source: "المورد الحديث (2008)"
          addition: "يذكر «المُبْرِقة الشمسية» اسماً للجهاز لا للرسالة، لكنه يؤكد وجود حقل دلالي عربي لمنظومة الإرسال الشمسي"
        - text: "«(الرسَالَة) ما يُرْسَل والخطاب وكتاب يشتمل على قليل من المسائل تكون في موضوع واحد»"
          source: "المعجم الوسيط (هوراماني)"
          addition: "الرسالة بمعناها العام تشمل أيّ شيء يُرسَل، فتصلح جنساً قريباً"
        - text: "«(الشمسية) نسبة إلى الشمس ومظلة تحمل في اليد تتقى بها الشمس»"
          source: "المعجم الوسيط (هوراماني)"
          addition: "«شمسية» مسجّلة صفةً منسوبة إلى الشمس"

    - lemma: "بَرْقِيَّة شَمْسِيَّة"
      expands:
        - text: "«(البرقية) رسالة ترسل من مكان إلى آخر بوساطة جهاز التلغراف (مج)»"
          source: "المعجم الوسيط"
          addition: "البرقية مصطلح مسكوك للرسالة التلغرافية، والمِشماس يُرسل إشارات تلغرافية"
        - text: "«(2) المِشماس؛ المُبْرِقة الشمسية: أداة لإرسال الإشارات التلغرافية، بواسطة أشعة الشمس منعكسةً على مرآة»"
          source: "المورد الحديث (2008)"
          addition: "المورد يصف الجهاز بأنه يُرسل إشارات تلغرافية، ما يسوّغ تسمية رسالته «برقية»"
      contradicts:
        - text: "«(البرقية) رسالة ترسل من مكان إلى آخر بوساطة جهاز التلغراف»"
          source: "المعجم الوسيط"
          conflict: "البرقية مرتبطة حصرياً بجهاز التلغراف الكهربائي في الاستعمال المعجمي، لا بالمِشماس"

    - lemma: "مُشَمَّسَة"
      evidence_status: "no_material_found"

    - lemma: "لَمْعِيَّة"
      evidence_status: "no_material_found"

    - lemma: "هِلْيُوغْرَام"
      expands:
        - text: "«(1) الهِلْيوغراف: تلسكوب مُعَدّ لتصوير الشمس (2) المِشماس؛ المُبْرِقة الشمسية: أداة لإرسال الإشارات التلغرافية»"
          source: "المورد الحديث (2008)"
          addition: "المورد يسجّل «هِلْيوغراف» للجهاز لكن لا يسجّل «هِلْيُوغْرَام» للرسالة"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "رِسَالَة شَمْسِيَّة"
      decision: confirmed
      decision_reason: "مركب وصفي شفّاف يصف المفهوم بدقة: رسالة + شمسية (منقولة بأشعة الشمس). رغم عدم تسجيله وحدةً معجمية ثابتة في المعاجم، فإنه التعبير العربي الأنسب لمفهوم heliogram نظراً لوجود «المُبْرِقة الشمسية» اسماً للجهاز في المورد الحديث ممّا يؤكد حيوية التركيب «شمسية» في هذا الحقل. المركب مقبول لأنه الخيار الوحيد القابل للتداول."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "اللمّة الوحيدة في المجموعة؛ تصف الرسالة بوصفها خطاباً عامّاً منقولاً بالشمس دون تخصيص بالطابع التلغرافي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِسَالَة شَمْسِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بَرْقِيَّة شَمْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ المركب أدقّ من «رسالة شمسية» في وصف الطبيعة التلغرافية للإشارة، فإنه يفشل في اختبار السكّ: يمكن إبدال «برقية» بـ«رسالة» والمعنى يبقى صالحاً كوصف. فضلاً عن ذلك فإن «البرقية» مرتبطة معجمياً بجهاز التلغراف الكهربائي، واستعمالها مع المِشماس الشمسي قد يُحدث لبساً."
      evidence_assessment:
        case: mixed

    - lemma: "مُشَمَّسَة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية، والاشتقاق غير شفّاف: «مُشَمَّسَة» تدلّ في العربية على ما عُرِّض للشمس (كاللبن المُشمَّس)، لا على رسالة مُرسَلة بالشمس."
      evidence_assessment:
        case: no_material

    - lemma: "لَمْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية. المصدر الصناعي «لَمْعِيَّة» مبهم الدلالة، يمكن أن يعني صفة اللمعان لا الرسالة المُرسلة باللمعات."
      evidence_assessment:
        case: no_material

    - lemma: "هِلْيُوغْرَام"
      source: stage1
      decision: removed
      decision_reason: "تعريب لم يُسجَّل في أيّ معجم عربي. المورد الحديث يسجّل «هِلْيوغراف» للجهاز لكن لا يذكر «هِلْيُوغْرَام» للرسالة. وجود البديل العربي «رسالة شمسية» يُغني عن الاقتراض."
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "رسالة ترسل عن طريق أشعة الشمس"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية مبتسرة لا تذكر آلية الإرسال (انعكاس أشعة الشمس على مرآة = المِشماس) ولا طبيعة الرسالة التلغرافية. يحتاج إلى إعادة صياغة بأسلوب المعجم الوسيط مع ذكر الجنس القريب والفصل النوعي."
    authored:
      - type: terminological
        text: "رسالةٌ تلغرافيّةٌ تُبَثُّ بوساطة المِشماس، وهو جهاز يعكس أشعّة الشمس على مرآة متحرّكة لتوليد وَمَضاتٍ ضوئيّة مُشَفَّرة تُقرأ من بُعد."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "رسالةٌ تُنقَل عن بُعدٍ باستعمال جهاز المِشماس (الهِلْيوغراف)، الذي يوجّه أشعّةَ الشمسِ المنعكسةَ على مرآةٍ في ومَضاتٍ قصيرة وطويلة وَفْقَ شَفرة مورس أو ما شابَهَها، وقد شاع استعمالُهُ في الاتّصالات العسكريّة في القرن التاسع عشر."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
