stage1_review:
  assessment:
    concerns:
      - "اللمة 'داعية سلام' مركب إضافي ولكنه مسكوك ومستعمل بكثرة في هذا السياق."
      - "التعريف الحالي دقيق ولكنه يبدو كترجمة حرفية، ويمكن صياغته بأسلوب معجمي عربي رصين يبدأ بـ (مَنْ...)."
    observations: "المفهوم يعبر عن نزعة سلمية وفلسفة ترفض العنف. اللمتان الموجودتان تعبران بدقة عن المفهوم؛ فـ(مسالم) تشير إلى الطبع والمبدأ، و(داعية سلام) تشير إلى الجانب الحركي والنشط في الدعوة للسلم."
  blind_candidates:
    - lemma: "مُسَالِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (سالم) أي جنح إلى السلم وصالَح."
    - lemma: "سِلْمِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى (السِّلْم) وهو ترك الحرب والنزاع."
    - lemma: "نَابِذُ العُنْفِ"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يترجم حرفيا من يرفض العنف."
    - lemma: "دَاعِيَةُ سَلَامٍ"
      generation_method: tarkib
      justification: "مركب إضافي شائع الاستعمال للإشارة لمن يدعو لنبذ الحروب."

stage2_evidence:
  per_lemma:
    - lemma: "مُسَالِم"
      confirm:
        - text: "مُسَالم: من (س ل م) الذي يعيش في سلام."
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "مُسالِم: a pacific disposition"
          source: "المورد الحديث"
    - lemma: "دَاعِيَة سَلَام"
      evidence_status: "no_material_found"
    - lemma: "سِلْمِيّ"
      confirm:
        - text: "سِلْميّ: pacific settlement."
          source: "المورد الحديث"
    - lemma: "نَابِذُ العُنْفِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُسَالِم"
      decision: confirmed
      decision_reason: "كلمة فصيحة ومستعملة وتدل بدقة على الشخص الذي ينبذ العنف ويجنح إلى السلم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance: "تدل على الطبع السلمي والموقف المبدئي الرافض للنزاع والعنف."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسَالِم"

    - lemma: "دَاعِيَة سَلَام"
      decision: confirmed
      decision_reason: "مركب إضافي مسكوك وشائع جدا في الاستعمال المعاصر للإشارة للمسالم الناشط في الدعوة للسلم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "تدل على النشاط العملي والدعوة الإيجابية لنبذ العنف، مقارنة بـ(مسالم) التي قد تقتصر على الطبع الشخصي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَاعِيَةُ سَلَامٍ"

    - lemma: "سِلْمِيّ"
      source: stage1
      decision: removed
      decision_reason: "تُستخدم غالباً كصفة للأفعال أو الوسائل (مثل: حل سلمي، نضال سلمي) أكثر من استخدامها كاسم ذات للدلالة على الشخص نفسه، فـ(مسالم) تفي بالغرض بشكل أدق."
      evidence_assessment:
        case: confirm_only

    - lemma: "نَابِذُ العُنْفِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي غير مسكوك كمركب معجمي ثابت."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "شخص يعارض العنف كوسيلة لتسوية النزاعات"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يشبه الترجمة الحرفية، ويمكن تحسينه ليناسب أسلوب المعاجم العربية بتبديل كلمة (شخص) بـ (مَنْ)."
    authored:
      - type: terminological
        text: "مَنْ يُعارِض استعمال العُنف في تسوية النزاعات ويَميلُ إلى السلمِ والمُصالحةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ يُعارِض استعمال العُنف في تسوية النزاعات ويَميلُ إلى السلمِ والمُصالحةِ."

  examples:
    per_lemma:
      - lemma: "مُسَالِم"
        examples:
          - text: "عُرفَ غاندي بأنّهُ مُسَالِمٌ يرفُضُ العنفَ بكافّةِ أشكالِهِ."
            type: usage
      - lemma: "دَاعِيَةُ سَلَامٍ"
        examples:
          - text: "كَرَّمَتِ المُنظَّمَةُ الدَّوليَّةُ كلَّ دَاعِيَةِ سَلَامٍ ساهَمَ في إيقافِ الحَرْبِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "عُرفَ غاندي بأنّهُ مُسَالِمٌ يرفُضُ العنفَ بكافّةِ أشكالِهِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كَرَّمَتِ المُنظَّمَةُ الدَّوليَّةُ كلَّ دَاعِيَةِ سَلَامٍ ساهَمَ في إيقافِ الحَرْبِ."

