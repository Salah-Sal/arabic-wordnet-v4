      sense_id: "{auto}"
      nuance: "يركز على الدور السببي الفاعل في وقوع النتيجة، وغالباً ما يُستخدم في السياقات الفنية والقانونية."
      mwe: false
    - lemma: "تَوْلِيدٌ"
      sense_id: "{auto}"
      nuance: "يركز على النتيجة الحاصلة عن فعل أو عملية ما، كحصول فعل بتوسط فعل آخر."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حدث","maqayis":"«الْحَاءُ وَالدَّالُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ كَوْنُ الشَّيْءِ لَمْ يَكُنْ.»"}'
    - command: set_metadata
      params:
