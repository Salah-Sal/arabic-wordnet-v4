        value: '{"root":"سبب","maqayis":"«وَأَمَّا الْحَبْلُ فَالسَّبَبُ... يَدُلُّ عَلَى طُولٍ وَامْتِدَادٍ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ولد","maqayis":"«الْوَاوُ وَاللَّامُ وَالدَّالُ: أَصْلٌ صَحِيحٌ... وَتَوَلَّدَ الشَّيْءُ عَنِ الشَّيْءِ: حَصَلَ عَنْهُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
