# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-05203488-n  |  ILI: i64277  |  POS: n
# hydrophobicity — خاصية كون الشيء طارداً للماء
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «هيدروفوبيا» تُعرِّب المصطلح الإنجليزي «hydrophobia» وهو يشير إلى المرض (داء الكلب / رهاب الماء)، لا إلى الخاصية الكيميائية «hydrophobicity» — خلطٌ مفهومي خطير يستوجب الحذف"
      - "لمّة «كراهية الماء» غير مُشكَّلة، والصحيح «كَرَاهِيَةُ الْمَاءِ» (بفتح الكاف لا ضمّها)"
      - "الشكل الموثَّق معجمياً في قواعد البيانات العربية للمصطلح الدقيق هو «النُّفُورُ مِنَ الْمَاءِ» (أغروفوك) وهو غائب"
      - "التعريف الحالي فيه تكرار: «طارداً للماء» ثم «يميل لصد وعدم امتصاص الماء» يفيدان معنىً واحداً"
    observations: >
      تتناول هذه المجموعة الخاصية الفيزيوكيميائية المعروفة بـ«hydrophobicity»، أي نفور بعض المواد من
      الماء وعدم تفاعلها معه، وهي خاصية مختلفة كلياً عن «hydrophobia» التي هي إما رهاب نفسي أو عَرَض
      من أعراض داء الكلب. وجود «هيدروفوبيا» في اللمّات يُفيد بأن مُعِدَّ المجموعة خلط المفهومَين.
      في مقابل ذلك، «كراهية الماء» مقبول بوصفه مُركَّباً إضافياً يستعير دلالة الكراهية للتعبير عن
      النفور، وهو قريب من صياغة المعاجم الطبية («كاره الماء»). يغلب على المصطلحات المُوحَّدة في
      المعاجم التقنية العربية استخدام: «نفور الماء / النفور من الماء» (أغروفوك)، و«طارد للماء» /
      «رافض للماء» (صفة).

  blind_candidates:
    - lemma: "نُفَارُ الْمَاءِ"
      generation_method: tarkib
      justification: >
        مُركَّب إضافي من «نُفَار» (مصدر نَفَرَ، على وزن فُعَال) و«الماء». جذر «ن ف ر» يدل على
        التجافي والتباعد كما في المعجمية العربية، وهو أدق في وصف الخاصية الفيزيائية من الكراهية.
        اختبار السكّ: التعبير وحدة معجمية مستقلة (نظير: رهاب الماء، كراهية الماء).

    - lemma: "الطَّرَّادِيَّةُ الْمَائِيَّةُ"
      generation_method: tarkib
      justification: >
        مُركَّب وصفي: «الطَّرَّادِيَّة» مصدر صناعي من «طَرَدَ» (ط ر د = إبعاد) على وزن فَعَّالِيَّة
        للدلالة على الخاصية، مع النسبة «المائية». يُعبِّر بدقة عن مفهوم «water-repellent property».

    - lemma: "اسْتِنْكَافُ الْمَاءِ"
      generation_method: tarkib
      justification: >
        مُركَّب إضافي من «استنكاف» (استنكف: أبى وامتنع من الشيء أنفةً) و«الماء». يُعبِّر عن رفض
        الشيء للماء وإبائه امتصاصَه، بأسلوب عربي فصيح راقٍ.

    - lemma: "مُنَافَرَةُ الْمَاءِ"
      generation_method: tarkib
      justification: >
        مُركَّب إضافي من «مُنَافَرَة» (تنافر: تدافع وتباعد) و«الماء». التنافر يُعبِّر عن عدم الانسجام
        بين الجزيئات ورفضها التقارب، وهو قريب من الوصف الجزيئي لظاهرة نفور الماء.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت: ٦ استعلامات
#   ١. مطابقة دفعية لجميع اللمّات والمرشحات (headword_norm IN)
#   ٢. إثراء بالمعرّف (definitions + examples) لأبرز entry_ids
#   ٣. الجسر الإنجليزي (hydrophobicity / hydrophobic / water-repellent)
#   ٤. FTS بالكلمات المفتاحية (طارد، طرد الماء، نفور)
#   ٥. التحقق من المرشحين (نفور الماء، هيدروفوبيا، إلخ)
#   ٦. مقاييس اللغة لجذور: نفر، كره، طرد، موه
stage2_evidence:
  per_lemma:

    - lemma: "كراهية الماء"
      expands:
        - text: "«1- مكلوب. 2- كاره الماء — وصف للنافر من الماء، كما في بعض الغرويات التي لا تمتص الماء أو لا تذوب فيه»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "يثبت أن «كاره الماء» مصطلح طبي معتمد للدلالة على الخاصية الفيزيائية لا المرض وحده"
        - text: "«وجود تنافر قوي مع المياه»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — entry: كاره للماء / hydrophobic"
          addition: "تعريف معجمي للخاصية يدعم جوهر المعنى المطلوب"
        - text: "«صادّ أو مقاوم للماء»"
          source: "مسرد صناعة النسيج، المنظمة العربية للتربية والثقافة والعلوم — entry: طارد للماء / hydrophobic"
          addition: "يُرادف مفهوم الطرد الوارد في التعريف الحالي"
        - text: "«خواص المواد غير القطبية في الغالب، والتي ليس لها تأثير مُتبادل مع الماء، وبالتالي لا يمكن مزجها أو أنها تجعل الماء يتخذ شكل قطرات على السطح الخارجيّ لها. مثال: الكثير من الشحوم، والكحوليات، والتفلون»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — entry: رافض للماء / hydrophobic"
          addition: "تعريف تفصيلي موسوعي يصف الخاصية المقصودة بدقة عالية"
        - text: "«امتلأ بالكراهِيَة تجاه الأعداء [فصيحة] — امتلأ بالكراهِيَّة تجاه الأعداء [فصيحة]. أوردت المعاجم المصدر «كراهية» بتخفيف الياء، كما في اللسان والمصباح، وبتشديدها أيضاً، كما في التاج»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يُثبت أن الصيغتين «كَرَاهِيَة» (بتخفيف) و«كَرَاهِيَّة» (بتشديد) كلتاهما فصيحتان، والتخفيف أقدم"

    - lemma: "هيدروفوبيا"
      contradicts:
        - text: "«رهاب الماء: الخوف المَرضي من الماء / داء الكَلَب»"
          source: "المورد الحديث (2008) — entry: hydrophobia"
          conflict: "هيدروفوبيا تُقابل hydrophobia = المرض، لا hydrophobicity = الخاصية الكيميائية. المجموعة تصف الخاصية الفيزيائية حصراً"
        - text: "«الكَلَب - رُهاب (رهبة) الماء — hydrophobia = rabies»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: "يؤكد أن hydrophobia = داء الكلب أو رهاب الماء المرضي، وليس الخاصية الكيميائية"
        - text: "«رُهابُ الماء (؟ داءُ الكَلَب)»"
          source: "المعجم الطبي الموحد (2009) — entry: hydrophobia"
          conflict: "ثلاثة معاجم طبية موحدة تُجمع على أن hydrophobia = المرض / داء الكلب، لا الخاصية"

    - lemma: "نُفَارُ الْمَاءِ"
      confirm:
        - text: "«النفور من الماء — hydrophobicity»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "—"
      expands:
        - text: "«خواص المواد غير القطبية في الغالب، والتي ليس لها تأثير مُتبادل مع الماء، وبالتالي لا يمكن مزجها أو أنها تجعل الماء يتخذ شكل قطرات على السطح الخارجيّ لها»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — entry: رافض للماء"
          addition: "يُعرِّف الخاصية ذاتها ويصف مواد نموذجية"
        - text: "«نَفَارُ الدابَّة: حِرانُها وشُرودها. النُّونُ وَالْفَاءُ وَالرَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَجَافٍ وَتَبَاعُدٍ»"
          source: "مقاييس اللغة لابن فارس (جذر: نفر)"
          addition: "يُثبت أن جذر «ن ف ر» يدل على التجافي والتباعد، وهو المعنى المقصود في وصف نفور الماء"

    - lemma: "الطَّرَّادِيَّةُ الْمَائِيَّةُ"
      evidence_status: "no_material_found"

    - lemma: "اسْتِنْكَافُ الْمَاءِ"
      evidence_status: "no_material_found"

    - lemma: "مُنَافَرَةُ الْمَاءِ"
      contradicts:
        - text: "«الْمُنَافَرَةُ: الْمُحَاكَمَةُ إِلَى الْقَاضِي بَيْنَ اثْنَيْنِ، قَالُوا: مَعْنَاهُ أَنَّ الْمُبْتَغَى تَفْضِيلُ نَفَرٍ عَلَى نَفَرٍ»"
          source: "مقاييس اللغة لابن فارس (جذر: نفر)"
          conflict: "المنافرة في الاصطلاح العربي الكلاسيكي تعني المحاكمة والتحاكم لا التنافر الفيزيائي، مما يُوجب الرفض"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "كراهية الماء"
      decision: confirmed
      decision_reason: >
        المُركَّب الإضافي «كراهية الماء» مقبول دلالياً ومُوثَّق بصياغات مجاورة («كاره الماء»، «كاره للماء»)
        في معاجم طبية وكيميائية معتمدة. الجذر «كره» يدل على خلاف الرضا وهو توظيف مجازي وارد في سياق
        التعبير عن نبذ المادة للماء. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الجانب المجازي الوجداني في توصيف الخاصية: يستعير من الحياة النفسية مفهوم الكراهية
        للتعبير عن النبذ. أثقل وطأةً من «نفور الماء» في الإيحاء بالتنافر الشديد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَرَاهِيَةُ الْمَاءِ"

    - lemma: "هيدروفوبيا"
      decision: removed
      decision_reason: >
        «هيدروفوبيا» تعريبٌ لـ«hydrophobia» = المرض (داء الكلب / رهاب الماء النفسي)، لا لـ«hydrophobicity»
        = الخاصية الفيزيوكيميائية. ثلاثة معاجم طبية موحدة مستقلة تُجمع على هذا التمييز. إدراج هذه
        اللمّة في مجموعة الخاصية الكيميائية خلطٌ مفهومي يُضلِّل المستخدم.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "نُفَارُ الْمَاءِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        المجمع اللغوي التقني AGROVOC يوثِّق «النفور من الماء» مقابلاً مباشراً لـ«hydrophobicity»،
        وهذا يُثبت صحة الاتجاه الاشتقاقي والتركيبي. الصيغة المُعتمدة في الإنشاء: «نُفُورُ الْمَاءِ»
        (مصدر نَفَرَ على وزن فُعُول، وهو المصدر الأكثر شيوعاً في هذا الجذر) بدلاً من «نُفَار»
        (وزن فُعَال الأقل شيوعاً). البنية الإضافية موازية تماماً لـ«كراهية الماء» مما يضمن الاتساق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الجانب الحركي الديناميكي للخاصية: انفصال الجزيئات عن الماء وتجافيها عنه بصورة طبيعية.
        أدق من «كراهية الماء» في الوصف التقني لأنه يُشير إلى الفصل الجزيئي لا مجرد التنافر العاطفي.
      actions:
        - command: create_entry
          params:
            lemma: "نُفُورُ الْمَاءِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05203488-n"

    - lemma: "الطَّرَّادِيَّةُ الْمَائِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        «الطَّرَّادِيَّة» اشتقاق نظري من «طرد» لم يُعثر له على توثيق معجمي. بوابة الجودة تفرض
        إيثار الموثَّق على المُستحدث. «طارد للماء» موثَّق صفةً وليس اسماً للخاصية.
      evidence_assessment:
        case: no_material

    - lemma: "اسْتِنْكَافُ الْمَاءِ"
      source: stage1
      decision: removed
      decision_reason: >
        «الاستنكاف» بمعنى الأنفة والإباء وارد في الفصحى، لكنه لم يُوثَّق في أي معجم تقني أو علمي
        للدلالة على هذه الخاصية. معيار التثبيت المعجمي غير محقَّق.
      evidence_assessment:
        case: no_material

    - lemma: "مُنَافَرَةُ الْمَاءِ"
      source: stage1
      decision: removed
      decision_reason: >
        «المنافرة» في الاستعمال العربي الكلاسيكي تعني المحاكمة والتفاضل القانوني بين الأقران (ابن فارس)،
        لا التنافر الفيزيائي. استخدام هذا اللفظ في السياق العلمي يُوقع في اشتراك لفظي مُضلِّل.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "خاصية كون الشيء طارداً للماء؛ يميل لصد وعدم امتصاص الماء"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي فيه تكرار («طارداً للماء» + «يميل لصد وعدم امتصاص الماء» = معنى واحد).
        كما أن «خاصية كون الشيء» أسلوب عامي غير مناسب للمعجمية العلمية. التعريف لا يُميِّز
        الخاصية عن المرض «hydrophobia» ولا يُشير إلى طبيعتها الفيزيوكيميائية.
    authored:
      - type: terminological
        text: "خَاصِّيَّةٌ فيزيوكيميائيَّةٌ تتَّصفُ بها سطوحُ بعضِ الموادِّ أو جزيئاتُها، إذ تنفرُ من الماء وترفضُ التفاعلَ معه أو استيعابَه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "تُلاحَظُ هذه الخاصِّيَّةُ في الموادِّ غيرِ القُطبيَّةِ كالدُّهونِ والزُّيوتِ والشُّمُوعِ والتِّفلون؛ فلا تتفاعلُ هذه الموادُّ مع الماء ولا تذوبُ فيه، بل يتَّخذُ الماءُ على سطوحِها شكلَ قطراتٍ كرويَّةٍ بفعلِ الشَّدِّ السَّطحيّ. وتُقابلُ هذه الخاصِّيَّةَ المائِيَّةُ المُحِبَّةُ للماء (المائِيَّةُ المَيَّالَة)"
    actions:
      - command: update_definition
