# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06264369-n
# cipher / cypher — رسالة مكتوبة برمز سري
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «شفرة» دخيلة (أقرّها المجمع) لكنها تدلّ أصلاً على نظام الترميز السرّي لا على الرسالة المشفَّرة ذاتها، فهناك انزياح مجازي من الأداة إلى المنتَج"
      - "«رسالة مشفرة» تعبير وصفي حرّ وليس مصطلحاً مسكوكاً ثابتاً، إذ يمكن إبدال «مشفرة» بـ«مرمّزة» أو «معمّاة» دون تغيير الدلالة"
      - "التعريف العربي الحالي ترجمة حرفية شبه كاملة للتعريف الإنجليزي"
    observations: "المجموعة تصف المنتَج (الرسالة المكتوبة بالشفرة) لا النظام (الشفرة ذاتها). في التراث العربي يُستعمل مصطلح «المُعَمَّى» أو «المُعَمَّاة» للدلالة على ما أُبهم من الكلام والكتابة، وقد عُرف عند العرب علم التعمية (cryptography). المصطلح الحديث «شفرة» أقرّه مجمع اللغة العربية بالقاهرة رغم كونه دخيلاً، وقد شاع استعماله شيوعاً واسعاً."
  blind_candidates:
    - lemma: "مُعَمَّاة"
      generation_method: ishtiqaq
      justification: "من الجذر (ع م ي) الدالّ على السَّتر والتغطية عند ابن فارس، على وزن مُفَعَّلة (اسم مفعول مؤنث من عَمَّى)، أي: الشيء الذي جُعل غامضاً مستوراً. يُستعمل في التراث العربي في علم التعمية (المعمَّى) للدلالة على النص المشفَّر."
    - lemma: "شِفْرَة"
      generation_method: ishtiqaq
      justification: "لفظة محدثة أقرّها مجمع اللغة المصري، من الدخيل، تدلّ على رموز يستعملها فريق من الناس للتفاهم السرّي. شائعة الاستعمال في الإعلام والتقنية."
    - lemma: "رِسَالَة مُرَمَّزَة"
      generation_method: tarkib
      justification: "مركب وصفي من «رسالة» + «مرمّزة» (اسم مفعول من رَمَّزَ). يصف المنتَج مباشرة: رسالة حُوِّلت إلى رموز."
    - lemma: "طِلَسْم"
      generation_method: taarib
      justification: "معرَّب من اليونانية (τέλεσμα)، يدلّ على ما أُبهم وغمض من الكتابة والرموز. أطلقه الصوفية والسَّحَرة على الكتابة السرّيّة الغامضة."

stage2_evidence:
  per_lemma:
    - lemma: "رِسَالَة مُشَفَّرَة"
      expands:
        - text: "«(3) الرسالة الجِفرية: رسالة موجَّهة بالشيفرة»"
          source: "المورد الحديث (2008)"
          addition: "المورد يستعمل تركيباً مماثلاً (الرسالة الجفرية) للدلالة على الرسالة المكتوبة بالشفرة"
        - text: "«رسالة أو كتابة بالجِفرة.» (ترجمة cryptogram)"
          source: "المورد الحديث (2008)"
          addition: "المورد يترجم cryptogram بعبارة وصفية لا بمصطلح مفرد، مما يدلّ على عدم وجود لفظة مفردة مسكوكة"
    - lemma: "شِفْرَة"
      confirm:
        - text: "«(محدثة) رموزٌ يستعملها فريق من النَّاس للتفاهم السرِّي فيما بينهم. (د)»"
          source: "المعجم الوسيط"
        - text: "«رموزٌ يستعملها فريقٌ من الناسِ للتَّفاهُم السِّرِّىِّ فيما بينهم»"
          source: "المعجم الكبير"
        - text: "«Cipher code: رابطة عُرْفية تقوم بين دوالَّ ومدلولاتٍ غير التى وُضعت لها أصلا بحيث لا يُدركها إلا من تواضعوا عليها»"
          source: "المعجم الكبير"
      expands:
        - text: "«الشَّفْرة هي رمز يستعمله فريق من الناس للتفاهم السِّرِّي فيما بينهم [...] أجاز مجمع اللغة المصري استعمال هذه الكلمة نظرًا لشيوعها، وأوردتها المعاجم الحديثة كالوسيط الذي نص على أنها من الدخيل»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الشفرة دخيلة لكن أجازها المجمع لشيوعها، ومعناها الأصلي نظام الترميز لا الرسالة المرمَّزة"
        - text: "«نسق من الإشارات أو الرموز المراد منها تبادل المعلومات بين المُرسِل والمُرسَل إليه.»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "تأكيد أنّ الشفرة نظام إشارات لا رسالة بعينها"
    - lemma: "مُعَمَّاة"
      confirm:
        - text: "«مُعَمَّاة من (ع م ي) مؤنث مُعَمَّى.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«والتَّعْمِيَةُ: أَنْ تُعَمِّيَ عَلَى إِنْسَانٍ شَيْئًا فَتَلْبِسَهُ عَلَيْهِ لَبْسًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (عمي) يدلّ على الستر والتغطية، والتعمية إخفاء المعنى — أساس دلالي متين لمُعَمَّاة بمعنى النص المشفَّر"
        - text: "«تشفير (تعمية) دفقي — طريقةٌ لتعميةِ متتالية معطيات غير محدودة الطول»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "التعمية مرادف تقني عربي أصيل للتشفير في المعاجم المتخصصة"
    - lemma: "رِسَالَة مُرَمَّزَة"
      evidence_status: "no_material_found"
    - lemma: "طِلَسْم"
      contradicts:
        - text: "«خطوط وأعداد يزعم كاتبها أنه يربط بها روحانيات الكواكب العلوية بالطبائع السفليّة لجلب محبوب أو دفع أذى»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "الطلسم يدلّ على السحر والتعاويذ لا على التشفير الاصطلاحي للرسائل"
        - text: "«(طلسم) أطْرَقَ وعَبَسَ السَّاحِرُ ونحوه: كتب طِلَسْمًا الشيءَ: عَمِلَ له طِلَسْمًا»"
          source: "المعجم الوسيط"
          conflict: "المعنى يدور حول التعاويذ والسحر، لا التشفير المنهجي للرسائل"
      expands:
        - text: "«الطِّلَسْم [...] اسمٌ للسِّرِّ المَكْتُومِ، وقد كَثُرَ استعمال الصُّوفِيَّةِ في كلامهم فيقولون: سِرٌّ مُطَلْسَمٌ، وحِجَابٌ مُطَلْسَمٌ»"
          source: "تاج العروس لمرتضى الزبيدي"
          addition: "الطلسم يحمل دلالة الغموض والإبهام لكن في سياق صوفي/سحري لا تقني"

