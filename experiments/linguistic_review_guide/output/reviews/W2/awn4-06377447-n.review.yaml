          source: "المعجم الموحد لمصطلحات الطب البيطري"
          addition: "يؤكّد أنّ «وَصْفَة» تُستعمل بمعنى التوجيه المكتوب في المجال الطبّي"
        - text: "«(النظارة) الْقَوْم ينظرُونَ إِلَى الشَّيْء وعدستان زجاجيتان مثبتتان فِي إطار مُنَاسِب أَمَام الْعَينَيْنِ لتصحيح عُيُوب الإبصار (محدثة)»"
          source: "المعجم الوسيط"
          addition: "يُثبت أنّ «النظّارة» بمعنى جهاز تصحيح الإبصار لفظ محدث مقبول"
        - text: "«وَصْفَة — لائحة تحتوي على مكونات دواء مركب وطريقة تحضيره واستعماله.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          addition: "يثبت «وَصْفَة» بمعنى لائحة التعليمات المكتوبة"

    - lemma: "وَصْفَة بَصَرِيَّة"
      expands:
        - text: "«وَصْفَة طِبِّيَّة» — translation_en: medical prescription"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          addition: "يُثبت نمط «وَصْفَة + صفة مجالية» كقالب إنتاجي مسجّل، ممّا يدعم القياس عليه بـ«بَصَرِيَّة»"

