# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «وصفة نظارة» خالية من التشكيل"
      - "المركب الإضافي «وصفة نظارة» غير مسجّل في المعاجم المتاحة كوحدة معجمية ثابتة"
      - "استخدام المفرد «نظارة» بدلاً من الجمع «نظارات» في هذا السياق غير مألوف"
    observations: "المفهوم يتعلّق بالوصفة الطبية الخاصّة بالنظّارات، وهو مفهوم حديث لا يوجد له مصطلح عربيّ مفرد مسكوك. يُعبَّر عنه عادةً بمركّب إضافيّ أو وصفيّ من كلمة «وَصْفَة» مع مقيّد يخصّصها بمجال البصريّات. كلمة «وَصْفَة» مثبتة في المعاجم الموحّدة بمعنى prescription في المجال الطبّي والصيدلاني."

  blind_candidates:
    - lemma: "وَصْفَة نَظَّارَة"
      generation_method: tarkib
      justification: "مركّب إضافيّ من «وَصْفَة» (ما يوصف من تعليمات طبّية) و«نَظَّارَة» (جهاز تصحيح البصر)، يُحيل مباشرة إلى التعليمات المكتوبة لصنع عدسات النظّارة"
    - lemma: "وَصْفَة بَصَرِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفيّ على نمط «وَصْفَة طِبِّيَّة» المسجّل في المعاجم الموحّدة، يخصّص الوصفة بمجال البصريّات"
    - lemma: "وَصْفَة عَدَسَات"
      generation_method: tarkib
      justification: "مركّب إضافيّ يربط الوصفة بالعدسات مباشرةً، وهي الموضوع الأساسيّ للتعليمات"
    - lemma: "تَوْصِيفَة بَصَرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر المرّة على وزن تَفْعِيلَة من «وَصَّفَ» مع وصف «بَصَرِيَّة»، يُفيد الدلالة على الوثيقة المكتوبة"


