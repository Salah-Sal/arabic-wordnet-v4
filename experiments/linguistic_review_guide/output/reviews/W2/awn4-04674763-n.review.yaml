stage1_review:
  assessment:
    concerns:
      - "غياب التشكيل عن اللمة الموجودة."
      - "التعريف الحالي ترجمة حرفية ركيكة (سمة التصرف بطرق تعتبر نموذجية للنساء)."
    observations: "المصطلح (أُنُوثَة) هو المصدر الصناعي الدقيق والمستقر للتعبير عن مفهوم femininity في العربية، والمفاهيم الأخرى إما أن تكون وصفية أو تحمل دلالات أخرى كالتأنث (التشبه بالمرأة)."
  blind_candidates:
    - lemma: "أُنُوثَة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الجذر (أنث) للدلالة على الطبيعة الأنثوية وما يميزها."
    - lemma: "طَبَائِعُ النِّسَاءِ"
      generation_method: tarkib
      justification: "مركب إضافي يصف الخصائص الفطرية والسلوكية للنساء."
    - lemma: "تَأَنُّث"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تفعُّل، يشير إلى اتخاذ سمات الأنثى أو التشبه بها."
    - lemma: "خَصَائِصُ أُنْثَوِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يشير إلى السمات المميزة للأنثى."

stage2_evidence:
  per_lemma:
    - lemma: "أُنُوثَة"
      confirm:
        - text: "«امتلاك سمات الأنثى في التعبير.»"
          source: "مسرد الإعلام والتواصل"
        - text: "«التحلي بالخصائص الأنثوية الطبيعية عند المرأة.»"
          source: "معجم المصطلحات الطبية"

stage3_analysis:
  per_lemma:
    - lemma: "أنوثة"
      decision: confirmed
      decision_reason: "مصدر صناعي فصيح ومستقر في الاستعمال المعاصر للدلالة على هذا المفهوم، ويدعمه الاستعمال المعجمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُنُوثَة"
    - lemma: "طَبَائِعُ النِّسَاءِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك كمصطلح، ولا يحمل التجريد الدقيق لمعنى الأنوثة."
    - lemma: "تَأَنُّث"
      source: stage1
      decision: removed
      decision_reason: "يدل غالباً على تكلّف الأنوثة أو تشبّه الذكر بالمرأة (التخنث)، ولا يعبر عن الأنوثة الطبيعية للمرأة."
    - lemma: "خَصَائِصُ أُنْثَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي مركب وليس مصطلحاً مفرداً."

stage4_content:
  definition:
    current: "سمة التصرف بطرق تعتبر نموذجية للنساء"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية ركيكة للتعريف الإنجليزي. تم صياغة تعريف مصطلحي دقيق يعبر عن جوهر المفهوم."
    authored:
      - type: terminological
        text: "مجموعة الصفات والخصائص والسلوكيات التي تُمَيِّز الأنثى وتُعَدُّ نموذجية لها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة الصفات والخصائص والسلوكيات التي تُمَيِّز الأنثى وتُعَدُّ نموذجية لها."
  examples:
    per_lemma:
      - lemma: "أُنُوثَة"
        examples:
          - text: "تَجَلَّتْ أُنُوثَتُهَا فِي رِقَّةِ حَدِيثِهَا وَلُطْفِ تَعَامُلِهَا."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَجَلَّتْ أُنُوثَتُهَا فِي رِقَّةِ حَدِيثِهَا وَلُطْفِ تَعَامُلِهَا."

stage5_enrichment:
  per_entry:
    - lemma: "أُنُوثَة"
      entry_id: "{auto}"
      root: "انث"
      maqayis_quote: "«وَأَمَّا الْهَمْزَةُ وَالنُّونُ وَالثَّاءُ فَقَالَ الْخَلِيلُ وَغَيْرُهُ: الْأُنْثَى خِلَافُ الذَّكَرِ.»"
  per_sense:
    - lemma: "أُنُوثَة"
      sense_id: "{auto}"
      nuance: "المصطلح الأساسي والمجرد للتعبير عن خصائص المرأة وطبيعتها."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"انث","maqayis":"«وَأَمَّا الْهَمْزَةُ وَالنُّونُ وَالثَّاءُ فَقَالَ الْخَلِيلُ وَغَيْرُهُ: الْأُنْثَى خِلَافُ الذَّكَرِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الأساسي والمجرد للتعبير عن خصائص المرأة وطبيعتها.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
