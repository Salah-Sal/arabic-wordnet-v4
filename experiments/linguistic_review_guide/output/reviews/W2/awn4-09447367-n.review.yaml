stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي قريب من الترجمة الحرفية، ولكنه يؤدي الغرض دلالياً."
    observations: "المفهوم يشير إلى الكيان أو العامل الذي يجلب الرضا أو يشبع حاجة معينة. اللمات الموجودة 'مُرْضٍ' و'مُشْبِع' هي أسماء فاعل من الفعلين 'أرضى' و'أشبع' وهي صحيحة قياسياً وتؤدي المعنى المطلوب."
  blind_candidates:
    - lemma: "مُرْضٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'أرضى'، يدل على ما يسبب الرضا، وهو الأقرب لـ satisfier."
    - lemma: "مُشْبِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'أشبع'، يستخدم في السياقات التي تعني تلبية الحاجة إلى حد الامتلاء."
    - lemma: "مُقْنِع"
      generation_method: ishtiqaq
      justification: "من 'أقنع'، قد يستخدم لما يحقق الرضا الذهني أو النفسي ويزيل الشك."
    - lemma: "مُكَافِئ"
      generation_method: majaz
      justification: "بمعنى ما يعطي مقابلاً يرضي الطرف الآخر ويلبي تطلعاته."

stage2_evidence:
  per_lemma:
    - lemma: "مُرْضٍ"
      confirm:
        - text: "«(1) مُرْضٍ (2) مُقْنع.»"
          source: "المورد الحديث"
        - text: "«مُرْضِي: من (ر ض و) المعطي عطاء يرضى به أي يرتاح إليه بغير غضب أو سخط.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُشْبِع"
      confirm:
        - text: "«يُشْبِع؛ يُرضي»"
          source: "المورد الحديث"
      expands:
        - text: "«(1) «أ» إرضاء؛ إبهاج؛ إشباع. «ب» رضًا؛ مَسَرّة؛ شِبَع (2) مصدر رضًا أو مَسَرّة.»"
          source: "المورد الحديث"
    - lemma: "مُقْنِع"
      contradicts:
        - text: "«صفة الخطاب الذي يُحدث تغييرا في مواقف المستمعين بفضل توَفُّقه في اختيار الأسلوب المناسب والأدلة المطلوبة.»"
          source: "مسرد الإعلام والتواصل"
          conflict: "يدل على الإقناع المنطقي أو البلاغي وإزالة الشك، وليس بالضرورة الإشباع الفعلي أو النفسي للحاجة."
    - lemma: "مُكَافِئ"
      contradicts:
        - text: "«equivalent»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          conflict: "يدل على التساوي أو التعادل، ولا يحمل دلالة تلبية الرضا والإشباع."

stage3_analysis:
  per_lemma:
    - lemma: "مُرْضٍ"
      decision: confirmed
      decision_reason: "اسم فاعل فصيح ومستعمل، يدل على ما يجلب الرضا، ويقابل بشكل دقيق مصطلح 'satisfier'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرْضٍ"
    - lemma: "مُشْبِع"
      decision: confirmed
      decision_reason: "اسم فاعل يدل على تحقيق الاكتفاء وتلبية الحاجة، وهو مرادف مناسب للسياقات الاستهلاكية والنفسية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُشْبِع"
    - lemma: "مُقْنِع"
      source: stage1
      decision: removed
      decision_reason: "يقتصر على الإقناع الفكري أو الخطابي ولا يشمل المعنى العام للإشباع."
    - lemma: "مُكَافِئ"
      source: stage1
      decision: removed
      decision_reason: "دلالته الأساسية هي التعادل والتماثل الرياضي أو المنطقي."

stage4_content:
  definition:
    current: "أي عامل قادر على تحقيق الرضا أو الإشباع"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح، حيث يغطي المفهومين الأساسيين للرضا والإشباع."
  examples:
    per_lemma:
      - lemma: "مُرْضٍ"
        examples:
          - text: "قدم الموظف أداءً مُرْضِياً لإدارة الشركة."
            type: usage
      - lemma: "مُشْبِع"
        examples:
          - text: "يعتبر هذا المنتج مُشْبِعاً لحاجات المستهلكين الأساسية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "قدم الموظف أداءً مُرْضِياً لإدارة الشركة."
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يعتبر هذا المنتج مُشْبِعاً لحاجات المستهلكين الأساسية."

stage5_enrichment:
  per_entry:
    - lemma: "مُرْضٍ"
      entry_id: "{auto}"
      root: "رضو"
      maqayis_quote: "«الرَّاءُ وَالضَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ السُّخْطِ.»"
    - lemma: "مُشْبِع"
      entry_id: "{auto}"
      root: "شبع"
      maqayis_quote: "«الشِّينُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى امْتِلَاءٍ فِي أَكْلٍ وَغَيْرِهِ.»"
  per_sense:
    - lemma: "مُرْضٍ"
      sense_id: "{auto}"
      nuance: "يركز على تحقيق الرضا النفسي والقبول واستحسان النتيجة."
      mwe: false
    - lemma: "مُشْبِع"
      sense_id: "{auto}"
      nuance: "يركز على سد الحاجة المادية أو المعنوية والوصول إلى حد الاكتفاء."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"رضو","maqayis":"«الرَّاءُ وَالضَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ السُّخْطِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"شبع","maqayis":"«الشِّينُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى امْتِلَاءٍ فِي أَكْلٍ وَغَيْرِهِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على تحقيق الرضا النفسي والقبول واستحسان النتيجة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على سد الحاجة المادية أو المعنوية والوصول إلى حد الاكتفاء.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
