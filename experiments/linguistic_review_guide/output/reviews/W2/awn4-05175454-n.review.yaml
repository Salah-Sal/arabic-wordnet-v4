# مراجعة المجموعة الترادفية — Synset Review
# ID: awn4-05175454-n  |  ILI: i64138  |  POS: n
# occidentalism — الصفات والعادات المميزة للحضارات الغربية
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "لمّة «استغراب» تعاني اشتراكاً لفظياً واضحاً: المعنى الأصلي هو التعجب والاستهجان، والمعنى المقصود هنا (الطابع الغربي) يظل ثانوياً ومتنازعاً عليه"
      - "لمّة «طابع غربي» عبارة وصفية حرة وليست وحدة معجمية مسكوكة؛ تفشل اختبار السكّ واختبار التثبيت المعجمي"
      - "لا تشكيل كامل على أي من اللمّتين الموجودتين"
      - "اللمّتان معاً لا تؤدّيان التمييز الدقيق للمفهوم (الصفات الجوهرية للحضارات الغربية) بصورة موثّقة معجمياً"
    observations: >
      المفهوم يندرج تحت الجنس المباشر «نَوْعِيَّة/جَوْدَة» وهو مناسب منطقياً. المقصود بالمجموعة
      هو مجموعُ ما تتميّز به الحضارات الغربية من صفات وعادات وسلوكيات، لا الحركة الفكرية المعروفة
      بـ«الاستغراب» عند حسن حنفي. جذر «غ-ر-ب» خصب في العربية ويتيح اشتقاقات وافية، وأبرزها
      وزن «فُعُولَة» الذي وظّفته العربية لبناء أسماء مجردة دالة على هوية ثقافية-حضارية (عُرُوبَة، يَهُودِيَّة...).
      المورد الحديث (2008) وثَّق «الغُروبة» بمعنى «ثقافة الشعوب الغربية أو خصائصها» = Occidentalism،
      وهو توثيق دقيق يتطابق مع تعريف المجموعة.

  blind_candidates:
    - lemma: "الغُرُوبَة"
      generation_method: ishtiqaq
      justification: >
        وزن «فُعُولَة» من جذر «غ-ر-ب»، قياساً على «عُرُوبَة» من عربي، و«يهودية» من يهودي.
        الوزن فُعُولَة يُستعمل في العربية للدلالة على المجموع الهوياتي للانتماء الثقافي-الحضاري.
        «الغُرُوبة» تعني: مجموع ما تتميّز به الحضارات الغربية من صفات جوهرية، وهو المعنى المطلوب.
        الاشتقاق من «غُرُوب» (الغروب/الغرب) يُجسّد العلاقة المجازية التأسيسية للمفهوم.

    - lemma: "الغَرَبِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بـ«-يَّة» من الصفة «غَرَبِيّ»، على وزن مستحدث (فَعَلِيَّة). يدل على مجموع
        الخصائص المنسوبة إلى الغرب. تستعمل العربية المعاصرة هذا النمط لتجريد الصفات النسبية
        (ذكورية، أنوثية، إنسانية...).

    - lemma: "التَّغَرُّبِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «تَغَرُّب» على وزن «تَفَعُّلِيَّة»، يدل على منظومة الانتماء للحضارة الغربية
        أو التوجه نحو قيمها وعاداتها. يحمل دلالة الحركية والاكتساب الثقافي بخلاف الغُرُوبة التي
        تدل على الصفة الجوهرية.

    - lemma: "الغُرْبَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بـ«-انِيَّة» من «غَرْب»، على غرار «رُوحَانِيَّة، سلطانية، إنسانية». يُعبِّر عن
        الطابع الغربي بوصفه كُلِّية نسبية تشمل الأبعاد الثقافية والحضارية والقيمية للغرب.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "استغراب"
      contradicts:
        - text: "«اسْتَغْرَبَ الرَّجُلُ، إِذَا بَالَغَ فِي الضَّحِكِ، مُمْكِنٌ أَنَّ يَكُونَ مِنْ هَذَا، كَأَنَّهُ بَلَغَ آخِرَ حَدِّ الضَّحِكِ»"
          source: "مقاييس اللغة لابن فارس (hawramani_7)"
          conflict: "المعنى الأصلي لـ«استغراب» هو المبالغة في الضحك أو التعجب، لا الطابع الغربي"
        - text: "«كل ما يثير العجبَ أو الاستغراب»"
          source: "مسرد موجود في قاعدة البيانات — سياق استعمال"
          conflict: "الاستخدام الشائع لـ«استغراب» في سياق التعجب والاستهجان لا في سياق الحضارة الغربية"

    - lemma: "طابع غربي"
      expands:
        - text: "«الطَّابِعُ: العَلَامَةُ الْمُمَيِّزَةُ. والطَّابَعُ: الخاتَمُ الذي يُخْتَمُ بـه على الأشياء»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          addition: "«الطابع» بمعنى العلامة المميزة يدعم الدلالة الوصفية للمركب، لكن الوحدة المركبة نفسها غير مسجّلة معجمياً"
        - text: "«الطَّابَع: الطبيعة»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
          addition: "«الطابع» بمعنى الطبيعة الغالبة يقترب من المعنى المطلوب، لكن التركيب «طابع غربي» كوحدة لم يُوثَّق"
        - text: "«الغَرَبِيُّ: المنسوب إلى الغرب»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
          addition: "«غربي» صفة نسبة صحيحة لكنها لا تُعطي الوحدة المركبة ثباتاً اصطلاحياً"

    - lemma: "الغُرُوبَة"
      confirm:
        - text: "«الغُروبة: ثقافة الشعوب الغربية أو خصائصها»"
          source: "المورد الحديث (2008) — Al-Mawrid Al-Hadeeth"
      expands:
        - text: "«المُسْتَغْرِب: المؤيِّد لعادات الغربيين ولثقافتهم»"
          source: "المورد الحديث (2008) — Al-Mawrid Al-Hadeeth"
          addition: "وجود «المستغرب» كمشتق دال على صاحب الغُروبة يُثبِت أن المعجم يؤسِّس منظومة اصطلاحية متكاملة حول هذا الجذر"
        - text: "«الْغُرْبَةُ: الْبُعْدُ عَنِ الْوَطَنِ... وَمِنْ هَذَا الْبَابِ: غُرُوبُ الشَّمْسِ، كَأَنَّهُ بُعْدُهَا عَنْ وَجْهِ الْأَرْضِ»"
          source: "مقاييس اللغة لابن فارس (hawramani_7)"
          addition: "الجذر غرب يحمل معنى البُعد والاتجاه الغربي (جهة الغروب) مما يُسوِّغ إطلاق «الغُرُوبة» على الطابع الحضاري للغرب"

    - lemma: "الغَرَبِيَّة"
      contradicts:
        - text: "«غَرَبِيَّة: من (غ ر ب) مؤنث غَربي»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعاجم تُسجّل «الغربية» كمؤنث الصفة النسبية «غربي»، لا كاسم مجرد دال على منظومة الصفات الغربية"

    - lemma: "التَّغَرُّبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الغُرْبَانِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "استغراب"
      decision: removed
      decision_reason: >
        «استغراب» يُعاني اشتراكاً لفظياً حاداً: المعنى الأصلي في المعجمية العربية هو التعجب
        والاستهجان (استفعال من غريب = وجد الشيء غريباً)، وهذا ما تؤكده مقاييس اللغة والاستعمال
        الراسخ. أما استخدامه بمعنى «الطابع الغربي / خصائص الحضارة الغربية» فلا سند معجمي له في
        المعاجم المُستعلَمة. فضلاً عن ذلك، «الاستغراب» عند حسن حنفي يدل على حركة فكرية (دراسة
        الغرب بعين الشرق) لا على الصفات الجوهرية للحضارة الغربية ذاتها. هذا التداخل يُخلّ
        بدقة الشبكة الدلالية ويُربك المستخدم.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "طابع غربي"
      decision: removed
      decision_reason: >
        «طابع غربي» عبارة وصفية حرة لا تعبير اصطلاحي مسكوك: اختبار السكّ يُثبِت إمكانية إبدال
        «غربي» بـ«شرقي» أو «أمريكي» أو «أوروبي» مع بقاء الوصف صالحاً — وهذا دليل على أنها ليست
        وحدة معجمية ثابتة. اختبار التثبيت المعجمي: لم تُعثَر على هذه الوحدة مُدرَجة في أي معجم.
        الوزن الصرفي لـ«طابع» (فاعَل) مناسب للعلامة المميزة، لكن الوصف الحر لا يُشكّل مصطلحاً
        متداولاً في أي حقل معرفي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الغُرُوبَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        توثيق مباشر في المورد الحديث (2008): «الغُروبة: ثقافة الشعوب الغربية أو خصائصها» مع ترجمة
        إنجليزية صريحة Occidentalism. الوزن «فُعُولَة» من جذر «غ-ر-ب» مقيس تماماً على «عُرُوبَة»
        (خصائص العرب) و«يهودية» و«أُمَمِيَّة» وغيرها من الأسماء الدالة على الانتماء الحضاري-الثقافي.
        مقاييس اللغة لابن فارس يُثبِت أصالة الجذر ومشروعية الاشتقاق منه. التشكيل: الغُرُوبَة.
        لا اشتراك لفظي مع معانٍ أخرى.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «الغُرُوبَة» هي المصطلح الوحيد المُقَرَّر في هذه المجموعة بعد حذف اللمّات الأخرى. تتميّز
        عن «الاستغراب» بأنها تدل على الصفات الجوهرية الحضارية للغرب لا على التعجب منه أو دراسته،
        وتتميّز عن «طابع غربي» بكونها وحدة معجمية مُسكَّة موثَّقة ذات جذر صرفي أصيل.
      actions:
        - command: create_entry
          params:
            lemma: "الغُرُوبَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "الغَرَبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم تُسجِّل «الغربية» / «الغَرَبِيَّة» حصراً كمؤنث الصفة النسبية «غربي»، لا كاسم
        مجرد. استخدامها كمصطلح مجرد دال على منظومة الصفات الغربية يُلبِسها POS خاطئاً (صفة لا اسم)
        ويُحدِث التباساً. الغُرُوبَة تؤدي الوظيفة ذاتها بصورة أدق وأقل إيهاماً.

    - lemma: "التَّغَرُّبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا سند معجمي. فضلاً عن ذلك، «تغرُّب» في المعاجم يدل على «نزح عن الوطن» لا على التشبه
        بالحضارة الغربية، ومنه «التغرُّبية» تحمل دلالة الغُربة والبُعد عن الوطن لا الطابع الغربي.

    - lemma: "الغُرْبَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا سند معجمي، والوزن «فُعْلانية» نادر في التجريد الحضاري. الغُرُوبَة أصرح وأوثق وأكثر
        قياساً على النماذج العربية المعروفة كـ«عُرُوبَة».


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "الصفات أو العادات أو السلوكيات المميزة للحضارات الغربية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للإنجليزية «the quality or customs or mannerisms
        characteristic of Western civilizations». يفتقر إلى جنس (genus) صريح يُحدِّد ما نوع
        المفهوم، وعبارة «المميزة» ضعيفة في الإحكام المنطقي. يحتاج إلى إعادة صياغة بأسلوب المعجم
        الوسيط مع تضمين الجنس القريب والفصل النوعي.
    authored:
      - type: terminological
        text: >
          مجموعُ السِّمَاتِ الثقافيَّةِ والقِيَمِ والعاداتِ والسلوكياتِ التي تنفرد بها الحضاراتُ
          الغربيَّةُ وتُميِّزُها عن سواها من الحضاراتِ الإنسانيَّة
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          ما انفردت به الحضارةُ الغربيَّةُ من طباعٍ وأعرافٍ وأساليبَ سلوكٍ وتقاليدَ اجتماعيَّةٍ
          تُعرَّفُ بها وتُنسَبُ إليها
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
