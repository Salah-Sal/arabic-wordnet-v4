# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:

  # أ. المرشحات العمياء — قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "تَأيِين"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل المتعدي (أيَّن — يُأيِّن) على وزن تَفعيل، وهو الوزن الصرفي
        الدال على تحويل شيء إلى حالة جديدة (كالتبخير والتبريد والتصفية).
        يدل على العملية من حيث الفاعلية: «تأيين الذرة» = تحويلها إلى أيون.
        الجذر أيون معرَّب من اليونانية (ἰόν) يقبل التوليد الصرفي العربي.

    - lemma: "تَأيُّن"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل اللازم (تأيَّن — يتأيَّن) على وزن تَفَعُّل، وهو الوزن
        الدال على التحوُّل التلقائي أو المتطوِّر (كالتبخُّر والتكثُّف والتفككّ).
        يدل على العملية من حيث انتقال الجسيم ذاته من التعادل إلى الشحنة.

    - lemma: "إِزَاحَة إِلِكْترونِيَّة"
      generation_method: tarkib
      justification: >
        مركَّب إضافي وصفي من «إزاحة» (displacement) + «إلكترونية» (electronic)؛
        يصف آلية التأيُّن القائمة على نزع الإلكترون من الذرة أو إضافته إليها،
        مما يجعل الجسيم مشحوناً. المركَّب معهود في مصطلحية الفيزياء الذرية.

    - lemma: "تَجرِيد ذَرِّي"
      generation_method: majaz
      justification: >
        إحياء مجازي للفظ «التجريد» (من جرَدَ = قشَرَ وكشَف) ليدل على انتزاع
        الإلكترونات من قشرة الذرة الخارجية وتعريتها؛ مشابهة وظيفية بين تجريد
        الشيء من غلافه وتجريد الذرة من إلكتروناتها. مقرون بـ«ذري» تخصيصاً.

  # ب. التقييم الأولي — بعد الاطلاع على اللمّات الموجودة
  assessment:
    concerns:
      - >
        اللمّة الوحيدة «تأين» مكتوبة بدون تشكيل؛ الشكل الصحيح هو «تَأيُّن»
        (مصدر الفعل اللازم تأيَّن على وزن تَفَعُّل). غياب التشكيل يُلبِّس
        بين تَأيُّن (اللازم) وتَأيِين (المتعدي) وهما مصطلحان متمايزان دلالياً.
      - >
        التعريف العربي يبدأ بـ«عملية التأين» وهو تعريف دوري (circular): يستخدم
        المُعرَّف نفسه في التعريف، مما يجعله معيباً منطقياً ويستوجب المراجعة.
      - >
        المجموعة تضم لمّة واحدة فقط، في حين أن المصطلحية العربية توثِّق صيغتين
        راسختين (تَأيُّن وتَأيِين) بمعنيين متمايزَين (لازم ومتعدٍّ)، وكلتاهما
        صالحة للمجموعة الترادفية. ثمة أيضاً مصطلح «تَشَرُّد» (من شرد) موثَّق
        في معجمَي الكيمياء والمصطلحات المهنية كمرادف للتأيُّن يستحق الدراسة.
    observations: >
      المجموعة تصف مفهوم «التأيُّن» (Ionization) — العملية الفيزيائية/الكيميائية
      التي تتحوَّل فيها الجسيمات المتعادلة إلى أيونات مشحونة. الجذر المعتمَد في
      المصطلحية العربية الحديثة هو «أيون» المعرَّب من اليونانية (ἰόν)، وقد
      اشتُقَّ منه الفعل المزيد «أيَّن» (بناء II) و«تأيَّن» (بناء V) وفق قياسات
      صرفية عربية سليمة. يُلاحَظ أيضاً وجود مصطلح «شاردة» كمقابل عربي خالص
      للأيون (من شرد = تنفَّر وابتعد)، مما أفرز مصطلح «تَشَرُّد» للدلالة على
      التأيُّن في بعض المعاجم المتخصصة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المُنفَّذة (٤ استعلامات):
#   ١. Batch headword: تاين+التاين+تايين+التايين+ازاحة+...
#   ٢. Combined enrichment (entry_ids: 518191,467602,431510,421930,507118)
#   ٣. English bridge: ionization OR ionisation OR ionizing
#   ٤. Arabic FTS: تأيُّن OR تاين OR ايون
stage2_evidence:

  per_lemma:

    # ── اللمّة الموجودة: تأين ────────────────────────────
    - lemma: "تأين"
      confirm:
        - text: "«تأيّن (ن) — ionization»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
        - text: "«تَأَيُّن — ionization»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — ARABTERM"
        - text: "«التأين — ionization»"
          source: "موسوعة الكهرباء IEC 60050 (Electropedia) — ARABTERM"
        - text: "«تايُّن — عملية تصبح معها الذرات المحايدة (neutral) مشحونة كهربائياً، إيجابياً أو سلبياً، وذلك بفقد أو اكتساب إلكترونات — ionization»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000) — ARABTERM"
        - text: "«تأيُّن، تشرُّد — ionization»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — ARABTERM"
        - text: "«(1) التأيُّن: التحوُّل إلى أيونات — ionization»"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«تأيُّن جَوّيّ — atmospheric ionization»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999) — ARABTERM"
          addition: >
            المصطلح منتج اشتقاقياً ويقبل التوصيف بصفات متعددة (جوي، انهيالي،
            بالاصطدام، مباشر)، مما يثبت رسوخه كوحدة معجمية ثابتة.
        - text: "«تَأَيُّنُ تاونسند (تأَيُّنٌ انْهِيالِيّ) — Townsend ionization (avalanche ionization)»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          addition: "يثبت استخدام تَأيُّن مركَّباً إضافياً في المعجمية الطبية المتخصصة."
        - text: "«تأيّن بالاصطدام — ionization by collision»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
          addition: "يؤكد الإنتاج الاشتقاقي للمصطلح في سياقات فيزيائية متعددة."

    # ── المرشح ١: تَأيِين ────────────────────────────────
    - lemma: "تَأيِين"
      confirm:
        - text: "«(2) التأيين: تحويلٌ إلى أيونات — ionization»"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: "«جسيم التأيين المباشر (ن) — directly ionizing particle»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
        - text: "«اشعاع التأيين المباشرة (ن) — directly ionizing radiation»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
        - text: "«غرفة تأيين طليقة الهواء (ن) — free air ionisation chamber»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
        - text: "«جسيم تأيين غير مباشر (ن) — indirectly ionizing particle»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
      expands:
        - text: "«وسيط مُؤيِّن — ionizing agent»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
          addition: >
            اسم الفاعل مُؤيِّن (من أيَّن) موثَّق، يعزز صحة المصدر تَأيِين
            من الجذر نفسه.
        - text: "«حادثة مُؤيِّنة (ن) — ionizing event»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
          addition: "يؤكد رسوخ الاشتقاق من (أيَّن) في المصطلحية الفيزيائية."

    # ── المرشح ٢: إزاحة إلكترونية ──────────────────────
    - lemma: "إِزَاحَة إِلِكْترونِيَّة"
      contradicts:
        - text: "«إزاحة — displacement; misalignment; relocation; translocation»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM"
          conflict: >
            إزاحة مصطلح راسخ بمعنى «الإزاحة الفيزيائية المكانية» (displacement)
            في عشرات المعاجم المتخصصة (المياه، الهندسة المدنية، الفيزياء،
            الكيمياء، علم الزلازل). استخدامه بمعنى التأيُّن سيُحدث تلبيساً
            مع المصطلح الرسمي القائم.
        - text: "«إزاحة — displacement»"
          source: "موسوعة الكهرباء IEC 60050 (Electropedia) — ARABTERM"
          conflict: >
            حتى في سياق الفيزياء الكهربائية، إزاحة = displacement وليس
            ionization. لا دليل على استخدامها بالمعنى الكيميائي المطلوب.

    # ── المرشح ٣: تَجرِيد ذَرِّي ───────────────────────
    - lemma: "تَجرِيد ذَرِّي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الموجودة: تأين ────────────────────────────
    - lemma: "تأين"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة بوفرة في المصطلحية العربية المتخصصة (الفيزياء والكيمياء
        والجيولوجيا والأرصاد والطب والاستشعار عن بعد وموسوعة IEC)، وهي الصيغة
        المعيارية السائدة للدلالة على التأيُّن. تحتاج فقط إلى تصحيح التشكيل:
        تأين → تَأيُّن (مصدر تأيَّن على وزن تَفَعُّل).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَأيُّن = التحوُّل اللازم، يُركِّز على انتقال الجسيم ذاته من حالة
        التعادل إلى الشحنة الكهربائية (رؤية الانتقال من الداخل). هو الأعم
        استخداماً والأوسع تداولاً في المصطلحية العربية المعاصرة، ويقبل
        التوصيف في مركَّبات إضافية متعددة (تأيُّن جوي، تأيُّن انهيالي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَأيُّن"

    # ── المرشح ١: تَأيِين ────────────────────────────────
    - lemma: "تَأيِين"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصطلح موثَّق في المورد الحديث (2008) بتمييز صريح: «التأيين: تحويلٌ
        إلى أيونات» (متعدٍّ) في مقابل «التأيُّن: التحوُّل إلى أيونات» (لازم).
        كما يظهر في مركَّبات إضافية متعددة في معجم الفيزياء (1989): «جسيم
        التأيين»، «إشعاع التأيين». اسم الفاعل «مُؤيِّن» راسخ في أربعة مداخل
        فيزيائية وطبية. الصيغة مستوفية لجميع معايير بوابة جودة المصطلح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَأيِين = التحويل المتعدي، يُركِّز على فعل العامل الخارجي (إشعاع،
        مجال كهربائي، تصادم) الذي يُحوِّل الجسيمَ إلى أيون (رؤية العملية
        من الخارج). يُستعمل في سياق تقنية الأجهزة والإشعاعات المُؤيِّنة
        («جسيم التأيين المباشر»، «إشعاع التأيين الغير مباشر»).
      actions:
        - command: create_entry
          params:
            lemma: "تَأيِين"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── المرشح ٢: إزاحة إلكترونية ──────────────────────
    - lemma: "إِزَاحَة إِلِكْترونِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «إزاحة» مصطلح راسخ بمعنى displacement المكاني في عشرات المعاجم؛
        استخدامه بمعنى التأيُّن سيُولِّد لبساً مع المصطلح القائم. لا يوجد
        توثيق للمركَّب «إزاحة إلكترونية» بمعنى ionization في أي معجم.
        اختبار الاستبدال يفشل: «نزع إلكتروني»، «سلب إلكتروني» تبدو مترادفة
        وصفياً، مما يدل أنه ليس مصطلحاً مسكوكاً.
      evidence_assessment:
        case: contradicts_only

    # ── المرشح ٣: تَجرِيد ذَرِّي ───────────────────────
    - lemma: "تَجرِيد ذَرِّي"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود للمركَّب في أي معجم متخصص بمعنى ionization. «تجريد» في
        المصطلحية العربية يرتبط بالمجال الفلسفي (abstraction) والعسكري (stripping).
        اختبار السكّ يكشف أنه وصف حر قابل للتبديل («تعرية ذرية»، «كشط ذري»)
        وليس وحدة معجمية ثابتة. المجاز بعيد عن الاستعمال الراسخ.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:

  definition:
    current: "عملية التأين؛ تكوين الأيونات عن طريق فصل الذرات أو الجزيئات أو الجذور أو عن طريق إضافة أو طرح الإلكترونات من الذرات بواسطة مجالات كهربائية قوية في غاز"
    assessment:
      decision: revise
      reason: >
        ثلاثة عيوب: (١) دوران: «عملية التأين» يستخدم المُعرَّفَ في تعريفه.
        (٢) تكرار: «تكوين الأيونات» يعيد ذكر المفهوم ذاته. (٣) تقييد مكاني
        غير دقيق: «في غاز» لا يعكس إلا آلية واحدة، بينما يقع التأيُّن أيضاً
        في المحاليل والمركَّبات الأيونية. مصدر الاستشعار عن بعد (2000) يقدِّم
        صياغة أدق: «عملية تصبح معها الذرات المحايدة مشحونة كهربائياً بفقد أو
        اكتساب إلكترونات».
    authored:
      - type: terminological
        text: >
          تحوُّلُ الجسيماتِ المتعادلة — ذراتٍ أو جزيئاتٍ أو جذوراً — إلى
          أيوناتٍ مشحونةٍ كهربائياً، إما بفقدِ إلكترونٍ أو أكثر واكتسابِ شحنةٍ
          موجبة، وإما باكتسابِ إلكترونٍ أو أكثر واكتسابِ شحنةٍ سالبة، وإما
          بانفصالِها تحت تأثير مجالاتٍ كهربائيةٍ قويةٍ في وسطٍ غازي.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          ظاهرةٌ فيزيائيةٌ وكيميائيةٌ تُفقَد فيها الذرةُ أو الجزيءُ أو الجذرُ
          المتعادلُ حيادَها الكهربائي لتصبح شاردةً (أيوناً) موجبةَ الشحنة إن
          خسرت إلكتروناً أو أكثر، أو سالبةَ الشحنة إن اكتسبتها؛ وتحدث بآليات
          متعددة منها التصادم والتأثير الحراري والإشعاع الكهرومغناطيسي والمجالات
          الكهربائية الشديدة في الغازات.
