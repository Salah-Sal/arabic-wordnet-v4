            شحنةٍ موجبة، وإما باكتسابِ إلكترونٍ أو أكثر واكتسابِ شحنةٍ سالبة،
            وإما بانفصالِها تحت تأثير مجالاتٍ كهربائيةٍ قويةٍ في وسطٍ غازي.
