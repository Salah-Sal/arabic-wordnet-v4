# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04791892-n | ILI: i62151 | POS: n
# logicality / logicalness — الاستدلال الصحيح والسليم
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (مَنْطِقِيَّة) غير مُثبتة كمدخل مستقل في المعجمات الكلاسيكية أو الحديثة؛ هي مصدر صناعي مستحدث على الوزن المعياري."
      - "التعريف الحالي 'الاستدلال الصحيح والسليم' يصف الفعلَ (مصدر) لا الصفةَ (خاصيةً)؛ ينبغي أن يصف المنطقيةَ بوصفها صفةً للفكر لا فعلاً للاستدلال."
      - "المجموعة مكتفية بلمّة واحدة فحسب مما يضعف تغطيتها المعجمية."
    observations: "مَنْطِقِيَّة مصدرٌ صناعي قياسي مشتق من الصفة النسبية مَنْطِقِيّ (← المَنْطِق ← جذر نطق). استقر هذا الجذر على دلالة الكلام والتعبير أولاً، ثم توسّع المنطق إلى علم الاستدلال الصحيح عبر مسار الترجمة الفلسفية الإسلامية (اليونانيّة λόγος). بناءً عليه، فإن مَنْطِقِيَّة تعبيرٌ اشتقاقي سليم يفيد الاتسام بالمنطق وقواعده، وهو مقبول أسلوباً وقياساً."

  # المرحلة ١أ — توليد أعمى انطلاقاً من التعريف (قبل الاطلاع على اللمّات)
  # أساس التوليد: التعريف «الاستدلال الصحيح والسليم»، الفوقة: «صفة جوهريّة ومميِّزة»
  blind_candidates:
    - lemma: "رَجَاحَة"
      generation_method: majaz
      justification: "الجذر رجح يدل على الرزانة والزيادة والوزن، ورجاحة العقل تعبير عربي راسخ بمعنى سلامة التفكير وصواب الحكم؛ يمكن إزاحتها دلالياً نحو صفة الاستدلال السديد."
    - lemma: "مَعْقُولِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من مَعْقُول (اسم مفعول من عقل) على وزن مَفْعُولِيَّة، يفيد خاصية الاتساق مع العقل والانتظام المنطقي، وهو وزن منتج للصفات المجردة في العربية المعاصرة."
    - lemma: "صَوَابِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من صَوَاب (= ضد الخطأ) على وزن فَعَالِيَّة بمعنى كون الشيء صواباً وسليماً؛ الجذر صوب يدل عند ابن فارس على 'نزول شيء واستقراره قراره'، ومنه الصواب في القول والفعل."
    - lemma: "تَعَقُّلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من تَعَقُّل (مصدر تفعّل من عقل) على تَفَعُّلِيَّة، يفيد خاصية إعمال العقل بصورة منتظمة ومنضبطة في الاستدلال."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# ميزانية الاستعلامات المستخدمة: ٥ استعلامات
# ١ — مطابقة دفعية (موجودة + مرشحات): منطقية، المنطقية، رجاحة، الرجاحة، معقولية، المعقولية، صوابية، الصوابية، تعقلية، التعقلية
# ٢ — الجسر الإنجليزي: logicality, logicalness, logical, rationality
# ٣ — البحث بالكلمات المفتاحية: منطق، منطقية، استدلال، معقولية
# ٤ — مطابقة مباشرة: منطقية، معقولية، عقلانية + إحضار entry_id=712019
# ٥ — مقاييس اللغة: نطق، عقل، صوب، رجح
stage2_evidence:
  per_lemma:
    - lemma: "مَنْطِقِيَّة"
      expands:
        - text: "«(1) مَنْطِقيّ (2) مَنْطِقيّ التفكير»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُثبت اشتقاق الصفة مَنْطِقِيّ من الجذر ذاته، مما يدعم صحة اشتقاق المصدر الصناعي مَنْطِقِيَّة."
        - text: "«النُّونُ وَالطَّاءُ وَالْقَافُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا كَلَامٌ أَوْ مَا أَشْبَهَهُ، وَالْآخَرُ جِنْسٌ مِنَ اللِّبَاسِ. الْأَوَّلُ الْمَنْطِقُ، وَنَطَقَ يَنْطِقُ نُطْقًا.»"
          source: "مقاييس اللغة، ابن فارس"
          addition: "يُرسّخ أصل الجذر نطق في دلالة الكلام، مما يجعل المنطق (= علم الكلام الصحيح والاستدلال) امتداداً دلالياً مشروعاً، وتكون مَنْطِقِيَّة المصدرَ الصناعي الصحيح لهذه الدلالة."

    - lemma: "رَجَاحَة"
      confirm:
        - text: "«الرجاحة: الحِلمُ والرَّزانةُ»"
          source: "المعجم الكبير، مجمع اللغة العربية"
      contradicts:
        - text: "«الرَّجاحة: الحِلْم»"
          source: "المعجم الوسيط، مجمع اللغة العربية"
          conflict: "المعاجم الحديثة الرصينة تحدد معنى الرجاحة بالحلم والرزانة، لا بالمنطقية أو صحة الاستدلال."
        - text: "«الرَّاءُ وَالْجِيمُ وَالْحَاءُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى رَزَانَةٍ وَزِيَادَةٍ ... وَقَوْمٌ مَرَاجِيحُ فِي الْحِلْمِ»"
          source: "مقاييس اللغة، ابن فارس"
          conflict: "الجذر رجح يدل على الرزانة والزيادة والحلم، لا على صحة الاستدلال المنطقي. الاستخدام المراد به 'رجاحة الرأي' موجود لكنه عبارة لا مصطلح."

    - lemma: "مَعْقُولِيَّة"
      expands:
        - text: "«(1) العقلانيّة: كون الشيء عقلانيًّا (2) المعقوليّة: كون الشيء معقولًا أو موافقًا للعقل (3) pl. عد: رأي أو معتقد أو عمل عقلانيّ»"
          source: "المورد الحديث (2008)، ترجمة rationality"
          addition: "يُثبت استخدام المعقوليّة في العربية المعاصرة بوصفها مصطلحاً لكون الشيء معقولاً أو موافقاً للعقل، وهو مفهوم قريب من المنطقية لكنه أعمّ منها."

    - lemma: "صَوَابِيَّة"
      expands:
        - text: "«الصَّادُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نُزُولِ شَيْءٍ وَاسْتِقْرَارِهِ قَرَارَهُ. مِنْ ذَلِكَ الصَّوَابُ فِي الْقَوْلِ وَالْفِعْلِ، كَأَنَّهُ أَمْرٌ نَازِلٌ مُسْتَقِرٌّ قَرَارَهُ. وَهُوَ خِلَافُ الْخَطَأِ.»"
          source: "مقاييس اللغة، ابن فارس"
          addition: "الجذر صوب يؤسس لمعنى الصواب ضد الخطأ في القول والفعل، مما يدعم صياغة صَوَابِيَّة مصدراً صناعياً، غير أن هذا المفهوم أوسع من المنطقية وأشمل."

    - lemma: "تَعَقُّلِيَّة"
      contradicts:
        - text: "«تعقّلية — translation_en: intellectualism — domain: Philosophy and Psychology»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "قاعدة البيانات تربط تعقّلية بـ'intellectualism' (العقلانية الفلسفية كمذهب)، وهو مفهوم مختلف عن المنطقية (logicality)."
        - text: "«الْعَيْنُ وَالْقَافُ وَاللَّامُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ مُطَّرِدٌ، يَدُلُّ عُظْمُهُ عَلَى حُبْسَةٍ فِي الشَّيْءِ أَوْ مَا يُقَارِبُ الْحُبْسَةَ. مِنْ ذَلِكَ الْعَقْلِ، وَهُوَ الْحَابِسُ عَنْ ذَمِيمِ الْقَوْلِ وَالْفِعْلِ.»"
          source: "مقاييس اللغة، ابن فارس"
          conflict: "أصل العقل في المقاييس هو الحبس والكبح عن الذميم، لا قواعد الاستدلال المنطقي بالمعنى الفلسفي الفني؛ مما يُشير إلى أن تعقلية تخدم مفهوم التروي والتبصر أكثر من المنطقية."


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مَنْطِقِيَّة"
      decision: confirmed
      decision_reason: "لمّة قياسية على وزن المصدر الصناعي (فَعَلِيَّة المنسوبة) من الصفة مَنْطِقِيّ، وهي بناء عربي اشتقاقي صحيح مستخدَم في الكتابة الفلسفية والعلمية الحديثة لتعبير 'logicality'. لا تعارض معجمي مباشر، والاشتقاق مطّرد."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المَنْطِقِيَّة تنصبّ تحديداً على الامتثال لقواعد المنطق الصوري وصحة الاستدلال وفق مبادئه، وتتمايز بذلك عن مَعْقُولِيَّة (التي تعني الموافقة للعقل عموماً)، وعن رَزَانَة (التي تعني ضبط النفس)، وعن صَوَاب (الذي يعني مجرد الصحة ضد الخطأ)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنْطِقِيَّة"

    - lemma: "رَجَاحَة"
      source: stage1
      decision: removed
      decision_reason: "المعاجم الحديثة الموثوقة (الوسيط، الكبير) وابن فارس في المقاييس تجمع على أن الرجاحة تعني الحِلم والرزانة، لا صحة الاستدلال. رجاحة العقل عبارةٌ وصفية حرة وليست مصطلحاً مسكوكاً لمفهوم المنطقية. لا تجتاز اختبار السكّ."

    - lemma: "مَعْقُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المَعْقُولِيَّة ترادف في الاستخدام المعاصر 'rationality' (العقلانية/المعقولية)، وهو مفهوم أعمّ من المنطقية. المجموعة الترادفية هنا تخص logicality تحديداً (الامتثال لقواعد المنطق) لا العقلانية العامة. الإدراج يوسّع نطاق المجموعة خارج حدودها المفهومية."

    - lemma: "صَوَابِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الصَّوَابِيَّة تفيد خاصية الصواب ضد الخطأ، وهو مفهوم أشمل وأقل تخصصاً من المنطقية. كلمة 'صوابية' غير مُثبّتة في المعجمات كمصطلح مسكوك، واختبار التثبيت المعجمي لم يُسفر عن شاهد مباشر."

    - lemma: "تَعَقُّلِيَّة"
      source: stage1
      decision: removed
      decision_reason: "قاعدة بيانات ArabTerm ترصد 'تعقّلية' مرتبطةً بـ'intellectualism' في حقل الفلسفة وعلم النفس، وهو مذهب فلسفي مختلف عن مفهوم المنطقية. الاستخدام الموثّق يتعارض مع الدلالة المطلوبة."


