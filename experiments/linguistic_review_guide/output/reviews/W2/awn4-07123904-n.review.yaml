# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «حديث» مشتركة لفظياً اشتراكاً بالغاً بين معنى «الحديث النبوي الشريف» ومعنى «الكلام والخبر العام»، مما يُفضي إلى التباس دلالي حاد في السياق الديني والثقافي العربي"
      - "اللمّة «لغة منطوقة» مركب وصفي (اسم + اسم مفعول) يحتاج إلى التحقق من درجة تثبيته المعجمي وحدةً اصطلاحيةً مستقلة"
      - "التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي، يفتقر إلى صياغة المعجم العربي (جنس قريب + فصل نوعي) وفق أسلوب المعجم الوسيط"
      - "غياب مصطلح «تواصل شفهي» الذي يرد في المعجمية العربية الموحدة مدخلاً اصطلاحياً ثابتاً مقابل oral communication"
    observations: >-
      المجموعة تُمثّل مفهوماً لسانياً أساسياً هو نمطُ التواصل الإنساني المعتمِد على الأصوات اللغوية المنطوقة.
      اللمّة المحورية «كلام» هي الأوفر حظاً لغةً وتراثاً؛ إذ تشمل الأصوات المفيدة والمعنى التواصلي في آنٍ واحد،
      وتُثبتها جميع المعجمات الكبرى. أما «حديث» فمتوتر الدلالة بين المعنى العام (الكلام) والمعنى الاصطلاحي
      الطاغي (الحديث النبوي)، ولا يصلح لمّةً للمفهوم اللغوي العام دون إيجاد قيد. أما «لغة منطوقة» فمصطلح
      لساني مقابل «اللغة المكتوبة» ومستخدم في الدراسات اللغوية. كذلك تبرز الحاجة إلى إدراج «تواصل شفهي»
      لتغطية الدلالة التقنية-التواصلية المعاصرة المُدرجة في معجمية ALECSO.
  blind_candidates:
    - lemma: "نُطْق"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر «ن ط ق» على وزن فُعْل، يدلّ على إصدار الأصوات اللغوية بجهاز الكلام الإنساني؛ مناسب للدلالة على الكلام الشفهي بوصفه عملية صوتية واعية"
    - lemma: "تَخَاطُب"
      generation_method: ishtiqaq
      justification: "مصدر تفاعُل من الجذر «خ ط ب» على وزن تَفَاعُل الدال على الاشتراك والتبادل، يُلتقط من خلاله الطابع التواصلي التبادلي الوارد في التعريف (communication)"
    - lemma: "تَلَفُّظ"
      generation_method: ishtiqaq
      justification: "مصدر تفعُّل من الجذر «ل ف ظ»، يدل على فعل إصدار الألفاظ الصوتية من الفم، وهو ملائم للدلالة على التعبير الشفهي باعتباره أداءً صوتياً"
    - lemma: "تَوَاصُل شِفَاهِيّ"
      generation_method: tarkib
      justification: "مركب وصفي: «تواصل» (مصدر تفاعُل من وصل، يدل على الاتصال المتبادل) + «شفاهي» (نسبة إلى الشفاه)؛ يُعبّر مباشرةً عن التواصل القائم على الكلام المنطوق بالفم. المركب ذو بنية إضافية-وصفية واضحة ومستوفٍ شرط الوحدة الاصطلاحية"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "حَدِيث"
      confirm:
        - text: "«كلُّ ما يُتحدَّث به من كلام وخبر»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(الحَدِيث) كلُّ مَا يتحدث به من كلام وخبر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الحديثُ في اللغة ضدّ القديم لأنه يحدث شيئاً فشيئاً، وقد ورد: إياك والحديث، ويُستعمل في قليل الكلام وكثيره»"
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: "«الحَدِيث: قَوْلُ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الاستعمال الاصطلاحي الغالب لـ«الحديث» في التراث العربي والسياق الديني يُحيل إلى الحديث النبوي، لا إلى الكلام الشفهي عموماً"
        - text: "«الحديث: يطلق على قول النبي صلى الله عليه وسلم وفعله وتقريره، وكذا يطلق على قول الصحابي والتابعي»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "التعريف الاصطلاحي يُقيّد «الحديث» بالموروث النبوي/الفقهي دون الكلام العام"
      expands:
        - text: "«(حَدَثَ) الْحَاءُ وَالدَّالُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ كَوْنُ الشَّيْءِ لَمْ يَكُنْ... وَالْحَدِيثُ مِنْ هَذَا؛ لِأَنَّهُ كَلَامٌ يَحْدُثُ مِنْهُ الشَّيْءُ بَعْدَ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يُؤصّل اشتقاق «حديث» من معنى الحدوث ويُصرّح بأنه في الأصل كلام، غير أن التطور الاستعمالي رسّخ المعنى الاصطلاحي الديني الطاغي"

    - lemma: "كَلَام"
      confirm:
        - text: "«في أصل اللغة: الأصوات المفيدة؛ عند المتكلمين: المعنى القائم بالنفس الذي يُعبَّر عنه بألفاظ»"
          source: "المعجم الوسيط"
        - text: "«(الكَلامُ) في أصل اللغة الأصوات المفيدة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الكَلامُ: القولُ، أو ما كان مُكتفياً بنفسه»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(كَلَمَ) الْكَافُ وَاللَّامُ وَالْمِيمُ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى نُطْقٍ مُفْهِمٍ، وَالْآخَرُ عَلَى جِرَاحٍ. فَالْأَوَّلُ الْكَلَامُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الكلام: [في الإنكليزية] Talk, speech, speaking [في الفرنسية] Parole, propos, dire, langage, discours»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«كلام» [translation_en: speech] — domain: Education"
          source: "مسرد التربية، ALECSO (ArabTerm)"

    - lemma: "لُغَة مَنْطُوقَة"
      confirm:
        - text: "«لغة التخاطب: لغة شفهية تُستعمل في الحياة اليومية، وتختلف قليلاً أو كثيراً عن اللغة الفصحى» [translation_en: spoken language]"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«(نَطَقَ) النُّونُ وَالطَّاءُ وَالْقَافُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا كَلَامٌ أَوْ مَا أَشْبَهَهُ»"
          source: "مقاييس اللغة لابن فارس (جذر: نطق)"
          addition: "يُؤصّل الجذر الاشتقاقي للمكوّن الوصفي «منطوقة» ويُثبت ارتباطه الأصيل بمعنى الكلام، فيُشرّع الاستعمال التقني للمركب"

    - lemma: "نُطْق"
      confirm:
        - text: "«النُّطْق: اللفظُ بالقول؛ الفهمُ وإدراكُ الكليات»"
          source: "المعجم الوسيط"
        - text: "«المَنطِقُ: الكلامُ. وقد نَطَقَ يَنطِقُ نُطقاً»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«(ن ط ق): المنطق: الكلام. نطق بكذا نطقاً ومنطقاً»"
          source: "المحكم والمحيط الأعظم لابن سيده"
      contradicts:
        - text: "«النطق يطلق على النطق الخارجي وهو اللفظ وعلى النطق الداخلي الذي هو إدراك الكليات... والمرادُ بالنطق في «حيوان ناطق» هي القوةُ الموجودةُ في خيال الإنسان»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "يدل «النطق» على القدرة الإنسانية أو فعل الإصدار الصوتي وإدراك الكليات، وليس على نمط التواصل الشفهي بوصفه نوعاً من التواصل"
        - text: "«النطق: الأصوات المقطعة التي يظهرها الإنسان، ولا يكاد يقال إلا للإنسان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "يُحيل إلى القدرة الإنسانية على الكلام لا إلى التواصل الشفهي كنمط تواصلي"

    - lemma: "تَخَاطُب"
      confirm:
        - text: "«تَخَاطَبَ: تَكَالَمَا وتَحَادَثَا»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      expands:
        - text: "«لغة التخاطب: لغة شفهية تُستعمل في الحياة اليومية» [translation_en: spoken language]"
          source: "مسرد الإعلام والتواصل، ALECSO"
          addition: "ورد «التخاطب» مكوّناً في مركب «لغة التخاطب» للدلالة على الكلام الشفهي اليومي، لكنه في مركب إضافي لا مستقلاً"
      contradicts:
        - text: "«(خَطَبَ) الْخَاءُ وَالطَّاءُ وَالْبَاءُ أَصْلَانِ: أَحَدُهُمَا الكَلَامُ بَيْنَ اثْنَيْنِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "التخاطب يُشير إلى التبادل الكلامي بين طرفين، وهو بهذا أخصّ من مفهوم التواصل الشفهي العام الذي يشمل الخطاب الأحادي والجماعي"

    - lemma: "تَلَفُّظ"
      confirm:
        - text: "«(التَّلَفُّظ) تموجات هوائية مصدرها في الغالب الحنجرة تُشكِّلها أعضاء الصوت. (مج)»"
          source: "المعجم الوسيط"
        - text: "«تلفظ: فعل الأداء الكلامي في استعمال اللغة، ينتج عنه كلام أو قول مفيد بالقصد. إنه فعل الإبداع لدى المتكلم» [translation_en: Enunciation]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«تلفظ: مجموع حركات أعضاء جهاز التصويت التي تحدد شكل مختلف المرانين خلال خروج الهواء من الحنجرة» [translation_en: Articulation]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "استعمل المعجم الموحد «التلفظ» مرادفاً لـ Articulation (الأداء الصوتي الفونيتيكي)، وهو مصطلح تقني أضيق من مفهوم التواصل الشفهي"
        - text: "«(لَفَظَ) اللَّامُ وَالْفَاءُ وَالظَّاءُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى طَرْحِ الشَّيْءِ؛ وَغَالِبُ ذَلِكَ أَنْ يَكُونَ مِنَ الْفَمِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "أصل الجذر «طرح الشيء من الفم» يُحيل إلى الفعل الصوتي لا إلى منظومة التواصل"

    - lemma: "تَوَاصُل شِفَاهِيّ"
      confirm:
        - text: "«تواصل شفهي: طريقة تعتمد الكلام في التواصل» [translation_en: oral communication]"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«(وَصَلَ) الْوَاوُ وَالصَّادُ وَاللَّامُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ضَمِّ شَيْءٍ إِلَى شَيْءٍ حَتَّى يَعْلَقَهُ»"
          source: "مقاييس اللغة لابن فارس (جذر وصل — للمكوّن تواصل)"
        - text: "«(فَوَهَ) الْفَاءُ وَالْوَاوُ وَالْهَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَفَتُّحٍ فِي شَيْءٍ... فَاهَ الرَّجُلُ بِالْكَلَامِ يَفُوهُ بِهِ إِذَا لَفَظَ بِهِ»"
          source: "مقاييس اللغة لابن فارس (جذر فوه — دلالة الشفاه والكلام المنطوق)"


# ── المرحلة ٣: التحليل اللغوي للمات ───────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حَدِيث"
      decision: removed
      decision_reason: >-
        رغم أن «حديث» يعني لغةً «كلَّ ما يُتحدَّث به»، فإن الاستعمال الراسخ في التراث العربي والثقافة
        الإسلامية قيَّده بمعنى الحديث النبوي الشريف، وهو المعنى الغالب في المعجمات الاصطلاحية كلها.
        استخدامه لمّةً للمفهوم اللغوي العام «التواصل الشفهي» يُفضي إلى التباس دلالي حاد. فضلاً عن
        أن «حديث» يدلّ على الحدث الكلامي (instance) لا على نمط التواصل (type)، وهو ما يختلف
        عن بقية لمّات المجموعة (كلام — لغة منطوقة — تواصل شفهي) التي تدل على النمط أو النظام.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كَلَام"
      decision: confirmed
      decision_reason: >-
        اللمّة المحورية للمجموعة؛ تُثبتها جميع المعجمات الكبرى على المعنى الأصيل «الأصوات المفيدة»
        وتُوثّقها مقاييس اللغة لابن فارس بالجذر «نطق مُفهِم». وهي الأعمّ في المجموعة وتُغطّي
        مفهوم التواصل الشفهي بدلالته اللغوية الشاملة كلاسيكياً ومعاصراً. لا تشكيل في السجل الحالي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على الكلام بوصفه نظاماً صوتياً مُفيداً؛ الأعمّ والأشمل في المجموعة، يشمل أي تعبير شفهي دون تحديد قناة أو وظيفة أو مستوى رسمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَلَام"

    - lemma: "لُغَة مَنْطُوقَة"
      decision: confirmed
      decision_reason: >-
        مصطلح لساني مُستقر يُقابل «اللغة المكتوبة» في الدراسات اللغوية ويُحيل بدقة إلى اللغة
        في صورتها الصوتية المنطوقة. المعجمية العربية الموحدة تستعمل «لغة التخاطب» كمرادف له
        مع تصريح بـ translation_en: spoken language. المركب ثابت معجمياً لأن «منطوقة» لا يمكن
        استبدالها بـ«ملفوظة» أو «محكية» دون تغيير الحقل الدلالي (لغة محكية → dialectal/colloquial).
        لا تشكيل كامل في السجل الحالي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُشدّد على البُعد النظامي للغة المنطوقة بوصفها ضِدَّ اللغة المكتوبة؛ أخصّ من «كلام» إذ يُحيل إلى اللغة كنظام (system) لا كفعل أو حدث"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُغَة مَنْطُوقَة"

    - lemma: "نُطْق"
      source: stage1
      decision: removed
      decision_reason: >-
        يدل على قدرة الكلام الإنسانية أو فعل الإصدار الصوتي، ولا يُحيل إلى نمط التواصل كنوع.
        أضاف المعجميون معنى «الفهم وإدراك الكليات» مما يُوسّع دلالته لتشمل الذكاء الإنساني لا
        التواصل الشفهي وحده. كذلك يُوظَّف «النطق» في المعجمية المعاصرة في مجال علم الأصوات
        وعلاج النطق (speech pathology) لا في التواصل اللغوي العام.
      evidence_assessment:
        case: mixed

    - lemma: "تَخَاطُب"
      source: stage1
      decision: removed
      decision_reason: >-
        يدل على التبادل الكلامي المتبادل بين طرفين (وزن تفاعل يحمل معنى المشاركة)، وهو أخصّ
        من مفهوم المجموعة الذي يشمل الكلام الشفهي عموماً سواء أكان حواراً ثنائياً أم خطاباً
        جماهيرياً أم رواية شفهية. ورود «لغة التخاطب» في ALECSO لا يُثبت «تخاطب» منفرداً للمعنى.
      evidence_assessment:
        case: mixed

    - lemma: "تَلَفُّظ"
      source: stage1
      decision: removed
      decision_reason: >-
        خصّصت المعجمية العربية المعاصرة «التلفظ» مصطلحاً في علم الأصوات والتداولية يُقابل
        Articulation وEnunciation، فهو يُحيل إلى الأداء الصوتي الفونيتيكي أو حدث الأداء الكلامي
        (فعل التلفظ) لا إلى التواصل الشفهي كنمط أو نوع تواصلي. التعارض مع المعنى المطلوب
        اصطلاحي راسخ في أكثر من معجم موحَّد.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَوَاصُل شِفَاهِيّ"
