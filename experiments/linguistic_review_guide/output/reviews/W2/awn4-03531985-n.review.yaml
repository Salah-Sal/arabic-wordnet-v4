# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-03531985-n
# golf hole: one playing period (from tee to green) on a golf course
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «حفرة» تدلّ في العربية على المكان المحفور في الأرض حصراً، ولا تحمل أيّ دلالة زمنية أو دلالة «فترة لعب»، فاستعمالها هنا نقلٌ حرفي للمجاز الإنجليزي (hole → playing unit) دون سند عربي"
      - "المركّب «حفرة جولف» ليس وحدة معجمية مثبتة في أيّ معجم عربي متخصص بالرياضة"
      - "التعريف العربي الحالي يقول «فترة لعب واحدة» وهو وصف دقيق للمفهوم، لكنه لا يتوافق مع دلالة «حفرة» الحسّية"
    observations: "المفهوم المستهدف هو وحدة اللعب الأساسية في رياضة الجولف، وهي المسافة من نقطة الانطلاق (tee) إلى المنطقة الخضراء (green) وما يرافقها من ضربات. في الإنجليزية استُعمل لفظ hole مجازاً من باب تسمية الكلّ بالجزء (المرمى الصغير ← مجمل اللعبة). الترجمة العربية «حفرة» نقلت الدالّ الحسّي دون المجاز. الأقرب عربياً استعمال لفظ يدلّ على وحدة لعب أو جولة."
  blind_candidates:
    - lemma: "جَوْلَة"
      generation_method: majaz
      justification: "من جذر ج و ل الدالّ على الدوران، وقد استُعملت «الجَوْلَة» في المعجم الكبير بمعنى وحدة اللعب (round) في الملاكمة والمصارعة، فيصحّ توسيعها لتشمل وحدة اللعب في الجولف"
    - lemma: "شَوْط"
      generation_method: majaz
      justification: "الشَّوْط في العربية هو الجري مرّة إلى الغاية، ثمّ صار يُستعمل لفترة اللعب في الرياضات المختلفة (شوط المباراة)، فيصحّ استعماله لوحدة اللعب في الجولف"
    - lemma: "مَسْلَكُ الجُولْف"
      generation_method: tarkib
      justification: "مركّب إضافي من «مَسْلَك» (على وزن مَفْعَل من سلك) بمعنى الطريق المسلوك، يدلّ على المسار الذي يسلكه اللاعب من نقطة الانطلاق إلى الحفرة"
    - lemma: "هُول"
      generation_method: taarib
      justification: "تعريب للّفظ الإنجليزي hole بإدخاله على وزن فُعْل، كملاذ أخير إذا لم يُقبل بديل عربي"

stage2_evidence:
  per_lemma:
    - lemma: "حُفْرَة"
      confirm:
        - text: "«ما يحفر في الأرض وغيرها»"
          source: "المعجم الوسيط"
        - text: "«ما يُحْفَرُ في الأرْضِ. وهو جزءٌ من الأرْضِ نُزِعَ تُرَابُه فانْخَفَض»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«ما يحفر في الأرض وغيرها» — التعريف المعجمي يقتصر على المعنى الحسّي (مكان محفور) ولا يتضمّن دلالة «فترة لعب» أو «وحدة مسابقة»"
          source: "المعجم الوسيط"
          conflict: "حُفْرَة في المعاجم العربية تعني المكان المادّي المحفور حصراً، ولا دليل على استعمالها بمعنى وحدة لعب رياضية"
      expands:
        - text: "«وَكُنْتُمْ عَلَى شَفَا حُفْرَةٍ مِنَ النَّارِ فَأَنْقَذَكُمْ مِنْهَا» (آل عمران/١٠٣)"
          source: "المعجم الكبير — شاهد قرآني"
          addition: "الشاهد القرآني يؤكّد الاستعمال الحسّي/المكاني للحفرة"

    - lemma: "حُفْرَةُ جُولْف"
      evidence_status: "no_material_found"

    - lemma: "جَوْلَة"
      confirm:
        - text: "«(في الملاكمة والمصارعة) round: وحدة اللَّعب الأصلىّ في المباراة، مدَّتُها ثلاثُ دقائق، يَعْقُبُها راحةٌ مدَّتُها دقيقة»"
          source: "المعجم الكبير"
      expands:
        - text: "«(جَوَلَ) الْجِيمُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ الدَّوَرَانُ. يُقَالُ جَالَ يَجُولُ جَوْلًا وَجَوَلَانًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الدوران والتنقّل، ممّا يناسب مفهوم المرور عبر مسار اللعب"

    - lemma: "شَوْط"
      evidence_status: "no_material_found"

    - lemma: "مَسْلَكُ الجُولْف"
      evidence_status: "no_material_found"

    - lemma: "هُول"
      contradicts:
        - text: "«(هَوَلَ) الْهَاءُ وَالْوَاوُ وَاللَّامُ: كَلِمَتَانِ تَدُلُّ إِحْدَاهُمَا عَلَى مَخَافَةٍ، وَالْأُخْرَى عَلَى تَحْسِينٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "جذر هول يدلّ على المخافة والفزع، فتعريب hole بـ«هُول» يوقع في اشتراك لفظي مع لفظ عربي راسخ تماماً"
        - text: "«الهَوْلُ: المخافة من الأَمر لا يَدْرى ما يَهْجِم عليه منه»"
          source: "لسان العرب لابن منظور"
          conflict: "اللفظ مشغول بدلالة الفزع في التراث العربي كلّه"

stage3_analysis:
  per_lemma:
    - lemma: "حُفْرَة"
      decision: confirmed
      decision_reason: "رغم أنّ الدلالة الأصلية حسّية (مكان محفور)، فإنّ لفظ «حفرة» قد شاع في الإعلام الرياضي العربي المعاصر بمعنى وحدة اللعب في الجولف — على سبيل المجاز المرسل (تسمية الكلّ بالجزء) نقلاً عن الإنجليزية. يُبقى عليه مع التنبيه على أنّه اقتراض مفهومي (calque)"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الحفرة المادّية التي تكون هدفاً للكرة، ومنها توسّعت مجازاً لتشمل كامل وحدة اللعب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُفْرَة"

    - lemma: "حُفْرَةُ جُولْف"
      decision: removed
      decision_reason: "مركّب وصفي غير مثبت في أيّ معجم عربي. لا يضيف دلالياً على «حفرة» وحدها في سياق الجولف، بل يُثقل التعبير. لا يجتاز اختبار التثبيت المعجمي. كما أنّ «جولف» نفسها صفة أعجمية لا تتصرّف"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "جَوْلَة"
      source: stage1
      decision: confirmed
      decision_reason: "ثبت في المعجم الكبير استعمال «الجَوْلة» بمعنى وحدة اللعب (round) في الملاكمة، والجذر ج و ل يدلّ على الدوران والتنقّل. توسيعها لتشمل وحدة اللعب في الجولف مجاز منتظم ومقبول لغوياً، وهي أقرب إلى المعنى المستهدف (فترة لعب) من «حفرة»"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على البُعد الزمني/الإجرائي لوحدة اللعب (جولة = دورة لعب واحدة)، بينما «حفرة» تركّز على الهدف المادّي"
      actions:
        - command: create_entry
          params: {lemma: "جَوْلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-03531985-n"}

    - lemma: "شَوْط"
      source: stage1
      decision: removed
      decision_reason: "الشَّوْط في الاستعمال الرياضي المعاصر يدلّ على نصف المباراة أو فترة زمنية طويلة نسبياً (شوط أوّل/ثانٍ)، بينما المفهوم المستهدف وحدة أصغر (واحدة من 9 أو 18). كما أنّ «الشوط» مشغول بدلالة النصف في كرة القدم وغيرها"

    - lemma: "مَسْلَكُ الجُولْف"
      source: stage1
      decision: removed
      decision_reason: "مركّب إضافي غير مثبت معجمياً، و«مسلك» يدلّ على الطريق/المسار المادّي لا على وحدة اللعب الزمنية. لا يجتاز اختبار السكّ"

    - lemma: "هُول"
      source: stage1
      decision: removed
      decision_reason: "اشتراك لفظي خطير مع «هَوْل» (الفزع) الراسخ في العربية منذ الجاهلية. التعريب يُربك المتلقّي ويولّد لبساً غير مقبول"

  synset_actions:
