    reason: "التعريف الحالي ترجمة حرفية وركيكة، ويحتاج إلى صياغة معجمية أدق تبين طبيعة الأداء الفني أمام الجمهور."
  authored_definitions:
    - type: terminological
      text: "الشخص الذي يقوم بعرض أو أداء عمل فني، كالتمثيل أو العزف أو الغناء، لتقديمه للجمهور."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
