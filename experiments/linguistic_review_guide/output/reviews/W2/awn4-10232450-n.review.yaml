step05_lemma_generation:
  knowledge_candidates:
    - lemma: "فَنَّان مُؤَدٍّ"
      justification: "التركيب: مركب وصفي يجمع بين الفنان وطبيعة عمله كونه مؤدياً وليس مبدعاً أصلياً للعمل."
  generation_notes: "المصطلح الإنجليزي interpreter أو performer هنا يقصد به من يؤدي العمل الفني كالعازف أو الممثل، لذا فإن اللمة (مؤد) هي الأنسب وتكفي."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُؤَدٍّ"
      decision: confirmed
      decision_reason: "مصطلح فصيح ودقيق ومستقر للدلالة على من يقوم بتأدية الأعمال الفنية كالموسيقى والتمثيل."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اسم فاعل مطلق يدل على كل من يمارس العرض أو الأداء الفني أمام الجمهور."
      example: "نال المُؤَدِّي تصفيقاً حاراً بعد انتهائه من عرض المسرحية."
    - lemma: "مُعَبِّر فَنِّيّ"
      decision: removed
      decision_reason: "مركب وصفي حر وليس مصطلحاً مسكوكاً، ويبدو أنه ترجمة حرفية (calque) غير دقيقة للمفهوم."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "تعبير غير اصطلاحي يفتقر إلى الشيوع والاستقرار."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "فَنَّان مُؤَدٍّ"
      source: step05
      decision: removed
      decision_reason: "مركب وصفي حر، ويمكن الاكتفاء بكلمة (مؤد) للتعبير عن المفهوم بدقة وتطرد في الاستعمال المتخصص."
      step05_citation: "توليد ذاتي (التركيب)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تخصيص للفنان بكونه مؤديا وليس مؤلفا أو مبدعا."

  synset_flags:
    definition_review_needed: true

