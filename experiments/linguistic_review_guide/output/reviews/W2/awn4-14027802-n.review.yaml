# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (حركة) خالية من التشكيل، مما يُعرِّضها لسوء القراءة أو الخلط مع أشكال أخرى."
      - "التعريف العربي يستخدم كلمة «الموقع» التي تحمل في العربية المعاصرة حِمْلَ الموقع الجغرافي والإلكتروني، وهو ما يُشوِّه الدقة؛ والأنسب «الموضع»."
      - "التعريف العربي «حالة التغير في الموقع» ترجمةٌ حرفية منقوصة للتعريف الإنجليزي «a state of change»، ولا يستحضر التراث المعجمي العربي الراسخ في تعريف الحركة (الخروج من القوة إلى الفعل / شغل حيّز بعد أن كان في حيز آخر)."
      - "المجموعة تقتصر على لمّة واحدة، مع أن المفهوم الفيزيائي (الحركة بوصفها حالة التغيّر في الموضع) يستوعب ألفاظاً أخرى تستحق الفحص كالانتقال والتحرّك."
    observations: >
      المجموعة تمثّل المفهومَ الفيزيائي العام للحركة بوصفها حالةً مستمرة تتميّز بتغيُّر موضع الجسم، وهو
      أعمُّ مما تُعبِّر عنه أنواع الحركة المحددة (خطية، دورانية، اهتزازية). الفرق الدلالي الرئيسي بين
      «حَرَكَة» و«انتقال» هو أن الأول حالة مستمرة والثاني فعل تحوُّل من نقطة إلى أخرى. الأبُ (hypernym)
      «حَالَة» مناسب تماماً. ينبغي مراجعة التعريف بأسلوب المعجم الوسيط.

  blind_candidates:
    - lemma: "تَحَرُّك"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر حَرَكَ على وزن تَفَعُّل الدال على الدخول في الحالة وإظهارها. يُعبِّر عن
        الانتقال من حالة الثبات إلى حالة الحركة، وهو ما يلتقي مع مفهوم «حالة التغيّر في الموضع».
    - lemma: "سَيَلَان"
      generation_method: majaz
      justification: >
        إزاحة دلالية من المعنى الأصلي (جريان الماء) إلى مفهوم أعمّ للتدفق والامتداد المكاني. من
        الجذر سَيَلَ، على وزن فَعَلَان الدال على الحركة المستمرة. يمكن تمديد دلالته مجازاً لحالة
        التغيّر المستمر في الموضع.
    - lemma: "حَرَكِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي (-ية) من «حَرَكِيّ» النسبة إلى حركة، يحوّل الوصف إلى مفهوم مجرّد يدلّ
        على حالة كون الشيء في حركة. وزنٌ منتج في العربية المعاصرة للمفاهيم التجريدية.
    - lemma: "انْتِقَال"
      generation_method: ishtiqaq
      justification: >
        من الجذر نَقَلَ على وزن افْتِعَال، يدل على التحوّل من حيّز إلى حيّز آخر وهو ما يقابل
        «a state of change» في سياق تغيّر الموضع. وَرَدَ في معاجم الاصطلاح الفلسفي بمعنى
        «حصول الشيء في حيّز بعد أن كان في حيّز آخر» وهو تعريف الحركة الأينية بالذات.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "حَرَكَة"
      confirm:
        - text: >
            «تَغَيُّرٌ مُتَّصِلٌ, ذُو سُرْعَةِ مُعَيَّنَةٍ, لوَضْعِ الشيء في المكان, وهو للدَّلالَةِ
            على الزَّمان. وتُطْلَقُ الكلمة مَجازاً على حَرَكاتِ النَّفْسِ والذَّهْنِ والحركاتِ
            الاجتماعية. (عند الفلاسفة): ضِدُّ السُّكونِ, وهي الانتقالُ مِنْ مكان إلى مكان,
            والاستحالةُ مِنْ كَيْفِيَّةٍ إلى كَيْفِيَّةٍ»
          source: "المعجم الكبير (OCR)"
        - text: >
            «(في العرف العام): انتقال الجسم من مكان إلى مكان آخر, أو انتقال أجزائه كما في
            حركة الرَّحَى»
          source: "المعجم الوسيط (OCR)"
        - text: >
            «الحركة: الخروج من القوة إلى الفعل على سبيل التدريج، وقيل: هي شغل حيز بعد
            أن كان في حيز آخر، وقيل هي كونان في آنين في مكانين كما أن السكون كونان في
            آنين في مكان واحد»
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: >
            «الحركة: بفتح الحاء والراء المهملة في العرف العام النقل من مكان إلى مكان»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: >
            «(الحركة) (في العرف العام) انتقال الجسم من مكان إلى مكان آخر أو انتقال أجزائه
            كما في حركة الرحى»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«حركة» = motion"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (ARABTERM، مجال Physics)"
        - text: "«حركة» = motion"
          source: "مسرد الفن، التسلية والرياضة — ARABTERM"
        - text: "«حركة» = movement"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (ARABTERM)"
      expands:
        - text: >
            «(في علم الصوت): كيفية عارضة للصوت وهي الضم والفتح والكسر؛ ويقابلها السكون»
          source: "المعجم الوسيط (OCR)"
          addition: "توسيع دلالي بالنقل إلى علم الأصوات؛ يؤكد التضاد الجوهري بين الحركة والسكون."
        - text: >
            «الحركة في الكم: هي انتقال الجسم من كمية إلى أخرى، كالنمو والذبول.
            الحركة في الكيف: هي انتقال الجسم من كيفية إلى كيفية أخرى»
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يُفصِّل أنواع الحركة عند الفلاسفة (كمية، كيفية، أينية)، مما يوسِّع فهم المفهوم."
        - text: >
            «الحركة الأينية المسماة بالنقلة... لا تطلق الحركة عند المتكلمين إلا على هذه
            الحركة الأينية»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُبيِّن أن المفهوم المقصود في المنطق الكلامي هو تحديداً «الحركة الأينية» أي الانتقال المكاني."

    - lemma: "تَحَرُّك"
      confirm:
        - text: "«تَحَرُّك» = locomotion"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "«تَحَرُّك» = locomotion"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — ARABTERM"
        - text: "«تحرك» = locomotion"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC — ARABTERM"
      contradicts:
        - text: "«تحرَّك: حَرُك في قوَّة»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            يُعرَّف باعتباره فعلاً لا اسماً للحالة؛ الوزن تَفَعُّل يدل على الحدث لا
            على الحالة الدائمة. فضلاً عن ذلك تقتصر شواهد ARABTERM على "locomotion"
            (الحركة الحيوية للكائنات) لا على المفهوم الفيزيائي العام للحركة.
        - text: "«تحرّك: حرُك في قوة»"
          source: "المعجم الكبير (OCR)"
          conflict: "يؤكد أن المدخل صفة/فعل لا اسم حالة."

    - lemma: "سَيَلَان"
      confirm:
        - text: >
            «السيلان: عبارة عن تدافع الأجزاء سواء كانت متفاصلة في الحقيقة ومتواصلة في
            الحسّ، أو كانت متواصلة في الحقيقة أيضاً»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«السَّيَلان: التهابُ المبال الجونوكُكِّي, وهو أحد الأمراض التناسلية»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            الدلالة الغالبة في المعاجم الحديثة هي المرض التناسلي (gonorrhea)، مما يجعل
            استخدامه مصطلحاً للحركة مثيراً للالتباس الشديد.
        - text: "«السيلان: ما يدخل من السيف والسكين في المقبض»"
          source: "المعجم الوسيط (OCR)"
          conflict: "معنى آخر راسخ لا صلة له بالحركة الفيزيائية."
        - text: "«سيلان» من (س ي ل): جريان الماء ونحوه، وكثرة إفراز السوائل"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الدلالة الأصلية خاصة بجريان السوائل، لا بالحركة الجسمانية العامة."

    - lemma: "حَرَكِيَّة"
      evidence_status: "no_material_found"

    - lemma: "انْتِقَال"
      confirm:
        - text: >
            «الانتقال: عند الحكماء حصول الشيء في حيّز بعد أن كان في حيّز آخر»
          source: "دستور العلماء للأحمدنكري"
        - text: >
            «الانتقال: في علم الكلام عبارة عن حصول الشيء في حيّز بعد أن كان في حيّز
            آخر. وهذا انتقال الجوهر»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«انتقال، نقل» = locomotion"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM"
      contradicts:
        - text: >
            «الانتقال: في علم الجدل هو أن ينتقل المستدل إلى استدلال غير الذي كان أخذ
            فيه، لكون الخصم لم يفهم وجه الدلالة من الأول»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            «الانتقال» في الاستعمال الاصطلاحي يحمل معاني متعددة (الجدل المنطقي، علم
            النجوم، القانون). وهو يدل على الحدث المنجز (انتقل من أ إلى ب) لا على الحالة
            المستمرة للتغيّر في الموضع.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حَرَكَة"
      decision: confirmed
      decision_reason: >
        حَرَكَة هي المصطلح الجامع الراسخ في التراث العربي للتعبير عن حالة التغيّر في الموضع.
        الأدلة المعجمية قاطعة من المعجم الوسيط والمعجم الكبير والتعريفات والكشاف، وجميعها
        تُثبت الدلالة على الانتقال المكاني للجسم. كما أن معاجم المصطلحات الحديثة (ARABTERM)
        في مجال الفيزياء وغيرها تُقابل «motion» و«movement» بـ«حركة» مباشرة. اللمّة تحتاج
        تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphology_check:
        pattern: "فَعَلَة"
        root: "حرك"
        fitness: >
          وزن فَعَلَة مناسب للأسماء الدالة على الحدث/الحالة. حَرَكَة تقابل فعلها حَرَكَ
          وتُعبِّر عن حالة الكون في الحركة، كما الحياة والمعرفة والإقامة.
      borrowing_check:
        type: native
        verdict: "لفظ عربي أصيل موثّق منذ أقدم معاجم اللغة."
      term_quality:
        consistency: "مطّرد في جميع المعاجم والاستعمالات العلمية والعامة."
        ease_of_use: "يسير التداول، مألوف في كل المستويات."
        fitness: "مُلائم تمام الملاءمة للمفهوم الفيزيائي."
        heritage_preference: "تراثي أصيل."
        arabic_preference: "عربي خالص من الجذر حَرَكَ."
        derivability: "يشتق منه: حركي، حركية، تحرُّك، مُتحرِّك، حرَّك."
      nuance_differentiation: >
        حَرَكَة هي الحالة العامة لتغيّر الموضع بمعناها الفيزيائي الجامع، تشمل كلّ أنواع
        الانتقال المكاني (خطي، دوراني، اهتزازي)، وتقابلها السُّكون تماماً. تتميّز عن
        «تَحَرُّك» الذي يدل على الحدث الآني للإقدام على التحرك لا على الحالة المستمرة،
        وعن «انتقال» الذي يدل على الانتقال من نقطة محددة إلى أخرى وليس على حالة التغيّر
        ذاتها، وعن «سَيَلَان» المختص بجريان السوائل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَرَكَة"

    - lemma: "تَحَرُّك"
      source: stage1
      decision: removed
      decision_reason: >
        تَحَرُّك مصدرُ الفعل تَحَرَّكَ (فعل تَفَعَّل) ويدل على الحدث لا على الحالة؛ أي أنه
        يُعبِّر عن فعل الدخول في الحركة لا عن حالة الكون فيها. فضلاً عن ذلك اختصّت
        معاجم ARABTERM باستخدامه مقابلاً لـ«locomotion» (حركة الكائنات الحية) لا لـ«motion»
        (الحركة الفيزيائية العامة). وفي الاستخدام المعاصر يرتبط غالباً بالسياق السياسي
        والعسكري (تحرك عسكري، تحرك دبلوماسي)، مما يُثقّله بدلالات إضافية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "سَيَلَان"
      source: stage1
      decision: removed
      decision_reason: >
        السيلان لفظ شديد التعدد الدلالي؛ أبرز معانيه في المعاجم الحديثة: (١) مرض السيلان
        الجنسي، (٢) الجزء الداخل من السيف في المقبض، (٣) جريان السوائل. لا يصلح مصطلحاً
        جامعاً للحركة الفيزيائية العامة. حتى في معنى «التدافع» عند التهانوي فإنه لا يُغطّي
        إلا نوعاً محدداً جداً من الحركة (الحركة الانسيابية للجسيمات).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "حَرَكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح غير موثَّق في المعاجم المعتمدة (لا أدلة). كما أن «حركية» في الاستعمال
        المعاصر تُوظَّف أحياناً مقابلاً لـ«kinetics» أو «dynamics» (علمَي حركة الأجسام)
        لا لمفهوم «حالة كون الجسم في حركة». يُفضي هذا الاستخدام إلى التباس مع الحقل
        المصطلحي الفيزيائي المتخصص.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "انْتِقَال"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن بعض معاجم الاصطلاح الفلسفي تُعرِّف الانتقال بـ«حصول الشيء في حيّز بعد أن
        كان في حيّز آخر» وهو قريب من المفهوم، إلا أن الانتقال يدل على الحدث المنجز
        (الانتقال من أ إلى ب) لا على الحالة المستمرة. فضلاً عن ذلك يُستعمل بكثرة في
        سياقات متعددة: انتقال الملكية، انتقال الحرارة، الانتقال في علم الجدل، انتقال الفصول؛
        مما يُضعف تخصيصيته.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


