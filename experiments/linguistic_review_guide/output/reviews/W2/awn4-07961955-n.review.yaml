  per_entry:
    - lemma: "مُوَاطِنُون"
      entry_id: "{auto}"
      root: "وطن"
      maqayis_quote: "«الْوَاوُ وَالطَّاءُ وَالنُّونُ: كَلِمَةٌ صَحِيحَةٌ. فَالْوَطَنُ: مَحَلُّ الْإِنْسَانِ.»"
    - lemma: "أَبْنَاءُ الوَطَنِ"
