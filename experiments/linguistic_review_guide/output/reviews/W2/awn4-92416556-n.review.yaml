# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92416556-n
# المفهوم: المسافة المقطوعة (mileage / kilometrage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحوي لمّة واحدة فقط (المسافة المقطوعة)، وهي مركب وصفي قد يُعدّ عبارة وصفية لا مصطلحاً مسكوكاً"
      - "التعريف يحصر القياس بالكيلومترات دون الإشارة إلى إمكانية القياس بوحدات أخرى كالأميال"
      - "لا يوجد مُعرّف ILI مما يُصعّب الربط بالشبكات الدلالية الأخرى"
    observations: "المفهوم يمثّل كمّيّة قياسية تدلّ على مقدار ما تسيره مركبة. في العربية المعاصرة تُستعمل عدة تعابير لهذا المفهوم منها «المسافة المقطوعة» و«الكيلومترات المقطوعة» و«كَمْتَرَة» (مولّدة من كيلومتر). المركب الوصفي «المسافة المقطوعة» شائع لكنّه أقرب إلى الوصف الحرّ منه إلى المصطلح الموحّد."
  blind_candidates:
    - lemma: "كَمْتَرَة"
      generation_method: taarib
      justification: "تعريب مصدري من «كيلومتر» على وزن فَعْلَلَة، يدلّ على مقدار الكيلومترات المقطوعة، على غرار «أَمْيَلَة» من ميل. مصطلح مولَّد مُستعمَل في معاجم النقل والسياحة."
    - lemma: "المَسَافَةُ المَقْطُوعَةُ"
      generation_method: tarkib
      justification: "مركب وصفي (اسم + اسم مفعول) يدلّ على البُعد الذي قطعته المركبة. تعبير شائع في لغة النقل والهندسة."
    - lemma: "عَدَدُ الأَمْيَالِ"
      generation_method: tarkib
      justification: "مركب إضافي يقابل المصطلح الإنجليزي mileage حرفياً. مستعمل في معاجم النقل كمقياس إحصائي للمسافة."
    - lemma: "مَدَى السَّيْرِ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع «مَدَى» (مقدار الامتداد) و«السير» (الحركة)، ليدلّ على المسافة التي تبلغها المركبة."

stage2_evidence:
  per_lemma:
    - lemma: "المَسَافَةُ المَقْطُوعَةُ"
      confirm:
        - text: "«مسافة مقطوعة — covered distance — distance parcourue»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«مسافة(ال..) المقطوعة — distance covered»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
      expands:
        - text: "«الكيلومترات المقطوعة: يُقصد بها في اللغة العامية الدارجة إجمالي مسافة السير التي قطعتها السيارة. ورغم أن هذا التوصيف مُتناقض في المعنى، لأن المقصود منه هو بيان القدرة من الناحية الفيزيائية، وليست المسافة المقطوعة في حد ذاتها، إلا أنه مُستخدم إلى حد بعيد.»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
          addition: "يوضح أن التعبير شائع الاستعمال وإن كان فيه تجوّز علمي"
        - text: "«(الْمسَافَة) الْبعد واشتهر اسْتِعْمَالهَا بِمَعْنى المساحة والمقدار وَقد تسْتَعْمل فِي الزَّمَان فَيُقَال مَسَافَة يَوْم أَو شهر وَالْمرَاد بعد أَرض يَقْتَضِي سفر يَوْم أَو شهر»"
          source: "المعجم الوسيط"
          addition: "يؤكد أن المسافة تدلّ على البُعد والمقدار"

    - lemma: "كَمْتَرَة"
      confirm:
        - text: "«كمترة مطلقة، أميال غير محددة — illimited mileage»"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm)"
        - text: "«كمترة قصوى، الأميال القصوى — maximum mileage»"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm)"
        - text: "«كمترة دنيا، كيلومترات دنيا، أميال دنيا — minimum mileage»"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm)"
      expands:
        - text: "«مكافأة كيلومترية، أميال إضافية مسموح بها — extra mileage allowance»"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm)"
          addition: "يُظهر استعمال الصفة «كيلومترية» كمرادف وصفي لـ «كمترة»"

    - lemma: "عَدَدُ الأَمْيَالِ"
      confirm:
        - text: "«عدد الأميال: قياس احصائي لحساب المسافة التي قطعتها مركبة بالفعل دون علاقة لذلك بالحد الأقصى للحمولة الفعلية (وحدة القياس: كيلو متر المركبة/ كم المركبات). كم المركبة تعطي معلومات عن كثافة الاستخدام لمركبات النقل ومدى خدمات النقل التي تم تحقيقها.»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      contradicts:
        - text: "«(1) التعويض المِيليّ: تعويض لتغطية نفقات السَّفَر بنسبة معيّنة في الميل الواحد (2) الطول أو المسافة بالميل (3) الرسم المِيليّ (4) منفعة.»"
          source: "المورد الحديث (2008)"
          conflict: "المورد يترجم mileage بعدة معانٍ ليس منها «عدد الأميال» كمصطلح ثابت، بل يستخدم صيغاً وصفية مختلفة"

    - lemma: "مَدَى السَّيْرِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "المَسَافَةُ المَقْطُوعَةُ"
      decision: confirmed
      decision_reason: "مركب وصفي مسجّل في عدة معاجم موحّدة (الرياضيات والفلك، علوم البحار) بمعنى المسافة التي قُطعت. وهو شائع في الاستعمال التقني العربي المعاصر ومفهوم بلا لبس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على المسافة كبُعد هندسي مقطوع، وهو الأعمّ في الاستعمال، يصلح للسياقات العلمية والعامة على السواء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "المَسَافَةُ المَقْطُوعَةُ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "كَمْتَرَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مولَّد مُستعمل في مسارد أليكسو (ArabTerm) في مركبات ثابتة (كمترة قصوى، كمترة دنيا، كمترة مطلقة) مما يدلّ على رسوخه مصطلحاً مستقلاً بمعنى مقدار الكيلومترات المقطوعة. يتميّز بالإيجاز (كلمة واحدة مقابل مركب)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مُولَّد موجز يدلّ تحديداً على المقدار الكمّي للكيلومترات، ويُستعمل في سياق النقل والسياحة خاصة"
      actions:
        - command: create_entry
          params: {lemma: "كَمْتَرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عَدَدُ الأَمْيَالِ"
      source: stage1
      decision: removed
      decision_reason: "رغم وروده في معجم النقل الموحّد، فإنه يفشل في اختبار السكّ: يمكن إبدال «الأميال» بـ«الكيلومترات» أو «الأمتار» وتبقى العبارة وصفية حرّة. كما أنّه مقيّد بوحدة الميل بينما المفهوم عامّ."

    - lemma: "مَدَى السَّيْرِ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تدعم هذا المركب بمعنى المسافة الكمّية المقطوعة. «مدى السير» يُفهم بمعنى أقصى مسافة يمكن قطعها (range) لا المسافة الفعلية المقطوعة (mileage)، فالفرق دلالي جوهري."

