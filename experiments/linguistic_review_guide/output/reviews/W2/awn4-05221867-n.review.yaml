stage3_analysis:
  per_lemma:
    - lemma: "بسط الساق"
      decision: confirmed
      decision_reason: >
        المركب الإضافي 'بسط الساق' موثَّق معجمياً في علم التشريح العياني كمصطلح حركي
        (البسط = extension بالمعنى التشريحي)، والجذر 'بسط' يحمل في الأصل اللغوي دلالة
        'امتداد الشيء'. رغم أنه يصف الفعل لا القدرة، إلا أنه متداول في اللغة الرقصية
        والطبية ويُكمِّل 'تمديد' من الناحية التعبيرية. يُبقى مع تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        'بسط الساق' يُبرز الطرف المحدد (الساق) وحركة انتشاره وانبساطه، يتضمن بُعد
        الفعل والتحقق الجسدي المحسوس، ويُستخدم في السياقات التشريحية والتعليمية
        التي تصف حركة مفصل محددة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَسْطُ السَّاقِ"

    - lemma: "تمديد"
      decision: confirmed
      decision_reason: >
        'تمديد' هو المصطلح الرسمي المعتمد في مسرد الفن والرياضة (ArabTerm) بترجمة
        مباشرة لـ extension، وهو موثَّق أيضاً في التشريح والطب بمعنى مد الأطراف.
        الجذر م-د-د يدل على 'جرّ الشيء في طول واتصاله باستطالة' (ابن فارس)، مما يجعله
        الأنسب للتعبير عن الخاصية الجوهرية في هذا المصطلح الرقصي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        'تمديد' يُركِّز على الخاصية الجوهرية والقدرة الكامنة (مدى القدرة على المد
        والإطالة)، وهو أعم من 'بسط الساق' إذ لا يقيِّد العملية بالساق، ويُستخدم
        في السياقات التقييمية والنقدية الرقصية (فلانة تملك تمديداً استثنائياً).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمْدِيد"

    - lemma: "الاِمْتِداد"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود 'الامتداد' كترجمة لـ extension في بعض المعاجم، إلا أن استخداماته
        الموثَّقة تنتمي إلى الجغرافيا والمعلوماتية والفلسفة، ولا يوجد تثبيت معجمي
        له في سياق الرقص أو التشريح الحركي. فضلاً عن ذلك، 'تمديد' يُغطِّي المعنى
        المطلوب بدقة أعلى وتثبيت أرسخ في المجال ذاته.

    - lemma: "الاِسْتِطالة"
      source: stage1
      decision: removed
      decision_reason: >
        'الاستطالة' موثَّقة حصراً في سياقات الهندسة المدنية والفيزياء والكيمياء
        بمعنى elongation (الإطالة المادية للمواد)، ولا يوجد أي شاهد على استخدامها
        في مجال الرقص أو التعبير عن القدرة الجسدية للراقص. الاستطالة لا تُقترب
        دلالياً من المصطلح الرقصي التقني.

    - lemma: "مَدُّ الأَطْرَاف"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُسجَّل 'مد الأطراف' كوحدة معجمية مستقلة ثابتة في أي معجم. اختبار
        السكّ يُظهر إمكانية إبدال 'الأطراف' بـ'الساق' أو 'اليد' فيبقى وصفاً
        دقيقاً لكنه ليس مصطلحاً مسكوكاً. 'بسط الساق' أكثر خصوصية ودقة.

    - lemma: "الاِنْبِسَاط"
      source: stage1
      decision: removed
      decision_reason: >
        'الانبساط' يحمل في المعجمية العربية الكلاسيكية والتراثية دلالات نفسية
        وروحانية غالبة (حال السرور والرضا في التصوف)، مما يجعله مُلتبساً دلالياً
        إذا استُعمل مصطلحاً حركياً. الجذر 'بسط' نفسه موظَّف في 'بسط الساق' بشكل
        أدق وأوضح في هذا السياق.


