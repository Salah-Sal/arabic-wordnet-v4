      ارتفاع كبير مع الحفاظ على الاتزان. الجذر الأصيل للمفهوم هو ب-س-ط ومدد، وكلاهما
      موثَّق في المعجمية العربية الكلاسيكية والحديثة بمعنى المد والانتشار الجسدي. اللمتان
      الموجودتان مترابطتان دلالياً من هذين الجذرين، غير أن توظيفهما يحتاج ضبطاً في
      السياق الرقصي. المفهوم يقع تحت المظلة التشريحية الحركية (حركة البسط) لكنه في
      الرقص يكتسب طابعاً جمالياً يُقاس بالارتفاع والخفة.

