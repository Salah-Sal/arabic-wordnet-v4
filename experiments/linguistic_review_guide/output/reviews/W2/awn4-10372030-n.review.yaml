step0_evidence:
  per_lemma:
    - lemma: "جَار"
      confirm:
        - text: "«المجاور في المسكن الشريك في العقار أو التجارة المجير والمستجير والمجار الزوج والزوجة الحليف والناصر»"
          source: "المعجم الوسيط"
        - text: "«الذى يُجاوِرُكَ بَيْتَ بَيْتَ قيل: المـُجاوِرُ في السَّكن»"
          source: "المعجم الكبير"
        - text: "«الجار: من يقرب مسكنه منك، وهو من الأسماء المتضايفة»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُجَاوِر"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) جارٌ (2) أخٌ في الإنسانيّة (3) مُجاوِر» — المورد الحديث"
      justification: "اشتقاق: اسم فاعل من الفعل (جاور)، وهو يؤدي الدلالة على الشخص أو الكيان الذي يقع بالقرب من آخر."
  knowledge_candidates: []

step1_lemma_validation:
  per_lemma:
    - lemma: "جَار"
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل ومستقر فصيح للدلالة على من يقرب مسكنه أو مكانه."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ الأساسي المباشر الذي يدل على العلاقة الاجتماعية والقرب المكاني."
      example: "دعا الرجل جاره لتناول طعام العشاء."

    - lemma: "مُجَاوِر"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح متداول يدل على من أو ما يقع بالقرب، ويغطي الحالات التي لا تنطوي على علاقة اجتماعية وثيقة."
      step05_citation: "«(1) جارٌ (2) أخٌ في الإنسانيّة (3) مُجاوِر» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أعم من الجار، فقد يطلق على الأشخاص والكيانات (كالمباني والدول المجاورة) ويركز على القرب المكاني المجرد."
      example: "انتقلت العائلة للعيش في المبنى المجاور."
      actions:
        - command: create_entry
          params:
            lemma: "مُجَاوِر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10372030-n"

  synset_flags:
    definition_review_needed: false
    split_needed: false

  added_lemmas:
    - lemma: "مُجَاوِر"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

