step0_evidence:
  per_lemma:
    - lemma: "شاذ"
      confirm:
        - text: "«من الناس: خلاف السوي» — المعجم الوسيط"
        - text: "«من النَّاسِ: خِلافُ السَّوِيِّ المنفردُ المتقَطِّعُ النظير» — المعجم الكبير"
      expands:
        - text: "«(في علم النفس) ما ينحرف عن القاعدة أو النمط وتستعمل صفة للنمط أو السلوك (مج)» — المعجم الوسيط"
      peripheral_observations:
        - "يطلق أيضاً على مخالف القياس في اللغة والحديث."
    - lemma: "غير متكيف"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "وردت في مصطلحات مركبة مثل «طفل غير متكيف» و«غير المتكيف اجتماعيا» (مسرد التربية)."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "سيئ التوافق"
      source_section: "step5_english_bridge"
      evidence_citation: "«سيِّئ التوافق: يُعوزه الانسجام مع بيئته نتيجةً لعجزه عن تحقيق التوافق بين رغباته الذاتية وبين أوضاع حياته.» — المورد الحديث"
      justification: "تركيب وصفي يصف بدقة الحالة النفسية والاجتماعية للشخص العاجز عن التكيف مع بيئته، ومثبت في المعاجم المتخصصة."
    - lemma: "مخفق اجتماعيا"
      source_section: "step4_fts_keyword"
      evidence_citation: "«شخص متعمّق في الدّراسة إلّا أنه مخفق اجتماعيًّا» — المورد الحديث"
      justification: "تركيب يصف جانباً من العجز عن التكيف، لكنه أضيق من المدلول العام للمجموعة الترادفية."
  knowledge_candidates:
    - lemma: "منبوذ"
      justification: "مجاز، يُطلق على الشخص الذي ترفضه الجماعة لعدم انسجامه معها، إلا أنه يصف النتيجة (النبذ) وليس السبب (عدم التكيف)."

step1_lemma_validation:
  per_lemma:
    - lemma: "شاذ"
      decision: confirmed
      decision_reason: "كلمة فصيحة ومستعملة للدلالة على من يخرج عن القاعدة السوية للمجتمع."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى الانحراف العام عن النمط السوي أو القاعدة، وقد يحمل دلالات سلبية أقوى (كالشذوذ الأخلاقي أو الجنسي) مقارنة بعدم التكيف البيئي."
      example: "عانى الطفل من العزلة في مدرسته فظنه زملاؤه شخصاً شاذاً."
    
    - lemma: "غير متكيف"
      decision: confirmed
      decision_reason: "تركيب وصفي مستقر في الاستعمال التخصصي والعام (maladjusted) ولا مانع من قبوله."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
        type: "وصفي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير بشكل مباشر إلى العجز عن الانسجام والتلاؤم مع الظروف الاجتماعية أو البيئية المحيطة، وهو مصطلح علمي محايد."
      example: "يجد الشخص غير المتكيف صعوبة في بناء علاقات اجتماعية مستقرة."

    - lemma: "سيئ التوافق"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح دقيق ومستعمل في علم النفس وعلم الاجتماع للتعبير عن العجز عن التكيف (maladjusted)."
      step05_citation: "«سيِّئ التوافق: يُعوزه الانسجام مع بيئته نتيجةً لعجزه عن تحقيق التوافق بين رغباته الذاتية وبين أوضاع حياته.» — المورد الحديث"
      mwe_check:
        is_mwe: true
        accepted: true
        type: "إضافي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يبرز الخلل الوظيفي في العلاقة بين الفرد ومحيطه أو ذاته، وهو أخص في الاستعمال النفسي."
      example: "تتطلب حالة التلميذ سيئ التوافق تدخلاً من المرشد النفسي."
      actions:
        - command: create_entry
          params:
            lemma: "سيئ التوافق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
