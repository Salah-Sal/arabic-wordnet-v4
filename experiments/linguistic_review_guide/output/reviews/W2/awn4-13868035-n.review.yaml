# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13868035-n (asynchronism)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما تعبيران مركبان وصفيان (عدم + مصدر / لا + مصدر)، وليس لأيّ منهما تثبيت معجمي قوي بوصفه مدخلاً مستقلاً في المعاجم الكلاسيكية"
      - "المفهوم تقني-علمي حديث يغلب فيه الاصطلاح الأجنبي، والمصطلح العربي لم يستقر بعد على صيغة واحدة"
      - "الفرق بين اللمّتين الموجودتين ضئيل جداً (عدم التزامن / لا تزامن)؛ يكاد يكون تنويعاً إملائياً في أداة النفي"
    observations: "المفهوم يقع في حقل العلاقات الزمنية، وفوقه المفهوم الأعمّ «علاقة زمنية». الحاجة واضحة إلى مصطلحات عربية مسكوكة تدل على حالة انعدام التوافق الزمني بين حدثين. التعريف الحالي ترجمة حرفية مقبولة لكنها تحتاج صياغة معجمية أدق."
  blind_candidates:
    - lemma: "لَاتَزَامُن"
      generation_method: ishtiqaq
      justification: "سابقة النفي «لا» مركّبة مع مصدر «تَزَامُن» من الجذر «زمن» على وزن تَفَاعُل. صيغة منتجة في المصطلحات العلمية العربية للدلالة على نقيض الحالة (لاتوازن، لاتماثل، لاتزامن)."
    - lemma: "لَاتَوَاقُت"
      generation_method: ishtiqaq
      justification: "سابقة النفي «لا» مع مصدر «تَوَاقُت» من الجذر «وقت» على وزن تَفَاعُل. يرتبط مباشرة بمفهوم الوقت الذي هو لبّ التعريف، ويوازي «لاتزامن» صرفياً."
    - lemma: "فَقْدُ التَّزَامُن"
      generation_method: tarkib
      justification: "تركيب إضافي يجمع «فَقْد» (مصدر فَقَدَ) مع «التزامن». يدلّ على حالة فقدان التوافق الزمني. شائع في الأدبيات الطبية والتقنية."
    - lemma: "تَفَاوُت زَمَنِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «تفاوت» (عدم التساوي) و«زمنيّ» (نسبة إلى الزمن). يعبّر عن اختلاف الأوقات التي تحدث فيها الأشياء."

stage2_evidence:
  per_lemma:
    - lemma: "عَدَم التَّزَامُن"
      evidence_status: "no_material_found"

    - lemma: "لَا تَزَامُن"
      confirm:
        - text: "«لاتزامن (ال...)» — translation_en: asynchronism"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«اللّاتزامُن؛ اللّاتواقُت.» — translation_en: asynchronism"
          source: "المورد الحديث (2008)"
        - text: "«فَقْدُ التَّزَامُن؛لاتَوَاقُت» — translation_en: asynchronism"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«تقال عن إرسال معطيات مشفرة، من الحاسوب نحو محيطي، حيث يسبق كل محرف ببت الانطلاق ويردف ببت واحد أو اثنين عند نهاية الإرسال (توقف). إرسال المعطيات يمكنه هكذا أن يتحقق حسب الوتيرة الخاصة للمستعمل» — المدخل: لا مُتَزَامِن"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "سياق استعمال الصفة «لا متزامن» في مجال تقنية المعلومات يؤكد شيوع الأسرة الاشتقاقية"

    - lemma: "لَاتَزَامُن"
      confirm:
        - text: "«لاتزامن (ال...)» — translation_en: asynchronism"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«اللّاتزامُن؛ اللّاتواقُت.» — translation_en: asynchronism"
          source: "المورد الحديث (2008)"

    - lemma: "لَاتَوَاقُت"
      confirm:
        - text: "«اللّاتزامُن؛ اللّاتواقُت.» — translation_en: asynchronism"
          source: "المورد الحديث (2008)"
        - text: "«فَقْدُ التَّزَامُن؛لاتَوَاقُت» — translation_en: asynchronism"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«فَقْدُ التَّزَامُن؛لاتَوَاقُت» — translation_en: asynchrony"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "فَقْدُ التَّزَامُن"
      confirm:
        - text: "«فَقْدُ التَّزَامُن؛لاتَوَاقُت» — translation_en: asynchronism"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«فَقْد» يدل على زوال شيء كان موجوداً، ممّا يوحي بحدث الفقدان (desynchronization) أكثر من الحالة الدائمة (asynchronism)"
          source: "تحليل دلالي"
          conflict: "الدلالة تميل إلى desynchronization أكثر من asynchronism"

    - lemma: "تَفَاوُت زَمَنِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عَدَم التَّزَامُن"
      decision: confirmed
      decision_reason: "تعبير إضافي مفهوم وشائع في الاستعمال العام للدلالة على نقيض التزامن. وإن لم يُسجَّل مدخلاً معجمياً مستقلاً، فهو مأنوس في النصوص التقنية العربية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير وصفي عام يناسب السياقات غير المتخصصة، أقرب إلى اللغة الطبيعية منه إلى المصطلح التقني المسكوك"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ التَّزَامُن"

    - lemma: "لَا تَزَامُن"
      decision: confirmed
      decision_reason: "مصطلح مسكوك مؤكد في عدة معاجم متخصصة: المعجم الموحد للفيزياء، المورد الحديث، المعجم الطبي الموحد. الصيغة «لا + مصدر» منتجة في المصطلحات العلمية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مصطلح تقني مسكوك أكثر تخصصاً من «عدم التزامن»، مستعمل في المعاجم الموحدة والمصطلحية الحديثة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاتَزَامُن"

    - lemma: "لَاتَزَامُن"
      source: stage1
      decision: removed
      decision_reason: "مطابق للّمة الموجودة «لا تزامن» مع اختلاف إملائي فقط (وصل «لا» بالمصدر). تمّ تحديث إملاء اللمّة الموجودة إلى الصيغة الموصولة."

    - lemma: "لَاتَوَاقُت"
      source: stage1
      decision: confirmed
      decision_reason: "مؤكد في المورد الحديث والمعجم الطبي الموحد بوصفه مرادفاً للاتزامن. مشتق من الجذر «وقت» على وزن تَفَاعُل مع سابقة النفي، ويُثري المجموعة بمنظور دلالي مختلف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مشتق من «وقت» بدلاً من «زمن»؛ يركّز على عدم تطابق المواقيت المحددة أكثر من الحقبة الزمنية العامة"
      actions:
        - command: create_entry
          params: {lemma: "لَاتَوَاقُت", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "فَقْدُ التَّزَامُن"
      source: stage1
      decision: removed
      decision_reason: "رغم وروده في المعجم الطبي الموحد مقابلاً لـ asynchronism، فإن دلالة «فقد» تُوحي بحدث زوال التزامن (desynchronization) أكثر من حالة اللاتزامن الأصلية (asynchronism). الفرق الدلالي الدقيق يجعله أنسب لمفهوم desynchronization."

    - lemma: "تَفَاوُت زَمَنِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ لا يختلف عن أي وصف عارض للتفاوت في الزمن. لم يُسجَّل في أي معجم مصطلحي بهذا المعنى، ولا يجتاز اختبار السكّ (يمكن إبدال «تفاوت» بـ«اختلاف» دون تغيّر الوظيفة)."

