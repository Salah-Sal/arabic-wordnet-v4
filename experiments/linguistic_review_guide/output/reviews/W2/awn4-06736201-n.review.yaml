# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-06736201-n  |  ILI: i71834  |  POS: n
# المفهوم: رسالة غير لفظية — a nonverbal message
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "رِسَالَة ضِمْنِيَّة تخلط بين الضمني (implicit) وغير اللفظي (nonverbal)؛ الرسالة غير اللفظية قد تكون صريحة تماماً كضوء المرور الأحمر، وليست بالضرورة ذات طابع ضمني أو مُبهم"
      - "التعريف العربي 'رسالة غير لفظية' ترجمة حرفية للإنجليزي، يفتقر إلى البنية التعريفية المعجمية الوافية (جنس قريب + فصل نوعي كافٍ)"
      - "كلتا اللمّتين تركيبتان وصفيتان، وغياب مصطلح أحادي راسخ في AWN يدل على ثغرة معجمية تستدعي المعالجة"
    observations: "المجموعة تمثل مفهوم 'الرسالة غير اللفظية' في نظرية التواصل، وهو ما يُبلَّغ من معنى دون توسط الألفاظ المنطوقة. التراث العربي زاخر بالمفردات الوصفية لهذا الحقل كالإيماء والإشارة والرمز والإيحاء، وقد أثبتت قاعدة بيانات ARABTERM ثبات نمط 'X غير لفظي' في المصطلحية الحديثة (تواصل غير لفظي، سلوك غير لفظي). المرشح الأقوى لإثراء هذه المجموعة بمصطلح أحادي هو إيماء بما يحمله من دلالة جسدية-تواصلية عريقة."
  blind_candidates:
    - lemma: "إِيمَاء"
      generation_method: majaz
      justification: "من أَوْمَأَ يُومئ (جذر ومأ): الإيماء في التراث هو الإشارة باليد أو الرأس أو العينين بما يحمل معنى دون نطق؛ وهو النموذج الأصيل للرسالة غير اللفظية في العربية. إحياء المعنى الحركي-التواصلي الذي تراجع أمام معاني الإيماء البلاغي الأصولي."
    - lemma: "إِيحَاء"
      generation_method: ishtiqaq
      justification: "من الجذر وحي على وزن إِفْعَال؛ معناه الأصلي 'إلقاء المعنى في النفس بخفاء وسرعة'. نصّ المناوي على أنه 'قد يكون بصوت مجرد عن التركيب وبإشارة بعض الجوارح وبالكتابة'، فهو يقترب من مفهوم الرسالة غير اللفظية."
    - lemma: "بَلاغ إِشَارِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي: بَلاغ (رسالة موجَّهة رسمية) + إِشَارِيّ (نسبة إلى الإشارة)؛ يُميّز مشمول المفهوم (بلاغ = رسالة) عن طريقة تبليغه (إشاري = بالإشارة لا باللفظ)."
    - lemma: "رَمْز"
      generation_method: majaz
      justification: "من جذر رمز؛ المعنى الأصلي عند الراغب الأصفهاني 'إشارة بالشفة والصوت الخفي والغمز بالحاجب'، وهو رسالة غير لفظية بطبيعته. إحياء للمعنى الحركي الأصلي الذي طغى عليه معنى 'رمز = symbol' الحديث."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفَّذة: ٤ استعلامات
# ١. مطابقة دفعية للمّات الكاملة (الموجودة + المرشحات)
# ٢. جسر إنجليزي: statement / nonverbal / gesture / body language / sign language
# ٣. مقاييس اللغة لجذور: عبر / لفظ / وحي / رسل / ضمن / شور
# ٤. FTS بالكلمات المفتاحية: رسالة غير لفظية / تواصل غير لفظي / إشارة جسدية
stage2_evidence:
  per_lemma:
    - lemma: "تَعْبِير غَيْر لَفْظِيّ"
      evidence_status: "no_material_found"

    - lemma: "رِسَالَة ضِمْنِيَّة"
      evidence_status: "no_material_found"

    - lemma: "إِيمَاء"
      confirm:
        - text: "«الإشارة باليد أو بالرأس»"
          source: "كتاب العين للخليل الفراهيدي"
        - text: "«الإيماء: هو التنبيه وأن تشير برأسك أو بيدك أو بحاجبك»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«(1) إيماء (2) إيماءة (3) مبادرة a political gesture (4) يُومئ (5) يعبِّر بالإيماء»"
          source: "المورد الحديث 2008 — ARABTERM"
      expands:
        - text: "«الإيماءُ: هُوَ الْكَلَام الْمشَار بِهِ إِلَى الْمَطْلُوب من قرب لَا مَعَ الخفاء»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يحدد السيوطي الإيماء بـ'الكلام المشار به'، أي التواصل عبر الإشارة لا اللفظ — وهو تعريف الرسالة غير اللفظية في جوهره"
        - text: "«إيماءة: وحدة إشارة جسدية»"
          source: "المعجم الموحد لمصطلحات اللسانيات 2002 — ARABTERM"
          addition: "إثبات الاستعمال المصطلحي الحديث لمشتق إيماءة في علم اللغة، مما يؤكد قبول الجذر في هذا الحقل الدلالي"

    - lemma: "إِيحَاء"
      confirm:
        - text: "«الإيحاء: إيقاع المعنى في النفس بخفاء وسرعة، ولتضمن السرعة قيل أمر وحي وذلك بكون الكلام على طريق الرمز والتعريض، وقد يكون بصوت مجرد عن التركيب وبإشارة بعض الجوارح، وبالكتابة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«إيحاء = connotation — الدلالة الثانية التي تكون لوحدة لغوية في الاستعمال علاوة على دلالتها الأولى»"
          source: "مسرد الإعلام والتواصل — ARABTERM"
          conflict: "المعنى الحديث الراسخ في المصطلحية يحمل دلالة 'الدلالة الثانوية للوحدة اللغوية'، وهو مفهوم مختلف تماماً عن 'الرسالة غير اللفظية'"
        - text: "«إيحاء = suggestion»"
          source: "مسرد الفلسفة وعلم النفس — ARABTERM"
          conflict: "الاستعمال الحديث يحصر إيحاء في الاقتراح والتلقين النفسي، لا في الرسالة الإشارية الجسدية"

    - lemma: "بَلاغ إِشَارِيّ"
      evidence_status: "no_material_found"

    - lemma: "رَمْز"
      confirm:
        - text: "«الرَّمْزُ: تصويت خفي باللسان كالهمس، ويكون تحريك الشفتين بكلام غير مفهوم باللفظ من غير إبانة بصوت إنما هو إشارة»"
          source: "لسان العرب لابن منظور"
        - text: "«الرمز: تلطف في الإفهام بإشارة تحرك طرف كاليد واللحظ والشفتين»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الرَّمْزُ: إشارة بالشّفة، والصّوت الخفيّ، والغمز بالحاجب»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«رمز إليه، وكلمه رمزاً: بشفتيه وحاجبيه»"
          source: "أساس البلاغة للزمخشري"
      contradicts:
        - text: "«رمز = symbol»"
          source: "مسارد ARABTERM متعددة: التربية، الفلسفة، الرياضيات، الكيمياء، الجيولوجيا، الهندسة، الإعلام"
          conflict: "المعنى السائد في المصطلحية الحديثة هو العلامة التجريدية الدالة على مفهوم؛ وهو أوسع من مفهومنا وقد يكون لفظياً (حرف/رمز كتابي)، ما ينقض شرط اللاَّلفظية"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تَعْبِير غَيْر لَفْظِيّ"
      decision: confirmed
      decision_reason: "مصطلح مركَّب راسخ يتبع نمط 'X غير لفظي' المُثبَّت في المصطلحية العربية الحديثة (تواصل غير لفظي، سلوك غير لفظي، اختبار غير لفظي في ARABTERM). اختبار الاستبدال: 'تعبير غير شفهي' يحمل دلالة مختلفة (غير صوتي ≠ غير لفظي)، مما يؤكد تثبيت الوحدة المصطلحية. اختبار السكّ: لا يمكن إبدال 'تعبير' بـ'تواصل' أو 'سلوك' مع الحفاظ على المعنى النوعي نفسه. التشكيل كامل وصحيح."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يصف الظاهرة التعبيرية بمجملها في غياب الألفاظ؛ مصطلح مجالي جامع في علم التواصل، أشمل من إيماء إذ يشمل جميع الأنماط غير اللفظية (الإيماء، تعابير الوجه، المسافة الجسدية، الصمت الدال)"

    - lemma: "رِسَالَة ضِمْنِيَّة"
      decision: removed
      decision_reason: "خلط مفاهيمي جوهري: الضمني (implicit/tacit) يصف طبيعة المضمون (مُبطَّن غير صريح)، بينما غير اللفظي (nonverbal) يصف طريقة الإيصال (دون ألفاظ). الرسالة غير اللفظية قد تكون صريحة تماماً كضوء المرور الأحمر أو إشارة المرور بالتوقف؛ فلا تلازم بين المفهومين. إدراج هذه اللمّة يُوهم بأن كل رسالة غير لفظية ضمنية، وهو خطأ منهجي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِيمَاء"
      source: stage1
      decision: confirmed
      decision_reason: "أدلة معجمية قوية من التراث الكلاسيكي والمعاصر: كتاب العين، التعريفات الفقهية، مقاليد العلوم كلها تعرّف إيماء بالإشارة الجسدية الناقلة للمعنى دون نطق — وهو تعريف الرسالة غير اللفظية بعينه. المورد الحديث يترجم 'gesture' بالإيماء. اجتاز مقاييس الجودة الستة: يُسر التداول (أحادي خفيف)، اطراد الوزن (إِفْعَال)، إيثار التراثي، إيثار العربي، قابلية الاشتقاق (أَوْمَأَ/يُومئ/إيماء/إيماءة/مُومئ). اختبار التحقق المعجمي: وحدة مسكوكة ثابتة لا عبارة وصفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يشير إلى الحادثة الإشارية الجسدية المحددة (الإيماء بالرأس، الإشارة باليد أو العينين)؛ أكثر تخصصاً وتجسيداً من تعبير غير لفظي الذي هو المصطلح الجامع"
      actions:
        - command: create_entry
          params:
            lemma: "إِيمَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إِيحَاء"
      source: stage1
      decision: removed
      decision_reason: "الانزياح الدلالي الحديث عطّل صلاحيته لهذا السياق: التداول الراهن في ARABTERM والمعاجم المعاصرة حصر إيحاء في 'الدلالة الثانوية' (connotation) و'الاقتراح النفسي' (suggestion)، وكلاهما بعيد عن مفهوم الرسالة غير اللفظية. رغم الشاهد الكلاسيكي عند المناوي، فإن إدراجه سيُحدث لبساً في الشبكة الدلالية مع المعنى الحديث الغالب."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "بَلاغ إِشَارِيّ"
      source: stage1
      decision: removed
      decision_reason: "المركب غير مُثبَّت معجمياً: البحث في قاعدة البيانات لم يُسفر عن شاهد واحد عليه. اختبار التثبيت المعجمي: يمكن استبدال 'إشاري' بـ'جسدي' أو 'حركي' مع بقاء العبارة صالحة كوصف، مما يكشف أنها عبارة وصفية حرة لا مصطلح مسكوك."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "رَمْز"
      source: stage1
      decision: removed
      decision_reason: "رغم قوة الشواهد الكلاسيكية للمعنى الحركي-الإشاري، غلب على رمز في التداول الحديث معنى 'symbol/code' التقني-المجرد في مصطلحيات التربية والرياضيات والهندسة وغيرها. إضافته لهذه المجموعة ستُحدث تعارضاً مع سياقاته الأخرى في AWN4. كذلك فإن الرمز في المفهوم المعاصر يشمل العلامات اللفظية (الحروف والأرقام)، مما ينقض شرط اللاَّلفظية الجوهري."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "رسالة غير لفظية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية للإنجليزي 'a nonverbal message'؛ يفتقر إلى الفصل النوعي الكافي ولا يتبع أسلوب المعجم الوسيط. يمكن تحسينه بذكر وسائل التبليغ غير اللفظية (الإيماء والإشارة وتعابير الوجه) لتمييزه عن أنواع أخرى من الرسائل."
    authored:
      - type: terminological
        text: "رسالة تُبلَّغ بالإيماء والإشارة وتعابير الوجه وسائر الوسائل الجسدية، دون اللجوء إلى الألفاظ أو الكلمات"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يُفهم من إيماء أو إشارة أو علامة مما لا كلام فيه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "رسالة تُبلَّغ بالإيماء والإشارة وتعابير الوجه وسائر الوسائل الجسدية، دون اللجوء إلى الألفاظ أو الكلمات"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "ما يُفهم من إيماء أو إشارة أو علامة مما لا كلام فيه"

  examples:
    per_lemma:
      - lemma: "تَعْبِير غَيْر لَفْظِيّ"
        examples:
          - text: "يعتمد علم النفس الاجتماعي على دراسة التعبير غير اللفظي لكشف المشاعر الخفية التي تعجز الكلمات عن إخفائها"
            type: usage
      - lemma: "إِيمَاء"
        examples:
          - text: "أطرق برأسه إيماءً يُغني عن الكلام، فأدرك المخاطَب على الفور ما أراد إبلاغه"
            type: usage
    actions:
      - command: add_sense_example
