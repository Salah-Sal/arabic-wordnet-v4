# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:

  # التقييم الأولي (بعد الاطلاع على الملف الكامل)
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما تعبيران مركّبان (MWE) ولا تمثلان وحدةً معجمية مفردة؛ مما يعني غياب مصطلح مفرد عربي راسخ."
      - "حبر على ورق: لم يرد في المعاجم الكلاسيكية كوحدة اصطلاحية ثابتة، وإن كان شائعاً في الخطاب الإعلامي والسياسي المعاصر."
      - "قانون مهمل: مركب وصفي تقني يضيق دلالياً على السياق القانوني، في حين يشمل المفهوم أيضاً المسائل والظروف غير القانونية (non-issue)."
      - "اللمّتان بدون تشكيل كامل في قاعدة البيانات."
      - "التعريف العربي الحالي لا يُبيّن أن الشيء لا يزال قائماً شكلياً رغم انتهاء فاعليته (وهو جوهر الفرق بين dead letter وما يماثله)."

    observations: >
      تُعبِّر المجموعة عن مفهوم «الشيء الذي تجاوزه الزمن وفقد صِلَتَه بالواقع»، ويقابله في الإنجليزية dead letter
      وnon-issue. يُعالج التعبير الأول (حبر على ورق) الجانبَ المادي — الوجود المكتوب دون أثر فعلي —
      بينما يعالج الثاني (قانون مهمل) الجانبَ القانوني تحديداً. كلا المصطلحَين متداولان في العربية المعاصرة،
      غير أن الأول لم يُسجَّل في المعاجم كوحدة ثابتة بل يُستعمل استعمالاً محورياً. المفهوم بأَسره يعاني
      فراغاً معجمياً (lexical gap) لغياب مصطلح مفرد عربي خالص يحمله.

  # المرشحات العمياء (من التعريف المُقنَّع فقط: «حالة شيء فقد أهميته أو فعاليته»)
  blind_candidates:
    - lemma: "اِنْدِثَار"
      generation_method: ishtiqaq
      justification: >
        من جذر (دثر) على وزن افتعال؛ قال ابن فارس: «رَسْمٌ دَاثِرٌ: تُغَطِّيهِ الرِّيَاحُ وَتَصِيرُ لَهُ كَالدِّثَارِ».
        الاندثار هو السقوط في طيّ النسيان وزوال الأثر، وهو يناسب الشيء الذي فقد فاعليته.

    - lemma: "خُمُود"
      generation_method: ishtiqaq
      justification: >
        من جذر (خمد) على وزن فُعول؛ «خَمَدَتِ النَّارُ خُمُودًا: سَكَنَ لَهَبُهَا». إزاحة دلالية
        من خمود النار إلى خمود فاعلية الشيء وانتهاء أثره؛ يناسب المفهوم المجرد لفقدان الفعالية.

    - lemma: "بَوَار"
      generation_method: majaz
      justification: >
        من جذر (بور): «الْبَوَارُ: الْهَلَاكُ»، ومنه «بَارَتِ الْبِيَاعَاتُ: كَسَدَتْ». الكساد التام
        يوازي فقدان الأهمية والجدوى؛ إحياء الدلالة الثانوية (الكساد والعطالة) لتغطية المفهوم.

    - lemma: "تَقَادُم"
      generation_method: ishtiqaq
      justification: >
        من جذر (قدم) على وزن تَفَاعُل؛ «تَقَادَمَ الشَّيْءُ: قَدُمَ وَطَالَ عَلَيْهِ الأَمَدُ».
        التقادم يعني بلوغ حدّ يُسقط معه الحقُّ أو النصُّ أثرَه، وهو مفهوم قانوني راسخ يلامس الدلالة المطلوبة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  per_lemma:

    # ── اللمّة الموجودة الأولى ──
    - lemma: "حبر على ورق"
      confirm:
        - text: >
            «الحِبْرُ: النِّقْسُ [المداد]... والأَثَرُ، أو أَثَرُ النِّعْمَةِ، والحُسْنُ»
          source: "القاموس المحيط للفيروزآبادي (hawramani، entry_id=797301)"
          # الدلالة الجامعة بين الأثر والكتابة تؤسس للمجاز: ما هو مكتوب لكن لا أثر له = حبر فقط.
      expands:
        - text: >
            «الحرف المَيْت: قانون إلخ لم يَعُد نافذَ المفعول [من غير أن يُلْغَى رسميًا]»
          source: "المورد الحديث (2008) — ترجمة dead letter (arabterm، entry_id=682103)"
          addition: >
            يكشف أن المصطلح الرسمي في المورد الحديث هو «الحرف الميت»، لا «حبر على ورق»،
            مما يدل على أن «حبر على ورق» تعبير محوري مستخدم عملياً لكن غير مقنَّن مصطلحياً.
        - text: >
            «(وَرَقَ) الْوَاوُ وَالرَّاءُ وَالْقَافُ: أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى خَيْرٍ وَمَالٍ،
            وَأَصْلُهُ وَرَقُ الشَّجَرِ... وَقَوْلُهُمْ أَوْرَقَ الصَّائِدُ: لَمْ يَصِدْ، هُوَ مِنَ الْوَرَقِ أَيْضًا»
          source: "مقاييس اللغة لابن فارس (entry_id=989577)"
          addition: >
            «أورق الصائد: لم يصد» — إحالة ضمنية إلى الشيء الذي لا يُجدي مع وجوده.
            تمنح «ورق» بُعداً دلالياً دقيقاً: المسعى الفارغ من النتيجة.

    # ── اللمّة الموجودة الثانية ──
    - lemma: "قانون مهمل"
      confirm:
        - text: >
            «مهمل: يقال عن معاهدة أو مجموعة من القوانين بعد توقف العمل بها لفترة طويلة
            بحيث تصبح طي النسيان أو الإهمال.»
          source: "المعجم الموحد لمصطلحات المياه — ALECSO (arabterm، entry_id=393061) — translation_en: desuetude"
        - text: >
            «المهمل: [في الإنجليزية] Outdated word...»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani، entry_id=820986)"
        - text: >
            «المهمل: ما لم يُوضع من اللفظ لمعنى وخلافُهُ الموضوع؛ وأَمرٌ مهمل أي متروك؛
            ومن الكلام خلاف المستعمل»
          source: "التعريفات الفقهية للبركتي (hawramani، entry_id=836083)"
      expands:
        - text: >
            «(هَمَلَ) الْهَاءُ وَالْمِيمُ وَاللَّامُ: أَصْلٌ وَاحِدٌ. أَهْمَلْتُ الشَّيْءَ،
            إِذَا خَلَّيْتَ بَيْنَهُ وَبَيْنَ نَفْسِهِ. وَالْهَمَلُ: السُّدَى.»
          source: "مقاييس اللغة لابن فارس (entry_id=989439)"
          addition: >
            «السُّدى» = ما يُترك بلا عناية أو استثمار. يُرسّخ دلالة الإهمال الكلي للقانون.

    # ── مرشح المرحلة ١: اندثار ──
    - lemma: "اِنْدِثَار"
      contradicts:
        - text: >
            «اندثار: قياس للضعف الذي يُصيب إشعاعاً عند اختراقه لوسط ما...
            E = -log T = log(I₀/I)»
          source: "مسرد الهندسة الكهربائية — ALECSO (arabterm، entry_id=377300) — translation_en: absorbance"
          conflict: "دلالة مادية فيزيائية متخصصة لا صلة لها بمفهوم فقدان الأهمية أو الفعالية."
        - text: >
            «اندثار: اختفاء الاستجابة الشرطية النفسية نتيجة عدم التعزيز.»
          source: "معجم المصطلحات الطبية ج.2 — ALECSO (arabterm، entry_id=738557) — translation_en: extinction"
          conflict: "الدلالة النفسية-التقنية تُضيِّق المفهوم وتُبعده عن دلالة الشيء الذي فقد صلته بالواقع."
      expands:
        - text: >
            «(دَثَرَ) الدَّالُ وَالثَّاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ مُطَّرِدٌ، وَهُوَ تَضَاعُفُ
            شَيْءٍ وَتَنَاضُدُهُ بَعْضِهِ عَلَى بَعْضٍ... رَسْمٌ دَاثِرٌ: تُغَطِّيهِ الرِّيَاحُ وَتَأْتِيهِ
            الرَّوَامِسُ فَتُصِيرَ لَهُ كَالدِّثَارِ فَتُغَطِّيَهُ.»
          source: "مقاييس اللغة لابن فارس (entry_id=986218)"
          addition: >
            الجذر الأصلي (دثر) يحمل دلالة الشيء الذي تراكمت عليه الطبقات حتى اندثر — استعارة قريبة
            من «الشيء المنسي» لكن المصدر (اندثار) غلب عليه الاستعمال التقني الحديث.

    # ── مرشح المرحلة ١: خمود ──
    - lemma: "خُمُود"
      expands:
        - text: >
            «(خَمَدَ) الْخَاءُ وَالْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى سُكُونِ الْحَرَكَةِ
            وَالسُّقُوطِ. خَمَدَتِ النَّارُ خُمُودًا، إِذَا سَكَنَ لَهَبُهَا. وَخَمَدَتِ الْحُمَّى
            إِذَا سَكَنَ وَهَجُهَا.»
          source: "مقاييس اللغة لابن فارس (entry_id=986156)"
          addition: >
            الدلالة الأصلية (سكون الحركة) قريبة استعارياً من فقدان الفاعلية، غير أن المعاجم التقنية
            أثبتت خمود في الفيزياء (damping) والطب (abatement) بما يُعقِّد الاستخدام في هذا المفهوم.
      contradicts:
        - text: "«خمود: damping» (domain: Physics)"
          source: "المعجم الموحد لمصطلحات الفيزياء (arabterm، entry_id=420218)"
          conflict: "الاستخدام التقني الراسخ في الفيزياء يُربك الاستخدام في مجال فقدان الأهمية."

    # ── مرشح المرحلة ١: بوار ──
    - lemma: "بَوَار"
      contradicts:
        - text: >
            «(بَوَرَ) الْبَاءُ وَالْوَاوُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا هَلَاكُ الشَّيْءِ وَمَا يُشْبِهُهُ
            مِنْ تَعَطُّلِهِ وَخُلُوِّهِ... الْبَوَارُ الْهَلَاكُ... وَبَارَتِ الْبِيَاعَاتُ أَيْ كَسَدَتْ.»
          source: "مقاييس اللغة لابن فارس (entry_id=985406)"
          conflict: >
            البوار يدل على الهلاك الكلي والكساد الشديد، وهو أشد من مجرد فقدان الأهمية؛ الشيء المنتهي
            فعالياً لا يلزم أن يكون قد هلك أو فسد.
        - text: >
            «البوار: فرط الكساد، ولما كان فرطه يؤدي إلى الفساد... عبَّر بالبوار عن الهلاك.»
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani، entry_id=813152)"
          conflict: "«فرط الكساد» ينزع نحو الفساد والهلاك لا مجرد الإهمال."

    # ── مرشح المرحلة ١: تقادم ──
    - lemma: "تَقَادُم"
      confirm:
        - text: >
            «تقادُم: obsolescence» (domain: Geography and History)
          source: "مسرد الجغرافيا والتاريخ — ALECSO (arabterm، entry_id=500749)"
        - text: >
            «(تقادم) الشَّيْء: قَدُمَ وَطَالَ عَلَيْهِ الأَمَدُ»
          source: "المعجم الوسيط — مجموعة من المؤلفين (hawramani، entry_id=891341)"
      contradicts:
        - text: >
            «(التقادم) في القانون: مُدَّة محدودة تَسقط بانقضائها المطالبة بالحق أو بتنفيذ الحكم.»
          source: "المعجم الوسيط (ocr، entry_id=22767)"
          conflict: >
            المعنى الاصطلاحي القانوني للتقادم هو «مرور مدة زمنية مُسقِطة للحق» (prescription/statute of
            limitations)، وهو مختلف عن «الحالة التي يكون فيها الشيء منتهي الصلاحية». يُشير إلى مسار
            زمني لا إلى حالة راهنة.
        - text: >
            «تقادم: prescription» (domain: Law)
          source: "المعجم الموحد لمصطلحات القانون 2017 (arabterm، entry_id=413900)"
          conflict: "التقادم القانوني = prescription (مسقِط الحق بمرور الزمن) وليس الحالة الموصوفة."


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ════════════════════════════════
    # اللمّة الموجودة الأولى
    # ════════════════════════════════
    - lemma: "حبر على ورق"
      decision: confirmed
      decision_reason: >
        تعبير اصطلاحي محوري واسع الاستخدام في العربية المعاصرة (إعلام، خطاب سياسي، تقارير)
        لوصف الشيء الذي لا يزال مدوَّناً أو معلناً لكن لا أثر له في الواقع. يختبر التثبيت المعجمي
        بنجاح جزئي: لا يمكن إحلال «حبر» بـ«مداد» مع الإبقاء على الدلالة المجازية ذاتها («مداد على ورق»
        تعمل وصفياً لكن لا تحمل المحمول المجازي نفسه في السياق الخطابي الثابت)، وهذا يُثبّته
        كوحدة محورية. غياب التوثيق الكلاسيكي لا يعني البطلان إذ الاستعمال المعاصر الواسع كافٍ.
        يستلزم إضافة تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الجانب المادي-البصري: الشيء موجود مدوَّناً أو مُعلَناً لكن لا ينفُذ في الواقع،
        مع إيحاء بالهوّة بين المكتوب والمطبَّق. الأشمل من الناحية الدلالية؛ يُطبَّق على الاتفاقيات
        والقوانين والوعود والخطط على حدٍّ سواء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِبْرٌ عَلَى وَرَقٍ"

    # ════════════════════════════════
    # اللمّة الموجودة الثانية
    # ════════════════════════════════
    - lemma: "قانون مهمل"
      decision: confirmed
      decision_reason: >
        مركّب وصفي (وصفي/wasfi) تقني راسخ في الخطاب القانوني: «مهمل» بمعنى desuetude موثَّق
        في المعجم الموحد لمصطلحات المياه (ALECSO) والتعريفات الفقهية. التعبير ينجح في اختبار
        السكّ: «قانون متروك» أو «قانون بائد» يؤدّيان وظيفة وصفية لكن لا يحملان الدلالة الاصطلاحية
        ذاتها الراسخة في الفقه والقانون. يستلزم إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مُقيَّد بالسياق القانوني-التشريعي تحديداً؛ يُشير إلى نصٍّ تشريعي أو اتفاقية توقّف العمل بها
        بمرور الزمن دون إلغاء رسمي (desuetude). أضيق نطاقاً من «حبر على ورق» إذ لا يُستعمل
        للمسائل غير القانونية ولا للظروف الطارئة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَانُونٌ مُهْمَلٌ"

    # ════════════════════════════════
    # مرشح المرحلة ١: اندثار
    # ════════════════════════════════
    - lemma: "اِنْدِثَار"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الجذر (دثر) يحمل دلالة الاختفاء تحت طبقات الزمن (رسم داثر)، فإن «اندثار» كمصطلح
        مُسكَّن في المعاجم التقنية الحديثة بمعنيين متخصصَين (absorbance في الهندسة الكهربائية،
        وextinction في علم النفس)، مما يُشوِّش الاستعمال في هذا المفهوم. فضلاً عن أن «اندثار»
        يدل في الاستعمال العام على الاختفاء الكلي للشيء (كاندثار الحضارات)، وهو أشد من مجرد
        فقدان الأهمية مع بقاء الشيء قائماً. اللمّتان الموجودتان تكفيان لتغطية المفهوم.
      evidence_assessment:
        case: contradicts_only

    # ════════════════════════════════
    # مرشح المرحلة ١: خمود
    # ════════════════════════════════
    - lemma: "خُمُود"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال الاستعاري (خمود الفاعلية) وارد لغوياً، غير أن «خمود» يُشير عادةً إلى توقّف مؤقت
        (remission، lull) أو انطفاء تدريجي، لا إلى حالة الشيء الذي انتهت صلته بالواقع تماماً
        مع استمرار وجوده الشكلي. كذلك استوطن «خمود» في المصطلح الفيزيائي (damping) بما يُصعّب
        إعادة توجيهه. وقد وجدنا مادة معجمية لكنها لا تؤكد هذا الاستخدام المحدد.
      evidence_assessment:
        case: mixed

    # ════════════════════════════════
    # مرشح المرحلة ١: بوار
    # ════════════════════════════════
    - lemma: "بَوَار"
      source: stage1
      decision: removed
      decision_reason: >
        البوار يعني الهلاك والكساد الشديد المفضي إلى الفساد؛ دلالته أشد من المطلوب. المفهوم المستهدف
        يصف شيئاً «تجاوزه الزمن» وهو لا يزال موجوداً شكلياً — وهذا لا يعني هلاكه. ثم إن «دار البوار»
        و«كنتم قوماً بوراً» تجعل اللفظ مرتبطاً بالهلاك الديني والمعنوي في الموروث القرآني،
        مما يجعل توظيفه هنا حمّالاً لمعانٍ طارئة غير مقصودة.
      evidence_assessment:
        case: contradicts_only

    # ════════════════════════════════
    # مرشح المرحلة ١: تقادم
    # ════════════════════════════════
    - lemma: "تَقَادُم"
      source: stage1
      decision: removed
      decision_reason: >
        «التقادم» مصطلح قانوني محدد يعني «prescription» (انقضاء مدة تُسقط الحق أو الدعوى)، وليس
        الحالة الراهنة لشيء فقد أهميته. وجود ترجمة جانبية (obsolescence) لا يكفي لتأسيس استعمال
        مصطلحي نقيض للاستعمال القانوني الراسخ (prescription/statute of limitations). كذلك فإن
        «تقادم» مصدر يدل على مسار زمني لا على حالة ثابتة. حذفه يُفادي التعارض مع المعنى القانوني.
      evidence_assessment:
        case: mixed


