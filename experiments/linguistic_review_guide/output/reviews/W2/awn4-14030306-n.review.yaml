# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────────
stage5_enrichment:

  per_entry:
    # ── حِبْرٌ عَلَى وَرَقٍ — MWE ──
    - lemma: "حِبْرٌ عَلَى وَرَقٍ"
      entry_id: "{auto}"
      roots:
        - word: "حبر"
          root: "حبر"
          maqayis_quote: >
            «الْحَاءُ وَالْبَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ مُطَّرِدٌ، وَهُوَ الْأَثَرُ فِي حُسْنٍ
            وَبَهَاءٍ. فَالْحِبْرُ: الَّذِي يُكْتَبُ بِهِ، لِأَنَّهُ يُؤَثِّرُ فِي الصَّحِيفَةِ.»
        - word: "ورق"
          root: "ورق"
          maqayis_quote: >
            «الْوَاوُ وَالرَّاءُ وَالْقَافُ: أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى خَيْرٍ وَمَالٍ، وَأَصْلُهُ
            وَرَقُ الشَّجَرِ. وَقَوْلُهُمْ أَوْرَقَ الصَّائِدُ: لَمْ يَصِدْ — مِنَ الْوَرَقِ أَيْضًا.»

    # ── قَانُونٌ مُهْمَلٌ — MWE ──
    - lemma: "قَانُونٌ مُهْمَلٌ"
      entry_id: "{auto}"
      roots:
        - word: "قانون"
          root: "قنن"
          maqayis_quote: >
            لم يَرِد في مقاييس اللغة لابن فارس لأن «قانون» مُعرَّب من اليونانية (κανών)
            ولم يَعُدَّه ابن فارس من أصول العربية.
        - word: "مهمل"
          root: "همل"
          maqayis_quote: >
            «الْهَاءُ وَالْمِيمُ وَاللَّامُ: أَصْلٌ وَاحِدٌ. أَهْمَلْتُ الشَّيْءَ، إِذَا خَلَّيْتُ بَيْنَهُ
            وَبَيْنَ نَفْسِهِ. وَالْهَمَلُ: السُّدَى. وَاللَّهُ أَعْلَمُ بِالصَّوَابِ.»

  per_sense:
    - lemma: "حِبْرٌ عَلَى وَرَقٍ"
      sense_id: "{auto}"
      nuance: >
        يُبرز الجانب المادي-البصري للمفهوم: الشيء مدوَّن أو معلَن لكنه لا ينفذ إلى الواقع،
        مع إيحاء بالهوّة بين المكتوب والمطبَّق. الأشمل نطاقاً: يُطبَّق على الاتفاقيات والوعود
        والقرارات والخطط الإستراتيجية بالتساوي، ويغلب على الخطاب الإعلامي والسياسي.
      mwe: true

    - lemma: "قَانُونٌ مُهْمَلٌ"
