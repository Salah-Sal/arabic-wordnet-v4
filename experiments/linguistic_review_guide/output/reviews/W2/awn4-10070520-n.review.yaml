stage1_review:
  assessment:
    concerns:
      - "المصطلح أجنبي مخصص لتاريخ دولة أجنبية (إنجلترا)، تمت ترجمته بإضافة ياء النسبة للاسم المعرّب."
    observations: "استخدام ياء النسبة مع الأسماء الأعجمية القياسية لتشكيل صفات أو أسماء نسبة هو إجراء قياسي ومقبول في اللغة العربية المعاصرة."
  blind_candidates:
    - lemma: "إِلِيزَابِيثِيّ"
      generation_method: taarib
      justification: "تعريب الاسم الإنجليزي (Elizabeth) وإلحاق ياء النسبة به للدلالة على الشخص الذي عاش في عهدها."
    - lemma: "أَلِيصَابَاتِيّ"
      generation_method: taarib
      justification: "استخدام التعريب القديم لاسم إليزابيث (أليصابات) وإلحاق ياء النسبة به."
    - lemma: "مُعَاصِرُ إِلِيزَابِيثَ"
      generation_method: tarkib
      justification: "مركب إضافي يوضح المعنى بشكل مباشر."
    - lemma: "رَجُلٌ إِلِيزَابِيثِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يستخدم لبيان انتماء الشخص إلى هذا العصر."

stage2_evidence:
  per_lemma:
    - lemma: "إِلِيزَابِيثِيّ"
      confirm:
        - text: "أليصاباتيّ: ذو علاقة بأليصابات [أليزابيث] الأولى ملكة إنكلترا أو بعصرها."
          source: "المورد الحديث (2008)"
    - lemma: "أَلِيصَابَاتِيّ"
      confirm:
        - text: "أليصاباتيّ: ذو علاقة بأليصابات [أليزابيث] الأولى ملكة إنكلترا أو بعصرها."
          source: "المورد الحديث (2008)"
    - lemma: "مُعَاصِرُ إِلِيزَابِيثَ"
      evidence_status: no_material_found
    - lemma: "رَجُلٌ إِلِيزَابِيثِيّ"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "إِلِيزَابِيثِيّ"
      decision: confirmed
      decision_reason: "مصطلح معرّب قياسي وشائع جداً في الكتابات التاريخية والأدبية للإشارة إلى من انتمى إلى العصر الإليزابيثي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِلِيزَابِيثِيّ"

    - lemma: "أَلِيصَابَاتِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معرّب موثق في المعاجم الحديثة مثل المورد كمرادف لإليزابيثي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَلِيصَابَاتِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُعَاصِرُ إِلِيزَابِيثَ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً معجمياً مسكوكاً."

    - lemma: "رَجُلٌ إِلِيزَابِيثِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي غير مسكوك، والاكتفاء بالنسبة (إليزابيثي) يغني عنه."

stage4_content:
  definition:
    current: "شخص عاش في عهد الملكة إليزابيث الأولى"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يحتاج إلى تدقيق لغوي وتوضيح للبلد (إنجلترا) ليكون تعريفاً موسوعياً أكثر دقة."
    authored:
      - type: encyclopedic
        text: "شَخْصٌ عَاشَ فِي عَهْدِ الْمَلِكَةِ إِلِيزَابِيثَ الْأُولَى، مَلِكَةِ إِنْجِلْتِرَا."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ عَاشَ فِي عَهْدِ الْمَلِكَةِ إِلِيزَابِيثَ الْأُولَى، مَلِكَةِ إِنْجِلْتِرَا."
  examples:
    per_lemma:
      - lemma: "إِلِيزَابِيثِيّ"
        examples:
          - text: "دَرَسَ الْبَاحِثُ حَيَاةَ الْإِلِيزَابِيثِيِّينَ وَعَادَاتِهِمْ فِي الْقَرْنِ السَّادِسَ عَشَرَ."
            type: usage
      - lemma: "أَلِيصَابَاتِيّ"
        examples:
          - text: "يُعَدُّ شَكْسْبِيرُ مِنْ أَشْهَرِ الْأَلِيصَابَاتِيِّينَ فِي مَجَالِ الْمَسْرَحِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "دَرَسَ الْبَاحِثُ حَيَاةَ الْإِلِيزَابِيثِيِّينَ وَعَادَاتِهِمْ فِي الْقَرْنِ السَّادِسَ عَشَرَ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعَدُّ شَكْسْبِيرُ مِنْ أَشْهَرِ الْأَلِيصَابَاتِيِّينَ فِي مَجَالِ الْمَسْرَحِ."

stage5_enrichment:
  per_sense:
    - lemma: "إِلِيزَابِيثِيّ"
      sense_id: "{auto}"
      nuance: "المصطلح المعرّب الأشهر والأكثر تداولاً للمنتمي إلى هذا العصر."
      mwe: false
    - lemma: "أَلِيصَابَاتِيّ"
      sense_id: "{auto}"
      nuance: "المصطلح المعرّب الموثق معجمياً والمبني على التعريب الأقدم لاسم إليزابيث."
      mwe: false
  synset:
    cultural_fit: omission
  actions:
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح المعرّب الأشهر والأكثر تداولاً للمنتمي إلى هذا العصر.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح المعرّب الموثق معجمياً والمبني على التعريب الأقدم لاسم إليزابيث.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"omission"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
