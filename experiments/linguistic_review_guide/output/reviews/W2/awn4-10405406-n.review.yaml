step0_evidence:
  per_lemma:
    - lemma: "نَعَامَة"
      confirm:
        - text: "«(2) النَّعامة: من يحاول اجتناب الخطر برَفْض مواجهتِهِ.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(النعامة) طَائِر كَبِير الْجِسْم طَوِيل الْعُنُق ... وَيُقَال فلَان ظلّ نعَامَة طَوِيل وَخفت نعَامَة الْقَوْم ذَهَبُوا وَجَاء كالنعامة رَجَعَ خائبا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"

step05_lemma_generation:
  evidence_candidates: []
  knowledge_candidates:
    - lemma: "مُتَعَامٍ"
      justification: "اشتقاق: اسم فاعل من الفعل «تعامى» الذي يعني تظاهر بالعمى وتجاهل الحقيقة، ويُستعمل لوصف من يرفض رؤية الواقع بوضوح، وهو يتقاطع دلالياً مع مفهوم التهرب من الواقع."
    - lemma: "مُتَغَافِل"
      justification: "اشتقاق: اسم فاعل من «تغافل»، بمعنى تعمد الغفلة وتجاهل ما يعلمه، ويصف من يتجاهل الواقع عمداً للتهرب منه."
  generation_notes: "المفهوم مبني بالأساس على استعارة لسلوك الطائر في الثقافة الشعبية، لكن يمكن التعبير عنه بألفاظ مشتقة من أفعال التجاهل والتعامي."

step1_lemma_validation:
  per_lemma:
    - lemma: "نَعَامَة"
      decision: confirmed
      decision_reason: "المصطلح يُستعمل مجازاً في العصر الحديث لوصف الشخص الذي يتهرب من الواقع ويتجاهل الحقائق، استعارةً من فكرة النعامة التي تدفن رأسها في الرمال، وهو موثق في المعاجم الحديثة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الشخص الذي يتهرب من الواقع هرباً من المواجهة بدافع الخوف أو الضعف، في استعارة واضحة لسلوك الطائر."
      example: "واجه مشاكلك بشجاعة ولا تكن نعامةً تدفن رأسها في الرمال عند أول أزمة."

    - lemma: "مُتَعَامٍ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح مشتق من التعامي، يعبر بدقة عن حالة من يرفض الاعتراف بالواقع ويتجاهل الحقائق الواضحة أمامه."
      step05_citation: "استنتاج لغوي مبني على معنى الفعل تعامى في السياقات المجازية."
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على التجاهل المتعمد وادعاء عدم رؤية الحقائق الواضحة، دون أن تتضمن بالضرورة دلالة الخوف والجبن الموجودة في «نعامة»."
      example: "لا تكن متعامياً عن الأخطاء الواضحة في خطة العمل التي ستؤدي إلى الفشل."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَعَامٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10405406-n"

    - lemma: "مُتَغَافِل"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح مشتق من التغافل، يصف بدقة الشخص الذي يتظاهر بعدم الانتباه للواقع تهرّباً منه أو تجنباً لمواجهته."
      step05_citation: "استنتاج لغوي من دلالة التغافل."
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على ادعاء الغفلة وعدم الانتباه لما يجري، وقد تكون تكتيكاً مؤقتاً للتملص من الواقع مقارنةً بالتعامي التام."
      example: "اعتاد أن يكون متغافلاً عن تحذيرات الخبراء حتى وقعت الكارثة."
