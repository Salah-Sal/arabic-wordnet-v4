          root: "جمع"
          maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ. يُقَالُ جَمَعْتُ الشَّيْءَ جَمْعًا.»"
        - word: "شمسية"
          root: "شمس"
          maqayis_quote: "«الشِّينُ وَالْمِيمُ وَالسِّينُ أَصْلٌ يَدُلُّ عَلَى تَلَوُّنٍ وَقِلَّةِ اسْتِقْرَارٍ. فَالشَّمْسُ مَعْرُوفَةٌ.»"
    - lemma: "النِّظَامُ الشَّمْسِيُّ"
