# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "طَرَافَة تفتقر إلى توثيق معجمي بوصفها مدخلاً رئيسياً مستقلاً في المعاجم المتاحة؛ فهي تَرِد ضمن تعريفات مداخل أخرى بمعنى «الجِدَّة والغرابة» لا بمعنى «صفة الإضحاك»"
      - "التعريف الحالي 'صفة كون الشيء مضحكا' مصوغٌ بصياغة ركيكة ولا يتبع نمط التعريف المصطلحي القائم على الجنس القريب والفصل النوعي"
      - "فُكَاهَة تدل في أصلها الأول على المزاح والمداعبة (نشاط) لا على الصفة المجردة، مما يُنشئ توتراً بين اللفظ وتعريف المجموعة"
    observations: >-
      المجموعة تُعبِّر عن مفهوم راسخ في التراث العربي؛ فقد عُني العرب بالتفريق
      بين طِيب النفس والفكاهة والظرافة والدعابة. ضمُّ طرافة وفكاهة معاً معقول
      من حيث إن كليهما يُقارب مفهوم "humor" الإنجليزي، غير أن طرافة تتجه نحو
      البُعد الموضوعي (الجِدَّة المُضحكة) وفكاهة تتجه نحو البُعد الأسلوبي
      (المزاح الممتع). يُستحسن مراجعة التعريف ليكون أدق وأكثر شمولاً.

  blind_candidates:
    - lemma: "الظَّرَافَةُ"
      generation_method: ishtiqaq
      justification: >-
        من جذر ظ-ر-ف؛ الظرافة مصدر قياسي يفيد الصفة المجردة للظريف، وهو من يتَّسم
        بخفة الروح واللسان المُضحِك. وقد وثّق التهانوي «الظرافة» بأنها ملكة توليد
        الكلام اللطيف المنطوي على إيهام وإضحاك، مما يجعلها مرشحة طبيعية لصفة الفكاهة.
    - lemma: "خِفَّةُ الظِّلِّ"
      generation_method: tarkib
      justification: >-
        تعبير إضافي مركَّب من «خِفَّة» و«الظِّلّ»؛ يُستعمل في العربية المعاصرة
        وصفاً لمن يتَّسم بالفكاهة والإضحاك. يُحتجُّ بثباته الاصطلاحي النسبي
        في الخطاب الإعلامي والأدبي الحديث.
    - lemma: "الفُكَاهِيَّةُ"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من «فُكَاهِيّ» بزيادة ياء النسب ثم تاء التأنيث الصناعية (-يّة)؛
        يُفيد الصفة المجردة لما اتَّصف بالفكاهة، قياساً على المصادر الحديثة
        كالتراثية والأدبية. يتجنَّب ازدواجية المعنى التي في «فكاهة» (صفة + نشاط).
    - lemma: "الطَّرَافَةُ"
      generation_method: majaz
      justification: >-
        من طَرُفَ الشيءُ إذا استُحدث واستُطرف؛ توسُّعٌ دلالي من «الجِدَّة والندرة»
        إلى «ما يجعل الشيء مُستملَحاً ومُضحكاً»، إذ إن الشيء الطريف هو ما استُحسن
        لجِدَّته فأثار الإعجاب والمرح.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1: مطابقة دفعية: طرافة، الطرافة، فكاهة، الفكاهة، ظرافة، الظرافة، فكاهية، الفكاهية، خفة الظل
#   Q2: جسر إنجليزي: humor, humour, funniness, humorousness, wit, wittiness
#   Q3: FTS عربي: مضحك، مضحكة، الضحك، يضحك، طرافة، طريف
#   Q4: مطابقة دفعية: طرف، ظرف، دعابة، هزل (للسياق والمقارنة)
#   Q5: مقاييس اللغة (dict_id=151): فكه، طرف، ظرف، ضحك
#   Q6: إثراء بالأمثلة والتعريفات (entry_ids: 22033, 814646, 879355, 820140, 498214, 484426)
stage2_evidence:
  per_lemma:

    - lemma: "طَرَافَة"
      expands:
        - text: >-
            «(1) الأصلية: كون الشيء أصليًّا (2) جِدّة؛ طرافة (3) أصالة؛ إبداع»
          source: "المورد الحديث (2008)"
          addition: >-
            تَرِد «طرافة» مقرونةً بـ«الجدة» و«الأصالة» في سياق الترجمة، مما يُثبت
            استعمالها العربي المعاصر بمعنى الطابع الجديد اللافت، لا بمعنى صفة الإضحاك المجردة
        - text: >-
            «(1) نَزوة (2) غرابة؛ طرافة»
          source: "المورد الحديث (2008)"
          addition: >-
            تقترن «طرافة» بـ«الغرابة» مما يُؤكد أن دلالتها الأولى هي الندرة والتميُّز
            لا الإضحاك المقصود
      # ملاحظة: لا مدخل مستقل بعنوان «طرافة» في أي معجم مُدرج في القاعدة

    - lemma: "فُكَاهَة"
      confirm:
        - text: >-
            «المِزاحُ / ما يُتمتَّع به من طُرَفِ الكلام»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >-
            «الفكاهة: بالضم: المزاح لانبساط النفس به»
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622 م)"
        - text: >-
            «(الفكاهة) المزاح وَمَا يتمتع بِهِ من طرف الكلام»
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
        - text: >-
            «الفاء والكاف والهاء أصل صحيح يدل على طيب واستطابة. من ذلك الرجل
            الفَكِه: الطيب النفس. ومن الباب: المُفَاكَهَة، وهي المُزَاحَة وما يُستحلَى
            من كلام»
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: >-
            «حالة مُضْحكة في العمل الأدبي، وهي عَيْب أو تشويه عند أرسطو، واستهزاء
            لاكتشاف نقطة ضعف المواقف»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ترجمة: humour"
          addition: >-
            يُضيف البُعد الأرسطي للفكاهة: أنها قائمة على كشف الضعف والنقيصة بأسلوب
            يُثير الضحك، وهو تعريف مصطلحي دقيق في سياق الدراسات الأدبية والبلاغية
        - text: >-
            «الدعابة؛ الفكاهة؛ الظَّرف / حِسُّ الدُّعابة والفكاهة أو روحُها: ملكة
            عقلية تمكّن المرء من اكتشاف المضحكات أو تقديرها وتذوُّقها أو التعبير عنها»
          source: "المورد الحديث (2008) — ترجمة: humor"
          addition: >-
            يُقرن المورد الحديث الفكاهةَ بـ«الدعابة» و«الظرف» تحت مدخل humor، مما
            يُثبت أن الفكاهة أوسع من مجرد المزاح، وتشمل الملكة الذهنية لصنع الإضحاك

    - lemma: "الظَّرَافَةُ"
      confirm:
        - text: >-
            «والظرافة تطلق على الملكة التي تكون مبدأ لصدور الألفاظ التي لا تخلو
            عن ظرافة وإيهام، وتطلق على هذه الألفاظ أيضاً. فمن له تلك الملكة يسمَّى
            ظريفاً»
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777 م)"
      contradicts:
        - text: >-
            «الظاء والراء والفاء كلمة كأنها صحيحة. يقولون: هذا وعاء الشيء وظرفُه،
            ثم يسمُّون البراعة ظرفاً، وذكاءَ القلب كذلك»
          source: "مقاييس اللغة لابن فارس"
          conflict: >-
            أصل الظرف هو الوعاء ثم البراعة والذكاء؛ لا الإضحاك. فالظرافة صفة ذكاء
            وبراعة في القول، وقد يُضحك الظريفُ لكن ليست الإضحاكَ جوهرَ معناه

    - lemma: "خِفَّةُ الظِّلِّ"
      evidence_status: "no_material_found"
      # لم يُعثر على هذا التعبير مدخلاً مستقلاً في أي معجم

    - lemma: "الفُكَاهِيَّةُ"
      evidence_status: "no_material_found"

    - lemma: "الطَّرَافَةُ"
      expands:
        - text: >-
            «(1) الأصلية: كون الشيء أصليًّا (2) جِدّة؛ طرافة»
          source: "المورد الحديث (2008)"
          addition: >-
            الصيغة المعرَّفة «الطرافة» تطابق لمّة «طرافة» الموجودة في المجموعة؛
            الأدلة واحدة (انظر مدخل طَرَافَة أعلاه)


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: طَرَافَة ──
    - lemma: "طَرَافَة"
      decision: confirmed
      decision_reason: >-
        كلمة عربية مشتقة اشتقاقاً قياسياً من جذر ط-ر-ف على وزن فَعَالَة (= صفة
        مجردة)، وهي مستعملة في العربية المعاصرة للدلالة على ما يجعل الشيء مُستملَحاً
        مُضحكاً. وإن كان أصلها يدور على «الجِدَّة والاستحداث» فإن التوسع الدلالي
        للإضحاك راسخ في الاستعمال. غياب مدخل مستقل لها في معاجم القاعدة لا يُعارض
        صحتها بل يدل على حداثة الاصطلاح. بوابة جودة المصطلح: عربي خالص، قياسي الوزن،
        مُيسور التداول، متوافق مع الجذر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تُشير إلى البُعد الموضوعي للفكاهة: الجِدَّة والتميُّز اللذان يُوجدان المفاجأةَ
        المُولِّدة للضحك؛ هي صفة في الشيء نفسه من حيث ندرتُه وغرابتُه الممتعة
      # لا إجراء مطلوب: التشكيل (طَرَافَة = فَعَالَة من طرف) صحيح

    # ── لمّة موجودة: فُكَاهَة ──
    - lemma: "فُكَاهَة"
      decision: confirmed
      decision_reason: >-
        موثقة بقوة في معاجم عربية متعددة من التوقيف (ق7 هـ) إلى المعجم الوسيط
        ومقاييس اللغة. الجذر فكه يدل على طيب النفس والمزاحة. الوزن فُعَالَة قياسي
        للمصادر الدالة على الصفات المركَّبة. بوابة جودة المصطلح: تراثي أصيل، مشهور
        الاستعمال، قياسي، لا التباس فيه، مشتقاقي راسخ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تُشير إلى البُعد الأسلوبي والتفاعلي للفكاهة: المزاح وما يُتمتَّع به من
        طُرَف الكلام؛ هي صفة تتجلَّى في طريقة التعبير والتواصل وانبساط النفس المتبادَل
      # لا إجراء مطلوب: التشكيل (فُكَاهَة = فُعَالَة من فكه) صحيح

    # ── مرشح المرحلة ١: الظَّرَافَةُ ──
    - lemma: "الظَّرَافَةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        الظرافة تدل في أصلها المعجمي (المقاييس + التهانوي) على ملكة البراعة والذكاء
        اللغوي وحُسن التصرف في الكلام لا على صفة الإضحاك تحديداً. فالظريف مَن يملك
        مَلَكَة الإيهام والتلويح البارع، وقد يُضحك لكنَّ ذلك ليس جوهر معناه. ضمُّها
        إلى مجموعة «صفة كون الشيء مضحكاً» سيُدخل دلالة الذكاء والبراعة في فضاء
        اصطلاحي مخصوص لصفة الإضحاك.

    # ── مرشح المرحلة ١: خِفَّةُ الظِّلِّ ──
    - lemma: "خِفَّةُ الظِّلِّ"
      source: stage1
      decision: removed
      decision_reason: >-
        تعبير إضافي مركَّب يُستعمل في الخطاب الدارج لوصف الشخص المرح، غير أنه لم
        يثبت في المعاجم الفصيحة مصطلحاً مسكوكاً مستقلاً. اختبار التثبيت المعجمي:
        غائب عن جميع المصادر. اختبار السك: يمكن قول «خفة الروح» أو «خفة الطبع»
        بالمعنى ذاته، مما يدل على أنه عبارة وصفية حرة لا وحدة معجمية مسكوكة.

    # ── مرشح المرحلة ١: الفُكَاهِيَّةُ ──
    - lemma: "الفُكَاهِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود لها في أي مصدر معجمي. وهي تكرار اشتقاقي منقوص؛ إذ تُؤدي «فُكَاهَة»
        الموجودة أصلاً في المجموعة الوظيفةَ ذاتها وبتوثيق أقوى. الاستغناء بالأصل
        أولى من اختراع مصدر صناعي.

    # ── مرشح المرحلة ١: الطَّرَافَةُ ──
    - lemma: "الطَّرَافَةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        الصيغة المعرَّفة «الطرافة» مطابقة للمّة «طَرَافَة» الموجودة بالفعل في
        المجموعة. لا داعي لإضافتها مجدداً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة كون الشيء مضحكا"
    assessment:
      decision: revise
      reason: >-
        الصياغة الحالية «صفة كون الشيء مضحكاً» ركيكة وتعتمد على الاسم المشتق
        من كلمة الإضحاك التي وردت في التعريف ذاته مما يُقرِّبها من الدوران.
        كما أن «مضحكاً» وصف لا يُميِّز بين ما يُضحك سخرةً وما يُضحك مرحاً وبُهجةً.
        التعريف المعاجم الوسيط أحكم لأنه يُحدد الجنس ويُضيف الفصل النوعي.
