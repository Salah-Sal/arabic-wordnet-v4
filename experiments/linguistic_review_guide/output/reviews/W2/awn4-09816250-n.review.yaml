      nuance_differentiation: "يتميز عن المعارض بأنه يتضمن طابعاً حركياً ونشطاً في المدافعة والمقاومة، ويغلب استعماله في المواقف الحقوقية والمبدئية."
      example: "قاد تكتل مناهض للحروب مظاهرة كبيرة أمام البرلمان."
