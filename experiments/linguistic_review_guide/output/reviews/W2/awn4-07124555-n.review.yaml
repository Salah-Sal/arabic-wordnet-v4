# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────

stage3_analysis:
  per_lemma:

    - lemma: "تصويت"
      decision: removed
      decision_reason: >
        تعاني لمّة «تصويت» من اشتراك لفظي حاد لا يمكن تجاوزه في معجم عام: المعنى الطاغي في
        الاستعمال المعاصر هو «الاقتراع» (موثَّق في المعاجم القانونية والاجتماعية)، في حين
        يظهر المعنى الصوتي «phonation/vocalization» في المعاجم المتخصصة باللسانيات والطب.
        علاوة على ذلك، دلالته الصوتية التخصصية تُقابل phonation (إنتاج الصوت الحنجري)
        وهو مفهوم أضيق من مفهوم هذه المجموعة (utterance/vocalization = استخدام الأصوات
        المنطوقة للاتصال السمعي بمعناه الأشمل). وزن تَفْعِيل من جذر ص-و-ت يُلائم الفعل
        المتعدي (جعله يُصوّت) لا الاسم المصدري للفعل الإنساني التواصلي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تلفظ"
      decision: confirmed
      decision_reason: >
        لمّة «تلفظ» موثَّقة توثيقاً ممتازاً في أعلى درجات الجودة المعجمية (OCR من المعجم الوسيط
        + مصادر lane وcamel). التعريف الرئيسي في المعجم الوسيط «تموجات هوائية مصدرها في
        الغالب الحنجرة تشكلها أعضاء الصوت» يُطابق تماماً مفهوم «استخدام الأصوات المنطوقة
        للاتصال السمعي». وزن تَفَعُّل من جذر ل-ف-ظ يُفيد الحدث الديناميكي المتجدد (إخراج
        اللفظ من الفم)، وهو مناسب للدلالة على فعل الاستخدام. لا اشتراك لفظي ولا لهجية.
        التشكيل الكامل: تَلَفُّظ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَلَفُّظ هو اللمّة الوحيدة المؤكدة في المجموعة بعد حذف تصويت. يُركّز تلفظ على
        الحدث الكلامي الفردي المُنجَز بأعضاء النطق (الجانب الفسيولوجي-الصوتي للأداء
        الكلامي: الهواء + الحنجرة + أعضاء الصوت)، وهو في اللسانيات المقابل العربي الراسخ
        لـ enunciation/utterance كفعل تواصلي صوتي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَلَفُّظ"

    - lemma: "إِصَاتَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي مدخل معجمي لهذه الصيغة في قاعدة البيانات. وإن كان الوزن صحيحاً
        صرفياً (إِفَالَة من ص-و-ت)، إلا أن الصيغة غير مسكوكة ولا متداولة في المعاجم
        الكلاسيكية ولا في المصطلحيات الحديثة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تَكَلُّم"
      source: stage1
      decision: removed
      decision_reason: >
        التكلم في المعاجم موثَّق أساساً كفعل (تَكَلَّمَ = verb)، والمصدر تَكَلُّم يدل على «النطق
        بكلام ذي معنى» (meaningful speech) لا على الفعل الصوتي البيولوجي المُجرَّد من
        استخدام الأصوات للتواصل السمعي. كما يُفيد الجذر ك-ل-م في الأصل «نطقاً مُفهِماً»
        (ابن فارس: «يدل على نطق مُفهِم») مما يُضيّق المعنى إلى التواصل اللفظي الدلالي
        ويُبعده عن الشمولية الصوتية المقصودة في المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُشَافَهَة"
      source: stage1
      decision: removed
      decision_reason: >
        المشافهة في المعاجم تعني «المخاطبة من فيك إلى فيه» أي التواصل الشفوي البيني
        (oral face-to-face communication). هذا المعنى أضيق وأكثر تخصصاً من مفهوم المجموعة
        الذي يصف عموم استخدام الأصوات المنطوقة للاتصال السمعي دون اشتراط التفاعل المتبادل
        أو الحضور الجسدي. فضلاً عن ذلك، المشافهة في علم الحديث مصطلح تقني يتعلق بطريقة
        الرواية الشفوية، مما يُضيف بُعداً اصطلاحياً آخر يُبعدها عن المفهوم المقصود.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تَصَوُّت"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على مدخل معجمي لصيغة تَصَوُّت في قاعدة البيانات. الوزن تَفَعُّل من ص-و-ت
        صحيح نظرياً لكن الصيغة غير مسكوكة في المعجمية العربية الكلاسيكية ولا الحديثة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


