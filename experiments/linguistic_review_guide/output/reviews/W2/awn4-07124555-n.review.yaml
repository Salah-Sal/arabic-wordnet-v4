# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────

stage1_review:
  assessment:
    concerns:
      - "لمّة «تصويت» تعاني من اشتراك لفظي حاد بين معنى الاقتراع/الانتخاب (الأكثر شيوعاً في العربية المعاصرة) ومعنى إرسال الأصوات اللغوية (الاستخدام التقني في اللسانيات)، مما يُفضي إلى التباس دلالي خطير."
      - "اللمّتان مكتوبتان بدون تشكيل في synset_info، مما يُعسّر القراءة ويُفوّت الدقة الصرفية."
      - "التعريف العربي الحالي «استخدام الأصوات المنطوقة للاتصال السمعي» ترجمة حرفية للتعريف الإنجليزي وتفتقر إلى الأصالة المعجمية، فضلاً عن كونها تُكرّر مفردة «المنطوقة» التي تعود إلى نفس الجذر (نطق) المُعبَّر عنه ضمناً."
      - "المجموعة تجمع لمّتَيْن تمثلان جانبَيْن مختلفَيْن: تلفظ (الأداء الكلامي الإبداعي، enunciation) وتصويت (الإنتاج الفيزيولوجي للأصوات، phonation)، دون تمييز واضح في التعريف عن مدى اتساع المفهوم المقصود."
    observations: >
      المجموعة تُعبِّر عن مفهوم «الاستخدام الصوتي للتواصل السمعي» وهو مفهوم جامع بين
      التلفظ (الحدث الكلامي المنجَز بأعضاء النطق) والتصويت (إرسال الأصوات الصوتية عبر
      الجهاز الفيزيولوجي). اللمّة «تلفظ» واعدة صرفياً (مصدر تَفَعُّل من جذر ل-ف-ظ الدال
      على الإخراج من الفم) وموثَّقة في المعاجم. أما «تصويت» فتحتاج تمحيصاً دلالياً
      نظراً لغلبة معنى الاقتراع في الاستعمال المعاصر على المعنى الصوتي-اللساني المقصود.
      يُلاحَظ غياب لمّات مباشرة من جذر ن-ط-ق كـ«نُطق» رغم شيوعه للمفهوم ذاته.

  blind_candidates:
    - lemma: "إِصَاتَة"
      generation_method: ishtiqaq
      justification: "من جذر ص-و-ت على وزن إِفَالَة (إِصَاتَة)، يدل على فعل إصدار الصوت وبثّه. يتميز عن «تصويت» بعدم احتماله معنى الاقتراع، ويُعبّر بدقة عن الجانب الصوتي التواصلي."
    - lemma: "تَكَلُّم"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من جذر ك-ل-م، يدل على الفعل المستمر للنطق بكلام مسموع. الوزن تَفَعُّل يفيد التدرج والتكرار، وهو مناسب لوصف فعل التواصل بالأصوات المنطوقة."
    - lemma: "مُشَافَهَة"
      generation_method: ishtiqaq
      justification: "مصدر مُفَاعَلَة من جذر ش-ف-ه، يدل على المخاطبة الشفوية مباشرة بالصوت. الجذر (شفه) يربط الفعل الصوتي بعضو النطق (الشفة)، وهو إحالة مجازية على أصل التواصل الصوتي."
    - lemma: "تَصَوُّت"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من جذر ص-و-ت، يدل على الصيرورة الصوتية (أن يُصوِّت المتكلم). يتميز صرفياً وصوتياً عن «تصويت» (تَفْعِيل) بدلالة على الفاعلية الذاتية في إصدار الأصوات."


