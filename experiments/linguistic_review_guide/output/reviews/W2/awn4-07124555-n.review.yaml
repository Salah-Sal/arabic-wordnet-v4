          source: "المعجم الوسيط (OCR، مجمع اللغة العربية)"
        - text: "«(التَّلَفُّظ) تموجات هوائية مصدرها في الغالب الحنجرة تشكلها أعضاء الصوت (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«فعل الأداء الكلامي في استعمال اللغة، ينتج عنه كلام أو قول مفيد بالقصد. إنه فعل الإبداع لدى المتكلم.» — translation_en: enunciation"
