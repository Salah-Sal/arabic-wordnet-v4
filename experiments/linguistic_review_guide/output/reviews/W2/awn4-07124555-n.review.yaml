          conflict: "معنى «الاقتراع/التصويت الانتخابي» مغاير تماماً لمعنى «استخدام الأصوات المنطوقة للتواصل السمعي»."
        - text: "«translation_en: voting» — المعجم الموحد لمصطلحات القانون (2017)"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الاستخدام القانوني يُرسّخ معنى الاقتراع، مما يُعمّق الاشتراك اللفظي مع المعنى الصوتي."
        - text: "«translation_en: phonation» — المعجم الطبي الموحد (2009)"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "«phonation» (التصويت الحنجري) أضيق من مفهوم المجموعة الذي يشمل كل استخدام الأصوات للاتصال السمعي (vocalization/utterance)."

