stage1_review:
  assessment:
    concerns:
      - "المصطلحات الحالية جيدة، لكن يجب التفريق بوضوح بين (عائلة/فصيلة لغوية) التي تعادل (language family) وبين (شعبة/عائلة كبرى) التي تعادل (phylum/macrophylum)."
    observations: "التعريف يعبر عن مستوى تصنيفي أعلى من العائلة اللغوية المعتادة، ولذلك فإن استخدام مصطلح (شعبة) أو (عائلة كبرى) دقيق ومناسب، ويوافق الاستخدام في علم التصنيف الأحيائي الذي استعيرت منه هذه المصطلحات."
  blind_candidates:
    - lemma: "عَائِلَة لُغَوِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي شائع للتعبير عن مجموعة اللغات المرتبطة بقرابة تاريخية."
    - lemma: "فَصِيلَة لُغَوِيَّة"
      generation_method: tarkib
      justification: "استعارة من علم التصنيف الأحيائي (Family) للدلالة على القرابة اللغوية."
    - lemma: "أُسْرَة لُغَوِيَّة"
      generation_method: tarkib
      justification: "استعارة مجازية من القرابة البشرية للدلالة على الأصل المشترك للغات."
    - lemma: "شُعْبَة لُغَوِيَّة"
      generation_method: tarkib
      justification: "استعارة من تصنيف الأحياء (Phylum) للدلالة على مجموعة كبرى تضم عدة فصائل أو عائلات لغوية."

stage2_evidence:
  per_lemma:
    - lemma: "شعبة لغوية"
      confirm:
        - text: "(2) شُعبة [من اللغات]."
          source: "المورد الحديث (2008)"
      expands:
        - text: "شعبة (Phylum): أعلى مرتبة تقسيم في مملكة النظام البيولوجي لتصنيف الحيوانات."
          source: "موقع ArabTerm"
          addition: "يؤكد أن الأصل في الاستخدام هو المستوى التصنيفي الأعلى من الفصيلة."
    - lemma: "عائلة لغوية كبرى"
      evidence_status: "no_material_found"
    - lemma: "فصيلة لغوية"
      confirm:
        - text: "مجموع من لغات تكون متقاربة من حيث الأصل ومن الناحية التاريخية. ومن هذا المنظور تقسم اللغات إلى عدة فصائل من أشهرها اللغات السامية – الحامية واللغات الهند وأوربية … إلخ."
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"

stage3_analysis:
  per_lemma:
    - lemma: "شعبة لغوية"
      decision: confirmed
      decision_reason: "مصطلح معتمد وموثق في المعاجم ثنائية اللغة لترجمة (phylum) في السياق اللساني، وهو دقيق تصنيفياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شُعْبَة لُغَوِيَّة"

    - lemma: "عائلة لغوية كبرى"
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق وواضح يؤدي المعنى ويفرق بين هذا المستوى التصنيفي (macrophylum) والمستوى الأدنى (عائلة/فصيلة)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَائِلَة لُغَوِيَّة كُبْرَى"

    - lemma: "فَصِيلَة لُغَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح يقابل (language family) وهو مستوى تصنيفي أدنى من (phylum)، لذا لا يناسب هذه المجموعة الترادفية المخصصة للمستوى الأكبر."

    - lemma: "عَائِلَة لُغَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "يقابل (language family) ولا يعبر عن الحجم الأكبر المقصود بـ (phylum)."

    - lemma: "أُسْرَة لُغَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مرادف لـ (عائلة لغوية) ولا يناسب مستوى (phylum)."

stage4_content:
  definition:
    current: "(في اللغويات) مجموعة كبيرة من اللغات المرتبطة تاريخياً"
    assessment:
      decision: revise
      reason: "تعديل طفيف لجعله أكثر اصطلاحية ودقة في بيان كونه مستوى تصنيفيًّا يجمع اللغات ذات الأصل التاريخي المشترك."
    authored:
      - type: terminological
        text: "مجموعة كبرى من اللغات التي ترتبط ببعضها تاريخيا، وتمثل مستوى تصنيفيا أعلى يضم عادة عدة عائلات لغوية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة كبرى من اللغات التي ترتبط ببعضها تاريخيا، وتمثل مستوى تصنيفيا أعلى يضم عادة عدة عائلات لغوية."

  examples:
    per_lemma:
      - lemma: "شُعْبَة لُغَوِيَّة"
        examples:
          - text: "تُعَدُّ اللُّغَاتُ الْأَفْرُوَآسْيَوِيَّةُ شُعْبَةً لُغَوِيَّةً تَضُمُّ عِدَّةَ فَصَائِلَ."
            type: usage
      - lemma: "عَائِلَة لُغَوِيَّة كُبْرَى"
        examples:
          - text: "صَنَّفَ عُلَمَاءُ اللُّغَةِ هَذِهِ اللُّغَاتِ ضِمْنَ عَائِلَةٍ لُغَوِيَّةٍ كُبْرَى وَاحِدَةٍ لاشْتِرَاكِهَا فِي خَصَائِصَ قَدِيمَةٍ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُعَدُّ اللُّغَاتُ الْأَفْرُوَآسْيَوِيَّةُ شُعْبَةً لُغَوِيَّةً تَضُمُّ عِدَّةَ فَصَائِلَ."
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "صَنَّفَ عُلَمَاءُ اللُّغَةِ هَذِهِ اللُّغَاتِ ضِمْنَ عَائِلَةٍ لُغَوِيَّةٍ كُبْرَى وَاحِدَةٍ لاشْتِرَاكِهَا فِي خَصَائِصَ قَدِيمَةٍ."

stage5_enrichment:
  per_entry:
    - lemma: "شُعْبَة لُغَوِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "شعبة"
          root: "شعب"
          maqayis_quote: "الشِّينُ وَالْعَيْنُ وَالْبَاءُ أَصْلَانِ مُخْتَلِفَانِ، أَحَدُهُمَا يَدُلُّ عَلَى الِافْتِرَاقِ، وَالْآخَرُ عَلَى الِاجْتِمَاعِ."
        - word: "لغوية"
          root: "لغو"
          maqayis_quote: "اللَّامُ وَالْغَيْنُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى الشَّيْءِ لَا يُعْتَدُّ بِهِ، وَالْآخَرُ عَلَى اللَّهَجِ بِالشَّيْءِ."
    - lemma: "عَائِلَة لُغَوِيَّة كُبْرَى"
      entry_id: "{auto}"
      roots:
        - word: "عائلة"
