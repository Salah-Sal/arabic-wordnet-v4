# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «عجب» تفتقر إلى التشكيل الكامل، وهي ذات إيهام دلالي مزدوج: العجب يصف الشعورَ النفسي للمتعجِّب (wonder felt) وصفةَ الشيء المثير للعجب (that which amazes) — ولا بدّ من تحديد المقصود"
      - "لمّة «لا معقولية» خطأ دلالي جوهري: اللامعقولية = انعدام الاتساق العقلي (irrationality/absurdity)، وهو مغاير تماماً للمفهوم المستهدف incredibility = صفة كون الشيء خارقاً عسيرَ التصديق لغرابته الاستثنائية"
      - "كلتا اللمّتين دون تشكيل كامل"
      - "المفهوم المستهدف (الجودة المجردة لكون الشيء لا يُصدَّق) يفتقر في العربية إلى مصطلح اسمي مجرد ومسكوك واسع التداول"
    observations: "المجموعة الترادفية تُعبِّر عن مفهوم الجودة المجردة لكون الشيء خارقاً لا يُصدَّق (incredibility). الهيبرونيم (جَوْدَة/نَوْعِيَّة = quality) يُؤكد أن المطلوب اسم خاصية مجردة لا وصف. العربية تميل إلى التعبير عن هذا المفهوم بالأوصاف الفعلية (لا يُصدَّق، مذهل، عجيب) دون مصادر صناعية مستقلة راسخة — وهو ما يشير إلى فجوة معجمية حقيقية. «عَجَبٌ» بمعناه «الأمر يُتعجَّب منه» هو أقرب ما في التراث إلى المفهوم المستهدف. أما «لا معقولية» فنتاج ترجمة حرفية خاطئة رسّخها التداول الأكاديمي المعاصر غير الدقيق."

  blind_candidates:
    - lemma: "الإِعْجَازِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن (إفعال + ية) من الجذر ع-ج-ز. الإعجاز = إعجازُ الشيء العقلَ عن الإدراك المعتاد وعجزُه عن تصديقِه؛ فالإعجازية هي الخاصية التي تُعجِز العقلَ عن التصديق وتجاوز الحدِّ المعهود"
    - lemma: "الاِسْتِغْرَابِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن (استفعال + ية) من الجذر غ-ر-ب. الاستغراب = وجدان الشيء خارجاً عن المعهود شديدَ الإدهاش لا يُكاد يُصدَّق؛ فالاستغرابية هي الخاصية التي تستوجب هذا الاستغراب المفضي إلى عدم التصديق"
    - lemma: "الأُعْجُوبِيَّة"
      generation_method: majaz
      justification: "إحياء وإزاحة دلالية من اللفظ التراثي «أُعجوبة» (= الأمر العجيب الخارق): تُمتَدُّ دلالته إلى المفهوم المجرد — الأعجوبية = الصفة التي تجعل الشيء أُعجوبةً خارقة لا تُصدَّق؛ إزاحة مشابهة لـ: أُسطورة → أُسطوريّة"
    - lemma: "عُسْرُ التَّصْدِيق"
      generation_method: tarkib
      justification: "تركيب إضافي: (عُسر = الشدة والصعوبة من ع-س-ر) + (التصديق = نسبة الصدق إلى الخبر من ص-د-ق). يُعبِّر التركيب مباشرةً عن الخاصية التي تجعل الشيء شديدَ الاستعصاء على التصديق، مستند إلى مفردتَيْن تراثيتَيْن راسختَيْن"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المُنفَّذة:
# [Q1] مطابقة دفعية: عجب/العجب/معقولية/المعقولية/اعجازية/الاعجازية/استغرابية/الاستغرابية/فذاذة/الفذاذة/عسر/العسر/تصديق/التصديق + نظائرها
# [Q2] جسر إنجليزي: incredibility OR incredibleness OR incredible OR unbelievable OR implausibility
# [Q3] FTS: "غير قابل للتصديق" OR "لا يصدق" OR "عجيب" OR "مذهل" OR "استغراب"
# [Q4] إثراء بالمعرّفات: entry_ids (18253, 18249, 94745, 102013, 107370)
stage2_evidence:
  per_lemma:
    - lemma: "عجب"
      confirm:
        - text: "«رَوعةٌ تأخذُ الإنسانَ عند استعظامِ الشيء»"
          source: "المعجم الوسيط (entry_id: 18253)"
        - text: "«الأمرُ يُتعجَّبُ منه»"
          source: "مجمل اللغة (entry_id: 107370)"
      expands:
        - text: "«كِبَرٌ واستكبارٌ للشيء»"
          source: "مقاييس اللغة — ابن فارس (entry_id: 102013)"
          addition: "يُرجع ابن فارس العجب إلى استعظام الشيء وإدراكه أكبر مما تحتمله المقاييس المعهودة — مما يقترب من دلالة الاستعصاء على التصديق"
        - text: "«مِنه: أنكرَه لقلَّةِ اعتِياده إياه»"
          source: "المعجم الوسيط — الفعل عَجِبَ (entry_id: 18249)"
          addition: "يُثبت أن جوهر العجب هو إنكار الشيء واستغرابه لخروجه عن المألوف — وهو ما يقترب من معنى الاستعصاء على التصديق"

    - lemma: "لا معقولية"
      evidence_status: "no_material_found"

    - lemma: "الإِعْجَازِيَّة"
      contradicts:
        - text: "«الإعجازُ: في الكلام هو أن يُؤدِّيَ المعنى بطريقٍ هو أبلغُ من جميعِ ما عداه من الطرق»"
          source: "كتاب التعريفات للشريف الجرجاني (entry_id: 794469)"
          conflict: "الإعجاز مصطلح بلاغي متخصص يرتبط بإعجاز كلام الله والبلاغة العليا، لا بالخاصية العامة لكون الشيء خارقاً لا يُصدَّق"
        - text: "«الإعجازُ: في الكلام، تأديتُه بطريقٍ أبلغَ من كلِّ ما عداه»"
          source: "التوقيف على مهمات التعاريف للمناوي (entry_id: 812869)"
          conflict: "تأكيد لتخصيص المصطلح في السياق البلاغي/الديني"

    - lemma: "الاِسْتِغْرَابِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الأُعْجُوبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "عُسْرُ التَّصْدِيق"
      expands:
        - text: "«التصديقُ: هو أن تنسُبَ باختيارِكَ الصدقَ إلى المُخبِر»"
          source: "كتاب التعريفات للشريف الجرجاني (entry_id: 794744)"
          addition: "يُثبت أن التصديق هو نسبة الصدق إلى ما وَرَدَ؛ فعُسر التصديق = صعوبة تحقيق تلك النسبة لشدة خروج الشيء عن المألوف"
        - text: "«العُسرُ: ضدُّ اليُسرِ، وهو الضيقُ والشدةُ والصعوبة»"
          source: "لسان العرب / hawramani (entry_id: 772223)"
          addition: "يُثبت أن عُسر = الصعوبة والشدة، مما يدعم دلالة التركيب على خاصية الاستعصاء على التصديق"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عجب"
      decision: confirmed
      decision_reason: "المعاجم تُثبت «العجب» بمعنيَيْن يدعمان المجموعة: (أ) «الأمر يُتعجَّب منه» (مجمل اللغة) — أي الشيء الخارق المُذهِل كخاصية موضوعية، (ب) «روعة تأخذ الإنسان عند استعظام الشيء» (المعجم الوسيط). ابن فارس يرجعه إلى الاستعظام والإنكار لخروج الشيء عن المألوف. اللمّة مقبولة مع تحديث التشكيل الكامل: عَجَبٌ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "عَجَبٌ هو اللمّة الوحيدة المؤكدة في المجموعة. يجمع بين الصفة الموضوعية للشيء الخارق (ما يُتعجَّب منه) والأثرِ الانفعالي الذي يُحدثه في المتلقي؛ وهو أوسع من مجرد «الاستعصاء على التصديق» إذ قد ينطوي على إعجاب وتقدير إضافةً إلى الاستغراب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَجَبٌ"

    - lemma: "لا معقولية"
      decision: removed
      decision_reason: "خطأ دلالي جوهري: اللامعقولية تُعبِّر عن انعدام الاتساق العقلي والتناقض مع المنطق (irrationality/absurdity)، وهو مفهوم مختلف عن «incredibility» الذي يعني صفة كون الشيء خارقاً لا يُصدَّق لغرابته الاستثنائية — لا لكونه غير منطقي. كذلك هي غير موثقة في أي معجم. ترجمة حرفية عمياء (blind calque)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الإِعْجَازِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الإعجاز في المعاجم مصطلح متخصص مرتبط بالإعجاز القرآني والبلاغي. استخدامه مصدراً صناعياً لخاصية عامة (= كون الشيء لا يُصدَّق) يُفضي إلى التداخل مع الدلالة الدينية الراسخة. غير موثق كمصطلح مستقل بالمعنى المستهدف."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الاِسْتِغْرَابِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الاستغراب = وجدان الشيء غريباً عن المألوف، أعمُّ من «الاستعصاء على التصديق» الذي يتطلب غرابةً استثنائية شديدة. غير موثق في المعاجم كمصطلح قائم. يمكن إبدال «الاستغرابية» بـ «الغرابية» أو «اللاألفية» فتبقى فكرة الغرابة قائمة → التمييز ضعيف."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "الأُعْجُوبِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الأعجوبة اسمٌ للشيء العجيب المحسوس لا للخاصية المجردة (= concrete vs. abstract). المصطلح المقترح غير موثق في المعاجم ولم يُسكَّ. يفتقر إلى التثبيت المعجمي والتداول الفعلي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "عُسْرُ التَّصْدِيق"
      source: stage1
      decision: removed
      decision_reason: "يفشل اختبار السكّ المصطلحي: يمكن إبدال «عُسر» بـ«صعوبة» فتصبح «صعوبة التصديق» وصفاً صالحاً بالقدر ذاته → التعبير تركيبي حر لا مصطلح ثابت. كذلك يصف ردَّ الفعل المُحدَث في المتلقي لا الخاصية الموضوعية للشيء، مما يُخرجه عن نطاق الهيبرونيم (جَوْدَة/نَوْعِيَّة)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


