stage3_analysis:
  per_lemma:
    - lemma: "إِثَارَة"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في مسرد الإعلام والتواصل (ALECSO) بالترجمة الإنجليزية «sensation»، وهي
        أكثر لمّات المجموعة شيوعاً في الاستخدام العربي الحديث لمفهوم الإثارة الإعلامية.
        صحيح أنها عامة وتستخدم في مجالات متعددة، إلا أن غياب مصطلح أرسخ منها يُبرر الإبقاء عليها
        مع التوثيق الدقيق للفروق الدلالية. التشكيل الموجود «إِثَارَة» صحيح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُمثّل الظاهرة في صورتها المجردة الشاملة — الإثارة كمضمون يستهدف المشاعر بصرف النظر عن الوسيلة أو القطاع؛ يختلف عن «صحافة الإثارة» بأنه لا يقتصر على الحقل الصحفي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِثَارَة"

    - lemma: "صِحَافَة الْإِثَارَة"
      decision: confirmed
      decision_reason: >
        المركب الإضافي موثّق في مسرد الإعلام والتواصل (ALECSO) بترجمة «sensational press»، وهو
        وحدة معجمية ثابتة ومسجّلة في قاعدة البيانات (entry_id 486227). اجتاز اختبار التثبيت
        المعجمي: لا يمكن إبدال «صحافة» بـ«كتابة» أو «إعلام» مع بقاء نفس المصطلح المتداول.
        الشكل القائم في AWN4 محتمل التشكيل الصحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُخصِّص المفهوم في الحقل الصحفي والإعلامي تحديداً؛ يختلف عن «إثارة» المجردة بأنه يُشير إلى أسلوب صحفي بعينه يعتمد على المحتوى المثير كمنهج تحريري"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صِحَافَةُ الْإِثَارَةِ"

    - lemma: "الإِسْفَافُ"
      source: stage1
      decision: removed
      decision_reason: >
        على الرغم من وجود الجذر في المعجمية العربية بمعنى «التَّدَنِّى فى القَوْلِ أو الفِعْل»،
        يدل «الإسفاف» على الانحطاط الأخلاقي/الأسلوبي العام لا على المحتوى المُصمَّم بقصد
        استثارة الجمهور وإرضاء أذواقه. الدلالة تصف الصفة وليس المحتوى الموضوعي، وهو بعيد
        عن البنية الدلالية لـ sensationalism كـ subject matter.

    - lemma: "التَّهْوِيلُ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دعم معجمي مباشر، ومقاييس اللغة تحصر دلالة «هول» في «المخافة» و«الترهيب»،
        مما يجعل التهويل أقرب إلى مفهوم scaremongering منه إلى sensationalism الذي يستهدف
        إرضاء الأذواق المبتذلة وليس استثارة الخوف تحديداً.

    - lemma: "الاسْتِفْزَازُ"
      source: stage1
      decision: removed
      decision_reason: >
        الاستفزاز يُترجَم في المعجمية العربية الحديثة بـ«provocation»، وهو يدل على استدعاء ردّ
        فعل عدائي/دفاعي، بينما sensationalism يستهدف الإغراء والإمتاع عبر المحتوى المثير.
        الفرق الجوهري أن الاستفزاز يُزعج المتلقي، بينما sensationalism يُرضيه ويغريه.

    - lemma: "الابْتِذَالُ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دعم معجمي مباشر في قاعدة البيانات، ومقاييس اللغة تُعرّف الجذر «بذل» بـ«ترك صيانة
        الشيء». الابتذال يصف حالة الانحطاط التي يصل إليها المحتوى لا المحتوى المُصمَّم ابتداءً
        لاستهداف الأذواق الدنيا؛ وهو غير مُثبَّت كمصطلح إعلامي في المصادر المُستعلَمة.


