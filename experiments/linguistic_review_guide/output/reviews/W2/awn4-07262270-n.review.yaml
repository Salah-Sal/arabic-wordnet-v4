stage1_review:
  assessment:
    concerns:
      - "لمّة «إثارة» عامة جداً وتحتمل معاني متعددة في مجالات شتى (علم الأحياء، الكيمياء، التربية، الطب)، مما يُضعف قيمتها كمصطلح مخصص للمفهوم الإعلامي المقصود"
      - "لمّة «صحافة الإثارة» تُضيِّق المفهوم على الحقل الصحفي تحديداً، بينما المجموعة تمثل subject matter بمعناه الأشمل الشامل للأدب والفن والإعلام"
      - "التعريف الحالي «موضوع مصمم لإثارة وإرضاء الأذواق المبتذلة» يفتقر إلى أسلوب المعجم الصناعي (جنس قريب + فصل نوعي) وفيه طابع إنجليزي في استخدام «مصمم»"
      - "غياب التمييز الدلالي بين اللمّتين: لا توثيق للفرق بين «إثارة» المطلقة و«صحافة الإثارة» المقيّدة"
    observations: >
      تمثّل هذه المجموعة مفهوم «sensationalism» بوصفه محتوىً أو موضوعاً يستهدف استثارة المشاعر وإرضاء الأذواق الدنيا،
      وهو مفهوم له حضور في التراث العربي تحت مسمّيات الإسفاف والتهويل والابتذال. اللمّة «إِثَارَة» جذرها «ثور» الدالّ
      على الانبعاث والحركة، وهي مشتقة على وزن «إفعالة» (مصدر أثار يُثير)، ولها استخدام راسخ في مسرد الإعلام، لكنها
      متعددة المعنى. «صحافة الإثارة» مركب إضافي موثق معجمياً لكنه يقصر المفهوم على الصحافة.
      المعجمية العربية الحديثة تستخدم «الإثارية» (في المورد الحديث) كترجمة لأحد معنيَيْ sensationalism.

  blind_candidates:
