      generation_method: ishtiqaq
      justification: "من جذر سَفَفَ على وزن الإفعال؛ كما في «أسفَّ الرجل للأمر الدنيء: تدنّى إليه»، وفي المعجم الكبير «التَّدَنِّى فى القَوْلِ أو الفِعْل». يُعبّر عن الانحدار الأسلوبي واستهداف الأذواق الدنيا في المحتوى الإعلامي."
    - lemma: "التَّهْوِيلُ"
      generation_method: ishtiqaq
      justification: "من جذر هَوَلَ على وزن التفعيل؛ «هوَّل: ضخَّم الأمور وجعلها مُرعبة/مثيرة». يُعبّر عن المبالغة الإعلامية في تصوير الموضوعات لجذب انتباه الجمهور."
    - lemma: "الاسْتِفْزَازُ"
      generation_method: ishtiqaq
      justification: "من جذر فَزَزَ على وزن الاستفعال؛ الاستفزاز هو استدعاء الاستجابة الانفعالية الحادة. يُعبّر عن محتوى يستهدف إثارة ردود الفعل العاطفية الفورية في المتلقي."
    - lemma: "الابْتِذَالُ"
      generation_method: ishtiqaq
      justification: "من جذر بَذَلَ على وزن الافتعال؛ مقاييس اللغة: «ترك صيانة الشيء». يُعبّر عن المحتوى الذي يتخلى عن معايير الرصانة ويتوجه نحو الأذواق الدنيا."


