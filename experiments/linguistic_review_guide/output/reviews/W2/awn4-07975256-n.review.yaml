stage1_review:
  candidates:
    - lemma: مَجْمُوعَةُ طَوَابِعَ
      generation_method: tarkib
      justification: "تركيب إضافي يعبر بدقة عن ضم طوابع البريد والاحتفاظ بها."
    - lemma: تَشْكِيلَةُ طَوَابِعَ
      generation_method: tarkib
      justification: "تركيب إضافي يدل على جمع الطوابع وتصنيفها كتشكيلة متنوعة."
    - lemma: حَصِيلَةُ طَوَابِعَ
      generation_method: tarkib
      justification: "تركيب إضافي يعبر عن ما تم جمعه من الطوابع على مر الزمن."
    - lemma: طَوَابِعُ مُجَمَّعَةٌ
      generation_method: tarkib
      justification: "تركيب وصفي يصف الطوابع بحالة الجمع."
  concerns:
    - "اللمة الحالية (مجموعة طوابع) صحيحة وشائعة لكنها تفتقر إلى التشكيل."
    - "التعريف الحالي (مجموعة من الطوابع) دائري نوعاً ما ويفتقر للعمق المعجمي الذي يوضح غرض الجمع (كالهواية)."
  observations:
    - "مفهوم 'مجموعة الطوابع' يعبر عن حاصل عملية 'جمع الطوابع' (philately) والتي هي هواية معروفة، لذا فالتركيب الإضافي 'مجموعة طوابع' هو الأنسب والأكثر شيوعاً والمثبت معجمياً."

