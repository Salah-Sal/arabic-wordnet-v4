  per_entry:
    - lemma: "طَلَبٌ"
      entry_id: "{auto}"
      root: "طلب"
      maqayis_quote: "«الطَّاءُ وَاللَّامُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ابْتِغَاءِ الشَّيْءِ. يُقَالُ: طَلَبْتُ الشَّيْءَ أَطْلُبُهُ طَلَبًا.»"
