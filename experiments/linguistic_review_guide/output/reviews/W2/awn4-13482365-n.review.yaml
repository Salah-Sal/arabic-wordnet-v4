stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'طلب' تفتقر إلى التشكيل الكامل."
    observations: "المفهوم يعبر عن 'الطلب' في السياق الاقتصادي، وهو مصطلح مستقر يجمع بين الرغبة والقدرة المالية. التعريف الحالي دقيق علمياً."
  blind_candidates:
    - lemma: "طَلَبٌ"
      generation_method: ishtiqaq
      justification: "اللفظ القياسي والمباشر للمفهوم في الاقتصاد، مشتق من مادة (ط ل ب) التي تدل على ابتغاء الشيء."
    - lemma: "إِقْبَالٌ"
      generation_method: majaz
      justification: "يُستخدم في لغة الاقتصاد المعاصرة للتعبير عن رغبة المستهلكين وتوجههم نحو شراء سلعة أو خدمة."
    - lemma: "طَلَبٌ اسْتِهْلَاكِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي يخصص الطلب بالجانب الاستهلاكي، وهو شائع في التقارير الاقتصادية."
    - lemma: "تَهَافُتٌ"
      generation_method: majaz
      justification: "يعبر عن الطلب الشديد والمتزايد، مستعار من تساقط الشيء أو تتابع القوم."

stage2_evidence:
  per_lemma:
    - lemma: "طَلَبٌ"
      confirm:
        - text: "(الطّلب) الْمَطْلُوب و (فِي الاقتصاد) الكمية الَّتِي يقبل الْأَفْرَاد شراءها من سلْعَة مَا بِثمن معِين."
          source: "المعجم الوسيط"
        - text: "(في الاقتصاد): كميَّة يقبلُ الأفرادُ شراءها من سلعةٍ ما بثمن معيّن. العَرْضُ والطَّلَبُ: ما يُعْرَض من بضائع للبيع وما يُطلَب شراؤه منها."
          source: "معجم اللغة العربية المعاصرة"
        - text: "عدد الوحدات التي يجري شراؤها من سلعة معيّنة بأسعار مختلفة في فترة زمنية محدّدة."
          source: "المعجم الموحد لمصطلحات المياه (عن ArabTerm)"
    - lemma: "إِقْبَالٌ"
      expands:
        - text: "الْقَافُ وَالْبَاءُ وَالْلَامُ أَصْلٌ وَاحِدٌ صَحِيحٌ تَدُلُّ كَلِمُهُ كُلُّهَا عَلَى مُوَاجَهَةِ الشَّيْءِ لِلشَّيْءِ... والْقِبْلَةُ سُمِّيَتْ قِبْلَةً لِإِقْبَالِ النَّاسِ عَلَيْهَا."
          source: "مقاييس اللغة"
        - text: "يُستخدم في السياق الاقتصادي المعاصر للدلالة على رغبة المشترين (مثال: إقبال شديد على الشراء)."
          source: "ملاحظة لغوية (الاستعمال الشائع)"
    - lemma: "تَهَافُتٌ"
      expands:
        - text: "وتهافت النَّاس على المَاء تتابعوا."
          source: "المعجم الوسيط"
        - text: "يعبر عن التزاحم الشديد على الشراء."
          source: "ملاحظة لغوية"

stage3_analysis:
  per_lemma:
    - lemma: "طلب"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والدقيق للمفهوم في علم الاقتصاد، مدعوم بأدلة قوية من المعاجم الحديثة والمتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَلَبٌ"
    - lemma: "إِقْبَالٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف شائع الاستخدام في السياق الاقتصادي للتعبير عن توجه المستهلكين ورغبتهم في الشراء."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِقْبَالٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَهَافُتٌ"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن حالة خاصة من الطلب تتسم بالشدة والاندفاع، وهو مفيد لتوسيع الشبكة الدلالية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَهَافُتٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "القدرة والرغبة في شراء السلع والخدمات"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لكنه يفتقر إلى الجنس القريب (كمية) والقيود الاقتصادية (السعر والزمن) ليكون تعريفاً معجمياً مكتملاً."
    authored:
      - type: terminological
        text: "في الاقتصاد: كمية السلع والخدمات التي يرغب المستهلكون في شرائها ويقدرون على ثمنها عند سعر معين وفي وقت محدد."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "في الاقتصاد: كمية السلع والخدمات التي يرغب المستهلكون في شرائها ويقدرون على ثمنها عند سعر معين وفي وقت محدد."}
  examples:
    per_lemma:
      - lemma: "طَلَبٌ"
        examples:
          - text: "يتحدد ثمن السلعة في السوق الحرة بناءً على توازن العرض والطلب."
            type: usage
      - lemma: "إِقْبَالٌ"
        examples:
          - text: "شهدت المنتجات الوطنية إقبالاً كبيراً من المستهلكين لجودتها وتنافسية أسعارها."
            type: usage
      - lemma: "تَهَافُتٌ"
        examples:
          - text: "أدى الإعلان عن التخفيضات الموسمية إلى تهافت المشترين على المتاجر الكبرى."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يؤدي ارتفاع الدخل المتاح عادة إلى زيادة الطلب على السلع الكمالية."}

