# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمة الوحيدة 'استدامة' مكتوبة بدون تشكيل — يجب تشكيلها كاملاً: اسْتِدَامَة"
      - "التعريف الحالي 'خاصية كون الشيء مستداماً' دائري: يستعمل 'مستداماً' (المشتق من الجذر ذاته) في تعريف 'الاستدامة'"
      - "التعريف مجرد نقل شبه حرفي للتعريف الإنجليزي، خالٍ من الجنس القريب والفصل النوعي الكافيَين"
      - "المجموعة فقيرة باللمات: لمة واحدة فقط، في حين يمكن إثراؤها"
    observations: >
      المجموعة تُمثّل المفهوم التقني الحديث لـ'الاستدامة' بوصفه خاصية مجردة للنظم والعمليات.
      اللمة 'استدامة' مصدرٌ قياسي للفعل 'استدام' على وزن اسْتِفْعَال من الجذر الثلاثي 'د-و-م'،
      والاشتقاق صحيح مطّرد. الكلمة راسخة في المعجمية التقنية العربية المعاصرة ومُستخدمة
      استخداماً واسعاً عبر المعاجم الموحدة لمنظمة اليونسكو والجهات المعيارية العربية.
      غير أن التعريف الحالي يستحق تطويراً جوهرياً ليُبرز الفصل النوعي المتعلق بصون الموارد
      عبر الأجيال، وهو الجوهر الدلالي للمصطلح في سياقه العلمي البيئي والتنموي.

  blind_candidates:
    - lemma: "دَوَامِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من 'دوام' (مصدر دَامَ يَدُومُ، جذر د-و-م)، على وزن فَعَالِيَّة.
        يُعبّر عن خاصية الدوام والاستمرار المُتأصّلة في الشيء. الاشتقاق مطّرد
        (كالصحّية من صحّة، والحيوية من حيوية). يُلتقط فيه المعنى المحوري
        لـ'الخاصية المتعلقة بالبقاء والاستمرار'.

    - lemma: "تَحَمُّلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من 'تحمّل' (من الجذر ح-م-ل)، على وزن تَفَعُّلِيَّة.
        يُعبّر عن خاصية تحمّل الضغوط والاستمرار رغمها. شائع في المعجمية التقنية
        بمعنى قابلية المادة أو النظام لتحمّل الإجهاد.

    - lemma: "صُمُودِيَّة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من 'صمود' (الثبات في وجه الشدائد) إلى خاصية القدرة على
        الاستمرار رغم الضغوط. تربطهما مشابهة وظيفية: كلاهما يدل على الديمومة
        رغم العوامل المُهدِّدة. الصمودية أقوى دلالة على المقاومة الفاعلة.

    - lemma: "قَابِلِيَّةُ الدَّيْمُومَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي: قابلية (الخاصية الكامنة في الشيء للاتصاف) + ديمومة (الاستمرار
        والبقاء). يُصرّح بالجنس 'قابلية' ويُقيّده بـ'الديمومة'، مما يُحيل مباشرة
        إلى 'الخاصية المتعلقة بالاستمرار'.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المُنجَزة:
#   ١) مطابقة دفعية: استدامة + تحملية + دوامية + صمودية + قابلية الديمومة + استمرارية + ديمومة
#   ٢) جسر إنجليزي: sustainability / sustainable / durability / sustainment
#   ٣) FTS عربي: استدامة / مستدام / ديمومة / دوام / استمرار
#   ٤) مقاييس اللغة: جذر دوم (dictionary_id=151)
#   ٥) تحقق المرشحات الإضافي: استمرارية + ديمومة
stage2_evidence:

  per_lemma:

    - lemma: "اسْتِدَامَة"
      confirm:
        - text: >
            «يدل على وصول وتوصل كاف، واستخدام وإدارة للموارد الطبيعية، بشكل يضمن
            أن يكون رجال ونساء الأجيال الحالية والمستقبلية قادرين على تلبية
            احتياجاتهم الأساسية بدون انقطاع. نمط من السلوك الذي يضمن لكل عضو من
            الأجيال القادمة الخيارَ في الاستمتاع، على أقل تقدير، بنفس مستوى الرفاهية
            التي تمتع بها الجيل السابق. ويتم التركيز في التنمية المستدامة على العدالة
            بين الأجيال.»
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: >
            «يشمل مفهوم الاستدامة إمكانية الحماية من الضغوط والصدمات، من غير إلحاق
            الضرر بالموارد سواء أكانت طبيعية أو اجتماعية أو اقتصادية أو مؤسسية.»
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: >
            «الاستدامة البيئية: يُقصد بالاستدامة البيئية الحفاظ على إنتاجية الموارد
            الطبيعية الضرورية للحياة أو تحسينها، بحيث تستفيد منها أجيال المستقبل.»
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: >
            «توافق منتجات وخدمات المؤسسة مع توقعات أصحاب المصلحة، وبالتالي تحقيق
            إضافة قيمة اقتصادية وبيئية واجتماعية.» — استدامة الشركات
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: >
            «حالة تتحقق عندما تملك المؤسسة القدرة على اعتماد الهياكل واتخاذ
            الإجراءات اللازمة للتمكن من أداء وظائفها باستمرار على المدى البعيد.»
            — استدامة مؤسسية
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«اسْتِدَامَة» — translation_en: persistence"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يشير السياق الطبي إلى توسيع دلالي: استخدام 'استدامة' بمعنى 'الاستمرار والثبات'
            (persistence) في سياقات إكلينيكية، مما يُظهر مرونة الكلمة الدلالية خارج
            السياق البيئي التنموي.

    - lemma: "دَوَامِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَحَمُّلِيَّة"
      contradicts:
        - text: "«التَّحمُّليّة؛ المتانة؛ طول البقاء.» — translation: durability"
          source: "المورد الحديث (2008)"
          conflict: >
            تُحيل 'التحمّلية' في المعجمية التقنية العربية إلى 'durability' (المتانة المادية
            وقدرة المادة على الصمود أمام التآكل والإجهاد)، لا إلى 'sustainability'
            (الاستدامة الإيكولوجية والتنموية). الفرق جوهري: durability خاصية مادية فيزيائية،
            بينما sustainability خاصية نظامية تشمل الأبعاد البيئية والاجتماعية والاقتصادية.
        - text: "«تحمُّلية» — domain: Masonry-Carpentry، translation: durability"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 2: بناء - تجارة (1999)"
          conflict: >
            توظيف 'تحمّلية' في سياق مواد البناء يُقيّد دلالتها بالمتانة الهندسية المادية،
            بعيداً عن المحتوى الدلالي لمصطلح 'الاستدامة' في AWN4.
        - text: "«مقاومة المواد للتآكل والتحلل والتفكك» — قوّة التحمّل"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: >
            السياق الجيولوجي يؤكد أن دلالة التحمّل مرتبطة بالمقاومة الفيزيائية لا
            بالاستدامة الإيكولوجية.

    - lemma: "صُمُودِيَّة"
      evidence_status: "no_material_found"

    - lemma: "قَابِلِيَّةُ الدَّيْمُومَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمة الموجودة ──────────────────────────────────────
    - lemma: "استدامة"
      decision: confirmed
      decision_reason: >
        لمة راسخة ومُثبّتة في المعجمية التقنية العربية المعاصرة بمعنى 'sustainability'
        عبر طيف واسع من المعاجم الموحدة (المناخ، المياه، الطاقة، الزراعة). الاشتقاق
        صحيح على وزن اسْتِفْعَال من الجذر الثلاثي دوم، وهو الوزن الدال على استبقاء
        الحدث وطلب إدامته، مما يُلائم دلالة الخاصية. تحتاج فقط إلى تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: >
        اسْتِفْعَال — وزن مصدري دال على الطلب والاستبقاء (استدام = جعله دائماً وسعى
        إلى إدامته). يُناسب تماماً مفهوم 'الخاصية الساعية إلى الديمومة'.
      borrowing_check:
        loanword: false
        blind_calque: false
        note: "اشتقاق عربي خالص من جذر دوم الكلاسيكي"
      quality_gate:
        ittiraad: true
        yusr: true
        mulaama: true
        taraathuhi: true
        arabiyyah: true
        ishtiqaaqiyyah: true
      nuance_differentiation: >
        'اسْتِدَامَة' هي اللمة الوحيدة المؤكدة. تتمايز عن أقرب المفاهيم المجاورة:
        عن 'ديمومة' (الفلاة الواسعة / الثبات المطلق) بأنها تحمل بُعداً غائياً-عملياً
        (إدارة الموارد وصونها)؛ وعن 'استمرارية' (التسلسل الزمني المتصل) بأنها تشترط
        التوازن بين الحاجة الراهنة وحقوق الأجيال القادمة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِدَامَة"

    # ── المرشحات من المرحلة ١ ──────────────────────────────
    - lemma: "دَوَامِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية للمصطلح في قاعدة البيانات (no_material_found). فضلاً عن ذلك،
        'دوامية' لو اشتُقّت ستحمل دلالة الثبات الأزلي المطلق (من 'الدوام' = الأبدية)
        وهو أعمق من مجرد خاصية الاستدامة المحدودة بالأجيال. كما أن الدلالة التراثية
        لـ'دوام' تتداخل مع صفة إلهية، مما يجعل التداول التقني مُشكلاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تَحَمُّلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة تُثبت أن 'تحمّلية' مُوظَّفة في المعجمية التقنية العربية مقابل 'durability'
        (المتانة المادية) لا 'sustainability'. إدراجها في هذه المجموعة سيُفضي إلى تداخل
        مصطلحي مُشكل بين مفهومين متمايزَين: المتانة الهندسية والاستدامة الإيكولوجية.
        قرار الحذف منطقي ووقائي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "صُمُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية في قاعدة البيانات. والمصطلح لم يُثبَّت في المعجمية التقنية
        العربية. الإزاحة الدلالية من 'الصمود' (المقاومة الفاعلة) إلى 'الاستدامة'
        بعيدة: 'الصمود' يستحضر مواجهة الخطر لا الإدارة الرشيدة للموارد. فضلاً
        عن أن 'صمودية' لم تُسَكّ بعدُ كمصطلح معيارٍ في أي هيئة لغوية عربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "قَابِلِيَّةُ الدَّيْمُومَة"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير المركب لم يَرِد في قاعدة البيانات كوحدة معجمية مُثبَّتة. اختبار السكّ
        يكشف أنه وصفي-حرّ: يمكن إبدال 'الديمومة' بـ'الاستمرار' أو 'البقاء' دون أن
        يفقد الوصف صلاحيته، مما يدل على عدم التثبيت الاصطلاحي. وكلمة 'ديمومة'
        كلاسيكياً تعني 'الفلاة الواسعة لا ماء فيها' (المعجم الكبير)، وهو معنى نائٍ
        عن سياق الاستدامة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


