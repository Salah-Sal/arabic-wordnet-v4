      maqayis_quote: >
        «الدَّالُ وَالْوَاوُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى السُّكُونِ وَاللُّزُومِ.
        يُقَالُ دَامَ الشَّيْءُ يَدُومُ، إِذَا سَكَنَ... وَاسْتَدَمْتُ الْأَمْرَ، إِذَا
        رَفَقْتَ بِهِ... فَمَا صَلَّى عَصَاكَ كَمُسْتَدِيمِ»

  per_sense:
