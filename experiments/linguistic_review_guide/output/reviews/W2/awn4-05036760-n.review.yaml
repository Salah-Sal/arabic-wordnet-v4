    cultural_fit_note: >
      المفهوم حديث النشأة في صياغته التقنية (المعنى الإيكولوجي التنموي للاستدامة
      تبلوَر في السبعينيات مع تقرير برونتلاند 1987). العربية لا تمتلك كلمة موروثة
      مُخصَّصة لهذا المعنى التقني الدقيق، وإن كانت استعارت 'استدامة' من الجذر
      الكلاسيكي دوم وأعادت توظيفه. لذا يُصنَّف lexical_gap: المفهوم موجود
