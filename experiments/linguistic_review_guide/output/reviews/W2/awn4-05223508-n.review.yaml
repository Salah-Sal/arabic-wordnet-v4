# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id : awn4-05223508-n
# ili       : i64380
# pos       : n
# waxiness — صفة كون الشيء مصنوعاً من الشمع أو مغطى به
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'شمعية' مكتوبة بلا تشكيل؛ يجب ضبطها شَمْعِيَّة"
      - "المفهوم (waxiness كصفة مجردة) نادر الاستعمال المعجمي المستقل في العربية"
      - "التعريف الحالي يستخدم تركيبة 'صفة كون الشيء...' المنقولة حرفياً من الإنجليزية، وهي غير طبيعية في أسلوب المعجم الوسيط"
    observations: >-
      المجموعة تعبّر عن الخاصية المجردة التي يتّصف بها ما كان شمعياً (waxiness).
      المسلك الاشتقاقي الأنسب هو المصدر الصناعي من النسبة: شمعيّ → شَمْعِيَّة،
      وهو قياس مطّرد في العربية (ذَهَبِيَّة، حَرِيرِيَّة، مَعْدِنِيَّة...).
      غياب التشكيل عن اللمّة الموجودة مشكلة شكلية تستلزم التصحيح.
      التعريف الحالي صحيح مضموناً لكنه يستحق إعادة صياغة بأسلوب أكثر عربيّة.

  blind_candidates:
    - lemma: "شَمَعِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي قياسي من النسبة 'شَمَعِيّ'، على صيغة (فَعَلِيَّة) من المضاف إليه،
        يفيد الخاصية الشمعية تماماً كما تفيد 'حَرِيرِيَّة' صفة الحرير.
        القياس مطّرد وإن كان الضبط الدقيق يتحدد بضبط المصدر الأساسي (شَمْع أو شَمَع).
    - lemma: "شَمُوعَة"
      generation_method: ishtiqaq
      justification: >-
        على وزن (فَعُولَة) المنتج للصفات الطبيعية المجردة كلُيُونَة وحُمُوضَة وبُرُودَة،
        من جذر (ش م ع)، يفيد طبيعة الشمع الفيزيائية (الليونة، والقابلية للانصهار، والطلاء).
    - lemma: "تَشَمُّع"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل 'تَشَمَّعَ' على وزن تَفَعُّل، يفيد اكتساب الطابع الشمعي
        أو التغطّي بالشمع، مناسب للإشارة إلى الحالة أو العملية الشمعية.
    - lemma: "شَمَعَانِيَّة"
      generation_method: ishtiqaq
      justification: >-
        على وزن (فَعَلَانِيَّة) المنتج للأسماء المجردة المعبّرة عن الطبيعة الجوهرية
        كرُوحَانِيَّة ونَفْسَانِيَّة وجِسْمَانِيَّة، من جذر (ش م ع)، يصف الطابع الجوهري
        الشمعي للمادة بما يتجاوز مجرد التغطية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفّذة:
#   Q1 — مطابقة دقيقة دفعية: شمعية + الشمعية + شموعة + الشموعة
#          + تشمع + التشمع + شمعانية + الشمعانية
#   Q2 — جسر إنجليزي: waxiness | waxy | wax | wax quality | wax-like
#   Q3 — بحث FTS عربي: شمع | شمعي | مشمع | شمعاني
#   Q4 — مقاييس اللغة: dictionary_id=151, headword_norm IN ('شمع','الشمع')
stage2_evidence:
  per_lemma:

    # ── اللمة الموجودة ──
    - lemma: "شمعية"
      contradicts:
        - text: >-
            «شمعية — ترجمة إنجليزية: Myrica»
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          conflict: >-
            المدخل يستعمل 'شمعية' اسماً لجنس نباتي (Myrica)، لا صفةً مجردة تفيد خاصية الشمع؛
            هذا استعمال مغاير كلياً يُنشئ اشتراكاً لفظياً مع دلالة المجموعة.
      confirm:
        - text: >-
            «شمعية — من (ش م ع) نسبة إلى الشمع.»
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
      expands:
        - text: >-
            «(1) «أ» شمعيّ. «ب» مُشمَّع
             (2) «أ» شَمْعانيّ: شبيه بالشَّمع؛ مثل: «ب» لَدْن؛ طَوِيّ؛ مَرِن.
                 «ج» ناعم أو ناصع البياض had a waxy complexion
             (3) مشمَّع: محتوٍ على مخزون نَشَويّ a waxy organ (مض).»
          source: "المورد الحديث (2008)"
          addition: >-
            يثبت أن 'شمعي' الصفةَ موثّقة في المعاجم الحديثة مقابل (waxy)،
            وأن 'شمعاني' تناوبٌ أسلوبي مقبول. هذا يدعم قياسية المصدر الصناعي 'شمعية'
            من هذه الصفة. كما يكشف عن دلالتين فرعيتين: الشِّبه الظاهري والتركيب الكيميائي.

    # ── مرشح ١ ──
    - lemma: "شَمَعِيَّة"
      confirm:
        - text: >-
            «شمعي — من (ش م ع) نسبة إلى الشمع.» [أساس الاشتقاق المباشر للمرشح]
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
      expands:
        - text: >-
            «شمعي — waxy» [أدلة على استعمال الصفة الأساسية في عدة مجالات تقنية:
            الجيولوجيا، الزلازل، الطب، الصحة]
          source: "معاجم ALECSO الموحدة متعددة التخصصات"
          addition: >-
            الصفة 'شمعي' راسخة في السياقات التقنية، مما يدعم قياسية المصدر الصناعي منها.

    # ── مرشح ٢ ──
    - lemma: "شَمُوعَة"
      evidence_status: "no_material_found"

    # ── مرشح ٣ ──
    - lemma: "تَشَمُّع"
      evidence_status: "no_material_found"

    # ── مرشح ٤ ──
    - lemma: "شَمَعَانِيَّة"
      expands:
        - text: >-
            «شَمْعانيّ: شبيه بالشَّمع؛ لَدْن؛ طَوِيّ؛ مَرِن.»
          source: "المورد الحديث (2008)"
          addition: >-
            يثبت أن الصفة 'شمعاني' موثّقة مقابل (waxy)، مما يجعل المصدر الصناعي
            'شمعانية' منها مشتقاً قياسياً محتملاً. لكن المصدر الصناعي ذاته غير موثّق.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمة الموجودة ──
    - lemma: "شمعية"
      decision: confirmed
      decision_reason: >-
        المصدر الصناعي من 'شمعي' (النسبة إلى الشمع) على وزن (فَعْلِيَّة) هو القياس
        المطّرد في العربية للتعبير عن الخاصية المجردة للصفة، مثل ذَهَبِيَّة وحَرِيرِيَّة
        ومَعْدِنِيَّة. اللمة مؤيَّدة بدليل الاشتقاق (موسوعة السلطان قابوس) وبتوثيق الصفة
        الأصل 'شمعي' في معاجم تقنية متعددة. التعارض مع مدخل AGROVOC (اسم جنس نباتي)
        لا يطعن في صحة الاستعمال هنا لأن الدلالتين مختلفتان والمقام محدّد. اللمة تستحق
        الإبقاء مع تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphological_check: >-
        الوزن الصحيح: شَمْعِيَّة (شَمْع + ياء النسبة + تاء التأنيث المصدرية)؛
        ضبط الميم بالسكون لا بالفتح لأن المصدر هو شَمْع لا شَمَع.
      borrowing_check: >-
        المصطلح عربي خالص. المصدر الصناعي من النسبة قياس معروف ليس اقتراضاً.
      term_quality:
        consistency: "قياسي ومطّرد على نمط حَرِيرِيَّة وذَهَبِيَّة"
        usability: "خفيف النطق، سهل التداول"
        appropriateness: "ملائم للمفهوم المجرد"
        heritage_preference: "يعتمد جذراً عربياً أصيلاً"
        arabic_preference: "عربي بامتياز"
        derivability: "قابل للاشتقاق منه: التشمعية، اللاشمعية"
      nuance_differentiation: >-
        شَمْعِيَّة (مصدر صناعي) تعبّر عن الخاصية المجردة للشيء الشمعي، وتختلف عن
        'شَمْعِيّ' (صفة تصف الشيء بكونه شمعياً) وعن 'مُشَمَّع' (اسم مفعول يدل على
        الشيء المعالَج بالشمع)؛ فالمجموعة تستهدف الخاصية لا الوصف الآني ولا المعالجة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَمْعِيَّة"

    # ── مرشح ١ (شَمَعِيَّة) — نفس اللمة الموجودة بعد التسوية ──
    - lemma: "شَمَعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        بعد التسوية والضبط الصرفي يتّضح أن هذا المرشح مطابق للمة الموجودة 'شمعية'
        بعد التشكيل الصحيح (شَمْعِيَّة). الضبط الأصح هو شَمْعِيَّة (بسكون الميم)
        لا شَمَعِيَّة (بفتحها)، لأن المصدر المباشر هو شَمْع لا شَمَع. لا حاجة لإضافة
        مدخل مستقل.

    # ── مرشح ٢ ──
    - lemma: "شَمُوعَة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا يوجد توثيق معجمي لهذا الوزن من جذر شمع بالمعنى المطلوب. وزن فَعُولَة
        ينتج عادةً من جذور تدل على صفات ذاتية فيزيائية محسوسة (حُمُوضَة من حمض،
        لُيُونَة من لين)، لكن 'الشمع' مادة خارجية لا صفة ذاتية، مما يُضعف قياسية
        هذا الوزن هنا. فضلاً عن غياب الشاهد المعجمي.

    # ── مرشح ٣ ──
    - lemma: "تَشَمُّع"
      source: stage1
      decision: removed
      decision_reason: >-
        وزن تَفَعُّل يدل على الاكتساب والتحوّل والعملية التدريجية، لا على الخاصية
        المجردة. المجموعة تستهدف الصفة الجامدة (quality/waxiness) لا العملية
        (waxing/becoming waxy). كما لم يُوثَّق في المعاجم المستعلَمة.

    # ── مرشح ٤ ──
    - lemma: "شَمَعَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم توثيق الصفة 'شمعاني' في المورد الحديث بمعنى (waxy)، فإن المصدر الصناعي
        منها 'شمعانية' غير موثّق في أي معجم مستعلَم. الصيغة أثقل صوتياً من 'شمعية'
        دون إضافة معنوية؛ والأخف القياسي أَوْلى (مبدأ إيثار الأيسر).


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة كون الشيء مصنوعاً من الشمع أو مغطى به"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي صحيح المضمون لكن تركيبة 'صفة كون الشيء...' ترجمةٌ حرفية
        من الإنجليزية (the quality of being...) لا تجري على أسلوب المعجم الوسيط
        الذي يبدأ عادةً بالجنس القريب ثم الفصل. يُضاف إلى ذلك أن 'مغطى' تختلف
        عن 'مكسوّ' وكلتاهما أدق من الأخرى في سياقات مختلفة.

    authored:
      - type: terminological
        text: >-
          خاصيَّةُ الشَّيءِ الشَّمْعِيِّ؛ وهي كونُه مصنوعاً من الشَّمع أو مكسوّاً به.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >-
          الطَّابَعُ الشَّمْعِيُّ في المادَّة أو السَّطح؛ ما كانَ أصلُه الشَّمعَ
          أو اكتسبَ غلافاً منه.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false

    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05223508-n"
          definition_index: 0
          text: "خاصيَّةُ الشَّيءِ الشَّمْعِيِّ؛ وهي كونُه مصنوعاً من الشَّمع أو مكسوّاً به."

  examples:
    per_lemma:
      - lemma: "شَمْعِيَّة"
        examples:
          - text: >-
              تتميَّزُ ثمارُ التُّفَّاح بشَمْعِيَّتِها الطبيعيَّة التي تحمي قشرَتَها
              من الجفافِ والأكسدةِ في أثناء التَّخزين.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >-
            تتميَّزُ ثمارُ التُّفَّاح بشَمْعِيَّتِها الطبيعيَّة التي تحمي قشرَتَها
            من الجفافِ والأكسدةِ في أثناء التَّخزين.


