stage1_review:
  assessment:
    concerns:
      - "اللمات الموجودة تفتقر إلى التشكيل الكامل."
      - "لفظ 'انحراف' عام جداً وقد يشمل معاني أخلاقية أو هندسية لا علاقة لها بحركة السفن والطائرات."
      - "التعريف العربي الحالي هو ترجمة شبه حرفية للتعريف الإنجليزي."
    observations: "المفهوم يتعلق بالانزياح الفيزيائي للمركبات عن مسارها بفعل عوامل طبيعية. في المعاجم المتخصصة (مثل المورد والمصطلحات الموحدة)، يُستخدم مصطلح 'انجراف' و'انسياق' بشكل دقيق لهذا المعنى."
  blind_candidates:
    - lemma: "انْسِيَاق"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (سوق) على وزن (انفعال)، ويدل على الانقياد للمؤثر الخارجي (الريح أو التيار)، وهو مصطلح فني دقيق في الملاحة."
    - lemma: "انْزِيَاح"
      generation_method: ishtiqaq
      justification: "من الجذر (زيح)، يدل على التنحي التدريجي عن الموضع أو المسار."
    - lemma: "تَجَانُف"
      generation_method: ishtiqaq
      justification: "من الجذر (جنف)، ويدل في اللغة على الميل عن الطريق المستقيم."
    - lemma: "شُرُود"
      generation_method: ishtiqaq
      justification: "من الجذر (شرد)، ويُستخدم للميل عن القصد أو المسار، وإن كان يشيع في المعاني المعنوية."

stage2_evidence:
  per_lemma:
    - lemma: "انحراف"
      confirm:
        - text: "«(في العلوم الطبيعيَّةِ) deviation : الشُّذوذُ عن الخط السَّوىّ»"
          source: "المعجم الكبير"
        - text: "«انحراف السفينة أو الطائرة عن خط سيرها بسبب التيارات المائية أو الهوائية»"
          source: "المورد الحديث"
    - lemma: "انجراف"
      confirm:
        - text: "«(drift) : انجراف»"
          source: "المعجم الموحد لمصطلحات النفط"
        - text: "«انجراف قاري (continental drift)»"
          source: "المورد الحديث"
    - lemma: "انسياق"
      confirm:
        - text: "«الانسياق: انحراف السفينة أو الطائرة عن خط سيرها بسبب التيارات المائية أو الهوائية»"
          source: "المورد الحديث (تحت مادة drift)"
        - text: "«(drift) : انسياق»"
          source: "المعجم الموحد لمصطلحات الفيزياء"
    - lemma: "انزياح"
      confirm:
        - text: "«(drift) : انزياح»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"

stage3_analysis:
  per_lemma:
    - lemma: "انْحِرَاف"
      decision: confirmed
      decision_reason: "مصطلح عام وشامل يعبر عن الخروج عن المسار، وهو مستعمل بكثرة في السياقات العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْحِرَاف"
    - lemma: "انْجِرَاف"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً للتعبير عن الـ (drift) الناتج عن التيارات المائية والهوائية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْجِرَاف"
    - lemma: "انْسِيَاق"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق جداً ورد في المعاجم الحديثة (مثل المورد) لوصف انحراف المركبات تحديداً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "انْسِيَاق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "انْزِيَاح"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم في السياقات العلمية (الجيولوجيا والفيزياء) للتعبير عن الانتقال التدريجي عن الموضع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "انْزِيَاح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "الابتعاد التدريجي عن المسار المقصود بسبب مؤثرات خارجية (مثل السفينة أو الطائرة)"
    assessment:
      decision: revise
      reason: "لجعل التعريف أكثر دقة وصياغة بأسلوب معجمي رصين."
    authored:
      - type: terminological
        text: "تحوُّلُ السفينةِ أو الطائرةِ تدريجيّاً عن خطِّ سيرِها المقرَّرِ بفعلِ الرِّياحِ أو التياراتِ المائيةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "انْحِرَاف"
        examples:
          - text: "حذر القبطان من انحراف السفينة عن مسارها نتيجة العواصف المفاجئة."
            type: usage
      - lemma: "انْجِرَاف"
        examples:
          - text: "أدى انجراف القوارب بفعل التيار المائي إلى ضياع الصيادين في عرض البحر."
            type: usage
      - lemma: "انْسِيَاق"
        examples:
          - text: "يجب على الطيار حساب زاوية الانسياق بدقة لتجنب الابتعاد عن الممر الجوي."
            type: usage
      - lemma: "انْزِيَاح"
        examples:
          - text: "رصدت أجهزة المراقبة انزياحاً طفيفاً في مسار الطائرة المسيرة عن الإحداثيات المحددة."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "تحوُّلُ السفينةِ أو الطائرةِ تدريجيّاً عن خطِّ سيرِها المقرَّرِ بفعلِ الرِّياحِ أو التياراتِ المائيةِ."

stage5_enrichment:
  per_entry:
    - lemma: "انْحِرَاف"
      entry_id: "{auto}"
      root: "حرف"
      maqayis_quote: "«الْحَاءُ الرَّاءُ وَالْفَاءُ ثَلَاثَةُ أُصُولٍ: حَدُّ الشَّيْءِ، وَالْعُدُولُ، وَتَقْدِيرُ الشَّيْءِ... الِانْحِرَافُ عَنِ الشَّيْءِ. يُقَالُ انْحَرَفَ عَنْهُ يَنْحَرَفُ انْحِرَافًا.»"
    - lemma: "انْجِرَاف"
      entry_id: "{auto}"
      root: "جرف"
      maqayis_quote: "«الْجِيمُ وَالرَّاءُ وَالْفَاءُ أَصْلٌ وَاحِدٌ، هُوَ أَخْذُ الشَّيْءِ كُلِّهِ هَبْشًا. يُقَالُ: جَرَفْتُ الشَّيْءَ جَرْفًا، إِذَا ذَهَبْتَ بِهِ كُلِّهِ.»"
    - lemma: "انْسِيَاق"
      entry_id: "{auto}"
      root: "سوق"
      maqayis_quote: "«السِّينُ وَالْوَاوُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ حَدْوُ الشَّيْءِ. يُقَالُ ساقَهُ يَسُوقُهُ سَوْقًا.»"
    - lemma: "انْزِيَاح"
      entry_id: "{auto}"
      root: "زيح"
      maqayis_quote: "«الزَّاءُ وَالْيَاءُ وَالْحَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ زَوَالُ الشَّيْءِ وَتَنَحِّيهِ.»"
  per_sense:
    - lemma: "انْحِرَاف"
      sense_id: "{auto}"
      nuance: "المصطلح العام للعدول عن الخط المستقيم أو المسار المخطط له."
      mwe: false
    - lemma: "انْجِرَاف"
      sense_id: "{auto}"
      nuance: "يؤكد على فكرة الانقياد الكلي لقوة التيار أو الريح التي تجرف المركبة."
      mwe: false
    - lemma: "انْسِيَاق"
      sense_id: "{auto}"
      nuance: "مصطلح ملاحي تخصصي لوصف تأثر المركبات بالرياح العرضية (Leeway)."
      mwe: false
    - lemma: "انْزِيَاح"
      sense_id: "{auto}"
      nuance: "يشير إلى التنحي التدريجي والبطيء عن الموضع الأصلي."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حرف","maqayis":"«الْحَاءُ الرَّاءُ وَالْفَاءُ ثَلَاثَةُ أُصُولٍ... الِانْحِرَافُ عَنِ الشَّيْءِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جرف","maqayis":"«الْجِيمُ وَالرَّاءُ وَالْفَاءُ أَصْلٌ وَاحِدٌ، هُوَ أَخْذُ الشَّيْءِ كُلِّهِ هَبْشًا.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"سوق","maqayis":"«السِّينُ وَالْوَاوُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ حَدْوُ الشَّيْءِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"زيح","maqayis":"«الزَّاءُ وَالْيَاءُ وَالْحَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ زَوَالُ الشَّيْءِ وَتَنَحِّيهِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
