# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي حرفي للغاية وقد لا يستوعب الأبعاد القانونية لمصطلح paternity."
      - "الافتقار إلى مرادفات معاصرة تفرق بين المعنى البيولوجي والاجتماعي."
    observations: "المفهوم يشير إلى 'صفة الأب'، وهي علاقة قانونية واجتماعية وبيولوجية. اللفظ الأساسي هو 'أبوة'، ولكن في السياقات العلمية والحديثة ظهرت ألفاظ أخرى."
  blind_candidates:
    - lemma: "أُبُوَّة"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من (أب) للدلالة على الحالة أو الصفة."
    - lemma: "وَالِدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (والد) يكثر استخدامه في السياق الطبي والنفسي."
    - lemma: "أَبَوِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي منسوب لـ (أبوي)، يميل لاستخدامها في الأبعاد الفكرية أو العاطفية."
    - lemma: "نَسَب"
      generation_method: majaz
      justification: "يستخدم قانوناً للدلالة على الانتساب للأب (دعوى النسب)."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "أُبُوَّة"
      confirm:
        - text: "«أُبوَّة ... paternity»"
          source: "المعجم الموحد لمصطلحات القانون"
        - text: "«(1) الأُبوّة؛ الأَبَوية (2) أصل؛ منشأ ... paternity»"
          source: "المورد الحديث"
    - lemma: "وَالِدِيَّة"
      confirm:
        - text: "«وَالِدِيَّة»"
          source: "المعجم الطبي الموحد"
    - lemma: "أَبَوِيَّة"
      confirm:
        - text: "«(1) الأُبوّة؛ الأَبَوية»"
          source: "المورد الحديث"
    - lemma: "نَسَب"
      confirm:
        - text: "«النَّسَبُ: نَسَبُ القَراباتِ، وهو واحدُ الأَنْسابِ... وقيل: هو في الآباء خاصَّةً»"
          source: "لسان العرب"
      contradicts:
        - text: "«النَّسَبُ والنسبة، إدراك من جهة أحد الأبوين... نسب بالطول كالاشتراك بين الآباء والأبناء، ونسب بالعرض كالنسب بين بين الإخوة وبني الأعمام»"
          source: "التوقيف على مهمات التعاريف"
          conflict: "النسب مصطلح عام يشمل كل القرابات الطولية والعرضية، ولا يقتصر على صفة الأب وحدها."

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "أبوة"
      decision: confirmed
      decision_reason: "اللفظ الأصيل والشائع والمجمع عليه في كل المعاجم القديمة والحديثة والقانونية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُبُوَّة"
    - lemma: "أَبَوِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف معاصر موثق في المعاجم الحديثة للدلالة على الجانب العاطفي أو الفكري من الأبوة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أَبَوِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "وَالِدِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني يستخدم في السياقات الطبية والبيولوجية (والدية جينية) والاجتماعية المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "وَالِدِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَسَب"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام يشمل كل أنواع القرابة ولا يقتصر على حالة كون المرء أباً، بل يمتد للأجداد والأخوة والأعمام."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "حالة كونه أباً"
    assessment:
      decision: revise
      reason: "التعريف الحالي جملة وصفية تفتقر للبنية المعجمية."
    authored:
      - type: terminological
        text: "كَونُ المَرءِ أباً، وصِفَةُ الأبِ في عَلاقتِهِ ببنيهِ بيولوجياً أو قانونياً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "كَونُ المَرءِ أباً، وصِفَةُ الأبِ في عَلاقتِهِ ببنيهِ بيولوجياً أو قانونياً."}
  examples:
    per_lemma:
      - lemma: "أُبُوَّة"
        examples:
          - text: "الأُبوَّةُ مسؤوليةٌ كبرى تقتضي الرعايةَ والتوجيه."
            type: usage
      - lemma: "أَبَوِيَّة"
        examples:
          - text: "كان يتعامل مع طلابه بروحٍ أَبَوِيَّةٍ حانية."
            type: usage
      - lemma: "وَالِدِيَّة"
        examples:
          - text: "أثبتت فحوص الحمض النووي والدِيَّتَهُ المباشرة للطفل."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "أظهرت الدراسة تأثيراً كبيراً للأبوةِ في استقرار الأبناء النفسي."}

