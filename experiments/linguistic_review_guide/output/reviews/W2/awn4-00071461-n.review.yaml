stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائري نوعاً ما (فعل التحفيز؛ توفير الحافز)."
      - "كلمة 'دافع' تشير في الغالب إلى الحالة الداخلية (motive/drive) أكثر من كونها فعلاً للتحريض (the act of motivating)، إلا أنها تُستخدم في السياق العام بهذا المعنى."
    observations: "المجموعة تغطي المفهوم النفسي والإجرائي لدفع الأشخاص نحو العمل. المصطلح 'تحفيز' هو الأكثر دقة وحداثة، بينما توفر البدائل التراثية مثل 'حث' و'ترغيب' أبعاداً دلالية أعمق تتعلق بأسلوب التحفيز."
  blind_candidates:
    - lemma: "تَحْفِيز"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من الفعل (حَفَّزَ) على وزن تفعيل، وهو المصطلح المعاصر الأكثر شيوعاً لهذا المفهوم."
    - lemma: "حَثّ"
      generation_method: ishtiqaq
      justification: "مصطلح أصيل يعني الحض على الشيء والاستعجال فيه، وهو يطابق تماماً معنى التحفيز كفعل."
    - lemma: "تَنْشِيط"
      generation_method: ishtiqaq
      justification: "يعني إثارة الهمة والنشاط، ويُستخدم كثيراً في السياقات التربوية والإدارية كمرادف للتحفيز."
    - lemma: "تَرْغِيب"
      generation_method: ishtiqaq
      justification: "يركز على الجانب الإيجابي من التحفيز عبر جعل الشخص يرغب في النتيجة أو الجائزة (incentive)."

stage2_evidence:
  per_lemma:
    - lemma: "تحفيز"
      confirm:
        - text: "«تحفيز: جزئيات فعل في علاقتها بالوظيفة الرئيسة... يعد تفسيرا للعناصر الناقصة في البنية السطحية للخِطاب.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«تَحْفيز: (في العلوم الطبية والبيولوجية) تحفيز الوظائف أو الأعضاء.»"
          source: "المعجم الطبي الموحد"
    - lemma: "دافع"
      confirm:
        - text: "«دافِع: حالة داخلية جسمية أو نفسية تدفع الفرد نحو سلوك في ظروف معينة وتوجهه نحو إشباع حاجة أو هدف محدد.»"
          source: "مسرد التربية (ArabTerm)"
        - text: "«الدَّافِع (في الفلسفة): الداعي، وماله يختار القادرُ الفعلَ. وهو العاملُ الخاصُّ بالإنسانِ والمَوْقِفِ.»"
          source: "المعجم الكبير"
    - lemma: "حث"
      confirm:
        - text: "«الحث: التحريض على الشيء والحمل على فعله بتأكيد والإسراع.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«حَثَّهُ عَلَيْهِ: حَرَّضَهُ أو حَضَّهُ عليه.»"
          source: "معجم لين"
    - lemma: "تنشيط"
      confirm:
        - text: "«تَنْشيطٌ: مجموعة من العمليات والإجراءات... التي يتم من خلالها توجيه وضبط التواصل... عن طريق إثارة التفاعل.»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي"
    - lemma: "ترغيب"
      confirm:
        - text: "«الرَّغْبَةُ فِي الشَّيْءِ: الْإِرَادَةُ لَهُ... الرَّغِيبَةُ: الْعَطَاءُ الْكَثِيرُ.»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "تحفيز"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والدقيق الذي يعبر عن عملية التحفيز في العصر الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْفِيز"
    - lemma: "دافع"
      decision: confirmed
      decision_reason: "مقبول كاسم يعبر عن الحالة المحركة للسلوك، رغم أنه يميل دلالياً نحو 'الباعث' أو 'المحرك' الداخلي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَافِع"
    - lemma: "حث"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح وقوي يصف الجانب العملي من التحفيز وهو الحض والحمل على الفعل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حَثّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تنشيط"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم في السياقات المهنية والتربوية كمرادف إجرائي للتحفيز (activation)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَنْشِيط", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ترغيب"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الجانب المتعلق بتوفير الحوافز (incentives) والجذب نحو الهدف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَرْغِيب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "فعل التحفيز؛ توفير الحافز"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري ويفتقر للدقة المصطلحية."
    authored:
      - type: terminological
        text: "عملية إثارة الرغبة والاهتمام لدى الشخص للقيام بفعل معين، من خلال التأثير في قواه المحركة أو تقديم الحوافز المشجعة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَحْفِيز"
        examples:
          - text: "اعتمدت الشركة برنامجاً جديداً لـ تَحْفِيز الموظفين المبدعين."
            type: usage
      - lemma: "دَافِع"
        examples:
          - text: "كان الطموح هو الدَّافِع الأساسي لنجاحه الباهر."
            type: usage
      - lemma: "حَثّ"
        examples:
          - text: "في القران الكريم حَثٌّ على الصبر والمثابرة."
            type: usage
      - lemma: "تَنْشِيط"
        examples:
          - text: "قامت المعلمة بـ تَنْشِيط الفصل من خلال المسابقات العلمية."
            type: usage
      - lemma: "تَرْغِيب"
        examples:
          - text: "استخدم الأب أسلوب التَّرْغِيب لتشجيع ابنه على القراءة."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية إثارة الرغبة والاهتمام لدى الشخص للقيام بفعل معين، من خلال التأثير في قواه المحركة أو تقديم الحوافز المشجعة."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعد التقدير المعنوي من أهم وسائل تَحْفِيز العاملين وزيادة إنتاجيتهم."}

stage5_enrichment:
  per_entry:
    - lemma: "تَحْفِيز"
      entry_id: "{auto}"
      root: "حفز"
      maqayis_quote: "«الْحَاءُ وَالْفَاءُ وَالزَّاءُ كَلِمَةٌ وَاحِدَةٌ تَدَلُّ عَلَى الْحَثِّ وَمَا قَرُبَ مِنْهُ. فَالْحَفْزُ: حَثُّكَ الشَّيْءَ مِنْ خَلْفِهِ.»"
    - lemma: "دَافِع"
      entry_id: "{auto}"
      root: "دفع"
      maqayis_quote: "«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ. يُقَالُ دَفَعْتُ الشَّيْءَ أَدْفَعُهُ دَفْعًا.»"
    - lemma: "حَثّ"
      entry_id: "{auto}"
      root: "حثث"
      maqayis_quote: "«الْحَاءُ وَالثَّاءُ أَصْلَانِ: أَحَدُهُمَا الْحَضُّ عَلَى الشَّيْءِ، وَالْآخَرُ يَبِيسٌ مِنْ يَبِيسِ الشَّيْءِ.»"
    - lemma: "تَنْشِيط"
      entry_id: "{auto}"
      root: "نشط"
      maqayis_quote: "«النُّونُ وَالشِّينُ وَالطَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اهْتِزَازٍ وَحَرَكَةٍ. مِنْهُ النَّشَاطُ مَعْرُوفٌ.»"
    - lemma: "تَرْغِيب"
      entry_id: "{auto}"
      root: "رغب"
      maqayis_quote: "«الرَّاءُ وَالْغَيْنُ وَالْبَاءُ أَصْلَانِ: أَحَدُهُمَا طَلَبٌ لِشَيْءٍ وَالْآخَرُ سَعَةٌ فِي شَيْءٍ. فَالْأَوَّلُ الرَّغْبَةُ فِي الشَّيْءِ: الْإِرَادَةُ لَهُ.»"
  per_sense:
    - lemma: "تَحْفِيز"
      sense_id: "{auto}"
      nuance: "المصطلح العام والشامل لعملية الحث ودفع الهمة."
      mwe: false
    - lemma: "دَافِع"
      sense_id: "{auto}"
      nuance: "يركز على القوة المحركة والسبب الباعث على الفعل."
      mwe: false
    - lemma: "حَثّ"
      sense_id: "{auto}"
      nuance: "يركز على الجانب اللفظي والتوجيهي والمطالبة بالإسراع."
      mwe: false
    - lemma: "تَنْشِيط"
      sense_id: "{auto}"
      nuance: "يركز على تحويل الشخص من حالة الركود إلى حالة الفعالية."
      mwe: false
    - lemma: "تَرْغِيب"
      sense_id: "{auto}"
      nuance: "يركز على تحفيز الإرادة من خلال المكافأة والوعد بالخير."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حفز","maqayis":"«الْحَاءُ وَالْفَاءُ وَالزَّاءُ كَلِمَةٌ وَاحِدَةٌ تَدَلُّ عَلَى الْحَثِّ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دفع","maqayis":"«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح العام والشامل لعملية الحث ودفع الهمة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
