stage1_review:
  blind_generation:
    - lemma: مُخْتَارَات
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (خير)، وتدل على مجموعة منتقاة من أفضل الأعمال أو العناصر."
    - lemma: نُخْبَة
      generation_method: ishtiqaq
      justification: "مشتقة من (نخب)، وتدل على أفضل مجموعة من الأشخاص أو الأشياء ضمن صنف معين."
    - lemma: قَائِمَةُ الصَّدَارَةِ
      generation_method: tarkib
      justification: "مركب إضافي يدل على القائمة التي تضم العناصر أو الأشخاص الذين يحتلون المراكز الأولى."
    - lemma: سِجِلُّ الشَّرَفِ
      generation_method: tarkib
      justification: "مركب إضافي يستعمل عادة للإشارة إلى قائمة تضم أفضل المتفوقين أو الناجحين."
  initial_evaluation:
    concerns:
      - "اللمة الأولى (قائمة الأغاني الناجحة) محصورة جداً في المجال الموسيقي، بينما التعريف الأصلي يشمل الأشخاص والعناصر من أي نوع."
      - "اللمة الثانية (قائمة المتصدرين) مناسبة للأشخاص والفرق، لكنها أقل ملاءمة للأشياء المادية."
      - "الافتقار إلى مصطلح عام يغطي الأشياء والأشخاص في مختلف المجالات، وهو ما يمكن تداركه بإضافة مرشحات المرحلة الأولى."
    observations:
      - "المفهوم الإنجليزي (hit parade) انطلق من المجال الموسيقي لكنه توسع ليشمل أي قائمة لأفضل العناصر. اللمات الموجودة تعكس هذا التنوع في الاستعمال."

stage2_evidence:
  - lemma: قَائِمَةُ الْأَغَانِي النَّاجِحَةِ
    evidence_status: mixed
    evidence:
      - source: المعجم الموحد لمصطلحات الموسيقى
        text: "«أغنية ناجحة: hit song»."
        classification: expands
      - source: المعاجم المعاصرة
        text: "تستخدم عبارة 'أغاني شعبية' في مجالات الفن (موقع ArabTerm)."
        classification: expands

  - lemma: قَائِمَةُ الْمُتَصَدِّرِينَ
    evidence_status: confirms_only
    evidence:
      - source: معجم المعاني
        text: "«المتصدِّر: مَنْ يَحْتَلُّ الصَّدَارَةَ أَوِ الْمَرْكَزَ الْأَوَّلَ»."
        classification: confirms
      - source: المعاجم المعاصرة
        text: "تستخدم كلمة 'متصدرين' في قوائم الترتيب في الرياضة والألعاب."
        classification: confirms

  - lemma: قَائِمَةُ الصَّدَارَةِ
    evidence_status: confirms_only
    evidence:
      - source: معجم المعاني الجامع
        text: "«الصَّدَارَةُ: الْمَرْكَزُ الأَوَّلُ، الطَّلِيعَةُ. احْتَلَّ الصَّدَارَةَ»."
        classification: confirms

  - lemma: مُخْتَارَات
    evidence_status: confirms_only
    evidence:
      - source: المعجم الوسيط
        text: "«المُخْتَارَات: نصوص مختارة لكاتب أو كتاب لنوع أو أنواع ولمدارس وتيارات أدبية بغاية إعطاء فكرة عامة»."
        classification: contradicts
        conflict: "تشير إلى مجموعة مختارة كأنثولوجيا، وليس كقائمة ترتيب للأفضل شعبية."

  - lemma: نُخْبَة
    evidence_status: confirms_only
    evidence:
      - source: المعجم الوسيط
        text: "«النُّخْبَةُ: المختار من كل شيء، يقال جاء في نخبة أصحابه خيارهم»."
        classification: contradicts
        conflict: "تدل على المجموعة نفسها لا على قائمة الترتيب المكتوبة أو المعلنة."

  - lemma: سِجِلُّ الشَّرَفِ
    evidence_status: confirms_only
    evidence:
      - source: المعاجم المدرسية والجامعية
        text: "يطلق (سجل الشرف) أو (لوحة الشرف) على قائمة المتفوقين في المدارس."
        classification: contradicts
        conflict: "العبارة ترتبط أكثر بالتفوق الأكاديمي أو المهني، ولا تعكس معنى الشعبية (hit parade)."

stage3_analysis:
