    evidence_evaluation: mixed
    mwe_test:
      is_mwe: true
      mwe_type: idafi
    dialectal_check: passes
    substitutability_test: passes
    nuance_documentation: "تُسْتَخْدَمُ حَصْرًا فِي الْمَجَالِ الْمُوسِيقِيِّ وَالْفَنِّيِّ لِلْإِشَارَةِ إِلَى الْأَعْمَالِ الْأَكْثَرِ شَعْبِيَّةً وَمَبِيعًا."
    borrowing_check:
      is_borrowed: false
      calque_analysis: "ترجمة لمفهوم (hit list/parade) الموسيقي."
    term_quality_gate: passes
    morphological_fit: "صيغة المفعول (ناجحة) تعبر عن تحقيق العمل للنجاح."
    decision: confirmed
    actions:
      - command: update_lemma
        params:
          synset_id: awn4-07993555-n
          old_lemma: قائمة الأغاني الناجحة
          new_lemma: قَائِمَةُ الْأَغَانِي النَّاجِحَةِ

  - lemma: قائمة المتصدرين
    evidence_evaluation: confirms_only
    mwe_test:
      is_mwe: true
      mwe_type: idafi
    dialectal_check: passes
    substitutability_test: passes
    nuance_documentation: "تُسْتَخْدَمُ غَالِبًا لِلْأَشْخَاصِ أَوِ الْفِرَقِ فِي السِّبَاقَاتِ وَالْمُنَافَسَاتِ وَالْأَلْعَابِ."
    borrowing_check:
      is_borrowed: false
    term_quality_gate: passes
    morphological_fit: "اسم الفاعل (متصدر) يناسب من يحل في الطليعة."
    decision: confirmed
    actions:
      - command: update_lemma
        params:
          synset_id: awn4-07993555-n
          old_lemma: قائمة المتصدرين
          new_lemma: قَائِمَةُ الْمُتَصَدِّرِينَ

  - lemma: قَائِمَةُ الصَّدَارَةِ
    evidence_evaluation: confirms_only
    mwe_test:
      is_mwe: true
      mwe_type: idafi
    dialectal_check: passes
    substitutability_test: passes
    nuance_documentation: "عِبَارَةٌ عَامَّةٌ تَشْمَلُ الْأَشْيَاءَ وَالْأَشْخَاصَ فِي أَيِّ تَصْنِيفٍ تَرْتِيبِيٍّ، وَهِيَ الْأَقْرَبُ لِلشُّمُولِيَّةِ."
    borrowing_check:
      is_borrowed: false
    term_quality_gate: passes
    morphological_fit: "تركيب إضافي سليم."
    decision: confirmed
    actions:
      - command: create_entry
        params:
          lemma: قَائِمَةُ الصَّدَارَةِ
          pos: n
      - command: add_sense
        params:
          entry_id: "{auto}"
          synset_id: awn4-07993555-n

  - lemma: مُخْتَارَات
    evidence_evaluation: contradicts_only
    mwe_test:
      is_mwe: false
    decision: removed

  - lemma: نُخْبَة
    evidence_evaluation: contradicts_only
    mwe_test:
      is_mwe: false
    decision: removed

  - lemma: سِجِلُّ الشَّرَفِ
    evidence_evaluation: contradicts_only
    mwe_test:
      is_mwe: true
      mwe_type: idafi
    decision: removed

