stage1_review:
  assessment:
    concerns:
      - اللمات الحالية تفتقر إلى التشكيل الكامل.
      - مصطلح "مهندس قطار" هو تعريب مباشر (Calque) للمصطلح الأمريكي (Engineer)، بينما المصطلح الأكثر شيوعاً هو "سائق قطار".
    observations: "المفهوم واضح ومعرب بدقة، لكن يحتاج لإضافة اللمات الأكثر تداولاً في السياقات التقنية الحديثة."
  blind_candidates:
    - lemma: "سَائِقُ قِطَارٍ"
      generation_method: tarkib
      justification: "التركيب الإضافي الأكثر شيوعاً وتداولاً في اللغة العربية المعاصرة."
    - lemma: "قَائِدُ قِطَارٍ"
      generation_method: tarkib
      justification: "مصطلح فني رسمي يستخدم في أدلة التشغيل وأنظمة السكك الحديدية."
    - lemma: "مُهَنْدِسُ قِطَارٍ"
      generation_method: taarib
      justification: "ترجمة اصطلاحية للمسمى الوظيفي (Locomotive Engineer) الشائع في بعض الدول."
    - lemma: "مُشَغِّلُ قَاطِرَةٍ"
      generation_method: tarkib
      justification: "ترجمة دقيقة للتعريف الإنجليزي وللمفهوم الفني المجرد."

stage2_evidence:
  per_lemma:
    - lemma: "سائق قطار"
      confirm:
        - text: "«سائق القطار: train driver, engine driver, engineer»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "«السَّائِق: من يَقُود السيارة أَو القطار وَنَحْوهمَا»"
          source: "المعجم الوسيط"
    - lemma: "مهندس قطار"
      confirm:
        - text: "«المهندس: من يلم بعلم من العلوم الهندسية»"
          source: "المعجم الوسيط"
        - text: "«engineer: سائق القطار»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
    - lemma: "قائد قطار"
      confirm:
        - text: "«راديو القطار: وسائل الإتصال بين قائد القطار والموجه التشغيلي»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "«الوصول للمحطة: وهي الرسالة التي يوصلها قائد القطار»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
    - lemma: "مشغل قاطرة"
      confirm:
        - text: "«operator: مُشَغِّل»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«قاطرة: عربة يحركها البخار أو الكهربا تقطر بها عربات السكة الحديدية»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "سائق قطار"
      decision: confirmed
      decision_reason: "المصطلح الأكثر فصاحة وشيوعاً وتدعم المعاجم الحديثة استخدامه للقطار."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَائِقُ قِطَارٍ"
    - lemma: "مهندس قطار"
      decision: confirmed
      decision_reason: "يستخدم كمصطلح فني مترجم في سياقات معينة (خاصة النظم المتأثرة بالمصطلح الأمريكي)، وهو موجود في البيانات الحالية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُهَنْدِسُ قِطَارٍ"
    - lemma: "قَائِدُ قِطَارٍ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فني رسمي مؤكد استخدامه في المعاجم المتخصصة للنقل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "قَائِدُ قِطَارٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مُشَغِّلُ قَاطِرَةٍ"
      source: stage1
      decision: confirmed
      decision_reason: "ترجمة دقيقة ووصفية للمفهوم التقني وتتوافق مع تعريف المجموعة والهايبرنيم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "مُشَغِّلُ قَاطِرَةٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "مشغل قاطرة السكك الحديدية"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق لكنه موجز جداً، يفضل صياغته بأسلوب المعجم الوسيط لبيان الوظيفة."
    authored:
      - type: terminological
        text: "شَخْصٌ يَتَوَلَّى قِيَادَةَ القِطَارِ أَوْ قَاطِرَةِ السِّكَّةِ الحَدِيدِيَّةِ وَيُشْرِفُ عَلَى تَشْغِيلِهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَتَوَلَّى قِيَادَةَ القِطَارِ أَوْ قَاطِرَةِ السِّكَّةِ الحَدِيدِيَّةِ وَيُشْرِفُ عَلَى تَشْغِيلِهَا."
  examples:
    per_lemma:
      - lemma: "سَائِقُ قِطَارٍ"
        examples:
          - text: "يَجِبُ عَلَى سَائِقِ القِطَارِ الِانْتِبَاهُ الدَّائِمِ لِإِشَارَاتِ السِّكَّةِ الحَدِيدِيَّةِ."
            type: usage
      - lemma: "قَائِدُ قِطَارٍ"
        examples:
          - text: "تَواصَلَ قَائِدُ القِطَارِ مَعَ مَرْكَزِ التَّحَكُّمِ عَبْرَ الرَّادْيو لِلإِبْلَاغِ عَنْ وُصُولِهِ."
            type: usage
      - lemma: "مُهَنْدِسُ قِطَارٍ"
        examples:
          - text: "تُطْلَبُ كَفَاءَاتٌ خَاصَّةٌ لِمَنْ يَشْغَلُ وَظِيفَةَ مُهَنْدِسِ قِطَارٍ فِي السِّكَكِ الحَدِيدِيَّةِ السَّرِيعَةِ."
            type: usage
      - lemma: "مُشَغِّلُ قَاطِرَةٍ"
        examples:
          - text: "تَتَضَمَّنُ مَهَامُ مُشَغِّلِ القَاطِرَةِ التَّأَكُّدَ مِنْ سَلَامَةِ أَنْظِمَةِ الكَبْحِ قَبْلَ الِانْطِلَاقِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "خَضَعَ سَائِقُ القِطَارِ لِدَوْرَةٍ تَدْرِيبِيَّةٍ مُكَثَّفَةٍ عَلَى نُظُمِ المِلَاحَةِ الجَدِيدَةِ."

