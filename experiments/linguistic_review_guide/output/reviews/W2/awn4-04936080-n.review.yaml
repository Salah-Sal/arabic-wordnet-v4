          addition: "في الاصطلاح التقني تُستخدم «طريقة» مرادفاً لـ method مما يضيق دلالتها نحو الإجراء المنهجي"

    - lemma: "نمط"
      confirm:
        - text: "«النَّمَطُ: الطَّريقةُ، أو الأسلوب. الجماعة من الناس أمرُهم واحد. الصِّنفُ أو النوع أو الطِّراز من الشيء»"
          source: "المعجم الوسيط (ocr)"
        - text: "«النمط: الطريقة من الطرائق، والضرب من الضروب. يُقال: ليس هذا من ذلك النمط: أي من ذلك الضرب»"
          source: "النهاية في غريب الحديث والأثر لابن الأثير (hawramani)"
        - text: "«والزم هذا النّمط: أي الطريقةَ والمذهبَ»"
          source: "أساس البلاغة للزمخشري (hawramani)"
        - text: "«نمط: نوع من الفعل»"
