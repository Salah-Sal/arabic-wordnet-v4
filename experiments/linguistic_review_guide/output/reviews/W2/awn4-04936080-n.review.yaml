          source: "المعجم الموحد لمصطلحات اللسانيات 2002 (arabterm)"
          addition: "يُشير إلى أن أسلوب يتضمن تأكيداً على التفرد الفردي والاختيار الشخصي، وهو تضييق دلالي مقارنةً بالمعنى العام للمجموعة"

    - lemma: "طريقة"
      confirm:
        - text: "«الطَّريقة: الطَّريق. السيرةُ. المذهب. الطبقةُ»"
