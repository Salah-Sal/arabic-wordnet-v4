          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«﴿وَيَذْهَبَا بِطَرِيقَتِكُمُ الْمُثْلَى﴾»"
          source: "المعجم الوسيط (ocr) — مثال قرآني"
      expands:
