        الهيئة في معاجم اللغة تعني الحال الظاهرة والشكل الخارجي للشيء، وفي الاصطلاح الحديث تعني المنظمة
        أو الجماعة. وإن أجاز القاموس تعريفها بـ«كيفيته»، فإن هذه الدلالة ليست الراجحة في الاستخدام المعاصر.
        ARABTERM تترجمها للشكل والتكوين والهيكل. إدراجها هنا سيخلق التباساً مع المعنى المؤسسي الشائع اليوم


