          source: "مقاييس اللغة لابن فارس (hawramani، dict_id=151)"
          conflict: "ابن فارس يجعل الأصل الدلالي للنمط هو «الاجتماع» لا الطريقة؛ أي أن دلالة الطريقة/الأسلوب فرعية مجازية وليست أصيلة في الجذر"
      expands:
        - text: "«النَّمَطُ: ظِهَارَةُ الفِراشِ، أو ضَرْبٌ مِنَ البُسُطِ، والطريقةُ، والنَّوْعُ من الشيء، وجَمَاعَةٌ أمْرُهُمْ واحِدٌ»"
