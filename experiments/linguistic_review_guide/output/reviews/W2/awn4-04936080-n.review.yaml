# ══════════════════════════════════════════════════════════════
# مراجعة مجموعة ترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04936080-n | ILI: i62886
# Lemmas: أسلوب، طريقة، نمط
# Definition: كيفية القيام بشيء ما أو كيفية حدوثه
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث بدون تشكيل كامل في السجل؛ يجب ضبطها بالشكل"
      - "التعريف العربي الحالي يبدأ بـ«كيفية» وهو شبه دوري لأن المقصود هو وصف الكيفية نفسها"
      - "نمط له دلالة أساسية على «الاجتماع/النوع/قطعة القماش» في المعاجم الكلاسيكية، واستخدامه بمعنى الطريقة/الأسلوب دلالة فرعية قد تحتاج توثيقاً"
      - "لا يوجد في المجموعة ما يعبّر عن «النمط/المنوال المتبع» في سياق الأنظمة والأجهزة (mode) بصورة اصطلاحية ثابتة"
    observations: >
      تجمع المجموعة ثلاثة ألفاظ عربية رئيسية للمفهوم الأعلى (manner/mode/style/way)، وهي تغطية جيدة لكن يمكن إثراؤها.
      «أسلوب» يحمل دلالة الفرادة التعبيرية والانتماء الفني، و«طريقة» تُعبّر عن النهج العملي المحايد، و«نمط» يضيف معنى التصنيف والضرب والنوع.
      المجموعة تنتمي للفئة المعجمية الأعلى «خاصّيّة جوهريّة» (essential property)، مما يعني أن المصطلحات ينبغي أن تحمل طابعاً مجرداً.
      المعجم الوسيط يضبط «نمط» على وزن «فَعَل» (نَمَط) بتحريك الميم، وهذا يميّزه عن كثير من الاستخدامات الكتابية الجارية.

  blind_candidates:
    - lemma: "مَسْلَكٌ"
      generation_method: majaz
      justification: >
        من جذر «سلك» — السلوك في الطريق — بالإزاحة الدلالية إلى الأسلوب المتبع والكيفية.
        يرد في المعجم الوسيط «المسلك: الطريق» وفي المعجم الكبير «خذ في مسالك الحق».
        الوزن مِفْعَل يدل على موضع الفعل، وبالمجاز: المنهج والطريق المتّبع.
    - lemma: "شَاكِلَةٌ"
      generation_method: majaz
      justification: >
        من جذر «شكل» — التماثل والمشابهة — إحياء لقرآني ثابت: ﴿قُلْ كُلٌّ يَعْمَلُ عَلَى شَاكِلَتِهِ﴾.
        الشاكلة: الطريقة والمذهب والسجية، مما يجعلها مرشحة لتعبير «كيفية القيام».
    - lemma: "مِنْوَالٌ"
      generation_method: majaz
      justification: >
        من جذر «نول» — خشبة الحائك التي يحوك عليها الثوب — ثم بالمجاز: «النسق والأسلوب».
        يقال «افعل على هذا المنوال» أي على هذا النسق والكيفية.
        له استخدام اصطلاحي ثابت في مسرد التربية (ARABTERM): منوال = mode.
    - lemma: "هَيْئَةٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر «هيأ» — على وزن فَعْلَة للحالة والهيئة — بمعنى الصورة والكيفية التي يكون عليها الشيء.
        يُعرِّفه القاموس المحيط: «الهيئة: حال الشيء وكيفيته»، مما يجعله قريباً من دلالة المجموعة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "أسلوب"
      confirm:
        - text: "«الأُسْلُوب: الطَّريق. ويقال: سلكتُ أسلوبَ فلان في كذا: طريقتَه ومذهبَه. طريقةُ الكاتب في كتابته. الفنّ. يقال: أخذنا في أساليب من القول: فنون متنوعة. الصفُّ من النخل ونحوه»"
          source: "المعجم الوسيط (ocr)"
        - text: "«(الأسلوب) الطَّرِيق. ويُقَال: سلكت أسلوبَ فلان في كذا: طريقتَه ومذهبَه. وطريقةُ الكاتب في كتابته. والفن. يُقَال: أخذنا في أساليب من القول: فنون متنوعة. والصف من النخل ونحوه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«الطريقُ والوجهُ والمذهبُ / الطريقةُ / الفنّ. في الأدب style: مجموعةٌ من الملامح التعبيرية التي يختارُها المتكلِّمُ أو الكاتبُ من العناصر اللغوية القابلة للتبادل لنقل مقاصده إلى المتلقي»"
          source: "المعجم الكبير (ocr)"
        - text: "«طريقة عمل، وسيلة تعبير الفكر عبر الكلمات والتراكيب»"
