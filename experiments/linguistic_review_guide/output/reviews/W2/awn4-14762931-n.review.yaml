stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة «مادة مخمرة» بصيغة اسم المفعول خاطئة دلالياً؛ لأن المقصود هو العامل النشط (المخمر) وليس المادة التي وقع عليها التخمير."
      - "اللمة «إنزيم التخمير» متخصصة جداً، بينما المصطلح الإنجليزي والتعريف يشملان أي مادة مسببة للتخمير سواء كانت إنزيماً أو فطراً."
    observations: "المفهوم يشير إلى العامل الحيوي أو الكيميائي الذي يحفز عملية التخمير. الجذر العربي «خمر» غني بالمشتقات التي تصف هذا المفهوم بدقة، وأشهرها «الخميرة»."
  blind_candidates:
    - lemma: "خَمِيرَة"
      generation_method: ishtiqaq
      justification: "الاسم الأشهر والأكثر تداولاً للمادة المسببة للتخمير في اللغة العربية المعاصرة والقديمة."
    - lemma: "مُخَمِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل «خمّر»، ويعني حرفياً المادة أو العامل الذي يقوم بعملية التخمير."
    - lemma: "عَامِلُ تَخْمِير"
      generation_method: tarkib
      justification: "تعبير اصطلاحي وصفي يستخدم في السياقات العلمية لوصف المادة المسببة للتفاعل."
    - lemma: "خَمِير"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة أو صفة مشبهة تستخدم في المعاجم القديمة لوصف ما يوضع في العجين ليختمر."

stage2_evidence:
  per_lemma:
    - lemma: "خَمِيرَة"
      confirm:
        - text: "«ما يُجْعَلُ فى العَجِينِ أو الطِّيبِ ونحوهما لتَخْمِيره... yeast : نَوْعٌ من الفُطْرِ الزِّقِّيَّةِ، تَخْمِرُ الموادَّ العُضويَّةَ»"
          source: "المعجم الكبير"
        - text: "«خميرة: العامل الذي يسبب عملية التخمير (ferment)»"
          source: "المعجم الموحد لمصطلحات الكيمياء (ArabTerm)"
    - lemma: "خَمِير"
      confirm:
        - text: "«ما يُجْعَلُ في العَجِينِ والطِّيبِ ونحوِهما لِتَخْمِيرِه»"
          source: "المعجم الكبير"
    - lemma: "خُمْرَة"
      confirm:
        - text: "«ما يُجْعَلُ في العَجِينِ والنَّبِيذِ والطِّيبِ من الخَمِيرة»"
          source: "المعجم الكبير"
    - lemma: "مُخَمِّر"
      expands:
        - text: "«آلة أو وعاء التخمير (fermenter)»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          addition: "يستخدم غالباً في السياق التقني للإشارة إلى الجهاز (المخمر) بينما تشير الخميرة للمادة."
    - lemma: "إنزيم التخمير"
      evidence_status: "no_material_found"
    - lemma: "مادة مخمرة"
      contradicts:
        - text: "«مُخَمَّر: من ستر الشيء، أو كتمه...»"
          source: "موسوعة السلطان قابوس"
          conflict: "اللفظ بصيغة اسم المفعول يشير للمادة الناتجة عن التخمير وليس المادة المسببة له."

stage3_analysis:
  per_lemma:
    - lemma: "خَمِيرَة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح العربي الأساسي والأدق للمفهوم، مدعوم بأدلة معجمية قديمة وحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خَمِيرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خَمِير"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح ومستخدم في المعاجم القديمة لوصف المادة المسببة للتخمير."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خَمِير", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خُمْرَة"
      decision: confirmed
      decision_reason: "لفظ تراثي دقيق لوصف بادئ التخمير (starter)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خُمْرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "إنزيم التخمير"
      decision: confirmed
      decision_reason: "مقبول كمرادف تقني متخصص، رغم كونه أضيق دلالياً من المفهوم العام."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params: {entry_id: "{auto}", new_lemma: "إِنْزِيمُ التَّخْمِير"}
    - lemma: "مَادَّة مُخَمِّرَة"
      decision: confirmed
      decision_reason: "تصحيح لغوي للّمة الموجودة (مادة مخمرة) لتحويلها من اسم مفعول إلى اسم فاعل يناسب الوظيفة الدلالية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params: {entry_id: "{auto}", new_lemma: "مَادَّةٌ مُخَمِّرَةٌ"}
    - lemma: "مادة مخمرة"
      decision: removed
      decision_reason: "خطأ صرفي؛ اسم المفعول يشير للمادة التي تم تخميرها، بينما المطلوب هو اسم الفاعل (المادة المسببة للتخمير)."
      actions:
        - command: remove_sense
          params: {sense_id: "{auto}"}

stage4_content:
  definition:
    current: "مادة قادرة على إحداث التخمير"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً ولغوياً ومطابق للتعريف الإنجليزي."
  examples:
    per_lemma:
      - lemma: "خَمِيرَة"
        examples:
          - text: "تُضَافُ الْخَمِيرَةُ إِلَى الْعَجِينِ لِتَسْرِيعِ عَمَلِيَّةِ انْتِفَاخِهِ."
            type: usage
      - lemma: "خَمِير"
        examples:
          - text: "اسْتَخْدَمَ الْخَبَّازُ الْخَمِيرَ لِتَحْضِيرِ الْخُبْزِ الْبَلَدِيِّ."
            type: usage
      - lemma: "مَادَّةٌ مُخَمِّرَةٌ"
        examples:
          - text: "تُعَدُّ الْبَكْتِيرِيَا مَادَّةً مُخَمِّرَةً طَبِيعِيَّةً فِي كَثِيرٍ مِنَ الصِّنَاعَاتِ الْغِذَائِيَّةِ."
            type: usage

