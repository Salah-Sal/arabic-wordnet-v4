# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة 'قابلية التعميم' مركّبة إضافية خالية من التشكيل الكامل"
      - "غياب ترادفات أحادية الكلمة مع أن العربية تملك مصطلحات مفردة راسخة كالعمومية والشمولية"
      - "التعريف يضمّ 'واسع الانتشار' وهو أقرب إلى مفهوم الشيوع/الذيوع (prevalence) المختلف عن العمومية، مما يُوحي بتداخل دلالي يستحق المراجعة"
      - "لا يوجد ربط ILI — المجموعة بحاجة إلى ضبط الموضع في الهرمية"
    observations: "المجموعة تمثل مفهوماً فلسفياً-منطقياً راسخاً يرتبط بمبدأ اطراد الحكم على أفراد الجنس وصلاحية التطبيق الموسَّع. الأم المباشرة (جَوْدَة/نَوْعِيَّة) تؤكد أن هذا المفهوم صفة جوهرية لا فعلاً. يتضمن التعريف جانبَين متمايزَين: (أ) كون الشيء عامًّا في ذاته (العمومية)، و(ب) كونه قابلاً للتطبيق على نطاق أوسع (قابلية التعميم). الجذران عمم وشمل أكثر إنتاجية في هذا الحقل الدلالي من الجذر قبل. المصطلح الأبرز في أدبيات التعلم الآلي والبحث العلمي هو 'قابلية التعميم' غير أن 'العمومية' أكثر قِدَماً وأوسع انتشاراً في الفلسفة والمنطق."
  blind_candidates:
    - lemma: "العُمُومِيَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق قياسي من الجذر عمم على وزن (فُعُولِيَّة) للدلالة على صفة كون الشيء عامًّا؛ وزن منتج في العربية المعاصرة لصياغة المفاهيم المجردة من الأسماء والصفات (مثل: قطعية، كلية، جزئية)"
    - lemma: "الشُّمُولِيَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر شمل (يدل على دوران الشيء بالشيء وأخذه من جوانبه) بإضافة ياء النسبة والتاء المربوطة؛ يعبر عن جانب الاستيعاب الشامل للحالات المتعددة وعدم الاقتصار على بعضها"
    - lemma: "التَّعْمِيمِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من مصدر الفعل الرباعي (التعميم) لصياغة المفهوم المجرد المتعلق بالقدرة على التعميم؛ قياسي بمثل: التطبيقية، التنظيمية، التوصيفية"
    - lemma: "الاطِّرادِيَّة"
      generation_method: majaz
      justification: "إحياء لمعنى الاطراد المنطقي الكلاسيكي (دوران الحكم مع الوصف وجوداً) بإضافة ياء النسبة؛ استعمله الجرجاني والتهانوي للدلالة على انطباق الحكم العام على أفراده جميعاً دون استثناء"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "قابلية التعميم"
      confirm:
        - text: "«القابِلِيَّةُ: الاستعداد للقبول [مصدر صناعي]»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(القابلية) الاستعداد للقبول (مصدر صناعي)»"
          source: "المعجم الوسيط (رواية الحوراماني)"
        - text: "«تعميم: قدرة النموذج على تقديم تنبؤات صحيحة بناءً على بيانات جديدة — Generalization»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«تعميم: سيرورة معرفية تقوم على تأسيس تصور انطلاقا من عدد من الملاحظات التجريبية. أو انطباق نتيجة التجربة على ظروف أخرى غير الظروف التي جرت فيها التجربة أساسا — generalization»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«تعميم: جعل الشيء عاما دون تخصيص»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يوضح أن التعميم هو الفعل الرامي إلى الشيوع دون تخصيص، وبذلك تكون 'قابلية التعميم' هي استعداد الشيء لهذا الفعل واحتماله"

    - lemma: "العُمُومِيَّة"
      confirm:
        - text: "«العُمومية: كونُ الشيء عامًّا؛ عبارة عامّة؛ قانون أو مبدأ عامّ؛ الأغلبيّة — generality»"
          source: "المورد الحديث (2008)"
        - text: "«العمومية — universality؛ [مرادف: الشمولية]»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«العُمومية؛ الشُّمُوليّة؛ العالميّة؛ الكُلِّيّة — universality»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«عَمَّنَا هَذَا الْأَمْرُ يَعُمُّنَا عُمُومًا، إِذَا أَصَابَ الْقَوْمَ أَجْمَعِينَ. وَالْعَامَّةُ ضِدَّ الْخَاصَّةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يرسّخ الأصل الدلالي للجذر عمم في معنى الإصابة الجامعة دون تخصيص؛ وهو يسند دلالة 'العمومية' كصفة الشمول الكلي المقابلة للخصوصية"

    - lemma: "الشُّمُولِيَّة"
      confirm:
        - text: "«شمولية: مقياس لقواعد النحو، مثل البساطة، ويتيح هذا المقياس إجراء تقييم الأنحاء المتنافسة — Generality»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«الشُّمول: العُموم»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«العُمومية؛ الشُّمُوليّة؛ العالميّة؛ الكُلِّيّة — universality»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«شمولية: التطرق إلى كل الجوانب التي تتعلق بموضوع معين — exhaustiveness»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          conflict: "ترجمة exhaustiveness تشير إلى الاستيفاء والإحاطة الكاملة لا إلى صفة العمومية؛ قد يُلبس على الدلالة المطلوبة"
      expands:
        - text: "«شَمِلَهُمُ الْأَمْرُ، إِذَا عَمَّهُمْ. وَهَذَا أَمْرٌ شَامِلٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يثبت أن الجذر شمل يدل على العموم الشامل للجماعة؛ الشمولية إذن مشتقة من معنى أصيل بالغ الصلة بالمجموعة"

    - lemma: "التَّعْمِيمِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الاطِّرادِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "قابلية التعميم"
      decision: confirmed
      decision_reason: "مركّب إضافي شائع في الأدبيات العلمية والتقنية العربية، مكوّناه موثّقان بالمعاجم (قابلية = استعداد للقبول؛ التعميم = انطباق النتيجة على ظروف أوسع)، ويُعبّران معاً تحديداً عن مفهوم 'generalizability' بصياغته الإجرائية. يحتاج تصحيح التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُؤكد جانب الاستطاعة الكامنة: أن الشيء (نموذج/نظرية/قاعدة) لديه الاستعداد لأن يُعمَّم ويُطبَّق خارج حدود سياقه الأصلي؛ مصطلح تقني خاص بالبحث العلمي والتعلم الآلي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ التَّعْمِيمِ"

    - lemma: "العُمُومِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق في المورد الحديث بمعنى 'كون الشيء عامًّا' (generality) وهو مطابق تماماً للتعريف؛ وفي ARABTERM بمعنى universality؛ الجذر عمم ودلالته على الشمول الكلي مؤكَّدة عند ابن فارس. مصطلح مفرد أقصر وأجرى على الألسنة من المركّب الإضافي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الصفة الجوهرية للشيء في ذاته بأنه عامٌّ غير مقيَّد بحالة بعينها؛ أكثر استعمالاً في الفلسفة والمنطق عند وصف المبادئ والقوانين والعبارات الكلية"
      actions:
        - command: create_entry
          params: {lemma: "العُمُومِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "الشُّمُولِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق في المعجم الموحد للسانيات بالترجمة Generality، وصرّح المعجم الكبير بأن الشمول = العموم؛ الجذر شمل مرتبط دلالياً بالعموم الكلي عند ابن فارس. الأدلة مختلطة بسبب استعمال exhaustiveness في سياقات أخرى، لكن الاستعمال اللساني التقني راسخ."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُؤكد جانب سعة التغطية واستيعاب جميع الأفراد والحالات بلا استثناء؛ أكثر استعمالاً في اللسانيات عند الحديث عن مدى اطراد القاعدة النحوية؛ تحمل ظلاً دلالياً من الإحاطة والاستيفاء يزيد على مجرد 'كون الشيء عامًّا'"
      actions:
        - command: create_entry
          params: {lemma: "الشُّمُولِيَّة", pos: n}
        - command: add_sense
