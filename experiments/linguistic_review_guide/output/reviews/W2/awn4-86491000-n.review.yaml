    - lemma: "الاطِّرادِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الاطراد في التراث المعجمي يدل على 'الانتظام والتتابع' (regularity)، وهو مفهوم مختلف عن العمومية؛ ترجمته في ARABTERM هي regularity لا generality؛ واستعماله في المنطق الكلاسيكي بمعنى 'اطراد الحكم' مقيَّد بسياق التعريف المنطقي وليس صفةً مستقلة"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
