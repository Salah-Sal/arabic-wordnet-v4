    current: "صفة كون الشيء عاماً أو واسع الانتشار أو قابلاً للتطبيق العام"
    assessment:
      decision: revise
      reason: "يضمّ التعريف 'واسع الانتشار' وهو مفهوم الشيوع/الذيوع (prevalence/currency) المختلف عن العمومية المفهومية؛ كما أن الجمع بين 'عاماً' و'قابلاً للتطبيق العام' يُكرر المفهوم نفسه بصياغتين متقاربتين. التعريف بحاجة إلى صياغة مصطلحية تحدد الجنس القريب (صفة) والفصل النوعي (انطباق الحكم على الأفراد كلها)."
