      reason: "التعريف الحالي مترجم ترجمةً حرفيةً من الإنجليزية. يُعرِّف الظاهرة بالمُعرَّف (يقول 'المغذيات المفرطة' لا 'عملية/ظاهرة'). يفتقر إلى الجنس القريب الصريح، ويخلط بين وصف الحالة ووصف العملية. طويل وخبري لا يُناسب أسلوب المعجم المصطلحي."
    authored:
      - type: terminological
        text: "عملية تدهورٍ بيئيٍّ تُصيب المسطحات المائية الراكدة أو بطيئة التدفق، تتميّز بتراكم مفرط للمغذيات المعدنية (الفوسفور والنيتروجين) الناجمة عادةً عن جريان المياه الزراعية والصحية والصناعية؛ فيُفضي ذلك إلى ازدهار كثيف للطحالب والنباتات المائية، ثم إلى نضوب الأكسجين الذائب وتدهور الحياة الحيوانية في الوسط المائي."
