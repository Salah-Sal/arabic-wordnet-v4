    - lemma: "إِثْرَاء تَغْذَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي. يتداخل دلالياً مع 'إثراء غذائي' الموجود دون أن يُضيف تمييزاً حقيقياً داخل المجموعة. وجودهما معاً يُربك المستخدم دون مسوّغ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشح المرحلة ١: يوتروفة ──
    - lemma: "يُوتْرُوفَة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي. وجود البديل العربي الأصيل 'تتريف' الموثَّق يجعل التعريب غير مبرَّر وفق مبدأ إيثار العربي على المعرَّب. التعريب ملاذ أخير بعد استنفاد البدائل الاشتقاقية، وهي موجودة هنا."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١: إخصاب مائي مفرط ──
    - lemma: "إِخْصَاب مَائِيّ مُفْرَط"
      source: stage1
      decision: removed
      decision_reason: "ثلاثي التركيب مما يُضعف صلاحيته مصطلحاً. 'إخصاب' في المعاجم العلمية يُقابل fertilization لا eutrophication. لا يجتاز اختبار السكّ: يمكن إبدال 'مفرط' بـ'زائد' دون أن يصبح التعبير غير وصفي → ليس مصطلحاً ثابتاً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "المغذيات المفرطة في بحيرة أو مسطح مائي آخر، وعادة ما تنتج عن جريان المغذيات (نفايات الحيوانات، الأسمدة، مياه الصرف الصحي) من الأرض، مما يسبب نموًا كثيفًا للحياة النباتية؛ واستنفاد تحلل النباتات لإمدادات الأكسجين، مما يؤدي إلى موت الحياة الحيوانية"
