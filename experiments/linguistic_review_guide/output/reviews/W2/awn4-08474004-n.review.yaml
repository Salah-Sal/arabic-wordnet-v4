        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْتيب"
    - lemma: "نظام"
      decision: confirmed
      decision_reason: "مرادف قوي يدل على الحالة المنظمة للأشياء والعلاقة الرابطة بينها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظام"
    - lemma: "نَسَق"
      source: stage1
      decision: confirmed
      decision_reason: "أدق المصطلحات التراثية لوصف الترتيب الذي يسير على وتيرة واحدة ونظام منطقي مطرد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَسَق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08474004-n"}
    - lemma: "تَنْظيم"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم لوصف الهيكلية المنظمة الناتجة عن عملية الترتيب، وهو شائع جداً في المعاجم الحديثة والمجالات التقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَنْظيم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08474004-n"}
    - lemma: "تَنْسيق"
      decision: confirmed
      decision_reason: "مرادف مهم يركز على المواءمة والانسجام بين العناصر المرتبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَنْسيق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08474004-n"}
    - lemma: "تَسَلْسُل"
      source: stage1
      decision: removed
      decision_reason: "يدل على نوع خاص من الترتيب (التعاقبي/السلسلي) وليس مجرد الترتيب المنطقي العام."
    - lemma: "مَنْظُومَة"
      source: stage1
      decision: removed
      decision_reason: "تشير غالباً إلى كيان معقد (نظام متكامل) أو قصيدة شعرية، وهي أبعد قليلاً عن المفهوم المجرد للترتيب المنطقي."

stage4_content:
  definition:
    current: "ترتيب منطقي أو مفهوم لعناصر منفصلة"
    assessment:
      decision: revise
      reason: "الصياغة الحالية مقبولة لكنها تفتقر إلى الأسلوب المعجمي الرصين الذي يوضح الحيثية التي تجعل الترتيب منطقياً."
    authored:
      - type: terminological
        text: "جَعْلُ الأشياءِ الكَثِيرةِ مُنْتَظِمَةً بِحَيْثُ يَقُومُ بَيْنَها رابِطٌ مَنْطِقِيٌّ أوْ عِلاقَةٌ مَفْهومَةٌ تُرَدُّ إلى نِظامٍ واحِدٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08474004-n", definition_index: 0, text: "جَعْلُ الأشياءِ الكَثِيرةِ مُنْتَظِمَةً بِحَيْثُ يَقُومُ بَيْنَها رابِطٌ مَنْطِقِيٌّ أوْ عِلاقَةٌ مَفْهومَةٌ تُرَدُّ إلى نِظامٍ واحِدٍ."}
  examples:
    per_lemma:
      - lemma: "تَرْتيب"
        examples:
          - text: "أَعادَ أَمينُ المَكْتَبَةِ تَرْتيبَ الكُتُبِ وَفْقاً لِتاريخِ صُدورِها."
            type: usage
      - lemma: "نِظام"
        examples:
          - text: "يَسيرُ العَمَلُ في الشَّرِكَةِ وَفْقَ نِظامٍ مَنْطِقِيٍّ دَقيقٍ يَضْمَنُ الكَفاءَةَ."
            type: usage
      - lemma: "نَسَق"
        examples:
          - text: "جاءَتِ الأشجارُ في الحَديقَةِ عَلى نَسَقٍ واحِدٍ مُنْتَظِمٍ يَبْهَرُ الأَنْظارَ."
            type: usage
      - lemma: "تَنْظيم"
        examples:
          - text: "يُعَدُّ التَّنْظيمُ الجَيِّدُ لِلْبَياناتِ خُطْوَةً أَساسِيَّةً في مَعالَجَتِها."
            type: usage
      - lemma: "تَنْسيق"
        examples:
          - text: "أَعْجَبَني تَنْسيقُ الألوانِ في المَسْكَنِ؛ فَقَدْ كانَ مُريحاً لِلْعَيْنِ."
            type: usage

