stage1_review:
  assessment:
    concerns:
      - "كلمة 'ترتيب' تُستخدم في المجموعة الوالدة (hypernym) مما قد يسبب لبساً بين عملية الترتيب ونتيجتها المنطقية."
      - "التعريف الحالي يحتاج صياغة أكثر دقة لتعكس الطبيعة المنطقية والمفهومة لهذا النمط من الترتيب."
    observations: "المجموعة تركز على الهيكلية المنطقية لترتيب العناصر (Logic/Pattern) وليس مجرد وضعها جنباً إلى جنب. كلمة 'نَسَق' هي الأدق لغوياً للتعبير عن هذا المفهوم في التراث، بينما تُستخدم 'ترتيب' و'نظام' بشكل عام."
  blind_candidates:
    - lemma: "نَسَق"
      generation_method: majaz
      justification: "كلمة أصيلة تدل على ما كان على طريقة نظام واحد وتتابع منطقي، وتناسب جداً وصف 'Logical arrangement'."
    - lemma: "تَنْظيم"
      generation_method: ishtiqaq
      justification: "مشتقة من النظم (تأليف الشيء وضم بعضه لبعض) وتدل على الهيئة المنظمة الناتجة."
    - lemma: "تَسَلْسُل"
      generation_method: ishtiqaq
      justification: "تدل على تتابع الأشياء كالسلسلة، وهو نوع من الترتيب المنطقي."
    - lemma: "مَنْظُومَة"
      generation_method: ishtiqaq
      justification: "تدل على الكل المنظم المؤلف من عناصر منفصلة."

stage2_evidence:
  per_lemma:
    - lemma: "ترتيب"
      confirm:
        - text: "«الترتيب: لغة، جعل كل شيء في مرتبة. وعرفا جعل الأشياء الكثيرة بحيث يطلق عليها اسم الواحد ويكون لبعض أجزائه نسبة إلى بعضها بالتقدم والتأخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الترتيب: جعل الأشياء المتعددة بحيث يطلق عليها اسم الواحد، ويكون لبعضها نسبة إلى بعض بالتقدم والتأخر»"
          source: "معجم مقاليد العلوم للسيوطي"
    - lemma: "نظام"
      confirm:
        - text: "«النظام: الترتيب والاتساق»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«ترتيب محدود لمجموعة من المُكوِّنات، يرتبطُ بعضها مع بعضٍ في علاقة مُعيَّنة»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
    - lemma: "نَسَق"
      confirm:
        - text: "«النَّسَقُ من كل شيء: ما كان على طريقة نِظامِ واحد، عامٌّ في الأشياء»"
          source: "لسان العرب"
        - text: "«النُّونُ وَالسِّينُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَتَابُعٍ فِي الشَّيْءِ. وَكَلَامٌ نَسَقٌ: جَاءَ عَلَى نِظَامٍ وَاحِدٍ قَدْ عُطِفَ بَعْضُهُ عَلَى بَعْضٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«ما كان على نظام واحد من كلِّ شيء»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "تنظيم"
      confirm:
        - text: "«التنسيق والترتيب»"
          source: "موسوعة السلطان قابوس"
        - text: "«عملية ترتيب المعطيات وتصنيفها وتخطيط كيفية معالجتها»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "تنسيق"
      confirm:
        - text: "«القدرة على تنسيق مدركات الخيال، وترتيبها ترتيباً بليغاً»"
          source: "المعجم الكبير"
        - text: "«ترتيب عناصر الرصف... في أحجام وألوان ومواد مختلفة على أشكال هندسية»"
          source: "المعجم الموحد لمصطلحات النقل"

