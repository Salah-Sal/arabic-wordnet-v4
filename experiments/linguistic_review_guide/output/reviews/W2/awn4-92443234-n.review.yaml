            مصطلحٌ في المنطق الرياضي الحديث ابتكرته المنطقية كريستين لاد-فرانكلين
            (1883) لوصف بنية ثلاثية من القضايا: إذا أُخذت قضيتان منها مقدمتَيْن
            لقياس اقتراني صحيح، كانت القضية الثالثة نقيضَ نتيجة ذلك القياس، وبهذا
            تتشكّل ثلاثيةٌ لا يمكن أن تكون فيها القضايا الثلاث صادقةً في آنٍ واحد.
            يُستخدم القياس المضاد اختباراً لصحة القياسات الاقترانية.

