# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ١ ──
    - lemma: "ثُلاثِيَّة غَيْر مُتَّسِقَة"
      decision: removed
      decision_reason: >
        تفشل اختبار السكّ: «غير متسقة» قابلٌ للاستبدال بـ«غير منسجمة» أو
        «غير متناسقة» وتبقى العبارة واصفةً للمفهوم ذاته، مما يدلّ على أنها
        تعبيرٌ وصفي حر لا وحدة معجمية مثبّتة. لا توجد شواهد معجمية تُثبّتها
        مصطلحاً مسكوكاً في معاجم الفلسفة أو المنطق. المفهوم أوفرُ تمثيلاً
        بـ«قياس مضاد» الأكثر إيجازاً وانضباطاً التركيبي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة ٢ ──
    - lemma: "قِيَاس مُضَادّ"
      decision: confirmed
      decision_reason: >
        مركبٌ وصفي ثنائي يسير على النمط الإنتاجي «قياس + وصف» المُعتمَد في
        التصطلح المنطقي العربي (قياس حملي، قياس شرطي، قياس فاسد)، وهو نمطٌ
        موثّقٌ في ArabTerm ومصادر الفلسفة. اختبار الاستبدال: «مضاد» يفيد
        التضادّ الاصطلاحي الدقيق (من الجذر ضدد)، وإبداله بـ«معاكس» أو «مقلوب»
        يُغيّر الدلالة الاصطلاحية. يستوفي معايير الجودة الستة: اطّراد الوزن،
        يُسر التداول، الملاءمة الفلسفية، العروبة (من جذرَيْن عربيَّيْن)، وصلاحية
        الاشتقاق (قياساتٌ مضادة، القياس المضاد، المقايسة المضادة). يحتاج تصحيح
        التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «قِيَاسٌ مُضَادٌّ» يُركِّز على الطابع القياسي للبنية (أي أنها تنطوي على
        قياسٍ منطقيٍّ كامل) وعلى الطابع التضادّي الناجم عن النقيض، في مقابل
        «ثلاثية غير متسقة» التي كانت تُركِّز على الشكل الكمّي (ثلاث قضايا) وعلى
        غياب الاتساق. بعد حذف اللمّة الثانية، يبقى «قياس مضاد» وحده حاملاً
        دلالة البنية التضادية القياسية المتكاملة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِيَاسٌ مُضَادٌّ"

    # ── مرشح المرحلة ١ — أ ──
    - lemma: "أَنْتِيلُوجِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        تعريبٌ من مصطلح إنجليزي نادر الاستخدام حتى في السياقات الفلسفية
        الإنجليزية ذاتها (مقصورٌ على المنطق الرياضي الأكاديمي)، ولا شاهد له
        في أي معجم عربي متاح. مبدأ التعريب يُوجب استنفادَ الاشتقاق والتركيب
        أولاً، وقد أسفر التركيب عن «قياس مضاد» المُعتمَد على نمط راسخ. لذا
        يغدو هذا التعريب زائداً مع وجود «قياس مضاد» المؤكَّد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ — ب ──
    - lemma: "مُعَارَضَةُ الِاسْتِدْلَال"
      source: stage1
      decision: removed
      decision_reason: >
        المركب الإضافي واسعٌ دلالياً ولا يُحدِّد البنيةَ المنطقية الثلاثية
        بذاتها؛ «معارضة الاستدلال» تصلح وصفاً لأشكال شتى من التناقض المنطقي،
        مما يجعله أعمَّ من المفهوم المطلوب. يفشل اختبار التثبيت المعجمي: لا
        شاهد له ولا مقابل ثابت في المصادر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١ — ج ──
    - lemma: "اللَّازِمَةُ الرَّادَّة"
      source: stage1
      decision: removed
      decision_reason: >
        يصف القضيةَ الثالثة (نقيض الاستنتاج) لا البنيةَ الكلية الثلاثية،
        فينزلق إلى المتونيمية (تسمية الكل بالجزء). الاتساق الدلالي منقوص
        لأن الأنتيلوجية هي مجموعة القضايا الثلاث معاً لا مجرد نقيض النتيجة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشح المرحلة ١ — د ──
    - lemma: "تَعَارُضٌ ثُلَاثِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ: «تناقض ثلاثي» أو «تقابل ثلاثي» يصفان شيئاً قريباً
        جداً، فالمركب لا يكتسب تخصّصاً اصطلاحياً تمييزياً. فضلاً عن ذلك، لا
        شاهد معجمي له، وهو أعمّ من مفهوم الأنتيلوجية الذي يشترط بنيةً قياسية
        بعينها (مقدمتان + نقيض نتيجة).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "ثلاثية غير متسقة من القضايا في المنطق، اثنتان منها مقدمتان لقياس صحيح بينما الثالثة هي نقيض نتيجته"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيحٌ من حيث المحتوى، غير أنه مصوغٌ بأسلوب سردي يبدأ
        بوصف هيكلي («ثلاثية غير متسقة») لا بتحديد الجنس المنطقي القريب أولاً.
        كلمة «ثلاثية» دخيلةٌ من التعريف إلى اللمّة المحذوفة. التعريف المُحكَم
        يُقدِّم الجنس (مجموعة قضايا / بنية منطقية) ثم الفصل النوعي (التناقض
        الثلاثي بين مقدمتين ونقيض نتيجتهما).
    authored:
      - type: terminological
        text: >
          مجموعةٌ مؤلَّفةٌ من ثلاث قضايا منطقية متنافية: تكون اثنتان منها
          مقدمتَيْ قياسٍ صحيح، في حين تكون الثالثةُ نقيضَ نتيجةِ ذلك القياس.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مصطلحٌ في المنطق الرياضي الحديث ابتكرته المنطقية كريستين لاد-فرانكلين
          (1883) لوصف بنية ثلاثية من القضايا: إذا أُخذت قضيتان منها مقدمتَيْن
          لقياس اقتراني صحيح، كانت القضية الثالثة نقيضَ نتيجة ذلك القياس، وبهذا
          تتشكّل ثلاثيةٌ لا يمكن أن تكون فيها القضايا الثلاث صادقةً في آنٍ واحد.
          يُستخدم القياس المضاد اختباراً لصحة القياسات الاقترانية.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-92443234-n"
          definition_index: 0
          text: >
            مجموعةٌ مؤلَّفةٌ من ثلاث قضايا منطقية متنافية: تكون اثنتان منها
            مقدمتَيْ قياسٍ صحيح، في حين تكون الثالثةُ نقيضَ نتيجةِ ذلك القياس.
      - command: add_definition
        params:
