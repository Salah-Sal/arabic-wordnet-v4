# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id: awn4-92443234-n  |  concept: antilogism (القياس المضاد)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «ثُلاثِيَّة غَيْر مُتَّسِقَة» عبارةٌ وصفية حرة مؤلفة من ثلاثة مكوّنات، تفشل اختبار السكّ: يمكن إبدال «متسقة» بـ«منسجمة» أو «متناسقة» وتبقى العبارة وصفاً صالحاً، مما يدلّ على أنها ليست وحدةً معجمية مثبّتة"
      - "اللمّتان خاليتان من التشكيل الكامل في قاعدة البيانات"
      - "المفهوم ينتمي إلى المنطق الرياضي الحديث (نشأ مع كريستين لاد-فرانكلين، 1883) ولا يرد في المعاجم العربية الكلاسيكية ولا الحديثة التي استُعلمت"
      - "المجموعة مفتقرة إلى ربط ILI (ili: null)"
    observations: >
      المجموعة تُمثّل مفهوم «الأنتيلوجية» (antilogism) في المنطق الصوري: ثلاثٌ من القضايا
      تتناقض فيما بينها، بحيث تكون قضيتان منها مقدمتَيْ قياسٍ صحيح، وتكون الثالثةُ
      نقيضَ استنتاجِه. المصطلح غائبٌ عن المعجمية العربية الكلاسيكية والمعاصرة المُستعلَمة،
      مما يجعل إثبات أي لمّة تحدياً معجمياً حقيقياً. «قياس مضاد» أنجحُ المصطلحَيْن
      الموجودَيْن لأنه يسير على نمط «قياس حملي / شرطي / فاسد» المعتمد في التصطلح
      المنطقي العربي. التعريف الحالي دقيقٌ من حيث المحتوى لكنه مصوغٌ بأسلوب سردي
      لا يتناسب مع الأسلوب المعجمي المُحكَم.

  blind_candidates:
    - lemma: "أَنْتِيلُوجِيَّة"
      generation_method: taarib
      justification: >
        تعريبٌ مباشر للمصطلح الفلسفي الدولي "antilogism" الذي أطلقته كريستين
        لاد-فرانكلين وشاع في المنطق الرياضي. يقبل لام التعريف (الأنتيلوجية)
        والنسبة (أنتيلوجي) والجمع السالم (أنتيلوجيات). اللجوء إلى التعريب مبرَّرٌ
        هنا لكون المصطلح الإنجليزي ذا صيغة دولية تقنية صعبة الاشتقاق العربي الدقيق.

    - lemma: "مُعَارَضَةُ الِاسْتِدْلَال"
      generation_method: tarkib
      justification: >
        مركبٌ إضافي: مُعَارَضَة (مصدر من الجذر عرض، الوزن مُفَاعَلَة، بمعنى
        المواجهة والتناقض) + الِاسْتِدْلَال (النتيجة المنطقية). يحاول تصوير
        التعارض الذي يحدث بين القضايا الثلاث ومنطق الاستنتاج.

    - lemma: "اللَّازِمَةُ الرَّادَّة"
      generation_method: tarkib
      justification: >
        مركبٌ وصفي: اللَّازِمَة (القضية اللازمة أو المترتبة) + الرَّادَّة (اسم
        فاعل من الجذر رَدَّ يَرُدّ، أي الرافضة أو النافية). يُشير إلى القضية
        الثالثة التي تَرُدّ الاستنتاجَ وتنقضه. الاشتقاق على وزن فَاعِلَة من
        الجذر الثلاثي ردد.

    - lemma: "تَعَارُضٌ ثُلَاثِيّ"
      generation_method: tarkib
      justification: >
        مركبٌ وصفي: تَعَارُض (مصدر من الجذر عرض على وزن تَفَاعُل، يدلّ على
        المواجهة والتقابل بين طرفين أو أكثر) + ثُلَاثِيّ (نسبة إلى الثلاثة،
        مؤكِّداً البنية الثلاثية للمفهوم). يرسم صورة التناقض الكامن بين
        القضايا الثلاث المُشكِّلة للبنية المنطقية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
