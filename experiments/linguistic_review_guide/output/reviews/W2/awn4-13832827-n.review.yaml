stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'عضو' خالية من التشكيل في قاعدة البيانات وتحتاج ضبطاً كاملاً (عُضْو)"
      - "المجموعة تفتقر إلى مرادفات إضافية تغطي البُعد الرياضي-المنطقي لعلاقة الانتماء إلى مجموعة"
      - "التعريف الحالي مترجَم حرفياً من الإنجليزية ولا يعتمد أسلوب التعريف المعجمي العربي الأصيل (جنس + فصل)"
    observations: >
      المجموعة تعبّر عن مفهوم 'عضو' بمعناه المنطقي-الرياضي: أي كيان ينتسب إلى مجموعة
      أو يندرج تحت فئة. المجموعة الفوقية (awn4-13831419-n) تضمّ: جُزْء، عُنْصُر، مُكَوِّن،
      مما يوجب التمييز الدقيق بين 'العضو' بمعنى المنتسب لفئة (set membership)،
      وبين هذه المفاهيم ذات الطابع الكمي أو البنيوي. الجذر الأصيل للعضو (ع-ض-و) يدل
      على التجزئة والانتساب إلى كل، مما يدعم هذا الاستخدام. اللمّة شائعة في العربية
      المعاصرة بمعنى 'member'، غير أن التشكيل غائب وهو إلزامي.

  blind_candidates:
    - lemma: "مُنْتَسِب"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من 'انتسب' على وزن مُفْتَعِل، من الجذر ن-س-ب الدال على الصلة
        والنسبة. يفيد الانتماء إلى جماعة أو فئة، وهو الوزن القياسي لفاعلية الاشتراك
        الجمعي في العربية المعاصرة.
    - lemma: "مُنْدَرِج"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من 'اندرج' على وزن مُفْتَعِل، يفيد الاندراج تحت فئة أو صنف.
        يُستخدم في السياقات التصنيفية والعلمية للدلالة على ما يدخل ضمن تصنيف أكبر.
    - lemma: "فَرْد"
      generation_method: majaz
      justification: >
        توسيع دلالي من المعنى الأصلي 'الوتر/المتوحد'؛ المنطق المحمولاتي التقليدي
        يستخدم 'الفرد' للدلالة على عنصر بعينه في عالم الخطاب (individual of a class)،
        مما يقربه من مفهوم العضو في المجموعة.
    - lemma: "مَحْسُوب"
      generation_method: majaz
      justification: >
        من الجذر ح-س-ب، مجازي بمعنى 'ما يُعدّ أو يُحسب ضمن مجموعة أو فئة'؛
        يُستخدم في الأسلوب الرسمي تعبير 'محسوب على فئة كذا' للدلالة على الانتساب.


stage2_evidence:
  per_lemma:
    - lemma: "عُضْو"
      confirm:
        - text: >
            «(الْعُضْو) جُزْء من مَجْمُوع الْجَسَد كَالْيَدِ وَالرِّجل وَالْأُذُن
            والمشترك فِي حزب أَو شركَة أَو جَمَاعَة أَو نَحْو ذَلِك
            وَهِي عُضْو وعضوة (مج) (ج) أَعْضَاء»
          source: "المعجم الوسيط"
        - text: >
            «عُضْو [مفرد] ج أعضاء: مُشترِك في حزب أو نادٍ أو نحوهما
            (للمذكَّر والمؤنَّث) — عُضْو المجلس/البرلمان/مجمع اللُّغة العربيَّة»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: >
            «(2) عضو [في جماعة أو حزب]»
          source: "المورد الحديث (2008)"
        - text: "«عضو» — translation_en: member — domain: Law"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«عضو» — translation_en: member — domain: Commerce and Accounting"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«عضو» — translation_en: member — domain: Biology"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«عضو» — translation_en: member — domain: Seismology"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«عُنْصُر» — translation_en: Member — domain: Language and Literature"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: >
            «الْعَيْنُ وَالضَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ
            عَلَى تَجْزِئَةِ الشَّيْءِ. مِنْ ذَلِكَ الْعِضْوُ وَالْعُضْوُ.
            وَالتَّعْضِيَةُ: أَنْ يُعَضِيَ الذَّبِيحَةَ أَعْضَاءً. وَالْعِضَةُ:
            الْقِطْعَةُ مِنَ الشَّيْءِ، تَقُولُ: عَضَّيْتُ الشَّيْءَ أَيْ وَزَّعْتُهُ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يكشف أن الجذر الأصيل (ع-ض-و) يدل على التجزئة وتوزيع الكل إلى أعضاء،
            مما يعني أن 'العضو' هو ما يُشكّل جزءاً منتسباً إلى كل، ويدعم استخدامه
            للدلالة على المنتسب إلى مجموعة أو فئة.

    - lemma: "مُنْتَسِب"
      confirm:
        - text: "«العضو المشارِك أو المنتسب.» — translation_en: associate member"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: >
            «انتماء» — translation_en: belonging;
            «ينتمي الى» — translation_en: belongs to
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: >
            المصطلح المُثبَّت في معجم الرياضيات للانتماء هو 'انتماء' لا 'منتسب'.
            'المنتسب' يظهر صفةً مقيِّدة لـ'عضو' (عضو منتسب = associate member)
            وليس مصطلحاً مستقلاً بمعنى 'member of a set'.

    - lemma: "مُنْدَرِج"
      contradicts:
        - text: "«مُنْدَرِج» — translation_en: built-in"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >
            الدلالة الاصطلاحية الموثقة الوحيدة لـ'مندرج' هي 'مدمج/مضمن' (built-in)،
            وهو يناقض المعنى المطلوب (member of a set or class).

    - lemma: "فَرْد"
      contradicts:
        - text: >
            «الْفَاءُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى وُحْدَةٍ.
            مِنْ ذَلِكَ الْفَرْدُ وَهُوَ الْوَتْرُ. وَالْفَارِدُ وَالْفَرْدُ:
            الثَّوْرُ الْمُنْفَرِدُ. وَظَبْيَةٌ فَارِدٌ: انْقَطَعَتْ عَنِ الْقَطِيعِ»
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            أصل 'فرد' يدل على الوحدة والانفراد والانقطاع، فيقابل 'individual' في المنطق
            لا 'member'. 'العضو' ينتسب إلى مجموعة، أما 'الفرد' فيتميز بالانفراد عنها.
        - text: "«الفرد: ما تناول شخصاً واحداً دون غيره»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "يدل على التشخّص الواحد المتميّز لا على الانتساب إلى كيان جمعي."
      expands:
        - text: >
            «وعند المنطقيين هو الطبيعة المأخوذة مع القيد بأن يكون كل من القيد
            والتقييد داخلاً كزيد وعمرو للإنسان»
          source: "دستور العلماء للأحمدنكري"
          addition: >
            يُظهر أن 'الفرد' يُستخدم في المنطق لكن بمعنى 'ما يتشخص من الكلي'
            (individual of a natural kind)، وهو أخص من 'عضو مجموعة' بمعنى set member.

    - lemma: "مَحْسُوب"
      contradicts:
        - text: "«مَحْسُوب: المال المعد المحصي، والشيء المقدر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الجذر الدلالي يقوم على الإحصاء والتقدير الكمي لا على الانتماء إلى مجموعة."
        - text: "«محسوب» — translation_en: calculated"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "الدلالة الاصطلاحية الثابتة هي 'calculated'، ولا يُوثَّق استخدامه بمعنى member."


stage3_analysis:
  per_lemma:
    - lemma: "عُضْو"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة توثيقاً متواتراً في المعجم الوسيط ومعجم اللغة العربية المعاصرة
        والمعاجم المتخصصة (قانون، تجارة، أحياء، زلازل) بمعنى 'المشترك في جماعة/منظمة'
        المقابل لـ'member'. الجذر (ع-ض-و) يدعم الدلالة بنيوياً. اللمّة تحتاج ضبط
        التشكيل الكامل: عُضْو.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        عُضْو يدل على الانتساب إلى كيان جمعي (مجموعة أو فئة) من حيث العضوية والهوية
        الجمعية، بخلاف أخواته في المجموعة الفوقية: جُزْء (يدل على الانقسام الكمي
        من الكل)، وعُنْصُر (يدل على المكون البنيوي الجوهري)، ومُكَوِّن (يدل على
        دور الوحدة في البناء الكلي). الفارق الجوهري: العضو يُنظر إليه من زاوية
        الانتماء والهوية (set membership)، لا من زاوية الحجم أو الوظيفة التركيبية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُضْو"

    - lemma: "مُنْتَسِب"
      source: stage1
      decision: removed
      decision_reason: >
        لا يُستخدم 'منتسب' مصطلحاً مستقلاً بمعنى 'member of a set or class'؛
        الشواهد تُظهره صفةً مقيِّدة لـ'عضو' (العضو المنتسب = associate member).
        المصطلح الرياضي الثابت للانتماء هو 'انتماء' أو 'ينتمي إلى'، لا 'منتسب'.
        فضلاً عن أن اختبار السكّ يُفشل هذا المرشح: 'المنتسب' وصف حر لا مصطلح مسكوك.

    - lemma: "مُنْدَرِج"
      source: stage1
      decision: removed
      decision_reason: >
        الدليل الوحيد الموثق يُعطيه معنى 'built-in/مدمج'، وهو يناقض المعنى المطلوب.
        لا يوجد شاهد على استخدامه مصطلحاً بمعنى 'member of a class'.
        استخدامه هنا سيُوقع اشتراكاً لفظياً مضلِّلاً.

    - lemma: "فَرْد"
      source: stage1
      decision: removed
      decision_reason: >
        رغم استخدام 'الفرد' في المنطق للدلالة على التشخص، إلا أنه يقابل 'individual'
        لا 'member'؛ إذ 'الفرد' يشير إلى التشخّص الواحد والانفراد، بينما 'العضو'
        يشير إلى الانتساب إلى كيان جمعي. هذا فارق جوهري في علم الدلالة المنطقية.
        استخدام 'فرد' هنا سيُوقع تداخلاً مع المصطلح المنطقي القائم (individual).

    - lemma: "مَحْسُوب"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد أدلة تدعم 'محسوب' بمعنى 'member'؛ دلالته الثابتة هي 'calculated/مقدَّر'.
        الاستخدام المجازي 'محسوب على فئة' تعبير وصفي حر غير مسكوك معجمياً،
        ويفشل اختبار التثبيت المعجمي.


