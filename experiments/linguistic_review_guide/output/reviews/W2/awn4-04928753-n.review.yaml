stage1_review:
  assessment:
    concerns:
      - "اللمّة «حق فطري» قد تُفهم بمعنى «الحق الطبيعي» (Natural Right) وهو مفهوم فلسفي يختلف قليلاً عن مفهوم «حق المولد» (Birthright) الذي يرتبط غالباً بالإرث أو المواطنة أو الامتيازات المكتسبة بالوِلادة."
    observations: "المجموعة تدور حول الحقوق والامتيازات المكتسبة بالولادة. المصطلحات العربية المتاحة تمزج بين الترجمة الحرفية (حق المولد) والاصطلاح الفقهي/القانوني المتعلق بالأولوية (حق البكورية)."
  blind_candidates:
    - lemma: "بِكْرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «البِكْر»، يُستخدم للدلالة على حالة المولود الأول وما يترتب عليها من حقوق (Primogeniture/Birthright)."
    - lemma: "حَقُّ المَوْلِد"
      generation_method: tarkib
      justification: "ترجمة اصطلاحية دقيقة لمصطلح Birthright، تجمع بين الحق وزمن استحقاقه (الولادة)."
    - lemma: "حَقُّ البُكُورِيَّة"
      generation_method: tarkib
      justification: "تعبير قانوني واصطلاحي شائع في المعاجم الحديثة للدلالة على الحقوق المكتسبة بالولادة، خاصة للمولود الأول."
    - lemma: "أَصَالَة"
      generation_method: ishtiqaq
      justification: "تُستخدم أحياناً للدلالة على نبل المحتد أو الحق المكتسب من عراقة النسب عند الولادة."

stage2_evidence:
  per_lemma:
    - lemma: "حق المولد"
      confirm:
        - text: "«حقّ البُكوريّة؛ حقّ المولد: حقّ أو امتياز عائد إلى شخص ما بسبب من كونِهِ بِكْرَ أبيه أو بسبب من ولادته في بلدٍ ما.»"
          source: "المورد الحديث (2008)"
    - lemma: "حق فطري"
      expands:
        - text: "«الحق أو الحقوق المعترف بها للشخص بصفته إنسانا أو كائنا بشريا، ولو بدون التنصيص عليها في نصوص تشريعية...» (تحت مسمى حق طبيعي)"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يُستخدم مرادفاً للحق الطبيعي، وقد يُستخدم استعارةً لحق المولد في السياقات الأدبية."
    - lemma: "حق البكورية"
      confirm:
        - text: "«حقّ البُكوريّة؛ حقّ المولد: حقّ أو امتياز عائد إلى شخص ما بسبب من كونِهِ بِكْرَ أبيه...»"
          source: "المورد الحديث (2008)"
    - lemma: "بكرية"
      expands:
        - text: "«الحالة التي تلد فيها الأنثى للمرة الأولى.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "الاستخدام الغالب علمي طبي، لكنه يُستخدم لغوياً للدلالة على حالة البكر."

stage3_analysis:
  per_lemma:
    - lemma: "حق المولد"
      decision: confirmed
      decision_reason: "مصطلح اصطلاحي دقيق وموثق في المعاجم الحديثة كمقابل لـ Birthright."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَقُّ المَوْلِد"
    - lemma: "حق فطري"
      decision: removed
      decision_reason: "المصطلح يميل دلالياً إلى «الحق الطبيعي» (Natural Right) المرتبط بالطبيعة البشرية العامة، بينما المجموعة تتعلق بـ «حق المولد» المرتبط بواقعة الولادة المحددة (كالنسب أو المواطنة)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "حق البكورية"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي وموثق لـ «حق المولد»، خاصة في سياق الامتيازات المرتبطة بترتيب الولادة (primogeniture) وهو جزء أساسي من مفهوم birthright."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "حَقُّ البُكُورِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04928753-n"}
    - lemma: "بِكْرِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "اسم يدل على الحالة والصفة المكتسبة من كون الشخص بكراً، وهو مكوّن أساسي لمفهوم حق المولد في السياقات التقليدية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بِكْرِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04928753-n"}

stage4_content:
  definition:
    current: "حق أو امتياز يحق لك الحصول عليه عند الولادة"
    assessment:
      decision: retain
      reason: "التعريف دقيق ومباشر ويحقق شروط التعريف الجامع المانع للمفهوم."
  examples:
    per_lemma:
      - lemma: "حَقُّ المَوْلِد"
        examples:
          - text: "المواطنة هي حق المولد لكل طفل يولد على أراضي هذه الدولة."
            type: usage
      - lemma: "حَقُّ البُكُورِيَّة"
        examples:
          - text: "في القوانين القديمة، كان حق البكورية يمنح الابن الأكبر نصيباً مضاعفاً من الميراث."
            type: usage
      - lemma: "بِكْرِيَّة"
        examples:
          - text: "تمسك الملك بمبدأ البكرية في توريث العرش."
            type: usage

