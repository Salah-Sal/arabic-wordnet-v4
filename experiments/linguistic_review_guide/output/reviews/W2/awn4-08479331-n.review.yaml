stage1_review:
  assessment:
    concerns:
      - "يوجد تداخل دلالي بين مفهومي 'بيانات' (Data) و'معلومات' (Information) حيث أن البيانات هي الحقائق الخام، بينما المعلومات هي البيانات بعد معالجتها، لكنهما يُستخدمان بشكل شبه مترادف في هذا السياق للإشارة إلى الحقائق المتوفرة للاستدلال."
    observations: "تعريف المجموعة الترادفية دقيق ومطابق للمفهوم الإنجليزي الذي يعبر عن الحقائق والأرقام التي تُجمع وتستخدم أساساً للاستدلال والتحليل. اللمات الموجودة صحيحة وشائعة جداً وتغطي الجانبين التقني والمعرفي للمفهوم."
  blind_candidates:
    - lemma: "مُعْطَيَات"
      generation_method: ishtiqaq
      justification: "جمع 'معطى'، وهو اسم مفعول من الفعل 'أعطى'، ويُستخدم اصطلاحاً للإشارة إلى الحقائق الأساسية المعطاة التي يُبنى عليها الاستنتاج والتحليل المنطقي."
    - lemma: "بَيَانَات"
      generation_method: majaz
      justification: "من 'البيان' وهو الإيضاح والانكشاف، واستخدمت بصيغة الجمع لتدل على مفردات الحقائق والمعلومات التي توضح الأشياء وتجليها للباحث."
    - lemma: "مَعْلُومَات"
      generation_method: ishtiqaq
      justification: "جمع 'معلومة'، اسم مفعول من 'عَلِمَ'، وهي الأشياء التي يُعلم بها ويُستند إليها كحقائق ثابتة."
    - lemma: "مُدْخَلَات"
      generation_method: ishtiqaq
      justification: "اسم مفعول، يشير إلى ما يُدخل في نظام أو عقل أو عملية حسابية لاستخلاص نتائج واستنتاجات منه."

stage2_evidence:
  per_lemma:
    - lemma: "بيانات"
      confirm:
        - text: "«تمثيل للمعلومات بصيغة مناسبة للتخزين أو المعالجة أو النقل.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«من (ب ي ن) جمع بيان.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

    - lemma: "معلومات"
      confirm:
        - text: "«بيانات معالجة لها معنى في سياق معين.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«المعنى الذي يُفترَضُ أن تمثِّلَه المعطياتُ للناس. تتألَّفُ المعطياتُ من حقائقَ تتحوّلُ إلى معلومات عندما يُنظر إليها ضمن السياق، وتعبِّر للناس عن معنى.»"
          source: "معجم مصطلحات المعلوماتية (2000)"

    - lemma: "مُعْطَيَات"
      confirm:
        - text: "«المادة الخام التي يشتغل عليها الحاسوب. وتتكون من تعبير رقمي أو غير رقمي عن أحداث أو حقائق ماضية أو مقبلة بقصد تخزينها ومعالجتها للحصول على نتائج محددة»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
        - text: "«كمية أو مجموعة كميات عددية أو هندسية يمكن أن تستخدم كأساس أو مرجع لقياس كميات أخرى»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
        - text: "«في (الفلسفة والمنطق): قضايا مسلّمة يتوصل بها إلى علم قضايا مجهولة»"
          source: "المعجم الوسيط"

    - lemma: "مُدْخَلَات"
      expands:
        - text: "«المعطيات التي يتم إدخالها في الحاسوب للمعالجة.»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"

stage3_analysis:
  per_lemma:
    - lemma: "بيانات"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع جداً للتعبير عن الحقائق الخام أو الأرقام التي يتم جمعها (Data)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَيَانَات"

    - lemma: "معلومات"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع للتعبير عن الحقائق المعالجة أو المعارف المستخلصة التي يمكن الاستدلال بها (Information)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْلُومَات"

    - lemma: "مُعْطَيَات"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح وأساسي يعبر عن الحقائق الأولية المعطاة أو المسلّمات التي يُبنى عليها الاستدلال والاستنتاج."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُعْطَيَات", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُدْخَلَات"
      source: stage1
      decision: removed
      decision_reason: "المدخلات (Inputs) تشير بشكل أخص إلى ما يُدخل في نظام لغرض المعالجة، ولا ترادف الحقائق المستخلصة بحد ذاتها بشكل مباشر كالبيانات."
      evidence_assessment:
        case: mixed

stage4_content:
  definition:
    current: "مجموعة من الحقائق التي يمكن استخلاص استنتاجات منها"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويقابل التعريف الإنجليزي بشكل ممتاز."
  examples:
    per_lemma:
      - lemma: "بَيَانَات"
        examples:
          - text: "جمع الباحث بيانات دقيقة حول التغير المناخي."
            type: usage
      - lemma: "مَعْلُومَات"
        examples:
          - text: "استفاد الصحفي من المعلومات الواردة في التقرير."
            type: usage
      - lemma: "مُعْطَيَات"
        examples:
          - text: "تشير المعطيات الحالية إلى تحسن في الوضع الاقتصادي."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "جمع الباحث بيانات دقيقة حول التغير المناخي."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "استفاد الصحفي من المعلومات الواردة في التقرير."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تشير المعطيات الحالية إلى تحسن في الوضع الاقتصادي."}

stage5_enrichment:
  per_entry:
    - lemma: "بَيَانَات"
      entry_id: "{auto}"
      root: "بين"
      maqayis_quote: "«الْبَاءُ وَالْيَاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ، وَهُوَ بُعْدُ الشَّيْءِ وَانْكِشَافُهُ... وَبَانَ الشَّيْءُ وَأَبَانَ إِذَا اتَّضَحَ وَانْكَشَفَ.»"
    - lemma: "مَعْلُومَات"
      entry_id: "{auto}"
      root: "علم"
      maqayis_quote: "«الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى أَثَرٍ بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ.»"
    - lemma: "مُعْطَيَات"
      entry_id: "{auto}"
      root: "عطو"
      maqayis_quote: "«الْعَيْنُ وَالطَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى أَخْذٍ وَمُنَاوَلَةٍ... وَالْعَطَاءُ: اسْمٌ لِمَا يُعْطَى، وَهِيَ الْعَطِيَّةُ.»"

