      sense_id: "{auto}"
      nuance: "تُستخدم للإشارة إلى الحقائق المعالجة التي تحمل معنى واضحاً وتزيد من المعرفة."
      mwe: false
    - lemma: "مُعْطَيَات"
      sense_id: "{auto}"
