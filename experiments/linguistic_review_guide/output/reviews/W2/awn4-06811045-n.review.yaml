# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عَرَضٌ"
      decision: confirmed
      decision_reason: >
        المصطلح المعياري المُتواتر في كافة المعاجم الطبية والفلسفية والمصطلحية العربية
        الحديثة لمفهوم الـsymptom. راسخ في التراث منذ مقاييس اللغة (القرن الرابع الهجري)
        ولسان العرب ويُجمع على أعراض. التشكيل الحالي ناقص (يفتقر إلى التنوين).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن الظاهرة التي تطرأ مُصاحِبةً لأمرٍ ما وقد تزول بزواله؛ في الطب
        يدلّ خصوصاً على ما يحسّه المريض ذاتياً (تمييزاً له عن العلامة الموضوعية)؛
        وفي الفلسفة يقابل الجوهر — أي ما يقوم بغيره ولا وجود له مستقلاً. يتميز
        عن أمارة بدلالته على الطروء والمصاحبة لا على مجرد الدلالة الظنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرَضٌ"

    - lemma: "أَمَارَةٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح عربي كلاسيكي راسخ من جذر أ-م-ر، تعريفه الاصطلاحي عند الجرجاني «ما
        يلزم من العلم بها الظن بوجود المدلول» — وهو يُطابق تعريف المجموعة «يُعتبر
        دلالة على وجود (س)». يرد في Al-Mawrid ضمن ترجمات symptom إلى جانب عَرَض.
        يُغطّي الجانب الاستدلالي (الدليل الظني) الذي يُكمّل جانب المصاحبة الذي يُبرزه
        عَرَض. اجتاز اختبار السكّ (وحدة معجمية ثابتة مُسجَّلة)، والتشكيل الاشتقاقي
        سليم (فَعَالَة للعلامة).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُعبّر عن الدليل الظني الذي يدلّ على وجود الشيء المدلول دون أن يشترط
        المصاحبة الزمنية اللصيقة — أوسع من عَرَض في صلاحيتها عبر السياقات
        (المنطق، الأصول، الطب)؛ وتُفيد معنى «الإشارة القابلة للاستقراء» لا الظاهرة
        التي تُحسُّ مباشرة. تختلف عن الأم الترادفية (علامة) في كونها دليلاً ظنياً
        لا قطعياً.
      actions:
        - command: create_entry
          params:
            lemma: "أَمَارَةٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06811045-n"

    - lemma: "مُلَازِمٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُسفر الاستعلامات عن أي أدلة تدعم استخدام مُلَازِم بمعنى «ما يدلّ على
        وجود شيء»؛ المعاجم تُثبّته حصراً في معنى الرتبة العسكرية ومعنى اللسانيات
        (immanent). يُخلّ بمبدأ يُسر التداول لتنازع المعنيين.

    - lemma: "نَذِيرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ مقيَّد في كل المصادر بمعنى الإنذار من شيء سلبي («لا يكون إلا في
        التخويف والتحذير» — موسوعة السلطان قابوس). دلالته التحذيرية تتعارض مع
        الحياد الدلالي المطلوب في المجموعة (symptom لا يستلزم الخطر بالضرورة).

    - lemma: "رَدِيفٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا صلة دلالية بالمجموعة في أي سياق معجمي؛ المصطلح محتجز في معاني الركوب
        خلف الراكب والمصطلح الشعري والمرادِف اللغوي — وهي كلها بعيدة عن دلالة
        «الدليل على وجود شيء».


