# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (عَرَض) مُقدَّمة بتشكيل ناقص — تفتقر إلى التنوين النهائي (عَرَضٌ)"
      - "المجموعة تشتمل على لمّة واحدة فقط رغم وجود مرادف راسخ هو «أَمَارَة» الوارد في معاجم التعريفات وبعض المعاجم الحديثة بمعنى الدلالة على وجود المدلول"
      - "التعريف الحالي يستخدم رمز المتغير (س) بأسلوب منطقي رياضي — لا يتوافق مع أسلوب المعجم الوسيط"
    observations: >
      عَرَض هو المصطلح المعياري المُتَّفق عليه في المعاجم الطبية والفلسفية والمصطلحية
      العربية لمفهوم الـsymptom. جذره العميق في التراث العربي (مقاييس اللغة، الصحاح، لسان
      العرب) راسخٌ، وتُعلّل المعاجمُ الاشتقاقيةُ تسميتَه بأنه «يعترض» أي يطرأ ويصاحب
      الشيءَ عارضاً من جانبه. وتُفرّق المعاجم الاصطلاحية بين عَرَض الطبي (ما يحسّه المريض
      ذاتياً) وأَمَارَة الأصولية (الدليل الظني على وجود المدلول). التعريف الحالي في AWN
      أوسع من الاستخدام الطبي فيشمل أي مجال، وهو ما يُبرّر البحث عن لمّات إضافية.

  blind_candidates:
    - lemma: "أَمَارَةٌ"
      generation_method: majaz
      justification: >
        لفظ عربي كلاسيكي من جذر أ-م-ر، بمعنى العلامة التي يُستدلّ بها على وجود الشيء؛
        استعمله ابن فارس في مقاييس اللغة بمعنى «العلامة»، وعرّفه الجرجاني اصطلاحاً بـ«ما
        يلزم من العلم به الظن بوجود المدلول»، وهو يلتقي مع مفهوم المجموعة في دلالة شيء
        على وجود شيء آخر يصاحبه.
    - lemma: "مُلَازِمٌ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من لَزِمَ على وزن مُفَاعِل، يدل على ما لا يفارق الشيءَ — والمفهوم
        المقصود يصاحب (س) ملازماً له؛ غير أن الاستخدام المعجمي قد يقصره على المعنى
        العسكري (رتبة ضابط).
    - lemma: "نَذِيرٌ"
      generation_method: majaz
      justification: >
        اسم على وزن فَعِيل من ن-ذ-ر، وأصله المُنذِر الذي يُخبر بمجيء شيء؛ بالمجاز
        قد يُطلق على ما يُشير إلى وجود شيء آخر مقبل أو موجود — لكن فيه إيحاء بالتهديد
        والخطر قد يُخلّ بالدلالة المحايدة المطلوبة.
    - lemma: "رَدِيفٌ"
      generation_method: majaz
      justification: >
        من ر-د-ف، أصله الراكب خلف الراكب، ويُستعمل مجازاً في ما يتبع الشيءَ ويُصاحبه؛
        لكن دلالته على المصاحبة والتتالي قد تناسب مفهوم «ما يصاحب (س)»، وإن كان
        بعيداً عن الاستخدام المصطلحي الراسخ في هذا المجال.


