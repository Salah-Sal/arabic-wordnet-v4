          التي يقودها منها الربّان)، وجسرُ الأسنان (تركيبة تعويضية ترتكز
          على الأسنان المجاورة لسدِّ فراغ سنٍّ مفقودة)، وجسرُ الأنف (الجزء
          العظمي الناتئ الذي يحمل الغضاريف)، وجسرُ الشبكة في علم الحاسب
          (جهاز يوصِّل بين شبكتين مختلفتين)، وجسرُ الدائرة الكهربائية
          (دائرة تُمكِّن من قياس المقاومات بالمقارنة)، وكذلك كل ما يُوصَف
          أدبياً بأنه جسر بين مرحلتين أو حالتين

