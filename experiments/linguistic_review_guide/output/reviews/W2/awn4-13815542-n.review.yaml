# ══════════════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد (أعمى — بدون اللمّات)
# ══════════════════════════════════════════════════════════
stage1_review:

  # ── أ. التوليد الأعمى (من synset_info_masked.yaml فقط) ──
  #
  # التعريف المرئي: "شيء يشبه الجسر في شكله أو وظيفته"
  # المفهوم الأعلى: علاقة بين أشياء أو أحداث (اتصال / ترابط)
  # POS: n
  #
  # المنهجية: المفهوم المقصود هو شيء يقوم بدور الجسر وظيفياً
  # أو يشبهه شكلاً دون أن يكون الجسر الحقيقي نفسه.
  # لذلك نولّد ما يدلّ على الوصل والعبور والربط من التراث العربي.

  blind_candidates:
    - lemma: "قِنْطَرَةٌ"
      generation_method: majaz
      justification: >
        إحياء اللفظ القديم للجسر المُقوَّس؛ القنطرة في التراث تشير إلى الجسر
        المعقود المبني من حجارة، وكانت تُستعمل مجازاً لكل ما يعلو ويمتد بين
        شيئين. استعادة هذا اللفظ الميت لصون الاشتقاقية وتجنّب التداخل مع
        المعنى الحديث لـ"جسر".

    - lemma: "مَعْبَرٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ع ب ر)، وزن مَفْعَل للمكان أو الأداة؛ المعبر هو ما يُعبر
        به النهرُ أو الفجوة، شبيه بالجسر في وظيفته التوصيلية. يناسب المفهومَ
        الأعلى "اتصال بين أشياء" لأنه يصنع التواصل بين ضفتين أو طرفين.

    - lemma: "وُصْلَةٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر (و ص ل)، وزن فُعْلَة للوحدة الواحدة من الوصل؛ الوُصلة ما
        اتصل بالشيء وربطه بغيره، وهي وظيفة الجسر في حدِّها الأدنى. قد تصلح
        بديلاً لما يشبه الجسر وظيفياً في المجالات التقنية (كيمياء، هندسة).

    - lemma: "رِبَاطٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ر ب ط)، وزن فِعَال للأداة؛ الرباط ما يُربط به ويَصل شيئاً
        بآخر، يشبه الجسر في وظيفته الربطية بين طرفين. اللفظ فصيح متداول
        ويقبل النسبة والجمع السالم (رِبَاطات).

  # ── ب. التقييم الأولي (بعد قراءة synset_info الكامل) ──
  assessment:
    concerns:
      - >
        تعريف دائري (circular): التعريف الحالي "شيء يشبه الجسر في شكله أو
        وظيفته" يستعمل اللفظ "الجسر" في تعريف مجموعة ترادفية وحيدة اللمّة
        هي "جِسْر"، مما يُفضي إلى دوران اصطلاحي صريح ويُبطل فاعلية التعريف.
      - >
        قصور عددي: المجموعة تحمل لمّةً واحدةً فقط (جِسْر) لمفهوم متعدد
        الأوجه يشمل جسر السفينة وجسر الأسنان وجسر الشبكة وجسر الأنف وغيرها؛
        غياب لمّات بديلة يُضعف التمثيل الدلالي.
      - >
        الخلط بين حسّين: لفظ "جِسْر" يحمل في العربية الحسَّ الأول (الجسر
        المعماري الحقيقي) والحسَّ الموسَّع (ما يشبه الجسر). هذه المجموعة
        خاصة بالحسِّ الموسَّع وفق تعريف OEWN، لكن التعريف الحالي لا يُميِّز
        بين الحسَّين.
    observations: >
      الجذر (ج س ر) يدلُّ أصلاً على القوة والجرأة وفق مقاييس اللغة لابن
      فارس، واشتُقَّ منه الجِسْر بمعنى القنطرة لأنه يجسر (يُقدِم) على العبور
      فوق الفجوة. هذا الأصل الاشتقاقي الدالُّ على الإقدام والمضيَّ منسجمٌ
      تماماً مع استعمال "جِسْر" مجازاً لكل ما يُمكِّن من العبور أو الوصل
      بين طرفين بصرف النظر عن طبيعته المادية. المعجم الكبير يوثِّق هذا
      الاستعمال المجازي بشواهد شعرية ("اغتنم غفلة المنية واعلم / أنما الشيب
      للمنية جِسرُ") ونثرية ("رحم الله امرأ جعل طاعته جسراً إلى نجاته")،
      مما يؤكد رسوخ هذا الحسِّ الموسَّع في التراث اللغوي العربي.


# ══════════════════════════════════════════════════════════
# المرحلة ٢: جمع الأدلة
# ══════════════════════════════════════════════════════════
stage2_evidence:

  # ── ملاحظات الاستعلام ──
  # استعلام ١ (دفعي — لمّة موجودة + مرشحات):
  #   headword_norm IN: جسر، الجسر، قنطرة، القنطرة، معبر، المعبر،
  #                     وصلة، الوصلة، رباط، الرباط
  # استعلام ٢ (إثراء بالمعرّف):
  #   entry_id IN: 4134, 71937, 985666, 24200, 18093, 33242, 870355
  # استعلام ٣ (جسر إنجليزي):
  #   translation_en:"bridge" OR "abutment" OR "viaduct" OR "overpass"
  # استعلام ٤ (FTS عربي):
  #   "يشبه الجسر" OR "يعبر عليه" OR "يصل بين" OR "وظيفة الجسر"
  # مجموع الاستعلامات: 4

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "جِسْر"
      confirm:
        - text: >
            «القنطرة ونحوهما مما يُعبر عليه — ضفة الترعة — الحد الفاصل
            بين أرضين»
          source: "المعجم الوسيط (OCR)، entry_id: 4134"
        - text: >
            «ما يعبر عليه كالقنطرة ونحوها — سفن يُشد بعضها إلى بعض وتربط»
          source: "المعجم الكبير، entry_id: 71937"
        - text: >
            «الجِسرُ: واحد الجُسور التي يُعبَر عليها»
          source: "تاج اللغة وصحاح العربية للجوهري، entry_id: 980113"
        - text: >
            «الجَسْرُ والجِسرُ القِنطرةُ ونحوه مما يعبر عليه»
          source: "كتاب العين للخليل بن أحمد الفراهيدي، entry_id: 837247"
        - text: >
            «الجَسْر، والجِسْر: الذي يعبر عليه»
          source: "المحكم والمحيط الأعظم لابن سيده، entry_id: 990683"
        - text: >
            «الجسر: بفتح أو كسر، ما يعبر عليه مبنيا أم لا»
          source: "التوقيف على مهمات التعاريف للمناوي، entry_id: 813546"
        - text: >
            «(الجسر) القنطرة ونحوها مما يعبر عليه وضفة الترعة والحد
            الفاصل بين أرضين (مج) (ج) أجسر وجسور»
          source: "المعجم الوسيط لمجموعة من المؤلفين، entry_id: 870355"
        - text: >
            «جهاز يقوم بتحويل البروتوكولات بين شبكات مختلفة»
          source: >
            المعجم الموحد لمصطلحات تقانة المعلومات (ARABTERM)، entry_id: 354742
            [translation_en: bridge — domain: Information and Communication]
        - text: >
            «منطقة صبغية توصل بين سنتروميرين يتحركان إلى القطبين المتعاكسين
            في طور الصعود»
          source: >
            المعجم الموحد لمصطلحات علم الوراثة (ARABTERM)، entry_id: 460042
            [translation_en: Bridge — domain: Genetics]
        - text: >
            «جزء الدماغ بين البصلة والمخ الأوسط... يربط نصفي الكرة المخية
            بهيأة جسر»
          source: >
            المعجم الموحد لمصطلحات علم التشريح العياني (ARABTERM)، entry_id: 475615
            [translation_en: pons — domain: Gross Anatomy]
        - text: >
            «تعويضة صناعية لسن مفقودة أو أكثر، محملة على دعامات من الأسنان
            المجاورة — جزء الدماغ بين البصلة والمخ الأوسط (pons)»
          source: >
            معجم المصطلحات الطبية ج.1 (ARABTERM)، entry_id: 733647
            [translation_en: bridge — domain: medical]
      expands:
        - text: >
            «رَحِمَ الله امرأ جعل طاعته جسرًا إلى نجاته»
          source: "المعجم الكبير (شاهد استعمال)، entry_id: 71937"
          addition: >
            يوثِّق الاستعمال المجازي لـ"جسر" للدلالة على شيء يؤدي وظيفة
            الجسر دون أن يكون جسراً معمارياً، وهو جوهر هذا الحسِّ الترادفي.
        - text: >
            «اغتنم غفلة المنية واعلم / أنما الشيبُ للمنية جِسرُ»
          source: "المعجم الكبير (شعر: محمود الوراق)، entry_id: 71937"
          addition: >
            شاهد شعري على المجاز الكامل: الشيب جسر نحو الموت، مما يُثبت
            رسوخ الاستعمال المجازي الموسَّع في التراث الأدبي.
        - text: >
            «وَالْجِسْرُ مَعْرُوفٌ. قَالَ ابْنُ دُرَيْدٍ: هُوَ بِفَتْحِ
            الْجِيمِ الَّذِي يُسَمِّيهِ الْعَامَّةُ جِسْرًا، وَهِيَ
            الْقَنْطَرَةُ. وَالْجَسَارَةُ: الإِقْدَامُ، وَمِنْ ذَلِكَ
            اشْتُقَّتْ جَسْرُ»
          source: "مقاييس اللغة لابن فارس، entry_id: 985666"
          addition: >
            ابن فارس يُصرِّح بأن الجذر (ج س ر) يدلّ على القوة والجرأة،
            وأن الجسر/القنطرة مشتق منه، مما يُؤسِّس للمعنى الحيوي في
            تسمية كل ما يُقدِم على ردم فجوة أو وصل طرفين.

    # ── مرشح المرحلة ١: قِنْطَرَة ──
    - lemma: "قِنْطَرَةٌ"
      confirm:
        - text: >
            «القَنْطَرَةُ: الجِسرُ، وما ارتفع من البُنيانِ»
          source: "القاموس المحيط للفيروزآبادي، entry_id: 800853"
        - text: >
            «(القنطرة) جسر متقوس مبني فوق النهر يعبر عليه (ج) قناطر»
          source: "المعجم الوسيط لمجموعة من المؤلفين، entry_id: 880344"
        - text: >
            «جسر مقوَّس مبنيٌّ فوق النهر يعبر عليه»
          source: "المعجم الوسيط (OCR)، entry_id: 24200"
        - text: >
            «القَنْطَرَةُ معروفة»
          source: "المحيط في اللغة للصاحب بن عباد، entry_id: 902702"
      contradicts:
        - text: >
            «(القنطرة) جسر متقوس مبني فوق النهر يعبر عليه»
          source: "المعجم الوسيط (OCR وHawramani)، entry_id: 24200, 880344"
          conflict: >
            القنطرة تُعرَّف في جميع المصادر بأنها الجسر القوسي المبني
            (جسر حقيقي لا شيء يشبهه)؛ إدراجها في مجموعة "ما يشبه الجسر"
            يُدرج الجسر الأصلي ضمن مجموعة مشتقاته، مما يُوقع في الخلط
            الدلالي بين الحسِّ الأوّل (literal) والحسّ الموسَّع (extended).

    # ── مرشح المرحلة ١: مَعْبَر ──
    - lemma: "مَعْبَرٌ"
      confirm:
        - text: >
            «(المعبر) ما يعبر به النهر من قنطرة أو سفينة (ج) معابر —
            (المعبر) الشط المهيأ للعبور (ج) معابر»
          source: "المعجم الوسيط لمجموعة من المؤلفين، entry_id: 883677"
        - text: >
            «ما يُعْبَر به النهر من قنطرة أو سفينة — الشَّطُّ المهيَّأ
            للعبور»
          source: "المعجم الوسيط (OCR)، entry_id: 18093"
        - text: >
            «المَعْبر الفوقيّ: جسر أو طريق فوق سكة حديد أو قناة أو
            طريق أخرى»
          source: "المورد الحديث (ARABTERM)، entry_id: 705523"
      contradicts:
        - text: >
            «ما يعبر به النهر من قنطرة أو سفينة»
          source: "المعجم الوسيط (OCR)، entry_id: 18093"
          conflict: >
            المعبر أعمُّ من الجسر؛ يشمل القنطرة والسفينة والشطَّ المهيَّأ
            للعبور؛ فهو لا يشبه الجسر تحديداً بل يتضمنه ضمن فئة أوسع،
            مما يجعله غير ملائم للحلول محلَّ "شيء يشبه الجسر في شكله
            أو وظيفته".

    # ── مرشح المرحلة ١: وُصْلَة ──
    - lemma: "وُصْلَةٌ"
      confirm:
        - text: >
            «(الوصلة) الاتصال يقال بينهما وصلة وما اتصل بالشيء والرفقة
            والزاد والأرض البعيدة (ج) وصل»
          source: "المعجم الوسيط لمجموعة من المؤلفين، entry_id: 887590"
        - text: >
            «الاتِّصَال — ما اتَّصَل بالشيء — الرِّفْقَةُ — الزَّاد —
            الأرض البعيدة»
          source: "المعجم الوسيط (OCR)، entry_id: 33242"
        - text: >
            «(في علم الكيمياء) رمز للقوة التي تربط بين ذرّتين في جزيء (مج)»
          source: "المعجم الوسيط (OCR)، entry_id: 33241"
      contradicts:
        - text: >
            «رمز للقوة التي تربط بين ذرّتين في جزيء»
          source: "المعجم الوسيط (OCR)، entry_id: 33241"
          conflict: >
            الوُصلة/الوَصْلة في معناها الحديث تدلّ على الرابطة الكيميائية
            أو الاتصال العام، وليس على شيء يشبه الجسر شكلاً أو هيأةً؛
            لا علاقة لها بالشكل الجسري الممتد فوق فجوة بين طرفين.

    # ── مرشح المرحلة ١: رِبَاط ──
    - lemma: "رِبَاطٌ"
      confirm:
        - text: >
            «(الرباط) ما يُربط به»
          source: "المعجم الوسيط (OCR)، entry_id: 10028"
      contradicts:
        - text: >
            «ما يُرْبَطُ به يقال: قرض رباطه: مات — رباط الخيل: مرابطها —
            الخيل نفسها — موضع المرابطة — ملجأ الفقراء من الصوفية — الفؤاد»
          source: "المعجم الوسيط (OCR)، entry_id: 10028"
          conflict: >
            الرباط لا يشبه الجسر لا شكلاً ولا وظيفةً؛ هو في الأصل حبل
            أو وثاق، ثم منطقة مرابطة عسكرية، ثم ملجأ صوفي. لا وجه فيه
            لامتداد فوق فجوة أو وصل بين ضفتين منفصلتين.


# ══════════════════════════════════════════════════════════
# المرحلة ٣: التحليل اللغوي للّمات
# ══════════════════════════════════════════════════════════
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة: جِسْر ──
    - lemma: "جِسْر"
      decision: confirmed
      decision_reason: >
        اللفظ موثَّق في المعاجم الكلاسيكية والحديثة للدلالة على الجسر
        الحقيقي والمجازي على حدٍّ سواء؛ الاستعمال الموسَّع (ما يشبه الجسر
        في وظيفته الربطية أو شكله الممتد) راسخٌ في الشعر والنثر العربيَّين
        ومُسجَّل في المعاجم التقنية (جسر السفينة، جسر الأسنان، جسر الشبكة،
        جسر الأنف). هذا الحسُّ الموسَّع هو بالضبط ما تمثِّله هذه المجموعة
        الترادفية (ILI i109391). التشكيل الموجود (جِسْر) صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تمثّل الاستعمال الموسَّع لجِسْر بمعنى
        "ما يربط بين طرفين أو يسدّ فجوةً بينهما وظيفياً أو شكلياً"،
        في مقابل الحسّ الأصلي (الجسر الهندسي المعماري) الذي ينتمي
        إلى مجموعة ترادفية مختلفة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِسْرٌ"

    # ── مرشح المرحلة ١: قِنْطَرَة ──
    - lemma: "قِنْطَرَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        القنطرة جسر مقوَّس مبني؛ هي الجسر الحقيقي ذاته (الحسّ الأوّل
        literal) وليست "شيئاً يشبه الجسر". إدراجها هنا يُخلط بين الأصل
        والفرع؛ مكانها الصحيح في المجموعة الأمّ للجسر الإنشائي الحقيقي
        لا في مجموعة ما يشبه الجسر (ما يمتد للدلالة على الحسّ الموسَّع).
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١: مَعْبَر ──
    - lemma: "مَعْبَرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المعبر أعمُّ من الجسر؛ يشمل القنطرة والسفينة والشط المهيَّأ للعبور،
        ولا يختص بما يشبه الجسر شكلاً أو وظيفةً في الحسِّ الموسَّع.
        فضلاً عن ذلك فهو يدلُّ على أشياء ملموسة وليس على المفهوم المجرَّد
        "شيء يشبه الجسر". المعنى التقني "المعبر الفوقي = overpass" لا ينتمي
        إلى هذه المجموعة بل إلى مجموعة الجسور الطرقية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١: وُصْلَة ──
    - lemma: "وُصْلَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الوُصلة/الوَصْلة تدلُّ في المعاجم الحديثة أساساً على الرابطة
        الكيميائية أو الاتصال العام، لا على ما يشبه الجسر شكلاً أو
        وظيفةً. اجتياز اختبار السكّ المعجمي يُظهر أن "وُصلة" وصفٌ لأي
        اتصال لا تعبيرٌ اصطلاحي ثابت لهذا المفهوم. لا تُجزئ.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١: رِبَاط ──
    - lemma: "رِبَاطٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الرباط في التراث العربي يدلّ على الحبل/الوثاق أو موضع المرابطة
        العسكرية أو الملجأ الصوفي. لا يحمل المعنى الشكلي (ممتدّ فوق فجوة)
        ولا المعنى الوظيفي (وصل بين طرفين كالجسر). أُحيل هذا الترشيح
        قبل استنفاد البديل الأفضل (مَعْبَر، وُصلة)، وكلاهما أقرب دلالةً
        للمفهوم المستهدف.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


