    current: "شيء يشبه الجسر في شكله أو وظيفته"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دائري (circular): يعرِّف مجموعةً لمّتُها الوحيدة
        "جِسْر" بقوله "شيء يشبه الجسر"، فيستعمل المُعرَّف في التعريف.
        يجب صياغة تعريف يُقدِّم الجنس القريب والفصل النوعي دون دوران.

    authored:
      - type: terminological
        text: >
          بُنيةٌ أو عنصرٌ يمتدُّ بين طرفين أو جزأين متباعدَين أو منفصلَين
          ليُؤمِّن التواصل أو الوصل بينهما، شكلاً أو وظيفةً، من غير أن يكون
          منشأةً هندسيةً مُقامةً على مجرى مائي أو وادٍ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false

