      maqayis_quote: >
        «الْجِيمُ وَالسِّينُ وَالرَّاءُ يَدُلُّ عَلَى قُوَّةٍ وَجُرْأَةٍ.
        فَالْجَسْرَةُ: النَّاقَةُ الْقَوِيَّةُ، وَيُقَالُ هِيَ الْجَرِيئَةُ
        عَلَى السَّيْرِ. وَصُلْبٌ جَسْرٌ أَيْ قَوِيٌّ. وَالْجِسْرُ مَعْرُوفٌ.
        قَالَ ابْنُ دُرَيْدٍ: هُوَ بِفَتْحِ الْجِيمِ الَّذِي يُسَمِّيهِ
        الْعَامَّةُ جِسْرًا، وَهِيَ الْقَنْطَرَةُ. وَالْجَسَارَةُ: الإِقْدَامُ،
        وَمِنْ ذَلِكَ اشْتُقَّتْ جَسْرُ، وَهِيَ قَبِيلَةٌ»
        [مقاييس اللغة لابن فارس، entry_id: 985666]

