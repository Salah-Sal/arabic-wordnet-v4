# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث (بنية، تركيب، تكوين) مكتوبة بدون تشكيل كامل"
      - "التعريف الحالي يستخدم الفعل «يتكون» مما يُوقع في الدوران مع اللمّة «تكوين»"
      - "لمّة «تركيب» تحمل في التراث المعجمي معنى العمليّة (synthesis/process) أكثر من معنى الحالة الناتجة (composition as state)، مما يستوجب توثيقاً دقيقاً"
      - "لمّة «تكوين» في المعاجم الكلاسيكية ترد بمعنى «إيجاد الشيء من العدم» وهو معنى كلامي-فلسفي مغاير للمعنى المطلوب"
      - "يُلاحَظ غياب لمّة «قِوَام» التي تُثبتها المعاجم الحديثة مرادفاً لـ constitution بمعنى «ما يقوم به الشيء وعماده»"
    observations: >-
      المجموعة تتناول مفهوم «طبيعة تكوين الشيء» أو «هيئته من حيث عناصره وأجزاؤه»،
      وهو مفهوم راسخ في العربية ذو تعابير متعددة. الجذر «بني» يُعطي «البنية» وهي
      أوضح المصطلحات استخداماً في هذا المعنى كما يشهد المعجم الوسيط والمعجم الكبير.
      أما «تركيب» و«تكوين» فيستدعيان تدقيقاً في دلالتهما بين المعنى العملياتي
      والمعنى الحالي؛ إذ إن المعنى المطلوب هو خاصيّة الكيان (state) لا فعل التأليف
      (process). كلا المصطلحين مقبول في الاستخدام التقني الحديث. المجموعة مرشّحة
      لاستقبال مصطلح «قِوَام» الذي يُكمل شبكة الترادف من زاوية الجوهر والعماد.
  blind_candidates:
    - lemma: "قِوَام"
      generation_method: majaz
      justification: >-
        إزاحة دلالية من «ما يقوم به الشيء ويثبت» نحو «طبيعة التكوين الجوهرية».
        الجذر قوم يُعطي الانتصاب والثبات والعِماد، ومنه «قِوامُ الشيء: عماده ونظامه».
        مؤثَّر على المجاز لأن القِوام يُبرز الجانب الجوهري الذي يرتكز عليه الكيان
        ويقوم به، وهو إحياء لاستخدام عربي كلاسيكي موثوق يتجنّب الاشتراك اللفظي.
    - lemma: "خِلْقَة"
      generation_method: ishtiqaq
      justification: >-
        من جذر خلق على وزن فِعْلَة الدالة على الهيئة والحال. تعني الطريقة التي خُلق
        عليها الكيان وتكوّنت طبيعته الأصيلة. تُستخدم في السياق الطبي كمقابل لـ habitus
        أي الهيئة الجسدية الأساسية للكائن الحيّ.
    - lemma: "هَيْئَة"
      generation_method: ishtiqaq
      justification: >-
        من جذر هيأ على وزن فَعْلَة، تدل على الصورة الكليّة والطريقة التي يُرى عليها
        الشيء في تنظيمه وبنائه. قريبة من معنى المجموعة وإن كانت أعمّ في الدلالة
        وتشمل الشكل الخارجي أيضاً.
    - lemma: "تَأَلُّف"
      generation_method: ishtiqaq
      justification: >-
        من جذر ألف على وزن تَفَعُّل، يدل على طريقة اجتماع الأجزاء وتآلفها في
        كلٍّ واحد. يقابل composition من حيث الجمع الفعلي للمكوّنات، ويتميز بأنه
        يُشير إلى الانسجام والتلاؤم بين الأجزاء لا مجرد تجميعها.


