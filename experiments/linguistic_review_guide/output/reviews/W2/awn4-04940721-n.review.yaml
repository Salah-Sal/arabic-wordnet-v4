          definition_index: 0
          text: "خاصيّةٌ جوهريّةٌ تُحدِّد طبيعةَ مكوّناتِ الكيانِ وأسلوبَ تأليفِها في كلٍّ متكامل"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "هيئةُ الشيءِ من حيثُ ما يُبنى عليه ويُركَّب من عناصره وأجزائه الأساسية"

  examples:
    per_lemma:
