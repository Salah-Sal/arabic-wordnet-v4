# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "بنية"
      decision: confirmed
      decision_reason: >-
        اللمّة مؤيّدة بأدلة معجمية كلاسيكية وحديثة متعددة بالمعنى المطلوب
        (هيئة الجسم أو الشيء من حيث طبيعته وعناصره). وثّقها المعجم الوسيط
        والمعجم الكبير ومعاجم ALECSO المتخصصة بمعنى constitution/structure.
        تحتاج تصحيح التشكيل: البُنْيَة والبِنْيَة كلتاهما فصيحتان؛ يُعتمد بِنْيَة
        للسياقات العلمية وهو أشيع.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُركّز على الجانب الهيكلي الذي بُنِيَ عليه الكيان وقام، أقرب لـ structure
        وإن شمل composition؛ أشيع في وصف الجسد والبنى التقنية والأنظمة اللسانية
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِنْيَة"

    - lemma: "تركيب"
      decision: confirmed
      decision_reason: >-
        مؤيّد في السياقات التقنية الحديثة (كيمياء، أحياء، صيدلة) بمعنى
        composition/constitution. التعارض مع المعاجم الكلاسيكية يخصّ المعنى
        الفلسفي (التأليف كعملية) ولا ينفي الاستخدام العلمي الحديث الراسخ.
        يبقى ضمن المجموعة بوصفه أشيع المصطلحات في السياقات التطبيقية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُشدّد على أسلوب تأليف الأجزاء بعضها مع بعض، أقرب لـ composition
        من الزاوية العلمية والكيميائية والنحوية؛ يُؤكّد الجانب التركيبي البنيوي
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْكِيب"

    - lemma: "تكوين"
      decision: confirmed
      decision_reason: >-
        مؤيّد في المعاجم الحديثة بمعنى constitution/composition في الأحياء
        والتشريح والجيولوجيا والصيدلة. المعنى الكلاسيكي الكلامي (الخلق من العدم)
        لا يلغي الاستخدام الحديث الموثّق الراسخ. يُقابل physical composition
        من حيث التأكيد على الجانب الوجودي للتكوين.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُبرز جانب النشأة والوجود الفعلي للكيان (ما تكوّن منه وما نشأ عليه)،
        يُفضَّل في سياقات التشريح والجيولوجيا والأحياء
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكْوِين"

    - lemma: "قِوَام"
      source: stage1
      decision: confirmed
      decision_reason: >-
        مؤيّد في المعجم الوسيط ومقاييس اللغة ومصادر حديثة متعددة بمعنى
        «عماد الشيء ونظامه وما يقوم به». أثبته المورد الحديث مرادفاً مباشراً
        لـ constitution بالمعنى المطلوب. الاستخدام في «قِوام الحياة» والمعجم
        البيولوجي يؤكد ملاءمته. يُضيف بُعداً دلالياً مغايراً (الجوهر والعِماد)
        يكمّل باقي اللمّات ويُثري الشبكة الدلالية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُبرز الجانب الجوهري الذي يقوم عليه الكيان ويثبت به، ويُستخدم في السياق
        المادي (قوام المادة) والمجازي (قوام الحياة، قوام الأمة) على حدٍّ سواء
      actions:
        - command: create_entry
          params:
            lemma: "قِوَام"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "خِلْقَة"
      source: stage1
      decision: removed
      decision_reason: >-
        تختصّ بما خُلق عليه الكائن الحيّ من طبيعة فطرية وراثية (habitus/congenital
        constitution)، وهي أضيق من المعنى المطلوب ولا تشمل الأشياء غير الحية
        ولا التركيبات الاصطناعية. التعميم يُفضي إلى توسّع غير مبرر في الدلالة.

    - lemma: "هَيْئَة"
      source: stage1
      decision: removed
      decision_reason: >-
        الهيئة أعمّ من المطلوب؛ تعني الصورة الخارجية والشكل الكلي العام، وليست
        مصطلحاً مخصوصاً لطريقة التكوين الداخلية. دلالتها على form/appearance
        أقوى من دلالتها على composition، ومن الأفضل إبقاؤها خارج المجموعة.

    - lemma: "تَأَلُّف"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية كافية على الاستخدام الاصطلاحي بهذا المعنى. تأليف
        (المصدر الثلاثي) أشيع وأرسخ، وتَأَلُّف (التفعّل) يدل على الفعل
        والاجتماع التلقائي لا على الحالة الناتجة (constitution as a property).


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "الطريقة التي يتكون بها شخص أو شيء ما"
    assessment:
      decision: revise
      reason: >-
        التعريف يستخدم الفعل «يتكون» مما يُوقع في الدوران مع اللمّة «تكوين»؛
        كما أن أسلوبه ترجمي مباشر من الإنجليزية ولا يُجري الجنس القريب
        بالأسلوب المعجمي العربي. الجنس الأقرب للمجموعة هو «خاصيّة جوهريّة»
        وهو ما يتوافق مع المجموعة الأعلى (hypernym).
    authored:
      - type: terminological
        text: "خاصيّةٌ جوهريّةٌ تُحدِّد طبيعةَ مكوّناتِ الكيانِ وأسلوبَ تأليفِها في كلٍّ متكامل"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "هيئةُ الشيءِ من حيثُ ما يُبنى عليه ويُركَّب من عناصره وأجزائه الأساسية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
