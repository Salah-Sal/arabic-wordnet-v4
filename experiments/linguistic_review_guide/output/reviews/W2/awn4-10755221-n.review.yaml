stage1_review:
  assessment:
    concerns:
      - "تعريف المجموعة الترادفية باللغة العربية يفتقر إلى الدقة المصطلحية (أكتفى بوصف الفعل بدلاً من تسمية المفهوم)."
      - "الارتباط التسلسلي (Hypernym) عام جداً (عامل/فاعل) وكان من الأفضل أن يكون تحت (حاكم) أو (صاحب سلطة)."
    observations: "المجموعة تغطي مفهوم الشخص الذي يمارس السلطة بظلم وقسوة. الكلمتان الموجودتان (طاغية، مستبد) هما الأدق في العربية الفصحى. المصطلح الإنجليزي 'tyrant' يقابله تاريخياً 'طاغية' ومعاصراً 'دكتاتور'."
  blind_candidates:
    - lemma: "جَبَّار"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة تدل على من يقهر غيره ويجبره على ما يريد، وقد وردت في القرآن الكريم لوصف المتكبرين والظلمة."
    - lemma: "دِكْتَاتُور"
      generation_method: taarib
      justification: "المصطلح المعاصر الأكثر شيوعاً لوصف الحاكم المستبد الذي يجمع السلطات في يده."
    - lemma: "ظَالِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل عام لكل من جار واعتدى، وهو المعنى الأساسي للقسوة في ممارسة السلطة."
    - lemma: "جَائِر"
      generation_method: ishtiqaq
      justification: "من الجَوْر وهو الميل عن الحق والعدل، ويستخدم لوصف الحاكم الظالم."

stage2_evidence:
  per_lemma:
    - lemma: "طَاغِيَة"
      confirm:
        - text: "«الطَّاغِيَةُ: الجبَّارُ الظَّلُوم... الحاكم الْمُسْتَبِدُّ، يَقْهَرُ النَّاس ويأكلُ حُقُوقَهم»"
          source: "المعجم الكبير"
        - text: "«(الطاغية) الْعَظِيم الظُّلم الْكثير الطغيان»"
          source: "المعجم الوسيط"
    - lemma: "مُسْتَبِدّ"
      confirm:
        - text: "«دكتاتور: حاكم فرد مستبد يحصر في نفسه السلطات الحكومية كلها»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«المستبد برأيه: الذي ينفرد به ولا يشاور غيره»"
          source: "المعجم الوسيط (بالمعنى العام)"
      expands:
        - text: "«tyrant»"
          source: "ArabTerm (Philosophy)"
          addition: "يؤكد استخدامه كمصطلح فلسفي وسياسي مقابل للكلمة الإنجليزية."
    - lemma: "جَبَّار"
      confirm:
        - text: "«(الجَبَّارُ) من النَّاسِ: العاتى المُتَمرِّدُ المُتسلِّطُ القاهرُ... الذى يَقْتُلُ على الغَضَبِ في غَيْرِ حقٍّ»"
          source: "المعجم الكبير"
        - text: "«الجبار: فعال من الجبرية وهي غلظ طبع الظالم.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "دِكْتَاتُور"
      confirm:
        - text: "«دِكْتاتور: حاكِمٌ فردٌ مُسْتَبدٌّ، يحصر في نفسه السّلطات الحكوميّة كلّها»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "طَاغِيَة"
      decision: confirmed
      decision_reason: "المصطلح العربي الأصيل والأكثر دقة للتعبير عن 'tyrant'، وهو يجمع بين الظلم ومجاوزة الحد والقهر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَاغِيَة"
    - lemma: "مُسْتَبِدّ"
      decision: confirmed
      decision_reason: "مصطلح مركزي في الفكر السياسي العربي (خاصة بعد الكواكبي) للدلالة على من ينفرد بالسلطة ويقهر المحكومين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَبِدّ"
    - lemma: "دِكْتَاتُور"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معاصر ضروري لشمولية المعجم، حيث صار الاسم الأشهر لهذا المفهوم في السياقات السياسية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دِكْتَاتُور", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "جَبَّار"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي قوي يدل على القهر والغلظة في ممارسة السلطة، ويوفر تنوعاً معجمياً للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "جَبَّار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "أي شخص يمارس السلطة بطريقة قاسية"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط؛ الأفضل صياغته بأسلوب معجمي يركز على الاستبداد والجور."
    authored:
      - type: terminological
        text: "حاكمٌ يَنْفَرِدُ بِالسُّلْطَةِ وَيُمَارِسُهَا بِظُلْمٍ وَتَعَسُّفٍ قَاهِراً لِلْمَحْكُومِينَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "حاكمٌ يَنْفَرِدُ بِالسُّلْطَةِ وَيُمَارِسُهَا بِظُلْمٍ وَتَعَسُّفٍ قَاهِراً لِلْمَحْكُومِينَ."}
  examples:
    per_lemma:
      - lemma: "طَاغِيَة"
        examples:
          - text: "عانت الشعوب طويلاً من ممارسات كل طاغية يرى نفسه فوق القانون."
            type: usage
      - lemma: "مُسْتَبِدّ"
        examples:
          - text: "المستبد يخاف من وعي الرعية أكثر من خوفه من أعدائه."
            type: usage
      - lemma: "دِكْتَاتُور"
        examples:
          - text: "سقط الدكتاتور بعد ثورة شعبية طالبت بالحرية والعدالة."
            type: usage
      - lemma: "جَبَّار"
        examples:
          - text: "﴿وَتِلْكَ عَادٌ جَحَدُوا بِآيَاتِ رَبِّهِمْ وَعَصَوْا رُسُلَهُ وَاتَّبَعُوا أَمْرَ كُلِّ جَبَّارٍ عَنِيدٍ﴾"
            type: quran
            source: "سورة هود، الآية ٥٩"

