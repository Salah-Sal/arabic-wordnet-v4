# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أناقة ورشاقة) بدون تشكيل كامل."
      - "رشاقة جذرها رشق (الرمي بخفة) ودلالته الأولى الحركة الجسدية والرشاقة البدنية، وتوظيفه لوصف البساطة العبقرية في الحلول العلمية تمطيطٌ دلاليٌّ يثير إشكالاً."
      - "التعريف الحالي يستخدم 'ترتيب' ترجمةً لـ neatness وهي غير دقيقة في السياق العلمي؛ إذ المقصود الإحكامُ والإيجاز لا مجرد الترتيب."
      - "المجموعة لا تحتوي سوى لمّتين، وإحداهما موضع تساؤل، مما يجعل التمثيل المعجمي شحيحاً."
    observations: >
      المجموعة تُمثِّل مفهوم 'الأناقة العلمية والرياضية' — وهي صفة تتحقق في الحلول والبراهين
      القائمة على البساطة العبقرية والإيجاز المحكم. أناقة من جذر (أ ن ق) يدل على الإعجاب والاستحسان،
      وهو الأصل الدلالي المناسب لأن الحل الأنيق يستثير الإعجاب. رشاقة من جذر (ر ش ق) يدل على
      الرمي بخفة، وامتداده للدلالة على البساطة العلمية مجازٌ بعيد يفتقر إلى التوثيق في المعاجم
      المتخصصة. المفهوم ذاته وافدٌ من الفكر الغربي (mathematical elegance) وإن كانت اللغة العربية
      تملك مادة لغوية صالحة للتعبير عنه.

  blind_candidates:
    - lemma: "لُطَافَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (ل ط ف) على وزن فُعَالة. يدل الجذر على الرفق والصغر والدقة. كشّاف اصطلاحات
        الفنون (التهانوي) يُدرج اللطافة مع المقابل الإنجليزي 'Elegance, subtlety, fineness'،
        مما يجعلها مرشحة معجمية للبساطة الدقيقة الرفيعة في الحلول.
    - lemma: "بَدَاعَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (ب د ع) على وزن فَعَالة. الجذر يدل على ابتداء الشيء دون مثال سابق (ابن فارس).
        البداعة تُمثِّل الجانب الابتكاري في الأناقة العلمية، إذ الحل الأنيق يكون في الغالب
        خلاقاً غير مسبوق.
    - lemma: "ظَرَافَة"
      generation_method: majaz
      justification: >
        من جذر (ظ ر ف) بمعنى البراعة وذكاء القلب (ابن فارس). الظرافة بالمجاز تُحيل على البراعة
        الذكية في الصياغة، ويمكن توسيعها للحل الذكي المُحكم، كما يشير التهانوي إلى ارتباطها
        بالملكة العقلية المنتجة للصياغات اللطيفة.
    - lemma: "سَلَاسَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (س ل س) على وزن فَعَالة. الجذر يدل على السهولة (ابن فارس). التهانوي يعرّفها بأنها
        غاية التناسق والتناسب في الكلمات والحروف دون أي تعقيد. هذا المعنى قابل للتوسع ليشمل
        الإيجاز الخالي من التعقيد في الحل العلمي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت:
# Q1: batch headword lookup — أناقة، رشاقة، لطافة، بداعة، ظرافة، سلاسة (+ ال-)
# Q2: English bridge — 'elegance', 'elegant', 'simplicity', 'neatness', 'mathematical elegance'
# Q3: Arabic FTS — 'اناقة', 'رشاقة', 'بساطة عبقرية'
# Q4: Enrichment by entry_id (820499, 820140, 47204, 13844, 534632, 685563, 819887, 875458)
# Q5: Ibn Faris — roots أنق، رشق، سلس، لطف، ظرف، بدع
stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "أناقة"
      confirm:
        - text: >
            «(1) أناقة (2) رشاقة (3) بساطة؛ دقة علميّة (4) شيء أنيق إلخ.»
          source: "المورد الحديث (2008) — مقابل لـ elegance"
        - text: >
            «(الأنق) الإعجابُ بالشيء، تقول أنِقتُ به، وأنا آنَقُ به أنَقاً، [وأنا به أنِق] أي: مُعجَب.
            وآنقني يُونقني إيناقاً. وشيءٌ أنيق ونباتٌ أنيق.»
          source: "مقاييس اللغة لابن فارس — مادة (أنق)"
        - text: >
            «ما يَجمَعُ بين البساطة والإيجاز والفعالية والدقة. من الناحية الأكاديمية للمعلوماتية:
            يُعدّ التصميمُ الأنيق (للبرامج والخوارزميات والعتاديات) ذا أولويّة.»
          source: "معجم مصطلحات المعلوماتية (2000) — مقابل لـ elegant"
        - text: >
            «(1) أناقة (2) أنيق: مطابق للزيّ الحديث.»
          source: "المورد الحديث (2008) — مقابل لـ chic"
      expands:
        - text: >
            «(الْهَمْزَةُ وَالنُّونُ وَالْقَافُ يَدُلُّ عَلَى أَصْلٍ وَاحِدٍ، وَهُوَ الْمُعْجِبُ
            وَالْإِعْجَابُ. قَالَ الْخَلِيلُ: الْأَنَقُ الْإِعْجَابُ بِالشَّيْءِ.)»
          source: "مقاييس اللغة — مادة (أنق)"
          addition: "الجذر يدل على الإعجاب والاستحسان، وهذا يؤصل دلالياً لأناقة الحل العلمي الذي يستثير الإعجاب."

    - lemma: "رشاقة"
      confirm:
        - text: >
            «(1) أناقة (2) رشاقة (3) بساطة؛ دقة علميّة (4) شيء أنيق إلخ.»
          source: "المورد الحديث (2008) — مقابل لـ elegance"
        - text: >
            «يَقَظة؛ انتباه؛ رشاقة.»
          source: "المورد الحديث (2008) — مقابل لـ alertness"
      contradicts:
        - text: >
            «(الرَّاءُ وَالشِّينُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ رَمْيُ الشَّيْءِ بِسَهْمٍ وَمَا
            أَشْبَهَهُ فِي خِفَّةٍ. فَالرَّشْقُ مَصْدَرُ رَشَقَهُ بِسَهْمٍ رَشْقًا. وَالرِّشْقُ: الْوَجْهُ
            مِنَ الرَّمْيِ.)»
          source: "مقاييس اللغة — مادة (رشق)"
          conflict: >
            الجذر رشق يدل على الرمي بخفة وحركة الجسد، لا على البساطة العبقرية في الحلول الذهنية.
            المورد الحديث يضع رشاقة ضمن مقابلات elegance لكنها المعنى العام (أناقة جسدية/حركية)
            لا المعنى التقني المحدد (دقة علمية)، وهذا المعنى الأخير مذكور صراحةً في البند الثالث
            المنفصل 'بساطة؛ دقة علميّة'.
      expands:
        - text: >
            «(1) خفة؛ رشاقة؛ نشاط (2) سرور؛ ابتهاج.»
          source: "المورد الحديث (2008) — مقابل لـ alacrity"
          addition: "تشير الشواهد إلى أن رشاقة تُستعمل بدلالة الخفة والنشاط والحركة لا الدقة العلمية."

    # ── المرشحات (المرحلة ١) ──────────────────────────────────

    - lemma: "لُطَافَة"
      confirm:
        - text: >
            «اللّطافة: [في الإنجليزية] Elegance, subtlety, fineness, lightness
            [في الفرنسية] Élégance, subtilité, finesse, légèreté — بالفتح يطلق على معان أربعة:
            الأول رقّة القوام أعني سهولة قبول الأشكال الغريبة وتركها... الثالث سرعة التأثّر عن الملاقي.
            الرابع الشفافية.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: >
            «(اللَّامُ وَالطَّاءُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى رِفْقٍ وَيَدُلُّ عَلَى صِغَرٍ فِي
            الشَّيْءِ. فَاللُّطْفُ: الرِّفْقُ فِي الْعَمَلِ.)»
          source: "مقاييس اللغة — مادة (لطف)"
      contradicts:
        - text: >
            «يطلق على معان أربعة: الأول رقّة القوام... الثاني قبول الانقسام إلى أجزاء صغيرة جداً...
            قال الأطباء اللطيف دواء من شأنه أن يتصغّر أجزاؤه عند فعل الحرارة الغريزية فيه.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            الاستعمال التقني للطافة في المصادر يتمحور حول الخصائص المادية (رقة القوام، قابلية الانقسام،
            الشفافية) لا حول البساطة العبقرية في الحلول الرياضية. المعنى الاصطلاحي المثبت لا يغطي
            المفهوم المطلوب.

    - lemma: "بَدَاعَة"
      expands:
        - text: >
            «(الْبَاءُ وَالدَّالُ وَالْعَيْنُ أَصْلَانِ: أَحَدُهُمَا ابْتِدَاءُ الشَّيْءِ وَصُنْعُهُ
            لَا عَنْ مِثَالٍ، وَالْآخَرُ الِانْقِطَاعُ وَالْكَلَالُ. فَالْأَوَّلُ قَوْلُهُمْ:
            أَبْدَعْتُ الشَّيْءَ قَوْلًا أَوْ فِعْلًا: إِذَا ابْتَدَأْتُهُ لَا عَنْ سَابِقِ مِثَالٍ.)»
          source: "مقاييس اللغة — مادة (بدع)"
          addition: "الجذر يدل على الابتداء بلا مثال، وهو يُمثل الجانب الإبداعي لا الجانب التبسيطي الإيجازي من الأناقة."
      evidence_status: "no_material_found"

    - lemma: "ظَرَافَة"
      confirm:
        - text: >
            «الظّرافة: [في الإنجليزية] Gracefulness, intelligence, beauty
            [في الفرنسية] Finesse, intelligence, beauté — والظرافة تطلق على الملكة التي تكون مبدأً
            لصدور الألفاظ التي لا تخلو عن ظرافة وإيهام... فمن له تلك الملكة يسمّى ظريفاً.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: >
            «(الظَّاءُ وَالرَّاءُ وَالْفَاءُ... ثُمَّ يُسَمُّونَ الْبَرَاعَةَ ظَرْفًا، وَذَكَاءَ
            الْقَلْبِ كَذَلِكَ. وَمَعْنَى ذَلِكَ أَنَّهُ وِعَاءٌ لِذَلِكَ. وَهُوَ ظَرِيفٌ.)»
          source: "مقاييس اللغة — مادة (ظرف)"
      contradicts:
        - text: >
            «الظرافة تطلق على الملكة التي تكون مبدأً لصدور الألفاظ التي لا تخلو عن ظرافة وإيهام.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            الظرافة مرتبطة بالبراعة اللغوية وذكاء القلب في الصياغة الأدبية، لا بالبساطة الإيجازية
            المحكمة في الحلول العلمية. وقد نبّه ابن فارس نفسه إلى أنه لا يحسب كثيراً من ذلك
            من كلام العرب الأصيل.

    - lemma: "سَلَاسَة"
      confirm:
        - text: >
            «السّلاسة: [في الإنجليزية] Fragility, simplicity or lightness of style
            [في الفرنسية] Fragilité, simplicité, légèreté du style — بالفتح هو مرادف للهشاشة...
            والسّلاسة لدى الشعراء هي أن يكون البيت من الشعر في غاية التناسق والتناسب من حيث
            الكلمات والحروف، بحيث لا يوجد فيها أيّ نوع من التعقيد من حيث اللفظ. وهذه هي
            السّلاسة في النظم، ويقاس عليها السّلاسة في النثر.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«سَلَاسةُ اللَّفْظ: سُهولته ورقَّتُه وانسجامُه. يقال: فى كلامه سَلَاسَةٌ»"
          source: "المعجم الكبير"
        - text: "«سلاسة اللفظ: سهولته ورقَّته وانسجامه»"
          source: "المعجم الوسيط"
        - text: >
            «(السِّينُ وَاللَّامُ وَالسِّينُ يَدُلُّ عَلَى سُهُولَةٍ فِي الشَّيْءِ. يُقَالُ هُوَ
            سَهْلٌ سَلِسٌ.)»
          source: "مقاييس اللغة — مادة (سلس)"
      contradicts:
        - text: "«سلاسة اللفظ: سهولته ورقَّته وانسجامه»"
          source: "المعجم الوسيط"
          conflict: >
            الاستعمال المعجمي المُثبت يقيّد سلاسة حصراً بالأسلوب اللغوي (اللفظ، النظم، النثر).
            لم يُثبت في المعاجم توظيفها لوصف خاصية الحلول العلمية والرياضية.


