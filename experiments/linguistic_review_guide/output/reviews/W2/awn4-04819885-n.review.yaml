# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "صفة الترتيب والبساطة العبقرية في حل مشكلة ما (خاصة في العلوم أو الرياضيات)"
    assessment:
      decision: revise
      reason: >
