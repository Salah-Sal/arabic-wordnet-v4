stage1_review:
  assessment:
    concerns:
      - "خلو اللمة الحالية 'تزجج' من التشكيل، مما قد يسبب لبساً مع 'تَزْجِيج' الذي يفيد التعدية."
    observations: "التعريف يعبر عن الصيرورة والتحول الذاتي (intransitive)، والصيغة الصرفية الأدق لذلك هي 'تَفَعُّل' أي 'تَزَجُّج'. اللمة الحالية صحيحة ومناسبة تماماً ولكن ينقصها الضبط بالشكل."
  blind_candidates:
    - lemma: "تَزَجُّج"
      generation_method: ishtiqaq
      justification: "مصدر للفعل 'تزجج' على وزن تفعّل، ويدل على المطاوعة والصيرورة، وهو مطابق لمعنى التحول الذاتي إلى زجاج."
    - lemma: "تَزْجِيج"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تفعيل، ويستخدم غالباً للدلالة على عملية التحويل إلى زجاج (التعدية)."
    - lemma: "اِسْتِزْجَاج"
      generation_method: ishtiqaq
      justification: "مشتق على وزن استفعال الذي من معانيه التحول والصيرورة."
    - lemma: "تَحَوُّل زُجَاجِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر بشكل مباشر عن معنى التحول إلى الحالة الزجاجية."

stage2_evidence:
  per_lemma:
    - lemma: "تزجج"
      confirm:
        - text: "تحول المادة المتبلورة إلى زجاج"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "vitrification: (1) تزجيج (2) تزجُّج."
          source: "المورد الحديث (2008)"
    - lemma: "تَزَجُّج"
      confirm:
        - text: "تحول المادة المتبلورة إلى زجاج"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "vitrification: (1) تزجيج (2) تزجُّج."
          source: "المورد الحديث (2008)"
    - lemma: "تَزْجِيج"
      confirm:
        - text: "تكنولوجيا تستخدم لمعالجة بعض النفايات الخطيرة... في درجات حرارة عالية مع إضافة مواد زجاجية"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      contradicts:
        - text: "vitrification"
          source: "المورد الحديث (2008)"
          conflict: "يدل على التعدية (فعل فاعل، أي تحويل شيء إلى زجاج) وليس التحول الذاتي (becoming) المقصود في المجموعة."
    - lemma: "اِسْتِزْجَاج"
      evidence_status: "no_material_found"
    - lemma: "تَحَوُّل زُجَاجِيّ"
      confirm:
        - text: "vitrification: التحول إلى حالة زجاجية"
          source: "AGROVOC"

stage3_analysis:
  per_lemma:
    - lemma: "تزجج"
      decision: confirmed
      decision_reason: "اللمة صحيحة دلالياً وتعبر بدقة عن عملية الصيرورة والتحول إلى زجاج، وتحتاج فقط إلى ضبط بالشكل لتصبح 'تَزَجُّج'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَزَجُّج"
    - lemma: "تَزَجُّج"
      source: stage1
      decision: removed
      decision_reason: "مطابقة للمة الموجودة في المجموعة بعد ضبطها بالشكل، لذا نكتفي باللمة الأصلية."
    - lemma: "تَزْجِيج"
      source: stage1
      decision: removed
      decision_reason: "تدل صيغة 'تفعيل' على التعدية (أي تحويل شيء آخر إلى زجاج)، بينما المجموعة الترادفية تخص التحول الذاتي (becoming)."
    - lemma: "اِسْتِزْجَاج"
      source: stage1
      decision: removed
      decision_reason: "لم يرد لها شواهد معجمية، وتُغني عنها اللمة الفصيحة 'تزجج'."
    - lemma: "تَحَوُّل زُجَاجِيّ"
      source: stage1
      decision: removed
      decision_reason: "تركيب حر وليس مصطلحاً مسكوكاً بالضرورة، والكلمة المفردة 'تزجج' أوجز وأوفى بالمعنى وأكثر شيوعاً."

stage4_content:
  definition:
    current: "عملية التحول إلى زجاج"
    assessment:
      decision: revise
      reason: "تطوير التعريف ليكون أكثر دقة وشمولية للحالة الزجاجية بصياغة معجمية رصينة."
    authored:
      - type: terminological
        text: "عملية تحول المادة إلى زجاج أو إلى حالة زجاجية تتسم بالشفافية والصلابة وانعدام التبلور."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13595008-n"
          definition_index: 0
          text: "عملية تحول المادة إلى زجاج أو إلى حالة زجاجية تتسم بالشفافية والصلابة وانعدام التبلور."
  examples:
    per_lemma:
      - lemma: "تزجج"
        examples:
          - text: "يحدث تَزَجُّج الرمال عند تعرضها لدرجات حرارة هائلة نتيجة الصواعق أو الانفجارات."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-13595008-n"
          text: "يحدث تَزَجُّج الرمال عند تعرضها لدرجات حرارة هائلة نتيجة الصواعق أو الانفجارات."
      - command: add_sense_example
