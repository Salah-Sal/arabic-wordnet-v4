stage1_review:
  assessment:
    concerns:
      - "المصطلح (مُبَدِّر) مشتق من الكلمة المعربة الدخيلة (بودرة) ولم يرد في المعاجم القديمة بهذا المعنى."
      - "(نَاثِر الْمَسْحُوق) عبارة وصفية (مركب إضافي) وليست مصطلحاً مسكوكاً مفرداً."
    observations: "المفهوم يشير إلى من يقوم بنثر مسحوق دقيق، سواء في مجال التجميل أو غيره. في العربية الفصحى، الفعل المعبر عن ذلك هو (ذَرَّ) ومنه (ذَرور). اشتقاق (مبدر) حديث ومقبول لتخصيصه لمسحوق التجميل."
  blind_candidates:
    - lemma: "ذَرَّار"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة أو حرفة على وزن فَعَّال من الفعل (ذَرَّ) الذي يدل على نثر الأشياء الدقيقة."
    - lemma: "نَاثِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل نثر، وهو المباشر للعملية المذكورة."
    - lemma: "رَاشّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رشّ، وهو قريب من النثر وإن كان يغلب على السوائل."
    - lemma: "مُبَدِّر"
      generation_method: taarib
      justification: "اشتقاق حديث من الكلمة المعربة (بودرة) للدلالة على من يضعها."

stage2_evidence:
  per_lemma:
    - lemma: "مُبَدِّر"
      evidence_status: no_material_found
    - lemma: "نَاثِر الْمَسْحُوق"
      evidence_status: no_material_found
    - lemma: "ذَرَّار"
      evidence_status: no_material_found
    - lemma: "نَاثِر"
      contradicts:
        - text: "مَن يجيد الكتابة نثرًا"
          source: "المعجم الوسيط"
          conflict: "الكلمة مخصصة لمعنى الكاتب بالنثر ولا تستخدم منفردة لمن ينثر المسحوق."
    - lemma: "رَاشّ"
      contradicts:
        - text: "الطائر ريشاً : نبت ريشُه ... المرضُ فلاناً : أضعفه"
          source: "المعجم الوسيط"
          conflict: "المعاني تتعلق بالريش أو الضعف ولا علاقة لها بنثر المسحوق الدقيق."

stage3_analysis:
  per_lemma:
    - lemma: "مُبَدِّر"
      decision: confirmed
      decision_reason: "اشتقاق حديث سليم من الكلمة المعربة الشائعة (بودرة) على وزن مُفعِّل لمن يقوم بالعملية، وهو دقيق في سياقات التجميل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُبَدِّر"
    - lemma: "نَاثِر الْمَسْحُوق"
      decision: confirmed
      decision_reason: "تعبير تركيبي إضافي يصف المعنى بدقة وبشكل عام، ومقبول كونه يسد الفجوة المعجمية للكلمة الأجنبية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَاثِر الْمَسْحُوق"
    - lemma: "ذَرَّار"
      source: stage1
      decision: confirmed
      decision_reason: "لفظة فصيحة على وزن فَعَّال من الجذر (ذرر) الذي يدل على نثر الأشياء الدقيقة (كالذرور والملح)، وهي الأنسب والأكثر أصالة للتعبير عن المفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "ذَرَّار"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10480735-n"
    - lemma: "نَاثِر"
      source: stage1
      decision: removed
      decision_reason: "لأنها تدل على كاتب النثر، ولا تستعمل منفردة لهذا المفهوم."
      evidence_assessment:
        case: contradicts_only
    - lemma: "رَاشّ"
      source: stage1
      decision: removed
      decision_reason: "لأنها تتعلق بالريش أو الضعف معجمياً، وفي الاستعمال تدل على رش السوائل وليس نثراً للمساحيق."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "شخص يضع أو ينثر المسحوق (البودرة)"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويشمل وضع المسحوق للتجميل أو نثره لأغراض أخرى (صناعية أو زراعية)."
  examples:
    per_lemma:
      - lemma: "مُبَدِّر"
        examples:
          - text: "قام المُبَدِّرُ بتجهيز وجوه الممثلين قبل بدء العرض المسرحي."
            type: usage
      - lemma: "نَاثِر الْمَسْحُوق"
        examples:
          - text: "يعمل نَاثِرُ الْمَسْحُوقِ في المصنع على تغطية الألواح المعدنية بطبقة واقية."
            type: usage
      - lemma: "ذَرَّار"
        examples:
          - text: "استخدم الذَّرَّارُ مسحوقاً خاصاً لحماية المحاصيل من الآفات."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "قام المُبَدِّرُ بتجهيز وجوه الممثلين قبل بدء العرض المسرحي."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يعمل نَاثِرُ الْمَسْحُوقِ في المصنع على تغطية الألواح المعدنية بطبقة واقية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "استخدم الذَّرَّارُ مسحوقاً خاصاً لحماية المحاصيل من الآفات."

stage5_enrichment:
  per_entry:
