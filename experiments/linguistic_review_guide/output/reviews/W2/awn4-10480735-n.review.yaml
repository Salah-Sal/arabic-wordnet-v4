        - word: "الْمَسْحُوق"
          root: "سحق"
          maqayis_quote: "«(سَحَقَ) السِّينُ وَالْحَاءُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا الْبُعْدُ، وَالْآخَرُ إِنْهَاكُ الشَّيْءِ حَتَّى يَبْلُغَ بِهِ إِلَى حَالِ الْبِلَى.»"
