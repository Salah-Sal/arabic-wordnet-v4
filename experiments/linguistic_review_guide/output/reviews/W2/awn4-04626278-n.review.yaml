stage4_content:
  definition:
    current: "مجموعة الصفات التي تجعل الشخص جذاباً اجتماعياً"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط ويحتاج إلى صياغة معجمية أكثر دقة وشمولاً."
    authored:
      - type: terminological
        text: "مجموعة السّمات النفسيّة والشكليّة التي تمنح الفرد حضوراً محبّباً وتجعله مقبولاً ومؤثّراً في الآخرين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-04626278-n", definition_index: 0, text: "مجموعة السّمات النفسيّة والشكليّة التي تمنح الفرد حضوراً محبّباً وتجعله مقبولاً ومؤثّراً في الآخرين."}
  examples:
    per_lemma:
      - lemma: "جَاذِبِيَّة"
        examples:
          - text: "يتمتع هذا المحاضر بجاذبية طبيعية تأسر الحاضرين."
            type: usage
      - lemma: "قَبُول"
        examples:
          - text: "ألقى الله عليه القبول فصار محبوباً عند كل من يراه."
            type: usage
      - lemma: "حُسْنُ السَّمْتِ"
        examples:
          - text: "عُرف العالم بحسن السمت والوقار في مجلسه."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-04626278-n", text: "تمتلك تلك الشخصية كاريزما تجعل الناس يلتفون حولها في كل محفل."}

