stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى الألفاظ المفردة القوية التي تعبّر عن المفهوم (مثل: قبول، ملاحة)."
      - "اللمّة 'جاذبية شخصية' هي عبارة وصفية (MWE) بينما توجد بدائل معجمية أصيلة."
    observations: "المفهوم يدور حول السحر الشخصي والقبول الاجتماعي، وهو مفهوم متجذر في الثقافة العربية تحت مسمى 'القبول' أو 'الملاحة' أو 'حسن السمت'."
  blind_candidates:
    - lemma: "جَاذِبِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من 'جذب'، وهي الحالة التي يستمال بها الآخرون."
    - lemma: "كَارِيزْمَا"
      generation_method: taarib
      justification: "المصطلح المعاصر الأكثر شيوعاً للتعبير عن الجاذبية الشخصية الطاغية."
    - lemma: "حُسْنُ المَعْشَر"
      generation_method: tarkib
      justification: "تعبير تراثي يدل على طيب التعامل الذي يجعل الشخص جذاباً اجتماعياً."
    - lemma: "قَبُول"
      generation_method: majaz
      justification: "لفظ عربي أصيل يطلق على محبة الناس للشخص ورضاهم عنه."

stage2_evidence:
  per_lemma:
    - lemma: "جاذبية شخصية"
      evidence_status: "no_material_found"
    - lemma: "حسن السمت"
      confirm:
        - text: "«يُقَالُ إِنَّ فُلَانًا لَحَسَنُ السَّمْتِ، إِذَا كَانَ مُسْتَقِيمَ الطَّرِيقَةِ مُتَحَرِّيًا لِفِعْلِ الْخَيْرِ.»"
          source: "مقاييس اللغة"
        - text: "«حسن السمت: محبة ما يكمل النفس.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "جَاذِبِيَّة"
      confirm:
        - text: "«(الجاذبية) الْحَالة الَّتِي يجذب بهَا صَاحبهَا غَيره يُقَال فلَان لَهُ جاذبية يستميل غَيره إِلَيْهِ.»"
          source: "المعجم الوسيط"
    - lemma: "قَبُول"
      confirm:
        - text: "«(الْقبُول) الرِّضَا بالشَّيْء وميل النَّفس إِلَيْهِ وَالْحسن والشارة.»"
          source: "المعجم الوسيط"
        - text: "«يتمتع بالقبول بين الناس.»"
          source: "معجم الصواب اللغوي"
    - lemma: "مَلَاحَة"
      confirm:
        - text: "«مَلَاحَة: الجمال وحسن المظهر.»"
          source: "موسوعة السلطان قابوس"
        - text: "«مَلُحَ الشَّيْءُ مَلَاحَةً وَمِلْحًا... مَلِيح.»"
          source: "مقاييس اللغة"
    - lemma: "لَبَاقَة"
      confirm:
        - text: "«اللَّبِقُ: الْحَاذِقُ بِالشَّيْءِ يَعْمَلُهُ... وَالْمَصْدَرُ اللَّبَاقَةُ.»"
          source: "مقاييس اللغة"
    - lemma: "كَارِيزْمَا"
      confirm:
        - text: "«(3) جاذبية؛ فتنة the charisma of popular actors.»"
          source: "المورد الحديث"

