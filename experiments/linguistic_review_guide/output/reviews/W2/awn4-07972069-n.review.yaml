          root: "متن"
          maqayis_quote: "«الْمِيمُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى صَلَابَةٍ فِي الشَّيْءِ مَعَ امْتِدَادٍ وَطُولٍ.»"
        - word: "لغوي"
          root: "لغو"
          maqayis_quote: "«اللَّامُ وَالْغَيْنُ وَالْوَاوُ كَلِمَةٌ تَدُلُّ عَلَى الشَّيْءِ لَا يُعْتَدُّ بِهِ... وَاللُّغَةُ مِنَ النُّطْقِ.»"
