# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة الموجودة (براهمة) هي بصيغة الجمع، بينما المصطلحات الإنجليزية المقابلة (Brahman, Brahmin) هي بصيغة المفرد."
      - "غياب اللمات المفردة المعربة أو المشتقة التي تمثل الفرد المنتمي لهذه الطبقة."
    observations: "المصطلح يشير إلى أعلى الطبقات الاجتماعية والدينية في الهندوسية (الفارنا). الكلمة معربة عن السنسكريتية (Brahmana)، ولها حضور في المعاجم العربية القديمة (مثل العين ولسان العرب) تحت لفظ (برهمن) بوصفهم علماء وعُبّاد الهند، وفي المعاجم الحديثة تحت لفظ (براهمة)."
  blind_candidates:
    - lemma: "بَرَاهِمَة"
      generation_method: taarib
      justification: "الجمع الشائع والمستقر في العربية للإشارة إلى هذه الطبقة الكهنوتية."
    - lemma: "بَرْهَمِيّ"
      generation_method: ishtiqaq
      justification: "الاسم المنسوب المفرد للدلالة على الفرد المنتمي لهذه الطبقة."
    - lemma: "بَرْهَمَن"
      generation_method: taarib
      justification: "اللفظ الأصيل المعرب كما ورد في المعاجم العربية القديمة."
    - lemma: "الطَّبَقَةُ الْبَرْهَمِيَّةُ"
      generation_method: tarkib
      justification: "تعبير وصفي دقيق يشير إلى المفهوم الاجتماعي للفئة."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "براهمة"
      confirm:
        - text: "«إحدى طوائف المجتمع الهندىّ الأَرْبعة... والبراهمة أَرْقَى هذه الطوائف، وهم رجال الدين»"
          source: "المعجم الكبير"
        - text: "«(البراهمة) طَائِفَة من الهنود... واحدهم برهمي»"
          source: "المعجم الوسيط"
        - text: "«بَراهِمَة [جمع]: مف بَرْهَميّ: (دن) مَنْ يؤمنون بالديانة البرهمانيّة»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "بَرْهَمِيّ"
      confirm:
        - text: "«واحدهم برهمي»"
          source: "المعجم الوسيط"
        - text: "«البَرَهميّ: أحد أفراد طبقة الكهنوت العليا عند الهندوس»"
          source: "المورد الحديث"
    - lemma: "بَرْهَمَن"
      confirm:
        - text: "«البُرَهْمِنُ: العالِم، بالسُّمَنِيَّة»"
          source: "لسان العرب"
        - text: "«البَرَهْمَنُ بالسمنية: عالمهم وعابدهم»"
          source: "كتاب العين"
    - lemma: "الطَّبَقَةُ الْبَرْهَمِيَّةُ"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "براهمة"
      decision: confirmed
      decision_reason: "الجمع المستقر والمستعمل بكثرة في المراجع العربية للإشارة إلى هذه الطبقة الاجتماعية، وهو موافق للتعريف بوصفها (فئة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَرَاهِمَة"
    - lemma: "بَرْهَمِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "الاسم المفرد المنسوب، وهو ضروري لمطابقة اللمات الإنجليزية (Brahman/Brahmin) وتسهيل الاشتقاق والاستعمال الوصفي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بَرْهَمِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08323889-n"}
    - lemma: "بَرْهَمَن"
      source: stage1
      decision: confirmed
      decision_reason: "اللفظ المعرب الأصيل الذي حافظت عليه المعاجم العربية القديمة، ويستخدم في السياقات الفلسفية والتاريخية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بَرْهَمَن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08323889-n"}
    - lemma: "الطَّبَقَةُ الْبَرْهَمِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر (free phrase) يمكن فهمه من مكوناته، ولا حاجة لتثبيته كمدخل معجمي مستقل في ظل وجود المفرد والجمع."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "أعلى الطبقات الأربع: الفئة الكهنوتية"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويفتقر للنسبة الثقافية والجنس القريب الواضح."
    authored:
      - type: terminological
        text: "إحدى الطبقات الأربع (الفارنا) في النظام الاجتماعي والديني الهندوسي، وهي الطبقة العليا التي تتكون من الكهنة والعلماء والمعلمين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08323889-n", definition_index: 0, text: "إحدى الطبقات الأربع (الفارنا) في النظام الاجتماعي والديني الهندوسي، وهي الطبقة العليا التي تتكون من الكهنة والعلماء والمعلمين."}

  examples:
    per_lemma:
      - lemma: "بَرَاهِمَة"
        examples:
          - text: "يحتكر البراهمة في المجتمع الهندوسي التقليدي وظائف التدريس وإقامة الشعائر الدينية."
            type: usage
      - lemma: "بَرْهَمِيّ"
        examples:
          - text: "لا يجوز لأي فرد من خارج هذه الطبقة أن يمارس طقوس الكاهن البرهميّ."
            type: usage
      - lemma: "بَرْهَمَن"
        examples:
          - text: "ذكر الخليل في العين أن البرهمن هو عالم السمنية وعابدها."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-08323889-n", text: "تعتبر طبقة البراهمة أسمى الطبقات الاجتماعية في الهند القديمة وفقاً لنصوص الفيدا."}

