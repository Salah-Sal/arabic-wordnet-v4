            (3) لغة الأنجلوسكسون. (4) اللغة الإنكليزية. (5) أنجلوسكسونيّ. (6) إنكليزيّ»
          source: "المورد الحديث (2008)، entry_id=670314، translation_en='Anglo-Saxon'"
          conflict: >
            المدخل يكشف أن «الأنجلوسكسونيّة» تُشير في أصلها إلى الهوية الإثنية التاريخية (Anglo-Saxon) لا إلى
