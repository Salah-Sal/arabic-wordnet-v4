      generation_method: ishtiqaq
      justification: >
        قياساً على المصدر الصناعي من النسبة (-iyya): عُرُوبَة وبَدَوِيَّة ورُومِيَّة ويَهُودِيَّة — يُشتقّ من الصفة النسبيّة
        «إِنْجِلِيزِيّ» بإلحاق التاء المربوطة، فيصير المصدر الصناعي «إِنْجِلِيزِيَّة» دالاً على الخاصيّة المجردة لكون الشيء
        إنجليزياً. الوزن منتج ومطّرد في العربية المعاصرة لتحويل النسب القومية إلى مفاهيم مجردة.
    - lemma: "أَنْجَلُوسَكْسُونِيَّة"
      generation_method: majaz
      justification: >
        إحياء للفظ إثني تاريخي بالإزاحة الدلالية؛ «الأنجلوسكسونية» أصلها وصف للقبائل الجرمانية التي شكّلت إنجلترا، فاستُعملت
        مجازاً للدلالة على الطابع الإنجليزي الأصيل العريق. تجنّب الكلمة الحيّة «الإنجليزية» (المشتركة مع اللغة) يُزيل الاشتراك
        اللفظي المحتمل.
    - lemma: "الطَّابَعُ الإِنْجِلِيزِيُّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي (wasfi) يُوظّف لفظ «الطَّابَع» (الخُلُق الغالب والسجيّة) مضافاً إلى الوصف «الإِنْجِلِيزِيّ». الطابع في
        العربية يُعبّر عن الخاصيّة المميّزة الجوهريّة لشيء ما، مما يجعله مرادفاً وصفياً طبيعياً لمفهوم «كون الشيء إنجليزياً».
    - lemma: "الهُوِيَّةُ الإِنْجِلِيزِيَّةُ"
      generation_method: tarkib
      justification: >
        مركّب إضافي (idafi) يجمع «الهُوِيَّة» (الجوهر المميّز والانتماء الكيانيّ) و«الإِنْجِلِيزِيَّة»، مُعبِّراً عن خاصيّة
        الانتماء إلى الثقافة الإنجليزية بوصفها هوية شاملة وليس مجرّد سِمة.


