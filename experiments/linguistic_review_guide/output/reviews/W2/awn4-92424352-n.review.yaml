      - "المجموعة لا تحمل معرّف ILI (ili: null) — غياب الربط بالشبكة الدلالية العالمية يُعيق التوافق التبادلي مع الشبكات الأخرى."
      - "اللمّة الوحيدة 'الطابع الإنجليزي' مركبٌ وصفيٌّ (MWE) يفتقر إلى التثبيت المعجمي كوحدة اصطلاحية ثابتة — يجتاز اختبار الوصف لا اختبار السكّ."
      - "التعريف الحالي ترجمة حرفية آلية من الإنجليزية ('state or quality of being English') ولا يتبع أسلوب المعجم الوسيط في الجنس القريب والفصل النوعي."
      - "اللمّة الموجودة خالية من التشكيل الكامل — يجب ضبطها."
      - "المجموعة تفتقر إلى لمّة مفردة (single-word lemma) للمفهوم المجرد 'إنجليزية' رغم إمكانية اشتقاقها قياساً."
    observations: >
      تمثّل هذه المجموعة مفهوم «الإنجليزية» بوصفها خاصيّةً جوهريّةً، وهو مفهوم تجريدي يتبع نمط المصادر الصناعية للنسب القومية
      (كـ «عُرُوبَة» و«رُومِيَّة» و«يَهُودِيَّة»). الاعتماد على مركّب وصفي واحد (الطابع الإنجليزي) دون لمّة مفردة يُخلّ بالتوازن
      المعجمي. وقد أفضى الاستعلام إلى اكتشاف مدخل في المورد الحديث (2008) هو «الإنكليزيانية» بمعنى «عادة أو سِمة خاصة بالإنكليز»
      مما يعزّز صحة المفهوم ويقترح نمطاً صرفياً أكثر تخصيصاً. المجموعة تقع تحت مُشترَك أعلى «خَاصِّيَّة جَوْهَرِيَّة» وهو مناسب.

  blind_candidates:
