      decision_reason: >
        المصدر الصناعي من النسبة (-iyya) وزنٌ صرفيٌّ منتجٌ مُطَّرِد في العربية المعاصرة لتحويل الصفات القومية إلى
        مفاهيم مجردة: عُرُوبَة، بَدَوِيَّة، رُومِيَّة، فَارِسِيَّة. «إِنْجِلِيزِيَّة» تجتاز اختبار السكّ (وحدة غير
        قابلة للتجزئة المعنوية)، وتقبل لام التعريف والنسبة والجمع. الأدلّة — رغم غيابها مباشرةً — تؤيّد النمط إذ أثبت
        المورد الحديث مصطلح «الإنكليزيانية» بسِمَةٍ معنوية مماثلة. «إِنْجِلِيزِيَّة» أبسط وأقيس وأكثر قابلية للتوارد
        في النصوص الأكاديمية العربية الفصيحة.
      evidence_assessment:
        case: no_material
      mwe_check:
