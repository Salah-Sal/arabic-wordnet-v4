          source: "المعجم الوسيط (مجمع اللغة العربية، OCR)"
        - text: >
            «الطَّابِعُ: العَلَامَةُ المُمَيِّزَةُ. والطَّابَعُ: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ»
          source: "المعجم الكبير (مجمع اللغة العربية، OCR)"
        - text: >
            «طَابَع: الخلق الغالب وما يطبع به أو يختم»
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani)"
      expands:
        - text: >
            «الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ مَثَلٌ عَلَى نِهَايَةٍ يَنْتَهِي إِلَيْهَا الشَّيْءُ
            حَتَّى يُخْتَمَ عِنْدَهَا... ثُمَّ يُقَالُ عَلَى هَذَا: طَبْعُ الْإِنْسَانِ وَسَجِيَّتُهُ»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151، entry_id=987501)"
          addition: >
            الجذر (طبع) يدلّ على الختم والاكتمال، ومن ثَمَّ انتقل معنياه إلى الخُلُق والسجيّة — مما يعزّز دلالة «الطابع»
            على الخاصيّة الجوهرية المميّزة لشيء ما.

    - lemma: "إِنْجِلِيزِيَّة"
      expands:
        - text: >
            «الإنكليزيانية: «أ» اصطلاح لغويٌّ إنكليزي. «ب» عادةٌ أو سِمةٌ خاصّةٌ بالإنكليز.
            «ج» التعلُّق بالعادات أو الأفكار الإنكليزية»
          source: "المورد الحديث (2008)، entry_id=670301، translation_en='anglicism'"
          addition: >
            المدخل يُثبت وجود مصطلح عربي لمفهوم «السمة الخاصة بالإنكليز» (sense «ب»)، وهو جوهر المجموعة الدلالية.
            استُخدم فيه الوزن (-يانيّة) للتعبير عن الانتماء الثقافي-الأيديولوجي. الصيغة بـ(إنكليزي) لهجية شامية؛
            مقابلها الفصيح الأعمّ «إِنْجِلِيزِيَّة».
      evidence_status: no_material_found

    - lemma: "أَنْجَلُوسَكْسُونِيَّة"
      contradicts:
