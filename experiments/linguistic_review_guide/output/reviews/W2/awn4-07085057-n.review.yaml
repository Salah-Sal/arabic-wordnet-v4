# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (رطانة، لغة اصطلاحية) خاليتان من التشكيل الكامل"
      - "التعريف الحالي يستخدم 'مميزة' التي قد تُوهم معنى التفضيل، والأدق 'تتسم بها' أو 'تتميز بها'"
      - "التعريف يقصر وصف المصطلحات على 'موضوع معين' متجاهلاً بُعد الجماعة والحرفة المهنية الذي هو جوهر مفهوم الـ jargon"
      - "'لغة اصطلاحية' تعبير مركب يحتاج توثيق حالة التعبير الاصطلاحي الثابت (MWE)"
    observations: >-
      المجموعة تُعنى بمفهوم 'المصطلحات التخصصية الخاصة بمجال أو جماعة مهنية'، وهو ما
      يقابل الـ jargon الإنجليزية. اللمّة 'رطانة' راسخة في التراث العربي بمعنى الكلام
      الأعجمي غير المفهوم، وقد تطوّرت دلالتها في المعجم المعاصر لتشمل كل لغة خاصة
      بجماعة أو حرفة. واللمّة 'لغة اصطلاحية' هي تعبير وصفي مركب (وصفي) يُترجم مفهوم
      jargon في المعجمية الحديثة. تتكامل اللمّتان دلالياً: الأولى تحمل ظلالاً من
      الغرابة والإغماض الأصيل، والثانية محايدة أكاديمياً.
  blind_candidates:
    - lemma: "مُصطَلَحِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من 'مُصطَلَح' على وزن (-ية)، للدلالة على مجموع المصطلحات التقنية
        الخاصة بعلم أو حقل معين، قياسًا على 'اصطلاحية' و'مفهومية'؛ يُعبّر عن المنظومة
        المصطلحية ككيان واحد مميِّز لحقل بعينه.
    - lemma: "لُغَةُ المِهْنَةِ"
      generation_method: tarkib
      justification: >-
        مركب إضافي (لغة + المهنة) يصف مباشرةً اللغة الخاصة بمهنة أو حرفة بعينها؛
        تركيب إضافي مقيس يستعمله علماء اللسانيات التطبيقية للدلالة على السجل اللغوي
        المهني المتخصص.
    - lemma: "حِرَفِيَّة"
      generation_method: majaz
      justification: >-
        من 'حِرْفَة' (الصنعة والمهنة) بإزاحة دلالية لتعبّر عن اللغة الخاصة بأهل حرفة
        ما؛ يُحيي الربط الوثيق بين المهنة ومصطلحاتها الخاصة، وهو مجاز وظيفي قائم على
        المشابهة: الحرفة تنتج لغتها كما تنتج منتجها.
    - lemma: "تَخَصُّصِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من 'تَخَصُّص' على وزن (-ية)، للدلالة على منظومة المصطلحات
        المتخصصة المميِّزة لمجال بعينه؛ يُبرز خاصية التخصص والانفراد بدلالة المصطلح.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "رطانة"
      confirm:
        - text: "«مجموعة العبارات والتراكيب التي تتميز بها طائفة من الناس يعملون في حرفة واحدة»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«لهجة ذات مفردات خاصة يتكلمها ناس ذوو حرفة مشتركة، مثل رطانة عمال سكة الحديد أو رطانة عمال النظافة»"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«أسلوب غريب، يدور داخل جماعة سوسيو-ثقافية، كلغة تميز الحقل والجماعة عبر حوار صوت لغوي واحد لا يفهمه إلا أصحابه»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ALECSO، 2002)"
        - text: "«لغة خاص ينفرد بها أفراد مهنة ما أو نشاط معين»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
      expands:
        - text: "«الكلام الأَعجمي، أو بكلام لا يفهمه الجمهور، وإنما هو مواضعة بين اثنين أو جماعة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: >-
            يُبيّن البُعد الأصلي الكلاسيكي للكلمة (الكلام الأعجمي) ومعناها المتطوّر
            (الكلام الخاص الذي لا يفهمه الجمهور)؛ يُثبت التطور الدلالي من 'الأعجمية'
            إلى 'المواضعة الخاصة'.
        - text: "«الرَّاءُ وَالطَّاءُ وَالنُّونُ بِنَاءٌ لَيْسَ بِالْمُحْكَمِ وَلَا لَهُ قِيَاسٌ فِي كَلَامِهِمْ، إِلَّا أَنَّهُمْ يَقُولُونَ: تَرَاطَنُوا، إِذَا أَتَوْا بِكَلَامٍ لَا يُفْهَمُ; وَيُخَصُّ بِذَلِكَ الْعَجَمُ. قَالَ: فَأَثَارَ فَارِطُهُمْ غَطَاطًا جُثَّمًا ... أَصْوَاتُهُ كَتَرَاطُنِ الْفُرْسِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            يكشف أن ابن فارس يعدّ الجذر رطن من الأبنية غير المحكمة (غير القياسية)، غير
            أن المادة أُثبتت بمعنى واضح: الكلام غير المفهوم الخاص بالعجم. البيت الشعري
            يُقرن أصوات الطيور بتراطن الفرس مما يُعمّق ظلّ الغرابة والإغماض.
        - text: "«لغة خاصة مستعملة في عشيرة هامشية لا تحاول الاندماج في المجتمع وتسعى إلى الظهور بمظهر مختلف عن عامة الناس»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ALECSO، 2002)"
          addition: >-
            يُبرز بُعدًا اجتماعيًا للرطانة يتجاوز التخصص التقني إلى الهوية الجماعية
            والتمايز الاجتماعي، مما يُوسّع دلالة المجموعة ليشمل Argot بجانب Jargon.

    - lemma: "لغة اصطلاحية"
      confirm:
        - text: "«(2) اللغة الاصطلاحية لجماعة ما medical jargon»"
          source: "المورد الحديث (2008)"
      expands:
        - text: >-
            «(1) الرَّطانة: «ب» لغة مضطربة غير مفهومة. «ج» لغة أو لهجة غريبة.
            «د» لغة أو لهجة هجينة مبسَّطة تستعمل للتفاهم بين الناطقين بلغات مختلفة
            (2) اللغة الاصطلاحية لجماعة ما medical jargon
            (3) الجعجعة: كلام مُبْهَم موسومٌ بالتباهي والإطناب»"
          source: "المورد الحديث (2008)"
          addition: >-
            يُوضح أن المورد الحديث يُفرّق بين 'رطانة' (بمعانيها السلبية المائلة للغموض
            والتشويش) و'اللغة الاصطلاحية لجماعة ما' (بالمعنى المحايد التقني للـ jargon
            الاصطلاحي)؛ التفريق ذاته يُثبت ضرورة الإبقاء على اللمّتين معًا.

    - lemma: "مُصطَلَحِيَّة"
      contradicts:
        - text: "«عِلْم المصطلح، مُصْطَلَحِيَة: دراسة علمية لتسمية المفاهيم التي تنتمي إلى ميادين مختصة ووظيفية من النشاط البشري»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ALECSO، 2002)"
          conflict: >-
            المصطلحية في الاستعمال المعجمي الموثَّق تعني 'علم المصطلح'
            (Terminology as a discipline) لا 'الرطانة أو اللغة التخصصية الخاصة بجماعة'.
        - text: "«مصطلحية، علم المصطلح: علم دراسة الاصطلاحات وتحديد وظائفها كنمط خاص من العلامات»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ALECSO، 2002)"
          conflict: >-
            تأكيد إضافي: المصطلحية ترجمة لـ 'Terminology' (العلم والدراسة) لا لـ 'Jargon'
            (مجموعة المصطلحات التخصصية لجماعة).

    - lemma: "لُغَةُ المِهْنَةِ"
      evidence_status: "no_material_found"

    - lemma: "حِرَفِيَّة"
      contradicts:
        - text: "«حرفية: مذهب حرفي» | translation_en: corporatism"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "المعنى المسجَّل هو 'Corporatism' (مذهب سياسي-اقتصادي)، لا علاقة له بالمصطلحات التخصصية."
        - text: "«حرفية: تركيب نص بمساعدة حروف رصاصية، تخلت عن وظيفتها لصالح التركيب الفوتوغرافي» | translation_en: typography"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: >-
            في مجال اللسانيات والنشر، 'حرفية' مُثبَّتة بمعنى 'typography'؛ إدراجها في
            هذه المجموعة سيُفضي إلى تداخل دلالي خطير مع معنى موثَّق وراسخ.

    - lemma: "تَخَصُّصِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "رطانة"
      decision: confirmed
      decision_reason: >-
        اللمّة موثَّقة توثيقًا قويًا في معاجم حديثة وكلاسيكية متعددة بالمعنى المطلوب؛
        المعجم الكبير يُعرّفها صراحةً بـ'مجموعة العبارات والتراكيب التي تتميز بها طائفة
        من الناس يعملون في حرفة واحدة'، وتوافق عليها مصادر ArabTerm المتعددة في مجالات
        الإعلام واللسانيات والطب. تحمل الكلمة ظلاً أصيلاً من الغرابة والإغماض موروثًا
        من معناها الكلاسيكي مما يُثري دلالة الـ jargon بعُمق تراثي. تجتاز اختبار
        السكّ (لا يمكن إبدالها بمرادف مع حفظ الظلال الدلالية ذاتها) واختبار التثبيت
        المعجمي (مُعجَمة في مصادر متعددة بهذا المعنى). كما أن اللمّة بلا تشكيل في
        AWN الحالي مما يستدعي update_lemma.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphological_check: >-
        وزن فَعَالَة (رَطَانَة) يُستعمل للمصادر الدالة على الفعل أو الحالة (كالجَهَالة
        والصَّراحة)، وهو ملائم للدلالة على نمط كلامي. البنية الصرفية سليمة. ابن فارس
        رأى الجذر غير محكم لكنه أثبته بمعنى واضح في كلام العرب.
      nuance_differentiation: >-
        تحمل 'رطانة' ظلاً سلبياً أصيلاً من معناها الكلاسيكي (الكلام الأعجمي غير
        المفهوم للآخرين)، مما يجعلها أنسب حين يُراد التعبير عن صعوبة الفهم والطابع
        المُغلَق لهذه اللغة؛ بخلاف 'اللغة الاصطلاحية' التي تصف المصطلحات بطابع الاتفاق
        والتواضع المحايد دون إيحاء بالغرابة أو السلبية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَطَانَة"

    - lemma: "لغة اصطلاحية"
      decision: confirmed
      decision_reason: >-
        موثَّقة في المورد الحديث (2008) كترجمة مباشرة مستقلة للـ jargon (المعنى الثاني
        المحايد: 'اللغة الاصطلاحية لجماعة ما')، وتُستعمل في الأدبيات اللسانية العربية
        للإشارة إلى اللغة التقنية المتفق عليها بين أهل الحقل. مفردة 'اصطلاح' في العربية
        تحمل معنى الاتفاق والتواضع على المصطلح مما يجعل التركيب 'لغة اصطلاحية' وحدةً
        دلالية بمسوّغ تركيبي واضح. يجتاز اختبار التثبيت المعجمي بوصفه مصطلحًا لسانيًا
        موثَّقًا. تنعدم الظلال السلبية مما يكمّل دلاليًا اللمّة 'رطانة'.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        تعبير محايد بالكامل يُبرز الطابع الاتفاقي-الاصطلاحي للمصطلحات التخصصية دون
        الإشارة إلى الغرابة أو الإغماض، وهو أنسب للاستعمال الأكاديمي الرسمي في مجالات
        اللسانيات والتعليم والترجمة المتخصصة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُغَة اصْطِلَاحِيَّة"

    - lemma: "مُصطَلَحِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        المصطلحية في الاستعمال المعجمي الموثَّق تعني 'علم المصطلح'
        (Terminology as a scientific discipline)، لا الرطانة ولا المفردات التخصصية
        للجماعة؛ إدراجها في هذه المجموعة سيُنشئ تداخلاً مع المفهوم المجاور 'علم
        المصطلحات' (awn4-06881985-n أو ما يناظره).

    - lemma: "لُغَةُ المِهْنَةِ"
      source: stage1
      decision: removed
      decision_reason: >-
        غير موثَّقة كوحدة معجمية ثابتة في أي مصدر معجمي مُستعلَم. تجتاز اختبار
        الاستبدال بسهولة (يمكن قول 'لغة الحرفة' أو 'لغة العلم' أو 'لغة الطب' مع بقاء
        المعنى الوصفي)، مما يدل على أنها عبارة وصفية حرة لا مصطلح مسكوك.

    - lemma: "حِرَفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        موثَّقة بمعانٍ متعارضة تمامًا مع المطلوب: 'typography' في مجال اللسانيات
        و'corporatism' في مجال التجارة. لا يمكن إدراجها في مجموعة الرطانة دون خلط
        دلالي خطير مع معانٍ راسخة وموثَّقة.

    - lemma: "تَخَصُّصِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر لها على أي توثيق معجمي بالمعنى المطلوب في قاعدة البيانات. وزن المصدر
        الصناعي منتج اشتقاقيًا لكن الكلمة غير مسكوكة ولم تتثبت بعد في الاستعمال
        المعجمي المُقنَّن.


