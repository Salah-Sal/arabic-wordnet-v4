stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ثابت الزمن» مركب إضافي بدون تشكيل"
      - "لا توجد صيغ بديلة رغم تعدد الصيغ المصطلحية المستعملة (إضافي ووصفي)"
      - "التعريف العربي ترجمة حرفية للإنجليزي وفيه ركاكة: «أسيًا» و«سعته» غير دقيقتين"
    observations: "المفهوم مصطلح فيزيائي/إلكتروني تقني. «ثابت الزمن» مركب إضافي مقابل للإنجليزية time constant، وهو اصطلاح شائع في الأدبيات الهندسية العربية. التعريف يحتاج مراجعة: «سعته» (amplitude) أدق منها «مَطاله» أو «اتّساعه»، و«أسيًا» صيغة مولّدة من «أُسّ» لكنها مقبولة اصطلاحاً."
  blind_candidates:
    - lemma: "ثَابِتُ الزَّمَنِ"
      generation_method: tarkib
      justification: "مركب إضافي يقابل time constant مباشرةً، وهو الصيغة الأكثر شيوعاً في معاجم الفيزياء العربية. «ثابت» من الثبات (الدوام وعدم التغيّر) يصف كمية لا تتغيّر بتغيّر المتغيرات، و«الزمن» يحدد مجالها."
    - lemma: "ثَابِتٌ زَمَنِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي بديل: «ثابت» اسم موصوف و«زمني» صفة منسوبة إلى الزمن. شائع في مسارد الهندسة الكهربائية (ALECSO) وموسوعة الكهرباء IEC."
    - lemma: "الثَّابِتُ الزَّمَنِيُّ"
      generation_method: tarkib
      justification: "الصيغة المعرّفة بأل من المركب الوصفي، مستعملة في موسوعة الكهرباء. صيغة تصلح عنواناً معجمياً مُعرَّفاً."
    - lemma: "ثَابِتَةُ الزَّمَنِ"
      generation_method: tarkib
      justification: "صيغة مؤنثة على غرار الفرنسية constante de temps. تُستعمل أحياناً في النصوص المترجمة عن الفرنسية، لكنها أقل شيوعاً في المعاجم العربية الموحّدة."

