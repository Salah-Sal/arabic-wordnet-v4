stage4_content:
  definition:
    current: "(إلكترونيات) الوقت اللازم للتيار أو الجهد في دائرة للارتفاع أو الانخفاض أسيًا بحوالي 63 في المائة من سعته"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية فيها ركاكة. «سعته» ترجمة غير دقيقة لـ amplitude (الأدق: مَطاله أو سَعَته القُصوى). والعبارة «بحوالي 63 في المائة» تحتاج ضبطاً. كما أن تعريف مسرد الهندسة الكهربائية أدق وأشمل."
    authored:
      - type: terminological
        text: "(إلكترونيات) المُدَّة الزمنية التي يستغرقها التيار أو الجهد في دارة كهربائية ليرتفع إلى نحو 63.2% من قيمته النهائية، أو لينخفض إلى نحو 36.8% من قيمته الابتدائية، وفق دالة أُسِّية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "(إلكترونيات) مقدارٌ يُرمز إليه بالحرف τ (تاو)، يُساوي المدة الزمنية اللازمة لانحلال استجابة دارة من الرتبة الأولى (كدارة RC أو RL) بنسبة (1 − 1/e) ≈ 63.2% من قيمتها القصوى عند التصاعد، أو بنسبة 1/e ≈ 36.8% عند التناقص. ويُحسب في دارة RC بحاصل ضرب المقاومة في السعة (τ = RC)."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "(إلكترونيات) المُدَّة الزمنية التي يستغرقها التيار أو الجهد في دارة كهربائية ليرتفع إلى نحو 63.2% من قيمته النهائية، أو لينخفض إلى نحو 36.8% من قيمته الابتدائية، وفق دالة أُسِّية."

