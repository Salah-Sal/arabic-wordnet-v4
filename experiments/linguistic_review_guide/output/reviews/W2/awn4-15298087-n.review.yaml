# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15298087-n (latent period)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «فترة الكمون» بدون تشكيل — يلزم تشكيل كامل"
      - "المجموعة تحوي لمّة واحدة فقط — ينبغي إثراؤها بمرادفات طبية أخرى"
      - "التعريف العربي قريب من الترجمة الحرفية للإنجليزية"
    observations: >
      المفهوم طبي محدد يعبّر عن الحقبة الزمنية بين دخول العامل الممرض وظهور الأعراض.
      في المعجمية العربية الطبية يُستخدم لفظ «الكمون» (من كَمَنَ = استخفى) للدلالة
      على الحالة الكامنة قبل التظاهر. وثمة تنافس بين عدة مركبات إضافية
      (فترة الكمون، دور الكمون، طور الخفاء) في المعاجم الطبية الموحدة.
  blind_candidates:
    - lemma: "فَتْرَة الكُمُون"
      generation_method: tarkib
      justification: >
        مركب إضافي من «فَتْرَة» (مدة زمنية) و«الكُمُون» (مصدر كَمَنَ = استخفى).
        الكمون يدل على استتار الشيء قبل ظهوره، والمركب يطابق المفهوم الطبي.
    - lemma: "دَوْر الكُمُون"
      generation_method: tarkib
      justification: >
        مركب إضافي من «دَوْر» (طور أو حقبة) و«الكُمُون». في الاستعمال الطبي
        «الدَّوْر» يدل على مرحلة من مراحل المرض، فيناسب المفهوم تماماً.
    - lemma: "طَوْر الخَفَاء"
      generation_method: tarkib
      justification: >
        مركب إضافي من «طَوْر» (مرحلة) و«الخَفَاء» (مصدر خَفِيَ = استتر).
        يستعمل الخفاء في مقابل الظهور، فيعبّر عن المرحلة السابقة لتظاهر الأعراض.
    - lemma: "فَتْرَة الحَضَانَة"
      generation_method: tarkib
      justification: >
        مركب إضافي من «فَتْرَة» و«الحَضَانَة» (من حَضَنَ = حفظ وربّى).
        يُستعمل في الطب لفترة احتضان العامل المعدي قبل المرض.


stage2_evidence:
  per_lemma:
    - lemma: "فَتْرَة الكُمُون"
      confirm:
        - text: "«(1) دَوْر الكمون: فترة الحضانة الخاصة بمرضٍ ما (2) فترة الكمون: الفترة الفاصلة بين التنبيه والاستجابة (نف).»"
          source: "المورد الحديث (2008)"
        - text: "«فترة كمون — latent period»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«الكُمُونُ: استتار الشَّيْء عَن الْحس.»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يوضح أن الكمون يعني الاستتار عن الإدراك الحسي، مما يوافق معنى غياب الأعراض"
        - text: "«كَمَنَ: الْكَافُ وَالْمِيمُ وَالنُّونُ أُصَيْلٌ يَدُلُّ عَلَى اسْتِخْفَاءٍ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ك م ن أصل في الاستخفاء، مما يسوّغ استعماله للدلالة على المرحلة الخفية من المرض"

    - lemma: "دَوْر الكُمُون"
      confirm:
        - text: "«دَورُ الكُمون — latency period»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«دَورُ الكُمون — latent period»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«دَورُ الكُمُون — stage of latency»"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "طَوْر الخَفَاء"
      confirm:
        - text: "«طَورُ الخَفَاءِ — latency phase (latent phase)»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«خَفِيَ: الْخَاءُ وَالْفَاءُ وَالْيَاءُ أَصْلَانِ مُتَبَايِنَانِ مُتَضَادَّانِ. فَالْأَوَّلُ السَّتْرُ، وَالثَّانِي الْإِظْهَارُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر خ ف ي يتضمن دلالتَي السَّتر والإظهار، فالخفاء يدل على المرحلة المستترة"

    - lemma: "فَتْرَة الحَضَانَة"
      confirm:
        - text: "«فترة الحضانة — incubation period»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«دور الحضانة — incubation period»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
      contradicts:
        - text: "«مُدَّةُ الحضانة (في الأمراض المُعدية): الفترةُ بين دُخول الميكروب الجسم وظُهور أعراض المَرَضِ»"
          source: "المعجم الكبير"
          conflict: >
            «فترة الحضانة» مصطلح مقابل لـ incubation period وليس latent period.
            في الطب الحديث يُفرَّق بينهما: فترة الحضانة تخص الأمراض المعدية تحديداً،
            أما فترة الكمون فأعم وتشمل الأمراض غير المعدية كالأورام.
        - text: "«كثيرا ما تستخدم 'فترة كامنة' كمرادف لِ 'فترة التدريب'... فترة حضانة (المرادف العربي)»"
          source: "مسرد المناخ والبيئة (ALECSO)"
          conflict: >
            المسرد نفسه يفرّق بين «فترة كامنة» (latent period) و«فترة حضانة»
            (incubation period) ويجعل الثاني مرادفاً جزئياً فقط.


stage3_analysis:
  per_lemma:
    - lemma: "فَتْرَة الكُمُون"
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك مثبت في المورد الحديث وموسوعة الكهرباء ومقاليد العلوم.
        الجذر «كمن» أصل في الاستخفاء عند ابن فارس، والمركب الإضافي يطابق المفهوم.
        يحتاج تحديث التشكيل فقط.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الأعم والأشيع استعمالاً، يُطلق على الفترة الكامنة قبل ظهور أعراض أي مرض
        (معدٍ أو غير معدٍ)، ويُستعمل أيضاً في علم النفس للفترة بين التنبيه والاستجابة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَتْرَة الكُمُون"

    - lemma: "دَوْر الكُمُون"
      source: stage1
      decision: confirmed
      decision_reason: >
        مثبت في المعجم الطبي الموحد (2009) بثلاثة مداخل صريحة مقابل
        latency period وlatent period وstage of latency. مصطلح طبي رسمي
        معتمد من المنظمة العربية للتربية والثقافة والعلوم (ALECSO).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُفضَّل في السياقات الطبية السريرية حيث يُراد التأكيد على أن الكمون
        «طَوْر» أو «دَوْر» من أدوار المرض، لا مجرد «فترة» زمنية مطلقة.
      actions:
        - command: create_entry
          params:
            lemma: "دَوْر الكُمُون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "طَوْر الخَفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الطبي الموحد يقابله بـ latency phase / latent phase وليس latent period.
        في المصطلحية الطبية الدقيقة «الطَّوْر» (phase) يختلف عن «الفترة» (period)،
        إذ الطور جزء من دورة والفترة مدة زمنية مطلقة. إدراجه هنا يخلط بين المفهومين.

    - lemma: "فَتْرَة الحَضَانَة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح مقابل لـ incubation period لا latent period. المعاجم الطبية تفرّق
        بينهما: فترة الحضانة تخص الأمراض المُعدية (من دخول الميكروب إلى ظهور الأعراض)،
        أما فترة الكمون فأعم وتشمل الأمراض غير المعدية والأورام والتعرض للإشعاع.
        المعجم الكبير ومسرد المناخ يؤكدان هذا الفرق.


stage4_content:
  definition:
    current: "الوقت الذي ينقضي قبل ظهور أعراض المرض"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزية وينقصه تحديد نقطة البداية
        (التعرض للعامل الممرض أو دخوله الجسم). ينبغي تأليفه بأسلوب معجمي عربي
        مع ذكر الجنس القريب (مدة زمنية) والفصل النوعي (بين التعرض وظهور الأعراض).
    authored:
      - type: terminological
        text: "مُدَّةٌ زَمَنِيَّةٌ تَمْتَدُّ مِنْ لَحْظَةِ التَّعَرُّضِ لِلْعَامِلِ المُمْرِضِ إِلَى أَوَّلِ ظُهُورِ أَعْرَاضِ الدَّاءِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "المُدَّةُ الفَاصِلَةُ بَيْنَ تَعَرُّضِ الجِسْمِ لِعَامِلٍ مُمْرِضٍ (كَالمِيكْرُوبِ أَوِ الإِشْعَاعِ أَوِ المَادَّةِ الكِيمِيَائِيَّةِ) وَبَيْنَ تَظَاهُرِ أَعْرَاضِ المَرَضِ سَرِيرِيًّا. وَتَخْتَلِفُ هَذِهِ المُدَّةُ بِاخْتِلَافِ المَرَضِ وَطَبِيعَةِ العَامِلِ المُمْرِضِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُدَّةٌ زَمَنِيَّةٌ تَمْتَدُّ مِنْ لَحْظَةِ التَّعَرُّضِ لِلْعَامِلِ المُمْرِضِ إِلَى أَوَّلِ ظُهُورِ أَعْرَاضِ الدَّاءِ"

  examples:
    per_lemma:
      - lemma: "فَتْرَة الكُمُون"
        examples:
          - text: "قد تمتد فَتْرَةُ الكُمُونِ في بعض الأورام الناجمة عن التعرض للأَسْبَسْت إلى أكثر من عشرين عاماً."
            type: usage
      - lemma: "دَوْر الكُمُون"
        examples:
          - text: "يبلغ دَوْرُ الكُمُونِ في داء الكَلَب أسابيعَ عدةً وقد يصل إلى أشهر بحسب موضع العضة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "قد تمتد فَتْرَةُ الكُمُونِ في بعض الأورام الناجمة عن التعرض للأَسْبَسْت إلى أكثر من عشرين عاماً."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يبلغ دَوْرُ الكُمُونِ في داء الكَلَب أسابيعَ عدةً وقد يصل إلى أشهر بحسب موضع العضة."


