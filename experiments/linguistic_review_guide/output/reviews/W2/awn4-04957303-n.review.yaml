# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان ('خاصية بصرية' و'سمة بصرية') بدون تشكيل كامل"
      - "التمييز الدلالي بين 'خاصية' و'سمة' ضعيف في هذا السياق — كلتاهما تترجم attribute بوجه عام وتحتاج إلى توثيق الفارق الدلالي"
      - "التعريف الحالي ('سمة تتعلق بالرؤية') مختصر جداً: 'تتعلق بالرؤية' لا يحدد طبيعة التعلق، و'الرؤية' أوسع من الحسّ البصري المادي"
    observations: "المجموعة الترادفية تمثل مفهوماً فوقياً مجرداً (hypernym abstract category) يجمع كل خصائص الإدراك البصري، كاللون والسطوع والتباين والشفافية. كلتا اللمتين الموجودتين مركبتان وصفيتان من النمط الإضافي-الوصفي (اسم + صفة). الجذر البصري (ب-ص-ر) مستعمل بكثافة في المصطلحية العربية الحديثة لتوصيف كل ما يتعلق بحاسة البصر والضوء. التعريف الحالي يصف الظاهرة لا الماهية."

  blind_candidates:
    - lemma: "بَصَرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من جذر بَصَر (ب-ص-ر)، يدل على المفهوم المجرد المتعلق بحاسة البصر بوصفه وحدة معجمية مفردة. على غرار 'صَوتِيَّة' من صوت و'سَمعِيَّة' من سمع. محاولة لتكثيف مفهوم 'الخاصية البصرية' في لفظ واحد."
    - lemma: "مَظْهَر"
      generation_method: majaz
      justification: "توسيع دلالي مجازي: 'المظهر' يعني تقليدياً 'الصورة التي يبدو عليها الشيء'، وهو مرتبط جوهرياً بالإدراك البصري. إحياء اللفظ القديم وتوسيعه ليشمل أي خاصية من خصائص الشيء التي تُدرَك بالبصر."
    - lemma: "خَاصِّيَّةُ الإِبْصَار"
      generation_method: tarkib
      justification: "مركب إضافي: خاصِّيَّة + الإِبْصَار (مصدر أبصر). يعبّر بدقة عن 'صفة تتعلق بعملية الإبصار الحسي'. الإبصار أكثر تحديداً من الرؤية لأنه يشير صراحةً إلى الإدراك الحسي البصري."
    - lemma: "مَرْئِيَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق من جذر (ر-أ-ي) على وزن مَفْعِليَّة، يدل على الخاصية المرئية بوجه عام. قياساً على 'مسموعية' و'مقروئية' اللتين تدلان على الخاصية المتعلقة بفعل السمع والقراءة."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية: خاصية بصرية / سمة بصرية / بصرية / مظهر / خاصية الابصار / مرئية
#   Q2 — جسر إنجليزي: translation_en:"visual property" OR "visual attribute" OR "visual quality"
#   Q3 — FTS عربي: "بصري" OR "بصرية" OR "مرئي" OR "خاصية بصرية"
#   Q4 — مقاييس اللغة: جذور بصر / رأى / ظهر / وسم / خص
stage2_evidence:
  per_lemma:
    - lemma: "خاصية بصرية"
      confirm:
        - text: "«التعكر، الذي يعتبر خاصية بصرية، ويستخدم لتحديد مستوى نوعية المياه وصفائها»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — arabterm"
        - text: "«خواص بصرية» — [translation_en: optical properties]"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — arabterm"

    - lemma: "سمة بصرية"
      evidence_status: "no_material_found"

    - lemma: "بَصَرِيَّة"
      confirm:
        - text: "«(1) بَصَريّ (2) مَرْئيّ (3) مُفْعَم بالحيويّة؛ مثير للصُّوَر الذِّهنيّة visual narratives» — [translation_en: visual]"
          source: "المورد الحديث (2008) — arabterm"
      contradicts:
        - text: "المدخل يوثق 'بصري' كصفة (adjective) لا كاسم مجرد مستقل؛ ولا يُثبت وجود 'بصرية' مصطلحاً اسمياً لمفهوم الخاصية البصرية"
          source: "المورد الحديث (2008) — arabterm"
          conflict: "'بصرية' صفة وليست مصطلحاً اسمياً مستقلاً ثابتاً لهذا المفهوم"

    - lemma: "مَظْهَر"
      confirm:
        - text: "«الصورة التي يبدو عليها الشيء»"
          source: "المعجم الوسيط — ocr"
        - text: "«(الْمظهر) الصُّورَة الَّتِي يَبْدُو عَلَيْهَا الشَّيْء والعلاقة و (فِي علم النَّبَات) صفة النَّبَات فِي المواسم الْمُخْتَلفَة فَيُقَال الْمظهر الربيعي والخريفي والصيفي»"
          source: "المعجم الوسيط لمجموعة من المؤلفين — hawramani"
        - text: "«مَظْهَر» — [translation_en: appearance / aspect]"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) / المعجم الموحد لمصطلحات الكيمياء — arabterm"
      contradicts:
        - text: "«مظهر» — [translation_en: endorser / indorser]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — arabterm"
          conflict: "الاشتراك اللفظي: 'مظهر' في سياقات مالية تعني endorser (صاحب التظهير)، وفي سياقات كيميائية تعني developer (المظهِّر الفوتوغرافي)، مما يُفضي إلى لبس مصطلحي"

    - lemma: "خَاصِّيَّةُ الإِبْصَار"
      evidence_status: "no_material_found"

    - lemma: "مَرْئِيَّة"
      contradicts:
        - text: "«تمثيل مسجل لجسم ما نحصل عليه بوسائل بصرية أو بصرية كهربائية، أو بصرية ميكانيكية، أو إلكترونية، يستعمل هذا المصطلح عندما يصدر أو ينعكس الإشعاع الكهرمغنطيسي من منظر ولا يسجَّل بشكل مباشر على فلم» — [translation_en: image]"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000) — arabterm"
          conflict: "'مَرْئِيَّة' استُقرَّت دلالتها على 'image' (الصورة المسجلة) في المصطلحية العربية، وليس 'خاصية بصرية'"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "خاصية بصرية"
      decision: confirmed
      decision_reason: "الاستخدام موثق في المصطلحية العربية الحديثة (وُظِّف في تعريف 'التعكر' كـ'خاصية بصرية'، وفي AGROVOC كـ'خواص بصرية = optical properties'). المركب وصفي فصيح من نمط شائع في العربية التقنية. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "'خَاصِّيَّة' مشتقة من 'خَصَّ' بمعنى الإفراد والتمييز؛ تحمل دلالة تقنية علمية تشير إلى صفة قابلة للتحديد والقياس الكمي (كخاصية اللون والسطوع)، وتُستخدم بكثرة في الفيزياء والكيمياء والهندسة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاصِّيَّةٌ بَصَرِيَّة"

    - lemma: "سمة بصرية"
      decision: confirmed
      decision_reason: "'سِمَة' من جذر وسم (أثَّر وعلَّم)، وهي كلمة فصيحة موثقة في المعاجم الكلاسيكية والحديثة. تُكمِّل 'خاصية بصرية' بتغطية السياقات الوصفية والأسلوبية. تحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "'سِمَة' مشتقة من 'وَسَمَ' بمعنى الأثر والعلامة المميزة؛ تحمل دلالة وصفية تصنيفية تشير إلى علامة مميزة تُعرَّف بها الأشياء، وتُناسب السياقات الأدبية والأسلوبية والتصنيفية التي لا تشترط قابلية القياس الكمي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِمَةٌ بَصَرِيَّة"

    - lemma: "بَصَرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "موثقة فقط كصفة (بَصَريّ = visual) لا كاسم مجرد مستقل. لا يوجد في المعاجم ما يدعم استخدام 'بصرية' وحدها مصطلحاً اسمياً لمفهوم 'الخاصية البصرية'. تفشل اختبار التثبيت المعجمي."
      evidence_assessment:
        case: mixed

    - lemma: "مَظْهَر"
      source: stage1
      decision: removed
      decision_reason: "دلالة 'مظهر' تنصبّ على الشكل الخارجي الكلي للشيء، لا على خاصية بصرية منفردة محددة. يعاني من اشتراك لفظي متعدد (endorser في التجارة، developer في الكيمياء). لا يصلح مرادفاً دقيقاً لـ'visual property' في السياق التقني."
      evidence_assessment:
        case: mixed

    - lemma: "خَاصِّيَّةُ الإِبْصَار"
      source: stage1
      decision: removed
      decision_reason: "المركب الإضافي صحيح لكنه تكرار مطوَّل للمّة الموجودة 'خاصية بصرية' دون إضافة دلالية مستقلة. لم يُوثَّق في المعاجم ككيان معجمي مستقل. يرسب اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material

    - lemma: "مَرْئِيَّة"
      source: stage1
      decision: removed
      decision_reason: "استُقرَّت دلالة 'مرئية' في المصطلحية العربية الحديثة على معنى 'image' (الصورة المسجلة بصرياً) في مجال الاستشعار عن بعد. استخدامها بمعنى 'خاصية بصرية' سيوقع في اشتراك لفظي ضار."
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
