stage1_review:
  assessment:
    concerns:
      - "المصطلحات الحالية هي ترجمات حرفية (Calque) لمفاهيم فرعية حديثة جداً في الثقافات الغربية (Findom)."
      - "عدم وجود المصطلح في المعاجم العربية التقليدية أو المتخصصة المتوفرة."
    observations: "المفهوم يتعلق بالهيمنة المالية (Financial Dominance) وهو جزء من ثقافة الـ (BDSM). المصطلحات المستخدمة حالياً في المجتمع العربي المتابع لهذه الثقافة تعتمد على الترجمة المباشرة للفظ (Submissive) إلى (خاضع) و(Financial) إلى (مالي). المصطلح (عبد مالي) هو الأكثر شيوعاً في سياق الطقوس ذاتها."
  blind_candidates:
    - lemma: "خَاضِع مَالِيّ"
      generation_method: tarkib
      justification: "ترجمة وصفية مباشرة للمفهوم (Financial Submissive)."
    - lemma: "مُمَوِّل خَاضِع"
      generation_method: tarkib
      justification: "وصف الوظيفة (التمويل) مع الحالة النفسية (الخضوع)."
    - lemma: "عَبْد مَالِيّ"
      generation_method: tarkib
      justification: "المصطلح المقابل لـ (Financial Slave) وهو مستخدم بكثرة في الأدبيات المتخصصة بهذه الممارسة."
    - lemma: "مُسْتَكِين مَالِيّ"
      generation_method: tarkib
      justification: "استخدام لفظ تراثي (استكانة) للدلالة على الخضوع المطلق."

