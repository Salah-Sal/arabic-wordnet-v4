stage4_content:
  definition:
    current: "ذكر خاضع جنسياً (يقوم بدفع المال كجزء من طقوس الخضوع)"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويحتاج لتوضيح الجانب السيكولوجي والمالي للممارسة."
    authored:
      - type: terminological
        text: "فرد يستمد إشباعاً نفسياً من خضوعه المالي لآخر، حيث يقوم بتقديم الأموال أو الهدايا طواعية كجزء من علاقة خضوع وتفوق."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-90011301-n", definition_index: 0, text: "فرد يستمد إشباعاً نفسياً من خضوعه المالي لآخر، حيث يقوم بتقديم الأموال أو الهدايا طواعية كجزء من علاقة خضوع وتفوق."}
  examples:
    per_lemma:
      - lemma: "خَاضِع مَالِيّ"
        examples:
          - text: "يَقُومُ الخَاضِعُ المَالِيُّ بِتَحْوِيلِ مَبَالِغَ دَوْرِيَّةٍ لِطَرَفٍ مُهَيْمِنٍ كَجُزْءٍ مِنِ التِزَامِهِ."
            type: usage
      - lemma: "مُمَوِّل خَاضِع"
        examples:
          - text: "يُعَبِّرُ المُمَوِّلُ الخَاضِعُ عَنِ اسْتِكَانَتِهِ عَبْرَ تَحَمُّلِ المَصَارِيفِ المَالِيَّةِ لِلْآخَرِ."
            type: usage
      - lemma: "عَبْد مَالِيّ"
        examples:
          - text: "يَخْضَعُ العَبْدُ المَالِيُّ لِسُلْطَةِ المُهَيْمِنَةِ عَبْرَ التَّسْلِيمِ الكَامِلِ لِمَوَارِدِهِ المَالِيَّةِ."
