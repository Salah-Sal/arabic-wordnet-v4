      sense_id: "{auto}"
      nuance: "مصطلح وصفي عام يشير إلى إنهاء أثر الفاعل ونشاطه."
      mwe: true
    - lemma: "تَعْطِيْل"
      sense_id: "{auto}"
      nuance: "تستخدم في سياق الخدمات والآلات والبرمجيات."
