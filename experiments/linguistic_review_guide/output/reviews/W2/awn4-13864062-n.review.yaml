# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13864062-n
# mutuality / interdependence / interdependency
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تَبَادُل» عامة جداً؛ معناها الأساسي «إعطاء شيء مقابل آخر» (exchange) لا «حالة الاعتماد المتبادل» (mutuality/interdependence)"
      - "المجموعة تفتقر إلى مصطلح مفرد يعبّر عن مفهوم الاعتماد المتبادل كحالة (مقابل كونه عملية تبادل)"
      - "التعريف العربي الحالي جيد لكنه ترجمة شبه حرفية للتعريف الإنجليزي"
    observations: "المجموعة تعبّر عن مفهوم العلاقة التبادلية بين كيانات مترابطة. لمّة «اعتماد متبادل» مركب إضافي وصفي يطابق المفهوم مطابقة دقيقة. أمّا «تبادل» فدلالته الأصلية هي المبادلة والتقايض، وهو أعمّ من المطلوب ويتقاطع مع المجموعة الأمّ (تبادلية). ينبغي البحث عن مصطلحات أدقّ كالتواقف والتكافل."
  blind_candidates:
    - lemma: "تَكَافُل"
      generation_method: ishtiqaq
      justification: "وزن تَفَاعُل من جذر ك-ف-ل يدلّ على التضامن والتكفّل المتبادل، وهو مستعمل في العلوم الاجتماعية والبيئية بمعنى العلاقة المتبادلة النفعية"
    - lemma: "تَعَاضُد"
      generation_method: ishtiqaq
      justification: "وزن تَفَاعُل من جذر ع-ض-د يدلّ على التناصر والتعاون المتبادل، والعَضُد في الأصل المعين والسند"
    - lemma: "تَرَابُط"
      generation_method: ishtiqaq
      justification: "وزن تَفَاعُل من جذر ر-ب-ط يدلّ على الارتباط المتبادل بين عناصر متعددة"
    - lemma: "اعْتِمَادِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من اعتماد على وزن افتعال + ية، يعبّر عن حالة الاعتماد المتبادل كمفهوم مجرد"

stage2_evidence:
  per_lemma:
    - lemma: "اعْتِمَاد مُتَبَادَل"
      confirm:
        - text: "«علاقات بين مكونات مجموعة كائنات أو منظومة يعتمدون بشكل متبادل على بعضهم البعض.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
        - text: "«interdependance (interdependence)»"
          source: "مسرد المناخ والبيئة — ترجمة إنجليزية"
        - text: "«interdependance»"
          source: "مسرد الجغرافيا والتاريخ (ALECSO)"
    - lemma: "تَبَادُل"
      contradicts:
        - text: "«تسلم شيء (مادي أو غير مادي) مقابل تسليم شيء آخر، وضع شيء مكان شيء آخر.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          conflict: "المعنى الأصلي هو المبادلة والتقايض (exchange/interchange) لا حالة الاعتماد المتبادل"
        - text: "«نقل طوعي لحقوق استخدام البضائع.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          conflict: "المعنى تجاري: نقل حقوق، لا علاقة متبادلة بين كيانات مترابطة"
        - text: "«تنقيل أحادي الجانب أو متعدد الجوانب لمعطيات حاسوب بين المكونات أو الأجهزة أو الأنظمة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          conflict: "المعنى تقني: نقل بيانات، لا علاقة ترابطية"
      expands:
        - text: "«(1) التبادُليّة (2) تبادُل (3) المعاملة بالمثل [بين حكومتين]»"
          source: "المورد الحديث (2008) — مدخل reciprocity"
          addition: "تبادل يرد كأحد معاني reciprocity في المورد لكنه ثالث المعاني بعد التبادلية والمعاملة بالمثل"
    - lemma: "تَكَافُل"
      confirm:
        - text: "«علاقة بين نوعين، مفيدة لكليهما على حد سواء.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO) — mutualism"
        - text: "«أي اتكال متبادل»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — تكافل تواقف = interdependence"
      contradicts:
        - text: "«العيش معا لاثنين من الكائنات الحية من أنواع مختلفة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO) — symbiosis"
          conflict: "الدلالة الأولى للتكافل في العلوم البيئية هي التعايش بين كائنات حية (symbiosis) وهو أخصّ من المطلوب"
      expands:
        - text: "«تَكَافَلَ: كَفَل الرجلَ كَفْلاً وكَفَالةً: ضَمِنَه [...] يجوز صوغ تَكَافَل تكافُلاً في مثل: تكافل القومُ بمعنى كَفَلَ بَعْضُهم بعضًا، أو تضامنوا»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الفعل تكافل صحيح لغوياً ومعناه كفل بعضهم بعضاً أو تضامنوا"
    - lemma: "تَعَاضُد"
      confirm:
        - text: "«mutualism»"
          source: "مسرد الجغرافيا والتاريخ (ALECSO)"
        - text: "«تعاوُن، تعاضُد — mutuality»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«القومُ: تعاونوا وتناصروا»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي يدلّ على التعاون والتناصر لا على حالة الترابط كعلاقة بنيوية"
    - lemma: "تَرَابُط"
      contradicts:
        - text: "«(في علم الفلسفة): قيام علاقة بين مدرَكين لاقترانهما فى الذهن بسبب ما»"
          source: "المعجم الوسيط"
          conflict: "المعنى فلسفي: ارتباط ذهني بين مدركات (association/correlation) لا اعتماد متبادل بين كيانات"
        - text: "«قياس مدى تشابه متغيرين عشوائيين (أو إشارتين).»"
          source: "مسرد التربية (ALECSO) — correlation"
          conflict: "المعنى الإحصائي: ارتباط إحصائي (correlation) وهو مفهوم مختلف"
        - text: "«الماء فى المكان: لم يبرحه ولم يخرج منه»"
          source: "المعجم الوسيط — الفعل تَرَابَطَ"
          conflict: "المعنى الأصلي للفعل: استقرار الماء في المكان، لا التبادل"
    - lemma: "اعْتِمَادِيَّة"
      contradicts:
        - text: "«خاصية الاتساق المقصود في السلوك والنتائج. — Reliability»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          conflict: "المصطلح مستعمل فعلاً بمعنى الموثوقية (reliability) لا الاعتماد المتبادل"

stage3_analysis:
  per_lemma:
    - lemma: "اعْتِمَاد مُتَبَادَل"
      decision: confirmed
      decision_reason: "مصطلح ثابت موثّق في معاجم ALECSO المتخصصة كمقابل مباشر لـ interdependence مع تعريف مطابق لدلالة المجموعة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على البُعد البنيوي للعلاقة: حاجة كل كيان إلى الآخر لاستمراره أو عمله"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اعْتِمَاد مُتَبَادَل"

    - lemma: "تَبَادُل"
      decision: removed
      decision_reason: "دلالة «تبادل» الأصلية والسائدة هي المبادلة والتقايض (exchange/interchange)، وهي أعمّ بكثير من مفهوم الاعتماد المتبادل. كما أنها تتقاطع مع لمّة المجموعة الأمّ (تبادلية = reciprocity)، ممّا يولّد تداخلاً دلالياً مع الأصل"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَكَافُل"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الأولى للتكافل في المعاجم المتخصصة هي التعايش البيولوجي (symbiosis/mutualism) أو التضامن الاجتماعي. وإن ورد في بعض المعاجم بمعنى الاتكال المتبادل (مع تواقف) فإنه لم يرد مفرداً بهذا المعنى، والدلالة البيولوجية والاجتماعية طاغية"
      evidence_assessment:
        case: mixed

    - lemma: "تَعَاضُد"
      source: stage1
      decision: removed
      decision_reason: "معناه الأصلي التعاون والتناصر الفعلي (active cooperation/mutual aid) لا وصف حالة ترابط بنيوي بين كيانات. وروده في معجم القانون مقابل mutuality جاء بمعنى التعاون المتبادل لا العلاقة الترابطية"
      evidence_assessment:
        case: mixed

    - lemma: "تَرَابُط"
      source: stage1
      decision: removed
      decision_reason: "دلالته في المعجم الوسيط فلسفية (ارتباط ذهني بين مدركات) وفي المعاجم الحديثة إحصائية (correlation). المعنى اللغوي الأصلي للفعل تَرَابَطَ هو استقرار الماء. لا يوجد شاهد يدعم استعماله بمعنى الاعتماد المتبادل"
      evidence_assessment:
        case: contradicts_only

    - lemma: "اعْتِمَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مشغول فعلاً بمعنى الموثوقية (reliability) في معجم البيانات والذكاء الاصطناعي. استعماله بمعنى الاعتماد المتبادل سيولّد التباساً"
      evidence_assessment:
        case: contradicts_only

