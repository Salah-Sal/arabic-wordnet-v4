          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "المعجم يُقابل «بث صوتي» بـ audiocast (إرسال حيّ) لا بـ podcast (ملف مُتاح للتنزيل)"
      expands:
        - text: "«بَثَّ الخَبَرَ يَبُثُّه ويَبِثُّه: نَشَرَه وفَرَّقَه»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الجذر بثث يدلّ على النشر والتفريق، وهو أساس استعمال «بث» بمعنى broadcast"
