stage1_review:
  assessment:
    concerns:
      - "«بث صوتي» في قاعدة أرابترم يُقابل «audiocast» لا «podcast»؛ فالبثّ يدلّ على الإرسال الحيّ لا على الملف المُتاح للتنزيل عند الطلب"
      - "«بودكاست» لفظة أعجمية دخيلة لم تُعرَّب صرفياً ولا تقبل جمع تكسير ولا اشتقاقاً عربياً بيُسر"
      - "التعريف الحالي يستعمل «كمبيوتر» وهو دخيل، والأَولى «حاسوب»"
      - "المُراد العلوي (hypernym) «رسالة» قد لا يكون الأنسب؛ فالبودكاست أقرب إلى «تسجيل» أو «برنامج إذاعي» منه إلى «رسالة»"
    observations: "المفهوم حديث النشأة (٢٠٠٤م)، مرتبط بتقنية iPod والإنترنت. لا يوجد له في المعاجم العربية الكلاسيكية مقابل مباشر. المصطلح المعرَّب «بودكاست» هو الأكثر شيوعاً في الإعلام العربي المعاصر، بينما «بث صوتي» محاولة وصفية لكنها تخلط بين البثّ الحيّ (streaming/audiocast) والمحتوى المُتاح عند الطلب (on-demand). يحتاج المجال إلى مصطلح عربي أصيل يميّز هذا المفهوم عن البثّ المباشر."

  blind_candidates:
    - lemma: "تَدْوِينَة سَمْعِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «تدوينة» (مدخل مدوّنة إلكترونية) و«سمعية» (صفة)؛ يعكس طبيعة البودكاست بوصفه تدوينةً صوتيةً تُنشر على الشبكة كما تُنشر التدوينات المكتوبة"
    - lemma: "مَسْمُوعَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول من سَمِعَ على وزن مَفْعُولَة، يدلّ على المادة المُعدَّة للسماع، قياساً على «مقروءة» و«مرئية» و«مسموعة» بمعنى القطعة السمعية المسجّلة"
    - lemma: "بَثِيثَة"
      generation_method: ishtiqaq
      justification: "من جذر بثث على وزن فَعِيلَة بمعنى الشيء المبثوث والمنشور، تدلّ على الوحدة المنشورة رقمياً للاستماع"
    - lemma: "بُودْكَاسْت"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي podcast، وهو الأكثر تداولاً في الإعلام العربي ومنصات المحتوى الرقمي"


