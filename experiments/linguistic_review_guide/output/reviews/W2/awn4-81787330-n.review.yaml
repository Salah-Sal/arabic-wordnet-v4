          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يدلّ على التفريق والإظهار، وهو يصلح للبثّ المباشر أكثر من المحتوى المُنزَّل"

    - lemma: "بُودْكَاسْت"
      confirm:
