      confirm:
        - text: "«تنـزيل برامج إذاعية أو تلفزية لسماعها أو مشاهدتها على جهاز إلكتروني شخصي»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "بَثٌّ صَوْتِيٌّ"
      decision: confirmed
      decision_reason: "رغم أن المعاجم المصطلحية تُقابل «بث صوتي» بـ audiocast لا podcast، فإن المركّب الوصفي شائع الاستعمال في الإعلام العربي للدلالة على المحتوى الصوتي المنشور رقمياً بوجه عام. يُبقى عليه مع تسجيل الفرق الدلالي الدقيق."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يشير إلى الجانب الوصفي العربي للمفهوم، ويركّز على فعل النشر والإذاعة الصوتية، ويُستعمل في السياقات الرسمية والأكاديمية تجنّباً للأعجمي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَثٌّ صَوْتِيٌّ"

    - lemma: "بُودْكَاسْت"
      decision: confirmed
      decision_reason: "لفظة معرَّبة مثبتة في مسرد المنظمة العربية (ALECSO) بتعريف يطابق دلالة المجموعة. هي الأكثر تداولاً في الاستعمال العربي المعاصر وتُفهم بلا التباس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظة معرَّبة عالمية التداول، تُستعمل في السياقات غير الرسمية والإعلامية والتقنية، وتحمل دلالة المفهوم بدقة أكبر من المركّب الوصفي لأنها مخصصة لهذا المفهوم"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُودْكَاسْت"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَدْوِينَة سَمْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركّب وصفي لم يُثبت في أي معجم مصطلحي، ولا يُعدّ وحدة معجمية ثابتة. يمكن إبدال «سمعية» بـ «صوتية» أو «مسموعة» ويبقى المعنى نفسه، ما يدلّ على أنه عبارة حرة لا مصطلح مسكوك."

    - lemma: "مَسْمُوعَة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعمال «مسموعة» اسماً بمعنى الملف الصوتي أو البرنامج الإذاعي الرقمي. اللفظة تُستعمل صفةً (خبر مسموع) لا اسماً مستقلاً بهذا المعنى."

    - lemma: "بَثِيثَة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد لغوي ولا معجمي. وزن فَعِيلَة من بثث لم يُسمع، والمسموع «بَثّ» (مصدر) و«مبثوث» (اسم مفعول). اللفظة نحت قياسي لا سند له."

    - lemma: "بُودْكَاسْت"
      source: stage1
      decision: removed
      decision_reason: "مطابقة للّمة الموجودة «بودكاست»، فلا حاجة لإضافتها مرشحةً."


stage4_content:
  definition:
    current: "ملف صوتي رقمي يتاح على الإنترنت للتنزيل على جهاز كمبيوتر أو مشغل وسائط محمول"
    assessment:
      decision: revise
      reason: "التعريف واضح المعنى لكنه يستعمل «كمبيوتر» وهو دخيل، والأَولى «حاسوب». كما أن ذكر «جهاز كمبيوتر أو مشغل وسائط محمول» تفصيل تقني قد يتقادم، والأفضل تعميمه. ويُستحسن إعادة الصياغة بأسلوب المعجم الوسيط."
    authored:
      - type: terminological
        text: "مادّةٌ سمعيّةٌ رقميّةٌ تُنشر على الشابكة (الإنترنت) وتُتاح للتنزيل أو الاستماع عند الطلب على الأجهزة الإلكترونيّة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "برنامجٌ إذاعيٌّ رقميٌّ يُسجَّل ويُنشر على الشابكة في حلقات دوريّة، يستطيع المستمع تنزيلها أو الاستماع إليها مباشرةً في أيّ وقت. ظهر المصطلح عام ٢٠٠٤م من دمج iPod وbroadcast."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ سمعيّةٌ رقميّةٌ تُنشر على الشابكة (الإنترنت) وتُتاح للتنزيل أو الاستماع عند الطلب على الأجهزة الإلكترونيّة."

  examples:
    per_lemma:
      - lemma: "بَثٌّ صَوْتِيٌّ"
        examples:
          - text: "أطلقت المؤسسة الإعلامية بثًّا صوتيًّا أسبوعيًّا يتناول قضايا التقنية والابتكار في العالم العربي."
            type: usage
      - lemma: "بُودْكَاسْت"
        examples:
          - text: "تصدَّر البودكاست العربي قوائم الاستماع بعد أن تجاوز عدد تنزيلاته مليون تنزيل خلال الشهر الأول."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أطلقت المؤسسة الإعلامية بثًّا صوتيًّا أسبوعيًّا يتناول قضايا التقنية والابتكار في العالم العربي."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تصدَّر البودكاست العربي قوائم الاستماع بعد أن تجاوز عدد تنزيلاته مليون تنزيل خلال الشهر الأول."


