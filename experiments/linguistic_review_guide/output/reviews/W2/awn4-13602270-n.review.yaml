# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13602270-n
# (انتخابات) أكثر من نصف الأصوات — majority / absolute majority
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أغلبية، أغلبية مطلقة) بلا تشكيل كامل"
      - "لمّة «أغلبية» أوسع دلالة من التعريف؛ فهي تشمل الأغلبية النسبية أيضاً، بينما التعريف يخصّها بـ«أكثر من نصف الأصوات»"
      - "المجموعة تجمع بين مفهوم عام (majority) ومفهوم مقيّد (absolute majority) في آنٍ واحد، والتعريف يطابق المقيّد"
    observations: "التعريف العربي «أكثر من نصف الأصوات» يشير صراحةً إلى الأغلبية المطلقة (>٥٠٪). لمّة «أغلبية» وحدها قد تعني الأغلبية النسبية أيضاً لكنها تصلح في سياق هذه المجموعة لأنها الأصل اللغوي. المفهوم سياسي-قانوني حديث محدث في المعاجم العربية."
  blind_candidates:
    - lemma: "أَغْلَبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من أفعل التفضيل «أَغْلَب» بزيادة ياء النسب والتاء، على وزن أَفْعَلِيَّة. مسجّل في الوسيط بمعنى الكثرة وأكثر من النصف."
    - lemma: "أَكْثَرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من أفعل التفضيل «أَكْثَر» بزيادة ياء النسب والتاء. أقرّه مجمع اللغة المصري، ووردت في الوسيط والأساسي مرادفةً للأغلبية."
    - lemma: "غَالِبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من اسم الفاعل «غالب». أقرّه معجم الصواب اللغوي، لكنه يدلّ على الكثرة فحسب دون تجاوز النصف بالضرورة."
    - lemma: "نِصَاب"
      generation_method: majaz
      justification: "إزاحة دلالية من المعنى الشرعي (الحدّ الأدنى للزكاة) إلى معنى العدد الأدنى اللازم لصحة التصويت. لكن النصاب يعني الحدّ الأدنى للانعقاد (quorum) لا الأغلبية."

stage2_evidence:
  per_lemma:
    - lemma: "أَغْلَبِيَّة"
      confirm:
        - text: "«(الأغلبية) الكثرة والأغلبية المُطلقة (في الانتخاب أو الاقتراع) أصوات نصف الحاضرين بزيادة واحد (محدثة) والأغلبية النسبية زيادة أحد المرشحين في الأصوات بالنسبة إلى غيره (محدثة)»"
          source: "المعجم الوسيط (OCR، entry 20711)"
        - text: "«(الأغلبية) الْكَثْرَة والأغلبية الْمُطلقَة (فِي الانتخاب أَو الاقتراع) أصوات نصف الْحَاضِرين بِزِيَادَة وَاحِد (محدثة)»"
          source: "المعجم الوسيط (Hawramani، entry 867657)"
      expands:
        - text: "«أغلبية — majority — majorité»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM، entry 400108)"
          addition: "يؤكد المقابل الإنجليزي majority والفرنسي majorité"
        - text: "«أغلبية، أكثرية — majority — majorité»"
          source: "المعجم الموحد لمصطلحات القانون 2017 (ARABTERM، entry 413464)"
          addition: "يجمع بين أغلبية وأكثرية كمترادفين في المجال القانوني"

    - lemma: "أَغْلَبِيَّة مُطْلَقَة"
      confirm:
        - text: "«أغلبية يُشترط فيها على الأقل نصف الأعضاء أو الأصوات زائد واحد.»"
          source: "المعجم الموحد لمصطلحات القانون 2017 (ARABTERM، entry 411554)"
        - text: "«الأغلبية المُطْلَقَةُ (فى الانتخاب أو الاقتراع): أصوات نصف الحاضرين بزيادة واحد (محدثة)»"
          source: "المعجم الوسيط (OCR، entry 20711، تعريف ١)"

    - lemma: "أَكْثَرِيَّة"
      confirm:
        - text: "«(الأكثرية) الأغلبية (انْظُر غلب)»"
          source: "المعجم الوسيط (Hawramani، entry 867744)"
        - text: "«الأكثرية المُطْلَقة — absolute majority»"
          source: "المورد الحديث 2008 (ARABTERM، entry 668437)"
      expands:
        - text: "«الصواب والرتبة: كانت أكْثَرِيَّة الناخبين من النساء [فصيحة]. التعليق: جاء ضمن قرارات مجمع اللغة المصري أنه إذا أريد صنع مصدر من كلمة يزاد عليها ياء النسب والتاء... فيصاغ من اسم التفضيل كما في هذا المثال. وقد وردت هذه الكلمة في المعاجم الحديثة كالوسيط والأساسي.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (Hawramani، entry 850349)"
          addition: "إقرار مجمعي بفصاحة أكثرية كمصدر صناعي من أكثر"

    - lemma: "غَالِبِيَّة"
      contradicts:
        - text: "«ليس هناك أيّ مبرر لتخطئة كلمة غالبية وقبول أغلبية... فالأولى مصدر صناعي من اسم الفاعل غالب، والثانية من أفعل التفضيل أغلب ولكل منهما دلالته الخاصة. فالأولى تدل على الكثرة فقط، ولكن الثانية تدل على الأكثرية وتجاوز حد الكثرة.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (Hawramani، entry 854232)"
          conflict: "غالبية تدلّ على الكثرة فحسب دون الدلالة على تجاوز النصف، بينما التعريف يشترط أكثر من ٥٠٪"

    - lemma: "نِصَاب"
      contradicts:
        - text: "«النِّصَابُ: الأصل والمرجع... القدر الذى عنده تجب الزَّكاة (من المال)... العدد الذى يصح به عقد الجلسة (محدثة)»"
          source: "المعجم الوسيط (OCR، entry 29294)"
          conflict: "النصاب يعني الحدّ الأدنى للانعقاد (quorum) لا أغلبية الأصوات"
        - text: "«نِصاب — quorum — quorum. عدد الأعضاء اللازم حضورهم لانعقاد مجلس أو جمعية عامة أو اجتماع معين.»"
          source: "المعجم الموحد لمصطلحات القانون 2017 (ARABTERM، entry 414064)"
          conflict: "المقابل الإنجليزي quorum يؤكد أن النصاب مفهوم مختلف عن الأغلبية"

stage3_analysis:
  per_lemma:
    - lemma: "أَغْلَبِيَّة"
      decision: confirmed
      decision_reason: "لمّة أصيلة مثبتة في المعجم الوسيط بالمعنى المطلوب تماماً: «أصوات نصف الحاضرين بزيادة واحد». مصدر صناعي قياسي من أغلب. تحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ العام للأغلبية بنوعيها (مطلقة ونسبية)؛ يُفهم من السياق أيّهما المقصود. أشيع استعمالاً وأكثر تداولاً من أكثرية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَغْلَبِيَّة"

    - lemma: "أَغْلَبِيَّة مُطْلَقَة"
      decision: confirmed
      decision_reason: "مركّب وصفي ثابت مسجّل في المعجم الموحد لمصطلحات القانون والمعجم الوسيط بالتعريف ذاته: نصف الأصوات زائد واحد. يطابق تعريف المجموعة تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يقيّد مفهوم الأغلبية بالنوع المطلق (>٥٠٪) صراحةً، بخلاف «أغلبية» التي قد تحتمل النسبية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَغْلَبِيَّة مُطْلَقَة"

    - lemma: "أَكْثَرِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف مثبت في المعجم الوسيط: «الأكثرية: الأغلبية». أقرّه مجمع اللغة المصري كمصدر صناعي فصيح. مستعمل في السياق الانتخابي في المورد الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مرادف تام لأغلبية لكنه مشتق من جذر «كثر» مباشرة؛ يُفضَّل في بعض السياقات العلمية والإعلامية، وشائع في الاستعمال الشامي."
      actions:
        - command: create_entry
          params: {lemma: "أَكْثَرِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "غَالِبِيَّة"
      source: stage1
      decision: removed
      decision_reason: "معجم الصواب اللغوي يميّز بوضوح: غالبية تدلّ على الكثرة فحسب، بينما أغلبية تدلّ على الأكثرية وتجاوز الحدّ. التعريف يشترط «أكثر من نصف الأصوات» وهو ما لا تضمنه غالبية دلالياً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "نِصَاب"
      source: stage1
      decision: removed
      decision_reason: "النصاب يعني العدد الأدنى لصحة الانعقاد (quorum) لا أغلبية الأصوات. المعجم الوسيط والمعجم الموحد للقانون يؤكدان هذا التمييز."
      evidence_assessment:
        case: contradicts_only

