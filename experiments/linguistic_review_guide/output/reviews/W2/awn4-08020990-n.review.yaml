stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'متشعب' تعني لغوياً المتفرع (furcate/forked)، وليست الترجمة الأكثر دقة أو شيوعاً للمصطلح الرياضي الطوبولوجي Manifold."
      - "التعريف الحالي ركيك الترجمة ويفتقر للصياغة العلمية الرياضية الدقيقة."
    observations: "المفهوم يشير إلى الفضاء الطوبولوجي (Manifold) الذي يشبه الفضاء الإقليدي محلياً. المصطلحات الأكثر شيوعاً واستقراراً في الرياضيات العربية هي 'متنوعة' (في المغرب العربي وتأثراً بالفرنسية) أو 'متعدد شعب' (في المشرق العربي)."
  blind_candidates:
    - lemma: "مُتَنَوِّعَة"
      generation_method: ishtiqaq
      justification: "مستعملة بكثرة في القواميس والأدبيات الرياضية كترجمة للمصطلح الإنجليزي Manifold."
    - lemma: "مُتَعَدِّدُ شُعَبٍ"
      generation_method: tarkib
      justification: "تركيب وصفي شائع ومستقر في الجامعات العربية لترجمة المصطلح الطوبولوجي Manifold."
    - lemma: "مُتَعَدِّدُ طِيَّاتٍ"
      generation_method: tarkib
      justification: "ترجمة حرفية جزئية تستخدم كلمة الطية لتمثيل الانثناء الهندسي وتعدده."
    - lemma: "طِيَّة رِيَاضِيَّة"
      generation_method: tarkib
      justification: "استخدام مجازي واشتقاقي لـ 'طية' (المألوفة في الجيولوجيا) وتخصيصها بالرياضيات."

stage2_evidence:
  per_lemma:
    - lemma: "مُتَشَعِّب"
      contradicts:
        - text: "forked; forky; furcate"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "الكلمة تدل على التفرع الحيوي، وهو يختلف دلالياً عن البنية الطوبولوجية (Manifold) التي تصف فضاءً متصلاً."
    - lemma: "مُتَنَوِّعَة"
      confirm:
        - text: "manifold"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
    - lemma: "مُتَعَدِّدُ شُعَبٍ"
      evidence_status: "no_material_found"
    - lemma: "مُتَعَدِّدُ طِيَّاتٍ"
      evidence_status: "no_material_found"
    - lemma: "طِيَّة"
      expands:
        - text: "fold - بنية مطوية في طبقات الصخور"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "يُستخدم مصطلح 'طية' للتعبير عن الانثناءات (fold) وخاصة في الجيولوجيا، ونادراً ما يُستخدم منفرداً للتعبير عن المنطوى الطوبولوجي (manifold)."

stage3_analysis:
  per_lemma:
    - lemma: "مُتَنَوِّعَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد وموثق في المعاجم المتخصصة (المعجم الموحد لمصطلحات الرياضيات والفلك) للتعبير عن Manifold الرياضي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُتَنَوِّعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
          
    - lemma: "مُتَعَدِّدُ شُعَبٍ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مستخدم ومستقر على نطاق واسع في الأدبيات الرياضية الأكاديمية المعاصرة لترجمة Manifold."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "مُتَعَدِّدُ شُعَبٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُتَشَعِّب"
      decision: removed
      decision_reason: "مصطلح يدل أساساً على التفرع (furcate) ولا يعبر بدقة عن المفهوم الطوبولوجي لـ Manifold. استُبدل بالبدائل المعتمدة في الرياضيات."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُتَعَدِّدُ طِيَّاتٍ"
      source: stage1
      decision: removed
      decision_reason: "غير شائع مقارنة بالبدائل المعتمدة."
      evidence_assessment:
        case: no_material
        
    - lemma: "طِيَّة رِيَاضِيَّة"
      source: stage1
      decision: removed
      decision_reason: "ترجمة غير قياسية وغير مستخدمة بهذا التركيب."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "مجموعة من النقاط مثل تلك الموجودة على سطح مغلق أو نظير في ثلاثة أبعاد أو أكثر"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة ركيكة لا توضح المفهوم الطوبولوجي الدقيق بشكل علمي صحيح."
    authored:
      - type: terminological
        text: "فضاء طوبولوجي يشبه فضاء إقليديا في جوار كل نقطة من نقاطه، ويمكن أن يكون بأبعاد متعددة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "فضاء طوبولوجي يشبه فضاء إقليديا في جوار كل نقطة من نقاطه، ويمكن أن يكون بأبعاد متعددة."}

  examples:
    per_lemma:
      - lemma: "مُتَنَوِّعَة"
        examples:
          - text: "تُعد الكرة في الفضاء الثلاثي الأبعاد متنوعة ثنائية الأبعاد."
            type: usage
      - lemma: "مُتَعَدِّدُ شُعَبٍ"
        examples:
          - text: "تُدرس خصائص متعددات الشعب في الهندسة التفاضلية."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُعد الكرة في الفضاء الثلاثي الأبعاد متنوعة ثنائية الأبعاد."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُدرس خصائص متعددات الشعب في الهندسة التفاضلية."}

