step0_evidence:
  per_lemma:
    - lemma: "لافظ"
      confirm:
        - text: "«(اللَّفْظُ) : كل لفظ قال به اللسان تاما كان أو ناقصا» — المحكم والمحيط الأعظم"
        - text: "«(تلفظ) بالكلمات: نطق بها» — المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«حقيقة النطق اللفظ الذي هو كالنطاق للمعنى في ضمه وحصره» — المفردات في غريب القرآن"
    - lemma: "مصوت"
      confirm:
        - text: "«مصوت: [في اللسانيات] صفة الحركات التي تسمع دون أن تعتمد على صوت آخر؛ سونات Sonant» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(صاتت) الشجرة: صوتت بها الريح» — تاج اللغة وصحاح العربية"
      peripheral_observations:
        - "اللمة تستخدم غالباً في اللسانيات لوصف الأصوات (Sonant) وليس الكائنات، لكنها تشتق قياساً للدلالة على الفاعل."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "متلفظ"
      source_section: "step4_fts_keyword"
      evidence_citation: "«تلفظ: فعل الأداء الكلامي في استعمال اللغة، ينتج عنه كلام أو قول مفيد بالقصد. إنه فعل الإبداع لدى المتكلم.» — مسرد الإعلام والتواصل (ArabTerm)"
      justification: "الاسم المشتق من 'تلفظ' (Vocalize) لتمثيل القائم بالفعل."
  knowledge_candidates:
    - lemma: "ناطق"
      justification: "المصطلح العربي التقليدي لوصف الكائن القادر على الصوت والنطق، ويستخدم في المنطق لتعريف الإنسان (حيوان ناطق) لتمييزه عن الصامت والأعجم."
      generation_notes: "اشتقاق اسم فاعل من الجذر (نطق) وهو الأقرب لدلالة 'utterer'."

step1_lemma_validation:
  per_lemma:
    - lemma: "لافظ"
      decision: confirmed
      decision_reason: "مصطلح فصيح يمثل الفاعل من 'لفظ' (utter)، ويتوافق مع التعريف الإنجليزي 'utterer'."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب العضوي لإخراج اللفظ أو طرحه من الفم."
      example: "يعد الإنسان الكائن اللافظ الوحيد الذي يحول الأصوات إلى رموز لغوية معقدة."
    - lemma: "مصوت"
      decision: confirmed
      decision_reason: "مستخدم في اللسانيات الحديثة كترجمة لـ 'vocalizer' أو 'sonant'، وهو مشتق قياسي صحيح."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على إنتاج الصوت (vocalizing) بحد ذاته بغض النظر عن محتواه اللغوي."
      example: "هناك كائنات مصوتة في الطبيعة تستخدم الترددات الصوتية للتواصل دون نطق كلمات."
    - lemma: "ناطق"
      source: step05
      decision: confirmed
      decision_reason: "الأكثر شيوعاً واستقراراً في التراث العربي (المنطق والفلسفة) للدلالة على الكائن ذي القدرة على النطق."
      step05_citation: "«الإنسان حيوان ناطق: مفكر» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يمتاز بارتباطه بالقدرة الإدراكية والعقلية المصاحبة للنطق في السياق الفلسفي، لكنه لغوياً يغطي مجرد القدرة على إخراج الأصوات المقطعة."
      example: "تختلف الكائنات الناطقة عن الصامتة بقدرتها على التواصل الصوتي الممنهج."
    - lemma: "متلفظ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق مستخدم في اللسانيات الحديثة (ArabTerm) لتمثيل الفاعل من 'تلفظ'."
      step05_citation: "«تلفظ: فعل الأداء الكلامي في استعمال اللغة... إنه فعل الإبداع لدى المتكلم» — مسرد الإعلام والتواصل"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على 'فعل الأداء' (utterance performance) في سياق تواصل محدد."
      example: "يؤثر السياق النفسي للمتلفظ على نبرة الأصوات التي يخرجها."

