# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'تعرج' مُثبتة بلا تشكيل، والشكل المعجمي الصحيح هو المصدر الصريح تَعَرُّج (وزن تفعُّل)"
      - "التعريف دوريّ: يستخدم 'التعرج' لتعريف المجموعة ذاتها"
      - "كلمة 'جودة' ترجمة حرفية من الإنجليزية (quality)؛ الأولى استخدام 'صفة' أو 'خاصية' بأسلوب المعجم العربي"
      - "دخول 'تَعَرَّجَ' في قاعدة البيانات بصيغة فعل (pos: verb) وهو ما يستوجب التثبُّت من طبيعة الربط في المجموعة الاسمية"
      - "المجموعة تقتصر على لمّة واحدة مما يستدعي البحث عن مرادفات وتوسيع التغطية المعجمية"
    observations: >
      المجموعة تُعبِّر عن الخاصية المجردة للتعرُّج، وهي سمة تُوسَم بها المسارات والأشكال الهندسية
      ذات الانعطافات الحادة المتتالية. الجذر (عرج) أصيل، وابن فارس يُقيِّده بـ«الميل والميل»،
      وينصّ على أن «مُنعرَجه: حيث يميل يمنةً ويسرة»، وهو ما يُلاقي مفهوم «تبديل الاتجاهات
      بحدة». وردت للمصطلح مقابلات متعددة في ARABTERM: (tortuosity / sinuosity / zigzag)
      تؤكد ملاءمته. كذلك يستحق الفحصَ إدراجُ مصطلح تَعَوُّج الذي ورد بمقابل (crookedness)
      في معجمَي الجيولوجيا وعلوم الزلازل.
  blind_candidates:
    - lemma: "اِعوجاج"
      generation_method: ishtiqaq
      justification: "مصدر اعوجَّ (وزن افعلال) من جذر ع-و-ج؛ يدلّ على حالة الاعوجاج والانحراف
        الحادّ عن الاستقامة، وهو مناظر لتعرُّج في منطقة المعنى ذاتها"
    - lemma: "تَمَعُّج"
      generation_method: ishtiqaq
      justification: "مصدر تمعَّجَ (وزن تفعُّل) من جذر م-ع-ج؛ يُشير إلى الحركة المتموِّجة
        والمتذبذبة، واستُعمل في المعجمية العربية الحديثة للدلالة على التعرُّج (tortuosity / sinuosity)"
    - lemma: "وُعُورَة"
      generation_method: majaz
      justification: "مجاز إزاحي: الوُعورة أصلها صعوبة الأرض وكثرة مسالكها المتعرجة؛ يمكن
        إزاحتها دلالياً للخاصية المجردة للتشعب والتغيُّر الحاد في الاتجاه"
    - lemma: "اِنعراج"
      generation_method: ishtiqaq
      justification: "مصدر انعرجَ (وزن انفعال) من جذر ع-ر-ج؛ ابن فارس يذكر 'مُنعرَجُه: حيث
        يميل يمنةً ويسرةً'، وهو يُلاقي خاصية التحوُّل الحاد بين الاتجاهات"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تعرج"
      confirm:
        - text: "«انعطف ومال»"
          source: "المعجم الوسيط (OCR) — entry_id 18518"
        - text: "«(تعرج) انعطف وَمَال يُقَال تعرج الْبناء وتعرج النَّهر»"
          source: "المعجم الوسيط — Hawramani entry_id 891000"
        - text: "«تَعرُّج» — translation_en: tortuosity"
          source: "المعجم الموحد لمصطلحات المياه (2000) — entry_ids 392518, 393000"
        - text: "«1- نسبة الطول الفعلي لمجرى نهر بين نقطتين، مقيساً على طول محور المجرى الرئيسي،
            إلى أقصر مسافة (الخط المستقيم) بين هاتين النقطتين. 2- التحديد نفسه ينطبق على
            المسار المتعرج لجريان المياه الجوفية.»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — entry_id 393000"
        - text: "«يعني مُصطلح التعرُّج في هذا السياق فقد الضغط الحادث بسبب تضييق وعوج المسار
            الذي يجب أن تمر عبره الموائع القادمة من البئر المحفورة لتصل إلى الجِسم المركزي
            للشِق.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — entry_id 382565"
        - text: "«تَعَرُّج» — translation_en: sinuosity"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — entry_id 433296"
        - text: "«(1) تَعَرُّج؛ تَمَعُّج؛ تَلَوٍّ (2) شيء متعرِّج أو متمعِّج.» — translation_en: sinuosity"
          source: "المورد الحديث (2008) — entry_id 717419"
        - text: "«(1) تمعُّج؛ تعرُّج (2) التواء؛ انحناء.» — translation_en: tortuosity"
          source: "المورد الحديث (2008) — entry_id 724158"
        - text: "«(1) «أ» خطٌّ متعرِّج. «ب» أحد أقسام هذا الخطّ (2) شيء متعرِّج [كطريق أو
            تصميم هندسيّ] (3) بتعرُّج (4) مُتَعرِّج (5) يُعَرِّج...» — translation_en: zigzag"
          source: "المورد الحديث (2008) — entry_id 730313"
      contradicts:
        - text: "«في الملاحة الجوية: دوران الطائرة حول محورها العموديّ، وذلك لجعل المحور الطولانيّ
            للطائرة (أو السفينة) منحرفاً عن خط الطيران.» — translation_en: yaw"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004) — entry_id 466982"
          conflict: "دلالة 'يو' (yaw) خاصة بدوران المركبة حول محورها الرأسي، وهي أُدرجت
            تحت تعرُّج بسبب التشابه الظاهري في الانعطاف، لكنها بعيدة عن مفهوم المجموعة"

    - lemma: "اِعوجاج"
      confirm:
        - text: "«ما لا التواءَ فيه ولا اعوجاجَ بل على جهة القصد»"
          source: "التوقيف على مهمات التعاريف للمناوي — entry_id 814235"
      contradicts:
        - text: "«اعوجاج» — translation_en: distortion"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — entry_id 401098"
          conflict: "اعوجاج في الاقتصاد يقابل (distortion) بمعنى التشويه والتحريف الاقتصادي،
            وهو بعيد عن مفهوم التعرُّج كخاصية هندسية"
        - text: "«اعوجاج» — translation_en: rhaebosis"
          source: "المعجم الطبي الموحد (2009) — entry_id 641058"
          conflict: "rhaebosis = تقوُّس الساقين (bow-leggedness)، تخصُّص طبيّ لا علاقة له
            بالخاصية الهندسية للتعرُّج"

    - lemma: "تَمَعُّج"
      contradicts:
        - text: "«التَّمَعُّج» — translation_en: enterocinesia (peristalsis)"
          source: "المعجم الطبي الموحد (2009) — entry_id 573943"
          conflict: "التمعُّج في المعجمية الطبية العربية مصطلح تقني للحركة التمعُّجية المعوية
            (peristalsis)، وهو مستقل تماماً عن مفهوم التعرُّج الهندسي"
        - text: "«الْمِيمُ وَالْعَيْنُ وَالْجِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَقَلُّبٍ
            وَسُرْعَةٍ فِي شَيْءٍ. وَمَعَجَ الْحِمَارُ مَعْجًا: تَقَلَّبَ فِي جَرْيِهِ.»"
          source: "مقاييس اللغة لابن فارس — entry_id 988910"
          conflict: "الدلالة الأصلية للجذر معج هي التقلُّب والسرعة في الحركة (rolling / speed)
            لا التعرُّج الهندسي؛ استعمال تمعُّج بمعنى sinuosity هو توسيع متأخر محدود"

    - lemma: "وُعُورَة"
      evidence_status: "no_material_found"

    - lemma: "اِنعراج"
      contradicts:
        - text: "«هو حركة دوران السيارة حول محورها العمودي أو الرأسي.» — translation_en: yaw"
          source: "مسرد هندسة وتكنولوجيا السيارات — entry_id 373897"
          conflict: "الانعراج في هندسة السيارات يقابل (yaw)، وهو دوران موحَّد حول محور عمودي،
            لا يُلاقي مفهوم التعرُّج كخاصية انعطاف متكرر"
        - text: "«انعراج» — translation_en: diffraction"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — entry_id 426471"
          conflict: "الحيود (diffraction) ظاهرة موجية في الضوء والصوت، لا صلة له بالتعرُّج
            الهندسي"
        - text: "«انعراج» — translation_en: yaw"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000) — entry_id 444935"
          conflict: "يؤكد الاستعمال التقني لـ yaw لا التعرُّج"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تعرج"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة جوهرياً؛ جذرها (عرج) أصيل، وابن فارس يُثبت التعرُّج في باب
        «الميل»، ومنعرَجُه «حيث يميل يمنةً ويسرة»، وهو بالضبط مفهوم تبديل الاتجاهات
        بحدة. المعاجم المتخصصة تترجمها بـ(tortuosity / sinuosity / zigzag).
        الشكل المُسجَّل في AWN بلا تشكيل ويُحتمل أنه أُدخل كصيغة فعلية؛ الصواب
        تَعَرُّج (مصدر تَعَرَّجَ، وزن تفعُّل) ليتوافق مع طبيعة المجموعة الاسمية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphology_check:
        pattern: "تَفَعُّل"
        suitability: "ملائم جداً — وزن تفعُّل يُعبِّر عن الحالة المُتحوِّلة والتكررية، مناسب
          للخاصية الهندسية المجردة"
      nuance_differentiation: >
        اللمّة الوحيدة المؤكَّدة في المجموعة؛ تُركِّز على الخاصية الهندسية للانعطاف الحادّ
        المتكرر مع تبادل الاتجاهات، وتتميَّز عن الاعوجاج (انحراف دائم دون تكرار منتظم)
        وعن الالتواء (انفتال لولبي) وعن الانعراج (دوران موحَّد حول محور)
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَرُّج"

    - lemma: "اِعوجاج"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الجذر (عوج) يُلاقي معنى الانحراف، فإن المعاجم المتخصصة تُخصِّص
        اعوجاج لـ(distortion) الاقتصادي و(rhaebosis) الطبي. الاستعمال الكلاسيكي
        يُثبته في سياق الاستقامة مقابل الاعوجاج (ما لا اعوجاج فيه)، وهو وصف
        للحالة الثنائية لا خاصية مستقلة. لا يختلف بما يكفي عن تَعَرُّج ليكون
        مرادفاً مضافاً، فضلاً عن اندراجه في حقل الاقتصاد والطب بمعانٍ بعيدة.
      evidence_assessment:
        case: mixed

    - lemma: "تَمَعُّج"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر معج في مقاييس اللغة يدلّ على «تقلُّب وسرعة» لا على التعرُّج الهندسي.
        والمعجم الطبي الموحد يُثبِّت التمعُّج مصطلحاً تقنياً لـ(peristalsis)
        — الحركة التمعُّجية المعوية — مما يجعل إضافته لهذه المجموعة مُضلِّلاً.
        استعماله في المورد الحديث مقابلاً لـsinuosity هو توسيع دلالي متأخر لا يرقى
        إلى درجة المصطلح المُثبَّت في هذا المجال.
      evidence_assessment:
        case: contradicts_only

    - lemma: "وُعُورَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة تربط وُعورة بالمجموعة الدلالية للتعرُّج كخاصية هندسية مجردة؛
        ورد المصطلح فقط في مركَّب «مقياس وعورة الطريق» = profilometer (جهاز قياس
        مقطع الرصيف)، وهو بعيد عن المفهوم. المجاز مُقترَح لكنه لم يُثبَّت معجمياً.
      evidence_assessment:
        case: no_material

    - lemma: "اِنعراج"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم المتخصصة تُثبِّت انعراج حصراً لمعنيَيْن تقنيَّيْن: (yaw) في هندسة
        السيارات والملاحة، و(diffraction) في الكيمياء والفيزياء. كلاهما بعيد عن
        مفهوم التعرُّج. الاشتقاق من عرج صحيح لكن السياق الاصطلاحي المُثبَّت يمنع
        توظيف المصطلح في هذه المجموعة.
      evidence_assessment:
        case: contradicts_only


