# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (نَاقِر) ترد في المعاجم الكلاسيكية بالمعنى الأوّلي «السهم يصيب الهدف»، لا بوصفها شخصاً ينقر سطحاً، مما يُضعف الدليل التراثي المباشر"
      - "التعريف العربي يستخدم الفعل «يضرب» والأدقُّ «يَنقُر» لأن الجذر المنتخب (نقر) يحدد طبيعة الفعل ويؤكد الخفّة"
      - "المجموعة تفتقر إلى مرادفات تُعزّز التغطية الدلالية"
    observations: >
      المفهوم المستهدف (tapper: شخص يقرع سطحاً قرعاً خفيفاً متكرراً) له أصل راسخ في العربية
      عبر الجذر (ن ق ر) الذي أثبت ابن فارس دلالته على «قرع شيء حتى تُهزم فيه هزمة».
      اسم الفاعل (نَاقِر) والمبالغة (نَقَّار) كلاهما مشتقّان قياسيّان. الجذران (ق ر ع) و(د ق ق)
      حاضران في اللغة لكنهما يميلان إلى الشدة أو يحملان دلالات مشغولة.
      الوزن فَعَّال أنسب للإفادة من التكرار الذي يُعدّ قيداً جوهرياً في المفهوم.
  blind_candidates:
    - lemma: "نَقَّار"
      generation_method: ishtiqaq
      justification: >
        صيغة مبالغة على وزن فَعَّال من جذر (نقر)، تدل على كثرة النقر وتكراره؛ وهي أنسب
        من اسم الفاعل (فاعل) للتعبير عن القيد «عادةً بشكل متكرر» الوارد في التعريف.
    - lemma: "طَارِق"
      generation_method: majaz
      justification: >
        اسم فاعل من (طرق) بمعنى «من يطرق»؛ توسيعٌ مجازي من الطرق الليلي إلى قرع
        أيّ سطح. لكن دلالاته الأولى (الآتي ليلاً، النجم) تُثقل الإزاحة الدلالية.
    - lemma: "قَارِع"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من (قرع) بمعنى «من يقرع سطحاً»؛ ورد «قارع الباب» مقابلاً لـ rapper
        في المورد الحديث، وإن كان تعبيراً مركباً مقيّداً.
    - lemma: "دَقَّاق"
      generation_method: ishtiqaq
      justification: >
        صيغة مبالغة من (دق) تدل على كثرة الدق؛ وإن كانت المعاجم تُغلّب عليها معنى
        طاحن الأبازير، مما يُولّد تنافساً دلالياً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1: مطابقة دفعية — ناقر، نقار، طارق، قارع، دقاق (+ صيغ ال-)
#   Q2: الجسر الإنجليزي — tapper, knocker, rapper, drummer, percussionist
#   Q3: FTS عربي — نقر، يضرب، طرق، قرع، دق
#   Q4: مقاييس اللغة — جذر نقر (dictionary_id=151)
stage2_evidence:
  per_lemma:

    # ── نَاقِر (اللمّة الموجودة) ──────────────────────────────
    - lemma: "نَاقِر"
      confirm:
        - text: "«ناقِر — beater»"
          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
      contradicts:
        - text: "«النَّاقِرُ: السهم يصيب الهدف — أخطأت نواقره: لم يستقم على الصواب»"
          source: "المعجم الوسيط"
          conflict: "المعنى الكلاسيكي المثبَّت للناقر هو السهم المصيب للهدف، لا الشخص الناقر"
        - text: "«(الناقر) السهْم يُصِيب الهدف وَيُقَال أَخْطَأت نواقره لم يستقم على الصَّوَاب (ج) نواقر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
          conflict: "تكرار الدلالة السهمية في مصدر حديث آخر يُعزز أن المعنى الإنساني غير موثَّق كلاسيكياً"
      expands:
        - text: "«النُّونُ وَالْقَافُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قَرْعِ شَيْءٍ حَتَّى تُهْزَمَ فِيهِ هَزْمَةٌ، ثُمَّ يُتَوَسَّعُ فِيهِ. مِنْهُ مِنْقَارُ الطَّائِرِ، لِأَنَّهُ يَنْقُرُ بِهِ الشَّيْءَ حَتَّى يُؤَثِّرَ فِيهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الجذري يُثبت دلالة القرع الخفيف المؤثر في الشيء، مما يُجيز اشتقاق ناقر بمعنى «من ينقر» قياساً على الاسم الصحيح"

    # ── نَقَّار (مرشح المرحلة ١) ──────────────────────────────
    - lemma: "نَقَّار"
      confirm:
        - text: "«النَّقَّارُ: الكثير النَّقْر — رَجُلٌ نَقَّارٌ: بحَّاث عن الأمور والأخبار — مَن يحترف نَقْر الحجارة والخشب — من يَنقُش الرُّكُب واللُّجُم ونحوهما»"
          source: "المعجم الوسيط"
        - text: "«(النقار) الْكثير النقر وَيُقَال رجل نقار بحاث عَن الْأُمُور وَالْأَخْبَار وَمن يحترف نقر الْحِجَارَة والخشب وَمن ينقش الركب واللجم وَنَحْوهمَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
        - text: "«نَقَّار: من (ن ق ر) بمعنى الحفار، والبحاث عن الأمور والأخبار، ومن يحترف نقش الركب واللجم ونحوها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«نقار — woodpecker»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (ARABTERM)"
          conflict: "الاستعمال المصطلحي الحيوي المعاصر خصّص نقار للطائر (نقار الخشب)، مما يُفضي لاشتراك لفظي مع الدلالة الإنسانية"

    # ── طَارِق (مرشح المرحلة ١) ──────────────────────────────
    - lemma: "طَارِق"
      contradicts:
        - text: "«الطَّارِق: الآتى ليلًا — النَّجمُ الثَّاقِبُ — الحادث، أو الحادث ليلًا»"
          source: "المعجم الوسيط"
          conflict: "جميع الدلالات المثبَّتة ترتبط بالقدوم ليلاً أو النجم، لا بقرع سطح بصفة عامة"
        - text: "«الطَّارِقُ: النَّجمُ؛ لِطُلُوعِه ليلًا — من الناس: الآتي ليلًا طلبًا للضيافة أو الاستغاثة — الحديثُ الطَّارِيء لَيْلًا»"
          source: "المعجم الكبير"
          conflict: "الطرق مقيَّد بالليل والاستغاثة، لا بالنقر الخفيف العام"
        - text: "«طارق: الآتي ليلا والنجم الثاقب والحادث»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "لا تُذكر دلالة الشخص الناقر للسطح في أي مصدر"

    # ── قَارِع (مرشح المرحلة ١) ──────────────────────────────
    - lemma: "قَارِع"
      contradicts:
        - text: "«قَارَعَ أَبْطالٌ: ضرب بعضُهم بعضاً بالسيوف في الحرب — القومُ: ضربوا القُرْعَة — قارَعَه فَقَرَعَه: غلبه في القُرْعَة»"
          source: "المعجم الوسيط"
          conflict: "قارَعَ فعل مُفاعَلة يدل على المغالبة بالسيف والاقتراع، لا على النقر الخفيف المتكرر"
      expands:
        - text: "«فا .rap وبخاصة: قارعُ الباب أو مِقْرَعةُ الباب»"
          source: "المورد الحديث (2008)"
          addition: "قارع الباب يرد مقابلاً لـ rapper (من يقرع بابه)، غير أنه تعبير مركب مقيّد بالباب لا صيغة مصطلحية مجردة"

    # ── دَقَّاق (مرشح المرحلة ١) ──────────────────────────────
    - lemma: "دَقَّاق"
      contradicts:
        - text: "«الدَّقَّاق: من يدق الأبازير — بائع الدقيق»"
          source: "المعجم الوسيط"
          conflict: "الدلالة مشغولة تماماً بطاحن التوابل وبائع الدقيق"
        - text: "«الدَّقَّاقُ: بائعُ الدَّقيق. مَن يَدُقُّ الْأَبْزارَ. الكَثِيرُ الدَّقِّ, مُبالَغَةً»"
          source: "المعجم الكبير"
          conflict: "حتى المعنى العام «الكثير الدق» يرتبط بالدق الثقيل (الطحن)، وهو يناقض قيد «بخفة»"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── نَاقِر (اللمّة الموجودة) ──────────────────────────────
    - lemma: "نَاقِر"
      decision: confirmed
      decision_reason: >
        اللمّة اسم فاعل قياسي من الجذر العريق (ن ق ر) الذي يدل — كما أثبت ابن فارس —
        على «قرع شيء حتى تُهزم فيه هزمة». وإن كانت المعاجم الكلاسيكية تُغلّب على
        (الناقر) معنى السهم المصيب، فإن الاشتقاق القياسي الصرف يُسوّغ استعمال اسم
        الفاعل بمعنى «من ينقر»، وهو مؤيَّد صراحةً بقاموس ARABTERM الذي يترجمه
        بـ"beater" في سياق الفنون والرياضة. التشكيل حاضر ولا تصحيح مطلوب.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      quality_gate:
        consistency: "اطّراد — اسم فاعل قياسي من ثلاثي مجرد"
        ease_of_use: "مقبول — خفيف على اللسان، قابل للتصريف والإضافة"
        appropriateness: "ملائم — الجذر نقر يحدد طبيعة الفعل بدقة"
        heritage_preference: "تراثي — الجذر عريق وورد في مقاييس اللغة"
        morphological_fit: "وزن فاعل مناسب لاسم الفاعل من الثلاثي"
      nuance_differentiation: >
        نَاقِر يُعبّر عن الفاعل اللحظي/الوصفي للنقر (اسم فاعل عام)، بلا تخصيص في
        درجة التكرار أو الاحتراف، بخلاف نَقَّار الذي يُفيد الكثرة والإيقاع المنتظم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَاقِر"

    # ── نَقَّار (مرشح المرحلة ١) ──────────────────────────────
    - lemma: "نَقَّار"
      source: stage1
      decision: confirmed
      decision_reason: >
        صيغة المبالغة (فَعَّال) من جذر (ن ق ر) مثبَّتة في المعجم الوسيط والكبير بمعنى
        «الكثير النَّقْر»، وهو المعنى الذي يُغطّي مباشرةً قيد «عادةً بشكل متكرر» في
        تعريف المجموعة. اشتراك اللفظ مع الطائر (نقار الخشب) اشتراك دلالي مقبول
        معجمياً لأنه سنة ثابتة في العربية (نفس الوزن لكليهما)، ولا يُلغي دلالة الإنسان
        الناقر التي تسبق الاستعمال الحيوي. اجتاز اختبار السكّ: نقار = مصطلح محدد
        لا يقبل إبدال مكوناته.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      quality_gate:
        consistency: "اطّراد — وزن فعّال منتج في العربية"
        ease_of_use: "مريح — شائع الاستعمال"
        appropriateness: "ملائم — المبالغة تُلائم التكرار الضروري"
        heritage_preference: "تراثي — مثبَّت في الوسيط"
        morphological_fit: "فعّال للمبالغة في الفعل، مناسب جداً"
      nuance_differentiation: >
        نَقَّار يُفيد المبالغة والتكرار المنتظم والاحتراف، يُوصف به من يُوقّع بانتظام
        (كالنقر على الطبلة أو الطاولة)، بينما نَاقِر أعمّ وأوصف.
      actions:
        - command: create_entry
          params: {lemma: "نَقَّار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10711096-n"}

    # ── طَارِق (مرشح المرحلة ١) ──────────────────────────────
    - lemma: "طَارِق"
      source: stage1
      decision: removed
      decision_reason: >
        تُثبّت جميع الشواهد المعجمية طارقاً في دلالات بعيدة كل البعد عن المفهوم:
        الآتي ليلاً، والنجم الثاقب، واسم العَلَم. الطرق مقيَّد بالباب ليلاً وليس بأي
        سطح، فضلاً عن أن الإزاحة الدلالية تُثقّل اللمّة. الاشتقاق المجازي مرفوض
        لعدم وجود مشابهة وظيفية كافية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── قَارِع (مرشح المرحلة ١) ──────────────────────────────
    - lemma: "قَارِع"
      source: stage1
      decision: removed
      decision_reason: >
        قارَعَ في المعاجم فعل مُفاعَلة يدل على المغالبة بالسيوف أو الاقتراع، وكلاهما
        بعيد عن النقر الخفيف. التعبير «قارع الباب» قريب دلالياً لكنه تعبير وصفي مقيَّد
        لا يصلح مصطلحاً مجرداً. لم تجتز اختبار التثبيت المعجمي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── دَقَّاق (مرشح المرحلة ١) ──────────────────────────────
    - lemma: "دَقَّاق"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المعجمية مشغولة تماماً بطاحن الأبازير وبائع الدقيق. معنى «الكثير الدق»
        مرتبط بالدق الثقيل لا الخفيف، وهو يناقض القيد الجوهري «بخفة» في المجموعة.
        اشتراك لفظي عائق لا يمكن تجاوزه.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


