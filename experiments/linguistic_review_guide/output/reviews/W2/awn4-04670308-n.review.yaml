      sense_id: "{auto}"
      nuance: "يركز على حالة الوعي المستمر وعدم الغفلة، وغالباً ما يقترن بالوعي الذهني."
      mwe: false
    - lemma: "تَيَقُّظ"
      sense_id: "{auto}"
      nuance: "يدل على تكلف اليقظة والمبالغة في الاستعداد الدائم والحذر."
      mwe: false
  synset:
    cultural_fit: native
  actions:
