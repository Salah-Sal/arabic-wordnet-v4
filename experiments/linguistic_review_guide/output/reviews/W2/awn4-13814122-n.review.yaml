# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تَوَالٍ"
      decision: confirmed
      decision_reason: "لمّة مُعتمدة بأدلة راسخة من المعاجم التقنية الموحدة. 'على التوالي' هو المصطلح العربي الموحّد في موسوعة الكهرباء IEC 60050 ومعاجم الطاقة والهندسة الكهربائية والفيزياء والكيمياء والصيدلة للتعبير عن in series. والشكل المنقوص 'تَوَالٍ' هو المصدر/الاسم القياسي من فعل تَوَالَى (على وزن تَفَاعَلَ) بإعلال اللام، وهو وزن مناسب للمفاهيم التجريدية الوصفية. التشكيل الموجود كامل صحيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تَوَالٍ يُركّز على البُعد الوظيفي الديناميكي للتتابع؛ أي تدفق التيار الكهربائي خلال المكونات واحداً إثر الآخر. يُوظَّف في الغالب في الصيغة الظرفية المُعتمدة 'على التوالي'. أدق من سِلْسِلَة في التعبير عن مسار التيار وطبيعة التدفق التسلسلي."

    - lemma: "سِلْسِلَة"
      decision: confirmed
      decision_reason: "لمّة مقبولة مع التنبيه إلى تعدد الدلالات. تُستخدم في المعجم الموحد للفيزياء بمعنى series، وفي المعجم الطبي لوصف تراكيب تتصل أجزاؤها على التوالي، وفي معاجم الطاقة لوصف سلسلة الخلايا الشمسية. في موسوعة الكهرباء IEC تُقابَل بـ string/chain وليس series تحديداً. تعدد الدلالات لا يُسقطها بالنظر إلى توثيقها في الفيزياء وتراثها الكلاسيكي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "سِلْسِلَة تُركّز على الشكل البنيوي الهيكلي للتوصيل؛ إذ تستحضر صورة الحلقات المترابطة التي يمكن تتبّع مسارها المادي. تُستخدم تحديداً لوصف المجموعات الهيكلية المادية المتصلة (كسلسلة الخلايا الشمسية)، وأوسع دلالةً من تَوَالٍ وأكثر تصويراً للبنية الساكنة دون الديناميكية الوظيفية."

    - lemma: "تَتَابُع"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود 'تتابع' في موسوعة الكهرباء بمعنى sequencing، فإنه يُقابل في المعاجم التقنية المتعددة sequence/succession/progression ولا يُستخدم مصطلحاً مستقلاً للتوصيل على التوالي في الكهرباء والإلكترونيات. الدلالة منصبّة على التتابع الزمني أكثر من التوصيل الكهربائي التسلسلي. يتداخل في المعنى مع تَوَالٍ ولا يُضيف قيمة تمييزية. اختبار التمييز: 'توصيل على التتابع' لا يُقال عربياً بينما 'توصيل على التوالي' راسخ."
      evidence_assessment:
        case: mixed

    - lemma: "نَظْم"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الأصلية (نظم اللؤلؤ في خيط) مجاز شعري جميل لكنه لم ينعقد اصطلاحاً في المجال الكهربائي. تُقابله المعاجم التقنية بـ rhythm/norm/ordering في الطب والرياضيات. يحتمل معاني متعددة (شعر، ترتيب، قرآن، نسق) تجعله غير محدد الدلالة في السياق التقني الإلكتروني. لا يجتاز اختبار السكّ: إبدال 'نظم' بـ 'ترتيب' أو 'نسق' يبقي الوصف صالحاً → ليس مصطلحاً تقنياً مسكوكاً."
      evidence_assessment:
        case: mixed

    - lemma: "تَسَلْسُل"
      source: stage1
      decision: removed
      decision_reason: "رغم وجود 'على التسلسل' بمعنى in series في الفيزياء ومعلوماتية المعجم، فإن تَسَلْسُل بوصفه اسماً مستقلاً يحمل في الفلسفة دلالة 'ترتيب أمور غير متناهية' وفي تقنية المعلومات 'catenation'، مما يُسبب تداخلاً مع سِلْسِلَة (جذر متشابك). الصيغة الموثقة في المعاجم التقنية هي الظرفية 'على التسلسل' لا الاسم المجرد. إضافته ستُنشئ التباساً مع سِلْسِلَة دون تمييز واضح. يفتقر إلى التثبيت المعجمي كلمّة مستقلة للمفهوم المعني."
      evidence_assessment:
        case: mixed

    - lemma: "وَصْل تَتَالِيّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على هذا التركيب في قاعدة البيانات المعجمية. الشكل الموثق في arabterm هو 'توصيل على التوالي' وليس 'وصل تتالي'. يفتقر إلى التثبيت المعجمي. اختبار التثبيت المعجمي: لا وجود له في أي معجم موحد أو متخصص."
      evidence_assessment:
        case: no_material


