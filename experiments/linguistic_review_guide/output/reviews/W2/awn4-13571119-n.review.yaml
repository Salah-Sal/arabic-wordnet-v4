stage1_review:
  assessment:
    concerns:
      - "اللمة (نسخ ذاتي) عبارة وصفية وترجمة حرفية لمصطلح (self-replication) وليست مصطلحاً معجمياً ثابتاً يشير إلى عملية (replication) الأساسية."
      - "التعريف يميل إلى الترجمة الحرفية (يصنع نسخة من نفسه) بدلاً من الصياغة العلمية الرصينة المتبعة في المعاجم المتخصصة."
      - "غياب المصطلحات العلمية المعتمدة في المعاجم الطبية والوراثية مثل (انتساخ) و(تنسخ) عن المجموعة الترادفية الأصلية."
    observations: "المفهوم يتعلق بالعملية الحيوية (replication) في علم الوراثة، والتي يتم فيها تضاعف المادة الوراثية لتكوين نسخة مطابقة. اللمة الموجودة (تضاعف) صحيحة ومستعملة، ولكن المصطلحات الأدق والأكثر تخصصاً هي (انتساخ) و(تنسخ) كما وردت في المعجم الموحد لمصطلحات علم الوراثة والمعجم الطبي الموحد."
  blind_candidates:
    - lemma: "اِنْتِسَاخ"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن (افتعال) من الجذر (نسخ)، وهو يعبر عن عملية النسخ الذاتية والمطابقة بشكل علمي دقيق."
    - lemma: "تَنَسُّخ"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن (تفعُّل) من الجذر (نسخ)، للدلالة على العملية الحيوية التلقائية والمطردة."
    - lemma: "تَضَاعُفٌ ذَاتِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر عن تضاعف المادة من تلقاء نفسها، وهو مصطلح مستعمل في علم الأحياء للدلالة على (self-replication)."
    - lemma: "مُضَاعَفَة"
      generation_method: ishtiqaq
      justification: "مصدر للفعل (ضاعف)، يشير إلى زيادة الشيء وجعله مثلين."

stage2_evidence:
  per_lemma:
    - lemma: "تضاعف"
      confirm:
        - text: "تضاعف المواقع في الصبغيّ بسبب تضاعف مادته الجينية. (translation_en: duplication)"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "ازدياد عدد الوحدات إلى الضعف كعدد الصبغيات (الكروموسومات) مثلا عند الاخصاب. (translation_en: duplication)"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "نسخ ذاتي"
      evidence_status: "no_material_found"
    - lemma: "اِنْتِسَاخ"
      confirm:
        - text: "عملية تضاعف تحتاج إلى نسخ من مرصاف، وتكون كل النسخ متشابهة تماما. (translation_en: replication)"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "تَنَسُّخ"
      confirm:
        - text: "تَنَسُّخُ الدَّنا (translation_en: DNA replication)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "تَنَسُّخٌ مُحافِظ (translation_en: conservative replication)"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "تَضَاعُفٌ ذَاتِيّ"
      confirm:
        - text: "تكاثر جزيء ما بمساعدة دليل يحتويه ذلك الجزيء. (translation_en: self-replication)"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "مُضَاعَفَة"
      contradicts:
        - text: "ظاهرة مرضية تظهر في سياق مرض آخر أو تنتج عنه وقد تزيد من خطره. (translation_en: complication)"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "المعنى الطبي الغالب للمضاعفة هو (complication) المتعلق بالأمراض وليس (replication) للمادة الوراثية."

stage3_analysis:
  per_lemma:
    - lemma: "تضاعف"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشائع الاستخدام في علم الأحياء وعلم الوراثة للإشارة إلى تضاعف المادة الوراثية وتكوين نسخة مطابقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَضَاعُف"

    - lemma: "نسخ ذاتي"
      decision: removed
      decision_reason: "تعبير وصفي حر وترجمة حرفية غير مستقرة مصطلحياً، وتفتقر إلى الشواهد المعجمية المعتمدة في هذا السياق المتخصص، حيث أن المصطلحات الثابتة البديلة هي (انتساخ) و(تنسخ) و(تضاعف)."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اِنْتِسَاخ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح علمي دقيق ومعتمد في مجامع اللغة (مكتب تنسيق التعريب - علم الوراثة) وهو المقابل الدقيق لمصطلح (replication) في الإنجليزية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اِنْتِسَاخ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَنَسُّخ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مستقر وشائع جداً في السياق الطبي المعاصر (كما ورد في المعجم الطبي الموحد) للإشارة إلى استنساخ وتضاعف المادة الوراثية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَنَسُّخ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَضَاعُفٌ ذَاتِيّ"
      source: stage1
      decision: removed
      decision_reason: "بالرغم من وروده في بعض المعاجم كترجمة لـ (self-replication)، إلا أن الاكتفاء بـ (تضاعف) و(انتساخ) و(تنسخ) يغطي الدلالة بالكامل وبشكل أدق، ويغني عن إدراج التراكيب الإضافية كمرادفات مباشرة."
      evidence_assessment:
        case: confirm_only

    - lemma: "مُضَاعَفَة"
      source: stage1
      decision: removed
      decision_reason: "تستخدم في الطب بكثرة بمعنى المضاعفات المرضية (complication)، واعتمادها كمرادف للانتساخ الجيني قد يسبب التباساً واشتراكاً لفظياً غير مرغوب فيه."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "(علم الوراثة) العملية التي يقوم بها الحمض النووي بصنع نسخة من نفسه قبل انقسام الخلية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على ركاكة وترجمة حرفية لعبارة (صنع نسخة من نفسه). الأفضل صياغة تعريف مصطلحي علمي رصين ودقيق وواضح."
    authored:
      - type: terminological
        text: "عملية حيوية يتضاعف فيها الحمض النووي (الدنا) لإنتاج نسخة مطابقة لنفسه، وتحدث قبيل انقسام الخلية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية حيوية يتضاعف فيها الحمض النووي (الدنا) لإنتاج نسخة مطابقة لنفسه، وتحدث قبيل انقسام الخلية."}

  examples:
    per_lemma:
      - lemma: "تَضَاعُف"
        examples:
          - text: "يحدث تَضَاعُفُ الحَمْضِ النَّوَوِيِّ في مَرْحَلَةِ الطَّوْرِ البَيْنِيِّ قَبْلَ انْقِسَامِ الخَلِيَّةِ."
            type: usage
      - lemma: "اِنْتِسَاخ"
        examples:
          - text: "يُعَدُّ اِنْتِسَاخُ الدَّنَا عَمَلِيَّةً أَسَاسِيَّةً لانْتِقَالِ الصِّفَاتِ الوِرَاثِيَّةِ بِدِقَّةٍ إِلَى الأَجْيَالِ القَادِمَةِ."
            type: usage
      - lemma: "تَنَسُّخ"
        examples:
          - text: "تَعْتَمِدُ الفَيْرُوسَاتُ عَلَى تَنَسُّخِ مَادَّتِهَا الوِرَاثِيَّةِ دَاخِلَ الخَلِيَّةِ المُضِيفَةِ لِلْبَقَاءِ والتَّكَاثُرِ."
