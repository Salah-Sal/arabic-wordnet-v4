  per_entry:
    - lemma: "اِنْغِرَاس"
      entry_id: "{auto}"
      root: "غرس"
      maqayis_quote: "«الْغَيْنُ وَالرَّاءُ وَالسِّينُ أَصْلٌ صَحِيحٌ... يُقَالُ: غَرَسْتُ الشَّجَرَ غَرْسًا»"
    - lemma: "تَعْشِيش"
      entry_id: "{auto}"
      root: "عشش"
      maqayis_quote: "«وَمِنْ هَذَا الْقِيَاسِ الْعُشُّ لِلْغُرَابِ عَلَى الشَّجَرَةِ... وَعَشَّشَ الطَّائِرُ: اتَّخَذَ عُشًّا»"
  per_sense:
