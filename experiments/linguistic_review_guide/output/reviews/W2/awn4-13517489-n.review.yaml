stage1_review:
  assessment:
    concerns:
      - "غياب التشكيل عن اللمات الحالية."
    observations: "تتضمن المجموعة الترادفية مصطلحات علمية دقيقة في علم الأجنة (Implantation, Nidation). تم استخدام الاشتقاق (انغراس) والمجاز (تعشيش) لنقل المفهوم بنجاح، وكلا اللمتين معتمد في المعاجم الطبية."
  blind_candidates:
    - lemma: "اِنْغِرَاس"
      generation_method: ishtiqaq
      justification: "مصدر على وزن انفعال من الفعل انغرس، يعبر عن عملية دخول البويضة واستقرارها بتلقائية."
    - lemma: "تَعْشِيش"
      generation_method: majaz
      justification: "استعارة من استقرار الطائر في عشه، للدلالة على استقرار البويضة المخصبة في جدار الرحم."
    - lemma: "اِنْزِرَاع"
      generation_method: ishtiqaq
      justification: "مصدر يدل على الانغراس والتثبت في مكان مخصص للنمو."
    - lemma: "غَرْس"
      generation_method: ishtiqaq
      justification: "مصدر يدل على إثبات الشيء في موضع لينمو."

stage2_evidence:
  per_lemma:
    - lemma: "اِنْغِرَاس"
      confirm:
        - text: "implantation"
          source: "المَكنَز الزراعي متعدد اللغات"
        - text: "implantation"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
    - lemma: "تَعْشِيش"
      confirm:
        - text: "nidation"
          source: "المعجم الطبي الموحد"
        - text: "nidation"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان"
    - lemma: "غَرْس"
      confirm:
        - text: "implantation"
          source: "المعجم الطبي الموحد"
      contradicts:
        - text: "(طب) عمليّة تقوم على زرع عضو بكامله مع إعادة وضع توصيلاته الوعائيّة"
          source: "معجم اللغة العربية المعاصرة"
          conflict: "يُستخدم طبياً لمفهوم نقل وزرع الأعضاء وليس لانغراس البويضة."
    - lemma: "اِنْزِرَاع"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "انغراس"
      decision: confirmed
      decision_reason: "مصطلح علمي دقيق ومعتمد في المعاجم الطبية للدلالة على 'implantation' في علم الأجنة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْغِرَاس"
    - lemma: "تعشيش"
      decision: confirmed
      decision_reason: "مصطلح معتمد ومستقر في المعاجم الطبية مقابلاً للمصطلح 'nidation'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْشِيش"
    - lemma: "غَرْس"
      source: stage1
      decision: removed
      decision_reason: "يُفضّل 'انغراس' لكونه مطاوعاً يعبر عن العملية الحيوية التلقائية للبويضة، بينما 'غرس' يُوحي بفعل متعدٍ ويُستخدم طبياً في زراعة الأعضاء."
      evidence_assessment:
        case: mixed
    - lemma: "اِنْزِرَاع"
      source: stage1
      decision: removed
      decision_reason: "لم يثبت كاستخدام اصطلاحي شائع في هذا السياق مقارنة بـ 'انغراس'."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "(علم الأجنة) العملية العضوية التي تنغرس فيها البويضة المخصبة في بطانة الرحم لدى الثدييات المشيمية"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح، يحدد المجال (علم الأجنة)، ويذكر الجنس (العملية العضوية)، والفصل النوعي بدقة وبأسلوب عربي سليم."
  examples:
    per_lemma:
      - lemma: "اِنْغِرَاس"
        examples:
          - text: "يُعَدُّ اِنْغِرَاسُ البُوَيْضَةِ المُخَصَّبَةِ فِي جِدَارِ الرَّحِمِ مَرْحَلَةً حَاسِمَةً فِي بِدَايَةِ الحَمْلِ."
            type: usage
      - lemma: "تَعْشِيش"
        examples:
          - text: "يُسَمَّى اِسْتِقْرَارُ المُضْغَةِ فِي بِطَانَةِ الرَّحِمِ بِالتَّعْشِيشِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ اِنْغِرَاسُ البُوَيْضَةِ المُخَصَّبَةِ فِي جِدَارِ الرَّحِمِ مَرْحَلَةً حَاسِمَةً فِي بِدَايَةِ الحَمْلِ."

