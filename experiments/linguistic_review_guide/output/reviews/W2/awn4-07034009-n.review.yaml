stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي مُقتَبَسٌ حرفيًا من التعريف الإنجليزي ('شكل فني للاتصال السمعي')، وهو أسلوب غريب على الكتابة المعجمية العربية؛ إذ لا تُعرَّف الموسيقى في المعاجم العربية بوصفها 'شكل اتصال'."
      - "اللمّة الوحيدة (موسيقى) مكتوبة بلا تشكيل."
      - "المجموعة تحتوي على لمّة واحدة فقط؛ وقد تستحق إضافة مصطلحات مترادفة إن وُجدت أدلة عليها."
    observations: >
      المفهوم المُحدَّد هو الموسيقى بوصفها فنًّا صوتيًا جماليًا يشمل الآلي والغنائي معًا.
      التراث المعجمي العربي يُميِّز بين مفاهيم متجاورة: الطرب (الانفعال النفسي الناجم عن الموسيقى)،
      واللحن (النغمة أو اللحن الموسيقي)، والتلحين (فعل التأليف الموسيقي)، والغناء (الصوت الإنساني المُلحَّن).
      أما الموسيقى فمصطلح يوناني الأصل استُعرب منذ العصر العباسي وأصبح الاسم المخصص لهذا الفن
      وعلمه في آنٍ واحد.
  blind_candidates:
    - lemma: "الطَّرَبُ"
      generation_method: majaz
      justification: >
        الطرب في أصله العربي 'خفة واهتزاز من فرح أو حزن'، وهو الانفعال المصاحب للموسيقى
        أو المُثار منها. يمكن إزاحته دلاليًا ليدل على الفن المُولِّد لهذا الانفعال (كما
        استُعمل في تعابير مثل 'آلات الطرب'). إحياء لمعنى تراثي باختزال الأثر في المؤثِّر.
    - lemma: "التَّلْحِينُ"
      generation_method: ishtiqaq
      justification: >
        من جذر (ل ح ن) على وزن التفعيل الدال على الصنعة والحِرفة؛ يُشير إلى فعل تأليف
        الألحان وضبطها. قابل للتوسع الدلالي ليشمل الفن ذاته لا الفعل فحسب، كما أن المعاجم
        الحديثة تورده بمعنى 'composition'.
    - lemma: "فَنُّ الأَنْغَامِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من 'فن' و'الأنغام' (جمع نغمة). يصف المفهوم مباشرة من مكوّناته الجوهرية:
        النغمات المنظمة في إطار فني. الإضافة تقريبية موصوفة، وهي من أكثر التراكيب عروبةً
        وسهولة في التداول.
    - lemma: "مُوسِيقَى"
      generation_method: taarib
      justification: >
        تعريب اللفظ اليوناني (μουσική / mūsikē) الذي دخل العربية عبر السريانية والبيزنطية.
        يقبل لام التعريف (الموسيقى) والنسبة (موسيقي) والجمع النسبي (موسيقيون). ملجأ أخير
        لكنه الأرسخ استعمالًا في هذا المفهوم بالذات لعدم وجود بديل عربي خالص يسعه تمامًا.


stage2_evidence:
  per_lemma:
    - lemma: "مُوسِيقَى"
      confirm:
        - text: "«لفظ يونانى يطلق على فنون العزف على آلات الطرب — علم الموسيق: علم يبحث فيه
            عن أصول النغم من حيث تأتلف أو تتنافر، وأحوال الأزمنة المتخللة بينها، ليعلم كيف
            يُؤَلَّف اللَّحن»"
          source: "المعجم الوسيط (entry_id: 28261)"
        - text: "«الموسيقى: علم يعرف به كيفية تأليف الألحان، وكيفية الإيقات»"
          source: "معجم مقاليد العلوم للسيوطي (entry_id: 807714)"
        - text: "«الموسيقى: هو علم يعرف منه النغم والإيقاع وأحوالها وكيفية تأليف اللحون
            واتخاذ الآلات الموسيقاوية، وموضوعه الصوت باعتبار نظامه»"
          source: "دستور العلماء للأحمدنكري (entry_id: 817937)"
        - text: "«(الموسيقى) (تذكر وتؤنث) لفظ يوناني يُطلق على فنون العزف على آلات الطرب،
            وعلم الموسيقى: علم يبحث فيه عن أصول النغم من حيث تأتلف أو تتنافر وأحوال الأزمنة
            المتخللة بينها ليعلم كيف يؤلف اللحن»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry_id: 885094)"
        - text: "«موسيقى» | translation_en: music"
          source: "المكنز الزراعي متعدد اللغات (entry_id: 758832)"
        - text: "«موسيقى» | translation_en: music"
          source: "مسرد الفن والتسلية والرياضة — ArabTerm (entry_id: 492350)"
        - text: "«موسيقى» | translation_en: music  — (1) فنّ الموسيقى (2) موسيقى؛ تناغم
            (3) المصاحبة الموسيقية (4) اللحن مدوّنًا على الورق"
          source: "المورد الحديث 2008 (entry_id: 702524)"
      expands:
        - text: "«موسيقي: الموسيقى: (كلمة يونانية) فن الغناء والتطريب يونانيتها موسيكى، وصاحب
            الفن موسيقي، والعامة تقول موزيكا وتطلقه أيضًا على طائفة من آلات الطرب أُخذت مع
            الجند»"
          source: "تكملة المعاجم العربية لرينهارت دوزي (entry_id: 848951)"
          addition: >
            يكشف عن دخول الكلمة الشعبي (موزيكا) وعن تطور دلالتها لتشمل فرقة الآلات الموسيقية
            العسكرية، مما يدل على رسوخ اللفظ في العربية العامية والفصيحة معًا.

    - lemma: "الطَّرَبُ"
      expands:
        - text: "«(الطَّرب) خفة وهزة تثير النفس لفرح أو حزن أو ارتياح وأغلب ما يستعمل اليوم
            في الارتياح والغناء ونحوه مما يحرك في النفس الطرب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry_id: 877247)"
          addition: >
            يُثبت أن 'الطرب' يُستعمل معاصرًا في معنى مجاور للموسيقى ('الغناء ونحوه') لكنه
            يبقى في الأساس اسمًا للانفعال النفسي لا للفن ذاته.
        - text: "«الغِناءُ ونحوُه مما يحرِّك النَّفْس ويُثيرها»"
          source: "المعجم الكبير (entry_id: 60321)"
          addition: >
            المعجم الكبير يُدرج 'الغناء ونحوه' ضمن معاني الطرب، مما يُظهر التداخل الدلالي،
            غير أن هذا استعمال مجازي ثانوي لا حقيقي للمصطلح.
      contradicts:
        - text: "«الطَّرَبُ: خفة تصيب الإنسان لشدة حزن أو سرور»"
          source: "مجمل اللغة لابن فارس (entry_id: 107128)"
          conflict: >
            التعريف الجوهري في المعاجم الكلاسيكية يُحصر الطرب في الانفعال النفسي (خفة وهزة)
            لا في الفن الصوتي ذاته؛ لا يمكن الاستناد إليه كمصطلح مُرادف للموسيقى بوصفها فنًّا.
        - text: "«(طَرَبَ) الطَّاءُ وَالرَّاءُ وَالْبَاءُ أُصَيْلٌ صَحِيحٌ. يَقُولُونَ: إِنَّ
            الطَّرَبَ خِفَّةٌ تُصِيبُ الرَّجُلَ مِنْ شِدَّةِ سُرُورٍ أَوْ غَيْرِهِ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 987521)"
          conflict: >
            المرجع اللغوي الأصلي لابن فارس يُحدد المعنى الجذري في الانفعال النفسي حصرًا،
            مما يُبطل اعتبار 'الطرب' مصطلحًا لفن الموسيقى.

    - lemma: "التَّلْحِينُ"
      expands:
        - text: "«تلحين» | translation_en: composition"
          source: "مسرد الإعلام والتواصل — ArabTerm (entry_id: 483762)"
          addition: >
            يثبت أن 'التلحين' له مقابل في 'composition' (التأليف الموسيقي)، وهو مفهوم أضيق
            من الموسيقى عمومًا.
      contradicts:
        - text: "«التلحين: هو تغيير الكلمة لتحسين الصوت، وهو مكروه؛ لأنه بدعة»"
          source: "كتاب التعريفات للشريف الجرجاني (entry_id: 794795)"
          conflict: >
            في الاصطلاح الفقهي يُشير التلحين إلى التحريف الصوتي في تلاوة القرآن أو الحديث
            بتمديد الحروف وتزييينها بالغناء، وهو معنى سلبي ومختلف تمامًا عن الموسيقى كفن.

    - lemma: "فَنُّ الأَنْغَامِ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "مُوسِيقَى"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة توثيقًا واسعًا في المعاجم العربية الكلاسيكية والحديثة والمصطلحية بالمعنى
        المطلوب (فنون العزف والغناء / فن الأنغام والألحان). وهي اللفظ الوحيد المتداول فصيحًا لهذا
        المفهوم بالسعة نفسها التي يحملها المقابل الإنجليزي 'music'. تُكتب بلا تشكيل في الملف الحالي
        فتحتاج إلى تحديث بالتشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fitness: >
        لفظ معرَّب يبدأ بـ(م و) ثم (سيقى)؛ لا وزن صرفي عربي خالص يخصه، وهو ما يُقبل
        عادةً في المعرَّبات المستقرة. المصدر الصناعي منه (موسيقية) والنسبة (موسيقي) كلاهما مطَّردان.
      borrowing_check:
        type: muarrab
        verdict: >
          معرَّب مقبول — دخل العربية منذ العصر العباسي ورُصد في كشكول البهائي والمقاليد
          والتعريفات الكلاسيكية. يقبل الإعراب الكامل ولام التعريف والنسبة والجمع. لا يوجد
          بديل عربي خالص يسعه.
      quality_gate:
        ittiraad: "مطَّرد — اشتقاقاته (موسيقي، موسيقية، موسيقيون) منتظمة"
        yusr: "سهل التداول — شائع في كل المستويات"
        mulaama: "ملائم — يُحيل فورًا إلى المفهوم الدقيق دون التباس"
        taraathi: "مُعرَّب راسخ — لم يُقترح بديل عربي مقبول"
        arabiyya: "لا يوجد مرادف عربي خالص يسعه"
        ishtiqaaqiyya: "اشتقاقاته مطَّردة"
      nuance_differentiation: >
        مُوسِيقَى هي الاسم الجامع للفن الصوتي الجمالي بكليته (آلي وغنائي)، بخلاف الغناء الذي
        يخص الصوت البشري، واللحن الذي يدل على النغمة أو الجملة اللحنية، والطرب الذي يدل
        على الانفعال النفسي المصاحب لا الفن ذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوسِيقَى"

    - lemma: "الطَّرَبُ"
      source: stage1
      decision: removed
      decision_reason: >
        الطرب في التراث المعجمي كلاسيكيًا ومعاصرًا هو الانفعال النفسي (خفة وهزة) الناجم عن
        سماع الموسيقى أو ما يُشبهها، لا الفن ذاته. المعجم الكبير يُورد 'الغناء ونحوه' معنًى ثانيًا
        لكنه مجازي ولا يمثل الاستعمال الأصيل. لا يصلح مرادفًا لموسيقى بوصفها فنًّا.
      evidence_assessment:
        case: mixed

    - lemma: "التَّلْحِينُ"
      source: stage1
      decision: removed
      decision_reason: >
        التلحين في المعاجم الحديثة يعادل 'composition' (تأليف موسيقي)، وهو مفهوم أضيق إذ
        يُشير إلى فعل التأليف لا إلى الفن كله. فضلًا عن ذلك، يحمل في المعاجم الفقهية
        دلالة سلبية (تغيير الكلمة لتحسين الصوت بما يعدّ بدعة). لا يصلح مرادفًا لموسيقى.
      evidence_assessment:
        case: mixed

    - lemma: "فَنُّ الأَنْغَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُرصَد كوحدة معجمية ثابتة في أي مصدر. يفشل اختبار السكّ: يمكن إبدال 'فن' بـ'علم'
        أو 'عالم' وتبقى العبارة صالحة كوصف. وكذلك 'الأنغام' قابل للإبدال بـ'الألحان' أو
        'الأصوات'. عبارة وصفية حرة لا مصطلح مسكوك.
      evidence_assessment:
        case: no_material


