# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-92419248-n  |  POS: n  |  ILI: null
# المفهوم: حالة عدم بلوغ الأمثل (imperfectness / suboptimality)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. المرشحات المولَّدة عمياء (من التعريف فقط، دون الاطلاع على اللمّات الموجودة)
  # التعريف: «حالة عدم كون الشيء الأفضل أو الأكثر ملاءمة أو المرغوب فيه»
  # المفهوم المستخلص: الحالة التي يقصر فيها الشيء عن بلوغ مستواه الأمثل
  blind_candidates:
    - lemma: "الْقُصُورُ"
      generation_method: ishtiqaq
      justification: >
        جذر (ق-ص-ر)، وزن فُعُول. تدلّ مقاييس ابن فارس على أن الأصل
        «أَلَّا يَبْلُغَ الشَّيْءُ مَدَاهُ وَنِهَايَتَهُ»، وهو جوهر المفهوم المطلوب.
        المصطلح مسكوك في المعاجم الطبية والاجتماعية والجغرافية بمعنى القصور والنقص.
        يجتاز اختبار السكّ: لا يمكن إبدال «القصور» بمرادف مع بقاء المصطلح ذاته.

    - lemma: "النَّقِيصَةُ"
      generation_method: ishtiqaq
      justification: >
        جذر (ن-ق-ص)، وزن فَعِيلَة. ورد في المعجم الوسيط بمعنى «النَّقْص والخَصْلَة الدَّنِيئَة».
        قال ابن فارس في المقاييس: «النَّقِيصَةُ: الْعَيْبُ». يوافق المفهوم من حيث
        كونه حالة نقص وعيب عن الكمال، غير أنه محمول دلالياً بالذمّ.

    - lemma: "اللَّامَثَالِيَّةُ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (لا + مثاليّة) يضع نفياً مقطعياً أمام المصدر الصناعي «مثاليّة»،
        على غرار «اللاإرادي»، «اللاوعي»، «اللانظامي». يُعبِّر صراحةً عن «غياب
        المثالية» ويسهل اشتقاق النسبة والجمع منه.

    - lemma: "الدُّونِيَّةُ"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «دون» (أقل من / أدنى من)، والمقاييس تؤكد أن الجذر يدلّ
        على «الْمُدَانَاةِ وَالْمُقَارَبَةِ» وأن «أَمْرٌ دُونٌ» أي «قَرِيبُ الْقِيمَةِ».
        ويقرّب هذا المرشح من المعنى الاصطلاحي لـ suboptimality.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "لمّة «لا مثالية» عبارة نفي مباشر بسيط (لا + اسم)، غير مسكوكة كمصطلح
        في أي معجم، وتفشل اختبار التثبيت المعجمي."
      - "لمّة «عدم المثالية» تركيب إضافي مقبول لكنها تفتقر إلى التشكيل الكامل
        المطلوب، وتفتقر كذلك إلى التوثيق المعجمي المباشر."
      - "التعريف الحالي ترجمة حرفية من الإنجليزية، يفتقر إلى الجنس القريب
        والفصل النوعي الواضح بأسلوب المعجم الوسيط."
      - "غياب التشكيل الكامل على جميع اللمّات الموجودة."
    observations: >
      المجموعة تعالج مفهوماً مجرداً فلسفياً-معرفياً يمثّل «imperfectness» أو
      «suboptimality»، أي الحالة التي يكون فيها الشيء دون مستواه الأمثل.
      اللمّتان الموجودتان («عدم المثالية» و«لا مثالية») كلتاهما عبارة وصفية
      حرّة لا مصطلح مسكوك؛ والأولى أقرب إلى المقبولية لأن «عدم + مصدر»
      منهج مصطلحي شائع في العربية المعاصرة (عدم الاستقرار، عدم التوافق...)،
      أما الثانية فنفي مباشر ركيك. العربية تملك «القصور» مصطلحاً أصيلاً راسخاً
      يؤدي هذا المعنى في سياقات متعددة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # الاستعلامات المنفَّذة:
  # 1. مطابقة دفعية: اللمّات الموجودة + المرشحات الأربعة (مع وبدون ال-)
  # 2. جسر إنجليزي: imperfection / imperfectness / suboptimality / suboptimal / imperfect
  # 3. مقاييس اللغة: جذور قصر، نقص، عدم، مثل، كمل، دون
  # 4. FTS كلمات مفتاحية: مثالية، دون المثال

  per_lemma:

    - lemma: "عدم المثالية"
      evidence_status: "no_material_found"

    - lemma: "لا مثالية"
      evidence_status: "no_material_found"

    - lemma: "الْقُصُورُ"
      confirm:
        - text: "«الْقُصُورُ: الْخُلُو عَن الْمعَانِي الباعثة على تحري الْخيرَات،
            والفضائل، وَعدم التَّمَكُّن من أَسبَابهَا.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«القُصور: العجزُ.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«قصور — translation_en: inadequacy»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
        - text: "«قُصور — translation_en: deficiency»"
          source: "مسرد الجغرافيا والتاريخ (ALECSO)"
        - text: "«قُصور — translation_en: insufficiency»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«قصور — حالة نقص الأداء مثل: قصور الكظر, قصور الأورطي,
            قصور القلب insufficiency, cardiac: نقص كفاءة عضلة القلب.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
      expands:
        - text: "«(قَصَرَ) الْقَافُ وَالصَّادُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا
            يَدُلُّ عَلَى أَلَّا يَبْلُغَ الشَّيْءُ مَدَاهُ وَنِهَايَتَهُ...
            وَيُقَالُ: قَصَّرْتُ فِي الْأَمْرِ تَقْصِيرًا، إِذَا تَوَانَيْتُ،
            وَقَصَرْتُ عَنْهُ قُصُورًا: عَجَزْتُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يكشف المقاييس أن جوهر الجذر هو «عدم بلوغ مدى الشيء ونهايته»،
            وهو بالضبط المفهوم الفلسفي لـ imperfectness. وزن فُعُول يدلّ
            على الحالة لا الحدث، مما يناسب المجموعة الاسمية.

    - lemma: "النَّقِيصَةُ"
      confirm:
        - text: "«النَّقِيصَةُ: النَّقْص والوقيعة أَو الطعْن فِي الناس والخصلة
            الدنيئة (ج) نقائص»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«النَّقِيصَةُ: النَّقْص الوقيعَةُ أو الطَّعْن في الناس
            الخَصْلَة الدَّنِيئَة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«نَقيصَة — translation_en: deficit»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«النَّقِيصَةُ: الْعَيْبُ; يُقَالُ مَا بِهِ نَقِيصَةٌ،
            أَيْ شَيْءٌ يَنْقُصُ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            المعنى في الأمهات الثلاثة (الوسيط، المقاييس، التعريفات الفقهية)
            يركز على العيب الأخلاقي والذمّ الشخصي («طعن في الناس»،
            «خصلة دنيئة») لا على مجرد الحالة المجردة لعدم الكمال.
            هذا يتعارض مع الدلالة الفلسفية المحايدة للمجموعة.

    - lemma: "اللَّامَثَالِيَّةُ"
      evidence_status: "no_material_found"

    - lemma: "الدُّونِيَّةُ"
      contradicts:
        - text: "«دُونيَّة: من (د و ن) مؤنث الدُّوني.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«دونية: عن اللاتينية بمعنى هبة ومنحة وعطية. يستخدم للإناث.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            «دونية» مُوثَّقة حصراً بوصفها اسم عَلَم مؤنثاً، لا مصطلحاً
            دالاً على حالة مجردة. كما أن «دون» في المقاييس لا يُشتقّ منه
            فعل: «وَلَا يُشْتَقُّ مِنْهُ فِعْلٌ»، مما يُضعف اشتقاقية المصدر الصناعي.

  # شواهد مساندة من الجسر الإنجليزي (للسياق العام)
  supplementary_english_bridge:
    - headword: "نَقْص؛ عدم اكتمال / عيب؛ شائبة"
      translation_en: "imperfection"
      source: "المورد الحديث (2008)"
    - headword: "نَقْص؛ عدم اكتمال"
      translation_en: "imperfectness"
      source: "المورد الحديث (2008)"
    - headword: "دُوَيْنَ الأَمْثَل"
      translation_en: "suboptimal / suboptimum"
      source: "المعجم الطبي الموحد (2009)"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "عدم المثالية"
      decision: confirmed
      decision_reason: >
        تركيب «عدم + مصدر» منهج مصطلحي راسخ في العربية المعاصرة
        (عدم التوافق، عدم الاستقرار، عدم التناظر...). اللمّة تجتاز اختبار
        السكّ بوصفها وحدة إضافية ثابتة؛ غير أن التشكيل غائب، ويُصحَّح
        إلى «عَدَمُ الْمَثَالِيَّة». غياب الأدلة المعجمية المباشرة ليس حجّة
        للحذف في المصطلحية الحديثة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يؤكد الجانب الوجودي لحالة النقص: «عَدَم» يحمل معنى الانتفاء الكلي
        للمثالية كحالة راسخة، بخلاف «القصور» الذي يؤكد العجز عن البلوغ
        لا الانعدام التامّ.
      morphological_fitness: >
        «عدم» مصدر من جذر (ع-د-م) على وزن فَعَل، دالٌّ على الفقدان
        والغياب. «مثاليّة» مصدر صناعي من «مثالي» من جذر (م-ث-ل).
        التركيب الإضافي سليم صرفياً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ الْمَثَالِيَّة"

    - lemma: "لا مثالية"
      decision: removed
      decision_reason: >
        تركيب النفي «لا + اسم» صيغة إنشائية نحوية لا مصطلح مسكوك.
        اللمّة تفشل اختبار التثبيت المعجمي (لا وجود لها في أي مصدر)،
        وتفشل اختبار الاستبدال (يمكن قول «غير مثالية» أو «بلا مثالية»
        وتبقى وصفاً صالحاً لا مصطلحاً)، وتبدو ترجمة حرفية من
        «non-ideality». والعربية لا تُسكّ مصطلحاتها بهذا القالب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشحات المرحلة ١ ──

    - lemma: "الْقُصُورُ"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ عربي أصيل موثَّق في المعجم الوسيط والتعريفات الفقهية ومقاييس ابن فارس
        بمعنى «العجز عن بلوغ المدى والنهاية»، وهو أدقّ تعبير عربي عن imperfectness.
        مستخدم في المعجمية الحديثة في ميادين الطب والاجتماع والجغرافيا والهندسة.
        يجتاز جميع معايير بوابة الجودة الستة: اطّراد، يُسر تداول، ملاءمة، تراثي،
        عربي، اشتقاقي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يؤكد «الجانب الديناميكي»: القصور هو القصور عن البلوغ والوصول،
        ويستدعي ضمنياً مستوىً مرجعياً أعلى لم يُبلَّغ. بخلاف «عدم المثالية»
        الذي يؤكد الانتفاء الحالي للصفة المثلى.
      loan_check:
        lexical_borrowing: native
        blind_calque: false
        conceptual_calque: false
      quality_gate:
        consistency: true
        ease_of_use: true
        appropriateness: true
        prefer_classical: true
        prefer_arabic: true
        derivability: true
      morphological_fitness: >
        وزن فُعُول يدلّ في العربية على الحالة المستمرة (القبول، الذهول، الركود).
        ملائم تماماً لوصف «حالة» وليس حدثاً عارضاً.
      actions:
        - command: create_entry
          params:
            lemma: "الْقُصُورُ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "النَّقِيصَةُ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن اللمّة موثَّقة في المعجم الوسيط ومقاييس ابن فارس بمعنى «النقص»،
        إلا أن حمولتها الدلالية الغالبة هي «الطعن في الناس» و«الخصلة الدنيئة»،
        وهي دلالة أخلاقية ذاتية لا تناسب المفهوم المجرد المحايد لـ imperfectness.
        استخدامها في هذه المجموعة سيُفضي إلى خلط دلالي.

    - lemma: "اللَّامَثَالِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        «مثاليّة» في العربية المعاصرة مُثقَلة بمعنى «idealism» الفلسفي
        ومعنى «المدينة الفاضلة»، فالنفي المقطعي «لا-مثاليّة» يولّد التباساً
        مع «اللاأيديالية» أو «ضدّ المثالية الفلسفية». فضلاً عن غياب الأدلة
        المعجمية والتوثيق الاصطلاحي.

    - lemma: "الدُّونِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تثبت أن «دونيّة» اسم عَلَم للإناث لا مصطلح،
        وأن جذر «دون» لا يُشتقّ منه فعل بنصّ المقاييس («وَلَا يُشْتَقُّ
        مِنْهُ فِعْلٌ»)، مما يبطل المصدر الصناعي «دونيّة» اشتقاقياً.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────
# اللمّات المؤكدة: عَدَمُ الْمَثَالِيَّة، الْقُصُورُ
stage4_content:

  definition:
    current: "حالة عدم كون الشيء الأفضل أو الأكثر ملاءمة أو المرغوب فيه"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية، مبنيٌّ على هيكل «عدم كون»
        الركيك. يفتقر إلى الجنس القريب والفصل النوعي. لا يُميّز المفهوم عن
        «العيب» أو «النقص» الجزئي. يجب إعادة صياغته بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: >
          حالةٌ تعتري الشيءَ أو الأداءَ أو النتيجةَ حين يَقْصُرُ عن بلوغ المستوى
          الأمثل أو الأكثر ملاءمةً في سياقه.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          كونُ الشيءِ دونَ مستواه الأمثل؛ وصفٌ لما لم يبلغ غايتَه من الكمال
          أو الملاءمة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            حالةٌ تعتري الشيءَ أو الأداءَ أو النتيجةَ حين يَقْصُرُ عن بلوغ المستوى
            الأمثل أو الأكثر ملاءمةً في سياقه.
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >
            كونُ الشيءِ دونَ مستواه الأمثل؛ وصفٌ لما لم يبلغ غايتَه من الكمال
            أو الملاءمة.

  examples:
