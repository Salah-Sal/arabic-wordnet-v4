              يُدركُ المخطِّطون أن عَدَمَ المثاليةِ في توزيع الموارد قد يُفضي
              إلى هدرٍ اقتصادي طويل الأمد.
            type: usage

      - lemma: "الْقُصُورُ"
        examples:
          - text: >
              أشارت الدراسةُ إلى القصورِ البيِّنِ في الحلول المقترحة، إذ لم
              تَبلُغ المستوى الأمثل المطلوب لتحقيق الأهداف الاستراتيجية.
            type: usage

    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: >
            يُدركُ المخطِّطون أن عَدَمَ المثاليةِ في توزيع الموارد قد يُفضي
            إلى هدرٍ اقتصادي طويل الأمد.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            أشارت الدراسةُ إلى القصورِ البيِّنِ في الحلول المقترحة، إذ لم
            تَبلُغ المستوى الأمثل المطلوب لتحقيق الأهداف الاستراتيجية.


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:

  per_entry:
    - lemma: "عَدَمُ الْمَثَالِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "عدم"
          root: "عدم"
          maqayis_quote: >
