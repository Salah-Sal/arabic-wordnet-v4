              يعتمد أسلوبه في الإدارة على التَّوْجِيهِيَّة العالية،
              إذ يُحدِّد لكل موظَّف مهامَّه بدقة دون أن يترك مجالاً للاجتهاد.
            type: usage
      - lemma: "اِتِّجَاهِيَّة"
        examples:
          - text: >
              تُقاسُ اِتِّجَاهِيَّةُ الهوائي بمدى تمركُّز الطاقة المُشعَّة
              في اتجاه الإرسال مقارنةً بموجة كروية مثالية.
            type: usage
    actions:
      - command: add_synset_example
