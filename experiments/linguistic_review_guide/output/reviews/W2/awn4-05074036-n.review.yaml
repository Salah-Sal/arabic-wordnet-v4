# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-05074036-n
# ili       : i63621
# pos       : n
# definition_en: the quality of being directive
# ══════════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (توجيهية) تفتقر إلى تشكيل كامل"
      - "التعريف العربي دائري: يستخدم «التوجيه» في تعريف «التوجيهية»"
      - "المجموعة تضمّ معنيين متقاربين (directivity التقني + directiveness السلوكي) لمّة واحدة لا تغطيهما بكفاءة"
      - "المصطلح التقني المُقنَّن «اتجاهية» غائب عن قائمة اللمّات"
    observations: >
      المجموعة الترادفية awn4-05074036-n تُعبِّر عن مفهومٍ مجرَّد مزدوج الدلالة:
      (أ) الجانب الهندسي/الفيزيائي «directivity»: خاصيَّة تركيز الطاقة أو الإشارة في اتجاه معيَّن،
      وهو مصطلح موحَّد في المعاجم التقنية العربية بـ«اتجاهية».
      (ب) الجانب السلوكي/الإداري «directiveness»: صفة التوجيه التي يتَّسم بها أسلوب قيادي أو تربوي.
      اللمّة الحالية «توجيهية» وزنها الصرفي (نسبة + تاء التأنيث → مصدر صناعي)
      أصيل عربياً، لكنّها تُستعمل في الغالب صفةً لا اسماً.
      يُستحسن إضافة «اتجاهية» لتغطية الجانب التقني الموثَّق في المعاجم الدولية المُوحَّدة.
  blind_candidates:
    - lemma: "التَّوْجِيهِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «التوجيه» (مصدر الفعل وجَّه) بإضافة ياء النسبة وتاء التأنيث،
        على وزن الأسماء المجرَّدة الدالة على الصفات كـ«الإنسانية» و«الموضوعية».
        الجذر: وجه. يُعبِّر مباشرةً عن «صفة التوجيه».
    - lemma: "الاتِّجَاهِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «الاتجاه» (مصدر افتعل من جه)، يُركِّز على معنى التوجُّه في
        اتجاه بعينه، ويُناسب الدلالة التقنية «directivity» في الهندسة والفيزياء.
        الجذر: وجه. الوزن: افتعالية.
    - lemma: "الإِرْشَادِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «الإرشاد» (مصدر أرشد) بمعنى التوجيه والدلالة على الطريق،
        وقد يُغطِّي الجانب السلوكي من المفهوم. الجذر: رشد. الوزن: إفعالية.
    - lemma: "التَّوَجُّهِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «التوجُّه» (مصدر تفعَّل من وجه)، يُركِّز على الجانب
        الإرادي في التوجُّه نحو هدف محدَّد، ويُميَّز من «التوجيهية» بكونه يصف
        فعل الكيان بنفسه لا فعل الموجِّه. الجذر: وجه.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────────
stage2_evidence:
  # ملاحظة منهجية: لا يوجد ملف evidence.json — نُفِّذت استعلامات مباشرة.
  # الاستعلامات المنفَّذة:
  #   Q1: مطابقة دفعية لجميع اللمّات + المرشحات (headword_norm IN)
  #   Q2: جسر إنجليزي (directivity / directiveness / directive / directionality)
  #   Q3: FTS عربي (توجيه / توجيهي / اتجاهية / توجيهية)
  #   Q4: إثراء بالمعرِّفات (entry_ids من Q1)
  #   Q5: مقاييس اللغة لجذر وجه (dictionary_id=151)
  per_lemma:
    - lemma: "توجيهية"
      expands:
        - text: >
            «(1) توجيهيّ؛ إداري
            (2) اتجاهيّ: دالّ على الاتجاه؛ وبخاصة: عاملٌ في فعالية أعظم باتجاه معيَّن
            a more directive aerial
            (3) تعليمات أو توجيهات [عسكرية بخاصة]»
          source: "المورد الحديث (2008) — entry_id 683627"
          addition: >
            يُثبت أن «توجيهي» يحمل معنيَيِ «directive» السلوكي و«directional» التقني معاً،
            مما يدعم استخدام «توجيهية» مصدراً صناعياً لهذا الحقل الدلالي.
        - text: >
            «المُعالَجَةُ النَّفْسِيَّةُ التَّوْجِيْهِيَّة» — directive psychotherapy
          source: "المعجم الطبي الموحد (2009) — entry_id 635082"
          addition: >
            يُؤكِّد استخدام «التوجيهية» صفةً في السياق النفسي، مما يدعم المصدر الصناعي.
        - text: >
            «لجنة توجيهية» — steering committee
          source: "مسرد المناخ والبيئة — entry_id 349641"
          addition: >
            مزيد من الشواهد على «توجيهي» كصفة راسخة تُعبِّر عن التوجيه والقيادة.

    - lemma: "التَّوْجِيهِيَّة"
      expands:
        - text: >
            «(2) اتجاهيّ: دالّ على الاتجاه» — directional; «(1) توجيهيّ؛ إداري» — directive
          source: "المورد الحديث (2008) — entry_id 683627"
          addition: >
            نفس أدلة «توجيهية»؛ الصيغة بال- والصيغة بدونها مترادفتان للمّة الواحدة.

    - lemma: "الاتِّجَاهِيَّة"
      confirm:
        - text: >
            «اتجاهية» — directivity — domain: Electronic Warfare
            (مع إحالة: انظر directional antenna)
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004) — entry_id 466537"
        - text: >
            «الاتجاهية (من الهوائي في اتجاه معين)»
            — directivity (of an antenna, in a given direction)
            — directivité (d'une antenne, dans une direction) f
          source: "موسوعة الكهرباء IEC 60050 — entry_id 518409"
        - text: >
            «اتجاهية (لرابط اتجاهي)»
            — directivity (of a directional coupler)
            — facteur de directivité (d'un coupleur directif) m
          source: "موسوعة الكهرباء IEC 60050 — entry_id 521676"
        - text: >
            «عامل الاتجاهية» — directivity factor — facteur de directivité, m
          source: "موسوعة الكهرباء IEC 60050 — entry_id 522509"
        - text: >
            «التوجهيه (نظام مولد عنفة الرياح)» — directivity (for WTGS)
            — directivité (pour les aérogénérateurs) f
          source: "موسوعة الكهرباء IEC 60050 — entry_id 512084"

    - lemma: "الإِرْشَادِيَّة"
      contradicts:
        - text: >
            «الإرشادية — رسالة. لمولانا: عبد الرحمن بن أحمد الجامي.
            المتوفى: سنة ثمان وثمانين وثمانمائة. أرسلها إلى السلطان: محمد خان الفاتح.»
          source: "كشف الظنون عن أسامي الكتب والفنون — entry_id 957131"
          conflict: >
            «الإرشادية» في المعجم اسم عَلَم لرسالة تراثية، لا مصطلح تقني.
            لا وجود لها بمعنى «directivity/directiveness» في أي مصدر.

    - lemma: "التَّوَجُّهِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──────────────────────────────────────────
    - lemma: "توجيهية"
      decision: confirmed
      decision_reason: >
        مصدر صناعي عربي أصيل من «التوجيه» (مصدر الفعل وجَّه)، موثَّق في المعاجم الطبية
        والإدارية. يُغطِّي الجانب السلوكي «directiveness» بدقة، إذ يُعبِّر عن صفة
        الشيء أو الشخص الذي يتَّسم بالتوجيه والإرشاد. يُستبقى مع إضافة تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphology_check: >
        الوزن: فَعْلِيَّة (نسبة من مصدر + تاء) → مناسب للمفاهيم المجرَّدة.
        يُقبل الاشتقاق بتشكيل كامل: تَوْجِيهِيَّة.
      quality_gate:
        conformity: "مطَّرد — على قياس: إنسانية، موضوعية، توجيهية"
        ease: "سهل التداول، مألوف للقارئ العربي"
        appropriateness: "ملائم للسياق التربوي والإداري"
        heritage_preference: "أصيل عربي من الجذر وجه"
        arabic_preference: "عربي خالص"
        derivability: "يقبل الاشتقاق والنسبة"
      nuance_differentiation: >
        تَوْجِيهِيَّة تُركِّز على الجانب الإرشادي والإداري للمفهوم (directiveness):
        صفة من يُوجِّه ويرشد الآخرين بسلطة أو أسلوب توجيهي.
        تُستخدم في السياقات التربوية والنفسية والإدارية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوْجِيهِيَّة"

    # ── مرشحات المرحلة ١ ─────────────────────────────────────────
    - lemma: "التَّوْجِيهِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هي عينها اللمّة الموجودة «توجيهية» مع أداة التعريف؛ إضافتها تكرار لا فائدة منه.
        لمّات WordNet تُحفظ بلا أداة تعريف قياساً.

    - lemma: "الاتِّجَاهِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح موحَّد موثَّق في خمسة مصادر متخصصة على الأقل (الحرب الإلكترونية،
        موسوعة الكهرباء IEC 60050) بالترجمة المباشرة directivity/directivité.
        يُغطِّي الجانب التقني الهندسي والفيزيائي للمفهوم تغطيةً دقيقة.
        اللمّة المُضافة بلا ال-: اِتِّجَاهِيَّة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphology_check: >
        الوزن: افتِعَالِيَّة (مصدر صناعي من مصدر افتعل). موزون قياسي.
        جذر: وجه (ثلاثي). يقبل لام التعريف والجمع السالم (اتجاهيات) والنسبة.
      quality_gate:
        conformity: "مطَّرد — الاتجاهية قياسي مثل: الاشتراكية، الاستمرارية"
        ease: "سهل التداول في الكتابة التقنية"
        appropriateness: "ملائم للسياق التقني والعلمي تماماً"
        heritage_preference: "أصيل عربي من الجذر وجه المشترك"
        arabic_preference: "عربي خالص"
        derivability: "يقبل الاشتقاق والنسبة والجمع"
      nuance_differentiation: >
        اِتِّجَاهِيَّة تُركِّز على الجانب التقني الكمّي للمفهوم (directivity):
        مقياس تركُّز إرسال الجهاز أو استقباله في اتجاه محدد.
        تُستخدم في الهندسة والفيزياء والكهرباء.
      actions:
        - command: create_entry
          params:
            lemma: "اِتِّجَاهِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "الإِرْشَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الشاهد المعجمي الوحيد يجعلها اسم عَلَم لرسالة تراثية، لا مصطلحاً لصفة التوجيه.
        لا يوجد أي توثيق لها بمعنى directivity/directiveness في مصادر موثوقة.

    - lemma: "التَّوَجُّهِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر لها على أدلة في قاعدة البيانات المعجمية.
        فضلاً عن ذلك، قد تُحدث لبساً مع «التوجيهية» لتشابه الصياغة والجذر.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "صفة التوجيه أو القدرة على التوجيه"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دائري: يستخدم «التوجيه» لتعريف «التوجيهية» المشتقّة منه.
        كما أنه لا يُميِّز بين الجانب التقني (directivity) والسلوكي (directiveness).
        يُحتاج تعريف بجنس قريب وفصل نوعي خالٍ من الدوران.
    authored:
      - type: terminological
        text: >
          خاصِّيَّةٌ تُعبِّرُ عن مدى قدرة جهازٍ أو نظامٍ أو كائنٍ على
          تركيزِ تأثيرِهِ أو نشاطِهِ في جهةٍ بعينها
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          صِفةُ ما يتميَّزُ بالتوجُّهِ النافعِ نحو غرضٍ أو جهةٍ محدَّدة،
          مقابل الانتشار العشوائي في كل الاتجاهات
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            خاصِّيَّةٌ تُعبِّرُ عن مدى قدرة جهازٍ أو نظامٍ أو كائنٍ على
            تركيزِ تأثيرِهِ أو نشاطِهِ في جهةٍ بعينها
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >
            صِفةُ ما يتميَّزُ بالتوجُّهِ النافعِ نحو غرضٍ أو جهةٍ محدَّدة،
            مقابل الانتشار العشوائي في كل الاتجاهات

  examples:
