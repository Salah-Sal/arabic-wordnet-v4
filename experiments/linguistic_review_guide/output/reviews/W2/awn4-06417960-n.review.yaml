# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06417960-n
# dedication / inscription — إهداء
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (إهداء)، بينما المقابل الإنجليزي يشمل dedication وinscription وهما مفهومان متداخلان لكن ليسا متطابقين تماماً"
      - "اللمّة الموجودة بدون تشكيل كامل"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزي ويحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المفهوم هو الرسالة القصيرة التي يُصدَّر بها كتاب أو عمل فني تكريماً لشخص أو تقديراً له. وهو مفهوم راسخ في التقاليد الأدبية العربية، إذ جرت عادة المؤلفين العرب على إهداء مصنفاتهم للملوك والأمراء والعلماء. يحتاج المدخل إلى إثراء بلمّات إضافية تغطي وجوه المفهوم المختلفة (الإهداء كفعل تخصيص، والنقش كرسالة مكتوبة على صورة أو أثر)."

  blind_candidates:
    - lemma: "تَصْدِيرَة"
      generation_method: ishtiqaq
      justification: "من الجذر (صدر) على وزن تَفْعِيلَة، بمعنى ما يُصدَّر به الكتاب من كلمات إهداء. مشتقة من تصدير الذي يُستعمل في العربية بمعنى الاستهلال في صدر الكتاب"
    - lemma: "تَقْدِمَة"
      generation_method: ishtiqaq
      justification: "من الجذر (قدم) على وزن تَفْعِلَة، تُستعمل بمعنى ما يُقدَّم تكريماً وتقديراً. لها استعمال معجمي عربي قديم في سياق التكريم والإهداء"
    - lemma: "نَقِيشَة"
      generation_method: ishtiqaq
      justification: "من الجذر (نقش) على وزن فَعِيلَة بمعنى مَفْعولة، أي ما يُنقش من كلمات على صورة أو أثر فني إهداءً. تقابل المعنى الإنجليزي inscription"
    - lemma: "تَكْرِيسَة"
      generation_method: ishtiqaq
      justification: "من الجذر (كرس) على وزن تَفْعِيلَة، بمعنى ما يُكرَّس به العمل لشخص ما. مشتقة من تكريس الذي يُستعمل مقابل dedication"


stage2_evidence:
  per_lemma:
    - lemma: "إِهْدَاء"
      confirm:
        - text: "«إهداء — dedication»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (طباعة - كهرباء، 1996)"
        - text: "«إهداء — dedication»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«(2) إهداء الكتاب أو الأثر الفني إلى شخص ما تقديرًا له أو اعترافًا بفضله» (مقابل inscription)"
          source: "المورد الحديث (2008)"
        - text: "«(3) إهداء الكتاب» (مقابل dedication)"
          source: "المورد الحديث (2008)"
        - text: "«رِسالةُ إهداء — ارتبطت بالقدماء (شيشرون)، لتستمر كتقليد يتوخى التواصل مع الآخر عبر شكل تعبيري حميمي.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«الْهَاءُ وَالدَّالُ وَالْحَرْفُ الْمُعْتَلُّ: أَصْلَانِ أَحَدُهُمَا التَّقَدُّمُ لِلْإِرْشَادِ، وَالْآخَرُ بَعْثَةُ لَطَفٍ. ... وَالْأَصْلُ الْآخَرُ الْهَدِيَّةُ: مَا أَهْدَيْتَ مَنْ لَطَفٍ إِلَى ذِي مَوَدَّةٍ. يُقَالُ: أَهْدَيْتُ أُهْدِي إِهْدَاءً.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الإهداء مصدر أَهْدَى، والأصل الدلالي فيه بعثة اللطف والمودة، وهو يتسق تماماً مع معنى تخصيص العمل الأدبي لشخص تقديراً له"

    - lemma: "تَصْدِيرَة"
      evidence_status: "no_material_found"

    - lemma: "تَقْدِمَة"
      contradicts:
        - text: "«التقدمة: وضع الشيء قداماً وهو جهة القدم الذي هو الأمم والتجاه أي قبالة الوجه، قاله الحرالي.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الدلالة الأصلية تتعلق بالتقديم المكاني لا بالإهداء الأدبي"
        - text: "«(1) تَقْدِمة [يُوْفى بها نَذْر] (2) نَذْريّ.»"
          source: "المورد الحديث (2008)"
          conflict: "التقدمة في المورد مرتبطة بالنذور والقرابين لا بالإهداء الأدبي"
      expands:
        - text: "«(2) منحة؛ تقدمة؛ هِبة» (مقابل offering)"
          source: "المورد الحديث (2008)"
          addition: "التقدمة تُستعمل بمعنى الهِبة والمنحة، وهو أعمّ من إهداء الكتاب"

    - lemma: "نَقِيشَة"
      contradicts:
        - text: "«النَّقِيشَةُ: بالفتح ثم الكسر... ماء لآل الشريد»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "النقيشة في المعاجم الكلاسيكية اسم موضع لا مصطلح أدبي"
        - text: "«نقيشة — effigy»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          conflict: "نقيشة في الاستعمال الحديث تعني التمثال أو الصورة المنقوشة لا رسالة الإهداء"

    - lemma: "تَكْرِيسَة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "إِهْدَاء"
      decision: confirmed
      decision_reason: "لمّة أصيلة مشتقة من الجذر (هدي) على وزن إفعال، مؤيَّدة بشواهد متعددة من المعاجم الحديثة والمصطلحية. وهي المقابل العربي المعياري لـ dedication في سياق الكتب والأعمال الفنية. الأصل الدلالي في ابن فارس (بعثة لطف إلى ذي مودة) يتسق تماماً مع المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِهْدَاء"

    - lemma: "تَصْدِيرَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أي شواهد معجمية لهذه الصيغة. والتصدير نفسه يُستعمل في العربية الحديثة بمعنى مقدمة الكتاب أو تصدير البضائع، لكن تصديرة على وزن تفعيلة لم تُسكّ بمعنى رسالة الإهداء."

    - lemma: "تَقْدِمَة"
      source: stage1
      decision: removed
      decision_reason: "التقدمة في المعاجم الكلاسيكية والحديثة تدور حول النذر والقربان والهبة، وهي أعمّ من مفهوم رسالة الإهداء في صدر كتاب. لا يوجد شاهد على استعمالها بمعنى inscription أو dedication بالمعنى المقصود في هذه المجموعة."

    - lemma: "نَقِيشَة"
      source: stage1
      decision: removed
      decision_reason: "النقيشة في المعاجم اسم موضع (ياقوت) أو تعني الصورة المنقوشة (effigy) في المصطلحات الحديثة. لا علاقة لها بمفهوم رسالة الإهداء الأدبية."

    - lemma: "تَكْرِيسَة"
      source: stage1
      decision: removed
      decision_reason: "صيغة مولّدة لم تُسكّ معجمياً. التكريس نفسه يُستعمل مقابل dedication بمعناه العام (التكريس لقضية)، لكن تكريسة على وزن تفعيلة لا شاهد عليها ولا تتناسب مع المعنى المحدد لرسالة الإهداء في الكتب."


