          text: "عبارةٌ موجزةٌ يُصدِّر بها المؤلفُ أو الفنّانُ عملَه، يخصُّ بها شخصاً أو جهةً تكريماً أو تقديراً"

  examples:
    per_lemma:
      - lemma: "إِهْدَاء"
        examples:
          - text: "كتب الشاعرُ في إهداء ديوانه: «إلى أبي الذي علّمني أنّ الكلمة سلاح»."
            type: usage
    actions:
