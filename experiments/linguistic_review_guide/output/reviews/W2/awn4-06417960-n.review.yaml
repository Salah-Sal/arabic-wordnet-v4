    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية من الإنجليزية، ويفتقر إلى الأسلوب المعجمي العربي. يحتاج إعادة صياغة بجنس قريب وفصل نوعي واضحين."
    authored:
      - type: terminological
        text: "عبارةٌ موجزةٌ يُصدِّر بها المؤلفُ أو الفنّانُ عملَه، يخصُّ بها شخصاً أو جهةً تكريماً أو تقديراً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يكتبه صاحبُ الكتابِ أو العملِ الفنّيّ في صدرِه من كلماتِ تقديرٍ يوجّهها إلى مَن يُهدي إليه عملَه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
