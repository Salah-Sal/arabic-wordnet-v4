stage1_review:
  assessment:
    concerns:
      - "كلمة 'نادرة' قد تلتبس مع معنى 'الطرفة' (anecdote) وهو المعنى الأكثر شيوعاً في الاستعمال المعاصر."
      - "تعبير 'عملة نادرة' هو استعارة حديثة نسبياً مقارنة بالمصطلحات التراثية."
    observations: "المجموعة تعبر عن مفهوم الشخص المتفرد. المصطلحات الموجودة جيدة ولكنها تفتقر إلى التعبيرات العربية الكلاسيكية الفصيحة التي تعبر عن هذا المفهوم بدقة أكبر مثل 'نسيج وحده'."
  blind_candidates:
    - lemma: "نَسِيجُ وَحْدِهِ"
      generation_method: tarkib
      justification: "تعبير عربي أصيل يضرب لمن لا مثل له في الفضل أو الرأي."
    - lemma: "فَلْتَة"
      generation_method: majaz
      justification: "تستخدم للتعبير عن العبقري المتفرد الذي يظهر فجأة ولا يتكرر (فلتة زمانه)."
    - lemma: "عَدِيمُ النَّظِيرِ"
      generation_method: tarkib
      justification: "تركيب وصفي شائع يعبر عن انعدام المماثل."
    - lemma: "أُعْجُوبَة"
      generation_method: ishtiqaq
      justification: "تطلق على الشخص الذي يثير العجب لتفرده وتفوقه."

stage2_evidence:
  per_lemma:
    - lemma: "عُمْلَة نَادِرَة"
      confirm:
        - text: "«طيرٌ نادر... شخص أو شيء عجيب أو استثنائيّ»"
          source: "المورد الحديث"
      expands:
        - text: "«عملة نادرة»"
          source: "ArabTerm"
          addition: "وردت في سياق التجارة بمعنى العملة الصعبة، ولكنها استعارة شائعة جداً للأشخاص في اللغة المعاصرة."
    - lemma: "نَادِرَة"
      confirm:
        - text: "«(النادرة) الطرفة من القَوْل وَهُوَ نادرة أزمانه وحيد عصره»"
          source: "المعجم الوسيط"
        - text: "«والنادرة: الطرفة من القول، وهو نادرة زمانه أي: وحيد عصره.»"
          source: "موسوعة السلطان قابوس"
    - lemma: "نَسِيجُ وَحْدِهِ"
      confirm:
        - text: "«هو نَسِيجُ وَحْدِهِ: لا ثاني له، وأصله الثوب الذي لا يسدى على سداه لرقة غيره من الثياب... وهو الذي لا يقارعه في الفضل أحد.»"
          source: "لسان العرب"
        - text: "«ومنه في صفة عمر: نسيج وحده، من جلس وحده ورأيته وحده أي منفرداً... وهو مدح.»"
          source: "مجمع بحار الأنوار"
    - lemma: "فَرِيد"
      confirm:
        - text: "«المنفرد بنفسه ومن لا نظير له.»"
          source: "موسوعة السلطان قابوس"
    - lemma: "فَلْتَة"
      confirm:
        - text: "«الأمر يحدث من غير روية وإحكام»"
          source: "المعجم الوسيط"
      expands:
        - text: "«فلتة»"
          source: "الاستعمال اللغوي"
          addition: "تستخدم في السياق المدحي بمعنى الشخص الفذ (فلتة زمانه)."

