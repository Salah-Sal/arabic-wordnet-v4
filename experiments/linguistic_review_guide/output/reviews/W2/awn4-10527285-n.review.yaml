    current: "شخص نادر أو فريد من نوعه"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، يحتاج إلى صياغة معجمية أدق تبرز معنى عدم وجود النظير."
    authored:
      - type: terminological
        text: "شخص لا نظير له في صفاته أو مواهبه، ينفرد بخصائص استثنائية تميزه عن أقرانه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-10527285-n", definition_index: 0, text: "شخص لا نظير له في صفاته أو مواهبه، ينفرد بخصائص استثنائية تميزه عن أقرانه."}
  examples:
    per_lemma:
      - lemma: "عُمْلَة نَادِرَة"
        examples:
          - text: "أصبح الموظف الأمين والمنضبط عُمْلَةً نَادِرَةً في هذا الزمن."
            type: usage
      - lemma: "نَادِرَة"
        examples:
          - text: "كان الجاحظ نَادِرَةَ عصره في البيان وقوة الحجة."
            type: usage
      - lemma: "نَسِيجُ وَحْدِهِ"
        examples:
          - text: "كان عمر بن الخطاب رضي الله عنه نَسِيجَ وَحْدِهِ في عدله وحزمه."
            type: usage
      - lemma: "فَرِيد"
        examples:
          - text: "يتمتع هذا الفنان بأسلوب فَرِيدٍ لا يجاريه فيه أحد."
            type: usage
      - lemma: "فَلْتَة"
        examples:
          - text: "يُعد المتنبي فَلْتَةً من فَلَتَاتِ الزمان في عبقرية الشعر."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أصبح الموظف الأمين والمنضبط عُمْلَةً نَادِرَةً في هذا الزمن."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "كان الجاحظ نَادِرَةَ عصره في البيان وقوة الحجة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "كان عمر بن الخطاب رضي الله عنه نَسِيجَ وَحْدِهِ في عدله وحزمه."}
      - command: add_sense_example
