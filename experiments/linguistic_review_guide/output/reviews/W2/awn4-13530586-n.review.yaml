# المرحلة ١: المراجعة والتوليد — Stage 1
# (قُرئ الملف المُقنَّع أولاً قبل توليد المرشحات)
# ══════════════════════════════════════════════
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'تكون اللمفاويات' مكتوبة بدون تشكيل كامل"
      - "التعريف العربي يستخدم 'الليمفاوية' (بياء مدّ: ليمف) بينما الشكل الموحَّد في المعجم الطبي الموحد هو 'اللِّمفاوية' (بدون ياء مدّ: لمف) — تناقض إملائي داخلي بين اللمّة والتعريف"
      - "التعريف يستخدم 'تكوين' (مصدر مُعدَّى، وزن تَفعيل) بينما اللمّة تستخدم 'تَكَوُّن' (مصدر لازم، وزن تَفَعُّل) — عدم تطابق صرفي بين اللمّة والتعريف"
    observations: >
      المجموعة تصف عملية بيولوجية طبية تخصصية هي تكوّن الخلايا الليمفاوية في الأعضاء
      الليمفاوية. المفهوم حديث لا يوجد له مقابل في المعاجم الكلاسيكية. التعبير عنه
      في العربية الطبية المعاصرة يتبع نمط التركيب الإضافي (مصدر + مضاف إليه)، وهو نمط
      منتج ومعيار في المصطلحية الطبية العربية. المصطلح معرَّب في مكوّنه الثاني (لِمف
      من اللاتينية lympha)، وهذا متوقع ومقبول للمفاهيم الطبية الحديثة التي لا جذر
      عربي أصيل لها. المجموعة ذات لمّة وحيدة مما يعني غياب التنافس الترادفي الداخلي.

  blind_candidates:
    - lemma: "تَوَلُّدُ اللِّمْفاوِيَّات"
      generation_method: tarkib
      justification: >
        تركيب إضافي من مصدر (تَوَلُّد) على وزن تَفَعُّل من جذر (ولد) الدال على النجل
        والنشأة؛ قال ابن فارس: 'تَوَلَّدَ الشَّيْءُ عَنِ الشَّيْءِ: حَصَلَ عَنْهُ'.
        يؤدي دلالة الإنتاج البيولوجي الذاتي للخلايا الليمفاوية بصورة طبيعية، وهو يعكس
        ديناميكية النشأة من مصادر خلوية سلفية.

    - lemma: "نَشْأَةُ الخَلَايَا اللِّمْفاوِيَّة"
      generation_method: tarkib
      justification: >
        تركيب إضافي وصفي من مصدر (نَشْأَة) على وزن فَعْلَة من جذر (نشأ) الدال على
        الارتفاع والبروز والظهور من عدم؛ قال ابن فارس: 'النُّونُ وَالشِّينُ وَالْهَمزَةُ
        أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي شَيْءٍ وَسُمُوٍّ'. يصف ظهور هذه
        الخلايا ونشوءها من الخلايا الجذعية في الأعضاء المذكورة.

    - lemma: "إِنْتَاجُ اللِّمْفاوِيَّات"
      generation_method: tarkib
      justification: >
        تركيب إضافي من مصدر (إِنتاج) على وزن إِفعال من جذر (نتج) المتعلق بالنِّتاج
        والإخراج؛ قال ابن فارس: 'النُّونُ وَالتَّاءُ وَالجِيمُ كَلِمَةٌ وَاحِدَةٌ هِيَ
        النِّتَاجُ'. يبرز الجانب الإنتاجي الوظيفي للعملية، وملائم للسياقات الطبية
        السريرية التطبيقية.

    - lemma: "اللِّمْفاوِيَّةُ التَّكْوِينِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من (اللِّمفاوِيَّة) نسبة إلى اللِّمف موصوفاً بـ(التَّكوينِيَّة)
        المشتقة من جذر (كون) بصيغة المصدر الصناعي. يُقدَّم كمصطلح اسمي موحَّد يصف
        العملية التكوينية في المنظومة اللمفاوية، وهو أكثر إيجازاً من الأسلوب الإضافي.


