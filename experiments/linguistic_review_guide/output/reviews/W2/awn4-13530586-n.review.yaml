stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "تكون اللمفاويات"
      decision: confirmed
      decision_reason: >
        المصطلح مُثبَّت في المعجم الطبي الموحد (2009) بصورة مباشرة مع ترجمة إنجليزية
        مطابقة (lymphopoiesis) في ثلاثة إدخالات تؤكد رسوخه. الجذر (كون) عربي أصيل،
        والبناء على وزن تَفَعُّل يُفيد الحدوث الذاتي (intransitive process) المناسب
        للعمليات البيولوجية الخلوية. يحتاج تحديث التشكيل فحسب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      morphological_check: >
        (تَكَوُّن) على وزن تَفَعُّل من جذر (كون): وزن منتج للعمليات الذاتية البيولوجية.
        (اللِّمفاوِيَّات) جمع مؤنث سالم من (لِمفاوِيَّة) المعرَّبة — يقبل لام التعريف
        والجمع السالم والنسبة، مما يستوفي شروط التعريب المقبول.
      borrowing_check:
        lexical_borrowing: "مُعرَّبة جزئياً — (لِمف) من اللاتينية lympha، مستوعبة في العربية الطبية الحديثة بشكل كامل"
        blind_calque: "لا يوجد — التركيب الإضافي نمط عربي أصيل"
        conceptual_calque: "مقبول — نمط (تَفَعُّل + مضاف إليه) شائع ومنتج في المصطلحية الطبية العربية"
      quality_gate:
        اطراد_وشيوع_الفصيح: "مُطَّرد في ARABTERM والمعاجم الطبية الحديثة"
        يسر_التداول: "مقبول — مقطعان رئيسيان في تركيب إضافي واضح"
        ملاءمة: "ملائم تماماً — يُقابل lymphopoiesis مطابقةً تامةً"
        إيثار_التراثي: "غير قابل للتطبيق — المفهوم حديث بلا مقابل كلاسيكي"
        إيثار_العربي: "جذع (كون) عربي أصيل؛ (لِمف) معرَّب لا بديل أصيل عنه"
        اشتقاقية: "عالية — يمكن اشتقاق: تَكَوُّني، مُتَكَوِّن، اللِّمفاوِيَّة التَّكَوُّنِيَّة..."
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة — لا ترادف داخلي. تتميز عن المصطلحات المجاورة
        بتخصيصها لسلالة الخلايا اللِّمفاوية تحديداً، خلافاً للمصطلح الأعم 'تَكَوُّن
        الدَّم' (haematopoiesis) الشامل لجميع سلالات خلايا الدم، وعن 'تَكَوُّن
        الكريَّات البيض' (leukopoiesis) الشامل لجميع الخلايا البيضاء بما فيها غير
        اللِّمفاوية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَوُّنُ اللِّمْفاوِيَّات"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَوَلُّدُ اللِّمْفاوِيَّات"
      source: stage1
      decision: removed
      decision_reason: >
        غير مُدرج في أي معجم طبي. وزن تَفَعُّل من (ولد) يحمل إيحاء بالعلاقة الولادية
        والنسبية، وهو أقل دقة من (تَكَوُّن) الذي يصف عملية التمايز الخلوي البيولوجي
        المنظَّم. تبديل المصطلح المُثبَّت بمرادف غير مُدرج يخالف مبدأ الاقتصاد
        الاصطلاحي.
      evidence_assessment:
        case: no_material

    - lemma: "نَشْأَةُ الخَلَايَا اللِّمْفاوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        غير مُدرج في المعاجم الطبية. (نشأة) يحمل دلالة الظهور من عدم، وهو أقل دقة
        طبية من (تَكَوُّن) الذي يصف مسار التمايز المنظَّم. طول التركيب (ثلاثة مكوّنات:
        نشأة + الخلايا + اللِّمفاوية) يتجاوز المعتاد في المصطلحية الطبية الإضافية.
      evidence_assessment:
        case: no_material

    - lemma: "إِنْتَاجُ اللِّمْفاوِيَّات"
      source: stage1
      decision: removed
      decision_reason: >
        غير مُدرج في المعاجم المتخصصة. (إنتاج) يحمل إيحاءً صناعياً/كمياً قد يناسب
        سياقات الهندسة الحيوية لكنه أقل دقة للعمليات البيولوجية الخلوية الدقيقة. وزن
        تَفَعُّل في (تَكَوُّن) يُفيد العملية الذاتية الأنسب لعلم الأحياء.
      evidence_assessment:
        case: no_material

    - lemma: "اللِّمْفاوِيَّةُ التَّكوِينِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        غير مُدرج في المعاجم. المصطلح الوصفي يُحيل إلى صفة اللِّمفاوية لا إلى العملية
        ذاتها، مما يُسبّب التباساً دلالياً مع المصطلحات الوصفية الأخرى في المجال
        (lymphocytic, lymphoid). كذلك لا يحمل في حدّ ذاته معنى العملية الحيوية.
      evidence_assessment:
        case: no_material


