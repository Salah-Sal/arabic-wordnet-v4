# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13604681-n (toxicity / سُمِّيَّة)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (سُمِّيَّة)، وقد يكون من المفيد إثراؤها بمرادفات أو أشباه مرادفات"
      - "التعريف العربي الحالي مقبول لكنه يحتوي على كلمة «ساماً» بدون تشديد الميم، والأصح «سامًّا»"
    observations: "المفهوم (toxicity) هو مصطلح علمي حديث يدل على مقدار كون المادة سامّة. المصدر الصناعي «سُمِّيَّة» من «سُمّ» هو الصيغة المعيارية المعتمدة في المعاجم المصطلحية العربية الموحّدة. الجذر «سمم» غني بالمشتقات (سُمّ، سامّ، مسموم، تسمُّم، سُموم)، والمصدر الصناعي هو الصيغة الأنسب للدلالة على الدرجة أو الصفة المجردة."
  blind_candidates:
    - lemma: "سُمِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «سُمّ» على وزن فُعْلِيَّة، يدل على صفة كون الشيء ذا سُمّ ودرجته، وهو القياس المطّرد في العربية لتحويل الاسم إلى مفهوم مجرد"
    - lemma: "سَمَامَة"
      generation_method: ishtiqaq
      justification: "على وزن فَعَالَة من الجذر «سمم»، قد يدل على صفة كون الشيء ساماً، لكن الوزن أقرب للدلالة على الفعل أو الحالة منه للدرجة"
    - lemma: "تَسَمُّمِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تَسَمُّم» (مصدر تَفَعُّل)، يجمع بين دلالة التسمم والصفة المجردة، لكنه قد يلتبس مع فعل التسمم نفسه"
    - lemma: "دَرَجَة السُّمِّيَّة"
      generation_method: tarkib
      justification: "مركب إضافي يصف المفهوم بوضوح، لكنه عبارة وصفية أكثر منه مصطلحاً مسكوكاً مستقلاً"


stage2_evidence:
  per_lemma:
    - lemma: "سُمِّيَّة"
      confirm:
        - text: "«السُّمِّيَّة: الدرجة التي تحدث فيها المادة التسمم للكائنات الحية.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«(1) السُّمِّيَّة (2) درجة السُّمِّيَّة.»"
          source: "المورد الحديث (2008)"
        - text: "«سُمِّيَّة — toxicity»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«سُمِّيَّة — toxicity»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«سُمِّية — toxicity»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«سُمِّيَة — toxicity»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«سُمِّيَة — toxicity»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«سُمِيّة حادة: حالة السمية التي تقدم فيها جرعة عالية تؤدي إلى قتل حيوانات التجربة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "تفصيل نوع من السُّمِّيَّة (الحادة) يؤكد استعمال اللفظ في سياق الدرجة والقياس"
        - text: "«سُمِّيَّة مُزْمِنَة: الأضرار التي تظهر على الجسم نتيجة لتراكم مادة سامة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "نوع آخر من السُّمِّيَّة (المزمنة) يؤكد أن اللفظ يقبل التقييد بالصفة"
        - text: "«سُمِّيَّة دُونَ الحَادَّة: تظهر آثار هذا التسمم في أثناء التعرض له بصفة مكررة ولمدة قصيرة (شهر أو أكثر) وبمقدار أقل من المقدار المعروف بالنسبة للسمية الحادة.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "استعمال في سياق قياسي يؤكد دلالة الدرجة"

    - lemma: "سَمَامَة"
      contradicts:
        - text: "«حَيَّةٌ سَمَّامَة — venomous snake»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "سَمَّامَة (على وزن فَعَّالة) صفة مشبهة تعني «كثيرة السمّ» وتُستعمل نعتاً للحيّة، لا اسماً مجرداً للدرجة"

    - lemma: "تَسَمُّمِيَّة"
      evidence_status: "no_material_found"

    - lemma: "دَرَجَة السُّمِّيَّة"
      expands:
        - text: "«(1) السُّمِّيَّة (2) درجة السُّمِّيَّة.»"
          source: "المورد الحديث (2008)"
          addition: "المورد يذكر «درجة السُّمِّيَّة» كترجمة ثانية لـ toxicity، مما يدل على أنها عبارة شرحية لا مصطلح مستقل"


stage3_analysis:
  per_lemma:
    - lemma: "سُمِّيَّة"
      decision: confirmed
      decision_reason: "مصطلح معياري مثبت في أكثر من سبعة معاجم مصطلحية عربية موحّدة (الصيدلة، الطب البيطري، الهندسة المدنية، المياه، تقانات الأغذية، الطاقة المتجددة، المورد الحديث). التعريف في معجم تقانات الأغذية مطابق تماماً لمعنى المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة المؤكدة في المجموعة؛ تدل على الدرجة المجردة لكون المادة سامّة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُمِّيَّة"

    - lemma: "سَمَامَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على استعمال لـ«سَمَامَة» بمعنى الدرجة المجردة للسمّ. الصيغة المشهودة «سَمَّامَة» (وزن فَعَّالة) صفة مشبهة تعني «كثيرة السمّ» وتُنعت بها الحيّة، ولا تدل على مفهوم toxicity."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَسَمُّمِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على هذه الصيغة. المصدر الصناعي من «تَسَمُّم» غير مستعمل في المعاجم المصطلحية، والمعتمد هو «سُمِّيَّة» مباشرة من «سُمّ»."
      evidence_assessment:
        case: no_material

    - lemma: "دَرَجَة السُّمِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية شرحية لا مصطلح مسكوك. المورد الحديث يذكرها كترجمة ثانوية توضيحية بجانب «السُّمِّيَّة»، مما يؤكد أنها تفسير لا مصطلح مستقل. يخفق في اختبار السكّ: يمكن استبدال «درجة» بـ«مستوى» أو «مقدار» وتبقى العبارة صالحة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi


