# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «حالة عدم الكينونة» دائريٌّ: يستخدم لفظ «عدم» وهو لمّةٌ في المجموعة ذاتها"
      - "كلتا اللمّتين الموجودتين (عدم، لا وجود) تفتقران إلى التشكيل الكامل"
      - "المجموعة تقتصر على لمّتين فقط رغم ثراء الاستعمال الفلسفي العربي في هذا المفهوم"
    observations: "المجموعة تمثّل مفهوماً فلسفياً جوهريّاً راسخاً في تراث الكلام والمنطق الإسلاميَّيْن. لفظ «العدم» متأصّلٌ في المعجميّة العربية الكلاسيكية ويُقابل الوجودَ في الثنائيّة الكلاميّة عدم/وجود. أمّا «لا وجود» فمركَّبٌ نفيٌّ إضافيٌّ حديثُ الاستخدام في الاصطلاح الفلسفي المعاصر. يُستحسَن استكمال المجموعة بـ«الانعدام» الذي وثَّقه دوزي في سياق فلسفيّ صريح. التعريف بحاجة إلى إعادة صياغة لتفادي الدوران المنطقي واستيعاب البُعد الفلسفي."
  blind_candidates:
    - lemma: "اِنْعِدَامٌ"
      generation_method: ishtiqaq
      justification: "مشتقّ من الجذر عدم على وزن افتعال (انفعال داخلي)؛ يدلّ على حالة غياب الكيان والوجود غياباً كلّيّاً، ويناسب وظيفةَ المصدر الوصفيّ للحالة"
    - lemma: "فَنَاءٌ"
      generation_method: majaz
      justification: "لفظ عربي كلاسيكي يدلّ على الزوال والتلاشي التامّ؛ مجازٌ دلاليٌّ من معنى الانقطاع والذهاب إلى حالة عدم الكيان، مستعمَلٌ في التراث الصوفيّ"
    - lemma: "لَاكَوْنٌ"
      generation_method: tarkib
      justification: "مركَّب مزجيٌّ من «لا» النافية و«كون» (الكيان/الوجود)، يوازي بنية المصطلح الإنجليزي non-being مباشرةً ويُعرَب إعراباً واحداً"
    - lemma: "عَدَمِيَّةٌ"
      generation_method: ishtiqaq
      justification: "مصدر صناعيّ من الجذر عدم على وزن المنسوب المجرَّد؛ يدلّ على حالة العدم ومنزلتها الوجودية في الفلسفة المقارنة"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة (٦ استعلامات):
#   ١. مطابقة دفعية: عدم، العدم، لا وجود، انعدام، الانعدام، فناء، الفناء، لاكون، اللاكون، عدمية، العدمية
#   ٢. إثراء مدمج: definitions + examples + plurals لمعرّفات المرحلة ١
#   ٣. جسر إنجليزي: nonbeing, non-being, nothingness, nonexistence, non-existence
#   ٤. بحث FTS عربي: كينونة، اللاوجود، اللاكون، انعدام الوجود
#   ٥. مقاييس جذر عدم وفني
#   ٦. مقاييس جذر وجد
stage2_evidence:
  per_lemma:

    - lemma: "عدم"
      confirm:
        - text: "«العَدَمُ: انْتِفَاء الْكَوْن»"
          source: "معجم مقاليد العلوم في الحدود والرسوم للسيوطي (ت 1505م)"
        - text: "«(الْعَدَم) ضد الْوُجُود والفقر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«العدم:[في الانكليزية] Nothingness [في الفرنسية] Neant ... بمعنى نيستى - عدم الوجود - ... فالعدم يقابل الوجود كما أنّ العدمي يقابل الوجودي»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الْعَدَم: يُقَابل الْوُجُود وَله اعتباران - الْوُجُود الْمُطلق وَمُطلق الْوُجُود ... فَإِن اعْتبر مُقَابلَته بالوجود الْمُطلق يكون عبارَة عَن سلب الْوُجُود الْمُطلق وَهُوَ الْعَدَم الْمُطلق»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«ضِدُّ الوجود»"
          source: "المعجم الوسيط (مصدر OCR)"
        - text: "«عدم» — translation_en: nought; nothing"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ArabTerm، 1990)"
      expands:
        - text: "«الْعَيْنُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى فُقْدَانِ الشَّيْءِ وَذَهَابِهِ. مِنْ ذَلِكَ الْعَدَمُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر الأصليّ للمادة يؤكد أن الدلالة الأساسية هي الفقدان والذهاب، وهو أساس المعنى الفلسفي"
        - text: "«العَدَمُ والعُدْمُ والعُدُمُ: فقدان الشيء وذهابه، وغلبَ على فَقْد المال وقِلَّته»"
          source: "لسان العرب لابن منظور"
          addition: "يُبيّن أن الاستخدام اللغوي الأوّل هو الفقدان، ثم انتقل الفلاسفةُ باللفظ إلى إطلاقه على ضدّ الوجود"

    - lemma: "لا وجود"
      confirm:
        - text: "«لا وجود» — translation_en: non-being"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«(1) العَدَم؛ اللّاوجود (2) اللّامَوْجود» — translation_en: nonexistence"
          source: "المورد الحديث (2008)"
        - text: "«(1) «أ» اللّاشيئيّة: العَدَم؛ اللّاوجود. «ب» تفاهة؛ لاأهميّة...» — translation_en: nothingness"
          source: "المورد الحديث (2008)"

    - lemma: "اِنْعِدَامٌ"
      confirm:
        - text: "«الانعدام: فقد الكيان، فقد الجوهر، فقد الذات. (المقدمة 3: 228)»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
      expands:
        - text: "«انعدام» — translation_en: absence"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (ArabTerm، 2015)"
          addition: "يُستخدم في المصطلحيّة الحديثة بمعنى الغياب الكامل لكيان ما، مما يدعم استخدامه في السياق الفلسفي"

    - lemma: "فَنَاءٌ"
      confirm:
        - text: "«الفناء: بالفتح خلاف البقاء»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«بالفتح والمدّ عند الصوفية عدم شعور الشخص بنفسه ولا بشيء من لوازم نفسه»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«الفناء: سقوط الأوصاف المذمومة، كما أن البقاء وجود الأوصاف المحمودة»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الفناء الصوفيّ هو سقوط الصفات المذمومة، لا انتفاء الوجود بإطلاق؛ فدلالته أخصّ وأكثر اشتراطاً من المفهوم الفلسفيّ المجرَّد"
        - text: "«الفناء: بالكسر: الوصيدُ، وهي ساحة أمام البيت»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "اللفظ مشترك بين معنى الزوال (بالفتح) والساحة (بالكسر)، مما يُفضي إلى إبهام يَحول دون الاستخدام الاصطلاحيّ الصارم"

    - lemma: "لَاكَوْنٌ"
      evidence_status: "no_material_found"

    - lemma: "عَدَمِيَّةٌ"
      contradicts:
        - text: "«عدميّة» — translation_en: nihilism"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "العَدَمِيَّة في الاصطلاح الفلسفي المعاصر محجوزةٌ للدلالة على المذهب النيهيلي (nihilism)، وهو مفهومٌ مختلفٌ تماماً عن «حالة العدم» الموضوعِ هنا"


