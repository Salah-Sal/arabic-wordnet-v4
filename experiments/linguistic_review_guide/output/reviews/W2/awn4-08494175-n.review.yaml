      - lemma: "غَيْرُ المُعْتَرِفِينَ"
        examples:
          - text: "عُزِل غير المعترفين في زنزانة انفرادية حتى انتهاء التحقيق."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-08494175-n"
