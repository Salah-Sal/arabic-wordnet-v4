stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (غير المعترفين) عبارة عن تركيب إضافي (غير + المضاف إليه) وهو أسلوب شائع لترجمة السوابق الإنجليزية (un-)، وقد لا يعتبر مصطلحاً معجمياً مستقلاً."
    observations: "المفهوم يعبر عن فئة من الناس لم يقروا أو يعترفوا بذنوبهم أو أفعالهم. الترجمة (غير المعترفين) تؤدي الغرض الدلالي المطلوب بدقة رغم أنها تركيب النفي بالاسم (غير)."
  blind_candidates:
    - lemma: "مُنْكِرُونَ"
      generation_method: majaz
      justification: "امتداد دلالي من الإنكار، حيث أن من لم يعترف قد أنكر أو جحد."
    - lemma: "غَيْرُ مُعْتَرِفِينَ"
      generation_method: tarkib
      justification: "تركيب من أداة النفي (غير) واسم الفاعل (معترفين)، وهو مقابل دقيق لـ unconfessed."
    - lemma: "كَاتِمُو السِّرِّ"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر عن إخفاء الذنب أو الفعل وعدم البوح به."
    - lemma: "مُصِرُّونَ"
      generation_method: majaz
      justification: "امتداد من الإصرار على الذنب وعدم التوبة أو الاعتراف."

