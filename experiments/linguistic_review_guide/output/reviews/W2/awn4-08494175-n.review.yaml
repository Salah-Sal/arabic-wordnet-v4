      evidence_status: "no_material_found"
    - lemma: "كَاتِمُو السِّرِّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "غير المعترفين"
      decision: confirmed
      decision_reason: "تركيب مقبول ويؤدي المعنى الدقيق المقصود (الأشخاص الذين لم يعترفوا)، وهو مستخدم في السياقات للتعبير عن (the unconfessed)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تدل على حالة سلبية صريحة وهي عدم صدور الاعتراف، سواء صحبه إنكار أم مجرد سكوت."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَيْرُ المُعْتَرِفِينَ"
    - lemma: "مُنْكِرُونَ"
      source: stage1
      decision: removed
      decision_reason: "الإنكار يقتضي الجحود الإيجابي، بينما المفهوم يشير إلى مجرد عدم الاعتراف، والذي قد يكون بالسكوت."
    - lemma: "غَيْرُ مُعْتَرِفِينَ"
      source: stage1
      decision: removed
      decision_reason: "صيغة نكرة للمة الموجودة مسبقاً، ولا حاجة لإضافتها كمدخل منفصل."
    - lemma: "كَاتِمُو السِّرِّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير أعم ولا يقتصر على عدم الاعتراف بالذنب، بل يشمل حفظ الأسرار عموماً."
    - lemma: "مُصِرُّونَ"
      source: stage1
      decision: removed
      decision_reason: "الإصرار يعني المداومة على الفعل، ولا يتطابق تماماً مع دلالة عدم الاعتراف."

stage4_content:
  definition:
    current: "الناس الذين لم يعترفوا (بذنوبهم)"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه مصاغ بأسلوب يحتاج لبعض التشذيب المعجمي وإزالة الأقواس."
    authored:
      - type: terminological
        text: "مجموعة الأشخاص الذين لم يقروا بذنوبهم أو أخطائهم أو بما نُسب إليهم من أفعال."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-08494175-n"
          definition_index: 0
          text: "مجموعة الأشخاص الذين لم يقروا بذنوبهم أو أخطائهم أو بما نُسب إليهم من أفعال."
  examples:
