# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة «إبستيم» تفتقر إلى التشكيل الكامل في AWN4"
      - "لمة «نظام معرفي» تحمل التباساً مصطلحياً: في معاجم تقانة المعلومات تدل على «knowledge base system» لا على الإبستيمة الفوكوية"
      - "التعريف الحالي ركيك الصياغة ومبهم الجنس القريب؛ «مجموعة الأفكار» واسع جداً ولا يعكس عمق المفهوم الفلسفي"
      - "«المعرفة المؤكدة فكرياً» ترجمة حرفية للإنجليزية دون صياغة عربية أصيلة بأسلوب المعجم الوسيط"
      - "التعريف لا يُشير إلى الطابع التاريخي-الحقبي للمفهوم وهو من جوهر الإبستيمة عند فوكو"
    observations: >-
      المجموعة تدور حول مفهوم «الإبستيمة» الفوكوي — البنية المفاهيمية الضمنية الحاكمة لشروط
      المعرفة في حقبة تاريخية محددة. اللمة «إبستيم» تعريب للأصل اليوناني (ἐπιστήμη) عبر
      الفرنسية (épistémé) وتوثقها معاجم اللسانيات العربية الحديثة. أما «نظام معرفي» فتعبير
      وصفي عربي أشمل يغطي السياقين الفوكوي والتقني على حد سواء. المصطلح متخصص في الفلسفة
      والإنسانيات وأبوته الدلالية (المعرفة/الإدراك) مقبولة. يستوجب التعريف إعادة صياغة
      جذرية بأسلوب المعجم الوسيط بدلاً من الترجمة الحرفية.

  blind_candidates:
    - lemma: "مَعْرِفِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من «مَعْرِفِيّ» على غرار «عقلانية» و«إنسانية»؛ يدل على المنظومة
        الإبستيمية كمفهوم مجرد خاص بحقبة ما، مما يُجسّد المفهوم في لفظ مفرد مشتق
        من الجذر العربي (ع ر ف)
    - lemma: "بِنْيَة مَعْرِفِيَّة"
      generation_method: tarkib
      justification: >-
        تركيب وصفي يدل على الهيكل الذي تنتظم بها المعرفة في حقبة؛ «البنية» توحي
        بالطابع الضمني الخفي للإبستيم فوكوياً وهو مستخدم في أدبيات الفلسفة
        ونقد الخطاب العربي
    - lemma: "مِنْظُومَة المَعْرِفَة"
      generation_method: tarkib
      justification: >-
        تركيب إضافي يعبّر عن المجموعة المترابطة المتسقة من المفاهيم المشكّلة لإطار
        المعرفة؛ «المنظومة» توحي بالترابط الداخلي والتضافر بين مكونات الإبستيمة
        وتختلف عن «نظام» بإضافة دلالة الكمال والاتساق
    - lemma: "إِبِسْتِيمَة"
      generation_method: taarib
      justification: >-
        تعريب للأصل اليوناني (ἐπιστήμη) بإلحاق التاء المربوطة استناداً إلى أن الأصل
        اليوناني مؤنث وأن النمط الفرنسي (épistémé) يؤنَّث تأنيثاً صريحاً؛ يقبل
        لام التعريف والنسبة (إِبِسْتِيمِيَّة) والجمع (إِبِسْتِيمَات)


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفَّذة: ٣
# (١) headword batch: ابستيم + نظام معرفي + معرفية + ابستيمة + منظومة المعرفة + بنية معرفية
# (٢) English bridge: episteme + epistemic + epistemology + knowledge system
# (٣) Arabic FTS: معرفة + افكار + معرفي + معرفية + ابستيم + منظومة + نظام معرفي
# entry_ids محورية: 498050, 355281, 730884, 496171
stage2_evidence:
  per_lemma:

    - lemma: "إبستيم"
      confirm:
        - text: >-
            «إبسْتيم، وحدة معرفية: حقلُ تحديد الخلفيات النظرية كشرط لإمكانية
            معرفة بنيات سيميائية قابلة للتوالد تمثل مجتمعا سوسيو- ثقافيا»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: >-
            «قطيعة معرفية: لحظة تغير مفهومي داخل حقل معرفي، لهذا كانت القطيعة:
            'كسرا، عتبة، تحولا، انتقالا، تفكيكا، تجاوزا' لمعارف غير محددة،
            تتخللها أزمنة جديدة تفصلها عن الأصول والحوافز الأولية في مقاربة 'فوكو'»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: >-
            يُوثّق هذا المدخل المجاور الصلة المباشرة بين مفهوم الإبستيمة وفكر فوكو
            في المصطلحية العربية ويؤكد أن «إبستيم» يُستخدم ضمن منظومة مفاهيمية
            فوكوية متكاملة

    - lemma: "نظام معرفي"
      contradicts:
        - text: >-
            «نِظَامٌ مَعْرِفيّ: قاعدة معارف مستغلة بواسطة منوال للاستدلال،
            مثل: الاستدلال الاستنتاجي، والاستدلال الاستقرائي، وغيرهما»
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
          conflict: >-
            التعريف يخصّص «نظام معرفي» لـ«knowledge base system» في تقانة المعلومات
            وهو مفهوم تقني يتعلق بالاستدلال الآلي يختلف كلياً عن الإبستيمة الفوكوية
      expands:
        - text: "«أنساق معرفية: بنيات المعرفة المجردة»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: >-
            صيغة الجمع «أنساق معرفية» بمعنى البنيات المجردة للمعرفة تُقرّب دلالة
            «نظام/نسق معرفي» من مفهوم الإبستيمة الفوكوية في الأدبيات العربية
        - text: >-
            «شاهدٌ ذاتـي: [...] نظرا لضروراتٍ إحالية على نسق معرفي خاص
            لمدرسة أو تيار أدبي»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: >-
            يُوظَّف «نسق معرفي» في اللسانيات بمعنى الإطار المرجعي الخاص بمدرسة
            علمية أو تيار فكري وهو أقرب إلى الدلالة الفوكوية من تعريف تقانة
            المعلومات

    - lemma: "مَعْرِفِيَّة"
      contradicts:
        - text: "«معرفية: صفة وظيفة التواصل التي تساهم في كسب المعلومات»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: >-
            يُثبتها المعجم صفةً لوظيفة التواصل لا اسماً جامداً مستقلاً دالاً
            على منظومة إبستيمية
        - text: "«مَعْرِفِيَّة: من (ع ر ف) مؤنث مُعْرِفِي»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "تؤكد الإحالة الصرفية أن «معرفية» وصف لا اسم مستقل"

    - lemma: "بِنْيَة مَعْرِفِيَّة"
      expands:
        - text: "«بِنْيَةٌ مَعْرِفِيَّةٌ: cognitive structure»"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020)"
          addition: >-
            مُثبَّتة في المصطلحية العربية لكن بدلالة البنية المعرفية في علم النفس
            التربوي لا بدلالة الإبستيمة الفوكوية
      contradicts:
        - text: >-
            «بناء معرفيّ: كل ما يوجد داخل العقل البشري من معلومات وخبرات معرفية
            يتأثر بها المتعلم في تعلمه في أي وقت من عمره»
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: >-
            الدلالة تربوية-نفسية فردية لا فلسفية-حقبية؛ المعاجم تُخصّص هذا
            التعبير للحقل التربوي

    - lemma: "مِنْظُومَة المَعْرِفَة"
      evidence_status: "no_material_found"

    - lemma: "إِبِسْتِيمَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إبستيم"
      decision: confirmed
      decision_reason: >-
        موثّق في معجم اللسانيات (2002) بالترجمة الإنجليزية «episteme» والفرنسية «épistémé»،
        وتعريفه يُحيل إلى مفهوم الخلفيات النظرية في سياق فوكوي. التعريب مقبول: الأصل
        اليوناني ذو صيغة عالمية معيارية يقبل لام التعريف (الإبستيم) والنسبة (إبستيمي)
        والجمع (إبستيمات). يحتاج تحديث التشكيل للاستيفاء المعياري.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        المصطلح الفني المُعرَّب من اليونانية عبر الفرنسية؛ يُحيل تحديداً إلى المفهوم
        الفوكوي بلا لبس ويستخدمه المتخصصون في الفلسفة والدراسات الإنسانية مصطلحاً
        تقنياً مضبوطاً يُميّز الإبستيمة عن سائر مفاهيم المعرفة الأشمل
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِبِسْتِيم"

    - lemma: "نظام معرفي"
      decision: confirmed
      decision_reason: >-
        رغم أن معجم تقانة المعلومات يُعرّفه بمعنى «knowledge base system» المغاير، فإن
        «نظام معرفي» راسخ في الأدبيات الفلسفية والإنسانيات العربية للدلالة على منظومة
        المعرفة بالمعنى الفوكوي. شاهد اللسانيات («نسق معرفي خاص لمدرسة») ومدخل «أنساق
        معرفية: بنيات المعرفة المجردة» يُثبتان الاستخدام الفلسفي. وجوده يُتيح الاستيعاب
        لغير المتخصصين. يحتاج تحديث التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        التعبير العربي الأوسع دلالةً والأكثر تداولاً في التعليم والمسح الأدبي؛ يُستخدم
        في سياقات فوكوية وغير فوكوية على حد سواء (النظام المعرفي الإسلامي، نظام معرفي
        تقني)، مما يجعله أكثر إتاحةً للقارئ غير المتخصص وأقل تخصيصاً من «إِبِسْتِيم»
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَام مَعْرِفِيّ"

    - lemma: "مَعْرِفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        المعاجم تُثبتها وصفاً لا اسماً مستقلاً (مؤنث «مَعْرِفِيّ» ووصف لوظيفة التواصل).
        تفشل اختبار السكّ: «معرفية» صفة تُستخدم للنعت في تراكيب كثيرة (عملية معرفية،
        مرحلة معرفية) فلا تُعدّ مصطلحاً مُثبَّتاً بهذه الدلالة المحددة.

    - lemma: "بِنْيَة مَعْرِفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        مُثبَّتة في المصطلحية التربوية بدلالة «cognitive structure» المغايرة. تفشل اختبار
        التثبيت المعجمي: يمكن إبدال «بنية» بـ«هيكل» أو «بناء» وتظل الوصفية الحرة قائمة
        مما يكشف أنها تعبير وصفي لا مصطلح مسكوك. دلالتها التربوية الراسخة تنافس الدلالة
        الفلسفية المقصودة.

    - lemma: "مِنْظُومَة المَعْرِفَة"
      source: stage1
      decision: removed
      decision_reason: >-
        غائبة من قاعدة البيانات المعجمية. دلالتها مغطاة بـ«نظام معرفي» الموجودة في
        المجموعة. فضلاً عن ذلك «منظومة المعرفة» تُحيل إلى «المعرفة» كمفهوم مجرد
        شامل لا إلى الإبستيمة كإطار حقبي خاص.

    - lemma: "إِبِسْتِيمَة"
      source: stage1
      decision: removed
      decision_reason: >-
        غائبة من قاعدة البيانات المعجمية. التعريب المعيار الراسخ هو «إبستيم» (مذكر
        بلا تاء) كما أثبته معجم اللسانيات (2002). إضافة التاء المربوطة تعريب ثانوي
        غير مستقر لم تتبنّه المعاجم التخصصية وسيُوجد ازدواجاً غير مبرر مع «إبستيم».


