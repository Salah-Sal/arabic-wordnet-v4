# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04808417-n  |  ILI: i62234  |  POS: n
# التعريف: the quality of being unoriginal
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "تَقْلِيدِيَّة تُحيل في المعجمية العربية الحديثة إلى «traditionalism» (التمسّك بالتقاليد) أكثر مما تحيل إلى «unoriginality» (انعدام الأصالة)؛ فبين المفهومين تداخل لا تطابق."
      - "لَا أَصَالَة ليست لمّة معجمية مسكوكة بل عبارة وصفية حرة بالنفي المنقطع؛ تفشل اختبار السكّ (يمكن استبدال «أصالة» بـ«إبداع» وتبقى العبارة صالحة كوصف)."
      - "لا تشكيل كامل على اللمّات في البيانات الأصلية (تَقْلِيدِيَّة صحيحة، لَا أَصَالَة تفتقر إلى همز «أَصالة» المنسجم مع تشكيل المدخل)."
      - "المجموعة تفتقر إلى مصطلح اشتقاقي عربي صريح يقابل unoriginality بدقة؛ الفجوة المعجمية واضحة."
    observations: >
      المجموعة تُعرِّف صفةً سلبية مجردة هي انتفاء الأصالة والإبداع. الهرم المباشر (awn4-04731092-n)
      هو «صفة جوهرية ومميّزة» مما يجعل المجموعة في مرتبة مفاهيم الجودة المجردة. اللمّة
      «تَقْلِيدِيَّة» متداولة في النقد الأدبي والثقافي لوصف غياب الإبداع، لكن دلالتها الأصيلة
      هي المنهج التقليدي (adherence to tradition) لا انعدام الأصالة بالضرورة. أما «لَا أَصَالَة»
      فهي تركيب نفي فضفاض لا يرقى إلى مستوى المصطلح المعجمي. الحقل الدلالي يحتاج إعادة نظر.

  blind_candidates:
    - lemma: "اِبْتِذَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «بذل» — الابتذال في مقاييس اللغة لابن فارس «ترك صيانة الشيء»؛
        المصدر الصناعي «ابتذالية» يدل على صفة كون الشيء مبتذلاً مكروراً خالياً من
        الأصالة، مشتق على وزن (فِعَالية → اِبْتِذَالِيَّة) بإضافة ياء النسبة والتأنيث
        إلى المصدر الرباعي.
    - lemma: "اِتِّبَاعِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «تبع» — الاتباع هو السير خلف الغير والأخذ بأثره دون ابتكار؛
        «اِتِّبَاعِيَّة» مصدر صناعي يدل على الصفة المجردة للاتباع وعدم الاستقلالية الإبداعية.
    - lemma: "تَقْلِيدِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «قلد» — التقليد هو محاكاة الآخرين والسير على نهجهم؛ «تَقْلِيدِيَّة»
        مصدر صناعي من «تقليدي» يدل على صفة اتباع النماذج السابقة دون تجديد، مقابل
        طبيعي لـ conventionality/unoriginality في اللغة العربية المعاصرة.
    - lemma: "عَدَمُ الأَصَالَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «عدم» و«الأصالة»؛ مقابل مباشر لـ unoriginality بنفي المفهوم
        الأصيل. «الأصالة» موثّقة في المعجم الوسيط بمعنى «جودة الرأي وابتكار الأسلوب».


stage2_evidence:
  per_lemma:
    - lemma: "تَقْلِيدِيَّة"
      confirm:
        - text: "«(1) التقاليديّة: التمسُّك بالتقاليد (2) شيء تقليديّ. وبخاصة: تعبير تقليديّ؛ سلوك تقليديّ.»"
          source: "المورد الحديث (2008) — entry_id: 680080"
      contradicts:
        - text: "«تقليدية» [translation_en: traditionalism]"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm) — entry_id: 399965"
          conflict: >
            المصطلح مُصنَّف في ARABTERM تحت «traditionalism» (التقليدانية كمنهج إيديولوجي)
            لا تحت «unoriginality» (انعدام الأصالة كصفة سلبية)؛ بين الدلالتين فرق جوهري:
            التقليدية قد تكون موقفاً فكرياً محموداً بينما انعدام الأصالة وصف سلبي بالضرورة.

    - lemma: "لَا أَصَالَة"
      evidence_status: "no_material_found"

    - lemma: "اِبْتِذَالِيَّة"
      confirm:
        - text: "«(1) ابتذال؛ تفاهة (2) شيء مبتذَل.»"
          source: "المورد الحديث (2008) — entry_id: 672598"
        - text: "«(بَذَلَ) الباء والذال واللام كلمة واحدة، وهو ترك صيانة الشيء، يقال: بذلت الشيء بذلاً، فأنا باذل وهو مبذول، وابتذلته ابتذالاً.»"
          source: "مقاييس اللغة لابن فارس — entry_id: 985262"
      contradicts:
        - text: "«(1) ابتذال؛ تفاهة (2) شيء مبتذَل.»"
          source: "المورد الحديث (2008) — entry_id: 672598"
          conflict: >
            الدليل يقرن «الابتذال» بـ«التفاهة» (triviality/vulgarity) وهي دلالة أشد سلبية
            وأضيق من مجرد انعدام الأصالة؛ «المبتذل» يدل على الرخيص الحقير لا فقط على
            ما يفتقر إلى الإبداع.

    - lemma: "اِتِّبَاعِيَّة"
      expands:
        - text: "«(الاتباعية) فِي الْأَدَب والفن مَذْهَب المحاكين لمذاهب الْمُتَقَدِّمين (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين — entry_id: 868366"
          addition: >
            الاتباعية في المعجم الوسيط مصطلح نقدي محدد يشير إلى مدرسة فنية أو أدبية
            ترى في تقليد السابقين منهجاً، لا إلى الصفة المجردة لانعدام الأصالة عموماً.

    - lemma: "عَدَمُ الأَصَالَة"
      expands:
        - text: "«(الْأَصَالَة) فِي الرَّأْي جودته وَفِي النّسَب عراقته»"
          source: "المعجم الوسيط لمجموعة من المؤلفين — entry_id: 867558"
          addition: >
            توثيق الأصالة كضد المفهوم المقصود؛ عدم الأصالة = انتفاء هذه الجودة في الرأي
            والأسلوب. الأصالة في المعجم الوسيط هي: جودة الرأي + ابتكار الأسلوب + عراقة النسب.
        - text: "«(الأصالة) في الرأي: جودته في الأسلوب: ابتكاره في النسب: عراقته»"
          source: "المعجم الوسيط (OCR) — entry_id: 769"
          addition: >
            تعريف موسّع للأصالة يشمل ثلاثة مستويات (الرأي، الأسلوب، النسب)؛ يُفيد في
            صياغة تعريف انعدام الأصالة بعكس هذه المستويات.


stage3_analysis:
  per_lemma:
    - lemma: "تَقْلِيدِيَّة"
      decision: confirmed
      decision_reason: >
        رغم أن المعاجم الحديثة تُرجمها أحياناً بـ«traditionalism»، إلا أن «تَقْلِيدِيَّة»
        متداولة في النقد الأدبي والثقافي العربي بمعنى انعدام الأصالة والاكتفاء بمحاكاة السابقين،
        وهو ما تشهد به استعمالاتها الأسلوبية المألوفة (يعاني العمل من التقليدية). فضلاً عن أن
        المفهومين (التقليدانية وانعدام الأصالة) متداخلان دلالياً بما يُجيز الاشتراك. تجتاز
        الاختبارات الصرفية: وزن فعلية للمصدر الصناعي مناسب لإفادة الصفة المجردة. يحتاج
        تشكيل اللمّة تحقيقاً وتثبيتاً في المخرجات.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphology_check: "صحيحة صرفياً — مصدر صناعي من الصفة «تقليدي» على وزن (فَعْلِيَّة) بفتح العين، من الجذر «قلد»."
      borrowing_check: "عربي الأصل — لا إشكال."
      nuance_differentiation: >
        تَقْلِيدِيَّة تصف الصفة الكلية لانتفاء الابتكار وميل الشيء إلى اتباع النماذج السابقة؛
        وهي أشمل من «الاتباعية» (حركة فنية محددة) وأخف من «الابتذالية» (التي تنطوي على
        دلالة الرخص والتفاهة). تنفرد بأنها الوصف الجمالي-النقدي الأعم لغياب الإبداع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْلِيدِيَّة"

    - lemma: "لَا أَصَالَة"
      decision: removed
      decision_reason: >
        العبارة «لَا أَصَالَة» تفشل اختبار السكّ: يمكن استبدال «أصالة» بـ«إبداع» أو «تميّز»
        وتبقى العبارة وصفاً صادقاً، مما يدل على أنها تركيب حر لا مصطلح ثابت. لم يُسجَّل
        هذا التعبير كمدخل معجمي في أي من مصادر قاعدة البيانات. يختلف عن التراكيب المقبولة
        كـ«اللاوعي» و«اللامعقول» التي ترتبط الـ«لا» فيها كبادئة مورفولوجية لا كأداة نفي
        منفصلة. الإجراء: حذف الربط بالمجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اِبْتِذَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        اِبْتِذَالِيَّة تنطوي على دلالة الرخص والحقارة (تفاهة، انحطاط) أكثر من كونها صفة
        انعدام الأصالة؛ «المبتذَل» في الاستعمال يدل على ما صار مكشوفاً رخيصاً لا قيمة له،
        وهذه دلالة أشد سلبية وأضيق من «unoriginality». فضلاً عن ذلك، لم تُسجَّل «ابتذالية»
        بوصفها مصطلحاً مستقلاً في المعاجم العربية. مرفوضة.
      evidence_assessment:
        case: mixed

    - lemma: "اِتِّبَاعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الاتباعية» في المعجم الوسيط مصطلح نقدي يدل على مدرسة فنية/أدبية بعينها (مذهب
        المحاكين لمذاهب المتقدمين)، لا على الصفة المجردة لانعدام الأصالة. دلالتها أخص وأضيق
        من المطلوب؛ شيء ما قد يكون اتباعياً (منسجماً مع مدرسة كلاسيكية) دون أن يكون
        مفتقراً إلى الأصالة بالضرورة. مرفوضة.
      evidence_assessment:
        case: mixed

    - lemma: "عَدَمُ الأَصَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        «عَدَمُ الأَصَالَة» تركيب إضافي منتج لا مصطلح ثابت؛ يمكن تعويض «عدم» بـ«انعدام»
        أو «غياب» أو «شُحّ» وتبقى العبارة صحيحة وصفاً، مما يدل على أنها ليست وحدة معجمية
        متجمدة. لم تُسجَّل مدخلاً في أي معجم. مرفوضة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "تَقْلِيدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذه اللمّة المرشحة في المرحلة الأولى مطابقة للمّة الموجودة أصلاً (تَقْلِيدِيَّة).
        لا حاجة لإجراء إضافي — قرارها مندرج ضمن معالجة اللمّة الموجودة أعلاه.
      evidence_assessment:
        case: confirm_only


