stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "يَوْمٌ نَجْمِيٌّ"
      decision: confirmed
      decision_reason: "مصطلح ثابت في المعجم الموحد لمصطلحات الرياضيات والفلك (ALECSO 1990) والمورد الحديث (2008)، مؤيَّد بتعريف دقيق يطابق المفهوم المطلوب. يحتاج فقط إلى إضافة التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "يَوْمٌ نَجْمِيٌّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "يَوْمٌ فَلَكِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "أدلة متعارضة: في المعجم الموحد للفلك (ALECSO 1990) يقابل «يوم فلكي» المصطلحَ astronomical day لا sidereal day. رغم استخدامه بمعنى sidereal day في معجم الاستشعار عن بعد، إلا أن المرجع الفلكي التخصصي يُميّز بينهما، فإضافته ستُحدث التباساً."
      evidence_assessment:
        case: mixed

    - lemma: "يَوْمٌ كَوْكَبِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استخدام «يوم كوكبي» بمعنى اليوم النجمي. لفظ «كوكب» في الاستعمال المعاصر يعني planet لا star، فيوقع في اللبس."
      evidence_assessment:
        case: no_material

    - lemma: "دَوْرَةٌ نَجْمِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على تثبيت «دورة نجمية» كمصطلح لليوم النجمي. المفهوم وحدةٌ زمنية (يوم) لا حدثٌ (دورة)، والمصطلح المعتمد يستخدم «يوم» لا «دورة»."
      evidence_assessment:
        case: no_material

