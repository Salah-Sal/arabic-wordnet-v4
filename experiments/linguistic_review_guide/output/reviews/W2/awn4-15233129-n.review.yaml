          - text: "يَعتمدُ الفلكيّونَ اليَوْمَ النَّجْمِيَّ مِعياراً لِضَبْطِ المَراصِدِ، لأنَّهُ أَثْبَتُ مِنَ اليَوْمِ الشَّمْسِيِّ في رَصْدِ مَواقِعِ النُّجومِ."
            type: usage
    actions:
