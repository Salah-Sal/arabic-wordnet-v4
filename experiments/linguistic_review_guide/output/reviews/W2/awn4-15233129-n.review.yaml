stage4_content:
  definition:
    current: "الوقت لدورة كاملة واحدة للأرض بالنسبة لنجم معين، حوالي 4 دقائق أقصر من اليوم الشمسي المتوسط"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية، يفتقر إلى البنية المعجمية العربية (الجنس القريب + الفصل النوعي)، ويحتوي تراكيب ركيكة مثل «الوقت لدورة كاملة واحدة»"
    authored:
      - type: terminological
        text: "وَحْدَةٌ زَمَنِيَّةٌ فَلَكِيَّةٌ تُساوي الزَّمَنَ اللازِمَ لِدَوْرَةٍ كامِلَةٍ لِلأَرْضِ حَوْلَ مِحْوَرِها بِالنِّسْبَةِ إِلى نَجْمٍ ثابِتٍ، وَمِقْدارُها 23 ساعَةً و56 دَقيقَةً و4 ثَوانٍ تَقْريباً، فَهِيَ أَقْصَرُ مِنَ اليَوْمِ الشَّمْسِيِّ المُتَوَسِّطِ بِنَحْوِ أَرْبَعِ دَقائِقَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "وَحْدَةٌ زَمَنِيَّةٌ فَلَكِيَّةٌ تُساوي الزَّمَنَ اللازِمَ لِدَوْرَةٍ كامِلَةٍ لِلأَرْضِ حَوْلَ مِحْوَرِها بِالنِّسْبَةِ إِلى نَجْمٍ ثابِتٍ، وَمِقْدارُها 23 ساعَةً و56 دَقيقَةً و4 ثَوانٍ تَقْريباً، فَهِيَ أَقْصَرُ مِنَ اليَوْمِ الشَّمْسِيِّ المُتَوَسِّطِ بِنَحْوِ أَرْبَعِ دَقائِقَ."

  examples:
