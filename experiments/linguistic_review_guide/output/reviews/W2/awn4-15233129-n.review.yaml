# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15233129-n (sidereal day)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «يوم نجمي» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط، والمفهوم مصطلح فلكي متخصص قد يكون له بدائل"
      - "التعريف العربي ترجمة حرفية شبه كاملة من الإنجليزية — يحتاج إعادة صياغة بأسلوب معجمي"
    observations: "المفهوم هو اليوم النجمي، وهو وحدة زمنية فلكية تُقاس بدوران الأرض بالنسبة إلى نجم ثابت. المصطلح العربي «يوم نجمي» مركب وصفي ثابت في الأدبيات الفلكية العربية. لا بدّ من التحقق من وجود مرادفات مثل «يوم فلكي» أو اشتقاقات أخرى."

  blind_candidates:
    - lemma: "يَوْمٌ نَجْمِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «يوم» + «نجمي» (نسبة إلى النجم)، وهو الترجمة المباشرة والطبيعية لـ sidereal day في المصطلحية الفلكية العربية"
    - lemma: "يَوْمٌ فَلَكِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «يوم» + «فلكي» (نسبة إلى الفلك)، بديل محتمل باعتبار أن sidereal يُترجم أحياناً بـ«فلكي»"
    - lemma: "يَوْمٌ كَوْكَبِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «يوم» + «كوكبي» (نسبة إلى الكوكب بمعناه القديم أي النجم)، محاولة لاستثمار الدلالة التراثية"
    - lemma: "دَوْرَةٌ نَجْمِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «دورة» + «نجمية»، يركّز على المعنى الدوراني للمفهوم بدل الوحدة الزمنية"

# ═══════════════════════════════════════════════════════════════

stage2_evidence:
  per_lemma:
    - lemma: "يَوْمٌ نَجْمِيٌّ"
      confirm:
        - text: "«يوم نجمي» = sideral day"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ALECSO"
        - text: "«اليوم النّجميّ: فترةٌ مقدارُها 23 ساعة، و56 دقيقة، و4.09 ثوانٍ.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«نجميّ؛ فَلَكيّ.» = sidereal"
          source: "المورد الحديث (2008)"
          addition: "يبيّن أن «نجمي» و«فلكي» مترادفان في سياق sidereal"
        - text: "«نجمي» = sideral"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "تأكيد ثبات المصطلح في معاجم متعددة"

    - lemma: "يَوْمٌ فَلَكِيٌّ"
      confirm:
        - text: "«يوم فلكي» — دورة يومية تقاس بالتوقيت الفلكي، تبدأ وتنتهي بأول نقطة من برج الحمل عندما تكون فوق مستوى الزوال المرجعي. وهذه الدورة أقصر من اليوم الشمسي بأربع دقائق"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
      contradicts:
        - text: "«يوم فلكي» = astronomical day"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ALECSO"
          conflict: "في المعجم الموحد الأساسي للفلك، «يوم فلكي» يقابل astronomical day لا sidereal day، ممّا يجعله مصطلحاً مختلفاً"

    - lemma: "يَوْمٌ كَوْكَبِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "دَوْرَةٌ نَجْمِيَّةٌ"
      evidence_status: "no_material_found"

