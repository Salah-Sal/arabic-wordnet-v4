# synset: awn4-07278754-n  |  ili: i74846  |  pos: n
# radio beacon — إشارة مميزة يبعثها جهاز إرسال يستخدم للملاحة
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة (منارة لاسلكية) تُسمّي الجهاز/المحطة، في حين يُعرِّف الـsynset المفهومَ بوصفه 'إشارة مميّزة' — وهذا تمييز مفاهيمي دقيق ينبغي تجسيره في التعريف العربي"
      - "التعريف العربي الحالي يحمل غموضاً نحوياً: 'يستخدم للملاحة' قد يعود على الإشارة أو على جهاز الإرسال"
      - "اللمّة الموجودة 'منارة لاسلكية' خالية من التشكيل الكامل"
    observations: >
      المفهوم تقني ملاحي يشير إلى الإشارة اللاسلكية المميّزة التي تبثّها محطات الإرشاد الملاحي لتوجيه السفن والطائرات.
      الجذر نور يُنتج منارة بمعنى ما يُضاء به الطريق وتُهتدى به، وهو الحضور الأعمق في معاجم اللغة العربية لمفهوم العلامة
      الهادية؛ وقد أقرّت المعاجم التقنية العربية مصطلح 'منارة لاسلكية' في سياقات الملاحة البحرية والجوية والحرب
      الإلكترونية. ظهر في معاجم الحرب الإلكترونية مصطلح بديل هو 'صوّة راديوية' مستوحى من الصُّوَى (الأعلام الحجرية
      للاهتداء)، غير أنه أقل شيوعاً واستخداماً من منارة لاسلكية.

  blind_candidates:
    - lemma: "صَوَّةٌ لاسِلْكِيَّة"
      generation_method: tarkib
      justification: >
        صوّة (جمع صُوًى): علامات حجرية تُنصب للاهتداء بها في السفر. مقاييس اللغة: «وَمِنَ الْبَابِ الصُّوَى،
        وَهِيَ الْأَعْلَامُ مِنَ الْحِجَارَةِ». الإزاحة الدلالية من العلامة الحجرية الملاحية إلى العلامة الإذاعية
        الملاحية ترسيخٌ لمفهوم الإرشاد دون قطيعة مع الأصل. التركيب مع 'لاسلكية' ينتج وحدة معجمية دقيقة.
    - lemma: "مِرْسَال مَلَاحِيّ"
      generation_method: tarkib
      justification: >
        مِرْسَال على وزن مِفْعَال (أداة الإرسال) من جذر رسل؛ هذا الوزن يناسب أجهزة الإرسال والتوجيه.
        'ملاحي' يُقيّده في سياق الملاحة البحرية/الجوية. المركب يصف جهاز الإرسال الذي يبثّ الإشارة الملاحية.
    - lemma: "مَرْشَد لاسِلْكِيّ"
      generation_method: tarkib
      justification: >
        مَرْشَد من جذر ر-ش-د (الاستقامة والهداية)؛ مقاييس: «الْمَرَاشِدُ: مَقَاصِدُ الطُّرُقِ». المعجم الوسيط:
        'هادي السفن في المضايق'. تركيبه مع 'لاسلكي' يُنتج وصفاً لجهاز الإرشاد اللاسلكي الملاحي.
    - lemma: "مَنَار لاسِلْكِيّ"
      generation_method: tarkib
      justification: >
        مَنَار (لا منارة) — مقاييس اللغة (نور): «وَمِنْهُ مَنَارُ الْأَرْضِ: حُدُودُهَا وَأَعْلَامُهَا، سُمِّيَتْ
        لِبَيَانِهَا وَظُهُورِهَا». الشكل المذكر المفرد أوجز؛ تركيبه مع 'لاسلكي' يُنتج مصطلحاً موجزاً للعلامة
        الإذاعية الهادية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفَّذة: ٣ استعلامات
#   (١) مطابقة دفعية للمّات الموجودة + المرشّحات + مكوّنات المركّب
#   (٢) جسر إنجليزي: radio beacon / beacon / radio navigation
#   (٣) FTS عربي: ملاحة / لاسلكي / إرشاد ملاحي
#   (+١) استعلام مقاييس اللغة لجذور: نور، رشد، سلك، صوي
stage2_evidence:
  per_lemma:

    - lemma: "منارة لاسلكية"
      confirm:
        - text: "«منارة لاسلكية» (translation_en: radio beacon, domain: Oceanology)"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
        - text: "«المَنَارَة: الشَّمْعَة ذات السِّرَاج — المِئْذَنَة — ما يقام فى الموانى لتهتدى به السفن»"
          source: "المعجم الوسيط"
        - text: "«وَالْمَنَارَةُ: مَفْعَلَةٌ مِنَ الِاسْتِنَارَةِ، وَالْأَصْلُ مَنْوَرَةٌ. وَمِنْهُ مَنَارُ الْأَرْضِ: حُدُودُهَا وَأَعْلَامُهَا، سُمِّيَتْ لِبَيَانِهَا وَظُهُورِهَا»"
          source: "مقاييس اللغة لابن فارس (نور)"
      expands:
        - text: "«منارة لاسلكية اتجاهية» (translation_en: directional radio beacon)"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "يُثبت وجود مصطلح مشتق، مما يؤكد مركزية 'منارة لاسلكية' كقاعدة اصطلاحية ثابتة في علوم الملاحة"
        - text: "«منارة لاسلكية بحرية» (translation_en: maritime radio beacon) | «منارة لاسلكية لجميع الاتجاهات» (omnidirectional) | «منارة لاسلكية دوّارة» (revolving radio beacon)"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "سلسلة من المشتقات المتخصصة تؤكد إنتاجية المصطلح واستقراره في المعجم التقني"
        - text: "«أرمة إشعاعية: المنارة اللّاسلكيّة التي ترسل إشارةً إلى الطائرة للتعرّف على موقعها» (translation_en: marker beacon)"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "تعريف معجمي عربي مستقل يُعرِّف الأرمة بأنها 'المنارة اللاسلكية'، مما يُثبت أن منارة لاسلكية هو المصطلح المرجعي"
        - text: "«منارة (علامة إرشاد ملاحية): إشارة لاسلكية بالضوء لإرشاد الطائرات والسفن» (translation_en: beacon)"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "يدمج المنارة والإشارة اللاسلكية في تعريف واحد، مجسِّراً التمييز بين الجهاز والإشارة"
        - text: "«صوّة راديوية» (translation_en: radio beacon, domain: Electronic Warfare)"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
          addition: "مصطلح بديل نادر يستخدم صوّة (الأعلام الحجرية) بدلاً من منارة — لا تعريف نصي، يظل هامشياً مقارنة بمنارة لاسلكية"

    - lemma: "صَوَّةٌ لاسِلْكِيَّة"
      expands:
        - text: "«صوّة راديوية» (translation_en: radio beacon)"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
          addition: "يُثبت وجود تركيب صوّة + وصف تقني لـradio beacon، لكنه يستخدم 'راديوية' لا 'لاسلكية'، وبدون تعريف نصي"
        - text: "«(صَوِيَ) ... وَمِنَ الْبَابِ الصُّوَى، وَهِيَ الْأَعْلَامُ مِنَ الْحِجَارَةِ»"
          source: "مقاييس اللغة لابن فارس (صوي)"
          addition: "يُثبت أن الصُّوَى أعلام للاهتداء — الأساس الدلالي صحيح، لكنه لا يُسند تركيب 'صوّة لاسلكية' تحديداً"

    - lemma: "مِرْسَال مَلَاحِيّ"
      contradicts:
        - text: "«المِرْسَال: الرَّسُول، والنَّاقة السَّهْلة السَّيْرِ السَّريعةُ»"
          source: "المعجم الوسيط"
          conflict: "المرسال في المعجم الوسيط يعني الرسول أو ناقة سريعة — لا صلة بجهاز الإرسال اللاسلكي"
        - text: "«دنا المِرسال: خيط من الحمض النووي ينشئه دنا الجين في داخل نواة الخلية؛ لينقل صورة منه إلى خارج النواة كى يُبْنَى بروتينٌ معيَّنٌ»"
          source: "المعجم الكبير"
          conflict: "الاستخدام المعاصر الوحيد لمرسال في التقنية هو mRNA (الحمض النووي الريبوزي المرسال) — بعيد تماماً عن الملاحة اللاسلكية"

    - lemma: "مَرْشَد لاسِلْكِيّ"
      confirm:
        - text: "«المُرْشَد: الواعظ — هادى السفن فى المضايق — دليل الشرطة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«مرشد كاشوفي» (translation_en: radar beacon, domain: Physics)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "يُثبت وجود تركيب مرشد + وصف تقني لـbeacon، لكن في سياق الرادار لا الملاحة اللاسلكية"

    - lemma: "مَنَار لاسِلْكِيّ"
      confirm:
        - text: "«وَمِنْهُ مَنَارُ الْأَرْضِ: حُدُودُهَا وَأَعْلَامُهَا، سُمِّيَتْ لِبَيَانِهَا وَظُهُورِهَا»"
          source: "مقاييس اللغة لابن فارس (نور)"
      contradicts:
        - text: "«منارة لاسلكية» (radio beacon) موثّق في خمسة معاجم تقنية متعددة المجالات"
          source: "المعاجم التقنية ARABTERM (متعددة)"
          conflict: "الصيغة الراسخة في المعاجم التقنية هي 'منارة لاسلكية' (بالتأنيث) لا 'منار لاسلكي'؛ استخدام المذكر غير موثّق في السياق التقني"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "منارة لاسلكية"
      decision: confirmed
      decision_reason: >
        مؤكَّد بأدلة معجمية تقنية دامغة: مدخل مباشر في معجم علوم البحار مع ترجمة إنجليزية radio beacon،
        وخمسة مشتقات متخصصة (اتجاهية، بحرية، كلية الاتجاهات، دوّارة) تُثبت إنتاجية المصطلح واستقراره.
        الجذر نور راسخ في دلالة الإرشاد الملاحي (ما يقام فى الموانئ لتهتدى به السفن — المعجم الوسيط).
        يستوفي معايير الجودة الستة: اطّراد، يُسر تداول، ملاءمة، إيثار التراثي (منارة كلمة عربية أصيلة)،
        إيثار العربي، اشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "اللمّة الوحيدة في المجموعة؛ تُميِّز النوع اللاسلكي/الإذاعي من المنارات عن غيره (الضوئية والصوتية)، وتُشير إلى المحطة وإشارتها معاً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنَارَة لاسِلْكِيَّة"

    - lemma: "صَوَّةٌ لاسِلْكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الشواهد تُثبت وجود 'صوّة راديوية' (لا صوّة لاسلكية) في معجم واحد متخصص بلا تعريف نصي؛
        التركيب 'صوّة لاسلكية' غير موثّق. صوّة كلمة نادرة في الاستخدام الحديث. مصطلح 'منارة لاسلكية'
        أكثر شيوعاً وتوثيقاً بما لا يقارن.

    - lemma: "مِرْسَال مَلَاحِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المرسال في المعاجم الحديثة يُستخدم لـ mRNA (الحمض النووي الريبوزي المرسال) — وهو اشتراك لفظي
        خطير. الدلالة الكلاسيكية (رسول أو ناقة) لا صلة لها بالملاحة اللاسلكية. التركيب 'مرسال ملاحي'
        غير موثّق في أي مصدر.

    - lemma: "مَرْشَد لاسِلْكِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المرشد = هادي السفن في المضايق (شخص)، لا جهاز إرسال. تركيب 'مرشد كاشوفي' = radar beacon
        في الفيزياء لكنه يشير للرادار لا للمنارة اللاسلكية. الجمع بين مرشد ولاسلكي غير موثّق في المعاجم
        التقنية. المصطلح يُوحي بشخص أو محطة رادار لا بمحطة إرسال إشارات ملاحية.

    - lemma: "مَنَار لاسِلْكِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم التقنية تستخدم 'منارة لاسلكية' (بالتأنيث) حصراً دون توثيق لـ'منار لاسلكي' (بالتذكير).
        الصيغة المؤنثة أكثر اطّراداً في العربية التقنية للأجهزة والمنشآت. المرشح مرفوض لمجرد كونه
        نسخة غير موثقة من اللمّة الموجودة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
