        التعريف ترجمة حرفية للإنجليزية؛ يعانى من ثلاث مشكلات: (١) 'يستخدم للملاحة' مبهم المرجع نحوياً
        (الإشارة أم الجهاز؟)، (٢) لا يُصرِّح بالطابع اللاسلكي للإشارة مما يُميِّزها عن إشارات الملاحة
        الأخرى (الضوئية والصوتية)، (٣) صياغة 'يبعثها جهاز إرسال' أقل وضوحاً من 'تبثّها محطة إرسال ثابتة'.
