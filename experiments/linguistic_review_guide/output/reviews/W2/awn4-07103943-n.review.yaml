# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي 'يستخدم كلمات مفرطة أو فارغة' يُلبّس بين مفهومَي الإطناب (الزيادة لفائدة) والحشو (الزيادة لغير فائدة)؛ فالإطناب البلاغي يشترط الفائدة، وليس مجرد الكلام الفارغ."
      - "اللمّتان الحاليتان خاليتان من التشكيل."
      - "غياب إسهاب عن المجموعة رغم كونه المرادف المباشر المذكور في المعاجم المعاصرة كالمورد الحديث إلى جانب إطناب."
    observations: >
      المجموعة تُغطي مفهوم verbosity / prolixity الإنجليزي، وهو مفهوم بلاغي عربي
      راسخ يمتد من علم المعاني الكلاسيكي إلى اللسانيات الحديثة. المعجمية العربية
      تُفرّق تفريقاً دقيقاً بين ثلاثة مستويات: (أ) الإطناب وهو التوسع اللفظي لغرض
      بياني، (ب) الإسهاب وهو الإطالة المطلقة سواء أفادت أم لا، (ج) الحشو وهو
      الزيادة المحضة التي لا طائل تحتها. التعريف الحالي يُرجَّح أنه يُغطي المفهوم
      العام (verboseness) الذي يشمل الثلاثة، لا المعنى الاصطلاحي الدقيق للإطناب
      وحده.

  blind_candidates:
    - lemma: "إِسْهَابٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر سهب على وزن إِفْعَال؛ السَّهْبُ الفلاةُ الواسعة، ومنه أسهب في
        كلامه إذا اتسع وأطال. الوزن يدل على الإيقاع المصدري للفعل المزيد، وهو
        مألوف في مصطلحات علم المعاني.
    - lemma: "تَطْوِيلٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر طول على وزن تَفْعِيل؛ يدل على إطالة الكلام بما يزيد على أصل
        المراد. مصطلح بلاغي موثق عند الجرجاني والتهانوي في مقابل الإيجاز.
    - lemma: "ثَرْثَرَةٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر الرباعي ثرثر على وزن فَعْلَلَة؛ يدل على الإكثار من الكلام في
        تخليط وإفراط. المعنى الأصلي يُلامس "الكلمات الفارغة" في التعريف.
    - lemma: "تَفَيْهُقٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر فهق على وزن تَفَيْعُل (الامتلاء والاتساع)؛ ورد في الحديث
        الشريف "إنَّ أبغضَكم إليَّ الثَّرثارون المُتفيهقون"، ومعناه التوسع
        المتكلَّف في الكلام والتشدق.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "إطناب"
      confirm:
        - text: "«(في علم المعاني): أن يزيد اللفظ على المعنى لفائدة. وهو يقابل الإيجاز, وتوسطهما المساواة»"
          source: "المعجم الوسيط"
        - text: "«البلاغَةُ في المَنْطِق والوَصْفِ, مَدْحًا كانَ أَو ذَمًّا (في علم المَعانِي): زِيادةُ اللَّفْظِ على المَعْنَى لفائدةٍ وَهُوَ يُقابِل الإِيجازَ»"
          source: "المعجم الكبير"
        - text: "«الإطناب: أداء المقصود بأكثر من العبارة المتعارفة، من أطنب الرجل إذا بالغ في قوله بمدح أو ذم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الإطناب والإيجاز من أعظم أنواع البلاغة، حتى نقل عن البعض أنه قال البلاغة هي الإيجاز والإطناب»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«إطناب؛ إسهاب» [ترجمة verbosity]"
          source: "المورد الحديث (2008)"
        - text: "«إسهاب؛ إطناب؛ إطالة [حتى الإملال]» [ترجمة prolixity]"
          source: "المورد الحديث (2008)"
        - text: "«الإطناب؛ الإسهاب؛ كَثْرة الكلام» [ترجمة wordiness]"
          source: "المورد الحديث (2008)"
        - text: "«فيوض فوق الحاجة، أو التكرار في التعبير» [ترجمة redundancy]"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      contradicts:
        - text: "«أن يزيد اللفظ على المعنى لفائدة»"
          source: "المعجم الوسيط"
          conflict: >
            قيد «لفائدة» يُخالف وصف التعريف الحالي للمجموعة بـ«كلمات فارغة»؛
            إذ الإطناب البلاغي الأصيل ليس فارغاً بل مقصوداً لغرض بياني. التعريف
            الحالي يُلصق بالإطناب صفة الخلو من الفائدة وهي سمة الحشو لا الإطناب.
      expands:
        - text: "«أغرق وأسهب وأَطْنَبَ وأفرط وأعلى وأبلغ واشتط وامعن وأسرف...»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
          addition: "يُدرج ابن مالك الإطناب ضمن سلسلة دلالية تعني المبالغة والتجاوز في القول، مما يؤكد دلالته على التوسع اللفظي."

    - lemma: "حشو"
      confirm:
        - text: "«من الكلام: فَضْلُه الذى لا يُعْتَمَدُ عليه (عند البلاغيين): زيادةٌ مُتَعَيِّنَةٌ في الكلام لغير فائدةٍ»"
          source: "المعجم الكبير"
        - text: "«الحشو: هو في اللغة ما تملأ به الوسادة، وفي الاصطلاح: عبارة عن الزائد الذي لا طائل تحته»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الحشو: Pleonasm، verbiage... كلمات في وسط الكلام زائدة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«صفة الزيادة التي لا تدخل تغييراً على معنى العبارة الأصلية» [ترجمة pleonasm]"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«وجه أسلوبي له معنى الإعادة أو التكرار» [ترجمة redundancy]"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«تحصيل حاصل في التعبير. أو هو تكرار للمعنى لا لزوم له» [ترجمة tautology]"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«الكلمات الحشوية هي الكلمات التي تكون خالية من المعنى في جمل معينة لكنها قد يكون لها دلالة في جمل أخرى» [ترجمة Expletive]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«فضل الكلام»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الحشو) من الكلام الفضل الذي لا خير فيه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«الحَشْو [في الكلام]» [ترجمة pleonasm & verbiage]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) الحشو [في الكلام] (2) طريقة التَّعبير [في الكلام]؛ بيان» [ترجمة verbiage]"
          source: "المورد الحديث (2008)"
          addition: "يُشير المورد الحديث إلى استخدام الحشو في المعنى الأوسع لـ verbiage الذي يعني طريقة التعبير الكلامية عموماً، لا الزيادة الاصطلاحية فحسب."

    - lemma: "إسهاب"
      confirm:
        - text: "«الإسهاب: بالهاء عند أهل المعاني أعم من الإطناب وهو التطويل لفائدة أو لا لفائدة. وقيل هو الإطناب»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«إسهاب؛ إطناب؛ إطالة [حتى الإملال]» [ترجمة prolixity]"
          source: "المورد الحديث (2008)"
        - text: "«إطناب؛ إسهاب» [ترجمة verbosity]"
          source: "المورد الحديث (2008)"
        - text: "«الإطناب؛ الإسهاب؛ كَثْرة الكلام» [ترجمة wordiness]"
          source: "المورد الحديث (2008)"
        - text: "«إسهاب؛ إطناب» [في سياق redundancy ولفظية]"
          source: "المورد الحديث (2008)"
        - text: "«إشارة إلى تنامي فكرة عبر أسلوب إطنابي يعارض التكثيف...» [إسهاب، توسّع — ترجمة amplification]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"

    - lemma: "تطويل"
      confirm:
        - text: "«التطويل: هو أن يزاد اللفظ على أصل المراد، وقيل: هو الزائد على أصل المراد بلا فائدة»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«التطويل عند أهل المعاني هو أن يكون اللفظ زائداً على أصل المراد لا لفائدة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«تَطْويل» [ترجمة allongement (elongation) / elongation في المعجم الطبي]"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الاستخدام الغالب لكلمة تطويل في المعاجم التقنية والطبية والهندسية يتعلق بالإطالة المادية، مما يُعرّض اللمّة لالتباس دلالي في سياق الأسلوب البلاغي."

    - lemma: "ثرثرة"
      expands:
        - text: "«الإكثار من الكلام في تخليط» [ترجمة hyperphasia]"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "الثرثرة في القاموس الطبي مرتبطة بأمراض الكلام والاضطرابات النفسية (logorrhea, verbigeration, hyperphasia)، مما يُبعدها عن السمة الأسلوبية الرفيعة المقصودة."
        - text: "«(1) ثرثرة؛ هَذَر (2) إطناب» [ترجمة أحد المصطلحات البلاغية]"
          source: "المورد الحديث (2008)"
          addition: "يذكر المورد الحديث الثرثرة كمقابل لبعض المصطلحات البلاغية، لكن مقرونةً بـ هَذَر ومقابلةً لـ إطناب، لا مرادفةً له."

    - lemma: "تفيهق"
      confirm:
        - text: "«(تفيهق) في كلامه توسع وتنطع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«وفي الحديث (إنَّ أبغضَكم إليَّ الثَّرثارون المُتفيهقون)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
      contradicts:
        - text: "«تَفَيْهَقَ» [مُقيَّد بـ pos: verb في المعجم الوسيط (OCR)]"
          source: "المعجم الوسيط (OCR)"
          conflict: "الصيغة المستخدمة في المعاجم فعل لا مصدر مستقل؛ والمصدر تَفَيْهُق غير موثق كمصطلح مستقل. كما أن المعنى مُقيَّد بالتشدق والتكلف لا بالإفراط في الكلام مجرداً."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إطناب"
      decision: confirmed
      decision_reason: >
        اللمّة موثقة في كبريات المعاجم الكلاسيكية والمعاصرة بوصفها المصطلح
        البلاغي الراسخ للتعبير عن زيادة اللفظ. يُذكر إلى جانب إسهاب كمقابل
        عربي لـ verbosity وprolixity وwordiness في المورد الحديث ومعاجم المنظمة
        العربية للتربية والثقافة والعلوم. الجذر طنب (ثبات في استطالة) يدعم
        الدلالة الاصطلاحية. يستوجب إضافة التشكيل الكامل.
      evidence_assessment:
        case: mixed
      nuance_differentiation: >
        يدل الإطناب أصالةً على التوسع اللفظي المقصود لغرض بلاغي كالتأكيد
        والإيضاح؛ وهو بذلك يحمل إيحاءً إيجابياً أو محايداً في النقد الأدبي.
        في الاستخدام المعاصر اتسع ليشمل الإفاضة المُفرطة عموماً.
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِطْنَابٌ"

    - lemma: "حشو"
      decision: confirmed
      decision_reason: >
        اللمّة هي المصطلح الأدق لمعنى "الكلمات الفارغة" في تعريف المجموعة؛
        إذ تدل اصطلاحاً على الزائد المتعيَّن الذي لا طائل تحته (الجرجاني،
        كشاف الاصطلاحات، المعجم الكبير). مُعادِلُه الإنجليزي المباشر pleonasm /
        verbiage موثق في معاجم ArabTerm والمورد الحديث. يستوجب إضافة التشكيل.
      evidence_assessment:
        case: confirm_only
      nuance_differentiation: >
        يدل الحشو على الزيادة المحضة التي يصح الاستغناء عنها دون أدنى إخلال
        بالمعنى؛ وهو في النقد الأسلوبي عيبٌ صرف بخلاف الإطناب الذي قد يكون
        فضيلة. الحشو أضيق دلالةً وأحدّ في الذم.
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَشْوٌ"

    - lemma: "إِسْهَابٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثق في كشاف اصطلاحات الفنون بأنه "أعم من الإطناب وهو التطويل لفائدة
        أو لا لفائدة"، مما يجعله أشمل تغطيةً لمعنى المجموعة. يرد في المورد
        الحديث مقابلاً مباشراً لـ verbosity وprolixity وwordiness جنباً إلى جنب
        مع إطناب. الجذر سهب (الاتساع) يدعم الدلالة. لا التباس في الاستخدام
        البلاغي.
      evidence_assessment:
        case: confirm_only
      nuance_differentiation: >
        الإسهاب أعمّ دلالةً من الإطناب والحشو معاً؛ يشمل الإطالة مطلقاً
        بصرف النظر عن غرضها. وهو الأكثر شيوعاً في الاستخدام العصري للتعبير
        عن الإفاضة الكلامية غير المقيَّدة بحكم قيمي.
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "إِسْهَابٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَطْوِيلٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيقه مصطلحاً بلاغياً في كتب القرن الثامن عشر الهجري (الجرجاني،
        التهانوي) بمعنى "زيادة اللفظ لا لفائدة"، إلا أن مئات المداخل في معاجم
        ArabTerm تستخدمه للإطالة المادية (أنابيب، تجعد، مسافات)، مما يُولّد
        غموضاً دلالياً يُبعده عن الاستخدام الاصطلاحي المنفرد في سياق الأسلوب.
        الحشو والإطناب والإسهاب تُغطي المفهوم بلا التباس.

    - lemma: "ثَرْثَرَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الثرثرة في المعاجم الطبية واللسانية مرتبطة أساساً بأمراض الكلام
        والاضطرابات (logorrhea, verbigeration, hyperphasia)، وتحمل إيحاءً
        سلبياً بالتخليط والحماقة بعيداً عن مفهوم الأسلوب التعبيري. لا تصلح
        مصطلحاً بلاغياً رفيعاً لمرادفة verboseness. الفرق في السجل اللغوي
        (register) يحول دون إدراجها.

    - lemma: "تَفَيْهُقٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الاستخدامات الموثقة تجعله فعلاً لا اسماً مصطلحياً مستقلاً (المعجم
        الوسيط يُقيّده بـ pos:verb). فضلاً عن ذلك يحمل معنى التشدق والتكلف
        والتفخيم لا مجرد الإفراط في الكلام. وهو من الألفاظ نادرة التداول في
        الاستخدام المعاصر. ارتباطه الحديثي بالثرثارين يُقيّده في سياق الذم
        الأخلاقي لا الوصف الأسلوبي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "أسلوب تعبيري يستخدم كلمات مفرطة أو فارغة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مترجَم ترجمةً حرفية من الإنجليزية ويُلبّس بين المفهوم
        العام للإفراط اللفظي ومفهوم الكلمات الفارغة الخاص بالحشو. يفتقر إلى
        الصياغة المعجمية العربية الأصيلة، ولا يُميّز الجنس القريب (ضرب من
        الأسلوب) عن الفصل النوعي (الزيادة اللفظية على قدر المعنى).
    authored:
      - type: terminological
        text: "ضَرْبٌ من الأسلوب التعبيري يُزاد فيه اللفظُ على قدر المعنى؛ وهو يقابل الإيجاز، وقد يكون لفائدة بلاغية فيُسمَّى إطناباً، أو لغير فائدة فيُسمَّى حشواً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "الإفراطُ في الكلام وإكثارُه فوق قدر الحاجة، بحيث يزيد اللفظُ على ما يقتضيه المعنى."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
