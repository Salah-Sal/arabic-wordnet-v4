# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
stage5_enrichment:

  per_entry:

    - lemma: "مُعْجَمٌ ذِهْنِيّ"
      entry_id: "{auto}"
      roots:
        - word: "معجم"
          root: "عجم"
          maqayis_quote: >
            «الْعَيْنُ وَالْجِيمُ وَالْمِيمُ ثَلَاثَةُ أُصُولٍ:
            أَحَدُهَا يَدُلُّ عَلَى سُكُوتٍ وَصَمْتٍ،
            وَالْآخَرُ عَلَى صَلَابَةٍ وَشِدَّةٍ،
            وَالْآخَرُ عَلَى عَضٍّ وَمَذَاقَةٍ.
            فَالْأَوَّلُ الرَّجُلُ الَّذِي لَا يُفْصِحُ
            هُوَ أَعْجَمُ»
        - word: "ذهني"
          root: "ذهن"
          maqayis_quote: >
            «الذَّالُ وَالْهَاءُ وَالنُّونُ أَصْلٌ يَدُلُّ
            عَلَى قُوَّةٍ... وَالذِّهْنُ: الْفِطْنَةُ
            لِلشَّيْءِ وَالْحِفْظُ لَهُ. وَكَذَلِكَ
            الذَّهَنُ»

    - lemma: "مُفْرَدَات"
      entry_id: "{auto}"
      root: "فرد"
      maqayis_quote: >
        «الْفَاءُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ
        يَدُلُّ عَلَى وُحْدَةٍ. مِنْ ذَلِكَ الْفَرْدُ
        وَهُوَ الْوَتْرُ. وَالْفَارِدُ وَالْفَرْدُ:
        الثَّوْرُ الْمُنْفَرِدُ»

    - lemma: "حَصِيلَةٌ لُغَوِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "حصيلة"
          root: "حصل"
          maqayis_quote: >
            «الْحَاءُ وَالصَّادُ وَاللَّامُ أَصْلٌ وَاحِدٌ
            مُنْقَاسٌ، وَهُوَ جَمْعُ الشَّيْءِ،
            وَلِذَلِكَ سُمِّيَتْ حَوْصَلَةُ الطَّائِرِ;
            لِأَنَّهُ يَجْمَعُ فِيهَا. وَيُقَالُ
            حَصَّلْتُ الشَّيْءَ تَحْصِيلًا»
        - word: "لغوية"
          root: "لغو"
          maqayis_quote: >
            «اللَّامُ وَالْغَيْنُ وَالْحَرْفُ الْمُعْتَلُّ
            أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ
            عَلَى الشَّيْءِ لَا يُعْتَدُّ بِهِ،
            وَالْآخَرُ عَلَى اللَّهَجِ بِالشَّيْءِ»

  per_sense:

    - lemma: "مُعْجَمٌ ذِهْنِيّ"
      sense_id: "{auto}"
      nuance: >
        يبرز الطابعَ المعرفي النفسي؛ يصوّر الرصيدَ اللفظي
        نظاماً تمثيلياً منظَّماً في الذاكرة الطويلة الأمد،
        مرتبطاً بالقدرة اللغوية لا بمجرد قائمة محصاة.
        يُستخدم في الأدبيات اللسانية المتخصصة.
      mwe: true

    - lemma: "مُفْرَدَات"
      sense_id: "{auto}"
      nuance: >
        يركّز على الكلمات بوصفها وحداتٍ متمايزةً قابلةً
        للتعداد والتصنيف والاختبار؛ أشيع في التعليم والمناهج
        وعلم اللغة التطبيقي. يخفّف البُعدَ المعرفي المنظَّم
        الذي يبرزه «المعجم الذهني».

    - lemma: "حَصِيلَةٌ لُغَوِيَّة"
      sense_id: "{auto}"
      nuance: >
        يبرز بُعد الاكتساب والتراكم المتدرج عبر الزمن؛
        يصوّر المفردات ثمرةً لجهد لغوي متراكَم (كحصيلة
        الضرائب والأرباح)، مع تلميح ضمني إلى المسار
        التعليمي وعمليات التعلم. مفضَّل في خطاب تعليم
        اللغات وتقييمها.
      mwe: true

  synset:
    cultural_fit: native

  actions:
    # entry note — معجم ذهني (MWE)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"معجم","root":"عجم","maqayis":"«الْعَيْنُ وَالْجِيمُ وَالْمِيمُ ثَلَاثَةُ أُصُولٍ: أَحَدُهَا يَدُلُّ عَلَى سُكُوتٍ وَصَمْتٍ...»"},{"word":"ذهني","root":"ذهن","maqayis":"«الذَّالُ وَالْهَاءُ وَالنُّونُ أَصْلٌ يَدُلُّ عَلَى قُوَّةٍ... وَالذِّهْنُ: الْفِطْنَةُ لِلشَّيْءِ وَالْحِفْظُ لَهُ»"}]}'

    # entry note — مفردات (single word)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فرد","maqayis":"«الْفَاءُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى وُحْدَةٍ...»"}'

    # entry note — حصيلة لغوية (MWE)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"حصيلة","root":"حصل","maqayis":"«الْحَاءُ وَالصَّادُ وَاللَّامُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ، وَهُوَ جَمْعُ الشَّيْءِ...»"},{"word":"لغوية","root":"لغو","maqayis":"«اللَّامُ وَالْغَيْنُ... الْآخَرُ عَلَى اللَّهَجِ بِالشَّيْءِ»"}]}'

    # sense note — معجم ذهني
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يبرز الطابع المعرفي النفسي؛ نظام تمثيلي منظّم في الذاكرة الطويلة الأمد مرتبط بالقدرة اللغوية","mwe":true}'

    # sense note — مفردات
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركّز على الكلمات بوصفها وحدات متمايزة قابلة للتعداد؛ أشيع في التعليم وعلم اللغة التطبيقي","mwe":false}'

    # sense note — حصيلة لغوية
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يبرز بُعد الاكتساب والتراكم المتدرج عبر الزمن؛ مفضّل في خطاب تعليم اللغات وتقييمها","mwe":true}'

    # synset note
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'

    # confidence
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.82
