          source: "مسرد الإعلام والتواصل — ALECSO، entry_id: 486678، translation_en: telegenic"
          addition: "الجذر ملح مستعمل في المعجم العربي الإعلامي للدلالة على ما يناسب التصوير التلفزيوني جمالياً، مما يُسند إمكانية تركيب «ملاحة تلفزية»"
