# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تلفزيونية» تفتقر إلى تشكيل كامل"
      - "اللمّة «صلاحية تلفزيونية» تفتقر إلى تشكيل كامل"
      - "التعريف الحالي يستعمل «جودة الارتباط» وهي صياغة غامضة؛ إذ المفهوم الحقيقي هو الخاصية الجمالية والعرضية للظهور على الشاشة، لا مجرد الارتباط بالبث"
      - "المجموعة تفتقر إلى معرّف ILI"
    observations: >
      المجموعة تعالج مفهوم الخاصية التلفزيونية (telegenicity)، وهي جودة معيارية تندرج تحت
      الخاصيات الجوهرية. اللمّتان الموجودتان مشتقتان بصورة منطقية من المعجم التلفزيوني
      العربي: «تلفزيونية» صيغة مجردة مكثفة على نمط المصدر الصناعي من الصفة المنسوبة،
      و«صلاحية تلفزيونية» مركّب وصفي يُفصّل الدلالة. غير أن غياب التشكيل وضعف
      صياغة التعريف يستوجبان التدخل. المفهوم في المعجم العربي متحقق جزئياً عبر الصفة
      «تلفازيّ» (=صالح للعرض على الشاشة) لكنه يفتقر إلى اسم الخاصية المجرد المكرّس.

  blind_candidates:
    - lemma: "تَلَفَزِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي (-يَّة) مشتق من الجذر الرباعي المعرَّب «تلفز» على غرار «إعلاميَّة»
        و«مرئيَّة» و«تجاريَّة»، للدلالة على الخاصية التلفزيونية بصيغة مكثفة. الوزن
        فَعَلِيَّة من رباعي يناسب اسم الخاصية المجردة.

    - lemma: "مَلاحَةٌ تَلَفَزِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «مَلاحَة» (المصدر من ملح = حُسن المنظر والبهاء) و«تَلَفَزِيَّة»
        (النسبة إلى التلفزة)، للدلالة على الجاذبية الجمالية الخاصة بالظهور التلفزيوني.
        يعتمد على جذر ملح المرتبط بمفهوم الجمال الشخصي المناسب للتلفزة في المعجمية العربية.

    - lemma: "مَرئِيَّة"
      generation_method: majaz
      justification: >
        مصدر صناعي من «مَرئِيّ» (المنسوب إلى الرؤية والعرض المرئي) موسَّع دلالياً
        بالمجاز المرسل ليشمل خاصية الصلاحية للعرض التلفزيوني، قياساً على تحوّل الصفات
        إلى أسماء خاصيات مجردة في العربية المعاصرة.

    - lemma: "تِيلِيجِينِيَّة"
      generation_method: taarib
      justification: >
        تعريب المصطلح الإنجليزي «telegenicity» بإضافة ياء النسب والتاء المربوطة
        على النمط الإغريقي-العالمي المعتمد في المصطلحات الدولية، ويقبل ال- والجمع السالم
        والنسبة. ملاذ أخير في غياب بديل عربي مسكوك.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
# 1. مطابقة دفعية للمّات الموجودة والمرشحات (لم تُعطِ نتائج للمّات مباشرة)
# 2. الجسر الإنجليزي (telegenic / televisual / telegenicity)
# 3. بحث FTS بكلمات مفتاحية (تلفزيوني / تلفزة / تلفاز / ملاءمة)
# 4. مطابقة دفعية للأشكال الصفية المجاورة (تلفزيوني / تلفزي / تلفازي)
# 5. مقاييس اللغة لجذري صلح وملح
stage2_evidence:
  per_lemma:
    - lemma: "تلفزيونية"
      confirm:
        - text: "«تلفزيونيّ؛ تَلْفَزِيّ.»"
          source: "المورد الحديث (2008) — entry_id: 722639، translation_en: televisual"
        - text: "«تِلِفزيون... مسرحيّة تِلِفزيونيّة: مسرحيّة مكتوبة أو مهيَّأة للتلفزيون»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر — entry_id: 857317"
      expands:
        - text: "«تلفازيّ: صالحٌ للعرض على شاشة التلفزيون.»"
          source: "المورد الحديث (2008) — entry_id: 722584، translation_en: telegenic"
          addition: "يؤكد أن الصفة المنسوبة إلى التلفاز/التلفزيون تحمل دلالة الصلاحية للعرض، وهو الأساس الاشتقاقي للمّة تلفزيونية كاسم خاصية"

    - lemma: "صلاحية تلفزيونية"
      confirm:
        - text: "«الصَّلاحيَّةُ... الاتِّساق في عملٍ ما. الصلاحية للعمل: حسن التهيُّؤ له»"
          source: "المعجم الوسيط — entry_id: 16153، dict_source_type: ocr"
        - text: "«الصَّلَاحِيَّة... الاتِّساقُ والمناسبةُ لغرض ما... حسنُ التهيؤ والاستعدادُ له»"
          source: "المعجم الكبير — entry_id: 56478، dict_source_type: ocr"
      expands:
        - text: "«تلفازيّ: صالحٌ للعرض على شاشة التلفزيون.»"
          source: "المورد الحديث (2008) — entry_id: 722584، translation_en: telegenic"
          addition: "الصفة «تلفازي» تُكافئ «تلفزيوني» في دلالة الصلاحية للعرض، مما يُسند المركَّب «صلاحية تلفزيونية» معجمياً"
        - text: "«مَلِيح: شخص ملائم، جماليا، للتصوير في التلفزة»"
          source: "مسرد الإعلام والتواصل — ALECSO، entry_id: 486678، translation_en: telegenic"
          addition: "يُثبت أن العربية المعاصرة تُعبّر عن مفهوم «telegenic» عبر وصف الملاءمة التلفزيونية، وهو جوهر المركّب «صلاحية تلفزيونية»"

    - lemma: "تَلَفَزِيَّة"
      confirm:
        - text: "«تلفزيونيّ؛ تَلْفَزِيّ.»"
          source: "المورد الحديث (2008) — entry_id: 722639، translation_en: televisual"
          # يُثبت أن الشكل «تلفزي» صيغة مستعملة موثّقة في المعجم
      expands:
        - text: "«تلفزَ يتلفز، تلفزةً... تِلفاز [مفرد]: جهاز نقل الصور والأصوات... تِلِفزيون [مفرد]... تلفزة [مفرد]: (فز) بثّ متواصل لصور بصرية»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر — entry_id: 857317"
          addition: "يُثبت أن الجذر «تلفز» جذر رباعي معترف به مجمعياً وقابل للاشتقاق، مما يسند إمكانية اشتقاق «تلفزية» منه"

    - lemma: "مَلاحَةٌ تَلَفَزِيَّة"
      expands:
