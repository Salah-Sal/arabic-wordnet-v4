# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تلفزيونية"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة اشتقاقياً؛ إذ هي مصدر صناعي من الصفة المنسوبة «تلفزيوني»
        على نمط الخاصيات المجردة المعاصرة (عربية، علمية، إنسانية). وردت الصفة الأم
        «تلفزيوني»/«تلفزي» في معجمين موثّقين (معجم المعاصر، والمورد الحديث)، كما
        أقرّ مجمع اللغة المصري الاشتقاق من «التلفاز». غير أنها تفتقر إلى تشكيل كامل
        يستوجب التحديث.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صيغة مجردة مكثفة تُشير إلى الخاصية التلفزيونية بوجه عام دون تحديد وجه
        الصلاحية أو غرضها؛ هي الأوفر شيوعاً وأنسب السياقات غير الرسمية والإعلامية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تِلِفزيونِيَّة"

    - lemma: "صلاحية تلفزيونية"
      decision: confirmed
      decision_reason: >
        مركّب وصفي ثابت يُعبّر عن مفهوم الملاءمة التلفزيونية بصورة وظيفية صريحة.
        مكوّنه الأول «صلاحية» موثّق في المعجم الوسيط والمعجم الكبير، ومكوّنه الثاني
        «تلفزيونية» مُثبت في اللمّة الأولى. المركّب يجتاز اختبار السكّ كوحدة اصطلاحية
        (لا يمكن إبدال «صلاحية» بـ«جودة» مع الإبقاء على الدلالة الاصطلاحية الدقيقة).
        يفتقر إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركّز على البُعد الوظيفي للخاصية (الملاءمة والصلاحية المهنية) ويُستعمل في
        الأسلوب التقني والرسمي والإعلامي المتخصص، في حين تبقى «تلفزيونية» أكثر
        تجريداً وشيوعاً في الخطاب العام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَلاحِيَّةٌ تِلِفزيونِيَّة"

    - lemma: "تَلَفَزِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مكرّرة مع «تلفزيونية» الموجودة؛ إذ إن كلتيهما مصطلحتان مشتقتان من الجذر
        نفسه «تلفز»، والفارق بينهما أسلوبي لا دلالي جوهري («تلفزي» مقابل «تلفزيوني»
        وردا معاً في المورد الحديث كأشكال مكافئة). الإبقاء على «تلفزيونية» أكثر شيوعاً
        يغني عن إضافة «تلفزية» التي تُثقل المجموعة بمرادف غير ضروري.

    - lemma: "مَلاحَةٌ تَلَفَزِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُسجَّل في أي معجم كوحدة اصطلاحية ثابتة، ولا تجتاز اختبار السكّ
        (يمكن إبدال «ملاحة» بـ«جمالية» أو «حسن» وتبقى الجملة وصفاً صحيحاً).
        فضلاً عن ذلك، «ملاحة» تُحيل أساساً إلى الجمال الشخصي لا إلى الخاصية
        المجردة لمفهوم telegenicity. أدلة الجذر ملح تُسند معنى الجمال البشري،
        لكنها لا تُثبت تثبيتاً معجمياً لهذا المركّب.

    - lemma: "مَرئِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «مرئية» في العربية التقنية تُقابل «visibility» أو «visual quality»، لا «telegenicity».
        الأدلة تُثبت أن «مرئي» = televisual بمعنى «ما يخص الصور البصرية» لا بمعنى
        «الصالح للظهور الجذاب على الشاشة»؛ وهو فارق دلالي حاسم. استعمالها لهذا المفهوم
        يُفضي إلى اشتراك لفظي مع المصطلح التقني المستقر.

    - lemma: "تِيلِيجِينِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا مسوّغ للتعريب مع وجود مصطلحات عربية أصيلة مؤكدة في المجموعة
        (تلفزيونية، صلاحية تلفزيونية). يُطبَّق مبدأ إيثار العربي على التعريب وفق
        منهجية التوليد المصطلحي المعتمدة، ولا تُجاز مرتبة التعريب إلا عند استنفاد
        الاشتقاق والتركيب.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "جودة الارتباط بالبث التلفزيوني أو الملاءمة له"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يستعمل «جودة الارتباط بالبث التلفزيوني» وهي صياغة غامضة؛
        «الارتباط» لا يُحدّد طبيعة العلاقة ولا ما الذي يجعل الشيء صالحاً. كما أن
        التعريف يُسوّي بين «الارتباط» و«الملاءمة» دون تمييز، في حين أن المفهوم
        الجوهري لـtelegenicity هو الخاصية الجمالية والعرضية للظهور على الشاشة.
        يُقترح تعريف مصطلحي يُحدد الجنس القريب (خاصية) والفصل النوعي (الظهور الجذاب
        والمؤثر على الشاشة).
    authored:
      - type: terminological
        text: >
          خاصيَّةُ الشخصِ أو الشيءِ الصالحِ للظهورِ بصورةٍ جذابةٍ ومؤثِّرةٍ على
          شاشةِ التلفزيون، من حيث المظهر والتعبير وحضور الشاشة
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          صلاحُ الشيءِ أو الشخصِ للبثِّ التلفزيوني، ومدى حسنِ ظهورِهِ وتأثيرِه
          في المشاهدين عبر الشاشة
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-92428598-n"
          definition_index: 0
          text: >
            خاصيَّةُ الشخصِ أو الشيءِ الصالحِ للظهورِ بصورةٍ جذابةٍ ومؤثِّرةٍ على
            شاشةِ التلفزيون، من حيث المظهر والتعبير وحضور الشاشة
      - command: add_definition
