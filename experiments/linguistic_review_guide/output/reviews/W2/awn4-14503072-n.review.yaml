      maqayis_quote: "«الْمِيمُ وَاللَّامُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ وَصِحَّةٍ... ثُمَّ قِيلَ مَلَكَ الْإِنْسَانُ الشَّيْءَ يَمْلِكُهُ مَلْكًا. وَالِاسْمُ الْمِلْكُ؛ لِأَنَّ يَدَهُ فِيهِ قَوِيَّةٌ صَحِيحَةٌ.»"
    - lemma: "مِلْك"
