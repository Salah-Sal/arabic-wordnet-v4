stage3_analysis:
  per_lemma:

    - lemma: "تسجيل"
      decision: confirmed
      decision_reason: >-
        اللمّة راسخةٌ في مصطلحية التسجيل الصوتي والمرئي عبر مصادر عديدة
        (المورد الحديث، الهندسة الكهربائية، الإعلام والتواصل، موسوعة IEC 60050،
        المعجم الكبير). دلالتُها على المنتَج (الكلام أو الصوت المسجَّل)
        موثَّقة صراحةً في المورد الحديث (entry_id 712303)، وهي خيارٌ مقبول
        على الرغم من كونها مصدراً في الأصل. تحتاج إضافة تشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        اللمّة الوحيدة المؤكَّدة في المجموعة؛ تُستعمل هنا بمعناها المنتَجي
        (الإشارة أو المادة المخزَّنة) لا المصدري (فعل التسجيل)، وهو توسعٌ
        موثَّق في المعاجم الحديثة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسْجِيل"

    - lemma: "تَسْجِيلَة"
      source: stage1
      decision: removed
      decision_reason: >-
        التسجيلة مصطلحٌ مستقرٌّ في المعجمية العربية المعلوماتية بمعنى
        «سجلّ قاعدة البيانات» (data record)، وهو مفهومٌ مختلف اختلافاً جذرياً
        عن إشارة التسجيل الصوتي/المرئي؛ استخدامها هنا سيُحدث اشتراكاً لفظياً
        مشكلاً مع المصطلحية المعلوماتية القائمة.

    - lemma: "مُسَجَّل"
      source: stage1
      decision: removed
      decision_reason: >-
        مُسَجَّل في المعاجم الحديثة يعني «الموثَّق رسمياً» (خطاب مسجَّل،
        عقد مسجَّل)؛ وفي كتب اللغة يعني «المُباح لكل أحد». دلالته على
        «الإشارة المُرمَّزة للتسجيل الصوتي» غائبةٌ في المصادر، فضلاً عن
        أنه اسمُ مفعولٍ وظيفته الوصفية لا الاسمية عادةً.

    - lemma: "إِشَارَةٌ مُسَجَّلَة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود لهذا التعبير كوحدة معجمية ثابتة في أي مصدر. يفشل اختبارَ
        السكّ: يمكن إبدال «مسجَّلة» بـ«صوتية» أو «رقمية» ويبقى وصفاً صالحاً،
        مما يُثبت أنه عبارة وصفية حرة لا مصطلح مسكوك.

    - lemma: "رَقِيم"
      source: stage1
      decision: removed
      decision_reason: >-
        الرقيم لفظٌ تراثي مرتبط بسياقات بعينها (لوح أصحاب الكهف، الكتاب
        المكتوب)، وإعادة توظيفه للإشارة الكهربائية المسجَّلة لا تجد
        سنداً في المصادر المعجمية ولا في الاستعمال الحديث. علاوةً على ذلك
        ستؤدي إلى ارتباك مع الدلالة التراثية الراسخة.


stage4_content:
  definition:
    current: "إشارة تشفر شيئاً (مثل صورة أو صوت) تم تسجيله"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي يعاني من مشكلتين: (١) يستخدم «تم تسجيله» المشتق
        من الجذر ذاته (سجل) الذي تُمثِّله اللمّة «تسجيل»، فيقع في دوران
        دلالي جزئي. (٢) كلمة «تشفر» تُوحي بالتعمية الأمنية (encryption)
        لا بحمل المعلومة وترميزها في وسيط، والأدق «تُمثِّل» أو «تحمل».
    authored:
      - type: terminological
        text: >-
          إشارةٌ كهربائيةٌ أو مغنطيسيةٌ أو رقميةٌ تحملُ محتوىً صوتيًّا
          أو مرئيًّا أو كليهما في صورةٍ مُرمَّزةٍ مخزَّنةٍ على وسيط
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >-
          ما خُزِّن من صوتٍ أو صورةٍ أو كليهما في هيئةٍ إشاريةٍ مُرمَّزةٍ
          قابلةٍ لإعادة إنتاجه وبثِّه
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
