# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الوحيدة (إشارة زوال الخطر) تعبيرٌ وصفي مركّب من ثلاث كلمات، يفتقر إلى السكّ الاصطلاحي المحكم"
      - "التعريف الحالي يُكرّر دلالة اللمّة ذاتها بصياغة مشابهة (دوران جزئي)"
      - "التعريف يستخدم أسلوب 'تفيد بأن' الإخباري بدلاً من 'تُعلن' الإنجازي الأكثر دقةً في التعريفات المعجمية"
      - "لا يوجد في المجموعة مصطلح أحادي مسكوك لهذا المفهوم"

    observations: >
      المفهوم المقصود هو إشارة انتهاء الخطر في سياقات الدفاع المدني والطوارئ، وهو ما يقابله
      بالإنجليزية "all clear". اللمّة الحالية 'إشارة زوال الخطر' وصفيّةٌ صحيحة، إلا أنها
      مركبة إضافية ثلاثية الكلمات لا يُعدّ مثلها عادةً مصطلحًا مسكوكًا إلا بتثبيت معجمي
      مُحكم. يلاحظ أن التعريف الحالي فيه شبه دوران إذ يعرّف 'إشارة' بـ'إشارة'. وصنف المجموعة
      الفائقة المباشرة (awn4-06804229-n) هو 'إشارة/علامة' وهو جنس قريب مناسب.


  blind_candidates:
    - lemma: "نَفِيرُ الأَمَانِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: نَفِير (الصوت الذي يُنفَر به، أي نداء الانتقال من حال إلى حال) +
        الأَمَان (السلامة). النَّفِير العَام معروف في الموروث العربي بوصفه صوتًا إيذانيًا
        بحالة طارئة. يُقابَل هنا بدلالة الانتقال من حالة الخطر إلى حالة السلامة.
        اختبار السكّ: 'نفير' لا يُستبدَل بـ'صوت' أو 'إشارة' في هذا التعبير بلا تغيير دلالي.

    - lemma: "أَمَان"
      generation_method: majaz
      justification: >
        في الموروث العسكري العربي، 'الأَمَان' هو النداء الذي يُعلن انتهاء الخطر على الخصم
        ويمنحه السلامة ("أَعطوه الأَمَان"). هذه المشابهة الوظيفية — إعلان انتهاء الخطر —
        تجعله مرشحًا لإحياء دلالي (إزاحة دلالية) ليدل على الإشارة الحديثة التي تُعلن
        انتهاء خطر الغارة أو الطوارئ.

    - lemma: "إِشَارَةُ الأَمَانِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي مقتضب: إِشَارَة (الجنس) + الأَمَان (الوظيفة الدلالية). أبسط وأوجز من
        'إشارة زوال الخطر' مع احتفاظه بالجنس القريب ذاته. قابل لقبول ال- والنسبة والجمع.

    - lemma: "صَفَّارَةُ الأَمَانِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: صَفَّارَة (الأداة الصوتية الشائعة لهذا الإعلان بوصفها وزن فَعَّالة
        للآلات) + الأَمَان. يُقابل 'صفارة إنذار' في الاتجاه المعاكس دلاليًا؛ الإنذار
        عند بدء الخطر، والأمان عند انتهائه.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "إشارة زوال الخطر"
      confirm:
        - text: "«إشارة زوال الخطر.»"
          source: "المورد الحديث (2008) — ترجمة all clear"
      expands:
        - text: "«إشارة واضحة / إشارة مقفلة — clear signal; signal off»"
          source: "موسوعة الكهرباء (IEC 60050) — Electropedia"
          addition: >
            يكشف عن استخدام 'إشارة واضحة' في السياق الكهروتقني بمعنى إشارة الانتهاء
            (signal off)، وهو مجاور دلاليًا للمفهوم وإن لم يكن مطابقًا له.

    - lemma: "نَفِيرُ الأَمَانِ"
      contradicts:
        - text: "«النَّفِير: الكُفْء في المفاخرة. القوم يَنْفِرُون للقتال. (النَّفِير العَامُّ): قيام عامة الناس لقتال العدوِّ»"
          source: "المعجم الوسيط"
          conflict: >
            النَّفِير في المعاجم يدل على الخروج والتعبئة للقتال أي بداية الخطر لا نهايته،
            وهو نقيض دلالي للمفهوم المستهدف.
      expands:
        - text: "«النفير: هو جهاز إشارات سمعية يُصدر صوتًا أو أصواتًا مُتتابعة بواسطة ضغّاط (النفير مُتعدد النغمات)»"
          source: "مسرد هندسة وتكنولوجيا السيارات — ArabTerm"
          addition: >
            في المصطلحية التقنية المعاصرة يُستخدم 'النفير' لجهاز التنبيه الصوتي (fanfare)
            بمعنى جهاز صوتي، لكن لا يُخصَّص لإشارة انتهاء الخطر تحديدًا.
        - text: "«النُّونُ وَالْفَاءُ وَالرَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَجَافٍ وَتَبَاعُدٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            أصل الجذر (نفر) يدل على التجافي والابتعاد، وهو يتعارض مع دلالة 'الأمان والعودة
            للاطمئنان' التي يستلزمها المفهوم المستهدف.

    - lemma: "أَمَان"
      confirm:
        - text: "«اطمئنان النّفس وزوال الخوف, لِعَدَم توقُّع مكروه. العَهْد»"
          source: "المعجم الكبير"
        - text: "«أَمَان: من (أ م ن) الاطمئنان والسلامة والاستقرار»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«الأمَان: إِزَالَة الْخَوْف عَن الْكَافِر من غير مَال»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: >
            الأمان في الاستعمال الفقهي والكلاسيكي يدل على عقد إيجابي يُمنح للخصم، وهو حالة
            قانونية لا إشارة صوتية. والاستعمال التقني الحديث (arabterm: safety) يدل على
            مفهوم السلامة العامة لا الإشارة المحددة لانتهاء الخطر.
      expands:
        - text: "«الْهَمْزَةُ وَالْمِيمُ وَالنُّونُ أَصْلَانِ مُتَقَارِبَانِ: أَحَدُهُمَا الْأَمَانَةُ الَّتِي هِيَ ضِدُّ الْخِيَانَةِ، وَمَعْنَاهَا سُكُونُ الْقَلْبِ، وَالْآخَرُ التَّصْدِيقُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            سكون القلب وزوال الخوف هما الدلالة الجوهرية للجذر (أمن)، مما يُثبت الصلة
            الدلالية بالمفهوم المستهدف، لكن دون أن يُفيد استعمال 'أَمَان' بمعنى الإشارة تحديدًا.

    - lemma: "إِشَارَةُ الأَمَانِ"
      evidence_status: "no_material_found"

    - lemma: "صَفَّارَةُ الأَمَانِ"
      expands:
        - text: "«صفارة انذار — siren»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ArabTerm"
          addition: >
            'صفارة إنذار' مصطلح تقني مثبت لجهاز التنبيه الصوتي. ومنه يُستدل على قبول
            التركيب 'صفارة + اسم' في المصطلحية العربية، لكن 'صفارة الأمان' بمعنى إشارة
            انتهاء الخطر لم يُسجَّل في أي من المصادر المستعلَمة.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "إشارة زوال الخطر"
      decision: confirmed
      decision_reason: >
        اللمّة مُوثَّقة توثيقًا صريحًا في المورد الحديث (2008) بوصفها المقابل العربي
        المعتمد لـ"all clear". رغم كونها تعبيرًا مركبًا وصفيًا يفتقر إلى السكّ
        الاصطلاحي الكامل، فإن تسجيلها في معجم معاصر متخصص يمنحها الشرعية اللغوية
        الكافية للإبقاء عليها. لا يوجد مرادف أوجز مُسجَّل في أي مصدر موثوق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تختص بالإشارة التي تُعلن انتهاء الخطر وعودة الأمان،
        في مقابل 'إشارة الإنذار' (إشارة بدء الخطر) وهي نقيضها الوظيفي. تتمايز عن الجنس
        الفائق 'إشارة/علامة' بتخصيص المحتوى (زوال الخطر) والسياق (الدفاع المدني والطوارئ).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَةُ زَوَالِ الْخَطَرِ"

    - lemma: "نَفِيرُ الأَمَانِ"
      source: stage1
      decision: removed
      decision_reason: >
        جذر (نفر) يدل على التجافي والخروج والتعبئة للقتال، وهو عكس دلالة السكون والأمان
        التي يستلزمها المفهوم. 'النَّفِير العَامُّ' يعني تعبئة الناس للقتال (بدء الخطر)
        لا إعلان انتهائه. فضلًا عن ذلك، 'النفير' في المصطلحية التقنية المعاصرة مُخصَّص
        لأنبوب أوستاكيوس في الطب ولجهاز التنبيه الصوتي في هندسة السيارات؛ وهو ما يجعل
        استخدامه لإشارة انتهاء الخطر مُوقِعًا في تعارض دلالي. المركب غير مُسجَّل.
      evidence_assessment:
        case: contradicts_only

    - lemma: "أَمَان"
      source: stage1
      decision: removed
      decision_reason: >
        'أَمَان' مصطلح يدل على حالة الاطمئنان والسلامة (state of safety) لا على الإشارة
        الصوتية أو المرئية التي تُعلن انتهاء الخطر (signal). الفارق بين 'حالة الأمن'
        و'إشارة انتهاء الخطر' فارق نوعي في المقولة الدلالية (state vs. communicative act).
        استخدام 'أمان' لمدلول الإشارة يُفضي إلى اشتراك لفظي مع معانيه الراسخة.
      evidence_assessment:
        case: mixed

    - lemma: "إِشَارَةُ الأَمَانِ"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير غير مُسجَّل كمصطلح ثابت في أي مصدر مستعلَم. ويفتقر إلى التخصيص الدلالي:
        'الأمان' أعم من 'زوال الخطر'، إذ يمكن أن تُطلق 'إشارة الأمان' على أي إشارة
        تتعلق بالسلامة، بما فيها إشارات المنظومات الأمنية وإشارات المرور، خلافًا لـ
        'إشارة زوال الخطر' التي تحدد السياق بدقة (ما بعد التهديد/الغارة).
      evidence_assessment:
        case: no_material

    - lemma: "صَفَّارَةُ الأَمَانِ"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير غير مُسجَّل كمصطلح ثابت. ويقع خطأ مقوليًا: المجموعة ترادفية تمثل إشارةً
        (رسالة تواصلية) لا آلةً (أداة صوتية). الصفارة هي الوسيلة لا الرسالة ذاتها،
        وبالتالي فالمصطلح يلتبس بين الدال والمدلول. قياسًا على 'صفارة إنذار' (المُثبَّت
        في ArabTerm بمعنى siren) يصح استعماله للأداة، لكن لا للإشارة المفهومية.
      evidence_assessment:
        case: no_material


