          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَنْظُومَةٌ غَيْرُ خَطِّيَّةٍ"
      source: stage1
      decision: confirmed
      decision_reason: "استخدام 'منظومة' يعطي دلالة أقوى على ترابط المكونات، وهو مرادف قوي لـ 'نظام'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مَنْظُومَةٌ غَيْرُ خَطِّيَّةٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَنْظُومَةٌ لَاخَطِّيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة علمية مركبة سليمة وشائعة في الأبحاث التخصصية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مَنْظُومَةٌ لَاخَطِّيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "نظام لا يمكن وصف أدائه بمعادلات من الدرجة الأولى"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً ويربط المفهوم بأساسه الرياضي (معادلات الدرجة الأولى)."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نِظَامٌ لا يُمْكِنُ وَصْفُ أَدَائِهِ بِمُعَادَلَاتٍ مِنَ الدَّرَجَةِ الأُولَى."
  examples:
    per_lemma:
      - lemma: "نِظَامٌ غَيْرُ خَطِّيّ"
        examples:
          - text: "تُعدُّ حركةُ البندولِ البسيطِ في الزوايا الكبيرةِ مِثالاً على نظامٍ غيرِ خطيٍّ."
            type: usage
      - lemma: "نِظَامٌ لَاخَطِّيّ"
        examples:
          - text: "تَتطلبُ دراسةُ أيِّ نظامٍ لاخطيٍّ أدواتٍ رياضيةً متقدمةً تختلفُ عن تلك المستخدمةِ في الأنظمةِ الخطيةِ."
            type: usage
      - lemma: "مَنْظُومَةٌ غَيْرُ خَطِّيَّةٍ"
        examples:
          - text: "يُشكّلُ الغلافُ الجويُّ للأرضِ منظومةً غيرَ خطيّةٍ بالغةَ التعقيدِ."
            type: usage
      - lemma: "مَنْظُومَةٌ لَاخَطِّيَّةٌ"
        examples:
          - text: "يؤدي التغذيةُ الراجعةُ في هذه المنظومةِ اللاخطيّةِ إلى ظهورِ سلوكياتٍ غيرِ متوقعةٍ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تتميزُ الأنظمةُ غيرُ الخطيّةِ بأنَّ استجابتَها لا تتناسبُ طردياً مع المدخلاتِ."}

