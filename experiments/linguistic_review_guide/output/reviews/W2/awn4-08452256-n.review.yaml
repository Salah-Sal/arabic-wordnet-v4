stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "نظام غير خطي" تفتقر إلى التشكيل الكامل، وهو أمر ضروري في المصطلحات العلمية لضمان النطق الصحيح (خَطِّيّ vs خُطِّيّ).
    observations: "المصطلح يشير إلى مفهوم رياضي وهندسي دقيق. في العربية، يُعبر عن 'non-linear' بتركيبين شائعين: 'غير خطي' و'لاخطي'. كلاهما مستخدم في الأدبيات العلمية العربية المعاصرة، وإن كان 'لاخطي' يميل للظهور أكثر في التخصصات الدقيقة كالهندسة الكهربائية والفيزياء."
  blind_candidates:
    - lemma: "نِظَامٌ غَيْرُ خَطِّيّ"
      generation_method: tarkib
      justification: "الترجمة الأكثر شيوعاً ومباشرة لمصطلح nonlinear system."
    - lemma: "نِظَامٌ لَاخَطِّيّ"
      generation_method: tarkib
      justification: "استخدام السابقة 'لا' لنفي الصفة (non-) شائع جداً في المصطلحات العلمية الحديثة، وهو أكثر إيجازاً."
    - lemma: "مَنْظُومَةٌ غَيْرُ خَطِّيَّةٍ"
      generation_method: tarkib
      justification: "استخدام 'منظومة' كبديل لـ 'نظام' شائع في سياق النظم المعقدة."
    - lemma: "مَنْظُومَةٌ لَاخَطِّيَّةٌ"
      generation_method: tarkib
      justification: "صيغة اصطلاحية علمية دقيقة تجمع بين 'منظومة' والصفة المنفية 'لاخطية'."

stage2_evidence:
  per_lemma:
    - lemma: "نظام غير خطي"
      confirm:
        - text: "«معادلات خطية: معادلات من الدرجة الأولى»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
      expands:
        - text: "«علاقة غير خطية: non-linear relationship»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
    - lemma: "نظام لاخطي"
      confirm:
        - text: "«ضبط لاخطي: Nonlinear control Non-linear control. عملية ضبط لا يسري عليها مبدأ التراكب...»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
        - text: "«عنصر تحويل لاخطي: Nonlinear transfer element»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
    - lemma: "منظومة غير خطية"
      confirm:
        - text: "«شبكة لاخطية: non-linear network. شبكة تقوم عناصرها بتغيير قيمتها مع تغيّر الزمن والجهد... كما أن قانون التراكب لا تنطبق عليه المعادلات الرياضية الخاصة بالشبكات اللاخطية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "منظومة لاخطية"
      confirm:
        - text: "«برمجة لاخطية: nonlinear programming. في بحوث العمليات: إجراءٌ لتحديدِ موضعِ القيمةِ العظمى... وتكون الدالّةُ، أو القيود، أو كلتاهما، لاخطّيّة.»"
          source: "معجم مصطلحات المعلوماتية (2000)"

stage3_analysis:
  per_lemma:
    - lemma: "نظام غير خطي"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والمستخدم بكثرة في المناهج التعليمية والترجمات العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَامٌ غَيْرُ خَطِّيّ"
    - lemma: "نِظَامٌ لَاخَطِّيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح علمي موجز ودقيق، يشيع استخدامه في الفيزياء والهندسة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
