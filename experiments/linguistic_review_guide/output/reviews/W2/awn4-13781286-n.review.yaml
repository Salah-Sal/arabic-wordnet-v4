# مراجعة المجموعة الترادفية — awn4-13781286-n
# المقدار التقريبي لشيء ما
# region / neighborhood (approximate amount)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «جوار» لا تُستعمل في العربية بدلالة المقدار التقريبي؛ هذا نقلٌ حرفي من دلالة neighborhood الإنجليزية المجازية"
      - "لمّة «نطاق تقريبي» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ"
      - "لمّة «حدود» تصلح فقط في التركيب الجرّي «في حدود» ولا تدلّ بمفردها على المقدار التقريبي"
      - "المجموعة تفتقر إلى الألفاظ العربية الأصيلة الدالّة على التقريب الكمّي مثل زُهاء ونَحْو وحَوالَيْ"
    observations: "المفهوم المقصود هو اسمٌ يدلّ على المقدار التقريبي لشيء ما، يُستعمل عادةً مع حروف الجرّ للدلالة على التقريب (كقولك: في حدود كذا، نحو كذا، زهاء كذا). هذا المفهوم أصيل في العربية وله ألفاظ فصيحة عديدة أبرزها زُهاء ونَحْو، لكن اللمّات الحالية تعتمد على الاقتراض المفهومي من الإنجليزية أو على عبارات وصفية."
  blind_candidates:
    - lemma: "زُهَاء"
      generation_method: ishtiqaq
      justification: "من الجذر ز-ه-و على وزن فُعال، ومعناه في المعاجم: مقدار الشيء وما يقرُب منه. يُقال: هم زُهاءُ ألفٍ. لفظٌ فصيح أصيل يؤدّي المعنى المطلوب بدقّة."
    - lemma: "نَحْو"
      generation_method: majaz
      justification: "أصل معناه القصد والجهة، ثم توسّع مجازاً ليدلّ على المقدار التقريبي. يُقال: عنده نحوٌ من مئة رجل. استعمال قديم ثابت في المعاجم."
    - lemma: "حَوَالَيْ"
      generation_method: ishtiqaq
      justification: "ظرفٌ من الجذر ح-و-ل بمعنى الإحاطة والدوران، يُستعمل للتقريب بمعنى نَحْو أو زُهاء. يُقال: حوالَيْ مئة شخص."
    - lemma: "قُرَابَة"
      generation_method: ishtiqaq
      justification: "من الجذر ق-ر-ب على وزن فُعالة، بمعنى ما يقارب الشيء. احتمالٌ مبنيّ على القياس الصرفي."

stage2_evidence:
  per_lemma:
    - lemma: "جِوَار"
      confirm:
        - text: "«جِوار — neighborhood»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
        - text: "«(3) «أ» منطقة مجاوِرة: جوار. «ب» مقدار تقريبيّ: ما يقارب has in the neighborhood of $20.000»"
          source: "المورد الحديث"
      contradicts:
        - text: "«(الْجوَار) المَاء الْكثير العميق وَمن الدَّار طوارها وَهُوَ مَا كَانَ على حَدهَا وبحذائها — (الْجوَار) الْعَهْد والأمان»"
          source: "المعجم الوسيط"
          conflict: "المعاجم العربية تحصر دلالة الجوار في المعنى المكاني (القرب، المجاورة) والعهد؛ معنى المقدار التقريبي مأخوذ من الإنجليزية فقط"
        - text: "«اذْهَبْ في جِوار الله — جوارُ الدَّار: جَوارُها — معاهدةُ حُسْن الجوار: معاهدة صداقةٍ بين دولتين»"
          source: "المعجم الكبير"
          conflict: "لا أثر لدلالة المقدار التقريبي في المعجم الكبير"

    - lemma: "حُدُود"
      confirm:
        - text: "«الحُدُود: جمع حدّ في اللغة: المنعُ»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: "«حدود — limits»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
          addition: "في الاستعمال الاصطلاحي الحديث تُستخدم «في حدود» للدلالة على التقريب الكمّي"
        - text: "«حدود — boundary; border; frontier»"
          source: "المعجم الموحد لمصطلحات القانون"
          addition: "الدلالة الأساسية هي الحدّ الجغرافي أو القانوني"

    - lemma: "نِطَاق تَقْرِيبِيّ"
      contradicts:
        - text: "«(النطاق) حزَام يشد بِهِ الْوسط... وَهُوَ وَاسع النطاق الْأُفق»"
          source: "المعجم الوسيط"
          conflict: "نطاق بمعناه الأساسي هو الحزام والمدى، والتركيب «نطاق تقريبي» وصف حرّ وليس مصطلحاً مسكوكاً"

    - lemma: "زُهَاء"
      confirm:
        - text: "«زُهاءُ الشيءِ: شخصُه ومقدارُه — ما يقرُب منه — هم قومٌ ذوو زُهاء: ذوو عدد كثير»"
          source: "المعجم الوسيط"
        - text: "«زُهَاءُ الشىءِ: قَدْرُه وحَزْرُه»"
          source: "المعجم الكبير"
        - text: "«زُهَاءُ الشَّىءِ: شَخْصُه»"
          source: "المعجم الكبير"
        - text: "«(1) زُهاء؛ تقريبًا؛ على وجه التقريب»"
          source: "المورد الحديث"
      expands:
        - text: "«زُهاء — من (ز ه و) الإشراق والإضاءة، والمقدار»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكّد أنّ المقدار من دلالات الجذر"

    - lemma: "نَحْو"
      confirm:
        - text: "«(النَّحْو) الْقَصْد... والمقدار وَالنَّوْع»"
          source: "المعجم الوسيط"
        - text: "«وعنده نحوٌ من مائة رجل»"
          source: "أساس البلاغة للزمخشري"
      expands:
        - text: "«(نَحَوَ) النُّونُ وَالْحَاءُ وَالْوَاوُ كَلِمَةٌ تَدُلُّ عَلَى قَصْدٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الدلالي هو القصد، ومنه خرج معنى المقدار التقريبي"

    - lemma: "حَوَالَيْ"
      confirm:
        - text: "«ظَرْفٌ يَعْنِي الإحاطة حول الشَّيء من جميع جَوانِبِهِ — نَحْو أو زُهاء (ما يَقْرُب من)»"
          source: "المعجم الكبير"
        - text: "«حَوَالَيْ: ظرف بمعنى: نَحْوُ أو زُهاء»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«الصواب والرتبة: كانوا حَوَالَيْ ألف شخص [فصيحة]»"
          source: "معجم الصواب اللغوي"
          addition: "ضبط الكلمة حَوَالَيْ بفتح الحاء والياء المثناة، وأكّد فصاحتها"

    - lemma: "قُرَابَة"
      contradicts:
        - text: "«القَرَابَةُ: الدُّنُوُّ فى النسب»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية هي قرابة النسب لا المقدار التقريبي"
        - text: "«القَرابة: القُرب في الرحم»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "لا أثر لمعنى التقريب الكمّي"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جِوَار"
      decision: removed
      decision_reason: "دلالة «جوار» على المقدار التقريبي غير ثابتة في المعاجم العربية الأصيلة؛ هي نقلٌ لدلالة neighborhood الإنجليزية المجازية. المعاجم العربية (الوسيط، الكبير) تحصر معناه في الجوار المكاني والعهد. لا يصحّ أن يُقال بالعربية: «في جوار المئة» بمعنى «نحو مئة»."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حُدُود"
      decision: confirmed
      decision_reason: "«في حدود» تعبير عربيّ أصيل يُستعمل للدلالة على التقريب الكمّي (في حدود مئة ألف)، والاسم «حدود» بمعناه المجازي يدلّ على النطاق والمدى الذي يقع فيه المقدار. الاستعمال شائع في اللغة المعاصرة والنصوص الإدارية والاقتصادية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على النطاق الأقصى الذي لا يتجاوزه المقدار (أقرب إلى ceiling/cap تقريبيّ)؛ يستلزم حرف الجرّ «في» غالباً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُدُود"

    - lemma: "نِطَاق تَقْرِيبِيّ"
      decision: removed
      decision_reason: "تعبير وصفيّ حرّ وليس وحدة معجمية ثابتة. يمكن استبدال «تقريبي» بـ«تقديري» أو «غير دقيق» ويبقى المعنى قائماً، ممّا يدلّ على أنّه ليس مصطلحاً مسكوكاً. لم يرد في أيّ معجم كمدخل مستقلّ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "زُهَاء"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ فصيح أصيل ثابت في المعاجم بدلالة المقدار التقريبي. المعجم الوسيط: «زُهاءُ الشيءِ: مقدارُه وما يقرُب منه». المعجم الكبير: «قَدْرُه وحَزْرُه». يُستعمل في تراكيب مثل «زُهاء ألفٍ» أي نحو ألف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ تحديداً على مقدار الشيء وتقديره الكمّي، ولا يحتاج إلى حرف جرّ — يُضاف مباشرة إلى المعدود"
      actions:
        - command: create_entry
          params: {lemma: "زُهَاء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "نَحْو"
      source: stage1
      decision: confirmed
      decision_reason: "من أكثر الألفاظ العربية شيوعاً للدلالة على المقدار التقريبي. المعجم الوسيط يذكر «المقدار» من معانيه. الزمخشري في أساس البلاغة: «وعنده نحوٌ من مائة رجل». استعمال فصيح قديم متواتر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ دلالةً من زُهاء؛ يجمع بين معنى الجهة والمقدار التقريبي، ويُستعمل مع «من» أو بالإضافة المباشرة"
      actions:
        - command: create_entry
          params: {lemma: "نَحْو", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حَوَالَيْ"
      source: stage1
      decision: confirmed
      decision_reason: "ثابت في المعجم الكبير بالنصّ: «نَحْو أو زُهاء (ما يَقْرُب من)». معجم الصواب اللغوي أكّد فصاحته. معجم اللغة العربية المعاصرة: «ظرف بمعنى: نَحْو أو زُهاء». أوسع الألفاظ تداولاً في العربية المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "ظرف يدلّ على الإحاطة والتقريب معاً؛ أكثر شيوعاً في الاستعمال المعاصر والصحفي من زُهاء ونَحْو"
      actions:
        - command: create_entry
          params: {lemma: "حَوَالَيْ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "قُرَابَة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعمال قُرابة بدلالة المقدار التقريبي. المعاجم تحصر معناها في قرابة النسب (الوسيط: «الدُّنُوُّ فى النسب»). القياس الصرفي وحده لا يكفي لإثبات اللفظ."
      evidence_assessment:
        case: contradicts_only

