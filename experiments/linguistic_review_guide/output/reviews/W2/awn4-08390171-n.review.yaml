stage1_review:
  assessment:
    concerns:
      - قد يلتبس مصطلح "تَعَرُّق" دلاليًا مع عملية إفراز العرق من الجلد (Perspiration)، لذا يجب التمييز السياقي.
      - مصطلح "نظام العروق" تعبير وصفي دقيق لكنه قد يُعتبر عبارة حرة أكثر منه وحدة معجمية مسكوكة في بعض السياقات.
    observations: |
      المصطلح الأساسي في علم النبات هو "التعرق"، وهو يعبر عن النمط الذي تتخذه العروق (الأوعية الناقلة) في نصل الورقة. 
      هناك توافق كبير بين المعاجم العلمية الحديثة (مثل المعجم الموحد للمصطلحات الجيولوجية والأحيائية) على هذا اللفظ.
  blind_candidates:
    - lemma: "تَعَرُّق"
      generation_method: ishtiqaq
      justification: "اللفظ القياسي من الجذر (عرق) ليدل على الهيئة أو النظام المتبع للعروق."
    - lemma: "تَعْرِيق"
      generation_method: ishtiqaq
      justification: "يُستخدم للدلالة على العملية أو النمط الناتج عن ترتيب العروق، وشائع في وصف الخشب والرخام وأجنحة الحشرات."
    - lemma: "نِظَامُ العُرُوقِ"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يطابق التعريف الإنجليزي (arrangement of veins) والتعريف العربي المقترح."
    - lemma: "تَوْزِيعُ العُرُوقِ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر عن كيفية توزع العروق في المساحة المخصصة (نصل الورقة)."

stage2_evidence:
  per_lemma:
    - lemma: "تَعَرُّق"
      confirm:
        - text: "توزّع العروق"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "نظام انتشار العروق في ورقة نباتية"
          source: "مسرد الجغرافيا والتاريخ، ArabTerm"
        - text: "نظام انتشار العروق في ورقة نبات أو جناح حشرة."
          source: "المورد الحديث (2008)"
    - lemma: "نِظَامُ العُرُوقِ"
      confirm:
        - text: "نظام انتشار العروق في ورقة نباتية"
          source: "مسرد الجغرافيا والتاريخ، ArabTerm (تعريف لمصطلح التعرق)"
          addition: "يؤكد أن العبارة هي التعريف الدقيق للمفهوم."
    - lemma: "تَعْرِيق"
      confirm:
        - text: "ترتيب الأعصاب أو تعريق أجنحة الحشرة"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "يستخدم للمفهوم المشابه في علم الحشرات (Neuration)."
    - lemma: "تَوْزِيعُ العُرُوقِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تعرق"
      decision: confirmed
      decision_reason: "المصطلح العربي القياسي والمستقر في علم النبات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَرُّق"
    - lemma: "نظام العروق"
      decision: confirmed
      decision_reason: "تعبير اصطلاحي مركب شائع الاستخدام في التعريفات المعجمية والكتب المتخصصة لوصف ترتيب العروق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَامُ العُرُوقِ"
    - lemma: "تَعْرِيق"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم كمرادف للتعرق في وصف الأنماط، خاصة في علم الحشرات والخشب، ويمتد استخدامه للنبات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَعْرِيق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "(علم النبات) ترتيب العروق في الورقة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه يحتاج صياغة أكثر شمولاً ومطابقة للأسلوب المعجمي العربي."
    authored:
      - type: terminological
        text: "(في علم النبات) نَسَقُ ترتيب العروق في نصل الورقة، أو نظام انتشار الأوعية الناقلة فيها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "(في علم النبات) نَسَقُ ترتيب العروق في نصل الورقة، أو نظام انتشار الأوعية الناقلة فيها."}
  examples:
    per_lemma:
      - lemma: "تَعَرُّق"
        examples:
          - text: "تعتمد تصنيفات النباتات الزهرية أحياناً على نوع تَعَرُّق الأوراق، فمنها ما هو شبكي ومنها ما هو متوازٍ."
            type: usage
      - lemma: "نِظَامُ العُرُوقِ"
        examples:
          - text: "يوفر نِظَامُ العُرُوقِ في الورقة الدعم الهيكلي اللازم للنصل بالإضافة إلى نقل الغذاء والماء."
            type: usage
      - lemma: "تَعْرِيق"
        examples:
          - text: "يُلاحظ تَعْرِيق دقيق ومتقاطع في أجنحة هذه الفصيلة من الحشرات."
            type: usage

