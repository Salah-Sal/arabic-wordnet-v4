step0_evidence:
  per_lemma:
    - lemma: "جبان"
      confirm:
        - text: "«ضد الشجاع» — المعجم الوسيط"
        - text: "«الذي يَهابُ الإقدام على ما لا ينبغي أن يُهاب» — المعجم الكبير"
        - text: "«الهيُوبُ للأشياء فلا يُقدِمُ عليها» — المعجم الكبير"
      peripheral_observations:
        - "يطلق الجبان أيضاً على صانع الجبن وبائعه، وعلى الصحراء والمقبرة."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رِعْدِيد"
      source_section: "step5_english_bridge"
      evidence_citation: "«جبان؛ رِعديد؛ مخلوع الفؤاد» — المورد الحديث (2008)"
      justification: "مصطلح فصيح يدل على الجبان الذي يرتعد من شدة الخوف."
    - lemma: "خَوَّار"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الضعيف [...] الجبان: يقال رجل خوار أي جبان» — المعجم الكبير"
      justification: "صفة مبالغة تدل على ضعف القلب والخور والجبن."
    - lemma: "هَيَّاب"
      source_section: "step5_english_bridge"
      evidence_citation: "«جَبان؛ هَيّاب» — المورد الحديث (2008)"
      justification: "صيغة مبالغة لمن يكثر منه الخوف والتهيب من الأمور."
  knowledge_candidates:
    - lemma: "مَخْلُوعُ الفُؤَادِ"
      justification: "تركيب وصفي شائع مجازياً لمن طار قلبه من الخوف (تركيب إضافي)."
  generation_notes: "المصطلحات المرشحة تتدرج في تصوير الجبن من الخور والضعف (خوار) إلى الرعشة والخوف الشديد (رعديد)."

step1_lemma_validation:
  per_lemma:
    - lemma: "جبان"
      decision: confirmed
      decision_reason: "مصطلح أصيل ومطرد ومباشر في الدلالة على المفهوم."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام والشامل الدال على افتقاد الشجاعة."
      example: "لا مكان للجبان في ساحات القتال والمواجهة."
    
    - lemma: "رِعْدِيد"
      source: step05
      decision: confirmed
      decision_reason: "كلمة فصيحة ومعبرة بدقة عن الجبان الذي يرتجف خوفاً."
      step05_citation: "«جبان؛ رِعديد» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز عن (جبان) بالتركيز على الأثر الجسدي للخوف وهو الرعشة والارتجاف."
      example: "ظل الرعديد يرتجف في مكانه عند سماع أصوات المدافع."
      actions:
        - command: create_entry
          params:
            lemma: "رعديد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09637077-n"

    - lemma: "خَوَّار"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح مستعمل للدلالة على ضعف القلب والجبن."
      step05_citation: "«رجل خوار أي جبان» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز بالتركيز على الضعف النفسي وانكسار العزيمة والهشاشة الداخلية."
      example: "كان رجلاً خواراً لا يقوى على اتخاذ قرارات حاسمة في الأزمات."
      actions:
        - command: create_entry
          params:
            lemma: "خوار"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09637077-n"

    - lemma: "هَيَّاب"
      source: step05
      decision: confirmed
      decision_reason: "صيغة مبالغة فصيحة تعبر عن شدة تهيب الأمور وتجنبها خوفاً."
      step05_citation: "«جَبان؛ هَيّاب» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يبرز شدة الحذر والتردد في الإقدام على أي أمر رهبةً منه."
      example: "الرجل الهياب يضيع على نفسه الكثير من الفرص."
      actions:
        - command: create_entry
          params:
            lemma: "هياب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09637077-n"

    - lemma: "مَخْلُوعُ الفُؤَادِ"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي مجازي قد يعتبر عبارة حرة وليس مصطلحاً مسكوكاً مستقلاً بذاته."
      step05_citation: "معرفة معجمية عامة."

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "رعديد"
      reason: "مرادف دقيق من مرشحات الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "خوار"
      reason: "مرادف دقيق من مرشحات الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "هياب"
      reason: "مرادف دقيق من مرشحات الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

step3_definition:
  definition_review_flag: true
  current_definition: "شخص يظهر الخوف أو الجبن"
  assessment:
    decision: revise
    reason: "التعريف الحالي مقبول ولكنه قصير جداً ويدور حول الجذر (الجبن)، ويمكن صياغة تعريف لغوي أدق بالاستعانة بالمعاجم."
  authored_definitions:
    - type: linguistic
      text: "شخصٌ يَهابُ الإقدامَ على ما لا يَنْبَغِي أن يُهابَ، وتَنْقُصُهُ الشَّجاعةُ وعزيمةُ القلب."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09637077-n"
        definition_index: 0
        text: "شخصٌ يَهابُ الإقدامَ على ما لا يَنْبَغِي أن يُهابَ، وتَنْقُصُهُ الشَّجاعةُ وعزيمةُ القلب."

