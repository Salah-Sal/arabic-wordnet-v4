# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10481571-n
# Moloch — a tyrannical power to be propitiated by human subservience or sacrifice
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مولوخ» معرَّبة من الإنجليزية بلا تشكيل، وهي اسم علم أسطوري أكثر من كونها مصطلحاً عاماً"
      - "المجموعة تحتوي لمّة واحدة فقط، مما يُضعف التغطية المعجمية"
      - "التعريف العربي ترجمة شبه حرفية للإنجليزي، يحتاج صياغة معجمية أصيلة"
    observations: "المفهوم يدور حول قوة طاغية تستلزم الخضوع والتضحية البشرية لاسترضائها. هذا مفهوم مجازي مستعار من اسم الإله السامي القديم «مولوخ» الذي كان يُقرَّب إليه الأطفال. في العربية، ليس لهذا المفهوم المجازي المحدد مقابل طبيعي مسكوك، وإن وُجدت ألفاظ قريبة كالطاغوت والجبروت والبعل فإنها لا تحمل الدلالة التخصيصية نفسها."
  blind_candidates:
    - lemma: "طَاغُوت"
      generation_method: ishtiqaq
      justification: "من الجذر «طغي» على وزن فَاعُوت، يدلّ على مجاوزة الحدّ في العصيان والتجبّر. ورد في القرآن بمعنى كل ما عُبد من دون الله، وكل رأس في الضلال. فيه دلالة على القوة القاهرة التي تستعبد الناس."
    - lemma: "بَعْل"
      generation_method: majaz
      justification: "اسم صنم سامي قديم ذُكر في القرآن الكريم، وأصله من المِلك والسيادة. يُمثّل إزاحة دلالية من معنى الربّ والمالك إلى القوة الوثنية المستبدة التي تطلب القرابين."
    - lemma: "وَثَن"
      generation_method: majaz
      justification: "من الجذر «وثن» بمعنى الحجارة المعبودة، وأصله القوة والثقل. إزاحة مجازية من المعبود الحجري إلى كل قوة تستعبد الناس وتتطلب التضحية."
    - lemma: "مُولُوك"
      generation_method: taarib
      justification: "تعريب مباشر للاسم Moloch بصيغة تقبل التصريف العربي على وزن فُعُول، وهي أقرب من الصيغة الحالية «مولوخ» إلى النظام الصوتي العربي."

stage2_evidence:
  per_lemma:
    - lemma: "مُولُوخ"
      confirm:
        - text: "«مولوخ: «أ» إله ساميّ كان الأطفال يُحْرَقون على مذبحه. «ب» شيء يتطلّب تضحية رهيبة the Moloch of war.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«إله ساميّ كان الأطفال يُحْرَقون على مذبحه»"
          source: "المورد الحديث (2008)"
          addition: "يُوضّح الأصل الميثولوجي للمصطلح وارتباطه بحرق الأطفال قرباناً"
    - lemma: "طَاغُوت"
      contradicts:
        - text: "«الطاغي المعتدى أو كثير الطغيان كلُّ رأس فى الضلال يصرف عن طريق الخير الشيطان الكاهنُ»"
          source: "المعجم الوسيط"
          conflict: "الطاغوت أعمّ بكثير من المفهوم المطلوب: يشمل الشيطان والكاهن والساحر وكل معبود من دون الله، ولا يختصّ بمعنى القوة التي تتطلب التضحية البشرية"
        - text: "«الساحرُ كلُّ ما عُبِدَ من دون الله , من الجنِّ والإنس والأصنام بيتُ الصَّنَمِ»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية دينية عقَدية (ما عُبد من دون الله)، لا مجازية استعارية"
      expands:
        - text: "«الطَّاءُ وَالْغَيْنُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ مُنْقَاسٌ، وَهُوَ مُجَاوَزَةُ الْحَدِّ فِي الْعِصْيَانِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على تجاوز الحدّ، مما يقرّبه من معنى الاستبداد لكنه لا يستلزم التضحية"
    - lemma: "بَعْل"
      contradicts:
        - text: "«الْبَاءُ وَالْعَيْنُ وَاللَّامُ أُصُولٌ ثَلَاثَةٌ: فَالْأَوَّلُ الصَّاحِبُ، يُقَالُ لِلزَّوْجِ بَعْلٌ، وَكَانُوا يُسَمُّونَ بَعْضَ الْأَصْنَامِ بَعْلًا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المعنى المهيمن هو الزوج والصاحب، ومعنى الصنم ثانوي تاريخي لا يحمل دلالة التضحية البشرية"
      expands:
        - text: "«وصَنَمٌ كان لقَوْمِ إلياسَ، عليه السلامُ، ومَلِكٌ من المُلوكِ، ورَبُّ الشيءِ ومالِكُهُ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يُشير إلى صنم بعينه وإلى معنى الربوبية والملك"
    - lemma: "وَثَن"
      contradicts:
        - text: "«الْوَاوُ وَالثَّاءُ وَالنُّونُ. كَلِمَةٌ وَاحِدَةٌ، هِيَ الْوَثَنُ وَاحِدُ الْأنِ: حِجَارَةٌ كَانَتْ تُعْبَدُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الوثن يدلّ على الحجر المعبود (الصنم المادي)، لا على قوة مجردة مستبدة تطلب التضحية"
    - lemma: "مُولُوك"
      evidence_status: "no_material_found"
    - lemma: "جَبَرُوت"
      contradicts:
        - text: "«القهر»"
          source: "المعجم الوسيط"
          conflict: "الجبروت صفة مجردة (القهر والعظمة)، لا كيان أو قوة بعينها تطلب التضحية"
      expands:
        - text: "«الكِبْرُ والعَظَمَةُ والجلالةُ العتُوُّ والقَهْرُ»"
          source: "المعجم الكبير"
          addition: "يُوسّع المعنى ليشمل الكبر والعظمة، لكنه يبقى مصدراً لا اسم ذات"

stage3_analysis:
  per_lemma:
    - lemma: "مُولُوخ"
      decision: confirmed
      decision_reason: "لمّة معرَّبة مثبتة في المورد الحديث بالمعنيين: الإله السامي القديم، والاستعمال المجازي لكل ما يتطلب تضحية رهيبة. هي المقابل العربي الوحيد المسكوك لهذا المفهوم. تحتاج إضافة تشكيل كامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الاسم المعرَّب للإله السامي القديم واستعماله المجازي للدلالة على قوة تتطلب تضحية بشرية رهيبة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُولُوخ"
    - lemma: "طَاغُوت"
      source: stage1
      decision: removed
      decision_reason: "الطاغوت مصطلح قرآني واسع الدلالة يشمل كل ما عُبد من دون الله والشيطان والكاهن والساحر. دلالته دينية عقَدية بالدرجة الأولى، ولا يحمل التخصيص المطلوب في القوة التي تستلزم التضحية البشرية لاسترضائها. إدراجه يُوقع في خلط دلالي مع المجموعات القرآنية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "بَعْل"
      source: stage1
      decision: removed
      decision_reason: "معناه المهيمن في العربية هو الزوج والصاحب والمالك، ومعنى الصنم السامي القديم ثانوي وخاص بسياق قرآني محدد (قوم إلياس). لا يحمل دلالة القوة المستبدة التي تتطلب تضحية بشرية، واستعماله بهذا المعنى يُوقع في لبس شديد مع المعنى الشائع."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "وَثَن"
      source: stage1
      decision: removed
      decision_reason: "الوثن يدلّ على المعبود المادي (الحجر)، وهو أعمّ من المفهوم المطلوب وأضيق في الوقت نفسه: أعمّ لأنه يشمل كل صنم، وأضيق لأنه لا يحمل البعد المجازي للقوة الاستبدادية المجردة. لا يصلح مرادفاً لمولوخ بمعناه الاستعاري."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "مُولُوك"
      source: stage1
      decision: removed
      decision_reason: "صيغة تعريب بديلة لم تُوثَّق في أي معجم عربي. الصيغة المثبتة في المورد الحديث هي «مولوخ» بالخاء، وهي المتداولة في المراجع العربية. لا مسوّغ لإضافة صيغة غير مسكوكة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

