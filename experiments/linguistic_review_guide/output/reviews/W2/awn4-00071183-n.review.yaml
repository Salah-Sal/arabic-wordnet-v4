stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي مقتضب جداً ويعتمد على كلمة 'انحراف' التي قد تُعد لمةً في حد ذاتها."
    observations: "المفهوم يعبر عن الخروج عن السمت العمودي أو الشاقولي، وهو مفهوم فيزيائي وهندسي وأيضاً يصف الهيئات الجسدية. اللمات المختارة (ميل، انحناء) تغطي الجانب الوصفي، ولكن ينقصها التنوع لتمثيل 'الفعل' أو 'العملية' بدقة أكبر."
  blind_candidates:
    - lemma: "مَيْل"
      generation_method: ishtiqaq
      justification: "المصدر الأصلي للفعل (مال)، وهو التعبير العربي الأدق عن العدول عن الاستقامة."
    - lemma: "اِنْحِنَاء"
      generation_method: ishtiqaq
      justification: "يدل على التعطف والاعوجاج، ويُستخدم لوصف الميل الجسدي أو ميل الأجسام المرنة."
    - lemma: "جُنُوح"
      generation_method: majaz
      justification: "من (جنح) بمعنى مال، ويُستخدم كثيراً في السياقات التقنية (طيران، بحار) والمجازية."
    - lemma: "تَمَايُل"
      generation_method: ishtiqaq
      justification: "صيغة (تفاعل) تدل على هيئة الميل أو تكراره، وتناسب الحركة التي تؤدي للميل."

stage2_evidence:
  per_lemma:
    - lemma: "مَيْل"
      confirm:
        - text: "«المَيْلُ: العدول عن الوسَط إلى أَحَد الجانبين»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«مال الحائِطُ: زال عن استوائه، انحرف، انعطف، وعدل عمّا كان عليه»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "اِنْحِنَاء"
      confirm:
        - text: "«الانحناء: كون الخط بحيث لا تنطبق أجزاؤه المفروضة على جميع الأوضاع كالأجزاء المفروضة للقوس»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«وانحنى الشيء ينحني انحناءً»"
          source: "مقاييس اللغة لابن فارس"
    - lemma: "مَيَلَان"
      confirm:
        - text: "«مال الشيء... مَيَلاناً: انحرف ومال»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«المَيَلُ، مُحرَّكَةً: مَا كانَ خِلْقَةً... وَقَد مَيِلَ كفَرِحَ»"
          source: "تاج العروس"
    - lemma: "اِنْحِرَاف"
      confirm:
        - text: "«انحرف عنه ينحرف انحرافاً... أي عدلت به عنه»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«زاوية الانحراف: انحراف الشاقول عن الناظم على السطح»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
    - lemma: "جُنُوح"
      confirm:
        - text: "«الْجِيمُ وَالنُّونُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْمَيْلِ وَالْعُدْوَانِ. وَيُقَالُ جَنَحَ إِلَى كَذَا، أَيْ مَالَ إِلَيْهِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«جنوح: [في علوم البحار]»"
          source: "المعجم الموحد لمصطلحات علوم البحار"
          addition: "يستخدم غالباً في سياقات متخصصة جداً كجنوح السفن."

stage3_analysis:
  per_lemma:
    - lemma: "ميل"
      decision: confirmed
      decision_reason: "مصدر أصيل يعبر عن جوهر المفهوم (العدول عن الاستقامة) ومثبت في المعاجم القديمة والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَيْل"
    - lemma: "انحناء"
      decision: confirmed
      decision_reason: "شائع الاستخدام لوصف الميل الفيزيائي والجسدي، ويؤكد الأدلة على دلالته على التعطف والاعوجاج."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْحِنَاء"
    - lemma: "مَيَلَان"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر يدل على الحالة أو الفعل المستمر (على وزن فَعَلان)، وهو مطابق تماماً للمفهوم الإنجليزي (leaning) كعملية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مَيَلَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00071183-n"
    - lemma: "اِنْحِرَاف"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق جداً في السياقات الهندسية والعلمية للتعبير عن الحياد عن الخط المستقيم أو الوضع العمودي (الشاقولي)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "اِنْحِرَاف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00071183-n"

stage4_content:
  definition:
    current: "فعل الانحراف عن الوضع العمودي"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعتمد على إحدى اللمات (انحراف) وهو مقتضب جداً."
    authored:
      - type: terminological
        text: "عُدولُ الجسمِ أو الخطِّ عن استقامتهِ أو عن وضعهِ العمودِيّ الشاقوليّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "مَيْل"
        examples:
          - text: "قاسَ المهندسُ مَيْلَ الجدارِ للتأكّدِ من سلامتِه الإنشائيةِ."
            type: usage
      - lemma: "اِنْحِنَاء"
        examples:
          - text: "يظهرُ اِنْحِنَاءٌ بسيطٌ في الساريةِ نتيجةَ ضغطِ الرياحِ القويةِ."
            type: usage
      - lemma: "مَيَلَان"
        examples:
          - text: "تَمَّ ترميمُ المئذنةِ بعدَ رصدِ مَيَلَانٍ ملحوظٍ في هيكلها."
            type: usage
      - lemma: "اِنْحِرَاف"
        examples:
          - text: "حَدثَ اِنْحِرَافٌ في مسارِ الشاقولِ عن مِحورهِ الطبيعيِّ."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-00071183-n"
          definition_index: 0
          text: "عُدولُ الجسمِ أو الخطِّ عن استقامتهِ أو عن وضعهِ العمودِيّ الشاقوليّ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "قاسَ المهندسُ مَيْلَ الجدارِ للتأكّدِ من سلامتِه الإنشائيةِ."

