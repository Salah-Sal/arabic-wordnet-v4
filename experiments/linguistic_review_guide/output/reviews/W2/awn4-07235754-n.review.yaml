    - lemma: "أُحْدُوثَة"
      source: stage1
      decision: removed
      decision_reason: >
        الأُحدوثة في المعاجم مُخصَّصة للحديث المضحك أو الخرافة أو «ما لا فائدة فيه» (المعجم الكبير)،
        وتحمل في الاستعمال الاصطلاحي دلالة سلبية («صار فلانٌ أُحدوثة» = صار موضع تندُّر).
        هي أضيق دلالةً وأقل منزلةً من narrative، ولا تصلح لتمثيل القصة الأدبية أو الإعلامية
        الجادة.

    - lemma: "مَرْوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر لـ«مَرْوِيَّة» على شواهد في قاعدة البيانات المعجمية. وبينما يُولِّدها القياس
        الصرفي من «روى»، فإن الاستعمال الفعلي غير مؤكَّد، وإدراجها في المجموعة يتطلب
        شاهداً معجمياً موثَّقاً. المجموعة ممثَّلة بما يكفي باللمّات القائمة.

    - lemma: "أُقْصُوصَة"
      source: stage1
      decision: removed
      decision_reason: >
        الأُقصوصة مُعرَّفة تعريفاً دقيقاً على أنها «القصة القصيرة (short story)» وهي نوع
        أدبي محدد أضيق من دلالة المجموعة. إدراجها سيُضيّق المجموعة دون مسوّغ، إذ تمثّل
        تخصيصاً لقِصَّة لا مرادفاً لها.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "رسالة تسرد تفاصيل فعل أو حدث أو مسار أحداث؛ تقدم كتابةً أو درامياً أو سينمائياً أو كبرنامج إذاعي أو تلفزيوني"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي؛ لفظة «رسالة» ترجمة لـ message وليست
        الطريقة العربية المعهودة في تعريف مثل هذه المفاهيم. كذلك الجزء الثاني (يُقدَّم
        كتابةً أو درامياً...) يصلح للتعريف الموسوعي لا الاصطلاحي. يُستحسن تعريف
        اصطلاحي بجنس قريب وفصل نوعي، ثم تعريف موسوعي يستوعب الأشكال.
    authored:
      - type: terminological
        text: >
          نصٌّ أو خطابٌ يَعرض تفاصيلَ فعلٍ أو واقعةٍ أو مسار أحداث
          بصورة متسلسلة؛ تمييزاً له عن الخطاب الحجاجي أو الوصفي المجرد.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          ضربٌ من ضروب الخطاب يُروى فيه تتابُعُ أحداثٍ حقيقية أو متخيَّلة؛
          ويَتَّخذ أشكالاً شتى: الحكاية المكتوبة، والتمثيل المسرحي، والعمل السينمائي،
          والبرامج الإذاعية والتلفزيونية.
