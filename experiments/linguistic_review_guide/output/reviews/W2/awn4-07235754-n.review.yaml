# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-07235754-n  |  ili: i74608  |  pos: n
# narrative / narration / story / tale
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "رِوَايَة في الاستعمال العربي المعاصر تحمل بالدرجة الأولى معنى «القصة النثرية الطويلة = novel»، وهو أضيق من دلالة المجموعة التي تشمل narration وstory وtale؛ مما قد يُوهم أن المجموعة مخصصة للروايات الأدبية الطويلة فحسب."
      - "سَرْد مصدر فعلي يدل على عملية السرد (the act of narrating) لا على المنتج السردي (the narrative)؛ وقد يكون أقل دقة في تمثيل مفهوم «الرسالة التي تسرد أحداثاً» بوصفه منتجاً لا فعلاً."
      - "التعريف الحالي يبدأ بـ«رسالة» وهو ترجمة حرفية للفظة message الإنجليزية، وليس من أسلوب المعجم الوسيط في التعريف؛ ويُستحسن استبداله بما هو أكثر انسجاماً مع التقاليد المعجمية العربية."
      - "التعريف يخلط بين مفهوم الرسالة (المحتوى) وطريقة تقديمها (كتابةً أو درامياً...)؛ الجمع ممكن لكنه يحتاج صياغة أدق."
    observations: >
      المجموعة تضمّ أربع لمّات من مستويات دلالية متعددة: حِكَايَة وقِصَّة تدلان على المنتج السردي
      (ما يُحكى/ما يُقصّ)، ورِوَايَة تدل في المعاصرة على نوع أدبي محدد (القصة الطويلة)،
      وسَرْد يدل على أسلوب العرض المتسلسل. المجموعة في الأصل تمثّل مفهوماً فوق-أدبياً
      (narrative بمعناه العام) يشمل أي خطاب يعرض أحداثاً، وهو مفهوم تغطيه العربية
      بثروة واضحة. التحدي هو توثيق الفوارق الدقيقة بين اللمّات الأربع.

  blind_candidates:
    - lemma: "سَرْدِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «سرد» مع المصدر الصناعي (-ية)؛ يُولِّد مصطلحاً اسمياً يدل على الخطاب
        السردي ذاته. الوزن الصناعي (-ية) منتج جداً في تحويل الأفعال والجذور إلى مفاهيم
        مجردة كالديمقراطية والعلمانية. السردية = الشيء الذي ينطوي على سرد = narrative.
    - lemma: "أُحْدُوثَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «حدث» على وزن أُفْعُولَة؛ وهو وزن يدل على ما يُتداول ويتكرر.
        الحدث = ما وقع للتو، والأُحدوثة = ما يُحدَّث به عن حدث ما. الصيغة مشتقة
        اشتقاقاً قياسياً وتندرج في نمط أُفعولة الدال على المتداول (كالأُغنية والأُعجوبة).
    - lemma: "مَرْوِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «روي» بصيغة اسم المفعول الاسمي المنسوب (مَفْعُول + ية)؛ تدل على
        «ما يُروى» أي الرواية/الخبر المنقول. مناسبة لمفهوم narration بوصفه خطاباً
        منقولاً عن أحداث. الوزن قياسي على غرار: مَرْوِيّ (ما رُوي) → مَرْوِيَّة (الخاصية
        أو الشيء الذي يُروى).
    - lemma: "أُقْصُوصَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «قصص» على وزن أُفْعُولَة؛ قياساً على أُغنية وأُحدوثة. وزن يدل على
        القصة التي تُتداول وتُقصّ. قد تكون أقل اتساعاً من «قصة» نفسها لكنها تغطي
        مفهوم tale/short narrative بشكل صريح.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "حِكَايَة"
      confirm:
        - text: "«ما يُحكى ويُقصّ, وقع أو تخيل اللهجة (تقول العرب: هذه حكايتنا)»"
          source: "المعجم الوسيط"
        - text: "«ما يُحْكَى ويُقصُّ, وَقَعَ أو تُخُيِّلَ»"
          source: "المعجم الكبير"
        - text: "«(الْحِكَايَة) مَا يحْكى ويقص وَقع أَو تخيل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (مجمع اللغة العربية بالقاهرة)"
      expands:
        - text: "«الحكاية: استعمال الكلمة بنقلها من محلها الأول إلى الآخر. وحكيت الشيء حكاية أتيت بمثله»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت١٦٢٢م)"
          addition: "الحكاية في الأصل تعني المحاكاة (إتيان المثيل)؛ وهي مناسبة للسرد الدرامي والقصصي معاً."
        - text: "«الحكاية:[في الانكليزية] NArrative ،tale ،narration»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت١٧٧٧م)"
          addition: "التهانوي يترجم الحكاية صراحةً بـ narrative وtale وnarration، مما يؤكد تطابقها مع دلالة المجموعة."

    - lemma: "رِوَايَة"
      confirm:
        - text: "«الرِّوَايَة: الإخبار عن عام لا ترافع فيه إلى الحكام»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت١٦٢٢م)"
        - text: "«(فى الأدب) novel: فنٌّ من فنون النثر الأدبىّ قائم على الحكاية, ينتظم سلسلةً من الأحداث الحقيقية أو المتخيِّلة... (عند المحدِّثين): عِلْمٌ يشتمل على نقل ما نُسب إلى النبى - صلى الله عليه وسلم - من قولٍ أو فعلٍ أو تقريرٍ...»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«(الرِّوَايَة) الْقِصَّة الطَّوِيلَة (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (مجمع اللغة العربية)"
          conflict: "المعنى المحدَث لـ«رواية» هو القصة الطويلة (novel) تحديداً؛ وهو أضيق من دلالة المجموعة التي تشمل أي سرد أحداث. كذلك يُوجد للكلمة معنى تقني في علم القراءات والحديث."
        - text: "«(الرِّوَايَة) بالكسر في عرف الفقهاء: ما ينقل من المسألة الفرعية عن الفقهاء»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "المعنى الفقهي/الحديثي يبتعد عن دلالة القصة/الحكاية."
      expands:
        - text: "«الرّواية:[في الانكليزية] Narration ،relation ،communication... لغة النقل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت١٧٧٧م)"
          addition: "رواية في أصلها تعني النقل والتحمّل، وهو ما يجعلها تناسب narration بمعنى نقل الأحداث."

    - lemma: "سَرْد"
      confirm:
        - text: "«السرد: الإتيان بالحديث على الولاء»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت١٦٢٢م)"
        - text: "«سَرْد، رواية: استيعاب المعلومات وروايتها»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      contradicts:
        - text: "«السَّرْدُ... اسمٌ جامعٌ للدروع وسائر الحلق (تسمية بالمصدر) شيءٌ سَرْدٌ: متتابع»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي لـ«سرد» هو نسج الدروع والتتابع، والمعنى المجازي هو أسلوب الإتيان بالكلام. سرد يدل على عملية (act of narrating) لا على المنتج (a narrative)."
        - text: "«السَّرْدُ: الخَرْزُ في الأَديمِ... وجَوْدَةُ سِياقِ الحَديثِ... ومُتابَعَةُ الصَّوْمِ»"
          source: "القاموس المحيط للفيروزآبادي (ت١٤١٤م)"
          conflict: "دلالة السرد الأصيلة تتعلق بالتتابع والنظم لا بالحكاية القصصية."
      expands:
        - text: "«فِعْل الحكاية، سَرْد: فعل يستعمل أسلوبا بقيمة دلالية معينة في سرد الحكايات أو رواية القصص»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "الاستعمال الاصطلاحي الحديث يربط «سرد» بمجال الحكايات والقصص."

    - lemma: "قِصَّة"
      confirm:
        - text: "«(الْقِصَّة) الَّتِي تكْتب والْجُمْلَة من الْكَلَام والْحَدِيث وَالْأَمر وَالْخَبَر والشأن وحكاية نثرية طَوِيلَة تستمد من الخيال أَو الْوَاقِع أَو مِنْهُمَا مَعًا وتبنى على قَوَاعِد مُعينَة من الْفَنّ الْكِتَابِيّ (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (مجمع اللغة العربية)"

    # ── مرشحات المرحلة ١ ──

    - lemma: "سَرْدِيَّة"
      contradicts:
        - text: "«(علم السَّرد) Narratology: أحد فروع الدراسة الأدبية التى تختص بتحليل أشكال السَّرْد وتنوعات الرواة»"
          source: "المعجم الكبير"
          conflict: >
            السردية في المعاجم الحديثة تعني «علم السرد = Narratology»، وهو حقل دراسي لتحليل الأشكال
            السردية، لا تعني «narrative» بمعنى نص/خطاب سردي منفرد. دلالتها مختلفة تماماً عن المطلوب.
      expands:
        - text: "«سَرْديّ: طريقة فعلية لرواية قصة أو خرافة، تبحث عن مدى تعبير الآثار الأدبية عن الشكل الأجوف العام»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "سردي نعت وليس اسماً، مما يؤكد أن سردية تنصرف إلى المفهوم المجرد أو الحقل المعرفي."

    - lemma: "أُحْدُوثَة"
      contradicts:
        - text: "«ما يُتَحدَّثُ به ممَّا لا فائدة فيه, ولا صِحَّةَ له, كأخبار الغَزَل ونحوها خصَّها الفَرَّاءُ بأنَّها تكون للمُضحكاتِ والخُرافاتِ بخلافِ الحَدِيثِ»"
          source: "المعجم الكبير"
          conflict: "الأُحدوثة مُخصَّصة في المعاجم للحديث المضحك أو الخرافة أو ما لا فائدة فيه؛ وهذا أضيق وأقل منزلةً من narrative/story بمعناهما الأدبي أو التوثيقي."
        - text: "«(الأحدوثة) مَا يتحدث بِهِ وَيُقَال صَار فلَان أحدوثة كثر فِيهِ الحَدِيث والْحَدِيث المضحك أَو الخرافة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الجملة الاصطلاحية «صار فلان أُحدوثة» تدل على مدح أو ذمّ للإنسان لا على قصة أدبية."
      confirm:
        - text: "«ما يُتحدَّث به الحديث المضحك أو الخرافة»"
          source: "المعجم الوسيط"

    - lemma: "مَرْوِيَّة"
      evidence_status: "no_material_found"

    - lemma: "أُقْصُوصَة"
      contradicts:
        - text: "«(الأقصوصة) الْقِصَّة القصيرة (ج) أقاصيص (مو)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الأقصوصة مُخصَّصة للقصة القصيرة (short story)، وهو نوع أدبي محدد أضيق من المجموعة."
        - text: "«أُقْصُوصَة... الرأي: مرفوضة... السبب: لعدم ورودها في المعاجم القديمة... التعليق: أقر مجمع اللغة المصري كلمة «أُقصوصة» وأوصى بإضافتها إلى المعاجم الحديثة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت٢٠٠٣م)"
          conflict: "حتى مع الإقرار المجمعي، الكلمة محدّدة بالقصة القصيرة."
      expands:
        - text: "«سرد كتابي أو شفهيّ، يدور حول أحداث محددة، لممارسة فنية، تتحدد في الفضاء والزمن والمكان»"
          source: "المعجم الموحد لمصطلحات اللسانيات 2002 (ترجمة: novelette)"
          addition: "التعريف اللساني للأقصوصة يوسّعها قليلاً لكن بالإشارة إلى novelette لا narrative العام."


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
