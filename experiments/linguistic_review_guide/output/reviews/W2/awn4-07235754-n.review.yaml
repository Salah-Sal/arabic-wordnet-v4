        مع دلالة المجموعة (رسالة تعرض تفاصيل فعل أو أحداث). التهانوي يترجمها صراحةً
        بـ narrative وtale وnarration. فصيحة ثابتة ومستعملة في النثر العربي الكلاسيكي
