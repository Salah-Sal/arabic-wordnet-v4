      maqayis_quote: "«الزَّاءُ وَالْبَاءُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَوَلُّدِ شَيْءٍ عَنْ شَيْءٍ. مِنْ ذَلِكَ زَبَدُ الْمَاءِ وَغَيْرُهُ.»"
