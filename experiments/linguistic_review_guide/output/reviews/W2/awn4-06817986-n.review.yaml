      decision: confirmed
      decision_reason: "اللمّة موثقة في المعاجم الحديثة وتُعبّر تعبيراً صحيحاً عن المفهوم. وإن كانت عامة، فهي الوحيدة الموثقة دون سواها، وتُقبل مع ضبطها بالتشكيل. صيغة الجمع «الطبول» شائعة ومستساغة في التعبير العربي عن هذا الفعل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "اللمّة الوحيدة في المجموعة، تُعبّر عن قرع الطبول بوصفه فعلاً صوتياً؛ والخصوصية الدلالية (كونه إشارةً لإنزال العلم عند الغروب) تُستوفى من التعريف لا من اللمّة."
