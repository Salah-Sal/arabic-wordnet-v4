    - lemma: "نَوْبَةُ الغُرُوب"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استخدام «نوبة الغروب» كمصطلح ثابت بهذا المعنى. «نوبة» في المعاجم الحديثة تُستخدم للنوبة المرضية أو نوبة العمل، ولا يُوثَّق استخدامها العسكري الموسيقي بهذا المركب تحديداً."

    - lemma: "دَقُّ الغُرُوب"
      source: stage1
      decision: removed
      decision_reason: "الفعل «دق» بمعنى قرع الطبل موثق، لكن «دق الغروب» كمركب اصطلاحي ثابت غير موثق في المعاجم المتاحة. لم يجتز اختبار التثبيت المعجمي."

    - lemma: "التَّطْبِيلُ الْمَسَائِيّ"
      source: stage1
      decision: removed
      decision_reason: "الاشتقاق من «طبّل» صحيح لغوياً، لكن «التطبيل المسائي» كمصطلح مركب لم يُعثر له على توثيق معجمي. لا يجتاز اختبار السكّ الاصطلاحي."

    - lemma: "إِيذَانُ الغُرُوب"
      source: stage1
