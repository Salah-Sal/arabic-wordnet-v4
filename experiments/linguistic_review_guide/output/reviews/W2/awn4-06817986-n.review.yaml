stage1_review:
  assessment:
    concerns:
      - "اللمّة «قرع الطبول» جاءت بصيغة الجمع (الطبول) بينما التعريف يستخدم المفرد «الطبل»، وهو الأدق لغوياً إذ المراد طبلٌ بعينه لا طبولٌ متعددة."
      - "اللمّة الحالية وصفٌ عام لقرع الطبول في أي سياق، وتفتقر إلى الخصوصية الدلالية التي تُميّز هذه الطقسة العسكرية المسائية المرتبطة بإنزال العلم."
      - "التعريف العربي الحالي فيه نقل حرفي من الإنجليزية دون صياغة معجمية متكاملة."
      - "اللمّة لا تحمل تشكيلاً."
    observations: "المجموعة تُمثّل طقسةً عسكريةً مسائيةً متخصصة تُؤدَّى بضرب الطبل إيذاناً بإنزال العلم عند الغروب. المفهوم عسكري أصيل عُرف في التراث الإسلامي من خلال «النوبة» (الطقسة الموسيقية العسكرية)، غير أن الشكل الحديث المحدد بإنزال العلم طابعه غربي أكثر. اللمّة «قرع الطبول» مستخدمة ومستساغة لكنها تحتاج إلى ضبط وتشكيل."

  blind_candidates:
    - lemma: "نَوْبَةُ الغُرُوب"
      generation_method: tarkib
      justification: "مركب إضافي من «نَوْبَة» (الطقسة/الدور العسكري) و«الغُرُوب» (وقت الأداء). «النَّوبة» مصطلح تاريخي عريق في السياقات العسكرية العربية الإسلامية للدلالة على الموسيقى العسكرية المجدولة."

    - lemma: "دَقُّ الغُرُوب"
      generation_method: tarkib
      justification: "مركب إضافي من «دَقّ» (قرع/ضرب الطبل — موثق في المعجمية بمعنى قرع الطبل) و«الغُرُوب» لتحديد التوقيت. يُضيق الدلالة على الطقسة المسائية تحديداً."

    - lemma: "التَّطْبِيلُ الْمَسَائِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من المصدر «التَّطْبِيل» (اشتقاق من طبّل: ضرب الطبل) موصوفاً بـ«المَسَائِيّ» لتخصيص وقت الأداء عند الغروب."

    - lemma: "إِيذَانُ الغُرُوب"
      generation_method: tarkib
      justification: "مركب إضافي من «إِيذَان» (إعلام وإشارة — على وزن إفعال من أَذَنَ) و«الغُرُوب»، يُبرز الوظيفة الإعلامية الإشارية للطقسة."


