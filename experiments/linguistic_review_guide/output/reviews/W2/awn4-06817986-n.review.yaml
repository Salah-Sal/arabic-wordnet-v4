          source: "المورد الحديث (2008)"
          addition: "كلمة tattoo الإنجليزية تحمل أحد معانيها الدقيق الطقسة العسكرية المسائية، وقد قابلها المورد بـ«دَقّة العودة»."
        - text: "«نَفْخ البُوق؛ قَرْع الطَّبل [في الجنائز العسكرية أو إيذانًا بضرورة إطفاء الأضواء ليلًا].» — مقابل taps"
          source: "المورد الحديث (2008)"
          addition: "يُظهر أن «قرع الطبل» يُستخدم في سياقات عسكرية متعددة مشابهة، منها نهاية اليوم العسكري."

