# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-07964769-n
# homebound — people who are confined to their homes
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «قعيدون» جمع مذكر سالم من «قعيد»، لكن «القعيد» في المعاجم الكلاسيكية بمعنى المُجالِس والحافظ لا بمعنى الملازم للبيت"
      - "اللمّة «ملازمون للمنزل» عبارة وصفية حرة (اسم فاعل + جار ومجرور) لا مصطلح معجمي ثابت — تخفق في اختبار السكّ"
      - "المجموعة تفتقر إلى مصطلح مفرد مسكوك يدلّ على مفهوم الملازمة للبيت بسبب مرض أو عجز"
    observations: "المفهوم المستهدف هو الأشخاص المُلزَمون بالبقاء في منازلهم لأسباب صحية أو جسدية. في العربية الكلاسيكية لا يوجد مصطلح مفرد شائع لهذا المفهوم تحديداً، لكن الجذر «قعد» يحمل دلالة القعود والملازمة، والجذر «حبس» يحمل دلالة الحبس والتقييد. المفهوم حديث نسبياً مرتبط بالسياق الطبي والاجتماعي."
  blind_candidates:
    - lemma: "حَبِيسُون"
      generation_method: ishtiqaq
      justification: "من الجذر «حبس» على وزن فَعِيل بمعنى مفعول (المحبوس). يدلّ على من حُبس وقُيّد عن الحركة، فيصلح مجازاً لمن لزم بيته قسراً"
    - lemma: "نُزَلَاءُ الدَّارِ"
      generation_method: tarkib
      justification: "مركب إضافي من «نُزَلاء» (جمع نَزيل بمعنى المقيم) و«الدار». يدلّ على المقيمين في الدار إقامة دائمة، وهو تعبير طبيعي في السياق الطبي"
    - lemma: "مُقْعَدُون"
      generation_method: ishtiqaq
      justification: "اسم مفعول من «أقعد» (أقعده المرض: ألزمه القعود). يدلّ على من أقعده عجز أو مرض عن الحركة والخروج"
    - lemma: "بَيْتِيُّون"
      generation_method: ishtiqaq
      justification: "مصدر صناعي منسوب إلى «بيت» على وزن فَعْلِيّ. يدلّ على من لا يبرح بيته، نسبةً إلى البيت"

stage2_evidence:
  per_lemma:
    - lemma: "قَعِيدُون"
      confirm:
        - text: "«القَعيد: شخصٌ يلازم بيتَهُ أو مَصحّةً من المَصحّات لمرضٍ أو عجز»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(القعيد) الْمجَالِس والحافظ (للْوَاحِد وَالْجمع والمذكر والمؤنث) وَفِي التَّنْزِيل الْعَزِيز {عَن الْيَمين وَعَن الشمَال قعيد}»"
          source: "المعجم الوسيط (هوراماني)"
          addition: "الدلالة الأصلية مُجالِس/حافظ، والدلالة الطبية الحديثة (ملازم البيت) توسيع دلالي"
        - text: "«القَافُ وَالْعَيْنُ وَالدَّالُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ لَا يُخْلَفُ، وَهُوَ يُضَاهِي الْجُلُوسَ... وَالْقَعَدُ: الْقَوْمُ لَا دِيوَانَ لَهُمْ، فَكَأَنَّهُمْ أُقْعِدُوا عَنِ الْغَزْوِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على القعود، و«القَعَد» اسم جمع لمن أُقعدوا عن الغزو — سابقة تراثية لاستعمال المادة في معنى الملازمة قسراً"

    - lemma: "مُلَازِمُون لِلْمَنْزِلِ"
      evidence_status: "no_material_found"

    - lemma: "حَبِيسُون"
      contradicts:
        - text: "«(الحبيس) المَحْبُوسُ... كُلُّ شَيءٍ وَقَفَه صاحِبُه وَقْفًا لا يُباعُ ولا يُوهَبُ ولا يُورَثُ»"
          source: "المعجم الكبير"
          conflict: "الدلالة الأصلية للحبيس هي الوقف الشرعي والمحبوس قسراً (سجين)، لا ملازمة البيت لمرض"
      expands:
        - text: "«الْحَاءُ وَالْبَاءُ وَالسِّينُ. يُقَالُ حَبَسْتُهُ حَبْسًا. وَالْحَبْسُ: مَا وُقِفَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي هو المنع والحبس، وهو أقوى دلالياً من مجرد الملازمة"

    - lemma: "نُزَلَاءُ الدَّارِ"
      confirm:
        - text: "«نَزيلُ الدَّار»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«النُّونُ وَالزَّاءُ وَاللَّامُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى هُبُوطِ شَيْءٍ وَوُقُوعِهِ... وَالنَّزِيلُ: الضَّيْفُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "النزيل في الأصل الضيف المقيم، ثم توسّع ليشمل كل مقيم في مكان"

    - lemma: "مُقْعَدُون"
      contradicts:
        - text: "«وَالْإِقْعَادُ وَالْقُعَادُ: دَاءٌ يَأْخُذُ الْإِبِلَ فِي أَوْرَاكِهَا فَيُمِيلُهَا إِلَى الْأَرْضِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المُقعَد في الاستعمال الشائع يدلّ على المشلول أو العاجز عن المشي (إعاقة حركية)، وهو أخص من مفهوم الملازمة للبيت"

    - lemma: "بَيْتِيُّون"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "قَعِيدُون"
      decision: confirmed
      decision_reason: "المورد الحديث يعرّف «القعيد» صراحةً بأنه الشخص الذي يلازم بيته لمرض أو عجز، وهو المعنى المطلوب تحديداً. الوزن فَعِيل مناسب للصفات الدالة على الثبوت. الجذر «قعد» له سابقة تراثية في هذا الاستعمال (القَعَد: من أُقعدوا عن الغزو)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على ملازمة البيت بسبب مرض أو عجز، مع إيحاء بالقعود والسكون — مصطلح طبي اجتماعي حديث مبني على أصل تراثي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَعِيدُون"

    - lemma: "مُلَازِمُون لِلْمَنْزِلِ"
      decision: removed
      decision_reason: "عبارة وصفية حرة مكوّنة من اسم فاعل + جار ومجرور، تخفق في اختبار السكّ المعجمي: يمكن إبدال «المنزل» بـ«البيت» أو «الدار» دون تغيّر المعنى. لا توجد أدلة معجمية على تثبيتها كوحدة اصطلاحية"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "نَزِيلُ الدَّارِ"
      source: stage1
      decision: confirmed
      decision_reason: "المعجم الطبي الموحد (2009) يثبت «نزيل الدار» ترجمةً لـ homebound/housebound. مركب إضافي ثابت مسجّل في معجم متخصص، يناسب السياق الطبي والاجتماعي"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على الإقامة الدائمة في الدار كمكان، بنبرة أقل حِدّة من «قعيد» — أقرب إلى الوصف الاجتماعي منه إلى الوصف الطبي"
      actions:
        - command: create_entry
          params: {lemma: "نَزِيلُ الدَّارِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حَبِيسُون"
      source: stage1
      decision: removed
      decision_reason: "الحبيس في المعاجم بمعنى المحبوس والوقف الشرعي، ويحمل دلالة القسر والسجن الشديدة. مفهوم المجموعة (ملازمة البيت لمرض) أخفّ من الحبس"

    - lemma: "مُقْعَدُون"
      source: stage1
      decision: removed
      decision_reason: "المُقعَد في الاستعمال الشائع يدلّ على المشلول العاجز عن الحركة (إعاقة حركية)، وهو أخص من مفهوم «الملازم للبيت» الذي يشمل أسباباً متعددة غير الشلل"

    - lemma: "بَيْتِيُّون"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على استعمال «بيتيّ» بمعنى ملازم البيت قسراً. النسبة إلى البيت قد تدلّ على ما يتعلق بالبيت (أعمال بيتية) لا على ساكنه"

stage4_content:
  definition:
    current: "الناس المقيدون بالبقاء في منازلهم"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستعمل «المقيّدون» وهي ترجمة حرفية لـ confined. ينبغي تحسينه ليوضح أن التقييد بسبب مرض أو عجز أو شيخوخة، وأن يُصاغ بأسلوب معجمي عربي"
    authored:
      - type: terminological
        text: "جماعةٌ من الناس يَلزَمون بيوتَهم لمرضٍ أو عجزٍ أو شيخوخةٍ تمنعهم من الخروج والتنقّل"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَن لا يبرحون دُورَهم لعلّةٍ تُقعِدهم عن السعي والحركة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "جماعةٌ من الناس يَلزَمون بيوتَهم لمرضٍ أو عجزٍ أو شيخوخةٍ تمنعهم من الخروج والتنقّل"

  examples:
    per_lemma:
      - lemma: "قَعِيدُون"
        examples:
          - text: "خصّصت البلدية خدمة توصيل الأدوية للقَعِيدين الذين لا يستطيعون مغادرة منازلهم."
            type: usage
      - lemma: "نَزِيلُ الدَّارِ"
        examples:
          - text: "يحتاج نُزَلَاءُ الدَّارِ من كبار السنّ إلى رعاية صحية منتظمة تصلهم في أماكن إقامتهم."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "خصّصت البلدية خدمة توصيل الأدوية للقَعِيدين الذين لا يستطيعون مغادرة منازلهم."
      - command: add_sense_example
