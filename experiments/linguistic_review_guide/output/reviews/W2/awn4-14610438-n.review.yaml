stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان صحيحتان تماماً، ولكن يمكن إضافة مصطلحات تربوية (بيداغوجية) شائعة في مناهج العلوم العربية."
    observations: "المجموعة تغطي المفهوم الكيميائي لـ 'mixture'. المصطلحات العربية (خليط، مزيج) مستقرة تقنياً."
  blind_candidates:
    - lemma: "خَلِيط"
      generation_method: ishtiqaq
      justification: "الاسم القياسي للمادة التي تنتج عن عملية الخلط، وهو الأكثر شيوعاً في السياقات التقنية."
    - lemma: "مَزِيج"
      generation_method: ishtiqaq
      justification: "يستخدم بكثرة في الكيمياء العضوية وغير العضوية للدلالة على المواد المختلطة."
    - lemma: "مَخْلُوط"
      generation_method: ishtiqaq
      justification: "المصطلح المعتمد في معظم المناهج الدراسية العربية لتمييز الخليط الفيزيائي عن المركب الكيميائي."
    - lemma: "خِلْط"
      generation_method: ishtiqaq
      justification: "مصطلح كلاسيكي (طبي ومعجمي) يطلق على كل ما يداخل الشيء من مواد أخرى، خاصة في تركيب الأدوية."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيط"
      confirm:
        - text: "«ما اختلَط من صنفين أو أصناف»"
          source: "المعجم الوسيط"
        - text: "«mixture»"
          source: "المعجم الطبي الموحد"
    - lemma: "مَزِيج"
      confirm:
        - text: "«mixture»"
          source: "المعجم الطبي الموحد"
        - text: "«مزيج من عصير الفواكه: ممزوج منه»"
          source: "معجم الصواب اللغوي"
    - lemma: "مَخْلُوط"
      confirm:
        - text: "«مخلوط بوردو: مخلوط يحتوي على مركبات النحاس»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
        - text: "«mixture»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "خِلْط"
      confirm:
        - text: "«ما خالط الشيءَ الشيءُ يؤلَّف مع أشياء أخرى»"
          source: "المعجم الوسيط"
        - text: "«أخلاط الإنسان (في الطب القديم): أمزجته الأربعة»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "خَلِيط"
      decision: confirmed
      decision_reason: "المصطلح التقني الأكثر دقة وشيوعاً في الفيزياء والكيمياء للتعبير عن الخليط المادي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيط"

    - lemma: "مَزِيج"
      decision: confirmed
      decision_reason: "مرادف قوي لـ 'خليط'، ويشيع استخدامه في السياقات الطبية والكيمياء السائلة (المحاليل)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَزِيج"

    - lemma: "مَخْلُوط"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح منهجي معتمد في التعليم العام في معظم الدول العربية للتعبير عن هذا المفهوم تحديداً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَخْلُوط", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "خِلْط"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي وتقني (في الصيدلة التقليدية) يصف المكونات المختلطة، ويضيف عمقاً تاريخياً للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خِلْط", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "(كيمياء) مادة تتكون من مادتين أو أكثر مختلطة معاً (بنسب غير ثابتة ودون ترابط كيميائي)"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق علمياً لكن يمكن صياغته بأسلوب معجمي أكثر رصانة مع الحفاظ على المحتوى التقني."
    authored:
      - type: terminological
        text: "جسم مادي يتألف من مادتين أو أكثر غير متحدتين كيميائياً، تجتمعان معاً بنسب غير ثابتة، ويمكن فصل مكوناته بفاعليات فيزيائية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "جسم مادي يتألف من مادتين أو أكثر غير متحدتين كيميائياً، تجتمعان معاً بنسب غير ثابتة، ويمكن فصل مكوناته بفاعليات فيزيائية."}

  examples:
    per_lemma:
      - lemma: "خَلِيط"
        examples:
          - text: "الهواء هو خليط من عدة غازات، أهمها النيتروجين والأكسجين."
            type: usage
      - lemma: "مَزِيج"
        examples:
          - text: "يتكون البرونز من مزيج معدني يجمع بين النحاس والقصدير."
            type: usage
      - lemma: "مَخْلُوط"
        examples:
          - text: "يعد ماء البحر مخلوطاً متجانساً يتألف من الماء والأملاح الذائبة."
            type: usage
      - lemma: "خِلْط"
        examples:
          - text: "هذا الترياق عبارة عن خِلْط من أعشاب برية وزيوت طبيعية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يمكن فصل مكونات الخليط بطرق فيزيائية مثل الترشيح أو التقطير."}

