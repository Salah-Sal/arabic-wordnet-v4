        params: {synset_id: "awn4-14848726-n", definition_index: 0, text: "كُتَلٌ مُتَمَاسِكَةٌ تَتَبَقَّى مِنْ بُذُورِ القُطْنِ بَعْدَ عَصْرِها لِاسْتِخْرَاجِ الزَّيْتِ، تُسْتَعْمَلُ غَالِبًا عَلَفًا لِلْمَاشِيَةِ لِغِنَاهَا بِالبُرُوتِينِ."}
