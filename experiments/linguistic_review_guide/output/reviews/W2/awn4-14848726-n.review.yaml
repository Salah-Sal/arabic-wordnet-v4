stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تعبير مركب وتفتقر للتشكيل الكامل في الجزء الثاني.
      - المصطلح فني متخصص (تقانات الأغذية والزراعة) ويحتاج لتوثيق دقيق.
    observations: |
      المجموعة تشير إلى "كعكة بذور القطن" وهي البقايا الصلبة بعد استخلاص الزيت.
      المصطلح العربي الفني الشائع هو "الكُسْب" (المعرّب عن الفارسية) وقد ورد في المعاجم الحديثة والتقنية بهذا المعنى.
  blind_candidates:
    - lemma: "كُسْب القُطْن"
      generation_method: tarkib
      justification: "التركيب الإضافي بين المصطلح الفني (كسب) والمادة الخام (القطن)."
    - lemma: "كُسْبَة القُطْن"
      generation_method: tarkib
      justification: "استخدام صيغة المرة (كسبة) كبديل شائع للمصطلح الفني."
    - lemma: "ثُفْل القُطْن"
      generation_method: tarkib
      justification: "استخدام اللفظ العربي الفصيح (ثفل) الذي يعني ما تبقى من المادة بعد عصيرها."
    - lemma: "عُصَارَة القُطْن"
      generation_method: majaz
      justification: "توسيع دلالة (العصارة) لتشمل النفاية الصلبة المتبقية بعد العصر، كما ورد في بعض المعاجم."

stage2_evidence:
  per_lemma:
    - lemma: "كُسْب القُطْن"
      confirm:
        - text: "«كُسْب القطن: كتلة من بذور القطن المعصورة.»"
          source: "المورد الحديث (2008)"
        - text: "«كُسْب: ما يتبقى من بزور القطن والكتان والسمسم وغيرها بعد عصرها، ويستعمل علفًا أو سمادًا.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«كُسْب: مخلفات البذور الزيتية (التفل المتماسك المتبقي) بعد عصرها.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
    - lemma: "كُسْبَة القُطْن"
      confirm:
        - text: "«كُسَيْبَة... كسبة بمعنى علف للدواب يخرج من بذور القطن بعد عصرها.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "ثُفْل القُطْن"
      confirm:
        - text: "«الثُّفْلُ... ما يَتَبَقَّى من المادَّةِ بعدَ عَصْرِها.»"
          source: "المعجم الكبير"
    - lemma: "عُصَارَة القُطْن"
      confirm:
        - text: "«عُصارة... ثُفْل، نُفاية ما يُعصَر.»"
          source: "معجم اللغة العربية المعاصرة"

