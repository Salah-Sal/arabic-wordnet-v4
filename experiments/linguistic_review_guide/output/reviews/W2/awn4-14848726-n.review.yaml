      decision: revise
      reason: "التعريف الحالي دقيق لكن يمكن تحسين صياغته ليكون أكثر معجمية وتخصصاً."
    authored:
      - type: terminological
        text: "كُتَلٌ مُتَمَاسِكَةٌ تَتَبَقَّى مِنْ بُذُورِ القُطْنِ بَعْدَ عَصْرِها لِاسْتِخْرَاجِ الزَّيْتِ، تُسْتَعْمَلُ غَالِبًا عَلَفًا لِلْمَاشِيَةِ لِغِنَاهَا بِالبُرُوتِينِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
