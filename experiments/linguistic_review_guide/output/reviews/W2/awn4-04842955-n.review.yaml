stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان 'حافز' و'دافع' تشيران غالباً إلى 'المحرّك' أو 'الباعث' (motive/incentive) أكثر من إشارتهما إلى 'السّمَة الشخصية' (trait) بالمعنى المجرّد، رغم استخدامهما في علم النفس بهذا المعنى."
      - "التعريف العربي الحالي 'سمة كون المرء متحفزاً للغاية' يعاني من الدوران (استخدام 'متحفز' لتعريف 'حافز')."
    observations: "المجموعة تعبّر عن القوة الداخلية الدافعة للإنجاز (drive). المصطلح العربي التراثي الأدق هو 'الهمة'، والمصطلح الحديث الأدق هو 'الدافعية'."
  blind_candidates:
    - lemma: "دَافِعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'دافع'، يعبّر عن الحالة أو السمة النفسية (motivation/drive) بدلاً من الفاعل نفسه."
    - lemma: "هِمَّة"
      generation_method: majaz
      justification: "لفظ تراثي يعبّر عن طاقة النفس وتوجهها نحو معالي الأمور، وهو المقابل الأدق لـ 'drive' كسمة شخصية."
    - lemma: "عَزِيمَة"
      generation_method: ishtiqaq
      justification: "تعبر عن قوة الإرادة والقطع في الأمر، وهي جزء أصيل من الـ 'drive'."
    - lemma: "حَافِزِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'حافز'، يستخدم في سياقات الإدارة وعلم النفس للتعبير عن مستوى التحفيز الداخلي."

stage2_evidence:
  per_lemma:
    - lemma: "حافز"
      confirm:
        - text: "«(في علم النفس) drive: نشاط داخليّ في الكائن الحيّ... يجعله مُهَيَّأً للاستِجابَةِ لِمُثِيرٍ مُعَيَّنٍ»"
          source: "المعجم الكبير"
        - text: "«الحدث المنبه الذي يثير استجابة ما. [Stimulus]»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "دافع"
      confirm:
        - text: "«حالة داخلية جسمية أو نفسية تدفع الفرد نحو سلوك... قوة محركة منشِّطة وموجِّهة في وقت واحد.»"
          source: "مسرد التربية (ArabTerm)"
        - text: "«القوة الداخلية التي تنشط النزوع عند الإنسان. [drive]»"
          source: "معجم المصطلحات الطبية"
    - lemma: "دافعية"
      confirm:
        - text: "«دَافِعِيَّةٌ: [motivation]»"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية"
        - text: "«تحفيز ذاتي دافعية ذاتية: [self-motivation]»"
          source: "مسرد التربية (ArabTerm)"
    - lemma: "همة"
      confirm:
        - text: "«قوة راسخة في النفس طالبة لمعاني الأمور هاربة من خسائسها.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العزم القوى»"
          source: "المعجم الوسيط"
        - text: "«[في الانكليزية] Intention، determination، energy، activity»"
          source: "كشاف اصطلاحات الفنون"

stage3_analysis:
  per_lemma:
    - lemma: "حافز"
      decision: confirmed
      decision_reason: "مصطلح معتمد في علم النفس للتعبير عن الـ (drive) كنشاط داخلي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
    - lemma: "دافع"
      decision: confirmed
      decision_reason: "مرادف قوي للحافز، ويشير بوضوح إلى القوة الداخلية المحركة للسلوك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
    - lemma: "دَافِعِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الفني الحديث الأدق للتعبير عن 'سمة كون المرء متحفزاً' (motivation/drive) كحالة مستمرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دَافِعِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04842955-n"}
    - lemma: "هِمَّة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ أصيل يعبر عن الجانب الأخلاقي والنفسي للـ (drive)، وهو شائع الاستخدام في الأدبيات العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "هِمَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04842955-n"}

stage4_content:
  definition:
    current: "سمة كون المرء متحفزاً للغاية"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري (استخدام 'متحفز' لتعريف 'حافز/دافع')، ويحتاج لصياغة معجمية أكثر دقة."
    authored:
      - type: terminological
        text: "سمةٌ نفسية تجعل المرءَ مندفعاً بنشاطٍ وقوةٍ نحو تحقيق أهدافه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-04842955-n", definition_index: 0, text: "سمةٌ نفسية تجعل المرءَ مندفعاً بنشاطٍ وقوةٍ نحو تحقيق أهدافه."}
  examples:
    per_lemma:
      - lemma: "حافز"
        examples:
          - text: "يمتلك القادة الناجحون حافزاً داخلياً قوياً يحركهم نحو التميز."
            type: usage
      - lemma: "دافع"
        examples:
          - text: "كان الدافعُ للإنجاز هو المحرك الأساسي لمسيرته العلمية."
            type: usage
      - lemma: "دَافِعِيَّة"
        examples:
          - text: "تعتبر الدافعيةُ العالية من أهم مقومات النجاح في العمل الحر."
            type: usage
      - lemma: "هِمَّة"
        examples:
          - text: "على قدر أهل العزم تأتي العزائم، وتأتي على قدر الكرام المكارم (بمعنى الهمة العالية)."
            type: poetry
            source: "أبو الطيب المتنبي"
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-04842955-n", text: "أظهر الموظفُ همةً عاليةً ودافعيةً واضحةً في تنفيذ المهام الصعبة."}

