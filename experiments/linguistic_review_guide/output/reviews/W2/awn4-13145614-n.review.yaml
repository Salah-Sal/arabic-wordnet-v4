      reason: >
        التعريف الحالي فيه تكرار دلالي: الجملتان «جزء النبات الذي تخرج منه الجذور» و«جزء الساق
        أو الجذع الأقرب للجذور» يصفان المفهوم ذاته من زاويتَيْن مكررتَيْن. كما أن أسلوبه أقرب
        إلى الترجمة الحرفية من التعريف المعجمي المُحكَم. التعريف الجديد يُحكِم الجنس والفصل
        ويتجنب الحشو.
