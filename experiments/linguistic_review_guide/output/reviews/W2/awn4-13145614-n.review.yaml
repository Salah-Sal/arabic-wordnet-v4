# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — بُنيَ على التعريف وحده قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "مَجْذَر"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن مِفْعَل (موضع) من جذر "جذر"؛ يعني الموضع الذي تنشأ منه الجذور.
        الوزن مِفْعَل ينتج أسماء الأماكن المرتبطة بالفعل (كمَجْلِس، مَوْرِد)، وهو مناسب
        للدلالة على منطقة انبثاق الجذور.

    - lemma: "أَرُومَة"
      generation_method: majaz
      justification: >
        إحياء لفظ عربي كلاسيكي يعني "أصل الشجرة ومجتمعها"؛ ورد في المعاجم القديمة بهذا
        المعنى الحرفي قبل أن يُهجَر لصالح الاستعمال المجازي (أصل النسب والحسب).
        الانتقال من المجازي إلى الحقيقي النباتي إحياءٌ دلالي لا اقتراض.

    - lemma: "قَاعِدَةُ الجِذْع"
      generation_method: tarkib
      justification: >
        تركيب إضافي من "قاعدة" (الجزء الأسفل) + "الجذع" (ساق الشجرة)؛ يُعبِّر بدقة
        عن الجزء الأسفل من الجذع الأقرب إلى التربة.

    - lemma: "عُنُقُ الجَذْر"
      generation_method: tarkib
      justification: >
        تركيب إضافي مجازي من "عنق" (الجزء الرابط) + "الجذر"؛ يُمثِّل المنطقة الانتقالية
        بين الساق والجذر وهي المصطلح العلمي لـ root collar.

  # ب. التقييم الأوّلي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "لمّة «جذع» أوسع من المفهوم المطلوب: جِذْع = ساق النخلة كلها (bole/trunk)، لا قاعدتها خاصة."
      - "لمّة «أصل الساق» مركب وصفي حر يفشل اختبار السكّ: يمكن إبدال «أصل» بـ«قاعدة» أو «أسفل» دون أن تزول الدلالة، مما يدل على أنها عبارة وصفية لا مصطلح مسكوك."
      - "التعريف العربي مُطَوَّل: الجملة الثانية «أو جزء الساق أو الجذع الأقرب للجذور» مكرِّرة لما أفادته الأولى بأسلوب أقل إيجازاً."
      - "غياب المصطلح النباتي العربي المُستقر: «أَرُومَة» هو المقابل المُعجَمي المُثبَت في مصادر النهضة ولم يُدرَج."
    observations: >
      المجموعة تُمثّل مفهوماً نباتياً دقيقاً يُعرَّف باللغة الإنجليزية بـ"butt" ويقابله في
      المعجمية العربية الكلاسيكية لفظُ «أَرُومَة» بشهادة المعجم الوسيط والمعجم الكبير ومقاييس
      اللغة لابن فارس. كما يُثبته المعجم الموحد لمصطلحات علم الأحياء (ALECSO، 1993) صراحةً
      بترجمة butt → أرومة في حقل علم الأحياء. اللمّتان الحاليتان إما تُوسِّعان المعنى (جذع)
      أو تُعيدان وصف التعريف بصياغة حرة (أصل الساق).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    # ——— اللمّات الموجودة ———

    - lemma: "أصل الساق"
      expands:
        - text: >
            «(1) قاعديّ: «ب» ذو علاقة بالقاعدة أو واقعٌ عندها.
            «ج» ناشئ من قاعدة السّاق basal leaves / (2) أساسيّ.»
          source: "المورد الحديث (2008)"
          addition: >
            يُثبت أن المفهوم النباتي لـ"قاعدة الساق" معروف في المعجمية العربية الحديثة؛
            يستخدم «قاعدة الساق» لا «أصل الساق» في هذا السياق بالذات.
      # لا يوجد مدخل معجمي مستقل لـ"أصل الساق" كوحدة معجمية ثابتة.

    - lemma: "جذع"
      confirm:
        - text: "«الجِذْعُ: ساق النخلة ونحوها»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الجِذْعُ: ساق النَّخلَة ونحوها»"
          source: "المعجم الكبير (OCR)"
        - text: "«ج ذ ع: صلب في جذع نخلة وهي ساقها»"
          source: "أساس البلاغة للزمخشري"
      contradicts:
        - text: "جذع [arabterm] → translation_en: bole / trunk / stock / trunk / frustum"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) وغيره — ARABTERM"
          conflict: >
            المعاجم العلمية تُرجَم «جذع» بـ bole/trunk (الجذع كله من أسفله إلى فروعه)،
            وهذا أوسع بكثير من synset الذي يقتصر على قاعدة الجذع (butt) الأقرب للجذور.
        - text: >
            «(جِذْعُ) الْجِيمُ وَالذَّالُ وَالْعَيْنُ ثَلَاثَةُ أُصُولٍ... وَالْأَصْلُ الثَّانِي:
            جِذْعُ الشَّجَرَةِ»
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            ابن فارس يُدرج «جذع الشجرة» أصلاً قائماً بذاته بلا تخصيص لقاعدة الجذع؛
            يشمل كامل الساق الخشبية لا قاعدتها فقط.

    # ——— مرشحات المرحلة ١ ———

    - lemma: "أرومة"
      confirm:
        - text: "«ما يبقى في الأرض من الشجرة بعد قطعها» — translation_en: butt"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM biology"
        - text: >
            «(2) الطَّرَف الغليظ [من أيّ شيء]. مثل: الأرومة: أصل الشجرة»
            [ضمن شرح مدخل butt]
          source: "المورد الحديث (2008)"
        - text: "«الأُرُوم: أصل الشجرة واستعملت للحَسَبِ»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الأَرُوم: أصل القَرْن. أصل الشَّجرة. أصل النَّسب»"
          source: "المعجم الكبير (OCR)"
        - text: >
            «وَالْأَرُومَةُ أَصْلُ كُلِّ شَجَرَةٍ. وَأَصْلُ الْحَسَبِ أَرُومَةٌ،
            وَكَذَلِكَ أَصْلُ كُلِّ شَيْءٍ وَمُجْتَمَعُهُ»
          source: "مقاييس اللغة لابن فارس (أَرَمَ)"
      expands:
        - text: "أرومة — translation_en: stump (مدخل ثانٍ)"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM biology"
          addition: >
            وجود مدخلَيْن لـأرومة في arabterm (butt وstump) يُثبت غنى الدلالة؛
            كلاهما يصف الجزء القاعدي الملاصق للتربة بعد التقطيع.

    - lemma: "مجذر"
      contradicts:
        - text: "«(المجذر): يُقَال بقرة مجذر ذَات جؤذر»"
          source: "المعجم الوسيط (Hawramani)"
          conflict: "المعنى: ناقة أو بقرة ذات ولد (جؤذر = ولد البقرة)؛ لا صلة بالجذر النباتي."
        - text: "«المُجَذَّر: لقب عبد الله بن زياد البلوي»"
          source: "المعجم الكبير (OCR)"
          conflict: "اسم علم لرجل، لا دلالة نباتية."
        - text: "«المِجْذَرُ: الجَيْذَرُ»"
          source: "المعجم الكبير (OCR)"
          conflict: "إحالة متبادلة لا تُثبت دلالة نباتية."

    - lemma: "قاعدة الجذع"
      evidence_status: "no_material_found"

    - lemma: "عنق الجذر"
      expands:
        - text: "«انتفاخ عنق الجذر» — [مدخل في معجم علم الأحياء]"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM biology"
          addition: >
            يُثبت أن «عنق الجذر» مصطلح نباتي مستخدم في ARABTERM، لكنه يرد دائماً
            كجزء من مصطلح مركب (انتفاخ عنق الجذر = crown gall)، لا كمصطلح مستقل.
            يُشير تحديداً إلى منطقة تلاقي الجذر بالساق (root collar) وهي أضيق
            من المفهوم العام لـbutt.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:

  per_lemma:

    # ——— اللمّات الموجودة ———

    - lemma: "أصل الساق"
      decision: removed
      decision_reason: >
        يفشل المركب اختبار السكّ: يمكن إبدال «أصل» بـ«قاعدة» أو «أسفل» أو «مبدأ» مع
        بقاء الدلالة الوصفية كاملة، مما يدل على أنه عبارة وصفية حرة لا وحدة معجمية ثابتة.
        كذلك لا يوجد في قواعد البيانات المعجمية مدخل مستقل لـ«أصل الساق» كمصطلح مسكوك
        في السياق النباتي؛ والأَولى تعويضه بـ«أَرُومَة» المُثبَت معجمياً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جذع"
      decision: removed
      decision_reason: >
        «جِذْع» في العربية المعجمية — كلاسيكيةً وحديثةً — يعني ساق الشجرة كاملةً من قاعدتها
        إلى فروعها (bole / trunk)، لا قاعدتها وحدها. المعجم الموحد لعلم الأحياء يُترجم جذع
        بـ bole وtrunk وstock على التوالي، وكلها تدل على كامل الجذع. Synset awn4-13145614-n
        يعني تحديداً القاعدة (butt)، وهو مفهوم أضيق من «جذع». إدراج «جذع» يُدخِل تعميماً
        غير دقيق في المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ——— مرشحات المرحلة ١ ———

    - lemma: "أَرُومَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَتة بشواهد مُتقاطعة من ثلاثة مستويات: (١) المعجمية الكلاسيكية (الوسيط والكبير
        ومقاييس اللغة) بمعنى «أصل الشجرة»؛ (٢) المعجمية الحديثة (المورد الحديث) مع مثال
        «الأرومة: أصل الشجرة» ذيلاً لمدخل butt؛ (٣) المصطلحية العلمية (ARABTERM biology)
        بالتوافق المباشر butt → أرومة. تستوفي معايير الجودة الستة: اطّراد وشيوع، يُسر تداول،
        ملاءمة نباتية، إيثار التراث، إيثار العربي الأصيل (جذر أرم)، واشتقاقية سليمة.
        تشكيل كامل: أَرُومَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: native_arabic
        root: أرم
        note: "جذر ثلاثي عربي أصيل؛ لا اقتراض ولا ترجمة حرفية."
      morphology_check:
        pattern: "فَعُولَة"
        function: "اسم بمعنى المكان أو الأصل (مثل: عمود، طنوب)"
        fit: مناسب
      quality_gates:
        ittiraad: "مستخدمة في مصادر الأحياء والمعجمية الحديثة"
        yusr: "سهلة التداول، ثلاثة مقاطع"
        mulaama: "تناسب السياق النباتي والمجازي (أصل الأشياء)"
        ithaar_turath: "واردة في مقاييس اللغة والوسيط والكبير"
        ithaar_arabi: "جذر عربي خالص (أرم)"
        ishtiqaaqiyya: "تشتق منها أُرُوم وتَأَرَّمَ وغيرها"
      nuance_differentiation: >
        أَرُومَة الوحيدة المُقرَّرة؛ تجمع دلالتَيْن: (أ) الجزء الذي تنبثق منه الجذور في النبات الحي،
        (ب) ما يبقى في التربة بعد القطع. تحمل إيحاء الأصالة والرسوخ غائباً في التعبيرات الوصفية
        كـ«قاعدة الساق».
      actions:
        - command: create_entry
          params:
            lemma: "أَرُومَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَجْذَر"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُثبت المعجمُ أيَّ دلالة نباتية للمِجْذَر؛ معانيه المُوثَّقة: (أ) بقرة ذات ولد،
        (ب) لقب رجل. وزن مِفْعَل من «جذر» غير مُعجَمَن في الاستعمال النباتي.

    - lemma: "قَاعِدَةُ الجِذْع"
      source: stage1
      decision: removed
      decision_reason: >
        لا مدخل مستقل لهذا المركب في أي مصدر معجمي. يفشل اختبار التثبيت المعجمي
        (يمكن إبدال «الجذع» بـ«الساق» أو «الجذر») فهو وصف حر لا مصطلح مسكوك.

    - lemma: "عُنُقُ الجَذْر"
      source: stage1
      decision: removed
      decision_reason: >
        «عنق الجذر» مصطلح نباتي مُستخدَم فعلاً في ARABTERM لكنه يختص بـroot collar
        (منطقة التلاقي بين الجذر والساق فوق سطح التربة)، وهو أضيق دلالةً من المفهوم العام
        لـbutt الذي يشمل قاعدة الساق بكاملها. إدراجه سيُضيِّق المجموعة تضييقاً غير مقصود.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:

  definition:
    current: "جزء النبات الذي تخرج منه الجذور أو جزء الساق أو الجذع الأقرب للجذور"
    assessment:
