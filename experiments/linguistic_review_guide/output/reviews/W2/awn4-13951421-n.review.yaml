# AWN4 Review — awn4-13951421-n
# synset: relationship (a state of connectedness between people)
# reviewed: 2026-03-17
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «علاقة» تفتقر إلى التشكيل الكامل؛ الصواب «عَلَاقَة»"
      - "المجموعة تضمّ لمّةً واحدةً فقط، مما يُضيِّق التغطية الدلالية لمفهوم الارتباط الإنساني"
      - "التعريف الحالي يُكرِّر جذر ر-ب-ط مرتين «الترابط» و«الارتباط»، مما يُضعِف دقته المعجمية"
    observations: >
      تنتمي المجموعة إلى حقل العلاقات الإنسانية بمعناها العام، مع تركيز على الجانب العاطفي والوجداني.
      المفهوم الإنجليزي «relationship» يقابله في العربية أكثر من لفظ حسب السياق: «عَلَاقَة» في المقام العام،
      و«رَابِطَة» لجانب الوصل والربط، و«صِلَة» في سياقات قرآنية واجتماعية. جذر «علق» الذي تنتمي
      إليه «عَلَاقَة» يحمل أصلاً دلالةَ التعلق القلبي الذي يناط الشيء بالشيء، وهو متطابق مع المفهوم.
  blind_candidates:
    - lemma: "صِلَة"
      generation_method: majaz
      justification: >
        من جذر «وصل» على وزن فِعْلة. إحياء للمعنى القديم «الوصل والاتصال بين الناس»؛ تُستخدم
        في تراكيب راسخة كـ«صِلَة الرَّحِم»، وتحمل معنى الارتباط والتواصل بين الأشخاص.
    - lemma: "وَشِيجَة"
      generation_method: majaz
      justification: >
        من جذر «وشج» الدال على الاشتباك والتداخل. كلمة قديمة تعني القرابة المشتبكة المتصلة،
        ومجازاً الرابطة الوثيقة بين الناس. إحياء لفظ ميت لتجنب الاشتراك اللفظي.
    - lemma: "رَابِطَة"
      generation_method: ishtiqaq
      justification: >
        من جذر «ربط» على وزن فَاعِلَة، صيغة اسم الهيئة. تدل على ما يربط بين شخصين أو أشخاص
        من صلة ووصلة؛ الوزن «فاعلة» مناسب للدلالة على ما يقوم بالربط والوصل.
    - lemma: "أُلْفَة"
      generation_method: ishtiqaq
      justification: >
        من جذر «ألف» على وزن فُعْلة، مصدر الائتلاف. تدل على انضمام شخص إلى آخر وميل القلب
        إليه، وهو اشتقاق مناسب للجانب العاطفي من الارتباط بين الناس.


stage2_evidence:
  per_lemma:

    - lemma: "عَلَاقَة"
      confirm:
        - text: "«(العلاقة) الصداقةُ والحبُّ اللازمُ للقلبِ وما تتبلَّغُ به البهائم من الشجر وما يكتفى به من العيش وما تعلَّق به الإنسانُ من صناعةٍ وغيرها، و(في علم البيان) المناسبةُ بين المعنى الأصلي والمعنى المراد في المجاز والكناية. (ج) علائق»"
          source: "المعجم الوسيط (Hawramani)"
        - text: "«العلاقة: [في الانجليزية] Relation, relationship, link — بالفتح رابطةٌ، يستعمل في المعاني»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«عَلاَقَة — relationship»"
          source: "المعجم الطبي الموحد (ARABTERM، 2009)"
        - text: "«علاقة بين الأشخاص: ترابطٌ بين عدة أفراد داخل جمعية يحاولون فيها تلبية الحاجات الاجتماعية لبعضهم بعض — interpersonal relationship»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«العِلاقة: شيءٌ بسببه يستصحب الأولُ الثانيَ كالعِلِّيَّة والتضايف»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُبيِّن أن العلاقة في الاصطلاح تعني الرابط الذي يجعل الشيء يلازم شيئاً آخر؛ وهذا يُثري دلالة المجموعة."
        - text: "«العلاقة الاجتماعية: روابط تجمع بين الأفراد على أساس اجتماعي — social relationship»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
          addition: "يُؤكد استخدام «علاقة» في السياق الاجتماعي/الإنساني."

    - lemma: "صِلَة"
      contradicts:
        - text: "«(الصِّلَة) الجلدُ اليابسُ المنتن، (الصِّلَة) الريحُ المنتنة، (الصِّلَة) صوتُ المسمار عند الدق»"
          source: "المعجم الوسيط (Hawramani)"
          conflict: "المعاجم الكلاسيكية توثّق للصِّلَة معاني بعيدة عن الارتباط الإنساني العاطفي."
        - text: "«(الصِّلَة) العطيةُ والجائزة... (الصِّلَة) الزاد»"
          source: "المعجم الوسيط (Hawramani)"
          conflict: "المعنى الرئيس للصِّلَة في المعاجم الكلاسيكية هو «العطية والمنحة» لا «العلاقة الإنسانية»."
      expands:
        - text: "«الصّلة: [في الانكليزية] Relation, contact, conjunction — بكسر الصاد في اللغة الفارسية بمعنى: الاتصال والوصل والقرابة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُشير إلى استخدام محدود لـ«الصِّلَة» بمعنى الاتصال والقرابة، لكنه غير مُثبَت في المعاجم العربية الصرفة."
        - text: "«علاقة، صِلة — relationship (veterinary)»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (ARABTERM)"
          addition: "استخدام «صِلَة» مقروناً بـ«علاقة» بوصفها ترادفاً مُقترَحاً في سياق تقني، لا مصطلحاً مستقلاً."

    - lemma: "وَشِيجَة"
      expands:
        - text: "«الوشيجة: عرقُ الشجرة، وعرقُ الأُذُن، والقرابةُ المشتبكةُ المتصلة، وليفٌ يُفتَل ثم يُشبَك بين خشبتين»"
          source: "المعجم الوسيط (Hawramani)"
          addition: "المعنى الثالث «القرابة المشتبكة المتصلة» يقترب من الارتباط البشري، لكنه مقيَّد بالقرابة الدموية أو الوثيقة لا العلاقة العامة."
        - text: "«الوَشِيجَةُ: عرق الشجرة، عرق الأُذُن، القرابةُ المشتبكةُ المتصلة، ليف يُفتَل ثم يُشبَك بين خشبتين»"
          source: "المعجم الوسيط (OCR)"
          addition: "يُؤكد أن الوشيجة تنصرف أساساً إلى الاشتباك المادي أو القرابة الوثيقة."
        - text: "«(وَشَجَ) الواوُ والشينُ والجيم: كلمةٌ تدل على اشتباكٍ وتداخل. يُقال: وَشَجَتِ الأغصانُ: اشتبكَت»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «وشج» يدل على الاشتباك والتداخل المادي؛ مصدر دلالي مقيَّد لا يُغطي العلاقة الإنسانية العامة."

    - lemma: "رَابِطَة"
      confirm:
        - text: "«(الرابطة) العلاقةُ والوصلةُ بين الشيئين، ومن الدواب ونحوها: المربوطة، والجماعةُ يجمعهم أمرٌ يشتركون فيه، يُقال: رابطةُ الأدباء ورابطةُ القرّاء. (محدثة). (ج) روابط»"
          source: "المعجم الوسيط (Hawramani)"
        - text: "«العُلقةُ والوصلةُ بين الشيئين»"
          source: "المعجم الكبير (OCR)"
      expands:
        - text: "«(رَبَطَ) الراءُ والباءُ والطاء أصلٌ واحد يدل على شدٍّ وثبات. من ذلك: رَبَطتُ الشيءَ أَرْبِطُهُ رَبطاً؛ والذي يُشَدُّ به رِبَاط»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبِت أن جذر «ربط» يحمل معنى الشد والثبات، مما يمنح «رَابِطَة» دلالة البقاء والاستمرار في الارتباط."

    - lemma: "أُلْفَة"
      contradicts:
        - text: "«الأُلفة: اتفاقُ الآراء في المعاونة على تدبير المعاش»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "التعريف يُقيِّد الأُلفة بالتعاون على المعاش لا بالارتباط العاطفي الإنساني العام."
        - text: "«أُلْفَة — affinity»"
          source: "المعجم الطبي الموحد (ARABTERM)"
          conflict: >
            في المصطلحية الحديثة «أُلْفَة» = affinity (تجاذب كيميائي/بيولوجي)، وهو مختلف جوهرياً
            عن دلالة المجموعة (الارتباط الإنساني العاطفي)، مما يُحدث اشتراكاً لفظياً.
      expands:
        - text: "«الألفة: [في الانكليزية] Familiarity — بالضم هي في اللغة: ميلانُ القلب إلى المألوف. وعند السالكين هي من مراتب المحبة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُوضح أن «أُلْفَة» تُشير إلى الأُنس والتعلق القلبي، وهي مرتبة من مراتب المحبة، لا العلاقة بمعناها الواسع."
        - text: "«(أَلَفَ) الهمزةُ واللامُ والفاء أصلٌ واحد، يدل على انضمام الشيء إلى الشيء... والأُلفةُ مصدرُ الائتلاف. وإلفُكَ وأليفُك: الذي تأْلَفُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «الف» يدل على الانضمام والألفة؛ وهو معنى دقيق يصف الأُنس والاعتياد، لا عموم العلاقة الإنسانية."


stage3_analysis:
  per_lemma:

    - lemma: "عَلَاقَة"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة في المعاجم الكلاسيكية والحديثة بمعنى «الصداقة والحب اللازم للقلب»
        (الوسيط)، وتُستخدم في المصطلحية الحديثة لـ«relationship» بمعناها الإنساني الواسع.
        الجذر «علق» يحمل أصلاً دلالة التعلق القلبي وفق مقاييس ابن فارس. يجب تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «عَلَاقَة» هي المصطلح الأشمل والأعمّ؛ تغطي طيفاً واسعاً من الارتباطات الإنسانية
        (العاطفية والاجتماعية والمهنية والفكرية)، وهي الأكثر شيوعاً في الاستعمال المعاصر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَلَاقَة"

    - lemma: "صِلَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكلاسيكية توثّق للصِّلَة معاني مغايرة (العطية، الجلد اليابس، صوت المسمار)
        لا تدعم استخدامها مستقلةً لمفهوم «العلاقة العاطفية». الاستخدام الحديث يقرنها دائماً بـ«علاقة»
        أو يُقيِّدها بتركيب «صِلَة الرَّحِم». لا تجتاز اختبار السكّ بوصفها مصطلحاً مستقلاً.

    - lemma: "وَشِيجَة"
      source: stage1
      decision: removed
      decision_reason: >
        «الوشيجة» في المعاجم تنصرف إلى «القرابة المشتبكة المتصلة» وهو مفهوم أضيق من
        «العلاقة» العامة؛ إذ يختص بالروابط الدموية والقرابية الوثيقة. كما أن الجذر «وشج»
        يدل أساساً على الاشتباك المادي للأغصان ونحوها. لا تُغطي المجموعة الترادفية المطلوبة.

    - lemma: "رَابِطَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        وثّق المعجم الوسيط (طبعتان) «الرابطة» بأنها «العلاقة والوصلة بين الشيئين» مباشرةً،
        وجاء المعجم الكبير بـ«العُلقة والوصلة بين الشيئين». الجذر «ربط» وفق مقاييس ابن فارس يدل
        على الشد والثبات، مما يمنح «رَابِطَة» معنى الاستمرار والديمومة في الارتباط.
        اجتازت اختبار التثبيت المعجمي ومقياسَي الاطّراد والاشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «رَابِطَة» تُركز على الجانب الوصلي والبنيوي في الارتباط؛ تُشير إلى الخيط الجامع
        الذي يربط شخصين أو أكثر ربطاً ثابتاً محسوساً أو معنوياً. وهي أقلّ استخداماً
        للارتباط العاطفي المجرد قياساً بـ«عَلَاقَة».
      actions:
        - command: create_entry
          params:
            lemma: "رَابِطَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أُلْفَة"
      source: stage1
      decision: removed
      decision_reason: >
        «أُلْفَة» تُعبِّر عن الأُنس والتعلق القلبي والاعتياد (familiarity/fondness)، لا عن
        العلاقة بمعناها الجامع. في المصطلحية الحديثة تُقابل «affinity» الكيميائي والبيولوجي،
        مما يُنشئ اشتراكاً لفظياً مضرّاً. لا تُغطي المجموعة الترادفية بمفردها.


