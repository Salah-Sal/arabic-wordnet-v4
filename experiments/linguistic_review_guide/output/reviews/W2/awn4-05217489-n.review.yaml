    concerns:
      - "التعريف الحالي «خاصية القابلية للذوبان» يجمع مصطلحَي «خاصية» و«قابلية» وكلاهما يدل على الصفة ذاتها، مما يُفضي إلى تضخيم دلالي"
      - "اللمّتان «ذوبانية» و«قابلية الذوبان» خاليتان من التشكيل الكامل"
      - "«قابلية الذوبان» مركَّب إضافي فضفاض قد يُوهم أنه تعبير وصفي حر لا مصطلح مسكوك؛ يستدعي التحقق من تثبيته المعجمي"
      - "غياب مرادفات موثقة في المجموعة: المعاجم التقنية تُدرج عادةً «الانحلالية» و«الذائبية» جنباً إلى جنب مع «الذوبانية»"
    observations: >
      المجموعة تُعالج مفهوم «الذوبانية» (solubility) وهو مصطلح علمي له حضور وافر في المعجمية التقنية
      العربية الحديثة. اللمّة الرئيسية «ذوبانية» مشتقة من مصدر «ذوبان» بإضافة ياء النسب والتأنيث
      على وزن فَعَلانيَّة، وهو قياسي في العربية لبناء مصطلحات الخواص والصفات. يرتبط المفهوم
      ارتباطاً وثيقاً بالجذرين «ذوب» و«حلل»، وكلاهما من الجذور العربية الأصيلة الغنية بالاشتقاقات.
      يُستحسن إثراء المجموعة بمرادفاتها المعجمية الموثقة.

  blind_candidates:
    - lemma: "ذَوَبَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مُشتَق من «ذَوَبَان» بإضافة ياء النسب والتأنيث؛ يُنتج اسماً للخاصية المجردة
        دالاً على كون الشيء قابلاً للذوبان. الوزن «فَعَلانيَّة» منتج لأسماء الخواص الكيميائية في
        العربية المعاصرة (نظير: مغناطيسية، كهربائية).

    - lemma: "اِنْحِلَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «اِنْحِلال» (المصدر السداسي لانحلَّ) بإضافة ياء النسب والتأنيث؛ يُشدد على
        الجانب الكيميائي للانحلال في مذيب. وزن اِفْعِلالِيَّة مناسب لمصطلحات القابلية والاستعداد.

    - lemma: "ذَائِبِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الصفة المشبهة «ذَائِب» (اسم الفاعل من ذَابَ) بإضافة ياء النسب والتأنيث؛
        يُشير إلى صفة لصيقة بالمادة ذاتها (كونها ذائبة بطبعها). يُفيد في التمييز بين ما يتعلق
        بالفعل (ذوبان) وما يتعلق بالحال (ذائب).

    - lemma: "اِنْمِيَاعِيَّة"
      generation_method: majaz
      justification: >
        إحياء للجذر الكلاسيكي «ماع/ناع» الذي يعني ذاب وسال وتفرق، وهو جذر استُعمل في شعر الجاهلية
        والمعاجم الأصيلة. بإضافة المصدر الصناعي (انمياعية) يُنتَج مصطلح يحمل دلالة السيولة
        الكامنة إلى جانب الذوبان، مما يُثري الحقل الدلالي ويُحيي لفظاً مهجوراً.


