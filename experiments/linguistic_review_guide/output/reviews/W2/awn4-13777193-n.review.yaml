# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13777193-n
# (في علم الحاسوب) مقدار المعلومات (بالبايت) التي يمكن تخزينها على محرك أقراص
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «سعة» عامّة جدًّا وتحتاج إلى تقييد بسياق الحوسبة، وهي بلا تشكيل"
      - "اللمّة «سعة تخزينية» بصيغة الوصف (تخزينية) بدلاً من صيغة الإضافة المعتمدة في المعاجم المصطلحية (سعة التخزين)"
      - "لم تُذكر وحدة البايت في التعريف العربي بوصفها اسمًا معرَّبًا مقبولاً، وقد ورد ذكرها بين قوسين فقط"
    observations: "المجموعة تتناول مفهومًا حاسوبيًّا تقنيًّا محدّدًا، وهو سعة التخزين على الأقراص. اللمّة «سعة» مفردة تعبّر عن المفهوم العامّ للطاقة والاستيعاب، بينما يحتاج السياق الحاسوبي إلى مركّب تخصيصي. صيغة الإضافة «سعة التخزين» هي المعتمدة في معاجم المصطلحات الموحّدة (ALECSO) ومعجم المعلوماتية. أمّا الصيغة الوصفية «سعة تخزينية» فهي أقلّ شيوعًا وغير موثّقة في المعاجم المصطلحية."
  blind_candidates:
    - lemma: "سَعَة"
      generation_method: ishtiqaq
      justification: "من الجذر «وسع»، على وزن فَعْلة (بحذف الواو)، تدلّ على مقدار ما يتّسع له الشيء؛ مستعملة في المصطلحات التقنية بمعنى capacity"
    - lemma: "سَعَة التَّخْزِين"
      generation_method: tarkib
      justification: "مركّب إضافي من «سعة» و«التخزين»، يخصّص المفهوم بمجال التخزين الحاسوبي؛ هو المصطلح المعتمد في معاجم ALECSO"
    - lemma: "حَجْم التَّخْزِين"
      generation_method: tarkib
      justification: "مركّب إضافي من «حجم» (مقدار الجسم) و«التخزين»؛ يُستعمل أحيانًا في سياق الحوسبة للدلالة على حجم وسائط التخزين"
    - lemma: "وُسْع التَّخْزِين"
      generation_method: ishtiqaq
      justification: "من الجذر «وسع» على وزن فُعْل، ورد في المعجم الموحّد لمصطلحات تقانة المعلومات (ALECSO 2011) بمعنى storage capacity"

stage2_evidence:
  per_lemma:
    - lemma: "سَعَة"
      confirm:
        - text: "«الطَّاقة والقُوَّة الدَّعَة والغِنى والرَّفاهِيَة. يقال: هو في سَعَةٍ من العيش»"
          source: "المعجم الوسيط"
        - text: "«السّعة: بفتح السين هي بالفارسية (فراخي) والتّوسعة والاحتواء والغنى»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«سعة — capacity — capacité» (مسجّلة في مجالات: الفيزياء، الكيمياء، الرياضيات، علوم البحار، النقل، الطاقة المتجدّدة، هندسة السيارات، التشريح)"
          source: "معاجم ALECSO الموحّدة (مجالات متعدّدة)"
          addition: "المصطلح مستقرّ في مختلف المجالات التقنية بمعنى capacity"
        - text: "«وُسْعٌ: حيز متوفر لتخزين المعلومات في الذاكرة الحية للحاسوب أو في ذاكرة خارجية مثل القرص — سِعَة (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "نصّ المعجم يذكر «سعة» مرادفًا عربيًّا لـ«وُسْع» في سياق الحوسبة تحديدًا"

    - lemma: "سعة تخزينية"
      evidence_status: "no_material_found"

    - lemma: "سَعَة التَّخْزِين"
      confirm:
        - text: "«سعة التخزين: أكبر كم من المعلومات يمكن أن يحتويه جهاز التخزين بالحاسوب وتقاس السعة بالأرقام الثنائية (البيتات) أو الحروف أو الكلمات»"
          source: "مسرد التربية — ALECSO"
        - text: "«سعة التخزين — storage capacity; storage size — capacité de mémoire»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«سِعة التخزين: أقصى قدر من الطاقة يُمكن لوسيط تخزين استيعابه»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«سَعَة التخزين: حجم مساحة التخزين وغرفة التجميع»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«سعة/ قدرة التخزين — storage capacity»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "يذكر «قدرة التخزين» بديلاً"

    - lemma: "حَجْم التَّخْزِين"
      evidence_status: "no_material_found"

    - lemma: "وُسْع التَّخْزِين"
      confirm:
        - text: "«وُسْعُ التَّخْزِينِ: أكبر حجم من المعطيات يمكن أن تخزنه ذاكرة ما»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"

