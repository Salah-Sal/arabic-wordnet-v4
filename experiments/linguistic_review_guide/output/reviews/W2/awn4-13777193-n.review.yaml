      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يخصّص مفهوم السعة بمجال التخزين الرقمي تحديدًا، وهو أدقّ من «سعة» المطلقة"
      actions:
