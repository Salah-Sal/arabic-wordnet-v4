stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (مؤتلف) تفتقر إلى التشكيل الدقيق، وقد تكون أقل دقة علمياً ومباشرة من مصطلحات علم الوراثة المعتمدة التي تستخدم جذر (أشب)."
    observations: "المفهوم علمي دقيق يتعلق بإعادة التركيب الجيني (Recombination). هناك حاجة لمصطلح يعبر عن هذا الخلط على مستوى الحمض النووي بشكل دقيق ومعتمد في المعاجم المتخصصة."
  blind_candidates:
    - lemma: "مَأْشُوب"
      generation_method: ishtiqaq
      justification: "اسم مفعول من أشَبَ (خلط)، ويستخدم في سياق علم الوراثة للدلالة على الكائن أو الخلية التي خلطت مادتها الوراثية (Recombinant)."
    - lemma: "مُتَأَشِّب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تأشّب، يعبر عن الكائن الذي قام بعملية إعادة التركيب الجيني."
    - lemma: "مُعَادُ التَّرْكِيبِ"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر بشكل مباشر وواضح عن إعادة التركيب الجيني."
    - lemma: "مُهَجَّن"
      generation_method: majaz
      justification: "مجاز من تهجين السلالات لتقريب فكرة خلط المادة الوراثية، رغم أن التهجين أعم."

stage2_evidence:
  per_lemma:
    - lemma: "مؤتلف"
      confirm:
        - text: "مولدات ضد مؤتلفة (recombinant antigens)"
          source: "المَكنَز الزراعي متعدد اللغات"
      expands:
        - text: "«أ» اتحاد. «ب» مجموعة مؤتلفة"
          source: "المورد الحديث (2008)"
          addition: "يدل على الائتلاف والاجتماع، مما يجعله صالحاً لوصف الخلية المندمجة جينياً."
    - lemma: "مَأْشُوب"
      confirm:
        - text: "الفرد أو الخلية الجديدة التي تتولد نتيجة اتحادات جينية جديدة بين الصبغيات أو في نفس الصبغيّ."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "مَأْشوب (recombinant)"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "مُتَأَشِّب"
      evidence_status: "no_material_found"
    - lemma: "مُعَادُ التَّرْكِيبِ"
      evidence_status: "no_material_found"
    - lemma: "مُهَجَّن"
      contradicts:
        - text: "مصطلح عام لوصف أية سُلالة لأبوين مُختلفين جينياً. (hybrid)"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "المصطلح يقابل (hybrid) ويعبر عن خلط السلالات الكلي، وليس بالضرورة إعادة التركيب الجيني على مستوى الخلية (recombinant)."

stage3_analysis:
  per_lemma:
    - lemma: "مؤتلف"
      decision: confirmed
      decision_reason: "اللمة مقبولة ومستخدمة في بعض السياقات العلمية (مثل مولدات ضد مؤتلفة) للدلالة على إعادة التركيب، وجذرها يدل على الاجتماع والضم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُؤْتَلِف"
    - lemma: "مَأْشُوب"
      source: stage1
      decision: confirmed
      decision_reason: "هذا هو المصطلح العلمي المعتمد والموثق في معاجم علم الوراثة والطب للمفهوم (recombinant)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَأْشُوب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُتَأَشِّب"
      source: stage1
      decision: removed
      decision_reason: "المصطلح المعتمد هو اسم المفعول (مأشوب) وليس اسم الفاعل، ولم تثبت أدلة على استخدام (متأشب) بهذا المعنى كاسم للكائن."
    - lemma: "مُعَادُ التَّرْكِيبِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي غير مسكوك معجمياً كاسم مفرد يعبر عن الخلية، والأفضل استخدام اللمات المفردة (مأشوب)."
    - lemma: "مُهَجَّن"
      source: stage1
      decision: removed
      decision_reason: "يعبر عن معنى مختلف علمياً وهو (hybrid) وليس (recombinant)."

stage4_content:
  definition:
    current: "خلية أو كائن حدث فيه إعادة تركيب جيني"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يمكن أن يكون أطرد من خلال تحديد الجنس القريب بشكل أوفى وفقاً للمعجم الموحد لعلم الوراثة."
    authored:
      - type: terminological
        text: "كَائِنٌ حَيٌّ أَوْ خَلِيَّةٌ جَدِيدَةٌ تَتَوَلَّدُ نَتِيجَةَ اتِّحَادَاتٍ جِينِيَّةٍ جَدِيدَةٍ بَيْنَ الصِّبْغِيَّاتِ، مِمَّا يُؤَدِّي إِلَى إِعَادَةِ التَّرْكِيبِ الْجِينِيِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "كَائِنٌ حَيٌّ أَوْ خَلِيَّةٌ جَدِيدَةٌ تَتَوَلَّدُ نَتِيجَةَ اتِّحَادَاتٍ جِينِيَّةٍ جَدِيدَةٍ بَيْنَ الصِّبْغِيَّاتِ، مِمَّا يُؤَدِّي إِلَى إِعَادَةِ التَّرْكِيبِ الْجِينِيِّ."}

  examples:
    per_lemma:
      - lemma: "مُؤْتَلِف"
        examples:
          - text: "تُسْتَخْدَمُ الْبَكْتِيرْيَا الْمُؤْتَلِفَةُ فِي إِنْتَاجِ الْأَنْسُولِينِ الْبَشَرِيِّ."
            type: usage
      - lemma: "مَأْشُوب"
        examples:
          - text: "تَمَّ عُزْلُ الْمَأْشُوبِ الْجِينِيِّ بَعْدَ عَمَلِيَّةِ نَقْلِ الْبِلَازْمِيدَاتِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُسْتَخْدَمُ الْبَكْتِيرْيَا الْمُؤْتَلِفَةُ فِي إِنْتَاجِ الْأَنْسُولِينِ الْبَشَرِيِّ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَمَّ عُزْلُ الْمَأْشُوبِ الْجِينِيِّ بَعْدَ عَمَلِيَّةِ نَقْلِ الْبِلَازْمِيدَاتِ."}

stage5_enrichment:
  per_entry:
    - lemma: "مُؤْتَلِف"
      entry_id: "{auto}"
      root: "الف"
      maqayis_quote: "«الْهَمْزَةُ وَاللَّامُ وَالْفَاءُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى انْضِمَامِ الشَّيْءِ إِلَى الشَّيْءِ، وَالْأَشْيَاءُ الْكَثِيرَةُ أَيْضًا»"
    - lemma: "مَأْشُوب"
