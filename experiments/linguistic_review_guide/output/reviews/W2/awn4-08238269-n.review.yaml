      maqayis_quote: "«الشِّينُ وَالْعَيْنُ وَالْبَاءُ أَصْلَانِ مُخْتَلِفَانِ، أَحَدُهُمَا يَدُلُّ عَلَى الِافْتِرَاقِ، وَالْآخَرُ عَلَى الِاجْتِمَاعِ... وَمِنْهُ الشَّعْبُ: مَا تَشَعَّبَ مِنْ قَبَائِلِ الْعَرَبِ وَالْعَجَمِ... وَانْشَعَبَتْ أَغْصَانُ الشَّجَرَةِ.»"
