stage1_review:
  assessment:
    concerns:
      - "اللفظ (شَمَالِيَّة) قد يلتبس في بعض السياقات كصفة للمؤنث بدلاً من كونه اسماً مجرداً للخاصية (Northernness)."
    observations: "المفهوم مجرد يعبر عن انتساب الشيء لجهة الشمال، والصياغة العربية باتباع نمط المصدر الصناعي (شمالية) هي الطريقة القياسية والأكثر دقة للتعبير عن هذه الخاصية في اللغة الحديثة."
  blind_candidates:
    - lemma: "شَمَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (شمالي) للتعبير عن الخاصية المجردة (northernness)."
    - lemma: "شَمَالِيّ"
      generation_method: ishtiqaq
      justification: "استخدام الصفة كاسم ليدل على من ينتسب لجهة الشمال أو ما يتميز بها."
    - lemma: "جِهَة الشَّمَال"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر عن الموضع أو المبدأ المكاني."
    - lemma: "طَابَع شَمَالِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن الخصائص المرتبطة بالشمال."

stage2_evidence:
  per_lemma:
    - lemma: "شَمَالِيَّة"
      confirm:
        - text: "«منطقة شمالية/بوريال: منطقة جغرافية حيوية تقع بين المنطقة المعتدلة والمنطقة القطبية...»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«روديسيا الشمالية (زامبيا)»"
          source: "المعجم الكبير"
          addition: "يستخدم اللفظ كصفة للمؤنث في أسماء الأعلام الجغرافية."
    - lemma: "شَمَالِيّ"
      confirm:
        - text: "«شَمَالِيّ: boreal»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "«تقع حلب شماليَّ سورية [فصيحة]»"
          source: "معجم الصواب اللغوي"

stage3_analysis:
  per_lemma:
    - lemma: "شَمَالِيَّة"
      decision: confirmed
      decision_reason: "اللفظ هو المصطلح الدقيق والقياسي للتعبير عن الخاصية المجردة (Northernness) في اللغة العربية المعاصرة، وهو مشتق اشتقاقاً صحيحاً على وزن المصدر الصناعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَمَالِيَّة"

stage4_content:
  definition:
    current: "خاصية الوجود باتجاه الشمال"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي بعض الشيء ويحتاج لصياغة معجمية أكثر رصانة توضح طبيعة الخاصية."
    authored:
      - type: terminological
        text: "خَاصِّيَّةُ انْتِسَابِ الشَّيْءِ إِلَى جِهَةِ الشَّمَالِ أَوْ وُقُوعِهِ فِيهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَاصِّيَّةُ انْتِسَابِ الشَّيْءِ إِلَى جِهَةِ الشَّمَالِ أَوْ وُقُوعِهِ فِيهَا."

  examples:
    per_lemma:
      - lemma: "شَمَالِيَّة"
        examples:
          - text: "شَمَالِيَّةُ المَنَاخِ تَنْعَكِسُ عَلَى سُلُوكِ السُّكَّانِ فِي تِلْكَ المَنَاطِقِ البَارِدَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "شَمَالِيَّةُ المَنَاخِ تَنْعَكِسُ عَلَى سُلُوكِ السُّكَّانِ فِي تِلْكَ المَنَاطِقِ البَارِدَةِ."

stage5_enrichment:
  per_entry:
    - lemma: "شَمَالِيَّة"
      entry_id: "{auto}"
      root: "شمل"
      maqayis_quote: "«الشِّينُ وَالْمِيمُ وَاللَّامُ أَصْلَانِ مُنْقَاسَانِ مُطَّرِدَانِ... وَالْأَصْلُ الثَّانِي يَدُلُّ عَلَى الْجَانِبِ الَّذِي يُخَالِفُ الْيَمِينَ. مِنْ ذَلِكَ: الْيَدُ الشِّمَالُ، وَمِنْهُ الرِّيحُ الشِّمَالُ لِأَنَّهَا تَأْتِي عَنْ شِمَالِ الْقِبْلَةِ...»"
  per_sense:
    - lemma: "شَمَالِيَّة"
      sense_id: "{auto}"
      nuance: "تصف (شَمَالِيَّة) الخاصية أو الصفة المجردة المرتبطة بالجهة، بخلاف (شَمَال) الذي هو اسم للجهة ذاتها."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"شمل","maqayis":"«الشِّينُ وَالْمِيمُ وَاللَّامُ أَصْلَانِ مُنْقَاسَانِ مُطَّرِدَانِ... الثَّانِي يَدُلُّ عَلَى الْجَانِبِ الَّذِي يُخَالِفُ الْيَمِينَ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تصف (شَمَالِيَّة) الخاصية أو الصفة المجردة المرتبطة بالجهة، بخلاف (شَمَال) الذي هو اسم للجهة ذاتها.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
