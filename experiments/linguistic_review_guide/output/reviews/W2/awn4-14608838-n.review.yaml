        key: note
        value: '{"root":"وقد","maqayis":"«الْوَاوُ وَالْقَافُ وَالدَّالُ: كَلِمَةٌ تَدُلُّ عَلَى اشْتِعَالِ نَارٍ. وَقَدَتِ النَّارُ تَقِدُ وَاتَّقَدَتْ وَتَوَقَّدَتْ... وَالْوَقُودُ: الْحَطَبُ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
