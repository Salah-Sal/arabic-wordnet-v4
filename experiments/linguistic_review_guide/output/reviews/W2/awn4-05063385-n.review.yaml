# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «حيوية» بدون تشكيل وتحتاج إلى ضبط كامل بالحركات"
      - "«حيوية» تُرجمت في أغلب المعاجم المتخصصة إلى vitality لا viability، وهما مفهومان مختلفان؛ فـvitality تعني النشاط والطاقة الحيوية، وviability تعني القدرة على النمو والاستمرار — وقد أُلبسَ أحدهما لباسَ الآخر في الاصطلاح العربي"
      - "«قابلية الحياة» تعبير وصفي مركّب (تركيب إضافي) وليس مصطلحاً مفرداً مُسكَّكاً في المعجم"
      - "لا توجد في المجموعة لمّة عربية مفردة أصيلة واضحة الإحالة على viability البيولوجية بمعزل عن vitality"
    observations: >
      المجموعة الترادفية تُحيل على مفهوم "viability" البيولوجي، وهو قدرة الكائن الحي
      على النمو والتطور الطبيعي دون تدخل خارجي. والمفهوم مغاير تماماً لـ"vitality"
      الذي يعني طاقة الحياة ونشاطها. يكشف الاستقراء المعجمي عن ثلاثة مسالك في التعبير
      العربي عن viability: (١) استخدام «حيوية» نقلاً من حقل vitality مع قبول التداخل
      الدلالي — وهو الغالب في المعاجم الموحدة الحديثة؛ (٢) التركيب الإضافي «قابلية الحياة»
      أو «قابلية البقاء» — وهو أوضح في الإحالة على viability؛ (٣) المصطلح الطبي
      «عيوشية» المشتق من جذر عيش، وهو موثَّق في المعجم الطبي الموحد (2009) للدلالة على
      قابلية الحياة بعد الولادة تحديداً. الفجوة المعجمية واضحة، إذ تفتقر العربية إلى
      مصطلح مفرد ثابت ومقبول على نطاق واسع لهذا المفهوم البيولوجي الدقيق.

  blind_candidates:
    - lemma: "صَلَاحِيَّة الحَيَاة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «صَلَاحِيَّة» (الاستعداد والأهلية، من صَلَحَ خلاف فسد)
        و«الحَيَاة». والصلاحية في الاستعمال العلمي الحديث تعني الملاءمة والأهلية للشيء
        — كما في «صلاحية البذور» و«صلاحية المشروع» — وهو ما يُناسب الدلالة على
        قابلية الكائن للحياة الطبيعية.

    - lemma: "نَمَائِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بالمصدر الصناعي (-ية) من «نَمَاء» (الزيادة والنمو). الوزن
        المصدري الصناعي منتج في المصطلح العلمي الحديث (كالفاعلية والحرارية والكيميائية).
        تدل «نمائية» على خاصية النمو والتزايد كسمة ذاتية للكائن الحي — وهو لبّ
        مفهوم viability.

    - lemma: "حَيَاتِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «حَيَاة» + (-ية)، يدل على الخاصية الجوهرية المرتبطة بالحياة؛
        على القياس الاشتقاقي ذاته لـ«وجودية» و«مادية» و«روحانية». يُتوقع أن يُعبّر
        عن الطابع الحيوي المميز للكائن القادر على الحياة الكاملة.

    - lemma: "قَابِلِيَّة النَّمَاء"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «قَابِلِيَّة» (الاستعداد لقبول الشيء، من قَبِلَ) و«النَّمَاء»
        (الزيادة والنمو). يُحكم التعبير عن استعداد الكائن لمواصلة النمو الطبيعي — وهو
        التعريف البيولوجي الدقيق لـ viability — مع التمييز الواضح عن vitality.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "حيوية"
      confirm:
        - text: "«حيوية» [translation_en: viability, domain: AGROVOC]"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«حيوية، قابلية الحياة، قدرة على البقاء» [translation_en: viability] — مقياس عدد الأفراد الأحياء من أحد الأصناف ذات النمط الظاهريّ الخاص بالنسبة إلى الأحياء من صنف آخر يعتبر صنفا معياريا وتحت ظروف بيئية معينة."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
      contradicts:
        - text: "«حيوية» [translation_en: vitality, domain: Biology]"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "يُقابل الكلمة بـ vitality لا viability، وهما مفهومان متمايزان في البيولوجيا"
        - text: "«حَيَوِيَّة» [translation_en: vitality, domain: The Unified Medical Dictionary]"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "يُقابلها بـ vitality في السياق الطبي، مما يُرسّخ التداخل الاصطلاحي"
        - text: "«حيوية» [translation_en: vitality, domain: Education / Sociology and Anthropology]"
          source: "مسرد التربية / مسرد علم الاجتماع — المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "يُقابلها بـ vitality في حقلَي التربية والاجتماع"
        - text: "«حيوية» [translation_en: biosis] — 1- مظاهر الحياة. 2- لاحقة تعني أسلوب الحياة."
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          conflict: "يُقابلها بـ biosis ويُعرّفها تعريفاً أوسع من viability"
      expands:
        - text: "«(1) الحيويّة: القدرة على الحياة والنَّماء. النَّشاط. (2) القدرة على البقاء.» [translation_en: vitality]"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن «الحيوية» في الاستخدام الثنائي المعاصر تجمع بين معنيَي viability (القدرة على الحياة والنماء) وvitality (النشاط)، مما يؤكد التداخل الدلالي الموثَّق"
        - text: "«حَيَوِيَّة» [entry in Al-Mujam Al-Kabeer] — مَصالح حيَوِيَّة intérêts vitaux: اصطلاحٌ يُشِيرُ إلى ما تعتبِرُه الدَّوْلة مُؤثرًا على بقائها وكيانها ذاته."
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "يُثبت استخدام الجذر ح-ي-و في سياق البقاء والاستمرار الوجودي، مما يدعم الإيحاء الدلالي بـ viability"

    - lemma: "قابلية الحياة"
      confirm:
        - text: "«حيوية، قابلية الحياة، قدرة على البقاء» = viability — مقياس عدد الأفراد الأحياء من أحد الأصناف ذات النمط الظاهريّ الخاص..."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«(1) قابلٌ للحياة أو للنُّمُوّ. (2) قابلٌ للحياة خارجَ الرَّحِم؛ عَيّاش a viable fetus. (3) قابلٌ للنجاح أو للتطبيق: عَمَليّ.» [translation_en: viable]"
          source: "المورد الحديث (2008)"
        - text: "«بكتيريا قابلة للنمو» [translation_en: bacteria, viable (pl.), domain: Water Engineering]"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«أصغر مجموعة قابلة للحياة» [translation_en: minimum viable population, domain: Climate, Environment]"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — المنظمة العربية للتربية والثقافة والعلوم"

    - lemma: "صَلَاحِيَّة الحَيَاة"
      evidence_status: "no_material_found"

    - lemma: "نَمَائِيَّة"
      evidence_status: "no_material_found"

    - lemma: "حَيَاتِيَّة"
      contradicts:
        - text: "«الحَيَاتِيَّة (في الفلسفة) animism: مذهب الفلسفيين، وهو مَذْهَبٌ يردُّ الحياة والحركة إلى قُوَّةٍ باطنة»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "«الحياتية» محجوزة اصطلاحياً في الفلسفة للدلالة على المذهب الحيواني (animism)، وليس على viability"

    - lemma: "قَابِلِيَّة النَّمَاء"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حيوية"
      decision: confirmed
      decision_reason: >
        رغم التداخل الدلالي مع vitality، فإن «حيوية» موثَّقة صراحةً بمقابل viability في
        AGROVOC (مرجع دولي في المصطلح الزراعي) وفي معجم الوراثة (2009) كأول مرادف
        ثلاثي للمصطلح. ويدعم المورد الحديث (2008) استخدامها بمعنى «القدرة على الحياة
        والنماء» في تعريف vitality — مما يؤكد التداخل المقبول في اللغة العلمية العربية.
        تُبقى في المجموعة مع تصحيح التشكيل وتوثيق التمييز الدلالي عن قابلية الحياة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      borrowing_check:
        loanword: false
        calque: false
        terminological_fit: "مشتق عربي أصيل من ح-ي-و/ي، الوزن الصرفي فَعَلِيَّة يناسب الصفة المنسوبة المجردة"
      morphological_fit: "مناسب — فَعَلِيَّة من أوزان المصادر الصناعية للمفاهيم المجردة"
      nuance_differentiation: >
        تغلب دلالة «حيوية» على السياقات البيولوجية والزراعية الشاملة، وتنطوي على
        إيحاء بالنشاط الحيوي والطاقة الداخلية — مما يجعلها أقرب إلى الوصف النوعي
        للكائن الحي. بالمقابل تتمحور «قابلية الحياة» حول القدرة الوظيفية الخاصة
        بالنمو والاستمرار في سياق بيئي محدد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَيَوِيَّة"

    - lemma: "قابلية الحياة"
      decision: confirmed
      decision_reason: >
        موثَّقة في معجم الوراثة (2009) كمرادف مباشر لـ viability في السياق الجيني
        البيولوجي، وفي المورد الحديث لـ viable، وفي المعجم البيئي لـ minimum viable
        population. هي التركيب الأوضح في الإحالة المباشرة على المفهوم دون التباس
        مع vitality. والتركيب الإضافي مُسكَّك في الاستخدام المعجمي المتخصص.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      mwe_validity: >
        اختبار السك: «قابلية الحياة» ≠ «قابلية الوجود» — لا يمكن إبدال «الحياة»
        بمرادف مع بقاء المصطلح صالحاً في السياق البيولوجي، مما يُثبت الثبات المعجمي.
        اختبار التثبيت: مُسجَّل في ثلاثة معاجم متخصصة مستقلة.
      nuance_differentiation: >
        أكثر تحديداً من «حيوية» في الإحالة على viability؛ يُصرّح بعنصر «الحياة»
        كمفهوم مقصود مباشر، ويُستخدم في السياقات الجينية والبيئية للتعبير عن
        إمكانية بقاء الكائن ونموه في ظروف بيئية معيَّنة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّة الحَيَاة"

    - lemma: "صَلَاحِيَّة الحَيَاة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد التركيب «صلاحية الحياة» مستقلاً في أي معجم. والمستخدَم فعلاً في
        السياق الزراعي هو «صلاحية البذور» (seed viability) — وهو أخص دلالةً من
        المفهوم العام للمجموعة. لا دليل على تثبيت هذا التركيب بوصفه وحدة معجمية.

    - lemma: "نَمَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود للمصطلح في قاعدة البيانات المعجمية. وإن كان الاشتقاق قياسياً من
        «نماء»، فإن غياب التثبيت المعجمي يحول دون إدراجه في الشبكة الدلالية.

    - lemma: "حَيَاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الحياتية» محجوزة في المعجم العربي الحديث (المعجم الكبير لمجمع اللغة العربية)
        للدلالة على مذهب الحيوانية الفلسفي (animism)، وهو مناقض تماماً للمفهوم المطلوب.
        استخدامها في هذه المجموعة يُفضي إلى اشتراك لفظي مُلبِّس.

    - lemma: "قَابِلِيَّة النَّمَاء"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود للتركيب في المعاجم. وإن كانت الدلالة مقبولة، فالمعاجم المتخصصة
        تُفضّل «قابلية الحياة» على «قابلية النماء» للتعبير عن viability، مما يدل
        على عدم استقرار هذا التركيب.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "(للكائنات الحية) القدرة على النمو والتطور الطبيعي"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه لكنه يفتقر إلى البنية المعجمية السليمة:
        (أ) «للكائنات الحية» قيد في قوسين وليس جنساً قريباً صريحاً؛
        (ب) لا يُصرَّح بكون المفهوم خاصّيَّةً أو قدرةً نوعية تمييزية؛
        (ج) لا يُشير إلى السياق البيئي الذي تُقاس فيه هذه القدرة؛
        (د) أسلوبه أقرب إلى الترجمة الحرفية من الإنجليزية منه إلى أسلوب المعجم الوسيط.
