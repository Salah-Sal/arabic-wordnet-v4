stage1_review:
  assessment:
    concerns:
      - "التعريف العربي مترجم حرفياً من الإنجليزية وفيه ركاكة في الصياغة (تصبح فيها أنسجة الجسم وعائية)."
      - "اللمة 'توعي' تفتقر إلى التشكيل الكامل والصحيح، والصواب 'تَوَعٍّ'."
    observations: "المفهوم طبي متخصص (Vascularization)، وقد وُفقت المعاجم الطبية المعاصرة في نحت مصطلحات دقيقة له مثل 'تكون الأوعية' و'توعٍّ'."
  blind_candidates:
    - lemma: "التَّوَعِّي"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (و ع ي) على وزن التَّفَعُّل للدلالة على التدرج والصيرورة في اكتساب الأوعية الدموية."
    - lemma: "التَّوْعِيَةُ الدَّمَوِيَّةُ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن تزويد الأنسجة المستهدفة بالأوعية الدموية."
    - lemma: "تَشَكُّلُ الأَوْعِيَةِ"
      generation_method: tarkib
      justification: "مركب إضافي يشير بوضوح إلى عملية تشكل ونمو الأوعية في النسيج."
    - lemma: "التَّمَدُّدُ الوِعَائِيُّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن انتشار وامتداد الأوعية الدموية في الجسم."

stage2_evidence:
  per_lemma:
    - lemma: "تَكَوُّنُ الأَوْعِيَةِ"
      confirm:
        - text: "«تكون الأوعية : vascularization»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
    - lemma: "تَوَعٍّ"
      confirm:
        - text: "«تَوَعِّي؛تَكَوُّنُ الأَوعِيَة : vascularization»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "التَّوَعِّي"
      confirm:
        - text: "«تَوَعِّي؛تَكَوُّنُ الأَوعِيَة : vascularization»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "التَّوْعِيَةُ الدَّمَوِيَّةُ"
      evidence_status: "no_material_found"
    - lemma: "تَشَكُّلُ الأَوْعِيَةِ"
      evidence_status: "no_material_found"
    - lemma: "التَّمَدُّدُ الوِعَائِيُّ"
      contradicts:
        - text: "«تمدد وعائي : exangia - إصابة وعاء دموي بالتمدد.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          conflict: "يدل على حالة مرضية (تمدد الوعاء) وليس على عملية تكون الأوعية ونموها الطبيعي في الأنسجة."

stage3_analysis:
  per_lemma:
    - lemma: "تَكَوُّنُ الأَوْعِيَةِ"
      decision: confirmed
      decision_reason: "مصطلح طبي دقيق وموثق في المعاجم الطبية المتخصصة، يعبر بوضوح عن عملية إنشاء وتكوين الأوعية الدموية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَوُّنُ الأَوْعِيَةِ"
    - lemma: "تَوَعٍّ"
      decision: confirmed
      decision_reason: "مصطلح معتمد وموثق في المعاجم الطبية لترجمة vascularization. تم تصحيح الشكل الإملائي بإضافة التنوين عوضاً عن الياء في حالة النكرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَعٍّ"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "التَّوَعِّي"
    - lemma: "التَّوَعِّي"
      source: stage1
      decision: removed
      decision_reason: "تم إضافته كصيغة معرفة للمة المؤكدة (تَوَعٍّ)، ولا حاجة لإدراجه كمدخل منفصل."
    - lemma: "التَّوْعِيَةُ الدَّمَوِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: "غير موثق كمرادف للمصطلح الطبي، وقد يُحدث لبساً مع المعنى الشائع للتوعية (الإرشاد)."
    - lemma: "تَشَكُّلُ الأَوْعِيَةِ"
      source: stage1
      decision: removed
      decision_reason: "غير موثق اصطلاحياً في المعاجم المتخصصة، ولمة 'تكون الأوعية' الموثقة تغني عنه."
    - lemma: "التَّمَدُّدُ الوِعَائِيُّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح يدل على حالة مرضية (Exangia) متصلة بتمدد الأوعية الدموية، ولا يتطابق مع المفهوم الحالي."

stage4_content:
  definition:
    current: "العملية العضوية التي تصبح فيها أنسجة الجسم وعائية وتطور شعيرات دموية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحوي ركاكة في الصياغة بسبب الترجمة الحرفية، ويُفضل صياغة تعريف علمي بأسلوب عربي سليم ودقيق."
    authored:
      - type: terminological
        text: "عملية حيوية عضوية تتشكل فيها الأوعية الدموية والشعيرات داخل أنسجة الجسم وتتطور لتزويدها بالدم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية حيوية عضوية تتشكل فيها الأوعية الدموية والشعيرات داخل أنسجة الجسم وتتطور لتزويدها بالدم."
  examples:
    per_lemma:
      - lemma: "تَكَوُّنُ الأَوْعِيَةِ"
        examples:
          - text: "يلعب تَكَوُّنُ الأَوْعِيَةِ دوراً حيوياً في التئام الجروح وتجديد الأنسجة المتضررة."
            type: usage
      - lemma: "تَوَعٍّ"
        examples:
          - text: "يُعد تَوَعِّي الطُّعْمِ مؤشراً إيجابياً لنجاح العملية الجراحية وتقبل الجسم له."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يلعب تَكَوُّنُ الأَوْعِيَةِ دوراً حيوياً في التئام الجروح وتجديد الأنسجة المتضررة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعد تَوَعِّي الطُّعْمِ مؤشراً إيجابياً لنجاح العملية الجراحية وتقبل الجسم له."

