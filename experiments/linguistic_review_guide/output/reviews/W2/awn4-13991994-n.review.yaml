# ══════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد
# Stage 1: Review + Generate
# ══════════════════════════════════════════════════
stage1_review:

  # أ. توليد اللمّات المرشحة — قُرئ الملف المُقنَّع أوّلاً (لا لمّات مرئية)
  # الانطلاق من التعريف: «الحالة العرفية الراسخة (خاصة للمجتمع)»
  blind_candidates:
    - lemma: "هَيْئَة"
      generation_method: majaz
      justification: >
        من «هَيَأَ» بمعنى الكيفية الحاصلة — يُحيي المعنى القديم للكلمة بوصفها
        «الحال التي يكون عليها الشيء محسوسةً أو معقولة» (القاموس المحيط)،
        وتعبّر عن الهيئة العامة التي انتظم عليها المجتمع. فيها مجاز وظيفي
        من الشكل الظاهر إلى الحالة الكُلِّية.

    - lemma: "تَرَاتُب"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن تَفَاعُل من جذر «رتب»، يفيد الانتظام المتسلسل المتبادل.
        يُلمح إلى هيكل الأحوال الراسخة المتمايزة درجاتٍ في المجتمع.
        الوزن تَفَاعُل يناسب التشارك والاستمرار في الترتيب.

    - lemma: "سِيرَة"
      generation_method: majaz
      justification: >
        إحياء دلالي من «سارَ يَسِير»؛ فالسيرة عند ابن فارس «الطريقة في الشيء
        والسُّنة، لأنها تسير وتجري». في التراث العربي يُقال «سارَ على سِيرَةِ
        السَّلف» أي تبنّى أحوالهم العرفية الراسخة — مجاز تأثيري بين الجريان
        والثبات العرفي.

    - lemma: "قِوَام"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن فِعَال من «قام»؛ مقاييس اللغة: «القاف والواو والميم
        أصلان صحيحان أحدهما على انتصاب وعزم». المعجم الوسيط يُعرّفه: «قِوام
        الأمر: ما يقوم به». يُعبّر عن الدعامة الوجودية للمجتمع وما تقوم عليه
        أعرافه الراسخة.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  # اللمّة الموجودة: نظام (بدون تشكيل)
  assessment:
    concerns:
      - "اللمّة «نظام» مسجّلة بدون تشكيل — يجب تحديدها كـ نِظَام بتشكيل كامل"
      - >
        «نِظَام» واسع الدلالة جداً في الاستعمال المعاصر (نظام حاسوبي، نظام
        سياسي، نظام تعليمي)؛ وهذه المجموعة تخصّه بمعنى محدد هو «الحالة
        العرفية الراسخة للمجتمع»، مما يستدعي تعريفاً يُحكم الفصل
      - "التعريف العربي الحالي مقتضب ومترجَم بشكل شبه حرفي من الإنجليزية — يحتاج إلى صياغة معجمية أصيلة"
      - "المجموعة تحتوي لمّةً واحدةً فقط — قد تستوعب إضافة لمّة مرادفة كـ«عُرْف» أو «سُنَّة» إن ثبت الدليل"
    observations: >
      المجموعة تُعبّر عن مفهوم «النظام الاجتماعي القائم» (established social order)
      بوصفه حالةً عرفية راسخة لا مجرد ترتيب إداري. في الشاهد العربي اللسانيّ
      جذرُ «نظم» يدل على «تأليف شيء وضمّ بعضه إلى بعض» (ابن فارس)، وهو ما
      ينسجم مع الانتظام الاجتماعي الذي يجمع الأفراد على نسق واحد.
      المعاجم المتخصصة (ARABTERM) تُثبت «نظام اجتماعي» = social order،
      كما أن «نظام» ورد مقابلاً لـ order في مسرد الفلسفة وعلم الاجتماع.
      يبقى «نِظَام» الخيار الأنسب لكن بتشكيل كامل وتعريف يضبط المعنى المقصود.


# ══════════════════════════════════════════════════
# المرحلة ٢: جمع الأدلة
# Stage 2: Evidence Gathering
# ══════════════════════════════════════════════════
stage2_evidence:

  # ميزانية الاستعلامات المُنفَّذة:
  # Q1: مطابقة دقيقة دفعية (نظام + هيئة + تراتب + سيرة + قوام)
  # Q2: إثراء بالمعرّف (تعريفات + أمثلة) لـ entry_ids الرئيسية
  # Q3: مقاييس اللغة (dictionary_id=151) لجذور: نظم / سير / هيا / قوم / رتب
  # Q4: جسر إنجليزي (order + social order + custom)

  per_lemma:

    - lemma: "نِظَام"
      confirm:
        - text: >
            «(النظام) الخيطُ يُنظَم فيه اللؤلؤ وغيره والترتيبُ والاتساقُ
            ويُقال نظامُ الأمر قِوامُه وعِمادُه والطريقةُ يُقال ما زال على
            نظام واحد»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: >
            «النظام: بالكسر على وزن الكتاب
            (آراستكى وصلاح كار ومدار كار يعني كسيكه كاربدو راست شود)»
          source: "دستور العلماء للأحمدنكري (hawramani، كلاسيكي)"
        - text: >
            «نِظَام: الترتيب والإتساق، والخيط ينظم فيه اللؤلؤ وغيره،
            والطريقة والسيرة»
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
        - text: "نظام | EN: order | DOM: Educational and Computer Techniques"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية 1999 (ARABTERM)"
        - text: "نظام | EN: order | DOM: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس — المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
        - text: "نظام | EN: order | DOM: Sociology and Anthropology"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
        - text: "نظام اجتماعي | EN: social order | DOM: Commerce and Accounting"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة 1995 (ARABTERM)"
        - text: "نظام اجتماعي | EN: social order | DOM: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس — المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
      expands:
        - text: >
            «النون والظاء والميم: أصل يدل على تأليف شيء وتأليفه، ونظمتُ
            الخرزَ نظماً... والنظام: الخيط يجمع الخرز»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            يكشف ابن فارس أن جوهر الجذر «نظم» هو التأليف والجمع، مما يدعم
            إسقاطه على «النظام الاجتماعي» الذي يجمع أفراد المجتمع على نسق واحد
            بأعرافه الراسخة.

    - lemma: "هَيْئَة"
      confirm:
        - text: >
            «الهَيْئَة: الحالُ التى يكون عليها الشيء محسوسةً كانت أو معقولة»
          source: "المعجم الوسيط (ocr، حديث)"
        - text: >
            «الهَيْئَةُ، وتُكسَر: حالُ الشيءِ وكيفيَّتُه»
          source: "القاموس المحيط للفيروزآبادي (hawramani، كلاسيكي)"
        - text: >
            «(الهيئة) الحالُ التي يكون عليها الشيء محسوسةً كانت أو معقولة
            وفي التنزيل العزيز {وإذ تخلق من الطين كهيئة الطير بإذني}
            والشارةُ والجماعةُ من الناس يُعهَد إليها بعمل خاص»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani، حديث)"
      contradicts:
        - text: >
            «الهيئة: الحالة الظاهرة وتهيّأتُ للشيء أخذتُ له أهبتَه»
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani، كلاسيكي)"
          conflict: >
            "الهيئة" في المعاجم تنصبّ على الحالة الظاهرة المحسوسة أو المهيَّأة
            لغرض طارئ، بينما المجموعة تستدعي حالةً راسخة راسية تتوارثها الجماعة
            كعُرف — وهذا البُعد الزمني التراكمي الراسخ غائب عن «هيئة».
        - text: >
            «حال المتهيئ في ملبسه ونحوه»
          source: "كتاب العين للخليل (ocr، كلاسيكي)"
          conflict: >
            أصل الكلمة يدور حول الحال المظهرية للملبوسات والمظهر الجسدي،
            لا حول الأعراف الاجتماعية الراسخة.
        - text: >
            «الهاء والياء والألف كلمة تأتي وهاؤها زائدة»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          conflict: >
            ابن فارس لا يرى في «هيأ» جذراً أصيلاً ذا أصل دلالي راسخ، مما
            يُضعف الاستناد إليها في بناء مصطلح تقني.

    - lemma: "تَرَاتُب"
      contradicts:
        - text: >
            «تَراتُب | EN: hierarchy | نوع من التنظيم يتفرّع كالشجرة إلى عدة
            وحدات معيّنة كل منها "مُمتَلَكة" من قِبَل الوحدة ذات المستوى
            الأعلى التي تسبقها مباشرةً»
          source: "معجم مصطلحات المعلوماتية 2000 (ARABTERM)"
          conflict: >
            «تراتب» يُرادف "hierarchy" (التسلسل الهرمي) في المعاجم المتخصصة،
            وهو مختلف جوهرياً عن "established customary state" الذي لا يعني
            بالضرورة تدرجاً هرمياً.
        - text: >
            «تَرَاتَبَتِ الأشياءُ: جاء بعضُها في عَقِبِ بعض»
          source: "المعجم الكبير (ocr، حديث)"
          conflict: >
            الجذر يدل على التعاقب الترتيبي لا على الرسوخ العرفي في المجتمع.

    - lemma: "سِيرَة"
      expands:
        - text: >
            «السُّنَّةُ والطريقةُ. يُقال إنه لَحَسَنُ السيرة.
            الهيئةُ والحالةُ التي يكون عليها الإنسانُ وغيره.
            سيرةُ فلان: تاريخُ حياته»
          source: "المعجم الكبير (ocr، حديث)"
          addition: >
            «سيرة» تنطوي على معنى «الطريقة العرفية الموروثة» وهو قريب من
            الدلالة المقصودة، لكنها اتسعت في الاستعمال المعاصر لتعني
            السيرة الذاتية والتاريخ الشخصي.
        - text: >
            «السين والياء والراء أصل يدل على مضيٍّ وجريان... والسيرةُ:
            الطريقةُ في الشيء والسُّنة، لأنها تسير وتجري»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            ابن فارس يربط «السيرة» بالطريقة الجارية والسنة المتبعة،
            وهو أقرب إلى المعنى من الناحية اللغوية الأصيلة.
      contradicts:
        - text: "سيرة | EN: biography | DOM: Information and Communication"
          source: "مسرد الإعلام والتواصل — المنظمة العربية (ARABTERM)"
          conflict: >
            المعاجم المتخصصة الحديثة تُثبّت «سيرة» بمعنى biography فقط،
            وهذا تعارض صريح مع الاستخدام المقصود.

    - lemma: "قِوَام"
      expands:
        - text: >
            «قِوام كل شيء: عِمادُه ونظامُه.
            قِوام الأمر: ما يقوم به»
          source: "المعجم الوسيط (ocr، حديث)"
          addition: >
            «قِوَام» يعبّر عن الدعامة الوجودية وما يقوم عليه الشيء، وفيه
            صلة بمفهوم النظام الراسخ من حيث إنه «ما تقوم عليه» أحوال المجتمع.
        - text: >
            «القوام: لما يقوم به الشيء أي يثبت كالعِماد والسِّناد لما
            يُعمَد ويُسنَد به»
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani، كلاسيكي)"
          addition: >
            يكشف أن «قِوَام» يدور حول الثبات والاستناد — وهو بُعد صحيح
            لكنه يُعبّر عن الدعامة لا عن الحالة العرفية بذاتها.
      contradicts:
        - text: >
            «القُوَام: داءٌ يأخذ الدابةَ في قوائمها تحاول أن تقوم فلا تنبعث»
          source: "المعجم الوسيط (ocr، حديث)"
          conflict: >
            صيغة القُوَام (بالضم) تحمل معنى المرض، مما يُوجب الحرص على
            تحديد الضبط (قِوَام بالكسر) وتوثيقه بتشكيل صريح.


# ══════════════════════════════════════════════════
# المرحلة ٣: التحليل اللغوي للّمات
# Stage 3: Lemma Analysis
# ══════════════════════════════════════════════════
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "نظام"
      decision: confirmed
      decision_reason: >
        الأدلة وفيرة ومتقاطعة: المعاجم الكلاسيكية والحديثة تُثبت «نظام» بمعنى
        الترتيب والاتساق والطريقة، وARATERMتُثبته ترجمةً رسمية لـ order في مسارد
        الفلسفة وعلم الاجتماع والتقنيات التربوية، فضلاً عن «نظام اجتماعي» = social
        order. الجذر «نظم» عند ابن فارس يدل على التأليف والجمع بما يُسنِد المعنى
        الاجتماعي الراسخ. يُحتفظ باللمّة مع تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        نِظَام في هذه المجموعة يُبرز البُعد البنيوي الانتظامي للحالة العرفية:
        أي ما يُؤلِّف المجتمع ويجمع أفراده على نسق ثابت من الأعراف والقيم،
        كما يجمع الخيطُ الخرزَ. يختلف عن «حال» (الأعم والأقل استمراراً)
        وعن «عُرف» (المحدود بالتقليد السلوكي دون البُعد التنظيمي الشامل).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَام"

    # ── مرشحات المرحلة ١ ──
    - lemma: "هَيْئَة"
      source: stage1
      decision: removed
      decision_reason: >
        «هيئة» تعني الحالَ الظاهرة المحسوسة أو الحالة الآنية للمتهيئ للشيء؛
        يغيب عنها البُعد الزمني الراسخ التوارثي الذي يُميّز «الحالة العرفية
        الراسخة». كما أن ابن فارس اعتبر «هيأ» جذراً غير أصيل. يستعمل المعنى
        المؤسسي الحديث «هيئة» بمعنى Committee/Board، فيُضيف اشتراكاً لفظياً
        يُعيق الاستخدام المصطلحي.

    - lemma: "تَرَاتُب"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم المتخصصة ثبّتت «تراتب» ترجمةً لـ hierarchy (التسلسل الهرمي)
        وليس لـ established order. المفهومان مختلفان: الهرمية تعني تدرجاً رأسياً
        بالسلطة، أما «الحالة العرفية الراسخة» فهي حالة أفقية مجتمعية شاملة.
        وبناء تَفَاعُل يفيد التشارك لا الثبات الراسخ.

    - lemma: "سِيرَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «سيرة» تحمل في أصلها معنى «الطريقة والسُّنة الجارية» (ابن فارس)،
        فإن الاستعمال المعاصر الراسخ يربطها حصراً بـ biography وتاريخ الحياة
        الشخصية — وهو ما تُثبته المعاجم المتخصصة (ARABTERM) صراحةً. اختيارها
        سيُوقع الباحثين في لبس مع سياق السيرة الذاتية.

    - lemma: "قِوَام"
      source: stage1
      decision: removed
      decision_reason: >
        «قِوَام» يعبّر عن الدعامة والركيزة التي «يقوم بها» الشيء، لا عن
        الحالة العرفية الراسخة ذاتها. الفرق دقيق لكن جوهري: القِوَام هو السبب
        الوجودي/الركيزة، بينما «النظام الاجتماعي الراسخ» هو الحالة الناجمة
        عن ذلك الرسوخ. فضلاً عن أن «قِوَام» يُستخدم في ARABTERM بمعنى
        consistency وtexture في العلوم الطبيعية.


# ══════════════════════════════════════════════════
# المرحلة ٤: التعريف والأمثلة
# Stage 4: Definitions & Examples
# ══════════════════════════════════════════════════
stage4_content:

  definition:
    current: "الحالة العرفية الراسخة (خاصة للمجتمع)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي قريب من ترجمة حرفية للإنجليزية «established customary state»؛
        يفتقر إلى الجنس القريب الواضح، ولا يُبيّن آليةَ الرسوخ ولا صلةَ النظام
        بما يُؤلّف شؤون المجتمع. أسلوب المعجم الوسيط يستدعي جملةً تعريفية أكثر
        إحكاماً، مع ذكر الأعراف والتقاليد صراحةً.
    authored:
      - type: terminological
        text: >
          الحالُ الاجتماعية الراسخة: مجموعةُ الأعراف والأنماط السلوكية الثابتة
          التي انتظمت عليها الجماعةُ وتوارثتها جيلاً بعد جيل، وتُحدِّد هيكلَ
          العلاقات ومسارَ الشؤون العامة في المجتمع.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          ما رسخ من طرائق المجتمع وأعرافه الموروثة التي تسير عليها الجماعةُ
          في شؤون معاشها وعلاقاتها، ويُعدّ الإخلالُ به اضطراباً لكيانها.
