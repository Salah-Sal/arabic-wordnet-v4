# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15321597-n
# المفهوم: ذلك الوقت؛ تلك اللحظة (that time; that moment)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (آنذاك، حينئذ) بلا تشكيل — يجب إضافة تشكيل كامل"
      - "كلتا اللمّتين ظرف مركب لا اسم جامد، والتصنيف (n) قد لا يناسبهما صرفياً لكنه مقبول في إطار WordNet"
    observations: "المفهوم يعبّر عن الإشارة الزمنية إلى وقتٍ ماضٍ بعينه. العربية غنية بصيغ الظروف المركبة من اسم زمان + أداة إشارة (إذ/ذاك)، مثل: حينئذٍ، آنذاك، يومئذٍ، وقتئذٍ، ساعتئذٍ. المجموعة الترادفية تحتاج إلى التمييز بين الظروف العامة (التي تشير إلى أي وقت ماضٍ) والظروف المخصصة (التي تشير إلى يوم أو ساعة بعينها)."
  blind_candidates:
    - lemma: "حِينَذَاكَ"
      generation_method: tarkib
      justification: "مركب إضافي من (حين) + اسم الإشارة (ذاك)، يؤدي نفس معنى «في ذلك الوقت». صيغة مستعملة في العربية المعاصرة بديلاً عن حينئذٍ."
    - lemma: "وَقْتَئِذٍ"
      generation_method: tarkib
      justification: "مركب من (وقت) + (إذ) على قياس حينئذٍ ويومئذٍ، لكنه أقل شيوعاً ويحتاج إلى تثبّت معجمي."
    - lemma: "يَوْمَئِذٍ"
      generation_method: tarkib
      justification: "مركب من (يوم) + (إذ)، واسع الاستعمال في القرآن والحديث والنثر الفصيح، لكنه قد يختصّ بالإشارة إلى اليوم لا الوقت المطلق."
    - lemma: "سَاعَتَئِذٍ"
      generation_method: tarkib
      justification: "مركب من (ساعة) + (إذ)، ذكره الخليل بن أحمد في العين. يختصّ بالإشارة إلى الساعة أو اللحظة المعيّنة."

stage2_evidence:
  per_lemma:
    - lemma: "آنَذَاكَ"
      confirm:
        - text: "«(1) آنئذٍ؛ آنذاك (2) بعدئذٍ (3) ثُمَّ ... (7) ذلك الحين till then»"
          source: "المورد الحديث (2008)"
        - text: "«إذ ذاك الوقت: حينئذ، آنذاك»"
          source: "تكملة المعاجم العربية لدوزي"

    - lemma: "حِينَئِذٍ"
      confirm:
        - text: "«الحِينُ: الوقت. يقال: حينئذ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«الحِينُ الوقت يقال حينئذٍ، وربّما أدخلوا عليه التاء فقالوا: تَحِينَ بمعنى حين»"
          source: "مختار الصحاح للرازي"
        - text: "«قوله تعالى: {حِينَئِذٍ}. الحِينُ: الوَقْتُ... أُضِيف إلى إذ، ومعناه: تبعيد قولك الآن للوقت الذي أنتَ فيه»"
          source: "المجموع المغيث لأبي موسى المديني"
      expands:
        - text: "«الحِينُ: الدهرُ، وقيل: وقت من الدهر مبهم يصلح لجميع الأزمان كلها، طالت أو قَصُرَت»"
          source: "لسان العرب لابن منظور"
          addition: "حين مبهم يصلح للقليل والكثير من الزمان"

    - lemma: "حِينَذَاكَ"
      confirm:
        - text: "«حينذاك [كلمة وظيفيَّة]: ظرف مركّب من (حين) دخلت عليه (ذاك) للإشارة إلى المفرد المذكّر، معناه في ذلك الوقت أو آنذاك أو حينئذٍ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"

    - lemma: "وَقْتَئِذٍ"
      evidence_status: "no_material_found"

    - lemma: "يَوْمَئِذٍ"
      confirm:
        - text: "«إِذْ: تكون لما مضى... تضاف للزمان فتجر وتنونه مثل يومئذ وساعتئذ»"
          source: "كتاب العين للخليل بن أحمد"
      contradicts:
        - text: "«اليَوْمُ: مقداره من طلوع الشمس إلى غروبها»"
          source: "كتاب العين للخليل بن أحمد"
          conflict: "يومئذٍ يختصّ بالإشارة إلى يوم بعينه لا إلى وقت مطلق، فهو أخصّ من دلالة المجموعة"

    - lemma: "سَاعَتَئِذٍ"
      confirm:
        - text: "«إِذْ: تكون لما مضى... تضاف للزمان فتجر وتنونه مثل يومئذ وساعتئذ»"
          source: "كتاب العين للخليل بن أحمد"
      contradicts:
        - text: "«الساعة: جزء من أجزاء الزمان»"
          source: "عامّ"
          conflict: "ساعتئذٍ يختصّ بالإشارة إلى ساعة أو لحظة محددة، وهو أخصّ من المفهوم العام (ذلك الوقت)"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "آنَذَاكَ"
      decision: confirmed
      decision_reason: "ظرف مركب مثبت في المعاجم الحديثة (المورد الحديث، دوزي) بمعنى «في ذلك الوقت»، يطابق تعريف المجموعة تماماً. مشكّل تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "صيغة حديثة الشيوع تستعمل في النثر الصحفي والأدبي المعاصر، مركبة من (آنَ) الدالة على الوقت الحاضر + اسم الإشارة (ذاك) للتبعيد"
      actions:
        - command: update_lemma
