            entry_id: "{auto}"
            new_lemma: "آنَذَاكَ"

    - lemma: "حِينَئِذٍ"
      decision: confirmed
      decision_reason: "ظرف مركب ثابت في المعاجم الكلاسيكية والحديثة (الجوهري، الرازي، أبو موسى المديني) بمعنى «في ذلك الوقت»، واسع الاستعمال في الفصحى قديماً وحديثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الصيغة الكلاسيكية الأصيلة، مركبة من (حين) + (إذ) المنوّنة، أكثر فصاحة وقدماً من آنذاك، وتغلب في السياقات الرسمية والدينية والأدبية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِينَئِذٍ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "حِينَذَاكَ"
      source: stage1
      decision: confirmed
      decision_reason: "مثبت في معجم اللغة العربية المعاصرة لأحمد مختار عمر بوصفه كلمة وظيفية بمعنى «في ذلك الوقت أو آنذاك أو حينئذٍ». يجمع بين عنصر (حين) الكلاسيكي وأداة الإشارة (ذاك) الأكثر شيوعاً في الاستعمال المعاصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "صيغة وسطى تجمع بين (حين) الكلاسيكية و(ذاك) العامية التوزيع، أقل رسمية من حينئذٍ وأقل حداثة من آنذاك"
      actions:
        - command: create_entry
          params: {lemma: "حِينَذَاكَ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "وَقْتَئِذٍ"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي عليه كمدخل مستقل. وإن كان قياسياً على يومئذٍ وحينئذٍ، فإنه لم يثبت في أي معجم كلاسيكي أو حديث."

    - lemma: "يَوْمَئِذٍ"
      source: stage1
      decision: removed
      decision_reason: "يومئذٍ يختصّ بالإشارة إلى يوم بعينه (on that day)، وليس إلى وقت مطلق (that time/moment). دلالته أخصّ من دلالة المجموعة. ينتمي إلى مجموعة ترادفية مختلفة."

    - lemma: "سَاعَتَئِذٍ"
      source: stage1
      decision: removed
      decision_reason: "ذُكر في كتاب العين لكنه يختصّ بالإشارة إلى ساعة أو لحظة محددة (at that hour)، وهو أخصّ من المفهوم العام. كما أنه نادر الاستعمال في النصوص."

