      generation_method: majaz
      justification: "مجاز من المتن (ما صلب من الأرض وارتفع) إلى النصّ الأصلي للكتاب أو الحديث؛ استعارة مكرّسة في التراث الحديثي والأدبي"
    - lemma: "فَحْوَى"
      generation_method: ishtiqaq
      justification: "من الجذر «فحو» على وزن فَعْلَى، تدلّ على مضمون الكلام وما يُفهم منه؛ مستعملة في الفصحى المعاصرة"
    - lemma: "صُلْب الْمَوْضُوع"
      generation_method: tarkib
      justification: "تركيب إضافي ثابت يعني جوهر الموضوع ولبّه، شائع في الاستعمال المعاصر"
    - lemma: "لُبّ"
      generation_method: majaz
      justification: "مجاز من اللبّ (جوف الشيء وخالصه) إلى المعنى الأساسي للخطاب؛ يُقال «لبّ المسألة» بمعنى جوهرها"


