    observations: "المجموعة تشير إلى المضمون الجوهري لأيّ خطاب أو تواصل، أي ما يقصده المتكلّم أو الكاتب أصالةً. اللمّتان الموجودتان تمثّلان مستويين: «متن» مصطلح تراثي حديثي-أدبي، و«صلب الموضوع» تعبير إضافي حديث الشيوع. المفهوم قريب من «فحوى» و«مضمون» و«لُبّ» لكنّ كلّاً منها يحمل فارقاً دلالياً."

  blind_candidates:
