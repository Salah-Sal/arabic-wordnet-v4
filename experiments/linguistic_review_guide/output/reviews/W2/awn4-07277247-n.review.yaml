# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (مؤشر) مكتوبة دون تشكيل كامل"
      - "التعريف العربي 'إشارة لجذب الانتباه' مقتضب ومحاكٍ للإنجليزية دون تفصيل دلالي بأسلوب المعجم الوسيط"
      - "لفظ 'مؤشر' في الاستعمال المعاصر يغلب عليه معنى الدليل الإحصائي والاقتصادي (مؤشر الأسهم، المؤشرات الاقتصادية) قد يُفضي إلى التباس مع المعنى التقني المقصود هنا"
      - "المجموعة أحادية اللمّة؛ لا يوجد شاهد على التمييز الدلالي بين لمّاتٍ متعددة"
    observations: >
      مجموعة أحادية اللمّة تقع تحت أبوة 'إشارة/علامة' (أي فعل أو إيماءة غير لفظية تشفر رسالة ما).
      الفصل النوعي للمجموعة هو كون الإشارة 'لجذب الانتباه' لا لنقل مضمون محدد.
      لفظ 'مُؤَشِّر' — إن ثبت أنه المقصود — مصاغٌ على وزن مُفَعِّل اسم فاعل من أَشَّرَ (ثلاثي مزيد بالتضعيف)،
      أو يمكن تأويله مشتقاً من أسرة الجذر (شور) التي تعني في أصلها إبداءَ شيء وإظهاره؛ وكلا التأويلين
      يلائمان معنى الإشارة التنبيهية. يستحق النظر أن لفظ 'مُشِير' (اسم فاعل أشار يشير) ورد في بعض المعاجم
      بمعنى 'من يُومئ بيده أو نحوها إلى غيره معبراً عن معنى من المعاني'، وهو أقرب صرفياً إلى
      'ما يُشير'، غير أن 'المُشِير' في الاستعمال السائد يُحيل على أعلى رتبة عسكرية فيُحدث
      التباساً. أُلاحظ أيضاً غياب أي مثال استعمالي في المجموعة.

  blind_candidates:
    - lemma: "تَنْبِيهٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (نبه) على وزن تَفْعِيل. دلالته على إيقاظ الذهن وجذب الانتباه وثيقة الصلة
        بتعريف المجموعة. مشتقات الجذر (نبه) — كالانتباه والتنبّه والمُنَبِّه — راسخة في الاستعمال
        للدلالة على عملية جذب الانتباه، مما يجعل 'تنبيه' المصدرَ الاصطلاحي الطبيعي لهذا المفهوم.

    - lemma: "إِيذَانٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (أذن) على وزن إِيفَال (إفعال)، إحياء لفظ ميت. يُستعمل كلاسيكياً للدلالة
        على إشارة أو إعلان مسبق يدعو إلى الانتباه قبيل وقوع شيء؛ أبرز نماذجه 'الأذان' الذي هو
        إشارة صوتية لجذب انتباه المصلين. اللفظ ميت في الاستعمال الاصطلاحي الحديث مما يُخلّصه
        من الاشتراك اللفظي مع المعاني الجديدة.

    - lemma: "لَمِيعٌ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من 'اللامع/المتوهج/البرّاق' إلى 'ما يلفت الانتباه ببريقه'. الإشارات التنبيهية
        غالباً ما تكون ضوئية متوهجة تُستوقف البصر؛ فـ'اللميع' يصف وظيفياً الشيءَ الذي يجذب
        الانتباه بسبب إشراقه. استُنفدت إمكانيات الاشتقاق والتركيب قبل اللجوء إلى هذا المجاز.

    - lemma: "نَبَّاهٌ"
      generation_method: ishtiqaq
      justification: >
        صيغة مبالغة على وزن فَعَّال من الجذر (نبه)، تُفيد شدة التنبيه وتكراره وقوته.
        يصف الإشارةَ التي تتكرر أو تشتدّ حتى تضمن جذب الانتباه لا محالة.
        الوزن مُنتِج في العربية للأدوات والأجهزة ذات الوظيفة المتكررة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُؤَشِّر"
      confirm:
        - text: "«ما يُشار به»"
          source: "المعجم الكبير (مجمع اللغة العربية، مصدر OCR)"
        - text: "«مؤشر — indicator [Commerce and Accounting]»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة 1995 (ARABTERM)"
        - text: "«مؤشر — indicator [Physics]»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية 1989 (ARABTERM)"
      expands:
        - text: "«كاشِف، مُؤَشِّر — مادة تحدث تغيراً مرئياً عند حصول تغير آخر غير مرئيّ»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية 2004 (ARABTERM)"
          addition: >
            يُفصح هذا التعريف التقني عن أن المُؤَشِّر هو ما يُظهر تغيراً خفياً ويجعله مرئياً،
            مما يعزز دلالة الجذر (شور = إبداء شيء وإظهاره) ويُبيّن وجه الاستخدام في
            سياق 'إشارة تنبيهية'.

    - lemma: "تَنْبِيهٌ"
      confirm:
        - text: "«التنبيه: إعلام ما في ضمير المتكلم للمخاطب»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
        - text: "«التَّنْبِيه: اعلام مَا فِي ضمير الْمُتَكَلّم للمخاطب. وَيُطلق أَيْضا على استحضار مَا سبق وانتظار مَا سَيَأْتِي»"
          source: "دستور العلماء للأحمدنكري (hawramani)"
      contradicts:
        - text: "«التنبيه: هو إعلام ما في ضمير المتكلِم المخاطَب»"
          source: "التعريفات الفقهية للبركتي (hawramani)"
          conflict: >
            التعريف الكلاسيكي لـ'تنبيه' يحصره في الإعلام اللفظي/الذهني ('إعلام ما في ضمير المتكلم')
            لا في الإشارة الحسية. بينما أبوة المجموعة المراجَعة تنصّ على 'أي فعل أو إيماءة
            غير لفظية'؛ مما يعني أن تنبيه يناقض طبيعة المجموعة من حيث كونه إعلاماً لفظياً.

    - lemma: "إِيذَانٌ"
      evidence_status: "no_material_found"

    - lemma: "لَمِيعٌ"
      evidence_status: "no_material_found"

    - lemma: "نَبَّاهٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُؤَشِّر"
      decision: confirmed
      decision_reason: >
        المعجم الكبير (OCR، أرقى مصادر القاعدة) يُثبّت اللمّة بتعريف 'ما يُشار به'، وهو الجنس الذي
        يتوافق مع تعريف المجموعة ('إشارة'). مقاييس اللغة لابن فارس يُرسي الجذر (شور) على معنى
        'إبداء شيء وإظهاره وعرضه'، وهو الأساس الدلالي لكلمة 'مؤشر' بمعنى ما يُظهر أمراً ويلفت
        إليه الانتباه. تستخدم معاجم ARABTERM اللمّة في مجالات تقنية متعددة بمعنى indicator.
        اللمّة صحيحة الاشتقاق، ولائقة صوتياً وصرفياً، وتحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ اشتقاقها من الجذر (شور = إبداء وإظهار) يُضفي عليها طابع
        التوجيه الإرشادي — أي أنها ليست مجرد علامة صامتة بل شيء يُشير ويُظهر الأمرَ مُحيلاً
        الانتباهَ نحوه، مما يُميّزها عن 'إشارة' (الأبوة الأعمّ) و'علامة' (الأبوة الأعمّ الموازية).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُؤَشِّر"

    - lemma: "تَنْبِيهٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة الكلاسيكية تُعرِّف 'التنبيه' بـ'إعلام ما في ضمير المتكلم للمخاطب'، وهو إعلام
        ذهني/لفظي لا إشارة حسية. أبوة المجموعة تنصّ صراحةً على 'أي فعل أو إيماءة غير لفظية'؛
        لذا فإن 'تنبيه' بدلالته الكلاسيكية يناقض طبيعة المجموعة. وفي الاستعمال المعاصر، 'تنبيه'
        يدل على الحدث الإخباري (notification) لا على الأداة/الإشارة (indicator)، فهو مفهوم
        مختلف يستحق مجموعة ترادفية مستقلة.

    - lemma: "إِيذَانٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على مادة معجمية في قاعدة البيانات. وإن كانت 'إيذان' لفظاً عربياً صحيحاً
        بمعنى 'الإعلان بشيء يوشك وقوعه'، إلا أن دلالتها تنحو نحو الإخبار المسبق والتهيئة
        لا نحو الإشارة الحسية المستدعية للانتباه. فضلاً عن ذلك، غياب الشواهد المعجمية يحول
        دون إثبات التثبيت المعجمي اللازم.

    - lemma: "لَمِيعٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على مادة معجمية ولا على شاهد تثبيت اصطلاحي. المجاز المقترح (من البريق
        إلى الإشارة التنبيهية) بعيد ولم تثبت الإزاحة الدلالية في الاستعمال. قاعدة 'اختبار
        التثبيت المعجمي' لا تُجيز هذا المركب.

    - lemma: "نَبَّاهٌ"
      source: stage1
      decision: removed
      decision_reason: >
        وزن فَعَّال يفيد الإنسان المكثار للفعل (صيغة مبالغة فاعلية)، لا الأداة أو الإشارة.
        لم يُعثر على تثبيت معجمي لاستخدام 'نباه' كمصطلح للإشارة أو الأداة التنبيهية.
        يختلف عن 'مُنَبِّه' (الذي ثبت في المعجم الوسيط بمعنى ساعة التنبيه) وعن 'تنبيه'
        (المصدر) في أنه لا يحمل دلالة اصطلاحية مستقرة مناسبة.


