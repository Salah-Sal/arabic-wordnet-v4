stage1_review:
  assessment:
    concerns:
      - "كلمة 'إيقاع' تدل غالباً على البنية الإيقاعية الكاملة (rhythm) وليس فقط النبضة الواحدة (beat)، لذا قد تكون فضفاضة قليلاً لهذا المفهوم المحدد."
      - "مصطلح 'زمن موسيقي' ترجمة حرفية دقيقة لـ 'musical time' لكنه أقل شيوعاً في الاستعمال الفني من 'الضربة' أو 'النبضة'."
    observations: "المفهوم يشير إلى الوحدات الزمنية المتكررة التي تشكل نبض الموسيقى. المصطلحات العربية الفنية تتراوح بين القديم (نقر، توقيع) والحديث (نبض، ضربة)."
  blind_candidates:
    - lemma: "نَبْضَة"
      generation_method: ishtiqaq
      justification: "اشتُق من النبض ليدل على المرة الواحدة من نبض الإيقاع، وهو مصطلح حديث دقيق."
    - lemma: "ضَرْبَة"
      generation_method: ishtiqaq
      justification: "المصطلح الأكثر شيوعاً في نظرية الموسيقى العربية للدلالة على 'المازورة' أو أجزاء الإيقاع (الضربة القوية والضعيفة)."
    - lemma: "نَقْرَة"
      generation_method: ishtiqaq
      justification: "مصطلح تراثي يعبر عن قرع الآلة الإيقاعية لتمثيل زمن واحد."
    - lemma: "تَوْقِيع"
      generation_method: majaz
      justification: "ورد في المعاجم القديمة بمعنى إيقاع الأصوات وتناسبها في الغناء، ويُستخدم للدلالة على ضبط الزمن."

stage2_evidence:
  per_lemma:
    - lemma: "إيقاع"
      confirm:
        - text: "«اتفاق الأصوات وتوقيعها في الغناء»"
          source: "المعجم الوسيط"
        - text: "«الرجع المطرد، في السلسلة المنطوقة، للانطباعيات السمعية المتماثلة»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "زمن موسيقي"
      confirm:
        - text: "«يضبط النغم أو الإيقاع (مو) beat time»"
          source: "المورد الحديث"
    - lemma: "نَبْضَة"
      confirm:
        - text: "«(مو) نبض الإيقاع الموسيقي»"
          source: "المعجم الوسيط (في تعريف النبض)"
        - text: "«Beat: ضربة، نقرة، نبضة»"
          source: "المورد الحديث"
    - lemma: "ضَرْبَة"
      confirm:
        - text: "«Beat: ضربة، نقرة، نبضة»"
          source: "المورد الحديث"
    - lemma: "نَقْرَة"
      confirm:
        - text: "«Beat: ضربة، نقرة، نبضة»"
          source: "المورد الحديث"
    - lemma: "تَوْقِيع"
      confirm:
        - text: "«اتفاق الأصوات وتوقيعها في الغناء»"
          source: "المعجم الوسيط"
        - text: "«قرع الطبول على التوقيع»"
          source: "تكملة المعاجم (دوزي)"

stage3_analysis:
  per_lemma:
    - lemma: "إيقاع"
      decision: confirmed
      decision_reason: "رغم اتساعه ليدل على الإيقاع ككل، إلا أنه يُستخدم في السياق العربي ليدل على الوحدة الزمنية المنتظمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيقَاع"
    - lemma: "زمن موسيقي"
      decision: confirmed
      decision_reason: "مصطلح تقني مطابق للمقابل الإنجليزي ومستخدم في المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَمَن مُوسِيقِيّ"
    - lemma: "نَبْضَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق يعبر عن الوحدة الواحدة من النبض الإيقاعي المستمر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَبْضَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ضَرْبَة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الفني السائد في علم الإيقاع العربي (الأوزان) للدلالة على الوحدة الزمنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ضَرْبَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَقْرَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي دقيق لا يزال مستخدماً في وصف الضربات الإيقاعية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَقْرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَوْقِيع"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معجمي قديم يربط بين الحركة الزمنية والأداء الصوتي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَوْقِيع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "(الموسيقى) نبض الإيقاع الموسيقي"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، يحتاج لتوضيح أنه الوحدة الزمنية المتكررة."
    authored:
      - type: terminological
        text: "الوحدة الزمنية الأساسية المتكررة التي تشكل نبض الإيقاع الموسيقي وتُقاس بها سرعة الأداء."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الوحدة الزمنية الأساسية المتكررة التي تشكل نبض الإيقاع الموسيقي وتُقاس بها سرعة الأداء."

  examples:
    per_lemma:
      - lemma: "إِيقَاع"
        examples:
          - text: "يُحافظ عازف الطبل على إيقاع الأغنية ثابتاً طوال العرض."
            type: usage
      - lemma: "زَمَن مُوسِيقِيّ"
        examples:
          - text: "تتغير سرعة الزمن الموسيقي في المقطوعة لتناسب الأجواء الدرامية."
            type: usage
      - lemma: "نَبْضَة"
        examples:
          - text: "يشعر المستمع بنبضة الإيقاع القوية في بداية كل مازورة."
            type: usage
      - lemma: "ضَرْبَة"
        examples:
          - text: "يعتمد الملحن على ضربة إيقاعية واحدة لتمثيل الزمن الأساسي."
            type: usage
      - lemma: "نَقْرَة"
        examples:
          - text: "كل نقرة على العود تُمثل وحدة زمنية في التوقيع الموسيقي."
            type: usage
      - lemma: "تَوْقِيع"
        examples:
          - text: "رقص المحتفلون على توقيع الطبول الرتيب."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "إِيقَاع"
      entry_id: "{auto}"
      root: "وقع"
      maqayis_quote: "«الْوَاوُ وَالْقَافُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَرْجِعُ إِلَيْهِ فُرُوعُهُ، يَدُلُّ عَلَى سُقُوطِ شَيْءٍ.»"
    - lemma: "زَمَن مُوسِيقِيّ"
      entry_id: "{auto}"
