# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-15313066-n (cycle / rhythm / round)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «إيقاع» في المعاجم العربية يُستعمل أصالةً في الأصوات والموسيقى (اتّفاق الأصوات وتوقيعها في الغناء)، وقد يكون امتداده إلى الفترة الزمنية المتكررة توسُّعاً مجازيّاً حديثاً"
      - "التعريف العربي الحالي مقبول لكنّه أقرب إلى ترجمة حرفية للتعريف الإنجليزي منه إلى أسلوب المعاجم العربية"
    observations: "المجموعة تدور حول مفهوم الفترة الزمنية التي تتعاقب فيها أحداث متكررة بنمطٍ منتظم. اللمّة «دَوْرَة» هي الأكثر مطابقةً لهذا المفهوم في الاستعمال المعجمي العربي الحديث والكلاسيكي، إذ تغطي الدورات الاقتصادية والبيولوجية والفيزيائية. أمّا «إيقاع» فمجاله الأصلي الموسيقى والنظم الصوتي، لكنّه توسّع في الاستعمال الحديث ليشمل الإيقاع البيولوجي ونحوه."

  blind_candidates:
    - lemma: "دَوْرَة"
      generation_method: ishtiqaq
      justification: "من الجذر (د-و-ر) على وزن فَعْلَة، تدلّ على المرّة الواحدة التي يدورها الشيء في زمن معيّن، وهي اللفظ الأكثر تداولاً للدلالة على cycle في العلوم والاقتصاد والطبّ"
    - lemma: "كَرَّة"
      generation_method: ishtiqaq
      justification: "من الجذر (ك-ر-ر) على وزن فَعْلَة، بمعنى الرجعة والعودة، وقد تُستعمل بمعنى المرّة في سياق التكرار"
    - lemma: "نَوْبَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ن-و-ب) على وزن فَعْلَة، بمعنى الدور والنصيب من الزمن، مشتقّة من المناوبة أي التعاقب"
    - lemma: "تَوَاتُر"
      generation_method: ishtiqaq
      justification: "من الجذر (و-ت-ر) على وزن تَفَاعُل، بمعنى تتابع الأشياء واحداً بعد واحد بانتظام، ويُستعمل حديثاً بمعنى التردّد (frequency) والتكرّر المنتظم"


stage2_evidence:
  per_lemma:
    - lemma: "إِيقَاع"
      confirm:
        - text: "«اتِّفاقُ الأصوات وتوقيعُها في الغناء»"
          source: "المعجم الوسيط"
        - text: "«تَعاقُبات متكررة لعناصر صوتية في النص تُخلِّف جرسا خاصا»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«الإيقاع هو الرجع المطرد، في السلسلة المنطوقة، للانطباعيات السمعية المتماثلة التي تخلقها عناصر تطريزية مختلفة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(4) التواتر: التكرّر النظاميّ للعمليات أو الأحداث»"
          source: "المورد الحديث (2008) — مدخل rhythm"
          addition: "يبيّن أنّ الإيقاع بمعنى التكرّر الزمني يُقابَل بالتواتر لا بالإيقاع في المورد الحديث"
        - text: "«إيقاع حيوي؛ إيقاع بيولوجي» = biological rhythm"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يُثبت استعمال إيقاع في السياق الزمني-البيولوجي لا الموسيقي فحسب"

    - lemma: "دَوْرَة"
      confirm:
        - text: "«المَرَّةُ الواحِدَةُ يَدُورُها الشَّىءُ فى زَمَنٍ مُعَيَّن, يُقال: دَورَةٌ أُسْبوعيَّة, أو شهريَّة, أو سنويَّة»"
          source: "المعجم الكبير"
        - text: "«في الغلاف الجوّ أو في المحيط الحيوي، تعبر الدورة عن تسلسل لأحداث في حركة متكررة حيث المخرجات النهائية تتحول إلى مغذات مرة أخرى»"
          source: "مسرد المناخ والبيئة (ALECSO)"
        - text: "«الدَّورةُ الاقتصاديَّةُ: تعاقبُ أزمنة الرَّخاء والفُتُور والتَّصْفِيةِ على المُجْتَمَع في المدَى القصير»"
          source: "المعجم الكبير"
      expands:
        - text: "«(الدورة) فِي الْمَكْرُوه الدائرة و(الدورة الدموية) دوران الدَّم فِي الْبدن...و(دورة الْمجْلس النيابي) مُدَّة انْعِقَاده»"
          source: "المعجم الوسيط (هوراماني)"
          addition: "الدورة تتعدّد معانيها لتشمل الدورة الدموية والزراعية والنيابية"

    - lemma: "كَرَّة"
      contradicts:
        - text: "«الكَرَّة: بالفتح المَرَّة والجملة في الحرب وعند المولّدين مائة ألف»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الكرّة في المعاجم تعني الحملة في الحرب أو الرجعة، لا الفترة الزمنية المتكررة"
        - text: "«(الكرة) الرّجْعَة والحملة فِي الْحَرْب والغداة والعشي»"
          source: "المعجم الوسيط (هوراماني)"
          conflict: "لا تحمل دلالة الفترة الزمنية الدورية بل الرجعة الحربية أو الرجعة المطلقة"

    - lemma: "نَوْبَة"
      contradicts:
        - text: "«اسم من المناوبة. يقال: جاءت نَوْبَتُه. النَّازلة. الفُرْصَة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "النوبة تدلّ على الدور أو النازلة لا على الفترة الزمنية المتكررة بذاتها"
        - text: "«النّوبة عند الأطباء هي زمان أخذ الحمّى»"
          source: "كشّاف اصطلاحات الفنون — التهانوي"
          conflict: "في الطبّ تعني وقت ظهور الحمّى (bout/seizure) لا الدورة الزمنية الكاملة"

    - lemma: "تَوَاتُر"
      confirm:
        - text: "«تَرداد عاديٌّ ومنتظر لظاهرة تتميز عن التَّكرار المحيل على نقص إخباري»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«معدل التكرار في واحدة الزمن — تَردُّد (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      contradicts:
        - text: "«التواتر لغة: تتابع الشيء فرادى، وعرفا: الخبر الثابت على ألسنة قوم يمتنع تواطؤهم على الكذب»"
          source: "التوقيف على مهمات التعاريف — المناوي"
          conflict: "في الاصطلاح الأصولي التواتر مصطلح حديثي يعني نقل الجماعة عن الجماعة، وهو بعيد عن الدلالة الزمنية"


stage3_analysis:
  per_lemma:
    - lemma: "إِيقَاع"
      decision: confirmed
      decision_reason: "رغم أنّ الدلالة الأصلية للإيقاع موسيقية وصوتية، فقد توسّع استعماله في العربية الحديثة ليشمل الإيقاع البيولوجي والإيقاع اليوماوي وإيقاع الحياة، وهو يقابل rhythm في الإنجليزية بمعنى النمط المتكرر. يبقى في المجموعة لتغطية هذا الجانب الدلالي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على النمط الانتظامي للتكرار (الإيقاع) أكثر من الفترة الزمنية نفسها، ويُستعمل حين يُراد التشديد على انتظام التعاقب وتناغمه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيقَاع"

    - lemma: "دَوْرَة"
      decision: confirmed
      decision_reason: "أقوى لمّة في المجموعة وأكثرها مطابقة للمفهوم. تُستعمل في عشرات المجالات العلمية والتقنية بمعنى cycle. المعاجم العربية تُعرّفها بأنّها المرّة الواحدة التي يدورها الشيء في زمن معيّن."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الفترة الزمنية الكاملة من بداية السلسلة إلى نهايتها ثم عودتها (cycle)، وتركّز على البُعد الزمني والاكتمال الدوري"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَوْرَة"

    - lemma: "دَوْرَة"
      source: stage1
      decision: removed
      decision_reason: "مطابقة للمّة الموجودة «دورة» — لا حاجة لتكرارها"

    - lemma: "كَرَّة"
      source: stage1
      decision: removed
      decision_reason: "الكرّة في المعاجم العربية تدلّ على الحملة في الحرب أو الرجعة المطلقة، ولا تحمل دلالة الفترة الزمنية المتكررة المنتظمة. الأدلة المعجمية تناقض هذا الاستعمال."

    - lemma: "نَوْبَة"
      source: stage1
      decision: removed
      decision_reason: "النوبة تدلّ على الدَّور والنصيب في المناوبة أو على النازلة الطبية (seizure)، وليست فترة زمنية تتكرّر فيها سلسلة أحداث. لا تصلح مرادفاً للدورة بالمعنى المطلوب."

    - lemma: "تَوَاتُر"
      source: stage1
      decision: removed
      decision_reason: "التواتر يدلّ على التكرّر والتردّد (frequency/recurrence) لا على الفترة الزمنية (interval) التي تقع فيها الأحداث المتكررة. المجموعة تُعرَّف بأنّها فترة (interval) لا تردّد، فضلاً عن أنّ التواتر مصطلح أصولي حديثي راسخ قد يُحدث لبساً."


