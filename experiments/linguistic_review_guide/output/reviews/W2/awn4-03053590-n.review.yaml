stage1_review:
  candidate_lemmas:
    - lemma: سَلَّاكَةُ المَرَاحِيضِ
      generation_method: ishtiqaq
      justification: "اشتقاق صيغة مبالغة (فعّالة) كاسم آلة من الجذر (سلك) للدلالة على أداة فتح المسالك، وتركيبها مع المراحيض للتخصيص."
    - lemma: سِلْكُ تَسْلِيكِ المَرَاحِيضِ
      generation_method: tarkib
      justification: "تركيب إضافي يصف الأداة (سلك) ووظيفتها (تسليك) ومجال عملها (المراحيض)."
    - lemma: مِثْقَبُ المَرَاحِيضِ
      generation_method: tarkib
      justification: "ترجمة وظيفية لـ (closet auger) باعتبار الأداة تعمل بعمل المثقب في اختراق السدود."
    - lemma: ثُعْبَانُ المَرَاحِيضِ
      generation_method: majaz
      justification: "نقل استعاري بناءً على المرونة والطول، وهو يقابل مصطلح (toilet snake)."
  concerns:
    - "اللمة الموجودة 'سلك تسليك المراحيض' طويلة وتمثل وصفاً وظيفياً أكثر من كونها مصطلحاً مسكوكاً مفرداً."
    - "تتداخل تسميات أدوات السباكة في الاستخدام العام، فكلمة (سلاكة) قد تُطلق على المكبس المطاطي (plunger) أو على السلك المرن (snake)."
  observations:
    - "تعتمد اللغة العربية في هذا المجال الفني على التراكيب الإضافية الوصفية لغياب مفردة واحدة قاطعة."
    - "يلاحظ استخدام المجاز الاستعاري في القواميس الفنية مثل 'أفعى الرصاص' (plumber's snake) للدلالة على هذه الأداة وغيرها من أدوات التسليك."

