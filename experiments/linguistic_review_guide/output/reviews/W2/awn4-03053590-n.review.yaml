stage3_analysis:
  - lemma: سِلْكُ تَسْلِيكِ المَرَاحِيضِ
    evidence_evaluation: "لم تُسجل اللمة بتركيبها الكامل في المعاجم العامة، لكن مكوناتها سليمة وتمثل التعبير المعتاد في المجال المهني والتجاري."
    mwe_type: idafi
    dialect_check: "فصيحة."
    substitution_test: "يمكن استبدالها بـ 'سلاكة المراحيض'."
    nuance: "تعبير وصفي دقيق وشائع يوضح المادة (سلك) والوظيفة (تسليك)."
    borrowing_check: "أصيلة."
    quality_gate: "مقبولة نظراً لشيوعها كمركب وصفي ثابت في مجال السباكة."
    morphological_fit: "سليمة، تعتمد على إضافة اسم ذات لاسم معنى (مصدر)."
    decision: confirmed
    actions:
      - command: update_lemma
        params:
          synset_id: "awn4-03053590-n"
          old_lemma: "سلك تسليك المراحيض"
          new_lemma: "سِلْكُ تَسْلِيكِ المَرَاحِيضِ"
  - lemma: سَلَّاكَةُ المَرَاحِيضِ
    evidence_evaluation: "كلمة 'سلاكة' مدعومة معجمياً كصيغة قياسية (فعّالة) تستخدم للدلالة على مبالغة الفعل أو الآلة."
    mwe_type: idafi
    dialect_check: "فصيحة، وشائعة في الاستخدام الحديث كاسم آلة."
    substitution_test: "تصلح بديلاً أوجز لـ 'سلك تسليك المراحيض'."
    nuance: "صيغة اسم آلة قياسية (فعّالة) تتميز بالإيجاز وسهولة التداول."
    borrowing_check: "أصيلة."
    quality_gate: "ممتازة لغوياً لاتباعها أوزان الآلة العربية."
    morphological_fit: "وزن (فَعَّالَة) قياسي ومناسب جداً للآلات والأدوات."
    decision: confirmed
    actions:
      - command: create_entry
        params:
          lemma: "سَلَّاكَةُ المَرَاحِيضِ"
          pos: n
      - command: add_sense
        params:
          synset_id: "awn4-03053590-n"
          entry_id: "{auto}"
  - lemma: مِثْقَبُ المَرَاحِيضِ
    evidence_evaluation: "لا دليل على استخدامها، وهي ترجمة حرفية للمقابل الإنجليزي (auger)."
    decision: removed
  - lemma: ثُعْبَانُ المَرَاحِيضِ
    evidence_evaluation: "لا دليل على هذا التركيب بالتحديد، رغم وجود 'أفعى الرصاص' في القواميس الفنية للمفهوم الأعم، مما يجعل التركيب مستغرباً كاسم مسكوك."
    decision: removed

