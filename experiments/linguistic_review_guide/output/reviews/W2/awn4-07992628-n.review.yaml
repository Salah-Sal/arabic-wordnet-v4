      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَشْد"
    - lemma: "جَمَاعَة"
      source: stage1
      decision: confirmed
      decision_reason: "اللفظ الأصلي والأكثر دقة لغوياً للدلالة على أي عدد من الناس أو الكائنات، وهو مقابل مباشر لـ assemblage."
