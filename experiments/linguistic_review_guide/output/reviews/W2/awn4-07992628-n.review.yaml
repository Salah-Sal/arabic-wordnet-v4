stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدأ بكلمة 'تجمع' وهي إحدى اللمّات (دوران)."
      - "نقص في بعض اللمّات الشائعة والمقابلة للمصطلح الإنجليزي مثل 'جماعة' و'احتشاد'."
    observations: "المجموعة الترادفية تغطي مفهوم الجمع أو التكتل للأشخاص أو الأشياء. اللمّات الحالية (تجمع، جمهرة، حشد) جيدة ولكنها تحتاج إلى تعزيز بلمّات أكثر شمولاً وتوثيق الفروق الدلالية بينها."
  blind_candidates:
    - lemma: "جَمَاعَة"
      generation_method: ishtiqaq
      justification: "اللفظ الأكثر شيوعاً وعموماً للدلالة على أي عدد من الناس أو الأشياء."
    - lemma: "مَحْشَد"
      generation_method: ishtiqaq
      justification: "اسم مكان أو مصدر ميمي يدل على مكان الاجتماع أو فعله، ويستخدم لوصف الحشود."
    - lemma: "لَفِيف"
      generation_method: majaz
      justification: "يدل على القوم المجتمعين من قبائل شتى، وهو مناسب جداً لمعنى 'assemblage'."
    - lemma: "كَثابة"
      generation_method: ishtiqaq
      justification: "لفظ معجمي قديم يدل على الجماعة أو العدد الكبير."

stage2_evidence:
  per_lemma:
    - lemma: "تَجَمُّع"
      confirm:
        - text: "«تجمع سكاني يشمل مدينة مركزية وضواحيها»"
          source: "ArabTerm"
        - text: "«الشيءُ المُتَفَرِّقُ، أو الأشياءُ: اجْتَمَعَت»"
          source: "المعجم الكبير"
    - lemma: "جَمْهَرَة"
      confirm:
        - text: "«من كل شيء معظمه»"
          source: "المعجم الوسيط"
        - text: "«المُجْتَمَعُ»"
          source: "المعجم الكبير"
    - lemma: "حَشْد"
      confirm:
        - text: "«من الناس: الجماعة»"
          source: "المعجم الوسيط"
        - text: "«الجَماعةُ يَحْتَشِدون. يقال: عند فُلَانٍ حَشْدٌ من النَّاسِ»"
          source: "المعجم الكبير"
    - lemma: "جَمَاعَة"
      confirm:
        - text: "«العدَدُ الكثير من الناس والشجر والنبات»"
          source: "المعجم الوسيط"
        - text: "«من كُلِّ شيءٍ: العَدَدُ الكَثِيرُ، أو القَلِيلُ. يقال: جماعةُ الشجر، وجماعةُ الإبل»"
          source: "المعجم الكبير"
    - lemma: "لَفِيف"
      confirm:
        - text: "«ما اجتمع من الناس من قبائل شتّى، أو من أخلاط شتّى»"
          source: "المعجم الوسيط"
        - text: "«﴿ جِئْنَا بِكُمْ لَفِيفاً ﴾: مجتمعين مختلطين»"
          source: "القرآن الكريم (شواهد المعاجم)"
    - lemma: "احْتِشَاد"
      confirm:
        - text: "«احتشد النَّاسُ: تجمَّعوا لأمر واحد بطريقة غير منظّمة»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«congregation: تَجَمُّع؛ احتشاد»"
          source: "المورد الحديث"

