    current: "تجمع من الناس أو الحيوانات أو الأشياء المحتشدة معاً"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدأ بإحدى اللمّات (تجمع) ويفتقر للصياغة المعجمية الدقيقة."
    authored:
      - type: terminological
        text: "جَمَاعَةٌ من النَّاسِ أو الأشياءِ تَنْضَمُّ بَعْضُها إلى بَعْضٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "العَدَدُ الكَثِيرُ من النَّاسِ أو غَيْرِهِم يُجْمَعُون مَعاً لِغَرَضٍ ما أو صِفَةٍ مُشْتَرَكَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07992628-n"
          definition_index: 0
          text: "جَمَاعَةٌ من النَّاسِ أو الأشياءِ تَنْضَمُّ بَعْضُها إلى بَعْضٍ."
  examples:
    per_lemma:
      - lemma: "تَجَمُّع"
        examples:
          - text: "شَهِدَتِ المَدِينَةُ تَجَمُّعاً كَبِيراً لِلمُحْتَجِّين."
            type: usage
      - lemma: "جَمْهَرَة"
        examples:
          - text: "هَذِهِ المَكْتَبَةُ تَضُمُّ جَمْهَرَةً نَادِرَةً مِنَ المَخْطُوطَاتِ العَرَبِيَّةِ."
