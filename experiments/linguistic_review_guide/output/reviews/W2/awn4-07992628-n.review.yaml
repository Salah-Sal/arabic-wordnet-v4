      - lemma: "جَمَاعَة"
        examples:
          - text: "رَأَيْتُ جَمَاعَةً مِنَ الطُّيُورِ تُهَاجِرُ نَحْوَ الجَنُوبِ."
            type: usage
      - lemma: "لَفِيف"
