stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي حرفي إلى حد ما ويبدو كترجمة آلية للنص الإنجليزي."
    observations: "المصطلح علمي فلكي يشير إلى منطقة في أقاصي المجموعة الشمسية، وهو منسوب للفلكي يان أورت (Jan Oort)."
  blind_candidates:
    - lemma: "سَحَابَة أُورْت"
      generation_method: tarkib
      justification: "الترجمة القياسية المستقرة في الأدبيات الفلكية العربية لـ Oort cloud."
    - lemma: "غِلَاف أُورْت"
      generation_method: tarkib
      justification: "تعبير وصفي يستخدم أحياناً للإشارة إلى الإحاطة الكروية لهذه المجموعة بالمجموعة الشمسية."
    - lemma: "نِطَاق أُورْت"
      generation_method: tarkib
      justification: "استخدام 'نطاق' كبديل لـ 'سحابة' لوصف الحيز المكاني."
    - lemma: "حِزَام أُورْت"
      generation_method: tarkib
      justification: "قياساً على 'حزام كايبر' (Kuiper Belt)، وإن كان أقل دقة علمياً لأن أورت سحابة كروية وليست حزاماً مسطحاً."

stage2_evidence:
  per_lemma:
    - lemma: "سَحَابَة أُورْت"
      confirm:
        - text: "«حُزْمَةُ أورت (الحُزْمَةُ الزَّيتونِيَّةُ القَوقَعِيَّةُ لِراسْمُوسِن)»"
          source: "المعجم الطبي الموحد"
        - text: "«(سَحَبَ) السِّينُ وَالْحَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ مَبْسُوطٍ وَمَدِّهِ... وَسُمِّي السَّحَابُ سَحَابًا تَشْبِيهًا لَهُ بِذَلِكَ»"
          source: "مقاييس اللغة"
      expands:
        - text: "«السحابة: هيكل غازي ظاهر للعيان... مجال ثلاثي الأبعاد يحتوي على المادة... يحيط بمصدر الانبعاث.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يؤكد استخدام 'سحابة' لوصف التجمعات الغازية أو المادية المحيطة بمركز ما في سياقات علمية."

stage3_analysis:
  per_lemma:
    - lemma: "سحابة أورت"
      decision: confirmed
      decision_reason: "المصطلح العلمي القياسي والوحيد المعترف به في المراجع الفلكية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَحَابَة أُورْت"

stage4_content:
  definition:
    current: "(علم الفلك) مجموعة افتراضية ضخمة من المذنبات تدور حول الشمس بعيدًا جدًا عن مدار بلوتو؛ يمكن للاضطرابات (كما تسببها النجوم الأخرى) أن تخل بمدار المذنب وقد ترسله متداعيًا نحو الشمس"
    assessment:
      decision: revise
      reason: "التعريف الحالي طويل ويحتوي على تفاصيل استطرادية؛ يفضل تعريف يركز على ماهية الجرم وموقعه بأسلوب معجمي رصين."
    authored:
      - type: terminological
        text: "سحابة كروية هائلة من الأجرام الثلجية والمذنبات، تحيط بالمجموعة الشمسية على مسافات شاسعة تتجاوز حزام كايبر، وتعد مصدراً للمذنبات طويلة الدورة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "سحابة كروية هائلة من الأجرام الثلجية والمذنبات، تحيط بالمجموعة الشمسية على مسافات شاسعة تتجاوز حزام كايبر، وتعد مصدراً للمذنبات طويلة الدورة."

  examples:
    per_lemma:
      - lemma: "سَحَابَة أُورْت"
        examples:
          - text: "تُعد سحابة أورت الخزان الرئيسي للمذنبات التي تزور الجزء الداخلي من النظام الشمسي."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُعد سحابة أورت الخزان الرئيسي للمذنبات التي تزور الجزء الداخلي من النظام الشمسي."

stage5_enrichment:
  per_entry:
    - lemma: "سَحَابَة أُورْت"
      entry_id: "{auto}"
      roots:
        - word: "سحابة"
          root: "سحب"
          maqayis_quote: "«السِّينُ وَالْحَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ مَبْسُوطٍ وَمَدِّهِ... وَسُمِّي السَّحَابُ سَحَابًا تَشْبِيهًا لَهُ بِذَلِكَ، كَأَنَّهُ يَنْسَحِبُ فِي الْهَوَاءِ انْسِحَابًا.»"
        - word: "أورت"
          root: null
          maqayis_quote: "اسم علم أعجمي منسوب للفلكي يان أورت."

  per_sense:
    - lemma: "سَحَابَة أُورْت"
      sense_id: "{auto}"
      nuance: "مصطلح علمي خاص بتجمع المذنبات في أقاصي المجموعة الشمسية."
      mwe: true

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"سحابة","root":"سحب","maqayis_quote":"«السِّينُ وَالْحَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ مَبْسُوطٍ وَمَدِّهِ...»"},{"word":"أورت","root":null,"maqayis_quote":"اسم علم أعجمي"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح علمي فلكي محدد","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
