# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13776918-n
# bag — كمية الطرائد التي تم اصطيادها في فترة معينة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «حصيلة الصيد» مركب إضافي حرّ وليس وحدة معجمية ثابتة مسجّلة؛ يمكن استبدال «حصيلة» بـ«محصول» أو «ناتج» دون تغيّر المعنى"
      - "اللمّة «صيد» عامّة جداً؛ تدلّ على ما يُصاد وعلى فعل الصيد معاً، ولا تختصّ بالكمية المحصَّلة في فترة معيّنة"
      - "المورد الحديث يترجم bag (بمعنى الصيد) بـ«محصول الصيد» لا «حصيلة الصيد»"
    observations: "المفهوم المقصود هو الكمّية الإجمالية من الطرائد التي يصيدها شخص واحد في رحلة أو فترة محدّدة. في العربية لا يوجد لفظ مفرد مخصّص لهذا المعنى الكمّي الدقيق، وإنما يُعبَّر عنه بمركبات إضافية (حصيلة الصيد، محصول الصيد) أو بلفظ «صيد» مجازاً باعتبار أنّ المصيد يدلّ على المقدار بالسياق. جذر ق ن ص يدلّ على الصيد حصراً وقد يكون أدقّ من ص ي د في هذا السياق."
  blind_candidates:
    - lemma: "قَنِيصَة"
      generation_method: ishtiqaq
      justification: "اشتقاق من جذر ق ن ص الدالّ على الصيد حصراً، على وزن فَعِيلَة بمعنى المفعول (كذبيحة)، لتدلّ على ما قُنِص من طرائد"
    - lemma: "مَصِيد"
      generation_method: ishtiqaq
      justification: "اسم مفعول من صاد يصيد على وزن مَفْعِيل/مَفْعُول، للدلالة على ما صِيدَ من طرائد في مجمله"
    - lemma: "حَصَاد القَنْص"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين حَصاد (الناتج المحصود) والقنْص (فعل الصيد)، استعارة من المجال الزراعي للدلالة على محصول الصيد"
    - lemma: "رَمْيَة"
      generation_method: majaz
      justification: "مجاز مرسل من رَمْيَة (الطلقة/الرمية) إلى ما أُصيب بها من صيد؛ علاقة السببية — إطلاق اسم السبب على المسبَّب"

stage2_evidence:
  per_lemma:
    - lemma: "حَصِيلَة الصَّيْد"
      expands:
        - text: "«(الحصيلة) الحصيل يُقَال حصيلة الضرائب وحصيلة الأرباح والبقية (ج) حصائل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (حوراماني)"
          addition: "حصيلة تعني ما حصل من شيء ما، فهي عامّة وليست مخصّصة بالصيد"
        - text: "«الحصيل حصيلة الضرائب وحصيلة الأرباح: ما حصل منها البقيّة»"
          source: "المعجم الوسيط"
          addition: "تأكيد أنّ الحصيلة تعني ما تحصَّل من شيء، وهي صالحة للإضافة إلى الصيد"
        - text: "«(4) «أ» محصول الصيد. «ب» غنائم. «ج» مجموعة. «د» كثرة؛ وفرة؛ مقدار كبير»"
          source: "المورد الحديث (2008) — مادة bag"
          addition: "المورد يستعمل «محصول الصيد» لا «حصيلة الصيد» لترجمة bag بمعنى الكمية المصطادة"

    - lemma: "صَيْد"
      confirm:
        - text: "«ما يصاد»"
          source: "المعجم الوسيط"
        - text: "«كُلُّ ما يَصيدُه الإنسانُ من السَّمكِ والطير والوحش كُلُّ وَحْش صَيْدٌ, صِيدَ أو لم يُصَدْ»"
          source: "المعجم الكبير"
        - text: "«{الصيد}: ما كان ممتنعا من الحيوان ولم يكن له مالك وكان حلالا أكله»"
          source: "تحفة الأريب لأبي حيان الغرناطي"
      expands:
        - text: "«صَيْد إلخ. وبخاصة: مقدار المَصِيد من السمك دفعةً واحدةً a large catch of fish»"
          source: "المورد الحديث (2008) — مادة catch"
          addition: "المورد يستعمل صيد ومقدار المصيد للدلالة على الكمية المصطادة"
        - text: "«الصَّادُ وَالْيَاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَعْنًى وَاحِدٍ، وَهُوَ رُكُوبُ الشَّيْءِ رَأْسَهُ وَمُضِيُّهُ غَيْرَ مُلْتَفِتٍ وَلَا مَائِلٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي للجذر ص ي د"

    - lemma: "قَنِيصَة"
      contradicts:
        - text: "«الْقَانِصُ: الصَّائِدُ. وَالْقَنَصُ: الصَّيْدُ. وَالْقَنْصُ: فِعْلُ الْقَانِصِ. قَالَ ابْنُ دُرَيْدٍ: الْقَنِيصُ: الصَّائِدُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "القنيص بمعنى الصائد (الفاعل) لا المصيد (المفعول)؛ فقنيصة على هذا النمط لا تؤدّي المعنى المطلوب"
      expands:
        - text: "«(القنص) المصيد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "القَنَص (بفتحتين) هو الذي يعني المصيد، لا القنيص/القنيصة"

    - lemma: "مَصِيد"
      contradicts:
        - text: "«المِصْيَدُ: ما يُصادُ به»"
          source: "المعجم الكبير"
          conflict: "المِصْيَد يعني أداة الصيد (ما يُصاد به)، لا ما يُصاد"

    - lemma: "حَصَاد القَنْص"
      evidence_status: "no_material_found"

    - lemma: "رَمْيَة"
      contradicts:
        - text: "«المَرَّةُ من الرَّمْي»"
          source: "المعجم الوسيط"
          conflict: "الرِّمْيَة تدلّ على فعل الرمي مرّة واحدة، لا على كمّية الصيد"
      expands:
        - text: "«الصَّيدُ الذى ترميه (للمذكَّر وللمؤنَّث). ويقال: هو صاحب رميةٍ, أي يزيد فى الحديث»"
          source: "المعجم الوسيط"
          addition: "الرَّمِيَّة (بتشديد الياء) تعني الصيد الفرد الذي تستهدفه بالرمي، لا المجموع الكمّي"

stage3_analysis:
  per_lemma:
    - lemma: "صَيْد"
      decision: confirmed
      decision_reason: "لفظ فصيح مؤصَّل في المعاجم الكلاسيكية والحديثة بمعنى ما يُصاد من حيوان وطير وسمك؛ يصلح للدلالة على مجمل ما أُخذ من الطرائد. المورد الحديث يستعمله في ترجمة catch بمعنى المقدار المصيد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الطرائد المصيدة باعتبارها جنساً عامّاً دون تخصيص بالكمّية أو الفترة الزمنية؛ أعمّ من «حصيلة الصيد» التي تحدّد البُعد الكمّي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَيْد"

    - lemma: "حَصِيلَة الصَّيْد"
      decision: confirmed
      decision_reason: "مركب إضافي شفّاف يؤدّي المعنى المطلوب بدقة (الكمّية المتحصّلة من الصيد). وإن لم يكن مسجّلاً بوصفه مدخلاً معجمياً مستقلاً، فإنّ مكوّنيه راسخان لغوياً، والتعبير شائع في الاستعمال الحديث ومقابل لـ«محصول الصيد» الوارد في المورد."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يختصّ بالبُعد الكمّي التجميعي لما أُخذ من طرائد في فترة أو رحلة، بخلاف «صيد» الذي يدلّ على المصيد عموماً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَصِيلَة الصَّيْد"

    - lemma: "قَنِيصَة"
      source: stage1
      decision: removed
      decision_reason: "القنيص عند ابن دريد بمعنى الصائد (الفاعل) لا المصيد؛ والصيغة المسموعة للمفعول هي القَنَص (بفتحتين) لا القنيصة. لا شاهد معجمي على هذه الصيغة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَصِيد"
      source: stage1
      decision: removed
      decision_reason: "المِصْيَد في المعجم الكبير يعني أداة الصيد (ما يُصاد به)، لا المصيد ذاته. ولا شاهد على استعمال مَصِيد بمعنى كمّية الطرائد."
      evidence_assessment:
        case: contradicts_only

    - lemma: "حَصَاد القَنْص"
      source: stage1
      decision: removed
      decision_reason: "مركب إضافي حرّ غير مسجّل؛ حصاد مصطلح زراعي ونقله إلى الصيد استعارة غير مسكوكة. يفشل في اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material

    - lemma: "رَمْيَة"
      source: stage1
      decision: removed
      decision_reason: "الرِّمْيَة تدلّ على المرّة الواحدة من الرمي، والرَّمِيَّة تدلّ على الصيد الفرد المستهدَف بالرمي؛ كلتاهما لا تفيدان المعنى الكمّي التجميعي المطلوب."
      evidence_assessment:
        case: contradicts_only

