# مراجعة المجموعة الترادفية — awn4-10629202-n
# slave: someone entirely dominated by some influence or person
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «عَبْد» دلالتها الأولى هي الرقيق المملوك حقيقةً، واستعمالها المجازي بمعنى الخاضع لتأثير ما يحتاج إلى توثيق"
      - "العلاقة بالمُشعِّر الأعلى (عامل/فاعل) غير واضحة دلالياً؛ فالمستعبَد ليس فاعلاً بالمعنى الدقيق"
      - "التعريف العربي ترجمة حرفية شبه مباشرة للتعريف الإنجليزي، يحتاج إلى صياغة معجمية أصيلة"
    observations: "المجموعة تصف المعنى المجازي للعبودية: شخص خاضع خضوعاً تاماً لسلطان أمرٍ ما أو شخصٍ ما، كمن يقال فيه «أسير الشهوات» أو «عبد المال». هذا الاستعمال المجازي شائع في العربية الفصحى قديماً وحديثاً. اللمّتان الموجودتان (أسير، عبد) تحتاجان إلى تمييز دلالي دقيق."
  blind_candidates:
    - lemma: "مُسْتَعْبَد"
      generation_method: ishtiqaq
      justification: "اسم مفعول من استعبد على وزن مُسْتَفْعَل، يدل على من وقع عليه فعل الاستعباد والإخضاع. الجذر عبد يدل على اللين والذل، والصيغة تؤكد وقوع الخضوع على صاحبها"
    - lemma: "مُسَخَّر"
      generation_method: ishtiqaq
      justification: "اسم مفعول من سَخَّرَ على وزن مُفَعَّل، يدل على من ذُلِّل وخُضِع لأمر غيره. الجذر سخر يدل على الاحتقار والاستذلال في مقاييس اللغة"
    - lemma: "تَابِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تَبِعَ على وزن فَاعِل، يدل على من يتلو غيره ويقفوه. الجذر تبع يدل على التلو والقفو"
    - lemma: "مُنْقَاد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من انقاد على وزن مُنْفَعِل، يدل على من استسلم لقيادة غيره. الجذر قود يدل على الامتداد والقيادة"

stage2_evidence:
  per_lemma:
    - lemma: "أَسِير"
      confirm:
        - text: "«أسير: مؤنثه أسيرة: عبد، رقيق (بوشر). وأسير التقليد: عبد التقاليد (بوشر).»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«(الْأَسير) الْمَأْخُوذ فِي الْحَرْب (ج) أسراء وأسارى وأسارى»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«المأخوذ في الحرب»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«من يقع في يد العدوِّ أثناء الحرب. وقد كان الأسر قديما يؤدِّى إلى الاسترقاق، وكان الأسرى يُعدون من غنائم الحرب. المُقيَّد. المَحْبُوس.»"
          source: "المعجم الكبير"
          addition: "المعنى الأصلي هو أسير الحرب، والمعنى المجازي (الخاضع لتأثير) مُوثَّق في دوزي بعبارة «أسير التقليد»"
        - text: "«(أَسَرَ) الْهَمْزَةُ وَالسِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَقِيَاسٌ مُطَّرِدٌ، وَهُوَ الْحَبْسُ، وَهُوَ الْإِمْسَاكُ. مِنْ ذَلِكَ الْأَسِيرُ، وَكَانُوا يَشُدُّونَهُ بِالْقِدِّ وَهُوَ الْإِسَارُ، فَسُمِّيَ كُلُّ أَخِيذٍ وَإِنْ لَمْ يُؤْسَرْ أَسِيرًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر أسر أصله الحبس والإمساك، وتعميم الأسير لكل أخيذ يدعم التوسع المجازي"

    - lemma: "عَبْد"
      confirm:
        - text: "«(عَبَدَ) الْعَيْنُ وَالْبَاءُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ... فَالْأَوَّلُ الْعَبْدُ، وَهُوَ الْمَمْلُوكُ... وَتَعَبَّدَ فُلَانٌ فُلَانًا، إِذَا صَيَّرَهُ كَالْعَبْدِ لَهُ وَإِنْ كَانَ حُرًّا.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«العبد: الإنسان حرًّا أو رقيقاً... واستعبدت فلاناً: اتخذته عبداً. وتعبّد فلان فلاناً: صيّره كالعبد له وإن كان حراً.»"
          source: "كتاب العين للخليل"
      expands:
        - text: "«الرقيق. الإنسان حُرّاً كان أو رقيقاً، لأنه مربوب لله عز وجل»"
          source: "المعجم الوسيط (OCR)"
          addition: "الدلالة الأولى هي الرقيق المملوك، والتوسع يشمل كل إنسان بوصفه عبداً لله"
        - text: "«المملوك. الذليل. القوة والصلابة في الشيء. الأنفة والغضب»"
          source: "مقاييس اللغة (OCR)"
          addition: "للجذر أصلان: اللين والذل + الشدة والغلظ"

    - lemma: "مُسْتَعْبَد"
      confirm:
        - text: "«(1) عبد؛ رقيق (2) عُبُودية (3) مُسْتَعْبَد.»"
          source: "المورد الحديث (ترجمة thrall)"
        - text: "«سجين؛ أسير؛ مُسْتَعْبَد.»"
          source: "المورد الحديث (ترجمة in chains)"
        - text: "«(4) مُسْتَرَقّ؛ مستَعْبَد slave peoples»"
          source: "المورد الحديث (ترجمة slave)"

    - lemma: "مُسَخَّر"
      contradicts:
        - text: "«المُسَخَّر: من ينصبه القاضي وكيلاً عن الغائب لتسمع الخصومة.»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "المعنى الاصطلاحي الفقهي مختلف تماماً عن دلالة الخضوع المطلق"
      expands:
        - text: "«(سَخِرَ) السِّينُ وَالْخَاءُ وَالرَّاءُ أَصْلٌ مُطَّرِدٌ مُسْتَقِيمٌ يَدُلُّ عَلَى احْتِقَارٍ وَاسْتِذْلَالٍ. مِنْ ذَلِكَ قَوْلُنَا سَخَّرَ اللَّهُ عَزَّ وَجَلَّ الشَّيْءَ، وَذَلِكَ إِذَا ذَلَّلَهُ لِأَمْرِهِ وَإِرَادَتِهِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر سخر يدل على الاحتقار والاستذلال، والتسخير تذليل للأمر، لكنه يقال للأشياء أكثر منه للأشخاص"

    - lemma: "تَابِع"
      contradicts:
        - text: "«(التَّابِع) التَّالِي وَالْخَادِم وَمَا يتبع غَيره (ج) تبع وتباع وتبعة وَتبع»"
          source: "المعجم الوسيط (هورماني)"
          conflict: "التابع يدل على المتبوعية والتلو، لا على الخضوع المطلق والاستعباد"
        - text: "«التَّالِي. الخَادِم»"
          source: "المعجم الكبير"
          conflict: "المعنى أعم بكثير من دلالة المجموعة الترادفية"
      expands:
        - text: "«أيُّ تجهيزةٍ (ومنها الحاسوب) يُسيطَر عليها من حاسوب آخر، يسمى الرئيس master.»"
          source: "معجم مصطلحات المعلوماتية"
          addition: "استعمال تقني حديث بمعنى slave في سياق الحوسبة، لا يدل على شخص"

    - lemma: "مُنْقَاد"
      contradicts:
        - text: "«(المنقاد) المنقار»"
          source: "المعجم الوسيط (هورماني)"
          conflict: "المِنقاد بهذا الضبط من جذر نقد لا من جذر قود، وهو المنقار لا المنقاد بمعنى المستسلم"
      expands:
        - text: "«(قَوَدَ) الْقَافُ وَالْوَاوُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى امْتِدَادٍ فِي الشَّيْءِ... وَفَرَسٌ قَؤُودٌ: سَلَسٌ مُنْقَادٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "المنقاد من قود يدل على السلاسة والطواعية، لكنه يُستعمل صفةً أكثر منه اسماً لشخص"

stage3_analysis:
  per_lemma:
    - lemma: "أَسِير"
      decision: confirmed
      decision_reason: "لمّة أصيلة مُوثَّقة في المعاجم بمعناها الحقيقي (المأخوذ في الحرب) والمجازي (الخاضع لتأثير ما). التوسع المجازي مُثبَت في دوزي بعبارة «أسير التقليد». جذر أسر دلالته الحبس والإمساك، وتعميم الأسير لكل أخيذ يدعم المعنى المجازي. يُستعمل في الفصحى المعاصرة بشكل طبيعي: أسير العادات، أسير الشهوات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على معنى الأسر والحبس المعنوي؛ أي أن صاحبه مقيّد بقيد لا يستطيع الفكاك منه، ويحمل ظلالاً من القهر والعجز عن التحرر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَسِير"

    - lemma: "عَبْد"
      decision: confirmed
      decision_reason: "لمّة أصيلة، جذرها يدل على اللين والذل عند ابن فارس. نصّ الخليل وابن فارس يؤكدان التوسع المجازي: «تعبّد فلان فلاناً: صيّره كالعبد له وإن كان حراً». يُستعمل مجازاً في التراث والفصحى المعاصرة: عبد المال، عبد الشهوات، عبد الهوى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على معنى الخضوع والملكية المعنوية؛ أي أن صاحبه مملوك لهواه أو لسلطان غيره، ويحمل ظلالاً من الذل والانقياد الطوعي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَبْد"

    - lemma: "مُسْتَعْبَد"
      source: stage1
      decision: confirmed
      decision_reason: "اسم مفعول من استعبد، مُوثَّق في المورد الحديث ترجمةً لـ slave وthrall وin chains. يتميز عن عبد بأنه يؤكد وقوع فعل الاستعباد على صاحبه (أي أنه لم يختر هذا الوضع)، وعن أسير بأنه أقرب إلى معنى الرقّ المعنوي منه إلى الأسر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يؤكد وقوع فعل الاستعباد على صاحبه من طرف خارجي؛ أي أنه مُكرَه على الخضوع لا مختار له، ويحمل ظلالاً من القهر الاجتماعي أو النفسي"
      actions:
        - command: create_entry
          params: {lemma: "مُسْتَعْبَد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُسَخَّر"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تُظهر أن المُسخَّر في الاصطلاح الفقهي يعني من ينصبه القاضي وكيلاً عن الغائب، وهو معنى مختلف تماماً. كما أن التسخير في الاستعمال القرآني والتراثي يُقال للأشياء (سخّر الشمس والقمر) أكثر مما يُقال للأشخاص بمعنى الاستعباد."

    - lemma: "تَابِع"
      source: stage1
      decision: removed
      decision_reason: "التابع معناه التالي والخادم في المعاجم الكلاسيكية، وهو أعمّ بكثير من دلالة الخضوع المطلق المقصودة في هذه المجموعة. الاستعمال التقني الحديث (تابع = slave في الحوسبة) خاص بالأجهزة لا بالأشخاص."

    - lemma: "مُنْقَاد"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية كافية لاستعمال مُنقاد اسماً لشخص مستعبَد. المادة في الوسيط (المِنقاد = المنقار) من جذر نقد لا قود. والمنقاد من انقاد يدل على الطواعية والسلاسة وهي درجة أخفّ من الخضوع المطلق المقصود."

