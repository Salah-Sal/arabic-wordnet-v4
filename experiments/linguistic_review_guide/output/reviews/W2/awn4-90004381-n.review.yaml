    - lemma: "لافِتَةٌ إعْجَابِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "لافِتَةُ مُعْجَبِينَ"
      decision: confirmed
      decision_reason: >
        المركّب الإضافي 'لافتة معجبين' وصف دقيق شفّاف للمفهوم: نوع اللافتة (لافتة)
        ونِسبتها إلى صانعيها (معجبين). 'لافتة' موثّقة في المعجم الوسيط بمعناها الحديث،
        و'معجبين' جمع سالم لـ'معجب' الواردة في المعاجم. المركّب يجتاز اختبار السكّ
        الاصطلاحي باعتباره مُدرَجاً في AWN4 ومستعملاً في الكتابة العربية المتخصصة.
        يحتاج إلى تحديث التشكيل من 'لافتة معجبين' إلى 'لافِتَةُ مُعْجَبِينَ'.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُميّز هذه اللافتات بنسبتها إلى صانعيها (المعجبين)
        في مقابل اللافتات التجارية أو الإعلانية أو الرسمية، مما يُحدّد الوظيفة الاجتماعية
        (التعبير عن الإعجاب الجماهيري) لا مجرد الشكل المادي.
      morphological_check: >
        'لافتة' اسم فاعل بصيغة المؤنث من الفعل لَفَتَ (يلفِتُ) على وزن فَاعِلَة،
        وهو وزن مناسب للأدوات والأشياء التي تلفت الانتباه. 'معجبين' جمع مذكر سالم
        لـ'مُعْجَب' على وزن مُفْعَل (اسم مفعول)، وهو الوزن الصحيح للدلالة على الشخص
        المأخوذ بالإعجاب. الوزنان الصرفيان متناسبان مع الوظيفة الدلالية.
      borrowing_check:
        lexical_borrowing: "فصيحة — لا اقتراض لفظي"
        blind_translation: "لا ترجمة حرفية عمياء؛ 'لافتة' سبقت في العربية لافتات المتاجر والشعارات"
        calque: "المركّب كَلْك من fan sign الإنجليزية بناءً شفّافاً مقبولاً"
      quality_gate:
        consistency: "لافتة مستعملة في أسماء اليافطات والشعارات"
        ease_of_use: "مركّب ثنائي سهل التداول والجمع (لافتات معجبين)"
        appropriateness: "مناسب للسياق الجماهيري العصري"
        heritage_preference: "لافتة محدَثة مجمعية مقبولة"
        arabic_preference: "مكوّنان عربيان أصيلان"
        derivability: "قابل للاشتقاق: لافتات معجبين، لافتة معجبي الفنان"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لافِتَةُ مُعْجَبِينَ"

    - lemma: "لافِتَةُ الإعْجَاب"
      source: stage1
      decision: removed
      decision_reason: >
        رغم صحة التركيب الإضافي، يفشل هذا المرشح في اختبار التمييز النوعي: 'لافتة الإعجاب'
        لا تُحدّد من يصنعها — يمكن أن تشمل الإعلانات التجارية أو شعارات الحملات، فضلاً عن
        أن إبدال 'لافتة' بـ'لوحة' أو 'بطاقة' لا يُفسد التعبير وصفاً، مما يدل على أنه ليس
        مصطلحاً مسكوكاً. اللمّة الموجودة 'لافتة معجبين' أكثر دقة لأنها تُنسب إلى صانعيها.

    - lemma: "لَوْحَةُ المُعْجَبِينَ"
      source: stage1
      decision: removed
      decision_reason: >
        'لوحة' في المعاجم الحديثة ترتبط بالأعمال الفنية الاحترافية (لوحة زيتية، لوحة منسوجة)
        أو بالألواح الإعلامية التقنية، وهذا لا يُلائم الطابع اليدوي غير الرسمي للافتات
        المعجبين. كما أن الأدلة المعجمية تُشير إلى أن 'لافتة' هي المقابل المعتمد لـ banner
        في السياق الإعلامي والمعلوماتي دون 'لوحة'.

    - lemma: "رَايَةُ الهَوَى"
      source: stage1
      decision: removed
      decision_reason: >
        'راية' في المعاجم العربية علم عسكري/هيرالدي (علم الجيش، أمّ الحرب) يختلف جوهرياً
        عن اللافتة الورقية اليدوية التي يحملها المعجبون. الاستعارة المجازية بعيدة وتُحدث
        لبساً مع المدلول الأصيل. كذلك فإن المعجم الحديث (المورد الحديث) يُقدّم 'لافتة'
        على 'راية' كمقابل لـ banner. الطابع الشاعري لـ'الهوى' لا يُلائم المصطلحية.

    - lemma: "لافِتَةٌ إعْجَابِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المركّب الوصفي أقل دقة من المركّب الإضافي الموجود؛ 'إعجابية' صفة عامة لا تُحدّد
        من يصنع اللافتة أو الغرض الاجتماعي منها، فيمكن أن تنطبق على إعلانات تجارية
        أو حملات ترويجية. لم تُعثر على أي شواهد معجمية.


