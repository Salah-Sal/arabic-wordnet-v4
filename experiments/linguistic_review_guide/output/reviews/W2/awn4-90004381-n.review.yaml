# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة في المجموعة عبارة وصفية مركّبة وليست مصطلحاً مسكوكاً في المعاجم العربية"
      - "التعريف يستخدم صيغة المفرد 'معجب' في حين أن اللمّة تستخدم الجمع 'معجبين'، وهو تناقض داخلي"
      - "عبارة 'الشخص المستهدف' صياغة غريبة في سياق الإعجاب والتشجيع الجماهيري؛ يُقترح استبدالها بـ'الشخصية المُحتَفى بها'"
      - "المجموعة تحتوي على لمّة واحدة فقط دون بدائل مرادفة أو شبه مرادفة"
    observations: >
      المفهوم ينتمي إلى ثقافة الجمهور والنجومية المعاصرة (ثقافة المعجبين)، وهو ظاهرة حديثة
      تجلّت في البيئات العربية عبر ممارسات ثقافية مستعارة من السياق الغربي. لا توجد لفظة
      مفردة مسكوكة لهذا المفهوم في المعاجم الكلاسيكية أو الحديثة الجامعة. اللمّة الموجودة
      مركّب إضافي شفّاف يصف المفهوم وصفاً دقيقاً وإن كانت تفتقر إلى التشكيل الكامل.
      الجذر الاشتقاقي للمكوّنين (لفت / عجب) أصيل، والتركيب الإضافي متين ومفهوم.
  blind_candidates:
    - lemma: "لافِتَةُ الإعْجَاب"
      generation_method: tarkib
      justification: >
        مركّب إضافي من 'لافتة' (sign/board) و'الإعجاب' (admiration/fandom)؛ يُبرز
        العاطفة الإعجابية كمحدِّد نوعي للافتة بدلاً من تحديد صانعيها، مما يجعله أكثر
        عمومية من المصطلح المطلوب لكنه يستكمل الطيف الدلالي.
    - lemma: "لَوْحَةُ المُعْجَبِينَ"
      generation_method: tarkib
      justification: >
        مركّب إضافي بديل يستعمل 'لوحة' (board/panel) بدلاً من 'لافتة'؛ يُشير إلى
        الطابع اليدوي الفني لهذه اللوحات وإن كانت 'لوحة' تحمل دلالة أكثر احترافية من
        اللافتة اليدوية التي يصنعها المعجبون.
    - lemma: "رَايَةُ الهَوَى"
      generation_method: majaz
      justification: >
        مجاز استعاري: 'راية' في الأصل علم الجيش وشعاره، وهي هنا استعارة للافتة التي
        يرفعها المعجبون إعلاناً عن انتمائهم ووَلَهِهم. 'الهوى' يُضفي طابعاً عربياً
        أصيلاً لمعنى الإعجاب العاطفي. إحياء لمعنى الراية كعلامة انتماء وولاء.
    - lemma: "لافِتَةٌ إعْجَابِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي (موصوف + صفة): 'لافتة' + النسبة 'إعجابية' المشتقة من الإعجاب،
        يُحدّد نوع اللافتة بحسب غرضها الإعجابي دون تقييد بصانع معيّن.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # --- الاستعلامات المنفَّذة ---
  # ١. بحث دفعي بالمداخل (batch headword): لافتة، اللافتة، معجب، المعجب، معجبين، المعجبين،
  #    اعجاب، الاعجاب، راية، الراية، لوحة، اللوحة، هوى، الهوى
  # ٢. الجسر الإنجليزي: "fan sign" | "fan banner" | "fan placard" | "fan board"
  # ٣. بحث FTS بالكلمات المفتاحية: لافته | لافتة | معجب | اعجاب | معجبين
  # ٤. مقاييس اللغة لابن فارس: جذور لفت، عجب، لوح
  per_lemma:
    - lemma: "لافِتَةُ مُعْجَبِينَ"
      confirm:
        - text: "«اللاَّفِتَةُ: لوحة من خشب ونحوه يكتب عليها اسم أو شِعَارٌ لتوجيه النظر إليه (محدثة)»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«اللافتة: لوحة من خشب وَنَحْوه يكْتب عَلَيْهَا اسْم أَو شعار لتوجيه النّظر إِلَيْهِ (ج) لوافت (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«لافِتَة» → translation_en: banner | domain: Information and Communication"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات 2011 (ARABTERM)"
        - text: "«مُعْجَب: المسرور بالشيء والمزهو بما يكون منه حسنا أو قبيحا»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(راية؛ لواء؛ علم) (لافتة) (شعار) (مناصر)» translation_en: banner"
          source: "المورد الحديث 2008 (ARABTERM)"
          addition: "يُثبّت أن 'راية' و'لافتة' من المقابلات العربية المعتمدة لكلمة banner الإنجليزية"
        - text: "«مقطعٌ من صفحةِ Web يتضمن إعلانات، ويكُون طولُه عادةً أقصرَ من إنش... تحوي اللافتةُ وصلةً إلى صفحةِ موقعِ صاحبِ الإعلان» translation_en: banner"
          source: "معجم مصطلحات المعلوماتية 2000 (ARABTERM)"
          addition: "يُبيّن أن 'لافتة' استُعملت مقابلاً لـ banner في السياق التقني الحديث بمعنى الشريط الإعلاني"

    - lemma: "لافِتَةُ الإعْجَاب"
      confirm:
        - text: "«إعجاب: مفهوم يرتبط بعصر النهضة، ويتجاوزه إلى حالة وجدانية تمتزج بتقدير أمهات الأعمال الأدبية والفنية» translation_en: admiration"
          source: "المعجم الموحد لمصطلحات اللسانيات 2002 (ARABTERM)"

    - lemma: "لَوْحَةُ المُعْجَبِينَ"
      confirm:
        - text: "«اللَّوْحَةُ: النَّظْرَةُ كاللمحة لوح من الورق الغليظ أو النسيج يصور فيه منظر طبيعىٌّ أو مشهد تاريخىٌّ أو نحو ذلك تصويراً فنِّيًّا»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«لَوْحَةالجذر: ل و ح — الصواب والرتبة: -لَوْحَة زيتيَّة [صحيحة] التعليق: الوارد في المعاجم القديمة اللَّوْح بدون تاء... وقد أجاز مجمع اللغة المصري تصحيحها»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "اللوحة بالتاء مقبولة للوحة الفنية، لكن الدلالة تنصرف إلى المنجزات الفنية الاحترافية لا إلى اللافتات اليدوية غير الرسمية للمعجبين"

    - lemma: "رَايَةُ الهَوَى"
      confirm:
        - text: "«الرَّاية: عَلَم الجيش وتكنَّى أمَّ الحرب وهي فوق اللوا»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«الرَّايَةُ: العَلَمُ — يقال: راية البيْطار وراية الخمَّار حَديدَةٌ مُسْتَديرةٌ على قَدْر العُنُقِ كانت تُوضَعُ في عُنُق الغُلَام الآبق»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      contradicts:
        - text: "«الراية: العلامة المنصوبة للرؤية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الراية مرتبطة بالسياق العسكري والهيرالدي، وهي أعلى رتبة من اللافتة؛ استخدامها في سياق معجبي الفنانين ينطوي على قفزة مجازية بعيدة قد تثير لبساً"
      expands:
