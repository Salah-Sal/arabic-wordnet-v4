# ── المرحلة ١: المراجعة والتوليد (توليد أعمى من الملف المُقنَّع) ──
stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'تيك تاك' نقلٌ صوتي خام للفظة الإنجليزية ticktack دون جذر عربي أو وزن صرفي معروف"
      - "المجموعة تمثل مفهومًا ثقافيًا خاصًا بالبيئة الأنجلوسكسونية (الرهان المرخَّص في حلبات الخيل) وقد يعسر استيعابه في الموروث المعجمي العربي"
      - "التعريف يستخدم 'صانعو المراهنات' وهي ترجمة حرفية غير مأنوسة لمصطلح bookmaker"
    observations: "المجموعة تصف نظامًا احترافيًا تبادليًا من الإيماءات اليدوية السرية يتواضع عليه القائمون على الرهان في ميادين سباق الخيل.
      الجذر العربي رمز يُعبِّر عن مفهوم التبادل في الإشارة (تَرَامَزَ القومُ: أشار بعضهم إلى بعض)، مما يجعله الجذر الأنسب للمصطلحة.
      اللمة الموجودة 'تيك تاك' مصوغة من onomatopoeia إنجليزية وتفتقر إلى المشروعية الاشتقاقية."
  blind_candidates:
    - lemma: "شِفْرَةُ الأَيْدِي"
      generation_method: tarkib
      justification: "مركّب إضافي من 'شِفْرَة' (نظام رموز سري للتفاهم بين جماعة) و'الأَيْدِي' (جمع يد)، يصف كون هذا النظام شفرةً تُؤدَّى بحركة اليدين."
    - lemma: "تَرَامُزٌ"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَاعُل من الفعل تَرَامَزَ (باب المفاعلة والتشارك)، يدل على التبادلية في توظيف الرموز والإشارات، وهو جوهر هذا النظام التواصلي المهني."
    - lemma: "إيمَاءٌ مِهْنِيٌّ"
      generation_method: tarkib
      justification: "مركّب وصفي يجمع 'إيمَاء' (الإشارة الخفية بالجسد أو اليد) مع 'مِهْنِيّ' للدلالة على الطابع الاحترافي الخاص بمجال الرهان."
    - lemma: "تَلَامُحٌ"
      generation_method: majaz
      justification: "مصدر تَفَاعُل من 'لَمَحَ' (نظر نظرة خاطفة سريعة)، مجاز إزاحي عن تبادل الإشارات الخاطفة بين المتواصلين سرًا؛ يُحيي دلالة اللمح الخاطف في السياق الإشاري."


# ── المرحلة ٢: جمع الأدلة ──
stage2_evidence:
  per_lemma:

    - lemma: "تيك تاك"
      evidence_status: "no_material_found"
      # ملاحظة إضافية: استعلام الجسر الإنجليزي وجد في المورد الحديث (2008)
      # أن "ticktack" يُترجم بـ"تكتكة / النقارة" (أداة الأطفال للنقر)،
      # لا بنظام إشارات الرهانين. الصيغة "تيك تاك" غائبة كليًا.

    - lemma: "شِفْرَةُ الأَيْدِي"
      confirm:
        - text: "«(محدثة) رموزٌ يستعملها فريق من الناس للتفاهم السرِّي فيما بينهم»"
          source: "المعجم الوسيط"
        - text: "«Cipher code: رابطة عُرْفية تقوم بين دوالَّ ومدلولاتٍ غير التى وُضعت لها أصلا بحيث لا يُدركها إلا من تواضعوا عليها»"
          source: "المعجم الكبير"
      expands:
        - text: "«مجموعة من القواعد تحكم تصرف الشخص، ولكن المعنى الأعم هو التخاطب بلغة لا يفهمها إلا الشخصان أو الجماعتان المتفقتان عليها»"
          source: "معجم المصطلحات الطبية ج.1 (1985)"
          addition: "يؤكد الطابع الاتفاقي الجماعي للشفرة، مما يُعضِّد استخدامها لوصف نظام الرهانين"
        - text: "«شَفْرَةٌ» بمعنى code في هندسة التحكم والمعلوماتية"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "يُثبت دخول 'شفرة' بمعنى رمز/نظام اتفاقي في المصطلحية العربية الحديثة"

    - lemma: "تَرَامُزٌ"
      confirm:
        - text: "«تَرَامَزَ القومُ: أشار بعضُهم إلى بعض»"
          source: "المعجم الكبير"
      expands:
        - text: "«الرَّاءُ وَالْمِيمُ وَالزَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَرَكَةٍ وَاضْطِرَابٍ. يُقَالُ كَتِيبَةٌ رَمَّازَةٌ: تَمُوجُ مِنْ نَوَاحِيهَا. وَيُقَالُ ضَرَبَهُ فَمَا ارْمَأَزَّ، أَيْ مَا تَحَرَّكَ. وَارْتَمَزَ أَيْضًا: تَحَرَّكَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر رمز في أصله دالٌّ على الحركة والاضطراب، مما يُفسّر انتقاله الدلالي إلى الإشارة والرمز"

    - lemma: "إيمَاءٌ مِهْنِيٌّ"
      confirm:
        - text: "«الإيماء: إلقاء المعنى في النفس بخفاء وسرعة»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الإيماء: هو الكلام المشار به إلى المطلوب من قرب لا مع الخفاء»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الإيماء: هو التنبيه وأن تشير برأسك أو بيدك أو بحابك»"
          source: "التعريفات الفقهية للبركتي"

    - lemma: "تَلَامُحٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──
stage3_analysis:
  per_lemma:

    - lemma: "تيك تاك"
      decision: removed
      decision_reason: >
        نقل صوتي خام (Arabized phonetic transcription) للفظة الإنجليزية ticktack؛ لا يملك جذرًا
        عربيًا ولا وزنًا صرفيًا معروفًا. غائب من جميع المعاجم العربية المستعلَمة. المورد الحديث
        (2008) يُترجم ticktack بـ"تكتكة" (المعنى الصوتي/الأداتي) لا بهذه الصيغة. فشل اختبار
        الاشتقاقية وإيثار العربي ويُسر التداول.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "شِفْرَةُ الأَيْدِي"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: يمكن إبدال "الأيدي" بـ"الأصابع" أو "الجسد" ويظل الوصف
        صالحًا ومقبولًا، مما يدل على أنه عبارة وصفية حرة لا مصطلح مسكوك. كذلك فإن المركّب
        "شفرة الأيدي" غير موثق في أي معجم. "شِفرة" وحدها مفيدة لكنها تفتقر إلى التحديد الكافي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "تَرَامُزٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        الفعل تَرَامَزَ موثق في المعجم الكبير بمعنى "أشار بعضُهم إلى بعض"، وهو بالضبط جوهر
        نظام تيك تاك (تبادل الإشارات السرية بين الرهانين). المصدر تَرَامُز على وزن تَفَاعُل
        صياغة قياسية معيارية تدل على المشاركة والتبادل. اجتاز اختبار السكّ (وحدة معجمية دالة
        بذاتها). اجتاز اختبار الاشتقاقية وإيثار التراثي وعدم الاشتراك اللفظي مع المعنى
        الموجود (التُّرامِز: صفة الجمل القوي، بضم التاء وكسر الميم، تختلف في الضبط اختلافًا
        واضحًا). فحص الاقتراض: جذر عربي أصيل؛ لا تعريب. فحص الملاءمة الصرفية: وزن تَفَاعُل
        ملائم لمعنى التشارك والتبادل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمة الوحيدة المؤكدة في المجموعة. تُبرز بنيتُها الصرفية (تفاعل = اشتراك طرفين)
        الجانبَ التبادلي في التواصل الإشاري، بعكس "إشارة" (أحادية الاتجاه) أو "شِفرة"
        (النظام المجرد دون التبادلية). الوحدة الصرفية تضمن دلالة "أشار بعضُهم إلى بعض"
        التي هي صميم الاستخدام المهني في ميدان الرهان.
      actions:
        - command: create_entry
          params:
            lemma: "تَرَامُزٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إيمَاءٌ مِهْنِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: "مِهْنِيّ" قابل للاستبدال بـ"سرِّي" أو "متخصص" أو
        "احترافي" ويظل الوصف مقبولًا، مما يكشف عن كونه عبارة وصفية حرة. فضلًا عن ذلك،
        "إيمَاء" يصف فعل الإشارة الفردية لا النظام الجماعي التبادلي المطلوب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "تَلَامُحٌ"
      source: stage1
      decision: removed
      decision_reason: >
        غير موثق في المعاجم المتاحة. الإحالة المجازية من "لَمَحَ" (النظر البصري الخاطف)
        إلى الإشارة اليدوية بعيدة وغير مأنوسة في الاستخدام المعجمي.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──
stage4_content:
  definition:
    current: "نظام للإشارات اليدوية يستخدمه صانعو المراهنات في سباقات الخيل"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مجمله لكنه يستخدم "صانعو المراهنات" وهي ترجمة حرفية
        لـ bookmakers غير مأنوسة. الأدق "الرَّهَّانون" (وكلاء الرهان الرسميون في الميدان)
        وهو موثق في مسرد الفن والتسلية والرياضة من ALECSO برقم 493022. كما أن البنية
        التعريفية تستفيد من ذكر الغرض الوظيفي (تبادل الأسعار والمعلومات).
    authored:
      - type: terminological
        text: "نِظَامٌ مِنَ الإيمَاءَاتِ اليَدَوِيَّةِ المُتَوَاضَعِ عَلَيهَا، يَتَوَاصَلُ بِهِ الرَّهَّانُونَ فِيمَا بَيْنَهُم فِي مَيَادِينِ سِبَاقِ الخَيلِ لِتَبَادُلِ أَسعَارِ الرِّهَانَاتِ وَمَعلُومَاتِ السِّبَاقِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نِظَامٌ مِنَ الإيمَاءَاتِ اليَدَوِيَّةِ المُتَوَاضَعِ عَلَيهَا، يَتَوَاصَلُ بِهِ الرَّهَّانُونَ فِيمَا بَيْنَهُم فِي مَيَادِينِ سِبَاقِ الخَيلِ لِتَبَادُلِ أَسعَارِ الرِّهَانَاتِ وَمَعلُومَاتِ السِّبَاقِ"

  examples:
    per_lemma:
      - lemma: "تَرَامُزٌ"
        examples:
          - text: "اعتمد الرَّهَّانون في الميدان على التَّرَامُزِ باليدين لإبلاغ الأسعار بعيدًا عن أسماع المنافسين ومرمى أبصارهم."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اعتمد الرَّهَّانون في الميدان على التَّرَامُزِ باليدين لإبلاغ الأسعار بعيدًا عن أسماع المنافسين ومرمى أبصارهم."


