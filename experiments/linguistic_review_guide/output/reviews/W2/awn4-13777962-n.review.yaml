# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13777962-n
# catch / haul — الكمية التي تم اصطيادها
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «حصيلة» دلالتها الأصلية «ما حصل من مال أو جهد / البقية» وليست مخصصة للصيد، فقد تكون فضفاضة جداً لهذه المجموعة"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية ويحتاج صياغة معجمية عربية"
    observations: "المجموعة تعبّر عن مفهوم «مقدار ما يُصاد» وهو مفهوم طبيعي في العربية، إذ يُستخدم لفظ «صَيْد» للدلالة على الفعل والمفعول معاً (المصدر واسم المفعول). أما «حصيلة» فلفظ عام يصلح للدلالة على نتيجة أي جمع أو تحصيل، ومنه حصيلة الصيد."

  blind_candidates:
    - lemma: "صَيْد"
      generation_method: ishtiqaq
      justification: "مصدر واسم مفعول من الجذر (ص ي د) على وزن فَعْل، يُطلق على فعل الاصطياد وعلى ما يُصاد، فيصلح للدلالة على الكمية المصطادة"
    - lemma: "حَصِيلَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ح ص ل) على وزن فَعِيلَة بمعنى اسم المفعول، تدل على ما حُصِّل وجُمِع، فتصلح للدلالة على مجموع ما اصطيد"
    - lemma: "غَنِيمَة"
      generation_method: majaz
      justification: "إزاحة دلالية من معنى «ما يُغنم في الحرب» إلى «ما يُحصَّل من الصيد»، بجامع الحصول على شيء بعد جهد وسعي"
    - lemma: "مَحْصُول"
      generation_method: ishtiqaq
      justification: "من الجذر (ح ص ل) على وزن مَفْعُول بمعنى ما حُصِّل، أي الناتج المجموع من أي نشاط بما فيه الصيد"


stage2_evidence:
  per_lemma:
    - lemma: "حَصِيلَة"
      confirm:
        - text: "«الحصيل حصيلة الضرائب وحصيلة الأرباح: ما حصل منها»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الحَصِيلُ . يقال : حصيلة الضرائب , وحصيلة الأرباح بَقِيَّةُ الشيء اللبُّ يَخرجُ من القشور»"
          source: "المعجم الكبير"
          addition: "يُوسّع المعنى ليشمل البقية والخلاصة بعد التحصيل"
        - text: "«حَصِيلَة من (ح ص ل) البقية وما يجمع من مال أو جهد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُضيف معنى الجمع من جهد، وهو أقرب لسياق الصيد"

    - lemma: "صَيْد"
      confirm:
        - text: "«الصيد لغة: تناول ما يظفر به مما كان ممتنعاً... وقد يسمى المصيد صيداً، ومنه {أُحِلَّ لَكُمْ صَيْدُ الْبَحْرِ}»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«مصدر بمعنى الاصطياد، ويطلق أيضاً على ما يصطاد»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«صادَهُ يَصيدُهُ ويَصادُهُ صَيْداً، أي اصطاده والصَيْدُ أيضاً: المَصيدُ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«صَيْد إلخ. وبخاصة: مقدار المَصِيد من السمك دفعةً واحدةً a large catch of fish»"
          source: "المورد الحديث"
      expands:
        - text: "«ما توحَّش بجناحيه أو بقوائمه مأكولاً كان أو غيرَ مأكول، ولا يؤخذ إلا بحيلة»"
          source: "التعريفات الفقهية للبركتي"
          addition: "يُبيّن أن الصيد يشمل المأكول وغيره ويُشترط فيه الامتناع والحيلة"

    - lemma: "غَنِيمَة"
      confirm:
        - text: "«(7) غنيمة؛ صيد» (في ترجمة haul)"
          source: "المورد الحديث"
      contradicts:
        - text: "«اسم لما يؤخذ من أموال الكفرة بقوة الغزاة، وقهر الكفرة على وجه يكون فيه إعلاء كلمة الله تعالى»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "الدلالة الأصلية مقصورة على غنائم الحرب لا الصيد"
        - text: "«ما حصل من الكفار عنوة بإيجاف خيل وركاب»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "تأكيد اختصاص الغنيمة بالسياق العسكري"

    - lemma: "مَحْصُول"
      contradicts:
        - text: "«الحاصل وما بقي من الشيء والخلاصة يُقال هذا محصول كلامه»"
          source: "المعجم الوسيط (الحوراني)"
          conflict: "الدلالة الأساسية هي الحاصل والخلاصة والبقية، وليس الكمية المصطادة"
        - text: "«نباتات تم زرعها وتنميتها لكي تحصد» (ترجمة crop)"
          source: "معجم البيئة والمناخ"
          conflict: "في الاستعمال الحديث تخصّص المحصول بالسياق الزراعي"


stage3_analysis:
  per_lemma:
    - lemma: "حَصِيلَة"
      decision: confirmed
      decision_reason: "لفظ فصيح من الجذر (ح ص ل) يدل على ما يُحصَّل ويُجمع. وإن كان استعماله المعجمي الأشهر في سياق المال والضرائب، فإن بنيته الاشتقاقية (فَعِيلة بمعنى مفعول) تسمح بالتعميم على أي تحصيل بما فيه الصيد. يصلح مرادفاً عاماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على المقدار الإجمالي المُحصَّل من أي نشاط (صيد أو غيره)، وتؤكد الجانب الكمي التراكمي لا فعل الاصطياد ذاته"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَصِيلَة"

    - lemma: "صَيْد"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل ثابت في المعاجم الكلاسيكية والحديثة، يُطلق على فعل الاصطياد وعلى المصيد نفسه. المورد الحديث يذكر صراحةً «مقدار المصيد من السمك دفعةً واحدةً» وهو المعنى المطابق لهذه المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على ما يُصاد تحديداً (حيوان ممتنع يُؤخذ بحيلة)، فهو أخصّ من حصيلة ومرتبط بفعل الاصطياد ذاته"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَيْد"

    - lemma: "غَنِيمَة"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الأصلية والاصطلاحية مقصورة على ما يؤخذ من أموال العدو في الحرب. ورود اللفظ في المورد الحديث كترجمة لـ haul لا يكفي لإثبات استقلال المعنى الصيدي في العربية."
      evidence_assessment:
        case: mixed

    - lemma: "مَحْصُول"
      source: stage1
      decision: removed
      decision_reason: "تخصّص اللفظ في العربية المعاصرة بالسياق الزراعي (crop/harvest)، وفي الكلاسيكية بمعنى الخلاصة والبقية. لا دليل على استعماله بمعنى كمية الصيد."
      evidence_assessment:
        case: contradicts_only


