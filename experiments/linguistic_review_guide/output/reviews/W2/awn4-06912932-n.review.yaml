          text: "يَعُدُّ اللِّسَانِيُّونَ النَّحْوَ الْعَرَبِيَّ لُغَةً وَاصِفَةً تُحَلِّلُ بِنْيَةَ الْجُمْلَةِ الْعَرَبِيَّةِ وَتَضْبِطُ قَوَاعِدَهَا."
      - command: add_sense_example
        params:
