          text: "لَا يُمْكِنُ دِرَاسَةُ أَيِّ لُغَةٍ طَبِيعِيَّةٍ دُونَ اللُّجُوءِ إِلَى مَا فَوْقَ اللُّغَةِ لِتَعْرِيفِ مَفَاهِيمِهَا الصَّرْفِيَّةِ وَالنَّحْوِيَّةِ."

