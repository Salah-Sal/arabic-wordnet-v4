# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06912932-n (metalanguage)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «ميتالغة» تعريب هجين يجمع سابقة يونانية (meta-) مع لفظ عربي (لغة) دون اتّباع قواعد التعريب المعيارية"
      - "اللمّة «لغة واصفة» لا تحمل تشكيلاً كاملاً في المدخل الحالي"
      - "التعريف العربي الحالي مختصر جداً ولا يميّز بين اللغة الواصفة واللغة الموضوع"
    observations: "المفهوم ينتمي إلى حقل اللسانيات والمنطق الرياضي، وله مقابلات عربية مؤسسية مثبتة في معاجم المنظمة العربية للتربية والثقافة والعلوم (أليكسو). المركب الوصفي «لغة واصفة» هو الأكثر شيوعاً واعتماداً في المعاجم المتخصصة، ويتّسق مع نمط التسمية العربية القائم على الوصف الوظيفي. ثمة بدائل أخرى مثل «ما فوق اللغة» في بعض المعاجم اللسانية."
  blind_candidates:
    - lemma: "لُغَة فَوْقِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «لغة» + «فوقية» (نسبة إلى فوق)، يعكس فكرة اللغة التي تعلو اللغة الموصوفة في المرتبة، على غرار المصطلح الإنجليزي meta- بمعنى «ما وراء» أو «ما فوق»"
    - lemma: "مَا فَوْقَ اللُّغَة"
      generation_method: tarkib
      justification: "تركيب إضافي شبه جملي يطابق البنية المفهومية للمصطلح: لغة تقع فوق (أي في مرتبة أعلى من) اللغة المدروسة، على نسق «ما وراء الطبيعة» و«ما فوق الصوت»"
    - lemma: "لِسَان وَاصِف"
      generation_method: tarkib
      justification: "مركب وصفي يستعمل «لسان» بديلاً عن «لغة» مع اسم الفاعل «واصف» من وَصَفَ، للدلالة على أداة الوصف اللغوي"
    - lemma: "لُغَة عُلْيَا"
      generation_method: tarkib
      justification: "مركب وصفي يصف مرتبة اللغة الواصفة بوصفها الأعلى في سلّم التحليل اللغوي، على نسق «محكمة عليا»"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "لُغَة وَاصِفَة"
      confirm:
        - text: "«لغة اصطلاحية تهدف إلى وصف اللغة الطبيعية.»"
          source: "مسرد الإعلام والتواصل، أليكسو (ArabTerm)"
        - text: "«لغة اصطلاحية خاصة لوصف لغة أو ظاهرة ما»"
          source: "مسرد الفن والتسلية والرياضة، أليكسو (ArabTerm)"
        - text: "«لغة اصطناعية تهدف إلى وصف اللغة الطبيعية، تستعمل مصطلحات مأخوذة من اللغة المراد وصفها غير أنها ذات دلالة خاصة، ومنها: لغة النحو التي تصف اللغة الطبيعية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«يشير إلى تفويض اللغة لتحل محل شيء آخر، بتمثيل واقع عبر علامات كلمات، تكون لغة واصفة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل «تمثيل»"
          addition: "يوضح العلاقة بين التمثيل اللغوي واللغة الواصفة بوصفها نظام علامات"

    - lemma: "مِيتَالُغَة"
      evidence_status: "no_material_found"

    - lemma: "لُغَة فَوْقِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مَا فَوْقَ اللُّغَة"
      confirm:
        - text: "«لغة ثانوية في مرتبة اللغات لإنجاز حقيقة مألوفة وغير علمية، وهي لغة قابلة للتكلم عن نفسها وغيرها.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«ما وراء اللغة (ل).»"
          source: "المورد الحديث (2008)"
          addition: "صيغة بديلة «ما وراء اللغة» مستعملة أيضاً كمرادف"

    - lemma: "لِسَان وَاصِف"
      evidence_status: "no_material_found"

    - lemma: "لُغَة عُلْيَا"
      evidence_status: "no_material_found"

    - lemma: "لُغَة مُتَرَفِّعَة"
      confirm:
        - text: "«لغةٌ تُستعمَلُ لوصفِ لغاتٍ أخرى. فمثلاً، Backus-Naur form هي لغةٌ مترفعة تُستعمَلُ عموماً لتعريف لغات برمجة.»"
          source: "معجم مصطلحات المعلوماتية (2000)"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١ ──
    - lemma: "لُغَة وَاصِفَة"
      decision: confirmed
      decision_reason: "مصطلح موثّق في ثلاثة معاجم متخصصة صادرة عن أليكسو (الإعلام والتواصل، الفنون، اللسانيات)، وهو مركب وصفي عربي صرف يتّسق مع نمط التسمية الوظيفية. المعجم الموحد لمصطلحات اللسانيات (2002) يعتمده بوصفه المقابل الرسمي لـ metalanguage."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يؤكّد الوظيفة الوصفية للغة (واصفة = التي تَصِف)، وهو المصطلح المعتمد مؤسسياً في حقل اللسانيات العربية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُغَة وَاصِفَة"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "مِيتَالُغَة"
      decision: removed
      decision_reason: "تعريب هجين يجمع السابقة اليونانية meta- مع الجذع العربي «لغة» دون إخضاعه لقواعد التعريب المعيارية. لا يوجد له أي توثيق معجمي في قاعدة البيانات (لا في المعاجم الكلاسيكية ولا في المعاجم المصطلحية الحديثة). البديل العربي «لغة واصفة» متوفّر ومعتمد مؤسسياً، فلا حاجة للتعريب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: ما فوق اللغة ──
    - lemma: "مَا فَوْقَ اللُّغَة"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق في المعجم الموحد لمصطلحات اللسانيات (2002) كمقابل لـ metalanguage، وله صيغة مرادفة «ما وراء اللغة» في المورد الحديث (2008). يُكمل «لغة واصفة» بتسليط الضوء على البُعد التراتبي (فوق = meta) بدل البُعد الوظيفي (واصفة = describing). التركيب يتّسق مع نمط عربي مألوف: «ما وراء الطبيعة»، «ما فوق الصوت»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يبرز البُعد التراتبي والمرتبي للمفهوم (لغة تعلو اللغة الموصوفة)، بخلاف «لغة واصفة» الذي يبرز الوظيفة"
      actions:
        - command: create_entry
          params:
            lemma: "مَا فَوْقَ اللُّغَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: لغة فوقية ──
    - lemma: "لُغَة فَوْقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي توثيق معجمي لهذا المركب. الصيغة الموثّقة هي «ما فوق اللغة» لا «لغة فوقية». التركيب المولَّد لا يتمتع بتثبيت معجمي."

    # ── مرشح المرحلة ١: لسان واصف ──
    - lemma: "لِسَان وَاصِف"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي توثيق معجمي. استعمال «لسان» بمعنى «لغة» في السياق المصطلحي الحديث نادر جداً، والمصطلح المعتمد مؤسسياً هو «لغة واصفة» لا «لسان واصف»."

    # ── مرشح المرحلة ١: لغة عليا ──
    - lemma: "لُغَة عُلْيَا"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على توثيق لهذا المركب بدلالة اللغة الواصفة. «عليا» تفيد التفضيل المطلق وقد تُلبَس بدلالات أخرى (لغة رفيعة المستوى). المصطلحات الموثّقة أدق وأوضح."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "لغة يمكن استخدامها لوصف اللغات"
    assessment:
      decision: revise
      reason: "التعريف الحالي مختصر ومبهم، لا يميّز بين اللغة الواصفة واللغة الموضوع، ولا يشير إلى السياق اللساني أو المنطقي. يحتاج إلى تعريف مصطلحي أدق بأسلوب المعجم الوسيط."
    authored:
      - type: terminological
        text: "لُغَةٌ اصْطِلاحِيَّةٌ تُسْتَعْمَلُ لِوَصْفِ لُغَةٍ أُخْرَى أَوْ تَحْلِيلِ بِنْيَتِهَا، تَقَعُ فِي مَرْتَبَةٍ أَعْلَى مِنَ اللُّغَةِ الْمَوْصُوفَةِ (لُغَةِ الْمَوْضُوعِ) فِي سُلَّمِ التَّحْلِيلِ اللُّغَوِيِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "لُغَةٌ تُتَّخَذُ أَدَاةً لِوَصْفِ لُغَةٍ طَبِيعِيَّةٍ أَوِ اصْطِنَاعِيَّةٍ وَتَحْلِيلِ قَوَاعِدِهَا وَمُفْرَدَاتِهَا، تَسْتَعِيرُ مُصْطَلَحَاتِهَا مِنَ اللُّغَةِ الْمُرَادِ وَصْفُهَا لَكِنْ بِدَلالاتٍ مُحَدَّدَةٍ خَاصَّةٍ، كَلُغَةِ النَّحْوِ الَّتِي تَصِفُ اللُّغَةَ الطَّبِيعِيَّةَ وَصِيغَةِ بَاكُوس-نَاوْر الَّتِي تُعَرِّفُ لُغَاتِ الْبَرْمَجَةِ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "لُغَةٌ اصْطِلاحِيَّةٌ تُسْتَعْمَلُ لِوَصْفِ لُغَةٍ أُخْرَى أَوْ تَحْلِيلِ بِنْيَتِهَا، تَقَعُ فِي مَرْتَبَةٍ أَعْلَى مِنَ اللُّغَةِ الْمَوْصُوفَةِ (لُغَةِ الْمَوْضُوعِ) فِي سُلَّمِ التَّحْلِيلِ اللُّغَوِيِّ."

  examples:
    per_lemma:
      - lemma: "لُغَة وَاصِفَة"
        examples:
          - text: "يَعُدُّ اللِّسَانِيُّونَ النَّحْوَ الْعَرَبِيَّ لُغَةً وَاصِفَةً تُحَلِّلُ بِنْيَةَ الْجُمْلَةِ الْعَرَبِيَّةِ وَتَضْبِطُ قَوَاعِدَهَا."
