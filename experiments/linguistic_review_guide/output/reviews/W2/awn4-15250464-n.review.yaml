          source: "المعجم الوسيط"
          addition: "تعريف عام يؤكد دلالة الوسط"

    - lemma: "مُنْتَصَفُ الْمُدَّةِ"
      confirm:
        - text: "«(الْمدَّة) مِقْدَار من الزَّمَان يَقع على الْقَلِيل وَالْكثير يُقَال أَقمت عِنْده مُدَّة مديدة وقتا طَويلا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«من كلِّ شيء: وسطه»"
          source: "المعجم الوسيط"
          addition: "المنتصف + المدة الزمنية = منتصف الفترة الزمنية"

    - lemma: "مُنْتَصَف"
      confirm:
        - text: "«من كلِّ شيء: وسطه»"
          source: "المعجم الوسيط"
        - text: "«مُنْتَصَف من (ن ص ف) وسط كل شيء، والمستوفي حقه كاملا.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

