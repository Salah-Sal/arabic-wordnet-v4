stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يجمع بين معنيين مختلفين (أكاديمي وسياسي) في لمّة واحدة دون تمييز واضح"
      - "اللمّتان الموجودتان (منتصف الفصل / منتصف المدة) مركّبات إضافية وصفية حرة وليست مصطلحات مسكوكة بالكامل"
      - "اللمّتان بدون تشكيل"
    observations: "المفهوم يدلّ على نقطة زمنية تقع في منتصف فترة محدّدة — إمّا فصل دراسي أو ولاية سياسية. في العربية المعاصرة يُستخدم تعبير «منتصف الفصل» في السياق الأكاديمي و«منتصف الولاية» في السياق السياسي. المفهوم وافد من النظام الأكاديمي والسياسي الغربي ولا يوجد له لفظ عربي تراثي مفرد."
  blind_candidates:
    - lemma: "مُنْتَصَف"
      generation_method: ishtiqaq
      justification: "اسم مكان وزمان على وزن مُفْتَعَل من الجذر ن ص ف، يدلّ على وسط الشيء زماناً ومكاناً. ورد في المعجم الوسيط بمعنى «وسط كل شيء». يصلح كلمّة مفردة جامعة للدلالة على نقطة المنتصف الزمني"
    - lemma: "مُنْتَصَفُ الْفَصْلِ"
      generation_method: tarkib
      justification: "مركّب إضافي ثابت يجمع بين المنتصف والفصل الدراسي، مسجّل في المورد الحديث مقابل midterm. تعبير مسكوك في الاستعمال الأكاديمي العربي المعاصر"
    - lemma: "مُنْتَصَفُ الْمُدَّةِ"
      generation_method: tarkib
      justification: "مركّب إضافي يجمع بين المنتصف والمدة الزمنية، يُستخدم في السياق السياسي والإداري للإشارة إلى منتصف فترة الولاية"
    - lemma: "نِصْفُ الْمُدَّةِ"
      generation_method: tarkib
      justification: "مركّب إضافي بديل باستخدام نِصف بدل مُنتصَف، شائع في الاستعمال العام لكنه أقل تخصصاً من مُنتصَف"

