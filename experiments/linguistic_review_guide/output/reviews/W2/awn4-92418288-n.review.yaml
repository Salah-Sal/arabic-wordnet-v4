# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «لا تجارية» مكتوبة على هيئة عبارتين منفصلتين (لا + تجارية) بدل صياغتها مركّباً واحداً مُدغماً، مما يوهم بأنها نفي جملي لا مصطلح اسمي"
      - "غياب التشكيل الكامل عن اللمّة الوحيدة"
      - "الصيغة وصفية تعمل نعتاً لا اسم خاصيّة، بينما المجموعة من صنف الخاصّيّة (property noun)"
      - "معرّف ILI فارغ (null) — المجموعة بحاجة إلى ربط بـ ILI إن وُجد مقابل في Princeton WordNet"
    observations: >
      المجموعة تمثّل مفهوم «اللاتجارية» (noncommercialism) بوصفه خاصّيَّةً جوهريّةً تنتمي إلى الجنس الأعلى
      «خاصّيّة أساسيّة مشتركة بين جميع أفراد صنف ما». الإشكال المركزي: اللمّة الحالية «لا تجارية» صيغتُها
      صفة (نعت) لا اسم خاصيّة، فضلاً عن الفصل الخطّي بين «لا-» النافية والأساس الصرفي «تجارية».
      الصواب أن تُكتب «اللَّاتِّجَارِيَّة» — مركَّبٌ واحدٌ بإدغام تاء «تجارية» في لام «لا-» النافية،
      على قياس «اللامركزيّة» و«اللاعنفيّة» و«اللاربحيّة». والتعريف الحالي مقبول المضمون لكن يحتاج تحرير.

  blind_candidates:
    - lemma: "اللَّاتِّجَارِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر «ت ج ر» بإلحاق السابقة النافية «لا-» بكلمة «تِجَارِيَّة» مع إدغام التاءين،
        ثم إلحاق «ال-» لتحويلها إلى اسم خاصّيّة مُعرَّف. القياس منتج في العربية الحديثة:
        (لامركزية، لاعنفية، لاسلكية، لاربحية). الوزن: اسم خاصية مصدرية صناعية.

    - lemma: "اللَّارِبْحِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر «ر ب ح» بالصيغة ذاتها (لا- + ربحية). هذا المرشح يُعبّر عن الجانب الأوضح
        في التعريف — وهو غياب الهدف الربحي — لكنه أضيق من المفهوم الكامل لانعدام الطابع التجاري.

    - lemma: "عَدَمُ التِّجَارِيَّة"
      generation_method: tarkib
      justification: >
        مركَّب إضافي من «عَدَم» (المصدر الدالّ على الانتفاء) + «التِّجَارِيَّة» (الاسم المصدري
        الصناعي من «تجارة»). التركيب الإضافي بـ«عدم» منتج في المصطلحية العربية الحديثة
        (عدم المساواة، عدم الاستقرار، عدم الانحياز).

    - lemma: "الزُّهْدُ التِّجَارِيّ"
      generation_method: majaz
      justification: >
        مجاز استعاري: «الزُّهْد» في العربية هو الإعراض عن الدنيا وزخرفها وترك المطامع المادية،
        فيمكن إزاحته دلالياً ليدلّ على الإعراض عن التجارة والمكسب. غير أن الزهد في أصله
        يدلّ على القِلَّة (ابن فارس: «يدلّ على قلّة الشيء») لا على الانعدام، مما يُضعف الدقة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  queries_run:
    - "Q1: Batch headword lookup — existing lemma + component words + all candidates"
    - "Q2: English bridge — noncommercialism / non-commercial / non-profit / uncommercial"
    - "Q3: Arabic FTS — لاتجارية / غير تجاري / اللاتجارية"
    - "Q4: Maqayis al-Lugha — جذور: تجر، ربح، زهد"

  per_lemma:
    - lemma: "لا تجارية"
      confirm:
        - text: "«(1) غير تجاريّ (2) غير مُرْبح؛ غير مُجْزٍ.» — مقابل: uncommercial"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: "«مؤسسة غير تجارية — لا تستهدف الربح»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM"
      expands:
        - text: "«غير ربحيّ، لا ربحيّ» — مقابل: non-profit"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
          addition: "يُثبت أن نمط «لا-» النافية + اسم مستخدم في العربية المعيارية للتقنين (لا ربحيّ)"
        - text: "«اتّحاد غير تجاري، مقرّه في العاصمة الأمركية واشنطن»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — ARABTERM"
          addition: "يكشف أن «غير تجاري» هو النمط الأكثر تداولاً في التقنين العربي لهذا المفهوم"

    - lemma: "اللَّاتِّجَارِيَّة"
      expands:
        - text: "«(1) غير تجاريّ (2) غير مُرْبح؛ غير مُجْزٍ.» — uncommercial"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يُثبت الدلالة لكن يستخدم صيغة «غير تجاريّ» لا «اللاتجارية»؛ المركَّب المسكوك غائب عن المعاجم المُستعلَمة"
        - text: "«التَّاءُ وَالْجِيمُ وَالرَّاءُ، التِّجَارَةُ مَعْرُوفَةٌ. وَيُقَالُ تَاجِرٌ وَتَجْرٌ، كَمَا يُقَالُ صَاحِبٌ وَصَحْبٌ. وَلَا تَكَادُ تُرَى تَاءٌ بَعْدَهَا جِيمٌ.»"
          source: "مقاييس اللغة لابن فارس — entry_id: 985434"
          addition: "يُرسّخ الأصل الثلاثي ت ج ر ويُثبت الجذر بلا خلاف"

    - lemma: "اللَّارِبْحِيَّة"
      confirm:
        - text: "«غير ربحيّ، لا ربحيّ» — non-profit"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
        - text: "«غير ربحية وغير هادفة للربح: نوعان من المنظمات التي لا يتوقع أو لا يسمح لها بتحقيق الربح»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ARABTERM"
      contradicts:
        - text: "«الرَّاءُ وَالْبَاءُ وَالْحَاءُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى شَِفٍّ فِي مُبَايَعَةٍ. مِنْ ذَلِكَ رَبِحَ فُلَانٌ فِي بَيْعِهِ»"
          source: "مقاييس اللغة لابن فارس — entry_id: 986448"
          conflict: "جذر ربح خاص بالربح في البيع والمبايعة، وهو أضيق من مفهوم «انعدام الطابع التجاري» الذي هو موضوع المجموعة"

    - lemma: "عَدَمُ التِّجَارِيَّة"
      expands:
        - text: "«مؤسسة غير تجارية — لا تستهدف الربح»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM"
          addition: "يُثبت الدلالة لكن يستخدم «غير تجارية» لا «عدم التجارية»"
      evidence_status: "no_material_found"

    - lemma: "الزُّهْدُ التِّجَارِيّ"
      contradicts:
        - text: "«الزَّاءُ وَالْهَاءُ وَالدَّالُ أَصْلٌ يَدُلُّ عَلَى قِلَّةِ الشَّيْءِ. وَالزَّهِيدُ: الشَّيْءُ الْقَلِيلُ. وَهُوَ مُزْهِدٌ: قَلِيلُ الْمَالِ... قَالَ الْخَلِيلُ: الزَّهَادَةُ فِي الدُّنْيَا، وَالزُّهْدُ فِي الدِّينِ خَاصَّةً.»"
