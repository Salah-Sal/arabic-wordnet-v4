# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "لا تجارية"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة المعنى وتمثّل المفهوم المقصود. غير أنها تحتاج إصلاحَين: (أ) تصحيح الكتابة
        من كلمتين منفصلتين إلى مركّب واحد «اللَّاتِّجَارِيَّة» بإدغام لا- النافية في تاء تجارية
        وإضافة ال- التعريف لتستقيم اسماً لخاصيّة (property noun)، (ب) إضافة التشكيل الكامل.
      evidence_assessment:
        case: mixed
      morphological_check: >
        كتابة «لا تجارية» بفصل أداة النفي عن الأساس يُحيل إلى نفي جملي أو وصف اسمي حرّ،
        لا إلى مصطلح مسكوك. القياس الصرفي الصحيح: لا- (سابقة نافية) + تِجَارِيَّة (اسم نسبة)
        = اللَّاتِّجَارِيَّة، كما في: لامركزيّة / لاعنفيّة / لاسلكيّة.
      loan_check:
        lexical_borrowing: "لا اقتراض — الجذر عربي صريح"
        calque_check: "الصيغة نمط اشتقاقي مقيس لا ترجمة حرفية عمياء"
      quality_gate:
        consistency: "منسجم مع نمط اشتقاق المصطلحات المنفيّة في العربية"
        ease_of_use: "جيّد بعد التصحيح"
        suitability: "ملائم لسياق الخاصّيّة المجرّدة"
        heritage_preference: "تراثي الجذر"
        arabic_preference: "عربي خالص"
        derivability: "قابل للإلحاق بالمشتقات"
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة في المجموعة؛ تُحيل مباشرةً إلى خاصّيّة انعدام الطابع التجاري أو السعي إلى الربح في النشاط أو المؤسسة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اللَّاتِّجَارِيَّة"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "اللَّاتِّجَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو نفسه الشكل المُصحَّح للمّة الموجودة «لا تجارية»؛ الإجراء المطلوب تصحيح
        اللمّة الحالية لا إنشاء مدخل جديد. إنشاء مدخل إضافي سيُفضي إلى تكرار في المجموعة.

    - lemma: "اللَّارِبْحِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «اللاربحية» مفهوم أضيق دلالياً من موضوع المجموعة: قد تكون المؤسسة تجارية الطابع
        لكنها غير ربحية (كالشركات التعاونية)، كما أن المجموعة تدور على غياب الانخراط في
        المشاريع التجارية لا على غياب الربح وحده. خلط المفهومَين يُشوّش الشبكة الدلالية.
      evidence_assessment:
        case: mixed

    - lemma: "عَدَمُ التِّجَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا يجتاز اختبار السكّ المعجمي: يمكن إبدال «التجارية» بـ«الطابع التجاري» أو «الاتجار»
        فيبقى التعبير وصفاً لا مصطلحاً مسكوكاً. فضلاً عن ذلك لم يُعثر على «عدم التجارية»
        كوحدة معجمية ثابتة في المعاجم المُستعلَمة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "الزُّهْدُ التِّجَارِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        الزهد يدلّ أصلاً على القِلَّة ثم يُخصَّص شرعاً بالإعراض عن الدنيا (ابن فارس). توظيفه
        في سياق غياب الطابع التجاري مجاز بعيد يُفقد الدقة، ويُشرك اللفظ بين الدلالة الدينية
        والدلالة الاقتصادية بلا مسوّغ اصطلاحي. لم يُعثر له على شاهد تقنيني.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


