  per_entry:
    - lemma: "رَابِط"
      entry_id: "{auto}"
      root: "ربط"
      maqayis_quote: "«الرَّاءُ وَالْبَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى شَدٍّ وَثَبَاتٍ. مِنْ ذَلِكَ رَبَطْتُ الشَّيْءَ أَرْبِطُهُ رَبْطًا; وَالَّذِي يُشَدُّ بِهِ رِبَاطٌ.»"
    - lemma: "وَصْلَة"
