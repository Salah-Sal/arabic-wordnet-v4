# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "بند"
      decision: confirmed
      decision_reason: >
        رغم أن «بند» كلمة فارسية معرَّبة، فإنها استُوطنت في العربية الحديثة استيطانًا
        واسعًا وتوثّقت في المعجم الوسيط والمعجم الكبير ومعجم اللغة العربية المعاصرة
        وعشرات المصطلحات التقنية في ARABTERM (طب، كهرباء، تعليم، تجارة). معجم الصواب
        يقبلها في النهاية ضمن «الفصيح» وإن كان يُفضِّل «مادة» في السياق التشريعي.
        وهي اللمّة الأشمل والأكثر تداولاً للدلالة على «البند» في مجالات متعددة لا تقتصر
        على القانون. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        بَنْدٌ أعمّ استخدامًا: يشمل بنود الميزانية والقوانين والعقود وجداول الأعمال
        والقوائم التقنية. يُصاغ جمعه بُنود وبِنود. الفارق عن «فقرة» أن بند وحدة
        تعدادية مستقلة، بينما فقرة وحدة نصية أسلوبية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَنْدٌ"

    - lemma: "فقرة"
      decision: confirmed
      decision_reason: >
        «فقرة» عربية أصيلة من الجذر ف-ق-ر (الانفراج والفصل) موثَّقة في المعجم الوسيط
        وكشاف اصطلاحات الفنون والتوقيف على مهمات التعاريف. تدل على الوحدة النصية أو
        التشريعية المستقلة. واردة في ARABTERM بمعنى paragraph في الإعلام واللسانيات.
        وإن كانت أخصّ من المعنى الإنجليزي العام «item»، إلا أنها تغطّي الوجه النصي
        والتشريعي الذي لا تغطيه «بند» وحده. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        فِقْرَةٌ أخصّ بالوحدة النثرية الأسلوبية والبند التشريعي الفرعي (فقرة من مادة
        قانونية). مجازها الأصلي من فَقَار الظهر يُحيل إلى الانفصال الدقيق بين
        وحدات متشابهة. الفارق عن «بند» أنها تُشير إلى الوحدة النصية المترابطة الكلام
        أكثر من الإشارة إلى عنصر مجرد في قائمة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِقْرَةٌ"

    - lemma: "مُدْرَجٌ"
      source: stage1
      decision: removed
      decision_reason: >
        مُدرَج محمول على معانٍ راسخة في المعاجم لا تتقاطع مع «بند في قائمة»: مدرج
        الطائرات (runway)، ومكان ذو مقاعد متدرجة (amphitheater)، ومصطلح الحديث (hadith
        interpolation). لا دليل معجمي على استخدامه للدلالة على العنصر المتمايز في
        قائمة مُحصاة.

    - lemma: "قَيْدٌ"
      source: stage1
      decision: removed
      decision_reason: >
        القيد أصله الحبس والتقييد، ومجازه في المحاسبة «entry» (قيد محاسبي) وهو أخصّ
        من المفهوم المطلوب. معجم الصواب يرفض استخدامه بمعنى «التسجيل» في اللغة العامة.
        فضلاً عن أن قيد المحاسبي يُشير إلى عملية التدوين لا إلى العنصر المتمايز في
        قائمة.

    - lemma: "تَفْصِيلَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المصطلح في المعاجم المستعملة. وإن كان الاشتقاق سليمًا
        صرفيًا (تَفْعِيلَة من فَصَلَ)، إلا أن اختبار التثبيت المعجمي يُفشله: الكلمة
        غير مُسكَّكة ولا مُستعملة كمصطلح مقنَّن.

    - lemma: "مَادَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «مادة» عربية أصيلة ومقبولة للدلالة على البند القانوني، لكنها في هذا المجال
        تُشير إلى المادة الأولى والثانية (article) التي تضمّ بدورها فقرات وبنودًا —
        أي أنها تنتمي إلى مستوى هرمي أعلى. إضافتها إلى هذا السينسيت يُلبّس العلاقة
        مع المجموعات المجاورة. كما أن دلالتها الأشهر في المعاجم التقنية هي
        matter/substance/material، مما يزيد اللبس.


