# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (بند، فقرة) بلا تشكيل كامل"
      - "بند كلمة فارسية معرَّبة لا جذر عربي لها؛ يستوجب ذلك توثيق مأخذها"
      - "فقرة تُشير أصلاً إلى وحدة نصية (فقرة نثرية) أو تشريعية، وهي أخصّ من المفهوم الإنجليزي العام item"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية وليس على أسلوب المعجم الوسيط"
      - "غياب أي مرادفات تراثية للمفهوم في المجموعة"
    observations: >
      المجموعة تعبّر عن مفهوم «البند/العنصر» بوصفه وحدةً مُحدَّدةً متمايزةً
      ضمن مجموعةٍ قابلةٍ للتعداد. اللمّة «بند» فارسية الأصل معرَّبة، ودخلت العربية
      الحديثة عبر الاصطلاح القانوني والإداري. «فقرة» عربية أصيلة من فَقَارِ الظهر
      (استعارة من الحُزُوز والفصول)، وتدلّ في الاستعمال المعاصر على الوحدة النصية
      الأسلوبية أو البند التشريعي الفرعي. ثمة فرق دقيق بين اللمّتين يوجب الإبقاء
      عليهما معًا مع توثيق الفارق.

  blind_candidates:
    - lemma: "مُدْرَجٌ"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من الجذر د-ر-ج على وزن مُفْعَل؛ ما أُدرج في قائمة أو سُجِّل فيها.
        الاشتقاق من معنى «التتابع والمضيّ» يناسب فكرة البنود المتتالية في القائمة.
    - lemma: "قَيْدٌ"
      generation_method: majaz
      justification: >
        مجاز مرسل: الأصل الربطُ والتثبيت، ثم توسّعت الدلالة لتشمل ما يُدوَّن
        ويُسجَّل في الدفاتر والقوائم؛ وهو مستعمل في المحاسبة للدلالة على كل إدخال
        منفصل في السجل.
    - lemma: "تَفْصِيلَةٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ف-ص-ل على وزن تَفْعِيلَة؛ تدلّ على الجزء المفصول المتميّز الذي
        ينتزع من الكلّ ويُذكر على حِدَة في سياق التفصيل والتعداد.
    - lemma: "مَادَّةٌ"
      generation_method: majaz
      justification: >
        مجاز: الأصل ما يمدّ الشيء ويُغذّيه، ثم توسّعت الدلالة لتشمل البند أو
        المادة في النصوص القانونية والقوائم. معجم الصواب يرجّحها على «بند» في
        السياق التشريعي.


