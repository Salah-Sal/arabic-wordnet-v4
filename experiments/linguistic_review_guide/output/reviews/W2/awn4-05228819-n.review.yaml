      decision: confirmed
      decision_reason: "مصطلح تشريحي مستقر وشائع في الاستعمال الطبي للتعبير عن الجزء الرئيسي للعضو."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على القسم الأكبر والأساسي من العضو الذي تتركز فيه الوظيفة، وهي اللمة الأصلية."
      example: "يمتد جسم العظم الطويل بين نهايتيه المتمفصلتين."
    - lemma: "جَدْل"
      source: step05
      decision: removed
      decision_reason: "مصطلح أضيق دلالة، يغلب استعماله لجذع أو ساق العظم الطويل (shaft) وليس لكل الأعضاء."
      step05_citation: "«جَدْل، عَمْد، جِسْمٌ [corpus]» — المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "أضيق دلالة من الجسم، ويخص العظام الطويلة غالباً."
    - lemma: "مَتْن"
      source: step05
      decision: removed
      decision_reason: "يغلب استعماله مجازاً في النصوص (متن الكتاب) أكثر من التشريح البدني للمفردات التشريحية."
      step05_citation: "اقتراح لغوي (مجاز)"
