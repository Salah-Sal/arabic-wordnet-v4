    concerns:
      - "المجموعة تحوي لمّة واحدة فقط (عملية سولفاي) وهي مركب إضافي من اسم عملية + اسم علم أجنبي"
      - "اللمّة الموجودة بلا تشكيل"
      - "لا يوجد تعريف عربي أصيل — التعريف الحالي يبدو مترجماً حرفياً من الإنجليزية"
    observations: "هذا مفهوم كيميائي صناعي حديث منسوب إلى العالم البلجيكي إرنست سولفاي. المصطلحات المنسوبة إلى أعلام أجانب في الكيمياء تُنقل عادةً بالتعريب مع إضافة كلمة عامة (عملية، طريقة، تفاعل). لا يُتوقع وجود لفظ تراثي عربي لهذا المفهوم."
  blind_candidates:
    - lemma: "عَمَلِيَّةُ سُولْفَاي"
      generation_method: tarkib
      justification: "مركب إضافي من «عملية» (مصدر صناعي من عمل) واسم العالم المُعرَّب «سولفاي»، وهو الأشيع في المراجع العربية الحديثة"
    - lemma: "طَرِيقَةُ سُولْفَاي"
      generation_method: tarkib
      justification: "مركب إضافي بديل يستخدم «طريقة» بدل «عملية»، وكلاهما شائع في المصطلحات الكيميائية العربية"
    - lemma: "طَرِيقَةُ سَلْفَاي"
      generation_method: tarkib
      justification: "صيغة تعريب بديلة للاسم الأجنبي Solvay بإسقاط الواو، وردت في بعض المعاجم الموحدة"
    - lemma: "عَمَلِيَّةُ الْأَمُونْيَا-صُودَا"
      generation_method: tarkib
      justification: "مركب وصفي يسمّي العملية بمكوّناتها الرئيسية (الأمونيا والصودا) بدل اسم المخترع، مستخدم في الأدبيات الكيميائية"

