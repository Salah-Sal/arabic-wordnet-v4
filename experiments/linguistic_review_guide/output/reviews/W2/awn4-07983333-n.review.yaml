      entry_id: "{auto}"
      root: "قطع"
      maqayis_quote: "«الْقَافُ وَالطَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى صَرْمٍ وَإِبَانَةِ شَيْءٍ مِنْ شَيْءٍ... وَأَقْطَعْتُ الرَّجُلَ إِقْطَاعًا، كَأَنَّهُ طَائِفَةٌ قَدْ قُطِعَتْ مِنْ بَلَدٍ.»"
    - lemma: "شَرِيحَة"
