stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'قطاع' تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي مقتضب ويمكن تحسينه ليكون أكثر دقة اصطلاحية."
    observations: "المفهوم يشير إلى أجزاء كبرى من البناء الاجتماعي أو الاقتصادي. اللفظ 'قطاع' هو المصطلح المعياري، ولكن يمكن إغناء المجموعة بألفاظ تشير إلى 'الشرائح' أو 'الفئات' التي تشكل أجزاءً من المجتمع."
  blind_candidates:
    - lemma: "قِطَاع"
      generation_method: ishtiqaq
      justification: "المصطلح المعياري في الاقتصاد والاجتماع للتعبير عن جزء مستقل من منظومة أكبر (Sector)."
    - lemma: "شَرِيحَة"
      generation_method: majaz
      justification: "تُستخدم للتعبير عن قطاع أو جزء من المجتمع (Segment)، وهي استعارة من القطعة المرققة."
    - lemma: "فِئَة"
      generation_method: majaz
      justification: "لفظ عام للجماعة أو الطائفة التي تشكل جزءاً من كل."
    - lemma: "مَيْدَان"
      generation_method: majaz
      justification: "يُستخدم مجازاً للتعبير عن قطاع أو مجال نشاط معين."

stage2_evidence:
  per_lemma:
    - lemma: "قِطَاع"
      confirm:
        - text: "«مجال من مجالات الاقتصاد، مثلاً.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«بمعنى 'مجال': أحد القطاعات الناجمة عن تقسيم منطقة ما.»"
          source: "المعجم الموحد لمصطلحات المياه"
    - lemma: "شَرِيحَة"
      confirm:
        - text: "«فئةٌ من المجتمع تتقاربُ ظروفُها الاجتماعيةُ أو المهنيةُ أو الثقافيةُ.»"
          source: "المعجم الكبير"
        - text: "«استخدمت حديثًا بمعنى الفئة المعينة من الناس أو الطبقة المعينة، وهي قريبة المعنى من الاستخدام القديم لاشتراكهما في أصل المعنى، وهو تقسيم الشيء الكبير إلى أشياء صغيرة.»"
          source: "معجم الصواب اللغوي"
    - lemma: "فِئَة"
      confirm:
        - text: "«الجماعة»"
          source: "مجمل اللغة"
        - text: "«category»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا"
    - lemma: "مَيْدَان"
      expands:
        - text: "«المَيْدَانُ: النِّطاق، يقال: هذا في مَيْدان كذا، أي في نِطاقه.»"
          source: "المعجم الوسيط (بمعنى المجال)"

stage3_analysis:
  per_lemma:
    - lemma: "قطاع"
      decision: confirmed
      decision_reason: "اللفظ المعياري والأكثر دقة للتعبير عن القطاعات الاقتصادية والاجتماعية الكبرى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِطَاع"
    - lemma: "شَرِيحَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح حديث ومستقر للتعبير عن قطاعات أو فئات محددة من المجتمع (Social Segment)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "شَرِيحَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07983333-n"}
    - lemma: "فِئَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي مستعمل حديثاً للتعبير عن المجموعات أو التصنيفات الاجتماعية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فِئَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07983333-n"}

stage4_content:
  definition:
    current: "مجموعة اجتماعية تشكل جزءاً من المجتمع أو الاقتصاد"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتاج إلى صياغة أكثر دقة لبيان طبيعة القطاع كجزء وظيفي أو بنائي."
    authored:
      - type: terminological
        text: "مجموعةٌ من النَّاسِ أو مَجالٌ من مَجالاتِ النَّشاطِ يُشكِّلُ جُزءاً مُستقِلاًّ ووَظيفِيّاً من بِنْيَةِ المُجتَمَعِ أو نِظامِ الاقتصادِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "قِطَاع"
        examples:
          - text: "يُسهِمُ القِطَاعُ الصِّناعيُّ بنسبةٍ كبيرةٍ في الدَّخْلِ القَوْميِّ."
            type: usage
      - lemma: "شَرِيحَة"
        examples:
          - text: "تستهدِفُ القوانينُ الجَديدةُ حِمايَةَ الشَّرائِحِ الضَّعيفَةِ في المُجتَمَعِ."
            type: usage
      - lemma: "فِئَة"
        examples:
          - text: "تَقْسِمُ الدِّراسةُ السُّكَّانَ إلى فِئاتٍ عُمُريَّةٍ مُختلِفَةٍ."
            type: usage

