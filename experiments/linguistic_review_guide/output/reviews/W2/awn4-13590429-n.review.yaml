stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «طي البروتين» تفتقر إلى التشكيل الكامل"
      - "لا تتضمن المجموعة سوى لمّة واحدة وهي فقيرة معجمياً مقارنةً بأهمية المصطلح البيولوجي"
      - "التعريف الحالي يبدو ترجمةً حرفيةً من الإنجليزية بأسلوب لا يرقى إلى مستوى المعجم العلمي"
      - "مصطلح «البروتين» دخيل معرَّب، وإن كان ذلك مقبولاً للمواد الكيميائية ذات التسمية الدولية"
    observations: >
      المفهوم يصف عمليةً بيولوجيةً جزيئيةً دقيقة تندرج في علمَي الكيمياء الحيوية والأحياء
      الجزيئي. الجذر العربي الأصيل لهذا المفهوم هو «طوي» (الإدراج والثني)، وهو ما
      يوثّقه ابن فارس بقوله: «أصل صحيح يدلّ على إدراج شيء حتى يُدرج بعضه في بعض».
      تنتمي اللمّة إلى نوع التركيب الإضافي (MWE idafi). المفهوم يمثّل فجوةً معجميةً
      نسبيةً في العربية؛ إذ لا توجد مفردة واحدة متداولة لعملية الطيّ البروتيني، وإنما
      يُعبَّر عنها بالتركيب الإضافي.
  blind_candidates:
    - lemma: "انْطِوَاءُ البُرُوتِين"
      generation_method: tarkib
      justification: >
        تركيب إضافي من المصدر «انطواء» (وزن انفعال من جذر طوي) مضافاً إلى «البروتين».
        «انطوى» يدلّ على ثني الشيء على بعضه، وهو ما يُشبه العملية الفيزيائية لطيّ
        البروتين. آثرت هذا الوزن على المصدر المجرد «طيّ» لإبراز الطابع التلقائي
        (الانعكاسي) للعملية.
    - lemma: "تَثَنِّي البُرُوتِين"
      generation_method: tarkib
      justification: >
        تركيب إضافي من مصدر «تَثَنَّى» (وزن تفعّل من جذر ثني)، يدلّ على انعطاف الشيء
        وارتداد بعضه على بعض، وهو وصف دقيق لكيفية تشكّل البروتين بنيوياً عبر انعطاف
        سلاسله الببتيدية.
    - lemma: "التَّطَوِّي الجُزَيْئِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «التطوّي» (مصدر تطوّى = انطوى، وزن تفعّل من جذر طوي) موصوفاً
        بـ«الجزيئيّ»، مما يُضيّق الدلالة إلى مجال الكيمياء الحيوية ويُميّزه عن
        التطوّي الجيولوجي أو الفيزيائي العام.
    - lemma: "الطَّيُّ البُرُوتِينِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي بديل للتركيب الإضافي الموجود «طي البروتين»؛ المصدر «الطيّ» (جذر طوي)
        موصوفاً بالنسبة «البروتيني»، يُعطي صياغةً أكثر انسجاماً مع أنماط المصطلحات
        العلمية العربية المركّبة وصفياً.


