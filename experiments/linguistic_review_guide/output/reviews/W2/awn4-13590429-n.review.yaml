stage3_analysis:
  per_lemma:
    - lemma: "طَيُّ البُرُوتِين"
      decision: confirmed
      decision_reason: >
        اللمّة تركيب إضافي صحيح من مصدر عربي أصيل (طيّ من جذر طوي) مضاف إلى الاسم
        الدولي المعرَّب (بروتين). «طيّ» مصطلح تقني راسخ في علم الجيولوجيا والعروض
        والطباعة العربية بمعنى folding، وهو ما يدعم توظيفه في السياق البيولوجي.
        التركيب مسكوك ومُتداوَل في الكتابات البيولوجية والطبية العربية المعاصرة.
        يحتاج إلى تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تختص بالعملية البيولوجية لاكتساب البروتين بنيته
        الفراغية، وتتميز عن «الطيّ» المجرّد بتحديد المجال (الكيمياء الحيوية) وعن
        «الانطواء» بانعدام الدلالة النفسية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَيُّ البُرُوتِين"

    - lemma: "انْطِوَاءُ البُرُوتِين"
      source: stage1
      decision: removed
      decision_reason: >
        «انطواء» راسخ في المعاجم التقنية العربية (التربية، الفلسفة، علم النفس،
        المعجم الطبي الموحد) بمعنى introversion النفسي حصراً. استخدامه لـprotein
        folding سيُفضي إلى اشتراك لفظي حادّ مع مصطلح قائم ومرسَّخ. رُفض.

    - lemma: "تَثَنِّي البُرُوتِين"
      source: stage1
      decision: removed
      decision_reason: >
        «تَثَنَّى» فعل لا اسم مصدر تقني؛ التعريف المعجمي يذكر «انعطف وارتدَّ بعضه
        على بعض» وهو صحيح وصفياً لكن المركّب «تثني البروتين» غير مسجّل في أي معجم
        تقني عربي. المصدر «تَثَنٍّ» ثقيل صرفياً ويصعب تداوله مقارنةً بـ«طيّ».
        لا تتوفر أدلة على تثبيته معجمياً كمصطلح علمي. رُفض.

    - lemma: "التَّطَوِّي الجُزَيْئِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        «تطوّى» مرادف «انطوى» في المعاجم، غير أن المركّب الوصفي «التطوي الجزيئي»
        غير مسجّل في أي مصدر معجمي. الوصف «الجزيئي» يُشير إلى مستوى التحليل لا إلى
        عملية محددة. الصيغة أشبه بالعبارة الوصفية الحرة منها بالمصطلح المسكوك.
        اختبار السكّ: «التطوي الجزيئي» ← «التطوي الببتيدي» = وصف لا مصطلح. رُفض.

    - lemma: "الطَّيُّ البُرُوتِينِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة الوصفية «الطيّ البروتيني» موازية للمصطلح الإضافي «طيّ البروتين» دون
        أن تُضيف دلالةً جديدة. الأصل في التركيب الإضافي العلمي العربي أقوى (مثل
        «طيّ الحمض النووي»، «تكتونية الطيّ»). لا وجود لها في المعاجم التقنية. رُفض.


