# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92440469-n
# yuga — حقبة في الفلسفة الهندوسية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «يوغا» تتطابق إملائياً مع تعريب «yoga» (الممارسة الروحية/الرياضية)، مما يخلق اشتراكاً لفظياً مع مفهوم مختلف تماماً"
      - "اللمّة بدون تشكيل كامل، والتشكيل ضروري للتفريق بين يُوغَا (yuga) ويُوغَا (yoga)"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهي مصطلح أجنبي معرَّب، مما يجعل الشبكة هشّة"
      - "المفهوم شديد الخصوصية الثقافية (فلسفة هندوسية) وقد لا يحتاج أكثر من لمّة تعريبية واحدة"
    observations: "المجموعة تصف مفهوماً خاصاً بالفلسفة الهندوسية — اليوغا (yuga) — وهو قسم زمني كوني ضمن دورة الأعمار الأربعة (ساتيا يوغا، تريتا يوغا، دفابارا يوغا، كالي يوغا). المفهوم ليس له مقابل عربي تراثي مباشر، فالعرب لم يتبنّوا هذا التقسيم الزمني الهندوسي. أقرب المفاهيم العربية هي «الدهر» و«الحقبة» و«العهد»، لكنها جميعاً عامة ولا تختص بهذا المعنى الفلسفي المحدد. التعريب هو السبيل الأنسب."

  blind_candidates:
    - lemma: "يُوغَا"
      generation_method: taarib
      justification: "تعريب مباشر للكلمة السنسكريتية yuga (युग)، وهو الخيار الوحيد العملي لمفهوم خاص بالفلسفة الهندوسية لا مقابل عربي أصيل له"
    - lemma: "يُوغ"
      generation_method: taarib
      justification: "صيغة تعريبية مختصرة بحذف الألف الممدودة، أقرب إلى اللفظ السنسكريتي الأصلي yuga"
    - lemma: "دَهْر"
      generation_method: majaz
      justification: "إزاحة دلالية من معنى الزمن الطويل المبهم إلى حقبة كونية محددة، لكنه عام جداً ولا يختص بالمفهوم الهندوسي"
    - lemma: "عَهْد"
      generation_method: majaz
      justification: "إزاحة دلالية من معنى الفترة الزمنية المتميزة بأحداث بارزة، لكنه عام جداً ويفتقر للتخصيص الفلسفي الهندوسي"


stage2_evidence:
  per_lemma:
    - lemma: "يُوغَا"
      contradicts:
        - text: "«يوغا — yoga — yoga — Arts, Recreation and Sports»"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm)"
          conflict: "المدخل يربط يوغا بمفهوم yoga (الممارسة الرياضية/الروحية) لا yuga (الحقبة الزمنية)"
        - text: "«يوغا — yoga — yoga — Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
          conflict: "المدخل يربط يوغا بمفهوم yoga لا yuga"
      expands:
        - text: "«يوجا — يُوجا [مفرد]: 1 - (رض) نظام من التمرينات غايته السيطرة على الجسم والنَّفس والعقل. 2 - (سف) مَذْهَب فَلْسفيّ هِنْدُوسيّ يهدف إلى السيطرة التامَّة على الجسد وضبط القوى الحيويَّة...»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يُظهر أن الصيغة يوجا/يوغا مستقرة في العربية المعاصرة لمفهوم yoga، مما يؤكد إشكالية الاشتراك اللفظي مع yuga"
        - text: "«الحِقْبة؛ العَصْر: إحدى الحِقَب الأربع في دَوْرة من دَوْرات وجود العالَم [في الفلسفة الهنديّة].» — translation_en: yuga"
          source: "المورد الحديث (2008)"
          addition: "هذا المدخل يترجم yuga بالحقبة والعصر صراحةً ويعرّفه بأنه إحدى الحقب الأربع في دورة وجود العالم في الفلسفة الهندية — مطابق تماماً لتعريف المجموعة الترادفية"

    - lemma: "يُوغ"
      evidence_status: "no_material_found"

    - lemma: "دَهْر"
      confirm:
        - text: "«دَهر؛ حِقبة؛ آلاف السنين.» — translation_en: aeon"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«دَهْر — aeon; eon — Geology»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "دهر مصطلح جيولوجي راسخ يعني أطول وحدة زمنية جيولوجية (aeon)، واستخدامه للمفهوم الهندوسي يخلق تعارضاً اصطلاحياً"

    - lemma: "عَهْد"
      expands:
        - text: "«(1) العَهْد؛ الدَّور: فترة من الزمان تتميّز بِسِمات خاصة أو أحداث بارزة (2) الحِيْن (جي).» — translation_en: epoch"
          source: "المورد الحديث (2008)"
          addition: "عهد يُستعمل بمعنى epoch عامّ ولا يختص بالمفهوم الهندوسي"


