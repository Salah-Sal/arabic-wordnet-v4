stage4_content:
  definition:
    current: "اسم لحقبة أو عصر ضمن دورة الأعمار الأربعة في الفلسفة الهندوسية"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول لكنه يبدأ بـ«اسم ل» وهي صيغة دورانية ضعيفة. يمكن تحسينه بإزالة هذا الاستهلال وإضافة تفصيل عن طبيعة الدورة الكونية استناداً إلى المورد الحديث."
    authored:
