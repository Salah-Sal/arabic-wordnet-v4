        - word: "العقد"
          root: "عقد"
          maqayis_quote: "«العين والقاف والدال أصل واحد يدل على شد وشدة وثوق.»"
    - lemma: "فَرِيدَة"
      entry_id: "{auto}"
      root: "فرد"
      maqayis_quote: "«الفاء والراء والدال أصل صحيح يدل على وحدة. والفريد: الدر إذا نظم وفصل بينه بغيره.»"
