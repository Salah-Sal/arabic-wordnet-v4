stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ('مواطن أو ساكن في النوبة') يبدو كترجمة حرفية للتعريف الإنجليزي، في حين أن العربية تستخدم صيغة النسبة للدلالة على الانتماء الجغرافي أو العرقي بكلمة واحدة."
    observations: "المفهوم يدل على النسبة المكانية أو العرقية لمنطقة (النوبة) العريقة. اللمة الحالية (نوبي) هي أدق صياغة قياسية للنسبة، وهي مثبتة في المعاجم العربية لوصف الفرد المنتمي إلى هذا الجيل."
  blind_candidates:
    - lemma: "نُوبِيّ"
      generation_method: ishtiqaq
      justification: "صيغة النسبة القياسية إلى (النوبة)، وهي الاستعمال العربي الفصيح والشائع للتعبير عن الفرد المنسوب إلى هذه المنطقة."
    - lemma: "نُوبَاوِيّ"
      generation_method: ishtiqaq
      justification: "صيغة نسبة دارجة أو سماعية تُستخدم أحيانا في بعض السياقات للمنسوب إلى النوبة أو جبال النوبة."
    - lemma: "سَاكِنُ النُّوبَة"
      generation_method: tarkib
      justification: "تركيب إضافي وصفي يُعبر عن الدلالة المكانية والجغرافية للمفهوم بشكل مباشر."
    - lemma: "أَبْنَاءُ النُّوبَة"
      generation_method: tarkib
      justification: "تركيب إضافي مألوف في العربية عند الإشارة إلى الأفراد المنتمين لعرق أو منطقة، ويستخدم غالبا في الجمع."

stage2_evidence:
  per_lemma:
    - lemma: "نُوبِيّ"
      confirm:
        - text: "«(النّوبَة) النَّازِلَة والمصيبة (ج) نوب وجيل من النَّاس الْوَاحِد نوبي و (بِلَاد النّوبَة) وَطن ذَلِك الجيل وَيَقَع فِي الْجُزْء الجنوبي من بِلَاد مصر»"
          source: "المعجم الوسيط"
        - text: "«(1) النُّوبيّ: أحد أبناء النُّوبة (2) اللغة النُّوبيّة (3) عَبْدٌ أو فَرَسٌ نوبيّ (4) نوبيّ.»"
          source: "المورد الحديث"
        - text: "«نُوبيّ: من (ن و ب) نسبة إلى النُّوْبَة بمعنى منطقة تقع في أقصى جنوب مصر حول أسوان ولغتهم النوبية ذات لهجات مختلفة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "نُوبَاوِيّ"
      evidence_status: "no_material_found"
    - lemma: "سَاكِنُ النُّوبَة"
      evidence_status: "no_material_found"
    - lemma: "أَبْنَاءُ النُّوبَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "نُوبِيّ"
      decision: confirmed
      decision_reason: "اللمة هي صيغة النسبة الصحيحة والقياسية المعتمدة في المعاجم العربية (كالمعجم الوسيط) للإشارة إلى الفرد المنتمي لبلاد النوبة، وهي تعبر عن المفهوم بدقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُوبِيّ"
    - lemma: "نُوبَاوِيّ"
      source: stage1
      decision: removed
      decision_reason: "صيغة غير فصيحة أو غير قياسية في هذا السياق، ولم تثبت في المعاجم المعتمدة كمرادف قياسي للمفرد."
    - lemma: "سَاكِنُ النُّوبَة"
      source: stage1
      decision: removed
      decision_reason: "تركيب حر غير مسكوك كمرادف اصطلاحي، وصيغة النسبة 'نوبي' تغني عنه وتؤدي المعنى بكلمة واحدة."
    - lemma: "أَبْنَاءُ النُّوبَة"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي يُستخدم عادة للجمع، وليس اصطلاحا مفردا معجميا مسكوكا كبديل للاسم المفرد."

stage4_content:
  definition:
    current: "مواطن أو ساكن في النوبة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعتمد على الترجمة الحرفية (مواطن/ساكن). يُفضّل صياغة تعريف اصطلاحي لغوي دقيق يعبّر عن الانتماء العرقي والجغرافي معاً بصياغة مألوفة."
    authored:
      - type: terminological
        text: "شَخْصٌ يَنْتَمِي إِلَى بِلَادِ النُّوبَةِ عِرْقِيًّا أَوْ جُغْرَافِيًّا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَنْتَمِي إِلَى بِلَادِ النُّوبَةِ عِرْقِيًّا أَوْ جُغْرَافِيًّا."

  examples:
    per_lemma:
      - lemma: "نُوبِيّ"
        examples:
          - text: "يَفْتَخِرُ النُّوبِيُّ بِتُرَاثِهِ الثَّقَافِيِّ وَالْمِعْمَارِيِّ الْعَرِيقِ المُمْتَدِّ عَلَى ضِفَافِ النِّيلِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يَفْتَخِرُ النُّوبِيُّ بِتُرَاثِهِ الثَّقَافِيِّ وَالْمِعْمَارِيِّ الْعَرِيقِ المُمْتَدِّ عَلَى ضِفَافِ النِّيلِ."

stage5_enrichment:
  per_entry:
    - lemma: "نُوبِيّ"
      entry_id: "{auto}"
      root: "نوب"
      maqayis_quote: "«(نَوَبَ) النُّونُ وَالْوَاوُ وَالْبَاءُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى اعْتِيَادِ مَكَانٍ وَرُجُوعٍ إِلَيْهِ.»"
  per_sense:
    - lemma: "نُوبِيّ"
      sense_id: "{auto}"
      nuance: "المصطلح الفصيح والقياسي المعبر عن النسبة للفرد من بلاد النوبة."
      mwe: false
  synset:
    cultural_fit: native
  actions:
