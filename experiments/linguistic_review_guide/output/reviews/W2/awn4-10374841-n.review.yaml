      decision_reason: "رغم صحته اللغوية، إلا أنه اكتسب دلالة تاريخية وعقدية (فرقة المعتزلة)، واستعماله المعاصر في السياقات الدبلوماسية والنزاعات أقل دقة من (محايد)."
