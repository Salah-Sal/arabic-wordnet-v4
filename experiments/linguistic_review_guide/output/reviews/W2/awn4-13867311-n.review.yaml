# مراجعة المجموعة الترادفية — awn4-13867311-n (chronology)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (تسلسل زمني)، وهو مركّب وصفي يحتاج إلى بدائل مفردة أو مركبات إضافية لإثراء المجموعة"
      - "التعريف العربي (ترتيب الأحداث في الوقت) مقتضب وأقرب إلى الترجمة الحرفية منه إلى أسلوب المعاجم العربية"
    observations: "المفهوم هو نظام ترتيب الأحداث والوقائع بحسب أزمنة وقوعها، وهو مفهوم أصيل في الثقافة العربية إذ عُني العرب بالتأريخ والحوليات والتقويم. المصطلح يقع في حقل دلالي غني يشمل: التأريخ، التقويم، الحوليات، التسلسل. يتعيّن التمييز بين المفهوم بوصفه عملية ترتيب (arrangement) وبين علم التأريخ (science of chronology) وبين السجلّ التاريخي (chronicle)."

  blind_candidates:
    - lemma: "تَأْرِيخ"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفْعِيل من الجذر أرخ، يدلّ على تحديد أزمنة الوقائع وترتيبها، وهو أقرب المشتقات العربية إلى مفهوم chronology"
    - lemma: "تَرْتِيب زَمَنِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من ترتيب (مصدر رتّب) + زمنيّ (نسبة إلى الزمن)، يطابق التعريف مباشرة: ترتيب الأحداث في الوقت"
    - lemma: "تَقْوِيم زَمَنِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من تقويم (إصلاح وتنظيم) + زمني، شائع في المعاجم المتخصصة للدلالة على الترتيب الزمني للأحداث الجيولوجية والتاريخية"
    - lemma: "حَوْلِيَّات"
      generation_method: ishtiqaq
      justification: "جمع حَوْلِيَّة من حَوْل (العام)، يدل على تدوين الوقائع سنة بسنة مرتّبة زمنياً، مصطلح تراثي عريق"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَسَلْسُل زَمَنِيّ"
      confirm:
        - text: "«التسلسل: ترتيب أمور غير متناهية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«التّسلسل: في الانكليزية Chronological order, succession, chain. في اللغة الفارسية: الاتّصال»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الشيءُ: تَتَابَعَ بترابطٍ وتَنَاسُق»"
          source: "المعجم الكبير"
        - text: "«تسلسل زمني — chronological order»"
          source: "مسرد الإعلام والتواصل (أليكسو)"
        - text: "«تسلسل زمني — time sequence»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«تسلسلت الأفكارُ والحوادثُ» (شاهد استعمالي)"
          source: "المعجم الكبير"
          addition: "شاهد يؤكد استعمال التسلسل مع الأحداث والأفكار"
        - text: "«تسلسل الأحداث — التسلسل التاريخي المعتمد على التسلسل الطبقي الآثاري — chronology»"
          source: "مسرد الجغرافيا والتاريخ (أليكسو)"
          addition: "صيغة بديلة (تسلسل الأحداث) مسجّلة أيضاً بمعنى chronology"

    - lemma: "تَأْرِيخ"
      confirm:
        - text: "«التأريخ: تسجيل هذه الأحوال»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«التاريخ: جملة الأحوال والأحداث التي يمر بها كائن ما, ويصدق على الفرد والمجتمع, كما يصدق على الظواهر الطبيعية والإنسانية»"
          source: "المعجم الوسيط"
          conflict: "التاريخ أعمّ من مجرّد الترتيب الزمني؛ يشمل مجمل الأحوال والأحداث لا ترتيبها فحسب"
        - text: "«وأمّا تأريخ الكتاب فقد سُمع، وليس عربياً ولا سُمع من فصيح»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "ابن فارس يرى أن التأريخ ليس عربياً أصيلاً"
      expands:
        - text: "«التاريخ: تعريف الوقت. وقيل هو بمعنى الغاية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التاريخ في الاصطلاح يدلّ على تعريف الوقت وتحديد الأزمنة"

    - lemma: "تَرْتِيب زَمَنِيّ"
      confirm:
        - text: "«تبويب زمني، ترتيب زمني — chronological classification order»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«ترتيب (ال…) والتوقيت: المقصود ترتيب تسلسل الأخبار في نشرة الإذاعة أو التلفزة وحساب الوقت المخصّص لكل خبر من أخبارها»"
          source: "مسرد الإعلام والتواصل (أليكسو)"
          addition: "يُستخدم الترتيب في سياق إعلامي مرتبط بالتسلسل الزمني"

    - lemma: "تَقْوِيم زَمَنِيّ"
      confirm:
        - text: "«تقويم زمني — chronology»"
          source: "مسرد الجغرافيا والتاريخ (أليكسو)"
        - text: "«تقويم زمني — chronology»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«تقويم زمني — chronology»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«تقويم زمني مطلق — absolute chronology»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"

    - lemma: "حَوْلِيَّات"
      contradicts:
        - text: "«حوليات — annals»"
          source: "مسرد الإعلام والتواصل (أليكسو)"
          conflict: "الحوليات تعني السجلّات السنوية (annals) لا مفهوم الترتيب الزمني المجرد (chronology)"
        - text: "«تشير الحوليات إلى سجلات سنوية تغطي إنتاج ثلاثة أجيال عبر تحليل موضوعاتي لأهم الأحداث الجارية بغرضٍ تدويني»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "الحوليات سجلّات تدوينية لا ترتيب مجرّد للأحداث"

    - lemma: "كُرُونُولُوجِيَا"
      confirm:
        - text: "«الكرونولوجيا: أ) علم يُعْنَى بتقسيم الزمن إلى فترات وتعيين التواريخ الدقيقة للأحداث وترتيبها وفقًا لتسلسلها الزمني. ب) جدول أو مَرْجعٌ تاريخيّ منظَّم على أساسٍ من هذا التّسلسُل»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«كرونولوجيّ: أ) منسوب إلى الكرونولوجيا chronological order. ب) مرتَّب وفقًا للتسلسل الزمنيّ»"
          source: "المورد الحديث (2008)"
          addition: "يوجد اشتقاق نسبي (كرونولوجي) مما يدلّ على تداول المصطلح"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "تَسَلْسُل زَمَنِيّ"
      decision: confirmed
      decision_reason: "مصطلح مركّب وصفي ثابت، مسجّل في عدة معاجم متخصصة (التجارة والمحاسبة، الإعلام والتواصل، الكهرباء) بمعنى chronological order / time sequence. التسلسل في المعاجم الكلاسيكية يعني ترتيب أمور متتابعة مترابطة، وقيّده التهانوي بالمعنى الإنجليزي chronological order صراحةً. الوصف (زمني) يقيّد المجال الدلالي بالبُعد الزمني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على التتابع المنتظم المترابط للأحداث في بُعدها الزمني، مع إيحاء بالاتصال والتواصل بين الحلقات"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسَلْسُل زَمَنِيّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَأْرِيخ"
      source: stage1
      decision: removed
      decision_reason: "التأريخ في المعاجم العربية يدلّ على تسجيل الأحوال والأحداث أو تعريف الوقت وتحديده، وهو أوسع دلالةً من مفهوم الترتيب الزمني المجرّد (chronology). كما أن ابن فارس في مقاييس اللغة يصرّح بأن التأريخ ليس عربياً أصيلاً. فضلاً عن ذلك فإن التاريخ/التأريخ مشترك لفظي بين معانٍ عديدة (history, dating, historiography) مما يُوقع في اللبس."
      evidence_assessment:
        case: mixed

    - lemma: "تَرْتِيب زَمَنِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم وروده في معجم التجارة والمحاسبة بمعنى chronological classification order، فإنه مركب وصفي يكاد يكون مرادفاً تامّاً لتسلسل زمني من حيث البنية، والترتيب أعمّ دلالياً من التسلسل (الترتيب لا يشترط التتابع والتواصل). إضافته ستُثقل المجموعة بمركّب وصفي ثانٍ دون فارق دلالي واضح."
      evidence_assessment:
        case: confirm_only

    - lemma: "تَقْوِيم زَمَنِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسجّل بمعنى chronology في ثلاثة معاجم متخصصة مستقلة على الأقل (الجغرافيا والتاريخ، الجيولوجيا، علوم الزلازل). التقويم يحمل دلالة التنظيم والضبط الزمني بخلاف التسلسل الذي يركّز على التتابع، فيُضيف بُعداً دلالياً مختلفاً. وهو مركب وصفي ثابت معجمياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على تنظيم الأحداث وضبطها في إطار زمني محدد، مع إيحاء بالتصحيح والتصنيف المنهجي، ويغلب استعماله في العلوم الطبيعية والآثار"
      actions:
        - command: create_entry
          params: {lemma: "تَقْوِيم زَمَنِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13867311-n"}

    - lemma: "حَوْلِيَّات"
      source: stage1
      decision: removed
      decision_reason: "الحوليات تعني السجلات السنوية (annals) التي تدوّن الأحداث سنة بسنة، وهي نتاج تأريخي مادي لا مفهوم مجرّد لترتيب الأحداث في الزمن. المعاجم المتخصصة تقابلها بـ annals لا بـ chronology."
      evidence_assessment:
        case: contradicts_only


