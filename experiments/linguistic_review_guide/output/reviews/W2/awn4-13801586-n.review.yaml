# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13801586-n
# capacity / content — السَّعَة / المُحْتَوَى
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «محتوى» في المعاجم الكلاسيكية تعني بيوت الوبر المجتمعة على ماء، لا الكمّية المحتواة؛ والدلالة الحديثة مولَّدة"
      - "لمّة «سعة» في الوسيط تعني الطاقة والقوة والغنى، لا الحجم الاستيعابي تحديداً؛ الدلالة المقيسية حديثة"
      - "اللمّتان بلا تشكيل في المدخل الحالي"
    observations: "المجموعة تصف مفهوم الكمّية القابلة للاحتواء داخل حيّز، وهو مفهوم قريب من الحجم (hypernym). اللمّتان الموجودتان مقبولتان في الاستعمال الحديث لكنّهما تحتاجان تشكيلاً وتدقيقاً في الفارق الدلالي بينهما. «سَعَة» أقرب إلى القدرة الاستيعابية (capacity)، و«مُحْتَوًى» أقرب إلى المادة المحتواة (content)."

  blind_candidates:
    - lemma: "اسْتِيعَاب"
      generation_method: ishtiqaq
      justification: "مصدر استوعب من جذر وعب (الاستيظاف والأخذ كلّه)، يدلّ على القدرة على الاحتواء الكامل"
    - lemma: "وُسْع"
      generation_method: ishtiqaq
      justification: "من جذر وسع على وزن فُعْل، يدلّ على الطاقة والجِدة، قريب من معنى القدرة الاستيعابية"
    - lemma: "حَمُولَة"
      generation_method: ishtiqaq
      justification: "من جذر حمل على وزن فَعُولة، تدلّ على ما يُحمَل أو القدرة على الحمل"
    - lemma: "مُتَّسَع"
      generation_method: ishtiqaq
      justification: "اسم مكان أو مصدر ميمي من اتّسع، يدلّ على الفسحة والحيّز المتاح"


stage2_evidence:
  per_lemma:
    - lemma: "سَعَة"
      confirm:
        - text: "«السّعة: بفتح السين هي بالفارسية (فراخي) والتّوسعة والاحتواء والغنى»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«سَعة — capacity (space) / content / cubic content»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«سَعَة — capacity»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«سَعَة — كميةُ المعلوماتِ التي يستطيعُ أن يعالِجَها أو يُخزِّنَها حاسوبٌ أو تجهيزةٌ موصولةٌ به — capacity»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«(السعَة) الطَّاقَة وَالْقُوَّة والدعة والغنى والرفاهية يُقَال هُوَ فِي سَعَة من الْعَيْش»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية على الطاقة والقوة، وُسِّعت في الاستعمال الحديث لتشمل الحجم الاستيعابي"

    - lemma: "مُحْتَوًى"
      confirm:
        - text: "«(4) سَعَة (5) حجم — content»"
          source: "المورد الحديث (2008)"
        - text: "«محتوى — content — contenu»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«محتوى — content(s) — contenu»"
          source: "مسرد الإعلام والتواصل"
      contradicts:
        - text: "«(المحتوى) بيُوت النَّاس من الْوَبر مجتمعة على مَاء»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الكلاسيكية مغايرة تماماً للمعنى المقصود؛ الاستعمال الحديث مولَّد"

    - lemma: "اسْتِيعَاب"
      confirm:
        - text: "«الاستيعاب: أخذ الشيء كله، يقال وعبته وعبا وأوعبته إيعابا، واستوعبته، كلها بمعنى. وفي التهذيب: الوعب إيعابك الشيء في الشيء حتى تأتي عليه كله»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«استيعاب — assimilation»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "في الاستعمال المصطلحي الحديث يدلّ على التمثّل والاستيعاب الذهني لا الاحتواء الحجمي"

    - lemma: "وُسْع"
      confirm:
        - text: "«والوسع بالضم كذلك: ووصول اليد للشيء والاستطاعة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«الْوُسْعُ: الْغِنَى... الْوُسْعُ: الْجِدَةُ وَالطَّاقَةُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "يدلّ على الطاقة والقدرة المالية لا على الكمّية المحتواة في حيّز"

    - lemma: "حَمُولَة"
      contradicts:
        - text: "«الحَمولة: بالفتح الإبل والحمرُ تحمل عليها الأثقال وبالضم الأحمال بأعيانها»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "تدلّ على الدوابّ الحاملة أو الأحمال نفسها، لا على مقدار ما يسعه الوعاء"
        - text: "«كُلُّ ما حَمَلَ من بَعيرٍ أو حمارٍ أو غير ذلك»"
          source: "المعجم الكبير"
          conflict: "الدلالة على وسيلة النقل لا على الكمّية"

    - lemma: "مُتَّسَع"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "سَعَة"
      decision: confirmed
      decision_reason: "لمّة راسخة في الاستعمال المصطلحي الحديث بمعنى القدرة الاستيعابية (capacity)، مؤيَّدة بعشرات المعاجم المتخصصة (فيزياء، كيمياء، مياه، معلوماتية)، وأصلها من جذر وسع الدالّ على خلاف الضيق"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على القدرة الاستيعابية القصوى للحيّز (capacity)، أي أقصى ما يمكن أن يتّسع له الوعاء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَعَة"

    - lemma: "مُحْتَوًى"
      decision: confirmed
      decision_reason: "مصطلح حديث مولَّد لكنه شائع في المعاجم المتخصصة وفي الاستعمال العام بمعنى المادة المحتواة (content). الدلالة الكلاسيكية مختلفة لكنّ الاستعمال الحديث مستقرّ"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على المادة المحتواة فعلاً داخل الوعاء (content)، أي الكمّية الموجودة لا القدرة القصوى"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحْتَوًى"

    - lemma: "اسْتِيعَاب"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ الجذر وعب يدلّ كلاسيكياً على أخذ الشيء كلّه، فإنّ الاستعمال المصطلحي الحديث رسّخ «استيعاب» بمعنى الفهم والتمثّل الذهني (assimilation/comprehension)، مما يُحدث التباساً مع المعنى المقصود"

    - lemma: "وُسْع"
      source: stage1
      decision: removed
      decision_reason: "يدلّ على الطاقة والقدرة والجِدة المالية، لا على الكمّية المحتواة في حيّز مادي. قال تعالى: ﴿لِيُنفِقْ ذُو سَعَةٍ مِن سَعَتِهِ﴾ والمراد القدرة المالية"

    - lemma: "حَمُولَة"
      source: stage1
      decision: removed
      decision_reason: "تدلّ على الدوابّ الحاملة للأثقال أو الأحمال المنقولة، لا على مقدار ما يسعه الوعاء. الدلالة بعيدة عن مفهوم السعة الحجمية"

    - lemma: "مُتَّسَع"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تسنده كمصطلح مستقل بمعنى الكمّية المحتواة. يدلّ على الفسحة والمكان الواسع لا على مقدار كمّي محدد"


