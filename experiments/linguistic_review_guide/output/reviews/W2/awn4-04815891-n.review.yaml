          source: "المعجم الموحد لمصطلحات اللسانيات (ArabTerm)"
          addition: "يكشف هذا أن «شعبية» مشتقّة من «الشعب» بمعنى عامة الناس، وهو ما يفسّر دلالتها على الانتشار الواسع لدى الجمهور"
        - text: "«كاستعارة: وصف لحركة أو تغيير الذي يبدأ بين أفراد لهم مصالح مشتركة والذين يمكن أن يحددوا وأن يتصرفوا بشكل جماعي»"
          source: "مسرد المناخ والبيئة (ArabTerm) — ترجمة grassroots"
          addition: "يوضح البُعد الجماهيري في دلالة شعبية: الانتشار من القاعدة الشعبية"

    - lemma: "مَقبوليَّة"
      contradicts:
