          source: "المعجم الكبير لمجمع اللغة العربية"
        - text: "«الشَّعبيّة: كون الشيء شعبيًّا»"
          source: "المورد الحديث (2008) — مدخل popularity"
        - text: "«شعبيّ: «د» رائج؛ شائع بين عامة الناس popular songs. «ه» محبوب a popular girl»"
          source: "المورد الحديث (2008) — مدخل popular"
      expands:
