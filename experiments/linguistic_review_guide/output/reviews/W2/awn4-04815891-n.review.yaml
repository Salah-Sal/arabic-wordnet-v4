# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «رواج» تحمل دلالة تجارية/سوقية (الطلب والتداول) أكثر من الدلالة على الإعجاب الشعبي الشامل، مما يجعلها أضيق دلالةً من popularity"
      - "كلتا اللمّتين واردتان بدون تشكيل في السجل الحالي"
      - "التعريف العربي الحالي مبنيٌّ على ترجمة حرفية من الإنجليزية باستخدام صيغة «صفة كون» المُقتبسة ولا تناسب أسلوب المعجم العربي"
    observations: "المجموعة تدور حول مفهوم «الشعبية» بمعناها الجامع الذي يضم الإعجاب والقبول والطلب الواسع. شعبية هي اللمّة الأدق والأشمل، إذ وُثِّقت صراحةً في المعجم الكبير بمعنى «حِظوة أو شُهرة ينالها الشخص لدى عدد كبير من الناس». أما رواج فيميل دلالياً نحو الانتشار التجاري والسوقي (الطلب والتداول)، ويُشكّل المُكوِّن الثاني للمفهوم. الإسناد إلى المُستوِ الأعلى (جَودة/نَوعيَّة) سليم منطقياً إذ الشعبية صفة جوهرية مميّزة. تعريف ابن فارس لجذر (ر و ج) بوصفه دخيلاً يستحق التنويه لكنه لا يوجب الإقصاء إذ شاع الاستعمال وانتشر."
  blind_candidates:
    - lemma: "مَقبوليَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق من جذر (ق ب ل) على صيغة المصدر الصناعي مَفعولية: مَقبول → مَقبوليَّة؛ تُعبِّر عن صفة كون الشيء موضع قبول واسع لدى الناس، وهو أحد عناصر التعريف المحوري"
    - lemma: "ذُيوع"
      generation_method: ishtiqaq
      justification: "مصدر قياسي من جذر (ذ ي ع) على وزن فُعول: ذاع يذيع ذُيوعاً؛ ومعناه الانتشار والشيوع بين الناس. يُعبِّر عن وصف الشيء الشائع المُتداوَل على ألسنة الناس، وهو وجه من وجوه الشعبية"
    - lemma: "حُظوة"
      generation_method: majaz
      justification: "إحياء لفظ عربي كلاسيكي يعني المكانة والمنزلة؛ بالتوسّع الدلالي من «الحظوة لدى ذي سلطان» إلى «الحظوة لدى عامة الناس»، وهو قريب من معنى الشعبية إذ كلاهما يدل على المكانة المرموقة"
    - lemma: "إِقبال"
      generation_method: majaz
      justification: "مجاز من إقبال الناس على الشيء وتوجّههم نحوه بشوق ورغبة؛ يُعبِّر عن الطلب والإعجاب الجماهيري الواسع، مستمَدٌّ من مصدر الإفعال من (ق ب ل) بمعنى التوجّه والإقدام"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "رواج"
      confirm:
        - text: "«يَروج؛ يَلقى رواجاً»"
          source: "المورد الحديث (2008) — ترجمة الفعل الإنجليزي catch on"
        - text: "«(1) زِيّ؛ مُوْضة (2) شعبيّة؛ رواج. in vogue: دارج؛ رائج»"
