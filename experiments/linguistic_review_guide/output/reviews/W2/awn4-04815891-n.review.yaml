          source: "مقاييس اللغة لابن فارس"
          conflict: "ابن فارس يصف جذر (ر و ج) صراحةً بأنه دخيل غير أصيل في العربية، مما يضعف الاستناد إليه لمصطلح معجمي"

    - lemma: "شعبية"
