# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-06811194-n  |  ILI: i72209  |  POS: n
# Definition: دلالة واضحة  |  a conspicuous indication
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «إشهار» دخيلة على المجموعة: دلالتها المستقرة في العربية المعاصرة هي الإعلان التجاري والترويج (advertising/publicity)، وليست «دلالة واضحة لافتة»."
      - "التعريف الحالي «دلالة واضحة» مقتضب ويفتقر إلى الجنس القريب والفصل النوعي؛ كما أن لفظة «دلالة» ترد في تعريف الأصل (المجموعة الأم) فيقع التعريف في دائرة الاشتراك."
      - "اللمّتان خاليتان من التشكيل الكامل."
    observations: >
      المجموعة تمثّل المفهوم الإنجليزي «signalization/signalisation» بمعنى الدلالة أو
      الإشارة البارزة اللافتة، وهو مفهوم أخصّ من مضيفه (awn4-06810027-n: دلالة أو علامة
      أو مؤشر). السمة الفارقة هي «الوضوح والبروز» (conspicuous). «إشارة» تناسب المعنى
      العام للدلالة والعلامة، لكنها لا تحمل بذاتها سمة «البروز والجلاء». «إشهار» جُلب
      على الأرجح بسبب الاشتراك في الجذر (شهر = وضوح وإضاءة عند ابن فارس)، إلا أنّ
      الاستعمال المعاصر استقرّ على «الإعلان» وحده فلا يجوز الإبقاء عليه. يغيب من
      المجموعة مصطلح يُعبّر عن «الإيضاح البيّن» كـ«بيان» الذي وثّقته المعاجم التقنية
      بمعنى indication.
  blind_candidates:
    - lemma: "لَوَّاح"
      generation_method: majaz
      justification: >
        من «لاح يلوح»: ظهر وبان وأومأ وأشار؛ يُقال: لاح الشيء من بعيد إذا ظهر واضحاً.
        المجاز: من معنى «اللوح» — ما يلوح ويبرز للناظر — إلى الدلالة الواضحة البارزة.
        يخلو من الاشتراك اللفظي مع الألفاظ الحية الشائعة في هذا الحقل.
    - lemma: "إِبَانَة"
      generation_method: ishtiqaq
      justification: >
        مصدر «أبان» على وزن إفعالة، من جذر «بان يبين»: ظهر وتجلّى؛ يعني إظهار المعنى
        وإيضاحه. الوزن يفيد التعدية، فالإبانة هي جعل الشيء بيّناً واضحاً —  وهو جوهر
        «دلالة واضحة».
    - lemma: "بَيَان"
      generation_method: ishtiqaq
      justification: >
        مصدر «بان يبين»، على وزن فَعَال الدالّ على الامتداد والجلاء؛ في اصطلاح أهل
        الأصول: إظهار المراد وإخراجه عن حدّ الإشكال إلى فضاء الوضوح. كلمة «بيان» تُستعمل
        بمعنى indication في المعاجم التقنية العربية الموحّدة (الهندسة الكهربائية،
        electropedia).
    - lemma: "جَلِيَّة"
      generation_method: ishtiqaq
      justification: >
        من «جلا يجلو»: كشف وأظهر؛ «الجلية» على وزن فَعِيلة بمعنى الأمر الواضح البيّن
        الصريح. جذرها جلو يعني «انكشاف الشيء وبروزه» (مقاييس اللغة). الاستعمال القرآني
        والبلاغي: «أخبرني عن جليّة الأمر» أي حقيقته الظاهرة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1: batch headword lookup — إشارة، إشهار، لواح، إبانة، بيان، جلية (+ال-)
#   Q2: English bridge — signalization, signalisation, conspicuous indication, indication
#   Q3: Arabic FTS — "دلالة واضحة" OR "إشارة واضحة" OR "لافتة للنظر"
#   Q4: Maqayis al-Lugha — جذور شور، شهر، بين، جلو، وضح
stage2_evidence:
  per_lemma:

    - lemma: "إشارة"
      confirm:
        - text: "«الإِشَارَةُ: دلَالَة عقلية أَو حسية إِلَى الشَّيْء بِحَيْثُ لَا يُشَارِكهُ فِيهِ غَيره»"
          source: "معجم مقاليد العلوم للسيوطي (ت ٩١١ هـ)"
        - text: "«الإشارة: التلويح بشيء يفهم منه النطق، فهي ترادف النطق في فهم المعنى»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت ١٠٣١ هـ)"
        - text: "«الإشارة: تعيين الشيء بالحس، وهي قسمان: إشارة عقلية وإشارة حسّية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت ١١٩٠ هـ)"
        - text: "«الإشارة: تعيين الشيء باليد ونحوها، والتلويح بشيء يفهم منه المراد»"
          source: "المعجم الوسيط (مجمع القاهرة)"
        - text: "«الإشارة: علامةٌ، أو رَمْزٌ، أو حركةٌ للدلالةِ على أمرٍ ما»"
          source: "المعجم الكبير (مجمع القاهرة)"
        - text: "«أية علامة مصاحبة لكلام المتكلم تساعد على بيان المراد من كلامه» — ترجمة: indication"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«الإشارة: هو الثابت بنفس الصيغة من غير أن يسبق له الكلام»"
          source: "كتاب التعريفات للشريف الجرجاني (ت ٨١٦ هـ)"
          addition: "يوضح أن الإشارة قد تكون ضمنية في النص ذاته، مما يُثري دلالتها على التمييز والتخصيص لا على الحركة الحسية وحدها."

    - lemma: "إشهار"
      contradicts:
        - text: "«الإعلان عن منتوج ما والترويج له» — ترجمة: advertising"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "المعنى المستقر لإشهار في العربية المعاصرة هو الإعلان التجاري والترويج، وليس الدلالة الواضحة."
        - text: "«إعلان معلومات عن منتوج ما بهدف ترويجه» — ترجمة: publicity"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "تتكرر دلالة الإعلان والإشاعة في مصدرين مستقلين."
        - text: "«إشهار الخبر — مرفوضة / السبب: لأنها مصدر للفعل «أشهر»، وهذا الفعل لم يرد في المعاجم بمعنى «أعلن»، وإنما الوارد «شَهَرَ» الثلاثي. الصواب والرتبة: إشهار الخبر [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت ٢٠٠٣ م)"
          conflict: "معجم الصواب يُجيز إشهار بمعنى «إعلان الخبر» لا بمعنى «دلالة واضحة»، مما يُثبت انحراف الاستعمال عن المعنى المطلوب للمجموعة."

    - lemma: "لَوَّاح"
      evidence_status: "no_material_found"

    - lemma: "إِبَانَة"
      confirm:
        - text: "«الإبانة: إظهار المعنى للنفس بما لا يمكن إدراكه، وأصله القطع فالإبانة قطع المعنى من غيره ليظهر من نفسه»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت ١٠٣١ هـ)"
      contradicts:
        - text: "«الإِبَانَةُ: الأصحاب، يقال: جاء فلان فى إبَانته»"
          source: "المعجم الكبير (مجمع القاهرة)"
          conflict: "المعجم الكبير يُثبت للإبانة معنىً آخر تمامًا هو «الأصحاب» أو «الوقت المناسب» (جاء في إبانته = في وقته)؛ وهو اشتراك لفظي يُربك الاستعمال."

    - lemma: "بَيَان"
      confirm:
        - text: "«البَيَان: إِخْرَاج الشَّيْء عَن حيرة الْإِشْكَال إِلَى فضاء الوضوح، وَقيل: هُوَ الدَّلِيل الَّذِي يُوصل بِصَحِيح النّظر فِيهِ إِلَى علم أَو ظن»"
          source: "معجم مقاليد العلوم للسيوطي (ت ٩١١ هـ)"
        - text: "«البيان: إظهار المعنى وإيضاح ما كان مستورًا قبله، وقيل: هو الإخراج عن حد الإشكال»"
          source: "كتاب التعريفات للشريف الجرجاني (ت ٨١٦ هـ)"
        - text: "«البيان: في اللغة الإظهار… وهو قد يكون بالقول وقد يكون بالفعل»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«بيان التاريخ والوقت تلقائياً» — ترجمة: automatic date and time indication; «لوحة البيان» — ترجمة: indication panel"
          source: "موسوعة الكهرباء IEC 60050 (Electropedia)"
        - text: "«بيان» — ترجمة: Indication (في مجال الهندسة الكهربائية)"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«الْبَيَان: الْحجَّة والمنطق الفصيح وَالْكَلَام يكْشف عَن حَقِيقَة حَال»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يُوسّع دلالة «بيان» لتشمل الوضوح الكلّي الناتج عن الدلالة، مما يُقرّبه من الفصل النوعي «الواضح اللافت» الذي يميّز هذه المجموعة."

    - lemma: "جَلِيَّة"
      expands:
        - text: "«الجليّة: الخبر اليقين وجلية الأمر حقيقته»"
          source: "المعجم الوسيط (مجمع القاهرة)"
          addition: "الجلية تعني «الأمر الواضح الصريح» وتشترك مع مفهوم المجموعة في سمة الوضوح، لكنها تُحيل إلى الحقيقة/الخبر لا إلى الإشارة/الدلالة."
        - text: "«الجَلِيَّة: الحقيقة والأمر الواضح، يُقال: أخبرني عن جليّة الأمر»"
          source: "المعجم الكبير (مجمع القاهرة)"
          addition: "يؤكد أن الجلية اسم للحقيقة المكشوفة لا للفعل الدلالي ذاته."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إشارة"
      decision: confirmed
      decision_reason: >
        كلمة فصيحة راسخة في المعاجم الكلاسيكية والحديثة بمعنى «دلالة حسية أو عقلية على
        الشيء»، وهي المقابل العربي الأوسع تداولاً لـ indication في المجالات العامة. وإن
        كانت لا تحمل بذاتها سمة «البروز اللافت»، فإنّها تبقى المدخل الأساسي للمجموعة
        كونها الجنس الموثَّق في الشواهد المعجمية المتعددة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «إشارة» تُعبّر عن فعل التأشير الحسّي والعقلي بشكل عام (gesture, sign, signal)
        وتشمل الإيماء والرمز؛ تُستعمل في مجالات متباينة ولا تنفرد بسمة الوضوح البارز
        التي تميّز هذه المجموعة عن أمّها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَة"

    - lemma: "إشهار"
      decision: removed
      decision_reason: >
        المعاجم المتعددة (مسرد الإعلام، معجم الصواب) تُثبت استقرار «إشهار» على معنى
        «الإعلان التجاري والترويج» (advertising/publicity)؛ وهو بعيد كلّ البُعد عن
        «دلالة واضحة لافتة». الجذر (شهر = وضوح وإضاءة عند ابن فارس) يُثير وهمَ القرابة
        الدلالية، لكن الاستعمال المعاصر المستقر يُلغي هذا التوافق. إدراجه خطأ تصنيفي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "لَوَّاح"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر في قاعدة البيانات على أيّ شاهد معجمي يُثبت «لوّاح» مصطلحاً للدلالة أو
        الإشارة. الاشتقاق وجيه (لاح يلوح = ظهر وأومأ)، إلا أنّ غياب التثبيت المعجمي
        يُسقط اختبار السكّ: لا دليل على أنها وحدة معجمية ثابتة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "إِبَانَة"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة مختلطة: المناوي يُعطيها معنى «إظهار المعنى وإيضاحه»، لكن المعجم الكبير
        يُثبت لها معنىً مغايرًا تمامًا («الأصحاب»، «في إبانته» = في وقته). هذا الاشتراك
        اللفظي يُربك الاستعمال ويُعسّر التثبيت المصطلحي. فضلاً عن ذلك، «الإبانة» في
        التراث البلاغي ترتبط بالبيان الكلامي لا بالإشارة الدلالية التي تميّز هذه المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "بَيَان"
      source: stage1
      decision: confirmed
      decision_reason: >
        شواهد معجمية متعددة تُثبت «بيان» بمعنى «إظهار المعنى وإخراجه عن الإشكال إلى
        الوضوح» (السيوطي، الجرجاني، المناوي). وفي المعاجم التقنية (electropedia، مسرد
        الهندسة الكهربائية) يُستعمل «بيان» مقابلاً صريحاً لـ indication. يجمع الكلمةُ
        بين أصالة التراث وحيوية الاستعمال التقني المعاصر، وتحمل بذاتها سمة الوضوح
        والجلاء الفارقة لهذه المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «بيان» يُركّز على سمة الكشف والإيضاح الكامل (من الإشكال إلى الوضوح)؛ يُستعمل
        في السياقات التقنية والمعرفية الرسمية، وفيه تضمُّن لجهة المُرسِل (الإظهار
        المقصود)، بخلاف «إشارة» التي قد تكون عفوية أو غير مقصودة.
      actions:
        - command: create_entry
          params:
            lemma: "بَيَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "جَلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الجلية» في المعاجم تعني «حقيقة الأمر» أو «الخبر اليقين»، فهي اسم لما يُكشف لا
        للفعل الدلالي الذي يكشفه. مفهوم المجموعة هو الإشارة/الدلالة ذاتها في بروزها
        ووضوحها، لا نتيجة الكشف. استعمال «جلية» كمصطلح لـ indication غير موثّق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "دلالة واضحة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي قصير ومنقوص: (١) يستعيد لفظة «دلالة» الواردة في تعريف المجموعة
        الأمّ فيقع في الدوران الجزئي. (٢) «واضحة» وحدها لا تُؤدّي الفصل النوعي المطلوب
        لـ «conspicuous» الذي يعني اللافت البارز لا مجرّد الغير الملتبس. (٣) يخلو من
        الجنس القريب الصريح ومن الإشارة إلى فاعلية الدلالة في الإظهار.
    authored:
      - type: terminological
        text: "إِشَارَةٌ أَو دَلَالَةٌ جَلِيَّةٌ بَارِزَةٌ تُظهِرُ المَدلُولَ عَلَيهِ بِمَا لَا يَخفَى عَلَى النَّاظِرِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَا أَبَانَ عَن مَعنَاهُ إِبَانَةً لَافِتَةً وَكَشَفَ عَنهُ كَشفًا لَا يَحتَمِلُ الالتِبَاسَ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
