stage1_review:
  assessment:
    concerns:
      - "نصف عشيرة: يبدو أقرب للتعبير الشارح منه إلى المصطلح المعجمي المسكوك."
      - "شطر: مصطلح دقيق لغوياً وأنثروبولوجياً، ولكنه قد يلتبس مع معانٍ أخرى مثل الاتجاه أو النصف المطلق."
    observations: "المفهوم أنثروبولوجي بامتياز، يشير إلى انقسام القبيلة إلى شطرين متميزين يتبادلان الزواج أو المهام الاجتماعية. المصطلحات العربية الكلاسيكية للتقسيمات القبلية (بطن، فخذ، فصيلة) لا تعبر بالضرورة عن هذا الانقسام الثنائي المخصوص، لذا فإن استعادة لفظ 'شطر' لهذا المعنى هو الأنسب."
  blind_candidates:
    - lemma: "شَطْر"
      generation_method: majaz
      justification: "من الشطر بمعنى النصف، وهو المصطلح المعتمد في الأنثروبولوجيا العربية لترجمة moiety."
    - lemma: "نِصْفُ القَبِيلَةِ"
      generation_method: tarkib
      justification: "تعبير وصفي مباشر للمفهوم كما ورد في التعريف الإنجليزي."
    - lemma: "بَطْن"
      generation_method: majaz
      justification: "استعارة لمصطلح كلاسيكي يعبر عن وحدة اجتماعية فرعية من القبيلة."
    - lemma: "فِئَةُ القَبِيلَةِ"
      generation_method: tarkib
      justification: "تعبير عام عن قسم أو مجموعة داخل القبيلة."

stage2_evidence:
  per_lemma:
    - lemma: "شطر"
      confirm:
        - text: "«شَطْرُ كُلَّ شَيْءٍ: نِصْفُه.»"
          source: "المحيط في اللغة للصاحب بن عباد"
        - text: "«من القبيـلة: دُونَ الفخذِ، وفَوْقَ العِمارة.»"
          source: "المعجم الكبير"
        - text: "«moiety: (1) «أ» نِصْف. «ب» جزء؛ شَطْر.»"
          source: "المورد الحديث (2008)"
    - lemma: "نصف عشيرة"
      evidence_status: "no_material_found"
    - lemma: "بطن"
      confirm:
        - text: "«ودونَ القبيلةِ، أو دونَ الفَخِذِ، وفَوْقَ العِمارةِ.»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«البطن من العرب اعتبارا بأنهم كشخص واحد وأن كل قبيلة منهم كعضو بطن وفخذ وهكذا.»"
          source: "التوقيف على مهمات التعاريف للمناوي"

stage3_analysis:
  per_lemma:
    - lemma: "شطر"
      decision: confirmed
      decision_reason: "مصطلح دقيق يعبر عن الانقسام الثنائي (النصفي) وهو المعتمد في المعاجم الحديثة لترجمة المفهوم الأنثروبولوجي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَطْرٌ"
    - lemma: "نصف عشيرة"
      decision: confirmed
      decision_reason: "تعبير شارح مقبول لمدلول المجموعة، وإن كان أقل درجة في الاصطلاحية من 'شطر'."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِصْفُ عَشِيرَةٍ"

stage4_content:
  definition:
    current: "أحد التقسيمين الفرعيين الأساسيين للقبيلة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه يحتاج لتوضيح الطبيعة الثنائية (النصفية) لهذا التقسيم لتمييزه عن مجرد الفروع."
    authored:
      - type: terminological
        text: "أحدُ شَطْرَيِ القبيلةِ في الأنظمةِ الاجتماعيّةِ التي تنقسمُ فيها الجماعةُ إلى فئتين متميزتين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "أحدُ شَطْرَيِ القبيلةِ في الأنظمةِ الاجتماعيّةِ التي تنقسمُ فيها الجماعةُ إلى فئتين متميزتين."
  examples:
    per_lemma:
      - lemma: "شَطْرٌ"
        examples:
          - text: "يتميزُ البناءُ الاجتماعيُّ لهذهِ القبيلةِ بوجودِ شَطْرَيْنِ يتبادلانِ الزواجَ والمهامَّ الطقسيةَ."
            type: usage
      - lemma: "نِصْفُ عَشِيرَةٍ"
        examples:
          - text: "في المجتمعاتِ الأموميّةِ، ينتمي الفردُ عادَةً إلى نِصْفِ عَشِيرَةِ أمِّهِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تتكونُ القبيلةُ من شَطْرَيْنِ متميزينِ يُشكِّلانِ وحدتَها الاجتماعيةَ."

stage5_enrichment:
  per_entry:
    - lemma: "شَطْرٌ"
      entry_id: "{auto}"
      root: "شطر"
      maqayis_quote: "«الشِّينُ وَالطَّاءُ وَالرَّاءُ أَصْلَانِ، يَدُلُّ أَحَدُهُمَا عَلَى نِصْفِ الشَّيْءِ، وَالْآخَرُ عَلَى الْبُعْدِ وَالْمُوَاجَهَةِ. فَالْأَوَّلُ قَوْلُهُمْ شَطَرَ الشَّيْءَ، لِنِصْفِهِ.»"
    - lemma: "نِصْفُ عَشِيرَةٍ"
      entry_id: "{auto}"
      roots:
        - word: "نصف"
          root: "نصف"
          maqayis_quote: "«النُّونُ وَالصَّادُ وَالْفَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الِاسْتِوَاءِ بَيْنَ شَيْئَيْنِ.»"
        - word: "عشيرة"
          root: "عشر"
          maqayis_quote: "«إِنَّمَا سُمِّيَتْ عَشِيرَةُ الرَّجُلِ لِمُعَاشَرَةِ بَعْضِهِمْ بَعْضًا.»"
  per_sense:
    - lemma: "شَطْرٌ"
      sense_id: "{auto}"
      nuance: "المصطلح التقني الأكثر دقة في السياق الأنثروبولوجي للتعبير عن نظام الشطرين."
      mwe: false
    - lemma: "نِصْفُ عَشِيرَةٍ"
      sense_id: "{auto}"
      nuance: "تعبير وصفي يؤكد على أن الوحدة هي نصف القبيلة أو العشيرة."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"شطر","maqayis":"«الشِّينُ وَالطَّاءُ وَالرَّاءُ أَصْلَانِ، يَدُلُّ أَحَدُهُمَا عَلَى نِصْفِ الشَّيْءِ، وَالْآخَرُ عَلَى الْبُعْدِ وَالْمُوَاجَهَةِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"نصف","root":"نصف","maqayis":"«النُّونُ وَالصَّادُ وَالْفَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الِاسْتِوَاءِ بَيْنَ شَيْئَيْنِ.»"},{"word":"عشيرة","root":"عشر","maqayis":"«إِنَّمَا سُمِّيَتْ عَشِيرَةُ الرَّجُلِ لِمُعَاشَرَةِ بَعْضِهِمْ بَعْضًا.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح التقني الأكثر دقة في السياق الأنثروبولوجي للتعبير عن نظام الشطرين.","mwe":false}'
    - command: set_metadata
      params:
