# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-13962386-n  |  ILI: i110197
# "a wild primitive state untouched by civilization"
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (برية، حالة الطبيعة) خاليتان تماماً من التشكيل"
      - "برية اسم مكان (= الصحراء) لا اسم حالة، مما يُحدث خطأً فئوياً مع الوصيف المباشر (حَالَة)"
      - "التعريف الحالي دوري: يستخدم 'برية' في التعريف وهي إحدى لمّات المجموعة ذاتها"
    observations: >
      المجموعة تُمثّل مفهوماً فلسفياً يصف الحالة الأصيلة للطبيعة والإنسان قبل نشأة الحضارة والمجتمع المنظَّم،
      وهو ما يُسمّى في الفلسفة الغربية (state of nature) عند هوبز وروسو ولوك.
      في العربية تُقابله مفردات متعددة كالفِطرة والبداوة والتوحُّش، إلا أن كلاً منها يحمل ظلالاً دلالية
      مختلفة: الفِطرة ذات طابع ديني إسلامي، والبداوة خاصة بنمط البداة، والتوحُّش يُشير إلى الانفصال
      عن الأنس. حالة الطبيعة هو المصطلح الفلسفي المستقرّ في المكتبة العربية المعاصرة.
  blind_candidates:
    - lemma: "فِطْرَة"
      generation_method: majaz
      justification: >
        لفظ قرآني يدلّ على الحالة الأصلية التي فُطر عليها كل مخلوق قبل أي تشكيل ثقافي أو اجتماعي؛
        يُحيَى بمجاز الإزاحة الدلالية ليشمل الحالة البدائية السابقة للحضارة، مستفيداً من
        الاتساع الدلالي التراثي للكلمة (الخلقة الأولى، الجبلّة، الطبيعة السليمة)
    - lemma: "بَدَاوَة"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (ب د و) على وزن فَعَالَة، يدلّ على نمط الحياة الذي يمثّل خلاف الحضارة
        وفق ثنائية كلاسيكية بداوة/حضارة راسخة في الموروث العربي؛
        الجذر في مقاييس اللغة يعني الظهور والبروز في براز من الأرض دون كِنٍّ أو حضارة
    - lemma: "تَوَحُّش"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (و ح ش) على وزن تَفَعُّل، يدلّ على حالة مفارقة الأنس والتنظيم الاجتماعي؛
        الجذر في مقاييس اللغة يُعرَّف بأنه خلاف الإنس، وتَوَحَّشَ = فارق الأنيس،
        مما يُحقّق المعنى المطلوب من الابتعاد عن الحضارة
    - lemma: "فِطْرِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من (فِطريّ) على وزن فِعْلِيَّة، يدلّ على الحالة المجردة للطبيعة الأصيلة
        السابقة للتجربة الحضارية؛ يستفيد من الاشتقاقية العربية الواسعة في تحويل الصفة
        إلى حالة مجردة


stage2_evidence:

  per_lemma:

    - lemma: "برية"
      contradicts:
        - text: "«البَرِّيَّة: الصحراء»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "تعريف يُثبت أنها اسم مكان (الصحراء) لا اسم حالة أو كيفية"
        - text: "«الأرض المنسوبة إلى البَرّ الصَّحراء، وهى خلاف الريفيَّة»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "مكان جغرافي منسوب إلى البرّ، لا علاقة له بالحالة أو الكيفية"
        - text: "«الْبَرِّيَّة الصَّحْرَاءُ»"
          source: "مقاييس اللغة لابن فارس (من مادة بَرَّ)"
          conflict: "المعجم التأثيلي يُؤكد أنها الصحراء (الأرض الخالية)، وهو اسم مكان"
        - text: "«translation_en: steppe | domain: Geography and History»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
          conflict: "المصطلح المعياري الحديث يُقابل كلمة steppe (السهل الجغرافي)، مما يُرسّخ كونها اسم مكان"

    - lemma: "حالة الطبيعة"
      expands:
        - text: >
            «(12) الحالة البَرِّيّة أو الوحشيّة أو الطَّبيعيّة [بوصفها ترجمات لـ wild بصفته اسماً]»
          source: "المورد الحديث (2008)"
          addition: >
            يُثبت أن المعجمية العربية المعاصرة تُعبِّر عن المفهوم الاسمي لـ wild بالتركيب
            الإضافي (الحالة البرية / الطبيعية)، مما يدعم حالة الطبيعة بوصفها مصطلحاً مركّباً ثابتاً

    - lemma: "فِطْرَة"
      confirm:
        - text: >
            «الخِلقة التى يكون عليها كل مولود أوَّل خَلْقِهِ؛ الطبيعة السليمة لم تشَب بعيب»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >
            «الصِفة التي يتصف بها كل موجود في أوّل زمانِ خِلْقَتِه، الجِبِلَّة المُهيَّأة
            لقبول الدين»
          source: "التعريفات الفقهية للبركتي"
      contradicts:
        - text: >
            «الجبلة المتهيئة لقبول الدين... وقال الراغب: هي ما ركب الله في الإنسان
            من قوته على معرفة الإيمان»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            المعنى الأغلب عند المتكلمين والفقهاء ديني إسلامي خاص، لا يعني الحالة
            البدائية بمعزل عن الحضارة بوجه عام
      expands:
        - text: >
            «[في الفرنسية:] état primitif [من بين معاني الفطرة المذكورة في الحديث النبوي]»
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: >
            يُشير إلى أن بعض العلماء ربطوا الفطرة بـ'الحالة البدائية' (état primitif)
            مما يدعم التقاطع الجزئي مع مفهوم المجموعة

    - lemma: "بَدَاوَة"
      contradicts:
        - text: "«الحياة في البادية، ويغلب عليها التنقل والترحال»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "تحدّد نمطاً معيشياً بدوياً بعينه (الترحال في البادية) لا حالةً أصيلة شاملة"
        - text: "«nomadism | domain: Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
          conflict: >
            المصطلح المعياري nomadism (البداوة) يعني التنقل الرعوي الدوري،
            وهو أخص من المفهوم الفلسفي للحالة الطبيعية
      expands:
        - text: >
            «وَسُمِّيَ خِلَافُ الْحَضَرِ بَدْوًا مِنْ هَذَا، لِأَنَّهُمْ فِي بَرَازٍ مِنَ الْأَرْضِ،
            وَلَيْسُوا فِي قُرًى تَسْتُرُهُمْ أَبْنِيَتُهَا. وَالْبَادِيَةُ خِلَافُ الْحَاضِرَةِ»
          source: "مقاييس اللغة لابن فارس (مادة بَدَوَ)"
          addition: >
            يُثبت الثنائية اللغوية التراثية بدو/حضر (= بداوة/حضارة)، مما يُقرِّب اللفظ
            من المفهوم المراد لكنه يظلّ خاصاً بنمط عيش لا بحالة كونية شاملة

    - lemma: "تَوَحُّش"
      expands:
        - text: >
            «تَوَحَّشَ: فَارَقَ الْأَنِيسَ. وَالْوَحْشُ: خِلَافُ الْإِنْسِ»
          source: "مقاييس اللغة لابن فارس (مادة وَحَشَ)"
          addition: >
            يُثبت أن الجذر يدلّ أصلاً على مفارقة الأنس والبشر المتحضّرين،
            وهو معنى يتقاطع مع الحالة البدائية البعيدة عن الحضارة
      contradicts:
        - text: >
            «تَوَحَّشَ فلان: رمى بثوبه أو بغيره وجاع؛ وجوفُه خلا من الطعام؛
            وللدواء: أخلى معدته ليكون أسهل لخروج الفضول من عروقه؛
            والمكانُ من أهله: أوحش؛ والأرضُ: صارت وحشة»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            المعاجم تُقيِّد توحّش بأفعال محددة (رمي الثوب، الجوع، إخلاء المكان)
            لا بالحالة الأصيلة للطبيعة؛ والمصدر تَوَحُّش غير موثَّق كاسم مجرد لهذا المفهوم

    - lemma: "فِطْرِيَّة"
      contradicts:
        - text: >
            «القول بأن الأفكار والمبادئ جبلِيَّة وموجودة في النفس قبيل التجربة والتلقين. (مو)»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            الفِطرية في المعجمية العربية تعني الفلسفة النزعية (Nativism / Innatism)
            وليس الحالة البدائية للطبيعة؛ المفهوم مغاير تماماً


stage3_analysis:

  per_lemma:

    - lemma: "برية"
      decision: removed
      decision_reason: >
        برية في جميع المعاجم المعتمدة (الوسيط، الكبير، مقاييس اللغة، ArabTerm) اسمُ مكان
        يعني الصحراء (الأرض الخالية من العمران)، وليس اسم حالة أو كيفية. وجود الوصيف المباشر
        (حَالَة) في الشبكة يُحتِّم أن تكون لمّات هذه المجموعة أسماء أحوال لا أسماء أمكنة.
        فضلاً عن ذلك يُوقع وجودها في التعريف دورانَ الاسم داخل تعريفه.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حالة الطبيعة"
      decision: confirmed
      decision_reason: >
        المصطلح الفلسفي الأكثر شيوعاً في المكتبة العربية للتعبير عن المفهوم؛ تداولته الترجمات
        الفلسفية العربية ومراجع الفكر السياسي. المورد الحديث يُثبت أن العربية المعاصرة تُرجم
        wild (noun) بـ'الحالة الطبيعية'. اللمّة خالية من التشكيل فتستوجب update_lemma.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تُعبِّر عن المفهوم الفلسفي المُقنَّن (state of nature / état de nature) بوصفه
        مصطلحاً أكاديمياً يُستخدم في نظريات العقد الاجتماعي والفلسفة السياسية،
        في مقابل الوصيف المباشر (حَالَة) الذي هو مفهوم عام
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالَةُ الطَّبِيعَةِ"

    - lemma: "فِطْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم تقاطع الفِطرة مع مفهوم الحالة الأصيلة (الخلقة الأولى، الطبيعة السليمة)،
        إلا أن المعنى الأغلب في استعمالها الموثَّق ديني إسلامي خاص (الجبلّة على قبول
        الدين، صدقة الفطر)، ولم تُستعمَل مصطلحاً فلسفياً عاماً للحالة البدائية
        بمعزل عن الحضارة. الأدلة مختلطة والمعنى المطلوب ثانوي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "بَدَاوَة"
      source: stage1
      decision: removed
      decision_reason: >
        بداوة تعني نمطاً معيشياً بعينه (الحياة الرعوية المتنقلة في البادية) وتُقابل
        nomadism في الاصطلاح الحديث، وهي أخصّ وأضيق من مفهوم المجموعة الذي
        يشمل كل ما لم تطله الحضارة. كما أنها لا تتضمن الدلالة الفلسفية للحالة
        الأصيلة للطبيعة البشرية قبل التعاقد الاجتماعي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَوَحُّش"
      source: stage1
      decision: removed
      decision_reason: >
        تَوَحُّش مصدر للفعل تَوَحَّشَ الذي يدلّ على أفعال محددة (الجوع، إخلاء المعدة،
        رمي الثوب) لا على الحالة الأصيلة للطبيعة. الجذر وإن كان يعني 'خلاف الإنس'
        إلا أن المصدر تَوَحُّش غير موثَّق في المعاجم كاسم لهذا المفهوم المجرد.
        فضلاً عن ذلك يدلّ على عملية (= الصيرورة إلى الوحشية) لا على حالة ثابتة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "فِطْرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الفِطرية في المعجمية العربية مصطلح فلسفي راسخ يعني النزعة الفطرية (Nativism)
        أي القول بأن الأفكار والمبادئ جبلية موجودة في النفس قبل التجربة؛ وهذا مفهوم
        مغاير تماماً لمفهوم المجموعة. الدليل المعجمي يُناقض الاستخدام المقترح.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


