# مراجعة المجموعة الترادفية — awn4-15298227-n
# reaction time / response time / latency / latent period
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «كمون» بدون تشكيل — يلتبس مع الكَمُّون (التابل)"
      - "«وقت الاستجابة» و«وقت رد الفعل» تستخدمان «وقت» بينما الاصطلاح المعجمي الموحّد يستخدم «زمن»"
      - "المجموعة تخلط بين مفهومين متقاربين: الكمون (latency) وزمن ردّ الفعل (reaction time)، وهما في المعاجم التخصصية قد يفترقان"
    observations: "المفهوم يدور حول الفاصل الزمني بين مثير حسّي واستجابة لغوية أو حركية، وهو مصطلح مستقرّ في علم النفس التجريبي والاتصالات. المصطلحات العربية المتاحة تتوزع بين الاشتقاق من جذر «كمن» (الخفاء والاستتار) والتركيب الإضافي (زمن + الاستجابة/ردّ الفعل). ينبغي تصحيح «وقت» إلى «زمن» وفق المعاجم الموحدة."
  blind_candidates:
    - lemma: "كُمُون"
      generation_method: ishtiqaq
      justification: "مصدر من «كَمَنَ يَكْمُنُ كُمُونًا» أي استخفى، على وزن فُعُول. يدلّ على حالة الخفاء والاستتار التي تسبق الظهور، فيصلح مجازاً للدلالة على الفترة الزمنية الكامنة بين التنبيه والاستجابة."
    - lemma: "زَمَنُ الارْتِكَاس"
      generation_method: tarkib
      justification: "مركب إضافي من «زمن» و«ارتكاس» (مصدر ارتكس أي ارتدّ)، يقابل reaction time. الارتكاس أدقّ من «ردّ الفعل» لأنه يدلّ على الاستجابة العصبية السريعة."
    - lemma: "فَتْرَةُ الكُمُون"
      generation_method: tarkib
      justification: "مركب إضافي من «فترة» و«الكمون»، يقابل latent period. مستخدم في علم الأحياء والطبّ للإشارة إلى الفترة الفاصلة بين التنبيه وظهور الأثر."
    - lemma: "خَفَاء"
      generation_method: ishtiqaq
      justification: "مصدر من «خَفِيَ يَخْفَى خَفَاءً» أي استتر، على وزن فَعَال. يدلّ على الاستتار والتواري، وهو بديل اشتقاقي للكمون من جذر آخر (خ ف ي)."


stage2_evidence:
  per_lemma:
    - lemma: "كُمُون"
      confirm:
        - text: "«الكُمُونُ: استتار الشَّيْء عَن الْحس.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«مرادف لتأخر الإشارات أثناء الإرسال في نظام الاتصالات؛ ويكون ذو أهمية في حالة الاستعمالات المرتبطة بالوقت الحقيقي.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«(1) كُمون؛ استتار (2) شيء كامن أو مستتر.»"
          source: "المورد الحديث (2008)"
        - text: "«كمون = latency»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«كمون = latency»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«كمون = latency (in electrobiology)»"
          source: "موسوعة الكهرباء (IEC 60050)"
      contradicts:
        - text: "«(الكمون) نَبَات زراعي عشبي حَولي من الفصيلة الخيمية بزوره من التوابل»"
          source: "المعجم الوسيط"
          conflict: "الكَمُّون (بتشديد الميم) نبات من الفصيلة الخيمية — اشتراك لفظي مع الكُمُون (بضمّتين) المصدر الدالّ على الخفاء"
      expands:
        - text: "«كمون = potential»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
          addition: "كُمُون يُستخدم أيضاً بمعنى الجُهْد الكهربائي (potential) في الفيزياء والطبّ"

    - lemma: "وَقْتُ الاسْتِجَابَة"
      contradicts:
        - text: "«زَمَنُ الاسْتِجابَة = response time» (المعجم الطبي الموحد)، و«زمن الاستجابة = response time» (مسرد الإعلام والتواصل، مسرد الهندسة الكهربائية، موسوعة الكهرباء، مسرد الفن والتسلية والرياضة)"
          source: "عدة معاجم موحدة (ARABTERM)"
          conflict: "المصطلح الموحَّد في جميع المعاجم التخصصية هو «زمن الاستجابة» لا «وقت الاستجابة». لم يُعثر على أيّ مدخل معجمي يستخدم «وقت» بدل «زمن»."

    - lemma: "وَقْتُ رَدِّ الفِعْل"
      contradicts:
        - text: "«زمن ردّ الفعل = reaction time» (مسرد هندسة وتكنولوجيا السيارات)، «زمن ردّ الفعل = reaction time» (مسرد التربية)"
          source: "ARABTERM — مسرد السيارات ومسرد التربية"
          conflict: "المصطلح الموحَّد هو «زمن رد الفعل» لا «وقت رد الفعل»"
      expands:
        - text: "«الفاصل الزمني بين تطبيق الحوافز والكشف عن الاستجابة.»"
          source: "مسرد التربية (ARABTERM)"
          addition: "تعريف تربوي يوضّح المفهوم بأنه الفاصل الزمني بين الحوافز والكشف عن الاستجابة"

    - lemma: "زَمَنُ الارْتِكَاس"
      evidence_status: "no_material_found"

    - lemma: "فَتْرَةُ الكُمُون"
      confirm:
        - text: "«(2) فترة الكمون: الفترة الفاصلة بين التنبيه والاستجابة (نف).»"
          source: "المورد الحديث (2008)"
        - text: "«فترة كمون = latent period»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«(1) دَوْر الكمون: فترة الحضانة الخاصة بمرضٍ ما»"
          source: "المورد الحديث (2008)"
          addition: "دَوْر الكُمُون يُستخدم في الطبّ لفترة الحضانة، وهو مفهوم مجاور لكن مختلف"

    - lemma: "خَفَاء"
      confirm:
        - text: "«خَفاء = latency»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«خَفاءٌ مُطْلَق = absolute latency»، «خَفاءٌ قابِلٌ للاخْتِزال = reducible latency»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "خَفَاء مستخدم في السياق الطبّي العصبي مع مركّبات وصفية متعددة"


