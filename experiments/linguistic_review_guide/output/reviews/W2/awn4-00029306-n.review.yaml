          params: {lemma: "خَلَاءٌ مَحْضٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00029306-n"}

stage4_content:
  definition:
    current: "الفضاء المادي المستقل عما يشغله"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق في جوهره لكنه يفتقر إلى الصياغة المعجمية التي تربطه بالسياق العلمي والفلسفي (المكان كوعاء ثابت)."
    authored:
      - type: terminological
        text: "الفَضَاءُ النُّيُوتِنِيُّ الَّذِي يُفْتَرَضُ وُجُودُهُ بِصِفَةٍ ثَابِتَةٍ وَمُسْتَقِلَّةٍ عَنْ أَيِّ مَادَّةٍ أَوْ أَجْسَامٍ فِيهِ، بِحَيْثُ لَا يَتَأَثَّرُ بِمَا يَشْغَلُهُ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "البُعْدُ المَكَانِيُّ المُجَرَّدُ عَنِ المَادَّةِ وَالأَجْسَامِ، القَائِمُ بِنَفْسِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-00029306-n", definition_index: 0, text: "الفَضَاءُ النُّيُوتِنِيُّ الَّذِي يُفْتَرَضُ وُجُودُهُ بِصِفَةٍ ثَابِتَةٍ وَمُسْتَقِلَّةٍ عَنْ أَيِّ مَادَّةٍ أَوْ أَجْسَامٍ فِيهِ، بِحَيْثُ لَا يَتَأَثَّرُ بِمَا يَشْغَلُهُ."}
  examples:
    per_lemma:
      - lemma: "فَضَاءٌ مُطْلَقٌ"
        examples:
          - text: "يُعَدُّ الفَضَاءُ المُطْلَقُ فِي المِيكَانِيكا النُّيُوتِنِيَّةِ إِطَارًا مَرْجِعِيًّا ثَابِتًا لَا يَتَأَثَّرُ بِالأَجْسَامِ المَادِّيَّةِ."
            type: usage
      - lemma: "خَلَاءٌ"
        examples:
          - text: "نَاقَشَ الفَلَاسِفَةُ القُدَامَى مَفْهُومَ الخَلَاءِ بِاعْتِبَارِهِ بُعْدًا مُجَرَّدًا عَنِ المَادَّةِ."
            type: usage
      - lemma: "مَكَانٌ مُطْلَقٌ"
        examples:
          - text: "تَقُومُ نَظَرِيَّةُ إِسْحَاق نُيُوتِن عَلَى وُجُودِ مَكَانٍ مُطْلَقٍ وَزَمَانٍ مُطْلَقٍ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-00029306-n", text: "يُفْتَرَضُ فِي الفِيزْيَاءِ الكَلَاسِيكِيَّةِ أَنَّ الفَضَاءَ المُطْلَقَ كِيَانٌ ثَابِتٌ لَا تَتَغَيَّرُ خَصَائِصُهُ بِوُجُودِ المَادَّةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "خَلَاءٌ"
      entry_id: "{auto}"
      root: "خلو"
      maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَعَرِّي الشَّيْءِ مِنَ الشَّيْءِ... وَالْمَكَانُ الْخَلَاءُ: الَّذِي لَا شَيْءَ بِهِ.»"
    - lemma: "فَضَاءٌ مُطْلَقٌ"
      entry_id: "{auto}"
      roots:
        - word: "فضاء"
          root: "فضو"
          maqayis_quote: "«الْفَاءُ وَالضَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْفِسَاحٍ فِي شَيْءٍ وَاتِّسَاعٍ. مِنْ ذَلِكَ الْفَضَاءُ: الْمَكَانُ الْوَاسِعُ.»"
        - word: "مطلق"
          root: "طلق"
          maqayis_quote: "«الطَّاءُ وَاللَّامُ وَالْقَافُ أَصْلٌ صَحِيحٌ مُطَّرِدٌ وَاحِدٌ، وَهُوَ يَدُلُّ عَلَى التَّخْلِيَةِ وَالْإِرْسَالِ.»"
    - lemma: "مَكَانٌ مُطْلَقٌ"
