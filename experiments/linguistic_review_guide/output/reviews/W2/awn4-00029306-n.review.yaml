stage1_review:
  assessment:
    concerns:
      - "المصطلح تقني فلسفي وفيزيائي (نيوتني) بامتياز، لذا يحتاج إلى لغة دقيقة تفرق بينه وبين الفضاء النسبي."
      - "اللمة الحالية 'فضاء مطلق' وحيدة، ويمكن إثراؤها بمصطلحات كلاسيكية من علم الكلام والفلسفة العربية."
    observations: "المفهوم يشير إلى المكان كوعاء ثابت ومستقل عن المادة، وهو ما نوقش قديماً تحت مسمى 'الخلاء' وحديثاً في الفيزياء الكلاسيكية باسم 'الفضاء المطلق'."
  blind_candidates:
    - lemma: "خَلَاءٌ"
      generation_method: majaz
      justification: "مصطلح كلاسيكي في علم الكلام والفلسفة يشير إلى البعد المجرد عن المادة."
    - lemma: "فَضَاءٌ مُطْلَقٌ"
      generation_method: tarkib
      justification: "الترجمة المباشرة والمصطلح العلمي الشائع في الفيزياء النيوتنية."
    - lemma: "مَكَانٌ مُطْلَقٌ"
      generation_method: tarkib
      justification: "يستخدم غالباً في الترجمات الفلسفية لأعمال نيوتن (Absolute Space)."
    - lemma: "خَلَاءٌ مَحْضٌ"
      generation_method: tarkib
      justification: "للتأكيد على خلو المكان من المادة واستقلاليته عنها."

stage2_evidence:
  per_lemma:
    - lemma: "خَلَاءٌ"
      confirm:
        - text: "«الخلاء: هو عند المتكلمين امتداد موهوم مفروض في الجسم أو في نفسه صالح، لأن يشغله الجسم وينطبق عليه بعده الموهوم... وحاصله البعد الموهوم الخالي عن الشاغل.»"
          source: "كشّاف اصطلاحات الفنون للتهانوي"
        - text: "«وعند بعض الحكماء هو البعد المجرّد الموجود في الخارج القائم بنفسه سواء كان مشغولا ببعد جسمي أو لم يكن.»"
          source: "كشّاف اصطلاحات الفنون للتهانوي"
      expands:
        - text: "«الخلاء: الفضاء الواسع الخالي من الأرض والمتوضأ لخلوه ومن الأمكنة الذي لا أحد به ولا شيء فيه»"
          source: "المعجم الوسيط"
    - lemma: "فَضَاءٌ مُطْلَقٌ"
      confirm:
        - text: "«حيز (ال...) الزماني - المكاني المطلق: absolute space-time»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
    - lemma: "مَكَانٌ مُطْلَقٌ"
      confirm:
        - text: "«المكان المطلق: هو المكان الذي يبقى دائماً على حاله دون علاقة بأي شيء خارجي.»"
          source: "الموسوعة الفلسفية (بالقياس)"
    - lemma: "خَلَاءٌ مَحْضٌ"
      confirm:
        - text: "«فإنّه عند الحكماء عدم محض ونفي صرف يثبته الوهم ويقدّره من نفسه»"
          source: "كشّاف اصطلاحات الفنون للتهانوي"

