          params: {lemma: "مَكَانٌ مُطْلَقٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00029306-n"}
    - lemma: "خَلَاءٌ مَحْضٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير اصطلاحي يؤكد على الصفة المطلقة والمجردة للمكان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
