# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. اللمّات المرشحة — توليد أعمى (قبل الاطلاع على اللمّات الموجودة)
  # المدخل: التعريف فقط:
  # "علاقة ألفة أو انسجام بين الناس؛ ما يؤثر على أحدهم يؤثر بالمقابل على الآخر"
  blind_candidates:
    - lemma: "تَوَافُق"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعُل من الجذر (و-ف-ق)؛ وزن التفاعل يُعبّر عن الفعل المشترك والمتبادل بين
        طرفين. الانسجام والتطابق بين شخصين بحيث يتّفق ردّ فعلهما إزاء ما يمسّهما — يُلائم
        الدلالة المطلوبة للتآثر المتبادل.

    - lemma: "تَجَاوُب"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعُل من الجذر (ج-و-ب)؛ يدلّ على تبادل الاستجابة بين طرفين، وهو ما يُجسّد
        الجانب التفاعلي من المفهوم: ما يُؤثّر في أحدهم يُوجد استجابةً مقابلة في الآخر.
        الجذر غنيٌّ بدلالة الصدى والانعكاس.

    - lemma: "تَنَاغُم"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعُل من الجذر (ن-غ-م)؛ يُعبّر عن الانسجام الداخلي والتوافق بين عناصر
        متعددة. يُناسب البُعد الألفي/الروحي من المفهوم — تقارب طبائع الناس حتى يتشاركوا
        المشاعر والتأثيرات.

    - lemma: "وِجْدَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من (وِجْدَان) بإضافة ياء النسبة وتاء التأنيث — الوزن المنتج للمفاهيم
        المجردة. يُركّز على صفة المشاركة الوجدانية والتأثّر المتبادل في الشعور والإحساس،
        وهو جوهر المفهوم الإنجليزي (sympathy).

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        تَآلُف يتداخل دلالياً مع الـ hypernym المباشر (أُلْفَة)؛ إذ كلاهما من جذر (أَلَفَ)
        وكلاهما يدلّ على التقارب والانسجام، مما يُضعف التمييز بين المجموعة الفرعية
        وأُمّها.
      - >
        تَآلُف يحمل اشتراكاً لفظياً واسعاً في المعاجم المتخصصة: chord في الفيزياء
        والموسيقى، وagglomerating في الزراعة؛ مما يُنقص دقّته كمصطلح للمفهوم النفسي.
      - >
        الدلالة المحورية للمفهوم — التآثر المتبادل بحيث ما يُصيب أحدهم يُصيب الآخر —
        تجد تعبيرها الأوضح في تَعَاطُف لا في تَآلُف. يُستحسن الإبقاء عليهما معاً
        لتمثيل بُعدَي الانسجام (تَآلُف) والتأثّر العاطفي (تَعَاطُف).
    observations: >
      المجموعة تُمثّل مفهوم (sympathy) بمعناه الكلاسيكي الفلسفي — لا الشفقة وحدها،
      بل المشاركة الوجدانية والتآثر المتبادل. اللمّتان الموجودتان تُغطّيان بُعدَين
      متمايزَيْن: تَآلُف للألفة والانسجام الروحي، وتَعَاطُف للمشاركة الوجدانية
      الفعلية. الجذر (عطف) مُؤصَّل في المقاييس بمعنى الانثناء والميل — ومنه يتسع إلى
      الميل نحو الآخر والتأثّر بحاله. وقد وثّقت معاجم عربية حديثة تَعَاطُف بوصفه
      المقابل العربي الراسخ لـ sympathy في الفلسفة وعلم الاجتماع.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المنفّذة:
# [١] Batch headword lookup: تالف، تعاطف، توافق، تجاوب، تناغم، وجدانية (+ صيغ ال-)
# [٢] English bridge: sympathy, affinity, harmony, fellow feeling
# [٣] Combined enrichment by entry_id (definitions + examples)
# [٤] Maqayis al-Lugha (dict=151): جذور الف، عطف، وجد
stage2_evidence:
  per_lemma:

    # ── لمّة موجودة: تَآلُف ──
    - lemma: "تَآلُف"
      confirm:
        - text: >
            «(تألف) القوم: اجتمعوا تحابّوا — الشيء: تنظّم — إلى فلان: استجار به —
            فلانًا: داراه وقاربه وواصله حتى يستميله إليه»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «(تألف) مطاوع ألفه — ائتلف — فلانًا: استماله»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >
            «(3) تآلُف؛ تجانُس» [ضمن ترجمات affinity]
          source: "المورد الحديث (2008) — المعجم الثنائي"
      contradicts:
        - text: "تآلُف — translation_en: agglomerating — domain: AGROVOC"
          source: "المكنز الزراعي متعدد اللغات (AGROVOC)"
          conflict: >
            يُترجَم بـ"تجمّع/تكتّل" في السياق الزراعي، وهو بعيد تماماً عن دلالة
            العلاقة الإنسانية المطلوبة.
        - text: "تآلُف — translation_en: chord — domain: Physics"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: >
            يُوظَّف بمعنى النغمة المُرَكَّبة (chord) في الفيزياء والموسيقى — اشتراك
            لفظي يُضعف دقّة المصطلح في الحقل النفسي/الاجتماعي.
      expands:
        - text: >
            «التألف: مطاوعة» [إشارة إلى أن التألّف طاوع الألفةَ وتلقّاها]
          source: "دستور العلماء للأحمدنكري"
          addition: >
            يُثبّت أن تَآلُف مصدر طاوع للفعل ألِفَ — أي قبول الألفة من الخارج
            وتلقّيها، وهو ما يُقرّبه من معنى الاستجابة للانسجام المتبادل.

    # ── لمّة موجودة: تَعَاطُف ──
    - lemma: "تَعَاطُف"
      confirm:
        - text: "تعاطف — translation_en: sympathy — domain: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "تعاطف — translation_en: sympathy — domain: Sociology and Anthropology"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
        - text: >
            «(1) تعاطف؛ مشاركة وجدانية
             (2) تجانس؛ تناغم؛ انسجام
             (3) عَطف»
          source: "المورد الحديث (2008) — ترجمة sympathy"
        - text: >
            «(تعاطف) القوم عطف بعضهم على بعض — وفلان في مشيته تثنّى»
          source: "المعجم الوسيط (hawramani)"

    # ── مرشح المرحلة ١: تَوَافُق ──
    - lemma: "تَوَافُق"
      source: stage1
      contradicts:
        - text: >
            «(في الفلسفة): أن يسلك المرء مسلك الجماعة ويتجنّب ما عنده من شذوذ
            في الخُلق والسلوك»
          source: "المعجم الوسيط (OCR — مجمع اللغة العربية)"
          conflict: >
            التعريف يُحصر التوافق في السلوك الاجتماعي الظاهر لا في التآثر
            الوجداني المتبادل — فيُبعده عن sympathy.
      expands:
        - text: "توافق — translation_en: harmony / compatibility / concordance / accord"
          source: "معاجم ARABTERM متعددة (طبية، فيزيائية، تربوية)"
          addition: >
            يُستخدم تَوَافُق في حقول تقنية ومادية متعددة — مما يُفيد بسعة دلالته
            لكنه في الوقت ذاته يُشتّت المعنى بعيداً عن الحقل الإنساني/الوجداني.

    # ── مرشح المرحلة ١: تَجَاوُب ──
    - lemma: "تَجَاوُب"
      source: stage1
      expands:
        - text: >
            «القومُ: تحاوروا جاوب بعضهم بعضًا — استُعير للطير والإبل والخيل،
            يُقال: تجاوبت القمريّتان — لا يتجاوب أوّل كلامه وآخره — كلام فلان
            متناسب متجاوب»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            يدلّ على التبادل اللفظي والصوتي والفكري بين طرفين — يُفيد دلالة
            الردّ والصدى لكنه لا يُحدّد الطابع الوجداني/العاطفي الذي يميّز
            sympathy.

    # ── مرشح المرحلة ١: تَنَاغُم ──
    - lemma: "تَنَاغُم"
      source: stage1
      contradicts:
        - text: >
            «انسجام الأصوات في تلاحق كلماتها وتوافق حروفها، وهو ضد التنافر،
            ومنه جاء الحديث عن النغم كلحظة انفعالية»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: >
            التعريف يُقيّد تَنَاغُم بالحقل الصوتي/اللساني؛ sympathy مفهوم
            إنساني وجداني لا صوتي.
        - text: "تناغم — translation_en: assonance / consonance — domain: Arts, Recreation and Sports"
          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: >
            يُرسّخ تقييد تَنَاغُم بالحقل الصوتي والموسيقي.

    # ── مرشح المرحلة ١: وِجْدَانِيَّة ──
    - lemma: "وِجْدَانِيَّة"
      source: stage1
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: تَآلُف ──
    - lemma: "تَآلُف"
      decision: confirmed
      decision_reason: >
        رغم الاشتراك اللفظي مع الحقول التقنية (chord/agglomerating)، يبقى تَآلُف
        المصطلح العربي الأوفى للتعبير عن "البُعد الانسجامي والألفي" في المفهوم —
        وهو بُعد حقيقي في (sympathy) يُميّزه عن مجرد التعاطف الوجداني. كما أن
        المورد الحديث يُثبّت دلالته على affinity/تجانس. يُستبقى مقروناً بتَعَاطُف
        لتغطية البُعدَيْن معاً، مع توثيق الفرق الدلالي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَآلُف يُعبّر عن حالة الألفة والانسجام الناشئة من التقارب والاجتماع —
        يُركّز على البُعد الوجودي/الحضوري للعلاقة؛ الناس يتألّفون حين يشتركون
        في الطبع والمصالح. وهو أقرب إلى الوصف الموضوعي للرابطة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَآلُف"

    # ── لمّة موجودة: تَعَاطُف ──
    - lemma: "تَعَاطُف"
      decision: confirmed
      decision_reason: >
        موثّق صراحةً في معاجم ARABTERM المتخصصة (الفلسفة وعلم النفس، علم الاجتماع)
        بوصفه المقابل العربي لـ sympathy؛ ويُثبّته المورد الحديث بـ"مشاركة وجدانية".
        المعجم الوسيط يُثبّت معناه "عطف بعضهم على بعض" — التبادل هو العمود الفقري
        للمفهوم. المقاييس (عطف = انثناء وعياج) تُؤصّل الدلالة: الميل نحو الآخر
        والانعطاف بالوجدان إليه. مصطلح راسخ ومُجمَع عليه في سياقات التأليف المتخصص.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَعَاطُف يُعبّر عن المشاركة الوجدانية الفعلية والتأثّر المتبادل بمشاعر الآخر —
        يُركّز على البُعد العاطفي التفاعلي؛ ما يُصيب أحدهم ينعطف على الآخر ويُؤثّر
        فيه. وهو أقرب إلى الوصف الديناميكي/الانفعالي للعلاقة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَاطُف"

    # ── مرشح المرحلة ١: تَوَافُق ──
    - lemma: "تَوَافُق"
      source: stage1
      decision: removed
      decision_reason: >
        التعريف اللغوي يحصر التوافق في مسايرة السلوك الاجتماعي لا في التآثر الوجداني
        المتبادل. دلالته في المعاجم المتخصصة موزّعة بين compatibility وconcordance —
        أي توافق التقنية والمادة — لا توافق المشاعر والوجدان. لا يحمل العنصر التفاعلي
        الوجداني الذي هو جوهر (sympathy).

    # ── مرشح المرحلة ١: تَجَاوُب ──
    - lemma: "تَجَاوُب"
      source: stage1
      decision: removed
      decision_reason: >
        تَجَاوُب يُعبّر عن التبادل اللفظي والصوتي والفكري — التحاور والتناوب في
        الكلام — ولا يحمل الطابع الوجداني/العاطفي الذي يُميّز (sympathy). كما أنه
        في الاستعمال الأدبي يُستعار للطير والإبل، مما يُضعف خصوصيته الإنسانية
        الوجدانية.

    # ── مرشح المرحلة ١: تَنَاغُم ──
    - lemma: "تَنَاغُم"
      source: stage1
      decision: removed
      decision_reason: >
        تَنَاغُم مُقيَّد في المعاجم المتخصصة بالحقل الصوتي والموسيقي (consonance,
        assonance, harmony of sounds). معجم الصواب اللغوي يُثبّت أن الاستعمال العام
        صُحِّح حديثاً بقرار مجمعي، لكنه يظلّ مثقلاً بالطابع الصوتي بعيداً عن
        الدلالة الوجدانية الإنسانية المطلوبة.

    # ── مرشح المرحلة ١: وِجْدَانِيَّة ──
    - lemma: "وِجْدَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مصدر صناعي مبتكر لا تُثبّته المعاجم المتداولة بوصفه مصطلحاً مسكوكاً.
        فضلاً عن ذلك، فإن الجذر (وجد) في المقاييس يدلّ على الإيجاد والغضب —
        والمصطلح الراسخ في هذا الحقل هو "الوجدانية" بمعنى النزعة العاطفية عامةً،
        لا بمعنى sympathy تحديداً. اختبار السكّ: يمكن إبدال "وجدانية" بـ"عاطفية"
        ويبقى الوصف صالحاً — دليل على أنها ليست مصطلحاً.


