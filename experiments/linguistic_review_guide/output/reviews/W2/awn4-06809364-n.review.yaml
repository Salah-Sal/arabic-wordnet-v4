# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-06809364-n  |  ILI: i72201  |  POS: n
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'تواصل الحيوانات' بدون تشكيل، وهو ما يخالف معيار التشكيل الكامل"
      - "التعريف الحالي دوري: يستخدم 'التواصل' في تعريف 'تواصل الحيوانات'"
      - "التعريف لا يشمل الأنماط المتعددة (صوتية، بصرية، كيميائية) التي يُميّز بها الباحثون التواصل الحيواني"
      - "المجموعة تقتصر على لمّة واحدة رغم وجود مصطلحات موثّقة في المعاجم التخصصية"
    observations: >
      المجموعة تمثّل مفهوماً علمياً محدداً يندرج تحت علم السيميائية الحيوانية
      (Zoosemiotics). التعريف الحالي ضعيف دلالياً لاعتماده المصطلح ذاته في الشرح.
      الهرم الدلالي سليم: المجموعة ترتكز تحت "إشارة/علامة" (awn4-06804229-n) وهو
      منطقي؛ إذ التواصل الحيواني نظام من العلامات. غير أن غياب مصطلحات موثّقة في
      هذه المجموعة يضعف تمثيلها في الشبكة المعجمية.
  blind_candidates:
    - lemma: "تَخَابُرُ الحَيَوَانَاتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من جذر "خبر" (التَّخَابُر = تبادُل الأخبار والمعلومات، على
        وزن التفاعل). يُحيل إلى عملية تبادل المعلومات بين كيانات متعددة، وهو
        ما يصف التواصل الحيواني. توليد بالتركيب الإضافي.
    - lemma: "اتِّصَالٌ حَيَوَانِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من "اتصال" (جذر وصل، وزن افتعال) و"حيواني" (نسبة إلى حيوان).
        "الاتصال" يعني الوصل والتواصل بين طرفين. الصفة "حيواني" تخصّص النوع.
        المركب وصفي (wasfi) مستوفٍ لاختبار السكّ.
    - lemma: "لُغَةُ الحَيَوَانِ"
      generation_method: majaz
      justification: >
        مجاز بتوسيع مفهوم "اللغة" ليشمل نظام التواصل الغريزي لدى الحيوانات.
        اللغة في الأصل مشتقة من "لغو" بمعنى اللهج بالشيء وهو ما يصف
        نظام الإشارات المتكرر عند الحيوانات. تركيب إضافي (idafi).
    - lemma: "تَوَاصُلٌ حَيَوَانِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من "تواصل" (جذر وصل، وزن تفاعل) و"حيواني" (نسبة).
        التفاعل في وزن تَفَاعَل يدل على الاشتراك بين طرفين، مما يعبّر
        عن ثنائية التواصل. بديل وصفي للتركيب الإضافي الموجود.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفّذة: ٥ استعلامات
# (١) دفعي للمّات والمكوّنات | (٢) الجسر الإنجليزي | (٣) التحقق من المرشحات
# (٤) إثراء بالمعرّف (definitions+examples) | (٥) مقاييس اللغة
stage2_evidence:
  per_lemma:
    - lemma: "تواصل الحيوانات"
      confirm:
        - text: "«تواصُل: اتصال متبادل»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«تواصُل: نقل الأخبار بواسطة العلامات والإشارات بين مرسل إلى متلقٍ عبر قناة ما، حيث يعمل التواصل بشكل جيّد في وضعية تقاسم الشفرة وغياب التشويش»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ArabTerm"
        - text: "«التواصل يتضمن في تعريفه إعطاء المعلومة والحصول على رد الفعل»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ArabTerm"
      expands:
        - text: "«وَصَلَ: الواو والصاد واللام: أصلٌ واحدٌ يدلّ على ضمّ شيءٍ إلى شيءٍ حتى يعلقه»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر الأصلي للتواصل (وصل) يدل على الربط والصلة المتبادلة، وهو ما يُعلّل دلالة التواصل على التبادلية"

    - lemma: "تَخَابُرُ الحَيَوَانَاتِ"
      evidence_status: "no_material_found"

    - lemma: "اتِّصَالٌ حَيَوَانِيّ"
      confirm:
        - text: "«اتصال حيوانيّ: طرق وكيفية الاتصال بين كيانات وكائنات حيوانية في الجو والبر والمياه»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm) — translation_en: animal communication"

    - lemma: "لُغَةُ الحَيَوَانِ"
      confirm:
        - text: "«لغة الحيوان: نسق من الإشارات الصوتية والحركية تستخدمها الحيوانات للتواصل فيما بينها. مثال: لغة النحل.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm) — translation_en: animal language"
        - text: "«لغة الحيوان: نسق من الإشارات الصوتية والحركية تستخدمها الحيوانات للتواصل فيما بينها. مثال: لغة النحل.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ArabTerm — translation_en: Animal language"
      expands:
        - text: "«لَغَوَ: اللام والغين والحرف المعتل أصلان صحيحان، أحدهما يدل على الشيء لا يُعتدّ به، والآخر على اللهج بالشيء... ويقال إن اشتقاق اللغة منه، أي يلهج صاحبها بها»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل 'اللغة' في مقاييس ابن فارس مرتبط باللهج والاستمرار، وهو ما يُشبه نمط التواصل الغريزي المتكرر عند الحيوانات"

    - lemma: "تَوَاصُلٌ حَيَوَانِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "تواصل الحيوانات"
      decision: confirmed
      decision_reason: >
        اللمّة سليمة نحوياً ودلالياً: تركيب إضافي (تواصُل + الحيوانات)، جذر وصل
        على وزن التفاعل يدل على الاشتراك بين طرفين، وهو دقيق للتواصل الحيواني.
        غياب الأدلة المباشرة في قاعدة البيانات لا يُبطل المصطلح، إذ "تواصل"
        موثّق مستقلاً في معاجم متعددة بالمعنى المطلوب. يجب تحديث التشكيل
        الكامل للمّة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يركّز على العملية التبادلية ذاتها (من تَفَاعَل: الاشتراك المتبادل)؛
        يُبرز ثنائية الإرسال والاستقبال بين أفراد النوع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَاصُلُ الحَيَوَانَاتِ"

    # ── المرشح ١ (مرفوض) ──
    - lemma: "تَخَابُرُ الحَيَوَانَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        مرفوض لسببين: أولاً، "تخابر" في العربية المعاصرة محمّل بدلالة التجسس
        وتبادل المعلومات السرية مع العدو ("تخابر مع جهات أجنبية")، مما يُعطي
        المصطلح إيحاءً سلبياً غريباً عن التواصل الحيواني البريء. ثانياً، لا
        أدلة معجمية في قاعدة البيانات تربطه بالتواصل الحيواني.
      evidence_assessment:
        case: no_material

    # ── المرشح ٢ (مؤكّد) ──
    - lemma: "اتِّصَالٌ حَيَوَانِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مؤكَّد بدليل من ARABTERM (مسرد الإعلام والتواصل، ALECSO) حيث وردت
        العبارة بالضبط مع translation_en = "animal communication"، وهو يساوي
        المفهوم المطلوب في AWN. الاتصال (وزن افتعال من وصل) يدل على بلوغ الصلة
        وتحقيقها، في حين يُبرز "حيواني" الصفة النوعية. اجتاز اختبار السكّ:
        إبدال "حيواني" بـ"بشري" يُنتج مصطلحاً مختلفاً لا مرادفاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يركّز على بُلوغ الصلة ونتيجة الوصل (من افتعَل للتكلّف والمبالغة)،
        يُستخدم في السياقات التقنية والعلمية الرسمية حيث يُطلب التحديد
        الاصطلاحي الدقيق.
      actions:
        - command: create_entry
          params:
            lemma: "اتِّصَالٌ حَيَوَانِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── المرشح ٣ (مؤكَّد) ──
    - lemma: "لُغَةُ الحَيَوَانِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مؤكَّد بأدلة من معجمَين في ARABTERM (مسرد الإعلام والتواصل +
        المعجم الموحد لمصطلحات اللسانيات 2002). يُجسّد هذا المصطلح المنظور
        اللساني الذي يعدّ التواصل الحيواني نسقاً من الرموز والإشارات قابلاً
        للتحليل البنيوي. اجتاز اختبار التثبيت المعجمي بوجوده في معجمَين
        أكاديميَّين مستقلَّين. اجتاز اختبار السكّ: "نظام الحيوان" لا يُعطي
        المعنى ذاته.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُمثّل التواصل الحيواني بوصفه نسقاً إشارياً بنيوياً (نظام/لغة)، لا
        مجرد عملية تبادل؛ يُستخدم في سياق اللسانيات وعلم الحيوان حين يُراد
        دراسة بنية نظام الإشارات في حد ذاتها.
      actions:
        - command: create_entry
          params:
            lemma: "لُغَةُ الحَيَوَانِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── المرشح ٤ (مرفوض) ──
    - lemma: "تَوَاصُلٌ حَيَوَانِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        مرفوض لأنه يكرر اللمّة الموجودة "تواصل الحيوانات" صياغياً دون أن يُضيف
        قيمة دلالية مميّزة، ولا توجد له أدلة معجمية مستقلة. التمييز بين
        الإضافي والوصفي وحده لا يُبرر وجود لمّتَين متشابهتَي الجذر في المجموعة.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "التواصل بين الحيوانات (من نفس النوع)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دوري: يستخدم "التواصل" لتعريف "تواصل الحيوانات". كما أنه
        ناقص الفصل النوعي: لا يذكر آليات التواصل (صوتية، بصرية، كيميائية) ولا
        غاياته (التزاوج، التحذير، التنسيق). الجنس القريب غائب: لا يذكر أن هذا
        "نظام" أو "عملية". أيضاً العبارة بين قوسَين "(من نفس النوع)" ينبغي
        أن تُدمج في بنية التعريف لا أن تُضاف بين قوسَين.
    authored:
      - type: terminological
        text: >
          ضربٌ من العلاقاتِ التبادليةِ بين أفرادِ النوعِ الواحدِ من الحيوانات،
          تُنقل فيه الإشاراتُ والرسائلُ عبر القنواتِ الصوتيةِ والبصريةِ
          والكيميائيةِ والحركيةِ، لأغراضٍ غريزيةٍ كالتزاوجِ والتحذيرِ من
          الأخطارِ وتنسيقِ السلوكِ الجماعيِّ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          منظومةٌ من الإشاراتِ والسلوكياتِ الاتصاليةِ التي طوّرها الحيوانُ
          تطوّراً غريزياً للتفاهمِ مع أبناءِ نوعِهِ؛ تشملُ الأصواتَ كصياحِ
          الطيورِ، والحركاتِ كرقصةِ النحلِ، والمواد الكيميائية كالفيرومونات.
          يدرسُها علمُ السيميائياتِ الحيوانيةِ (Zoosemiotics)
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            ضربٌ من العلاقاتِ التبادليةِ بين أفرادِ النوعِ الواحدِ من الحيوانات،
            تُنقل فيه الإشاراتُ والرسائلُ عبر القنواتِ الصوتيةِ والبصريةِ
            والكيميائيةِ والحركيةِ، لأغراضٍ غريزيةٍ كالتزاوجِ والتحذيرِ من
            الأخطارِ وتنسيقِ السلوكِ الجماعيِّ
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >
            منظومةٌ من الإشاراتِ والسلوكياتِ الاتصاليةِ التي طوّرها الحيوانُ
            تطوّراً غريزياً للتفاهمِ مع أبناءِ نوعِهِ؛ تشملُ الأصواتَ كصياحِ
            الطيورِ، والحركاتِ كرقصةِ النحلِ، والمواد الكيميائية كالفيرومونات

  examples:
    per_lemma:
      - lemma: "تَوَاصُلُ الحَيَوَانَاتِ"
        examples:
          - text: "يُعدّ تَوَاصُلُ الحَيَوَانَاتِ أعقدَ مما كان يُظنّ؛ إذ تستخدم الدلافينُ نظاماً من النقراتِ الصوتيةِ للتمييزِ بين أفراد المجموعةِ الواحدةِ"
            type: usage
      - lemma: "اتِّصَالٌ حَيَوَانِيّ"
        examples:
          - text: "كشفت دراساتُ الاتصالِ الحيوانيِّ أن النحلَ تُحدّد موقعَ مصادرِ الرحيقِ بدقةٍ عبر رقصةٍ تُرمّز المسافةَ والاتجاهَ"
            type: usage
      - lemma: "لُغَةُ الحَيَوَانِ"
        examples:
          - text: "خصّص الباحثون فصلاً كاملاً لتحليل لُغَةِ الحَيَوَانِ في ضوءِ اللسانياتِ البنيويةِ، مبيّنين أنها تفتقر إلى خاصيتَي التعاضدِ والانتقالِ اللتين تُميّزان اللغةَ البشريةَ"
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدّ تَوَاصُلُ الحَيَوَانَاتِ أعقدَ مما كان يُظنّ؛ إذ تستخدم الدلافينُ نظاماً من النقراتِ الصوتيةِ للتمييزِ بين أفراد المجموعةِ الواحدةِ"
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كشفت دراساتُ الاتصالِ الحيوانيِّ أن النحلَ تُحدّد موقعَ مصادرِ الرحيقِ بدقةٍ عبر رقصةٍ تُرمّز المسافةَ والاتجاهَ"
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "خصّص الباحثون فصلاً كاملاً لتحليل لُغَةِ الحَيَوَانِ في ضوءِ اللسانياتِ البنيويةِ، مبيّنين أنها تفتقر إلى خاصيتَي التعاضدِ والانتقالِ اللتين تُميّزان اللغةَ البشريةَ"


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
