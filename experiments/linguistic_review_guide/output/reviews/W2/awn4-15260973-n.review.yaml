# مراجعة المجموعة الترادفية: awn4-15260973-n (microsecond)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ميكروثانية» بدون تشكيل كامل"
      - "وجود صيغة بديلة «مكروثانية» (بدون ياء) في بعض المعاجم — يجب تحديد الصيغة المعيارية"
      - "المجموعة تحتوي لمّة واحدة فقط — قد تحتاج إثراء"
    observations: "المفهوم وحدة قياس زمنية حديثة تساوي جزءاً من مليون من الثانية. هذا مصطلح تقني علمي صرف، والتعريب هو المسلك الطبيعي له لأنّ البادئة «ميكرو-» (micro-) اصطلاح عالمي موحّد في نظام الوحدات الدولي (SI). لا يوجد مقابل تراثي عربي لهذا المفهوم الدقيق. التعريف العربي الحالي صحيح وواضح."
  blind_candidates:
    - lemma: "مِكْرُوثَانِيَة"
      generation_method: taarib
      justification: "تعريب البادئة الدولية micro- مضافة إلى «ثانية». صيغة شائعة في المعاجم العلمية العربية بدون ياء بعد الميم، وتقبل لام التعريف والجمع."
    - lemma: "مُلَيْوَنِيَّةُ الثَّانِيَة"
      generation_method: tarkib
      justification: "مركب إضافي من «مُلَيْوَنِيَّة» (تصغير + نسبة من مليون، أي الجزء المليوني) و«الثانية». يصف المفهوم بدقة لكنه غير مسكوك معجمياً."
    - lemma: "ثُنَيَّة"
      generation_method: ishtiqaq
      justification: "تصغير «ثانية» على وزن فُعَيْلَة، بمعنى الثانية الصغيرة جداً. لكنه غير دقيق لأنه لا يحدد نسبة التصغير (واحد من مليون)."
    - lemma: "مِيكْرُوثَانِيَة"
      generation_method: taarib
      justification: "تعريب آخر بإشباع ياء بعد الميم، وهو الأكثر شيوعاً في الاستعمال المعاصر. البادئة «ميكرو» مثبتة في المعاجم الحديثة."

stage2_evidence:
  per_lemma:
    - lemma: "مِيكْرُوثَانِيَة"
      confirm:
        - text: "«الميكروثانية: جزء من مليون من الثانية.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«بادئة معناها: [...] «ج» جزء من مليون من وحدة معيّنة microsecond»"
          source: "المورد الحديث (2008) — مدخل micr-"
          addition: "يوضح أن البادئة ميكرو- تعني جزءاً من مليون من أي وحدة"
    - lemma: "مِكْرُوثَانِيَة"
      confirm:
        - text: "«جزءٌ من مليون من الثانية 6-^10.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«مِكْرُوثانيَة» (ترجمة: microsecond)"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«رمز مِكْروثانية» (ترجمة: microsec.)"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُثبت وجود رمز مختصر للمصطلح"
    - lemma: "مُلَيْوَنِيَّةُ الثَّانِيَة"
      evidence_status: "no_material_found"
    - lemma: "ثُنَيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مِيكْرُوثَانِيَة"
      decision: confirmed
      decision_reason: "مصطلح معرَّب مثبت في المورد الحديث بهذه الصيغة (بالياء)، وهو الأكثر تداولاً في الاستعمال العلمي المعاصر. يوافق النظام الدولي للوحدات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيكْرُوثَانِيَة"

    - lemma: "مِكْرُوثَانِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة بديلة مثبتة في معجم مصطلحات المعلوماتية والمعجم الطبي الموحد. تختلف عن الصيغة الأولى بحذف الياء بعد الميم، وهي شائعة في المعاجم المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "صيغة تعريب مختصرة بحذف الياء بعد الميم (مِكرو- بدل ميكرو-)، أكثر شيوعاً في المعاجم المتخصصة التقنية والطبية"
      actions:
        - command: create_entry
          params: {lemma: "مِكْرُوثَانِيَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُلَيْوَنِيَّةُ الثَّانِيَة"
      source: stage1
      decision: removed
      decision_reason: "مركب إضافي غير مسكوك معجمياً ولا مُثبت في أي مصدر. وصف حر وليس مصطلحاً."

    - lemma: "ثُنَيَّة"
      source: stage1
      decision: removed
      decision_reason: "تصغير لا يحدد النسبة الدقيقة (واحد من مليون)، ولا شاهد معجمي على استعماله بهذا المعنى. قد يلتبس بثُنَيَّة بمعنى الطريق بين الجبلين."

