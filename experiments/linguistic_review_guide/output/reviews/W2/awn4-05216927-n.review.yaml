# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «نهائية» تدل في العربية على «الصفة النهائية/الختامية» (finality / terminality) لا على «صفة التناهي» (finiteness)؛ وهو خلط مفاهيمي بين finite وfinal"
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "يغيب «التَّنَاهِي» وهو المصطلح الفلسفي والرياضي الراسخ في العربية الحديثة لهذا المفهوم، ومقابله «اللَّاتَّنَاهِي» (infinitude) مما يُثبت استقرار الزوج الاصطلاحي"
    observations: "المجموعة تتناول مفهوماً فلسفياً ورياضياً مجرداً هو «صفة التناهي والمحدودية» في مقابل اللاتناهي. المفهوم عربيٌّ الجذر، يتفرع من (ن-ه-ي) الدال على الغاية والبلوغ، ومن (ح-د-د) الدال على المنع وطرف الشيء. «مَحْدُودِيَّة» مُثبَتة في المعاجم الحديثة كالمورد الحديث (ترجمة finitude) وفي المعاجم المصطلحية (محدودية السوق، تأثير محدودية المكان). «نهائية» بالمقابل تُستعمل ترجمةً لـ terminal وfinal لا لـ finite، وهو ما تشهد به المعاجم الموحدة للرياضيات والفيزياء."
  blind_candidates:
    - lemma: "التَّنَاهِي"
      generation_method: ishtiqaq
      justification: "مصدر الفعل «تناهى» على وزن التَّفَاعُل من جذر (ن-ه-ي)، دالٌّ على خاصية بلوغ الغاية والنهاية؛ الاشتقاق على هذا الوزن يُعبّر عن الصفة المجردة للفعل المتبادل (تناهى الشيء = بلغ نهايته)، فهو يُناسب التعبير عن الصفة الجوهرية للشيء المتناهي"
    - lemma: "الاِنْتِهَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن الاِفْتِعَالِيَّة من «انتهى» (ثلاثي مزيد بالهمزة والتاء)، يدل على صفة الانتهاء والتحديد بنهاية فعلية؛ اشتقاق منتج وإن كان أثقل صياغةً من التناهي"
    - lemma: "التَّحَدُّدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تحدَّد» (تفعَّل من ح-د-د)، يدل على صفة الانحصار في حدود معيّنة وكون الشيء مقيّداً بحدّ؛ يُركز على الجانب الحدِّي (boundary) في المفهوم"
    - lemma: "الحُدُودِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «حدود» + النسبة (يّ) + المصدر (ة)، يدل على صفة الانحصار في حدود محددة وكون الشيء ذا نطاق لا يتجاوزه؛ مرتبط بمعنى الحصر والمنع في أصل الجذر (ح-د-د)"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفّذة:
# Q1 — Batch headword: محدودية/نهائية/التناهي/تناهي + candidate norms
# Q2 — English bridge: finiteness/finitude/boundedness/finite/limited/bounded
# Q3 — Arabic FTS: متناهي/التناهي/محدودية/نهائية/متناه
# Q4 — Maqayis al-Lugha: جذرا حدد (id=985810) ونهي (id=989280)
stage2_evidence:
  per_lemma:
    - lemma: "محدودية"
      confirm:
        - text: "«المحدوديّة؛ التّناهي.»"
          source: "المورد الحديث (2008)، entry_id=688150 — ترجمة كلمة finitude"
        - text: "«مَحْدودية التفكير؛ ضِيْقٌ في أُفُق التفكير.»"
          source: "المورد الحديث (2008)، entry_id=706250 — ترجمة parochialism؛ يُثبت محدودية اسماً مصدرياً راسخاً"
        - text: "«محدودية السوق»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)، entry_id=407494 — ترجمة limitation of the market"
        - text: "«تاثير محدودية المكان؛ تأثير التضييق»"
          source: "موسوعة الكهرباء IEC 60050، entry_id=508425 — ترجمة pinch effect"

    - lemma: "نهائية"
      contradicts:
        - text: "«(1) محدود؛ مُتناهٍ / (2) زائلٌ؛ غير دائم / (3) شيء محدود أو متناهٍ إلخ.»"
          source: "المورد الحديث (2008)، entry_id=688148 — ترجمة finite"
          conflict: "المورد يُترجم «finite» بـ«محدود/متناهٍ» لا بـ«نهائي»، مما يكشف أن العربية تُفرّق بين finite (متناهٍ) وfinal (نهائي)"
        - text: "«سرعة نهائية»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)، entry_id=417873 — ترجمة terminal velocity"
          conflict: "«نهائية» راسخةٌ في المعجم الرياضي كصفة لـ terminal/final (ختامي، أخير)، لا كمقابل لـ finite"
        - text: "«المحدوديّة؛ التّناهي.»"
          source: "المورد الحديث (2008)، entry_id=688150 — ترجمة finitude"
          conflict: "المورد يُثبت «المحدودية» و«التناهي» معاً كترجمتَيْن لـ finitude دون ذكر «نهائية»، مما يُقصيها من الحقل الدلالي المطلوب"

    - lemma: "التَّنَاهِي"
      confirm:
        - text: "«المحدوديّة؛ التّناهي.»"
          source: "المورد الحديث (2008)، entry_id=688150 — ترجمة finitude"
        - text: "«مذهب التناهي»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم، entry_id=489678 — ترجمة finitude"
      expands:
        - text: "«(تناهى) الشَّيْءُ بَلَغَ نِهَايَتَهُ»"
          source: "المعجم الوسيط، entry_id=892052"
          addition: "يكشف الأصل الاشتقاقي: التناهي = صفة بلوغ النهاية، وهو تماماً ما يعنيه finiteness (كون الشيء ذا نهاية)"
        - text: "«(1) اللاتناهي؛ عدم التناهي / (2) اللامتناهي: شيء لامتناهٍ / (3) العدد اللامتناهي؛ الكمية اللامتناهية.»"
          source: "المورد الحديث (2008)، entry_id=695084 — ترجمة infinitude"
          addition: "وجود المقابل «عدم التناهي / اللاتناهي» = infinitude يُثبت بالمقابلة المصطلحية أن «التناهي» = finiteness؛ الزوج مستقر في المعجمية العربية"
        - text: "«تَنَاهِي / من (ن ه ي) وهو الكف عن الشيء، وآخر الشيء ونهايته.»"
          source: "موسوعة السلطان قابوس لأسماء العرب، entry_id=918706"
          addition: "يُثبت تناهي (دون ال) بمعنى «آخر الشيء ونهايته»، مما يدعم استعماله اسماً مصدرياً للمفهوم"

    - lemma: "الاِنْتِهَائِيَّة"
      evidence_status: "no_material_found"

    - lemma: "التَّحَدُّدِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الحُدُودِيَّة"
      contradicts:
        - text: "«حدودية» — كثيرة الحدود"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)، entry_id=417141 — ترجمة polynomial"
          conflict: "«حدودية» مسكوكةٌ في المعجم الرياضي العربي بمعنى «كثيرة الحدود» (polynomial)، وهو معنى تقني مختلف تماماً عن صفة التناهي والمحدودية؛ يجعل استخدامها هنا ملتبساً"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "محدودية"
      decision: confirmed
      decision_reason: "لمّة مُثبَتة بأدلة قوية في المورد الحديث (ترجمة finitude) وفي المعاجم المصطلحية (محدودية السوق، محدودية المكان). مصدر صناعي منتج على وزن فَعْلُولِيَّة من «محدود» (اسم مفعول من حدَّ-يحدُّ). ملائمة صرفياً ودلالياً ومستعملة في سياقات متنوعة. تحتاج إلى إضافة التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُركز على الجانب التقييدي والحصري في المفهوم (الحاجز المانع من أصل ح-د-د = المنع وطرف الشيء)؛ شائعة في السياقات العملية: الموارد والقدرات والأسواق والتقنية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَحْدُودِيَّة"

    - lemma: "نهائية"
      decision: removed
      decision_reason: "«نهائية» في العربية تعني صفة الشيء الخاتم/الأخير (finality, terminality)، لا صفة التناهي والمحدودية (finiteness). المعاجم الموحدة تستعملها ترجمةً لـ terminal وfinal لا لـ finite. المورد الحديث يُثبت «المحدودية والتناهي» كترجمتَيْن لـ finitude/finiteness دون أي ذكر لـ«نهائية». الخلط بين finite وfinal خطأٌ مفاهيمي لأن النهائي (final) يعني الأخير في سلسلة، بينما المتناهي (finite) يعني ذو نهاية وحدود — وهما مفهومان مختلفان في الفلسفة والرياضيات. إبقاؤها يُوقع القارئ في لبس مع مفهوم الختامية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "التَّنَاهِي"
      source: stage1
      decision: confirmed
      decision_reason: "مُثبَتٌ بصورة قاطعة في المورد الحديث (ترجمة finitude إلى جانب المحدودية) وفي مسرد الفلسفة وعلم النفس (مذهب التناهي = finitude). مصدر تفاعل على وزن التَّنَاهِي من الجذر (ن-ه-ي) الدال على الغاية والبلوغ. مقابله المعجمي «اللاتناهي/عدم التناهي» = infinitude يُثبت استقرار الزوج الاصطلاحي. هو المصطلح الفلسفي والرياضي الأكثر دقةً ورسوخاً في العربية لهذا المفهوم. يُعوَّض به اللمّة المحذوفة «نهائية»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الجانب الغائي في المفهوم (بلوغ النهاية من أصل ن-ه-ي = الغاية والبلوغ)؛ راسخٌ في الفلسفة والمنطق والرياضيات ومزدوج مع «اللَّاتَّنَاهِي» في الاصطلاح العلمي"
      actions:
        - command: create_entry
          params:
            lemma: "التَّنَاهِي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05216927-n"

    - lemma: "الاِنْتِهَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجَد أدلة معجمية على استعمالها مصطلحاً مسكوكاً. الاشتقاق سليم صرفياً لكن «التَّنَاهِي» أسبق وأرسخ في نفس الوظيفة الدلالية ولا داعي للمزاحمة بصيغة أثقل."

    - lemma: "التَّحَدُّدِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة على استعمالها مصطلحاً مسكوكاً في المعاجم، وتبدو وصفاً مُركَّباً آنيّاً لا وحدةً معجمية ثابتة. اختبار السكّ: يمكن الاستعاضة عنها بـ«صفة التحديد» دون فقدان المعنى، مما يعني أنها ليست مصطلحاً بالمعنى الدقيق."

    - lemma: "الحُدُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مُعارَضة بأدلة صريحة: المعجم الموحد للرياضيات والفلك يُثبتها بمعنى «كثيرة الحدود» (polynomial)، وهو مصطلح تقني راسخ مختلف تماماً. استخدامها بمعنى finiteness سيُوقع في التباس مع المصطلح الرياضي."


