stage1_review:
  assessment:
    concerns:
      - "لمة «وَطَنِيَّة» تحمل في المعاجم والاستخدام الحديث معنى «الإخلاص للوطن والدفاع عنه» (patriotism)، لا صفة المولد والانتماء المكاني (nativeness)؛ وهو تعارض دلالي جوهري."
      - "المفهوم (nativeness = صفة الانتماء بحكم المولد) يعاني من شُحّ في المصطلحية العربية الحديثة؛ معظم المعاجم تعبّر عنه بالصفة (أصلي، وطني، محلي) لا بمصدر صناعي مخصص."
      - "لا تعريف لغوي بأسلوب المعجم الوسيط متاح للمجموعة — التعريف الحالي صحيح لكنه وصفي وليس مصطلحياً صريحاً."
    observations: >
      المجموعة تمثّل مفهوماً دقيقاً هو «كيفية النسبة إلى مكان بحكم المولد لا بالاكتساب»،
      وهو أمر يُعبَّر عنه في العربية الفصيحة بالصفة (أصلي، عريق، ابن البلد) أكثر من المصدر الصناعي.
      «أَصْلِيَّة» مدعومة بالمعاجم الحديثة وهي المصطلح الأمثل. أما «وَطَنِيَّة» فقد استُعملت هنا
      توسعاً خاطئاً؛ إذ إن كل المعاجم والمصطلحيات الموثَّقة تُجمع على أنها تعني
      «الوطنية/patriotism» لا «صفة المولد». ينبغي حذفها واستبدالها أو إفراد المجموعة
      بلمّة «أَصْلِيَّة» وحدها مع ملاحظة الفجوة المعجمية.

  blind_candidates:
    - lemma: "مَوْلِدِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «مَوْلِد» (مكان الولادة / الميلاد)، على نمط الكلمات الدالة على
        الخاصية المجردة (-يَّة). يلتقط مباشرة المحور الدلالي «بحكم المولد» الوارد في
        التعريف، ويتطابق مع الإنجليزية nativeness = ness+native ← الجذر يُولَد منه.
    - lemma: "عَرَاقَة"
      generation_method: majaz
      justification: >
        لفظ عربي أصيل من جذر (ع-ر-ق)؛ العِرق هو سِنخ الشجرة وأصلها الضارب في الأرض.
        أجاز مجمع اللغة العربية بالقاهرة «عَرَاقَة النَّسَب» بمعنى أصالة الأصل وعُمق
        الجذور، وهو إزاحة دلالية من الجذر الشجري إلى الانتماء البشري والجغرافي.
    - lemma: "تَجَذُّر"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفَعُّل من «جَذَر» (الأصل والسِّنخ)؛ دلالته الرسوخ والانغراس في
        بيئة بعينها. المورد الحديث يقابله بـ rootage. يُعبِّر عن الطابع الجذري
        للانتماء المكاني بالمولد.
    - lemma: "نَسَبِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «نَسَب» (الاتصال والانتساب)؛ ابن فارس: «النسب سُمِّي لاتصاله».
        يمكن أن يعني «صفة الانتساب إلى أصل أو مكان»، وهو قريب من المفهوم المطلوب
        (nativeness = being native = having an origin in a place).


stage2_evidence:

  per_lemma:

    - lemma: "أَصْلِيَّة"
      confirm:
        - text: "«(مصدر صناعى): كونُ الشيءِ أصلاً بمعنى التأصل، في قول ابن جني: إن الألف إذا كانت بدلاً من أصيل جرت في الأصلية مجراه»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«الأصل: أصل الشيء. قال الكسائي في قولهم: لا أصل له ولا فصل له: إن الأصل الحسب، والفصل اللسان. ويقال: مجدٌ أصيل»"
          source: "مقاييس اللغة — ابن فارس (dictionary_id=151)"
      expands:
        - text: "«(7) أَصليّ: salt in its native state»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "تأكيد أن «أصلي» يُستخدم مقابلاً لـ native في السياق العلمي والوصفي."
        - text: "«تُربة أصلية» ← soil, native"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM"
          addition: "استخدام تقني لـ «أصلي» بمعنى native (غير مُجلَب)؛ يُثري فهم الجذر الدلالي للمصدر الصناعي أصلية."

    - lemma: "وَطَنِيَّة"
      contradicts:
        - text: "«وطنية = patriotism»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "المعجم يُرادف وطنية صراحةً بـ patriotism، وهو مختلف اختلافاً جوهرياً عن nativeness."
        - text: "«وطنية = patriotism»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "تأكيد من مصدر ثانٍ أن الكلمة تعني الوطنية (إخلاص للوطن)، لا صفة الانتماء بحكم المولد."
        - text: "«الوطنية: نزعة تتملك الفرد تعمق إحساسه بالوطن وتدفعه إلى بذل الجهد في الذود عنه والعمل لرفعته وتقدمه»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
          conflict: "التعريف الموسوعي يُحصر الوطنية في الشعور العاطفي بالانتماء الوطني والدفاع عنه (≈ patriotism)، وليس في الصفة الوصفية لكون الكائن مولوداً في مكان."

    - lemma: "مَوْلِدِيَّة"
      contradicts:
        - text: "«مُولَّدية: من (و ل د) مؤنث مُولَّدي» / «مُولِّدية: من (و ل د) مؤنث مولِّدي»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
          conflict: "الكلمة مسجّلة في قاعدة البيانات اسمَ عَلَم (اسم أنثى منسوب)، لا مصدراً صناعياً دالاً على خاصية مجردة."

    - lemma: "عَرَاقَة"
      confirm:
        - text: "«(العَرَّاقة): الأصالة (محدثة)»"
          source: "المعجم الوسيط — مجمع اللغة العربية (ocr)"
        - text: "«(العراقة): الأصالة (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«عُرِفَ بعَرَاقَة نَسَبِه [صحيحة]: أقرّ مجمع اللغة المصري ما جاء على «فَعَالة» دالاًّ على الثبوت والاستمرار من كل فعل ثلاثيّ بتحويله إلى باب «فَعُلَ» مضموم العين»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (hawramani)"
      expands:
        - text: "«العريق من الخيل والناس: الذي له عِرق في الكرم. فلان معرق له في الكرم. تدارَكَه أعراقُ خيرٍ وأعراقُ شرٍّ»"
          source: "مقاييس اللغة — ابن فارس (dictionary_id=151)"
          addition: "أصل الكلمة يدل على العِرق (السنخ/الجذر)؛ الانتماء النَّسَبي العميق لا الانتماء الجغرافي البسيط. تُقيَّد باللينج/النسب لا بالمكان."

    - lemma: "تَجَذُّر"
      expands:
        - text: "«تجذُّر؛ تأصُّل؛ ترسُّخ = rootage»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "الكلمة مستخدمة في المعجمية الحديثة بمعنى rootage أي «فعل التجذر»، وهو مصدر على تفعّل يدل على الصيرورة لا على الصفة المستقرة."

    - lemma: "نَسَبِيَّة"
      contradicts:
        - text: "«مبدأ النسبية: القول بتكافؤ صيغ القوانين الفيزيقية كيفما اختلفت حركات الراصدين لها»"
          source: "المعجم الوسيط — مجمع اللغة العربية (ocr)"
          conflict: "النسبية مُوحَّدة في اللغة العربية الحديثة للدلالة على نظرية أينشتاين (relativity)، وهو معنى يتعارض كلياً مع nativeness."
        - text: "«نسبية = relativity»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000) — ARABTERM"
          conflict: "استخدام اصطلاحي راسخ لنسبية = relativity في الفيزياء والعلوم."
        - text: "«نسبية = relativism»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — ARABTERM"
          conflict: "حتى في العلوم الإنسانية، النسبية = relativism لا nativeness."


stage3_analysis:

  per_lemma:

    - lemma: "أَصْلِيَّة"
      decision: confirmed
      decision_reason: >
        المعجم الكبير يُعرِّف «الأصلية» صراحةً بـ«كون الشيء أصلاً بمعنى التأصل»،
        وهو يتطابق مع مفهوم nativeness (الانتماء بحكم الأصل). الجذر (أصل) مُثبَت
        من مصادر OCR بأعلى موثوقية. الوزن الصرفي (مصدر صناعي -يَّة من الوصف أصلي)
        مناسب للدلالة على الخاصية المجردة. لا تعارض في الأدلة. التشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة. تُركِّز على بُعد الانتساب إلى الأصل
        والجذر (من أصل = أساس الشيء وحسبه)، وتحمل طابعاً جوهرياً: الشيء أصلي
        بمعنى أنه في موضعه الأول غير المُكتسَب. يختلف عن أصالة (التي تؤكد
        الموثوقية والعمق) وعن عراقة (التي تؤكد النسب الرفيع) وعن وطنية
        (التي انزاحت إلى الوطنية/patriotism).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَصْلِيَّة"

    - lemma: "وَطَنِيَّة"
      decision: removed
      decision_reason: >
        جميع المصادر المعجمية والاصطلاحية الموثَّقة (مسرد علم الاجتماع، مسرد الفلسفة،
        موسوعة السلطان قابوس) تُجمع على أن «وطنية» تعني patriotism (الإخلاص للوطن
        والدفاع عنه)، وهو معنى يختلف اختلافاً جوهرياً عن nativeness (صفة المولد
        والارتباط المكاني بالأصل). الكلمة شاهدها اللغوي «الوطن = محل الإنسان»
        (مقاييس اللغة) يُتيح بذرة المعنى المطلوب، لكن المصدر الصناعي «وطنية» استُعمل
        استعمالاً راسخاً لمعنى الوطنية/patriotism ولا يُعبّر عن صفة الانتماء
        المكاني بحكم المولد كصفة وصفية بحتة. تبقية الكلمة ستُلبّس بين المفهومين.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مَوْلِدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «مولدية» في قاعدة البيانات مُسجَّلة اسمَ عَلَم مؤنثاً (مؤنث مولَّدي/مولِّدي)
        في موسوعة أسماء العرب، وليست مصدراً صناعياً دالاً على خاصية مجردة.
        لا وجود لها في المعاجم اللغوية بمعنى "صفة الانتماء بحكم المولد".
        فضلاً عن ذلك، الوزن غير مُثبَت في باب المصادر الصناعية للمفاهيم المجردة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "عَرَاقَة"
      source: stage1
      decision: removed
      decision_reason: >
        «عَرَاقَة» مُعرَّفة في المعجم الوسيط بـ«الأصالة (محدثة)» وأجازها المجمع، لكن
        أدلة المعاجم والمقاييس تُثبت أن دلالتها مُقيَّدة بعمق النسب الشريف
        والكرم الموروث («العريق: الذي له عِرق في الكرم»)، لا بالانتماء الجغرافي
        البسيط بحكم المولد. استخدامها في هذا السياق مجازٌ ثانٍ غير راسخ. تبقى
        «أصالة» هي المصطلح القياسي لـ authenticity/rootedness في المعاجم الحديثة،
        وعراقة مرادفها المحدث في سياق النسب الرفيع — كلاهما مختلف عن nativeness.
