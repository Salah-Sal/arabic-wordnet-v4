      mwe_check:
        is_mwe: false

    - lemma: "تَجَذُّر"
      source: stage1
      decision: removed
      decision_reason: >
        «تَجَذُّر» مصدر على وزن تَفَعُّل يدل على الصيرورة والفعل المتجدد (صار ذا جذر /
        ترسَّخ)، وليس على صفة مستقرة. المورد الحديث يقابله بـ rootage وهو مصدر
        فعلي. اختبار التناسب الصرفي: المطلوب مصدر صناعي يدل على الخاصية، لا مصدر
        تفعُّلي يدل على الحدث. فضلاً عن ذلك لم يُعثر له على ورود في المعاجم
        الكلاسيكية أو الحديثة كمصطلح مستقل بهذا المعنى.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "نَسَبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «نَسَبِيَّة» مُوحَّدة في المعجمية العربية الحديثة للدلالة على نظرية النسبية
        (Einstein's relativity) والنسبية الفلسفية (relativism)؛ وهو تعارض كلي مع
        المعنى المطلوب (nativeness). الادعاء الاشتقاقي الذي استند إليه التوليد
        (نسب = اتصال) صحيح في نفسه، لكن المصدر الصناعي نَسَبِيَّة قد تخصَّص
        في المعاجم تخصصاً راسخاً لمفهوم آخر تماماً — وهو مثال على الاقتراض المفهومي
