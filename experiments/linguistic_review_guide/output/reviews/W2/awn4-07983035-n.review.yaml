stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان تركيبان وصفيّان حرّان وليستا مصطلحين مسكوكين ثابتين"
      - "لا توجد لمّة مفردة تدلّ على مفهوم «الجماعة المهاجرة» تحديداً"
      - "المفهوم يجمع بين دلالة الجماعة ودلالة الهجرة، وهو مفهوم مركّب بطبيعته في العربية"
    observations: "المجموعة الترادفية تعبّر عن مفهوم «جماعة من الناس يهاجرون معاً في فترة زمنية معيّنة»، وهو مفهوم يُعبَّر عنه في العربية عادةً بتركيب وصفيّ أو إضافيّ لا بلفظة مفردة. اللمّتان الموجودتان تغطّيان المفهوم من زاويتين: الأولى تؤكّد على الجماعة (فوج) وتصفها بالهجرة، والثانية تؤكّد على فعل الهجرة وتصفه بالجماعية. المفهوم قريب من معنى «النزوح الجماعي» أو «الخروج» (exodus). والمعجمات العربية الكلاسيكية لا تفرد مدخلاً لهذا المفهوم المركّب."
  blind_candidates:
    - lemma: "نُزُوحٌ جَمَاعِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفيّ من «نزوح» (مصدر نزح بمعنى بَعُد عن أرضه) و«جماعيّ». مصطلح مستعمل في الإعلام والقانون الدولي للتعبير عن هجرة جماعية قسرية أو طوعية."
    - lemma: "رَكْبٌ مُهَاجِرٌ"
      generation_method: tarkib
      justification: "تركيب وصفيّ من «رَكْب» (جماعة الراكبين المسافرين) و«مهاجر». الرَّكْب في المعاجم: القوم الرُّكبان العشرة فما فوق، وفيه دلالة السفر الجماعي."
    - lemma: "رَكْبٌ"
      generation_method: majaz
      justification: "مجاز مُرسَل بعلاقة الإطلاق: الرَّكْب في الأصل جماعة الراكبين المسافرين، يمكن توسيعه ليشمل أيّ جماعة مسافرة مهاجرة. ورد في القرآن: {وَالرَّكْبُ أَسْفَلَ مِنكُمْ}."
    - lemma: "مَوْجَةُ هِجْرَةٍ"
      generation_method: tarkib
      justification: "تركيب إضافيّ من «موجة» (بمعنى الدفعة المتتابعة) و«هجرة». يُستعمل في الإعلام المعاصر للدلالة على حركة هجرة جماعية في فترة معيّنة."

