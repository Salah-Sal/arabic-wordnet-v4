stage2_evidence:
  per_lemma:
    - lemma: "الطَّابَع الأَمريكيّ"
      confirm:
        - text: "«(الطابع) مَا يطبع بِهِ أَو يخْتم والميسم والخلق الغالب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (الهوارماني، حديث)"
        - text: "«الطابَع الطبيعة»"
          source: "المعجم الوسيط — OCR"
        - text: "«الطَّابَعُ: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ»"
          source: "المعجم الكبير — OCR"
        - text: "«طَابِع: من (ط ب ع) الطبيعة والقائم بأعمال الطابعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (الهوارماني)"
      expands:
        - text: "«الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ مَثَلٌ عَلَى نِهَايَةٍ يَنْتَهِي إِلَيْهَا الشَّيْءُ حَتَّى يُخْتَمَ عِنْدَهَا، يُقَالُ: طَبَعْتُ عَلَى الشَّيْءِ طَابَعًا. ثُمَّ يُقَالُ عَلَى هَذَا: طَبْعُ الْإِنْسَانِ وَسَجِيَّتُهُ. وَمِنْ ذَلِكَ طَبَعَ اللَّهُ عَلَى قَلْبِ الْكَافِرِ، كَأَنَّهُ خَتَمَ عَلَيْهِ حَتَّى لَا يَصِلَ إِلَيْهِ هُدًى وَلَا نُورٌ»"
          source: "مقاييس اللغة — ابن فارس (entry_id: 987501)"
          addition: "يكشف تأصيل ابن فارس أن الطابع يُفيد الانتهاء عند حدٍّ وختمه، ومنه جاء معنى السجية والخلق الراسخ — مما يدعم استخدام «الطابع» للدلالة على الخصائص الثابتة المميِّزة لشيء ما."

    - lemma: "الأَمريكيَّة"
      confirm:
        - text: "«الأميركانيّة: «أ» لفظة أو صيغة مستخدَمة في الإنكليزية الأميركية بخاصّة. «ب» الولاء للولايات المتحدة الأميركية. «ج» سِمَةٌ أو عادةٌ مميِّزةٌ للولايات المتحدة الأميركية. «د» المبادئ الأساسية التي ترتكز عليها الثقافة الوطنية الأميركية»"
          source: "المورد الحديث (2008) — translation_en: Americanism (entry_id: 669967)"
      expands:
        - text: "«الأميركانيّة: «ج» سِمَةٌ أو عادةٌ مميِّزةٌ للولايات المتحدة الأميركية. «د» المبادئ الأساسية التي ترتكز عليها الثقافة الوطنية الأميركية»"
          source: "المورد الحديث (2008)"
          addition: "المورد يُثبِّت صيغة اشتقاقية موازية (الأميركانيَّة = أميركاني + ـيَّة)، مما يُسنِد تبنِّي «الأمريكيَّة» (أمريكيّ + ـيَّة) الأخصر والأقيس صرفياً لنفس الدلالة."

    - lemma: "الرُّوح الأَمريكيَّة"
      evidence_status: "no_material_found"

    - lemma: "الهُوِيَّة الأَمريكيَّة"
