# ── المرحلة ١: المراجعة والتوليد (التوليد الأعمى) ─────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «الطابع الأمريكي» مركب وصفي حر وليست وحدة معجمية مسكوكة ثابتة في المعاجم، مما يُضعف حجّيتها الاصطلاحية"
      - "التعريف الحالي «الجودة أو الخاصية لكون الشيء أمريكياً» ترجمة حرفية لا تتبع أسلوب المعجم الوسيط وكلمة «الجودة» تُوحي بالتقييم الإيجابي لا الوصف المجرد"
      - "اللمّة الموجودة تفتقر إلى التشكيل الكامل"
      - "المجموعة لا ترتبط بـ ILI (ili: null)، مما يُضعف التحقق التقابلي مع الشبكات الأخرى"
    observations: >
      المجموعة تُعبّر عن مفهوم مجرد هو «الأمريكيَّة» أي خاصية الانتساب إلى أمريكا ومقوِّماتها الثقافية.
      «الطابع» في العربية يعني السجية والخلق الغالب (وثّقه الوسيط والكبير وابن فارس)، وهو يُحقق جزءاً
      من المعنى المنشود لكنه يُضيِّق الدلالة نحو الجانب الظاهر والمُدرَك فحسب. المصدر الصناعي
      «الأَمريكيَّة» (أمريكيّ + ـيَّة) هو الصيغة المنهجية الأجدر بتمثيل المفهوم الكلي المجرد، وقد وردت
      الصيغة الموازية «الأميركانيَّة» في المورد الحديث (2008) بمعنى Americanism.

  blind_candidates:
    - lemma: "الأَمريكيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من النسبة (أمريكيّ + ـيَّة)، على غرار: الإنسانيَّة، والعربيَّة، والفرنسيَّة. يُعبّر مباشرةً عن «خاصية كون الشيء أمريكياً» في صيغة مكثَّفة واحدة قابلة للاشتقاق والتصريف."
    - lemma: "الطَّابَع الأَمريكيّ"
      generation_method: tarkib
      justification: "مركب وصفي (موصوف + صفة): الطَّابَع بمعنى السجية والخلق الغالب الذي جُبِل عليه الإنسان + الأمريكيّ صفة مخصِّصة. يُؤطِّر المفهوم من حيث الطباع الراسخة والهوية المميِّزة."
    - lemma: "الرُّوح الأَمريكيَّة"
      generation_method: tarkib
      justification: "مركب وصفي مجازي: الروح بمعنى الجوهر الباطن والسمة العميقة. يُعبّر عن المفهوم من زاوية القيم والمبادئ الكامنة."
    - lemma: "الهُوِيَّة الأَمريكيَّة"
      generation_method: tarkib
      justification: "مركب وصفي: الهوية بمعنى مجموع الخصائص المميزة التي يُعرَّف بها الشيء أو الشخص. يُعبّر عن المفهوم من حيث الانتساب والتعريف بالذات الجمعية."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفَّذة: ٤
#   Q1 — مطابقة دفعية (الطابع + طابع + امريكي + مرشحات مركبة)
#   Q2 — الجسر الإنجليزي (Americanness, Americanism, American character …)
#   Q3 — FTS بالكلمات المفتاحية (امريكية, امريكانية, جودة, خاصية)
