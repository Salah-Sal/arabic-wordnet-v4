# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "الطَّابَع الأَمريكيّ"
      decision: confirmed
      decision_reason: >
        «الطابع» بمعنى الخلق الغالب والسجية موثَّق في كبار المعاجم (الوسيط، الكبير، ابن فارس).
        وإن كان المركب لم يُسجَّل كوحدة معجمية ثابتة بصورة مركّبة في قاعدة البيانات، فإنه شائع
        الاستعمال في الكتابة العربية المعاصرة ويُقاوم التفكيك الكلي. يُبقى بوصفه اللمّة الوصفية
        التمثيلية الحالية مع تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركّز على الطابع بمعنى السجية والخلق الراسخ المُدرَك حسيَّاً وسلوكياً؛ له دلالة أكثر تجسيداً وظهوراً في المظهر والأسلوب والممارسة، ويُشير تحديداً إلى ما يُلاحظه المرء ويميِّز به الأمريكيَّ عن سواه."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطَّابَع الأَمريكيّ"

    - lemma: "الأَمريكيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصدر الصناعي (أمريكيّ + ـيَّة) أسلوب عربي مطَّرد قياسي لتوليد مفاهيم الخاصية المجردة،
        ويوازي صياغات راسخة كالإنسانيَّة والإسلاميَّة والعربيَّة. وقد أثبت المورد الحديث (2008)
        الصيغة الموازية «الأميركانيَّة» بترجمة Americanism تشمل المعنى المطلوب للسينسيت.
        تجتاز بوابة الجودة الستة: الاطَّراد (على وزن منتج)، يُسر التداول (مفردة)، الملاءمة (لا
        إيحاء سلبي)، إيثار الاشتقاق على التعريب، الاشتقاقية (قابلة للجمع والنسب).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصدر صناعي كلي مجرد يُعبِّر عن الخاصية الشاملة للانتساب إلى أمريكا بما تشمله من قيم وثقافة وهوية ومبادئ؛ أشمل وأكثر تجريداً من «الطَّابَع الأَمريكيّ» الذي يُركّز على المظهر المُدرَك."
      actions:
        - command: create_entry
          params:
            lemma: "الأَمريكيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "الرُّوح الأَمريكيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الروح» يُحيل إلى الجوهر الباطن والمبادئ العليا، وهو يُضيِّق الدلالة ويُحمِّلها ببُعد مجازي
        غير مقصود (تُوحي بالعمق الروحاني لا بالخاصية الوصفية المجردة). فضلاً عن ذلك، يفشل
        اختبار الثبات: يُمكن إبداله بـ«الطابع» أو «الجوهر» أو «الروح الغربية» دون فقدان البُعد
        الوصفي، مما يُثبِت أنه عبارة حرة لا وحدة مصطلحية.

    - lemma: "الهُوِيَّة الأَمريكيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الهوية الأمريكية» مفهوم أوسع وأكثر تعقيداً — يشمل الانتماء القومي والسياسي والتاريخي
        والثقافي — ولا يُرادف «خاصية كون الشيء أمريكياً» البسيطة التي يُعبّر عنها هذا السينسيت.
        ويفشل اختبار الثبات (قابل للاستبدال بـ«الشخصية الأمريكية»، «الطابع الأمريكي» إلخ).


