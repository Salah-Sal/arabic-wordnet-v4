stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة حرفية نوعاً ما لكلمة 'processes' باستخدام الجمع (العمليات)، والأفضل صياغته بالمفرد ليكون تعريفاً مصطلحياً دقيقاً."
      - "عدم وجود تشكيل للمة 'تنظيم ذاتي' في البيانات الأصلية."
    observations: "المصطلح الإنجليزي 'autoregulation' يعني في علم وظائف الأعضاء قدرة العضو أو الخلية على المحافظة على وظائفه وتوازنه الداخلي رغم التغيرات الخارجية. التعبير بـ'تنظيم ذاتي' دقيق وشائع ومثبت في المعاجم الطبية."
  blind_candidates:
    - lemma: "تَنْظِيمٌ ذَاتِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين التنظيم (الترتيب والضبط) والذاتية (الاستقلالية)، ليعبر عن قيام الخلية أو الكائن بضبط وظائفه بنفسه."
    - lemma: "اِنْتِظَامٌ ذَاتِيّ"
      generation_method: tarkib
      justification: "استخدام صيغة الافتعال (انتظام) يدل على المطاوعة والآلية التلقائية في تحقيق التوازن."
    - lemma: "ضَبْطٌ ذَاتِيّ"
      generation_method: tarkib
      justification: "الضبط يحمل معنى التحكم والسيطرة، وهو مرادف قوي للتنظيم في السياق الفسيولوجي."
    - lemma: "اِسْتِتْبَابٌ مَحَلِّيّ"
      generation_method: tarkib
      justification: "لأن التنظيم الذاتي غالباً ما يكون آلية لتحقيق الاستتباب (homeostasis) على مستوى الخلية أو العضو (محلياً)."

stage2_evidence:
  per_lemma:
    - lemma: "تنظيم ذاتي"
      confirm:
        - text: "«تَنْظيمٌ ذاتِيّ: autoregulation»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تنظيم ذاتيّ، انتظام ذاتيّ: autoregulation»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
    - lemma: "انتظام ذاتي"
      confirm:
        - text: "«تنظيم ذاتيّ، انتظام ذاتيّ: autoregulation»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
    - lemma: "ضبط ذاتي"
      confirm:
        - text: "«ضبط ذاتي: نظرية بموجبها تتفاعل العناصر المؤلفة لنظام ما، وتولد من الداخل التوازن اللازم، وتعمل بشكل تلقائي. (autoregulation)»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "«تَضَبَّطَ فلاناً: أَخذه على حَبْسٍ وقَهْرٍ»"
          source: "المعجم الوسيط"
          addition: "الجذر 'ضبط' يستخدم في القهر والسيطرة، ومجازاً في التحكم الذاتي."
    - lemma: "استتباب محلي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تنظيم ذاتي"
      decision: confirmed
      decision_reason: "مصطلح معتمد وشائع في المعاجم الطبية والعلمية (كالمعجم الطبي الموحد) للتعبير عن المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنْظِيمٌ ذَاتِيّ"
    
    - lemma: "اِنْتِظَامٌ ذَاتِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف موثق في معجم الطب البيطري، ويفيد معنى المطاوعة والعملية التلقائية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "اِنْتِظَامٌ ذَاتِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "ضَبْطٌ ذَاتِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم صحته اللغوية ووروده في سياقات أخرى (كالإعلام واللسانيات)، إلا أن مصطلح 'التنظيم الذاتي' هو الأثبت والأخص في علم وظائف الأعضاء (الفسيولوجيا)."
      evidence_assessment:
        case: confirm_only

    - lemma: "اِسْتِتْبَابٌ مَحَلِّيّ"
      source: stage1
      decision: removed
      decision_reason: "لم يثبت بالاستعمال كمصطلح معجمي مسكوك لـ autoregulation."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "(في علم وظائف الأعضاء) العمليات التي تحافظ على حالة فسيولوجية ثابتة بشكل عام في خلية أو كائن حي"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم الجمع (العمليات) وتركيبه ركيك بعض الشيء. الأفضل إفراده وجعله تعريفاً مصطلحياً مباشراً."
    authored:
      - type: terminological
        text: "عملية فيزيولوجية تحافظ من خلالها خلية أو كائن حي على حالة داخلية مستقرة وتوازن وظيفي بشكل مستقل وتلقائي."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية فيزيولوجية تحافظ من خلالها خلية أو كائن حي على حالة داخلية مستقرة وتوازن وظيفي بشكل مستقل وتلقائي."
  
  examples:
    per_lemma:
      - lemma: "تنظيم ذاتي"
        examples:
          - text: "يساهم التنظيم الذاتي لتدفق الدم في ضمان تروية الدماغ باستمرار رغم تقلبات ضغط الدم."
            type: usage
      - lemma: "انتظام ذاتي"
        examples:
          - text: "تتميز العضلة القلبية بقدرتها على الانتظام الذاتي لتقلصاتها تبعاً للتغيرات في حجم الدم المتدفق."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يساهم التنظيم الذاتي لتدفق الدم في ضمان تروية الدماغ باستمرار رغم تقلبات ضغط الدم."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتميز العضلة القلبية بقدرتها على الانتظام الذاتي لتقلصاتها تبعاً للتغيرات في حجم الدم المتدفق."

