stage1_review:
  assessment:
    concerns:
      - "اللفظ 'زنوج' هو جمع تكسير لـ 'زنجي'، بينما يفضل في تعريف الأعراق استخدام اسم الجنس الجمعي (مثل الزنج) أو المصطلحات الوصفية المركبة."
      - "التعريف الحالي 'عرق ذو بشرة داكنة' مقتضب جداً ويحتاج إلى تفصيل أنثروبولوجي وجغرافي لتمييزه."
    observations: "تتراوح المصطلحات بين الألفاظ التراثية التي كانت تشير إلى جغرافيا محددة (الزنج، السودان) والمصطلحات الحديثة الوصفية (الجنس الأسود، العرق الأسود)."
  blind_candidates:
    - lemma: "الزِّنْجُ"
      generation_method: majaz
      justification: "اسم جنس جمعي تراثي يشير إلى الشعوب ذات البشرة السوداء في أفريقيا."
    - lemma: "الجِنْسُ الأَسْوَدُ"
      generation_method: tarkib
      justification: "تعبير وصفي حديث يستخدم في الدراسات الأنثروبولوجية والاجتماعية."
    - lemma: "السُّودَانُ"
      generation_method: ishtiqaq
      justification: "جمع 'أسود' في العربية، واستخدم تاريخياً كاسم جنس لهذه الطائفة من البشر."
    - lemma: "السُّلَالَةُ السَّوْدَاءُ"
      generation_method: tarkib
      justification: "مصطلح علمي دقيق يربط اللون بالمفهوم الجيني (السلالة)."

stage2_evidence:
  per_lemma:
    - lemma: "العِرْقُ الأَسْوَدُ"
      confirm:
        - text: "«النزعة الاستعبادية للجنس الأبيض في إخضاع الجنس الأسود... الرقيق الأبيض مصطلح يطلق على الأشخاص من غير الجنس الأسود»"
        - source: "معجم اللغة العربية المعاصرة"
    - lemma: "زُنُوجٌ"
      confirm:
        - text: "«الزِّنْجُ، ويُكْسَرُ، والمَزْنَجَةُ والزُّنوجُ: جِيلٌ من السُّودانِ»"
        - source: "القاموس المحيط"
        - text: "«الزنج: جيل من السودان، وهم الزنوج»"
        - source: "الصحاح في اللغة"
    - lemma: "الزِّنْجُ"
      confirm:
        - text: "«جيل من السودان يتميز بالجلد الأسود، والشعر الجعد، والشفة الغليظة، والأنف الأفطس»"
        - source: "المعجم الوسيط"
        - text: "«طائفة من السودان تسكن تحت خط الاستواء وجنوبيه»"
        - source: "المصباح المنير"
    - lemma: "الجِنْسُ الأَسْوَدُ"
      confirm:
        - text: "«نوع من الجلاد تغلظ فيه الأنسجة القرنية الزهمية ويكثر بين أفراد الجنس الأسود»"
        - source: "معجم المصطلحات الطبية"
    - lemma: "السُّودَانُ"
      confirm:
        - text: "«جمع أسود، جيل من الناس سود البشرة. والنسبة إليه: سوداني»"
        - source: "المعجم الوسيط"
    - lemma: "السُّلَالَةُ السَّوْدَاءُ"
      evidence_status: "no_material_found"

