# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07296871-n (voice over / تعليق صوتي)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «صوت معلق غير مرئي» غامض صرفياً: «معلق» قد تعني اسم فاعل (مُعَلِّق = commentator) أو اسم مفعول (مُعَلَّق = suspended)، والمقصود هو صوت المُعَلِّق."
      - "التعريف الإنجليزي يحتوي على خطأ مطبعي: 'of television' والصواب 'or television'."
      - "المجموعة تحتوي على لمّة واحدة فقط (تعليق صوتي)، وهي مركّب وصفي مستقرّ لكن ينبغي التحقق من وجود بدائل مفردة."
    observations: "المفهوم ينتمي إلى مجال الإنتاج الإعلامي السمعي البصري، وهو شائع في الاستعمال العربي المعاصر. التعبير «تعليق صوتي» مركّب وصفي ثابت في لغة الإعلام والسينما العربية. التعريف الحالي يحتاج إلى إعادة صياغة لرفع الغموض وتحسين البنية المعجمية."
  blind_candidates:
    - lemma: "هَاتِفٌ"
      generation_method: majaz
      justification: "في العربية الكلاسيكية، الهاتِف هو الصوت الذي يُسمَع دون أن يُرى صاحبه — وهذا يطابق مفهوم الصوت غير المرئي في الأفلام. لكن الاستعمال المعاصر خصّصه بمعنى التليفون."
    - lemma: "تَعْلِيقٌ صَوْتِيٌّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «تعليق» (التعليق على الأحداث) و«صوتي» (متعلق بالصوت)، يدلّ على التعليق المسموع دون ظهور المتحدث، وهو المصطلح الشائع في الإعلام العربي."
    - lemma: "سَرْدٌ صَوْتِيٌّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «سرد» (رواية الأحداث متتابعةً) و«صوتي»، يُركّز على الجانب السردي الروائي للصوت المصاحب للمشاهد."
    - lemma: "تَعْقِيبٌ صَوْتِيٌّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «تعقيب» (الإتيان بشيء بعد آخر، التعليق اللاحق) و«صوتي»، يشير إلى التعليق الصوتي المتتابع على المشاهد."

stage2_evidence:
  per_lemma:
    - lemma: "تَعْلِيقٌ صَوْتِيٌّ"
      confirm:
        - text: "«تعليق على صور (سينما، تلفزة)» = voice-over (cine & TV)"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«تعليق» = comment; commentary — مجال: Information and Communication"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«تعليق مُتَّصِل — على شريط صُوَر» = running commentary"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          addition: "يوجد مصطلح فرعي للتعليق المتّصل على شريط الصور، مما يؤكد استقرار حقل «تعليق» في المجال الإعلامي."
        - text: "«تعليق تلفزي» = television commentary (match)"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          addition: "صيغة بديلة تربط التعليق بالوسيط التلفزيوني تحديداً."
        - text: "«تعقيب، تعليق — نمطُ خِطاب تأويلي دون غاية علمية» = commentary"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "التعقيب والتعليق يُستخدمان معاً في السياق اللساني بمعنى التعليق التأويلي."
    - lemma: "هَاتِفٌ"
      confirm:
        - text: "«الصّوت يُسمَع دون أن يُرى شخصُ الصائح»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«[التليفون], أو من يتكلّم به»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعاصر المهيمن لـ«هاتف» هو التليفون (مجمعي)، فاستعماله بمعنى voice-over سيُحدث لبساً شديداً."
      expands:
        - text: "«الْهَاءُ وَالتَّاءُ وَالْفَاءُ: كَلِمَةٌ وَاحِدَةٌ، هِيَ الْهَتْفُ: الصَّوْتُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «هتف» أصله الصوت، وهو أساس المعنى الكلاسيكي."
    - lemma: "سَرْدٌ صَوْتِيٌّ"
      expands:
        - text: "«سَرْدٌ — (فى الأدب) Narration: عملية البناء السردى, أو إحدى صيغ الخطاب التى تصف سير الأحداث»"
          source: "المعجم الكبير"
          addition: "السرد مصطلح أدبي لعملية البناء السردي ورواية الأحداث، وليس مصطلحاً إعلامياً متخصصاً في التعليق الصوتي."
        - text: "«سَرْد» = narration — مجال: Information and Communication"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          addition: "يُستخدم «سرد» بمعنى narration في مجال الإعلام، لكنه أعمّ من voice-over."
    - lemma: "تَعْقِيبٌ صَوْتِيٌّ"
      expands:
        - text: "«التعقيب: أن يؤتى بشيء بعد آخر يقال عقب الفرس في عدوه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "التعقيب يركّز على التتابع والتعاقب، لا على التعليق المصاحب."

stage3_analysis:
  per_lemma:
    - lemma: "تَعْلِيقٌ صَوْتِيٌّ"
      decision: confirmed
      decision_reason: "مصطلح مستقرّ في الإعلام العربي، مسجّل في مسارد المنظمة العربية (ALECSO) مقابل voice-over، ومؤيَّد بسلسلة من المداخل المعجمية في حقل الإعلام والتواصل. المركب الوصفي واضح البنية ومتداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْلِيقٌ صَوْتِيٌّ"
    - lemma: "هَاتِفٌ"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ المعنى الكلاسيكي لـ«هاتف» (الصوت يُسمع دون أن يُرى صاحبه) يطابق المفهوم تماماً، إلا أنّ المعنى المعاصر المهيمن (التليفون) يجعل استعماله بمعنى voice-over مُلبِساً ومرفوضاً من منظور يُسر التداول."
      evidence_assessment:
        case: mixed
    - lemma: "سَرْدٌ صَوْتِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "«السرد» مصطلح أدبي يدلّ على رواية الأحداث متتابعةً (narration)، وهو أعمّ من مفهوم voice-over الذي يخصّ التعليق الصوتي على المشاهد من خارج الشاشة. الفرق بين narration وvoice-over جوهري: السرد قد يكون مرئياً."
      evidence_assessment:
        case: no_material
    - lemma: "تَعْقِيبٌ صَوْتِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "«التعقيب» يفيد الإتيان بشيء بعد آخر (التتابع)، وليس مسجّلاً في المعاجم المتخصصة بمعنى voice-over. كما أنّ التعقيب يوحي بالردّ أو التعليق اللاحق، بينما voice-over تعليق مصاحب لا لاحق."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "صوت معلق غير مرئي في فيلم أو برنامج تلفزيوني"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعاني من غموض صرفي في «صوت معلق» (هل هو صوت المُعَلِّق أم صوت مُعَلَّق؟)، ولا يتضمّن جنساً قريباً واضحاً ولا فصلاً نوعياً دقيقاً. كما يفتقر إلى الإشارة الوظيفية (المصاحبة للمشاهد)."
    authored:
      - type: terminological
        text: "صَوْتُ مُعَلِّقٍ لا يَظْهَرُ عَلَى الشَّاشَةِ، يُصَاحِبُ مَشَاهِدَ فِيلْمٍ سِينِمَائِيٍّ أَوْ بَرْنَامَجٍ تِلْفِزِيُونِيٍّ لِشَرْحِهَا أَوِ التَّعْلِيقِ عَلَيْهَا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صَوْتُ مُعَلِّقٍ لا يَظْهَرُ عَلَى الشَّاشَةِ، يُصَاحِبُ مَشَاهِدَ فِيلْمٍ سِينِمَائِيٍّ أَوْ بَرْنَامَجٍ تِلْفِزِيُونِيٍّ لِشَرْحِهَا أَوِ التَّعْلِيقِ عَلَيْهَا"
  examples:
    per_lemma:
      - lemma: "تَعْلِيقٌ صَوْتِيٌّ"
        examples:
          - text: "اعتمد المخرج على التعليق الصوتي لسرد خلفيات الشخصيات بدلاً من الحوار المباشر بين الممثلين."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "اعتمد المخرج على التعليق الصوتي لسرد خلفيات الشخصيات بدلاً من الحوار المباشر بين الممثلين."

