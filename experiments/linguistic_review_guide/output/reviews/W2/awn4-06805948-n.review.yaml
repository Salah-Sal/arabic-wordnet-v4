# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06805948-n (time signal)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي لمّة واحدة فقط (إشارة الوقت)، وهو تمثيل ضعيف لمفهوم تقني له عدة صياغات عربية مُوثّقة"
      - "اللمّة الموجودة بدون تشكيل كامل"
    observations: "المفهوم يدلّ على إشارة إلكترونية أو لاسلكية تُبَثّ لضبط الوقت بدقة، كالإشارات التي تبثّها المحطات الإذاعية عند رأس كل ساعة. المفهوم تقني حديث وله مقابلات عربية مُوثّقة في المعاجم المصطلحية. الجنس القريب هو «إشارة» (الواقع في المجموعة الأعلى)، والفصل النوعي هو دلالتها على الوقت الصحيح بدقة."
  blind_candidates:
    - lemma: "إِشَارَةُ التَّوْقِيتِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «إشارة» و«توقيت» (مصدر وقّت)، يدلّ على الإشارة المُخصَّصة لضبط التوقيت، وهو أدقّ من «إشارة الوقت» لأنّ التوقيت يتضمّن معنى الضبط والتحديد"
    - lemma: "إِشَارَةٌ زَمَنِيَّةٌ"
      generation_method: tarkib
      justification: "تركيب وصفي من «إشارة» و«زمنية» (نسبة إلى الزمن)، يدلّ على إشارة مرتبطة بالزمن وتحديده"
    - lemma: "نَبْضَةُ التَّوْقِيتِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «نبضة» (من نبض القلب، مجازاً للإشارة القصيرة المتكرّرة) و«التوقيت»، يصف الإشارة المتقطّعة التي تُصدَر لضبط الوقت"
    - lemma: "مِيقَاتِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «ميقات» (وزن مِفْعَال من وقت)، يدلّ على ما يتعلّق بتحديد الوقت المضبوط"

stage2_evidence:
  per_lemma:
    - lemma: "إِشَارَةُ الوَقْتِ"
      confirm:
        - text: "«إشارة الوقت؛ إشارة ضبط الوقت.»"
          source: "المورد الحديث (2008)"
        - text: "«ساعة (ال…) النّاطقة، إشارة العدّ العكسي» — translation_en: time signal"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "«الوَقْتُ: مِقدارٌ من الزَّمان قُدِّر لأمرٍ مَّا»"
          source: "المعجم الوسيط"
          addition: "تأكيد أنّ «الوقت» يدلّ على مقدار زمني محدّد، مما يُسوّغ استعماله في المركب"
        - text: "«الْإِشَارَة: تعْيين الشَّيْء بِالْيَدِ وَنَحْوهَا والتلويح بِشَيْء يفهم مِنْهُ المُرَاد»"
          source: "المعجم الوسيط"
          addition: "الأصل اللغوي للإشارة يتضمّن معنى الدلالة والتنبيه، وهو ما يناسب وظيفة إشارة الوقت"

    - lemma: "إِشَارَةُ التَّوْقِيتِ"
      confirm:
        - text: "«إشارة توقيت ، إشارة ضبط التوقيت» — translation_en: timing signal"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«التَّوْقيت: هو التقدير للشيء زماناً»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "التوقيت يتضمّن معنى التحديد الزمني الدقيق وليس مجرّد الوقت المطلق"

    - lemma: "إِشَارَةٌ زَمَنِيَّةٌ"
      confirm:
        - text: "«اشارة زمنية» — translation_en: timing signal"
          source: "موسوعة الكهرباء (IEC 60050)"
      contradicts:
        - text: "«اشارة زمنية» تُستخدم في سياق timing signal وليس time signal"
          source: "موسوعة الكهرباء (IEC 60050)"
          conflict: "الإشارة الزمنية في الاستعمال التقني تدلّ على إشارة التزامن (timing signal) وليس إشارة الوقت (time signal)؛ فالمفهومان مختلفان"

    - lemma: "نَبْضَةُ التَّوْقِيتِ"
      evidence_status: "no_material_found"

    - lemma: "مِيقَاتِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "إِشَارَةُ الوَقْتِ"
      decision: confirmed
      decision_reason: "اللمّة مُوثّقة في المورد الحديث (2008) بنصّ صريح كمقابل لـ time signal، ووردت أيضاً في مسرد الإعلام والتواصل. هي التعبير العربي المباشر والأكثر شيوعاً للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "التعبير العام الشائع لإشارة الوقت كما تُبَثّ إذاعياً أو إلكترونياً لإعلام الناس بالوقت الصحيح"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَةُ الوَقْتِ"

    - lemma: "إِشَارَةُ التَّوْقِيتِ"
      source: stage1
      decision: removed
      decision_reason: "رغم توثيقها في موسوعة الكهرباء (IEC 60050)، إلا أنّها تُستخدم بمعنى timing signal (إشارة تزامن) وليس time signal (إشارة دلالة على الوقت الصحيح). الفرق دلالي جوهري: timing signal إشارة تقنية لمزامنة الدوائر، أمّا time signal فإشارة تُعلِم بالوقت الصحيح."
      evidence_assessment:
        case: mixed

    - lemma: "إِشَارَةٌ زَمَنِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "مُوثّقة في IEC 60050 لكن بمعنى timing signal أيضاً وليس time signal. إضافتها تُوقع في لَبس اصطلاحي بين المفهومين."
      evidence_assessment:
        case: mixed

    - lemma: "نَبْضَةُ التَّوْقِيتِ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي، والتعبير غير مسكوك وليس وحدة معجمية ثابتة."
      evidence_assessment:
        case: no_material

    - lemma: "مِيقَاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعمالها بهذا المعنى. الاشتقاق ممكن صرفياً لكنه غير مُثبَت استعمالياً."
      evidence_assessment:
        case: no_material

