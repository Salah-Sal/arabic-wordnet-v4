stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
    observations: "المصطلح يعبر عن عملية (glycogenesis) في علم الأحياء، ويترجم عادة بـ «تكون الغليكوجين» أو «تكون الجليكوجين» حسب تعريب الشق الثاني من الكلمة."
  blind_candidates:
    - lemma: "تَكَوُّنُ الجْلِيكُوجِين"
      generation_method: tarkib
      justification: "تركيب إضافي يصف عملية التشكل أو التكون للمادة، ومستعمل بكثرة في المراجع الطبية."
    - lemma: "تَخَلُّقُ الغْلِيكُوجِين"
      generation_method: tarkib
      justification: "استخدام مصدر (تخلق) الذي يشيع في ترجمة اللاحقة البيولوجية (genesis)."
    - lemma: "تَكْوِينُ الجْلِيكُوجِين"
      generation_method: tarkib
      justification: "مصدر يدل على الفعل نفسه المتمثل في صناعة أو تكوين الغليكوجين."
    - lemma: "تَوَلُّدُ الجْلِيكُوجِين"
      generation_method: tarkib
      justification: "استخدام (تولد) كمرادف حيوي للتعبير عن الإنتاج والتشكل من المادة الأولية."

stage2_evidence:
  per_lemma:
    - lemma: "تكون الغليكوجين"
      confirm:
        - text: "تَكَوُّن الغُلُوكُوجِين [ترجمة لـ glycogenesis - مع ملاحظة الخطأ المطبعي الشائع بوضع الواو بدلا من الياء]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
    - lemma: "تَكَوُّنُ الجْلِيكُوجِين"
      confirm:
        - text: "تكون الجليكوجين: تكوين الجليكوجين أو السكر. [ترجمة لـ glycogenesis]"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
    - lemma: "تَخَلُّقُ الغْلِيكُوجِين"
      evidence_status: "no_material_found"
    - lemma: "تَكْوِينُ الجْلِيكُوجِين"
      expands:
        - text: "تكوين الجليكوجين أو السكر. [ورد في شرح تكون الجليكوجين]"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
    - lemma: "تَوَلُّدُ الجْلِيكُوجِين"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تكون الغليكوجين"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد ومستعمل لوصف العملية البيولوجية، مع إثباته في المعاجم المتخصصة بالتعريب (غليكوجين)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَوُّنُ الغْلِيكُوجِين"

    - lemma: "تَكَوُّنُ الجْلِيكُوجِين"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح رديف شائع يستخدم حرف (الجيم) بدلا من (الغين) في التعريب وهو مدعوم من المعاجم الطبية (تكون الجليكوجين)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "تَكَوُّنُ الجْلِيكُوجِين"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13509701-n"

    - lemma: "تَكْوِينُ الجْلِيكُوجِين"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مقبول ومستخدم يعبر عن بناء الغليكوجين وورد في شروح المعاجم الطبية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "تَكْوِينُ الجْلِيكُوجِين"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13509701-n"

    - lemma: "تَخَلُّقُ الغْلِيكُوجِين"
      source: stage1
      decision: removed
      decision_reason: "لم يثبت بالاستخدام المعجمي لهذا المفهوم حيث يفضل المعجميون (تكون) أو (تشكل)."

    - lemma: "تَوَلُّدُ الجْلِيكُوجِين"
      source: stage1
      decision: removed
      decision_reason: "غير موثق في المعاجم المختصة بهذا السياق بدقة مقارنة ببقية المرشحات."

