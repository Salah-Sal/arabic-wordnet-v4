step0_evidence:
  per_lemma:
    - lemma: "شاطئ أمامي"
      confirm:
        - text: "«مجال شاطئي بين أدنى مستويات البحر عند الجزر الأقصى وأعلى مستوياته عند المد الأقصى، أي المنطقة التي تغمرها مياه البحر مرتين في اليوم وتمثل وسطا بيئيا متميزا.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«الأرض التي تقع فوق متوسط منسوب المياه بين قاع المجرى المائي والحاجز أو الضفة المُرتفعة.»"
          source: "المعجم الموحد لمصطلحات المياه"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "صدر الشاطئ"
      source_section: "step5_english_bridge"
      evidence_citation: "«صَدْرُ الشّاطئ؛ مقدَّم الشاطئ.» — المورد الحديث"
      justification: "مصطلح معجمي دقيق يعبر عن الجزء المتقدم من الشاطئ (foreshore) بالاعتماد على التشبيه بصدر الشيء أي مقدمته."
    - lemma: "مقدم الشاطئ"
      source_section: "step5_english_bridge"
      evidence_citation: "«صَدْرُ الشّاطئ؛ مقدَّم الشاطئ.» — المورد الحديث"
      justification: "تركيب إضافي يعبر عن المعنى المكانّي المباشر لمقدمة الشاطئ."
  knowledge_candidates:
    - lemma: "نطاق المد والجزر"
      justification: "تركيب إضافي عطفي: مصطلح جغرافي وبيئي شائع يعبر بدقة عن المنطقة المحصورة بين مستويي المد العالي والجزر المنخفض (intertidal zone) والتي تتطابق مع تعريف المجموعة."

step1_lemma_validation:
  per_lemma:
    - lemma: "شاطئ أمامي"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد في المعاجم المتخصصة يعبر عن المنطقة المذكورة، وهو ترجمة استعارية (Calque) مقبولة ومستقرة."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير وصفي يكثر استعماله في السياقات الهندسية والجيومورفولوجية المباشرة كمقابل لـ foreshore."
      example: "يغمر ماء البحر الشاطئ الأمامي كلياً في فترات المد العالي."

    - lemma: "صدر الشاطئ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مسجل في المعاجم المعتمدة، يستعير عضو 'الصدر' للتعبير عن الواجهة، وهو بليغ وموجز."
      step05_citation: "«صَدْرُ الشّاطئ؛ مقدَّم الشاطئ.» — المورد الحديث"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح ذو صبغة أدبية ومعجمية مستقرة، يفضل في النصوص العامة والوصفية."
      example: "تتلاطم الأمواج عند صدر الشاطئ مخلفة أصدافاً بحرية متنوعة."
      actions:
        - command: create_entry
          params:
            lemma: "صدر الشاطئ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09306772-n"

    - lemma: "مقدم الشاطئ"
      source: step05
      decision: confirmed
      decision_reason: "بديل دقيق وواضح لـ 'صدر الشاطئ' وموثق في المعاجم، ومطابق لمعنى 'fore' في 'foreshore'."
      step05_citation: "«صَدْرُ الشّاطئ؛ مقدَّم الشاطئ.» — المورد الحديث"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "مباشر وخالٍ من الاستعارة المجازية الموجودة في 'صدر'، مما يجعله مناسباً للسياق العلمي والتقريري."
      example: "بنى الأطفال قلاعاً رملية عند مقدم الشاطئ قبل أن يجرفها الموج."
      actions:
        - command: create_entry
          params:
            lemma: "مقدم الشاطئ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09306772-n"

    - lemma: "نطاق المد والجزر"
      source: step05
      decision: removed
      decision_reason: "رغم تقاطعه الكبير مع المعنى، إلا أنه عادة ما يُخصص للمصطلح (intertidal zone) وليس (foreshore) بالدقة المعجمية التي تركز على الجزء المكاني من الشاطئ وليس النطاق البيئي فقط."
      step05_citation: "الاستعمال التخصصي"

  added_lemmas:
