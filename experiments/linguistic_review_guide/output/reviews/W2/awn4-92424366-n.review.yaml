# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. توليد اللمّات المرشحة — من التعريف المُقنَّع فقط
  # التعريف: "جودة أو حالة كون الشيء تركياً"
  # المفهوم: الخاصيّة المجرّدة للانتماء إلى الأتراك أو تركيا (Turkishness)
  blind_candidates:
    - lemma: "التُّرْكِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي على وزن (-يَّة) من النسبة "تُرْكِيّ"، وهو القياس العربي المطّرد
        لاشتقاق الخاصيّة المجرّدة من الصفة النسبية: كالعُرُوبة من عربيّ،
        والأمريكيَّة من أمريكيّ. يُعبِّر مباشرةً عن "جودة كون الشيء تركيًا".

    - lemma: "التَّتَرُّك"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل الخماسي "تَتَرَّكَ" (صيغة التفعُّل الدالّة على التحوُّل
        والاتّصاف)، يعبّر عن حالة الاتّصاف بالتُّرْكِيَّة أو التحوُّل إليها.
        يُفيد الجانب الديناميكي للمفهوم.

    - lemma: "الطَّابَعُ التُّرْكِيّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من "الطَّابَع" (الخُلُق الغالب / السجيَّة) و"التُّرْكِيّ" (نسبة)،
        يُعبِّر عن السمة المميِّزة لما هو تركيّ. الطابع في المعجم الوسيط:
        "الخُلُق الغالب". يُشير إلى المجموع الحضاري للخصائص التركية.

    - lemma: "التَّتْرِيك"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل الرباعي "تَتْرَكَ / تَتْرِيك" (على وزن تَفْعِيل)، بمعنى إضفاء
        الطابع التركي على الشيء. اشتُهر في السياق التاريخي العثماني للدلالة على
        عملية نشر الخصائص التركية.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - >-
        اللمّة الوحيدة "الطابع التركي" تعبير وصفي مركّب (نعتي حرّ)، وليس مصطلحاً
        مسكوكاً للخاصيّة المجرّدة "التُّرْكِيَّة". يمكن إبدال "التركي" بأيّ نسبة
        أخرى ("الطابع المصري"، "الطابع الفرنسي") دون أن يفقد صلاحيَّته
        كوصف، مما يعني أنّه ليس وحدة معجمية ثابتة.
      - >-
        التعريف الحالي "جودة أو حالة كون الشيء تركياً" ترجمة حرفية من الإنجليزية
        ("the quality or state of being Turkish")، ولا يتّبع أسلوب المعجم الوسيط
        في صياغة التعريفات المصطلحية.
      - "قيمة ili فارغة (null) — المجموعة غير مرتبطة بالشبكة الدلالية الدولية."
    observations: >-
      المجموعة تُعبِّر عن مفهوم التُّرْكِيَّة بوصفها خاصيَّة جوهريَّة، وهو مفهوم
      مجرَّد يُعبَّر عنه في العربية القياسية بالمصدر الصناعي "التُّرْكِيَّة"
      (كالعُرُوبة والأمريكيَّة والأُوروبيَّة). الأفضل حذف التعبير الوصفي الحرّ
      وإدراج اللمّة المصطلحية القياسية. يجدر التنبُّه إلى التعدُّد الدلاليّ لـ"التُّرْكِيَّة"
      (تعني أيضاً اللغة التركية)، مما يستوجب توثيق الفرق في حقل nuance.
      مصطلح "الأتراكيَّات" (Turkism) الوارد في المعجم المورد يُغطّي البُعد
      الأيديولوجي للقوميَّة التركية، وهو دلالة مغايرة لهذا السينسيت.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ملاحظة: لا يوجد evidence.json مُسبَق الجلب — نُفِّذت الاستعلامات مباشرةً.
  # الاستعلامات المنفَّذة:
  #   ١. مطابقة دفعية (الطابع / طابع / التركي / تركي / التُّرْكِيَّة / التتريك / التترك)
  #   ٢. جسر إنجليزي (Turkish / Turkishness / Turkism)
  #   ٣. FTS عربي (تركي / التركية / الطابع التركي)
  #   ٤. مقاييس اللغة لابن فارس (طبع / ترك)

  per_lemma:

    - lemma: "الطابع التركي"
      expands:
        - text: >-
            «الطَّابَع: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ.»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >-
            يؤكّد أن "الطابع" يعني الخُلق الغالب والسجيّة الأصيلة، مما يدعم
            استخدامه دلاليًّا لوصف الخصائص الجوهرية، لكنّ المركّب "الطابع التركي"
            وصفٌ حرٌّ لا وحدة مسكوكة.
        - text: >-
            «الطَّابِع: العَلَامَةُ الْمُمَيِّزَةُ.»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >-
            المعنى "العلامة المميِّزة" يقترب من مفهوم الخاصيّة الجوهرية،
            مما يجعل التعبير مفهوماً وإن لم يكن مسكوكاً.
        - text: >-
            «الطَّابَع: الطبيعة. يُقَال: لَهُ طَابَع حَسَنٌ.»
          source: "المعجم الوسيط"
          addition: >-
            تأكيد على أن "الطابع" بمعنى الطبيعة/الجِبِلَّة مستعمَل في العربية
            المعاصرة، إلا أن التعبير المركّب "الطابع التركي" لا يرد كوحدة مسكوكة.

    - lemma: "التُّرْكِيَّة"
      confirm:
        - text: >-
            «تُرْكِيَّة: مؤنَّث تُرْكِيّ.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >-
            «تُرْكِيّ: نسبة إلى تُرْكيا، أو إلى الترك.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: >-
            «(١) تُركيّ (٢) Turkic (٣) اللغة التركية.»
            [للمدخل: تُرْكِيّ / Turkish]
          source: "المورد الحديث (٢٠٠٨)"
          addition: >-
            يكشف عن التعدُّد الدلاليّ: "تُرْكِيّ" تعني الانتماءَ لتركيا والوصفَ
            لعائلة اللغات التُّوركيَّة. المصدر الصناعي "التُّرْكِيَّة" يرث هذا التعدُّد،
            فهو يعني "التُّرْكِيَّة كخاصيَّة" و"اللغة التُّركيَّة" معاً.
        - text: >-
            «الأتراكيَّات: عادات الأتراك ومعتقداتُهم ومؤسساتُهم ومبادئهم.»
            [translation_en: Turkism]
          source: "المورد الحديث (٢٠٠٨)"
          addition: >-
            صِيغة "الأتراكيَّات" مُخصَّصة للبُعد الأيديولوجي والثقافي الجماعي
            (Turkism)، وهي مغايرة للخاصيَّة الجوهريَّة المجرَّدة التي يعبِّر عنها
            هذا السينسيت (Turkishness).

    - lemma: "التَّتَرُّك"
      evidence_status: "no_material_found"

    - lemma: "الطَّابَعُ التُّرْكِيّ"
      expands:
        - text: >-
            «الطَّابَع: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ.»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "نفس أدلة مدخل 'الطابع التركي' — التعبير المركّب غير مسكوك."

    - lemma: "التَّتْرِيك"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "الطابع التركي"
      decision: removed
      decision_reason: >-
        فشل في اختبار التثبيت المعجمي: يمكن إبدال "التركي" بأيّ نسبة أخرى
        ("الطابع المصري"، "الطابع الفارسي") دون أن يفقد التعبيرُ صلاحيَّتَه
        كوصف، ممّا يُثبت أنّه ليس وحدةً معجميَّةً مسكوكةً للخاصيَّة المجرَّدة.
        التعابير الوصفية الحرَّة لا تُقبَل لمّاتٍ في الشبكة الدلالية إلا إذا
        كانت وحداتٍ اصطلاحيَّةً ثابتةً. لا يوجد دليل معجمي يُثبِّت هذا
        التعبير كمصطلحٍ للخاصيَّة الجوهريَّة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "التُّرْكِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        المصدر الصناعي (-يَّة) هو القياس العربي المطّرد لاشتقاق الخاصيَّة المجرَّدة
        من الصفة النسبية: "عَرَبِيّ → العَرَبِيَّة"، "أمريكيّ → الأمريكيَّة"،
        "تُرْكِيّ → التُّرْكِيَّة". يُعبِّر مباشرةً وبإيجاز عن "جودة كون الشيء
        تُرْكِيًّا". الاطّراد الصرفي تامٌّ، والتداول فصيحٌ في الكتابة الأكاديمية
        والإعلامية العربية. التعدُّد الدلاليّ مع "اللغة التركية" مقبول ومُوثَّق
        في معاجم (المورد الحديث)، ولا يُسقط اللمَّة من المجموعة بل يُستدرك
        في حقل nuance.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        "التُّرْكِيَّة" في هذا السياق تُغطّي الخاصيَّة المجرَّدة لكون الشيء ذا
        أصلٍ تُرْكِيٍّ أو انتماءٍ إلى الأتراك وحضارتهم، بخلاف "الأتراكيَّات"
        التي تُغطّي البُعد الأيديولوجي الجماعيَّ (Turkism = القوميَّة التُّركيَّة
        كحركةٍ سياسيَّة)، وبخلاف "اللغة التُّركيَّة" التي تعني اللسانَ لا الخاصيَّة.
      actions:
        - command: create_entry
          params:
            lemma: "التُّرْكِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-92424366-n"

    - lemma: "التَّتَرُّك"
      source: stage1
      decision: removed
      decision_reason: >-
        مصدر الفعل "تَتَرَّكَ" يدلُّ على التحوُّل إلى التُّرْكِيَّة أو التكلُّف
        بها، أي الجانب الدينامي لعملية الاتّصاف — وهو مفهوم مغاير لمفهوم
        الخاصيَّة الجوهريَّة الثابتة. فضلاً عن انعدام الشواهد المعجميَّة.

    - lemma: "الطَّابَعُ التُّرْكِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        يُوافق اللمَّة الموجودة "الطابع التركي" ويشاركها العلّة ذاتها:
        تعبير وصفي حرٌّ يفشل في اختبار التثبيت المعجمي.

    - lemma: "التَّتْرِيك"
      source: stage1
      decision: removed
      decision_reason: >-
        يدلُّ على عملية إضفاء الطابع التُّرْكِيّ على الغير (Turkification)،
        أي مصدر فعلٍ متعدٍّ، وهو دلالة مغايرة لمفهوم الخاصيَّة المجرَّدة
        (Turkishness). انعدام الشواهد المعجميَّة يُعزّز الرفض.


