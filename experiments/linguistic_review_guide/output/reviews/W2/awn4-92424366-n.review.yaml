# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
# تعالج فقط اللمّات المؤكَّدة: "التُّرْكِيَّة"
stage5_enrichment:

  per_entry:
    - lemma: "التُّرْكِيَّة"
      entry_id: "{auto}"
      # ملاحظة: "التُّرك" اسمٌ عَلَمٌ لشعب غير عربي الأصل؛ الجذر العربي "ت-ر-ك"
      # في مقاييس اللغة يعني "التَّرْك = التخلية" وهو أصلٌ مغاير لا يرتبط
      # بالنسبة الحضارية "تُرْكِيّ". لذلك لا يُقتبَس من مقاييس اللغة هنا.
      root: "ترك (علَم)"
      maqayis_quote: >-
        «التَّاءُ وَالرَّاءُ وَالْكَافُ: التَّرْكُ التَّخْلِيَةُ عَنِ الشَّيْءِ،
        وَهُوَ قِيَاسُ الْبَابِ، وَلِذَلِكَ تُسَمَّى الْبَيْضَةُ بِالْعَرَاءِ
        تَرِيكَةً.» [تنبيه: هذا الجذر يعني "التَّرك = المفارقة" وليس الانتساب
        لشعب الأتراك؛ "التُّرك" عَلَمٌ أعجمي الأصل، والنسبة إليه لغويٌّ لا
        اشتقاقي بالمعنى التراثي.]

  per_sense:
    - lemma: "التُّرْكِيَّة"
      sense_id: "{auto}"
      nuance: >-
        "التُّرْكِيَّة" بهذا السينسيت تعني الخاصيَّة المجرَّدة لكون الشيء ذا طابعٍ
        تُرْكِيّ أو منتسباً إلى الأتراك أو حضارتهم (Turkishness). تختلف عن
        "اللغة التُّرْكِيَّة" (تغطّيها مجموعةٌ أخرى) وعن "الأتراكيَّات" التي
        تُغطّي القوميَّة التُّرْكِيَّة كحركةٍ أيديولوجية (Turkism). الاستعمال
        الأسلم في النصوص الأكاديميَّة هو "التُّرْكِيَّةُ الثقافيَّة" أو "التُّرْكِيَّة
        الحضاريَّة" تفريقاً من اللغة.
      mwe: false

