stage3_analysis:

  per_lemma:

    - lemma: "اسْتِقْرَار"
      decision: removed
      decision_reason: >
        دلالة «اسْتِقْرَار» الأصيلة هي الوصول إلى حالة الثبات بعد حركة أو اضطراب (stability، استتباب)، لا الصفة الجوهرية الذاتية لشيء لا يقبل التغيير بطبيعته (unchangeability). الشواهد المعجمية تُجمع على ربطه بـ stability في سياقات هندسية وعلمية متعددة. إبقاؤه في هذه المجموعة يُحدث لبساً دلالياً مع مجموعات أخرى في AWN تتضمن stability/equilibrium. الفرق الجوهري: اسْتِقْرَار وصفي (يصف عملية الاستقرار)، بينما المطلوب وصفي-جوهري (unchangeability كصفة ثابتة).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ثَبَات"
      decision: confirmed
      decision_reason: >
        «ثَبَات» موثق توثيقاً كاملاً كمقابل لـ unchangeability/constancy/stability في المعاجم العلمية والفقهية والفلسفية. التعريفات المعجمية «البقاء دون تغيير» و«ضد الزوال» و«عدم احتمال الزوال بتشكيك المشكّك» تتطابق مع روح المجموعة. الجذر (ث ب ت) في مقاييس اللغة: «دوام الشيء» — وهو تعريف جوهري للمفهوم. يستوفي معايير جودة المصطلح الستة: اطّراد، يُسر تداول، ملاءمة، أصيل عربي، مشتق قياسي، شائع فصيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الجانب الوصفي لعدم الزوال بوجه عام، وله استخدام واسع في السياقات العلمية (ثبات المستحضر، ثبات المادة). يُعبّر عن الصفة من زاوية «البقاء الإيجابي».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثَبَاتٌ"

    - lemma: "عَدَم تَغَيُّر"
      decision: removed
      decision_reason: >
        تفشل اختباري التثبيت المعجمي والسكّ: يمكن إبدال «تغيّر» بـ«تبدّل» أو «تحوّل» ويظل الوصف مقبولاً، مما يُثبت أنها عبارة وصفية حرة لا مصطلح مسكوك. شاهد «المورد الحديث» يُرجّح «اللامتغيِّرية» و«الثابتية» على «عدم التغير» كمقابل لـ invariability. لا ينبغي إدراج عبارات وصفية غير مسكوكة كلمّات في AWN.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "رُسُوخٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        «رُسُوخ» موثق في مقاييس اللغة بمعنى «الثبات» الجوهري («أصل واحد يدل على الثبات»)، وفي التوقيف بمعنى «التمكن والثبات حتى لا يتزعزع». يُضيف بُعداً دلالياً مميزاً عن «ثَبَات»: فهو يدل على الثبوت العميق المتجذّر في طبيعة الشيء، لا مجرد عدم التغيير الوصفي. مستعمل في القرآن الكريم «الراسخون في العلم» بهذا المعنى التجذري. يستوفي اختباري السكّ والتثبيت المعجمي: مفرد قياسي، مصدر ثلاثي موزون على فُعُول.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على عمق الثبوت وتجذّره؛ يُستخدم للإشارة إلى الصفة المتأصلة في الجوهر، بينما «ثَبَات» أشمل وأعم. يُناسب unchangeability من حيث الدلالة على أن التغيير يصطدم بطبيعة الشيء ذاتها.
      actions:
        - command: create_entry
          params:
            lemma: "رُسُوخٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "دَوَامٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «دَوَام» وإن دلّ على الاستمرار والبقاء، فإن دلالته تنصبّ على الاستمرار الزماني (continuity/permanence) أكثر من صفة عدم القابلية للتغيير (unchangeability). الفرق جوهري: unchangeability تصف طبيعة الشيء، بينما دوام يصف امتداده الزمني. «دَيْمُومَة» أدق منه في هذا الجانب. الاشتباه مع مجموعات الـ permanence وارد بقوة.
      evidence_assessment:
        case: mixed

    - lemma: "صُمُودٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «صُمُود» في استخدامه المعاصر المستقر يدل على Resilience (القدرة على التعافي بعد صدمة)، وهو مفهوم مختلف جوهرياً عن unchangeability. المعنى الأصيل في مقاييس اللغة «القصد والصلابة» لا يُحيل على صفة الشيء في ذاته. يُضاف إلى ذلك إشارة معجم الصواب إلى خلاف حول الصيغة المصدرية.
      evidence_assessment:
