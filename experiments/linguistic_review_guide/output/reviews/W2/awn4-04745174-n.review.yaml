stage2_evidence:

  per_lemma:

    - lemma: "اسْتِقْرَار"
      confirm:
        - text: "«حالة نظام لا يتم نقله منها أو تغييرها بسهولة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ArabTerm"
        - text: "«استقرار نظام توليد الطاقة أي توفر المولّدات على ميزة البقاء في حالة التزامن»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة — ArabTerm"
      contradicts:
        - text: "«مقاومة المنشأة ضد الانزلاق أو الانقلاب أو الانهيار»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية — ArabTerm"
          conflict: "هذا المعنى يدل على stability الهيكلية (مقاومة قوى خارجية) لا على unchangeability (صفة عدم القابلية للتغيير ذاتياً)."
        - text: "«التحكم في مركبة، جوية أو فضائية، أو أي جزء منها لإبقائها موجَّهة بشكل صحيح عند تأرجحها»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد — ArabTerm"
          conflict: "هذا استخدام تقني لمعنى مختلف كلياً (stabilization = تثبيت الاتجاه)، ويناقض الانتماء للمجموعة."
        - text: "«الاستِقْرارُ: ما يُعمَل لما استقرَّ عليه أمرُ الطمع بعد الإثبات والفك والوضع»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "معنى اصطلاحي خاص بعلم الحساب والأرقام، لا علاقة له بالمجموعة."
      expands:
        - text: "stability / persistency"
          source: "المعجم الموحد لمصطلحات المياه — ArabTerm"
          addition: "اقتران 'stability' بـ 'persistency' يقرّب المعنى من unchangeability لكن لا يطابقه."

    - lemma: "ثَبَات"
      confirm:
        - text: "«عندما يطبق على مادة كيميائية فإنه يعني القدرة على البقاء دون تغيير رغم تأثيرات البيئة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ArabTerm"
        - text: "«خاصية بقاء المستحضر أو الشكل الصيدلاني على حالة واحدة.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة — ArabTerm"
        - text: "«الثبات: ضد الزوال.»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«الثبات: ضد الزوال، والثبات والثبوت ضد التزلزل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الثّبات: هو عدم احتمال الزّوال بتشكيك المشكّك»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«الثّبوت: بالفتح عند الأشاعرة مرادف الكون والوجود. وعند المعتزلة…»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُبيّن الفرق بين ثَبات (عدم الزوال الحسي) وثُبوت (الوجود الذهني عند المتكلمين)، وهو تمييز مهم."
        - text: "«(1) «أ» ثبات؛ جَلَدٌ. «ب» إخلاص؛ وفاء؛ ولاء. (2) استقرار؛ اطّراد؛ انتظام.» [constancy]"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن ثَبات يُستخدم في الترجمة الحديثة كمقابل لـ constancy بجانب stability."

    - lemma: "عَدَم تَغَيُّر"
      confirm:
        - text: "«عدم التغير» [invariability]"
          source: "المعجم الموحد لمصطلحات علم الأحياء — ArabTerm"
      contradicts:
        - text: "«الثابتيّة؛ اللامتغيِّرية.» [invariability]"
          source: "المورد الحديث (2008)"
          conflict: "المعجم الحديث يُرجّح «اللامتغيِّرية» و«الثابتية» على «عدم التغير» كمقابل لـ invariability، مما يدل على أن «عدم تغيّر» مجرد وصف لا مصطلح."

    - lemma: "رُسُوخٌ"
      confirm:
        - text: "«الرسوخ: الثبات والتمكن. والراسخ في العلم المتحقق الذي لا يعترضه شبهة.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(رَسَخَ) الراءُ والسينُ والخاءُ أصلٌ واحدٌ يدلُّ على الثَّبات. ويقال رسَخَ: ثَبَتَ، وكلُّ راسِخٍ ثابتٌ.»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الرسوخ في الشيء: التمكن والثبات فيه حتى لا يتزعزع.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يضيف بُعد «عدم التزعزع» الذي يتقاطع مباشرة مع unchangeability."

    - lemma: "دَوَامٌ"
      confirm:
        - text: "«دَوام؛ استمرار؛ بقاء.» [permanence]"
          source: "المورد الحديث (2008)"
        - text: "«(دَوَمَ) الدالُ والواوُ والميمُ أصلٌ واحدٌ يدلُّ على السُّكون واللزوم. يقال دامَ الشيءُ يدومُ إذا سَكَنَ.»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«ديمومة» [permanence / duration]"
          source: "مسرد الفلسفة وعلم النفس — ArabTerm / المَكنَز الزراعي"
          addition: "يُثبت أن الجذر (دوم) له اشتقاقات معجمية متعددة تشمل «دوام» و«ديمومة» في سياقات الفلسفة والبيئة."

    - lemma: "صُمُودٌ"
      contradicts:
        - text: "«صُمُود: من (ص م د) الثبات والاستمرار.» مع ملاحظة: «مرفوضة» عند معجم الصواب."
          source: "موسوعة السلطان قابوس لأسماء العرب / معجم الصواب اللغوي"
          conflict: "معجم الصواب اللغوي يُشير إلى خلاف حول صيغة «صُمُود»، كما أن المعنى الأصيل لـ(صمد) يرتكز على القصد والصلابة لا على صفة الشيء في ذاته. هذا يجعله أقل ملاءمة لـ unchangeability."
        - text: "«قدرة النظام على استعادة العمليات بسرعة بعد وقوع حادث.» [Resilience]"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          conflict: "الاستخدام التقني المعاصر لـ«صمود» مستقر على Resilience لا على unchangeability، مما يخلق اشتراكاً لفظياً مع هذه المجموعة."

    - lemma: "دَيْمُومَةٌ"
      confirm:
        - text: "«الدَّيْمُومَةُ: الدوامُ والثباتُ»"
          source: "المعجم الكبير"
        - text: "«ديمومة» [permanence]"
          source: "المَكنَز الزراعي متعدد اللغات — ArabTerm"
      contradicts:
        - text: "«الدَّيْمُومَةُ: الفلاةُ الواسعةُ لا ماءَ فيها»"
          source: "المعجم الكبير"
          conflict: "أحد معاني الديمومة في المعجم الكبير الأرض الواسعة الموحشة، وهو معنى مختلف كلياً يُظهر تعدد دلالي."
        - text: "«ديمومة» [duration] في مسرد الفلسفة"
          source: "مسرد الفلسفة وعلم النفس — ArabTerm"
          conflict: "استخدامها كمقابل لـ duration (المدة الزمنية) يُبعدها عن unchangeability التي هي صفة ذاتية لا مدة."


