stage4_content:

  definition:
    current: "صفة عدم القابلية للتغيير؛ وجود ميل ملحوظ للبقاء دون تغيير"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزي لا يتّبع أسلوب المعجم الوسيط. «صفة عدم القابلية للتغيير» تعريف سلبي يبدأ بنفي، والأفضل أن يُصاغ التعريف بجنس قريب وفصل نوعي إيجابي. كما أن «وجود ميل ملحوظ للبقاء» شرط إضافي ينبغي إعادة صياغته بأسلوب أكثر دقة.
    authored:
      - type: terminological
        text: >
          صِفَةٌ جوهريةٌ لشيءٍ أو مفهومٍ تُشير إلى عدم قابليته للتحوّل أو التبدّل بفعل العوامل الخارجية أو مرور الزمن؛ وهي ضدّ التغيّر.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
