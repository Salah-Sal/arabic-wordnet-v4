    - lemma: "دَيْمُومَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «دَيْمُومَة» رغم توثيقها بمعنى «الدوام والثبات»، إلا أن استخدامها المعاصر في المعاجم التخصصية منقسم بين permanence وduration، مما يجعلها أقل دقة لـ unchangeability. فضلاً عن أن أحد معانيها في المعجم الكبير الأرض الموحشة مما يُنشئ اشتراكاً لفظياً. «ثَبَات» و«رُسُوخ» أوثق توثيقاً للمعنى المقصود.
      evidence_assessment:
        case: mixed


