stage1_review:

  assessment:
    concerns:
      - "لمّة «عَدَم تَغَيُّر» عبارة وصفية حرة وليست مصطلحاً معجمياً مسكوكاً: يمكن إبدال «تغيّر» بـ«تبدّل» أو «تحوّل» ويظل الوصف صالحاً، مما يثبت أنها تفشل اختبار التثبيت المعجمي."
      - "«اسْتِقْرَار» يحمل دلالة أوسع تشمل الوصول إلى حالة الاستقرار والاستتباب بعد اضطراب، وليس صفة عدم التغيير الجوهرية؛ ومعظم شواهده في المعاجم المتخصصة مرتبطة بـ stability لا بـ unchangeability."
      - "«ثَبَات» مقبول دلالياً لكن يحتاج إلى فحص دقيق لثنائية ثَبات/ثُبوت ومدى تمييز أيهما أنسب لهذا السياق."
      - "التعريف العربي الحالي «صفة عدم القابلية للتغيير» ترجمة حرفية للإنجليزي «the quality of being unchangeable» دون مراعاة أسلوب المعجم الوسيط."

    observations: >
      المجموعة الترادفية تصف مفهوماً فلسفياً-وجودياً يعني «الصفة الذاتية لشيء لا يقبل التغيير»؛ وهو مفهوم معروف في التراث الكلامي العربي تحت مباحث «البقاء والفناء» و«الثبوت والزوال». الجذر (ث ب ت) هو الأقرب دلالياً وأكثر توثيقاً في المعاجم التخصصية الحديثة. أما «اسْتِقْرَار» فدلالته الأصيلة أقرب إلى stability (الاستقرار بعد حركة) منها إلى unchangeability (عدم الخضوع للتغيير أصلاً)، وهو تمييز دلالي جوهري. «عَدَم تَغَيُّر» غير مقبولة معجمياً كلمّة مستقلة.

  blind_candidates:
    - lemma: "رُسُوخٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر رَسَخَ يَرْسَخُ رُسُوخاً من الجذر (رسخ)، أصله الثبوت العميق وعسر الزوال. يدل على تمكّن الشيء في موضعه بحيث لا يتحرك ولا يتغير؛ «الراسخ في العلم» كناية عن من لا تزعزعه الشبهات. يناسب مفهوم unchangeability من حيث الدلالة على عدم التزعزع والتغيير.

    - lemma: "دَوَامٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر دَامَ يَدُومُ من الجذر (دوم)، يدل على الاستمرار واللزوم دون انقطاع. أورده ابن فارس بمعنى «السكون واللزوم». يشير إلى صفة البقاء في حالة واحدة دون تغيير، وهو ما يرادف unchangeability من منظور الديمومة.

    - lemma: "صُمُودٌ"
      generation_method: majaz
      justification: >
        مصدر صَمَدَ يَصْمُدُ من الجذر (صمد)، أصله الصلابة والقصد؛ نُقل مجازاً للدلالة على الثبات في مواجهة قوى التغيير والزوال. يستخدم في السياقات المعاصرة بمعنى الصمود أمام الضغوط دون تحوّل.

    - lemma: "دَيْمُومَةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الجذر (دوم) على صيغة فَيْعُولَة، تدل على صفة الدوام والاستمرار المطلق. استُعملت في الفلسفة والإلهيات للدلالة على صفة المطلق الذي لا يتغير. وردت في المعجم الكبير بمعنى «الدوام والثبات».


