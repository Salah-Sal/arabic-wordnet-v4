stage1_review:
  assessment:
    concerns:
      - "المصطلحُ الرسمي المعتمَد في معجم الفيزياء العامة والنووية (1989) ومعجم الكيمياء (1992) الصادرَيْن عن مكتب تنسيق التعريب لجامعة الدول العربية «الحالة الدنيا» غائبٌ عن المجموعة"
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "«حالة قاعية» لا تظهر في المدونات المعجمية بهذا الشكل؛ وقد ورد في المعجم الطبي الموحد (2009) بصيغة «حالة قاعدية» (من قاعدة لا من قاع)"
    observations: "المجموعة تُقنّن مصطلح ground state في الفيزياء الذرية وميكانيكا الكم. اللمّتان الموجودتان تمثّلان نمطَيْن من التعريب: أولهما (أرضية) محاكاةٌ مباشرة للإنجليزية بإسقاط دلالة «الأرض» على «الحالة الأرضية»، وثانيهما (قاعية) استعارةٌ من قاع الإناء أو البئر للدلالة على أسفل السلّم الطاقوي. التعريف الحالي صحيح المضمون لكنه يُعيد صياغة الدال مباشرةً دون توظيف أسلوب الجنس والفصل المعهود في المعجم العربي. الغائب الأبرز عن المجموعة هو «الحالة الدنيا» الذي يُعبّر عن المفهوم تعبيراً طاقوياً صريحاً ويحظى بتوثيق معجمي رسمي."
  blind_candidates:
    - lemma: "الحَالَةُ الأَسَاسِيَّةُ"
      generation_method: tarkib
      justification: "تركيب وصفي من «حالة» و«أساسية» (من أسس: قواعد البناء ودعائمه). يُعبّر عن الحالة التي تقوم عليها سائر حالات الطاقة وتنطلق منها، كما أن «أساس البنية» في المعجم العربي هو ما يُستَند إليه ابتداءً."
    - lemma: "حَضِيضُ الطَّاقَةِ"
      generation_method: majaz
      justification: "تركيب إضافي بالمجاز من «حضيض» (أدنى نقطة في مدار الجرم الفلكي) مُستعار دلالياً لأدنى مستوى طاقوي. إحياءٌ للفظ فلكي عربي كلاسيكي وتوظيفه في سياق كمّي حديث تجنّباً للاشتراك مع «أرضية» و«قاعية»."
    - lemma: "الحَالَةُ السُّكُونِيَّةُ"
      generation_method: tarkib
      justification: "تركيب وصفي من «حالة» و«سكونية» (من سكن: خلاف الاضطراب والحركة). الحالة الأرضية هي حالة الهدوء الطاقوي التام إذ لا يستطيع الجسيم أن ينتقل إلى ما هو أخفض منها، ومن ثَمَّ هي حالة السكون المطلق."
    - lemma: "الْمُسْتَوَى الأَوَّلِيُّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «مستوى» و«أولي» (من أوّل: الأسبق رتبةً). يُشير إلى المستوى الذي يسبق جميع مستويات الطاقة الأعلى، ويُوظّف مفهوم الأسبقية الرتبية لا الاتجاه المكاني."


