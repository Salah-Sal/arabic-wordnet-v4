stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدو مترجماً حرفياً من الإنجليزية (أن يصبح ناضجاً)."
      - "خلو اللمات من التشكيل، فكلمة 'نضج' يمكن قراءتها كفعل أو كمصدر بأكثر من وجه (نُضْج / نَضْج)."
    observations: "المجموعة الدلالية تعبر عن المفهوم البيولوجي لاكتمال التطور والنمو (maturation / ripening). اللغة العربية زاخرة بمفردات النضج التي تتدرج بين العموم (النضج/النضوج) والخصوص كنضج الثمار (الإيناع)."
  blind_candidates:
    - lemma: "نُضْج"
      generation_method: ishtiqaq
      justification: "مصدر الفعل نضج، يعبر عن بلوغ الثمرة أو الكائن الحي تمام نموه وتطوره."
    - lemma: "نُضُوج"
      generation_method: ishtiqaq
      justification: "مصدر قياسي للفعل نضج، شائع الاستعمال للدلالة على اكتمال التطور البيولوجي أو العقلي."
    - lemma: "إِينَاع"
      generation_method: ishtiqaq
      justification: "مصدر الفعل أينع، يختص أكثر بالثمار وبلوغها مرحلة النضج واكتمال تطورها."
    - lemma: "بُلُوغ"
      generation_method: ishtiqaq
      justification: "يعبر عن الوصول إلى الغاية في التطور، ورغم غلبة استخدامه في البلوغ الجنسي للإنسان، فإنه يستعمل مجازاً للكائنات."

stage2_evidence:
  per_lemma:
    - lemma: "إيناع"
      confirm:
        - text: "«أينع الثَّمرُ: ينَع؛ طاب، نضج وحان قطافه.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "نضج"
      confirm:
        - text: "«(حي) تمام نموّ الكائن الحيّ واكتمال خصائص بلوغه.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "نضوج"
      confirm:
        - text: "«اكتمال النُّموِّ، وإدراك وقت القطع أو الأكل 'نُضوج عنب/ الفاكهة'.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "بلوغ"
      contradicts:
        - text: "«البُلوغُ : المَرْحَلة التي تُصبح فيها أعضاءُ التناسُل قادرة على أداء وظائفها , وتتميز عند الأنثى ببداية الحيض , وعند الذكر بالاحتلام , وظهور شعر الإبطين»"
          source: "المعجم الكبير"
          conflict: "يختص في العرف اللغوي والبيولوجي بمرحلة البلوغ الجنسي والقدرة على التناسل (puberty)، بينما تتحدث المجموعة الترادفية عن النضج والتطور الكامل بشكل عام."

stage3_analysis:
  per_lemma:
    - lemma: "إيناع"
      decision: confirmed
      decision_reason: "مصدر صحيح مستعمل بدلالة نضج الثمار واكتمالها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِينَاع"
    - lemma: "نضج"
      decision: confirmed
      decision_reason: "الكلمة الأساسية والأعم الدالة على اكتمال التطور البيولوجي والنمو للكائنات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُضْج"
    - lemma: "نُضُوج"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صحيح لكلمة نضج واسع الانتشار معاصراً للدلالة على حالة النضج واكتمال النمو."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "نُضُوج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "بُلُوغ"
      source: stage1
      decision: removed
      decision_reason: "ارتباطه الدلالي الغالب هو بمرحلة القدرة التناسلية (Puberty) وليس بمطلق النضج واكتمال التطور المادي أو البيولوجي."

stage4_content:
  definition:
    current: "الوصول إلى التطور الكامل؛ أن يصبح ناضجًا"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو مترجماً ترجمة حرفية وركيكة، ويستحسن صياغة تعريف مصطلحي دقيق يشمل الثمار والكائنات الحية."
    authored:
      - type: terminological
        text: "عملية بيولوجية يكتمل فيها نمو الكائن الحي أو الثمرة ويبلغان غاية تطورهما."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية بيولوجية يكتمل فيها نمو الكائن الحي أو الثمرة ويبلغان غاية تطورهما."
  examples:
    per_lemma:
      - lemma: "إِينَاع"
        examples:
          - text: "يبدأ إيناع الثمار في أواخر فصل الصيف."
            type: usage
      - lemma: "نُضْج"
        examples:
          - text: "تصل معظم الثدييات إلى مرحلة النضج بعد فترة نمو محددة."
            type: usage
      - lemma: "نُضُوج"
        examples:
          - text: "ينتظر المزارعون نضوج المحصول قبل البدء في الحصاد."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يبدأ إيناع الثمار في أواخر فصل الصيف."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تصل معظم الثدييات إلى مرحلة النضج بعد فترة نمو محددة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "ينتظر المزارعون نضوج المحصول قبل البدء في الحصاد."

