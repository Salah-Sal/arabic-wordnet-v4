# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «افتراضية جدلية» تفتقر إلى تشكيل كامل، وهي تجمع بين «افتراضية» (الفرضية/الحدسية) و«جدلية» (الجدلي/الديالكتيكي) دون أن تُكوّن معاً مصطلحاً ثابتاً يدل على «مخالفة الحقيقة الواقعة» تحديداً"
      - "اللمّة «مخالفة الواقع» تفتقر إلى تشكيل كامل"
      - "التعريف الحالي «صفة كون الشيء مخالفاً للحقائق الواقعة» يستخدم مادة خ-ل-ف التي هي أصل إحدى اللمّات المؤكدة، مما يُفضي إلى قدر من التعريف الدائري"
      - "المفهوم فلسفي-منطقي أكاديمي متخصص يرتبط بنظرية الشرطيات التقديرية والسببية، ولا يوجد له مصطلح مفرد مستقر في المعجمية العربية الكلاسيكية"
    observations: >
      تُمثّل هذه المجموعة مفهوماً منطقياً-فلسفياً دقيقاً هو «مخالفة الواقع» (Counterfactuality)،
      أي الخاصية التي تجعل قضيةً ما أو افتراضاً ما مناقضاً لما وقع فعلاً.
      يُستخدم هذا المفهوم في المنطق وفلسفة العلوم والذكاء الاصطناعي.
      اللمّة «مخالفة الواقع» هي الأصوب والأكثر شفافية دلالياً من بين اللمّتين المُدرجتين.
      أما «افتراضية جدلية» فلا تؤدي الدلالة المطلوبة لأن «الجدلي» في العربية يرتبط بالجدل
      والمناظرة والديالكتيك، لا بمخالفة الوقائع الثابتة.
      يُنصح بإزالة «افتراضية جدلية» وتصحيح تشكيل «مخالفة الواقع».
      وقد كشف البحث المعجمي عن استخدام «مغاير» في مصادر عربية حديثة ترجمةً لـ counterfactual.

  blind_candidates:
    - lemma: "لَاوَاقِعِيَّة"
      generation_method: ishtiqaq
      justification: >
        صيغة المصدر الصناعي من «لا» (أداة النفي) + «واقع» + ياء النسب + تاء التأنيث،
        على القياس المُنتج في العربية المعاصرة (لاسلكيّة، لاأدريّة، لاعنفيّة).
        تدل دلالةً مباشرةً على «صفة كون الشيء خارجاً عن نطاق الواقع أو مناقضاً له».
        اختُيرت لتجنّب إحياء مفردة من التعريف ذاته، إذ الجذر المستعمل (وقع)
        أصل «الواقع» الاسمي الدال على الحقيقة القائمة.

    - lemma: "تَخَالُفِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من المصدر «تَخَالُف» (المصدر السادسي من خ-ل-ف)،
        وهو يدل على التعارض المتبادل والخلاف الجذري.
        وزن تَفَاعُل يُشير إلى التشارك في الخلاف والتقابل، فـ«تَخَالُفِيَّة» تعني
        «خاصية التعارض الجذري مع ما هو ثابت» مما يُقاربُ المفهومَ المقصود.
        الجذر خ-ل-ف راسخ في دلالة الخلاف والمعارضة في المعجمية العربية.

    - lemma: "نَقِيضِيَّة الحَقِيقَة"
      generation_method: tarkib
      justification: >
        مركّب إضافي: «نَقِيضِيَّة» (مصدر صناعي من «نقيض» = الضد/النظير المعاكس)
        مضاف إلى «الحقيقة».
        «النقيض» في المنطق العربي الكلاسيكي هو ما يُعارض القضية ويناقضها،
        فـ«نقيضية الحقيقة» تعني «خاصية كون الشيء نقيضاً للحقيقة الثابتة».
        المركّب ثابت الدلالة ولا يقبل إبدال أحد مكوّنيه بمرادفٍ دون تغيير المعنى.

    - lemma: "بُطْلَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «بُطْلَان» (مصدر بَطَلَ = ثبتت زيفيّته وعدم صحته).
        وزن فُعلانية مُنتج للتجريد المفاهيمي.
        «البطلانية» تدل على صفة الشيء الباطل غير المُطابق للحقيقة،
        ومن ثَمَّ تقترب من «مخالفة الواقع» من جهة انتفاء الحقيقة.
        الجذر ب-ط-ل راسخ في دلالة انتفاء الحقيقة والزيف.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "افتراضية جدلية"
      expands:
        - text: >
            «(1) جَدَليّ. (2) خِلافيّ: مثير للجَدَل. (3) دالٌّ على […].
            (4) مولَعٌ بالجَدَل.»
          source: "المورد الحديث (2008)"
          addition: "«جدلي» في المعجم الحديث يُرادف argumentative/dialectical ولا يحمل معنى «مخالفة الواقع»"
        - text: >
            «(1) «أ» جَدَليّ. «ب» ديالَكْتيكيّ. (2) dialectal.»
          source: "المورد الحديث (2008)"
          addition: "يؤكد أن «جدلي» يعني dialectical/dialectic وليس counterfactual"
        - text: >
            «جَدْلِيّ» — translation_en: diaphyseal / diaphysary / diaphysial
          source: "المعجم الطبي الموحد (2009)"
          addition: "في الطب «جدلي» يدل على ما يتعلق بجسم العظم (diaphyseal)، مما يُثبت اشتراك اللفظ ويُضعف توظيفه مصطلحاً لهذا المفهوم"

    - lemma: "مخالفة الواقع"
      confirm:
        - text: >
            «(في القانون): أَبْسَطُ الجرائم التي يُعاقب عليها القانون.
            (في المنطق): مَعْنًى عَكْسِيّ يُوصَلُ إليه بوَاسِطَةِ اللُّزوم العَقْلِيِّ»
          source: "المعجم الكبير لمجمع اللغة العربية"
        - text: >
            «(الْمُخَالفَة) هِيَ الجريمة الَّتِي يُعَاقب عَلَيْهَا القانون أساسا بِالْحَبْسِ»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: >
            «المخالفة: خرق أو مخالفة للقانون أو لتعهد أو القيام بعمل يضر بالغير بشكل محدود»
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "التعريف المعجمي السائد لـ«مخالفة» هو المعنى القانوني (infringement/contravention)، لا المعنى الفلسفي المقصود هنا"
        - text: >
            «المخالفة: أن تكون الكلمة بخلاف القانون المستنبط من تتبع لغة العرب»
          source: "كتاب التعريفات للشريف الجرجاني (ت. 1413 م)"
          conflict: "في الاصطلاح البلاغي-اللغوي «المخالفة» تعني الشذوذ عن القانون الصرفي/النحوي لا مخالفة الوقائع الفعلية"
        - text: >
            «المُخَالَفَة: اعتقاد فساده»
          source: "معجم مقاليد العلوم للسيوطي (ت. 1505 م)"
          conflict: "يدل على اعتقاد فساد الشيء لا على الخاصية المنطقية لمخالفة الواقع"
      expands:
        - text: >
            «(خَلَفَ) الْخَاءُ وَاللَّامُ وَالْفَاءُ أُصُولٌ ثَلَاثَةٌ:
            أَحَدُهَا أَنْ يَجِيءَ شَيْءٌ بَعْدَ شَيْءٍ يَقُومُ مَقَامَهُ،
            وَالثَّانِي خِلَافُ قُدَّامٍ، وَالثَّالِثُ التَّغَيُّرُ»
          source: "مقاييس اللغة لابن فارس (ت. 395 ه)"
          addition: "الأصل الثاني (خِلاف قُدَّام) يُرسّخ دلالة المعارضة والتقابل الكامنة في «مخالفة الواقع»"

    - lemma: "لَاوَاقِعِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَخَالُفِيَّة"
      evidence_status: "no_material_found"

    - lemma: "نَقِيضِيَّة الحَقِيقَة"
      evidence_status: "no_material_found"

    - lemma: "بُطْلَانِيَّة"
      evidence_status: "no_material_found"

  additional_findings:
    note: >
      كشف الجسر الإنجليزي (Pattern ٧) عن استخدام قاعدة بيانات «معجم البيانات والذكاء الاصطناعي (2024)»
      لمادة «مغاير» ترجمةً لـ counterfactual في مصطلحين مُقنَّنين:
      «إنصاف مغاير» = Counterfactual Fairness، و«تفسير مغاير» = Counterfactual Explanation.
      يُرسّخ هذا أن «مغاير» هو المرادف العربي الحديث الأكثر شيوعاً لـ counterfactual،
      ومن ثَمَّ فإن «مُغَايَرَة الوَاقِع» تغدو مرشّحاً موثّقاً لهذه المجموعة.
      مقاييس اللغة لجذر غ-ي-ر: «الْغَيْنُ وَالْيَاءُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ،
      يَدُلُّ أَحَدُهُمَا عَلَى صَلَاحٍ وَإِصْلَاحٍ وَمَنْفَعَةٍ،
      وَالْآخَرُ عَلَى اخْتِلَافِ شَيْئَيْنِ».


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "افتراضية جدلية"
      decision: removed
      decision_reason: >
        مركّب وصفي مُصطنع لا يُكوّن وحدةً معجميةً ثابتة دالةً على «مخالفة الواقع».
        «افتراضية» تعني صفة الفرضي/الحدسي (hypothetical)، و«جدلية» تعني صفة الجدلي/الديالكتيكي
        (dialectical) — وكلاهما يشير إلى جانب يُلامس المفهوم من بعيد لكنهما معاً لا يُنتجان
        «مخالفة الحقيقة». أثبتت المعاجم التقنية أن «جدلي» في ARABTERM يعني diaphyseal (طبي)
        وdialectical (فلسفي)، مما يُضاعف الاشتراك اللفظي ويُفقد المصطلح دقّته.
        اختبار الإحلال: يمكن استبدال «جدلية» بـ«حواريّة» أو «نقاشيّة» وتبقى العبارة وصفاً
        مقبولاً — أي أنها ليست وحدةً معجميةً مسكوكة.
        يُحذف الربط بالمجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مخالفة الواقع"
      decision: confirmed
      decision_reason: >
        مركّب إضافي ثابت دالٌّ بوضوح على «مخالفة ما هو واقع وحقيقي».
        مادة خ-ل-ف في مقاييس اللغة تُثبّت الأصل الدلالي لـ«المعارضة والتقابل».
        وقد أورد المعجم الكبير معنىً منطقياً صريحاً: «في المنطق: معنى عكسي يوصل إليه
        بواسطة اللزوم العقلي» — وهو قريب من دلالة المجموعة.
        صحيح أن المعاجم الحديثة طغى فيها المعنى القانوني لـ«مخالفة»، لكن المركّب المقيَّد
        «مخالفة الواقع» يُزيل هذا الاشتراك بتخصيصه بـ«الواقع».
        اختبار الإحلال: «مخالفة الواقع» لا يُحلّ «الواقع» فيه بمرادف آخر (كـ«الحقيقة») دون
        تحوّل دلالي، مما يُعزز ثباته مركّباً اصطلاحياً.
        يحتاج إلى تشكيل كامل: مُخَالَفَة الوَاقِع.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الطابع التعارضي الصريح والمقصود — «خالف» تفيد الخروج عن الموقف المقابل بإرادة
        وفاعلية — فـ«مخالفة الواقع» تحمل ظلّاً من المعارضة الفعلية للحقيقة الموضوعية.
        تُفيد في السياقات المنطقية التي تُؤكَّد فيها طبيعة القضية المُخالِفة للواقع كأداة تحليل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَالَفَة الوَاقِع"

    - lemma: "لَاوَاقِعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوجد لها أثر في قاعدة البيانات المعجمية. الصيغة منطقية ومنتجة صرفياً،
        غير أن غياب التوثيق المعجمي يجعلها مُقترحاً لم يُستقرّ بعد في الاستعمال.
        كذلك يمكن أن تُلتبس بـ«اللاواقعية» بمعنى lack of realism أو النزعة اللاواقعية الفلسفية،
        مما يُوجد اشتراكاً لفظياً مع مفهوم مختلف (unreality/anti-realism).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تَخَالُفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوجد لها أثر في قاعدة البيانات المعجمية. الصيغة صحيحة قياساً
        لكن «تخالف» يدل على التعارض المتبادل بين طرفين، في حين أن المجموعة
        تتحدث عن صفة مُفردة (كون شيء واحد مخالفاً للواقع) لا عن علاقة تعارض ثنائية.
        الدلالة لا تطابق المفهوم المقصود بدقة كافية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "نَقِيضِيَّة الحَقِيقَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوجد لها أثر في قاعدة البيانات المعجمية. «النقيض» في المنطق العربي يدل
        على نقيض القضية (الاقتراح المعاكس في الكيف والكمّ معاً)، مما يجعل «نقيضية الحقيقة»
        أقرب إلى مفهوم «negation» أو «contradiction» منه إلى «counterfactuality».
        كذلك يُضعفها اختبار الثبات المعجمي: لم تُسجَّل كوحدة معجمية في أي مصدر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "بُطْلَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوجد لها أثر في قاعدة البيانات المعجمية. دلالة «البطلان» تنصبّ على
        الزيف والانعدام (nullity/invalidity) لا على «مخالفة الواقع» تحديداً.
        القضية المخالفة للواقع ليست باطلةً بالضرورة — قد تكون مُفيدةً أداةً تحليليةً صحيحة
        في بنيتها المنطقية — وإنما هي مخالفة لما وقع فعلاً. تناقض دلالي مع المفهوم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── توصية إضافية مدعومة بالأدلة المعجمية ──
    # دعمت نتائج الجسر الإنجليزي استخدام «مغاير» لـ counterfactual في ARABTERM،
    # مما يُسوّغ إضافة «مُغَايَرَة الوَاقِع» كلمّة ثانية للمجموعة.
    - lemma: "مُغَايَرَة الوَاقِع"
      source: stage1
      decision: confirmed
      decision_reason: >
        وثّق معجم البيانات والذكاء الاصطناعي (2024) توظيف «مغاير» مقابلاً لـ counterfactual
        في مصطلحين عربيين مُقنَّنين: «إنصاف مغاير» = Counterfactual Fairness و«تفسير مغاير»
        = Counterfactual Explanation. يُثبت هذا التوظيف أن «مغايرة» (المصدر) بات الاختيار
        الاصطلاحي الحديث لمادة هذا المفهوم في الحقل الرقمي والذكاء الاصطناعي.
        الجذر غ-ي-ر في مقاييس اللغة له أصل يدل على «اختلاف شيئين»، وهو ما يُناسب
        المفهوم من زاوية «كون الواقع مغايراً لما يُفترض». «مُغَايَرَة الوَاقِع» مركّب إضافي
        ثابت، يختلف عن «مخالفة الواقع» بتركيزه على البُعد لا على التعارض الصريح.
        اختبار الإحلال: لا يُحلّ «الواقع» بـ«الحقيقة» دون تحوّل دلالي — مقبول.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز بُعد الاختلاف والتباين عن الحقيقة القائمة — «غاير» تفيد المخالفة بمعنى
        التباين والاختلاف النوعي لا المعارضة الصراحية — فـ«مغايرة الواقع» تُلائم
        السياقات التقنية والحاسوبية التي تُصاغ فيها بدائل افتراضية للحوادث الماضية.
      actions:
        - command: create_entry
          params:
            lemma: "مُغَايَرَة الوَاقِع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04766967-n"


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "صفة كون الشيء مخالفاً للحقائق الواقعة"
    assessment:
      decision: revise
