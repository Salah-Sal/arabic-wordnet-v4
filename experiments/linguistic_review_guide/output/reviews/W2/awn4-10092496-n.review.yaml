step0_evidence:
  per_lemma:
    - lemma: "مستكشف"
      confirm:
        - text: "«المُسْتكشِف؛ الرائد»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«انظر: Internet Explorer، Windows Explorer.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "استخدام المصطلح في مجال البرمجيات للدلالة على برامج التصفح وإدارة الملفات"
    - lemma: "مغامر"
      confirm:
        - text: "«مُغَامِر من (غ م ر) الذي يرمي بنفسه في الشدائد، والذي لا يبالي الموت.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رائد"
      source_section: "step4_fts_keyword"
      evidence_citation: "«من يتقدم القوم يبصر لهم مواضع الكلأ، ومساقط الغيث من يقدم - غير مسبوق - على عمل فيمهد الطريق لمن بعده» — المعجم الكبير"
      justification: "اشتقاق مجازي؛ من يتقدم لاكتشاف المجهول، ويستخدم بكثرة في السياقات الحديثة مثل 'رائد فضاء'."
    - lemma: "رحالة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الكثيرُ الرِّحْلَةِ، يقال: رَجُلٌ رَحَّالَةٌ» — المعجم الكبير"
      justification: "اشتقاق على وزن 'فَعّالة' للمبالغة؛ يطلق على من يكثر السفر لاكتشاف البلدان وتدوين المعارف."
  generation_notes: "المصطلحات المستخرجة تعكس بدقة مفهوم السفر إلى المناطق المجهولة بغرض المعرفة أو المخاطرة."

step1_lemma_validation:
  per_lemma:
    - lemma: "مستكشف"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر يدل بدقة على من يسافر بقصد استكشاف مناطق مجهولة، ويقابل 'explorer'."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب المعرفي والعلمي في الرحلة (جمع معلومات، رسم خرائط)."
      example: "عاد المستكشف من رحلته الطويلة بعد أن رسم خرائط دقيقة للمناطق المجهولة."

    - lemma: "مغامر"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع يدل على من يخاطر بنفسه لاقتحام المجهول، ويقابل 'adventurer'."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على غلبة طابع الجرأة والمخاطرة واقتحام الشدائد في السفر."
      example: "انطلق المغامر في رحلة محفوفة بالمخاطر عبر أدغال الغابات الاستوائية."

    - lemma: "رحالة"
      source: step05
      decision: confirmed
      decision_reason: "لفظ عربي أصيل ومستعمل بكثرة في التراث للإشارة إلى من يجوب البلدان غير المعروفة لتدوين مشاهداته."
      step05_citation: "«الكثيرُ الرِّحْلَةِ، يقال: رَجُلٌ رَحَّالَةٌ» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يبرز كثرة السفر والتنقل بقصد التعرف على ثقافات وأماكن جديدة وتدوينها."
      example: "دوّن الرحالة مشاهداته وعادات الشعوب التي زارها في كتاب تاريخي شيق."
      actions:
        - command: create_entry
          params:
            lemma: "رحالة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10092496-n"

    - lemma: "رائد"
      source: step05
      decision: removed
      decision_reason: "رغم دلالته على السبق، إلا أنه أوسع دلالة من مجرد المسافر، وغالبا ما يستخدم بمعنى الريادة في مجال معين (pioneer) وليس بالضرورة استكشاف أماكن جغرافية مجهولة (باستثناء التعبيرات المركبة كـ 'رائد فضاء')."
      step05_citation: "«من يتقدم القوم يبصر لهم مواضع الكلأ» — المعجم الكبير"

  added_lemmas:
    - lemma: "رحالة"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

