# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06613680-n
# meaning / significance / signification / import
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي، ويمكن صياغته بأسلوب معجمي عربي أنضج"
      - "لم يُذكر مصطلح «فَحْوَى» رغم شيوعه في هذا الحقل الدلالي"
    observations: >
      المجموعة تضم ثلاث لمّات أساسية تدور حول مفهوم «المضمون المقصود من الكلام».
      دَلَالَة تركّز على جانب الإشارة والإبانة، ومَعْنًى على القصد والمراد،
      ومَغْزًى على المطلب العميق. الحقل غني بمترادفات عربية أصيلة يمكن النظر
      في إضافة بعضها كـ«فَحْوَى» التي تشير إلى ما يُفهم من مطاوي الكلام.

  blind_candidates:
    - lemma: "فَحْوَى"
      generation_method: ishtiqaq
      justification: >
        من الجذر «فحو»، تعني ما ظهر للفهم من مطاوي الكلام. مصطلح عربي أصيل
        مسجّل في كتاب العين ومقاييس اللغة والمعجم الوسيط، يتوافق مع دلالة
        «import/purport» في المجموعة.
    - lemma: "مَدْلُول"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من «دلّ» على وزن مَفْعُول، يعني ما أشار إليه الدال وما يُفهَم
        من اللفظ. مصطلح راسخ في علم الدلالة واللسانيات العربية.
    - lemma: "مَقْصِد"
      generation_method: ishtiqaq
      justification: >
        من الجذر «قصد» على وزن مَفْعِل، بمعنى الغاية والمطلب.
        يُستخدم بمعنى المراد من الكلام.
    - lemma: "مُرَاد"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من «أراد» على وزن مُفَعَل، بمعنى المطلوب والمبتغى.
        يمكن استعماله بمعنى ما يُراد من الكلام.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "دَلَالَة"
      confirm:
        - text: "«الإرشاد وما يقتضيه اللفظ عند إطلاقه»"
          source: "المعجم الوسيط"
        - text: "«الدَّلالةُ: كَون الشَّيْء بِحَالَة يلْزم من الْعلم بِهِ الْعلم بِشَيْء آخر»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الدَّلِيلُ والإِرْشادُ ما يُفْهَمُ من اللَّفْظِ عند إِطْلَاقِه»"
          source: "المعجم الكبير"
        - text: "«هي كون الشيء بحالة يلزم من العلم به العلم بشيء آخر»"
          source: "كتاب التعريفات للجرجاني"
      expands:
        - text: "«دلالة = signification»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "يؤكد المقابلة المصطلحية مع signification الإنجليزية"
        - text: "«(1) معنًى؛ مَغْزًى؛ دَلالة (2) أهمّيّة»"
          source: "المورد الحديث (significance)"
          addition: "يؤكد ترادف دلالة مع معنى ومغزى في هذا السياق"
      contradicts:
        - text: "«حِرْفَةُ الدَّلَّالِ. ما يُجْعَل لِلدَّلِيلِ أو الدَّلَّالِ مـن الأُجْرَةِ»"
          source: "المعجم الكبير"
          conflict: "الدِّلَالَة بالكسر تعني أجرة الدلّال، وهو معنى مختلف تماماً عن المعنى المقصود هنا"

    - lemma: "مَعْنًى"
      confirm:
        - text: "«ما يدلُّ عليه اللَّفظ»"
          source: "المعجم الوسيط"
        - text: "«المعنى: ما يقصد بشيء»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«لغة المقصود سواء قصد أولا، فهو إمّا مصدر بمعنى المفعول أو مخفّف معنيّ اسم مفعول»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(1) معنًى؛ مدلول (2) قصد؛ هَدَف؛ مُراد؛ غَرض (3) مغزًى»"
          source: "المورد الحديث (meaning)"
      expands:
        - text: "«الْمَعْنَى هُوَ الْقَصْدُ الَّذِي يَبْرُزُ وَيَظْهَرُ فِي الشَّيْءِ إِذَا بُحِثَ عَنْهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يربط المعنى بالأصل الاشتقاقي: القصد الذي يظهر ويبرز"

    - lemma: "مَغْزًى"
      confirm:
        - text: "«من الكلام: مقصده»"
          source: "المعجم الوسيط"
        - text: "«الْمطلب يُقَال مَا مغزاك»"
          source: "المعجم الوسيط"
        - text: "«المَغْزى: الغزُو والمغازي مناقبُ الغُزاة ومنه كتابُ المغازي لاشتماله عليها ومعنى الغزو الإرادةُ والقصدُ والطلبُ»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: "«(3) مغزًى a book full of meaning»"
          source: "المورد الحديث (meaning)"
          addition: "يؤكد استعمال مغزى كمرادف لـ meaning في الإنجليزية"

    - lemma: "فَحْوَى"
      confirm:
        - text: "«فحوى القَوْل مضمونه ومرماه الَّذِي يتَّجه إِلَيْهِ الْقَائِل»"
          source: "المعجم الوسيط"
        - text: "«معنى ما يعرف من مذهب الكلام»"
          source: "كتاب العين"
        - text: "«ما ظهر للفهم من مطاوي الكلام»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(1) مَعْنًى؛ فحوى؛ مفاد؛ مُراد (2) زبدة الكلام؛ خلاصة القول»"
          source: "المورد الحديث (purport)"

    - lemma: "مَدْلُول"
      confirm:
        - text: "«المَدْلُولُ: هُوَ الْمَطْلُوب عَن الدَّلِيل»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«مَعنى، مدلول = meaning»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
      contradicts:
        - text: "«المدلول: هو الذي يلزم من العلم بشيء آخر العلم به»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المدلول في الاصطلاح المنطقي هو الطرف المشار إليه في العلاقة الدلالية (signified)، لا المعنى المجرد ذاته"
        - text: "«يظهر المدلول، حسب دو سوسير، كمرادف للمفهوم»"
          source: "المعجم الموحد لمصطلحات اللسانيات (Signified)"
          conflict: "في اللسانيات الحديثة، مدلول = signified (المفهوم المقابل للدال)، وهو مصطلح تقني مختلف عن meaning/significance"

    - lemma: "مَقْصِد"
      confirm:
        - text: "«مَوضِع القَصْد»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«يُقَال إِلَيْهِ مقصدي وجهتي»"
          source: "المعجم الوسيط"
          conflict: "المقصد في الأصل بمعنى الوِجهة والمكان المقصود، لا بمعنى المعنى أو الدلالة"

    - lemma: "مُرَاد"
      contradicts:
        - text: "«المُرَاد: العُنُق»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي الأساسي للمُراد هو العنق"
        - text: "«المراد: عبارة عن المجذوب عن إرادته»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "في الاصطلاح الصوفي، المراد هو المحبوب المجذوب، لا المعنى"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "دَلَالَة"
      decision: confirmed
      decision_reason: >
        لمّة راسخة في المعجمية العربية بمعنى ما يقتضيه اللفظ عند إطلاقه.
        مؤيَّدة بأدلة من الوسيط والكبير والجرجاني والتهانوي.
        الدَّلالة بالفتح هي المعنى المطلوب هنا (لا الدِّلالة بالكسر = أجرة الدلّال).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تركّز على جانب الإشارة والإبانة: كون الشيء بحالة يُفهَم منه شيء آخر.
        هي أقرب إلى signification الإنجليزية، أي العلاقة بين الدال والمدلول.
      actions: []

    - lemma: "مَعْنًى"
      decision: confirmed
      decision_reason: >
        اللمّة المركزية في الحقل الدلالي. مؤيَّدة بجميع المعاجم.
        الأشيع استعمالاً والأعمّ دلالةً بين أخواتها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ اللمّات دلالةً: ما يُقصد بالشيء أو يُفهم منه، سواء أكان لفظاً أم
        غير لفظ. هي المقابل الطبيعي لـ meaning الإنجليزية. تتميز بشمولها لكل
        أنواع المعاني (لغوية، اصطلاحية، مجازية).
      actions: []

    - lemma: "مَغْزًى"
      decision: confirmed
      decision_reason: >
        مؤيَّدة بالوسيط والبركتي. تحمل دلالة «المطلب ومقصد الكلام»
        وتقابل import/purport في الإنجليزية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تشير إلى المقصد العميق والمطلب المستتر وراء الكلام، وهي أخصّ من معنى.
        تستلزم بحثاً وتأملاً للوصول إليها. تقابل import/significance أكثر
        من meaning المحايدة.
      actions: []

    # ── مرشحات المرحلة ١ ──
    - lemma: "فَحْوَى"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح عربي أصيل مسجّل في كتاب العين ومقاييس اللغة والوسيط بمعنى
        «مضمون القول ومرماه». يتقاطع مع حقل المجموعة تقاطعاً واضحاً.
        مؤيَّد بالمورد الحديث كمقابل لـ purport.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تدل على ما يُفهم من مطاوي الكلام دون تصريح مباشر: المضمون الضمني
        والمرمى الذي يتجه إليه القائل. أخصّ من معنى لأنها تستلزم استنباطاً.
        تقابل purport/import في الإنجليزية.
      actions:
        - command: create_entry
          params: {lemma: "فَحْوَى", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَدْلُول"
      source: stage1
      decision: removed
      decision_reason: >
        المدلول في الاصطلاح اللغوي والمنطقي يعني الطرف المشار إليه في العلاقة
        الدلالية (signified)، وهو مصطلح تقني مستقر في اللسانيات الحديثة بمعنى
        مغاير لـ meaning/significance. إدراجه هنا يُحدث خلطاً مصطلحياً.

    - lemma: "مَقْصِد"
      source: stage1
      decision: removed
      decision_reason: >
        المقصد في المعاجم بمعنى «موضع القصد والوِجهة»، وهو أقرب إلى
        purpose/destination منه إلى meaning/significance. لا يُستعمل في
        العربية الفصيحة مرادفاً للمعنى.

    - lemma: "مُرَاد"
      source: stage1
      decision: removed
      decision_reason: >
        المُراد في المعاجم إمّا العنق (الوسيط)، أو المحبوب المجذوب في الاصطلاح
        الصوفي (الجرجاني). وإن استُعمل عامّياً بمعنى «المقصود»، فليس مصطلحاً
        معجمياً مستقراً بمعنى meaning/significance.

