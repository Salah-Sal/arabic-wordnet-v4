# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان «إمكانية الحل» و«قابلية الحل» خاليتان من التشكيل الكامل الإلزامي"
      - "اللمّتان متقاربتان دلالياً بدرجة تجعل الفرق بينهما غير موثّق ولا محدَّد"
      - "لا تعكس اللمّتان الموجودتان المصطلح التقني الأكثر دقةً في المعاجم المتخصصة"
      - "التعريف الحالي يستخدم الأسلوب التعريفي ذا الحشوة بين قوسين — ليس أسلوب المعجم الوسيط"
    observations: >
      المجموعة الترادفية تُعبّر عن مفهوم «قابلية الحل» (solvability) — أي الخاصية الكامنة في المسألة
      التي تُتيح إيجادَ حلٍّ لها. وهو مفهوم مستخدَم في الرياضيات والمنطق وعلم الحاسوب.
      اللمّتان الموجودتان تركيبان إضافيان صحيحان لكنهما يعوزهما الإيجاز والدقة المصطلحية.
      المفهوم يحتاج إلى مصطلح مفرد أو مركّب ذي صكّ معجمي موثّق.

  blind_candidates:
    - lemma: "حَلِّيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «حَلَّ» (الجذر حلل) بإلحاق ياء النسبة وتاء المصدر الصناعي.
        الوزن فَعِّيَّة يُفيد الخاصية المجردة، كما في «أهلية» و«حرفية» و«تحريرية».
        يُعبّر مباشرةً عن «خاصية الحل» مكثّفةً في لفظ مفرد.

    - lemma: "قَابِلِيَّةُ الحَلِّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «قابلية» (استعداد ذاتي للقبول) و«الحلّ» (إيجاد مخرج من المسألة).
        الوزن الإضافي يُفيد إسناد الخاصية إلى حدَث معين، وهو الأنسب للمفاهيم الوظيفية.
        يُقابل صرفياً مصطلحات من قبيل «قابلية الاشتعال» و«قابلية الذوبان».

    - lemma: "اِنْحِلَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «انحلّ» (الفعل المطاوع الخماسي) على وزن افتعالية.
        يدل على الطابع الانحلالي الكامن في المسألة — أي استعدادها الذاتي للانفراج والحل.
        يستخدم الفعل المطاوع للإشارة إلى الخاصية الجوهرية لا الفعل الإرادي.

    - lemma: "اِنْفِكَاكِيَّة"
      generation_method: majaz
      justification: >
        مصدر صناعي من «انفكّ» (الجذر فكك) بالمجاز؛ الفكّ في الأصل تحليلُ الربط والعقد المادي،
        وقد أُسند بالمجاز إلى الإشكاليات الذهنية: «انفكَّت العقدة» بمعنى انحلَّت المسألة.
        يُحيي مدلولاً تراثياً في سياق حديث.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت: ٦ استعلامات
# ١. مطابقة دفعية لجميع اللمّات والمرشحات (حل، الحل، قابلية، القابلية، إمكانية، الإمكانية، حلية، الحلية، انحلالية، الانحلالية، انفكاكية، الانفكاكية)
# ٢. تفاصيل المداخل المهمة (entry_ids: 718454, 718446, 718455, 465465, 424287, 427684)
# ٣. جسر إنجليزي: solvability | solubility | solvable | dissolvability
# ٤. FTS عربي: قابلية الحل | امكانية الحل | قابل للحل | حلية | انفكاكية
# ٥. مقاييس اللغة: حل/حلل، قبل، مكن
stage2_evidence:

  per_lemma:

    - lemma: "إمكانية الحل"
      confirm:
        - text: "«(1) قابلٌ للحلّ أو التفسير (2) ذوّاب.» [ترجمة مفردة solvable]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) ذوّاب: قابلٌ للذَّوبان (2) قابلٌ للحلّ soluble puzzles.» [ترجمة مفردة soluble]"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن «قابل للحل» هو التعبير العربي الطبيعي للمعنى المجازي لـ soluble/solvable"

    - lemma: "قابلية الحل"
      confirm:
        - text: "«الاستعداد للقبول [مصدر صناعي]»"
          source: "المعجم الوسيط (القَابِلِيَّة)"
        - text: "«قابلية الذوبان الانحلالية» [تعريف حد الذوبانية]"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          # يُثبت قياسية الصيغة التركيبية «قابلية + المصدر»
      expands:
        - text: "«(1) الذّوبانيّة؛ الذائبيّة؛ الانحلاليّة: قابلية الذوبان أو الانحلال (2) الحَلِّيّة: قابلية الحلّ والتفسير.» [ترجمة مفردة solubility]"
          source: "المورد الحديث (2008)"
          addition: "يُفرّق المورد الحديث بصراحة بين «قابلية الحل» (للمسائل المجردة) و«الذوبانية» (للمواد) — مما يُثبت صحة التركيب في هذا السياق"

    - lemma: "حَلِّيَّة"
      confirm:
        - text: "«(1) الحَلِّيّة: قابليّة الحَلِّ أو التَّفسير (2) الذَّوَبانيّة.»"
          source: "المورد الحديث (2008) — مفردة solvability"
        - text: "«(1) الذّوبانيّة؛ الذائبيّة؛ الانحلاليّة: قابلية الذوبان أو الانحلال (2) الحَلِّيّة: قابلية الحلّ والتفسير.»"
          source: "المورد الحديث (2008) — مفردة solubility"
      expands:
        - text: "«(حَلَّ) الْحَاءُ وَاللَّامُ لَهُ فُرُوعٌ كَثِيرَةٌ وَمَسَائِلُ، وَأَصْلُهَا كُلُّهَا عِنْدِي فَتْحُ الشَّيْءِ، لَا يَشِذُّ عَنْهُ شَيْءٌ. يُقَالُ حَلَلْتُ الْعُقْدَةَ أَحُلُّهَا حَلًّا»"
          source: "مقاييس اللغة لابن فارس — الجذر حلل"
          addition: "أصل الجذر «فتح الشيء» يدعم دلالة الحَلِّيَّة كخاصية الانفتاح/الانفراج الكامنة في المسألة"

    - lemma: "قَابِلِيَّةُ الحَلِّ"
      confirm:
        - text: "«الاستعداد للقبول [مصدر صناعي]»"
          source: "المعجم الوسيط (القَابِلِيَّة)"
        - text: "«قابلية الذوبان (المرادف العربي)» [تعريف ذوبانية]"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          # يُثبت أن «قابلية + مصدر» قالبٌ اصطلاحي راسخ
      expands:
        - text: "«(القَابِلِيَّة) الاستعداد للقبول (مصدر صناعي)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (الوسيط)"
          addition: "تُؤكد أن «قابلية» مصطلح معجمي مسجّل بمعنى الاستعداد الذاتي"

    - lemma: "اِنْحِلَالِيَّة"
      confirm:
        - text: "«قابلية الانحلال في سائل مذيب.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — مفردة solubility"
      contradicts:
        - text: "«قابلية الانحلال في سائل مذيب.» و«ذوبانية» و«الانحلاليّة: قابلية الذوبان أو الانحلال»"
          source: "المورد الحديث (2008) + معاجم الكيمياء والصيدلة"
          conflict: >
            جميع الشواهد المعجمية تُثبّت «انحلالية» في معنى الذوبان الكيميائي (chemical solubility)
            لا في معنى قابلية حل المسائل المجردة (solvability). المفهومان مختلفان: الأول مادي،
            والثاني منطقي/رياضي. استخدام «انحلالية» بديلاً عن «حلّيّة» اشتراكٌ لفظي مُضلِّل.

    - lemma: "اِنْفِكَاكِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إمكانية الحل"
      decision: confirmed
      decision_reason: >
        تركيب إضافي عربي صحيح يُفيد إمكان الحل (possibility of solving). الإمكانية هنا تُشير إلى
        جانب القدرة والاحتمال من خارج المسألة (هل ثمة حلٌّ ممكن؟). مستخدَم في الأدبيات العربية
        الرياضية والفلسفية. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على الجانب الخارجي للإمكان: هل يوجد حلٌّ ممكن من حيث المبدأ؟ الرؤية من خارج المسألة
        نحو إمكانية وجود حل. يُستخدم في السياقات العامة والفلسفية أكثر من التقنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِمْكَانِيَّةُ الحَلِّ"

    - lemma: "قابلية الحل"
      decision: confirmed
      decision_reason: >
        تركيب إضافي عربي صحيح وموثَّق معجمياً؛ «قابلية» مصدر صناعي بمعنى الاستعداد الذاتي للقبول.
        القالب «قابلية + مصدر» راسخٌ في المعاجم التقنية (قابلية الذوبان، قابلية الاشتعال).
        يُركّز على الخاصية الداخلية للمسألة ذاتها. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على الخاصية الداخلية والذاتية للمسألة (inherent property): المسألة في طبيعتها
        وبنيتها قابلةٌ للحل. الرؤية من داخل المسألة نحو استعدادها الكامن. أدق من «إمكانية الحل»
        في التعبير عن المعنى التقني. الأكثر شيوعاً في المعاجم التقنية العربية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ الحَلِّ"

    - lemma: "حَلِّيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مؤكَّد في المورد الحديث (2008) كترجمة مباشرة لـ solvability: «الحَلِّيّة: قابليّة الحَلِّ
        أو التَّفسير». الصيغة مصدر صناعي قياسي من الجذر حلل على نمط أهلية، حرفية، تحريرية.
        هي الأدق مصطلحياً والأكثر إيجازاً، مناسبة للاستخدام التقني في المنطق والرياضيات
        وعلم الحاسوب. مفعّلة الجذر العربي الأصيل دون غموض.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصطلح تقني مكثَّف يُستخدم خاصةً في المنطق الرياضي ونظرية الحوسبة للإشارة إلى قابلية
        القضية أو المسألة لوجود حلٍّ خوارزمي. يجمع دلالتَي «إمكانية الحل» و«قابلية الحل» في كلمة
        واحدة. الأقرب إلى المصطلح الإنجليزي solvability في الدلالة والبنية الصرفية.
      actions:
        - command: create_entry
          params:
            lemma: "حَلِّيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05222751-n"

    - lemma: "قَابِلِيَّةُ الحَلِّ"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق لِلمّة الموجودة «قابلية الحل» — تمّت معالجتها في مسارها. لا حاجة لإجراء مستقل.

    - lemma: "اِنْحِلَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبّت أن «انحلالية» خاصٌّ بالذوبان الكيميائي (chemical solubility)
        في سائل مذيب — وهو مفهوم مادي مختلف عن قابلية حل المسائل المنطقية والرياضية.
        إضافته ستُدخل اشتراكاً لفظياً مُضلِّلاً بين مجالَين مختلفَين.

    - lemma: "اِنْفِكَاكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي توثيق معجمي لهذا المصطلح. وإن كان الجذر (فكك) صحيحاً والمجاز واضحاً،
        فإن «انفكاكية» مصطلح مُنشَأ لا سابقة له في المعاجم، ووجود «حلّيّة» الموثَّق يُغني عنه.


