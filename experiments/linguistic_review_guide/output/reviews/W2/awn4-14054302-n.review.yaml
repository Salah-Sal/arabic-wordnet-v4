# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-14054302-n  |  ILI: i110667  |  POS: n
# Definition (EN): the state of being imminent and liable to happen soon
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة «وشوك» لا أصل لها في المعاجم الكلاسيكية أو الحديثة كمصدر مستقل؛ المصادر الموثقة لوشُكَ هي: وَشْك ووَشَاكَة ووُشْكَان، ولا ذكر لـ«وشوك» في أي مصدر."
      - "اللمة «دنو» أشمل دلالةً من مفهوم المجموعة؛ إذ تُعبّر عن القرب المكاني والزماني عموماً، لا تختص بمعنى الإيشاك وقرب الحدث الوشيك."
      - "اللمتان خاليتان تماماً من التشكيل."
    observations: "المجموعة تعبّر عن مفهوم «الوشوك والإيشاك»، وهو قرب الأمر من الوقوع بسرعة. الجذر وشك موثق توثيقاً غنياً في المعاجم الكلاسيكية والحديثة، ومصادره المسموعة ثلاثة: وَشْك (الأشيع) ووَشَاكَة ووُشْكَان. أما دنو فجذره دنا-يدنو صحيح ومعناه المقاربة والقرب، غير أن دلالته أعم مما تختص به المجموعة. الكلمة المحورية للمجموعة ينبغي أن تكون وَشْك أو وَشَاكَة لا وشوك."
  blind_candidates:
    - lemma: "وَشَاكَة"
      generation_method: ishtiqaq
      justification: "مصدر وَشُكَ على وزن فَعَالة، يدل على الخاصية المجردة للإيشاك وقرب الحدوث؛ المصادر المسموعة لوشُك تشمل هذه الصيغة، وهي تُوازي imminence بوصفها اسماً للمفهوم المجرد."
    - lemma: "أُزُوف"
      generation_method: ishtiqaq
      justification: "مصدر أَزَفَ (قَرُب وأزِفَ الأمرُ) من الجذر أزف، ورد في التنزيل {أَزِفَتِ الْآزِفَةُ}؛ يدل على قرب الشيء من الحدوث دلالةً تُناسب مفهوم الإيشاك."
    - lemma: "تَدَانٍ"
      generation_method: ishtiqaq
      justification: "مصدر تَدَانَى على وزن تَفَاعُل من دنا، يفيد حالة التقارب المتزايد والدنو التدريجي من الحدث؛ ذكره الزمخشري في أساس البلاغة."
    - lemma: "إِرْهَاص"
      generation_method: majaz
      justification: "محاولة مجازية من رَهَصَ بمعنى أسّس القاعدة؛ قُصد به حالة التمهيد قبيل الوقوع، يستدعي التحقق من إمكانية توظيفه لهذه الدلالة."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دفعية: دنو، الدنو، وشوك، الوشوك، وشاكة، الوشاكة، ازوف، الازوف، وشك، الوشك
#   ٢. جسر إنجليزي: imminence, imminency, imminentness, impendence, impendency, forthcomingness, imminent
#   ٣. FTS عربي: "وشيك" OR "وشك" OR "يوشك" OR "دنو" OR "ازوف"
#   ٤. مقاييس اللغة: جذر دنو، جذر وشك
stage2_evidence:
  per_lemma:
    - lemma: "دنو"
      confirm:
        - text: "«الدنو: القرب بالذات أو الحكم، ويستعمل في المكان والزمان»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
        - text: "«دَنَا الشَّيْءُ من الشَّيْءِ دُنُوّاً ودَناوَةً: قَرُبَ»"
          source: "المحكم والمحيط الأعظم لابن سيده (ت. 1066م)"
        - text: "«دنا الشيءُ: قرُب — دنا وقتُ الرحيل»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«(1) وشيك؛ آتٍ قريبًا (4) اقتراب؛ دنوّ» — ترجمةً لـ forthcoming"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«يُوشِكُ أَنْ يَكُونَ كَذَا مِنْ أَفْعَالِ الْمُقَارَبَةِ وَالْمَعْنَى الدُّنُوُّ مِنَ الشَّيْءِ»"
          source: "المصباح المنير للفيومي (ت. 1368م)"
          addition: "يربط الفيومي صريحاً بين الإيشاك ودنو الشيء، مما يؤكد أن دنوّ يقع في دائرة مفهوم المجموعة وإن كان أوسع منه"
        - text: "«الدُّنُوُّ القُرْبُ بالذاتِ أَوِ الحُكْم، ويُسْتَعْملُ فِي المَكانِ والزَّمانِ»"
          source: "تاج العروس لمرتضى الزبيدي (ت. 1790م)"
          addition: "يؤكد شمولية دنو لكلا البُعدين المكاني والزماني، مما يُثبت أنه أعم من مفهوم الإيشاك الزمني الخالص"

    - lemma: "وشوك"
      evidence_status: "no_material_found"

    - lemma: "وَشَاكَة"
      confirm:
        - text: "«وَشُك وَشَاكة، ووَشَّك، وأوشك»"
          source: "المحكم والمحيط الأعظم لابن سيده (ت. 1066م)"
        - text: "«قَدْ وَشُكَ وَشْكاً ووَشَاكَةً، فَهُوَ وَشِيكٌ»"
          source: "النهاية في غريب الحديث والأثر لابن الأثير (ت. 1209م)"
        - text: "«وشُكَ يَوشُك، وَشْكًا ووَشاكةً ووُشْكانًا، فهو وشيك»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«(يُوشك) وشكا ووشاكة ووشكانا سرع وقرب فهو وشيك (وقد يستعمل استعمال أفعال المقاربة كأوشك)»"
          source: "المعجم الوسيط"
          addition: "يُثبت أن وشاكة مصدر صريح موثق مع وشك ووشكان، ويربطها بمعنى السرعة والقرب معاً، مما يؤكد صلاحيتها مقابلاً لـ imminence"

    - lemma: "أُزُوف"
      evidence_status: "no_material_found"

    - lemma: "تَدَانٍ"
      expands:
        - text: "«بينهم تقارب وتدان، ودانيت بين الشيئين: قاربت بينهما»"
          source: "أساس البلاغة للزمخشري (ت. 1143م)"
          addition: "يُوثّق تدانٍ مصدراً لتدانى بمعنى التقارب العام، دون أن يختص بقرب الحدث الوشيك؛ دلالته تتداخل مع دنو أكثر مما تختص بالإيشاك"

    - lemma: "إِرْهَاص"
      contradicts:
        - text: "«الإرهاص: ما يظهر من الخوارق عن النبي صلى الله عليه وسلم قبل ظهوره، كالنور الذي كان في جبين آباء نبينا»"
          source: "كتاب التعريفات للشريف الجرجاني (ت. 1413م)"
          conflict: "الإرهاص مصطلح شرعي راسخ يختص بالخوارق النبوية قبل البعثة، لا علاقة له بمفهوم الوشوك أو قرب الحدوث الزمني"
        - text: "«(الإرهاص) شرعاً: الأمرُ الخارقُ للعادة يظهر للنبي قبل بعثته»"
          source: "المعجم الوسيط"
          conflict: "المعنى الاصطلاحي الراسخ للإرهاص في جميع مصادر المعاجم الشرعية واللغوية لا يتلاقى مع مفهوم الإيشاك"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "دنو"
      decision: confirmed
      decision_reason: "دنو (دُنُوّ) مصدر فصيح موثق في جميع المعاجم من الجذر دنا-يدنو، ويصلح لتغطية المعنى التقريبي للمجموعة بما يعادل forthcomingness/اقتراب؛ يُبقى مع تصحيح التشكيل إلى دُنُوٌّ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبّر عن القرب الزمني والمكاني عموماً دون أن يتضمن بالضرورة دلالة السرعة والإيشاك الحادّة؛ يُستخدم لوصف الاقتراب التدريجي (كدنو الأجل، دنو الربيع، دنو الشمس من المغرب)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُنُوٌّ"

    - lemma: "وشوك"
      decision: confirmed
      decision_reason: "المفهوم صحيح ومطلوب في المجموعة (يوازي imminence/impendence)، لكن صيغة «وشوك» غير موثقة في أي مصدر معجمي؛ المصدر الفصيح الصحيح لوشُكَ هو وَشْك. يُصحَّح الرسم إلى وَشْك."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختص بالقرب الزمني الحادّ لحدث وشيك الوقوع مع دلالة صريحة على السرعة والاندفاع نحو الحدوث؛ هو الجذر الصرفي الذي يُبنى منه الفعل يوشك (من أفعال المقاربة) في التعبير عن إيشاك الأمر."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَشْك"

    - lemma: "وَشَاكَة"
      source: stage1
      decision: confirmed
      decision_reason: "وشاكة مصدر موثق توثيقاً صريحاً في المحكم (ابن سيده) والنهاية (ابن الأثير) والمعجم الوسيط ومعجم اللغة العربية المعاصرة؛ يُوازي imminence / imminency / imminentness بوصفه الاسم المجرد الدالّ على خاصية الوشوك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصدر صريح يُجرّد الخاصية المجردة للوشك ويدل عليها كمفهوم قائم بذاته؛ أشد تجريداً من وشك ومن دنو، ويصلح مقابلاً اصطلاحياً دقيقاً لـ imminence."
      actions:
        - command: create_entry
          params:
            lemma: "وَشَاكَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أُزُوف"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أزوف كمصدر مستقل لأَزَفَ في أي مصدر معجمي؛ الوحيد الوارد «بحر آزوف» (Sea of Azov) وهو اسم علم جغرافي أجنبي لا صلة له بالجذر العربي. كما أن وزن فُعول ليس الوزن المعيار لمصادر أفَعَل."

    - lemma: "تَدَانٍ"
      source: stage1
      decision: removed
      decision_reason: "تدانٍ مصدر تدانَى بمعنى التقارب العام؛ دلالته تتداخل مع دنو المُقرَّر في المجموعة ولا تختص بمفهوم الإيشاك الزمني الحادّ. إضافته توليد لمرادف فائض لا قيمة مضافة له."

    - lemma: "إِرْهَاص"
      source: stage1
      decision: removed
      decision_reason: "الإرهاص مصطلح شرعي راسخ يعني الخوارق الظاهرة على النبي قبل بعثته؛ دلالته في جميع المعاجم بعيدة كل البُعد عن معنى الإيشاك وقرب الحدوث الزمني، ولا يصلح إحياؤه لهذه الدلالة."


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────
stage4_content:
  definition:
    current: "حالة كونه وشيكاً وعرضة للحدوث قريباً"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري: يستخدم «وشيكاً» في تعريف المجموعة المبنية على وشك/وشوك؛ كما أن «عرضة للحدوث» تُضيف دلالة الإمكانية لا الضرورة، وهو غير دقيق في وصف الإيشاك."
    authored:
      - type: terminological
        text: "حالةٌ تُنبئُ عن قُرْبِ أمرٍ من الوقوعِ وانعقادِ أسبابِ حدوثِه في وقتٍ قريب"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "قُرْبُ الشيءِ من الوقوعِ وسُرْعةُ حدوثِه؛ يُقال: الأمرُ على وَشْكِ أن يكون"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
