stage1_review:
  assessment:
    concerns:
      - "امتزاز مصطلح خاص بـ adsorption (الالتصاق السطحي) في جُلِّ المعاجم التقنية، وليس الاسمَ الجامع sorption الذي يشمل العمليتين معاً — فاستخدامه هنا يخلط بين الهيبونيم والهيبرنيم."
      - "تشارب غير موثَّق بمعنى sorption في أي مصدر معجمي مُعتمَد؛ والأثر الوحيد الموجود يورده بمعنى potocytosis (انتقال السوائل عبر الخلايا بالحويصيلات) — وهو مفهوم بيولوجي مختلف كلياً."
      - "التعريف الحالي يُشير إلى الامتزاز باعتباره إحدى العمليتين الفرعيتين لـ sorption، في حين يُستخدم الامتزاز ذاته لمّةً رئيسية للمجموعة — تناقض داخلي بنيوي."
    observations: >
      المجموعة تُمثِّل المفهوم الكيميائي المعروف بـ «sorption»، وهو الاسم الجامع لعمليتَي
      الامتصاص (absorption — دخول المادة إلى باطن الجسم الماصّ) والامتزاز (adsorption — التصاقها
      بسطحه الخارجي). اللمّتان الحاليتان مشكلتان: امتزاز مخصَّص للعملية الفرعية (adsorption)،
      وتشارب غير موثَّق للمفهوم المقصود. يبدو أن المصطلح الأنسب من الجذر ش-ر-ب هو اشتراب
      (على وزن اِفْتِعَال) الذي يجمع الامتصاصَ والامتزازَ معاً وفق المعاجم التقنية الموثَّقة.

  blind_candidates:
    - lemma: "تَشَرُّبٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ش-ر-ب على وزن تَفَعُّل (مصدر الفعل الخماسي المطاوع)؛ يدل على انتقال مادة
        إلى داخل أخرى تدريجياً. مناسب لمعنى «أخذ مادة لأخرى» الوارد في التعريف.

    - lemma: "اشْتِرَابٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ش-ر-ب على وزن اِفْتِعَال (Form VIII)؛ يدل على الاختيار والاستجلاب الفعّال.
        اشتراب بمعنى «استجلاب مادة وامتصاصها» مشتقٌّ أصيل من الجذر المستقر ش-ر-ب، يُناسب
        مفهومَ عملية أخذ مادة لأخرى على نحو شامل لكلا الآليتين.

    - lemma: "احْتِجَازٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ح-ج-ز على وزن اِفْتِعَال؛ يدل على الحبس والإمساك والحيلولة. يُناسب
        الشقَّ الثاني من التعريف «تُمسك بها»، إذ الاحتجاز هو إمساك مادة بأخرى ومنعها من الانفلات.

    - lemma: "اسْتِمْسَاكٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر م-س-ك على وزن اِسْتِفْعَال (Form X)؛ يعني التشبُّث والإمساك الشديد.
        وزن اِسْتِفْعَال يُفيد الطلب والديمومة، والاستمساك يُعبِّر عن فعل إمساك مادة بأخرى
        بصورة متعمَّدة، مُوافقاً للجانب الكيميائي لـ sorption لا سيما الامتزاز.


stage2_evidence:
  per_lemma:

    - lemma: "امتزاز"
      contradicts:
        - text: "«التصاق جزيئات مادة غريبة بسطح سائل أو جسم صلب»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          conflict: "يقصر امتزاز على الالتصاق السطحي (adsorption) دون الامتصاص الباطني (absorption)؛ فهو الهيبونيم لا الهيبرنيم."
        - text: "«تراكم المواد من الغازات أو السوائل على سطح مادة صلبة. يختلف ذلك عن الامتصاص، حيث تدخل الجزيئات في داخل الجسم الصلب أو السائل. يُعرف المُسمَّى الجامع لعمليتَيِّ الامتصاص والامتزاز، باسم تحزّز.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          conflict: "يُفرِّق صراحةً بين امتزاز (adsorption) وامتصاص (absorption)، ويُسمِّي الجامعَ بينهما «تحزُّزاً» لا «امتزازاً» — دليل قاطع على أن امتزاز ليس الاسم الجامع."
        - text: "«إضافة الغازات أو المواد الذائبة على سطح المواد الصلبة (مادة تكثيف) في مُكثِف.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "تعريف سطحيٌّ بحت لا يشمل الامتصاص الباطني."
        - text: "«تراكم جُسيمات (ذرات، وجُزيئات، ...إلخ) من نوعٍ واحد أو أكثر، في حالة سائلة أو غازية، على سطح جسم صلب أو على سائل.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "يخصُّ الامتزاز السطحي (adsorption) حصراً."
        - text: "«التصاق جزيئات غازية أو سائلة أو صلبة بسطح معين نتيجة جذب كهربائيّ أو كيميائيّ.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "تعريف سطحي يخصُّ adsorption لا العملية الجامعة."
      expands:
        - text: "«التصاق سطحي» — translation_en: sorption"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "الأثر الوحيد الذي يُترجم امتزاز بـ sorption، غير أن التعريف المصاحب (التصاق سطحي) يُؤكِّد أن المقصود الالتصاق السطحي (adsorption)، مما يشير إلى استخدام مُتساهِل في هذا المعجم لا يُعتمد معياراً."

    - lemma: "تشارب"
      contradicts:
        - text: "«تشارب (انتقال السوائل بين الخلايا)» — translation_en: potocytosis"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "تشارب موثَّق بمعنى potocytosis — آلية نقل السوائل عبر الحويصيات الدقيقة داخل الخلايا — وهو مفهوم بيولوجي خلوي مغاير كلياً لمفهوم sorption."

    - lemma: "تَشَرُّبٌ"
      confirm:
        - text: "«(فى علم الكيمياء): امتصاصُ مادةٍ صلبةٍ لسائلٍ حتـى درجـةِ التَّشبُّعِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      contradicts:
        - text: "«(فى علم الكيمياء): امتصاصُ مادةٍ صلبةٍ لسائلٍ حتـى درجـةِ التَّشبُّعِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "يُقيِّد تشرُّب بالامتصاص (absorption) وحده — العملية الفرعية — دون تغطية الامتزاز (adsorption)؛ فليس الاسم الجامع المطلوب."

    - lemma: "اشْتِرَابٌ"
      confirm:
        - text: "«التغيّر الحادث في تركيز المواد الذي يُمكن أن يُستفاد منه في تصميم العمليات التقنية... كما يشمل مُصطلح التحزّز كل من الامتصاص والامتزاز.» — translation_en: sorption"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "translation_en: sorption"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC"
        - text: "«يجمع مصطلح اشتراب كلا العمليتين: الامتصاص والامتزاز (أو الأدمصاص).»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ضمن تعريف ادمصاص"

    - lemma: "احْتِجَازٌ"
      contradicts:
        - text: "«كمية التساقطات على حوض مائي، والتي لا تهدر بالجريان النهري خلال زمن محدد.» — translation_en: retention"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "احتجاز في الهندسة المائية يعني احتجاز مياه التساقط في حوض (retention)، لا العملية الجزيئية الكيميائية لأخذ مادة لأخرى."

    - lemma: "اسْتِمْسَاكٌ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:

    - lemma: "امتزاز"
      decision: removed
      decision_reason: >
        المعاجم التقنية باتساقٍ شبه تام (فيزياء، كيمياء، أحياء، هندسة، صيدلة، استشعار...) تستخدم
        امتزاز حصراً لـ adsorption (الالتصاق السطحي)، وهو إحدى العمليتين الفرعيتين للمفهوم المحلول
        sorption. لا يُعقل أن يكون الاسم الجامع هو نفسه اسم أحد مفرداته الداخلية؛ إذ يُفضي ذلك
        إلى تناقض معجمي يجعل امتزاز هيبونيمَ نفسه. الأثر الاستثنائي في معجم الجيولوجيا
        (translation: sorption) يعكس استخداماً مُتساهِلاً والتعريف المرافق (التصاق سطحي)
        يدحضه.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تشارب"
      decision: removed
      decision_reason: >
        الدليل المعجمي يُثبت أن تشارب مستخدَم في المعجم الطبي الموحد بمعنى potocytosis —
        آلية بيولوجية خلوية لنقل السوائل عبر الحويصيات — وهو مفهوم لا صلة له بـ sorption.
        لم يُعثر على أي مصدر يوظِّف تشارب بمعنى العملية الطبيعية لأخذ مادة لأخرى.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اشْتِرَابٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في ثلاثة مصادر ARABTERM بترجمة مباشرة «sorption»: معجم الطاقة المتجددة،
        والمَكنَز الزراعي AGROVOC، ومعجم المياه. ويُعرَّف صراحةً بأنه الجامع لكلا العمليتَيْن
        (الامتصاص والامتزاز). مشتقٌّ اشتقاقاً سليماً من الجذر العربي الأصيل ش-ر-ب على وزن
        اِفْتِعَال المنتج، ولا تعارض في الأدلة. اجتاز اختبار التثبيت المعجمي (وحدة معجمية
        مسجَّلة في معاجم متخصصة). اجتاز اختبار الاشتقاقية (وزن منتج، جذر مستقر).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اشتراب هو اللمّة الوحيدة المُقرَّرة في المجموعة عقب المراجعة؛ يُعبِّر عن العملية
        الجامعة لأخذ مادة غريبة سواءٌ بامتصاصها في الكتلة (absorption) أو بامتزازها على
        السطح (adsorption)، دون تخصيص لأيٍّ من الآليتين.
      actions:
        - command: create_entry
          params:
            lemma: "اشْتِرَابٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَشَرُّبٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الكبير يُقيِّده بـ «امتصاص مادة صلبة لسائل حتى التشبُّع» — وهو absorption
        فحسب، لا الجامع sorption؛ إذ لا يشمل الامتزازَ السطحي. فلا يصلح لمّةً لهذه المجموعة.

    - lemma: "احْتِجَازٌ"
      source: stage1
      decision: removed
      decision_reason: >
        يُستخدم في الهندسة المائية لاحتجاز مياه التساقط في الأحواض (retention)، وليس للعملية
        الجزيئية الفيزيائية-الكيميائية لأخذ مادة لأخرى على المستوى الجزيئي.

    - lemma: "اسْتِمْسَاكٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي يوظِّف استمساك في السياق الكيميائي أو الفيزيائي لـ sorption؛
        وهو وإن صحَّ لغةً لا يُعدُّ مصطلحاً مسكوكاً في هذا المجال.


stage4_content:
  definition:
    current: "العملية التي تأخذ فيها مادة مادة أخرى أو تمسك بها (سواء عن طريق الامتصاص أو الامتزاز)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول مضموناً لكنه يعاني من تكرار «مادة مادة» المُستثقَل في العربية
        الفصيحة، وهو مُترجَم حرفياً من الإنجليزية. يستحسن إعادة صياغته بأسلوب المعجم الوسيط
        مع الإبقاء على الدقة الاصطلاحية، وإضافة تعريف موسوعي مستقل يُوضِّح التمييز بين
        العمليتين الفرعيتين.
    authored:
      - type: terminological
        text: "عمليةٌ طبيعيةٌ تأخذ فيها مادةٌ مادةً غريبةً أو تُمسك بها، إمَّا بامتصاصِها في باطنها، أو بامتزازِها على سطحها الخارجي."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مصطلحٌ جامعٌ في الكيمياء والفيزياء يشمل عمليتَيْن: الامتصاص (absorption) حيث تنتقل
          جزيئات مادةٍ إلى داخل كتلة مادة أخرى لتشكِّل محلولاً أو مزيجاً متجانساً، والامتزاز
          (adsorption) حيث تلتصق تلك الجزيئات بسطح المادة الماصّة دون اختراق باطنها.
          ويُستثمر الاشتراب في تقنيات تنقية الهواء والمياه، وفصل الغازات، ومعالجة التربة الملوَّثة.
