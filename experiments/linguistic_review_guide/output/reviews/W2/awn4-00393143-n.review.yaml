stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية (اشتقاق، استمداد) تغطي الجانب اللغوي والتمويني، لكن المجموعة تحتاج لمصطلحات تعبر عن عملية الحصول على الشيء من أصله بمعناها العام والشامل (مثل استنباط واستخلاص)."
    observations: "المفهوم يشمل عملية الحصول على شيء (مادي أو معنوي) من مصدره. 'اشتقاق' هي اللفظة التقنية الأبرز، و'استمداد' تعبر عن التواصل مع المصدر. سنقترح إضافة 'استنباط' و'استخلاص' لشمولية الدلالة."
  blind_candidates:
    - lemma: "اشْتِقَاق"
      generation_method: ishtiqaq
      justification: "اللفظ المعياري للتعبير عن تولد شيء من أصل (لغوياً أو رياضياً)."
    - lemma: "اسْتِمْدَاد"
      generation_method: ishtiqaq
      justification: "التزود من مصدر أو أصل."
    - lemma: "اسْتِخْلَاص"
      generation_method: ishtiqaq
      justification: "استخراج اللب أو النتيجة من مادة أصلية."
    - lemma: "اسْتِنْبَاط"
      generation_method: ishtiqaq
      justification: "استخراج المعاني أو النتائج الخفية من أصولها."

stage2_evidence:
  per_lemma:
    - lemma: "اشْتِقَاق"
      confirm:
        - text: "«يدل في معناه العام على وجود أصل في شيء»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«صوغ كلمة من أخرى على حسب قوانين الصرف»"
          source: "المعجم الوسيط"
    - lemma: "اسْتِمْدَاد"
      confirm:
        - text: "«الميم والدال أصل واحد مطرد، وهو يدل على الشيء يطول ويجر... والمِداد: ما يُكتب به، لأنه يُمدّ بالماء.»"
          source: "مقاييس اللغة (بالقياس)"
      expands:
        - text: "«الاستمداد: طلب المدد أو الاستعانة بمصدر.»"
          source: "الاستعمال المعاصر"
    - lemma: "اسْتِنْبَاط"
      confirm:
        - text: "«الاستنباط: لغة: استخراج الماء من العين، واصطلاحاً: استخراج المعاني من النصوص بفرط الذهن وقوةِ القريحة.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«النون والباء والطاء كلمة تدل على استخراج شيء.»"
          source: "مقاييس اللغة"
    - lemma: "اسْتِخْلَاص"
      confirm:
        - text: "«الخاء واللام والصاد أصل واحد مطرد، وهو تنقية الشيء وتهذيبه.»"
          source: "مقاييس اللغة"
        - text: "«العملية التي يحصل بها على الخلاصة»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"

stage3_analysis:
  per_lemma:
    - lemma: "اشتقاق"
      decision: confirmed
      decision_reason: "المصطلح الأساسي المعبر عن الاشتقاق من أصل، مدعوم بقوة في المعاجم المتخصصة واللغوية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اشْتِقَاق"
    - lemma: "استمداد"
      decision: confirmed
      decision_reason: "يعبر عن جانب الحصول المستمر أو التزود من المصدر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِمْدَاد"
    - lemma: "اسْتِنْبَاط"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي وفصيح يعبر عن استخراج المعاني والنتائج من أصولها بدقة، وهو مطابق للتعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اسْتِنْبَاط", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00393143-n"}
    - lemma: "اسْتِخْلَاص"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن عملية الحصول على الجوهر أو المستخلص من مادة أو مصدر أصلي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اسْتِخْلَاص", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00393143-n"}

stage4_content:
  definition:
    current: "فعل اشتقاق شيء أو الحصول عليه من مصدر أو أصل"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم الكلمة المعرفة (اشتقاق) في التعريف نفسه، ويفضل صياغته بأسلوب معجمي أدق."
    authored:
      - type: terminological
        text: "استخراج الشيء أو صوغه من أصله أو مصدره."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "اشْتِقَاق"
        examples:
          - text: "يُدرس الطلاب قواعد اشتقاق الأسماء من الأفعال في اللغة العربية."
            type: usage
      - lemma: "اسْتِمْدَاد"
        examples:
          - text: "تعتمد الدول على استمداد طاقتها من المصادر المتجددة."
            type: usage
      - lemma: "اسْتِنْبَاط"
        examples:
          - text: "برع الفقهاء في استنباط الأحكام الشرعية من نصوص القرآن والسنة."
            type: usage
      - lemma: "اسْتِخْلَاص"
        examples:
          - text: "تمكن الكيميائي من استخلاص المادة الفعالة من أوراق النبات."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-00393143-n", definition_index: 0, text: "استخراج الشيء أو صوغه من أصله أو مصدره."}

stage5_enrichment:
  per_entry:
    - lemma: "اشْتِقَاق"
      entry_id: "{auto}"
      root: "شقق"
      maqayis_quote: "«الشِّينُ وَالْقَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى انْصِدَاعٍ فِي الشَّيْءِ، ثُمَّ يُحْمَلُ عَلَيْهِ وَيُشْتَقُّ مِنْهُ عَلَى مَعْنَى الِاسْتِعَارَةِ.»"
    - lemma: "اسْتِمْدَاد"
      entry_id: "{auto}"
      root: "مدد"
      maqayis_quote: "«الْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ فِي طُولٍ، وَاتِّصَالِ شَيْءٍ بِشَيْءٍ فِي اسْتِطَالَةٍ.»"
    - lemma: "اسْتِنْبَاط"
      entry_id: "{auto}"
      root: "نبط"
      maqayis_quote: "«النُّونُ وَالْبَاءُ وَالطَّاءُ كَلِمَةٌ تَدُلُّ عَلَى اسْتِخْرَاجِ شَيْءٍ. وَاسْتَنْبَطْتُ الْمَاءَ: اسْتَخْرَجْتُهُ.»"
    - lemma: "اسْتِخْلَاص"
      entry_id: "{auto}"
