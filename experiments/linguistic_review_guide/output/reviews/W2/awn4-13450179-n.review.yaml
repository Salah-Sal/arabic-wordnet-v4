      nuance_differentiation: "أعمُّ الألفاظِ وأشيعُها، تشملُ الحالةَ والعمليةَ معاً، وتُستخدَم في السياقَيْن البيولوجيِّ والاجتماعيِّ دونَ تخصيصٍ لدرجةِ التقدُّمِ"
      actions:
        - command: update_lemma
          params:
