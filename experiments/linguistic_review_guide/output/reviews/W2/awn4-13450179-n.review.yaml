          source: "القاموس المحيط للفيروزآبادي (1414 م)"
          addition: "يُضيف مصدرَيْن جديدَيْن: المَهرَم والمَهرَمة، ويؤكَّد أن الهرمَ أقصى الكِبَرِ لا مجرد التقدُّمِ فيه"
        - text: "«(الهَرم) الشَّيخ يبلغ أقصى الكبر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
          addition: "يُشير إلى أن «الهرم» يُطلق أيضاً على الشخصِ البالغِ أقصى الكبرِ (بمعنى اسم الفاعل)"
