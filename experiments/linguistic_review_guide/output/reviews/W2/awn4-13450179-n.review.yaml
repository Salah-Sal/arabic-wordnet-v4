# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «تقدم في السن» عبارةٌ وصفيةٌ حرةٌ لا مصطلحٌ مسكوكٌ؛ يجوز إحلال «العمر» محلَّ «السن» دون إخلالٍ بالمعنى، مما يُخفق في اختبار التثبيت المعجمي"
      - "لمّة «هرم» خاليةٌ من التشكيل وتحتاج إلى ضبطٍ كـ«هَرَمٌ» لتمييزِها عن «الهَرْمُ» (نبات) والهَرَمُ (بناء فرعوني) والهَرِمُ (الشخص البالغ أقصى الكبر)"
      - "لمّة «شيخوخة» خاليةٌ من التشكيل وتستحقُّ التشكيلَ الكاملَ «شَيْخُوخَةٌ»"
      - "«هرم» يعاني من اشتراكٍ لفظيٍّ شديدٍ مع المعنى المعمارييِّ والهندسيِّ والنباتيِّ"
      - "غيابُ مصطلحٍ طبيٍّ دقيقٍ يُعادل «Senescence» بمعناه الفسيولوجيِّ عن المجموعةِ الراهنةِ"
    observations: "المجموعةُ الترادفيةُ تُعبِّرُ عن مفهومٍ حيويٍّ أصيلٍ للتقدُّمِ في السنِّ عرَفَه العربُ منذُ القِدَمِ بمصطلحاتٍ متعددةِ المناحي. «شيخوخة» مصدرٌ صناعيٌّ راسخٌ هو الأعمُّ استعمالاً والأشملُ دلالةً. «هرم» مصدرٌ كلاسيكيٌّ يُفيد المبالغةَ في الكِبَرِ وبلوغَ أقصاه. غاب عن المجموعةِ مصطلحانِ وجديران بالإضافةِ: «التَّشَيُّخُ» المصطلحُ الطبيُّ الذي يُقابل Senescence في الأدبياتِ العلميةِ العربيةِ، و«الكِبَرُ» الذي يُركِّزُ على الجانبِ الزمنيِّ للعمليةِ. يُلاحَظُ أيضاً خطأٌ في بعضِ إدخالاتِ قاعدةِ البياناتِ التي تُسجِّلُ «شخ» جذراً لـ«شيخوخة» بدلاً من الجذرِ الصحيحِ «شيخ»."

  blind_candidates:
    - lemma: "تَهَرُّمٌ"
      generation_method: ishtiqaq
      justification: "مشتقٌّ من الجذر «هرم» على وزن «تَفَعُّل» الدالِّ على حصولِ الفعلِ تدريجياً؛ يُعبِّر عن المسارِ الحيويِّ لبلوغِ أقصى الكِبَرِ. الوزنُ ملائمٌ للدلالةِ على العمليةِ لا على الحالةِ."
    - lemma: "تَشَيُّخٌ"
      generation_method: ishtiqaq
      justification: "مشتقٌّ من الجذر «شيخ» على وزن «تَفَعُّل» الدالِّ على الحدوثِ التدريجيِّ؛ يُعبِّر عن مسارِ الكائنِ الحيِّ نحو الشيخوخةِ بصورةٍ عضويةٍ، وهو مستعمَلٌ في المعاجمِ الطبيةِ الحديثةِ مقابلاً لـSenescence."
    - lemma: "الذُّبُولُ"
      generation_method: majaz
      justification: "استعارةٌ من مجالِ النباتِ (ذَبَلَ النباتُ: ذوى وجفَّ)، تُطبَّق على العمليةِ الحيويةِ للهرمِ باعتبارها انتقاصاً تدريجياً للحجمِ والوظيفةِ بمشابهةٍ وظيفيةٍ. إحياءٌ لفظيٌّ كلاسيكيٍّ استعمله الحكماءُ في وصفِ انتقاصِ الجسمِ."
    - lemma: "الكِبَرُ"
      generation_method: ishtiqaq
      justification: "مصدرٌ من الجذر «كبر» على وزن «فِعَل»، ورد في معاجم اللغةِ بمعنى «التقدُّمِ في السنِّ». فرَّق المعجميون بين «الكِبَر» (علوُّ السنِّ) و«الكِبْر» (العظمةُ والغرور) و«الكُبْر» (الأقعديةُ في النسب)، مما يُتيحُ استعمالَه اصطلاحياً محدَّداً."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
