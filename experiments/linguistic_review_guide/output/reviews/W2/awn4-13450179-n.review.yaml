          conflict: "المعجمُ الكبيرُ نفسُه يُورد المعنيَيْن معاً؛ مما يستوجبُ تقييدَ الاستعمالِ الاصطلاحيِّ بالسياقِ الطبيِّ"

    - lemma: "الذُّبُولُ"
