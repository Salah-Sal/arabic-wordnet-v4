          source: "التعريفات الفقهية للبركتي (1975 م)"
        - text: "«الهرم: علو السن. وأصله من الهرم، وهو نبت ضعيف، والكبر يضعف البدن»"
          source: "التوقيف على مهمات التعاريف للمناوي (1622 م)"
        - text: "«مرحلة من مراحل ما بعد القطاف في الثمار يحصل فيها تحلل الفاكهة أو الخضار نتيجة لتخزينها فترة طويلة» [= senescence]"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM"
        - text: "[= senescence]"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC — ARABTERM"
        - text: "[= senility]"
