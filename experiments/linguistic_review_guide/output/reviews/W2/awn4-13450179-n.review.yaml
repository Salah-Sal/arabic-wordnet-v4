    - lemma: "تقدم في السن"
      decision: removed
      decision_reason: "تفشلُ هذه العبارةُ في اختبار التثبيت المعجمي؛ يجوز إحلالُ «تقدُّم في العمر» أو «تقدُّم في الأعمار» محلَّها في أيِّ سياقٍ دون إخلالٍ، مما يُثبتُ أنها عبارةٌ وصفيةٌ حرةٌ لا وحدةٌ معجميةٌ ثابتةٌ. لا يُسجِّلُها المعجمُ مدخلاً مستقلاً بل يُورِدُها مقترنةً بـ«شيخوخة». بنيتُها: اسمٌ + جارٌّ ومجرور، وليست تركيباً إضافياً أو وصفياً مسكوكاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
