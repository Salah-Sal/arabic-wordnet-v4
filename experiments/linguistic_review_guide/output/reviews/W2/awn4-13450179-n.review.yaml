      source: stage1
      decision: confirmed
      decision_reason: "يُوثِّقُه معجمُ الطبِّ البيطريِّ (كِبَر = aging) ومقاييسُ اللغةِ لابن فارس (الكِبَرُ = الهَرَمُ)، ويُشير إليه AGROVOC بـageing، ومعجمُ الطبِّ (1985) يُعرِّفُه بـ«التغيراتِ التدريجيةِ التي تطرأ على أجهزةِ الكائنِ الحيِّ بمرورِ الوقتِ». مصدرٌ كلاسيكيٌّ راسخٌ من الجذرِ «كبر» يُركِّزُ على الجانبِ الزمنيِّ. فارقُ التشكيلِ «كِبَر» يُميِّزُه من «كِبْر» (عظمة) و«كُبْر» (أقعدية)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّزُ على الجانبِ الزمنيِّ للتقدُّمِ في السنِّ (مرورُ الوقتِ وتراكُمُ التغيُّراتِ التدريجيةِ) دونَ إيحاءٍ بالانحلالِ الشديدِ أو أقصى الكبرِ كما يُوحي «الهرم»"
      actions:
        - command: create_entry
          params:
            lemma: "الكِبَرُ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَهَرُّمٌ"
      source: stage1
      decision: removed
      decision_reason: "لم تُسفر استعلاماتُ قاعدةِ البياناتِ عن أيِّ دليلٍ معجميٍّ مُثبِتٍ لهذا المصدرِ. يُغني عنه «هَرَمٌ» الموجودُ في المجموعةِ ويُشاركُه الجذرَ والمعنى، كما يُغني عنه «تَشَيُّخٌ» المؤكَّدُ في أدائِه وظيفةَ التعبيرِ عن العمليةِ الحيويةِ."


