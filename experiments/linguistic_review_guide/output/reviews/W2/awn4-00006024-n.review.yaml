step0_evidence:
  per_lemma:
    - lemma: "غيري التغذية"
      confirm:
        - text: "«كائن حي (الحيوانات والفطريات ومعظم البكتيريا) مع طلب على مركبات عضوية غنية بالطاقة من إنتاج غيره.» — مسرد المناخ والبيئة (ArabTerm)"
          source: "ArabTerm"
        - text: "«كائن غَيْريّ التَّغذيَّة» — المَكنَز الزراعي متعدد اللغات"
          source: "ArabTerm"
      expands:
        - text: "«غَيْرِيُّ التَّغَذِّي» — المعجم الطبي الموحد"
          source: "المعجم الطبي الموحد"
          addition: "صيغة (التغذي) بديلة للمصدر (التغذية)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عضوي التغذية"
      source_section: "step5_english_bridge"
      evidence_citation: "«عُضْوِيّ التغذية: متطلّبٌ مركّباتٍ عضوية معقّدة من النتروجين والكربون للتأليف الأيضيّ.» — المورد الحديث (2008)"
      justification: "مصطلح علمي دقيق يربط التغذية بالمواد العضوية، وهو مرادف مباشر لـ heterotroph."
    - lemma: "شاذة التغذية"
      source_section: "step5_english_bridge"
      evidence_citation: "«شاذة التغذية: غير ذاتية التغذية» — المعجم الموحد لمصطلحات علم الأحياء (1993)"
      justification: "مصطلح معتمد في المعاجم البيولوجية الموحدة للتعبير عن الحيود عن التغذية الذاتية."
  knowledge_candidates:
    - lemma: "متباين التغذية"
      justification: "الترجمة الأكاديمية الأكثر شيوعاً للمصطلح الأجنبي (heterotroph) في المناهج العربية (آلية التوليد: مجاز/إزاحة دلالية)."
    - lemma: "غيري التغذي"
      justification: "تنويع صرفي قياسي مستخدم في المعجم الطبي الموحد (آلية التوليد: اشتقاق)."

