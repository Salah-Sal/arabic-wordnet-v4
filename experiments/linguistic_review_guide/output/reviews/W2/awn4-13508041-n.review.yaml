# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────

stage1_review:

  # أ. توليد اللمّات المرشحة — عمياء (من الملف المُقنَّع فقط)
  #    التعريف: عملية طبيعية في الجيولوجيا يتم بموجبها تعديل المعالم الجيولوجية
  blind_candidates:
    - lemma: "التَّحَوُّلُ الجيولوجيُّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من «تَحَوُّل» (مصدر تحوَّل، جذر حول) و«جيولوجي» (نسبة إلى
        الجيولوجيا). يُعبِّر عن فكرة الانتقال من حالة إلى أخرى التي تنطوي عليها
        العمليات الجيولوجية. الوزن تَفَعُّل يُفيد الحدوث التدريجي المناسب
        للعمليات الطبيعية.

    - lemma: "التَّشَكُّلُ الأرضيُّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من «تَشَكُّل» (مصدر تشكَّل، جذر شكل) و«أرضي» (نسبة إلى
        الأرض). يُجسِّد فكرة تكوُّن المعالم وتبدُّلها، وهو جوهر ما تقوم به
        العمليات الجيولوجية. استُعيض بـ«أرضي» عن «جيولوجي» للاستفادة من
        الموروث العربي الأصيل.

    - lemma: "النَّشَاطُ الجيولوجيُّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من «نَشَاط» (جذر نشط، يدل على الحركة والاهتزاز) و«جيولوجي».
        يُلمِح إلى الديمومة والاستمرار، مما يلائم الطابع الزمني الممتد
        للعمليات الجيولوجية. يُوازي «نشاط طبيعي» في المجموعة الأعلى بـAWN.

    - lemma: "التَّفَاعُلُ الجيولوجيُّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من «تَفَاعُل» (مصدر تفاعَل، جذر فعل) و«جيولوجي». وزن
        تَفَاعُل يُفيد الاشتراك والتأثير المتبادل بين المكوِّنات الجيولوجية
        (الحرارة والضغط والماء والصخور).

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة «عملية جيولوجية» تفتقر إلى التشكيل الكامل."
      - "تكاد اللمّة تُعيد صياغة التعريف الإنجليزي ذاته (geological process) مما ينطوي على دوران محتمل."
      - "المجموعة تحتوي على لمّة واحدة فقط، بينما المجموعة الأعلى (عملية طبيعية) تحتوي على ثلاث لمّات؛ ينبغي إثراؤها."
      - "التعريف العربي الحالي يستعمل صياغة بيروقراطية («يتم بموجبها») بدلاً من الأسلوب المعجمي الأصيل."
      - "الجملة الاعتراضية «(في الجيولوجيا)» في مستهل التعريف ليست من أسلوب المعجم الوسيط."
    observations: >-
      المجموعة awn4-13508041-n تمثِّل الفئة العامة للعمليات الجيولوجية (geological
      process) بوصفها نوعاً تحت «عملية طبيعية». المصطلح «عملية جيولوجية» موثَّق
      في AGROVOC وفي المعاجم التقنية العربية، وهو الاختيار الأمثل. غير أن إثراء
      المجموعة بلمّة موازية على جذر «نشط» (كما في «نشاط طبيعي» للمجموعة الأعلى)
      سيُعمِّق التمثيل المعجمي ويُوسِّع نطاق الاسترجاع. أما مرشحا «التشكل»
      و«التحول» فيُحيلان إلى عمليات أضيق نطاقاً لا إلى الفئة الكلية.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────

stage2_evidence:

  # ملخص الاستعلامات المنفَّذة (٦ استعلامات):
  # ١) batch headword: عملية جيولوجية + المرشحات الأربعة + عملية + جيولوجي
  # ٢) English bridge: "geological process" OR "geologic process" OR "geological"
  # ٣) Arabic FTS: "جيولوجيا" OR "جيولوجي" OR "تشكل" OR "تحول ارضي"
  # ٤) Combined enrichment (def+ex+pl) by entry_id
  # ٥) Maqayis (dict 151): عمل، شكل، حول، نشط، فعل
  # ٦) Maqayis منفرداً: نشط

  per_lemma:

    # ── عملية جيولوجية (لمّة موجودة) ──
    - lemma: "عملية جيولوجية"
      confirm:
        - text: >-
            «عملية جيولوجية» — translation_en: "geological processes"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC — entry_id 755575"
        - text: >-
            «العملية: جملة أعمال تُحدث أثراً خاصّاً مثل عملية جراحية»
          source: "المعجم الوسيط — entry_id 19734"
        - text: >-
            «(العملية) جملَة أَعمال تحدث أثرا خَاصّا يُقَال عملية جراحية أَو
            حربية أَو مَالِيَّة (محدثة)»
          source: "المعجم الوسيط — نسخة Hawramani — entry_id 878340"
        - text: >-
            «إجراء يمتد على مدى فترة زمنية مُحددة، وأثناء حدوثه ينشأ أو يتطوّر
            شيءٌ ما (تدريجيًا)» — translation_en: "process"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — entry_id 379733"
        - text: >-
            «جيولوجي» — translation_en: "geologic; geological" — domain: "Geology"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — entry_id 431079"

    # ── التَّحَوُّلُ الجيولوجيُّ (مرشح ١) ──
    - lemma: "التَّحَوُّلُ الجيولوجيُّ"
      evidence_status: "no_material_found"

    # ── التَّشَكُّلُ الأرضيُّ (مرشح ٢) ──
    - lemma: "التَّشَكُّلُ الأرضيُّ"
      contradicts:
        - text: >-
            «(1) تَشَكُّل جيولوجيّ (2) منطقة؛ أرض.»
          source: "المورد الحديث (2008) — entry_id 722837"
          conflict: >-
            «تشكل جيولوجي» هو مقابل «formation» (التكوين الصخري) وليس مقابلاً
            للمفهوم العام «geological process». المرشح أضيق من نطاق المجموعة
            ولا يُغطِّي سائر الأنشطة الجيولوجية غير التشكيلية.

    # ── النَّشَاطُ الجيولوجيُّ (مرشح ٣) ──
    - lemma: "النَّشَاطُ الجيولوجيُّ"
      expands:
        - text: >-
            «تآكل جيولوجي: تآكل عادي أو طبيعي، ناتج عن الأنشطة الجيولوجية التي
            تؤثر على مدى فترات جيولوجية طويلة وتؤدي إلى تآكل الجبال، وتشريح
            السهول، وأيضا بناء السهول الساحلية. مرادف لعوامل التعرية الطبيعية.»
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — entry_id 356555"
          addition: >-
            يكشف النص أن «الأنشطة الجيولوجية» مصطلح جارٍ في المعاجم التقنية
            العربية للإشارة إلى العمليات الجيولوجية، مما يُسوِّغ اعتماد «النشاط
            الجيولوجي» (مفرد) لمّةً إضافية للمجموعة.

    # ── التَّفَاعُلُ الجيولوجيُّ (مرشح ٤) ──
    - lemma: "التَّفَاعُلُ الجيولوجيُّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────

stage3_analysis:
  per_lemma:

    # ── عملية جيولوجية (لمّة موجودة) ──
    - lemma: "عملية جيولوجية"
      decision: confirmed
      decision_reason: >-
        اللمّة موثَّقة مباشرةً في AGROVOC بالمقابل الإنجليزي «geological processes»،
        وتدعمها تعريفات المعجم الوسيط لـ«العملية». المصطلح راسخ في المعاجم
        التقنية العربية. يستلزم إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        يُركِّز على الطابع الإجرائي المتسلسل للحدث الجيولوجي (جملة أعمال تُحدث
        أثراً خاصاً)؛ هو المصطلح التقني الدقيق المستخدم في التعريفات العلمية
        والتصنيفات المعجمية التخصصية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّة جيولوجيَّة"

    # ── التَّحَوُّلُ الجيولوجيُّ (مرشح ١) ──
    - lemma: "التَّحَوُّلُ الجيولوجيُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية. «التحوُّل» (transformation) يُعبِّر عن نوع محدد من
        العمليات الجيولوجية (التحوُّل الحراري أو المعدني) وليس عن الفئة الكلية؛
        اعتماده لمّةً سيُضيِّق دلالة المجموعة.
      evidence_assessment:
        case: no_material

    # ── التَّشَكُّلُ الأرضيُّ (مرشح ٢) ──
    - lemma: "التَّشَكُّلُ الأرضيُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        الدليل المعجمي يُقابِل «formation» (التكوين الصخري)، وهو أضيق من
        مدلول المجموعة. اعتماد هذه اللمّة سيُوقع في الاشتراك اللفظي مع مفهوم
        «formation» المستقل في AWN.
      evidence_assessment:
        case: contradicts_only

    # ── النَّشَاطُ الجيولوجيُّ (مرشح ٣) ──
    - lemma: "النَّشَاطُ الجيولوجيُّ"
      source: stage1
      decision: confirmed
      decision_reason: >-
        «الأنشطة الجيولوجية» موثَّق في ARABTERM (مسرد المناخ والبيئة) وهو مرادف
        لـ«العمليات الجيولوجية». «النشاط الجيولوجي» (المفرد) يُوازي بنيوياً
        «نشاط طبيعي» في المجموعة الأعلى awn4-13540166-n. جذر «نشط» يدل على
        الحركة والتأثير المستمر (ابن فارس) — وصف وجيه للعمليات الجيولوجية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        يُركِّز على جانب الحركة والتأثير المستمر عبر الزمن الجيولوجي الطويل؛
        يُستخدَم في الأوصاف العامة والسياقات التربوية والإعلامية، بينما يُختار
        «عملية جيولوجية» في السياقات التقنية الأكاديمية الدقيقة.
      actions:
        - command: create_entry
          params: {lemma: "نَشَاط جيولوجيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13508041-n"}

    # ── التَّفَاعُلُ الجيولوجيُّ (مرشح ٤) ──
    - lemma: "التَّفَاعُلُ الجيولوجيُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية. «التفاعل» (interaction / reaction) أضيق من الفئة
        الكلية، وقد يُوقع في التداخل مع المصطلحات الكيميائية والفيزيائية.
      evidence_assessment:
        case: no_material


