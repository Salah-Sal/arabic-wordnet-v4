# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13867120-n
# antecedent / forerunner — أي شيء يسبق شيئًا مشابهًا في الوقت
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «رَائِد» دلالتها الأصلية على الطليعة والريادة والاستكشاف، لا على مجرد السَّبْق الزمني"
      - "لفظة «سَابِق» اسم فاعل يُستعمل وصفاً في الغالب، واستعماله اسماً بمعنى «ما تقدَّم» يحتاج توثيقاً"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج صياغة معجمية عربية أصيلة"
    observations: "المجموعة تدلّ على مفهوم السَّبْق الزمني العام: أي شيء يتقدَّم شيئاً مماثلاً له في الزمان. المفهوم حاضر في التراث العربي بوضوح، إذ تتعدد الألفاظ الدالة عليه في المعاجم: سَلَف، سابق، سالف، متقدِّم. والعلاقة فوقية للمجموعة هي «عَلَاقَة زَمَنِيَّة» مما يؤكد البُعد الزمني للمفهوم."
  blind_candidates:
    - lemma: "سَلَف"
      generation_method: ishtiqaq
      justification: "من الجذر «سلف» الدالّ على التقدُّم والسَّبْق. السَّلَفُ: كلُّ مَنْ تقدَّمك، وهو أصل صحيح في الدلالة على ما مضى وسبق زمنياً"
    - lemma: "سَالِف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «سَلَفَ يَسْلُفُ»، بمعنى المتقدِّم الماضي. قال الجوهري: السالف والسليف: المتقدم"
    - lemma: "مُتَقَدِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «تقدَّمَ»، من الجذر «قدم» الدال على السَّبْق. يُستعمل بمعنى ما جاء قبل غيره زمنياً"
    - lemma: "طَلِيعَة"
      generation_method: majaz
      justification: "أصلها مقدِّمة الجيش التي تُبعث للاستطلاع، ثم توسَّعت مجازياً لتدلّ على أول ما يظهر من الشيء ومقدِّمته"

stage2_evidence:
  per_lemma:
    - lemma: "رَائِد"
      confirm:
        - text: "«الذى يتقدم القوم يبصر لهم مواضع الكلأ, ومساقط الغيث من يقدم - غير مسبوق - على عمل فيمهد الطريق لمن بعده كرائد الفضاء استعاره النابغة للسابق إلى ما يكسب الحمد والثناء»"
          source: "المعجم الكبير"
        - text: "«الرسول مقدمة الشيء؛ وفي الخبر: الحمى رائد الموت أي مقدمته»"
          source: "المعجم الكبير"
        - text: "«رائد، ممهد» = forerunner"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
      expands:
        - text: "«الرَّوْدُ: فِعْلُ الرَّائِدِ. يُقَالُ بَعَثْنَا رَائِدًا يَرُودُ الْكَلَأَ، أَيْ يَنْظُرُ وَيَطْلُبُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر رود يدل على المجيء والذهاب والطلب، فالرائد هو المستكشف المتقدِّم"
    - lemma: "سَابِق"
      confirm:
        - text: "«المتقدّم في الخير»"
          source: "المعجم الوسيط"
        - text: "«من يتقدم في الجري أو الكرم أو غير ذلك»"
          source: "المعجم الكبير"
        - text: "«سابق؛ سالف؛ متقدِّم» = antecedent"
          source: "المورد الحديث"
      expands:
        - text: "«السِّينُ وَالْبَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى التَّقْدِيمِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «سبق» أصل واحد يدل على التقديم والتقدُّم، وهو جوهر المفهوم"
    - lemma: "سَلَف"
      confirm:
        - text: "«كلُّ من تقدَّمك من آبائك وذوي قرابتك في السنِّ أو الفضل»"
          source: "المعجم الوسيط"
        - text: "«الجماعة المتقدمون: يقال لفلان سلف كريم»"
          source: "المعجم الكبير"
        - text: "«السَّلَف: مَن كان يحتلّ سابقًا منصبًا خَلَفَهُ فيه شخص آخر» = predecessor"
          source: "المورد الحديث"
      expands:
        - text: "«السِّينُ وَاللَّامُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى تَقَدُّمٍ وَسَبْقٍ. مِنْ ذَلِكَ السَّلَفُ: الَّذِينَ مَضَوْا. وَالْقَوْمُ السُّلَّافُ: الْمُتَقَدِّمُونَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر سلف أصل صريح في الدلالة على التقدم والسبق"
    - lemma: "سَالِف"
      confirm:
        - text: "«السالِفُ والسليف: المتقدم»"
          source: "الصحاح للجوهري"
        - text: "«الأمم السالفة الماضية أمام الغابرة»"
          source: "كتاب العين"
        - text: "«سابق؛ سالف؛ متقدِّم» = antecedent"
          source: "المورد الحديث"
      contradicts:
        - text: "«السالِفة: ناحية مقدَّم العنق من لدن مُعَلَّق القرطِ إلى قَلْتِ التَرقوةِ»"
          source: "الصحاح للجوهري"
          conflict: "سالفة بالتأنيث لها معنى تشريحي مختلف تماماً، لكن سالف بالتذكير لا إشكال فيه"
    - lemma: "مُتَقَدِّم"
      confirm:
        - text: "«سابق؛ سالف؛ متقدِّم» = antecedent"
          source: "المورد الحديث"
      expands:
        - text: "«الْقَافُ وَالدَّالُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَبْقٍ وَرَعْفٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر قدم يدل على السبق، لكن متقدِّم صفة عامة جداً لا مصطلح مسكوك"
    - lemma: "طَلِيعَة"
      confirm:
        - text: "«من الجيش ونحوه: أول ما يَطْلُع مقدمته»"
          source: "المعجم الوسيط"
        - text: "«طَليعة» = precursor"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية"
      contradicts:
        - text: "«مُقَدِّمَةُ الجَيْشِ. من يُبْعَثُ قُدَّام الجيشِ سِرًّا؛ ليعرفَ أخبارَ العَدُوِّ»"
          source: "المعجم الكبير"
          conflict: "الدلالة الأصلية عسكرية تخصّ الاستطلاع، لا مطلق السَّبْق الزمني"

stage3_analysis:
  per_lemma:
    - lemma: "رَائِد"
      decision: confirmed
      decision_reason: "رائد بمعنى «مقدِّمة الشيء» مُوثَّق في المعاجم الكبرى، وفي الخبر «الحمى رائد الموت»، فيصلح للدلالة على ما يتقدَّم غيره ويمهِّد له. ويضيف بُعد الاستكشاف والتمهيد الذي لا يحمله «سابق»"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على بُعد التمهيد والاستكشاف: الرائد لا يسبق فحسب بل يمهِّد الطريق لمن بعده"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَائِد"
    - lemma: "سَابِق"
      decision: confirmed
      decision_reason: "سَابِق من الجذر «سبق» الدال على التقديم، وقد وُثِّق في المورد الحديث مقابلاً لـ antecedent. يدل على مطلق التقدُّم الزمني وهو جوهر المفهوم"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على مطلق التقدُّم والسَّبْق الزمني دون إيحاء بالتمهيد أو الاستكشاف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَابِق"
    - lemma: "سَلَف"
      source: stage1
      decision: confirmed
      decision_reason: "سَلَف أصل صحيح يدل على التقدم والسبق عند ابن فارس، ويُستعمل اسماً بمعنى مَن مضى وتقدَّم. وقد ورد في المورد الحديث مقابلاً لـ predecessor. يضيف بُعد المُضِيّ والانقضاء الذي لا يحمله سابق ولا رائد"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على بُعد المُضِيّ والانقضاء: السَّلَف ما مضى وانقضى قبل ما يماثله، بخلاف سابق الذي يدل على مطلق التقدُّم"
      actions:
        - command: create_entry
          params: {lemma: "سَلَف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13867120-n"}
    - lemma: "سَالِف"
      source: stage1
      decision: removed
      decision_reason: "سَالِف اسم فاعل من سَلَفَ، ودلالته قريبة جداً من «سَابِق»، ولا يضيف فرقاً دلالياً واضحاً يُبرِّر إدراجه إلى جانبه. كلاهما صفة بمعنى المتقدِّم، فإضافته تكرار"
    - lemma: "مُتَقَدِّم"
      source: stage1
      decision: removed
      decision_reason: "صفة عامة جداً تصلح وصفاً لأي شيء تقدَّم في أي سياق (مكاني أو زمني أو رتبي)، وليست مصطلحاً مسكوكاً يدل على مفهوم السَّبْق الزمني تحديداً. لا تجتاز اختبار السَّكّ"
    - lemma: "طَلِيعَة"
      source: stage1
      decision: removed
      decision_reason: "دلالتها الأصلية عسكرية (مقدِّمة الجيش للاستطلاع)، وتوسُّعها المجازي محدود بالسياقات التي فيها معنى الكشف والظهور. لا تناسب مفهوم السَّبْق الزمني المجرد"

