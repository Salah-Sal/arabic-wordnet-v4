stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي حرفي ومبسط جداً، ولا يغطي الأبعاد النفسية والاجتماعية للمفهوم (مثل الاستقلالية والتميز المتبادل)."
    observations: "المجموعة الترادفية تغطي مفاهيم متقاربة بالإنجليزية (individuality, individualism, individuation) والتي تترجم في العربية إلى 'فردية' أو 'تفرد' أو 'فردانية'. المداخل الحالية دقيقة ولكن تحتاج إلى ضبط وتوسيع لتشمل المذاهب والنزعات المرتبطة."
  blind_candidates:
    - lemma: "فَرْدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'فرد' يدل على صفة الفرد وحالته واستقلاليته."
    - lemma: "تَفَرُّد"
      generation_method: ishtiqaq
      justification: "مصدر يدل على حالة الانفراد والتميز عن الآخرين، وهو مكافئ لمفهوم (individuation)."
    - lemma: "فَرْدَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر يعبر عن المذهب أو النزعة الفردية (individualism) التي تعلي من شأن الفرد."
    - lemma: "ذَاتِيَّة"
      generation_method: ishtiqaq
      justification: "تدل على الخصائص المتعلقة بالذات المستقلة والانطلاق منها."

stage2_evidence:
  per_lemma:
    - lemma: "تَفَرُّد"
      confirm:
        - text: "«(تفرد) بِالْأَمر انْفَرد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«(2) التشخُّص: العملية التي بها يطوِّر الفرد شخصيته الخاصة»"
          source: "المورد الحديث (2008)"
          addition: "يربط التفرد بعملية تطور الشخصية (individuation) والتميز عن الآخرين."
    - lemma: "فَرْدِيَّة"
      confirm:
        - text: "«نُزوع الفرد إلى التحرر من سلطان الجماعة مذهب سياسي يعتدُّ بالفرد ويحد من سلطان الدولة على الأفراد (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«تحديد الهوية وتنمية الصفات الفردية.»"
          source: "مسرد التربية، موقع ArabTerm"
    - lemma: "فَرْدَانِيَّة"
      confirm:
        - text: "«مدرسة فكرية تُفَضل مصالح الفرد وحقوقه على الجماعة، وتمجد الاستقلال الفردي عن باقي المؤسسات الاجتماعية والسياسية، كالعائلة والعشيرة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
    - lemma: "ذَاتِيَّة"
      contradicts:
        - text: "«هي حضور شخصية أو ذات المتكلم في خطابه.»"
          source: "مسرد الإعلام والتواصل، موقع ArabTerm"
          conflict: "المصطلح يدل على الذاتية (subjectivity) أكثر من كونه مرادفاً للفردية (individuality)."

stage3_analysis:
  per_lemma:
    - lemma: "تَفَرُّد"
      decision: confirmed
      decision_reason: "كلمة فصيحة تعبر بدقة عن حالة التميز والانفراد، وتقابل المفهوم بشكل ممتاز (individuation)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَرُّد"

    - lemma: "فَرْدِيَّة"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً ودقة للتعبير عن (individuality) وكذلك المذهب الفردي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَرْدِيَّة"

    - lemma: "فَرْدَانِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معاصر شائع جداً للتعبير عن النزعة الفردية أو المذهب الفردي (individualism)، وهو مناسب جداً كمرادف في هذه المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَرْدَانِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "ذَاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح يعبر عن (subjectivity) ولا يعبر بدقة عن (individuality) التي تركز على الاستقلالية والتميز."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "صفة كون المرء فرداً"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي وركيك بعض الشيء. يحتاج لتعريف أشمل يوضح معنى الخصائص المميزة للفرد أو نزوعه للاستقلال."
    authored:
      - type: terminological
        text: "مجموعة الخصائص والسمات التي تميز الشخص عن غيره وتجعله كياناً مستقلاً، أو النزعة إلى الاعتداد بالفرد وحقوقه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مجموعة الخصائص والسمات التي تميز الشخص عن غيره وتجعله كياناً مستقلاً، أو النزعة إلى الاعتداد بالفرد وحقوقه."}

  examples:
    per_lemma:
      - lemma: "تَفَرُّد"
        examples:
          - text: "سعى الكاتب في أسلوبه الأدبي إلى التفرد والابتعاد عن التقليد."
            type: usage
      - lemma: "فَرْدِيَّة"
        examples:
          - text: "تتسم المجتمعات الحديثة بزيادة النزعة الفردية لدى أفرادها."
            type: usage
      - lemma: "فَرْدَانِيَّة"
        examples:
          - text: "يرى البعض أن الفردانية المفرطة تؤدي إلى تفكك الروابط الأسرية والمجتمعية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تتسم المجتمعات الحديثة بزيادة النزعة الفردية لدى أفرادها."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "سعى الكاتب في أسلوبه الأدبي إلى التفرد والابتعاد عن التقليد."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يرى البعض أن الفردانية المفرطة تؤدي إلى تفكك الروابط الأسرية والمجتمعية."}

