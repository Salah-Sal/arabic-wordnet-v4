# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-92427655-n  |  Concept: Frenchness
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «الطابع الفرنسي» تفتقر إلى التشكيل الكامل"
      - "المركب «الطابع الفرنسي» وصفٌ مركَّب قد لا يجتاز اختبار التثبيت المعجمي بوصفه مصطلحاً مسكوكاً"
      - "المفهوم (Frenchness) غريب نسبياً في السياق العربي ولا يقابله مصطلح أُحادي ذو تداول واسع"
      - "لا يوجد سوى لمّة واحدة لمفهوم يقبل تمثيلاً بأشكال متعددة (مصدر صناعي، مركب إضافي)"
    observations: >-
      المجموعة تمثّل مفهوم «الفرنسية» (Frenchness) بوصفه خاصيَّة جوهريَّة مجرَّدة. الأولى اشتقاقياً
      في العربية للتعبير عن مثل هذه الخصائص المنسوبة إلى أقوام أو أمم هي صيغة المصدر الصناعي
      (فَرَنْسِيَّة، بالقياس على: عربيَّة، إسلاميَّة، إنسانيَّة). ويأتي المركب الإضافي «الطابع الفرنسي»
      في مرتبة ثانية، وهو أكثر دلالةً على السِّمة الحضاريَّة منه على الخاصيَّة الفلسفيَّة المجرَّدة.
      التعريف الحالي «حالة أو شرط كون الشيء فرنسياً» مقبول دلالياً لكنه ترجمة حرفية تحتاج صياغة
      عربية أسلوبية أدقّ.

  blind_candidates:
    - lemma: "فَرَنْسِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من النسبة «فرنسيّ» بإلحاق ياء النسبة الثقيلة (-يَّة)، على القياس المطَّرد في
        بناء الخصائص المجرَّدة من النِّسَب (كالعربيَّة والإسلاميَّة والإنسانيَّة). يدلّ مباشرةً
        على خاصيَّة كون الشيء فرنسياً، وهو أقرب صيغة اشتقاقية للمفهوم المطلوب.
    - lemma: "فَرَنْجِيَّة"
      generation_method: majaz
      justification: >-
        إحياء للفظ العربي التراثي «الفرنج» الذي استخدمه العرب القدامى للدلالة على شعوب أوروبا
        الغربية ولا سيَّما الفرنسيين، بإلحاق ياء النسبة الثقيلة للدلالة على الخاصيَّة المجرَّدة.
        يتجنَّب الاشتراك مع «الفرنسية» الدالَّة على اللغة.
    - lemma: "الطَّابَع الفَرَنْسِيّ"
      generation_method: tarkib
      justification: >-
        مركب إضافي: الطابع (= السِّمة والخاصيَّة الجوهريَّة) + الفرنسيّ (نسبة). يعبِّر عن المفهوم
        من زاوية السِّمة المميِّزة لكلِّ ما هو فرنسيّ. متداول في الكتابة العربية المعاصرة للدلالة
        على الهُوِيَّة الفرنسيَّة الحضاريَّة.
    - lemma: "الهُوِيَّة الفَرَنْسِيَّة"
      generation_method: tarkib
      justification: >-
        مركب وصفي: الهُوِيَّة (= جوهر الانتماء والتعريف الذاتيّ) + الفرنسيَّة (نسبة). يُعبِّر عن
        مجموع ما يُشكِّل الانتماء الفرنسيَّ ويميِّزه، غير أنه قد يكون أوسع دلالةً من المطلوب.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "الطَّابَع الفَرَنْسِيّ"
      expands:
        - text: >-
            «(طَبَعَ) الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ مَثَلٌ عَلَى
            نِهَايَةٍ يَنْتَهِي إِلَيْهَا الشَّيْءُ حَتَّى يُخْتَمَ عِنْدَهَا. ثُمَّ يُقَالُ
            عَلَى هَذَا: طَبْعُ الْإِنْسَانِ وَسَجِيَّتُهُ. وَالطَّابَعُ: الْخَاتَمُ يُخْتَمُ بِهِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            يُثبت أن «الطابع» يدلّ في أصله اللغوي على السَّجِيَّة الأصيلة والخاصيَّة الجوهريَّة
            المميِّزة للشيء، مما يدعم استخدامه في المركب للدلالة على الخاصيَّة الجوهريَّة
            لكون الشيء فرنسياً
        - text: "«(1) مصطلح أو تعبير فرنسيّ [مُسْتخدم في لغة أُخرى] (2) سِمة فرنسية.»"
          source: "المورد الحديث (2008)"
          addition: >-
            يُظهر أن العربية المعاصرة تستخدم «سِمة فرنسية» مرادفاً للطابع الفرنسي،
            مما يدعم شيوع هذا النمط المركَّب للتعبير عن الخاصيَّة الفرنسيَّة

    - lemma: "فَرَنْسِيَّة"
      confirm:
        - text: >-
            «أَتْقَنَ اللغة الفَرَنْسِيَّة [فصيحة] — التعليق: الكلمة منسوبة إلى «فرنسا»
            بفتح الفاء لا كسرها.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: >-
            «فِرِنْسِيَّة — مثال: أَتْقَنَ اللغة الفِرِنْسِيَّة — الرأي: مرفوضة عند بعضهم —
            السبب: لكسر الفاء فيها عند النسب.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: >-
            سياق المعجم خاصٌّ بـ«اللغة الفرنسية» (اسم اللغة) لا بخاصيَّة كون الشيء فرنسياً
            (Frenchness) — مما يعني أن الشواهد المعجميَّة المتاحة توثّق «فرنسية» أساساً
            بمعنى اللغة لا الخاصيَّة المجرَّدة

    - lemma: "فَرَنْجِيَّة"
      contradicts:
        - text: "«فرنجية: فرنجية أو إفرنجية: نوع من الآلات الحربية. (مونج ص136، 137).»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          conflict: >-
            اللفظ في المعجم مخصَّص للدلالة على آلة حربية بعينها، لا صلة له بالخاصيَّة
            المجرَّدة لكون الشيء فرنسياً. استخدامه في هذا السياق يُحدث لبساً دلالياً

    - lemma: "الهُوِيَّة الفَرَنْسِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "الطابع الفرنسي"
      decision: confirmed
      decision_reason: >-
        المركب الإضافي «الطابع الفرنسي» متداول في الكتابة العربية المعاصرة للدلالة على مجموع
        السمات المميِّزة لكلِّ ما هو فرنسيّ. وجذر «طبع» في مقاييس اللغة يربط «الطابع» بالسَّجِيَّة
        الجوهريَّة، مما يدعم الاستخدام دلالياً. يجتاز اختبار التثبيت المعجمي بوصفه مركَّباً
        إضافياً ثابتاً في الاستخدام الحديث. يحتاج تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُبرز الجانب الثقافيَّ والأسلوبيَّ المميِّز (السِّمة الحضاريَّة) لكون الشيء فرنسياً؛
        أكثر استخداماً في السياقات التي تصف الروح الفرنسيَّة والهُوِيَّة الجماليَّة والحضاريَّة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطَّابَع الفَرَنْسِيّ"

    - lemma: "فَرَنْسِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        المصدر الصناعي من «فرنسيّ» هو الصيغة الاشتقاقية القياسيَّة لبناء الخصائص المجرَّدة في
        العربية (على وزن: إنسانيَّة، عربيَّة، إسلاميَّة). معجم الصواب يُثبت صواب الضبط فَرَنْسِيَّة
        (بفتح الفاء). وإن كانت الشواهد المعجميَّة المتاحة توثِّقها أساساً بمعنى اللغة الفرنسية،
        فإن الصيغة ذاتها تحمل المفهوم المجرَّد في السياق الدلاليّ الصحيح لـ AWN4، وسياق
        المجموعة الترادفيَّة يُزيل الالتباس مع معنى اللغة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُشير إلى الخاصيَّة المجرَّدة الشاملة لكون الشيء فرنسياً بأصله أو انتمائه؛ أكثر
        تجريداً وحياداً من «الطابع الفرنسي»، وأنسب للسياقات الأكاديميَّة والفلسفيَّة
      actions:
        - command: create_entry
          params: {lemma: "فَرَنْسِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "فَرَنْجِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        اللفظ في المعجم التراثي مخصَّص للدلالة على نوع من الآلات الحربية، ولا شاهد على
        استخدامه للدلالة على الخاصيَّة المجرَّدة لكون الشيء فرنسياً. إضافته تُحدث لبساً
        دلالياً غير مقبول في السياق المعجميّ.

    - lemma: "الهُوِيَّة الفَرَنْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        المركب أوسع دلالةً من المطلوب — «الهُوِيَّة الفرنسيَّة» تشمل الانتماء الثقافيَّ
        والحضاريَّ والقوميَّ بمجموعه، وليس فقط خاصيَّة كون الشيء فرنسياً. لا يجتاز اختبار
        الاستبدال: يمكن استبدال «فرنسيَّة» بـ«وطنيَّة» أو «قوميَّة» وتبقى الجملة وصفاً
        صحيحاً لمفهوم مختلف، مما يكشف أنه عبارة وصفية لا مصطلح مسكوك.


