    - lemma: "تَعَيُّن"
      source: stage1
      decision: removed
      decision_reason: >
        تَعَيُّن يعبّر عن "التشخّص والتحديد" (individuation/determination) — أي الفعل
        أو الحالة الناتجة عن تعيين شيء ما — وهو مفهوم أخص وأكثر فلسفية من "particularity"
        بوصفها صفة عامة لما يتعلق بحالة محددة. يحمل كذلك حمولة صوفية وكلامية تُبعده عن
        الاستعمال المعجمي المقصود. كما أن الاستعمال العامّي لـ"تعيّن" (لزمه بعينه) مختلف.
      evidence_assessment:
        case: mixed

    - lemma: "تَخَصُّص"
      source: stage1
      decision: removed
      decision_reason: >
        تَخَصُّص يفيد "الاختصاص والتفرّد في مجال" (specialization)، وهو مغاير لـ"particularity"
        التي تعني الصفة المجردة لكون الشيء خاصًّا بحالة ما. ترجمات arabterm المتعددة تؤكد
        أن المصطلح ثابت الدلالة على specialization لا particularity.
      evidence_assessment:
        case: contradicts_only

    - lemma: "إِفْرَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        إِفْرَادِيَّة مصطلح لساني تقني لـ"Singularity" النحوية (الإفراد العددي مقابل التثنية
        والجمع)، بعيد كليًّا عن مفهوم "particularity" الذي يصف الخصوصية المعرفية والمنطقية.
      evidence_assessment:
        case: contradicts_only


