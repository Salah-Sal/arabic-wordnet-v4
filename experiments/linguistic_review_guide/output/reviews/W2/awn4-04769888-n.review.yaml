stage3_analysis:
  per_lemma:

    # ── اللمة الموجودة ──────────────────────────────────────
    - lemma: "خُصُوصِيَّة"
      decision: confirmed
      decision_reason: >
        اللمة موثَّقة في أمهات المعاجم (الوسيط، الكبير، كشاف اصطلاحات التهانوي،
        المورد الحديث) بمعنى "particularity / كون الشيء خاصاً لا عاماً"، وهو المعنى
        الدقيق للمجموعة. الجذر خصص مؤصَّل في مقاييس ابن فارس على دلالة الإفراد والتمييز.
        ضبط الضم (خُصُوصِيَّة) هو المستعمَل الغالب وإن كان الفتح أقيس صرفيًّا. الاشتراك
        مع دلالة "privacy" مشكلة سياقية لا تستوجب الإزالة بل يُعالَج بالتعريف الواضح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمة الوحيدة في المجموعة؛ تحمل معنى "الخصوصية المنطقية" — صفة انتساب الشيء
        إلى حالة بعينها دون التعميم — وتتمايز استعمالاً عن الدلالة الحقوقية الحديثة
        "privacy" التي شاعت في الخطاب الرقمي والقانوني وإن اشتركت معها في المبنى.
        خَصُوصِيَّة (بالفتح) أقيس صرفيًّا بحسب ابن فارس، لكن خُصُوصِيَّة (بالضم) هو
        الضبط المعجمي المعتمَد.
      quality_gates:
        ittiraad: "مطّرد — تشيع خصوصية في النصوص العلمية والفلسفية والقانونية العربية"
        yusr: "ميسور — مقطعان مألوفان، سهل النطق والإدراج في السياق"
        mulaama: "ملائم — الجذر خصص يؤدي المعنى مباشرة وبلا قلق ثقافي"
        turath: "تراثي — موثَّق في الكشاف والمقاييس وكتب التعريفات الكلاسيكية"
        arabi: "عربي أصيل — اشتقاق من جذر ثلاثي عربي خالص"
        ishtiqaqiyya: "اشتقاقي — يقبل الاشتقاق والنسبة والجمع (خصوصيات)"
      # التشكيل الكامل موجود في synset_info — لا يلزم update_lemma

    # ── مرشحات المرحلة ١ (جميعها مرفوضة) ──────────────────
    - lemma: "جُزْئِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق "الجزئي = particular" في المنطق الكلاسيكي، فإن "الجزئية" في المعاجم الحديثة
        تُفيد أساسًا "partial/fractional" (الكسور الجزئية، الحركة الجزئية)، مما يُولّد
        اشتراكًا لفظيًّا مُربكًا. فضلًا عن ذلك، المفهوم المنطقي للجزئية أضيق من "particularity"
        بوصفه صفة عامة؛ إذ هو مصطلح تقني للقضايا والمفاهيم المنطقية دون سواها.
      evidence_assessment:
