# المرحلة ٢: جمع الأدلة
# ══════════════════════════════════════════════════════
stage2_evidence:

  # ── الاستعلامات المُنفَّذة ──────────────────────────────────
  # Q1 — مطابقة دفعية لجميع اللمات (الموجودة + المرشحات):
  #   headword_norm IN ('خصوصية','الخصوصية','جزئية','الجزئية',
  #                     'تعين','التعين','تخصص','التخصص','افرادية','الافرادية')
  # Q2 — الجسر الإنجليزي: translation_en:"particularity" OR "specialness"
  #       OR "specificity" OR "particular"
  # Q3 — إثراء (تعريفات + أمثلة) بالـ entry_id للمداخل الرئيسية
  # Q4 — مقاييس اللغة لابن فارس (dictionary_id=151) لجذر خص/خصص
  # المجموع: 4 استعلامات

  per_lemma:

    # ── اللمة الموجودة ──────────────────────────────────────
    - lemma: "خُصُوصِيَّة"
      confirm:
        - text: >
            «وَمِنَ الْبَابِ خَصَصْتُ فُلَانًا بِشَيْءٍ خَصُوصِيَّةً، بِفَتْحِ الْخَاءِ،
            وَهُوَ الْقِيَاسُ لِأَنَّهُ إِذَا أُفْرِدَ وَاحِدٌ فَقَدْ أَوْقَعَ فُرْجَةً
            بَيْنَهُ وَبَيْنَ غَيْرِهِ، وَالْعُمُومُ بِخِلَافِ ذَلِكَ. وَالْخِصِّيصَى:
            الْخَصُوصِيَّةُ.»
          source: "مقاييس اللغة لابن فارس (القرن الرابع الهجري)"
        - text: >
            «الخصوصية: [في الانكليزية] Particularity [في الفرنسية] Particularité
            بالفتح أفصح وحينئذ تكون صفة وإلحاق الياء المصدرية لكون المعنى على المصدرية
            والتاء للمبالغة. وإذا ضمّ يحتاج إلى أن يجعل المصدر بمعنى الصفة أو الياء
            للنسبة والتاء للمبالغة كذا في كليات أبي البقاء.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777م)"
        - text: "«حالة الخصوص / خصوصيَّة الشيء: خاصيتُه»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«خُصُوصِيَّةُ الشيءِ: خاصِيَّتُه، أو ما يَتَمَيَّزُ به دُونَ غيرِه»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «(2) الخصوصيّة: كون الشيء خاصًّا لا عامًّا»
          source: "المورد الحديث (2008) — ترجمة: particularity"
      contradicts:
        - text: "«خصوصية: privacy» [مجال: القانون]"
          source: "المعجم الموحد لمصطلحات القانون (arabterm، 2017)"
          conflict: >
            ربط المصطلح بمعنى "privacy" (الخصوصية الحقوقية والرقمية) يطغى على دلالة
            "particularity" (الخصوصية المنطقية) في الاستعمال التقني الحديث.
        - text: "«خصوصية: privacy» [مجال: تقانة المعلومات]"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (arabterm، 2011)"
          conflict: >
            نفس إشكالية الاشتراك اللفظي: الدلالة التقنية لـ privacy تنافس الدلالة
            المنطقية لـ particularity.
      expands:
        - text: >
            «الخصوصية: المشهور فيها الضم لكن إذا فُتحت العين علمت أن الفتح أفصح
            لأن الخصوص بالضم مصدر وبالفتح صفة كذلول، فإذا كان مصدرًا يكون إلحاق
            الياء والتاء لغوًا... بخلاف ما إذا كان صفة لأن المعنى لما كان على
            المصدرية أُلحق الياء المصدرية والتاء للمبالغة كما في علامة.»
          source: "دستور العلماء للأحمدنكري (ت. القرن 18م)"
          addition: >
            يكشف النص عن التوجيه الصرفي الدقيق: خَصُوصِيَّة (بالفتح) أصوب قياسًا
            لكن خُصُوصِيَّة (بالضم) هو المستعمل. كلا الضبطين واردان في المصادر.

    # ── مرشحات المرحلة ١ ──────────────────────────────────
    - lemma: "جُزْئِيَّة"
      source: stage1
      confirm:
        - text: >
            «الجزئية: [في الانكليزية] Particular, individual [في الفرنسية] Particulier,
            individuel... كون المفهوم بحيث يمنع نفس تصوّره من وقوع الشركة في ذلك المفهوم
            ويسمّى ذلك المفهوم جزئيًا حقيقيًا... والجزئي الإضافي: كون المفهوم مندرجًا تحت
            كلّي.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777م)"
      contradicts:
        - text: >
            «الجُزْئِيَّة: الحركةُ الجُزْئِيَّة (في علم الأحياء): حركة جزء من حيٍّ متعدد.
            الكسور الجُزْئِيَّة لكسرٍ ما: أبسطُ كسور حاصل جمعها يساوي الكسر الأصلي.
            الصيغةُ الجُزْئِيَّة (في الكيمياء): الصيغة التي تدل على عدد ذرات كل عنصر.»
          source: "المعجم الوسيط / المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            في الاستعمال المعياري الحديث، "الجزئية" تحمل أساسًا معنى "partial/fractional"
            (جزئي/كسري) لا "particular" (خاص/متميز)، مما يُنشئ اشتراكًا لفظيًا مُربكًا.
        - text: "«قضية جزئية: particular proposition» [مجال: الفلسفة وعلم النفس]"
          source: "مسرد الفلسفة وعلم النفس (arabterm)"
          conflict: >
            الاستعمال التقني لـ"جزئي" محصور في الخطاب المنطقي (القضية الجزئية مقابل الكلية)
            وليس مصطلحًا عامًا لوصف الصفة المعروفة بـ particularity كمفهوم مستقل.

    - lemma: "تَعَيُّن"
      source: stage1
      confirm:
        - text: "«التعين: ما به امتياز الشيء عن غيره، بحيث لا يشاركه فيه غيره.»"
          source: "كتاب التعريفات للجرجاني (ت. 1413م)"
        - text: "«التعيُّن: ما به امتاز الشيءُ عن غيره بحيث لا يشاركه غيره.»"
          source: "التعريفات الفقهية للبركتي (ت. 1975م)"
      contradicts:
        - text: >
            «التعيُّن: [في الإنجليزية] Determination, specification... هو التشخُّص.
            والتعيُّن الأوّل عند الصوفية: مرتبة الوحدة. والتعيُّن الثاني: مرتبة الواحدية.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777م)"
          conflict: >
            تَعَيُّن يعبّر عن "التشخّص والتحديد" (determination/individuation) — أي الفعل
            أو الحالة الناتجة عن تعيين شيء ما — لا عن الصفة المجردة "particularity" كخاصية
            دائمة للشيء. كما أن المفهوم ذو حمولة صوفية وكلامية تبعده عن الاستعمال العام.
        - text: >
            «(تعين) الرجل استلف سلفًا... وعليه الشيء لزمه بعينه...»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: >
            الاستعمال العام لـ"تعيّن" في المعجمية الحديثة يرتبط بالإلزام (لزمه بعينه)
            والمادية (استلف، رأى عيانًا)، بعيدًا عن الدلالة الاصطلاحية الفلسفية.

    - lemma: "تَخَصُّص"
      source: stage1
      contradicts:
        - text: >
            «تخصَّص الشيءُ: انفرد وصار خاصًّا (مطاوع خصَّصه). تخصَّص في كذا:
            تفرَّد فيه وقصر عليه بحثه وجهده.»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            تَخَصُّص يفيد الفعل والعملية (specialization) — أي اكتساب الشيء لطابع خاص
            أو تفرّد الشخص بمجال — وليس الصفة المجردة "particularity". ترجماته في arabterm
            كلها: specialization / specialism.
        - text: "«تخصص: specialization» [مجالات: التعليم، القانون، التجارة]"
          source: "معاجم arabterm المتعددة"
          conflict: "الترجمة المعيارية الثابتة هي specialization، لا particularity."

    - lemma: "إِفْرَادِيَّة"
      source: stage1
      contradicts:
        - text: >
            «إفرادية: سمة مميزة في مقولة العدد تشير إلى تمثيل وحدة قابلة للعزل.
            [Singularity]»
          source: "المعجم الموحد لمصطلحات اللسانيات، arabterm (2002)"
          conflict: >
            إِفْرَادِيَّة مصطلح نحوي-لساني يعني "الإفراد العددي" (مقابل التثنية والجمع)،
            بمعنى كون الاسم دالاً على واحد. وهذا بعيد تمامًا عن مفهوم particularity
            الذي يعني الخصوصية المنطقية للحالة المحددة.


