# المرحلة ١: المراجعة والتوليد (التوليد الأعمى أولاً)
# ══════════════════════════════════════════════════════
stage1_review:

  # أ. التوليد الأعمى من الملف المُقنَّع (قبل الاطلاع على اللمات الموجودة)
  # المدخل: definition_ar = "صفة كون الشيء خاصاً ومتعلقاً بحالة أو مثال محدد"
  # المفهوم الجوهري: "particularity" — الصفة المنطقية لانتساب الشيء إلى حالة بعينها لا إلى العموم.

  blind_candidates:
    - lemma: "جُزْئِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر "جزأ/جزء" بالمصدر الصناعي (فُعْلِيَّة). في المنطق العربي الكلاسيكي، "الجزئي"
        هو ما يُقابل "الكلي"، أي ما تعلَّق بحالة محددة أو فرد بعينه دون التعميم.
        وزن المصدر الصناعي مناسب للمفاهيم الفلسفية المجردة.

    - lemma: "تَعَيُّن"
      generation_method: ishtiqaq
      justification: >
        من جذر "عين" على وزن تَفَعُّل. يفيد كون الشيء مُتعيِّناً بذاته لا يشاركه فيه غيره.
        ورد هذا المصطلح في كتب التعريفات الفلسفية والكلامية بمعنى التشخّص والانفراد
        بالحالة المحددة، وهو قريب من مفهوم "الخصوصية المنطقية".

    - lemma: "تَخَصُّص"
      generation_method: ishtiqaq
      justification: >
        من جذر "خصص" على وزن تَفَعُّل (المصدر الخُماسي). يفيد انفراد الشيء بحالة أو صفة
        محددة دون أن يشاركه غيره. مطاوع "خصَّصه"، وهو يعبّر عن صيرورة الشيء خاصاً بحالة
        بعينها، مما يلاءم مفهوم "كون الشيء متعلقاً بمثال محدد".

    - lemma: "إِفْرَادِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر "فرد" بالمصدر الصناعي (إِفْعَالِيَّة). تفيد صفة ارتباط الشيء بفرد واحد أو
        حالة منفردة دون سائر الحالات، في مقابل الجمعية والعمومية. الوزن الصناعي ينتج
        مفهومًا مجردًا مناسبًا للصفات الوصفية.

  # ب. التقييم الأوّلي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        اشتراك لفظي ظاهر: "خُصُوصِيَّة" في الاستعمال المعاصر تطغى عليها
        دلالة "privacy" (الخصوصية الحقوقية والتقنية)، مما يُضعف وضوحها الدلالي
        في مجال particularity / specialness.
      - >
        التعريف الحالي يستخدم لفظة "خاصاً" المشتقة من الجذر ذاته (خصص)،
        مما يُوقعه في شبه دوران معجمي.
      - >
        المجموعة تضم لمةً واحدة فقط (خُصُوصِيَّة)؛ مما يحدّ من قدرة الشبكة
        على تمثيل الفروق الدقيقة بين المعنيين الإنجليزيَّين particularity وspecialness.

    observations: >
      المجموعة تعبّر عن المفهوم المنطقي-الفلسفي لـ"الخصوصية الجزئية"، أي صفة انتساب الشيء
      إلى حالة بعينها في مقابل الشمول والعموم. هذا المفهوم موجود في التراث العربي في المنطق
      والكلام والفقه (خصوصية الحكم، خصوصية الدليل...). لفظة "خُصُوصِيَّة" بمعنى Particularity
      موثَّقة في كشاف اصطلاحات التهانوي بنص صريح يقابلها بالفرنسية والإنجليزية، وفي المورد
      الحديث بالتعريف: "كون الشيء خاصاً لا عاماً"، وهي مذكورة في المعجم الوسيط والكبير.
      أما في مقاييس ابن فارس فالجذر يدل على "الفُرجة والثُّلمة" — أي الإفراد والتمييز —
      وهو تأصيل دلالي دقيق للمفهوم المقصود.


