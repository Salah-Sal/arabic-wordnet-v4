          الكِيمِيَائِيَّة التي تُبَدِّلُ تَرْكِيبَهَا الجُزَيْئِيَّ وَتُغَيِّرُ
          هُوِيَّتَهَا، كَالقَابِلِيَّةِ لِلاحْتِرَاقِ وَالتَّأَكْسُدِ
          وَالتَّفَاعُلِ مَعَ الأَحْمَاضِ وَالقَوَاعِد
