# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
# قُرئ الملف المُقنَّع أولاً (بلا لمّات) → وُلِّدت ٤ مرشحات من التعريف وحده
# ثم قُرئ الملف الكامل → التقييم الأولي أدناه
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'خاصية كيميائية' مكتوبة بلا تشكيل كامل في بيانات المجموعة"
      - "التعريف الحالي ترجمة حرفية مباشرة من الإنجليزية ولا يتّبع أسلوب المعجم الوسيط"
      - "المجموعة تحتوي على لمّة واحدة فقط؛ يستحسن التحقّق مما إذا كانت بدائل مستعملة غائبة"
    observations: >
      المجموعة تمثّل مفهوماً كيميائياً دقيقاً يُعبَّر عنه بمركّب وصفي (خاصية + كيميائية)،
      وهو النمط السائد في المعجمية العلمية العربية الحديثة. المصطلح راسخ في المعاجم
      العلمية الموحّدة (ALECSO). الفارق الجوهري بين الخاصية الكيميائية والخاصية الفيزيائية
      هو أن الأولى تنطوي على تحوّل في الهوية الجزيئية للمادة (كالاحتراق والأكسدة)
      بينما الثانية تظهر دون تغيير التركيب الكيميائي. الخاصية الكيميائية تقع ضمن الفئة
      الأعلى "الخاصية الجوهرية" (awn4-04923519-n) تبعاً لتسلسل الاشتمال في WordNet.
  blind_candidates:
    - lemma: "الخَاصِّيَّةُ التَّفَاعُلِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي (إضافي في الشكل الاصطلاحي: خاصية تفاعلية) من "الخاصية" + نسبة إلى
        "التفاعل" (فَعَّال → تَفَاعُل → تَفَاعُلِيّ). يُبرز الجانب المحوري في التعريف
        وهو كون هذه الخاصية تتجلّى في التفاعلات الكيميائية، لكنه لا يُصرّح بالكيميائية.
    - lemma: "السِّمَةُ الكِيمِيَائِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي من "السِّمَة" (العلامة والصفة الدالّة) + "الكيميائية". "سِمَة"
        بمعنى الخصيصة والعلامة المميّزة تُستخدم في المعجمية العلمية العربية بديلاً
        عن "خاصية" في بعض السياقات التقنية.
    - lemma: "الطَّبِيعَةُ التَّحَوُّلِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي يجمع "الطبيعة" (بمعنى السجية والخاصية الذاتية) مع "التحوّلية"
        (نسبة إلى التحوّل — تَفَعُّل من حَوَّلَ). يُبرز وصف التعريف بأن الخاصية
        "تُغيِّر هوية المادة" أي تُحدث تحوّلاً جذرياً.
    - lemma: "الصِّفَةُ الكِيمِيَائِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي من "الصِّفَة" (ما يتّصف به الشيء ويميّزه) + "الكيميائية". "صفة"
        في المعجمية العلمية تُوازي "property" وتُستخدم في الترجمات التقنية الرسمية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١) مطابقة دفعية: خاصية كيميائية + المرشحات الأربع (مع ال- وبدونها)
#   ٢) الجسر الإنجليزي: translation_en:"chemical property"
#   ٣) FTS عربي: "خاصية" OR "كيميائية" OR "تفاعل كيميائي" OR "هوية المادة"
#   ٤) مقاييس اللغة: جذور خص، طبع (dictionary_id = 151)
stage2_evidence:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "خاصية كيميائية"
      confirm:
        - text: "«خاصية كيميائية — chemical property — Chemistry»"
          source: "المعجم الموحد لمصطلحات الكيمياء، ALECSO (1992)"
        - text: "«خصائص كيميائية للماء — chemical properties of water — Renewable Energy»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة، ALECSO (1996)"
        - text: "«خاصية فيزيائية — physical property — Chemistry»"
          source: "المعجم الموحد لمصطلحات الكيمياء، ALECSO (1992)"
          # (مدخل مجاور يُثبت قبول النمط: خاصية + نسبة في سياق التمييز الكيميائي)
      expands:
        - text: "«خاصية — property — Mathematics and Astronomy»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك، ALECSO (1990)"
          addition: "تُثبت أن 'خاصية' مصطلح معجمي متداول في حقول علمية متعددة"
        - text: "«خاصية — property — Geology»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا، ALECSO (2000)"
          addition: "تثبيت الاستخدام المتعدد الحقول"
        - text: "«خاصية — property — Physics»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية، ALECSO (1989)"
          addition: "تثبيت الاستخدام في الفيزياء أيضاً"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "الخَاصِّيَّةُ التَّفَاعُلِيَّة"
      evidence_status: "no_material_found"

    - lemma: "السِّمَةُ الكِيمِيَائِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الطَّبِيعَةُ التَّحَوُّلِيَّة"
      evidence_status: "no_material_found"
      # ملاحظة: وُجد في DB مدخل "طبيعة كيميائية" = "chemical nature" وهو
      # مفهوم مختلف (أوسع) من "chemical property"؛ لذا لا يُعدّ دليلاً

    - lemma: "الصِّفَةُ الكِيمِيَائِيَّة"
      evidence_status: "no_material_found"

  # ── أدلة ذات صلة من البحث العربي ──
  contextual_finds:
    - entry: "طبيعة كيميائية"
      translation_en: "chemical nature"
      definition: >
        «استعداد أو قابلية المادة لتحول كيماوي تحت تأثير عوامل فيزيائية (الحرارة مثلاً)،
        أو قدرة المادة على التفاعل مع مواد أخرى لإنتاج مواد جديدة.»
      source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، ALECSO"
      note: >
        "chemical nature" أعمّ من "chemical property"؛ الأول يصف الطابع الكيميائي
        العام للمادة، والثاني خاصية محددة قابلة للقياس.


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "خاصية كيميائية"
      decision: confirmed
      decision_reason: >
        اللمّة مُسجَّلة في المعجم الموحد لمصطلحات الكيمياء (ALECSO 1992) بالمقابل
        الإنجليزي الدقيق "chemical property"، وهي المصطلح المعياري في الكيمياء العربية.
        المركّب الوصفي (خاصية + كيميائية) يتّبع نمطاً إضافياً واسع الاستخدام في
        المصطلحية العلمية العربية (خاصية فيزيائية، خاصية تركيزية، خاصية مقدارية...).
        لا تناقضات في الأدلة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      borrowing_check:
        lexical: "خاصية عربية أصيلة من جذر خص؛ كيميائية نسبة إلى كيمياء (معرَّب مقبول)"
        calque: "التركيب المصطلحي يوازي chemical + property وهو هيكل واضح ومقبول"
      morphological_fit: >
        وزن "فاعِلِيَّة" (خاصية) مناسب للمفاهيم المجردة الدالة على صفة جوهرية.
        النسبة بـ-ية (كيميائية) مسلوكة في التعريب العلمي.
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُركّز على كون الخاصية مرتبطة بالتفاعلات
        الكيميائية (أي التحوّل في الهوية الجزيئية) مما يميّزها عن الخاصية الفيزيائية
        (awn4-05016480-n) التي لا تغيّر التركيب الكيميائي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاصِّيَّة كِيمِيَائِيَّة"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "الخَاصِّيَّةُ التَّفَاعُلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود لهذا التعبير في المعاجم المستعلَمة، ولا يُضيف قيمة فوق اللمّة
        الموجودة بل يُسقط الصفة الكيميائية الصريحة. اختبار الاستبدال: يمكن
        إبدال "تفاعلية" بـ"كيميائية" دون تغيير الدلالة الجوهرية مما يثبت أنه
        ليس مصطلحاً متميّزاً.

    - lemma: "السِّمَةُ الكِيمِيَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        "سمة" غير مسجّلة في المعاجم الكيميائية بديلاً عن "خاصية". اختبار
        التثبيت المعجمي: لا يوجد تعبير اصطلاحي ثابت. "خاصية" هي المصطلح
        المعياري المعتمد دون منازع في هذا الحقل.

    - lemma: "الطَّبِيعَةُ التَّحَوُّلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير الأقرب المسجَّل في DB هو "طبيعة كيميائية" = "chemical nature" وهو
        مفهوم مختلف. "الطبيعة التحولية" غير مسجّل كمصطلح ثابت، وقد يُحدث لبساً
        مع "chemical nature". المصطلح المعياري هو "خاصية كيميائية".

    - lemma: "الصِّفَةُ الكِيمِيَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        "صفة" أعمّ وأقل تخصصاً من "خاصية" في السياق العلمي. لا توثيق معجمي
        لاستخدام "الصفة الكيميائية" مصطلحاً كيميائياً رسمياً. "خاصية" هو الأنسب
        بحكم الاطّراد والشيوع في المعاجم الموحّدة.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "خاصية تستخدم لتوصيف المواد في التفاعلات التي تغير هويتها"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية (a property used to characterize
        materials in reactions that change their identity). لا يتبع أسلوب المعجم
        الوسيط في بناء الجنس القريب والفصل النوعي. كذلك لا يُشير صراحةً إلى
        الطبيعة الكيميائية للتفاعلات، ولا يُعطي مثالاً تقريبياً يُوضح المفهوم.
