  per_entry:
    - lemma: "مُتْلِف"
      entry_id: "{auto}"
      root: "تلف"
      maqayis_quote: "«التاء واللام والفاء أصلٌ واحد يدلُّ على هَلاك الشَّيء... يُقال: تَلِف الشَّيءُ يَتْلَفُ تَلَفاً، وهو تالِفٌ.»"
    - lemma: "مُضْعِف"
