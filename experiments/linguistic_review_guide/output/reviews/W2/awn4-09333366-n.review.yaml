      sense_id: "{auto}"
      nuance: "يركز على إحداث الضرر الشديد أو إهلاك الشيء وإفنائه."
      mwe: false
    - lemma: "مُضْعِف"
      sense_id: "{auto}"
      nuance: "يركز على سلب القوة أو تقليل الفعالية دون تدمير الشيء كلياً."
      mwe: false
    - lemma: "مُفْسِد"
      sense_id: "{auto}"
      nuance: "يركز على إحداث الخلل وإخراج الشيء عن حالة الصلاح والاستقامة."
      mwe: false
    - lemma: "آفَة"
      sense_id: "{auto}"
      nuance: "تطلق غالباً على العوامل الطبيعية أو الأمراض والظواهر التي تسبب التلف أو الضعف، وتستخدم مجازاً للأسباب المعنوية كالأخلاق السيئة."
      mwe: false
