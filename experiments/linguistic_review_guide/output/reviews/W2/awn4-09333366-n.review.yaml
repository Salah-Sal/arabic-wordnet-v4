      root: "ضعف"
      maqayis_quote: "«الضاد والعين والفاء أصلٌ يدلُّ على خِلاف القُوّة... يُقال ضَعُف يضْعُف ضَعْفاً وضُعْفاً.»"
    - lemma: "مُفْسِد"
      entry_id: "{auto}"
      root: "فسد"
      maqayis_quote: "«الفاء والسين والدال كلمةٌ واحدة، فسَد الشَّيءُ يفسُد فساداً، وفَسُد أيضاً، والصَّلاح خِلافُه.»"
    - lemma: "آفَة"
      entry_id: "{auto}"
      root: "أوف"
      maqayis_quote: "«الهمزة والواو والفاء أصلٌ واحد، يدلُّ على عَرَضٍ يدخل في الشّيءِ فيُفْسدُه.»"
    - lemma: "مُضِرّ"
      entry_id: "{auto}"
      root: "ضرر"
      maqayis_quote: "«الضاد والراء أصلٌ واحد يدلُّ على خِلاف النَّفع... والضَّرَرُ: النُّقْصان يدخُل في الشَّيء.»"

  per_sense:
