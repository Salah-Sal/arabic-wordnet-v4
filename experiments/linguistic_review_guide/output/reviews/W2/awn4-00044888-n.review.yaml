    authored:
      - type: terminological
        text: "تَحويلُ مَشروعٍ أو خُطَّةٍ أو قَرارٍ إلى حَيِّزِ الوُجودِ العَمَليِّ بِاستِخدامِ الوَسائِلِ المُلائِمةِ."
