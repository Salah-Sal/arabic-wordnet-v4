# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-00044888-n — التنفيذ والتطبيق
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي فيه نوع من الدوران اللغوي (استخدام لفظ التنفيذ لتعريف التنفيذ)."
    observations: "المجموعة تغطي مفهوم 'التنفيذ' كعملية إجرائية لتحويل الخطط إلى واقع. اللمّات الحالية (تطبيق، تفعيل، تنفيذ) دقيقة وشائعة، لكن يمكن إثراؤها بمرادفات أكثر تخصصاً في السياقات القانونية والإدارية."
  blind_candidates:
    - lemma: "تَجْسِيد"
      generation_method: majaz
      justification: "استعارة من الجسد، بمعنى جعل المفهوم المجرد (الخطة) ذا جسد أو كيان ملموس."
    - lemma: "إِنْفَاذ"
      generation_method: ishtiqaq
      justification: "من الجذر (نفذ)، وتستخدم بكثرة في السياق القانوني بمعنى إخراج القرار أو القانون إلى حيز التطبيق (Effectuation/Enforcement)."
    - lemma: "إِجْرَاء"
      generation_method: ishtiqaq
      justification: "من الجذر (جري)، ويشير إلى اتخاذ الخطوات العملية اللازمة للتنفيذ."
    - lemma: "تَحْقِيق"
      generation_method: ishtiqaq
      justification: "من الجذر (حقق)، بمعنى جعل الشيء حقاً ثابتاً أو واقعاً ملموساً (Actualization)."

stage2_evidence:
  per_lemma:
    - lemma: "تطبيق"
      confirm:
        - text: "«إخضاع المسائل والقضايا لقاعدة علمية أو قانونية أو نحوها»"
          source: "المعجم الوسيط"
        - text: "«تَنْفِيذُ المسائِلِ والقضايا وَفْقًا للقواعِد العِلْمِيَّة أو القانونيَّة أو نحوِهِما»"
          source: "المعجم الكبير"
    - lemma: "تفعيل"
      confirm:
        - text: "«الانتقال بمفهوم أو تعريف أو مبدإ إلى مستوى الفعل الملموس والتطبيق المباشر»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي"
      expands:
        - text: "«يجب العمل على تفعيل دور التعليم... بمعنى زيادة فاعليته»"
          source: "معجم الصواب اللغوي"
          addition: "يضيف معنى زيادة الكفاءة والنشاط إلى مجرد التنفيذ."
    - lemma: "تنفيذ"
      confirm:
        - text: "«في الحكم: الإجراء العمليُّ لما قُضِيَ به»"
          source: "المعجم الوسيط"
        - text: "«تحقيق عمل ما (Implementation)»"
          source: "مسرد الإعلام والتواصل"
    - lemma: "إنفاذ"
      confirm:
        - text: "«إنفاذ: enforcement»"
          source: "المكنز الزراعي العربي"
      expands:
        - text: "«نَفَذَ السَّهْمُ الرَّمْيَةَ نَفَاذًا... وَأَنْفَذْتُهُ أَنَا. وَهُوَ نَافِذٌ: مَاضٍ فِي أَمْرِهِ»"
          source: "مقاييس اللغة"
          addition: "يؤكد معنى المضاء والإنفاذ في الأمور."
    - lemma: "تحقيق"
      confirm:
        - text: "«تحقيق: إنجاز فكرة أو مشروع (Actualization)»"
          source: "مسرد الإعلام والتواصل"
        - text: "«تحقيق: realization»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا"
    - lemma: "إجراء"
      contradicts:
        - text: "«عملية تتعلق بطريقة التصرف في شأن ما، وما قد يتضمنه من خطوات أو متطلبات»"
          source: "معجم الصواب اللغوي"
          conflict: "اللفظ يشير غالباً إلى 'الخطوة' أو 'المسطرة' (procedure) أكثر من فعل 'التنفيذ' الكلي نفسه."

