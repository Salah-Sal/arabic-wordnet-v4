stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان «المتفرجون البسطاء» و«جمهور الساخرين» عبارتان وصفيتان حرّتان وليستا مصطلحَيْن مسكوكَيْن؛ تفشلان في اختبار السكّ (يمكن إبدال «البسطاء» بـ«السُّذَّج» أو «الساخرين» بـ«المستهزئين» مع بقاء العبارة صالحة)"
      - "التعريف العربي ترجمة حرفية للإنجليزي تتضمّن إشارة ثقافية غربية خاصة (إلقاء الفول السوداني على المسرح) لا أصل لها في الثقافة العربية"
      - "المفهوم (أشخاص لا يُؤبَه بانتقاداتهم) له مقابلات عربية أصيلة متعدّدة لم تُستثمَر"
    observations: "المجموعة تصف مفهوماً اجتماعياً عامّاً — وهو التحقير من آراء فئة من الناس — له جذور عميقة في التراث العربي. حديث عليّ بن أبي طالب «وسائر الناس هَمَجٌ رَعَاع» يجسّد هذا المفهوم تماماً. ينبغي استبدال العبارات الوصفية بألفاظ عربية معجمية أصيلة."
  blind_candidates:
    - lemma: "رَعَاع"
      generation_method: majaz
      justification: "لفظ عربي فصيح يُطلَق على سِفْلة الناس وغوغائهم الذين لا يُعتَدّ بهم، وهو مجاز من الرَّعاعة (القطعة الهشّة)، يدلّ على خِفّة العقل والرأي"
    - lemma: "غَوْغَاء"
      generation_method: majaz
      justification: "أصله الذباب الصغير أو الجراد الخفيف، ثم أُطلِق مجازاً على السَّفَلة من الناس لكثرة لغطهم وصياحهم مع ضَعْف الحُجّة — وهو جوهر المفهوم المقصود"
    - lemma: "هَمَج"
      generation_method: majaz
      justification: "أصله البعوض الذي يسقط على الوجوه، ثم أُطلِق على رعاع الناس الحمقى الذين لا نظام لهم، كما في حديث عليّ «وسائر الناس هَمَجٌ رَعَاع»"
    - lemma: "طَغَام"
      generation_method: majaz
      justification: "يُطلَق على أراذل الناس وأوغادهم ورُذالهم، يدلّ على الحقارة والضعف فلا يُعتَدّ بآرائهم"

stage2_evidence:
  per_lemma:
    - lemma: "المتفرجون البسطاء"
      evidence_status: "no_material_found"

    - lemma: "جمهور الساخرين"
      evidence_status: "no_material_found"

    - lemma: "رَعَاع"
      confirm:
        - text: "«من الناس: الغوغاء»"
          source: "المعجم الوسيط"
        - text: "«غوْغَاؤهم وسَفِلتُهم وسُقَّاطُهم وأخلاطُهم»"
          source: "المعجم الكبير"
        - text: "«الرعاع: بالفتح، السفلة من الناس»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الرعاع) من النَّاس الغوغاء الْوَاحِد رعاعة»"
          source: "المعجم الوسيط (هورماني)"
      expands:
        - text: "«إِنَّه من رَعَاع الناس ... الوارد في المعاجم ضبط الراء بالفتح والضم. ولم نجد الكسر فيما بين أيدينا من مصادر»"
          source: "معجم الصواب اللغوي"
          addition: "يُضبَط بفتح الراء أو ضمّها، والكسر مرفوض"

    - lemma: "غَوْغَاء"
      confirm:
        - text: "«الصوت والجلبة السَّفَلة من الناس؛ لكثرة لغطهم وصياحهم»"
          source: "المعجم الوسيط"
        - text: "«الرِّعاع من النَّاس سُمّوا كذلك لكثرة لغطهم وصياحهم، الهمج، السِّفلة»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«الغَوْغاء؛ الرَّعاع؛ الطَّغام»"
          source: "المورد الحديث (ترجمة riffraff)"
          addition: "يُستخدَم مع الرعاع والطغام كمترادفات في ترجمة riffraff"

    - lemma: "هَمَج"
      confirm:
        - text: "«ذُبَاب صَغِير كالبعوض ... والحمقى والرعاع من النَّاس لَا نظام لَهُم»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«ذبابٌ صغير كالبعوض ... الحمق الرعاع من الناس لا نِظَامَ لهم»"
          source: "المعجم الوسيط"
        - text: "«ذباب يطير على وجوه الإبل ونحوها فشبه به رعاع الناس»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«ما هم إلا همجٌ ورعاع»"
          source: "أساس البلاغة للزمخشري"
        - text: "«وسائرُ الناسِ هَمَجٌ رَعاعٌ»"
          source: "النهاية في غريب الحديث (حديث عليّ)"
        - text: "«رعاع من النّاس لا نظام لهم ... وَسَائِرُ النَّاسِ هَمَجٌ رِعَاعٌ [حديث]»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«الْهَاءُ وَالْمِيمُ وَالْجِيمُ: أَصْلٌ يَدُلُّ عَلَى اخْتِلَاطٍ وَاضْطِرَابٍ ... وَيُقَالُ لِرُذَالِ النَّاسُ الْهَمَجُ تَشْبِيهًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الاختلاط والاضطراب، والإطلاق على الناس تشبيه بالبعوض"
        - text: "«كلمة هَمَج بمعناها المذكور واردة في المعاجم القديمة فضلاً عن الحديثة ... تُعَدّ هذه الكلمة من فصيح اللغة الشائع على ألسنة العامة»"
          source: "معجم الصواب اللغوي"
          addition: "تأكيد فصاحة اللفظ وشيوعه"

    - lemma: "طَغَام"
      confirm:
        - text: "«أرذال الناس وأوغادُهُمْ؛ ويقال: طير طغام الضعيفُ والرَّديءُ من كلِّ شيء»"
          source: "المعجم الوسيط"
        - text: "«الطغام: الأغبياء والرذال»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«أوغادُ الناسِ، ورُذالُ الطَّيْرِ»"
          source: "القاموس المحيط"

stage3_analysis:
  per_lemma:
    - lemma: "المتفرجون البسطاء"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست وحدة معجمية مسكوكة؛ لا توجد لها شواهد معجمية كمصطلح. تفشل في اختبار السكّ: يمكن إبدال «البسطاء» بـ«السُّذَّج» أو «العاديّين» مع بقاء العبارة صالحة وصفياً. كلمة «البسطاء» ذاتها لا تعني في المعاجم «بسيطي التفكير» بل «عريضة» (من صفات الآذان)"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جمهور الساخرين"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل في اختبار السكّ واختبار التثبيت المعجمي؛ لا توجد شواهد على سكّها كمصطلح. يمكن إبدال «الساخرين» بـ«المستهزئين» أو «المنتقدين» مع بقاء العبارة صالحة. كما أنّ «جمهور الساخرين» لا ينقل دلالة التحقير من الانتقادات بل يوحي بأنّ الجمهور ساخر فعلاً"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "رَعَاع"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي فصيح موثّق في المعاجم الكلاسيكية والحديثة بمعنى سِفْلة الناس وغوغائهم الذين لا يُعتَدّ بآرائهم. أكّد معجم الصواب اللغوي فصاحته. يُضبَط بفتح الراء (رَعَاع) أو ضمّها (رُعَاع)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الوضاعة الاجتماعية وانعدام الاعتبار؛ أعمّ من غوغاء وهمج، يصف الفئة التي لا قيمة لرأيها بسبب وضاعتها"
      actions:
        - command: create_entry
          params:
            lemma: "رَعَاع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "غَوْغَاء"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي فصيح أصيل في المعاجم بمعنى السَّفَلة من الناس الذين يكثر لغطهم وصياحهم؛ يتضمّن دلالة على كثرة الكلام مع ضعف المحتوى، وهو جوهر مفهوم الانتقادات التافهة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على كثرة اللغط والصياح وضعف الحجّة؛ يُبرز الجانب الصوتي المزعج مع انعدام المضمون"
      actions:
        - command: create_entry
          params:
            lemma: "غَوْغَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "هَمَج"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي تراثي غنيّ بالدلالة المجازية، أصله البعوض ثم أُطلِق على رعاع الناس الحمقى الذين لا نظام لهم. ورد في حديث عليّ رضي الله عنه «وسائر الناس هَمَجٌ رَعاع» وهو أدقّ تعبير عن مفهوم المجموعة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الحماقة وانعدام النظام والتدبير؛ مستعار من البعوض فيحمل دلالة الصِّغَر والتفاهة، وأقرب اللمّات إلى المفهوم المجازي الأصلي"
      actions:
        - command: create_entry
          params:
            lemma: "هَمَج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "طَغَام"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود اللفظ بمعنى أراذل الناس، فإنّه يركّز على الخسّة والوغادة الأخلاقية أكثر من التفاهة الفكرية. المجموعة تصف أشخاصاً انتقاداتهم تافهة، لا أشخاصاً أوغاداً بالضرورة. كما أنّ وجود ثلاث لمّات مؤكَّدة (رعاع، غوغاء، همج) كافٍ لتغطية الأطياف الدلالية"

