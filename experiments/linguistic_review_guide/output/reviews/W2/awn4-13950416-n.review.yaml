          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani) — entry 821178"
          addition: "يُثبت أن «الوضع» يتضمن معنى الهيئة الكلية للشيء بالنسبة لما يحيط به، مما يدعم دلالته على «state of affairs»."

    - lemma: "مَشْهَد"
