          source: "المعجم الوسيط (OCR) — entry 15499"
          addition: "المعاجم تُثبت «مشهد» في معنى الحضور والمجتمع والمكان المشاهَد، لا بمعنى «state of affairs» المجرد."
        - text: "«مَحْضَرُ النَّاسِ / الموضِعُ الذى يجتمع فيه القومُ / حَوْمَةُ الوغَى»"
