          conflict: "المعنى الأول والأصلي للمفرد «ظرف» هو الوعاء، لا الحالة أو الملابسات."
        - text: "«يَقُولُونَ: هَذَا وِعَاءُ الشَّيْءِ وَظَرْفُهُ، ثُمَّ يُسَمُّونَ الْبَرَاعَةَ ظَرْفًا، وَذَكَاءَ الْقَلْبِ كَذَلِكَ. وَمَعْنَى ذَلِكَ أَنَّهُ وِعَاءٌ لِذَلِكَ.»"
