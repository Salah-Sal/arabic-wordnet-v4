# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حالة"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة موثقة في أقدم المعاجم بمعنى «واحدة أحوال الشيء»، وهي الأنسب لتعبير
        عن مفهوم «الحالة العامة للأمور». الجذر حول يدل على التحول والتقلب، مما يجعل
        «حالة» مناسبة للتعبير عن الوضع في لحظة متغيرة. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على الحال المتغيّرة والقابلة للتحول من وضع إلى آخر؛ الأنسب للتعبير عن
        الأوضاع الحياتية والصحية والانتقالية ("حالة طوارئ"، "الحالة الصحية"، "حالة
        الحرب"). تختلف عن «وضع» في أنها أكثر ارتباطاً بالتحول والديناميكية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالَة"

    - lemma: "ظرف"
      decision: confirmed
      decision_reason: >
        رغم أن المعنى الأشيع للمفرد في المعاجم الأصيلة هو «الوعاء» أو «الظرف النحوي»،
        إلا أن المعجم الكبير يُثبت معنى «الوضع والحالة»، ومعاجم المصطلحات الحديثة
        تُثبت «ظروف = circumstances» بكثافة. المفرد «ظرف» قائم كلمة عربية فصيحة
        لهذا المعنى وإن كان ثانوياً. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن الإطار الخارجي المحيط بالحدث أو الأمر، بوصفه «وعاء» الأحداث؛ الأنسب
        للتعبير عن الملابسات القانونية والاجتماعية والموضوعية ("الظروف المخففة"، "ظرف
        موضوعي"). يختلف عن «حالة» في أنه يُشير إلى السياق المحيط لا إلى الحال الذاتية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ظَرْف"

    - lemma: "وضع"
      decision: confirmed
      decision_reason: >
        لمّة قوية مُثبتة في المعاجم الأصيلة بمعنى «هيئة الشيء التي يكون عليها»، وهو
        تعريف مطابق لدلالة المجموعة. الاستخدام المعاصر واسع جداً: "الوضع الراهن"،
        "الوضع السياسي"، "الوضع الاقتصادي". تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُشير إلى الوضع كنتيجة استقرارية لعوامل متعددة، مع تأكيد على الثبات النسبي
        في اللحظة الراهنة؛ الأنسب للتعبير عن الحالة السياسية والاقتصادية والاجتماعية
        ("الوضع الراهن"، "الوضع المالي"). يختلف عن «حالة» في دلالته على الاستقرار
        والثبات أكثر من التحول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَضْع"

    - lemma: "مَشْهَد"
      source: stage1
      decision: removed
      decision_reason: >
        «مشهد» يدل أصلاً على ما يُرى ويُشاهد، أو على مجتمع الناس في مكان ما.
        استخدامه الصحفي المعاصر ("المشهد السياسي") تعبير مجازي لم يرقَ بعد إلى مستوى
        المصطلح المعجمي المستقر المقابل لـ"state of affairs". لا تُثبته المعاجم الأصيلة
        في هذا المعنى المجرد.
      evidence_assessment:
        case: contradicts_only

    - lemma: "هَيْئَة"
      source: stage1
      decision: removed
      decision_reason: >
        «هيئة» تُطابق دلالتها تعريفَ المجموعة الأعلى (hypernym: awn4-00024900-n) وهو
        «الكيفيّة التي يكون عليها الشيء من حيث صفاته الرئيسيّة». إضافتها إلى هذه المجموعة
        سيُربك الهرمية الدلالية ويضعها في مستوى أعلى مما يقتضيه السياق.
      evidence_assessment:
        case: mixed

    - lemma: "مُجْرَيَات"
      source: stage1
      decision: removed
      decision_reason: >
        «مجريات» تدل على «سير الأحداث وتدفقها» (من جرى)، وهي دلالة ديناميكية مؤقتة تُشير
        إلى ما يجري ويتطور، لا إلى «الحالة الثابتة في وقت بعينه». فضلاً عن أنها اسم جمع
        لا يُستخدم إلا في هذا الجمع عادةً.
      evidence_assessment:
        case: no_material

    - lemma: "مُلَابَسَات"
      source: stage1
      decision: removed
      decision_reason: >
        «ملابسات» تدل على الملابسات المصاحبة لحدث بعينه، لا على «الحالة العامة للأشياء».
        دلالتها جزئية وسياقية مرتبطة بحدث محدد ("ملابسات الجريمة") لا بالوضع العام.
        لم يُعثر على أدلة معجمية في قاعدة البيانات.
      evidence_assessment:
        case: no_material


