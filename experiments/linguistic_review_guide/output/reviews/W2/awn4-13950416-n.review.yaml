# المعنى: الحالة العامة للأشياء؛ مجموعة الظروف في وقت معين
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء) ───────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي دوري: يستخدم «الحالة» (إحدى لمّات المجموعة) و«الظروف» (جمع لمّة أخرى) في تعريف المجموعة ذاتها."
      - "اللمّة «ظرف» مشكلة دلالياً: المعنى الأشيع للمفرد في المعاجم هو «الوعاء» أو «الظرف النحوي»، ومعنى «الحالة/الملابسات» ثانوي ويظهر أكثر في الجمع «ظروف»."
      - "التشكيل ناقص في الثلاث لمّات الموجودة: حالة، ظرف، وضع."
    observations: >
      المجموعة تعبّر عن مفهوم "الوضع العام للأمور/مجموعة الظروف في وقت بعينه"،
      وهو مفهوم أصيل في العربية تعبّر عنه اللمّتان حالة ووضع بدقة تامة. أما لمّة
      "ظرف" فتنتمي أصلاً إلى دلالة الوعاء، ثم اتسعت دلالتها لتشمل الإطار الخارجي
      المحيط بالأمر، ولا سيما في الجمع "ظروف". التعريف الحالي يحتاج مراجعة لإزالة
      الدوران المعجمي.

  blind_candidates:
    - lemma: "مَشْهَد"
      generation_method: majaz
      justification: "مجاز بالإزاحة: المشهد الحسي (ما يُرى ويُشاهد) يُوسَّع ليدل على «الصورة العامة للأمور». يُستخدم في الصحافة المعاصرة: «المشهد السياسي الراهن»."
    - lemma: "هَيْئَة"
      generation_method: ishtiqaq
      justification: "مشتق من جذر هيأ، وزن فَعْلَة. تعني في المعاجم «الحال التي يكون عليها الشيء محسوسةً كانت أو معقولة» — قريب جداً من دلالة المجموعة."
    - lemma: "مُجْرَيَات"
      generation_method: ishtiqaq
      justification: "مشتق من جذر جرى، جمع مُجْرَى على مُفْعَليَات. يدل على «سير الأحداث وتطوراتها» بوصفها مجموع ما تكون عليه الأمور. ثبتت فصاحته في معجم الصواب اللغوي."
    - lemma: "مُلَابَسَات"
      generation_method: ishtiqaq
      justification: "مشتق من جذر لبس، مُفَاعَلَات. يدل على «الملابسات المصاحبة للأمر» أي مجموع الظروف المحيطة به — مطابق لـ«مجموعة الظروف في وقت معين»."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
