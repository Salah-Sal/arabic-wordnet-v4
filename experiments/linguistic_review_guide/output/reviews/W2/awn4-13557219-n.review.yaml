stage1_review:
  assessment:
    concerns:
      - "بعض اللمات تفتقر للتشكيل الكامل."
    observations: "التعريف دقيق ويعبر عن المفهوم العلمي لتغير حالة المادة، واللمات الموجودة تعبر عن المفهوم بشكل جيد وتتفق مع المصطلحات العلمية الشائعة (تغير الطور، تغير فيزيائي)."
  blind_candidates:
    - lemma: "تَحَوُّلُ الطَّوْرِ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر عن تغير الحالة الفيزيائية للمادة من طور إلى آخر."
    - lemma: "تَغَيُّرُ الْحَالَةِ"
      generation_method: tarkib
      justification: "مركب إضافي شائع الاستخدام للتعبير عن تغير حالة المادة الفيزيائية."
    - lemma: "اِنْتِقَالُ الطَّوْرِ"
      generation_method: tarkib
      justification: "مصطلح فيزيائي يستخدم للتعبير عن تحول المادة بين حالاتها المختلفة."
    - lemma: "تَحَوُّلٌ فِيزْيَائِيٌّ"
      generation_method: tarkib
      justification: "وصف للتغير الذي يطرأ على المادة دون المساس بتركيبها الكيميائي."

stage2_evidence:
  per_lemma:
    - lemma: "تحول الطور"
      confirm:
        - text: "«تحول طوري، تغير الطور» (phase change)"
          source: "المعجم الموحد لمصطلحات المياه"
    - lemma: "تغير الطور"
      confirm:
        - text: "«تغيُّر الطور» (phase change)"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية"
    - lemma: "تغير فيزيائي"
      confirm:
        - text: "«تغير فيزيائي» (physical change)"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "تَغَيُّرُ الْحَالَةِ"
      confirm:
        - text: "«تغيّر الحالة» (state change)"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
    - lemma: "اِنْتِقَالُ الطَّوْرِ"
      confirm:
        - text: "«رتبة انتقال الطور» (order of phase transition)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"

stage3_analysis:
