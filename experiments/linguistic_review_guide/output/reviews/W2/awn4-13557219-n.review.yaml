      decision: confirmed
      decision_reason: "مصطلح علمي دقيق ومعتمد في المعاجم المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحَوُّلُ الطَّوْرِ"

    - lemma: "تغير الطور"
      decision: confirmed
      decision_reason: "مصطلح شائع وموثق في المعاجم للإشارة إلى نفس المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَغَيُّرُ الطَّوْرِ"

    - lemma: "تغير فيزيائي"
      decision: confirmed
      decision_reason: "مصطلح علمي أساسي يعبر عن التغير في الخواص الفيزيائية (الحالة) دون الكيميائية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَغَيُّرٌ فِيزْيَائِيٌّ"

    - lemma: "تَغَيُّرُ الْحَالَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد ومستعمل بكثرة في المناهج والمراجع العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
