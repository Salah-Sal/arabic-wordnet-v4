    - lemma: "تَحَوُّلٌ فِيزْيَائِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح عام ولم توثقه المعاجم بدقة بنفس قوة (تغير فيزيائي)."

stage4_content:
  definition:
    current: "تغير من حالة (صلبة أو سائلة أو غازية) إلى أخرى دون تغيير في التركيب الكيميائي"
    assessment:
      decision: retain
      reason: "التعريف دقيق وشامل ولا يحتاج إلى تعديل."
  examples:
    per_lemma:
      - lemma: "تحول الطور"
        examples:
          - text: "يُعتبر ذوبان الجليد مثالاً كلاسيكياً على تحول الطور من الصلب إلى السائل."
            type: usage
      - lemma: "تغير الطور"
        examples:
          - text: "يرافق تغير الطور في المادة امتصاص أو تحرير للطاقة الحرارية الكامنة."
            type: usage
      - lemma: "تغير فيزيائي"
        examples:
          - text: "تبخر الماء هو تغير فيزيائي لا يؤثر على تركيب جزيئاته."
            type: usage
      - lemma: "تَغَيُّرُ الْحَالَةِ"
        examples:
          - text: "تدرس الديناميكا الحرارية عمليات تغير الحالة للموائع تحت ظروف مختلفة."
            type: usage
      - lemma: "اِنْتِقَالُ الطَّوْرِ"
        examples:
          - text: "يحدث انتقال الطور عند درجات حرارة وضغوط محددة لكل مادة."
            type: usage

