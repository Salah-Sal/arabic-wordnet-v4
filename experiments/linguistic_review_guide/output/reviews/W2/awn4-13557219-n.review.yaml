          params: {entry_id: "{auto}", synset_id: "awn4-13557219-n"}

    - lemma: "اِنْتِقَالُ الطَّوْرِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فيزيائي متداول وموثق ضمن المركبات المعتمدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
