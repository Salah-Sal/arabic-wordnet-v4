# ── المرحلة ١: المراجعة والتوليد (عمياء) ───────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «تَشَابُه» عامة جداً وتفتقر إلى الخصوصية البيولوجية؛ تُترجم في بعض المعاجم بـ«analogy» (تشابه رغم اختلاف المنشأ) وهو مناقض لجوهر المفهوم الذي يقوم على وحدة الأصل."
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية، ويعكس المنطق السببي: يصف التشابه بأنه سبب العلاقة لا نتيجتها، ويُغفل عنصر الأصل المشترك الذي هو جوهر مفهوم homology."
      - "المصطلح العلمي الأدق للتماثل البنيوي الناتج عن الأصل المشترك (تماثل — homology) غائب عن لمّات المجموعة."
    observations: "المفهوم هو القرابة البيولوجية النشوئية أو التماثل الهيكلي (homology / phylogenetic affinity) بين الكائنات الحية نتيجة انحدارها من سلف مشترك. ثمة فرق جوهري بين التشابه التناظري (analogy = تشابه الوظيفة رغم اختلاف الأصل) والتشابه التماثلي (homology = تشابه البنية بسبب وحدة الأصل)؛ وهذا الفرق غائب عن صياغة اللمّات والتعريف الراهنَيْن. المعجمية العربية الحديثة وثّقت «تَمَاثُل» بالمعنى البيولوجي الدقيق في معاجم الوراثة والطب."
  blind_candidates:
    - lemma: "تَمَاثُل"
      generation_method: ishtiqaq
      justification: "مصدر وزن تَفَاعُل من جذر م-ث-ل، يدلّ على التشابه المتبادل في البنية والشكل. يجمع معنى التطابق والتناظر بين طرفين، وهو الأنسب للتعبير عن العلاقة القائمة على التشابه الهيكلي بين الكائنات الحية المنحدرة من سلف مشترك."
    - lemma: "تَشَاكُل"
      generation_method: ishtiqaq
      justification: "مصدر وزن تَفَاعُل من جذر ش-ك-ل، يدلّ على التشابه في الشكل والهيئة. مرشّح للاستخدام في السياق العلمي للتعبير عن التشابه الشكلي والبنيوي بين كائنات مختلفة."
    - lemma: "تَنَاظُر"
      generation_method: ishtiqaq
      justification: "مصدر وزن تَفَاعُل من جذر ن-ظ-ر، يدلّ على التقابل والتشابه المتبادل. مُرشَّح للاستخدام في السياق البيولوجي للتعبير عن التشابه الهيكلي."
    - lemma: "مُشَاكَلَة"
      generation_method: ishtiqaq
      justification: "مصدر وزن مُفَاعَلَة من جذر ش-ك-ل، يدلّ على المشابهة والمماثلة بين شيئين من حيث الشكل. قد يُستخدم للتعبير عن التشابه البنيوي بين الكائنات."


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
# الاستعلامات المنفّذة:
#   Q1 — batch headword lookup: تشابه / تماثل / تشاكل / تناظر / مشاكلة (+ صيغ الـ)
#   Q2 — English bridge: affinity / phylogenetic relation / homology / structural similarity
