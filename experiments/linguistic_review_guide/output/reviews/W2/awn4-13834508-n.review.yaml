stage2_evidence:
  per_lemma:
    - lemma: "تَشَابُه"
      confirm:
        - text: "«تشابه» — يشار إلى التشابه بين لغتين أو عدة لغات لا تربط بينهما قرابة أو نسبة معينة، بل توجد بينهما بعض التماثلات النمطية في تنظيم الجملة والمفردات العامة."
          source: "مسرد الإعلام والتواصل (ALECSO) — translation_en: affinity"
        - text: "«التشابه: اشتراك في ظاهر الصورة، ذكره الحرالي. وقال مرة أخرى: التشابه تراد الشبه في ظاهر أمرين لشبه كل منهما بالآخر بحيث يخفى خصوص كل منهما.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
      contradicts:
        - text: "«التساوي في النسبة، أو التشابه في الوظيفة أو المظهر بالرغم من اختلاف المنشأ.» — translation_en: analogy"
          source: "معجم المصطلحات الطبية ج.1 (1985)"
          conflict: "يُعرَّف هنا بأنه التشابه رغم اختلاف المنشأ (analogy)، وهو مناقض لجوهر المفهوم البيولوجي المقصود الذي يقوم على وحدة الأصل (homology)."

    - lemma: "قَرَابَة نُشُوئِيَّة"
      confirm:
        - text: "«قَرابة: علاقة سلالية بين نوعين أو أكثر من الأحياء» — translation_en: affinity"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«القرابة (مج): صلة بين الطوائف البيولوجية تنطوي على شَبَهٍ في البنية العامة وتدلّ على وحدة أصلٍ (أح).»"
          source: "المورد الحديث (2008) — ضمن مداخل translation_en: affinity"
      expands:
        - text: "«نشوئية النوع» — translation_en: phylogenesis; phylogeny"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
          addition: "المصطلح «النشوئية» موثّق للدلالة على الصفات التطورية والنشوئية، مما يعزّز صحة المركب «قرابة نشوئية» لإفادة القرابة التطورية بين الكائنات."

    - lemma: "تَمَاثُل"
      confirm:
        - text: "«تماثُل: تشابه أساسيّ في تركيب معين في كائنات مختلفة انحدرت من سلف مشترك.» — translation_en: homology"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«التماثل؛ التشاكل: تشابه في التكوين أو الوظيفة بين أعضاء كائنات حيّة مختلفة نتيجةً لنشوئها عن أصل واحد.» — translation_en: homology"
          source: "المورد الحديث (2008)"
        - text: "«المماثلة: تشابه بين عضو وآخر في البنية والموضع مع اشتراكهما في المنشأ.» — translation_en: homology"
          source: "معجم المصطلحات الطبية ج.3 (1997)"
        - text: "«تماثل التناميّ: تشابه في التشريح بين الكائنات التي تتنامى من مصدر جينيّ مشترك.» — translation_en: developmental homology"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"

    - lemma: "تَشَاكُل"
      contradicts:
        - text: "«(في الجيولوجيا) Homomorphism = Isomorphism: ميلُ سلسلتين تطوريتين متقاربتين أصلا - وليس بينهما علاقة نَسَبِيَّة - إلى التطور فى طريقين متوازيين متشابهين فى الشكل.»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "يُعرَّف صراحةً بأنه التشابه الشكلي بين سلالتين «وليس بينهما علاقة نسبية»، وهو بالضبط عكس مفهوم المجموعة القائم على وحدة الأصل."
        - text: "«تشاكل: تشابه وقائي في مظهر نوع من الحيوان بنوع آخر (الحشرات عموما).» — translation_en: mimicry"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          conflict: "يدلّ هنا على المحاكاة الوقائية (mimicry) لا على القرابة البيولوجية."
      expands:
        - text: "«(1) تماثل؛ تشاكل؛ تناظر (2) التماثل؛ التشاكل: تشابه في التكوين أو الوظيفة بين أعضاء كائنات حيّة مختلفة نتيجةً لنشوئها عن أصل واحد.» — translation_en: homology"
          source: "المورد الحديث (2008)"
          addition: "يُدرج المورد الحديث «تشاكل» مرادفاً لـ«تماثل» في سياق homology، غير أن هذا الاستخدام مخالف للتعريف الجيولوجي الأدق الوارد في المعجم الكبير."

    - lemma: "تَنَاظُر"
      contradicts:
        - text: "«تناظر» — translation_en: symmetry في جميع المعاجم الموحدة (الرياضيات، الكيمياء، الفيزياء، الطب)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) / الكيمياء (1992) / المعجم الطبي الموحد (2009)"
          conflict: "يدلّ حصراً على التماثل الرياضي-الفيزيائي (symmetry)، لا على القرابة البيولوجية التطورية."

    - lemma: "مُشَاكَلَة"
      contradicts:
        - text: "«المشاكلة (في البلاغة): أن يُذكَر الشيءُ بلفظ غيره لوقوعه في صحبته.»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "مصطلح بلاغي بحت لا علاقة له بالتشابه البيولوجي."
        - text: "«المشاكلة (في الفلسفة) Ressemblance: اتحاد في النوع، أو اتحاد في الخاصة، أو الاشتراك بالشكل.»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "يدلّ على التشابه الفلسفي العام، وليس على القرابة البيولوجية النشوئية."


