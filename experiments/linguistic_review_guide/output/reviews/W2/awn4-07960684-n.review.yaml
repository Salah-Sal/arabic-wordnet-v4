  definition:
    current: "الناس الذين يعانون من ضعف شديد في البصر، ويُعتبرون كمجموعة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية عن الإنجليزية، فيه ركاكة (يعانون من ضعف شديد في البصر) وحشو (ويُعتبرون كمجموعة). يحتاج إعادة صياغة بأسلوب معجمي عربي."
    authored:
      - type: terminological
        text: "فئةٌ مِنَ النَّاسِ ذهَبَ بَصَرُهم كُلُّه أو جُلُّه"
