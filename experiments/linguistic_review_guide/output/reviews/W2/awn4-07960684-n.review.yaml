          - text: "أنشأت الدولةُ مراكزَ متخصِّصةً لتأهيل العُمْيان وتعليمهم طريقةَ بريل."
            type: usage
      - lemma: "مَكْفُوفُون"
        examples:
          - text: "يستخدم المَكْفُوفُون تطبيقاتِ قراءةِ الشاشة للتعامل مع الأجهزة الذكيّة."
