# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07960684-n
# blind (people who have severe visual impairments, as a group)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عميان، مكفوفون) جمعان لا مفردات، وهو صحيح لأن المفهوم يدلّ على مجموعة جماعية"
      - "لمّة «عميان» بلا تشكيل — تحتاج ضبطاً: عُمْيَان"
      - "لمّة «مكفوفون» بلا تشكيل — تحتاج ضبطاً: مَكْفُوفُون"
      - "التعريف العربي الحالي ترجمة حرفية عن الإنجليزية ويحتاج صياغة معجمية أصيلة"
    observations: "المجموعة تعبّر عن مفهوم جماعي (collective noun) يدلّ على فئة من الناس فاقدي البصر. اللمّتان الحاليتان تمثّلان صيغتي جمع شائعتين في الفصحى: عُمْيان (جمع تكسير لأعمى) ومكفوفون (جمع مذكر سالم لمكفوف). المفهوم أصيل في الثقافة العربية وله حضور قرآني بارز."
  blind_candidates:
    - lemma: "عُمْيَان"
      generation_method: ishtiqaq
      justification: "جمع تكسير لأعمى على وزن فُعْلان، من الجذر ع م ي الدالّ على ذهاب البصر. صيغة قرآنية وردت في قوله تعالى: {صُمًّا وَعُمْيَانًا}"
    - lemma: "مَكَافِيف"
      generation_method: ishtiqaq
      justification: "جمع تكسير لمكفوف على وزن مَفَاعِيل، من الجذر ك ف ف الدالّ على القبض والانقباض. المكفوف من كُفّ بصره أي قُبض"
    - lemma: "ضَرَائِر"
      generation_method: ishtiqaq
      justification: "جمع تكسير لضرير على وزن فَعَائِل، من الجذر ض ر ر. الضرير: الأعمى كما في المعجم الوسيط"
    - lemma: "فَاقِدُو البَصَرِ"
      generation_method: tarkib
      justification: "تركيب إضافي من فاقد + البصر، يصف الحالة بدقة طبية دون وصم، شائع في الخطاب الرسمي والإعلامي المعاصر"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "عُمْيَان"
      confirm:
        - text: "«وردت الكلمة في المعاجم بضمّ العين جمعًا لكلمة أعمى وعَمْياء ومنه قوله تعالى: {لَمْ يَخِرُّوا عَلَيْهَا صُمًّا وَعُمْيَانًا} الفرقان/73»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«عَمِيَ يَعْمَى عَمًى فهو أعمى وقومٌ عُمْيٌ، وأعْماه الله»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«عَمِيَ فلانٌ عَمًى: ذهب بصره كلُّه من عينيه كلتيهما فهو أعمى (ج) عُمْي وعُمْيان وهي عمياء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«(عَمِيَ) الْعَيْنُ وَالْمِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى سَتْرٍ وَتَغْطِيَةٍ. مِنْ ذَلِكَ الْعَمَى: ذَهَابُ الْبَصَرِ مِنَ الْعَيْنَيْنِ كِلْتَيْهِمَا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدلّ على الستر والتغطية، وعُمْيان مذكور فيه"

    - lemma: "مَكْفُوفُون"
      confirm:
        - text: "«ذكر اللسان وغيره أن مكفوفًا تجمع على مكافيف، ولا يمنع هذا أن يجمع كذلك جمع مذكر سالما على مكفوفين؛ لأنه جمع قياسي في كل وصف لمذكر عاقل خال من التركيب وليس على أفعل فعلاء ولا فعلان فعلى»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«حكى ضم ا...كف الإنسان هي ما بها يقبض ويبسط وتعورف الكف بالدفع على أي وجه كان بكف أو غيرها حتى قالوا: رجل مكفوف لمن قبض بصره»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«(كَفَّ) الْكَافُ وَالْفَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قَبْضٍ وَانْقِبَاضٍ. مِنْ ذَلِكَ الْكَفُّ لِلْإِنْسَانِ، سُمِّيَتْ بِذَلِكَ لِأَنَّهَا تَقْبِضُ الشَّيْءَ. ثُمَّ تَقُولُ: كَفَفْتُ فُلَانًا عَنِ الْأَمْرِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الكف هو القبض والانقباض، والمكفوف من قُبض بصره"

    - lemma: "مَكَافِيف"
      confirm:
        - text: "«ذكر اللسان وغيره أن مكفوفًا تجمع على مكافيف»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«معهد المكفوفين [فصيحة] — معهد المكافيف [فصيحة مهملة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "مكافيف فصيحة لكنها مهملة الاستعمال مقارنة بمكفوفين"

    - lemma: "ضَرَائِر"
      contradicts:
        - text: "«(الضَّرِير) المضرور وَالْأَعْمَى والغيرة يُقَال مَا أَشد ضريره على زوجه (ج) أضراء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "جمع ضرير هو أضراء لا ضرائر. وضرائر جمع ضرّة (زوجة الرجل مع أخرى)"
      expands:
        - text: "«الأعمى. يقال: رجلٌ ضريرٌ بَيِّنُ الضَّرارة من قوم أضراءَ»"
          source: "المعجم الكبير"
          addition: "ضرير يعني الأعمى وجمعه أضراء لا ضرائر"

    - lemma: "فَاقِدُو البَصَرِ"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "عُمْيَان"
      decision: confirmed
      decision_reason: "جمع تكسير فصيح قرآني لأعمى، ثابت في المعاجم الكلاسيكية والمعاصرة. يدلّ على فاقدي البصر كمجموعة. أكثر شيوعاً من عُمْي في الاستعمال الجماعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "عُمْيان أعمّ وأشمل من مكفوفون؛ يشمل العمى الخَلْقيّ والمكتسب، ويُستعمل في السياق العام والأدبي والديني. قد يحمل دلالة مجازية (عمى البصيرة)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُمْيَان"

    - lemma: "مَكْفُوفُون"
      decision: confirmed
      decision_reason: "جمع مذكر سالم قياسي لمكفوف، أقرّ معجم الصواب اللغوي فصاحته. شائع في الاستعمال المعاصر الرسمي والمؤسسي (معهد المكفوفين)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مكفوفون أكثر تأدّباً ولطفاً من عُمْيان؛ يُفضَّل في الخطاب الرسمي والإعلامي والحقوقي. أصله من كُفّ بصره، وفيه معنى أن البصر مُنع لا أنه معدوم أصلاً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَكْفُوفُون"

    # ── المرشحات ──
    - lemma: "مَكَافِيف"
      source: stage1
      decision: removed
      decision_reason: "مكافيف جمع تكسير فصيح لمكفوف كما ذكر اللسان، لكنها مهملة الاستعمال كما نصّ معجم الصواب اللغوي. لا تُضيف تمييزاً دلالياً عن مكفوفون، وإدراجها يُثقل المجموعة بمرادف غير متداول."

    - lemma: "ضَرَائِر"
      source: stage1
      decision: removed
      decision_reason: "ضرائر جمع ضرّة (زوجة الرجل مع أخرى) لا جمع ضرير. جمع ضرير الصحيح هو أضراء. فضلاً عن أن ضرير مشترك لفظي يعني الأعمى والمضرور والشديد، فإدراج جمعه (أضراء) يُوقع في لَبس دلالي."

    - lemma: "فَاقِدُو البَصَرِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حرّ وليس مصطلحاً مسكوكاً. يمكن إبدال (فاقدو) بـ(معدومو) أو (عديمو) مع بقاء المعنى — فلا يجتاز اختبار السكّ. لا يُعدّ وحدة معجمية ثابتة."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
