      - type: linguistic
        text: "مَن كُفَّ بَصَرُهم مِنَ النَّاسِ بوصفِهم جماعةً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "فئةٌ مِنَ النَّاسِ ذهَبَ بَصَرُهم كُلُّه أو جُلُّه"

