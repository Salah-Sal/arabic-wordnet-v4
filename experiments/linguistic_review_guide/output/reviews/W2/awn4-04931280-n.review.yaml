stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف العربي الحالي يعاني من ركاكة صياغة ('شيء ما')."
    observations: "اللمّات المقترحة (عمر وسن) هي اللمّات المعيارية لهذا المفهوم في العربية، مع وجود فروق دلالية دقيقة في الاستعمال."
  blind_candidates:
    - lemma: "عُمْر"
      generation_method: ishtiqaq
      justification: "الجذر (عمر) يدل على البقاء وامتداد الزمان، وهو اللفظ الأصيل للتعبير عن مدة الحياة أو الوجود."
    - lemma: "سِنّ"
      generation_method: ishtiqaq
      justification: "تُستخدم للدلالة على مقدار ما مضى من العمر، وأصلها من ظهور الأسنان كعلامة على التقدم في السن."
    - lemma: "أَمَد"
      generation_method: ishtiqaq
      justification: "يدل على غاية الزمان أو مدته المحدودة، ويُستخدم للتعبير عن طول بقاء الشيء."
    - lemma: "بَقَاء"
      generation_method: ishtiqaq
      justification: "يدل على ثبات الشيء واستمراره في الوجود، وهو أعم من العمر."

stage2_evidence:
  per_lemma:
    - lemma: "عُمْر"
      confirm:
        - text: "«العَمْرُ والعُمُرُ: اسم لمدّة عمارة البدن بالحياة»"
          source: "المفردات في غريب القرآن"
        - text: "«العُمْرُ: مدّة الحياة من الولادة إلى الموت... سِنّ؛ مدّة الحياة حتى زمن التَّكلُّم»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«العمر: عمر الحياة»"
          source: "كتاب العين"
    - lemma: "سِنّ"
      confirm:
        - text: "«السِّنُّ: ... مِقْدارُ العُمُرِ، مُؤَنَّثَةٌ، في الناسِ وغيرِهِم»"
          source: "القاموس المحيط"
        - text: "«السِّنُّ: ... إذا عنيت بها السن التي بلغتها من العمر»"
          source: "المذكر والمؤنث لابن التستري"
        - text: "«السِّنُّ: العُمْرُ، يُقَالُ: كَمْ سِنُّكَ؟ أي كَمْ عُمُرُكَ؟»"
          source: "تاج العروس"
    - lemma: "أَمَد"
      expands:
        - text: "«الأمَدُ: الغاية والنهاية والـمدى , يقال : ضرب له أمَدًا الزَّمن والعُمْر»"
          source: "المعجم الكبير"
          addition: "يشير إلى غاية الزمان أو مدته، ويرتبط بالعمر والزمن."
    - lemma: "بَقَاء"
      contradicts:
        - text: "«البقاء ضد الفناء، ولفضل البقاء على العمر وصف الله به، وقلّما وصف بالعمر»"
          source: "المفردات في غريب القرآن"
          conflict: "البقاء صفة للاستمرار المطلق بينما العمر مرتبط بالمدد المحدودة أو المقدرة ببدء ونهاية."

stage3_analysis:
  per_lemma:
    - lemma: "عمر"
      decision: confirmed
      decision_reason: "هو اللفظ الأساسي والأشمل للدلالة على مدة الوجود، ويُستخدم للأحياء والجمادات على حد سواء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُمْر"
    - lemma: "سن"
      decision: confirmed
      decision_reason: "مصطلح شائع جداً للدلالة على العمر، خاصة عند البشر والحيوان، وفي السياقات القانونية والإجرائية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِنّ"
    - lemma: "أَمَد"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من دلالته على الزمن، إلا أنه غالباً ما يشير إلى الغاية أو المنتهى أو المدة المحصورة، وليس هو اللفظ الشائع للتعبير عن 'العمر' بمعناه العام."
    - lemma: "بَقَاء"
      source: stage1
      decision: removed
      decision_reason: "البقاء مفهوم فلسفي أوسع يتعلق بالثبات وعدم الفناء، بينما 'العمر' هو قياس زمني لتلك المدة."

stage4_content:
  definition:
    current: "مدة وجود شيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك لغوياً، والأفضل استخدام صياغة معجمية رصينة تشمل الكائنات الحية والأشياء."
    authored:
      - type: linguistic
        text: "الزَّمنُ الذي انقضى من حياةِ كائنٍ أو من وجودِ شيءٍ مُنذ نشأتِه أو تَكوّنِه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "عُمْر"
        examples:
          - text: "قَدَّرَ العلماءُ عُمْرَ الأرضِ بملياراتِ السنين."
            type: usage
          - text: "يَقضي المرءُ عُمْرَهُ في طلبِ العلمِ."
            type: usage
      - lemma: "سِنّ"
        examples:
          - text: "تَجاوزَ الطفلُ سِنَّ العاشرةِ."
            type: usage
          - text: "يُحدد القانونُ سِنَّ الرشدِ بثماني عشرةَ سنةً."
            type: usage
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-04931280-n"
        definition_index: 0
        text: "الزَّمنُ الذي انقضى من حياةِ كائنٍ أو من وجودِ شيءٍ مُنذ نشأتِه أو تَكوّنِه."

