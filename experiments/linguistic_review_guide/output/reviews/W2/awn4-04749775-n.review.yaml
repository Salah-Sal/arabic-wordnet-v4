# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:

  assessment:
    concerns:
      - "التعريف الحالي 'صفة كون الأشياء متشابهة' دوريٌّ؛ يُعرَّف التشابه بـ'متشابهة' المشتقة من الجذر نفسه"
      - "اللمّة 'تَطَابُق' تحمل معنى التطابق الكامل (congruence / identity) وقد تتجاوز في القوة دلالةَ 'being alike' الأعمّ"
      - "الفروق الدلالية الدقيقة بين اللمّات الثلاث غير موثّقة في السجل الحالي، مما قد يوحي بأنها مترادفات مطلقة"
    observations: >-
      المجموعة تضمّ ثلاث لمّات راسخة تُغطّي طيف مفهوم التشابه بدرجات متفاوتة:
      تَشَابُه هو الأعمّ والأشمل استعمالاً في سياقات التشابه الجزئي أو الظاهري،
      وتَمَاثُل يُستعمل في سياقات التعادل الجوهري والعلمي،
      وتَطَابُق يدلّ على درجة عليا تصل إلى التطابق الكامل.
      الجذور الثلاثة موثّقة توثيقاً وافراً في طبقات المعجمية العربية من الكلاسيكية إلى الحديثة.

  blind_candidates:
    - lemma: "مُمَاثَلَة"
      generation_method: ishtiqaq
      justification: >-
        مصدر المفاعلة من جذر م-ث-ل على وزن مُفَاعَلَة؛
        يُعبّر عن كون شيء مثيلاً لغيره دون الاعتماد على ألفاظ التعريف المعطى،
        وهو مشتقٌّ قياسي يتجنّب الدوران الدلالي
    - lemma: "تَشَاكُل"
      generation_method: ishtiqaq
      justification: >-
        مصدر تفاعُل من جذر ش-ك-ل على وزن تَفَاعُل؛
        يُعبّر عن توافق الأشكال والهيئات بين أمرين وقد يُجسّد البعد المظهري للتشابه
    - lemma: "تَنَاظُر"
      generation_method: majaz
      justification: >-
        أصله 'نظر بعضهم إلى بعض' ثم اتُّسع بالمجاز الدلالي إلى معنى التقابل والتماثل؛
        إزاحة دلالية من الفعل الحسي (الرؤية المتبادلة) إلى الصفة المجردة (الاتساق والمماثلة)
    - lemma: "تَوَافُق"
      generation_method: ishtiqaq
      justification: >-
        مصدر تفاعُل من جذر و-ف-ق؛ يُصوَّر فيه جانب الانسجام والتلاؤم بين الأشياء
        كأنها تتوافق وتتلاءم، وهو اشتقاق قياسي من جذر يدل على الملاءمة


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "تَشَابُه"
      confirm:
        - text: >-
            «التشابه: اشتراك في ظاهر الصورة، ذكره الحرالي.
            وقال مرة أخرى: التشابه تراد الشبه في ظاهر أمرين
            لشبه كل منهما بالآخر بحيث يخفى خصوص كل منهما»
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: >-
            «التشابه: عند المتكلمين هو الاتحاد في الكيف
            ويسمّى مشابهة أيضاً كذا في شرح المواقف»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«تشابه الأشياء: تقاربتْ وتماثلتْ»"
          source: "المعجم الكبير"
        - text: "«تشابه الشيئان أشبه كل منهما الآخر حتى التبسا»"
          source: "المعجم الوسيط"
      expands:
        - text: >-
            «الشِّينُ وَالْبَاءُ وَالْهَاءُ أَصْلٌ وَاحِدٌ
            يَدُلُّ عَلَى تَشَابُهِ الشَّيْءِ وَتَشَاكُلِهِ لَوْنًا وَوَصْفًا.
            يُقَالُ شِبْهٌ وَشَبَهٌ وَشَبِيهٌ»
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يجمع التشابه اللوني والوصفي معاً، مما يُعمّق دلالة الصفة المشتركة"

    - lemma: "تَطَابُق"
      confirm:
        - text: >-
            «التَّمَاثُلُ والتَّشَابُه؛ اتِّفاقُ شيئين في الخواصِّ؛
            تَطَابُق المثلّثين (في الهندسة): تَشَابُهٌ كامِلٌ بينهما
            وتَساوٍ في جميع العناصر المتناظرة من زوايا وأضلاع»
          source: "المعجم الكبير"
        - text: "«تَطَابَقَ الشيئانِ: تَوافَقَا وتَساوَيا»"
          source: "المعجم الكبير"
      expands:
        - text: >-
            «الطَّاءُ وَالْبَاءُ وَالْقَافُ أَصْلٌ صَحِيحٌ وَاحِدٌ،
            وَهُوَ يَدُلُّ عَلَى وَضْعِ شَيْءٍ مَبْسُوطٍ عَلَى مِثْلِهِ حَتَّى يُغَطِّيَهُ.
            مِنْ ذَلِكَ الطَّبَقُ. تَقُولُ: أَطْبَقْتُ الشَّيْءَ عَلَى الشَّيْءِ،
            فَالْأَوَّلُ طَبَقٌ لِلثَّانِي؛ وَقَدْ تَطَابَقَا»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            الجذر يُشير إلى التغطية الكاملة لمثيل الشيء —
            وهذا يُفسّر دلالة التطابق التام التي يحملها هذا المصدر

    - lemma: "تَمَاثُل"
      confirm:
        - text: >-
            «التّماثل: والمماثلة عند المحاسبين كون العددين متساويين
            وكل من العددين يسمّى متماثلاً.
            وعند الحكماء والمتكلّمين ما قد عرفت في لفظ المثل»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«تماثل الشيئان تشابها»"
          source: "المعجم الوسيط"
        - text: "«تَمَاثُل — من (م ث ل): التَّشَابُه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«تماثل العددين: كون أحدهما مساوياً للآخر، كثلاثة ثلاثة، وأربعة أربعة»"
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: >-
            «الْمِيمُ وَالثَّاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ
            يَدُلُّ عَلَى مُنَاظَرَةِ الشَّيْءِ لِلشَّيْءِ.
            وَهَذَا مِثْلُ هَذَا، أَيْ نَظِيرُهُ،
            وَالْمِثْلُ وَالْمِثَالُ فِي مَعْنًى وَاحِدٍ»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            الأصل يجمع بين المماثلة والمناظرة مما يُفسّر
            توسّع تَمَاثُل في السياقات العلمية والفلسفية

    - lemma: "مُمَاثَلَة"
      confirm:
        - text: "«تشابُه، مماثلة، شبَهٌ»"
          source: "المعجم الموحد لمصطلحات القانون"
      contradicts:
        - text: >-
            «المُمَاثَلَةُ: كَون مَا فِي إِحْدَى القرينتين أَو أَكْثَره
            مثل مَا يُقَابله فِي الْأُخْرَى من الْوَزْن»
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "دلالة بلاغية خاصة بالتكافؤ الوزني في الجمل المتوازية، لا تعبّر عن المفهوم العام"
        - text: "«assimilation — تعديل صوتي ناتج عن التقاء وحدتين صوتيتين مجاورتين»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          conflict: "مصطلح لساني تقني (المماثلة الصوتية) لا علاقة له بمعنى 'sameness' العام"

    - lemma: "تَشَاكُل"
      confirm:
        - text: "«تشاكَلَ الشَّيئانِ: تشابها وتماثلا، وقيل: توافقا»"
          source: "المعجم الكبير"
      contradicts:
        - text: >-
            «التَّشَاكُل (في الجيولوجيا) Homomorphism = Isomorphism:
            ميلُ سلسلتين تطوريتين متقاربتين أصلاً إلى التطور
            في طريقين متوازيين متشابهين في الشكل»
          source: "المعجم الكبير"
          conflict: "الاستعمال التقني المتخصص (homomorphism) يُبعده عن 'sameness' العام"
        - text: "«تشابه وقائي في مظهر نوع من الحيوان بنوع آخر (mimicry)»"
          source: "مسرد المناخ والبيئة"
          conflict: "دلالة بيولوجية تخصصية (المحاكاة الشكلية) لا تناسب المجموعة"

    - lemma: "تَنَاظُر"
      contradicts:
        - text: >-
            «التناظر: عند المنجّمين ويسمّونه أيضاً الاتصال الطبيعي،
            وبدلاً من الاتصالات يستخدمون النظر»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الدلالة الاصطلاحية الكلاسيكية مرتبطة بالتنجيم لا بالتشابه"
        - text: >-
            «تناظر القوم نظر بعضهم إلى بعض؛
            وفي الأمر تجادلوا وتراوضوا؛ دورهم تتناظر: تتقابل»
          source: "المعجم الوسيط"
          conflict: "الدلالة الأصيلة هي التقابل والتجادل، لا الاتحاد في الصفة"
        - text: "«symmetry» — تناظر هندسي وفيزيائي"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك ومصطلحات الفيزياء"
          conflict: "استقرّ التناظر في المعاجم العلمية الحديثة مرادفاً لـ symmetry، وهو مفهوم مغاير لـ sameness"

    - lemma: "تَوَافُق"
      contradicts:
        - text: >-
            «التوافق (في الفلسفة): أن يسلك المرءُ مسلك الجماعة
            ويتجنّب ما عنده من شذوذ في الخُلق والسلوك»
          source: "المعجم الوسيط"
          conflict: "الدلالة الفلسفية هي الامتثال الاجتماعي (conformism)، بعيدة عن 'being alike'"
        - text: >-
            «توافق العددين: ألا يعد أقلهما الأكثر،
            ولكن يعدهما عددٌ ثالث، كالثمانية مع العشرين»
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "مصطلح رياضي خاص (علاقة القسمة المشتركة) لا صلة له بمفهوم sameness"
      expands:
        - text: >-
            «الْوَاوُ وَالْفَاءُ وَالْقَافُ: كَلِمَةٌ تَدُلُّ عَلَى مُلَاءَمَةِ الشَّيْئَيْنِ.
            مِنْهُ الْوَفْقُ: الْمُوَافَقَةُ. وَاتَّفَقَ الشَّيْئَانِ: تَقَارَبَا وَتَلَاءَمَا»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            الجذر يدل على الملاءمة والتلاؤم (compatibility/accord)
            لا على التماثل في الصفة، مما يُكرّس بُعده عن دلالة 'sameness'


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "تَشَابُه"
      decision: confirmed
      decision_reason: >-
        اللمّة الأمّ للمفهوم؛ الأكثر شيوعاً وأوسع دلالةً في الاستعمال للتعبير
        عن كون الأشياء متشابهة؛ موثّقة في جميع طبقات المعاجم ووردت في النص القرآني.
        الأدلة مؤكِّدة بلا تناقضات.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبّر عن التشابه الظاهري أو الجزئي بين أمرين يشتركان في صفة ما
        دون اشتراط التطابق الكامل؛ الأعمّ استعمالاً في السياقات اليومية والأدبية

    - lemma: "تَطَابُق"
      decision: confirmed
      decision_reason: >-
        موثّق في المعجم الكبير بمعنى التماثل والتشابه ويُستعمل للتعبير عن درجة
        عليا منه تصل إلى التطابق الكامل؛ يقع ضمن طيف المجموعة إذ 'sameness'
        تعني في جوهرها 'كون الشيء هو الشيء ذاته'، وهو ما يُجسّده التطابق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبّر عن التشابه التام الذي يصل إلى حدّ التطابق الكامل (كتطابق المثلثين)؛
        أقوى درجةً من تَشَابُه وأقرب إلى 'congruence / identity'

    - lemma: "تَمَاثُل"
      decision: confirmed
      decision_reason: >-
        موثّق في المعاجم الكلاسيكية والحديثة بمعنى التشابه والمساواة؛
        يُستعمل في السياقات العلمية والفلسفية للتعبير عن التعادل والمطابقة
        بين الأشياء في صفاتها الجوهرية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبّر عن التشابه الجوهري والكمّي بين أمرين (تماثل العددين = تساويهما)؛
        يُستعمل كثيراً في العلم والفلسفة وفي الطب (تماثَلَ للشفاء = صار أشبه بالصحيح)

    - lemma: "مُمَاثَلَة"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم وجودها في المعجم الموحد للقانون مرادفاً للتشابه، إلا أن الدلالة الغالبة
        في المعاجم هي البلاغية (التكافؤ الوزني في المتوازيات) أو اللسانية (المماثلة
        الصوتية / assimilation) أو البيولوجية (homology)؛ ولا تُضيف قيمة دلالية
        مغايرة على تَمَاثُل الموجودة في المجموعة.
      evidence_assessment:
        case: mixed

    - lemma: "تَشَاكُل"
      source: stage1
      decision: removed
      decision_reason: >-
        استقرّ استعماله في المعاجم الحديثة للدلالة على مفاهيم تقنية متخصصة
        (isomorphism, homomorphism, mimicry) بعيدة عن 'sameness' العام؛
        وإن أثبته المعجم الكبير مرادفاً للتشابه إلا أن التخصيص التقني المعاصر
        يحول دون اعتماده في مجموعة ترادفية عامة.
      evidence_assessment:
        case: mixed

    - lemma: "تَنَاظُر"
      source: stage1
      decision: removed
      decision_reason: >-
        استقرّ في المعاجم العلمية الحديثة مرادفاً لـ symmetry (التناظر الهندسي
        والفيزيائي)، وهو مفهوم مغاير لـ sameness؛ وفي المعاجم الكلاسيكية
        يدل على التقابل والتجادل لا على الاتحاد في الصفة.
        الأدلة متعارضة مع المجموعة في مجموعها.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَوَافُق"
      source: stage1
      decision: removed
      decision_reason: >-
        يدل على الملاءمة والانسجام (compatibility / accord / concordance) لا على
        التماثل في الصفة؛ استعماله في سياقات الفلسفة (الامتثال الاجتماعي)
        والرياضيات (علاقة بين الأعداد) والمصطلحية التقنية يُبعده عن دلالة 'sameness'.
      evidence_assessment:
        case: contradicts_only


