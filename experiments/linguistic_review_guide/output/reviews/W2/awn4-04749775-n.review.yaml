        وَتَشَاكُلِهِ لَوْنًا وَوَصْفًا. يُقَالُ شِبْهٌ وَشَبَهٌ وَشَبِيهٌ.
        وَاشْتَبَهَ الْأَمْرَانِ، إِذَا أَشْبَهَ كُلٌّ مِنْهُمَا الْآخَرَ»

    - lemma: "تَطَابُق"
