        وَهَذَا مِثْلُ هَذَا، أَيْ نَظِيرُهُ، وَالْمِثْلُ وَالْمِثَالُ فِي مَعْنًى وَاحِدٍ.
        وَرُبَّمَا قَالُوا مَثِيلٌ كَشَبِيهٍ»

