# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13600369-n (point system)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «نظام النقاط» مركب إضافي يستخدم «النقاط» بمعناها العام (points) لا بمعنى وحدة القياس الطباعية؛ بينما المصطلح المعجمي المكرَّس لوحدة قياس حجم الحرف الطباعي هو «البُنْط» لا «النقطة»"
      - "اللمّة الموجودة خالية من التشكيل"
      - "المجموعة تحتوي لمّة واحدة فقط — تحتاج إثراء"
    observations: "المفهوم المقصود هو نظام تدريج أحجام الحروف الطباعية بمضاعفات وحدة قياس اسمها «النقطة» (point) في الطباعة الغربية، يقابلها في العربية مصطلح «البُنْط» المسجّل في المعجم الوسيط والمعجم الكبير ومعجم اللغة العربية المعاصرة. التعريف الحالي لا بأس به لكنه يعتمد على كلمة «النقطة» العامة بدل المصطلح الطباعي الدقيق."
  blind_candidates:
    - lemma: "نِظَامُ البُنْط"
      generation_method: tarkib
      justification: "مركب إضافي يستخدم «البنط» وهو المصطلح المعجمي المكرَّس لوحدة قياس حجم الحرف الطباعي، مع «نظام» الدال على المنظومة القياسية"
    - lemma: "التَّبْنِيط"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفْعِيل من الجذر المعرَّب «بنط»، يدلّ على عملية تدريج الحروف بوحدة البنط"
    - lemma: "سُلَّمُ الطِّبَاعَة"
      generation_method: tarkib
      justification: "مركب إضافي يجمع «سُلَّم» (مقياس تدريجي) مع «الطباعة»، على نمط سُلَّم الحرارة وسُلَّم رِخْتَر"
    - lemma: "البُنْطِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «بنط» على وزن فُعْلِيَّة، يدلّ على النظام المبني على وحدة البنط"


stage2_evidence:
  per_lemma:
    - lemma: "نِظَامُ النُّقَاط"
      evidence_status: "no_material_found"

    - lemma: "نِظَامُ البُنْط"
      confirm:
        - text: "«(في اصطلاح الطِّباعة): وَحدة لقياس حجم الحرف. يقال: حرف ذو اثنى عشر بنطاً»"
          source: "المعجم الوسيط"
        - text: "«بُنْط [مفرد]: ج أبناط وبنوط: وحدة لقياس حجم الحرف»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«(في اصطلاح سوق العقود المصرية): جزء من مائة جزء ينقسم إليها الريال»"
          source: "المعجم الوسيط"
          addition: "للبنط دلالة ثانية في سوق العقود المصرية لا علاقة لها بالطباعة"
        - text: "«بُنْط (بالإيطالية Ponte) هو في مصطلح البحرية: سطح المركب. وبُنْط (أسبانية) جمعها أبناط: نقطة تكتب في نهاية الجملة»"
          source: "تكملة المعاجم العربية لدوزي"
          addition: "أصل الكلمة من الإيطالية والإسبانية، مما يؤكد أنها معرَّبة"

    - lemma: "التَّبْنِيط"
      evidence_status: "no_material_found"

    - lemma: "سُلَّمُ الطِّبَاعَة"
      evidence_status: "no_material_found"

    - lemma: "البُنْطِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "نِظَامُ النُّقَاط"
      decision: confirmed
      decision_reason: "المركب «نظام النقاط» ترجمة حرفية لـ point system ومفهوم من السياق، لكنه يعتمد على «النقاط» بمعناها العام. رغم ذلك يُبقى لأنه الأقرب للفهم العام ويعمل كتوصيف شفّاف للمفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير شفّاف وصفي يركّز على مفهوم «النقاط» بمعناها الهندسي العام، مناسب للسياقات غير المتخصصة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَامُ النُّقَاط"

    - lemma: "نِظَامُ البُنْط"
      source: stage1
      decision: confirmed
      decision_reason: "«البنط» مصطلح طباعي مسجّل في المعجم الوسيط والمعجم الكبير ومعجم اللغة العربية المعاصرة بمعنى وحدة قياس حجم الحرف الطباعي. المركب «نظام البنط» أدقّ من «نظام النقاط» لأنه يستخدم المصطلح التخصصي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يستخدم المصطلح التخصصي «البنط» المكرَّس في المعاجم الحديثة، أنسب في السياقات الطباعية المتخصصة"
      actions:
        - command: create_entry
          params: {lemma: "نِظَامُ البُنْط", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "التَّبْنِيط"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على وجود هذا المصدر، ولا يدلّ على «النظام» بل على «العملية»، فلا يصلح مرادفاً لـ point system"

    - lemma: "سُلَّمُ الطِّبَاعَة"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي حرّ غير مسكوك ولا مسجّل في أي معجم، ويفتقر إلى التحديد (سلّم الطباعة لا يدلّ تحديداً على نظام النقاط)"

    - lemma: "البُنْطِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية، والمصدر الصناعي هنا يوحي بمفهوم مجرّد (صفة كون الشيء بنطياً) لا بنظام قياس محدد"


stage4_content:
  definition:
    current: "نظام لتدريج أحجام الحروف الطباعية بمضاعفات النقطة"
    assessment:
      decision: revise
      reason: "التعريف مقبول في بنيته العامة لكنه يستخدم «النقطة» دون تحديد أنها وحدة قياس طباعية (البنط)، كما ينبغي ربطه بالجنس القريب (نظام قياس)"
    authored:
      - type: terminological
        text: "نِظَامُ قِيَاسٍ طِبَاعِيٌّ تُدَرَّجُ فِيهِ أَحْجَامُ الحُرُوفِ بِمُضَاعَفَاتِ وَحْدَةِ البُنْطِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "نِظَامٌ مُعْتَمَدٌ فِي صِنَاعَةِ الطِّبَاعَةِ لِتَوْحِيدِ أَحْجَامِ الحُرُوفِ المَطْبَعِيَّةِ، يَقُومُ عَلَى اتِّخَاذِ البُنْطِ وَحْدَةً أَسَاسِيَّةً وَتَدْرِيجِ الأَحْجَامِ بِمُضَاعَفَاتِهَا، فَالحَرْفُ ذُو اثْنَيْ عَشَرَ بُنْطًا يُسَاوِي سُدُسَ البُوصَةِ تَقْرِيبًا"
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "نِظَامُ قِيَاسٍ طِبَاعِيٌّ تُدَرَّجُ فِيهِ أَحْجَامُ الحُرُوفِ بِمُضَاعَفَاتِ وَحْدَةِ البُنْطِ"}

  examples:
    per_lemma:
      - lemma: "نِظَامُ النُّقَاط"
        examples:
          - text: "يَعْتَمِدُ المُصَمِّمُونَ عَلَى نِظَامِ النُّقَاطِ فِي تَحْدِيدِ حَجْمِ خُطُوطِ العَنَاوِينِ وَالمُتُونِ"
            type: usage
      - lemma: "نِظَامُ البُنْط"
        examples:
          - text: "طُبِعَ الكِتَابُ وَفْقَ نِظَامِ البُنْطِ الأَمْرِيكِيِّ بِحَجْمِ اثْنَيْ عَشَرَ بُنْطًا لِلْمَتْنِ"
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يَعْتَمِدُ المُصَمِّمُونَ عَلَى نِظَامِ النُّقَاطِ فِي تَحْدِيدِ حَجْمِ خُطُوطِ العَنَاوِينِ وَالمُتُونِ"}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "طُبِعَ الكِتَابُ وَفْقَ نِظَامِ البُنْطِ الأَمْرِيكِيِّ بِحَجْمِ اثْنَيْ عَشَرَ بُنْطًا لِلْمَتْنِ"}


