stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية تفتقر إلى التشكيل الكامل."
    observations: "المفهوم علمي بيولوجي أساسي، وقد استقرت المصطلحات العربية على (انقسام الخلية) و(انقسام خلوي) كتعبير اصطلاحي دقيق."
  blind_candidates:
    - lemma: "اِنْقِسَامٌ خَلَوِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر بدقة عن عملية انقسام الخلية، وهو شائع في الاستخدام العلمي."
    - lemma: "اِنْقِسَامُ الخَلِيَّةِ"
      generation_method: tarkib
      justification: "تركيب إضافي مباشر وواضح يؤدي نفس المعنى."
    - lemma: "اِنْشِطَارٌ خَلَوِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يشير إلى عملية الانشطار التي تحدث للخلايا."
    - lemma: "تَضَاعُفٌ خَلَوِيٌّ"
      generation_method: tarkib
      justification: "يشير إلى نتيجة الانقسام وهي تضاعف عدد الخلايا."

stage2_evidence:
  per_lemma:
    - lemma: "اِنْقِسَامٌ خَلَوِيٌّ"
      confirm:
        - text: "«انقسام خلوي»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "اِنْقِسَامُ الخَلِيَّةِ"
      confirm:
        - text: "«وبه تتولد خليتان وليدتان من خلية واحدة.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "اِنْشِطَارٌ خَلَوِيٌّ"
      expands:
        - text: "«انشطار ثنائيّ للخلية بعد انقسام النواة، أو انشطار لا نوويّ.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "مصطلح يشير لعملية أكثر تخصصاً (fission) وليس الانقسام العام."
    - lemma: "تَضَاعُفٌ خَلَوِيٌّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "انقسام الخلية"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد ومثبت في المعاجم المتخصصة، ويحتاج إلى ضبط بالتشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "تعبير بالتركيب الإضافي يركز على الخلية ككيان يقع عليه الانقسام."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْقِسَامُ الخَلِيَّةِ"
    
    - lemma: "انقسام خلوي"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد وشائع جداً في علوم الأحياء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance: "تعبير بالتركيب الوصفي يركز على نوع الانقسام بأنه ذو طبيعة خلوية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْقِسَامٌ خَلَوِيٌّ"

    - lemma: "اِنْشِطَارٌ خَلَوِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "المصطلح يقابل (cellular fission) بالإنجليزية وهو أكثر تخصصاً من الدلالة العامة لانقسام الخلية."

    - lemma: "تَضَاعُفٌ خَلَوِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "لا توجد أدلة معجمية تدعم استخدامه كمرادف مباشر لانقسام الخلية."

stage4_content:
  definition:
    current: "العملية في التكاثر والنمو التي تنقسم بها الخلية لتكوين خلايا وليدة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق علمياً ولكنه يحتاج إلى صياغة بأسلوب معجمي عربي أمتن."
    authored:
      - type: terminological
        text: "عملية حيوية تنقسم بها الخلية لتكوين خلايا وليدة، وتؤدي دوراً أساسياً في نمو الكائنات الحية وتكاثرها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية حيوية تنقسم بها الخلية لتكوين خلايا وليدة، وتؤدي دوراً أساسياً في نمو الكائنات الحية وتكاثرها."

  examples:
    per_lemma:
      - lemma: "انقسام الخلية"
        examples:
          - text: "يمكن ملاحظة أطوار انقسام الخلية تحت المجهر الضوئي."
            type: usage
      - lemma: "انقسام خلوي"
        examples:
          - text: "يعتمد نمو الأنسجة وتعويض التالف منها على عملية الانقسام الخلوي المستمرة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يعتمد نمو الأنسجة وتعويض التالف منها على عملية الانقسام الخلوي المستمرة."

stage5_enrichment:
  per_entry:
    - lemma: "اِنْقِسَامُ الخَلِيَّةِ"
      entry_id: "{auto}"
      roots:
        - word: "انقسام"
          root: "قسم"
          maqayis_quote: "«الْقَافُ وَالسِّينُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى جَمَالٍ وَحُسْنٍ وَالْآخَرُ عَلَى تَجْزِئَةِ شَيْءٍ.»"
        - word: "الخلية"
          root: "خلو"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَعَرِّي الشَّيْءِ مِنَ الشَّيْءِ.»"
    
    - lemma: "اِنْقِسَامٌ خَلَوِيٌّ"
      entry_id: "{auto}"
      roots:
        - word: "انقسام"
          root: "قسم"
          maqayis_quote: "«الْقَافُ وَالسِّينُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى جَمَالٍ وَحُسْنٍ وَالْآخَرُ عَلَى تَجْزِئَةِ شَيْءٍ.»"
        - word: "خلوي"
          root: "خلو"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَعَرِّي الشَّيْءِ مِنَ الشَّيْءِ.»"

  per_sense:
    - lemma: "انقسام الخلية"
      sense_id: "{auto}"
