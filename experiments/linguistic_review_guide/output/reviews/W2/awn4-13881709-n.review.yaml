# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13881709-n (gradient)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «مَيْل» مشتركة لفظياً بين عدة دلالات: وحدة مسافة، مِكحال، ميل نفسي، انحراف فيزيائي؛ يُحتاج إلى تمييز السياق"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزية وينقصه الدقة المصطلحية"
      - "لا يوجد تمييز بين التدرج الرياضي (المتجه) والتدرج العام (التغير المتدرج)"
    observations: "المجموعة تمثل مفهوم gradient الفيزيائي/الرياضي، وهو معدل تغير كمية فيزيائية بالنسبة إلى المسافة. اللمّتان الموجودتان — تَدَرُّج ومَيْل — مصطلحان مسكوكان في المعاجم العلمية العربية المعتمدة (ALECSO). المفهوم له جذور في اللغة العربية الكلاسيكية عبر دلالة الانحراف والتدرج."
  blind_candidates:
    - lemma: "مَيْل"
      generation_method: majaz
      justification: "الميل أصلاً بمعنى الانحراف عن الاستواء عند ابن فارس، يُستعار للتغير التدريجي في كمية فيزيائية بالنسبة إلى بُعد مكاني"
    - lemma: "اِنْحِدَار"
      generation_method: ishtiqaq
      justification: "مصدر انحدرَ من جذر ح-د-ر على وزن اِنْفِعَال، يدل على النزول التدريجي ويُستعمل في الجيولوجيا والهندسة للدلالة على المَيْل والتدرج"
    - lemma: "تَفَاوُت"
      generation_method: ishtiqaq
      justification: "مصدر تفاوتَ من جذر ف-و-ت على وزن تَفَاعُل، يدل على الاختلاف في التقدير بين شيئين، قد يصلح للتغير التدريجي في المقادير"
    - lemma: "مُنْحَدَر"
      generation_method: ishtiqaq
      justification: "اسم مكان ومفعول من انحدرَ على وزن مُنْفَعَل، يدل على السطح المائل ويُستعمل في المعاجم العلمية مقابلاً لـ gradient في الجيولوجيا"

stage2_evidence:
  per_lemma:
    - lemma: "تَدَرُّج"
      confirm:
        - text: "«معدل تغير المنسوب أو السرعة أو الضغط أو الحرارة أو متحول آخر — مَيْل (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«في منحنٍ معين، هو ميل أي جزء مختار من هذا المنحنى»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
        - text: "«ميل، تدرج = gradient»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«تدرّج = gradient»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«تدرج = Gradient»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
      expands:
        - text: "«كمية فيزيائية مُتجهة تصف بالتدرجات الرياضية شدة ارتباط درجة الحرارة بالمكان، وفي أي اتجاه تبلغ ذروتها»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يبيّن أن التدرج كمية متجهة لها شدة واتجاه"
        - text: "«مطاوع دَرَّجَه. يقال: دَرَّجَه فتدرَّج — فلانٌ إليه: تَمَشَّى. وقيل: تَقَدَّمَ شيئاً فشيئاً — في الشيء: تَصَعَّدَ درجةً درجةً»"
          source: "المعجم الكبير"
          addition: "الأصل اللغوي: التقدم شيئاً فشيئاً، وهو أساس الإزاحة الدلالية إلى المفهوم العلمي"
      contradicts:
        - text: "«طائر حَسَن الصُّورة أرقش شَبيه بالدِّيك إلا أنه أطولُ منه ذَيلاً»"
          source: "المعجم الكبير"
          conflict: "التَّدْرُج (بسكون الدال وضم الراء) اسم طائر من الفَزَان (pheasant)، وهو اشتراك لفظي لا يؤثر لاختلاف الضبط والسياق"

    - lemma: "مَيْل"
      confirm:
        - text: "«مَيْل = gradient / incline / slope»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«مَيْل = slope»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«ميل = slant; slope»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«درجة الميل، معدل الانحدار = gradient — معدل تغير الارتفاع، والسرعة، والضغط، ودرجة الحرارة، أو العوامل الأخرى»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«المَيْلُ: العُدُولُ عَنِ الوَسَط إلى أَحَد الجانبين، ويُستعمَلُ في الجَوْر»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "الأصل الدلالي: العدول عن الاستواء، وهو أساس التوسع إلى الميل الفيزيائي"
        - text: "«الميل: حالة تعرض للجسم مغايرة للحركة تقتضيه الطبيعة بواسطتها لو لم يعق عائق»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "تعريف فلسفي للميل كمفهوم فيزيائي عند الحكماء"
        - text: "«الميل: بعد الشَّمْس أو الكوكب عن معدل النَّهَار»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "استعمال فلكي قديم لميل يدل على الانحراف الزاوي"
      contradicts:
        - text: "«مَنَارٌ يُبْنَى للمسافر في الطريق يهتدى به ويدلُّ على المسافة — مقياسٌ للطول قُدِّر قديماً بأربعة آلاف ذراع»"
          source: "المعجم الوسيط"
          conflict: "المِيل (بكسر الميم) وحدة مسافة، مختلف عن المَيْل (بفتح الميم) بمعنى الانحدار والانحراف — الضبط يفرق بينهما"

    - lemma: "اِنْحِدَار"
      confirm:
        - text: "«انحدار، تدرج = gradient»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«انحدار = slope — سطح مائل في تل أو جبل»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«انحدار السطح = surface slope / surface gradient»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      contradicts:
        - text: "«انحدار = declination»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "في الرياضيات والفلك يُستعمل الانحدار بمعنى الانحطاط (declination) لا التدرج (gradient)"
        - text: "«انحدار خطيّ = linear regression»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "في الإحصاء يُستعمل الانحدار بمعنى regression لا gradient"

    - lemma: "تَفَاوُت"
      contradicts:
        - text: "«التفاوت: الاختلاف في الأوصاف كأنه يفوت وصف أحدهما الآخر، أو وصف كل منهما الآخر، وأصله عدم التناسب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "التفاوت يدل على عدم التناسب والاختلاف المطلق، لا على التغير التدريجي المنتظم الذي يدل عليه gradient"
        - text: "«تفاوت الشيئان: اختلفا في التقدير»"
          source: "المعجم الوسيط"
          conflict: "الاختلاف في التقدير مفهوم عام لا يتضمن معنى التدرج المكاني المحدد"

    - lemma: "مُنْحَدَر"
      confirm:
        - text: "«مُنْحَدَر، خَيْف = gradient — الخيف: كل هبوط وارتقاء في سفح الجبل»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«مُنْحَدر = slope»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      contradicts:
        - text: "«مُنْحَدَر = slope»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "المنحدر اسم مكان/مفعول يدل على السطح المائل ذاته لا على معدل التغير المجرد، فهو أقرب إلى slope منه إلى gradient"

stage3_analysis:
  per_lemma:
    - lemma: "تَدَرُّج"
      decision: confirmed
      decision_reason: "مصطلح مسكوك ومعتمد في معاجم ALECSO للهندسة المدنية والرياضيات والاستشعار والأحياء والفيزياء مقابلاً لـ gradient. مشتق من جذر د-ر-ج بمعنى التقدم شيئاً فشيئاً، وهو إزاحة دلالية طبيعية. الاشتراك اللفظي مع طائر التَّدْرُج لا يؤثر لاختلاف الضبط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل تَدَرُّج للدلالة على معدل التغير المتدرج (rate of graded change) كمفهوم رياضي/فيزيائي مجرد، وهو المصطلح الأولي والأكثر تخصصاً لـ gradient"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَدَرُّج"

    - lemma: "مَيْل"
      decision: confirmed
      decision_reason: "مصطلح معتمد في معاجم ALECSO للمياه والهندسة والرياضيات مقابلاً لـ gradient وslope. أصله الدلالي عند ابن فارس وأهل اللغة: الانحراف عن الاستواء. الاشتراك اللفظي مع المِيل (وحدة المسافة) يُفرَّق بينهما بالضبط (المَيْل بالفتح مقابل المِيل بالكسر)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل مَيْل للدلالة على الانحدار الهندسي والانحراف عن الأفقي (slope/inclination)، وهو أعم من تَدَرُّج إذ يشمل الميل الهندسي البسيط دون اشتراط تعدد الأبعاد الفيزيائية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَيْل"

    - lemma: "اِنْحِدَار"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «انحدار، تدرج» معاً مقابل gradient في معجم الفيزياء، فإن انحدار مشترك لفظياً مع regression في الإحصاء وdeclination في الفلك، ويدل أساساً على السطح المائل لا على معدل التغير المجرد. إضافته تزيد الغموض دون فائدة دلالية."

    - lemma: "تَفَاوُت"
      source: stage1
      decision: removed
      decision_reason: "التفاوت يدل على الاختلاف المطلق وعدم التناسب، لا على التغير التدريجي المنتظم في كمية فيزيائية بالنسبة إلى بُعد مكاني. لا صلة دلالية كافية بمفهوم gradient."

    - lemma: "مُنْحَدَر"
      source: stage1
      decision: removed
      decision_reason: "المنحدر اسم مكان/مفعول يدل على السطح المائل ذاته (slope as a physical surface)، لا على معدل التغير المجرد (gradient as a rate). ورد في معجم الجيولوجيا مقابلاً لـ gradient لكن بمعنى جغرافي محسوس لا رياضي مجرد."

