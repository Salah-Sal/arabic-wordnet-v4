# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين (خمول، عطالة) تفتقران إلى التشكيل الكامل"
      - "لمّة «عطالة» تحمل في المصطلح العلمي الحديث معنى «inertia» الفيزيائي (خاصية الجسم في الثبات)، وهو مختلف عن المعنى النفسي «الميل إلى الخمول» المراد في هذه المجموعة"
      - "التعريف العربي فيه تكرار دلالي: «غير نشط أو خامل» مفهومان متقاربان جداً ولم يُضِف الثاني جديداً على الأول"
      - "لا يوجد في المجموعة لمّة تعبّر عن البُعد النفسي الراسخ (disposition) وتميّزه من مجرد حالة الخمول الظرفية"
    observations: >
      تصف المجموعة awn4-04642988-n خصلةً شخصية راسخة هي «الميل الفطري أو المكتسب إلى تجنّب النشاط».
      «خمول» لفظ عربي أصيل أصله «الخفاء والانخفاض» (مقاييس اللغة) وقد امتدّ في الاستعمال المعاصر
      ليشمل الكسل وانعدام الهمّة. أما «عطالة» فأصلها «الخلو والفراغ» وهي في المصطلح الموحّد ترجمة
      راسخة لـ«inertia» الفيزيائية، مما يوجد التباساً دلالياً. اللمّتان صحيحتان في الاستعمال لكن
      المجموعة تحتاج تعريفاً أكثر دقة وتشكيلاً كاملاً للمّتين.

  blind_candidates:
    - lemma: "تَقَاعُس"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل «تقاعَسَ» على وزن تَفَاعُل من جذر (ق ع س)، يدلّ على الإحجام والتأخر والإمساك عن
        الفعل. ورد في المعجم الوسيط: «عن الأمر: تأخَّر»، وهو يلائم دلالة الميل إلى عدم النشاط.
    - lemma: "فُتُور"
      generation_method: ishtiqaq
      justification: >
        مصدر «فَتَرَ» على وزن فُعُول من جذر (ف ت ر)، يدلّ على الضعف والوهن في الشيء. قال ابن فارس:
        «الفاء والتاء والراء أصل صحيح يدل على ضعف في الشيء». يناسب دلالة الميل إلى الكمود وعدم النشاط.
    - lemma: "خُمُود"
      generation_method: majaz
      justification: >
        من جذر (خ م د)، أصله خمود النار (انطفاؤها)، مستعمل مجازاً للدلالة على فتور الهمّة وانطفاء
        العزيمة. الإزاحة الدلالية من انطفاء النار إلى انطفاء النشاط مشابهة وظيفية واضحة.
    - lemma: "تَكاسُل"
      generation_method: ishtiqaq
      justification: >
        مصدر «تكاسَلَ» على وزن تَفَاعُل من جذر (ك س ل)، يدلّ على تعمّد الكسل والتثاقل. عرّفه
        البركتي بأنه «التثاقل عما لا ينبغي أن يتثاقل عنه»، وهو يلائم دلالة الخصلة الراسخة للكسل.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة:
#   Q1: مطابقة دفعية للمّات الموجودة + المرشحات (خمول/الخمول، عطالة/العطالة،
#       تقاعس/التقاعس، خمود/الخمود، ركود/الركود، تكاسل/التكاسل)
#   Q2: إثراء (تعريفات + أمثلة) بمعرّفات الإدخال
#   Q3: جسر إنجليزي (inactiveness / inactivity / inertia / idleness / lethargy / torpor)
#   Q4: مقاييس اللغة لجذور: خمل، عطل، كسل، قعد، فتر، ركد
#   Q5: FTS عربي (خمول، خامل، كسل، فتور، قعود، تقاعس)
stage2_evidence:
  per_lemma:

    - lemma: "خمول"
      confirm:
        - text: "«خمَل الرَّجلُ: كسِل. خُمُول: مصدر خمَلَ. خمول الذِّكر: ضعة الشأن وسفالة المنزلة.
            أخمله الكسلُ: أضعفه وأوهنه وأفقده النشاطَ والهمَّة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«خمول، قصور ذاتي، عطالة» = inertia"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«خمول، فتور» = apathy"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«لخمول» = lethargy"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«اللامُبالاة؛ فُتُورُ الشُّعُوْر؛ خُمُوْلٌ» = apathy"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الخمول: خفاء القدر والذكر، وأصله السكون والخفاء، ومنه خمل البساط لأنه يستر ما خلفه»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: >
            يكشف أن الأصل الكلاسيكي للخمول هو الخفاء وعدم الظهور لا الكسل مباشرة؛ الاستعمال المعاصر
            وسَّع المعنى ليشمل انعدام الهمّة والنشاط.
        - text: "«الْخَاءُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى انْخِفَاضٍ وَاسْتِرْسَالٍ وَسُقُوطٍ.
            يُقَالُ خَمَلَ ذِكْرُهُ يَخْمُلُ خُمُولًا. وَالْخَامِلُ: الْخَفِيُّ؛ يُقَالُ: هُوَ خَامِلُ الذِّكْرِ؛
            وَالْأَمْرُ الَّذِي لَا يُعْرَفُ وَلَا يُذْكَرُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر اللغوي يدل على الانخفاض والاسترسال والسقوط، مما يمنح «خمول» أساساً اشتقاقياً قوياً
            للدلالة على الكمود وانعدام النشاط.

    - lemma: "عطالة"
      confirm:
        - text: "«خاصية الأشياء بحيث تبقى ساكنة أو بحركة مستقيمة منتظمة مالم تطبَّق عليها قوة خارجية» = inertia"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«عَطالَة» = inertia"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«عطالة» = inertia"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
        - text: "«تبطل؛ تعطل؛ كسَل» = idleness"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«خاصية الأشياء بحيث تبقى ساكنة أو بحركة مستقيمة منتظمة مالم تطبَّق عليها قوة خارجية»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: >
            هذا المعنى (قانون نيوتن الأول) فيزيائي مغاير للمعنى النفسي المقصود في المجموعة (الميل
            الإرادي للخمول). الخلط بين المعنيين يولّد التباساً مصطلحياً.
      expands:
        - text: "«الْعَيْنُ وَالطَّاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى خُلُوٍّ وَفَرَاغٍ.
            نَقُولُ: عُطِّلَتِ الدَّارُ، وَدَارٌ مُعَطَّلَةٌ. وَمَتَى تُرِكَتِ الْإِبِلُ بِلَا رَاعٍ فَقَدْ
            عُطِّلَتْ. قَالَ اللَّهُ تَعَالَى: {وَإِذَا الْعِشَارُ عُطِّلَتْ}»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            أصل «عطل» الخلو والفراغ من الحافظ والعمل، يدعم دلالة عدم الاشتغال وترك النشاط، لكنه
            دلالة وضعية (ترك الشيء خالياً) لا نفسية ذاتية.

    - lemma: "تَقَاعُس"
      confirm:
        - text: "«(تقاعس) أخرج صدره وعن الأمر تأخَّر والفرس ونحوه لم ينقد لقائده والعز ثبت وامتنع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«عن الأمر: تأخَّر»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
      expands:
        - text: "«(1) التقاعس: تقاعس عن تحميل أو تفريغ سفينة أو شاحنة ضمن المدة المتفق عليها
            (2) غرامة التقاعس» = demurrage"
          source: "المورد الحديث (2008)"
          addition: >
            تقاعس تحوَّل إلى مصطلح بحري تجاري بمعنى الإخلال بالتحميل في الموعد، مما يُضيِّق دلالته
            ويبعده عن المعنى النفسي العام للخمول.

    - lemma: "خُمُود"
      contradicts:
        - text: "«حفرةٌ تدفن فيها النار لتُخمد»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            المعنى المعجمي الراسخ للخمود هو المكان أو الحالة المادية المرتبطة بإطفاء النار،
            لا الميل النفسي للخمول.
        - text: "«خمود» = damping"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "في المصطلح العلمي يعني التخميد (إضعاف الاهتزازات) لا الخمول النفسي."
        - text: "«خمود: نقص شدة الألم أو غيره من الأعراض المرضية» = abatement"
          source: "معجم المصطلحات الطبية ج.1 (1985)"
          conflict: "في المصطلح الطبي يعني تراجع الأعراض لا الخمول النفسي."
      expands:
        - text: "«الخُمُودُ: ضعف القوة الشهوية عن تناول ما ينبغي في الشرع»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
          addition: "دلالة دينية فقهية مخصوصة لا تعمّم على الميل العام للخمول."

    - lemma: "تَكاسُل"
      confirm:
        - text: "«التكاسل: هو التثاقلُ عما لا ينبغي أن يتثاقل عنه، والتواني عنه والفتورُ فيه»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
        - text: "«(تكاسل) تعمَّد الكسل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«الكَافُ وَالسِّينُ وَاللَّامُ أَصْلٌ صَحِيحٌ، وَهُوَ التَّثَاقُلُ عَنِ الشَّيْءِ
            وَالْقُعُودُ عَنْ إِتْمَامِهِ أَوْ عَنْهُ. مِنْ ذَلِكَ الْكَسَلُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (ك س ل) يدل أصالةً على التثاقل والقعود عن الشيء، وهو أصل دلالي قوي."


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "خمول"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة راسخة في المعجم العربي الكلاسيكي والمعاصر، تدلّ على الكسل وانعدام الهمّة والنشاط.
        المعجم المعاصر يؤكد استخدامها بمعنى الكسل وفقدان النشاط. تشكيلها الصحيح «خُمُول» وهو ما
        يجب تسجيله بالتشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «خُمُول» يركز على الجانب الاجتماعي والذهني: الخفاء وانعدام الفاعلية والحضور في المجتمع.
        أصله «خفاء الذكر» ثم امتدّ للكسل وانعدام الهمّة. يُستعمل في السياق الإنساني والنفسي
        بامتياز، ويحمل إيحاءً بالتقصير الإرادي في الظهور والإنجاز.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُمُول"

    - lemma: "عطالة"
      decision: confirmed
      decision_reason: >
        رغم الالتباس بين المعنى الفيزيائي (inertia) والنفسي، فإن «عطالة» مستخدمة في المعاجم
        بمعنى الخلو من النشاط والعمل، وقد وردت في المورد الحديث بمعنى «تبطّل؛ كسَل». أصلها
        اللغوي «الخلو والفراغ» يدعم دلالة ترك العمل. تشكيلها الصحيح «عَطَالة».
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «عَطَالة» تركز على الجانب الوظيفي والمادي: الفراغ من العمل وانعدام الاشتغال (كالدار
        المعطَّلة من ساكنيها). تُستعمل أكثر في السياقات التقنية والاقتصادية، وتحمل ظلاًّ من
        الخسارة الناجمة عن الإهمال. تختلف عن «خُمُول» الأثقل وزناً في السياق النفسي والأخلاقي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَطَالة"

    - lemma: "تَقَاعُس"
      source: stage1
      decision: removed
      decision_reason: >
        «تَقَاعُس» في المعاجم فعلٌ بالأساس (تقاعَسَ)، ودلالته مقيّدة بـ«التأخر عن أمر بعينه»
        لا «الميل العام الراسخ للخمول». كما أن استعماله في المصطلح البحري التجاري (demurrage)
        يُضيّق معناه ويمنع عموميته اللازمة لهذا السياق النفسي.

    - lemma: "خُمُود"
      source: stage1
      decision: removed
      decision_reason: >
        «خُمُود» معجمياً = حفرة إطفاء النار، وفي المصطلح العلمي = damping (فيزياء) وabatement
        (طب). الاستعمال المجازي في الخمول ممكن نظرياً لكنه غير موثَّق كمصطلح مسكوك للدلالة
        النفسية المطلوبة، وكثرة معانيه التقنية تحول دون توظيفه.

    - lemma: "تَكاسُل"
      source: stage1
      decision: removed
      decision_reason: >
        «تَكاسُل» يدلّ على الكسل المتعمَّد وهو أضيق من «الميل الراسخ للخمول». يوجد في المجموعة
        «خُمُول» الذي يغطّي هذه الدلالة بصورة أشمل وأدقّ، وإضافة «تكاسل» لن تُضيف فارقاً
        دلالياً مميَّزاً بل ستُحدث تداخلاً.

    - lemma: "فُتُور"
      source: stage1
      decision: removed
      decision_reason: >
        «فُتُور» يدلّ على الضعف المؤقت والوهن الطارئ (ابن فارس: «يدل على ضعف في الشيء»)،
        بينما المجموعة تصف خصلةً راسخة (disposition). الفتور حال ظرفية عارضة لا سمة شخصية
        ثابتة، لذا لا يلائم هذا المفهوم.


