step0_evidence:
  per_lemma:
    - lemma: "جَاثٍ عَلَى رُكْبَتَيْه"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "العبارة وردت في المعاجم كشرح وتوصيف لحالة الجثو (مثل: صورة رجل جاث على ركبتيه)، وليست مدخلا معجميا مستقلا."
    - lemma: "رَاكِع"
      confirm:
        - text: "«راكع: وضع جاثي» — المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      expands:
        - text: "«(1) يركع؛ يسجد؛ يجثو (2) ركوع» — المورد الحديث (2008)"
          addition: "يضيف معنى السجود والانحناء العام إضافة إلى الجثو."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جَاثٍ"
      source_section: "step4_fts_keyword"
      evidence_citation: "«جَثْواً, وجُثِيًّا: جلس على ركبتيه... فهو جاث» — المعجم الوسيط"
      justification: "اشتقاق: اسم الفاعل من الفعل جثا، وهو المعبر الدقيق عن وضعية الارتكاز على الركبتين."

step1_lemma_validation:
  per_lemma:
    - lemma: "جَاثٍ عَلَى رُكْبَتَيْه"
      decision: removed
      decision_reason: "تركيب وصفي حر وليس مصطلحا مسكوكا. كلمة 'جاثٍ' وحدها تكفي وتؤدي المعنى كاملا، وإضافة 'على ركبتيه' هو من قبيل التفسير."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "عبارة وصفية وليست مصطلحا، تقابلها كلمة 'جاثٍ' المفردة والمستقرة معجميا."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
            
    - lemma: "رَاكِع"
      decision: confirmed
      decision_reason: "مصطلح مستقر يستعمل لوصف من ينحني أو يجثو، وإن كان يغلب عليه الانحناء الديني في الثقافة الإسلامية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الانحناء أو التطأطؤ، وغالبا ما يرتبط بوضع الركوع في الصلاة حيث لا تلامس الركبتان الأرض، ولكنه يستعمل في الترجمات الحديثة بمعنى الجاثي."
      example: "بقي الأسير رَاكِعاً أمام آسره يطلب الرحمة."

    - lemma: "جَاثٍ"
      source: step05
      decision: confirmed
      decision_reason: "اللفظ الأدق والمطابق تماما لمفهوم الارتكاز على الركبتين."
      step05_citation: "«جَثْواً, وجُثِيًّا: جلس على ركبتيه... فهو جاث» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الارتكاز التام على الركبتين (الجثو)، وهو الأدق في التعبير عن المفهوم الإنجليزي (kneeler) من كلمة راكع."
      example: "تحدث إلى الطفل وهو جَاثٍ أمامه ليكون في مستوى نظره."
      actions:
        - command: create_entry
          params:
            lemma: "جَاثٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10257969-n"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "جَاثٍ"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

step3_definition:
  definition_review_flag: true
  current_definition: "شخص في وضع الركوع"
  assessment:
    decision: revise
    reason: "الركوع في العربية هو الانحناء بالظهر، بينما الجثو هو الارتكاز على الركبتين. التعريف الحالي غير دقيق في نقل المفهوم."
  authored_definitions:
    - type: terminological
      text: "شخص جالس ومرتكز على ركبتيه."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-10257969-n"
        definition_index: 0
        text: "شخص جالس ومرتكز على ركبتيه."

