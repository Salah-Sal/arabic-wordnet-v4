        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"افق","maqayis":"«الْهَمْزَةُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَبَاعُدِ مَا بَيْنَ أَطْرَافِ الشَّيْءِ وَاتِّسَاعِهِ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"تواز","root":"وزي","maqayis":"«الْوَاوُ وَالزَّاءُ وَالْحَرْفُ الْمُعْتَلُّ...»"},{"word":"أفقي","root":"افق","maqayis":"«الْهَمْزَةُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ...»"}]}'
    - command: set_metadata
      params:
