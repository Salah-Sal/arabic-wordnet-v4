stage1_review:
  assessment:
    concerns:
      - وجود لمة واحدة فقط للمجموعة.
      - التعريف العربي مقتضب جداً.
    observations: |
      اللفظ الموجود "أُفُقِيَّة" هو المصطلح المعياري الدقيق لهذه الصفة في اللغة العربية الحديثة، وهو مصاغ على وزن المصدر الصناعي (ـيّة) من الصفة "أُفُقِيّ". المفهوم تقني هندسي يتعلق بموازاة مستوى الأفق.
  blind_candidates:
    - lemma: "أُفُقِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي المعياري للتعبير عن صفة كَوْن الشيء أفقياً."
    - lemma: "تَوَازٍ أُفُقِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر بدقة عن 'التوازي مع الأفق' الوارد في التعريف."
    - lemma: "اسْتِوَاء"
      generation_method: ishtiqaq
      justification: "لفظ يعبر عن حالة الاعتدال وعدم الميل، وغالباً ما يرتبط بالأفق في السياقات المعمارية والجغرافية."
    - lemma: "تَسَطُّح"
      generation_method: ishtiqaq
      justification: "يعبر عن كون الشيء سطحاً مستوياً، وهو مفهوم قريب من الأفقية."

stage2_evidence:
  per_lemma:
    - lemma: "أُفُقِيَّة"
      confirm:
        - text: "«طريقة لتمديد الأنابيب يجبر فيها الأنبوب على الدخول في فتحة أفقية...»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«زاوية أفقية (horizontal angle)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«إحداثيات أفقية (horizontal coordinates)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "تؤكد استخدام اللفظ كصفة في سياقات هندسية وعلمية دقيقة."
    - lemma: "تَوَازٍ أُفُقِيّ"
      evidence_status: "no_material_found"
    - lemma: "اسْتِوَاء"
      confirm:
        - text: "«الاستواء: الاعتدال والاستقامة، من استوى العود إذا قام واعتدل...»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«مكان تكون فيه صخور أساسية ظاهرة للعيان على سطح الأرض (flatness)»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
      contradicts:
        - text: "«خاصية الحالة الوظيفية للرصيف، وتغطي الانحرافات الرأسية... (evenness)»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "اللفظ يدل على الاستقامة العامة أو غياب الوعورة (evenness) وليس بالضرورة الأفقية المطلقة."
    - lemma: "تَسَطُّح"
      confirm:
        - text: "«انضغاط جسم كروي ليصبح مقطعه إهليلجي على أحد المحاور (flattening)»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يدل على التغير في الشكل الهندسي وليس على صفة التوازي مع الأفق."

stage3_analysis:
  per_lemma:
    - lemma: "أُفُقِيَّة"
      decision: confirmed
      decision_reason: "المصطلح العربي الفصيح والأكثر شيوعاً في الأوساط العلمية والهندسية للتعبير عن صفة الأفقية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُفُقِيَّة"
    - lemma: "تَوَازٍ أُفُقِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب اصطلاحي دقيق يصف الحالة الهندسية للجسم بالنسبة للأفق، وهو متداول في السياقات التقنية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "تَوَازٍ أُفُقِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "اسْتِوَاء"
      decision: removed
      decision_reason: "يدل على غياب الوعورة أو الميل بشكل عام (evenness/flatness) وقد يكون في مستويات غير أفقية، فهو أعم من المفهوم المطلوب."
    - lemma: "تَسَطُّح"
      decision: removed
      decision_reason: "يدل على تحول الجسم إلى سطح أو انضغاطه (flattening)، وهو مفهوم فيزيائي مختلف."

stage4_content:
  definition:
    current: "صفة التوازي مع الأفق"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويحتاج إلى صياغة معجمية أكثر دقة."
    authored:
      - type: terminological
        text: "خَاصِّيَّةُ كَوْنِ الشَّيْءِ مَوَازِيًا لِلأُفُقِ أَوْ مُسْتَوِيًا مَعَهُ فِي مُسْتَوًى عَرْضِيٍّ لَا مَيْلَ فِيهِ لِأَعْلَى أَوْ لِأَسْفَل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "أُفُقِيَّة"
        examples:
          - text: "تُقاسُ أُفُقِيَّةُ السَّطْحِ بِدِقَّةٍ عِنْدَ البِنَاءِ لِضَمَانِ تَوَازُنِ الأَعْمِدَةِ."
            type: usage
      - lemma: "تَوَازٍ أُفُقِيّ"
        examples:
          - text: "يَتَطَلَّبُ تَرْكِيبُ المَكَتِبِ تَوَازِيًا أُفُقِيًّا تَامًّا مَعَ الأَرْضِيَّةِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "خَاصِّيَّةُ كَوْنِ الشَّيْءِ مَوَازِيًا لِلأُفُقِ أَوْ مُسْتَوِيًا مَعَهُ فِي مُسْتَوًى عَرْضِيٍّ لَا مَيْلَ فِيهِ لِأَعْلَى أَوْ لِأَسْفَل."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُقاسُ أُفُقِيَّةُ السَّطْحِ بِدِقَّةٍ عِنْدَ البِنَاءِ لِضَمَانِ تَوَازُنِ الأَعْمِدَةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "أُفُقِيَّة"
      entry_id: "{auto}"
      root: "افق"
      maqayis_quote: "«الْهَمْزَةُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَبَاعُدِ مَا بَيْنَ أَطْرَافِ الشَّيْءِ وَاتِّسَاعِهِ، وَعَلَى بُلُوغِ النِّهَايَةِ. وَمِنْ ذَلِكَ الْآفَاقُ: النَّوَاحِي وَالْأَطْرَافُ...»"
    - lemma: "تَوَازٍ أُفُقِيّ"
      entry_id: "{auto}"
      roots:
        - word: "تواز"
          root: "وزي"
          maqayis_quote: "«الْوَاوُ وَالزَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَوِ الْمَهْمُوزُ: أُصَيْلٌ يَدُلُّ عَلَى تَجَمُّعٍ فِي شَيْءٍ وَاكْتِنَازٍ.»"
        - word: "أفقي"
          root: "افق"
          maqayis_quote: "«الْهَمْزَةُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَبَاعُدِ مَا بَيْنَ أَطْرَافِ الشَّيْءِ وَاتِّسَاعِهِ...»"
  per_sense:
