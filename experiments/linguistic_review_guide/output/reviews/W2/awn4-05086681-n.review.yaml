      sense_id: "{auto}"
      nuance: "اللفظ الأساسي والمجرد الذي يصف الحالة بصفة عامة كمفهوم رياضي أو فيزيائي."
      mwe: false
    - lemma: "تَوَازٍ أُفُقِيّ"
      sense_id: "{auto}"
      nuance: "يركز على العلاقة الهندسية المتبادلة بين الجسم وخط الأفق."
      mwe: true
  synset:
    cultural_fit: native
  actions:
