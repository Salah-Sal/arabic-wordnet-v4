    # ── مرشحات المرحلة ١ — مرفوضة ──────────────────────────
    - lemma: "الفَسفَرَةُ التَّنَفُّسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية. التنفسية تُحيل إلى التنفس الخلوي بوجه عام لا إلى الفسفرة التأكسدية تحديداً؛ قد تُلتبَس بالسلسلة التنفسية كاملةً. اختبار السكّ: يمكن إبدال تنفسية بـ«هوائية» وتبقى وصفاً صحيحاً → ليست مصطلحاً ثابتاً."

