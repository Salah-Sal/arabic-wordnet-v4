        mwe_type: wasfi
      nuance_differentiation: "يُفضَّل في أدبيات الكيمياء الحيوية والبيولوجيا الجزيئية العربية المترجمة؛ يستخدم الصفة تَأَكسُدِيَّة المشتقة من المصدر تَأَكسُد (بنية تَفَعُّل)"
