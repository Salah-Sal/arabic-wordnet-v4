      decision_reason: "عبارة وصفية إضافية مفتوحة لا مصطلح بيوكيميائي مسكوك. اختبار السكّ: يمكن إبدال أيض بـ«خلية» أو «جسم» وتبقى صحيحة → ليست تعبيراً اصطلاحياً ثابتاً. تصف الناتج لا العملية ذاتها."


