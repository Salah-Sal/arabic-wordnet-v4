      decision_reason: "موثَّق مباشرةً في المعجم الطبي الموحد (2009 — ALECSO) بوصفه المقابل العربي الرسمي لـ oxidative phosphorylation. كما يُوثِّق المعجم ذاته فسفتة ضوئية وفسفتة ضوئية دورية بنفس البنية، مما يُثبِت الأنموذج التركيبي. فسفتة أدق دلالةً من فسفرة لأنها تعني حصراً «إدخال زمرة فسفات إلى الجزيء»، وتتجنب الاشتراك اللفظي مع phosphorescence."
      evidence_assessment:
