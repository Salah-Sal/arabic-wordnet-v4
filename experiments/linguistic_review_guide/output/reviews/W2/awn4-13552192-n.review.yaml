      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُفضَّل في المعجمية الطبية الموحدة (ALECSO 2009)؛ يستخدم فَسْفَتَة (الأدق دلالةً = إدخال زمرة فسفات) وأَكْسَدِيَّة (نسبة إلى مصدر أَكْسَدَة لا إلى تَأَكسُد)؛ الصيغتان تُكمِّلان بعضهما وتُغطيان مجاليَن معجميَّين مختلفَيْن"
      actions:
