# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (فسفرة تأكسدية) مركّبة وصفية من كلمتَيْن تفتقران إلى التشكيل"
      - "كلمة فسفرة في بعض المعاجم تعني phosphorescence (إصدار ضوء) لا phosphorylation (إدخال فسفات)؛ اشتراك لفظي محتمل"
      - "التعريف يستخدم اختصاري ATP وADP دون توضيحهما أو تعريبهما"
      - "المجموعة تحوي لمّة واحدة فقط؛ يُستحسن البحث عن مرادفات موثَّقة في المعاجم الطبية والكيميائية"
    observations: "الفسفرة التأكسدية عملية استقلابية محورية في كيمياء الأحياء الجزيئية، وتُنجَز في الميتوكندريا. كلا مكوّنَيِ المصطلح مشتقَّان من ألفاظ معرَّبة: فسفور (من اليونانية φωσφόρος) وأكسجين (من الفرنسية oxygène). لا توجد جذور عربية كلاسيكية لهذه المفاهيم، غير أن المعجمية الطبية والكيميائية العربية أفرزت صياغات متعددة تستحق المقارنة. التشكيل الكامل غائب عن اللمّة الحالية، والتعريف يحتاج إلى تحديد موضع العملية وشرح الاختصارات."

  blind_candidates:
    - lemma: "الفَسفَرَةُ التَّنَفُّسِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي بين فسفرة (phosphorylation) والنسبة إلى التنفس؛ الفسفرة التأكسدية تجري حصراً في إطار التنفس الخلوي الهوائي، فالصفة التنفسية تُحدِّد السياق الوظيفي وتتجنب الاشتراك اللفظي مع phosphorescence"

    - lemma: "التَّفَسفُرُ التَّأكسُدِيُّ"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر الرباعي (فسفر) على وزن التَّفَعلُل قياساً على تَزَلزَلَ/تَزَلزُل؛ يُعطي اسمَ مصدر للعملية بدلاً من اسم الحدث (فسفرة)، مقروناً بالصفة التأكسدي التي تُحدِّد آلية الإطلاق"

    - lemma: "فَسفَرَةٌ مُؤكسِدَة"
      generation_method: tarkib
      justification: "تركيب وصفي يستبدل المصدر الصناعي (تأكسدية) باسم الفاعل (مُؤكسِدَة)، مُضفياً بُعداً فاعلياً أوضح: العملية نفسها هي التي تُؤكسِد الركائز وتُطلق الطاقة"

    - lemma: "تَخليقُ طَاقَةِ الأَيض"
      generation_method: tarkib
      justification: "تركيب إضافي مزدوج ينصبّ على الناتج الوظيفي المحدَّد في التعريف (تكوين الطاقة من خلال الأيض الخلوي)؛ يُبرز الغاية الوظيفية لا الآلية الكيميائية"


