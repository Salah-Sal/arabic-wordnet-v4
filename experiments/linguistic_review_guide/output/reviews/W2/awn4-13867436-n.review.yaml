# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13867436-n
# المفهوم: synchronism / synchrony — التزامن
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (تَزَامُن)، وهي غير كافية لتغطية طيف المترادفات"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج إلى صياغة معجمية أصيلة"
    observations: >
      المفهوم يدور حول العلاقة الزمنية بين أحداث تقع في وقت واحد. الجذر «زمن» هو الأنسب
      اشتقاقاً على وزن تَفَاعُل الدالّ على المشاركة، لكن ثمة مرادفات محتملة من جذور أخرى
      كـ«وقت» و«عصر» و«قرن». المفهوم حاضر في التراث العربي وليس مستورداً.
  blind_candidates:
    - lemma: "تَزَامُن"
      generation_method: ishtiqaq
      justification: "مصدر تَزَامَنَ على وزن تَفَاعُل من الجذر «زمن»، يدلّ على اشتراك شيئين في الزمن"
    - lemma: "تَوَاقُت"
      generation_method: ishtiqaq
      justification: "مصدر تَوَاقَتَ على وزن تَفَاعُل من الجذر «وقت»، يدلّ على تكافؤ الشيئين في الوقت"
    - lemma: "مُعَاصَرَة"
      generation_method: ishtiqaq
      justification: "مصدر عَاصَرَ على وزن مُفَاعَلَة من الجذر «عصر»، يدلّ على الوجود في عصر واحد"
    - lemma: "تَقَارُن"
      generation_method: ishtiqaq
      justification: "مصدر تَقَارَنَ على وزن تَفَاعُل من الجذر «قرن»، يدلّ على تلازم الشيئين وحدوثهما معاً"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَزَامُن"
      confirm:
        - text: "«الشَّيْئَانِ: اتَّفَقا فى الزَّمَنِ»"
          source: "المعجم الكبير (الفعل تَزَامَنَ)"
        - text: "«(فى العمل السينمائى أو التليفزيونى) Synchronism: عمليةٌ فنيةٌ يُقْصَدُ بها ضبطُ الصوت مع الصورة, وتلازمهما معًا»"
          source: "المعجم الكبير (الاسم التَّزَامُن)"
        - text: "«اتفاق حادثين في زمن واحد»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«(1) التّزامن؛ التّواقُت: الحدوث في زمن أو وقت واحد»"
          source: "المورد الحديث (2008)"
        - text: "«تزامُن؛ تواقُت»"
          source: "المورد الحديث (2008) — مدخل synchrony"
      expands:
        - text: "«حالة اللغة المدروسة من خلال وظيفتها في لحظة زمنية معينة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "دلالة اصطلاحية لسانية خاصة تعني دراسة اللغة في مقطع زمني واحد"
        - text: "«مصادفة زمنية في تكوين الطبقات أو وقوع الحوادث الجيولوجية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "استعمال جيولوجي يخصّص المفهوم بالمصادفة الزمنية في الطبقات"

    - lemma: "تَوَاقُت"
      confirm:
        - text: "«تكافؤ في الوقت»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«تزامُن، تواقُت — مصادفة زمنية في تكوين الطبقات أو وقوع الحوادث الجيولوجية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«(1) التّزامن؛ التّواقُت: الحدوث في زمن أو وقت واحد»"
          source: "المورد الحديث (2008)"
        - text: "«تزامُن؛ تواقُت»"
          source: "المورد الحديث (2008) — مدخل synchrony"

    - lemma: "مُعَاصَرَة"
      evidence_status: "no_material_found"

    - lemma: "تَقَارُن"
      contradicts:
        - text: "«الشيئان: تلازما»"
          source: "المعجم الوسيط"
          conflict: "دلالة التلازم عامة وليست زمنية تحديداً، والاستعمال الاصطلاحي المعاصر يخصّصها بمعنى coupling/pairing في الوراثة والفيزياء"
        - text: "«عملية تزاوج بين صبغيين متماثلين»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          conflict: "المصطلح مستقرّ في علم الوراثة بمعنى pairing/synapsis لا synchronism"
      expands:
        - text: "«ترافُق، تقارُن، اقتران — conjugation»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يُستخدم أيضاً بمعنى الترافق الكيميائي"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "تَزَامُن"
      decision: confirmed
      decision_reason: >
        مصدر قياسي على وزن تَفَاعُل من الجذر «زمن» يدلّ على المشاركة في الزمن. مؤيَّد بأدلة
        معجمية متعددة من المعجم الكبير والمورد الحديث ومعاجم المصطلحات المتخصصة. هو المصطلح
        الأكثر شيوعاً واستقراراً في الاستعمال المعاصر لمفهوم synchronism.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الأعمّ والأشيع، يُستعمل في جميع المجالات العلمية والعامة للدلالة على اتفاق الأحداث في الزمن"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَوَاقُت"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصدر قياسي على وزن تَفَاعُل من الجذر «وقت». ثبت في المعاجم المتخصصة (الجيولوجيا، الزلازل)
        وفي المورد الحديث مرادفاً لـ«تزامن». يختلف بأنه أدقّ في الدلالة على توافق الوقت المحدّد
        لا الزمان بعمومه. مصطلح مسكوك مستقرّ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أدقّ من «تزامن» في الإشارة إلى التطابق في الوقت المحدَّد (point-in-time)، يُستعمل في الجيولوجيا والعلوم الطبيعية"
      actions:
        - command: create_entry
          params: {lemma: "تَوَاقُت", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُعَاصَرَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تدعم استعمالها بمعنى synchronism. دلالتها الأصلية هي العيش في
        عصر واحد (contemporaneity)، وهو مفهوم أوسع يتعلق بالحقبة لا بالتزامن اللحظي للأحداث.
      evidence_assessment:
        case: no_material

    - lemma: "تَقَارُن"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن المعجم الوسيط يعرّف «تقارن» بـ«التلازم»، فإن الاستعمال الاصطلاحي المعاصر
        خصّصه بمعنى coupling/pairing في الوراثة والفيزياء والكيمياء. إدخاله في مجموعة
        التزامن يُوقع في اللبس مع هذه الدلالات المستقرة.
      evidence_assessment:
        case: mixed


