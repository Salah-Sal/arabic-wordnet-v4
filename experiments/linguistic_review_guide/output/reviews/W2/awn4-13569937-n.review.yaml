# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13569937-n | ILI: i107909 | POS: n
# Concept: biological regeneration (regrowth of lost tissue/organs)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان (تجدد، تجديد) تشتركان في الجذر (جدد) وتتقاربان في المعنى، لكنهما تختلفان في الوزن الصرفي: تَفَعُّل مقابل تَفْعِيل، مما يستوجب توثيق الفرق الدلالي."
      - "تجديد ذو حِمل دلالي واسع (تجديد البنية التحتية، تجديد العقد، تجديد الطاقة...) قد يُسبّب اشتراكاً لفظياً حين يُستخدم بمعزل عن السياق البيولوجي."
      - "التعريف الحالي مترجم حرفياً: (نمو جديد) يتضمن قدراً من التكرار، ولا يذكر الفاعل (الكائن الحي) ولا الآلية البيولوجية. يحتاج إعادة صياغة بأسلوب معجمي عربي."
      - "اللمّتان خاليتان من التشكيل الكامل في السجل الحالي."
    observations: >
      المجموعة تمثّل مصطلح «التجدد البيولوجي» (biological regeneration)، وهو قدرة
      الكائن الحي على إعادة بناء ما فقده من أنسجة أو أعضاء أو أجزاء بفعل الإصابة
      أو الاستئصال. الجذر (جدد) خصيب في العربية ويمنح مشتقاته دلالة الاستئناف
      والعودة إلى الحالة الأصلية. الوزن تَفَعُّل (تجدد) يحمل معنى الانعكاسية
      والذاتية وهو أنسب لوصف العملية البيولوجية كظاهرة ذاتية في الكائن الحي.
      الوزن تَفْعِيل (تجديد) يحمل معنى التعدية لكنه يُستخدم مصطلحاً علمياً راسخاً
      في المعاجم المتخصصة لنفس المفهوم. كلا اللمّتين مقبولتان بيولوجياً غير أن
      تجدد أدق وأوضح في السياق الحيوي الذاتي.

  blind_candidates:
    - lemma: "تَجَدُّد"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (جدد) على وزن تَفَعُّل الذي يدل على حدوث الفعل من تلقاء الذات؛
        فتجدد الأنسجة هو عودتها إلى الوجود الجديد بفعل الكائن الحي نفسه. الوزن ينسجم
        تمام الانسجام مع الطابع الذاتي للعملية البيولوجية. المصدر راسخ في المعجم
        ومستعمل في المصطلحية البيولوجية والطبية.
    - lemma: "إِحْيَاء"
      generation_method: majaz
      justification: >
        من الجذر (حيي) بمعنى إعادة الحياة إلى ما مات أو فُقد. إزاحة دلالية من
        «بعث الحياة» إلى «استعادة النسيج المفقود»؛ وجه الشبه هو إعادة ما كان موجوداً
        ثم زال. لفظ قديم موثق في المعجمية العربية ولا يحمل دلالة دخيلة.
    - lemma: "اِسْتِرْدَاد"
      generation_method: ishtiqaq
      justification: >
        من الجذر (رد) على وزن استفعال بمعنى استعادة ما كان مفقوداً. يصف عملية «رد»
        الأعضاء والأنسجة إلى حالتها السابقة. متوافر في معاجم الكيمياء والبيئة بمعنى
        recovery مما يجعله مرشحاً طبيعياً للمعنى البيولوجي.
    - lemma: "تَوَلُّد"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ولد) على وزن تَفَعُّل بمعنى النشأة من مصدر قائم. يُعبّر عن نشأة
        أنسجة جديدة من بقايا الأنسجة الحية الأصل. الوزن ذاتي انعكاسي مثل تجدد
        ويصلح للعملية البيولوجية من حيث الاشتقاق.


stage2_evidence:
  per_lemma:
    - lemma: "تجدد"
      confirm:
        - text: "«تَجَدُّد — regeneration»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«تَجَدُّد — regeneration»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تجدد، تجديد — regeneration — إعادة التكوين»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«(4) التجدُّد: تجدّد الجسد أو العضو الجسدي بعد أذًى يُصيبه أو كعملية طبيعيّة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(تجدّد) الشَّيْء صَار جَدِيداً والضرع ذهب لبنه»"
          source: "المعجم الوسيط"
          addition: "يثبت أن الوزن تَفَعُّل يحمل معنى التحوّل الذاتي نحو الحالة الجديدة، وهو أساس المعنى البيولوجي."
        - text: "«تجدد — turnover [حجم المياه المتجددة في مجموع مخزون خزان أو طبقة حاملة للمياه الجوفية]»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يكشف أن (تجدد) يُستعمل كذلك في سياقات هندسية بمعنى التناوب الدوري، وهو معنى مختلف عن التجدد البيولوجي."

    - lemma: "تجديد"
      confirm:
        - text: "«تَجْديد — regeneration — قدرة الكائن الحيّ وخاصة النباتات والحيوانات الدنيا على تعويض ما تفقده من أنسجة أو أعضاء بترت منها»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«تجديد — regeneration — في علوم الحياة: إعادة تكوين، من قبل الكائنات الحية، جزء من جسمه تم بتره»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
        - text: "«تجدد، تجديد — regeneration»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«التجديد (البيولوجي) — regeneration (biological)»"
          source: "المكنز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«تجديد — renovation / renewal / replacement / turnover / novation / innovation» بحسب السياق"
          source: "معاجم ALECSO المتعددة (المياه، الطاقة، النقل، القانون، اللسانيات)"
          addition: "يكشف الحِمل الدلالي الثقيل للمصطلح إذ يُغطي مفاهيم متعددة في مجالات شتى، مما يستدعي توثيق الفرق عن تجدد."
        - text: "«(1) تجديد (2) تجدّد؛ انبعاث (3) انبعاث روحيّ (4) التجدُّد: تجدّد الجسد أو العضو الجسدي بعد أذًى يُصيبه أو كعملية طبيعيّة»"
          source: "المورد الحديث (2008)"
          addition: "يُميّز المورد الحديث بين تجديد (الإصلاح والتحديث) وتجدّد (العملية البيولوجية الذاتية)، مما يدعم الفصل الدلالي بين اللمّتين."

    - lemma: "إِحْيَاء"
      source: stage1
      expands:
        - text: "«الإحياء — في الطِّبِّ: resuscitation: الإنعاش، أو رَدُّ الحياة — في الفلسفة: palingenesis: العَوْدُ الأبدى للأحداث عند الرُّوَاقِييِّين — في الجيولوجيا: recapitulation theory»"
          source: "المعجم الكبير"
          addition: "يثبت أن الإحياء في الطب يعني الإنعاش (resuscitation) لا التجدد البيولوجي (regeneration)، وهما مفهومان مختلفان."
        - text: "«الإحياء — animation» في سياق المعلوماتية"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "تعدد دلالي يُضعف صلاحية اللفظ مصطلحاً للتجدد البيولوجي."

    - lemma: "اِسْتِرْدَاد"
      source: stage1
      confirm:
        - text: "«الاسترداد — recovery — عملية استخلاص المواد من خاماتها أو مركباتها أو من مخلفات تحتويها»"
          source: "المعجم الكبير (قسم الكيمياء)"
      contradicts:
        - text: "«الاستِرداد — دعوى يرفعها الحائز الذي نزعت حيازته طالباً ردها إليه»"
          source: "المعجم الوسيط"
          conflict: "الاستخدام الراسخ في اللغة الحديثة يربط الاسترداد بالمعنى القانوني ولا يحمل دلالة التجدد البيولوجي للأنسجة."
        - text: "«استرداد — reuptake»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "في الطب يعني reuptake (إعادة الامتصاص) وليس regeneration، مما يُبيّن انعدام الدلالة البيولوجية المستهدفة."

    - lemma: "تَوَلُّد"
      source: stage1
      contradicts:
        - text: "«التولد: أن يصير الحيوان بلا أب وأم، مثل الحيوان المتولد من الماء الراكد في الصيف»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "تولد يعني التوالد التلقائي (spontaneous generation) وهو مفهوم مختلف كلياً عن التجدد البيولوجي لأنسجة كائن قائم."
        - text: "«(تولد) الشَّيْء من الشَّيْء نَشَأ عَنهُ»"
          source: "المعجم الوسيط"
          conflict: "الدلالة على النشأة من مصدر خارجي تتعارض مع الطابع الذاتي الداخلي للتجدد البيولوجي."


stage3_analysis:
  per_lemma:
    - lemma: "تجدد"
      decision: confirmed
      decision_reason: >
        مصطلح راسخ في المعاجم الطبية والبيولوجية والتشريحية بمعنى regeneration. وزنه
        الصرفي (تَفَعُّل) يُعبّر بدقة عن الطابع الذاتي للعملية البيولوجية — أي إعادة
        الكائن الحي بناءَ ما فقده من تلقاء نفسه. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَجَدُّد يصف العملية البيولوجية من منظور الذاتية الانعكاسية: الكائن الحي هو
        الفاعل والمفعول معاً. وزن تَفَعُّل يُبرز أن الكائن يُجدّد نفسه بنفسه دون
        فاعل خارجي. يُلائم السياقات الوصفية كـ«تجدد خلايا الكبد» و«تجدد الأطراف
        في السمندل». الأدق من تجديد في تمثيل الطبيعة الذاتية للظاهرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجَدُّد"

    - lemma: "تجديد"
      decision: confirmed
      decision_reason: >
        موثّق في معاجم علم الأحياء والأغذية والمكنز الزراعي بمعنى regeneration الحيوي
        مع تعريف صريح يذكر تعويض الأنسجة والأعضاء المبتورة. يظل مصطلحاً علمياً معتمداً
        في المصادر الموحّدة رغم حِمله الدلالي الأوسع في سياقات أخرى. يحتاج إلى
        تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَجْدِيد يصف العملية من منظور المصطلحية التقنية الموضوعية؛ وزن تَفْعِيل يُوحي
        ضمنياً بإمكانية فاعلية خارجية (تجديد مُستَحثّ بالجينات أو المواد الكيميائية).
        يُلائم السياقات التقنية والعلمية الرسمية كـ«تجديد الأنسجة في المختبر» أو
        «تجديد الخلايا العصبية». أوسع استخداماً في المصطلحية المُقنَّنة لكنه أقل
        دقةً من تجدد في تمثيل الذاتية البيولوجية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجْدِيد"

    - lemma: "تَجَدُّد"
      source: stage1
      decision: removed
      decision_reason: >
        يطابق اللمّة الموجودة (تجدد) في المجموعة ذاتها؛ لا حاجة لإجراء إضافي.

    - lemma: "إِحْيَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن (إحياء) يعني في الطب الإنعاشَ (resuscitation) لا
        التجدد البيولوجي (regeneration)، وفي المعلوماتية يعني التحريك (animation).
        الاشتراك اللفظي يُعيق استخدامه مصطلحاً دقيقاً للمفهوم الحيوي المحدد.

    - lemma: "اِسْتِرْدَاد"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد أدلة على استخدام (استرداد) بمعنى التجدد البيولوجي في أي معجم. الدلالة
        السائدة قانونية وكيميائية، وفي الطب يعني reuptake وليس regeneration. لا صلة
        وثيقة له بالمفهوم المستهدف.

    - lemma: "تَوَلُّد"
      source: stage1
      decision: removed
      decision_reason: >
        التعريف المعجمي الراسخ لتولد هو التوالد التلقائي (spontaneous generation) وهو
        مفهوم مختلف جوهرياً عن التجدد البيولوجي. استخدامه في هذه المجموعة سيُحدث
        خلطاً علمياً مع نظرية الجيل التلقائي المرفوضة في علم الأحياء الحديث.


