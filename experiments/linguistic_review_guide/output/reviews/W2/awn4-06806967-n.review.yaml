# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-06806967-n  |  ILI: i72186  |  POS: n
# Definition: a sign visible from the street
# ══════════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «لافتة مرئية من الشارع» يحتوي على كلمة «لافتة» التي هي إحدى لمّات المجموعة ذاتها، مما يُوقعه في الدوران المنهجي."
      - "اللمّتان الموجودتان «لافتة شارع» و«لوحة إرشادية» مكتوبتان بدون تشكيل."
      - "«لوحة إرشادية» أضيق دلالةً من فحوى المجموعة: فالإرشادية توحي بالتوجيه المقصود، بينما التعريف يشمل أي علامة مرئية من الشارع (لافتة محل، اسم شارع، إعلان…)."
    observations: >
      المجموعة تُمثّل مفهوماً بسيطاً راسخاً في الفضاء العمراني المعاصر: اللافتة المنصوبة
      في مكان بارز يراها المارّون في الشارع. اللمّتان الموجودتان تُغطيان بُعدَين مختلفَين:
      «لافتة شارع» بُعدٌ موضعي-جغرافي (ما يراه سالك الشارع)، و«لوحة إرشادية» بُعدٌ وظيفي
      (ما يُرشد ويوجّه). الجمع بينهما يُثري المجموعة ويُعبّر عن ظلالٍ دلالية متمايزة.

  blind_candidates:
    - lemma: "لَوْحَةُ الطَّرِيقِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «لوحة» (صفيحة عريضة، من لاح أي لمع وظهر) و«الطريق»؛
        يُعبّر عن اللافتة المُثبَّتة على جانب الطريق ليراها السائرون. الوحدة الإضافية
        محكمة ومستعملة في العربية المعاصرة.

    - lemma: "مُؤَشِّرَةٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر «أشر/أشار» على وزن مُفَعِّلة الدال على الآلة/الأداة، أي
        الأداة التي تُشير وتدلّ على الجهة أو الاسم. يناسب العلامات الإرشادية
        المُثبَّتة التي تُوجّه المارّين.

    - lemma: "رَايَةُ الطَّرِيقِ"
      generation_method: majaz
      justification: >
        إحياء للفظ «راية» (العَلَم والنصب الذي يُرفع للتعريف بمكان أو اتجاه) بمعناه
        الوظيفي القديم، وتوسيعه مجازياً ليشمل أي نصب مرئي على جانب الطريق يُعرَّف
        به المكان. الراية في العربية الكلاسيكية تحمل معنى العلامة الدالة.

    - lemma: "سِمَةُ الشَّارِعِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «سِمَة» (من الجذر وسم: الأثر والمعلم الدال) و«الشارع»؛
        إذ السِّمَة هي العلامة التي يُعرَّف بها المكان وتُميّزه. يُحيي معنى قرآنياً
        إذ قال تعالى: «إِنَّ فِي ذَلِكَ لَآيَاتٍ لِلْمُتَوَسِّمِينَ».


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "لافتة شارع"
      confirm:
        - text: "«لافتة محل»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM"
        - text: "«لافِتَة، لوحة معلَّقة.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
        - text: "«لافت؛ لافتٌ للنظر.»"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«لافِتَة» — منطقة من صفحة موقع على الشبكة الدولية تستعمل عادة للإعلانات الإشهارية"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ARABTERM"
          addition: >
            يُثبت أن «لافتة» مصطلح حيٌّ في العربية المعاصرة يُستعمل للعلامة/الإعلان
            المرئي، وإن اتسع للمجال الرقمي أيضاً.
        - text: "«لَفَتَ: اللَّامُ وَالْفَاءُ وَالتَّاءُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى اللَّيِّ وَصَرْفِ الشَّيْءِ عَنْ جِهَتِهِ الْمُسْتَقِيمَةِ. مِنْهُ لَفَتُّ الشَّيْءَ: لَوَيْتُهُ. وَلَفَتُّ فُلَانًا عَنْ رَأْيِهِ: صَرَفْتُهُ.»"
          source: "مقاييس اللغة لابن فارس (ت 395 هـ)"
          addition: >
            يُبيّن أن اللافتة مشتقة من «لفت» بمعنى صرف النظر واستقطابه، وهو المعنى
            الجوهري للافتة الشارع (تصرف نظر المارّ إلى الاسم أو الرسالة).

    - lemma: "لوحة إرشادية"
      confirm:
        - text: "«لوحة تشوير، لوحة طريق» — لوحة توجد على الطرق العادية والسيارة لتشوير السائقين إلى وجهتهم"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
        - text: "«لوحة الإشارة»"
          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
        - text: "«لوحة؛ لافتة.»"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«لَوَحَ: اللَّامُ وَالْوَاوُ وَالْحَاءُ أَصْلٌ صَحِيحٌ، مُعْظَمُهُ مُقَارَبَةُ بَابِ اللَّمَعَانِ. يُقَالُ: لَاحَ الشَّيْءُ يَلُوحُ، إِذَا لَمَحَ وَلَمَعَ… وَاللَّوْحُ: الْكَتِفُ. وَاللَّوْحُ: الْوَاحِدُ مِنْ أَلْوَاحِ السَّفِينَةِ. وَسُمِّيَ لَوْحًا لِأَنَّهُ يَلُوحُ.»"
          source: "مقاييس اللغة لابن فارس (ت 395 هـ)"
          addition: >
            يُثبت أن «اللوحة» عربي أصيل من «لاح» (لمع وظهر)، وسُمّيت لأنها تلوح
            (تظهر) للناظر من بعيد — وهو معنى جوهري للافتة الشارع.
        - text: "«رَشَدَ: الرَّاءُ وَالشِّينُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى اسْتِقَامَةِ الطَّرِيقِ. فَالْمَرَاشِدُ: مَقَاصِدُ الطُّرُقِ.»"
          source: "مقاييس اللغة لابن فارس (ت 395 هـ)"
          addition: >
            يُبيّن أن «الإرشادية» مشتقة من «رشد» الدال على استقامة الطريق ومقاصده،
            مما يُوثّق دلالة الهداية والتوجيه الطرقي في صميم الاشتقاق.

    - lemma: "لَوْحَةُ الطَّرِيقِ"
      confirm:
        - text: "«لوحة تشوير، لوحة طريق» — لوحة توجد على الطرق العادية والسيارة لتشوير السائقين إلى وجهتهم"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
        - text: "«لوحة الإشارة»"
          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"

    - lemma: "مُؤَشِّرَةٌ"
      contradicts:
        - text: "«مُؤَشِّرَة» — مصنفة تحتوي على مجموعة من المؤشرات التي تستعملها أنظمة الاستكشاف على الشبكة الدولية"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ARABTERM"
          conflict: >
            المعجم المعياري يُسجّل «مؤشرة» بمعنى «bookmark» (إشارة مرجعية في المتصفح)،
            وهو مصطلح تقني راسخ في مجال تقنية المعلومات، مما يُنشئ تعارضاً حاداً مع
            استخدامه للدلالة على لافتة الشارع.

    - lemma: "رَايَةُ الطَّرِيقِ"
      evidence_status: "no_material_found"

    - lemma: "سِمَةُ الشَّارِعِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "لافتة شارع"
      decision: confirmed
      decision_reason: >
        اللمّة مركّب إضافي عربي مطّرد، منتج وفق النمط الموثَّق في ARABTERM
        («لافتة محل» = trade-sign). الجذر «لفت» راسخ بمعنى صرف الانتباه واستقطابه،
        وهو المعنى الجوهري للافتة الشارع. التعبير شائع في الاستخدام الصحفي والإداري
        العربي المعاصر. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز البُعد الجغرافي-الموضعي (الشارع كسياق للرؤية)، ويشمل بإطلاق أي علامة
        مرئية — سواء كانت إرشادية أو إعلانية أو تعريفية — دون قيد على الوظيفة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَافِتَةُ شَارِعٍ"

    - lemma: "لوحة إرشادية"
      decision: confirmed
      decision_reason: >
        اللمّة مركّب وصفي عربي أصيل، موثَّق بصيغٍ قريبة في ARABTERM («لوحة تشوير،
        لوحة طريق»). «اللوحة» مشتقة من «لاح» (لمع وظهر)، و«الإرشادية» من «رشد»
        (استقامة الطريق ومقاصده) — وكلا الجزأين يُعبّران عن جوهر المفهوم. تُميّزها عن
        «لافتة شارع» بتركيزها على الوظيفة الإرشادية. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز البُعد الوظيفي (الإرشاد والتوجيه)، ويوحي بالطابع الرسمي والمؤسسي
        للافتة (علامات البلدية، التوجيهات الطرقية) بخلاف «لافتة شارع» التي تشمل
        الإعلانات وغيرها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَوْحَةٌ إِرْشَادِيَّةٌ"

    - lemma: "لَوْحَةُ الطَّرِيقِ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق «لوحة طريق» في ARABTERM، فإن هذا المرشح يتداخل مع اللمّة الموجودة
        «لوحة إرشادية» ويضيق دلالةً عليها (يقتصر على الطرق الحركية دون الفضاء
        الحضري الأوسع). الإضافة لا تُثري المجموعة بقدر ما تُكرّرها.

    - lemma: "مُؤَشِّرَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        مصطلح تقني راسخ بمعنى «bookmark» في معجم تقانة المعلومات الموحّد (ALECSO 2011)؛
        إقحامه بمعنى لافتة الشارع يُنشئ اشتراكاً لفظياً مع مصطلح رقمي معياري مستقر،
        وهو ما تنهى عنه قواعد الجودة الاصطلاحية.

    - lemma: "رَايَةُ الطَّرِيقِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي لهذا المركّب. «الراية» في العربية المعاصرة تنحصر في
        سياق الأعلام والشارات الرسمية للدول والجماعات، وتوسيعها للافتة الشارع يُعدّ
        إزاحة دلالية غير مدعومة بالاستعمال.

    - lemma: "سِمَةُ الشَّارِعِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي للمركّب. «السِّمَة» وإن كانت عربية أصيلة بمعنى
        العلامة والأثر، إلا أنها تنتمي في الاستعمال المعاصر إلى مجال الهوية
        المؤسسية (brand identity) لا إلى اللافتات الطرقية.


