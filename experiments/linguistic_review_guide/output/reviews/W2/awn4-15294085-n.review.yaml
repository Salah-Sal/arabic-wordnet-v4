# مراجعة المجموعة الترادفية — awn4-15294085-n (seek time)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «وقت البحث» غير مشكّلة"
      - "المجموعة تحتوي لمّة واحدة فقط وهو عدد قليل لمصطلح حاسوبي له بدائل عربية متعددة"
      - "«البحث» ترجمة لـ search وليس seek بدقة؛ والفرق بينهما دقيق في سياق الحوسبة"
    observations: "المفهوم حاسوبي تقني يتعلق بالزمن اللازم لتحريك رأس القراءة/الكتابة في مِسواق الأقراص إلى مسار بيانات معيّن. هذا المفهوم يُعبَّر عنه عادةً بتركيب إضافي (زمن/وقت/مدة + مصدر الفعل). الكلمة الإنجليزية seek تعني الطلب والنشدان لا مجرد البحث العشوائي، فمن المناسب استكشاف بدائل أدقّ من «بحث»."
  blind_candidates:
    - lemma: "زَمَنُ النِّشْدَانِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «زمن» و«نِشدان» (مصدر نَشَدَ). النِّشدان في العربية يعني طلب الشيء والبحث عنه بقصد، وهو أقرب دلالياً إلى seek من «بحث». الجذر ن-ش-د يدل على ذِكر شيء وتنويه به وطلبه."
    - lemma: "مُدَّةُ البَحْثِ"
      generation_method: tarkib
      justification: "تركيب إضافي بديل يستخدم «مُدّة» بدل «وقت» مع إبقاء «البحث». المدة أدقّ لأنها تدلّ على الفترة المحددة بين نقطتين زمنيتين."
    - lemma: "زَمَنُ التَّمَوْضُعِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف العملية الفيزيائية: التموضع (من وضع، باب التفاعل) يعني انتقال الرأس إلى موضعه المطلوب على القرص."
    - lemma: "زَمَنُ الالتِمَاسِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «زمن» و«التماس» (مصدر الْتَمَسَ من جذر ل-م-س). الالتماس يعني الطلب، وقد يُستعمل مجازاً لطلب البيانات."

stage2_evidence:
  per_lemma:
    - lemma: "وَقْتُ البَحْثِ"
      confirm:
        - text: "«مُدَّةُ بَحْث — المدة الزمنية التي تستغرقها عملية البحث قبل الولوج إلى المعطيات»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ترجمة seek time"
        - text: "«بَحْث — مصطلح يعبر عن جميع العمليات التي تمكن من مَوقَعَة المعطيات سواء في شبكة أو قاعدة معطيات أو ملف أو غير ذلك»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ترجمة seek"
      expands:
        - text: "«الْوَاوُ وَالْقَافُ وَالتَّاءُ: أَصْلٌ يَدُلُّ عَلَى حَدِّ شَيْءٍ وَكُنْهِهِ فِي زَمَانٍ وَغَيْرِهِ. مِنْهُ الْوَقْتُ: الزَّمَانُ الْمَعْلُومُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر و-ق-ت يدل على الحدّ الزمني المعلوم"
        - text: "«الْبَاءُ وَالْحَاءُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى إِثَارَةِ الشَّيْءِ. قَالَ الْخَلِيلُ: الْبَحْثُ طَلَبُكَ شَيْئًا فِي التُّرَابِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "البحث أصله التنقيب وإثارة الشيء، وهو أعمّ من seek الذي يدل على القصد المحدد"

    - lemma: "زَمَنُ النِّشْدَانِ"
      confirm:
        - text: "«زمن النِشدان — الزمنُ اللازم لتحريكِ رأس القراءة والكتابة لمِسْوَقِ الأقراص disk drive إلى موضعٍ محدّد على القرص»"
          source: "معجم مصطلحات المعلوماتية (2000) — ترجمة seek time"
        - text: "«نِشدان — إجرائيةُ تحريكِ رأس القراءة/الكتابة في مِسْوَقِ الأقراص disk drive إلى الموقع المناسب، من أجل عملية قراءة أو عملية كتابة عادةً»"
          source: "معجم مصطلحات المعلوماتية (2000) — ترجمة seek"
      expands:
        - text: "«النُّونُ وَالشِّينُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ذِكْرِ شَيْءٍ وَتَنْوِيهٍ. وَنَشَدَ فُلَانٌ فُلَانًا قَالَ: نَشَدْتُكَ اللَّهَ. وَأَمَّا نَشَدْتُ الضَّالَّةَ، يَعْنِي طَلَبْتُهَا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "النشدان يتضمن معنى الطلب بقصد وعزم، مما يطابق seek في الحوسبة"

    - lemma: "مُدَّةُ البَحْثِ"
      confirm:
        - text: "«مُدَّةُ بَحْث — المدة الزمنية التي تستغرقها عملية البحث قبل الولوج إلى المعطيات»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ترجمة seek time"

    - lemma: "زَمَنُ التَّمَوْضُعِ"
      evidence_status: "no_material_found"

    - lemma: "زَمَنُ الالتِمَاسِ"
      contradicts:
        - text: "«الالتماس: هو الطلب مع التساوي بين الآمر والمأمور في الرتبة»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "الالتماس في العربية اصطلاح أدبي وفقهي يعني الطلب بين متساويين في الرتبة، وليس له علاقة بطلب البيانات"
        - text: "«الالتماس لغة طلب الفعل مع التساوي، وأمّا عرفا فيطلق على ما يكون مع نوع تواضع»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المصطلح مشحون بدلالات اجتماعية ورتبية لا تناسب السياق الحاسوبي"

stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "وَقْتُ البَحْثِ"
      decision: confirmed
      decision_reason: "اللمّة قريبة من المصطلح المعتمد في المعجم الموحد لمصطلحات تقانة المعلومات (مُدَّة بحث = seek time). الفرق بين «وقت» و«مدة» طفيف، وكلاهما يؤدي المعنى. تبقى اللمّة مقبولة مع إضافة التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُفضَّل في الاستعمال العام والإعلامي؛ «وقت» أشيع من «زمن» في اللغة المعاصرة غير المتخصصة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَقْتُ البَحْثِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "زَمَنُ النِّشْدَانِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد في معجم مصطلحات المعلوماتية (2000) بتعريف مطابق تماماً للمفهوم. «النشدان» أدقّ دلالياً من «البحث» لأنه يدل على الطلب المحدد القصد (= seek)، بخلاف البحث الذي يدل على التنقيب العام (= search)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مصطلح تقني متخصص معتمد في معاجم المعلوماتية؛ أدقّ دلالياً لأن «النشدان» يقابل seek تحديداً"
      actions:
        - command: create_entry
          params: {lemma: "زَمَنُ النِّشْدَانِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُدَّةُ البَحْثِ"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح «مُدَّة بحث» معتمد في المعجم الموحد لمصطلحات تقانة المعلومات (2011) ترجمةً لـ seek time. أُضيفت «ال» التعريف على «البحث» لتوحيد الصيغة مع بقية لمّات المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "صيغة معتمدة في معاجم ALECSO الحديثة؛ «المدة» تشير إلى الفترة المحددة بدقة أكثر من «الوقت»"
      actions:
        - command: create_entry
          params: {lemma: "مُدَّةُ البَحْثِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "زَمَنُ التَّمَوْضُعِ"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر على شواهد معجمية. المصطلح يصف عملية التموضع (positioning) لا عملية النشدان (seeking)، وهما مفهومان مختلفان في الحوسبة. زمن التموضع (positioning time) مصطلح مستقل لا يرادف seek time."

    - lemma: "زَمَنُ الالتِمَاسِ"
      source: stage1
      decision: removed
      decision_reason: "الالتماس في العربية اصطلاح مشحون بدلالات اجتماعية ورتبية (طلب المتساوي من المتساوي)، وليس له استعمال حاسوبي موثق. كما أنه لم يُعتمد في أي معجم مصطلحي تقني."

