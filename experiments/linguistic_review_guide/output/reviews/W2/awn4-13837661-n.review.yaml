# مراجعة المجموعة الترادفية: awn4-13837661-n (proportion / ratio)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تَنَاسُب، نِسْبَة) كلتاهما من جذر واحد (نسب)؛ قد يكون التمييز الدلالي بينهما دقيقاً يحتاج توضيحاً"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي؛ يمكن تحسينه بأسلوب معجمي عربي"
    observations: "المفهوم يدور حول المقارنة الكمّية بين الأشياء من حيث المقدار أو الدرجة. وهو مفهوم رياضي-فلسفي أصيل في التراث العربي، عُرِف في كتب الرياضيات والمنطق والبلاغة. الجذر (نسب) هو الأكثر إنتاجية لهذا الحقل الدلالي، ويتفرع منه: نِسْبَة (القياس بين مقدارين) وتَنَاسُب (تساوي نسبتين) ومُنَاسَبَة (الاتحاد في النسبة)."
  blind_candidates:
    - lemma: "نِسْبَة"
      generation_method: ishtiqaq
      justification: "من الجذر (نسب) على وزن فِعْلَة، وهي المصطلح المعجمي الأساسي لقياس كمّية أحد المقدارين إلى كمّية الآخر، كما في المعجم الوسيط ومعجم مقاليد العلوم"
    - lemma: "تَنَاسُب"
      generation_method: ishtiqaq
      justification: "من الجذر (نسب) على وزن تَفَاعُل الدالّ على المشاركة والتماثل، يدلّ على تساوي النسب بين المقادير واتّساقها"
    - lemma: "مُقَايَسَة"
      generation_method: ishtiqaq
      justification: "من الجذر (قيس) على وزن مُفَاعَلَة، بمعنى مقارنة شيء بشيء في القدر والكمّية"
    - lemma: "مُنَاسَبَة"
      generation_method: ishtiqaq
      justification: "من الجذر (نسب) على وزن مُفَاعَلَة، أطلقها المتكلمون والحكماء على الاتحاد في النسبة وتسمّى تناسباً أيضاً كما في كشّاف اصطلاحات الفنون"


stage2_evidence:
  per_lemma:
    - lemma: "تَنَاسُب"
      confirm:
        - text: "«التشابُه في الرياضة: تساوى نسبتين مثل أ/ب = ج/د»"
          source: "المعجم الوسيط"
        - text: "«التّناسب: [في الانكليزية] Proportion، harmony يطلق على معان كما ستعرف في لفظ المناسبة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«تناسب = proportion»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«تناسب = proportion»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      expands:
        - text: "«التناسب: عِنْد عُلَمَاء البديع هُوَ مُرَاعَاة النظير»"
          source: "دستور العلماء للأحمدنكري"
          addition: "للتناسب استعمال بلاغي أيضاً في مراعاة النظير"
        - text: "«(تناسب) الشيئان تشاكلا والقوم إلى أحسابهم انتسبوا إليها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الفعل (تناسب) يدلّ على التشاكل والانتساب إلى الأحساب"

    - lemma: "نِسْبَة"
      confirm:
        - text: "«الصِّلَة أو القرابة في الرياضة: نتيجة مقارنة إحدى كميتين من نوع واحد بالأخرى المقدار المنسوب»"
          source: "المعجم الوسيط"
        - text: "«إِضَافَة مَا فِي الْقدر بَين مقدارين متجانسين»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«إيقاع التعلق بين الشيئين»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«نسبة = ratio»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«نِسْبَة = ratio»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«النّسبة: قياس شيء إلى شيء... وبهذا المعنى يقال النّسب بين القضايا والمفردات منحصرة في أربع: المباينة الكلّية والمساواة والعموم مطلقاً ومن وجه... ومنها قياس كمية أحد العددين إلى كمية الآخر وعليه اصطلاح المهندسين والمحاسبين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "النسبة عند المهندسين والمحاسبين تخصّ قياس كمّية أحد العددين إلى الآخر"
        - text: "«النِّسْبَة: الرَّبْط وَهِي تَامَّة خبرية وإنشائية. وَغير تَامَّة كالنسبة التقييدية»"
          source: "دستور العلماء للأحمدنكري"
          addition: "للنسبة استعمالات نحوية ومنطقية متعددة تتجاوز الدلالة الرياضية"

    - lemma: "مُقَايَسَة"
      contradicts:
        - text: "«المعادلة: (في الرياضة) مُتَسَاوِيَة تحتوي على مَجْهُول أو أكثر يُرَاد استخراجه»"
          source: "المعجم الوسيط"
          conflict: "المقايسة تعني القياس والمقارنة العامة، لا العلاقة الكمّية المحددة بين مقادير (النسبة/التناسب)"
      evidence_status: "no_material_found"

    - lemma: "مُنَاسَبَة"
      confirm:
        - text: "«المناسبة: هي عند المتكلّمين والحكماء الاتحاد في النسبة وتسمّى تناسباً أيضاً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«(1) نسبة (2) تناسُب؛ اتّساق؛ انسجام (3) التناسب (ر)... (8) يُناغم»"
          source: "المورد الحديث (2008)"
          conflict: "المناسبة لم تُذكر مقابلاً لـ proportion/ratio في المورد الحديث، مما يشير إلى أنها ليست المصطلح المتداول في الاستعمال الحديث"


stage3_analysis:
  per_lemma:
    - lemma: "تَنَاسُب"
      decision: confirmed
      decision_reason: "مصطلح مثبَت في المعجم الوسيط والمعاجم المتخصصة (رياضيات، فيزياء) مقابلاً لـ proportion. جذره (نسب) ووزنه (تَفَاعُل) يدلّان على المشاركة بين مقادير متعددة في النسبة. التعريف الرياضي (تساوي نسبتين) يتوافق مع دلالة المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "التَّنَاسُب يدلّ على التماثل والتساوي في النِّسَب بين مقادير متعددة (proportion)، أي العلاقة التناظرية بين أطراف النسبة. يُستعمل مصدراً على وزن تَفَاعُل للدلالة على التشارك."

    - lemma: "نِسْبَة"
      decision: confirmed
      decision_reason: "مصطلح معجمي أساسي مثبَت في المعجم الوسيط وكتب المصطلحات والمعاجم التراثية. يدلّ على قياس كمّية مقدار بالنسبة إلى آخر (ratio). ورد في عشرات المعاجم المتخصصة مقابلاً لـ ratio."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "النِّسْبَة تدلّ على القياس المباشر بين كمّيتين متجانستين (ratio)، أي المقدار الناتج من مقارنة إحدى الكمّيتين بالأخرى. هي أخصّ من التَّنَاسُب الذي يدلّ على تساوي نسبتين."

    - lemma: "مُقَايَسَة"
      source: stage1
      decision: removed
      decision_reason: "المقايسة تدلّ على المقارنة والقياس العامّ، لا على العلاقة الكمّية المحددة بين مقادير. لم تَرِد في المعاجم المتخصصة مقابلاً لـ proportion أو ratio. معناها أوسع وأعمّ من المفهوم المطلوب."
      evidence_assessment:
        case: no_material

    - lemma: "مُنَاسَبَة"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود المناسبة بمعنى 'الاتحاد في النسبة' في كشّاف الاصطلاحات، فإن الاستعمال الحديث غلب عليها معنى 'الحدث/المناسبة الاجتماعية'. لم تَرِد في المعاجم المتخصصة الحديثة مقابلاً لـ proportion/ratio. إضافتها تُوقع في الاشتراك اللفظي دون فائدة تمييزية."
      evidence_assessment:
        case: mixed


