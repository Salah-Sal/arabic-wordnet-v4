# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث الموجودة تفتقر إلى التشكيل الكامل"
      - "لمّة «شخصية» أعمّ من دلالة المجموعة — تمتد إلى الشخصية القانونية والأدبية وليس فقط المجمّع الأخلاقي الفطري"
      - "التعريف العربي الحالي ترجمة شبه حرفية للإنجليزي — «الأدبية» أقل دقة من «الخُلُقية» للتعبير عن ethical، ولا إشارة إلى الفطرية (inherent)"
      - "تفتقر المجموعة إلى لمّة «خَلِيقَة» التي تُعبِّر بدقة عن البُعد الخِلقي الفطري التقديري"
    observations: "المجموعة تعبّر عن مفهوم «الطابع الأخلاقي الفطري» (character / fiber) — مفهوم عربي أصيل غني بالمصطلحات الكلاسيكية. اللمّات الثلاث صحيحة دلالياً لكنها تحمل ظلالاً مختلفة: «سجية» أدقها للبُعد الراسخ الثابت كالملكة المستقرة في النفس، و«طبع» يُبرز الطابع المختوم الفطري، و«شخصية» أعمّ وأحدث استخداماً. مقاييس ابن فارس توثّق الروابط الجذرية لكل منها بدقة."

  blind_candidates:
    - lemma: "خَلِيقَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر خ-ل-ق على وزن فَعِيلَة؛ بمعنى الطبيعة التي قُدِّرَ عليها الإنسان وخُلِقَ بها؛ تُبرز البُعد الفطري الأصيل ومعنى التقدير الإلهي في الطبيعة الخِلقية"
    - lemma: "جِبِلَّة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر ج-ب-ل على وزن فِعِلَّة؛ بمعنى الخِلقة والطبيعة التي جُبِلَ عليها الإنسان — إحياء لفظ كلاسيكي راسخ لتجنب الاشتراك مع «طبع» الذي تغلّب عليه معنى الختم"
    - lemma: "سَلِيقَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر س-ل-ق على وزن فَعِيلَة؛ بمعنى الطبيعة العفوية التي يسترسل عليها الإنسان دون تكلُّف؛ تُبرز طابع العفوية والتلقائية في السجية"
    - lemma: "نَحِيزَة"
      generation_method: majaz
      justification: "من الجذر ن-ح-ز؛ أصلها قطعة منسوجة ممتدة في الأرض، ثم استُعيرت للطبيعة التي كأن الإنسان نُسِجَ عليها — إزاحة دلالية دقيقة من المحسوس إلى المعنوي بصورة توثّقها مقاييس ابن فارس"


