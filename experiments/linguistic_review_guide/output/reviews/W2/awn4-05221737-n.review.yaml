          source: "المعجم الطبي الموحد (2009) — ARABTERM [entry_id: 664385]"
      # ملاحظة: هذا المرشح تطابق فعلياً مع اللمّة الموجودة (نفس الكلمة بتشكيل كامل)

    - lemma: "أَوْعِيَوِيَّة"
