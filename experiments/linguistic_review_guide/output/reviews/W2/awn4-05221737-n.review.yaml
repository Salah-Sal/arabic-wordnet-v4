# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "وعائية"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة في المعجم الطبي الموحد (2009) بالصيغة «وِعائِيَّة» مقابل
        vascularity بصياغة صريحة لا لبس فيها. الاشتقاق قياسيٌّ صحيح (نسبة + مصدر
        صناعي) من جذر عربي أصيل (و-ع-ي) يدلّ على الضمّ والاحتواء. غير أنها تحتاج
        تحديث التشكيل إلى «وِعائِيَّة» للدقة المعجمية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُعبّر بإيجاز عن صفة وجود الأوعية في الأنسجة
        الحيّة دون إشارة إلى نوع الوعاء (دموي، لمفي، نباتي) مما يمنحها عموميّةً
        مصطلحيّةً تُناسب مختلف السياقات العلمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِعائِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "وَعَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابقٌ للمّة الموجودة «وعائية» بعد إضافة التشكيل الكامل؛ لا
        حاجة لإنشاء مدخل مستقل. التصحيح يتمّ عبر update_lemma على المدخل الموجود.

    - lemma: "أَوْعِيَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي. صياغة النسبة من الجمع (أوعية → أوعيوي)
        غير مطّردة صرفياً في العربية التي تنسب عادةً إلى المفرد لا الجمع.
        فضلاً عن ذلك، اشتقاق «وعائية» من المفرد (وعاء → وعائي → وعائية) أولى
        وأوضح دلالةً وأجرى على قواعد الاشتقاق العربي.

    - lemma: "ذَاتُ الأَوْعِيَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شاهد معجمي. التعبير وصفيٌّ حرٌّ يفشل اختبار السكّ: يمكن
        إبداله بـ«حاملة الأوعية» أو «مشتملة على أوعية» فيبقى الوصف صحيحاً، مما
        يثبت أنه ليس مصطلحاً مُسكَّكاً. الصيغة الإضافية «ذوات الأوعية» وإن
        استُعملت في التصنيف النباتي فهي مغايرة دلالياً للخاصيّة المجرّدة المطلوبة.

    - lemma: "قَنَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شاهد معجمي. المجاز من «قناة» إلى معنى «الوعائية» بعيدٌ
        ولا يُفهم مباشرةً؛ يفشل اختبار الملاءمة (الإيهام بالقنوات الاصطناعية
        لا الأوعية الحيوية). «وعائية» المشتقّة من الجذر الأصيل أولى.


