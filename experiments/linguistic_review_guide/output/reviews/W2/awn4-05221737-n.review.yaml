# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دوريّ: يستخدم «وعائياً» في تعريف «وعائية» مما يخلّ بمبدأ عدم الاشتمال في التعريف المعجمي"
      - "اللمّة الموجودة «وعائية» تفتقر إلى التشكيل الكامل المطلوب"
      - "المجموعة تضمّ لمّةً واحدةً فقط مما يُضعف التوثيق الترادفي"
    observations: >
      المصطلح «وعائية» مشتقٌّ بالمصدر الصناعي (النسبة + ياء المصدر) من «وِعاء»
      الذي يعود إلى الجذر الثلاثي (و-ع-ي)؛ وهو اشتقاقٌ قياسيٌّ صحيح يسير على
      منوال «إنسانية» و«روحانية» و«مادية». تُوثِّق المعاجم الطبية والعلمية الحديثة
      هذه اللمّة بصيغة «وِعائِيَّة» في مقابل الإنجليزية vascularity. المفهوم
      علميٌّ حيويٌّ يصف خاصية امتلاك الأنسجة أو الأعضاء لأوعية موصِّلة للسوائل.
  blind_candidates:
    - lemma: "وَعَائِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدرٌ صناعيٌّ (نسبة + ياء) من «وِعَاء» على القياس العربي المطّرد:
        وِعاء → وِعائي → وِعائيَّة، يدلّ على خاصيّة كون الشيء ذا وعاء أو
        مزوَّداً بأوعية؛ شائعٌ في المصطلحية الطبية والأحيائية الحديثة.
    - lemma: "أَوْعِيَوِيَّة"
      generation_method: ishtiqaq
      justification: >
        نسبةٌ إلى «أوعية» (جمع وعاء) مع المصدر الصناعي: أوعية → أوعيوي →
        أوعيوية. تُبرز الجمعية (plurality of vessels) لا مجرد وجود الوعاء،
        مما قد يلائم السياق الأحيائي الذي يتحدث عن شبكة أوعية لا وعاءً واحداً.
    - lemma: "ذَاتُ الأَوْعِيَة"
      generation_method: tarkib
      justification: >
        مركبٌ إضافي من «ذات» (حاملة، موصوفة بـ) و«الأوعية»، يدلّ على صفة
        امتلاك الأوعية بصيغة الإضافة العربية التراثية، على غرار «ذوات الدم»
        و«ذوات الرئة» في المصطلحية العلمية العربية القديمة.
    - lemma: "قَنَوِيَّة"
      generation_method: majaz
      justification: >
        مجازٌ بالإزاحة من «قناة» (channel, canal) إذ الأوعية الدموية والنسيجية
        قنواتٌ ناقلة للسوائل الحيوية؛ الوزن قَنَوِيَّة (نسبة إلى قناة) يُحيي
        لفظاً عربياً أصيلاً قد يُميَّز به عن المصطلح الطبي المباشر.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — Batch headword: وعائية، الوعائية، أوعيوية، الأوعيوية، قنوية، القنوية، ذات الأوعية
#   Q2 — English bridge: vascularity, vascular
#   Q3 — Arabic FTS: وعاء، وعائي، وعائية، الأوعية (مصادر كلاسيكية فقط)
#   Q4 — Maqayis: headword_norm IN (وعي، وعو، وعا، وعاء) — dictionary_id=151
stage2_evidence:
  per_lemma:
    - lemma: "وعائية"
      confirm:
        - text: "«وِعائِيَّة» — translation_en: vascularity, translation_fr: vascularité"
          source: "المعجم الطبي الموحد (2009) — ARABTERM [entry_id: 664385]"
        - text: "«وعائية» — تنتمي إلى كل نوع من الأنسجة النباتية أو أجزاء النبات التي
            تتكون من أو ما يقوم بدور أنسجة موصلة. على سبيل المثال، الخشب، اللحاء،
            طبقة الكامبيوم الوعائية. — translation_en: vascular"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، الألكسو — ARABTERM [entry_id: 357603]"
      expands:
        - text: "«وِعائيّ» — translation_en: angeial (vascular)"
          source: "المعجم الطبي الموحد (2009) — ARABTERM [entry_id: 540905]"
          addition: >
            يُثبت أن «وعائي» هو الصفة المعيارية المقابلة لـ vascular في الطب العربي،
            مما يُسوّغ المصدر الصناعي «وعائية» مقابل vascularity بصياغةٍ منطقية.
        - text: "«وِعائيّ» — translation_en: vascular; vasal"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015) — ARABTERM [entry_id: 476559]"
          addition: "يُثبت تعدّد المجالات التخصصية لمصطلح «وعائي» (تشريح، طب، أحياء)."
        - text: "«وَعَيَ» الْوَاوُ وَالْعَيْنُ وَالْيَاءُ: كَلِمَةٌ تَدُلُّ عَلَى ضَمِّ
            شَيْءٍ. وَوَعَيْتُ الْعِلْمَ أَعِيهِ وَعْيًا. وَأَوْعَيْتُ الْمَتَاعَ
            فِي الْوِعَاءِ أُوَعِّيهِ."
          source: "مقاييس اللغة لابن فارس [entry_id: 989655]"
          addition: >
            يؤصّل الجذر (و-ع-ي) بمعنى الضمّ والاحتواء وهو الأصل الدلالي الذي
            تشتقّ منه «وِعاء» ثم «وعائيّ» ثم «وعائيّة»؛ يُثبت سلامة الاشتقاق.

    - lemma: "وَعَائِيَّة"
      confirm:
