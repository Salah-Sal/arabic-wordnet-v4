stage1_review:
  assessment:
    concerns:
      - "التعريف العربي شامل للمعدات والأساليب (equipment and methods)، بينما اللمات الحالية مقتصرة دلالياً على المعدات المادية فقط، ولا تعكس الجانب المنهجي أو الإمكانيات الذي يتضمنه مصطلح armamentarium."
    observations: "مصطلح armamentarium في المجال الطبي يشير إلى مجمل الإمكانيات والوسائل المتاحة للطبيب من أجهزة، أدوية، ومعارف أو أساليب علاجية. اللمات الحالية 'تجهيزات طبية' و'معدات طبية' تغطي الشق المادي وتفتقر للشمول، لذا نحتاج لمصطلح كـ 'عدة الممارسة' أو 'عدة الطبيب' كترجمة أوفى للمفهوم وفق المعاجم الطبية."
  blind_candidates:
    - lemma: "عُدَّة المُمَارَسَة"
      generation_method: tarkib
      justification: "مركب إضافي يعبر عن كل ما يعتمد عليه الممارس الطبي في عمله، ويطابق المفهوم الطبي."
    - lemma: "عُدَّة الطَّبِيب"
      generation_method: tarkib
      justification: "مركب إضافي شائع في المعاجم يعبر عن إمكانيات الطبيب من أجهزة وأساليب."
    - lemma: "عَتَاد طِبِّيّ"
      generation_method: tarkib
      justification: "استعارة للعتاد في السياق الطبي للإشارة إلى الترسانة العلاجية والتشخيصية."
    - lemma: "مُسْتَلْزَمَات طِبِّيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يشير إلى كافة الاحتياجات الطبية من أدوات ووسائل."

stage2_evidence:
  per_lemma:
    - lemma: "تجهيزات طبية"
      evidence_status: no_material_found
    - lemma: "معدات طبية"
      confirm:
        - text: "medical equipment"
          source: "AGROVOC"
    - lemma: "عُدَّة المُمَارَسَة"
      confirm:
        - text: "armamentarium"
          source: "The Unified Medical Dictionary"
    - lemma: "عُدَّة الطَّبِيب"
      confirm:
        - text: "(1) عُدّة الطبيب (2) طاقات؛ إمكانات (3) ثروة (4) ذخيرة (5) أداة."
          source: "Al-Mawrid Al-Hadeeth"
    - lemma: "عَتَاد طِبِّيّ"
      evidence_status: no_material_found
    - lemma: "مُسْتَلْزَمَات طِبِّيَّة"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "تجهيزات طبية"
      decision: confirmed
      decision_reason: "مصطلح متداول ومفهوم للإشارة إلى المعدات الطبية المادية، وهو جزء رئيسي من المفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجْهِيزَات طِبِّيَّة"
    - lemma: "معدات طبية"
      decision: confirmed
      decision_reason: "مصطلح متداول يعبر عن الشق المادي للمفهوم ومؤكد معجمياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعِدَّات طِبِّيَّة"
    - lemma: "عُدَّة المُمَارَسَة"
      source: stage1
      decision: confirmed
      decision_reason: "هو المصطلح الطبي المعتمد في المعجم الطبي الموحد للتعبير عن armamentarium بشمولية (المعدات والأساليب معاً)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "عُدَّة المُمَارَسَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "عُدَّة الطَّبِيب"
      source: stage1
      decision: confirmed
      decision_reason: "مؤكد في المعاجم الثنائية كترجمة دقيقة للمفهوم، وواضح الدلالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "عُدَّة الطَّبِيب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "عَتَاد طِبِّيّ"
      source: stage1
      decision: removed
      decision_reason: "المرادفات الأخرى المعتمدة معجمياً تغني عنه."
    - lemma: "مُسْتَلْزَمَات طِبِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "يشير غالباً إلى المواد الاستهلاكية أكثر من الآلات والأساليب التي يشملها المفهوم."

stage4_content:
  definition:
    current: "مجموعة المعدات والأساليب المستخدمة في ممارسة الطب"
    assessment:
      decision: retain
      reason: "التعريف دقيق وشامل ومطابق تماماً للمفهوم العلمي والتعريف الإنجليزي."
  examples:
    per_lemma:
      - lemma: "تَجْهِيزَات طِبِّيَّة"
        examples:
          - text: "تُعَدُّ التَّجْهِيزَاتُ الطِّبِّيَّةُ الحَدِيثَةُ أَسَاسِيَّةً فِي تَشْخِيصِ الأَمْرَاضِ بِدِقَّةٍ."
            type: usage
      - lemma: "مُعِدَّات طِبِّيَّة"
        examples:
          - text: "تَمَّ تَزْوِيدُ المُسْتَشْفَى بِمُعِدَّاتٍ طِبِّيَّةٍ مُتَطَوِّرَةٍ لِلْعِنَايَةِ المُرَكَّزَةِ."
            type: usage
      - lemma: "عُدَّة المُمَارَسَة"
        examples:
          - text: "يَجِبُ عَلَى الطَّبِيبِ أَنْ يُحَدِّثَ عُدَّةَ المُمَارَسَةِ الخَاصَّةَ بِهِ بِمَا يَتَوَافَقُ مَعَ التَّطَوُّرِ العِلْمِيِّ."
            type: usage
      - lemma: "عُدَّة الطَّبِيب"
        examples:
          - text: "تَشْمَلُ عُدَّةُ الطَّبِيبِ كُلَّ الأَدَوَاتِ وَالمَعَارِفِ اللَّازِمَةِ لِعِلَاجِ المَرْضَى."
            type: usage
    actions:
