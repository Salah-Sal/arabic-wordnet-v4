step0_evidence:
  per_lemma:
    - lemma: "جليد حبيبي"
      confirm:
        - text: "«(1) الخَشِيف: ثلجٌ حُبَيْبيّ يتراكم على قمم الجبال الشامخة (2) المخشوفة؛ الأرض المثلوجة: حقل ثلج حُبَيْبي كهذا.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) الصَّريد: جليد حُبَيْبيّ يتكَّون من ماء الضباب»"
          source: "المورد الحديث (2008)"
          addition: "يربط بين الحالة الحبيبية والجليد المتكون من الضباب"

    - lemma: "نيفي"
      evidence_status: "no_material_found"
      peripheral_observations:
        - lemma: "نيفي"
          observation: "اللمّة هي تعريب صوتي (transliteration) للمصطلح الفرنسي/الإنجليزي névé، ولم تَرِد في المعاجم اللغوية التراثية أو الحديثة بهذا اللفظ، لكنها شائعة في الكتب المدرسية والمراجع الجغرافية المترجمة."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "خَشِيف"
      source_section: "step7_english_bridge"
      evidence_citation: "«خَشيف: ثلج معمر» — المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
      justification: "مصطلح تراثي أُحيي ليمثل حالة الثلج المعمر أو الحبيبي (firn/neve)، وهو الأكثر دقة لغوياً."
    - lemma: "فِيرْن"
      source_section: "step6_fts_keyword"
      evidence_citation: "«جزء من نهر جليدي أو منطقة متجمدة حيث الزيادة المتوسطة السنوية للجليد المعمر، فيرن، والثلوج أكبر من الخسارة السنوية...» — مسرد المناخ والبيئة (ArabTerm)"
      justification: "المرادف التقني لـ neve، وكلاهما يعبر عن الحالة الانتقالية بين الثلج والجليد."
  knowledge_candidates:
    - lemma: "ثلج معمر"
      justification: "ترجمة وصفية دقيقة مستخدمة في المعاجم المتخصصة للتعبير عن الثلج الذي يبقى لأكثر من عام ويتحول تدريجياً إلى جليد."
    - lemma: "حقل ثلجي"
      justification: "يُستخدم غالباً للإشارة إلى المنطقة التي يتراكم فيها الثلج الحبيبي (névé field)."
  generation_notes: "التركيز على إحياء المصطلح التراثي 'خشيف' كونه يمثل المفهوم بدقة في المعاجم الحديثة المتخصصة."

