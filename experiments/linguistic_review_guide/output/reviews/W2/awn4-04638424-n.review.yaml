stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدو ترجمة حرفية للتعريف الإنجليزي (استعداد مبتهج ليكون المرء خدومًا)."
      - "غياب مصطلح 'الأريحية' وهو الأدق تراثياً ولغوياً للتعبير عن الارتياح لفعل المعروف بنشاط."
    observations: "المجموعة تغطي مفهوم طيب المعشر والنشاط في الخدمة، واللمّات الموجودة صحيحة لكنها تحتاج إلى إغناء بمرادفات أكثر دقة وتحديداً للجانب 'الخدمي المبهج' (obliging)."
  blind_candidates:
    - lemma: "أَرِيْحِيَّة"
      generation_method: ishtiqaq
      justification: "من مادة (روح)، وهي الارتياح للندى والنشاط إلى المعروف، وهو ما يطابق تماماً المفهوم الإنجليزي."
    - lemma: "دَمَاثَة"
      generation_method: majaz
      justification: "تُستخدم للتعبير عن سهولة الخلق ولين الجانب، وهي من اللمّات الموجودة بالفعل."
    - lemma: "سَمَاحَة"
      generation_method: majaz
      justification: "تعني الجود والسهولة وبذل ما لا يجب تفضلاً، مما يتقاطع مع كون المرء خدومًا."
    - lemma: "طِيْبَةُ النَّفْس"
      generation_method: tarkib
      justification: "تعبير مركب شائع جداً في المعاصر للتعبير عن حسن الطبع والميل للخير."

stage2_evidence:
  per_lemma:
    - lemma: "دَمَاثَة"
      confirm:
        - text: "«الدَّماثَةُ: سُهولةُ الخُلُق. يقال: ما أَدْمَثَ فلاناً وأَلْيَنَه»"
          source: "لسان العرب"
        - text: "«الدماثة: سهولة الخلق.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "طِيْبَةُ النَّفْس"
      confirm:
        - text: "«لطيف؛ دَمث؛ طَلْق المحيّا؛ طيِّب النفس.»"
          source: "المورد الحديث"
      expands:
        - text: "«فعلتُ ذلكَ بطِيَبة نفسي: إذا لم يُكرهك أحدٌ عليه»"
          source: "المعجم الكبير"
          addition: "تشير إلى الطواعية وعدم الإكراه."
    - lemma: "أَرِيْحِيَّة"
      confirm:
        - text: "«الأَرْيحيَّةُ: الارتياح للندى والنشاط إلى المعروف»"
          source: "المعجم الوسيط"
        - text: "«سَعَةُ الخُلُقِ لِلنَّدَى والمَعْرُوفِ النَّشاط والِخفَّةُ»"
          source: "المعجم الكبير"
    - lemma: "سَمَاحَة"
      confirm:
        - text: "«السَّماحةُ: بذل مَا لم يجب تفضلا.»"
          source: "معجم مقاليد العلوم"
        - text: "«الجُود والكَرَم السُّهولة»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "دَمَاثَة"
      decision: confirmed
      decision_reason: "مصطلح أصيل يعبر عن سهولة الخلق ولينه، وهو جزء أساسي من طبيعة الشخص الخدوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَمَاثَة"
    - lemma: "طِيْبَةُ النَّفْس"
      decision: confirmed
      decision_reason: "تعبير مركب مستقر ومعاصر يعبر عن سلامة الفطرة والميل الفطري للإحسان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طِيْبَةُ النَّفْس"
    - lemma: "أَرِيْحِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "هو المصطلح الأدق لغوياً لوصف 'الارتياح والنشاط في فعل المعروف'، وهو ما يقابل تماماً المفهوم الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَرِيْحِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04638424-n"
    - lemma: "سَمَاحَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعني الجود والسهولة في التعامل، وتتضمن معنى التطوع بالخدمة (بذل ما لا يجب)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "سَمَاحَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04638424-n"

stage4_content:
  definition:
    current: "استعداد مبتهج ليكون المرء خدومًا"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو ترجمة قلقة، والأولى استخدام صياغة معجمية عربية تركز على انشراح الصدر والنشاط في نفع الآخرين."
    authored:
      - type: terminological
        text: "انشراح الصدر ونشاط النفس لتقديم العون والمعروف للآخرين بطواعية وابتهاج."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04638424-n"
          definition_index: 0
          text: "انشراح الصدر ونشاط النفس لتقديم العون والمعروف للآخرين بطواعية وابتهاج."
  examples:
    per_lemma:
      - lemma: "دَمَاثَة"
        examples:
          - text: "يُعرف الأستاذ بين زملائه بدماثة خلقه وترفعه عن الصغائر."
            type: usage
      - lemma: "طِيْبَةُ النَّفْس"
        examples:
          - text: "طيبة النفس تجعل صاحبها يسارع إلى نجدة المحتاج دون تردد."
            type: usage
      - lemma: "أَرِيْحِيَّة"
        examples:
          - text: "أبدى المتطوعون أريحية بالغة في مساعدة ضيوف الرحمن."
            type: usage
      - lemma: "سَمَاحَة"
        examples:
          - text: "تجلت سماحة نفسه في عفوه عن المسيء وبذل العون له."
            type: usage

