step0_evidence:
  per_lemma:
    - lemma: "مُحَقِّق لِلْغَايَة"
      evidence_status: "no_material_found"
    - lemma: "مُنَفِّذ"
      confirm:
        - text: "«المنجِز إلخ — مُنفِّذ الوصية (ق)»"
          source: "المورد الحديث"
        - text: "«دور دلالي يسند إلى الفاعل الذي قام حقيقة بالفعل، وذلك في مثل: كتب الطالب الدرس،  'الطالب' فاعل منفذ»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«منفِّذ: executor»"
          source: "المعجم الموحد لمصطلحات القانون"
          addition: "تخصيص المعنى في المجال القانوني لتنفيذ الوصايا والأحكام"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُنْجِز"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(1) المنجِز إلخ (2) مُنفِّذ الوصية (ق).» — المورد الحديث"
      justification: "اشتقاق (اسم فاعل) من الفعل 'أنجز' المطابق لمعنى المجموعة، ويمثل من يحقق الغرض بنجاح."
    - lemma: "مُحْدِث"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(1) يُحْدث؛ يُسَبِّب (2) يحقِّق؛ يُنجز. (bring about)» — المورد الحديث"
      justification: "اشتقاق (اسم فاعل) من 'أحدث' بمعنى أوجد النتيجة، ويناسب الشق الأول من التعريف."
  knowledge_candidates:
    - lemma: "مُحَقِّق"
      justification: "اشتقاق (اسم فاعل) من الفعل 'حقّق' الوارد في التعريف بمعنى إدراك الغاية وإخراجها للواقع، وهو بديل فصيح وموجز للمركب الوصفي المرفوض 'محقق للغاية'."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُحَقِّق لِلْغَايَة"
      decision: removed
      decision_reason: "مركب وصفي حر (محقق + للغاية) وليس مصطلحاً مسكوكاً، ويمكن الاكتفاء بكلمة 'محقق' أو 'منجز'."
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "مركب وصفي غير ثابت للتعبير عن تحقيق الغايات."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "مُنَفِّذ"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل للتعبير عن الشخص الذي ينفذ الأعمال ويحقق الأغراض المرجوة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب الإجرائي والعملي في إخراج الحدث أو الغرض إلى الواقع."
      example: "كان المهندس هو المنفذ الفعلي لخطة المشروع."
    - lemma: "مُنْجِز"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح دقيق وفصيح يعبر عن تحقيق الغاية وإتمامها بنجاح."
      step05_citation: "«(1) المنجِز إلخ (2) مُنفِّذ الوصية (ق).» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على إتمام العمل وإنهائه بنجاح وبلوغ الغاية منه."
      example: "تم تكريم المنجز الحقيقي لهذه المبادرة الوطنية."
      actions:
        - command: create_entry
          params:
            lemma: "مُنْجِز"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10066335-n"
    - lemma: "مُحْدِث"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل يدل على من يوجِد الشيء أو يسببه، وهو دقيق في سياق إحداث النتيجة."
      step05_citation: "«(1) يُحْدث؛ يُسَبِّب (2) يحقِّق؛ يُنجز.» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على التسبب في وقوع الحدث أو إيجاد النتيجة من العدم."
      example: "يُعدّ العالم محدثاً لتغيير جذري في مجال الطب."
