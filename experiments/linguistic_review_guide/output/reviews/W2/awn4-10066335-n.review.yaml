          params:
            lemma: "مُحْدِث"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10066335-n"
    - lemma: "مُحَقِّق"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح ومختصر، واسم فاعل من الفعل 'حقق'، ويغني عن التركيب المرفوض."
      step05_citation: "اقتراح لغوي (اشتقاق من التعريف)"
      substitution_test:
