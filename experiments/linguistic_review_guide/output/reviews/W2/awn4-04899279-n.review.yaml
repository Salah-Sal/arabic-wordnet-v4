stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية تفتقر إلى التشكيل الكامل."
      - "كلمة 'حكم' واسعة الدلالة جدًا، وقد تُفهم بمعنى القضاء أو السلطة ما لم تُقيّد بالسياق أو تُدعم بمرادفات تخصص المعنى."
      - "كلمة 'تقدير' قد تنصرف إلى 'التقدير الكمي' أو 'الاحترام'، بينما المقصود هنا ملكة التقييم الذهني."
    observations: "المجموعة تعبّر عن ملكة ذهنية عليا تجمع بين دقة الملاحظة (التقييم) وسداد النتيجة (الاستنتاج). اللمّات المقترحة تهدف إلى تغطية جوانب الفطنة (فراسة)، ورزانة العقل (حصافة)، والقدرة النافذة على الرؤية (بصيرة)."
  blind_candidates:
    - lemma: "فِرَاسَة"
      generation_method: ishtiqaq
      justification: "تدل على مهارة التعرف على بواطن الأمور من ظواهرها، وهو ما يطابق 'assess situations shrewdly'."
    - lemma: "حَصَافَة"
      generation_method: ishtiqaq
      justification: "تعني جودة الرأي وإحكام الأمر ورزانة العقل، وهي مطابقة لـ 'sound judgment'."
    - lemma: "بَصِيرَة"
      generation_method: majaz
      justification: "تمثل قوة الإدراك والفطنة التي ترى حقائق الأشياء، وهي المقابل الدقيق لـ 'perspicacity'."
    - lemma: "سَدَاد"
      generation_method: majaz
      justification: "تعني الصواب في القول والفعل والرأي، وتناسب وصف الاستنتاجات بكونها 'sound'."

stage2_evidence:
  per_lemma:
    - lemma: "حُكْم"
      confirm:
        - text: "«الحُكْم: مَلَكة التمييز، استخدام هذه المَلَكة»"
          source: "المورد الحديث"
        - text: "«Judgment: محاكمة عقلية: عملية تكوين رأي من طريق التمييز والمقارنة»"
          source: "المورد الحديث"
      expands:
        - text: "«الحُكْم: صواب الأمر وسداده ووضع الشَّيء في موضعه»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "تَقْدِير"
      confirm:
        - text: "«التقدير من الإنسان: التفكر في الأمر بحسب نظر العقل وبناء الأمر عليه»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«Estimation: تقدير، تقييم»"
          source: "قاموس حبيب سالمون"
    - lemma: "بَصِيرَة"
      confirm:
        - text: "«البصيرة: قوة الإدراك والفطنة والعلم والخبرة»"
          source: "المعجم الوسيط"
        - text: "«Perspicacity: الفطنة؛ حدة الذهن»"
          source: "المورد الحديث"
        - text: "«هي قوة للقلب منوّرة بنور القدس ترى بها حقائق الأشياء وبواطنها بمثابة البصر للنفس»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "حَصَافَة"
      confirm:
        - text: "«الحَصَافَةُ: رَزَانَةُ العَقْلِ وجَوْدَةُ الرَّأْى»"
          source: "المعجم الكبير"
        - text: "«فيقال لركانة العقل حصافة»"
          source: "مقاييس اللغة"
    - lemma: "فِرَاسَة"
      confirm:
        - text: "«الفراسة: في اللغة التثبت والنظر... مهارة التعرف على بواطن الأمور»"
          source: "معجم الصواب اللغوي"
        - text: "«التفرس في الشيء: كإصابة النظر فيه»"
          source: "مقاييس اللغة"
    - lemma: "سَدَاد"
      confirm:
        - text: "«سَدَاد: الاستقامة والقصد والصواب من القول والفعل»"
          source: "موسوعة السلطان قابوس"

