stage4_content:
  definition:
    current: "القدرة على تقييم المواقف أو الظروف بذكاء واستخلاص استنتاجات سليمة"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أكثر إحكاماً وشمولاً للملكة الذهنية."
    authored:
      - type: terminological
        text: "مَلَكةٌ ذِهنيّةٌ تُمكِّنُ صاحِبَها من تقييمِ الأُمورِ بدِقّةٍ، وإصدارِ آراءٍ صائبةٍ، واستخلاصِ نتائجَ سديدةٍ من خِلالِ التدبُّرِ والفِطنةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-04899279-n", definition_index: 0, text: "مَلَكةٌ ذِهنيّةٌ تُمكِّنُ صاحِبَها من تقييمِ الأُمورِ بدِقّةٍ، وإصدارِ آراءٍ صائبةٍ، واستخلاصِ نتائجَ سديدةٍ من خِلالِ التدبُّرِ والفِطنةِ."}
  examples:
    per_lemma:
      - lemma: "حُكْم"
        examples:
          - text: "أبانَ القاضي عن حُكْمٍ صائبٍ في هذه القضيّةِ الشائكةِ."
            type: usage
      - lemma: "تَقْدِير"
        examples:
          - text: "كان تَقْديرُه للموقفِ العسكريِّ دقيقاً بفضلِ خِبرتِه الطويلةِ."
            type: usage
      - lemma: "بَصِيرَة"
        examples:
          - text: "يتمتّعُ القائدُ بَصِيرةٍ نافذةٍ تجعلُه يستشرفُ المخاطرَ قبلَ وقوعِها."
            type: usage
      - lemma: "حَصَافَة"
        examples:
          - text: "تجلَّت حَصَافتُه في اختيارهِ للحلِّ الأقلِّ ضرراً."
            type: usage
      - lemma: "فِرَاسَة"
        examples:
          - text: "أدركَ بفِرَاستِه المعهودةِ أنَّ وراءَ الأكمَةِ ما وراءَها."
            type: usage

