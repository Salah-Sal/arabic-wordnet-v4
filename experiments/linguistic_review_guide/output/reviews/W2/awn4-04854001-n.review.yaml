stage1_review:
  assessment:
    concerns:
      - "لمّة «مبادئ أخلاقية» مركّب دلالي يعني «المبادئ الأخلاقية»، وهو أضيق دلالةً من «الأخلاق»
        بوصفها منظومة قيمية؛ فالمبادئ مشتقّة من الأخلاق لا مرادِفة لها على مستوى المفهوم."
      - "اللمّتان خاليتان من التشكيل الكامل."
      - "التعريف الحالي يبدو مستمدًّا من ترجمة الإنجليزي؛ تركيبه (الاهتمام بالتمييز…) غير مألوف
        في أسلوب المعجم الوسيط."
      - "المفردة «أخلاق» جمع تكسير لـ«خُلُق» وتُستعمل استعمالاً جمعياً مجرّداً في العربية؛
        ينبغي توثيق هذا البُعد الصرفي."
    observations: >
      «أخلاق» هي الاسم الراسخ في العربية الكلاسيكية والمعاصرة للمفهوم المقصود؛ تحمل معنى
      منظومة القيم والسجايا المكتسبة والمقدَّرة (من الجذر خ-ل-ق بمعنى التقدير، كما في مقاييس
      اللغة). مقابل ذلك يدلّ التعبير «مبادئ أخلاقية» على المبادئ الفرعية المستخلَصة من الأخلاق،
      وهو مستوى دلالي أدنى. المجموعة تحتاج لفك الاشتباك بين الدلالتَين وإزالة التعبير المركّب.

  blind_candidates:
    - lemma: "التَّخَلُّق"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر خ-ل-ق على وزن التَّفَعُّل الدال على التحلّي التدريجي بالسجايا والتكسّب
        لها؛ يُعبِّر عن الجانب العَمَلي من الأخلاق وهو السلوك القويم المُكتَسَب.
    - lemma: "الاسْتِقَامَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من ق-و-م على وزن الاسْتِفْعَال، يدلّ على السير المستقيم والالتزام بالطريق
        الصحيح؛ يلتقي مع الشق الثاني من التعريف «السلوك القويم».
    - lemma: "البِرّ"
      generation_method: majaz
      justification: >
        لفظ قرآني راسخ (بَرَّ، يَبَرُّ، بِرّ) يجمع معاني الخير الشامل والطاعة والإحسان؛
        إحياء لاستخدام كلاسيكي يتضمن الجانب الأخلاقي والسلوكي معًا، مع تجنّب الاشتراك مع
        «الأخلاق» الحيّة.
    - lemma: "الخُلُقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «خُلُق» على المنوال الإنتاجي (-يَّة) يُحوِّل الوصف إلى مفهوم مجرد؛
        يشير إلى المنظومة الأخلاقية كصفة كلّية للشخص أو الجماعة.


stage2_evidence:
  per_lemma:
    - lemma: "أخلاق"
      confirm:
        - text: >
            «يرتبط الاصطلاح بالأعراف والروح دون الجسد لهذا تدرس الأخلاق الإنسانية كجُماع حياة
            نفسية للقدرات الروحية، في علاقة بالمثال والقواعد الأخلاقية المرتبطة بالسلوك. لهذا
            يبدو ظاهرة أدبية لافتة من خلال ثنائية "الخير والشر".»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: >
            «(علم الأخلاق): علم موضوعُه أحكام قيمِيَّة تتعلَّق بالأعمال التي تُوصف بالحُسْن
            أو القُبح هو ما يتفق وقواعد الأخلاق أو قواعد السلوك المقررة في المجتمع (مج)»
          source: "المعجم الوسيط لمجمع اللغة العربية"
        - text: >
            «عِلْمُ الأَخْلاق ethics: علمٌ يبحثُ فى الأحْكام القِيمِيَّة التِى تَنْصَبُّ على
            الأفعالِ الإنسانِيَّة من ناحِيَةِ أنَّها خَيْرٌ أو شَرٌّ، وهو أحدُ العلوم
            المِعْيارِية. وهو ضَرْبان: عملىّ: ويُسمَّى علمُ السّلوكِ أو الأَخْلاقُ العَمَلِيَّة.
            ونَظَرِىّ: وهو الذى يَبْحَثُ فى حقِيقَة الخَيْرِ والشَّرِّ والقِيَم الأَخْلاقِيَّة.»
          source: "المعجم الكبير لمجمع اللغة العربية"
        - text: >
            «(1) «أ» درس أخلاقي. «ب» الأثر الأخلاقيّ: أثر أدبيّ مُنْطوٍ على درسٍ أخلاقي
            (2) مذهب أو نظام في علم الأخلاق
            (3) الأخلاقيات: مبادئ أخلاقية أو قواعد سلوك خاصة
            (4) الأخلاقية: الانسجام مع المُثُل الأخلاقية العليا
            (5) الفضيلة.»
          source: "المورد الحديث (2008) — ترجمة morality"
        - text: >
            «أخلاق — moral (s)»
          source: "مسرد الفلسفة وعلم النفس، ALECSO"

    - lemma: "مبادئ أخلاقية"
      contradicts:
        - text: >
            «(3) الأخلاقيات: مبادئ أخلاقية أو قواعد سلوك خاصة» — ورد التعبير بوصفه تعريفاً
            لإحدى معاني morality، لا لمّةً مرادفة لها؛ أي إنه شرح لا مصطلح.
          source: "المورد الحديث (2008)"
          conflict: >
            «مبادئ أخلاقية» مستوى دلالي أدنى من «الأخلاق»: المبادئ قواعد فرعية مستخلَصة من
            المنظومة الأخلاقية، لا المنظومة ذاتها؛ ومن ثَمَّ فهي لا تقع على المستوى المفاهيمي
            للمجموعة الترادفية المعنية.

    - lemma: "التَّخَلُّق"
      contradicts:
        - text: >
            «(فى الجيولوجيا) diagenesis: تكوُّنُ معادِنَ جديدةٍ فِى الصُّخور بعد تَصلُّبِها
            نتيجَةً لإحلال عناصِرَ جديدةٍ فيها، تَتَسَرَّبُ إليها من المِياهِ الجَوْفِيَّة»
          source: "المعجم الكبير لمجمع اللغة العربية"
          conflict: >
            اللفظ مُوظَّف مصطلحاً علمياً راسخاً في الجيولوجيا (diagenesis) بمعنى التحوّل
            الصخري؛ استعماله للأخلاق سيُوقع في اشتراك مصطلحي فادح.

    - lemma: "الاسْتِقَامَة"
      expands:
        - text: >
            «الاستقامة: هي كون الخط بحيث تنطبق أجزاؤه المفروضة بعضها على بعض على جميع
            الأوضاع، وفي اصطلاح أهل الحقيقة: هي الوفاء بالعهود كلها، وملازمة الصراط المستقيم
            برعاية حد التوسط في كل الأمور، من الطعام والشراب واللباس، وفي كل أمر ديني ودنيوي»
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413م)"
          addition: >
            تدلّ الاستقامة في الاصطلاح الصوفي على السلوك القويم الكامل؛ وهي تُعبِّر عن
            نتيجة الأخلاق (السلوك المستقيم) لا عن المنظومة الأخلاقية ذاتها.
        - text: >
            «استقامة — rectitude»
          source: "مسرد الفلسفة وعلم النفس، ALECSO"
          addition: >
            rectitude (الاستقامة الأخلاقية) أضيق من morality؛ هي صفة الشخص المستقيم
            المنبثقة عن الأخلاق لا الأخلاق نفسها.

    - lemma: "البِرّ"
      expands:
        - text: >
            «البِرّ أصله: إيفاء الحق، فتفرَّعَ منه ما يكون إيفاءً للحقوق الأصلية من الطاعة
            للرب والأبوين والمواساة بالناس. ومن هذه الجهة صار بمعنى الإحسان، واشتمل الخيرات،
            وصار وصفاً للربّ تعالى... فالبِرّ خلاف الإثم، والعقوق، والغَدر، والظلم.»
          source: "مفردات القرآن للفراهي"
          addition: >
            البِرّ أوسع من الأخلاق إذ يشمل جميع الخيرات (الدينية والدنيوية والاجتماعية)؛
            وهو يتضمن الأخلاق لكنه لا يساويها.
        - text: >
            «البر: بالفتح خلاف البحر، وتصور منه فاشتق منه، البر بالكسر أي التوسع في فعل
            الخير، والفعل المرضي الذي هو في تزكية النفس كالبر في تغذية البدن»
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: >
            التوسع في فعل الخير (البِرّ) أقرب للفضيلة الشاملة منه للأخلاق بوصفها
            منظومة تمييز بين الخير والشر.

    - lemma: "الخُلُقِيَّة"
      contradicts:
        - text: >
            «الشَّخْصِيَّةُ الخُلُقِيَّة (فى علم النَّفْس) character: مجمُوعُ العادات والعواطِف
            والمُثُلِ التي تُميِّزُ الفَرْدَ، وتجعلُ أفْعالَهُ ثابتَةً نِسْبِيًّا»
          source: "المعجم الكبير لمجمع اللغة العربية"
          conflict: >
            «الخُلُقِيَّة» مصطلح نفسي راسخ بمعنى character (الشخصية الخُلُقية) لا morality؛
            المصطلح المُوثَّق في المعجمية العربية لـmorality هو «أخلاق» أو «أخلاقية» لا «خُلُقِيَّة».


stage3_analysis:
  per_lemma:
    - lemma: "أخلاق"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في المعجم الوسيط والمعجم الكبير ومعاجم المصطلحات الفلسفية بمعنى المنظومة
        الأخلاقية والتمييز بين الخير والشر؛ وهي الترجمة المعتمدة لـmorality/ethics في المعجمية
        العربية الحديثة. غير أنها تحتاج تشكيلاً كاملاً في المخرجات.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «أَخْلاق» — جمع خُلُق — يُعبِّر عن المنظومة القيمية كمجموع السجايا والمعايير
        المكتسبة؛ وهو الاسم الأصلي الراسخ للمفهوم الكلي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَخْلاق"

    - lemma: "مبادئ أخلاقية"
      decision: removed
      decision_reason: >
        «مبادئ أخلاقية» تعني «القواعد والمبادئ المنبثقة عن الأخلاق» — وهو مستوى دلالي أدنى
        وأضيق من «الأخلاق» بوصفها منظومة. المورد الحديث يورده شرحاً وتعريفاً لإحدى معاني
        morality (sense 3) لا لمّةً مرادفة لها. كذلك لم يرد المركّب مُدخَلاً معجمياً مستقلاً
        في أيٍّ من المعاجم المُستعلَمة. اختبار الاستبدال: لا يصلح «مبادئ أخلاقية» مكان «أخلاق»
        في جمل مثل «حسن الأخلاق / علم الأخلاق».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "التَّخَلُّق"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الكبير (مجمع اللغة العربية) يُوثِّق «التَّخَلُّق» مصطلحاً جيولوجياً راسخاً
        (diagenesis = تكوّن معادن جديدة في الصخور). الاستعمال الأخلاقي — وإن كان واردًا لغويًا —
        سيُوقع في اشتراك مصطلحي حادّ مع علم الجيولوجيا.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الاسْتِقَامَة"
      source: stage1
      decision: removed
      decision_reason: >
        «الاستقامة» تُعبِّر عن السلوك المستقيم كنتيجة للأخلاق (rectitude)، لا عن المنظومة
        الأخلاقية ذاتها. المستوى الدلالي مختلف: «الأخلاق» منظومة معيارية، و«الاستقامة» صفة
        شخصية. الفلاسفة العرب يُقابلون rectitude بـ«الاستقامة» لا بـ«الأخلاق».
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "البِرّ"
      source: stage1
      decision: removed
      decision_reason: >
        «البِرّ» أشمل من «الأخلاق»: يدلّ على الخير الشامل الديني والدنيوي والاجتماعي (filial
        piety + righteousness + goodness). كذلك هو شديد التعدد الدلالي (البِرّ=الصدق/الطاعة/
        الإحسان/خلاف البحر/حبة القمح). وضعه في المجموعة سيُدخل التلبيس.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "الخُلُقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الكبير يُوثِّق «الخُلُقِيَّة» مصطلحاً نفسياً بمعنى character (الشخصية الخُلُقية
        = مجموع العادات والعواطف). هذا المعنى يختلف جوهريًا عن morality؛ character ≠ morality.
        المُوثَّق لـmorality في ARABTERM هو «أخلاقية» (entry 490000) لا «خُلُقِيَّة».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


