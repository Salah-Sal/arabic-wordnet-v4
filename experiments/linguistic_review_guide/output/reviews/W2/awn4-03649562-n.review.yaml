      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجْهِيزٌ مُؤَقَّتٌ"
    - lemma: "تَرْتِيبٌ مُرْتَجَلٌ"
      source: stage1
      decision: confirmed
      decision_reason: "أدق وصف لغوي للمفهوم، حيث يجمع بين 'الترتيب' (الهايبرنيم) و'الارتجال' (الفصل النوعي)."
