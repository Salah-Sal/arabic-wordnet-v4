            entry_id: "{auto}"
            synset_id: "awn4-03649562-n"
    - lemma: "تَلْفِيقَةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "اسم وحدة يشير إلى النتيجة المادية المحددة لعملية التلفيق المرتجل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
