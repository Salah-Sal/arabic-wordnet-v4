        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03649562-n"

stage4_content:
  definition:
    current: "أي ترتيب مرتجل للاستخدام المؤقت"
    assessment:
      decision: revise
      reason: "التعريف الحالي أقرب للترجمة الحرفية منه للتعريف المعجمي الرصين."
    authored:
      - type: terminological
        text: "تجميعٌ أو ترتيبٌ يُصْنَعُ على عَجَلٍ أو ارْتِجَالٍ للوفاءِ بحاجةٍ عارضةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-03649562-n"
          definition_index: 0
          text: "تجميعٌ أو ترتيبٌ يُصْنَعُ على عَجَلٍ أو ارْتِجَالٍ للوفاءِ بحاجةٍ عارضةٍ."
  examples:
    per_lemma:
      - lemma: "تَلْفِيقٌ"
        examples:
          - text: "كان الجهاز عبارة عن تلفيقٍ سريعٍ للقطع المتاحة في المعمل."
            type: usage
      - lemma: "تَجْهِيزٌ مُؤَقَّتٌ"
        examples:
          - text: "اعتمد الباحثون على تجهيزٍ مؤقتٍ لرصد الظاهرة قبل وصول المعدات الأصلية."
            type: usage
      - lemma: "تَرْتِيبٌ مُرْتَجَلٌ"
        examples:
          - text: "جاء الحل في صورة ترتيبٍ مرتجلٍ لم يكن مخططاً له."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-03649562-n"
          text: "استخدم المهندسون تَرْتِيباً مُرْتَجَلاً لتشغيل المحرك في الظروف الطارئة."

