stage1_review:
  assessment:
    concerns:
      - "تجهيز مؤقت: تعبير وصفي أكثر من كونه مصطلحاً معجمياً مستقراً."
      - "تلفيق: اللفظ يحمل دلالة سلبية (التزوير) في الاستعمال المعاصر، لكن أصله اللغوي يدعم تماماً معنى 'تجميع أشياء لا تلائم بعضها في الأصل' وهو ما يقابل Lash-up."
    observations: "المفهوم يشير إلى الترتيبات التي تُصنع على عجل لسد حاجة آنية. المصطلحات الحالية مقبولة، ولكن يمكن إثراؤها بتعبيرات تركز على 'الارتجال' و'العارضة'."
  blind_candidates:
    - lemma: "تَرْتِيبٌ مُرْتَجَلٌ"
      generation_method: tarkib
      justification: "وصف مباشر للمفهوم (arrangement + improvised) كما ورد في التعريف."
    - lemma: "تَلْفِيقَةٌ"
      generation_method: ishtiqaq
      justification: "اسم مرة من التلفيق، يشير إلى الكيان المادي الناتج عن عملية التجميع المرتجلة."
    - lemma: "تَدْبِيرٌ مُؤَقَّتٌ"
      generation_method: tarkib
      justification: "استخدام 'تدبير' كمرادف لـ 'ترتيب' في سياق الإجراءات."
    - lemma: "تَوْضِيبٌ مَوْقِتٌ"
      generation_method: tarkib
      justification: "التوضيب مرادف للتجهيز والترتيب، والمَوْقِت صيغة قياسية للمؤقت."

stage2_evidence:
  per_lemma:
    - lemma: "تَلْفِيقٌ"
      confirm:
        - text: "«لَفَّقَ الشُّقَّتَين: ضمَّ إحداهما إلى الأخرى فخاطهما (ومنه أخْذ التلفيقِ في المسائل) الحديثَ: زخرفه ومَوَّهه بالباطل»"
          source: "المعجم الوسيط"
        - text: "«اللَّامُ وَالْفَاءُ وَالْقَافُ أُصَيْلٌ يَدُلُّ عَلَى مُلَاءَمَةِ الْأَمْرِ. يُقَالُ: لَفَقْتُ الثَّوْبَ بِالثَّوْبِ لَفْقًا. وَهَذَا لِفْقُ هَذَا، أَيْ يُوَائِمُهُ.»"
          source: "مقاييس اللغة"
    - lemma: "تَجْهِيزٌ مُؤَقَّتٌ"
      confirm:
        - text: "«البديل: كلُّ ما يُتَّخَذُ بديلًا بصورة مؤقَّتة» (في ترجمة makeshift)"
          source: "المورد الحديث (2008)"
        - text: "«تجهيز (في ترجمة supply)»"
          source: "المورد الحديث (2008)"
    - lemma: "تَرْتِيبٌ مُرْتَجَلٌ"
      confirm:
        - text: "«مُرْتَجَل (في ترجمة improvised)»"
          source: "المورد الحديث (2008)"
        - text: "«ارتجل الكلام: تكلم به من غير أن يهيئه»"
          source: "المحكم والمحيط الأعظم"

stage3_analysis:
  per_lemma:
    - lemma: "تَلْفِيقٌ"
      decision: confirmed
      decision_reason: "مصطلح دقيق دلالياً يشير إلى تجميع أجزاء مختلفة لتكوين وحدة وظيفية بشكل غير أصيل، وهو ما يقابل Lash-up تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَلْفِيقٌ"
    - lemma: "تَجْهِيزٌ مُؤَقَّتٌ"
      decision: confirmed
      decision_reason: "تعبير وصفي شائع ومفهوم، يناسب السياق التقني والمادي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
