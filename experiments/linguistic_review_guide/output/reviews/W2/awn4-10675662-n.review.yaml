# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10675662-n
# شخص يكبت أو يخنق أو يقمع / a person who stifles or smothers or suppresses
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «خَانِق» غالب استعمالها المعجمي للمَضِيق الجغرافي (الشِّعب، الوادي) أو للآلة (الخانق في الهندسة)، واستعمالها للشخص الذي يكبت نادر في المعاجم"
      - "لفظة «كَابِت» واردة في المعاجم الطبية والصيدلية بمعنى suppressor للأشياء لا للأشخاص، والمعنى الشخصي مؤيَّد من موسوعة السلطان قابوس فقط"
      - "التعريف العربي الحالي يكاد يكون ترجمة حرفية للتعريف الإنجليزي ويحتاج تأليفاً معجمياً"
    observations: "المجموعة تعبّر عن مفهوم فاعلية الكبت والقمع والخنق المعنوي في شخص. اللفظتان الموجودتان (خانق، كابت) كلتاهما اسم فاعل على وزن فاعِل، وهو الوزن الطبيعي لهذا المعنى. الحقل الدلالي يشمل أيضاً: قامع، كاظم، كابح. ينبغي التمييز بين من يكبت غيره (كابت، قامع) ومن يكبت نفسه (كاظم)."
  blind_candidates:
    - lemma: "قَامِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من قَمَعَ على وزن فاعِل، يدل على من يقهر غيره ويذله ويمنعه، وهو من أقرب الألفاظ دلالةً على مفهوم المجموعة"
    - lemma: "كَاظِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من كَظَمَ على وزن فاعِل، يدل على من يمسك على ما في نفسه، فيه إزاحة دلالية من كبت الذات إلى الكبت عموماً"
    - lemma: "مُكَبِّت"
      generation_method: ishtiqaq
      justification: "اسم فاعل من كَبَّتَ (فعّل) على وزن مُفَعِّل، يدل على من يمارس الكبت بصورة مكثفة"
    - lemma: "قَمَّاع"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من قَمَعَ على وزن فَعَّال، تدل على كثرة القمع واعتياده"


stage2_evidence:
  per_lemma:
    - lemma: "خَانِق"
      confirm:
        - text: "«يَخْنُق ... يكبِت، يَكْظِم ... يُقَيِّد ... يَعُوق ... يَقْمَع»"
          source: "المورد الحديث (2008) — مدخل stifle"
        - text: "«يخنق [بالدُّخان] ... يُخمِد [نارًا] ... يكتُم [سِرًّا] ... يَكْبَحُ [غضبَهُ]»"
          source: "المورد الحديث (2008) — مدخل smother"
      contradicts:
        - text: "«الشِّعْبُ الضَّيِّقُ فى الجبَلِ. وقيل: الشِّعْبُ الضَّيِّقُ بين جَبَلَيْنِ. الزُّقاقُ الضَّيِّقُ»"
          source: "المعجم الكبير"
          conflict: "الدلالة الأولى والسائدة في المعاجم العربية هي المعنى الجغرافي (مَضِيق) لا معنى الشخص الذي يكبت"
        - text: "«(الخانق) الشّعب الضّيق بَين جبلين والزقاق ... وخانق النمر نوع نَبَات»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط لا يسجّل معنى الشخص الذي يخنق/يكبت، بل يقتصر على المعنى الجغرافي والنباتي"
      expands:
        - text: "«(خَنَقَ) الْخَاءُ وَالنُّونُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ضِيقٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر خ ن ق يدور حول الضيق، فالخانق يمكن أن يكون من يُضيّق على غيره مجازاً"

    - lemma: "كَابِت"
      confirm:
        - text: "«كَابِت: من (ك ب ت) الحابس غيظه أو شهوته، والغائظ والمذل غيره»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«كابح؛ كابِت؛ كاظم؛ قامع»"
          source: "المورد الحديث (2008) — مدخل represser"
        - text: "«كابِت» = suppressor"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«كابِت» = suppressant / suppressive / suppressor"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«(كَبَتَ) الْكَافُ وَالْبَاءُ وَالتَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ مِنَ الْإِذْلَالِ وَالصَّرْفِ عَنِ الشَّيْءِ. يُقَالُ: كَبَتَ اللَّهُ الْعَدُوَّ يَكْبِتُهُ، إِذَا صَرَفَهُ وَأَذَلَّهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ك ب ت أصل في الإذلال والصرف، ومنه الكابت: من يذلّ غيره ويصرفه"

    - lemma: "قَامِع"
      confirm:
        - text: "«كابح؛ كابِت؛ كاظم؛ قامع»"
          source: "المورد الحديث (2008) — مدخل represser"
        - text: "«يَقْمَع؛ يُخْمِد [ثورةً] ... يكتم ... يَكْبِت؛ يَكْظِم ... يُوْقِف»"
          source: "المورد الحديث (2008) — مدخل suppress"
      expands:
        - text: "«(قَمَعَ) ... إِذْلَالٌ وَقَهْرٌ ... قَمَعْتُهُ: أَذْلَلْتُهُ. وَمِنْهُ قَمَعْتُهُ، إِذَا ضَرَبْتُهُ بِالْمِقْمَعِ. قَالَ اللَّهُ تَعَالَى: {وَلَهُمْ مَقَامِعُ مِنْ حَدِيدٍ}»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ق م ع أصل في القهر والإذلال، والقامع وصف طبيعي لمن يمارس القمع"

    - lemma: "كَاظِم"
      confirm:
        - text: "«كَاظِم: من (ك ظ م) الممسك على ما في نفسه عند الغضب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(الكاظم) الممسك على مَا فِي نَفسه عِنْد الْغَضَب وَفِي التَّنْزِيل الْعَزِيز {والكاظمين الغيظ}»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الممسك علي ما فى نفسه عند الغضب»"
          source: "المعجم الوسيط"
          conflict: "الكاظم مخصوص بمن يكبت غيظَ نفسه لا بمن يكبت غيره، والمجموعة تتحدث عن شخص يكبت أو يقمع (الآخرين أو الأشياء)"

    - lemma: "مُكَبِّت"
      evidence_status: "no_material_found"

    - lemma: "قَمَّاع"
      confirm:
        - text: "«قَمَّاع: من (ق م ع) من يدخل في البيت ونحوه هاربا، ومن يقهر غيره ويذله ويمنعه عما يريد، ومن ينصت لغيره عند الكلام»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(قَمَعَ) ... إِذْلَالٌ وَقَهْرٌ ... قَمَعْتُهُ: أَذْلَلْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "صيغة فَعَّال للمبالغة مناسبة لمن يكثر من القمع"


stage3_analysis:
  per_lemma:
    - lemma: "خَانِق"
      decision: confirmed
      decision_reason: "اسم فاعل من خَنَقَ صحيح صرفياً للدلالة على الشخص الذي يخنق. رغم أنّ المعاجم العربية تركّز على المعنى الجغرافي والنباتي، فإنّ الاستعمال بمعنى الشخص الفاعل قياسي صرفياً، ومؤيَّد بترجمة المورد الحديث لـ stifle/smother بالخنق والكبت. اللفظة مقبولة بوصفها تقابل stifler/smotherer في البعد الحسّي"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البعد الحسّي الجسدي للكبت (الخَنْق)، ويُستعمل حين يكون القمع بمنع النَّفَس أو الصوت أو الحركة مباشرةً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَانِق"

    - lemma: "كَابِت"
      decision: confirmed
      decision_reason: "مؤيَّد بأدلة قوية من موسوعة السلطان قابوس («الحابس غيظه أو شهوته، والغائظ والمذل غيره») ومن المورد الحديث ومن المعاجم الطبية والصيدلية. الجذر ك ب ت أصل في الإذلال والصرف عند ابن فارس. اللفظة أدق ترادف لمفهوم المجموعة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البعد النفسي للكبت (حبس الغيظ والشهوة وإذلال الغير)، وهو أعمّ من خَانِق وأخصّ من قَامِع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَابِت"

    - lemma: "قَامِع"
      source: stage1
      decision: confirmed
      decision_reason: "مؤيَّد بالمورد الحديث الذي يسرد «كابح؛ كابِت؛ كاظم؛ قامع» مرادفات لـ represser، وبمقاييس اللغة حيث الجذر ق م ع أصل في الإذلال والقهر. اللفظة فصيحة شائعة ومسجّلة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على بعد القهر والإذلال بالقوة والسلطة، أقوى دلالياً من كابت، ويوحي بممارسة السلطة القمعية"
      actions:
        - command: create_entry
          params: {lemma: "قَامِع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "كَاظِم"
      source: stage1
      decision: removed
      decision_reason: "الكاظم في المعاجم مخصوص بمن يمسك على ما في نفسه عند الغضب (كبت الذات)، لا بمن يكبت غيره. المجموعة تصف شخصاً يُمارس الكبت والقمع على الآخرين أو الأشياء، فلا يصحّ إدراج الكاظم فيها"

    - lemma: "مُكَبِّت"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على هذه الصيغة. وزن مُفَعِّل من كَبَّتَ غير مسجّل في المعاجم المتاحة، واللفظة غير مسكوكة"

    - lemma: "قَمَّاع"
      source: stage1
      decision: removed
      decision_reason: "رغم ورودها في موسوعة السلطان قابوس بمعنى «من يقهر غيره»، فإنّ لها معنيين آخرين منافسين (الهارب، المُنصت)، والصيغة قَامِع أوضح وأشيع وأقل التباساً"


