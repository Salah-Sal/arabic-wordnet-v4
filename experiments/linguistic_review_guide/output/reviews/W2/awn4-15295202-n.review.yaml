# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15295202-n
# time slot — a time assigned on a schedule or agenda
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "«فسحة زمنية» تعني في المعاجم المتخصصة «time lag» (الفارق الزمني) لا «time slot» (الحيّز الزمني المخصّص)"
      - "«مخصص زمني» تركيب وصفي غير مسكوك معجمياً؛ مُخَصَّص اسم مفعول يصف صفة لا يسمّي مفهوماً"
      - "غياب المصطلح المتخصص «حيّزة زمنية» المُثبَت في معجم مصطلحات المعلوماتية كمقابل مباشر لـ time slot"
    observations: >
      المفهوم المطلوب هو وحدة زمنية مُقتطعة من جدول أو برنامج وتُخصَّص لنشاط معيّن.
      «فترة زمنية» هي الأعمّ والأكثر شيوعاً وقد أُثبتت في مسارد الاتصالات والبثّ مقابلاً لـ time slot.
      أمّا «فسحة» فأصل دلالتها السَّعة والفراغ لا التخصيص والتقسيم، و«مخصص زمني» ليس مصطلحاً بل وصف حرّ.
  blind_candidates:
    - lemma: "خَانَة"
      generation_method: majaz
      justification: >
        الخانة في المعجم الوسيط «المنزلة» وفي اصطلاح الكتّاب مربّع في جدول، فيُتجوَّز بها
        إلى المربّع الزمني في جدول المواعيد. لكنّ الاستعمال المعجمي المُثبَت مكانيّ/عدديّ لا زمنيّ.
    - lemma: "حِصَّة زَمَنِيَّة"
      generation_method: tarkib
      justification: >
        الحصّة في المعجم الوسيط «النصيب» و«الفترة من الزمن (مولّدة)»، والمعجم الكبير يخصّصها
        بالفترة المُخصَّصة لدرس ما. التركيب الإضافي «حصة زمنية» يطابق المفهوم تماماً.
    - lemma: "مَوْعِد"
      generation_method: ishtiqaq
      justification: >
        من الجذر وعد على وزن مَفْعِل الدالّ على الزمان والمكان. المعجم الوسيط: «الوعد ومكانه وزمانه».
        لكنّه يفترض اتفاقاً بين طرفين (وعد) وليس مجرّد خانة في جدول.
    - lemma: "شَرِيحَة زَمَنِيَّة"
      generation_method: tarkib
      justification: >
        الشريحة «القطعة المرقَّقة» فتُستعار للقطعة الزمنية. وردت في معجم المعلوماتية مقابلاً
        لـ time slice، لكنّها أقرب لمفهوم الشريحة الحاسوبية منها للخانة في الجدول.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "فَتْرَة زَمَنِيَّة"
      confirm:
        - text: "«فترة زمنية» = slot (radio & TV)"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«فترة زمنية» = time-slot; TS"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«فترة زمنية» = time interval"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«فترة زمنية» = period — دَوْر (المرادف العربي)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يُستعمل أيضاً بمعنى الدور/الفترة العامة وليس حصراً time slot"

    - lemma: "فُسْحَة زَمَنِيَّة"
      contradicts:
        - text: "«فسحة زمنية» = time lag"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "time lag (الفارق الزمني) مفهوم مختلف تماماً عن time slot (الحيّز المخصَّص)"
      expands:
        - text: "«(الفسحة) السَّعَة... والسَّعَة بين عملين للراحة والتنزه (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الفسحة في الاستعمال المحدث تعني الاستراحة بين عملين لا الوقت المخصَّص لنشاط"

    - lemma: "مُخَصَّص زَمَنِيّ"
      evidence_status: "no_material_found"

    # ── مرشحات المرحلة ١ ──
    - lemma: "خَانَة"
      confirm:
        - text: "«(الخانة) المنزلة. ويقال (في اصطلاح الكتّاب): خانة العشرات وخانة المئات (مع)»"
          source: "المعجم الوسيط"
      expands:
        - text: "«خانة [مفرد] ج خانات: (جب) وضع رقم ما في متسلسلة أو عدد، أو منزلة في الأعداد أو المسائل الحسابيّة. كلّ مربّع مخطّط أو مرسوم في رقعة الشطرنج»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "الخانة مُثبتة لمنزلة الأعداد ومربّعات الشطرنج لكن لم تُثبَت للزمن"

    - lemma: "حِصَّة زَمَنِيَّة"
      confirm:
        - text: "«حصة زمنية» = time period; segment period"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«(الحصّة) النصيب (ج) حصص والفترة من الزمن (مو)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«النَّصِيبُ من كلِّ شيءٍ... (في اليوم المدرَّسي): الفترةُ من الزمن تُخصَّص لدرس ما كحصّة النحو وحصّة الحساب»"
          source: "المعجم الكبير"
      expands:
        - text: "«أجاز الوسيط كلمة حِصّة بمعنى الفترة من الزمن، وذكر أنها مولّدة، وأقرّ مجمع اللغة المصري هذا الاستعمال على سبيل المجاز»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الاستعمال الزمني لـ«حصّة» مُقَرّ من مجمع اللغة العربية بالقاهرة وإن كان مولَّداً"

    - lemma: "مَوْعِد"
      confirm:
        - text: "«(الموعد) الوعد ومكانه وزمانه والعهد (ج) مواعد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«موعد» = appointment"
          source: "مسرد الإعلام والتواصل (ALECSO)"
      contradicts:
        - text: "«موعد» = appointment"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          conflict: "الموعد يفترض اتفاقاً بين طرفين (وعد)، بينما time slot خانة في جدول لا تستلزم اتفاقاً"

    - lemma: "شَرِيحَة زَمَنِيَّة"
      confirm:
        - text: "«شريحة زمنية» = time slice — مهلة زمنية قصيرة تُعطَى خلالها مهمة معيّنة لقيادة التحكّم في المعالج الصغري في بيئة متعددة المهمات"
          source: "معجم مصطلحات المعلوماتية (2000)"
      contradicts:
        - text: "«شريحة زمنية» = time slice"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "time slice مفهوم حاسوبي (تقسيم وقت المعالج) يختلف عن time slot (خانة في جدول مواعيد)"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "فَتْرَة زَمَنِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح مُثبَت في مسارد الاتصالات والبثّ الإذاعي وموسوعة الكهرباء (IEC) مقابلاً مباشراً لـ time slot.
        مركّب إضافي راسخ في الاستعمال التقني العربي المعاصر.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الأعمّ والأكثر شيوعاً في السياقات التقنية والإعلامية؛ يُركَّز فيه على البُعد الزمني
        (فترة = مدّة) أكثر من بُعد التخصيص والنصيب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَتْرَة زَمَنِيَّة"

    - lemma: "فُسْحَة زَمَنِيَّة"
      decision: removed
      decision_reason: >
        المصطلح مُثبَت في المعاجم المتخصصة بمعنى «time lag» (الفارق الزمني) لا «time slot».
        ودلالة «الفسحة» الأصلية هي السعة والفراغ بين عملين للراحة، وهي لا تتضمّن معنى
        التخصيص والتقسيم المنتظم في جدول.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُخَصَّص زَمَنِيّ"
      decision: removed
      decision_reason: >
        لم يُعثَر على أيّ شاهد معجمي لهذا التركيب. «مُخَصَّص» اسم مفعول يصف صفة (شيء مخصَّص)
        ولا يصلح مركّباً اسمياً يسمّي مفهوماً. يفشل في اختبار السكّ: يمكن إبدال «مخصص» بـ«مُعَيَّن»
        أو «مُحَدَّد» ويبقى وصفاً حرّاً لا مصطلحاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "حِصَّة زَمَنِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبتة في مسرد الإعلام (ALECSO) مقابلاً لـ time period/segment period.
        وجذرها «حصّة» مُقَرّ من مجمع اللغة العربية بمعنى الفترة المخصّصة من الزمن (مولّدة).
        المعجم الكبير يُفصّل: «الفترة من الزمن تُخصَّص لدرس ما». يُبرز بُعد التخصيص والنصيب
        أكثر من «فترة زمنية».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز بُعد النصيب والتخصيص (حصّة = نصيب مُقتطع)؛ أقرب للاستعمال التعليمي والإداري
        حيث يُقسَّم اليوم إلى حصص محدّدة لكلّ نشاط.
      actions:
        - command: create_entry
          params:
            lemma: "حِصَّة زَمَنِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "خَانَة"
      source: stage1
      decision: removed
      decision_reason: >
        الخانة مُثبتة معجمياً للمنزلة العددية ومربّعات الشطرنج والصناديق، ولم تُثبَت
        في أيّ معجم للدلالة الزمنية. الامتداد المجازي من المكاني إلى الزمني ممكن نظرياً
        لكنّه غير مسكوك.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مَوْعِد"
      source: stage1
      decision: removed
      decision_reason: >
        الموعد يتضمّن دلالة الوعد والاتفاق بين طرفين وهو أقرب لـ appointment منه لـ time slot.
        الفارق الدلالي جوهري: time slot خانة موضوعية في جدول، بينما الموعد يستلزم إرادة واتفاقاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "شَرِيحَة زَمَنِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مُثبتة حصراً في سياق الحوسبة (time slice = تقسيم وقت المعالج)، وهو مفهوم تقني
        مختلف عن time slot (خانة في جدول مواعيد). لا يصحّ نقلها إلى هذه المجموعة
        لتجنّب الخلط المصطلحي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "وقت مخصص في جدول أو أجندة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في جوهره لكنّه يحتوي على لفظة «أجندة» وهي دخيلة من الإيطالية،
        ويمكن إبدالها بـ«برنامج». كذلك ينقصه تحديد الجنس القريب (فترة/مدّة) الذي يربطه
        بالمفرط «فاصل زمني».
    authored:
      - type: terminological
        text: "مُدَّةٌ مُحَدَّدَةٌ فِي جَدْوَلٍ أَوْ بَرْنَامَجٍ تُخَصَّصُ لِنَشَاطٍ بِعَيْنِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُدَّةٌ مُحَدَّدَةٌ فِي جَدْوَلٍ أَوْ بَرْنَامَجٍ تُخَصَّصُ لِنَشَاطٍ بِعَيْنِهِ"

  examples:
    per_lemma:
      - lemma: "فَتْرَة زَمَنِيَّة"
        examples:
          - text: "خُصِّصَت فَتْرَةٌ زَمَنِيَّةٌ لِكُلِّ مُتَحَدِّثٍ فِي جَدْوَلِ المُؤتَمَرِ لا تَتَجَاوَزُ عِشْرِينَ دَقِيقَةً."
            type: usage
      - lemma: "حِصَّة زَمَنِيَّة"
        examples:
          - text: "تَطْلُبُ القَنَاةُ مِنَ المُعْلِنِينَ حَجْزَ الحِصَّةِ الزَّمَنِيَّةِ قَبْلَ أُسْبُوعٍ عَلَى الأَقَلِّ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "خُصِّصَت فَتْرَةٌ زَمَنِيَّةٌ لِكُلِّ مُتَحَدِّثٍ فِي جَدْوَلِ المُؤتَمَرِ لا تَتَجَاوَزُ عِشْرِينَ دَقِيقَةً."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَطْلُبُ القَنَاةُ مِنَ المُعْلِنِينَ حَجْزَ الحِصَّةِ الزَّمَنِيَّةِ قَبْلَ أُسْبُوعٍ عَلَى الأَقَلِّ."

