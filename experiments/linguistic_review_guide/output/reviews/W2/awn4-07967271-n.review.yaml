# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07967271-n
# tradespeople — people engaged in trade
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «حرفيون» تدل على أصحاب الحِرَف اليدوية لا على المشتغلين بالتجارة مباشرةً، مما يُظهِر تضييقاً في التعريف العربي الحالي"
      - "التعريف العربي «الناس المشتغلون بالتجارة» لا يُغطّي شقّ الحِرَفيّين الموجود في المفهوم الإنجليزي tradespeople"
      - "اللمّتان بدون تشكيل كامل"
    observations: "المجموعة تقابل المفهوم الإنجليزي tradespeople الذي يشمل فئتين: التُّجَّار (الباعة والمشترون) والحِرَفيّين (أصحاب المهن اليدوية والصنائع). المورد الحديث يؤكد هذا التقسيم صراحةً. التعريف العربي الحالي يقتصر على شقّ التجارة ويُغفِل شقّ الحرفة، فيحتاج إلى مراجعة."
  blind_candidates:
    - lemma: "تُجَّار"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«تاجر» على وزن فُعَّال، وهو الجمع الأشهر للمشتغلين بالبيع والشراء"
    - lemma: "بَاعَة"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«بائع» من الجذر ب-ي-ع، يدل على من يمارس البيع"
    - lemma: "أَهْلُ التِّجَارَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي يجمع بين «أهل» و«التجارة» للدلالة على المنتسبين إلى عالم التجارة"
    - lemma: "مُتَّجِرُون"
      generation_method: ishtiqaq
      justification: "جمع مذكر سالم لـ«مُتَّجِر» على وزن مُفتَعِل من ت-ج-ر، يدل على من يمارس التجارة"

stage2_evidence:
  per_lemma:
    - lemma: "تُجَّار"
      confirm:
        - text: "«التُّجّار»"
          source: "المورد الحديث — ترجمة tradespeople (entry 724372)"
        - text: "«تجار — merchants»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«التَّاجِرُ: الذي يَبيعُ ويَشْتَرِي، وبائِعُ الخَمْرِ، ج: تِجَارٌ وتُجَّارٌ وتَجْرٌ وتُجُرٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يُثبت أن تجار وتُجَّار كلاهما جمع لتاجر مع جموع أخرى"
        - text: "«التَّاجِر: الشَّخْص الَّذِي يمارس الْأَعْمَال التجارية على وَجه الاحتراف بِشَرْط أَن تكون لَهُ أَهْلِيَّة الِاشْتِغَال بِالتِّجَارَة»"
          source: "المعجم الوسيط (hawramani)"
          addition: "تعريف حديث يربط التاجر بالاحتراف التجاري"

    - lemma: "حِرَفِيُّون"
      confirm:
        - text: "«(1) التُّجّار (2) الحِرَفيُّون.»"
          source: "المورد الحديث — ترجمة tradespeople (entry 724372)"
        - text: "«(1) التاجر؛ صاحب المتجر (2) الحِرَفيّ.»"
          source: "المورد الحديث — ترجمة tradesman (entry 724371)"
      expands:
        - text: "«الْحرفِي: الشَّخْص الَّذِي يكْسب عيشه بِالْعَمَلِ فِي حِرْفَة بِصفة مستمرة ومنتظمة»"
          source: "المعجم الوسيط (hawramani)"
          addition: "يؤكد أن الحرفي صاحب مهنة يدوية وليس تاجراً بالضرورة"
        - text: "«حرفي — صانع تقليدي — craftsman»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "ALECSO يساوي بين حرفي وصانع تقليدي"

    - lemma: "بَاعَة"
      contradicts:
        - text: "«(الباعة) باعة الدَّار باحتها»"
          source: "المعجم الوسيط (hawramani)"
          conflict: "المدخل المعجمي يُفسّر «الباعة» بمعنى باحة الدار (ساحتها) من الجذر ب-و-ع، لا بمعنى جمع بائع"
        - text: "«باحة الدار: باحتها»"
          source: "المعجم الوسيط (OCR)"
          conflict: "تأكيد أن الباعة في المعجم = الباحة، وليس جمع بائع"

    - lemma: "أَهْلُ التِّجَارَةِ"
      evidence_status: "no_material_found"

    - lemma: "مُتَّجِرُون"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تُجَّار"
      decision: confirmed
      decision_reason: "جمع تكسير مُتواتر لـ«تاجر»، موثّق في القاموس المحيط والوسيط وARABTERM. المورد الحديث يؤكد أنه الشقّ الأول من tradespeople."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على المشتغلين بالبيع والشراء تحديداً، بخلاف حرفيون الذي يدل على أصحاب الصنائع اليدوية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تُجَّار"

    - lemma: "حِرَفِيُّون"
      decision: confirmed
      decision_reason: "المورد الحديث يؤكد أن tradespeople = التُّجَّار + الحِرَفيُّون. مفهوم الحرفي موثّق في الوسيط بمعنى صاحب الحرفة. الإبقاء عليه ضروري لتغطية شقّ أصحاب المهن اليدوية من المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على أصحاب الحرف والصنائع اليدوية الذين يكسبون عيشهم بالعمل المهني، بخلاف تُجَّار الذي يقتصر على من يبيع ويشتري"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِرَفِيُّون"

    - lemma: "بَاعَة"
      source: stage1
      decision: removed
      decision_reason: "المداخل المعجمية المتوفرة لـ«الباعة» في الوسيط والكبير تُفسّرها بمعنى باحة الدار (ساحتها) من الجذر ب-و-ع. ولم تُوثَّق كجمع لـ«بائع» في المداخل المعجمية المتاحة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "أَهْلُ التِّجَارَةِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ وليس مصطلحاً مسكوكاً. يمكن إبدال «أهل» بـ«أصحاب» أو «ذوي» دون تغيير الدلالة، مما يفشل في اختبار السكّ."
      evidence_assessment:
        case: no_material

    - lemma: "مُتَّجِرُون"
      source: stage1
      decision: removed
      decision_reason: "لم تُوثَّق هذه الصيغة في أيّ مصدر معجمي. جمع المذكر السالم لاسم الفاعل «مُتَّجِر» غير مستعمل مقابل الجمع المتواتر «تُجَّار»."
      evidence_assessment:
        case: no_material

