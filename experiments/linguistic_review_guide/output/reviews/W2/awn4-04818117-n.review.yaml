      contradicts:
        - text: "«(عَصَوَىْ) الْعَيْنُ وَالصَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى التَّجَمُّعِ، وَيَدُلُّ الْآخَرُ عَلَى الْفُرْقَةِ... والعِصيانُ والمعصية: وهو الأصل الآخر الدال على الفرقة»"
          source: "مقاييس اللغة لابن فارس (entry_id: 987734)"
