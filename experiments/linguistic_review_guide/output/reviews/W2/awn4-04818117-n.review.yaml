stage3_analysis:

  per_lemma:

    - lemma: "عَدَم مَشْرُوعِيَّة"
      decision: confirmed
      decision_reason: >-
        المصطلح راسخ في الخطاب القانوني العربي المعاصر، مدعوم بأدلة معجمية متعددة على مكوّنيه (عَدَم + مَشْرُوعِيَّة)،
        ومُثبَّت في المعاجم المتخصصة (ARABTERM-Law). يجتاز اختبار السكّ: لا يمكن إبدال «عَدَم» بـ«غياب» أو «انعدام»
        في السياق القانوني الرسمي دون تغيير الأسلوب. يجتاز اختبار التثبيت المعجمي: مُسجَّل ومتداول كوحدة ثابتة.
        يحتاج إلى تصحيح التشكيل الإعرابي الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        اللمّة الوحيدة في المجموعة؛ تُعبّر عن الصفة القانونية الكلية للخروج على أحكام القانون بأسلوب رسمي محايد
        يُستخدم في الأحكام القضائية والنصوص التشريعية، دون إدانة أخلاقية ضمنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ مَشْرُوعِيَّةٍ"

    - lemma: "اللاَّشَرْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        الأدلة المعجمية تكشف عن تعارض دلالي مزدوج: في المعجم الكبير تعني «الفوضى وغياب الشرائع والنظم» (أوسع
        من مجرد مخالفة قانون بعينه)، وفي المعاجم الحديثة (المورد) تخصّصت في «فساد النسب وعدم شرعية الولادة».
        كلا المعنيين يُبعد اللمّة عن دلالة المجموعة (صفة مخالفة القانون).
      evidence_assessment:
        case: mixed

    - lemma: "الجَوْر"
      source: stage1
      decision: removed
      decision_reason: >-
        الجور في المعجمية العربية يدل على «نقيض العدل والانحراف عن القصد» وهو مفهوم أخلاقي-اجتماعي.
        المجموعة تطلب «صفة عدم الامتثال للقانون» كمفهوم قانوني وضعي، وهو أضيق وأكثر تقنية من الجور.
        إدراجه سيُدخل دلالة الظلم الأخلاقي في مجموعة ذات طابع قانوني صرف.
      evidence_assessment:
        case: mixed

    - lemma: "المَعْصِيَة"
      source: stage1
      decision: removed
      decision_reason: >-
        المعصية مصطلح فقهي-ديني راسخ يعني «مخالفة أمر الشارع قصداً»، وهو مرتبط بالحقل الأخلاقي-الديني.
        استخدامه لمفهوم «عدم الامتثال للقانون الوضعي» سيُحدث خلطاً بين المرجعية الدينية والمرجعية القانونية.
      evidence_assessment:
        case: contradicts_only

    - lemma: "اللاَّقانونِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        المصطلح غير موثّق في أي معجم عربي. لا وجود له في قواعد البيانات المعجمية المستعلَمة. ليس مسكوكاً
        بعد كوحدة معجمية ثابتة، مما يجعل إدراجه في AWN4 سابقاً لأوانه.
      evidence_assessment:
        case: no_material


