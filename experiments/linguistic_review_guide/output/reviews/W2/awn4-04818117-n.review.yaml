#  Q1: مطابقة دفعية — جور + معصية + مشروعية + اللاشرعية
#  Q2: جسر إنجليزي — unlawfulness/illegality/unlawful/lawlessness
#  Q3: بحث FTS — عدم مشروعية / اللاشرعية / عدم الامتثال
#  Q4: تحقق مرشح — لاقانونية / عدم مشروعية / عدم الشرعية
#  Q5: مقاييس اللغة — شرع + جور + عصوي + عدم
