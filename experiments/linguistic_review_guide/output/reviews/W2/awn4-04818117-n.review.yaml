stage2_evidence:

  per_lemma:

    - lemma: "عَدَم مَشْرُوعِيَّة"
      confirm:
        - text: "«مشروعية — legitimacy» [مصطلح في مجال القانون]"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM، entry_id: 413387"
        - text: "«مشروعية — legitimacy» [مصطلح في مجال الفلسفة وعلم النفس]"
          source: "مسرد الفلسفة وعلم النفس — ARABTERM، entry_id: 489897"
        - text: "«غير قانونيّ — illegal» [في الخطاب القانوني الموحّد]"
          source: "المعجم الموحد لمصطلحات القانون (2017)، entry_id: 413008"
        - text: "«غير مشروع — unlawful» [بمعنى: محظور، محرَّم، غير قانونيّ]"
          source: "المورد الحديث (2008)، entry_id: 726245"
      expands:
        - text: "«(شَرَعَ) الشِّينُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، وَهُوَ شَيْءٌ يُفْتَحُ فِي امْتِدَادٍ يَكُونُ فِيهِ. مِنْ ذَلِكَ الشَّرِيعَةُ، وَهِيَ مَوْرِدُ الشَّارِبَةِ الْمَاءَ. وَاشْتُقَّ مِنْ ذَلِكَ الشِّرْعَةُ فِي الدِّينِ وَالشَّرِيعَةِ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 987139)"
          addition: "يُبيّن أن جذر «شرع» يدل أصلاً على الانفتاح والامتداد، ثم اشتُقَّت منه الشريعة بوصفها المنهج المفتوح للسالكين، مما يُعمّق الأساس الاشتقاقي لـ«مشروعية»."
        - text: "«(عَدَمَ) الْعَيْنُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى فُقْدَانِ الشَّيْءِ وَذَهَابِهِ. مِنْ ذَلِكَ الْعَدَمُ. وَعَدِمَ فُلَانٌ الشَّيْءَ، إِذَا فَقَدَهُ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 987667)"
          addition: "يُرسّخ أن «عَدَم» يدل على الفقد التام لا على النقص، مما يجعل المركب «عَدَم مَشْرُوعِيَّة» دقيقاً في التعبير عن الانعدام الكلي للمشروعية."

    - lemma: "اللاَّشَرْعِيَّة"
      confirm:
        - text: "«اللاشَرْعِيَّةُ: حالةٌ مِنَ الفوضى وغيابِ الشرائع والنُّظُمِ والعُهُودِ»"
          source: "المعجم الكبير (entry_id: 51122)"
      contradicts:
        - text: "«(1) اللّاشرعية: كونُ الولد نغلًا أو غير شرعيّ — (2) الإنغال: إنجابُ ولدٍ غير شرعيّ — bastardy»"
          source: "المورد الحديث (2008)، entry_id: 672886"
          conflict: "في المعاجم الحديثة، اللاشرعية تُحيل أساساً إلى فساد النسب وليس إلى مخالفة القانون."
        - text: "«(1) اللاشرعية (2) النُّغولة: فساد النَّسَب — illegitimacy»"
          source: "المورد الحديث (2008)، entry_id: 694120"
          conflict: "تأكيد ثانٍ على أن الاستخدام السائد في المعاجم المعاصرة يُخصّص اللاشرعية لعدم شرعية النسب."

    - lemma: "الجَوْر"
      confirm:
        - text: "«الجَوْرُ: نَقِيضُ العَدْلِ، وضِدٌّ القَصْدِ»"
          source: "القاموس المحيط للفيروزآبادي (entry_id: 797268)"
        - text: "«الجَوْرُ: الْخُرُوج عَن الْوسط بِزِيَادَة أَو نُقْصَان»"
          source: "معجم مقاليد العلوم للسيوطي (entry_id: 806763)"
        - text: "«(جَوَرَ) الْجِيمُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْمَيْلُ عَنِ الطَّرِيقِ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 985749)"
      contradicts:
        - text: "«جور: [في الانكليزية] Iniquity — عند الصوفية ما يمنع السالك من السير في العروج»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry_id: 821316)"
          conflict: "الجور في الاستخدامات الاصطلاحية يدور حول الظلم الأخلاقي والإنساني، لا حول مخالفة القانون الوضعي."

    - lemma: "المَعْصِيَة"
      confirm:
        - text: "«المعصية: مخالفةُ الأمر قصداً»"
          source: "التعريفات الفقهية للبركتي (entry_id: 835959)"
        - text: "«المعصية: مخالفة الأمر قصدًا»"
