# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04818117-n  |  ILI: i62286  |  POS: n
# EN: unlawfulness  |  AR: عَدَم مَشْرُوعِيَّة
# ═══════════════════════════════════════════════════════════════

stage1_review:

  assessment:
    concerns:
      - "اللمّة الوحيدة «عَدَم مَشْرُوعِيَّة» تحمل تشكيلاً ناقصاً: يفتقر «عَدَم» إلى الضمة الإعرابية (عَدَمُ)، وتفتقر «مَشْرُوعِيَّة» إلى التنوين (مَشْرُوعِيَّةٍ) في الصورة الإضافية الإعرابية الكاملة."
      - "المجموعة تقتصر على لمّة واحدة مما يُضعف ثراءها الدلالي ومرونة توظيفها في الإسناد المعجمي."
      - "التعريف العربي الحالي «صفة عدم الامتثال للقانون» ترجمةٌ حرفية بنيوية لا تتوافق مع أسلوب المعجم الوسيط."
    observations: >-
      المجموعة تمثّل مفهوماً قانونياً مجرداً هو «اللامشروعية» أو «عدم المشروعية»، وهو صفة جوهرية تُعبّر عن
      الخروج على أحكام القانون دون أن تتضمن إدانةً أخلاقيةً بالضرورة. اللمّة المركّبة «عَدَم مَشْرُوعِيَّة»
      مصطلح إضافي راسخ في الخطاب القانوني والقضائي العربي المعاصر، ويُقابل المصطلحات الغربية القانونية
      كـ unlawfulness وillégalité. الجذر «شرع» ذو حضور معجمي غني من الشريعة إلى التشريع، مما يجعل هذا
      المركب مستنداً إلى أصالة اشتقاقية متينة.

  blind_candidates:
    - lemma: "اللاَّشَرْعِيَّة"
      generation_method: ishtiqaq
      justification: >-
        من جذر «شرع» بتصدير النفي «لا-» والمصدر الصناعي «-يَّة»، على غرار اللاّمركزية واللامساواة.
        يدل مباشرةً على الحالة المجردة لغياب الشرعية القانونية، وهو أقصر وأكثر اقتصاداً من المركب الإضافي.
    - lemma: "الجَوْر"
      generation_method: majaz
      justification: >-
        لفظ عربي قديم أصيل معناه الأصلي «الانحراف عن الطريق المستقيم» ثم تطوّر إلى «نقيض العدل».
        يمكن إحياؤه مجازياً للدلالة على مخالفة القانون بوصفه الطريق القويم للمجتمع.
    - lemma: "المَعْصِيَة"
      generation_method: ishtiqaq
      justification: >-
        من الجذر «عصي» وزن مَفْعِلَة، أصله «الفُرقة والمخالفة»، يدل على مخالفة الأمر قصداً.
        يُمكن توسيع دلالته من المخالفة الدينية إلى مخالفة القانون الوضعي.
    - lemma: "اللاَّقانونِيَّة"
      generation_method: tarkib
      justification: >-
        مركب إضافي وصفي من «لا-» + «قانون» + «-يَّة» المصدرية الصناعية. يُميّز بين اللامشروعية
        بمفهومها الشرعي-الديني واللامشروعية بمفهومها القانوني الوضعي الحديث.


