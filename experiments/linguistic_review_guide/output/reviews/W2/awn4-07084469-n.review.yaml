      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على التضخم اللفظي المذموم مع إيحاء بالتكبر والخيلاء الكلامي؛ أشد الألفاظ الأربعة في التعبير عن الإدانة الأخلاقية والجمالية للأسلوب المتضخم، بدليل وروده في سياق الذم النبوي صراحةً."
      actions:
