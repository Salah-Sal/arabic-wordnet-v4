            new_lemma: "تَنْمِيق"

    - lemma: "طنانة"
      decision: removed
      decision_reason: "«طنانة» مصطلح بيولوجي موحَّد يعني حشرة البمبل بي (Bombus) وقد ثبت في المعجمين الدوليين ARABTERM وAGROVOC؛ إدراجه في مجموعة الأسلوب الخطابي يُوقع في التباس دلالي لا مسوّغ له. الصيغة الأنسب هي «طَنَّانِيَّة» (مصدر صناعي) التي استخدمها المورد الحديث صراحةً للدلالة على grandiloquence وpomposity، غير أنها تحتاج إلى إدراج منفصل في مراجعة لاحقة."
