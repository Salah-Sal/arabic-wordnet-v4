    - lemma: "تَشَادُق"
      source: stage1
      decision: confirmed
      decision_reason: "اللفظ موثَّق في المعجم الكبير (الفعل تشادق = تفصّح) وفي شواهد شعرية من خلف الأحمر ومهيار الديلمي يستخدمانه اسماً (مصدراً) بالمعنى المراد تماماً: الخطاب المتكلَّف المبالغ في التفصح. أصله في مقاييس اللغة «الشدق: سعة الفم» مجازاً عن سعة الكلام وكثرته. يجتاز اختبار السكّ وهو وحدة اصطلاحية ذات إيحاء نقدي راسخ. الوزن الصرفي تَفَاعُل مناسب للتعامل المتكلَّف."
