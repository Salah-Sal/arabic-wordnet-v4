      nuance_differentiation: "يُركّز على الجانب الصوتي النبري للأسلوب: رفع الصوت وجزالة المنطق وتعظيمه، كأن يتحدث المرء بنبرة احتفالية مهيبة أكبر مما يقتضيه المقام والمحتوى."
