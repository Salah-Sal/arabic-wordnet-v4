stage1_review:
  assessment:
    concerns:
      - "لمّة «طنانة» تحيل في المعاجم المتخصصة أساساً إلى الحشرة (humble-bee / Bombus)، وليس إلى الأسلوب الكلامي؛ الصيغة الأدقّ للمعنى الأسلوبي هي «طَنَّانِيَّة»."
      - "لمّة «تفخيم» مصطلح تجويدي بالدرجة الأولى (الفتح مقابل الترقيق) مما يُوقع في اشتراك لفظي بين علم التجويد ونقد الأسلوب."
      - "التعريف الحالي عبارة عن وصفين متسلسلين بفاصلة منقوطة، لا تعريفٌ معجمي متكامل بجنس ونوع."
    observations: "يُعبّر هذا المفهوم عمّا يُسمّيه البلاغيون العرب «التنطع اللفظي» و«التكلف في الزخرفة»، وهو مذكور في التراث النقدي تحت عناوين مثل: الإفراط في التنميق والإسراف في التصنع الأسلوبي. يضم المفهوم ثلاثة أبعاد متمايزة: (أ) رفع نبرة الأسلوب وتفخيمه، (ب) الإفراط في الزينة اللفظية، (ج) التوسع المتكلَّف في الخطاب. اللمّات الإنجليزية (magniloquence, grandiloquence, ornateness) تعكس هذه الأبعاد الثلاثة، وينبغي أن تعكسها لمّات عربية متمايزة."
  blind_candidates:
    - lemma: "تَشَادُق"
      generation_method: ishtiqaq
      justification: "مصدر الفعل «تشادق» على وزن تَفَاعُل من الجذر «شدق» (سعة الشدق والتوسع في الكلام)؛ يدل على المبالغة في الكلام والتفصح المتكلَّف. في المقاييس: «خطيب أشدق» أي واسع الفم كثير الكلام."
    - lemma: "إغْرَاب"
      generation_method: ishtiqaq
      justification: "مصدر أفعل من الجذر «غرب» على وزن إفعال؛ يعني إيراد الغريب الوحشي من الكلام والإتيان بما يُستغرب من الألفاظ، وهو وجه بارز من وجوه الزخرفة اللفظية المفرطة."
    - lemma: "تَفَيْهُق"
      generation_method: majaz
      justification: "إحياء لفظ عربي كلاسيكي؛ مصدر الفعل «تفيهق» على وزن تَفَيْعُل من الجذر «فهق» (السعة والامتلاء)، يعني ملء الفم بالكلام والتضخم فيه والتفخر به. ورد في الحديث النبوي ذمًّا للمتفيهقين."
    - lemma: "غُلُوٌّ خِطَابِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي: «غلو» (مبالغة زائدة عن الحد) + «خطابي» (نسبة إلى الخطاب)؛ يعبّر عن المبالغة في التضخيم الأسلوبي في سياق خطابي."


stage2_evidence:
  per_lemma:
    - lemma: "تفخيم"
      confirm:
        - text: "«التفخيم: [في الانكليزية] Bombast، grandiloquence [في الفرنسية] Emphase، grandiloquence»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(1) التفخيم: اصطناع الكلام الفخم الطنّان (2) الطنّانيّة: كون الكلام طنّانًا.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«التفخيم: التَّعظيم والاستعلاء ويقابله الترقيق. وفي التجويد في لفظ الله تفخيم وترقيق فيفخم إذا انفتح ما قبله أو انضم...»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "المعنى السائد في المعاجم الكلاسيكية هو المصطلح التجويدي (الفتح ضد الترقيق)، لا الأسلوب الكلامي المفخَّم."
        - text: "«تحويل بنيوي يتمثل في استبدال بعض العناصر بأخرى بقصد الإلحاح عليها ويعد من أحد العناصر الاختيارية الموجهة للجمل»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "المعنى المعجمي اللساني الحديث هو Emphasis (توكيد) لا Grandiloquence، ولا يتضمن دلالة المبالغة الزخرفية."
      expands:
        - text: "«الفاء والخاء والميم أصل صحيح يدل على جزالة وعظم. يقال: منطق فخم: جزل.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدل على جزالة المنطق وعظمته، مما يُرسّخ استخدام «تفخيم» بمعنى التضخيم الكلامي."

    - lemma: "تنميق"
      confirm:
        - text: "«التَّنميق: كلام منمَّق أو طنّان.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«retouch»"
          source: "مسرد الجغرافيا والتاريخ (ARABTERM)"
          conflict: "في المجال الجغرافي المتخصص يُستخدم «تنميق» بمعنى (retouch = تحسين الخريطة)، وهو معنى تقني بعيد عن الدلالة الأسلوبية."
      expands:
        - text: "«النون والميم والقاف أصيل يدل على تحسين شيء وتجويده. ونمقت الكتاب ونمقته: نقشته وصورته.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل أصلاً على تنسيق الكتابة وتزيينها؛ ومنه يتوسع في تزيين الكلام وتجميل ألفاظه بصورة مفرطة."

    - lemma: "طنانة"
      contradicts:
        - text: "«حشرة من النحليات زباء أي كثيرة الشعر اللامع»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "«طنانة» مصطلح بيولوجي موحَّد للدلالة على حشرة البمبل بي (Bombus / humble-bee)؛ إدراجه في مجموعة الأسلوب الخطابي يُوقع في التباس دلالي."
        - text: "«Bombus»"
          source: "المكنز الزراعي متعدد اللغات (AGROVOC)"
          conflict: "تثبيت دولي إضافي لـ«طنانة» بوصفها مصطلحاً بيولوجياً."
      expands:
        - text: "«من (ط ن ن) الكثيرة التصويت والرنين والقصيدة الذائعة الصيت.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الكلمة مشتقة من طنين الصوت؛ ومن ثَمَّ يُستخدم «طنّان» وصفاً للأسلوب الرنّان، غير أن الاسم «طنانة» استقر للحشرة لا للأسلوب."
        - text: "«الطاء والنون أصل يدل على صوت. يقال: طن الذباب طنيناً.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الصوتي للجذر يمنح «طنانة» دلالة الرنين والصوت العالي، لا دلالة أسلوبية مستقلة."

    - lemma: "تَشَادُق"
      confirm:
        - text: "«تَشَادَقَ فُلانٌ: تَفَصَّحَ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«له حَنْجَرٌ رَحْبٌ وقولٌ منقَّحٌ / وفصلُ خطابٍ ليس فيه تَشَادُقُ» (خلف الأحمر)"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«ولا يروقَنَّكم تَشَادُقُ / فتحسبون كلَّ مَن قال خَطَبْ» (مهيار الديلمي)"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      expands:
        - text: "«الشين والدال والقاف أصل يدل على انفراج في شيء. من ذلك الشدق للإنسان وغيره. والشدق: سعة الشدق. ورجل أشدق، وخطيب أشدق.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "سعة الشدق مجازٌ عن الاتساع في الكلام وكثرته؛ ومنه يُشتق التشادق بوصفه التفصح المبالغ فيه."

    - lemma: "إغراب"
      evidence_status: "no_material_found"

    - lemma: "تَفَيْهُق"
      confirm:
        - text: "«تَفَيْهَقَ في كلامه: توسَّع وتنطَّع»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(تفيهق) في كلامه: توسع وتنطع، وفي الحديث (إن أبغضكم إلي الثرثارون المتفيهقون)... ويقال هو يتفيهق علينا بمال غيره: يفخر ويتفخم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«الفاء والهاء والقاف أصل صحيح يدل على سعة وامتلاء... في الذي يفهق كلامه ويملأ به فمه»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر (السعة والامتلاء) يُرسّخ دلالة التفيهق بوصفه امتلاء الكلام وتضخمه على نحو مذموم."

    - lemma: "غلو خطابي"
      evidence_status: "no_material_found"


