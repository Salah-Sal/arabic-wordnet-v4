          params:
            lemma: "تَفَيْهُق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "غلو خطابي"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة لا تجتاز اختبار السكّ: يمكن إبدال «غلو» بـ«مبالغة» أو «إسراف» ويبقى التعبير وصفاً صحيحاً، فليس مصطلحاً ثابتاً. لا دليل معجمي على تداوله وحدة معجمية مسكوكة."
