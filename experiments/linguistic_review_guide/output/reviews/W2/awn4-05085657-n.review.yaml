stage1_review:
  assessment:
    concerns:
      - "اللمة 'تَأَخُّر' تميل دلالياً إلى البعد الزمني (التأخير)، بينما السياق هنا مكاني (صفة الوجود في الخلف)."
      - "اللمة 'خَلْفِيَّة' غلبت عليها الدلالة المعاصرة بمعنى (خلفية المشهد/المعلومات)، لكن أصلها اللغوي يخدم المعنى المراد."
    observations: "المفهوم يعبر عن 'البعدية' المكانية أو المنطقية، وهو مقابل 'القبلية' أو 'الأولوية'. العربية توظف جذور (خلف، أخر، بعد، دبر) للتعبير عن هذا المفهوم بظلال دلالية مختلفة."
  blind_candidates:
    - lemma: "بَعْدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'بعد'، يعبر عن حالة أو صفة الوجود بعد شيء آخر، وهو المصطلح المقابل لـ'القبلية' في المنطق والفلسفة."
    - lemma: "دُبُرِيَّة"
      generation_method: ishtiqaq
      justification: "مشتق من 'دبر' (خلاف القبل)، ويستخدم في السياقات التشريحية والوصفية للتعبير عن صفة الوجود في الناحية الخلفية."
    - lemma: "وَرَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'وراء' (نقيض قدام)، يعبر عن صفة الوجود في الجهة الخلفية."
    - lemma: "أَخَرِيَّة"
      generation_method: ishtiqaq
      justification: "من الجذر 'أخر' (خلاف التقدم)، للتعبير عن الصفة المجردة للمتأخر."

stage2_evidence:
  per_lemma:
    - lemma: "تَأَخُّر"
      confirm:
        - text: "«تأخر الشيءُ: صار بعد موضعه»"
          source: "المعجم الكبير"
        - text: "«التَّأَخُّر: يعلم حَقِيقَته وأقسامه بِالْقِيَاسِ على التَّقَدُّم»"
          source: "دستور العلماء"
    - lemma: "خَلْفِيَّة"
      confirm:
        - text: "«خلفي: ما يتعلق بالخلف أو ينسب إليه»"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
        - text: "«خَلْفِيَّة: (في الرسم والتصوير والمسرح) كل ما يظهر في الساحة الخلفية من الصورة أو المنظر»"
          source: "المعجم الوسيط"
      expands:
        - text: "تستخدم في المعاجم الطبية الموحدة للتعبير عن المواضع التشريحية (Posterior)."
          source: "المعجم الطبي الموحد"
    - lemma: "بَعْدِيَّة"
      confirm:
        - text: "«الإجراءات البعدية: التي تهدف إلى إصلاح ما قد تضرر (مقابل القبلية)»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«البعدية (Posteriority): كون الشيء تالياً أو لازماً»"
          source: "المورد الحديث"
    - lemma: "دُبُرِيَّة"
      confirm:
        - text: "«دبر الشيء: آخره وخلفه خلاف قبله»"
          source: "مقاييس اللغة"
        - text: "«صلى الصلاة دبرياً: أي في آخر وقتها»"
          source: "أبو زيد (نقلاً عن المقاييس)"

stage3_analysis:
  per_lemma:
    - lemma: "تَأَخُّر"
      decision: confirmed
      decision_reason: "أثبت المعجم الكبير دلالتها المكانية (صار بعد موضعه)، وهي اللفظ الأصيل المقابل للتقدم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَأَخُّر"
    - lemma: "خَلْفِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مستقر للتعبير عن الصفة النسبية للمكان الخلفي، ويدعمه الاستخدام الطبي والتقني الواسع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلْفِيَّة"
    - lemma: "بَعْدِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق يعبر عن الصفة المجردة للوجود 'بعد' شيء آخر، وهو شائع في المنطق والفلسفة والتحليل الإجرائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بَعْدِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "دُبُرِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تؤكدها المعاجم في وصف الأجزاء الخلفية (دابرة الطائر) والوقت المتأخر، وهي دقيقة في السياق التشريحي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دُبُرِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "صفة الوجود باتجاه الخلف أو باتجاه الطرف الخلفي"
    assessment:
      decision: revise
      reason: "التعريف الحالي سليم دلالياً، لكن يمكن صياغته بأسلوب معجمي أدق يجمع بين الجانب المكاني والمنطقي."
    authored:
      - type: terminological
        text: "صِفَةُ الوُجُودِ فِي الجِهَةِ الخَلْفِيَّةِ أَوِ التَّأَخُّرِ عَنِ الشَّيْءِ مَكَانًا أَوْ تَرْتِيبًا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَأَخُّر"
        examples:
          - text: "يُعَدُّ تَأَخُّرُ بَعْضِ الكَوَاكِبِ فِي مَدَارَاتِهَا ظَاهِرَةً فَلَكِيَّةً مَعْرُوفَةً."
            type: usage
      - lemma: "خَلْفِيَّة"
        examples:
          - text: "تُظْهِرُ الخَلْفِيَّةُ التَّشْرِيحِيَّةُ لِلْقَلْبِ تَفَاصِيلَ الأَوْرِدَةِ الرَّئَوِيَّةِ."
            type: usage
      - lemma: "بَعْدِيَّة"
        examples:
          - text: "تَقُومُ الدِّرَاسَاتُ البَعْدِيَّةُ عَلَى تَحْلِيلِ النَّتَائِجِ بَعْدَ انْتِهَاءِ التَّجْرِبَةِ."
            type: usage
      - lemma: "دُبُرِيَّة"
        examples:
          - text: "تَسْتَخْدِمُ الأَسْمَاكُ زَعَانِفَهَا الدُّبُرِيَّةَ لِحِفْظِ التَّوَازُنِ أَثْنَاءَ السِّبَاحَةِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "صِفَةُ الوُجُودِ فِي الجِهَةِ الخَلْفِيَّةِ أَوِ التَّأَخُّرِ عَنِ الشَّيْءِ مَكَانًا أَوْ تَرْتِيبًا."}

