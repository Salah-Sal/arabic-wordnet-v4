stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تغطي الجانب الدرامي (حلقة، مشهد) والجانب العام (حادثة)، لكن ينقصها مصطلح 'فصل' الذي يشيع استخدامه في السياقات الأدبية والتاريخية للإشارة إلى حلقة من سلسلة."
    observations: "التعريف العربي دقيق وشامل للسياقين الواقعي والخيالي. اللمّات المرشحة تتفق مع اللمّات الموجودة مما يعزز دقتها."
  blind_candidates:
    - lemma: "حَلْقَة"
      generation_method: ishtiqaq
      justification: "المصطلح المعياري للجزء المستقل ضمن سلسلة (مسلسل، برنامج، قصة)."
    - lemma: "حَادِثَة"
      generation_method: ishtiqaq
      justification: "تُستخدم لوصف واقعة مميزة تقع ضمن سياق زمني أو تاريخي مترابط."
    - lemma: "فَصْل"
      generation_method: majaz
      justification: "يُطلق على الجزء من الكتاب أو المسرحية، ويُستعار لوصف مرحلة أو حلقة من أحداث متتابعة."
    - lemma: "مَشْهَد"
      generation_method: ishtiqaq
      justification: "جزء من عمل درامي أو واقعة تُشاهد ضمن تسلسل أحداث."

stage2_evidence:
  per_lemma:
    - lemma: "حَادِثَة"
      confirm:
        - text: "«حادثة عرضية في سياق قصة أو قصيدة... حدث أو سلسلة أحداث مترابطة في الحياة الواقعية»"
          source: "المورد الحديث"
        - text: "«مؤنث الحادث والنائبة»"
          source: "المعجم الوسيط"
    - lemma: "حَلْقَة"
      confirm:
        - text: "«[في الإنكليزية] Link... episode»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«حلقة: دور»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مَشْهَد"
      confirm:
        - text: "«مشهد: scene»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
        - text: "«أداء أو عرض بارز: spectacle»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "فَصْل"
      confirm:
        - text: "«أحد أقسام المسرحيّة وهو يمثِّل مرحلة هامّة في تطوّر أحداثها»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«أحد أجزاء الكتاب مما يندرج تحت الباب... حلقة، دَوْر»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "حادثة"
      decision: confirmed
      decision_reason: "مصطلح أصيل يعبر عن الواقعة الفردية ضمن سياق أكبر، ويتفق مع الاستخدام اللغوي القديم والحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَادِثَة"
    - lemma: "حلقة"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً للتعبير عن الحلقة في السلاسل (الدرامية، الإذاعية، الفكرية)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَلْقَة"
    - lemma: "مشهد"
      decision: confirmed
      decision_reason: "يعبر عن وحدة أصغر من الحلقة لكنه يُستخدم في سياقات معينة كمرادف للحلقة أو الواقعة المصورة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَشْهَد"
    - lemma: "فَصْل"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم بشكل واسع في الأدب والتاريخ للإشارة إلى حلقة من سلسلة أحداث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَصْل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حدث مميز ضمن سلسلة من الأحداث المترابطة"
    assessment:
      decision: retain
      reason: "التعريف دقيق لغوياً ومصطلحياً ويغطي كافة جوانب المفهوم في الإنجليزية والعربية."
  examples:
    per_lemma:
      - lemma: "حَادِثَة"
        examples:
          - text: "كانت تلك الحادثة بمثابة حلقة مفصلية في تاريخ الثورة."
            type: usage
      - lemma: "حَلْقَة"
        examples:
          - text: "شاهدتُ الحلقة الأخيرة من المسلسل الوثائقي."
            type: usage
      - lemma: "مَشْهَد"
        examples:
          - text: "كان مشهد الوداع مؤثراً للغاية في سياق الرواية."
            type: usage
      - lemma: "فَصْل"
        examples:
          - text: "بدأ فصلٌ جديد من فصول الصراع السياسي في المنطقة."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "حَادِثَة"
      entry_id: "{auto}"
      root: "حدث"
      maqayis_quote: "«الْحَاءُ وَالدَّالُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ كَوْنُ الشَّيْءِ لَمْ يَكُنْ. يُقَالُ حَدَثَ أَمْرٌ بَعْدَ أَنْ لَمْ يَكُنْ.»"
    - lemma: "حَلْقَة"
      entry_id: "{auto}"
      root: "حلق"
      maqayis_quote: "«الْحَاءُ وَاللَّامُ وَالْقَافُ أُصُولٌ ثَلَاثَةٌ... وَالثَّانِي يَدُلُّ عَلَى شَيْءٍ مِنَ الْآلَاتِ مُسْتَدِيرٍ.»"
    - lemma: "مَشْهَد"
      entry_id: "{auto}"
      root: "شهد"
      maqayis_quote: "«الشِّينُ وَالْهَاءُ وَالدَّالُ أَصْلٌ يَدُلُّ عَلَى حُضُورٍ وَعِلْمٍ وَإِعْلَامٍ... وَالْمَشْهَدُ: مَحْضَرُ النَّاسِ.»"
    - lemma: "فَصْل"
      entry_id: "{auto}"
      root: "فصل"
      maqayis_quote: "«الْفَاءُ وَالصَّادُ وَاللَّامُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى تَمْيِيزِ الشَّيْءِ مِنَ الشَّيْءِ وَإِبَانَتِهِ عَنْهُ.»"
  per_sense:
