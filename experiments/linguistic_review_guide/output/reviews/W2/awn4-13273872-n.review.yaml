          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة، 1998)"
        - text: "«المَنْقُول المقابل للعقار هو المَتاع الذي يقبل النقل من مكان إلى مكان آخر كالسيف والترس والبساط والأواني وغير ذلك بخلاف الأرض والدار والحمام»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«منقول — movable» (Domain: Law)"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: "«المَنْقُول: هو ما كان مشتركاً بين المعاني وترك استعماله في المعنى الأول، ويسمى به لنقله من المعنى الأول»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "منقول في الاصطلاح الفقهي / الأصولي يعني اللفظ المنقول من معنى إلى آخر، وليس المال الذي تنقل ملكيته"
        - text: "«المَنقُول من الأموال: ما يُنقل، والعَقارُ والضيعةُ خلافُه»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "يقصر 'المنقول' على ما يُنقل جسدياً (مقابل العقار)، لا ما تنتقل ملكيته"
      expands:
