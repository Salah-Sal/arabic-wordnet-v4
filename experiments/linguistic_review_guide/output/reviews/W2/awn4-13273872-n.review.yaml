# مراجعة AWN4 — synset: awn4-13273872-n
# ili: i106296 | pos: n
# definition_en: a possession whose ownership changes or lapses
# ══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين (ملكية منقولة، ممتلكات محولة) تركيبيتان وصفيتان حرّتان، وليستا مصطلحَين مسكوكَين ثابتَين في المعاجم القانونية أو الفقهية"
      - "اللمّة 'ملكية منقولة' تستعمل 'منقولة' التي رسّخ الفقه الإسلامي استخدامها للدلالة على المال المنقول جسدياً (مقابل العقار)، لا على المال المنقولة ملكيّته؛ مما يُوجِد اشتراكاً لفظياً مُربِكاً"
      - "الرأس الدلالي في 'ملكية منقولة' هو 'ملكية' (حقٌّ مجرد)، في حين أن المجموعة تصف حيازةً ملموسة تتحوّل أو تنقضي ملكيّتُها، لا الملكيّةَ ذاتها"
      - "اللمّة 'ممتلكات محولة' صيغة جمع، وهو أمر غير مألوف كمدخل معجمي للمجموعات الترادفية التي تصف جنساً"
      - "الصفة 'محولة' لم تُوثَّق في المعاجم بالمعنى المقصود (نقل الملكية)؛ إذ المستخدَم حديثاً هو 'محوِّل' (Transformer كهربائي)"
      - "اللمّتان ترجمتان حرفيتان من الإنجليزية (transferred property / transferred possession) دون توطين معجمي حقيقي"
    observations: >
      تنتمي هذه المجموعة إلى الحقل الدلالي القانوني والفقهي المتعلق بانتقال الحيازة وانقضاء الملكية.
      الفقه الإسلامي يعرف مفهوم "المال المنقول" (في مقابل العقار) و"نقل الملكية" لكنهما يختلفان
      دلالياً عن مفهوم المجموعة. التعريف العربي الحالي (حيازة تتغير ملكيتها أو تنقضي) مقبول
      بنيويًّا (جنس + فصل) لكنه يحتاج تحسيناً أسلوبياً. المجموعة تُمثّل فجوةً معجمية جزئية
      في العربية المعاصرة؛ إذ يُعبَّر عن المفهوم عادةً بعبارات وصفية لا بمصطلح مُفرد.

  blind_candidates:
    - lemma: "الزَّائِلُ"
      generation_method: majaz
      justification: >
        من زَالَ يَزُولُ زَوَالاً (المقاييس: «يدل على تنحّي الشيء عن مكانه»). المجاز هنا
        وظيفي: ما يزول عن يد حائزه لينتقل إلى غيره أو ينقضي. الإحياء يتجنب الاشتراك
        اللفظي مع "المنقول" الفقهي (= المال الجسدي غير العقاري).
    - lemma: "الْمُنْتَقَلُ"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من انتقل (Form VIII) على وزن مُنْفَعَل → مُنْتَقَل. جذر نقل
        (المقاييس: «تحويل شيء من مكان إلى مكان»). الاسم الجامد المُنتقَل يصف الحيازة
        التي ارتحلت ملكيتها من حائز إلى آخر، ويُجنّب الالتباس بـ"المنقول" الفقهي.
    - lemma: "الْمُحَوَّلُ"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من حوَّلَ (Form II) على وزن مُفَعَّل → مُحَوَّل. جذر حول
        (المقاييس: «تحرك في دور»). يصف ما انتقل من ملكية صاحبه إلى غيره بفعل
        التحويل القانوني كالبيع أو الهبة.
    - lemma: "الْمُتَدَاوَلُ"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من تداوَل (Form VI) على وزن مُتَفَاعَل → مُتَدَاوَل. يُعبّر عن
        المال الذي يتداول بين الأيدي وتتغير ملكيته بتداوله، ويضمّ دلالة الانقضاء
        الضمني عند انتهاء التداول.


