# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────

stage3_analysis:
  per_lemma:

    - lemma: "ملكية منقولة"
      decision: confirmed
      decision_reason: >
        رغم التحفظات الدلالية، يظل المركب "ملكية منقولة" أوضح المصطلحات العربية المتاحة لهذا المفهوم
        في السياق القانوني الحديث. "الملكية" في الاستعمال الحديث تستعمَل بمعنى العين المملوكة
        (property) لا حق التملك فحسب، و"منقولة" تحمل دلالة الانتقال الصريحة. ليس ثمة مصطلح
        مُفرد أو مركب ثابت يُغني عنه في المعاجم العربية المتاحة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تُشير "مِلْكِيَّةٌ مَنْقُولَة" تحديداً إلى الحيازة من زاوية تحوّل صاحبها القانوني أو انقضاء
        حق التملك فيها، بينما يُحيل المصطلح الأعلى "حِيَازَة/مِلْكِيَّة" إلى أي شيء مملوك دون
        إشارة إلى طبيعة تداوله؛ إذ يُقيَّد المفهوم هنا بشرطَي الانتقال أو الانقضاء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِلْكِيَّةٌ مَنْقُولَة"

    - lemma: "ممتلكات محولة"
      decision: removed
      decision_reason: >
        أولاً: "محولة" لم تُوثَّق بمعنى نقل الملكية؛ إذ المعاجم تُسجّل "محوِّل/محوَّل" بمعنى
        المحوِّل الكهربائي حصراً، فضلاً عن كونها اسم عَلم (بنو محوَّلة) في المعجم الكبير.
        ثانياً: "ممتلكات" صيغة جمع تكسير غير مناسبة كمدخل ترادفي يُفترض أن يمثّل الجنس.
        ثالثاً: المركب كله ترجمة حرفية من "transferred possessions" دون سند معجمي.
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الزَّائِلُ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم توثّق "الزائل" بمعنى: (أ) الظل عند زوال الشمس (زائل الظل)، (ب) البيت الفلكي
        في اصطلاح الفلك. كلا المعنيَين لا يدعم الدلالة المستهدفة. كما أن استخدامه المجرّد
        للدلالة على مال منتقل الملكية يفتقر إلى أي توثيق معجمي أو فقهي.

    - lemma: "الْمُنْتَقَلُ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على توثيق معجمي لـ"المنتقَل" كمصطلح للمال المنقولة ملكيّته. والجذر نقل موثَّق
        دلالياً، لكن الصيغة "مُنتقَل" بذاتها لم ترد في المعاجم بهذه الدلالة. وجود "المنقول"
        المرسَّخ في الفقه (= المال المنقول جسدياً) يُنشئ التباساً قد يمتد إلى "المنتقَل" ذات الجذر.

    - lemma: "الْمُحَوَّلُ"
      source: stage1
      decision: removed
      decision_reason: >
        يرفضه اختبار التعارض المعجمي: المُحَوَّل/المحوِّل في المعاجم الحديثة (الوسيط، ومعاجم
        ArabTerm) يعني الجهاز الكهربائي (Transformer) حصراً. تفعيل هذه اللمّة في مجموعة
        قانونية يُخالف مبدأ عدم الاشتراك اللفظي المُربِك مع مصطلح تقني راسخ.

    - lemma: "الْمُتَدَاوَلُ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على توثيق معجمي. كذلك اختبار السكّ يكشف أن "المتداوَل" تعبير وصفي حرّ
        يصلح وصفاً للنقد والسلع والأفكار على حدٍّ سواء، فيفتقر إلى التخصيص المصطلحي.


