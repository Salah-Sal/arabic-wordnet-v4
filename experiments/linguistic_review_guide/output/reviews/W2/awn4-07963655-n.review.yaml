            synset_id: "{synset_id}"

    - lemma: "تَنَضُّد زَهْرِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلّة معجمية على استعمال هذا المركّب مصطلحاً نباتيّاً. جذر ن-ض-د يدلّ على الضمّ والتراصّ لكنّه لم يُوظَّف في الاصطلاح النباتيّ العربيّ."
      evidence_assessment:
        case: no_material

    - lemma: "تَكْمِيم"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مشغول دلالياً بمعنى «التقدير الكمّيّ» (quantification) في عدّة معاجم موحّدة. استعماله لمفهوم نباتيّ مختلف يوقع اشتراكاً لفظيّاً مُرْبِكاً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَرْتِيب بُرْعُمِيّ"
      source: stage1
      decision: removed
      decision_reason: "مسجَّل في المورد الحديث ومعجم الأحياء بمعنى vernation (ترتيب الأوراق الخضرية في البرعم)، وهو مفهوم مختلف عن aestivation (ترتيب الأجزاء الزهرية). استعماله هنا يوقع خلطاً اصطلاحيّاً."
      evidence_assessment:
        case: contradicts_only


stage4_content:
  definition:
    current: "(علم النبات) ترتيب الكؤوس والبتلات في برعم الزهرة قبل تفتحه"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية للإنجليزي. يجب صياغته بأسلوب المعجم الوسيط مع استعمال المصطلحات النباتية العربية الراسخة (السَّبَلات بدل الكؤوس، البَتَلات أو التُّوَيجيّات). كما أنّ التعريف في المعجم الوسيط يصف «حالة» لا مجرّد «ترتيب»."
    authored:
      - type: terminological
        text: "حالةُ الأوراقِ الزَّهْرِيَّة (السَّبَلاتِ والبَتَلاتِ) في وَضْعِ بعضِها من بعضٍ داخلَ البُرْعُمِ قبلَ تَفَتُّحِه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالةُ الأوراقِ الزَّهْرِيَّة (السَّبَلاتِ والبَتَلاتِ) في وَضْعِ بعضِها من بعضٍ داخلَ البُرْعُمِ قبلَ تَفَتُّحِه"

  examples:
