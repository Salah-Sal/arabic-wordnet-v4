    - lemma: "الِالْتِفَاف الزَّهْرِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح نباتيّ مسكوك مسجَّل في المعجم الوسيط والمورد الحديث بالتعريف ذاته تماماً: حالة الأوراق الزهرية في وضع بعضها من بعض في البرعم قبل تفتّحه. يطابق تعريف المجموعة الترادفية تطابقاً تامّاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
