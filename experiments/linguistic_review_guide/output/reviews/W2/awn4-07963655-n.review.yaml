      - lemma: "الِالْتِفَاف الزَّهْرِيّ"
        examples:
          - text: "يُعَدُّ الِالْتِفَافُ الزَّهْرِيُّ صِفَةً تَصْنِيفِيَّةً مُهِمَّةً لِتَمْيِيزِ الفَصَائِلِ النَّبَاتِيَّةِ، إِذْ يَخْتَلِفُ وَضْعُ البَتَلاتِ وَالسَّبَلاتِ فِي البُرْعُمِ مِنْ نَوْعٍ إِلَى آخَرَ."
            type: usage
    actions:
