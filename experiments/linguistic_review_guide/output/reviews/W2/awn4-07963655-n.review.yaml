# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07963655-n
# estivation / aestivation (botany)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ترتيب الزهور» تعبير وصفي حرّ وليست مصطلحاً نباتياً مسكوكاً"
      - "«الزهور» جمع عامّ يدلّ على عدّة أزهار، بينما المفهوم يتعلّق بأجزاء زهرة واحدة (الكؤوس والبتلات) داخل البرعم"
      - "التعريف العربي مقبول لكنّه ترجمة شبه حرفية للإنجليزي"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو قليل لمفهوم نباتي له مصطلح عربي راسخ"
    observations: "المفهوم هو ترتيب الأوراق الزهرية (السبلات والبتلات) في البرعم قبل تفتّحه. هذا مصطلح نباتي تقنيّ يختلف عن «vernation» الذي يعني ترتيب الأوراق الخضرية في البرعم. اللمّة الحالية «ترتيب الزهور» لا تمرّ باختبار السكّ لأنّ «تنسيق الزهور» أو «ترتيب الأزاهير» يؤدّيان نفس الوصف، فهي ليست وحدة معجمية ثابتة."

  blind_candidates:
    - lemma: "الِالْتِفَاف الزَّهْرِيّ"
      generation_method: tarkib
      justification: "مركّب وصفيّ من «التفاف» (مصدر التفّ، يدلّ على تلوّي شيء على شيء) و«زهريّ» (نسبة إلى الزهرة). يصف حالة الأجزاء الزهرية وهي ملتفّة بعضها على بعض في البرعم."
    - lemma: "تَنَضُّد زَهْرِيّ"
      generation_method: tarkib
      justification: "من جذر ن-ض-د (ضمّ شيء إلى شيء في اتّساق) على وزن تَفَعُّل، مع نسبة «زهريّ». يصف انتظام الأوراق الزهرية في طبقات متراصّة."
    - lemma: "تَكْمِيم"
      generation_method: ishtiqaq
      justification: "من جذر ك-م-م (الكِمّ: غلاف الزهرة والبرعم) على وزن تَفْعِيل. يدلّ على حالة الانغلاف في الكِمّ، أي وضعية الأجزاء داخل البرعم."
    - lemma: "تَرْتِيب بُرْعُمِيّ"
      generation_method: tarkib
      justification: "مركّب وصفيّ من «ترتيب» (مصدر رتّب) و«برعميّ» (نسبة إلى البرعم). يصف ترتيب الأجزاء في البرعم."


stage2_evidence:
  per_lemma:
    - lemma: "تَرْتِيب الزُّهُور"
      evidence_status: "no_material_found"

    - lemma: "الِالْتِفَاف الزَّهْرِيّ"
      confirm:
        - text: "«الالتفاف الزهريّ: (في علم الأحياء) اسم لحالة الأوراق الزهرية فى وضع بعضها من بعض فى البُرعم قبل تفتُّحه. (مج)»"
          source: "المعجم الوسيط"
        - text: "«(3) الالتفاف الزَّهري: حالة أجزاء الزهرة من حيث ترتيبُها أو انتظامُها في البُرْعم (نب).»"
          source: "المورد الحديث (2008)"

    - lemma: "تَنَضُّد زَهْرِيّ"
      evidence_status: "no_material_found"

    - lemma: "تَكْمِيم"
      contradicts:
        - text: "«التقدير الكميّ.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "تكميم مستعمل في المعاجم الحديثة بمعنى quantification (التقدير الكمّيّ)، لا علاقة له بترتيب أجزاء الزهرة"

    - lemma: "تَرْتِيب بُرْعُمِيّ"
      contradicts:
        - text: "«التَّرتيب البُرعميّ: ترتيب الأوراق في البُرعم.»"
          source: "المورد الحديث (2008)"
          conflict: "الترتيب البرعميّ يقابل vernation (ترتيب الأوراق الخضرية في البرعم) وليس aestivation (ترتيب الأجزاء الزهرية)"
      expands:
        - text: "«ترتيب البرعم الورقي، ترتيب الورق البرعمي — ترتيب الورق البرعمي»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "يؤكّد أنّ المفهوم البرعميّ يرتبط بالأوراق لا بالأجزاء الزهرية"


stage3_analysis:
  per_lemma:
    - lemma: "تَرْتِيب الزُّهُور"
      decision: removed
      decision_reason: "تعبير وصفيّ حرّ لا يمرّ باختبار السكّ: يمكن استبدال «ترتيب» بـ«تنسيق» أو «تنظيم» ويبقى صالحاً كوصف. لم يُسجَّل في أيّ معجم كمصطلح نباتيّ مسكوك. كما أنّ «الزهور» (جمع) لا تدلّ على المكوّنات الداخلية لبرعم واحد. المصطلح الراسخ هو «الالتفاف الزهريّ» كما في المعجم الوسيط."
