stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي (حالة نهائية) موجز جداً ولا يعكس التنوع الدلالي للمجموعة الذي تشير إليه اللمّات الإنجليزية (death, destruction)."
      - "نقص اللمّات التي تعبر عن 'المآل' و'العاقبة' وهي جوهر مفهوم الحالة النهائية."
    observations: "المجموعة تعبر عن الطور الأخير أو الحالة التي يستقر عليها الأمر، سواء كان ذلك نهاية زمنية أو هلاكاً مادياً أو موتاً."
  blind_candidates:
    - lemma: "خَاتِمَة"
      generation_method: ishtiqaq
      justification: "من (خ ت م)، وتعني عاقبة الشيء وآخره، وهي تناسب مفهوم الحالة النهائية."
    - lemma: "مَصِير"
      generation_method: ishtiqaq
      justification: "من (ص ي ر)، وتعني ما ينتهي إليه الأمر والمرجع، وهي أدق تعبير عن 'final state'."
    - lemma: "عَاقِبَة"
      generation_method: ishtiqaq
      justification: "من (ع ق ب)، وتعني آخر كل شيء، وتستخدم غالباً للتعبير عن مآل الأمور."
    - lemma: "مَآل"
      generation_method: ishtiqaq
      justification: "من (أ و ل)، وتعني المرجع والمنتهى وما يؤول إليه الشيء."

stage2_evidence:
  per_lemma:
    - lemma: "مَصْرَع"
      confirm:
        - text: "«مكانُ القَتْل، حقيقةً أو مجازًا»"
          source: "المعجم الكبير"
      expands:
        - text: "«مَصَارِعُ النَّاسِ: مَسَاقِطُهُمْ.»"
          source: "مقاييس اللغة"
          addition: "تشير إلى حالة السقوط والموت."
    - lemma: "نِهَايَة"
      confirm:
        - text: "«نهايةُ كلِّ شيءٍ: غايتُهُ.»"
          source: "مقاييس اللغة"
        - text: "«غاية الشيء وآخره»"
          source: "المعجم الوسيط"
    - lemma: "مَصِير"
      confirm:
        - text: "«ما ينتهى إليه الأمر (يقال: مصير المياه، ومصير الخلق)»"
          source: "المعجم الوسيط"
        - text: "«عاقِبَةُ الأمر ومنتهاه وما يؤول إليه»"
          source: "المعجم الكبير"
    - lemma: "خَاتِمَة"
      confirm:
        - text: "«من كل شيء: عاقبته وآخره»"
          source: "المعجم الوسيط"
    - lemma: "عَاقِبَة"
      confirm:
        - text: "«عاقبة كل شيء: آخره»"
          source: "مقاييس اللغة"
        - text: "«آخر كل شيء أو خاتمته»"
          source: "المعجم الوسيط"
    - lemma: "مَآل"
      confirm:
        - text: "«المرجع والمنتهى»"
          source: "المعجم الوسيط (تحت صير)"
    - lemma: "حَتْف"
      confirm:
        - text: "«الموت والهلاك»"
          source: "المعجم الكبير"
        - text: "«الحَتْفُ: المَوْتُ وقَضاؤه»"
          source: "كتاب العين"
    - lemma: "هَلَاك"
      confirm:
        - text: "«يَدُلُّ عَلَى كَسْرٍ وَسُقُوطٍ. مِنْهُ الْهَلَاكُ: السُّقُوطُ، وَلِذَلِكَ يُقَالُ لِلْمَيِّتِ هَلَكَ.»"
          source: "مقاييس اللغة"

