stage4_content:
  definition:
    current: "حالة نهائية"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ولا يستوعب الجوانب المختلفة للمجموعة (النهاية الزمنية، الموت، الهلاك)."
    authored:
      - type: terminological
        text: "الحالُ أو الهيئةُ التي ينتهي إليها الشيءُ أو يؤول إليها الأمرُ، وغالبًا ما تشير إلى الموت أو الهلاك."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14586552-n", definition_index: 0, text: "الحالُ أو الهيئةُ التي ينتهي إليها الشيءُ أو يؤول إليها الأمرُ، وغالبًا ما تشير إلى الموت أو الهلاك."}
  examples:
    per_lemma:
      - lemma: "نِهَايَة"
        examples:
          - text: "وصلت المفاوضات الشاقة إلى نهايتها المحتومة بالفشل."
            type: usage
      - lemma: "مَصْرَع"
        examples:
          - text: "لقي المتسلق المغامر مصرعه إثر سقوطه من منحدر صخري."
            type: usage
      - lemma: "مَصِير"
        examples:
          - text: "يبقى مصير المفقودين مجهولاً رغم جهود البحث المكثفة."
            type: usage
      - lemma: "خَاتِمَة"
        examples:
          - text: "كانت خاتمة الحفل رائعة بتقديم عروض الألعاب النارية."
            type: usage
      - lemma: "عَاقِبَة"
        examples:
          - text: "يجب على المرء أن يفكر في عاقبة أفعاله قبل الإقدام عليها."
            type: usage
      - lemma: "مَآل"
        examples:
          - text: "إن مآل هذه السياسات الخاطئة هو الانهيار الاقتصادي لا محالة."
            type: usage
      - lemma: "هَلَاك"
        examples:
          - text: "كان الطمع والجشع سبب هلاكه وضياع ملكه."
            type: usage
      - lemma: "حَتْف"
        examples:
          - text: "واجه القائد الباسل حتفه وهو يدافع عن أسوار المدينة."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "نِهَايَة"
      entry_id: "{auto}"
      root: "نهي"
      maqayis_quote: "«النُّونُ وَالْهَاءُ وَالْيَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى غَايَةٍ وَبُلُوغٍ. وَمِنْهُ أَنْهَيْتُ إِلَيْهِ الْخَبَرَ: بَلَّغْتُهُ إِيَّاهُ. وَنِهَايَةُ كُلِّ شَيْءٍ: غَايَتُهُ.»"
    - lemma: "مَصْرَع"
      entry_id: "{auto}"
      root: "صرع"
      maqayis_quote: "«الصَّادُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى سُقُوطِ شَيْءٍ إِلَى الْأَرْضِ عَنْ مِرَاسِ اثْنَيْنِ... وَمَصَارِعُ النَّاسِ: مَسَاقِطُهُمْ.»"
    - lemma: "مَصِير"
      entry_id: "{auto}"
      root: "صير"
      maqayis_quote: "«الصَّادُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ، وَهُوَ الْمَآلُ وَالْمَرْجِعُ. مِنْ ذَلِكَ صَارَ يَصِيرُ صَيْرًا وَصَيْرُورَةً.»"
    - lemma: "خَاتِمَة"
      entry_id: "{auto}"
      root: "ختم"
      maqayis_quote: "«الْخَاءُ وَالتَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ بُلُوغُ آخِرِ الشَّيْءِ. يُقَالُ خَتَمْتُ الْعَمَلَ، وَخَتْمَ الْقَارِئُ السُّورَةَ.»"
    - lemma: "عَاقِبَة"
      entry_id: "{auto}"
      root: "عقب"
      maqayis_quote: "«الْعَيْنُ وَالْقَافُ وَالْبَاءُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى تَأْخِيرِ شَيْءٍ وَإِتْيَانِهِ بَعْدَ غَيْرِهِ... عَاقِبَةُ كُلِّ شَيْءٍ: آخِرُهُ.»"
    - lemma: "مَآل"
      entry_id: "{auto}"
      root: "أول"
      maqayis_quote: "«الْأَلِفُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ ابْتِدَاءُ الْأَمْرِ وَانْتِهَاؤُهُ إِلَى غَايَتِهِ... وَالْمَآلُ: الْمَرْجِعُ.»"
    - lemma: "هَلَاك"
