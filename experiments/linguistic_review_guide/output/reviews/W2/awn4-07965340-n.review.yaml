# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07965340-n
# uninitiate: people who have not been introduced to the mysteries
# of some field or activity
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (الجاهلون بالأمر، غير المطلعين) عبارتان وصفيتان حرتان وليستا مصطلحين معجميين مسكوكين"
      - "كلتا اللمّتين تفشلان في اختبار السكّ: يمكن إبدال مكوناتهما (الجاهلون بالشيء، غير العارفين) فتبقيان صالحتين كوصف"
      - "لا توجد لمّة مفردة مسكوكة تعبّر عن مفهوم «الذين لم يُعرَّفوا بأسرار مجال»"
      - "التعريف العربي الحالي يستعمل صيغة «لم يتم تعريفهم» وهي ركيكة"
    observations: "المفهوم المقصود هو جماعة من الناس لم يطّلعوا على دقائق مجال أو نشاط ما، وهو قريب من مفهوم «الغُمْر» في العربية الكلاسيكية (الذي لم يُجرِّب الأمور) و«الغِرّ» (قليل التجربة). اللمّتان الموجودتان تمثّلان ترجمة حرفية تقريبية للتعريف الإنجليزي وليستا وحدات معجمية عربية أصيلة. المفهوم يحتاج إلى مصطلحات من التراث المعجمي العربي."

  blind_candidates:
    - lemma: "أَغْمَارٌ"
      generation_method: ishtiqaq
      justification: "جمع غُمْر على وزن أَفْعَال، والغُمْر في المعجمات الكلاسيكية هو الذي لم يُجرِّب الأمور ولم يعرف دقائقها، وهو مطابق لمفهوم المجموعة"
    - lemma: "أَغْرَارٌ"
      generation_method: ishtiqaq
      justification: "جمع غِرّ على وزن أَفْعَال، والغِرّ من ينخدع إذا خُدع لقلة تجربته، وترجمه المورد الحديث بـ uninitiate مباشرة"
    - lemma: "عَوَامّ"
      generation_method: ishtiqaq
      justification: "جمع عامّي، ويعني عامة الناس غير المتخصصين في مجال ما، لكنه أعمّ من المفهوم المقصود"
    - lemma: "دَهْمَاء"
      generation_method: majaz
      justification: "اسم جمعي يعني عامة الناس وسوادهم، وفي المعجم الكبير: العوامّ ممن لا خبرة لهم، لكنه مجازي وأعمّ من المطلوب"


stage2_evidence:
  per_lemma:
    - lemma: "الجاهلون بالأمر"
      evidence_status: "no_material_found"

    - lemma: "غير المطلعين"
      evidence_status: "no_material_found"

    - lemma: "أَغْمَارٌ"
      confirm:
        - text: "«وَمِنْهُ الْغُمْرُ، وَهُوَ الَّذِي لَمْ يُجَرِّبِ الْأُمُورَ كَأَنَّهَا سُتِرَتْ عَنْهُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«رجلٌ غُمْرٌ: لم يجرِّب الامور، بين الغمارة من قوم أغْمارٍ. والأنثى غُمْرَةٌ. وقد غَمُرَ بالضم يَغْمُرُ غَمارةً»"
          source: "الصحاح للجوهري"
        - text: "«وَأما الغمر فالرجل الْجَاهِل بالأمور وَالْجمع مِنْهُمَا جَمِيعًا أغمار»"
          source: "غريب الحديث لأبي عبيد"
      expands:
        - text: "«الْغَيْنُ وَالْمِيمُ وَالرَّاءُ أَصْلٌ صَحِيحٌ، يَدُلُّ عَلَى تَغْطِيَةٍ وَسَتْرٍ فِي بَعْضِ الشِّدَّةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدلّ على التغطية والستر، فالغُمْر مستور عنه الأمور وكأنها غُمرت عنه"

    - lemma: "أَغْرَارٌ"
      confirm:
        - text: "«الغِرّ من ينخدع إذا خُدِع [للذكر والأنثى]»"
          source: "المعجم الوسيط"
        - text: "«غِرّ؛ قليل التجربة»"
          source: "المورد الحديث (ترجمة uninitiate)"
      expands:
        - text: "«الْغَرَارَةُ، وَهِيَ كَالْغَفْلَةِ، وَذَلِكَ أَنَّهَا مِنْ كَرَمِ الْخُلُقِ... فَأَمَّا الْمَذْمُومُ مِنْ ذَلِكَ فَهُوَ مِنَ الْأَصْلِ الَّذِي قَبْلَ هَذَا لِأَنَّهُ مِنْ نُقْصَانِ الْفِطْنَةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الغرارة تتراوح بين الغفلة المحمودة (من كرم الخلق) والمذمومة (نقصان الفطنة)"

    - lemma: "عَوَامّ"
      contradicts:
        - text: "«العوام: جمع عام وعامة، وهو الشامل المتسع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "العوام تعني عامة الناس بإطلاق وليس خصوص من لم يُعرَّفوا بأسرار مجال"

    - lemma: "دَهْمَاء"
      confirm:
        - text: "«العَوامُّ مِمَّن لا خِبْرَة لَهُمْ, أو لا يُعْتَدُّ بِرأْيِهِم»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«عامة الناس وَسَوادُهم»"
          source: "المعجم الوسيط"
          conflict: "الدهماء تدلّ على الكثرة العددية والسواد الأعظم من الناس، لا على عدم الاطلاع تحديداً"


stage3_analysis:
  per_lemma:
    - lemma: "الجاهلون بالأمر"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست وحدة معجمية مسكوكة. تفشل في اختبار السكّ: يمكن قول «الجاهلون بالقانون» أو «الجاهلون بالطب» دون تغيير في البنية. كما أنها لم تُوجد في أي معجم كمدخل مستقل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غير المطلعين"
      decision: removed
      decision_reason: "تركيب نفي وصفي حرّ وليس مصطلحاً ثابتاً. يمكن إبدال «المطلعين» بـ «العارفين» أو «المدركين» مع بقاء المعنى العام. لا وجود لها كمدخل معجمي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "أَغْمَارٌ"
      source: stage1
      decision: confirmed
      decision_reason: "جمع تكسير لـ«غُمْر» على وزن أَفْعَال، مؤصَّل في المعجمات الكلاسيكية. الجوهري وأبو عبيد وابن فارس يتفقون على أن الغُمْر هو الذي لم يُجرِّب الأمور، وهو المعنى الدقيق للمجموعة. الأصل الاشتقاقي (التغطية والستر) يناسب مفهوم من سُترت عنه أسرار مجال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على عدم التجربة والخبرة بالأمور، مع دلالة على أن المعرفة مستورة عن صاحبها"
      actions:
        - command: create_entry
          params: {lemma: "أَغْمَارٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "أَغْرَارٌ"
      source: stage1
      decision: confirmed
      decision_reason: "جمع تكسير لـ«غِرّ» على وزن أَفْعَال. المورد الحديث يترجم uninitiate مباشرة بـ«غِرّ؛ قليل التجربة». المعجم الوسيط يؤكد أن الغِرّ من ينخدع لقلة خبرته. مصطلح كلاسيكي راسخ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على السذاجة وقابلية الانخداع الناتجة عن قلة التجربة، مع إيحاء بالبراءة أحياناً"
      actions:
        - command: create_entry
          params: {lemma: "أَغْرَارٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عَوَامّ"
      source: stage1
      decision: removed
      decision_reason: "دلالتها أعمّ من المطلوب. العوامّ تعني عامة الناس مقابل الخاصة، بصرف النظر عن مجال بعينه. المفهوم المقصود أخصّ: من لم يُدخَلوا في أسرار مجال محدد."

    - lemma: "دَهْمَاء"
      source: stage1
      decision: removed
      decision_reason: "دلالتها الأولى على الكثرة العددية وسواد الناس الأعظم. وإن ورد في المعجم الكبير أنها تشمل «العوامّ ممن لا خبرة لهم» فإن هذا معنى فرعي، والاشتراك اللفظي الكبير في هذه المادة (اللون، الليل، الداهية) يجعلها غير مناسبة كمصطلح."


