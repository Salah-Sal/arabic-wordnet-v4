stage1_review:
  assessment:
    concerns: []
    observations: "مصطلح (تنظيم) يُستخدم في علم الأجنة للتعبير عن قدرة الجنين على استعادة مسار التطور الطبيعي (regulative development). يمكن إضافة (تنظيم جنيني) لزيادة الدقة خارج السياق المتخصص."
  blind_candidates:
    - lemma: "تَنْظِيم"
      generation_method: ishtiqaq
      justification: "الترجمة القياسية لمصطلح regulation، وتستخدم في سياق التنظيم الفسيولوجي والتنظيم الجنيني."
    - lemma: "تَنْظِيم جَنِينِيّ"
      generation_method: tarkib
      justification: "تخصيص لمصطلح التنظيم بإضافته إلى الجنين لتمييزه عن أنواع التنظيم الأخرى."
    - lemma: "تَعْدِيل جَنِينِيّ"
      generation_method: tarkib
      justification: "يشير إلى قدرة الجنين على تعديل بنيته بعد تعرضها للتلف."
    - lemma: "تَكَيُّف جَنِينِيّ"
      generation_method: tarkib
      justification: "يعبر عن تكيف الجنين مع التغيرات أو التلف في مراحله المبكرة."

stage2_evidence:
  per_lemma:
    - lemma: "تنظيم"
      confirm:
        - text: "تَنْظيمِيّ: regulative"
          source: "المعجم الطبي الموحد (2009)"
        - text: "نَمَاءٌ مُنْتَظِم: regulative development"
          source: "المعجم الطبي الموحد (2009)"
        - text: "التنظيم: regulation"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم"
    - lemma: "تنظيم جنيني"
      evidence_status: "no_material_found"
    - lemma: "تعديل جنيني"
      evidence_status: "no_material_found"
    - lemma: "تكيف جنيني"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَنْظِيم"
      decision: confirmed
      decision_reason: "مصطلح معتمد علمياً لترجمة regulation في مختلف المجالات العلمية، ويستخدم في علم الأجنة للتعبير عن هذا المفهوم الدقيق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنْظِيم"
    - lemma: "تَنْظِيم جَنِينِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب وصفي يوضح المجال الدلالي لمصطلح التنظيم ويمنع التباسه خارج السياق المتخصص في علم الأجنة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "تَنْظِيم جَنِينِيّ"
            pos: "n"
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "(علم الأجنة) قدرة الجنين المبكر على مواصلة التطور الطبيعي بعد تلف بنيته أو تغييرها بطريقة ما"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويعكس المفهوم العلمي المراد ترجمته (embryonic regulation)."
  examples:
    per_lemma:
      - lemma: "تَنْظِيم"
        examples:
          - text: "يُعد التنظيم من أهم خصائص تطور الجنين المبكر التي تضمن نموه بشكل طبيعي."
            type: usage
      - lemma: "تَنْظِيم جَنِينِيّ"
        examples:
          - text: "درس الباحثون آليات التنظيم الجنيني بعد إزالة بعض الخلايا من الجنين."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعد التنظيم من أهم خصائص تطور الجنين المبكر التي تضمن نموه بشكل طبيعي."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "درس الباحثون آليات التنظيم الجنيني بعد إزالة بعض الخلايا من الجنين."

