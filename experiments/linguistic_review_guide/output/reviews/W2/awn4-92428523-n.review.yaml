  blind_candidates:
    - lemma: "اَلإِسكَتلَنْدِيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي بإلحاق ياء النسب والتاء المربوطة على وزن (فَعَلِيَّة) اشتقاقاً من الاسم المنسوب
        «اسكتلندي»؛ وهو الأسلوب المعيارياالأكثر إنتاجيّةً في العربية لصياغة المفاهيم المجرّدة الدالّة
        على الخصائص القومية (كالفرنسيّة والإيطاليّة والبريطانيّة). يؤدّي هذا الوزن وظيفة المصطلح
        المجرّد الدالّ على حالة الانتماء أو جودة الكون، وهو ما تعبّر عنه اللاحقة الإنجليزية -ness.

    - lemma: "اَلسِّمَةُ الإِسكَتلَنْدِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي (موصوف: السِّمة + صفة: الإسكتلندية). «السِّمة» في العربية هي العلامة الثابتة
        والخاصّيّة المميَّزة التي تُعرَّف بها الأشياء. اختيار «السِّمة» عوضاً عن «الصفة» يُفيد الثبوت
        والتمييز الهويّاتيّ أكثر من مجرّد الوصف، مما يناسب المفهوم المقصود.

    - lemma: "صِفَةُ الإِسكَتلَنْدِيِّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي (مضاف: صِفَة + مضاف إليه: الإسكتلندي). «الصِّفة» في علم المنطق والفلسفة تدلّ على
        الخاصّيّة العارضة بالشيء، و«الإسكتلندي» مضاف إليه بمعنى «الشخص أو الشيء المنتسب إلى اسكتلندا».
        يصف هذا المركّب الخاصيّة القومية من منظور لغوي منطقي.

    - lemma: "اَلإِسكَتلَنَة"
      generation_method: majaz
      justification: >
        إزاحة دلاليّة بقياس التجريد من الأسماء الأعجمية المعرَّبة على وزن (فَعلَلَة) للدلالة على
        العملية أو الحالة؛ كما صِيغت «الأَمرَكة» و«الأوربة» و«العَوْلَمة». هذا الوزن يُحوّل الاسم
        الأعجمي إلى مصدر يدلّ على الاتّصاف أو التحوّل إلى تلك الهوية. غير أنّه أقلّ رسوخاً من
        المصدر الصناعي في هذا السياق.

  # ── ب. التقييم الأوّلي (بعد الاطلاع على synset_info الكامل) ──
  assessment:
    concerns:
      - "اللمّة الموجودة «الطابع الاسكتلندي» مكتوبة بلا تشكيل كامل"
      - "اللمّة الموجودة مركّب وصفي (MWE) لا تجتاز اختبار السكّ: يمكن إبدال «الطابع» بـ«الطابع البريطاني» أو «الطابع الفرنسي» فيظلّ التعبير وصفاً صحيحاً — ما يدلّ على أنّه ليس وحدة معجمية ثابتة مسكوكة"
      - "التعريف الحالي «حالة أو جودة كون الشيء اسكتلندياً» ترجمة حرفية للإنجليزية يفتقر إلى الأسلوب المعجمي العربي"
      - "المعرِّف الدولي (ILI) فارغ — لا يربط هذه المجموعة بـ OEWN"
      - "لا يوجد سوى لمّة واحدة في المجموعة — يُستحسن إضافة المصدر الصناعي الأكثر مباشرةً للمفهوم"
    observations: >
      المجموعة تُعبّر عن مفهوم قومي/هويّاتيّ مجرّد يرادف الإنجليزية «Scottishness». التعريف
      العربي الحالي مقبول دلاليّاً لكنّه مصاغ بأسلوب الترجمة لا التأليف المعجمي. اللمّة «الطابع
      الاسكتلندي» صحيحة نحوياً ومفهومة، بيد أنّ «الطابع» — بمعنى الطبيعة والخُلق الغالب —
      يُحيل على البُعد الشخصانيّ والأخلاقي أكثر من الخاصيّة القومية المجرّدة. الأدقّ لغوياً
      هو المصدر الصناعي «الإسكتلنديّة» الذي يوازي مباشرةً اللاحقة -ness الإنجليزية.


