stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدو مترجماً حرفياً عن الإنجليزية (an artifact that is one...). الصياغة ركيكة نوعاً ما."
      - "اللمّات الموجودة تفتقر للتشكيل الكامل (جزء، عنصر، مكوّن)."
    observations: "اللمّات 'جزء' و'عنصر' و'مكوّن' تعبر بدقة عن المفهوم. الكلمتان 'مكون' و'جزء' هما الأكثر استخداماً في السياق التقني والمادي."
  blind_candidates:
    - lemma: "جُزْء"
      generation_method: majaz
      justification: "استعارة من الجزء الذي يتكون منه الكل، وهو تعبير مباشر عن المكون الفردي في الكيان المركب."
    - lemma: "مُكَوِّن"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل 'كوّن'، يعبر بدقة عن القطعة أو العنصر الذي يدخل في تركيب أو تكوين النظام."
    - lemma: "عُنْصُر"
      generation_method: majaz
      justification: "استعارة من العناصر الأساسية للمادة، للدلالة على الأجزاء البسيطة التي يتركب منها الكيان المعقد."
    - lemma: "قِطْعَة"
      generation_method: majaz
      justification: "كلمة تستخدم للدلالة على الجزء المادي القابل للفصل من جهاز أو نظام مركب (كما في 'قطع الغيار')."

stage2_evidence:
  per_lemma:
    - lemma: "جُزْء"
      confirm:
        - text: "«الْجُزْء الْقطعَة من الشَّيْء وَمَا يتركب الشَّيْء مِنْهُ وَمن غَيره»"
          source: "المعجم الوسيط"
        - text: "«ما يتركب الشيء عنه وعن غيره، ذكره ابن الكمال. وقال الحرالي: الجزء بعض من كل يشابهه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "عُنْصُر"
      confirm:
        - text: "«المادة التى تدخل فى تكوّن جسم ما»"
          source: "المعجم الوسيط"
        - text: "«ابْتِدَاء تركيب الشَّيْء»"
          source: "معجم مقاليد العلوم للسيوطي"
    - lemma: "مُكَوِّن"
      confirm:
        - text: "«قطعة أو جزء من جهاز معلومياتي مثل اللوحة الأم أو الذاكرة أو بطاقة الصوت»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
        - text: "«عنصر مسؤول عن بعض الوظائف الداخلية في الحاسوب... يترابط مع عناصر أخرى للقيام ككل بجميع الوظائف»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
    - lemma: "قِطْعَة"
      confirm:
        - text: "«الْقطعَة الْحصَّة من الشَّيْء»"
          source: "المعجم الوسيط"
        - text: "«نتيجة تقطيع السلسلة الكلامية إلى وحدات منفصلة»"
          source: "المعجم الموحد لمصطلحات اللسانيات"

stage3_analysis:
  per_lemma:
    - lemma: "جزء"
      decision: confirmed
      decision_reason: "كلمة فصيحة وأساسية للتعبير عن المفهوم، وتستخدم بشكل واسع للدلالة على أجزاء الأنظمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُزْء"
    - lemma: "عنصر"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع للتعبير عن المكونات الأساسية للأنظمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُنْصُر"
    - lemma: "مكوّن"
      decision: confirmed
      decision_reason: "من أكثر المصطلحات التقنية شيوعاً للدلالة على أجزاء الأنظمة والأجهزة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُكَوِّن"
    - lemma: "قِطْعَة"
      source: stage1
      decision: confirmed
      decision_reason: "تُستخدم بكثرة في السياق التقني للإشارة إلى الأجزاء المادية القابلة للتركيب والفصل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "قِطْعَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "مصنوع يشكل جزءاً فردياً من كيان مركب؛ خاصة الجزء الذي يمكن فصله أو توصيله بنظام"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك ومترجم حرفياً. صياغته بأسلوب عربي معجمي أسلس."
    authored:
      - type: terminological
        text: "جزء مفرد يدخل في بناء كيان مركب أو جهاز، ويقبل الانفصال عنه أو التركيب فيه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "جزء مفرد يدخل في بناء كيان مركب أو جهاز، ويقبل الانفصال عنه أو التركيب فيه."
  examples:
    per_lemma:
      - lemma: "جُزْء"
        examples:
          - text: "يُعدّ هذا المُحَرِّك جُزْءاً حيويّاً من الطائرة."
            type: usage
      - lemma: "عُنْصُر"
        examples:
          - text: "يتكون هذا النظام الإلكتروني من عدة عَنَاصِر مترابطة."
            type: usage
      - lemma: "مُكَوِّن"
        examples:
          - text: "استبدل الفنيّ المُكَوِّنَات التالفة في اللوحة الأم."
            type: usage
      - lemma: "قِطْعَة"
        examples:
          - text: "احتاج الحاسوب إلى قِطْعَة جديدة ليعمل بكفاءة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدّ هذا المُحَرِّك جُزْءاً حيويّاً من الطائرة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يتكون هذا النظام الإلكتروني من عدة عَنَاصِر مترابطة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "استبدل الفنيّ المُكَوِّنَات التالفة في اللوحة الأم."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "احتاج الحاسوب إلى قِطْعَة جديدة ليعمل بكفاءة."

stage5_enrichment:
  per_entry:
    - lemma: "جُزْء"
      entry_id: "{auto}"
      root: "جزا"
      maqayis_quote: "«الْجِيمُ وَالزَّاءُ وَالْهَمْزَةُ أَصْلٌ وَاحِدٌ، هُوَ الِاكْتِفَاءُ بِالشَّيْءِ... وَالْجُزْءُ: الطَّائِفَةُ مِنَ الشَّيْءِ.»"
