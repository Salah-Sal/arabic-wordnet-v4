# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-15291722-n
# المفهوم: النقطة الزمنية التي ينتهي عندها شيء ما (end, ending)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان «ختام» و«نهاية» بدون تشكيل كامل — يجب تحديث التشكيل"
      - "المجموعة تضم لمّتين فقط رغم غنى الحقل الدلالي في العربية"
    observations: >
      اللمّتان قريبتان دلالياً لكنهما ليستا مترادفتين تاماً؛ «ختام» يتصل ببلوغ
      آخر الشيء والعاقبة، وهو أخص بسياق الأحداث والمراسم، بينما «نهاية» أعم
      استعمالاً وتدل على الحد الأقصى والغاية التي يبلغها الشيء فلا يتجاوزها.
      التعريف العربي الحالي مقبول لكنه ترجمة حرفية من الإنجليزية وقد يُحسَّن.
  blind_candidates:
    - lemma: "مُنْتَهًى"
      generation_method: ishtiqaq
      justification: >
        اسم مكان وزمان من «انتهى» على وزن مُفْتَعَل، يدل على الموضع أو الوقت
        الذي ينتهي فيه الشيء، فهو يلائم معنى «النقطة الزمنية التي ينتهي عندها شيء ما».
    - lemma: "أَجَل"
      generation_method: majaz
      justification: >
        في الأصل غاية الوقت المحدد لانقضاء الشيء كأجل الدين وأجل الحياة،
        يُوظَّف مجازاً ليشمل كل نقطة انتهاء زمنية. استعمله القرآن في سياقات
        متعددة للدلالة على الوقت المحتوم لانتهاء أمر ما.
    - lemma: "خَاتِمَة"
      generation_method: ishtiqaq
      justification: >
        من «ختم» على وزن فاعِلة، تدل على عاقبة الشيء وآخره. جاء في المعاجم
        «خاتمة كل شيء عاقبته وآخره»، وهي قريبة من «ختام» لكن بصيغة مختلفة.
    - lemma: "انْقِضَاء"
      generation_method: ishtiqaq
      justification: >
        مصدر «انقضى» من الجذر «قضي»، يدل على تمام الشيء وبلوغ نهايته.
        يُستعمل في السياق الزمني كثيراً: انقضاء المهلة، انقضاء الأجل.

stage2_evidence:
  per_lemma:
    - lemma: "خِتَام"
      confirm:
        - text: "«من كل شيء: عاقبته وآخره»"
          source: "المعجم الوسيط"
        - text: "«من كُلِّ شيءٍ: آخره وعاقبته»"
          source: "المعجم الكبير"
        - text: "«عاقبة الشيء وآخره، والطين أو الشمع يختم به على الشيء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الخاء والتاء والميم أصل واحد وهو بلوغ آخر الشيء... وختام كل مشروب: آخره»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الطِّينُ أو الشَّمْعُ الذى يُخْتَمُ به على الشيء البكارةُ»"
          source: "المعجم الوسيط"
          addition: "للختام معانٍ أخرى كالطين الذي يُختم به والبكارة"
        - text: "«ختامُ الوادى: أقْصاهُ»"
          source: "المعجم الكبير"
          addition: "يُستعمل الختام أيضاً في السياق المكاني بمعنى أقصى المكان"

    - lemma: "نِهَايَة"
      confirm:
        - text: "«غايةُ الشيء وآخِرُه»"
          source: "المعجم الوسيط"
        - text: "«غَايَة يصير الشَّيْء ذُو الكمية إِلَى حَيْثُ لَا يُوجد وَرَاءه شَيْء مِنْهُ»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«ما به يصير الشيء ذا كمية، أي حيث لا يوجد وراءه شيء منه. وقيل نهاية الشيء آخره أصلا من النهي وهو المنع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«النون والهاء والياء أصل صحيح يدل على غاية وبلوغ... ونهاية كل شيء: غايته»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«من الدَّار: حدُّها»"
          source: "المعجم الوسيط"
          addition: "تُستعمل النهاية أيضاً في السياق المكاني بمعنى الحد"
        - text: "«نقطة الانتهاء أو التمام وتستعمل للتعبير عن نهاية الألياف العصبية»"
          source: "معجم المصطلحات الطبية"
          addition: "للنهاية استعمال اصطلاحي طبي"

    - lemma: "مُنْتَهًى"
      evidence_status: "no_material_found"

    - lemma: "أَجَل"
      confirm:
        - text: "«مُدَّة الشيء الوقت الذى يُحدَّد لانتهاء الشيء أو حدوثه»"
          source: "المعجم الوسيط"
        - text: "«المدة التى لها مبدأ ونهاية. الوقت المحدَّد لانقضاء الشيء»"
          source: "المعجم الكبير"
        - text: "«غاية الوقت في محل الدين وغيره»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«الأَجَل غَايَةُ الْوَقْتِ فِي مَحَلِّ الدَّيْنِ وَغَيْرِهِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأجل يدل على مدة محددة سلفاً وغاية معيّنة لا مطلق الانتهاء"

    - lemma: "خَاتِمَة"
      confirm:
        - text: "«من كل شيء: عاقبته وآخره»"
          source: "المعجم الوسيط"
        - text: "«العبارات التي يُنهي بها المتكلم خطابه»"
          source: "مسرد الإعلام والتواصل (أليكسو)"

    - lemma: "انْقِضَاء"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خِتَام"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة مؤيدة بنصوص المعجم الوسيط والمعجم الكبير ومقاييس اللغة.
        تدل على عاقبة الشيء وآخره، وهذا يتوافق مع مفهوم المجموعة.
        تحتاج فقط إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستعمل «الختام» في سياق الأحداث المنظمة والمراسم (ختام المؤتمر،
        ختام الحفل)، ويحمل إيحاءً ببلوغ الغاية المرجوّة والتمام، وأصله من
        الطبع على الشيء بعد الفراغ منه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خِتَام"

    - lemma: "نِهَايَة"
      decision: confirmed
      decision_reason: >
        لمّة أساسية مؤيدة بنصوص معجمية متعددة من الوسيط والكبير ومقاييس اللغة
        والمناوي والسيوطي. تدل على غاية الشيء وآخره، وهي أعم اللمّات دلالةً.
        تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعم من «الختام»؛ تدل على الحد الذي يبلغه الشيء فلا يتجاوزه، وتصلح
        لكل سياق زمني أو مكاني أو مجرد، وأصلها من النهي (المنع) لأن الشيء
        إذا بلغ آخره امتنع من الزيادة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِهَايَة"

    - lemma: "مُنْتَهًى"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية مباشرة بوصفه مدخلاً مستقلاً. كما أن «المنتهى»
        يدل في الاستعمال الغالب على أقصى الحد والغاية البعيدة (سدرة المنتهى)
        أكثر من دلالته على نقطة زمنية محددة ينتهي عندها شيء. يتداخل دلالياً
        مع «نهاية» من الجذر نفسه دون إضافة فارق مهم.

    - lemma: "أَجَل"
      source: stage1
      decision: removed
      decision_reason: >
        الأجل في المعاجم يدل على مدة محددة سلفاً وغاية مضروبة لانقضاء الشيء
        (أجل الدين، أجل الإنسان)، وهو أخص من مفهوم المجموعة الذي يشمل أي نقطة
        انتهاء زمنية سواء أكانت محددة سلفاً أم لا. يصلح أن يكون تحته لا مرادفاً له.

    - lemma: "خَاتِمَة"
      source: stage1
      decision: removed
      decision_reason: >
        من جذر «ختم» نفسه الذي اشتُق منه «ختام»، والمعنى المعجمي متطابق
        تقريباً (عاقبة الشيء وآخره). لكن «الخاتمة» تُستعمل أكثر بمعنى القسم
        الأخير من نص أو خطاب (خاتمة الكتاب، خاتمة البحث)، فهي تميل إلى
        الدلالة على الجزء الختامي لا النقطة الزمنية المحضة. إضافتها مع «ختام»
        لا تُثري المجموعة بفارق دلالي كافٍ.

    - lemma: "انْقِضَاء"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية مباشرة كمدخل مستقل. فضلاً عن أن «الانقضاء» مصدر
        يدل على حدث الانتهاء ذاته (العملية) لا على النقطة الزمنية التي يقع
        عندها، فهو أقرب إلى مفهوم الفعل منه إلى الاسم الدال على اللحظة.

