stage1_review:
  assessment:
    concerns:
      - "استخدام كلمة (الاقتران) في التعريف يضعفه، لأنه يكرر اللمة المعرفة (اقتران) نفسها."
      - "المصطلح (اقتران) ذو دلالة عامة جداً، وكان من الأفضل تخصيصه ليصبح (اقتران صبغي)، غير أن المعاجم المتخصصة توثق (تقارن) و(تشابك) بدقة أعلى في سياق الانقسام المنصف."
    observations: "المفهوم يصف ظاهرة حيوية محددة في علم الوراثة، حيث تتراصف الصبغيات المتماثلة، وتُترجم الكلمة الإنجليزية 'synapsis' غالباً إلى (تشابك) أو (تقارن) أو (اقتران صبغي) في المعاجم الطبية والوراثية."
  blind_candidates:
    - lemma: "تَشَابُك"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (شبك) على وزن (تفاعل) ليدل على التداخل والتلاحم الفيزيائي بين الصبغيات المتماثلة."
    - lemma: "تَقَارُن"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (قرن) على وزن (تفاعل) للدلالة على اصطفاف الصبغيات ومزاوجتها جنباً إلى جنب."
    - lemma: "مُزَاوَجَة"
      generation_method: ishtiqaq
      justification: "من الجذر (زوج) ليعبر عن تحول الكروموسومات المفردة إلى أزواج متماثلة متقابلة."
    - lemma: "اِصْطِفَاف"
      generation_method: ishtiqaq
      justification: "من الجذر (صفف) للدلالة على الترتيب الطولي والتراصف المنتظم للكروموسومات."

stage2_evidence:
  per_lemma:
    - lemma: "اِقْتِرَان"
      confirm:
        - text: "(1) الاقتران الصِّبغيّ: اقتران الصِّبغيّات أو التحامُها (2) synapse."
          source: "المورد الحديث (2008)"
      expands:
        - text: "علاقةٌ ضمن نموذجِ معطيات، لتمثيلِ ارتباطٍ بين الكيانات."
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يدل على معنى الارتباط العام في مختلف المجالات."
    - lemma: "تَشَابُك"
      confirm:
        - text: "تشابك الصبغيات المتماثلة أثناء الانقسام الاختزاليّ. syndesis"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "تَشابُك synapsis (pairing)"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "تَقَارُن"
      confirm:
        - text: "تزاوج الصبغيات المتماثلة الذكرية والأنثوية وتشابك نقاطهما المتقابلة أثناء الدور التشابكيّ من الطور الأول من الانقسام الاختزاليّ. synapsis"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "مُزَاوَجَة"
      contradicts:
        - text: "(المزاوجة) (فِي علم البديع) تَرْتِيب فعل وَاحِد مُخْتَلف الْمُتَعَلّق على شَرط وجزائه"
          source: "المعجم الوسيط"
          conflict: "تستخدم بشكل رئيسي كمصطلح بلاغي أو للدلالة على التزاوج العام ولا تستخدم في السياق الخلوي الجيني."
    - lemma: "اِصْطِفَاف"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "اقتران"
      decision: confirmed
      decision_reason: "مصطلح شائع ومستقر للتعبير عن التقارب والارتباط، ويُستخدم لوصف هذه الظاهرة الحيوية (سواء منفرداً أو كجزء من مركب 'اقتران صبغي')."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِقْتِرَان"
    - lemma: "تشابك"
      decision: confirmed
      decision_reason: "مصطلح علمي دقيق موثق في المعجم الطبي الموحد ومعجم علم الوراثة للدلالة على تداخل الصبغيات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشَابُك"
    - lemma: "تَقَارُن"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق وموثق في معجم علم الوراثة يعبر بوضوح عن المزاوجة والتراصف بين الصبغيات في الانقسام المنصف، وهو مطابق لمفهوم synapsis."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَقَارُن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13585248-n"
    - lemma: "مُزَاوَجَة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح غير موثق علمياً للإشارة لتشابك الكروموسومات، بل يغلب استخدامه في البلاغة أو التزاوج بين الكائنات."
      evidence_assessment:
        case: contradicts_only
    - lemma: "اِصْطِفَاف"
      source: stage1
      decision: removed
      decision_reason: "مصطلح وصفي عام لا يُعتمد كمصطلح علمي مسكوك للدلالة الحصرية على هذه الظاهرة."
      evidence_assessment:
        case: no_material_found

stage4_content:
  definition:
    current: "الاقتران جنباً إلى جنب للكروموسومات المتماثلة للأم والأب في بداية الانقسام المنصف"
    assessment:
      decision: revise
      reason: "التعريف يحتوي على كلمة (الاقتران) وهي إحدى اللمات المرتبطة بالمجموعة، مما يجعله تعريفاً دورياً، والأفضل صياغته لتوضيح ماهية الظاهرة البيولوجية بدون تكرار."
    authored:
      - type: terminological
        text: "عملية تزاوج وتراصف الصبغيات المتماثلة، الذكرية والأنثوية، جنباً إلى جنب في بداية الانقسام المنصف."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13585248-n"
          definition_index: 0
          text: "عملية تزاوج وتراصف الصبغيات المتماثلة، الذكرية والأنثوية، جنباً إلى جنب في بداية الانقسام المنصف."
  examples:
    per_lemma:
      - lemma: "اِقْتِرَان"
        examples:
          - text: "يُعد الاِقْتِرَانُ بين الكروموسومات المتماثلة خطوة أساسية لتبادل المادة الوراثية."
            type: usage
      - lemma: "تَشَابُك"
        examples:
          - text: "يحدث التَّشَابُكُ في الطور التمهيدي الأول من الانقسام المنصف."
            type: usage
      - lemma: "تَقَارُن"
        examples:
          - text: "يضمن التَّقَارُنُ الدقيق للصبغيات توزيعاً متساوياً للمعلومات الوراثية في الخلايا التناسلية."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعد الاِقْتِرَانُ بين الكروموسومات المتماثلة خطوة أساسية لتبادل المادة الوراثية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يحدث التَّشَابُكُ في الطور التمهيدي الأول من الانقسام المنصف."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يضمن التَّقَارُنُ الدقيق للصبغيات توزيعاً متساوياً للمعلومات الوراثية في الخلايا التناسلية."

