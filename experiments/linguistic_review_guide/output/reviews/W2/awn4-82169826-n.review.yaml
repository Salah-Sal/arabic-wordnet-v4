# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-82169826-n
# المفهوم: رسالة بريد إلكتروني (email message)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «رسالة بريد إلكتروني» مركب إضافي طويل من ثلاث كلمات، قد يكون ثقيلاً في الاستعمال اليومي"
      - "لا توجد لمّة بديلة أقصر أو مفردة لهذا المفهوم الشائع جداً"
      - "التعريف الحالي يكرر «عبر» مرتين: «عبر الإنترنت عبر نظام البريد الإلكتروني»"
    observations: "المفهوم هو وحدة واحدة من البريد الإلكتروني (رسالة مفردة وليس النظام ككل). التمييز بين النظام (بريد إلكتروني) والرسالة المفردة مهم. المركب الحالي يؤدي هذا الغرض بإضافة «رسالة» قبل «بريد إلكتروني» للدلالة على الوحدة المفردة."
  blind_candidates:
    - lemma: "بَرِيدَة"
      generation_method: majaz
      justification: "إزاحة دلالية من بَرِيد (نظام البريد/الرسول) إلى بَرِيدَة (تأنيث للوحدة المفردة من البريد الإلكتروني)، على غرار تأنيث اسم النظام للدلالة على الوحدة"
    - lemma: "رِسَالَة إِلِكْتُرُونِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي أقصر من اللمّة الحالية، يصف الرسالة بكونها إلكترونية مباشرة دون ذكر نظام البريد"
    - lemma: "مُبَرَّدَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول من بَرَّدَ (أرسل بالبريد) على وزن مُفَعَّلَة، بمعنى المرسَلة بالبريد الإلكتروني"
    - lemma: "إِيمَيْل"
      generation_method: taarib
      justification: "تعريب مباشر للفظ email الإنجليزي، شائع جداً في الاستعمال المعاصر العربي، يقبل ال- والجمع (إيميلات)"

stage2_evidence:
  per_lemma:
    - lemma: "رِسَالَةُ بَرِيدٍ إِلِكْتُرُونِيٍّ"
      confirm:
        - text: "«1- تبادل رسائل نصية وملفات حاسوبية عبر شبكة اتصالات، كشبكة محلية الامتداد أو إنترنت، بين حواسيب ومطاريف. 2- رسالةُ بريدٍ إلكتروني.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«رسالة بالبريد الإلكترونى — e-mail message; e-mail (2); electronic mail (2)»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«مجموعة الرسيلات المرسلة عن طريق شبكة محلية داخلية أو عالمية، مثل الإنترنيت»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "المعجم الموحد يعرّف «بريد إلكتروني» بأنه مجموعة الرسائل، مما يؤكد أن الرسالة المفردة تحتاج لفظ «رسالة» مضافاً"
        - text: "«وسيلة اتصال يتم بواسطتها نقل المراسلات الخاصة عبر شبكة خطوط هاتفية عامة أو خاصة، وغالباً يتم كتابة الرسالة على جهاز الحاسوب ثم يتم إرسالها إلكترونياً»"
          source: "مسرد التربية، أليكسو"
          addition: "تعريف البريد الإلكتروني كنظام اتصال، مما يميّزه عن الرسالة المفردة"
    - lemma: "بَرِيدَة"
      contradicts:
        - text: "«بَرِيدَة — من (ب ر د) مؤنث بَرِيد بمعنى الرسول»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "مُسجَّلة كاسم عَلَم فقط (مؤنث بريد بمعنى الرسول)، ولا شاهد على استعمالها بمعنى وحدة البريد"
        - text: "«بُرَيْدَةُ — تصغير بردة: ماء لبني ضبينة»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "اسم موضع جغرافي، لا علاقة دلالية بالرسالة"
    - lemma: "رِسَالَة إِلِكْتُرُونِيَّة"
      evidence_status: "no_material_found"
    - lemma: "مُبَرَّدَة"
      evidence_status: "no_material_found"
    - lemma: "إِيمَيْل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "رِسَالَةُ بَرِيدٍ إِلِكْتُرُونِيٍّ"
      decision: confirmed
      decision_reason: "مصطلح مُقنَّن في معاجم المصطلحات التقنية (معجم المعلوماتية 2000 وموسوعة الكهرباء IEC). المعنى الثاني لمدخل «بريد إلكتروني» في معجم المعلوماتية هو حرفياً «رسالةُ بريدٍ إلكتروني»، مما يثبت تثبيته المعجمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِسَالَةُ بَرِيدٍ إِلِكْتُرُونِيٍّ"
    - lemma: "بَرِيدَة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد على استعمال «بريدة» بمعنى رسالة البريد الإلكتروني. الاسم مُسجَّل فقط كعَلَم (اسم شخص أو موضع). توليد دلالي مبتكر لكنه غير مسكوك ولا مُتداوَل."
      evidence_assessment:
        case: contradicts_only
    - lemma: "رِسَالَة إِلِكْتُرُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي غير مُثبَّت معجمياً كمصطلح لرسالة البريد الإلكتروني تحديداً. قد يشمل أي رسالة إلكترونية (SMS، رسالة فورية، إلخ)، فيفتقر للفصل النوعي الذي يميّز البريد الإلكتروني."
      evidence_assessment:
        case: no_material
    - lemma: "مُبَرَّدَة"
      source: stage1
      decision: removed
      decision_reason: "اشتقاق نظري غير مشهود. الفعل «بَرَّدَ» لا يُستعمل بمعنى أرسل بالبريد في العربية المعاصرة، واسم المفعول «مُبَرَّدة» يحيل تلقائياً إلى التبريد (من البرد)."
      evidence_assessment:
        case: no_material
    - lemma: "إِيمَيْل"
      source: stage1
      decision: removed
      decision_reason: "تعريب شائع في الاستعمال اليومي لكنه غير مُقنَّن في معاجم المصطلحات العربية الرسمية (أليكسو). المعاجم الموحدة تفضّل «بريد إلكتروني» للنظام و«رسالة بريد إلكتروني» للوحدة. إدراجه في الشبكة الدلالية قد يضعف الاتساق مع السياسة المصطلحية المعتمدة."
      evidence_assessment:
        case: no_material

