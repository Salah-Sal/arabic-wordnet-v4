# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُصَاهَرَة"
      decision: confirmed
      decision_reason: >
        مُصَاهَرَة مُثبَت في الفقه والقانون والمعاجم الحديثة بوصفه المصطلح المعياري للقرابة المُكتسبة بالزواج.
        ترجمة ARABTERM القانوني (2017) للمصطلح الإنجليزي affinity هي مُصَاهَرَة مع تعريف دقيق. المورد الحديث
        (2008) يعطيها المرتبة الأولى بين معاني affinity. التشكيل مكتمل وصحيح. لا تحضر ظاهرة الاشتراك اللفظي
        المضرّ في السياق الإنساني/الاجتماعي، خلافاً للسياق الجيولوجي-الكيميائي (صهارة/صهر بمعنى الإذابة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphology_check:
        pattern: "مُفَاعَلَة"
        root: "صهر"
        function_fit: "وزن مُفَاعَلَة يدل على المشاركة والاشتراك في الفعل؛ ملائم لمفهوم علاقة متبادلة بين أسرتين"
      nuance_differentiation: >
        مُصَاهَرَة هي المصطلح الوحيد المؤكد في المجموعة بعد حذف العبارة الوصفية؛ تتميز بكونها مصدر مُفاعَلة
        يُبرز طابع التبادل والاشتراك (كلا الأسرتين تنضمّان)، في حين أن الصِّهر (المفرد الذي تشتق منه)
        يُشير إلى الشخص (القريب بالزواج)، فمُصَاهَرَة أرقى في الدلالة المجرّدة على العلاقة ذاتها لا على صاحبها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُصَاهَرَة"

    - lemma: "نَسَب بِالزَّوَاج"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا مصطلح مسكوك؛ تفشل اختبار التثبيت المعجمي لأن مكوّناتها قابلة للإبدال بكلمات
        مرادفة (نسب←صلة، بالزواج←بالختونة) والجملة تبقى وصفاً صحيحاً، مما يدل على غياب التثبيت المعجمي.
        لم تُعثر على أي مدخل معجمي يُثبّت هذه الوحدة. وجودها إلى جانب مُصَاهَرَة لا يُضيف قيمة دلالية،
        بل يُوحي خطأً بأن المفهوم قاصر على الزواج دون التبني (بينما التعريف يشملهما).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "نَسَبُ الاقْتِرَان"
      source: stage1
      decision: removed
      decision_reason: >
        مركب إضافي غير موثق في المعاجم؛ تحقق عنه في قاعدة البيانات فلم يُعثر له على أي أثر معجمي.
        وإن كان شفافاً دلالياً إلا أنه لم يُسكَّ كمصطلح ثابت.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "قَرَابَة الصِّهْر"
      source: stage1
      decision: removed
      decision_reason: >
        مركب إضافي غير موثق في المعاجم بوصفه مصطلحاً. يصف المفهوم لكنه لا يُعدّ وحدة معجمية ثابتة
        مسجّلة. كما أن مُصَاهَرَة أكثر إيجازاً وأرسخ استعمالاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "اصْطِهَار"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم توثّق اصطهار بمعنى إذابة الشحم حرارياً (من الجذر صهر بمعنى الإذابة)، لا بمعنى الانتساب
        بالزواج. يقع في مزلق اشتراك لفظي خطير مع الدلالة الجيولوجية-الكيميائية للجذر. يفضّل عدم
        استخدامه لتجنب اللبس.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


