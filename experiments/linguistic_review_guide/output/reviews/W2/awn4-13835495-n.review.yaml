# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «نَسَب بِالزَّوَاج» عبارة وصفية حرة لا مصطلح مسكوك معجمياً؛ تفشل اختبار التثبيت المعجمي"
      - "التعريف الحالي يستخدم صياغة سلبية («ليست علاقة دم»)، وهو أسلوب غير مثالي في التعريف المعجمي"
      - "مصطلح «مُصَاهَرَة» يغطي قرابة الزواج بدقة، لكن التعريف يشمل التبني أيضاً، وهو ما لا تُشير إليه مُصَاهَرَة بالمفهوم الفقهي والأنثروبولوجي المعتاد"
      - "الدلالة الأنثروبولوجية الدقيقة (affinity بالمعنى الأكاديمي) لا تزال مُهملة في قواميس المصطلحات التخصصية"
    observations: >
      المجموعة الترادفية تُمثّل مفهوم القرابة بالمُصاهرة (المصطلح الأنثروبولوجي affinity) في مقابل القرابة الدموية
      (consanguinity). المصطلح العربي الكلاسيكي «مُصَاهَرَة» موثّق في المعاجم الفقهية والقانونية بدلالة مطابقة
      لهذا المفهوم. أما «نَسَب بِالزَّوَاج» فهو وصف تفسيري لا وحدة معجمية ثابتة؛ إذ يمكن إبدال مكوّناته
      (نسب←صلة، بالزواج←بالختونة) فيبقى الوصف صحيحاً، مما يدل على أنه ليس مصطلحاً مسكوكاً.

  blind_candidates:
    - lemma: "مُصَاهَرَة"
      generation_method: ishtiqaq
      justification: >
        مصدر مُفَاعَلَة من الجذر (صهر)؛ الوزن مُفَاعَلَة يدل على الاشتراك والتبادل في العلاقة، وهو مناسب
        لدلالة القرابة المتبادلة الناشئة عن الزواج. الجذر (صهر) يحمل في أصله الأوّل معنى القُرْبى كما
        أثبت ابن فارس في المقاييس. المصطلح مُسَكَّك في الفقه والقانون والأنثروبولوجيا.
    - lemma: "نَسَبُ الاقْتِرَان"
      generation_method: tarkib
      justification: >
        تركيب إضافي يجمع «النَّسَب» (القرابة) و«الاقتران» (الارتباط بالزواج). يُشير إلى القرابة الحاصلة
        بالاقتران والزواج لا بالدم. الاقتران أعمّ من الزواج ويشمل جوانب التبني في السياق الأنثروبولوجي.
        غير أن الاستخدام المعجمي لهذا المركب لم يُثبت بعد.
    - lemma: "قَرَابَة الصِّهْر"
      generation_method: tarkib
      justification: >
        تركيب إضافي شفاف يجمع «القرابة» (genus) و«الصِّهْر» (differentia)؛ الصِّهْر في المعاجم الكلاسيكية
        يعني القريب بالزواج، فيصبح التركيب «القرابة من جهة الصهر». المركب بسيط وقابل للتداول.
    - lemma: "اصْطِهَار"
      generation_method: ishtiqaq
      justification: >
        مصدر افتعال من جذر (صهر) بمعنى الدخول في علاقة الصهر والانتساب إليها. الوزن افتعال يدل على
        اكتساب الصفة والانخراط فيها. أقل شيوعاً من مُصَاهَرَة لكنه موجود في المعجم العربي. يُمثّل
        محاولة إحياء صيغة اشتقاقية مختلفة للمفهوم ذاته.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "مُصَاهَرَة"
      confirm:
        - text: "«رابطة قرابة يرتبها الزواج بين أسرتي الزوجين، وتنتج آثارا قانونية وشرعية متعددة.»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM؛ ترجمة: affinity"
        - text: "«(1) مصاهرة (2) صلة؛ علاقة؛ نَسَب ...»"
          source: "المورد الحديث (2008) — ARABTERM؛ أول معاني affinity هو مصاهرة"
        - text: "«المُصَاهرة: عند الفقهاء هي حرمة الخُتُونة.»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
        - text: "«الْمُصَاهَرَة: من الصهر، فِي الْقَامُوس الصهر بِالْكَسْرِ الْقَرَابَة وَحُرْمَة الختونة»"
          source: "دستور العلماء للأحمدنكري (القرن الثامن عشر)"
        - text: "«القريب بالزواج. ويوصف به فيقال: هو صِهْرى المُصَاهَرَةُ»"
