        - text: "«الصِّهْرُ، بالكسر: القَرابَةُ، وحُرْمَةُ الخُتُونَةِ ج: أصْهَارٌ وصُهَراءُ ... وقد صاهَرَهُمْ ... صارَ فيهم صِهْراً»"
          source: "القاموس المحيط للفيروزآبادي (ت 1414م) — الجذر ذاته"
        - text: "«الصِّهْر: الْقَرَابَة، والصِّهْر: حُرْمَة الختونة ... يُقَال لأهل بَيت الْمَرْأَة: أَصْهَار»"
          source: "المحكم لابن سيده (ت بالقرن الحادي عشر)"
        - text: "«(الصهر) الْقَرِيب بالزواج ويوصف بِهِ ... والمصاهرة وَفِي التَّنْزِيل الْعَزِيز: {فَجَعَلَهُ نَسَباً وَصِهْراً}»"
          source: "المعجم الوسيط (رواية الهوراماني، 1998م)"
        - text: "«قرابة الزواج»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة، OCR) — المعنى الثالث للصِّهر"
      expands:
        - text: "«الصِّهر:[في الانكليزية] Alliance by women ... بالكسر وسكون الهاء في اللغة ... وقال محمد وأبو عبيدة: صهر الشخص كلّ ذي رحم محرم من جانب عرسه ... والنسب ما لا يحلّ نكاحه والصهر ما يحلّ نكاحه من القرابات»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
          addition: "يُفرّق التهانوي بين النسب والصهر تفريقاً دقيقاً؛ النسب = المحرَّم بالدم، والصهر = المحرَّم بالزواج (القرابة المُكتسبة). هذا التفريق يوافق تماماً المفهوم الأنثروبولوجي"
        - text: "«الإصهار: التَّحَرُّمُ بِجِوَارٍ أَوْ نَسَبٍ أَوْ تَزَوُّجٍ»"
          source: "مقاييس اللغة لابن فارس (ت 1004م) — نقلاً عن ابن الأعرابي"
          addition: "توسيع الدلالة ليشمل التحرّم بالجوار والنسب والتزوج، مما يقترب من المفهوم الأنثروبولوجي الأشمل للمُصَاهَرَة"
        - text: "«الأصرة: ما عطفك على غيرك من رحم، أو قرابة، أو مصاهرة، أو معرفة»"
          source: "المعجم الوسيط (OCR)"
          addition: "يُظهر أن المصاهرة تُعدّ عاملاً مستقلاً في منظومة الروابط الاجتماعية إلى جانب الرحم (الدم) والمعرفة"

