        value: '{"root":"غذو","maqayis":"«(غَذَى) الْغَيْنُ وَالذَّالُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شَيْءٍ مِنَ الْمَأْكَلِ، وَعَلَى جِنْسٍ مِنَ الْحَرَكَةِ. فَأَمَّا الْمَأْكَلُ فَالْغِذَاءُ، وَهُوَ الطَّعَامُ وَالشَّرَابُ.»"}'
