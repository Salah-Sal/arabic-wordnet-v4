stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي جيد ودقيق، ولكن الاقتصار على لمة (تغذية) قد لا يحيط بكافة الاستعمالات التي تدل على عملية الاستيعاب الذاتي للغذاء، لذا يُستحسن إضافة (اغتذاء)."
    observations: "المفهوم يشير إلى (العملية العضوية للتغذية) أو علم التغذية (nutrition) في علم وظائف الأعضاء. كلمة (تغذية) هي الأشيع والأكثر استقراراً في المعاجم العلمية الحديثة. كما تستعمل كلمة (اغتذاء) للإشارة إلى عملية حصول الكائن الحي على الغذاء واستيعابه."
  blind_candidates:
    - lemma: "تَغْذِيَة"
      generation_method: ishtiqaq
      justification: "مصدر مشتق من الجذر (غ ذ و) على وزن (تَفْعِلَة)، يدل على عملية تقديم الغذاء أو تناوله، وهو المصطلح العلمي المعتمد لـ (nutrition)."
    - lemma: "اغْتِذَاء"
      generation_method: ishtiqaq
      justification: "مصدر مشتق على وزن (افْتِعَال)، يركز على مطاوعة الفعل وعملية استيعاب الغذاء ذاتياً من قبل الكائن الحي."
    - lemma: "تَغَذٍّ"
      generation_method: ishtiqaq
      justification: "مصدر مشتق يعبر عن عملية تناول الغذاء، ولكنه أقل استعمالاً من (تغذية) كمصطلح شامل."
    - lemma: "تَقَوُّت"
      generation_method: ishtiqaq
      justification: "مشتق من (قوت) ويدل على تناول ما يمسك الرمق ويقيم البدن، لكنه أقل تخصصاً في السياق الفسيولوجي."

stage2_evidence:
  per_lemma:
    - lemma: "تغذية"
      confirm:
        - text: "تغذية: nutrition"
          source: "المعجم الطبي الموحد (2009)"
        - text: "تغذية: nutrition"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "اغتذاء"
      confirm:
        - text: "اِغْتِذاء: trophicity"
          source: "المعجم الطبي الموحد (2009)"
        - text: "(1) تغذية (2) اغتذاء (3) غذاء. : nutrition"
          source: "المورد الحديث (2008)"
    - lemma: "تغذ"
      expands:
        - text: "تغذى يتغذى، تغذيا، فهو متغذ: اغتذى، تناول الغذاء."
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "تقوت"
      expands:
        - text: "(تقوت) بالشَّيْء أكله"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "تغذية"
      decision: confirmed
      decision_reason: "المصطلح القياسي والأشيع والمستقر علمياً للمفهوم، ومثبت في كافة المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَغْذِيَة"

    - lemma: "اغْتِذَاء"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق يركز على عملية استيعاب الغذاء ذاتياً من الكائن الحي، ومثبت في المعاجم العلمية المعتمدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "اغْتِذَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَغَذٍّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح صحيح لغوياً لكنه أقل تداولاً كمصطلح علمي مقارنة بـ (تغذية) و(اغتذاء) في هذا السياق."

    - lemma: "تَقَوُّت"
      source: stage1
      decision: removed
      decision_reason: "يعني أكل القوت، وهو فعل أعم لا يعبر بدقة عن العمليات العضوية والفسيولوجية المعقدة للتغذية."

stage4_content:
  definition:
    current: "(علم وظائف الأعضاء) العملية العضوية للتغذية؛ العمليات التي يستوعب بها الكائن الحي الطعام ويستخدمه للنمو والصيانة"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وعلمي ويحيط بأبعاد المفهوم (علم وظائف الأعضاء، استيعاب الكائن الحي للطعام للنمو والصيانة)."
  examples:
    per_lemma:
      - lemma: "تَغْذِيَة"
        examples:
          - text: "يُعَدُّ سُوءُ التَّغْذِيَةِ مِنْ أَبْرَزِ المَشَاكِلِ الصِّحِّيَّةِ الَّتِي تُوَاجِهُ الدُّوَلَ النَّامِيَةَ."
            type: usage
      - lemma: "اغْتِذَاء"
        examples:
          - text: "يَعْتَمِدُ اغْتِذَاءُ النَّبَاتَاتِ عَلَى امْتِصَاصِ العَنَاصِرِ المَعْدَنِيَّةِ مِنَ التُّرْبَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ سُوءُ التَّغْذِيَةِ مِنْ أَبْرَزِ المَشَاكِلِ الصِّحِّيَّةِ الَّتِي تُوَاجِهُ الدُّوَلَ النَّامِيَةَ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يَعْتَمِدُ اغْتِذَاءُ النَّبَاتَاتِ عَلَى امْتِصَاصِ العَنَاصِرِ المَعْدَنِيَّةِ مِنَ التُّرْبَةِ."

stage5_enrichment:
  per_entry:
    - lemma: "تَغْذِيَة"
      entry_id: "{auto}"
      root: "غذو"
      maqayis_quote: "«(غَذَى) الْغَيْنُ وَالذَّالُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شَيْءٍ مِنَ الْمَأْكَلِ، وَعَلَى جِنْسٍ مِنَ الْحَرَكَةِ. فَأَمَّا الْمَأْكَلُ فَالْغِذَاءُ، وَهُوَ الطَّعَامُ وَالشَّرَابُ.»"
    - lemma: "اغْتِذَاء"
      entry_id: "{auto}"
      root: "غذو"
      maqayis_quote: "«(غَذَى) الْغَيْنُ وَالذَّالُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شَيْءٍ مِنَ الْمَأْكَلِ، وَعَلَى جِنْسٍ مِنَ الْحَرَكَةِ. فَأَمَّا الْمَأْكَلُ فَالْغِذَاءُ، وَهُوَ الطَّعَامُ وَالشَّرَابُ.»"
  per_sense:
