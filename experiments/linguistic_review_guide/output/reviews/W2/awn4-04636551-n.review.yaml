          params: {lemma: "لاَمُبَالاَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04636551-n"}
    - lemma: "فُتُور"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن برودة المشاعر وضعف الاستجابة العاطفية."
