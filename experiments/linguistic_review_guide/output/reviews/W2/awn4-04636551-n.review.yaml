stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دقيق ولكنه مقتضب جداً."
      - "لمة 'جمود' عامة وتحتاج في كثير من السياقات إلى التقييد لتصبح (جمود عاطفي) لتمييزها عن الجمود الفكري أو الحركي، ولكنها مقبولة كمرادف في السياق النفسي."
      - "توجد مرادفات شائعة تصف هذه الحالة بدقة مثل اللامبالاة والفتور لم تكن مدرجة."
    observations: "المفهوم يعبر عن غياب أو ضعف شديد في الانفعال والاستجابة العاطفية. 'تبلد عاطفي' هو المصطلح الأكثر دقة في السياقات النفسية. كما تعبر كلمات مثل 'فتور' و'لامبالاة' عن درجات من هذا المعنى."
  blind_candidates:
    - lemma: "تَبَلُّد"
      generation_method: ishtiqaq
      justification: "مصدر يدل على تخدر الإحساس وتوقف التفاعل العاطفي."
    - lemma: "لاَمُبَالاَة"
      generation_method: tarkib
      justification: "تركيب مزجي صار كلمة واحدة تدل على غياب الاهتمام والانفعال."
    - lemma: "فُتُور"
      generation_method: ishtiqaq
      justification: "مصدر يدل على ضعف الاستجابة العاطفية وبرودتها."
    - lemma: "جَفَاء"
      generation_method: majaz
      justification: "استعارة من الجفاف والغلظة للدلالة على غياب المشاعر الإيجابية، وإن كان يميل إلى معنى القسوة."

stage2_evidence:
  per_lemma:
    - lemma: "تبلد عاطفي"
      confirm:
        - text: "تبلد، خمول الذهن (apathy)"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان"
      expands:
        - text: "(تبلد) صَار بليدا وتصنع البلادة"
          source: "المعجم الوسيط"
          addition: "يدل على غياب التفاعل والانفعال كصفة عامة."
    - lemma: "جمود"
      confirm:
        - text: "الجمود: هو هيئة حاصلة للنفس بها يقتصر على استيفائها ما ينبغي وما لا ينبغي."
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "موت؛ جُمود؛ هُمود؛ فُتور إلخ (را. dead)."
          source: "المورد الحديث"
    - lemma: "تَبَلُّد"
      confirm:
        - text: "تبلد، خمول الذهن (apathy)"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان"
    - lemma: "لاَمُبَالاَة"
      confirm:
        - text: "اللامُبالاة؛فُتُورُ الشُّعُوْر ؛ خُمُوْلٌ (apathy)"
          source: "المعجم الطبي الموحد"
    - lemma: "فُتُور"
      confirm:
        - text: "اللامُبالاة؛فُتُورُ الشُّعُوْر ؛ خُمُوْلٌ (apathy)"
          source: "المعجم الطبي الموحد"
        - text: "نقص مرضي في النشاط."
          source: "معجم المصطلحات الطبية"
    - lemma: "جَفَاء"
      contradicts:
        - text: "الغلظ في العشرة والخرق في المعاملة وترك الرفق في الأمور."
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "يدل على القسوة وسوء المعاملة تجاه الآخرين وليس مجرد غياب العاطفة الذاتية."

stage3_analysis:
  per_lemma:
    - lemma: "تبلد عاطفي"
      decision: confirmed
      decision_reason: "مصطلح نفسي دقيق وشائع للتعبير عن حالة التسطح العاطفي (Blunted affect) التي تتسم بغياب المشاعر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبَلُّد عَاطِفِيّ"
    - lemma: "جمود"
      decision: confirmed
      decision_reason: "كلمة معبرة عن ثبات الحالة وعدم الانفعال، وتستخدم مجازياً للدلالة على غياب المشاعر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُمُود"
    - lemma: "تَبَلُّد"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق يستخدم بمفرده أو مضافاً للتعبير عن تبلد المشاعر وغياب الاستجابة العاطفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَبَلُّد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04636551-n"}
    - lemma: "لاَمُبَالاَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن غياب الاهتمام والانفعال العاطفي تجاه المؤثرات الخارجية."
