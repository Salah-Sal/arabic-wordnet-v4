stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي 'فعل الدفع أو التحريك' عام جداً ويفتقر للدقة الاصطلاحية التي تميز المفهوم الميكانيكي أو الفيزيائي."
      - "المجموعة تفتقر لبعض المرادفات التقنية التراثية (مثل الدسر) والحديثة (مثل التسيير)."
    observations: "المجموعة تغطي مفهوماً فيزيائياً وميكانيكياً أساسياً وهو توليد القوة للحركة. اللمات الموجودة صحيحة لكنها تحتاج إلى تشكيل دقيق وإثراء بمرادفات أكثر تخصصاً."
  blind_candidates:
    - lemma: "دَفْع"
      generation_method: ishtiqaq
      justification: "المصدر المباشر للفعل 'دفع'، وهو المقابل الأدق للمصطلح الإنجليزي propulsion."
    - lemma: "تَسْيِير"
      generation_method: ishtiqaq
      justification: "يُستخدم للتعبير عن جعل الشيء يسير، وهو مناسب جداً لمفهوم actuation وpropulsion في سياق المركبات والآلات."
    - lemma: "تَحْرِيك"
      generation_method: ishtiqaq
      justification: "المصدر المباشر للفعل 'حرك'، وهو يعبر عن عملية جعل الساكن متحركاً (actuation)."
    - lemma: "سَوْق"
      generation_method: ishtiqaq
      justification: "لفظ عربي فصيح للتعبير عن حث الشيء على السير من الخلف، ويصلح في السياقات الميكانيكية والبيولوجية."

stage2_evidence:
  per_lemma:
    - lemma: "دَفْع"
      confirm:
        - text: "«الدَّفْعُ: نَحْيُ الشَّيءِ... ويُقال دَفَعْتُ الشَّيءَ أَدْفَعُهُ دَفْعًا.»"
          source: "مقاييس اللغة"
        - text: "«دَفْع: propulsion»"
          source: "المعجم الموحد لمصطلحات النقل"
      expands:
        - text: "«الدفع النفثي: دفع الطائرة بواسطة محركات نفاثة.»"
          source: "المورد الحديث"
    - lemma: "تَحْرِيك"
      confirm:
        - text: "«التحريك: أن يؤتى بالحركات الثلاث... (سياق لغوي)»"
          source: "مختصر العبارات"
        - text: "«direct actuation: تحريك مباشر»"
          source: "موسوعة الكهرباء (IEC)"
      expands:
        - text: "«التحريك: جعل الشيء يتحرك.»"
          source: "المعجم الوسيط"
    - lemma: "تَسْيِير"
      confirm:
        - text: "«تسيير: propulsion»"
          source: "المورد الحديث"
        - text: "«سير السفينة: جعلها تسير.»"
          source: "المعجم الوسيط"
    - lemma: "دَسْر"
      confirm:
        - text: "«الدَّالُ وَالسِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الدَّفْعِ. يُقَالُ دَسَرْتُ الشَّيْءَ دَسْرًا، إِذَا دَفَعْتَهُ دَفْعًا شَدِيدًا.»"
          source: "مقاييس اللغة"
        - text: "«دَسْر: propulsion»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "دَفْع"
      decision: confirmed
      decision_reason: "هو المصطلح الأساسي والأكثر شيوعاً للتعبير عن القوة الدافعة (propulsion)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَفْع"
    - lemma: "تَحْرِيك"
      decision: confirmed
      decision_reason: "مصطلح عام وشامل يغطي مفهوم الـ actuation (وضع الشيء في حالة حركة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْرِيك"
    - lemma: "تَسْيِير"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستخدم حديثاً في السياقات التقنية للتعبير عن دفع المركبات والآلات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَسْيِير", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00045991-n"}
    - lemma: "دَسْر"
      decision: confirmed
      decision_reason: "لفظ تراثي دقيق يعبر عن الدفع الشديد، ويستخدم تقنياً كمرادف لـ propulsion خاصة في سياق السفن."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دَسْر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00045991-n"}

stage4_content:
  definition:
    current: "فعل الدفع أو التحريك"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً؛ يحتاج لإضافة البعد الوظيفي (توليد القوة للحركة)."
    authored:
      - type: terminological
        text: "عَمَلِيَّةُ بَذْلِ قُوَّةٍ مِيكَانِيكِيَّةٍ أَوْ طَبِيعِيَّةٍ لِدَفْعِ جِسْمٍ أَوْ جَعْلِهِ يَتَحَرَّكُ أَوْ يَنْطَلِقُ لِلأَمَامِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "دَفْع"
        examples:
          - text: "تعتمد الصواريخ الحديثة على محركات ذات دفع قوي لمغادرة الغلاف الجوي."
            type: usage
      - lemma: "تَحْرِيك"
        examples:
          - text: "يتطلب تحريك الآلة الضخمة ضغطاً مستمراً على زر التشغيل."
            type: usage
      - lemma: "تَسْيِير"
        examples:
          - text: "تستخدم طاقة الرياح في تسيير السفن الشراعية قديماً."
            type: usage
      - lemma: "دَسْر"
        examples:
          - text: "دسر الموج السفينة إلى الشاطئ بقوة."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-00045991-n", definition_index: 0, text: "عَمَلِيَّةُ بَذْلِ قُوَّةٍ مِيكَانِيكِيَّةٍ أَوْ طَبِيعِيَّةٍ لِدَفْعِ جِسْمٍ أَوْ جَعْلِهِ يَتَحَرَّكُ أَوْ يَنْطَلِقُ لِلأَمَامِ."}

