# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التوليد الأعمى (من synset_info_masked.yaml — بدون الاطلاع على اللمّات)
  # التعريف المرجعي: "صفة أو حالة تتميز باليقين أو القبول أو التأكيد والتوكيد الجازم"
  blind_candidates:
    - lemma: "إِيجَابِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن فَعَّالِيَّة من «إيجاب» ← «أوجب» ← الجذر (و ج ب)؛
        يدل على صفة الإيجاب أي التأكيد الجازم والإقرار القاطع في مقابل السلب
        والتردد، وهو المعنى الجوهري الذي يؤطّره التعريف.

    - lemma: "قَطْعِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «قَطَعَ» على وزن فَعْلِيَّة؛ يدل على حالة الحكم القاطع
        الذي لا مجال فيه للشك أو التردد، وهو ما يتناسب مع بُعد «التوكيد الجازم»
        في التعريف.

    - lemma: "وُثُوقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «وَثَقَ» على وزن فُعُولِيَّة؛ يدل على صفة الثقة التامة
        والإيقان الراسخ في الحكم بلا تردد، مما يلائم عنصر «التوكيد الجازم والقبول».

    - lemma: "إِقْرَارِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «إقرار» ← «أقرَّ»؛ يدل على صفة الإقرار والقبول
        والتصديق الجازم، وهو ما يجمع بين معنيَي «القبول» و«التأكيد» الواردَين
        في التعريف.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        لمّة «يَقِين» أضيق دلالةً من المجموعة: اليقين في المعجمية العربية يختص
        بـ«العلم الذي لا شك معه»، أي الجانب الإبستيمولوجي من الحالة، بينما
        المجموعة تشمل أيضاً الإيجابية كسمة سلوكية وموقفية تتعدى مجرد اليقين.
      - >
        الانفصال بين «positivity/positiveness» و«positivism» مُضمَر في المجموعة:
        الأول وصف للحالة الوجدانية، والثاني فلسفة إجرائية (مذهب أوجست كونت)؛
        يستدعيان في حقيقة الأمر مجموعتين ترادفيتين منفصلتين.
      - >
        التعريف الحالي يستخدم «أو» بصورة متكررة مما يُضعف التمييز الفصلي
        بين مكونات الدلالة ويجعله قائمةً لا تعريفاً منطقيًّا.
    observations: >
      المجموعة تجمع تحت مظلة واحدة ثلاثة مفاهيم إنجليزية متداخلة: «positivity»
      بمعنى الإيجابية كصفة الشخصية، و«positiveness» بمعنى القطعية في الحكم،
      و«positivism» بمعنى الفلسفة الوضعية. أحسن ما يمثّل الجامع بينها في العربية
      هو لفظ «الإيجابية» بمعناه المعاصر الواسع. أما «يَقِين» فمخصوص بمعنى
      اليقين العلمي الإبستيمولوجي وهو أضيق من المراد.
      لمّة «إِيجَابِيَّة» التي أُنتجت بصورة عمياء طابقت اللمّة الأولى في
      synset_info مما يؤكد وجاهة الاختيار المبدئي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# ميزانية الاستعلامات المُستخدَمة: 4 استعلامات
#  ١. مطابقة دفعية: إيجابية+يقين+قطعية+وثوقية+إقرارية (مع ال-)
#  ٢. جسر إنجليزي: positivity+positiveness+positivism+certainty+affirmation
#  ٣. بحث FTS لـ ايجابية+قطعية+يقينية
#  ٤. إثراء بالمعرّف + مقاييس اللغة (يقن + وجب)
stage2_evidence:
  per_lemma:

    - lemma: "إِيجَابِيَّة"
      confirm:
        - text: >
            «الوضعيّة؛ اليقينية؛ الإيجابية إلخ.»
          source: "المورد الحديث (2008) — ترجمة: positivity"
        - text: >
            إيجابيّ — من (و ج ب) نسبة إلى الإيجاب
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: >
            «إيجابية المصل» = seropositivity؛
            «ايجابية مباشرة» = direct positive؛
            «معدل الإيجابية الكاذبة» = false positive rate
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يكشف عن رسوخ المصطلح في المعجمية التقنية العربية
            بمعنى الحالة الإيجابية، مما يعزز قبوله في الاستعمال العام.
        - text: >
            «إيجابي» ← positive — مسرد الإعلام والتواصل (ALECSO)
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          addition: >
            جذر المصطلح (إيجابي) موثَّق بوصفه المقابل العربي المعتمد لـ positive.

    - lemma: "يَقِين"
      confirm:
        - text: >
            «(الْيَقِين) الْعلم الَّذِي لَا شكّ مَعَه؛ و(فِي الفلسفة)
            اطمئنان النَّفس إِلَى حكم مَعَ الِاعْتِقَاد بِصِحَّتِهِ»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: >
            «اليَقِينُ: العِلْمُ الذى لا شكَّ معه؛
            (فى الفلسفة): اطمئنان النَّفْس إلى حكمٍ مع الاعتقاد بصحَّته — الموت»
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
        - text: >
            «يقين: certainty» — مسرد الفلسفة وعلم النفس (ALECSO)؛
            «يقين: certainty» — مسرد الإعلام والتواصل (ALECSO)
          source: "ArabTerm — مسردا الفلسفة والإعلام"
        - text: >
            «اليقين: العلم الحاصل بعد الشك. وقيل: نقيض الشك.»
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: >
            «اليقين: علم يحصل بعد استدلال وروية»
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: >
            تؤكد المصادر المتعددة أن يَقِين = certainty (اليقين الإبستيمولوجي)،
            وهو مفهوم أضيق من المجموعة التي تشمل الإيجابية كموقف وسلوك. ترجمة
            ARABTERM الثابتة هي certainty لا positivity ولا positivism.
      expands:
        - text: >
            «الوضعية؛ اليقينية؛ الإيجابية إلخ.» — ترجمة: positivism
          source: "المورد الحديث (2008)"
          addition: >
            يُشير المورد الحديث إلى «اليقينية» (لا «اليقين») ضمن مرادفات
            positivism، وهو ما يفتح باباً للتمييز: الصيغة المصدرية الصناعية
            (يقينية) أقرب من اليقين وحده لمعنى المجموعة.

    - lemma: "قَطْعِيَّة"
      contradicts:
        - text: >
            «مكثفة قطعية (في مجهر الساحة المظلمة)» = paraboloid condenser؛
            «متلازمة قطعية» = segmentary syndrome؛
            «نبيبات قطعية» = segmental tubules؛
            «صواتة قطعية» = segmental phonology
          source: "المعجم الطبي الموحد (2009) ومعجم اللسانيات (ArabTerm)"
          conflict: >
            «قطعية» في المعجمية العربية المعاصرة رسخت بمعنى «segmental/sectional»
            التشريحي واللساني، ولا تؤدي معنى الإيجابية أو القطعية الإبستيمولوجية.

    - lemma: "وُثُوقِيَّة"
      contradicts:
        - text: >
            «وثوقية: احتمال اشتغال نظام معلومياتي بكيفية جيدة ولمدة طويلة»
            — translation_en: reliability
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          conflict: >
            وُثُوقِيَّة وُظِّفت مصطلحاً تقنياً لـ«reliability» لا «positivity»،
            وهو ما يتعارض مع المعنى المطلوب.
        - text: >
            «وثوقية، يقينية» = dogmatism
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
          conflict: >
            رسوخ المصطلح بمعنى «dogmatism» أو «reliability» يمنع اعتماده
            مرادفاً لـ«positivity/positiveness».

    - lemma: "إِقْرَارِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّات موجودة ──

    - lemma: "إِيجَابِيَّة"
      decision: confirmed
      decision_reason: >
        اللمّة مشتقة اشتقاقاً سليماً من الجذر (و ج ب) عبر سلسلة:
        وَجَبَ ← أَوْجَبَ ← إيجاب ← إيجابي ← إيجابية (مصدر صناعي).
        وهي المقابل العربي المعتمد في المعاجم الحديثة لـ positivity/positiveness،
        وقد أقرّها المورد الحديث وتداولتها المعاجم التقنية على نطاق واسع.
        التشكيل الكامل موجود. لا حاجة إلى إجراء تصحيحي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        إِيجَابِيَّة هي اللمّة الوحيدة المؤكَّدة في المجموعة بعد حذف يَقِين؛
        تغطي المفهومَين: (أ) الإيجابية كصفة سلوكية/وجدانية (positiveness/positivity)
        و(ب) القطعية الجازمة في الحكم؛ وهي أعمُّ من يَقِين الإبستيمولوجي.

    - lemma: "يَقِين"
      decision: removed
      decision_reason: >
        يَقِين في المعجمية العربية مخصَّص بمعنى «العلم الذي لا شك معه» وهو
        مصطلح إبستيمولوجي (certainty/certitude)، وترجمته الثابتة في ARABTERM
        والمعاجم الفلسفية هي certainty لا positivity. إدراجه في هذه المجموعة
        خلطٌ بين مفهوم اليقين المعرفي ومفهوم الإيجابية كموقف وسلوك. يستحق
        يَقِين موضعاً في مجموعة خاصة بـ«certainty/certitude». فضلاً عن ذلك،
        الاستبدال السياقي يُظهر التعارض: «أبدى الشخص يقيناً في موقفه» تعني
        جزمَه لا إيجابيتَه الوجدانية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──

    - lemma: "إِيجَابِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        طابق المرشحُ المُولَّد عمياءً اللمّةَ الموجودة في المجموعة، مما يُعزز
        اعتمادها. لا يُنشأ مدخل جديد لأن الإدخال موجود مسبقاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "قَطْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رسخت «قطعية» في المعجم العربي الحديث بمعنى «segmental» (التشريحي/اللساني)،
        مما يُنشئ تعارضاً مع المعنى المراد ويُفضي إلى لبسٍ مصطلحي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "وُثُوقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        وثوقية مُوظَّفة مصطلحاً معتمداً لـ«reliability» في تقانة المعلومات،
        ولـ«dogmatism» في علم الاجتماع؛ كلا المعنيين يتعارضان مع positivity.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "إِقْرَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود للمصطلح في القاعدة المعجمية المستعلَمة. وهو وإن كان سليم
        الاشتقاق إلا أنه لم يَسِكّ بعدُ وحدةً معجمية مستقلة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
# (معالجة اللمّات المؤكدة فقط: إِيجَابِيَّة)
stage4_content:

  definition:
    current: "صفة أو حالة تتميز باليقين أو القبول أو التأكيد والتوكيد الجازم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يعتمد تراكُم «أو» المتكررة بدلاً من التعريف المنطقي
        (جنس + فصل)، كما يستخدم «اليقين» الذي حُذفت لمّته من المجموعة مما
        يُوهم بالدوران. والتعريف لا يُبرز الجانب الوجداني والسلوكي للإيجابية
        كموقف حياتي (positivity)، ويجمع دون فصل بين positivity وpositivism.
    authored:
      - type: terminological
        text: >
          صفةٌ راسخةٌ في شخصية الإنسان أو حالةٌ ذهنيةٌ تتجلَّى في الإقرار
          الجازم والتوجُّه التوكيدي، وتتمثَّل في قبول الأمور وتأكيدها
          دون تردُّدٍ أو نفي.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          الإيجابيَّةُ: نقيضُ السلبيَّة؛ وهي كونُ الموقفِ أو الشخصِ
          مُقِرًّا مُؤكِّداً مائلاً إلى القبول، لا ناكراً ولا مترددًا.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05174332-n"
          definition_index: 0
          text: >
            صفةٌ راسخةٌ في شخصية الإنسان أو حالةٌ ذهنيةٌ تتجلَّى في الإقرار
            الجازم والتوجُّه التوكيدي، وتتمثَّل في قبول الأمور وتأكيدها
            دون تردُّدٍ أو نفي.
      - command: add_definition
        params:
