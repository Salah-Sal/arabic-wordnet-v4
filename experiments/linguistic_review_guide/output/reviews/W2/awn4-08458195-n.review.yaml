stage1_review:
  assessment:
    concerns:
      - "اللمة 'القانون' وردت معرفة بـ 'ال' وهذا يخالف المعيار المعجمي بوضع اللمات نكرة."
      - "اللمة 'الفقه القانوني' تعني علم القانون أو الاجتهادات القضائية (jurisprudence)، ولا تطلق عادة على مجموعة القواعد الملزمة بحد ذاتها (law)."
    observations: "المفهوم يشير إلى مجموعة القواعد المنظمة للمجتمع والتي تفرضها السلطة. اللفظة الأشهر والأكثر دقة هي 'قانون'، تليها 'تشريع'."
  blind_candidates:
    - lemma: "قَانُون"
      generation_method: taarib
      justification: "كلمة معربة قديمة استقرت في الاستعمال لتدل على القاعدة المطردة أو مجموعة القواعد التي تنظم المجتمع."
    - lemma: "تَشْرِيع"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ش ر ع)، ويدل على سن القواعد والقوانين المنظمة."
    - lemma: "شَرِيعَة"
      generation_method: majaz
      justification: "إزاحة دلالية من المعنى الأصلي (مورد الماء) إلى القواعد والأحكام التي يُلزم بها الناس، وتستخدم عادة في السياق الديني أو القانوني."
    - lemma: "نِظَام"
      generation_method: majaz
      justification: "استخدام لمعنى الترتيب والتنظيم للدلالة على مجموعة القواعد الملزمة، كما يُستخدم في بعض الدول العربية كمرادف للقانون."

stage2_evidence:
  per_lemma:
    - lemma: "القانون"
      confirm:
        - text: "مقياس كل شىء وطريقه (فى الاصطلاح): أمر كليٌّ ينطبق على جميع جُزئِيَّاته التى تَتَعرَّف أحكامها منه"
          source: "المعجم الوسيط"
    - lemma: "الفقه القانوني"
      evidence_status: "no_material_found"
    - lemma: "قَانُون"
      confirm:
        - text: "مقياس كل شَيْء وَطَرِيقه... (فِي الِاصْطِلَاح) أَمر كلي ينطبق على جَمِيع جزئياته الَّتِي تتعرف أَحْكَامهَا مِنْهُ"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "تَشْرِيع"
      confirm:
        - text: "سنُّ القوانين"
          source: "المعجم الوسيط"
    - lemma: "شَرِيعَة"
      confirm:
        - text: "ما شرعه الله لعباده من العقائد والأحكام الطريقة"
          source: "المعجم الوسيط"
      expands:
        - text: "القانون شَرِيعَةُ الغَابِ: الخُضُوعُ لِقانونِ القُوَّةِ"
          source: "المعجم الكبير"
    - lemma: "نِظَام"
      confirm:
        - text: "التَّرْتِيب والاتساق وَيُقَال نظام الْأَمر قوامه وعماده والطريقة"
          source: "المعجم الوسيط لمجموعة من المؤلفين"

stage3_analysis:
  per_lemma:
    - lemma: "القانون"
      decision: confirmed
      decision_reason: "اللمة صحيحة دلاليا، لكن يجب تجريدها من أداة التعريف وضبطها بالشكل، لذا سيتم تعديلها إلى 'قَانُون'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَانُون"
    - lemma: "الفقه القانوني"
      decision: removed
      decision_reason: "المصطلح يشير إلى علم وفلسفة القانون أو الاجتهادات القضائية (jurisprudence)، ولا يقصد به مجموعة القواعد الملزمة بحد ذاتها (law)."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "تَشْرِيع"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ دقيق وشائع للتعبير عن القوانين المسنونة والمقرة من السلطة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَشْرِيع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08458195-n"}
    - lemma: "شَرِيعَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي فصيح يدل على مجموعة القواعد والأحكام، ويستخدم لغوياً وقانونياً (مثل شريعة الغاب، الشريعة الإسلامية)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "شَرِيعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08458195-n"}

stage4_content:
  definition:
    current: "مجموعة القواعد التي تفرضها السلطة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعبر عن الفكرة ولكنه يفتقر إلى الدقة المعجمية؛ تمت صياغته بأسلوب أكثر رصانة وشمولاً ليوضح الغاية من تلك القواعد."
    authored:
      - type: terminological
        text: "مجموعة من القواعد والضوابط التي تفرضها السلطة لتنظيم سلوك الأفراد في المجتمع، وتكون ملزمة لهم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08458195-n", definition_index: 0, text: "مجموعة من القواعد والضوابط التي تفرضها السلطة لتنظيم سلوك الأفراد في المجتمع، وتكون ملزمة لهم."}

  examples:
    per_lemma:
      - lemma: "قَانُون"
        examples:
          - text: "يُعَاقِبُ القَانُونُ كُلَّ مَنْ يُخَالِفُ أَنْظِمَةَ المُرُورِ."
            type: usage
      - lemma: "تَشْرِيع"
        examples:
          - text: "صَدَرَ تَشْرِيعٌ جَدِيدٌ لِحِمَايَةِ البِيئَةِ مِنَ التَّلَوُّثِ."
            type: usage
      - lemma: "شَرِيعَة"
        examples:
          - text: "يَحْتَكِمُ المُسْلِمُونَ إِلَى الشَّرِيعَةِ الإِسْلَامِيَّةِ فِي مُعَامَلَاتِهِمْ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-08458195-n", text: "يُعَاقِبُ القَانُونُ كُلَّ مَنْ يُخَالِفُ أَنْظِمَةَ المُرُورِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "صَدَرَ تَشْرِيعٌ جَدِيدٌ لِحِمَايَةِ البِيئَةِ مِنَ التَّلَوُّثِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يَحْتَكِمُ المُسْلِمُونَ إِلَى الشَّرِيعَةِ الإِسْلَامِيَّةِ فِي مُعَامَلَاتِهِمْ."}

