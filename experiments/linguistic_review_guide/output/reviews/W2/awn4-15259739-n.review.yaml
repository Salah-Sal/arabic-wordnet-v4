# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15259739-n
# المفهوم: وحدة زمنية تساوي 15 دقيقة (quarter hour)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي دائري: يستخدم «ربع ساعة» وهي اللمّة ذاتها في متن التعريف"
      - "المجموعة تحتوي على لمّة واحدة فقط (ربع ساعة)، ولا يوجد مرادف مفرد"
    observations: "المفهوم بسيط وواضح ثقافياً — وحدة زمنية شائعة الاستعمال في الحياة اليومية العربية. التعبير «ربع ساعة» تعبير إضافي ثابت مسكوك لا يحتمل إبدال مكوّناته. ربع الساعة مقدار زمني معروف في التراث العربي وفي الاستعمال المعاصر على السواء."
  blind_candidates:
    - lemma: "رُبْعُ سَاعَةٍ"
      generation_method: tarkib
      justification: "مركب إضافي ثابت من «رُبْع» (جزء من أربعة) و«سَاعَة» (وحدة زمنية). هو التعبير العربي الطبيعي الأوّل لهذا المفهوم، مسجّل في المعاجم الحديثة."
    - lemma: "رُبُعٌ"
      generation_method: ishtiqaq
      justification: "اسم من جذر ر ب ع على وزن فُعُل بمعنى الجزء من أربعة أجزاء. يمكن أن يُستعمل مطلقاً بمعنى ربع الساعة في سياقات زمنية واضحة، كما يُقال في الإنجليزية quarter بمعنى quarter hour."
    - lemma: "رُبْعِيَّةٌ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «رُبْع» على وزن فُعْلِيَّة، يمكن أن يدلّ على وحدة مقدارها الربع. لكنه مصطلح مصنوع غير مسكوك."
    - lemma: "مِرْبَاعٌ"
      generation_method: ishtiqaq
      justification: "اسم آلة/وحدة على وزن مِفْعَال من جذر ر ب ع. في التراث يعني ربع المغنم، فالنقل إلى الزمن ممكن نظرياً لكنه غير مستعمل."

stage2_evidence:
  per_lemma:
    - lemma: "رُبْعُ سَاعَةٍ"
      confirm:
        - text: "«رُبع ساعة: خمس عشرة دقيقة.»"
          source: "المورد الحديث (2008)"
        - text: "«(3) رُبع ساعة» — ضمن مدخل quarter"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الرُّبْعُ من الشيء» — الجزء من أربعة أجزاء"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أنّ رُبْع في الأصل جزء من أربعة، فالتركيب مع ساعة شفّاف المعنى"
        - text: "«السِّينُ وَالْوَاوُ وَالْعَيْنُ يَدُلُّ عَلَى اسْتِمْرَارِ الشَّيْءِ وَمُضِيِّهِ. مِنْ ذَلِكَ السَّاعَةُ سُمِّيَتْ بِذَلِكَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يبيّن أصل لفظة ساعة من الاستمرار والمضيّ"
    - lemma: "رُبُعٌ"
      expands:
        - text: "«(1) رُبْع a quarter of an orange ... (3) رُبع ساعة ... (5) فصل؛ ربع سنة ... (6) ربع دولار»"
          source: "المورد الحديث (2008)"
          addition: "الرُّبْع مصطلح عامّ يدلّ على جزء من أربعة في سياقات مختلفة (فاكهة، زمن، مال) — لا يختصّ بربع الساعة"
        - text: "«ربع» — ترجمة quarter في مسرد الرياضيات والفلك"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "مصطلح رياضي عام للكسر ¼"
      contradicts:
        - text: "«الرَّبْعُ: الدارُ بعَيْنِها حيثُ كانت ... والمَحَلَّةُ، والمَنْزِلُ»"
          source: "القاموس المحيط — الفيروزآبادي"
          conflict: "الرَّبْع في المعاجم التراثية يدلّ أولاً على الدار والمحلّة، والدلالة الزمنية المحضة لربع الساعة حديثة"
    - lemma: "رُبْعِيَّةٌ"
      contradicts:
        - text: "«الرُّبعيّة: قطعة أرضٍ مساحتُها رُبع ميل مربّع.»"
          source: "المورد الحديث (2008)"
          conflict: "الرُّبعيّة مصطلح مسكوك لوحدة مساحة لا لوحدة زمنية"
    - lemma: "مِرْبَاعٌ"
      contradicts:
        - text: "«المِرْبَاعُ مِنْ هَذَا، وَهُوَ شَيْءٌ كَانَ يَأْخُذُهُ الرَّئِيسُ، وَهُوَ رُبْعُ الْمَغْنَمِ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المِرْباع في التراث حصراً ربع الغنيمة الذي يأخذه الرئيس — لا علاقة له بالزمن"

stage3_analysis:
  per_lemma:
    - lemma: "رُبْعُ سَاعَةٍ"
      decision: confirmed
      decision_reason: "تعبير إضافي ثابت مسكوك، موثّق في المورد الحديث بتعريف صريح «رُبع ساعة: خمس عشرة دقيقة»، وشائع الاستعمال في الفصحى المعاصرة والتراثية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُبْعُ سَاعَةٍ"
    - lemma: "رُبُعٌ"
      source: stage1
      decision: removed
      decision_reason: "لفظ عامّ يدلّ على الكسر ¼ في أي سياق (فاكهة، مال، مساحة، زمن). لا يختصّ بربع الساعة ولا يمكن أن يحلّ محلّ «ربع ساعة» دون قرينة سياقية. إدراجه يوسّع المجموعة بلا مسوّغ."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "رُبْعِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مسكوك في المعاجم الحديثة بمعنى وحدة مساحة (ربع ميل مربع) لا وحدة زمنية. استعماله لربع الساعة يُوقع في الالتباس."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "مِرْبَاعٌ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح تراثي ثابت الدلالة على ربع الغنيمة في الجاهلية. لا شاهد على استعماله في سياق زمني، ونقله إلى الزمن تكلّف لا مسوّغ له."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

