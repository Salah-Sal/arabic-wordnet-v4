          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
    - lemma: "فضاء الحالة"
      confirm:
        - text: "«طريقة فضاء الحالة، والتي تعمل إلى حدٍّ بعيد في المجال الزمني. يعتمد توصيفُ الأنظمة في فضاء الحالة على تمثيل النموذج الرياضيّ...»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
        - text: "«فضاء الحالة: state space»"
          source: "موسوعة الكهرباء (IEC 60050)"
