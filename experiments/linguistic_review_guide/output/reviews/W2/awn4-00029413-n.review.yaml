stage1_review:
  assessment:
    concerns:
      - اللمّة الحالية "فضاء الطور" تفتقر إلى التشكيل الكامل.
      - غياب مصطلحات مرادفة شائعة في السياق الهندسي والرياضي مثل "فضاء الحالة".
    observations: "المصطلح ينتمي إلى مجال الفيزياء الرياضية والميكانيكا الإحصائية ونظرية النظم. يُعبّر عنه بالإنجليزية بمصطلحين متقاربين هما (Phase space) و(State space)، وكلاهما له مقابلات مستقرة في المعاجم التقنية العربية."
  blind_candidates:
    - lemma: "فَضَاءُ الطَّوْرِ"
      generation_method: tarkib
      justification: "الترجمة الحرفية والمصطلح القياسي لـ (Phase space) في الفيزياء."
    - lemma: "فَضَاءُ الْحَالَةِ"
      generation_method: tarkib
      justification: "المصطلح المقابل لـ (State space)، وهو أعم وأشمل ويُستخدم في دراسة النظم الديناميكية."
    - lemma: "فَرَاغُ الطَّوْرِ"
      generation_method: tarkib
      justification: "تنويع دلالي مقبول باستخدام (فراغ) بدلاً من (فضاء) في بعض الأدبيات الفيزيائية."
    - lemma: "فَضَاءٌ طَوْرِيٌّ"
      generation_method: tarkib
      justification: "صيغة وصفية للمفهوم، وإن كانت أقل شيوعاً كاسم علم للمفهوم."

stage2_evidence:
