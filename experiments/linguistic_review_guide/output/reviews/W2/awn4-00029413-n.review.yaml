stage4_content:
  definition:
    current: "(الفيزياء) فضاء مثالي تمثل فيه الأبعاد الإحداثية المتغيرات المطلوبة لوصف نظام أو مادة"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً ويغطي الجوانب الأساسية للمفهوم (الأبعاد الإحداثية، المتغيرات، وصف النظام)."
  examples:
    per_lemma:
      - lemma: "فَضَاءُ الطَّوْرِ"
        examples:
          - text: "يُمَثَّلُ كُلُّ جُسَيْمٍ فِي النِّظَامِ بِنُقْطَةٍ وَاحِدَةٍ فِي فَضَاءِ الطَّوْرِ السِّدَاسِيِّ الْأَبْعَادِ."
            type: usage
      - lemma: "فَضَاءُ الْحَالَةِ"
        examples:
          - text: "يُسْتَخْدَمُ مَفْهُومُ فَضَاءِ الْحَالَةِ لِتَمْثِيلِ مَجْمُوعَةِ جَمِيعِ الْحَالَاتِ الْمُمْكِنَةِ لِلنِّظَامِ الدِّينَامِيكِيِّ."
            type: usage
      - lemma: "فَرَاغُ الطَّوْرِ"
        examples:
          - text: "تَتَحَرَّكُ النُّقْطَةُ الْمُمَثِّلَةُ لِلنِّظَامِ فِي فَرَاغِ الطَّوْرِ لِتَرْسُمَ مَسَاراً يُعَبِّرُ عَنْ تَطَوُّرِ الْحَالَةِ عَبْرَ الزَّمَنِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُمَثَّلُ كُلُّ جُسَيْمٍ فِي النِّظَامِ بِنُقْطَةٍ وَاحِدَةٍ فِي فَضَاءِ الطَّوْرِ السِّدَاسِيِّ الْأَبْعَادِ."

