      confirm:
        - text: "«جَالِس من (ج ل س) القَاعد.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«حيوان مثبت في قعر البحر مباشرة بدون ساق»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
