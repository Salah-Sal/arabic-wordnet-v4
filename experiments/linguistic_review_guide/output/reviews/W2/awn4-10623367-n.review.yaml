      justification: "مرادف مباشر للمّة 'جالس' ويشيع استخدامه لوصف من هو في وضعية الجلوس."
  knowledge_candidates:
    - lemma: "جليس"
      justification: "صيغة مبالغة أو صفة مشبهة تدل على من يكثر الجلوس أو من يجلس مع غيره (مجالسة)، وتستخدم في سياقات معينة مثل 'جليس الأطفال' (baby-sitter)."
  generation_notes: "تم التركيز على المترادفات العامة التي تغطي مفهوم وضعية الجلوس للكائن الحي."

