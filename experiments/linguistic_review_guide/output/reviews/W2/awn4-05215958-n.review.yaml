      decision_reason: >
        اللمّة موثّقة في المعجم الموحد لمصطلحات اللسانيات (2002) بتعريف يتطابق مع
        المجموعة، وهي الصيغة المتداولة في الأدبيات الفلسفية واللسانية العربية للتعبير
        عن مفهوم «analyticity». تحتاج فقط إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      borrowing_check:
        loan_type: native
        calque_check: لا، المصطلح مشتق من جذر عربي أصيل (حلل)
      morphological_fit: >
        الوزن: مصدر صناعي من النسبة (تَفْعِيلِيَّة). مناسب تماماً للتعبير عن
        الخواص المجردة في المصطلحية الفلسفية العربية.
      quality_gate:
        ittiraad: "مطّرد — النمط منتج في العربية المعاصرة"
        yusr: "سهل التداول، مألوف في النصوص الأكاديمية"
        mulaaama: "ملائم تماماً للمفهوم"
        turaathi: "مشتق من جذر تراثي (حلل)"
        arabiyy: "عربي خالص"
        ishtiqaaqiyya: "عالية — قابل للتصريف والاشتقاق"
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ لا منافس لها. تُعبّر عن خاصية الحكم/القضية
        في كونها مكتفية بمعاني مصطلحاتها الداخلية للتحقّق من صدقها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْلِيلِيَّة"

    - lemma: "التَّضمُّنِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا مادة معجمية تدعم هذه اللمّة، ومفهوم التضمّن (entailment/implication) مصطلح
        دلالي-منطقي مستقل مختلف عن التحليلية. قبول هذا المرشح يُوجد خلطاً بين
        مفهومَيْن فلسفيَّيْن متمايزَيْن.
      evidence_assessment:
        case: no_material

    - lemma: "الاِسْتِنبَاطِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا مادة معجمية. «الاستنباطية» مرادفة لـ«الاستنتاجية» (deductivity) وهي
        خاصية أعمّ تشمل التحليلية وغيرها. إدراجها هنا يُلقي تداخلاً دلالياً غير
        مبرّر.
      evidence_assessment:
        case: no_material

    - lemma: "الإِبَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا مادة معجمية، والمجاز الدلالي المقترح بعيد. «الإبانة» تدل على الوضوح
        والبيان لا على الخاصية المنطقية للتحليل الكانطي. قبولها يُدخل دلالةً غير
        دقيقة على المفهوم.
      evidence_assessment:
        case: no_material


