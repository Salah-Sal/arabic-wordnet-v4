# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'تحليلية' مكتوبة بلا تشكيل كامل"
      - "التعريف الحالي دائري: يستعمل 'تحليلياً' لتعريف 'تحليلية' دون إضافة معلومة جديدة"
      - "المجموعة تفتقر إلى أي شاهد توثيقي أو مثال استعمالي"
    observations: >
      المجموعة تُمثّل مفهوماً فلسفياً دقيقاً هو «التحليلية» (analyticity) الذي يُشير
      إلى الخاصية المميِّزة للحكم الذي تنبثق حقيقته من معاني مصطلحاته وحدها دون
      حاجة إلى تجربة خارجية — وهو المقابل الفلسفي لـ«التأليفية» (syntheticity) في
      تقسيم كانط للأحكام. اللمّة الوحيدة الموجودة «تحليلية» مشتقة من جذر ح-ل-ل
      وهي الصيغة الأكثر دوراناً في الأدبيات الفلسفية واللسانية العربية الحديثة.
      المجموعة صغيرة وتحتاج إلى تشكيل وتعريف غير دائري.
  blind_candidates:
    - lemma: "التَّحلِيلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مباشر من الصفة «تحليلي» بإضافة ياء النسبة والتاء المربوطة للتجريد،
        على النمط المنتج: تحليلي → تحليلية → التحليلية. يدل بدقة على الخاصية المجردة
        لكون الشيء تحليلياً، وهو النمط ذاته المستعمل في المقابلات العربية للمصطلحات
        الفلسفية: التجريبية، التركيبية، الاستقرائية.
    - lemma: "التَّضمُّنِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «تضمّن» على وزن المصدر الصناعي، يُلمح إلى أن الحكم التحليلي
        يتضمن محموله في مفهوم موضوعه تضمناً منطقياً لازماً. وصف دقيق للآلية الداخلية
        للمفهوم، ومشتق من جذر ض-م-ن العريق في الدلالة على الاحتواء.
    - lemma: "الاِسْتِنبَاطِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «استنباط»، يُشير إلى أن الحكم التحليلي قائم على استنباط الحقيقة
        من داخل المفهوم نفسه دون الاستعانة بخبرة خارجية. يستلهم المنهج الاشتقاقي على
        وزن الاستفعالية المعهود في المصطلحية الفلسفية.
    - lemma: "الإِبَانِيَّة"
      generation_method: majaz
      justification: >
        إحياء دلالي لـ«أبان» بمعنى أوضح وكشف، بتحميله دلالة الخاصية التي يُبيّن فيها
        الحكمُ ما هو مضمون في المفهوم ذاته — إذ الحكم التحليلي «يُبين» لا يُضيف. اللفظ
        قديم والتضمين مجازي واضح: ما أبانه الحكم كامن في المفهوم سلفاً.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية: تحليلية + التحليلية + تضمنية + استنباطية + ايضاحية
#   Q2 — جسر إنجليزي: analyticity + analytic + analytical + analyticism
#   Q3 — بحث FTS عربي: تحليل، تحليلي، تحليلية، خاصية
#   Q4 — مقاييس اللغة (dict 151): جذر حلل/حل
stage2_evidence:
  per_lemma:
    - lemma: "تحليلية"
      confirm:
        - text: >
            «مصطلح يُطلق على حُكم تعبير جازم وحقيقي ودائم من حيث مضمونه، لا في
            علاقته بالأحداث وتحديد الوحدات الدنيا، لهذا يتحدد دائماً في التفكيك.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)، ترجمة: analytic"
      expands:
        - text: >
            «يُعدّ الحُكْمُ التحليلي حكماً سيميائياً لأن ما كان تركيبياً يتحول إلى
            تحليلي طبقاً لعرف عام. لأن التحليلي عملية تفكيك مكونات نص إلى عناصره
            الأولية.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: حكم تحليلي"
          addition: >
            يربط الدليلُ «التحليلية» بمبدأ التفكيك السيميائي، مما يوسّع المعنى
            ليشمل الطابع الإجرائي لعملية التحليل لا الطابع المنطقي-الكانطي فحسب.
        - text: >
            «سمة تمتاز بها اللغات العازلة. ضد: تأليفي.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: تحليلي"
          addition: >
            يُشير إلى استعمال اللسانيين للمصطلح في سياق تصنيف اللغات (اللغات
            التحليلية مقابل اللغات التأليفية/الاصطناعية)، وهو سياق مختلف عن
            السياق الفلسفي لهذه المجموعة.

    - lemma: "التَّضمُّنِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الاِسْتِنبَاطِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الإِبَانِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
