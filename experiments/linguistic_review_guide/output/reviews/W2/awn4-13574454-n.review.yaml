stage1_review:
  candidates:
    - lemma: اسْتِطَارَة
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (طير)، وهي المصطلح الفيزيائي الدقيق المقابل لـ (Scattering) في المعاجم العلمية."
    - lemma: تَشَتُّت
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (شت)، وتدل على التفرق، وهي شائعة الاستخدام في السياقات العلمية."
    - lemma: تَنَاثُر
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (نثر)، وتدل على تفرق الجسيمات أو الأشياء وانتشارها."
    - lemma: تَبَعْثُر
      generation_method: ishtiqaq
      justification: "مشتقة من (بعثر)، وتدل على الانتشار العشوائي غير المنتظم."
  concerns:
    - "استخدام (بعثرة) غير دقيق في السياق الفيزيائي، فهي تميل إلى وصف التفرق العشوائي المادي للأشياء (كالأوراق) وليس للجسيمات الدقيقة في الفيزياء."
    - "غياب المصطلح العلمي الدقيق (استطارة) المعتمد في مجامع اللغة والمعاجم الفيزيائية المتخصصة."
  observations:
    - "المجموعة الترادفية تعبر عن مفهوم فيزيائي محدد (Scattering). (تشتت) مصطلح صحيح ومستخدم بكثرة، بينما (استطارة) هو المصطلح التخصصي الأدق."

stage2_evidence:
  - lemma: استطارة
    evidence_texts:
      - text: "الاستطارة (فز)"
        source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
      - text: "استطارة الضوء (scattering of light)"
        source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
    evidence_status: confirms
  - lemma: تشتت
    evidence_texts:
      - text: "تشتت الضوء (light scattering)"
        source: "مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم"
      - text: "تشتت (dispersion/ scattering)"
        source: "مسرد الهندسة الكهربائية"
    evidence_status: confirms
  - lemma: بعثرة
    evidence_texts:
      - text: "(1) بَعْثَرة؛ تَبَعْثر (2) عددٌ قليل متناثر هنا وهناك a scattering of visitors (3) الاستطارة (فز)"
        source: "معجم المصطلحات (ArabTerm)"
    evidence_status: contradicts
    conflict: "يُظهر المعجم أن كلمة (بعثرة) هي ترجمة عامة، بينما خُصصت (الاستطارة) للمعنى الفيزيائي المتخصص (فز)."

