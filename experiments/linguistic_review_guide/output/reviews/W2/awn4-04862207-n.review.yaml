# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الثانية (قدسية) تحمل دلالة القداسة والطهارة المستمدة من الجذر قدس، وهي أقرب إلى synset 'holiness/sanctity' منها إلى 'divinity'؛ وجودها في هذه المجموعة يُوسّع المعنى بصورة غير دقيقة"
      - "كلتا اللمتين الموجودتين بدون تشكيل كامل، مما يُخلّ بمعيار الضبط الإملائي"
      - "التعريف الحالي 'صفة كون الشيء إلهياً' دائريٌّ نسبياً إذ يستخدم مشتقاً من الجذر ذاته (إلهياً)، ولا يُحدّد الفصل النوعي المميّز لمفهوم الألوهية عن مفاهيم مجاورة كالربوبية والقداسة"
    observations: "المجموعة الترادفية تعبّر عن مفهوم الألوهية (divinity) بوصفه صفةً مجردةً تنتسب إلى الإله أو إلى ما يُعدّ إلهياً، وهو مفهوم راسخ في التراث الكلامي الإسلامي والفلسفي العربي. 'ألوهية' مصطلح كلامي فقهي متداول بكثرة، جذره أله المرتبط بالتعبد والعبودية. أما 'قدسية' فجذرها قدس يدل على الطهر والتنزيه، وهي وإن تداخلت مع الألوهية في السياق الديني فإنها تعبّر تحديداً عن 'القداسة/الطهارة' لا عن 'الإلهية' بمعنى الطبيعة الإلهية الخاصة بالذات الإلهية."

  blind_candidates:
    - lemma: "إِلَهِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (إله) على وزن فِعَلِيَّة، يدل على الانتساب إلى الإله واستجماع صفاته؛ وهو المرادف الصرفي المباشر لـ'ألوهية' من الجذر ذاته (أله)، موثّق في معاجم علم الكلام"
    - lemma: "رَبَّانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (رباني) المنسوب إلى الرب، يُعبّر عن صفة الانتساب إلى الربوبية؛ صيغة فصيحة أجازها مجمع اللغة المصري وورد في القرآن ما يشهد لصيغتها (رهبانية)"
    - lemma: "لَاهُوتِيَّة"
      generation_method: majaz
      justification: "مصدر صناعي من (لاهوت) وهو اللفظ المعرَّب الدال على الطبيعة الإلهية في التراث المسيحي-العربي ثم استعاره الصوفية والمتكلمون؛ وقد نصّت المعاجم على أن اللاهوت = الألوهية"
    - lemma: "قُدُوسِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (قدّوس) وهو اسم من أسماء الله الحسنى دال على التنزيه المطلق والتقديس؛ يُعبّر عن الجانب الإلهي المتعلق بالقداسة المطلقة والتنزّه عن الأنداد"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "أُلُوهِيَّة"
      confirm:
        - text: "«صفة الإله»"
          source: "المعجم الكبير لمجمع اللغة العربية (entry_id=36944)"
        - text: "«ألوهية» — translation_en: divinity — domain: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم ALECSO (entry_id=489539)"
        - text: "«الألوهية:[في الانكليزية] Divinity، deism... هي عند الصوفية اسم مرتبة جامعة لمراتب الأسماء والصفات كلها»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry_id=818705)"
        - text: "«(1) اللاهوت (2) الألوهيّة (3) cap. عد: الله» — translation_en: divinity"
          source: "المورد الحديث (2008) (entry_id=684186)"
      expands:
        - text: "«وقيل إنه مشتق من أله إلهةً وألوهيةً وألوهةً بمعنى عَبَدَ»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry_id=818705)"
          addition: "يُثبت أن 'ألوهية' مصدر قياسي من الفعل أله بمعنى عَبَدَ، مما يُرسّخ دلالتها على صفة المعبودية الإلهية ويُميّزها عن القداسة"

    - lemma: "قُدُسِيَّة"
      contradicts:
        - text: "«قُدُسيّة: من (ق د س) مؤنث قُدْسيّ نسبة إلى قُدُس»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry_id=938956)"
          conflict: "المصدر يُدرج قدسية بوصفها اسم علم مؤنثاً منسوباً إلى قُدُس (المدينة)، لا مصطلحاً مجرداً للطبيعة الإلهية"
        - text: "«القداسة: الطُّهْرُ والبركة»"
          source: "المعجم الوسيط (entry_id=22736)"
          conflict: "الجذر قدس يدل على الطهر والتنزيه لا على الطبيعة الإلهية الذاتية؛ فالمفهوم أقرب إلى holiness/sanctity منه إلى divinity"
      expands:
        - text: "«الْقَافُ وَالدَّالُ وَالسِّينُ أَصْلٌ صَحِيحٌ، وَأَظُنُّهُ مِنَ الْكَلَامِ الشَّرْعِيِّ الْإِسْلَامِيِّ، وَهُوَ يَدُلُّ عَلَى الطُّهْرِ. وَمِنْ ذَلِكَ الْأَرْضُ الْمُقَدَّسَةُ هِيَ الْمُطَهَّرَةُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أن الجذر قدس يدل أصلاً على الطهر والتنزيه، وهو مفهوم مجاور للألوهية لا مرادف لها"

    - lemma: "إِلَهِيَّة"
      confirm:
        - text: "«الإلهية: الألوهية»"
          source: "المعجم الكبير لمجمع اللغة العربية (entry_id=36935)"
        - text: "«الإلهية: أحدية جمع جميع الحقائق الوجودية»"
          source: "التوقيف على مهمات التعاريف للمناوي (entry_id=812903)"
        - text: "«الإلهية: أحدية جمع جميع الحقائق الوجودية»"
          source: "كتاب التعريفات للشريف الجرجاني (entry_id=794484)"
      expands:
        - text: "«الإلهية أحدية جمع جميع الحقائق الوجودية، كما أن آدم أحدية جمع جميع الصور البشرية»"
          source: "كتاب التعريفات للشريف الجرجاني (entry_id=794484)"
          addition: "الاستخدام الفلسفي-العرفاني يُظهر أن إلهية تُستخدم في السياقات الكلامية الصوفية بمعنى الجامعية الإلهية، وهو أشد تجريداً من الاستخدام الشائع لـ'ألوهية'"

    - lemma: "رَبَّانِيَّة"
      contradicts:
        - text: "«رَبَّانِيَّة مذهب أخذ به بعض الناس قديمًا... المعنى: حسن عبادة الرب... الصواب والرتبة: فصيحة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (entry_id=853049)"
          conflict: "ربانية تعني النسبة إلى الرب من حيث التقوى وحسن العبادة، لا صفة الإلهية الذاتية؛ دلالتها أقرب إلى godliness/piety منها إلى divinity"

    - lemma: "لَاهُوتِيَّة"
      confirm:
        - text: "«اللاهوت: الألوهية كَمَا يُقَال الناسوت لطبيعة الْإِنْسَان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry_id=881098)"
        - text: "«اللَّاهُوتُ: الأُلوهية، كما يقال: الناسوت: لطبيعة الإنسان»"
          source: "المعجم الوسيط (entry_id=26547)"
      contradicts:
        - text: "«اللاهوت: الطبيعة الإلهية (فريتاج). علم اللاهوت: la théologie»"
          source: "تكملة المعاجم العربية لرينهارت دوزي (entry_id=841921)"
          conflict: "المُثبَّت في المعاجم هو لاهوت بوصفه اسماً مفرداً، أما لاهوتية كمصدر صناعي مستقل فغير موثّق كوحدة مسكوكة في المعاجم المعتمدة"

    - lemma: "قُدُوسِيَّة"
      evidence_status: "no_material_found"


