stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "المصطلح 'صعود العذراء' قد يختلط بمصطلح 'صعود المسيح' (Ascension) في بعض السياقات اللاهوتية الدقيقة، حيث يفضل الكاثوليك والأرثوذكس مصطلح 'الانتقال' (Assumption/Dormition) لتمييزه عن صعود المسيح بقوته الذاتية."
    observations: "المصطلحات دقيقة وتعبر عن المفهوم اللاهوتي المسيحي المقصود. التعريف العربي الحالي جيد ولكنه يحتاج صياغة أكثر معجمية."
  blind_candidates:
    - lemma: "انْتِقَالُ العَذْرَاءِ"
      generation_method: tarkib
      justification: "المصطلح الرسمي والأكثر شيوعاً في الليتورجيا العربية للتعبير عن صعود مريم العذراء بالنفس والجسد."
    - lemma: "صُعُودُ العَذْرَاءِ"
      generation_method: tarkib
      justification: "مرادف شائع الاستخدام للتعبير عن رفع العذراء إلى السماء."
    - lemma: "رُقَادُ السَّيِّدَةِ"
      generation_method: majaz
      justification: "مصطلح كنسي (شرقي غالباً) يشير إلى الموت الطبيعي للعذراء (Dormition) الذي يسبق انتقالها، ويُستخدم أحياناً للإشارة إلى العيد نفسه."
    - lemma: "رَفْعُ العَذْرَاءِ"
      generation_method: ishtiqaq
      justification: "ترجمة حرفية دقيقة لمفهوم (Assumption) أي أخذها أو رفعها من قبل قوة إلهية."

stage2_evidence:
  per_lemma:
    - lemma: "انتقال العذراء"
      confirm:
        - text: "«عيد انتقال العذراء (15 أغسطس)»"
          source: "المورد الحديث"
    - lemma: "صعود العذراء"
      confirm:
        - text: "«عيد الارتفاع: عيد الصعود (السُلاق) من أعياد النصارى»"
          source: "تكملة المعاجم العربية لـ رينهارت دوزي (باعتبار الصعود والارتفاع من مفاهيم الرفع السماوي)"
    - lemma: "انتقال"
      confirm:
        - text: "«الانتقال: [في الانكليزية] transfer ... وفي علم الكلام عبارة عن حصول الشيء في حيز بعد أن كان في حيز آخر.»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
    - lemma: "صعود"
      confirm:
        - text: "«صعود: [في الانكليزية] ascensus»"
          source: "المعجم الطبي الموحد (بمعنى الارتفاع العام)"

stage3_analysis:
  per_lemma:
    - lemma: "انتقال العذراء"
      decision: confirmed
      decision_reason: "المصطلح اللاهوتي الأدق والأكثر شيوعاً في المراجع العربية لهذا المعتقد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْتِقَالُ العَذْرَاءِ"

    - lemma: "صعود العذراء"
      decision: confirmed
      decision_reason: "مرادف مستخدم بكثرة، وإن كان 'انتقال' هو الأفضل لاهوتياً للتمييز عن صعود المسيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صُعُودُ العَذْرَاءِ"

stage4_content:
  definition:
    current: "(في المسيحية) صعود جسد وروح العذراء مريم عندما انتهت حياتها الأرضية"
    assessment:
      decision: revise
      reason: "لتحسين الصياغة وجعلها أكثر استيعاباً للمفهوم اللاهوتي بأسلوب معجمي رصين."
    authored:
      - type: terminological
        text: "انتقال جسد مريم العذراء وروحها إلى السماء عند نهاية حياتها الأرضية، وهو معتقد وعيد ديني في المسيحية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "انتقال جسد مريم العذراء وروحها إلى السماء عند نهاية حياتها الأرضية، وهو معتقد وعيد ديني في المسيحية."

  examples:
    per_lemma:
      - lemma: "انْتِقَالُ العَذْرَاءِ"
        examples:
          - text: "يحتفل المسيحيون في الخامس عشر من آب بعيد انتقال العذراء."
            type: usage
      - lemma: "صُعُودُ العَذْرَاءِ"
        examples:
          - text: "تُظهر الأيقونات التقليدية مشهد صعود العذراء محفوفة بالملائكة والقديسين."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يحتفل المسيحيون في الخامس عشر من آب بعيد انتقال العذراء."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُظهر الأيقونات التقليدية مشهد صعود العذراء محفوفة بالملائكة والقديسين."

