stage1_review:
  assessment:
    concerns:
      - "كلمة 'حزن' عامة جداً للمجموعة التي تهدف إلى 'الحزن المفرط' أو 'التجهم' (Gloominess)."
      - "نقص المصطلحات التي تعبر عن 'الحزن المكتوم' أو 'الكآبة العميقة' (Lugubriousness)."
    observations: "المجموعة تغطي حالة من الحزن تتجاوز الشعور العادي إلى حالة دائمة من الكآبة أو التجهم الظاهر على الوجه (Gloominess)."
  blind_candidates:
    - lemma: "كَمَد"
      generation_method: ishtiqaq
      justification: "يعبر عن أشد الحزن أو الحزن المكتوم الذي يغير لون الوجه، وهو أدق مرادف لـ Lugubriousness."
    - lemma: "انْقِباض"
      generation_method: ishtiqaq
      justification: "يعبر عن حالة نفسية من ضيق الصدر والنفور من التبسط، وهو مرادف لـ Gloominess."
    - lemma: "شَجَن"
      generation_method: ishtiqaq
      justification: "يعبر عن الحزن العميق والهم المتصل، وجمعه 'أشجان' شائع في هذا السياق."
    - lemma: "اكْفِهرار"
      generation_method: ishtiqaq
      justification: "يعبر عن تجهم الوجه وإظلامه، وهو مرادف قوي لـ Gloominess."

stage2_evidence:
  per_lemma:
    - lemma: "اكتئاب"
      confirm:
        - text: "«الْكَافُ وَالْهَمْزَةُ وَالْبَاءُ كَلِمَةٌ تَدُلُّ عَلَى انْكِسَارٍ وَسُوءِ حَالٍ. مِنْ ذَلِكَ الْكَآبَةُ.»"
          source: "مقاييس اللغة"
    - lemma: "تجهم"
      confirm:
        - text: "«تَجَهَّمْتُ له، أي: استقبلتَه بوجهٍ كريهٍ.»"
          source: "كتاب العين"
        - text: "«رجل جهم الوجِه، أي: غليظه، وفيه جُهُومة، أي: غلظ.»"
          source: "كتاب العين"
    - lemma: "حزن"
      confirm:
        - text: "«الحُزْنُ: بالضم، الغم الحاصل لوقوع مكروه أو فوات محبوب في الماضي ويضاده الفرح.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "كَمَد"
      confirm:
        - text: "«الكَمَدُ: الحزن المكتوم. وفي المحكم: هو أشدُّ الحُزْنِ.»"
          source: "تاج العروس"
        - text: "«الكَمَدُ: هَم وحُزْنٌ لا يُسْتَطاعُ إمْضاؤه.»"
          source: "المحيط في اللغة"
    - lemma: "انْقِباض"
      confirm:
        - text: "«الانقباض: جمع الأطراف ويستعمل في ترك التبسط.»"
          source: "التوقيف على مهمات التعاريف"
      expands:
        - text: "«انْقَبَضَ عَنِ الْأَمْرِ وَتَقَبَّضَ، إِذَا اشْمَأَزَّ.»"
          source: "مقاييس اللغة"
    - lemma: "شَجَن"
      confirm:
        - text: "«الشَّجَنُ: الهَمُّ، والحَزَنُ، وجمعه: شُجونٌ وأشْجانٌ.»"
          source: "القاموس المحيط"

