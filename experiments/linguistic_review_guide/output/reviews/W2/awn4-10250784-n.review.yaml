step0_evidence:
  per_lemma:
    - lemma: "سفاح"
      confirm:
        - text: "«(السفاح) من يكثر سفك الدِّمَاء وَمِنْه لقب الْخَلِيفَة العباسي الأول»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«الزِّنَا والفجورُ؛ وسُمِّى الزِّنَا سِفاحًا لأنه كان على غيرِ عَقدٍ, كأنه بمنزلةِ الماء المسفوحِ الذى لا يَحْبِسه شىءٌ»"
          source: "المعجم الكبير"
          addition: "استخدام اللفظة للدلالة على الزنا والعلاقات غير الشرعية"
      peripheral_observations:
        - "تُطلق كلمة (السفاح) أيضاً على الرجل المعطاء الفصيح، أو علماً لشخصيات تاريخية."
    - lemma: "قاتل"
      confirm:
        - text: "«القتل: فعل يقطع علاقة الروح بالجسد وقطعُها بالموت بفعل المتولِّي لذلك وهو القاتلُ»"
          source: "التعريفات الفقهيّة للبركتي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "فاتك"
      source_section: "step5_english_bridge"
      evidence_citation: "«الفَتْكُ: البطش أو القتل على غفلة» — التوقيف على مهمات التعاريف للمناوي"
      justification: "ظهرت الكلمة كترجمة لـ killer في المصطلحات الطبية (مثل خلايا فاتكة - killer cells)، كما أن الفتك يدل لغوياً على القتل والاغتيال بغتة، وهو معنى أخص وأدق من القتل العام."
  knowledge_candidates:
    - lemma: "ذباح"
      justification: "صيغة مبالغة (فعَّال) من الفعل (ذبح). تدل على من يكثر الذبح أو القتل، وتُقابل الكلمة الإنجليزية (slayer). توليد بالاشتقاق من جذر (ذ-ب-ح)."
  generation_notes: "صيغ المبالغة على وزن (فعّال) واسم الفاعل (فاعل) من الجذور الدالة على إزهاق الروح هي الأنسب لهذا المفهوم."

step1_lemma_validation:
  per_lemma:
    - lemma: "سفاح"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر في الاستعمال للإشارة إلى القاتل الذي يكثر سفك الدماء (serial killer)."
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص بمن يكثر القتل وسفك الدماء بوحشية أو بشكل متسلسل (Serial killer)، ولا تطلق على من قتل لمرة واحدة."
      example: "ألقت الشرطة القبض على السفاح الذي أرعب المدينة بجرائمه المتسلسلة."
    - lemma: "قاتل"
      decision: confirmed
      decision_reason: "اللفظ العام والشامل الدال على الفاعل الذي يزهق روحاً."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام والشامل لكل من أزهق روحاً (إنساناً أو حيواناً) سواء أكان القتل عمداً أم خطأً، ولمرة واحدة أو أكثر."
      example: "اعترف القاتل بارتكاب الجريمة أمام هيئة المحكمة."
    - lemma: "فاتك"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح دال على القاتل على غفلة أو المدمّر للروح، ويصلح للاستخدام مع البشر والكائنات المجهرية كمرادف لـ killer."
      step05_citation: "«الفَتْكُ: البطش أو القتل على غفلة» — التوقيف على مهمات التعاريف للمناوي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على القاتل الذي يغتال ضحيته بغتة وعلى غفلة، وتستخدم بكثرة لوصف الأمراض أو الخلايا القاتلة أو من يبطش بشدة."
      example: "كان المرض الفاتك سبباً في هلاك الكثيرين في العصور القديمة."
      actions:
        - command: create_entry
          params:
            lemma: "فاتك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10250784-n"
    - lemma: "ذباح"
      source: step05
      decision: removed
      decision_reason: "على الرغم من صحتها اللغوية، إلا أنها ترتبط في الاستعمال الشائع أكثر بذبح الحيوانات للاستهلاك وليس القتل الإجرامي العام الذي يمثله المفهوم."
      step05_citation: "اقتراح مبني على المعرفة الصرفية"
  added_lemmas:
    - lemma: "فاتك"
      reason: "مرشح من الخطوة ٠٫٥"
      via_command: create_entry + add_sense
  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "شخص يتسبب في موت إنسان أو حيوان"
  assessment:
    decision: revise
    reason: "التعريف الحالي يعتمد على الترجمة الحرفية، واستخدام 'شخص' يقيد المفهوم بينما القاتل أو الفاتك قد يكون داءً أو حيواناً. لفظ 'إزهاق الروح' أكثر فصاحة من 'يتسبب في موت'."
  authored_definitions:
    - type: terminological
      text: "مَنْ يُزْهِقُ روح إنسان أو حيوان عمداً أو خطأً."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-10250784-n"
        definition_index: 0
        text: "مَنْ يُزْهِقُ روح إنسان أو حيوان عمداً أو خطأً."

