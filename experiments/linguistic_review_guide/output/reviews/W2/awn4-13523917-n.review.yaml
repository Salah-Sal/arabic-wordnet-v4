stage1_review:
  assessment:
    concerns:
      - "المفهوم علمي متخصص، ويعتمد بالأساس على مصطلح معرّب ومستقر في المعاجم العربية وهو (أيوني)."
    observations: "اللمة الموجودة (تبادل أيوني) دقيقة وتتوافق مع الاستخدام الشائع في مجالات الكيمياء والهندسة لمعالجة المياه وغيرها. يمكن صياغة مرادفات بديلة اعتماداً على الجذر (شرد) المستخدم في بعض المناهج كبديل لـ (أيون)، مثل (شاردي)."
  blind_candidates:
    - lemma: "اِسْتِبْدَالٌ أَيُونِيّ"
      generation_method: ishtiqaq
      justification: "استخدام صيغة الاستفعال للدلالة على الإحلال والتبديل بدلاً من التفاعل المتبادل."
    - lemma: "تَبَادُلٌ شَارِدِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعتمد على مصطلح (شاردة) كمرادف عربي لـ (أيون)."
    - lemma: "مُبَادَلَةُ الشَّوَارِدِ"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر عن عملية مبادلة الأيونات باستخدام الجمع (شوارد)."
    - lemma: "مُبَادَلَةٌ أَيُونِيَّة"
      generation_method: tarkib
      justification: "استخدام المصدر (مبادلة) بدلاً من (تبادل) للدلالة على إيقاع الفعل."

stage2_evidence:
  per_lemma:
    - lemma: "تبادل أيوني"
      confirm:
        - text: "«عملية كيميائية تتضمن تبادل عكوس للأيونات بين سائل وجسم صلب»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«إحدى طُرق مُعالجة المياه يُمكن بواسطتها أن تحُلّ أيونات ذات نفس الشحن (موجبة أو سالبة) محلّ الأيونات المُذابة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "اِسْتِبْدَالٌ أَيُونِيّ"
      evidence_status: "no_material_found"
    - lemma: "تَبَادُلٌ شَارِدِيّ"
      contradicts:
        - text: "«عملية التبادل الأيوني هي تواجد الأنيونات في المحلول و تتبادل مع الأنيونات الأخرى المحدده إلى راتنج التبادل الأيوني.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "خُصصت في بعض المعاجم لترجمة (anion exchange) وهو نوع فرعي، وليس للعملية العامة للتبادل الأيوني."
    - lemma: "مُبَادَلَةُ الشَّوَارِدِ"
      evidence_status: "no_material_found"
    - lemma: "مُبَادَلَةٌ أَيُونِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تبادل أيوني"
      decision: confirmed
      decision_reason: "مصطلح علمي دقيق وشائع، تؤكده المعاجم المتخصصة في مجالات الهندسة والفيزياء والمياه، وهو الترجمة المعتمدة لـ (ion exchange)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance: "المصطلح العلمي القياسي المعتمد في معظم المعاجم والدول العربية لوصف هذه العملية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبَادُلٌ أَيُونِيّ"
    - lemma: "اِسْتِبْدَالٌ أَيُونِيّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير شائع معجمياً، و(تبادل) أدق لوصف العملية العكوسة."
    - lemma: "تَبَادُلٌ شَارِدِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم كونه مصطلحاً مستخدماً في بعض المناهج، إلا أن المعاجم المتخصصة تورد (تبادل أيوني) كالمصطلح القياسي الأعم. كما أن بعض المعاجم خصصته للتبادل الأنيوني."
    - lemma: "مُبَادَلَةُ الشَّوَارِدِ"
      source: stage1
      decision: removed
      decision_reason: "لم يثبت استعماله كمركب مصطلحي معتمد."
    - lemma: "مُبَادَلَةٌ أَيُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: "صيغة (تبادل) هي الشائعة والمثبتة معجمياً بدلاً من (مبادلة)."

stage4_content:
  definition:
    current: "عملية يتم فيها تبادل الأيونات بين محلول ومادة صلبة غير قابلة للذوبان (عادة ما تكون راتنجية)؛ تستخدم على نطاق واسع في المعالجة الصناعية"
    assessment:
      decision: revise
      reason: "تنسيق التعريف لجعله مصطلحياً دقيقاً ومضبوطاً بالشكل."
    authored:
      - type: terminological
        text: "عَمَلِيَّةٌ كِيمْيَائِيَّةٌ يَتِمُّ فِيهَا تَبَادُلُ الْأَيُونَاتِ بَيْنَ سَائِلٍ وَمَادَّةٍ صُلْبَةٍ غَيْرِ قَابِلَةٍ لِلذَّوَبَانِ، وَغَالِبًا مَا تَكُونُ مَادَّةً رَاتِنْجِيَّةً، وَتُسْتَخْدَمُ عَلَى نِطَاقٍ وَاسِعٍ فِي الْمُعَالَجَاتِ الصِّنَاعِيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13523917-n"
          definition_index: 0
          text: "عَمَلِيَّةٌ كِيمْيَائِيَّةٌ يَتِمُّ فِيهَا تَبَادُلُ الْأَيُونَاتِ بَيْنَ سَائِلٍ وَمَادَّةٍ صُلْبَةٍ غَيْرِ قَابِلَةٍ لِلذَّوَبَانِ، وَغَالِبًا مَا تَكُونُ مَادَّةً رَاتِنْجِيَّةً، وَتُسْتَخْدَمُ عَلَى نِطَاقٍ وَاسِعٍ فِي الْمُعَالَجَاتِ الصِّنَاعِيَّةِ."
  examples:
    per_lemma:
      - lemma: "تبادل أيوني"
        examples:
          - text: "تُعَدُّ عَمَلِيَّةُ التَّبَادُلِ الْأَيُونِيِّ طَرِيقَةً فَعَّالَةً لِمُعَالَجَةِ الْمِيَاهِ وَتَنْقِيَتِهَا مِنَ الشَّوَائِبِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-13523917-n"
          text: "تُعَدُّ عَمَلِيَّةُ التَّبَادُلِ الْأَيُونِيِّ طَرِيقَةً فَعَّالَةً لِمُعَالَجَةِ الْمِيَاهِ وَتَنْقِيَتِهَا مِنَ الشَّوَائِبِ."

