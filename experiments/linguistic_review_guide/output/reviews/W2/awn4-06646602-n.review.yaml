# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06646602-n (refusal)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (رَفْض)، ممّا يجعلها فقيرة ترادفياً"
      - "اللمّة الموجودة غير مشكّلة بالكامل في بعض السياقات، تحتاج تأكيد التشكيل"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزية، يحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المفهوم واضح في العربية: هو الإبلاغ عن عدم قبول شيء مَعروض. الجذر ر-ف-ض أصله الترك كما في مقاييس اللغة، واستقرّ في الاستعمال المعاصر بمعنى عدم القبول. المجموعة تقع تحت فوقيّ (رسالة/مضمون)، فالمطلوب لفظ يدلّ على الفعل التواصلي لا مجرد الحالة النفسية."
  blind_candidates:
    - lemma: "رَدّ"
      generation_method: ishtiqaq
      justification: "مصدر رَدَّ يَرُدُّ من الجذر ر-د-د، يُستعمل بمعنى إرجاع الشيء وعدم قبوله، ويُطلق على الجواب السلبي: رَدُّ الطَّلَب"
    - lemma: "إِبَاء"
      generation_method: ishtiqaq
      justification: "مصدر أَبَى يَأْبَى من الجذر أ-ب-ي، يدلّ على الأنَفة والامتناع عن قبول الشيء"
    - lemma: "صَدّ"
      generation_method: ishtiqaq
      justification: "مصدر صَدَّ يَصُدُّ من الجذر ص-د-د، يدلّ على المنع والإعراض عن الشيء"
    - lemma: "اعْتِذَار"
      generation_method: ishtiqaq
      justification: "مصدر اعتذر يعتذر من الجذر ع-ذ-ر على وزن افتعال، يُستعمل للتعبير عن عدم القبول بصيغة مهذّبة"

stage2_evidence:
  per_lemma:
    - lemma: "رَفْض"
      confirm:
        - text: "«(رَفَضَ) الرَّاءُ وَالْفَاءُ وَالضَّادُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّرْكُ، ثُمَّ يُشْتَقُّ مِنْهُ. يُقَالُ رَفَضْتُ الشَّيْءَ: تَرَكْتُهُ.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«رفْض: عدم القبول، سلبية المواقف، العداء أو الانتقاد المفرط للفرد الذي قد يعجل من مشاعر الرفض.»"
          source: "مسرد التربية (ArabTerm)"
        - text: "«رَفْض: رد القول على قائله.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«رَفْض: عدم قبول الشحنة أو المادة مثلاً لعدم مطابقتها للمواصفات.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
        - text: "«(1) رَفْض (2) حقّ الشُّفعة: حقّ قبول شيء أو رفضِهِ قبل عرضه على الآخرين.»"
          source: "المورد الحديث (refusal)"
      expands:
        - text: "«تركك الشيء»"
          source: "كتاب العين"
          addition: "الأصل اللغوي للرفض هو الترك المطلق، وتخصّصت الدلالة في الاستعمال المعاصر لعدم القبول"
        - text: "«(1) رَفْضٌ؛ نَبْذٌ (2) شيء مرفوض.»"
          source: "المورد الحديث (rejection)"
          addition: "يُظهر الترادف بين الرفض والنبذ في سياق عدم القبول"

    - lemma: "رَدّ"
      confirm:
        - text: "«على فلان الشَّيْءَ: لم يَقْبَلْه»"
          source: "المعجم الكبير"
        - text: "«الكلامَ: رفَضَه — شهادته: لم يقبلها — التُّهْمَة: دفعها»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«رددت الشيء ردا — أعاده ورجّعه وكرّره — رجعَه وأعادَهُ»"
          source: "المعجم الكبير / مجمل اللغة"
          conflict: "الدلالة الأساسية للرَّدّ هي الإرجاع والإعادة، وهي أعمّ من مفهوم الرفض. الرَّدّ يشمل أيضاً ردّ الجواب وردّ السلام وردّ الفعل، فلا يتخصّص بعدم القبول"

    - lemma: "إِبَاء"
      confirm:
        - text: "«إباء: الأنفة والامتناع.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«(أباء) الشَّيْء رجعه وَفُلَانًا منزلا هيأه لَهُ وأنزله»"
          source: "المعجم الوسيط"
          conflict: "الجذر (ب-و-أ) بهمزة الإفعال مختلف عن (أ-ب-ي). والإباء يدلّ على الموقف النفسي (الأنفة) لا على الرسالة التبليغية"

    - lemma: "صَدّ"
      contradicts:
        - text: "«عنه- صَدّاً, وصُدُوداً: أَعْرَضَ — فلاناً عن كذا- صَدّاً: منعه وصرفه»"
          source: "المعجم الوسيط"
          conflict: "الصدّ يدلّ على الإعراض والمنع الفعلي، وليس رسالة تبليغية. هو فعل مادي أو نفسي لا خطاب لفظي"
        - text: "«الإعراض والعدول — الضجيج»"
          source: "مقاييس اللغة"
          conflict: "أصل الصدّ في اللغة الإعراض والعدول، وهو مختلف عن مفهوم الرسالة الرافضة"

    - lemma: "اعْتِذَار"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "رَفْض"
      decision: confirmed
      decision_reason: "لمّة مؤكدة بقوة من مصادر معجمية متعددة كلاسيكية ومعاصرة. الأصل اللغوي (الترك) تخصّص في الاستعمال المعاصر ليدلّ على عدم القبول. مثبت في معاجم المصطلحات (قانون، طب، تقانات، إعلام) بمعنى rejection/refusal."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة المؤكدة في المجموعة؛ تدلّ على عدم القبول بصورة مباشرة وحاسمة، دون ملابسات عاطفية (كالأنفة في الإباء) أو دلالة على الإرجاع (كما في الردّ)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَفْض"

    - lemma: "رَدّ"
      source: stage1
      decision: removed
      decision_reason: "الرَّدّ مفهوم أعمّ من الرَّفض: يشمل الإرجاع والإعادة وردّ الجواب وردّ السلام وردّ الفعل. دلالته على عدم القبول ثانوية ومشروطة بالسياق (ردّ الطلب)، فلا يصلح مرادفاً مستقلاً لـ(refusal) التي تتخصّص بعدم القبول."
      evidence_assessment:
        case: mixed

    - lemma: "إِبَاء"
      source: stage1
      decision: removed
      decision_reason: "الإباء يدلّ على الأنفة والامتناع النفسي عن الخضوع، وهو موقف وجداني لا رسالة تبليغية. المجموعة تتطلب لفظاً يدلّ على الفعل التواصلي (message)، والإباء لا يفي بهذا الشرط."
      evidence_assessment:
        case: mixed

    - lemma: "صَدّ"
      source: stage1
      decision: removed
      decision_reason: "الصَّدّ يدلّ على الإعراض والمنع المادي، وهو فعل لا خطاب. لا يُستعمل للدلالة على رسالة ترفض قبول شيء معروض."
      evidence_assessment:
        case: contradicts_only

    - lemma: "اعْتِذَار"
      source: stage1
      decision: removed
      decision_reason: "الاعتذار يدلّ على تقديم العذر وطلب الصفح، وهو مفهوم مختلف تماماً عن الرفض. قد يتضمّن الاعتذار رفضاً مهذّباً لكنه ليس مرادفاً له."
      evidence_assessment:
        case: no_material

