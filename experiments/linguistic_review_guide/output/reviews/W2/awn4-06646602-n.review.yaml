      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية من الإنجليزية (a message refusing to accept something that is offered)، ويحتوي على دوران جزئي (رسالة ترفض ← رَفْض). يحتاج إعادة صياغة بأسلوب معجمي عربي أصيل."
    authored:
      - type: terminological
        text: "خِطابٌ يُبلَّغُ به عدمُ القبول لِما عُرِض أو طُلِب"
