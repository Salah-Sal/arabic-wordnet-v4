          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "التعبيرُ عن عدم الموافقة على أمرٍ مَعروضٍ أو مَطلوبٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
