# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (حرية) مكتوبة بلا تشكيل كامل — يجب ضبطها: حُرِّيَّة"
      - "التعريف الحالي دوريٌّ جزئياً: «حالة كونه حراً» تستخدم «حراً» لتعريف «حرية»"
      - "المجموعة تحتوي لمّةً واحدةً فقط لمفهوم محوري غزير التعابير في التراث العربي؛ ينبغي استكشاف مرادفات فصيحة"
      - "صياغة التعريف أقرب إلى ترجمة حرفية من الإنجليزية منها إلى أسلوب المعجم الوسيط"
    observations: >
      مفهوم الحرية من أعمق المفاهيم الفلسفية وأغزرها في الموروث العربي والإسلامي.
      الجذر (ح ر ر) يحمل معنيَي التحرّر من الرِّقِّ والخلوص من العيب والشائبة.
      التراث الكلاسيكي يفرّق بين الحرية الظاهرة (الجسدية: ضد الرق) والحرية الباطنة
      (الروحية: الخروج عن رق الكائنات والمخلوقات). المصطلح الحديث "حرية" يجمع المعنيَين
      ويمتدّ ليشمل الحرية السياسية وحرية الفكر والتعبير. ينبغي التحقق من وجود مرادفات
      فصيحة راسخة قبل إبقاء المجموعة بلمّة واحدة.

  blind_candidates:
    - lemma: "السَّرَاح"
      generation_method: majaz
      justification: >
        من جذر (س ر ح): أصله الإطلاق والانفكاك. يُقال "أطلق سراحه" أي خلّى سبيله.
        إحياء لمعناه الأصلي: الخلوص من القيد والتبعة — مشابهة وظيفية تامة مع مفهوم
        الحرية بوصفها انعتاقاً من القيود الخارجية.
    - lemma: "الإطلاق"
      generation_method: ishtiqaq
      justification: >
        مصدر (أطلق) على وزن إفعال من جذر (ط ل ق). الإطلاق الكامل = التحرر من كل قيد.
        استعمل التهانوي الإطلاق بمعنى "فكّ القيود وفتح اليد"، وكذلك قال البركتي:
        "رفع القيد في كل شيء". يصلح دلالةً على حالة عدم التقييد.
    - lemma: "التَّحَرُّر"
      generation_method: ishtiqaq
      justification: >
        مصدر (تحرَّر) على وزن تَفَعُّل من جذر (ح ر ر). يدل على الحالة الناتجة عن
        انتزاع الشخصِ لحريته أو منحِها له — أي حالة كونه حراً من القيود. يُستعمل
        في السياقين السياسي والأكاديمي بهذا المعنى.
    - lemma: "الاسْتِقلالية"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من (استقلّ) على وزن افتعاليَّة. يدل على عدم الخضوع لإرادة خارجية،
        وهو جانب جوهري من مفهوم الحرية. يُستخدم في الأدبيات الفلسفية والاجتماعية
        المعاصرة للدلالة على الاستقلال الذاتي (autonomy) الذي هو وجه من وجوه الحرية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استُعمل ٤ استعلامات:
#   ١. مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات)
#   ٢. جسر إنجليزي (freedom / liberty / free / independence)
#   ٣. بحث FTS عربي (حرية، استقلال الإرادة، دون قيود)
#   ٤. مقاييس اللغة لابن فارس (جذر حرر)
stage2_evidence:
  per_lemma:

    - lemma: "حرية"
      confirm:
        - text: "«الحُرِيّة: ضد الرق. يقال: إنه لحرٌّ يبين الحريّة (freedom): هي تمتع الإنسان باستقلال الإرادة والقدرة على تنفيذ ما يراه صائباً ويستطيع تحمل مسؤوليته»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
        - text: "«الحُرِّيَّة: الخلوص من الشوائب أو الرق أو اللُّؤم، كونُ الشَّعب أو الرجل حُرًّا»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة)"
        - text: "«الحرية: في اصطلاح أهل الحقيقة: الخروج عن رق الكائنات وقطع جميع العلائق والأغيار، وهي على مراتب: حرية العامة: عن رق الشهوات، وحرية الخاصة: عن رق المرادات لفناء إرادتهم من إرادة الحق، وحرية خاصة الخاصة: عن رق الرسوم والآثار لانمحاقهم في تجلي نور الأنوار»"
          source: "كتاب التعريفات للشريف الجرجاني (hawramani)"
        - text: "«الحُرِّيةُ: أفعال، وأخلاق محمودة لا تستعبدها المطامع، والأغراض الدنيَّة»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani)"
        - text: "«الحُرِّيةُ: ألا يكون تحت رق المخلوقات، ولا يجري عليه سلطان المكوِّنات»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani)"
        - text: "«الحُرِّيَّة: الخلوص من الشوائب أو الرقّ أو اللؤم وكون الشعب أو الرجل حراً»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "حرية — EN: liberty"
          source: "مسرد الفلسفة وعلم النفس — ALECSO (arabterm)"
        - text: "حرية — EN: liberty"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — ALECSO (arabterm)"
        - text: "«(1) حرية. (ب) استقلال. (ج) تحرر من. (د) سهولة؛ طلاقة... (هـ) صراحة»"
          source: "المورد الحديث (2008)"

    - lemma: "السَّرَاح"
      confirm:
        - text: "«السراح: التسريح. ويُقال: أطلق سراحه، خلّى سبيله»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«افْعَلْ ذلك في سَرَاحٍ ورَواحٍ، أي: في سُهُولَة. أطلق سراحَه: خلّى سبيلَه»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      contradicts:
        - text: "«سَراح — الجذر: س ر ح — مثال: أطلقوا سَراح الأسير — الرأي: مرفوضة — السبب: لأن «السراح» بمعنى الإطلاق والتحرير — الصواب والرتبة: أطلقوا سَراح الأسير [فصيحة] التعليق: يمكن تصويب المثال المرفوض بحمله على المجاز»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (hawramani)"
          conflict: >
            المعجم يُثبت أن السراح يُستعمل حصراً في التعبير الاصطلاحي "أطلق سراحه"
            وليس لمّةً مستقلة بمعنى الحرية. فعل الإطلاق (كحدث) ≠ حالة الحرية (كحالة دائمة).

    - lemma: "الإطلاق"
      confirm:
        - text: "«الإطلاق: في اللغة رها گردن بندي ودست گشادن — أي هو فكّ القيود وفتح اليد — كما في الصراح»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
        - text: "«الإطلاق: رفع القيد في كل شيء والتطليق في النساء خاصة لرفع القيد الحكمي»"
          source: "التعريفات الفقهية للبركتي (hawramani)"
      contradicts:
        - text: "«إِطْلاق — EN: actuate / initiation / launching»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (arabterm)"
          conflict: >
            في المعاجم التقنية الحديثة، «إطلاق» تُرجمت بمعنى تشغيل/إطلاق برمجية وليس
            الحرية. المصطلح محمّل بمعانٍ تقنية مغايرة لدلالة الحرية الفلسفية.
      expands:
        - text: "«الإطلاق: [في الانكليزية] Absolute meaning — في اللغة رها گردن بندي ودست گشادن»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
          addition: >
            التهانوي يُدرج الإطلاق في سياق الأحوال الصوفية أيضاً، مما يعمّق الدلالة
            نحو التحرر الكامل من كل قيد — لكنه يبقى حدثاً أو صفةً لا حالةً ثابتة.

    - lemma: "التَّحَرُّر"
      confirm:
        - text: "«تحرُّر: التحرُّر أو التخلّص من القيود والتدخلات الخارجية — EN: liberalization [US]; deregulation»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (arabterm)"
        - text: "«تحرّر — EN: liberation»"
          source: "مسرد الفلسفة وعلم النفس — ALECSO (arabterm)"
      contradicts:
        - text: "«التحرر — EN: emancipation — DEF: وجود مناطق ذات عمل أو نمو ذاتي في الجنين»"
          source: "معجم المصطلحات الطبية (arabterm)"
          conflict: >
            في السياق الطبي «التحرر» يدل على بيولوجيا الجنين لا على الحرية. التعدد الدلالي
            يُضعف الاعتماد على هذه اللمّة في سياق الحرية العامة.

    - lemma: "الاسْتِقلالية"
      contradicts:
        - text: "«استقلالية — EN: Autonome — DEF: عند أندريه مارتني (1965)، ميزة بعض المركبات اللغوية التي ترد في أماكن مختلفة من الجملة وتحتفظ بدورها دون أن تكون مقيدة بمكان معين»"
          source: "المعجم الموحد لمصطلحات اللسانيات (arabterm)"
          conflict: >
            الاستقلالية في المعاجم تُترجم بـ autonomy/autonome وليس freedom/liberty.
            هي مفهوم أضيق (الاعتماد على الذات دون إكراه) ≠ الحرية الشاملة.
        - text: "«اسْتِقْلاَلِيَّة — EN: autonomy»"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (arabterm)"
          conflict: "ترادف مع autonomy لا مع freedom — فرق مفهومي جوهري"

    - lemma: "عَدَم الإكراه"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حرية"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكدة بالإجماع المعجمي الكلاسيكي والحديث. المعجم الكبير والمعجم الوسيط
        وكتاب التعريفات للجرجاني ومقاليد السيوطي وعشرات المصطلحات الأكاديمية (ALECSO)
        جميعها تُثبت «حرية» لمّةً راسخةً بهذه الدلالة. تحتاج فقط تصحيح تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
        type: native_derivation
        verdict: "مشتقة من جذر عربي أصيل (ح ر ر) على الوزن الصناعي فُعِّيلة — لا اقتراض"
      morphological_fit: >
        وزن فُعِّيلة (حُرِّيَّة) من الأوزان المُنتِجة للمفاهيم المجردة في العربية الحديثة
        (كحُرِّيَّة، نُقِّيَّة، عُبُودِيَّة) — ملاءمة صرفية تامة.
      quality_gate:
        idiomatic_frequency: "شائعة جداً في الفصحى المعاصرة والكلاسيكية"
        ease_of_use: "أحادية المقطع في الاستعمال، سهلة النسبة والتصغير والجمع"
        appropriateness: "ملائمة تماماً للمفهوم"
        preference_for_classical: "متأصلة في التراث العربي"
        preference_for_arabic: "عربية أصيلة"
        derivability: "تشتق منها حرائر، حريات، تحرري، حرية الصحافة..."
      nuance_differentiation: >
        «حرية» تدل على الحالة الثابتة لكون الشخص حراً من القيود والرق والإكراه الخارجي.
        تتميز عن: «استقلال» (independence — التحرر السياسي لكيان ما)، «تحرر» (liberation —
        عملية الانتزاع من القيد)، «استقلالية» (autonomy — القدرة على اتخاذ القرار ذاتياً).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُرِّيَّة"

    - lemma: "السَّرَاح"
      source: stage1
      decision: removed
      decision_reason: >
        السراح ليس مرادفاً مستقلاً للحرية، بل عبارة اصطلاحية متجمّدة في التعبير "أطلق
        سراحه" (فعل الإفراج كحدث). المعجم يُثبت أنه بمعنى التسريح (الفعل) لا الحرية
        (الحالة). فضلاً عن ذلك فهو مُتخصَّص بالسياق الأمني والاحتجاز، لا الحرية
        الفلسفية العامة. اختبار السكّ يفشل: لا يُقال "يتمتع فلان بالسراح" بمعنى الحرية.

    - lemma: "الإطلاق"
      source: stage1
      decision: removed
      decision_reason: >
        الإطلاق وإن دلّ في التراث الكلاسيكي على "فكّ القيود" إلا أنه في الاستعمال الحديث
        محمّل بمعانٍ تقنية (إطلاق برنامج، إطلاق صاروخ) تُضعف دلالته الفلسفية. كما أنه
        يدل على فعل الإطلاق (action) لا على الحالة الناتجة (state). لا يصلح لمّةً مستقلة
        في هذا السِّنست.

    - lemma: "التَّحَرُّر"
      source: stage1
      decision: removed
      decision_reason: >
        التحرر يدل على عملية الانتزاع من القيد (process/act of liberation) لا على الحالة
        الثابتة لكون الشخص حراً. مقابلاته في المعاجم: liberation, liberalization,
        deregulation — وهي مختلفة عن freedom/the condition of being free. علاوة على ذلك
        التحرر في المعجم الطبي يدل على ظاهرة بيولوجية مغايرة تماماً.

    - lemma: "الاسْتِقلالية"
      source: stage1
      decision: removed
      decision_reason: >
        الاستقلالية مرادفة لـ autonomy لا لـ freedom. هي أخصّ من الحرية: تركّز على
        الاعتماد على الذات في القرار، بينما الحرية أشمل وأعمّ. إدراجها في هذا السِّنست
        يُوسّع المجموعة بما يُخلّ بدقتها الدلالية.

    - lemma: "عَدَم الإكراه"
      source: stage1
      decision: removed
      decision_reason: >
        عدم الإكراه تعريف سلبي (تعريف بالنفي) وليس مصطلحاً مسكوكاً. يفشل اختبار
        التثبيت المعجمي: لا يرد في أي معجم بوصفه وحدة معجمية مستقلة. هو وصف إجرائي
        للحرية لا مرادف لها.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
