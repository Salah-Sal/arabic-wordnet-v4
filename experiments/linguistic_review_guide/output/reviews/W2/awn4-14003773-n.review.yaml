      - "الحقل الدلالي للمجموعة أغنى من أن يُمثَّل بثلاث لمّات فحسب؛ تنقصها ألفاظ أعمق توثيقًا كالوَغَر والإِحْنَة والشَّنَآن"
    observations: >
      المجموعة ترادفية تنتمي إلى حقل دلالي بالغ الثراء في العربية؛ إذ امتلكت اللغة العربية منذ القديم معجمًا
      متشعّبًا للتعبير عن درجات الحقد والبغض والعداوة. اللمّة 'بغضاء' قويّة صحيحة وموثّقة (شدة البغض).
      أما 'خصومة' فتنتمي إلى حقل التنازع والجدل لا إلى حقل الضغينة الراسخة. و'عداء' مثير للجدل: كلاسيكيًا
      تعني العدو والشوط، لكنها في الاستعمال المعاصر تُستخدم للعداوة الفعلية. الألفاظ المفتقرة إليها هذه
      المجموعة هي: الوَغَر (الضغن المحتد كالجمر في الصدر)، والإِحْنَة (الحقد الدفين في القلب)، والشَّنَآن
