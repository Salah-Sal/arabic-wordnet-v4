    observations: "المفهوم فلكي تقني يُعبَّر عنه في العربية بمركّب وصفي-إضافي. المعاجم المصطلحية الحديثة (المعجم الموحد للرياضيات والفلك ١٩٩٠، المورد الحديث ٢٠٠٨) تستعمل «زمن شمسي متوسط» و«الزمن الشمسيّ المتوسط». أمّا استعمال «توقيت» بدل «زمن/وقت» فشائع في الاستعمال العامّ (توقيت غرينتش، توقيت عالمي) لكنّه أقلّ دقّة اصطلاحياً."
  blind_candidates:
    - lemma: "الزَّمَنُ الشَّمْسِيُّ الْمُتَوَسِّطُ"
      generation_method: tarkib
      justification: "مركّب وصفي من «الزمن» + «الشمسي» + «المتوسط»، وهو الصيغة المعتمدة في المورد الحديث (٢٠٠٨) لترجمة mean solar time"
    - lemma: "الْوَقْتُ الشَّمْسِيُّ الْمُتَوَسِّطُ"
      generation_method: tarkib
      justification: "مركّب وصفي يستعمل «الوقت» (مقدار من الزمان) بدل «الزمن»، أقرب إلى الاستعمال القرآني واللغوي الفصيح"
    - lemma: "التَّوْقِيتُ الْوَسَطِيُّ"
      generation_method: tarkib
      justification: "مركّب وصفي مختصر من «التوقيت» + «الوسطي»، يوازي mean time مع استخدام «وسطي» بدل «متوسط»"
    - lemma: "الزَّمَنُ الْمُعَدَّلُ"
      generation_method: ishtiqaq
      justification: "من «عدّل» بمعنى سوّى وقوّم، إذ الشمس المتوسطة شمس مُعدَّلة الحركة؛ لكنّه مصطلح غير مألوف في هذا السياق"


