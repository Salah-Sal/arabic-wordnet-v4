stage3_analysis:
  per_lemma:

    - lemma: "تغير مستمر"
      decision: removed
      decision_reason: >
        اللمّة مسجَّلة في المعجمية العربية الاصطلاحية (ARABTERM) كمصطلح أحيائي يُقابل «continuous variation»،
        وهو مفهوم مختلف كلياً عن «state of flux». فضلاً عن ذلك، لا تحمل اللمّة بُعد انعدام اليقين
        ولا البُعد الانتقالي (ما بين حدث مهم واتجاه جديد) الذي يُشكّل جوهر المجموعة الترادفية.
        الإبقاء عليها يُولّد التباساً مصطلحياً مع حقل الأحياء.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عدم استقرار"
      decision: confirmed
      decision_reason: >
        موثَّقة في معاجم متعددة (علم الاجتماع، الجغرافيا، الطب) بمعنى «instability»، وهي دلالة تغطي
        الجانب السلبي لـ«flux» (غياب الاستقرار). رغم اتساع دلالتها مقارنةً بالمفهوم الدقيق، إلا أن
        استعمالها في الخطاب العربي المؤسسي والسياسي للإحالة على «state of flux» راسخٌ ومقبول.
        تحتاج إلى تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الجانب السلبي الساكن: غياب الاستقرار والثبات. لا يُصرِّح بالبُعد الانتقالي
        (ما بين حدث مهم وتوجه جديد)، ولا يحمل دلالة الحيرة في اختيار المسار.
        يُستعمل في السياقات السياسية والاقتصادية بمعنى مفتوح النهاية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ اسْتِقْرَارٍ"

    - lemma: "تَخَبُّط"
      source: stage1
      decision: removed
      decision_reason: >
        اللمّة مُوثَّقة فعلاً (تخبَّطَ) لا اسماً مستقلاً بدلالة الحالة المؤسسية. في المعجمية التقنية
        يُحيل «تخبط» على «flop» (هبوط مفاجئ). الدلالة الأصلية (الحركة العشوائية الفردية،
        تخبط المصاب بالجنون) لا تناسب سياق «state of flux» الذي يصف حالة جماعية/مؤسسية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَذَبْذُب"
      source: stage1
      decision: removed
      decision_reason: >
        مُرسَّخ في المعجمية العربية بمعنى «oscillation» (اهتزاز دوري فيزيائي ورياضي)،
        وهو مفهوم مغاير لـ«state of flux» ذي الطابع النفسي-الاجتماعي. نقل هذه اللمّة
        إلى المجموعة سيخلق اشتراكاً لفظياً مع المصطلح العلمي الراسخ.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مَرْحَلَةٌ انْتِقَالِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّقة في ARABTERM بمعنى «transitory period» وهي وحدة معجمية ثابتة في الخطاب العربي
        (السياسي والتشريعي والاقتصادي) للإحالة على الفترة الانتقالية بين حالتين. تجتاز اختبار
        التثبيت المعجمي: «مرحلة انتقالية» لا يمكن إبدال «انتقالية» بمرادف آخر (مرحلة تحولية،
        مرحلة تغييرية) دون فقدان المعنى المصطلحي الراسخ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركز على البُعد الزمني المرحلي: الفترة بين اتجاهين. لا يتضمن بالضرورة معنى الحيرة
        وانعدام اليقين الذي يُعبَّر عنه بـ«عدم استقرار». يُستخدم في سياقات مخططة (فترة انتقالية
        سياسية، مرحلة انتقالية اقتصادية).
      actions:
        - command: create_entry
          params:
            lemma: "مَرْحَلَةٌ انْتِقَالِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَقَلُّب"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في ARABTERM (الفلسفة وعلم النفس، المناخ والبيئة) بمعنى «fluctuation»، وفي المعجم
        الوسيط بمعنى التصرف في الأمور والتنقل فيها. يُغطي البُعد الديناميكي لـ«flux»: التحول
        المستمر من حال إلى حال (أصل قلب: رد شيء من جهة إلى جهة). الجذر مُرسَّخ في التراث
        اللغوي بدلالة تناسب المفهوم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُجسّد البُعد الحركي الديناميكي: الانقلاب المستمر من حال إلى حال. يحمل إيحاءً بالنشاط
        والتحرك لا مجرد الغياب السلبي كـ«عدم استقرار». يُستخدم في سياقات الأسواق والمواقف
        والأحوال المتغيرة بلا انتظام.
      actions:
        - command: create_entry
          params:
            lemma: "تَقَلُّب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


