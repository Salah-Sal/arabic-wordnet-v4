stage1_review:
  assessment:
    concerns:
      - "لمّة «تغير مستمر» تُسجَّل في المعجمية الاصطلاحية كمصطلح أحيائي بمعنى «continuous variation»، وهو مفهوم مختلف كلياً عن «state of flux» الذي ينطوي على الحيرة الانتقالية لا مجرد التغير المستمر."
      - "لمّة «عدم استقرار» واسعة الدلالة (instability) تفتقر إلى البُعد الانتقالي المحدد في التعريف: الحدث المهم الذي يسبق التوجه الجديد."
      - "كلتا اللمّتين خاليتان من التشكيل الكامل المطلوب لمدخلات AWN4."
      - "التعريف الحالي يعتمد صياغة مترجَمة حرفياً بأسلوب ركيك: «إنشاء اتجاه جديد للعمل» — يحتاج إلى تأليف عربي أصيل."
    observations: >
      المجموعة ترادفية تُمثل حالةً نفسية-تنظيمية ذات أبعاد ثلاثة متلازمة: (١) انعدام اليقين بشأن مسار العمل،
      (٢) ارتباطها بحدث مفصلي سبقها، (٣) سبوقيتها لتوجه جديد. اللمتان الحاليتان تغطيان
      بُعداً واحداً فقط (التغير والاضطراب) دون البُعدين الآخرين. يحتاج المفهوم إلى لمات
      تجمع الانتقال والحيرة والحركية معاً. الجذور الواعدة: قلب (التقلب)، نقل (الانتقال)، خبط (التخبط).
  blind_candidates:
    - lemma: "تَخَبُّط"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من جذر خ-ب-ط، يدل على الحركة العشوائية وانعدام الاتجاه الواضح؛ يجمع بين الحيرة وفقدان التوجه مما يناسب «حالة من عدم اليقين» قبل تحديد مسار جديد."
    - lemma: "تَذَبْذُب"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعْلُل من جذر ذ-ب-ذ-ب، يدل على التأرجح بين الاتجاهات وعدم الاستقرار على وجهة محددة؛ يعكس طبيعة «flux» بوصفه حالة متأرجحة."
    - lemma: "مَرْحَلَةٌ انْتِقَالِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي (موصوف+صفة) من جذرَي رحل ونقل؛ يُعبَّر به عن الفترة الانتقالية بين حالتين، وهو من أكثر المصطلحات المركبة استعمالاً في الخطاب المؤسسي والسياسي العربي للإحالة على حالة «flux»."
    - lemma: "تَقَلُّب"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من جذر ق-ل-ب، يدل على الانقلاب المستمر من حال إلى حال؛ يُغطي البُعد الديناميكي لـ«flux» وإن لم يُصرِّح ببُعد الحيرة."


