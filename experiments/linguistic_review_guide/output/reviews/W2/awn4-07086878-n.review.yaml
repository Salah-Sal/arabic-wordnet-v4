# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # التقييم الأولي (بعد الاطلاع على الملف الكامل)
  assessment:
    concerns:
      - "التعريف العربي 'لغة أو فكاهة واقعية وخشنة' ترجمةٌ حرفية للإنجليزي وليس تعريفاً معجمياً مكتملاً: يصف نماذج الشيء لا ماهيته؛ والمجموعة اسمٌ مجردٌ لا جملةٌ وصفية"
      - "فجاجة في المعاجم الأساسية (الوسيط، ولمجموعة المؤلفين) تدلّ أصلاً على 'قلة النضج في الثمار' لا على خشونة الأسلوب اللغوي، مما يجعل استخدامها هنا مجازاً غير موثَّق بما يكفي في المصادر الكلاسيكية"
      - "خشونة ترتبط في المصادر الأولى بالخشونة الحسية (الملمس، مقابلة الملاسة) وإن كان المجاز الأسلوبي موثَّقاً في أساس البلاغة وكتب أخرى"
      - "غياب مصطلحات أدق وثّقتها المعاجم الحديثة كمقابل لـcoarseness (جلافة، فظاظة) التي لم تُدرج في المجموعة"
    observations: >
      المجموعة تعبّر عن صفةٍ أسلوبيةٍ مجردة هي خشونة اللغة أو الفكاهة وبُعدها عن التهذيب
      والتصنّع. الإنجليزية تجمع بين saltiness (حدة اللسان ونتوؤه) وcoarseness (الفجاجة
      والجَلَف)؛ وهما يلتقيان في وصف الأسلوب الصريح الخشن. اللمّتان الموجودتان (خشونة،
      فجاجة) تحملان هذا المعنى مجازاً غير أنهما مثقَلتان بالدلالة الحسية الأولى. المجموعة
      تنتسب إلى الهايبرونيم (أسلوب / نمط تعبيري) وهو سياقٌ يُعزّز المعنى الأسلوبي.
      الجذران (خشن وفجج) موثَّقان في مقاييس اللغة بدلالة المادية/الحسية المُستعارة للمعاني.

  # المرشحات الأربعة توليداً أعمى (قبل الاطلاع على اللمّات الموجودة)
  blind_candidates:
    - lemma: "اِبْتِذَال"
      generation_method: ishtiqaq
      justification: >
        مشتقٌّ من جذر بذل على وزن افتعال، بمعنى ترك صيانة الشيء ورفع الحجب عنه حتى يصبح
        ابتذالاً؛ يُناسب وصف لغةٍ أو فكاهة هبطت عن مستوى الرقي إلى مستوى العامة الخشن،
        ويُستعمل عادةً في سياقات الأسلوب اللغوي والأدبي
    - lemma: "بَذَاءَة"
      generation_method: ishtiqaq
      justification: >
        مشتقةٌ من جذر بذأ على وزن فَعَالة، وهو جذرٌ يدلّ في مقاييس اللغة على 'الخروج عن طريق
        الإحماد'؛ تُستعمل لوصف الكلام الخارج عن حدّ اللياقة المهذّبة، وهو ما يقترب من
        دلالة coarseness في سياق اللغة والفكاهة
    - lemma: "سُوقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدرٌ صناعي من سوقيّ (المنتسب إلى السوق)، إذ درج العرب على وصف الكلام الفجّ
        الغير مهذّب بالسوقية نسبةً إلى كلام أهل الأسواق العامة الذي يخلو من الصقل
        الأدبي؛ الوزن (فُعلية) مناسب للمصطلحات المجردة
    - lemma: "غِلْظَة"
      generation_method: ishtiqaq
      justification: >
        من جذر غلظ على وزن فِعْلة، نقيض الرقة؛ نصّ المناوي صراحةً على أن الغلظة 'أصلها
        في الأجسام لكنها تُستعار للمعاني'، والقاموس المحيط يوثّق 'أغلظ له في القول'،
        مما يجعلها مناسبة لوصف خشونة الأسلوب وجفاء القول


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
# الاستعلامات المُجراة (6 استعلامات):
# Q1: مطابقة دفعية لجميع اللمّات (خشونة/فجاجة + 4 مرشحات) — headword_norm IN (...)
# Q2: جسر إنجليزي — translation_en:"saltiness" OR "coarseness" OR "crudeness" OR "earthiness"
# Q3: ابتذال + سوقية + جلافة + فظاظة — headword_norm IN (...)
# Q4: بحث FTS عربي — "فكاهة" OR "فجاجة" OR "ابتذال" OR "جلف" OR "فظ"
# Q5: مقاييس اللغة لجذور خشن, فجج, جلف, بذأ, بذل, ملح, فظ
# Q6: مقاييس اللغة للجذرين فج وغلظ (تكميل)
stage2_evidence:
  per_lemma:

    - lemma: "خشونة"
      confirm:
        - text: "«خَشُنَ عليه في القَوْل والعَمَل: أَغْلَظَ له وشَدَّد»"
          source: "المعجم الكبير (OCR)"
        - text: "«ومن المجاز: خشن على صاحبه، وتخشن عليه، وخاشنه مخاشنة، وتخاشن القوم، وفي أخلافه خشونة»"
          source: "أساس البلاغة للزمخشري"
        - text: "«خَاشَنَهُ مُخَاشَنَةً: تصرَّف معه بفظاظة وغِلْظة، تصرَّف معه بقسوة وجفاء، عكسه لاينه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      contradicts:
        - text: "«الخُشُونَةُ: مُقابِلَةٌ للمَلاسة، فالمَلاسةُ: اسْتِواءُ وَضْعِ الأجزاء فى ظاهر الجِسْم، والخُشُونة: عَدَمُها»"
          source: "المعجم الكبير (OCR) — كشّاف اصطلاحات الفنون"
          conflict: "التعريف الاصطلاحي يحصر خشونة في الطبيعة الحسية الفيزيائية، ولا يُشير إلى الأسلوب اللغوي"
      expands:
        - text: "«coarse: (5) جلف؛ فظّ؛ غير مصقول coarse manners، (6) بذيء coarse language»"
          source: "المورد الحديث (2008)"
          addition: "ورود خشونة ضمن منظومة الترجمة العربية لـcoarse يؤكد إمكانية استعمالها في سياق الأسلوب اللغوي، وإن جاءت هنا صفةً لا اسماً"
        - text: "«roughness: خشونة»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة؛ الهندسة المدنية؛ النقل"
          addition: "تعدد مقابلات خشونة للـroughness في سياقات تقنية يُثبت المعنى الأساسي الحسي ويُبيّن أنها لم تُستعمل اصطلاحياً للدلالة الأسلوبية في المصطلحية الحديثة"

    - lemma: "فجاجة"
      contradicts:
        - text: "«الفجاجة: فجاجة كل شيء قلَّة نضجه وغير النضيج من الفواكه»"
          source: "المعجم الوسيط لمجموعة المؤلفين"
          conflict: "التعريف يحصر فجاجة في معنى عدم نضج الثمار الزراعي، ولا يوثّق دلالتها على خشونة اللغة"
        - text: "«الفَجَاجَةُ: قلة نضجه غيرُ النَّضيج من الفواكه»"
          source: "المعجم الوسيط (OCR)"
          conflict: "تأكيد المعنى الأساسي لعدم النضج المادي في المرجع المعجمي الرئيسي"
      expands:
        - text: "«crude: (2) فِجّ؛ غير ناضج (3) بسيط؛ جافٍ (5) فَظّ؛ جِلْف (6) خشِن: غير مصقول أو مُهَذَّب crude manners»"
          source: "المورد الحديث (2008)"
          addition: "ربط فجّ/فجاجة بمعنى الخشونة وعدم الصقل في السلوك والأسلوب يدعم التوسع الدلالي المجازي"
        - text: "«crude: (1) خاميّة؛ فجاجة إلخ (2) شيء خامٌ أو فِجّ إلخ»"
          source: "المورد الحديث (2008)"
          addition: "استخدام فجاجة كمقابل مباشر لـcrudeness بمعنى الخامة وعدم الصقل في المعجم الثنائي اللغة"

    - lemma: "اِبْتِذَال"
      contradicts:
        - text: "«ابتذال؛ تفاهة: شيء مبتذَل»"
          source: "المورد الحديث (2008)"
          conflict: "ابتذال يدلّ على التفاهة والاستهلاك حتى الملل والإسفاف، وهو مفهومٌ مختلف عن الخشونة الأسلوبية الصريحة الواقعية"
        - text: "«(1) تفاهة؛ ابتذال (2) ملاحظة تافهة أو مبتذَلَة» — مقابل platitude/triviality"
          source: "المورد الحديث (2008)"
          conflict: "ابتذال في مقابل التفاهة والبذل الفكري المُفرط، لا في مقابل الخشونة الواقعية"
        - text: "«(3) «أ» واقعية. «ب» ابتذال — مقابل prose»"
          source: "المورد الحديث (2008)"
          conflict: "الارتباط بـprose بمعنى النثر/الواقعي المبتذل قريبٌ نسبياً لكنه يفتقر لدلالة الخشونة والجرأة"

    - lemma: "بَذَاءَة"
      confirm:
