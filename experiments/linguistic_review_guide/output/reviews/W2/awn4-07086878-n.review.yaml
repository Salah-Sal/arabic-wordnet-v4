        - text: "«(الغلظة) الغلاظة، ويُقال بينهم غلظة: عداوة»"
          source: "المعجم الوسيط لمجموعة المؤلفين"
      expands:
        - text: "«الغِلْظَةُ، مثلثةً: ضِدُّ الرِّقَّةِ. وأغْلَظَ له في القولِ: خَشَّنَ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "التوثيق الصريح لاستعمال الغلظة في القول: 'أغلظ له في القول' أي اشتدّ وقسا، يربطها بالأسلوب اللغوي"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "خشونة"
      decision: confirmed
      decision_reason: >
        خشونة موثّقةٌ في المعاجم الكلاسيكية والحديثة بمعنى جفاء القول وشدة الأسلوب
        (خاشنه في الكلام، خشُن عليه في القول والعمل). أساس البلاغة يوثّق المجاز صريحاً
        'في أخلافه خشونة'. الجذر خشن في مقاييس اللغة 'خلاف اللين' يُتيح التوسع
        الدلالي لتشمل خشونة الأسلوب اللغوي. اللمّة مستوفيةٌ شروط التثبيت المعجمي وتناسب
        الهايبرونيم (نمط تعبيري / أسلوب).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُوحي بالخشونة الحسية الجسدية المنقولة مجازاً إلى القول والأسلوب؛ تُصوِّر
        الصفةَ من منظور الملمس والتركيب المادي وتُركّز على غلظ الطبع وعنف المعاملة
        في الكلام والفكاهة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُشُونَة"

    - lemma: "فجاجة"
      decision: confirmed
      decision_reason: >
        فجاجة موثّقةٌ في المورد الحديث كمقابل لـcrudeness بمعنى الخامة وعدم الصقل،
        وهو ما يُعبّر عن أسلوبٍ لم يتهذب ولا يزال في حالته الخام. الجذر فجج في
        مقاييس اللغة يُوثّق الفجّ 'الشيء لم ينضج مما ينبغي نضجه' وهو أصلٌ يُتيح
        التوسع الاستعاري للأسلوب الفجّ. رغم أن المعجم الوسيط يقصر المعنى على عدم
        نضج الثمار، يجوز تأييد الاستعمال المجازي بدعمٍ من المعاجم الثنائية والسياق
        الواضح للمجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُوحي بعدم النضج والخامة المنقولة إلى الأسلوب؛ تُصوِّر الصفةَ من منظور
        النضج والتكوين وتُشير إلى لغةٍ أو فكاهةٍ خامةٍ لم تمرّ بصقلٍ ثقافي بعد،
        وهي أقل حدةً من خشونة في إيحاءاتها
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَجَاجَة"

    - lemma: "اِبْتِذَال"
      source: stage1
      decision: removed
      decision_reason: >
        ابتذال يدلّ على التفاهة والإسفاف بمعنى الشيوع المُفرط حتى يصبح الشيء مبتذَلاً
        ومستهلَكاً؛ وهو مفهومٌ مختلف عن الخشونة الأسلوبية الواقعية المباشرة. كما
        أن الأدلة تربطه بـplatitude وtriviality وbanality لا بـcoarseness أو saltiness.
        قد يتقاطع مع انخفاض المستوى لكنه لا يحمل البُعد المباشر والواقعي للمفهوم.

    - lemma: "بَذَاءَة"
      source: stage1
      decision: removed
      decision_reason: >
        بذاءة تدلّ على فحش القول وبذاءة اللسان، وهي أشدّ وأقسى من الخشونة الأسلوبية
        الواقعية المقصودة. المفهوم الأصل هو تجاوز حدود الإحماد نحو الفحش والمستقذَر،
        وهو أبعد من down-to-earth coarseness. فضلاً عن ذلك ارتبطت اصطلاحياً
        بـcacolalia الطبية (النطق القسري بكلمات فاحشة) مما يُضيّق دلالتها ويُبعدها
        عن السياق الأسلوبي الأدبي.

    - lemma: "سُوقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي للمصطلح بوصفه اسماً مستقلاً ذا معنى اصطلاحي مسكوك.
        المفردة ذات طابع وصفي تداولي ولا ترقى إلى مستوى المصطلح المعجمي الثابت
        (تفشل اختبار التثبيت المعجمي).

    - lemma: "غِلْظَة"
      source: stage1
      decision: removed
      decision_reason: >
        غِلظة موثّقةٌ بمعنى 'ضد الرقة' وقد تُستعار للمعاني، إلا أن دلالتها تتمحور
        حول الشدة والقسوة في المعاملة الشخصية (بينهم غلظة: عداوة) وليس حول الطابع
        الأسلوبي الواقعي الخشن للغة والفكاهة. فضلاً عن ذلك هي مرادفةٌ لخشونة في
        المعنى الأسلوبي دون إضافة فارقٍ دلالي، مما يجعل إضافتها تكريراً لما هو موجود.


