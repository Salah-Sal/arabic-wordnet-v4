          source: "معجم اللغة العربية المعاصرة"
        - text: "«أ» عالَمٌ خياليّ شبيهٌ بالعوالِم التي تصوِّرها حكايات الجنِّيّات. «ب» مكانٌ مثيرٌ للإعجاب أو الدَّهَش."
