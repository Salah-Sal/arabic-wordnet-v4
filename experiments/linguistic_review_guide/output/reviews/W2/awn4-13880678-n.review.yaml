# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13880678-n (tertium quid)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «حَلّ وَسَط» تعني التسوية أو المصالحة (compromise)، لا «الشيء الثالث بين النقيضين» (tertium quid)"
      - "اللمّة «طَرَف ثَالِث» تُستخدم في السياق القانوني والتجاري بمعنى third party، وهي لا تدل على كيان يشبه نقيضين ويتميّز عنهما"
      - "المفهوم فلسفي منطقي متخصص (tertium quid) ولا يُعبَّر عنه في العربية بمصطلح مفرد مسكوك، بل يُقارَب بعبارات مثل «المنزلة بين المنزلتين» في علم الكلام"
    observations: "المجموعة تمثّل مفهوماً لاتيني الأصل (tertium quid) يدلّ على كيان ثالث يشبه نقيضين ويتميّز عنهما. التعريف العربي الحالي ترجمة مقبولة للتعريف الإنجليزي لكنه يفتقر إلى السياق الفلسفي. اللمّتان الموجودتان لا تطابقان المفهوم المراد: «حلّ وسط» مصطلح تفاوضي، و«طرف ثالث» مصطلح قانوني/تجاري. المفهوم أقرب إلى ما عرفه المتكلمون بـ«المنزلة بين المنزلتين» في الإطار العقدي."

  blind_candidates:
    - lemma: "بَرْزَخ"
      generation_method: majaz
      justification: "البرزخ في اللغة ما بين كل شيئين، وفي الاصطلاح الفلسفي العالم الواقع بين عالم المعاني المجردة والأجسام المادية، فيصلح مجازاً للدلالة على كيان ثالث بين نقيضين"
    - lemma: "ثَالِثُ النَّقِيضَيْنِ"
      generation_method: tarkib
      justification: "مركب إضافي يصف المفهوم مباشرة: الشيء الثالث الذي يقع بين نقيضين ويتميز عنهما"
    - lemma: "وَسِيطَة"
      generation_method: ishtiqaq
      justification: "من الجذر وسط على وزن فَعِيلة بمعنى ما يتوسط بين شيئين، فيناسب مفهوم الكيان الواقع بين نقيضين"
    - lemma: "بَيْنِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «بَيْن» يدل على حالة الوقوع بين شيئين، مستعمل في الرياضيات بمعنى betweenness"


stage2_evidence:
  per_lemma:
    - lemma: "حَلّ وَسَط"
      contradicts:
        - text: "«(1) «أ» تَسْوية؛ حلٌّ وسطٌ؛ منزلةٌ متوسطةٌ بين منزلتين. «ب» الوَسَط: شيء جامعٌ لخصائص شيئين آخرين (2) تَخَلٍّ أو تنازلٌ عن...»"
          source: "المورد الحديث"
          conflict: "المصطلح يدل على التسوية والمصالحة (compromise)، لا على كيان ثالث يشبه نقيضين"
        - text: "«منهج لحل مشكل بين المتكلم والمخاطب وذلك بالتنازل عن موقف ما.»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          conflict: "التعريف يؤكد أنّ «حل وسط» منهج تفاوضي قائم على التنازل، لا كيان مستقل بين نقيضين"

    - lemma: "طَرَف ثَالِث"
      contradicts:
        - text: "«شركةٌ تُصنِّعُ وتَبيعُ ملحقات وطرفيات تُستخدَمُ مع حواسيب أو طرفيات يُنتجها مُصنِّعٌ رئيسي، وعادةً دون تدخّل المصنّع الرئيسي.»"
          source: "معجم مصطلحات المعلوماتية"
          conflict: "المصطلح يدل على طرف خارجي في سياق تجاري/قانوني (third party)، لا على كيان يشبه نقيضين"
        - text: "«غير (ال..)، طرف ثالث — third person; third party»"
          source: "المعجم الموحد لمصطلحات القانون"
          conflict: "استعمال قانوني بحت بمعنى الشخص الأجنبي عن العلاقة"
      expands:
        - text: "«(1) السَّبيل الوسط: شيء متوسِّط بين طرفين أو نقيضَيْن (2) فريق ثالث [يكتنفُهُ الغموض].»"
          source: "المورد الحديث"
          addition: "المورد يترجم tertium quid بـ«السبيل الوسط» و«فريق ثالث» لا بـ«طرف ثالث»، فاللفظ قريب لكنه ليس المصطلح المعتمد"

    - lemma: "بَرْزَخ"
      confirm:
        - text: "«البَرْزَخُ: ما بَيْنَ كل شَيْئَينِ»"
          source: "المحيط في اللغة للصاحب بن عبّاد"
        - text: "«البَرْزَخُ: الحاجِزُ بين الشَّيْئَينِ»"
          source: "القاموس المحيط"
        - text: "«البرزخ: هو الحائل بين الشيئين، ويعبر به عن عالم المثال، أعني الحاجز من الأجسام الكثيفة وعالم الأرواح المجردة»"
          source: "التعريفات للجرجاني"
      contradicts:
        - text: "«الحاجز بين شيئين ما بين الموت والبعث؛ فمن مات فقد دَخَل البرزخ»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال الشائع يخصّ البرزخ بالحاجز بين الدنيا والآخرة أو بالمعنى الجغرافي (isthmus)، لا بمفهوم الكيان الثالث بين نقيضين"
      expands:
        - text: "«وبَرازِخُ الإِيمانِ: ما بَيْنَ أوَّلِهِ وأخِرِه، أو ما بين الشَّكِّ واليَقينِ»"
          source: "القاموس المحيط"
          addition: "البرازخ تدل على ما يقع بين حالتين متقابلتين، وهو قريب من مفهوم الشيء الثالث بين نقيضين"

    - lemma: "ثَالِثُ النَّقِيضَيْنِ"
      evidence_status: "no_material_found"

    - lemma: "وَسِيطَة"
      expands:
        - text: "«الوسيط هو طرف ثالث محايد ونزيه، يسهل المفاوضات بين طرفين في إطار غير رسمي.»"
          source: "مسرد المناخ والبيئة (ALECSO)"
          addition: "وسيط/وسيطة تدل على الشخص المتوسط بين طرفين لفض نزاع، لا على كيان مجرد يشبه نقيضين"

    - lemma: "بَيْنِيَّة"
      expands:
        - text: "«بَيْنِيّة — betweeness [رياضيات وفلك]»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
          addition: "المصطلح مستعمل في الرياضيات بمعنى العلاقة الترتيبية بين نقاط، لا بمعنى كيان ثالث بين نقيضين"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "حَلّ وَسَط"
      decision: removed
      decision_reason: "«حَلّ وَسَط» يعني التسوية والمصالحة بين طرفَي نزاع (compromise)، وهو مفهوم تفاوضي مختلف تماماً عن «الشيء الثالث بين نقيضين» (tertium quid). أدلة المورد الحديث ومسرد الإعلام تؤكد هذا المعنى التفاوضي حصراً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "طَرَف ثَالِث"
      decision: removed
      decision_reason: "«طَرَف ثَالِث» مصطلح قانوني/تجاري يدل على شخص أجنبي عن علاقة ثنائية (third party)، لا على كيان يشبه نقيضين ويتميز عنهما. المورد الحديث يترجم tertium quid بـ«فريق ثالث» لا بـ«طرف ثالث»، والفرق دلالي واضح: الطرف الثالث محايد خارجي، بينما tertium quid كيان يشترك في صفات النقيضين."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بَرْزَخ"
      source: stage1
      decision: confirmed
      decision_reason: "البرزخ في أصل اللغة «ما بين كل شيئين» (المحيط في اللغة)، وفي الاصطلاح الفلسفي «الحائل بين الشيئين» (الجرجاني). المعنى يتقاطع مع مفهوم tertium quid بوصفه كياناً ثالثاً يقع بين نقيضين ويتميز عنهما. ورغم أنّ الاستعمال الشائع يخصّه بالحاجز بين الدنيا والآخرة أو بالمعنى الجغرافي، فإنّ التوسع الدلالي الفلسفي مشروع ومؤصَّل في التراث (عالم المثال عند الصوفية). المجاز هنا إزاحة دلالية من الحاجز إلى الكيان الوسيط."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد الأنطولوجي للكيان الواقع بين عالمين أو حالتين متقابلتين"
      actions:
        - command: create_entry
          params: {lemma: "بَرْزَخ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "ثَالِثُ النَّقِيضَيْنِ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي حرّ يصف المفهوم ولا يمثّل وحدة معجمية ثابتة مسكوكة. يمكن إبدال «النقيضين» بـ«الضدين» أو «المتقابلين» مع بقاء التعبير صالحاً وصفياً، فيفشل في اختبار السكّ."

    - lemma: "وَسِيطَة"
      source: stage1
      decision: removed
      decision_reason: "الوسيطة تدل على الشخص المتوسط لفض نزاع (mediator) لا على كيان مجرد يشبه نقيضين. الدلالة فاعلية (مَن يتوسط) لا وجودية (ما يقع بين نقيضين)."

    - lemma: "بَيْنِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح رياضي مستقر بمعنى betweenness يدل على علاقة ترتيبية بين نقاط، لا على كيان ثالث بين نقيضين. نقله إلى الحقل الفلسفي يُحدث اشتراكاً لفظياً مضرّاً."


