  current_definition: "(في علم الوراثة) كائن أو خلية تحتوي على الكمية الطبيعية من الحمض النووي لكل خلية؛ أي مجموعتين من الكروموسومات أو ضعف العدد الأحادي"
  assessment:
    decision: revise
    reason: "التعريف الحالي يحتوي على عبارات غير دقيقة علمياً مثل 'الكمية الطبيعية' (فالحالة الفردية طبيعية في الأمشاج)، والأفضل التركيز على ازدواج المجموعة الصبغية."
  authored_definitions:
    - type: terminological
      text: "(في علم الوراثة) كائن أو خلية نواتها تحتوي على مجموعتين متكاملتين من الصبغيات (الكروموسومات)، وهو ضعف العدد الفرداني (أو الأحادي) الموجود في الخلايا التناسلية."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
