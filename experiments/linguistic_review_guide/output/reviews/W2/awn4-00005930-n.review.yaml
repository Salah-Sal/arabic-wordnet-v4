stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي جيد ولكنه يحتاج إلى صياغة أدق بأسلوب معجمي بدلًا من الترجمة الحرفية لتعبير (بشكل غير نمطي)."
      - "اللمة (قزم) موجودة مجردة وتحتاج إلى تشكيل دقيق (قَزَم)."
    observations: "المصطلح (قَزَم) هو المقابل الدقيق والمستقر علمياً ولغوياً لمفهوم (dwarf) للدلالة على الكائن الذي قلّ حجمه عن المعدل الطبيعي، سواء في الأحياء أو الفلك."
  blind_candidates:
    - lemma: "قَزَم"
      generation_method: majaz
      justification: "استعارة من القزم في البشر للدلالة على أي كائن حي دقيق الحجم."
    - lemma: "مُتَقَزِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تقزم، يدل على الكائن الذي صغر حجمه عن المعتاد."
    - lemma: "قَمِيء"
      generation_method: majaz
      justification: "القماءة في اللغة تعني الصغر والضآلة."
    - lemma: "ضَئِيل"
      generation_method: majaz
      justification: "صفة عامة تدل على صغر الحجم وضآلته."

stage2_evidence:
  per_lemma:
    - lemma: "قزم"
      confirm:
        - text: "«(1) قَزَم (2) نبات أو حيوان أو نجم صغير نسبيًا»"
          source: "المورد الحديث (2008)"
        - text: "«كائن حيّ أبعاد جسمه أقل من العادي»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«الضَّئيل الجسم القصير القامة [للواحد وغيره, مذكراً أو مؤنثاً]»"
          source: "المعجم الوسيط"
      contradicts: []
      expands: []
    - lemma: "مُتَقَزِّم"
      evidence_status: "no_material_found"
    - lemma: "قَمِيء"
      evidence_status: "no_material_found"
    - lemma: "ضَئِيل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "قزم"
      decision: confirmed
      decision_reason: "اللمة معتمدة في الموارد المعجمية وتستخدم علمياً للدلالة على الكائن الحي (نباتاً أو حيواناً) الصغير الحجم، وتحتاج فقط إلى ضبط بنيتها بالتشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الوحيد في المجموعة، وهو يعبر بدقة عن الكائن الذي يقل حجمه عن المعتاد."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَزَم"

    - lemma: "قَزَم"
      source: stage1
      decision: removed
      decision_reason: "مكرر مع اللمة الحالية للمجموعة."

    - lemma: "مُتَقَزِّم"
      source: stage1
      decision: removed
      decision_reason: "يدل على حالة مكتسبة أو عرضية، بينما (قَزَم) أدق وأشمل للمفهوم العام."

    - lemma: "قَمِيء"
      source: stage1
      decision: removed
      decision_reason: "كلمة عامة تعني الصغير ولا تختص علمياً بالحيوان أو النبات كما في (قَزَم)."

    - lemma: "ضَئِيل"
      source: stage1
      decision: removed
      decision_reason: "صفة عامة للحجم ولا تمثل اسماً علمياً للكائن الحي بذاته."

stage4_content:
  definition:
    current: "نبات أو حيوان صغير بشكل غير نمطي"
    assessment:
      decision: revise
      reason: "تعبير 'بشكل غير نمطي' ترجمة حرفية غير سلسة. التعبير المعجمي الأفضل هو 'أقل من المعتاد' أو 'أقل من الطبيعي'."
    authored:
      - type: terminological
        text: "كائن حيّ، من نبات أو حيوان، أبعاد جسمه أقل من المعتاد في نوعه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "الضَّئيل الجِسْم القصير القامة من الحيوان والنبات."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "كائن حيّ، من نبات أو حيوان، أبعاد جسمه أقل من المعتاد في نوعه."
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "الضَّئيل الجِسْم القصير القامة من الحيوان والنبات."

  examples:
    per_lemma:
      - lemma: "قزم"
        examples:
          - text: "يُعَدُّ هذا الكائنُ قَزَماً مقارنةً بأقرانه في النوع ذاته."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ هذا الكائنُ قَزَماً مقارنةً بأقرانه في النوع ذاته."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعَدُّ هذا الكائنُ قَزَماً مقارنةً بأقرانه في النوع ذاته."

stage5_enrichment:
  per_entry:
    - lemma: "قَزَم"
      entry_id: "{auto}"
      root: "قزم"
      maqayis_quote: "«الْقَافُ وَالزَّاءُ وَالْمِيمُ كَلِمَةٌ تَدُلُّ عَلَى دَنَاءَةٍ وَلُؤْمٍ. فَالْقَزَمُ: الدَّنَاءَةُ وَاللُّؤْمُ. وَالرَّجُلُ قَزَمٌ، يُقَالُ ذَلِكَ لِلْأُنْثَى وَالذَّكَرِ، وَالْوَاحِدِ وَالْجَمْعِ.»"

  per_sense:
    - lemma: "قَزَم"
      sense_id: "{auto}"
      nuance: "المصطلح الوحيد في المجموعة، وهو يعبر بدقة عن الكائن الذي يقل حجمه عن المعتاد."
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قزم","maqayis":"«الْقَافُ وَالزَّاءُ وَالْمِيمُ كَلِمَةٌ تَدُلُّ عَلَى دَنَاءَةٍ وَلُؤْمٍ. فَالْقَزَمُ: الدَّنَاءَةُ وَاللُّؤْمُ. وَالرَّجُلُ قَزَمٌ، يُقَالُ ذَلِكَ لِلْأُنْثَى وَالذَّكَرِ، وَالْوَاحِدِ وَالْجَمْعِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الوحيد في المجموعة، وهو يعبر بدقة عن الكائن الذي يقل حجمه عن المعتاد.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
