stage1_review:
  assessment:
    concerns:
      - "اللمة 'أساطير' هي جمع كلمة أسطورة، وقد تُفهم كجمع بسيط وليس بالضرورة كمصطلح جامع للمنظومة الميثولوجية الكاملة، إلا أن المعاجم تؤيد استخدامها كاسم جامع للأباطيل."
      - "غياب التشكيل عن اللمات الحالية (أساطير، ميثولوجيا)."
    observations: "المجموعة تغطي مفهوم الميثولوجيا كمتن حكائي (collective body) وكحقل معرفي (study). اللمات الموجودة تعكس هذين الجانبين."
  blind_candidates:
    - lemma: "عِلْمُ الأَسَاطِيرِ"
      generation_method: tarkib
      justification: "الترجمة الاصطلاحية المباشرة لـ Mythology، وتجمع بين المادة (أساطير) والمنهج (علم)."
    - lemma: "مِيثُولُوجْيَا"
      generation_method: taarib
      justification: "المصطلح العالمي المعرب والمستخدم بكثافة في الأدبيات الأنثروبولوجية والفلسفية العربية."
    - lemma: "أُسْطُورِيَّات"
      generation_method: ishtiqaq
      justification: "صيغة جمع مؤنث سالم تستخدم كاسم جامع للدلالة على المنظومة أو الحقل (مثل لسانيات، صوتيات)."
    - lemma: "مَجْمُوعَةُ الأَسَاطِيرِ"
      generation_method: tarkib
      justification: "وصف مباشر للمحتوى كما ورد في التعريف الإنجليزي (body of stories)."

stage2_evidence:
  per_lemma:
    - lemma: "أَسَاطِير"
      confirm:
        - text: "«(الأساطير) الأباطيل وَالْأَحَادِيث العجيبة... وَاحِدهَا إسطار وإسطير وأسطور وبالهاء فِي الثَّلَاثَة»"
          source: "المعجم الوسيط"
        - text: "«فَأَمَّا الْأَسَاطِيرُ فَكَأَنَّهَا أَشْيَاءُ كُتِبَتْ مِنَ الْبَاطِلِ فَصَارَ ذَلِكَ اسْمًا لَهَا، مَخْصُوصًا بِهَا.»"
          source: "مقاييس اللغة"
    - lemma: "عِلْمُ الأَسَاطِيرِ"
      confirm:
        - text: "«الميثولوجيا» (كرديف لعلم الأساطير)"
          source: "ArabTerm (مسرد الجغرافيا والتاريخ)"
    - lemma: "مِيثُولُوجْيَا"
      confirm:
        - text: "«مِيثُولُوجيا [مفرد]: علم الأساطير والخرافات المتّصلة بالآلهة وأنصاف الآلهة عند شعب من الشعوب.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "أُسْطُورِيَّات"
      confirm:
        - text: "«الميثولوجيا: ... «ب» الأسطوريات؛ علم الأساطير.»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "أساطير"
      decision: confirmed
      decision_reason: "تستخدم للدلالة على المتن الحكائي الجمعي كما ورد في المعاجم القديمة والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَسَاطِير"
    - lemma: "علم الأساطير"
      decision: confirmed
      decision_reason: "المصطلح العربي الفصيح المقابل لـ Mythology في السياق الأكاديمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عِلْمُ الأَسَاطِيرِ"
    - lemma: "ميثولوجيا"
      decision: confirmed
      decision_reason: "تعريب مقبول وشائع جداً في الدراسات المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيثُولُوجْيَا"
    - lemma: "أُسْطُورِيَّات"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة معجمية حديثة (المورد) تناسب الدلالة على الحقل أو المجموعة ككل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أُسْطُورِيَّات", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الأساطير مجتمعة؛ مجموعة القصص المرتبطة بثقافة أو مؤسسة أو شخص"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يحتاج إلى صياغة أكثر دقة لتشمل الجانب العلمي والموضوعاتي للمصطلح."
    authored:
      - type: terminological
        text: "مجموعةُ الأساطيرِ والخُرافاتِ المُرتبطةِ بثقافةِ شعبٍ من الشُّعوبِ أو تاريخِهِ، أو العِلْمُ الذي يدرسُ نُشوءَ هذه القصصِ وتطوُّرَها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "أَسَاطِير"
        examples:
          - text: "تحفلُ الأساطيرُ اليونانيَّةُ بقصصِ الآلهةِ والبُطولاتِ الخارقةِ."
            type: usage
      - lemma: "عِلْمُ الأَسَاطِيرِ"
        examples:
          - text: "يُعنى علمُ الأساطيرِ بتحليلِ الرموزِ الدينيَّةِ في الثقافاتِ القديمةِ."
            type: usage
      - lemma: "مِيثُولُوجْيَا"
        examples:
          - text: "قدَّمَ الباحثُ دراسةً مقارنةً في الميثولوجيا العربيَّةِ قبلَ الإسلامِ."
            type: usage
      - lemma: "أُسْطُورِيَّات"
        examples:
          - text: "تُعدُّ الأسطورياتُ جزءاً لا يتجزأُ من التراثِ الشفهيِّ للشعوبِ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "مجموعةُ الأساطيرِ والخُرافاتِ المُرتبطةِ بثقافةِ شعبٍ من الشُّعوبِ أو تاريخِهِ، أو العِلْمُ الذي يدرسُ نُشوءَ هذه القصصِ وتطوُّرَها."}

