  definition:
    current: "خاصية الإحساس الغني والممتع"
    assessment:
      decision: revise
      reason: "ثلاثة عيوب: (1) دوران جزئي — 'الغني' مشتق من لمّة المجموعة (غِنًى)؛
        (2) افتقار للجنس القريب المحدد (خاصية ماذا؟ وكيف تتمايز عن سائر الخصائص الحسية؟)؛
        (3) 'الممتع' وصف عام لا يُميّز هذه الخاصية عن غيرها."
