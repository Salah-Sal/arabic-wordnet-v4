# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04996251-n  |  ILI: i63220
# definition_en: the property of a sensation that is rich and pleasing
# ══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "غياب التشكيل الكامل عن جميع اللمّات الثلاث (امتلاء، رقة، غنى)"
      - "'امتلاء' يُوثَّق في المصادر الكلاسيكية بمعنى الشبع والتخمة الجسدية (satiety) لا بوصفه خاصية حسية مجردة"
      - "'رقة' قد تُقبل للمعنى الحسي (اللطافة ومخالفة الجفاء) لكنها تحتاج دعماً معجمياً أقوى في هذا الاستعمال"
      - "'غنى' مُوثَّق أساساً بمعنى الثروة المادية والاستغناء؛ استعماله للإحساس مجازي يفتقر إلى نص شاهد مباشر"
      - "التعريف الحالي يستعمل 'الغني' المشتق من لمّة موجودة (غنى) مما يُنشئ دوراناً جزئياً"
      - "التعريف مُبهَم بنيوياً: لا جنس قريب محدد، ولا فصل نوعي واضح"
    observations: "تضم المجموعة ثلاث لمّات تغطي المفاهيم الإنجليزية fullness وmellowness وrichness.
      امتلاء مصدر يصف فعل الامتلاء لا خاصية إحساسية ثابتة، وقد خصّصه التهانوي للشبع الطبي.
      رقة قابلة للتوثيق بمعنى الصفة المخالفة للجفاء والخشونة (المعجم الكبير)، وهو ملائم للمجموعة.
      غنى مقبول مجازاً كما يُثبته المورد الحديث في 'a rich color or voice'.
      تفتقر المجموعة إلى لمّة تُغطّي البُعد الحلو الممتع (pleasantness/sweetness) تحديداً؛
      عذوبة أو رخامة مرشّحتان لسد هذه الثغرة."
  blind_candidates:
    - lemma: "نَضَارَة"
      generation_method: ishtiqaq
      justification: "من الجذر (نضر) على وزن فَعَالَة القياسي للخصائص المجردة. النضارة تجمع الحسن والجمال
        والانتعاش وخلوص اللون، وتُلائم وصف الإحساس الغني البهيج."
    - lemma: "عُذُوبَة"
      generation_method: ishtiqaq
      justification: "من الجذر (عذب) على وزن فُعُولَة للصفات والأحوال. تدل على الحلاوة والمتعة الحسية
        الذاتية، وتُغطي البُعد الممتع من التعريف 'الإحساس الغني والممتع'."
    - lemma: "رَوَاء"
      generation_method: majaz
      justification: "الرواء أصله حسن المنظر والريّ؛ يُستعار للدلالة على الإحساس المُشبِع الجميل
        كأنه ريّان من النضارة والحسن — نقله المناوي صراحةً: 'كأنه ريان من النضارة والحسن لأن الري
        يتبعه ذلك'."
    - lemma: "نُضْج"
      generation_method: majaz
      justification: "من الجذر (نضج)؛ يُستعار النضوج للدلالة على بلوغ الإحساس مدى الاكتمال والليونة،
        كما تُستخدم 'ناضج' صفةً للصوت الحلو المكتمل في نقد الموسيقى."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1: مطابقة دقيقة دفعية — اللمّات الموجودة + المرشحات (6 مصطلح × صيغتين)
#   Q2: إثراء مُدمج — تعريفات وأمثلة للمداخل المختارة (entry_ids من Q1)
#   Q3: جسر إنجليزي — translation_en IN (fullness, mellowness, richness, mellow, rich)
#   Q4: بحث FTS عربي — كلمات: امتلاء، نضارة، عذوبة، رخيم، رخامة، يانع، ناضج
#   Q5: تحقق مرشحات + مقاييس اللغة للجذور (رقق، ملأ، رخم، عذب، نضر)
stage2_evidence:
  per_lemma:

    - lemma: "امتلاء"
      contradicts:
        - text: "«الامتلاء: [في الانكليزية] Satiety، satiation، indigestion — هو أن يمتلئ البدن من خلط
            من الأخلاط الأربعة ويشرف الإنسان على العلّة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "يُوثَّق امتلاء حصراً بمعنى الشبع والتخمة الطبية (satiety/indigestion)
            لا بوصفه خاصية حسية غنية ممتعة"
        - text: "«امتلاء = occlusion»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999) — ARABTERM"
          conflict: "الاستخدام المصطلحي الموحد يخصّصه لظاهرة أرصادية (الانسداد الجوي)
            لا صلة لها بالمجموعة"
      confirm:
        - text: "«fullness = (1) امتلاء؛ اكتمال إلخ (2) تُخَمة»"
          source: "المورد الحديث (2008)"

    - lemma: "رقة"
      confirm:
        - text: "«صفة الأداء أو الصَّنْعة أو المُنتَج عندما تبعد عنه الغِلْظة»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«رِقَّةُ الألْفاظِ (فى الأدب): لُطْفها وسلاسَتُها وخِفَّتُها وحلاوَتُها»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«mellow: (3) «أ» رخيم. «ب» رقيق؛ لطيف»"
          source: "المورد الحديث (2008)"
        - text: "«(رَقَّ) الرَّاءُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا صِفَةٌ تَكُونُ مُخَالِفَةً لِلْجَفَاءِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الرِّقّة والحِفَّة — رِقّةُ الطعام — الأرض اللينة المتسعة — الضعف. يقال رجل فيه رِقَّةٌ،
            وفى عظامه رِقَّةٌ — القِلّةُ. يقال: فى ماله رِقَّةٌ»"
          source: "المعجم الوسيط (OCR)"
          addition: "يُثبت تعدد الاستعمالات؛ الملائم للمجموعة هو معنى الصفة الناعمة
            المخالفة للخشونة والجفاء وليس معاني الضعف أو القلة"

    - lemma: "غنى"
      confirm:
        - text: "«الغنى: [في الانكليزية] Richness [في الفرنسية] Richesse، opulence — بالكسر والنون
            والقصر مقابل الفقر»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«richness = غِنًى؛ ثراء إلخ»"
          source: "المورد الحديث (2008)"
        - text: "«rich: (4) قويّ؛ صارخ؛ عميق — a rich color or voice»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(غَنِيَ) الْغَيْنُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ
            عَلَى الْكِفَايَةِ، وَالْآخَرُ صَوْتٌ. فَالْأَوَّلُ الْغِنَى فِي الْمَالِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يكشف ابن فارس أن للجذر (غني) أصلاً مستقلاً في الصوت (الغناء)،
            مما يُقوّي صلته بالخاصية السمعية الغنية ويُخرجه من محض المجاز"

    - lemma: "نَضَارَة"
      confirm:
        - text: "«نضارة = freshness»"
          source: "المَكنَز الزراعي متعدد اللغات — ARABTERM"
        - text: "«نضارة = bloom»"
          source: "المَكنَز الزراعي متعدد اللغات — ARABTERM"
        - text: "«(نَضَرَ) النُّونُ وَالضَّادُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى حُسْنٍ وَجَمَالٍ وَخُلُوصٍ.
            مِنْهُ النَّضْرَةُ: حُسْنُ اللَّوْنِ. وَنَضَّرَ اللَّهُ وَجْهَهُ: حَسَّنَهُ وَنَوَّرَهُ»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "عُذُوبَة"
      confirm:
        - text: "«رَخَامَة، عُذوبة — Euphony: صفة لنوعية الصوت المستساغ حين سماعه»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
        - text: "«euphony: (1) صوت رخيم أو عذب (2) الرَّخامة: عذوبة الصوت»"
          source: "المورد الحديث (2008)"
        - text: "«(عَذَبَ) الْعَيْنُ وَالذَّالُ وَالْبَاءُ أَصْلٌ صَحِيحٌ، لَكِنَّ كَلِمَاتِهِ لَا تَكَادُ تَنْقَاسُ،
            وَلَا يُمْكِنُ جَمْعُهَا إِلَى شَيْءٍ وَاحِدٍ»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "رَوَاء"
      confirm:
        - text: "«الرواء: المنظر ومنه المثل ما له رواء ولا شاهد، وهو فعال من الري كأنه ريان من النضارة
            والحسن لأن الري يتبعه ذلك كما أن الظمأ يتبعه الذبول»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الرواء) حسن المنظر في البهاء والجمال (وأصله رؤاء)»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(الرواء) من الماء العذب والكثير المروي»"
          source: "المعجم الوسيط"
          conflict: "يحمل معنى الماء العذب لا الخاصية الحسية المجردة؛ كما أن المعنى الراسخ
            للرواء هو الجمال البصري (المنظر الحسن) لا الإحساس عموماً"

    - lemma: "نُضْج"
      confirm:
        - text: "«أصل يدل على بلوغ النهاية في طبخ الشيء ثم يستعار في كل شيء بلغ مدى الإحكام»"
          source: "مقاييس اللغة (OCR)"
        - text: "«نَضِيجُ الرَّأْي: مُحْكَمٌ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«نضج اللحم والتمر. ومن المجاز: هو نضيج الرأي»"
          source: "أساس البلاغة للزمخشري"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "امتلاء"
      decision: removed
      decision_reason: "المصادر الكلاسيكية تُوثّق امتلاء حصراً بمعنى الشبع والتخمة الطبية (كشاف
        التهانوي: satiety/indigestion)، والمصطلحي الحديث بمعنى الانسداد الأرصادي (ARABTERM).
        فضلاً عن ذلك، امتلاء مصدر يصف فعل الامتلاء (عملية/حالة) لا خاصية مجردة ثابتة
        كما تقتضيه المجموعة؛ بينما رقة وغنى يُوثَّقان بوصفهما صفتَين نوعيتَين مناسبتَين."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "رقة"
      decision: confirmed
      decision_reason: "المعجم الكبير يُوثّقها بمعنى 'صفة الأداء أو الصنعة أو المنتج عندما تبعد عنه
        الغلظة'، وهو تعريف نوعي للخاصية الحسية مباشرة. كذلك 'رقة الألفاظ = لطفها وسلاستها
        وخفتها وحلاوتها' يُثبت الاستعمال في وصف الجودة الحسية والجمالية. ومقاييس ابن فارس
        يُؤصّل الجذر في معنى 'الصفة المخالفة للجفاء'. المورد الحديث يُقابل mellow بـ 'رقيق؛ لطيف'."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُعبّر عن البُعد السلبي (غياب الخشونة والجفاء والحدة)، أي اللطافة
        والنعومة والليونة في الإحساس — في مقابل غِنًى الذي يُعبّر عن الثراء والإشباع الإيجابي،
        وعُذُوبَة التي تُعبّر عن الحلاوة الذاتية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِقَّة"

    - lemma: "غنى"
      decision: confirmed
      decision_reason: "كشاف التهانوي يُوثّقه صراحةً بـ 'Richness'. المورد الحديث يُثبت المعنى
        الحسي 'a rich color or voice = قوي؛ عميق'. ومقاييس ابن فارس يكشف أن الجذر يتضمن
        أصلاً خاصاً بالصوت (الغناء) إلى جانب الكفاية المادية، مما يُخرجه من محض المجاز
        في السياق الحسي السمعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبّر عن البُعد الإيجابي الكمّي: الإشباع والعمق والثراء في الإحساس
        وما يجعله مكتملاً غير ناقص — بخلاف رِقَّة التي تُعبّر عن غياب الخشونة،
        وعُذُوبَة التي تُعبّر عن الحلاوة الكيفية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غِنًى"

    - lemma: "نَضَارَة"
      source: stage1
      decision: removed
      decision_reason: "نضارة تُوثَّق أساساً بمعنى الانتعاش والبهاء البصري والزراعي (freshness/bloom)؛
        وهي تُعبّر عن طراوة المنظر والإشراق لا عن خاصية الإحساس الغني المكتمل.
        لا توجد شواهد على استخدامها وصفاً لكيفية الصوت أو النكهة أو الرائحة بمعنى
        الامتلاء والعذوبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "عُذُوبَة"
      source: stage1
      decision: confirmed
      decision_reason: "المعجم الموحد لمصطلحات اللسانيات يُوثّقها مع رخامة مقابلاً لـ Euphony بتعريف
        'صفة لنوعية الصوت المستساغ حين سماعه'؛ وعذوبة الصوت تعبير راسخ في العربية يُغطي
        البُعد الممتع الحلو من المجموعة الذي لا تُغطيه رِقَّة ولا غِنًى بالدرجة ذاتها.
        الجذر عذب مُوثَّق في المقاييس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُعبّر عن البُعد الكيفي الذاتي: الحلاوة الجوهرية للإحساس وكونه
        مستساغاً محبباً بطبعه — بخلاف رِقَّة التي تُعبّر عن غياب الخشونة،
        وغِنًى الذي يُعبّر عن الثراء والإشباع"
      actions:
        - command: create_entry
          params: {lemma: "عُذُوبَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "رَوَاء"
      source: stage1
      decision: removed
      decision_reason: "الرواء مُوثَّق أساساً بمعنى 'حسن المنظر في البهاء والجمال'، وهو وصف بصري
        (رؤية) لا حسي عام. استعماله وصفاً لخاصية الإحساس الغني والممتع (صوت، نكهة، رائحة)
        يحتاج إلى توثيق غير متوفر. يُضاف أنه يحمل معاني متعددة (الماء العذب، الحبل) تُشكّل
        اشتراكاً يُضعف دلالته المصطلحية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "نُضْج"
      source: stage1
      decision: removed
      decision_reason: "نضج مصدر يصف عملية النضوج (ripening/cooking) لا خاصية مجردة مستقرة.
        الاستعمال المجازي ثابت (نضيج الرأي = محكمه) لكنه مقيّد بسياقي الحكمة والتدبير،
        ولا شاهد على استخدامه وصفاً لخاصية الصوت أو النكهة أو الإحساس الحسي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
