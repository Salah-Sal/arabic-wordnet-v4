          مِنَ الخُشونةِ وَالحِدَّةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يُوصَفُ بِهِ الإِحساسُ حِينَ يَبلُغُ امتِلاءَهُ وتَتَجلَّى فِيهِ الرِّقَّةُ وَالعُذُوبةُ
          بَعيداً عَنِ الغِلظةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
