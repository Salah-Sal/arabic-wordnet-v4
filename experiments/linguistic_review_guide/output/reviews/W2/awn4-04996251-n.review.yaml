          text: "خَاصِّيَّةٌ حِسِّيَّةٌ تَجمَعُ بينَ الإِشباعِ وَالعُذُوبةِ وخُلُوِّ الإِحساسِ مِنَ الخُشونةِ وَالحِدَّةِ"
      - command: add_definition
