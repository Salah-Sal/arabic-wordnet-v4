step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُبَدِّل"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) فا change (2) الصَّرّاف؛ الصَّيْرَفيّ (ا.م).» — المورد الحديث"
      justification: "اسم فاعل من بدّل (to change/exchange)، وهو يقابل 'changer' بدقة في سياق الاستبدال."
  knowledge_candidates:
