      justification: "اسم فاعل من حوّل (to transform/convert)، ويستخدم لوصف من يغير طبيعة الشيء أو وجهته. (آلية: اشتقاق)"

step1_lemma_validation:
  per_lemma:
    - lemma: "مُعَدِّل"
      decision: confirmed
      decision_reason: "مصطلح أصيل ومستعمل بكثرة في السياقات القانونية واللغوية والتقنية للتعبير عن الشخص أو العنصر الذي يُجري تعديلاً."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "التعديل (Adjustment) هو تغيير جزئي يهدف إلى تحسين الشيء أو مواءمته مع معايير معينة، فهو أخص من التغيير المطلق."
      example: "يُعتبر المحرر مُعدِّلاً للنص الأصلي بما يتناسب مع سياسة النشر."
    - lemma: "مُغَيِّر"
      decision: confirmed
      decision_reason: "اسم فاعل مشتق من الفعل 'غيّر'، وهو اللفظ العام والأكثر شيوعاً للتعبير عن القائم بفعل التغيير."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "التغيير (Change) هو اللفظ العام الذي يشمل كل صور الانتقال من حال إلى حال، سواء كان كلياً أو جزئياً."
      example: "يُعد الفلاسفة من كبار المُغيِّرين للأفكار السائدة في مجتمعاتهم."
    - lemma: "مُبَدِّل"
      source: step05
      decision: confirmed
      decision_reason: "مرادف قوي لـ 'مغير'، ويركز على جانب الاستبدال (Replacement)، وهو شائع في الاستعمال الوظيفي والتقني."
      step05_citation: "«(1) فا change...» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "التبديل (Replacement/Exchange) يركز على إزالة شيء ووضع آخر مكانه، بينما التغيير قد يكون في ذات الشيء."
      example: "كان المُبدِّل يقوم بإحلال قطع غيار حديثة مكان الأجزاء المتهالكة في الماكينة."
      actions:
        - command: create_entry
          params:
            lemma: "مُبَدِّل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09632901-n"
    - lemma: "مُحَوِّل"
      source: step05
      decision: removed
      decision_reason: "على الرغم من صحة الاشتقاق، إلا أن اللفظ غلبت عليه التسمية الآلية (transformer/converter) وصار نادراً ما يستخدم لوصف الأشخاص."
      step05_citation: "شائع في المعجم الموحد لأسماء الآلات والأجهزة الكهربائية."

