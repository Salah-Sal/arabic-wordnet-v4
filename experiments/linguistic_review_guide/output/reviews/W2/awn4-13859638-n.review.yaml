stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - المجموعة تقتصر على لمة واحدة بينما توجد مرادفات شائعة في المعاجم الحديثة.
    observations: "المفهوم يشير إلى الرابطة الرسمية التي تنشأ بين مقدم الخدمة (المتخصص) ومتلقيها، وهو مفهوم تداولي واصطلاحي مستقر في الدراسات الاجتماعية والمهنية."
  blind_candidates:
    - lemma: "عَلَاقَةٌ مِهْنِيَّةٌ"
      generation_method: tarkib
      justification: "تعبير وصفي مباشر ومستقر دلالياً يعبر عن المفهوم."
    - lemma: "صِلَةٌ مِهْنِيَّةٌ"
      generation_method: tarkib
      justification: "ورد في معجم المورد الحديث كمرادف للصلة الاجتماعية والتجارية."
    - lemma: "ارْتِبَاطٌ مِهْنِيٌّ"
      generation_method: tarkib
      justification: "يشير إلى الجانب التعاقدي أو الإجرائي في العلاقة."
    - lemma: "رَابِطَةٌ مِهْنِيَّةٌ"
      generation_method: tarkib
      justification: "يستخدم أحياناً للتعبير عن العلاقة القوية بين التخصصات أو الأشخاص في سياق مهني."

stage2_evidence:
  per_lemma:
    - lemma: "عَلَاقَة مِهْنِيَّة"
      confirm:
        - text: "«...لقضاء مصالح لا علاقة لها بالتزامات تعليمية أو مهنية.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«(1) «أ» صِلة؛ علاقة. ... (4) «أ», صلة اجتماعية أو مهنية أو تجارية.»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد استخدام 'علاقة' و'صلة' في السياق المهني."
    - lemma: "صِلَةٌ مِهْنِيَّةٌ"
      confirm:
        - text: "«صلة اجتماعية أو مهنية أو تجارية.»"
          source: "المورد الحديث (2008)"
    - lemma: "ارْتِبَاطٌ مِهْنِيٌّ"
      evidence_status: "no_material_found"
    - lemma: "رَابِطَةٌ مِهْنِيَّةٌ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عَلَاقَة مِهْنِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مستقر وشائع الاستخدام في السياقات الإدارية والاجتماعية والطبية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَلَاقَةٌ مِهْنِيَّةٌ"
    - lemma: "صِلَةٌ مِهْنِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح وموثق في المعاجم الحديثة (المورد الحديث)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "صِلَةٌ مِهْنِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13859638-n"}

stage4_content:
  definition:
    current: "العلاقة التي توجد عندما يطلب شخص مساعدة مهنية من مصدر مؤهل ويتم منحها له"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي نوعاً ما؛ يفضل صياغته بأسلوب معجمي أكثر دقة وسلاسة."
    authored:
      - type: terminological
        text: "الصِّلةُ التي تَقُومُ بينَ شخصٍ يَطلبُ مَعُونةً مُتخصِّصةً وبينَ مَصْدَرٍ مُؤهَّلٍ يَقومُ بتقديمِها له."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "عَلَاقَةٌ مِهْنِيَّةٌ"
        examples:
          - text: "تَقومُ العَلَاقَةُ المِهْنِيَّةُ بينَ الطَّبِيبِ ومَرِيضِهِ على الثِّقَةِ المُتَبَادَلَةِ."
            type: usage
      - lemma: "صِلَةٌ مِهْنِيَّةٌ"
        examples:
          - text: "يَسْعَى المُوظَّفُ لِبِنَاءِ صِلَةٍ مِهْنِيَّةٍ قَوِيَّةٍ مع زُمَلائِهِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13859638-n", definition_index: 0, text: "الصِّلةُ التي تَقُومُ بينَ شخصٍ يَطلبُ مَعُونةً مُتخصِّصةً وبينَ مَصْدَرٍ مُؤهَّلٍ يَقومُ بتقديمِها له."}

