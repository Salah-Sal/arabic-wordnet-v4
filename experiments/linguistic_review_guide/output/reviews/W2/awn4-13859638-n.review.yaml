        - word: "مهنية"
          root: "مهن"
          maqayis_quote: "«الْمِيمُ وَالْهَاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى احْتِقَارٍ وَحَقَارَةٍ فِي الشَّيْءِ. ... وَمِنَ الْبَابِ الْمَهْنُ: الْخِدْمَةُ، وَالْمِهْنَةُ.»"
