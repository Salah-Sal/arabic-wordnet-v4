stage1_review:
  assessment:
    concerns:
      - "كلمة 'مدير' في العربية المعاصرة غلب عليها معنى 'المدير الإداري' (Manager/Director)، مما قد يجعل مصطلح 'مدير الحبل' ملتبساً في غير سياقه، رغم صحته اللغوية الاشتقاقية من الفعل 'أدار'."
    observations: "المجموعة تصف دوراً حركياً في لعبة القفز بالحبل. التعريف العربي في الشبكة (AWN) يستخدم الفعل 'أدار'، وهو ما يبرر وجود 'مدير الحبل'. ومع ذلك، فإن الفعل 'دوّر' (من التدوير) أكثر تخصيصاً للحركة الدائرية الحسية، ولذا فإن 'مدور الحبل' قد يكون أكثر دقة في الوصف الحسي."
  blind_candidates:
    - lemma: "مُدَوِّر الْحَبْل"
      generation_method: tarkib
      justification: "استخدام اسم الفاعل من الفعل 'دوّر' الذي يفيد تحريك الشيء حركة دائرية، وهو الوصف الأدق لعملية تحريك الحبل في هذه اللعبة."
    - lemma: "مُدِير الْحَبْل"
      generation_method: tarkib
      justification: "مشتق من الفعل 'أدار' الوارد في تعريف المجموعة، ويعبر عن الشخص الذي يجعل الحبل يدور."
    - lemma: "مُؤَرْجِح الْحَبْل"
      generation_method: tarkib
      justification: "من الفعل 'أرجح' الذي يصف حركة الحبل القوسية (المرجحة) التي يقوم بها الشخصان."
    - lemma: "لَوَّاح"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من 'لوّح' (بالحبل)، وتصف الشخص الذي يحرك الحبل في الهواء."

stage2_evidence:
  per_lemma:
    - lemma: "مُدِير الْحَبْل"
      confirm:
        - text: "«(المدير) من يتولى تصريف أمر من الأمور»"
          source: "المعجم الوسيط"
        - text: "«(أدار) الشيءَ: جعله يدور»"
          source: "المعجم الكبير"
    - lemma: "مُدَوِّر الْحَبْل"
      confirm:
        - text: "«مُدَوِّر: من (د و ر) من يجعل الشيء يدور»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«المُدَوِّر: ما تجعله يدور»"
          source: "المعجم الوسيط"
    - lemma: "مُؤَرْجِح الْحَبْل"
      evidence_status: "no_material_found"
    - lemma: "لَوَّاح"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُدِير الْحَبْل"
      decision: confirmed
      decision_reason: "مصطلح سليم لغوياً ويتسق تماماً مع الفعل المستخدم في تعريف المجموعة 'يديران'، ورغم غلبة الاستخدام الإداري لكلمة مدير، إلا أن الإضافة 'الحبل' تزيل اللبس وتحدده في السياق الفيزيائي/الحركي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدِير الْحَبْل"
    - lemma: "مُدَوِّر الْحَبْل"
      source: stage1
      decision: confirmed
      decision_reason: "أكثر دقة في وصف الحركة الدائرية اليدوية للحبل، وله شواهد في المعاجم الحديثة (قابوس) التي تميز بين المدير (إداري) والمدور (حركي)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "مُدَوِّر الْحَبْل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مُؤَرْجِح الْحَبْل"
      decision: removed
      decision_reason: "المرجحة قد لا تعني بالضرورة الدوران الكامل الذي تتطلبه لعبة القفز بالحبل، كما أن المصطلح غير شائع."
    - lemma: "لَوَّاح"
      decision: removed
      decision_reason: "كلمة عامة جداً وتستخدم عادة للتلويح باليد أو الراية، ولا تخصيص فيها للعبة."

stage4_content:
  definition:
    current: "أحد شخصين يديران الحبال ليقفز فوقها اللاعبون في لعبة القفز بالحبل"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويحدد الدور والوظيفة والسياق (لعبة القفز بالحبل) بشكل كافٍ."
  examples:
    per_lemma:
      - lemma: "مُدِير الْحَبْل"
        examples:
          - text: "يقوم مدير الحبل بمزامنة حركته مع زميله لضمان دوران منتظم يسمح للأطفال بالقفز."
            type: usage
      - lemma: "مُدَوِّر الْحَبْل"
        examples:
          - text: "يتطلب دور مدور الحبل مهارة في التحكم بسرعة الدوران لتناسب إيقاع القافز."
            type: usage

