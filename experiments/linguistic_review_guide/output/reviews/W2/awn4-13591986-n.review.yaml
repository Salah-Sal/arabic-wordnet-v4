        - text: "«تَقَرُّح: exulceratio (ulceration)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَقَرُّح: helcosis (ulceration)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَقَرُّح: elcosis (helcosis)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تقرح: ulceration» — domain: Hygienics and Human Body"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
        - text: "«تكوين القروح.» — ترجمة إنجليزية: helcosis"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«(1) تقرُّح (2) قَرْحَة.» — ulceration"
          source: "المورد الحديث (2008)"
        - text: "«تَقَرَّحَ الجَسَدُ: علَتْهُ القُرُوحُ — فلانٌ للأَمْر: تصدَّى له»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(تقرح) الجَسَد علته القروح وفلان للأمر تصدى له»"
          source: "المعجم الوسيط (رواية الهاورماني)"
      expands:
        - text: "«تَقَرُّحٌ رَضْحِيّ: traumatic ulceration»"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يدل على أن تَقَرُّح يُستعمل كمصطلح أساسي يُوصف بصفات متعددة (رضحي، إقفاري...)
            مما يثبت كونه الجذع المصطلحي للمفهوم.
        - text: "«تَقَرُّحٌ إِقْفارِيٌّ: ischemic ulceration»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "تأكيد إضافي على إنتاجية التركيب الوصفي مع تَقَرُّح."
        - text: "«الْتِهابٌ تَقَرُّحِيّ: ulcerative inflammation» — الصفة تَقَرُّحِيّ منسوبة إليه"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُثبت أن تَقَرُّح يُولّد صفة نسبية (تَقَرُّحِيّ) مُعترفاً بها في المصطلحية
            الطبية المعيارية، وهو دليل على التثبيت المعجمي الكامل.

    # ── المرشح الأول (يطابق اللمة الموجودة) ──
    - lemma: "إِقْرَاح"
      evidence_status: "no_material_found"

    - lemma: "اسْتِقْرَاح"
      evidence_status: "no_material_found"

    - lemma: "قَرْحَنَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
