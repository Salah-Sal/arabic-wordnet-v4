# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — قُرئ الملف المُقنّع أولاً بدون الاطلاع على اللمات
  blind_candidates:
    - lemma: "تَقَرُّح"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل الخماسي "تَقَرَّحَ" على وزن تَفَعُّل، وهو الوزن القياسي للدلالة
        على عملية التحوّل التلقائي إلى حالة ما (كتَفَتُّت، تَحَجُّر، تَصَلُّب).
        الجذر ق-ر-ح أصيل للدلالة على الجرح والقرحة، واشتقاق المصدر الخماسي يُعبّر
        بدقة عن "العملية الذاتية لتحوّل النسيج إلى قرحة".

    - lemma: "إِقْرَاح"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل الرباعي "أَقْرَحَ" على وزن إِفْعَال، يدل على إحداث عملية القَرْح.
        يُفيد الجانب التعدّي (إحداث القرحة) في مقابل الجانب اللازم (تَقَرُّح). طُرح
        كبديل مصطلحي لتغطية المفهوم من زاوية سببية.

    - lemma: "اسْتِقْرَاح"
      generation_method: ishtiqaq
      justification: >
        مصدر Form X "اسْتَقْرَحَ" على وزن اسْتِفْعَال. وزن الاستفعال يُعبّر أحياناً
        عن حصول الحالة تدريجياً أو عن "طلب" الوصول إليها. طُرح كاحتمال اشتقاقي
        للتعبير عن استحالة النسيج إلى قرحة بصورة تدريجية.

    - lemma: "قَرْحَنَة"
      generation_method: ishtiqaq
      justification: >
        مصدر قياسي على وزن فَعْلَنَة الذي يدل في المصطلحية الحديثة على عملية
        التحوّل والصيرورة (كالأمركة والعولمة). يُبنى من مادة "قَرْح" للدلالة على
        "عملية التقرّح". طُرح لأن وزن فَعْلَنَة منتج في المصطلحية الطبية.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمة الوحيدة 'تقرح' مكتوبة بدون تشكيل — يجب تحديثها إلى 'تَقَرُّح' بتشكيل كامل."
      - "المجموعة تحتوي على لمة واحدة فقط، وهو أمر طبيعي للمصطلحات الطبية المتخصصة، لكن
         يمكن النظر في إضافة مرادف إن وُجد."
      - "التعريف الحالي 'عملية تكون القرحة' صحيح لكنه مقتضب ويمكن إثراؤه باتساق المعجم الوسيط."
    observations: >
      المجموعة الترادفية تمثل مفهوماً طبياً دقيقاً: عملية التقرح البيولوجية (ulceration).
      اللمة "تقرح" مشتقة اشتقاقاً صرفياً سليماً على مصدر تَفَعُّل، وهو الوزن القياسي
      للعمليات البيولوجية التلقائية في العربية المعاصرة. المصطلح موثّق على نطاق واسع في
      المعاجم الطبية المتخصصة (المعجم الطبي الموحد، معجم المصطلحات الطبية، المورد الحديث).
      الجذر ق-ر-ح عريق في اللغة، وله ثلاثة أصول في مقاييس اللغة لابن فارس، وأوّلها يدل
      على الألم بالجراح — وهو الأصل المرتبط بهذه المجموعة. لا إشكال في الصحة الصرفية ولا
      في الملاءمة الدلالية، والإجراء الوحيد المطلوب هو إضافة التشكيل الكامل.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
