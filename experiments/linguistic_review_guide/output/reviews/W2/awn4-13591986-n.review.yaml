    current: "عملية تكون القرحة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح دلالياً لكنه مقتضب جداً وشبه دائري (يستخدم "القرحة"
        التي هي أصل الجذر دون تعريف الجنس البيولوجي المحدد). يفتقر إلى: (١) تحديد
        طبيعة العملية (تآكل الأنسجة)، (٢) الجنس القريب (عملية حيوية مرضية)،
        (٣) الفصل النوعي (تآكل الجلد أو الغشاء المخاطي). يجب إثراؤه وفق أسلوب
        المعجم الوسيط في الدقة التعريفية.
    authored:
      - type: terminological
        text: >
          عمليةٌ حيويةٌ مرضيةٌ تتآكل فيها الطبقاتُ السطحيةُ من الجلد أو الغشاء
          المخاطي وتنهار، فتُفضي إلى تكوُّن قُرُوحٍ مفتوحة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          ظاهرةٌ نسيجيةٌ تبدأ بتنخُّر الخلايا الظهارية أو تضرُّرها جراء التهاب
          أو ضغط أو نقص تروية أو عدوى، فيتفتّت النسيج السطحي ويتآكل حتى يتكشّف
          الجلد أو الغشاء المخاطي الداخلي على شكل قرحة. تُصيب المعدة والأمعاء
          والجلد والأعضاء الداخلية.
