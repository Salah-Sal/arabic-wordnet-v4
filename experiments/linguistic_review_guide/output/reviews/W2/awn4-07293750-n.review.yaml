stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة الموجودة (نظام لغوي) تفتقر إلى التشكيل الكامل."
      - "الافتقار إلى مصطلحات تراثية معربة مستقرة في اللسانيات مثل (اللسان) و(النسق)."
    observations: "المفهوم علمي تخصصي يتعلق باللسانيات، وهو يصف اللغة كنظام مجرد من القواعد والعناصر. المصطلح الحالي دقيق، ولكن يمكن إثراؤه ببدائل اصطلاحية مستقرة في الدرس اللساني العربي الحديث."
  blind_candidates:
    - lemma: "نِظَامٌ لُغَوِيٌّ"
      generation_method: tarkib
      justification: "الوصف المباشر والمصطلح الشائع في اللسانيات العربية المعاصرة."
    - lemma: "لِسَانٌ"
      generation_method: majaz
      justification: "مصطلح تراثي (لسان العرب) استعادته اللسانيات الحديثة (بقيادة دي سوسير ومترجميه) للدلالة على النظام اللغوي المجرد (Langue)."
    - lemma: "نَسَقٌ لُغَوِيٌّ"
      generation_method: tarkib
      justification: "استخدام كلمة (نسق) يعبر عن الترابط والنظام المحكم، وهو مصطلح مركزي في البنيوية اللسانية."
    - lemma: "بِنْيَةٌ لُغَوِيَّةٌ"
      generation_method: tarkib
      justification: "يركز على الجانب الهيكلي للنظام اللغوي."

stage2_evidence:
  per_lemma:
    - lemma: "نِظَام لُغَوِيّ"
      confirm:
        - text: "«صفة شكل معجمي أو بنية تركيبية تنتمي إلى نظام لغوي متقادم...»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "لِسَان"
      confirm:
        - text: "«اللِّسَانُ: اللُّغَةُ... وَاللِّسْنُ: اللُّغَةُ، يُقَالُ: لِكُلِّ قَوْمٍ لِسْنٌ أَيْ لُغَةٌ.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«اللِّسانُ... واللُّغَةُ، والرِّسالَةُ... وقرئ: وما أرسلنا من رسول إلا بلسن قومه أي بلغتهم.»"
          source: "القاموس المحيط"
      expands:
        - text: "«اللسان: الجارحة وقوتها... ولكل لسان نغمة مخصوصة يميزها السمع.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "نَسَق لُغَوِيّ"
      confirm:
        - text: "«نسق لغوي ذو قواعد تأليف ومفردات معجمية ناتجة عن لغات متمازجة...»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«تبدل يتمثل في ظهور تقابل مميز جديد في نسق لغوي معين.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "بِنْيَة لُغَوِيَّة"
      confirm:
        - text: "«ظهور عناصر لغوية بشكل متكرر في النص نفسه وفي وضع محدد.» (استخدام عناصر لغوية)"
          source: "مسرد الإعلام والتواصل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "نظام لغوي"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع الاستخدام في الأدبيات اللسانية، وموثق في المعاجم المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَام لُغَوِيّ"
    - lemma: "لِسَان"
      source: stage1
      decision: confirmed
      decision_reason: "أصيل في اللغة العربية ومعبر عن النظام اللغوي (Langue) في اللسانيات البنيوية، وموثق في المعاجم القديمة بمعنى اللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "لِسَان", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَسَق لُغَوِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مركزي في المدرسة البنيوية للتعبير عن النظام كشبكة من العلاقات، وموثق في معاجم المصطلحات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "نَسَق لُغَوِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَنْظُومَة لُغَوِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "استخدام (منظومة) يعزز معنى النظام المترابط المذكور في التعريف."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مَنْظُومَة لُغَوِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بِنْيَة لُغَوِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مكمل يركز على الجانب الهيكلي (Structural) للنظام اللغوي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "بِنْيَة لُغَوِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "نظام من الوحدات أو العناصر اللغوية المستخدمة في لغة معينة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية، ويفضل صياغته بأسلوب معجمي عربي يبرز الوظيفة البنيوية."
    authored:
      - type: terminological
        text: "جُملة القواعد والقوانين التي تحكم العناصر والوحدات اللغوية وتؤلف بينها في لغة معينة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "جُملة القواعد والقوانين التي تحكم العناصر والوحدات اللغوية وتؤلف بينها في لغة معينة."}
  examples:
    per_lemma:
      - lemma: "نِظَام لُغَوِيّ"
        examples:
          - text: "يتألف النظام اللغوي من مستويات صواتية وصرفية ونحوية متكاملة."
            type: usage
      - lemma: "لِسَان"
        examples:
          - text: "يعد اللسان نظاماً من العلامات اللسانية التي تعبر عن الأفكار والمفاهيم."
            type: usage
      - lemma: "نَسَق لُغَوِيّ"
        examples:
          - text: "تكتسب العناصر اللغوية قيمتها من خلال موقعها في النسق اللغوي العام."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "دراسة أي لغة تقتضي فهم النظام اللغوي الذي يحكمها."}

stage5_enrichment:
  per_entry:
    - lemma: "نِظَام لُغَوِيّ"
      entry_id: "{auto}"
      roots:
        - word: "نظام"
          root: "نظم"
          maqayis_quote: "«النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتَأْلِيفِهِ... وَالنِّظَامُ: الْخَيْطُ يَجْمَعُ الْخَرَزَ.»"
        - word: "لغوي"
          root: "لغو"
          maqayis_quote: "«اللَّامُ وَالْغَيْنُ وَالْوَاوُ أَصْلٌ يَدُلُّ عَلَى الشَّيْءِ لَا يُعْتَدُّ بِهِ... وَاللُّغَةُ أَصْلُهَا لُغْوَةٌ.»"
    - lemma: "لِسَان"
      entry_id: "{auto}"
      root: "لسن"
      maqayis_quote: "«اللَّامُ وَالسِّينُ وَالنُّونُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى طُولٍ لَطِيفٍ غَيْرِ بَائِنٍ... وَاللِّسْنُ: اللُّغَةُ.»"
    - lemma: "نَسَق لُغَوِيّ"
      entry_id: "{auto}"
      roots:
        - word: "نسق"
          root: "نسق"
          maqayis_quote: "«النُّونُ وَالسِّينُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَتَابُعٍ فِي الشَّيْءِ... وَكَلَامٌ نَسَقٌ: جَاءَ عَلَى نِظَامٍ وَاحِدٍ.»"
        - word: "لغوي"
          root: "لغو"
          maqayis_quote: "«اللَّامُ وَالْغَيْنُ وَالْوَاوُ أَصْلٌ يَدُلُّ عَلَى الشَّيْءِ لَا يُعْتَدُّ بِهِ.»"
    - lemma: "بِنْيَة لُغَوِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "بنية"
          root: "بني"
          maqayis_quote: "«الْبَاءُ وَالنُّونُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ بِنَاءُ الشَّيْءِ بِضَمِّ بَعْضِهِ إِلَى بَعْضٍ.»"
        - word: "لغوية"
          root: "لغو"
          maqayis_quote: "«اللَّامُ وَالْغَيْنُ وَالْوَاوُ أَصْلٌ يَدُلُّ عَلَى الشَّيْءِ لَا يُعْتَدُّ بِهِ.»"
  per_sense:
    - lemma: "نِظَام لُغَوِيّ"
      sense_id: "{auto}"
      nuance: "المصطلح العام والأكثر شمولاً لوصف مجموع القواعد والعناصر."
      mwe: true
    - lemma: "لِسَان"
      sense_id: "{auto}"
      nuance: "يركز على اللغة كنظام مجرد ومشترك بين أفراد المجتمع (بالمعنى السوسيري)."
      mwe: false
    - lemma: "نَسَق لُغَوِيّ"
      sense_id: "{auto}"
      nuance: "يؤكد على العلاقات والروابط المنطقية بين الوحدات داخل النظام."
      mwe: true
    - lemma: "بِنْيَة لُغَوِيَّة"
      sense_id: "{auto}"
      nuance: "يركز على الهيكل أو التكوين المادي والشكلي للنظام."
      mwe: true
    - lemma: "مَنْظُومَة لُغَوِيَّة"
      sense_id: "{auto}"
      nuance: "مرادف للنظام مع التركيز على صفة الانتظام والترابط الوثيق."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح العام والأكثر شمولاً لوصف مجموع القواعد والعناصر.","mwe":true}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
