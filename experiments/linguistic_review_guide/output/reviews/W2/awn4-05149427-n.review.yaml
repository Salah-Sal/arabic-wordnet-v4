stage4_content:
  definition:
    current: "ما هو مرضي أو قيم أو مفيد"
    assessment:
      decision: revise
      reason: >
        التعريف ترجمة حرفية من الإنجليزية (that which is pleasing or valuable or useful)؛
        لفظ «مرضي» في العربية يعني satisfactory لا pleasing، و«قيم» بمعنى valuable غير متداول
        في هذا الاستخدام الصفي، كما أن الصياغة بـ«ما هو» ركيكة ولا تعكس أسلوب المعجم الوسيط.
