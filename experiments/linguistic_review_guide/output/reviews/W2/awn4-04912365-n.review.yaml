stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف العربي الحالي مختصر جداً ويحتاج إلى صياغة معجمية أكثر دقة."
    observations: "المفهوم يدور حول قابلية التوجيه والإقناع (Tractability). اللمّتان الموجودتان (قياد، مطاوعة) صحيحتان ودقيقتان، ولكن يمكن إثراء المجموعة بمرادفات أخرى تعبر عن الحالة النفسية لهذه السمة مثل (انقياد) و(لين)."
  blind_candidates:
    - lemma: "انْقِيَاد"
      generation_method: ishtiqaq
      justification: "المصدر الصريح للفعل (انقاد)، وهو يعبر مباشرة عن حالة المطاوعة والقبول بالقيادة والإقناع."
    - lemma: "لِين"
      generation_method: majaz
      justification: "يستخدم مجازاً للتعبير عن سهولة المعاملة وعدم العناد (لين الجانب/العريكة)، وهو مرادف دقيق لـ flexibility في السياق الشخصي."
    - lemma: "سَلَاسَة"
      generation_method: majaz
      justification: "تعبر عن السهولة وعدم التعقيد، وتستخدم في وصف الشخص (سلس القياد) لبيان سهولة إقناعه."
    - lemma: "طَوَاعِيَة"
      generation_method: ishtiqaq
      justification: "صيغة تدل على التقبل الطوعي والانقياد، وهي مناسبة للمصطلحات العلمية والتقنية (compliance/tractability)."

stage2_evidence:
  per_lemma:
    - lemma: "قياد"
      confirm:
        - text: "«فلان سَلس القياد يتابعك على هَوَاك وأعْطى فلان القياد أذعن»"
          source: "المعجم الوسيط"
    - lemma: "مطاوعة"
      confirm:
        - text: "«المطاوعة: قبُول الشَّيْء رَغْبَة»"
          source: "دستور العلماء"
      expands:
        - text: "«المطاوعة: حصول الأثر عن تعلق الفعل المتعدي بمفعوله»"
          source: "التعريفات للجرجاني"
          addition: "تستخدم في السياق اللغوي والتقني للدلالة على الاستجابة للفعل."
    - lemma: "انقياد"
      confirm:
        - text: "«باب انقياد الامر: سهل المرام قريب المتناول...»"
          source: "الألفاظ المختلفة لابن مالك"
        - text: "«ودانوا باتباعه والانقياد إليه»"
          source: "تكملة المعاجم (دوزي)"
    - lemma: "لين"
      confirm:
        - text: "«لِين الجانب/الطَّبْع/العريكة: لُطْفٌ في الطَّبع أو سهولة الانقياد»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«رجل لين الجانب: سهل المعاملة سلس»"
          source: "أساس البلاغة"
    - lemma: "سلاسة"
      confirm:
        - text: "«سلاسة اللفظ سهولته ورقته وانسجامه»"
          source: "المعجم الوسيط"
        - text: "«سَلَاسَةُ اللَّفْظ: سُهولته ورقَّتُه وانسجامُه. يقال: فى كلامه سَلَاسَةٌ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«السلاسة: مرادف للهشاشة وعكس اللزوجة»"
          source: "كشاف اصطلاحات الفنون"
          conflict: "السلاسة بمفردها غالباً ما تشير إلى الأسلوب أو الخصائص الفيزيائية، بينما تحتاج إلى مضاف إليه (سلاسة القياد) لتعبر عن السمة الشخصية."

stage3_analysis:
  per_lemma:
    - lemma: "قِيَاد"
      decision: confirmed
      decision_reason: "مصطلح تراثي أصيل يعبر عن سهولة الانقياد والإذعان، وهو صلب المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِيَاد"
    - lemma: "مُطَاوَعَة"
      decision: confirmed
      decision_reason: "يعبر عن القبول الطوعي وعدم الممانعة، وهو دقيق جداً في مقابلة (tractability)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُطَاوَعَة"
    - lemma: "انْقِيَاد"
      source: stage1
      decision: confirmed
      decision_reason: "المصدر المباشر للفعل (انقاد)، وهو شائع الاستخدام في السياقات النفسية والاجتماعية لسهولة الإقناع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "انْقِيَاد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "لِين"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الجانب الأخلاقي والنفسي للسمة (لين الجانب)، وهو مرادف دقيق لـ flexibility في الشخصية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "لِين", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "سمة سهولة الإقناع"
    assessment:
      decision: revise
      reason: "التعريف الحالي غير مهيكل معجمياً؛ يفتقر إلى الجنس القريب والفصل النوعي."
    authored:
      - type: linguistic
        text: "خَصْلَةٌ نَفْسِيَّةٌ تَعْنِي قَابِلِيَّةَ المَرْءِ لِلِانْصِيَاعِ وَتَقَبُّلِ التَّأْثِيرِ أَوْ الإِقْنَاعِ بِيُسْرٍ وَدُونَ عَنَاءٍ أَوْ مُقَاوَمَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "خَصْلَةٌ نَفْسِيَّةٌ تَعْنِي قَابِلِيَّةَ المَرْءِ لِلِانْصِيَاعِ وَتَقَبُّلِ التَّأْثِيرِ أَوْ الإِقْنَاعِ بِيُسْرٍ وَدُونَ عَنَاءٍ أَوْ مُقَاوَمَةٍ."}
  examples:
    per_lemma:
      - lemma: "قِيَاد"
        examples:
          - text: "يُعْرَفُ بِسَلَاسَةِ القِيَادِ، فَلَا يَكَادُ يُعَارِضُ رَأْيًا يُعْرَضُ عَلَيْهِ."
            type: usage
      - lemma: "مُطَاوَعَة"
        examples:
          - text: "أَبْدَى مُطَاوَعَةً كَبِيرَةً فِي تَنْفِيذِ القَرَارَاتِ الجَدِيدَةِ."
            type: usage
      - lemma: "انْقِيَاد"
        examples:
          - text: "يُعَابُ عَلَيْهِ سُرْعَةُ الانْقِيَادِ لِآرَاءِ الآخَرِينَ بِمُجَرَّدِ مَعْرِفَتِهَا."
            type: usage
      - lemma: "لِين"
        examples:
          - text: "عُرِفَ بِلِينِ العَرِيكَةِ، مِمَّا جَعَلَهُ سَهْلَ المِرَاسِ وَمَحْبُوبًا لَدَى زُمَلَائِهِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعْرَفُ بِسَلَاسَةِ القِيَادِ، فَلَا يَكَادُ يُعَارِضُ رَأْيًا يُعْرَضُ عَلَيْهِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أَبْدَى مُطَاوَعَةً كَبِيرَةً فِي تَنْفِيذِ القَرَارَاتِ الجَدِيدَةِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعَابُ عَلَيْهِ سُرْعَةُ الانْقِيَادِ لِآرَاءِ الآخَرِينَ بِمُجَرَّدِ مَعْرِفَتِهَا."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "عُرِفَ بِلِينِ العَرِيكَةِ، مِمَّا جَعَلَهُ سَهْلَ المِرَاسِ وَمَحْبُوبًا لَدَى زُمَلَائِهِ."}

stage5_enrichment:
  per_entry:
    - lemma: "قِيَاد"
      entry_id: "{auto}"
      root: "قود"
      maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى امْتِدَادٍ فِي الشَّيْءِ... قُدْتُ الْفَرَسَ قَوْدًا، وَذَلِكَ أَنْ تَمُدَّهُ إِلَيْكَ; وَهُوَ الْقِيَاسُ... وَفَرَسٌ قَؤُودٌ: سَلَسٌ مُنْقَادٌ.»"
    - lemma: "مُطَاوَعَة"
      entry_id: "{auto}"
      root: "طوع"
      maqayis_quote: "«الطَّاءُ وَالْوَاوُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى الْإِصْحَابِ وَالِانْقِيَادِ. يُقَالُ: طَاعَهُ يَطُوعُهُ، إِذَا انْقَادَ مَعَهُ وَمَضَى لِأَمْرِهِ.»"
    - lemma: "انْقِيَاد"
      entry_id: "{auto}"
      root: "قود"
      maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى امْتِدَادٍ فِي الشَّيْءِ... قُدْتُ الْفَرَسَ قَوْدًا... وَفَرَسٌ قَؤُودٌ: سَلَسٌ مُنْقَادٌ.»"
    - lemma: "لِين"
      entry_id: "{auto}"
      root: "لين"
      maqayis_quote: "«اللَّامُ وَالْيَاءُ وَالنُّونُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ اللِّينُ: ضِدُّ الْخُشُونَةِ... وَفُلَانٌ مَلْيَنَةٌ، أَيْ لَيِّنُ الْجَانِبِ.»"
  per_sense:
    - lemma: "قِيَاد"
      sense_id: "{auto}"
      nuance: "يركز على قابلية الشخص لأن يُقاد أو يُوجّه، وغالباً ما يستعمل في تعبير 'سلس القياد'."
      mwe: false
    - lemma: "مُطَاوَعَة"
      sense_id: "{auto}"
      nuance: "يركز على الاستجابة الإيجابية والموافقة الرغبية للفعل أو الطلب."
      mwe: false
    - lemma: "انْقِيَاد"
      sense_id: "{auto}"
      nuance: "يعبر عن الحالة العامة للتسليم برأي الآخرين واتباعهم."
      mwe: false
    - lemma: "لِين"
      sense_id: "{auto}"
      nuance: "يشير إلى السمة النفسية التي تجعل الشخص رقيق المعاملة وغير صلب في مواقفه (لين الجانب)."
      mwe: false
  synset:
