stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية (تليين) بصيغة التفعيل تدل عادة على فعل متعدٍ مقصود (إحداث اللين بواسطة فاعل)، في حين أن المفهوم يشير إلى عملية طبيعية (صيرورة/التحول إلى ليونة)."
    observations: "المفهوم الإنجليزي (softening) يحمل دلالة العملية الطبيعية بدليل ارتباطه بالمفهوم الأعم (natural process). يقابل ذلك في العربية صيغة المطاوعة (تَفَعُّل) التي تعبر عن الصيرورة التلقائية، ولذا فإن (تَلَيُّن) هو الأدق."
  blind_candidates:
    - lemma: "تَلَيُّن"
      generation_method: ishtiqaq
      justification: "مصدر على وزن (تَفَعُّل) للدلالة على عملية التحول والصيرورة التلقائية للين."
    - lemma: "لِين"
      generation_method: ishtiqaq
      justification: "المصدر الأصلي الدال على النعومة وعكس الخشونة، وقد يُستخدم للدلالة على الحالة والعملية معاً."
    - lemma: "طَرَاوَة"
      generation_method: ishtiqaq
      justification: "مصدر يدل على حالة الغضاضة والنعومة المكتسبة للشيء."
    - lemma: "رَخَاوَة"
      generation_method: ishtiqaq
      justification: "مصدر يدل على الهشاشة وسهولة الانثناء، ويقارب اللين في الأجسام."

stage2_evidence:
  per_lemma:
    - lemma: "تليين"
      confirm:
        - text: "«ليَّنَ الشَّيءَ: جعله ليِّنًا مَرِنًا طائِعًا»"
          source: "معجم اللغة العربية المعاصرة"
      contradicts:
        - text: "«ليَّنَ الشَّيءَ: جعله ليِّنًا»"
          source: "معجم اللغة العربية المعاصرة"
          conflict: "المصدر يدل على إحداث اللين بشكل متعمد (تعدية)، بينما المفهوم يعبر عن عملية طبيعية تلقائية."
    - lemma: "تَلَيُّن"
      confirm:
        - text: "«تليَّنَ الشَّيءُ: مُطاوع ليَّنَ: صار لدنًا قابلاً للانثناء، عكسه تصلَّب»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«تليُّن [مفرد]: مصدر تليَّنَ/ تليَّنَ لـ.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "رَخَاوَة"
      expands:
        - text: "«(الرخاوة) (رخاوة العضل الخلقية) عِلّة يُولد بهَا بعض الْأَطْفَال»"
          source: "المعجم الوسيط"
          addition: "تشير عادة إلى حالة أو صفة، وغالباً ما ترتبط بالضعف والوهن بدلاً من مجرد التلين الطبيعي."
    - lemma: "طَرَاوَة"
      expands:
        - text: "«الأُطْرُوَانُ»"
          source: "المعجم الكبير"
          addition: "تعني الغضاضة والجدة، ولا تدل صراحة على مسار وعملية التحول."
    - lemma: "لِين"
      expands:
        - text: "«اللِّينُ: ضدّ الخشونة، ويستعمل ذلك في الأجسام، ثمّ يستعار للخلق وغيره»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "يعبر عن الحالة والصفة وليس عن العملية أو مسار التحول."

stage3_analysis:
  per_lemma:
    - lemma: "تليين"
      decision: confirmed
      decision_reason: "مصطلح شائع لترجمة (Softening)، فرغم أنه يدل قواعدياً على فعل متعدٍ (إحداث اللين)، إلا أنه مستقر في الاستعمال العام للدلالة على عملية اللين بشكل عام. سيتم إبقاؤه مع ضبط التشكيل وتوضيح الفرق."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَلْيِين"
    - lemma: "تَلَيُّن"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الأدق والأصح لغوياً للتعبير عن المفهوم (عملية التحول إلى ليونة بشكل طبيعي)، كونه مصدراً لفعل المطاوعة (تليّن) الدال على الصيرورة والتحول التلقائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَلَيُّن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13578969-n"
    - lemma: "رَخَاوَة"
      source: stage1
      decision: removed
      decision_reason: "تدل على حالة الهشاشة والضعف وليست مرادفة دقيقة لعملية التحول للين."
    - lemma: "طَرَاوَة"
      source: stage1
      decision: removed
      decision_reason: "تشير إلى حالة الغضاضة والجدة ولا تعبر عن العملية والمسار الحركي."
    - lemma: "لِين"
      source: stage1
      decision: removed
      decision_reason: "يعبر عن الصفة والحالة المجردة، بينما المفهوم يركز على العملية والتحول."

