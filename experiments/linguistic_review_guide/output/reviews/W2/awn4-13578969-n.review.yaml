    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وسليم ويعبر بصورة واضحة عن مفهوم الصيرورة والتحول الطبيعي إلى حالة اللين."
  examples:
    per_lemma:
      - lemma: "تَلْيِين"
        examples:
          - text: "أسهمت عوامل التعرية المائية في تَلْيِينِ التربة والصخور المحيطة بها."
            type: usage
      - lemma: "تَلَيُّن"
        examples:
          - text: "يحدث تَلَيُّنُ الثمار بشكل طبيعي كلما زادت درجة نضجها."
            type: usage
    actions:
