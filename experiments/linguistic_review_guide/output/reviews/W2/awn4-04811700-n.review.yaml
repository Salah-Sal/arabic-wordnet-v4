# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الوحيدة 'عَدَم دِقَّة' تعاني من نقص التشكيل (تحتاج إلى ضمة على عَدَمُ وتنوين على دِقَّةٍ)."
      - "المجموعة ذات لمّة واحدة فقط — ضعيف المعجمية لمفهوم مجرد مهم."
      - "التعريف الحالي شبه دوار: 'غير دقيق' يكرر المفهوم دون تعليل أو جنس مميز."
      - "اللمّة الموجودة مركّب وصفي-إضافي حر يفشل اختبار التثبيت (يمكن إبدال 'عدم' بـ'انعدام/قلة/فقدان' ويبقى وصفياً)."
      - "غياب أي مثال استعمالي على مستوى المجموعة أو المعنى."
    observations: >
      المجموعة الترادفية (awn4-04811700-n) تمثّل مفهوماً مجرداً هو «صِفَة عَدَم الدِّقَّة»
      وهو مقابل WordNet للمصطلح الإنجليزي inaccuracy. المفهوم معروف في العربية ومُتداوَل
      في النصوص العلمية والتقنية عبر عبارة «عدم الدقة»، لكن لا يوجد اسم مصدري مُفرَد
      راسخ يؤدي هذا المعنى بصورة مفردة واحدة، مما يجعل المجموعة في حالة «فجوة معجمية»
      (lexical gap). اللمّة القائمة «عَدَم دِقَّة» هي وحدة تركيبية إضافية قريبة من
      الوصف الحر وليست وحدة معجمية مسكوكة ثابتة، غير أنها الأكثر تداولاً في الكتابة
      التقنية العربية المعاصرة وتستحق الإبقاء مع تصحيح التشكيل.
      وقد وردت في نتائج الاستعلام الإنجليزي كلمة «زَلَل» بمعنى imprecision في المعجم
      الطبي الموحد (2009) وهي جديرة بالدراسة في مراجعة مستقلة لاحقة.

  blind_candidates:
    - lemma: "الزَّيْغُ"
      generation_method: majaz
      justification: >
        من الجذر زوغ/زيغ بمعنى الميل والانحراف. بالمجاز تُستعمل «الزَّيْغ» للدلالة على
        الابتعاد عن الصواب والحقيقة، وهو ما يلامس مفهوم عدم الدقة (الانحراف عن القيمة
        الصحيحة). اللفظ قرآني وكلاسيكي يمكن إحياؤه دون اشتراك لفظي حاد.

    - lemma: "الغَلَطِيَّةُ"
      generation_method: ishtiqaq
      justification: >
        من جذر (غ-ل-ط) بمعنى الوقوع في الخطأ، بإضافة مصدر صناعي (-يَّة) لتحويله إلى
        وصف مجرد يدل على «صِفَة كون الشيء مغلوطاً»، على غرار صِحَّة → صِحِّيَّة،
        دِقَّة → دِقِّيَّة. الوزن منتج لإفادة الصفة النوعية المجردة.

    - lemma: "قُصُورُ الدِّقَّةِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «قُصُور» (اسم مصدر من قَصُرَ بمعنى النقص والتقصير) و«الدِّقَّة»،
        أي «النقص في الدقة» = عدم الدقة. المركّب الإضافي أكثر رسوخاً من «عدم دقة» لأن
        «قصور» يحمل دلالة النقص الكمّي المقنّع وهو أخصّ دلالةً.

    - lemma: "الخَلَلُ"
      generation_method: majaz
      justification: >
        من جذر (خ-ل-ل) بمعنى الفرجة والفساد والضعف. بالمجاز تُستعمل «الخَلَل» لوصف
        العيب الكامن في شيء ما، وهو قريب من مفهوم عدم الدقة (وجود فجوة أو خلل بين
        القيمة المُقاسة والحقيقة). لفظ كلاسيكي راسخ مع إمكانية الإزاحة الدلالية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────────
# استعلامات منفّذة: 5 استعلامات (مطابقة دفعية، جسر إنجليزي، FTS عربي، مقاييس)
stage2_evidence:

  per_lemma:

    - lemma: "عَدَم دِقَّة"
      confirm:
        - text: >
            «(1) عدم صحة؛ عدم دقة
            (2) خطأ؛ غلطة.»
          source: "المورد الحديث (2008) — ترجمة inaccuracy"
        - text: >
            «عدم دقة القياس: مفهوم عدم دقة القياس لا يُفرِّق بين الأخطاء المنهجية
            وتلك التي تقع مُصادفةً. تكونُ القيمةُ المرجعيةُ هنا هي القيمة المُحتملة
            لنتيجة القياس.»
          source: "مسرد الهندسة الكهربائية — ALECSO (arabterm)"
        - text: >
            «وكذلك عند حدوث عدم دقة في البيانات والقياسات والتنبؤات.»
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — arabterm"
      expands:
        - text: >
            «(1) غير دقيق
            (2) غامض.»
          source: "المورد الحديث (2008) — ترجمة imprecise"
          addition: >
            يُظهر أن العربية تستعمل «غير دقيق» كصفة للموصوف غير الدقيق، مما يدعم اعتبار
            «عدم دقة» اسماً مصدرياً تركيبياً يؤدي وظيفة الاسم المجرد للصفة.
        - text: >
            «زَلَل (انعدامُ الدِّقَّة) [إحصاء]» — translation_en: imprecision
          source: "المعجم الطبي الموحد (2009) — arabterm"
          addition: >
            يكشف أن «زَلَل» وُظِّف رسمياً في المصطلحية الطبية للإحصاء بمعنى «انعدام الدقة»،
            وهو بديل مفرد محتمل يستحق دراسة مستقلة لاحقة.

    - lemma: "الزَّيْغُ"
      contradicts:
        - text: >
            «زيغ» — translation_en: aberration
            [وردت في: مسرد التربية، المعجم الموحد للرياضيات والفلك (1990)،
            المعجم الموحد للكيمياء (1992)، المعجم الموحد للاستشعار عن بعد (2000)،
            المعجم الطبي الموحد (2009)]
          source: "معاجم ALECSO المتعددة (arabterm)"
          conflict: >
            «زيغ» مُقنَّن في المصطلحية العربية الحديثة بمعنى aberration (الزيغ البصري
            أو الانحراف الرياضي)، وهو مفهوم تقني مختلف عن «عدم الدقة» الذي يعني
            الابتعاد عن القيمة الصحيحة. الإزاحة الدلالية المقترحة تتعارض مع الاستخدام
            المُقنَّن القائم.
        - text: >
            «الزَّيْغُ: الميلُ. وقد زاغَ يَزيغُ. وزاغَ البصر، أي كَلَّ. وأَزاغَهُ عن
            الطريق، أي أمالَه.»
          source: "تاج اللغة وصحاح العربية للجوهري (hawramani)"
          conflict: >
            الدلالة الأصلية للزيغ هي «الميل والانحراف» لا «عدم الدقة كصِفَة نوعية»،
            مما يجعل التوسع الدلالي المقترح غير مُبرَّر في ظل وجود المصطلح المُقنَّن.
      expands:
        - text: >
            «الزَّاءُ وَالْيَاءُ وَالْغَيْنُ أَصْلٌ يَدُلُّ عَلَى مَيْلِ الشَّيءِ.
            يُقَالُ زَاغَ يَزِيغُ زَيْغًا. وَالتَّزَيُّغُ: التَّمَايُلُ.»
          source: "مقاييس اللغة لابن فارس (hawramani، dictionary_id≈151)"
          addition: >
            ابن فارس يرجع الجذر إلى «ميل الشيء» وليس إلى عدم الدقة — يؤكد بُعد
            الزيغ الدلالي عن المفهوم المطلوب.

    - lemma: "الغَلَطِيَّةُ"
      evidence_status: "no_material_found"

    - lemma: "قُصُورُ الدِّقَّةِ"
      evidence_status: "no_material_found"

    - lemma: "الخَلَلُ"
      contradicts:
        - text: >
            «خللٌ» — translation_en: fault
            «حالة تصيب أي مكون من مكونات الحاسوب قد تؤدي إلى تعطله.
            ويطلق المصطلح أيضاً على ما قد يحدث من أخطاء في برامج الحاسوب.»
          source: "مسرد التربية — ALECSO (arabterm)"
          conflict: >
            «خلل» في المصطلحية الحديثة مُقنَّن بمعنى fault/disorder لا inaccuracy؛
            وهو يصف «العطل» أو «الاضطراب» لا «صِفَة كون الشيء غير دقيق».
        - text: >
            «(الْخلَل) منفرج ما بَين كل شَيْئَيْنِ وَيُقَال هُوَ خللهم بَينهم...
            وَالْفساد والضعف يُقَال فِي رَأْيه خلل (ج) خلال»
          source: "المعجم الوسيط — hawramani"
          conflict: >
            الدلالة الأصلية: فرجة بين شيئين → فساد وضعف. هذا أبعد دلالةً من
            «صِفَة عدم الدقة» التي تعني الانحراف عن القيمة الصحيحة.
      expands:
        - text: >
            «الْخَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَتَقَارَبُ فُرُوعُهُ، وَمَرْجِعُ ذَلِكَ
            إِمَّا إِلَى دِقَّةٍ أَوْ فُرْجَةٍ.»
          source: "مقاييس اللغة لابن فارس (hawramani، dictionary_id≈151)"
          addition: >
            ابن فارس يُرجع الجذر خل إلى «دقة أو فرجة»، مما يُظهر أن صلة الجذر
            بالدقة موجودة تاريخياً لكنها ليست الدلالة الرئيسية المُقنَّنة.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "عَدَم دِقَّة"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في المورد الحديث (2008) كمقابل مباشر لـinaccuracy، وتُستعمل
        على نطاق واسع في النصوص التقنية العربية (هندسة كهربائية، طاقة متجددة، قياس).
        رغم أنها مركّب إضافي حر وليست وحدة معجمية مسكوكة تماماً، إلا أنها الأنسب
        المتاح لهذا المفهوم ريثما يُقنَّن مصطلح مفرد. تحتاج إلى تصحيح التشكيل
        الكامل: عَدَمُ دِقَّةٍ (المضاف مرفوع، المضاف إليه مجرور منوَّن).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة، تحمل دلالة غياب الدقة (النوع السلبي من جودة القياس)
        وتشمل الأخطاء المنهجية والعشوائية معاً، وهي أعم من «الزَّلَل» الذي يُستعمل
        تحديداً في الإحصاء الطبي بمعنى عدم الدقة الإحصائية (imprecision لا inaccuracy).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ دِقَّةٍ"

    - lemma: "الزَّيْغُ"
      source: stage1
      decision: removed
      decision_reason: >
        «الزيغ» مُقنَّن في المصطلحية العربية الحديثة بمعنى aberration (الزيغ البصري
        والانحراف الرياضي) في عدة معاجم متخصصة — وهو مفهوم مختلف تماماً عن «صِفَة
        عدم الدقة». الإزاحة الدلالية المقترحة ستتعارض مع الاستخدام المُقنَّن القائم
        وتُوجِد اشتراكاً لفظياً حاداً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "الغَلَطِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد في قواعد البيانات المعجمية ولا في المصطلحية الحديثة.
        المصطلح نِيولوجيا غير مُوثَّقة ولا مُستعملة، ولا تجتاز اختبار
        التداول والشيوع في الكتابة العربية الفصيحة.
      evidence_assessment:
        case: no_material

    - lemma: "قُصُورُ الدِّقَّةِ"
      source: stage1
      decision: removed
      decision_reason: >
        مركّب إضافي حر لا يجتاز اختبار السكّ: «قصور الدقة» ↔ «انعدام الدقة» ↔
        «نقص الدقة» — جميعها تؤدي الوصف ذاته، مما يُثبت أن العبارة ليست وحدة
        معجمية ثابتة. فضلاً عن ذلك، لا يختلف دلالياً كفاية عن اللمّة الموجودة
        «عَدَمُ دِقَّةٍ» لتبرير إضافته مستقلاً.
      evidence_assessment:
        case: no_material

    - lemma: "الخَلَلُ"
      source: stage1
      decision: removed
      decision_reason: >
        «الخَلَل» مُقنَّن في المصطلحية الحديثة بمعنى fault/disorder، وهو أوسع
        دلالةً وأكثر شيوعاً في معنى «الاضطراب والعطل» لا «صِفَة عدم الدقة»
        تحديداً. إدراجه في هذه المجموعة يُفضي إلى توسيع غير مبرر للمفهوم
        وإخلال بالفروق الدلالية الدقيقة.
      evidence_assessment:
        case: contradicts_only


