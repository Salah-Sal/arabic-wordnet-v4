stage1_review:
  assessment:
    concerns:
      - "اللمة 'زوال المغناطيسية' تشير إلى الحالة التي تتلاشى فيها المغناطيسية من تلقاء نفسها (disappearance)، بينما المجموعة الترادفية تعبر عن العملية الفاعلة لإزالة المغناطيسية (process of removing)."
      - "اللمة 'إزالة المغناطيسية' صحيحة شائعة، لكن المصطلح الأكاديمي الدقيق في معاجم الفيزياء هو 'إزالة التمغنط'."
    observations: "مصطلح إزالة التمغنط يعكس المعنى العلمي بشكل دقيق حيث أن التمغنط هو اكتساب الخاصية، وإزالته هي عكس العملية."
  blind_candidates:
    - lemma: "إِزَالَةُ التَّمَغْنُطِ"
      generation_method: tarkib
      justification: "مركب إضافي من المصدر الدال على الإزالة ومصدر المطاوعة الدال على اكتساب المغناطيسية، وهو الأوفق لغوياً وعلمياً لتأدية معنى العملية."
    - lemma: "إِزَالَةُ المَغْنَطَةِ"
      generation_method: tarkib
      justification: "مركب إضافي من مصدر الإزالة واسم المصدر للمغناطيسية، وهو شائع الاستخدام في السياقات التقنية."
    - lemma: "نَزْعُ المَغْنَطَةِ"
      generation_method: tarkib
      justification: "استعارة كلمة النزع للدلالة على الإزالة التامة للمغنطة والقوة المغناطيسية."
    - lemma: "إِبْطَالُ التَّمَغْنُطِ"
      generation_method: tarkib
      justification: "استخدام الإبطال بمعنى إلغاء الأثر، يناسب إبطال الخصائص المغناطيسية للمادة."

stage2_evidence:
  per_lemma:
    - lemma: "إزالة المغناطيسية"
      evidence_status: no_material_found
    - lemma: "زوال المغناطيسية"
      evidence_status: no_material_found
    - lemma: "إبطال التمغنط"
      evidence_status: no_material_found
    - lemma: "نزع المغنطة"
      evidence_status: no_material_found
    - lemma: "إزالة التمغنط"
      confirm:
        - text: "«ازالة التمغنط»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«إزالة التمغنط»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"
    - lemma: "إزالة المغنطة"
      expands:
        - text: "«عامل إزالة المغنطة»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يؤكد استخدام 'إزالة المغنطة' في المركبات الاصطلاحية الهندسية لنفس المفهوم."
        - text: "«منحنى إزالة المغنطة»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يؤكد استخدام التعبير في المجالات التقنية المتعلقة بالكهرباء."

stage3_analysis:
  per_lemma:
    - lemma: "إزالة المغناطيسية"
      decision: confirmed
      decision_reason: "مصطلح شائع الاستخدام ومفهوم في السياقات العامة، بالرغم من عدم وروده في المعاجم المتخصصة بهذا اللفظ تحديداً، إلا أنه يعبر بوضوح عن المفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مصطلح شائع في الاستخدام العام للتعبير عن فقدان القوة المغناطيسية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِزَالَةُ المَغْنَاطِيسِيَّةِ"

    - lemma: "زوال المغناطيسية"
      decision: removed
      decision_reason: "الزوال يشير إلى حالة التلاشي التلقائي (disappearance/fading) وليس إلى العملية الفاعلة لإزالة المغنطة (process of removing) كما يشير التعريف."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِزَالَةُ التَّمَغْنُطِ"
      source: stage1
      decision: confirmed
      decision_reason: "المرادف الأفضل والأدق علمياً، موثق في المعاجم الموحدة (معجم الفيزياء، ومعجم الطباعة والكهرباء)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح العلمي الأكاديمي المعتمد في معاجم الفيزياء والتقنية."
      actions:
        - command: create_entry
          params:
            lemma: "إِزَالَةُ التَّمَغْنُطِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إِزَالَةُ المَغْنَطَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح صحيح تقنياً وموثق ضمن مركبات في موسوعة الكهرباء (مثل: عامل إزالة المغنطة)، مما يدعم صحة استخدامه للدلالة على العملية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مستخدم بكثرة في السياقات الهندسية والكهربائية المتخصصة."
      actions:
        - command: create_entry
          params:
            lemma: "إِزَالَةُ المَغْنَطَةِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نَزْعُ المَغْنَطَةِ"
      source: stage1
      decision: removed
      decision_reason: "لا يوجد ما يدعمه في المعاجم، واستخدام 'الإزالة' أثبت وأشيع في المراجع العلمية."

    - lemma: "إِبْطَالُ التَّمَغْنُطِ"
      source: stage1
      decision: removed
      decision_reason: "لم يرد في المعاجم المتخصصة، والتعبيرات الأخرى (إزالة) تفي بالغرض بشكل أدق."

stage4_content:
  definition:
    current: "عملية إزالة التمغنط"
    assessment:
      decision: revise
      reason: "التعريف الحالي عبارة عن تكرار اللفظ (circular)، ويُفضل تقديم تعريف مصطلحي واضح للعملية."
    authored:
      - type: terminological
        text: "العملية التي يتم من خلالها إزالة الخصائص المغناطيسية من مادة أو جسم مُمغنط."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "العملية التي يتم من خلالها إزالة الخصائص المغناطيسية من مادة أو جسم مُمغنط."

  examples:
    per_lemma:
      - lemma: "إِزَالَةُ المَغْنَاطِيسِيَّةِ"
        examples:
          - text: "تتطلب الأقراص الصلبة القديمة إزالة المغناطيسية منها قبل التخلص منها بأمان لحماية البيانات."
            type: usage
      - lemma: "إِزَالَةُ التَّمَغْنُطِ"
        examples:
          - text: "يؤدي التسخين الشديد للمعادن إلى إزالة التمغنط منها وفقدانها لخصائصها الجاذبة."
            type: usage
      - lemma: "إِزَالَةُ المَغْنَطَةِ"
        examples:
          - text: "تم استخدام أداة خاصة لإزالة المغنطة من شاشة التلفاز لإصلاح تشوه الألوان."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتطلب الأقراص الصلبة القديمة إزالة المغناطيسية منها قبل التخلص منها بأمان لحماية البيانات."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يؤدي التسخين الشديد للمعادن إلى إزالة التمغنط منها وفقدانها لخصائصها الجاذبة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تم استخدام أداة خاصة لإزالة المغنطة من شاشة التلفاز لإصلاح تشوه الألوان."

