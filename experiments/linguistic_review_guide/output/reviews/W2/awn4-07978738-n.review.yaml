stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية مناسبة تماماً للمفهوم وتغطي دلالاته المتعددة، ولكن التعريف الحالي يحتوي على أقواس وهو أمر غير محبذ في الصياغة المعجمية الرصينة."
    observations: "التعريف يعبر عن التجمع العشوائي للأشياء أو الأشخاص، واللمّات الموجودة تفي بالغرض حيث تميل 'جمهرة' و'حشد' للتعبير عن تجمع الأشخاص، بينما 'كتلة' تغطي الجانبين المادي والبشري وهي المقابل الدقيق لكلمة mass."
  blind_candidates:
    - lemma: "جَمْهَرَة"
      generation_method: ishtiqaq
      justification: "تُستخدم للدلالة على التجمع الكبير والمختلط."
    - lemma: "حَشْد"
      generation_method: ishtiqaq
      justification: "تُعبر عن تجمع الأشخاص والجموع الكبيرة دون ترتيب مسبق."
    - lemma: "كُتْلَة"
      generation_method: ishtiqaq
      justification: "تدل على تجمع الأشياء أو الأشخاص ككيان متراص واحد دون التفات لتفاصيله."
    - lemma: "رُكَام"
      generation_method: ishtiqaq
      justification: "تُستخدم للأشياء المادية المتراكمة بعضها فوق بعض في تجمع غير منظم."

stage2_evidence:
  per_lemma:
    - lemma: "جَمْهَرَة"
      confirm:
        - text: "«الجَمْهرة: مجموعة أشياء مختلطة ... حَشْدٌ من الناس.»"
          source: "المورد الحديث"
        - text: "«الجَمْهَرَةُ: المُجْتَمَعُ... من كُلِّ شَيءٍ : مُعْظَمُه»"
          source: "المعجم الكبير"
    - lemma: "حَشْد"
      confirm:
        - text: "«الحَشْد: من الناس: الجماعة»"
          source: "المعجم الوسيط"
        - text: "«الحَشَدُ: الجَماعةُ يَحْتَشِدون. يقال: عند فُلَانٍ حَشْدٌ من النَّاسِ»"
          source: "المعجم الكبير"
    - lemma: "كُتْلَة"
      confirm:
        - text: "«الْكُتْلَةُ: القِطْعة المجتمعة من الشَّيء الجماعة من الناس المتفقون على رأى واحد. (مج)»"
          source: "المعجم الوسيط"
        - text: "«mass»"
          source: "المورد الحديث"
    - lemma: "رُكَام"
      confirm:
        - text: "«الرُّكامُ: ما اجْتَمَعَ من الأَشْياء وتَراكَمَ بعضُه فوقَ بَعْض»"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "جَمْهَرَة"
      decision: confirmed
      decision_reason: "مصطلح دقيق ومناسب يعبر عن التجمع الكبير غير المنظم للأشياء أو الأشخاص."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَمْهَرَة"
    - lemma: "حَشْد"
      decision: confirmed
      decision_reason: "مصطلح أساسي وفصيح يدل على تجمع الناس بكثرة ودون ترتيب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَشْد"
    - lemma: "كُتْلَة"
      decision: confirmed
      decision_reason: "مصطلح يعبر بوضوح عن تجمع الأشياء أو الأشخاص ككيان متراص، ويقابل المصطلح الإنجليزي mass بدقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كُتْلَة"
    - lemma: "رُكَام"
      source: stage1
      decision: removed
      decision_reason: "الكلمة تقتصر غالباً على الأشياء المادية المتراكمة فوق بعضها، ولا تُطلق على الأشخاص بشكل اعتيادي كما ينص التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "مجموعة غير منظمة من أشياء متشابهة (أشياء أو أشخاص)"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على أقواس في صياغته مما يجعله أشبه بالشرح الحر بدلاً من الصياغة المعجمية الرصينة."
    authored:
      - type: terminological
        text: "تجمع كبير وغير منظم لأشياء أو أشخاص متشابهين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07978738-n"
          definition_index: 0
          text: "تجمع كبير وغير منظم لأشياء أو أشخاص متشابهين."
  examples:
    per_lemma:
      - lemma: "جَمْهَرَة"
        examples:
          - text: "تجمعت جمهرة من الناس في الساحة العامة لسماع الإعلان."
            type: usage
      - lemma: "حَشْد"
        examples:
          - text: "تفرق الحشد بعد انتهاء الخطاب."
            type: usage
      - lemma: "كُتْلَة"
        examples:
          - text: "شكل المتظاهرون كتلة بشرية سدت الطريق المؤدي إلى الميدان."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-07978738-n"
          text: "تجمعت جمهرة من الناس في الساحة العامة لسماع الإعلان."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تجمعت جمهرة من الناس في الساحة العامة لسماع الإعلان."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تفرق الحشد بعد انتهاء الخطاب."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "شكل المتظاهرون كتلة بشرية سدت الطريق المؤدي إلى الميدان."

