      nuance_differentiation: >-
        أعمُّ الثلاثة وأكثرها تداولاً؛ يدل على الانطباع الكلي والأجواء العامة المحيطة بمكان
        أو شخص أو حدث دون التخصيص بالهيبة أو القداسة. مثاله: «جو من التوتر / الألفة / الغموض».

