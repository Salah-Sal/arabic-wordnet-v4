# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────

stage3_analysis:
  per_lemma:

    - lemma: "جَوّ"
      decision: confirmed
      decision_reason: >-
        جَوّ مُرسَّخ في العربية المعاصرة للدلالة على الأجواء المعنوية المحيطة بمكان أو شخص
        أو حدث؛ الأصل الدلالي (الاحتواء من الجوانب في مقاييس اللغة) يُسند الإزاحة الدلالية،
        وقد دعّمها المورد الحديث صراحةً بذكر «جوّ مميّز» مرادفاً لـaura. التشكيل سليم.
