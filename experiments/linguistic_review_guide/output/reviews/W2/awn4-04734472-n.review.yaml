# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────

stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «صفة مميزة ولكن غير ملموسة تحيط بشخص أو شيء» يعتمد على «غير ملموسة» وهي ترجمة حرفية لـ intangible؛ الأصوب عربياً «معنوية» أو «لا تُرى بالعين»"
      - "الرابط «ولكن» يُشكّل إضراباً غير ضروري في التعريف؛ الأنسب صياغة تستأنف دون إضراب"
      - "اللمّتان الحاليتان تُمثّلان الدلالة الجوية/الهالية لكن تعريفهما التراثي مادي بحت (الهواء / دارة القمر) مما يستدعي توثيق الإزاحة الدلالية"
    observations: >-
      المجموعة الترادفية تُعبّر عن المفهوم الإنجليزي المزدوج air/aura/atmosphere بمعنى الصفة
      المعنوية المميزة التي تُحيط بشخص أو شيء وتُشعر بها الحواس دون رؤية ظاهرة. كلتا اللمّتين
      الموجودتين (جَوّ / هَالَة) مجازيتان: فـ«جو» أُخذت من الهواء ثم امتدّ معناها إلى الأجواء
      الكلية المُحيطة، و«هالة» أُخذت من دارة القمر ثم امتدّت إلى الهالة المعنوية حول الأشخاص
      البارزين. الفجوة المُلاحَظة: اللمّة المقابلة للـ air الإنجليزية («له وقعٌ / طابعٌ خاص») غائبة.

  blind_candidates:
    - lemma: "رُونَق"
      generation_method: majaz
      justification: >-
        إحياء لفظ كلاسيكي؛ الرَّوْنَق أصله بريق السيف وصفاؤه ثم استُعير للحسن والبهاء
        وللصفة المعنوية المميزة التي يُشعّها الشيء أو الشخص. يُستعمل في العربية المعاصرة:
        «له رونق خاص» بما يقارب الدلالة المطلوبة.

    - lemma: "مَيْسَم"
      generation_method: ishtiqaq
      justification: >-
        من جذر وسم على وزن مَفْعَل الدال على الأداة أو الأثر؛ المَيْسَم أثرُ الوَسَامة والجمال،
        قيل في الحديث «تُنكح المرأة لمَيْسَمها» أي لحسنها. يمكن توسيعه للسمة المعنوية
        المميزة التي تتركها الشخصية في نفس المشاهد.

    - lemma: "نَفْحَة"
      generation_method: majaz
      justification: >-
        من نفح بمعنى اندفاع الشيء أو انبثاثه؛ النَّفْحَة مجازاً هي ما ينبثّ من شيء لطيف
        خفيّ يُحسّ ولا يُرى. تُستعمل في النثر العربي للدلالة على الصفة المعنوية الخفية
        المُحيطة: «نفحة من الغموض / نفحة من الوقار».

    - lemma: "طَابَع"
      generation_method: majaz
      justification: >-
        من جذر طبع بمعنى الختم والإلزام؛ الطَّابَع الخُلُقُ الغالب والعلامة المميزة.
        يُستعمل في الاستعمال المعاصر للدلالة على الصفة المعنوية المميزة التي يختم بها
        الشيءُ أو الشخصُ وجوده: «الطابع المميز للمكان» و«له طابع يجري عليه».


