# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────

stage4_content:
  definition:
    current: "صفة مميزة ولكن غير ملموسة تحيط بشخص أو شيء"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مترجم من الإنجليزية بشكل مباشر؛ «غير ملموسة» كَلقٌ من intangible
        والأسلوبُ العربي يُفضّل «معنوية». كذلك «ولكن» إضراب غير ضروري — التعريف المعجمي
        الأصيل يُعرَّف بالجنس والفصل دون روابط إضرابية. يُستحسن تعريف مصطلحي يُبرز
        الجنس (سِمَة معنوية) والفصل (مُحيطة + تُدرك حدساً).
    authored:
      - type: terminological
        text: "سِمَةٌ مَعنوِيَّةٌ مُمَيِّزَةٌ تُحِيطُ بِشَخْصٍ أَوْ شَيْءٍ وَتُدرَكُ حَدْسًا لا مَشَاهَدَةً"
        quality_check:
          genus_present: true
          differentia_present: true
