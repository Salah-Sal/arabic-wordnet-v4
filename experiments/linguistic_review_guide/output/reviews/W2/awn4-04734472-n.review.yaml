        من القداسة أو الغموض أو الهيبة. مثاله: «هالة من القدسية / الأسطورية / الإجلال».

    - lemma: "رُونَق"
      source: stage1
      decision: removed
      decision_reason: >-
        الرَّوْنَق يدل على الحسن والبهاء والنضارة، وهو أضيق من الصفة المعنوية المميزة
        المطلوبة في هذا الـsynset؛ فهو مقصور على الجودة الجمالية الإيجابية ولا يشمل
