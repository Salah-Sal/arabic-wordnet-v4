        استخدامها للهالة المعنوية المحيطة بشخص أو رمز. الإزاحة الدلالية من الهالة الضوئية
        (دارة القمر) إلى الهالة المعنوية راسخة ومُقعَّدة. التشكيل سليم.
      evidence_assessment:
