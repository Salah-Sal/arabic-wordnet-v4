      mwe: false
    - lemma: "مَحْكُومُون"
      sense_id: "{auto}"
      nuance: "مصطلح سياسي يركز على علاقة التبعية القانونية والسلطوية (مقابل الحاكمين)."
      mwe: false
    - lemma: "رَعَايَا"
      sense_id: "{auto}"
      nuance: "صيغة جمع تستخدم غالباً في السياق القانوني الدولي والدبلوماسي للإشارة إلى الأفراد المنتمين لسيادة دولة ما."
      mwe: false
  synset:
    cultural_fit: native
  actions:
