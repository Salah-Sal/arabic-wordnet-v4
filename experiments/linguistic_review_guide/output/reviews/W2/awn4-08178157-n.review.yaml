        key: note
        value: '{"root":"رعي","maqayis":"«الراء والعين والحرف المعتل أصلان: أحدهما المراقبة والحفظ... والراعي: الوالي.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حكم","maqayis":"«الحاء والكاف والميم أصل واحد، وهو المنع. وأول ذلك الحكم، وهو المنع من الظلم.»"}'
    - command: set_metadata
