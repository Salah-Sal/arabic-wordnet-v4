stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر للتشكيل الكامل."
      - "يمكن إضافة لمّات أكثر دقّة للتعبير عن الجانب الأخلاقي أو المنهجي للسلوك."
    observations: "المجموعة تغطي المفهوم العام للطريقة التي يتصرف بها الفرد. اللمّات الحالية (تصرف، سلوك، مسلك) أساسية وصحيحة، لكن يمكن إثراؤها بمرادفات تراثية ومعاصرة تؤكد على الجانب المستمر من السلوك (مثل سيرة) أو الجانب الجبلي (مثل خلق)."
  blind_candidates:
    - lemma: "سُلُوك"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من الفعل (سلك)، ويعني اتخاذ نهج معين في التعامل، وهو المصطلح المعاصر الأكثر شيوعاً للمفهوم."
    - lemma: "تَصَرُّف"
      generation_method: ishtiqaq
      justification: "من الفعل (تصرّف)، ويشير إلى كيفية إدارة المرء لأفعاله وردود أفعاله في المواقف المختلفة."
    - lemma: "مَسْلَك"
      generation_method: ishtiqaq
      justification: "اسم مكان أو مصدر ميمي من (سلك)، استُعير للتعبير عن الطريقة أو المنهج الذي يتبعه الشخص في سلوكه."
    - lemma: "سِيرَة"
      generation_method: majaz
      justification: "من (السير)، وتُستخدم للدلالة على مذهب الإنسان وطريقته المستمرة في التعامل مع الآخرين، كما في 'حسن السيرة والسلوك'."

stage2_evidence:
  per_lemma:
    - lemma: "سُلُوك"
      confirm:
        - text: "«السّلوك: [في الانكليزية] Conduct ،behaviour... عبارة عن تهذيب الأخلاق... السلوك أن يطهّر العبد نفسه عن الأخلاق الذميمة...»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
        - text: "«سلوك: مجموعة من التصرفات والأفعال الصادرة عن المتعلم والمدرس تجاه عملية أو موضوع معين.»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي"
      expands:
        - text: "«السلوك: النفاذ في الطريق.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يوضح الأصل اللغوي للمصطلح."
    - lemma: "تَصَرُّف"
      confirm:
        - text: "«تصرُّف: سلوك؛ تصرُّف.» (ترجمة demeanor)"
          source: "المورد الحديث"
        - text: "«التَّصَرُّف: الزِّيَادَة فِي الْعَمَل وَالْمَشَقَّة فِيهِ وَالْقُدْرَة عَلَيْهِ.»"
          source: "دستور العلماء"
      expands:
        - text: "«اضْطِرابُ التَّصَرُّف: conduct disorder»"
          source: "المعجم الطبي الموحد"
          addition: "يؤكد استخدامه كمصطلح تقني للسلوك."
    - lemma: "مَسْلَك"
      confirm:
        - text: "«مسلك: conduct»"
          source: "المورد الحديث"
      expands:
        - text: "«مَسْلك: track»"
          source: "معجم مصطلحات المعلوماتية"
          addition: "يوضح المعنى الحسي (المسار) الذي اشتُق منه المعنى المعنوي (السلوك)."
    - lemma: "خُلُق"
      confirm:
        - text: "«خُلُق: demeanor»"
          source: "المورد الحديث"
        - text: "«الخُلُق: حالٌ للنَّفْس راسخةٌ تصدر عنها الأفعالُ من خير أو شرّ من غير حاجة إلى فكر وروية.»"
          source: "المعجم الوسيط"
    - lemma: "سِيرَة"
      confirm:
        - text: "«سِيرَة: الطريقة والحال التي يكون عليها الإنسان وغيره.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«السِّيرة: الطريقةُ في الشيء والسنَّة.»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "سلوك"
      decision: confirmed
      decision_reason: "المصطلح المعاصر الأبرز للتعبير عن السلوك الإنساني، ومدعوم بقوة في المعاجم الحديثة والتقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُلُوك"
    - lemma: "تصرف"
      decision: confirmed
      decision_reason: "يشير بدقة إلى الفعل السلوكي المنطلق من إرادة الشخص، وهو مرادف معتمد في المعاجم الثنائية لـ (conduct)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصَرُّف"
    - lemma: "مسلك"
      decision: confirmed
      decision_reason: "يعبر عن المنهج أو الطريقة المتبعة في السلوك، وهو شائع الاستخدام في السياقات الأدبية والتربوية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَسْلَك"
    - lemma: "سِيرَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي أصيل يعبر عن الحالة والطريقة المستمرة للشخص، ويستخدم حالياً في السياقات الرسمية (حسن السيرة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سِيرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خُلُق"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الجانب النفسي والسمات الراسخة التي تظهر في سلوك الفرد، وهو مطابق للتعريف الإنجليزي (behavioral attributes)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خُلُق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "(السمات السلوكية) الطريقة التي يتصرف بها الشخص تجاه الآخرين"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويغطي الجانب الوصفي للمفهوم بأسلوب معجمي سليم."
  examples:
    per_lemma:
      - lemma: "سُلُوك"
        examples:
          - text: "عُرِفَ هذا الطَّالبُ بِحُسْنِ سُلُوكِهِ وَانْضِبَاطِهِ فِي المَدْرَسَةِ."
            type: usage
      - lemma: "تَصَرُّف"
        examples:
          - text: "أَثَارَ تَصَرُّفُهُ المُرِيبُ شُكُوكَ الجَمِيعِ وَدَفَعَهُمْ لِلْتَسَاؤُلِ."
            type: usage
      - lemma: "مَسْلَك"
        examples:
          - text: "اتَّخَذَ القَائِدُ مَسْلَكاً حَكِيماً فِي إِدَارَةِ الأَزْمَةِ الحَالِيَّةِ."
            type: usage
      - lemma: "سِيرَة"
        examples:
          - text: "يُشْتَرَطُ فِي المُرَشَّحِ لِلْوَظِيفَةِ أَنْ يَكُونَ مَحْمُودَ السِّيرَةِ."
            type: usage
      - lemma: "خُلُق"
        examples:
          - text: "«وَإِنَّكَ لَعَلى خُلُقٍ عَظِيمٍ»"
            type: quran
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "ظَهَرَ سُلُوكُهُ الحَضَارِيُّ فِي احْتِرَامِهِ لِلْمَوَاعِيدِ."}

stage5_enrichment:
  per_entry:
    - lemma: "سُلُوك"
      entry_id: "{auto}"
      root: "سلك"
      maqayis_quote: "«السِّينُ وَاللَّامُ وَالْكَافُ أَصْلٌ يَدُلُّ عَلَى نُفُوذِ شَيْءٍ فِي شَيْءٍ. يُقَالُ سَلَكْتُ الطَّرِيقَ أَسْلُكُهُ.»"
    - lemma: "تَصَرُّف"
      entry_id: "{auto}"
      root: "صرف"
      maqayis_quote: "«الصَّادُ وَالرَّاءُ وَالْفَاءُ مُعْظَمُ بَابِهِ يَدُلُّ عَلَى رَجْعِ الشَّيْءِ. وَسُمِّي صَرْفُ الدَّهْرِ بِذَلِكَ لِأَنَّهُ يَتَصَرَّفُ بِالنَّاسِ، أَيْ يُقَلِّبُهُمْ وَيُرَدِّدُهُمْ.»"
    - lemma: "مَسْلَك"
      entry_id: "{auto}"
      root: "سلك"
      maqayis_quote: "«السِّينُ وَاللَّامُ وَالْكَافُ أَصْلٌ يَدُلُّ عَلَى نُفُوذِ شَيْءٍ فِي شَيْءٍ. يُقَالُ سَلَكْتُ الطَّرِيقَ أَسْلُكُهُ.»"
    - lemma: "سِيرَة"
      entry_id: "{auto}"
      root: "سير"
      maqayis_quote: "«السِّينُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى مُضِيٍّ وَجَرَيَانٍ... وَالسِّيرَةُ: الطَّرِيقَةُ فِي الشَّيْءِ وَالسُّنَّةِ، لِأَنَّهَا تَسِيرُ وَتَجْرِي.»"
    - lemma: "خُلُق"
      entry_id: "{auto}"
      root: "خلق"
      maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا تَقْدِيرُ الشَّيْءِ، وَالْآخَرُ مَلَاسَةُ الشَّيْءِ. وَالْخُلُقُ السَّجِيَّةُ، لِأَنَّ صَاحِبَهُ قَدْ قُدِرَ عَلَيْهِ.»"
  per_sense:
