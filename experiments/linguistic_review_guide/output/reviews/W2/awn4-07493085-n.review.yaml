stage4_content:
  definition:
    current: "انخفاض مفاجئ وكبير في الأعمال التجارية أو أسعار الأسهم (خاصة الذي يسبب حالات فشل إضافية)"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أكثر إحكاماً باستخدام ألفاظ مثل «سقوط حاد» و«متسلسل»."
    authored:
      - type: terminological
        text: "سُقوطٌ حادٌّ ومُفاجِئ في القيمة السوقيّة أو النشاط التجاريّ، يَنْجُم عنه غالباً سِلْسِلَة من الإخفاقات الماليّة المتتالية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07493085-n", definition_index: 0, text: "سُقوطٌ حادٌّ ومُفاجِئ في القيمة السوقيّة أو النشاط التجاريّ، يَنْجُم عنه غالباً سِلْسِلَة من الإخفاقات الماليّة المتتالية."}
  examples:
    per_lemma:
      - lemma: "انْهِيَار"
        examples:
          - text: "تسبب انهيار البورصة العالمي في عام 1929 بكساد اقتصادي طويل الأمد."
            type: usage
      - lemma: "كساد مفاجئ"
        examples:
          - text: "شهدت البلاد كساداً مفاجئاً بعد توقف الصادرات الحيوية."
            type: usage
      - lemma: "تَدَاعٍ"
        examples:
          - text: "أدى إفلاس البنك الكبير إلى تداعي الأنظمة المالية المترابطة."
            type: usage
      - lemma: "تَدَهْوُر"
        examples:
          - text: "حاول الخبراء تدارك تدهور أسعار الأسهم قبل فوات الأوان."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-07493085-n", text: "أدى تداعي أسعار النفط إلى انهيار مالي في الاقتصادات المعتمدة عليه."}

