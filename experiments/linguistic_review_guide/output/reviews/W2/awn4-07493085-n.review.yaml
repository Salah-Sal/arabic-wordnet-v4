stage1_review:
  assessment:
    concerns:
      - "اللمة «كساد مفاجئ» تبدو عبارة وصفية أكثر منها مصطلحاً معجمياً مسكوكاً، كما أن الكساد (recession/slump) يختلف دلالياً عن الانهيار (crash)؛ فالأول حالة ركود مستمرة، والثاني حدث سقوط فجائي."
      - "اللمة «انهيار» تفتقر للتشكيل في البيانات الأصلية."
    observations: "المفهوم يعبر عن سقوط حاد وسريع في القيم المالية، والمصطلح العربي الأكثر دقة وشيوعاً هو «انهيار». إضافة إلى ذلك، فإن الإشارة في التعريف إلى «التسبب في فشل إضافي» تجعل من «تداعي» خياراً دلالياً قوياً (Cascading collapse)."
  blind_candidates:
    - lemma: "انْهِيَار"
      generation_method: ishtiqaq
      justification: "المصطلح القياسي للتعبير عن السقوط المفاجئ في الأسواق والمنشآت."
    - lemma: "تَدَاعٍ"
      generation_method: ishtiqaq
      justification: "يشير إلى سقوط الأجزاء تباعاً، وهو ما يناسب وصف الانهيار الذي يسبب فشلاً إضافياً متسلسلاً."
    - lemma: "تَدَهْوُر"
      generation_method: ishtiqaq
      justification: "يفيد السقوط من أعلى إلى أسفل، ويستخدم بكثرة في السياق المالي لوصف الهبوط الحاد في الأسعار."
    - lemma: "انْهِيَار مَالِيّ"
      generation_method: tarkib
      justification: "وحدة اصطلاحية مستقرة في الأدبيات الاقتصادية للتعبير عن الـ financial crash."

stage2_evidence:
  per_lemma:
    - lemma: "انهيار"
      confirm:
        - text: "«سوق الأوراق المالية أي انهيار مستوى العملات في المصافق، واستعملت الكلمة على الخصوص للتعبير عن أزمة 1929»"
          source: "المعجم الموحد لمصطلحات الاقتصاد"
        - text: "«انهيار... collapse»"
          source: "المعجم الموحد لمصطلحات النقل"
      expands:
        - text: "«في الأسعار: تنخفض الأسعار انخفاضا كبيرا مع بقاء العرض الكلي في مستوى مرتفع»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (باسم slump)"
    - lemma: "كساد مفاجئ"
      evidence_status: "no_material_found"
    - lemma: "تَدَاعٍ"
      confirm:
        - text: "«تداع... breakdown; collapse; failure»"
          source: "المعجم الموحد لمصطلحات المياه"
        - text: "«تداعت الحيطان، وذلك إذا سقط واحد، وآخر بعده، فكأن الأول دعا الثاني»"
          source: "مقاييس اللغة (ابن فارس)"
    - lemma: "تَدَهْوُر"
      confirm:
        - text: "«تدهور الأسعار في المصفق... crash in stock-exchange»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
        - text: "«تدهور الشيء: سقط من أعلى إلى أسفل»"
          source: "المعجم الكبير"
    - lemma: "انْهِيَار مَالِيّ"
      confirm:
        - text: "«انهيار مالي أو تدهور... financial crash»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
    - lemma: "انْهِيَار السُّوق"
      confirm:
        - text: "«انهيار السوق... collapse of the market»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"

