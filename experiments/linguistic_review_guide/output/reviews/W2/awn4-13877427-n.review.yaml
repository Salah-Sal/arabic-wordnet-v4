# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13877427-n
# exact opposite / المقابل التام
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «المقابل التام» مختصر جداً وقد يلتبس بمعنى المقابل الحسّي (ما يقع في الجهة المقابلة)"
      - "عَكْس في أصلها تدلّ على الرَّدّ والقلب لا على التضادّ المحض، فاستعمالها بمعنى الضدّ توسُّع حديث"
    observations: "المجموعة تعبّر عن مفهوم «المقابل التامّ» أي الشيء الذي يناقض غيره مناقضة كاملة. هذا المفهوم راسخ في العربية وله ألفاظ متعددة: ضِدّ (أعمّ)، نقيض (أخصّ وأدقّ في المنطق)، عكس (بمعنى القلب والرّدّ). المفهوم جنسه الأعلى هو التضادّ/التعارض وهو منصوص عليه في الزُّمرة الأعلى."
  blind_candidates:
    - lemma: "نَقِيض"
      generation_method: ishtiqaq
      justification: "من جذر نقض على وزن فَعِيل بمعنى مفعول، يدلّ على ما نُقِض وخُولِف. النقيض في المنطق والاستعمال العام هو ما يقابل الشيء مقابلة تامّة لا يجتمعان"
    - lemma: "طِبَاق"
      generation_method: ishtiqaq
      justification: "من جذر طبق، مصدر طابَقَ. عند أهل البديع: الجمع بين معنيين متقابلين. قد يصلح للتعبير عن التقابل التامّ"
    - lemma: "خِلَاف"
      generation_method: ishtiqaq
      justification: "من جذر خلف على وزن فِعَال، يدلّ على المغايرة والمعاكسة. يُستعمل بمعنى ما يخالف الشيء"
    - lemma: "مُنَاقِض"
      generation_method: ishtiqaq
      justification: "من جذر نقض على وزن مُفَاعِل، اسم فاعل من ناقَضَ. يدلّ على الذي يعارض الشيء ويناقضه"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "ضِدّ"
      confirm:
        - text: "«كل شيء ضاد شيئا ليغلبه الشيء المقابل لغيره كالسواد للبياض»"
          source: "كتاب العين"
        - text: "«المخالفُ, والنقيضُ. (عند المنطقيين): الضِّدَّان هما اللذان لا يجتمعان في موصوفٍ واحدٍ, وقد ينتفيان معًا كالأحمر والأسود»"
          source: "المعجم الكبير"
        - text: "«(في المنطق) Contrary: تقابُلُ صِفتَيْن مختلفتَيْن كلَّ الاختلاف, تتعاقبان علىموضوع واحدٍ, ولا تَجْتَمِعان كالسَّواد والبياض»"
          source: "المعجم الكبير"
        - text: "«مصطلح تواضعي يدل على العكس أو على التقابل، مثال: مؤنث ضد مذكر»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«الضِّدُّ، بالكسر، والضَّدِيدُ: المِثْلُ، والمُخالِفُ، ضِدٌّ، ويكونُ جَمْعاً»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "ضِدّ من الأضداد اللغوية: يدلّ على المِثْل والمُخالِف معاً"
        - text: "«الضِّدّ في اللغة ناهمتا. وعند المتكلّمين والفقهاء هو المقابل. وعند الحكماء هو قسم من المقابل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يميّز بين المفهوم اللغوي والاصطلاحي عند المتكلّمين والحكماء"

    - lemma: "عَكْس"
      confirm:
        - text: "«(فى المنطق): تبديلٌ فى طرفى القضية لتنشأ قضية أخرى مساوية للأولى فى الصدق»"
          source: "المعجم الوسيط"
        - text: "«الضدّ؛ العكس؛ النقيض»"
          source: "المورد الحديث (ترجمة reverse)"
      contradicts:
        - text: "«العَكْسُ: رَدُّكَ الشَّيْءُ إِلَى أَوَّلِهِ»"
          source: "مختار الصحاح للرازي"
          conflict: "المعنى الأصلي للعكس هو ردّ الشيء وقلبه، لا التضادّ المحض"
      expands:
        - text: "«الشيءَ عَكْسا: قلَبَهُ ردَّ آخره على أوله؛ يقال: عكس الكلام»"
          source: "المعجم الوسيط"
          addition: "المعنى الأساسي هو القلب والرّدّ، والاستعمال بمعنى الضدّ توسّع دلالي حديث"
        - text: "«العَيْنُ وَالْكَافُ وَالسِّينُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى مِثْلِ مَا تَقَدَّمَ ذِكْرُهُ مِنَ التَّجَمُّعِ وَالْجَمْعِ... الْعَكْسُ: رَدُّكَ آخِرَ الشَّيْءِ عَلَى أَوَّلِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل في الجذر هو الجمع والرّدّ، لا المقابلة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَقِيض"
      confirm:
        - text: "«المخالف (نقيض الدعوى): (في الفلسفة): قضيَّة تُعارِض دَعْوًى معيَّنة»"
          source: "المعجم الوسيط"
        - text: "«النقيض: فِي التَّنَاقُض»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«نقيضة — antithesis»"
          source: "مسرد الفلسفة وعلم النفس (أليكسو)"

    - lemma: "طِبَاق"
      contradicts:
        - text: "«المطابق (عند أهل البديع) الجمع بين معنيين متقابلين»"
          source: "المعجم الوسيط"
          conflict: "الطباق مصطلح بلاغي يعني الجمع بين المتقابلين في الكلام، لا المقابل التامّ ذاته"
        - text: "«تقابل بين كلمتين في نص واحد أو بين مجموعة من الكلمات ذات معان متقابلة»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          conflict: "يُحصَر في السياق البلاغي/اللساني، لا يُستعمل بمعنى الضدّ المطلق"

    - lemma: "خِلَاف"
      evidence_status: "no_material_found"

    - lemma: "مُنَاقِض"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── ضِدّ (موجودة) ──
    - lemma: "ضِدّ"
      decision: confirmed
      decision_reason: "لفظة عربية أصيلة راسخة في المعاجم الكلاسيكية والحديثة بمعنى المخالف والمقابل. مؤيَّدة بشواهد من كتاب العين والمعجم الكبير والوسيط والقاموس المحيط. هي اللفظ الأوّل الذي يتبادر للذهن عند إرادة المقابل التامّ"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "ضِدّ يدلّ على المقابلة الذاتية بين الأشياء (السواد ضدّ البياض)، وهو أعمّ من نَقِيض الذي يختصّ بالتناقض المنطقي. كما أنّ ضِدّ قد يكون للواحد والجمع"

    # ── عَكْس (موجودة) ──
    - lemma: "عَكْس"
      decision: confirmed
      decision_reason: "عَكْس لفظة فصيحة يشيع استعمالها في العربية المعاصرة بمعنى الضدّ والمقابل، وإن كان أصلها اللغوي يدلّ على القلب والرّدّ. التوسّع الدلالي مقبول ومثبَت في المعاجم الحديثة (المعجم الوسيط، المورد)"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "عَكْس يحمل دلالة القلب والانعكاس (عكس الاتجاه)، فيُستعمل حين يكون التقابل بين شيئين يمكن تصوّر أحدهما قلباً للآخر، بخلاف ضِدّ الذي يدلّ على التقابل المحض"

    # ── نَقِيض (مرشح المرحلة ١) ──
    - lemma: "نَقِيض"
      source: stage1
      decision: confirmed
      decision_reason: "نَقِيض مثبت في المعجم الوسيط بمعنى «المخالف» وفي الاصطلاح الفلسفي بمعنى «القضيّة المعارضة». ورد في مسرد الفلسفة ترجمةً لـ antithesis تحديداً. يُضيف بعداً دلالياً دقيقاً لا يغطّيه ضِدّ ولا عَكْس"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "نَقِيض يفيد المعارضة التامّة التي لا يمكن رفعها (النقيضان لا يجتمعان ولا يرتفعان)، فهو أقوى من ضِدّ الذي يُمكن أن يرتفع (الأحمر والأسود ضدّان قد يرتفعان بوجود لون ثالث)"
      actions:
        - command: create_entry
          params:
            lemma: "نَقِيض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── طِبَاق (مرشح المرحلة ١ — مرفوض) ──
    - lemma: "طِبَاق"
      source: stage1
      decision: removed
      decision_reason: "الطباق مصطلح بلاغي مختصّ بفنّ البديع، يعني الجمع بين المتقابلين في الكلام. وهو يصف أسلوباً بلاغياً لا مفهوم المقابلة ذاته. لا يُستعمل في العربية بمعنى الضدّ أو المقابل التامّ خارج سياق البلاغة"

    # ── خِلَاف (مرشح المرحلة ١ — مرفوض) ──
    - lemma: "خِلَاف"
      source: stage1
      decision: removed
      decision_reason: "خِلاف يدلّ على المغايرة والاختلاف عموماً، وليس على التقابل التامّ تحديداً. الخلاف أعمّ بكثير من مفهوم المقابل التامّ، إذ يشمل أيّ اختلاف ولو يسيراً. لم تُوجَد أدلة معجمية تدعم استعماله بهذا المعنى الخاصّ"

    # ── مُنَاقِض (مرشح المرحلة ١ — مرفوض) ──
    - lemma: "مُنَاقِض"
      source: stage1
      decision: removed
      decision_reason: "مُنَاقِض اسم فاعل (صفة) لا اسم ذات، فلا يصلح لمّةً اسمية في مجموعة ترادفية مقامها ن. ويُستعمل وصفاً لا مصطلحاً مستقلاً بمعنى المقابل التامّ"


