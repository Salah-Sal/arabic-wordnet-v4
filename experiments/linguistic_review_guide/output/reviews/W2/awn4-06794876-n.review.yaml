# مراجعة المجموعة الترادفية — awn4-06794876-n
# opinion / view — رَأْي / وِجْهَة نَظَر
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج إعادة صياغة بأسلوب معجمي عربي"
      - "وِجْهَة نَظَر تعبير مركب إضافي يحتاج فحص التثبيت المعجمي"
    observations: >
      المجموعة تعالج مفهوم «الرأي» بوصفه رسالةً تُعبِّر عن اعتقاد يُتمسَّك به بثقة دون
      إثبات بدليل قاطع. المفهوم أصيل في الثقافة العربية وله حضور معجمي كثيف.
      اللمّتان الموجودتان (رَأْي، وِجْهَة نَظَر) تغطيان المعنى الأساسي، لكنّ
      المعجمية العربية تمتلك ألفاظاً إضافية دقيقة كـ«مَذْهَب» و«نَظَر» بمعنى التأمل الذهني.
  blind_candidates:
    - lemma: "مَذْهَب"
      generation_method: ishtiqaq
      justification: >
        من الجذر «ذ هـ ب» على وزن مَفْعَل، يدلّ على الطريقة والمسلك الفكري الذي
        يذهب إليه المرء. استُعمل كثيراً في التراث الإسلامي بمعنى الرأي والاعتقاد
        الذي يتبنّاه المرء دون أن يكون يقيناً قاطعاً.
    - lemma: "نَظَر"
      generation_method: ishtiqaq
      justification: >
        من الجذر «ن ظ ر» على وزن فَعَل المصدري، يدلّ على تقليب البصيرة في الأمر
        والتأمل فيه. ورد في المعاجم بمعنى إجالة الخاطر والرأي القلبي، وهو أقرب
        إلى الجانب التأمّلي من الرأي.
    - lemma: "اعْتِقَاد"
      generation_method: ishtiqaq
      justification: >
        من الجذر «ع ق د» على وزن افتعال، يدلّ على ما يعقده المرء في قلبه من
        حكم أو تصوّر. لكنّه أقرب إلى اليقين الداخلي منه إلى الرأي غير المُثبت.
    - lemma: "مَوْقِف"
      generation_method: ishtiqaq
      justification: >
        من الجذر «و ق ف» على وزن مَفْعِل، يدلّ على الموضع الذي يقف فيه المرء
        فكرياً، أي الموضع الذهني الذي يتبنّاه. شائع في الاستعمال المعاصر بمعنى
        الرأي المُعلن تجاه قضية.


stage2_evidence:
  per_lemma:
    - lemma: "رَأْي"
      confirm:
        - text: "«الرَّأْيُ: الِاعْتِقَاد وَالْعقل وَالتَّدْبِير وَالنَّظَر والتأمل»"
          source: "المعجم الوسيط"
        - text: "«الرأي: اعتقاد النفس أحد النقيضين عن غلبة ظن، وقيل استخراج صواب العاقبة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الرأيُ: عبارَة عَن ظن قوي»"
          source: "مقاليد العلوم للسيوطي"
        - text: "«الرَّأْيُ: مَا يَرَاهُ الْإِنْسَانُ فِي الْأَمْرِ، وَجَمْعُهُ الْآرَاءُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الرأي: ما ارتاد الإنسان أي نظر فيه وأيضاً الإصابة في التدبير والاجتهاد واستنباط حِكم النازلة من النصوص»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«معتقد ومعرفة بالمحتمل كنمط أدنى لمعارضة العلم، لذلك كان وعيا بخصاص وتعارضا في التقديرات الجماعية والفردية حول الإحساس المشترك»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "يُضيف البُعد الفلسفي: الرأي بوصفه نمطاً أدنى من العلم"
        - text: "«الرأي (عِنْد الْأُصُولِيِّينَ) استنباط الْأَحْكَام الشَّرْعِيَّة فِي ضوء قَوَاعِد مقررة»"
          source: "المعجم الوسيط"
          addition: "يُضيف الدلالة الأصولية المتخصصة للرأي"

    - lemma: "وِجْهَة نَظَر"
      confirm:
        - text: "«(1) وِجهة نظرٍ (2) نقطة استشراف الأشياء»"
          source: "المورد الحديث (ترجمة point of view)"
        - text: "«وجهة نظر» (= point of view)"
          source: "مسرد الإعلام والتواصل"
        - text: "«وجهة نظر» (= viewpoint)"
          source: "مسرد الإعلام والتواصل"
        - text: "«وجهة نظر» (= point of view)"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«الوِجْهَة: الجانب والناحية والموضع الذي تتوجه إليه وتقصده وكل مكان استقبلته والقبلة وشبهها ووجهة الأمر وجهه»"
          source: "المعجم الوسيط"
          addition: "أصل «وجهة» يدلّ على الجهة والناحية، فإضافتها إلى «نظر» تعني الجهة التي ينظر منها المرء"

    - lemma: "مَذْهَب"
      confirm:
        - text: "«الحُكْمُ، بالضم: القَضاءُ... والحِكْمَةُ، بالكسر: العَدْلُ، والعِلْمُ، والحِلْمُ»"
          source: "القاموس المحيط"
      contradicts:
        - text: "«المذهب في الاصطلاح يُطلق على المعتقد الديني أو الفقهي المتبنّى»"
          source: "ملاحظة تحليلية"
          conflict: "المذهب أخصّ من الرأي؛ يدلّ على منظومة فكرية متكاملة لا مجرد رأي مفرد"

    - lemma: "نَظَر"
      confirm:
        - text: "«النّظر: إجالة الخاطر نَحْو المرئي لإدراك البصيرة إيّاه»"
          source: "مقاليد العلوم للسيوطي"
        - text: "«النَّظَرُ: تَقْلِيبُ البَصَرِ والبصيرةِ لإدرَاكِ الشيءِ ورؤيَتِهِ، وقد يُرادُ به التَّأَمُّلُ والفَحْصُ، وقد يراد به المعرفةُ الحاصلةُ بعد الفَحْصِ، وهو الرَّوِيَّةُ»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«النُّونُ وَالظَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَرْجِعُ فُرُوعُهُ إِلَى مَعْنًى وَاحِدٍ وَهُوَ تَأَمُّلُ الشَّيْءِ وَمُعَايَنَتُهُ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«النّظر: البَصَر والبصيرة... ونظرا إلى كذا وبالنظر إليه ملاحظة واعتبارا له»"
          source: "المعجم الوسيط"
          conflict: "النظر في أصله فعل التأمل والإبصار، لا الرأي المُتبنّى ذاته؛ يحتاج مجازاً ليدلّ على الرأي"

    - lemma: "اعْتِقَاد"
      evidence_status: "no_material_found"

    - lemma: "مَوْقِف"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "رَأْي"
      decision: confirmed
      decision_reason: >
        لفظ عربي أصيل من الجذر «ر أ ي»، وردت له شواهد معجمية كثيفة تؤكد دلالته
        على الاعتقاد الظنّي غير القاطع. يطابق تعريف المجموعة تماماً. تشكيله الحالي صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ على الحكم الذهني المُتبنّى بناءً على غلبة الظنّ، وهو أعمّ وأشمل
        من «وجهة نظر»، ويصلح في السياقات الفقهية والفلسفية والعامة على حدٍّ سواء.
      actions: []

    - lemma: "وِجْهَة نَظَر"
      decision: confirmed
      decision_reason: >
        تعبير مركب إضافي ثابت، مسجّل في معاجم عربية متعددة (المورد الحديث، مسرد الإعلام،
        المعجم الموحد للسانيات) بمعنى point of view / viewpoint. مقبول بوصفه
        وحدة معجمية ثابتة في العربية المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يركّز على الزاوية أو الجهة التي يُنظر منها إلى الأمر، فيُبرز
        نسبية الرأي وارتباطه بموقع الناظر، بخلاف «رأي» الذي يدلّ على الحكم الذهني بذاته.
      actions: []

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَذْهَب"
      source: stage1
      decision: removed
      decision_reason: >
        «المذهب» في الاستعمال المعجمي المستقرّ يدلّ على منظومة فكرية أو فقهية متكاملة
        (المذهب الحنفي، المذهب المعتزلي)، لا على رأي مفرد عابر. الفرق الدلالي كبير:
        المذهب أخصّ وأكثر تنظيماً من مجرد رأي، فلا يصلح مرادفاً هنا.
      evidence_assessment:
        case: mixed

    - lemma: "نَظَر"
      source: stage1
      decision: removed
      decision_reason: >
        «النظر» في أصله مصدر يدلّ على فعل التأمل والإبصار (حسّياً وعقلياً)، لا على
        المُعتقَد الناتج عنه. وإن استُعمل مجازاً بمعنى الرأي فهو استعمال محدود
        يحتاج قرينة سياقية (كقولهم «في نظري»)، ولا يصلح لمّةً مستقلة بمعنى الرأي
        دون إضافة. وجوده كمكوّن في «وجهة نظر» كافٍ.
      evidence_assessment:
        case: mixed

    - lemma: "اعْتِقَاد"
      source: stage1
      decision: removed
      decision_reason: >
        «الاعتقاد» يدلّ على ما يعقده القلب ويجزم به، وهو أقرب إلى اليقين الداخلي
        والإيمان الجازم منه إلى الرأي الظنّي غير المُثبت. التعريف ينصّ على أنّ
        الرأي «لم يُثبت بمعرفة أو دليل قاطع»، والاعتقاد أقوى من ذلك جزماً.
      evidence_assessment:
        case: no_material

    - lemma: "مَوْقِف"
      source: stage1
      decision: removed
      decision_reason: >
        «الموقف» في استعماله المعاصر يدلّ غالباً على الموضع الذهني أو السياسي تجاه
        قضية (stance/position)، وهو أقرب إلى الموقف العملي أو السياسي منه إلى
        الرأي بوصفه رسالة تُعبّر عن معتقد. كما أنّه ينتمي إلى مجموعة ترادفية أخرى.
      evidence_assessment:
        case: no_material


