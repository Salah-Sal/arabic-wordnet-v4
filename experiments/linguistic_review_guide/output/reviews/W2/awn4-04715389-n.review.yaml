      maqayis_quote: "«الْبَاءُ وَالسِّينُ وَالطَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ امْتِدَادُ الشَّيْءِ، فِي عِرَضٍ أَوْ غَيْرِ عِرَضٍ. فَالْبِسَاطُ مَا يُبْسَطُ.»"
    - lemma: "سُهُولَة"
