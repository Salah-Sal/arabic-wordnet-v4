stage1_review:
  assessment:
    concerns:
      - "قصر التعريف العربي الحالي على الجانب السلبي (التحرر من...) دون الإشارة إلى الجانب الإيجابي المتمثل في انسيابية الفعل ويسره."
    observations: "المجموعة الترادفية تغطي مفاهيم السهولة واليسر والبساطة. الألفاظ الموجودة أساسية، ويمكن إثراؤها بمصطلحات تعبر عن انسيابية الفعل (السلاسة) أو رفق الأداء (الهون)."
  blind_candidates:
    - lemma: "سَلَاسَة"
      generation_method: majaz
      justification: "تدل في الأصل على اللين والانقياد، وتستخدم مجازاً للتعبير عن سهولة الجريان وانعدام التعقيد في النظم أو الأداء."
    - lemma: "هَوْن"
      generation_method: ishtiqaq
      justification: "من الجذر (هـ و ن) الذي يدل على السكون والسكينة والسهولة، وهي تعبر عن السهولة المقترنة بالرفق واللين."
    - lemma: "بَسَاطَة"
      generation_method: ishtiqaq
      justification: "تدل على خلو الشيء من التركيب أو التعقيد، وهي المرادف المباشر لـ (simplicity)."
    - lemma: "خِفَّة"
      generation_method: majaz
      justification: "تستخدم للتعبير عن سهولة الأداء وسرعة الانجاز دون جهد كبير، كقولهم 'خفيف المحمل'."

stage2_evidence:
  per_lemma:
    - lemma: "بَسَاطَة"
      confirm:
        - text: "«بساطة: درجةُ وضوحِ وسهولةِ فَهْمِ التصميم والتنجيز implementation، لنظامٍ أو مكوِّن.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«تشير إلى الاختزال والاقتصاد بوصفهما مقياسين بالإضافة إلى 'الانسجام' و'الشمولية'.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
    - lemma: "سُهُولَة"
      confirm:
        - text: "«السُّهُولة في الكلام: خلوُّ اللفظ من التكلف والتعقيد والتعسُّف في السَّبك»"
          source: "المعجم الوسيط"
        - text: "«Easiness، ease: Facilite، aisance هي في البديع خلوّ اللفظ من التكليف والتعقيد»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
    - lemma: "يُسْر"
      confirm:
        - text: "«يُسْر: السهولة واللين والغني.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«اليُسْرُ: ضد العسر. {يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلا يُرِيدُ بِكُمُ الْعُسْرَ}»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
    - lemma: "سَلَاسَة"
      confirm:
        - text: "«سَلَاسةُ اللَّفْظ: سُهولته ورقَّتُه وانسجامُه. يقال: فى كلامه سَلَاسَةٌ»"
          source: "المعجم الكبير"
        - text: "«سلاسة اللفظ: سهولته ورقَّته وانسجامُه»"
          source: "المعجم الوسيط"
    - lemma: "هَوْن"
      confirm:
        - text: "«الهَون بالفتح، للسهولة واليسر ومنه معنى الدعة واللين»"
          source: "الإعجاز البياني للقرآن لعائشة عبد الرحمن"
        - text: "«(الهون) الرفق والتؤدة وَيُقَال على هونك على رسلك»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "خِفَّة"
      confirm:
        - text: "«وهو في العَقْل والعمل مجازٌ» (بمعنى السهولة والنشاط)"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "بَسَاطَة"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن خلو الأمر من التعقيد، وهو المقابل الدقيق لـ (simplicity)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
    - lemma: "سُهُولَة"
      decision: confirmed
      decision_reason: "اللفظ الأكثر شيوعاً وعمومية للدلالة على عدم وجود صعوبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
    - lemma: "يُسْر"
      decision: confirmed
      decision_reason: "لفظ قرآني أصيل يعبر عن السهولة والانقياد، وهو نقيض العسر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
    - lemma: "سَلَاسَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن السهولة المقترنة بالانسجام والجريان دون عوائق، وتناسب جداً سياق (ease)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سَلَاسَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04715389-n"}
    - lemma: "هَوْن"
      source: stage1
      decision: confirmed
      decision_reason: "تضيف معنى الرفق واللين إلى السهولة، وهي لفظ فصيح ومدعوم بالأدلة المعجمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "هَوْن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04715389-n"}
    - lemma: "خِفَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم دلالتها المجازية على السهولة، إلا أن معناها الحقيقي المرتبط بالوزن يظل غالباً عليها، مما قد يسبب التباساً."

stage4_content:
  definition:
    current: "التحرر من الصعوبة أو المشقة أو الجهد"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط، ويفضل صياغته بأسلوب معجمي يجمع بين نفي العسر وإثبات السهولة."
    authored:
      - type: linguistic
        text: "خُلُوُّ الأَمْرِ مِنَ الصُّعُوبَةِ أَوِ التَّكَلُّفِ أَوِ المَشَقَّةِ، مِمَّا يَجْعَلُ القِيَامَ بِهِ سَهْلًا مُيَسَّرًا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "بَسَاطَة"
        examples:
          - text: "أُعْجِبْتُ بِبَسَاطَةِ الحَلِّ الَّذِي قَدَّمَهُ لِلْمُشْكِلَةِ."
            type: usage
      - lemma: "سُهُولَة"
        examples:
          - text: "انْتَهَى مِنَ العَمَلِ بِسُهُولَةٍ بَالِغَةٍ بَعْدَ تَنْظِيمِ مَهَامِّهِ."
            type: usage
      - lemma: "يُسْر"
        examples:
          - text: "تَمَّ كُلُّ شَيْءٍ بِيُسْرٍ بَعْدَ أَنْ كَانَ مُعَقَّدًا."
            type: usage
      - lemma: "سَلَاسَة"
        examples:
          - text: "يَتَّسِمُ كَلَامُهُ بِالسَّلاسَةِ وَالوُضُوحِ وَعَدَمِ التَّكَلُّفِ."
            type: usage
      - lemma: "هَوْن"
        examples:
          - text: "إِنَّمَا الأَمْرُ هَوْنٌ فَلَا تُعَقِّدِ المَسَائِلَ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-04715389-n", definition_index: 0, text: "خُلُوُّ الأَمْرِ مِنَ الصُّعُوبَةِ أَوِ التَّكَلُّفِ أَوِ المَشَقَّةِ، مِمَّا يَجْعَلُ القِيَامَ بِهِ سَهْلًا مُيَسَّرًا."}

