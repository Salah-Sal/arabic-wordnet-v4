# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'قومية' تدلّ في المعاجم الكبرى على 'الرابطة القومية' (nationalism/national bond) أكثر من دلالتها على 'حالة كونه أمة' (nationhood)، ما يفضي إلى خلط محتمل بين مفهومَي القومية-nationalism والقومية-nationhood"
      - "اللمّة 'كيان وطني' تعبيرٌ تركيبي يُشير إلى الكيان الملموس للأمة (national entity) لا إلى الحالة المجردة (the state of being a nation)، فالدلالتان مختلفتان نوعاً"
      - "التعريف الحالي 'حالة كونه أمة' ترجمةٌ حرفية للإنجليزية لا تستوفي أسلوب التعريف المعجمي العربي بجنسه القريب وفصله النوعي"
      - "غياب تشكيل كامل على اللمّة 'قومية'"
    observations: >-
      تعبّر هذه المجموعة عن مفهوم 'nationhood' وهو الصفة المجردة أو الوضع
      الذي تبلغه الجماعة البشرية لتصبح أمة ذات هوية موحدة وكيان سياسي
      مستقل. يقع هذا المفهوم في فضاء دلالي يشتبك مع القومية (nationalism)
      والجنسية (nationality) والسيادة (sovereignty)، غير أنه أخصّ: فهو
      ينصبّ على الحالة/الوضع (state) لا على الأيديولوجيا ولا على الرابطة
      القانونية. الفئة العليا 'حَالَة' مناسبة. اللمّة 'قومية' مقبولة بالجملة
      لأن مرجعاً معاصراً (المورد الحديث) يُصرّح بـ nationhood ترجمةً لها،
      لكنها تحتاج إلى تحرير التشكيل وتوثيق النعت الدلالي.
  blind_candidates:
    - lemma: "أُمَمِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي بإضافة ياء النسب والتاء إلى 'أُمَم' (جمع أُمَّة)؛ يدلّ
        على الصفة الجامعة لكون الجماعة أُمَّةً ذات وجود مستقل. صِيغَ على
        الوزن الاستحداثي (فُعَلِيَّة) للدلالة على الانتماء إلى مفهوم الأمة
        بمعناه الجمعي دون الرجوع إلى المفرد (أُمِّيَّة) الذي التبس بمعنى آخر.
    - lemma: "قَوْمِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من 'قَوْم' بإضافة ياء النسب والتاء؛ يدلّ على حالة كون
        الجماعة قوماً واحداً متماسكاً ذا هوية مشتركة وتضامن. يُقابل
        'nationhood' دلالياً من حيث إنه يعبر عن وضع الانتماء إلى الأمة
        بوصفها وحدة حضارية، لا مجرد الشعور العاطفي القومي.
    - lemma: "اِسْتِئْمَام"
      generation_method: ishtiqaq
      justification: >-
        مصدر على وزن استفعال من الجذر 'أمم'، يدلّ على الحالة التي تبلغها
        الجماعة فتصبح أمة ذات سيادة مستقلة. وزن استفعال يفيد الطلب والتحقق،
        مما يناسب معنى 'بلوغ مرتبة الأمة' أو 'حصول وصف الأمة'.
    - lemma: "كِيَانِيَّةُ الأُمَّةِ"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من 'كِيَانِيَّة' (المصدر الصناعي من كيان بمعنى الوجود
        المستقل) مضافاً إلى 'الأُمَّةِ'؛ يدلّ على الحالة المجردة لامتلاك
        الجماعة كياناً أمياً مستقلاً، أي كونها أمة بالفعل لا بالقوة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "قومية"
      confirm:
        - text: >-
            «القَوْمِيَّةُ: صلة اجتماعية عاطفية تنشأ من الاشتراك في الوطن
            والجنس واللغة والمنافع. وقد تنتهي بالتضامن والتعاون إلى الوحدة,
            كالقومية العربية. (محدثة)»
          source: "المعجم الوسيط، مجمع اللغة العربية"
        - text: >-
            «(القومية) صلَة اجتماعية عاطفية تنشأ من الِاشْتِرَاك فِي الوطن
            وَالْجِنْس واللغة وَالْمَنَافِع وَقد تَنْتَهِي بالتضامن والتعاون
            إِلَى الْوحدَة كالقومية الْعَرَبيَّة (محدثة)»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: >-
            «القومية: الصّفة أو الرابطة القوميّة.» [وترجمتها الإنجليزية:
            nationhood]
          source: "المورد الحديث (2008)"
      expands:
        - text: >-
            «(1) القوميّة: الصفة أو الرابطة القومية (را. nationalism)
            (2) الجنسية؛ التابعيّة
            (3) الاستقلال السياسي
            (4) شعب؛ قوميّة the various nationalities of America.»
            [translation_en: nationality]
          source: "المورد الحديث (2008)"
          addition: >-
            يكشف المدخل أن 'قومية' تشتمل على دلالات متعددة تتضمن nationhood
            وnationality والاستقلال السياسي، مما يُثبت سعة الاستعمال وإن كان
            المعنى المقصود في هذه المجموعة (nationhood) ضمن هذا الطيف.

    - lemma: "كيان وطني"
      confirm:
        - text: >-
            «كِيان: حقيقة الشيء أو وجوده المستقل.» [translation_en: entity]
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: >-
            «الكِيان الصهيونيّ [فصيحة]: ذكرت المعاجم كِيان بالكسر، يقال:
            كان الشيءُ كوْناً، وكِيانًا، وكينونةً.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: >-
            «كيان: شيء مادي أو غير مادي يمكن التعرُّف عليه وتمييزه بوضوح.»
            [translation_en: Entity]
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          conflict: >-
            'كيان' بمعنى entity يُشير إلى الكيان الملموس أو القابل للتمييز،
            لا إلى الحالة المجردة 'the state of being a nation'؛ فالمركّب
            'كيان وطني' = national entity (مفهوم اسمي ملموس) لا nationhood
            (مفهوم مصدري مجرد).

    - lemma: "أُمَمِيَّة"
      expands:
        - text: >-
            «أُمَمِيَّة — الجذر: أ م م — مثال: تشريعات أمميّة — الرأي:
            مرفوضة — السبب: للنسب إلى الجمع مباشرة دون ردِّه إلى المفرد.
            الصواب والرتبة: تشريعات أمميّة [فصيحة] — التعليق: لما كان معنى
            الاشتراك الجمعي مقصودًا فإن الأدق النسب إلى الجمع... وبرأيهم
            [الكوفيين] أخذ مجمع اللغة المصري.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: >-
            أُمَمِيَّة فصيحة كصفة (نسبة إلى أُمَم)، لكنها لم ترد في أي مصدر
            بمعنى مصدري للدلالة على 'حالة كونه أمة'.

    - lemma: "اِسْتِئْمَام"
      evidence_status: "no_material_found"

    - lemma: "كِيَانِيَّةُ الأُمَّةِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: قومية ──
    - lemma: "قومية"
      decision: confirmed
      decision_reason: >-
        اللمّة مؤكدة بدليل معجمي صريح في المورد الحديث الذي يُثبت 'nationhood'
        ترجمةً لـ'القومية'. وإن كانت التعريفات الكبرى (الوسيط) تُبرز جانب
        الرابطة العاطفية/القومية، فإن الاستعمال العربي الحديث يوظّفها للمفهومين
        معاً (nationalism + nationhood) وهو ما يُبرره وضع السياق المعجمي. تحتاج
        تحرير التشكيل الكامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تحمل 'قَوْمِيَّة' ثقلاً دلالياً متعدداً يشمل الرابطة القومية
        (nationalism) والوضع/الصفة التي تبلغها الجماعة لتكون أمة (nationhood)؛
        ولذا فهي اللمّة الأشمل في هذه المجموعة والمُرجَّحة معجمياً.
      borrowing_check:
        type: ishtiqaq
        verdict: "عربي أصيل — مصدر صناعي من قوم"
      quality_gate:
        consistency: "مطّرد، شائع الفصيح"
        ease_of_use: "يسير التداول"
        suitability: "ملائم للمفهوم المجرد"
        heritage_preference: "مُؤْثَر — كلمة عربية"
        arabic_preference: "عربي خالص"
        derivability: "قابل للاشتقاق (قومياتٌ، التقومية)"
      morphological_check: "وزن فَعْلِيَّة مناسب للمصدر الصناعي الدال على الصفة المجردة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَوْمِيَّة"

    # ── لمّة موجودة: كيان وطني ──
    - lemma: "كيان وطني"
      decision: removed
      decision_reason: >-
        أولاً: 'كيان وطني' = national entity وهو مفهوم اسمي ملموس يُشير إلى
        وجود الأمة كتجمع سياسي، بينما المجموعة (nationhood) تعبّر عن الحالة
        المجردة لكون الجماعة أمة — والفرق جوهري. ثانياً: فشل اختبار التثبيت
        المعجمي: 'كيان وطني' غير موجود كمدخل مُسجَّل في أي من مصادر القاعدة،
        ويمكن إبدال 'وطني' بـ'قومي' أو 'مستقل' دون إفساد المعنى، مما يدل على
        أنه وصف حرّ لا مصطلح مسكوك. ثالثاً: يُعبَّر عن المفهوم بـ'قومية' دون
        حاجة إلى هذا التركيب.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: أُمَمِيَّة ──
    - lemma: "أُمَمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        'أُمَمِيَّة' فصيحة كصفة نسبية (تشريعات أمميّة) لكنها غير مُثبَّتة
        كمصدر اسمي للدلالة على 'حالة كونه أمة'. استعمالها مصدراً بهذا المعنى
        لا سند معجمي له فضلاً عن التباسها بالاشتراكية الأممية (Internationalism)
        الذي يستعمل فيه العرب لفظ 'أُمَمِيَّة' بمعنى مختلف تماماً.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: قَوْمِيَّة (مرشح تلقائي) ──
    - lemma: "قَوْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        هذا المرشح مطابق للمّة الموجودة في المجموعة 'قومية' التي تمّ تأكيدها
        أعلاه بتشكيل كامل، فلا داعي لإجراء إضافي.
      evidence_assessment:
        case: confirm_only

    # ── مرشح المرحلة ١: اِسْتِئْمَام ──
    - lemma: "اِسْتِئْمَام"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على 'استئمام' في أي مصدر معجمي. وإن كان الوزن عربياً صحيحاً
        نظرياً، إلا أنه غير متداول ولا مسكوك، وقد يُلتبس بـ'التأميم'
        (nationalization) الشائع في الاقتصاد السياسي.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: كِيَانِيَّةُ الأُمَّةِ ──
    - lemma: "كِيَانِيَّةُ الأُمَّةِ"
      source: stage1
      decision: removed
      decision_reason: >-
        تركيب وصفي إضافي غير مُثبَّت في أي مصدر. يفشل اختبار السكّ: 'كيانية
        الشعب' و'كيانية الدولة' وكيانية القبيلة' كلها صالحة وصفاً، مما يدل
        على أنه عبارة حرة لا مصطلح. علاوة على ذلك، 'كيانية' بمفردها كمصدر
        صناعي غير مُسجَّلة في قاعدة البيانات.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "حالة كونه أمة"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة حرفية من الإنجليزية ('the state of being a nation')
        لا تستوفي شرط التعريف المعجمي العربي الجيد: ليس فيه جنس قريب واضح،
        ولا فصل نوعي يُميّز المفهوم. كذلك يُفضي استعمال 'كونه' إلى ضمير
        مبهم المرجع.
    authored:
      - type: terminological
        text: >-
          حَالَةٌ اجتماعيةٌ-سياسيةٌ تدلُّ على بلوغِ الجماعةِ البشريةِ مرتبةَ
          الأُمَّةِ المتمايزةِ، بامتلاكِها هُوِيَّةً حضاريةً مشتركةً ووُجوداً
          سياسياً مستقلاً
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >-
          كَوْنُ الجماعةِ أُمَّةً ذاتَ كِيانٍ مستقلٍّ وهُوِيَّةٍ قوميةٍ
          متميِّزة
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >-
            حَالَةٌ اجتماعيةٌ-سياسيةٌ تدلُّ على بلوغِ الجماعةِ البشريةِ
            مرتبةَ الأُمَّةِ المتمايزةِ، بامتلاكِها هُوِيَّةً حضاريةً
            مشتركةً ووُجوداً سياسياً مستقلاً
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >-
            كَوْنُ الجماعةِ أُمَّةً ذاتَ كِيانٍ مستقلٍّ وهُوِيَّةٍ قوميةٍ
            متميِّزة

  examples:
