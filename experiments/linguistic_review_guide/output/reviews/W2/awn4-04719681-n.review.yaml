        - text: "«الاشتعالية (المرادف العربي)» — مصطلح أكاديمي موصى به مقابل ignitability"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"

    - lemma: "اِحْتِرَاقِيَّة"
      confirm:
