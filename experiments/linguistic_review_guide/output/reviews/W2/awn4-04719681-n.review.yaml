# ── المرحلة ١: المراجعة والتوليد ────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان ('قابلية الاشتعال' و'قابلية الاحتراق') خاليتان من التشكيل الكامل"
      - "المجموعة تفتقر إلى مصطلحات مفردة (غير مركّبة) تعكس المفهوم بإيجاز وتُيسّر استعماله المصطلحي"
      - "التعريف الحالي مُقتضب ولا يُفرّق بين شقَّي المفهوم: الإشعال الأولي (ignition) والاحتراق المستمر (combustion)"
      - "قد يلتبس الفرق الدلالي بين اللمّتين الحاليتين على المستخدم غير المتخصص"
    observations: "المجموعة تمثّل مفهوماً فيزيائياً تقنياً حديثاً يُعبَّر عنه في العربية بأكثر من صيغة مُتنافسة. اللمّتان الحاليتان مُركّبتان إضافيتان (قابلية + مصدر) موثّقتان في المصطلحيات التقنية العربية الحديثة، غير أنهما تفتقران إلى المفرد المُكثَّف المُوجز. جذرا 'شعل' و'حرق' حاضران في مقاييس اللغة لابن فارس بمعانٍ وثيقة الصلة بمفهوم النار والالتهاب، مما يُتيح اشتقاقاً عربياً سليماً قياسياً عبر المصدر الصناعي."

  blind_candidates:
    - lemma: "اِشْتِعَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'الاشتعال' (جذر: شعل) بإلحاق ياء النسب والتاء المربوطة، على قياس المصادر الصناعية الدالة على الصفة المجردة كـ'إنسانيَّة' و'مادِّيَّة'. يدلّ على خاصية القابلية للاشتعال بوصفها صفةً مُقطَّرة."
    - lemma: "اِحْتِرَاقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'الاحتراق' (جذر: حرق) بنفس القياس الصرفي. يُقابل combustibility ويدلّ على الخاصية الكلية للاحتراق بوصفها صفةً مجردة في المادة."
    - lemma: "وُقُودِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'الوقود' (جذر: وقد) على وزن فُعُولِيَّة، يُشير إلى خاصية المادة من حيث صلاحيتها للاشتعال والوقود. الوزن فُعُول يدلّ في العربية على القابلية (كـ'قَبُول' و'دَخُول')."
    - lemma: "تَلَهُّبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'التلهُّب' (جذر: لهب)، يدلّ على صفة الالتهاب السريع. اللهب في مقاييس اللغة يدلّ على ارتفاع لسان النار، مما يجعله قريباً من مفهوم flammability."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────
# استُعمل في هذه المرحلة: مطابقة دفعية للمداخل (استعلام ١) + إثراء بالمعرّف (استعلام ٤) + جسر إنجليزي (استعلام ٧) + مقاييس اللغة (استعلام خاص)
