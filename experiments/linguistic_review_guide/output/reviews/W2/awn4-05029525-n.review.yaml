# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-05029525-n  |  ili: i63392  |  pos: n
# المفهوم: the quality of being fibrous (fibrosity / fibrousness)
# تاريخ المراجعة: 2026-03-17
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "تليف: يُشير في جميع الشواهد الموثَّقة إلى المصطلح الطبي (fibrosis/التليف المرضي) أو إلى عملية (fibrillation)، لا إلى الصفة المجردة (fibrosity/fibrousness)؛ وزن تَفَعُّل دلالته العملية/التحوّل لا الجودة الثابتة"
      - "ليفة: مفرد 'الليف'، يدلّ على القطعة الفردية المادية من الليف (a single fiber)، لا على الصفة المجردة للكون ليفياً"
      - "التعريف الحالي 'صفة كون الشيء ليفياً' فيه دوران: يستخدم النسبة 'ليفياً' المشتقة من نفس الأصل لتعريف المفهوم دون تقديم جنس قريب مستقل"
      - "غياب مصطلح مخصص راسخ في التراث المعجمي العربي الكلاسيكي للدلالة على الصفة المجردة للكون ليفياً"
    observations: >-
      تمثّل هذه المجموعة مفهوماً تجريدياً خالصاً (جودة/صفة) لا يُعبَّر عنه بلفظ مفرد راسخ
      في الموروث المعجمي العربي. جذر الكلمة (ل-ي-ف) أصيل عربي كما أثبت ابن فارس
      («اللِّيفُ عربيَّةٌ»)، والمشتقات منه كثيرة وحيّة (ليف، أَلياف، ليفة، ليفي، تليّف)،
      غير أن الصفة المجردة (fibrosity/fibrousness) تحتاج توليد مصطلح جديد بالاشتقاق
      القياسي. اللمّتان الموجودتان (تليف، ليفة) تنتميان إلى حقلَيْن دلاليَّيْن مجاورَيْن
      لكنهما لا يُغطيان المعنى المطلوب.

  blind_candidates:
    - lemma: "لِيفِيَّة"
      generation_method: ishtiqaq
      justification: >-
        المصدر الصناعي من 'ليفيّ' (النسبة إلى الليف) على قياس فَعلِيَّة،
        وهو الوزن المنتج في العربية المعاصرة لتحويل الصفة النسبية إلى مفهوم مجرد
        (كما في: حيوية من حيّ، كهربية من كهربي، حرارية من حراري).
        يدلّ مباشرةً على صفة الكون ذا طبيعة ليفية دون دوران.
    - lemma: "تَلَيُّف"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل تلَيَّف على وزن تَفَعُّل، يدلّ على حالة الكون ليفياً؛
        وإن كان الوزن أقرب إلى وصف العملية/التحوّل منه إلى الجودة الثابتة.
    - lemma: "لُيُوفَة"
      generation_method: ishtiqaq
      justification: >-
        على وزن فُعُولة القياسي للصفات المجردة الجوهرية (كالسهولة والصعوبة والمرارة
        والحلاوة)، يدلّ على الجوهر الليفي الكامن في الشيء.
    - lemma: "لِيَافَة"
      generation_method: ishtiqaq
      justification: >-
        على وزن فِعَالة/فَعَالة المستخدم للصفات والحِرَف (كالشجاعة والكتابة والسباحة)،
        يصف ما اتّسم به الشيء من طبيعة الليف وخواصّه.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1: مطابقة دفعية (تليف، ليفة، ليفية، تليفية، ليافة، ليوفة + صيغ ال-)
#   Q2: جسر إنجليزي (fibrosity, fibrousness, fibrous, fiber, fibre)
#   Q3: مقاييس اللغة لابن فارس (جذر ليف، dictionary_id=151)
#   Q4: استعلام كلاسيكي تكميلي (ليف في مصادر hawramani/ocr)
stage2_evidence:
  per_lemma:
    - lemma: "تليف"
      contradicts:
        - text: "«تليف: مرض تتحول به الأنسجة إلى مواد متليفة فاقدة شكلها وعملها الأصليين»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ALECSO"
          conflict: "يُقابل 'fibrosis' (مرض/عملية مرضية)، لا 'fibrosity' (الصفة المجردة)"
        - text: "«تليف: الأضرار التي تصيب الرئتين، تحديداً نتيجة للتعامل مع الأسبستوس والتعرض لاستنشاق أليافه»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ALECSO"
          conflict: "يُقابل 'asbestosis'، مقيَّد بسياق طبي بيئي مخصوص"
        - text: "«تليف: fibrillation — تشظي الشرائح إلى لييفات، مثلاً شرائح PP»"
          source: "مسرد صناعة النسيج — ALECSO"
          conflict: "يُقابل 'fibrillation' (تشظٍّ ليفي)، معنى مختلف تماماً عن الصفة المجردة"
        - text: "«تليف: cirrhosis»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992) — ALECSO"
          conflict: "يُقابل 'cirrhosis' (تشمّع الكبد)، معنى طبي بعيد عن الصفة العامة"
      expands:
        - text: "«تليف: تكون أنسجة ليفية أو شبه ليفية، أو حدوث حرض ليفي»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "يُشير إلى عملية تكوّن الألياف، وهو مجاور للمعنى المطلوب لكنه يصف العملية لا الجودة الثابتة"

    - lemma: "ليفة"
      contradicts:
        - text: "«لِيفَة: من (ل ي ف) واحدة الليف بمعنى قشر النخل الذي يجاور السعف»"
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani"
          conflict: "ليفة = مفرد الليف المادي (a single fiber/piece)، لا صفة مجردة"
        - text: "«[ليف] الليفُ للنخل، الواحدة ليفَةٌ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          conflict: "ليفة = صيغة المفرد من الليف، كيان مادي لا وصف مجرد"
        - text: "«الليف من النخل معروف، والقطعة: لِيفَةٌ»"
          source: "العباب الزاخر للصغاني"
          conflict: "تأكيد إضافي أن ليفة = قطعة واحدة من الليف"

    - lemma: "لِيفِيَّة"
      contradicts:
        - text: "«ليفية: جسيمات شعرية دون المجهرية تتكون من جزيئات السليلوز، والتي تعطي الشكل الذي يوجد عليه السليلوز في جدار الخلية»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ALECSO"
          conflict: "يُقابل 'fibril' (ليفة مجهرية — كيان مادي)، وهو معنى تقني مخصوص يختلف عن الصفة المجردة"
      expands:
        - text: "«fibrous: (1) ليفيّ (2) ليفانيّ: شبيه باللِّيف (3) تليُّفي (4) مُسْتَلْيِف: ممكنٌ فَصْلُهُ إلى ألياف»"
          source: "المورد الحديث (2008) — arabterm"
          addition: "يُثبت أن 'ليفيّ' هو المقابل العربي المعتمد لـfibrous؛ ويدعم أن لِيفِيَّة (المصدر الصناعي من ليفيّ) هو الاشتقاق الطبيعي المنقاس للصفة المجردة"

    - lemma: "تَلَيُّف"
      contradicts:
        - text: "«تَلَيُّف: fibrosis»"
          source: "المعجم الطبي الموحد (2009) — ALECSO"
          conflict: "مقيَّد بمرض تلَيُّف الأنسجة (fibrosis)، وزن تَفَعُّل يدلّ على العملية لا الجودة الثابتة"
        - text: "«تليُّف: fibrosis»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — ALECSO"
          conflict: "تأكيد إضافي على ارتباط المصطلح بمرض التليف الطبي"

    - lemma: "لُيُوفَة"
      evidence_status: "no_material_found"

    - lemma: "لِيَافَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تليف"
      decision: removed
      decision_reason: >-
        جميع الشواهد المعجمية تُثبت أن 'تليف' مصطلح طبي/تقني يُقابل fibrosis
        (مرض تحوّل الأنسجة إلى مواد ليفية) أو fibrillation أو asbestosis.
        وزن تَفَعُّل دلالته العملية والتحوّل لا الجودة الثابتة.
        لا يوجد أي شاهد على استخدامه للدلالة على الصفة المجردة العامة (fibrosity).
        الحذف من المجموعة لا يحذف المدخل المعجمي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ليفة"
      decision: removed
      decision_reason: >-
        ليفة مفرد 'الليف'، يدلّ بإجماع المعاجم الكلاسيكية والحديثة على القطعة الفردية
        من الليف (a single fiber/piece)، وهو كيان مادي محسوس لا صفة مجردة.
        استخدامها للدلالة على 'الصفة المجردة لكون الشيء ليفياً' خطأ دلالي صريح.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "لِيفِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        المصدر الصناعي القياسي من 'ليفيّ' (= fibrous، موثَّق في المورد الحديث) على وزن
        فَعلِيَّة، وهو الوزن المنتج في العربية لتحويل الصفة النسبية إلى مفهوم مجرد
        (كحيوية، كهربية، ضوئية، حرارية). الشاهد التقني الوحيد (ليفية = fibril)
        يُشير إلى معنى مادي مخصوص في سياق علوم البيئة، ولا يمنع استخدام لِيفِيَّة
        للصفة المجردة في سياق آخر؛ إذ الفرق فرق سياق لا فرق صيغة.
        اجتازت اللمّة اختبار السكّ (لا تقبل إبدال مكوّناتها)،
        واختبار الاشتقاقية (الجذر ل-ي-ف وزنه ومشتقاته صحيحة)،
        وتمتلك يُسر التداول والملاءمة الصرفية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تُعبِّر عن الصفة المجردة لكون الشيء متألفاً من ألياف أو ذا طبيعة ليفية،
        في مقابل 'تليف' الذي يُشير إلى العملية أو المرض، و'ليفة' التي تُشير
        إلى الكيان الفردي المادي. ليفية تقع على مستوى الجودة المجردة (كالصلابة
        والمرونة)، بينما تليف وليفة يقعان على مستوى العملية والكيان.
      actions:
        - command: create_entry
          params:
            lemma: "لِيفِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَلَيُّف"
      source: stage1
      decision: removed
      decision_reason: >-
        يُطابق اللمّة الموجودة (تليف) في التجريد الصرفي، وقد سبق رفضها لدلالتها
        على العملية المرضية (fibrosis/fibrillation). وزن تَفَعُّل يدلّ على عملية
        التحوّل إلى ليف لا على الجودة الثابتة الدائمة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "لُيُوفَة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية على وجود هذه الصيغة في المصادر الكلاسيكية أو الحديثة.
        وإن كان وزن فُعُولة منتجاً فعلاً، فإن الجذر ل-ي-ف لا يُثبَّت له هذا الوزن
        في أي من المعاجم المستعلَمة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "لِيَافَة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية على وجود هذه الصيغة. وزن فِعَالة/فَعَالة مألوف لكنه غير
        مُثبَّت للجذر ل-ي-ف في المصادر المتاحة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


