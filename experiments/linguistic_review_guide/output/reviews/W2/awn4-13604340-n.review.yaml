# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13604340-n (ream)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التشكيل خاطئ: رَزْمَة (بالفتح) تعني الصوت أو الوجبة، والصواب رِزْمَة (بالكسر) أو رُزْمَة (بالضم) لدلالة الحزمة"
      - "التعريف فيه دوران: يستخدم كلمة «الرزمة» في تعريف «رزمة ورق»"
      - "المجموعة تحتوي على لمّة واحدة فقط"
    observations: "المفهوم هو وحدة قياس كمية الورق المعروفة بالإنجليزية بـ ream وتساوي ٤٨٠ أو ٥٠٠ ورقة. هذا مصطلح تقني في مجال الطباعة والقرطاسية. اللمّة الموجودة مركّب إضافي (رزمة + ورق) وهو تعبير شائع في الاستعمال المعاصر. المفهوم موجود في الثقافة العربية لكنّ المصطلح المخصّص له تعبير مركّب لا كلمة مفردة."

  blind_candidates:
    - lemma: "رِزْمَة"
      generation_method: ishtiqaq
      justification: "من الجذر رزم على وزن فِعْلة، تدلّ على ما جُمع في شيء واحد، وهي الكلمة الأساس التي يُبنى عليها المصطلح المركّب"
    - lemma: "رِزْمَة وَرَق"
      generation_method: tarkib
      justification: "مركّب إضافي من رِزْمة (حزمة) + ورق، يخصّص الدلالة العامة للرزمة بمادة الورق، شائع في الاستعمال المعاصر"
    - lemma: "رِزْمَة كَبِيرَة"
      generation_method: tarkib
      justification: "مركّب وصفي يميّز الرزمة الكبيرة (٥٠٠ ورقة = ream) عن الرزمة الصغيرة (٢٤-٢٥ ورقة = quire)، ورد في المعجم الموحّد للمصطلحات المهنية"
    - lemma: "مَاعُون الوَرَق"
      generation_method: tarkib
      justification: "مركّب إضافي بمعنى وعاء الورق أو مقداره، ورد في المورد الحديث ترجمةً لـ ream"


stage2_evidence:
  per_lemma:
    - lemma: "رَزْمَة وَرَق"
      confirm:
        - text: "«الرُّزْمَةُ: ما جُمِع فى شيء واحد. يقال: رزمة ثياب, ورزمة ورق, وهكذا»"
          source: "المعجم الوسيط"
        - text: "«الرِّزْمَةُ: ما جُمِعَ فى شَيْءٍ واحِدٍ. يقال: رِزْمَةُ ثِيابٍ, ورِزْمَةُ وَرَقٍ»"
          source: "المعجم الكبير"
        - text: "«رزمة كبيرة — ream — تتضمن 500 ورق للطبع»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (طباعة)"
      contradicts:
        - text: "«الرِّزمة: رزمة ورق مؤلَّفة من 24 أو 25 ورقة من قياس واحد ونوع واحد — quire»"
          source: "المورد الحديث (2008)"
          conflict: "في المورد الحديث «رزمة ورق» تُقابل quire (٢٤-٢٥ ورقة) لا ream (٥٠٠ ورقة)، وream تُقابل «رزمة كبيرة»"
      expands:
        - text: "«رُزْمَة — الرأي: مرفوضة عند بعضهم... الصواب: رَزْمَة ورق [فصيحة] — رِزْمَةَ ورقٍ [فصيحة]. التعليق: وردت الكلمة في المعاجم القديمة والحديثة بفتح الراء وبكسرها، والكسر أعلى وأفضل»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الكسر أعلى وأفضل من الفتح لدلالة الحزمة"
        - text: "«الرِّزْمَةُ: قَدرُ نِصْفِ الوعاء أو ثُلُثِه أو رُبْعِه من تَمْرٍ أو دَقِيقٍ»"
          source: "المعجم الكبير"
          addition: "الرزمة تدلّ أيضاً على مقدار محدّد من المادة، وهو قريب من دلالة وحدة القياس"
        - text: "«الرَّزْمَةُ: الوجْبَة؛ وهي الأَكلة الواحدة في اليوم والليلة — الصوت, أو الصوت الشديد, أو صوت الصبى»"
          source: "المعجم الوسيط"
          addition: "رَزْمَة بالفتح لها دلالتان أخريان (الوجبة والصوت) مختلفتان عن دلالة الحزمة"

    - lemma: "رِزْمَة"
      confirm:
        - text: "«الرُّزْمَةُ: ما جُمِع فى شيء واحد. يقال: رزمة ثياب, ورزمة ورق, وهكذا»"
          source: "المعجم الوسيط"
        - text: "«الرِّزْمَةُ: ما جُمِعَ فى شَيْءٍ واحِدٍ»"
          source: "المعجم الكبير"
      expands:
        - text: "«يَقُولُ الْعَرَبُ: رَزَمْتُ الشَّيْءَ: جَمَعْتُهُ. وَمِنْ ذَلِكَ اشْتِقَاقُ رِزْمَةِ الثِّيَابِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يؤكّد أنّ رِزْمَة مشتقّة من معنى الجمع والضمّ"

    - lemma: "رِزْمَة كَبِيرَة"
      confirm:
        - text: "«رزمة كبيرة — ream — rame — تتضمن 500 ورق للطبع»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (طباعة - كهرباء، 1996)"
      expands:
        - text: "«رزمة صغيرة — quire — main de papier (25 feuilles)»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (طباعة - كهرباء، 1996)"
          addition: "المعجم الموحّد يميّز صراحة بين رزمة كبيرة (ream) ورزمة صغيرة (quire)"

    - lemma: "مَاعُون الوَرَق"
      confirm:
        - text: "«ream — (1) ماعون الورق»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(2) يُبَرْغِل؛ يَسْحَل؛ يُوَسِّع الثّقب (3) يُزيل بالبرغلة... (5) يَخْدع»"
          source: "المورد الحديث (2008)"
          addition: "المعنى الأول فقط هو المقصود؛ بقية المعاني لمداخل أخرى للكلمة الإنجليزية ream"


stage3_analysis:
  per_lemma:
    - lemma: "رَزْمَة وَرَق"
      decision: confirmed
      decision_reason: "لمّة ثابتة مسجّلة في المعاجم (الوسيط والكبير) بصيغة «رِزْمَة ورق»، لكنّ التشكيل يحتاج تصحيحاً: الفتح (رَزْمَة) يدلّ على الصوت أو الوجبة، أمّا الحزمة فبالكسر (رِزْمَة) وهو أعلى وأفضل بنصّ معجم الصواب اللغوي"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المركّب الإضافي العامّ للدلالة على كمية من الورق مجموعة في رزمة واحدة، دون تخصيص حجم بعينه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِزْمَة وَرَق"

    - lemma: "رِزْمَة"
      source: stage1
      decision: removed
      decision_reason: "رِزْمَة مفردة تدلّ على أيّ حزمة من أيّ شيء (ثياب، ورق، تمر...) وهي أعمّ من المفهوم المقصود (كمية محدّدة من الورق). إضافتها ستُدخل لبساً مع المجموعات الأعمّ"
      evidence_assessment:
        case: confirm_only

    - lemma: "رِزْمَة كَبِيرَة"
      source: stage1
      decision: removed
      decision_reason: "رغم ورودها في المعجم الموحّد مقابل ream، إلا أنّها تعبير وصفي حرّ يفتقر إلى التثبيت المعجمي الكافي؛ يمكن إبدال «كبيرة» بـ «ضخمة» أو «عظيمة» وتبقى العبارة صالحة — فهي ليست وحدة معجمية ثابتة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "مَاعُون الوَرَق"
      source: stage1
      decision: removed
      decision_reason: "وردت في المورد الحديث فقط، وهي ترجمة فردية غير مسجّلة في المعاجم المتخصّصة بالطباعة. لفظ «ماعون» يدلّ على الوعاء أو الأداة لا على وحدة قياس الكمية، فالمصطلح غير دقيق دلالياً"
      evidence_assessment:
        case: mixed


