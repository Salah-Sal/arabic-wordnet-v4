# ── المرحلة ١: المراجعة والتوليد (أعمى — بدون رؤية اللمّات) ──
stage1_review:

  assessment:
    concerns:
      - "لمّة (توفيق) مصطلح عقدي يختصّ بتسهيل الله طريق الخير على عبده، وهو فعل إلهي مقصود لا ظاهرة عشوائية مجهولة — هذا يناقض تعريف المجموعة مباشرةً"
      - "لمّة (حظ جيد) تفتقر إلى التشكيل الكامل الإلزامي"
      - "التعريف العربي الحالي ترجمة حرفية للتعريف الإنجليزي ولم يُصَغ بأسلوب المعجم الوسيط"
    observations: >
      المجموعة تدور حول مفهوم الحظ السعيد بوصفه ظاهرةً غير محددة الأسباب ولا إرادية تُفضي إلى نتيجة طيبة.
      هذا المفهوم راسخ في المعجم العربي بكلمات أصيلة: (الحَظّ) الذي يجمعه المعجميون مع (الجَدّ) و(البَخت)،
      وكلها تُعبّر عن النصيب من الخير غير المكتسب بالسعي.
      أمّا (التوفيق) فهو من حقل الكلام والفقه لا من حقل الحظ العشوائي.

  blind_candidates:
    - lemma: "جَدٌّ"
      generation_method: majaz
      justification: >
        لفظ عربي تراثي أصيل يُرادف الحَظّ والبَخت في كتب اللغة والشعر والحديث.
        الإزاحة الدلالية من «الجِدّ» بمعنى الحزم إلى «الجَدّ» بمعنى الحظ المُصيب دون سعي —
        ولفظه ميّت الاستعمال في المعاصرة مما يتيح إحياءه دون اشتراك مع الجَدّ (الوالد الأعلى).
        يَصلح لإثراء المجموعة بالمستوى التراثي.

    - lemma: "الطَّالِعُ"
      generation_method: majaz
      justification: >
        استُعير من طلوع الكوكب الدالّ على المصير ليُشير إلى الحظ والنصيب القادم.
        تعبير «حُسن الطالع» شائع في تراث اللغة بمعنى حسن الحظ.
        غير أن الطالع منفرداً يحمل دلالة فلكية تنبؤية قد تتعارض مع وصف الظاهرة بأنها «غير متوقعة».

    - lemma: "مَيْسَرَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من جذر (يسر) على وزن مَفْعَلة، والأصل «ما تيسّر وسهل من الأمر».
        قد تحمل معنى الخير السهل الذي يصيب المرء دون جهد، وهو وجه من وجوه الحظ.
        لكنها في الاستعمال القياسي تُفيد اليُسر المالي والسهولة لا الصدفة السعيدة.

    - lemma: "يُمْن"
      generation_method: majaz
      justification: >
        من (يَمَنَ يَيمِن) بمعنى «تبرّك وأيمن»، و«اليُمن» في المعاجم: البركة وحسن الفأل.
        إزاحة دلالية من البركة الدينية إلى الحظ الطيب المفاجئ، وهي مسلك شائع في التاريخ المعجمي.
        غير أن اليُمن مرتبط بالبركة والتفاؤل لا بعشوائية الظاهرة المجهولة الأسباب.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "توفيق"
      contradicts:
        - text: "«من الله للعبد: سَدُّ طريق الشَّرّ وتسهيل طريق الخير»"
          source: "المعجم الوسيط (OCR، entry_id=33538)"
          conflict: >
            التوفيق تعريفاً هو فعل إلهي مُقصَد ومحدَّد الجهة (الله → العبد) لا ظاهرة
            «غير معروفة وغير متوقعة» — وهذا يعاكس تعريف المجموعة تماماً.
        - text: "«التوفيق: جعل الله فعل عبده موافقاً لما يحبه ويرضاه. وقال أبو البقاء: التوفيق الهداية إلى وفق الشيء وقدره وما يوافقه»"
          source: "التوقيف على مهمات التعاريف للمناوي (entry_id=813456)"
          conflict: >
            المصدر صريح في أن التوفيق نِعمة إلهية هادِفة، بينما تعريف المجموعة يصف ظاهرة عشوائية.
        - text: "«التّوفيق: بالفاء لغةً جعل الأسباب متوافقة للمطلوب أي متوافقة الحصول والتأدي إلى المُسبَّب، وحاصله توجيه الأسباب بأسرها نحو المسبّبات. وأما في عُرف العلماء فعند المعتزلة الدعوة إلى الطاعة، وقيل اللطف لتحصيل الواجب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry_id=819324)"
          conflict: >
            حتى في دلالته اللغوية العامة، التوفيق هو «توجيه الأسباب» لا غياب الأسباب —
            والمجموعة تصف ظاهرة «مجهولة الأسباب».

    - lemma: "حظ جيد"
      confirm:
        - text: "«(الحَظُّ) النَّصيبُ والجَدُّ والبَخت (ج) حُظوظ وأحاظٍ وأحُظّ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry_id=871355)"
        - text: "«الحَظُّ: النَّصيبُ، والجَدُّ، أو خاصٌّ بالنَّصيب من الخَيرِ والفَضْلِ»"
          source: "القاموس المحيط للفيروزآبادي (entry_id=797466)"
        - text: "«(1) حظّ  (2) «أ» حُسْن الطالع. «ب» نجاح؛ توفيق. / to be down on one's luck: يُمنى بسوء الحظّ»"
          source: "المورد الحديث (Al-Mawrid Al-Hadeeth, entry_id=699287، ترجمة: luck)"
        - text: "«(2) حظ سعيد He won by a fluke. / (3) حظّ That fall was a pure fluke»"
          source: "المورد الحديث (entry_id=688620، ترجمة: fluke)"
      expands:
        - text: "«(حَظَّ) الحاءُ والظاءُ أصلٌ واحد، وهو النصيبُ والجَدُّ. يُقال فلانٌ أحَظُّ من فلان، وهو مَحظوظ»"
          source: "مقاييس اللغة لابن فارس (entry_id=985906)"
          addition: >
            جذر حظظ يدلّ على المعنى الواحد: النصيب المُصاب من الخير، ولا دلالة على القصد أو السعي —
            مما يؤيّد ملاءمته لوصف الحظ العشوائي.

    - lemma: "جَدٌّ"
      confirm:
        - text: "«الجَدُّ: أبو الأب... والبَخْتُ، والحَظُّ، والحُظْوَةُ، والرِّزقُ، والعَظَمَةُ»"
          source: "القاموس المحيط للفيروزآبادي (entry_id=797053)"
        - text: "«جَدُّ الرجل: بَخْتُه»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي (entry_id=837205)"
        - text: "«(جَدَّ) الجيمُ والدالُ أصولٌ ثلاثة: الأول العظمة، والثاني الحظُّ، والثالث القطع»"
          source: "مقاييس اللغة لابن فارس (entry_id=985619)"
      expands:
        - text: "«وَأَنَّهُ تَعَالَى جَدُّ رَبِّنَا» [الجن: 3] — ارتفعت عظمة ربنا — وقيل الجَدُّ: الغِنى والحظ"
          source: "غريب القرآن في شعر العرب لابن عباس (entry_id=910853)"
          addition: >
            الجذر يحمل معنى الحظ العظيم والرزق الوافر، مما يُقرّبه من المفهوم المنشود.

    - lemma: "الطَّالِعُ"
      expands:
        - text: "«(الطالع) في اصطلاح المنجمين أو الفلكيين: ما تنبأ به المنجم من الحوادث بطلوع كوكب معين»"
          source: "المعجم الوسيط (entry_id=17519)"
          addition: >
            الطالع مرتبط بالتنبؤ الفلكي — أي المصير المُتوقَع — لا بالظاهرة المجهولة غير المتوقعة.
        - text: "«هذا من حُسنِ الطَّالِعِ»"
          source: "المعجم الكبير (entry_id=61373، شاهد استعمال)"
          addition: >
            في تعبير «حُسن الطالع» يُفيد المعنى المطلوب، لكنه مُقيَّد بالإضافة ولا يُفيده منفرداً.

    - lemma: "مَيْسَرَة"
      contradicts:
        - text: "«المَيسَرَةُ: مصدر ميمي، وهي السُّهولةُ، الغِنَى والثَّراء، خلاف الميمنة أو الجهة اليُسرى»"
          source: "المعجم الوسيط (entry_id=34127)"
          conflict: >
            الميسرة تدلّ على اليُسر المالي والسهولة الدائمة لا على حادثة عشوائية مواتية.

    - lemma: "يُمْن"
      expands:
        - text: "«اليُمنُ، بالضم: البَرَكَةُ، كالمَيمَنَةِ، يَمِنَ فهو مَيمونٌ وأيمَنُ»"
          source: "القاموس المحيط للفيروزآبادي (entry_id=802394)"
          addition: >
            اليُمن يشير إلى البركة الإلهية والفأل الحسن، وهو أقرب إلى ظاهرة محمودة العاقبة
            لكنه مرتبط بالبركة لا بعشوائية الحظ.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── لمّة موجودة ──
    - lemma: "توفيق"
      decision: removed
      decision_reason: >
        التوفيق مصطلح عقدي يختصّ في جميع المصادر المعجمية المعتمدة بفعل الله تعالى في تسهيل طريق
        الخير على العبد. إنه بالتعريف: (أ) مصدره معلوم ومُسمَّى، (ب) غيرُ عشوائي. وكلا الوصفين
        يناقض تعريف المجموعة التي تشترط كون الظاهرة «غير معروفة وغير متوقعة». علاوة على ذلك، التوفيق
        في الاستعمال المعاصر حقل دلالي مستقل (المصالحة الدولية، التعديل التقني) لا يُقرأ فيه الحظ
        العشوائي أبداً. إزالة هذه اللمّة ضرورة تصحيحية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة ──
    - lemma: "حظ جيد"
      decision: confirmed
      decision_reason: >
        حَظٌّ جَيِّد مركّب وصفي ثابت يُعبّر تحديداً عن الحظ السعيد، وهو ترجمة مباشرة لـ«good luck»
        و«fluke» في المعاجم الثنائية المعتمدة (المورد الحديث). مكوّنه الأساسي «حظ» معرَّف في كتب
        اللغة بأنه «النصيب من الخير» مما يتوافق مع «النتيجة المواتية» في التعريف.
        التعبير مركّب وصفي (wasfi): اسم + صفة — وهو وحدة معجمية ثابتة مدوَّنة في المعاجم الثنائية.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز «جيد» الجانبَ التقييمي الإيجابي للحظ؛ يُستخدم في السياق المعاصر الأسلوبي
        ويُقابِل الإنجليزية «good luck / fluke» مباشرةً؛ أكثر تداولاً في العربية الحديثة
        مقارنةً بـ«جَدٌّ» التراثي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَظٌّ جَيِّد"

    # ── مرشّح المرحلة ١ ──
    - lemma: "جَدٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ عربي فصيح أصيل، مؤكَّد في مقاييس اللغة (جذر جدد، المعنى الثاني: الحظ) والقاموس المحيط
        وكتاب العين. يُرادف الحَظّ والبَخت في المعجم العربي الكلاسيكي. اجتاز اختبار التثبيت المعجمي:
        وُرِد مستقلاً في مداخل مستقلة بمعنى الحظ لا الجدّ (الوالد الأعلى).
        اختبار الاستبدال: «نال الجَدَّ» = «نال الحَظَّ» في السياق التراثي.
        وزنه الصرفي (فَعْل) يناسب المفاهيم الجوهرية غير المشتقة.
        فحص اللهجية: فصيح بامتياز.
        بوابة الجودة: يُحقّق الاطّراد والتراثية والاشتقاقية والإيثار العربي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللفظ التراثي الكلاسيكي للحظ في الشعر والنثر القديم والحديث النبوي؛ لا يتضمن تقييماً
        للجودة ويُفيد الحظ مطلقاً خيراً كان أم شراً في بعض السياقات («لا ينفع ذا الجَدِّ منك الجَدُّ»).
        يُضيف للمجموعة بُعداً تراثياً يقابل «fortune» بالدلالة الواسعة.
      actions:
        - command: create_entry
          params:
            lemma: "جَدٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشّح المرحلة ١ ──
    - lemma: "الطَّالِعُ"
      source: stage1
      decision: removed
      decision_reason: >
        الطالع في تعريفه المعجمي «ما تنبأ به المنجم من الحوادث بطلوع كوكب معين»، وهذا يجعله
        ظاهرةً مُتوقَّعة (قابلة للتنبؤ) لا مجهولة — عكس ما تشترطه المجموعة.
        في تعبير «حُسن الطالع» يُفيد المعنى المطلوب لكن منفرداً لا يؤدي هذه الدلالة.
        كما أن إيراده مُعرَّفاً بـ«ال» يُحيل إلى مداخل محددة لا إلى مفهوم الحظ العام.

    # ── مرشّح المرحلة ١ ──
    - lemma: "مَيْسَرَة"
      source: stage1
      decision: removed
      decision_reason: >
        تدلّ في جميع مصادرها على اليُسر المادي والسهولة والغِنى لا على الحادثة
        العشوائية المواتية. اختبار الاستبدال يكشف التعارض: «نال مَيسرة» = نال يُسراً لا حظاً.

    # ── مرشّح المرحلة ١ ──
    - lemma: "يُمْن"
      source: stage1
      decision: removed
      decision_reason: >
        اليُمن في مصادره بمعنى «البركة والميمنة»، وهو مرتبط بالفأل والتشاؤم والبركة الإلهية
        لا بالظاهرة المجهولة العشوائية التي يصفها تعريف المجموعة.
        يُضاف إلى ذلك أن «اليُمن» مجرّد من معنى «غير متوقع» الذي هو لبّ المفهوم.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "ظاهرة غير معروفة وغير متوقعة تؤدي إلى نتيجة مواتية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية، مقبول هيكلياً (جنس + فصل) لكنه:
        (أ) يستخدم «ظاهرة» وهي الكلمة الأولى في التعريف وكذلك في المشترك الجنسي للمجموعة الأعلى —
        يمكن تعويضها بـ«حادثة» أو «صُنع الأقدار»؛
        (ب) «غير معروفة» يُفيد الجهل المطلق بينما المقصود عدم تحديد الأسباب؛
        (ج) «نتيجة مواتية» تعبير فقير — يمكن إغناؤه.

