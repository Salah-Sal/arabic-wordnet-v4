stage4_content:
  definition:
    current: "عملية ظهور فقاعات أثناء خروج الغاز"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً، ويفضل صياغته بأسلوب معجمي يجمع بين الوصف الحركي والسبب الفيزيائي."
    authored:
      - type: terminological
        text: "اضطرابُ السائل وتصاعدُ فقاقيع غازيّة منه وتكوُّن رغوة على سطحه نتيجةَ تفاعلٍ كيميائيّ أو خروجِ غازٍ من محلول."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13492884-n"
