stage1_review:
  assessment:
    concerns:
      - المجموعة فقيرة جداً باللمّات (لمّة واحدة فقط).
      - اللمّة الموجودة "فوران" دقيقة ولكنها تحتاج إلى تعزيز بمرادفات تصف الجانب الصوتي والحركي للعملية.
    observations: "المفهوم يعبر عن ظاهرة فيزيائية/كيميائية تتميز بخروج الغاز وتكون الفقاقيع. المصطلح العربي 'فوران' هو الأكثر شيوعاً، ويمكن إثراؤه بمصطلحات تصف الصوت (نشيش) أو الهيئة (بقبقة)."
  blind_candidates:
    - lemma: "فَوَرَان"
      generation_method: ishtiqaq
      justification: "المصدر القياسي للفعل (فار) ويعبر عن الغليان والجيشان وخروج الغاز."
    - lemma: "تَفَوُّر"
      generation_method: ishtiqaq
      justification: "وزن (تفعُّل) يدل على مطاوعة الفعل أو استمرارية العملية، وورد في الأثر لوصف نبع الماء."
    - lemma: "نَشِيش"
      generation_method: ishtiqaq
      justification: "صوت الماء وغيره إذا غلى أو فارت منه الفقاقيع."
    - lemma: "بَقْبَقَة"
      generation_method: ishtiqaq
      justification: "لفظ محاكي للصوت (Onomatopoeia) يصف حركة الفقاقيع وصوتها في السائل."

stage2_evidence:
  per_lemma:
    - lemma: "فَوَرَان"
      confirm:
        - text: "«(كم) اضطراب السائل وتصاعد فقاقيع غازية منه وتكوُّن رغوة على سطحه»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«خروج الفقاقيع مع صوت الهمسة»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
        - text: "«effervescence»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "تَفَوُّر"
      confirm:
        - text: "«وفي رواية جابر: يَتَفَوَّر»"
          source: "المجموع المغيث في غريبي القرآن والحديث"
        - text: "«بفتح تاء وفوقية وواو مشددة: أي يغلي ويظهر متدفقاً»"
          source: "مجمع بحار الأنوار"
    - lemma: "نَشِيش"
      confirm:
        - text: "«صَوْت المَاء وَغَيره إِذا غلى»"
          source: "المعجم الوسيط"
        - text: "«النشيش: صوت الماء وغيره إذا غلي»"
          source: "مقاييس اللغة"
    - lemma: "بَقْبَقَة"
      confirm:
        - text: "«بقبقة»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
        - text: "«البقبقة: حكاية صوت الكوز في الماء»"
          source: "المحيط في اللغة"

