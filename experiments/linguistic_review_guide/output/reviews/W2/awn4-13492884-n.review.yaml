        examples:
          - text: "أحدث وضعُ القرص الفوّار في الكوب فورانًا شديدًا وتصاعدًا لغاز ثاني أكسيد الكربون."
            type: usage
      - lemma: "تَفَوُّر"
        examples:
          - text: "يُلاحظ تفوّر الماء عند فوهة الينبوع الحار نتيجة الضغط المتراكم."
