      - lemma: "نَشِيش"
        examples:
          - text: "يُسمع نشيشُ الفقاقيع في المشروبات الغازية عند فتح الزجاجة."
            type: usage
      - lemma: "بَقْبَقَة"
        examples:
          - text: "أخذ الطفل يراقب بقبقةَ الفقاقيع وهي ترتفع إلى سطح الحوض."
