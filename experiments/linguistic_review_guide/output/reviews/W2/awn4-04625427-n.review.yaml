stage1_review:
  assessment:
    concerns:
      - "نقص التشكيل في اللمّة 'هوية' ممّا قد يؤدّي للَبْس مع 'هَوِيَّة' (بمعنى البئر العميقة أو السقوط)."
      - "التعريف الحالي مقبول لكن يمكن تعميقه بإضافة بُعد 'الثبات والدوام' (continuity) بشكل أوضح كما في التعريف الإنجليزي."
    observations: "المصطلحات المختارة دقيقة وتعبر عن المفهوم الفلسفي والاجتماعي للهوية الشخصية."
  blind_candidates:
    - lemma: "هُوِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من الضمير 'هو'، وهو المصطلح المعياري المعتمد في الفلسفة واللغة للتعبير عن جوهر الشيء."
    - lemma: "ذَاتِيَّة"
      generation_method: ishtiqaq
      justification: "مشتقة من 'الذات'، وتعبر عن الخصائص الجوهرية التي تميز الفرد ككيان مستقل."
    - lemma: "شَخْصِيَّة"
      generation_method: ishtiqaq
      justification: "وإن كانت تدل على 'Personality'، إلا أنها تُستخدم في السياقات القانونية والنفسية للدلالة على هوية الفرد."
    - lemma: "كَيْنُونَة"
      generation_method: ishtiqaq
      justification: "تعبر عن الوجود المستمر والماهية الثابتة للفرد."

stage2_evidence:
  per_lemma:
    - lemma: "هوية"
      confirm:
        - text: "حقيقة الشيء أو الشخص التي تميزه عن غيره."
          source: "المعجم الوسيط"
        - text: "المبدأ الدائم الذي يسمح للفرد بأن يظل 'هو هو' وأن يستمر في كينونته على الرغم من التغيرات التي يسببها أو يعانيها."
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "مجموع السمات الأساسية التي تميز الفرد."
          source: "مسرد الإعلام والتواصل"
      expands:
        - text: "بطاقة يثبت فيها اسم الشخص وجنسيته ومولده وعمله وتسمى البطاقة الشخصية أيضا."
          source: "المعجم الوسيط"
          addition: "تشير إلى الجانب الإداري/القانوني للهوية."
    - lemma: "هوية شخصية"
      confirm:
        - text: "له هوية شخصية لا يحمل على نفسه بهذه الحيثية."
          source: "دستور العلماء"
    - lemma: "ذاتية"
      confirm:
        - text: "Identity"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
      contradicts:
        - text: "Subjectivity"
          source: "مسرد الفلسفة وعلم النفس"
          conflict: "تستخدم غالباً للتعبير عن الانطباع الشخصي (الموضوعية vs الذاتية) وليس الهوية."
    - lemma: "شخصية"
      confirm:
        - text: "صفات تميز الشخص من غيره."
          source: "المعجم الوسيط"
    - lemma: "كينونة"
      confirm:
        - text: "وجود، كيان."
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "هوية"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والأدق للتعبير عن مفهوم الهوية (Identity) في الفلسفة واللغة وعلم الاجتماع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُوِيَّة"
    - lemma: "هوية شخصية"
      decision: confirmed
      decision_reason: "تعبير مركب شائع الاستخدام للدلالة على الهوية الفردية المتميزة، خاصة في السياق القانوني والاجتماعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُوِيَّة شَخْصِيَّة"
    - lemma: "ذاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تستخدم غالباً في السياق الحديث بمعنى 'Subjectivity' (مقابل الموضوعية)، مما قد يسبب لبساً دلالياً."
    - lemma: "شَخْصِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم في السياق النفسي والاجتماعي مرادفاً للهوية الفردية، وهي أصل الاشتقاق لـ 'الهوية الشخصية'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "شَخْصِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الشخصية المتميزة للفرد باعتبارها كياناً مستمراً"
    assessment:
      decision: revise
      reason: "لتعزيز الدقة المصطلحية وشمول الجوانب الجوهرية والتميزية."
    authored:
      - type: terminological
        text: "حقيقة الشخص المتميزة التي تفرده عن غيره، والمبدأ الدائم الذي يسمح للفرد بأن يظل هو نفسه ومستمراً في كينونته عبر الزمن."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حقيقة الشخص المتميزة التي تفرده عن غيره، والمبدأ الدائم الذي يسمح للفرد بأن يظل هو نفسه ومستمراً في كينونته عبر الزمن."
  examples:
    per_lemma:
      - lemma: "هُوِيَّة"
        examples:
          - text: "يفقد الشعب هويته حين يفقد لغته."
            type: usage
            source: "أحمد مختار عمر"
      - lemma: "هُوِيَّة شَخْصِيَّة"
        examples:
          - text: "تُعد الهوية الشخصية حجر الزاوية في فهم التطور النفسي للفرد."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعنى علم النفس بدراسة الهوية الشخصية وكيفية تشكلها واستمرارها."}

stage5_enrichment:
  per_entry:
    - lemma: "هُوِيَّة"
      entry_id: "{auto}"
      root: "هو"
      maqayis_quote: "«... الهُوِيّة نسبة إلى الضمير 'هُوَ'؛ لأنها تعبر عن حقيقة الشيء كما هو...» (معجم الصواب اللغوي)"
    - lemma: "هُوِيَّة شَخْصِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "هوية"
          root: "هو"
          maqayis_quote: "«... نسبة إلى الضمير 'هُوَ'...»"
        - word: "شخصية"
          root: "شخص"
          maqayis_quote: "«الشين والخاء والصاد أصلٌ يدل على ارتفاعٍ في شيء وإشراف... ومنه الشخص: جماعة كلّ شيء.»"
    - lemma: "شَخْصِيَّة"
      entry_id: "{auto}"
      root: "شخص"
      maqayis_quote: "«الشين والخاء والصاد أصلٌ يدل على ارتفاعٍ في شيء وإشراف... ومنه الشخص: جماعة كلّ شيء.»"
  per_sense:
    - lemma: "هُوِيَّة"
      sense_id: "{auto}"
      nuance: "تشير إلى الجوهر والماهية (الحقيقة المطلقة للشيء)."
      mwe: false
    - lemma: "هُوِيَّة شَخْصِيَّة"
      sense_id: "{auto}"
      nuance: "تحدد الهوية من منظور الفرد وتفرده عن الآخرين في سياق نفسي أو قانوني."
      mwe: true
    - lemma: "شَخْصِيَّة"
      sense_id: "{auto}"
      nuance: "تستخدم كمرادف أعم يشمل السمات السلوكية والعاطفية المرتبطة بالهوية."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"هو","maqayis":"«الهوية نسبة إلى الضمير هو...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"هوية","root":"هو","maqayis":"«...»"},{"word":"شخصية","root":"شخص","maqayis":"«الشين والخاء والصاد أصلٌ يدل على ارتفاعٍ في شيء وإشراف...»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تشير إلى الجوهر والماهية.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
