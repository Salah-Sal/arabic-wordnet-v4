# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-13831193-n  |  ILI: i109474  |  POS: n
# المفهوم: homonymy — العلاقة الدلالية بين الألفاظ المشتركة
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التوليد الأعمى (قبل الاطلاع على اللمّات الموجودة)
  blind_candidates:
    - lemma: "الْمُشْتَرَكُ اللَّفْظِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «مُشترَك» (اسم مفعول من اشتَرَكَ) و«لَفْظِيّ» (نسبة إلى اللفظ).
        المصطلح ثابت في كتب اللسانيات العربية للدلالة على الألفاظ المتطابقة شكلاً
        المختلفة معنىً، وهو وحدة معجمية مسكوكة في التراث اللغوي.

    - lemma: "التَّجَانُسُ اللَّفْظِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «التَّجانُس» (مصدر تَجانَسَ، جذر: جنس) و«اللَّفْظِيّ».
        يصف ظاهرة تجانس الألفاظ صوتًا أو رسمًا مع اختلاف المعاني، وهو
        أكثر تخصيصًا من «الجناس» الذي يشمل مفهوم التورية البلاغية أيضًا.

    - lemma: "تَمَاثُلُ الأَلْفَاظ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «تَمَاثُل» (مصدر تَمَاثَلَ) و«الأَلْفَاظ» (جمع لَفْظ).
        يُعبّر عن العلاقة من زاوية التماثل الصوري بين الألفاظ مع ضمني اختلاف
        المعنى؛ مناسب كتعبير وصفي للظاهرة اللغوية.

    - lemma: "الاشْتِرَاكُ الصَّوْتِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «الاشتراك» (جذر: شرك) و«الصَّوْتِيّ» (نسبة إلى الصوت).
        يُخصِّص وجه الاشتراك النطقي/الصوتي في مقابل الاشتراك الكتابي، ويُتيح
        التمييز بين homophony وhomography.

  # ب. التقييم الأولي (بعد قراءة synset_info الكامل)
  assessment:
    concerns:
      - "لمّة «جِنَاس» مصطلح علم البديع (paronomasia / pun)، يُعنى بالتوظيف الجمالي للألفاظ المتشابهة في النصوص الأدبية، وليس وصفًا للعلاقة الدلالية بين الكلمات المتجانسة كما في اللسانيات الحديثة — خلط مفاهيمي بين مجالَيْن مختلفَيْن."
      - "لمّة «اشتراك لفظي» تُستخدم في بعض المعاجم العربية للدلالة على polysemy (تعدد المعاني للفظ الواحد المتعلقة بأصل اشتقاقي واحد)، مما يُوجب تحديد المراد في التعريف وتمييزه عن الـ homonymy الصرف."
      - "التعريف العربي الحالي ترجمة حرفية للنص الإنجليزي، يفتقر إلى أسلوب المعجم العلمي العربي ويخلو من التمييز بين الاشتراك الكتابي (homography) والاشتراك الصوتي (homophony) كنوعين تحت مظلة homonymy."
      - "اللمّتان معًا في المجموعة دون توثيق الفرق الدلالي بينهما."
    observations: >
      المجموعة تُعالج مفهوم homonymy بوصفه علاقةً دلاليةً، وهو مفهوم راسخ في
      اللسانيات العربية الحديثة تحت مسمى «الاشتراك اللفظي». أما «الجناس» فمصطلح
      بلاغي يمتد تاريخه من عصر الجاحظ حتى عصر التهانوي ويُعنى بالمحسّنات اللفظية
      لا بوصف العلاقة الدلالية بين ألفاظ مختلفة الأصل متطابقة الشكل. إدراجه هنا
      يعكس خلطًا شائعًا بين علم البلاغة وعلم اللسانيات. المصطلح الأصوب والأوحد
      في هذا السياق هو «الاشتراك اللفظي»، مع التنبيه إلى ضرورة تمييزه عن «تعدد
      المعاني» (polysemy) في التعريف.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات مُنفَّذة: ٥ استعلامات
# (١) دفعي للمّات الموجودة + المرشحات، (٢) إثراء بالـ entry_id،
# (٣) جسر إنجليزي، (٤) مقاييس اللغة [شرك]، (٥) مقاييس اللغة [جنس، لفظ]
stage2_evidence:
  per_lemma:

    - lemma: "اشْتِرَاك لَفْظِيّ"
      confirm:
        - text: "«تماثل كلمتين في النطق أو الكتابة واختلافهما في المعنى مما يؤدي إلى اللبس.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm) — translation_en: homonymy"
      contradicts:
        - text: "«تعدد المعاني للفظ الواحد، ومثاله لفظ 'عين' ويُطلق على 'عين الإنسان' و'عين الماء' و'عين الشمس'.»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — translation_en: polysemy"
          conflict: "هذا الدليل يُعرِّف «الاشتراك اللفظي» بمعنى polysemy لا homonymy، مما يُبيّن الخلط الاصطلاحي في استخدام المصطلح"
        - text: "«الاشتراك اللفظي خاصية من خصائص العلامة اللغوية ذات المعاني المتعددة، وهي تسمى مشتركا لفظيا.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — translation_en: Polysemy"
          conflict: "يستخدم المصطلح مرة أخرى بدلالة polysemy، ومع ذلك يُثبّت الاستخدامين معًا في اللسانيات العربية"

    - lemma: "جِنَاس"
      contradicts:
        - text: "«الجناس: [في الإنجليزية] Paronomasia، paronymy، pun. عند أهل البديع هو من المحسّنات اللفظية، وهو تشابه اللفظين في اللفظ أي في التلفّظ.»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777م)"
          conflict: "الجناس عند علماء البديع مصطلح بلاغي يخص التوظيف الجمالي المقصود للألفاظ المتشابهة في السياق الأدبي، وليس وصفًا للعلاقة الدلالية بين الكلمات"
        - text: "«الجناس: التشابه. والجناس بين اللفظين عند علماء البديع تشابههما في التلفّظ مع اختلافهما في المعنى، وهو من المحسنات اللفظية.»"
          source: "دستور العلماء للأحمدنكري (القرن ١٨م)"
          conflict: "تأكيد أن الجناس من المحسنات اللفظية في علم البديع، لا من مصطلحات العلاقات الدلالية في اللسانيات"
      expands:
        - text: "«(الجناس) (في اصطلاح البديعيين) اتِّفاق الكلمتين في كل الحروف أو أكثرها مع اختلاف المعنى.»"
          source: "المعجم الوسيط، مجمع اللغة العربية بالقاهرة (1998)"
          addition: "المعجم الوسيط يقيّده بـ«اصطلاح البديعيين»، مما يُؤكد أنه مصطلح علم البلاغة لا اللسانيات"
        - text: "«جِناس؛ مُجانَسَة.»"
          source: "المورد الحديث (2008) — translation_en: homonymy"
          addition: "المورد الحديث يُرادف جناس بـ homonymy، لكنه مدخل ترجمي معجمي لا تعريف مستقل للجناس"

    - lemma: "الْمُشْتَرَكُ اللَّفْظِيُّ"
      confirm:
        - text: "«كلمة تنطق أو تكتب مثل كلمة أخرى لكنها تختلف عنها في المعنى.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — translation_en: Homonym"
      contradicts:
        - text: "«كلمة تنطق أو تكتب مثل كلمة أخرى لكنها تختلف عنها في المعنى.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — translation_en: Homonym"
          conflict: "المصطلح يُعبّر عن homonym (الكلمة المشتركة لفظًا) لا homonymy (العلاقة والظاهرة)؛ والمجموعة awn4-13831193-n تخص العلاقة المجردة"

    - lemma: "التَّجَانُسُ اللَّفْظِيُّ"
      evidence_status: "no_material_found"

    - lemma: "تَمَاثُلُ الأَلْفَاظ"
      evidence_status: "no_material_found"

    - lemma: "الاشْتِرَاكُ الصَّوْتِيُّ"
      confirm:
        - text: "«امتلاك كلمتين أو أكثر لأصوات مماثلة غير أن مدلولات الكلمتين أو الكلمات غير مماثلة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — translation_en: Homophony"
      contradicts:
        - text: "«امتلاك كلمتين أو أكثر لأصوات مماثلة غير أن مدلولات الكلمتين أو الكلمات غير مماثلة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — translation_en: Homophony"
          conflict: "هذا المصطلح خاص بـ homophony (التماثل الصوتي فقط)، في حين أن المجموعة تشمل كلاً من homography (التماثل الكتابي) وhomophony معًا"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "اشْتِرَاك لَفْظِيّ"
      decision: confirmed
      decision_reason: >
        المصطلح العلمي الراسخ لـ homonymy في اللسانيات العربية الحديثة، موثّق بمعنيَيْه
        في المعجم الموحد لمصطلحات اللسانيات والمسرد المتخصص. رغم الخلط الاصطلاحي
        مع polysemy في بعض المصادر، يبقى «الاشتراك اللفظي» التعبير الأكثر تداولاً
        وقبولاً لدى اللغويين العرب للدلالة على ظاهرة homonymy. التشكيل الحالي
        ناقص (خلو التنوين) ويستوجب التصحيح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «الاشتراك اللفظي» يصف العلاقة المجردة والظاهرة اللسانية (homonymy كـ -ity/-ness)،
        أي مفهوم التوافق الشكلي مع الاختلاف الدلالي بين كلمتين أو أكثر بوصفه خاصية
        علمية وليس توظيفًا بلاغيًّا.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اشْتِرَاكٌ لَفْظِيٌّ"

    - lemma: "جِنَاس"
      decision: removed
      decision_reason: >
        «الجناس» مصطلح راسخ في علم البديع العربي (paronomasia / pun) يعني التوظيف
        الجمالي المقصود للألفاظ المتشابهة في النصوص الأدبية والشعرية لغرض التحسين
        اللفظي. جميع المصادر الكلاسيكية والحديثة (التهانوي، الأحمدنكري، المعجم الوسيط)
        تُقيّده بـ«اصطلاح البديعيين» ومجال المحسّنات اللفظية. أما homonymy فمصطلح
        لسانيٌّ يصف علاقةً دلاليةً بين كلمات مختلفة الأصل والمعنى متطابقة الشكل
        بصرف النظر عن أي سياق أدبي. إدراج «الجناس» في هذه المجموعة يُحدث خلطًا
        بين مجالَيْ البلاغة واللسانيات. يُستبقى في المجموعة الخاصة بـ paronomasia.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الْمُشْتَرَكُ اللَّفْظِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        يُعبّر «المشترك اللفظي» عن الكلمة المشتركة بذاتها (homonym — الوحدة المعجمية)
        لا عن الظاهرة أو العلاقة (homonymy). المجموعة awn4-13831193-n تخص العلاقة
        الدلالية المجردة، لا الوحدة اللغوية، فلا يُلائم هذا المرشح السياق الدلالي
        للمجموعة وإن كان المصطلح صحيحًا في موضعه المعجمي الخاص.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "التَّجَانُسُ اللَّفْظِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شواهد معجمية مستقلة لهذا المصطلح المركب. فضلاً عن ذلك فإن
        جذره «جنس» متداخل مع «الجناس» البلاغي المُزال من المجموعة، مما يُخشى معه
        استمرار الخلط المفاهيمي. يُفضَّل الإبقاء على «الاشتراك اللفظي» بوصفه
        المصطلح الراسخ الواضح.
      evidence_assessment:
        case: no_material

    - lemma: "تَمَاثُلُ الأَلْفَاظ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد هذا التعبير في أي مصدر معجمي مُستعلَم، ولا يجتاز اختبار التثبيت
        المعجمي — إذ يمكن إبدال «الألفاظ» بـ«الصيغ» أو «الكلمات» وتبقى العبارة
        وصفية لا مصطلحية. وهو عبارة حرة لا مصطلح مسكوك.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "الاشْتِرَاكُ الصَّوْتِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        «الاشتراك الصوتي» مُعادِل لـ homophony (التماثل في النطق دون الرسم)، وهو
        أخصّ من homonymy الذي يشمل كلاً من التماثل الكتابي (homography) والتماثل
        الصوتي. المجموعة تعالج المفهوم الأشمل فلا يصلح هذا المرشح مُعادِلاً لها.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


