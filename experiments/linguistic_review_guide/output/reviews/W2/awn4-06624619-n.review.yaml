stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «رسالة لا قيمة لها» مقتضب وأقرب إلى ترجمة حرفية للتعريف الإنجليزي، ويحتاج إلى تأليف بأسلوب معجمي عربي"
      - "اللمّة «كَلَام فَارِغ» تعبير وصفي حرّ يحتاج إلى التحقق من كونه وحدة معجمية ثابتة"
    observations: "المفهوم يدلّ على كلام أو رسالة لا طائل فيها ولا فائدة منها، وهو مفهوم أصيل في الثقافة العربية ذخرت المعاجم بألفاظ كثيرة تعبّر عنه: الهُراء، واللَّغو، والهَذَر، والتُّرَّهات. المجموعة الترادفية تقع تحت مفرط (hypernym) «رسالة/مضمون/محتوى»، فالمطلوب ألفاظ تدلّ على المحتوى التافه تحديداً لا على فعل الثرثرة."

  blind_candidates:
    - lemma: "لَغْو"
      generation_method: ishtiqaq
      justification: "من الجذر ل-غ-و على وزن فَعْل، ويدلّ في أصل الوضع على ما لا يُعتدّ به من الكلام. قال تعالى: ﴿وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا﴾. مصطلح معجمي ثابت في جميع المعاجم الكلاسيكية."
    - lemma: "هَذَر"
      generation_method: ishtiqaq
      justification: "من الجذر ه-ذ-ر على وزن فَعَل، يدلّ على سَقَط الكلام والهذيان. ورد في كتاب العين: «الهَذَر: الكلام الذي لا يُعبأ به»."
    - lemma: "غُثَاء"
      generation_method: majaz
      justification: "أصله ما يحمله السيل من رغوة وفتات، ثمّ استُعمل مجازاً للكلام الفارغ والناس الأرذال. إزاحة دلالية من المحسوس (زبد السيل) إلى المعنوي (الكلام التافه)."
    - lemma: "تُرَّهَات"
      generation_method: ishtiqaq
      justification: "جمع تُرَّهة من الجذر ت-ر-ه، تدلّ على الأباطيل من الأمور. وردت في مقاييس اللغة والشعر العربي القديم (رؤبة)."


