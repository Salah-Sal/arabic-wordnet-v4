stage1_review:
  assessment:
    concerns:
      - "كلمة 'ضيق' تشير غالباً إلى حالة نفسية (شعور) أكثر من كونها 'حدثاً' (event)."
      - "كلمة 'متاعب' صيغة جمع، والأفضل استخدام المفرد في اللمّات المعجمية إلا إذا كان المفهوم جمعياً بطبعه."
      - "التعريف العربي الحالي مختصر جداً، ويحتاج إلى توسعة لتغطية الجوانب الدلالية للمجموعة."
    observations: "المجموعة تعبّر عن المفهوم الإنجليزي 'trouble' كحدث مسبب للألم. اللمّات الموجودة مقبولة ولكنها تفتقر إلى الألفاظ العربية الأصيلة التي تصف 'الحدث' بحد ذاته مثل 'بلاء' و'نازلة'."
  blind_candidates:
    - lemma: "بَلَاء"
      generation_method: ishtiqaq
      justification: "البلاء هو المحنة تنزل بالمرء ليختبر بها، وهو حدث يسبب الغم والحزن."
    - lemma: "مِحْنَة"
      generation_method: ishtiqaq
      justification: "المحنة هي الاختبار والشدة، وتطلق على الحدث المسبب للضيق."
    - lemma: "أَذًى"
      generation_method: ishtiqaq
      justification: "الأذى هو كل ما يتأذى به الإنسان من قول أو فعل أو حدث."
    - lemma: "نَازِلَة"
      generation_method: majaz
      justification: "النازلة هي المصيبة الشديدة التي تنزل بالناس (حدث مفاجئ مسبب للضيق)."

stage2_evidence:
  per_lemma:
    - lemma: "ضيق"
      confirm:
        - text: "«الضَّيْقُ وَالضِّيقُ: فَقْرٌ وَسُوءُ حَالٍ، شِدَّةٌ، مَا ضَاقَ عَنْهُ الصَّدْرُ مِنْ هَمٍّ أَوْ حُزْنٍ»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«الضِّيقُ: نقيض السعَة... وهو في ضيق من أمره»"
          source: "المحكم والمحيط الأعظم"
    - lemma: "متاعب"
      confirm:
        - text: "«متاعب الحياة: [فصيحة]... وهذا أمر لو حمل المصاعب للقِيتَ فيه المتاعب»"
          source: "معجم الصواب اللغوي / أساس البلاغة"
    - lemma: "مشكلة"
      confirm:
        - text: "«مُشْكِلَة: [ج: مشكلات ومشكل]: مسألة صعبة تتطلّب حلاً»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "بلاء"
      confirm:
        - text: "«البلاء: المحنة تنزل بالمرء ليختبر بها والغم والحزن والجهد الشديد في الأمر»"
          source: "المعجم الوسيط"
        - text: "«الاختبار والامتحان، يكون بالخير والشر، وغلب في الشر»"
          source: "المعجم الكبير"
    - lemma: "محنة"
      confirm:
        - text: "«المحنة: الاختبار، والبلاء والشدة»"
          source: "المعجم الوسيط"
    - lemma: "نازلة"
      confirm:
        - text: "«النازلة: المصيبة الشديدة (ج) نازلات ونوازل»"
          source: "المعجم الوسيط"
    - lemma: "ضائقة"
      confirm:
        - text: "«الضائقة: أزمة أو ضيق 'مرت به ضائقة نفسية - مر بضائقة مالية'»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "أذى"
      expands:
        - text: "«الأذى: كل ما تأذيت به... ما يكره ويغتم به»"
          source: "لسان العرب"
          addition: "الأذى يشير إلى الضرر الناتج أكثر من كونه 'الحدث' المسبب."

