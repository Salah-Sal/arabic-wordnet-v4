      decision_reason: "الأذى هو المفعول أو الضرر نفسه، وليس بالضرورة 'الحدث' ككيان مستقل كما هو مقصود في trouble."

stage4_content:
  definition:
    current: "حدث يسبب الضيق أو الألم"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لغوياً ولكنه يفتقر إلى الجزالة المعجمية."
    authored:
      - type: linguistic
        text: "واقعةٌ أو حالةٌ تنزلُ بالمرءِ فتُسبّبُ له الهمَّ أو العناءَ أو الألمَ النفسيَّ أو الجسديَّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07303737-n"
          definition_index: 0
          text: "واقعةٌ أو حالةٌ تنزلُ بالمرءِ فتُسبّبُ له الهمَّ أو العناءَ أو الألمَ النفسيَّ أو الجسديَّ."
  examples:
    per_lemma:
      - lemma: "ضِيق"
        examples:
          - text: "عاش في ضيقٍ شديدٍ بعد أن فقد وظيفته."
            type: usage
      - lemma: "مَتَاعِب"
        examples:
          - text: "واجه المسافرُ متاعبَ جمّةً بسبب سوء الأحوال الجوية."
            type: usage
      - lemma: "مُشْكِلَة"
        examples:
          - text: "ظهورُ هذه المشكلةِ التقنيةِ عطل سير العمل."
            type: usage
      - lemma: "بَلَاء"
        examples:
          - text: "الصبرُ عند البلاءِ من شيمِ المؤمنين."
            type: usage
      - lemma: "مِحْنَة"
        examples:
          - text: "تجاوزت البلادُ محنتَها السياسيةَ بفضلِ الحوار."
            type: usage
      - lemma: "نَازِلَة"
        examples:
          - text: "حلّت بالقريةِ نازلةٌ أتلفت المحاصيل."
            type: usage
      - lemma: "ضَائِقَة"
        examples:
          - text: "مرت الشركة بضائقةٍ مالية اضطرتها لتقليص النفقات."
            type: usage

