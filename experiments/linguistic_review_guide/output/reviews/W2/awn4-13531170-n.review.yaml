stage4_content:
  definition:
    current: "العملية التي تكتسب بها البكتيريا عاثية تصبح مدمجة في جينومها"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في جوهره لكنه يقصر في ثلاثة أوجه: (١) يفتقر إلى
        الجنس القريب المصطلحي 'عملية بيولوجية' الذي يُثبّت التعريف في التصنيف
        العلمي الصحيح؛ (٢) لا يُشير إلى نتيجة العملية — تحوّل البكتيريا إلى
        جُرثوم مُستذيب — وهو الفيصل الذي يُميّز الاستذابة عن مجرد الإصابة
        الفيروسية؛ (٣) الأسلوب 'تكتسب عاثية تصبح مدمجة' يفصل الصلة عن مرجعها
        فصلاً يُثقل العبارة.
    authored:
