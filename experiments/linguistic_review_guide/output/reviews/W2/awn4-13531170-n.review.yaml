        text: "في علم الأحياء الدقيقة، الاستذابة هي العملية التي تُدمج فيها عاثيةٌ معتدلة جينومَها في الصبغي البكتيري للمضيف أو تُبقيه عنصراً خارج صبغي مستقلاً، منتجةً بكتيريا مُستذيبة تنقل العاثية الكامنة إلى الأجيال اللاحقة، وقد تنشط لاحقاً لتدخل الدورة الحيوية اللايتية وتُفضي إلى انحلال الخلية"
    actions:
