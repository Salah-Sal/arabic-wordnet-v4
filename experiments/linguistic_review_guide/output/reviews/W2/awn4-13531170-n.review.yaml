stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──────────────────────────────────────────
    - lemma: "استذابة"
      decision: confirmed
      decision_reason: >
        مصطلح موثّق في معجمين عربيين متخصصين بارزين (المعجم الطبي الموحد 2009
        ومعجم علم الوراثة 2009). الاشتقاق محكم: استفعال من جذر (ذوب) يعكس
        المكوّن الدلالي الأصلي lysis (الانحلال/الذوبان). تتسق معه منظومة
        اصطلاحية كاملة (مُستذيب، جرثوم مُستذيب، عامل مُستذيب). يستوفي معايير
        بوابة الجودة: اطّراد اشتقاقي ← يُسر التداول ← ملاءمة ← إيثار العربي
        ← قدرة اشتقاقية عالية. الوزن الصرفي استفعال ملائم لمصطلحات العمليات
        البيولوجية (كاسترجاع، استقلاب، استحداث). يحتاج إلى إضافة تشكيل كامل:
        اسْتِذَابَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة؛ تُركّز على الجانب الانحلالي/الاستيعابي
        (lysis) الكامن في العملية، مما يميّزها عن 'الاندماج الجيني' العام بأنها
        تخص اكتساب العاثية تحديداً وتحوّل البكتيريا إلى كيان مُستذيب. كما تتمايز
        عن 'التحلل الخلوي' بأنها تمثّل مرحلة الكمون لا التحلل الفعلي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِذَابَة"

    # ── لمّة موجودة ٢ ──────────────────────────────────────────
    - lemma: "تكون الليسوجين"
      decision: removed
      decision_reason: >
        تعبير وصفي مركّب (تركيب إضافي) يجمع 'تكوّن' بالتعريب المباشر 'الليسوجين'.
        يفشل اختبار السكّ: يمكن استبدال 'الليسوجين' بـ'الفاج' أو 'الكيان الجيني'
        فيبقى الوصف منطقياً، مما ينفي صفة المصطلح المسكوك. يفشل اختبار التثبيت
        المعجمي: لا دعم في أي مصدر محتجّ به. يخالف مبدأ إيثار العربي بأخذ الشطر
        الثاني من التعريب. وجود 'استذابة' الموثّقة يُغني عنه تماماً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١ — أ ─────────────────────────────────────
    - lemma: "اسْتِعَاثَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا دعم معجمي. وإن كان الاشتقاق من جذر عيث/عوث محكماً نظرياً، إلا أن
        وجود 'استذابة' الموثّقة في معجمين متخصصين يجعل تقديم مصطلح جديد غير
        موثّق تكثيراً غير مسوّغ. القاعدة: لا يُقبل المرشح ما لم يُفِد دلالياً
        إفادةً لا تؤديها لمّة موثّقة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ — ب ─────────────────────────────────────
    - lemma: "اسْتِذَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        يطابق اللمّة الموجودة 'استذابة' تطابقاً تاماً في الجذر والوزن والدلالة.
        توليده من التعريف وحده — دون الاطلاع على اللمّات — يُشكّل تحققاً مستقلاً
        لجودة الاشتقاق الأصلي. تمّت معالجته كاملاً ضمن اللمّة الموجودة أعلاه.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ — ج ─────────────────────────────────────
    - lemma: "اندِماجٌ عَاثِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي يفشل اختبار السكّ: يمكن استبدال 'عاثيّ' بـ'جيني' أو 'فيروسيّ'
        فيبقى الوصف صالحاً؛ ليس مصطلحاً مسكوكاً. لا دعم معجمي، لا تثبيت
        اصطلاحي في أي مصدر موثّق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشح المرحلة ١ — د ─────────────────────────────────────
    - lemma: "لَيسَجَة"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب ملاذ أخير لا مسوّغ له مع توافر 'استذابة' العربية الموثّقة. ترتيب
        الأولويات يقتضي: اشتقاق ← تركيب ← تعريب. 'استذابة' تستوفي معيار
        الاشتقاق بامتياز فلا يُنزل إلى مرتبة التعريب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


