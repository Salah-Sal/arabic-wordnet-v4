# المرحلة ٢: جمع الأدلة
# Stage 2: Evidence Gathering
# ══════════════════════════════════════════════════════════════
#
# query_log:
#   Q1 (headword batch): استذابة/الاستذابة + تكون الليسوجين + استعاثة/الاستعاثة
#      + اندماج عاثي + ليسجة/الليسجة + ليسوجين/الليسوجين + عاثية/العاثية + ذوب/الذوب
#      → entry_ids found: 604548,604583,604545,604580 (استذابة-arabterm),
#        461122 (استذابة-genetics), 873475,9890,… (ذوب-classical),
#        357213,461477,482302 (عاثية-arabterm)
#   Q2 (English bridge): lysogenization + lysogenisation + lysogeny + lysogenesis
#      + lysogenic + phage integration + bacteriophage integration
#      → found: 547864 (جرثوم مستذيب), 577437 (عامل مستذيب), 604546 (مستذيب),
#        604548/604583 (استذابة=lysogeny), 461122 (استذابة=lysogeny+definition)
#   Q3 (Arabic FTS keywords): بكتيريا + عاثية + ليسوجين + اندماج جيني + جينوم
#      → found: عاثية (bacteriophage) + جينوم/مجين entries + phage family entries
#   Total queries: 3  (budget 5-8 — under budget due to rich Q1/Q2 hits)

stage2_evidence:
  per_lemma:

    - lemma: "استذابة"
      confirm:
        - text: "«استِذابَة» — translation_en: lysogeny — domain: The Unified Medical Dictionary"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«اسْتِذابَة» — translation_en: lysogenesis — domain: The Unified Medical Dictionary"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«استذابة، تحلحل» — ظاهرة اندماج المواد الجينية لطليعة العاثية والبكتيرية الثوية. — translation_en: lysogeny"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
      expands:
        - text: "«جُرْثومٌ مُسْتَذيب» — translation_en: lysogenic bacterium"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُثبت اطّراد منظومة الاشتقاق: اسْتِذَابَة (العملية) ← مُسْتَذيب (الوصف)
            ← جُرثوم مُستذيب (الكيان الناتج). هذا التسلسل الاشتقاقي يؤكد التماسك
            الاصطلاحي الكامل للعائلة المبنية على جذر (ذوب) في المجال الجيني الطبي.
        - text: "«عامِلٌ مُسْتَذِيْب (عاثِيَةٌ جُرْثومِيَّة)» — translation_en: lysogenic factor (bacteriophage)"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُظهر امتداد المنظومة: العاثية ذاتها تُوصف بـ'المستذيب' — ربط المصطلح بالمفهوم من زاوية الفاعل (العاثية) لا المفعول (البكتيريا)."
        - text: "«مُستَذيب» — translation_en: lysogenic (adj)"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يؤكد وجود المشتق الصفي في المنظومة الاصطلاحية المتكاملة."

    - lemma: "تكون الليسوجين"
      evidence_status: "no_material_found"

    - lemma: "اسْتِعَاثَة"
      evidence_status: "no_material_found"

    - lemma: "اسْتِذَابَة"
      confirm:
        - text: "«استِذابَة» — translation_en: lysogeny"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«استذابة، تحلحل» — ظاهرة اندماج المواد الجينية لطليعة العاثية والبكتيرية الثوية."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"

    - lemma: "اندِماجٌ عَاثِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "لَيسَجَة"
      evidence_status: "no_material_found"


