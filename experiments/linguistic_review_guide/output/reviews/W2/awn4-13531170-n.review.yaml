# ══════════════════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد (أعمى)
# Stage 1: Review + Generate (blind — from definition only)
# ══════════════════════════════════════════════════════════════
#
# المدخل الأعمى (synset_info_masked.yaml):
#   definition_ar: "العملية التي تكتسب بها البكتيريا عاثية تصبح مدمجة في جينومها"
#   — لا لمّات مرئية في هذه المرحلة —

stage1_review:
  assessment:
    concerns:
      - "لمّة 'تكون الليسوجين' تعبير وصفي مركّب يحتوي على تعريب مباشر (الليسوجين) وليست مصطلحاً مسكوكاً؛ تفشل اختبار السكّ لأن 'الليسوجين' قابل للاستبدال فيبقى الوصف منطقياً."
      - "اللمّتان الموجودتان تخلوان من التشكيل الكامل في السجل الحالي."
      - "التعريف العربي الحالي صحيح لكنه يفتقر إلى الإشارة للتحوّل البيولوجي الناتج (تحوّل البكتيريا إلى جرثوم مُستذيب) وإلى الجنس القريب المصطلحي 'عملية بيولوجية'."
    observations: >
      المجموعة تغطّي مفهوم 'التَّلَيسُجُن' البيولوجي (lysogenization) — العملية التي تصبح
      بموجبها البكتيريا مضيفةً لعاثية مندمجة في جينومها. تحليل التعريف يكشف عنصرين
      محوريّين: (أ) عاثية تُكتسب، (ب) اندماج في الجينوم البكتيري. المصطلح الإنجليزي
      مشتق من lyso (lysis = انحلال) + genesis (تكوّن)، مما يفتح باب الاشتقاق العربي
      على جذر (ذوب) الذي يُفضي طبيعياً إلى وزن استفعال. وزن استفعال من (ذوب) ينتج
      'اسْتِذَابَة' — مصطلح يعكس المكوّن الدلالي lysis ويوحي بالاكتساب والاستيعاب.
      كشف التوليد الأعمى أن المرشّح الثاني يطابق اللمّة الموجودة 'استذابة' تطابقاً تاماً،
      مما يُشكّل تحققاً مستقلاً لجودة الاشتقاق الأصلي.
  blind_candidates:
    - lemma: "اسْتِعَاثَة"
      generation_method: ishtiqaq
      justification: >
        وزن استفعالة من جذر عيث/عوث — ذات الجذر الذي اشتُقّت منه 'عاثية' (bacteriophage).
        اسْتِعَاثَة = اكتساب البكتيريا للعاثية واستيعابها؛ يعكس آلية العملية مباشرةً
        من اسم العنصر الفاعل (العاثية) بدلاً من نتيجتها.
    - lemma: "اسْتِذَابَة"
      generation_method: ishtiqaq
      justification: >
        وزن استفعال من جذر (ذوب). المصطلح الإنجليزي lysogenization مشتق من
        lysis (ذوبان/انحلال) + genesis (تكوّن). 'اسْتِذَابَة' على وزن استفعال
        تُجسّد هذا المعنى: اكتساب البكتيريا خاصية الاستذابة (القدرة الكامنة على
        التحلل الخلوي بفعل العاثية). تفضيل إحياء الوزن الاشتقاقي العربي الراسخ
        على التعريب.
    - lemma: "اندِماجٌ عَاثِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (wasfi): اندماج + عاثيّ. يصف الحدث المحوري في العملية:
        اندماج جينوم العاثية في جينوم البكتيريا. اختيار التركيب لتمثيل المفهوم
        من زاوية الحدث الجيني المركزي.
    - lemma: "لَيسَجَة"
      generation_method: taarib
      justification: >
        تعريب مباشر لـlysogenization على وزن فَعلَة من الجذر المعرَّب (ليسج) —
        ملاذ أخير عند تعذّر الاشتقاق العربي أو التركيب. يقبل لام التعريف
        والجمع السالم والنسبة.


