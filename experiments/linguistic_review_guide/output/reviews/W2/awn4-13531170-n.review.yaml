          text: "عمليةٌ بيولوجيةٌ تصبح بموجبها البكتيريا مُضيفةً لعاثيةٍ يندمج جينومُها في جينومها، فتتحوّل إلى جُرثوم مُستذيب يحمل العاثية الكامنة ويتوارثها عبر الانقسامات الخلوية"
