# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-05215690-n  |  ILI: i64336
# POS: n  |  Lemmas: رومانسية، شاعرية
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'رومانسية' تحمل في المعاجم دلالةً فلسفية محددة (المذهب الرومانسي الألماني) أكثر مما تحمل معنى 'الصفة المثيرة والغامضة' المقصود هنا"
      - "اللمّة 'شاعرية' تخص أصلاً مجال الشعر والفن ولا تستوعب بالضرورة بُعد البطولة والمغامرة الغامضة"
      - "غياب التشكيل الكامل عن اللمّتين الموجودتين"
      - "التعريف الحالي مُترجَم حرفياً من الإنجليزية ويفتقر إلى بنية التعريف المعجمي (جنس قريب + فصل نوعي)"
    observations: >-
      المجموعة الترادفية تُمثّل مفهوم 'الطابع الرومانسي' بمعناه الأوسع، أي تلك الخاصية
      الجمالية التي تُضفي على الزمان أو المكان أو الحدث طابعاً مشوقاً ومثيراً يقترن
      بالبطولة والغموض والمغامرة. الجنس القريب هو 'صفة جوهرية ومميِّزة' (من الأصل
      الأعلى). اللمّتان الموجودتان تغطيان بُعدَين مختلفَين: رومانسية من الرصيد الدخيل
      المعرَّب، وشاعرية من الاشتقاق العربي الأصيل. لا يوجد مصطلح عربي خالص يوحّد
      بُعدَي الإثارة والغموض البطولي في كلمة واحدة، مما يدل على فجوة معجمية جزئية.

  blind_candidates:
    - lemma: "سِحْرِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من الجذر (سحر) في دلالته الثانية عند ابن فارس: 'إخراج الباطل في صورة
        الحق' أي الجاذبية الغامضة الخادعة للحواس. الصفة المثيرة والغامضة تشبه وظيفياً
        الخاصية السحرية التي تأسر العقول وتوهم بعالم أرحب.
    - lemma: "فَتَّانِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي على وزن فَعَّالِيَّة من الجذر (فتن)، مفيد للجودة الآسرة الخلاّبة.
        الفتّان من يأسر القلوب بشدة. والمفهوم المطلوب هو خاصية تأسر بما تحمله من إثارة
        وغموض وجمال المغامرة.
    - lemma: "وَهَج"
      generation_method: majaz
      justification: >-
        إزاحة دلالية من المعنى الحسي (حر النار وتوهجها وتلألؤها) إلى المعنى المجازي
        للإثارة والبريق. المعاجم تؤكد المجاز في 'توهج الجوهر: تلألأ' و'توهج وهج
        الطيب: انتشاره'. الوهج يعبّر عن الشيء المتوهج المشوق.
    - lemma: "أَسْرِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من (أسر) بمعنى استأسر القلب وجذبه. الخاصية الآسرة للأرواح والعقول
        تناسب وصف شيء يستولي على المخيّلة بإثارته وغموضه.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "رومانسية"
      confirm:
        - text: "«(3) الروح أو العاطفة أو الصفة الرومانتيكيّة»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(في الفلسفة): مذهبٌ جماعةٍ مِن فلاسفة الألمان ظهروا فى أواخر القرن الثامن عشر وأوائل التاسع عشر, وعلى رأسـهم 'نيتشـة' و'شلنج' و'هيجل'. ويعارض هذا المذهب الآراء السائدة فى القرن الثامن عشر, وبخاصَّة مذهب التنوير, مُعَوِّلًا على العاطفة والحدس, والحرِيَّة, ويستَهين بالقواعد الجماليَّة, والمنطقيَّة, ويعتَدُّ بفكرة الحياة واللامتناهى.»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "التعريف يقصر رومانسية على المذهب الفلسفي الألماني دون إشارة إلى دلالتها الصفتية الجمالية المقصودة في هذه المجموعة"
      expands:
        - text: "«وردت كلمة 'رومانسية' في المعجم الأساسي بمعنى العودة إلى الطبيعة وإيثار الحسّ والعاطفة على العقل والمنطق»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يثبت أن للكلمة استخداماً في المعجم الأساسي بمعنى أوسع من المذهب الفلسفي يشمل الحس والعاطفة"

    - lemma: "شاعرية"
      confirm:
        - text: "«عواملُ التأثير على الشُّعورِ فى عمل فنىٍّ أو أدبىٍّ إذا كانَ يصطنعُ لغةَ الشعرِ الفنيةَ ووسائلَهُ فى الإقناعِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      contradicts:
        - text: "«مَلَكَةُ الشِّعرِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "التعريف الأول يحصر شاعرية في ملكة الشعر الشخصية لا في صفة الأشياء والأزمنة، وهذا أضيق من المعنى المقصود في المجموعة (صفة مثيرة وغامضة كزمن بطولي)"

    - lemma: "سِحْرِيَّة"
      contradicts:
        - text: "«سَحَرِيَّةُ الإِبِل: أَنْ تُحْلَبَ في السَّحَر. (عن أبى عمرو الشيبانى)»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "الكلمة موثقة بمعنى وقتي (الفعل المرتبط بوقت السحر قبيل الفجر) لا بمعنى الجودة الجمالية الغامضة"
        - text: "«(السحرية) السَّحَرِيِّ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الكلمة لا تُفيد إلا الانتساب إلى وقت السحر"

    - lemma: "فَتَّانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "وَهَج"
      contradicts:
        - text: "«حرُّ النهار والشمس ونحوهما مِن الطِّيب: أَرَجُهُ وانتشاره»"
          source: "المعجم الوسيط"
          conflict: "الوهج في جميع المعاجم يدل على الحرارة الحسية والتوهج النوري، لا على الصفة الجمالية المثيرة الغامضة"
        - text: "«(وَهَجَ) الْوَاوُ وَالْهَاءُ وَالْجِيمُ: كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الْوَهَجُ: حَرُّ النَّارِ وَتَوَقُّدُهَا. وَيُسْتَعَارُ ذَلِكَ فَيُقَالُ: تَوَهَّجَ الْجَوْهَرُ: تَلَأْلَأَ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المجاز ينصرف إلى التلألؤ المادي (الجوهر، الطيب) لا إلى صفة الزمن أو الجو الرومانسي"

    - lemma: "أَسْرِيَّة"
      contradicts:
        - text: "«أُسَرِيّة — مثال: يجب المحافظة على الروابط الأُسَرِيَّة — الرأي: مرفوضة للنسب إلى الجمع مباشرة دون ردِّه إلى المفرد.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "أسرية في المعاجم تعني 'ما يتعلق بالأسرة (العائلة)' لا خاصية الأسر والجذب"
        - text: "«station wagon»"
          source: "مسرد الفن، التسلية والرياضة — ArabTerm"
          conflict: "ARABTERM يُسجّل أسرية بمعنى سيارة الستيشن، بعيداً تماماً عن المفهوم المقصود"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "رومانسية"
      decision: confirmed
      decision_reason: >-
        رغم أن المعجم الكبير يقصر رومانسية على المذهب الفلسفي الألماني، إلا أن المورد
        الحديث يؤكد دلالتها على 'الصفة الرومانتيكية' وهو المعنى المقصود هنا. كما يثبت
        معجم الصواب ورودها في المعجم الأساسي بمعنى إيثار الحس والعاطفة. والكلمة معرَّبة
        مقبولة تلقائياً في العربية المعاصرة وتقبل لام التعريف والنسبة والجمع. التشكيل
        غائب يستوجب التصحيح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        رومانسية تحمل بُعداً أدبياً وفلسفياً وتقترن بالمذهب الرومانسي، والمشاعر
        الغزلية البطولية، والتوق إلى الأزمنة الخيالية البعيدة. ظلّها الدلالي يميل إلى
        الحنين العاطفي والبُعد البطولي المغامراتي أكثر من الجمال الشعري الرقيق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُومَانْسِيَّة"

    - lemma: "شاعرية"
      decision: confirmed
      decision_reason: >-
        اللفظ موثق في المعجم الكبير بمعنى 'عوامل التأثير على الشعور في عمل فني أو
        أدبي'، وهو يتقاطع مع المفهوم المطلوب من حيث التأثير الجمالي والانفعالي. والاستعمال
        الشائع في العربية المعاصرة يُوسّع شاعرية لتشمل طابع الجمال الخيالي المثير في
        المشاهد والأجواء والأزمنة (يقال: شاعرية المكان، شاعرية اللحظة). معجم الصواب
        يُجيز شاعري بوصفه 'صحيحة'. التشكيل غائب يستوجب التصحيح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        شاعرية تُعبّر عن الجمال الإيحائي والتأثير العاطفي الفني الرقيق، وتميل إلى
        الحساسية الجمالية الأدبية. تصلح لوصف جمال المشاهد الطبيعية والأجواء اللحظية،
        بخلاف رومانسية التي تحمل أبعاداً بطولية ومغامراتية وأيديولوجية أوضح.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَاعِرِيَّة"

    - lemma: "سِحْرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        المعاجم لا تعرف سحرية إلا بمعنى وقتي (المرتبط بوقت السحر قبيل الفجر) أو
        بمعنى صفة الإبل التي تُحلب في السحر. لا يوجد توثيق معجمي لسحرية بمعنى
        'الخاصية الجمالية الآسرة'. الاشتراك اللفظي مع وقت السحر يُربك الدلالة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "فَتَّانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا يوجد توثيق معجمي للفظ فتانية بوصفه مصطلحاً معجمياً ثابتاً. فتنة أو فتّان
        موثقان، لكن فتانية (المصدر الصناعي) لم يُسكّ ولم يُسجَّل. اختبار السكّ:
        يمكن إبدال 'فتانية' بـ'جاذبية' أو 'سحرية' مع بقاء الوصف صالحاً، مما يعني
        أنها ليست مصطلحاً ثابتاً.
      evidence_assessment:
        case: no_material

    - lemma: "وَهَج"
      source: stage1
      decision: removed
      decision_reason: >-
        وهج في جميع المعاجم من كتاب العين إلى اللسان والمعاصرة يدل على الحرارة الحسية
        للنار والشمس وما يُستعار منها للتلألؤ المادي. لا تجيز المعاجم استعارته للصفة
        الجمالية المثيرة المقترنة بالبطولة. كما أن وهج اسم جامد لا يقبل المصدر
        الصناعي المطلوب (وهجية غير موثقة).
      evidence_assessment:
        case: contradicts_only

    - lemma: "أَسْرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        أسرية في المعاجم تعني النسبة إلى الأسرة (العائلة)، وفي ARABTERM تعني سيارة
        الستيشن. الأسر بمعنى الاستيلاء على القلب لا يُنتج أسرية مصطلحاً مسكوكاً.
        وجود الاشتراك اللفظي الكثيف مع الأسرة (family) يجعل هذا المرشح مضلِّلاً
        دلالياً ومرفوضاً.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "صفة مثيرة وغامضة (مثل زمن بطولي أو مغامرة)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مترجَم حرفياً من الإنجليزية دون إعادة صياغة معجمية. المثال
        جيد لكنه يجب أن يأتي في سياق تعريف مكتمل يبدأ بجنس قريب ('طابع'، 'خاصية')
        ويُحدد الفصل النوعي (الإثارة + الغموض + الاقتران بالبطولة والمغامرة).
        'صفة' كجنس قريب صحيح لكنه عام جداً.
    authored:
      - type: terminological
        text: "طابَعٌ جَمَالِيٌّ يُضفي على الشيء سِمَةَ الإثارة والغُموضِ المحبَّب، مقترناً بأجواء البطولة والمغامرة والتوقِ إلى الأزمنة الشريفة الرفيعة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "خاصِيَّةُ الشَّوقِ المُثيرِ والغُموضِ الآسِرِ التي تتَّسمُ بها الحِقَبُ البطولِيَّةُ والمغامراتُ الشجاعةُ فتُعطِي صاحِبَها طابعاً أخَّاذاً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "طابَعٌ جَمَالِيٌّ يُضفي على الشيء سِمَةَ الإثارة والغُموضِ المحبَّب، مقترناً بأجواء البطولة والمغامرة والتوقِ إلى الأزمنة الشريفة الرفيعة"
