stage1_review:
  assessment:
    concerns:
      - "المصطلح الحالي (شخصية نرجسية) هو ترجمة حرفية للمصطلح الإنجليزي، ومع أنه شائع علمياً، إلا أن اللغة العربية تملك ألفاظاً تعبر عن المفهوم (مثل النرجسية كلفظ مفرد)."
      - "التعريف الحالي يحتاج إلى صياغة أكثر دقة وملاءمة للأسلوب المعجمي العربي."
    observations: "المفهوم حديث في علم النفس ولكنه متجذر في التراث تحت مسمى (العجب) أو (الكبر)، مع تميز المصطلح الحديث (نرجسية) بالإشارة إلى الأبعاد السريرية والارتباط بالأسطورة اليونانية."
  blind_candidates:
    - lemma: "نَرْجِسِيَّةٌ"
      generation_method: majaz
      justification: "استخدام اسم الزهرة (النرجس) المرتبط بالأسطورة اليونانية للتعبير عن عشق الذات، وهو مصطلح معجمي مستقر في علم النفس المعاصر."
    - lemma: "تَضَخُّمُ الأَنَا"
      generation_method: tarkib
      justification: "تعبير مركب وصفي يشير إلى تضخم تقدير الذات (الأنا) بشكل غير واقعي، وهو شائع في الدراسات النفسية."
    - lemma: "عِشْقُ الذَّاتِ"
      generation_method: tarkib
      justification: "ترجمة دلالية مباشرة لمعنى الانشغال المفرط بالنفس وحبها."
    - lemma: "عُجْبٌ"
      generation_method: majaz
      justification: "لفظ تراثي يعبر عن استعظام النفس واستحقاق منزلة لا يستحقها، وهو المكون الجوهري للشخصية النرجسية."

stage2_evidence:
  per_lemma:
    - lemma: "شخصية نرجسية"
      confirm:
        - text: "«نَرْجِسِيّ: narcissistic»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«نرجسية: narcissism ... عشق الذات»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
      expands:
        - text: "«الشخصية: صِفَات تميز الشَّخْص من غَيره»"
          source: "المعجم الوسيط"
    - lemma: "نَرْجِسِيَّةٌ"
      confirm:
        - text: "«النرجسية: شذوذ جنسي فيه يشتهي المرء ذاته»"
          source: "المعجم الوسيط"
        - text: "«النَّرْجِسِيَّة: narcissism»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "تَضَخُّمُ الأَنَا"
      evidence_status: "no_material_found"
    - lemma: "عُجْبٌ"
      confirm:
        - text: "«العُجْبُ: أَن يظنّ بِنَفسِهِ اسْتِحْقَاق منزلَة هُوَ غير مُسْتَحقّ لَهَا.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«العُجْب: كِبْر وزهو وغرور، إعجابُ الشَّخْصِ بنفسه»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "شخصية نرجسية"
      decision: confirmed
      decision_reason: "مصطلح علمي مستقر يعبر بدقة عن 'Personality' المذكورة في المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَخْصِيَّةٌ نَرْجِسِيَّةٌ"
    - lemma: "نَرْجِسِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم 'النرجسية' كاسم للمفهوم وكوصف للشخصية ذاتها في السياقات العلمية والعامة، وهي أكثر إيجازاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَرْجِسِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "عُجْبٌ"
      source: stage1
      decision: removed
      decision_reason: "العجب هو 'خصلة' أو 'سمة' (trait) وليس نمطاً كاملاً للشخصية (personality type)، ومحله مجموعة ترادفية أخرى."
    - lemma: "تَضَخُّمُ الأَنَا"
      source: stage1
      decision: removed
      decision_reason: "رغم شيوعه، إلا أنه تعبير وصفي أكثر منه مصطلحاً معجمياً مستقلاً في المعاجم اللغوية."

stage4_content:
  definition:
    current: "شخصية تتسم بحب الذات والانشغال بها؛ آراء غير واقعية حول صفات المرء الخاصة وقلة اعتبار للآخرين"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية، يحتاج لرفع مستواه اللغوي ليتوافق مع أسلوب المعاجم العربية المتخصصة."
    authored:
      - type: terminological
        text: "نَمَطٌ مِنَ الشَّخْصِيَّةِ يَتَمَيَّزُ بِالاعْتِدَادِ الْمُفْرِطِ بِالذَّاتِ وَالانْغِمَاسِ فِيهَا، مَعَ تَقْدِيرٍ غَيْرِ وَاقِعِيٍّ لِلْمَوَاهِبِ وَالصِّفَاتِ الشَّخْصِيَّةِ، وَمَيْلٍ إِلَى إِهْمَالِ مَشَاعِرِ الآخَرِينَ وَحُقُوقِهِمْ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "شَخْصِيَّةٌ نَرْجِسِيَّةٌ"
        examples:
          - text: "يُحَذِّرُ عُلَمَاءُ النَّفْسِ مِنْ تَعْظِيمِ الذَّاتِ الْمُفْرِطِ الَّذِي قَدْ يَتَطَوَّرُ إِلَى شَخْصِيَّةٍ نَرْجِسِيَّةٍ مُضْطَرِبَةٍ."
            type: usage
      - lemma: "نَرْجِسِيَّةٌ"
        examples:
          - text: "تَمْنَعُ النَّرْجِسِيَّةُ صَاحِبَهَا مِنْ تَقَبُّلِ النَّقْدِ أَوْ الاعْتِرَافِ بِالْخَطَإِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "نَمَطٌ مِنَ الشَّخْصِيَّةِ يَتَمَيَّزُ بِالاعْتِدَادِ الْمُفْرِطِ بِالذَّاتِ وَالانْغِمَاسِ فِيهَا، مَعَ تَقْدِيرٍ غَيْرِ وَاقِعِيٍّ لِلْمَوَاهِبِ وَالصِّفَاتِ الشَّخْصِيَّةِ، وَمَيْلٍ إِلَى إِهْمَالِ مَشَاعِرِ الآخَرِينَ وَحُقُوقِهِمْ."}

stage5_enrichment:
  per_entry:
    - lemma: "شَخْصِيَّةٌ نَرْجِسِيَّةٌ"
      entry_id: "{auto}"
      roots:
        - word: "شخصية"
          root: "شخص"
          maqayis_quote: "«الشِّينُ وَالْخَاءُ وَالصَّادُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي شَيْءٍ. مِنْ ذَلِكَ الشَّخْصُ، وَهُوَ سَوَادُ الْإِنْسَانِ إِذَا سَمَا لَكَ مِنْ بُعْدٍ.»"
        - word: "نرجسية"
          root: "نرجس"
          maqayis_quote: "لم يرد في مقاييس اللغة لأنه لفظ أعجمي (فارسي الأصل) أو منحوت من اسم علم (نرجس/نارسيس)."
