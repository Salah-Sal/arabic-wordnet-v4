stage1_review:
  assessment:
    concerns:
      - "اللمّتان (أثر، بقية) بدون تشكيل كامل في قاعدة البيانات"
      - "لمّة (بقية) أعمّ دلالياً من المعنى المقصود: تعني ما تبقى من الشيء لا ما يدلّ على وجوده السابق — وهو فارق سِيميائي جوهري"
      - "التعريف الحالي (دلالة على أن شيئاً ما كان موجوداً) دقيق لكنه يفتقر إلى الجنس القريب المحدَّد"
    observations: >
      جوهر المفهوم في هذه المجموعة هو الوظيفة السِّيميائية للأثر: إنه ليس مجرد بقية جسمانية بل علامة أو رسم يَدُلُّ
      على حضور سابق. الراغب الأصفهاني صاغ هذا المعنى أدقَّ صياغة: «أَثَرُ الشيءِ: حصولُ ما يدلّ على وجوده»، مما
      يؤكد أن (أثر) هو المصطلح الأمثل لهذه المجموعة. أما (بقية) فتُعبّر عن الإبقاء والدوام لا عن الدلالة والإيحاء.
      الشواهد القرآنية والشعرية العربية تُثبّت (أثر) في هذا المعنى الدلالي الإشاري تثبيتاً راسخاً.
  blind_candidates:
    - lemma: "طَلَل"
      generation_method: majaz
      justification: >
        الطلل في الشعر العربي ما بقي شاخصاً من آثار الديار والحِلَل — يُعبّر بصدق عمّا يدلّ على
        حضور سابق لإنسان أو جماعة في مكان. إزاحة دلالية من الخصوص (آثار الديار) إلى العموم
        (أي دليل مادي على وجود سابق).
    - lemma: "أَثَارَة"
      generation_method: ishtiqaq
      justification: >
        من جذر أ-ث-ر على وزن فَعَالَة (الصرفة الدالة على البقية والامتداد)، وردت في القرآن الكريم
        (أو أثارةٍ من علم — الأحقاف/٤) بمعنى ما بقي من أثر دالّ، وعرّفها المعجم الوسيط
        بـ«العلامة وبقية الشيء» — وهذا يطابق مفهوم المجموعة.
    - lemma: "رَسْم"
      generation_method: majaz
      justification: >
        الرسم في أصله اللغوي «أثر الشيء» و«ما لا شخص له من الآثار» (القاموس المحيط)، وبالتحديد
        الأثر الباقي من الدار لاصقاً بالأرض — يمثّل ذلك الوجه المادي الضعيف المنسي من الأثر
        الذي يدلّ على حضور سابق.
    - lemma: "وَسْم"
      generation_method: ishtiqaq
      justification: >
        من جذر و-س-م على وزن فَعْل، وأصله «أثر ومَعلَم» (ابن فارس). الوسم علامة يؤثّرها الكيّ
        في الشيء فتبقى دالة عليه — يمكن مجازاً تعميمه على أي أثر دال، بيد أن الاستعمال
        المألوف قيّده بالعلامة المحسوسة المقصودة.


