stage3_analysis:

  per_lemma:

    - lemma: "أثر"
      decision: confirmed
      decision_reason: >
        اللمّة أثر هي المصطلح الأمثل لهذه المجموعة بلا منازع. عرَّفها الراغب الأصفهاني بصيغة تطابق تعريف المجموعة تماماً:
        «حصول ما يدلّ على وجوده»، وهو تعريف سيميائي دقيق. المعاجم الكلاسيكية والحديثة والمصطلحية تُثبّت هذا المعنى
        بكثافة شاهدية استثنائية. كما أن مقاييس اللغة ترسّخ الأثر في محور «رسم الشيء الباقي» مما يُبيّن جمعه
        بين الدلالة المادية والإيحاء السيميائي. تشكيله الكامل (أَثَر) غائب في السجل الحالي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أثر يُعبّر عن الوجه السيميائي للعلامة الدالّة: إنه ليس مجرد شيء موجود بل هو حصول ما يدلّ على
        وجود شيء آخر كان حاضراً. يختلف عن الهايبرنيم «دلالة/علامة» بأنه يستلزم حضوراً سابقاً
        وأثراً متبقياً — لا مجرد إيحاء مجرد. هو الوحدة الدلالية الوحيدة في هذه المجموعة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَثَر"

    - lemma: "بقية"
      decision: removed
      decision_reason: >
        بقية تحمل المعنى الأنطولوجي لـ«ما تبقى من الشيء» لا الوظيفة السيميائية لـ«ما يدلّ على أن شيئاً كان موجوداً».
        الفارق جوهري: يمكن أن تكون بقية الطعام في الطبق «بقية» دون أن تكون «دلالة على أن شيئاً ما كان موجوداً».
        ARABTERM تُقابلها بـ residue لا بـ trace/vestige. مصطلح بقية يُناسب مجموعة ترادفية «الجزء المتبقي»
        لا مجموعة «العلامة الدالة على الوجود السابق». القرار: إزالة الربط بهذه المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "طَلَل"
      source: stage1
      decision: removed
      decision_reason: >
        الطلل محدود بالدلالة على آثار الديار والمواضع المسكونة تحديداً — وهو تضييق لا يسمح باستخدامه
        للمفهوم العام «أي دليل على وجود سابق». أدلة ARABTERM تستعمله في السياق المعماري والجغرافي فقط.
        اجتياز اختبار الاستبدال: لا يُقال «على سجادته طَلَل من غباره» كما يُقال «عليها أَثَر» — مما يُثبت
        قصوره عن هذا المعنى العام.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "أَثَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        أثارة اشتقاق من جذر أثر وتشاركه دلالة العلامة والبقية (مؤكَّد من المعاجم)، غير أنها تُزاحم
        اللمّة الأساسية (أثر) دون إضافة تمييز دلالي واضح. استعمالها في الكلام المُحكَم محصور
        في سياق «أثارة من علم» القرآني — أي البقية الضئيلة من المعرفة. درجة الشيوع والاستعمال
        أدنى بكثير من أثر. القرار: استبعاد تجنباً للترادف النسخي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "رَسْم"
      source: stage1
      decision: removed
      decision_reason: >
        رسم بمعنى «أثر الشيء» موثَّق معجمياً من القاموس المحيط ومقاييس اللغة وكتاب العين، لكنه
        في الاستعمال الحديث اكتسب دلالات كثيرة مزاحِمة (رسم بياني، رسوم مالية، رسم تشكيلي)
        تجعله عرضة للاشتراك اللفظي الفادح. فضلاً عن ذلك تخصّصه في آثار الديار والدور يقيّده
        في مقابل المصطلح الأعم أثر. القرار: استبعاد لتفادي الاشتراك اللفظي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "وَسْم"
      source: stage1
      decision: removed
      decision_reason: >
        وسم مقيّد بمعنى «أثر الكيّ» أو «العلامة المقصودة بالإيداع» (branding)، وهو أخص بكثير
        من دلالة «الإشارة إلى الوجود السابق». اختبار الاستبدال يُثبت القصور: لا يُقال
        «وجدنا وَسْماً من النشاط البشري في هذا الموقع» — بخلاف أثر. القرار: استبعاد لضيق الدلالة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


