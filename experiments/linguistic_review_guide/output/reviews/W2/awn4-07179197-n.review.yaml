      nuance_differentiation: "يركّز على الجانب المالي التنافسي، أي تقديم الأسعار في المناقصات والمزايدات، بينما عَرْض أعمّ ويشمل أي شيء يُقدَّم"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَطَاء"

    - lemma: "إِيجَاب"
      source: stage1
      decision: removed
      decision_reason: "الإيجاب مصطلح فقهي وقانوني مقيّد بأول كلام يصدر من أحد العاقدين في صيغة العقد، ويقابله القبول في ثنائية محدّدة. لا يصلح مرادفاً عامّاً لـ offer بمعنى الاقتراح أو المناقصة."

    - lemma: "تَقْدِمَة"
      source: stage1
