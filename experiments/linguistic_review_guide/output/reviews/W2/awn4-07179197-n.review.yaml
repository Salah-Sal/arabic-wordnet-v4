# مراجعة المجموعة الترادفية — awn4-07179197-n
# offer / offering — عَرْض / عَطَاء
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «عَرْض» مشترك لفظي واسع الدلالة (خلاف الطول، المتاع، العَرَض الفلسفي)، فقد يلتبس على المستخدم"
      - "لفظ «عَطَاء» دلالته الأصلية الهبة والمنحة، واستعماله بمعنى المناقصة/العرض التجاري استعمال محدث"
    observations: "المجموعة تمثّل مفهوم العرض بوصفه مضموناً تواصلياً (فرع من رسالة/محتوى)، ويشمل الاقتراح والمناقصة. اللمّتان الموجودتان تغطيان بُعدَين: عَرْض (الإظهار والتقديم) وعَطَاء (البذل المالي التنافسي). المفهوم أصيل في الثقافة العربية التجارية والفقهية."
  blind_candidates:
    - lemma: "إِيجَاب"
      generation_method: ishtiqaq
      justification: "مصدر من أوجَبَ (و-ج-ب، باب الإفعال)، مصطلح فقهي وقانوني يدلّ على أوّل كلام يصدر من أحد العاقدين لإنشاء التصرف، فهو الطرف الأول من العقد المقابل للقبول"
    - lemma: "عَطَاء"
      generation_method: ishtiqaq
      justification: "من الجذر ع-ط-و على وزن فَعَال، يدلّ على ما يُعطى ويُبذل، واستُعمل في لغة المناقصات والمشتريات بمعنى تقديم الأسعار ابتغاء الفوز بصفقة"
    - lemma: "تَقْدِمَة"
      generation_method: ishtiqaq
      justification: "من الجذر ق-د-م على وزن تَفْعِلَة، تدلّ على ما يُقدَّم من هدية أو عطيّة أو عرض استرضائي"
    - lemma: "طَرْح"
      generation_method: majaz
      justification: "من الجذر ط-ر-ح بمعنى الإلقاء والوضع أمام الآخر، قد يُستعمل مجازاً بمعنى ما يُطرح من فكرة أو اقتراح"

stage2_evidence:
  per_lemma:
    - lemma: "عَرْض"
      confirm:
        - text: "«عَرَضَ الشيءَ: أظهره وأبرزه... عَرَضْتُ عليه أمر كذا»"
          source: "المعجم الوسيط"
        - text: "«عَرْض = offer»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«عَرْض = offer»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«عطاء، عَرْض = tender»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«(9) عَرْض. طلبُ اليد للزواج. (10) الثمن المعروض [من قِبل الراغب في الشراء]»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«العرض بالفتح وسكون الراء في اللغة المتاع وهو الذي لا يدخله كيل ولا وزن ولا يكون حيواناً ولا عقاراً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة العَرْض على المتاع القابل للمبادلة تدعم البُعد التجاري"

    - lemma: "عَطَاء"
      confirm:
        - text: "«ما يُعطَى. أعطيات الملوك: هباتهم. أعطيات الجند: أرزاقهم وما يرتَّب لهم من مال»"
          source: "المعجم الوسيط"
        - text: "«العَطاء: التناول، والمعاطاة المناولة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العَطاء: تقديم للأسعار ابتغاءَ الفوز بمناقصة مطروحة»"
          source: "المورد الحديث (2008)"
        - text: "«عطاء، مناقصة = bid»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«عطاء = bid»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«العطاء ما يخرج كلّ سنة أو شهر والرزق يوماً بيوم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يوضّح الفرق بين العطاء والرزق في الاصطلاح الفقهي"

    - lemma: "إِيجَاب"
      confirm:
        - text: "«الإيجاب: أول كلام يصدر من أحد العاقدين لأجل إنشاء التصرف وبه يوجب ويثبت التصرف، والقبول: ثاني كلام يصدر من أحد العاقدين»"
          source: "التعريفات الفقهيّة للبركتي"
      contradicts:
        - text: "«الإيجاب: الإلزام وإيقاع النسبة... الكلام الذي تكلم به أولاً أحد العاقدين»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "الإيجاب مصطلح فقهي مقيّد بالتلفّظ الأول في العقد وليس عرضاً عاماً، ويقابله القبول في ثنائية محدّدة"

    - lemma: "تَقْدِمَة"
      confirm:
        - text: "«تَقْدِمة الصُّلح: كلّ ما يُقَدَّم على سبيل الاسترضاء»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(2) منحة؛ تقدمة؛ هِبة. (3) قربان؛ ذبيحة»"
          source: "المورد الحديث (2008)"
          conflict: "التقدمة تُستعمل غالباً بمعنى الهبة أو القربان الديني، لا بمعنى العرض التجاري أو الاقتراح"

    - lemma: "طَرْح"
      contradicts:
        - text: "«الطاء والراء والحاء أصل صحيح يدلّ على نبذ الشيء وإلقائه»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الدلالي هو الرمي والإبعاد، واستعمال طَرْح بمعنى العرض/الاقتراح غير مؤصَّل معجمياً"

    - lemma: "بَذْل"
      contradicts:
        - text: "«الباء والذال واللام كلمة واحدة، وهو ترك صيانة الشيء»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "البذل يدلّ على ترك الصيانة والإنفاق بسخاء، وليس على تقديم اقتراح أو مناقصة"

