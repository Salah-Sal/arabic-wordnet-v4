# ══════════════════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد (أعمى — بدون لمّات موجودة)
# ══════════════════════════════════════════════════════════════
stage1_review:

  # أ. توليد اللمّات المرشحة — استناداً إلى التعريف المُقنَّع فقط
  # (التعريف: «صفة اللغة أو الفكر المفهوم» / «the quality of comprehensible language or thought»)
  blind_candidates:
    - lemma: "مَفْهُومِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مشتق من اسم المفعول «مَفْهُوم» (من الجذر فهم) بإلحاق ياء النسبة وتاء التأنيث
        وفق القياس المنتج (مِفعولية)؛ يُعبِّر مباشرةً عن خاصية الكون «مفهومًا»، أي القابلية
        للفهم والإدراك. هذا البناء مطّرد في العربية المعاصرة لاستحداث مفاهيم مجردة.

    - lemma: "جَلاء"
      generation_method: majaz
      justification: >
        لفظٌ عربي أصيل من جذر (جلو/جلى) أصله «الإضاءة والإشراق»، ثم أُزيح دلالياً نحو
        «الوضوح والبيان في الكلام والفكر». ورد في المعاجم بمعنى «الأمر البيِّن الواضح»،
        مما يجعله مرشحًا مجازياً لصفة الفكر أو اللغة المفهومة. وهو إحياء لمفهوم كلاسيكي
        تراثي بدلاً من استحداث لفظ حديث.

    - lemma: "إِبَانَة"
      generation_method: ishtiqaq
      justification: >
        مصدر من الباب الرابع «أبانَ يُبينُ» على وزن «إفعالة» من جذر (بين/بون)، معناه
        إظهارُ الشيء وجَلاؤه. يُعبِّر عن خاصية الكلام أو الفكر في أن يكون «مُبيَّنًا»
        واضحَ المعنى. استُعمل قديماً في علوم البلاغة والأصول بمعنى إيصال المعنى وإيضاحه.

    - lemma: "سُهُولَةُ الْفَهْمِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي (idafi) يضمّ «سُهُولة» (خلوّ اللفظ من التعقيد) و«الفَهْم» (استيعاب
        المعنى)؛ يُعبّر عن المفهوم بصورة وصفية مجمِلة. اختُبر لأن التعبير المركّب قد
        يُعوِّض عن غياب كلمة أحادية مسكوكة.

  # ب. التقييم الأولي — بعد الاطلاع على اللمّات الموجودة
  assessment:
    concerns:
      - "لمّة «قَابِلِيَّة الفَهْم» تحمل تشكيلاً جزئياً (الفَهْم بدون ضبط كامل) → تحتاج تصحيحاً."
      - "«قَابِلِيَّة الفَهْم» مركّب حديث ليس مُعجَّمًا في المعاجم الكلاسيكية؛ ويُفيد بالأصالة\
         «القابلية لأن يُفهَم» لا «جودة الوضوح في ذاته»، مما يُحدث تحولاً دلالياً طفيفاً."
      - "«وُضُوح» لمّة مفردة تحمل دلالة أوسع من مجرد وضوح اللغة والفكر (تشمل وضوح\
         الصوت، الصورة، إلخ)؛ غير أنها الأقوى معجمياً لهذه المجموعة."
      - "غياب مرشح أحادي كلاسيكي مثل «بَيَان» أو «جَلاء» يُشير إلى احتمال ثراء المجموعة."
      - "التعريف الحالي «صفة اللغة أو الفكر المفهوم» موجز، لكنه يفتقر إلى الجنس القريب\
         والفصل النوعي المطلوبَين في تعريف المعجم الوسيط."
    observations: >
      المجموعة الترادفية تُعبِّر عن مفهوم «comprehensibility / understandability» وهو مفهوم
      بلاغي ولساني أصيل في التراث العربي. العربية تُعبِّر عنه بوسائل متعددة: مفردات كـ«وضوح»
      و«جلاء» و«بيان»، ومركّبات كـ«قابلية الفهم» و«يسر الإدراك». أبرز ما يلفت الانتباه أن
      «وضوح» هو اللفظ الأكثر تداولاً وأقربها إلى المفهوم، في حين أن «قابلية الفهم» مصطلح
      لساني حديث يُفيد الجانب التقني (قابلية النصوص للمعالجة والفهم). ويُلاحَظ غياب مصطلح
      أحادي كلاسيكي مُختصّ بهذه الصفة المجردة تحديداً.


# ══════════════════════════════════════════════════════════════
# المرحلة ٢: جمع الأدلة
# ══════════════════════════════════════════════════════════════
# استعلامات مُنجزة:
#  Q1 — مطابقة دفعية: وضوح/قابلية/سهولة/جلاء/ابانة/مفهومية (+ صيغ ال-)
#  Q2 — جسر إنجليزي: comprehensibility/understandability/intelligibility/clarity/lucidity
#  Q3 — OCR/hawramani: وضوح/فهم/مفهوم/وضح/مفهومية
#  Q4 — مقاييس اللغة: جذور وضح/قبل/فهم (dictionary_id=151)
#  Q5 — FTS كلمات مفتاحية: وضوح/مفهوم/فهم/جلاء/إدراك
stage2_evidence:
  per_lemma:

    - lemma: "وُضُوح"
      confirm:
        - text: "«حالة الجمل المسموعة جيدا والمفهومة بسهولة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ALECSO [translation_en: Intelligibility]"
        - text: "«حالة الجمل المسموعة جيدا والمفهومة بسهولة.»"
          source: "مسرد الإعلام والتواصل — ALECSO [translation_en: intelligibility]"
        - text: "«دقة في التعبير وتجنب الغموض.»"
          source: "مسرد الإعلام والتواصل — ALECSO [translation_en: clarity]"
        - text: "(1) وضوح؛ جلاء\n(2) شيء واضح."
          source: "المورد الحديث (2008) [translation_en: intelligibility]"
        - text: "(1) صفاء\n(2) وضوح."
          source: "المورد الحديث (2008) [translation_en: clarity]"
      expands:
        - text: "«وَضَحَ الشَّيْءُ: أَبَانَ. [و] الْوَاوُ وَالضَّادُ وَالْحَاءُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ظُهُورِ\
                 الشَّيْءِ وَبُرُوزِهِ.»"
          source: "مقاييس اللغة لابن فارس (جذر: وضح)"
          addition: >
            يُثبت الجذر اللغوي لـ«وضوح» ومعناه الأصيل (الظهور والبروز)، مما يُعزز
            إمكانية امتداده الدلالي نحو وضوح الكلام والفكر.
        - text: "«وضوح التفاصيل الدقيقة في الصور الموجبة والسالبة.»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000) [translation_en: definition]"
          addition: "يُثبت أن «وضوح» يُستخدم في مجالات تقنية متعددة، مما يدل على اتساع المجال الدلالي."

    - lemma: "قَابِلِيَّة الفَهْم"
      confirm:
        - text: "«الاستعداد للقبول [مصدر صناعي].»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR) [مفرد: القابلية]"
        - text: "(الْقَابِلِيَّة) الاستعداد للقبول (مصدر صناعي)."
          source: "المعجم الوسيط (hawramani) [مفرد: القابلية]"
        - text: "«امكانية فهم, <لإشارة>» [translation_en: comprehensibility, <of a sign>]"
          source: "موسوعة الكهرباء IEC 60050 (ARABTERM)"
          addition: >
            يُثبت أن التعبير بـ«إمكانية/قابلية فهم» لنقل comprehensibility مُستخدَم في
            المعاجم التقنية المتخصصة، مما يدعم المركّب الإضافي.
      contradicts:
        - text: "«استعداد فطري لاكتساب معرفة معينة أو مهارات عامة أو خاصة.» [translation_en: aptitude]"
          source: "مسرد الإعلام والتواصل — ALECSO [مفرد: قابلية]"
          conflict: >
            تُوجَّه «قابلية» هنا نحو القدرة الفطرية الشخصية (aptitude/capacity)، لا نحو
            صفة النص أو اللغة في ذاتها؛ مما يُشير إلى تعدد دلالة المركّب.
      expands:
        - text: "«(قَبَلَ) الْقَافُ وَالْبَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ تَدُلُّ كَلِمُهُ كُلُّهَا عَلَى مُوَاجَهَةِ\
                 الشَّيْءِ لِلشَّيْءِ.»"
          source: "مقاييس اللغة لابن فارس (جذر: قبل)"
          addition: "يكشف الأصل الجذري لـ«قَابِليَّة» (المواجهة والاستقبال)، المؤسِّس لمعنى القبول والاستعداد."

    - lemma: "مَفْهُومِيَّة"
      evidence_status: "no_material_found"

    - lemma: "جَلاء"
      confirm:
        - text: "(1) وضوح؛ جلاء\n(2) شيء واضح."
          source: "المورد الحديث (2008) [translation_en: intelligibility]"
        - text: "«الأمر البيِّن الواضح، الشهود والبيِّنة في المحاكمة، الكحل.»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
      contradicts:
        - text: "«خُرُوجُ القَوْمِ من أرضٍ إلى أرضٍ. وغَلَبَ في أدبيّات السياسة في العصر الحديث\
                 على خروج المستعمرين من البلاد التي احتلُّوها.»"
          source: "المعجم الكبير — مجمع اللغة العربية (OCR)"
          conflict: >
            الدلالة السائدة لـ«جلاء» في الاستعمال المعاصر هي «الانتقال والرحيل» (جلاء العدو)،
            لا «وضوح الفكر»، مما يُفضي إلى التباس دلالي حاد إذا استُخدم في هذا السياق.
        - text: "«الكحل. وقيل: هو كُحْلٌ خاصٌّ يَجلو البصر.»"
          source: "المعجم الكبير — مجمع اللغة العربية (OCR)"
          conflict: "دلالة أخرى راسخة (الكحل) تُشوِّش على الاستخدام الدلالي المنشود."

    - lemma: "إِبَانَة"
      expands:
        - text: "«الإبانة: إظهار المعنى للنفس بما لا يمكن إدراكه، وأصله القطع؛ فالإبانة قطعُ المعنى\
                 من غيره ليظهر من نفسه.»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani، ت 1622م)"
          addition: >
            يُوضح أن «الإبانة» في عرف أهل البلاغة تعني الفعلَ ذاته (إظهار المعنى وإيضاحه)
            لا الصفة المجردة (كَوْن الشيء مُبيَّنًا)؛ وهو فارق دلالي جوهري إزاء مفهوم المجموعة.
      contradicts:
        - text: "«الأصحاب، يقال: جاء فلان في إبانته.»"
          source: "المعجم الكبير — مجمع اللغة العربية (OCR)"
          conflict: >
            المعجم الكبير يُثبت «إِبَانَة» بمعنى «الأصحاب/العصبة» من جذر (أبن) المختلف
            عن (بين)، مما يُنشئ اشتراكاً لفظياً مُربكاً.
        - text: "«إبانة — decantation.» [domain: Water Engineering]"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM"
          conflict: "تُوجِّه «إبانة» في المعجم الاصطلاحي الحديث نحو «الترشيح/الفصل» في الهندسة المائية."

    - lemma: "سُهُولَةُ الْفَهْمِ"
      expands:
        - text: "«السُّهُولة في الكلام: خلوُّ اللفظ من التكلف والتعقيد والتعسُّف في السَّبك.»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
          addition: >
            يُثبت أن «سهولة» في سياق الكلام تُشير إلى غياب التعقيد في الأسلوب، وهو مفهوم
            مجاور لـ«قابلية الفهم» لكن يُركّز على صفة الصياغة لا على صفة الإدراك.
        - text: "السّهولة في البديع: خلوّ اللفظ من التكليف والتعقيد والتعسّف في السبك."
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani، ت 1777م)"
          addition: "يُؤكد الاستعمال البلاغي التراثي لـ«السهولة» في وصف يُسر الأسلوب وانسيابيته."


# ══════════════════════════════════════════════════════════════
# المرحلة ٣: التحليل اللغوي للّمات
# ══════════════════════════════════════════════════════════════
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "وُضُوح"
      decision: confirmed
      decision_reason: >
        أقوى لمّة في المجموعة وأكثرها تداولاً. أثبتتها معاجم اللسانيات والإعلام ترجمةً
        لـ«intelligibility» (حالة الجمل المسموعة المفهومة بسهولة)، وترجمةً لـ«clarity»
        (دقة في التعبير وتجنب الغموض). الجذر وضح في مقاييس ابن فارس يُثبت الأصل
        الدلالي (الظهور والبروز). اجتاز اختبار الاشتقاقية والملاءمة والتداول الفصيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «وُضُوح» يُركّز على الصفة المطلقة للبيان والانكشاف، وهو مصدر طبيعي يُوظَّف في
        الكتابة الأدبية والعلمية والإعلامية على حدٍّ سواء؛ أعمّ دلالةً من «قابلية الفهم»
        إذ يشمل وضوح الصوت والصورة والعبارة، وهو الأوفر حضوراً في الاستعمال اليومي
        والبلاغي.
      # وُضُوح يحمل تشكيلاً كاملاً — لا تحديث لازم

    # ── اللمّة الموجودة ٢ ──
    - lemma: "قَابِلِيَّة الفَهْم"
      decision: confirmed
      decision_reason: >
        مركّب إضافي حديث يُعبِّر عن الجانب التقني اللساني لـ«comprehensibility»: إمكانية
        اللغة أو الفكر في أن يكون مُتاحَ الفهم للمتلقي. يوجد في موسوعة الكهرباء IEC
        الصادرة بالعربية ما يُؤكد استخدام هذا الأسلوب التركيبي (إمكانية فهم لإشارة =
        comprehensibility of a sign)، مما يعكس توجهاً اصطلاحياً ثابتاً. غير أن التشكيل
        في الملف الحالي ناقص (الفَهْم بدون ضبط كامل) → تصحيح إلزامي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        «قَابِلِيَّةُ الْفَهْمِ» يُبرز بُعد «القابلية» أي كَوْن الكلام أو الفكر مُهيَّئًا
        ليُفهَم ومُعَدًّا للاستيعاب؛ وهو أقرب إلى المصطلح التقني في اللسانيات وعلم
        النص وتصميم الخطاب (text design) مقارنةً بـ«وضوح» الأعمّ والأشيع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ الْفَهْمِ"

    # ── مرشح المرحلة ١ — مَفْهُومِيَّة ──
    - lemma: "مَفْهُومِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا اللفظ في قاعدة البيانات المعجمية الشاملة (760,660 مدخلاً). علاوةً
        على ذلك يُشكِّل الاشتقاق من «مفهوم» (الظاهر في التعريف ذاته) خطرَ الدوران
        المعجمي. لا يُعدّ هذا الشكل مسكوكاً أو متداولاً في أي مصدر معجمي معتمَد.

    # ── مرشح المرحلة ١ — جَلاء ──
    - lemma: "جَلاء"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود «وضوح؛ جلاء» ترجمةً لـ«intelligibility» في المورد الحديث، إلا أن
        «جلاء» في الاستعمال المعاصر السائد يرتبط بـ«جلاء العدو» (expulsion/evacuation)
        ويُشكِّل التباساً دلالياً شديداً. بوابة الجودة: يفشل في معيار يُسر التداول وتجنّب
        الاشتراك اللفظي. كما أن «وُضُوح» يُغطي هذه الدلالة بشكل أكثر وضوحاً وتخصصاً.

    # ── مرشح المرحلة ١ — إِبَانَة ──
    - lemma: "إِبَانَة"
      source: stage1
      decision: removed
      decision_reason: >
        «الإبانة» في التراث البلاغي تدل على فعلِ الإيضاح (act of making clear) لا على
        صفة الكون مفهومًا (quality of being comprehensible)؛ وهو فارق دلالي جوهري.
        يُضاف إلى ذلك الاشتراك اللفظي مع «إبانة» من جذر (أبن) بمعنى الأصحاب (المعجم
        الكبير)، ومع «decantation» في معاجم الهندسة المائية. هذا التشعّب يُبطل الترشيح.

    # ── مرشح المرحلة ١ — سُهُولَةُ الْفَهْمِ ──
    - lemma: "سُهُولَةُ الْفَهْمِ"
      source: stage1
      decision: removed
      decision_reason: >
        «سُهُولَةُ الْفَهْمِ» تعبير وصفي حرّ غير مُثبَّت معجمياً كوحدة اصطلاحية مستقلة.
        يفشل في اختبار التثبيت المعجمي: يمكن إبدال «الفهم» بـ«الإدراك» أو «الاستيعاب»
        ولا يتغير المعنى، وهو دليل على عدم السكّ. فضلاً عن ذلك، «سهولة» في التراث
        البلاغي تُركّز على يُسر الأسلوب لا على قابلية المتلقي للفهم.


