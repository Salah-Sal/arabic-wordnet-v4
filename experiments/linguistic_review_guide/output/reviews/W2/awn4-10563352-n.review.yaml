# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مكرّر في شقيه: 'شخص يستعجل' و'شخص في عجلة من أمره' يؤديان المعنى ذاته دون فصل نوعي"
      - "اللمّة مُنْدَفِع أعمّ دلالةً من الاستعجال وحده؛ تتضمن معنى الاندفاع بقوة وعنف وهو ما تكشفه ترجمات impetuous وprecipitous في المورد الحديث"
      - "اللمّتان لا وجود مستقل لهما في المعاجم الكلاسيكية بصيغتهما، مما يجعل الأدلة معتمدةً على المصادر الحديثة والترجمية"
    observations: "المجموعة تصف نمطاً سلوكياً إنسانياً (الاستعجال والتسرع) تملك العربية كنزاً وافراً للتعبير عنه من جذر ع-ج-ل. اللمّة مُتَعَجِّل أدقّ في حمل المعنى الجوهري؛ فصيغة التفعّل تدل على المزاولة والملازمة. أما مُنْدَفِع فيُوسّع الحقل الدلالي نحو القوة والاندفاع ويصلح لبُعد 'acts precipitously' أكثر من مجرد 'in a hurry'. المجموعة تحتاج إلى تعريف أكثر التزاماً بأسلوب المعجم الوسيط."
  blind_candidates:
    - lemma: "عَجُول"
      generation_method: ishtiqaq
      justification: "وزن فَعُول على جذر ع-ج-ل يدلّ على المبالغة في الصفة اللازمة، قياساً على صَبُور وشَكُور وغَيُور؛ بمعنى كثير العجلة والإسراع"
    - lemma: "مِعْجَال"
      generation_method: ishtiqaq
      justification: "وزن مِفْعَال على جذر ع-ج-ل يدلّ على كثرة الفعل أو من يتصف به تصفاً ثابتاً، قياساً على مِهْذَار ومِقْوَال ومِطْعَان"
    - lemma: "مُسْتَعْجِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استعجلَ (باب الاستفعال)، يدلّ على من يطلب العجلة ويتوخاها في تصرفاته؛ شائع في الاستعمال العربي الحديث"
    - lemma: "مُتَهَوِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تهوَّر على وزن مُتَفَعِّل من جذر هور، يدلّ على من يندفع في الأمور بلا تبصر أو مبالاة؛ يناسب بُعد 'acts precipitously'"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفّذت: ٦ استعلامات
# ١. مطابقة دفعية: متعجل، مندفع (خالية — لا مداخل مستقلة في المعاجم الكلاسيكية)
# ٢. جسر إنجليزي: rusher, hurry, precipitous, impetuous, hasty, rash
# ٣. FTS كلمات مفتاحية: عجلة, يستعجل, مستعجل, متعجل, عجول, مندفع
# ٤. مطابقة دفعية للمرشحات: عجول, معجال, مستعجل, متهور
# ٥. مقاييس اللغة (dictionary_id=151): جذور عجل، دفع، هور
stage2_evidence:
  per_lemma:
    - lemma: "مُتَعَجِّل"
      confirm:
        - text: "«(1) «أ» سريع. «ب» مُنْجَزٌ بعجلة. «ج» مستعجل؛ متعجِّل (2) متلهِّف (3) متهوِّر؛ طائش (4) سريع الغضب»"
          source: "المورد الحديث (2008) — ترجمة hasty"
        - text: "«نُمُوٌّ مُتَعَجِّل» [مقابل tachyauxesis]"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الْعَيْنُ وَالْجِيمُ وَاللَّامُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى الْإِسْرَاعِ، وَالْآخَرُ عَلَى بَعْضِ الْحَيَوَانِ. فَالْأَوَّلُ: الْعَجَلَةُ فِي الْأَمْرِ، يُقَالُ: هُوَ عَجِلٌ وَعَجُلٌ. وَاسْتَعْجَلْتُ فُلَانًا: حَثَثْتُهُ. وَعَجِلْتُهُ: سَبَقْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر عجل أصيل في الدلالة على الإسراع، وصيغة التفعّل (تعجَّل) تفيد ملازمة الفعل وتكرار مزاولته"

    - lemma: "مُنْدَفِع"
      confirm:
        - text: "«(1) مندفع؛ متهوِّر؛ طائِش (2) شديد التحدُّر»"
          source: "المورد الحديث (2008) — ترجمة precipitous"
        - text: "«(1) دَفْعيّ؛ دافع an impulsive force (2) مندفع؛ متهوِّر (3) نابض»"
          source: "المورد الحديث (2008) — ترجمة impulsive"
        - text: "«(4) مندفع؛ مستعجل [باختلاط واضطراب]»"
          source: "المورد الحديث (2008) — ترجمة helter-skelter"
      expands:
        - text: "«(1) متهوِّر؛ طائش an impetuous boy (2) عنيف؛ مندفع بعنف impetuous winds»"
          source: "المورد الحديث (2008) — ترجمة impetuous"
          addition: "يكشف أن مُنْدَفِع يرتبط بمعنى العنف والقوة الفيزيائية فضلاً عن وصف الشخص المتسرع"
        - text: "«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ. يُقَالُ دَفَعْتُ الشَّيْءَ أَدْفَعُهُ دَفْعًا. وَأَمَّا الدُّفَّاعُ فَالسَّيْلُ الْعَظِيمُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل في الدفع هو التنحية والإزاحة، وصيغة الانفعال (اندفع) تدل على الاستجابة لقوة خارجية؛ فالمُنْدَفِع كأن دافعاً يدفعه"
        - text: "«تدفق مندفع» [مقابل supercritical flow]، «مندفع نحو المركز» [مقابل centripetal]"
          source: "ARABTERM — معاجم علمية متعددة"
          addition: "يُستعمل تقنياً للدلالة على الاندفاع المادي للسوائل والأجسام، مما يؤكد المدلول الفيزيائي الأصيل للكلمة"

    - lemma: "عَجُول"
      contradicts:
        - text: "«الْعَجُولُ مِنَ الْإِبِلِ، الْوَالِهُ الَّتِي فَقَدَتْ وَلَدَهَا، وَالْجَمْعُ عُجُلٌ. وَرُبَّمَا قِيلَ لِلْمَرْأَةِ الثَّكْلَى عَجُولٌ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المعنى المعجمي الراسخ هو الناقة الثاكلة أو المرأة التي فقدت ولدها؛ لا صلة له بالاستعجال السلوكي. وابن فارس يصرّح بأنه 'لم يُبنَ منه فعل' بمعنى الإسراع"
        - text: "«العجول: الثكلى (ج) عجل وعجائل»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يُثبّت المعنى ذاته: الثاكلة، دون أي إشارة إلى دلالة الإسراع السلوكي"

    - lemma: "مِعْجَال"
      confirm:
        - text: "«مِعْجَال: المتسرع، والتي تضع ولدها قبل أوانه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«المِعْجَال: من الحوامل: التى تضع ولدها قبل أوانه؛ مختصر الطريق»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المعنى السائد في المعجم الوسيط هو الحامل المبكرة لا الشخص المستعجل"
        - text: "«مِعْجَال» [مقابل shortcut]"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "في الاستعمال الطبي الحديث أُعيد توظيفه بمعنى 'الاختصار'، مما يُشيع الالتباس"

    - lemma: "مُسْتَعْجِل"
      confirm:
        - text: "«مستعجل She was pressed for time»"
          source: "المورد الحديث (2008) — ترجمة pressed"
        - text: "«مُسَرَّع؛ مُعَجَّل a hurry-up dinner»"
          source: "المورد الحديث (2008) — ترجمة hurry-up"
        - text: "«(4) مندفع؛ مستعجل [باختلاط واضطراب]»"
          source: "المورد الحديث (2008) — ترجمة helter-skelter"
        - text: "«مُسْتَعْجَل، طَارِئٌ» [مقابل emergency]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"

    - lemma: "مُتَهَوِّر"
      confirm:
        - text: "«(1) متهوِّر؛ طائش an impetuous boy (2) عنيف؛ مندفع بعنف»"
          source: "المورد الحديث (2008) — ترجمة impetuous"
        - text: "«(1) متهوِّر؛ طائش؛ أهْوَج (2) طَفْح جلديّ»"
          source: "المورد الحديث (2008) — ترجمة rash"
      expands:
        - text: "«مُتَهَوِّر: الواقع في الأمر بقلة مبالاة، والمعتدي في طيش ونزق، والشتاء ذهب أكثره وانكسر برده»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يحمل دلالة الطيش والنزق والوقوع في الأمر بلا مبالاة، وهي أثقل وأشد من مجرد الاستعجال"
        - text: "«الْهَاءُ وَالْوَاوُ وَالرَّاءُ: أَصْلٌ يَدُلُّ عَلَى تَسَاقُطِ شَيْءٍ. مِنْهُ تَهَوَّرَ الْبِنَاءُ: انْهَدَمَ. وَتَهَوَّرَ اللَّيْلُ: انْكَسَرَ ظَلَامُهُ، كَأَنَّهُ تَهَدَّمَ وَمَرَّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر الأصيل يدل على التساقط والانهدام؛ التهور هو الانهيار والوقوع في الأمور لا الإسراع الخالص"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُتَعَجِّل"
      decision: confirmed
      decision_reason: "اسم فاعل من تعجَّل على وزن مُتَفَعِّل، مشهور في الاستعمال العربي الحديث، يوثّقه المورد الحديث ترجمةً لـ hasty. صيغة التفعّل تفيد الملازمة والمزاولة؛ هو يختار الإسراع ويتبناه. التشكيل صحيح وكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على سلوك الإسراع الاختياري المتكرر؛ صيغة التفعّل تدل على التكلف والملازمة، فهو يُقبل على العجلة ويتبناها نهجاً في التعامل مع الأمور"

    - lemma: "مُنْدَفِع"
      decision: confirmed
      decision_reason: "اسم فاعل من اندفع على وزن مُنْفَعِل، يوثّقه المورد الحديث ترجمةً لـ precipitous وimpetuous وimpulsive، ويُغطي بُعد 'acts precipitously' في التعريف الإنجليزي. رغم أنه يحمل دلالة إضافية للاندفاع بقوة، فإنه يبقى ضمن نطاق المجموعة ويُغطي فارقاً دلالياً واضحاً. التشكيل صحيح وكامل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الاندفاع الكلي بلا تمهيد أو سيطرة، مع إيحاء بالقوة والعنف في الحركة (كأن دافعاً يدفعه)؛ أشمل وأعمق من مُتَعَجِّل الذي يصف العجلة الخالصة"

    - lemma: "عَجُول"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعجمي الثابت عند ابن فارس والمعجم الوسيط هو الناقة الثاكلة أو المرأة التي فقدت ولدها، دون أي صلة بالاستعجال السلوكي. ابن فارس يصرّح بأنه 'لم يُبنَ منه فعل' بمعنى الإسراع. استعمالها للدلالة على الشخص المستعجل يقع في باب الاشتراك اللفظي المُضلِّل."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مِعْجَال"
      source: stage1
      decision: removed
      decision_reason: "رغم إشارة موسوعة السلطان قابوس إلى معنى 'المتسرع'، فإن المعجم الوسيط يُرسّخ المعنى الأول في الحامل المبكرة وقد تكرّس في الاستعمال الحديث بمعنى 'الاختصار'. المعنى الدلالي متشعب والاستعمال ملتبس؛ لا تجتاز اختبار السكّ المصطلحي الموحّد للدلالة الإنسانية السلوكية."
      evidence_assessment:
        case: mixed

    - lemma: "مُسْتَعْجِل"
      source: stage1
      decision: removed
      decision_reason: "صحيح معجمياً ولغوياً وموثَّق في المورد، لكنه يتداخل مع مُتَعَجِّل تداخلاً واسعاً لا يبرر انفرادَه بمدخل مستقل ضمن هذه المجموعة. الفارق الصرفي (استفعال ≈ تفعّل في هذا السياق) غير كافٍ لإضافة مدخل قد يُفرز ترادفاً شبه تام يضعف جودة الشبكة. كما أن شيوع استعماله بمعنى 'طارئ/عاجل' (emergency) يُنافس الدلالة الشخصية."
      evidence_assessment:
        case: confirm_only

    - lemma: "مُتَهَوِّر"
      source: stage1
      decision: removed
      decision_reason: "يحمل دلالة الطيش والنزق والوقوع في الأمور بلا مبالاة، وهي أثقل وأشد مما تصفه المجموعة. الجذر (هور = تساقط وانهدام) يكشف عن مدلول يتجاوز الاستعجال إلى الرعونة الأخلاقية. إضافته ستُوسّع المجموعة نحو معنى الطيش والتهور لا مجرد العجلة."
      evidence_assessment:
        case: mixed


