# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13781913-n
# reserve (medicine) — الاحتياطي الطبي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «احتياطي» بدون تشكيل — تحتاج ضبطاً كاملاً"
      - "«احتياطي» صفة نِسبة (احتياط + يّ)، واستخدامها اسماً مفرداً بمعنى reserve الطبي غير مألوف — الأشيع استخدامها صفةً: الحجم الاحتياطي، القوة الاحتياطية"
      - "المعجم الطبي الموحد يستعمل «المُدَّخَر» اسماً للمفهوم الطبي (المدخر القلبي، المدخر التنفسي) بينما يستعمل «احتياطي» صفةً"
      - "المجموعة تحوي لمّة واحدة فقط — فقر مُعجمي يستدعي إثراءً"
    observations: >
      المفهوم يُعبَّر عنه في الطب العربي بلفظين: «المُدَّخَر» اسماً (المدخر القلبي = cardiac reserve)
      و«الاحتياطيّ» صفةً (الحجم الاحتياطي = reserve volume). الجذر ذخر أنسب دلالياً لأن
      مقاييس اللغة تذكر أن «المذاخر» هي جوف الإنسان وعروقه، وهذا قريب من المفهوم الطبي
      للقدرة الكامنة في أعضاء الجسم. كما أن «احتياطي» بوصفه نِسبة يؤدي وظيفة الوصف أكثر
      من وظيفة الاسم المستقل.
  blind_candidates:
    - lemma: "مُدَّخَر"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من ادَّخَرَ (افتعل من ذخر) على وزن مُفْتَعَل. الجذر ذخر يدلّ على
        «إحراز شيء يحفظه» (مقاييس اللغة)، و«المذاخر» في العربية تعني جوف الإنسان وعروقه —
        وهو قريب من المفهوم الطبي. المعجم الطبي الموحد يستعمله اسماً: المدخر القلبي، المدخر التنفسي.
    - lemma: "مَخْزُون"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من خَزَنَ على وزن مَفْعُول. الجذر خزن يدلّ على «صيانة الشيء» (مقاييس اللغة).
        يُستعمل بمعنى stock/stored quantity في مجالات عدة. لكنه يُشير أكثر إلى الكمية المادية المخزّنة
        لا إلى القدرة الكامنة، فقد لا يناسب الدلالة الطبية تماماً.
    - lemma: "ذَخِيرَة"
      generation_method: majaz
      justification: >
        أصل الذخيرة ما يُدَّخر للحاجة والطوارئ، فيُنقل مجازاً إلى القدرة التي يدّخرها
        الجسم للاستجابة عند الحاجة. لكنها اكتسبت دلالة غالبة في العسكرية (الذخيرة الحربية)
        فقد يُلبس استعمالها في الطب.
    - lemma: "اِحْتِيَاط"
      generation_method: ishtiqaq
      justification: >
        مصدر احتاطَ (افتعل من حوط) على وزن افتعال. يدلّ على الاحتراز والحفظ.
        أقرب إلى معنى precaution/provision منه إلى reserve بالمعنى الطبي.
        مستعمل في معاجم المصطلحات بمعنى reserve في سياقات غير طبية.

stage2_evidence:
  per_lemma:
    - lemma: "اِحْتِيَاطِيّ"
      confirm:
        - text: "«احتياطي — reserve — réserve»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«احتياطي — reserve — réserve»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«احتياطي — reserve — réserve»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«احتياطيّ — صفة لمصدر يمكن استخدامه بديلا للمصدر الأصلي عند توقفه عن العمل»"
          source: "مسرد التربية، المنظمة العربية"
        - text: "«خلايا احتياطية — reserve cells»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«قوّة احتياطية — reserve force»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«الهواء الاحتياطيّ — reserve air»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«احتياطيّ العُمر — lifetime reserve»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«الاحتياط: في اللغة هو الحفظ، وفي الاصطلاح: حفظ النفس عن الوقوع في المآثم»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى الاصطلاحي الكلاسيكي يدلّ على الحذر والاحتراز لا على القدرة المخزّنة"
      expands:
        - text: "«الاحتياطي — يُقصد به كمية الوقود المتبقية في الخزان، التي يفترض أن تكفي لقطع مسافة الوصول إلى أقرب محطة تزوّد بالوقود»"
          source: "مسرد هندسة وتكنولوجيا السيارات"
          addition: "مثال تطبيقي لاستعمال احتياطي اسماً بمعنى الكمية المتبقية للطوارئ"

    - lemma: "مُدَّخَر"
      confirm:
        - text: "«المُدَّخَرُ القَلْبِيّ — cardiac reserve»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«المُدَّخَرُ التَّنَفُّسِيّ — breathing reserve / respiratory reserve»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«المُدَّخَرُ القَلَوِيّ — alkali reserve (alkaline reserve)»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«ذَخَرَ — يدلّ على إحراز شيء يحفظه. والمذاخر: اسم يجمع جوف الإنسان وعروقه»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ذخر يحمل دلالة الحفظ والتخزين، والمذاخر تدلّ على باطن الجسم وعروقه — وهو قريب من المفهوم الطبي"

    - lemma: "مَخْزُون"
      contradicts:
        - text: "«مخزون — هو المساحة المكانية اللازمة للتخزين (مستودعات) لحفظ السلع السائبة — stock»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "الدلالة المعجمية السائدة لمخزون هي الكمية المادية المخزّنة (stock)، لا القدرة الفسيولوجية الكامنة"
        - text: "«مخزون — الكمية المخزونة من الغذاء والتي تشكل احتياطياً لفترة ما — stock»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "يُترجم stock لا reserve في المصطلحات الموحدة"
      expands:
        - text: "«خَزَنَ — أصل يدلّ على صيانة الشيء. يقال خزنت الدرهم وغيره خزناً؛ وخزنت السر»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر خزن يدلّ على الصيانة والحفظ لكنه للأشياء المادية"

    - lemma: "ذَخِيرَة"
      contradicts:
