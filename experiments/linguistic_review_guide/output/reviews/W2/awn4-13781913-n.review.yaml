      expands:
        - text: "«ذَخَرَ — يدلّ على إحراز شيء يحفظه»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ملائم لكن المشتق ذخيرة تخصّص في الاستعمال العسكري"

    - lemma: "اِحْتِيَاط"
      contradicts:
        - text: "«الاحتياط: فعل ما يتمكن به من إزالة الشك واحتاط للشيء طلب الأحوط»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الأصلي هو الحذر والاحتراز، لا القدرة المخزّنة"
      expands:
        - text: "«احتياط — precaution — précaution»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "يُترجم precaution لا reserve"
        - text: "«احتياط / مصدر — كميات مؤكدة من مادة أولية قابلة للاستخراج... — reserve»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "في مجال الطاقة يُستعمل بمعنى reserve لكنه للمواد الأولية لا للقدرة الفسيولوجية"

stage3_analysis:
  per_lemma:
    - lemma: "اِحْتِيَاطِيّ"
      decision: confirmed
      decision_reason: >
        لمّة واسعة الانتشار في المعاجم المصطلحية بمعنى reserve عبر مجالات متعددة، بما فيها
        المجال الطبي (احتياطيّ العمر، القوة الاحتياطية، الهواء الاحتياطيّ). وإن كان الأصل صفةً
        نسبية، فقد شاع استعمالها اسماً بمعنى «الاحتياطيّ» في كثير من السياقات. يبقى لفظاً عاماً
        يشمل معنى reserve في مختلف المجالات.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        لفظ عام يدلّ على ما يُحتفظ به احتياطاً، يُستعمل صفةً واسماً في المجالات التقنية كافةً
        (مالية، عسكرية، هندسية، طبية). أعمّ من «مُدَّخَر» الذي تخصّص طبياً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِحْتِيَاطِيّ"

    - lemma: "مُدَّخَر"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح طبي موحد في المعجم الطبي الموحد (2009): المُدَّخَر القلبي (cardiac reserve)،
        المُدَّخَر التنفسي (respiratory reserve)، المُدَّخَر القلوي (alkali reserve). هو اسم المفعول
        من ادّخر (افتعل من ذخر)، والجذر يدلّ على «إحراز شيء يحفظه»، والمذاخر = جوف الإنسان
        وعروقه. هذا المشتق أدقّ تعبيراً عن المفهوم الطبي من «احتياطي» لأنه يحمل دلالة
        القدرة المخزّنة داخلياً لا مجرد الاحتراز.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصطلح طبي متخصص يدلّ على القدرة الفسيولوجية المخزّنة في الأعضاء (القلب، الرئة).
        أخصّ من «احتياطيّ» وأدقّ في السياق الطبي.
      actions:
        - command: create_entry
          params: {lemma: "مُدَّخَر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَخْزُون"
      source: stage1
      decision: removed
      decision_reason: >
        دلالته الغالبة في المعاجم المصطلحية هي stock (الكمية المادية المخزّنة)، لا reserve
        بمعنى القدرة الكامنة. لا يرد في المعجم الطبي الموحد بمعنى reserve الفسيولوجي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "ذَخِيرَة"
      source: stage1
      decision: removed
      decision_reason: >
        تخصّصت دلالتها المعاصرة في العتاد الحربي (ammunition) مما يُلبس في السياق الطبي.
        الجذر ملائم لكن المشتق المناسب هو «مُدَّخَر» لا «ذخيرة».
      evidence_assessment:
        case: contradicts_only

    - lemma: "اِحْتِيَاط"
      source: stage1
      decision: removed
      decision_reason: >
        معناه الأصلي الحذر والاحتراز (precaution)، وفي المصطلحات يُترجم precaution أو
        provision. وإن ورد بمعنى reserve في مجال الطاقة، فهو لكميات المواد الأولية القابلة
        للاستخراج لا للقدرة الفسيولوجية. المشتق النسبي «احتياطيّ» أشيع وأثبت في هذا المعنى.
      evidence_assessment:
        case: mixed

