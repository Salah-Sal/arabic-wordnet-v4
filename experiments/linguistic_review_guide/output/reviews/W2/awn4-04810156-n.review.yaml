# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "لمّة صِحَّة تحمل دلالات أولية على العافية الجسدية مما قد يُوقع لبساً مع المجموعات الترادفية الخاصة بالصحة"
      - "التعريف الحالي مقتضب ويفتقر إلى الجنس القريب والفصل النوعي بصورة مكتملة وفق منهج المعجم الوسيط"
      - "مصطلح ضَبْط الشائع في المعاجم التقنية للدلالة على نفس المفهوم غير مُدرَج في المجموعة"
    observations: >
      المجموعة تُعرِّف الدقة بوصفها «صفة القرب من القيمة الحقيقية»، وهو المفهوم المعروف في علم المقاييس
      والإحصاء بـ accuracy. اللمّتان الحاليتان دِقَّة وصِحَّة تُمثّلان مقاربتين مختلفتين: دِقَّة تنصبّ على
      الضبط الكمي والاقتراب من القيمة الحقيقية وهي الأكثر شيوعاً في الأدبيات العلمية العربية، أما صِحَّة
      فتشير إلى الصواب والسلامة بوجه عام مع ثقل دلالي غالب نحو العافية الجسدية.
      كشف جمع الأدلة عن مصطلح ضَبْط الذي ورد في معجم المعلوماتية بالتعريف ذاته: «الدرجة التي تقترب فيها
      نتيجة الحساب أو القياس من القيمة الحقيقية».

  blind_candidates:
    - lemma: "إِصَابَة"
      generation_method: majaz
      justification: >
        اللفظ يدل في أصله على بلوغ الهدف وإصابته، فاستُعير مجازاً للدلالة على مدى إصابة القياس للقيمة
        الحقيقية؛ إذ بين «إصابة الغرض» و«الوصول إلى القيمة الحقيقية» قرابة وظيفية واضحة.
    - lemma: "مُطَابَقَة"
      generation_method: ishtiqaq
      justification: >
        مصدر طابَقَ على وزن مُفَاعَلة من جذر طبق الدال على الانطباق والتوافق، يدل على التقارب بين القيمة
        المقيسة والقيمة الحقيقية، مما يجعله مرشحاً طبيعياً للدلالة على الدقة بمعنى القرب من الحقيقة.
    - lemma: "سَدَاد"
      generation_method: majaz
      justification: >
        السداد في الأصل الصواب والقصد والاستقامة في القول والفعل، فيُستعار للدلالة على صواب القياس
        وقُربه من الحقيقة؛ إذ في السداد معنى الإصابة المستقيمة والابتعاد عن الانحراف والخطأ.
    - lemma: "وَفَاق"
      generation_method: ishtiqaq
      justification: >
        مصدر وافَقَ على وزن فِعَال من جذر وفق، يدل على الملاءمة والانسجام بين شيئين، ويُستعار
        للدلالة على درجة توافق القيمة المقيسة مع القيمة الحقيقية المرجعية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت: ٦ استعلامات
# ١. مطابقة دفعية: دقة، صحة، إصابة، مطابقة، سداد، وفاق (مع ال- وبدونها)
# ٢. إثراء بالمعرّف: تعريفات وأمثلة للمداخل الرئيسية
# ٣. جسر إنجليزي: accuracy, trueness, exactness, closeness to true value
# ٤. فحص FTS بكلمات مفتاحية: قيمة حقيقية، قرب من القيمة، الدقة، ضبط
# ٥. مقاييس اللغة: جذرا دقق وصحح
# ٦. مقاييس اللغة: جذر ضبط
stage2_evidence:

  per_lemma:

    - lemma: "دِقَّة"
      confirm:
        - text: "«مدى تطابق أو اقتراب قياس، أو تقدير على أساس قياسات، من القيمة الحقيقية للخاصية التي هي موضوع القياس (إيزو 1988)»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ALECSO (EN: accuracy)"
        - text: "«صفة لمقدرة جهاز قياس على تعيين قيمة مُعيَّنة، تقع بالقرب من القيمة الحقيقية للكمّية المُقاسة. تكون الدقة أفضل كلّما اقترب...»"
          source: "مسرد الهندسة الكهربائية — ALECSO (EN: accuracy (measuring instrument))"
        - text: "«مقدار تقارب نتيجة القياس من القيمة الصحيحة للكمّية المُقاسة»"
          source: "مسرد الهندسة الكهربائية — ALECSO (EN: measuring accuracy)"
        - text: "«فلانٌ مشهود له بالدِّقَّة في عمله [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«دِقَّة» كمقابل عربي لـ accuracy في: المعجم الموحد للرياضيات والفلك (1990)، والمعجم الموحد للتجارة والمحاسبة (1995)، ومسرد الهندسة الكهربائية (للحرب الإلكترونية)، ومسرد الإعلام والتواصل، والمعكنز الزراعي (AGROVOC)، والمعجم الموحد للطب البيطري"
          source: "معاجم أرابترم المتعددة (ALECSO)"

    - lemma: "صِحَّة"
      confirm:
        - text: "«accuracy: (1) ضَبْط (مج)؛ صِحّة (2) دِقّة»"
          source: "المورد الحديث (2008)"
        - text: "«الصّحّة: [في الإنكليزية] Health، exactitude، Well-founded، validity»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«صحة» كمقابل لـ exactness في مسرد الفلسفة وعلم النفس — ALECSO"
          source: "مسرد الفلسفة وعلم النفس — ALECSO"
      contradicts:
        - text: "«حالةٌ طبيعية تجرى أفعالُ البدنِ مَعَها على المجرى الطبيعيّ. (في الفقه): كونُ الفعل مُسْقِطًا للقضاء في العبادات أو سببًا لتَرَتُّب ثمرته المطلوبة منه عليه شرعًا في المعاملات»"
          source: "المعجم الكبير"
          conflict: "المعنى الأولي والأغلب لصِحَّة هو العافية الجسدية والصواب الشرعي، لا القُرب الكمي من القيمة الحقيقية"
        - text: "«صِحَّة» كمقابل لـ health في: المعجم الموحد للقانون، والمعجم الطبي الموحد، ومعجم تقانات الأغذية، والمعكنز الزراعي، والمعجم الموحد للطب البيطري"
          source: "معاجم أرابترم المتعددة (ALECSO)"
          conflict: "الاستعمال التقني الغالب لصِحَّة في المعاجم العلمية هو الصحة الجسدية، ولا يوجد تعريف مقياسي صريح يجعلها مقابلاً لـ accuracy بمعنى nearness to true value"

    - lemma: "إِصَابَة"
      contradicts:
        - text: "«affection; injury»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: "إِصَابَة تدل على الجرح والأذى والمرض، لا على الدقة المقياسية"
        - text: "«infestation»"
          source: "المعكنز الزراعي متعدد اللغات"
          conflict: "إِصَابَة = إصابة بآفة، لا علاقة بمفهوم القرب من القيمة الحقيقية"

    - lemma: "مُطَابَقَة"
      expands:
        - text: "«الْمُطَابقَة: دلَالَة اللَّفْظ على تَمام مَا وضع لَهُ... من طابق النَّعْل بالنعل إِذَا تساويتا وتوافقتا فِي الْمِقْدَار»"
          source: "دستور العلماء للأحمدنكري"
          addition: "المُطَابَقَة تدل على التطابق التام لا التقارب الجزئي من القيمة؛ فهي أشد اشتراطاً من مفهوم accuracy"
        - text: "«conformity / concordance / compliance / matching»"
          source: "معاجم أرابترم المتعددة"
          addition: "المُطَابَقَة في الاستعمال التقني تدل على التوافق مع المواصفات لا على الدقة المقياسية"

    - lemma: "سَدَاد"
      expands:
        - text: "«السَّداد: الاستقامة والقصد والصواب من القول والفعل»"
          source: "المعجم الوسيط"
          addition: "السَّداد مجاور دلالياً للدقة لكنه يُستعمل في سياقات السلوك والقول لا القياس الكمي"
        - text: "«الصَّوابُ من القول والفِعْلِ»"
          source: "المعجم الكبير"
          addition: "السداد يدل على الصواب النوعي لا على الاقتراب الكمي من قيمة مرجعية"

    - lemma: "وَفَاق"
      evidence_status: "no_material_found"

    - lemma: "ضَبْط"
      confirm:
        - text: "«الدرجةُ التي تَقترب فيها نتيجةُ الحساب أو القياس من القيمة الحقيقية»"
          source: "معجم مصطلحات المعلوماتية (2000) — ALECSO (EN: accuracy)"
        - text: "«درجة دقة وسيلة قياس / مدى دقة النتائج المحصل عليها» [EN: accuracy]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«دقة، ضبط» كمقابل مزدوج لـ accuracy"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«accuracy: (1) ضَبْط (مج)؛ صِحّة (2) دِقّة» — ضَبْط مُقدَّم بوصفه الأول ومُصطلَح مجمعي (مج)"
          source: "المورد الحديث (2008)"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "دِقَّة"
      decision: confirmed
      decision_reason: >
        دِقَّة هي اللمّة الأساسية ذات التوثيق الأشمل في المعاجم التقنية العربية للدلالة على accuracy بمعنى
        القرب من القيمة الحقيقية. تُغطيها معاجم ALECSO في الرياضيات والكيمياء والهندسة الكهربائية والمناخ
        والتجارة والإعلام، ومعجم الصواب اللغوي يُجيزها صراحةً. الجذر (دقق) راسخ وله طاقة اشتقاقية واسعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        دِقَّة هي اللمّة الأوسع انتشاراً والأشمل تغطيةً عبر جميع التخصصات العلمية والتقنية؛ تحمل دلالة
        التناهي في الضبط الكمي وتُستعمل وصفاً للأجهزة والقياسات والنتائج على حدٍّ سواء. تختلف عن ضَبْط
        في أن دِقَّة تصف الخاصية المجردة (جودة القياس)، بينما ضَبْط يُبرز فعل الإمساك والتحكم.

    - lemma: "صِحَّة"
      decision: removed
      decision_reason: >
        المعنى الأولي والغالب لصِحَّة في المعجم العربي هو العافية الجسدية والبراءة من المرض والعيب، ثم
        توسّع في الفقه ليدل على السقوط والاعتداد. ورودها في المورد الحديث ترجمةً لـ accuracy جاء في المرتبة
        الثانية بعد ضَبْط، وكشّاف التهانوي يذكرها بمعنى exactitude لكن ضمن حقل الصحة الجسدية واللغوية.
        لا يوجد تعريف مقياسي صريح لصِحَّة يجعلها مقابلاً دقيقاً لـ «nearness to true value». إدراجها هنا
        سيُوقع لبساً مع المجموعات الدلالية الخاصة بالصحة والعافية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِصَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        جميع المداخل المعجمية تُثبت إِصَابَة بمعنى الجرح والأذى والمرض والإصابة بالآفات. لا يوجد أي دليل
        يدعم استخدامها مصطلحاً للدقة المقياسية. المجاز المقترح غير مستقرٍّ معجمياً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُطَابَقَة"
      source: stage1
      decision: removed
      decision_reason: >
        مُطَابَقَة تدل على التطابق التام بين شيئين لا على التقارب الجزئي من القيمة الحقيقية. الأدلة تظهرها
        بمعنى conformity/concordance في النحو والبلاغة والمعاجم التقنية، وهو مفهوم مختلف جوهرياً عن accuracy.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "سَدَاد"
      source: stage1
      decision: removed
      decision_reason: >
        السَّداد يدل على الصواب والاستقامة في القول والفعل وهو مفهوم كيفي لا كمّي. لا يحمل دلالة الاقتراب
        من قيمة رقمية مرجعية، وغير مُستعمَل مصطلحاً في علوم القياس.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "وَفَاق"
      source: stage1
      decision: removed
      decision_reason: >
        وَفَاق يدل على الملاءمة والاتفاق في الرأي والاتفاقيات الدولية. لا يوجد أي توثيق يجعله مصطلحاً
        للدقة المقياسية، ولا يُستعمل في الأدبيات العلمية العربية بهذه الدلالة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "ضَبْط"
      source: stage2
      decision: confirmed
      decision_reason: >
        ضَبْط وُثِّق في معجم مصطلحات المعلوماتية (ALECSO 2000) بالتعريف المطابق لمفهوم المجموعة تماماً:
        «الدرجة التي تقترب فيها نتيجة الحساب أو القياس من القيمة الحقيقية». المورد الحديث يُقدّمه في
        المرتبة الأولى كمصطلح مجمعي (مج) لـ accuracy. ورد أيضاً في معجم الصيدلة والكيمياء. الجذر ضبط
        راسخ ومفهوم الضبط والإمساك والتحكم يتسق مع الدلالة المطلوبة. يُضاف إلى دِقَّة ليُعطي المجموعة
        تغطية أوسع عبر تخصصات المعلوماتية والصيدلة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        ضَبْط يُبرز جانب التحكم والإمساك بالقيمة وإتقان العملية القياسية، وكثيراً ما يُستعمل في سياقات
        الحوسبة والصيدلة للإشارة إلى درجة دقة الأجهزة والعمليات مع التأكيد على الفعل والإتقان لا الخاصية
        المجردة وحدها. يختلف عن دِقَّة في أن دِقَّة أوسع شيوعاً عبر التخصصات.
      actions:
        - command: create_entry
          params:
            lemma: "ضَبْط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "صفة القرب من القيمة الحقيقية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في جوهره لكنه مقتضب ويفتقر إلى الجنس القريب (خاصية القياس أو النتيجة)
        والفصل النوعي الكامل. أدلة المعاجم تُثري التعريف بالإشارة إلى الكمية المراد قياسها والنتيجة
        المحصَّلة وهو ما يعكس التعريف المقياسي المعياري (ISO).
    authored:
      - type: terminological
        text: "خاصيَّةُ القياس أو التقدير المُعبِّرة عن مدى اقتراب النتيجة المُحصَّلة من القيمة الحقيقية للكمية المراد قياسها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "صفة ما وافق الحقيقةَ أو قارَبها ونأى عن الخطأ والانحراف"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خاصيَّةُ القياس أو التقدير المُعبِّرة عن مدى اقتراب النتيجة المُحصَّلة من القيمة الحقيقية للكمية المراد قياسها"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "صفة ما وافق الحقيقةَ أو قارَبها ونأى عن الخطأ والانحراف"

  examples:
    per_lemma:
      - lemma: "دِقَّة"
        examples:
          - text: "حصلت التجربة على نتائج فائقة الدِّقَّة لم تحِد عن القيمة الحقيقية بأكثر من جزء في الألف."
            type: usage
      - lemma: "ضَبْط"
        examples:
          - text: "يُعدّ ضَبْط جهاز الرصد معياراً أساسياً في تقييم جودة نتائج القياس ومدى قُربها من القيم المرجعية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "حصلت التجربة على نتائج فائقة الدِّقَّة لم تحِد عن القيمة الحقيقية بأكثر من جزء في الألف."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدّ ضَبْط جهاز الرصد معياراً أساسياً في تقييم جودة نتائج القياس ومدى قُربها من القيم المرجعية."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
stage5_enrichment:

  per_entry:
    - lemma: "دِقَّة"
      entry_id: "{auto}"
      root: "دقق"
      maqayis_quote: "«الدَّالُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى صِغَرٍ وَحَقَارَةٍ. فَالدَّقِيقُ: خِلَافُ الْجَلِيلِ»"
    - lemma: "ضَبْط"
