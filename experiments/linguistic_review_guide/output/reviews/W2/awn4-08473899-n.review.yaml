        - word: "الوحوش"
          root: "وحش"
          maqayis_quote: "«الْوَاوُ وَالْحَاءُ وَالشِّينُ: كَلِمَةٌ تَدُلُّ عَلَى خِلَافِ الْإِنْسِ.»"
