# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13400926-n (letter of credit)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «خطاب اعتماد» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط؛ المفهوم المصرفي له مرادفات عربية مثبتة أخرى"
      - "التعريف العربي ترجمة حرفية شبه آلية من الإنجليزية — يحتاج صياغة معجمية عربية"
    observations: "المفهوم مصرفي حديث راسخ في العربية، يُعبَّر عنه بمركبات إضافية ثابتة. المصطلح الأكثر شيوعاً في المشرق هو «خطاب اعتماد» وفي المعاجم الموحدة لِلألكسو «كتاب اعتماد». كلاهما مركب إضافي من نوع (وثيقة + نوع الائتمان). المفهوم يتمايز عن «الاعتماد المستندي» الذي يدلّ على ترتيب الائتمان نفسه لا على الوثيقة."
  blind_candidates:
    - lemma: "خِطَابُ اعْتِمَادٍ"
      generation_method: tarkib
      justification: "مركب إضافي ثابت من «خطاب» (رسالة) و«اعتماد» (ائتمان مصرفي)، يدلّ على الوثيقة المصرفية التي تضمن الدفع. مصطلح مصرفي شائع في المشرق العربي."
    - lemma: "كِتَابُ اعْتِمَادٍ"
      generation_method: tarkib
      justification: "مركب إضافي ثابت من «كتاب» (وثيقة مكتوبة) و«اعتماد»، مرادف لـ«خطاب اعتماد» في المعاجم الموحدة لِلألكسو. «كتاب» أقرب إلى الفصحى من «خطاب» بمعنى الرسالة."
    - lemma: "اعْتِمَادٌ مُسْتَنَدِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «اعتماد» و«مستندي» (نسبة إلى المستندات)، يُستخدم في المجال المصرفي والقانوني. قد يدلّ على ترتيب الائتمان أكثر من الوثيقة ذاتها."
    - lemma: "صَكُّ ائْتِمَانٍ"
      generation_method: tarkib
      justification: "مركب إضافي من «صك» (وثيقة مالية) و«ائتمان» (إقراض المال)، محاولة لتوليد مصطلح بديل بمكوّنات عربية أصيلة. الصك يدلّ على الوثيقة المالية والائتمان يدلّ على الثقة المالية."


stage2_evidence:
  per_lemma:
    - lemma: "خِطَابُ اعْتِمَادٍ"
      confirm:
        - text: "«خِطابُ الائْتِمان (عند المَصْرَفِيِّين): خِطابٌ يُرْسِلُه البنكُ الذى فَتَح الاعتمادَ إلى الْمُسْتَفِيدِ, يُخْطِره فيه بذلك. و: خِطابٌ يَطْلبُ فيه البَنْكُ إلى مُراسِلِيه في الخارج أن يَدْفَعُوا لحامِلِه ما يَحْتاجُ إليه لِغايَةِ مَبْلَغٍ مُعَيَّنٍ»"
          source: "المعجم الكبير"
        - text: "«خطاب اعتماد — letter of credit»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«خطاب اعتماد — letter of credit»"
          source: "مسرد الفن، التسلية والرياضة، الألكسو"
      expands:
        - text: "«الخِطَابُ: الكلام، الرِّسالَةُ»"
          source: "المعجم الوسيط"
          addition: "الخطاب في الاستعمال المعاصر يشمل الرسالة المكتوبة، أقرّه مجمع اللغة المصري"
        - text: "«خِطَاب — أَرْسَلْت إليه خطابًا [...] يمكن تخريج الاستعمال المرفوض على أنه من باب التوسع في الدلالة وشمول الخطاب كل أشكال الكلام المُوَجَّه إلى الغير سواء كان في شكل كلام مكتوب أو منطوق. وقد أجازت بعض المعاجم كالأساسي والمعجم الوسيط الخطاب بمعنى الرسالة. وأقره مجمع اللغة المصري»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "استعمال خطاب بمعنى رسالة صحيح لغوياً وأقرّه المجمع"

    - lemma: "كِتَابُ اعْتِمَادٍ"
      confirm:
        - text: "«كتاب اعتماد — letter of credit»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«كتاب الاعتماد [يُصْدره المصرِف إلى أحد مراسليه أو عملائه] (اد). — letter of credit»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«كتاب اعتماد تجاري — commercial letter of credit»، «كتاب اعتماد معزز — confirmed letter of credit»، «كتاب اعتماد تصديري — export letter of credit»، «كتاب اعتماد عالمي — world-wide letter of credit»، «كتاب اعتماد محلي — local letter of credit»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "المصطلح منتج اشتقاقياً: يقبل أوصافاً تخصيصية متعددة"

    - lemma: "اعْتِمَادٌ مُسْتَنَدِيٌّ"
      confirm:
        - text: "«اعتماد مستندي — documentary credit»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«اعتماد مستنديّ — documentary credit»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: "«اعتماد مستندي = documentary credit» مقابل «كتاب اعتماد / خطاب اعتماد = letter of credit»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "المعجم الموحد يفرّق بين المصطلحين: الاعتماد المستندي هو ترتيب الائتمان (documentary credit)، أمّا خطاب/كتاب الاعتماد فهو الوثيقة ذاتها (letter of credit)"

    - lemma: "صَكُّ ائْتِمَانٍ"
      evidence_status: "no_material_found"


