      nuance: "يؤكد على الجانب الجغرافي والسكاني للكيانات (البلدان) أكثر من الجانب السياسي المحض."
      mwe: true
    - lemma: "الْمَجْمُوعَةُ الآسِيَوِيَّةُ"
      sense_id: "{auto}"
      nuance: "يُركز على الصفة التنظيمية والائتلافية لدول القارة في المحافل الدولية."
