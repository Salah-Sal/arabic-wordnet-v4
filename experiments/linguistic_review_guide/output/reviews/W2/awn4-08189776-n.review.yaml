      entry_id: "{auto}"
      root: null
      note: "{\"origin\":\"Greek\",\"etymology\":\"Asia\"}"
    - lemma: "الدُّوَلُ الآسِيَوِيَّةُ"
      entry_id: "{auto}"
      roots:
        - word: "الدول"
          root: "دول"
          maqayis_quote: "«الدال والواو واللام أصلان: أحدهما يَدُلُّ على تغيّر الشيء، والآخر يدلُّ على ضَعفٍ... فأمّا الأول فالدُّولة والدَّولة، هما لغتان...»"
