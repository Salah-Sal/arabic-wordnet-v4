        تركيب أثقل من اللازم. مصدر 'اغتزال' وإن ورد في المعاجم الكلاسيكية (لسان العرب:
        «اغتزلَتْه») إلا أنه نادر الاستخدام في العربية المعاصرة، ولا سند لهذا المركّب
        كوحدة مصطلحية ثابتة. وجود 'قابلية الغزل' يُغني عنه.
