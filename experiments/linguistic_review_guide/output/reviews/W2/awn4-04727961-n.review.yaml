# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'قابلية الغزل' تعبيرٌ وصفي مركّب لم يُسجَّل كوحدة معجمية ثابتة في المعاجم المتخصصة بالنسيج."
      - "اللمّة تفتقر إلى التشكيل الكامل."
      - "المجموعة لا تضمّ سوى لمّة واحدة في مجال تقني دقيق يستدعي مصطلحاً رسمياً مُقنَّناً."
    observations: >
      المفهوم دقيق يخص علم ألياف النسيج (textile fiber science)، ويصف خاصية قدرة
      الألياف على التحوّل إلى خيوط عبر الغزل الصناعي. المصطلح الإنجليزي 'spinnability'
      مشتق من وزن -ability الدال على القابلية. يتضمن المفهوم بُعدَيْن: (أ) صلاحية الليفة
      نفسها للغزل، و(ب) استيفاء شروط الجودة الصناعية. يُوجَّه المصطلح العربي نحو الجذر
      غزل (غ-ز-ل) الثابت في المعاجم، ويُمكن الاشتقاق منه على أوزان متعددة كمَفْعُولِيَّة
      أو فَعُولِيَّة أو انفعالية، أو التركيب بمصدر المشتقات ذات الصلة.

  blind_candidates:
    - lemma: "مَغْزُولِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مشتق من اسم المفعول 'مَغْزُول' على وزن مَفْعُولِيَّة — وزن منتج
        دالٌّ على خاصية كون الشيء قابلاً لأن يُفعَل به الفعل، يوازي: مَقْرُوئِيَّة
        (readability) ومَسْمُوعِيَّة (audibility) ومَرْئِيَّة (visibility). تعني
        مَغْزُولِيَّة: خاصية كون الليف قابلاً للغزل والتفتيل.

    - lemma: "غَزُولِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر غزل على وزن فَعُول (الدال على القابلية الذاتية والميل الطبيعي)
        مضافاً إليه ياء النسب والتأنيث. يوازي: سَهُولِيَّة، قَبُولِيَّة. يعني: الطاقة
        الذاتية والنزوع الطبيعي للمادة الليفية نحو الغزل.

    - lemma: "قَابِلِيَّةُ الِاغْتِزَال"
      generation_method: tarkib
      justification: >
        تركيب إضافي من 'قابلية' (= الاستعداد والتهيؤ) + 'الاغتزال' (مصدر الفعل
        اغتَزَلَ المذكور في لسان العرب: «اغتزلَتْه» أي اشتغلت بغزله). يُعبِّر عن
        استعداد الألياف للخضوع لعملية الغزل والانخراط فيها.

    - lemma: "اِنْغِزَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الفعل المطاوع 'انغَزَلَ' (وزن انفعَلَ المبني للمجهول) + ياء
        النسبة + تاء التأنيث للدلالة على الخاصية المجردة. يُعبِّر عن صفة كون
        الليفة قابلةً لأن تُغزَل من تلقاء طبيعتها الداخلية.


