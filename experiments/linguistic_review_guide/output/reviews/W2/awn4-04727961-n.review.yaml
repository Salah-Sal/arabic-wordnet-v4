# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "قابلية الغزل"
      decision: confirmed
      decision_reason: >
        تركيب إضافي صحيح البنية؛ 'قابلية' = الاستعداد والتهيؤ (موثّق في المعجم الوسيط)،
        'الغزل' = عملية فتل الصوف والقطن خيوطاً (ثابت في جميع المعاجم من العين وحتى
        الوسيط). وإن لم يُسجَّل المركّب كوحدة ثابتة في مسرد النسيج، فهو مفهوم ومتداول
        في الأدبيات التقنية غير الرسمية، ويُعبِّر عن البُعد الاستعدادي للمفهوم. يلزم
        تصحيح التشكيل الكامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز البُعد الاستعدادي والكامن: قدرة الألياف الطبيعية على الانخراط في عملية
        الغزل وقبولها لها من منظور الإمكانية الذاتية. أوسع تداولاً في الكتابة التقنية
        غير الرسمية وفي الدراسات الأكاديمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ الْغَزْلِ"

    # ── مصطلح مكتشَف من الأدلة (ArabTerm / Textiles Industries) ──
    - lemma: "مُلَاءَمَةٌ لِلْغَزْلِ"
      source: evidence
      decision: confirmed
      decision_reason: >
        المصطلح الرسمي المعتمد في مسرد صناعة النسيج (ALECSO/ArabTerm، entry_id: 369868)
        للمصطلح الإنجليزي 'spinnability'، مع تعريف تقني دقيق يُوافق تماماً معنى المجموعة.
        يستند إلى جذر 'لأم' الذي أصلُه الاتفاقُ والاجتماعُ والالتئامُ (ابن فارس)، مما
        يُعبِّر عن التوافق مع مواصفات الجودة الصناعية. يتفوّق على 'قابلية الغزل' بكونه
        مُقنَّناً في مسرد متخصص بصيغة ثابتة.
        اختبار السكّ: لا يمكن إبدال 'ملاءمة' بـ'مناسبة' مع الاحتفاظ بالدلالة التقنية
        ذاتها في سياق النسيج الصناعي — المصطلح مُثبَّت معجمياً بهذه الصيغة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على التوافق مع المواصفات والمعايير الصناعية: مدى استيفاء الألياف لاشتراطات
        الجودة المطلوبة في خطوط الغزل الصناعي (متانة، انسجام، إنتاجية). المصطلح الرسمي
        الموصى به في الوثائق التقنية والمعايير ووثائق التقييس.
      actions:
        - command: create_entry
          params:
            lemma: "مُلَاءَمَةٌ لِلْغَزْلِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشحات المرحلة ١ — مرفوضة ──
    - lemma: "مَغْزُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الوزن (مَفْعُولِيَّة) صرفياً سليم ومنتج، غير أن المصطلح لم يُسجَّل في أي معجم
        تقني عربي متخصص بالنسيج أو غيره، ولا يرد في أدبيات الغزل الصناعي المتاحة. في ظل
        وجود مصطلح رسمي مُقنَّن هو 'ملاءمة للغزل' لا مسوّغ لاقتراح صياغة جديدة.
