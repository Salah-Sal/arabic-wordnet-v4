        value: '{"roots":[{"word":"سائق","root":"سوق","maqayis":"«السِّينُ وَالْوَاوُ وَالْقَافُ أَصْلٌ وَاحِدٌ...»"},{"word":"ترام","root":"ترام","maqayis":"لفظ معرب"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"التعبير الشائع والواضح لوصف المهنة.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
