# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-05100680-n — خطر العدوى
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «مخاطرة» عامة جداً ولا تختص بالعدوى؛ دلالتها الأصلية المراهنة والمجازفة لا احتمال الإصابة"
      - "التعريف العربي ترجمة حرفية شبه كاملة للتعريف الإنجليزي؛ يحتاج صياغة معجمية أصيلة"
      - "لا يوجد تشكيل على اللمّات الموجودة"
    observations: "المجموعة تمثّل مفهوماً وبائياً تخصصياً: احتمال الإصابة بعد التعرّض لعامل مُعْدٍ. المصطلح الطبي العربي الدقيق هو «اختطار» (من افتعال خطر) كما أقرّه المعجم الطبي الموحد. المركّب «خطر العدوى» إضافي مسكوك في الخطاب الطبي، أمّا «مخاطرة» فمصدر مُفاعلة يدلّ على الفعل الإرادي (المجازفة) لا على الاحتمال المجرّد."

  blind_candidates:
    - lemma: "اخْتِطَارُ الْعَدْوَى"
      generation_method: tarkib
      justification: "مركب إضافي من «اختطار» (مصدر افتعال من خطر، أقرّه المعجم الطبي الموحد بمعنى احتمال الخطر) و«العدوى»، فيكون المعنى: احتمال خطر الإصابة بالعدوى"
    - lemma: "اخْتِطَار"
      generation_method: ishtiqaq
      justification: "مصدر على وزن افتعال من الجذر خ ط ر، أقرّه المعجم الطبي الموحد مقابلاً لـ risk، ويدلّ على احتمال الخطر دون تخصيص بالعدوى"
    - lemma: "مَظِنَّةُ الْعَدْوَى"
      generation_method: majaz
      justification: "مظنّة الشيء: موضعه الذي يُظنّ كونه فيه (الوسيط)، فمظنّة العدوى هي الموضع أو الحالة التي يُتوقّع فيها حصول العدوى — إزاحة دلالية من المكان إلى الاحتمال"
    - lemma: "خُطُورَةُ الْإِعْدَاء"
      generation_method: tarkib
      justification: "مركب إضافي من «خطورة» (مصدر يدل على كون الشيء خطيراً أو ذا احتمال) و«الإعداء» (مصدر أعدى أي نقل الداء)، فيكون المعنى: درجة احتمال نقل الداء"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خَطَرُ الْعَدْوَى"
      confirm:
        - text: "«الخَطَر: محركةً الإشرافُ على الهلاك إن لم يكن مقروناً بالحذر وَفْقَ القدر»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«(الْخطر) الإشراف على الْهَلَاك والرهان والعوض والنصيب [...] والمثيل فِي الشّرف والرفعة»"
          source: "المعجم الوسيط"
        - text: "«الخطر: الإشراف على الهلاك وخوف التلف. وخاطر بنفسه فعل ما الخوف فيه أغلب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العَدْوى: هو الاسم من أعداء الحرب ونحوه أي ما يُعدي من جرب أو غيره، أي يسرع من واحد إلى آخر»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«(الْعَدْوى) انْتِقَال الدَّاء من الْمَرِيض بِهِ إِلَى الصَّحِيح بوساطة مَا»"
          source: "المعجم الوسيط"
      expands:
        - text: "«خطر — en: risk — fr: risque» (مجال: المياه)"
          source: "المعجم الموحد لمصطلحات المياه"
          addition: "يؤكد استعمال «خطر» مقابلاً لـ risk في المعاجم المصطلحية الحديثة"
        - text: "«عدوى — en: infection» — «الحالة التي تصيب فيها ميكروبات مسببة للأمراض جسم كائن حي وتغزو أنسجته وتتكاثر فيها»"
          source: "مسرد المناخ والبيئة"
          addition: "تعريف علمي دقيق للعدوى يتّسق مع المفهوم الوبائي"

    - lemma: "مُخَاطَرَة"
      contradicts:
        - text: "«المُخَاطرة: هي المُراهنة»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الدلالة الأصلية هي المراهنة والمقامرة لا احتمال الإصابة بالعدوى"
      expands:
        - text: "«مخاطرة — en: risk — fr: risque» (مجال: التربية)"
          source: "مسرد التربية (ALECSO)"
          addition: "تؤكد استعمال مخاطرة مقابلاً عاماً لـ risk في الخطاب الحديث"
        - text: "«مخاطرة — en: risk — الربط بين احتمال وقوع حدث والآثار المترتبة على حدوثه»"
          source: "مسرد التربية (ALECSO)"
          addition: "التعريف المصطلحي يجعل المخاطرة ربطاً بين الاحتمال والأثر، وهو أوسع من مجرد احتمال العدوى"

    # ── المرشحات ──
    - lemma: "اخْتِطَارُ الْعَدْوَى"
      confirm:
        - text: "«اخْتِطار (احْتِمالُ الخَطَر) — en: risk — fr: risque» (مجال: الطب)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«عامِلُ اخْتِطارٍ قُوتيّ — en: dietary risk factor»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«(الْعَدْوى) انْتِقَال الدَّاء من الْمَرِيض بِهِ إِلَى الصَّحِيح بوساطة مَا»"
          source: "المعجم الوسيط"
          addition: "المكوّن الثاني من المركب ثابت معجمياً"

    - lemma: "اخْتِطَار"
      confirm:
        - text: "«اخْتِطار (احْتِمالُ الخَطَر) — en: risk — fr: risque»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«عامِلُ اخْتِطارٍ قُوتيّ — en: dietary risk factor»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يؤكد إنتاجية المصطلح في التركيب (عامل اختطار)"

    - lemma: "مَظِنَّةُ الْعَدْوَى"
      expands:
        - text: "«(مَظَنَّة) الشَّيْء مَوْضِعه ومألفه الَّذِي يظنّ كَونه فِيهِ»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية مكانية (موضع الظن)، وتوسيعها إلى الاحتمال مجازي غير مسكوك"

    - lemma: "خُطُورَةُ الْإِعْدَاء"
      expands:
        - text: "«خطورة — en: risk — fr: risque» (مجال: الهندسة المدنية)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
          addition: "خطورة مستعملة مقابلاً لـ risk لكن في مجال غير طبي"
        - text: "«إِعْداء — en: infectivity (infectiousness)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "إعداء = قدرة العامل على نقل العدوى (infectivity)، وهو مفهوم مختلف عن احتمال إصابة المُعرَّض"


# ── المرحلة ٣: التحليل اللغوي ──────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خَطَرُ الْعَدْوَى"
      decision: confirmed
      decision_reason: "مركب إضافي مسكوك في الخطاب الطبي والوبائي العربي، مكوّناه ثابتان معجمياً (خطر = الإشراف على الهلاك، عدوى = انتقال الداء). يُستعمل على نطاق واسع في المراجع الصحية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على البُعد التهديدي (الخطر/الهلاك) لاحتمال الإصابة، ويُستعمل في الخطاب العام والإعلامي الصحي أكثر من السياق البحثي الدقيق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَطَرُ الْعَدْوَى"

    - lemma: "مُخَاطَرَة"
      decision: removed
      decision_reason: "المخاطرة مصدر مُفاعلة من خاطر، ودلالتها الأصلية المراهنة والمجازفة الإرادية. في الاستعمال الحديث تدل على «الربط بين احتمال وقوع حدث والآثار المترتبة عليه» وهو مفهوم أعم من احتمال العدوى تحديداً. لا تصلح مرادفاً لمفهوم وبائي تخصصي لأنها لا تستلزم سياق العدوى ولا التعرض لعامل معد."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── المرشحات ──
    - lemma: "اخْتِطَارُ الْعَدْوَى"
      source: stage1
      decision: confirmed
      decision_reason: "مركب إضافي من «اختطار» الذي أقرّه المعجم الطبي الموحد مقابلاً لـ risk بمعنى احتمال الخطر، و«العدوى». هو الأدق طبياً لأن اختطار يختص بالاحتمالية لا بالخطر المادي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُفضَّل في السياق الطبي والوبائي الدقيق؛ «اختطار» مصطلح أقرّه المعجم الطبي الموحد وهو أكثر تخصصاً من «خطر»"
      actions:
        - command: create_entry
          params:
            lemma: "اخْتِطَارُ الْعَدْوَى"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اخْتِطَار"
      source: stage1
      decision: removed
      decision_reason: "اختطار بمفرده يعني «احتمال الخطر» عموماً (= risk) وليس مخصصاً بالعدوى. المجموعة الترادفية تمثّل «خطر العدوى» لا «الخطر» المطلق، فالمصطلح المفرد أوسع من المطلوب ويناسب المجموعة الأم (probability) أكثر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "مَظِنَّةُ الْعَدْوَى"
      source: stage1
      decision: removed
      decision_reason: "مظنّة الشيء تعني موضعه الذي يُظنّ كونه فيه، والاستعمال مكاني أساساً. لم يُوثَّق «مظنّة العدوى» تعبيراً مسكوكاً في أي معجم طبي أو لغوي، وتوسيعه إلى الاحتمال الكمّي مجاز غير مأنوس."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "خُطُورَةُ الْإِعْدَاء"
      source: stage1
      decision: removed
      decision_reason: "الإعداء يعني القدرة على نقل العدوى (infectivity)، وهو مفهوم مختلف عن احتمال إصابة المُعرَّض (risk of infection). كما أن المركب غير مسكوك في المعاجم الطبية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


