          conflict: "الاستعمال الحديث السائد لـ'الكون' هو الكون الفلكي (cosmos/universe) لا 'حالة الوجود'، مما يُوقع في التباس دلالي شديد إذا أُضيف كلمّة للمجموعة"

    - lemma: "التَّحَقُّق"
