          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "الثبوت عند المعتزلة أوسع من الوجود لأنه يشمل المعدوم الذي يُعلم، مما يجعله مصطلحاً كلامياً دقيقاً مغايراً للمفهوم الوجودي العام المراد بالمجموعة"

    - lemma: "الكَوْن"
      confirm:
