        - text: "«كَيْنُونة — كَانَ الشَّيْء يَكُون كَوْنا وكَيْنونَةً»"
          source: "لسان العرب (من باب كون)"
      expands:
        - text: "لا يوجد مدخل مستقل لـ'كينونة' في المعاجم المتاحة؛ تَرِد دائماً بوصفها مصدراً فرعياً لكانَ يكونُ في سياق شرح مصادر الفعل"
          source: "ملاحظة من قاعدة البيانات"
          addition: "تكرار الإشارة إلى كينونة بوصفها 'الأحسن' و'الأفصح' من مصادر كان في أمهات المعاجم (العين، اللسان، القاموس) يُرسِّخ موقعها كلمّة رئيسية لهذه المجموعة"

    - lemma: "الإِنِّيَّة"
      confirm:
