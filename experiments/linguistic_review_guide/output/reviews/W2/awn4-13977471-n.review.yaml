    - lemma: "كينونة"
      confirm:
        - text: "«(1) كينونة؛ وجود — ترجمة existence»"
          source: "المورد الحديث (2008)"
        - text: "«الكَيْنُونَة فِي مَصْدَر كانَ يَكُونُ أَحسَنُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الكَيْنُونَةُ فى مصدر كانَ يكونُ أحسنُ»"
          source: "لسان العرب لابن منظور"
        - text: "«والكينونة في مصدر كان أحسن»"
