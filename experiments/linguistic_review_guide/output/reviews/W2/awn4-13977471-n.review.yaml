# المفهوم: حالة أو حقيقة الوجود (the state or fact of existing)
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّات المجموعة الثلاث (كيان، كينونة، وجود) تخلو من التشكيل الكامل، ويجب تصحيحها"
      - "كيان يميل في الاستعمال الحديث نحو معنى 'الكيان المستقل' (entity) لا 'حالة الوجود' (state of existing)؛ الأمر يستدعي التحقق من دقة موضعه في المجموعة وتوثيق الفارق الدلالي"
      - "التعريف العربي الحالي 'حالة أو حقيقة الوجود' ترجمة حرفية من الإنجليزي، يُستحسن إعادة صياغته بأسلوب المعجم الوسيط مع جنس قريب وفصل نوعي"
    observations: "المجموعة تُعبِّر عن مفهوم وجودي/فلسفي عميق هو 'كَوْن الشيء موجوداً'. اللمّات الثلاث تنتمي إلى جذرين: (ك-و-ن) لكيان وكينونة، و(و-ج-د) لوجود. اللمّات صحيحة من الناحية المعجمية لكنها تحتاج إلى ضبط صرفي وتوثيق دلالي: وُجود هو الأوسع استعمالاً والأدق مطابقةً للمفهوم؛ وكَيْنُونَة هو المصدر الأفضل لكان عند أئمة اللغة ويُفيد الصفة الوجودية الجوهرية؛ أما كِيان فقد تخصص في الاستعمال الحديث بمعنى 'الكيان المستقل' أكثر من 'حالة الوجود' الأمر الذي يستدعي التنبيه."
  blind_candidates:
    - lemma: "الإِنِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من حرف التوكيد 'إنّ'، يُفيد تحقق وجود الشيء وثبوت هويته الخاصة. مصطلح فلسفي كلاسيكي يُقابل الـ'haecceitas' اللاتيني، وهو قريب من 'حقيقة الوجود' التي هي جوهر تعريف المجموعة."
    - lemma: "الثُّبُوت"
      generation_method: ishtiqaq
      justification: "مصدر من ثَبَتَ يَثْبُتُ على وزن فُعُول، يُفيد الوجود المُثبَّت والمُحقَّق. الجذر (ث-ب-ت) يدل على الرسوخ والديمومة التي تُوصف بها 'حقيقة الوجود'، وهو في السياق الفلسفي الكلاسيكي مرادف لـ'الوجود'."
    - lemma: "الكَوْن"
      generation_method: majaz
      justification: "إحياء للمعنى الأصيل الأول لـ'الكَوْن' قبل تخصصه في معنى الكون الفلكي؛ في اللغة الأولى 'كانَ الشيءُ يكونُ كَوْناً' أي وقع وحضر وثبت وجوده. مجاز قائم على الإزاحة الدلالية من 'الوجود المطلق العام' إلى 'حالة الوجود'."
    - lemma: "التَّحَقُّق"
      generation_method: ishtiqaq
      justification: "مصدر باب التفعّل من حَقَّقَ على وزن تَفَعُّل، يُفيد انتقال الشيء من القوة إلى الفعل ومن العدم إلى الوجود. يقال 'تحقَّق الأمر' أي صار له وجود في الواقع، وهو تعبير دقيق عن 'حقيقة الوجود'."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت: ١) دفعي لجميع اللمّات والمرشحات، ٢) إثراء بالمعرّفات،
# ٣) جسر إنجليزي (being / beingness / existence / face of the earth)،
# ٤) مقاييس اللغة (dictionary_id=151) لجذري كون ووجد
