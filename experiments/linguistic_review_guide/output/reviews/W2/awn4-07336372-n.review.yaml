stage1_review:
  assessment:
    concerns:
      - "لفظ 'بروز' قد يوحي بالنتوء المادي أكثر من مجرد الدخول في الرؤية في الاستعمال المعاصر، لكنه فصيح في سياق الخروج إلى العلن."
    observations: "المجموعة تعبر عن حدث (event) وليس عن الهيئة الخارجية (appearance/look). اللمات الموجودة صحيحة، ولكن يمكن إغناؤها بمصادر أخرى تعبر عن نفس الحدث بدقة."
  blind_candidates:
    - lemma: "تَبَدٍّ"
      generation_method: ishtiqaq
      justification: "مصدر الفعل 'تبدّى' الذي يعني ظهر وتكشف بعد خفاء، وهو أبلغ في الدلالة على عملية التحول والدخول في الرؤية."
    - lemma: "بُدُوّ"
      generation_method: ishtiqaq
      justification: "المصدر الأصلي للفعل 'بدا' (بمعنى ظهر)، وهو اللفظ المقابل للغيبة."
    - lemma: "إِطْلَالَة"
      generation_method: majاز
      justification: "تُستخدم في المعاصر للدلالة على الظهور الأول أو الإشراف، وتناسب سياق الدخول في مجال الرؤية."
    - lemma: "انْبِثَاق"
      generation_method: ishtiqaq
      justification: "يُستخدم للدلالة على الظهور المفاجئ أو الخروج من مصدر، وهو نوع من الدخول في الرؤية."

stage2_evidence:
  per_lemma:
    - lemma: "ظهور"
      confirm:
        - text: "«بَدَا الشيءُ يَبْدُو بُدُواً: إذا ظَهَرَ»"
          source: "المحيط في اللغة"
        - text: "«الظهور: البدو والانتشار»"
          source: "موسوعة السلطان قابوس"
    - lemma: "بروز"
      confirm:
        - text: "«البروز: الخروج من كل شيء يواري في براز من الأرض وهو الذي لا يكون فيه ما يتوارى فيه عن عين الناظر»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "بُدُوّ"
      confirm:
        - text: "«البدو: الظهور»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«بَدَا الشيء يَبْدُو: إِذَا ظَهَرَ، فَهُوَ بَادٍ»"
          source: "مقاييس اللغة"
    - lemma: "تَبَدٍّ"
      confirm:
        - text: "«تَبَدَّى الشَّيءُ: ظَهَر، اتَّضح»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«رفعت الحجاب فتبدَّى حُسْنُها»"
          source: "معجم الصواب اللغوي"
    - lemma: "إِطْلَالَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "ظهور"
      decision: confirmed
      decision_reason: "الكلمة الأساسية والأكثر شمولاً للدلالة على الحدث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ظُهُور"
    - lemma: "بروز"
      decision: confirmed
      decision_reason: "صحيحة لغوياً للدلالة على الخروج من وراء ساتر إلى مجال الرؤية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُرُوز"
    - lemma: "بُدُوّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر أصيل وفصيح مرادف للظهور، وهو أصل المادة اللغوية الدالة على الانكشاف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بُدُوّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَبَدٍّ"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن مطاوعة الجلاء والتكشف، ويناسب وصف عملية الدخول في الرؤية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَبَدٍّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حدث الدخول في مجال الرؤية"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق وظيفياً لكنه يحتاج صياغة معجمية أكثر رصانة توضح طبيعة الحدث (الانكشاف بعد الخفاء)."
    authored:
      - type: terminological
        text: "انكشافُ الشَّيءِ لِلْعَيْنِ وبُدُوُّهُ بَعْدَ خَفَاء."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "انكشافُ الشَّيءِ لِلْعَيْنِ وبُدُوُّهُ بَعْدَ خَفَاء."}
  examples:
    per_lemma:
      - lemma: "ظُهُور"
        examples:
          - text: "رصد علماء الفلك ظهور مذنّب جديد في الأفق الشرقي."
            type: usage
      - lemma: "بُرُوز"
        examples:
          - text: "أثار بروز طلائع الجيش من وراء التلال رعباً في صفوف الأعداء."
            type: usage
      - lemma: "بُدُوّ"
        examples:
          - text: "كان بُدُوّ الفجر إيذاناً ببدء يوم جديد."
            type: usage
      - lemma: "تَبَدٍّ"
        examples:
          - text: "ما يزال تَبَدِّي النجوم في الليالي الصافية يفتن الشعراء."
            type: usage

