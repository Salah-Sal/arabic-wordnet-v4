      entry_id: "{auto}"
      root: "ظهر"
      maqayis_quote: "«الظاء والهاء والراء أصل واحد صحيح، وهو خلاف البطن... والظهور: بدو الشيء.»"
    - lemma: "بُرُوز"
      entry_id: "{auto}"
