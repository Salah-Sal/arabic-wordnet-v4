# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-06026821-n  |  ILI: i68414
# المفهوم: زمرة أبيلية / زمرة إبدالية (Abelian group / commutative group)
# تاريخ المراجعة: 2026-03-17
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل"
      - "كتابة «أبيلية» بهمزة القطع خطأ إملائي؛ الصواب «آبيلية» بالمدة نسبةً إلى آبل (Abel)"
      - "التعريف الحالي «زمرة تحقق قانون التبادل» مقتضب ولا يُميّز البنية الجبرية كاملاً"
      - "غياب لمّة «زمرة تبادلية» مع أنها أوضح المصطلحات في الإحالة إلى الخاصية المحدِّدة"
    observations: >
      المجموعة تضمّ مصطلحَيْن يُعبّران عن نفس المفهوم الرياضي بأسلوبَيْن مختلفَيْن:
      الأول إسنادي إلى عَلَم (أبيلية ← آبل الرياضي النرويجي)، والثاني اشتقاقي من الجذر
      (ب-د-ل) على وزن إفعالية. والفحص الدلالي يُظهر أن المعجم الرياضي الموحد (1990)
      يستخدم ثلاثة أوصاف لـ"commutative": تبادلي وابدالي وتبديلي؛ وأكثرها انتشاراً
      في الحقل الرياضي هو "تبادلي"، إذ يرد في "زمرة تبادلية" و"قانون التبادل" و"علاقة
      تبادلية" و"نظام تبادلي" و"حلقة تبادلية"، مما يجعل "زمرة تبادلية" الأحقّ بالإضافة.

  blind_candidates:
    - lemma: "زُمْرَةٌ تَبَادُلِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي مباشر من الجنس القريب «زمرة» مضافاً إليه الصفة «تبادلية» المشتقة من
        الجذر (ب-د-ل) على وزن (تَفَاعُلِيَّة)؛ ويُحيل الوصف مباشرةً إلى «قانون التبادل»
        المذكور في التعريف، مما يجعل المصطلح شفافاً وصريحاً.

    - lemma: "زُمْرَةٌ آبِيلِيَّة"
      generation_method: taarib
      justification: >
        تعريب النسبة إلى العَلَم الأجنبي Abel (نيلز هنريك آبل، 1802-1829)؛ يجري التقليد
        الرياضي الدولي على وصف هذه الزمرة بالنسبة إليه. التعريب يتوافق مع قواعد النسب
        العربية، ويقبل لام التعريف والجمع السالم.

    - lemma: "زُمْرَةٌ إِبْدَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر (ب-د-ل) على وزن (إِفْعَالِيَّة)؛ الإبدال في اللغة هو «قيام الشيء
        مقام الشيء الذاهب»، وهو يُحيل مجازاً إلى التعاوض بين العنصرين في العملية الثنائية
        (أ ∘ ب = ب ∘ أ).

    - lemma: "زُمْرَةٌ تَنَاوُبِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر (ن-و-ب) على وزن (تَفَاعُلِيَّة)؛ التناوب يُوحي بالتقابل والتعاقب
        بين العنصرين. مرشح يحتاج إلى تحقق من الدعم المعجمي في الحقل الرياضي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٤ استعلامات):
#   ١. مطابقة دقيقة دفعية — جميع اللمّات + المرشحات (8 نتائج)
#   ٢. جسر إنجليزي — Abelian group, commutative group, abelian, commutative (17 نتيجة)
#   ٣. بحث FTS عربي — زمرة، تبادل، ابدال، تناوب، ابيلي (20 نتيجة)
#   ٤. مقاييس اللغة لابن فارس — جذور: زمر، بدل، نوب (3 نتائج)
stage2_evidence:
  per_lemma:

    - lemma: "زمرة أبيلية"
      confirm:
        - text: "«زمرة آبيلية» — Abelian group / groupe abélien"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 414757)"
        - text: "«آبلي» — Abelian / abélien — نسبة إلى العالم آبل"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 414756)"
      expands:
        - text: "«تبادلي، ابدالي» — commutative / commutatif"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415352)"
          addition: >
            المعجم الرياضي الرسمي يُسوّي بين «تبادلي» و«ابدالي» كمصطلحَيْن مترادفَيْن
            لـ«commutative»، مما يُدعّم وجود كلتا الصيغتين في المجموعة.
        - text: "«تبادليّ؛ استبداليّ؛ إبداليّ.» — commutative"
          source: "المورد الحديث (2008) — ARABTERM (entry_id: 679275)"
          addition: >
            المورد الحديث يُدرج ثلاثة مصطلحات لـ«commutative»: تبادلي وهو الأشيع،
            واستبدالي، وإبدالي؛ مما يعكس التعدد الاصطلاحي الحقيقي في هذا الحقل.

    - lemma: "زمرة إبدالية"
      confirm:
        - text: "«تبادلي، ابدالي» — commutative / commutatif"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415352)"
        - text: "«عناصر ابدالية» — commutative elements / éléments commutatifs"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415353)"
        - text: "«حقل ابدالي» — commutative field / corps commutatif"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415354)"
        - text: "«قانون داخلي ابدالي» — internal commutative law / loi interne commutative"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 416426)"
        - text: "«ابدالية» — commutativity / commutativité (Domain: Philosophy and Psychology)"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (entry_id: 489386)"
      expands:
        - text: "«تبادليّ؛ استبداليّ؛ إبداليّ.» — commutative"
          source: "المورد الحديث (2008) — ARABTERM (entry_id: 679275)"
          addition: >
            يُظهر أن «إبدالي» لفظ مقبول في قاموس حديث متخصص إلى جانب «تبادلي»،
            مما يُثبت صحة استخدامه في المصطلح الرياضي.

    - lemma: "زُمْرَةٌ تَبَادُلِيَّة"
      confirm:
        - text: "«زمرة تبادلية» — commutative group / groupe commutatif"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415355)"
        - text: "«قانون التبادل» — commutative law / loi commutative"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415356)"
        - text: "«علاقة تبادلية» — commutative relation / relation commutative"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415357)"
        - text: "«حلقة تبادلية» — commutative ring / anneau commutatif"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415358)"
        - text: "«نظام تبادلي» — commutative system / système commutatif"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415359)"
        - text: "«تَبادُلِية» — commutativity / commutativité (Domain: Commerce and Accounting)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM (entry_id: 404344)"
        - text: "«يُمكنُ التبديل بين المتغيِّرات والحدود التي ترتبط معاً: a ∙ b = b ∙ a» — Commutative laws"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (entry_id: 377513)"
          addition: >
            يُعرّف المعجم قانون التبادل بالصيغة الرياضية الصريحة (a ∙ b = b ∙ a)، مما يُبيّن
            أن «تبادلي» هو المصطلح الأدق في التعبير عن هذا القانون في السياق الرياضي.

    - lemma: "زُمْرَةٌ آبِيلِيَّة"
      confirm:
        - text: "«زمرة آبيلية» — Abelian group / groupe abélien"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 414757)"
        - text: "«آبلي» — Abelian / abélien — نسبة إلى العالم آبل"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 414756)"

    - lemma: "زُمْرَةٌ إِبْدَالِيَّة"
      confirm:
        - text: "«تبادلي، ابدالي» — commutative / commutatif"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 415352)"
        - text: "«ابدالية» — commutativity / commutativité"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (entry_id: 489386)"

    - lemma: "زُمْرَةٌ تَنَاوُبِيَّة"
      contradicts:
        - text: "«تناوب» — alternation / alternation (Domain: Mathematics and Astronomy)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM (entry_id: 414868)"
          conflict: >
            المعجم الرياضي يُورد «تناوب» مقابلاً لـ«alternation» لا لـ«commutativity»؛
            وهما مفهومان مختلفان: الأول يعني التعاقب أو الاستبدال التسلسلي، والثاني يعني
            استقلال نتيجة العملية عن ترتيب المعاملات.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "زمرة أبيلية"
      decision: confirmed
      decision_reason: >
        المصطلح مُوثَّق في المعجم الرياضي الموحد (1990) بصيغة «زمرة آبيلية»، وهو الاسم
        الدولي المعتمد للمفهوم نسبةً إلى الرياضي آبل. يحتاج إلى تصحيح إملائي: «أبيلية»
        ← «آبيلية» (المدة بدلاً من همزة القطع) وإضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مصطلح إسنادي تاريخي يُحيل إلى شخص العالِم (آبل)، شائع في الأدبيات الرياضية
        الدولية والعربية المتخصصة؛ لا يُظهر الخاصية الجبرية صراحةً للقارئ غير المتخصص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زُمْرَةٌ آبِيلِيَّة"

    # ── لمّة موجودة ٢ ──
    - lemma: "زمرة إبدالية"
      decision: confirmed
      decision_reason: >
        المصطلح مُوثَّق في المعجم الرياضي الموحد (1990) ضمن مصطلحات متعددة بالجذر
        (ب-د-ل) مع وصف «commutative»: عناصر ابدالية، حقل ابدالي، قانون داخلي ابدالي.
        الجذر صحيح والاشتقاق سليم؛ يحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مصطلح اشتقاقي يُبرز خاصية الإبدال (تعاوض العنصرين في العملية الثنائية)؛ أكثر
        شيوعاً في الكتب الرياضية العربية الكلاسيكية، يُركّز على الخاصية البنيوية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زُمْرَةٌ إِبْدَالِيَّة"

    # ── مرشح المرحلة ١ — أ ──
    - lemma: "زُمْرَةٌ تَبَادُلِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُوثَّق توثيقاً مباشراً في المعجم الرياضي الموحد (1990) بوصفه المقابل العربي
        لـ"commutative group". يتمتع بأوسع انتشار في الحقل الرياضي العربي: قانون التبادل،
        علاقة تبادلية، حلقة تبادلية، نظام تبادلي — كلها تُرسّخ «تبادلي» مصطلحاً محورياً.
        غيابه عن المجموعة الحالية ثغرةٌ ينبغي سدّها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مصطلح اشتقاقي من (ب-د-ل) على وزن (تَفَاعُلِيَّة)؛ يُصرّح بعلاقة التبادل بين
        العنصرين وهو الأوضح دلالياً للقارئ العربي، ويرتبط ارتباطاً مباشراً بالقانون
        الرياضي المُعرِّف (قانون التبادل) ويُهيمن على معاجم الرياضيات الحديثة.
      actions:
        - command: create_entry
          params:
            lemma: "زُمْرَةٌ تَبَادُلِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — ب ──
    - lemma: "زُمْرَةٌ آبِيلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو نفسه الصيغة المُصحَّحة للمّة الموجودة «زمرة أبيلية» بعد تصحيح
        الإملاء. لا حاجة لإنشاء مدخل جديد؛ الإجراء المطلوب هو update_lemma للمّة الموجودة.

    # ── مرشح المرحلة ١ — ج ──
    - lemma: "زُمْرَةٌ إِبْدَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو الصيغة المُشكَّلة للمّة الموجودة «زمرة إبدالية»؛ لا حاجة لإنشاء
        مدخل جديد، وإجراء التشكيل مُدرج ضمن update_lemma للمّة الموجودة.

    # ── مرشح المرحلة ١ — د ──
    - lemma: "زُمْرَةٌ تَنَاوُبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «التناوب» في المعجم الرياضي مقابل لـ«alternation» لا لـ«commutativity»؛ وهما
        مفهومان مختلفان. ابن فارس يشرح «نوب» بـ«اعتياد مكان ورجوع إليه»، وهو يُحيل إلى
        التعاقب لا إلى التبادل الجبري. لا دليل معجمي يدعم هذا الاستخدام.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
