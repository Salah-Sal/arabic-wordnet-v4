# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13261955-n
# property right — حَقّ المِلْكِيَّة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحوي لمّة واحدة فقط (حَقّ المِلْكِيَّة)، وهو مركب إضافي شائع في الخطاب القانوني لكنه قد لا يستوعب جميع الاستعمالات"
    observations: >
      المفهوم قانوني صرف يدلّ على السلطة المشروعة التي يمتلكها الشخص على مال منقول أو عقار.
      المُركَّب الإضافي «حقّ + ملكيّة» هو الصيغة المعيارية في المعجمات القانونية العربية الحديثة.
      المفهوم فرع من مفهوم «المِلكيّة» (hypernym) ويُقيّده بالجانب الحقوقي تحديداً.
      لا يُتوقع وجود لفظ مفرد في العربية يؤدي هذا المعنى المركّب، فالمجال مصطلحي حديث.
  blind_candidates:
    - lemma: "حَقّ التَّمَلُّك"
      generation_method: tarkib
      justification: "مركب إضافي من «حقّ» و«تملّك» (مصدر تفعّل من ملك)، يركّز على فعل الاستحواذ والامتلاك. شائع في النصوص الحقوقية بمعنى الحقّ في اكتساب الملكية"
    - lemma: "حَقّ المِلْكِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي من «حقّ» و«الملكيّة» (مصدر صناعي من مِلْك). هو التعبير المعياري الأكثر استعمالاً في النصوص القانونية والاقتصادية للدلالة على الحقّ القانوني في الملكية"
    - lemma: "حَقّ المِلْك"
      generation_method: tarkib
      justification: "مركب إضافي من «حقّ» و«المِلْك» (اسم مصدر من ملك). صيغة أقصر وأكثر كلاسيكية، لكن قد تختلط بمعنى حقّ المُلْك (السيادة)"
    - lemma: "حَقّ عَيْنِيّ"
      generation_method: tarkib
      justification: "مركب وصفي قانوني يدلّ على الحقّ المتعلق بعين الشيء مباشرة. مصطلح قانوني معروف لكنه أعمّ من حقّ الملكية إذ يشمل حقّ الانتفاع والارتفاق"

stage2_evidence:
  per_lemma:
    - lemma: "حَقّ المِلْكِيَّة"
      confirm:
        - text: "«حق يخول لمالك العقار أو المنقول دون غيره سلطة استعماله واستغلاله والتصرف فيه، ولا يقيده في ذلك إلا القانون أو الاتفاق.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«شروط ملكية الأصول، وحق امتلاكها واستخدامها وبيعها. الحق في استخدام أو استهلاك شيء، أو مبادلة هذا الحق في مقابل شيء آخر.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      expands:
        - text: "«ownership»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يُستعمل المصطلح أيضاً في سياق التجارة والمحاسبة مقابل ownership عموماً"

    - lemma: "حَقّ التَّمَلُّك"
      evidence_status: "no_material_found"

    - lemma: "حَقّ المِلْك"
      evidence_status: "no_material_found"

    - lemma: "حَقّ عَيْنِيّ"
      contradicts:
        - text: "«حق يمنح صاحبه سلطة مباشرة على شيء معين كحق الملكية وحق الانتفاع وحق الاستعمال.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الحقّ العيني جنس أعلى يشمل حقّ الملكية وغيره (الانتفاع، الاستعمال)، فليس مرادفاً بل هو أعمّ"

stage3_analysis:
  per_lemma:
    - lemma: "حَقّ المِلْكِيَّة"
      decision: confirmed
      decision_reason: "مصطلح قانوني موثّق في معجمات أليكسو المتخصصة (القانون، التجارة، البيئة) بتعريفات تطابق دلالة المجموعة تماماً"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions: []

    - lemma: "حَقّ التَّمَلُّك"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية، والمصطلح يركّز على فعل الاكتساب (التملّك) لا على العلاقة القانونية القائمة بالملكية. الفرق دلالي جوهري: التملّك عملية، والملكية حالة"

    - lemma: "حَقّ المِلْك"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية مخصصة. المِلْك يحتمل معنى السيادة (المُلْك) فيلتبس. الصيغة المعيارية المعتمدة هي حقّ الملكيّة بالمصدر الصناعي"

    - lemma: "حَقّ عَيْنِيّ"
      source: stage1
      decision: removed
      decision_reason: "الحقّ العيني أعمّ من حقّ الملكية بنصّ المعجم القانوني الموحّد، إذ يشمل أيضاً حقّ الانتفاع والاستعمال والارتفاق. إدراجه مرادفاً خطأ تصنيفي"

