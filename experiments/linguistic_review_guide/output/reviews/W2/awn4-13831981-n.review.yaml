# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمتان المدرجتان (أساس، قاعدة) خاليتان من التشكيل الكامل"
      - "التعريف الحالي صياغة وصفية عامة تفتقر إلى الجنس القريب والفصل النوعي المعجمي الدقيق"
      - "قاعدة متعدد الدلالات اتساعاً واسعاً (قانونية، رياضية، عسكرية، منطقية، حاسوبية)؛ يستدعي التحقق من دقة ربطه بهذا المعنى تحديداً"
    observations: >
      المجموعة تمثّل مفهوماً مجرداً محورياً: الجزء الذي يستند إليه كيان الشيء ولا يتمّ
      بدونه. المفهوم حاضر بعمق في الموروث اللغوي العربي، واللمتان المدرجتان (أساس وقاعدة)
      كلتاهما راسختان في المعاجم الكلاسيكية والحديثة. غير أن 'قاعدة' تحمل طيفاً دلالياً
      أوسع يشمل القانون والضابطة والأصل المنطقي، فيما يتمحور 'أساس' حول الأصل والثبات
      والمنشأ. التعريف الحالي يحتاج صياغة أدق بأسلوب معجمي.

  blind_candidates:
    - lemma: "صَمِيم"
      generation_method: majaz
      justification: >
        من جذر (ص م م) الدال على تضامّ الشيء وصلابته وبُعده من التأثر. الصميم يُستعمل في
        العربية للدلالة على المحض الخالص وجوهر الشيء الثابت ('صميم القضية'، 'صميم العضو:
        عظمه الذي به قوامه')، وهو إزاحة دلالية نحو معنى الجزء الأكثر أهمية والذي به قوام الشيء.
        آثرتُ إحياء هذه اللفظة الكلاسيكية تجنُّباً للاشتراك اللفظي.

    - lemma: "جَوْهَر"
      generation_method: majaz
      justification: >
        يُطلق في العربية على حقيقة الشيء وذاته وما به يقوم كيانه. إزاحة دلالية من المعنى
        الفلسفي (الذات القائمة بنفسها) نحو 'الجزء الجوهري الذي لا يتحقق الشيء بدونه'.
        شائع في الاستعمال المعاصر: جوهر المسألة، جوهر الكلام.

    - lemma: "رُكِيزَة"
      generation_method: ishtiqaq
      justification: >
        على وزن فَعِيلة من جذر (ر ك ز) الدال على إثبات الشيء وغرزه حتى يثبت ويرسخ.
        تعني ما يُرتكز عليه وتقوم عليه الأشياء، وهو ملائم دلالياً للجزء الضروري الذي
        تستند إليه سائر الأجزاء.

    - lemma: "لُبّ"
      generation_method: majaz
      justification: >
        من جذر (ل ب ب) الدال على اللزوم والثبات والخلوص والجودة. لُبُّ الشيء: خالصه
        وحقيقته ونفسه. إزاحة دلالية طبيعية نحو 'الجزء الخالص الذي لا غنى عنه'،
        مستخدَم في التعبير الفصيح: لبّ المسألة، لبّ الموضوع.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "أَسَاس"
      confirm:
        - text: "«قاعدة البناء التي يُقام عليها | أصل كلِّ شيء ومبدؤه. ومنه: أساس الفكرة, وأساس البحث»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الأساس: القاعدة التي يبنى عليها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«قاعدة البناء التي يُقام عليها وأصل كل شيء ومبدؤه ومنه أساس الفكرة وأساس البحث والتعليم الأساسي الخبرة العلمية والعملية التي لا غنى عنها للناشئ»"
          source: "المعجم الوسيط (مجموعة من المؤلفين)"
          addition: "يُثبت توسّع الدلالة من الأساس المادي (البناء) إلى الأساس المعنوي (الفكرة، البحث)"
        - text: "(1) أساس (2) عنصر أو مبدأ أساسيّ"
          source: "المورد الحديث (2008) — translation_en: basis"
          addition: "يُثبت المعادل الإنجليزي basis ويُضيف بُعد 'العنصر المبدئي'"

    - lemma: "قَاعِدَة"
      confirm:
        - text: "«القاعدة: ما يقعد عليه الشيء، أي يستقر ويثبت»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«والقاعدةُ من البيت: أساسُه»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: "«القاعدة يطلق على معان: مرادف الأصل والقانون والمسألة والضابطة والمقصد. وعرّف بأنّها أمر كلّى منطبق على جميع جزئياته عند تعرّف أحكامها منه»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يكشف التعدد الدلالي الواسع: قانون، أصل، ضابطة، مقصد — وهو ما يُفسر شيوع استخدامها في سياقات متعددة"
        - text: "أساس، قاعدة — translation_en: basis"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM)"
          addition: "تُدرج 'أساس' و'قاعدة' معاً في مدخل واحد كمرادفين لـ basis، مما يُثبت الترادف المعجمي"

    - lemma: "صَمِيم"
      expands:
        - text: "«الصميم: الأصل الثابت من الصم وهو الشيء الصلب البعيد من التأثر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يدل على الثبات والصلابة والبُعد من التأثر — لا على الأهمية أو الضرورة مباشرة"
        - text: "«من كل شيء: المحض الخالص في الخير والشر (يستوي فيه المفرد وغيره)... صميم العضو: عظمه الذي به قوامه»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: "المعنيان: (١) النقاء والخلوص التام (٢) العظم المقوِّم للعضو — كلاهما على هامش المعنى المطلوب"

    - lemma: "جَوْهَر"
      confirm:
        - text: "«جوهر الشيء حقيقته وذاته»"
          source: "المعجم الوسيط (مجموعة من المؤلفين)"
      expands:
        - text: "«الجوهر: ماهية إذا وجدت في الأعيان كانت لا في موضع... ومنها الحقيقة والذات، وبهذا المعنى يقال جوهر كل شيء حقيقته»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "التعريف الفلسفي (الجوهر مقابل العَرَض) يُثقل اللفظة بدلالات تقنية تبعدها عن معنى 'الجزء الأكثر أهمية'"
        - text: "(1) جوهر الشيء أو كُنْهُهُ (2) الماهيّة؛ الذات (فف)"
          source: "المورد الحديث (2008) — translation_en: essence"
          addition: "المعادل essence يشير إلى جوهر الشيء الكيِّفي لا بالضرورة إلى 'الجزء الأكثر أهمية'"

    - lemma: "رُكِيزَة"
      expands:
        - text: "«ما يرتكز عليه | والقطعة من جواهر الأرض المركوزة فيها»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: "المعنى اللغوي يدور حول الاتكاء والاستناد — قريب من 'الجزء الضروري' لكن ليس مرادفاً تاماً"
        - text: "«الراء والكاف والزاء أصلان: أحدهما إثبات شيء في شيء يذهب سفلاً، والآخر صوت. فالأول: ركزت الرمح ركزاً»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الغرز والتثبيت من الأسفل إلى الأعلى — صورة مجازية للدعامة لا للجزء الأهم"

    - lemma: "لُبّ"
      confirm:
        - text: "«من كل شيء خالصه وخياره ونفسه وحقيقته»"
          source: "المعجم الوسيط (مجموعة من المؤلفين)"
      expands:
        - text: "«اللام والباء. أصل صحيح يدل على لزوم وثبات، وعلى خلوص وجودة»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يجمع بين الثبات والخلوص — سمتان من سمات الجزء الأكثر أهمية، غير أن التركيز على النقاء والخلوص يُبعده عن دلالة الأهمية المُركَّزة"
        - text: "«اللب: باطن العقل الذي شأنه أن يلحظ الحقائق من الملحوظات»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الاستخدام الاصطلاحي للب = العقل الصافي يُثقل اللفظة بدلالة معرفية مستقلة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "أَسَاس"
      decision: confirmed
      decision_reason: >
        لمّة راسخة تدل على 'أصل كل شيء ومبدؤه وما يُقام عليه'، وهو تطابق دلالي تام مع
        المجموعة (الجزء الأكثر أهمية أو الضرورة). موثقة في المعاجم الكلاسيكية والحديثة،
        وتستعمل في السياق الحسي (أساس البناء) والمعنوي (أساس الفكرة) على حدٍّ سواء.
        تحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يميل إلى الدلالة على الأصل والمنشأ والجذر؛ يُستعمل كثيراً في السياقات المعنوية
        والمجردة (أساس الفكرة، أساس البحث، التعليم الأساسي). يُعبّر عن نقطة البداية التي
        ينطلق منها الشيء ويُبنى عليها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَسَاسٌ"

    - lemma: "قَاعِدَة"
      decision: confirmed
      decision_reason: >
        لمّة معجمية ثابتة تعني 'ما يقعد عليه الشيء أي يستقر ويثبت'، وهو معنى مطابق لمفهوم
        المجموعة. رغم تعدد دلالاتها الواسع، فإن الحسَّ الترادفي مع 'أساس' في معنى 'الجزء
        الضروري الثابت' موثَّق معجمياً وتُدرَج صراحةً في نفس المدخل لـ basis في ARABTERM.
        تحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أكثر ارتباطاً بالهيكل والبناء المادي والتنظيمي؛ تُستعمل في السياقات التقنية
        (قاعدة بيانات، قاعدة هندسية) والمنطقية (قاعدة نحوية، قاعدة فقهية). تُعبّر عن
        جانب الثبات والاستقرار والإحكام أكثر من جانب الأصالة والمنشأ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَاعِدَةٌ"

    - lemma: "صَمِيم"
      source: stage1
      decision: removed
      decision_reason: >
        الصميم يدل على الخلوص والنقاء والصلابة ('المحض الخالص')، لا على الجزء الأكثر
        أهمية أو ضرورة بصورة مباشرة. معنى 'صميم العضو: عظمه الذي به قوامه' قريب نسبياً
        غير أنه تشريحي خاص ولم يُثبَت كمصطلح مسكوك بهذا المعنى المجرد. أساس وقاعدة
        يُغنيان عنه.
      evidence_assessment:
        case: no_material

    - lemma: "جَوْهَر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن 'جوهر الشيء: حقيقته وذاته' قريب من المفهوم، فإن الثقل الفلسفي الغالب
        (الجوهر مقابل العَرَض في الفلسفة الكلاسيكية) يُحمِّل اللفظة دلالات تقنية تُبعدها
        عن المعنى المطلوب. كما أن 'essence' (المعادل الإنجليزي) يختلف عن 'basis/base'.
        أساس وقاعدة يُغنيان عنه.
      evidence_assessment:
        case: mixed

    - lemma: "رُكِيزَة"
      source: stage1
      decision: removed
      decision_reason: >
        الركيزة تدل على 'ما يُرتكز عليه' أي الدعامة والمسند، وهو جانب واحد من المعنى
        المطلوب لا يعادله تماماً. الاستخدام التقني الحديث المتنوع (ركيزة إنزيم في الكيمياء
        الحيوية، ركيزة هندسية) يُفقدها الخصوصية المطلوبة هنا.
      evidence_assessment:
        case: no_material

    - lemma: "لُبّ"
      source: stage1
      decision: removed
      decision_reason: >
        اللب يدل على 'خالص الشيء وحقيقته' وهو قريب من المفهوم، غير أنه يُركز على النقاء
        والخلوص لا على الأهمية والضرورة. الاستخدام الاصطلاحي للُبّ = العقل الصافي
        (في التراث الكلامي والتصوفي) يُضفي ثقلاً دلالياً مستقلاً. غير مثبت كمرادف
        معجمي لـ basis/base.
      evidence_assessment:
        case: mixed


