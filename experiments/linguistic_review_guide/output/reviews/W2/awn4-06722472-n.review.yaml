# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06722472-n
# the expression of disapproval
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «عَدَم رِضَا» تعبير وصفي حر وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ"
      - "التعريف العربي يستخدم كلمة «الاستهجان» وهي إحدى اللمّات، مما يُحدث دوراناً معجمياً"
    observations: "المجموعة تعبّر عن مفهوم التعبير عن عدم الموافقة بوصفه رسالة أو محتوى تواصلياً (hypernym: رسالة/مضمون). اللمّتان «استنكار» و«استهجان» مصطلحان عربيان أصيلان على وزن استفعال، بينما «عدم رضا» مركب سلبي وصفي لا يرقى إلى مرتبة المصطلح المعجمي الثابت."
  blind_candidates:
    - lemma: "اسْتِهْجَان"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من الجذر «هجن»، يدل على استقباح الشيء وعدم استحسانه، وهو تعبير مباشر عن الرفض القيمي"
    - lemma: "اسْتِنْكَار"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من الجذر «نكر»، يدل على عدم القبول والرفض، ويُستعمل كثيراً في سياق التعبير عن عدم الموافقة"
    - lemma: "تَنْدِيد"
      generation_method: ishtiqaq
      justification: "مصدر تفعيل من الجذر «ندد»، يدل على الشجب والتشهير، وهو ضرب من التعبير عن عدم الرضا والإدانة"
    - lemma: "اسْتِقْبَاح"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من الجذر «قبح»، يدل على عدّ الشيء قبيحاً ورفضه، وهو قريب دلالياً من الاستهجان"

stage2_evidence:
  per_lemma:
    - lemma: "اسْتِنْكَار"
      confirm:
        - text: "«(1) استنكار؛ استهجان (2) رَفْض.»"
          source: "المورد الحديث (2008) — ترجمة disapproval"
        - text: "«(1) شَجْب؛ استِنكار (2) اتِّهام؛ تبليغ [عن]؛ وشاية بِـ»"
          source: "المورد الحديث (2008) — ترجمة denunciation"
      expands:
        - text: "«النُّونُ وَالْكَافُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الْمَعْرِفَةِ الَّتِي يَسْكُنُ إِلَيْهَا الْقَلْبُ. وَنَكِرَ الشَّيْءَ وَأَنْكَرَهُ: لَمْ يَقْبَلْهُ قَلْبُهُ وَلَمْ يَعْتَرِفْ بِهِ لِسَانُهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على عدم القبول القلبي واللساني معاً، مما يؤكد ملاءمة المصطلح للتعبير عن عدم الموافقة"

    - lemma: "اسْتِهْجَان"
      confirm:
        - text: "«الاستهجان: الاستقباح»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«(1) لوم؛ نقد؛ استهجان (2) تقريع أو توبيخ رسمي (3) يلوم؛ ينتقد؛ يعيب؛ يستهجن.»"
          source: "المورد الحديث (2008) — ترجمة censure"
        - text: "«(1) استنكار؛ استهجان (2) رَفْض.»"
          source: "المورد الحديث (2008) — ترجمة disapproval"

    - lemma: "عَدَم رِضَا"
      contradicts:
        - text: "«الرَّاءُ وَالضَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ السُّخْطِ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "«عدم رضا» تعبير سلبي وصفي (نفي + اسم) وليس مصطلحاً معجمياً ثابتاً؛ لم يُعثر عليه مدخلاً مستقلاً في أي معجم"

    - lemma: "تَنْدِيد"
      confirm:
        - text: "«شَجْبٌ؛ استنكار.»"
          source: "المورد الحديث (2008) — ترجمة condemnation"
      expands:
        - text: "«(1) شَجْب؛ استنكار (2) رَفْضٌ (3) غضبٌ [من الله]؛ إخراج من زمرة الأبرار»"
          source: "المورد الحديث (2008) — ترجمة reprobation"
          addition: "التنديد أقوى دلالياً من مجرد عدم الموافقة، فيه معنى الشجب والإدانة العلنية"

    - lemma: "اسْتِقْبَاح"
      confirm:
        - text: "«الاستهجان: الاستقباح»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«وَقد يستهجن التَّصْرِيح بِشَيْء فَيتْرك ويختار الْكِنَايَة وَالرَّمْز إِلَيْهِ»"
          source: "دستور العلماء للأحمدنكري"
          addition: "الاستقباح مرادف تام للاستهجان عند الأحمدنكري، مما يجعل إضافتهما معاً تكراراً"

stage3_analysis:
  per_lemma:
    - lemma: "اسْتِنْكَار"
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل على وزن استفعال من جذر «نكر»، مؤكَّد في المورد الحديث ترجمةً لـ disapproval، ومستعمل في الفصحى المعاصرة استعمالاً واسعاً للتعبير عن عدم الموافقة والرفض."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على البُعد المعرفي-الإرادي (عدم القبول)، ويُستعمل في السياقات الرسمية والدبلوماسية والسياسية للتعبير عن رفض موقف أو فعل."
      actions: []

    - lemma: "اسْتِهْجَان"
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل على وزن استفعال من جذر «هجن»، معرَّف في دستور العلماء بـ«الاستقباح»، ومؤكَّد في المورد الحديث ترجمةً لـ disapproval وcensure."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على البُعد الجمالي-القيمي (عدّ الشيء قبيحاً أو هجيناً)، ويُستعمل للتعبير عن الرفض الذوقي أو الأخلاقي أكثر من الرفض السياسي."
      actions: []

    - lemma: "عَدَم رِضَا"
      decision: removed
      decision_reason: "تعبير وصفي حر مؤلف من نفي (عدم) واسم (رضا)، يفشل في اختبار السكّ — يمكن استبدال «رضا» بأي اسم آخر (عدم قبول، عدم موافقة) ويبقى التعبير صالحاً. لم يُعثر عليه مدخلاً مستقلاً في أي معجم عربي. ليس وحدة معجمية ثابتة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَنْدِيد"
      source: stage1
      decision: removed
      decision_reason: "التنديد يتضمن معنى الشجب والإدانة العلنية الشديدة، وهو أقوى دلالياً من مجرد «التعبير عن عدم الموافقة». ينتمي إلى مجموعة دلالية أخص (condemnation/denunciation) لا إلى مجموعة disapproval العامة."
      evidence_assessment:
        case: mixed

    - lemma: "اسْتِقْبَاح"
      source: stage1
      decision: removed
      decision_reason: "مرادف تام للاستهجان بنص دستور العلماء، فإضافته تكرار لا يُثري المجموعة. الأولوية للاستهجان لأنه أكثر شيوعاً وتداولاً."
      evidence_assessment:
        case: confirm_only

