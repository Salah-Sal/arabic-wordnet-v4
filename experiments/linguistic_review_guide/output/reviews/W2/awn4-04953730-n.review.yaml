# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'ملمس' مكتوبة بدون تشكيل كامل"
      - "اللمّة 'خاصية لمسية' مكتوبة بدون تشكيل، وهي مركب وصفي يحتاج إلى توثيق دلالي وصرفي"
      - "التعريف الحالي 'خاصية تدرك باللمس' موجز جداً: يفتقر إلى تمييز كافٍ ولا يوضح أنواع الخصائص اللمسية"
    observations: "المجموعة تُعبّر عن مفهوم 'الخاصية اللمسية' بوصفه فئةً من الخصائص الجوهرية تُدركها حاسة اللمس. اللمّتان الموجودتان — مَلْمَس وخاصية لمسية — تمثّلان مستويَين مختلفَين: الأولى مصطلح تطبيقي مسكوك، والثانية تعبير وصفي مجرد. الجذر 'لمس' خصيب اشتقاقاً في العربية، ومن المرجّح وجود مفردات كلاسيكية يمكن إحياؤها لإثراء المجموعة. التعريف الحالي يستحق المراجعة لتعميق الجنس القريب وإضافة التمييز."
  blind_candidates:
    - lemma: "مَلْمَس"
      generation_method: ishtiqaq
      justification: "من جذر لمس، على وزن مَفْعَل الدال على مكان الفعل أو مجراه؛ يعني ما يُلامَس ويُحسّ به من صفات الجسم. المصدر الاشتقاقي السليم للخاصية اللمسية، ويُبنى على قياس عربي أصيل."
    - lemma: "لَمْسِيَّة"
      generation_method: ishtiqaq
      justification: "من جذر لمس، المصدر الصناعي من النسبة 'لمسي' بإضافة تاء التأنيث والياء المشددة؛ يُعبّر عن الطابع اللمسي المجرد أو الخاصية المنسوبة إلى اللمس بوصفها مفهوماً كليّاً."
    - lemma: "مَجَسَّة"
      generation_method: ishtiqaq
      justification: "من جذر جسس، على وزن مَفْعَلة الدال على موضع الفعل أو حدثه؛ يعني ما يُجَسّ ويُستشعر بالتحسّس باليد أو الأصابع، إحياء لمعنى كلاسيكي دقيق في وصف الإحساس اللمسي."
    - lemma: "مَسِيس"
      generation_method: majaz
      justification: "من جذر مسس، على وزن فَعِيل؛ محاولة إحياء اللفظ بمعنى 'صفة ما يُمَسّ ويُدرك بالملامسة'، مجازاً عن الخاصية الحاصلة من الاتصال الجسدي."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة:
#  ١. مطابقة دقيقة دفعية (ملمس، الملمس، لمسية، اللمسية، مجسة، المجسة، مسيس، المسيس)
#  ٢. إثراء مُدمج (definitions + examples) بـ entry_ids من الاستعلام ١
#  ٣. الجسر الإنجليزي (tactile property, feel, texture, tactility, haptic, tactile)
#  ٤. FTS بكلمات مفتاحية (لمس، ملمس، لمسي، مجس)
#  ٥. عائلة جذر لمس من المعاجم الكلاسيكية
#  ٦. مقاييس اللغة — جذور لمس، مسس، جسس، خصص
stage2_evidence:
  per_lemma:
    - lemma: "ملمس"
      confirm:
        - text: "«يختلف مَلمس المنتجات النسيجية باختلاف نوع الألياف وبنية الخيوط وطريقة النسيج وغيرها من العوامل المحددة»"
          source: "مسرد صناعة النسيج — المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
        - text: "«ملمس السطح» = surface texture"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"
        - text: "«ملمس حريري: وصف للأقمشة التي تتميَّز بملمس ولمعان الحرير الطبيعيّ»"
          source: "مسرد صناعة النسيج — ARABTERM"
        - text: "«التأثيرات البارزة التي تتركها خامة التصوير» — ملمس (اللوحة) = texture"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
      contradicts:
        - text: "«(فى قانون المرافعات) المدَّعَى عليه فى الالتماس. (مج)»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (OCR)"
          conflict: "هذا تعريف للمصطلح القانوني 'الملمس' (بصيغة التعريف) بمعنى المدعى عليه في الالتماس؛ وهو معنى اصطلاحي مستقل لا صلة له بالخاصية اللمسية."
      expands:
        - text: "«اللَّامُ وَالْمِيمُ وَالسِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَطَلُّبِ شَيْءٍ وَمَسِيسِهِ أَيْضًا. اللَّمْسُ أَصْلُهُ بِالْيَدِ لِيُعْرَفَ مَسُّ الشَّيْءِ، ثُمَّ كَثُرَ ذَلِكَ حَتَّى صَارَ كُلُّ طَالِبٍ مُلْتَمِسًا»"
          source: "مقاييس اللغة لابن فارس (ت١٠٠٤م)"
          addition: "الجذر يدل على إدراك الشيء بالملامسة الجسدية، وهو الأصل الاشتقاقي السليم لمَلْمَس."

    - lemma: "خاصية لمسية"
      expands:
        - text: "«لَمْسِيّ: مختص بحاسة اللمس»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — ARABTERM"
          addition: "يُثبت توظيف 'لمسي' نعتاً اصطلاحياً في المصطلحات العلمية الحديثة."
        - text: "«أَشْعَارٌ لَمْسِيَّة» (tactile hairs)"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          addition: "يؤكد أن 'لمسية' نعتٌ مستخدَم للدلالة على ما ينتسب إلى اللمس في السياق العلمي."
        - text: "«تواصُل لمسي: يشترك هذا التواصل مع التواصل اللغوي ويظهر على سبيل المثال في كيفية اللمس»"
          source: "مسرد الإعلام والتواصل — ARABTERM"
          addition: "يُعزّز استخدام 'لمسي' صفةً مصطلحية منتجة في التراكيب الوصفية."

    - lemma: "لَمْسِيَّة"
      expands:
        - text: "«لَمْسِيَّة: من (ل م س) مؤنث لَمْسِي»"
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani"
          addition: "المعجم يُسجّل 'لمسية' بوصفها الصيغة المؤنثة للصفة النسبية 'لمسي' حصراً، لا اسماً مستقلاً."

    - lemma: "مَجَسَّة"
      confirm:
        - text: "«المجسّ. يقال: مَجسَّتُه حارَّةٌ»"
          source: "المعجم الكبير — مجمع اللغة العربية بالقاهرة (OCR)"
        - text: "«(المجسة) المجس (ج) مجاس»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998) — hawramani"
      expands:
        - text: "«دميئةُ ما تحت الثياب عَميمةٌ / هَضيمُ الحشا بكر المَجسَّة ثيِّبُ»"
          source: "المعجم الكبير — شاهد شعري لأبي صخر الهذلي"
          addition: "يُثبت توظيف 'المَجسَّة' في الشعر الكلاسيكي بمعنى ما يُحسّ عند الملامسة."
        - text: "«كيف ترى مَجسَّتها؟ فتقول: دالة على السمن»"
          source: "المعجم الكبير — شاهد استعمال"
          addition: "يُؤكد دلالة 'مَجسَّة' على الإحساس اللمسي الناتج عن الجسّ."
        - text: "«أفواهها مَجاسُّها»"
          source: "المعجم الكبير — مثل عربي"
          addition: "يُثبت التداول الاصطلاحي للكلمة في الموروث العربي."

    - lemma: "مَسِيس"
      contradicts:
        - text: "«مَسِيسُ الحاجةِ: إِلجاؤها»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (OCR)"
          conflict: "المعنى الموثّق لـ 'مسيس' في المعاجم مقيَّد بتعبير 'مسيس الحاجة' بمعنى الإلجاء والشدة، لا الخاصية اللمسية."
        - text: "«مَسِيس — الرأي: مرفوضة — لأنها لم ترد بهذا المعنى. الصواب: نحن في حاجة ماسة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "المعجم يُقيّد استخدام 'مسيس' خارج التعبير المعهود ويصفه بأنه محل جدل لغوي."


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "ملمس"
      decision: confirmed
      decision_reason: "اللمّة موثّقة توثيقاً وافياً في معاجم التخصص الحديثة (نسيج، كهرباء، تقنيات تربوية) بمعنى texture/tactile feel، وهي مشتقة اشتقاقاً صحيحاً من جذر لمس على وزن مَفْعَل. تجتاز اختبار السكّ (مَلْمَس ليس وصفاً حرّاً، بل مصطلح مسكوك). المعنى القانوني 'الملمس' (المدعى عليه في الالتماس) مقيّد بصيغة التعريف وسياق قانوني خاص ولا يلغي الدلالة اللمسية. تحتاج إضافة التشكيل الكامل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الطابع الحسّي الملموس لسطح الشيء أو مادته؛ مصطلح تطبيقي يُستخدم في وصف جودة الأقمشة والمواد والأسطح."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَلْمَس"

    - lemma: "خاصية لمسية"
      decision: confirmed
      decision_reason: "مركب وصفي (wasfi) موثّق في الاستخدام الاصطلاحي العلمي والطبي، يُستعمل للإشارة إلى فئة الخصائص اللمسية بصورة مجردة. يجتاز اختبار التثبيت المعجمي في سياق المصطلحات التخصصية. ملاحظة: لا يجتاز اختبار السكّ الصارم (يمكن استبدال 'لمسية' بـ'سمعية') لكنه يعمل وحدةً مصطلحية في الحقل العلمي. يحتاج إضافة التشكيل الكامل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تعبير وصفي مجرد أعمّ وأشمل من مَلْمَس؛ يُستخدم في السياقات العلمية والرسمية للإشارة إلى أي خاصية يمكن إدراكها باللمس دون تقييد بسطح أو مادة بعينها."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاصِّيَّة لَمْسِيَّة"

    - lemma: "لَمْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الأدلة تُثبت أن 'لمسية' هي الصيغة المؤنثة للصفة النسبية 'لمسي' لا اسماً مستقلاً. لا تجتاز اختبار السكّ (يمكن استبدالها بـ'سمعية' أو 'بصرية' في أي سياق). إدراجها كلمّة مستقلة يُوقع في الاشتراك النحوي مع الصفة."

    - lemma: "مَجَسَّة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي كلاسيكي موثّق في المعجم الكبير والوسيط بمعنى 'المجسّ وما يُحسّ عند التحسّس'، مشهود له بشواهد شعرية واستعمالية ومثل عربي. يملأ فراغاً أسلوبياً بالتعبير عن الإحساس اللمسي الإجرائي. يجتاز اختبار السكّ: 'مَجَسَّته حارة' لا يقبل الاستبدال الحرّ. يجتاز اختبار التثبيت المعجمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ كلاسيكي يُركّز على الإحساس اللمسي الناتج عن فعل الجسّ بالأصابع؛ أكثر إجرائية وأعمق في الأسلوب الأدبي والكلاسيكي."
      actions:
        - command: create_entry
          params: {lemma: "مَجَسَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَسِيس"
      source: stage1
      decision: removed
      decision_reason: "المعاجم المتعددة تُثبت أن 'مسيس' مقيَّد بتعبير 'مسيس الحاجة' بمعنى الإلجاء. معجم الصواب اللغوي يُحذّر من توسيع استخدامه خارج هذا التعبير. لا توجد أي شاهد على استخدامه دالاً على خاصية لمسية."


