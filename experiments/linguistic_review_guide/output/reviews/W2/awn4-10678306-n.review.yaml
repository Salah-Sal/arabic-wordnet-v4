      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "وَقُور"
      source: stage1
      decision: removed
      decision_reason: >
        «الوقور» يدلّ على الرزانة والكرامة والثقل، وهو مفهوم ذو إيحاء
        إيجابي راقٍ يختلف عن «يبدو غير مبالٍ بالعواطف» الذي ينطوي على
        قدر من التحفظ أو حتى الجمود. فضلاً عن ذلك، الوقور لا يشمل
        بالضرورة اللامبالاة بالعواطف بل الثبات أمام المواقف بشكل أعم.
      evidence_assessment:
