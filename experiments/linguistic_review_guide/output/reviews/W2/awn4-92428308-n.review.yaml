            new_lemma: "الطَّابَع السَّلَافِيّ"

    # ── مرشح المرحلة ١ — مقبول ──
    - lemma: "السَّلَافِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "المصدر الصناعي على وزن فَعَالِيَّة من الصفة النسبية هو النمط الأكثر دقةً ومباشرةً للدلالة على الجودة المجردة لكون الشيء سلافياً، قياساً على: العربية، الإسلامية، الرومانية، الجرمانية، الأمازيغية. اجتاز اختبار السكّ: المصدر الصناعي وحدة معجمية لا يمكن إبدال مكوّنه (-ية) بمرادف مع الحفاظ على الدلالة المجردة ذاتها. اجتاز فحص الاشتقاقية: الوزن صحيح لمفاهيم الانتماء الإثني-الثقافي. لا يوجد مدخل مباشر في القاعدة وهذا متوقع لأنه مصطلح حديث المسكّ"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المفهوم المجرد للانتماء السلافي بصورة أكثر تجريداً وشمولاً — أي على الخاصية في ذاتها بمعزل عن أيّ مظهر بعينه — وهو أدق تعبيراً عن المحتوى الدلالي للمجموعة (حالة أو جودة كون الشيء سلافياً)"
      actions:
        - command: create_entry
          params:
            lemma: "السَّلَافِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-92428308-n"

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "الهُوِيَّة السَّلَافِيَّة"
      source: stage1
      decision: removed
      decision_reason: "فشل اختبار السكّ: يمكن إبدال 'الهوية' بـ'الثقافة' أو 'الانتماء' أو 'الروح' مع بقاء التعبير وصفاً صالحاً → عبارة وصفية حرة لا مصطلح مسكوك. فضلاً عن أن دلالة 'الهوية' تنصبّ على الشخصية الجمعية لا على مجرد صفة الانتماء"

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "الأَصَالَة السَّلَافِيَّة"
      source: stage1
      decision: removed
      decision_reason: "فشل اختبار السكّ: يمكن إبدال 'الأصالة' بـ'العراقة' أو 'الجذور' أو 'التراث' → عبارة وصفية حرة. كما أن 'الأصالة' تُضيف دلالة التقييم الإيجابي (العراقة والنقاء) غير الموجودة في تعريف المجموعة الذي يصف الصفة المحايدة"


