      nuance_differentiation: "يُركِّز على الجانب الظاهر المُمَيِّز والسمة الغالبة في ما هو سلافي — أي على المظهر والطبع المتأصّل — مع إيحاء بالأثر والانطباع الذي تتركه هذه الهوية في الفكر أو الفن أو الثقافة"
      actions:
        - command: update_lemma
          params:
