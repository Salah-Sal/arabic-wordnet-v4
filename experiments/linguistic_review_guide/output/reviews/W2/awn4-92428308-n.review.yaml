# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-92428308-n  |  "الطابع السلافي" / Slavicness
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'الطابع السلافي' مركب وصفي قابل للتحليل إلى مكوّنَيه ('الطابع' + 'السلافي')، مما يجعله أقل تثبيتاً معجمياً من المصطلح الأحادي المسكوك"
      - "التعريف الحالي تكراري-ترجمي: 'حالة أو جودة كون الشيء سلافياً' لا يُضيف مضموناً معجمياً جديداً، إذ يُعيد صياغة السؤال بدلاً من الإجابة عنه — وهو ترجمة حرفية من الإنجليزية"
      - "غياب مرادف أحادي (مصدر صناعي) يدل على المفهوم المجرد مباشرةً"
      - "اللمّة خالية من التشكيل الكامل"
    observations: "المجموعة تمثّل مفهوماً ثقافياً-إثنياً مستورداً (Slavicness) لا جذر أصيل له في المعجم العربي الكلاسيكي؛ إذ إن 'السلاف' اسم معرَّب لشعوب أوروبية. اللمّة الموجودة 'الطابع السلافي' معبِّرة دلالياً بفضل دلالة الطابع على 'السمة المميزة والخلق الغالب'، غير أنها وصف تعبيري أكثر منها مصطلحاً مسكوكاً. المصدر الصناعي 'السلافية' هو الأدق في تصوير المفهوم المجرد للانتماء السلافي، وفق النمط الاشتقاقي المقرر في العربية المعاصرة لتأسيس المفاهيم الإثنية والثقافية (العربية، الإسلامية، الرومانية، الجرمانية، الفارسية)."
  blind_candidates:
    - lemma: "السَّلَافِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن فَعَالِيَّة من الصفة النسبية 'سلافي'، قياساً صرفياً على: العربية، الإسلامية، الرومانية، الجرمانية — يدل مباشرة على الحالة أو الجودة المجردة لكون الشيء سلافياً، مطابقٌ للمفهوم المجرد المطلوب تأطيره"
    - lemma: "الطَّابَع السَّلَافِيّ"
      generation_method: tarkib
      justification: "مركب وصفي (إضافي وصفي): الطابع بمعنى الخلق الغالب والسمة المميزة (المعجم الوسيط) + السلافي نسبةً إلى الشعوب السلافية — يعبّر عن الخاصية المميزة لما هو سلافي"
    - lemma: "الهُوِيَّة السَّلَافِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي: الهوية (الذات المميزة والانتماء الجماعي) + السلافية — يشير إلى مجموع الخصائص المميزة للانتماء السلافي في بُعده الهوياتي"
    - lemma: "الأَصَالَة السَّلَافِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي: الأصالة (الانتماء إلى الجذور الأولى والعراقة) + السلافية — يعبّر عن الجوهر الانتمائي السلافي في بُعده التاريخي"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفَّذة:
#   Q1: مطابقة دفعية لمكوّنات اللمّة + المرشحات (headword_norm IN)
#   Q2: الجسر الإنجليزي (translation_en:"Slavic" OR "Slavicness")
#   Q3: FTS عربي بكلمات "سلافي" و"سلافية" و"السلاف"
#   Q4: مقاييس اللغة لجذر طبع (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "الطَّابَع السَّلَافِيّ"
      expands:
        - text: "«الطَّابَع: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ. مُلْصَقٌ وَرَقِيٌّ بِرَسْمِ الدولة»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "يُثبت أن 'الطابع' بمعنى الخليقة والسجية (الخلق الغالب) لفظٌ معجمي راسخ، مما يُقوّي دلالة المركب 'الطابع السلافي' على الخاصية الغالبة"
        - text: "«(الطَّابَع) مَا يطبع به أو يختم والميسم والخلق الغالب»"
          source: "المعجم الوسيط (مجموعة من المؤلفين)"
          addition: "يؤكد أن معنى 'الخلق الغالب' و'الميسم المميز' هو أحد معاني الطابع الراسخة في المعاجم الحديثة"
        - text: "«(1) سلافيّ (2) اللغات السلافية»  [ترجمة: Slavic]"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن الصفة 'سلافيّ' مقبولة في المعجمية العربية الحديثة ترجمةً لـ Slavic، مما يُضفي شرعيةً على المكوّن النسبي في اللمّة المركبة"

    - lemma: "السَّلَافِيَّة"
      expands:
        - text: "«(1) سلافيّ (2) اللغات السلافية»  [ترجمة: Slavic]"
          source: "المورد الحديث (2008)"
          addition: "يُثبت وجود الأساس الاشتقاقي 'سلافيّ' في المعجمية العربية؛ وبوجود الصفة تصبح مشروعية المصدر الصناعي 'السلافية' قائمةً قياساً على الأنماط المعهودة"
      # ملاحظة: لا يوجد مدخل مباشر لـ'السلافية' كمصدر صناعي في القاعدة — وهو متوقع
      # نظراً لحداثة المصطلح وغرابة المفهوم عن التراث المعجمي الكلاسيكي

    - lemma: "الهُوِيَّة السَّلَافِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الأَصَالَة السَّلَافِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
