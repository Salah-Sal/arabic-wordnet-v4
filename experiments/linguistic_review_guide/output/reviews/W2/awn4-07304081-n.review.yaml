stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'متعة خاصة' هي عبارة وصفية (ترجمة حرفية للتعريف) وليست وحدة معجمية مسكوكة."
    observations: "المفهوم يشير إلى 'الحدث' أو 'الشيء' الذي يسبب السرور، وهو ما يطلق عليه في العربية 'المسرة' أو 'الطرفة' أو 'المتعة' بلفظها المجرد."
  blind_candidates:
    - lemma: "مَسَرَّة"
      generation_method: ishtiqaq
      justification: "اسم لما يُسَرُّ به المرء ويسبب له الفرح، وهي مطابقة دلالياً للتعريف."
    - lemma: "طُرْفَة"
      generation_method: majaz
      justification: "تطلق على كل شيء مستحدث عجيب يبعث على السرور، وتناسب وصف 'الحدث الخاص'."
    - lemma: "تُحْفَة"
      generation_method: majaz
      justification: "ما يُتحَف به الشخص من بِرٍّ أو لَطَف، وهو شيء نفيس يسبب البهجة والسرور."
    - lemma: "مَلَذَّة"
      generation_method: ishtiqaq
      justification: "اسم للمصدر الذي يسبب اللذة والاستمتاع."

stage2_evidence:
  per_lemma:
    - lemma: "متعة خاصة"
      evidence_status: "no_material_found"
    - lemma: "مَسَرَّة"
      confirm:
        - text: "«الفرح والبهجة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«السُّرُورُ؛ لِأَنَّهُ أَمْرٌ خَالٍ مِنَ الْحُزْنِ»"
          source: "مقاييس اللغة لابن فارس"
    - lemma: "طُرْفَة"
      confirm:
        - text: "«كل شيء مستحدث عجيب»"
          source: "المعجم الوسيط"
        - text: "«ما يُستحدثُ ويُستطابُ»"
          source: "المعجم الكبير"
    - lemma: "تُحْفَة"
      confirm:
        - text: "«الشيء الطريف النفيس يكرم به الإنسان»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«ما أُتحفت به الرجلَ من البِرِّ والألْطاف»"
          source: "المعجم الكبير"
    - lemma: "مُتْعَة"
      confirm:
        - text: "«ما يتمتع به من الصيد والطعام وغيرهما»"
          source: "المعجم الوسيط"
        - text: "«اسم لما يُتمتَّع ويُنتفع به»"
          source: "التعريفات الفقهية للبركتي"

stage3_analysis:
  per_lemma:
    - lemma: "متعة خاصة"
      decision: removed
      decision_reason: "عبارة وصفية وليست مصطلحاً معجمياً مفرداً."
    - lemma: "مُتْعَة"
      decision: confirmed
      decision_reason: "اللفظ الأصيل الذي يعبر عن الشيء الذي يُستمتع به، وهو أوقع من العبارة المركبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُتْعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07304081-n"}
    - lemma: "مَسَرَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر بدقة عن 'الحدث' (occurrence) الذي يسبب السرور."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَسَرَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07304081-n"}
    - lemma: "طُرْفَة"
      source: stage1
      decision: confirmed
      decision_reason: "تفيد معنى الجدة والبهجة الخاصة التي يتضمنها المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "طُرْفَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07304081-n"}
    - lemma: "تُحْفَة"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم للتعبير عن الشيء النفيس أو المفاجأة السارة التي تُقدم لشخص ما (treat)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تُحْفَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07304081-n"}

stage4_content:
  definition:
    current: "حدث يسبب سروراً أو بهجة خاصة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول لكنه يحتاج إلى صياغة معجمية أكثر رصانة."
    authored:
      - type: linguistic
        text: "ما يُمتَّعُ أو يُتحَفُ به المرءُ من أمرٍ سارٍّ أو مَلَذَّةٍ غيرِ معتادة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07304081-n", definition_index: 0, text: "ما يُمتَّعُ أو يُتحَفُ به المرءُ من أمرٍ سارٍّ أو مَلَذَّةٍ غيرِ معتادة."}
  examples:
    per_lemma:
      - lemma: "مُتْعَة"
        examples:
          - text: "كانت الرحلة إلى الجبل متعةً حقيقيةً لجميع أفراد العائلة."
            type: usage
      - lemma: "مَسَرَّة"
        examples:
          - text: "تلقي رسائل الأصدقاء القدامى مَسَرَّةٌ لا تُقدَّرُ بثمن."
            type: usage
      - lemma: "طُرْفَة"
        examples:
          - text: "حكى لنا الجدُّ طُرْفَةً من طُرَفِ رحلاته زادت من بَهجة السهرة."
            type: usage
      - lemma: "تُحْفَة"
        examples:
          - text: "كانت الحفلة المفاجئة تُحفةً أسعدت قلب المحتفى به."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-07304081-n", text: "زيارةُ المتاحف القديمة مَسَرَّةٌ لِمُحبِّي التاريخ."}

stage5_enrichment:
  per_entry:
    - lemma: "مُتْعَة"
      entry_id: "{auto}"
      root: "متع"
      maqayis_quote: "«الْمِيمُ وَالتَّاءُ وَالعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَنْفَعَةٍ وَامْتِدَادِ مُدَّةٍ فِي خَيْرٍ... وَالمُتْعَةُ وَالمَتَاعُ: المَنْفَعَةُ»"
    - lemma: "مَسَرَّة"
      entry_id: "{auto}"
      root: "سرر"
      maqayis_quote: "«السِّينُ وَالرَّاءُ... السِّرُّ: خَالِصُ الشَّيْءِ. وَمِنْهُ السُّرُورُ؛ لِأَنَّهُ أَمْرٌ خَالٍ مِنَ الْحُزْنِ»"
    - lemma: "طُرْفَة"
      entry_id: "{auto}"
      root: "طرف"
      maqayis_quote: "«الطَّاءُ وَالرَّاءُ وَالْفَاءُ... وَمِنَ الْبَابِ قَوْلُهُمْ لِلشَّيْءِ الْمُسْتَحْدَثِ: طَرِيفٌ... اطَّرَفْتُ الشَّيْءَ، إِذَا اسْتَحْدَثْتَهُ»"
    - lemma: "تُحْفَة"
      entry_id: "{auto}"
      root: "تحف"
      maqayis_quote: "«لم يرد هذا الجذر مستقلاً في مقاييس اللغة، ويُلحق بجذر (وحف) عند بعض المعجميين كأصل مفترض للموهبة واللطف.»"
  per_sense:
    - lemma: "مُتْعَة"
      sense_id: "{auto}"
      nuance: "تشير إلى الجانب الاستمتاعي والانتفاع بالشيء السار."
      mwe: false
    - lemma: "مَسَرَّة"
      sense_id: "{auto}"
      nuance: "تركز على الأثر النفسي للفرح والسرور الناتج عن الحدث."
      mwe: false
    - lemma: "طُرْفَة"
      sense_id: "{auto}"
      nuance: "تؤكد على عنصر الجِدّة والغرابة المحببة في الشيء السار."
      mwe: false
    - lemma: "تُحْفَة"
      sense_id: "{auto}"
      nuance: "تفيد معنى التكريم والاحتفاء بتقديم شيء نفيس أو سار."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"متع","maqayis":"«الْمِيمُ وَالتَّاءُ وَالعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَنْفَعَةٍ وَامْتِدَادِ مُدَّةٍ فِي خَيْرٍ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تشير إلى الجانب الاستمتاعي والانتفاع بالشيء السار.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-07304081-n"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "awn4-07304081-n"
        score: 0.9
