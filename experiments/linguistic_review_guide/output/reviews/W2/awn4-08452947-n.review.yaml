stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "نظام فرعي" تفتقر إلى التشكيل الكامل.
      - الحاجة إلى مرادفات إضافية تعكس غنى المصطلح التقني العربي (مثل "منظومة فرعية").
    observations: "المصطلح يعبر عن مفهوم تقني وهندسي راسخ، وهو ترجمة دقيقة للمصطلح الإنجليزي 'subsystem'. العلاقة بين النظام والفرع في العربية تعكس بجلاء علاقة الكل بالجزء."
  blind_candidates:
    - lemma: "نِظَامٌ فَرْعِيٌّ"
      generation_method: tarkib
      justification: "الترجمة الاصطلاحية المباشرة والأكثر شيوعاً للمصطلح 'subsystem' في السياقات العلمية والتقنية."
    - lemma: "مَنْظُومَةٌ فَرْعِيَّةٌ"
      generation_method: tarkib
      justification: "استناداً إلى المرادف 'منظومة' للنظام، وهو تعبير شائع في الأنظمة المعقدة."
    - lemma: "نُظَيِّمٌ"
      generation_method: ishtiqaq
      justification: "صيغة التصغير من 'نظام' للدلالة على نظام صغير كجزء من نظام أكبر (اشتقاق نظري)."
    - lemma: "نِظَامٌ جُزْئِيٌّ"
      generation_method: tarkib
      justification: "ترجمة حرفية تعتمد على وصف النظام بأنه 'جزء' من الكل، وتستخدم أحياناً في الفيزياء والرياضيات."

stage2_evidence:
  per_lemma:
    - lemma: "نظام فرعي"
      confirm:
        - text: "«نظام فرعيّ: مكوِّن واحد (مثل، منظم، حمل) أو مجموعة من مكونات عديدة متجانسة (مثل، المصفوفة الكهرضوئية والبطاريات) تدخل ضمن نظام للطاقة الشمسية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«نظام فرعي، <في الاعتمادية>»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«نظام فرعي (CL): محطة تعتبر جزءًا من نظام توليد وإرسال وتوزيع الكهرباء...»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "نظيم"
      contradicts:
        - text: "«(النظيم) المنظوم وَمن كل شَيْء مَا تناسقت أجزاؤه على نسق وَاحِد يُقَال نظيم من لُؤْلُؤ»"
          source: "المعجم الوسيط"
          conflict: "المصطلح في المعاجم اللغوية يعني الشيء المنظوم (اسم مفعول) ولا يشير إلى معنى النظام الفرعي التقني."
    - lemma: "نظام جزئي"
      evidence_status: "no_material_found"
    - lemma: "منظومة فرعية"
      expands:
        - text: "«أنظمة تشغيل فرعية لمنظومة إدارة النفايات الصلبة البلدية: تشمل الأجزاء المكونة للمنظومة التقنية والتشغيلية المتعلقة بإدارة النفايات...»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "استخدام الوصف 'فرعي' مع 'منظومة' يؤكد صحة التركيب الدلالي."

stage3_analysis:
  per_lemma:
    - lemma: "نظام فرعي"
      decision: confirmed
      decision_reason: "مصطلح تقني قياسي ومعتمد في المعاجم المتخصصة (ArabTerm) لترجمة subsystem."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَامٌ فَرْعِيٌّ"
    - lemma: "مَنْظُومَةٌ فَرْعِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق ومنسجم مع اللفظ 'منظومة' (Hypernym) ويستخدم في سياقات هندسية متكاملة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مَنْظُومَةٌ فَرْعِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نُظَيِّمٌ"
      source: stage1
      decision: removed
      decision_reason: "رغم صحة الاشتقاق الصرفي، إلا أنه غير متداول تقنياً ويصعب فهمه في هذا السياق."
    - lemma: "نِظَامٌ جُزْئِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "المصطلح 'فرعي' هو المستقر في التعريب التقني لكلمة sub-."

stage4_content:
  definition:
    current: "نظام يمثل جزءاً من نظام أكبر"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح ولكنه يحتاج صياغة أكثر دقة لبيان الوظيفة والتبعية."
    authored:
      - type: terminological
        text: "نظام وظيفي يمثل جزءاً من نظام أكبر وأكثر تعقيداً، ويساهم في تحقيق الوظائف الكلية لهذا النظام."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "نظام وظيفي يمثل جزءاً من نظام أكبر وأكثر تعقيداً، ويساهم في تحقيق الوظائف الكلية لهذا النظام."}
  examples:
    per_lemma:
      - lemma: "نِظَامٌ فَرْعِيٌّ"
        examples:
          - text: "يتكون محرك السيارة من عدة أنظمة فرعية كنظام التبريد ونظام حقن الوقود."
            type: usage
      - lemma: "مَنْظُومَةٌ فَرْعِيَّةٌ"
        examples:
          - text: "تتكامل المنظومة الفرعية للاتصالات مع المنظومة الرئيسية للقمر الصناعي لضمان إرسال البيانات."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يعتبر نظام التبريد في المفاعل النووي نظاماً فرعياً حيوياً لضمان سلامة المحطة."}

stage5_enrichment:
  per_entry:
    - lemma: "نِظَامٌ فَرْعِيٌّ"
      entry_id: "{auto}"
      roots:
        - word: "نظام"
          root: "نظم"
          maqayis_quote: "«النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتَأْلِيفِهِ، وَنَظَمْتُ الشِّعْرَ وَغَيْرَهُ. وَالنِّظَامُ: الْخَيْطُ يَجْمَعُ الْخَرَزَ.»"
        - word: "فرعي"
          root: "فرع"
          maqayis_quote: "«الْفَاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عُلُوٍّ وَارْتِفَاعٍ... وَالْفَرْعُ مِنَ الشَّجَرَةِ أَغْصَانُهَا.»"
    - lemma: "مَنْظُومَةٌ فَرْعِيَّةٌ"
      entry_id: "{auto}"
      roots:
        - word: "منظومة"
          root: "نظم"
          maqayis_quote: "«النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتَأْلِيفِهِ...»"
        - word: "فرعية"
          root: "فرع"
          maqayis_quote: "«الْفَاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عُلُوٍّ وَارْتِفَاعٍ...»"
