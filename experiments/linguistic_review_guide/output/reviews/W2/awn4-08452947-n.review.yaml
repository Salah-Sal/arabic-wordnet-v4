        key: note
        value: '{"roots":[{"word":"نظام","root":"نظم","maqayis":"«النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتَأْلِيفِهِ...»"},{"word":"فرعي","root":"فرع","maqayis":"«الْفَاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عُلُوٍّ وَارْتِفَاعٍ...»"}]}'
    - command: set_metadata
