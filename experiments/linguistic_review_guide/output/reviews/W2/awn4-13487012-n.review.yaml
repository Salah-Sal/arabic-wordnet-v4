stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «هضم» مكتوبة بلا تشكيل — يجب تحديثها إلى «هَضْم» بالتشكيل الكامل."
      - "التعريف الحالي يحتوي على تركيب ضعيف «يتم من خلالها» وهو من السمات الأسلوبية الركيكة في العربية المعاصرة، ولا يتوافق مع أسلوب المعجم الوسيط."
      - "المجموعة تضمّ لمّة واحدة فقط؛ ينبغي النظر في إضافة مرادفات مدعومة معجمياً لإثراء التمثيل."
      - "التعريف الطبي لا يذكر دور الهواضيم (الإنزيمات الهاضمة) وهو العنصر الفسيولوجي المميِّز."
    observations: >
      المجموعة ترادفية تمثّل مفهوم «الهضم» بوصفه عملية فسيولوجية عضوية تحوّل الطعام إلى مواد
      قابلة للامتصاص. الجذر هـ-ض-م عربيٌّ أصيل ذو تاريخ طبّي طويل في التراث العربي، وله
      حضور واسع في المعاجم الكلاسيكية والحديثة. التعريف الحالي وظيفيٌّ لكنّه يفتقر إلى الدقة
      الاصطلاحية والرقي الأسلوبي. اللمّة «هضم» متفرّدة في المجموعة ممّا يقلّص فرص تحليل
      التمايز الدلالي.

  blind_candidates:
    - lemma: "اِسْتِمْرَاء"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل «اسْتَمْرَأ» على وزن اسْتِفْعَال من الجذر م-ر-أ، ومعناه طلب مَرَاءة
        الطعام أي تحوّله إلى مادة نافعة يمتصّها البدن بيسر. واستمرأ الطعامَ: وجده مَرِيئاً
        سهل الهضم. المصدر يلتقط الجانب الغائي من العملية: تحوّل الغذاء إلى ما يمرأ في الجسم.

    - lemma: "اِسْتِحَالَة"
      generation_method: majaz
      justification: >
        مصدر «استحال» من الجذر ح-و-ل، ويعني التحوّل الجوهري من حال إلى حال. استخدمه
        الأطباء العرب القدامى (ابن سينا في القانون) للدلالة على انقلاب الطعام في المعدة إلى
        أخلاط. الإزاحة الدلالية هنا وظيفية: كما تستحيل المادة كيمياوياً، يستحيل الطعامُ
        بيولوجياً في الجهاز الهضمي.

    - lemma: "التَّحْوِيلُ الغِذَائِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (مصدر + نعت) يصف العملية من منظور وظيفي صريح: تحويل المادة الغذائية.
        يوازي التعريف العلمي الحديث الذي يركّز على «تحويل الطعام إلى مواد قابلة للامتصاص».
        نوع المركب: وصفي (wasfi).

    - lemma: "إِنْضَاج"
      generation_method: ishtiqaq
      justification: >
        مصدر «أَنْضَجَ» على وزن إِفْعَال من الجذر ن-ض-ج. وصف الأطباء العرب الهضمَ بأنّه
        «طبخ» الطعام بحرارة البدن الغريزية (ابن سينا: «الهضم إنضاج الغذاء بالحرارة الغريزية»)،
        فالمعدة «تنضج» الطعامَ كما تنضج النارُ الأكلَ. المجاز التشابهي قائم على الوظيفة
        الحرارية المشتركة.


