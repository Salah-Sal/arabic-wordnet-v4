# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "العملية العضوية التي يتم من خلالها تحويل الطعام إلى مواد يمكن امتصاصها في الجسم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يعاني من ثلاثة قصور: (١) «يتم من خلالها» صياغة ركيكة تكاد تكون
        ترجمة حرفية من الإنجليزية (by which)، (٢) «يمكن امتصاصها» تعبير وظيفي مقبول لكن
        يفتقر إلى الدقة المصطلحية (التمثيل = assimilation مفقود)، (٣) لا يُشير إلى دور
        الهواضيم التي هي المحرك الكيمياوي للعملية. تعريف المعجم الوسيط (OCR) أدقّ وأرقى
        أسلوباً.
    authored:
      - type: terminological
