# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10708307-n
# المفهوم: شخص يلحق أو يضم شيئاً بآخر (tagger/appender)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الإنجليزية tagger تعني عادةً من يُعلِّق بطاقات (tags) لا من يُلحق شيئاً بآخر بالمعنى العام؛ ثمة إشكال في دقة التعريف"
      - "التعريف العربي يستخدم فعل «يلحق» المشتق من نفس جذر اللمّة مُلْحِق — احتمال دوران جزئي"
      - "المفهوم نادر الاستعمال المستقل؛ يُعبَّر عنه عادةً بالفعل لا بالاسم"
    observations: "المجموعة تصف فاعل إلحاق أو ضمّ شيء بآخر. وزن مُفَعِّل (مُذَيِّل) ووزن مُفْعِل (مُلْحِق) كلاهما اسما فاعل منتظمان يدلّان على الحدث. المفهوم عام ويحتاج إلى تمييز بين اللمّتين الموجودتين بحسب طبيعة الإلحاق."
  blind_candidates:
    - lemma: "ضَامّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من ضَمَّ يَضُمُّ على وزن فاعِل، يدلّ على من يضمّ شيئاً إلى آخر، مطابق لعبارة «يضم شيئاً بآخر» في التعريف"
    - lemma: "وَاصِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من وَصَلَ على وزن فاعِل، بمعنى من يصل شيئاً بشيء آخر. قال ابن فارس: الواو والصاد واللام أصل واحد يدلّ على ضمّ شيء إلى شيء"
    - lemma: "رَادِف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رَدَفَ على وزن فاعِل، بمعنى من يُتبع شيئاً بآخر ويُلحقه به؛ من الردف وهو التابع"
    - lemma: "مُوصِّل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من وَصَّلَ (فعّل) على وزن مُفَعِّل، بمعنى من يوصّل الأشياء بعضها ببعض ويربطها"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُذَيِّل"
      confirm:
        - text: "«مُذَيِّلُ الكِتابِ: مَنْ وَضَعَ لَهُ ذَيْلاً, أَيْ ما يُلْحَقُ بِآخِرِهِ لِتَكْمِلَةِ نَقْصٍ أَوْ شَرْحٍ»"
          source: "المعجم الكبير"
        - text: "«ذيَّل المؤلِّفُ كِتابَهُ: أردفه بكلام كالتتمَّة له، كتب شيئًا في ذيله»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«الذَّالُ وَالْيَاءُ وَاللَّامُ أُصَيْلٌ وَاحِدٌ مُطَّرِدٌ مُنْقَاسٌ، وَهُوَ شَيْءٌ يَسْفُلُ فِي إِطَافَةٍ. مِنْ ذَلِكَ الذَّيْلُ ذَيْلُ الْقَمِيصِ وَغَيْرِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ذيل يدلّ على ما يتبع الشيء في أسفله، فالمُذَيِّل من يُضيف ذيلاً أي تتمة"

    - lemma: "مُلْحِق"
      confirm:
        - text: "«اللَّامُ وَالْحَاءُ وَالْقَافُ أَصْلٌ يَدُلُّ عَلَى إِدْرَاكِ شَيْءٍ وَبُلُوغِهِ إِلَى غَيْرِهِ. يُقَالُ: لَحِقَ فُلَانٌ فُلَانًا فَهُوَ لَاحِقٌ. وَأَلْحَقَ بِمَعْنَاهُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«إِنَّ عَذَابَكَ بِالْكُفَّارِ مُلْحِقٌ — قَالُوا: مَعْنَاهُ لَاحِقٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "مُلْحِق اسم فاعل من ألحق رباعي، يدلّ على من يُوصل شيئاً بغيره"
        - text: "«(فى القانون الدولى العام): اللَّحَق موظف يعيَّن فى سفارة الدولة للقيام بعمل خاص, كالملحق العسكرىِّ والملحق الثقافىِّ والصحافىِّ»"
          source: "المعجم الوسيط"
          addition: "المُلْحَق (بالفتح) اسم مفعول يدلّ على الشيء المُلحَق، أما مُلْحِق (بالكسر) فاسم فاعل يدلّ على من يقوم بالإلحاق"

    - lemma: "ضَامّ"
      contradicts:
        - text: "«النسيج الضامُّ (في الطب) Connective tissue: نسيجٌ رِخْوٌ يملأ الفراغاتِ بين الأنسجةِ والأعضاء»"
          source: "المعجم الكبير"
          conflict: "الاستعمال المعاصر يخصّص «ضامّ» للسياق الطبي (نسيج ضامّ) كصفة لا كاسم فاعل لشخص"
        - text: "«ضامَّ فلانٌ فلانًا مُضامَّةً وضِمامًا: قام معه فى أمرٍ واحدٍ»"
          source: "المعجم الكبير"
          conflict: "ضامَّ بتشديد الميم فعل مفاعلة يدلّ على المشاركة لا على الإلحاق الأحادي"

    - lemma: "وَاصِل"
      contradicts:
        - text: "«نظام ميكانيكي يمكن من إحداث وصل كهربائي بين جهازين أو نظامين كهربائيين»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          conflict: "واصِل في الاستعمال المصطلحي الحديث يدلّ على جهاز الوصل (connector) لا على شخص يضمّ الأشياء"
      expands:
        - text: "«وَاصِل — من (و ص ل) ضام الشيء وجامعه، والبار بغيره والمحسن إلى الأقربين»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المعنى الأصلي لواصل يشمل ضمّ الشيء وجمعه، لكنه غلب في صلة الرحم والوصل الاجتماعي"

    - lemma: "رَادِف"
      contradicts:
        - text: "«الرَّادِفُ: الذى يَجِيءُ القَوْمَ بِقِدْحِه بعدما اقتسموا الجَزورَ»"
          source: "المعجم الكبير"
          conflict: "الرادف في المعاجم شخص يأتي متأخراً لا من يُلحق شيئاً بآخر عمداً"
      expands:
        - text: "«رَادَفَ — اللَّفْظُ اللفظَ: قارَبَهُ, أَوْ ساواه في المعنى»"
          source: "المعجم الكبير"
          addition: "المرادفة اللفظية (الترادف) دلالة مختلفة عن إلحاق شيء مادي بآخر"

    - lemma: "مُوصِّل"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "مُذَيِّل"
      decision: confirmed
      decision_reason: "ثبت في المعجم الكبير ومعجم اللغة العربية المعاصرة بمعنى «من وضع ذيلاً لكتاب أو أردفه بتتمة»، وهو مطابق تماماً لمفهوم المجموعة. اسم فاعل منتظم من ذَيَّلَ (فعّل) على وزن مُفَعِّل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يتخصّص في إلحاق تتمة أو ذيل بنصّ أو كتاب، ويحمل دلالة التكملة والإتمام لا مجرد الضمّ المادي"
      actions: []

    - lemma: "مُلْحِق"
      decision: confirmed
      decision_reason: "اسم فاعل منتظم من أَلْحَقَ (أفعل) على وزن مُفْعِل، والجذر لحق أصل ثابت في مقاييس اللغة بمعنى إدراك شيء وإيصاله بغيره. لم يُعثر على مدخل معجمي مباشر لاسم الفاعل هذا بوصفه شخصاً، لكنه قياسي صرفياً ومفهوم دلالياً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ من مُذَيِّل، يدلّ على من يُوصل شيئاً بآخر أو يُضيفه إليه دون تخصيص بالنصوص أو الكتب"
      actions: []

    # ── مرشحات المرحلة ١ ──
    - lemma: "ضَامّ"
      source: stage1
      decision: removed
      decision_reason: "غلب استعمال «ضامّ» في السياق الطبي (النسيج الضامّ) كصفة تقنية، ولم يُعثر على استعمال له بمعنى شخص يضمّ أشياء. كما أن الفعل ضامَّ (مفاعلة) يدلّ على المشاركة لا الإلحاق الأحادي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "وَاصِل"
      source: stage1
      decision: removed
      decision_reason: "واصِل في الاستعمال المصطلحي المعاصر يدلّ على جهاز الوصل (connector)، وفي الاستعمال التراثي يغلب معنى صلة الرحم والبرّ. ليس مستعملاً بمعنى شخص يُلحق شيئاً بآخر."
      evidence_assessment:
        case: mixed

    - lemma: "رَادِف"
      source: stage1
      decision: removed
      decision_reason: "الرادف في المعاجم هو من يأتي تالياً أو يركب خلف غيره، لا من يُلحق شيئاً بآخر عمداً. الدلالة سلبية (التأخر) لا إيجابية (الإلحاق الفاعل)."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُوصِّل"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على دليل معجمي يدعم استعمال مُوصِّل بمعنى شخص يضمّ أشياء. الاستعمال المعاصر يخصّصه للموصّل الكهربائي أو ناقل الأشياء."
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
