# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06699481-n
# approval / commendation — استحسان / موافقة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان بدون تشكيل"
      - "«استحسان» مصطلح أصولي فقهي في المقام الأول، وقد يُلبس على المستخدم"
      - "«موافقة» تدل على القبول والإذن أكثر من التعبير عن رأي إيجابي كرسالة"
      - "التعريف العربي ترجمة مباشرة من الإنجليزية ويحتاج إلى إعادة صياغة بأسلوب معجمي"
    observations: >
      المجموعة تقع تحت فئة الرسائل (message) في الشبكة الدلالية، أي أنّ المقصود هو
      خطاب أو نصّ يُعبِّر عن رأي حَسَن في شيء أو شخص. اللمّتان الموجودتان تؤدّيان
      المعنى العامّ للاستحسان والقبول لكنّهما لا تُبرزان البُعد الرسالي (كونه خطاباً مكتوباً
      أو منطوقاً). يُفتقر إلى لمّة تدلّ صراحةً على الخطاب المادح كـ«تقريظ».
  blind_candidates:
    - lemma: "تَقْرِيظ"
      generation_method: ishtiqaq
      justification: >
        من جذر «قرظ»، على وزن تَفْعِيل. يدلّ على المدح والثناء الكتابيّ على شخص أو عمل،
        وهو أقرب اللمّات إلى مفهوم «رسالة تعبّر عن رأي إيجابي» لأنّه يحمل بُعد الكتابة والتأليف.
    - lemma: "إِشَادَة"
      generation_method: ishtiqaq
      justification: >
        من جذر «شيد»، على وزن إِفَالَة (إِفْعَالَة). تُستعمل في العربية المعاصرة بمعنى
        المدح والتنويه العلنيّ بجهود شخص أو جهة، وتحمل بُعد الإعلان والتبليغ.
    - lemma: "تَزْكِيَة"
      generation_method: ishtiqaq
      justification: >
        من جذر «زكو»، على وزن تَفْعِلَة. تدلّ على التوصية بالشخص والشهادة بعدالته
        وصلاحه، وفيها معنى التعبير الإيجابي عن المرء كرسالة توصية.
    - lemma: "إِطْرَاء"
      generation_method: ishtiqaq
      justification: >
        من جذر «طري»، على وزن إِفْعَال. يدلّ على المدح والثناء البالغ، وقد يُستخدم
        للتعبير عن رسالة تحمل رأياً إيجابياً في شخص أو عمل.


stage2_evidence:
  per_lemma:
    - lemma: "اسْتِحْسَان"
      confirm:
        - text: "«الاستحسان: في اللغة: هو عدّ الشيء واعتقاده حسناً»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«(الِاسْتِحْسَان) (فِي الِاصْطِلَاح) ترك الْقيَاس وَالْأَخْذ بِمَا هُوَ أرْفق للنَّاس»"
          source: "المعجم الوسيط"
        - text: "«(1) استحسان (2) إجازة؛ إقرارٌ؛ تصديق على — approbation»"
          source: "المورد الحديث"
      expands:
        - text: "«الاستحسان: هو العدول بحكم المسألة عن نظائرها لدليل خاصّ»"
          source: "المعجم الكبير"
          addition: "يوسّع الدلالة الاصطلاحية الفقهية للاستحسان"
        - text: "«موافَقَة؛ استحسان؛ تصديق على — approval»"
          source: "المورد الحديث"
          addition: "يربط الاستحسان بالموافقة والتصديق في سياق الترجمة"
        - text: "«هتاف ابتهاج أو استحسان»"
          source: "المورد الحديث"
          addition: "يُظهر استعمال الاستحسان في سياق التعبير الشفهي العلني"

    - lemma: "مُوَافَقَة"
      confirm:
        - text: "«قبول طلب أو رأي — approbation; Approval»"
          source: "مسرد الإعلام والتواصل (أليكسو)"
        - text: "«إبداء القبول كتابةً أو مشافهةً تجاه شيء — consent»"
          source: "مسرد الإعلام والتواصل (أليكسو)"
        - text: "«موافقة، تصديق، إقرار — approval»"
          source: "المعجم الموحد لمصطلحات القانون"
      expands:
        - text: "«المُوَافقة: اعْتِقَاد حقّية الْأَمر»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يُظهر بُعداً اعتقادياً للموافقة يتجاوز القبول الإجرائي"
        - text: "«بَاب الْمُوَافقَة على الأمر: وَافقه وحالفه وصافاه وخالطه»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
          addition: "يُبيّن الحقل الدلالي الواسع للموافقة: مصافاة، مخالطة، إعجاب"

    - lemma: "تَقْرِيظ"
      confirm:
        - text: "«(1) مقال. وبخاصة: تقريظ؛ مقال تقريظيّ — write-up»"
          source: "المورد الحديث"
      expands:
        - text: "«(1) إدراك (2) قَدْرُ الشيء حقَّ قَدْره (3) إعجاب (4) تقريظ — appreciation»"
          source: "المورد الحديث"
          addition: "يربط التقريظ بالإعجاب والتقدير"

    - lemma: "إِشَادَة"
      evidence_status: "no_material_found"

    - lemma: "تَزْكِيَة"
      contradicts:
        - text: "«التَّزْكِيَة: ضدّ الْجرْح»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "التزكية مصطلح حديثي يدلّ على تعديل الرواة لا على التعبير عن رأي إيجابي عامّ"
        - text: "«التزكية: هي تعديل الشهود يعني قول المزكِّي: هو عدلٌ»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "مقصورة على تعديل الشهود في الفقه"
      expands:
        - text: "«تَزْكِيَة: من (ز ك و) تأدية الزكاة، وتطهير الشيء وتنميته وإصلاحه، والمدح والثناء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "تُشير إلى معنى المدح لكنّه فرعيّ وليس الأساسي"

    - lemma: "إِطْرَاء"
      contradicts:
        - text: "«الإطراء: المبالغة في المدح ومجاوزة الحدّ فيه أو مدح الإنسان بأحسن ما فيه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الإطراء يحمل دلالة المبالغة والإفراط، بينما المجموعة تتحدث عن رأي إيجابي متّزن"


stage3_analysis:
  per_lemma:
    - lemma: "اسْتِحْسَان"
      decision: confirmed
      decision_reason: >
        لفظ عربي فصيح من جذر «حسن» على وزن استفعال، يدلّ لغةً على عدّ الشيء حسناً
        والتعبير عن القبول. رغم غلبة الاستعمال الفقهي عليه، فإنّ المعنى اللغوي العامّ
        (الاستحسان = إبداء الرضا والقبول) موثّق في المعجم الوسيط والمورد الحديث.
        يُقابل «approbation» في الترجمة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ على الحكم الذاتي بأنّ الشيء حَسَن، أي هو موقف تقييمي ذهني يُعبَّر عنه.
        أقرب إلى approbation منه إلى approval الإجرائي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِحْسَان"

    - lemma: "مُوَافَقَة"
      decision: confirmed
      decision_reason: >
        لفظ فصيح شائع من جذر «وفق»، يدلّ على القبول والإذن والرضا. موثّق في
        المعاجم الحديثة والمتخصّصة بمعنى approval و consent. يُكمل الاستحسان
        بإضافة بُعد القبول الرسمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تدلّ على القبول والإقرار الرسمي أو العملي، أي هي فعل إداري أو اجتماعي
        أكثر منها حكم تقييمي. أقرب إلى approval/consent.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَافَقَة"

    - lemma: "تَقْرِيظ"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ عربي فصيح من جذر «قرظ» على وزن تَفْعِيل، يدلّ تحديداً على المدح والثناء
        المكتوب على شخص أو عمل. وهو الأقرب إلى دلالة المجموعة «رسالة تعبّر عن
        رأي إيجابي» لأنّه يحمل بُعد الكتابة والتأليف (مقال تقريظيّ). موثّق في المورد
        الحديث بمعنى appreciation/write-up.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ تحديداً على الخطاب أو المقال المكتوب في مدح شخص أو كتاب أو عمل.
        هو أخصّ من الاستحسان والموافقة لأنّه رسالة مادح بعينها. يُقابل commendation.
      actions:
        - command: create_entry
          params:
            lemma: "تَقْرِيظ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إِشَادَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلّة معجمية في قاعدة البيانات. وإن كانت شائعة في الاستعمال المعاصر
        فإنّ غياب التوثيق المعجمي يمنع إدراجها دون تثبّت.

    - lemma: "تَزْكِيَة"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُظهر أنّ التزكية مصطلح فقهي/حديثي بالدرجة الأولى (تعديل الرواة
        والشهود)، ومعناها العامّ (التطهير والتنمية) بعيد عن دلالة الرسالة الإيجابية.
        لا تصلح بديلاً دلالياً دقيقاً في هذه المجموعة.

    - lemma: "إِطْرَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الإطراء يحمل دلالة المبالغة ومجاوزة الحدّ في المدح وفقاً للمناوي، بينما المجموعة
        تتحدث عن رأي إيجابي متوازن. الفارق الدلالي كبير.


