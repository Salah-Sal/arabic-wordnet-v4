      nuance: >
        المصطلح العربي الاشتقاقي، يُبرز جانب التشابه المتبادل والتماثل البنيوي.
        مُقيَّد في شواهده المعجمية بمجال تقانات الأغذية. أقل انتشاراً من 'تماكب'
        في الكيمياء العامة.
      mwe: false
    - lemma: "تَمَاكُب"
      sense_id: "{auto}"
      nuance: >
        المصطلح الكيميائي والصيدلاني الأكثر انتشاراً في معاجم ALECSO الموحّدة.
        هو المصطلح المرجَّح في التعليم الكيميائي العربي الرسمي والدراسات
        الكيميائية والصيدلانية والتغذوية.
      mwe: false
    - lemma: "تَصَاوُغ"
      sense_id: "{auto}"
      nuance: >
