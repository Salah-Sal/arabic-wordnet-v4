# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    - lemma: "إِيزُومِيرِيَّة"
      entry_id: "{auto}"
      # مُعرَّبة — لا جذر عربي
      note: "مصطلح معرَّب من isomerism، لا يُستخرج له جذر عربي ثلاثي"

    - lemma: "تَزَامُر"
      entry_id: "{auto}"
      root: "زمر"
      maqayis_quote: >
        «الزَّاءُ وَالْمِيمُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى قِلَّةِ الشَّيْءِ،
        وَالْآخَرُ جِنْسٌ مِنَ الْأَصْوَاتِ. فَالْأَوَّلُ الزَّمَرُ: قِلَّةُ الشَّعَرِ ...
        وَأَمَّا الزُّمْرَةُ فَالْجَمَاعَةُ، وَهِيَ مُشْتَقَّةٌ مِنْ هَذَا لِأَنَّهَا إِذَا
        اجْتَمَعَتْ كَانَتْ لَهَا جَلَبَةٌ وَزِمَارٌ»

    - lemma: "تَمَاكُب"
      entry_id: "{auto}"
      # جذر تماكب غير موثَّق في المقاييس؛ مصطلح اصطلاحي مُحدث
      note: "مصطلح كيميائي مُحدث، جذره غير موثَّق في المقاييس الكلاسيكية"

    - lemma: "تَصَاوُغ"
      entry_id: "{auto}"
      root: "صوغ"
      maqayis_quote: >
        «الصَّادُ وَالْوَاوُ وَالْغَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ تَهْيِئَةٌ عَلَى شَيْءٍ
        عَلَى مِثَالٍ مُسْتَقِيمٍ. مِنْ ذَلِكَ قَوْلُهُمْ: صَاغَ الْحَلْيَ يَصُوغُهُ صَوْغًا.
        وَهَمَا صَوْغَانِ، إِذَا كَانَ كُلُّ وَاحِدٍ مِنْهُمَا عَلَى هَيْئَةِ الْآخَرِ»

  per_sense:
    - lemma: "إِيزُومِيرِيَّة"
      sense_id: "{auto}"
      nuance: >
        يُمثِّل الطرف المُعرَّب الأصيل في المصطلحية العربية، يصل القارئ العربي
        بالمصطلح الأجنبي الأم. يُفضَّل في الأدبيات المُترجَمة والأوساط الأكاديمية
        ذات الصلة بالتراث الأجنبي.
      mwe: false
    - lemma: "تَزَامُر"
