# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى الموجودة ──
    - lemma: "إيزوميرية"
      decision: confirmed
      decision_reason: >
        المصطلح مُثبَت في المعجم الموحّد للكيمياء (1992) والمورد الحديث (2008) كترجمة
        لـ isomerism. التعريب هو الملاذ الأخير لمصطلح ذي صيغة عالمية، وقد استوفى شروط
        القبول: يقبل لام التعريف والنسبة (إيزوميري) والجمع (إيزوميريات).
        يفتقر إلى التشكيل الكامل فيتطلب تحديث اللمّة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: taarib
        verdict: مقبول — مصطلح عالمي لا بديل اشتقاقي راسخ في معظم المعاجم
      morphological_fit: >
        مصدر صناعي من أصل أجنبي + ياء النسبة + تاء التأنيث، وهو قياسي
        في التعريب العربي الحديث للمفاهيم المجردة.
      nuance_differentiation: >
        يُمثِّل الطرف الأجنبي الأصيل في المصطلحية العربية، يُفضَّل في الأدبيات
        العلمية المُترجَمة وفي السياقات التي تُراعى فيها الصلة بالمصطلح الأجنبي.
        أقلّ انتشاراً في المعاجم الموحّدة مقارنةً بـ'تماكب' و'تصاوغ'.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيزُومِيرِيَّة"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "تزامر"
      decision: confirmed
      decision_reason: >
        مصطلح عربي مشتق على وزن تَفَاعُل من جذر (ز م ر)، مُثبَت في المعجم الموحّد
        لتقانات الأغذية (ALECSO، 2004) كترجمة مباشرة لـ isomerism. وزن تَفَاعُل
        يُعبِّر عن الاشتراك والتماثل بين طرفين وهو ملائم دلالياً. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: ishtiqaq_arabi
        verdict: مقبول — مشتق عربي أصيل
      morphological_fit: >
        وزن تَفَاعُل للمصدر يدلّ على الاشتراك والتشابه المتبادل، وهو ملائم
        للإيزوميرية التي تقوم على التشابه البنيوي بين جزيئتَيْن.
      nuance_differentiation: >
        يُمثِّل التصنيف الاشتقاقي العربي الصرف لمفهوم الإيزوميرية. مُقيَّد
        نسبياً بمجال تقانات الأغذية في الشاهد المعجمي الموجود.
        يُبرز جانب التشابه والتماثل أكثر مما يُبرز جانب التباين البنيوي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَزَامُر"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَزَامُرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استخدام هذا الشكل. مصدر صناعي متكلَّف يزيد على 'تزامر'
        بلا ضرورة دلالية — إذ يُعبِّر 'تزامر' بمفرده عن الحالة والظاهرة. اختبار
        الترادف يُثبت عدم وجود فرق دلالي بين 'تزامر' و'تزامرية'.
      evidence_assessment:
        case: no_material

    - lemma: "تَمَاثُل جُزَيْئِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        فشل اختبار السكّ: يمكن إبدال 'جزيئي' بـ'ذري' أو 'هيكلي' وتبقى العبارة
        صحيحة كوصف. ليس وحدة معجمية ثابتة بل عبارة وصفية حرة. لم يرد في أي
        معجم اصطلاحي كمصطلح مسكوك. فضلاً عن ذلك، قد يُلبَّس بمفهوم
        'التماثل الجزيئي' (molecular symmetry) المختلف عن الإيزوميرية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── لمّات إضافية مكتشفة في المرحلة ٢ (غير مدرجة في AWN4) ──
    - lemma: "تَمَاكُب"
      decision: confirmed
      decision_reason: >
        المصطلح الأكثر شيوعاً في معاجم ALECSO الكيميائية والصيدلانية والغذائية.
        مُثبَت في ستة معاجم موحّدة على الأقل. إدراجه في AWN4 ضروري لتغطية
        المفردة الاصطلاحية المعتمدة في أوسع نطاق تخصصي عربي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الكيميائي والصيدلاني الأكثر انتشاراً في المعاجم الموحّدة.
        يحتمل أن يكون المصطلح الرئيسي في التعليم الكيميائي العربي.
        يُبرز جانب التوازي والتكافؤ البنيوي بين الجزيئات.
      actions:
        - command: create_entry
          params:
            lemma: "تَمَاكُب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَصَاوُغ"
      decision: confirmed
      decision_reason: >
        مصطلح طبي معتمد في المعجم الطبي الموحّد (2009) لـ isomerism، مع شواهد
        على أنواع متعددة منه (تصاوغ هندسي، بصري، نووي، بنيوي، إلخ). يمتاز
        بأن جذره العربي 'صوغ' يحمل في مقاييس اللغة عبارة "وَهَمَا صَوْغَانِ إِذَا
        كَانَ كُلُّ وَاحِدٍ مِنْهُمَا عَلَى هَيْئَةِ الْآخَرِ" — وهي تعريف معجمي تراثي
        مطابق تماماً للإيزوميرية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الطبي المعتمد، ذو السند التراثي الأقوى دلالياً من مقاييس اللغة.
        يُعبِّر عن الاشتراك في الصورة والهيئة مع التباين في الترتيب — وهو
        الجوهر الدلالي للإيزوميرية. أكثر دقةً معجميةً من 'تزامر' وأكثر أصالةً
        من 'إيزوميرية'.
      actions:
        - command: create_entry
          params:
            lemma: "تَصَاوُغ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


