# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "التعريف الحالي يحتوي على دوران طفيف: استُخدم 'متزامراً' في تعريف المصطلح 'تزامر'"
      - "عبارة 'مجمع الظواهر' في التعريف ركيكة أسلوبياً ولا تناسب الكتابة المعجمية الدقيقة"
      - "غياب المصطلح الكيميائي الأكثر شيوعاً في معاجم ALECSO وهو 'تماكب'"
      - "غياب المصطلح الطبي المعتمد 'تصاوغ' الذي يحظى بسند معجمي ممتاز من مقاييس اللغة"
    observations: >
      المجموعة تُعالج مفهوم الإيزوميرية (isomerism) وهو ظاهرة كيميائية حديثة لا جذر لها
      في التراث العربي القديم. سلكت AWN4 مسارَيْن: التعريب (إيزوميرية) والاشتقاق (تزامر).
      غير أن المعاجم الاصطلاحية الموحّدة للغة العربية (ALECSO) تعتمد بصفة رئيسية مصطلحَيْ
      'تماكب' و'تصاوغ'، مما يُشير إلى نقص في تغطية AWN4. جذر 'صوغ' يحمل في مقاييس اللغة
      دلالةً مطابقة تماماً للإيزوميرية ("وَهَمَا صَوْغَانِ إِذَا كَانَ كُلُّ وَاحِدٍ مِنْهُمَا
      عَلَى هَيْئَةِ الْآخَرِ")، مما يجعل 'تصاوغ' أقوى المرشحات دلالياً.

  blind_candidates:
    - lemma: "تَزَامُر"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفَاعُل من جذر (ز م ر)، يُعبِّر عن التشابه الهيكلي والتماثل
        البنيوي بين الجزيئات. وزن تَفَاعُل ملائم للمفاهيم التي تُعبِّر عن الاشتراك
        والتماثل بين طرفين، وهو ما يُلائم تعريف الإيزومير.
    - lemma: "تَزَامُرِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من 'تزامر' بإضافة ياء النسبة وتاء التأنيث، يُجرِّد الحالة
        ويُضفي عليها الطابع المفهومي المجرّد الملائم لمفاهيم الكيمياء النظرية.
    - lemma: "إِيزُومِيرِيَّة"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الأجنبي isomerism، يقبل لام التعريف (الإيزوميرية)
        والنسبة (إيزوميري) والجمع السالم (إيزوميريات). مبرَّر لأن المصطلح العالمي
        ذو صيغة معتمدة في الأوساط العلمية الدولية.
    - lemma: "تَمَاثُل جُزَيْئِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي-إضافي من 'تماثل' (التشابه الهيكلي) + 'جزيئي' (نسبة إلى الجزيء).
        يُعبِّر عن الظاهرة بوصف تحليلي مباشر. غير أن اختبار السكّ يكشف ضعفه:
        يمكن إبدال 'جزيئي' بـ'ذري' ويبقى الوصف منطقياً، مما يدلّ على أنه ليس
        وحدة معجمية ثابتة.


