# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «تصلب العظام» خاطئة: مصطلح «تصلب العظم» يرد في المعجم الطبي الموحَّد بمعنى osteosclerosis (تصلب عظمي عام)، وهو مفهوم مختلف جوهرياً عن الاستعاجة (eburnation) التي تختصُّ بداء المفاصل التنكسيّ."
      - "لمّة «تعاج» غير موثَّقة في أيٍّ من المعاجم الطبية أو اللغوية المعتمدة، وبنيتها الصرفية غير محدَّدة."
      - "المصطلح المعتمد في المعاجم الطبية الموحَّدة «استعاجة» غائبٌ كلياً عن المجموعة."
    observations: >
      يُعبِّر المصطلح الإنجليزي eburnation عن تحوُّل مَرَضيٍّ محدَّد يصيبُ سطحَ العظم المفصليّ حين
      يتآكلُ الغضروفُ فوقه، فيصبح العظمُ كثيفاً ناعماً ذا بريقٍ يُشبه العاج. أجادت المعاجم الطبية
      العربية صياغةَ «اسْتِعَاجَة» على وزن الاستفعال من الاسم الجامد «عاج»، وهو وزنٌ منتجٌ للدلالة
      على التحوُّل نحو حالةٍ مستجدَّة. كذلك يرد «تعجُّج» في المورد الحديث بمعنى صيرورة العظم قاسياً
      كالعاج. في المقابل، «تصلب العظام» أعمُّ دلالةً، و«تعاج» مستحدَثٌ بلا سند معجمي.
  blind_candidates:
    - lemma: "اِسْتِعَاجَة"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن الاستفعال (اسْتِفْعَلَة) من الاسم الجامد «عاج» (ناب الفيل) بمعنى اتخاذ حالة العاج؛ وهو الوزن الأنسب للدلالة على التحوُّل المَرَضيّ نحو حالة جديدة (نظيره: استنوق، استأسد). لا يكرِّر دوراناً لأن «عاج» غير وارد لفظاً في التعريف."
    - lemma: "تَعَجُّجٌ"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن التفعُّل من الجذر «عجج» المضعَّف؛ وزن «تفعُّل» يدلُّ على الصيرورة التدريجية، والجذر «عجج» يُوحي بالكثافة والارتفاع مما يُناسب التحوُّل إلى القوام العاجيّ الكثيف."
    - lemma: "تَصَلُّبٌ عَاجِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع «تصلُّب» (مصدر دالٌّ على الصيرورة) و«عاجيّ» (نسبة إلى العاج)، يُميِّز هذا النوع من التصلُّب بوصفه عاجيَّ القوام."
    - lemma: "تَعَيُّجٌ"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن التفعُّل من جذر «عيج» (الإقبال والاكتراث — ابن فارس)، معامَلاً «عاج» جذراً معتلَّ العين (ع-ي-ج) للدلالة على تحوُّل العظم نحو القوام العاجيّ."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تصلب العظام"
      contradicts:
        - text: "«تَصَلُّبُ العَظْمِ — osteosclerosis»"
          source: "المعجم الطبي الموحد (2009) — entry_id: 620556"
          conflict: "يدلُّ «تصلب العظم» في المعاجم الطبية على osteosclerosis (ازدياد كثافة العظم عموماً)، وهو مفهوم أعمُّ وغير مخصَّص لتحوُّل العظم إلى مادة عاجية في الداء التنكسيّ."
        - text: "«تَصَلُّبُ العَظْمِ وَتَلَيُّفُ النِّقْي (تَصَلُّبُ النِّقْي) — osteosclerosis myelofibrosis»"
          source: "المعجم الطبي الموحد (2009) — entry_id: 620560"
          conflict: "يدلُّ على مرض مختلف تماماً عن الاستعاجة."

    - lemma: "تعاج"
      evidence_status: "no_material_found"

    - lemma: "اِسْتِعَاجَة"
      confirm:
        - text: "«اسْتِعاجَة (تحول العظم إلى عاج) — eburnation»"
          source: "المعجم الطبي الموحد (2009) — entry_id: 571386"
        - text: "«استعاجة: زيادة في كثافة جزء من العظم حتى يصبح مثل العاج، ويرى ذلك في التهاب المفاصل الحرضي.»"
          source: "معجم المصطلحات الطبية ج.2 (2003) — entry_id: 737106"
      expands:
        - text: "«اسْتِعاجَةٌ سِنِّيَّة — dental eburnation»"
          source: "المعجم الطبي الموحد (2009) — entry_id: 571387"
          addition: "وجود صيغة مركَّبة مستعملة يُثبت ثبات المصطلح وقابليته للتوسُّع التركيبيّ."
        - text: "«اسْتِعاجَة — eburnitis»"
          source: "المعجم الطبي الموحد (2009) — entry_id: 571389"
          addition: "ورود المصطلح في دلالة مجاورة (eburnitis) يُثبت توطُّنه في المعجمية الطبية العربية."

    - lemma: "تَعَجُّجٌ"
      confirm:
        - text: "«التَّعَجُّج: صيرورة العظم قاسيًا كالعاج.»"
          source: "المورد الحديث (2008) — entry_id: 685238"
      expands:
        - text: "«(تعجج) مُطَاوع عجَجَه»"
          source: "المعجم الوسيط لمجمع اللغة العربية (1998) — entry_id: 890991"
          addition: "يُثبت وجود الفعل «عجَّجَ» ومطاوعه «تعجَّجَ» في المعجم الوسيط مما يُعضِّد بناء المصدر «تعجُّج» ويُسبغ عليه الاطِّراد الصرفيّ."

    - lemma: "تَصَلُّبٌ عَاجِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "تَعَيُّجٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تصلب العظام"
      decision: removed
      decision_reason: >
        المصطلح «تصلب العظم» موثَّق في المعاجم الطبية الموحَّدة بمعنى osteosclerosis، وهو مختلفٌ جوهرياً
        عن الاستعاجة (eburnation). تصلُّب العظام يشمل أيَّ ازدياد في الكثافة العظمية بأسباب متعددة، بينما
        الاستعاجة ظاهرةٌ نوعية تختصُّ بمفصل المريض بالداء التنكسيّ وتستلزم مشابهةً عاجيةً واضحة.
        إسناد لمّة عامة لمفهوم خاص خطأٌ دلاليٌّ لا يجوز.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تعاج"
      decision: removed
      decision_reason: >
        لا وجود للمّة «تعاج» في أيٍّ من المعاجم المستعلَمة. بنيتها الصرفية مبهمة: إن قُدِّرت مصدر
        تفاعَلَ من عاج فالمتوقَّع «تعاوُج» لا «تعاج»، وإن كانت منقوصاً (تعاجٍ) فذلك يستدعي تصريحاً.
        المصطلح الطبي المعتمد في المعاجم الموحَّدة هو «استعاجة».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اِسْتِعَاجَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّقة في معجمين طبيين معتمدَين بمعنى eburnation بالضبط. الوزن الصرفي (اسْتِفْعَالَة من الاسم
        الجامد «عاج») ناجحٌ ومطَّردٌ في المصطلحية الطبية، قابلٌ للجمع (استعاجات) والنسبة (استعاجيّ)
        والتوسُّع التركيبيّ (استعاجة سنيّة). اجتازت اختبار التثبيت المعجمي بنجاح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الرسمي الأوفر شيوعاً في المعاجم الموحَّدة؛ يُبرز الطابعَ الاستحالي للعملية (اتخاذ حالة العاج) مع التضمين الضمني للنتيجة المرضية الثابتة. الأنسب للكتابة الطبية الرسمية."
      actions:
        - command: create_entry
          params:
            lemma: "اِسْتِعَاجَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13491890-n"

    - lemma: "تَعَجُّجٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَتٌ في المورد الحديث (2008) بتعريف مباشر «صيرورة العظم قاسياً كالعاج» = eburnation.
        يزيده رسوخاً ورودُ مطاوعه «تعجَّج» في المعجم الوسيط مما يُثبت إنتاجية الجذر في هذا المحور.
        اجتاز اختباري الاشتقاقية والتداول.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الطابعَ التدريجيَّ للتحوُّل (وزن تفعُّل يُفيد الصيرورة التدريجية)؛ أكثر تعبيراً عن الجانب الديناميكيّ للعملية، وأقلُّ رسمياً من «استعاجة». مناسبٌ للسياق التعليمي والوصف التشريحيّ."
      actions:
        - command: create_entry
          params:
            lemma: "تَعَجُّجٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13491890-n"

    - lemma: "تَصَلُّبٌ عَاجِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا سند معجمي له. لم يجتز اختبار السكِّ: يمكن إبدال «عاجيّ» بـ«يشبه العاج» أو «كالعاج» دون
        أن يتوقف التعبير عن كونه وصفاً حراً، مما يكشف أنه ليس مصطلحاً مسكوكاً. تغني عنه «استعاجة».

    - lemma: "تَعَيُّجٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود له في أي مصدر معجمي. الجذر «عيج» في المقاييس يدلُّ على الإقبال والاكتراث لا على
        الخصائص العاجيّة. تغني عنه «اِسْتِعَاجَة» الأصحُّ اشتقاقاً والأوثقُ توثيقاً.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
stage4_content:
  definition:
    current: "تغيير يحدث في أمراض المفاصل التنكسية حيث يتحول العظم إلى مادة ناعمة كثيفة تشبه العاج"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي قريبٌ من ترجمة حرفية للإنجليزية. يفتقر إلى: (أ) وصف طبيعة التحوُّل المرضيّ
        (pathological change)، (ب) تحديد الموضع (السطح المفصليّ)، (ج) الإشارة إلى البريق العاجيّ
        المميَّز، (د) تقديم «كثيفة» على «ناعمة» وفق الأسلوب المعجميّ الطبيّ المناسب.
    authored:
