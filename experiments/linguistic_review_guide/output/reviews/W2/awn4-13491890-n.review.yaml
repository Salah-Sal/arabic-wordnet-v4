        text: "تَحَوُّلٌ مَرَضيٌّ يُصيبُ سطحَ العظمِ المفصليِّ في داء المفاصل التنكسيّ، يتحوَّلُ فيه العظمُ إلى مادةٍ كثيفةٍ ناعمةٍ ذاتِ بريقٍ يُشبهُ العاجَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
