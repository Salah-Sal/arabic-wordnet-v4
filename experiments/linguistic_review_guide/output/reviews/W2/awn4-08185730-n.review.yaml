      confirm:
        - text: "«العالم الثالث: الدول النامية أو المتنامية مجتمعةً.»"
          source: "المورد الحديث (2008)"
        - text: "«مؤتمر وزراء إعلام دول العالم الثالث»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
    - lemma: "الدُّوَل النَّامِيَة"
      confirm:
        - text: "«...وعن طريق هذا التعاون يُمكن مُساعدة الدول النامية والدول الصناعية الحديثة في بناء تنميتها المُستدامة...»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«...ولا سيما الدول النامية - تحرص على الإفادة منهم في مجالات النهضة الصناعية.»"
          source: "المعجم الكبير (مادة ألم)"
    - lemma: "دُوَل الجَنُوب"
      confirm:
        - text: "«...وتأمين حقوق المنتجين والعمال المهمشين، وخاصة في دول الجنوب.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
    - lemma: "العَالَم النَّامِي"
      confirm:
        - text: "«...تتولَّى مسئولية برامج الزراعة والغذاء على مستوى دول العالم النامي والمتقدِّم...»"
          source: "معجم اللغة العربية المعاصرة"

