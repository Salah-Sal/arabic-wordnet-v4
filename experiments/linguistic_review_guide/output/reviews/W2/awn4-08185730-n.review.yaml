stage4_content:
  definition:
    current: "الدول النامية وغير المتطورة في آسيا وأفريقيا وأمريكا اللاتينية مجتمعة"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أكثر إحكاماً وشمولاً للسياق الجيوسياسي."
    authored:
      - type: encyclopedic
        text: "مجموعة الدول النامية في آسيا وأفريقيا وأمريكا اللاتينية، التي تشترك في ظروف اقتصادية واجتماعية وتاريخية متشابهة، وتقع خارج نطاق الدول الصناعية المتقدمة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08185730-n", definition_index: 0, text: "مجموعة الدول النامية في آسيا وأفريقيا وأمريكا اللاتينية، التي تشترك في ظروف اقتصادية واجتماعية وتاريخية متشابهة، وتقع خارج نطاق الدول الصناعية المتقدمة."}
  examples:
    per_lemma:
      - lemma: "العَالَم الثَّالِث"
        examples:
          - text: "تعاني كثير من دول العالم الثالث من تزايد الديون الخارجية وصعوبة الوصول إلى الأسواق العالمية."
            type: usage
      - lemma: "الدُّوَل النَّامِيَة"
        examples:
          - text: "تسعى الدول النامية إلى تحديث بنيتها التحتية لجذب الاستثمارات الأجنبية المباشرة."
            type: usage
      - lemma: "دُوَل الجَنُوب"
        examples:
          - text: "أكد المؤتمر على أهمية التعاون الفني بين دول الشمال ودول الجنوب لتحقيق التنمية المستدامة."
            type: usage
      - lemma: "العَالَم النَّامِي"
        examples:
          - text: "يلعب العالم النامي دوراً متزايداً في صياغة السياسات الاقتصادية العالمية المعاصرة."
