stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
      - "الاكتفاء بلمة واحدة لمفهوم غني بالمترادفات الاصطلاحية في العربية المعاصرة."
    observations: "المفهوم سياسي واقتصادي بامتياز، تبلور في سياق الحرب الباردة، وله في العربية عدة تعابير اصطلاحية مستقرة تشمل الجوانب الجغرافية (الجنوب) والاقتصادية (النمو) والسياسية (العالم الثالث)."
  blind_candidates:
    - lemma: "العَالَم الثَّالِث"
      generation_method: tarkib
      justification: "المصطلح الأكثر شيوعاً وعالمية للدلالة على هذه المجموعة من الدول."
    - lemma: "دُوَل الجَنُوب"
      generation_method: tarkib
      justification: "مصطلح جيوسياسي حديث يقابل 'دول الشمال' المتقدمة."
    - lemma: "الدُّوَل النَّامِيَة"
      generation_method: tarkib
      justification: "مصطلح اقتصادي يركز على الحالة التنموية للدول."
    - lemma: "العَالَم النَّامِي"
      generation_method: tarkib
      justification: "تعبير مركب يجمع بين مفهوم 'العالم' ككتلة والصفة التنموية."

stage2_evidence:
