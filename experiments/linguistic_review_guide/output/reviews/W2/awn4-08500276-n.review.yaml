      decision_reason: "النسبة القياسية المفضلة تاريخيا (أَذَرِيّ) للدلالة على من ينتمي لأذربيجان وعرقها، وجمعها يعبر بشكل سليم عن المجموعة العرقية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
