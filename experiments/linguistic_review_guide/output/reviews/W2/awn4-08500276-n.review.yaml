stage1_review:
  assessment:
    concerns:
      - "اللمتان (أذربيجانيون) و(أذريون) بصيغة الجمع، وهو مقبول ومطرد في سياق المجموعات العرقية، لكنهما تفتقران إلى التشكيل الكامل."
    observations: "تاريخيا، النسبة الصحيحة لأذربيجان هي (أَذَرِيّ) بفتح الذال كما نص عليه ياقوت الحموي والزبيدي، بينما (أَذْرَبِيجَانِيّ) هي النسبة الحديثة المستعملة على نطاق واسع. كلتا اللمتين تدلان بدقة على المجموعة العرقية المعنية، واستخدام الجمع يعبر عن الشعب أو القوم."
  blind_candidates:
    - lemma: "أَذَرِيُّون"
      generation_method: taarib
      justification: "جمع النسبة (أَذَرِيّ) القياسية والمفضلة قديما لبلاد أذربيجان، وتطلق على الشعب ككل."
    - lemma: "أَذْرَبِيجَانِيُّون"
      generation_method: taarib
      justification: "جمع النسبة الحديثة والشائعة لجمهورية أذربيجان."
    - lemma: "شَعْبُ أَذْرَبِيجَان"
      generation_method: tarkib
      justification: "مركب إضافي يعبر صراحة عن المجموعة العرقية المنتمية لتلك المنطقة."
    - lemma: "القَوْمِيَّةُ الأَذَرِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يعبر عن الانتماء العرقي والقومي للمجموعة."

stage2_evidence:
  per_lemma:
    - lemma: "أذريون"
      confirm:
        - text: "«الأَذْرِيُّ: المنسوب إلى أذْرَبيجان»"
          source: "المعجم الكبير"
      expands:
        - text: "«أَذْرَبِيْجان ... والنِّسْبَةُ إِلَيْهَا أَذَرِيٌّ، محرَّكة، وأَذربيّ»"
          source: "تاج العروس لمرتضى الزبيدي"
    - lemma: "أذربيجانيون"
      confirm:
        - text: "«أَذْرَبِيجَان ... قال النّحويون: النسبة إليه أذريّ، بالتحريك، وقيل: أذري بسكون الذال، لأنه عندهم مركب من أذر وبيجان، فالنسبة إلى الشطر الأول، وقيل أذربي»"
          source: "معجم البلدان لياقوت الحموي"
    - lemma: "شعب أذربيجان"
      evidence_status: "no_material_found"
    - lemma: "القومية الأذرية"
      evidence_status: "no_material_found"

