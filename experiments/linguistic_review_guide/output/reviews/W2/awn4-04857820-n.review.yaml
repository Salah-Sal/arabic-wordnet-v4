    - lemma: "فِسْق"
      source: stage1
      confirm:
        - text: "«الفِسْقُ: التَّرْكُ لأَمْرِ اللهِ تعالى، والعِصْيانُ، والخُروجُ عن طَرِيقِ الحَقِّ، أو الفُجور»"
          source: "القاموس المحيط للفيروزآبادي (ت. 1414)"
