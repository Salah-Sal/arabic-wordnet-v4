        - text: "«هيئة حاصلة للنفس بها تباشر عموماً على خلاف الشرع والمروة»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الفُجور: هو هيئة حاصلة للنفس بها يُباشر أموراً على خلاف الشرع والمُروءة»"
          source: "التعريفات الفقهية للبركتي (ت. 1975)"
        - text: "«(1) فُسوق؛ فُجور (2) عمل لاأخلاقيّ»"
          source: "المورد الحديث (2008) — ترجمة لـ immorality"
      expands:
