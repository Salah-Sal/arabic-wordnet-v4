      sense_id: "{auto}"
      nuance: >
        يدل على الانبعاث في المعاصي حتى يصير هيئةً راسخةً في النفس، مع إبراز خرق الحياء
        والمروءة والديانة معاً (من فجَر = شقّ). يجمع الانحراف الأخلاقي والديني والاجتماعي.
    - lemma: "اِنْحِلَال أَخْلَاقِيّ"
      sense_id: "{auto}"
      nuance: >
