# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «لا أخلاقية» تعتمد نمط النفي الإنجليزي (im- = لا) وهي تركيبة حديثة لا تجري على أوزان العربية الكلاسيكية"
      - "لمّة «انحلال أخلاقي» وصفٌ حر أشبه بعبارة تعريفية منه بمصطلح مسكوك ثابت، ويدل أصلاً على عملية التراجع لا على الصفة المجردة"
      - "جميع اللمّات مكتوبة بلا تشكيل، مما يُعيق الضبط الصرفي ويُشكّل لبساً في البحث المعجمي"
      - "التداخل الدلالي بين اللمّات الثلاث غير موثَّق؛ لم يُسجَّل ما يميّز كلًّا منها عن الأخريين"
    observations: >
      المجموعة تدور حول مفهوم «اللاأخلاقية» بوصفه صفةً مجرّدة تُعبِّر عن الخروج على معايير السلوك
      القويم. هذا المفهوم راسخ في التراث العربي الإسلامي بألفاظ قرآنية وفقهية متعددة أدقّ وأثبت
      من الرصيد الحالي: فالفجور والفسق والإثم كلٌّ منها يُجسِّد جانباً من هذا المعنى. اللمّات الحالية
      تجمع بين قديم مأثور (فجور) وحديث مستحدث (لا أخلاقية) ومصطلح وصفي (انحلال أخلاقي)، دون
      التمييز بينها. يُلاحَظ غياب مصطلح «فسق» الذي هو الأكثر تداولاً في هذا السياق في المعجمية
      العربية الكلاسيكية والحديثة على حدٍّ سواء.

  blind_candidates:
    - lemma: "فِسْق"
      generation_method: ishtiqaq
      justification: >
        من جذر (ف س ق) على وزن فِعْل المصدري الدال على الحدث والحالة؛ أصل الجذر الخروج من
        الشيء (فسقت الرطبة = خرجت من قشرها)، وقد جرى اشتقاق معنى الانحراف الأخلاقي عن هذا
        الأصل بإزاحة دلالية داخلية واضحة. المصطلح قرآني راسخ يدل على الخروج عن دائرة الطاعة
        الأخلاقية والدينية.
    - lemma: "رَذَالَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (ر ذ ل) على وزن فَعَالَة الدال على الصفة الثابتة؛ الجذر يعني الانحطاط عن مستوى
        الجودة، والمصطلح قد يُستخدم للدلالة على الانحطاط الأخلاقي بوصفه خروجاً عن مستوى
        السلوك المقبول.
    - lemma: "دَنَاءَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (د ن أ) على وزن فَعَالَة؛ الجذر يدل على القِصَر والانحطاط في المنزلة، وقد نُقل
        إلى الانحطاط الأخلاقي. قابل للتداول في سياقات الذم الخُلُقي.
    - lemma: "خُبْث"
      generation_method: majaz
      justification: >
        من جذر (خ ب ث) بمعنى خلاف الطيب؛ الجذر أصله في فساد الطعام وخبثه، ثم نُقل مجازاً
        إلى فساد الطبع والأخلاق، وقد استُعمل بهذا المعنى في الحديث النبوي الشريف («إذا كثر الخبث»
        أي الفسق والفجور). إحياء هذا الاستعمال المجازي القديم يجنّب الاشتراك مع الألفاظ المعاصرة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
