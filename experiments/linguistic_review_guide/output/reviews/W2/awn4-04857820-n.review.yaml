        - text: "«الاسم من الخباثة / الكُفْرُ / الشرُّ / الزِّنَى والفسقُ»"
          source: "المعجم الكبير"
          addition: "يربط الجذر بالفسق والزنى ضمن معنى الشر العام"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "انحلال أخلاقي"
      decision: confirmed
      decision_reason: >
        مُركَّب إضافي وصفي موثَّق في المعجمية الحديثة مرادفاً لمفهوم immorality؛ يجتاز اختبار
        التثبيت المعجمي لأنه يرد في المورد الحديث وحدةً وظيفية، وإن كان أقرب إلى الدلالة على
        الحالة التراجعية (الانهيار التدريجي) منه إلى الصفة المجردة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على بُعد الديناميكية والتفكّك التدريجي للمنظومة الأخلاقية (dissolution)، بينما يدل
        فجور على الهيئة الراسخة في النفس، وفسق على الحدث الواقع (الخروج).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْحِلَال أَخْلَاقِيّ"

    - lemma: "فجور"
      decision: confirmed
      decision_reason: >
        لمّة كلاسيكية راسخة، موثَّقة في أمهات المعاجم الفقهية واللغوية بمعنى «الهيئة الحاصلة للنفس
        بها تُباشَر الأمور على خلاف الشرع والمروءة». أقوى لمّة في المجموعة دلالياً وتراثياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على الانبعاث في المعاصي حتى يصير طابعاً راسخاً في النفس مع إبراز جانب خرق الحياء
        والمروءة (من أصل فجَر = شقّ الشيء). يجمع الخروج على الدين والمجتمع معاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُجُور"

    - lemma: "لا أخلاقية"
      decision: confirmed
      decision_reason: >
        موثَّقة في مصادر معيارية حديثة (ALECSO - القانون والاجتماع) بوصفها مقابلاً معتمداً لـ
        immorality. التركيبة حديثة لكنها مقنَّنة في المعجمية التقنية. ثمة تذبذب في الرسم بين المصادر
        (لا خلقية / لا أخلاقية) يستوجب التوحيد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: >
        مصطلح تقني حديث ذو طابع قانوني واجتماعي، يُستخدم للدلالة على انتفاء الصفة الأخلاقية كلياً
        على نمط بادئة النفي (im-) الإنجليزية. لا يحمل ظلال التراث الفقهي كفجور وفسق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَا أَخْلَاقِيَّة"

    - lemma: "فِسْق"
      source: stage1
      decision: confirmed
      decision_reason: >
        لمّة قرآنية كلاسيكية بالغة الشيوع، موثَّقة توثيقاً واسعاً في المعجمية العربية بمعنى الانحراف
        عن الطاعة الأخلاقية والدينية. تُرجِمت إلى immorality في المورد الحديث، وتُكمِّل فجور بتركيزها
        على بُعد المخالفة الدينية. إضافتها تُثري المجموعة دلالياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على البُعد الديني للانحراف (الخروج عن أمر الله)، مما يجعله أكثر ارتباطاً بمنظومة
        الفقه الإسلامي. يدل على فعل الخروج ويتضمن بُعداً دينياً لا يوجد في «انحلال أخلاقي».
      actions:
        - command: create_entry
          params:
            lemma: "فِسْق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رَذَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر (ر ذ ل) يدل على الانحطاط في الطبقة والجودة العامة لا على الانحراف الأخلاقي
        تحديداً. التعريف المعجمي دوراني (رذالة = رذال)، ولم يُوجَد نص يُثبت استخدامها في
        المجال الأخلاقي بمعنى immorality.

    - lemma: "دَنَاءَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم توجد أدلة معجمية تربطها بمفهوم المجموعة. والجذر (د ن أ) يدل على انحطاط الهمة والأصل
        والمنزلة لا على الانحراف عن المعايير الأخلاقية بشكل مباشر.

    - lemma: "خُبْث"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى الفقهي المستقر والراسخ لخبث هو النجاسة الحقيقية الحسية؛ وإن وُجد الاستعمال المجازي
        بمعنى الفسق والفجور فهو ثانوي في المعجمية. إدراجه في المجموعة سيُحدث التباساً مع السياقات
        الفقهية الطهارية التي تستخدمه بصرف عن الأخلاق.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
