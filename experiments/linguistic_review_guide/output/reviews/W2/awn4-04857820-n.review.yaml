      expands:
        - text: "«لا خلقية» — ترجمة لـ immorality"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
          addition: >
            يرد المصطلح بصيغة مختلفة (لا خلقية) في مسرد الاجتماع مقابل الصيغة القانونية
