          addition: "يُبرز البُعد النفسي الشهواني في مفهوم الفجور بوصفه انحرافاً عن التوازن"
        - text: "«ثم كثر هذا حتى صار الانبعاث والتفتح في المعاصي فجوراً. ولذلك سُمِّي الكذب فجوراً. ثم كثر هذا حتى سُمِّي كل مائل عن الحق فاجراً»"
          source: "مقاييس اللغة لابن فارس (ت. 1004)"
          addition: "يكشف عن الأصل الاشتقاقي (التفتح والانبعاث) ومساره الدلالي نحو المخالفة الأخلاقية"

    - lemma: "لا أخلاقية"
