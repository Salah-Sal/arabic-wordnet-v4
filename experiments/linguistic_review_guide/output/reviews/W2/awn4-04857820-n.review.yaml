# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "فُجُور"
      entry_id: "{auto}"
      root: "فجر"
      maqayis_quote: >
        «الْفَاءُ وَالْجِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّفَتُّحُ فِي الشَّيْءِ...
        ثُمَّ كَثُرَ هَذَا حَتَّى صَارَ الِانْبِعَاثُ وَالتَّفَتُّحُ فِي الْمَعَاصِي فُجُورًا.
        وَلِذَلِكَ سُمِّيَ الْكَذِبُ فُجُورًا. ثُمَّ كَثُرَ هَذَا حَتَّى سُمِّيَ كُلُّ مَائِلٍ
        عَنِ الْحَقِّ فَاجِرًا»

    - lemma: "اِنْحِلَال أَخْلَاقِيّ"
      entry_id: "{auto}"
      roots:
        - word: "انحلال"
          root: "حلل"
          maqayis_quote: "لم يُعثَر على مدخل الجذر (حلل) في مقاييس اللغة ضمن البيانات المتاحة"
        - word: "أخلاقي"
          root: "خلق"
          maqayis_quote: >
            «الْخَاءُ وَاللَّامُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا تَقْدِيرُ الشَّيْءِ،
            وَالْآخَرُ مَلَاسَةُ الشَّيْءِ... وَمِنْ ذَلِكَ الْخُلُقُ، وَهِيَ السَّجِيَّةُ،
            لِأَنَّ صَاحِبَهُ قَدْ قُدِّرَ عَلَيْهِ»

    - lemma: "لَا أَخْلَاقِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "لا"
          root: "حرف نفي"
          maqayis_quote: "لا (حرف نفي) — لا ينطبق عليها منهج مقاييس الجذور"
        - word: "أخلاقية"
          root: "خلق"
          maqayis_quote: >
            «الْخَاءُ وَاللَّامُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا تَقْدِيرُ الشَّيْءِ،
            وَالْآخَرُ مَلَاسَةُ الشَّيْءِ... وَمِنْ ذَلِكَ الْخُلُقُ، وَهِيَ السَّجِيَّةُ،
            لِأَنَّ صَاحِبَهُ قَدْ قُدِّرَ عَلَيْهِ»

    - lemma: "فِسْق"
      entry_id: "{auto}"
      root: "فسق"
      maqayis_quote: >
        «الْفَاءُ وَالسِّينُ وَالْقَافُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الْفِسْقُ، وَهُوَ الْخُرُوجُ
        عَنِ الطَّاعَةِ. تَقُولُ الْعَرَبُ: فَسَقَتِ الرُّطَبَةُ عَنْ قِشْرِهَا: إِذَا خَرَجَتْ»

  per_sense:
