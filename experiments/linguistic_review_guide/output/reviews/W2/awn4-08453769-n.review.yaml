stage1_review:
  assessment:
    concerns:
      - "اللمة 'غطاء نباتي' غير مشكّلة."
      - "اللمة 'فلورا' مصطلح معرّب (دخيل)، رغم شيوعه الاستعمالي في السياقات البيولوجية، والأفضل إدراج بدائل عربية فصيحة إلى جانبه."
    observations: "المفهوم يشير إلى المجموع الكلي للنباتات في منطقة ما. التعبير الأشيع عربياً هو 'الغطاء النباتي' من الناحية البيئية، و'المجموعة النباتية' أو 'الحياة النباتية' من الناحية التصنيفية البيولوجية. أما 'فلورا' فهو مستخدم بكثرة كمرادف لـ Flora جنباً إلى جنب مع 'فونا' للحيوانات."
  blind_candidates:
    - lemma: "نَبَاتِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (نبات)، يدل على الخصيصة أو المجموع النباتي."
    - lemma: "غِطَاءٌ نَبَاتِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر عن طبقة النباتات التي تكسو الأرض."
    - lemma: "مَجْمُوعَةٌ نَبَاتِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يدل على تجمع الأنواع النباتية في بيئة أو فترة محددة."
    - lemma: "كِسَاءٌ نَبَاتِيّ"
      generation_method: tarkib
      justification: "مركب وصفي استعاري يشبه النبات بالكساء الذي يغطي وجه الأرض."

stage2_evidence:
  per_lemma:
    - lemma: "غطاء نباتي"
      confirm:
        - text: "أنواع وكثافة النباتات التي تغطي منطقة معينة."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "plant cover / vegetation cover"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
    - lemma: "فلورا"
      confirm:
        - text: "في علم الأحياء: مجموع النباتات المتواجدة في بلد معين أو منطقة، في فصل أو وقت معين."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (تحت مدخل فلورة)"
    - lemma: "مجموعة نباتية"
      confirm:
        - text: "مجموعة نباتية تعيش في زمان ومكان"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
    - lemma: "كساء نباتي"
      confirm:
        - text: "مجمل النباتات التي تنمو في منطقة معينة... (مرادف لـ غطاء نباتي)"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (تحت مدخل كساء خضري / كساء نباتي)"
    - lemma: "نباتية"
      contradicts:
        - text: "vegetality"
          source: "المعجم الطبي الموحد"
          conflict: "تدل على الحالة أو الخصيصة النباتية وليس على مجموع النباتات في منطقة."

stage3_analysis:
  per_lemma:
    - lemma: "غطاء نباتي"
      decision: confirmed
      decision_reason: "مركب عربي فصيح وشائع جداً في الاستخدام البيئي للدلالة على مجموع النباتات في منطقة ما."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غِطَاء نَبَاتِيّ"

    - lemma: "فلورا"
      decision: confirmed
      decision_reason: "مصطلح علمي معرب وشائع الاستخدام في التخصصات الأحيائية كمقابل عالمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُلُورَا"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "فُلُورَة"

    - lemma: "مَجْمُوعَة نَبَاتِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير دقيق ومستخدم في القواميس المعتمدة لترجمة (flora) من منظور التصنيف الجغرافي النباتي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "مَجْمُوعَة نَبَاتِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "كِسَاء نَبَاتِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح ومستعمل للغطاء النباتي ومثبت في المعاجم المتخصصة كترجمة لـ vegetation."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "كِسَاء نَبَاتِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نَبَاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المعنى المستعمل للكلمة منفردة ينصرف للخصيصة النباتية وليس للمجموع."

