step0_evidence:
  per_lemma:
    - lemma: "أرض ساحلية"
      expands:
        - text: "«منطقة ساحلية (المرادف العربي)» — مسرد المناخ والبيئة (ArabTerm)"
          addition: "يؤكد أن التعبير وصفي لمدلول (ساحل) أو (منطقة ساحلية)."
      evidence_status: "no_material_found" # لم يرد كمدخل معجمي مستقل بل كتركيب وصفي

    - lemma: "ساحل"
      confirm:
        - text: "«المنطقة من اليابس التي تجاور بحرا أو مسطحًا مائيًا كبيرًا وتتأثر بأمواجه» — المعجم الوسيط"
        - text: "«شاطئ البحر أو النهر، المنطقة من اليابس التي تجاور بحرًا أو مسطحًا مائيًّا كبيرًا» — المعجم الكبير"
      expands:
        - text: "«شريط من الأرض بين خط الشاطئ وأي تغير ملحوظ في الطبوغرافيا» — المعجم الموحد لمصطلحات الجيولوجيا"
          addition: "تحديد جغرافي دقيق للمفهوم كمنطقة يابسة."

    - lemma: "منطقة ساحلية"
      confirm:
        - text: "«منطقة من اليابسة والبحر تمتدّ على الساحل، وتشمل مصبات الأنهار والمناطق الشاطئية والبحرية» — المعجم الموحد لمصطلحات المياه"
        - text: "«منطقة ساحلية» — المورد الحديث"

    - lemma: "سيف"
      confirm:
        - text: "«السيف بالكسر: ساحل البحر» — تاج اللغة وصحاح العربية"
        - text: "«سيف البحر: ساحله» — المعجم الكبير"
        - text: "«سيف القارة: الجزء المنبسط من القارة مما يلي البحر» — المعجم الوسيط"
          addition: "استخدام اصطلاحي جغرافي دقيق لمدلول coastland."

