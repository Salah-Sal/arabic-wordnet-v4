# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────
stage1_review:

  # أ. المرشحات المولَّدة عمياً — انطلاقاً من التعريف وحده
  #    "إشارة تلقائية (عادة صوتية) تحذر من الخطر"
  #    الكلمات المحظورة (من التعريف): إشارة، تلقائية، صوتية، تحذر/تحذير، خطر
  blind_candidates:
    - lemma: "نَذِيرٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن-ذ-ر على وزن فَعِيل الدال على المبالغة في الوصف؛ يدل على
        ما يُنذر من الشيء ويُحذّر منه. ورد في القرآن الكريم دالاً على المُحذِّر
        والتحذير معاً، مما يجعله مناسباً للإشارة التي تُعلم بالخطر.

    - lemma: "مِنْبَاهٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن-ب-ه على وزن مِفْعَال القياسي للأجهزة والأدوات الآلية
        (كمِقياس، مِفتاح)؛ يصف الأداة التي تُنبِّه تلقائياً. الوزن مِفْعَال
        مخصص أصلاً لأسماء الآلات التي تُؤدي الفعل، وهو هنا الإنباه من الخطر.

    - lemma: "صَفَّارَةٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ص-ف-ر على وزن فَعَّالة القياسي للآلات الصوتية (كدوّارة،
        ثرّارة)؛ يصف الأداة التي تُصدر صوتاً حاداً (صفيراً) لتحذير السامعين.
        ينسجم مع الطابع الصوتي الذي يُلمح إليه التعريف بـ"عادة صوتية".

    - lemma: "جَرَسُ الإنْذَارِ"
      generation_method: tarkib
      justification: >
        مركب إضافي: "جَرَس" (الصوت الرنان) + "إنذار" (التخويف والإبلاغ).
        يصف الإشارة الصوتية الرنانة التي تُطلق عند اقتراب الخطر، وهو
        مصطلح شائع الاستخدام في السياقات التقنية والعسكرية.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "لمّة «منبه» مكتوبة بدون تشكيل؛ يُخشى الالتباس بين مُنَبِّه (اسم فاعل) ومُنَبَّه (اسم مفعول)؛ والصواب مُنَبِّه بالتشديد والكسر"
      - "لمّة «تحذير» في المعاجم الكلاسيكية تُعرَّف في الغالب بالمعنى النحوي (باب التحذير في النحو) لا بمعنى إشارة الخطر الآلية؛ يحتاج التمييز الدلالي توثيقاً"
      - "التعريف الحالي يبدو مترجماً من الإنجليزية ترجمةً حرفية ويفتقر إلى أسلوب المعجم الوسيط"
      - "لا يوجد تشكيل كامل لأي من اللمّات الثلاث الموجودة"
    observations: >
      المجموعة الترادفية تُعبِّر عن مفهوم «الإشارة التحذيرية الآلية» (alarm/alert/warning signal).
      اللمّات الثلاث الموجودة (إنذار، تحذير، منبه) تُغطي المفهوم من زوايا مختلفة:
      «إنذار» مصدر إفعال من نذر يُلمح إلى الإبلاغ عن خطر وشيك بشدة أكبر؛
      «تحذير» مصدر تفعيل من حذر يُلمح إلى التحرز الوقائي وقد يكون أقل إلحاحاً؛
      «منبه» اسم فاعل من نبّه يُركز على وظيفة الجهاز في إيقاظ الانتباه.
      الجذور الثلاثة (نذر، حذر، نبه) متباينة دلالياً مما يمنح كل لمّة استقلالية نسبية،
      وهو ما يُبرر وجودها معاً في مجموعة ترادفية واحدة بشرط توثيق الفروق الدقيقة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    # ── إنذار ──────────────────────────────────────────────────
    - lemma: "إنذار"
      confirm:
        - text: "«الإنذار: الإعلام بما يحذر. قال ابن عطية ولا يكاد يكون إلا في تخويف يسع زمانه الاحتراز، فإن لم يسع كان إشعاراً»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«الإنذارُ: إخبار فيه تخويف كما أن التبشيرَ إخبار فيه سرور»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
        - text: "«إِنْذَارَ: إشارة تنبه المستعمل إلى حدوث حالة غير عادية»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — translation_en: alarm"
        - text: "«(1) هجوم مباغِت (2) «أ» إنذار بخطر. «ب» جهاز الإنذار (3) ذُعْر (4) تنبيه؛ تحذير؛ إنذار (5) ينبِّه إلى خطر؛ يُنْذِر بخطر»"
          source: "المورد الحديث (2008) — translation_en: alarm"
        - text: "«إنذار مسموع: إنذار صوتي يصدره الحاسوب يدل على حدوث خلل بإحدى دوائره أو حدوث خطأ في إدخال البيانات أو عند تنفيذ البرامج»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم — translation_en: audible alarm"
        - text: "«إشارة إنذار: إشارة تُعلِم بوجود خطر ما»"
          source: "المعجم الموحد لمصطلحات النقل (2010) — translation_en: warning signal"
      expands:
        - text: "«إنذار زائف: دلالة إشارة مكتَشفة في مستقبِل نظام إلكترونيّ، رغم أن الإشارة غير موجودة، ويكون هذا بسبب ضوضاء داخلية أو خارجية أو تشويش»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
          addition: "يُثبت رسوخ مصطلح «إنذار» في الحقل التقني ويدل على توسعه في التمييزات الفرعية (زائف / مسموع / أحمر)"
        - text: "«نذير النار: أداة تُنذر أو تُعلم بنشوب النار في موضع ما»"
          source: "المورد الحديث (2008) — translation_en: fire alarm"
          addition: "يُثبت استخدام الجذر نذر (نذير) في سياق إنذار الحريق بمعنى الأداة المادية، مما يُعزز شرعية «إنذار» لنفس المفهوم"

    # ── تحذير ──────────────────────────────────────────────────
    - lemma: "تحذير"
      confirm:
        - text: "«تَحْذِير: إشارة إلى ظاهرة غير منتظرة يمكن أن تحدث أثناء تشغيل نظام أو تنفيذ برنامج»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — translation_en: alert"
        - text: "«(1) يَقِظ؛ مُتَنَبّه؛ واعٍ [...] (5) إنذار [بغارة جوّية إلخ] (6) يُحَذِّر [وبخاصة من غارةٍ جوّية أو هجوم قريب]»"
          source: "المورد الحديث (2008) — translation_en: alert"
      contradicts:
        - text: "«التحذير: في اللغة تخويف شيء عن شيء وتبعيده عنه. وعند النحاة اسم عمل فيه النصب بمفعوليته بتقدير اتّقِ أو بعد أو نحوهما...»"
          source: "دستور العلماء للأحمدنكري (كلاسيكي)"
          conflict: "يُعرِّف التحذير بالمعنى النحوي (مفعول به محذَّر منه) لا بمعنى الإشارة الصوتية الآلية؛ مما يُشير إلى أن المعنى الحديث استعمال مولَّد جديد"
        - text: "«التحذير: هو معمولٌ بتقدير: «اتَّقِ» تحذيراً لما بعده، نحو: إياك والأسد، أو ذكر المحذر منه مكررًا، نحو: الطريقَ الطريقَ»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413م)"
          conflict: "يؤكد المعنى النحوي الصرف بعيداً عن سياق الإشارة الآلية"
      expands:
        - text: "«تحذير: نصيحةٌ في وثيقةِ المستخدِم الخاصةِ ببرمجيات معيّنة، مفادها أن القيام ببعض الأفعال يمكّن أن يؤدي إلى عواقبَ غيرِ مرغوب فيها»"
          source: "معجم مصطلحات المعلوماتية (2000) — translation_en: caution"
          addition: "يكشف أن «تحذير» يُستخدم في المصطلحية بمعنى أخف وطأة من alarm (تنبيه وقائي لا حالة طوارئ)، وهذا فارق دقيق مهم يميّزه عن «إنذار»"
        - text: "«تجهيزة تحذير: هي جهاز سمعي أو/و بصري [...] حيث ينبه قائد السيارة بواسطة إشارات»"
          source: "مسرد هندسة وتكنولوجيا السيارات — translation_en: alarm"
          addition: "يُثبت استخدام «تحذير» بمعنى جهاز الإنذار التقني في سياق هندسي"

    # ── منبه ──────────────────────────────────────────────────
    - lemma: "منبه"
      confirm:
        - text: "«منبِّه؛ تنبيه: إشارةٌ مرئيةٌ، أو سمعيةٌ، تَصدر عن الحاسوب، وتنبِّه المستخدِمَ على حصول خطأٍ، أو حالةٍ طارئة»"
          source: "معجم مصطلحات المعلوماتية (2000) — translation_en: alarm"
        - text: "«منبه ذاتي»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000) — translation_en: auto alarm"
      contradicts:
        - text: "«(المنبه) ساعةٌ ذاتُ جرس يُضبط على وقت معين فإذا جاء الوقت صلصل فينبه النائم (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (ت 1998م)"
          conflict: "يُعرِّف «المنبه» بمعنى ساعة المنبه (alarm clock) لا إشارة الخطر الآلية (alarm signal)، وهو استخدام مختلف عن معنى المجموعة الترادفية"
        - text: "«المُنَبِّه: ساعة ذات جرس يضبط على وقت معين, فإذا جاء الوقت صلصل فينتبه النائم»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "يُثبت أن الاستخدام المعجمي الراسخ لـ«منبه» = alarm clock وليس warning signal"
        - text: "«منبّه — translation_en: stimulant; stimulus»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) وعلم الأحياء (1993) والمعجم الطبي الموحد (2009)"
          conflict: "في المصطلحية العلمية البيولوجية والطبية يُستخدم «منبه» بمعنى stimulus/stimulant لا alarm؛ مما يُوجِد تعدد دلالي يُضعف خصوصيته لهذه المجموعة"
      expands:
        - text: "«المُنَبِّهة؛ الساعة المنبِّهة»"
          source: "المورد الحديث (2008) — translation_en: alarm clock"
          addition: "يُثبت أن الصيغة الصحيحة هي مُنَبِّه (اسم فاعل مُشدَّد) وليس مُنَبَّه أو مِنْبَه"

    # ── مرشح المرحلة ١: نَذِير ─────────────────────────────
    - lemma: "نَذِيرٌ"
      confirm:
        - text: "«النذير: الإنذار والمنذر (ج) نُذُر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«النَّذِيرُ: الإنذار. المُنْذِرُ»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«نذير النار: أداة تُنذر أو تُعلم بنشوب النار في موضع ما»"
          source: "المورد الحديث (2008) — translation_en: fire alarm"
        - text: "«نَذِير: من (ن ذ ر) الإبلاغ ولا يكون إلا في التخويف والتحذير»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«النون والذال والراء كلمة تدل على تخويف أو تخوف. منه الإنذار: الإبلاغ؛ ولا يكاد يكون إلا في التخويف. والنذير: المنذر، والجمع النذر»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن «نذير» وزنه فَعِيل ويدل على المبالغة في الإنذار؛ وهو قابل للاستخدام بمعنى جهاز التحذير كما في «نذير النار»"

    # ── مرشح المرحلة ١: مِنْبَاه ───────────────────────────
    - lemma: "مِنْبَاهٌ"
      contradicts:
        - text: "«مِنْباه — translation_en: stimulator»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الاستخدام المعجمي الوحيد المرصود يُترجمه بـ stimulator في السياق الطبي، لا alarm في سياق إشارة الخطر"

    # ── مرشح المرحلة ١: صَفَّارة ──────────────────────────
    - lemma: "صَفَّارَةٌ"
      confirm:
        - text: "«أداة ينفخ فيها فتصفّر»"
          source: "المعجم الوسيط (مجمع اللغة العربية) و المعجم الكبير"
        - text: "«صفارة انذار — translation_en: siren»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      contradicts:
        - text: "«صفّارة — translation_en: whistle»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "الصفارة أداة إنذار صوتية بعينها (صافرة/صفارة) وليست مرادفاً للمفهوم العام لإشارة الخطر"
      expands:
        - text: "«انْطَلَقَتْ صَفَّارةُ الإنذارِ قُبَيْل الغارة الجويَّة» (شاهد استعمالي)؛ «قَدْ سَئِمْنا بالأَمْسِ صَفَّارَةَ الإِنذارِ والوَيْلَ والعَذابَ الشَّدِيدا» (على الجارم)"
          source: "المعجم الكبير"
          addition: "يُثبت أن «صفارة» تُستخدم في تركيب «صفارة الإنذار» أي مركب إضافي، وليست مرادفاً مستقلاً لـ«إنذار»"

    # ── مرشح المرحلة ١: جَرَسُ الإنذار ─────────────────────
    - lemma: "جَرَسُ الإنْذَارِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── إنذار (موجود) ─────────────────────────────────────────
    - lemma: "إنذار"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة موثقة في المعاجم الكلاسيكية والحديثة بمعنى «الإبلاغ بالخطر المخيف»،
        ومُصطلحيّاً راسخة في المعجمية التقنية العربية (alarm في تقنية المعلومات والهندسة والعسكرية).
        الجذر نذر يحمل دلالة التخويف الجوهرية في كليهما. تحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن الإنذار بالخطر الوشيك أو الطارئ بدرجة أعلى من الإلحاح؛
        يُلمح إلى حالة طوارئ آنية تستدعي استجابة فورية (قارن alarm في مقابل warning).
        هو الأكثر شيوعاً في السياقات الأمنية والعسكرية والتقنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِنْذَارٌ"

    # ── تحذير (موجود) ─────────────────────────────────────────
    - lemma: "تحذير"
      decision: confirmed
      decision_reason: >
        مستخدم في المصطلحية الحديثة بمعنى alert (إشارة تنبيه وقائية) في مقابل alarm
        (إنذار طارئ). الأدلة التقنية صريحة في ربطه بـ alert/warning.
        التعارض مع المعاجم الكلاسيكية (المعنى النحوي) لا يُلغي مشروعية الاستخدام الحديث
        المُصطلحي إذ إن المعنى النحوي أقدم وصارت دلالة التحذير (warning) أكثر تداولاً في العصر الحديث.
        يحتاج تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أقل إلحاحاً من «إنذار»؛ يُستخدم للتنبيه الوقائي الذي يمنح المستخدم وقتاً للتصرف
        قبل وقوع الخطر (نظير alert أو caution)؛ يشيع في سياقات البرمجيات والتحكم الآلي
        للإشارة إلى حالات شاذة محتملة لا طارئة قائمة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْذِيرٌ"

    # ── منبه (موجود) ──────────────────────────────────────────
    - lemma: "منبه"
      decision: confirmed
      decision_reason: >
        رغم أن الاستخدام الراسخ في المعجم الوسيط يُعرِّف «المُنَبِّه» بـ«ساعة المنبه»
        (alarm clock)، فإن المصطلحية التقنية الحديثة (معجم المعلوماتية 2000، معجم علوم البحار)
        تستخدمه بمعنى «إشارة آلية تنبّه المستخدم» وهو ما يتوافق مع مفهوم المجموعة.
        الاستخدامان قائمان معاً ومقبولان. يجب تصحيح التشكيل الذي يغيب كلياً:
        الصواب مُنَبِّه (اسم فاعل من نبَّه بالتشديد) كما ورد في المعجم الوسيط.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركز على الوظيفة الإيقاظية والتنبيهية (من النبه بمعنى الانتباه واليقظة)؛
        يُستخدم حين يكون المقصود إيقاظ انتباه المستخدم إلى حالة طارئة من خلال
        إشارة سمعية أو مرئية (نظير alert في المعلوماتية)؛ يشيع في سياق الأجهزة والشاشات
        التي تُصدر تنبيهات تلقائية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنَبِّهٌ"

    # ── مرشح المرحلة ١: نَذِير ────────────────────────────────
    - lemma: "نَذِيرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق «نذير» بمعنى «جهاز الإنذار» في المورد الحديث (نذير النار = fire alarm)،
        فإن إضافته لمجموعة تضم «إنذار» (من الجذر نفسه نذر) يُخلق تكراراً دلالياً
        مع تمييز دقيق جداً (اسم فاعل مقابل مصدر) لا يُبرر اللمّتين في مجموعة واحدة.
        علاوة على ذلك، «نذير» يحمل في الاستخدام القرآني والأدبي الراسخ دلالة
        المُنذِر البشري (الرسول/الداعي)، مما يُنشئ التباساً في السياقات المختلطة.

    # ── مرشح المرحلة ١: مِنْبَاه ──────────────────────────────
    - lemma: "مِنْبَاهٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الأثر الوحيد في قاعدة البيانات يُترجمه بـ stimulator في السياق الطبي،
        وهو بعيد عن دلالة إشارة الخطر. الوزن مِفْعَال قياسي لكن الصيغة غير مُتداوَلة
        في أي مصدر معجمي بالمعنى المطلوب. مرفوض لغياب الأدلة الداعمة.

    # ── مرشح المرحلة ١: صَفَّارة ─────────────────────────────
    - lemma: "صَفَّارَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الصفارة أداة إنذار صوتية بعينها (whistle/siren) وليست مرادفاً للمفهوم العام.
        تُستخدم دائماً في تركيب «صفارة الإنذار» لا مستقلةً، ومنطوق الشاهد الشعري
        يُثبت ذلك: «صَفَّارَةُ الإنذارِ» مضافة لا مستقلة. اختبار السكّ: إبدال «صفارة»
        بـ«جهاز» في «صفارة الإنذار» لا يُفسد المعنى → ليست مصطلحاً مسكوكاً مستقلاً.

    # ── مرشح المرحلة ١: جَرَسُ الإنذار ──────────────────────
    - lemma: "جَرَسُ الإنْذَارِ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حر لا وحدة معجمية مسكوكة؛ اختبار السكّ يُثبت ذلك:
        «جرس التحذير» أو «جرس الخطر» تؤدي المعنى نفسه، فلا يوجد تثبيت معجمي.
        فضلاً عن أنه أضيق من المفهوم (يُقيّده في الصوت الجرسي دون الإشارات الأخرى).


