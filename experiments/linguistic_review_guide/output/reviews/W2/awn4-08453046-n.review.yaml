stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (كيان حي، منظومة حية) هي ترجمات حرفية مقبولة، لكنها قد تفتقر إلى الاصطلاح الشائع في العلوم الاجتماعية والسياسية."
      - "المصطلح الأكثر دقة للمفهوم المجازي لـ (organism) في العربية الحديثة هو (عضوية) أو (كيان عضوي)."
    observations: "المجموعة تعبّر عن المفهوم البنيوي والوظيفي للكائن الحي عند تطبيقه على الأنظمة الاجتماعية أو الإدارية. الاستخدام العربي يميل لاستخدام لفظ (عضوي) للإشارة إلى هذا النوع من التماثل."
  blind_candidates:
    - lemma: "عُضْوِيَّة"
      generation_method: majaz
      justification: "لفظ (العضوية) يُستخدم في السياقات الحديثة (الاجتماعية والسياسية) للإشارة إلى الكيان الذي يعمل ككتلة واحدة مترابطة مثل الكائن الحي."
    - lemma: "نِظَام عُضْوِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبّر بدقة عن (organic system) الذي تشير إليه المجموعة."
    - lemma: "مَنْظُومَة عُضْوِيَّة"
      generation_method: tarkib
      justification: "مرادف لـ (نظام عضوي) مع التركيز على تكامل الأجزاء."
    - lemma: "بِنْيَة حَيَّة"
      generation_method: tarkib
      justification: "تعبير يركز على الجانب الهيكلي (الهيكل) المذكور في التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "عُضْوِيَّة"
      confirm:
        - text: "«(2) نظام the social organism .»"
          source: "المورد الحديث (2008)"
        - text: "«عضوية organism»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
      expands:
        - text: "«عُضْوِيَّة: جسم الكائن الحيّ.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يؤكد استخدام اللفظ كمقابل لـ organism."
    - lemma: "كِيَان حَيّ"
      confirm:
        - text: "«كائن حي organism»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
    - lemma: "مَنْظُومَة حَيَّة"
      confirm:
        - text: "«كائن حي: ... منظومة لها مكونات مترابطة ومتكاملة تمكن من تحقيق الاستمرارية...»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يربط بين الكائن الحي والمنظومة المتكاملة."
    - lemma: "كِيَان عُضْوِيّ"
      confirm:
        - text: "«كائن عضوي organism»"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"

stage3_analysis:
  per_lemma:
    - lemma: "كيان حي"
      decision: confirmed
      decision_reason: "ترجمة صحيحة ومستخدمة لوصف الأنظمة التي تحاكي الكائنات الحية في حيويتها وتطورها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِيَان حَيّ"
    - lemma: "منظومة حية"
      decision: confirmed
      decision_reason: "تتفق مع الجزء الأول من التعريف (نظام) وتوصف بـ (الحية) دلالة على المحاكاة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنْظُومَة حَيَّة"
    - lemma: "عُضْوِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الفلسفي والاجتماعي الأكثر دقة للتعبير عن (organism) كبناء وظيفي متكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عُضْوِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نِظَام عُضْوِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "يوضح الجانب النظامي والمجازي (العضوي) المقصود في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "نِظَام عُضْوِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "كِيَان عُضْوِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح شائع في الأدبيات الفلسفية والاجتماعية لوصف المجتمع أو المؤسسات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "كِيَان عُضْوِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "نظام يُعتبر مماثلاً في الهيكل أو الوظيفة للجسم الحي"
    assessment:
      decision: retain
      reason: "التعريف دقيق ومباشر ويغطي الجانبين البنيوي والوظيفي."
  examples:
    per_lemma:
      - lemma: "عُضْوِيَّة"
        examples:
          - text: "تُصَوِّرُ النَّظَرِيَّاتُ الْعُضْوِيَّةُ الْمُجْتَمَعَ بِوَصْفِهِ عُضْوِيَّةً وَاحِدَةً تَتَكَامَلُ أَجْزَاؤُهَا."
            type: usage
      - lemma: "نِظَام عُضْوِيّ"
        examples:
          - text: "يَعْمَلُ الْمَصْنَعُ كَنِظَامٍ عُضْوِيٍّ حَيْثُ تَعْتَمِدُ كُلُّ وَحْدَةٍ فِي إِنْتَاجِهَا عَلَى الْأُخْرَى."
            type: usage
      - lemma: "كِيَان حَيّ"
        examples:
          - text: "الْمُؤَسَّسَةُ النَّاجِحَةُ كِيَانٌ حَيٌّ يَتَأَقْلَمُ مَعَ تَغَيُّرَاتِ السُّوقِ."
            type: usage
      - lemma: "مَنْظُومَة حَيَّة"
        examples:
          - text: "تُمَثِّلُ الْمَدِينَةُ مَنْظُومَةً حَيَّةً مِنَ التَّفَاعُلَاتِ الْبَشَرِيَّةِ وَالِاقْتِصَادِيَّةِ."
            type: usage
      - lemma: "كِيَان عُضْوِيّ"
        examples:
          - text: "يُنْظَرُ إِلَى الدَّوْلَةِ فِي الْفَلْسَفَةِ الْهِيغِلِيَّةِ بِوَصْفِهَا كِيَانًا عُضْوِيًّا."
            type: usage

