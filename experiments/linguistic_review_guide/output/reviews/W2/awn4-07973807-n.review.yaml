      - lemma: "نَقْشَةٌ طَوِيلَةٌ"
        examples:
          - text: "كَانَتْ لَدَيْهِ نَقْشَةٌ طَوِيلَةٌ مِنْ وَرَقِ الْقَلْبِ مِمَّا مَنَحَهُ الْأَفْضَلِيَّةَ."
