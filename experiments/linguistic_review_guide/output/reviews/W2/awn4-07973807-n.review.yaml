stage4_content:
  definition:
    current: "في يد اللعب، النقشة (أو اللون) التي تحتوي على أكبر عدد من البطاقات"
    assessment:
      decision: revise
      reason: "تعديل لرفع جودة الصياغة العربية وإزالة التركيب الركيك 'في يد اللعب' مع الحفاظ على دقة المعنى."
    authored:
      - type: terminological
        text: "فِئَةٌ مِنْ أَوْرَاقِ اللَّعِبِ (كَالْبَدْلَةِ أَوِ النَّقْشَةِ أَوِ اللَّوْنِ) يَحْمِلُ مِنْهَا اللَّاعِبُ الْعَدَدَ الْأَكْبَرَ فِي يَدِهِ مُقَارَنَةً بِالْفِئَاتِ الْأُخْرَى."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07973807-n"
          definition_index: 0
          text: "فِئَةٌ مِنْ أَوْرَاقِ اللَّعِبِ (كَالْبَدْلَةِ أَوِ النَّقْشَةِ أَوِ اللَّوْنِ) يَحْمِلُ مِنْهَا اللَّاعِبُ الْعَدَدَ الْأَكْبَرَ فِي يَدِهِ مُقَارَنَةً بِالْفِئَاتِ الْأُخْرَى."

