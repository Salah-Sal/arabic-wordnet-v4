stage1_review:
  assessment:
    concerns:
      - "المفهوم متعلق حصراً بألعاب الورق (مثل البريدج)، ولا يمتلك مقابلاً دقيقاً من التراث المعجمي العربي."
      - "المصطلحات المستخدمة تعتمد على النقل أو الترجمة الحرفية (Calque)، وتتفاوت التسميات الإقليمية للـ 'suit' (بدلة، نقشة، لون)."
    observations: "المفهوم يشير إلى أكثر فئة أوراق متوفرة في يد اللاعب. يتم استخدام التركيب الوصفي 'طويل' للدلالة على الكثرة العددية، مع استخدام تسمية الفئة (لون، بدلة، نقشة)."
  blind_candidates:
    - lemma: "لَوْنٌ طَوِيلٌ"
      generation_method: tarkib
      justification: "اللون هو مصطلح شائع لفئة الورق (suit) في الألعاب، والطويل يرمز للكثرة."
    - lemma: "فِئَةٌ غَالِبَةٌ"
      generation_method: tarkib
      justification: "الفئة تمثل نوع الأوراق، والغلبة تعبر عن كثافتها العددية."
    - lemma: "زَاتٌ طَوِيلٌ"
      generation_method: tarkib
      justification: "كلمة 'زات' شائعة في اللهجات المشرقية للإشارة للـ suit."
    - lemma: "نَوْعٌ مُهَيْمِنٌ"
      generation_method: tarkib
      justification: "النوع يشير إلى الفئة، والمهيمن يدل على أكثرها تواجداً."

