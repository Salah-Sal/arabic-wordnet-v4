# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-06817464-n  |  ILI: i72249
# المراجع: Review Pipeline v2 (5-Stage)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «إشارة حظر التجول» عبارة وصفية تحليلية مؤلفة من ثلاث كلمات، لا تُمثّل وحدةً معجمية مُسَكَّكة."
      - "اللمّة تفشل اختبار السكّ: يمكن إحلال كل مكوّن بمرادفه (إشارة→علامة، حظر→منع، التجول→السير) وتبقى العبارة صالحة وصفاً للمفهوم."
      - "المجموعة تفتقر إلى مصطلح مُكثَّف يُحيل تحديداً إلى الإشارة الصوتية (الجرس/الناقوس) المُعلِنة لبدء حظر التجول."
    observations: >-
      تعريف المجموعة دقيق: الإشارة المقصودة ليست حظر التجول ذاته بل الإعلان الصوتي
      عنه، وهو تمييز دقيق معجمياً (الفرق بين السبب والإيذان به). المجموعة الفائقة
      (awn4-06804229-n) تضمّ «إشارة» كلمّة، مما يُربك الربط الهرمي إذا أبقينا
      «إشارة حظر التجول» لمّةً في المجموعة الفرعية. الوزن الدلالي الدقيق للمفهوم
      يستوجب مصطلحاً يُبرز الطابع الصوتي (قرع الجرس أو الناقوس) والوظيفة الإيذانية.

  blind_candidates:
    - lemma: "جَرَسُ الحَظْرِ"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من «جَرَس» (أداة نحاسية مجوفة ذات صوت) + «الحَظْر» (المنع
        والتقييد). الجرس وحدة معجمية مُثبَّتة في المعجم الوسيط والكبير بمعنى الآلة
        الصوتية المألوفة. المركّب يُحيل إلى جرس الإنذار بالحظر.

    - lemma: "نَاقُوسُ التَّجَوُّلِ"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من «نَاقُوس» (اللفظ العربي الكلاسيكي للآلة الصوتية المضروبة
        إيذاناً) + «التَّجَوُّل» (حركة السير). الناقوس أقدم وأكثر تخصصاً من «الجرس»
        في الدلالة على آلة الإعلان عن أوقات منضبطة.

    - lemma: "صَفَّارَةُ الحَظْرِ"
      generation_method: ishtiqaq
      justification: >-
        اشتقاق على وزن فَعَّالة (للأدوات الصوتية) من جذر ص-ف-ر. «الصفّارة» أداةٌ
        ينفخ فيها فتُصفِّر؛ استُعملت في السياقات الأمنية للإنذار والتنبيه. المركّب
        مع «الحظر» يصف الإشارة الصوتية المُعلِنة للقيود.

    - lemma: "نَفِيرُ الحَظْرِ"
      generation_method: majaz
      justification: >-
        مجاز بإزاحة دلالية من «النَّفِير» (نداء الاستنفار والحرب في العربية الكلاسيكية:
        «القوم ينفرون للقتال») إلى الإشارة الصوتية العامة للإنذار والتقييد. الربط
        الوظيفي: كلاهما صوتٌ رسمي يُغيّر حركة الناس ويفرض قيداً عليها.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "إشارة حظر التجول"
      evidence_status: "no_material_found"
      # لم يرد هذا التعبير المركّب كمصطلح مُثبَّت في أي مصدر معجمي في قاعدة البيانات.

    - lemma: "جَرَسُ الحَظْرِ"
      confirm:
        - text: >-
            «الجَرَسُ: أَداةٌ من نحاسٍ أو نحوِه مجوَّفة، إذا حُرِّكَتْ تتذبذبُ فيها
            قطعةٌ صغيرة صلبة، فيُسمع صوتُها»
          source: "المعجم الوسيط"
        - text: >-
            «الجَرَسُ: الحركةُ وأداةٌ من نُحَاسٍ أو نحوِه مجوَّفة إذا حُرِّكت
            تتذبذبُ فيها قطعةٌ صغيرةٌ صلبةٌ تَقرعُ جوانبَها فيُسمعُ صوتُها.
            الجرسُ الكهربائي: أداةٌ لإحداثِ صوتٍ تعمل بالتيار الكهربائي»
          source: "المعجم الكبير"
        - text: >-
            «حَظْرُ التَّجَوُّل: إجراءٌ تتَّخذُهُ الحكوماتُ عند وقوع اضطراباتٍ
            داخلية أو بسببِ عُدوانٍ خارجيٍّ يقتضي منعَ السَّيرِ بالشوارع»
          source: "المعجم الكبير"
      expands:
        - text: >-
            «الجِيمُ وَالرَّاءُ وَالسِّينُ أَصْلٌ وَاحِدٌ وَهُوَ مِنَ الصَّوْتِ...
            الجَرَسُ: الَّذِي يُعَلَّقُ عَلَى الجِمَالِ. وَفِي الحَدِيثِ:
            "لَا تَصْحَبُ المَلَائِكَةُ رُفْقَةً فِيهَا جَرَسٌ"»
          source: "مقاييس اللغة لابن فارس"
          addition: "الجرس أصلٌ صوتي في اللغة، والجَرَسُ المُعلَّق آلةٌ صوتية مشتقة منه، مما يُثبّت عراقة المصطلح."

    - lemma: "نَاقُوسُ التَّجَوُّلِ"
      confirm:
        - text: >-
            «(2أ) نَاقُوسُ حَظْرِ الإنارةِ أو التجوّل: ناقوسٌ لإعلانِ موعدِ حَظْرِ
            الإنارةِ أو حَظْرِ التجوُّل. (ب) إعلانُ هذا الحَظْر»
          source: "المورد الحديث (2008) — ترجمة curfew"
        - text: >-
            «النَّاقُوسُ: مِضرابُ النَّصَارى الذي يضربونَهُ إيذاناً بحلولِ وقتِ
            الصَّلاة»
          source: "المعجم الوسيط"
      expands:
        - text: >-
            «الناقوسُ: خشبةٌ طويلةٌ يضربُها النصارى في أوقاتِ عبادتِهم»
          source: "التعريفات الفقهية للبركتي"
          addition: "الناقوس يُشير تحديداً إلى آلة الإيذان بالأوقات المنضبطة، مما يُقرّبه وظيفياً من ناقوس حظر التجول."
        - text: >-
            «الناقوسُ في اصطلاح المتصوّفة: الانتباهُ الداعي للتوبة والإنابة والعبادة،
            وأيضاً الجذبةُ التي تُخبرُ عن الحقّ تعالى وتُوقظُ من نوم الغفلة»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُثبّت استعمال الناقوس مجازاً للإيذان والتنبيه إلى تحوّل حال."

    - lemma: "صَفَّارَةُ الحَظْرِ"
      confirm:
        - text: >-
            «الصَّفَّارةُ: أداةٌ يُنفخُ فيها فتُصفِّر»
          source: "المعجم الوسيط"
        - text: >-
            «الصَّفَّارةُ: أداةٌ يُنفَخُ فيها فتُصفِّرُ»
          source: "المعجم الكبير"
      expands:
        - text: >-
            «ما ذَوَى من النَّبات فتغيَّر إلى الصُّفرة»
          source: "المعجم الوسيط"
          addition: "الصُّفَارة (بضم الصاد) بمعنى الذبول تختلف عن الصَّفَّارة (بفتح وتشديد) أداةُ الصفير؛ الوزنان مختلفان."

    - lemma: "نَفِيرُ الحَظْرِ"
      contradicts:
        - text: >-
            «النَّفِير — pharyngotympanic tube (Eustachian tube)»
          source: "المعجم الطبي الموحد (2009)"
          conflict: >-
            النَّفِير في المعاجم الطبية الحديثة المُوحَّدة مصطلحٌ مُخصَّص للأنبوب
            السمعي (قناة استاكيوس)؛ استعماله في سياق الحظر سيُوقع في اشتراك لفظي
            مع مصطلح طبي راسخ.
      expands:
        - text: >-
            «النَّفِيرُ: الكُفْءُ في المفاخرة؛ والقومُ ينفرون للقتال. النَّفِيرُ
            العامُّ: قيامُ عامَّة الناس لقتال العدوّ»
          source: "المعجم الوسيط"
          addition: "النفير في الكلاسيكية يحمل دلالة الحرب والقتال؛ لا يناسب سياق الإشارة الأمنية المدنية."


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إشارة حظر التجول"
      decision: removed
      decision_reason: >-
        العبارة وصفية تحليلية لا مصطلح مُسَكَّك: كلٌّ من مكوّناتها الثلاثة قابلٌ
        للإحلال بمرادف (إشارة→علامة، حظر→منع، التجول→السير) وتبقى العبارة صالحة
        وصفاً، مما يُعني فشلها في اختبار السكّ. فضلاً عن ذلك، «إشارة» هي أحد
        لمّات المجموعة الفائقة (awn4-06804229-n)، مما يُضعف الدقة الهرمية. لا وجود
        لها كمصطلح مُثبَّت في المعاجم المستعلَمة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جَرَسُ الحَظْرِ"
      source: stage1
      decision: removed
      decision_reason: >-
        «الحَظْر» بمفرده يُحيل أولاً إلى المعنى الفقهي (المحرَّم الشرعي) لا إلى
        حظر التجول، مما يُضعف وضوح المصطلح. المورد الحديث يستخدم «ناقوس» لا «جرس»
        للإشارة الإيذانية المخصوصة بحظر التجول؛ و«ناقوس» يحمل دلالة الإيذان
        بالأوقات المنضبطة بشكل أخصّ. لم يرد «جرس الحظر» مصطلحاً مُثبَّتاً في
        أي مصدر من المصادر المستعلَمة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "نَاقُوسُ التَّجَوُّلِ"
      source: stage1
      decision: confirmed
      decision_reason: >-
        المورد الحديث (2008) يُثبّت صراحةً المصطلح «ناقوس حظر الإنارة أو التجوّل»
        ترجمةً لـcurfew بمعنى الإشارة/الجرس المُعلِن. اللفظ «ناقوس» يحمل دلالة
        الإيذان بالأوقات المنضبطة ولا يُشارك في الاشتراك اللفظي مع مصطلحات حديثة
        أخرى. الصيغة الكاملة المُثبَّتة هي «نَاقُوسُ حَظْرِ التَّجَوُّلِ» (بإضافة
        «حظر» الضرورية للتخصيص)، وهي تختلف قليلاً عن المرشّح المُولَّد بإضافة
        «حظر»؛ ولذا يُنشأ المدخل بهذه الصيغة الكاملة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        «نَاقُوسُ حَظْرِ التَّجَوُّلِ» يُحيل تحديداً إلى الإشارة الصوتية الإيذانية
        (بقرع الناقوس أو ما يؤدي وظيفته) التي تُنبئ ببدء فترة القيود، لا إلى
        فترة الحظر ذاتها («حظر التجول») ولا إلى وقته («موعد حظر التجول»). يُبرز
        الطابع الصوتي الإيذاني ويميّز هذا المفهوم عن الإشارة البصرية أو الإعلان
        الكتابي.
      actions:
        - command: create_entry
          params:
            lemma: "نَاقُوسُ حَظْرِ التَّجَوُّلِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "صَفَّارَةُ الحَظْرِ"
      source: stage1
      decision: removed
      decision_reason: >-
        «الصَّفَّارة» آلةُ نفخ لا قرعٍ، وهي أداةٌ حديثة الطابع لا تُعادل الناقوس
        الذي يُقرع. التعريف الإنجليزي يُصرّح بأن الإشارة «عادةً جرس/ناقوس» لا
        صافرة. فضلاً عن ذلك، لم يَرِدِ المركّب «صفارة الحظر» في أي مصدر معجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "نَفِيرُ الحَظْرِ"
      source: stage1
      decision: removed
      decision_reason: >-
        «النَّفِير» مُحجوزٌ في المعاجم الطبية الحديثة المُوحَّدة (المعجم الطبي
        الموحد 2009) للأنبوب السمعي (قناة استاكيوس)، مما يُوقع في اشتراك لفظي
        حادٍّ مع مصطلح طبي راسخ. كما يحمل في الكلاسيكية دلالة الاستنفار الحربي
        التي تُبعده عن السياق الأمني المدني.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "إشارة (عادة جرس) تعلن عن بدء قيود حظر التجول"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مقبول في مضمونه لكنه يستحق التحسين: (١) بدء بـ«إشارة»
        يُكرّر لمّة المجموعة الفائقة ويُضعف الدقة التعريفية. (٢) «تعلن عن» يمكن
        تحسينها إلى «إيذاناً». (٣) «قيود حظر التجول» تكرارٌ (حظر التجول نفسه
        قيدٌ)، يُستعاض عنها بـ«فترة حظر التجول» أو «ابتداء حظر التجول».
    authored:
      - type: terminological
        text: >-
          إيذانٌ صوتيٌّ، غالباً بقرعِ ناقوسٍ أو جرسٍ، يُعلنُ ابتداءَ فترةِ
          حظرِ التجوُّلِ ومنعَ الحركةِ في الشوارع
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          ناقوسٌ أو إشارةٌ صوتيةٌ تُصدرُها السلطاتُ الأمنية إيذاناً ببدءِ
          فترةِ حظرِ التجوُّل، إذ يُمنعُ الأشخاصُ بعدَها من مغادرةِ مساكنِهم
          تحتَ طائلةِ العقوبة؛ وقد كانت هذه الإشارةُ تاريخياً قرعَ جرسٍ كبيرٍ
          في المدن الأوروبية الوسيطة
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >-
            إيذانٌ صوتيٌّ، غالباً بقرعِ ناقوسٍ أو جرسٍ، يُعلنُ ابتداءَ فترةِ
            حظرِ التجوُّلِ ومنعَ الحركةِ في الشوارع
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >-
            ناقوسٌ أو إشارةٌ صوتيةٌ تُصدرُها السلطاتُ الأمنية إيذاناً ببدءِ
            فترةِ حظرِ التجوُّل، إذ يُمنعُ الأشخاصُ بعدَها من مغادرةِ مساكنِهم
            تحتَ طائلةِ العقوبة؛ وقد كانت هذه الإشارةُ تاريخياً قرعَ جرسٍ كبيرٍ
            في المدن الأوروبية الوسيطة

  examples:
    per_lemma:
      - lemma: "نَاقُوسُ حَظْرِ التَّجَوُّلِ"
        examples:
          - text: >-
              دَوَّى نَاقُوسُ حَظْرِ التَّجَوُّلِ في أرجاءِ المدينةِ مُؤذِناً
              بانتهاءِ ساعاتِ الحركةِ الحُرَّةِ، فأسرعَ المارَّةُ إلى بيوتِهم
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >-
            دَوَّى نَاقُوسُ حَظْرِ التَّجَوُّلِ في أرجاءِ المدينةِ مُؤذِناً
            بانتهاءِ ساعاتِ الحركةِ الحُرَّةِ، فأسرعَ المارَّةُ إلى بيوتِهم


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "نَاقُوسُ حَظْرِ التَّجَوُّلِ"
      entry_id: "{auto}"
      roots:
        - word: "ناقوس"
          root: "نقس"
          maqayis_quote: >-
            «النُّونُ وَالْقَافُ وَالسِّينُ أُصَيْلٌ يَدُلُّ عَلَى لَطْخِ شَيْءٍ
            بِشَيْءٍ غَيْرِ حَسَنٍ» — يُلاحَظ أن «ناقوس» لفظٌ مُعرَّب من
            الآرامية/السريانية (نَاقُوشَا)، وجذره العربي نقس لا يُفسِّر دلالته
            مباشرةً.
        - word: "حظر"
          root: "حظر"
          maqayis_quote: >-
            «الْحَاءُ وَالظَّاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْمَنْعِ.
            يُقَالُ حَظَرْتُ الشَّيْءَ أَحْظُرُهُ حَظْرًا، فَأَنَا حَاظِرٌ
            وَالشَّيْءُ مَحْظُورٌ. قَالَ اللَّهُ تَعَالَى:
