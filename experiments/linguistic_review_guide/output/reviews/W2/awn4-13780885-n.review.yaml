      decision: revise
      reason: >
        التعريف ترجمة حرفية ركيكة: «تم إنشاؤها» لا تُستخدم في سياق الإنتاج السلعي،
        والتركيب «كمية شيء ما» مبهم. يحتاج إعادة صياغة بأسلوب معجمي عربي.
    authored:
