# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13780885-n
# output / yield / production — كمية الإنتاج
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي ترجمة حرفية من الإنجليزية: «تم إنشاؤها» لا تناسب دلالة الإنتاج؛ الصواب «أُنتِجت» أو «حُصِّلت»"
      - "اللمّات الثلاث دون تشكيل كامل"
      - "نتاج في أصله للحيوان (ما تضعه البهائم) ثم توسّع مجازاً؛ ينبغي التنبيه على الفرق"
    observations: >
      المجموعة تدلّ على الكمية المنتَجة من سلعة في فترة زمنية. المفهوم أصيل في العربية
      وله ألفاظ تراثية غنية (غلّة، محصول، حصيلة). التعريف الحالي ركيك لأنه ترجمة حرفية،
      و«إنشاء» لا تُستخدم في سياق الإنتاج السلعي. اللمّات الثلاث (إنتاج، محصول، نتاج)
      صحيحة المبدأ لكنها تحتاج تشكيلاً وتمييزاً دلالياً دقيقاً.

  blind_candidates:
    - lemma: "غَلَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر غ ل ل على وزن فَعْلة، تدلّ على ما يحصل من ريع أرض أو دخل؛
        مصطلح تراثي كلاسيكي للمحصول والعائد
    - lemma: "حَصِيلَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ح ص ل على وزن فَعِيلة، تدلّ على ما حُصِّل من مال أو جهد؛
        مستخدمة في الاقتصاد والهندسة المائية بمعنى yield
    - lemma: "نَاتِج"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن ت ج على وزن فَاعِل، اسم فاعل بمعنى المُنتَج؛
        شائع في الاقتصاد بمعنى product (الناتج القومي)
    - lemma: "مَرْدُود"
      generation_method: ishtiqaq
      justification: >
        من الجذر ر د د على وزن مَفْعُول، يدلّ على ما يعود من عملية إنتاجية؛
        مستخدم في المصطلحات الحديثة بمعنى output وyield


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "إِنْتَاج"
      confirm:
        - text: "«ما ينتج من عملية صناعية أو زراعية أو نحوهما»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
        - text: "«كل العمليات الداخلة في تحضير المنتج النهائيّ من استقبال المواد إلى التعبئة والعنونة والتغليف»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
        - text: "«إنتاج» = production في معاجم الاقتصاد والتجارة والنفط والمياه والطب والزراعة"
          source: "ARABTERM (عدة معاجم)"
      expands:
        - text: "«عملية خلق وابتكار قياسا على قواعد النحو في لغة معينة»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "دلالة لسانية مجازية للإنتاج تتجاوز المعنى السلعي"

    - lemma: "مَحْصُول"
      confirm:
        - text: "«الحاصل ما بقي من الشيء الخلاصة»"
          source: "المعجم الوسيط"
        - text: "«محصول» = yield في مسرد الجغرافيا والتاريخ"
          source: "ARABTERM الجغرافيا"
        - text: "«نباتات تم زرعها وتنميتها لكي تحصد» = crop"
          source: "مسرد المناخ والبيئة"
      expands:
        - text: "«جاء في القاموس المحيط وتبعه الوسيط وغيره أن المحصول هو الحاصل: مفعول بمعنى فاعل، وبذلك يكون المثال الثاني فصيحًا»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "تأكيد فصاحة محصول بمعنى الحاصل، مفعول بمعنى فاعل"

    - lemma: "نِتَاج"
      confirm:
        - text: "«ثمرة الشيء»"
          source: "المعجم الوسيط"
        - text: "«نتاج» = output في المعجم الموحد لمصطلحات التجارة والمحاسبة"
          source: "ARABTERM التجارة"
        - text: "«النِّتاج: .أ» محصول؛ غلّة. .ب» نتاج أنثى الحيوان»"
          source: "المورد الحديث (مادة produce)"
      contradicts:
        - text: "«النِّتَاج: هو للحيوان كالحمل للإنسان ومنه لا يجوز بيع الحمل والنِّتاج فالنتاج اسم لما تضعه البهائم»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "الأصل الفقهي يخصّص النتاج بالحيوان، لكن التوسّع المجازي لثمرة الشيء مطلقاً مقبول حديثاً"

    # ── المرشحات ──
    - lemma: "غَلَّة"
      confirm:
        - text: "«الدَّخل من كراء دار أو ريع أرض»"
          source: "المعجم الوسيط"
        - text: "«كل ما يحصل من ريع أرض أو كرائها أو أجرة غلام ونحو ذلك»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«غلّة المحاصيل» = crop yield"
          source: "ARABTERM التجارة والزراعة"
      contradicts:
        - text: "«الغلة: ما يرده بيت المال ويأخذه التجار من الدراهم»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "الغلة في الأصل دخل مالي من عقار أو تجارة، لا كمية المنتَج ذاتها"

    - lemma: "حَصِيلَة"
      confirm:
        - text: "«حصيلة الضرائب وحصيلة الأرباح: ما حصل منها البقية»"
          source: "المعجم الوسيط"
        - text: "«حصيلة» = crop / yield / production"
          source: "المعجم الموحد لمصطلحات المياه"
      contradicts:
        - text: "«الحصيل. يقال: حصيلة الضرائب وحصيلة الأرباح بقيّة الشيء اللبّ يخرج من القشور»"
          source: "المعجم الكبير"
          conflict: "الحصيلة تدلّ على ما تبقّى وما جُمع من مال، لا على كمية ما أُنتج"

    - lemma: "نَاتِج"
      confirm:
        - text: "«أي شيء ينتجه العمل أو الجهد أو نتيجة لفعل أو عملية ما» = product"
          source: "مسرد التربية (ARABTERM)"
        - text: "«ناتج» = product في المعجم الموحد لمصطلحات الاقتصاد"
          source: "ARABTERM الاقتصاد"
      contradicts:
        - text: "«ناتج» = outcome في المعجم الموحد لمصطلحات الرياضيات والفلك"
          source: "ARABTERM الرياضيات"
          conflict: "في الرياضيات يدلّ على النتيجة الحسابية لا الكمية المنتجة"

    - lemma: "مَرْدُود"
      confirm:
        - text: "«مردود» = output في مسرد التربية"
          source: "ARABTERM التربية"
        - text: "«نتاج؛ محصول؛ مردود» = output في المورد الحديث"
          source: "المورد الحديث"
        - text: "«مردود، محصول» = yield — «نسبة الخرج إلى الدخل»"
          source: "المعجم الموحد للفيزياء"
      contradicts:
        - text: "«مردود» = efficiency / rendement في معاجم الكيمياء والطاقة"
          source: "ARABTERM الكيمياء والطاقة"
          conflict: "في العلوم التطبيقية يدلّ على الكفاءة والعائد لا على الكمية المطلقة"
        - text: "«المرْدُودُ: ما لا يرد عليه ولا يحسب له»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المعنى الكلاسيكي سلبي (المرفوض)، مخالف للدلالة الحديثة"


# ── المرحلة ٣: التحليل اللغوي ────────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "إِنْتَاج"
      decision: confirmed
      decision_reason: >
        مصدر الفعل أنتجَ على وزن إفعال، مثبت في عشرات المعاجم المصطلحية الحديثة
        بمعنى production في ميادين الاقتصاد والصناعة والزراعة والطب. يدلّ على العملية
        وعلى كمية المُنتَج معاً. لا خلاف في فصاحته.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على عملية الإنتاج ومقدار المُنتَج الكلّي؛ أعمّ من محصول (الذي يختصّ بالزراعة)
        وأكثر تقنية من نتاج (الذي يميل إلى الثمرة والنتيجة).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِنْتَاج"

    - lemma: "مَحْصُول"
      decision: confirmed
      decision_reason: >
        اسم مفعول بمعنى فاعل (الحاصل)، مثبت في الوسيط والقاموس المحيط ومعجم الصواب اللغوي.
        مستخدم في المصطلحات الحديثة بمعنى crop وyield وharvest. فصيح بإقرار مجمع اللغة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستخدم خاصة في سياق الإنتاج الزراعي (المحصول الزراعي)، ويدلّ على ما يُحصد
        ويُجمع من الأرض أو من عمل ما. أخصّ من إنتاج وأكثر ارتباطاً بالحصاد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَحْصُول"

    - lemma: "نِتَاج"
      decision: confirmed
      decision_reason: >
        مصدر نَتَجَ، أصله في ولادة الحيوان ثم توسّع مجازاً إلى ثمرة الشيء عموماً.
        الوسيط يعرّفه بـ«ثمرة الشيء»، والمورد الحديث يعادله بـ output وproduce.
        مثبت في مصطلحات التجارة بمعنى output. التوسع المجازي مقبول ومستقرّ.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ على ثمرة العمل ونتيجته بمعنى عام، مع ظلال من المعنى الأصلي (نتاج الحيوان).
        أقرب إلى output بوصفه ما يخرج من عملية ما، بينما إنتاج يركّز على العملية
        ومحصول على الجمع والحصاد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِتَاج"

    # ── المرشحات ──
    - lemma: "غَلَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الغلّة في المعاجم الكلاسيكية والحديثة تدلّ على الدخل المالي من عقار أو أرض
        (كراء، ريع، أجرة)، لا على كمية المنتَج ذاتها. وإن استُخدمت مرادفاً لمحصول
        في بعض السياقات، فدلالتها الأصلية مالية ريعية لا إنتاجية كمّية.
      evidence_assessment:
        case: mixed

    - lemma: "حَصِيلَة"
      source: stage1
      decision: removed
      decision_reason: >
        الحصيلة تدلّ على ما حُصِّل وجُمع من مال أو نتائج (حصيلة الضرائب، حصيلة الأرباح)،
        وهي أقرب إلى المجموع المُحصَّل منها إلى كمية الإنتاج. دلالتها تحصيلية جامعة
        لا إنتاجية.
      evidence_assessment:
        case: mixed

    - lemma: "نَاتِج"
      source: stage1
      decision: removed
      decision_reason: >
        ناتج (اسم فاعل) يتداخل دلالياً مع نتاج (مصدر) الموجود في المجموعة. في الاستعمال
        الحديث يُستخدم صفةً (الناتج القومي) أو بمعنى product (المُنتَج الفردي)
        أو outcome (النتيجة). إضافته لا تضيف تمييزاً دلالياً كافياً عن نتاج.
      evidence_assessment:
        case: mixed

    - lemma: "مَرْدُود"
      source: stage1
      decision: removed
      decision_reason: >
        المردود في المعاجم الكلاسيكية يدلّ على المرفوض والمُرجَع، وفي الاستعمال
        الحديث يتأرجح بين العائد (return) والكفاءة (efficiency/rendement).
        دلالته على الكمية المنتجة ضعيفة مقارنة بدلالته على النسبة والعائد.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
