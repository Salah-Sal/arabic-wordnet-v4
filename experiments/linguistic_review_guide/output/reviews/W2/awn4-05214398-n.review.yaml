# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset ID : awn4-05214398-n
# ILI       : i64330
# POS       : n
# Lemmas    : عَجْز ، عَدَم قُدْرَة
# English   : inability, unfitness
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. اللمّات المرشحة — توليد أعمى انطلاقاً من التعريف فقط
  #    (قبل الاطلاع على لمّات synset_info)
  blind_candidates:
    - lemma: "قُصُور"
      generation_method: ishtiqaq
      justification: >
        مشتقٌّ من الجذر (ق ص ر) على وزن فُعُول، الدالّ على معنى قياسي في العربية وهو
        عدم بلوغ الشيء مداه. يُعبَّر به عن النقصان في الطاقة أو الكفاءة عن الأداء
        المطلوب، وهو مصطلح مسكوك ثابت في معاجم الطب والتقنية والفقه.

    - lemma: "خَوَر"
      generation_method: majaz
      justification: >
        أصله الرخاوة والضعف في الجسم والرأي (خار يَخور خُئوراً إذا ضعف)؛ يمكن توظيفه
        مجازياً للدلالة على الوَهَن وانعدام القوة على الأداء. إلا أنه قد يظل قاصراً
        عن الدلالة القاطعة على انعدام القدرة كلياً.

    - lemma: "إِعَاقَة"
      generation_method: ishtiqaq
      justification: >
        مشتقٌّ من الجذر (ع و ق) على وزن إِفَالَة، من عاقَه أي حبسه ومنعه من الفعل؛
        يدلّ على الحالة التي تعيق المرء عن أداء ما هو مطلوب منه.

    - lemma: "اِنعِدامُ الكَفَاءَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من (انعدام) + (الكفاءة) يُعبّر عن الحالة التي تنعدم فيها الأهلية
        والطاقة للقيام بالفعل؛ يُقابل "unfitness" بوجه خاص.

  # ب. التقييم الأولي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - >
        «عَدَم قُدْرَة» عبارةٌ وصفية حرّة لا مصطلحٌ مسكوك: يُمكن إبدال «عدم» بـ«انعدام»
        أو «غياب» وتبقى العبارة صحيحة وصفياً، مما يُسقطها في اختبار السكّ؛ ولم
        تُسجَّل بوصفها مدخلاً مستقلاً في أيٍّ من المعاجم المُستعلَمة.
      - >
        «عَجْز» متعدد الدلالات: يدلّ أيضاً على مؤخّر الجسم وعلى العجز المالي (deficit)،
        مما يستوجب التمييز في السياق عند الاستعمال.
      - >
        الترابط مع المجموعة الأم (جَوْدَة / نَوْعِيَّة = quality) صحيحٌ هيكلياً في
        WordNet (العجز صفةٌ من صفات الشخص)، لكنّه قد يبدو غير مألوف في الاستعمال
        المعجمي العربي إذ يُصنَّف العجز عادةً تحت الأحوال النفسية أو الجسدية.
    observations: >
      المجموعة تُمثّل مفهوماً أصيلاً في العربية (العجز نقيض الحزم، والقصور نقيض
      الكمال). غير أنّ اختيار «عَدَم قُدْرَة» لمّةً مستقلة يُربك البنية المعجمية
      لأنّه مجرد وصف لا اسم مصطلحي. أنسب منه «قُصُور» الذي له جذرٌ عربيٌّ صميم
      وشواهد معجمية كلاسيكية وحديثة تُثبت استعماله بمعنى العجز والنقصان عن الأداء.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمّة الموجودة: عَجْز ──
    - lemma: "عَجْز"
      confirm:
        - text: >
            «الْعَيْنُ وَالْجِيمُ وَالزَّاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا
            عَلَى الضَّعْفِ، وَالْآخَرُ عَلَى مُؤَخَّرِ الشَّيْءِ. فَالْأَوَّلُ
            عَجِزَ عَنِ الشَّيْءِ يَعْجِزُ عَجْزًا، فَهُوَ عَاجِزٌ، أَيْ
            ضَعِيفٌ.»
          source: "مقاييس اللغة لابن فارس (entry_id=987652)"
        - text: >
            «العَجْزُ: الضعف. تقول: عَجَزْتُ عن كذا أعْجِزُ بالكسر عَجْزاً
            ومَعْجِزَةً. والعَجْزُ: نقيضُ الحَزْم.»
          source: "تاج اللغة وصحاح العربية للجوهري (entry_id=982478)"
        - text: >
            «عَجَزَ عَنِ الشَّيْءِ عَجْزًا وَمَعْجَزَةً: لم يَقْدِرْ عليه.»
          source: "المغرب في ترتيب المعرب للمُطرِّزي (entry_id=784270)"
        - text: >
            «العَجْز والقصور: عدم قدرة.»
          source: "المورد الحديث (2008) — مدخل inability (entry_id=694468)"
        - text: >
            «عَجْز؛ عدم قدرة — incapacity.»
          source: "المورد الحديث (2008) — مدخل incapacity (entry_id=694565)"
        - text: >
            «disability — عَجْز.»
          source: "موسوعة الكهرباء IEC 60050 (entry_id=527161)"
        - text: >
            «disability — عَجْز.»
          source: "المعجم الطبي الموحد (2009) (entry_id=568090)"
      expands:
        - text: >
            «العَجُزُ والعِجْزُ: نقيض الحَزْمِ. عَجَز عَن الأمرِ يَعْجِزُ،
            وعَجِزَ عَجْزاً فيهما. ورجل عَجُزٌ وعَجِزٌ: عاجزٌ.»
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي (entry_id=993435)"
          addition: >
            يُثبت وزن عَجُز وعَجِز للدلالة على صفة العاجز، مما يُبيّن أن
            الدلالة تشمل صفة الشخص لا مجرد الحدث.

    # ── اللمّة الموجودة: عَدَم قُدْرَة ──
    - lemma: "عَدَم قُدْرَة"
      evidence_status: "no_material_found"
      # ملاحظة: لم يُعثر على هذه العبارة مدخلاً مستقلاً في أيٍّ من المعاجم
      # المُستعلَمة (760,660 مدخل). تردّ فقط ضمن تعريفات ومقابلات، وليست مصطلحاً مسكوكاً.

    # ── المرشح من المرحلة ١: قُصُور ──
    - lemma: "قُصُور"
      confirm:
        - text: >
            «الْقَافُ وَالصَّادُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا
            يَدُلُّ عَلَى أَلَّا يَبْلُغَ الشَّيْءُ مَدَاهُ وَنِهَايَتَهُ،
            وَالْآخَرُ عَلَى الْحَبْسِ. وَالْأَصْلَانِ مُتَقَارِبَانِ.»
          source: "مقاييس اللغة لابن فارس (entry_id=988289)"
        - text: >
            «القُصورُ: العجزُ.»
          source: "التعريفات الفقهية للبركتي (entry_id=835493)"
        - text: >
            «القُصورُ: الخُلُوُّ عن المعاني الباعثة على تحري الخيرات والفضائل،
            وعدم التمكّن من أسبابها.»
          source: "معجم مقاليد العلوم للسيوطي (entry_id=807351)"
        - text: >
            «قصور: حالة نقص الأداء، مثل: قصور الكظر insufficiency, adrenal؛
            قصور القلب insufficiency, cardiac: نقص كفاءة عضلة القلب.»
          source: "معجم المصطلحات الطبية ج.3 (1997) (entry_id=742299)"
        - text: >
            «عَجْز؛ قصور؛ عدم قدرة — inability.»
          source: "المورد الحديث (2008) (entry_id=694468)"
        - text: >
            «قصور — inadequacy.»
          source: "مسرد علم الاجتماع والأنثروبولوجيا، ALECSO (entry_id=399913)"
        - text: >
            «قصور — insufficiency.»
          source: "المعجم الطبي الموحد (2009) (entry_id=595395)"
      expands:
        - text: >
            «(1) عدم كفاية [أخلاقية أو عقلية]. (2) نَقْص؛ قصور [في المؤن].
            (3) القصور: عجز عضوٍ من أعضاء الجسد عن أداء وظيفته بصورة سويّة.»
          source: "المورد الحديث (2008) — مدخل insufficiency (entry_id=695555)"
          addition: >
            يُظهر أن القصور أوسع من العجز: يشمل الجزئي والكلي، وينتقل من
            النقصان في المؤن والأداء إلى الإخفاق الكامل.

    # ── المرشح من المرحلة ١: خَوَر ──
    - lemma: "خَوَر"
      contradicts:
        - text: >
            «أصلان: أحدهما يدل على صوت [خوار الثور]، والآخر على ضعف.
            الخوار: الضعيف من كل شيء.»
          source: "مقاييس اللغة لابن فارس (entry_id=986180)"
          conflict: >
            الأصل الدلالي لـ«خور» هو الرخاوة والضعف المادي (القصبة الخوّارة،
            الرمح الخوار)، وليس انعدام القدرة على الأداء؛ والاستعمال الطبي
            الوحيد (hypobulia = نقص الإرادة) مختلف عن المفهوم المستهدف.
        - text: >
            «الخُوَار: صوت الثور. وخار الرجل يَخور خُئوراً: ضَعُفَ وانكسر وفَتَر.»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (entry_id=858045)"
          conflict: >
            الضعف (خور) أعمّ من انعدام القدرة على الأداء؛ يُشير إلى الفتور
            النفسي لا العجز عن الفعل تحديداً.

    # ── المرشح من المرحلة ١: إِعَاقَة ──
    - lemma: "إِعَاقَة"
      evidence_status: "no_material_found"
      # ملاحظة: مُسجَّلة في معاجم حديثة لكن بمعنى «disability» الجسدي/الذهني
      # لا «inability» العام (عدم القدرة على أداء فعل ما). الدلالة مختلفة.

    # ── المرشح من المرحلة ١: انعدام الكفاءة ──
    - lemma: "اِنعِدامُ الكَفَاءَة"
      evidence_status: "no_material_found"
      # ملاحظة: لا وجود له كمدخل معجمي مستقل؛ عبارة وصفية حرة.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── عَجْز (موجود) ──
    - lemma: "عَجْز"
      decision: confirmed
      decision_reason: >
        مصطلح عربي أصيل ذو جذر راسخ (ع ج ز)، موثَّق في مقاييس اللغة والصحاح
        والمحكم وأساس البلاغة بدلالة الضعف وعدم القدرة على الأداء. يُقابل
        «inability» في المعاجم الحديثة (المورد الحديث). تشكيله الحالي عَجْز
        صحيح للمّة الاسمية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        عَجْز يدلّ على انعدام القدرة انعداماً تاماً أو جوهرياً، وهو نقيض الحزم
        في التراث العربي. يُستعمل للدلالة على القصور الذاتي في الطاقة والاستطاعة،
        وغالباً يُوحي بعدم القدرة المطلقة لا مجرد النقصان.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَجْز"

    # ── عَدَم قُدْرَة (موجود) ──
    - lemma: "عَدَم قُدْرَة"
      decision: removed
      decision_reason: >
        تخفق هذه العبارة في اختبار السكّ: يمكن إبدال «عدم» بـ«انعدام» أو «غياب»
        أو «قلّة» وتبقى وصفاً صحيحاً للحالة، مما يثبت أنّها عبارة وصفية حرة لا
        مصطلح مُسكَّك. لم تُسجَّل مدخلاً مستقلاً في أي معجم من المعاجم المُستعلَمة
        (760,660 مدخل). كما يخفق اختبار التثبيت المعجمي: لا وجود لها كوحدة معجمية.
        يحلّ محلها «قُصُور» الموثَّق معجمياً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── قُصُور (مرشح المرحلة ١) ──
    - lemma: "قُصُور"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك ذو جذر صميم (ق ص ر)، جمع شواهد قوية من مقاييس اللغة
        («يدل على ألا يبلغ الشيء مداه»)، والتعريفات الفقهية («القصور: العجزُ»)،
        والمعجم الطبي («حالة نقص الأداء»). يُدرَج في المورد الحديث ضمن مقابلات
        «inability» و«insufficiency». يُكمّل عَجْز في المجموعة بتغطية دلالة
        النقصان الجزئي مقابل الانعدام الكلي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        قُصُور يُشير إلى التقصير والنقصان عن بلوغ المطلوب؛ قد يكون جزئياً أو
        قابلاً للتحسين، ويُستعمل كثيراً في السياقات الطبية والتقنية (قصور القلب،
        قصور الكلى). يختلف عن عَجْز في أن الأخير يُوحي بالانعدام الكلي للقدرة.
      actions:
        - command: create_entry
          params:
            lemma: "قُصُور"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05214398-n"

    # ── خَوَر (مرشح المرحلة ١) ──
    - lemma: "خَوَر"
      source: stage1
      decision: removed
      decision_reason: >
        جذر خور يدل أصلاً على الصوت (خوار الثور) وعلى الرخاوة المادية؛ والمعنى
        المجازي (الضعف) أعمّ وأبعد من «انعدام القدرة على الأداء». الاستعمال
        الطبي الوحيد (hypobulia) يُقابل «نقص الإرادة» وليس «inability». لا ينجح
        اختبار الاستبدال في سياقات عدم القدرة.
      evidence_assessment:
        case: contradicts_only

    # ── إِعَاقَة (مرشح المرحلة ١) ──
    - lemma: "إِعَاقَة"
      source: stage1
      decision: removed
      decision_reason: >
        إِعاقة مصطلحٌ تقني يُقابل «disability» (الإعاقة الجسدية أو الذهنية)،
        وهو مفهوم أضيق وأكثر تخصصاً من «inability» العام. الفارق دلالي: الإعاقة
        حالة طبية معترف بها، أما العجز/القصور فهما أوصاف عامة لانعدام القدرة.
      evidence_assessment:
        case: no_material

    # ── انعدام الكفاءة (مرشح المرحلة ١) ──
    - lemma: "اِنعِدامُ الكَفَاءَة"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تُخفق في اختبار السكّ (يمكن تبديل «انعدام» بـ«قلة» أو
        «غياب» أو «نقص» والعبارة تبقى وصفاً صالحاً). لم تُسجَّل كمدخل معجمي
        مستقل. علاوة على ذلك، «الكفاءة» تُقابل competence/efficiency لا ability
        تحديداً.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "افتقاد القدرة على الأداء"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمةٌ حرفية للإنجليزية (lacking the power to perform)،
        وإن كانت صحيحة فإنها تفتقر إلى الجنس القريب والفصل النوعي بأسلوب المعجم
        الوسيط، كما أن «افتقاد» أقل شيوعاً من «انعدام» في صياغة التعريفات
        المعجمية العربية. يحتاج أيضاً إلى تمييز المفهوم عن النقص الجزئي (قصور).
    authored:
      - type: terminological
        text: >
          انعدامُ القُدرةِ لدى الشَّخصِ على أداءِ فِعلٍ أو إنجازِ مَهَمَّةٍ،
          أو قُصورُها عن الحدِّ اللازمِ للأداءِ السَّليم.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          ضَعفٌ أو قُصورٌ يَحولُ دونَ قدرةِ المرءِ على بُلوغِ الغايةِ
          أو إنجازِ ما يُطلَبُ منه.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05214398-n"
          definition_index: 0
          text: >
            انعدامُ القُدرةِ لدى الشَّخصِ على أداءِ فِعلٍ أو إنجازِ مَهَمَّةٍ،
            أو قُصورُها عن الحدِّ اللازمِ للأداءِ السَّليم.
      - command: add_definition
        params:
          synset_id: "awn4-05214398-n"
          text: >
            ضَعفٌ أو قُصورٌ يَحولُ دونَ قدرةِ المرءِ على بُلوغِ الغايةِ
            أو إنجازِ ما يُطلَبُ منه.

  examples:
    per_lemma:
      - lemma: "عَجْز"
        examples:
          - text: "أقرَّ المديرُ بعجزِهِ عن إنجازِ المشروعِ في المهلةِ المحدَّدة."
            type: usage
      - lemma: "قُصُور"
        examples:
          - text: "كشفت التقاريرُ عن قصورٍ واضحٍ في الكوادرِ المؤهَّلةِ لإدارةِ الأزمة."
            type: usage
    actions:
      - command: add_sense_example
        params:
