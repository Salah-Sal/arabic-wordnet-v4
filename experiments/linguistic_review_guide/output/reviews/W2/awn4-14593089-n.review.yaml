stage1_review:
  assessment:
    concerns:
      - "المصطلح الحالي 'تغاير الزيجوت' يميل لوصف الحالة الصفاتية (adjectival state) أكثر من كونه مصدراً يعبر عن المفهوم المجرد (heterozygosity)."
      - "تعبير 'اختلاف الألائل' هو جملة وصفية أكثر من كونه وحدة معجمية مسكوكة في المعاجم اللغوية، رغم شيوعه العلمي."
    observations: "المصطلحات الوراثية في العربية تتراوح بين التعريب المباشر للألفاظ الأعجمية (زيجوت، أليل) والاشتقاق من جذور عربية تعبر عن التباين والخلط (تغاير، تباين، خلط)."
  blind_candidates:
    - lemma: "تَغَايُرُ الزِّيجُوتَاتِ"
      generation_method: tarkib
      justification: "تعبير مركب يعبر عن تعدد أو اختلاف الزيجوتات في الكائن."
    - lemma: "التَّبَايُنُ الأَلِيلِيُّ"
      generation_method: tarkib
      justification: "توصيف علمي دقيق يربط بين حالة التباين ووحدات الأليل الوراثية."
    - lemma: "الخَلِيطِيَّةُ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'خليط' يعبر عن حالة الهجين أو الفرد الذي يحمل صفات متباينة، وهو مستخدم في الأدبيات الوراثية القديمة والمحدثة."
    - lemma: "تَبَايُنُ اللَّواقِحِ"
      generation_method: majaz
      justification: "استخدام اللواقح كبديل عربي لـ (Zygotes) مع التعبير عن الاختلاف بالتباين."

stage2_evidence:
  per_lemma:
    - lemma: "تَغَايُرُ الزِّيجُوتِ"
      confirm:
        - text: "حالة وجود زوج واحد أو أكثر من الأليلات المتباينة في الكائن."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "اخْتِلافُ الأَلائِلِ"
      expands:
        - text: "تفوق ملائمة متباين الأليلات على ملائمة متماثل الأليلات."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "يشير إلى تباين الأليلات كحالة وراثية."
    - lemma: "تَغَايُرُ الزِّيجُوتِيَّةِ"
      confirm:
        - text: "حالة تتميز بوجود ورثيات مختلفة في موقع معين يختص بتوريث سمة وراثية معينة."
          source: "معجم المصطلحات الطبية (1997)"
    - lemma: "الخَلِيطِيَّةُ"
      expands:
        - text: "الحالة الخلطية وراثيا بالنسبة لتغيرات تركيبية صبغية."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "استخدام الجذر (خلط) للتعبير عن الحالة الوراثية المتباينة."

