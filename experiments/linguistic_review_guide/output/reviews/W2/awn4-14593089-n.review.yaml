stage4_content:
  definition:
    current: "حالة كونه متغاير الزيجوت؛ وجود أليلين مختلفين لنفس الجين"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعتمد على اللفظ المعرف نفسه (دوران)، ويحتاج صياغة أكثر دقة وموسوعية."
    authored:
      - type: terminological
        text: "حالة وراثية تتمثل في وجود أليلين مختلفين لمورثة معينة في نفس الموقع على الصبغيات المتماثلة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "في علم الوراثة، هي الحالة التي يحمل فيها الكائن الحي نسختين متباينتين من جين معين، مما يؤدي غالباً إلى ظهور الصفة السائدة أو تفاعلات معقدة بين الأليلين."
  examples:
    per_lemma:
      - lemma: "تَغَايُرُ الزِّيجُوتِ"
        examples:
          - text: "يؤدي تغاير الزيجوت إلى ظهور صفات وراثية متنوعة في النسل الناتج عن تزاوج السلالات."
            type: usage
      - lemma: "اخْتِلافُ الأَلائِلِ"
        examples:
          - text: "يعتبر اختلاف الألائل مصدراً أساسياً للتنوع الوراثي في الجماعات الحيوية الطبيعية."
            type: usage
      - lemma: "تَغَايُرُ الزِّيجُوتِيَّةِ"
        examples:
          - text: "كشفت الفحوصات الجينية عن ارتفاع نسبة تغاير الزيجوتية في الأفراد المقاومين للمرض."
            type: usage
      - lemma: "الخَلِيطِيَّةُ"
        examples:
          - text: "تساهم الخليطية الوراثية في تحسين قدرة الكائن الحي على التكيف مع التغيرات البيئية المفاجئة."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14593089-n", definition_index: 0, text: "حالة وراثية تتمثل في وجود أليلين مختلفين لمورثة معينة في نفس الموقع على الصبغيات المتماثلة."}

