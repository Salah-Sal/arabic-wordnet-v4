      nuance_differentiation: "الأكثر شيوعاً وتداولاً وحيادية؛ يُستعمل في جميع الحقول العلمية دون تقييد، ويفيد معنى الارتباط التبادلي بإيجاز لفظي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرَابُط"

    - lemma: "تَعَالُق"
      source: stage1
      decision: confirmed
      decision_reason: "ثابت في المعجم الموحد لمصطلحات الكيمياء (1992) واللسانيات (2002) مقابل correlation، وأكده المورد الحديث كمرادف لارتباط. الجذر ع-ل-ق أصل كبير يدلّ على إناطة الشيء بالشيء، ووزن تَفَاعُل يضمن دلالة المشاركة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل في السياقات الأكثر تخصّصاً (الكيمياء، اللسانيات الإحصائية)؛ الجذر ع-ل-ق يُوحي بالتعلّق والتشابك أكثر من مجرد الربط، فيُفضّل حين يُراد التأكيد على عمق العلاقة بين المتغيرات"
      actions:
        - command: create_entry
          params:
            lemma: "تَعَالُق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَلَازُم"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ الجذر ل-ز-م يدلّ على المصاحبة الدائمة، فإنّ تلازم في الاستعمال المصطلحي يقابل coalescence في الأرصاد الجوية وco-occurrence في سياقات أخرى. لم يُثبت استعماله المستقل مقابل correlation في أيّ معجم موحد."

    - lemma: "تَقَارُن"
      source: stage1
      decision: removed
      decision_reason: "استقرّ استعماله المصطلحي على pairing/synapsis في علم الوراثة وcoupling في الطب، فإلحاقه بمعنى correlation يُحدث اشتراكاً لفظياً ضارّاً بدقة المصطلح."

    - lemma: "ارْتِبَاطِيَّة"
      source: stage1
