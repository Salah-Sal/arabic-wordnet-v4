# مراجعة المجموعة الترادفية — awn4-13863850-n (correlation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «ارتباط متبادل» تُقابل في مسرد المناخ والبيئة المصطلح الإنجليزي intercorrelation لا correlation، فقد تكون أدقّ للارتباط المتبادل بين متغيرات عدة لا للارتباط العام"
      - "اللمّة «ترابط» مشتركة دلالياً مع مفاهيم عدة: coherence وcoupling وinterconnection وassociation، ما يُوجب تدقيق حدود المعنى"
      - "المجموعة تفتقر إلى لمّة «تعالق» المستخدمة في الكيمياء واللسانيات مقابل correlation"
    observations: "المجموعة تصف مفهوم العلاقة المتبادلة (correlation) بين شيئين أو أكثر. اللمّتان الموجودتان كلتاهما من الجذر ر-ب-ط على وزن الافتعال والتفاعل. غير أن المفهوم يمتلك مترادفاً ثالثاً راسخاً في الاستعمال المصطلحي الحديث هو «تعالق» من الجذر ع-ل-ق. كما أنّ التعريف العربي الحالي ترجمة حرفية من الإنجليزية ويحتاج إلى صياغة معجمية أصيلة."
  blind_candidates:
    - lemma: "تَلَازُم"
      generation_method: ishtiqaq
      justification: "مصدر تَفَاعُل من الجذر ل-ز-م، يدلّ على ملازمة الشيء للشيء دائماً. قال ابن فارس: «اللام والزاء والميم أصل واحد صحيح، يدلّ على مصاحبة الشيء بالشيء دائماً». وزن التفاعل يُفيد المشاركة والتبادل."
    - lemma: "تَقَارُن"
      generation_method: ishtiqaq
      justification: "مصدر تَفَاعُل من الجذر ق-ر-ن، يدلّ على اقتران شيئين. جاء في المعجم الوسيط: «تَقَارَنَ الشيئان: تلازما». وزن التفاعل يؤكد التبادل."
    - lemma: "تَعَالُق"
      generation_method: ishtiqaq
      justification: "مصدر تَفَاعُل من الجذر ع-ل-ق، يدلّ على تعلّق الأشياء بعضها ببعض. الجذر يعني إناطة الشيء بالشيء، ووزن التفاعل يُضفي المشاركة. قال ابن فارس: «العين واللام والقاف أصل كبير صحيح يرجع إلى معنى واحد، وهو أن يُناط الشيء بالشيء العالي»."
    - lemma: "ارْتِبَاطِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «ارتباط»، يُحوّل المصدر إلى مفهوم مجرد يدلّ على صفة الارتباط المتبادل ذاتها. اللاحقة -يّة تُنتج أسماء المفاهيم المجردة."


stage2_evidence:
  per_lemma:
    - lemma: "ارْتِبَاط مُتَبَادَل"
      confirm:
        - text: "«علاقة تربط بين قيم متغيرين اثنين أو متغيرات، مستمرة في مجال قياس إما مفتوح أو محدود.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      expands:
        - text: "«(1) يرتبط [بعلاقةٍ متبادَلة] (2) يُرابط: يَرْبط بين شيئين بصورة نظامية (3) يُقيم علاقةً متبادلةً بين (4) المتلازم: أحد شيئين متلازمَيْن (5) متلازم؛ مترابط؛ متعالق.»"
          source: "المورد الحديث (2008)"
          addition: "المورد يؤكد أن correlate يُترجم بـ«يرتبط بعلاقة متبادلة» ويعطي المترادفات: متلازم، مترابط، متعالق"

    - lemma: "تَرَابُط"
      confirm:
        - text: "«قياس مدى تشابه متغيرين عشوائيين (أو إشارتين).»"
          source: "مسرد التربية (ArabTerm)"
        - text: "«درجة العلاقة، أو التوافق، بين سلسلتي معطيات أو أكثر.»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
        - text: "«التنسيق بين وظائف أجزاء متشابهة.»"
          source: "معجم المصطلحات الطبية (1985)"
      expands:
        - text: "«تتابع مجموعات ترتبط، بعضها ببعض، كتلاحق ظروف وأحداث قصصية، حسب قواعد انسجامية تتوخى في خطواتها بلوغ صورة كاملة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يتوسع الاستعمال اللساني ليشمل الترابط السردي والنصي"
        - text: "«(ترابط) المَاء فِي الْمَكَان لم يبرحه ولم يخرج منه»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي للفعل تَرَابَطَ في المعاجم الكلاسيكية هو ثبات الماء في مكانه، والمعنى المصطلحي الحديث (correlation) توسّع دلالي"

    - lemma: "تَلَازُم"
      expands:
        - text: "«إرتباط؛ تلازم» = correlation"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "تلازم يرد مقروناً بارتباط كمترادف لـ correlation في المجال الزراعي"
        - text: "«coalescence» = تلازم"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
          addition: "في الأرصاد الجوية، تلازم يُقابل coalescence (التحام القطرات) لا correlation"

    - lemma: "تَقَارُن"
      contradicts:
        - text: "«عملية تزاوج بين صبغيين متماثلين يبدأ من نهايتهما الأوليتين ويستمر على طولهما»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          conflict: "تقارن في الاستعمال المصطلحي الحديث يقابل pairing/synapsis في علم الوراثة، لا correlation"
      expands:
        - text: "«تَقَارَنَ الشيئان: تلازما»"
          source: "المعجم الوسيط"
          addition: "المعنى اللغوي العام (التلازم) يقترب من المفهوم لكن الاستعمال المصطلحي استقرّ على دلالة بيولوجية مختلفة"

    - lemma: "تَعَالُق"
      confirm:
        - text: "«في تحليل إحصائي لعينة لغوية، ارتباط الخاصية بالأخرى حيث لا تتغير قيمتها إلا في الاتجاه نفسه أو في الاتجاه المتعارض.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(1) رَبْط؛ إقامةُ علاقةٍ متبادلة بين (2) ارتباط؛ تعالق (3) الارتباط (إحص) (4) علاقة متبادَلة.»"
          source: "المورد الحديث (2008)"
          addition: "المورد يُدرج تعالق صراحةً كمرادف لـ correlation إلى جانب ارتباط"

    - lemma: "ارْتِبَاطِيَّة"
      contradicts:
        - text: "«associativity» = ارتباطية"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
          conflict: "ارتباطية في الاستعمال المصطلحي تقابل associativity (التجميعية/الترابطية) لا correlation"


stage3_analysis:
  per_lemma:
    - lemma: "ارْتِبَاط مُتَبَادَل"
      decision: confirmed
      decision_reason: "المركب الإضافي-الوصفي يعبّر بوضوح عن العلاقة المتبادلة بين شيئين. وإن كان مسرد المناخ يخصّه بـ intercorrelation، فإنّ المورد الحديث يؤكد أنّ «يرتبط بعلاقة متبادلة» تقابل correlate. المركب صالح للدلالة على correlation بمعناها العام."
