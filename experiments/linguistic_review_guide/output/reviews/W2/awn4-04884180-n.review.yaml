# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي 'صفة كون الشخص مخلصاً' دائري؛ إذ يستعين بلفظ 'مخلص' المشتق من المدخل الأول (إخلاص) لوصف المجموعة ذاتها."
      - "التعريف مفرط في الإيجاز ولا يُحدد الفصل النوعي الذي يُميّز هذه المجموعة عن مجموعات مجاورة كالصدق والنزاهة."
      - "غياب لمّة 'أمانة' لافت، وهي مُدرجة في المعاجم الحديثة ضمن مقابلات fidelity مباشرةً."
    observations: "تضم المجموعة لمّتين من أكثر ألفاظ الوفاء جذوراً في التراث العربي. غير أن 'إخلاص' تنصبّ في التراث الكلاسيكي على صفاء النية في العبادة وترك الرياء، فيما يُمثّل 'وفاء' الأدق تعبيراً عن faithfulness/fidelity بمعنى الثبات على العهود والمودة في العلاقات الاجتماعية. كلاهما وارد في المصادر المعجمية بالمعنيين. وتوثّق المعاجم الحديثة 'أمانة' أيضاً كمقابل مباشر لـfidelity، مما يُرشّحها للإضافة."
  blind_candidates:
    - lemma: "أَمَانَة"
      generation_method: ishtiqaq
      justification: "مشتقة من جذر (أمن) على وزن فَعَالَة الدال على الصفات الجوهرية الراسخة؛ تحمل معنى الجدارة بالثقة وضد الخيانة، وهو المحور الأساسي لصفة الإخلاص/الوفاء في العلاقات."
    - lemma: "وَلَاء"
      generation_method: ishtiqaq
      justification: "مشتق من جذر (ولي) على وزن فَعَال، يدل على المحبة والنصرة والقرب؛ أحد تعبيرات الولاء والإخلاص في العربية الكلاسيكية والمعاصرة."
    - lemma: "تَفَانٍ"
      generation_method: ishtiqaq
      justification: "مصدر تَفَانَى على وزن تَفَاعُل من جذر (فني)، يدل على الانقطاع الكلي للغير وبذل الذات؛ بُعد من أبعاد الإخلاص التام في العربية المعاصرة."
    - lemma: "صِدْق"
      generation_method: majaz
      justification: "يُستعمل مجازاً في سياق الوفاء والانتماء؛ يرتبط في التراث الصوفي بمعنى الثبات على العهد والتجرد في المعاملة، فيُقال 'صدقه النصيحة والإخاء' أي أخلصهما له."


