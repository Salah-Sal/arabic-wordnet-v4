stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان 'إعتام' و'قتامة' ليستا الأدق في السياق العلمي الفيزيائي لـ opacity، حيث أن 'عَتَامة' هي المصطلح القياسي."
      - "'إعتام' قد يُفهم كفعل (عملية) وليس كصفة (خاصية) في بعض السياقات."
    observations: "المفهوم يتعلق بالخاصية الفيزيائية للمادة التي تحجب الضوء. بينما 'قتامة' تشير أكثر إلى اللون الداكن أو الغبرة، و'إعتام' يشير إلى صيرورة الشيء معتماً، فإن 'عَتامة' هي المصطلح المخصص لهذه الجودة."
  blind_candidates:
    - lemma: "عَتَامَة"
      generation_method: ishtiqaq
      justification: "المصطلح العربي القياسي المقابل لـ opacity، مشتق من الجذر (عتم) الذي يدل على الظلمة والمنع."
    - lemma: "لَا شَفَافِيَّة"
      generation_method: tarkib
      justification: "ترجمة اصطلاحية دقيقة لـ opacity (non-transparency) مستخدمة بكثرة في السياقات العلمية."
    - lemma: "كُمدَة"
      generation_method: ishtiqaq
      justification: "مصطلح معجمي قديم ومعاصر يشير إلى ذهاب صفاء اللون وتغيره بحيث لا يشف، ويستخدم في سياقات الاستشعار عن بعد."
    - lemma: "تَعْتِيم"
      generation_method: ishtiqaq
      justification: "مصدر يدل على جعل الشيء معتماً أو الدرجة التي يمنع بها الضوء (opacity rating)."

stage2_evidence:
  per_lemma:
    - lemma: "إِعْتَام"
      evidence_status: "no_material_found"
    - lemma: "قَتَامَة"
      confirm:
        - text: "«قَتامة الجلد، قتامة الشعر»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«وكلما ازدادت قتامة التربة ارتفع محتواها من المواد العضوية... تظهر الألوان القاتمة والرمادية تهوية محدودة»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "تربط القتامة باللون الغامق الذي يقلل الرؤية أو يعكس قلة الأكسجين."
    - lemma: "عَتَامَة"
      confirm:
        - text: "«مقياس لحجب الضوء بواسطة الجسيمات في الغلاف الجوي. ارتفاع التعتيم يعني أن كمية كبيرة من أشعة الشمس تم حظرها»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«قدرة الصبغة المستخدمة على ستر عيوب النسيج»"
          source: "مسرد صناعة النسيج (ArabTerm)"
        - text: "«العَتامة: بقعة عاتمة في جسم شفاف [كعَدَسة العين]»"
          source: "المورد الحديث (2008)"
    - lemma: "لَا شَفَافِيَّة"
      confirm:
        - text: "«لاشفافية (opacity): المعجم الموحد لمصطلحات الرياضيات والفلك (1990)»"
          source: "المعجم الموحد"
    - lemma: "كُمدَة"
      confirm:
        - text: "«نسبة تدفق الضوء الساقط على وسط ما، إلى تدفق الضوء النافذ خلال هذا الوسط»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"

stage3_analysis:
  per_lemma:
    - lemma: "إِعْتَام"
      decision: confirmed
      decision_reason: "مقبول كونه مصدراً للفعل (أعتم) ويدل على الحالة الناتجة عن جعل الشيء معتماً، ويشيع استخدامه طبياً (مثل إعتام عدسة العين)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركز على الحالة الناتجة عن عملية جعل الشيء معتماً أو العارض الذي يصيب جسماً شفافاً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِعْتَام"
    - lemma: "قَتَامَة"
      decision: confirmed
      decision_reason: "مقبول للدلالة على شدة اللون الداكن التي تمنع نفوذ الضوء أو الرؤية بوضوح، وإن كان استعماله في الألوان أغلب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "ترتبط غالباً باللون الداكن أو الغبار الذي يمنع الوضوح."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَتَامَة"
    - lemma: "عَتَامَة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح العلمي الأدق والأكثر شيوعاً في الفيزياء والطب والتقنية للدلالة على خاصية حجب الضوء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المعياري للجودة الفيزيائية التي تقيس مدى منع مرور الضوء."
      actions:
        - command: create_entry
          params: {lemma: "عَتَامَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "لَا شَفَافِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق يستخدم في العلوم البصرية والفلكية كترجمة مباشرة لـ opacity."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يؤكد على سلب خاصية الشفافية، ويستخدم غالباً في السياقات الرياضية والحسابية."
      actions:
        - command: create_entry
          params: {lemma: "لَا شَفَافِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "كُمدَة"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد في تخصصات دقيقة كالحس عن بعد، وله جذور معجمية قوية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يرتبط بنسبة نفاذ الضوء عبر الأوساط، ويُستخدم لوصف بهتان اللون وعدم نفاذيته."
      actions:
        - command: create_entry
          params: {lemma: "كُمدَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "صفة كون الشيء معتماً لدرجة ما؛ الدرجة التي يمنع بها الشيء مرور الضوء"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويغطي الجوانب اللغوية والعلمية للمصطلح."
  examples:
    per_lemma:
      - lemma: "عَتَامَة"
        examples:
          - text: "تزداد عتامة زجاج النوافذ عند تعرضها لعملية التبريد السريع."
            type: usage
      - lemma: "إِعْتَام"
        examples:
          - text: "أدى إعتام عدسة العين إلى ضعف شديد في الرؤية لدى المريض."
            type: usage
      - lemma: "لَا شَفَافِيَّة"
        examples:
          - text: "تعتمد حسابات الغلاف الجوي على قياس اللاشفافية الإشعاعية للغازات."
            type: usage
      - lemma: "قَتَامَة"
        examples:
          - text: "زادت قتامة السماء مع اقتراب العاصفة الترابية."
            type: usage
      - lemma: "كُمدَة"
        examples:
          - text: "يتم قياس كمدة الوسط المائي لتحديد جودة المياه وصلاحيتها."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تختلف عتامة الأجسام باختلاف طبيعة المادة وكثافتها."}

stage5_enrichment:
  per_entry:
    - lemma: "عَتَامَة"
      entry_id: "{auto}"
      root: "عتم"
      maqayis_quote: "«الْعَيْنُ وَالتَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِبْطَاءٍ فِي الشَّيْءِ أَوْ كَفٍّ عَنْهُ... وَالْعَتَمَةُ هُوَ الثُّلُثُ الْأَوَّلُ مِنَ اللَّيْلِ.»"
    - lemma: "قَتَامَة"
      entry_id: "{auto}"
      root: "قتم"
      maqayis_quote: "«الْقَافُ وَالتَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى غُبْرَةٍ وَسَوَادٍ. وَكُلُّ لَوْنٍ يَعْلُوهُ سَوَادٌ فَهُوَ أَقْتَمُ.»"
    - lemma: "إِعْتَام"
      entry_id: "{auto}"
      root: "عتم"
      maqayis_quote: "«الْعَيْنُ وَالتَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِبْطَاءٍ فِي الشَّيْءِ أَوْ كَفٍّ عَنْهُ...»"
    - lemma: "لَا شَفَافِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "شفافية"
          root: "شفف"
          maqayis_quote: "«الشين والفاء أصلٌ واحد، وهو رِقّة الشيء حتى يُرى ما وراءه.»"
    - lemma: "كُمدَة"
      entry_id: "{auto}"
      root: "كمد"
      maqayis_quote: "«الكمد: تغير اللون وذهاب صفائه.»"
  per_sense:
    - lemma: "عَتَامَة"
      sense_id: "{auto}"
      nuance: "الاسم العلمي المعياري للخاصية الفيزيائية."
      mwe: false
    - lemma: "لَا شَفَافِيَّة"
      sense_id: "{auto}"
      nuance: "تستخدم للتأكيد على نقيض الشفافية في سياق القياسات."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عتم","maqayis":"«الْعَيْنُ وَالتَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِبْطَاءٍ فِي الشَّيْءِ أَوْ كَفٍّ عَنْهُ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
