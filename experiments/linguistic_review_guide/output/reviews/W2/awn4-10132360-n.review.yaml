      params:
        source_id: "awn4-10132360-n"
        relation_type: "hypernym"
        target_id: "awn4-09786620-n"
    - command: add_synset_relation
      params:
        source_id: "awn4-10132360-n"
        relation_type: "hypernym"
        target_id: "awn4-00007846-n"

