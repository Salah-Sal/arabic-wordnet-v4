stage1_review:
  assessment:
    concerns:
      - "المصطلحات الحالية تدمج بين الجانب الوصفي للحالة (ركود) والفعل المسبب لها (كبح)."
      - "الافتقار إلى مصطلح (تثبيط) وهو الشائع جداً في الأدبيات العلمية للتعبير عن إيقاف النمو دون قتل الخلية."
    observations: "المفهوم يشير إلى حالة أو عملية (Bacteriostasis) تتعلق بإيقاف نمو البكتيريا وتكاثرها. الجذر (كبح) مناسب جداً للامتناع والتوقيف، والجذر (ركد) يصف السكون الناتج. (تثبيط) أصلح علمياً وشيوعاً."
  blind_candidates:
    - lemma: "تَثْبِيطٌ جُرْثُومِيّ"
      generation_method: ishtiqaq
      justification: "مشتق من ثبط (منع وأخر)، مع النسبة إلى جرثومة، وهو الشائع في تثبيط نمو الأحياء الدقيقة."
    - lemma: "كَبْحٌ جُرْثُومِيّ"
      generation_method: ishtiqaq
      justification: "من كبح بمعنى أوقف ومنع، ويناسب المعنى الطبي لإيقاف التكاثر بشكل وصفي."
    - lemma: "كَبْحُ الْجَرَاثِيمِ"
      generation_method: tarkib
      justification: "مركب إضافي يعكس مباشرة معنى bacteriostasis كما ورد في المعاجم الطبية (المعجم الطبي الموحد)."
    - lemma: "إِرْكَادٌ بَكْتِيرِيّ"
      generation_method: ishtiqaq
      justification: "مشتق من الإركاد (جعل الشيء راكداً) مع نسبة للبكتيريا ليعكس الإيقاف المتعمد."

stage2_evidence:
  per_lemma:
    - lemma: "ركود جرثومي"
      confirm:
        - text: "bacteriostasis : كَبْح الجراثيم؛ تثبيط الجراثيم: كبحُ نموّ الجراثيم من غير قتلها (بك)."
          source: "المورد الحديث (2008)"
      expands:
        - text: "stasis : رُكود"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "كبح البكتيريا"
      confirm:
        - text: "كبح الجراثيم: إيقاف نمو الجراثيم دون قتلها."
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      expands:
        - text: "كبح فرسه: جذب عنانه حتى يصير منتصب الرأس، وقيل: منعه ليقف"
          source: "أساس البلاغة للزمخشري"
    - lemma: "كَبْحُ الْجَرَاثِيمِ"
      confirm:
        - text: "كَبْحُ الجَراثيم : bacteriostasis"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "تَثْبِيطٌ جُرْثُومِيّ"
      confirm:
        - text: "تثبيط الجراثيم: كبحُ نموّ الجراثيم من غير قتلها"
          source: "المورد الحديث (2008)"
    - lemma: "إِرْكَادٌ بَكْتِيرِيّ"
      evidence_status: "no_material_found"
    - lemma: "كَبْحٌ جُرْثُومِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "ركود جرثومي"
      decision: confirmed
      decision_reason: "المصطلح مقبول كترجمة تصف حالة الركود (stasis) التي تحدث للميكروبات، بالرغم من أن (كبح) أدق وصفاً للعملية الفاعلة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُكُودٌ جُرْثُومِيّ"
    - lemma: "كبح البكتيريا"
      decision: confirmed
      decision_reason: "مصطلح سليم لغوياً ويؤدي المعنى الدقيق لكبح نمو البكتيريا بالاعتماد على لفظة بكتيريا المعربة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَبْحُ الْبَكْتِيرِيَا"
    - lemma: "تَثْبِيطٌ جُرْثُومِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح شائع جداً في الأدبيات الطبية الحديثة ومعتمد في المعاجم للترجمة الدقيقة (تثبيط الجراثيم)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "تَثْبِيطٌ جُرْثُومِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "كَبْحُ الْجَرَاثِيمِ"
      source: stage1
      decision: confirmed
      decision_reason: "المقابل المعتمد والرسمي في المعاجم الطبية الموحدة لمصطلح (bacteriostasis)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "كَبْحُ الْجَرَاثِيمِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "إِرْكَادٌ بَكْتِيرِيّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير مستعمل ولا تدعمه شواهد معجمية متخصصة، وتوجد بدائل أفضل منه."
    - lemma: "كَبْحٌ جُرْثُومِيّ"
      source: stage1
      decision: removed
      decision_reason: "استخدام التركيب الإضافي (كبح الجراثيم) أفصح وأكثر دقة وشيوعاً من التركيب الوصفي هنا."

stage4_content:
  definition:
    current: "تثبيط نمو البكتيريا"
    assessment:
      decision: revise
      reason: "التعريف الحالي قصير جداً. يفضل صياغته بتعريف مصطلحي علمي يوضح الآلية بدقة (إيقاف النمو دون القتل)."
    authored:
      - type: terminological
        text: "عملية حيوية يُكْبَح فيها نمو البكتيريا وتكاثرها دون التسبب في قتلها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية حيوية يُكْبَح فيها نمو البكتيريا وتكاثرها دون التسبب في قتلها."}

  examples:
    per_lemma:
      - lemma: "رُكُودٌ جُرْثُومِيّ"
        examples:
          - text: "يؤدي هذا الدواء إلى ركود جرثومي يمنع تفاقم العدوى في الجسم."
            type: usage
      - lemma: "كَبْحُ الْبَكْتِيرِيَا"
        examples:
          - text: "تعمل بعض المضادات الحيوية على كبح البكتيريا بدلاً من تدميرها مباشرة."
            type: usage
      - lemma: "تَثْبِيطٌ جُرْثُومِيّ"
        examples:
          - text: "أظهرت التجارب نجاح المادة في إحداث تثبيط جرثومي فعال في المختبر."
            type: usage
      - lemma: "كَبْحُ الْجَرَاثِيمِ"
        examples:
          - text: "تعتمد آلية عمل العقار الأساسية على كبح الجراثيم للسيطرة على تطور المرض."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تعمل بعض المضادات الحيوية على كبح البكتيريا بدلاً من تدميرها مباشرة."}

