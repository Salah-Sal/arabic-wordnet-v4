stage1_review:
  assessment:
    concerns:
      - "اللمة (تكون المعيدة) تفتقر إلى التشكيل الكامل وتضعيف الواو."
      - "اللمة (تبطن) غير مشكولة وتحتاج إلى ضبط البنية الصرفية."
    observations: "المصطلحات الحالية تغطي المفهوم بشكل جيد. (تكون المعيدة) هو المصطلح العلمي المعتمد والمباشر لعملية (gastrulation)، بينما (تبطن) يعبر عن آلية العملية وهي الهجرة الداخلية للخلايا أو الانغماد لتشكيل الطبقات الجنينية الباطنة."
  blind_candidates:
    - lemma: "تَكَوُّنُ الْمُعَيْدَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف العملية البيولوجية بشكل مباشر، وهو الترجمة المعتمدة لـ gastrulation."
    - lemma: "تَبَطُّن"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (بطن) ليدل على الهجرة الداخلية للخلايا وتكوين الطبقات الجنينية الباطنة."
    - lemma: "تَغَضُّنٌ أُرَيْمِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن انبعاج الأريمة للداخل لتشكيل المعيدة."
    - lemma: "تَشَكُّلُ الْمُعَيْدَةِ"
      generation_method: tarkib
      justification: "مرادف مباشر لتكون المعيدة يصف الحدث الحيوي لتشكل هذه المرحلة الجنينية."

stage2_evidence:
  per_lemma:
    - lemma: "تكون المعيدة"
      confirm:
        - text: "«تَكَوّن المُعَيدَة»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
    - lemma: "تبطن"
      expands:
        - text: "«تَبَطَّنَ الوادي والكلأ: توسَّطَه وجوَّلَ فيه الأمرَ وفلاناً: خبره وعرف باطنه»"
          source: "المعجم الوسيط"
          addition: "استخدام لغوي يدل على الدخول في الباطن والتعمق فيه، مما يعكس مجازياً عملية الانغماد الخلوي الداخلي."
    - lemma: "تَكَوُّنُ الْمُعَيْدَةِ"
      confirm:
        - text: "«تَكَوّن المُعَيدَة»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
    - lemma: "تَبَطُّن"
      expands:
        - text: "«تَبَطَّنَ الوادي والكلأ: توسَّطَه وجوَّلَ فيه الأمرَ وفلاناً: خبره وعرف باطنه»"
          source: "المعجم الوسيط"
          addition: "استخدام لغوي يدل على الدخول في الباطن والتعمق فيه، مما يعكس مجازياً عملية الانغماد الخلوي الداخلي."
    - lemma: "تَغَضُّنٌ أُرَيْمِيّ"
      evidence_status: no_material_found
    - lemma: "تَشَكُّلُ الْمُعَيْدَةِ"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "تبطن"
      decision: confirmed
      decision_reason: "كلمة صحيحة لغوياً تصف مجازياً وحركياً آلية الهجرة الداخلية والانغماد التي تحدث في هذه المرحلة الجنينية، وتستخدم كمرادف للعملية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبَطُّن"

    - lemma: "تكون المعيدة"
      decision: confirmed
      decision_reason: "المصطلح العلمي القياسي والمعتمد في المعاجم الطبية والتشريحية لترجمة العملية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَوُّنُ الْمُعَيْدَةِ"

    - lemma: "تَكَوُّنُ الْمُعَيْدَةِ"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمة موجودة تم اعتمادها وتصحيح تشكيلها."

    - lemma: "تَبَطُّن"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمة موجودة تم اعتمادها وتصحيح تشكيلها."

    - lemma: "تَغَضُّنٌ أُرَيْمِيّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مقترح لا يدعمه الاستخدام العلمي المعياري في هذا السياق."

    - lemma: "تَشَكُّلُ الْمُعَيْدَةِ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مرادف لم يعتمد بشكل واسع في المعاجم المتخصصة مقارنة بـ (تكون المعيدة)."

stage4_content:
  definition:
    current: "العملية التي تتطور فيها المعيدة من الأريمة عن طريق الهجرة الداخلية للخلايا"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه يمثل ترجمة حرفية؛ تمت صياغته بأسلوب معجمي عربي سليم يشتمل على الجنس القريب ويوضح آلية الانغماد الخلوي بشكل أوضح."
    authored:
      - type: terminological
        text: "عملية حيوية تتطور فيها المُعَيْدَة من الأُرَيْمَة في الأجنة عن طريق الهجرة الداخلية وانغماد الخلايا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية حيوية تتطور فيها المُعَيْدَة من الأُرَيْمَة في الأجنة عن طريق الهجرة الداخلية وانغماد الخلايا."

  examples:
    per_lemma:
      - lemma: "تَبَطُّن"
        examples:
          - text: "يُعدُّ التَّبَطُّنُ مرحلة حاسمة لتشكل الطبقات الجرثومية في الجنين."
            type: usage
      - lemma: "تكون المعيدة"
        examples:
          - text: "يبدأ تَكَوُّنُ الْمُعَيْدَةِ بانغماد الخلايا لتشكيل المعي البدائي."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يبدأ تَكَوُّنُ الْمُعَيْدَةِ بانغماد الخلايا لتشكيل المعي البدائي."

