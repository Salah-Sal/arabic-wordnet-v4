# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07966881-n
# people who have retreated / الناس الذين انسحبوا أو تراجعوا
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «منسحبون» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "اللمّة بصيغة جمع المذكر السالم وليست بصيغة المفرد — غير معتاد معجمياً وإن كان منسجماً مع طبيعة المجموعة الجماعية"
      - "التعريف العربي ضعيف ودائري: يستخدم «انسحبوا أو تراجعوا» وهي الأفعال المشتقة من اللمّة نفسها"
      - "المجموعة تحتوي لمّة واحدة فقط — فقر مفرداتي"
    observations: >
      المجموعة تمثّل مفهوماً جماعياً: جماعة من الناس تولّوا وارتدّوا عن موضعهم.
      الجذر «سحب» في الأصل يدلّ على الجرّ والمدّ (مقاييس اللغة)، والانسحاب بمعنى
      الارتداد والتراجع استعمال حديث مولَّد، لكنّه شائع ومقبول في الفصحى المعاصرة.
      يُلاحَظ أنّ المعاجم الكلاسيكية لا تسجّل «مُنْسَحِب» بهذا المعنى، لكنّه مستعمل
      في المعاجم الثنائية الحديثة (المورد) وفي الاستعمال الإعلامي المعاصر.
      المفهوم عسكري الأصل لكنّه توسّع ليشمل الانسحاب السياسي والاجتماعي.

  blind_candidates:
    - lemma: "فَلّ"
      generation_method: majaz
      justification: >
        لفظ تراثي من جذر «فلل»، يدلّ على المنهزم المنكسر. في المعجم الوسيط:
        «الفَلّ: المنهزم، يُقال للواحد والجمع». فيه إزاحة دلالية من معنى الكسر
        في حدّ السيف إلى الانكسار العسكري والانسحاب.
    - lemma: "مُدْبِر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «أَدْبَرَ» على وزن مُفْعِل، بمعنى مَن ولّى دُبُره وانصرف.
        الجذر «دبر» يدلّ على آخر الشيء وخلفه (مقاييس اللغة). مسجّل في المعجم
        الكبير: «ما لهم من مُقبل ولا مُدبر».
    - lemma: "نَاكِص"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «نَكَصَ» على وزن فاعِل. في مقاييس اللغة: «نَكَصَ على عقبيه
        إذا أحجم عن الشيء». وفي القرآن: ﴿نَكَصَ عَلَى عَقِبَيْهِ﴾. يدلّ على
        الرجوع عن الأمر بعد الإقدام عليه.
    - lemma: "مُوَلٍّ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «وَلَّى» على وزن مُفَعِّل، بمعنى مَن أدبر وانصرف. من
        الاستعمال القرآني: ﴿ثُمَّ وَلَّيْتُمْ مُدْبِرِينَ﴾. يجمع معنى الانصراف
        والإدبار.


stage2_evidence:
  per_lemma:
    - lemma: "مُنْسَحِبُون"
      confirm:
        - text: "«(1) انسحاب؛ تراجع؛ تقهقر [...] (6) ينسحب؛ يتراجع»"
          source: "المورد الحديث (2008) — مادة retreat"
        - text: "«انسحاب أو مجموعة منسحبين [من حزب سياسي]»"
          source: "المورد الحديث (2008) — مادة cave"
      expands:
        - text: "«السِّينُ وَالْحَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ مَبْسُوطٍ وَمَدِّهِ. [...] وَسُمِّيَ السَّحَابُ سَحَابًا تَشْبِيهًا لَهُ بِذَلِكَ، كَأَنَّهُ يَنْسَحِبُ فِي الْهَوَاءِ انْسِحَابًا»"
          source: "مقاييس اللغة لابن فارس — مادة سحب"
          addition: "الأصل اللغوي للجذر «سحب» هو الجرّ والمدّ، والانسحاب بمعنى التراجع توسّع حديث"

    - lemma: "فَلّ"
      confirm:
        - text: "«(الفَلّ) كسر في حدّ السيف وما انفصل عن الشيء وتناثر كسحالة الذهب وبرادة الحديد وشرر النار (ج) فُلول والمنهزم (يُقال للواحد والجمع)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«(فَلّ) من فلان عقله فلاً ذهب ثمّ عاد والسيفَ فلاً ثلمه وكسره في حدّه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الجذر يدلّ على الكسر والثلم، ومنه انتقل إلى المنهزم المنكسر"

    - lemma: "مُدْبِر"
      confirm:
        - text: "«يُقال: ما لَهُمْ مِنْ مُقْبِلٍ ولا مُدْبِرٍ: مَالَهُمْ مِنْ مَذْهَبٍ في إِقْبَال ولا في إِدْبَارٍ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الدَّالُ وَالْبَاءُ وَالرَّاءُ. أَصْلُ هَذَا الْبَابِ أَنَّ جُلَّهُ فِي قِيَاسٍ وَاحِدٍ، وَهُوَ آخِرُ الشَّيْءِ وَخَلْفُهُ خِلَافُ قُبُلِهِ»"
          source: "مقاييس اللغة لابن فارس — مادة دبر"
          conflict: "الجذر يدلّ على الخلف والآخِر عموماً وليس على الانسحاب تحديداً، فالمُدبِر من ولّى ظهره لا من انسحب بالضرورة"

    - lemma: "نَاكِص"
      confirm:
        - text: "«نَكَصَ عَلَى عَقِبَيْهِ، إِذَا أَحْجَمَ عَنِ الشَّيْءِ خَوْفًا وَجُبْنًا. قَالَ ابْنُ دُرَيْدٍ: نَكَصَ عَلَى عَقِبَيْهِ: رَجَعَ عَمَّا كَانَ عَلَيْهِ مِنْ خَيْرٍ; لَا يُقَالُ ذَلِكَ إِلَّا فِي الرُّجُوعِ عَنِ الْخَيْرِ»"
          source: "مقاييس اللغة لابن فارس — مادة نكص"
      contradicts:
        - text: "«نَكَصَ عَلَى عَقِبَيْهِ، إِذَا أَحْجَمَ عَنِ الشَّيْءِ خَوْفًا وَجُبْنًا [...] لَا يُقَالُ ذَلِكَ إِلَّا فِي الرُّجُوعِ عَنِ الْخَيْرِ»"
          source: "مقاييس اللغة لابن فارس — مادة نكص"
          conflict: "النكوص مقيّد بالإحجام عن الخير خوفاً وجبناً، وليس مطلق الانسحاب"

    - lemma: "مُوَلٍّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "مُنْسَحِبُون"
      decision: confirmed
      decision_reason: >
        اللمّة تؤدّي المعنى المطلوب بدقّة: جماعة انسحبت من موضعها. «الانسحاب»
        بمعنى التراجع والارتداد مستعمل في الفصحى المعاصرة ومثبت في المعاجم الثنائية
        الحديثة. صيغة الجمع منسجمة مع طبيعة المجموعة الجماعية (قارن: أشخاص، بشر، ناس
        في المُشمِل الأعلى). يحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الانسحاب محايد الدلالة، يشمل التراجع العسكري والسياسي والاجتماعي دون إيحاء بالهزيمة أو الجبن"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْسَحِبُون"

    - lemma: "فَلّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أنّ «الفَلّ» مسجّل في المعجم الوسيط بمعنى «المنهزم»، فإنّه يختصّ
        بالهزيمة العسكرية والانكسار، ولا يغطّي الانسحاب المحايد أو الطوعي. المجموعة
        الترادفية تصف مَن «انسحب أو تراجع» عموماً وليس مَن انهزم تحديداً. كذلك
        اللفظ «فَلّ» مهجور في الاستعمال المعاصر.

    - lemma: "مُدْبِر"
      source: stage1
      decision: removed
      decision_reason: >
        «المُدْبِر» يدلّ على من ولّى ظهره عموماً وليس على المنسحب تحديداً.
        الدلالة أوسع من المطلوب (كلّ مولٍّ مدبر وليس كلّ مدبر منسحباً).
        كذلك ورد في المعاجم بسياقات فقهية (المُدَبَّر: العبد المعتَق عن دُبُر)
        وتقنية (مُدَبِّر: مدير) ممّا يخلق التباساً.

    - lemma: "نَاكِص"
      source: stage1
      decision: removed
      decision_reason: >
        «النكوص» مقيّد بدلالة الإحجام خوفاً وجبناً والرجوع عن الخير حصراً
        (ابن فارس وابن دريد). هذا أضيق بكثير من مفهوم الانسحاب العامّ في المجموعة.

    - lemma: "مُوَلٍّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجَد أدلّة معجمية تدعم استعمال «مُوَلٍّ» اسماً مستقلاً بمعنى المنسحب.
        اللفظ يرد عادةً حالاً أو صفةً (مُدبرين مُوَلِّين) لا اسماً جامداً.


