# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي دوري: يُعرِّف «الاتصال» بلفظ «اتصال» وهو أحد لمّات المجموعة ذاتها، مما يُخِلّ بشرط عدم الدوران"
      - "التعريف العربي الحالي قريب من الترجمة الحرفية للتعريف الإنجليزي ولا يستوفي أسلوب المعجم الوسيط"
      - "لمّتا المجموعة (اتصال، تواصل) متقاربتان دلالياً دون توثيق للفارق الدقيق بينهما"
    observations: >
      المجموعة تُمثّل مفهوم «الرابط» أو «وسيلة الوصول» الذي يُتيح النفاذ والتواصل بين
      أشخاص أو أماكن — وهو مفهوم متجذّر في العربية. الجذر (وصل) خصيب الاشتقاق ويُوفّر
      مادة وافرة. اللمّتان الحاليتان (اتصال / تواصل) تنتميان إلى بابَي الافتعال والتفاعل
      من الجذر ذاته، مما يُثير سؤالاً جوهرياً عن مدى اشتراطهما معاً في مجموعة واحدة،
      غير أن الفارق الوظيفي بين الحالة (اتصال) والتفاعل المتبادل (تواصل) يُبرّر اجتماعهما
      إذا وُثِّق بدقة.

  blind_candidates:
    - lemma: "وِصَال"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فِعَال من جذر (وصل)، يدل على الاتحاد والالتصاق الوثيق. يشترك مع
        الاتصال في الجذر لكن وزنه يحمل معنى الاستمرارية والتلاحم، مما يُناسب «رابطاً
        دائماً» يُتيح الوصول.

    - lemma: "صِلَة"
      generation_method: majaz
      justification: >
        في الأصل «ما يُوصَل به»، ثم اتُّسع معناها لتدل على الرابط والعلاقة الواصلة.
        إزاحة دلالية من المادي (وسيلة الوصل) إلى المجرد (الرابط المُتيح للتواصل).

    - lemma: "مَوْصِل"
      generation_method: ishtiqaq
      justification: >
        اسم مكان/أداة على وزن مَفْعِل من جذر (وصل)، يدل على موضع الوصل أو ما يُوصَل به.
        وزن مَفْعِل يناسب الأداة أو الوسيلة التي تُتيح الوصول بين طرفَين.

    - lemma: "مَنْفَذ"
      generation_method: majaz
      justification: >
        في الأصل موضع النفوذ والممر النافذ؛ مجازاً يدل على ما يُتيح النفاذ والوصول
        إلى شيء ما أو شخص ما. يتوافق مع قيد «يسمح بالوصول» في التعريف.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:

  # ── استعلامات قاعدة البيانات المُنفَّذة (٣ استعلامات) ──
  # ١. مطابقة دفعية: اتصال/الاتصال، تواصل/التواصل، وصال/الوصال، صلة/الصلة، منفذ/المنفذ، موصل/الموصل
  # ٢. إثراء بالمعرّف للمداخل الكلاسيكية الرئيسية
  # ٣. جسر إنجليزي: communication, link, connection, access
  # ٤. بحث FTS بالكلمات المفتاحية: وصول، اتصال، تواصل، وصل

  per_lemma:

    - lemma: "اتِّصَال"
      confirm:
        - text: >
            «الاتصال:[في الانكليزية] Junction، communication [في الفرنسية] Jonction، communication
            في اللغة بيوستن ضد الانفصال وهو أمر إضافي يوصف به الشيء بالقياس إلى غيره.
            ويطلق على أمرين: أحدهما اتحاد النهايات بأن يكون المقدار متّحد النهاية بمقدار آخر»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: >
            «الاتصال: اتحاد الأشياء بعضها ببعض، كاتصال طرفي الدائرة، ويضاده الانفصال.
            اتصال التربيع اتصال جدار بجدار بحيث تتداخل لبنات أحدهما في الآخر»
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "اتصال | EN: communication | domain: Information and Communication"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "اتصال | EN: communication | domain: Oceanology"
          source: "المعجم الموحد لمصطلحات علوم البحار"
        - text: "الاتصال | EN: communication | domain: AGROVOC"
          source: "المَكنَز الزراعي متعدد اللغات"
        - text: >
            «الاتصال حسب المنظرين واللسانيين هو نقل معلومة من نقطة إلى أخرى، مكاناً كانت
            أم شخصاً، بواسطة إرساليات لها شكل معين»
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: >
            «الِاتِّصَال: مشهور وعند الصوفية الاتحاد هو شهود الحق الواحد المطلق الذي كل به
            موجود فيتحد به الكل من حيث كون الكل موجوداً به معدوماً بنفسه»
          source: "دستور العلماء للأحمدنكري"
          addition: "يكشف عن امتداد دلالي صوفي للاتصال بمعنى الاتحاد الروحي — أبعد من المعنى المستهدف"

    - lemma: "تَوَاصُل"
      confirm:
        - text: >
            «نقل الأخبار بواسطة العلامات والإشارات بين مرسل إلى متلقٍ عبر قناة ما، حيث
            يعمل التواصل بشكل جيد في وضعية تقاسم الشفرة وغياب التشويش»
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "تواصُل | EN: communication | domain: Information and Communication — «اتصال متبادل»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "تَوَاصُلٌ | EN: communication | domain: The unified dictionary of educational governance terms"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية"
        - text: "تواصل | EN: communication | domain: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس"
      expands:
        - text: >
            «التواصل هو تبادل الكلام بين متكلم ينتج ألفاظاً موجهة لمتكلم آخر يقوم بدور
            المخاطب المستمع»
          source: "مسرد الإعلام والتواصل"
          addition: "يُحدّد التواصل باعتباره تفاعلاً ثنائي الاتجاه — مُبرزاً بُعد التبادلية الغائب في «الاتصال»"

    - lemma: "وِصَال"
      contradicts:
        - text: >
            «الوصال: شفاء الحشا من داء الضنا. وقيل: غذاء الروح ودواء كل قلب مجروح.
            وقيل، تحقيق الوداد وتصديق ما سبق به الميعاد»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الوِصال في الاستخدام المعجمي الراسخ يحمل دلالة عاطفية/رومانسية تتعارض مع المجموعة التقنية"
        - text: >
            «الوِصال: من (وصل) القرب والاتصال ويكون في عفاف الحب، وصيام المرء أيامًا
            متتابعة دون إفطار»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعجم يُقيّد الوصال بمجال الحب والصيام، لا الاتصال التقني"
      expands:
        - text: >
            «الوصال:[في الانكليزية] Communication، junction، contact، union — بالكسر عند
            السالكين مرادف للوصل والاتصال»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "الاستخدام الاصطلاحي الصوفي يُرادف الوصال بالاتصال، لكن السياق متخصص في التصوف"

    - lemma: "صِلَة"
      contradicts:
        - text: >
            «الصلة: البر على غير جهة التعويض»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الصِّلة في الاستخدام المعجمي الشائع تدل على الهبة والعطاء، لا على الاتصال كوسيلة وصول"
        - text: >
            «(الصِّلة) العَطِيَّة والجائزة والحرف الذي بعد الروي في قافية البيت»
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي الأول للصِّلة هو العطية، والمعنى الاصطلاحي يرتبط بعلم القراءات والعروض"
      expands:
        - text: >
            «الصّلة:[في الانكليزية] Relation، contact، conjunction — بكسر الصاد في اللغة الفارسية
            بمعنى: الاتصال، والوصل، والقرابة، والهدية، والعطية»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُثبت أن للصِّلة معنى «الاتصال والوصل» لكنه واحد من معانٍ متعددة متشعبة"

    - lemma: "مَوْصِل"
      contradicts:
        - text: >
            «(الموصل) مكان الوصول وموضع الوصل بمعنى الضم واللأم والمفصل ومن البعير ما بين
            العجز والفخذ ومعقد الحبل وما يُوصل من الحبل»
          source: "المعجم الوسيط"
          conflict: "المَوْصِل اسمُ مكانٍ يدل على الموضع الذي يقع فيه الوصل أو على مكان التقاء أعضاء البدن، لا على الاتصال المجرد"
        - text: >
            «مَوصِلٌ عَظْمِيّ (=مَفصِل): موضع اتصال عظمين أو أكثر من عظام الهيكل العظمي»
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"
          conflict: "الاستخدام المعاصر للمَوْصِل في المصطلحية الطبية يُحدّده بمعنى التشريح الجسدي"

    - lemma: "مَنْفَذ"
      expands:
        - text: >
            «المنفذ: موضع نفوذ الشيء والممر النافذ»
          source: "المعجم الوسيط"
          addition: "يدل على المسلك الجسدي المادي، وهو قريب من معنى «يسمح بالوصول» لكنه لا يدل على الاتصال"
        - text: >
            «مَنْفَذ، مَدْخَل | EN: access»
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
          addition: "الجسر الإنجليزي يُرادف access بـ«منفذ» وهو أقرب إلى معنى الوصول منه إلى الاتصال بوصفه رابطاً"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "اتِّصَال"
      decision: confirmed
      decision_reason: >
        لمّة محورية مُوثَّقة توثيقاً متينًا بمعنى communication/junction في المعاجم الاصطلاحية
        والتقنية المتعددة. المصدر على وزن الافتعال من (وصل) يدل على الاتحاد والالتصاق من
        منظور الحالة والنتيجة — مناسب تماماً لمفهوم «الاتصال الواصل بين أشخاص أو أماكن».
        التشكيل الكامل موجود.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على الاتصال من حيث هو حالة قائمة وعلاقة ثابتة (الحالة والنتيجة)؛ قد يكون
        اتصالاً من طرف واحد أو من أطراف متعددة دون اشتراط التفاعل. يُستعمل للدلالة على
        الوصل المادي أو المعنوي بوجه عام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اتِّصَال"

    - lemma: "تَوَاصُل"
      decision: confirmed
      decision_reason: >
        لمّة مُوثَّقة في مصطلحيات حديثة متعددة بمعنى communication مع تركيز على التبادلية
        والاستمرارية. وزن التفاعل (تَفَاعُل) يتضمن معنى الاشتراك المتبادل، مما يُميّزها
        دلالياً عن «اتصال» ويُبرّر وجودها المستقل في المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على الاتصال المتبادل والمستمر بين طرفَين أو أكثر مع إبراز التفاعلية والاستمرار؛
        وزن التفاعل يستلزم مشاركة الطرفَين. يُفيد الديمومة والتجدد في حين أن «اتصال» يُفيد
        الحالة الآنية أو الثابتة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَاصُل"

    - lemma: "وِصَال"
      source: stage1
      decision: removed
      decision_reason: >
        الوِصال محمّل بدلالات راسخة في المعجم العربي تتعلق بالوصال العاطفي والرومانسي
        («شفاء الحشا من داء الضنا») وبالصيام المتواصل. حتى الاستخدام الاصطلاحي الذي يُرادفه
        بـ communication هو استخدام صوفي متخصص. اختبار الاستبدال يُثبت أن إدراجه في
        سياق تقني («اتصال يسمح بالوصول بين الأشخاص أو الأماكن») يُولّد التباساً.
      evidence_assessment:
        case: mixed

    - lemma: "صِلَة"
      source: stage1
      decision: removed
      decision_reason: >
        الصِّلة وإن كانت تحمل معنى «الاتصال والوصل» في بعض المعاجم الاصطلاحية، إلا أن
        المعنى الغالب في الاستخدام المعجمي الشائع هو العطية والهبة والجائزة؛ وفي الاستخدام
        الحديث تدل على العلاقة/الرابط المجرد لا على الوسيلة أو الرابط الاتصالي. الالتباس
        الدلالي يمنع إدراجها.
      evidence_assessment:
        case: mixed

    - lemma: "مَوْصِل"
      source: stage1
      decision: removed
      decision_reason: >
        المَوْصِل اسمُ مكانٍ يدل على موضع الوصل أو المفصل الجسدي، لا على الاتصال بوصفه
        مفهوماً مجرداً. الاستخدام المصطلحي الحديث يُحصره في التشريح والبيطرة. فضلاً عن
        أنه مشترك مع اسم مدينة الموصل مما يُثير لبساً جغرافياً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَنْفَذ"
      source: stage1
      decision: removed
      decision_reason: >
        المنفذ يدل على المسلك الجسدي النافذ أو نقطة الدخول/الخروج، وهو أقرب إلى مفهوم
        «الوصول» (access) منه إلى مفهوم «الاتصال الواصل» (communication link). المفهوم
        المستهدف هو الرابط الذي يُتيح الوصول لا الوصول ذاته.
      evidence_assessment:
        case: mixed


