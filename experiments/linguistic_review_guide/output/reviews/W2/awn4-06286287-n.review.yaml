stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة حرفية للتعريف الإنجليزي؛ ذِكر «حقائب» مقحم لا يناسب الاستعمال العربي للبريد"
      - "المجموعة تضمّ لمّة واحدة فقط (بريد) بدون تشكيل"
    observations: "المفهوم المقصود هو المادة البريدية المنقولة (رسائل وطرود) عبر الخدمة البريدية. كلمة «بريد» في العربية تشمل هذا المعنى تماماً، فهي معرَّبة قديمة من الفارسية (بُريده دُم) دخلت العربية منذ العصر الأموي واستوطنت الاستعمال. المعجم الوسيط والمعجم الكبير يوردان «الرسائل» ضمن معاني البريد. المفهوم أصيل في الثقافة العربية."
  blind_candidates:
    - lemma: "بَرِيد"
      generation_method: ishtiqaq
      justification: "من الجذر «برد»، وقد صار يدلّ على الرسائل المنقولة والنظام البريدي بعامّة. أصله الدابة التي تحمل الرسائل ثمّ انتقل مجازاً إلى ما يُحمَل عليها."
    - lemma: "مُرَاسَلَات"
      generation_method: ishtiqaq
      justification: "مصدر ميمي على وزن مُفَاعَلَات من «رسل»، يدلّ على المكاتبات المتبادلة. يُستعمل للدلالة على مجموع الرسائل المتبادلة."
    - lemma: "مَكَاتِيب"
      generation_method: ishtiqaq
      justification: "جمع مَكْتوب من «كتب»، يدلّ على الرسائل المكتوبة. شائع في الاستعمال العربي الكلاسيكي للدلالة على الرسائل."
    - lemma: "خِطَابَات"
      generation_method: ishtiqaq
      justification: "جمع خِطَاب من «خطب»، يدلّ على الرسائل الرسمية. شائع في الاستعمال المعاصر وخاصة في المراسلات الإدارية."

stage2_evidence:
  per_lemma:
    - lemma: "بَرِيد"
      confirm:
        - text: "«أصله الدابة التي تحمل الرسائل الرسول المسافة بين كل منزلين من منازل الطريق الرسائل (مج)»"
          source: "المعجم الوسيط"
        - text: "«الرَّسولُ المسافةُ يقطعها الرسولُ من الطريق ثم ينزل ليُريح دابَّتـه... دابّةُ البَرِيد الرسائل»"
          source: "المعجم الكبير"
        - text: "«(الْبَرِيد) أَصله الدَّابَّة الَّتِي تحمل الرسائل وَالرَّسُول والمسافة بَين كل منزلين من منَازِل الطَّرِيق وَهِي أَمْيَال اخْتلف فِي عَددهَا والرسائل (ج) برد»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«البَرِيد: البغْلة المرتَّبة في الرِباط تعريب بُريدة دم، ثم سمّي به الرسولُ المحمول عليها، ثم سميت المسافةُ التي يقطعها»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«(1) حقيبة... (2) أكياس البريد. الرسائل المُبْرَدة. عربة البريد (3) البريد: نظام البريد في بلدٍ ما. موادّ بريديّة (4) يُبْرِد: يُرسل بالبريد»"
          source: "المورد الحديث"
      expands:
        - text: "«بريد، خطابات»"
          source: "مسرد الفن والتسلية (أليكسو)"
          addition: "يربط البريد بالخطابات كمترادفين في السياق البريدي"
        - text: "«مراسلة، بريد»"
          source: "مسرد الفن والتسلية (أليكسو)"
          addition: "يربط البريد بالمراسلة كمترادفين"
    - lemma: "مُرَاسَلَات"
      contradicts:
        - text: "«مراسلة، بريد» — المدخل يورد المراسلة كمرادف للبريد لكن بمعنى المكاتبة لا الحقائب المنقولة"
          source: "مسرد الفن والتسلية (أليكسو)"
          conflict: "المراسلات تدلّ على فعل المكاتبة لا على المادة البريدية المنقولة تحديداً"
    - lemma: "مَكَاتِيب"
      evidence_status: "no_material_found"
    - lemma: "خِطَابَات"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "بَرِيد"
      decision: confirmed
      decision_reason: "لمّة أصيلة مدعومة بأدلّة معجمية وفيرة من المعجم الوسيط والكبير والتعريفات الفقهية. المعاني المعجمية تشمل صراحةً «الرسائل» و«مواد بريدية»، وهو المعنى المقصود في هذه المجموعة. اللفظ معرَّب قديم مستوطن في العربية منذ القرن الأول الهجري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَرِيد"
    - lemma: "مُرَاسَلَات"
      source: stage1
      decision: removed
      decision_reason: "المراسلات تدلّ على فعل التكاتب والتراسل (المصدر)، لا على المادة البريدية المنقولة في الحقائب. الفرق بين «أرسلت المراسلات» (عملية) و«وصل البريد» (مادة) جوهري."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "مَكَاتِيب"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر على أدلّة معجمية تدعم هذا الاستعمال بمعنى البريد المنقول. المكاتيب جمع مكتوب وتخصّ الرسائل المكتوبة فحسب، ولا تشمل الطرود والحزم البريدية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "خِطَابَات"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر على أدلّة معجمية. الخطابات تخصّ الرسائل الرسمية ولا تشمل الطرود، ولا تدلّ على مجموع المادة البريدية المنقولة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

