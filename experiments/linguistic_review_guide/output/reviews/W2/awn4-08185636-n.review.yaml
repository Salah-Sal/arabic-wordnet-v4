stage1_review:
  assessment:
    concerns: []
    observations: "مصطلح (العالم الحر) هو تعبير سياسي استُخدم بشكل أساسي خلال فترة الحرب الباردة للإشارة إلى الدول الغربية والرأسمالية التي لم تكن تحت حكم شيوعي."
  blind_candidates:
    - lemma: "العَالَمُ الحُرّ"
      generation_method: tarkib
      justification: "ترجمة حرفية اصطلاحية شائعة للمصطلح الإنجليزي (Free World)."
    - lemma: "المُعَسْكَرُ الغَرْبِيّ"
      generation_method: tarkib
      justification: "مصطلح سياقي موازٍ يشير إلى نفس الكتلة السياسية إبان الحرب الباردة."
    - lemma: "الدُّوَلُ الرَّأْسِمَالِيَّة"
      generation_method: tarkib
      justification: "وصف اقتصادي للدول التي وقفت ضد المعسكر الشيوعي."
    - lemma: "الدُّوَلُ المُنَاهِضَةُ لِلشُّيُوعِيَّة"
      generation_method: tarkib
      justification: "ترجمة وصفية مباشرة تعكس المعنى الحرفي للتعريف."

stage2_evidence:
  per_lemma:
    - lemma: "العالم الحر"
      confirm:
        - text: "العالَم الحرّ."
          source: "المورد الحديث (2008)"
    - lemma: "المُعَسْكَرُ الغَرْبِيّ"
      evidence_status: "no_material_found"
    - lemma: "الدُّوَلُ الرَّأْسِمَالِيَّة"
      evidence_status: "no_material_found"
    - lemma: "الدُّوَلُ المُنَاهِضَةُ لِلشُّيُوعِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "العالم الحر"
      decision: confirmed
      decision_reason: "مصطلح سياسي مسكوك ومستقر في الاستعمال العربي للإشارة إلى الكتلة المناهضة للشيوعية، وهو ترجمة معتمدة للمصطلح الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "العَالَمُ الحُرّ"
    - lemma: "المُعَسْكَرُ الغَرْبِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير موازٍ يعكس التقسيم الجغرافي والسياسي (شرق/غرب)، ولكنه لا يحمل الدلالة الأيديولوجية المتمحورة حول مفهوم (الحرية)."
    - lemma: "الدُّوَلُ الرَّأْسِمَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: "يشير إلى طبيعة النظام الاقتصادي لتلك الدول وليس للتحالف السياسي المسمى بالعالم الحر."
    - lemma: "الدُّوَلُ المُنَاهِضَةُ لِلشُّيُوعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك كمصطلح معجمي ثابت يعبر عن هذا الكيان السياسي."

stage4_content:
  definition:
    current: "الدول المناهضة للشيوعية مجتمعة"
    assessment:
      decision: retain
      reason: "التعريف دقيق ومباشر ويفي بشروط التعريف الاصطلاحي للمفهوم المراد."
  examples:
    per_lemma:
      - lemma: "العالم الحر"
        examples:
          - text: "قادت الولايات المتحدة الأمريكية العالم الحر خلال فترة الحرب الباردة."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "قادت الولايات المتحدة الأمريكية العالم الحر خلال فترة الحرب الباردة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "قادت الولايات المتحدة الأمريكية العالم الحر خلال فترة الحرب الباردة."}

stage5_enrichment:
  per_entry:
    - lemma: "العَالَمُ الحُرّ"
      entry_id: "{auto}"
      roots:
        - word: "العالم"
          root: "علم"
          maqayis_quote: "«الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى أَثَرٍ بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ... وَمِنَ الْبَابِ الْعَالَمُونَ»"
        - word: "الحر"
          root: "حرر"
          maqayis_quote: "«الْحَاءُ وَالرَّاءُ فِي الْمُضَاعَفِ لَهُ أَصْلَانِ: فَالْأَوَّلُ مَا خَالَفَ الْعُبُودِيَّةَ وَبَرِئَ مِنَ الْعَيْبِ وَالنَّقْصِ.»"
  per_sense:
    - lemma: "العَالَمُ الحُرّ"
      sense_id: "{auto}"
      nuance: "تعبير أيديولوجي اصطلاحي يشير تحديداً إلى الكتلة المناهضة للشيوعية إبان الحرب الباردة."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"العالم","root":"علم","maqayis":"«الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى أَثَرٍ بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ... وَمِنَ الْبَابِ الْعَالَمُونَ»"},{"word":"الحر","root":"حرر","maqayis":"«الْحَاءُ وَالرَّاءُ فِي الْمُضَاعَفِ لَهُ أَصْلَانِ: فَالْأَوَّلُ مَا خَالَفَ الْعُبُودِيَّةَ وَبَرِئَ مِنَ الْعَيْبِ وَالنَّقْصِ.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبير أيديولوجي اصطلاحي يشير تحديداً إلى الكتلة المناهضة للشيوعية إبان الحرب الباردة.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
