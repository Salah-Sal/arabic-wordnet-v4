# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليّتان (إشارة استغاثة / نداء استغاثة) تفتقران إلى تشكيل كامل"
      - "التعريف العربي الحالي مترجَم حرفيًّا من الإنجليزية ولا يتّبع أسلوب المعجم الوسيط"
    observations: "المجموعة تمثّل مصطلحًا تقنيًّا بحريًّا وجويًّا محدَّد الدلالة. اللمّتان
      الحاليّتان تُغطّيان المفهوم تغطيةً وافية وواردتان في المعجم الموحّد لمصطلحات علوم
      البحار (2000). يتقاطع المعنيان في الدلالة الكبرى لكنهما يتباينان في المستوى (العام
      مقابل الصوتي). لا تحتاج المجموعة إلى إضافة لمّات جديدة؛ غير أنّ التشكيل والتعريف
      يستدعيان مراجعة."
  blind_candidates:
    - lemma: "نَفِيرٌ"
      generation_method: majaz
      justification: "النَّفير في العربية يدل على الصياح للاستنهاض والاستنفار، وهو قريب
        وظيفيًّا من 'إشارة الاستغاثة' بمجاز تأثيري؛ إذ كلاهما يستنهض الآخرين للفعل
        العاجل. واللفظ قديم مما يُجنّب الاشتراك اللفظي مع المصطلحات الحديثة."
    - lemma: "رَمْزُ الاسْتِغَاثَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي يُفرّق بين الرمز (الصيغة المشفَّرة المحدَّدة) والإشارة
        (الفعل أو البثّ الكلّي). يصلح للإشارة إلى رموز بعينها كـSOS الذي هو رمز مشفَّر
        لا إشارة صوتية."
    - lemma: "إِشَارَةُ النَّجْدَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي يستحضر معنى الإغاثة العاجلة الواردة في 'النجدة'؛ إذ
        المعجم الوسيط يذكر أنّ النجدة تعني 'سرعة الإغاثة'، وهذا المعنى يناسب السياق
        البحري والجوي."
    - lemma: "مَايْ دَاي"
      generation_method: taarib
      justification: "تعريب النداء الدولي 'Mayday' المعتمد في اتفاقيات الملاحة البحرية
        والجوية الدولية. اللفظ ذو صيغة صوتية عالمية تقبل لام التعريف والنسبة."


