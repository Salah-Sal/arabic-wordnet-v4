    - lemma: "كِيمْيَاء"
      generation_method: ishtiqaq
      justification: "استخدام اسم العلم للدلالة على الخصائص والتركيب (بالمجاز المرسل/علاقة المجاورة)."
    - lemma: "تَكْوِين كِيمْيَائِيّ"
      generation_method: tarkib
      justification: "استخدام 'تكوين' للدلالة على الهيئة والمكونات."
    - lemma: "بِنْيَة كِيمْيَائِيَّة"
      generation_method: tarkib
      justification: "لفظ تقني يشير إلى الهيكل والمكونات."

