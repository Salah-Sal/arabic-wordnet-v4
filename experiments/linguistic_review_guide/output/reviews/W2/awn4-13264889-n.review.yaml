# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13264889-n (employee ownership)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (مِلْكِيَّة المُوَظَّفِين)، وهو مركب إضافي ترجمي مباشر لـ employee ownership"
      - "المفهوم اقتصادي حديث لا يوجد له مصطلح عربي مفرد مسكوك"
      - "ينبغي التحقق من وجود بدائل مصطلحية عربية في أدبيات الاقتصاد التعاوني"
    observations: "المجموعة تعبّر عن مفهوم اقتصادي معاصر هو ملكية المنشأة التجارية من قبل العاملين فيها، وهو نمط من أنماط الملكية التشاركية. المركب الإضافي (ملكية + الموظفين) بنية طبيعية في العربية لكنه ترجمة حرفية للمصطلح الإنجليزي. قد توجد بدائل من حقل الاقتصاد التعاوني أو الشراكة العمالية."

  blind_candidates:
    - lemma: "مِلْكِيَّةٌ عُمَّالِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من (ملكية) و(عمّالية) نسبةً إلى العمّال، يُستخدم في الأدبيات الاقتصادية العربية للدلالة على ملكية العمال للمنشأة"
    - lemma: "تَمَلُّكُ العَامِلِينَ"
      generation_method: tarkib
      justification: "مركب إضافي من المصدر (تملّك) على وزن تَفَعُّل من ملك، يدل على فعل التملّك والاستحواذ، مضافاً إلى العاملين"
    - lemma: "مُسَاهَمَةُ العَامِلِينَ"
      generation_method: tarkib
      justification: "مركب إضافي من (مساهمة) بمعنى المشاركة في رأس المال، مضافاً إلى العاملين، شائع في سياق الشركات المساهمة"
    - lemma: "تَشَارُكِيَّةٌ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (تشارُك) على وزن تَفَاعُل من الجذر (شرك)، يدل على مبدأ التشارك في الملكية، لكنه عام لا يخصّص ملكية الموظفين"


stage2_evidence:
  per_lemma:
    - lemma: "مِلْكِيَّة المُوَظَّفِينَ"
      confirm:
        - text: "«المِلْكُ أو التمليك. يقال: بيدى عَقْد مِلكيّة هذه الأرض. قانون تحديد المِلْكِيَّة الزراعية: القانون الذى يحدِّد مقدار ما يجوز للفرد أن يمتلكه من الأرض الزراعية. الملكية الخاصة: ما يملكه الفرد. الملكية العامة: ما تملكه الدولة»"
          source: "المعجم الوسيط"
        - text: "«ownership; property»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«خُطَّةُ امْتِلاكِ الأَسْهُمِ للمُسْتَخْدَمِيْن — employee stock ownership plan»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يؤكد وجود مركبات عربية تجمع بين مفهومَي الامتلاك والمستخدمين في السياق المؤسسي"
        - text: "«مُسْتَخْدَم ؛ مُوَظَّف — employee»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يبيّن أن مُوَظَّف ومُسْتَخْدَم مترادفان في الاستعمال المصطلحي"

    - lemma: "مِلْكِيَّةٌ عُمَّالِيَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "تَمَلُّكُ العَامِلِينَ"
      expands:
        - text: "«(تملك) الشَّيْء امتلكه أَو ملكه قهرا»"
          source: "المعجم الوسيط"
          addition: "التملّك يدل على فعل الاستحواذ والأخذ، لا على حالة الملكية القارّة"

    - lemma: "مُسَاهَمَةُ العَامِلِينَ"
      contradicts:
        - text: "«مشاركة — الاشتراك في الحائط أو الأسس — joint ownership (of party wall, etc.)»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
          conflict: "المساهمة والمشاركة تدلان على الاشتراك في شيء لا على ملكية كاملة للمنشأة من قبل العاملين"

    - lemma: "تَشَارُكِيَّةٌ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "مِلْكِيَّة المُوَظَّفِينَ"
      decision: confirmed
      decision_reason: "مركب إضافي طبيعي في العربية يتكون من (مِلْكِيَّة) المثبتة في المعاجم بمعنى المِلْك والتمليك، و(المُوَظَّفِين) بمعنى العاملين في مؤسسة. المركب شفاف الدلالة ومتداول في الأدبيات الاقتصادية العربية المعاصرة. وجود مركبات مماثلة في المعاجم المتخصصة (ملكية تعاونية، ملكية مشتركة، ملكية جماعية) يؤكد إنتاجية هذا النمط التركيبي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِلْكِيَّةُ المُوَظَّفِينَ"

    - lemma: "مِلْكِيَّةٌ عُمَّالِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على هذا المركب الوصفي. كما أن نسبة (عُمَّالِيَّة) تحمل شحنة أيديولوجية اشتراكية قد تُضيّق المفهوم عن دلالته المحايدة. المركبات الوصفية الموثقة في المعاجم المتخصصة تستخدم أنماطاً مختلفة (ملكية تعاونية، ملكية مشتركة) لا (عمّالية)."
      evidence_assessment:
        case: no_material

    - lemma: "تَمَلُّكُ العَامِلِينَ"
      source: stage1
      decision: removed
      decision_reason: "التملّك مصدر يدل على فعل الاستحواذ والأخذ (امتلكه أو ملكه قهراً كما في الوسيط)، بينما المجموعة تدل على حالة الملكية القارّة لا على فعل الاستحواذ. كما أن دلالة القهر في التملّك تجعله غير ملائم للسياق التجاري الطوعي."
      evidence_assessment:
        case: mixed

    - lemma: "مُسَاهَمَةُ العَامِلِينَ"
      source: stage1
      decision: removed
      decision_reason: "المساهمة تدل على الاشتراك في جزء من رأس المال أو الحصص، لا على ملكية المنشأة بالكامل من قبل العاملين. المفهوم المقصود هو ملكية تامة لا مجرد مساهمة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَشَارُكِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح عام جداً يدل على مبدأ التشارك دون تحديد نوع الملكية أو هوية المتشاركين. لا يميّز ملكية الموظفين عن أي شكل آخر من أشكال الملكية المشتركة."
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "ملكية عمل تجاري من قبل الأشخاص الذين يعملون فيه"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية للتعريف الإنجليزي، ويمكن تحسينه بأسلوب معجمي عربي أدق مع تضمين الجنس القريب (نوع من الملكية) والفصل النوعي (العاملون في المنشأة)"
    authored:
      - type: terminological
        text: "نَمَطٌ مِنَ المِلْكِيَّةِ يَكُونُ فِيهِ العَامِلُونَ فِي مُنْشَأَةٍ تِجَارِيَّةٍ هُمْ أَصْحَابُهَا أَوْ مَالِكِي حِصَصِهَا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "امْتِلَاكُ العَامِلِينَ فِي مُؤَسَّسَةٍ تِجَارِيَّةٍ لِتِلْكَ المُؤَسَّسَةِ كُلِّيًّا أَوْ جُزْئِيًّا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نَمَطٌ مِنَ المِلْكِيَّةِ يَكُونُ فِيهِ العَامِلُونَ فِي مُنْشَأَةٍ تِجَارِيَّةٍ هُمْ أَصْحَابُهَا أَوْ مَالِكِي حِصَصِهَا"

  examples:
    per_lemma:
      - lemma: "مِلْكِيَّةُ المُوَظَّفِينَ"
        examples:
          - text: "تُعَدُّ مِلْكِيَّةُ المُوَظَّفِينَ مِنْ أَنْجَحِ نَمَاذِجِ الحَوْكَمَةِ فِي الشَّرِكَاتِ الصَّغِيرَةِ وَالمُتَوَسِّطَةِ، إِذْ تُعَزِّزُ الوَلَاءَ المُؤَسَّسِيَّ وَتَرْفَعُ الإِنْتَاجِيَّةَ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُعَدُّ مِلْكِيَّةُ المُوَظَّفِينَ مِنْ أَنْجَحِ نَمَاذِجِ الحَوْكَمَةِ فِي الشَّرِكَاتِ الصَّغِيرَةِ وَالمُتَوَسِّطَةِ، إِذْ تُعَزِّزُ الوَلَاءَ المُؤَسَّسِيَّ وَتَرْفَعُ الإِنْتَاجِيَّةَ."


