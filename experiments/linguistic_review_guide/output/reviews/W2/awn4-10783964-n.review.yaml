stage1_review:
  assessment:
    concerns:
      - "المفهوم الإنجليزي 'walk-in' يُشار إليه عادةً بلفظة مفردة تعمل كاسم أو صفة، بينما تفتقر العربية الفصحى للفظة مفردة شائعة لهذا المعنى الدقيق في سياق الخدمات الحديثة."
      - "اللمة الحالية 'زائر دون موعد' هي عبارة وصفية وليست وحدة معجمية مسكوكة بالكامل."
    observations: "المفهوم يشير إلى الشخص الذي يقصد جهة ما (عيادة، صالون، مكتب) طلباً للخدمة دون تنسيق مسبق. في العربية المعاصرة يُعبر عن ذلك بالتركيب الإضافي أو الوصفي."
  blind_candidates:
    - lemma: "زَائِرٌ بِلَا مَوْعِدٍ"
      generation_method: tarkib
      justification: "تركيب وصفي مباشر وشائع للزيارات الاجتماعية والتجارية."
    - lemma: "مُرَاجِعٌ بِدُونِ مَوْعِدٍ"
      generation_method: tarkib
      justification: "تركيب اصطلاحي شائع في السياق الإداري والطبي (المراجعة للعيادات والمكاتب)."
    - lemma: "طَارِقٌ"
      generation_method: majaz
      justification: "لفظ تراثي لمن يطرق الباب فجأة أو ليلاً، ويمكن توسيعه دلالياً ليشمل الزائر المفاجئ."
    - lemma: "وَافِدٌ عَفْوِيٌّ"
      generation_method: tarkib
      justification: "تعبير يصف طبيعة الحضور غير المخطط له."

stage2_evidence:
  per_lemma:
    - lemma: "زَائِر دُونَ مَوْعِد"
      confirm:
        - text: "«زَارَهُ زَوْراً وزِيَارَةً: قصده.»"
          source: "المعجم الوسيط"
        - text: "«مَوْعِد: وقت ومكان ضُرِب للقاء.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مُرَاجِعٌ بِدُونِ مَوْعِدٍ"
      confirm:
        - text: "«حيث حضرت بدون موعد فلن يقابلك المدير»"
          source: "معجم اللغة العربية المعاصرة (في مدخل حيث)"
      expands:
        - text: "«مُراجَعَةُ الدَّوائِرِ الحُكومِيَّة: الاختلاف إليها لإنجاز معاملة.»"
          source: "المعجم الوسيط (مستخلص)"
    - lemma: "طَارِئٌ"
      confirm:
        - text: "«طارئ: آتٍ من غير موعد walk-in patients»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الطارئ: الغريب الحادث المفاجئ.»"
          source: "المعجم الكبير"
    - lemma: "طَارِقٌ"
      expands:
        - text: "«الطارق: الآتي ليلاً طلبًا للضيافة، أو الاسْتِغاثَة، ونحوهما.»"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "زَائِر دُونَ مَوْعِد"
      decision: confirmed
      decision_reason: "اللفظ الحالي دقيق ووصف مقبول للمفهوم في السياق العام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَائِرٌ دُونَ مَوْعِدٍ"
    - lemma: "مُرَاجِعٌ بِدُونِ مَوْعِدٍ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني شائع جداً في البيئات المهنية والطبية والخدمية لوصف هذا النوع من الزوار."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مُرَاجِعٌ بِدُونِ مَوْعِدٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "طَارِئٌ"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة مفردة توثقها المعاجم الحديثة (المورد) للدلالة على القادم بغير موعد، وتدعمها المعاجم التراثية بمعنى 'الغريب'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "طَارِئٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "طَارِقٌ"
      source: stage1
      decision: removed
      decision_reason: "الصبغة التراثية والارتباط بالليل في المعاجم القديمة يجعلها غير ملائمة للسياق الخدمي الحديث المقصود بالمصطلح."

stage4_content:
  definition:
    current: "شخص يدخل دون الحصول على موعد مسبق"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب، ويحتاج إلى تحديد سياق الزيارة (الطلب للخدمة أو المراجعة) لتمييزه عن الدخول العابر."
    authored:
      - type: terminological
        text: "شَخْصٌ يَقْصِدُ مَحَلَّ عَمَلٍ أَوْ عِيَادَةً أَوْ مَكْتَبًا لِطَلَبِ خِدْمَةٍ دُونَ حُصُولٍ عَلَى مَوْعِدٍ مُسْبَقٍ أَوْ تَرْتِيبٍ تِلِيفُونِيٍّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ يَقْصِدُ مَحَلَّ عَمَلٍ أَوْ عِيَادَةً أَوْ مَكْتَبًا لِطَلَبِ خِدْمَةٍ دُونَ حُصُولٍ عَلَى مَوْعِدٍ مُسْبَقٍ."}

  examples:
    per_lemma:
      - lemma: "زَائِرٌ دُونَ مَوْعِدٍ"
        examples:
          - text: "يَسْتَقْبِلُ المَطْعَمُ كُلَّ زَائِرٍ دُونَ مَوْعِدٍ إِذَا وُجِدَتْ طَاوِلَةٌ شَاغِرَةٌ."
            type: usage
      - lemma: "مُرَاجِعٌ بِدُونِ مَوْعِدٍ"
        examples:
          - text: "تَمَّ تَخْصِيصُ سَاعَةٍ يَوْمِيًّا لِاسْتِقْبَالِ المُرَاجِعِينَ بِدُونِ مَوْعِدٍ."
            type: usage
      - lemma: "طَارِئٌ"
        examples:
          - text: "يُعَامَلُ كُلُّ طَارِئٍ لا يَمْلِكُ مَوْعِداً مُسْبَقاً بِنِظَامِ أَوْلَوِيَّةِ الوُصُولِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "خَصَّصَتِ العِيادَةُ طَبيباً لِفَحْصِ كُلِّ طَارِئٍ لا يَمْلِكُ مَوْعِداً مُسْبَقاً."}

