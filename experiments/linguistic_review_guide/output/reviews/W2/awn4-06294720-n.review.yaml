# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما تعبيران مركّبان طويلان نسبياً، ولا يوجد مصطلح مفرد"
      - "اللمّة «اللغة المترجم إليها» عبارة وصفية حرّة أكثر منها مصطلحاً ثابتاً"
      - "كلتا اللمّتين بدون تشكيل"
    observations: "المفهوم ينتمي إلى حقل الترجمة واللسانيات التطبيقية، وله مقابلات عربية مُقعَّدة في المعاجم المصطلحية الحديثة (معاجم ألكسو). التعريف واضح ومباشر: اللغة التي يُنقَل إليها نصّ من لغة أخرى. المصطلح الإنجليزي target language أكثر شيوعاً من object language في سياق الترجمة."
  blind_candidates:
    - lemma: "لُغَةُ الهَدَف"
      generation_method: tarkib
      justification: "تركيب إضافيّ من «لغة» و«الهدف»، على نمط المصطلحات الحديثة في اللسانيات التطبيقية، يقابل target language مباشرة"
    - lemma: "لُغَة مُسْتَهْدَفَة"
      generation_method: tarkib
      justification: "تركيب وصفيّ من «لغة» واسم المفعول «مستهدفة» من استهدف، يعني اللغة التي يُراد الوصول إليها في الترجمة"
    - lemma: "اللُّغَة المَنْقُول إِلَيْهَا"
      generation_method: tarkib
      justification: "تركيب وصفيّ يصف اللغة بأنها الجهة المنقول إليها النصّ، من جذر ن ق ل الذي يُستعمل في سياق الترجمة (النقل)"
    - lemma: "لُغَة المَآل"
      generation_method: ishtiqaq
      justification: "من جذر أ و ل (آلَ يؤول)، والمآل: ما يصير إليه الشيء، فلغة المآل هي اللغة التي يصير إليها النصّ بعد الترجمة"

