# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06287054-n (radiogram)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (برقية لاسلكية) وهي تعبير مركب وصفي، ولا توجد لمّة مفردة بديلة"
      - "التعريف العربي ترجمة حرفية شبه كاملة للتعريف الإنجليزي"
    observations: "المفهوم ينتمي إلى مجال الاتصالات اللاسلكية التاريخية. البرقية اللاسلكية هي رسالة تُرسل عبر التلغراف اللاسلكي (الراديو)، وهي تقنية بائدة تقريباً. المصطلح العربي مركب وصفي واضح الدلالة من مكوّنيه: برقية (رسالة تلغرافية) + لاسلكية (صفة تميّزها عن البرقية السلكية). يحتاج المفهوم إلى تدقيق التشكيل وربما إضافة مرادف بديل."
  blind_candidates:
    - lemma: "بَرْقِيَّة لَاسِلْكِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من بَرْقِيَّة (رسالة تلغرافية، من جذر ب ر ق بمعنى اللمعان والإشارة السريعة) + لَاسِلْكِيَّة (صفة تدل على انعدام الأسلاك). أقرب تعبير عربي فصيح للمفهوم، وهو مثبت في المعاجم الموحدة."
    - lemma: "بَرْقِيَّة رَادْيُوِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي بديل يصف وسيلة الإرسال بالراديو بدلاً من وصف انعدام الأسلاك. الصفة رَادْيُوِيَّة منسوبة إلى الراديو، وهي مستعملة في المصطلحات العلمية العربية."
    - lemma: "إِبْرَاقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من إِبْرَاق (مصدر أَبْرَقَ = أرسل برقية) على وزن إِفْعَالِيَّة. محاولة لسكّ مصطلح مفرد يغني عن المركب، لكنه غير مسكوك معجمياً."
    - lemma: "رَادْيُوغْرَام"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي radiogram. ملاذ أخير لأن المقابل العربي المركب متوفر وشائع."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بَرْقِيَّة لَاسِلْكِيَّة"
      confirm:
        - text: "«برقية لاسلكية — radiotelegram; radiogram — radiotélégramme; radiogramme»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«(2) برقية رادْيُويّة أو لاسلكيّة.» في مدخل radiogram"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«ابراق لاسلكي — radiotelegraphy» (المصدر المقابل لعملية الإرسال)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "يوجد مصطلح موازٍ للعملية (إبراق لاسلكي) مما يؤكد اتساق الحقل المصطلحي"
        - text: "«برقية راديو — radiotelegram — radiotélégramme»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "صيغة بديلة تستخدم راديو بدل لاسلكية"

    - lemma: "بَرْقِيَّة رَادْيُوِيَّة"
      confirm:
        - text: "«(2) برقية رادْيُويّة أو لاسلكيّة.» في مدخل radiogram"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«برقية راديو — radiotelegram»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "صيغة قريبة تستخدم راديو اسماً مضافاً إليه بدل الصفة المنسوبة رَادْيُوِيَّة"

    - lemma: "إِبْرَاقِيَّة"
      evidence_status: "no_material_found"

    - lemma: "رَادْيُوغْرَام"
      contradicts:
        - text: "«صُورَةٌ شُعاعِيَّة — radiogram (radiograph) — radiogramme»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "في المجال الطبي radiogram/radiogramme تعني صورة شعاعية (أشعة سينية) لا برقية لاسلكية، مما يجعل التعريب ملتبساً"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "بَرْقِيَّة لَاسِلْكِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مثبت في المعجم الموحد لمصطلحات الفيزياء (1989) والمورد الحديث (2008) كمقابل دقيق لـ radiotelegram/radiogram. التركيب الوصفي واضح الدلالة ومتّسق مع الحقل المصطلحي (إبراق لاسلكي، مبرقة لاسلكية)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَرْقِيَّة لَاسِلْكِيَّة"

    - lemma: "بَرْقِيَّة رَادْيُوِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مثبتة في المورد الحديث (2008) كمرادف صريح لـ 'برقية لاسلكية' في مدخل radiogram. الصفة رَادْيُوِيَّة منسوبة نسبة صحيحة إلى الراديو، والمركب يحقق التمييز عن البرقية السلكية بذكر وسيلة الإرسال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تصف وسيلة الإرسال (الراديو) بينما 'لاسلكية' تصف غياب الأسلاك. الأولى أدق تقنياً والثانية أعم."
      actions:
        - command: create_entry
          params: {lemma: "بَرْقِيَّة رَادْيُوِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "إِبْرَاقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لفظ مولّد غير مسكوك معجمياً ولا مثبت في أي مصدر. المصدر الصناعي إِبْرَاقِيَّة لا يميّز بين الرسالة والعملية، وقد يلتبس بمعنى 'صفة الإبراق' لا 'الرسالة المُبرَقة'."

    - lemma: "رَادْيُوغْرَام"
      source: stage1
      decision: removed
      decision_reason: "تعريب غير ضروري لوجود المقابل العربي المركب المثبت. فضلاً عن الالتباس مع المعنى الطبي (صورة شعاعية) المثبت في المعجم الطبي الموحد."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "رسالة تنقل بواسطة التلغراف اللاسلكي"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية للتعريف الإنجليزي. يحتاج إلى صياغة معجمية عربية أصيلة بأسلوب الجنس القريب والفصل النوعي، مع توضيح أن التلغراف اللاسلكي يعني الإبراق بالموجات الراديوية."
    authored:
      - type: terminological
        text: "رسالةٌ تُبَثّ وتُستقبَل بطريق الإبراق اللاسلكيّ (الراديو) دون الحاجة إلى أسلاك توصيل"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "رسالةٌ تُبَثّ وتُستقبَل بطريق الإبراق اللاسلكيّ (الراديو) دون الحاجة إلى أسلاك توصيل"

  examples:
    per_lemma:
      - lemma: "بَرْقِيَّة لَاسِلْكِيَّة"
        examples:
          - text: "أرسلت السفينة برقيّةً لاسلكيّةً إلى الميناء تُبلغ فيها عن موقعها قبيل العاصفة."
            type: usage
      - lemma: "بَرْقِيَّة رَادْيُوِيَّة"
        examples:
          - text: "اعتمدت القوّات المسلّحة على البرقيّات الراديويّة في تنسيق العمليّات قبل انتشار الاتّصالات الرقميّة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أرسلت السفينة برقيّةً لاسلكيّةً إلى الميناء تُبلغ فيها عن موقعها قبيل العاصفة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اعتمدت القوّات المسلّحة على البرقيّات الراديويّة في تنسيق العمليّات قبل انتشار الاتّصالات الرقميّة."

