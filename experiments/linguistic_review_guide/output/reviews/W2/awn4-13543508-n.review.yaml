    - lemma: "تَثْبِيتُ الآزُوت"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف علمي أصيل ومعتمد في عدة قواميس (مثل معجم الهندسة المدنية ومسرد البيئة)، ويستخدم على نطاق واسع في المناهج العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "تَثْبِيتُ الآزُوت"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَثْبِيتُ النِّتْرُوجِين"
      source: stage1
      decision: confirmed
      decision_reason: "رسم إملائي شائع ومعتمد في المعاجم الطبية (المعجم الطبي الموحد) والمورد الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "تَثْبِيتُ النِّتْرُوجِين"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "التَّثْبِيتُ الحَيَوِيُّ لِلنِّيتْرُوجِين"
      source: stage1
      decision: removed
      decision_reason: "المفهوم في المجموعة الترادفية يُغطي (nitrogen fixation) بشكل عام وإن كان التعريف يذكر البكتيريا. المعاجم تورد (تثبيت النيتروجين) للمصطلح الإنجليزي المعني، والتركيب هنا مفرط في التخصيص."

stage4_content:
  definition:
    current: "استيعاب بكتيريا التربة للنيتروجين الجوي وإطلاقه لاستخدام النبات عند موت البكتيريا"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك الترجمة. تم إعادة صياغته بأسلوب علمي سليم يجمع بين الجنس القريب (عملية حيوية) والفصل النوعي (استيعاب بكتيريا التربة وإطلاق المركبات)."
    authored:
      - type: terminological
        text: "عملية حيوية تقوم فيها بكتيريا التربة باستيعاب النيتروجين الجوي، ومن ثم إطلاقه في شكل مركبات عضوية يستفيد منها النبات عند موت تلك البكتيريا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية حيوية تقوم فيها بكتيريا التربة باستيعاب النيتروجين الجوي، ومن ثم إطلاقه في شكل مركبات عضوية يستفيد منها النبات عند موت تلك البكتيريا."

  examples:
    per_lemma:
      - lemma: "تَثْبِيتُ النِّيتْرُوجِين"
        examples:
          - text: "تُسهم عملية تَثْبِيت النِّيتْرُوجِين في زيادة خصوبة التربة وتقليل الاعتماد على الأسمدة الكيميائية."
            type: usage
      - lemma: "تَثْبِيتُ الآزُوت"
        examples:
          - text: "تُعدّ زراعة البقوليات من أهم الوسائل الطبيعية لِتَثْبِيتِ الآزُوت في الأراضي الزراعية."
            type: usage
      - lemma: "تَثْبِيتُ النِّتْرُوجِين"
        examples:
          - text: "تلعب البكتيريا التكافلية دوراً محورياً في تَثْبِيتِ النِّتْرُوجِين داخل العقد الجذرية للنباتات."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُسهم عملية تَثْبِيت النِّيتْرُوجِين في زيادة خصوبة التربة وتقليل الاعتماد على الأسمدة الكيميائية."

