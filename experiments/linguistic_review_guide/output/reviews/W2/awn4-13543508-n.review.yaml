      decision_reason: "المصطلح الأساسي والشائع والمعتمد في المعاجم المتخصصة، لكنه يحتاج إلى ضبط بالشكل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
