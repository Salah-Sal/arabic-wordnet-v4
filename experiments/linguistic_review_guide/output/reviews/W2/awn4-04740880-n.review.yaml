      maqayis_quote: "«الْقَافُ وَاللَّامُ وَالْبَاءُ أَصْلَانِ صَحِيحَانِ... الْآخَرُ عَلَى رَدِّ شَيْءٍ مِنْ جِهَةٍ إِلَى جِهَةٍ.»"
    - lemma: "تَغَيُّرِيَّة"
