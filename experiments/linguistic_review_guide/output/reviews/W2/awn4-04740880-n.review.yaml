stage1_review:
  assessment:
    concerns:
      - "اللمة 'تقلب' تشير غالبا إلى عملية التبدل أو الاضطراب (fluctuation) أكثر من كونها صفة مجردة للقابلية للتغير (changeability)."
      - "نقص في الأسماء المجردة (abstract nouns) التي تنتهي بـ'ـية' والتي تعبر عن الصفة المحضة في العربية الحديثة."
    observations: "المجموعة تدور حول صفة القابلية للتبدل. اللمات الموجودة صحيحة ولكنها تميل للجانب الوصفي أو العملي، ويمكن إثراؤها بمصطلحات أكثر دقة في التعبير عن 'الماهية' أو 'الصفة الجوهرية' مثل 'تغيرية' و'تقلبية'."
  blind_candidates:
    - lemma: "تَغَيُّرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'تغير' على وزن 'تَفَعُّلِيَّة' للتعبير عن صفة القابلية للتغير (Variability/Changeability)."
    - lemma: "تَقَلُّبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'تقلب' للتعبير عن صفة عدم الاستقرار أو القابلية للتحول السريع (Volatility/Changeability)."
    - lemma: "قَابِلِيَّة التَّغَيُّر"
      generation_method: tarkib
      justification: "تركيب إضافي مباشر يصف الحالة بدقة، وهو مستخدم في المعاجم التقنية."
    - lemma: "تَحَوُّلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'تحول' يشير إلى القدرة على الانتقال من حال إلى حال."

stage2_evidence:
  per_lemma:
    - lemma: "تَقَلُّب"
      confirm:
        - text: "«تغير كبير وسريع ومتكرر لحجم السكان...»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«متغير، قابل للتغير والتحول» (عن المتقلب)"
          source: "تكملة المعاجم لـ دوزي"
    - lemma: "قَابِلِيَّة لِلتَّغْيِير"
      confirm:
        - text: "«المقصود بقابلية التغيير هنا هو رفع درجة المرونة...»"
          source: "المعجم الموحد لمصطلحات النقل"
    - lemma: "تَغَيُّرِيَّة"
      confirm:
        - text: "«تغيرية: variability»"
          source: "المعجم الموحد لمصطلحات الفيزياء"
        - text: "«تغيرية: variability; variance»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "تَقَلُّبِيَّة"
      confirm:
        - text: "«تغير، تلون، تبدل، تحول»"
          source: "تكملة المعاجم لـ دوزي"
    - lemma: "قَابِلِيَّة التَّغَيُّر"
      confirm:
        - text: "«المقصود بقابلية التغيير (تغير) هنا هو رفع درجة المرونة...»"
          source: "المعجم الموحد لمصطلحات النقل"
    - lemma: "تَحَوُّلِيَّة"
      contradicts:
        - text: "«تحولية: transformism»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          conflict: "المصطلح يشير إلى نظرية التحول (الارتقاء) في الأحياء أو الجيولوجيا وليس لمجرد القابلية للتغير."

stage3_analysis:
  per_lemma:
    - lemma: "تَقَلُّب"
      decision: confirmed
      decision_reason: "مصطلح أصيل يعبر عن الحالة الحركية للتغير والتبدل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركز على الجانب الحركي والفعلي للتبدل المتكرر أو السريع."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقَلُّب"
    - lemma: "قَابِلِيَّة لِلتَّغْيِير"
      decision: confirmed
      decision_reason: "تعبير اصطلاحي شائع ومباشر للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير عام يركز على الإمكانية الخارجية أو الاستعداد للتبدل."
    - lemma: "تَغَيُّرِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق يعبر عن 'الخصلة' أو 'الصفة' (quality) كاسم مجرد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركز على 'القدر' أو 'الدرجة' التي يمكن للشيء أن يتغير بها (Variability)."
      actions:
        - command: create_entry
          params: {lemma: "تَغَيُّرِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَقَلُّبِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي موثق يعبر عن طبيعة الشيء المتقلب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يشير إلى طبيعة عدم الاستقرار والميل للتحول (Volatility)."
      actions:
        - command: create_entry
          params: {lemma: "تَقَلُّبِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "قَابِلِيَّة التَّغَيُّر"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب إضافي فصيح ومستخدم في السياقات العلمية والنقلية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "أكثر تخصصاً من 'القابلية للتغيير' حيث يركز على التغير الذاتي (intransitive)."
      actions:
        - command: create_entry
          params: {lemma: "قَابِلِيَّة التَّغَيُّر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "صفة القابلية للتغير؛ وجود ميل ملحوظ للتغير"
    assessment:
      decision: revise
      reason: "التعريف الحالي مكرر ويفتقر للتركيبة المعجمية الرصينة."
    authored:
      - type: terminological
        text: "كَوْنُ الشَّيْءِ قَابِلًا لِلتَّغَيُّرِ، أَوْ وُجُودُ مَيْلٍ ذَاتِيٍّ فِيهِ لِلِانْتِقَالِ مِنْ حَالٍ إِلَى حَالٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "كَوْنُ الشَّيْءِ قَابِلًا لِلتَّغَيُّرِ، أَوْ وُجُودُ مَيْلٍ ذَاتِيٍّ فِيهِ لِلِانْتِقَالِ مِنْ حَالٍ إِلَى حَالٍ."}
  examples:
    per_lemma:
      - lemma: "تَقَلُّب"
        examples:
          - text: "عُرِفَ عَنْهُ تَقَلُّبُ مَزَاجِهِ وَسُرْعَةُ تَحَوُّلِهِ مِنْ فَرَحٍ إِلَى حُزْنٍ."
            type: usage
      - lemma: "تَغَيُّرِيَّة"
        examples:
          - text: "تَمْتَازُ هَذِهِ الْمَوَادُّ بِتَغَيُّرِيَّةٍ عَالِيَةٍ عِنْدَ تَعَرُّضِهَا لِلْحَرَارَةِ."
            type: usage
      - lemma: "قَابِلِيَّة لِلتَّغْيِير"
        examples:
          - text: "تُعَدُّ قَابِلِيَّةُ النِّظَامِ لِلتَّغْيِيرِ مِيزَةً أَسَاسِيَّةً لِمُوَاجَهَةِ الْمُسْتَجِدَّاتِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُؤَثِّرُ تَقَلُّبِيَّةُ السُّوقِ عَلَى قَرَارَاتِ الْمُسْتَثْمِرِينَ."}

