# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13565986-n  |  ILI: i107888  |  POS: n
# English: quickening — "the process of showing signs of life"
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. المرشحات الأعمى — توليد قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "اِسْتِحْيَاء"
      generation_method: ishtiqaq
      justification: >
        من الجذر ح-ي-ي، وزن استفعال؛ الاستفعال هنا بمعنى طلب الحياة أو اكتسابها.
        «استحيا النباتُ» تعبير مستعمل عند بعض الفقهاء بمعنى أن الأرض بدأت تُظهر الحياة.
        يُؤمَّل أن يدلّ على عملية إظهار الكائن لعلامات حياته.

    - lemma: "تَنَبُّض"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن-ب-ض، وزن تفعُّل (تكرار وتدرّج)؛ النبضُ هو أبرز علامات الحياة.
        تَنَبُّض = الشروعُ في النبض أو ظهوره تدريجياً، وهو ما يناسب دلالة «عملية إظهار
        علامات الحياة» أيما مناسبة.

    - lemma: "بُدُوُّ الحَيَاة"
      generation_method: tarkib
      justification: >
        تركيب إضافي: بُدُوّ (مصدر بدا يبدو = ظهر) + الحياة. يُعبِّر عن لحظة ظهور
        علامات الحياة في الكائن الحي. مُحاكاةٌ للبنية الإضافية المعهودة في
        المصطلح الطبي العربي.

    - lemma: "إِيمَاض"
      generation_method: majaz
      justification: >
        من الجذر و-م-ض (وَمَضَ البرقُ = لمع فجأةً)؛ المجاز هنا إزاحةٌ دلالية
        من «اللمعة الخاطفة» إلى «البارقة الأولى من الحياة»، كما يُقال «لمعت في
        عينيه بارقةُ الحياة». يُوجِز المفهومَ في لفظ مفرد عربي خالص.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - >
        لمّة «تدبب الحياة» غير موثّقة في أي معجم من المعاجم المستعلَمة (760 ألف مدخل)؛
        وهي مركّب إضافي لم يُسَكَّ معجمياً بعد، مما يجعله عبارةً وصفيةً لا مصطلحاً ثابتاً.
      - >
        الزوج (انتعاش / تدبب الحياة) يفتقر إلى التمايز الدلالي الموثَّق: لا يوجد في المصادر
        ما يُبرز الفرق بين اللمّتين في هذا السياق البيولوجي.
      - >
        التعريف الحالي «عملية إظهار علامات الحياة» مقتضب وافتقر إلى الجنس القريب
        البيولوجي الصريح والفصل النوعي الكافي.
    observations: >
      تنتمي هذه المجموعة إلى الحقل الدلالي للعمليات البيولوجية في الكائنات الحية.
      المفهوم الإنجليزي «quickening» له معنيان رئيسيان: (١) في علم الأجنّة: أولُ حركات
      الجنين التي تُحسّها الأمّ (نحو الأسبوع الثامن عشر)؛ (٢) بمعنى أعمّ: إظهارُ
      أي كائن لعلامات حياته بعد سكون أو خمول.
      لمّة «انتعاش» مشتقّةٌ من «نَعَشَ» الذي يدلّ على الرفع والنهوض — وهو مطابق
      تماماً لمعنى الإفاقة والتعافي وظهور الحياة. أما «تدبب الحياة» فتستند إلى جذر
      «دبّ» بمعنى الحركة الخفيفة الدبيبية، وهو تصوير شعري جميل لأولى حركات الجنين،
      لكنه يبقى تعبيراً إنشائياً لا وحدةً مصطلحية مسكوكة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1: batch headword lookup — انتعاش + تدبب + إيماض + استحياء + تنبض + بدو الحياة
#   Q2: enrichment by entry_id (definitions + examples)
#   Q3: English bridge — quickening / signs of life / revival / animation
#   Q4: Arabic FTS — علامات الحياة / تدبب / دبيب / انتعاش
#   Q5: مقاييس اللغة (dictionary_id=151) — جذور: نعش / دبب / حيي
stage2_evidence:

  per_lemma:

    # ── لمّة موجودة: انتعاش ──
    - lemma: "انتعاش"
      confirm:
        - text: >
            «اِنْتَعَشَ الطَّائِرُ: نَهَضَ عَنْ عَثْرَتِهِ. يُقَالُ: نَعَشَهُ اللَّهُ
            وَأَنْعَشَهُ.»
          source: "مقاييس اللغة لابن فارس (ت 395هـ)"
        - text: >
            «استعادة العمليات الطبيعية والوراثية والدموغرافية، أو المعاملات البيئية
            للمجموعة أو للأنواع، بالمقارنة مع الوضع عند الشروع في أنشطة الإنعاش.
            كما يأخذ بعين الاعتبار الوضع السابق من ناحية الوفرة، والهيكل والديناميكية،
            لاستئناف الدور البيئي والتطوري لها.»
            [translation_en: "recovery"]
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — أرابترم"
      expands:
        - text: >
            «النُّونُ وَالْعَيْنُ وَالشِّينُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى رَفْعٍ
            وَارْتِفَاعٍ. قَالَ الْخَلِيلُ: النَّعْشُ: سَرِيرُ الْمَيِّتِ، كَذَا
            تَعْرِفُهُ الْعَرَبُ. وَمَيِّتٌ مَنْعُوشٌ: مَحْمُولٌ عَلَى النَّعْشِ.
            وَانْتَعَشَ الطَّائِرُ: نَهَضَ عَنْ عَثْرَتِهِ. يُقَالُ: نَعَشَهُ اللَّهُ
            وَأَنْعَشَهُ.»
          source: "مقاييس اللغة لابن فارس (ت 395هـ)"
          addition: >
            يكشف الأصل المعجمي عن دلالة الرفع والنهوض من الاضطجاع أو العثرة،
            وهو يدعم استعمال «انتعاش» للدلالة على «ظهور علامات الحياة بعد خمول».
            الصورة التعبيرية القرآنية «انتعاش الطائر» تقابل «quickening» تماماً.

    # ── لمّة موجودة: تدبب الحياة ──
    - lemma: "تدبب الحياة"
      expands:
        - text: >
            «الدَّالُ وَالْبَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ مُنْقَاسٌ، وَهُوَ حَرَكَةٌ
            عَلَى الْأَرْضِ أَخَفُّ مِنَ الْمَشْيِ. تَقُولُ: دَبَّ دَبِيبًا.
            وَكُلُّ مَا مَشَى عَلَى الْأَرْضِ فَهُوَ دَابَّةٌ.»
          source: "مقاييس اللغة لابن فارس (ت 395هـ)"
          addition: >
            يثبت المقاييس دلالة الجذر د-ب-ب على الحركة الخفيفة الدبيبية، لكنه
            لا يُثبت مصطلح «تدبب الحياة» كوحدة معجمية مسكوكة. لم يرد المركّب
            في أي مصدر من المصادر المستعلَمة.
      # لا confirm ولا contradicts صريح للمركّب كاملاً

    # ── مرشح المرحلة ١: اِسْتِحْيَاء ──
    - lemma: "اِسْتِحْيَاء"
      contradicts:
        - text: >
            «الْحَاءُ وَالْيَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ: أَحَدُهُمَا
            خِلَافُ الْمَوْتِ، وَالْآخَرُ الِاسْتِحْيَاءُ الَّذِي [هُوَ] ضِدُّ
            الْوَقَاحَةِ. [...] وَالْأَصْلُ الْآخَرُ: قَوْلُهُمُ اسْتَحْيَيْتُ
            مِنْهُ اسْتِحْيَاءً. وَقَالَ أَبُو زَيْدٍ: حَيِيتُ مِنْهُ أَحْيَا،
            إِذَا اسْتَحْيَيْتَ.»
          source: "مقاييس اللغة لابن فارس (ت 395هـ)"
          conflict: >
            «استحياء» يُفيد الحياء والخجل في الاستعمال العربي الراسخ، لا عودةَ
            الحياة أو ظهورَ علاماتها. الوزن استفعال من حيي محمولٌ في الموروث
            العربي على «طلب الحياء» لا «طلب الحياة»، مما يُوقع في اشتراك لفظي
            مُضِرّ بالدقة المصطلحية.

    # ── مرشح المرحلة ١: تَنَبُّض ──
    - lemma: "تَنَبُّض"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١: بُدُوُّ الحَيَاة ──
    - lemma: "بُدُوُّ الحَيَاة"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١: إِيمَاض ──
    - lemma: "إِيمَاض"
      contradicts:
        - text: >
            «عملية تبخير سائل ما عن طريق تخفيض ضغطه عوضاً عن رفع درجة حرارته»
            [translation_en: "flashing"]
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — أرابترم"
          conflict: >
            «إيماض» مصطلحٌ هندسي راسخ يدلّ على عملية فيزيائية (تبخير السائل
            بخفض الضغط)، ولا صلة له بإظهار علامات الحياة. استعماله هنا سيوقع
            في لبس مصطلحي مع مجال الهندسة المدنية.


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── انتعاش (موجودة) ──
    - lemma: "انتعاش"
      decision: confirmed
      decision_reason: >
        اللمّة راسخة لغوياً ومعجمياً؛ المقاييس يُثبت أن جذر «نعش» يدلّ على الرفع
        والنهوض (انتعش الطائر: نهض عن عثرته)، وهو الدلالة ذاتها لـ «quickening».
        المصطلح مستعمل في النصوص التقنية الحديثة (ARABTERM) بمعنى «recovery/rebound»
        في السياقات البيولوجية والبيئية. التشكيل الكامل: اِنْتِعَاش.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphology_check:
        pattern: "اِفْتِعَال"
        root: "نعش"
        function_fit: >
          وزن افتعال يناسب المصادر التي تُفيد الطواعية والتجدد، مما يلائم
          «إظهار الحياة» بوصفه عمليةً تجدُّدية.
      loan_check:
        lexical_borrowing: native
        calque_check: inapplicable
      quality_gate:
        ittiraad: "مطّرد — انتعش/ينتعش/منتعش/إنعاش"
        yusr: "سهل التداول، مألوف في الاستعمال الرسمي والطبي"
        mulaama: "ملائم للسياق البيولوجي وأوسع منه"
        turath: "موثَّق في المقاييس ومستعمل في التراث والحداثة"
        arabiyya: "عربي خالص، مشتق من جذر عربي صحيح"
        ishtiqaqiyya: "يشتق منه: نعش، إنعاش، منتعش، ناعش"
      nuance_differentiation: >
        «اِنْتِعَاش» يُركِّز على جانب النهوض والإفاقة من الوهن أو الخمول؛
        يُضمِّن معنى العودة إلى الحياة بعد سكون، لا مجرّد وجود الحياة.
        يُستعمل في السياقات البيولوجية والاقتصادية والبيئية، وهو الوحيد المؤكَّد
        في هذه المجموعة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْتِعَاش"

    # ── تدبب الحياة (موجودة) ──
    - lemma: "تدبب الحياة"
      decision: removed
      decision_reason: >
        لم يرد المركّب «تدبب الحياة» في أيٍّ من المصادر المستعلَمة (760 ألف مدخل
        من 107 معاجم). وهو لا يجتاز اختبار السكّ المعجمي: يمكن إبدال «تدبب» بـ
        «دبيب» أو «حركة» مع بقائه وصفاً صحيحاً، مما يدلّ على أنه عبارة وصفية
        حرّة لا مصطلح مثبَّت. وعلى الرغم من أن الجذر «دبّ» يحمل صورة طريفة
        لأول حركة الجنين، فإن التركيب لم يُسَكَّ ولم يُثبَّت معجمياً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: اِسْتِحْيَاء ──
    - lemma: "اِسْتِحْيَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال الراسخ لـ «استحياء» في العربية هو الحياء والخجل، وهو ضد الوقاحة
        كما نصّ ابن فارس. استعماله بمعنى «ظهور علامات الحياة» سيُنشئ اشتراكاً
        لفظياً مع المعنى السلوكي المتداول، مما يُلحق ضرراً بالدقة المصطلحية.
      evidence_assessment:
        case: contradicts_only

    # ── مرشح المرحلة ١: تَنَبُّض ──
    - lemma: "تَنَبُّض"
      source: stage1
      decision: removed
      decision_reason: >
        الاشتقاق من «نبض» على وزن تفعُّل سليمٌ قياساً، غير أن المصطلح غير مسكوك
        ولا مسجَّل في أي معجم من المعاجم المستعلَمة. الجذر ن-ب-ض موثَّق بمعنى
        النبضة والإيقاع القلبي، لكن «تنبُّض» لم يُعهد مصطلحاً مستقلاً.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: بُدُوُّ الحَيَاة ──
    - lemma: "بُدُوُّ الحَيَاة"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب إضافي غير مسكوك. لا يجتاز اختبار التثبيت المعجمي: «بدوّ» قابل
        للاستبدال بـ «ظهور» أو «بروز» مع الإبقاء على الوصف ذاته، مما يُثبت أنه
        عبارة وصفية حرّة لا وحدة معجمية.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: إِيمَاض ──
    - lemma: "إِيمَاض"
      source: stage1
      decision: removed
      decision_reason: >
        «إيماض» مصطلح هندسي متخصص يعني تبخير السائل بخفض الضغط (flashing في
        الهندسة المدنية)، موثَّق في ARABTERM. استعماله بمعنى «ظهور علامات الحياة»
        سيُحدث تضارباً مباشراً مع المصطلح الهندسي الراسخ.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
# تُعالج فقط اللمّات المؤكدة: اِنْتِعَاش
stage4_content:

  definition:
    current: "عملية إظهار علامات الحياة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقتضب وافتقر إلى: (أ) الجنس القريب البيولوجي الصريح،
        (ب) تمييز المفهوم عن مجرد «الحياة» بإبراز طابع العملية والتحوّل من الخمول
