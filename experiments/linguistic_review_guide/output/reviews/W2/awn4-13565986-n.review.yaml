            سلامة النموّ الجنيني وانتعاشِ وظائفِه الحيوية.

  examples:
    per_lemma:
      - lemma: "اِنْتِعَاش"
        examples:
          - text: >
              رصدَ الأطباءُ اِنْتِعَاشَ الجنينِ في الأسبوعِ الثامن عشر من الحمل،
              حين بدأت أمُّه تُحسُّ بحركاتِه الأولى وتُلاحظ نبضاتِ قلبِه المنتظمة.
            type: usage
    actions:
      - command: add_sense_example
        params:
