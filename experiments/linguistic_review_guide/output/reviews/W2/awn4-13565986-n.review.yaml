        علاوةً على ذلك، «إظهار» كلمة واردة في التعريف والمصطلح في آنٍ معاً
        مما يوقع في خفيف الدوران.
    authored:
      - type: terminological
        text: >
          عمليةٌ بيولوجيةٌ تتمثَّل في بدءِ ظهورِ علاماتِ الحياةِ — كالحركةِ
          والنبضِ والتنفُّسِ — في كائنٍ حيٍّ أو جنينٍ بعد مرحلةِ سكونٍ أو خمول.
