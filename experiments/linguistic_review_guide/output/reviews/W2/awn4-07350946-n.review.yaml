stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية (اندثار، زوال) تغطي الجانب المادي والتحول الزمني، لكنها تفتقر للّفظ الفلسفي الأشمل (فناء) واللفظ الذي يعبر عن الصيرورة للاشيء (تلاشٍ)."
    observations: "المجموعة تعبر عن مفهوم الـ 'Disappearance' بمعناه الوجودي والفيزيائي. اللمّات المقترحة تهدف لاستكمال الشبكة الدلالية لتشمل التدرج في الاختفاء (اضمحلال) والنهاية المطلقة (فناء)."
  blind_candidates:
    - lemma: "فَنَاء"
      generation_method: ishtiqaq
      justification: "المقابل المباشر للبقاء، ويعبر عن نهاية الوجود مطلقاً."
    - lemma: "تَلَاشٍ"
      generation_method: ishtiqaq
      justification: "يعبر عن الصيرورة إلى اللاشيء (لا + شيء) وهو مستعمل بكثرة في السياقات العلمية والأدبية."
    - lemma: "اِضْمِحْلَال"
      generation_method: ishtiqaq
      justification: "يعبر عن التلاشي التدريجي والضعف المؤدي إلى العدم."
    - lemma: "غِيَاب"
      generation_method: majaz
      justification: "التوقف عن الحضور في حيز الوجود أو الوعي."

stage2_evidence:
  per_lemma:
    - lemma: "اندثار"
      confirm:
        - text: "«اندثار: اختفاء الاستجابة الشرطية النفسية نتيجة عدم التعزيز.»"
          source: "معجم المصطلحات الطبية"
        - text: "«انقراض، اندثار: انتهاء خط تطوريّ دون أن يترك أنسالا.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة"
    - lemma: "زوال"
      confirm:
        - text: "«الزَّوالُ: الذَّهابُ، والاستِحالةُ»"
          source: "القاموس المحيط"
        - text: "«زَالَت الشَّمْس ودلكت وزاغت وَفَاء الفيئ... وانتقل الظل»"
          source: "الألفاظ المختلفة لابن مالك"
    - lemma: "فَنَاء"
      confirm:
        - text: "«الفناء: بالفتح خلاف البقاء»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«الفناء: (بالفتح) الهلاك»"
          source: "موسوعة السلطان قابوس"
      expands:
        - text: "«الفناء عند الصوفية سقوط الأوصاف المذمومة»"
          source: "كشاف اصطلاحات الفنون"
          addition: "استخدام اصطلاحي خاص بالجانب الروحي."
    - lemma: "تَلَاشٍ"
      confirm:
        - text: "«تلاشى الشيء: اضمحل أو فني»"
          source: "معجم الصواب اللغوي"
        - text: "«نقطة تلاشٍ: ملتقى الخطوط المتوازية في صورة مجسّمة»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد"
    - lemma: "اِضْمِحْلَال"
      confirm:
        - text: "«اضمحلال: تناقصٌ في مطال الإشارة مع الزمن.»"
          source: "معجم مصطلحات المعلوماتية"
        - text: "«تلاشى الشيء: اضمحل»"
          source: "تاج العروس"
    - lemma: "غياب"
      confirm:
        - text: "«غياب: تخلف عن الحضور.»"
          source: "المعجم الموحد لمصطلحات القانون"
        - text: "«يمفصل الغياب عالم الوجود السيميائي، لهذا تغلب عليه لغة استبدالية لما يطلق عليه الوجود الحقيقي (بالحضور).»"
          source: "المعجم الموحد لمصطلحات اللسانيات"

stage3_analysis:
  per_lemma:
    - lemma: "اندثار"
      decision: confirmed
      decision_reason: "لفظ فصيح يعبر عن امحاء الأثر واختفاء الكيانات المادية والمعنوية تدريجياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْدِثَار"
    - lemma: "زوال"
      decision: confirmed
      decision_reason: "كلمة أساسية تعبر عن الانتقال من الوجود إلى العدم أو الاستحالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَوَال"
    - lemma: "فَنَاء"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الوجودي الأقوى للتعبير عن نهاية الوجود، وهو النقيض المباشر للبقاء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَنَاء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07350946-n"}
    - lemma: "تَلَاشٍ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ مستخدم بكثرة في العلوم والآداب للتعبير عن الصيرورة إلى العدم (اللاشيء)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَلَاشٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07350946-n"}
    - lemma: "اِضْمِحْلَال"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن مرحلة التناقص والذوبان التي تسبق العدم التام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اِضْمِحْلَال", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07350946-n"}

stage4_content:
  definition:
    current: "التوقف عن الوجود"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، ويفضل شموله لأبعاد الانقطاع والاستحالة والعدم."
    authored:
      - type: linguistic
        text: "انقطاعُ الوجودِ وصيرورةُ الشيءِ إلى العَدَم، أو ذَهابُ أثرِهِ واستحالتُه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07350946-n", definition_index: 0, text: "انقطاعُ الوجودِ وصيرورةُ الشيءِ إلى العَدَم، أو ذَهابُ أثرِهِ واستحالتُه."}
  examples:
    per_lemma:
      - lemma: "اِنْدِثَار"
        examples:
          - text: "أدى الإهمال والحروب إلى اندثارِ معالمِ المدينةِ القديمة."
            type: usage
      - lemma: "زَوَال"
        examples:
          - text: "كلُّ نِعمةٍ لا تُشكرُ فهي إلى زوال."
            type: usage
      - lemma: "فَنَاء"
        examples:
          - text: "«كُلُّ مَنْ عَلَيْهَا فَانٍ»"
            type: quran
      - lemma: "تَلَاشٍ"
        examples:
          - text: "بدأت السُّحُبُ في التلاشي مع شروقِ الشمس."
            type: usage
      - lemma: "اِضْمِحْلَال"
        examples:
          - text: "شهدتِ الإمبراطوريةُ اضمحلالاً تدريجياً في قوتِها العسكرية."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أدى الإهمال والحروب إلى اندثارِ معالمِ المدينةِ القديمة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "كلُّ نِعمةٍ لا تُشكرُ فهي إلى زوال."}

