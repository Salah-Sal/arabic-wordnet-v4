  per_entry:
    - lemma: "اِنْدِثَار"
      entry_id: "{auto}"
      root: "دثر"
      maqayis_quote: "«الدال والثاء والراء أصلٌ واحد، وهو غَطَاءُ الشيءِ... والدُّثُور: الدروس، يقال دَثَرَ الرَّسْمُ يَدْثُرُ.»"
    - lemma: "زَوَال"
      entry_id: "{auto}"
      root: "زول"
      maqayis_quote: "«الزاي والواو واللام أصلٌ واحد، وهو التَّنَحِّي عن المكان.»"
    - lemma: "فَنَاء"
      entry_id: "{auto}"
      root: "فني"
      maqayis_quote: "«الفاء والنون والياء أصلٌ صحيح، وهو غايةُ الشيءِ وانقضاؤه.»"
    - lemma: "تَلَاشٍ"
      entry_id: "{auto}"
      root: "لشو"
      maqayis_quote: "لفظ مولد مشتق من (لا + شيء)، لم يرد له أصل في المقاييس."
    - lemma: "اِضْمِحْلَال"
