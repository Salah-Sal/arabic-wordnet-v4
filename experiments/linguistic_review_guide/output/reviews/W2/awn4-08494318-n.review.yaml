stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ركيك ومترجم حرفيا عن الإنجليزية ('خارج العمل قسراً')."
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
    observations: "المفهوم يشير إلى مجموعة الأفراد العاطلين عن العمل، وبالتالي فإن صيغة الجمع في اللمّات مناسبة تماماً. يغلب في العربية المعاصرة استخدام 'العاطلون عن العمل' لتخصيص المعنى وإزالة اللبس الممكن مع المعاني الأخرى للفظ 'عاطل'."
  blind_candidates:
    - lemma: "عَاطِلُونَ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل عطل بصيغة جمع المذكر السالم، يدل على من خلا من العمل."
    - lemma: "عَاطِلُونَ عَنِ العَمَلِ"
      generation_method: tarkib
      justification: "تعبير مركب يخصص صفة العطل بترك العمل تحديدا."
    - lemma: "بَطَّالُونَ"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من بطل بصيغة الجمع، لمن تعطل عن عمله."
    - lemma: "مُتَعَطِّلُونَ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل الخماسي تعطل بصيغة الجمع."

stage2_evidence:
  per_lemma:
    - lemma: "عاطلون"
      confirm:
        - text: "«عَاطِل: من (ع ط ل) الخالي والباقي بلا عمل وهو قادر عليه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "عاطلون عن العمل"
      confirm:
        - text: "«عاطل عن العمل: unemployed»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
    - lemma: "بطالون"
      confirm:
        - text: "«بَطَّال: من (ب ط ل) العامل يتعطل عن عمله.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "متعطلون"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عاطلون"
      decision: confirmed
      decision_reason: "صيغة الجمع صحيحة وتتطابق مع المفهوم المعجمي لمن هم بلا عمل. وتستخدم بكثرة في السياقات الاقتصادية والإعلامية المعاصرة للدلالة على الجمع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَاطِلُونَ"

    - lemma: "عاطلون عن العمل"
      decision: confirmed
      decision_reason: "تعبير مركب شائع ودقيق، يزيل أي لبس مع معاني العطل الأخرى مثل خلو المرأة من الحلي أو تعطل الآلات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَاطِلُونَ عَنِ العَمَلِ"

    - lemma: "بَطَّالُونَ"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود لفظ 'بطال' في المعاجم القديمة بمعنى من تعطل عن العمل، إلا أن استخدامه المعاصر يميل أكثر إلى معنى الكسل والفساد (ذو الباطل)، كما أن دلالته أقل تخصصا من عاطلون."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "مُتَعَطِّلُونَ"
      source: stage1
      decision: removed
      decision_reason: "لفظ صحيح اشتقاقيا ولكنه أقل شيوعا في الاستخدام الاقتصادي لتمثيل هذه الفئة مقارنة بكلمة عاطلون، ولا توجد ضرورة لإضافته كمترادف."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "الناس الذين هم خارج العمل قسراً (يُعتبرون كمجموعة)"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو كترجمة حرفية ركيكة من الإنجليزية تفتقر إلى الأسلوب المعجمي العربي السليم."
    authored:
      - type: terminological
        text: "مَجْمُوعَةُ الأَشْخَاصِ القَادِرِينَ عَلَى العَمَلِ والرَّاغِبِينَ فِيهِ والَّذِينَ فَقَدُوهُ أَوْ لَمْ يَجِدُوهُ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَجْمُوعَةُ الأَشْخَاصِ القَادِرِينَ عَلَى العَمَلِ والرَّاغِبِينَ فِيهِ والَّذِينَ فَقَدُوهُ أَوْ لَمْ يَجِدُوهُ."

  examples:
    per_lemma:
      - lemma: "عَاطِلُونَ"
        examples:
          - text: "تَسْعَى الحُكُومَةُ لِتَوْفِيرِ فُرَصِ عَمَلٍ لِلْعَاطِلِينَ بَعْدَ تَخَرُّجِهِمْ."
            type: usage
      - lemma: "عَاطِلُونَ عَنِ العَمَلِ"
        examples:
          - text: "ارْتَفَعَتْ نِسْبَةُ العَاطِلِينَ عَنِ العَمَلِ فِي السَّنَوَاتِ الأَخِيرَةِ بِسَبَبِ الأَزَمَاتِ الِاقْتِصَادِيَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "ارْتَفَعَتْ نِسْبَةُ العَاطِلِينَ عَنِ العَمَلِ فِي السَّنَوَاتِ الأَخِيرَةِ بِسَبَبِ الأَزَمَاتِ الِاقْتِصَادِيَّةِ."

