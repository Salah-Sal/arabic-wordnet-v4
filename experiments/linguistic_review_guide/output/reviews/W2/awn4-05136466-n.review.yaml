        - text: "«الأول الامتداد الواحد مطلقا أي من غير أن يعتبر معه قيد... والثاني الامتداد المفروض أولا وهو أحد الأبعاد الثلاثة الجسمية... والثالث أطول الامتدادين المتقاطعين في السطح وهذا هو المشهور فيما بين الجمهور»"
