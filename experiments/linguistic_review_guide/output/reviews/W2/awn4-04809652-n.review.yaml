# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "قد تُوحي كلمة «خطأ» بالفعل أو الحدث الفردي غير المتعمد أكثر من الصفة المجردة الكلية؛ وهو ما قد يُضيِّق دلالتها عن إفادة مطلق «عدم المطابقة للحقيقة» بوصفه خاصية"
      - "«عَدَم صِحَّة» مركَّب إضافي وليس وحدةً معجمية أصيلة متجذّرة في التراث الكلاسيكي؛ وتشكيله الحالي ناقص (يفتقر إلى ضمة المضاف على ميم «عَدَم»)"
      - "التعريف الحالي يعتمد على «صفة» جنساً قريباً وهو جنس فضفاض؛ يُستحسن استبداله بجنس أدق يكشف عن طبيعة العلاقة بين القول والواقع"
    observations: >
      المجموعة تُعبِّر عن مفهوم معرفي-فلسفي مجرد، هو «الخطأ» بوصفه خاصيةً في القول أو الحكم.
      الكلمة العربية «خطأ» راسخة في النصوص الكلاسيكية والمعاصرة بمعنى «نقيض الصواب»، وإن
      كانت أحياناً تنصبُّ على الفعل الخاطئ بعينه لا على الصفة الكلية المجردة. أما «عدم صحة»
      فمركّب إضافي حديث مستعمَل في معاجم المصطلحات التقنية والمنطقية. يستند هذا المركّب إلى
      التعريف الكلاسيكي للصحة بأنها «مطابقة الشيء للواقع»، فيكون عدم الصحة نقيضاً مباشراً
      لها. التعريف الحالي صحيح في مضمونه لكنه قابل للتحسين ببناء جنس قريب وفصل نوعي أوضح.

  blind_candidates:
