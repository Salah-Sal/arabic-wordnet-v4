      justification: "مصدر من جذر بطل على وزن فُعْلان الدال على المجردات؛ تُعرِّفه المعاجم الاصطلاحية بـ«خلاف الحق»، مما قد يُعبِّر عن صفة عدم المطابقة للواقع"
    - lemma: "الزَّيْغُ"
      generation_method: majaz
      justification: "بمجاز الإزاحة الدلالية من «الميل الجسدي» إلى «الميل عن الصواب والحق»؛ مستعمَل في النصوص القرآنية والفكر الكلاسيكي للدلالة على الانحراف عن الحقيقة"
    - lemma: "الفَسَادُ"
      generation_method: majaz
      justification: "بمجاز دلالي من «التلف المادي» إلى «خروج الشيء عن الاعتدال» وفق الراغب الأصفهاني؛ يُستعمَل في الفلسفة الإسلامية بمعنى فساد الدليل أو الحجة أي عدم مطابقتها للصواب"
    - lemma: "عَدَمُ الصَّوَابِ"
      generation_method: tarkib
      justification: "مركب إضافي بمعنى غياب الصواب؛ الصواب هو المطابقة للواقع والحقيقة، فعدمه هو صفة عدم تلك المطابقة"


