stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي فيه دور دلالي (circularity) حيث استخدم كلمات من جنس اللمات (ملغى، مبطلاً)."
      - "التعريف الحالي هو ترجمة حرفية للتعريف الإنجليزي ولا يعكس الصياغة المعجمية العربية الرصينة."
      - "المجموعة تفتقر إلى مصطلحات دقيقة تميز بين 'حالة البطلان' و'فعل الإلغاء'."
    observations: "المجموعة تدور حول المفهوم القانوني والإجرائي لانتهاء صلاحية أو أثر عمل ما. اللمات الموجودة (إبطال، إلغاء) صحيحة ولكنها تحتاج لإغناء بمصطلحات أكثر تخصصاً (بطلان، فسخ، نقض) لتغطية الفروق الدلالية الدقيقة في السياقات القانونية والعقود."
  blind_candidates:
    - lemma: "فَسْخٌ"
      generation_method: ishtiqaq
      justification: "مصدر يدل على نقض العقد أو الاتفاق وإزالة أثره، وهو شائع في السياق القانوني والشرعي."
    - lemma: "نَقْضٌ"
      generation_method: majaz
      justification: "يستخدم لإبطال الأحكام أو العهود، وأصله من نقض البناء أو الحبل."
    - lemma: "بُطْلَانٌ"
      generation_method: ishtiqaq
      justification: "الاسم الدال على حالة كونه باطلاً، وهو الأنسب لوصف 'الحالة' (state) المطلوبة في التعريف."
    - lemma: "إِسْقَاطٌ"
      generation_method: majaz
      justification: "يستخدم في سياق إسقاط الحقوق أو الدعاوى، وهو مرادف لـ revocation في بعض السياقات."

stage2_evidence:
  per_lemma:
    - lemma: "إِبْطَال"
      confirm:
        - text: "«إبطال: annulment»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«الإبطال: إفساد الشيء وإزالته حقا كان ذلك الشيء أو باطلا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "إِلْغَاء"
      confirm:
        - text: "«إلغاء: cancellation; repeal; revocation»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«إلغاء: إبطال العمل بشيء»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "بُطْلَان"
      confirm:
        - text: "«بُطلان: nullity»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«بُطلان: جزاء يقرره القانون إما لعدم توفر ركن من أركان العقد أو بذلك»"
          source: "المورد الحديث (2008)"
    - lemma: "فَسْخ"
      confirm:
        - text: "«فسخ: rescission; dissolution; annulment»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«فسخ: annulment; rescission»"
          source: "قاموس حبيب سالمون"
    - lemma: "نَقْض"
      confirm:
        - text: "«نقض حكمًا: أصدر حكمًا قضائيًّا بإلغاء حكم سابق وإعلان بُطلانه»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«نقض الشيء نقضا أفسده بعد إحكامه... نقض ما أبرمه فلان أبطل»"
          source: "المعجم الوسيط"
    - lemma: "إِسْقَاط"
      confirm:
        - text: "«إسقاط: revocation; waiver; forfeiture»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"

stage3_analysis:
  per_lemma:
    - lemma: "إبطال"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن جعل الشيء باطلاً، ويتفق مع التعريف الإنجليزي annulment."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِبْطَالٌ"
    - lemma: "إلغاء"
      decision: confirmed
      decision_reason: "مصطلح عام وشائع للتعبير عن وقف أثر قانوني أو إجرائي، ويتفق مع revocation."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِلْغَاءٌ"
    - lemma: "بُطْلَانٌ"
      source: stage1
      decision: confirmed
      decision_reason: "هو الأنسب للتعبير عن 'حالة' كون الشيء باطلاً (nullity/state of being annulled)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بُطْلَانٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فَسْخٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح قانوني دقيق لفسخ العقود والارتباطات، وهو أحد أوجه annulment."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَسْخٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَقْضٌ"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن إبطال ما أُبرم من عهود أو أحكام، وهو مرادف قوي في السياق القضائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَقْضٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "إِسْقَاطٌ"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم تحديداً في إبطال الحقوق أو الدعاوى، وهو يتناسب مع مفهوم revocation."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِسْقَاطٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حالة كونه ملغى أو مبطلاً"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعاني من الدور الدلالي ولا يتبع الأسلوب المعجمي الرصين."
    authored:
      - type: terminological
        text: "صِفَةُ العَمَلِ أَوِ العَقْدِ الَّذِي فَقَدَ قُوَّتَهُ القَانُونِيَّةَ أَوْ أُلْغِيَ أَثَرُهُ نَتِيجَةَ قَرَارٍ أَوْ خَلَلٍ شَرْعِيٍّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "صِفَةُ العَمَلِ أَوِ العَقْدِ الَّذِي فَقَدَ قُوَّتَهُ القَانُونِيَّةَ أَوْ أُلْغِيَ أَثَرُهُ نَتِيجَةَ قَرَارٍ أَوْ خَلَلٍ شَرْعِيٍّ."}
  examples:
    per_lemma:
      - lemma: "إِبْطَالٌ"
        examples:
          - text: "قَرَّرَتِ المَحْكَمَةُ إِبْطَالَ العَقْدِ لِعَدَمِ أَهْلِيَّةِ أَحَدِ الطَّرَفَيْنِ."
            type: usage
      - lemma: "إِلْغَاءٌ"
        examples:
          - text: "تَمَّ إِلْغَاءُ تَرْخِيصِ البِنَاءِ لِمُخَالَفَتِهِ المَوَاصِفَاتِ المَطْلُوبَةَ."
            type: usage
      - lemma: "بُطْلَانٌ"
        examples:
          - text: "حَكَمَ القَاضِي بِبُطْلَانِ الإِجْرَاءَاتِ لِوُجُودِ خَطَأٍ جَوْهَرِيٍّ."
            type: usage
      - lemma: "فَسْخٌ"
        examples:
          - text: "أَدَّى الإِخْلَالُ بِالشُّرُوطِ إِلَى فَسْخِ الشَّرَاكَةِ بَيْنَ الرَّجُلَيْنِ."
            type: usage
      - lemma: "نَقْضٌ"
        examples:
          - text: "تَقَدَّمَ المُحَامِي بِطَلَبٍ لِنَقْضِ الحُكْمِ الصَّادِرِ بِحَقِّ مُوَكِّلِهِ."
            type: usage
      - lemma: "إِسْقَاطٌ"
        examples:
          - text: "أَعْلَنَتِ الدَّوْلَةُ إِسْقَاطَ التُّهَمِ عَنِ السُّجَنَاءِ السِّيَاسِيِّينَ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "حَكَمَ القَاضِي بِبُطْلَانِ الإِجْرَاءَاتِ لِوُجُودِ خَطَأٍ جَوْهَرِيٍّ."}

