# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'تصوير رقمي' خاليةٌ من التشكيل الكامل"
      - "التعريف الحالي يستخدم عبارة 'لإعادة إنتاجها لاحقاً' وهي صياغة مُبهمة لأن التصوير التقليدي أيضاً يهدف إلى إنتاج الصور"
      - "التعريف لا يُبرز الجانب التمييزي الجوهري: استخدام المستشعر الإلكتروني بدلاً من الفيلم الكيميائي"
    observations: >
      المجموعة أحادية اللمّة تمثّل مفهوماً تقنياً حديثاً راسخاً في الاستخدام العربي المعاصر.
      'تصوير رقمي' تركيبٌ وصفي (موصوف + صفة) مشتقٌّ من جذرَي (ص-و-ر) و(ر-ق-م)، مدعومٌ
      بمعجم مصطلحات المعلوماتية 2000 الذي يُورده في صيغة 'تصوير [ضوئي] رقمي' بترجمة مباشرة
      لـ digital photography مع تعريف تقني دقيق يُفرّق بينه وبين التصوير التقليدي.
      المصطلح يُعدّ من المصطلحات العربية الناجحة التي استوفت معايير التوليد المصطلحي كافة.
  blind_candidates:
    - lemma: "التَّرْقِيمُ الضَّوْئِيّ"
      generation_method: ishtiqaq
      justification: >
        من جذر 'ر-ق-م' على وزن تَفْعِيل للدلالة على عملية تحويل الصور إلى أرقام،
        مع 'الضوئي' نسبةً إلى طبيعة العملية البصرية في التصوير
    - lemma: "التَّصْوِيرُ الرَّقْمِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي (موصوف: تصوير + صفة: رقمي)، ترجمةٌ وصفية مباشرة لـ digital photography
        تُثبّت الدلالة بأداة التعريف؛ الأكثر تداولاً في الصحافة العربية والأدبيات التقنية
    - lemma: "التَّصْوِيرُ الإِلِكْتُرُونِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي يُركّز على آلية التخزين الإلكترونية بوصفها الخاصية المميِّزة،
        بديلٌ وصفي يُبرز الطبيعة التقنية للعملية ويُفرّق بينها وبين التصوير الكيميائي
    - lemma: "الفُوتُوغرافِيا الرَّقْمِيَّة"
      generation_method: taarib
      justification: >
        تعريب لفظ 'photography' اليوناني الأصل مع وصف 'رقمية'، ملاذٌ أخير
        يُستعمل حين يُراد التمييز الصريح عن صور الحاسوب الاصطناعية أو المعالجة الرقمية


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية: تصوير رقمي، التصوير الرقمي، الترقيم الضوئي،
#         التصوير الإلكتروني، الفوتوغرافيا الرقمية، رقمي، ترقيم
#   Q7 — جسر إنجليزي: digital photography, digital photo,
#         digital imaging, digital camera
#   Q6 — FTS عربي: تصوير AND رقمي
#   Q6b — مقاييس اللغة (dict=151): صور، رقم
stage2_evidence:
  per_lemma:
    - lemma: "تصوير رقمي"
      confirm:
        - text: "«تصوير رقمي — digital imagery»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — entry_id 753239"
      expands:
        - text: >
            «تصوير [ضوئي] رقمي — digital photography:
            تصويرٌ ضوئيٌّ بكَمِرةٍ رقمية. يختلفُ التصويرُ الضوئيُّ الرقمي عن التصوير
            الضوئي التقليدي بأن الكَمِرةَ الرقميةَ لا تَستخدِمُ فِلْماً يَعتمد على
            هالوجين الفضة لأخذ صورة، بل تَأخذ وتخزِّن كلَّ صورة إلكترونياً»
          source: "معجم مصطلحات المعلوماتية (2000) — entry_id 534398"
          addition: >
            يُضيف الفارقَ الجوهري بين التصوير الرقمي والتقليدي ويُؤكد أن المصطلح
            الكامل قد يُصحَب بـ'ضوئي' كمُحدِّد تخصيصي؛ كما يُثبت أن 'تصوير رقمي'
            (بدون 'ضوئي') مقبولٌ في الاستخدام العام
        - text: >
            «صورة رقمية — digital photography / photo numérique»
          source: "مسرد الإعلام والتواصل - ALECSO (ArabTerm) — entry_id 484029"
          addition: >
            يُبيّن أن 'صورة رقمية' تُستعمل أحياناً مرادفاً لـ digital photography
            في سياق الإعلام والتواصل، وإن كان الأدق أن تعني الصورة الواحدة لا الطريقة
        - text: >
            «الرَّقْمِيّ (في علوم الحاسب الآلى) Digital:
            صفة لكل ما تُستخدم فيه الأرقام لتمثيل الأعداد أو البيانات أو الرموز.
            مكتبة رقميَّة، وإدارة رقميَّة: دخلها التطورُ بتحويل آلية التعامل اليدوى
            فيها إلى لغة الحاسوب ونحوه»
          source: "المعجم الكبير لمجمع اللغة العربية — entry_id 38866"
          addition: >
            يُؤكد أن 'رقمي' هو المقابل العربي المعتمد لـ Digital في علوم الحاسوب،
            مع شواهد استعمال توضّح الطابع الاصطلاحي الراسخ

    - lemma: "التَّرْقِيمُ الضَّوْئِيّ"
      contradicts:
        - text: >
            «الترقيم: علامات اصطلاحية توضع في أثناء الكلام أو في آخره،
            كالفاصلة والنقطة، وعلامتي الاستفهام والتعجب (مج)»
          source: "المعجم الوسيط لمجمع اللغة العربية — entry_id 11320"
          conflict: >
            'الترقيم' في المعجمية العربية الحديثة يختص بعلامات الوقف الكتابية،
            وقوع الاشتراك اللفظي مع punctuation يجعل المصطلح مُلبِساً ومرفوضاً
        - text: >
            «ترقيم — punctuation; pagination; numbering; coding»
          source: "مسرد الإعلام والتواصل / مسرد الفن والرياضة (ArabTerm) — entries 485879، 492145"
          conflict: >
            المصطلحية العربية الحديثة تُخصّص 'ترقيم' للترقيم النصي (punctuation)
            والترقيم الرقمي (pagination/numbering)، لا لتصوير الصور رقمياً

    - lemma: "التَّصْوِيرُ الرَّقْمِيّ"
      confirm:
        - text: >
            «تصوير [ضوئي] رقمي — digital photography»
          source: "معجم مصطلحات المعلوماتية (2000) — entry_id 534398"
        - text: >
            «نظام تصوير رقمي — digital imaging system»
          source: "موسوعة الكهرباء IEC 60050 — entry_id 526951"
      expands:
        - text: >
            «التَّصْويرُ الشُّعاعِيُّ الرَّقَمِيّ — digital radiography»
          source: "المعجم الطبي الموحد (2009) — entry_id 636724"
          addition: >
            يُثبت أن 'التصوير الرقمي' مركبٌ إنتاجي يقبل تخصيصات وصفية إضافية
            ('شعاعي'، 'ضوئي')، مما يؤكد استقرار البنية الوصفية في اللغة التقنية

    - lemma: "التَّصْوِيرُ الإِلِكْتُرُونِيّ"
      evidence_status: "no_material_found"

    - lemma: "الفُوتُوغرافِيا الرَّقْمِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تصوير رقمي"
      decision: confirmed
      decision_reason: >
        اللمّة مدعومة بأدلة معجمية من مصادر متعددة (AGROVOC، معجم المعلوماتية 2000،
        مسرد الإعلام والتواصل) وهي المصطلح العربي المعتمد في التداول التقني والإعلامي.
        تستوفي معايير الجودة المصطلحية الستة: مطّردة (جذران معروفان + وزن صرفي قياسي)،
        ميسورة التداول، ملائمة دلالياً، تُؤثر التراثي العربي على التعريب، عربية الجذر،
        اشتقاقية صالحة للتوسع ('تصوير ضوئي رقمي'، 'نظام تصوير رقمي').
        التشكيل غائب ويستوجب التحديث.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        المصطلح الجامع الرسمي لهذه الطريقة في التصوير؛ يُستعمل دون تمييز
        بين أنواع الكاميرات أو تطبيقات التصوير، مقابل التصوير التقليدي (الفيلمي).
        هو اللمّة الوحيدة المؤكدة في المجموعة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصْوِيرٌ رَقْمِيٌّ"

    - lemma: "التَّرْقِيمُ الضَّوْئِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        'الترقيم' في المعجمية العربية الحديثة مُخصَّصٌ لعلامات الوقف في الكتابة
        (punctuation / pagination)، وهو معنى مغايرٌ تماماً للتصوير الرقمي.
        يقع الاشتراك اللفظي مع punctuation مشكلةً معجمية حادة تجعل المصطلح
        مُلبِساً ومرفوضاً. فحص التثبيت المعجمي: المصطلح غير مسكوك بدلالة التصوير.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "التَّصْوِيرُ الرَّقْمِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة المُعرَّفة من المصطلح الموجود 'تصوير رقمي' ذاته؛ إضافة لمّتَين
        منكورة ومعرَّفة لمفهوم واحد تخلق تكراراً دون إضافة دلالية.
        المعيار المصطلحي: اللمّات في AWN تُسجَّل بلا أداة تعريف في الصيغة الافتراضية.
        فحص الاستبدال: يمكن إبدال هذه اللمّة بـ'تصوير رقمي' في جميع السياقات →
        لا فرق دلالي → حذف.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "التَّصْوِيرُ الإِلِكْتُرُونِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استعماله مصطلحاً مستقراً للتصوير الرقمي.
        'الإلكتروني' أعمّ من 'الرقمي': يشمل الأجهزة الإلكترونية التناظرية
        (analog) ولا يُحدّد خاصية التخزين بالأرقام الثنائية. فحص الملاءمة الصرفية:
        الوصف الملائم للمفهوم هو 'رقمي' (digital) لا 'إلكتروني' (electronic).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "الفُوتُوغرافِيا الرَّقْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على تداوله في المعاجم العربية المعتمدة.
        اختبار إيثار العربي: 'تصوير رقمي' يُحقق المعايير المصطلحية كافة ويتفوق
        على التعريب في الاطّراد والملاءمة وإيثار العربي على الأجنبي.
        فحص الاقتراض: 'فوتوغرافيا' تعريبٌ لا يقبل الاشتقاق الصرفي بيسر
        كما يقبله 'تصوير'، فضلاً عن غياب التثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "طريقة تصوير تخزن الصورة رقمياً لإعادة إنتاجها لاحقاً"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يعاني من ثلاثة إشكاليات: (١) الجنس 'طريقة تصوير' دائريٌّ
        نسبياً ويُخفق في التمييز عن التصوير التناظري؛ (٢) 'لإعادة إنتاجها لاحقاً'
        صياغةٌ مُبهمة تنطبق على التصوير التقليدي أيضاً؛ (٣) يغيب ذكر المستشعر
        الإلكتروني (CCD/CMOS) وغياب الفيلم الكيميائي وهما الفصلان النوعيان الأساسيان.
        الأدلة المعجمية (معجم المعلوماتية 2000) تُقدّم تعريفاً أدق يستحق الاقتباس.
    authored:
      - type: terminological
        text: "ضربٌ من التصوير الضوئي يُستعمَل فيه مستشعرٌ إلكترونيٌّ لالتقاط الصور وتسجيلها على هيئة بيانات رقمية، بدلاً من الفيلم الكيميائي التقليدي"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "أسلوبٌ في التصوير الضوئي يعتمد على كاميرات مجهَّزة بمستشعرات إلكترونية (كـCCD وCMOS) لالتقاط الصور وحفظها في ملفات رقمية قابلة للمعالجة والمشاركة والطباعة، خلافاً للتصوير التقليدي الذي يعتمد على الفيلم المغطى بهالوجين الفضة"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "ضربٌ من التصوير الضوئي يُستعمَل فيه مستشعرٌ إلكترونيٌّ لالتقاط الصور وتسجيلها على هيئة بيانات رقمية، بدلاً من الفيلم الكيميائي التقليدي"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "أسلوبٌ في التصوير الضوئي يعتمد على كاميرات مجهَّزة بمستشعرات إلكترونية (كـCCD وCMOS) لالتقاط الصور وحفظها في ملفات رقمية قابلة للمعالجة والمشاركة والطباعة، خلافاً للتصوير التقليدي الذي يعتمد على الفيلم المغطى بهالوجين الفضة"

  examples:
