      maqayis_quote: "«الصَّادُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، وَهُوَ عَمَلُ الشَّيْءِ صُنْعًا... وَالتَّصَنُّعُ: حُسْنُ السَّمْتِ.»"
    - lemma: "مُتَكَلِّف"
