      maqayis_quote: "«الْجِيمُ وَالدَّالُ أُصُولٌ ثَلَاثَةٌ: الْأَوَّلُ الْعَظَمَةُ، وَالثَّانِي الْحَظُّ، وَالثَّالِثُ الْقَطْعُ... وَلَيْسَ بِبَعِيدٍ أَنْ يَكُونَ الْجِدُّ فِي الْأَمْرِ وَالْمُبَالَغَةُ فِيهِ مِنْ هَذَا»"
    - lemma: "رَزَانَة"
      entry_id: "{auto}"
      root: "رزن"
      maqayis_quote: "«الرَّاءُ وَالزَّاءُ وَالنُّونُ أَصْلٌ يَدُلُّ عَلَى تَجَمُّعٍ وَثَبَاتٍ. يَقُولُونَ رَزُنَ الشَّيْءُ: ثَقُلَ. وَرَجُلٌ رَزِينٌ وَامْرَأَةٌ رَزَانٌ.»"
    - lemma: "وَقَار"
      entry_id: "{auto}"
      root: "وقر"
      maqayis_quote: "«الْوَاوُ وَالْقَافُ وَالرَّاءُ: أَصْلٌ يَدُلُّ عَلَى ثِقَلٍ فِي الشَّيْءِ... وَمِنْهُ الْوَقَارُ: الْحِلْمُ وَالرَّزَانَةُ.»"
    - lemma: "جِدّ"
