stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية تفتقر إلى التشكيل."
      - "التعريف العربي الحالي «سمة كون المرء جاداً» هو ترجمة حرفية ركيكة لا تعبر عن المفهوم بأسلوب معجمي سليم."
    observations: "المفهوم يشير إلى صفة الجد وترك الهزل، وما يصاحب ذلك من وقار وثبات في الرأي والسلوك. المصطلحات «جدية» و«رزانة» تعبر عن المفهوم بشكل جيد، ويمكن إضافة «وقار» و«جِدّ» لإثراء المجموعة."
  blind_candidates:
    - lemma: "جِدِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي حديث يعبر عن سمة كون المرء جاداً."
    - lemma: "رَزَانَة"
      generation_method: ishtiqaq
      justification: "تدل على الثبات والوقار وهما من علامات الجدية."
    - lemma: "وَقَار"
      generation_method: majaz
      justification: "صفة تطلق على السكينة والحلم وتلازم الشخص الجاد."
    - lemma: "جِدّ"
      generation_method: ishtiqaq
      justification: "أصل نقيض الهزل، ويستعمل للتعبير عن الجدية."

stage2_evidence:
  per_lemma:
    - lemma: "جدية"
      confirm:
        - text: "وقد شاعت كلمة «الجديّة» في لغة العصر الحديث، وذكرتها بعض المعاجم مثل الأساسي الذي يقول: «جدِّيَّة: مصدر صناعي من الجدّ .. »."
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
    - lemma: "رزانة"
      confirm:
        - text: "يقال: فيه رزانة: وقار"
          source: "المعجم الوسيط"
        - text: "من (ر ز ن) الحلم والوقار وأصالة الرأي، وسكون الشيء وثبوته، والثقل في الوزن ونحوه."
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "وقار"
      confirm:
        - text: "الرَّزانَةُ والحلم العَظَمَة"
          source: "المعجم الوسيط"
        - text: "الوَقَارُ: التأني فِي التَّوَجُّه نَحْو المطالب."
          source: "معجم مقاليد العلوم للسيوطي"
    - lemma: "جِدّ"
      confirm:
        - text: "نَقِيضُ الهَزْل الاجْتِهادُ في الأُمور"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "جدية"
      decision: confirmed
      decision_reason: "مصدر صناعي حديث وشائع الاستعمال للتعبير عن السمة المذكورة، ويوافق المعنى المطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِدِّيَّة"
    - lemma: "رزانة"
      decision: confirmed
      decision_reason: "كلمة فصيحة تعبر عن الثبات والوقار، وهي من مظاهر السمة الجادة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَزَانَة"
    - lemma: "وَقَار"
      source: stage1
      decision: confirmed
      decision_reason: "الوقار هو الرزانة والتأني، وهو مرادف للرزانة ويعبر عن جزء مهم من الجدية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "وَقَار"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "جِدّ"
      source: stage1
      decision: confirmed
      decision_reason: "الجد هو نقيض الهزل، والكلمة الأساسية والأصيلة التي تدل على هذا المفهوم في اللغة العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "جِدّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "سمة كون المرء جاداً"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية ركيكة لا تتبع الأسلوب المعجمي السليم."
    authored:
      - type: terminological
        text: "صفة تلازم من يتصف بترك الهزل، وتتميز بالرزانة والوقار والاجتهاد في الأمور."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صفة تلازم من يتصف بترك الهزل، وتتميز بالرزانة والوقار والاجتهاد في الأمور."
  examples:
    per_lemma:
      - lemma: "جِدِّيَّة"
        examples:
          - text: "أظهر الموظف جِدِّيَّةً ملحوظة في إنجاز عمله."
            type: usage
      - lemma: "رَزَانَة"
        examples:
          - text: "تحدث الحكيم برزانة وهدوء أثرا في الحاضرين."
            type: usage
      - lemma: "وَقَار"
        examples:
          - text: "يعلو وجه الشيخ وقار وسكينة."
            type: usage
      - lemma: "جِدّ"
        examples:
          - text: "أخذ الطالب دراسته مأخذ الجِدّ فحقّق التفوق."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أظهر الموظف جِدِّيَّةً ملحوظة في إنجاز عمله."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أظهر الموظف جِدِّيَّةً ملحوظة في إنجاز عمله."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تحدث الحكيم برزانة وهدوء أثرا في الحاضرين."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يعلو وجه الشيخ وقار وسكينة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أخذ الطالب دراسته مأخذ الجِدّ فحقّق التفوق."

