# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «كمية مُسكرة» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ (يمكن إبدال «كمية» بـ«مقدار» أو «قدر» دون تغيّر الصلاحية الوصفية)"
      - "المفهوم (skinful) عامّي إنجليزي لا يقابله مصطلح عربي ثابت — فجوة معجمية ثقافية"
      - "التشكيل ناقص في اللمّة الموجودة"
    observations: "المجموعة تمثّل مفهوماً عامياً إنجليزياً (skinful = كمية كافية من الخمر لإسكار الشارب). المفهوم مرتبط بثقافة الشرب الغربية وليس له مقابل مصطلحي عربي ثابت في المعجمية العربية الكلاسيكية أو الحديثة. الاستراتيجية المُثلى هي التركيب الوصفي أو الإضافي لعدم وجود لفظ مفرد يؤدي هذا المعنى بدقة."
  blind_candidates:
    - lemma: "مِلْءُ الزِّقِّ"
      generation_method: tarkib
      justification: "مركب إضافي يحاكي البنية الدلالية للفظ الإنجليزي skinful (ملء الجلد/الوعاء). الزِّقّ: وعاء الخمر من الجلد، وملؤه كناية عن الكمية الكبيرة الكافية للإسكار."
    - lemma: "سَكْرَة"
      generation_method: ishtiqaq
      justification: "من الجذر سكر على وزن فَعْلَة (المرة)، أي المرة الواحدة من السُّكر، وقد تدل مجازاً على القدر الذي يُحدِث السُّكر."
    - lemma: "نَهْلَة"
      generation_method: majaz
      justification: "النَّهْلَة: الشربة الأولى حتى الرِّيّ. بالمجاز قد تدل على الكمية الوافرة من الشراب التي تُسكِر."
    - lemma: "جُرْعَةٌ مُسْكِرَةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من جُرْعَة (مقدار ما يُبلَع مرة واحدة) ومُسْكِرَة (صفة الإسكار)، يصف الكمية الكافية للسُّكر."

