        - text: "«(نَهِلَ) النُّونُ وَالْهَاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ضَرْبٍ مِنَ الشُّرْبِ. وَنَهِلَ: شَرِبَ فِي أَوَّلِ الْوِرْدِ.»"
