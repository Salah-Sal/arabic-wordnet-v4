stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (أمريكا الجنوبية) تشير في الأصل إلى القارة الجغرافية، واستخدامها لتدل على مجموعة الدول هو من قبيل المجاز المرسل."
      - "التعريف الحالي دقيق وواضح، لكن قد يكون من الأفضل إضافة تركيب (دول أمريكا الجنوبية) كمدخل صريح للمجموعة."
    observations: "المفهوم يشير إلى الكيان الجيوسياسي المكون من الدول الواقعة في قارة أمريكا الجنوبية ككل. التعبير الأكثر دقة هو (دول أمريكا الجنوبية)، بينما يطلق اسم القارة (أمريكا الجنوبية) مجازا على الدول."
  blind_candidates:
    - lemma: "أمْرِيكَا الجَنُوبِيَّة"
      generation_method: majaz
      justification: "من باب المجاز المرسل (علاقته المحلية)؛ إطلاق اسم المكان (القارة) وإرادة مَن فيه (الدول والشعوب)."
    - lemma: "دُوَل أَمْرِيكَا الجَنُوبِيَّة"
      generation_method: tarkib
      justification: "تركيب إضافي دقيق يطابق المعنى المقصود في التعريف (the nations ... collectively)."
    - lemma: "أَمْرِيكَانِيَا الجَنُوبِيَّة"
      generation_method: taarib
      justification: "تعريب لاسم القارة كمقترح نظري للتمييز."
    - lemma: "القَارَّة الأَمْرِيكِيَّة الجَنُوبِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي للقارة."

stage2_evidence:
  per_lemma:
    - lemma: "أمريكا الجنوبية"
      expands:
        - text: "«إحدى قارتي نصف الكرة الغربي, ورابعة القارات مساحة... وكثيرا ما تسمى بأمريكا اللاتينية؛ إذ كان معظم استعمارها على أيدى الإسبانيين والبرتغاليين, ولا تزال اللغتان الأسبانية والبرتغالية سائدتين فيها»"
          source: "المعجم الكبير"
          addition: "يعرّف اللمة بأنها القارة، وهو المعنى الأصلي الذي يتفرع منه معنى (مجموعة الدول) مجازاً."
    - lemma: "دول أمريكا الجنوبية"
      confirm:
        - text: "«ثانى دول أمريكا الجنوبية اتساعا مساحتها ٢,٧٩٠,٥٤٤ ( كم٢ ), تقع بين سلسلة جبال الأنديز والمحيط الأطلنطى , وهى جمهورية , وعاصمتها بوينس أيرس»"
          source: "المعجم الكبير"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أمريكا الجنوبية"
      decision: confirmed
      decision_reason: "مصطلح معتمد ومستقر، ويُستخدم مجازاً (مجاز مرسل علاقته المحلية) للدلالة على مجموعة الدول الواقعة في القارة، وهو يطابق الأصل الإنجليزي (South America)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance: "تُستخدم اللمة للإشارة إلى القارة جغرافياً، وتُطلق مجازاً على الدول المجتمعة فيها."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَمْرِيكَا الجَنُوبِيَّة"

    - lemma: "دول أمريكا الجنوبية"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير مركب دقيق وشائع يطابق المعنى المراد (دول القارة مجتمعة) بشكل صريح لا لبس فيه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "تعبير صريح ومباشر يدل على الكيان السياسي المكوّن من الدول مجتمعة."
      actions:
        - command: create_entry
          params:
            lemma: "دُوَل أَمْرِيكَا الجَنُوبِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أمريكانيا الجنوبية"
      source: stage1
      decision: removed
      decision_reason: "تعريب غير مستخدم ولا حاجة إليه لوجود المعرّب المستقر (أمريكا)."

    - lemma: "القارة الأمريكية الجنوبية"
      source: stage1
      decision: removed
      decision_reason: "تشير إلى الجغرافية أكثر من دلالتها على الدول (الكيان السياسي)."

stage4_content:
  definition:
    current: "دول قارة أمريكا الجنوبية مجتمعة"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وصحيح، ويترجم التعريف الإنجليزي بنجاح تام."
    actions: []
  examples:
    per_lemma:
      - lemma: "أمريكا الجنوبية"
        examples:
          - text: "عقدت أمريكا الجنوبية قمة اقتصادية لتعزيز التعاون بين دولها."
            type: usage
      - lemma: "دول أمريكا الجنوبية"
        examples:
          - text: "شكلت دول أمريكا الجنوبية تكتلاً سياسياً موحداً للدفاع عن مصالحها."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "عقدت أمريكا الجنوبية قمة اقتصادية لتعزيز التعاون بين دولها."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "شكلت دول أمريكا الجنوبية تكتلاً سياسياً موحداً للدفاع عن مصالحها."

