stage1_review:
  assessment:
    concerns:
      - "المجموعة الترادفية تضم لمّة واحدة فقط حالياً."
      - "اللمّة الموجودة تفتقر إلى التشكيل الكامل."
    observations: "المصطلح يعبر عن 'شخصية وسواسية قهرية' (Obsessive-compulsive personality)، وهو نمط يتسم بالدقة المفرطة والمثالية والحاجة للسيطرة والطقوس. المصطلحات العربية مستقرة في المعجم الطبي الموحد والترجمات العلمية، لكنها تتفاوت بين ذكر 'الوسواسية' أو 'القهرية' أو الجمع بينهما."
  blind_candidates:
    - lemma: "شَخْصِيَّةٌ وَسْوَاسِيَّةٌ قَهْرِيَّةٌ"
      generation_method: tarkib
      justification: "الترجمة الأكثر دقة وشيوعاً للمصطلح الإنجليزي (Obsessive-compulsive personality)."
    - lemma: "شَخْصِيَّةٌ قَهْرِيَّةٌ"
      generation_method: tarkib
      justification: "استخدام 'القهرية' للدلالة على السلوك النمطي المتكرر والمحكوم بقواعد صارمة."
    - lemma: "شَخْصِيَّةٌ وَسْوَاسِيَّةٌ"
      generation_method: tarkib
      justification: "استخدام 'الوسواسية' للدلالة على الانشغال الدائم بالأفكار المثالية والدقة."
    - lemma: "شَخْصِيَّةٌ أَنَانْكَاسْتِيَّةٌ"
      generation_method: taarib
      justification: "تعريب للمصطلح البديل (Anankastic personality) المستخدم في التصنيفات العالمية (مثل ICD-10)."

stage2_evidence:
  per_lemma:
    - lemma: "شَخْصِيَّةٌ وَسْوَاسِيَّةٌ قَهْرِيَّةٌ"
      confirm:
        - text: "«شَخْصِيَّةٌ وَسْواسِيَّةٌ قَهْرِيَّة: anankastic personality (obsessive compulsive personality)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«شَخْصِيَّةٌ وَسْواسِيَّةٌ قَهْرِيَّة: obsessive-compulsive personality»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "شَخْصِيَّةٌ قَهْرِيَّةٌ"
      confirm:
        - text: "«شَخْصِيَّةٌ قَهْرِيَّةُ ( شَخْصِيَّةٌ وَسْواسِيَّةٌ قَهْرِيَّة): compulsive personality (obsessive-compulsive personality)»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "شَخْصِيَّةٌ وَسْوَاسِيَّةٌ"
      confirm:
        - text: "«شَخْصِيَّةٌ وَسْواسِيَّة: obsessive personality»"
          source: "المعجم الطبي الموحد (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "شخصية وسواسية قهرية"
      decision: confirmed
      decision_reason: "المصطلح العلمي الأكثر شمولاً ودقة، وموثق في المعاجم الطبية المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَخْصِيَّةٌ وَسْوَاسِيَّةٌ قَهْرِيَّةٌ"
    - lemma: "شَخْصِيَّةٌ قَهْرِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف موثق يركز على الجانب السلوكي (القهر) من الشخصية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "شَخْصِيَّةٌ قَهْرِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "شَخْصِيَّةٌ وَسْوَاسِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف موثق يركز على الجانب الذهني (الوسواس) من الشخصية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "شَخْصِيَّةٌ وَسْوَاسِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخصية تتميز بحاجة قوية لتكرار أفعال أو طقوس معينة"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لكنه يركز على الجانب السلوكي فقط، ويحتاج لإضافة الجانب النفسي (المثالية والتحكم) ليناسب الدقة المعجمية الطبية."
    authored:
      - type: terminological
        text: "نمط من الشخصية يتسم بالانشغال المفرط بالنظام والمثالية والتحكم، مع نزعة قهرية لتكرار أفعال أو طقوس معينة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "شَخْصِيَّةٌ وَسْوَاسِيَّةٌ قَهْرِيَّةٌ"
        examples:
          - text: "يُعاني صاحب الشخصية الوسواسية القهرية من قلق دائم إذا لم تسر الأمور وفق نظام صارم."
            type: usage
      - lemma: "شَخْصِيَّةٌ قَهْرِيَّةٌ"
        examples:
          - text: "تظهر الشخصية القهرية بوضوح في طقوس النظافة والترتيب المبالغ فيها."
            type: usage
      - lemma: "شَخْصِيَّةٌ وَسْوَاسِيَّةٌ"
        examples:
          - text: "يتميز نمط الشخصية الوسواسية بالتردد في اتخاذ القرارات خوفاً من الوقوع في الخطأ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "نمط من الشخصية يتسم بالانشغال المفرط بالنظام والمثالية والتحكم، مع نزعة قهرية لتكرار أفعال أو طقوس معينة."}

