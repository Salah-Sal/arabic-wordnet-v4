# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-06727491-n
# respects — (often used with 'pay') a formal expression of esteem
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تَحِيَّة» دلالتها الأصلية «السَّلام» وليست «التعبير الرسمي عن التقدير»؛ قد يكون الربط مبنياً على ترجمة حرفية لـ pay respects"
      - "المجموعة تحتوي على لمّتين فقط، وبينهما فجوة دلالية واضحة: الأولى (احترام) أقرب إلى المفهوم، والثانية (تحية) أقرب إلى السلام"
    observations: "المجموعة تمثّل مفهوم «الاحترامات» بمعنى التعبير الرسمي عن التقدير، كما في «يقدّم احتراماته» أو «يؤدّي واجب التحية». المفهوم الأصلي الإنجليزي يُستعمل غالباً مع pay (دفع/أدّى)، وله مقابل عربي طبيعي في صيغة الجمع «احترامات». التعريف العربي الحالي ترجمة قريبة من الإنجليزي لكنها تحتاج إلى صياغة معجمية أصيلة."
  blind_candidates:
    - lemma: "تَقْدِير"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفْعِيل من الجذر ق-د-ر، يُستعمل بمعنى إبداء الاحترام والتثمين، ويرد في سياقات رسمية كـ«مع فائق التقدير»"
    - lemma: "إِجْلَال"
      generation_method: ishtiqaq
      justification: "مصدر إفعال من الجذر ج-ل-ل، يدلّ على التعظيم والتوقير، يُستعمل في التعبير عن الاحترام الرسمي"
    - lemma: "تَوْقِير"
      generation_method: ishtiqaq
      justification: "مصدر تفعيل من الجذر و-ق-ر، بمعنى إظهار الاحترام والهيبة، ورد في القرآن «وَتُوَقِّرُوهُ»"
    - lemma: "مُجَامَلَة"
      generation_method: ishtiqaq
      justification: "مصدر ميمي من الجذر ج-م-ل، يدلّ على التعبير اللطيف عن الاحترام والتقدير في سياق اجتماعي رسمي"

stage2_evidence:
  per_lemma:
    - lemma: "اِحْتِرَام"
      confirm:
        - text: "«تقدير يُظهره شخص لشخص آخر، وتكون تجلياته لغوية وسلوكية.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«من السهل تخريج المثال المرفوض حملاً على أن من معاني الحرمة: المهابة، وهذا اسم من الاحترام مثل الفرقة والافتراق، وعلى هذا ففي الاحترام معنى المهابة والإجلال والتقدير.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«to pay one's respects to: يقدِّم إليه احتراماته؛ يزوره دلالة على احترامه له»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«deference: (1) احترام؛ توقير (2) مُراعاة؛ إذعان»"
          source: "المورد الحديث (2008)"
          addition: "يُظهر أن الاحترام يشمل بُعد المراعاة والإذعان الاجتماعي"

    - lemma: "تَحِيَّة"
      confirm:
        - text: "«ما يُحيَّى به القَوْمُ بَعْضُهم بعضًا»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«(التَّحِيَّة) السَّلَام»"
          source: "المعجم الوسيط"
          conflict: "التحية في أصل وضعها تعني السلام والتسليم، لا التعبير الرسمي عن التقدير"
        - text: "«تَحِيَّة: من (ح ي ي) السلام والسلامة من كل آفة، والبقاء.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الدلالة الأساسية: السلام والسلامة والبقاء، وليست التقدير الرسمي"
      expands:
        - text: "«من الله: الإكرامُ والإحسانُ والتَّفَضُّلُ»"
          source: "المعجم الكبير"
          addition: "في سياق إلهي تتوسع الدلالة لتشمل الإكرام والإحسان"
        - text: "«المُلْكُ. وبه فُسِّرَت بدايَةُ التَّشهُّدِ التَّحيَّاتُ لِلَّهِ»"
          source: "المعجم الكبير"
          addition: "التحيات بمعنى المُلك والتعظيم في سياق الصلاة"

    - lemma: "تَقْدِير"
      contradicts:
        - text: "«إبداء الاحترام لشخص ما اعتبارا لفضله أو مجهوده.» (ترجمة: esteem)"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          conflict: "رغم ورود معنى التقدير بمعنى الاحترام، إلا أن الدلالة الغالبة للتقدير هي التقييم والتثمين (estimation/evaluation) كما يظهر في أكثر من 10 مداخل في ArabTerm"
      expands:
        - text: "«التقدير: تحديد كل مخلوق بحده الذي يوجد من حسن وقبح ونفع وضر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الدلالة الاصطلاحية الأصلية بعيدة عن التقدير بمعنى الاحترام"

    - lemma: "إِجْلَال"
      expands:
        - text: "«(إجلال) يُقَال فعلت كَذَا من إجلالك وَمن أجل إجلالك من أَجلك»"
          source: "المعجم الوسيط"
          addition: "الإجلال حالة داخلية من التعظيم، وليس تعبيراً رسمياً عنها"
        - text: "«يُقال: فَعَلْتُ كذا من إجْلَالِكَ, ومن أَجْلِ إجْلَالِك: من أجْلِك»"
          source: "المعجم الكبير"
          addition: "يؤكد أن الإجلال شعور لا فعل تعبيري"

    - lemma: "تَوْقِير"
      evidence_status: "no_material_found"

    - lemma: "مُجَامَلَة"
      confirm:
        - text: "«تعبير لطيف يستعمل للاحترام والتقدير.» (ترجمة: compliment)"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      contradicts:
        - text: "«(1) المُجامَلة الدُّوَلية: احترام الدول ضمن نطاق أراضيها لمؤسسات الدول الأخرى وقوانينها»"
          source: "المورد الحديث (2008)"
          conflict: "المجاملة تدور حول المداراة واللطف الاجتماعي (compliment/courtesy)، وليست تعبيراً رسمياً عن التقدير بمعنى respects"

stage3_analysis:
  per_lemma:
    - lemma: "اِحْتِرَام"
      decision: confirmed
      decision_reason: "لمّة ثابتة معجمياً ومتداولة في الفصحى المعاصرة، والتعبير «يقدّم احتراماته» يطابق تماماً المفهوم الإنجليزي pay one's respects. أكدها معجم الصواب اللغوي والمورد الحديث وArabTerm."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على التقدير الرسمي الذي يُعبَّر عنه قولاً أو فعلاً تجاه شخص أو مقام، ويستعمل غالباً في صيغة الجمع «احتراماته» في السياق الرسمي والدبلوماسي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِحْتِرَام"

    - lemma: "تَحِيَّة"
      decision: confirmed
      decision_reason: "رغم أن الدلالة الأصلية للتحية هي السلام، إلا أنها تُستعمل في العربية المعاصرة بمعنى التعبير الرسمي عن الاحترام والتقدير، لا سيما في السياقات العسكرية والرسمية (أدّى التحية، التحية العسكرية). كما أن التحيات في التشهد تحمل معنى التعظيم والتمليك. هذا التوسع الدلالي مقبول ومستقر."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على التعبير الرسمي عن الاحترام المقرون بفعل جسدي أو لفظي محدد (كرفع اليد أو الانحناء)، وتتميز عن «احترام» بأنها أقرب إلى الطقس الاجتماعي المحسوس منها إلى الشعور المجرد"

    - lemma: "تَقْدِير"
      source: stage1
      decision: removed
      decision_reason: "لفظ شديد التعدد الدلالي (estimation, evaluation, assessment, esteem)، ومعناه الغالب في الاستعمال المعاصر هو التقييم والتثمين وليس التعبير عن الاحترام. إدخاله يولّد التباساً دلالياً مع أكثر من عشر مجموعات ترادفية أخرى."

    - lemma: "إِجْلَال"
      source: stage1
      decision: removed
      decision_reason: "الإجلال يدلّ على حالة التعظيم الداخلية لا على التعبير الرسمي عنها. المعاجم تعرّفه بالفعل لا بالقول، وهو أقرب إلى مفهوم veneration/reverence منه إلى respects."

    - lemma: "تَوْقِير"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية مباشرة، والتوقير — كالإجلال — يدلّ على الشعور بالهيبة والاحترام لا على التعبير الرسمي عنه."

    - lemma: "مُجَامَلَة"
      source: stage1
      decision: removed
      decision_reason: "المجاملة تعبير لطيف عن المداراة واللياقة الاجتماعية (compliment/courtesy)، وليست تعبيراً رسمياً عن التقدير. الفرق بين courtesy وrespects فرق جوهري في الإنجليزية والعربية معاً."

stage4_content:
  definition:
    current: "(غالباً ما تستخدم مع 'دفع' أو 'أدى') تعبير رسمي عن التقدير"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزي، وعبارة «دفع» مع الاحترام ليست طبيعية في العربية (العربي يقول «قدّم» أو «أدّى» لا «دفع»). يحتاج إعادة صياغة بأسلوب المعجم الوسيط."
    authored:
      - type: linguistic
        text: "ما يُبديه المرءُ من عبارات التقدير والإجلال في المقامات الرسمية، يُقال: قدَّم احتراماته، وأدّى التحيةَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
