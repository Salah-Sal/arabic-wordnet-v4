# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'نسبية' مكتوبة بدون تشكيل — تحتاج تحديثاً إلى 'نِسْبِيَّة'"
      - "التعريف الحالي دائري: 'صفة كون الشيء نسبياً' تُعرِّف النسبيةَ بالمصدر الصرفي لمادتها ذاتها"
      - "التعريف لا يُميّز بين المعنى الفلسفي العام (هذه المجموعة: الخاصية الدلالية العلائقية) والمعنى الفيزيائي الخاص (نظرية آينشتاين)، وهو اشتراك لفظي بارز في جميع المعاجم"
    observations: >
      المجموعة تمثّل المفهوم الفلسفي العام لـ'النسبية': كون الشيء ذا دلالة فقط بالنسبة إلى شيء آخر.
      الجذر (نسب) ذو قياس دقيق عند ابن فارس — «اتِّصَالُ شَيْءٍ بِشَيْءٍ» — مما يجعل اشتقاق
      'نسبية' تأسيساً لغوياً صحيحاً وميزانٌ صرفي ملائم (المصدر الصناعي على -ية للمفاهيم المجردة).
      غير أن المعاجم الحديثة ربطت المصطلح أساساً بنظرية آينشتاين، فصار محوَّلاً بالاستعمال
      نحو المعنى الفيزيائي مع بقاء المعنى الفلسفي حاضراً (كما في المورد الحديث: «أ» كون الشيء نسبياً).
  blind_candidates:
    - lemma: "التَّضَايُفِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مشتق من 'التَّضَايُف' (مصدر باب تفاعل من ض-ي-ف)، وهو مصطلح منطقي كلاسيكي
        يصف المفاهيم المتضايفة (correlatives) التي لا تُفهم إلا بالإضافة إلى بعضها البعض
        كالأبوة والبنوة والعلوّ والسُّفل. 'التضايفية' = خاصية كون الشيء متضايفاً لا قائماً
        بنفسه من حيث الدلالة. الوزن: المصدر الصناعي على -ية، مناسب للمفاهيم المجردة.
    - lemma: "الاعتبارِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من 'اعتباري' (إحياء للفظ فلسفي كلاسيكي). في الفلسفة الإسلامية (ابن سينا،
        الملا صدرا) يقابل 'الاعتباري' الشيءَ الذي وجوده أو معناه مشروط بالاعتبار الذهني
        والإضافة إلى ما عداه، بخلاف الحقيقي المستقل. 'الاعتبارية' = صفة كون الشيء ذا وجود
        أو دلالة بالاعتبار لا بالاستقلال. جذر: ع-ب-ر.
    - lemma: "التَّعَلُّقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من 'تعلُّقي' المشتق من 'التعلق' (مصدر باب تفعّل، ع-ل-ق). 'التعلق'
        في العربية يعني الارتباط والاشتراط بالآخر — ومنه قول الفلاسفة: 'الصفة المتعلقة'
        أي التي لا تقوم إلا بمتعلَّق. 'التعلقية' = صفة كون الشيء ذا دلالة فقط بتعلّقه
        وارتباطه بما سواه، لا بذاته المجردة.
    - lemma: "الإِضَافِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من 'إضافي' (ض-ي-ف). في النحو والمنطق العربي 'الإضافة' هي علاقة
        التحديد بالنسبة إلى الآخر (المضاف والمضاف إليه). 'الإضافية' = صفة كون الشيء
        دلالته إضافية نسبية لا مطلقة مستقلة. يصف جوهر المفهوم من زاوية بنيوية نحوية.


