# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "نسبية"
      decision: confirmed
      decision_reason: >
        المصطلح موثَّق توثيقاً واسعاً في أكثر من عشرة مصادر معجمية حديثة بترجمة 'relativity'
        في مجالات الفلسفة والفيزياء والطب واللسانيات والرياضيات. المورد الحديث يُثبت صراحةً
        المعنى الفلسفي العام («كون الشيء نسبياً») كمعنى أول قبل المعنى الأينشتاين.
        الجذر (نسب) قياسه «اتصال شيء بشيء» — وهو جوهر المفهوم. الوزن الصرفي (فَعْلِيَّة)
        ملائم للمفاهيم المجردة. تحتاج اللمّة فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: "وزن المصدر الصناعي (نِسْبِيَّة ← نِسْبِيّ ← نِسْبَة) مناسب تماماً للمفاهيم الجوهرية المجردة — كالحرية والإنسانية والعلمية"
      borrowing_check:
        type: native_derivation
        note: "اشتقاق عربي خالص من جذر ثلاثي أصيل"
      quality_gate:
        consistency: "مطّرد في جميع المعاجم الحديثة"
        ease_of_use: "سهل التداول، مشتق على وزن مألوف"
        fitness: "يؤدي المعنى بدقة مع احتمال الاشتراك مع المعنى الفيزيائي"
        heritage_preference: "الجذر أصيل والمصدر الصناعي أسلوب عربي"
        arabic_preference: "مفضّل على أي بديل أجنبي"
        derivability: "مشتق على الأوزان الصرفية العربية الصحيحة"
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة. تحمل معنيين: (١) المعنى الفلسفي العام — خاصية كون الشيء
        ذا دلالة بالنسبة إلى غيره (هذه المجموعة)؛ (٢) المعنى الفيزيائي الخاص — نظرية آينشتاين.
        في هذا السياق (hypernym: جودة/نوعية) المعنى المراد هو الأول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِسْبِيَّة"

    - lemma: "التَّضَايُفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على المصطلح في أي مصدر معجمي. وإن كان 'التضايف' مفهوماً منطقياً كلاسيكياً
        دقيقاً (المتضايفات عند أرسطو وابن سينا)، فإن 'التضايفية' كمصدر صناعي منه لم يُسكَّ
        بعد ولا يقوم على نص معجمي. علاوةً على ذلك فإن 'نسبية' هي المصطلح الراسخ بلا منازع
        في جميع المعاجم الحديثة، مما يُغني عن إدخال مصطلح جديد.
      evidence_assessment:
        case: no_material

    - lemma: "الاعتبارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على 'الاعتبارية' كمصطلح قائم بذاته في المصادر المستعلَمة. وإن كان 'اعتباري'
        موظَّفاً في المعاجم (شخص اعتباري، سعر اعتباري)، فإن دلالته الراسخة هي 'notional/nominal'
        لا 'relative'. الاستعمال الفلسفي الكلاسيكي (الاعتباري ≠ الحقيقي) يختلف دلالياً عن
        المطلوب، وتوظيفه في هذه المجموعة سيُفضي إلى لبس مع الاستعمال القانوني والاقتصادي المعاصر.
      evidence_assessment:
        case: no_material

    - lemma: "التَّعَلُّقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على المصطلح في أي مصدر. والمصدر 'التعلق' يدل في الاستعمال الأشيع على الانكباب
        العاطفي أو الارتباط الوجداني، لا على الخاصية الدلالية العلائقية. الانتقال الدلالي من
        'الارتباط' إلى 'النسبية' غير مستقر وليس مسكوكاً.
      evidence_assessment:
        case: no_material

    - lemma: "الإِضَافِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح متعارض مع الاستعمال المسكوك: 'الإضافية' = additionality في مصطلحات المناخ
        والبيئة (موثَّق في ArabTerm). الاستخدام في هذه المجموعة سيصطدم بهذا المعنى المتداول
        في السياق الأممي. كما أن 'إضافي' في الاستعمال الحديث تغلب عليه دلالة 'supplementary/extra'
        لا 'relational'.
      evidence_assessment:
        case: contradicts_only


