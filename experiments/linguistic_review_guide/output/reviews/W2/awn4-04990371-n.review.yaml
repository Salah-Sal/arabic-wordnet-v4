# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-04990371-n
# definition_en: an attribute of sound
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين (خاصية صوتية، سمة صوتية) تفتقران إلى التشكيل الكامل"
      - "التعريف الحالي 'صفة متعلقة بالصوت' مُقتضَب ودائري جزئياً: صفة ≈ خاصية"
      - "لا يُحدَّد نطاق الخاصية: هل هي صوتية فيزيائية (فيزياء الصوت) أم صوتية لغوية (فونولوجية)؟"
      - "لا توجد أمثلة استعمالية على مستوى المجموعة أو المعنى"
    observations: >
      المجموعة تمثّل مفهوم 'صفة/خاصية تتعلق بالصوت' بوصفه تصنيفاً مظلياً يشمل:
      الشدةَ والتردد والجرسَ والنبر وسائر الخصائص الصوتية. المصطلحان الموجودان
      (خاصية صوتية، سمة صوتية) شائعان في الدراسات الصوتية واللسانية العربية.
      الفارق الدلالي بينهما دقيق: خاصية تأتي من الموروث الفلسفي وتعني 'الميزة
      المتعلقة بالذات'، بينما سمة تنتمي إلى التقليد الوصفي اللساني وتُفيد
      'العلامة التمييزية الأدنى'. الاثنتان مستعملتان في المعاجم الاصطلاحية العربية
      الحديثة وتستحقّان الإبقاء مع تصحيح التشكيل.
  blind_candidates:
    - lemma: "مَيْزَة صَوْتِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من مَيْزَة (ما يُميَّز به الشيء، من جذر م-ي-ز) + صَوْتِيَّة؛
        يُفيد 'الخاصية المميِّزة للصوت'، شائع في سياقات التحليل الصوتي
    - lemma: "خَاصَّة صَوْتِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من خَاصَّة (الاسم المؤنث لـ'ما يختص به الشيء دون غيره'،
        أقدم وأفصح من خاصيّة وفق معجم الصواب) + صَوْتِيَّة؛ بديل أعرق
        من 'خاصية صوتية'
    - lemma: "وَصْف صَوْتِيّ"
      generation_method: tarkib
      justification: >
        تركيب إضافي-وصفي من وَصْف (صفة لازمة، من و-ص-ف) + صَوْتِيّ؛
        يُفيد 'النعت الصوتي'، غير أنه قد يوحي بعملية الوصف لا بالصفة نفسها
    - lemma: "نَوْعِيَّة صَوْتِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من نَوْعِيَّة (مصدر صناعي لنوع؛ جودة/طبيعة) + صَوْتِيَّة؛
        يُقابل 'sound quality' بمعنى أضيق ينصبّ على الجودة لا الخاصية المجردة


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمّة الموجودة ١: خاصية صوتية ──
    - lemma: "خاصية صوتية"
      confirm:
        - text: >
            «خاصية أدب تُميزه عن لا أَدب. وهي علامة موضوع تسمح بالتعرف
            على شخصية أو ظاهرة أو أسلوب كتميز خاص عن باقي الأعمال؛
            والخاصية تفرد بأسلوب شخصي في اللغة المشتركة.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مجال اللغة والأدب"
        - text: >
            «أداء صوتي فردي: خاصية صوتية مميزة للفرد. أو هو صوت كلامي خاص
            بشخص ما لا يشاركه فيه الناس الذين يتكلمون نفس اللغة ونفس اللهجة.»
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: >
            «فوق قطعي: سمة تطريزية وهي خاصية صوتية أكبر من القطعة لأنها تشمل
            قطعات أو مقطعًا أو عدة مقاطع مثل النبر والتنغيم والتأنيف
            والانسجام الصائتي…»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: >
            «[خاصية:] property — الفيزياء العامة والنووية»
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: >
            «الخاصيّة: نسبة إلى الخاصَّة. يمكن تصحيح كلمة «خاصّيّة» بناءً
            على ورودها في الوسيط، فقد جاء: «الخاصيّة: نسبة إلى الخاصّة»
            و«خاصّة الشيء: ما يختصّ به دون غيره». وقد وردت الكلمة في الأساسي
            على أنها مصدر صناعي لـ «خاصّة».»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: >
            «الخاصيَّة (في الانكليزية: Characteristic، property): بإلحاق الياء
            تستعمل في الموضع الذي يكون السبب فيه مخفيًا كقول الأطباء هذا الدواء
            يعمل بالخاصية. فقد عبّروا بها عن السبب المجهول للأثر المعلوم
            بخلاف الخاصة، فإنّها في العرف تطلق على الأثر أعمّ من أن يكون
            سبب وجوده معلومًا أو مجهولًا.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
          addition: >
            يُوضّح التهانوي الفرق الدقيق بين خاصة وخاصية: الأولى أعمّ
            (تشمل الأثر المعلوم والمجهول السبب)، والثانية مخصوصة بالسبب المجهول.
            هذا الفارق دقيق وقد تلاشى في الاستعمال الحديث.

    # ── اللمّة الموجودة ٢: سمة صوتية ──
    - lemma: "سمة صوتية"
      confirm:
        - text: >
            «سِمَة (Feature): خاصية دنيا، غير قابلة للتحقيق بشكل مستقل.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مجال اللغة والأدب"
        - text: >
            «تقنيع: عملية يقوم بها المتكلم باستعمال شكل لغوي أو سمة صوتية
            لكي يصنف ضمن طبقة اجتماعية وسياسية لا ينتمي إليها أو العكس.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: >
            «سمة: صفة أو ميزة لشيء ما بمقدور البشر أو الطُّرُق المؤتمتة
            التعرُّف عليها، وغالبًا ما تستخدم كمرادف لكلمة (خاصية).»
          source: "معجم البيانات والذكاء الاصطناعي (2024) — SDAIA"
        - text: >
            «سِمَة (attribute): صفة تميز ملفًا أو سجلًا أو حقلًا وتبين نوعه
            أو كيفية التعامل معه.»
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      expands:
        - text: >
            «(وَسَمَ) الْوَاوُ وَالسِّينُ وَالْمِيمُ: أَصْلٌ وَاحِدٌ يَدُلُّ
            عَلَى أَثَرٍ وَمَعْلَمٍ. وَوَسَمْتُ الشَّيْءَ وَسْمًا: أَثَّرْتُ
            فِيهِ بِسِمَةٍ.»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            الجذر الأصلي لسِمَة هو (وسم) بمعنى الأثر والعلامة، وهو ما يُعزِّز
            دلالتها على الخاصية المميِّزة (feature) في الاصطلاح اللساني الحديث.

    # ── مرشح المرحلة ١ أ: مَيْزَة صَوْتِيَّة ──
    - lemma: "مَيْزَة صَوْتِيَّة"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١ ب: خَاصَّة صَوْتِيَّة ──
    - lemma: "خَاصَّة صَوْتِيَّة"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١ ج: وَصْف صَوْتِيّ ──
    - lemma: "وَصْف صَوْتِيّ"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١ د: نَوْعِيَّة صَوْتِيَّة ──
    - lemma: "نَوْعِيَّة صَوْتِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١: خاصية صوتية ──
    - lemma: "خاصية صوتية"
      decision: confirmed
      decision_reason: >
        مستعملة فعلياً في معاجم اللسانيات العربية المعيارية (المعجم الموحد
        لمصطلحات اللسانيات 2002 ومسرد الإعلام والتواصل ALECSO)، وظاهرة
        في عبارات نصية من قبيل 'خاصية صوتية مميزة للفرد' و'خاصية صوتية
        أكبر من القطعة'. التسكيك المعجمي مؤكد. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        خاصية صوتية تنتمي إلى الموروث الفلسفي-العلمي في معنى 'property'
        (ما يختصّ به الشيء ذاتياً)؛ تُستعمل في الفيزياء الصوتية واللسانيات
        على حدٍّ سواء وتُقابل 'property' أكثر مما تُقابل 'feature'. غالبًا
        ما تشير إلى خاصية قابلة للقياس (شدة، تردد).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاصِّيَّة صَوْتِيَّة"

    # ── اللمّة الموجودة ٢: سمة صوتية ──
    - lemma: "سمة صوتية"
      decision: confirmed
      decision_reason: >
        مستعملة في معاجم اللسانيات بمعنى 'Feature' اللساني (السمة التمييزية
        الدنيا)، وشاهدة في نصوص مثل 'شكل لغوي أو سمة صوتية'. متمايزة
        دلالياً عن 'خاصية صوتية' وتمثّل مدخلاً مستقلاً ذا قيمة. تحتاج
        تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        سمة صوتية تنتمي إلى المصطلحية اللسانية البنيوية وتُقابل 'feature'
        (السمة الأدنى التمييزية)؛ تُستخدم بخاصة في السياق الفونولوجي
        للإشارة إلى الوحدات الصوتية الأولية (مجهورة/مهموسة، انفجارية/
        احتكاكية إلخ)، خلافاً لخاصية التي تدلّ على الخاصية القابلة
        للقياس الفيزيائي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِمَة صَوْتِيَّة"

    # ── مرشح المرحلة ١ أ: مَيْزَة صَوْتِيَّة ──
    - lemma: "مَيْزَة صَوْتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر لها على شاهد في أي معجم متخصص. معنى مَيْزَة متداخل
        مع خاصية وسمة دون أن يُضيف فارقاً دلالياً مستقلاً. الإبقاء
        على خاصية وسمة يُغطي الحاجة دون افتعال مدخل ثالث متكرر.

    # ── مرشح المرحلة ١ ب: خَاصَّة صَوْتِيَّة ──
    - lemma: "خَاصَّة صَوْتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن 'خاصّة' أقدم وأفصح لغوياً من 'خاصيّة'، إلا أنّ المعاجم
        الاصطلاحية الحديثة استقرّت على 'خاصية' في التركيبات المصطلحية
        المعاصرة. إضافة 'خاصة صوتية' بجوار 'خاصية صوتية' ستُربك المستخدم
        دون مكسب دلالي واضح.

    # ── مرشح المرحلة ١ ج: وَصْف صَوْتِيّ ──
    - lemma: "وَصْف صَوْتِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        وَصْف صَوْتِيّ يُفيد 'الوصف المتعلق بالصوت' أي عملية الوصف لا
        الصفة ذاتها؛ انزياح دلالي عن المفهوم المقصود 'خاصية تنتمي للصوت'.
        لا شواهد معجمية تدعمه بهذا المعنى.

    # ── مرشح المرحلة ١ د: نَوْعِيَّة صَوْتِيَّة ──
    - lemma: "نَوْعِيَّة صَوْتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        نَوْعِيَّة صَوْتِيَّة تُقابل 'sound quality' (جودة الصوت أو طبيعته
        النوعية) لا 'sound property' (خاصية الصوت المطلقة). دلالتها أضيق
        وأكثر تخصصاً. لا شواهد معجمية تدعمها في هذا السياق.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
