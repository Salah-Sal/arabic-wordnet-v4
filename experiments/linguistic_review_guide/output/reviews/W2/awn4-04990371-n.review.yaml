      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: >-
          {"roots":[{"word":"خاصية","root":"خصص","maqayis":"«الْخَاءُ وَالصَّادُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ يَدُلُّ عَلَى الْفُرْجَةِ وَالثُّلْمَةِ … خَصَصْتُ فُلَانًا بِشَيْءٍ خَصُوصِيَّةً»"},{"word":"صوتية","root":"صوت","maqayis":"«الصَّادُ وَالْوَاوُ وَالتَّاءُ أَصْلٌ صَحِيحٌ وَهُوَ الصَّوْتُ جِنْسٌ لِكُلِّ مَا وَقَرَ فِي أُذُنِ السَّامِعِ»"}]}
    - command: set_metadata
      params:
        entity_type: entry
