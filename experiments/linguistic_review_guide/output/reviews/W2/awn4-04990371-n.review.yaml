        التعريف الحالي مُقتضَب ودائري: يُعرِّف الخاصية الصوتية بـ'صفة'
        والصفة وخاصية مترادفتان في الاستعمال المعاصر. كذلك لا يُحدِّد
        طبيعة الارتباط بالصوت (هل هي صفة كمية قابلة للقياس؟ صفة وصفية
        نوعية؟ سمة بنيوية؟). يحتاج إلى جنس قريب مناسب وفصل نوعي كافٍ.
