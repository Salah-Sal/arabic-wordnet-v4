# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "خَاصِّيَّة صَوْتِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "خاصية"
          root: "خصص"
          maqayis_quote: >
            «الْخَاءُ وَالصَّادُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ، وَهُوَ يَدُلُّ
            عَلَى الْفُرْجَةِ وَالثُّلْمَةِ … وَمِنَ الْبَابِ خَصَصْتُ فُلَانًا
            بِشَيْءٍ خَصُوصِيَّةً، وَهُوَ الْقِيَاسُ لِأَنَّهُ إِذَا أُفْرِدَ
            وَاحِدٌ فَقَدْ أَوْقَعَ فُرْجَةً بَيْنَهُ وَبَيْنَ غَيْرِهِ.»
        - word: "صوتية"
          root: "صوت"
          maqayis_quote: >
            «الصَّادُ وَالْوَاوُ وَالتَّاءُ أَصْلٌ صَحِيحٌ، وَهُوَ الصَّوْتُ،
            وَهُوَ جِنْسٌ لِكُلِّ مَا وَقَرَ فِي أُذُنِ السَّامِعِ. يُقَالُ:
            هَذَا صَوْتُ زَيْدٍ.»
    - lemma: "سِمَة صَوْتِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "سمة"
          root: "وسم"
          maqayis_quote: >
            «الْوَاوُ وَالسِّينُ وَالْمِيمُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى أَثَرٍ
            وَمَعْلَمٍ. وَوَسَمْتُ الشَّيْءَ وَسْمًا: أَثَّرْتُ فِيهِ بِسِمَةٍ.
            وَفُلَانٌ مَوْسُومٌ بِالْخَيْرِ.»
        - word: "صوتية"
          root: "صوت"
          maqayis_quote: >
            «الصَّادُ وَالْوَاوُ وَالتَّاءُ أَصْلٌ صَحِيحٌ، وَهُوَ الصَّوْتُ،
            وَهُوَ جِنْسٌ لِكُلِّ مَا وَقَرَ فِي أُذُنِ السَّامِعِ.»

  per_sense:
    - lemma: "خَاصِّيَّة صَوْتِيَّة"
      sense_id: "{auto}"
      nuance: >
        تُقابل 'property' في الاستعمال العلمي الأشمل (فيزياء صوتية ولسانيات)؛
        تُشير إلى الخاصية القابلة للقياس والتحديد الكمّي كالشدة والتردد،
        وتنتمي إلى المصطلحية الفلسفية-العلمية للخاصية الذاتية.
      mwe: true
    - lemma: "سِمَة صَوْتِيَّة"
      sense_id: "{auto}"
      nuance: >
        تُقابل 'feature' في الاصطلاح اللساني البنيوي؛ تُشير إلى السمة
        التمييزية الدنيا غير القابلة للتحليل المستقل (كالجهر والهمس
        والانفجارية)، وتنتمي إلى التقليد الصوتي الفونولوجي أكثر
        من الفيزيائي.
      mwe: true

  synset:
    cultural_fit: native

  actions:
