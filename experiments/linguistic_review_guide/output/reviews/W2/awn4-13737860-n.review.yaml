        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُبرز تعدد الوحدات في المنظومة بفضل صيغة الجمع، أنسب للسياقات العلمية والمعيارية"
