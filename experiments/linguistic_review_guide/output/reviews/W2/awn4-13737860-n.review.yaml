stage1_review:
  assessment:
    concerns:
      - "اللمّة «وزن» شديدة التعدد الدلالي (الثِّقَل، فعل الوزن، الميزان العروضي، القَدْر)، واستعمالها وحدها بمعنى «نظام أوزان» يُوقع في اللبس"
      - "اللمّة «نظام وزن» عبارة وصفية إضافية قد لا تُعدّ وحدة معجمية ثابتة، لكنها أقرب إلى المصطلح من «وزن» المجرَّدة"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية، يمكن تحسينه بأسلوب المعجم الوسيط"
    observations: >
      المفهوم يشير إلى منظومة من الوحدات المعيارية لقياس الوزن (كالنظام الترويسي أو نظام أفواردوبوا أو النظام المتري).
      في العربية الحديثة يُعبَّر عنه عادةً بتركيب إضافي «نظام + مضاف إليه» (نظام الأوزان، نظام أفواردوبوا).
      الجذر «و ز ن» غزير الاشتقاق ويدلّ عند ابن فارس على التعديل والاستقامة.
      المفرد «وزن» بمعنى «نظام أوزان» لا يتبادر إلى الذهن إلا مع قيد لفظي (الوزن الترويسي مثلاً).
  blind_candidates:
    - lemma: "نِظَامُ الأَوْزَانِ"
      generation_method: tarkib
      justification: "تركيب إضافي يجمع «نظام» و«الأوزان» (جمع وَزْن)، فيدلّ صراحةً على منظومة تتضمن وحدات وزنية متعددة، وهو أوضح من المفرد «وزن»"
    - lemma: "مَوَازِينُ"
      generation_method: ishtiqaq
      justification: "جمع مِيزان على وزن مَفَاعِيل، يُستعمل في النصوص العربية بمعنى أنظمة الوزن والقياس (الموازين الصيدلانية، الموازين التجارية)"
    - lemma: "مِعْيَارُ الْوَزْنِ"
      generation_method: tarkib
      justification: "تركيب إضافي من مِعْيَار (ما يُقاس به غيره) والوزن، يؤدي معنى المقياس المعياري للوزن"
    - lemma: "زِنَة"
      generation_method: ishtiqaq
      justification: "مصدر نوعي من وَزَنَ على وزن فِعْلَة (أصلها وِزْنَة)، يدل على قَدْر الوزن ومعياره عند المعجميين القدماء"

stage2_evidence:
  per_lemma:
    - lemma: "نِظَامُ وَزْنٍ"
      expands:
        - text: "«نظام أفواردوبْوا: نظامٌ من الموازين يستخدم في بريطانيا وأميركا لوزن جميع السّلع ما عدا الأدوية والمعادن الثمينة والحجارة الكريمة»"
          source: "المورد الحديث (2008)"
          addition: "يُظهر أنّ «نظام + اسم» هو النمط العربي المعتاد للتعبير عن أنظمة الوزن المختلفة"
        - text: "«وَزْنُ أفواردوبويّ: نظام وزن أنجلوساكسوني يستعمل لقياس النسبة بين المساحة والوزن بالنسبة لخيوط الغزل والألياف»"
          source: "مسرد صناعة النسيج (ArabTerm)"
          addition: "استعمال مباشر لتركيب «نظام وزن» في سياق تعريف نظام وزني مخصص"

    - lemma: "وَزْن"
      confirm:
        - text: "«الوَزْن التُّرُوْيسيّ: سلسلة من الوحدات لوزن الجواهر والمعادن النفيسة»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«سِنْجة الميزان، كتلة من تمر لا يكاد الرجل يرفعها بيديه... (عند العروضيين): ما بنت عليه العرب أشعارها من الجبل: حذاؤه»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي للوزن هو الثِّقَل المادي أو الميزان العروضي أو الحِذاء، لا «نظام وحدات الوزن»"
      expands:
        - text: "«(وَزَنَ) الْوَاوُ وَالزَّاءُ وَالنُّونُ: بِنَاءٌ يَدُلُّ عَلَى تَعْدِيلٍ وَاسْتِقَامَةٍ. وَوَزَنْتُ الشَّيْءَ وَزْنًا. وَالزِّنَةُ قَدْرُ وَزْنِ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل المادة يدل على التعديل والاستقامة، لا على المنظومة بذاتها"

    - lemma: "نِظَامُ الأَوْزَانِ"
      confirm:
        - text: "«نظام أفواردوبْوا: نظامٌ من الموازين يستخدم في بريطانيا وأميركا لوزن جميع السّلع»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الفئة: إحدى فئات العملة أو الطوابع أو وحدات الوزن أو القياس»"
          source: "المورد الحديث (2008) — مدخل denomination"
          addition: "يُظهر شيوع تركيب «وحدات الوزن» في السياق العربي المعاصر"

    - lemma: "مَوَازِينُ"
      confirm:
        - text: "«الموازين الصيدلانية: نظام من الموازين يُستخدم في مزج العقاقير وتحضير الوصفات الطبية»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(الْمِيزَان) الْآلَة الَّتِي توزن بهَا الْأَشْيَاء والسنجة من الْحِجَارَة وَالْحَدِيد وَنَحْوهَا والمقدار»"
          source: "المعجم الوسيط"
          conflict: "المِيزان في أصله هو الآلة (الأداة الفيزيائية) لا النظام الوحداتي، فاستعمال جمعه «موازين» بمعنى «أنظمة وزنية» استعمال مجازي محدود"

    - lemma: "مِعْيَارُ الْوَزْنِ"
      contradicts:
        - text: "«(المعيار) العيار و(في الفلسفة) نموذج متحقق أو متصور لما ينبغي أن يكون عليه الشيء»"
          source: "المعجم الوسيط"
          conflict: "المعيار يدل على المقياس أو النموذج المرجعي لا على المنظومة الوحداتية بأسرها"

    - lemma: "زِنَة"
      contradicts:
        - text: "«والزِّنَةُ قَدْرُ وَزْنِ الشَّيْءِ; وَالْأَصْلُ وَزْنَةٌ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الزِّنة تدل على مقدار الوزن لا على النظام الوحداتي"

