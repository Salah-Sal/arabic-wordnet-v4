      nuance_differentiation: "يُستعمل مقيَّداً بوصف (الوزن الترويسي) للدلالة على نظام وزني بعينه، وهو أقرب للاختزال منه للمصطلح المستقل"
      actions:
        - command: update_lemma
          params:
