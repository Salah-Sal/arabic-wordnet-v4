            new_lemma: "وَزْن"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نِظَامُ الأَوْزَانِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        أوضح من «نظام وزن» لأنّ جمع «الأوزان» يدل صراحة على تعدد الوحدات الوزنية في المنظومة.
        وردت الصيغة في نصوص المورد الحديث وArabTerm بتراكيب مماثلة.
        اختبار السكّ: لا يمكن إبدال «الأوزان» بمرادف وبقاء المعنى الاصطلاحي ذاته → وحدة معجمية ثابتة.
