        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَوَازِينُ"
      source: stage1
      decision: removed
      decision_reason: >
        المِيزان في أصله اللغوي هو الآلة (أداة الوزن) لا النظام الوحداتي.
        جمعه «موازين» قد يرد مجازاً بمعنى أنظمة الوزن (الموازين الصيدلانية) لكنه استعمال محدود
        ولا يدل بذاته على «نظام وحدات» بل على «مجموعة أدوات أو سنجات».

    - lemma: "مِعْيَارُ الْوَزْنِ"
      source: stage1
