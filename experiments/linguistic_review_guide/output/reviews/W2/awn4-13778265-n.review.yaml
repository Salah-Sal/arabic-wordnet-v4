# مراجعة المجموعة الترادفية — awn4-13778265-n (containerful)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما مركّبتان إضافيتان، ولا توجد لمّة مفردة رغم أنّ العربية تملك لفظة «مِلْء» المفردة التي تؤدّي المعنى بدقة"
      - "«سعة حاوية» تميل دلاليًّا إلى مفهوم الطاقة الاستيعابية أكثر من الكمّية الفعلية التي يحويها الوعاء"
      - "اللمّتان تفتقران إلى التشكيل الكامل"
    observations: "المجموعة تمثّل مفهوم الكمّية التي يستوعبها وعاء ما، وهو مفهوم بسيط له تعبير عربي أصيل مفرد هو «مِلْء». المعجم الوسيط يعرّفه بأنه «قدر ما يأخذه الإناء ونحوه إذا امتلأ». المركّبتان الموجودتان صحيحتان لغويًّا لكنّ غياب اللفظة المفردة ثغرة معجمية ينبغي سدّها."
  blind_candidates:
    - lemma: "مِلْء"
      generation_method: ishtiqaq
      justification: "من جذر م ل أ على وزن مِفْعَل، يدلّ على قدر ما يأخذه الإناء إذا امتلأ. لفظة مفردة مسكوكة مسجّلة في المعجم الوسيط وأساس البلاغة وغيرهما."
    - lemma: "مُسْتَوْعَب"
      generation_method: ishtiqaq
      justification: "اسم مفعول من استوعب (وعب) على وزن مُسْتَفْعَل، بمعنى المقدار المُستوعَب في الوعاء. لكنه يحتاج تثبيتًا معجميًّا."
    - lemma: "وَعْبَة"
      generation_method: ishtiqaq
      justification: "من جذر وعب على وزن فَعْلَة (المرّة)، بمعنى ما يوعبه الوعاء مرّة واحدة. اشتقاق قياسي لكنّه غير مسجّل."
    - lemma: "سَعَةُ وِعَاء"
      generation_method: tarkib
      justification: "مركّب إضافي من سعة + وعاء، يعبّر عن مقدار ما يسع الوعاء. قريب من اللمّة الموجودة «سعة حاوية» لكن بمكوّن تراثي."


stage2_evidence:
  per_lemma:
    - lemma: "سَعَة حَاوِيَة"
      expands:
        - text: "«السّعة: بفتح السين هي التّوسعة والاحتواء والغنى»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "سعة تدلّ على الاحتواء والتوسعة لا على الكمّية المحدّدة"
        - text: "«الطَّاقة والقُوَّة الدَّعَة والغِنى والرَّفاهِيَة. يقال: هو في سَعَةٍ من العيش»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأساسية لسعة هي الطاقة والقدرة والغنى، لا الكمّية"
        - text: "«سعة الحاوية»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "مصطلح تقني حديث بمعنى capacity of container"

    - lemma: "مِلْءُ وِعَاء"
      confirm:
        - text: "«قدر ما يأخذه الإناءُ ونحوه إذا امتلأ. يقال: أعطه مِلْأَهُ, ومِلْأَيْهِ, وثلاثة أمْلائِه. ويقال: هذا حَجَرٌ مِلْءُ الكف»"
          source: "المعجم الوسيط (OCR)"
        - text: "«ملأت الوعاء وملأته، وهو ملان [...] وأعطني ملء القدح وملأيه وثلاثة أملائه. وحجر ملء الكف»"
          source: "أساس البلاغة للزمخشري"

    - lemma: "مِلْء"
      confirm:
        - text: "«قدر ما يأخذه الإناءُ ونحوه إذا امتلأ. يقال: أعطه مِلْأَهُ, ومِلْأَيْهِ, وثلاثة أمْلائِه»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(الملء) قدر مَا يَأْخُذهُ الْإِنَاء وَنَحْوه إِذا امْتَلَأَ وَفِي التَّنْزِيل الْعَزِيز {ملْء الأَرْض ذَهَبا}»"
          source: "المعجم الوسيط (حوسبة هورماني)"
        - text: "«مِلْء اسم يعني قدر ما يأخذه الإناء ونحوه إذا امتلأ»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«ملأت الوعاء وملأته [...] وأعطني ملء القدح وملأيه وثلاثة أملائه. وحجر ملء الكف، وحجارة أملاء الأكفّ»"
          source: "أساس البلاغة للزمخشري"

    - lemma: "مُسْتَوْعَب"
      contradicts:
        - text: "«الاستيعاب: أخذ الشيء كله [...] الوعب إيعابك الشيء في الشيء حتى تأتي عليه كله»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الاستيعاب يدلّ على الفعل (أخذ الكلّ) لا على الكمّية نفسها"

    - lemma: "وَعْبَة"
      evidence_status: "no_material_found"

    - lemma: "حَمُولَة"
      contradicts:
        - text: "«كُلُّ ما حَمَلَ من بَعيرٍ أو حمارٍ أو غير ذلك. سواء كانت عليها أثقالٌ أو لم تكن. الأَحْمالُ بأَعْيانِها»"
          source: "المعجم الكبير"
          conflict: "الحمولة تدلّ على دوابّ الحمل أو الأحمال نفسها، لا على كمّية ما يسعه الوعاء"

    - lemma: "سَعَةُ وِعَاء"
      expands:
        - text: "«الطاقة والقوة والدعة والغنى والرفاهية»"
          source: "المعجم الوسيط"
          addition: "سعة في الأصل عن الطاقة والغنى لا الكمّية المحدّدة"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "سَعَةُ حَاوِيَة"
      decision: confirmed
      decision_reason: "مركّب إضافي مقبول يعبّر عن مقدار ما تحويه الحاوية. مصطلح «سعة الحاوية» مسجّل في المعجم الموحد لمصطلحات علوم البحار. دلالة «سعة» على الاحتواء والتوسعة تدعم الاستخدام وإن كانت الدلالة الأصلية أوسع."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على البُعد التقني للطاقة الاستيعابية (capacity) ويستخدم مصطلح «حاوية» الحديث"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَعَةُ حَاوِيَة"

    - lemma: "مِلْءُ وِعَاء"
      decision: confirmed
      decision_reason: "مركّب إضافي مؤسّس على لفظة «مِلْء» الثابتة معجميًّا. يعبّر بدقّة عن الكمّية التي يأخذها الوعاء إذا امتلأ. مدعوم بأدلة المعجم الوسيط وأساس البلاغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على الكمّية الفعلية التي تملأ الوعاء (filling) باستخدام مصطلح «وعاء» التراثي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِلْءُ وِعَاء"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مِلْء"
      source: stage1
      decision: confirmed
      decision_reason: "لفظة مفردة مسكوكة مسجّلة في المعجم الوسيط بتعريف مطابق تمامًا للمجموعة الترادفية: «قدر ما يأخذه الإناء ونحوه إذا امتلأ». وردت في القرآن الكريم {ملء الأرض ذهبًا}. أولى بالإدراج من المركّبات لأنها مفردة فصيحة ثابتة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظة مفردة عامّة تدلّ على قدر ما يأخذه أيّ إناء أو وعاء، دون تخصيص بنوع الوعاء"
      actions:
        - command: create_entry
          params:
            lemma: "مِلْء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُسْتَوْعَب"
      source: stage1
      decision: removed
      decision_reason: "الاستيعاب يدلّ على فعل الأخذ الكامل لا على الكمّية نفسها. اسم المفعول «مُستوعَب» يعني ما تمّ استيعابه لا مقدار ما يسعه الوعاء. لا دليل معجمي على استخدامه بهذه الدلالة."

    - lemma: "وَعْبَة"
      source: stage1
      decision: removed
      decision_reason: "لا أثر معجمي لهذه اللفظة. اشتقاق قياسي لكنّه غير مسجّل ولا مستعمل."

    - lemma: "سَعَةُ وِعَاء"
      source: stage1
      decision: removed
      decision_reason: "مكرّرة دلاليًّا مع اللمّة الموجودة «سعة حاوية» ومع «ملء وعاء». لا تضيف تمييزًا دلاليًّا جديدًا."


