# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # التقييم الأولي — بعد الاطلاع على الملف الكامل
  assessment:
    concerns:
      - "لمّة 'قَرَابَة' تنتمي دلالياً إلى حقل القرابة الأسرية (kinship)، لا إلى مفهوم الترابط المجرد (relatedness)؛ مما يُضيّق الدلالة ويُخلّ بتمثيل المجموعة الترادفية"
      - "التعريف العربي الحالي 'طريقة معينة من الترابط' يستعين بمادة (ت-ر-ب-ط) المتصلة بجذر اللمّة الرئيسية (ارتباط)، مما يُفضي إلى دوران جزئي"
      - "غياب التمييز الدلالي الموثَّق بين اللمّتين ارتباط وقرابة داخل المجموعة"
    observations: >-
      تُمثّل هذه المجموعة مفهوم 'الترابط' (relatedness) بوصفه خاصية مجردة تصف وجهاً بعينه
      من أوجه الاتصال بين الأشياء أو الأفكار. الجذر العربي الأنسب هو 'ربط' الذي يدلّ في مقاييس
      اللغة على الشدّ والثبات والتقييد، ومنه 'ارتباط' بصيغة الافتعال الدالة على التقيّد المتبادل
      المنتظَم. أما 'قرابة' فجذرها 'قرب' ويختصّ في جميع المعاجم الكلاسيكية والحديثة بالقرب في
      النسب والرحم؛ وهو مفهوم أسري محدود لا يُغطّي الترابط العام المراد بهذه المجموعة. المجموعة
      تحتاج إلى حذف 'قرابة' وتعديل التعريف لتجنب الدوران.

  # المرشحون الأعمياء — مُوَلَّدون قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "صِلَةٌ"
      generation_method: majaz
      justification: >-
        من جذر وصل على وزن فِعْلَة؛ تُستعمل في العربية للدلالة على الرابط بين شيئين (ذو صِلَة،
        لا صِلَة له بـ)؛ مُرشَّحة للتعبير عن 'طريقة معينة من الترابط' بدلالة الاتصال والوَصْل

    - lemma: "مُنَاسَبَةٌ"
      generation_method: ishtiqaq
      justification: >-
        من جذر نسب على وزن مُفَاعَلَة؛ في الاصطلاح الفلسفي تعني 'الاتحاد في النسبة' أي وجهاً
        بعينه من التعلّق والتقابل بين شيئين؛ مُرشَّحة لتعبّر عن منط خاص من الترابط

    - lemma: "نِسْبَةٌ"
      generation_method: ishtiqaq
      justification: >-
        من جذر نسب؛ تُعرَّف في كتب الاصطلاح الكلاسيكية بـ'إيقاع التعلّق بين الشيئين'؛ وهي
        بهذا تُعبّر بدقة عن 'طريقة معينة من الترابط' في السياق المعجمي الفلسفي

    - lemma: "تَوَاشُجٌ"
      generation_method: ishtiqaq
      justification: >-
        من جذر وشج على وزن تَفَاعُل؛ يُفيد التداخل والتشابك العضوي؛ إحياء لفظ كلاسيكي ميّت
        يُعبّر عن ترابط وثيق بين شيئين دون اشتراك لفظي مع مصطلحات حديثة


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفّذة: ٣ (دفعي + إثراء + جسر إنجليزي + مقاييس)
stage2_evidence:

  per_lemma:

    - lemma: "اِرْتِبَاطٌ"
      confirm:
        - text: "«العلاقة التي تنتج عندما يرتبط تغيير في متغير باستمرار مع تغيير في متغير آخر»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — أرابترم (entry_id=360380)"
        - text: "«correlation» — ارتباط"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (entry_id=352997) والرياضيات والفلك (entry_id=415541) والجغرافيا والتاريخ (entry_id=499527) — أرابترم"
        - text: "«linkage» — ارتباط"
          source: "المعجم الطبي الموحد (2009) — أرابترم (entry_id=602906)"
        - text: "«dependence» — ارتباط"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — أرابترم (entry_id=415692)"
        - text: "«affiliation» — ارتباط"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — أرابترم (entry_id=497617)"
      expands:
        - text: "«مقياس إحصائي لمدى الارتباط الرياضي بين متغيرين»"
          source: "معجم البيانات والذكاء الاصطناعي (2024) — أرابترم (entry_id=765568)"
          addition: >-
            يُظهر أن 'ارتباط' يمتد دلالياً ليشمل الترابط الإحصائي القابل للقياس؛ وهو نمط
            نموذجي من أنماط 'طريقة معينة من الترابط' المراد بالمجموعة

    - lemma: "قَرَابَةٌ"
      contradicts:
        - text: "«الدُّنُوُّ فى النسب»"
          source: "المعجم الوسيط (OCR، entry_id=22906)"
          conflict: >-
            التعريف يقصر دلالة 'قرابة' على القرب في النسب والرحم؛ وهو مفهوم أسري
            لا يُعادل 'طريقة معينة من الترابط' بمعناها المجرد والعام
        - text: "«القَرابة: القُرب في الرحم ... وأهلُ القرابة: هم الذي يُقدِّمون الأقرب فالأقرب من ذوي الأرحام»"
          source: "التعريفات الفقهية للبركتي — entry_id=835460"
          conflict: "النص يُقيّد القرابة صراحةً بصلة الرحم الأسرية"
        - text: "«kinship» — قرابة"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — أرابترم (entry_id=400065)"
          conflict: "المعجم يُرادف قرابة بـ kinship حصراً لا بـ relatedness العام"
        - text: "«kinship» — قرابة؛ نَسَب"
          source: "المعجم الطبي الموحد (2009) — أرابترم (entry_id=598391)"
          conflict: "التوثيق الطبي يُثبّت القرابة في حقل علم الوراثة والأحياء الأسري"
      expands:
        - text: "«علاقة سلالية بين نوعين أو أكثر من الأحياء»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — أرابترم (entry_id=429751)"
          addition: >-
            يُجيز الاستعمال العلمي توسيع 'قرابة' لتشمل التقارب البيولوجي بين الأنواع؛
            غير أن هذا لا يزال مقيّداً بالأصل الجيني المشترك لا بالترابط المجرد
        - text: "«نسب لغوي»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — أرابترم (entry_id=495879)"
          addition: >-
            يُثبت استعمال 'قرابة' لغوياً بمعنى الانتساب إلى أصل مشترك؛ وهو نوع من
            الترابط لكنه يظل مقيّداً بالأصل ولا يُعادل المفهوم العام

    - lemma: "صِلَةٌ"
      confirm:
        - text: "«الصّلة: [في الانكليزية] Relation، contact، conjunction... بمعنى: الاتصال، والوصل، والقرابة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي — entry_id=820054"
        - text: "«affinity» — صلة"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — أرابترم (entry_id=400150)"
      contradicts:
        - text: "«(الصِّلَةُ) العطيَّةُ الجائزةُ الحرفُ الذى بعد الروِىِّ فى قافية البيت»"
          source: "المعجم الوسيط (OCR، entry_id=33227)"
          conflict: >-
            المعجم الوسيط — المرجع المعياري — لا يُثبت 'صِلَة' بمعنى الرابط أو الترابط؛
            المعنيان الموثّقان هما: العطية/الجائزة، والمصطلح العروضي — مما يُشير إلى عدم
            رسوخ دلالة الرابط معجمياً في المصادر الأصيلة

    - lemma: "مُنَاسَبَةٌ"
      contradicts:
        - text: "«المناسبة: هي الاتحاد في النسبة وتسمّى تناسباً أيضاً كزيد وعمرو إذا تشاركا في بنوّة بكر»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي — entry_id=820945"
          conflict: >-
            الدلالة الاصطلاحية تنصرف إلى 'التناسب والتشاكل' لا إلى 'طريقة من الترابط'
            بمعنى relatedness؛ والمناسبة في العربية المعاصرة تعني الحدثَ أو الفرصةَ
        - text: "«المُناسبة: هي الملاءمة يعني موافقة الوصف أي العلة للحكم»"
          source: "التعريفات الفقهية للبركتي — entry_id=836047"
          conflict: "الدلالة الأصولية تتعلق بملاءمة الوصف للحكم، لا بالترابط العام بين الأشياء"

    - lemma: "نِسْبَةٌ"
      confirm:
        - text: "«النسبة: إيقاع التعلق بين الشيئين»"
          source: "كتاب التعريفات للشريف الجرجاني — entry_id=795772"
        - text: "«النِّسْبَة: الرَّبْط»"
          source: "دستور العلماء للأحمدنكري — entry_id=817977"
        - text: "«(النِّسْبَة) الصِّلَة أو القرابة»"
          source: "المعجم الوسيط (Hawramani، entry_id=885773)"
      contradicts:
        - text: "«ratio» — نسبة (في الهندسة، الرياضيات، الطب، الفيزياء، الكهرباء)"
          source: "المعاجم الموحدة — أرابترم (entry_ids=353433, 417332, 637865, 507846 وغيرها)"
          conflict: >-
            في الاستعمال التقني المعاصر الغالب، 'نسبة' تعني 'ratio' (النسبة الرياضية/المئوية)
            حصراً تقريباً في شتى المجالات؛ مما يُفضي إلى التباس حاد إذا استُعملت
            للدلالة على relatedness

    - lemma: "تَوَاشُجٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "اِرْتِبَاطٌ"
      decision: confirmed
      decision_reason: >-
        اللمّة موثّقة في عشرات المعاجم التقنية والعلمية الحديثة بمعاني 'الارتباط والتعلّق والترابط'
        (correlation, linkage, dependence, affiliation)، وكلها أنماط من الترابط المحدَّد؛ جذرها
        'ربط' ومقاييس اللغة يُثبت دلالته على الشدّ والثبات والتقييد، وهو ما يُطابق مفهوم 'طريقة
        معينة من الترابط'. صيغة الافتعال (اِرْتِبَاط) تُفيد حصول الفعل متبادَلاً بين طرفين، وهو
        أنسب الصيغ للدلالة على ترابط محدَّد بين شيئين. يحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُفيد الارتباطُ التقيُّدَ والتعلُّقَ المنتظَمَ بين شيئين على نحو محدَّد وقابل للتعريف
        والقياس؛ وهو أخصّ من 'اتصال' (الهايبرنيم: الوصل العام) ومن 'ترابط' (التشابك المتبادل
        غير المحدَّد). يُستعمل للارتباط الإحصائي والوظيفي والسببي وغيرها من أنواع الترابط.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِرْتِبَاطٌ"

    - lemma: "قَرَابَةٌ"
      decision: removed
      decision_reason: >-
        تنتمي 'قرابة' دلالياً إلى مجموعة 'القرابة الأسرية' (kinship) لا إلى مجموعة 'الترابط
        المجرد' (relatedness)؛ جميع المعاجم الكلاسيكية (المعجم الوسيط، التعريفات الفقهية للبركتي)
        والحديثة (أرابترم في علم الاجتماع والطب والقانون) تُقيّدها بالقرب في النسب والرحم. وإن
        وُجد توسيع بيولوجي (affinity بين الأنواع) أو لساني (القرابة اللغوية)، فإن ذلك لا يُغطّي
        المفهوم المجرد والعام المُراد. إدراجها في هذه المجموعة سيُحدث التباساً مفهومياً مع
        المجموعة الترادفية الخاصة بـ kinship.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      # لا إجراء مطلوباً — remove_sense يُنفَّذ تلقائياً عند الحذف

    - lemma: "صِلَةٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم أن التهانوي يُثبت للصِّلَة معنى Relation/contact، فإن معاجم أصول اللغة (المعجم
        الوسيط OCR) لا تُوثّق 'صِلَة' بمعنى الرابط أو الترابط — المعنيان الأصيلان هما: العطية
        والمصطلح العروضي. فضلاً عن ذلك، 'صِلَة' تُعبّر عن 'وَصْل/اتصال موجود' لا عن 'طريقة
        من الترابط' كمفهوم مجرد؛ وهي أعمّ دلالةً مما تحتاجه المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُنَاسَبَةٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        في العربية المعاصرة، 'مناسبة' تعني الحدثَ أو الفرصةَ حصراً تقريباً، وهو بعيد كلياً
        عن 'طريقة من الترابط'. أما الدلالة الاصطلاحية الفلسفية (التناسب والملاءمة) فلا تُطابق
        مفهوم relatedness العام ولا تجتاز اختبار يُسر التداول.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "نِسْبَةٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم أن نِسبة تُثبَت في كتب الاصطلاح الكلاسيكية (الجرجاني، الأحمدنكري) بمعنى 'التعلّق
        بين الشيئين' مما يُقابل relatedness، فإن الاستعمال التقني الحديث المهيمن يجعلها تعني
        'ratio' (النسبة الرياضية والمئوية) في شتى المجالات الحديثة؛ مما يُفضي إلى التباس حاد
        ويُسقطها من اختبار يُسر التداول ووضوح الدلالة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَوَاشُجٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على أي شواهد معجمية في قاعدة البيانات. اللفظ نادر ولم يُثبَت استعماله كمصطلح
        مسكوك في المعجمية العربية القديمة أو الحديثة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


