# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06610383-n
# reading / reading material — مادة مكتوبة مخصصة للقراءة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «قراءة» تدل أساساً على فعل القراءة (المصدر) لا على المادة المقروءة، فاستعمالها هنا توسّع مجازي قد يوقع لبساً"
      - "اللمّة «مادة للقراءة» عبارة وصفية حرّة وليست مصطلحاً معجمياً ثابتاً — تفشل في اختبار السكّ (يمكن إبدال «للقراءة» بـ «للمطالعة» دون أن تفقد العبارة معناها)"
      - "التعريف العربي الحالي فيه دَوَران: يعرّف «قراءة» بعبارة تحتوي «للقراءة»"
    observations: "المجموعة تمثّل مفهوم المادة المكتوبة المُعَدَّة لأن تُقرأ (reading material)، وهو مفهوم شائع الاستعمال في العربية لكنه يفتقر إلى مصطلح مفرد مخصّص. العربية تعبّر عنه عادةً بتراكيب إضافية أو وصفية: «مواد القراءة»، «مادة مقروءة». واستعمال «قراءة» وحدها بمعنى «ما يُقرأ» توسُّع دلالي مجازي مُسنَد."
  blind_candidates:
    - lemma: "مَقْرُوء"
      generation_method: ishtiqaq
      justification: "اسم مفعول من قَرَأَ على وزن مَفْعُول، بمعنى «ما يُقرأ». ورد في المعجم الموحد للسانيات بتعريف: «كل ما يمكن قراءته بوصفه نصاً موجهاً للاستهلاك»، وهو قريب جداً من دلالة المجموعة."
    - lemma: "مُطَالَعَة"
      generation_method: majaz
      justification: "مصدر طالَعَ، يُستعمل مجازاً للدلالة على مادة المطالعة كما يُستعمل «قراءة» للدلالة على مادة القراءة. إطلاق المصدر على المفعول."
    - lemma: "مَادَّة قِرَائِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «مادة» و«قرائية» (نسبة إلى القراءة)، يدل على المادة المنسوبة إلى القراءة. أدق من «مادة للقراءة» لأنه يربط الوصف بالموصوف ربطاً نعتياً."
    - lemma: "مَطْبُوعَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول مؤنث من طَبَعَ على وزن مَفْعُولَة، يدل على كل ما طُبِع. شائع في الاستعمال المعاصر للدلالة على المواد المطبوعة المُعَدَّة للقراءة."

stage2_evidence:
  per_lemma:
    - lemma: "قِرَاءَة"
      confirm:
        - text: "«(3) مادة مقروءة أو معدَّة للقراءة»"
          source: "المورد الحديث (2008)"
        - text: "«(14) كلّ ما يَصْلُح للقراءة This novel is a good read.»"
          source: "المورد الحديث (2008) — مادة read"
        - text: "«(7) اجتماع تتلى فيه على الجمهور بعض النصوص الأدبيّة؛ النصّ المقروء هكذا»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«نشاط فكّ رموز معلومة لغوية أو غيرها، بغاية الفهم والتأويل. للقراءة في الأدب مناهج عديدة تصب جميعها في تكوين نظرية للأدب وأخرى لِنَقْده.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يوسّع مفهوم القراءة ليشمل نشاط فك الرموز عموماً"
        - text: "«القراءة: هي عند القرّاء أن يقرأ القرآن سواء كانت القراءة تلاوة بأن يقرأ متتابعا أو أداء بأن يأخذ من المشايخ»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة تخصصية في علم القراءات القرآنية"
    - lemma: "مادة للقراءة"
      confirm:
        - text: "«أدوات القراءة، مواد القراءة — reading materials»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«أدوات القراءة، مواد القراءة»"
          source: "مسرد التربية (ArabTerm)"
          conflict: "الصيغة المُثبتة هي «مواد القراءة» بالإضافة وليس «مادة للقراءة» بحرف الجر"
    - lemma: "مَقْرُوء"
      confirm:
        - text: "«كل ما يمكن قراءته بوصفه نصاً موجهاً للاستهلاك.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«مقروء — readable»"
          source: "مسرد التربية (ArabTerm)"
          conflict: "يُستعمل صفةً بمعنى «قابل للقراءة» (readable) لا اسماً بمعنى «مادة القراءة»"
    - lemma: "مُطَالَعَة"
      confirm:
        - text: "«(طالع) الكتابَ قرأه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«المطالعة: توفيقات الحق للعارفين القائمين بحمل أعباء الخلافة ابتداء»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "دلالة صوفية اصطلاحية مغايرة تماماً"
    - lemma: "مَادَّة قِرَائِيَّة"
      evidence_status: "no_material_found"
    - lemma: "مَطْبُوعَة"
      confirm:
        - text: "«مَطْبُوْعَة — print-out»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«مَطْبُوْعَة — print-out»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "تدل على المخرجات المطبوعة (print-out) لا على مادة القراءة عموماً، وتستبعد المخطوطات والمواد الرقمية"

stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١ ──
    - lemma: "قِرَاءَة"
      decision: confirmed
      decision_reason: "لفظة «قراءة» مُثبتة في المورد الحديث بمعنى «مادة مقروءة أو معدّة للقراءة» (المعنى ٣)، وهو توسّع مجازي مقبول بإطلاق المصدر على المفعول. شائعة الاستعمال في السياقات العامة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على مادة القراءة بوجه عام عبر توسّع مجازي من المصدر إلى المفعول، وهي الأكثر شيوعاً واختصاراً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِرَاءَة"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "مادة للقراءة"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست وحدة معجمية ثابتة. تفشل في اختبار السكّ: يمكن إبدال «للقراءة» بـ «للمطالعة» أو «للاطلاع» دون تغيّر الوظيفة. الصيغة المثبتة في مسرد التربية هي «مواد القراءة» بالإضافة لا بحرف الجر."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: مَقْرُوء ──
    - lemma: "مَقْرُوء"
      source: stage1
      decision: removed
      decision_reason: "اسم مفعول يُستعمل أساساً صفةً بمعنى «قابل للقراءة» (readable)، لا اسماً بمعنى «مادة القراءة». التعريف في معجم اللسانيات («كل ما يمكن قراءته بوصفه نصاً موجهاً للاستهلاك») قريب من المفهوم لكنه يصف صفة لا ذاتاً."
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: مُطَالَعَة ──
    - lemma: "مُطَالَعَة"
      source: stage1
      decision: removed
      decision_reason: "مصدر «طالَعَ» يدل على فعل المطالعة لا على المادة المُطالَعة. لم يُعثر على شاهد معجمي يثبت استعماله بمعنى «ما يُطالَع» (المادة). كما أنه يحمل دلالة صوفية اصطلاحية في بعض المصادر."
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: مَادَّة قِرَائِيَّة ──
    - lemma: "مَادَّة قِرَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي لم يُعثر له على شاهد معجمي في قواعد البيانات المتاحة. يفشل في اختبار التثبيت المعجمي لعدم وروده في أي معجم مرجعي."
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: مَطْبُوعَة ──
    - lemma: "مَطْبُوعَة"
      source: stage1
      decision: removed
      decision_reason: "تدل على المادة المطبوعة حصراً (print-out)، وهي أخصّ من مفهوم المجموعة الذي يشمل كل مادة مكتوبة سواء أكانت مطبوعة أم مخطوطة أم رقمية."
      evidence_assessment:
        case: contradicts_only

