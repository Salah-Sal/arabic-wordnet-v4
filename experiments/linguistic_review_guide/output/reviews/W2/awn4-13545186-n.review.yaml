stage1_review:
  assessment:
    concerns:
      - "اللمة 'بطلان' (invalidity) لا تعبر بدقة عن 'التقادم' (obsolescence) كعملية صيرورة، بل تعبر عن حالة قانونية ناتجة أو وضعية بطلان الشيء."
      - "التعريف العربي الحالي يخلط بين العملية (التحول) والنتيجة (الإهمال)، ويحتاج لضبط صياغته ليكون أكثر معجمية."
    observations: "المجموعة تدور حول مفهوم 'التقادم' أو الصيرورة إلى حالة عدم الصلاحية أو الهجر. اللمة 'تقادم' هي الأكثر دقة واصطلاحية في العصر الحديث، بينما اللمات الأخرى المرشحة تغطي الجوانب المعنوية والمادية لهذا التحول."
  blind_candidates:
    - lemma: "اِنْدِثَار"
      generation_method: majaz
      justification: "يدل على دروس الأثر ومحوه وغياب الشيء بعد ظهوره، وهو مناسب لوصف غياب التقنيات أو العادات."
    - lemma: "بِلًى"
      generation_method: ishtiqaq
      justification: "المصدر الأصيل من الفعل 'بلي'، ويدل على رثاثة الشيء وقدمه حتى يخرج من حيز الانتفاع."
    - lemma: "إِخْلَاق"
      generation_method: ishtiqaq
      justification: "من 'أخلق الشيء' أي جعله بالياً، وهو يعبر عن الجانب السببي في التقادم."
    - lemma: "عَفَاء"
      generation_method: majaz
      justification: "يدل على الزوال والهلاك ودروس الأثر، كما في قولهم 'عليه العفاء'."

stage2_evidence:
  per_lemma:
    - lemma: "بطلان"
      confirm:
        - text: "«بطلان: [في الانكليزية] obsolescence ... [في الطب]»"
          source: "المعجم الطبي الموحد"
      contradicts:
        - text: "«البطلان: عند الحنفية هو كون الفعل بحيث لا يوصل إلى المقصود الدنيوي ويسمى ذلك الفعلُ باطلاً»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "المعنى فقهي قانوني بحت يتعلق بصحة العقود والعبادات، وليس بالتقادم الزمني."
    - lemma: "تقادم"
      confirm:
        - text: "«التقادم (في القانون) مدة محدودة تسقط بانقضائها المطالبة بالحق أو بتنفيذ الحكم»"
          source: "المعجم الوسيط"
        - text: "«تقادم: obsolescence»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
      expands:
        - text: "«تقادم الشيء: قدم وطال عليه الأمد»"
          source: "المعجم الوسيط"
          addition: "يؤكد المعنى اللغوي العام للصيرورة مع مرور الزمن."
    - lemma: "اِنْدِثَار"
      confirm:
        - text: "«اندثار: دروس الأثر ومحوه»"
          source: "المعجم الوسيط (حورماني)"
    - lemma: "بِلًى"
      confirm:
        - text: "«بلى: obsolescence»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
        - text: "«بلي الثوب بلى وبلاء: رث، والدار ونحوها: فنيت»"
          source: "المعجم الوسيط"
    - lemma: "عَفَاء"
      confirm:
        - text: "«العفاء: الزوال والهلاك... وعفا: درس، فهو من هذا؛ وذلك أنه شيء يترك فلا يتعهد... فيخفى على مرور الأيام»"
          source: "المعجم الوسيط / مقاييس اللغة"
    - lemma: "تَلَاشٍ"
      confirm:
        - text: "«تلاشي: اضمحلال أو فناء»"
          source: "معجم الصواب اللغوي"

stage3_analysis:
  per_lemma:
    - lemma: "تقادم"
      decision: confirmed
      decision_reason: "المصطلح المركزي والأكثر دقة للتعبير عن obsolescence في السياقات القانونية والتقنية والعامة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقَادُمٌ"
    - lemma: "بطلان"
      decision: removed
      decision_reason: "المصطلح يشير إلى حالة 'عدم الصلاحية' أو 'الفساد' (invalidity) أكثر من كونه عملية 'التحول إلى قديم'. استخدامه في المعجم الطبي الموحد يعتبر حالة خاصة ولا يعمم في المعجم العام تجنباً للخلط."
    - lemma: "اِنْدِثَار"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر عن عملية اختفاء المعالم والآثار بمرور الزمن، وهو مناسب جداً لمفهوم falling into disuse."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اِنْدِثَارٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بِلًى"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معجمي واصطلاحي (في الاقتصاد والتجارة) يعبر عن تآكل القيمة أو الصلاحية بالقدم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بِلًى", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "عَفَاء"
      source: stage1
      decision: confirmed
      decision_reason: "يرتبط لغوياً بمحو الأثر والزوال، ويستخدم بكثرة في سياق 'عفا عليه الزمن'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عَفَاءٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَلَاشٍ"
      decision: confirmed
      decision_reason: "فعل الصيرورة إلى العدم أو الاضمحلال التدريجي، وهو مستعمل بكثرة في اللغة المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَلَاشٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عملية التحول إلى شيء عفا عليه الزمن؛ الوقوع في طي الإهمال أو التقادم"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي أكثر منه اصطلاحي، ويحتاج لدمج المعاني المادية (البلى) والمعنوية (الهجر)."
    authored:
      - type: terminological
        text: "الصيرورة إلى حالة القِدَم أو عَدَم الصَّلاحِيَّة؛ وهي عَمَلِيَّة تَدَرُّجِيَّة تؤدي إلى هَجْر الشيء أو تَرک الانتفاع به لظهور ما هو أحْدث أو أفضل منه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "الصيرورة إلى حالة القِدَم أو عَدَم الصَّلاحِيَّة؛ وهي عَمَلِيَّة تَدَرُّجِيَّة تؤدي إلى هَجْر الشيء أو تَرک الانتفاع به لظهور ما هو أحْدث أو أفضل منه."}
  examples:
    per_lemma:
      - lemma: "تَقَادُمٌ"
        examples:
          - text: "يُعَدُّ التَّقَادُمُ التِّقْنِيُّ مِنْ أهمِّ أسبابِ استبدالِ الآلاتِ القديمةِ بأجهزةٍ أكثرَ كفاءةً."
            type: usage
      - lemma: "اِنْدِثَارٌ"
        examples:
          - text: "أدى انْدِثَارُ الحِرَفِ اليدويَّةِ القديمةِ إلى فقدانِ جزءٍ هامٍّ مِنَ التُّراثِ الثَّقافِيِّ."
            type: usage
      - lemma: "بِلًى"
        examples:
          - text: "ظَهَرَتْ علاماتُ البِلَى على أثاثِ المنـزلِ المهجورِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعَدُّ التَّقَادُمُ التِّقْنِيُّ مِنْ أهمِّ أسبابِ استبدالِ الآلاتِ القديمةِ بأجهزةٍ أكثرَ كفاءةً."}

stage5_enrichment:
  per_entry:
    - lemma: "تَقَادُمٌ"
      entry_id: "{auto}"
      root: "قدم"
      maqayis_quote: "«الْقَافُ وَالدَّالُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَبْقٍ وَرَعْفٍ... الْقِدَمُ: خِلَافُ الْحُدُوثِ. وَيُقَالُ: شَيْءٌ قَدِيمٌ، إِذَا كَانَ زَمَانُهُ سَالِفًا.»"
    - lemma: "اِنْدِثَارٌ"
      entry_id: "{auto}"
      root: "دثر"
      maqayis_quote: "«الدَّالُ وَالثَّاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ مُطَّرِدٌ... فَأَمَّا قَوْلُهُمْ رَسْمٌ دَاثِرٌ، فَهُوَ مِنْ هَذَا، وَذَلِكَ أَنَّهُ يَكُونُ ظَاهِرًا حَتَّى تَهُبَّ عَلَيْهِ الرِّيَاحُ... فَتُغَطِّيَهُ.»"
    - lemma: "بِلًى"
      entry_id: "{auto}"
      root: "بلي"
      maqayis_quote: "«الْبَاءُ وَاللَّامُ وَالْوَاوُ وَالْيَاءُ، أَصْلَانِ: أَحَدُهُمَا إِخْلَاقُ الشَّيْءِ... بَلِيَ يَبْلَى فَهُوَ بَالٍ. وَالْبِلَى مَصْدَرُهُ.»"
    - lemma: "عَفَاءٌ"
      entry_id: "{auto}"
      root: "عفو"
      maqayis_quote: "«الْعَيْنُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى تَرْكِ الشَّيْءِ... عَفَا: دَرَسَ، فَهُوَ مِنْ هَذَا; وَذَلِكَ أَنَّهُ شَيْءٌ يُتْرَكُ فَلَا يُتَعَهَّدُ وَلَا يُنْزَلُ، فَيَخْفَى عَلَى مُرُورِ الْأَيَّامِ.»"
  per_sense:
    - lemma: "تَقَادُمٌ"
      sense_id: "{auto}"
      nuance: "يركز على الجانب الزمني والقانوني والتقني للصيرورة قديماً."
      mwe: false
    - lemma: "اِنْدِثَارٌ"
      sense_id: "{auto}"
      nuance: "يركز على غياب المعالم والاختفاء التدريجي للشيء."
      mwe: false
    - lemma: "بِلًى"
      sense_id: "{auto}"
      nuance: "يركز على الجانب المادي وتآكل المادة بالاستعمال أو الزمن."
      mwe: false
    - lemma: "عَفَاءٌ"
      sense_id: "{auto}"
      nuance: "يركز على محو الأثر الكلي والزوال."
      mwe: false
    - lemma: "تَلَاشٍ"
      sense_id: "{auto}"
      nuance: "يركز على الاضمحلال المعنوي أو المادي التدريجي حتى العدم."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قدم","maqayis":"«الْقَافُ وَالدَّالُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَبْقٍ وَرَعْفٍ... الْقِدَمُ: خِلَافُ الْحُدُوثِ. وَيُقَالُ: شَيْءٌ قَدِيمٌ، إِذَا كَانَ زَمَانُهُ سَالِفًا.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دثر","maqayis":"«الدَّالُ وَالثَّاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ مُطَّرِدٌ... فَأَمَّا قَوْلُهُمْ رَسْمٌ دَاثِرٌ، فَهُوَ مِنْ هَذَا، وَذَلِكَ أَنَّهُ يَكُونُ ظَاهِرًا حَتَّى تَهُبَّ عَلَيْهِ الرِّيَاحُ... فَتُغَطِّيَهُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على الجانب الزمني والقانوني والتقني للصيرورة قديماً.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
