# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13602112-n (normality)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عيارية» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط لمفهوم كيميائي له مرادفات مصطلحية متعددة في المعاجم العربية"
      - "التعريف العربي ترجمة حرفية من الإنجليزية — يحتاج إعادة صياغة بأسلوب معجمي"
    observations: "المفهوم هو وحدة قياس تركيز المحاليل الكيميائية (normality)، وهو مصطلح تقني في الكيمياء التحليلية. المفهوم الفوقي هو «كمية نسبية» وهو صحيح. المصطلح الإنجليزي normality يُعبَّر عنه في المعاجم العربية بأكثر من لفظ: عيارية، نظامية، أساسية."
  blind_candidates:
    - lemma: "عِيَارِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «عِيَار» (ما تُقدَّر به الأشياء من كيل أو وزن)، على وزن فِعَالِيَّة. العيار في الكيمياء هو التقدير الكمّي، فالعيارية هي صفة التركيز المقدَّر بالمكافئات."
    - lemma: "نِظَامِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «نِظَام» (القاعدة أو المعيار)، يقابل normality من normal. مستعمل في المعاجم الصيدلانية والطبية."
    - lemma: "تَرْكِيز مُكَافِئِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يصف المفهوم بدقة: التركيز المعبَّر عنه بالمكافئات. لكنه وصف حرّ وليس مصطلحاً مسكوكاً."
    - lemma: "سَوِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «سَوِيّ» (طبيعي/معتدل)، يقابل normality. لكن الدلالة المعجمية الأصلية هي الاعتدال والعدل لا القياس الكيميائي."

stage2_evidence:
  per_lemma:
    - lemma: "عِيَارِيَّة"
      confirm:
        - text: "«أساسيّة، عيارية، نظامية» = normality (of solution)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«معاوقة عيارية» = normalized impedance"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«سماحية عيارية» = normalized admittance"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«إشارة عيارية» = normalized signal"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«(الْعيار) كل ما تقدر به الأشياء من كيل أو وزن وما اتخذ أساسا للمقارنة (مج)»"
          source: "المعجم الوسيط"
          addition: "الجذر عيار يدل على التقدير والمعايرة، مما يدعم اشتقاق عيارية للدلالة على مقدار التركيز"
        - text: "«عِيَار: حساب كمية مادة ما لازمة للتفاعل مع كمية معروفة من مادة أخرى» = titer"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "العيار في الصيدلة والكيمياء يدل على التقدير الكمّي للمواد المتفاعلة"

    - lemma: "نِظَامِيَّة"
      confirm:
        - text: "«نِظَامِيَّة» = normality"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«أساسيّة، عيارية، نظامية» = normality (of solution)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«مَحْلُولٌ نِظَامِيّ» = normal solution — «حالة محلول يكون فيه ما يعادل من الوزن المكافئ لمادة معينة في لتر»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مَحْلُولٌ نِظامِيّ» = normal solution"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«نِظامِيَّة» = normalcy (ليس normality الكيميائي)"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "في المعجم الطبي تُستخدم نظامية بمعنى الحالة الطبيعية (normalcy) وليس تركيز المحلول"

    - lemma: "تَرْكِيز مُكَافِئِيّ"
      evidence_status: "no_material_found"

    - lemma: "سَوِيَّة"
      contradicts:
        - text: "«(السوية) الاستواء والاعتدال والعدل والنصفة وكساء يحوى كالحلقة حول سنام البعير»"
          source: "المعجم الوسيط"
          conflict: "السوية في المعاجم العربية تدل على الاعتدال والعدل أو نوع من الأكسية، لا على مفهوم كيميائي"
      expands:
        - text: "«حالة (ال…) السوية» = normality"
          source: "مسرد علم الاجتماع والأنثروبولوجيا"
          addition: "تُستخدم في علم الاجتماع بمعنى الحالة الطبيعية، لكن كمركب وليس مفرداً للتركيز الكيميائي"

stage3_analysis:
  per_lemma:
    - lemma: "عِيَارِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مثبت في المعجم الموحد لمصطلحات الكيمياء (1992) كأحد ثلاثة مرادفات لـ normality (of solution). مشتق اشتقاقاً قياسياً من «عيار» بالمصدر الصناعي. العيار في المعجم الوسيط هو ما تُقدَّر به الأشياء، وهذا المعنى يتطابق مع مفهوم تقدير تركيز المحاليل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عِيَارِيَّة"

    - lemma: "نِظَامِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مثبت في المعجم الموحد لمصطلحات الكيمياء والصيدلة والمعجم الطبي كمقابل لـ normality. ورد مع عائلة مصطلحية كاملة: محلول نظامي، محلول نصف نظامي، محلول ضعف نظامي. الاشتقاق من «نظام» (القياس المعياري) على المصدر الصناعي قياسي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "نظامية مشتقة من «نظام» وتقابل normal مباشرة، وتشيع في المعاجم الطبية والصيدلانية أكثر من عيارية. أمّا عيارية فمشتقة من «عيار» (التقدير الكمّي) وتشيع في الكيمياء التحليلية."
      actions:
        - command: create_entry
          params: {lemma: "نِظَامِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَرْكِيز مُكَافِئِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ وليس مصطلحاً مسكوكاً. لم يرد في أي معجم مصطلحي كوحدة معجمية ثابتة. يفشل في اختبار السكّ: يمكن إبدال «مكافئي» بـ«معادِل» والعبارة تبقى وصفاً صالحاً."

    - lemma: "سَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "السوية في المعاجم العربية تدل على الاستواء والاعتدال والعدل، وليس لها استعمال كيميائي مثبت. استُخدمت في علم الاجتماع بمعنى normalcy (الحالة الطبيعية) لا normality (وحدة تركيز). نقلها إلى المجال الكيميائي يولّد لبساً مع دلالاتها المعجمية الأصلية."

stage4_content:
  definition:
    current: "(للمحاليل) التركيز معبراً عنه بمكافئات الجرام من المذاب لكل لتر"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية. يحتاج إعادة صياغة بأسلوب معجمي عربي مع توضيح الجنس القريب (وحدة قياس) والفصل النوعي (المكافئات الغرامية في اللتر)."
    authored:
      - type: terminological
        text: "وحدةُ قياسِ تركيزِ المحاليلِ، تُساوي عددَ المكافِئاتِ الغرامِيَّةِ مِنَ المُذابِ في لِتْرٍ واحدٍ مِنَ المحلولِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مقياسٌ لتركيزِ المحاليلِ الكيميائيَّةِ يُعبَّرُ عنهُ بعددِ الأوزانِ المكافِئةِ (المكافِئاتِ الغرامِيَّةِ) مِنَ المادَّةِ المُذابةِ في كلِّ لِتْرٍ مِنَ المحلولِ، ويُرمَزُ لَهُ بالحرفِ N. يُستخدَمُ خاصَّةً في الكيمياءِ التحليليَّةِ وتفاعُلاتِ الأكسدةِ والاختزالِ وتفاعُلاتِ الحَمضِ والقاعدةِ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "وحدةُ قياسِ تركيزِ المحاليلِ، تُساوي عددَ المكافِئاتِ الغرامِيَّةِ مِنَ المُذابِ في لِتْرٍ واحدٍ مِنَ المحلولِ."

  examples:
    per_lemma:
      - lemma: "عِيَارِيَّة"
        examples:
          - text: "تبلغُ عِيَارِيَّةُ محلولِ حَمضِ الهيدروكلوريكِ المستخدَمِ في التجربةِ 0.1 مكافِئٍ غرامِيٍّ لكلِّ لِتْرٍ."
            type: usage
      - lemma: "نِظَامِيَّة"
        examples:
          - text: "حُضِّرَ مَحلولٌ نِظامِيٌّ مِنْ هيدروكسيدِ الصوديوم بنِظَامِيَّةٍ قَدْرُها 0.5 لاستخدامِهِ في المعايَرةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تبلغُ عِيَارِيَّةُ محلولِ حَمضِ الهيدروكلوريكِ المستخدَمِ في التجربةِ 0.1 مكافِئٍ غرامِيٍّ لكلِّ لِتْرٍ."
      - command: add_sense_example
