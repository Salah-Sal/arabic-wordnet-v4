stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (سقالة) غير مشكولة."
      - "التعريف الحالي 'لراحة العمال' ترجمة حرفية قاصرة لـ convenience، فالغرض الأساسي هو التمكين من العمل في المرتفعات وليس مجرد الراحة."
    observations: "المصطلح 'سقالة' هو المعادل العربي القياسي لـ scaffold، وهو دخيل مستوعب (Loanword) من اللاتينية/الإيطالية. توجد تنويعات نطقية وكتابية في المعاجم العربية الحديثة مثل 'إسقالة' و'صقالة'."
  blind_candidates:
    - lemma: "سَقَّالَة"
      generation_method: taarib
      justification: "اللفظ العربي الشائع والمعتمد في المعاجم الحديثة للدلالة على هيكل البناء المؤقت."
    - lemma: "صِقَالَة"
      generation_method: ishtiqaq
      justification: "تنويع صوتي للفظ 'سقالة' يربطه بجذر عربي (صقل) لمحاولة تأصيله."
    - lemma: "مِنَصَّةُ عَمَل"
      generation_method: tarkib
      justification: "تعبير وصفي دقيق للمكان المرتفع الذي يقف عليه العامل."
    - lemma: "شِدَّة"
      generation_method: majaz
      justification: "مصطلح دارج في بيئة البناء والتشييد للهياكل المؤقتة."

stage2_evidence:
  per_lemma:
    - lemma: "سقالة"
      confirm:
        - text: "«ما يُرْبَطُ مِنَ الأخشاب والِحبال ليتوصلَ بِهَا إلى المَحَالِّ المرتفعة»"
          source: "المعجم الكبير"
        - text: "«وهي ما يربطه المهندسون من الأخشاب والحبال ليتوصلوا به إلى الأمكنة المرتفعة -عامية إيطاليه»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
    - lemma: "صِقَالَة"
      confirm:
        - text: "«ما يربِطُه البنَّاءون من الأخشاب ونحوها ليتوصَّلوا إلى الأماكن المرتفعة من البناء»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«صِقَالة البناء: الأخشاب التي يقف عليها عند البناء (محيط المحيط)»"
          source: "تكملة المعاجم العربية (دوزي)"
    - lemma: "إِسْقَالَة"
      confirm:
        - text: "«ما يربطه المهندسون من الأخشاب والحبال، ليصلوا بها إلى المحال المرتفعة»"
          source: "المعجم الوسيط"
        - text: "«ألواحٌ خشبيّة أو معدنيّة تعلَّق بطريقة تمكِّن العمّال من الوصول إلى الأماكن المرتفعة»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "سقالة"
      decision: confirmed
      decision_reason: "اللفظ الأصلي في المجموعة وهو صحيح تماماً، يحتاج فقط للتشكيل وإضافة صيغ بديلة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الأكثر ذيوعاً واستخداماً في الواقع العملي والمهني."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَقَّالَة"
        - command: add_form
          params:
            entry_id: "{auto}"
            text: "سِقَالَة"
    - lemma: "إِسْقَالَة"
      source: stage1
      decision: confirmed
      decision_reason: "مدخل معجمي معتمد في المعجم الوسيط ومعاجم أخرى كصيغة فصيحة للمصطلح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة المعيارية التي تفضلها المعاجم الرسمية الحديثة (مثل الوسيط)."
      actions:
        - command: create_entry
          params:
            lemma: "إِسْقَالَة"
            pos: "n"
        - command: add_sense
          params:
            synset_id: "awn4-04148488-n"
            entry_id: "{auto}"
    - lemma: "صِقَالَة"
      source: stage1
      decision: confirmed
      decision_reason: "تنويع كتابي وصوتي موجود في المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تنويع يميل إلى محاكاة بنية الكلمات العربية عبر ربط اللفظ بجذر (صقل)."
      actions:
        - command: create_entry
          params:
            lemma: "صِقَالَة"
            pos: "n"
        - command: add_sense
          params:
            synset_id: "awn4-04148488-n"
            entry_id: "{auto}"

stage4_content:
  per_lemma:
    - lemma: "سَقَّالَة"
      usage_example:
        text: "صعد العمال على السقالة للبدء في ترميم واجهة المسجد."
        type: usage
    - lemma: "إِسْقَالَة"
      usage_example:
        text: "تعد الإسقالة من أدوات السلامة الضرورية في مواقع الإنشاءات."
        type: usage
    - lemma: "صِقَالَة"
      usage_example:
        text: "استخدم البناؤون صقالة متينة للوصول إلى قمة المئذنة."
        type: usage
  synset_content:
    definition_ar:
      decision: revise
      revised_definition: "هَيْكَلٌ مُؤَقَّتٌ مِنَ الأَخْشَابِ أَوِ المَعَادِنِ يُنْصَبُ حَوْلَ المَبَانِي لِيَتَمَكَّنَ العُمَّالُ مِنَ الوُصُولِ إِلَى الأَمَاكِنِ المُرْتَفِعَةِ لِأَغْرَاضِ البِنَاءِ أَوِ التَّرْمِيمِ."
      type: terminological
      quality_check:
        is_concise: true
        has_genus: true
        has_differentia: true
        no_circularity: true

