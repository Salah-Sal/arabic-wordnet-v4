stage4_content:
  definition:
    current: "مصفوفة غير قابلة للذوبان عادة ما تكون على شكل خرزات صغيرة (قطرها 0.5-1 مم) مصنوعة من ركيزة بوليمر عضوية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يصف الشكل والتركيب ولكنه يغفل الوظيفة الأساسية وهي التبادل الأيوني."
    authored:
      - type: terminological
        text: "مصفوفة بوليمرية عضوية غير قابلة للذوبان، تكون عادة على هيئة حبيبات أو خرزات دقيقة، تعمل كوسيط لتبادل الأيونات بين صلب وسائل، وتستخدم على نطاق واسع في تنقية المياه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-92426111-n"
          definition_index: 0
          text: "مصفوفة بوليمرية عضوية غير قابلة للذوبان، تكون عادة على هيئة حبيبات أو خرزات دقيقة، تعمل كوسيط لتبادل الأيونات بين صلب وسائل، وتستخدم على نطاق واسع في تنقية المياه."
  examples:
    per_lemma:
      - lemma: "رَاتِنْج التَّبَادُل الأَيُونِيّ"
        examples:
          - text: "يُستخدم راتنج التبادل الأيوني في محطات تحلية المياه لإزالة الأملاح والمعادن غير المرغوب فيها."
            type: usage
      - lemma: "مُبَادِل أَيُونِيّ"
        examples:
          - text: "يعمل المبادل الأيوني على استبدال أيونات الكالسيوم والمغنيسيوم بأيونات الصوديوم لتقليل عسر الماء."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُستخدم راتنج التبادل الأيوني في محطات تحلية المياه لإزالة الأملاح والمعادن غير المرغوب فيها."

