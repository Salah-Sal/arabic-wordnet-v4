stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية دقيقة علمياً، ولكن يمكن إثراء المجموعة بمصطلحات وظيفية مرادفة مثل 'المبادل الأيوني'."
    observations: "المصطلحات المستخدمة تعتمد على الاقتراض المفهومي (راتنج، بوليمر) وهي مستقرة في المعاجم العلمية المتخصصة. التعريف الحالي دقيق جداً ويستخدم لغة تقنية متقدمة (مصفوفة، ركيزة)."
  blind_candidates:
    - lemma: "مُبَادِل أَيُونِيّ"
      generation_method: ishtiqaq
      justification: "الاسم الوظيفي للمادة، حيث يعمل كوسط لتبادل الأيونات، وهو شائع جداً في الكيمياء والهندسة."
    - lemma: "رَاتِين مُبَادِل"
      generation_method: taarib
      justification: "صيغة 'راتين' (Resin) مستخدمة في بعض المعاجم الطبية والعلمية كبديل لـ 'راتنج'."
    - lemma: "بُولِيمر تَبَادُلِيّ"
      generation_method: tarkib
      justification: "تعبير وصفي يركز على الطبيعة البوليمرية للمادة ووظيفتها التبادلية."
    - lemma: "مُبَلْمَر تَبَادُل أَيُونِيّ"
      generation_method: ishtiqaq
      justification: "استخدام 'مبلمر' كمرادف عربي لـ 'بوليمر' وفقاً للمجامع اللغوية."

stage2_evidence:
  per_lemma:
    - lemma: "رَاتِنْج التَّبَادُل الأَيُونِيّ"
      confirm:
        - text: "راتنج التبادل الأيوني أو مبلمرات التبادل الأيوني هي تراكيب غير ذائبة توجد عادة في شكل خرزات أو حبيبات صغيرة (بقطر 1-2 ملم)... ومكونة من مبلمرات عضوية."
          source: "المعجم الموحد لمصطلحات المياه (2000)"
    - lemma: "بُولِيمر التَّبَادُل الأَيُونِيّ"
      confirm:
        - text: "راتنج التبادل الأيوني أو مبلمرات التبادل الأيوني هي تراكيب غير ذائبة..."
          source: "المعجم الموحد لمصطلحات المياه (2000)"
    - lemma: "مُبَادِل أَيُونِيّ"
      confirm:
        - text: "مُبادِلُ الأَيونات (ion exchanger)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "المواد التي تقوم باستبدال الأيونات المتواجدة في محلول بأيونات أخرى لها شحنة كهربائية مساوية."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "رَاتِين مُبَادِل"
      confirm:
        - text: "راتينٌ مُبادِلٌ للأَنيوناتِ (anion-exchange resin)"
          source: "المعجم الطبي الموحد (2009)"

