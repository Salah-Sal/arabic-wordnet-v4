      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"وضع","maqayis":"«الْوَاوُ وَالضَّادُ وَالْعَيْنُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْخَفْضِ لِلشَّيْءِ وَحَطِّهِ»"}'

    # ── معنى وَضْع ──
