# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-13943462-n  |  ILI: i110108  |  POS: n
# Definition (EN): a mode of being or form of existence of a person or thing
# Reviewed: 2026-03-17
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # ١-أ: توليد المرشّحات (بناءً على الملف المُقنَّع فقط)
  # التعريف المرئي: "طريقة وجود أو شكل وجود شخص أو شيء"
  # المستوى الأعلى: "الكيفيّة التي يكون عليها الشيء من حيث صفاته الرئيسيّة"
  blind_candidates:
    - lemma: "كَيْنُونَة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن فَيْعُولَة من جذر (ك-و-ن)؛ يُعبّر مباشرةً عن "طريقة الكون والوجود".
        اللفظ مأثور في المعجم العربي الكلاسيكي ("كان كينونةً") وفي كشف الصحاح وابن سيده؛
        ويُحيل إلى المعنى الوجودي الدقيق المطلوب.

    - lemma: "هَيْئَة"
      generation_method: majaz
      justification: >
        إحياء للدلالة الكلاسيكية الراسخة: أصل الكلمة "الشكل والمنظر"، ثم اتّسعت دلالتها
        بمجاز بليغ إلى "الحال التي يكون عليها الشيء محسوسةً أو معقولة" — وهو تحديداً
        معنى "طريقة وجود الشيء". ورد في القاموس المحيط: «حالُ الشَّيءِ وكَيْفِيَّتُه».

    - lemma: "طَوْر"
      generation_method: majaz
      justification: >
        اللفظ العربي القديم بمعناه التراثي "الحال والهيئة" (ورد في لسان العرب والمعجم الكبير:
        "الحالُ والهيئَةُ"). القرآن الكريم: «وَقَدْ خَلَقَكُمْ أَطْوَاراً» أي أحوالاً وهيئات.
        وهو إحياء للمعنى القديم مقابل المعنى التقني المعاصر (مرحلة).

    - lemma: "قِوَام"
      generation_method: ishtiqaq
      justification: >
        من جذر (ق-و-م) على وزن فِعَال؛ "قِوام كل شيء: عماده ونظامه" — يُشير إلى
        التركيب الوجودي والبنية التي يقوم عليها الشيء، مما يجعله مرشّحاً لمعنى
        "طريقة القيام في الوجود".

  # ١-ب: التقييم الأولي بعد الاطّلاع على البيانات الكاملة
  assessment:
    concerns:
      - "اللمّتان (حالة، وضع) مكتوبتان دون تشكيل — يجب توفير الضبط الكامل"
      - "التعريف العربي فيه تكرار لكلمة (وجود) مرتين ويبدو ترجمةً حرفية للإنجليزية"
      - "غياب لمّة (هيئة) رغم أنها الأكثر دلالةً على المفهوم في المعجمية الكلاسيكية"
      - "التمييز الدلالي بين (حالة) و(وضع) غير موثَّق في بيانات المجموعة"
    observations: >
      المجموعة تمثّل مفهوم "طريقة وجود الشيء أو الشخص" وهو مفهوم أصيل في العربية
      تُعبّر عنه ألفاظ كثيرة. اللمّتان الموجودتان (حالة، وضع) فصيحتان ومعجميّتان
      ومستعملتان في التراث والمعاصرة، غير أن بينهما فروقاً دلالية دقيقة:
      فـ(الحالة) تُشير عادةً إلى اللحظة الراهنة أو المتغيّرة، بينما (الوضع) يُفيد
      الترتيبَ والهيئةَ الخارجيّة وكثيراً ما يحمل بُعداً اجتماعياً أو سياسياً.
      لمّة (هيئة) أجدر بالإدراج لأنها أدقّ تمثيلاً للمفهوم الفلسفي "شكل الوجود".
      أما (طور) فهو فصيح كلاسيكياً لكنّ معناه التقني المعاصر (مرحلة/phase) يُفضي
      إلى لبس. و(كينونة) تُحيل إلى الوجود ذاته لا إلى "طريقة الوجود".


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:

  # ── الاستعلامات المُنفَّذة ──
  # Q1: مطابقة دفعية لجميع اللمّات (الموجودة + المرشّحات) — 120 صفًّا
  #   headword_norm IN ('حالة','الحالة','وضع','الوضع','كينونة','الكينونة',
  #                     'هيئة','الهيئة','طور','الطور','قوام','القوام')
  # Q2: إثراء دفعي (تعريفات + أمثلة + جموع) لـ entry_ids الرئيسية
  #   entry_id IN (6668, 79930, 33302, 32144, 17755, 62264, 24400, 870862)
  # Q3: مقاييس اللغة لجذور: حول، وضع، هيا، طور، قوم، كون
  #   dictionary_id = 151 AND headword_norm IN (...)
  # Q4: جسر إنجليزي للمصطلحات: condition, state, mode of being, form of existence
  # Q5: بحث FTS للكلمات المفتاحية: طريقة الوجود، شكل الوجود، كينونة، نمط الوجود

  per_lemma:

    # ── حالة ──────────────────────────────────────────────────
    - lemma: "حالة"
      confirm:
        - text: "«واحِدَةُ أحوالِ الشَّيءِ»"
          source: "المعجم الكبير (entry 79930)"
        - text: "«الحال»"
          source: "المعجم الوسيط (entry 6668) — الحالة واحدة الحال"
        - text: "«(الْحَالة) الْحَال»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry 870862)"
        - text: "حَالَة — en: state | domain: Chemistry / Physics / Geology / Linguistics"
          source: "معاجم أراب‌تيرم المتعددة (entries 429019, 424468, 433437, 498873)"
        - text: "حَالَة — en: status | domain: Sociology / Water Engineering / IT"
          source: "معاجم أراب‌تيرم (entries 399780, 394722, 529335)"
      expands:
        - text: "«يوجد تماثل بين الحالة والاستمرار، فالاستمرار كفضاءُ حالاتٍ»"
          source: "المعجم الموحد لمصطلحات اللسانيات (entry 498873)"
          addition: "يُثبت استعمال (حالة) في السياق اللساني المعاصر بدلالة طريقة الوجود"
        - text: "«وُضِعَ مُحدَّد فيزيائياً لنظامٍ ما، يتضمّن المعلومات اللازمة»"
          source: "معجم مصطلحات الطاقة المتجددة — حالة (entry 379806)"
          addition: "يُظهر أن (حالة) تُستعمل للتعبير عن الهيئة الكاملة لنظام في لحظة معيّنة"

    # ── وضع ──────────────────────────────────────────────────
    - lemma: "وضع"
      confirm:
        - text: "«هيئة الشيء التى يكون عليها»"
          source: "المعجم الوسيط (entry 33302، def 2)"
        - text: "«الوَضْعُ: هَيْئَة تحصل للجسم بِسَبَب نِسْبَة بعض أَجْزَائِهِ، وَإِلَى الْأُمُور الخارجية»"
          source: "معجم مقاليد العلوم للسيوطي (entry 807823)"
        - text: "«وهيئة الشَّيْء الَّتِي يكون عَلَيْهَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry 887610)"
        - text: "وَضْعٌ — en: attitude; posture; pose; position; status; situation"
          source: "معاجم أراب‌تيرم (entries 394981, 395953, 486520, 498654, 646277)"
      contradicts:
        - text: "«الوَضْعُ: تَخْصِيص شَيْء بآخر ليفهم الثَّانِي عِنْد إِطْلَاق الأول»"
          source: "معجم مقاليد العلوم للسيوطي (entry 807821)"
          conflict: "هذا المعنى اصطلاحي منطقي/أصولي (وضع اللفظ للمعنى) لا علاقة له بدلالة المجموعة"
        - text: "«الوَضْعُ: كَون الشَّيْء مشارا إِلَيْهِ إِشَارَة حسية»"
          source: "معجم مقاليد العلوم للسيوطي (entry 807820)"
          conflict: "تعريف منطقي يختص بالإشارة الحسية، يتعارض مع المعنى الوجودي العام للمجموعة"

    # ── كَيْنُونَة (مرشّح المرحلة ١) ────────────────────────
    - lemma: "كَيْنُونَة"
      expands:
        - text: "«كينونة؛ وجود» — translation of 'being' / 'existence'"
          source: "المورد الحديث (entry 686974)"
          addition: "يُثبت أن (كينونة) تعني الوجود بمعناه الأشمل في المعجم المعاصر"
        - text: "«كَينونَةٌ مَرَضِيَّة» — مصطلح طبي"
          source: "المعجم الطبي الموحد (entry 573846)"
          addition: "يُظهر استعمال (كينونة) في التركيب المصطلحي لا كمصطلح مستقل بدلالة المجموعة"
        - text: "«كانَ يَكُون، كَوْنًا وكِيانًا وكَيْنُونَةً»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (entry 860816)"
          addition: "يكشف أن (كينونة) مصدر فعل (كان) الناقص، يُفيد الكون المطلق لا طريقةَ الوجود"

    # ── هَيْئَة (مرشّح المرحلة ١) ───────────────────────────
    - lemma: "هَيْئَة"
      confirm:
        - text: "«الحال التى يكون عليها الشىءُ محسوسةً كانت أو معقولة»"
          source: "المعجم الوسيط (entry 32144، def 0)"
        - text: "«حالُ الشَّيءِ، وكَيْفِيَّتُه»"
          source: "القاموس المحيط للفيروزآبادي (entry 802112)"
        - text: "«الهيئة: الحالة الظاهرة»"
          source: "التوقيف على مهمات التعاريف للمناوي (entry 815364)"
        - text: "«الهيئة: هي صورة الشيء وشكله وحالته»"
          source: "كشّاف اصطلاحات الفنون للتهانوي (entry 821129)"
        - text: "«(الْهَيْئَة) الْحَال الَّتِي يكون عَلَيْهَا الشَّيْء محسوسة كَانَت أَو معقولة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry 887049)"
        - text: "«الهَيْئَة: بالفتح وتُكْسَرُ هي الحالةُ الظاهرةُ للمتهيئ للشيء»"
          source: "التعريفات الفقهية للبركتي (entry 836274)"
        - text: "هَيْئَة — en: habit; configuration; shape; conformation"
          source: "معاجم أراب‌تيرم (entries 454329, 430377, 369496, 468915)"

    # ── طَوْر (مرشّح المرحلة ١) ──────────────────────────────
    - lemma: "طَوْر"
      confirm:
        - text: "«الحالُ والهيئَةُ»"
          source: "المعجم الكبير (entry 62264، def 0)"
        - text: "«والصنف وَالنَّوْع وَالْحَال والهيئة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry 877468)"
        - text: "«الأَطْوَار: الحالاَتُ المُخْتَلِفة والتَّارَات»"
          source: "النهاية في غريب الحديث لابن الأثير (entry 780958)"
        - text: "«الطور: الحال، والطور المرة»"
          source: "تحفة الأريب بما في القرآن للغرناطي (entry 790843)"
        - text: "«الطَّوْرُ الحالُ والهيئَةُ»"
          source: "المصباح المنير للفيّومي (entry 792976)"
      contradicts:
        - text: "طَوْر — en: phase | domain: Chemistry / Physics / Geology / IT / Engineering"
          source: "معاجم أراب‌تيرم (entries 428574, 423187, 432572, 528839, 377994, 507156, 437438)"
          conflict: "التخصيص التقني الحديث لـ(طور) = phase/مرحلة في العلوم يتعارض مع دلالة المجموعة الوجودية"

    # ── قِوَام (مرشّح المرحلة ١) ──────────────────────────────
    - lemma: "قِوَام"
      contradicts:
        - text: "«قِوام كل شىء: عماده ونظامه»"
          source: "المعجم الوسيط (entry 24400، def 0)"
          conflict: "قِوام يعني العماد والنظام الذي يقوم عليه الشيء، لا طريقة وجوده أو هيئته"
        - text: "«لما يقوم به الشيء أي يثبت كالعماد والسناد»"
          source: "التوقيف على مهمات التعاريف للمناوي (entry 814751)"
          conflict: "يُفيد معنى الدعامة والسند لا معنى الحالة أو طريقة الوجود"
        - text: "«قِوام الأمر: ما يقوم به»"
          source: "المعجم الوسيط (entry 24400، def 2)"
          conflict: "قِوام الأمر = ما يستند إليه الأمر في ثباته، وهو معنى مغاير لمعنى المجموعة"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:

    # ══ حالة (لمّة موجودة) ═══════════════════════════════════
    - lemma: "حالة"
      decision: confirmed
      decision_reason: >
        اللمّة فصيحة راسخة في المعجمية العربية الكلاسيكية والمعاصرة؛ "واحدة أحوال الشيء"
        تُطابق تماماً معنى "طريقة وجود شخص أو شيء". موثّقة في المعجم الوسيط والكبير
        وعشرات المعاجم التقنية. تحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُشير إلى اللحظة الراهنة أو المتغيّرة من وجود الشيء؛ وكثيراً ما تُستعمل مع
        ظروف الزمان للتعبير عن الحالة في لحظة بعينها (حالة صحيّة، حالة طارئة).
        أقلّ ارتباطاً بالترتيب الخارجي من (وضع)، وأقلّ ارتباطاً بالصورة المرئية من (هيئة).
      quality_gate:
        ittiraad: true
        yusr: true
        mulaama: true
        turathi: true
        arabi: true
        ishtiqaqiyya: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالَة"

    # ══ وضع (لمّة موجودة) ════════════════════════════════════
    - lemma: "وضع"
      decision: confirmed
      decision_reason: >
        اللمّة مؤيَّدة من مصادر متعددة بمعنى "هيئة الشيء التي يكون عليها"، مما يُطابق
        دلالة المجموعة. المعاني الأصولية (وضع اللفظ للمعنى) مقيّدة بالسياق ولا تُلغي
        المعنى الوجودي الراسخ. تحتاج إضافة التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الهيئة والترتيب الخارجي للشيء، ويحمل كثيراً معنى الموقف الاجتماعي
        أو السياسي (وضع البلاد، وضع المرأة). أعمّ من (حالة) في الدلالة الزمنية،
        وأقل ارتباطاً بالصورة المحسوسة من (هيئة).
      quality_gate:
        ittiraad: true
        yusr: true
        mulaama: true
        turathi: true
        arabi: true
        ishtiqaqiyya: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَضْع"

    # ══ كَيْنُونَة (مرشّح المرحلة ١) ════════════════════════
    - lemma: "كَيْنُونَة"
      source: stage1
      decision: removed
      decision_reason: >
        كينونة تُحيل إلى الوجود ذاته بمعناه الأنطولوجي المطلق (being/existence) لا إلى
        "طريقة الوجود". الأدلة تُظهر استعمالها مصدراً لفعل (كان) الناقص ("كوناً وكيانًا
        وكينونةً")، مما يعني أنها مرادفة لـ(وجود) و(كَوْن) لا لـ(حالة) أو (هيئة).
        إدراجها سيُدخل اللبس بين المجموعة الراهنة ومجموعة الوجود المطلق.
      evidence_assessment:
        case: no_material

    # ══ هَيْئَة (مرشّح المرحلة ١) ══════════════════════════
    - lemma: "هَيْئَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        أدلة معجمية ساحقة تُؤكّد أن (هيئة) = "الحال التي يكون عليها الشيء محسوسةً
        أو معقولة" — وهو تعريف يُطابق تعريف المجموعة. ورد في القاموس المحيط:
        "حال الشيء وكيفيّته"، وفي التوقيف: "الحالة الظاهرة". اللفظ فصيح عالي الرتبة
        في التراث والمعجمية، ويُحقّق مبدأ التمييز الدلالي مع اللمّتين الموجودتين.
        مستعمل في المعجم الطبي والبيولوجي والجيولوجي المعاصر.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على الصورة المحسوسة أو المعقولة للشيء كما تظهر للناظر أو المُدرِك؛
        أكثر ارتباطاً بالمظهر والشكل الخارجي. تُستعمل في الغالب لوصف ما يبدو عليه
        الشيء دفعةً واحدة، بخلاف (حالة) التي تُشير إلى الحالة الآنية، و(وضع) الذي
        يُشير إلى الترتيب والموقع.
      quality_gate:
        ittiraad: true
        yusr: true
        mulaama: true
        turathi: true
        arabi: true
        ishtiqaqiyya: true
      actions:
        - command: create_entry
          params:
            lemma: "هَيْئَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13943462-n"

    # ══ طَوْر (مرشّح المرحلة ١) ════════════════════════════
    - lemma: "طَوْر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن (طور) يحمل المعنى المطلوب كلاسيكياً ("الحال والهيئة")، فإن معناه
        التقني المعاصر المستقرّ (phase = مرحلة/طور في العلوم) يجعل إدراجه مضلِّلاً.
        يُفضّل مبدأ اليُسر والملاءمة إقصاءه لتجنّب الالتباس مع المجموعات الترادفية
        الخاصة بمفهوم "المرحلة" في الكيمياء والفيزياء واللسانيات.
      evidence_assessment:
        case: mixed

    # ══ قِوَام (مرشّح المرحلة ١) ════════════════════════════
    - lemma: "قِوَام"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن قِوام = "عماد الشيء ونظامه، ما يقوم به الشيء ويثبت".
        وهو معنى الدعامة والسند لا معنى "طريقة الوجود". لا يصلح للمجموعة الراهنة.
      evidence_assessment:
        case: contradicts_only


