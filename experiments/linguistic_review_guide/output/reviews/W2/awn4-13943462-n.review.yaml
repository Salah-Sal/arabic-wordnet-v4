      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حول","maqayis":"«الْحَاءُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ تَحَرُّكٌ فِي دَوْرٍ»"}'

    # ── معنى حَالَة ──
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُشير إلى اللحظة الراهنة أو المتغيّرة من وجود الشيء؛ تُستعمل كثيراً مع ظروف الزمان","mwe":false}'

    # ── مدخل وَضْع ──
