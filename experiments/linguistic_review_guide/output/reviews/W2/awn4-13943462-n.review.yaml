# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
stage5_enrichment:
  # اللمّات المؤكَّدة: حَالَة | وَضْع | هَيْئَة

  per_entry:
    - lemma: "حَالَة"
      entry_id: "{auto}"
      root: "حول"
      maqayis_quote: >
        «الْحَاءُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ تَحَرُّكٌ فِي دَوْرٍ.
        فَالْحَوْلُ الْعَامُ، وَذَلِكَ أَنَّهُ يَحُولُ، أَيْ يَدُورُ»

    - lemma: "وَضْع"
      entry_id: "{auto}"
      root: "وضع"
      maqayis_quote: >
        «الْوَاوُ وَالضَّادُ وَالْعَيْنُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْخَفْضِ
        لِلشَّيْءِ وَحَطِّهِ. وَوَضَعْتُهُ بِالْأَرْضِ وَضْعًا»

    - lemma: "هَيْئَة"
      entry_id: "{auto}"
      root: "هيأ"
      # ملاحظة: مقاييس اللغة لابن فارس يُدرج هيأ تحت "هيا" ويجعل الهاء زائدة،
      # وهو غير مفيد دلالياً — يُستعاض عنه بالتعريف الأوّلي من القاموس المحيط:
      maqayis_quote: >
        «حالُ الشَّيءِ، وكَيْفِيَّتُه» [القاموس المحيط للفيروزآبادي]

  per_sense:
    - lemma: "حَالَة"
      sense_id: "{auto}"
      nuance: >
        تُشير إلى اللحظة الراهنة أو المتغيّرة من وجود الشيء؛ تُستعمل كثيراً مع ظروف
        الزمان للدلالة على الحالة في لحظة بعينها. أقلّ ارتباطاً بالترتيب الخارجي
        من (وضع)، وأقلّ ارتباطاً بالصورة المرئية من (هيئة).

    - lemma: "وَضْع"
      sense_id: "{auto}"
      nuance: >
        يُركّز على الهيئة والترتيب الخارجي والموقع؛ يحمل أحياناً بُعداً اجتماعياً
        أو سياسياً (وضع البلاد، وضع المرأة). أعمّ من (حالة) في دلالته الزمنية،
        وأقلّ ارتباطاً بالصورة المحسوسة من (هيئة).

    - lemma: "هَيْئَة"
      sense_id: "{auto}"
      nuance: >
        تُركّز على الصورة المحسوسة أو المعقولة للشيء كما تظهر للناظر أو المُدرِك؛
        أكثر ارتباطاً بالمظهر والشكل الخارجي. تُستعمل في الغالب لوصف ما يبدو
        عليه الشيء دفعةً واحدة في لحظة الرؤية.

  synset:
    cultural_fit: native
    # المفهوم له تعبيرات عربية طبيعية راسخة؛ حالة/وضع/هيئة كلّها من صميم اللغة

