# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13786353-n
# top-up: an amount needed to restore something to its former level
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«استكمال» مصدر يدل على الحدث لا على الكمّيّة، والمعنى التقنيّ السائد له هو الاستكمال الرياضيّ (interpolation/extrapolation)"
      - "«تعبئة تكميلية» عبارة وصفية حرّة لا مصطلح مسكوك؛ يمكن إبدال «تكميلية» بـ«إضافية» فيبقى المعنى — تفشل في اختبار السكّ"
      - "التعريف العربيّ يصف كمّيّة لكنّ اللمّتين الموجودتين تدلاّن على فعل (الاستكمال) أو عمليّة (التعبئة) لا على مقدار"
    observations: >
      المفهوم يدور حول كمّيّة تكميلية تُعيد الشيء إلى مستواه الأصليّ، كتكملة رصيد أو تكملة وقود.
      الجذر «كمل» هو الأنسب دلاليًّا لأنّ مدار المعنى على إتمام النقص.
      المعجم الوسيط يُعرِّف «التكملة» بأنّها «ما يتمّ به الشيء» وهذا أدقّ من «استكمال» المصدريّ.

  blind_candidates:
    - lemma: "تَكْمِلَة"
      generation_method: ishtiqaq
      justification: "من الجذر ك-م-ل على وزن تَفْعِلَة الذي يدلّ على ما يُفعَل به الفعل. المعجم الوسيط يُعرّفها بـ«ما يتمّ به الشيء» فهي تدلّ على المقدار المُكمِّل لا على الحدث"
    - lemma: "تَتِمَّة"
      generation_method: ishtiqaq
      justification: "من الجذر ت-م-م، المعجم الوسيط يعرّفها بـ«ما يكون به تمام الشيء»؛ قريبة من المفهوم لكنّها تميل إلى معنى البقيّة أو الذيل"
    - lemma: "إِكْمَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعيّ من إكمال بإضافة ياء النسبة وتاء التأنيث، للدلالة على الكمّيّة ذات صفة الإكمال"
    - lemma: "رَدِيفَة"
      generation_method: ishtiqaq
      justification: "من الجذر ر-د-ف على وزن فَعِيلَة، بمعنى ما يُرْدَف ويُضاف لسدّ نقص؛ لكنّ الدلالة الشائعة على العجز والتابع تُبعده"


stage2_evidence:
  per_lemma:
    - lemma: "اِسْتِكْمَال"
      confirm:
        - text: "«مضخة الاستكمال» = topping-up pump"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
      contradicts:
        - text: "«استكمال» = interpolation: تعديل ما بين حدّين"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "المعنى التقنيّ السائد هو الاستكمال الرياضيّ لا التكميل الكمّيّ"
        - text: "«استكمال» = extrapolation: تقدير قيمة متغيّر في نقطة خارج مجال القيم التجريبية"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          conflict: "معنى رياضيّ آخر بعيد عن التكميل الكمّيّ"
      expands:
        - text: "«طلب استكمال احتياطي رأس المال» = margin call"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يدلّ على أنّ «استكمال» يُستعمل بمعنى تكملة النقص في السياق الماليّ"

    - lemma: "تَعْبِئَة تَكْمِيلِيَّة"
      contradicts:
        - text: "«التعبئة» تهيئة موارد الدولة وإعدادها عند الحرب"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجميّ الأساسيّ للتعبئة هو التجهيز والتهيئة لا الملء الكمّيّ"
        - text: "«تَعْبِئَة» = packaging: كلّ العمليات التي يخضع لها المنتج حتى يصبح منتجًا نهائيًّا"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "التعبئة بمعنى التغليف لا التكميل"
        - text: "«تَعْبِئَة» = filling: وضع المادة الغذائية داخل عبوة"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "الملء الأوّليّ لا إعادة الملء لمستوى سابق"

    - lemma: "تَكْمِلَة"
      confirm:
        - text: "«التكملة» ما يتمّ به الشيء"
          source: "المعجم الوسيط"
        - text: "«تكملة» = supplement"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm)"
      expands:
        - text: "«تكملة» = complement: سلعة ينخفض الطلب عليها عندما يرتفع سعر سلعة مرتبطة بها"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: "معنى اقتصاديّ مغاير (المكمّل السلعيّ) لكنّ الأصل اللغويّ واحد"

    - lemma: "تَتِمَّة"
      confirm:
        - text: "«التَّتِمَّة» ما يكون به تمام الشيء"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«تتمّة» = sequel"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          conflict: "الدلالة الغالبة على التتمّة هي «البقيّة/الذيل» لا «الكمّيّة المُكمِّلة»"
        - text: "«تتمّة» = complement (بروتين إنزيمي)"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          conflict: "مصطلح طبّيّ مستقرّ قد يُوقع في اشتراك لفظيّ"

    - lemma: "إِكْمَالِيَّة"
      evidence_status: "no_material_found"

    - lemma: "رَدِيفَة"
      contradicts:
        - text: "«رِدْفَة» يحتمل أن يكون من الرِّدْف وهو العَجُز"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "الدلالة على العجز والتبعيّة لا على التكميل الكمّيّ"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١ ──
    - lemma: "اِسْتِكْمَال"
      decision: confirmed
      decision_reason: >
        رغم أنّ المعنى التقنيّ السائد هو الاستكمال الرياضيّ (interpolation)،
        فإنّ استعمال «مضخة الاستكمال» بمعنى topping-up pump
        و«طلب استكمال احتياطي رأس المال» بمعنى margin call يؤكّدان استعمال اللفظ
        بمعنى تكميل النقص وإعادة المستوى. يبقى المصدر مقبولاً مجازًا للدلالة على الكمّيّة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصدر يدلّ على عمليّة التكميل ذاتها، يُستعمل في السياق التقنيّ والماليّ، وقد يدلّ بالمجاز على الكمّيّة المطلوبة لتلك العمليّة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِكْمَال"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "تَعْبِئَة تَكْمِيلِيَّة"
      decision: removed
      decision_reason: >
        عبارة وصفية حرّة تفشل في اختبار السكّ: يمكن إبدال «تكميلية» بـ«إضافية» أو «ثانوية»
        فيبقى المعنى. كما أنّ «التعبئة» في المعاجم تدلّ على التغليف أو التجهيز العسكريّ
        لا على إعادة الملء إلى مستوى سابق. ليست وحدة معجمية ثابتة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: تَكْمِلَة ──
    - lemma: "تَكْمِلَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المعجم الوسيط يعرّفها بـ«ما يتمّ به الشيء» وهذا مطابق لمفهوم الكمّيّة المطلوبة
        لإعادة الشيء إلى مستواه. وزن تَفْعِلَة يدلّ على ما يُفعَل به الفعل (أي ما يُكمَل به)
        فهي أدقّ من المصدر «استكمال». مُسجّلة في ArabTerm بمعنى supplement.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على المقدار أو الشيء الذي يُكمَل به النقص مباشرةً — اسم ما يُفعَل به لا اسم الفعل"
      actions:
        - command: create_entry
          params: {lemma: "تَكْمِلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    # ── مرشح المرحلة ١: تَتِمَّة ──
    - lemma: "تَتِمَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم تعريف المعجم الوسيط «ما يكون به تمام الشيء»، فإنّ الاستعمال الغالب
        لـ«تتمّة» هو بمعنى «البقيّة/الذيل» (sequel) أو المتمّم المناعيّ (complement) في الطبّ.
        إضافتها ستُوقع في اشتراك لفظيّ ولا تضيف فارقًا دلاليًّا واضحًا عن «تكملة».
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: إِكْمَالِيَّة ──
    - lemma: "إِكْمَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أيّ شواهد معجمية. المصدر الصناعيّ غير مسجّل ولا مستعمل.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: رَدِيفَة ──
    - lemma: "رَدِيفَة"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الأصلية على التبعيّة والعجز بعيدة عن معنى التكميل الكمّيّ.
        لا شواهد تدعم استعمالها بمعنى «كمّيّة مكمّلة».
      evidence_assessment:
        case: contradicts_only


