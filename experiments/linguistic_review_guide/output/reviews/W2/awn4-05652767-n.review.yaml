# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  blind_candidates:
    - lemma: "قُصُورٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر قصر، على وزن المصدر فُعُول. يُعبِّر عن عدم بلوغ الشيء غايتَه ومداه،
        ملائم لمفهوم نقص القدرة عن إنجاز فعل. ورد في المعاجم بمعنى العجز عن الأداء
        ويُستعمل في السياقَيْن الكلاسيكي والمعاصر.
    - lemma: "وَهَنٌ"
      generation_method: majaz
      justification: >
        من جذر وهن، أصله الضعف الجسدي. يُستعار مجازاً لإضعاف القدرة الذهنية.
        ورد في القرآن الكريم «حَمَلَتْهُ أُمُّهُ وَهْناً عَلَى وَهْنٍ» بمعنى الضعف
        المتراكم، مما يجعله مرشحاً للتعبير عن نقص القدرة.
    - lemma: "عَجْزٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر عجز، المصدر فَعْل. هو المصطلح العربي الأصيل والأكثر شيوعاً لمفهوم
        ضد القدرة وضعفها. ورد في كتاب العين والقاموس المحيط وسائر أمهات المعاجم
        بمعنى الضعف والعجز عن الفعل.
    - lemma: "عُسْرٌ"
      generation_method: majaz
      justification: >
        من جذر عسر، أصله نقيض اليسر. يمتد دلالياً من الصعوبة المادية إلى الصعوبة
        في الأداء والإنجاز، ويمكن تأويله على أنه عجز عن الفعل بسبب صعوبة بالغة.

  assessment:
    concerns:
      - "اللمّة الأولى «عجز» مجرّدة من التشكيل، تحتاج ضبطاً: عَجْزٌ"
      - "اللمّة الثانية «عدم قدرة» تركيب إضافي (MWE) يفتقر إلى التشكيل وإلى تمييز واضح عن المرادفات"
      - "التعريف العربي ترجمة حرفية مباشرة للإنجليزية؛ «لفعل» غير نحوي والصواب «عن فعل»، وغياب أسلوب المعجم الوسيط"
      - "غياب لمّة «قُصُورٌ» رغم ثبوتها في المعاجم مرادفاً لـ«العجز»"
    observations: >
      المجموعة تُمثّل مفهوم inability مع التأكيد على البُعد الذهني. المصطلح العربي
      الأصيل هو «عَجْزٌ»، مُثبَت في أمهات المعاجم من الفراهيدي وابن فارس وابن منظور
      بمعنى ضد القدرة. «عدم قدرة» تعبير مركّب شائع في الاستخدام الحديث والطبي
      والتقني. «قُصُورٌ» يرد في المعاجم مرادفاً للعجز ومُستعمَلاً في الطب الحديث.
      في المقابل «وَهَنٌ» يختص بالضعف الجسدي لا الذهني في المعاجم، و«عُسْرٌ» يدل
      على الصعوبة والضيق لا على نقص القدرة الذاتية.


