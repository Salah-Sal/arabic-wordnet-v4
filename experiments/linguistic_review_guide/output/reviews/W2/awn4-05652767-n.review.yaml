# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عجز"
      decision: confirmed
      decision_reason: >
        المصطلح العربي الأصيل والأقدم للدلالة على ضد القدرة وانعدامها. مُثبَت في
        أمهات المعاجم من الفراهيدي وابن فارس حتى ابن منظور. يُعادل مباشرةً المقابل
        الإنجليزي inability. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُشير إلى غياب القدرة كلياً وضدّها المطلق؛ أقوى في التعبير عن انعدام القدرة
        من قصور ومن التعبير المركّب عدم قدرة. يُستعمل في السياقات الفقهية والكلامية
        والقرآنية والأدبية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَجْزٌ"

    - lemma: "عدم قدرة"
      decision: confirmed
      decision_reason: >
        تعبير مركّب (MWE إضافي) مُثبَت في المورد الحديث وفي الأدبيات الفقهية القديمة
        بمعنى نقص القدرة. يُستعمل شائعاً في الخطاب العلمي والقانوني والطبي المعاصر.
        اختبار التثبيت المعجمي: التعبير مُسجَّل حرفياً في المورد الحديث مقابلاً لـ inability
        و incapacity وهو ما يُثبت تثبيته المعجمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على البُعد السلبي (عدم + قدرة)؛ أكثر وضوحاً دلالياً للقارئ غير المتخصص
        ويُفضَّل في الخطاب العلمي والطبي الحديث. أقل إيجازاً من عَجْزٌ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ قُدْرَة"

    - lemma: "قُصُورٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَت في المعاجم بمعنى «العجز» صراحةً (البركتي). وورد في المورد الحديث
        مقابلاً لـ inability إلى جانب عجز. يُستعمل واسعاً في الطب الحديث لمفهوم
        نقص الأداء (قصور القلب، قصور الكلى، قصور ذهني). اختبار السكّ: «قصور» وحده
        وحدة معجمية راسخة لا تحتاج إبدالاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على نقص الأداء النسبي وعدم بلوغ الغاية لا الغياب الكلي للقدرة؛
        أخفّ درجةً من عَجْزٌ في الغالب.
      actions:
        - command: create_entry
          params:
            lemma: "قُصُورٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05652767-n"

    - lemma: "وَهَنٌ"
      source: stage1
      decision: removed
      decision_reason: >
        يدل أساساً على الضعف الجسدي (ذبول الحيوية، ضعف القوة العضلية). المجموعة
        تنتمي إلى حقل الإدراك والقدرة الذهنية، ومقابلاته الطبية (adynamia, debility,
        hypodynamia) كلها في الضعف البدني. لا يوجد دليل معجمي كافٍ على استعماله
        بمعنى نقص القدرة الذهنية.

    - lemma: "عَجْزٌ (مرشح)"
      source: stage1
      decision: removed
      decision_reason: >
        يُطابق اللمّة الموجودة «عجز» في الجذر والوزن والمعنى. تمت معالجته ضمن
        اللمّة الموجودة عن طريق update_lemma. لا يُنشأ مدخل جديد.

    - lemma: "عُسْرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        يدل على الصعوبة والشدة (نقيض اليسر) وقلة ذات اليد. مجال دلالي مختلف كلياً
        عن نقص القدرة الذاتية. فضلاً عن استعماله الغالب في سياق الضيق المالي.


