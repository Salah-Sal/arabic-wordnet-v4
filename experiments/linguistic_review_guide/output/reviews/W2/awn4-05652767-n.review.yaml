          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«العجز: اصله التأخر عن الشيء وحصوله عند عجز الأمر أي مؤخره، وصار في التعارف اسما للقصور عن فعل الشيء، وهو ضد القدرة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العَجْز: ضدُّ القدرة وقيل: عدمُ القدرة»"
