        - text: "«الْعَجز: عدم الْقُدْرَة على الْمُمكن الَّذِي لَا يكون فِيهِ شَائِبَة الِامْتِنَاع»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«العجز ضد القدرة. وقيل عدم القدرة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«عَجْز؛ قصور؛ عدم قدرة» — للمقابل الإنجليزي inability"
          source: "المورد الحديث (Al-Mawrid Al-Hadeeth)"
        - text: "«عَجَزَ عَنِ الشَّيْءِ عَجْزًا ومَعْجَزَةً: ضَعُفَ عَنْهُ»"
          source: "المصباح المنير للفيّومي"
      expands:
        - text: "«الْعَيْنُ وَالْجِيمُ وَالزَّاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى الضَّعْفِ، وَالْآخَرُ عَلَى مُؤَخَّرِ الشَّيْءِ. فَالْأَوَّلُ عَجِزَ عَنِ الشَّيْءِ يَعْجِزُ عَجْزًا، فَهُوَ عَاجِزٌ، أَيْ ضَعِيفٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُرسّخ أن الضعف هو المعنى الأوّل للجذر ويُميّزه عن المعنى الثاني (مؤخّر الشيء)"
        - text: "«عجز المتكلم عن تبليغ أفكاره ومشاعره لغيره» — عدم القدرة التواصلية"
          source: "المعجم الطبي الموحد (ARABTERM)"
          addition: "يُثبت استعمال «عجز عن» في الطب الحديث لمفهوم نقص القدرة المتخصص"

    - lemma: "عدم قدرة"
      confirm:
        - text: "«عَجْز؛ قصور؛ عدم قدرة» — للمقابل الإنجليزي inability"
          source: "المورد الحديث (Al-Mawrid Al-Hadeeth)"
        - text: "«(1) عَجْز؛ عدم قدرة. (2) لاأهلية (ق)» — للمقابل الإنجليزي incapacity"
          source: "المورد الحديث (Al-Mawrid Al-Hadeeth)"
      expands:
        - text: "«عدم الْقُدْرَة مُطلقًا لَيْسَ بعجز: فَإِن عدم الْقُدْرَة على الْمُمْتَنع بِالذَّاتِ أَو بِالْغَيْر لَيْسَ بعجز، بل عدم الْقُدْرَة على الْمُمكن الْغَيْر الْمُمْتَنع بِالْغَيْر عجز»"
          source: "التعريفات الفقهية (نص مستقل، entry_id=818345)"
          addition: "يُثبت أن «عدم القدرة» تعبير أصيل في الأدبيات الفقهية مع تمييزه دقيقاً عن العجز"

    - lemma: "قُصُورٌ"
