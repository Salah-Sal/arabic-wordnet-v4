# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13598747-n
# system of weights and measures / نظام الأوزان والمقاييس
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «نظام الأوزان والمقاييس» تعبير وصفي طويل وليس مصطلحاً مسكوكاً مستقلاً، يحتاج إلى تقييم مدى تثبيته المعجمي"
      - "اللمّة تفتقر إلى التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط، مما يُضعف التغطية المعجمية"
    observations: "المفهوم يدلّ على منظومة متكاملة لقياس الطول والوزن والمدة، وهو مفهوم حضاري عريق في الثقافة العربية الإسلامية إذ عُنيت الشريعة بضبط المكاييل والموازين. التعريف الحالي واضح ومباشر. المجموعة الأعلى «نظام قياس» تُقدّم إطاراً عامّاً، وهذه المجموعة تخصّصه بالطول والوزن والمدة."

  blind_candidates:
    - lemma: "مَنْظُومَةُ المَقَايِيسِ"
      generation_method: tarkib
      justification: "مركب إضافي من «منظومة» (من ن ظ م: ما انتظم من أجزاء مترابطة) و«المقاييس» (جمع مقياس). يُعبّر عن النظام المتكامل لأدوات القياس، وهو أخصر من التعبير الوصفي الطويل."
    - lemma: "نِظَامُ المَوَازِينِ وَالمَقَايِيسِ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين «الموازين» (أدوات الوزن) و«المقاييس» (أدوات القياس)، وهو تعبير ثابت ورد في المعجمات التقنية العربية الحديثة لترجمة metrology بمعناه الثاني."
    - lemma: "الأَوْزَانُ وَالمَقَايِيسُ"
      generation_method: tarkib
      justification: "مركب عطفي مختصر يُستعمل استعمالاً اصطلاحياً ثابتاً في السياقات القانونية والتجارية العربية، مقابل weights and measures في الإنجليزية."
    - lemma: "عِلْمُ القِيَاسِ"
      generation_method: tarkib
      justification: "مركب إضافي مسكوك يُقابل metrology، وإن كان أوسع دلالة من المفهوم المطلوب (يشمل علم القياس نظرياً وتطبيقياً)، إلا أنه يُستعمل أحياناً بمعنى نظام المقاييس."

stage2_evidence:
  per_lemma:
    - lemma: "نِظَامُ الأَوْزَانِ وَالمَقَايِيسِ"
      confirm:
        - text: "«الأَوزانُ و المَقاييس»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(1) علم القياس (2) نظام مقاييسَ وموازين.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(المقياس) الْمِقْدَار وَمَا قيس بِهِ من أَدَاة أَو آلَة (ج) مقاييس»"
          source: "المعجم الوسيط"
          addition: "تأكيد أنّ المقاييس جمع مقياس بمعنى أداة القياس"
        - text: "«(الْوَزْن) سنجة الْمِيزَان... والميزان: م، والعدل، والمقدار»"
          source: "المعجم الوسيط"
          addition: "الوزن والميزان أصل في تقدير الأشياء"

    - lemma: "مَنْظُومَةُ المَقَايِيسِ"
      evidence_status: "no_material_found"

    - lemma: "نِظَامُ المَوَازِينِ وَالمَقَايِيسِ"
      confirm:
        - text: "«(1) علم القياس (2) نظام مقاييسَ وموازين.»"
          source: "المورد الحديث (2008)"
        - text: "«علم المقاييس والموازين»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"

    - lemma: "الأَوْزَانُ وَالمَقَايِيسُ"
      confirm:
        - text: "«الأَوزانُ و المَقاييس»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«(الموازين) جمع الْمِيزَان وَالْمِيزَان الْوَاحِد مَعَ سنجه»"
          source: "المعجم الوسيط"
          addition: "الموازين والأوزان مترادفان في باب أدوات الوزن"

    - lemma: "عِلْمُ القِيَاسِ"
      contradicts:
        - text: "«يُقصد به علم 'الكميات وأنظمة القياس' أو 'علم وتقنية القياس'.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          conflict: "علم القياس يدلّ على العلم النظري والتطبيقي (metrology) وليس مجرد نظام الأوزان والمقاييس؛ فهو أعمّ"
      expands:
        - text: "«علم القياس»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
          addition: "مصطلح مسكوك ثابت في عدة معاجم موحدة لكنه يقابل metrology لا weights and measures"

stage3_analysis:
  per_lemma:
    - lemma: "نِظَامُ الأَوْزَانِ وَالمَقَايِيسِ"
      decision: confirmed
      decision_reason: "تعبير ثابت ومتداول في الاستعمال العربي الحديث، يُقابل مباشرة system of weights and measures. ورد ما يُسانده في المعجم الطبي الموحد والمورد الحديث. يحتاج إلى تشكيل كامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "التعبير الرسمي الكامل الذي يُحدّد مكوّنات النظام صراحةً (الأوزان + المقاييس)، يُستعمل في السياقات القانونية والإدارية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِظَامُ الأَوْزَانِ وَالمَقَايِيسِ"

    - lemma: "الأَوْزَانُ وَالمَقَايِيسُ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير اصطلاحي مختصر ثابت ورد في المعجم الطبي الموحد مقابل weights and measures. يُستعمل بكثرة في السياقات التجارية والقانونية العربية كتعبير مكتفٍ بذاته عن نظام الأوزان والمقاييس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الصيغة المختصرة المتداولة شفاهةً وكتابةً، تُشير إلى المنظومة ذاتها دون ذكر كلمة «نظام» صراحةً"
      actions:
        - command: create_entry
          params:
            lemma: "الأَوْزَانُ وَالمَقَايِيسُ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَنْظُومَةُ المَقَايِيسِ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على تثبيت هذا التعبير. كما أنه يختزل المفهوم في المقاييس وحدها دون الأوزان، مما يُفقده الدقة."

    - lemma: "نِظَامُ المَوَازِينِ وَالمَقَايِيسِ"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود ما يُقاربه في المورد الحديث (نظام مقاييس وموازين)، إلا أنّ الصيغة المعيارية الثابتة في الاستعمال العربي هي «الأوزان والمقاييس» وليس «الموازين والمقاييس». إدراجه يُحدث تكراراً مع اللمّة الأصلية دون إضافة دلالية واضحة."

    - lemma: "عِلْمُ القِيَاسِ"
      source: stage1
      decision: removed
      decision_reason: "علم القياس يُقابل metrology وهو أوسع دلالةً من مجرد نظام الأوزان والمقاييس؛ إذ يشمل النظرية والتقنية والممارسة العلمية للقياس. إدراجه في هذه المجموعة يُوسّع نطاقها بشكل غير مبرر."

