step0_evidence:
  per_lemma:
    - lemma: "رعية"
      confirm:
        - text: "«عامَّة الناس الذين عليهم راعٍ يُدبِّر أمْرَههم ويرعى مصالحهم»"
          source: "المعجم الوسيط"
        - text: "«العامَّةُ الذين عليهم راعٍ يُدَبِّرُ أَمْرَهم ويَرْعَى مَصالِحَهم»"
          source: "المعجم الكبير"
    - lemma: "مواطن"
      confirm:
        - text: "«شخص يتمتع بالحقوق المدنية والسياسية في الدولة التي يحمل جنسيتها.»"
          source: "المعجم الموحد لمصطلحات القانون"
        - text: "«عضو في دولة بالولادة أو بالاختيار»"
          source: "المورد الحديث"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تابع"
      source_section: "step5_english_bridge"
      evidence_citation: "«المرؤوس؛ التابع. مثل: المُقْطَع: الممنوح إقطاعة ما. الرعيّة: أحد رعايا دولة ما» — المورد الحديث"
      justification: "وردت الكلمة كترجمة للمصطلح الإنجليزي (subject) في سياق التبعية السياسية."
  knowledge_candidates:
    - lemma: "ابن البلد"
      justification: "تركيب إضافي يستخدم للدلالة على المواطن الأصلي، وهو مجاز يعبر عن الانتماء."
  generation_notes: "المصطلحات الأصلية (مواطن، رعية) هي الأدق والأكثر تخصصاً للتعبير عن المفهوم المرجو."

step1_lemma_validation:
  per_lemma:
    - lemma: "رعية"
      decision: confirmed
      decision_reason: "مصطلح فصيح وعريق يدل على المحكومين والتابعين لسلطة سياسية أو حاكم، وهو المعنى الدقيق لـ subject."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على التبعية للحاكم أو السلطة، وتعكس النظرة التراثية للعلاقة بين الحاكم والمحكوم."
      example: "سهر الحاكم العادل على رعاية مصالح رعيته."

    - lemma: "مواطن"
      decision: confirmed
      decision_reason: "مصطلح معاصر فصيح يدل على الفرد الذي يحمل جنسية دولة ما وينتمي إليها، وهو المقابل الدقيق لـ national و citizen."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الانتماء القانوني الحديث للدولة، والتمتع بالحقوق والواجبات، بخلاف 'رعية' التي تغلب عليها دلالة التبعية للسلطة."
      example: "شارك كل مواطن صالح في بناء مستقبل وطنه."

    - lemma: "تابع"
      source: step05
      decision: removed
      decision_reason: "مصطلح عام يشمل أي نوع من التبعية (السياسية أو غيرها)، ولا يختص بصفة المواطنة أو الرعوية في الاستعمال المعاصر الدقيق."
      step05_citation: "«المرؤوس؛ التابع.» — المورد الحديث"
      substitution_test:
        result: "fail"
      nuance_differentiation: "أعم من 'مواطن' و'رعية'، فكل مواطن تابع لدولته ولكن ليس كل تابع مواطناً بالضرورة."

    - lemma: "ابن البلد"
      source: step05
      decision: removed
      decision_reason: "تعبير وصفي حر وتركيب إضافي أقرب إلى الاستعمال الدارج، ولا يرقى لمرتبة المصطلح المسكوك للتعبير عن المفهوم القانوني للمواطنة."
      step05_citation: "معرفة لغوية"
      substitution_test:
        result: "fail"
      nuance_differentiation: "يحمل ظلالاً دلالية تتعلق بالأصالة والشهامة الشعبية أكثر من الانتماء القانوني المحض للدولة."

  synset_flags:
    definition_review_needed: true

step3_definition:
  definition_review_flag: true
  current_definition: "شخص يدين بالولاء لتلك الأمة"
  assessment:
    decision: revise
    reason: "التعريف الحالي ركيك وضعيف الصياغة لوجود كلمة 'لتلك' دون إحالة سابقة، ولأن مفهوم المواطنة يرتبط بالدولة أكثر من ارتباطه بالأمة في السياق القانوني والسياسي الحديث."
  authored_definitions:
    - type: terminological
      text: "شخص ينتمي إلى دولة أو أمة ما، ويتمتع فيها بحقوق مدنية وسياسية ويدين لها بالولاء."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09648571-n"
        definition_index: 0
        text: "شخص ينتمي إلى دولة أو أمة ما، ويتمتع فيها بحقوق مدنية وسياسية ويدين لها بالولاء."

