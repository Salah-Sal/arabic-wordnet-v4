    - lemma: "تَحْرِير"
      entry_id: "{auto}"
      root: "حرر"
      maqayis_quote: "«الْحَاءُ وَالرَّاءُ فِي الْمُضَاعَفِ لَهُ أَصْلَانِ: فَالْأَوَّلُ مَا خَالَفَ الْعُبُودِيَّةَ وَبَرِئَ مِنَ الْعَيْبِ وَالنَّقْصِ.»"
    - lemma: "انْبِعَاث"
      entry_id: "{auto}"
      root: "بعث"
      maqayis_quote: "«الْبَاءُ وَالْعَيْنُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْإِثَارَةُ. وَيُقَالُ: بَعَثْتُ النَّاقَةَ: إِذَا أَثَرْتَهَا.»"
