# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07967004-n
# people who are sick — الناس المصابون بالمرض
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مرضى» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط — قد تحتاج إثراء بمرادفات"
      - "اللمّة «مرضى» جمع تكسير لا مفرد — يجب التأكد من ملاءمتها كاسم جمعي للمجموعة"
    observations: >
      المجموعة الترادفية تدل على مفهوم «الناس المصابون بالمرض» كجماعة بشرية، وهي
      فرع من المجموعة العُليا «أشخاص / بشر / ناس». اللمّة «مرضى» هي الجمع الطبيعي
      لـ«مريض» وتُستعمل استعمال الاسم الجمعي للدلالة على هذه الفئة من الناس. التعريف
      العربي واضح ومباشر لكنه يفتقر إلى الأسلوب المعجمي.
  blind_candidates:
    - lemma: "مَرْضَى"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«مَرِيض» على وزن فَعْلَى، من الجذر م-ر-ض، وهو الجمع الأشيع والأفصح للدلالة على المصابين بالمرض كفئة بشرية"
    - lemma: "سُقَمَاء"
      generation_method: ishtiqaq
      justification: "جمع تكسير محتمل لـ«سَقِيم» على وزن فُعَلَاء، من الجذر س-ق-م المرادف لمعنى المرض في العربية الفصحى"
    - lemma: "أَعِلَّاء"
      generation_method: ishtiqaq
      justification: "جمع تكسير محتمل لـ«عَلِيل» على وزن أَفْعِلَاء، من الجذر ع-ل-ل الدال على العلة والمرض"
    - lemma: "مُعْتَلُّون"
      generation_method: ishtiqaq
      justification: "جمع مذكر سالم لاسم الفاعل «مُعْتَلّ» من الفعل اعتلّ بمعنى مرض، من الجذر ع-ل-ل"


stage2_evidence:
  per_lemma:
    - lemma: "مَرْضَى"
      confirm:
        - text: "«(مَرِضَ) الْمِيمُ وَالرَّاءُ وَالضَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَا يَخْرُجُ بِهِ الْإِنْسَانُ عَنْ حَدِّ الصِّحَّةِ فِي أَيِّ شَيْءٍ كَانَ. مِنْهُ الْعِلَّةُ. مَرِضَ وَ. . . يَمْرَضُ. وَجَمْعُ الْمَرِيضِ مَرْضَى.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(الْمَرِيض) من بِهِ مرض أَو نقص أَو انحراف ... (ج) الْمَرِيض والمريضة مرضى ومراض ومراضى»"
          source: "المعجم الوسيط"
        - text: "«المَرِيض: مَن به مَرَضٌ أو نَقْصٌ أو انحراف»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(8) .أ» المريض. .ب» المَرْضَى»"
          source: "المورد الحديث (2008) — مدخل sick"
      expands:
        - text: "«المَرِيض: مَن به مرضٌ وفي صلاة المريض المرِيضُ هو الذي إذا قام يلحقه بالقيام ضررٌ»"
          source: "التعريفات الفقهية للبركتي"
          addition: "توسيع فقهي لمفهوم المريض ليشمل من يلحقه ضرر بالقيام"
        - text: "«مَرِيض — من (م ر ض) السقيم العليل»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "ترادف صريح بين مريض وسقيم وعليل"

    - lemma: "سُقَمَاء"
      contradicts:
        - text: "«(السقيم) يُقَال هُوَ سقيم الصَّدْر على أَخِيه حاقد وَفهم سقيم وَكَلَام سقيم سخيف (ج) سقم وَهِي سقيمة (ج) سقائم»"
          source: "المعجم الوسيط"
          conflict: "الجمع المعتمد في الوسيط هو «سُقْم» لا «سُقَمَاء»، مما يعني أن صيغة سُقَمَاء غير مسجلة"
      expands:
        - text: "«(سَقَِمَ) السِّينُ وَالْقَافُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ الْمَرَضُ: يُقَالُ سُقْمٌ وَسَقَمٌ وَسَقَامٌ، ثَلَاثُ لُغَاتٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر س-ق-م يدل على المرض مطلقاً، لكن المذكور أسماء المصدر لا صيغ الجمع"

    - lemma: "أَعِلَّاء"
      evidence_status: "no_material_found"

    - lemma: "مُعْتَلُّون"
      expands:
        - text: "«(1) معتلّ؛ مريض؛ عاجز (2) مَرَضيّ؛ عَجزيّ: خاصّ بمريض أو عاجز»"
          source: "المورد الحديث (2008) — مدخل invalid"
          addition: "معتلّ مرادف لمريض في سياق العجز عن العمل"
        - text: "«(1) اعتلال؛ سُقم (2) مرض»"
          source: "المورد الحديث (2008) — مدخل illness"
          addition: "الاعتلال مصدر اعتلّ ويعني المرض"


stage3_analysis:
  per_lemma:
    - lemma: "مَرْضَى"
      decision: confirmed
      decision_reason: >
        «مَرْضَى» هو الجمع الفصيح الشائع لـ«مَرِيض» على وزن فَعْلَى، وهو مثبت في
        مقاييس اللغة والمعجم الوسيط والمورد. يُستعمل استعمال الاسم الجمعي للدلالة على
        فئة المصابين بالمرض، وهو المقابل الطبيعي للإنجليزية «the sick». اللمّة الموجودة
        بحاجة إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَرْضَى"

    - lemma: "سُقَمَاء"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة «سُقَمَاء» غير مسجلة في المعاجم المعتمدة. المعجم الوسيط يذكر جمع
        «سقيم» على «سُقْم» لا «سُقَمَاء». وحتى لو صحّت قياساً فهي غير متداولة
        ولا تُستعمل كاسم جمعي مستقل للدلالة على فئة المرضى.
      evidence_assessment:
        case: contradicts_only

    - lemma: "أَعِلَّاء"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تثبت «أَعِلَّاء» كجمع لـ«عليل». الصيغة غير مسجلة في
        المعاجم المعتمدة، والجمع المتداول لعليل هو «أَعِلَّة» أو ورودها في سياقات
        محدودة جداً. لا تصلح كلمّة مستقلة في المجموعة الترادفية.
      evidence_assessment:
        case: no_material

    - lemma: "مُعْتَلُّون"
      source: stage1
      decision: removed
      decision_reason: >
        «مُعْتَلُّون» صيغة صحيحة صرفياً (جمع مذكر سالم لاسم الفاعل «مُعْتَلّ»)، لكنها
        لا تُستعمل كاسم جمعي مستقل للدلالة على فئة المرضى كما تُستعمل «مَرْضَى».
        استعمالها مقتصر على السياق الوصفي لا الاسمي الجمعي، ولا تحقق الاستقلال
        المعجمي المطلوب كمدخل في الشبكة الدلالية.
      evidence_assessment:
        case: no_material


