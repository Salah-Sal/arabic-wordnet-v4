stage1_review:
  assessment:
    concerns:
      - "اللمّة «لغة مبنية» تستخدم «مبنية» بمعنى غير شائع؛ المعنى النحوي (المبني مقابل المعرب) هو الأرسخ في الاستعمال العربي"
      - "اللمّتان الموجودتان كلتاهما مركّبات وصفية؛ ينقص المجموعة مصطلح «لغة اصطناعية» الأكثر شيوعاً في المعاجم المصطلحية الحديثة"
      - "التعريف العربي الحالي ترجمة حرفية شبه مباشرة من الإنجليزية ويحتاج تحسيناً أسلوبياً"
    observations: "المفهوم يدلّ على لغة وضعها واضعٌ قصداً لغرض معيّن، كالإسبرانتو ولغات البرمجة والمنطق الصوري. المعاجم المصطلحية العربية (ALECSO) تستخدم «لغة اصطناعية» بكثافة واضحة. أمّا «لغة مبنية» فمصطلح قد يلتبس بالمعنى النحوي للبناء. و«لغة مصطنعة» صحيحة لغوياً لكنها تحمل إيحاءً سلبياً (التكلّف والزيف) في الاستعمال العام."

  blind_candidates:
    - lemma: "لُغَة اصْطِنَاعِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «لغة» + «اصطناعية» (مصدر صناعي من اصطنع). هو المصطلح المعتمد في معاجم ALECSO للسانيات والمعلوماتية، ويقابل artificial language تماماً"
    - lemma: "لُغَة صُورِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «لغة» + «صورية». يُستخدم في المعاجم المصطلحية للدلالة على اللغات الشكلية (formal language) التي هي نوع من اللغات المصطنعة"
    - lemma: "لُغَة مُوَلَّدَة"
      generation_method: tarkib
      justification: "مركّب وصفي من «لغة» + «مولّدة» بمعنى المستحدثة. يوظّف مفهوم التوليد الاصطلاحي العربي (المولّد: المحدث من كل شيء)"
    - lemma: "لُغَة مُخْتَرَعَة"
      generation_method: tarkib
      justification: "مركّب وصفي من «لغة» + «مخترعة» (اسم مفعول من اختراع). يؤكّد معنى الإنشاء العمدي والابتكار القصدي"


