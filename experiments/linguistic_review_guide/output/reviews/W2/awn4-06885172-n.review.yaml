# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الوحيدة 'صوت غنائي' مركّبة وصفية (اسم + صفة)، وهي أقرب إلى وصف حرّ منها إلى مصطلح مُثبَّت معجمياً."
      - "غياب التشكيل الكامل على اللمّة الموجودة."
      - "انعدام لمّة مفردة مُكثَّفة تُعبِّر عن هذا المفهوم الموسيقي الدقيق."
      - "التعريف الحالي قريب من الترجمة الحرفية للإنجليزية، ويحتاج إلى صياغة بأسلوب المعجم الوسيط."

    observations: >
      المجموعة تُعبِّر عن مفهوم موسيقي محدَّد هو «جودة الصوت الموسيقية أثناء الغناء»، أي ما يتميز
      به صوت المغنّي من طراوةٍ ورنينٍ وملاءمةٍ للأداء الغنائي. يختلف هذا عن مجرد «الغناء» كفعلٍ،
      وعن «الصوت» عموماً كجنس. التراث العربي الموسيقي غني بمصطلحات تتعلق بجودة الصوت (الشجو،
      الطرب، الترنيم) لكنها تنصبّ على الأثر الانفعالي لا على الطابع الموسيقي التشريحي للصوت.
      اللمّة الحالية «صوت غنائي» مستعمَلة في الخطاب العربي المعاصر لكنها لم تتخذ طابع المصطلح
      الجامد المسكوك. المجموعة تستدعي تمحيصاً دقيقاً في المصادر اللغوية والموسيقية.

  blind_candidates:
    - lemma: "الشَّدَا"
      generation_method: majaz
      justification: >
        تمديد دلالي من جذر «شدو» — والشادي هو المغنّي، وشدا يشدو بمعنى ترنَّم وغنَّى —
        نحو دلالة «جودة الصوت الغنائي». إحياء للفظ كلاسيكي يجمع معنى الغناء والطرف
        من القوة بمعنى ما تبرز به الجودة؛ محاولةٌ لإزاحة دلالية من الفعل إلى الصفة المعجمية.

    - lemma: "الغِنَائِيَّةُ"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن «فِعَالِيَّة» من جذر «غ ن ي»، يُجرِّد الصفةَ الغنائية ويحوّلها
        إلى مفهوم مجرّد — «كون الصوت غنائياً وما يتّصف به من جودة موسيقية». وزن المصدر
        الصناعي منتج في العربية لتحويل الصفات إلى مفاهيم.

    - lemma: "الجَرْسُ الغِنَائِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «الجَرْس» (= رنين الصوت وطابعه) + «الغنائي» (= المتعلق بالغناء).
        الجَرْس مصطلح راسخ في اللغة لوصف طبيعة الصوت ورنينه (جرس الحرف، جرس الصوت)،
        وإضافة «الغنائي» تُخصِّصه بالسياق الموسيقي. تركيب وصفي ذو إمكانية عالية للتثبيت.

    - lemma: "مَلَكَةُ الْغِنَاءِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مَلَكَة» (= الموهبة والقدرة الفطرية الراسخة) + «الغناء». تعبير
        إضافي يُحيل إلى الاستعداد الصوتي الفطري للغناء وما يتّصف به الصوت من ملاءمة
        موسيقية، وهو تعبير مستعمَل في الخطاب العربي للإشارة إلى الموهبة الغنائية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "صوت غنائي"
      expands:
        - text: "«صوت الغناء» — ترجمة: singing sound"
          source: "مسرد الفن والتسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: >
            الصيغة المُعجمية المُثبَّتة في مصادر الأونيسكو هي «صوت الغناء» (إضافية)
            لا «صوت غنائي» (وصفية)؛ وقد وُرِدت بترجمة «singing sound» وهي أقرب للمفهوم
            من «singing voice» لكنها تؤكد وجود اصطلاح مرتبط.
        - text: "«صَوَتَ: الصَّادُ وَالْوَاوُ وَالتَّاءُ أَصْلٌ صَحِيحٌ، وَهُوَ الصَّوْتُ، وَهُوَ جِنْسٌ لِكُلِّ مَا وَقَرَ فِي أُذُنِ السَّامِعِ. يُقَالُ: هَذَا صَوْتُ زَيْدٍ. وَرَجُلٌ صَيِّتٌ، إِذَا كَانَ شَدِيدَ الصَّوْتِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            ابن فارس يُعرِّف «الصوت» جنساً لما يُسمع — يؤكد أن اللفظة أصيلة في العربية
            وصالحة للتخصيص بالصفة «غنائي».
        - text: "«وَالْأَصْلُ الْآخَرُ: الْغِنَاءُ مِنَ الصَّوَابِ. وَالْأُغْنِيَةُ: اللَّوْنُ مِنَ الْغِنَاءِ»"
          source: "مقاييس اللغة لابن فارس (أصل غني)"
          addition: >
            يُثبت ابن فارس أن «الغناء» أصلٌ صحيح من جذر «غ ن ي» مستقل عن أصل الغنى
            (الثروة)؛ وأن «الأغنية» هي لوْنٌ من ألوان الغناء، مما يُعزز أن «الغنائي»
            نسبة صحيحة إلى هذا الأصل.

    - lemma: "الشَّدَا"
      contradicts:
        - text: "«الشَّدَا: الطَّرَفُ من القوة حَدُّ كلِّ شيء»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            المعجم الوسيط يُثبت «الشَّدَا» بمعنى «طرف القوة وحدّ كل شيء»، لا بمعنى
            جودة الصوت الغنائية. المعنى المُثبَّت للاسم لا يتطابق مع المفهوم المستهدَف.
        - text: "«بَقِيَةُ الْقُوَّةِ وَطَرَفُهَا. يُقَالُ: لَمْ يَبْقَ مِنْ قُوَّتِهِ إِلَّا شَدًا. الْبَقِيَّةُ مِنْ كُلِّ شَيْءٍ. الشَّيْءُ الْقَلِيلُ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المعجم الكبير يُؤكد نفس المعنى: «الشدا» اسماً يدل على البقية والقليل،
            لا على الجودة الموسيقية أو الغناء.
      expands:
        - text: "«الشَّادِي: الْمُغَنِّي. وَقَدْ شَدَا شِعْرًا أَوْ غِنَاءً، إِذَا غَنَّى وَتَرَنَّمَ»"
          source: "مختار الصحاح للرازي"
          addition: >
            يُثبت أن الجذر «شدو» يحمل معنى الغناء في صيغة الفعل والاسم الفاعل
            (الشادي = المغني)، لكن الاسم «الشدا» المعجمي يختلف عن هذا المعنى.
        - text: "«شَدَوَ: الشِّينُ وَالدَّالُ وَالْحَرْفُ الْمُعْتَلُّ أُصَيْلٌ يَدُلُّ عَلَى أَخْذٍ بِطَرَفٍ مِنْ عِلْمٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            ابن فارس يُرجع الجذر إلى «الأخذ بطرف من علم»، لا إلى الغناء أساسةً.
            وإن كان الغناء داخلاً فيه من باب «الأخذ بطرف» من الأداء.

    - lemma: "الغِنَائِيَّةُ"
      contradicts:
        - text: "«مسرحية شعرية حوارية تنشد ممثّلة موقَّعة على أنغام الموسيقى. (محدثة)»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            «الغنائية» مُثبَّتة في الوسيط بمعنى نوع مسرحي (Opera) لا بمعنى جودة الصوت
            الغنائية. المعنى المعجمي الموثَّق مختلف كلياً عن المستهدَف.
        - text: "«(1) الغنائيّة: كَوْن الشيء غنائيًا. الصفة الغنائية في الشعر. (2) حماسة مُفْرطة؛ مبالغة في الأسلوب أو العاطفة»"
          source: "المورد الحديث (2008)"
          conflict: >
            المورد الحديث يُثبتها بمعنى «lyricism» (الطابع الغنائي في الشعر) أو المبالغة
            العاطفية في الأسلوب — وكلاهما يختلف عن «جودة الصوت الموسيقية أثناء الغناء».

    - lemma: "الجَرْسُ الغِنَائِيُّ"
      expands:
        - text: "«عيب في جرس الصوت ورنينه» (ترجمة مصطلح: dystimbria)"
          source: "معجم المصطلحات الطبية ج.2 (2003)"
          addition: >
            يُثبت أن «جرس الصوت» مصطلح طبي-موسيقي راسخ يُحيل إلى الطابع الرنيني للصوت
            (Timbre)؛ وهو ما يُقرِّب التركيبَ «الجرس الغنائي» من المفهوم المستهدَف.

    - lemma: "مَلَكَةُ الْغِنَاءِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "صوت غنائي"
      decision: confirmed
      decision_reason: >
        اللمّة مستعمَلة في الخطاب العربي الموسيقي المعاصر للإشارة إلى صوت المغنّي من حيث
        جودته الموسيقية. لم تُوجَد كمدخل مُثبَّت بهذه الصيغة الوصفية تحديداً، لكن «صوت
        الغناء» وردت في مسرد ArabTerm بترجمة «singing sound» ما يُؤكد الحقل الدلالي.
        وبما أنها اللمّة الوحيدة للمجموعة وتؤدي وظيفتها الاصطلاحية، تُؤكَّد مع تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُشير تحديداً إلى الجودة الموسيقية للصوت حين الغناء
        (الطابع الموسيقي + ملاءمة الصوت للأداء الغنائي)، وهي أخصّ من «الصوت» المجرد
        وأخصّ من «الغناء» كفعل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَوْتٌ غِنَائِيٌّ"

    - lemma: "الشَّدَا"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم «الشدا» مُثبَّت في المعاجم الكبرى (الوسيط، الكبير، مقاييس ابن فارس)
        بمعنى «بقية القوة وطرفها» لا بمعنى جودة الصوت الغنائي. وإن كان الفعل «شدا»
        والاسم الفاعل «الشادي» يحملان معنى الغناء، فإن الاسم المجرد «الشدا» لا يؤدي
        دلالة المجموعة المستهدَفة. الإزاحة الدلالية المقترَحة لا تجد مستنداً معجمياً
        يدعمها في صيغة الاسم، فضلاً عن الاشتراك اللفظي مع المعنى الراسخ (البقية).

    - lemma: "الغِنَائِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        تُثبت المعاجم «الغنائية» بمعنيَيْن مستقلَّيْن عن المجموعة: (أ) نوع مسرحي
        غنائي (Opera/Lyric play) في المعجم الوسيط، و(ب) الطابع الغنائي الشعري
        (Lyricism) في المورد الحديث. استعمالها لتحديد «جودة الصوت الموسيقية»
        سيوقع في اشتراك لفظي مع المعنيَيْن الموثَّقَيْن. مرفوضة.

    - lemma: "الجَرْسُ الغِنَائِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        التركيب الوصفي «الجرس الغنائي» لم يُوجَد مُثبَّتاً في أي مصدر معجمي.
        اختبار الاستبدال يُخفق: «الجرس الموسيقي» أو «الجرس الصوتي» يبقيان وصفاً
        صالحاً، مما يُثبت أنه عبارة وصفية حرة لا مصطلح مسكوك. وإن كان «جرس الصوت»
        راسخاً لـ«timbre» فإن الإضافة «الغنائي» لا تجعله وحدة معجمية مستقلة.

    - lemma: "مَلَكَةُ الْغِنَاءِ"
      source: stage1
      decision: removed
      decision_reason: >
        «ملكة الغناء» تُحيل إلى الموهبة والقدرة الفطرية على الغناء، لا إلى
        «الجودة الموسيقية للصوت أثناء الغناء». الانزياح الدلالي كبير: المفهوم
        المستهدَف وصفٌ لطبيعة الصوت ذاته، لا لاستعداد صاحبه. لا أدلة معجمية.
        مرفوضة لعدم الملاءمة الدلالية.


