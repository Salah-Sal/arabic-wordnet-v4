# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «لغة العناوين» تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي يبدأ بـ«استخدام» (مصدر فعلي) فيصف النشاط لا السجل اللغوي ذاته، وعبارة «لكتاب العناوين» مبهمة نحوياً."
      - "المفهوم (headlinese) ظاهرة لغوية حديثة ذات طابع غربي ويفتقر إلى توثيق معجمي عربي راسخ في قواعد البيانات المتاحة."
      - "اللمّة الموجودة مركبٌ إضافي وصفي — قد لا يجتاز اختبار السكّ الاصطلاحي (substitution test) بصورة كاملة."
    observations: >
      تنتمي هذه المجموعة إلى حقل اللسانيات الصحفية وتصف «لغة العناوين الصحفية»
      (headlinese)، أي الأسلوبَ المختزَلَ الذي يستخدمه محررو العناوين،
      والمتّسِم بحذف أدوات التعريف والتنكير والأفعال المساعدة وروابط النحو.
      الجنس القريب هو «أسلوب تعبيري مميز» (awk4-07080699-n). المفهوم موجود في
      الكتابة الصحفية العربية المعاصرة لكنه لم يُقنَّن معجمياً في المعاجم
      الكلاسيكية؛ وعليه فإن التوليد المصطلحي يعتمد على الاشتقاق والتركيب.

  blind_candidates:
    - lemma: "لُغَةُ الرُّؤُوسِ"
      generation_method: tarkib
      justification: >
        مركَّب إضافي مبني على تعبير «رؤوس الأخبار» الراسخ في الصحافة العربية
        للدلالة على العناوين الإخبارية؛ فـ«لغة الرؤوس» تصف أسلوب الكتابة
        المختصر المستخدَم في تلك الرؤوس دون تكرار كلمات التعريف.

    - lemma: "عُنْوَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مشتق من «عنوان» بزيادة ياء النسب والتاء المربوطة، على غرار
        «شعرية» و«روائية». يُعبّر عن الخاصية الأسلوبية الفارقة لطريقة صياغة
        العناوين بوصفها سجلاً لغوياً مستقلاً.

    - lemma: "الِاخْتِزَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «اختزال» (على وزن افتعال + ياء النسب + تاء)، يُجسّد
        الطابع الاختزالي/المكثَّف الذي يميّز هذا الأسلوب. الجذر خزل في العربية
        يفيد القطع والانقطاع وهو المناسب لوصف حذف عناصر نحوية.

    - lemma: "التَّكْثِيفِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «تكثيف» (مصدر كثَّفَ + ياء النسب + تاء)، يُركّز على
        سمة الكثافة الدلالية مع الاقتصاد اللفظي التي تميّز أسلوب عناوين
        الصحافة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  queries_run:
    - "مطابقة دقيقة دفعية: لغة العناوين + جميع المرشحات (لا نتائج)"
    - "جسر إنجليزي: headlinese / headline language / headline style / headline writing (لا نتائج)"
    - "FTS عربي: عناوين / صحافة / اختصار / اختزال / مختصر / تكثيف (نتائج جانبية فقط)"
    - "FTS: لغة العناوين / أسلوب العناوين / عنونة / تعنون (عنونة بالمعنى الحاسوبي فقط)"
    - "مقاييس اللغة: جذور خزل، كثف، وجز، خصر، لغو، عني"

  per_lemma:
    - lemma: "لغة العناوين"
      evidence_status: "no_material_found"

    - lemma: "لُغَةُ الرُّؤُوسِ"
      evidence_status: "no_material_found"

    - lemma: "عُنْوَانِيَّة"
      contradicts:
        - text: >
            «عَنْوَنَة: وضع عنوان يستدل به على مكان بيان ما في ذاكرة الحاسوب
            أو على مصدر هذا البيان أو مقصده.»
          source: "مسرد التربية — المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
          conflict: >
            «عنونة» مسجّلة في معاجم تقنية المعلومات بمعنى العنونة الحاسوبية
            (addressing)، فاستخدام «عنوانية» في الدلالة على أسلوب العناوين
            الصحفية سيُفضي إلى اشتراك لفظي مع هذا الحقل التقني.

    - lemma: "الِاخْتِزَالِيَّة"
      expands:
        - text: >
            «(خَزَلَ) الْخَاءُ وَالزَّاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ
            عَلَى الِانْقِطَاعِ وَالضَّعْفِ. يُقَالُ خَزَلْتُ الشَّيْءَ:
            قَطَعْتُهُ. وَانْخَزَلَ فُلَانٌ: ضَعُفَ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر الأصلي يدل على القطع والانقطاع؛ ولا صلة مباشرة في كتب اللغة
            الكلاسيكية بين خزل والاختزال بمعنى الاختصار والاقتضاب، وهو معنى
            حديث استُعمل في المعاجم التقنية المعاصرة.
        - text: >
            «اختزال: تمثيل لأي كلمة أو سلسلة من الكلمات باستخدام بعض الحروف
            الواردة فيها.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          addition: >
            «اختزال» بمعنى التقصير اللغوي مُوثَّق في المعجم اللساني الموحد،
            وهو أقرب إلى الاختصار (abbreviation) منه إلى الأسلوب الصحفي
            المختزَل للعناوين.

    - lemma: "التَّكْثِيفِيَّة"
      expands:
        - text: >
            «(كَثَفَ) الْكَافُ وَالثَّاءُ وَالْفَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ
            عَلَى تَرَاكُبِ شَيْءٍ عَلَى شَيْءٍ وَتَجَمُّعٍ. يُقَالُ: هَذَا
            شَيْءٌ كَثِيفٌ. وَسَحَابٌ كَثِيفٌ وَشَجَرٌ كَثِيفٌ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر يدل على التراكب والتجمع؛ وهو يدعم دلالة الكثافة المعلوماتية
            في الجملة المختصرة، غير أنه لا يخصّص المفهوم بالسياق الصحفي
            للعناوين.


