# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04797677-n  |  ILI: i62180  |  POS: n
# unwholesomeness / morbidity / morbidness
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "إمراض يعني في المعاجم الطبية «تسبُّب المرض / إحداث المرض» (pathogenesis)، وليس «صفة كون الشيء غير صحي» — خلط بين مصدر الفعل المتعدي (عملية) والصفة الكيفية الثابتة"
      - "التعريف الحالي ترجمة حرفية ركيكة من الإنجليزية: «صفة كون الشيء غير صحي وضاراً بشكل عام» لا يراعي أسلوب المعاجم العربية في الجنس والفصل"
      - "المجموعة تفتقر إلى المصطلح الطبي المعاصر الموثَّق: مَرَضِيَّة (morbidity) الذي يرد في المعجم الطبي الموحد والمورد الحديث"
    observations: >-
      وَخَامَة هي أدق الألفاظ دلالةً على المفهوم المطلوب؛ فالوَخِمُ في لغة العرب
      هو الوَبِيُّ من الشيء (الضار بالصحة)، وتُفيد «استوخمت البلاد» معنى «لم تُوافِق
      ساكنها صحيًّا»، والتُّخَمَة مشتقة من هذا الجذر في إشارة إلى ثِقَل الطعام على
      البدن. أما فَسَاد فيتضمن صفة الضرر الصحي (التلف وإلحاق الضرر) لكنه أعمُّ، إذ
      يمتد للفساد الأخلاقي والقانوني. وإمراض مصدرٌ للفعل المتعدي «أمرض» يدل على
      إحداث المرض وتسبُّبه، لا على صفة كون الشيء مُمرِضًا بطبعه؛ مما يُشكِّل قصورًا
      دلاليًّا في سياق هذه المجموعة. يُنصح بالنظر في إضافة مَرَضِيَّة أو مَرَاضَة
      كمصطلحَين تقنيَّين موثَّقَين لـ morbidity في دورة مراجعة قادمة.

  blind_candidates:
    - lemma: "وَبَالِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من وَبَال (الثِّقَل وسوء العاقبة وما أفضى إلى الشرِّ)، على نمط
        فُعَالِيَّة لاستخلاص صفة مجردة. قال تعالى: «كانت وَبَالاً عليهم»؛ فالوبال يجمع
        الثِّقَل والضرر، وهو ما يُقارب دلالة «الأذى الصحي العام».
    - lemma: "مُضِرِّيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من مُضِرّ (اسم فاعل من أضرَّ) على نمط مُفْعِلِيَّة؛ يُفيد خاصيَّة
        الإضرار ومصدريَّة الأذى كصفة ثابتة. الوزن شائع في المصطلحية العلمية الحديثة
        لاستخلاص الكيفيات الدائمة من أسماء الفاعلين.
    - lemma: "خُبْث"
      generation_method: majaz
      justification: >-
        إحياء الدلالة القرآنية لخُبْث في مقابل «الطيِّبات»: «ويُحرِّم عليهم الخبائث».
        المقاييس: «الخاء والباء والثاء أصل واحد يدلُّ على خلاف الطيِّب». الإزاحة الدلالية
        من «غير الطيِّب» إلى «الضار بالصحة» قائمة على المشابهة الوظيفية.
    - lemma: "رَدَاءَة"
      generation_method: ishtiqaq
      justification: >-
        من رَدُؤَ الشيءُ فهو رَدِيء، مصدر فَعَالَة للصفة الكيفية؛ يُفيد خصيصة الرداءة
        والفساد العام. مستعمل في التراث: رداءة الهواء، رداءة الطعام، مما يُقارب
        «الضار بشكل عام».


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "إِمْرَاض"
      contradicts:
        - text: "«إِمْراض: nosogenesis (pathogenesis) / nosogeny (pathogenesis) / pathogenesis / pathogenesy / pathogeny»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >-
            المعاجم الطبية تُحدِّد إمراض بمعنى «تسبُّب المرض وآلياته» (pathogenesis)،
            أي العملية الديناميكية لنشوء المرض، لا «الصفة الثابتة لكون الشيء غير صحي».
        - text: "«إمراض: pathogenesis»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: >-
            تكرار الدلالة التقنية ذاتها في معجم ثانٍ مستقل، مما يُثبِّت أن إمراض
            مصطلح مخصوص بالعملية المَرَضية (pathogenesis) لا بوصف الصفة الكيفية.
      expands:
        - text: "«إِمْراضٌ مِعَوِيّ، إِمْراضٌ مَناعِيّ، إِمْراضٌ عَصَبِيّ، إِمْراضٌ دَوائِيّ، إِمْراضُ الخَلايا»"
          source: "المعجم الطبي الموحد (2009)"
          addition: >-
            يظهر إمراض حصرًا في مركّبات وصفية تعني «التأثير المُمرِض» لعامل ما على
            نظام بيولوجي بعينه. لا يُستعمل مفردًا مجردًا بمعنى «صفة الشيء اللاصحي».

    - lemma: "فَسَاد"
      confirm:
        - text: "«(الفَسَادُ): التَّلفُ والعطبُ والاضطرابُ والخللُ والجدبُ والقحطُ وإلحاقُ الضَّرَر. ﴿ظَهَرَ الفَسَادُ فِي البَرِّ وَالبَحْرِ بِمَا كَسَبَتْ أَيْدِي النَّاسِ﴾»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الفساد: خروج الشيء عن الاعتدال قليلاً كان الخروج أو كثيراً، ويضاده الصلاح، ويستعمل في النفس والبدن والأشياء الخارجة عن الاستقامة»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622)"
      expands:
        - text: "«(فَسَدَ) الفَاءُ وَالسِّينُ وَالدَّالُ كَلِمَةٌ وَاحِدَةٌ، فَسَدَ الشَّيْءُ يَفْسُدُ فَسَادًا وَفُسُودًا، وَهُوَ فَاسِدٌ وَفَسِيدٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            المقاييس تُثبِّت الجذر الأحادي للمعنى (زوال الصلاح)، مما يُجيز استعمال
            فساد في السياق الصحي الغذائي باعتباره حالة الشيء الذي خرج عن صلاحيته.
        - text: "«(1) ضارّ؛ مُؤذٍ. (2) فاسد. (3) كريه.»"
          source: "المورد الحديث (2008)"
          addition: >-
            التزاوج اللفظي بين فاسد وضار وكريه في نص المورد يدعم استخدام فساد
            في سياق الأذى الصحي.

    - lemma: "وَخَامَة"
      confirm:
        - text: "«(وَخَمَ) الوَاوُ وَالخَاءُ وَالمِيمُ: كَلِمَةٌ وَاحِدَةٌ، هِيَ الوَخِمُ: الوَبِيُّ مِنَ الشَّيْءِ. وَاسْتَوْخَمْتُ البِلَادَ، وَبِلَادٌ وَخِمَةٌ وَوَخِيمَةٌ: لَا تُوَافِقُ سَاكِنَهَا. وَرَجُلٌ وَخِمٌ وَوَخِيمٌ: ثَقِيلٌ. وَالتُّخَمَةُ مِنْ هَذَا، وَالتَّاءُ فِي الأَصْلِ وَاوٌ.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«وَخامَة: severity»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«وَخامَةُ المَرَض»"
          source: "المعجم الطبي الموحد (2009)"
          addition: >-
            تُستعمل وخامة في المصطلح الطبي الحديث مقترنةً بالمرض للدلالة على شدته
            وثِقَل عاقبته، وهو امتداد دلالي طبيعي من المعنى الأصيل (وَبَاء الشيء
            وعدم موافقته).

    - lemma: "وَبَالِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مُضِرِّيَّة"
      evidence_status: "no_material_found"

    - lemma: "خُبْث"
      contradicts:
        - text: "«الخَبَثُ: ما يَنفيه الكِيرُ من الحديد ونحوه عند إحمائه وطَرْقه. النَّجَسُ. (في علم الكيمياء): الشوائبُ المنصهرةُ التي تطفو على سطح الحديد المنصهر.»"
          source: "المعجم الوسيط (OCR)"
          conflict: >-
            المعنى الرئيسي: الشوائب المعدنية والنجاسة الشرعية. ليس ذا صلة مباشرة
            بـ «صفة كون الشيء غير صحي» بوصفها كيفيةً مجردة.
        - text: "«الخبث: النجاسة الحقيقية، كما أنّ الحدث هو النجاسة الحكمية»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777)"
          conflict: >-
            اصطلاح فقهي راسخ في باب الطهارة، لا في الطب أو الصحة العامة.
      expands:
        - text: "«(خَبُثَ) الخَاءُ وَالبَاءُ وَالثَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الطَّيِّبِ. يُقَالُ خَبِيثٌ أَيْ لَيْسَ بِطَيِّبٍ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            الدلالة الأصلية «خلاف الطيِّب» تُتيح نظريًّا توسعًا نحو «الضار»، غير
            أن الاستعمال المُصطلح عليه قصَرَه على النجاسة والخبث الأخلاقي.

    - lemma: "رَدَاءَة"
      contradicts:
        - text: "«الرِّدَاءَةُ: مِلْحَفَةٌ تُلْبَسُ كالرِّداءِ»"
          source: "المعجم الكبير (OCR)"
          conflict: >-
            الإدخال الكلاسيكي الوحيد المتاح هو الرِّدَاءَة (بكسر الراء) بمعنى ثوب
            يُلبَس، وهو كلمة مختلفة كليًّا عن رَدَاءَة (بفتح الراء) من رَدِيء.
            الاشتباه الصوتي يُعرِّض المصطلح للالتباس.
      expands:
        - text: "«أَرْدَأْتُ: أَفْسَدْتُ. وَرَدُؤَ الشَّيْءُ فَهُوَ رَدِيءٌ.»"
          source: "مقاييس اللغة لابن فارس (في مادة ردى)"
          addition: >-
            رَدِيء من جذر ردأ (مهموز) يُفيد الفساد والرداءة، لكن رَدَاءَة غير
            موثَّقة كمصطلح مستقل في حقل «اللاصحية».


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إِمْرَاض"
      decision: removed
      decision_reason: >-
        إمراض مصدر الفعل المتعدي «أمرض» يدل على العملية الديناميكية لتسبُّب المرض
        (pathogenesis)، وهو ما تؤكده المعاجم الطبية المتعددة بإجماع. أما المجموعة
        فتطلب «صفة كون الشيء غير صحي»، وهي صفة ثابتة لا فعلٌ مُتعدٍّ. الخلط بين
        مصدر العملية والصفة الكيفية يُشكِّل قصورًا دلاليًّا جوهريًّا؛ فإمراض يصف
        ما يفعله العامل الممرِض، لا ما يكون عليه الشيء في ذاته.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فَسَاد"
      decision: confirmed
      decision_reason: >-
        فساد يُعبِّر عن جانب التلف وخروج الشيء عن الصلاح وإلحاق الضرر، وهو ما
        يتضمن معنى «الضار بشكل عام» في السياق الصحي. دعمته المعجم الوسيط (التلف،
        إلحاق الضرر) والتوقيف (خروج عن الاعتدال يُستعمل في البدن). اجتاز اختبار
        الملاءمة الصرفية (مصدر فَعَال للصفة الدائمة) واختبار الاستبدال. غير أن
        استعماله أعمُّ من «الوخامة» ولا يختص بالدلالة الصحية وحدها؛ لذلك يُثبَّت
        بنية دلالية متمايزة عن أخته في المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        فَسَاد يُركِّز على التغيُّر التلفي وزوال الصلاح (خروج الشيء عن اعتداله)،
        ويمتد استعماله للفساد الأخلاقي والقانوني والمادي؛ أما وَخَامَة فتختص
        بالأثر الصحي الضار تحديدًا، وهي أخصُّ وأدقُّ في هذا الحقل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَسَاد"

    - lemma: "وَخَامَة"
      decision: confirmed
      decision_reason: >-
        وخامة هي الأدق دلالةً في هذا السياق؛ فالوَخِمُ في مقاييس اللغة هو «الوَبِيُّ
        من الشيء» (الضار غير الموافِق للصحة)، و«استوخمت البلاد» تعني بالضبط «وجدتها
        غير موافِقة للصحة». والتُّخَمَة مشتقة من هذا الجذر إشارةً إلى ثِقَل الطعام
        على البدن. صحة الدلالة وأصالتها وامتدادها في الاستعمال الطبي الحديث
        (وخامة المرض) تُعزِّز تثبيتها بوصفها اللمّة المحورية في المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        وَخَامَة تُركِّز على الثِّقَل الصحي وعدم موافقة الشيء للبدن وطبيعته الوَبِيَّة؛
        بينما فَسَاد أعمُّ يشمل الفساد بكلِّ صوره. وخامة هي الحدُّ الأخصُّ
        والمقابِل المباشر لـ unwholesomeness في الإنجليزية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَخَامَة"

    - lemma: "وَبَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود لهذه الكلمة في أيٍّ من المعاجم المستعلَمة. هي اشتقاق قياسي غير
        مُصكَّك لم يُثبِّته الاستعمال الفعلي. فشل اختبار التثبيت المعجمي.
      evidence_assessment:
        case: no_material

    - lemma: "مُضِرِّيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود لهذه الكلمة في المعاجم. مصدر صناعي حديث من مُضِرّ لم يُثبَّت
        معجميًّا ولم يتداوله الاستعمال العربي الفصيح. فشل اختبار التثبيت المعجمي.
      evidence_assessment:
        case: no_material

    - lemma: "خُبْث"
      source: stage1
      decision: removed
      decision_reason: >-
        خُبْث مصطلح فقهي راسخ في باب الطهارة بمعنى «النجاسة الحقيقية»، وهو بمعناه
        الأصيل «خلاف الطيِّب» يحمل ثِقَلاً أخلاقيًّا وطهاريًّا يمنع استعماله دلالةً
        مجردةً للإضرار بالصحة دون إيحاءات غير مقصودة. اختصاصه بحقل الطهارة الفقهية
        يجعله غير ملائم لهذا السياق.
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَدَاءَة"
      source: stage1
      decision: removed
      decision_reason: >-
        الشكل الموثَّق في المعاجم الكلاسيكية هو الرِّدَاءَة (بكسر الراء) بمعنى الثوب،
        وهو كلمة مختلفة عن رَدَاءَة (بفتح الراء) من رَدِيء. فشل اختبار الاستبدال
        الصوتي واللبس المعجمي الموثَّق. علاوةً على ذلك فإن رَدَاءَة أعمُّ دلالةً
        (سوء الجودة مطلقًا) ولا تختص بالحقل الصحي.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
