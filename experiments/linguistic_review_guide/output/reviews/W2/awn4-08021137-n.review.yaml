# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية «فضاء متري» مكتوبة بدون تشكيل؛ يجب تشكيلها كاملاً: «فَضَاءٌ مِتْرِيّ»"
      - "التعريف العربي يُغفل الشرط الرابع للمقياس: انعدام المسافة إذا وفقط إذا تزامنت النقطتان d(x,y)=0 iff x=y، وهو ركن أساسي يُميِّز الفضاء المتري عن شبه-الفضاء المتري"
      - "الضمير في «ويكون متماثلاً» غير صريح المرجع؛ يُوهم أن المتماثل هو الزوج أو المجموعة لا دالة المسافة"
    observations: "المجموعة تمثّل مفهوم «الفضاء المتري» (metric space) الذي نشأ في نهاية القرن التاسع عشر على يد فريشيه (Fréchet 1906)؛ وهو مجموعة مُزوَّدة ببنية هندسية تُقاس فيها المسافة بين كل زوج من نقاطها بشروط أربعة. الفضاء المتري أخص من الفضاء الطوبولوجي وأعم من الفضاء النظيم؛ إذ يقتصر على دالة مسافة دون اشتراط بنية جبرية. اللمّة «فضاء متري» تعريب مستقر رُصد في المعجم الموحد للرياضيات والفلك (1990)، وهو المرجع الرسمي للمصطلح في العربية."
  blind_candidates:
    - lemma: "فَضَاءٌ مَقِيسٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «فَضَاء» و«مَقِيس» (اسم مفعول من قَاسَ على وزن مَفْعُول)؛ أي الفضاء الذي عُيِّرت مسافاته ووُضع له معيار قياس. يستثمر الجذر العربي الأصيل «ق ي س» الدال على التعيير والمقارنة بمعيار. جرى استنفاد إمكانية المجاز قبل اللجوء إلى التركيب."
    - lemma: "فَضَاءُ الْقِيَاس"
      generation_method: tarkib
      justification: "مركب إضافي من «فَضَاء» و«القِيَاس»؛ يُسمِّي الفضاءَ بخاصيته التعريفية وهي وجود دالة قياس (مسافة). «القياس» في العربية يعني التعيير والموازنة بمعيار وهو أقرب شيء في التراث إلى المعنى الرياضي لـ«metric»."
    - lemma: "فَضَاءٌ قِيَاسِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «فَضَاء» و«قِيَاسِيّ» (نسبة إلى القياس)؛ بمعنى الفضاء المنسوب إلى معيار القياس أو المبني على بنية قياسية للمسافة. الوصف «قياسي» حيّ في العربية الحديثة بمعنى معياري/مقيس."
    - lemma: "فَضَاءٌ مِتْرِيّ"
      generation_method: taarib
      justification: "تعريب مباشر للصفة «metric» من اليونانية/الفرنسية بصيغة «مِتْرِيّ» مضافاً إلى «فَضَاء». التعريب ملاذ أخير لكنه مقبول هنا لأن اللفظ استقر في الكتابة الرياضية العربية، ويقبل لام التعريف (المِتْرِيّ) والنسبة والجمع السالم (فضاءات مترية)."


