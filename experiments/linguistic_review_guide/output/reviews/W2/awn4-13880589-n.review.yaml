# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13880589-n — contrariety / تَضَادّ
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تَضَادّ» مشتركة مع المجموعة الأمّ (awn4-13876846-n) التي تضمّ «تَضَادّ» و«تَعَارُض»، ممّا يُصعّب التمييز بين الطبقتين"
      - "المجموعة تحتوي لمّة واحدة فقط؛ يُستحسن إثراؤها بمرادفات تميّزها عن المجموعة الأعمّ"
    observations: >
      المفهوم المستهدف هو «التضادّ» بمعناه المنطقي الدقيق: العلاقة بين قضيّتين كلّيّتين
      لا يصحّ اجتماعهما ويصحّ ارتفاعهما معاً (مثل: كلّ إنسان أبيض / كلّ إنسان أسود).
      وهذا أخصّ من مطلق التعارض أو التقابل. في التراث العربي المنطقي يُفرَّق بين
      التضادّ (contrariety) والتناقض (contradiction) والتداخل (subcontrariety).
      المجموعة الأمّ تمثّل المفهوم الأعمّ «opposition»، فلا بدّ أن تتميّز هذه
      المجموعة بألفاظ تدلّ على خصوصية التضادّ دون التقابل العامّ.
  blind_candidates:
    - lemma: "تَضَادّ"
      generation_method: ishtiqaq
      justification: "مصدر تَفَاعُل من الجذر «ض د د»، يدلّ على التقابل المتبادل بين الأضداد، وهو المصطلح الأكثر تداولاً في المنطق والبلاغة العربيَّيْن"
    - lemma: "تَقَابُلُ الأَضْدَادِ"
      generation_method: tarkib
      justification: "مركّب إضافي يخصّص التقابل العامّ بإضافته إلى الأضداد، فيميّز المفهوم عن مطلق التقابل"
    - lemma: "مُضَادَّة"
      generation_method: ishtiqaq
      justification: "مصدر ميمي على وزن مُفَاعَلَة من الجذر «ض د د»، يدلّ على فعل التضادّ المتبادل بين طرفَيْن"
    - lemma: "ضِدِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «ضِدّ» بإلحاق ياء النسب وتاء التأنيث، يعبّر عن الصفة المجرّدة لكون الشيئين ضدَّيْن"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَضَادّ"
      confirm:
        - text: "«(في المنطق): التَّقابلُ بين مَعْنَيَيْن يندرجان تحت جنسٍ واحدٍ, وبينهما بعضُ الخلافِ»"
          source: "المعجم الكبير"
        - text: "«التضاد: كَون الشَّيْئَيْنِ الوجوديين مُتَقَابلين بِحَيْثُ لَا يكون تعقل كل مِنْهُمَا بِالْقِيَاسِ إِلَى الآخر كَمَا بَين السوَاد وَالْبَيَاض»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«التّضاد: بتشديد الدال يطلق على معان. منها التقابل والتنافي في الجملة... ومنها كون المعنيين بحيث يمتنع لذاتيهما اجتماعهما في محلّ واحد من جهة واحدة، والمعنيان يسمّيان بالمتضادين والضّدين، وهو من مصطلحات المتكلّمين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(تضَاد) الْأَمْرَانِ كَانَ أَحدهمَا ضد الآخر»"
          source: "المعجم الوسيط"
      expands:
        - text: "«تضاد = contrariety»"
          source: "مسرد الفلسفة وعلم النفس (ARABTERM)"
          addition: "تأكيد المقابلة الاصطلاحية الدقيقة بين تضادّ وcontrariety في مجال الفلسفة"
        - text: "«تَضَادٌّ = Antonymy، علاقة الضدين من حيث الدلالة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُبيّن أنّ التضادّ يُستعمل أيضاً في اللسانيات بمعنى علاقة التضادّ الدلالي"
        - text: "«تضادٌّ = antonymy، علاقة بين مفردتين تتسم باختلافهما المطلق في المعنى»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
          addition: "توسيع في المعنى اللساني للتضادّ"

    - lemma: "تَقَابُلُ الأَضْدَادِ"
      evidence_status: "no_material_found"

    - lemma: "مُضَادَّة"
      contradicts:
        - text: "«المناقضة: لغة: إبطال أحد القولين بالآخر. واصطلاحاً: منع مقدمة معينة من مقدمات الدليل» [قياساً: المُضَادَّة تدلّ على فعل المضادّة لا على العلاقة المجرّدة]"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "وزن مُفَاعَلَة يدلّ على الحدث والفعل المتبادل لا على العلاقة المجرّدة بين الأضداد"

    - lemma: "ضِدِّيَّة"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "تَضَادّ"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة بأدلة معجمية متعددة من المعجم الكبير والوسيط وكشّاف الاصطلاحات
        ودستور العلماء، وتطابق المقابلة الاصطلاحية الدقيقة في مسرد ARABTERM للفلسفة
        (تضاد = contrariety). المصطلح راسخ في التراث المنطقي والبلاغي العربي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَضَادّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَقَابُلُ الأَضْدَادِ"
      source: stage1
      decision: removed
      decision_reason: >
        مركّب إضافي لم يُعثَر له على شاهد معجمي كوحدة اصطلاحية ثابتة.
        يمكن إبدال «الأضداد» بـ«المتناقضات» أو «المتقابلات» ويبقى المعنى صالحاً
        (فشل في اختبار السَّكّ). كما أنّ «تقابل» بمفردها أعمّ من «تضادّ» وتنتمي
        للمجموعة الأمّ.
      evidence_assessment:
        case: no_material

    - lemma: "مُضَادَّة"
      source: stage1
      decision: removed
      decision_reason: >
        وزن مُفَاعَلَة يدلّ على الحدث والفعل المتبادل (act of opposing) لا على
        العلاقة المجرّدة بين الأضداد (the relation between contraries). المفهوم
        المستهدف اسم معنى (علاقة) لا اسم حدث.
      evidence_assessment:
        case: contradicts_only

    - lemma: "ضِدِّيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر لها على أيّ شاهد معجمي في القواعد المستعملة. لفظ غير مسكوك
        في المعاجم العربية الكلاسيكية ولا في المعاجم الاصطلاحية الحديثة.
        وإن كان القياس الصرفي سليماً (مصدر صناعي من ضِدّ) فإنّ غياب الاستعمال
        الفعلي يمنع إدراجها.
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "العلاقة بين المتضادات"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي فيه دَور (يعرّف التضادّ بالمتضادّات المشتقّة من نفس الجذر).
        كما أنّه لا يميّز التضادّ عن التناقض أو التقابل العامّ.
        يحتاج إلى جنس قريب وفصل نوعي يحدّدان خصوصية التضادّ المنطقي.
    authored:
      - type: terminological
        text: "نوعٌ من التقابل بين حُكمَيْن يمتنع اجتماعهما ولا يمتنع ارتفاعهما معاً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كونُ الشيئَيْن بحيث يمتنع اجتماعهما في محلٍّ واحد من جهة واحدة مع جواز ارتفاعهما معاً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نوعٌ من التقابل بين حُكمَيْن يمتنع اجتماعهما ولا يمتنع ارتفاعهما معاً"

  examples:
    per_lemma:
      - lemma: "تَضَادّ"
        examples:
          - text: "العلاقة بين «كلّ إنسان أبيض» و«كلّ إنسان أسود» علاقةُ تَضَادّ، إذ يمتنع صدقهما معاً ولا يمتنع كذبهما معاً."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "العلاقة بين «كلّ إنسان أبيض» و«كلّ إنسان أسود» علاقةُ تَضَادّ، إذ يمتنع صدقهما معاً ولا يمتنع كذبهما معاً."

