      params: {entity_type: entry, entity_id: "{auto}", key: note, value: '{"root":"كتل","maqayis":"«الْكَافُ وَالتَّاءُ وَاللَّامُ أُصَيْلٌ يَدُلُّ عَلَى تَجَمُّعٍ...»"}'}
    - command: set_metadata
      params: {entity_type: entry, entity_id: "{auto}", key: note, value: '{"root":"جمع","maqayis":"«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ...»"}'}
    - command: set_metadata
      params: {entity_type: entry, entity_id: "{auto}", key: note, value: '{"root":"رزم","maqayis":"«الرَّاءُ وَالزَّاءُ وَالْمِيمُ أَصْلَانِ مُتَقَارِبَانِ...»"}'}
    - command: set_metadata
      params: {entity_type: entry, entity_id: "{auto}", key: note, value: '{"root":"دفع","maqayis":"«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ...»"}'}
    - command: set_metadata
