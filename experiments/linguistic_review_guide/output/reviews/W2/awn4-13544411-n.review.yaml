stage1_review:
  assessment:
    observations: "المصطلح الحالي (تفاعل نووي) دقيق ومستقر علمياً، وهو المقابل المباشر والمعتمد للمصطلح الإنجليزي 'nuclear reaction'."
  blind_candidates:
    - lemma: "تَفَاعُل نَوَوِيّ"
      generation_method: tarkib
      justification: "المقابل المباشر والشائع علميا لوصف التغيرات في النوى الذرية."
    - lemma: "تَحَوُّل نَوَوِيّ"
      generation_method: tarkib
      justification: "يصف العملية الفيزيائية لتغير بنية النواة من عنصر لآخر."
    - lemma: "تَأَثُّر نَوَوِيّ"
      generation_method: tarkib
      justification: "للدلالة على خضوع النواة للتغير والتأثر الخارجي."
    - lemma: "نَشَاط نَوَوِيّ"
      generation_method: tarkib
      justification: "لوصف الفاعلية والحركية المرتبطة بالنوى الذرية وتغيراتها."

stage2_evidence:
  per_lemma:
    - lemma: "تفاعل نووي"
      confirm:
        - text: "تفاعل فيزيائي يتم خلاله تغير في تركيبة النواة."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "translation_en: nuclear reaction"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "تحول نووي"
      expands:
        - text: "translation_en: transmutation"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يُستخدم كمرادف لمفهوم الاستحالة والتحول (transmutation) وليس بالضرورة التفاعل العام."
    - lemma: "تأثر نووي"
      evidence_status: no_material_found
    - lemma: "نشاط نووي"
      contradicts:
        - text: "إشعاع تلقائي لنظائر مشعة (نواة ذرتها غير مستقرة) يتمثل في إشعاع مؤين..."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          conflict: "يعبر عن النشاط الإشعاعي (radioactivity / nuclear activity) وليس التفاعل النووي بمعناه الشامل."

stage3_analysis:
  per_lemma:
    - lemma: "تفاعل نووي"
      decision: confirmed
      decision_reason: "المصطلح هو المقابل القياسي والمستقر علمياً في المعاجم المتخصصة، ويعبر بدقة عن دلالة المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح الشامل الذي يشير إلى أي تغير في تركيب النواة سواء بالانشطار أو الاندماج أو غيرهما."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَاعُل نَوَوِيّ"
    - lemma: "تَحَوُّل نَوَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "المصطلح أقرب لمفهوم الاستحالة أو التحول الكيميائي/النووي (transmutation) منه إلى التفاعل الشامل."
    - lemma: "تَأَثُّر نَوَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير معتمد وغير مسكوك في المعاجم العلمية."
    - lemma: "نَشَاط نَوَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "يعبر عن النشاط الإشعاعي ولا يطابق مفهوم التفاعل المباشر المستهدف هنا."

stage4_content:
  definition:
    current: "(في الفيزياء) عملية تغير الطاقة أو البنية أو تكوين النوى الذرية"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن تحسين صياغته لتكون أكثر انسجاماً مع الأسلوب المعجمي العربي (تجنب التعبير الركيك 'أو تكوين النوى')."
    authored:
      - type: terminological
        text: "(في الفيزياء) تفاعُلٌ فيزيائيٌّ يَحْدُثُ فِيهِ تَغَيُّرٌ فِي تَرْكِيبِ النَّوَاةِ الذَّرِّيَّةِ أو طَاقَتِهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13544411-n"
          definition_index: 0
          text: "(في الفيزياء) تفاعُلٌ فيزيائيٌّ يَحْدُثُ فِيهِ تَغَيُّرٌ فِي تَرْكِيبِ النَّوَاةِ الذَّرِّيَّةِ أو طَاقَتِهَا."
  examples:
    per_lemma:
      - lemma: "تفاعل نووي"
        examples:
          - text: "أَدَّى التَّفَاعُلُ النَّوَوِيُّ فِي الْمُفَاعِلِ إِلَى تَوْلِيدِ كَمِّيَّةٍ هَائِلَةٍ مِنَ الطَّاقَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-13544411-n"
          text: "أَدَّى التَّفَاعُلُ النَّوَوِيُّ فِي الْمُفَاعِلِ إِلَى تَوْلِيدِ كَمِّيَّةٍ هَائِلَةٍ مِنَ الطَّاقَةِ."

