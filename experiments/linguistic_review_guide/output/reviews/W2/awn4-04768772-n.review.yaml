# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04768772-n | ILI: i62039
# المفهوم: immateriality / incorporeality
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء) ───────────────────
stage1_review:
  assessment:
    concerns:
      - "رُوحَانِيَّة تحمل دلالات روحية ودينية في كثير من استعمالاتها (spiritualism / spirituality) قد تتجاوز المعنى الأنطولوجي المحايد لـ incorporeality؛ المعاجم الحديثة تترجمها بـ spiritualism لا بـ immateriality"
      - "التعريف الحالي يتضمن تكراراً دلالياً: 'صفة عدم كون الشيء مادياً' و'عدم التكون من مادة' يُعبِّران عن المعنى نفسه بصياغتين مختلفتين دون فصل نوعي حقيقي"
      - "المجموعة تفتقر إلى التَّجَرُّد، المصطلح الفلسفي التراثي الذي وثّقه التهانوي بتعريف مطابق للمفهوم: 'كون الشيء بحيث لا يكون مادة ولا مقارناً للمادة'"
    observations: |
      المجموعة تُعالج مفهوم الـ incorporeality / immateriality، وهو الخاصية الأنطولوجية لكون الشيء خالياً من الجوهر المادي.
      لَا مَادِّيَّة مصطلح حديث دقيق موثّق في المورد الحديث بوصفه المقابل العربي المباشر لـ immateriality.
      رُوحَانِيَّة أوسع دلالةً وتُحيل في الغالب إلى روحانية القيم أو المذهب الروحاني (spiritualism)، مما يجعلها أقل دقةً للمعنى الأنطولوجي البحت.
      التَّجَرُّد مصطلح فلسفي إسلامي راسخ يُعبّر عن هذا المفهوم بدقة في الفلسفة العربية الكلاسيكية.
      اللَّطَافَة في الاصطلاح تعني رقة القوام لا غياب المادة بالكلية — وهي صفة في الأجسام اللطيفة المادية.

  blind_candidates:
    - lemma: "اللَّطَافَة"
      generation_method: majaz
      justification: "اللطيف في الاصطلاح الفلسفي العربي ما كان رقيق القوام خفياً عن الحواس الكثيفة؛ يُستعار للدلالة على ما يقارب عدم المادية في بعض السياقات الكلاسيكية"
    - lemma: "التَّجَرُّد"
      generation_method: ishtiqaq
      justification: "من جذر جرد على وزن تفعُّل (مصدر تجرّد)، يدل على الخلوص والانسلاخ من الهيئة المادية؛ مصطلح فلسفي راسخ في الكلام والفلسفة الإسلامية"
    - lemma: "اللَّاجِسْمِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي سلبي من: لا + جسمية، يُقابل incorporeality مباشرةً في الدلالة، ويتوازى مع لامادية في منهج التصيغ بالنفي"
    - lemma: "الرُّوحَانِيَّة"
      generation_method: ishtiqaq
      justification: "من جذر روح على وزن فُعْلانية، تدل على الطبيعة غير المادية ذات الصلة بالروح؛ مستعملة في الفلسفة العربية للدلالة على ما ليس جسداً ماديا"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفّذة (٥ استعلامات):
#   ١. مطابقة دفعية: روحانية+الروحانية، لامادية+اللامادية،
#      لطافة+اللطافة، تجرد+التجرد، لاجسمية+اللاجسمية
#   ٢. الجسر الإنجليزي: immateriality, incorporeality, incorporeal,
#      immaterial, non-material, spirituality
#   ٣. إثراء بالمعرّف: entry_ids 819109, 40148, 820499, 694226
#   ٤. FTS كلمات مفتاحية: لامادي، غير مادي، لا مادي، الروحاني
#   ٥. مقاييس اللغة: جذور روح، جرد، لطف
stage2_evidence:
  per_lemma:

    - lemma: "رُوحَانِيَّة"
      confirm:
        - text: "«مصطلح لاهوتي فلسفي يستعمل بدلالات: في الأنطولوجيا الألمانية: نظرية تذهب إلى القول بوجود جوهرين مستقلين: الروح والمادة؛ في الفلسفة الفرنسية: المذهب التصوري اللامادي لأندريه لالاند؛ في علم النفس: القول بأن العمليات الذهنية والأفعال الإرادية ليست مردودة بالإطلاق إلى الظواهر الفسيولوجية»"
          source: "المعجم الكبير، مجمع اللغة العربية"
      contradicts:
        - text: "«روحانية: مذهب روحي — translation_en: spiritualism»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "تُترجَم بـ spiritualism (المذهب الروحاني) وهو أضيق من immateriality ولا يُعادلها أنطولوجياً"
        - text: "«روحانية — translation_en: spirituality»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "تُترجَم بـ spirituality (التعلّق بالقيم الروحية) وهو مفهوم مختلف عن incorporeality"
      expands:
        - text: "«يُرَوْحِن: يجعله روحياً أو لاماديًّا»"
          source: "المورد الحديث (2008)"
          addition: "يقترن الفعل يُرَوْحِن بالمعنيَيْن (روحي + لامادي) معاً، مما يكشف عن تقاطع دلالي حقيقي بين الروحانية واللامادية في الاستعمال الحديث"
        - text: "«(الروحاني) ما فيه الروح ونسبة إلى الروح»"
          source: "المعجم الوسيط"
          addition: "تأسيس الدلالة على الروح لا على غياب المادة مباشرة؛ يُؤكّد التمييز الدقيق بين الروحانية واللامادية"

    - lemma: "لَا مَادِّيَّة"
      confirm:
        - text: "«(1) اللّامادّيّة (2) شيء لاماديّ — translation_en: immateriality»"
          source: "المورد الحديث (2008)"
        - text: "«(1) لاماديّ؛ روحيّ (2) غير هامّ — translation_en: immaterial»"
          source: "المورد الحديث (2008)"
        - text: "«(1) لامادّيّ (2) روحيّ (3) ثقافيّ؛ جَماليّ — translation_en: nonmaterial»"
          source: "المورد الحديث (2008)"

    - lemma: "اللَّطَافَة"
      contradicts:
        - text: "«اللطافة بالفتح يطلق على معان أربعة: الأول رقّة القوام أعني سهولة قبول الأشكال الغريبة وتركها أي الكيفية المقتضية لتلك السهولة، وهي على هذا التفسير نفس الرطوبة التي هي من الملموسات. الثاني قبول الانقسام إلى أجزاء صغيرة جدا. الثالث سرعة التأثّر عن الملاقي. الرابع الشفافية وهي على هذا التفسير لا تكون من المملوسات»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (ت. ١٧٧٧م)"
          conflict: "اللطافة في الاصطلاح الفلسفي صفة في الأجسام ذات القوام الرقيق (كالهواء والنار)، لا وصف لغياب المادة بالكلية؛ صريح التهانوي أن المعنى الأول منها هو من الملموسات"

    - lemma: "التَّجَرُّد"
      confirm:
        - text: "«التجرد:[في الانكليزية] The abstract [في الفرنسية] L'abstrait في اللغة الخلوّ، وعند الحكماء عبارة عن كون الشيء بحيث لا يكون مادة ولا مقارناً للمادة مقارنة الصورة والأعراض، كذا في شرح التجريد»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (ت. ١٧٧٧م)"
      contradicts:
        - text: "«تجرّد: وهي عملية تساقط الحراشيف وما إليها من أجزاء نباتية — translation_en: exuviation»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)، ALECSO ArabTerm"
          conflict: "في علم الأحياء تجرّد = تساقط الحراشيف؛ اشتراك لفظي لا يمسّ المعنى الفلسفي الفصيح"
      expands:
        - text: "«مُجردات — translation_en: intangible; immaterial»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)، ALECSO ArabTerm"
          addition: "جمع مُجرَّد (وليس مُتجرِّد) يُترجَم بـ intangible/immaterial، مما يُثبّت عائلة الجذر جرد في حقل دلالة اللامادي"

    - lemma: "اللَّاجِسْمِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "رُوحَانِيَّة"
      decision: confirmed
      decision_reason: |
        رُوحَانِيَّة موثّقة في المعجم الكبير بوصفها مصطلحاً لاهوتياً فلسفياً يتضمن بين دلالاته
        المذهبَ التصوري اللامادي (في الفلسفة الفرنسية) وثنائية الروح والمادة (في الأنطولوجيا الألمانية).
        رغم أن دلالتها أوسع من immateriality البحتة وقد تُفيد spiritualism أحياناً، فإن التقاطع
        الدلالي مع اللامادي راسخ ومعروف في التراث الفلسفي العربي؛ يُبقى عليها مع توثيق الفرق الدلالي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُبرز الجانب الروحي-الوجودي في اللامادية، مستعملة في الخطاب الفلسفي والديني حين يُراد التأكيد على الطابع الروحي للجوهر غير المادي لا مجرد خلوّه من الجسد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُوحَانِيَّة"

    - lemma: "لَا مَادِّيَّة"
      decision: confirmed
      decision_reason: |
        لَا مَادِّيَّة مصطلح حديث دقيق موثّق في المورد الحديث بوصفه المقابل العربي الصريح لـ immateriality.
        صياغته السلبية (لا + مادية) محايدة الإيحاء، مناسبة للخطاب الفلسفي الأنطولوجي التحليلي.
        اطّرادها الاشتقاقي واضح ويَقيسُ على: لا أخلاقية، لا عقلانية، لا مركزية، وغيرها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تُعبّر بصياغة سلبية محايدة عن الخلوّ من الجوهر المادي دون إيحاء روحي أو ديني؛ الأدقّ أنطولوجياً والأصلح للخطاب الفلسفي التحليلي والعلمي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَا مَادِّيَّة"

    - lemma: "اللَّطَافَة"
      source: stage1
      decision: removed
      decision_reason: |
        اللطافة في الاصطلاح الفلسفي صفة في الأجسام ذات القوام الرقيق (كالهواء والنار)، وصريح التهانوي
        أن المعنى الأول منها من الملموسات. هي تصف الجسم اللطيف لا المجرَّد من المادة بالكلية؛
        لا تُطابق immateriality بل هي دلالياً نقيضة لها إذ تبقى في دائرة المادة لكنها رقيقتها.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَجَرُّد"
      source: stage1
      decision: confirmed
      decision_reason: |
        التجرد موثّق في كشاف التهانوي بتعريف مطابق تاماً للمفهوم: "كون الشيء بحيث لا يكون مادة
        ولا مقارناً للمادة". وهو مصطلح فلسفي إسلامي راسخ (ابن سينا، الغزالي، الملا صدرا).
        الاشتراك اللفظي في علم الأحياء (exuviation) مقيَّد بسياق مخصوص لا يُلبِّس في الخطاب الفلسفي.
        يُضاف إلى المجموعة ليمثّل الاستعمال الفلسفي التراثي المقابل للاستعمال الحديث.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبّر بصيغة المصدر الديناميكية عن حالة الانسلاخ من المادة وعدم الاقتران بها؛ الأنسب للسياق الفلسفي الكلاسيكي حيث يُوصف به تجرّد الروح والعقل الفعّال"
      actions:
        - command: create_entry
          params:
            lemma: "تَجَرُّد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اللَّاجِسْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: |
        لا شاهد معجمي يُثبّتها كمصطلح متداول في أي معجم كلاسيكي أو حديث. يكفي وجود
        لَا مَادِّيَّة لأداء الوظيفة نفسها بصورة أوسع توثيقاً وأكثر استعمالاً.
      evidence_assessment:
        case: no_material


