stage1_review:
  assessment:
    concerns:
      - "اللمة (فصيلة) تمثل ترجمة مقيدة بالسياق العسكري (بمعنى تشكيل من الجيش) أو البيولوجي (بمعنى فصيلة نباتية/حيوانية)، ولا تُستخدم في العربية المعاصرة لتدل على مجرد مجموعة من الأشخاص يشاركون في نشاط عام."
      - "التعريف العربي دقيق كترجمة، ولكنه يوحي بحرفية النقل، ويمكن صياغته بأسلوب معجمي عربي طبيعي يعكس معنى تجمع هؤلاء الأشخاص أو حركتهم."
    observations: "المعنى المستهدف في هذه المجموعة الترادفية يطابق الاستخدام المجازي للكلمة الإنجليزية (platoon) كقولنا 'platoons of tourists'. يقابل هذا المعنى في العربية بامتياز كلمة (فَوْج) التي تدل على جماعة من الناس يجمعهم نشاط مشترك كالسفر أو الحج ويتحركون معاً. كلمة (مجموعة) مناسبة أيضاً كدلالة عامة."
  blind_candidates:
    - lemma: "فَرِيق"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ف ر ق)، ويُستخدم للدلالة على جماعة تتعاون في عمل أو نشاط واحد."
    - lemma: "طَاقَم"
      generation_method: taarib
      justification: "كلمة معربة شاع استخدامها لجماعة من الناس مكلّفة بإنجاز عمل أو تشغيل آلة كطاقم السفينة."
    - lemma: "فِرْقَة"
      generation_method: ishtiqaq
      justification: "مشتق من الافتراق والتجمع، وتُطلق على طائفة من الناس يؤدون نشاطاً منظماً كفرقة التمثيل أو الرياضة."
    - lemma: "زُمْرَة"
      generation_method: ishtiqaq
      justification: "جماعة من الناس يجمعهم رابط واحد، وتستخدم للتعبير عن التجمعات البشرية."

stage2_evidence:
  per_lemma:
    - lemma: "فصيلة"
      contradicts:
        - text: "«(الفصيلة) ... (فِي النَّبَات وَالْحَيَوَان) جملَة أَجنَاس لَهَا صِفَات مُشْتَركَة وَفرْقَة من الْجَيْش»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "تقتصر دلالتها على التشكيل العسكري والبيولوجي ولا تدل على المجموعات البشرية العامة التي تتشارك في نشاط."
    - lemma: "فوج"
      confirm:
        - text: "«(الفوج) الْجَمَاعَة من النَّاس وَالْجَمَاعَة الْمَارَّة السريعة (ج) فؤوج وأفواج»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "مجموعة"
      evidence_status: "no_material_found"
    - lemma: "فَرِيق"
      expands:
        - text: "«(الْفَرِيق) الطَّائِفَة من النَّاس أكبر من الْفرْقَة... ورتبة من رتب الْجَيْش الْعليا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يدل على التجمعات المنظمة التي تتعاون في عمل (Team) وله مجموعة ترادفية مستقلة."
    - lemma: "طَاقَم"
      expands:
        - text: "«مجموعةٌ مُتكاملةٌ من الأفرادِ مُكَلَّفَةٌ بعمل معيَّن. يقال: طاقِمُ السَّفِينةِ, أو الطّائرةِ, أو الخِدْمَة»"
          source: "المعجم الكبير"
          addition: "يدل على طاقم التشغيل (Crew) وله مجموعة ترادفية مستقلة."
    - lemma: "فِرْقَة"
      expands:
        - text: "«(الْفرْقَة) الطَّائِفَة من النَّاس يُقَال فرقة التَّمْثِيل وَفرْقَة الألعاب...»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "تُستخدم للفرق الفنية والرياضية المتخصصة."
    - lemma: "زُمْرَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "فصيلة"
      decision: removed
      decision_reason: "استخدام هذه الكلمة يقتصر على السياق العسكري البحت (فصيلة جنود) أو التصنيف البيولوجي، ولا تستخدم في العربية المعاصرة لتدل على مجرد مجموعة من الأشخاص يشاركون في نشاط عام كالسياح."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "فوج"
      decision: confirmed
      decision_reason: "كلمة دقيقة ومناسبة للتعبير عن المجموعات البشرية التي تتحرك معاً أو تتشارك نشاطاً (كأفواج السياح)، وتطابق الاستخدام الإنجليزي المعني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَوْج"
    - lemma: "مجموعة"
      decision: confirmed
      decision_reason: "مصطلح عام وشائع للتعبير عن عدد من الأشخاص يتشاركون غاية أو نشاطاً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوعَة"
    - lemma: "فَرِيق"
      source: stage1
      decision: removed
      decision_reason: "مرادف متخصص لمعنى (Team) وله مجموعة ترادفية خاصة به، ويشير إلى التنظيم والتعاون لتحقيق هدف محدد."
      evidence_assessment:
        case: expands
    - lemma: "طَاقَم"
      source: stage1
      decision: removed
      decision_reason: "مرادف متخصص لمعنى (Crew) ويطلق على المجموعة المكلفة بتشغيل مركبة أو إنجاز مهمة، وله مجموعة ترادفية."
      evidence_assessment:
        case: expands
    - lemma: "فِرْقَة"
      source: stage1
      decision: removed
      decision_reason: "تُستخدم عادة في السياقات الفنية أو العسكرية، ولا تناسب شمولية المعنى المستهدف هنا."
      evidence_assessment:
        case: expands
    - lemma: "زُمْرَة"
      source: stage1
      decision: removed
      decision_reason: "تأخذ أحياناً طابعاً سلبياً (عصبة) ولا تتميز بالحيادية التامة المطلوبة للتعريف العام."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "مجموعة من الأشخاص يشاركون في نشاط مشترك"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول لكن صياغته تبدو كترجمة حرفية. يمكن تحسينه ليبرز طبيعة حركة التجمع وارتباط أفراده بغاية مشتركة."
    authored:
      - type: terminological
        text: "جماعة من الناس يجمعهم نشاط واحد أو غاية مشتركة، وغالباً ما ينتظمون أو يتحركون معاً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "جماعة من الناس يجمعهم نشاط واحد أو غاية مشتركة، وغالباً ما ينتظمون أو يتحركون معاً."
  examples:
    per_lemma:
      - lemma: "فَوْج"
        examples:
          - text: "تتدفق أفواج السياح على المعالم الأثرية في المدينة منذ الصباح الباكر."
            type: usage
      - lemma: "مَجْمُوعَة"
        examples:
          - text: "كوّن الطلاب مجموعة دراسية لمراجعة الدروس بانتظام."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تتدفق أفواج السياح على المعالم الأثرية في المدينة منذ الصباح الباكر."

stage5_enrichment:
  per_entry:
    - lemma: "فَوْج"
      entry_id: "{auto}"
      root: "فوج"
      maqayis_quote: "«الْفَاءُ وَالْوَاوُ وَالْجِيمُ كَلِمَةٌ تَدُلُّ عَلَى تَجَمُّعٍ. مِنْ ذَلِكَ الْفَوْجُ، الْجَمَاعَةُ مِنَ النَّاسِ»"
    - lemma: "مَجْمُوعَة"
      entry_id: "{auto}"
      root: "جمع"
  per_sense:
    - lemma: "فَوْج"
      sense_id: "{auto}"
      nuance: "يُستخدم للتعبير عن التجمعات البشرية التي تتحرك معاً أو تأتي دفعة واحدة، كالسياح والحجاج."
      mwe: false
    - lemma: "مَجْمُوعَة"
      sense_id: "{auto}"
      nuance: "مصطلح عام ومحايد يطلق على أي عدد من الأشخاص يجمعهم رابط مشترك أو نشاط واحد."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فوج","maqayis":"«الْفَاءُ وَالْوَاوُ وَالْجِيمُ كَلِمَةٌ تَدُلُّ عَلَى تَجَمُّعٍ. مِنْ ذَلِكَ الْفَوْجُ، الْجَمَاعَةُ مِنَ النَّاسِ»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جمع"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُستخدم للتعبير عن التجمعات البشرية التي تتحرك معاً أو تأتي دفعة واحدة، كالسياح والحجاج.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح عام ومحايد يطلق على أي عدد من الأشخاص يجمعهم رابط مشترك أو نشاط واحد.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95