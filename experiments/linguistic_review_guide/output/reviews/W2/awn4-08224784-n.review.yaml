stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي حرفي إلى حد ما ولا يعكس الاستخدام الاصطلاحي العربي لكلمة 'قوة' بهذا المعنى (كأن نقول: قوة الشرطة)، بل يبدو كترجمة مباشرة للتعريف الإنجليزي."
    observations: "تستخدم كلمة 'قوة' مجازاً في العربية المعاصرة للدلالة على جماعة من الناس أو هيئة ذات فعالية وتأثير (مثل القوة العاملة، القوات المسلحة)، وهو استخدام شائع جداً ومستقر."
  blind_candidates:
    - lemma: "قُوَّة"
      generation_method: majaz
      justification: "تستخدم مجازاً للدلالة على مجموعة من الأفراد يشكلون كياناً مؤثراً كالقوة العسكرية أو الأمنية."
    - lemma: "جِهَاز"
      generation_method: majaz
      justification: "تطلق على الطائفة من الناس التي تؤدي عملاً دقيقاً ومنظماً كمؤسسة أو هيئة."
    - lemma: "فِرْقَة"
      generation_method: ishtiqaq
      justification: "مشتقة من التفريق بمعنى الجماعة المنفردة والمخصصة لعمل معين."
    - lemma: "فَرِيق عَمَل"
      generation_method: tarkib
      justification: "مركب إضافي يدل على مجموعة من الأفراد يوكل إليهم إنجاز مهمة بفعالية."

stage2_evidence:
  per_lemma:
    - lemma: "قُوَّة"
      confirm:
        - text: "«والقوات المسلحة فيالق الجيش في البر والبحر والجو (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«وتنقسم إلى طبيعية وحيوية وعقلية كما تنقسم إلى باعثة وفاعلة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يضيف تقسيمات القوة واستخداماتها."
    - lemma: "جِهَاز"
      confirm:
        - text: "«والطائفة من الناس تؤدي عملا دقيقا يقال جهاز الدعاية وجهاز الجاسوسية (ج) أجهزة (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«جَماعَةٌ أو هيئة من النَّاسِ تُؤدِّى عَمَلًا مُعَيَّنًا ، مثل الجهاز المَرْكَزِى للتَّنْظِيم والإدارة»"
          source: "المعجم الكبير"
    - lemma: "فِرْقَة"
      confirm:
        - text: "«الطَّائِفَة من النَّاس يُقَال فرقة التَّمْثِيل وَفرْقَة الألعاب وَفرْقَة المطافئ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "فَرِيق عَمَل"
      confirm:
        - text: "«فريق مسؤول عن إعداد خطة استراتيجية... من مهامه ترجمة متطلبات واقتراحات هذه اللجنة إلى تدابير عملية قابلة للتطبيق»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"

stage3_analysis:
  per_lemma:
    - lemma: "قوة"
      decision: confirmed
      decision_reason: "كلمة معتمدة وشائعة الاستخدام بمعناها الجماعي والمؤسسي (مثل القوات المسلحة أو قوة العمل)، وتتوافق تماماً مع المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُوَّة"
    - lemma: "جِهَاز"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع يشير إلى هيئة أو طائفة من الناس تؤدي عملاً متخصصاً أو دقيقاً، وهو مرادف قوي للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "جِهَاز", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فِرْقَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعني طائفة من الناس مجتمعة لهدف أو عمل محدد، وهي مطابقة تماماً للمفهوم في السياقات التنظيمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فِرْقَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فَرِيق عَمَل"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير اصطلاحي شائع ومستقر للدلالة على مجموعة من الأفراد اجتمعوا للقيام بعمل فعال ومشترك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "فَرِيق عَمَل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "مجموعة من الناس لديهم القدرة على العمل الفعال"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو كترجمة حرفية، ينبغي صياغته بأسلوب معجمي عربي يعكس المعنى الجماعي الوظيفي بوضوح أكبر."
    authored:
      - type: terminological
        text: "جَمَاعَةٌ أو طَائِفَةٌ مِنَ النَّاسِ مُنَظَّمَةٌ، لَهَا الْقُدْرَةُ وَالسُّلْطَةُ عَلَى أَدَاءِ عَمَلٍ مُؤَثِّرٍ وَفَعَّالٍ فِي مَجَالٍ مُعَيَّنٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "جَمَاعَةٌ أو طَائِفَةٌ مِنَ النَّاسِ مُنَظَّمَةٌ، لَهَا الْقُدْرَةُ وَالسُّلْطَةُ عَلَى أَدَاءِ عَمَلٍ مُؤَثِّرٍ وَفَعَّالٍ فِي مَجَالٍ مُعَيَّنٍ."}
  examples:
    per_lemma:
      - lemma: "قُوَّة"
        examples:
          - text: "تَحَرَّكَتْ قُوَّةٌ مِنَ الشُّرْطَةِ لِتَأْمِينِ الْمِنْطَقَةِ."
            type: usage
      - lemma: "جِهَاز"
        examples:
          - text: "أَصْدَرَ جِهَازُ الْأَمْنِ تَقْرِيراً حَوْلَ الْحَادِثِ."
            type: usage
      - lemma: "فِرْقَة"
        examples:
          - text: "تَمَكَّنَتْ فِرْقَةُ الْإِنْقَاذِ مِنْ إِخْلَاءِ الْمُصَابِينَ."
            type: usage
      - lemma: "فَرِيق عَمَل"
        examples:
          - text: "شَكَّلَتِ الشَّرِكَةُ فَرِيقَ عَمَلٍ لِدِرَاسَةِ الْمَشْرُوعِ وَتَنْفِيذِهِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَحَرَّكَتْ قُوَّةٌ مِنَ الشُّرْطَةِ لِتَأْمِينِ الْمِنْطَقَةِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أَصْدَرَ جِهَازُ الْأَمْنِ تَقْرِيراً حَوْلَ الْحَادِثِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَمَكَّنَتْ فِرْقَةُ الْإِنْقَاذِ مِنْ إِخْلَاءِ الْمُصَابِينَ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "شَكَّلَتِ الشَّرِكَةُ فَرِيقَ عَمَلٍ لِدِرَاسَةِ الْمَشْرُوعِ وَتَنْفِيذِهِ."}

