# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-92421955-n
# الموضوع: الطابع اللاتفي / خاصية الانتساب إلى لاتفيا
# التاريخ: 2026-03-17
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # التوليد الأعمى — انطلاقاً من التعريف فقط، قبل الاطلاع على اللمّات
  # التعريف المُقنَّع: "حالة أو جودة كون الشيء لاتفياً"
  # الأعلى الدلالي: "خاصّيّة أساسيّة مشتركة بين جميع أفراد صنف ما"
  # → المفهوم: خاصيّة مجردة تتعلق بالانتساب إلى لاتفيا (Latvia)

  blind_candidates:
    - lemma: "اللاتِفيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي من النسبة (لاتِفيّ + ـيَّة) وهو القياس المطّرد في العربية
        لتجريد صفات الانتساب القومي؛ يوازي "الإنجليزيّة" و"الفرنسيّة" بوصفها
        مصطلحات لخصائص الانتماء، لا لأسماء اللغات فحسب.

    - lemma: "الطَّابَع اللاتِفيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي (wasfi) من "الطابَع" بمعنى الخُلُق الغالب والسجيّة (كما في
        المعجم الوسيط)، و"اللاتفي" نسبةً إلى لاتفيا. يُعبِّر عن مجموع
        السمات الثقافية والقومية التي تُميِّز المنتسبَ إلى لاتفيا.

    - lemma: "الصِّفَة اللاتِفيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي (wasfi) من "الصفة" بمعنى الخاصيّة والسمة، و"اللاتفية"
        للنسبة. أقرب إلى المصطلح الفلسفي المعيار لـ"attribute/property of
        being X."

    - lemma: "اللاتِفانيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن فَعْلانيَّة (صيغة مزيدة بالنون للدلالة على الامتداد
        والتشبّع)؛ تُفيد الاستغراق في الخصائص اللاتفية، وتتميّز عن "اللاتفية"
        بإزالة الاشتراك مع اسم اللغة، لكنها غير مألوفة في قياس الجنسيات.

  assessment:
    concerns:
      - "اللمّة الوحيدة 'الطابع اللاتفي' عبارة وصفية حرة (free phrase) لا تجتاز
        اختبار السكّ: يمكن إبدال 'الطابع' بـ'الطبيعة' أو 'الصفة' مع بقاء المعنى
        الوصفي ذاته، مما يدل على أنها ليست وحدة معجمية ثابتة."
      - "التشكيل ناقص في اللمّة الموجودة ('الطابع اللاتفي' بلا حركات)."
      - "المفهوم — خاصيّة الانتساب القومي — تشحّ له التسمية المفردة في العربية؛
        وهذا يُشير إلى 'فجوة معجمية' (lexical_gap) حقيقية."
      - "الاعتماد على مركب وصفي بدلاً من المصدر الصناعي يُفضي إلى التباس مع
        مفهوم 'الطابع البريدي' اللاتفي (postage stamp) في سياقات تداولية أخرى."
    observations: >
      تنتمي هذه المجموعة إلى نسق منظومي متكرر في AWN4 يُعالج خصائص الانتساب
      القومي لكل الجنسيات (قياساً على synsets من نوع "the quality of being X").
      الإشكالية اللغوية المركزية أن العربية تعتمد المصدر الصناعي (لاتفيَّة) لهذا
      المعنى، لكن هذه الصيغة ذاتها تحمل دلالة "اللغة اللاتفية" في المعاجم المعاصرة
      (المورد الحديث 2008)، مما يُفرز تعدّداً دلالياً. المركّب الوصفي "الطابع
      اللاتفي" يتفادى هذا الالتباس بمعنى اللغة، غير أنه يقع في التباس آخر مع
      "الطابع" بمعنى الختم والطابع البريدي. الجذر (ط ب ع) غنيٌّ دلالياً ومعتمَد
      في الإطار المعجمي العربي للدلالة على الخُلُق والسجيّة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:

  # === الاستعلامات المُنفَّذة ===
  # ١. مطابقة دقيقة دفعية: لمّات موجودة + مرشحات + مكوّنات
  #    → entry_ids محصّلة: 877145, 17113, 17112, 59829, 59827, 59828 (الطابع)
  #                        746393 (لاتفيا), 746394 (جمهورية لاتفيا...)
  # ٢. جسر إنجليزي: Latvian / Latvianness / Latvia
  #    → entry_ids: 697766 (المورد الحديث), 746393, 746394
  # ٣. FTS عربي: كلمات مفتاحية (لاتفي، لاتفيا، لاتفية)
  #    → لا نتائج جديدة بعد استثناء المُجلَبة
  # ٤. مقاييس اللغة لجذر (طبع):
  #    → entry_id: [مُجلَب مباشرة، dictionary_id=151]

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "الطابع اللاتفي"
      expands:
        - text: >
            «الطَّابَع: الطبيعة.»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: >
            يُثبت أن "الطابَع" مرادف "الطبيعة" في المعجم الوسيط، مما يدعم
            استخدامه في المركّب "الطابع اللاتفي" بمعنى الطبيعة أو السجيّة
            المميزة للاتفيين.
        - text: >
            «الطَّابَعُ: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ.»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            يعضد توظيف "الطابع" في سياق الخصائص الجوهرية القومية؛ إذ الخليقة
            والسجيّة هما المقوّمات الثابتة في الفرد أو الجماعة.
        - text: >
            «(الطَّابِع) العَلَامَةُ الْمُمَيِّزَةُ.»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            دلالة "العلامة المميّزة" تُقرّب "الطابع" من مفهوم الـ'distinguishing
            quality' وهو المقصود في هذا السياق.
        - text: >
            «طَابَع: من (ط ب ع) الخلق الغالب وما يطبع به أو يختم.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يُعمِّق دلالة الطابع الفطري الغالب في السجيّة، وهو ما يجعله
            ملائماً للتعبير عن الخصائص الجوهرية الكامنة في انتماء قومي.

    # ── مرشّح المرحلة ١: اللاتفيَّة ──
    - lemma: "اللاتِفيَّة"
      contradicts:
        - text: >
            «(2) اللاتفيّة: لغة اللاتفيّين.»
          source: "المورد الحديث (2008) — ARABTERM"
          conflict: >
            المعجم يُخصّص "اللاتفية" صراحةً لأسم اللغة اللاتفية، لا لخاصيّة
            الانتساب القومي المجردة؛ تعدّدٌ دلالي يُفسد الدقة المصطلحية.

    # ── مرشّح المرحلة ١: الصفة اللاتفية ──
    - lemma: "الصِّفَة اللاتِفيَّة"
      evidence_status: "no_material_found"

    # ── مرشّح المرحلة ١: اللاتفانية ──
    - lemma: "اللاتِفانيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────
stage3_analysis:
  per_lemma:

    # ─────────────────────────────────────────────────────────
    # ١. اللمّة الموجودة: الطابع اللاتفي
    # ─────────────────────────────────────────────────────────
    - lemma: "الطابع اللاتفي"
      decision: confirmed
      decision_reason: >
        اللمّة المركّبة وصفية من جزأين: "الطَّابَع" (الخُلُق الغالب، العلامة
        المميّزة) + "اللاتِفيّ" (نسبة إلى لاتفيا). رغم أن المركب لا يُسجَّل
        كوحدة معجمية ثابتة في قواعد البيانات، فإنه الخيار الأوفق إذ يتفادى
        الالتباس مع "اللاتفية = اللغة". القرار بالإبقاء مع تصحيح التشكيل
        وإضافة ملاحظة حول طبيعته الوصفية.
      evidence_assessment:
        case: mixed
        note: >
          "الطابع" مُوثَّق توثيقاً قوياً بمعنى الخلق الغالب (confirm)؛ غير أن
          المركّب الكامل "الطابع اللاتفي" غائب عن المعاجم كوحدة مسكوكة (لا
          توثيق مباشر). يُعدّ الدليل موسِّعاً (expands) لمكوّن الطابع، لكن لا
          توثيق للمركّب الكامل كمصطلح قائم بذاته.
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
        coinage_test_result: >
          يفشل اختبار السكّ: "الطبيعة اللاتفية" و"السجيّة اللاتفية" تؤديان
          المعنى الوصفي ذاته، مما يدل على أن المركّب عبارة وصفية حرة لا مصطلح
          مسكوك. يُقبل استثنائياً لغياب البديل غير الملتبس.
      nuance_differentiation: >
        الوحيد في المجموعة. يُركّز على الطابع بمعنى السمات الجوهرية الراسخة
        (الخُلُق الغالب + العلامة المميّزة) مقابل مجرد الانتساب الجغرافي؛ فهو
        أغنى دلالياً من مجرد نسبة لاتفية.
      morphological_fit: >
        الطَّابَع: اسم على وزن فاعَل / فاعِل بمعنى الأداة أو الصفة الغالبة،
        وهو وزن مطّرد في العربية للدلالة على الخاصيّة المميّزة (كالطابع والخاتم).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطَّابَع اللاتِفيّ"

    # ─────────────────────────────────────────────────────────
    # ٢. مرشّح المرحلة ١: اللاتفيَّة
    # ─────────────────────────────────────────────────────────
    - lemma: "اللاتِفيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصدر الصناعي "اللاتفية" موثَّق في المورد الحديث (2008) بمعنى "لغة
        اللاتفيين" — وهذا تعارض مباشر مع الاستخدام المُراد (خاصيّة الانتساب
        المجردة). إدراجها في المجموعة سيُوقع القارئ في خلط مع اسم اللغة.
      evidence_assessment:
        case: contradicts_only

    # ─────────────────────────────────────────────────────────
    # ٣. مرشّح المرحلة ١: الصفة اللاتفية
    # ─────────────────────────────────────────────────────────
    - lemma: "الصِّفَة اللاتِفيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تامة الفشل في اختبار السكّ (يمكن إبدال 'الصفة'
        بـ'الخاصية' أو 'السمة' دون أي تغيير في المعنى). لا توثيق معجمي،
        ولا قيمة مصطلحية مضافة على "الطابع اللاتفي".
      evidence_assessment:
        case: no_material

    # ─────────────────────────────────────────────────────────
    # ٤. مرشّح المرحلة ١: اللاتفانية
    # ─────────────────────────────────────────────────────────
    - lemma: "اللاتِفانيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة غير مألوفة وغير مقيسة في نظام جنسيات العربية (نمط فَعْلانيَّة
        غير مطّرد في النسب القوميّ). لا توثيق معجمي. تفتقر إلى قبول نظام
        اللغة العربية لهذا الوزن في هذا الحقل الدلالي.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
