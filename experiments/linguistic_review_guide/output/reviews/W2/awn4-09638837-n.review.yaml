          source: "المحيط في اللغة للصاحب بن عباد"
          addition: "يوضح الدلالة التاريخية الخاصة بهندسة الري ومجاري المياه وقدم المصطلح (معرب من الفارسية)"

    - lemma: "تقني"
      confirm:
        - text: "«تَقْنِيّ (technician)»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«تِقْنُولُوجِيّ؛ تِقْنِيّ (technologist)»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الوسائل التقنية التي يستخدمها الفنان والتي تعطيه شخصيته المستقلة (technique)»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "يشير إلى الجانب الأدائي (Technique) وليس الشخص فقط، مما يعكس شمولية الجذر للمفهوم العملي"

