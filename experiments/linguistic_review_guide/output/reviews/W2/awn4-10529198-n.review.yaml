stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدو ترجمة حرفية للتعريف الإنجليزي (يتقبل العالم كما هو حرفياً)، وقد يكون من الأفضل صياغته بأسلوب عربي أكثر طبيعية لتجنب الركاكة."
    observations: "اللمة 'وَاقِعِيّ' دقيقة جداً وتعبر بوضوح عن المعنى المقصود، وهو الشخص الذي يبني مواقفه وأفعاله على الواقع الفعلي الملموس وليس على الخيال أو المثالية."
  blind_candidates:
    - lemma: "وَاقِعِيّ"
      generation_method: ishtiqaq
      justification: "مشتق من الواقع نسبة إليه، ويدل على من يتعامل مع الواقع كما هو."
    - lemma: "عَمَلِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى العمل، يدل على من يركز على التطبيق الفعلي والملموس بدلاً من التنظير."
    - lemma: "بَرَاغْمَاتِيّ"
      generation_method: taarib
      justification: "مصطلح معرب يدل على الفلسفة النفعية أو الواقعية في التعامل مع الأمور."
    - lemma: "مَوْضُوعِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الموضوعية، حيث يتعامل مع الأشياء كما هي في الواقع دون تدخل العواطف."

stage2_evidence:
  per_lemma:
    - lemma: "وَاقِعِيّ"
      confirm:
        - text: "واقعيّ؛ عمليّ"
          source: "المورد الحديث (2008)"
      expands:
        - text: "الواقعيّة: «أ» سُلوك مبنيّ على مواجهة الحقائق وإغفال العواطف والأعراف."
          source: "المورد الحديث (2008)"
    - lemma: "عَمَلِيّ"
      confirm:
        - text: "العملي... المنسوب إلى العمل... وفي عرف العلماء يطلق على ما يقابل النظري"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "واقعيّ؛ عمليّ"
          source: "المورد الحديث (2008)"
    - lemma: "بَرَاغْمَاتِيّ"
      confirm:
        - text: "ذرائعيّ؛ براغماتيّ"
          source: "المورد الحديث (2008)"
    - lemma: "مَوْضُوعِيّ"
      confirm:
        - text: "موضوعي"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      contradicts:
        - text: "ينتجه مجتمع ويمتلك وظيفة ترتبط بشفرة سوسيو ثقافية لها فائدة جمالية ورمزية تعارض الذاتي."
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "الموضوعية تتعلق بنفي الذاتية والعواطف، لكنها لا تعني بالضرورة تقبل الواقع حرفيا والتعامل معه، بل هي صفة للحكم والتقييم."

stage3_analysis:
  per_lemma:
    - lemma: "وَاقِعِيّ"
      decision: confirmed
      decision_reason: "الكلمة دقيقة تماماً في التعبير عن الشخص الذي ينظر إلى الأمور بحقيقتها ويتعامل معها بعيداً عن المثالية أو الخيال، وهي شائعة الاستخدام بهذا المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الواقعي هو من يتقبل الواقع كما هو ويتعامل معه بعيداً عن الخيال أو المثالية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَاقِعِيّ"
    - lemma: "عَمَلِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "الكلمة تستخدم للدلالة على الشخص الذي يهتم بالجانب التطبيقي والفعلي بدلاً من النظريات، وتتقاطع دلالياً مع 'واقعي' في هذا السياق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "العملي يركز على التطبيق والإنجاز والفعل أكثر من التنظير، وقد يكون أحياناً واقعياً."
      actions:
        - command: create_entry
          params: {lemma: "عَمَلِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10529198-n"}
    - lemma: "بَرَاغْمَاتِيّ"
      source: stage1
      decision: removed
      decision_reason: "كلمة معربة تقابل 'ذرائعي' وتتعلق بمذهب فلسفي محدد (البراغماتية) وليس بالضرورة بمعنى الشخص الواقعي."
    - lemma: "مَوْضُوعِيّ"
      source: stage1
      decision: removed
      decision_reason: "الموضوعية تعني التجرد من الميول الشخصية عند الحكم على الأشياء، ولا تعني بالضرورة الشخص الواقعي العملي."

stage4_content:
  definition:
    current: "شخص يتقبل العالم كما هو حرفياً ويتعامل معه وفقاً لذلك"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحمل أثراً واضحاً للترجمة الحرفية، وصياغته ركيكة نسبياً. من الأفضل صياغته بأسلوب عربي أوضح وأكثر دقة."
    authored:
      - type: terminological
        text: "الشخص الذي ينظر إلى الأمور ويتعامل معها بناءً على ما هي عليه في الواقع الملموس، بعيداً عن المثالية أو الخيال."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-10529198-n", definition_index: 0, text: "الشخص الذي ينظر إلى الأمور ويتعامل معها بناءً على ما هي عليه في الواقع الملموس، بعيداً عن المثالية أو الخيال."}
  examples:
    per_lemma:
      - lemma: "وَاقِعِيّ"
        examples:
          - text: "كانت نظرته واقعية للأمور، فلم يتوقع نجاح المشروع دون تخطيط مسبق."
            type: usage
      - lemma: "عَمَلِيّ"
        examples:
          - text: "يُفضّل المدير الشخص العملي الذي ينجز المهام بدلاً من الاكتفاء بالحديث عنها."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-10529198-n", text: "كانت نظرته واقعية للأمور، فلم يتوقع نجاح المشروع دون تخطيط مسبق."}
      - command: add_synset_example
        params: {synset_id: "awn4-10529198-n", text: "يُفضّل المدير الشخص العملي الذي ينجز المهام بدلاً من الاكتفاء بالحديث عنها."}

