# مراجعة المجموعة الترادفية — awn4-13446418-n (accretion)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «التحام» في المعجم الوسيط تُعرَّف في البيولوجيا بأنها اتحاد أعضاء ليست من نوع واحد (adnation/symphysis)، وهو مفهوم مختلف عن النمو بالإضافة (accretion)"
      - "لمّة «تراكم» تُترجَم عادةً بـ accumulation وليس accretion، وإن كان بينهما تقاطع دلالي"
      - "التعريف العربي الحالي ترجمة حرفية للتعريف الإنجليزي، ويحتاج صياغة معجمية عربية أصيلة"
    observations: "المجموعة تصف مفهوماً بيولوجياً دقيقاً هو النمو بالتراكم والإضافة التدريجية للمادة، وهو يختلف عن الالتحام (الذي يدل على اتحاد أجزاء منفصلة) وعن التراكم العام (الذي يدل على تجمع الأشياء بعضها إلى بعض دون دلالة على النمو). المصطلح الأدق هو ما يجمع بين دلالتَي النمو والإضافة التدريجية."
  blind_candidates:
    - lemma: "تَنَامٍ"
      generation_method: ishtiqaq
      justification: "من الجذر ن م و على وزن تَفَاعُل، يدل على النمو التدريجي بالإضافة المتتالية، وهو أقرب إلى المفهوم البيولوجي للنمو بالتراكم"
    - lemma: "تَزَايُد"
      generation_method: ishtiqaq
      justification: "من الجذر ز ي د على وزن تَفَاعُل، يدل على الازدياد المتدرج في الحجم بضمّ مزيد من المادة، وهو وزن يناسب الدلالة على التدرج والتتابع"
    - lemma: "تَضَامّ"
      generation_method: ishtiqaq
      justification: "من الجذر ض م م على وزن تَفَاعُل، يدل على انضمام الأجزاء بعضها إلى بعض تدريجياً، وفيه دلالة التلاصق والتماسك"
    - lemma: "تَرَسُّب"
      generation_method: ishtiqaq
      justification: "من الجذر ر س ب على وزن تَفَعُّل، يدل على تراكم المواد طبقةً فوق طبقة بفعل الجاذبية أو التفاعل"

stage2_evidence:
  per_lemma:
    - lemma: "الْتِحَام"
      confirm:
        - text: "«(3) الالتحام؛ التنامي الالتحاميّ: التحام عضوين منفصلين طبيعيًا ونموُّهما معًا (ط).»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(الالتحام) (فِي علم الْأَحْيَاء) اتِّحَاد أَعْضَاء لَيست من نوع وَاحِد وخاصة فِي الزهرة كاتحاد البتلات بالاسدية كَمَا فِي أزهار الفصيلة الباذنجانية (مج)»"
          source: "المعجم الوسيط"
          conflict: "تعريف الوسيط للالتحام في البيولوجيا يصف مفهوم الإدناء (adnation) لا النمو بالإضافة (accretion)"
        - text: "«التحام — عملية التحام الصخور بمادة صخرية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "في الجيولوجيا يُترجم cementation لا accretion"
      expands:
        - text: "«التحام، التصاق — adhesion»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "في معجم الأحياء يُستخدم التحام لـ adhesion وليس accretion"
        - text: "«إلتحام — مكان الالتحام بين عظمين متناظرين على الجانبين — symphisis»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "في التشريح يدل على الارتفاق (symphysis) وهو مفهوم ثالث مختلف"

    - lemma: "تَرَاكُم"
      confirm:
        - text: "«تراكُم — تزايد رقعة الأرض بالتطمي أو التغريم — accretion»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«تراكُم، تجمع بالتجاذب — accretion»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«تَرَاكُم — apposition»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      expands:
        - text: "«التَّراكُم: تَجَمُّع الأشياء بعضها إلى بعض, ومِنْ أَمْثِلَتِه تَجَمُّعُ بَعْضِ الأَدْوِيَةِ فى أَجْزاءِ الجِسم المُخْتَلِفَة»"
          source: "المعجم الكبير"
          addition: "الدلالة العامة تجمّع الأشياء بعضها إلى بعض، وهي أوسع من accretion"
        - text: "«(تراكم) ارتكم يُقَال تراكمت الأشغال»"
          source: "المعجم الوسيط"
          addition: "الاستعمال اللغوي العام يشمل أي تراكم وليس النمو البيولوجي تحديداً"
        - text: "«إضافات متتالية من مادة إلى كائن مستهدف، أو إلى جهاز، أو إلى جزء من البيئة، مما يؤدي إلى زيادة كمية أو تركيز المادة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: "تعريف بيئي قريب من مفهوم accretion"

    - lemma: "تَنَامٍ"
      confirm:
        - text: "«تنام — تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات — accretion»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«(1) تزايُد؛ تنامٍ؛ تعاظُم [من طريق النموّ العُضوي أو بواسطة إضافات خارجية تدريجية] — accretion»"
          source: "المورد الحديث (2008)"

    - lemma: "تَزَايُد"
      confirm:
        - text: "«تزايُد — الازدياد المتدرج في حجم الجسم بضم مزيد من المادة إليه — accretion»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«تزايد — الازدياد المتدرج في حجم الجسم بضم مزيد من المادة إليه — accretion»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«(1) تزايُد؛ تنامٍ؛ تعاظُم [من طريق النموّ العُضوي أو بواسطة إضافات خارجية تدريجية] — accretion»"
          source: "المورد الحديث (2008)"

    - lemma: "تَضَامّ"
      confirm:
        - text: "«تضام — التحام أجزاء متفرقة في كلٍ واحد — coalescence»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      contradicts:
        - text: "«(تضام) الشَّيْء انْضَمَّ بعضه إِلَى بعض وَيُقَال تضام الْقَوْم وَغَيرهم»"
          source: "المعجم الوسيط"
          conflict: "تضامّ يدل على الانضمام والالتحام (coalescence) لا على النمو بالإضافة (accretion)"
        - text: "«التَّضامُّ: الطرقُ الممكنةُ في وَصْفِ جُمْلَةٍ ما, فتَخْتَلِفُ طريقةُ كلِّ منها عن الأخرى؛ تقديمًا وتأخيرًا وفصلاً ووصلاً»"
          source: "المعجم الكبير"
          conflict: "في اللسانيات يدل على مفهوم نحوي مختلف تماماً"

    - lemma: "تَرَسُّب"
      contradicts:
        - text: "«(فى الجيولوجيا): تراكم فُتات الصخور بعضه فوق بعض فى هيئة طبقات»"
          source: "المعجم الكبير"
          conflict: "الترسب عملية ترسيب بالجاذبية (sedimentation) وليس نمواً بالإضافة (accretion)"
        - text: "«ترسب — عملية ترسب بالجاذبية الأرضية لمواد عالقة في المياه — sedimentation»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "الترسب = sedimentation في جميع المعاجم التقنية"

stage3_analysis:
  per_lemma:
    - lemma: "الْتِحَام"
      decision: removed
      decision_reason: "الالتحام في المعجم الوسيط يُعرَّف في البيولوجيا بأنه اتحاد أعضاء ليست من نوع واحد (adnation)، وفي المعاجم التقنية يُترجم adherence أو adhesion أو coalescence أو cementation — وكلها مفاهيم مختلفة عن accretion (النمو بالإضافة). وجود اللمّة في هذه المجموعة يخلط بين مفهومين بيولوجيين متمايزين."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَرَاكُم"
      decision: confirmed
      decision_reason: "تراكم يُستخدم لترجمة accretion في معاجم النفط والأرصاد الجوية، وتعريفه في المعجم الكبير (تجمّع الأشياء بعضها إلى بعض) يتوافق مع المفهوم العام. وإن كان أوسع دلالةً من accretion البيولوجي، فهو مصطلح مألوف ومفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الجانب الكمّي من التجمّع والتكاثف، ويُستعمل في السياقات العلمية العامة لوصف تراكم المادة دون تخصيص آلية النمو"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرَاكُم"

    - lemma: "تَنَامٍ"
      source: stage1
      decision: confirmed
      decision_reason: "تَنَامٍ يُترجم accretion في معجم الهندسة المدنية بتعريف مطابق تماماً: «تزايد حجم جسم غير عضوي نتيجة إضافة أو تراكم الجزيئات»، وهو المصطلح الأول في المورد الحديث لترجمة accretion. يجمع بين دلالة النمو (ن م و) والتدرج (وزن تَفَاعُل)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد العضوي والبيولوجي للنمو التدريجي بالإضافة، من الجذر ن م و الذي يحمل دلالة النمو الحيّ"
      actions:
        - command: create_entry
          params: {lemma: "تَنَامٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَزَايُد"
      source: stage1
      decision: confirmed
      decision_reason: "تَزَايُد يُترجم accretion في معجمَي الجيولوجيا والزلازل بتعريف دقيق: «الازدياد المتدرج في حجم الجسم بضم مزيد من المادة إليه»، وهو المصطلح الأول في المورد الحديث إلى جانب تنامٍ. وزن تَفَاعُل يدل على التدرج."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد الكمّي للازدياد المتدرج في الحجم، ويُستعمل أكثر في السياقات الجيولوجية والفيزيائية"
      actions:
