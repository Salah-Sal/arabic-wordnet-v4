          params: {lemma: "تَزَايُد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَضَامّ"
      source: stage1
      decision: removed
      decision_reason: "تَضَامّ يدل على الانضمام والالتحام (coalescence) وليس على النمو بالإضافة (accretion). تعريفه في المعجم الطبي «التحام أجزاء متفرقة في كلٍ واحد» يصف عملية اندماج لا نمو تدريجي."

    - lemma: "تَرَسُّب"
      source: stage1
      decision: removed
      decision_reason: "تَرَسُّب يُترجم sedimentation/precipitation/deposition في جميع المعاجم التقنية. هو عملية ترسّب بالجاذبية وليس نمواً بالإضافة. المعجم الكبير يعرّفه بأنه تراكم فُتات الصخور بعضه فوق بعض في هيئة طبقات."

