# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة 'لَا مَنْطِقِيَّة' مكتوبة بصورة كلمتين منفصلتين، وهو خلاف المعيار المعجمي الذي يوحّد بادئة النفي 'لا' بالاسم في مصطلح مندمج واحد (كما هو ثابت في المعاجم الحديثة: اللامنطقية)"
      - "الاقتصار على لمة حديثة واحدة دون استثمار الرصيد العربي الكلاسيكي الغني، ولا سيما لفظ 'الخطل' الوارد في معاجم اللغة وفي شواهد صريحة بمعنى 'المنطق الفاسد'"
      - "التعريف الحالي 'استدلال غير صالح أو غير صحيح' مُستعار ترجمةً حرفية من الإنجليزية ولا يتبع أسلوب المعجم الوسيط في التعريف المنطقي (جنس + فصل)"
    observations: >
      المجموعة تُمثِّل مفهوماً فلسفياً-منطقياً متأصِّلاً هو وصف الاستدلال الفاسد المخالف لقواعد المنطق السليم.
      المصطلح الحديث 'اللامنطقية' موثَّق في معاجم الترجمة المعاصرة كالمورد الحديث، غير أن العربية تمتلك رصيداً تراثياً ثرياً في هذا الباب؛
      أبرزه لفظُ 'الخطل' الذي عرَّفه المعجم الوسيط بـ'المنطق الفاسد' وأيَّده حديثٌ مأثور عن علي رضي الله عنه.
      يستوجب ذلك توسيع المجموعة لتستوعب هذا الإرث التراثي.
      من جهة أخرى، الإحالة إلى المعنى الأشمل 'جودة/نوعية' كمحوِّل مباشر صحيحة منطقياً لأن اللامنطقية صِفَةٌ مجردة.

  blind_candidates:
    - lemma: "التَّهَافُتُ"
      generation_method: majaz
      justification: >
        التهافت في أصله يعني التساقط والانهيار التدريجي (هفت)؛ وقد استخدمه الغزالي
        في 'تهافت الفلاسفة' للدلالة على انهيار الحجة المنطقية وسقوطها أمام النقد.
        إزاحةٌ دلالية من انهيار الأشياء المادية إلى انهيار بنيان الاستدلال.
    - lemma: "اللَّامَعْقُولِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن (-يَّة) من صفة 'مَعقول' (اسم مفعول من جذر عقل) مع بادئة
        النفي 'لا'؛ يُعبِّر عن الصفة المجردة لكون الاستدلال خارجاً عن دائرة العقل
        والاتساق المنطقي. الوزن منتج في العربية الحديثة.
    - lemma: "الخَطَلُ"
      generation_method: majaz
      justification: >
        لفظ عربي كلاسيكي راسخ يدل على الكلام الفاسد المضطرب؛ جاء في المعجم الوسيط
        بمعنى 'المنطق الفاسد' صراحةً. إزاحةٌ دلالية من فساد الكلام الملفوظ إلى فساد
        البنيان الاستدلالي. تدعمه شواهد قرآنية وأدبية وأثرية.
    - lemma: "فَسَادُ الِاسْتِدْلَال"
      generation_method: tarkib
      justification: >
        مركب إضافي (مصدر + مضاف إليه) يُعبِّر تعبيراً مباشراً عن خروج الاستدلال عن
        السلامة المنطقية؛ مستعمَل في الكتابات الفلسفية والمنطقية العربية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "لَا مَنْطِقِيَّة"
      confirm:
        - text: "«اللامنطقية: كون الشيء غيرَ منطقيّ.»"
          source: "المورد الحديث (2008) — ترجمة: illogic"
        - text: "«(1) اللّامنطقيّة (2) اللّاتساوق؛ اللّاترابط إلخ.»"
          source: "المورد الحديث (2008) — ترجمة: inconsequence"

    - lemma: "التَّهَافُتُ"
      expands:
        - text: "«التهافت: التساقط شيئاً بعد شيء وقطعة بعد قطعة والازدحام.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: "الدلالة الأصلية هي التساقط التدريجي المادي، وتمتد إلى انهيار الحجج بعضها على بعض"
        - text: "«(تهافت) الجدارُ أو الثوبُ ونحوُهما: تساقط قطعةً قطعةً. ويقال تهافتَ الفراشُ على النور. وتهافتَ القومُ: تساقطوا موتى. وتهافتَتِ الآراءُ: نقضَ بعضُها بعضاً.»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          addition: "عبارة 'تهافتت الآراء: نقض بعضها بعضاً' تُقرِّبه من معنى تناقض الحجج وإبطال بعضها بعضاً، لكنها لا تُعبِّر صراحةً عن 'الاستدلال الفاسد'"
      contradicts:
        - text: "«الهاء والفاء والتاء: كلمةٌ تدل على سقوط شيء. وتهافتُ الشيء: تساقطُهُ قطعةً قطعةً. وتهافَتَ الفراشُ في النار: تساقط.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل اللغوي محصور في السقوط المادي؛ الاستعمال المجازي في نقض الحجج وارد لكنه لا يُرادف 'اللامنطقية' بوصفها صفةً للاستدلال الفاسد"

    - lemma: "اللَّامَعْقُولِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الخَطَلُ"
      confirm:
        - text: "«الخَطَلُ: الكلامُ الفاسِدُ الكثيرُ المضطرب. المنطقُ الفاسدُ.»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR، حديث)"
        - text: "«مِنَ الكلامِ: الفاسِدُ.»"
          source: "المعجم الكبير — مجمع اللغة العربية (OCR، حديث)"
        - text: "«الخطل: بفتح الخاء المعجمة والطاء المهملة، الكلامُ الفاسدُ المضطرب. وقال أبو البقاء: اضطرابُ القول.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«(الخطل) الكلامُ الفاسدُ الكثيرُ المضطربُ. وفي حديث علي: (فَرَكِبَ بِهِمُ الزَّلَلَ، وَزَيَّنَ لَهُمُ الخَطَلَ) المنطقُ الفاسدُ.»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani، حديث)"
        - text: "«الخاءُ والطاءُ واللامُ أصلٌ واحدٌ يدلُّ على استرخاءٍ واضطرابٍ، قياسٌ مطَّردٌ. فالخطلُ: استرخاءُ الأُذُنِ... والخطلُ: المنطقُ الفاسدُ.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«فَرَكِبَ بِهِمُ الزَّلَلَ، وَزَيَّنَ لَهُمُ الخَطَلَ»"
          source: "شاهد حديثي — علي بن أبي طالب رضي الله عنه (المعجم الوسيط، المعجم الكبير)"
        - text: "«وذى خَطَلٍ في القولِ يَحسَبُ أنَّه / مُصِيبٌ فما يُلمِمْ به فهو قائلُهُ»"
          source: "شاهد شعري — زهير بن أبي سُلمى (المعجم الكبير)"
        - text: "«يا مَن إذا قُلتُ فيه القولَ سَدَّدَني / إجلالُهُ فكفَيتُ الزَّيغَ والخَطَلا»"
          source: "شاهد شعري — ابن الرُّومِيّ (المعجم الكبير)"

    - lemma: "فَسَادُ الِاسْتِدْلَال"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "لَا مَنْطِقِيَّة"
      decision: confirmed
      decision_reason: >
        اللمة موثَّقة في المورد الحديث ترجمةً لـ illogic وinconsequence، وهي المصطلح الأكاديمي
        المعتمد في الكتابة الفلسفية العربية المعاصرة. غير أنها تحتاج إلى تصحيح إملائي:
        الكتابة بكلمتين منفصلتين ('لا منطقية') يخالف معيار المعاجم الحديثة التي توحّد المصطلح
        ('اللامنطقية')؛ لذا يُقترح تحديث اللمة إلى الصيغة المدمجة 'لَامَنْطِقِيَّة'.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: "المصطلح الأكاديمي الحديث الجاهز للتداول في المنطق الرسمي والفلسفة التحليلية، يُؤثَر في السياق العلمي والكتابة الأكاديمية المعاصرة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَامَنْطِقِيَّة"

    - lemma: "التَّهَافُتُ"
      source: stage1
      decision: removed
      decision_reason: >
        التهافت في أصله اللغوي يعني التساقط المادي التدريجي، واستعماله المجازي محصور في
        انهيار الحجج بعضها على بعض وتناقضها (تهافتت الآراء: نقض بعضها بعضاً). هذا المعنى
        أضيق وأخص من 'اللامنطقية' التي تشمل كل استدلال فاسد؛ فضلاً عن أن الاستعمال
        المعاصر ينحو بالتهافت نحو التناقض الداخلي في الرأي الواحد، لا وصف الاستدلال
        بالفساد المنطقي عموماً. لا يجتاز اختبار الاستبدال في السياق.
      evidence_assessment:
        case: mixed

    - lemma: "اللَّامَعْقُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي للمصطلح في قاعدة البيانات. فضلاً عن ذلك، فإن
        'اللامعقولية' تُعبِّر دلالياً عن irrationality (انعدام العقلانية) لا عن illogicality
        (فساد المنطق)؛ إذ المنطق نظامٌ صوري للاستدلال والعقل ملكةٌ أشمل، ولا يصح
        استعمالهما استعمالاً مترادفاً في السياق المنطقي الدقيق.
      evidence_assessment:
        case: no_material

    - lemma: "الخَطَلُ"
      source: stage1
      decision: confirmed
      decision_reason: >
        الخطل موثَّق في المعاجم الكلاسيكية والحديثة على حد سواء بمعنى 'المنطق الفاسد'
        و'الكلام الفاسد المضطرب'؛ ويؤيِّده شاهد حديثي صريح عن علي رضي الله عنه بهذا
        المعنى بالذات. ابن فارس يؤصِّله في الاسترخاء والاضطراب وهو أصل دقيق للدلالة
        على فساد الاستدلال. يجتاز اختبار السك المعجمي (وحدة معجمية مُثبَّتة في المعاجم)
        واختبار الاستبدال في السياق الفلسفي. غنيٌّ بالشواهد الأدبية وقابلٌ للاشتقاق
        (خطِل، خطَّال). الوزن الصرفي فَعَل مناسب للمصادر والأسماء الدالة على الصفات.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ التراثي الفصيح الموروث يُعبِّر عن فساد المنطق والقول مع دلالة أعمق على الاضطراب والتشويش؛ أغنى توظيفاً أدبياً ودينياً، ويُؤثَر في الكتابة الرصينة والنقد الفلسفي الكلاسيكي"
      actions:
        - command: create_entry
          params:
            lemma: "الخَطَلُ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04792897-n"

    - lemma: "فَسَادُ الِاسْتِدْلَال"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا تمثِّل وحدة معجمية مُسكوكة؛ تفشل في اختبار السك لأن 'فساد'
        يمكن إبدالها بـ'قصور' أو 'خلل' أو 'ضعف' مع بقاء العبارة صالحةً كوصف. كذلك لم
        يُعثر لها على توثيق بوصفها مصطلحاً ثابتاً في المعاجم المتخصصة.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
