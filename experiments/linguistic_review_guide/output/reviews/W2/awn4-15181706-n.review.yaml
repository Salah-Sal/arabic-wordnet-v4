# مراجعة المجموعة الترادفية — awn4-15181706-n
# terrestrial time / ephemeris time
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «توقيت التقويم الفلكي» لا تطابق المصطلح المعتمد في المعجم الموحد لمصطلحات الرياضيات والفلك (1990) وهو «زمن تقويم فلكي»؛ استُبدل «توقيت» بـ«زمن» خلافاً للاستعمال المصطلحي المقنّن."
      - "اللمّة «توقيت فلكي» مسجّلة في معجم الاستشعار عن بعد بمعنى sidereal time (التوقيت النجمي) لا ephemeris time؛ فـ«توقيت التقويم الفلكي» قد تُوهم بالخلط بين المفهومَيْن."
      - "كلتا اللمّتَيْن الموجودتَيْن بلا تشكيل."
    observations: "المجموعة تغطّي ثلاثة مقاييس زمنية فلكية مترابطة تاريخياً: زمن التقويم الفلكي (ephemeris time) الذي استُبدل بالتوقيت الديناميكي الأرضي (TDT) ثم بالتوقيت الأرضي (TT). جميعها مقاييس تعتمد على الحركة المدارية للأرض لا على دورانها حول محورها. المصطلحان العربيّان الموجودان يغطّيان terrestrial time وephemeris time لكن ينبغي التحقّق من مطابقتهما للمصطلحات المقنّنة."
  blind_candidates:
    - lemma: "الزَّمَنُ الْأَرْضِيُّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «الزمن» و«الأرضي» على غرار «الزمن الشمسي»؛ يقابل terrestrial time باستعمال «زمن» بدلاً من «توقيت» انسجاماً مع اصطلاح المعجم الموحد للفلك."
    - lemma: "زَمَنُ التَّقْوِيمِ الْفَلَكِيِّ"
      generation_method: tarkib
      justification: "مركّب إضافي يقابل ephemeris time؛ «التقويم الفلكي» هو الزِّيج أو الجدول الذي يُستخرَج منه مواقع الكواكب، فزمنه هو المقياس الزمني المبني على الحركة المدارية."
    - lemma: "التَّوْقِيتُ الْمَدَارِيُّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «التوقيت» و«المداري» (من المدار = orbit)؛ يعكس جوهر المفهوم: مقياس زمني مبني على الحركة المدارية للأرض."
    - lemma: "الزَّمَنُ الدِّينَامِيكِيُّ"
      generation_method: taarib
      justification: "تعريب لـ dynamical time مع تكييف صرفي (ديناميكيّ على وزن النسبة)؛ يغطّي المصطلح الإنجليزي terrestrial dynamical time (TDT)."

