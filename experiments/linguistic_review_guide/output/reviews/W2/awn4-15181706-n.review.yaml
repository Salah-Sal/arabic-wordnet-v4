        - text: "«أرضي» = terrestrial"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يُثبت أنّ «أرضي» المقابل العربي المقنّن لـ terrestrial"
    - lemma: "تَوْقِيتُ التَّقْوِيمِ الْفَلَكِيِّ"
      contradicts:
        - text: "«توقيت فلكي = side-real time / horaire sidéral — الوقت مقيساً بدورات الأرض بالنسبة للكواكب»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          conflict: "«توقيت فلكي» مسجّل بمعنى التوقيت النجمي (sidereal time) لا زمن التقويم الفلكي (ephemeris time)؛ اللمّة «توقيت التقويم الفلكي» قد تُوهم بالخلط."
        - text: "«زمن تقويم فلكي = ephemeris time»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "المصطلح المقنّن يستعمل «زمن» لا «توقيت»؛ اللمّة الموجودة تخالف الاصطلاح الرسمي."
      expands:
        - text: "«التقويم: حساب الزمن بالسنين والشهور والأيام، وتقويم البلدان: تعيين مواقعها وبيان ظواهرها»"
          source: "المعجم الوسيط"
          addition: "يُبيّن أنّ «التقويم» يشمل معنى حساب الزمن الفلكي"
        - text: "«التقويم: عبارة عن دفتر يكتب فيه المنجّمون أحوال النجوم بعد استخراجها من الزيج...»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُثبت الاستعمال الفلكي التراثي لـ«التقويم» بمعنى الجداول الفلكية (= ephemeris)"
    - lemma: "الزَّمَنُ الْأَرْضِيُّ"
