    - lemma: "تَصَخُّر"
      entry_id: "{auto}"
      root: "صخر"
      maqayis_quote: "«الصَّادُ وَالْخَاءُ وَالرَّاءُ كَلِمَةٌ صَحِيحَةٌ، وَهِيَ الصَّخْرَةُ: الْحَجَرَةُ الْعَظِيمَةُ.»"
