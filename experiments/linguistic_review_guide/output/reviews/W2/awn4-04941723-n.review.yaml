# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تماسك"
      decision: confirmed
      decision_reason: >
        موثَّق في المعجم الوسيط بمعنى ترابط أجزاء الشيء حِسِّيًّا، وفي عشرات المعاجم الموحَّدة
        المتخصصة (كيمياء، فيزياء، هندسة، أحياء، جيولوجيا) بترجمة cohesion وconsistency.
        الجذر مسك بمعنى «حبس الشيء وتحبّسه» يُرسِّخ الدلالة على الاحتفاظ والتماسك.
        تشكيله الكامل يستوجب التحديث.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على ترابط الأجزاء ببعضها حِسِّيًّا (التلاصق الجزيئي)؛ الأشمل والأكثر استخداماً
        في السياقات العلمية والتقنية المتنوعة؛ يصلح للدلالة على cohesion بالمعنى الجزيئي الفيزيائي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَاسُك"

    - lemma: "قوام"
      decision: confirmed
      decision_reason: >
        مُقابَل موثَّق في المعاجم الموحَّدة لـconsistency وconsistence في علم الصيدلة والهندسة
        وعلوم الأغذية. القِوَام (بالكسر) يعني «عماد الشيء ونظامه وما يُقيمه»، وهو الشكل الصرفي
        الصحيح المُطابق للمعنى. يحتاج تصحيح التشكيل من قوام إلى قِوَام.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعنى بدرجة الكثافة والثخانة وما يُقيم بنية المادة ويجعلها قابلةً للتشكّل مع الاحتفاظ
        بتركيبها؛ أكثر ارتباطاً بالسياق الغذائي والصيدلاني ويُفيد مفهوم consistence/body.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِوَام"

    - lemma: "تَلاحُم"
      source: stage1
      decision: removed
      decision_reason: >
        الاستخدام الموثَّق لتلاحم في المعجمية العربية المعاصرة مقيَّد بالمعلوماتية (cohesion
        البرمجي) واللسانيات (Solidarity الغلوسيماتي)، وليس خاصية فيزيائية لتماسك المادة.
        المعنى اللغوي الأصيل (تداخل الناس في القتال) بعيد كذلك عن خاصية الحفاظ على الشكل.
        لا يجتاز اختبار الاستبدال في سياقات «قوام العجين / تماسك الطين».
      evidence_assessment:
        case: mixed

    - lemma: "لُزُوجَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        تعريف المعجم الوسيط «تماسك أجزاء المادَّة بعضِها ببعض بحيث لا يتغير شكلها بسهولة»
        يُطابق تعريف المجموعة مطابقةً شبه تامة. موثَّقة في المعاجم المتخصصة عبر مجالات الفيزياء
        والكيمياء والجيولوجيا والصيدلة. التحليل الكلاسيكي للتهانوي يُفسّرها بـ«سهولة التشكّل
        وعسر التفرق» وهي جوهر المفهوم. تُضيف بُعداً دلالياً مُكمِّلاً لتماسك وقوام.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُضيف معنى الالتصاقية وعُسر التفرق وسهولة التشكّل الناتجة عن امتزاج الرطب واليابس؛
        أكثر تخصيصاً للمواد الطرية واللزجة كالعسل والقطران؛ يُقابل body/viscosity بالإنجليزية.
      actions:
        - command: create_entry
          params:
            lemma: "لُزُوجَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04941723-n"

    - lemma: "رُصَانَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على مدخل معجمي مستقل لـرصانة بمعنى الخاصية الفيزيائية. الجذر رصن يدل على
        الثبات والإحكام (صفة وصفية للشيء) لا على خاصية مادية قابلة للقياس. ورصانة في
        الاستخدام المعاصر الغالب توصف جودة الأسلوب (رصانة العبارة) أو التصميم، وتبتعد عن
        سياق «خاصية التماسك وعدم تغيّر الشكل».

    - lemma: "مَتَانَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الوسيط يُخصِّص المتانة للأرض الكثيرة التين، والمعجم الطبي يُقابلها بـhypersthenia
        (فرط التوتر العضلي). وبينما متين تعني الصلب الشديد (صفة)، فإن المتانة كاسم للخاصية
        المادية الدالة على «التماسك والاحتفاظ بالشكل» غير موثَّقة في المعاجم الموثوقة بهذا المعنى.


