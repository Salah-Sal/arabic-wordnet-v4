# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان (تماسك، قوام) خاليتان من التشكيل الكامل"
      - "التعريف العربي مختصر ومُعاد صياغته ترجمةً حرفيةً من الإنجليزية دون جنس قريب ولا فصل نوعي"
      - "المفهوم يجمع بين دلالتين متمايزتين: التماسك الجزيئي (cohesion) والقوام المادي (consistence)، وهذا ينعكس على اختيار اللمّات"
    observations: >
      المجموعة تُغطي خاصِّيَّة فيزيائيَّة تُفيد قدرة المادة على الاحتفاظ بترابط أجزائها وبشكلها دون تشتُّت.
      في العربية المعاصرة يُستخدم تماسك في الهندسة والفيزياء والكيمياء للدلالة على التلاصق بين الأجزاء،
      بينما يُستخدم قوام بمعنى درجة الكثافة والثخانة في علوم الأغذية والصيدلة. وكلاهما مقابل موثَّق
      لـconsistency/consistence في المعاجم الموحَّدة. المجموعة سليمة لكنها تستدعي التشكيل ومراجعة التعريف
      وإضافة لمّة تُغطي جانب اللزوجة الحسِّيَّة الذي تعكسه لمّتا body/substance في الإنجليزية.

  blind_candidates:
    - lemma: "تَلاحُم"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ل-ح-م) على وزن تَفَاعُل، يدل على تداخل الأجزاء والتصاقها بعضها ببعض
        (تَلاحَمَ القومُ: تداخلوا). يُناسب خاصية التماسك والاحتفاظ بالتماسك الداخلي.
    - lemma: "لُزُوجَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ل-ز-ج) على وزن فُعُولة، يدل على خاصية المادة في الالتصاق وعُسر التفرق
        وسهولة التشكّل، مما يُعبّر عن التماسك والاحتفاظ بالشكل في المواد الطرية.
    - lemma: "رُصَانَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ر-ص-ن) على وزن فُعَالة، يدل على الثبات والإحكام، قال المقاييس:
        «شيء رصين: شديد ثابت»؛ يُناسب خاصية الحفاظ على الشكل واستبقائه.
    - lemma: "مَتَانَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (م-ت-ن) على وزن فَعَالة، يدل على الصلابة مع الامتداد، قال المقاييس:
        «يدل على صلابة في الشيء مع امتداد وطول»؛ يُناسب تصوُّر المادة الحافظة لشكلها.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
