# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5 مراحل)
# Synset: awn4-06288456-n  |  ILI: i69500
# المفهوم: الجزء المرئي من البث التلفزيوني (video / picture)
# ═══════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد
# ══════════════════════════════════════════════════════
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'فيديو' تنصرف في الاستخدام العربي العام إلى الجهاز (مُسجِّل الفيديو/الشريط) لا إلى المكوِّن المرئي من الإشارة التلفزيونية، مما يُفضي إلى لبس دلالي مع المعنى التقني الدقيق المُثبَّت في التعريف."
      - "كلتا اللمّتين خاليتان من التشكيل الكامل في السجل."
      - "غياب توثيق الفرق الدلالي بين 'صورة' و'فيديو' داخل المجموعة ذاتها، إذ يشتركان في الإحالة على المحتوى المرئي دون تمييز."
    observations: >
      تتناول هذه المجموعة المفهومَ التقني الدقيق للمكوِّن البصري في منظومة البث التلفزيوني،
      أي ما يُقابل audio في ثنائية video/audio. تُمثِّل 'صورة' التعبيرَ العربي الأصيل والمستقر
      لـ picture بمعنى المحتوى المرئي المعروض، وهو استخدام واسع التوثيق في المعاجم التقنية
      الحديثة ومعاجم الإعلام والاتصال. أما 'فيديو' فهي تعريب ذو طابع اصطلاحي تقني،
      موثَّق في معجم المعلوماتية بتعريف دقيق يطابق مفهوم المجموعة ("المكوِّن المرئي
      للإشارة التلفزيّة")، غير أن الاستخدام العامّي والمعجمي العام يُوظِّفها للجهاز.
      التعريف الحالي ترجمة حرفية من الإنجليزية يمكن إثراؤه بصياغة عربية مناسبة.

  blind_candidates:
    - lemma: "مَرْئِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر 'رأى' على وزن مَفْعِلَة بالمصدر الصناعي (المؤنث)،
        للدلالة على المادة المرئية أو الجانب البصري من البث. الوزن ملائم
        لتحويل الصفة إلى مفهوم مجرد مسكوك (نحو: 'رئاسية'، 'صوتية').
    - lemma: "بَثٌّ مَرْئِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي (اسم + صفة) يعبّر عن الجانب المرئي من البث تمييزاً
        للصوتي. البنية إضافية واضحة ومستخدمة في المعجمية التقنية العربية
        (نحو: 'بث صوتي'، 'بث مرئي').
    - lemma: "مَنْظَر"
      generation_method: majaz
      justification: >
        إحياء للفظ التراثي 'مَنْظَر' (من 'نظر')، ما يُنظَر إليه،
        بإزاحة دلالية وظيفية نحو المحتوى البصري المعروض في البث.
        المعجم الوسيط: «النَّظَرُ ما يُنْظَر إليه فيُعْجِب».
    - lemma: "مَشْهَد"
      generation_method: majaz
      justification: >
        من 'شهد' على وزن مَفْعَل، ما يُشاهَد. إحياء للبُعد البصري
        في مفهوم المشاهدة التلفزيونية، وقد ورد في المعجم الكبير
        محدَثاً للفن (مَنْظَر من مسرحية أو فيلم).


