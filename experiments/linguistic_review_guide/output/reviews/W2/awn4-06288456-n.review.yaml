# المرحلة ٢: جمع الأدلة
# ══════════════════════════════════════════════════════
stage2_evidence:
  per_lemma:
    - lemma: "صورة"
      confirm:
        - text: "«صورة | trans=picture | domain=Arts, Recreation and Sports»"
          source: "مسرد الفن، التسلية والرياضة — ALECSO (ArabTerm)"
        - text: "«صورة | trans=image | domain=Information and Communication»"
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
        - text: "«صورة | trans=photo; picture | domain=Information and Communication»"
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
        - text: "«(الصُّورَة) الشكل والتمثال المجسم... وصُورَةُ الأمرِ صفتها والنَّوع»"
          source: "المعجم الوسيط (معجم اللغة العربية المعاصرة — hawramani)"
        - text: "«الشَّكْلُ التمثالُ المجسّم صورة المسألة أو الأمر: صفتها النوع صورة الشيء: ماهيته المجردة خياله فى الذهن أو العقل»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«إضافة إلى المعنى العام، تطلق أيضاً على نسخة مطابقة للأصل من ملف مثلاً»"
          source: "معجم مصطلحات تقانة المعلومات 2011 — ALECSO (ArabTerm)"
          addition: "توسّع دلالي للصورة في سياق المعلوماتية ليشمل النسخ الرقمية."
        - text: "«تمثيل بصري أو ذهني لشيء ما، يمكن أن يكون مادياً أو كائناً حياً أو مفهوماً»"
          source: "المعجم الموحد لمصطلحات اللسانيات 2002 — ALECSO (ArabTerm)"
          addition: "يكشف سعة دلالة 'صورة' لتشمل كل تمثيل بصري."

    - lemma: "فيديو"
      confirm:
        - text: "«صفةٌ للمكوِّن المرئي للإشارة التلفزِيّة. وفي الحواسيب: تدل على تصيير النص والصور البيانية على المظهار.»"
          source: "معجم مصطلحات المعلوماتية 2000 — ALECSO (ArabTerm)"
        - text: "«فيديو | trans=video | domain=Arts, Recreation and Sports»"
          source: "مسرد الفن، التسلية والرياضة — ALECSO (ArabTerm)"
        - text: "«فيديو | trans=video | domain=Information and Communication»"
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
      contradicts:
        - text: "«فيديو [مفرد]: ج فيديوهات: فديو، جهاز يسجّل المناسبات والأحداث صوتاً وصورة على أشرطة ممغنطة، ويقوم بعرض ما سُجِّل على هذه الأشرطة تلفزيونياً أو على شاشة عرض سينمائية. • فيديو كِلِبّ: أغانٍ تُسجَّل بالصوت والصورة...»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (hawramani)"
          conflict: "يُعرَّف في المعاجم العامة بوصفه الجهاز (مُسجِّل الفيديو) لا المكوِّن المرئي للبث، مما يخالف المعنى التقني المحدد في تعريف المجموعة."

    - lemma: "مَرْئِيَّة"
      confirm:
        - text: "«مرئية | trans=image | domain=Remote Sensing — تمثيل مسجل لجسم ما نحصل عليه بوسائل بصرية أو بصرية كهربائية، أو بصرية ميكانيكية، أو إلكترونية»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد 2000 — ALECSO (ArabTerm)"
      contradicts:
        - text: "«مرئيّ | trans=video | domain=Electronic Warfare»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية 2004 — ALECSO (ArabTerm)"
          conflict: "الصيغة المُثبَّتة في المعاجم هي 'مرئيّ' (صفة مذكرة) أو 'المرئي' (اسم بالمذكر)، لا 'مرئيَّة' (مؤنث) كاسم مستقل؛ مما يدل على أن المؤنث لا يُستعمل اسماً مسكوكاً للمفهوم المطلوب."

    - lemma: "بَثٌّ مَرْئِيٌّ"
      contradicts:
        - text: "«إرسال مرئي | trans=video transmission | domain=Electropedia»"
          source: "موسوعة الكهرباء IEC 60050 — ALECSO (ArabTerm)"
          conflict: "المركّب الموثَّق في المعاجم التقنية هو 'إرسال مرئي' أو 'إشارة مرئية'، لا 'بث مرئي'. فضلاً عن ذلك، يصف 'بثٌّ مرئيٌّ' الإرسالَ كلَّه لا الجزء المرئي منه."

    - lemma: "مَنْظَر"
      contradicts:
        - text: "«المنظر | trans=landscape/scenery/view — مشهد طبيعي لمنطقة ريفية»"
          source: "مسرد المناخ والبيئة — ALECSO (ArabTerm) ومعاجم متعددة"
          conflict: "تنصرف 'مَنْظَر' في جميع شواهد المعاجم التقنية إلى landscape/scenery/view، ولا علاقة لها بالجانب المرئي من الإشارة التلفزيونية."

    - lemma: "مَشْهَد"
      contradicts:
        - text: "«مشهد | trans=scene | domain=Information and Communication — أداء أو عرض بارز»"
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
          conflict: "تُثبَّت 'مَشْهَد' في الإعلام بمعنى scene (لقطة واحدة من فيلم/مسرحية)، وهو غير 'الجزء المرئي من البث التلفزيوني' الذي هو مفهوم تقني شامل للإشارة البصرية."


# ══════════════════════════════════════════════════════
# المرحلة ٣: التحليل اللغوي للّمات
# ══════════════════════════════════════════════════════
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى الموجودة: صورة ──────────────────
    - lemma: "صورة"
      decision: confirmed
      decision_reason: >
        'صُورَة' لمّة عربية أصيلة من جذر 'صور'، موثَّقة في جميع المعاجم الكبرى
        بمعنى الشكل والهيئة، وفي المعاجم التقنية الحديثة بمعنى picture/image في
        سياقي الإعلام والفنون. هي الترجمة العربية الأولى المستقرة لـ picture
        (الصورة التلفزيونية)، وتصمد في جميع فحوصات الجودة المصطلحية.
        تحتاج إلى تحديث التشكيل فقط.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز 'صُورَة' على المحتوى البصري المعروض بوصفه تمثيلاً مرئياً مُشابهاً
        للواقع (صورة = شكل + هيئة)، وتستخدم في السياق العام والتقني معاً للإشارة
        إلى ما يُعرض على الشاشة من مشاهد وأشكال مرئية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صُورَة"

    # ── اللمّة الثانية الموجودة: فيديو ────────────────
    - lemma: "فيديو"
      decision: confirmed
      decision_reason: >
        'فِيدِيُو' تعريب مقبول لمصطلح دولي الصيغة (video)، يقبل لام التعريف
        (الفيديو) والجمع السالم (فيديوهات) والنسبة (فيديوي). معجم المعلوماتية
        يؤكد استخدامه بالمعنى التقني الدقيق المطابق لتعريف المجموعة
        ("المكوِّن المرئي للإشارة التلفزيّة"). التعارض مع المعنى العامي
        (الجهاز) لا يُسوِّغ الحذف لأن المصطلح التقني راسخ في المعجمية
        التقنية العربية. تحتاج إلى تحديث التشكيل فقط.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يحمل 'فِيدِيُو' الطابعَ الاصطلاحي التقني الصريح، ويُستخدَم خاصةً
        في الكتابة التقنية والإعلامية للإشارة إلى الإشارة المرئية الإلكترونية
        في منظومة البث (video signal/component)، مقابل الإشارة الصوتية (audio)،
        بينما 'صُورَة' أعمّ دلالةً وأكثر قرباً من المتلقي العام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِيدِيُو"

    # ── مرشح ١: مَرْئِيَّة ─────────────────────────────
    - lemma: "مَرْئِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        'مَرْئِيَّة' موثَّقة في المعاجم التقنية لكن بمعنى image في الاستشعار عن بعد
        (تمثيل مسجَّل لجسم ما)، لا بمعنى 'الجزء المرئي من البث التلفزيوني'.
        الصيغة المستعملة في المعاجم التقنية هي المذكر 'المرئيّ' صفةً، لا
        المؤنث 'مرئيَّة' اسماً مستقلاً مسكوكاً. فضلاً عن ذلك، اللمّتان
        الموجودتان تُغطيان المفهوم بكفاءة ولا ثغرة تستدعي إضافتها.

    # ── مرشح ٢: بَثٌّ مَرْئِيٌّ ─────────────────────────
    - lemma: "بَثٌّ مَرْئِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        'بثٌّ مرئيٌّ' مركب وصفي يصف البثّ كاملاً (بوصفه مرئياً) لا الجزء
        المرئي منه، وهو ما يخالف التعريف. المصطلح الموثَّق في المعاجم هو
        'إرسال مرئي' (video transmission) الذي يعني نقل الإشارة. يفشل
        اختبار السكّ: يمكن استبدال 'مرئي' بـ'تلفزيوني' ويبقى الوصف صالحاً،
        مما يدل على أنه عبارة وصفية حرة لا مصطلح مسكوك.

    # ── مرشح ٣: مَنْظَر ─────────────────────────────────
    - lemma: "مَنْظَر"
      source: stage1
      decision: removed
      decision_reason: >
        'مَنْظَر' في جميع المعاجم التقنية تُرجمت بـ landscape/scenery/view/aspect،
        ولا صلة لها بالمكوِّن المرئي من الإشارة التلفزيونية. الإزاحة الدلالية
        المقترحة مُتكلَّفة ولا أساس لها في الاستخدام الموثَّق.

    # ── مرشح ٤: مَشْهَد ─────────────────────────────────
    - lemma: "مَشْهَد"
      source: stage1
      decision: removed
      decision_reason: >
        'مَشْهَد' مستقر في المعاجم الإعلامية بمعنى scene (لقطة/مشهد فني)،
        وفي المعاجم الكلاسيكية بمعنى محضر الناس والضريح. لا يُصلح للدلالة
        على 'الجزء المرئي من البث التلفزيوني' بمفهومه التقني الشامل.


