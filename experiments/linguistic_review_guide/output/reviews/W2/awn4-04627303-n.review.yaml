stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة في المجموعة الترادفية تفتقر إلى التشكيل الكامل."
      - "التعريف العربي الحالي ترجمة دقيقة ولكن يمكن تحسين صياغته ليكون أكثر معجمية."
    observations: "المفهوم تقني ينتمي لمدرسة التحليل النفسي (فرويد)، والمصطلح العربي المقابل (شخصية فموية) مستقر في الأدبيات النفسية العربية. الجدل الأساسي يكمن في اختيار النسبة للفم (فموي أم فمي)، والأرجح في الاستعمال الأكاديمي هو 'فموي'."
  blind_candidates:
    - lemma: "شَخْصِيَّة فَمَوِيَّة"
      generation_method: tarkib
      justification: "الترجمة الأكثر شيوعاً واستقراراً لمصطلح oral personality في علم النفس."
    - lemma: "نَمَط فَمَوِيّ"
      generation_method: tarkib
      justification: "استخدام 'نمط' (type) كبديل للشخصية في تصنيفات الأنماط النفسية."
    - lemma: "طَابَع فَمَوِيّ"
      generation_method: tarkib
      justification: "ترجمة لمصطلح oral character الذي يستخدم كمرادف في التحليل النفسي."
    - lemma: "شَخْصِيَّة فَمِيَّة"
      generation_method: tarkib
      justification: "صيغة بديلة للنسبة إلى الفم، وإن كانت أقل شيوعاً في السياق النفسي."

stage2_evidence:
  per_lemma:
    - lemma: "شَخْصِيَّة فَمَوِيَّة"
      confirm:
        - text: "«الدَّوْرُ الفَمَوِيّ (في التحليل النفسي): oral period»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«المَرْحَلَةُ الفَمَوِيَّة: oral stage»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "خَاصَّة فَمَوِيَّة"
      confirm:
        - text: "«خاصَّةٌ فَمَوِيَّة: oral character»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "فَمَوِيّ"
      confirm:
        - text: "«فَمَوِيّ: oral»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "فَمِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "شخصية فموية"
      decision: confirmed
      decision_reason: "المصطلح العربي القياسي والمعتمد في القواميس الطبية والنفسية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَخْصِيَّة فَمَوِيَّة"
    - lemma: "نَمَط فَمَوِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم بكثرة في سياق تصنيف الأنماط الشخصية (personality patterns) في التحليل النفسي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "نَمَط فَمَوِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04627303-n"}
    - lemma: "خَاصَّة فَمَوِيَّة"
      decision: removed
      decision_reason: "على الرغم من ورودها في المعجم الطبي الموحد كترجمة لـ oral character، إلا أنها غير شائعة الاستخدام في السياق النفسي العام مقارنة بـ 'شخصية' أو 'نمط'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

stage4_content:
  definition:
    current: "(التحليل النفسي) شخصية تتميز إما بالتفاؤل السخي أو الأنانية العدوانية والطموحة؛ تتشكل في الطفولة المبكرة عن طريق التثبيت خلال المرحلة الفموية من التطور"
    assessment:
      decision: revise
      reason: "لتحويل الصياغة من أسلوب الترجمة الحرفية إلى أسلوب التعريف المعجمي العربي الرصين."
    authored:
      - type: terminological
        text: "في التحليل النفسي: نمطٌ من الشخصية يتسمُ إما بالتفاؤل المفرطِ أو بالأنانية العدوانية، ويُعزى نشوؤُه إلى التثبيتِ في المرحلة الفموية من التطور النفسي الجنسي في الطفولة المبكرة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-04627303-n", definition_index: 0, text: "في التحليل النفسي: نمطٌ من الشخصية يتسمُ إما بالتفاؤل المفرطِ أو بالأنانية العدوانية، ويُعزى نشوؤُه إلى التثبيتِ في المرحلة الفموية من التطور النفسي الجنسي في الطفولة المبكرة."}
  examples:
    per_lemma:
      - lemma: "شَخْصِيَّة فَمَوِيَّة"
        examples:
          - text: "تُظهِرُ بعضُ حالاتِ الإدمانِ سماتِ الشخصيةِ الفمويةِ التي تَمِيلُ إلى الاستهلاكِ المفرط."
            type: usage
      - lemma: "نَمَط فَمَوِيّ"
        examples:
          - text: "يُصنِّفُ المحللُ النفسيُّ هذا المريضَ ضمنَ النمطِ الفمويِّ بناءً على سلوكِهِ الاتكاليِّ وتفاؤلِهِ غيرِ الواقعي."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-04627303-n", text: "تُظهِرُ بعضُ حالاتِ الإدمانِ سماتِ الشخصيةِ الفمويةِ التي تَمِيلُ إلى الاستهلاكِ المفرط."}

