step0_evidence:
  per_lemma:
    - lemma: "مقاتل"
      confirm:
        - text: "«مَن يصلح للقتال أو يباشره»"
          source: "المعجم الوسيط"
    - lemma: "محارب"
      confirm:
        - text: "«مُحارِب: مشترِكٌ اشتراكًا فعليًا في الحرب»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مستعدّ للقتال / مولَع بالقتال»"
          source: "المورد الحديث (2008)"
      peripheral_observations:
        - "المعجم الكبير: ذكر الكلمة كاسم علم لقبيلة (بنو مُحارب)."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُعَارِك"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُعارِك؛ المُشاجِر؛ المُقاتِل.» — المورد الحديث (2008)"
      justification: "اسم فاعل من عارك، يعبر عن خوض القتال، وورد صراحة في المعاجم ثنائية اللغة مقابلاً للكلمات الإنجليزية المترادفة."
    - lemma: "مُشَاجِر"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُعارِك؛ المُشاجِر؛ المُقاتِل.» — المورد الحديث (2008)"
      justification: "ورد في المعاجم ثنائية اللغة مقابلاً للكلمة الإنجليزية scrapper."
  knowledge_candidates:
    - lemma: "مُجَالِد"
      justification: "اشتقاق: اسم فاعل من الفعل جالد (قاتل بالسيف)، يدل على من يقاتل بضراوة."
  generation_notes: "تم توليد المرشحات بالاعتماد على الجسر الإنجليزي والمعرفة اللغوية بالاشتقاق."

step1_lemma_validation:
  per_lemma:
    - lemma: "مقاتل"
      decision: confirmed
      decision_reason: "مصطلح أساسي دقيق ومطابق للتعريف، يعبر عن من يباشر القتال، متداول بكثرة ومستقر."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الحدث نفسه (القتال) ومن يباشره، وهي أعم وأشمل."
      example: "أثبت المقاتل شجاعة فائقة في أرض المعركة."
    
    - lemma: "محارب"
      decision: confirmed
      decision_reason: "اسم فاعل فصيح ومتداول يدل على من يشترك في الحرب."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "ترتبط أكثر بالاشتراك في الحرب (war) وقد تدل على صفة المهنة أو الانتماء، بخلاف المقاتل التي تركز على فعل القتال."
      example: "عاد المحارب إلى وطنه بعد انتهاء الحرب الطويلة."

    - lemma: "مُعَارِك"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح، اسم فاعل من عارك، يدل على من يخوض العراك أو المعركة، ويشكل إضافة جيدة للمجموعة."
      step05_citation: "«المُعارِك؛ المُشاجِر؛ المُقاتِل.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تحمل ظلاً دلالياً يشير إلى الالتحام الجسدي أو خوض المعارك المتكررة."
      example: "كان الجندي معاركاً شرساً لا يهاب الأعداء."
      actions:
        - command: create_entry
          params:
            lemma: "مُعَارِك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09958771-n"

    - lemma: "مُشَاجِر"
      source: step05
      decision: removed
      decision_reason: "ارتباط الكلمة في الاستعمال الشائع بالشجار (النزاع الذي قد يكون كلامياً أو يدوياً بسيطاً) يبعدها عن المعنى العسكري والمقصود هنا (القتال/الحرب)."
      step05_citation: "«المُعارِك؛ المُشاجِر؛ المُقاتِل.» — المورد الحديث (2008)"

    - lemma: "مُجَالِد"
      source: step05
      decision: removed
      decision_reason: "ذات دلالة تاريخية أضيق (تطلق غالباً على المصارعين أو من يقاتلون بالسيوف قديماً)، ولا تكافئ دلالة المقاتل العامة."
      step05_citation: "اشتقاق مقترح من جالد."

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "مُعَارِك"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

