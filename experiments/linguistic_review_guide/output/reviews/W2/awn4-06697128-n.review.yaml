# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06697128-n
# a message that makes a pledge — رسالة تقدم تعهداً
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «رسالة تقدم تعهداً» فيه دور جزئي لأن لمّة «تعهد» مستخدمة في التعريف ذاته"
      - "المجموعة تصنّف المفهوم كنوع فرعي من رسالة/مضمون، لكن اللمّتين الموجودتين (التزام، تعهد) تدلّان على المفهوم المجرد أكثر من الرسالة بوصفها وعاءً"
    observations: "المفهوم المستهدف هو نوع من الرسائل أو البيانات يتضمّن وعداً ملزماً. في الاستعمال العربي المعاصر يُقال «وقّع التزاماً» و«كتب تعهداً» على سبيل المجاز المرسل، فيُطلق المصدر ويُراد به الوثيقة. اللمّتان صالحتان لهذا المعنى بشرط فهم هذه النقلة الدلالية من الحدث إلى الوثيقة."

  blind_candidates:
    - lemma: "عَهْد"
      generation_method: ishtiqaq
      justification: "من جذر ع-ه-د على وزن فَعْل، يدلّ على الوصيّة والموثق واليمين، وقد يُراد به الوثيقة المكتوبة كما في «العهد الذي يُكتب للولاة»"
    - lemma: "مِيثَاق"
      generation_method: ishtiqaq
      justification: "من جذر و-ث-ق على وزن مِفْعال، يدلّ على العهد المحكم الموثّق، وهو بطبيعته رسالة أو وثيقة تتضمّن تعهداً"
    - lemma: "كَفَالَة"
      generation_method: ishtiqaq
      justification: "من جذر ك-ف-ل على وزن فَعالة، تدلّ على الضمان والتعهد بإحضار أو أداء شيء، وقد تكون وثيقة مكتوبة"
    - lemma: "ضَمَانَة"
      generation_method: ishtiqaq
      justification: "من جذر ض-م-ن على وزن فَعالة، وثيقة يضمن بها الرجل صاحبه وهي تعهد مكتوب أو شفوي"


stage2_evidence:
  per_lemma:
    - lemma: "الْتِزَام"
      confirm:
        - text: "«تَقيُّد شفوي أو مكتوب بشيء وتحمل المسؤولية في حالة عدم تنفيذه.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«التزام = commitment»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«التزام = obligation»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«الالتزام: عند أهل البديع هو لزوم ما لا يلزم، ويسمّى بالتشديد والإعنات والتضمين أيضاً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة بلاغية مختلفة تماماً عن المعنى المعجمي العام"

    - lemma: "تَعَهُّد"
      confirm:
        - text: "«(تعهد) بالشَّيْء الْتزم بِهِ»"
          source: "المعجم الوسيط"
        - text: "«(4) تعهُّد؛ ضمان» [ترجمة undertaking]"
          source: "المورد الحديث (2008)"
        - text: "«(4) «أ» تعهُّد. «ب» التزام» [ترجمة commitment]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التعهد: التردد إلى الشيء وإصلاحه، وحقيقته تجديد العهد به، وتعهدته: حفظته»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المعنى الأصلي للتعهد هو التردد إلى الشيء والعناية به، ثم توسّع ليشمل الالتزام بأداء عمل"

    - lemma: "عَهْد"
      confirm:
        - text: "«العَهْدُ: الوَصِيَّةُ، والتَّقَدُّمُ إلى المَرْءِ في الشيءِ، والمَوْثِقُ، واليَمينُ... والذي يُكْتَبُ للوُلاةِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«العهد: حفظ الشيء ومراعاته حالاً بعد حال، ويسمى الوعد الموثق الذي يلزم مراعاته: عهداً»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«العهد: حفظٌ الشيء ومراعاتُه حالاً بعد حال ثم استعمل في الموثق... أيضاً الوصيةُ والضمانُ والمودّةُ والأمانَ والذمةُ»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "العهد مشترك لفظي كثير المعاني (وصية، أمان، ذمة، عصر، مطر...)، إدخاله في المجموعة يُضعف التحديد الدلالي"

    - lemma: "مِيثَاق"
      confirm:
        - text: "«(الْمِيثَاق) الْعَهْد (ج) مواثيق ومياثيق ومياثق»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«ميثاق = charter / pact»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الميثاق في الاستعمال المعاصر يدلّ على المعاهدة أو الدستور الرسمي، وهو أخصّ وأرفع من مجرد رسالة تعهد"

    - lemma: "كَفَالَة"
      contradicts:
        - text: "«الكفالة: إلزام إحضار من يستحق حضوره مجلس الحكم بإذنه»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الكفالة مصطلح قانوني خاصّ بضمان إحضار شخص أو أداء دين، لا يدلّ على رسالة تعهد عامة"
        - text: "«كَفالة: عقد يلتزم بمقتضاه شخص (الكفيل) للدائن بأداء التزام المدين»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الكفالة عقد ثلاثي الأطراف (كفيل، مكفول، دائن) لا ينطبق على مفهوم الرسالة المتضمنة تعهداً"

    - lemma: "ضَمَانَة"
      contradicts:
        - text: "«(الضمانة) وَثِيقَة يضمن بها الرجل صَاحبه أو يضمن بها البَائِع خلو الْمَبِيع من الْعُيُوب وبقاءه صَالحاً للاستعمال مُدَّة مُعينَة»"
          source: "المعجم الوسيط"
          conflict: "الضمانة مخصوصة بضمان السلع والمبيعات (warranty)، لا بالتعهد العام"


stage3_analysis:
  per_lemma:
    - lemma: "الْتِزَام"
      decision: confirmed
      decision_reason: "مصدر خماسي من لزم (التزم)، مستعمل استعمالاً واسعاً في العربية المعاصرة بمعنى التقيّد والتعهد، ويدلّ مجازاً على الوثيقة أو الرسالة المتضمنة لهذا التقيّد. الأدلة المعجمية والمصطلحية تؤكد صلاحيته."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على جانب الإلزام والتقيّد القانوني أو الأخلاقي، ويوحي بأنّ التعهد ناشئ عن قيد خارجي أو داخلي يحمل طابعاً رسمياً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِلْتِزَام"

    - lemma: "تَعَهُّد"
      decision: confirmed
      decision_reason: "مصدر خماسي من عهد (تعهّد)، يدلّ على المبادرة بالوعد والالتزام بأداء عمل. المعجم الوسيط يؤكد «تعهّد بالشيء: التزم به». يصلح للدلالة على الرسالة المتضمنة وعداً ملزماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على المبادرة الطوعية بالوعد وإلزام النفس، ويوحي بإرادة المتعهّد واختياره أكثر من الإلزام الخارجي"

    - lemma: "عَهْد"
      source: stage1
      decision: removed
      decision_reason: "لفظ مشترك كثير المعاني (وصية، موثق، يمين، عصر، مطر، أمان، ذمة...)، إدخاله يُضعف التحديد الدلالي للمجموعة. كما أنه يدلّ على العهد بين طرفين أكثر من دلالته على رسالة أحادية الاتجاه تتضمّن تعهداً."

    - lemma: "مِيثَاق"
      source: stage1
      decision: removed
      decision_reason: "الميثاق في الاستعمال المعاصر مخصوص بالمعاهدات الدولية والمواثيق الرسمية (charter/pact)، وهو أعلى رتبة من مجرد رسالة تعهد. لا يصلح كمرادف للمفهوم المستهدف."

    - lemma: "كَفَالَة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح قانوني خاصّ بعقد ثلاثي الأطراف (كفيل، مكفول، دائن) لضمان إحضار شخص أو أداء دين، لا ينطبق على مفهوم رسالة التعهد العامة."

    - lemma: "ضَمَانَة"
      source: stage1
      decision: removed
      decision_reason: "الضمانة في المعجم الوسيط مخصوصة بوثيقة ضمان السلع والمبيعات (warranty)، وهي أخصّ من المفهوم المستهدف ومختلفة عنه دلالياً."


