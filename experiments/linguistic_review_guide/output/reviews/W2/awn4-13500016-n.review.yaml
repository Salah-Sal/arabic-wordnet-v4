# مراجعة المجموعة الترادفية — Synset Review
# ID: awn4-13500016-n | ILI: i107566 | POS: n
# المفهوم: extravasation (تسلّل السائل الحيوي من الوعاء إلى الأنسجة)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────

stage1_review:
  assessment:
    concerns:
      - "لمّة «انصباب» تقابل في المعاجم الطبية المتعددة المصطلحَ الإنجليزي «effusion» لا «extravasation»؛ وهما مفهومان طبيان مختلفان: الانصباب هو تراكم السائل في التجاويف، أما التسرب الوعائي فهو خروجه من جدار الوعاء إلى الأنسجة."
      - "كلتا اللمّتين خاليتان من التشكيل."
      - "المجموعة تفتقر إلى لمّات كافية لمفهوم طبي دقيق."
      - "استخدام «نضح» في التعريف مُوهِم؛ إذ إن النضح في العلوم الطبيعية يقابل «osmosis» وليس «extravasation»."
    observations: >
      المفهوم يصف عملية انتقال سوائل حيوية (دم أو ليمف أو بول) من جدار الوعاء إلى
      الأنسجة المحيطة، وهو مصطلح طبي دقيق. الجذر الأنسب عربيًا هو «سرب» لما فيه
      من دلالة السيلان والخروج الخفي. أما الجذر «صبب» فيُلائم فعل الصبّ المتعمّد أو
      الفيضان وليس التسلّل الطبيعي عبر الجدار الوعائي. لا بدّ من مراجعة انتماء
      «انصباب» لهذه المجموعة بعد الاطلاع على أدلة قاعدة البيانات.

  blind_candidates:
    - lemma: "رَشْح"
      generation_method: majaz
      justification: >
        الرَّشْح في الأصل هو النَّدى أو العرق يبدو من الجسم؛ وهو لفظ كلاسيكي يدلّ
        على ظهور السائل عبر جدار رقيق أو مسامات، وهو مشابه وظيفيًا لعملية خروج
        السائل الحيوي عبر جدار الوعاء. يُحيي استعمال هذا اللفظ توسعة دلالية راسخة
        في الكلام العربي القديم.
    - lemma: "انبِثَاق"
      generation_method: ishtiqaq
      justification: >
        من الجذر «بثق» (شقّ مجرى للماء)، وزن انفعال؛ يدلّ على اندفاع سائل عبر
        فتحة في حاوية أو وعاء، وهو مطابق صوريًا لعملية خروج الدم عبر جدار الوعاء.
        البثق في المقاييس: يدلّ على التفتّح في الماء وغيره.
    - lemma: "تَرَشُّح"
      generation_method: ishtiqaq
      justification: >
        مصدر تفعّل من «رشح»، يدلّ على عملية النضوح التدريجي والتحلّل المتواصل.
        الوزن تفعّل مناسب للعمليات البيولوجية التدريجية؛ يختلف عن «الرشح» (الناتج)
        بكونه يدلّ على العملية ذاتها.
    - lemma: "انسِرَاب"
      generation_method: ishtiqaq
      justification: >
        مصدر انفعال من «سرب»؛ وهو الجذر الذي يدلّ في المقاييس على الذهاب في الأرض
        والسيلان الخفي (السَّرَبُ: الماء السائل من المزادة). انسراب يدلّ على التسلّل
        والخروج الخفي، وهو وصف دقيق للتسرب الوعائي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────

stage2_evidence:
  per_lemma:

    - lemma: "انصباب"
      confirm:
        - text: "«ارتشاح الدم أو غيره من سوائل الجسم في غير محلِّه»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — entry_id 469147"
      contradicts:
        - text: "translation_en: \"effusion\""
          source: "المعجم الطبي الموحد (2009) — entry_id 571991"
          conflict: >
            المعادل الإنجليزي المسجّل لـ«انصباب» في أكثر من مصدر طبي موحّد هو
            «effusion» لا «extravasation». الانصباب (effusion) يعني تراكم سائل
            في تجاويف الجسم كالجنب أو التامور، بينما التسرب الوعائي (extravasation)
            هو خروج السائل من جدار الوعاء إلى الأنسجة المحيطة. المفهومان متداخلان
            لكنهما مختلفان سريريًا ومصطلحيًا.
        - text: "translation_en: \"effusion\""
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992) — entry_id 458188"
          conflict: "تأكيد ثانٍ على أن «انصباب» يقابل «effusion» في المصطلح الصحي الموحّد."

    - lemma: "تسرب"
      confirm:
        - text: "«تسلل الدم أو غيره من وعائه إلى الأنسجة المحيطة به» — translation_en: \"extravasation\""
          source: "معجم المصطلحات الطبية (ج.2، 2003) — entry_id 738606"
        - text: "translation_en: \"extravasation\""
          source: "المعجم الطبي الموحد (2009) — entry_id 576813"
        - text: "«تسرب الصفراء» — translation_en: \"bile extravasation\""
          source: "معجم المصطلحات الطبية (ج.1، 1985) — entry_id 733210"
      expands:
        - text: "«(تسرب) انسرب وَمن الشَّراب تملأ وَالقوم في الطريق تتابعوا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani) — entry_id 890545"
          addition: "يُظهر أن تسرّب له دلالة الخروج التدريجي الخفي."
        - text: "«العَيْنُ: سَرَبَتِ الماءَ: سَرَبَ الشَّيءُ: خَرَجَ خُفْيَةً»"
          source: "المعجم الكبير (ocr) — entry_id 45340"
          addition: "الجذر يحمل دلالة الخروج الخفي الذي يناسب وصف التسلّل الوعائي."
        - text: "«جاء التسرب في المعاجم دالًّا على السيلان والتتابع وتحرك الشيء في خفية دخولاً أو خروجًا، واستُعمل حديثًا بمعنى التفلّت. وقد أجاز هذا الاستعمال مجمع اللغة المصري»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر — entry_id 851776"
          addition: "مجمع اللغة المصري أجاز التوسع في دلالة تسرّب لتشمل الخروج غير المرخَّص."

    - lemma: "رَشْح"
      confirm:
        - text: "«كل ما يَرْشَح من العرق ونحوه»"
          source: "المعجم الوسيط — entry_id 10700"
        - text: "«النَّداوَةُ تَبْدو من الشىء»"
          source: "المعجم الكبير — entry_id 93651"
        - text: "«كلُّ ما يَرْشَحُ من عَرَق ونَحْوِه — العَرَقُ»"
          source: "المعجم الكبير — entry_id 93665"
      expands:
        - text: "«الرَّاءُ وَالشِّينُ وَالْحَاءُ أَصْلٌ وَاحِدٌ; وَهُوَ النَّدَى يَبْدُو مِنَ الشَّيْءِ. فَالرَّشْحُ: الْعَرَقُ. يُقَالُ رَشَحَ بَدَنُهُ بِعَرَقِهِ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            الأصل الجذري يدلّ على ظهور الندى من الشيء — دلالة مشتركة مع
            extravasation لكنها تخصّ العرق والترشيح الخارجي لا التسلّل الوعائي الداخلي.

    - lemma: "انبِثَاق"
      contradicts:
        - text: "«انبعاث غاز أو رائحة أو ضوء من جسم ما، دون تغيير ظاهر لشكل أو حجم الجسم» — translation_en: \"emanation\""
          source: "مسرد المناخ والبيئة (ArabTerm) — entry_id 350565"
          conflict: "انبثاق مستقرّ في المعاجم الحديثة للدلالة على الانبعاث في الفيزياء والجيولوجيا، لا على التسلّل الوعائي."
        - text: "«الهواء والدخان من البركان» — translation_en: \"exhalation\""
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — entry_id 430846"
          conflict: "السياق الجيولوجي يُرسّخ الانبثاق في مجال مختلف تمامًا."

    - lemma: "تَرَشُّح"
      evidence_status: "no_material_found"

    - lemma: "انسِرَاب"
      expands:
        - text: "«وَيُقَالُ انْسَرَبَ الْوَحْشِيُّ فِي سِرْبِهِ... وَالسَّرَبُ وَالسَّرِبُ، وَهُوَ الْمَاءُ السَّائِلُ مِنَ الْمَزَادَةِ»"
          source: "مقاييس اللغة لابن فارس — جذر سرب (dictionary_id=151)"
          addition: >
            الجذر يحتوي على دلالة سيلان الماء من الإناء، غير أن «انسراب» لم يُسجَّل
            اصطلاحًا طبيًا خاصًا بالتسرب الوعائي.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────

stage3_analysis:
  per_lemma:

    - lemma: "انصباب"
      decision: removed
      decision_reason: >
        دلّت المعاجم الطبية الموحّدة المتعددة على أن «انصباب» يقابل الإنجليزية
        «effusion» (تراكم سائل في تجويف الجسم كالجنب أو التامور)، وليس
        «extravasation» (خروج السائل من الوعاء الدموي إلى الأنسجة). المفهومان
        مختلفان سريريًا: الانصباب يُعالَج بالبزل، أما التسرب الوعائي فمرتبط
        بتضرر جدار الوعاء. الإبقاء على هذه اللمّة يُسبّب خلطًا مصطلحيًا خطيرًا.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تسرب"
      decision: confirmed
      decision_reason: >
        مُثبَت في مصادر طبية موثوقة كمرادف دقيق لـ«extravasation»: معجم المصطلحات
        الطبية (ج.2، 2003) يعرّفه بـ«تسلل الدم أو غيره من وعائه إلى الأنسجة المحيطة
        به»، وكذا المعجم الطبي الموحد (2009). الجذر «سرب» يحمل في أصله دلالة السيلان
        الخفي من الإناء (مقاييس ابن فارس)، وهو ملائم صرفيًا ودلاليًا. اللمّة بحاجة
        إلى تشكيل كامل: تَسَرُّب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكّدة. تَسَرُّب يُركّز على خاصية التسلّل التدريجي الخفي
        (من «سرب» = ذهب في خفية)، وهو يُصوّر انتقال السائل عبر جدار الوعاء كالتسلّل
        البطيء لا الانفجار المفاجئ — وهو وصف دقيق لأغلب صور التسرب الوعائي السريري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسَرُّب"

    - lemma: "رَشْح"
      source: stage1
      decision: removed
      decision_reason: >
        الرَّشْح في المعاجم الكلاسيكية والحديثة يدلّ أساسًا على العرق ونَدى الجسد
        أو الرطوبة الطافية على سطح ما. لم يُسجَّل كمصطلح طبي لـ«extravasation».
        ارتباطه الراسخ بالعرق الجلدي يجعله مُوهِمًا في السياق الوعائي الداخلي.
        اختبار التثبيت المعجمي: غير موجود في المعاجم الطبية الموحّدة بمعنى التسرب الوعائي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "انبِثَاق"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الحديثة (ArabTerm) تستخدمه حصرًا في سياق الانبعاث الغازي الفيزيائي
        والانفجار الجيولوجي. لا صلة له بالتسلّل الوعائي في المصطلح الطبي الموحّد.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَرَشُّح"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي أو اصطلاحي طبي لـ«تَرَشُّح» بمعنى «extravasation».
        الجذر «رشح» يُعطي في المعاجم الطبية مشتقّات تتعلق بالترشيح الكيميائي
        (ارتشاح) والنضح النباتي، وليس بالتسلّل الوعائي الداخلي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "انسِرَاب"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الجذر «سرب» يحمل دلالة السيلان الخفي (الماء من المزادة)، فإن
        «انسراب» لم يُسجَّل في المعجمية الطبية الحديثة مصطلحًا خاصًا للتسرب
        الوعائي. «تسرّب» (تفعّل) هو الشكل المعتمد في المعاجم الطبية الموحّدة
        وهو أملأ دلالةً وأكثر إثباتًا من «انسراب».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────

stage4_content:
  definition:
    current: "عملية نضح أو خروج من وعاء إلى الأنسجة المحيطة؛ يقال عن الدم أو الليمف أو البول"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يستخدم «نضح» التي تدلّ في علم الأحياء والمعاجم الحديثة على
        عملية التناضح (osmosis) وليس على التسلّل الوعائي. كذلك «خروج من وعاء» عبارة
        فضفاضة لا تُحدّد أن الخروج يكون عبر جدار الوعاء إلى الأنسجة المجاورة
        (مما يُفرّق extravasation عن haemorrhage وعن effusion). الأدلة المعجمية
        تُقدّم تعريفًا أدق: «تسلل الدم أو غيره من وعائه إلى الأنسجة المحيطة به».
    authored:
      - type: terminological
        text: >
          عمليةُ انتقالِ سائلٍ حيويٍّ — كالدم أو الليمف أو البول — من داخلِ
          وعاءٍ دمويٍّ أو لمفاويٍّ عبرَ جدارِه إلى الأنسجةِ المُحيطةِ به
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          يحدث التسرُّب الوعائي حين يخرج الدم أو الليمف أو البول من مجراه الطبيعي
          في الوعاء الدموي أو اللمفاوي إلى الفضاء بين الخلايا في الأنسجة المحيطة؛
          وقد يحدث ذلك بسبب التهاب جدار الوعاء أو تمزّقه أو بسبب تسرّب الدواء
          الوريدي خارج الوريد أثناء التسريب. يتجلّى بالتورم والاحمرار والألم في
          المنطقة المصابة.
    actions:
