# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-05216164-n  |  ILI: i64340
# Concept: primality — خاصية كون الرقم أولياً
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'أولية' مجرّدة من التشكيل الكامل، مما يُلبّس بين أَوَّلِيَّة (primality) وأُولِيَّة (precedence)"
      - "التعريف الحالي دائري: يستخدم 'أولياً' لتعريف 'أوّلية'، مما يُخلّ بمعيار عدم الدوران"
      - "المجموعة تفتقر إلى تعريف يُوضّح الفصل النوعي (عدم القسمة إلا على النفس والواحد)"
    observations: >
      المفهوم المقصود هو الخاصية الرياضية المجردة لكون عدد طبيعي لا يقبل التحليل إلى
      عوامل سوى الواحد ونفسه. اللمّة المناسبة هي مصدر صناعي من الصفة "أوّلي" التي
      تعني "prime" في السياق الرياضي، ويُعبَّر عنها في اللغة العربية بصيغة فَعَّلِيَّة.
      جدير بالملاحظة أن المورد الحديث يُثبت مرادفاً قديماً لـ"الأوّلي" وهو "الأصم":
      «أوّليّ؛ أصمّ: لا ينقسم من غير باقٍ إلا على نفسه أو على واحد».
      هذا يفتح باباً لمصطلح اشتقاقي من جذر (صمم) إلى جانب المصطلح الراسخ.

  blind_candidates:
    - lemma: "أَصَمِّيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الجذر (صمم) على وزن فَعَّلِيَّة. في التراث الرياضي العربي وُصف
        العدد الأولي بـ"الأصم" لأنه لا يستجيب لأي قاسم سوى نفسه والواحد، مثلما
        لا يسمع الأصمّ النداء. "الأصميّة" تعني إذن خاصية كون العدد أصمّاً/أوّلياً.
        الجذر حيّ في العربية (صَمَم، أَصَمّ، صَمَّاء) ويحمل دلالة الانغلاق والعدم الاستجابة
        الملائمة تماماً لمفهوم الرقم الذي لا ينقسم.

    - lemma: "تَفَرُّدِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من المصدر "تَفَرُّد" (الجذر: فرد) على وزن تَفَعُّلِيَّة.
        العدد الأولي "متفرّد" بعدم قابليته للتحليل؛ يقف وحده دون أن يُرَدَّ إلى حاصل
        ضرب عاملين أكبر من الواحد. المصدر الصناعي يصف الخاصية المجردة لهذا التفرّد.

    - lemma: "بِكَارَة"
      generation_method: majaz
      justification: >
        مجاز بالمشابهة من الجذر (بكر): البِكْر هو الأوّل من نوعه الذي لم يُمَسَّ بعامل
        خارجي. العدد الأولي "بِكْر" بمعنى أنه لم يُلمَسْ بعملية الضرب من عاملين أكبر من
        الواحد. إحياء للفظ في مجال جديد مستوفياً شرط المشابهة الوظيفية.

    - lemma: "عُسْرُ الاِنْقِسَامِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي (idafi) من "عُسْر" + "الانقسام": خاصية "عُسر الانقسام" أي
        تعذُّر قسمة الرقم قسمة صحيحة على عدد سوى نفسه والواحد. يعتمد على الجذر
        الراسخ (عسر) بمعنى الصعوبة والتعذّر، وهي وحدة وصفية تصف المفهوم بدقة.


stage2_evidence:
  per_lemma:

    - lemma: "أولية"
      confirm:
        - text: "«أَوَّلِيَّة: مصدر صناعى، يقال: جاء في أَوَّليّة الناس وفلان له أَوَّليّة: لآبائه مفاخر»"
          source: "المعجم الكبير (مجمع اللغة المصري)"
        - text: "«أَوَّلِيَّة [فصيحة]: جاء ضمن قرارات مجمع اللغة المصري أنه إذا أريد صنع مصدر من كلمة يزاد عليها ياء النسب والتاء، وقد اعتمد مجمع اللغة المصري على هذه الصيغة اعتمادًا كبيرًا لتكوين مصطلحات جديدة تعبِّر عن مفاهيم العلم الحديث... والمعنى: أعطيت لها المرتبة الأوليّة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«أوّليّ؛ أصمّ: لا ينقسم من غير باقٍ إلا على نفسه أو على واحد. العدد الأوّليّ أو الأصمّ»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن 'أوّلي' هو المصطلح الرياضي الراسخ بمعنى prime، وأن العدد الأصم مرادفه التراثي؛ مما يدعم اشتقاق 'أوّلية' كخاصية"
        - text: "«أولية» (translation: primarity)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، ALECSO (ArabTerm)"
          addition: "يُثبت تداول 'أولية' كمصطلح تقني في العلوم الاجتماعية بمعنى 'primarity' — مفهوم مجاور للأوّلية الرياضية"
        - text: "«عدد أولي» (translation: prime number)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "يُرسّخ 'أوّلي' كصفة رياضية معتمدة، مما يدعم صياغة المصدر الصناعي 'أوّلية' كخاصية"

    - lemma: "أَصَمِّيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَفَرُّدِيَّة"
      contradicts:
        - text: "«التفردية: ما يميز مجموعة لغوية عن سواها. وتكون التفردية باطنة أو ظاهرة عن غير طوع» (translation: individuation)"
          source: "مسرد الإعلام والتواصل، ALECSO (ArabTerm)"
          conflict: "المصطلح محجوز في حقل اللسانيات بمعنى 'individuation'، لا علاقة له بالأوّلية الرياضية"
        - text: "«التفردية اللغوية هي ما يميز مجموعة لغوية عن سواها» (translation: Individuation)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "تكرار الدلالة اللسانية ذاتها في معجم متخصص آخر، مما يُرسّخ الاشتغال الحقلي ويمنع استخدامه للأوّلية الرياضية"

    - lemma: "بِكَارَة"
      contradicts:
        - text: "«البكارة: عُذرة الفتاة»"
          source: "المعجم الوسيط"
          conflict: "الكلمة مُختصّة تماماً بالعذرية الأنثوية في جميع المعاجم الكلاسيكية والحديثة، ولا مجال للمجاز الرياضي"
        - text: "«البكارة: عُذْرَة المرأة»"
          source: "المعجم الكبير"
          conflict: "تأكيد آخر على حصر الدلالة في مجال واحد لا يقبل التوسّع المصطلحي"

    - lemma: "عُسْرُ الاِنْقِسَامِ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:

    - lemma: "أولية"
      decision: confirmed
      decision_reason: >
        اللمّة مصدر صناعي فصيح مُقرَّر بقرار مجمع اللغة المصري، وإن كان معناها الأصلي
        "الأسبقية/الأولوية" فإن السياق الرياضي يُخصّصها بالمعنى المقصود بلا لبس.
        المصطلح "عدد أوّلي" راسخ في مصطلحات الرياضيات العربية الموحّدة منذ 1990،
        واشتقاق "أوّلية" كخاصية مجردة منه سليم قياساً وتداولاً. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة؛ تُعبِّر عن المفهوم المجرد للخاصية الرياضية بوصفها اسماً
        لا صفة (بخلاف "عدد أوّلي" الذي يعيّن العدد ذاته)، وهو تمييز ضروري في الخطاب
        الرياضي النظري عند الحديث عن الخاصية بمعزل عن العدد الحامل لها.
      morphology_check: >
        الوزن: فَعَّلِيَّة (مصدر صناعي) — مناسب تماماً للتعبير عن الخاصية المجردة وفق
        قرارات مجمع اللغة المصري. الجذر: أول (أَوَّلَ). الضبط الصحيح: أَوَّلِيَّة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَوَّلِيَّة"

    - lemma: "أَصَمِّيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن "الأصم" ورد بمعنى الأوّلي في معجم المورد الحديث، فإن "أصمية" بوصفها
        مصطلحاً مسكوكاً لم يُعثر له على أي توثيق معجمي أو تقني. فضلاً عن ذلك،
        فإن "أَوَّلِيَّة" أسبق توثيقاً وأكثر تداولاً في الكتابة الرياضية العربية، والاستغناء
        بها أولى تطبيقاً لمبدأ إيثار الراسخ على المُحدَث غير الموثَّق.
      evidence_assessment:
        case: no_material

    - lemma: "تَفَرُّدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح محجوز في حقل اللسانيات بمعنى "individuation" في مصدرين متخصصين
        على الأقل (ArabTerm 2002 و2009). استخدامه للأوّلية الرياضية سيُفضي إلى
        اشتراك لفظي مُضرّ، وهو مرفوض بمبدأ منع التزاحم الدلالي بين الحقول.
      evidence_assessment:
        case: contradicts_only

    - lemma: "بِكَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        الكلمة محجوزة للدلالة الأنثوية البيولوجية في جميع المعاجم الكلاسيكية والحديثة
        دون استثناء. المجاز المقترح لن يُقبل في الكتابة العلمية الرسمية لأنه يُحدث تصادماً
        دلالياً حادًّا مع المعنى الأصلي الراسخ. فشل اختبار الاطّراد والملاءمة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "عُسْرُ الاِنْقِسَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة على تداوله كمصطلح مسكوك. فضلاً عن ذلك، فشل اختبار التثبيت المعجمي:
        يمكن إبدال "عُسر" بـ"تعذّر" أو "صعوبة" مع بقائه صالحاً كوصف حرّ، مما يُثبت
        أنه عبارة وصفية لا وحدة معجمية ثابتة. مرفوض بمعيار السكّ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


