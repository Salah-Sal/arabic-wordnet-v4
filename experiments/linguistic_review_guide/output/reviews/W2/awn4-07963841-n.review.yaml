    concerns:
      - "اللمّة «ناس» موجودة في المجموعة الأعلى (hypernym awn4-07958392-n) أيضاً، مما يخلق تداخلاً دلالياً بين المجموعة وأمّها"
      - "التعريف العربي الحالي ترجمة حرفية ضعيفة للتعريف الإنجليزي، ويستخدم كلمة «الناس» التي هي من لمّات المجموعة (دوران)"
      - "اللمّة «قوم» تدلّ أصالةً على جماعة رجال أو قبيلة، لا على عامة الناس بالمعنى المراد"
    observations: "المجموعة تقابل المفهوم الإنجليزي folk/folks/common people، وهو مفهوم عربي أصيل يُعبَّر عنه بألفاظ مثل «العامّة» و«الدهماء» و«السَّواد» و«عامّة الناس». التعريف يحتاج إلى إعادة صياغة بأسلوب معجمي عربي. لمّة «ناس» عامّة جداً وتنتمي إلى المجموعة الأعلى لا إلى هذه المجموعة المخصوصة بعامّة الناس خلاف الخاصّة."

  blind_candidates:
    - lemma: "عَامَّة"
      generation_method: ishtiqaq
      justification: "من الجذر «عمم» الدالّ على الشمول والعموم، و«العامّة» خلاف «الخاصّة» في المعاجم العربية، فهي تدلّ تحديداً على عموم الناس وجمهورهم"
    - lemma: "دَهْمَاء"
      generation_method: ishtiqaq
      justification: "من الجذر «دهم» الدالّ على العدد الكثير والغشيان، و«الدهماء» في المعاجم: عامّة الناس وسوادهم والعدد الكثير منهم"
    - lemma: "سَوَاد"
      generation_method: majaz
      justification: "إزاحة دلالية من السواد بمعنى الكثرة والعدد إلى سواد الناس أي جمهورهم وعامّتهم، كما في قولهم «سواد الناس» أي معظمهم"
    - lemma: "عَوَامّ"
      generation_method: ishtiqaq
      justification: "جمع «عامّيّ» على وزن فَوَاعِل، يدلّ على أفراد العامّة من الناس خلاف الخواصّ والنُّخَب"


