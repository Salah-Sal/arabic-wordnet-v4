# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "شَجَن"
      entry_id: "{auto}"
      root: "شجن"
      maqayis_quote: "«الشِّينُ وَالْجِيمُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى اتِّصَالِ الشَّيْءِ وَالْتِفَافِهِ. مِنْ ذَلِكَ الشِّجْنَةُ، وَهِيَ الشَّجَرُ الْمُلْتَفُّ. وَيُقَالُ: بَيْنِي وَبَيْنَهُ شِجْنَةُ رَحِمٍ، يُرِيدُ اتِّصَالَهَا وَالْتِفَافَهَا. وَيُقَالُ لِلْحَاجَةِ: الشَّجَنُ، وَإِنَّمَا سُمِّيَتْ بِذَلِكَ لِالْتِبَاسِهَا وَتَعَلُّقِ الْقَلْبِ بِهَا»"

    - lemma: "تَهْيِيج"
      entry_id: "{auto}"
      root: "هيج"
      maqayis_quote: "«الْهَاءُ وَالْيَاءُ وَالْجِيمُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى ثَوَرَانِ شَيْءٍ، وَالْآخَرُ عَلَى يُبْسِ نَبَاتٍ. فَالْأَوَّلُ: هَاجَ الْفَحْلُ هَيْجًا وَهِيَاجًا. وَكَذَلِكَ الدَّمُ... وَهِجْتُ الشَّرَّ وَهَيَّجْتُهُ»"

  per_sense:
    - lemma: "شَجَن"
      sense_id: "{auto}"
      nuance: >
        يُعبّر عن الحزن الوجداني العميق الناشئ من «التفاف الهمّ بالقلب» وتعلّقه به؛ يحمل
        دلالة الاشتياق والذكرى الأليمة، ويُستعمل في الأدب والشعر للأثر الجمالي الحزين
        الذي يبقى في النفس. هو الباثوس في تجلّيه الإنساني-الجمالي.
      mwe: false

    - lemma: "تَهْيِيج"
      sense_id: "{auto}"
      nuance: >
        مصطلح بلاغي-تقني يُشير تحديداً إلى الأداة الخطابية المتعمَّدة لاستثارة مشاعر المتلقّي
        واستدرار عطفه وتعاطفه؛ هو الباثوس في تجلّيه البلاغي-الأرسطي (إحدى وسائل الإقناع
        الثلاث). يختلف عن شَجَن في كونه أداةً يوظّفها المُنشئ، لا أثراً يُصيب المتلقّي.
      mwe: false

  synset:
    cultural_fit: native
    cultural_fit_note: >
      المفهوم متجذّر في التراث العربي؛ فالعرب عرفوا الباثوس بمعناه الأدبي منذ القديم
      (شجن، وجد، أسى، حنين)، والمعجمية البلاغية العربية وثّقت «تهييج» مقابلاً للمصطلح
      الأرسطي. لا فجوة معجمية في هذا المجال.

