# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-05218522-n  |  ILI: i64354  |  POS: n
# pathos / poignancy — الباثوس / الشجن
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «إثارة المشاعر» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ تفشل اختبار السكّ إذ يمكن استبدال «المشاعر» بـ«العواطف» أو «الوجدان» بلا فقدان المعنى."
      - "لمّة «شجن» مكتوبة بلا تشكيل كامل، والصيغة غير محددة (هل هي الاسم شَجَن أم الفعل شَجِنَ؟)؛ يجب تثبيت الاسم المشكَّل شَجَن."
      - "التعريف العربي الحالي «صفة تثير العواطف (خاصة الشفقة أو الحزن)» ترجمة مباشرة للإنجليزية ويفتقر إلى أسلوب المعجم العربي الوسيط."
    observations: >
      المجموعة تُعبّر عن مفهوم «الباثوس» في ثلاثة مستويات: (١) المستوى الأدبي-الجمالي —
      الصفة التي تستدرّ الشفقة في الأثر الفني أو الموقف الإنساني. (٢) المستوى البلاغي-الأرسطي —
      التهييج بوصفه إحدى الأدوات الثلاث للإقناع (إلى جانب الإيثوس واللوغوس). (٣) المستوى
      النفسي-الوجداني — الانفعال الحزين الذي يستحوذ على النفس. المعجم العربي يملك ثروة مصطلحية
      لهذا المجال (شجن، شجو، وجد، أسى)، والأقرب دلالةً للمفهوم الكلي هو «شَجَن» للاستخدام
      العام، و«تَهْيِيج» للسياق البلاغي.

  blind_candidates:
    - lemma: "رِقَّة"
      generation_method: majaz
      justification: >
        لفظ عربي أصيل أصله ضدّ الغلظة، استُعير للدلالة على لين القلب وحنانه؛ فالشيء ذو الرقة
        هو ما يستثير العطف والشفقة. الإزاحة الدلالية واضحة: من ملمس اللين المادي إلى الأثر
        العاطفي الذي يُليّن القلوب.
    - lemma: "مَحْزَنَة"
      generation_method: ishtiqaq
      justification: >
        مشتقّ من جذر (ح-ز-ن) على وزن مَفْعَلَة الدالّ على مصدر الشيء أو مظنّته؛ فالمَحْزَنَة
        هي الخاصية أو الصفة التي تُورث الحزن، وهذا بالضبط ما يعنيه «الباثوس».
    - lemma: "إيلامِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من (أَلَم) على صيغة الفَعَّالية + ياء النسب + تاء المؤنث؛ يدلّ على الخاصية
        التي تُسبّب الألم النفسي وتثير الوجدان. الأداء الصرفي مناسب لتجريد المفهوم الوصفي.
    - lemma: "وَجَاعَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من (وجع) على وزن فَعَالَة الدالّ على الصفة المجردة؛ تعني الخاصية الموجِعة وجعاً
        نفسياً-وجدانياً. قريبة لفظياً ودلالياً من «poignancy» (الوخز العاطفي).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "إثارة المشاعر"
      contradicts:
        - text: "«إثارة المشاعر» [translation_en: sensitization] [domain: Information and Communication]"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          conflict: >
            المعجم المتخصص يُسجّل هذه العبارة بمعنى «التحسيس» و«التوعية» في مجال الإعلام،
            لا بمعنى الباثوس العاطفي؛ مما يكشف أن العبارة مستخدمة بدلالة مغايرة في التداول
            المصطلحي الرسمي.

    - lemma: "شجن"
      confirm:
        - text: "«الشَّجَن: الهَمُّ والحُزْنُ. الحاجة حيثما كانت. الغَصنُ المُشتبَك»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
        - text: "«الشَّجَن: الهم والحزن. الوطن. الفنون والأعراض والأطراف والنواحي»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«(شجن) شجنا حزن فهو شجِن»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«(شَجَنَ) الشِّينُ وَالْجِيمُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى اتِّصَالِ الشَّيْءِ وَالْتِفَافِهِ. مِنْ ذَلِكَ الشِّجْنَةُ، وَهِيَ الشَّجَرُ الْمُلْتَفُّ. وَيُقَالُ: بَيْنِي وَبَيْنَهُ شِجْنَةُ رَحِمٍ، يُرِيدُ اتِّصَالَهَا وَالْتِفَافَهَا. وَيُقَالُ لِلْحَاجَةِ: الشَّجَنُ، وَإِنَّمَا سُمِّيَتْ بِذَلِكَ لِالْتِبَاسِهَا وَتَعَلُّقِ الْقَلْبِ بِهَا; وَالْجَمْعُ شُجُونٌ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            يكشف التأصيل الجذري أن دلالة الحزن في «شجن» نابعة من فكرة «الالتفاف والتعلّق
            بالقلب»، وهو ما يُقارب «الباثوس» من حيث كونه صفة تنغرس في الوجدان ولا تفارقه.
        - text: "«(1) المُشْجي: العنصر المثير للشَّجا أو الأسَى أو الشفقة [في الحياة أو في التصوير الأدبيّ أو الفنيّ] (2) شفقة؛ رثاء.»"
          source: "المورد الحديث (2008)"
          addition: >
            يؤكد المعجم الحديث أن الاشتقاقات من شجن تُستعمل بالضبط لمعنى الباثوس في التصوير
            الأدبي والفني.
        - text: "«ش ج ن — هو أخو شجن وأشجان وشجون وهي الهموم والحاجات التي تهم... ذكرتك حيث استأمن الوحش والتقت رفاق من الآفاق شتّى شجونها»"
          source: "أساس البلاغة للزمخشري"
          addition: "يؤكد الاستعمال الشعري لـشجن في سياقات الحزن والاشتياق."

    - lemma: "رِقَّة"
      expands:
        - text: "«الرِّقَّةُ: التأدب عَن أَذَى يلْحق الْغَيْر»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani)"
          addition: "يُحدّد الرقة بمعنى الرحمة والحساسية تجاه أذى الآخرين — تداخل دلالي مع الشفقة."
        - text: "«رِقَّة: من (ر ق ق) ضد الغلظة والرحمة واللين والسهولة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُثبت أن الرقة تعني لين القلب والرحمة، وهو جانب من الباثوس لكنه ليس معادلاً له تاماً."
      contradicts:
        - text: "«الرَّقّةُ: ... وأصله كل أرض إلى جنب واد ينبسط عليها الماء...»"
          source: "المعجم الكبير (المعجم الكبير — ocr)"
          conflict: >
            أكثر مداخل رقة في المعجم الكبير تتعلق بالمكان الجغرافي (الرقة البيضاء على الفرات)
            لا بالخاصية العاطفية، مما يعني أن الدلالة العاطفية ثانوية وقابلة للتباس.

    - lemma: "مَحْزَنَة"
      evidence_status: "no_material_found"

    - lemma: "إيلامِيَّة"
      evidence_status: "no_material_found"

    - lemma: "وَجَاعَة"
      evidence_status: "no_material_found"

  additional_discovery:
    note: >
      كشفت استعلامات الجسر الإنجليزي عن مصطلح «تَهْيِيج» مسجَّل في المعجم الموحد لمصطلحات
      اللسانيات (2002) مقابلاً دقيقاً لـ pathos بالمعنى الأرسطي البلاغي، وهو مصطلح
      أكثر تخصصاً وتأصيلاً من «إثارة المشاعر» المراد إزالتها.
    takhyij_evidence:
      confirm:
        - text: "«تهييج: ميزة خِطابية وكتابية لاستدرار عطف المتلقي. حافز فني لإثارة التعاطف والتقمص الوجداني لاستمالة النفوس استغلالا للمشاعر، كطريقة من بين ثلاث طرائق أرسطية فاعلة.» [translation_en: pathos]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ALECSO ArabTerm"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إثارة المشاعر"
      decision: removed
      decision_reason: >
        فشلت اللمّة في ثلاثة اختبارات: (١) اختبار السكّ — «إثارة العواطف» و«إثارة الوجدان»
        تؤدّيان المعنى ذاته، مما يعني أن العبارة وصفية لا اصطلاحية. (٢) اختبار التثبيت المعجمي —
        العبارة لم تُوثَّق كوحدة معجمية ثابتة في أي من المصادر اللغوية الكلاسيكية أو الحديثة
        بهذا المعنى. (٣) الأدلة المعجمية تُسجّل «إثارة المشاعر» بمعنى «sensitization» في مجال
        الإعلام والتواصل، لا بمعنى الباثوس العاطفي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        mwe_validation: >
          رغم كونها تركيباً إضافياً (إثارة + المشاعر)، إلا أنها لا تُعدّ وحدة معجمية ثابتة
          لأن أي مكوّن يمكن استبداله بمرادف وتبقى العبارة قابلة للاستخدام كوصف.
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "شجن"
      decision: confirmed
      decision_reason: >
        كلمة عربية أصيلة متجذّرة في كتاب العين والمقاييس والمعجم الكبير وأساس البلاغة وغيرها؛
        معناها الهمّ والحزن الناشئ عن تعلّق القلب، وهو معادل وجداني دقيق للباثوس بمعناه العام.
        مشكّلة كما يلي: شَجَن (اسم) — الهمّ والحزن.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        شَجَن يُعبّر عن الحزن الوجداني الممزوج بالتعلّق والحنين؛ يلتصق بالقلب ولا يفارقه
        (لالتباسه به)، ويُستخدم في السياق الشعري والأدبي للتعبير عن الأثر العاطفي العميق.
        يختلف عن تَهْيِيج الذي يُركّز على البُعد البلاغي-التقني في استدرار العواطف.
      morphological_check: >
        وزن فَعَل (مصدر) على الجذر الثلاثي ش-ج-ن؛ مناسب للدلالة على الحالة النفسية المجردة.
      loan_check: كلمة عربية خالصة، لا اقتراض ولا ترجمة حرفية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَجَن"

    - lemma: "رِقَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود أدلة على استخدام الرقة بمعنى العطف ولين القلب، إلا أن معناها الأساسي هو
        ضدّ الغلظة واللين والرحمة بشكل عام، وليس الصفة التي تستدرّ الشفقة أو تُثير الحزن.
        والمشكلة أن الرقة تصف خاصية في المتلقّي (كونه رقيق القلب) لا خاصية في الشيء
        (كونه باعثاً على الشفقة)؛ وهذا الفارق الدلالي يُبعدها عن المعنى المقصود.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مَحْزَنَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي للّفظ «مَحْزَنَة» بالمعنى المصطلحي المطلوب. على الرغم من
        صلاحية الاشتقاق الصرفي نظرياً، إلا أنه غير متداول ولا مسجَّل في المصادر المتاحة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "إيلامِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مصطلح مستحدث (مصدر صناعي) غير موثّق في المعاجم؛ وعلى الرغم من نجاحه نظرياً
        في التعبير عن «الخاصية المُسبّبة للألم النفسي»، فإن غياب التوثيق وعدم التداول يحولان
        دون قبوله.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "وَجَاعَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي لـ«وَجَاعَة» بالمعنى المصطلحي المقصود. الوزن الصرفي صحيح
        ومُنتج، لكن اللفظ غير مسجَّل بهذه الدلالة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

  # إضافة مصطلح مكتشف من الأدلة (غير موجود في المجموعة ولا في مرشحات المرحلة ١)
  discovered_additions:
    - lemma: "تَهْيِيج"
      source: evidence_discovery
      decision: confirmed
      decision_reason: >
        وثّق المعجم الموحد لمصطلحات اللسانيات (ALECSO, 2002) «تَهْيِيج» صراحةً مقابلاً
        لـ pathos بمعناه البلاغي الأرسطي: «ميزة خطابية وكتابية لاستدرار عطف المتلقي...
        كطريقة من بين ثلاث طرائق أرسطية فاعلة». وهو مشتقّ نظيف من جذر (هيج) على وزن
        تَفْعِيل للحدث المتعمَّد، وقد سبق لمعجمٍ عربي متخصص في اللسانيات أن سكّه رسمياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَهْيِيج يُركّز على البُعد البلاغي-التقني: هو الأداة المتعمَّدة التي يوظّفها المتكلم
        أو الكاتب لاستثارة مشاعر المتلقّي وكسب تعاطفه، في مقابل شَجَن الذي يصف الأثر
        الوجداني العميق في النفس.
      morphological_check: >
        تَفْعِيل من (هيج)؛ الوزن يدلّ على التكثير والتعمّد في الإثارة. مناسب للسياق البلاغي.
      loan_check: كلمة عربية خالصة مشتقة من هاج-يهيج. لا اقتراض.
      actions:
        - command: create_entry
          params:
            lemma: "تَهْيِيج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


