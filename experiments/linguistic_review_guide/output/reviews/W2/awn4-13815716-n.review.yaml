        التعريف الحالي عبارة عن ترجمة حرفية للنص الإنجليزي «a connection of
        inclusion or containment»، وإن كان صحيحاً في جوهره. يفتقر إلى تحديد
        طبيعة الطرفين (شيء يحوي وشيء محوي) وإلى التمييز بين الاشتمال الكلّي
