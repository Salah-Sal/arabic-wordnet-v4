    assessment:
      decision: revise
      reason: >
        ثلاثة عيوب تستوجب التعديل:
        (١) تقييد المفهوم بالشعر ('للشعر') خطأ بلاغي: الاستطراد في التراث العربي
        يشمل القرآن الكريم والنثر الفني والكلام عامةً كما هو صريح في كشاف اصطلاحات
