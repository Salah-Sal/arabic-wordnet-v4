# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يُقيّد الاستطراد بالشعر تحديدًا ('السمة المميزة للشعر') وهو تضييق غير دقيق؛ فالاستطراد في البلاغة العربية الكلاسيكية والحديثة يشمل النثر والخطابة والقرآن الكريم، وقد ضرب له التهانوي والمناوي أمثلةً قرآنيةً ونثريةً صريحة."
      - "اللمّة الموجودة 'استطراد' مكتوبة بلا تشكيل، وينبغي ضبطها الكامل: اِسْتِطْرَاد."
      - "التعريف مترجم حرفيًّا من الإنجليزية ولا يعكس صياغة المعجم العربي ولا يُفيد بالسمة الجوهرية للمفهوم (كونُه على سبيل الاستتباع لا القصد)."
    observations: >
      المجموعة تمثّل مفهوم 'الاستطراديَّة' (digressiveness) بوصفه خاصيةً أسلوبيةً،
      أي صفةَ الخروج العَرَضيّ عن الموضوع في نسيج الكلام. واللمّة 'استطراد' مصطلح
      بلاغي راسخ موثَّق في المعجمية العربية منذ القرن الرابع عشر (كتاب التعريفات للجرجاني
      ت813هـ) حتى المعاجم الحديثة (المعجم الموحد لمصطلحات اللسانيات 2002). وجوهر المفهوم
      في التراث العربي أن الكلام يجرّ الكلام فيُورَد معنًى ليس مقصودًا بالذات بل بالعرض
      أو على وجه الاستتباع — وهو ما تُعبّر عنه صياغة الجرجاني بدقة. المشكلة الرئيسية
      في التعريف الحالي وليست في اللمّة.

  blind_candidates:
    - lemma: "شُرُود"
      generation_method: majaz
      justification: >
        من شَرَدَ — النفارُ والابتعاد؛ المجاز هنا من التَّنفُّر الحسّي إلى الانفلات
        الذهني من قيد الموضوع والتسرّب إلى اهتمام آخر. يُحيي لفظًا عربيًّا أصيلًا
        للدلالة على الخروج الأسلوبي العَرَضيّ.
    - lemma: "اِنْزِيَاح"
      generation_method: ishtiqaq
      justification: >
        من زيح/زوح، وزن انفعال يدلّ على الحركة بعيدًا عن نقطة المرجع. مصطلح
        شائع في النقد الأدبي الحديث للدلالة على الانحراف الأسلوبي عن المألوف.
        يُمثّل الجانب الأسلوبي للخروج عن المسار المتوقع في الكلام.
    - lemma: "اِسْتِطْرَادِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بزيادة ياء النسب والتاء على 'استطراد'، يُحوّله إلى اسم معنًى مجرد
        يدلّ على خاصية الاستطراد وصفته لا على حادثته المفردة، على غرار التمييز
        الإنجليزي بين digression وdigressiveness. يناسب التعريفَ الذي يبدأ بـ'السمة المميزة'.
    - lemma: "تَشَعُّب"
      generation_method: ishtiqaq
      justification: >
        من شعب، وزن تفعّل يدلّ على الانشعاب والتفرّع من محور واحد إلى محاور متعددة.
        يُعبّر عن الجانب البنيوي للاستطراد من حيث تشعّب الخطاب عن مساره الرئيسي
        نحو مسارات فرعية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# استعلامات نُفِّذت: ٣ استعلامات
# ١. مطابقة دفعية لجميع اللمّات (استطراد + المرشحات الأربعة)
# ٢. إثراء بالمعرّف (تعريفات مفصّلة لمداخل استطراد)
# ٣. جسر إنجليزي (digression, digressiveness, discursive, tangential)
# ٤. بحث FTS بالكلمات المفتاحية (خروج عن الموضوع، استطراد، انزياح)
stage2_evidence:
  per_lemma:

    - lemma: "استطراد"
      confirm:
        - text: "«الاستطراد: سوق الكلام على وجه يلزم منه كلام آخر، وهو غير مقصود بالذات بل بالعرض.»"
          source: "كتاب التعريفات للشريف الجرجاني (ت813هـ)"
        - text: "«الاستطراد: أَن يكون فِي شَيْء من الْفُنُون ثمَّ سنح لَهُ فن آخر يُنَاسِبه، فيورده فِي ذكره.»"
          source: "معجم مقاليد العلوم للسيوطي (ت911هـ)"
        - text: "«الاستطراد: ذكر الشيء في غير موضعه وقولهم وقع ذلك على وجه الاستطراد مأخود من الاجتذاب لأنك لم تذكره في موضعه بل مهدت له موضعا ذكرته فيه.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت1031هـ)"
        - text: "«الاستطراد: [في الإنجليزية] Digression [في الفرنسية] Digression عند البلغاء هو أن يذكر عند سوق الكلام لغرض ما يكون له نوع تعلّق به، ولا يكون السّوق لأجله، كذا في حواشي البيضاوي...»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (ت1158هـ)"
        - text: "«إقحامٌ لا يتصل بالموضوع مباشرة، لكنه يحيل على علاقة بعيدة كما أنه حالة موسوعية لتزاحم الأفكار والقوالب لحد إخراجه عن موضوعه.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — translation_en: digression"
      expands:
        - text: "«(1) استطراديّ: متنقّل من موضوع إلى آخر a discursive style (2) منطقيّ؛ غير حَدْسيّ (3) متنقّل؛ متجوّل.»"
          source: "المورد الحديث (2008) — للنسبة إلى الاستطراد"
          addition: "الصفة 'استطرادي' موثّقة في المورد الحديث مقابل discursive وdigressive، مما يُثبّت المصطلح المشتق من الجذر ذاته."
        - text: "«الاستطراد: (خويشتن از بيش دشمن بهزيمت دادن براى فريفتن وى) كَذَا فِي تَاج المصادر وَيُرَاد بِهِ فِي الْعُلُوم ذكر الشَّيْء لَا عَن قَصده بل بتبعية غَيره.»"
          source: "دستور العلماء للأحمدنكري"
          addition: "يُشير إلى أصل عسكري للكلمة (الاستدراج بالتظاهر بالفرار) ثم تحوّل المصطلح في علوم البلاغة للدلالة على الإيراد التبعي."

    - lemma: "شُرُود"
      confirm:
        - text: "«شُرود الذِّهن (في علم النَّفس): عَدَمُ الانتباهِ إلى الظُّروفِ المحيطةِ أو الملابساتِ الطارئةِ.»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«شُرُوْدٌ — fugue»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الشرود موثَّق في المعاجم الحديثة حصرًا في حقلَي علم النفس والطب (شرود الذهن، شرود صرعي، شرود هستيري)، لا في حقل البلاغة أو النقد الأدبي."
        - text: "«شرود — distraction»"
          source: "مسرد الفلسفة وعلم النفس"
          conflict: "التوثيق المعجمي يُثبّت أن شرود = distraction/fugue، لا digression."

    - lemma: "اِنْزِيَاح"
      contradicts:
        - text: "«انزياح — drift» (مجال: الجيولوجيا)"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "الانزياح مشغول في المعاجم المتخصصة بمعانٍ علمية دقيقة: الانزياح في الفيزياء (shift)، الجيولوجيا (drift)، الكيمياء (shifting)، الوراثة (shift)، وتقنية المعلومات (swim). لا يرد في أيٍّ من هذه المعاجم بمعنى الاستطراد البلاغي."
        - text: "«انزياح — displacement; shift» (مجال: الطب البيطري)"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: "المصطلح محجوز في الحقول العلمية ولا صلة له بالمعنى الأدبي المطلوب."

    - lemma: "اِسْتِطْرَادِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَشَعُّب"
      contradicts:
        - text: "«تشعّب — branching» (مجال: التربية)"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "تشعّب موثَّق بمعنى 'التفرع' في التعليم، لا بمعنى الاستطراد."
        - text: "«(تشعب) انْتَشَر وتفرق وَالزَّرْع وَنَحْوه صَار ذَا شعب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعنى الموثَّق هو التفرّق والانتشار الحسّي، لا الخروج الأسلوبي عن الموضوع."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "استطراد"
      decision: confirmed
      decision_reason: >
        اللمّة مصطلح بلاغي راسخ موثَّق منذ القرن التاسع الهجري في أمّهات المعاجم
        الاصطلاحية (الجرجاني، السيوطي، المناوي، التهانوي) وفي المعاجم الحديثة (المعجم الموحد
        لمصطلحات اللسانيات، المورد الحديث). الأدلة المعجمية متكاثرة وتُجمع على المعنى ذاته
        (ذكر شيء بالعرض لا بالقصد في سياق كلام ذي موضوع أصلي). اجتازت جميع بوابات الجودة:
        اطّراد الفصيح ✓، يُسر التداول ✓، الملاءمة ✓، إيثار التراثي ✓، إيثار العربي ✓،
        الاشتقاقية ✓. تحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تدلّ على الخاصية الأسلوبية للانتقال العَرَضي من الموضوع
        الأصلي إلى موضوع آخر على سبيل الاستتباع، مع احتفاظ الانتقال بخيط رابط بالسياق الأصلي
        (يختلف بذلك عن الانقطاع الكلّي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِطْرَاد"

    - lemma: "شُرُود"
      source: stage1
      decision: removed
      decision_reason: >
        الشرود موثَّق في جميع المعاجم الحديثة حصرًا في حقل علم النفس والطب (شرود الذهن =
        عدم الانتباه؛ شرود صرعي/هستيري)، ولا يرد في أيٍّ من معاجم البلاغة أو النقد الأدبي
        بمعنى الاستطراد. قبوله سيُنشئ تعارضًا مع المعنى التقني الراسخ.

    - lemma: "اِنْزِيَاح"
      source: stage1
      decision: removed
      decision_reason: >
        الانزياح مشغول في حقول علمية متعددة (فيزياء، جيولوجيا، كيمياء، وراثة) ولا يرد في
        معاجم اللسانيات أو البلاغة بمعنى الاستطراد. إضافته ستُخلط بين دلالتين متعارضتين.
        فضلًا عن ذلك، الانزياح في النقد الأدبي الحديث له معنى مخصوص (الانزياح الأسلوبي =
        écart) يختلف عن الاستطراد.

    - lemma: "اِسْتِطْرَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر لها على توثيق معجمي. وإن كانت مشتقًّا صرفيًّا سليمًا، إلا أنها تُضاعف
        اللمّة دون إضافة دلالية حقيقية: فـ'استطراد' يستوعب في سياقه معنى الخاصية الأسلوبية
        كما يستوعب معنى الفعل المفرد، وهذا واضح من تعريفات الجرجاني والتهانوي.

    - lemma: "تَشَعُّب"
      source: stage1
      decision: removed
      decision_reason: >
        تشعّب موثَّق بمعنى 'التفرّع والانتشار' لا بمعنى 'الاستطراد'. المعاجم الكلاسيكية
        تُدرجه فعلًا ماضيًا متعلقًا بالانتشار الحسّي للزرع والنبات، والمعاجم التقنية
        تُوثّقه بمعنى 'branching' التربوي. لا صلة توثيقية تربطه بالمفهوم البلاغي المطلوب.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
