        على وجه الاستتباع لا القصد — وهي الخاصية الجوهرية في البلاغة العربية؛
        (٣) إغفال اشتراط وجود صلة ولو بعيدة بالموضوع الأصلي (الذي يُفرّق الاستطراد
        عن الحشو الكلّي).
