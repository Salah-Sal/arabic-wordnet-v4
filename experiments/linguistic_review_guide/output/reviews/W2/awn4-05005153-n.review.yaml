        موثَّقة في المعاجم الاصطلاحية بمعنى Property/Characteristic الدقيق،
        و«جسدية» نسبة إلى الجسد. نمط «خاصية + نسبية» راسخ في المصطلحية
        العربية (خاصية فيزيائية، خاصية كيميائية). يحتاج فقط إلى إضافة
        التشكيل الكامل.
      evidence_assessment:
