        mwe_type: wasfi
      nuance_differentiation: >-
        يستعمل مصطلح «خاصية» في السياقات العلمية والطبية والفلسفية للإشارة
        إلى خاصية بعينها تنفرد بها الأجسادُ أو فئة منها، مع تمييز دقيق بين
        الخاصية العرضية والذاتية؛ أدقّ من «صِفَة» في الأدب التخصصي.
      quality_gate:
