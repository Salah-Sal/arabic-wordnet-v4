# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «خاصية جسدية» خالية من التشكيل الكامل، وهو إلزامي في AWN4"
      - "المجموعة تحتوي على لمّة وحيدة مما يُضعف التغطية المعجمية"
      - "التعريف «سمة من سمات الجسم» فيه تكرار دلالي: استُخدمت «سمة» في المُعرِّف وهي مرادفة للمُعرَّف «خاصية»، فضلاً عن ضعف الفصل النوعي"
    observations: >-
      المجموعة تمثّل مفهوماً فلسفياً وعلمياً عاماً يشمل جميع الخصائص الجسدية
      من طول ووزن ولون وبنية وغيرها. اللمّة الموجودة مركّبٌ وصفي (خاصية + جسدية)
      صحيحُ البناء النحوي، والمرادف الأعلى «خَاصِّيَّة جَوْهَرِيَّة» يحمل تشكيلاً كاملاً
      مما يُبرز الحاجة إلى معالجة اللمّة المُراجَعة. الجذر «خصّ» يفيد الانفراد
      والتمييز وهو مناسب تماماً للمفهوم. المقابل الإنجليزي «bodily property» شائع
      في الأدبيات الطبية والفلسفية.
  blind_candidates:
    - lemma: "خِلْقَة"
      generation_method: majaz
      justification: >-
        لفظ قرآني أصيل من جذر «خ ل ق» يدل على ما فُطر عليه الكائن من هيئة
        جسدية وطبيعة مادية. فيه إزاحة دلالية من «فعل التقدير والخلق» إلى
        «ناتج الخلق وما يتسم به الجسد من صفات فطرية». يُحيي لفظاً تراثياً
        راسخاً بدلاً من الاقتراض.
    - lemma: "صِفَة جَسَدِيَّة"
      generation_method: tarkib
      justification: >-
        مركّب وصفي (wasfi) من «صِفَة» (الأمارة اللازمة للشيء) و«جَسَدِيَّة»
        (نسبة إلى الجسد). «صِفَة» أكثر شيوعاً وبساطةً من «خاصية» في السياق
        اليومي والنفسي والوصفي. ثابتٌ في الاستخدام العلمي والنفسي والتربوي.
        اجتاز اختبار السكّ: «صِفَة» لا تُبدَل هنا بمرادفها بلا تغيير في المعنى المصطلحي.
    - lemma: "خَاصِّيَّة جِسْمانِيَّة"
      generation_method: tarkib
      justification: >-
        مركّب وصفي (wasfi) من «خَاصِّيَّة» و«جِسْمانِيَّة» (نسبة إلى الجسمان
        أي الجسم كله). يُميِّز «جِسْماني» الدالّ على ما يحلّ في الجسم كله عن
        «جَسَدِي» الدالّ على الجسد المادي البشري. مستعمَل في الفلسفة الإسلامية
        وعلم الكلام والطب. وحدة معجمية ثابتة في المصادر الفلسفية.
    - lemma: "بَدَنِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من جذر «ب د ن» على وزن (فَعَلِيَّة) بمعنى الانتساب إلى
        البَدَن. الجذر يدل في مقاييس اللغة على شخص الشيء دون شواه (أطرافه)،
        فـ«بَدَنِيَّة» تُلمح إلى صفة خاصة بالبدن بجسده الأصلي دون الأطراف.
        مستخدَم في السياقات الصحية والرياضية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "خاصية جسدية"
      confirm:
        - text: >-
            «الخاصيّة: [في الانكليزية] Characteristic, property [في الفرنسية]
            Caracteristique, propriete — بإلحاق الياء تستعمل في الموضع الذي
            يكون السبب فيه مخفياً كقول الأطباء هذا الدواء يعمل بالخاصية.
            فقد عبّروا بها عن السبب المجهول للأثر المعلوم.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت ١١٥٨هـ)"
        - text: >-
            «الخاصية: كلية مقولة على أفراد حقيقة واحدة فقط قولاً عرضياً
            سواء وجد في جميع الأفراد كالكاتب بالقوة بالنسبة للإنسان، أو
            في بعض أفراد.»
          source: "التوقيف على مهمات التعاريف للمناوي (ت ١٠٣١هـ)"
      expands:
        - text: >-
            «خاصية فيزيائية — physical property — propriété physique»
            (مصطلح معجم مصطلحات الكيمياء والصيدلة)
          source: "المعجم الموحد لمصطلحات الكيمياء (ARABTERM، ١٩٩٢)"
          addition: >-
            يثبت أن نمط المركّب «خاصية + صفة نسبية» راسخٌ في المصطلحية
            العربية الحديثة (خاصية فيزيائية، خاصية كيميائية...)، مما يؤكد
            سلامة بناء «خاصية جسدية» على المنوال نفسه.

    - lemma: "خِلْقَة"
      confirm:
        - text: "«الخِلْقَةُ: الفِطْرَةُ التى فُطِرَ عليها الإِنسانُ»"
          source: "المعجم الكبير، مجمع اللغة العربية بالقاهرة"
        - text: "«خِلْقة: الفطرة وما ليس بعارض»"
          source: "موسوعة السلطان قابوس لأسماء العرب (١٩٨٥)"
        - text: >-
            «(الخِلقَة) الفطرة — ويقال عيبٌ خِلقي موجود من أصل الخلقة
            وليس بعارض»
          source: "المعجم الوسيط، مجمع اللغة العربية بالقاهرة (١٩٩٨)"
      contradicts:
        - text: >-
            «إِنَّه كريم بخِلقته [فصيحة] — المعنى: بطبيعته وفطرته»
            (معجم الصواب يُقيّد المعنى بالطبيعة الفطرية الثابتة)
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت ٢٠٠٣)"
          conflict: >-
            «خِلْقَة» تختص بالفطرة الكاملة الموروثة لا بأي خاصية جسدية
            طارئة أو مكتسبة، بخلاف المطلوب في المجموعة الترادفية التي
            تشمل أي سمة جسدية واسعة النطاق.

    - lemma: "صِفَة جَسَدِيَّة"
      evidence_status: "no_material_found"

    - lemma: "خَاصِّيَّة جِسْمانِيَّة"
      confirm:
        - text: >-
            «الجسماني: [في الانكليزية] Bodily, material [في الفرنسية]
            Corporel, materiel — هو الشيء الحال في الجسم»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت ١١٥٨هـ)"
        - text: "«(الجسماني) المنسوب إلى الجسم — ويقال رجل جسماني ضخم الجثة»"
          source: "المعجم الوسيط، مجمع اللغة العربية بالقاهرة (١٩٩٨)"
        - text: "«الجُسْمَانِيُّ: المنسوب إلى الجسم»"
          source: "المعجم الوسيط (OCR)، مجمع اللغة العربية بالقاهرة"

    - lemma: "بَدَنِيَّة"
      confirm:
        - text: "«بَدَنِيَّة: من (ب د ن) نسبة إلى البَدَن، أو نسبة إلى البَدَنة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (١٩٨٥)"
      contradicts:
        - text: "«بَدْنِيَّة: من (ب د ن) نسبة إلى البَدْن: السمنة والضخامة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (١٩٨٥)"
          conflict: >-
            التباس صرفي بين «بَدَنِيَّة» (نسبة إلى البَدَن) و«بَدْنِيَّة»
            (نسبة إلى البَدْن = السمنة)؛ الصيغتان متقاربتان رسماً مما يُوقع
            في الاشتراك اللفظي المُخلّ. فضلاً عن أن السياق المعجمي يُثبت
            استخدامها في أسماء الأعلام لا في المصطلح العلمي.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

