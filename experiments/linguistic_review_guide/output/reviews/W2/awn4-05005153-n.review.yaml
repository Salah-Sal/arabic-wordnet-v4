# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
stage5_enrichment:
  per_entry:
    - lemma: "خَاصِّيَّة جَسَدِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "خاصية"
