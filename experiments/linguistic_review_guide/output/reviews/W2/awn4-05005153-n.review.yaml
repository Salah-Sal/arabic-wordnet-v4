        «خِلْقَة» تدل في جميع المعاجم على الفطرة الكاملة الموروثة التي
        فُطر عليها الكائن، لا على خاصية جسدية بعينها. دلالتها مقيّدة
        بالصفات الخِلقية الفطرية الثابتة وتستثني الخصائص الجسدية الطارئة
        أو المكتسبة (كالوزن المكتسب أو اللياقة). عدم التطابق الدلالي مع
        سعة المفهوم المطلوب في المجموعة يستوجب الإزالة.
