# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'عامل معرفي' خالية من التشكيل الكامل"
      - "التعريف العربي الحالي لا يتضمن القيد المعرفي/الذهني صراحةً؛ إذ يصف أيّ عامل غير مادي لا عامل النسق المعرفي تحديداً"
      - "المجموعة تقتصر على لمّة واحدة وهي قليلة لمفهوم ذي تداول في أدبيات علم النفس المعرفي والفلسفة"
    observations: "المجموعة تمثل مفهوماً نفسياً-فلسفياً دقيقاً: عنصر غير ملموس يعمل في النسق الذهني ويُسهم في توليد نتيجة معرفية. المتضمَّن المباشر 'الإدراك والمعرفة' يُقيِّد المفهوم بالنطاق الذهني. التعريف الحالي ترجمةٌ حرفية من الإنجليزية تفتقر إلى القيد المعرفي الضروري للتمييز بين هذا المفهوم وسائر العوامل غير المادية. وزن فاعل لـ'عامل' مناسب للدلالة على الفاعلية والوظيفة، والنسبة 'معرفيّ' مستعملة في المصطلحية العربية الحديثة."

  blind_candidates:
    - lemma: "مُؤَثِّر"
      generation_method: ishtiqaq
      justification: "من الجذر أ-ث-ر على وزن مُفَعِّل، يعني ما يُحدِث أثراً ويُسهم في نتيجة؛ يُستعمل في الفلسفة والمنطق الكلاسيكي للدلالة على ما له تأثير في الحكم أو المعلول."
    - lemma: "مُحَدِّد مَعْرِفيّ"
      generation_method: tarkib
      justification: "مركب وصفي من مُحَدِّد (ما يضبط مساراً ويحدّه) + مَعْرِفيّ (نسبة إلى المعرفة/الإدراك)؛ مستعمل في أدبيات علم النفس المعرفي للدلالة على ما يُقيِّد مخرجاً ذهنياً."
    - lemma: "مُسَبِّب"
      generation_method: ishtiqaq
      justification: "من الجذر س-ب-ب على وزن مُفَعِّل، يعني الشيء الذي يُفضي إلى النتيجة ويكون علةً فيها؛ يُناظر التعريف 'يساهم في إنتاج نتيجة'."
    - lemma: "عَامِل إِدْرَاكيّ"
      generation_method: tarkib
      justification: "مركب وصفي من عَامِل (ما يؤدي دوراً وظيفياً) + إِدْرَاكيّ (نسبة إلى الإدراك الحسي والذهني)؛ يُبرز الطابع الإدراكي للعامل بأسلوب اصطلاحي موازٍ."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية: عامل معرفي + مؤثر + مسبب + محدد معرفي + عامل ادراكي + مسهم
#   Q2 — جسر إنجليزي: "cognitive factor" | "cognitive" | "factor"
#   Q3 — FTS عربي: "عامل معرفي" | "مؤثر معرفي" | "غير مادي" | "عوامل معرفية"
#   Q4 — إثراء بالمعرّف: entry_ids 807430, 817523, 738662
#   Q5 — ابن فارس (dictionary_id=151): جذور عمل، عرف، أثر
stage2_evidence:
  per_lemma:

    - lemma: "عَامِل مَعْرِفيّ"
      confirm:
        - text: "«عامل / معامل: 1- عنصر يساهم في إحداث نتيجة ما مثل المركبات الكيميائية الأساسية في حدوث التفاعلات الكيميائية. 2- كم أو رمز يستخدم في معادلة معينة.»"
          source: "معجم المصطلحات الطبية ج.2 (2003) — ARABTERM [entry_id=738662, translation_en=factor]"
      expands:
        - text: "«بناء معرفيّ: كل ما يوجد داخل العقل البشري من معلومات وخبرات معرفية يتأثر بها المتعلم في تعلمه في أي وقت من عمره.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM [entry_id=398384]"
          addition: "يؤكد اطّراد النسبة 'معرفيّ' في المصطلحية التربوية والنفسية العربية للدلالة على ما ينتسب إلى النسق الذهني."
        - text: "«أنساق معرفية: بنيات المعرفة المجردة.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM [entry_id=487552]"
          addition: "يُثبت أن 'معرفيّ' وصفٌ راسخ في المصطلحية العربية للدلالة على ما يتعلق بنسق المعرفة."

    - lemma: "مُؤَثِّر"
      confirm:
        - text: "«المُؤَثِّرُ: مَا ظهر تَأْثِيره فِي الحكم.»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م) — Hawramani [entry_id=807430]"
        - text: "«الْمُؤثر: مَا لَهُ تَأْثِير فِي الشَّيْء إِمَّا تَامّ فَهُوَ الْعلَّة التَّامَّة أَو غير تَامّ فَهُوَ الْعلَّة النَّاقِصَة. وَالْمرَاد بالتأثير التَّام عدم الاجتياج فِي إِيجَاد الْمَعْلُول إِلَى شَيْء آخر.»"
          source: "كشاف اصطلاحات الفنون للتهانوي — Hawramani [entry_id=817523]"

    - lemma: "مُحَدِّد مَعْرِفيّ"
      evidence_status: "no_material_found"

    - lemma: "مُسَبِّب"
      evidence_status: "no_material_found"

    - lemma: "عَامِل إِدْرَاكيّ"
      expands:
        - text: "«إِدْراكيّ: كُل عملية تقتضي الإلمام بمقاييس ترتيب المقولات السِّيمية التي تحدد العالم السيمانتيكي، قصد تسهيل التعرف على معنى (تعييني / مفهومي) يرتبط بالقيم العاطفية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM [entry_id=497806, translation_en=cognitive]"
          addition: "يُثبت أن 'إدراكيّ' مقابلٌ عربي ثابت لـ cognitive، مما يجعل 'عامل إدراكيّ' بنيةً مكافئة لـ'عامل معرفيّ'."


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عامل معرفي"
      decision: confirmed
      decision_reason: "المركب الوصفي 'عَامِل مَعْرِفيّ' سليم صرفياً ودلالياً: 'عَامِل' على وزن فاعل من عمل يدل على الفاعلية والوظيفة، و'مَعْرِفيّ' نسبة مستقرة في المصطلحية العربية الحديثة. اجتاز اختبار السكّ: لا يُبدَل 'معرفي' بـ'ذهني' دون تغيير الدلالة الاصطلاحية الدقيقة. الدليل من arabterm يُثبت 'عامل' بمعنى factor و'معرفي' صفةً راسخة. يحتاج تصحيح التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركِّز على الدور الوظيفي-الفعلي للعنصر الذهني غير المادي (أنه 'يعمل' في النسق المعرفي ليُحدِث نتيجة)، بخلاف 'مُؤَثِّر' الذي يُركِّز على العلاقة السببية، و'مُحَدِّد' الذي يوحي بالتقييد والضبط."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِل مَعْرِفيّ"

    - lemma: "مُؤَثِّر"
      source: stage1
      decision: removed
      decision_reason: "الدليل المعجمي قوي على أصالة اللفظ في الفلسفة والمنطق، غير أن 'المؤثِّر' بلا وصف مقيِّد مصطلحٌ فلسفي عام يشمل العلل المادية والمعنوية والإلهية، ولا يُحدِّد النطاق المعرفي. الضمُّ غير المقيَّد سيُحدِث تداخلاً مع مجموعات مفهومية أخرى."

    - lemma: "مُحَدِّد مَعْرِفيّ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على هذا المركب. 'مُحَدِّد' يوحي بالضبط والتقييد وهو أضيق من 'عامل' الذي يشمل العوامل المُعزِّزة والمُيسِّرة والكابحة. عدم التوثيق وضيق الدلالة يُوجبان الاستغناء."

    - lemma: "مُسَبِّب"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي. 'مُسَبِّب' يوحي بالسببية الحتمية (causation) لا بالإسهام الجزئي (contribution)؛ وهو تحريف للمعنى الأصلي الذي يُقرِّر أن العامل يُسهم لا يُسبِّب منفرداً."

    - lemma: "عَامِل إِدْرَاكيّ"
      source: stage1
      decision: removed
      decision_reason: "مترادف شبه تام للمّة الموجودة 'عَامِل مَعْرِفيّ'؛ اختبار الاستبدال يُبقي الدلالة العامة. 'إدراكيّ' ينحو نحو الإدراك الحسي (perceptual) بينما 'معرفيّ' أوسع (epistemic/cognitive) وأنسب للمجموعة. مبدأ عدم الترادف المطلق يُوجب الإبقاء على الأدق."


