        examples:
          - text: "تابعَ المشاهدون البَثَّ المباشرَ لحفل افتتاح الدورة الأولمبية عبر شاشات التلفزيون."
            type: usage
          - text: "أعلنت الهيئةُ الوطنيّةُ للإعلام أنّ بَثَّ نشرة الأخبار الرئيسية سيبدأ في الساعة الثامنة مساءً."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تابعَ المشاهدون البَثَّ المباشرَ لحفل افتتاح الدورة الأولمبية عبر شاشات التلفزيون."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
