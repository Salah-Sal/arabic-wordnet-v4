# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06264137-n (broadcast)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بث» بدون تشكيل — يجب تصحيحها إلى «بَثّ»"
      - "المجموعة تحتوي لمّة واحدة فقط، وهو أمر مقبول لكن يستحق البحث عن مرادفات"
      - "التعريف العربي ترجمة حرفية من الإنجليزية — يحتاج إعادة صياغة بأسلوب معجمي"
    observations: >
      المفهوم المقصود هو الرسالة المُذاعة عبر الراديو أو التلفزيون (أي المحتوى المبثوث لا عملية البث ذاتها).
      اللمّة «بث» من جذر «بثث» الذي يدلّ في أصله على تفريق الشيء وإظهاره ونشره، وقد توسّع
      المعنى في العربية المعاصرة ليشمل الإرسال الإذاعي والتلفزيوني. التعريف العربي الحالي
      يستخدم صيغة «يتم نقلها» وهي من أساليب الترجمة الحرفية، ويحتاج إلى إعادة صوغ.
  blind_candidates:
    - lemma: "بَثٌّ"
      generation_method: ishtiqaq
      justification: >
        مصدر «بَثَّ» على وزن فَعْل، توسّع دلالياً من التفريق والنشر إلى الإرسال الإذاعي
        والتلفزيوني، فأصبح يدلّ على المادة المُذاعة نفسها. شائع في الاستعمال المعاصر.
    - lemma: "إِذَاعَة"
      generation_method: ishtiqaq
      justification: >
        مصدر «أذاعَ» على وزن إفعالة من جذر «ذيع» الدال على الإظهار والانتشار.
        يُستعمل للدلالة على عملية البث الإذاعي وعلى المؤسسة الإذاعية.
    - lemma: "نَشْرَة"
      generation_method: ishtiqaq
      justification: >
        من جذر «نشر» الدال على فتح الشيء وتشعّبه. تُستعمل في السياق الإعلامي
        للدلالة على بيان مُذاع أو مكتوب (نشرة الأخبار، نشرة جوية).
    - lemma: "بَثٌّ إِذَاعِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي يجمع بين «بث» (الإرسال) و«إذاعي» (المتعلق بالإذاعة).
        يُستخدم في المصطلحات التقنية للدلالة على البث عبر الراديو.


stage2_evidence:
  per_lemma:
    - lemma: "بَثّ"
      confirm:
        - text: "«البَثّ: إذاعة الصوت أو الصُّوَر بالراديو أو بالتلفزيون»"
          source: "المورد الحديث (2008)"
        - text: "«بَثٌّ — broadcast»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«بث — broadcasting»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«إذاعة، بثّ — الإرسالُ الموجَّهُ إلى أكثر من مستقبلٍ واحد، مثل الإذاعة أو التلفزة»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«بث فلان الحديث أذاعه ونشره. وبث السلطان الجند نشرهم في البلاد»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«بَثُّ الشيءِ: تفريقُه. وبَثَثْتُ الشيء والخبر: نشرته»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: "الأصل اللغوي للبث هو التفريق والنشر، وامتدّ إلى نشر الأخبار"
        - text: "«الْبَاءُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَفْرِيقُ الشَّيْءِ وَإِظْهَارُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على التفريق والإظهار، وهو أساس التوسّع الدلالي نحو البث الإعلامي"
        - text: "«الحال وأشدّ الحزن الذي لا يصبر عليه صاحبه فيبثّه والمرض الشديد»"
          source: "المعجم الوسيط"
          addition: "معنى كلاسيكي آخر للبثّ: أشدّ الحزن، وهو من باب إظهار ما في النفس"

    - lemma: "إِذَاعَة"
      confirm:
        - text: "«الإذاعة: نقل الكلام والموسيقى وغيرهما عن طريق الجهاز اللاسلكي. (مج)»"
          source: "المعجم الوسيط"
        - text: "«بث البرامج الإذاعية المتنوعة بواسطة الإرسال اللاسلكي»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الإذاعة: نقل الكلام والموسيقى وغيرهما عن طريق الجهاز اللاسلكي»"
          source: "المعجم الوسيط"
          conflict: >
            الإذاعة تدلّ على عملية النقل (المصدر) أو على المؤسسة الإذاعية،
            لا على الرسالة المنقولة ذاتها. المجموعة الترادفية تعرّف المفهوم بوصفه
            «رسالة» (message) لا عملية إرسال.

    - lemma: "نَشْرَة"
      contradicts:
        - text: "«النشرة: النسيم. وبيان يُكتب ويُنشر ليُعلم ما فيه (مو)»"
          source: "المعجم الوسيط"
          conflict: >
            النشرة في المعاجم تدلّ على بيان مكتوب يُنشر، أو النسيم، أو رقية.
            لا تدلّ على رسالة مُذاعة عبر الراديو أو التلفزيون.
        - text: "«نشرة — prospectus / brochure / issue»"
          source: "مصادر أرابترم متعددة"
          conflict: "الترجمات الإنجليزية تؤكّد أنّ النشرة منشور مكتوب لا بثّ إذاعي"

    - lemma: "بَثٌّ إِذَاعِيّ"
      confirm:
        - text: "«بث إذاعي — broadcast»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«البث الإذاعي — broadcasting (radio)»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      contradicts:
        - text: "«البث الإذاعي — broadcasting (radio)»"
          source: "المَكنَز الزراعي (AGROVOC)"
          conflict: >
            التقييد بـ«إذاعي» يجعل المركّب خاصاً بالبث الراديوي، في حين أنّ
            المجموعة الترادفية تشمل البث التلفزيوني أيضاً.


stage3_analysis:
  per_lemma:
    - lemma: "بَثّ"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكّدة بأدلة معجمية قوية: المورد الحديث يعرّف «البَثّ» صراحةً بأنّه
        «إذاعة الصوت أو الصُّوَر بالراديو أو بالتلفزيون»، ومصادر أرابترم المتعددة
        تترجمه بـ broadcast/broadcasting. الجذر «بثث» يدلّ على التفريق والإظهار والنشر،
        وهو أساس دلالي سليم للتوسّع نحو البث الإعلامي. يحتاج تصحيح التشكيل فقط.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَثّ"

    - lemma: "إِذَاعَة"
      source: stage1
      decision: removed
      decision_reason: >
        الإذاعة تدلّ في المعاجم على عملية النقل الإذاعي (المصدر) أو على المؤسسة
        الإذاعية (دار الإذاعة)، لا على الرسالة المُذاعة ذاتها. المجموعة الترادفية
        تُعرَّف بوصفها «رسالة تُنقل» (message transmitted)، والإذاعة ليست رسالة بل
        وسيلة نقل أو فعل النقل. لذا لا تصلح لمّةً في هذه المجموعة.
      evidence_assessment:
        case: mixed

    - lemma: "نَشْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        النشرة في المعاجم منشور مكتوب أو بيان يُوزَّع، وترجماتها الإنجليزية
        (prospectus, brochure, issue) تؤكّد بُعدها عن مفهوم البث الإذاعي أو التلفزيوني.
        وإن استُعملت في تركيب «نشرة الأخبار»، فذلك تركيب إضافي لا لمّة مفردة
        تدلّ على البث.
      evidence_assessment:
        case: contradicts_only

    - lemma: "بَثٌّ إِذَاعِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المركب الوصفي «بثّ إذاعي» يُقيّد الدلالة بالبثّ الراديوي دون التلفزيوني،
        كما يشهد تقييد AGROVOC بـ broadcasting (radio). والمجموعة الترادفية تشمل
        البث التلفزيوني أيضاً. فضلاً عن ذلك، اللمّة المفردة «بَثّ» تكفي للدلالة
        على المفهوم الشامل دون حاجة إلى تقييد.
      evidence_assessment:
        case: mixed


stage4_content:
  definition:
    current: "رسالة يتم نقلها عن طريق الراديو أو التلفزيون"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية: يستخدم صيغة المبني للمجهول
        «يتم نقلها» غير المستحسنة في العربية الفصيحة، ويفتقر إلى الجنس القريب
        الدقيق. يحتاج إلى إعادة صياغة بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: "مادّةٌ إعلاميّةٌ مسموعةٌ أو مرئيّةٌ تُرسَل إلى الجمهور عبر موجات الراديو أو إشارات التلفزيون"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يُذاع من كلامٍ أو صوتٍ أو صورةٍ بواسطة الراديو أو التلفزيون"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مادّةٌ إعلاميّةٌ مسموعةٌ أو مرئيّةٌ تُرسَل إلى الجمهور عبر موجات الراديو أو إشارات التلفزيون"

  examples:
    per_lemma:
