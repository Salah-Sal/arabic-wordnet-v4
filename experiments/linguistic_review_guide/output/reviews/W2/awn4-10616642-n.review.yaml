# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10616642-n
# signer / signatory — شخص يوقع على وثيقة ويلتزم بها
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «موقع» بلا تشكيل، مما يُحدث لبساً بين مَوْقِع (مكان) ومُوَقِّع (من يوقّع)"
      - "المجموعة تحتوي لمّة واحدة فقط، والمفهوم شائع ويستحق إثراءً بمرادفات"
    observations: "المفهوم واضح ومستقر في الاستعمال العربي المعاصر: شخص يضع توقيعه على وثيقة فيلتزم بمضمونها. الجذر «وقع» هو الأساس الاشتقاقي الطبيعي عبر الفعل «وقَّعَ» (فعَّلَ). كذلك يُستعمل «أمضى» بمعنى وقَّع، فاسم الفاعل «مُمْضٍ» مرشح محتمل. أما «التزم» فيدل على الالتزام العام لا على فعل التوقيع تحديداً."
  blind_candidates:
    - lemma: "مُوَقِّع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «وقَّعَ» على وزن مُفَعِّل، يدل مباشرة على من يقوم بفعل التوقيع على الوثائق"
    - lemma: "مُمْضٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «أمضى» (أفعلَ)، والإمضاء مرادف للتوقيع في الاستعمال القانوني والإداري"
    - lemma: "مُلْتَزِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «التزم»، يدل على من يلتزم بمضمون الوثيقة، مستوحى من التعريف «ويلتزم بها»"
    - lemma: "مُصَادِق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «صادق على»، بمعنى من يوافق رسمياً على وثيقة ويُقرّها"

stage2_evidence:
  per_lemma:
    - lemma: "مُوَقِّع"
      confirm:
        - text: "«الْمُوَقِّعُ: الخفيفُ الوطء. كاتبُ التوقيع»"
          source: "المعجم الوسيط"
        - text: "«(1) مُوَقِّع the signatory powers to a treaty (2) المُوَقِّع، أو أحد المُوَقِّعين، على وثيقة. وبخاصة: حكومة مشترِكة في التوقيع على معاهدة أو اتفاق.»"
          source: "المورد الحديث (2008)"
        - text: "«المُوَقِّع: مَنْ يُوَقِّع أو يُمْضي.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مِوّقع: أمين سر الدولة»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "إشارة إلى استعمال تاريخي للمُوَقِّع بمعنى كاتب الديوان"
        - text: "«المُوقِّع أَدْناه.»"
          source: "المورد الحديث (2008)"
          addition: "تعبير قانوني ثابت يدل على استعمال المُوَقِّع في السياق الرسمي"
    - lemma: "مُمْضٍ"
      confirm:
        - text: "«المُوَقِّع: مَنْ يُوَقِّع أو يُمْضي.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الإمضاء المُصَدِّق: إمضاء يَشْهد على صحة وثيقةٍ موقَّع عليها من شخص آخر»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد أن الإمضاء مرادف للتوقيع في السياق القانوني"
        - text: "«امضاء مصدق، توقيع مصدق» = counter signature"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "ورود إمضاء وتوقيع كمترادفَين في معجم مصطلحي"
    - lemma: "مُلْتَزِم"
      contradicts:
        - text: "«(المُلْتَزِم) من يتعهد بأَدَاء قدر من المَال لِقَاء استغلاله أَرضًا من أَرَاضِي الدولة (مو)»"
          source: "المعجم الوسيط"
          conflict: "المُلْتَزِم في المعجم الوسيط يعني صاحب الامتياز أو المُلتزِم الضريبي، لا المُوَقِّع على وثيقة"
        - text: "«ملتزِم» = obligor"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "في المصطلحية التجارية يعني المَدين أو المُتعهِّد، لا المُوَقِّع"
    - lemma: "مُصَادِق"
      contradicts:
        - text: "«مُصَادِق: من (ص د ق) المصاحب لغيره، والمخلص المودة والنصيحة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "مُصَادِق بمعنى الصديق والمصاحب، لا بمعنى المُوافِق على وثيقة. صادَقَ على (بمعنى وافق) يُنتج اسم فاعل مُصادِق لكنه يدل على المُوافَقة لا على التوقيع تحديداً"

stage3_analysis:
  per_lemma:
    - lemma: "مُوَقِّع"
      decision: confirmed
      decision_reason: "اللمّة الموجودة «موقع» صحيحة دلالياً لكنها تفتقر إلى التشكيل. الشكل الصحيح «مُوَقِّع» (اسم فاعل من وقَّعَ على وزن مُفَعِّل) مُوثَّق في المعجم الوسيط والمورد الحديث بمعنى كاتب التوقيع والموقِّع على وثيقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الأساسي والأشيع استعمالاً للدلالة على من يوقّع وثيقة، يُركّز على فعل التوقيع ذاته"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَقِّع"
    - lemma: "مُوَقِّع"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمّة الموجودة بعد تصحيح تشكيلها، لا حاجة لإضافته مرةً ثانية"
    - lemma: "مُمْضٍ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي فصيح مشتق من «أمضى» بمعنى وقَّع. ورد في المورد الحديث مرادفاً صريحاً للمُوَقِّع. وإن كان أقل شيوعاً في الاستعمال المعاصر فهو مرادف دقيق يُثري المجموعة ويُحيي استعمالاً تراثياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مرادف تراثي وأدبي للمُوَقِّع، مشتق من الإمضاء وهو الأقدم استعمالاً من التوقيع"
      actions:
        - command: create_entry
          params: {lemma: "مُمْضٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10616642-n"}
    - lemma: "مُلْتَزِم"
      source: stage1
      decision: removed
      decision_reason: "المُلْتَزِم في المعاجم يدل على صاحب الامتياز أو المُتعهِّد المالي (obligor)، لا على من يوقّع وثيقة. الدلالة مختلفة جوهرياً رغم وجود معنى الالتزام في التعريف."
    - lemma: "مُصَادِق"
      source: stage1
      decision: removed
      decision_reason: "مُصَادِق يدل على الصديق المصاحب في المعاجم التراثية. وإن أمكن استعمال «صادَقَ على» بمعنى وافق رسمياً، فالمُصَادِق لا يدل تحديداً على فعل التوقيع بل على الموافقة والإقرار، وهو مفهوم مختلف."

