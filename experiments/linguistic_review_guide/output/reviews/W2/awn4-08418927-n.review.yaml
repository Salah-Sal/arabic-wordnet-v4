    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُركز على امتلاك الأفراد لمعلومات داخلية وسرية غير متاحة للجمهور (insiders).","mwe":false}'
