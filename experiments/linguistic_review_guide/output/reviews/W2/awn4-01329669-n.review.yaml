step0_evidence:
  per_lemma:
    - lemma: "لاهوائي"
      confirm:
        - text: "«كل كائن مجهري يستطيع العيش بلا هواء»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«البكتريا التي تنمو بدون الهواء أوالأكسجين»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«قادرٌ على الحياة من غير حاجة إلى أكسجين. ذو علاقة بالمتعضّيات اللاهوائية»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«أجاز مجمع اللغة المصري دخول «أل» على حرف النفي «لا» المتصل بالاسم، مثل: اللامائي واللاهوائي واللاسلكي»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُتَعَضٍّ لاهوائي"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُتَعَضّي اللّاهوائيّ.» — المورد الحديث (2008)"
      justification: "تركيب وصفي يُخصص الكائن الحي (organism - متعض) بصفته لاهوائياً، وهو أدق بيولوجياً كاسم."
    - lemma: "لاحيوائي"
      source_section: "step5_english_bridge"
      evidence_citation: "«لاهَوَائِيّ؛لاحَيَوائِيّ» — المعجم الطبي الموحد (2009)"
      justification: "نحت مصطلحي (لا + حيوائي) مستعمل في المعاجم الطبية للدلالة على الكائنات التي تحيا بلا هواء."
  knowledge_candidates:
    - lemma: "كائن لاهوائي"
      justification: "تركيب وصفي شائع ومباشر، يعبر عن المفهوم من خلال إضافة الصفة (لاهوائي) للاسم الجامع (كائن)."
  generation_notes: "المصطلحات في هذا المجال تعتمد أساساً على سابقة النفي (لا) المضافة للصفة (هوائي / حيوائي)."

