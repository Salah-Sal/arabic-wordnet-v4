# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13435013-n
# anything of trivial value — أي شيء ذو قيمة تافهة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما تعبيران وصفيان (ثمن بخس، شيء تافه) وليستا مصطلحَيْن مفردَيْن مسكوكَيْن"
      - "«ثمن بخس» يركّز على الثمن (السعر) لا على الشيء ذاته، بينما المجموعة تعرّف الشيء لا ثمنه"
      - "«شيء تافه» عبارة وصفية حرة يمكن استبدال مكوّنيها (أمر تافه، شيء حقير) فلا تجتاز اختبار السكّ بصرامة"
    observations: >-
      المجموعة تحتاج إلى لفظ مفرد يدلّ على الشيء الحقير القيمة.
      في العربية ألفاظ كثيرة تدلّ على القلة والحقارة: نَزْر، تافه، هباء، قُلامة.
      المفهوم عربي أصيل ولا يحتاج اقتراضاً. الإشارة الإنجليزية "mess of pottage"
      تلوين توراتي (قصة عيسو)، ويقابلها قرآنياً "ثمن بخس" (يوسف:٢٠).

  blind_candidates:
    - lemma: "هَبَاءٌ"
      generation_method: majaz
      justification: >-
        الهباء: دقاق التراب الذي لا يُرى إلا في شعاع الشمس. استُعمل في القرآن مجازاً
        للتلاشي والعدم {فَكَانَتْ هَبَاءً مُنْبَثًّا}. إزاحة دلالية من الغبار المتلاشي
        إلى الشيء العديم القيمة.
    - lemma: "نَزْرٌ"
      generation_method: ishtiqaq
      justification: >-
        من الجذر ن ز ر الدال على القلة. المعجم الوسيط: «شيء نزر: قليل تافه».
        مقاييس اللغة: «أُصَيْلٌ يَدُلُّ عَلَى قِلَّةٍ فِي الشَّيْءِ». وزن فَعْل
        صالح للاسم والوصف.
    - lemma: "قُلَامَةٌ"
      generation_method: majaz
      justification: >-
        قُلامة الظفر مَثَلٌ عربي في القلة والحقارة. المعجم الوسيط: «لم يُغْنِ عنّي
        قُلامة ظُفُر». مجاز مرسل من الجزء الضئيل المقطوع إلى كل شيء تافه.
    - lemma: "حُطَامٌ"
      generation_method: majaz
      justification: >-
        الحُطام: ما تحطّم من كل شيء، ومتاع الدنيا الفاني. المعجم الوسيط:
        «من الدنيا: متاعها». إزاحة دلالية من الكِسَر المهملة إلى كل شيء تافه القيمة.


stage2_evidence:
  per_lemma:
    - lemma: "ثَمَنٌ بَخْسٌ"
      confirm:
        - text: "«البَخْسُ: الناقص. يقال: {شَرَوْهُ بِثَمَنٍ بَخْسٍ}. وقد بَخَسَهُ حقَّه يبخسه بخساً، إذا نقصه»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«الْبَاءُ وَالْخَاءُ وَالسِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ النَّقْصُ. قَالَ اللَّهُ تَعَالَى: {وَشَرَوْهُ بِثَمَنٍ بَخْسٍ} أَيْ: نَقْصٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«وَثمن بَخْس: دون مَا يجب، وَقَوله عز وَجل: (وشَرْوه بثَمن بَخْس)»"
          source: "المحكم والمحيط الأعظم لابن سيده"
        - text: "«بثمن بخس»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
      expands:
        - text: "«الثَّاءُ وَالْمِيمُ وَالنُّونُ أَصْلَانِ: أَحَدُهُمَا عِوَضُ مَا يُبَاعُ، وَالْآخَرُ جُزْءٌ مِنْ ثَمَانِيَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "تأصيل جذر ثمن ودلالته على العوض والقيمة المالية"

    - lemma: "شَيْءٌ تَافِهٌ"
      confirm:
        - text: "«التَّاءُ وَالْفَاءُ وَالْهَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ قِلَّةُ الشَّيْءِ. يُقَالُ تَفِهَ الشَّيْءُ فَهُوَ تَافِهٌ، إِذَا قَلَّ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«كَانَتِ الْيَدُ لَا تُقْطَعُ فِي الشَّيْءِ التَّافِهِ»"
          source: "مقاييس اللغة لابن فارس (حديث نبوي)"
      expands:
        - text: "«(1) شيء تافه. وبخاصة: مقدار ضئيل [من المال إلخ]»"
          source: "المورد الحديث (ترجمة trifle)"
          addition: "شيء تافه مستعمل في المعاجم ثنائية اللغة كوحدة ترجمية"
        - text: "«(1) شيء تافه (2) البغاتيلة: لعبة تشبه البليارد»"
          source: "المورد الحديث (ترجمة bagatelle)"
          addition: "يُستعمل لترجمة bagatelle أيضاً"

    - lemma: "هَبَاءٌ"
      confirm:
        - text: "«الْهَبَاءُ: دُقَاقُ التُّرَابِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«(الهباء) التُّرَاب الَّذِي تطيره الرّيح وَيلْزق بالأشياء أَو ينبث فِي الْهَوَاء فَلَا يَبْدُو إِلَّا فِي ضوء الشَّمْس»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية هي التراب الدقيق لا الشيء التافه القيمة. الاستعمال القرآني مجازي للفناء لا للحقارة"

    - lemma: "نَزْرٌ"
      confirm:
        - text: "«النَّزْرُ: القليلُ التافهُ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«النُّونُ وَالزَّاءُ وَالرَّاءُ أُصَيْلٌ يَدُلُّ عَلَى قِلَّةٍ فِي الشَّيْءِ. وَشَيْءٌ نَزْرٌ: قَلِيلٌ. وَعَطَاءٌ مَنْزُورٌ: مُقَلَّلٌ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(النزر) يُقَال شَيْء نزر قَلِيل تافه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«النَّزْرُ: القليلُ... والإِلْحاحُ في السُّؤالِ، والاحْتِثاثُ، والاسْتِعْجالُ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "نَزْر مشترك لفظي: له دلالات أخرى (الإلحاح، الاستعجال) إلى جانب القلة"

    - lemma: "قُلَامَةٌ"
      confirm:
        - text: "«قُلامة الظُّفُر: مَثَلٌ في القِلَّة والحقارة. يقال: لم يُغْنِ عنِّي قُلامة ظُفُر»"
          source: "المعجم الوسيط (المطبوع)"
      contradicts:
        - text: "«ما قطع من طرف الظُّفُر أو الحافر أو العود»"
          source: "المعجم الوسيط (المطبوع)"
          conflict: "الدلالة الأولية: القِطعة المقطوعة من الظفر، وليس الشيء التافه عموماً. الحقارة مجازية مثَلية لا حقيقية"

    - lemma: "حُطَامٌ"
      contradicts:
        - text: "«من كل شيء: ما تحطم منه. من النبات: ما يبس. من الدنيا: متاعها»"
          source: "المعجم الوسيط (المطبوع)"
          conflict: "حطام الدنيا يعني متاع الدنيا عموماً (قد يكون كثيراً) لا الشيء التافه خصوصاً. الجذر حطم يدل على الكسر لا على القلة"


stage3_analysis:
  per_lemma:
    - lemma: "ثَمَنٌ بَخْسٌ"
      decision: confirmed
      decision_reason: >-
        تعبير قرآني راسخ (يوسف:٢٠) مسجّل في المعاجم الكلاسيكية والمصطلحية.
        وثّقه الجوهري وابن سيده وابن فارس. مُسجَّل في المعجم الموحد للتجارة.
        يجتاز اختبار التثبيت المعجمي بوصفه تعبيراً اصطلاحياً ثابتاً لا عبارة حرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        يركّز على البُعد التجاري والمالي: الثمن الذي لا يساوي القيمة الحقيقية.
        يحمل ظلالاً من الظلم والبَخْس (النقص عمداً). مرجعيته قرآنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثَمَنٌ بَخْسٌ"

    - lemma: "شَيْءٌ تَافِهٌ"
      decision: confirmed
      decision_reason: >-
        عبارة وصفية واسعة الاستعمال، وُثّقت في المعاجم ثنائية اللغة كوحدة ترجمية
        لـ trifle و bagatelle. التوليفة «شيء + تافه» أصبحت عبارة شبه اصطلاحية
        بالتكرار والتداول، وإن لم تجتز اختبار السكّ بصرامة. يبقيها كونها
        تغطي المفهوم العام (أي شيء تافه) بخلاف «ثمن بخس» المقصور على المالي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        تعبير عام يشمل أي شيء ذي قيمة ضئيلة بلا تخصيص مالي أو تجاري.
        أوسع دلالةً من «ثمن بخس» ويغطي الأشياء المادية والمعنوية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَيْءٌ تَافِهٌ"

    - lemma: "هَبَاءٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        الدلالة المعجمية الأساسية «دقاق التراب»، والاستعمال القرآني مجاز للفناء
        والتلاشي لا للحقارة أو قلة القيمة. لا يوجد شاهد معجمي على استعماله
        بمعنى «شيء ذو قيمة تافهة».
      evidence_assessment:
        case: contradicts_only

    - lemma: "نَزْرٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        نَزْر صفة بالدرجة الأولى بمعنى «قليل»، لا اسم بمعنى «شيء تافه القيمة».
        المعاجم تستعمله وصفاً: «شيء نزر: قليل تافه»، «عطاء منزور».
        كما أنه مشترك لفظي (الإلحاح، الاستعجال). لا يصلح لمّةً اسمية لهذه المجموعة.
      evidence_assessment:
        case: mixed

    - lemma: "قُلَامَةٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        دلالتها الأولية «ما قُطع من الظفر»، واستعمالها للحقارة مثَليّ مقيّد
        بالتعبير الاصطلاحي «قُلامة ظُفُر». لا تُستعمل مفردةً بمعنى «شيء تافه»
        بل تحتاج إلى المضاف إليه (ظفر) لتؤدي المعنى المجازي.
      evidence_assessment:
        case: mixed

    - lemma: "حُطَامٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        حُطام يدل على ما تكسّر من الأشياء أو متاع الدنيا عموماً، وقد يكون
        كثيراً (حُطام الدنيا). الجذر حطم يدل على الكسر لا على القلة أو الحقارة.
        لا يناسب دلالة «شيء ذو قيمة تافهة».
      evidence_assessment:
        case: contradicts_only


