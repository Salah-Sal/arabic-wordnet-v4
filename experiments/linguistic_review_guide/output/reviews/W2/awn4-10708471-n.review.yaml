# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10708471-n (tagger)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «واسم» مستعملة في معاجم اللسانيات بمعنى «marker» (المؤشر المركبي) لا بمعنى «tagger» (مَن يُعيّن الوسوم)، فثمة خطر اشتراك لفظي"
      - "التعريف العربي ترجمة حرفية شبه آلية من الإنجليزية، ويحتاج إعادة صياغة بأسلوب معجمي عربي"
      - "المجموعة تحتوي لمّة واحدة فقط لمفهوم تقني حديث في اللسانيات الحاسوبية"
    observations: "المفهوم ينتمي إلى حقل اللسانيات الحاسوبية ومعالجة اللغات الطبيعية، ويدلّ على الشخص (أو البرنامج) الذي يُسنِد وُسوماً نحوية إلى مكونات النص. الجذر «و س م» غزير الاشتقاق في العربية، وقد استُعمل المصدر «وَسْم» حديثاً بمعنى labelling/tagging في عدة معاجم متخصصة. اسم الفاعل «واسِم» من الثلاثي المجرد صالح صرفياً للدلالة على الفاعل."

  blind_candidates:
    - lemma: "مُوَسِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من وَسَّمَ (الفعل الثلاثي المزيد بالتضعيف، باب التفعيل) بمعنى وضع الوُسوم والعلامات بكثرة وتعدٍّ، وهو أنسب من الثلاثي المجرد للدلالة على الفعل المتعدي المتكرر"
    - lemma: "وَسَّام"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من الجذر و-س-م، تدلّ على من يمارس الوسم بكثرة واحتراف"
    - lemma: "مُسَوِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من سَوَّمَ بمعنى وضع السِّيمَة (العلامة)، والسِّيمَة والسِّمَة من أصل واحد"
    - lemma: "رَاقِم"
      generation_method: majaz
      justification: "مجاز من رَقَمَ بمعنى كتب وخطّ ونقش، بإزاحة دلالية إلى وضع الرموز والعلامات على النص"


stage2_evidence:
  per_lemma:
    - lemma: "وَاسِم"
      confirm:
        - text: "«المؤشر المركبي، في النحو التوليدي، وهو تحليل البنية إلى مكونات، وتمثيل الجملة على شكل تشجير أو تقويسات.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«marker» (ترجمة إنجليزية)"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«1-مورث ذو موقع معروف على الصبغيّ ونمط ظاهريّ واضح بجلاء، يستعمل كنقطة مرجع لتخطيط طافرة جديدة. 2- دنا أو رنا أو بروتينات ذات أحجام مختلفة وصفات معروفة تستعمل للمعايرة في الوسط أثناء الرحلان الكهربائيّ.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
      contradicts:
        - text: "«المؤشر المركبي، في النحو التوليدي» — المعنى اللساني لـ«واسم» هو marker (عنصر نحوي) لا tagger (شخص يُسنِد الوسوم)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "واسم في اللسانيات يعني المؤشر النحوي (marker) وهو عنصر لغوي، بينما المجموعة الترادفية تدلّ على الشخص الذي يُعيّن الوسوم (tagger)"
      expands:
        - text: "«الشيءَ: كواه فأثَّر فيه بعلامة»"
          source: "المعجم الوسيط"
          addition: "الجذر و-س-م يدلّ على وضع العلامة والأثر، واسم الفاعل واسِم صالح لمن يضع العلامات"
        - text: "«عملية تعيين فئة الكلمة حسب خصائصها النحوية.» (وسم أقسام الكلام = Part-of-Speech Tagging)"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "المصدر وَسْم مستعمل حديثاً في حقل الذكاء الاصطناعي بمعنى tagging بالذات"

    - lemma: "مُوَسِّم"
      evidence_status: "no_material_found"

    - lemma: "وَسَّام"
      contradicts:
        - text: "«السمة وما يعلق على صدر من أحسن عملا مكافأةً له عليه»"
          source: "المعجم الوسيط"
          conflict: "وِسام/وَسَّام مستعملة بكثرة بمعنى الميدالية والنيشان، مما يُحدث اشتراكاً لفظياً شديداً"

    - lemma: "مُسَوِّم"
      contradicts:
        - text: "«مُسَوَّم — من (س و م) الشيء المعلم.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "مُسَوَّم (اسم مفعول) يعني المُعلَّم، لكن الجذر سوم دلالته الأصلية الرعي والإرسال والمساومة، لا الوَسْم"

    - lemma: "رَاقِم"
      contradicts:
        - text: "«رَاقِم — من (ر ق م) الكاتب والناقش ومطرز الشيء ومخططه وصاحب النقش.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "دلالة راقم أعمّ (الكاتب والناقش) ولا تخصّ التوسيم النحوي، فضلاً عن عدم استعمالها في المعاجم اللسانية"


stage3_analysis:
  per_lemma:
    - lemma: "وَاسِم"
      decision: confirmed
      decision_reason: "اسم فاعل قياسي من وَسَمَ يَسِمُ (فاعِل)، والجذر و-س-م مستعمل حديثاً في حقل الذكاء الاصطناعي واللسانيات الحاسوبية بمعنى tagging/labelling. رغم أن المعجم اللساني يستعمل «واسم» بمعنى marker (مؤشر نحوي)، فإن السياق الحاسوبي يميّز بوضوح بين المعنيين. اللفظة مشتقة اشتقاقاً صحيحاً وتتوافق مع المصدر «وَسْم» المُثبَت في معاجم الذكاء الاصطناعي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَاسِم"

    - lemma: "مُوَسِّم"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي سند معجمي لاسم الفاعل «مُوَسِّم» من الباب الثاني (وَسَّمَ). والأكثر شيوعاً هو «واسِم» من الثلاثي المجرد. كما أن «مَوْسِم» (اسم المكان/الزمان) من نفس الجذر يُحدث التباساً صوتياً."
      evidence_assessment:
        case: no_material

    - lemma: "وَسَّام"
      source: stage1
      decision: removed
      decision_reason: "صيغة فَعَّال مشغولة دلالياً بمعنى الوِسام (الميدالية/النيشان) في الاستعمال المعاصر، ولا مسوّغ لإدخال اشتراك لفظي مع مصطلح عسكري/مدني شائع."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُسَوِّم"
      source: stage1
      decision: removed
      decision_reason: "الجذر س-و-م دلالته الأصلية الرعي والإرسال والمساومة، وليس من جذر و-س-م. الخلط بين السِّمة والسَّوْم خلط اشتقاقي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَاقِم"
      source: stage1
      decision: removed
      decision_reason: "دلالة «راقم» (الكاتب، الناقش) أعمّ بكثير من المطلوب ولا تختصّ بالتوسيم النحوي. لم يُستعمل في أي معجم لساني أو حاسوبي بمعنى tagger."
      evidence_assessment:
        case: contradicts_only


