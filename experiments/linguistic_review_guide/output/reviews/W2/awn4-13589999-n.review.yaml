stage1_review:
  assessment:
    concerns:
      - "اللمة (تحويل) غير دقيقة علمياً في هذا السياق؛ فهي تقابل مفهوم (transformation) وتدل على التبديل أو التغيير، في حين أن مصطلح (transduction) يقابله في المعاجم العلمية المتخصصة (تنبيغ)."
      - "اللمة (نقل جيني) مقبولة كوصف عام ولكنها تفتقر إلى التخصيص الدقيق للعملية التي تتوسطها العاثيات."
    observations: "المفهوم علمي دقيق في علم الوراثة يشير إلى النقل الفيروسي للمادة الوراثية من خلية لأخرى. المصطلح المعتمد والمستقر في معاجم علم الوراثة هو (تنبيغ)."
  blind_candidates:
    - lemma: "تَنْبِيغ"
      generation_method: majaz
      justification: "مصطلح علمي مستقر، من الجذر (نبغ) الدال على الظهور والخروج، استعير للدلالة على خروج وانتقال المادة الوراثية عبر العاثيات."
    - lemma: "نَقْل جِينِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر بشكل مباشر عن نقل الجينات، وهو مستخدم في السياقات العلمية العامة."
    - lemma: "نَقْل وِرَاثِيّ"
      generation_method: tarkib
      justification: "مركب وصفي شائع للدلالة على انتقال المادة الوراثية ككل."
    - lemma: "عُبُور جِينِيّ"
      generation_method: tarkib
      justification: "مركب يعبر عن عبور وانتقال الجينات بين الخلايا."

stage2_evidence:
  per_lemma:
    - lemma: "تَنْبِيغ"
      confirm:
        - text: "«نقل مورثات من خلية بكتيرية إلى أخرى بواسطة ناقل مثل الفيروسات.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة"
        - text: "«التنبيغ؛ النقلُ بالوِساطة (أح).»"
          source: "المورد الحديث"
    - lemma: "تحويل"
      contradicts:
        - text: "«تَبْديلُ ذاتٍ إلى ذاتٍ أخرى, مثل : تحويلُ التُّرابِ إلى الطِّينِ»"
          source: "المعجم الكبير"
          conflict: "الكلمة تعني التبديل الكلي (transformation) ولا تخص آلية النقل الجيني الوسيطي."
    - lemma: "نقل جيني"
      evidence_status: "no_material_found"
    - lemma: "نقل وراثي"
      evidence_status: "no_material_found"
    - lemma: "عبور جيني"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تحويل"
      decision: removed
      decision_reason: "مصطلح غير دقيق في هذا السياق؛ فهو يقابل (transformation) وليس (transduction)، ويعني التبديل والتغيير وليس النقل عبر وسيط."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params: {sense_id: "{auto}"}

    - lemma: "نقل جيني"
      decision: confirmed
      decision_reason: "تعبير وصفي عام ومقبول للنقل الوراثي، يصح إدراجه كمرادف أعم في الشبكة الدلالية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params: {entry_id: "{auto}", new_lemma: "نَقْل جِينِيّ"}

    - lemma: "تَنْبِيغ"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح العلمي الدقيق والمستقر المقابل لـ transduction في معاجم علم الوراثة والطب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَنْبِيغ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "(علم الوراثة) عملية نقل المادة الوراثية من خلية إلى أخرى بواسطة بلازميد أو عاثية"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق علمياً ومطابق للمفهوم الإنجليزي ويغطي الآلية المطلوبة بوضوح تام."
  examples:
    per_lemma:
      - lemma: "تَنْبِيغ"
        examples:
          - text: "يُعد التَّنْبِيغ من أهم آليات نقل الجينات بين البكتيريا وتطوير مقاومتها للمضادات الحيوية."
            type: usage
      - lemma: "نقل جيني"
        examples:
          - text: "درس الباحثون آليات النَّقْل الجِينِيّ لفهم كيفية تطور السلالات الميكروبية."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعد التَّنْبِيغ من أهم آليات نقل الجينات بين البكتيريا وتطوير مقاومتها للمضادات الحيوية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "درس الباحثون آليات النَّقْل الجِينِيّ لفهم كيفية تطور السلالات الميكروبية."}

stage5_enrichment:
  per_entry:
    - lemma: "تَنْبِيغ"
      entry_id: "{auto}"
      root: "نبغ"
      maqayis_quote: "«النُّونُ وَالْبَاءُ وَالْغَيْنُ كَلِمَةٌ تَدُلُّ عَلَى بُرُوزٍ وَظُهُورٍ.»"
    - lemma: "نَقْل جِينِيّ"
      entry_id: "{auto}"
      roots:
        - word: "نقل"
          root: "نقل"
          maqayis_quote: "«النُّونُ وَالْقَافُ وَاللَّامُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَحْوِيلِ شَيْءٍ مِنْ مَكَانٍ إِلَى مَكَانٍ.»"
        - word: "جيني"
          root: "جين"
          maqayis_quote: "لا يوجد (مصطلح علمي معرّب)."
  per_sense:
    - lemma: "تَنْبِيغ"
      sense_id: "{auto}"
      nuance: "مصطلح علمي متخصص ومحدد لنقل المادة الوراثية بواسطة فيروس (عاثية)."
      mwe: false
    - lemma: "نقل جيني"
      sense_id: "{auto}"
      nuance: "مصطلح وصفي عام يشمل أشكال النقل الأفقي للجينات ولا يقتصر على العاثيات."
      mwe: true
  synset:
