        value: '{"root":"نبغ","maqayis":"«النُّونُ وَالْبَاءُ وَالْغَيْنُ كَلِمَةٌ تَدُلُّ عَلَى بُرُوزٍ وَظُهُورٍ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"نقل","root":"نقل","maqayis":"«النُّونُ وَالْقَافُ وَاللَّامُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَحْوِيلِ شَيْءٍ مِنْ مَكَانٍ إِلَى مَكَانٍ.»"},{"word":"جيني","root":"جين","maqayis":"لا يوجد"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح علمي متخصص ومحدد لنقل المادة الوراثية بواسطة فيروس (عاثية).","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
