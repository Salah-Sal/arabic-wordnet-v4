stage1_review:
  assessment:
    concerns:
      - "اللمة «عرض» واسعة جداً دلالياً، وتحتاج إلى تخصيص السياق لتعني 'مجموعة للعرض'."
      - "اللمة «معرض» هي الأكثر دقة للمكان والحدث، ولكن المجموعة الترادفية تركز على 'المجموعة' (collection)."
    observations: "المجموعة تدور حول المفهوم العام للعرض العام (Exhibition) سواء كان الحدث أو المكان أو المجموعة المعروضة. المصطلحات العربية تغطي هذه الجوانب بوضوح."
  blind_candidates:
    - lemma: "مَعْرِض"
      generation_method: ishtiqaq
      justification: "اسم مكان وموعد من الفعل 'عرض' وهو المصطلح القياسي للفعالية والمنصة التي تُعرض فيها الأشياء."
    - lemma: "عَرْض"
      generation_method: ishtiqaq
      justification: "مصدر استعمل اسماً للدلالة على المشهد أو المجموعة المعروضة."
    - lemma: "مُقْتَنَيَات"
      generation_method: ishtiqaq
      justification: "جمع 'مقتنى'، ويُستخدم في السياق الفني والمتحفي للدلالة على مجموعة الأشياء الثمينة المعروضة للجمهور."
    - lemma: "إكْسْبُو"
      generation_method: taarib
      justification: "تعريب للمصطلح العالمي (Expo) المستخدم للمعرض العالمي الشامل، وهو شائع جداً في الاستعمال الحديث."

stage2_evidence:
  per_lemma:
    - lemma: "عَرْض"
      confirm:
        - text: "«العَرْضُ: أداء... عَرْضٌ مسرحيٌّ/ تليفزيونيّ... العَرْضُ والطَّلَبُ: ما يُعْرَض من بضائع للبيع.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مَعْرِض"
      confirm:
        - text: "«مَعْرِض: مكان عام تعرض فيه نماذج من المنتجات الفنية أو الزراعية أو الصناعية.»"
          source: "المعجم الوسيط"
        - text: "«مَعْرِض: مكان عامّ تُعرَضُ فيه نماذجُ من المنتجات العلميَّة، أو الفنيَّة، أو الصَّناعيّة... إلخ.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مُقْتَنَيَات"
      confirm:
        - text: "«مُقْتَنَيات: ما يحتفظ به من الأشياء القَيِّمة أو الثمينة... للدلالة على ما يتم الحصول عليه من تحف أو أعمال فنية أو أشياء ثمينة.»"
          source: "معجم الصواب اللغوي"
    - lemma: "إكْسْبُو"
      evidence_status: "no_material_found"

