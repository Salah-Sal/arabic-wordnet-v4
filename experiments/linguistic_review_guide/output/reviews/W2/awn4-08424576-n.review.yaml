stage4_content:
  definition:
    current: "مجموعة من الأشياء (بضائع أو أعمال فنية وغيرها) للعرض العام"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أدق يربط بين الأشياء وطريقة عرضها."
    authored:
      - type: terminological
        text: "مجموعةٌ من السلعِ أو الآثارِ أو الفنونِ تُنَسَّقُ وتُبْرَزُ للجمهورِ في مَكانٍ مُعَيَّنٍ وبِقَصْدِ العَرْضِ العامِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "مَعْرِض"
        examples:
          - text: "يُقامُ مَعْرِضُ الكتابِ الدوليُّ سَنويّاً في العاصمةِ."
            type: usage
      - lemma: "عَرْض"
        examples:
          - text: "شَارَكَ الفَنَّانُ في عَرْضٍ مُشتركٍ للوحاتِهِ الزَّيتيةِ."
            type: usage
      - lemma: "مُقْتَنَيَات"
        examples:
          - text: "تَمَّ تَرْميمُ مُقْتَنَيَاتِ المتحفِ الوطنيِّ قَبْلَ العَرْضِ العامِّ."
            type: usage
      - lemma: "إكْسْبُو"
        examples:
          - text: "تَتَنافسُ الدُّولُ على اسْتِضافةِ إكْسْبُو العالميِّ لِما لَهُ من أهميةٍ اقتصاديةٍ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-08424576-n", definition_index: 0, text: "مجموعةٌ من السلعِ أو الآثارِ أو الفنونِ تُنَسَّقُ وتُبْرَزُ للجمهورِ في مَكانٍ مُعَيَّنٍ وبِقَصْدِ العَرْضِ العامِّ."}

