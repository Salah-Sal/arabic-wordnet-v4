stage2_evidence:
  per_lemma:

    - lemma: "مَوْت"
      confirm:
        - text: "«الْمَوْتُ: ضِدُّ الحياة»"
          source: "المعجم الوسيط (إصدار OCR)"
        - text: "«(الْمَوْت) ضد الْحَيَاة وَيُطلق الْمَوْت وَيُرَاد بِهِ مَا يُقَابل الْعقل وَالْإِيمَان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الموت: [في الإنكليزية] Death... هو عدم الحياة عمّا من شأنه أن يكون حيا؛ والأظهر أن يقال عدم الحياة عما اتصف بها، وعلى التفسيرين فالتقابل بين الموت والحياة تقابل العدم والملكة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الْمَوْت: صفة وجودية كما يدل عليه قوله تعالى: {خلق الموت والحياة} وهو ضد الحياة. وقيل صفة عدمية وهي عدم الحياة عما من شأنه أن يكون حياً»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الموت: حال خفاء وغيب يضاف إلى ظاهر عالم يتأخر عنه أو يتقدمه، تفقد فيه خواص ذلك الظهور الظاهرة. وقال الراغب: الموت صفة وجودية خلقت ضد الحياة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(مَوَتَ) الميم والواو والتاء أصل صحيح يدل على ذهاب القوة من الشيء. منه الموت: خلاف الحياة»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "﴿وَيَأْتِيهِ الْمَوْتُ مِنْ كُلِّ مَكَانٍ وَمَا هُوَ بِمَيِّتٍ﴾"
          source: "المعجم الوسيط (شاهد قرآني)"
          addition: "يُثبت أن الموت حالة مستمرة لا لحظة عابرة في الاستعمال القرآني"

    - lemma: "وَفَاة"
      confirm:
        - text: "«الوَفَاةُ: الموتُ»"
          source: "المعجم الوسيط (إصدار OCR)"
        - text: "«(الْوَفَاة) الْمَوْت (ج) وفيات»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الوفاة: استخلاص الحق من حيث وضع أن الله نفخ الروح وأودع به النفس ليستوفيها بعد أجل... وقال أبو البقاء: الوفاة الموت، وأصله توفية الشيء إذا أخذته كله»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(وَفَى) الواو والفاء والحرف المعتل: كلمة تدل على إكمال وإتمام... وتوفيت الشيء واستوفيته إذا أخذته كله»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«وفاة، موت» ← death"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "تأكيد المصطلحين معاً في السياق القانوني الرسمي كمقابلَيْن للإنجليزية death"

    - lemma: "المَنِيَّة"
      confirm:
        - text: "«المنية: الأجل المقدر للحيوان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«المنية: ما أدركه الموت من الحيوان عن ذبول القوة وفناء الحياة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الْمنية) الْمَوْت (ج) منايا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«المَنِيَّة: الموتُ»"
          source: "المعجم الوسيط (إصدار OCR)"
        - text: "«(مَنِيَ) الميم والنون والحرف المعتل أصل واحد صحيح يدل على تقدير شيء ونفاذ القضاء به. منه قولهم: مَنَى له المانِي أي قدَّر المقدِّر»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "الفَنَاء"
      contradicts:
        - text: "«الفناء: سقوط الأوصاف المذمومة، كما أن البقاء وجود الأوصاف المحمودة»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الفناء هنا مصطلح صوفي يعني تزكية النفس لا الموت"
        - text: "«الفناء [في الإنكليزية] Courtyard... بالكسر وبالنون ومد الألف گرداكردخانه حوالي البيت»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الفناء بالكسر يعني فناء الدار (ساحة) لا الموت"
        - text: "«الفناء [في الإنكليزية] Annihilation, mystical fusion... عند الصوفية عدم شعور الشخص بنفسه ولا بشيء من لوازم نفسه»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المعنى صوفي وجودي يختلف جوهرياً عن الموت بوصفه حالة غياب الحياة"
        - text: "«(فَنَيَ) الفاء والنون والحرف المعتل. هذا باب لا تنقاس كلمه... فَنِيَ يَفْنَى فَنَاءً إذا انقطع»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "دلالة الجذر على الانقطاع العام لا على الموت تحديداً، وابن فارس يصفه بأنه لا يقاس"

    - lemma: "الحِمَام"
      evidence_status: "no_material_found"
      # جميع مداخل الحمام في قاعدة البيانات تشير إلى:
      # 1. الحَمَّام (بيت الاستحمام)
      # 2. الحَمَام (الطائر)
      # 3. الحُمَام (الحمى/ارتفاع الحرارة) في المعاجم الطبية
      # لم يُوجد مدخل مستقل يُوثّق الحِمَام (بكسر الحاء) بمعنى الموت في قاعدة البيانات

    - lemma: "الرَّدَى"
      evidence_status: "no_material_found"
      # لم يُوجد مدخل للردى أو الردى في قاعدة البيانات بمعنى الموت.
      # مقاييس اللغة يُرجع الجذر (ر د ي) إلى معنى الرمي والتراخي لا الموت مباشرة.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: موت ──
    - lemma: "مَوْت"
      decision: confirmed
      decision_reason: >
        اللفظ الأصيل والأعمّ في الدلالة على ضدّ الحياة في العربية كلها، موثَّق توثيقاً
        قاطعاً في جميع طبقات المعجمية العربية من الكلاسيكية إلى المعاصرة. يُجيز الصياغة
        في جميع السياقات العلمية والدينية والأدبية والعامية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللفظ الأصيل الجذريّ لمفهوم انقضاء الحياة؛ محايدٌ أسلوبياً ويصلح في جميع
        السياقات. يشمل الموت المادي والمجازي (موت القلب، موت الضمير). وهو الجنس الذي
        تُعرَّف به بقية اللمّات.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْت"

    # ── لمّة موجودة: وفاة ──
    - lemma: "وَفَاة"
      decision: confirmed
      decision_reason: >
        لفظ راسخ في العربية الفصيحة والمعجمية والقانونية الرسمية، موثَّق بصورة واسعة
        بمعنى الموت الطبيعي للإنسان. اشتقاقه من الوفاء يمنحه ملمحاً دلالياً خاصاً
        يميّزه عن موت.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختص دلالياً بالموت الطبيعي للإنسان ويحمل ملمح الرسمية والتوقير؛ لذلك يُفضَّل
        في السياقات الرسمية والقانونية والإعلامية (شهادة الوفاة، سجلات الوفيات)، ولا
        يُستخدم للموت المجازي. أصله اللغوي (استيفاء الأجل كاملاً) يميّزه بُعداً
        إيمانياً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَفَاة"

    # ── مرشح المرحلة ١: المنية ──
    - lemma: "المَنِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّقة توثيقاً قاطعاً في المعجم الوسيط (المنية: الموت) وفي التوقيف للمناوي
        بتعريفين دقيقين. الجذر مني يحمل معنى التقدير ونفاذ القضاء بما يمنح اللفظة
        ملمحاً دلالياً مستقلاً. شائعة في الشعر الكلاسيكي والنثر الديني. تجتاز اختبار
        السكّ (لا يمكن إبدال مكوّناتها إذ هي كلمة مفردة)، وتجتاز اختبار التثبيت
        المعجمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصطلح أسلوبي شعري-تراثي يحمل دلالة القدر والتقدير الإلهي؛ يُشير إلى الموت
        بوصفه أجلاً مكتوباً لا مجرد حالة بيولوجية. يُستعمل أساساً في الشعر الكلاسيكي
        والتعبير المجازي الرفيع، ونادراً في النثر العلمي.
      actions:
        - command: create_entry
          params:
            lemma: "مَنِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13985834-n"

    # ── مرشح المرحلة ١: الفناء ── (مرفوض)
    - lemma: "الفَنَاء"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الفناء يعني الانقطاع وعدم الاستمرار، فإن مداخله المعجمية تكشف عن ثلاثة
        معانٍ رئيسية متداولة تتعارض مع الاستخدام بمعنى "الموت": (١) الفناء الصوفي
        (عدم شعور الشخص بنفسه)، (٢) فناء الدار (الساحة أمام البيت)، (٣) الانقطاع
        الفلسفي العام. الاشتراك اللفظي الثقيل يجعله غير صالح لهذه المجموعة.
      evidence_assessment:
        case: contradicts_only

    # ── مرشح المرحلة ١: الحمام ── (مرفوض)
    - lemma: "الحِمَام"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد في قاعدة البيانات مداخل معجمية تُوثّق الحِمَام (بكسر الحاء) بوصفه
        مصطلحاً للموت. جميع المداخل تشير إلى الحَمَّام (الاستحمام) أو الحَمَام (الطائر)
        أو الحُمَام (الحُمَّى)، مما يُنشئ خطر التباس شديداً مع المتلقي المعاصر.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: الردى ── (مرفوض)
    - lemma: "الرَّدَى"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر (ر د ي) يدل وفق مقاييس اللغة على معنى الرمي والتراخي لا على الموت
        بوصفه حالة غياب الحياة. لم يُوجد مدخل مستقل للردى بمعنى الموت في قاعدة
        البيانات. هو أقرب إلى الهلاك (destruction/ruin) منه إلى الموت (death as state).
      evidence_assessment:
        case: no_material


