# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان الموجودتان (موت، وفاة) خاليتان من التشكيل الكامل"
      - "التعريف العربي الحالي ترجمةٌ حرفية للتعريف الإنجليزي، وليس بأسلوب المعجم الوسيط"
      - "غياب لمّات تراثية بارزة كالمَنِيَّة والحَتْف عن القائمة الحالية"
    observations: >
      المجموعة تُعنى بالمفهوم الفلسفي-اللغوي للموت بوصفه حالةً لا فعلاً. اللمّة موت هي
      اللفظ الأصيل في العربية الدالّ على ضدّ الحياة، وقد تعددت أنواعه وتشعّبت دلالاته في
      التراث؛ إذ يُطلق مجازاً على ما يُضعف الطبيعة كالخوف والفقر. أما وفاة فتختص غالباً
      بالموت الطبيعي للإنسان وتحمل ملمحاً رسمياً وتوقيرياً. والمرشّحات التراثية الأخرى
      (المنية، الحتف) غائبة عن القائمة رغم حضورها الكثيف في المعاجم الكلاسيكية.

  blind_candidates:
    - lemma: "المَنِيَّة"
      generation_method: majaz
      justification: >
        إحياء لفظ عربي كلاسيكي من جذر (م ن ي) بمعنى القَدَر والتقدير الإلهي؛ أُضيف
        إليه بالإزاحة الدلالية معنى الموت المقدَّر. يُقال: أدركَتْه المنيّة. يتجنب
        الاشتراك مع الفعل الحيّ ويُثري القائمة بُعداً أسلوبياً شعرياً.
    - lemma: "الفَنَاء"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (ف ن ي) على وزن فَعَال، يدل على انقطاع الوجود وانعدامه، وهو ضد
        البقاء. يمكن تحليله بوصفه الحالة الناتجة عن الموت، أي غياب الحياة غياباً تاماً.
    - lemma: "الحِمَام"
      generation_method: majaz
      justification: >
        لفظ عربي قديم من جذر (ح م م) بمعنى الحتمية والقدر المحتوم؛ إحياء دلالته
        التراثية بوصفه مرادفاً للموت. شائع في الشعر العربي القديم، ويميزه عن موت حمل
        الفتحة على الحاء أو الكسرة (الحِمَام).
    - lemma: "الرَّدَى"
      generation_method: majaz
      justification: >
        من جذر (ر د ي) بمعنى الهلاك والسقوط. يُستعمل في الشعر الكلاسيكي مرادفاً
        للموت، ولا سيما في سياق الحرب والبطولة. إزاحة دلالية من معنى الرمي/السقوط
        إلى معنى الفناء والهلاك.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
