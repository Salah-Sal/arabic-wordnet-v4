    - lemma: "مَوْثُوقِيَّة"
      entry_id: "{auto}"
      root: "وثق"
      maqayis_quote: "«الْوَاوُ وَالثَّاءُ وَالْقَافُ كَلِمَةٌ تَدُلُّ عَلَى عَقْدٍ وَإِحْكَامٍ.»"
    - lemma: "مِصْدَاقِيَّة"
      entry_id: "{auto}"
      root: "صدق"
      maqayis_quote: "«الصَّادُ وَالدَّالُ وَالْقَافُ أَصْلٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ قَوْلًا وَغَيْرَهُ.»"
    - lemma: "مُعْتَمَدِيَّة"
      entry_id: "{auto}"
      root: "عمد"
      maqayis_quote: "«الْعَيْنُ وَالْمِيمُ وَالدَّالُ أَصْلٌ كَبِيرٌ، فُرُوعُهُ كَثِيرَةٌ تَرْجِعُ إِلَى مَعْنًى، وَهُوَ الِاسْتِقَامَةُ فِي الشَّيْءِ، مُنْتَصِبًا أَوْ مُمْتَدًّا، وَكَذَلِكَ فِي الرَّأْيِ وَإِرَادَةِ الشَّيْءِ.»"
    - lemma: "ثِقَة"
      entry_id: "{auto}"
      root: "وثق"
      maqayis_quote: "«الْوَاوُ وَالثَّاءُ وَالْقَافُ كَلِمَةٌ تَدُلُّ عَلَى عَقْدٍ وَإِحْكَامٍ.»"
    - lemma: "جَدَارَة بِالثِّقَة"
