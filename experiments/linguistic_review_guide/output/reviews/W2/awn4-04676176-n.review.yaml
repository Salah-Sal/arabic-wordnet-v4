          root: "جدر"
          maqayis_quote: "«الْجِيمُ وَالدَّالُ وَالرَّاءُ أَصْلَانِ، فَالْأَوَّلُ الْجِدَارُ... وَالْأَصْلُ الثَّانِي ظُهُورُ الشَّيْءِ»"
        - word: "ثقة"
          root: "وثق"
          maqayis_quote: "«الْوَاوُ وَالثَّاءُ وَالْقَافُ كَلِمَةٌ تَدُلُّ عَلَى عَقْدٍ وَإِحْكَامٍ.»"
  per_sense:
