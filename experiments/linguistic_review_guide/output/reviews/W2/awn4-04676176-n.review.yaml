stage4_content:
  definition:
    current: "سمة استحقاق الثقة والاعتماد"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويغطي المعنى المقصود بالكامل."
  examples:
    per_lemma:
      - lemma: "أَمَانَة"
        examples:
          - text: "عُرف الرجل بين قومه بالأمانة فجعلوه مسؤولاً عن أموالهم."
            type: usage
      - lemma: "جَدَارَة بِالثِّقَة"
        examples:
          - text: "أثبتت الشركة جدارتها بالثقة من خلال التزامها بمواعيد التسليم."
            type: usage
      - lemma: "مَوْثُوقِيَّة"
        examples:
          - text: "تتميز هذه المصادر بموثوقية عالية في نقل الأخبار."
            type: usage
      - lemma: "مِصْدَاقِيَّة"
        examples:
          - text: "فقدت الصحيفة مصداقيتها بعد نشرها أخباراً كاذبة."
            type: usage
      - lemma: "مُعْتَمَدِيَّة"
        examples:
          - text: "تُقاس معتمدية النظام الآلي بقدرته على العمل دون أعطال."
            type: usage
      - lemma: "ثِقَة"
        examples:
          - text: "هذا المصدر ثقة لا يُشك في معلوماته."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "عُرف الرجل بين قومه بالأمانة فجعلوه مسؤولاً عن أموالهم."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أثبتت الشركة جدارتها بالثقة من خلال التزامها بمواعيد التسليم."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تتميز هذه المصادر بموثوقية عالية في نقل الأخبار."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "فقدت الصحيفة مصداقيتها بعد نشرها أخباراً كاذبة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُقاس معتمدية النظام الآلي بقدرته على العمل دون أعطال."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "هذا المصدر ثقة لا يُشك في معلوماته."}

stage5_enrichment:
