stage1_review:
  assessment:
    concerns: []
    observations: "المفهوم يعبر عن الجدارة بنيل الثقة. المصطلحان 'أمانة' و'جدارة بالثقة' صحيحان. يمكن إثراء المجموعة بمصطلحات معاصرة مثل 'موثوقية' و'معتمدية' و'مصداقية'."
  blind_candidates:
    - lemma: "مَوْثُوقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من مفعول يعبر عن قابلية نيل الثقة."
    - lemma: "مِصْدَاقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر يعبر عن الصدق المؤدي إلى الثقة."
    - lemma: "مُعْتَمَدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي يعبر عن القابلية للاعتماد عليه."
    - lemma: "ثِقَة"
      generation_method: majaz
      justification: "استخدام المصدر وإطلاقه على الشخص أو الصفة مجازاً للمبالغة."

stage2_evidence:
  per_lemma:
    - lemma: "أمانة"
      confirm:
        - text: "«الثَّقَةُ . التكاليف والحقوق المرعية التى أَوْدعها الله المكلفين , واأتَمَنَهم عليها»"
          source: "المعجم الكبير"
    - lemma: "جدارة بالثقة"
      confirm:
        - text: "«المُعْتَمَديّة: كونُ الشيء جديرًا بالثقة والاعتماد.»"
          source: "Al-Mawrid Al-Hadeeth"
    - lemma: "موثوقية"
      confirm:
        - text: "«الموثوقية: كون الشيء أو الشخص موثوقًا أو موضع ثقة.»"
          source: "Al-Mawrid Al-Hadeeth"
    - lemma: "مصداقية"
      confirm:
        - text: "«مُطابَقَةُ الكلام للواقع الدَّليلُ على صِدْقِ الأمر ثِقَةُ المُتلقِّى فى صِدْقِ ما تُقدِّمُهُ وسائلُ الإعلام»"
          source: "المعجم الكبير"
    - lemma: "معتمدية"
      confirm:
        - text: "«المُعْتَمَديّة: كونُ الشيء جديرًا بالثقة والاعتماد.»"
          source: "Al-Mawrid Al-Hadeeth"
    - lemma: "ثقة"
      confirm:
        - text: "«مصدر؛ وقد يُوصف به، يستوي فيه المفرد والمثنى والجمع بنوعيهما، فيقال: هو وهى وهما وهم وهن ثِقَةٌ»"
          source: "المعجم الوسيط"

