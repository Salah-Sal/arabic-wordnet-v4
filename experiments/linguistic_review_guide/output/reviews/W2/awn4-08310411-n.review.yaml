          root: "قفل"
          maqayis_quote: "«الْقَافُ وَالْفَاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى رُجُوعٍ وَعَلَى يُبْسٍ فِي الشَّيْءِ. مِنْ ذَلِكَ الْقُفُولُ: الرُّجُوعُ مِنَ السَّفَرِ.»"
        - word: "سيارات"
          root: "سير"
          maqayis_quote: "«السِّينُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ على مُضِيٍّ وجَرَيان.»"
