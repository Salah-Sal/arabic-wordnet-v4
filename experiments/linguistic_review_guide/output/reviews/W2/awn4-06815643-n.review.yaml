# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-06815643-n | ILI: i72237
# POS: n | Definition: إشارة طفيفة | a slight indication
# Lemmas: تلميح، دليل
# Reviewed: 2026-03-19
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. المرشحات المولّدة عمياء (من الملف المقنّع فقط — قبل الاطلاع على اللمّات)
  # التعريف المرئي: "إشارة طفيفة" / "a slight indication"
  # الجنس المباشر: "شيء يخدم للدلالة أو الإيحاء"
  blind_candidates:
    - lemma: "إيمَاء"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل "أوْمَأَ يُومِئُ" على وزن إفعال. الجذر (ومأ)، وأصله
        الإشارة باليد أو الرأس. اللفظ مسكوك في المعجم العربي القديم،
        ويتناسب وظيفياً مع "إشارة طفيفة" لأن الإيماء في أصله إشارة خفيفة
        غير صريحة.

    - lemma: "أَثَارَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (أثر) على وزن فَعَالة. تعني البقية أو الأثر اليسير من الشيء.
        وردت في قوله تعالى: {أو أثارة من علم}. يمكن أن تُشير إلى القدر اليسير
        من الدلالة، أي "إشارة طفيفة" بمعنى أثر دال خفيف.

    - lemma: "إيحَاء"
      generation_method: ishtiqaq
      justification: >
        مصدر "أوْحَى يُوحي" على وزن إفعال، من جذر (وحي). معناه إلقاء المعنى
        في النفس بخفاء وسرعة، وهو يشترك مع "إشارة طفيفة" في صفة الخفاء
        والعدم صريح.

    - lemma: "وَمِيض"
      generation_method: majaz
      justification: >
        من جذر (ومض) على وزن فَعِيل. أصله لمعة البرق الخاطفة. يُستعار
        بالمجاز لكل إشارة عابرة سريعة كلمحة الدليل الخفيف، كما يُقال
        "وميض الفكرة" في الاستعمال الحديث.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        "دليل" معناه الراسخ في التراث العربي أقوى من "إشارة طفيفة": فهو
        المرشد وما يستدل به للوصول إلى يقين، لا مجرد إيحاء خفيف. الربط
        بهذه المجموعة يُوسِّع دلالته توسيعاً غير مقنَّن.
      - >
        اللمّتان بدون تشكيل كامل مما يُعيق التحقق الصرفي.
      - >
        غياب لمّات وثيقة الصلة من العربية كـ"إيماء" التي تدل أصلاً على
        الإشارة الخفيفة.
    observations: >
      تمثّل هذه المجموعة مفهومَ "التلميح الخفيف" أو "الإشارة غير المباشرة"
      (hint/clue)، وهو مفهوم حيٌّ في العربية له تعبيرات راسخة متعددة.
      "تلميح" الأوفق من حيث الشيوع والدقة لمعنى hint، فهو يدل على الإشارة
      في فحوى الكلام من غير تصريح. أما "دليل" فأقرب إلى clue بمعنى
      الأثر المادي الدال، وهو مناسب في السياق الاستدلالي (كدليل الجريمة)
      لكنه أعم من الإشارة الطفيفة. التعريف العربي "إشارة طفيفة" موجز يحتاج
      إثراء بالجنس القريب والفصل النوعي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة (٧ استعلامات):
#   ١. Batch headword lookup: تلميح/التلميح/دليل/الدليل/ايماء/الايماء/
#      اثارة/الاثارة/ايحاء/الايحاء/وميض/الوميض
#   ٢. Definitions by entry_id للمداخل الأساسية
#   ٣. English bridge: hint/clue/indication/insinuation/innuendo
#   ٤. Arabic FTS: اشارة طفيفة / اشارة خفية / الماع / تلميح / غمز / تعريض
#   ٥. Maqayis lookup: لمح/دلل/ومأ/وحي/عرض/غمز/لمع/اثر
stage2_evidence:
  per_lemma:

    - lemma: "تلميح"
      confirm:
        - text: >
            «التلميح: الإشارة في فحوى الكلام إلى قصة أو شعر من غير تصريح به.»
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
        - text: >
            «التلميح: هو أن يشار في فحوى الكلام إلى قصة أو شعر، من غير أن
            تذكر صريحاً.»
          source: "كتاب التعريفات للشريف الجرجاني (hawramani)"
        - text: >
            «التّلميح: [في الانكليزية] Allusion, periphrasis ... وهو أن يشار
            في فحوى الكلام إلى قصة أو شعر أو مثل سائر من غير ذكره.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
      expands:
        - text: >
            «hint: (1) إلماع؛ تلميح؛ إشارة خفية (2) ذرة؛ أثر؛ مقدار ضئيل
            (3) يُلْمع إلى؛ يلمِّح.»
          source: "المورد الحديث (arabterm)"
          addition: >
            يؤكد أن "تلميح" من المعادلات العربية الراسخة لكلمة hint الإنجليزية،
            إلى جانب "إلماع" و"إشارة خفية".
        - text: >
            «insinuation: (1) تلميح. وبخاصة غَمزٌ؛ تعريض (2) تملُّق.»
          source: "المورد الحديث (arabterm)"
          addition: >
            يُظهر أن تلميح يُغطي أيضاً مفهوم التلميح الضمني المحذور (innuendo/
            insinuation)، وهو أخص من المعنى المراد هنا.

    - lemma: "دليل"
      confirm:
        - text: >
            «(الدَّلِيل) المرشد (ج) أدلة وأدلاء وما يستدل به (ج) أدلة.»
          source: "المعجم الوسيط (hawramani)"
        - text: >
            «الدَّلِيلُ: المرشد؛ ما يستدل به.»
          source: "المعجم الوسيط (ocr)"
        - text: >
            «clue: مؤشر.» / «sign» / «index»
          source: "arabterm — مسرد الإعلام والتواصل / مصادر متعددة"
      contradicts:
        - text: >
            «الدليل: ما يلزم من العلم به العلم بشيء آخر ... وفي عرف أهل الأصول:
            ما يمكن التوصل بصحيح النظر فيه إلى مطلوب خبري.»
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
          conflict: >
            هذا المعنى الأصولي يفيد اليقين والإلزام، لا الإشارة الطفيفة.
            الدليل في هذا السياق أقوى بكثير من hint.
        - text: >
            «الدليل: [في الانكليزية] Proof, demonstration, sign.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
          conflict: >
            المعادل الأول "proof" يتناقض مع كون هذا مجرد "إشارة طفيفة".
      expands:
        - text: >
            «indication: (2) «أ» دلالة؛ إشارة؛ علامة. «ب» عَرَض (ط). «ج» كل
            ما يوحي بأنه ضروري أو مستصوب.»
          source: "المورد الحديث (arabterm)"
          addition: >
            يُظهر أن المعادل العربي الأوسع لـindication يشمل "دلالة، إشارة،
            علامة" — وليس "دليل" بالضرورة.

    - lemma: "إيماء"
      confirm:
        - text: >
            «إِيمَاء: من (و م أ) الإشارة الخفيفة أو الإشارة بالرأس.»
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
        - text: >
            «إِيْمَاءٌ: الإشارة باليد أو بالرأس.»
          source: "كتاب العين للخليل (ocr)"
        - text: >
            «الْإِيمَاء: إِلْقَاء الْمَعْنى فِي النَّفس بخفاء وَسُرْعَة.»
          source: "دستور العلماء للأحمدنكري (hawramani)"
        - text: >
            «الإيماءُ: هُوَ الْكَلَام الْمشَار بِهِ إِلَى الْمَطْلُوب من
            قرب لَا مَعَ الخفاء.»
          source: "معجم مقاليد العلوم للسيوطي (hawramani)"

    - lemma: "أثارة"
      expands:
        - text: >
            «(الأثارة) العلامة وبقية الشيء وفي التنزيل العزيز {ائتوني بكتاب
            من قبل هذا أو أثارة من علم إن كنتم صادقين}.»
          source: "المعجم الوسيط (hawramani)"
          addition: >
            يُظهر أن الأثارة تعني "قدراً ضئيلاً من الشيء"، وهو قريب من
            معنى "slight indication" عبر المجاز، لكنه ليس الاستعمال الشائع.
      contradicts:
        - text: >
            «إثارة: excitation, irritation, stimulation, sensation.»
          source: "arabterm — مصادر متعددة (المعجم الموحد لعلم الأحياء، موسوعة
            الكهرباء، وغيرها)"
          conflict: >
            المصطلح الحي في العربية المعاصرة (إثارة) ينصرف إلى معاني
            التحريك والاستثارة الفيزيائية أو البيولوجية، لا الدلالة الخفيفة.

    - lemma: "إيحاء"
      confirm:
        - text: >
            «الإيحاء: إلقاء المعنى في النفس بخفاءٍ وسرعة.»
          source: "كتاب التعريفات للشريف الجرجاني (hawramani)"
        - text: >
            «الإيحاء: إيقاع المعنى في النفس بخفاء وسرعة، ولتضمن السرعة قيل
            أمر وحي وذلك بكون الكلام على طريق الرمز والتعريض.»
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
      expands:
        - text: >
            «إيحاء: suggestion, connotation, prompting.»
          source: "arabterm — مصادر متعددة"
          addition: >
            يُترجَم إيحاء في الاصطلاح الحديث بـ"suggestion/connotation" وهو
            أوسع من "hint" وأقرب إلى الإيحاء النفسي أو الدلالي.

    - lemma: "وميض"
      contradicts:
        - text: >
            «وَمِيض: من (و م ض) لمعان البرق.»
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
          conflict: >
            الوميض في أصله ظاهرة بصرية (بريق البرق)، ولا يُستعمل في
            المعاجم المعيارية للدلالة على الإشارة التلميحية.
        - text: >
            «وميض: scintillation, flash, flashing.»
          source: "arabterm — موسوعة الكهرباء وغيرها"
          conflict: >
            المعادلات الإنجليزية التقنية (flash, scintillation) بعيدة كلياً
            عن مفهوم "hint/clue".


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة الأولى ──
    - lemma: "تلميح"
      decision: confirmed
      decision_reason: >
        تلميح لمّة وثيقة الصلة بمفهوم "hint" (الإشارة غير المباشرة في الكلام).
        مشتقة من (لمح) على وزن تفعيل، مسكوكة منذ القرن التاسع في معاجم
        البلاغة. تُستخدم بهذا المعنى في العربية المعاصرة على نطاق واسع.
        غير أن دلالتها الأصيلة في البلاغة أخص (الإشارة إلى قصة/شعر من غير
        ذكر)، وقد توسّعت في العصر الحديث لتشمل أي hint لفظي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركز على التلميح اللفظي غير المباشر في فحوى الكلام. أخص من "دليل"
        (مادي/استدلالي) ومن "إيماء" (حركي/غير لفظي). يحمل ظل المعنى البلاغي
        (allusion) وقد امتدّ في المعاصرة ليشمل أي hint لفظي.
      quality_gates:
        consensus_and_fusha: true
        ease_of_use: true
        suitability: true
        heritage_preference: true
        arabic_preference: true
        derivability: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَلْمِيح"

    # ── اللمّة الموجودة الثانية ──
    - lemma: "دليل"
      decision: confirmed
      decision_reason: >
        دليل يغطّي الجانب الاستدلالي لمفهوم "clue" (الأثر المادي أو
        المعلومة الدالة التي تُرشد إلى حل)، وهو أحد اللمّتَين الإنجليزيتين
        للمجموعة (hint + clue). رغم أن معناه الأصولي أقوى من "إشارة طفيفة"
        إلا أن استعماله في سياق clue راسخ في العربية المعاصرة (دليل الجريمة،
        الدليل الأول في القضية). تحفُّظ: المعنى القاموسي الأصلي أوسع مما
        تنصّ عليه المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على الأثر المادي أو القرينة الموضوعية التي تُرشد إلى حقيقة
        (clue)، بخلاف "تلميح" الذي هو إشارة لفظية، و"إيماء" الذي هو إشارة
        حركية. دلالته أوسع وأشمل، ويُقرأ في سياق التحقيق والاستدلال.
      quality_gates:
        consensus_and_fusha: true
        ease_of_use: true
        suitability: true
        heritage_preference: true
        arabic_preference: true
        derivability: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَلِيل"

    # ── مرشح المرحلة ١ — مقبول ──
    - lemma: "إيمَاء"
      source: stage1
      decision: confirmed
      decision_reason: >
        أقوى مرشحات المرحلة ١. يعني أصلاً "الإشارة الخفيفة" (موسوعة قابوس:
        "الإشارة الخفيفة أو الإشارة بالرأس")، وهو تعريف مطابق تقريباً
        لـ"إشارة طفيفة". جذره (ومأ) مؤكَّد في مقاييس ابن فارس: «يُقَالُ:
        وَمَأْتُ إِلَيْهِ وَمْئًا، وَأَوْمَأْتُ إِيمَاءً أُومِئُ، إِذَا
        أَشَرْتُ». مسكوك في كتاب العين (القرن الثامن) ووارد في المعجم
        الأصولي. اختبار السكّ: لا يمكن إبدال "إيماء" بوصف آخر في جمل
        كـ"أومأ إليه إيماءً خفياً" — وحدة معجمية ثابتة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختص بالإشارة غير اللفظية (حركة الرأس أو اليد أو الجفن)، خلافاً
        لـ"تلميح" (لفظي) و"دليل" (موضوعي استدلالي). يُضيف البُعد الجسدي
        التعبيري لمفهوم "إشارة طفيفة".
      quality_gates:
        consensus_and_fusha: true
        ease_of_use: true
        suitability: true
        heritage_preference: true
        arabic_preference: true
        derivability: true
      morphological_check: >
        وزن إفعال (إيماء) مناسب للمصدر الدال على الحدث. جمعه: إيماءات
        (جمع سالم مؤنث). نسبته: إيمائي. القبول الصرفي تام.
      actions:
        - command: create_entry
          params:
            lemma: "إيمَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "أَثَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        "أثارة" في أصلها "بقية الشيء وعلامته" (أثارة من علم = ذرة من علم).
        وهي وإن كانت قريبة مجازياً من "دليل ضئيل"، فإن استعمالها الحي في
        العربية المعاصرة انصرف إلى "إثارة" بمعنى excitation/stimulation
        (مؤكَّد بأكثر من عشر وثائق arabterm). كما أن صيغتها (فَعالة) نادرة
        في الاستخدام المصطلحي وعُرضة للالتباس بـ"إثارة". لا يُستعمل في النثر
        الحديث بمعنى hint/clue.

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "إيحَاء"
      source: stage1
      decision: removed
      decision_reason: >
        "إيحاء" يعني "إلقاء المعنى في النفس بخفاء وسرعة"، وهو أوسع من
        "إشارة طفيفة" ويحمل طابع العملية النفسية لا الأثر/الدليل. يُترجَم
        في المعاجم الحديثة بـ"suggestion, connotation" لا "hint/clue". فضلاً
        عن ذلك، يرد اللفظ في تعريف الجنس المباشر للمجموعة ("شيء يخدم للدلالة
        أو الإيحاء") مما يجعل اعتماده لمّةً في النوع الأخص دَوْراً دلالياً.

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "وَمِيض"
      source: stage1
      decision: removed
      decision_reason: >
        الوميض أصلاً لمعان البرق (ظاهرة بصرية)، ومعادله التقني المعاصر
        flash/scintillation. المجاز إلى "إشارة طفيفة" غير مؤسَّس في التراث
        المعجمي ولا في الاستعمال الحديث. اختبار السكّ يفشل: "وميض الدليل"
        ليست وحدة معجمية مسجَّلة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "إشارة طفيفة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وجيز يفتقر إلى الجنس القريب والفصل النوعي المميِّز
        للمصطلح. "إشارة طفيفة" وصفٌ مباشر للمفهوم، لكنه لا يُبيِّن أن هذه
        الإشارة غير مباشرة، ولا يُفرِّق بين hint (تلميح لفظي) و clue
        (قرينة/أثر مادي). كما أن أسلوب التعريف لا يتسق مع أسلوب المعجم
        الوسيط.
    authored:
      - type: terminological
        text: >
