# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:

  per_entry:
    - lemma: "تَلْمِيح"
      entry_id: "{auto}"
      root: "لمح"
      maqayis_quote: >
        «اللَّامُ وَالْمِيمُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى لَمْعِ شَيْءٍ.
        يُقَالُ: لَمَحَ الْبَرْقُ وَالنَّجْمُ لَمْحًا، إِذَا لَمَعَا.
        وَرَأَيْتُ لَمْحَةَ الْبَرْقِ. وَيَقُولُونَ: لَأُرِيَنَّكَ لَمْحًا
        بَاصِرًا، أَيْ أَمْرًا وَاضِحًا.»

    - lemma: "دَلِيل"
      entry_id: "{auto}"
      root: "دلل"
      maqayis_quote: >
        «الدَّالُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا إِبَانَةُ الشَّيْءِ
        بِأَمَارَةٍ تَتَعَلَّمُهَا، وَالْآخَرُ اضْطِرَابٌ فِي الشَّيْءِ.
        فَالْأَوَّلُ قَوْلُهُمْ: دَلَلْتُ فُلَانًا عَلَى الطَّرِيقِ.
        وَالدَّلِيلُ: الْأَمَارَةُ فِي الشَّيْءِ.»

    - lemma: "إيمَاء"
      entry_id: "{auto}"
      root: "ومأ"
      maqayis_quote: >
        «الْوَاوُ وَالْمِيمُ وَالْهَمْزَةُ: كَلِمَةٌ وَاحِدَةٌ. يُقَالُ:
        وَمَأْتُ إِلَيْهِ وَمْئًا، وَأَوْمَأْتُ إِيمَاءً أُومِئُ، إِذَا
        أَشَرْتُ. وَإِذَا تَرَكْتَ الْهَمْزَةَ فَالْوَامِيَةُ، وَهِيَ
        الدَّاهِيَةُ.»

  per_sense:
    - lemma: "تَلْمِيح"
      sense_id: "{auto}"
      nuance: >
        إشارة لفظية غير مباشرة في فحوى الكلام؛ يختص بالتلميح الكلامي
        (verbal hint/allusion). يُقابل تحديداً المعنى الأول لـhint
        (اقتراح أو إيحاء لفظي خفي).

    - lemma: "دَلِيل"
      sense_id: "{auto}"
      nuance: >
        قرينة أو أثر مادي/موضوعي يُرشد إلى حقيقة أو يُوجِّه البحث؛ يُقابل
        بصورة أقرب كلمة clue (أثر استدلالي). أعم دلالةً من "تلميح" و"إيماء"،
        ويُستعمل في السياق الاستقصائي والتحقيقي.

    - lemma: "إيمَاء"
      sense_id: "{auto}"
      nuance: >
        إشارة غير لفظية خفيفة بالجسد (الرأس، اليد، العين)؛ يُضيف البُعد
        الحركي غير اللفظي إلى مفهوم "إشارة طفيفة"، ولا يُشاركه فيه
        "تلميح" (لفظي) ولا "دليل" (موضوعي).

  synset:
    cultural_fit: native

  actions:
    # تلميح — entry metadata
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"لمح","maqayis":"«اللَّامُ وَالْمِيمُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى لَمْعِ شَيْءٍ»"}'

    # تلميح — sense metadata
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"إشارة لفظية غير مباشرة في فحوى الكلام، يقابل verbal hint/allusion","mwe":false}'

    # دليل — entry metadata
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دلل","maqayis":"«الدَّالُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا إِبَانَةُ الشَّيْءِ بِأَمَارَةٍ ... وَالدَّلِيلُ: الْأَمَارَةُ فِي الشَّيْءِ»"}'

    # دليل — sense metadata
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"قرينة أو أثر موضوعي يُرشد إلى حقيقة، يقابل clue في السياق الاستقصائي","mwe":false}'

    # إيماء — entry metadata
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ومأ","maqayis":"«الْوَاوُ وَالْمِيمُ وَالْهَمْزَةُ: كَلِمَةٌ وَاحِدَةٌ. يُقَالُ: وَمَأْتُ إِلَيْهِ وَمْئًا، وَأَوْمَأْتُ إِيمَاءً أُومِئُ، إِذَا أَشَرْتُ»"}'

    # إيماء — sense metadata
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"إشارة غير لفظية خفيفة بالجسد (رأس/يد/عين)، يضيف البعد الحركي لمفهوم إشارة طفيفة","mwe":false}'

    # synset metadata
