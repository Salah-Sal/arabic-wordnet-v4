# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مترجَمٌ حرفياً من الإنجليزية ويحتوي على تركيب «من خلال» غير معهود في أسلوب المعاجم الفصيحة"
      - "كلتا اللمَّتين خاليتان من التشكيل الكامل في قاعدة بيانات AWN4"
      - "إدراج المفرد (معلومة) والجمع (معلومات) ضمن مجموعة ترادفية واحدة يستوجب التحقق من أن لكلٍّ منهما دلالةً مستقلة تبرر الإدراج المنفصل"
      - "التعريف يستخدم «المعرفة» جنساً قريباً، وهي كلمة من المجموعة الأمّ (awn4-00023451-n)، مما قد يُوهم بالدوران"
    observations: >
      المجموعة الترادفية تعبِّر عن مفهوم «المعرفة المكتسبة بالتعلُّم والخبرة والتعليم»، وهو ما
      تؤديه اللمَّتان (معلومة/معلومات) بوصفهما اسم مفعول من الفعل (عَلِمَ) على وزن مَفْعُولَة
      ومَفْعُولَات. يختص (معلومة) بالدلالة على وحدة معلوماتية مفردة محددة، بينما يُستخدم
      (معلومات) للإشارة إلى المعرفة المكتسبة بوجه عام. المفهوم عربي الجذر تماماً والمصطلحان
      راسخان في الاستخدام المعاصر والتقني. الوزن الصرفي (مَفْعُول) دالٌّ على الموضوع/الحاصل،
      أي «الشيء المعلوم»، وهو ملاءمة صرفية ممتازة للمفهوم.

  blind_candidates:
    - lemma: "دِرَايَة"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (درى) على وزن فِعَالَة، يعني العلم المُستفاد من الخبرة والمعايشة والتجربة؛
        يناسب شقَّ «الخبرة» في التعريف. «فلان حسن الدِّرية» عبارة مستخدمة في التراث العربي
        للدلالة على اتساع المعرفة المكتسبة.
    - lemma: "تَحْصِيل"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (حصل) على وزن تَفْعِيل، يعني جمع العلم واستيعابه؛ يناسب شقَّي «الدراسة
        والتعليم» في التعريف. «التحصيل العلمي» و«تحصيل المعرفة» تعبيران مستخدمان للدلالة على
        الاكتساب المعرفي المنظَّم.
    - lemma: "وُقُوف"
      generation_method: majaz
      justification: >
        مصدر من (وقف)، استُعمل مجازاً في العربية الكلاسيكية بمعنى الإحاطة العلمية؛
        «الوقوف على الأمر» = الاطلاع عليه وإدراكه تماماً. إحياءٌ لإزاحة دلالية قديمة
        قد تُعبِّر عن المعرفة التامة المكتسبة من الدراسة والتجربة.
    - lemma: "إِطِّلَاع"
      generation_method: ishtiqaq
      justification: >
        مصدر افتعال من (طلع)، يدل على الإحاطة بالأمر والعلم به؛ «أَطْلَعَه على الأمر» أي
        أعلمه به، و«اطَّلع على الشيء» أي عرفه وأحاط بعلمه — قريب من المعرفة المكتسبة
        بالدراسة والتعليم.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت:
# (١) مطابقة دفعية لجميع اللمّات + المرشحات الأربعة (headword_norm IN ...)
# (٢) إثراء بالمعرِّف: definitions + examples لأبرز المداخل
# (٣) الجسر الإنجليزي: translation_en:"information"
# (٤) مقاييس اللغة لابن فارس (dictionary_id=151) للجذور: علم، درى، حصل، وقف، طلع
# (٥) بحث FTS بالكلمات المفتاحية: معرفة، مكتسب، خبرة، استعلام
stage2_evidence:
  per_lemma:

    - lemma: "مَعْلُومَة"
      confirm:
        - text: "«هي مجموعة من المعطيات في صيغة يمكن الاستفادة منها — مَعْلُومَات (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
        - text: "«المعلومة، حسب نظرية الإعلام، هي الدلالة المسندة لمعطيات بمساعدة المواصفات المستعملة وذلك لتقديمها على شكل معين، فهي في هذا التصور متوالية من الإشارات الدقيقة المنتقلة بين مرسل ومتلق عبر قناة معينة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(1) «أ» إعلام؛ إخبار. «ب» عِلْم؛ اطّلاع. «ج» معرفة / (2) «أ» أخبار؛ أنباء. «ب» حقائق؛ معلومات»"
          source: "المورد الحديث (2008)"
          addition: >
            يكشف أن «information» في العربية يقابلها طيف من الكلمات (إعلام، علم، معرفة، معلومات)،
            وأن «معلومات/معلومة» هو المقابل الأكثر شمولاً وتخصصاً في السياق المعرفي العلمي

    - lemma: "مَعْلُومَات"
      confirm:
        - text: "«بيانات معالجة لها معنى في سياق معين»"
          source: "معجم البيانات والذكاء الاصطناعي — سيوار / SDAIA (2024)"
        - text: "«المعنى الذي يُفترَضُ أن تمثِّلَه المعطياتُ للناس. تتألَّفُ المعطياتُ من حقائقَ تتحوّلُ إلى معلومات عندما يُنظر إليها ضمن السياق، وتعبِّر للناس عن معنى»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«مجموعة من الإشارات الدقيقة منتقلة بين المرسِل والمرسَل إليه عبر قناة معينة»"
          source: "مسرد الإعلام والتواصل — أليكسو"
      expands:
        - text: "«(1) «أ» إعلام؛ إخبار. «ب» عِلْم؛ اطّلاع. «ج» معرفة / (2) «أ» أخبار؛ أنباء. «ب» حقائق؛ معلومات / (3) اتهام رسميّ [صادر عن النيابة العامة]»"
          source: "المورد الحديث (2008)"
          addition: >
            يُثبت أن «معلومات» هو أبرز مقابل عربي لـ«information» في سياق المعرفة العامة؛ كما
            يُدرج المعجم الحديث المفردة ضمن شبكة دلالية أوسع تضم الإعلام والأخبار والحقائق

    - lemma: "دِرَايَة"
      confirm:
        - text: "«فُلَانٌ حَسَنُ الدِّرْيَةِ، كَقَوْلِكَ: حَسَنُ الْفِطْنَةِ» — دَرَى: «قَصْدُ الشَّيْءِ وَاعْتِمَادُهُ طَلَبًا»"
          source: "مقاييس اللغة لابن فارس (درى)"
      contradicts:
        - text: "«الدراية: المعرفة المدركة بضرب من الحيل»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622)"
          conflict: >
            قيَّدت «الدراية» بالمعرفة المكتسبة بالحيلة والمراوغة، وهو أضيق بكثير من دلالة
            المجموعة التي تشمل المعرفة المكتسبة بالتعليم النظري والدراسة الأكاديمية
        - text: "«الدراية هو معرفة كيفية القيام بشيء ما بسلاسة وكفاءة — know-how»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — أليكسو"
          conflict: >
            «know-how» تعني المعرفة العملية التطبيقية، وهي مختلفة عن المعرفة النظرية المكتسبة
            من الدراسة والتعليم التي تعبِّر عنها المجموعة
      expands:
        - text: "«(في مصطلح الحديث): العِلْم الذي يَبْحَثُ فيه عن المعْنَى المفْهُوم من أَلْفاظ الحديث متن الحديث وعن المعْنَى المُراد منها. ويُقابله عِلْمُ الرِّوايةِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            تكشف أن «الدراية» تخصصت في مصطلح علوم الحديث النبوي كعلم قائم بذاته مقابل
            «الرواية»، مما يُضيِّق دلالتها المصطلحية أكثر

    - lemma: "تَحْصِيل"
      confirm:
        - text: "«في اللغة الجمع، وفي العرف العام جمع العلم مطلقاً... غلب استعماله في تحصيل العلوم»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777)"
        - text: "«التحصيل: إخراج اللب من القشر، ومنه {وَحُصِّلَ مَا فِي الصُّدُور} أي ظهر ما فيها. وقال أبو البقاء: التحصيل، الإدراك من حصلت الشيء أي أدركته»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622)"
      contradicts:
        - text: "«(في التَّرْبِيَةِ وعلم النَّفْسِ) achievement: إنجازٌ في ميدانٍ مُعَيَّنٍ وخاصَّةً فى المـَجالِ الدِّراسِيّ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            «التحصيل» في المعاجم الحديثة دالٌّ على الإنجاز التعليمي (achievement) أو عملية
            اكتساب العلم (المصدر)، لا على المعرفة المكتسبة ذاتها (الحاصل) — وهو ما تعبِّر عنه المجموعة
      expands:
        - text: "«أَصْلُ التَّحْصِيلِ اسْتِخْرَاجُ الذَّهَبِ أَوِ الْفِضَّةِ مِنَ الْحَجَرِ أَوْ مِنْ تُرَابِ الْمَعْدِنِ... وَزَعَمَ نَاسٌ مِنْ أَهْلِ اللُّغَةِ أَنَّ أَصْلَ التَّحْصِيلِ اسْتِخْرَاجُ الذَّهَبِ»"
          source: "مقاييس اللغة لابن فارس (حصل)"
          addition: >
            الأصل المجازي لـ«تحصيل» هو استخراج الجوهر من المادة الخام — استعارةٌ جميلة لاستيعاب
            العلم من المصادر، لكنه يظل مصدراً يدل على العملية لا على المعرفة الحاصلة ذاتها

    - lemma: "وُقُوف"
      contradicts:
        - text: "«وقوف — انظر: الوقف» (في سياق مصطلح القراءات القرآنية)"
          source: "مختصر العبارات لمعجم مصطلحات القراءات للدوسري (ت. 2008)"
          conflict: >
            المدخل الوحيد الذي وُجد لـ«وقوف» بهذه الصيغة يحيل إلى الوقف في التجويد والقراءات
            القرآنية، لا إلى المعرفة المكتسبة بأي وجه
        - text: "«وَقَفَ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَمَكُّثٍ فِي شَيْءٍ ثُمَّ يُقَاسُ عَلَيْهِ. مِنْهُ وَقَفْتُ أَقِفُ وُقُوفًا»"
          source: "مقاييس اللغة لابن فارس (وقف)"
          conflict: >
            الأصل اللغوي لـ«وقف» هو التمكث والثبات المادي؛ والمجاز المنشود (الوقوف على الأمر
            = العلم به) لم يُسجَّل كمصطلح مستقل في أي معجم، فيفشل اختبار التثبيت المعجمي

    - lemma: "إِطِّلَاع"
      contradicts:
        - text: "«الاطِّلاعُ: النَّجاةُ. (عن كُراع)»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المعجم الكبير يُسجِّل «الاطلاع» بمعنى النجاة فقط، لا بمعنى المعرفة المكتسبة؛
            وهو معنى غريب تماماً عن دلالة المجموعة
        - text: "«اطِّلاع: عملية الوصول إلى المعلومات في أماكن تخزينها بهدف الاطلاع عليها — accession»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          conflict: >
            «الاطلاع» في تقنية المعلومات يعني الوصول إلى مستودع البيانات (accession)، وهو
            عملية الوصول لا المعرفة المكتسبة ذاتها
      expands:
        - text: "«أَطْلَعْتُكَ عَلَى الْأَمْرِ إِطْلَاعًا... وَاسْتَطْلَعْتُ رَأْيَ فُلَانٍ، إِذَا نَظَرْتَ مَا الَّذِي يَبْرُزُ إِلَيْكَ مِنْهُ»"
          source: "مقاييس اللغة لابن فارس (طلع)"
          addition: >
            يُثبت أن «الإطلاع» في أصله فعلٌ متعدٍّ يدل على الإبلاغ والإعلام (أطلعته)، لا اسمٌ
            مستقل للمعرفة المكتسبة؛ وأن الجذر (طلع) يدل أصلاً على الظهور والبروز


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "معلومة"
      decision: confirmed
      decision_reason: >
        اسم مفعول من (عَلِمَ) على وزن مَفْعُولَة، يدل على القطعة المفردة من المعلومات المكتسبة؛
        موثَّق في معاجم متعددة (تقانة المعلومات، اللسانيات، البيانات والذكاء الاصطناعي) بدلالة
        «information» بوصفه الوحدة المفردة. الوزن الصرفي ملائم تماماً (مفعول = الشيء المعلوم/الحاصل).
        يجتاز جميع بوابات الجودة الستة: اطراد، يُسر تداول، ملاءمة، تراثي، عربي، اشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُشير إلى وحدة معلوماتية مفردة بعينها؛ تُستخدم في الخطاب التقني والأكاديمي للإشارة
        إلى عنصر واحد محدد من المعرفة («حصلتُ على معلومةٍ مفيدة»)، وتُقابل «مَعْلُومَات»
        التي تُستخدم للمعرفة بوجه عام
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْلُومَة"

    - lemma: "معلومات"
      decision: confirmed
      decision_reason: >
        جمع مؤنث سالم من (معلومة)، وهو الصيغة الأكثر شيوعاً واستخداماً للمفهوم بوجه عام؛
        موثَّق على نطاق واسع في أكثر من عشرة معاجم تقنية وعامة بمقابلة «information».
        يُستخدم في العربية المعاصرة كمصطلح مطلق لـ«information» في الاستخدام غير المقيَّد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة الجمعية الأعم والأكثر استخداماً؛ تُستخدم للإشارة إلى المعرفة المكتسبة بوجه عام
        أو لكميات من المعطيات دون تحديد وحدة بعينها («لديَّ معلوماتٌ كافية عن الموضوع»)،
        وهي المقابل الأكثر شيوعاً لـ«information» في الاستخدام العام والتقني على حدٍّ سواء
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْلُومَات"

    - lemma: "دِرَايَة"
      source: stage1
      decision: removed
      decision_reason: >
        الدراية في المعاجم الكلاسيكية «المعرفة المدركة بضرب من الحيل» (المناوي)، وفي المعاجم
        الحديثة تقابل «know-how» أي المعرفة العملية التطبيقية — وكلا المعنيين أضيق من دلالة
        المجموعة التي تشمل المعرفة المكتسبة بالتعليم النظري والدراسة الأكاديمية. كما تخصصت
        «الدراية» في مصطلح علوم الحديث النبوي تخصصاً يُبعدها عن الاستخدام العام.
      evidence_assessment:
        case: mixed

    - lemma: "تَحْصِيل"
      source: stage1
      decision: removed
      decision_reason: >
        التحصيل مصدرٌ يدل على عملية اكتساب العلم (الفعل/العملية)، لا على المعرفة المكتسبة
        ذاتها (الحاصل/النتيجة)؛ وتُسجِّله المعاجم الحديثة بمعنى «achievement» (الإنجاز
        التعليمي)، مما يُبعده عن الدلالة المقصودة للمجموعة التي تعبِّر عن المحتوى المعرفي
        لا عن عملية اكتسابه.
      evidence_assessment:
        case: mixed

    - lemma: "وُقُوف"
      source: stage1
      decision: removed
      decision_reason: >
        فشل في اختبار التثبيت المعجمي: لم يُسجَّل «وقوف» بمعنى المعرفة المكتسبة في أي معجم
        معتمد؛ المدخل الوحيد الذي وُجد يحيله إلى مصطلح القراءات القرآنية. الأصل اللغوي
        (تمكث وثبات) بعيد عن الدلالة المطلوبة، ومجاز «الوقوف على الأمر» لم يُصَكَّ مصطلحاً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "إِطِّلَاع"
      source: stage1
      decision: removed
      decision_reason: >
        الاطلاع مصدرٌ يدل على فعل الإحاطة بالأمر (العملية)، لا على المعرفة المكتسبة ذاتها؛
        المعجم الكبير يُسجِّله بمعنى «النجاة»، والمعاجم التقنية بمعنى «الوصول إلى مستودع
        البيانات» — وكلاهما بعيد عن دلالة المجموعة. ومقاييس اللغة تُثبت أن الأصل ظهورٌ
        وبروز لا إدراك.
