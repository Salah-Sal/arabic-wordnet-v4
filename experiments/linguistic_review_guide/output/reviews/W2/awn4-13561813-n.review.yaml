  per_entry:
    - lemma: "حِفْظ"
      entry_id: "{auto}"
      root: "حفظ"
      maqayis_quote: "«الْحَاءُ وَالْفَاءُ وَالظَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُرَاعَاةِ الشَّيْءِ.»"
    - lemma: "حِفْظٌ حَيَوِيٌّ"
      entry_id: "{auto}"
      roots:
        - word: "حفظ"
          root: "حفظ"
          maqayis_quote: "«الْحَاءُ وَالْفَاءُ وَالظَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُرَاعَاةِ الشَّيْءِ.»"
        - word: "حيوي"
          root: "حيي"
          maqayis_quote: "«الْحَاءُ وَالْيَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ: أَحَدُهُمَا خِلَافُ الْمَوْتِ، وَالْآخَرُ الِاسْتِحْيَاءُ الَّذِي هُوَ ضِدُّ الْوَقَاحَةِ.»"
