stage1_review:
  assessment:
    concerns:
      - اللمات الموجودة تفتقر إلى التشكيل الكامل.
      - التعريف الحالي "حالة الجمع" هو تعريف بالدوران (استخدام كلمة من اللمة في التعريف).
    observations: |
      المجموعة تتناول مفهوم "التعدد" أو "حالة كون الشيء جمعاً" في مقابل الإفراد. 
      هذا المفهوم يتقاطع مع الجانب اللساني (مقولة العدد) والجانب الفلسفي (الكثرة في مقابل الوحدة).
  blind_candidates:
    - lemma: "تَعَدُّد"
      generation_method: ishtiqaq
      justification: "المصدر المباشر من الفعل (تعدد) للدلالة على حالة كثرة الآحاد."
    - lemma: "جَمْع"
      generation_method: ishtiqaq
      justification: "المصدر من (جمع) ويستخدم في النحو للدلالة على الحالة المقابلة للإفراد."
    - lemma: "تَعَدُّدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي يعبر عن المفهوم المجرد للتعدد، وشائع في الاستعمال الحديث."
    - lemma: "جَمْعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (جمع) قد يستخدم فلسفياً للدلالة على صفة الجمع، وإن غلبت عليه الدلالة المؤسسية."

stage2_evidence:
  per_lemma:
    - lemma: "تَعَدُّد"
      confirm:
        - text: "السمة المميزة لمقولة العدد الدالة على تمثيل أكثر من وحدة قابلة للعزل."
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "السمة المميزة لمقولة العدد الدالة على تمثيل أكثر من وحدة قابلة للعزل."
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "صَار ذَا عدد وهم يتعددون على ألف يزِيدُونَ."
          source: "المعجم الوسيط"
    - lemma: "جَمْع"
      confirm:
        - text: "الجَمْعُ: اسم دلّ على جملة آحاد مقصودة بحروف مفردة بتغيّر ما، ويسمّى مجموعا أيضا."
          source: "كشاف اصطلاحات الفنون"
        - text: "الجمعُ: أَن تجمع بَين مُتَعَدد فِي حكم."
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "الجَمْعُ: ضمّ الشيء بتقريب بعضه من بعض."
          source: "المفردات للراغب الأصفهاني"
    - lemma: "تَعَدُّدِيَّة"
      confirm:
        - text: "تعدُّدية: اصطلاح يهتم بتنويع مصادرالوحدة، للإحاطة بتعدد الظواهر بدل الأحادية الفقيرة."
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "جَمْعِيَّة"
      expands:
        - text: "اجتماع الهم في التوجه إلى الله تعالى."
          source: "التعريفات للجرجاني"
          addition: "معنى صوفي بعيد عن السياق العددي"

stage3_analysis:
  per_lemma:
    - lemma: "تعدد"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن الكثرة والزيادة عن الواحد، وهو الترجمة الأدق لـ plurality في سياق الحالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَدُّد"
    - lemma: "جمع"
      decision: confirmed
      decision_reason: "المصطلح النحوي واللغوي التقليدي المقابل للإفراد، ويشير إلى حالة كون الاسم دالاً على جماعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَمْع"
    - lemma: "تَعَدُّدِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي شائع في الفكر الحديث للتعبير عن مبدأ أو حالة التعدد في المجالات الثقافية والسياسية والعددية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَعَدُّدِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14593425-n"}
    - lemma: "جَمْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تستخدم غالباً للدلالة على المؤسسات (associations) أو في سياقات صوفية، ولا تشيع للدلالة على 'حالة الجمع' العددية."

stage4_content:
  definition:
    current: "حالة الجمع"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويستخدم لفظاً مشتقاً من اللمة (دوران)."
    authored:
      - type: terminological
        text: "السِّمة المميِّزة لمقولة العَدد الدالّة على تَمثيل أكثَر من وحدةٍ واحدة، وهي الحالة المُقابلة للإفراد."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14593425-n", definition_index: 0, text: "السِّمة المميِّزة لمقولة العَدد الدالّة على تَمثيل أكثَر من وحدةٍ واحدة، وهي الحالة المُقابلة للإفراد."}

  examples:
    per_lemma:
      - lemma: "تَعَدُّد"
        examples:
          - text: "يُؤَدِّي تَعَدُّدُ الآرَاءِ فِي المَجْلِسِ إِلَى إِثْرَاءِ الحِوَارِ وَتَبَايُنِ وُجْهَاتِ النَّظَرِ."
            type: usage
      - lemma: "جَمْع"
        examples:
          - text: "تَتَغَيَّرُ صِيغَةُ الفِعْلِ حِينَ يَنْتَقِلُ الفَاعِلُ مِنْ حَالَةِ الإِفْرَادِ إِلَى الجَمْعِ."
            type: usage
      - lemma: "تَعَدُّدِيَّة"
        examples:
          - text: "تَقُومُ الدِّيمُقْرَاطِيَّةُ الحَدِيثَةُ عَلَى مَبْدَأِ التَّعَدُّدِيَّةِ السِّيَاسِيَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-14593425-n", text: "تَعَدُّدُ العَنَاصِرِ فِي المَجْمُوعَةِ يَجْعَلُهَا أَكْثَرَ تَعْقِيدًا."}

