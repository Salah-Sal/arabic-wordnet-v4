# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # التوليد الأعمى — قُرئ ملف synset_info_masked.yaml أولاً (بدون لمّات)
  # التعريف الأعمى المتاح: «فعل عرض شيء ما بتفاخر»
  # المفهوم المُستنتج: الفعل المقصود بعرض شيء ما على الآخرين بتعاظم ومباهاة
  blind_candidates:
    - lemma: "مُبَاهَاةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر باهى (الباب الثالث) على وزن مُفَاعَلَة من الجذر (ب-ه-و)؛ ويعني التفاخرَ
        والتعاظمَ المتبادَل، أي إظهار ما يتميّز به المرء أمام الآخرين بقصد الإعجاب.
        الوزن مُفَاعَلَة ينبئ بالمشاركة والمنافسة في العرض، وهو ما يناسب مفهوم
        «عرض الشيء بتفاخر».
    - lemma: "تَبَجُّحٌ"
      generation_method: majaz
      justification: >
        إحياء لفظ قديم من الجذر (ب-ج-ح)؛ أصل معناه الفرح والابتهاج، ثم امتدّ دلالياً
        إلى الفخر والمباهاة بما يملكه المرء. وقد ورد في المعجم الكبير «فلانٌ: فَرِحَ
        تعظَّمَ افتخر وباهى»، فالإزاحة الدلالية من الفرح الداخلي إلى الإظهار الخارجي
        المتعاظم طبيعية ومبرَّرة.
    - lemma: "تَفَاخُرٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر تفاخَرَ (الباب السادس) على وزن تَفَاعُل من الجذر (ف-خ-ر)؛ يعني
        الاشتراك في إبراز الفخر والمزايا. وزن تَفَاعُل يدلّ على الاشتراك والتبادل،
        مما يوحي بعرض الشيء أمام جمهور يُشهَد عليه. مناسبٌ للمفهوم لكونه يتضمن
        بُعد الإظهار الاجتماعي.
    - lemma: "اسْتِعْرَاضٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر استعرضَ (الباب العاشر) على وزن اسْتِفْعَال من الجذر (ع-ر-ض)؛ ويعني
        الطلب العمدي للعرض والإظهار. وزن الاستفعال يحمل دلالة الطلب والقصدية،
        فـ«استعرض» تعني عَرَضَ بشكل مقصود ومنظَّم. يناسب تماماً مفهوم
        «عرض الشيء بتفاخر» لأن الاستعراض ينطوي على الإظهار المتعمَّد.

  # التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة «تباهي» مُدرجة بدون تشكيل؛ وشكلها الصحيح كاسم (مصدر) هو «تَبَاهٍ» لا «تَبَاهَى» الفعليّة — يلزم تحديد التشكيل."
      - "اللمّة «استعراض» بدون تشكيل كامل — يلزم إضافة الحركات الكاملة."
      - "التعريف العربي الحالي «فعل عرض شيء ما بتفاخر» يبدو ترجمة حرفية من الإنجليزية، ولا يتّبع أسلوب المعجم الوسيط."
      - "المجموعة تحتوي فقط على لمّتين لمفهوم ثري الرصيد في التراث اللغوي العربي."
    observations: >
      المجموعة تمثّل مفهوماً وجدانياً-سلوكياً راسخاً في الموروث الثقافي العربي؛ وهو
      إظهار الشيء أو التميّز على الملأ بصورة مبالَغ فيها غرضُها الإعجاب والإذهال. والتراث
      العربي زاخر بالألفاظ الدالّة على هذا المعنى بدرجات متفاوتة: الاستعراض بمعنى
      العرض المنظَّم، والتباهي بمعنى التفاخر الاجتماعي. اللمّة «تباهي» مشتقة من الجذر
      (ب-ه-و) وهو في الأصل يدلّ على الاتساع والظهور (البهو = الحجرة الواسعة البارزة)،
      ففيه إزاحة دلالية طبيعية نحو الظهور الاجتماعي المبالَغ فيه. أما «استعراض» فيحمل
      دلالة أكثر رسمية وتنظيماً (كالاستعراض العسكري)، ومن ثَمَّ فهو أقل صراحةً في الدلالة
      على التفاخر.


