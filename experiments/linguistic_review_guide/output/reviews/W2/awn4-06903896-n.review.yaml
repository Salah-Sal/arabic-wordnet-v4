      decision_reason: >
        تَفَاخُرٌ مصدر تفاخَرَ (وزن تَفَاعُل من ف-خ-ر)، يعني «فخر بعضهم على بعض»
        أي التباهي اللفظي التنافسي. دلالته تتمحور حول التنافس في المدح والإعلاء اللفظي
        بين أشخاص (ادّعاء المزايا)، وهو أوسع من مفهوم هذه المجموعة الذي يخصّ
        «عرض شيء ما بتفاخر» (إظهار شيء محسوس). كما أن الأدلة تُظهره ترجمةً
        لـostentation و boastfulness بوجه عام، لا لـflaunt بوجه خاص.
        إضافته قد تُربك الدلالة بنقل المحور من الإظهار المادي إلى التفاخر اللفظي.


