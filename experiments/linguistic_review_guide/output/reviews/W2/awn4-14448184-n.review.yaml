# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتَيْن (اكتمال، نضج) مكتوبتان بلا تشكيل في بيانات AWN4"
      - "التعريف العربي الحالي يستخدم (ناضجاً) وهو مشتق من نفس جذر لمّة (نضج)، مما يوقعه في الدوران"
      - "الشقّ الثاني من التعريف (التطور الكامل) عبارة تفسيرية مجردة لا تُحكم الفصل النوعي"
    observations: >
      المجموعة تُعبّر عن المفهوم الإنجليزي maturity/matureness بمعنى «حالة بلوغ الشيء أو الكائن
      تمامَ نموّه». اللمّة الأولى (نضج) هي المصطلح العربي الأصيل المتجذّر في المعجم الكلاسيكي
      والمعاصر على حدٍّ سواء؛ وقد عرّفها ابن فارس بأنها «أصل يدل على بلوغ النهاية في طبخ الشيء،
      ثم يُستعار في كل شيء بلغ مدى الإحكام». أما اللمّة الثانية (اكتمال) فهي مصدر Form VIII
      من الجذر (كمل) وتُركّز على جانب التمام والتكامل في البنية لا على عملية النضج التدريجي؛
      وهي صحيحة دلالياً لكنها لم تُسجَّل مدخلاً مستقلاً في قاعدة البيانات المعجمية.
  blind_candidates:
    - lemma: "نُضْج"
      generation_method: ishtiqaq
      justification: >
        مصدر نَضِجَ على وزن فُعْل (جذر ن-ض-ج)، يدل على حالة الاكتمال الناتجة عن النضوج؛
        الوزن فُعْل مناسب للمصادر الدالة على أحوال ذات امتداد زمني كالجوع والعطش.
    - lemma: "بُلُوغ"
      generation_method: ishtiqaq
      justification: >
        مصدر بَلَغَ على وزن فُعُول (جذر ب-ل-غ)، يعني الوصول إلى مرحلة التمام؛
        الوزن فُعُول مناسب للمصادر الدالة على حدث الانتهاء والبلوغ.
    - lemma: "رُشْد"
      generation_method: ishtiqaq
      justification: >
        مصدر رَشَدَ على وزن فُعْل (جذر ر-ش-د)، يشير إلى النضج العقلي ورسوخ الحكمة؛
        الوزن فُعْل يناسب الأحوال الراسخة الثابتة.
    - lemma: "إِينَاع"
      generation_method: majaz
      justification: >
        مصدر أَيْنَعَ (جذر ي-ن-ع)، أصله نضوج الثمار وإدراكها؛ يُستعمل بالإزاحة الدلالية
        للتعبير عن بلوغ أي شيء ذروة تطوّره وكماله، وهي صورة مجازية أصيلة في العربية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "اكتمال"
      expands:
        - text: >
            «(كَمَلَ) الْكَافُ وَالْمِيمُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَمَامِ الشَّيْءِ.
            يُقَالُ: كَمَلَ الشَّيْءُ وَكَمُلَ فَهُوَ كَامِلٌ، أَيْ تَامٌّ. وَأَكْمَلْتُهُ أَنَا.
            قَالَ اللَّهُ تَعَالَى: {الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ}»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر كمل يدل على التمام والاكتمال؛ مصدر اكتمال (Form VIII) ينسجم مع هذا الأصل
            المعجمي ويدل على بلوغ حالة التمام، وإن لم يُسجَّل مدخلاً مستقلاً في قاعدة البيانات.

    - lemma: "نضج"
      confirm:
        - text: >
            «(نَضِجَ) النُّونُ وَالضَّادُ وَالْجِيمُ أَصْلٌ يَدُلُّ عَلَى بُلُوغِ النِّهَايَةِ
            فِي طَبْخِ الشَّيْءِ، ثُمَّ يُسْتَعَارُ فِي كُلِّ شَيْءٍ بَلَغَ مَدَى الْإِحْكَامِ.
            وَنَضِجَ التَّمْرُ وَاللَّحْمُ نُضْجًا، وَأَنْضَجْتُهُ أَنَا. وَيُسْتَعَارُ هَذَا
            فَيُقَالُ: هُوَ نَضِيجُ الرَّأْيِ: مُحْكَمُهُ.»
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «نَضِجَ الثَمَرُ واللحمُ نُضْجاً ونَضْجاً، أي أدركَ فهو نَضيج وناضِج.
            ورجلٌ نَضيجُ الرأي: مُحْكَمُهُ.»
          source: "تاج اللغة وصحاح العربية للجوهري (ت 393 هـ)"
        - text: >
            «نَضِجَ اللَّحْمُ وَالْفَاكِهَةُ نَضَجًا مِنْ بَابِ تَعِبَ طَابَ أَكْلُهُ
            وَالِاسْمُ النُّضْجُ بِضَمِّ النُّونِ وَفَتْحُهَا لُغَةٌ وَالْفَاعِلُ نَاضِجٌ
            وَنَضِيجٌ وَأَنْضَجْتُهُ بِالطَّبْخِ فَهُوَ مُنْضَجٌ وَنَضِيجٌ أَيْضًا.»
          source: "المصباح المنير للفيومي (ت 770 هـ)"
        - text: >
            «نَضِجَ الثَّمَرُ واللَّحْمُ، كسَمِعَ، نُضْجاً ونَضْجاً: أدْرَكَ، فهو نَضِيجٌ
            وناضِجٌ. وهو نَضِيجُ الرَّأْيِ: مُحْكَمُه.»
          source: "القاموس المحيط للفيروزآبادي (ت 817 هـ)"
        - text: "«اكتمال النمو»"
          source: "المعجم الموحد لمصطلحات علم الأحياء — ALECSO (ترجمة: maturation)"
        - text: "«الطور الذي يصبح فيه النبات قادراً على التناسل بالبذور.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية — ALECSO (ترجمة: maturity)"
        - text: "«نُضْج، إيناع» — ترجمة: maturity"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — ALECSO"
      expands:
        - text: >
            «ومن المجاز: هو نضيج الرأي. وأمر منضج، وأنضج رأيك.
            ونضّجت النّاقة الحمل: جاوزت به وقت الولادة.»
          source: "أساس البلاغة للزمخشري (ت 538 هـ)"
          addition: >
            الزمخشري يوسّع الاستعمال المجازي للجذر: النضج يشمل الإحكام والتمام في كل شيء،
            لا في المحسوسات فحسب، مما يدعم استخدام نضج للنضج الإنساني العام.

    - lemma: "بُلُوغ"
      confirm:
        - text: "«نُضْجُ الوظائف التناسلية»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
      contradicts:
        - text: >
            «البُلُوغ: في اللغة: الوصول، وفي الشرع: انتهاء حد الصغر في الإنسان ليحكم
            عليه الشارع بالتكاليف الشرعية»
          source: "التعريفات الفقهية للبركتي (ت 1975 م)"
          conflict: >
            البلوغ في الاستعمال الفقهي والطبي محدود بالنضج الجنسي-البيولوجي (puberty)
            لا بمفهوم النضج العام الشامل (maturity/matureness) الذي تُغطّيه هذه المجموعة.
        - text: "«pubertas (puberty)» — ترجمة البلوغ"
          source: "المعجم الطبي الموحد (2009) — ALECSO"
          conflict: >
            ترجمة البلوغ في المعجم الطبي هي puberty لا maturity، مما يؤكد تخصّصه في
            النضج الجنسي البيولوجي.

    - lemma: "رُشْد"
      contradicts:
        - text: >
            «(رَشَدَ) الرَّاءُ وَالشِّينُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى
            اسْتِقَامَةِ الطَّرِيقِ. فَالْمَرَاشِدُ: مَقَاصِدُ الطُّرُقِ.
            وَالرُّشْدُ وَالرَّشَدُ: خِلَافُ الْغَيِّ.»
          source: "مقاييس اللغة لابن فارس (ت 395 هـ)"
          conflict: >
            الأصل الدلالي لرشد هو استقامة الطريق وخلاف الغي (ضلال)، وهو يختلف
            اختلافاً جوهرياً عن مفهوم النضج التطوّري/العضوي الذي تُعبّر عنه هذه المجموعة.
        - text: >
            «الرُّشْدُ: نَقِيضُ الغَىِّ، ويُستعمل فى كل ما يُحْمَد وقيل: الرُّشْدُ
            يكون فى الأمور الدُّنْيوِيَّة والأُخْرَوِيَّة»
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: >
            الرشد يُشير إلى الصلاح والهداية الدينية والأخلاقية لا إلى حالة النضج كمرحلة نمو.
      expands:
        - text: >
            «(الرشد) (عِنْد الْفُقَهَاء) أَن يبلغ الصَّبِي حد التَّكْلِيف صَالحا فِي
            دينه مصلحا لمَاله و(فِي القانون) السن الَّتِي إِذا بلغَهَا الْمَرْء اسْتَقل
            بتصرفاته»
          source: "المعجم الوسيط لمجموعة من المؤلفين (ت 1998 م)"
          addition: >
            في الاستعمال القانوني الحديث يُستعمل الرشد للدلالة على بلوغ سن الرشد القانوني،
            مما يُقرّبه من مفهوم النضج، غير أنه قاصر على الجانب القانوني دون سواه.

    - lemma: "إِينَاع"
      expands:
        - text: "«نُضْج، إيناع» — ترجمة: maturity"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — ALECSO"
          addition: >
            إيناع يُدرج في المعجم البيطري مقروناً بنضج كترجمة بديلة لـ maturity،
            مما يُثبت استعماله المصطلحي التخصصي في هذا المجال.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "اكتمال"
      decision: confirmed
      decision_reason: >
        اكتمال مصدر صحيح من Form VIII (جذر كمل)، وهو من الكلمات العربية الفصيحة الجارية
        في الكتابة الرسمية والعلمية المعاصرة، ويُعبّر عن «حالة بلوغ التمام» بدقة.
        غيابه من قاعدة البيانات المعجمية لا يعني عدم صحته، بل يعني أنه لم يُفرد له مدخل
        مستقل. يلزم إضافة التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على جانب الاكتمال البنيوي والتركيبي — أي تكامل العناصر والأجزاء؛ يُستعمل
        في سياقات الإنجاز والاكتمال التام (اكتمال المشروع، اكتمال التطور)، ولا يحمل
        الإيحاء العضوي-الحيوي الذي يحمله نضج.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِكْتِمَال"

    - lemma: "نضج"
      decision: confirmed
      decision_reason: >
        نضج المصطلح العربي الأصيل والأكثر توثيقاً في المعجمية العربية الكلاسيكية والمعاصرة
        لمفهوم maturity. وثّقه ابن فارس بأنه «يدل على بلوغ النهاية في طبخ الشيء، ثم يستعار
        في كل شيء بلغ مدى الإحكام»، كما ترجمته معاجم ALECSO المتخصصة في مجالات الأحياء
        والأغذية والقانون. يلزم إضافة التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على العملية العضوية-التطورية في بلوغ الذروة — الإحكام الناشئ عن نضج تدريجي
        طبيعي (كنضج الثمر)، مع امتداد مجازي راسخ نحو النضج الفكري والإنساني (نضيج الرأي)؛
        وهو الأكثر شيوعاً وتخصصاً في المجالات العلمية للتعبير عن maturity.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُضْج"

    - lemma: "نُضْج"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح متطابق مع اللمّة الموجودة (نضج)؛ لا حاجة لإنشاء مدخل جديد.

    - lemma: "بُلُوغ"
      source: stage1
      decision: removed
      decision_reason: >
        بلوغ مقيّد في المعجمين الكلاسيكي والحديث بالنضج الجنسي البيولوجي (puberty)؛
        المعجم الطبي الموحد يترجمه بـ pubertas/puberty لا maturity. إدراجه في مجموعة
        النضج العام يُفضي إلى اشتراك لفظي مُلبس.

    - lemma: "رُشْد"
      source: stage1
      decision: removed
      decision_reason: >
        الأصل الدلالي لرشد عند ابن فارس هو «استقامة الطريق وخلاف الغي» — أي النضج
        الأخلاقي والديني والعقلي، لا مفهوم النضج التطوّري الشامل. إدراجه يُعرّض المجموعة
        للتضمين الخاطئ في الحقل الديني-القانوني.

    - lemma: "إِينَاع"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود «نُضْج، إيناع» في المعجم البيطري ترجمةً لـ maturity، فإن إيناع لا يَرِد
        مدخلاً مستقلاً في أي معجم من قاعدة البيانات، وهو مقيّد بسياق نضوج الثمار (ثمر يانع).
        اشتراطه هنا دون تعريف معجمي مستقل يُثقل المجموعة بمصطلح غير راسخ استقلالياً.


