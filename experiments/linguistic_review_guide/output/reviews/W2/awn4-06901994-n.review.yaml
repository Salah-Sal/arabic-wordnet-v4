          conflict: "الدلالة الأصلية لمَعلَم هي العلامة الدالة على الشيء أو مظنّته، لا الشيء المرئي ذاته"
        - text: "«الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى أَثَرٍ بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر علم يدل على الأثر والسمة المميِّزة التي يتعرف بها على الشيء، لا على فعل الرؤية"
      expands:
        - text: "يُستخدم مَعلَم في عربترم بمعانٍ تقنية متعددة: landmark (طبي)، marker (رياضيات ونفط)، parameter (صيدلة ومياه وبيطري)، markup وtag (تقنية معلومات)، curbstone (نقل)"
          source: "مصطلحات موحدة — عربترم (مصادر متعددة)"
          addition: "يكشف تعدد دلالات مَعلَم التقنية أن اللمة استُخدمت في العربية المعاصرة لتغطية مفاهيم التمييز والتأشير والتحديد، مما يؤكد طابعها التمييزي لا البصري المحض"

    - lemma: "مِرْأَى"
      evidence_status: "no_material_found"

    - lemma: "مَنْظَر"
      confirm:
        - text: "«النَّظَر ما يُنْظَر إليه فيُعْجِب المَرْقَبَة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«النّظر وَمَا ينظر إِلَيْهِ فيعجب وَيُقَال هُوَ فِي منظر ومستمع فِيمَا يحب أَن ينظر ويستمع إِلَيْهِ والمرقبة»"
          source: "المعجم الوسيط (حوراماني)"
