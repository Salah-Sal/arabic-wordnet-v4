# مراجعة المجموعة الترادفية — awn4-06901994-n
# sight / أي شيء يُرى
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف «أي شيء يُرى» في غاية الاتساع ومفتقر إلى الجنس القريب والفصل النوعي؛ لا يُميّز هذه المجموعة عن المفاهيم المجاورة (الرؤية، البصر، المشهد الدرامي)"
      - "لمة مَعلَم دلالتها الأصلية «العلامة ومَظِنَّة الشيء» (landmark/sign)، لا «أي شيء يُرى» — وهو تخصيص قد لا يُوافق عموم تعريف المجموعة"
      - "كلتا اللمتين الموجودتين (مشهد / مَعلَم) مفتقرتان إلى التشكيل الكامل"
      - "الفرق الدلالي بين مشهد ومَعلَم غير موثَّق في ملف المجموعة"
    observations: "المجموعة تعبّر عن مفهوم إدراكي بصري بسيط («أي شيء يُرى»)، وهو من أوسع المفاهيم الحسية وأكثرها شمولاً. مشهد هو أنسب اللمتين الموجودتين للمفهوم، إذ يرد في المعاجم بصريح المعنى «ما يشاهَد». أما مَعلَم فيدل بالأصل على العلامة والسمة المميِّزة للشيء (مظنته)، ويُستعمل في «معالم المدينة» = مواطنها البارزة التي تُعرَّف بها؛ وهو مفهوم أضيق من «أي شيء يُرى». كلتا اللمتين مقبولتان في المجموعة لكن مع تحديد الفوارق الدلالية."
  blind_candidates:
    - lemma: "مِرْأَى"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر رأى على وزن مِفْعَل الدال على المحل أو ما يُستخدم في الفعل؛ ومِرْأَى يعني موضع الرؤية وما يقع في مجال البصر، يصح قياساً لـ«أي شيء يُرى»."
    - lemma: "مَنْظَر"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر نظر على وزن مَفْعَل (موضع النظر ومحله)؛ مَنْظَر يعني ما يُنظر إليه، وهو مرادف طبيعي لـ«أي شيء يُرى» في سياق المشاهد والمناظر الطبيعية والبصرية."
    - lemma: "طَلْعَة"
      generation_method: majaz
      justification: "مجاز من الجذر طلع (ما طلع وظهر للعيان)؛ الطَّلْعَة تدل على الهيئة الظاهرة والشخص الذي يبدو للعين، وقد ورد في المعجم الكبير «الرُّؤيةُ والشَّخصُ»، فاستخدمتها مجازاً لـ«الشيء المرئي»."
    - lemma: "مَبْصَر"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر بصر على وزن مَفْعَل؛ قياساً يمكن أن يدل على «ما يُبصَر» (المفعول البصري)، وهو مقبول صرفياً على اعتبار أن الصيغة تحتمل فاعل الرؤية ومفعولها."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مشهد"
      confirm:
        - text: "«ما يشاهَد»"
          source: "المعجم الوسيط (OCR)"
        - text: "«المُجْتَمَعُ من النَّاسِ. ما يُشاهَدُ. الضَّريحُ. (محدثة) (فى الفن): مَنْظَرٌ واحِدٌ مِنْ مَسْرحيّة أو أغنية مُصَوَّرة أو فيلم سينمائى.»"
          source: "المعجم الكبير (OCR)"
        - text: "«أداء أو عرض بارز.» — translation_en: spectacle"
          source: "مسرد الإعلام والتواصل (عربترم)"
        - text: "«(1) «أ» مَشْهَد. «ب» مَعْلَم؛ شيء جدير بالمشاهدة the sights of the city»"
          source: "المورد الحديث (2008) — مدخل: sight"
      expands:
        - text: "«الشِّينُ وَالْهَاءُ وَالدَّالُ أَصْلٌ يَدُلُّ عَلَى حُضُورٍ وَعِلْمٍ وَإِعْلَامٍ، لَا يَخْرُجُ شَيْءٌ مِنْ فُرُوعِهِ عَنِ الَّذِي ذَكَرْنَاهُ. وَالْمَشْهَدُ: مَحْضَرُ النَّاسِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يربط ابن فارس المشهد بأصل الحضور والإعلام والعلم، مما يؤكد أن المشهد هو ما يُحضَر ويُشاهَد ويُعلَم."

    - lemma: "مَعلَم"
