stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'شخصية تناسلية' تفتقر إلى التشكيل الكامل."
      - "ندرة وجود المصطلح كتركيب ثابت في المعاجم العامة، وهو أمر متوقع لكونه مصطلحاً تقنياً في علم النفس."
    observations: "المصطلح يمثل المرحلة الأخيرة من التطور النفسي الجنسي في نظرية فرويد، حيث يصل الفرد إلى نضج الشخصية. التعاريف المتوفرة للمكونات (شخصية وتناسلية) تدعم التركيب الدلالي."
  blind_candidates:
    - lemma: "شَخْصِيَّة تَنَاسُلِيَّة"
      generation_method: tarkib
      justification: "الترجمة الاصطلاحية المباشرة للمصطلح الإنجليزي 'genital personality' في أدبيات التحليل النفسي."
    - lemma: "شَخْصِيَّة نَاضِجَة"
      generation_method: majaz
      justification: "وصف مستمد من تعريف المجموعة الذي يشير إلى 'الشخصية الناضجة'."
    - lemma: "شَخْصِيَّة بَالِغَة"
      generation_method: majaz
      justification: "مرادف وصفي للشخصية التي تجاوزت الدوافع الطفولية."
    - lemma: "نَفْسِيَّة تَنَاسُلِيَّة"
      generation_method: tarkib
      justification: "صيغة بديلة تستخدم أحياناً للإشارة إلى البنية النفسية المرتبطة بالمرحلة التناسلية."

stage2_evidence:
  per_lemma:
    - lemma: "شخصية تناسلية"
      evidence_status: "no_material_found"
    - lemma: "شَخْصِيَّة"
      confirm:
        - text: "«صِفَات تميز الشَّخْص من غَيره وَيُقَال فلَان ذُو شخصية قَوِيَّة ذُو صِفَات متميزة وَإِرَادَة وكيان مُسْتَقل (محدثة)»"
          source: "المعجم الوسيط"
    - lemma: "تَنَاسُلِيّ"
      confirm:
        - text: "«صفة لما يتعلق بالتناسل أو الأعضاء التناسلية .»"
          source: "معجم المصطلحات الطبية"
    - lemma: "المَرْحَلَةُ التَّناسُلِيَّة"
      confirm:
        - text: "«genital stage»"
          source: "المعجم الطبي الموحد"
    - lemma: "خاصَّةٌ تَناسُلِيَّة"
      confirm:
        - text: "«genital character»"
          source: "المعجم الطبي الموحد"
      expands:
        - text: "«تستخدم للإشارة إلى الخصائص النفسية المرتبطة بالنضج الجنسي في التحليل النفسي.»"
          source: "المراجعة اللغوية"

stage3_analysis:
  per_lemma:
    - lemma: "شخصية تناسلية"
      decision: confirmed
      decision_reason: "المصطلح هو الترجمة المعيارية في علم النفس للـ 'genital personality' التي تمثل نضج الشخصية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَخْصِيَّة تَنَاسُلِيَّة"
    - lemma: "خُلُق تَنَاسُلِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف تقني شائع جداً في ترجمات أعمال فرويد للعربية (genital character)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "خُلُق تَنَاسُلِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04626777-n"}
    - lemma: "خاصَّة تَنَاسُلِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح موثق في المعجم الطبي الموحد كترجمة لـ 'genital character'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "خاصَّة تَنَاسُلِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04626777-n"}

stage4_content:
  definition:
    current: "(التحليل النفسي) الشخصية الناضجة التي لا تسيطر عليها دوافع المتعة الطفولية"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً ويحدد المجال (التحليل النفسي) بوضوح."
  examples:
    per_lemma:
      - lemma: "شَخْصِيَّة تَنَاسُلِيَّة"
        examples:
          - text: "تعتبر الشخصية التناسلية غاية التطور النفسي الجنسي عند فرويد."
            type: usage
      - lemma: "خُلُق تَنَاسُلِيّ"
        examples:
          - text: "يتميز صاحب الخلق التناسلي بالقدرة على الحب والعمل المنتج دون صراعات طفولية."
            type: usage
      - lemma: "خاصَّة تَنَاسُلِيَّة"
        examples:
          - text: "تعد القدرة على الإشباع المتبادل أهم خاصة تناسلية في الشخصية الناضجة."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعرّف المحلل النفسي الشخصية التناسلية بأنها تلك التي بلغت مرحلة النضج العاطفي."}

stage5_enrichment:
  per_entry:
    - lemma: "شَخْصِيَّة تَنَاسُلِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "شخصية"
          root: "شخص"
          maqayis_quote: "«الشِّينُ وَالْخَاءُ وَالصَّادُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي شَيْءٍ. مِنْ ذَلِكَ الشَّخْصُ، وَهُوَ سَوَادُ الْإِنْسَانِ إِذَا سَمَا لَكَ مِنْ بُعْدٍ.»"
        - word: "تناسلية"
          root: "نسل"
          maqayis_quote: "«النُّونُ وَالسِّينُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَلِّ شَيْءٍ وَانْسِلَالِهِ. وَالنَّسْلُ: الْوَلَدُ. لِأَنَّهُ يُنْسَلُ مِنْ وَالِدَتِهِ.»"
    - lemma: "خُلُق تَنَاسُلِيّ"
      entry_id: "{auto}"
      roots:
        - word: "خلق"
          root: "خلق"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا تَقْدِيرُ الشَّيْءِ، وَالْآخَرُ مَلَاسَةُ الشَّيْءِ. وَمِنْ ذَلِكَ الْخُلُقِ، وَهِيَ السَّجِيَّةُ، لِأَنَّ صَاحِبَهُ قَدْ قُدِّرُ عَلَيْهِ.»"
        - word: "تناسلي"
          root: "نسل"
          maqayis_quote: "«النُّونُ وَالسِّينُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَلِّ شَيْءٍ وَانْسِلَالِهِ. وَالنَّسْلُ: الْوَلَدُ.»"
  per_sense:
