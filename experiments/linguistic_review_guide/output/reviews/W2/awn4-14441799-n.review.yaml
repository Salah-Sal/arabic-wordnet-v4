# مراجعة المجموعة الترادفية — Review Pipeline v2 (5-Stage)
# synset_id: awn4-14441799-n
# ili: i112776 | pos: n
# definition_en: the state of being joined or united or linked


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائري: يستخدم كلمة «اتحاد» في تعريف المجموعة التي تضم «اتحاد» بوصفه لمّة أساسية"
      - "لمّة «توحيد» تدل في المعجمية العربية على الفعل/المصدر الدال على العملية (جعل الشيء واحداً)، لا على الحالة (كون الشيء واحداً)، وهذا لا يتوافق مع تعريف المجموعة «حالة الانضمام أو الاتحاد أو الارتباط»"
      - "التشكيل مفقود للمّتَيْن الموجودتَيْن (اتحاد، توحيد)"
    observations: "المجموعة تصف حالةً وجودية جامعة (state of being joined/united/linked)، يُعبَّر عنها بالعربية تعبيراً طبيعياً بـ«اتحاد» في سياقاتها الجامعة. أما «توحيد» فمصطلح اللاهوت والإفراد الإلهي أولاً، والمصدر الدال على عملية الجمع ثانياً، لا على الحالة الناتجة. الجذر المشترك «وحد» يدل في مقاييس اللغة على الانفراد، وقد امتدّ دلالياً إلى مفهوم الاتحاد بين عناصر متعددة عبر form VIII (اتَّحَدَ)."

  blind_candidates:
    - lemma: "وِحْدَةٌ"
      generation_method: ishtiqaq
      justification: "من الجذر «وحد» على وزن فِعْلَة، يدل على حالة الكون واحداً أو متّحداً؛ مصطلح مسكوك في العربية المعاصرة بمعنى unity، يتداوله المعجم الوسيط في السياق السياسي."
    - lemma: "اِقْتِرَانٌ"
      generation_method: ishtiqaq
      justification: "من الجذر «قرن» على وزن افتعال، يدل على حالة اجتماع شيئين أو ارتباطهما؛ مصطلح مسكوك يستخدم في الرياضيات والمنطق بمعنى conjunction/association."
    - lemma: "ائْتِلَافٌ"
      generation_method: ishtiqaq
      justification: "من الجذر «ألف» على وزن افتعال، يدل على حالة تآلف أطراف متعددة في وحدة؛ مصطلح مستعمل في السياسة والاجتماع بمعنى coalition/harmony."
    - lemma: "تَلَاحُمٌ"
      generation_method: ishtiqaq
      justification: "من الجذر «لحم» على وزن تفاعل، يدل على حالة التصاق وثيق وارتباط عضوي بين عناصر؛ مستخدم في الفيزياء والاجتماع بمعنى cohesion/integration."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة: ٤ استعلامات (batch headword OCR/Hawramani + enrichment + English bridge + Maqayis)
stage2_evidence:
  per_lemma:

    - lemma: "اتحاد"
      confirm:
        - text: "«الاتحاد: هو تصيير الذاتين واحدة، ولا يكون إلا في العدد من الاثنين فصاعدًا»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الاتحاد: جعل الشيئين واحدا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الاتّحاد: [Union / fusion] المفهوم الحقيقي للاتحاد هو أن يصير شيء بعينه شيئا آخر [...] وإمّا صيرورة شيء شيئا آخر بطريق التركيب وهو أن ينضمّ شيء إلى ثان فيحصل منهما شيء ثالث»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«إتحاد، التئام» = union"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«اتحاد، نِقابة» = union"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«اتحاد» = union (Biology)"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"

    - lemma: "توحيد"
      contradicts:
        - text: "«التَّوْحِيدُ: الإِيمان بالله تعالى وحده لا شريك له»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأول للتوحيد لاهوتي (monotheism)، لا علاقة له بحالة الانضمام أو الاتحاد العام"
        - text: "«التوحيد: في اللغة: الحكم بأن الشيء واحد، والعلم بأنه واحد»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "التوحيد اللغوي هو الحكم بالوحدة أو العلم بها (فعل ذهني)، لا حالة انضمام أطراف خارجية"
        - text: "«التوحيد لغةً: الحكم بأن الشيء واحد والعلمُ بأنه واحد»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "يؤكد أن التوحيد فعل/حكم لا حالة وجودية"
      expands:
        - text: "«(1) توحيد (2) اتِّحاد» = unification"
          source: "المورد الحديث (2008)"
          addition: "المورد الحديث يُدرج «توحيد» بوصفه مقابلاً لـunification، يكشف الاستخدام المعاصر في السياق السياسي (كـ«توحيد ألمانيا»)"

    - lemma: "وِحْدَة"
      confirm:
        - text: "«(في النظام السياسي): اتِّحَاد أُمتين أَو أَكثر في الرياسة والسياسة والجيش والاقتصاد، بموجبها يكُنَّ أُمة واحدة»"
          source: "المعجم الوسيط"
        - text: "«(1) وحدة (2) انسجام؛ اتِّفاق (3) العدد واحد» = unity"
          source: "المورد الحديث (2008)"
        - text: "«وحدة» = unity"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
      contradicts:
        - text: "«الْوَاوُ وَالْحَاءُ وَالدَّالُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل اللغوي لوحد هو الانفراد لا الاتحاد؛ وَحْدَة في الأصل تعني الانفراد والوحشة، وليس الاندماج مع الآخر"

    - lemma: "اِقْتِرَان"
      contradicts:
        - text: "«الاقتران: عند المنطقيين هو القرينة في الإشارات تأليف الصغرى والكبرى يسمّى اقترانا»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الاقتران مصطلح منطقي متخصص (القياس الاقتراني/syllogism) لا يدل على الحالة العامة للانضمام"
      expands:
        - text: "«الاقتران: كالازدواج في كونه اجتماع شيئين أو أشياء في معنى من المعاني»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف المناوي يُقارب الاجتماع لكنه يُقرنه بالازدواج والمقارنة، ويفتقر إلى دلالة الاندماج في كيان واحد"

    - lemma: "ائْتِلَاف"
      contradicts:
        - text: "«الايتلاف: عند عُلَمَاء البديع هُوَ مُرَاعَاة النظير»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "الائتلاف في الاصطلاح الكلاسيكي مصطلح بلاغي-بديعي لا يدل على حالة الانضمام العام"
        - text: "«الايتلاف: [Harmony، equilibrium] عند أهل البديع هو التناسب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الائتلاف يدل على التناسب الجمالي والانسجام، لا على الاندماج والاتحاد في كيان مشترك"

    - lemma: "تَلَاحُم"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "اتحاد"
      decision: confirmed
      decision_reason: "اللمّة راسخة في المعجمية العربية بمعنى حالة الاتحاد والانضمام؛ تؤكدها مصادر كلاسيكية (الجرجاني، المناوي، التهانوي) ومعاجم تقنية حديثة متعددة المجالات. تعريف الجرجاني «تصيير الذاتين واحدة» يطابق مفهوم المجموعة مباشرة. الجذر وحد (form VIII: اتَّحَدَ) يحمل معنى مطاوعاً دالاً على النتيجة/الحالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الأساسية في المجموعة؛ تدل على حالة كون عنصرين أو أكثر قد انضمّا في كيان واحد، مع إيحاء بأن الأطراف كانت منفصلة قبل الاتحاد (form VIII يتضمن معنى المطاوعة والحدوث)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِتِّحَاد"

    - lemma: "توحيد"
      decision: removed
      decision_reason: "توحيد مصدر المزيد (form II: وَحَّدَ يُوَحِّدُ تَوْحِيدًا) يدل على فعل جعل الشيء واحداً (العملية/الفعل التعدّي)، لا على حالة الاتحاد (النتيجة الوجودية). تعريف المعاجم الكلاسيكية «جعل الشيء واحداً» / «الحكم بأن الشيء واحد» يؤكد دلالة الفعل لا الحالة. المعنى الأول في المعاجم ديني-لاهوتي (monotheism). المجموعة تصف «حالة» (state)، لا «عملية توحيد» (act of unification). توحيد مرشّح لمجموعة مختلفة تدل على عملية التوحيد."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وِحْدَة"
      source: stage1
      decision: removed
      decision_reason: "وِحْدَة في المعجمية العربية تحمل دلالة الانفراد والوحشة أولاً (أصل الجذر في مقاييس اللغة: «يدل على الانفراد»). استخدامها بمعنى unity محصور بالسياق السياسي والمعاصر، وهو أضيق من الدلالة العامة للمجموعة (state of being joined/linked). لا تصلح لمّةً لعموم حالة الانضمام والارتباط."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "اِقْتِرَان"
      source: stage1
      decision: removed
      decision_reason: "الاقتران مصطلح منطقي متخصص (القياس الاقتراني/المقطعي في المنطق). تعريف التهانوي يقصره على المعنى المنطقي، وتعريف المناوي يقرّبه من الازدواج لا الاتحاد في كيان واحد. لا يصلح للدلالة العامة على «حالة الانضمام»."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "ائْتِلَاف"
      source: stage1
      decision: removed
      decision_reason: "الائتلاف مصطلح بلاغي-بديعي (التناسب في علم البديع). استخدامه المعاصر في السياسة (حكومة ائتلافية) يدل على تحالف ظرفي مؤقت لا على حالة اندماج ثابتة. دلالته على الانسجام والتناسب لا تطابق «حالة الانضمام» في المجموعة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَلَاحُم"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على شواهد معجمية. التلاحم يدل على الالتصاق القوي والتضامن (cohesion/solidarity)، وهو أضيق وأشد من دلالة «حالة الانضمام أو الارتباط» العامة في المجموعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


