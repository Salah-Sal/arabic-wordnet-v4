      decision_reason: "اللمّة مؤصّلة بجذر ركد الذي أثبت ابن فارس أنه «أصل يدل على سكون». القاموس المحيط يُساوي صراحةً بين الركود والسكون («الرُّكودُ: السُّكونُ والثَّبات»). يُستعمل في المعجم الطبي الموحد بمعنى stasis (ركود الدم). غلبة الاستخدام الاقتصادي في العربية المعاصرة لا تنفي الأصالة الكلاسيكية ومساغ الاستعمال التقني الطبي والعلمي. يستوفي بوابة الجودة: تراث عربي أصيل، اشتقاقية صرفية قياسية، ملاءمة الوزن، يُسر التداول."
