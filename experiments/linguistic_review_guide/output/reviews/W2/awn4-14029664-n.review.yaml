          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر اشتقاقياً يدل على سكون الحركة، لكن الاسم الجامد خُمُود تخصّص بمعنى حفرة الإطفاء في المعاجم الحديثة ثم انتقل إلى معنى الـdamping الفيزيائي"

    - lemma: "ثُبُوت"
