          source: "المعجم الوسيط"
          conflict: "الاسم «خُمُود» متخصص في المعاجم الحديثة الموثوقة بمعنى حفرة إطفاء النار لا بمعنى حالة انعدام الحركة"
        - text: "«(الخمود) حُفْرَة تدفن فِيهَا النَّار لتخمد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "تأكيد معنى الحفرة"
        - text: "«خمود» [= damping, تخميد]"
