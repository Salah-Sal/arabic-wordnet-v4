# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «انعدام الحركة» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ تفشل في اختبار السكّ إذ يمكن إحلال «الصوت» أو «الضوء» محل «الحركة» مع بقاء التركيب النحوي صالحاً وصفاً"
      - "التعريف الحالي «حالة عدم وجود حركة» يكاد يُعيد صياغة «انعدام الحركة» بعينها مضيفاً حشواً (عدم وجود)، فيُوقع في الدوران مع إحدى اللمّات"
      - "غياب التشكيل الكامل عن جميع اللمّات الموجودة الثلاث"
      - "صياغة «عدم وجود» في التعريف ركيكة أسلوبياً؛ الأنسب «انعدام» أو «غياب» وفق أسلوب المعجم الوسيط"
    observations: "المفهوم أصيل في الفلسفة الكلامية والطبيعيات العربية؛ أفرد له المتكلمون والحكماء نقاشاً مستفيضاً حول تقابل السكون والحركة. أدق مدخل للمفهوم هو «السكون» الذي يُثبت ابن فارس أن جذره «يدل على خلاف الاضطراب والحركة». لمّة «جمود» تحمل ظلال التصلب والانجماد وتُفيد انعدام الحركة الكلي، غير أنها تحمل كذلك استخدامات نفسية وأخلاقية جانبية. أما «انعدام الحركة» فلا ترقى إلى مستوى المصطلح المسكوك."
  blind_candidates:
    - lemma: "رُكُود"
      generation_method: majaz
      justification: "مجاز من ركد الماء والريح والقوم بمعنى سكن وهدأ؛ أصل يدل على السكون كما أثبت ابن فارس (ركد الماء سكن، ركد القوم سكنوا وهدؤوا). نُقلت الدلالة من السكون الحسي للسوائل والهواء إلى حالة انعدام الحركة عموماً"
    - lemma: "خُمُود"
      generation_method: ishtiqaq
      justification: "مشتق من خمد على وزن فُعُول. في مقاييس اللغة: الخاء والميم والدال «يدل على سكون الحركة والسقوط»، وخمدت النار خمودًا إذا سكن لهبها — توقف حركة اللهب كلياً"
    - lemma: "جُمُود"
      generation_method: ishtiqaq
      justification: "مشتق من جمد على وزن فُعُول؛ أصل الفعل تجمد الشيء المائع أي توقف جريانه وحركته. يُفيد انعدام الحركة مع إيحاء إضافي بالتصلب والثبات الكامل"
    - lemma: "ثُبُوت"
      generation_method: ishtiqaq
      justification: "مشتق من ثبت على وزن فُعُول، يدل على الرسوخ والقرار في المكان وعدم الانتقال منه، وهو قريب مفهومياً من السكون وانعدام الحركة"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "سكون"
      confirm:
        - text: "«السكونُ: عدم الْحَرَكَة فِيمَا من شَأْنه أَن يَتَحَرَّك»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«السكون: عدم الحركة عما من شأنه أن يتحرك فعدم الحركة عما ليس من شأنه الحركة لا يكون سكونا، فالموصوف بهذا لا يكون متحركا ولا ساكنا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«السكون: هو عدم الحركة عما من شأنه أن يتحرك، فعدم الحركة عما ليس من شأنه الحركة لا يكون سكونًا»"
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: "«السّكُون: عِنْد الْحُكَمَاء عدم الْحَرَكَة عَمَّا من شَأْنه أَن يَتَحَرَّك... والتقابل بَينهمَا تقَابل الْعَدَم والملكة. وَعند الْمُتَكَلِّمين السّكُون هُوَ الِاسْتِقْرَار زَمَانا فِيمَا يَقع فِيهِ الْحَرَكَة فالتقابل بَينهمَا تقَابل التضاد»"
          source: "دستور العلماء للأحمدنكري"
          addition: "الفلاسفة يُحددون تقابل السكون والحركة بأنه تقابل عدم وملكة (السكون غياب الحركة عما من شأنه التحرك)، والمتكلمون يجعلونه تقابل تضاد. كلا التحديدين يُرسّخ السكون مصطلحاً فلسفياً دقيقاً لانعدام الحركة"

    - lemma: "جمود"
      confirm:
        - text: "«الجمود: علة إذا عرضت للإنسان بقي على الحالة التي أدركته عليها إما جالسا أو قائما، كذا في بحر الجواهر»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«الجمود: هيئة حاصلة للنفس بها يقتصر عن استيفاء ما ينبغي وما لا ينبغي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "هذا تعريف أخلاقي نفسي للجمود (عدم الاعتدال في التصرف) لا يتصل بانعدام الحركة الجسدية"
        - text: "«الجمود: هو هيئة حاصلة للنفس بها يقتصر على استيفائها ما ينبغي وما لا ينبغي»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "التعريف النفسي الأخلاقي ذاته — يعكس استخداماً مجازياً جانبياً لا المعنى الفيزيائي المقصود"
      expands:
        - text: "«(جَمَدَ) الْجِيمُ وَالْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ، وَهُوَ جُمُودُ الشَّيْءِ الْمَائِعِ مِنْ بَرَدٍ أَوْ غَيْرِهِ. يُقَالُ: جَمَدَ الْمَاءُ يَجْمُدُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يربط الجمود بتوقف حركة المائع بالتجمد؛ وهو ما يُرسّخ استعمال «الجمود» في الدلالة على توقف الحركة الكلي وانعدامها"

    - lemma: "انعدام الحركة"
      confirm:
        - text: "«عَدْمُ الحَرَكَة» [مدخل مستقل في المعجم الطبي]"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«حُمَّى انعدام الحركة (حُمَّى وهنية)» [مصطلح طبي مركب]"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«اللَّصَب: احتكاك بين جزءين يؤدِّي إلى انعدام الحركة»"
          source: "المورد الحديث (2008)"
          addition: "يُستخدم التعبير «انعدام الحركة» في المعاجم التقنية الحديثة صفةً توضيحية داخل التعريفات لا مصطلحاً مسكوكاً قائماً بذاته"

    - lemma: "رُكُود"
      confirm:
        - text: "«الرُّكودُ: السُّكونُ، والثَّباتُ. وكقَبولٍ: الناقةُ يَدومُ لَبَنُها ولا يَنْقَطِعُ، والجَفْنَةُ المَلْأى. ورَكَدَ المِيزانُ: اسْتَوَى»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(رَكَدَ) الرَّاءُ وَالْكَافُ وَالدَّالُ أَصْلٌ يَدُلُّ عَلَى سُكُونٍ. يُقَالُ رَكَدَ الْمَاءُ: سَكَنَ. وَرَكَدَتِ الرِّيحُ. وَرَكَدَ الْمِيزَانُ: اسْتَوَى. وَرَكَدَ الْقَوْمُ رُكُودًا: سَكَنُوا وَهَدَءُوا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«رُكود» [= stasis]"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«ركود» [= stagnation, في السياق الاقتصادي]"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "الاستخدام الاقتصادي الحديث (الركود الاقتصادي) يُضيّق الدلالة في الخطاب المعاصر على السياق الاقتصادي، مما قد يُوقع في لبس عند الاستخدام العام"

    - lemma: "خُمُود"
      contradicts:
