      nuance_differentiation: "يُضيف إلى انعدام الحركة ظلال التصلب والتجمد الكامل؛ يُستخدم للثبات الجسدي التام وللجمود النفسي والاجتماعي. أشد من سكون في الإيحاء بعدم قابلية الحركة لا مجرد توقفها."
