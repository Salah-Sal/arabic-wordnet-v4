stage1_review:
  candidates:
    - lemma: مُرُور
      generation_method: ishtiqaq
      justification: اشتقاق من الجذر (م ر ر) للدلالة على حركة الذهاب والمجيء، ويطلق المعاصرون كلمة المرور على حركة السيارات والمشاة.
    - lemma: حَرَكَة السَّيْر
      generation_method: tarkib
      justification: تركيب إضافي شائع في الاستعمال المعاصر لوصف تدفق المركبات والمشاة في الطرق.
    - lemma: حَرَكَة المُرُور
      generation_method: tarkib
      justification: تركيب إضافي وهو المصطلح الأكثر رسمية وشيوعاً للتعبير عن هذا المفهوم.
    - lemma: سَيْر
      generation_method: ishtiqaq
      justification: مصدر من (س ي ر) يدل على الحركة والانتقال، ويستخدم بكثرة في القوانين والأنظمة المتعلقة بالمركبات (مثل: قانون السير، شرطة السير).
  concerns:
    - التعريف الحالي ركيك قليلاً ومترجم حرفياً من الإنجليزية ("تجمع الأشياء")، والأفضل استبداله بـ "حركة" أو "تدفق".
  observations:
    - اللمة الحالية "حركة المرور" صحيحة ودقيقة، لكنها تحتاج إلى التشكيل الكامل.
    - توجد مرادفات أخرى شائعة جداً تستحق الإضافة مثل "حركة السير" و"مرور" و"سير".

stage2_evidence:
  - lemma: حَرَكَة المُرُور
    evidence:
      - text: "«نقل الموضوعات (مثال، بضائع أفراد، أخبار) في نظام معروف (مرور). وفي الانكليزية يستخدم معنى هذا المصطلح 'مرور'.»"
        source: المعجم الموحد لمصطلحات النقل (2010)
        classification: confirm
  - lemma: حَرَكَة السَّيْر
    evidence:
      - text: "لا يوجد نص معجمي مباشر لهذا المركب، لكنه شائع في الاستعمال القياسي المعاصر."
        source: null
        classification: no_material_found
  - lemma: مُرُور
    evidence:
      - text: "«المرور: المضي والاجتياز بالشيء.»"
        source: التوقيف على مهمات التعاريف للمناوي
        classification: expands
  - lemma: سَيْر
    evidence:
      - text: "«قانون السَّيْر: قواعد المرور.»"
        source: معجم اللغة العربية المعاصرة لأحمد مختار عمر
        classification: confirm

