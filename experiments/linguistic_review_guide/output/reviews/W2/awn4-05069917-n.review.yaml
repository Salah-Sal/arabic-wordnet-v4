              تُدرَسُ الحيِّزيَّةُ في الفلسفة بوصفها من الصفات الجوهرية
              للأجسام المادية الممتدة في المكان
            type: usage

      - lemma: "خَاصِّيَّة مَكَانِيَّة"
        examples:
