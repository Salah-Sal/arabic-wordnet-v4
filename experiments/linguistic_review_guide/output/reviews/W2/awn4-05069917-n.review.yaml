# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
stage5_enrichment:
  per_entry:
    # مدخل مفرد: حَيِّزِيَّة
    - lemma: "حَيِّزِيَّة"
      entry_id: "{auto}"
      root: "حوز"
      maqayis_quote: >
        «الْحَاءُ وَالْوَاوُ وَالزَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْجَمْعُ وَالتَّجَمُّعُ،
        يُقَالُ لِكُلِّ مَجْمَعٍ وَنَاحِيَةٍ حَوْزٌ وَحَوْزَةٌ»

    # مدخل مركّب (MWE): خَاصِّيَّة مَكَانِيَّة
    - lemma: "خَاصِّيَّة مَكَانِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "خاصية"
          root: "خصص"
          maqayis_quote: >
            «الْخَاءُ وَالصَّادُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ، وَهُوَ يَدُلُّ عَلَى الْفُرْجَةِ
            وَالثُّلْمَةِ... وَمِنَ الْبَابِ خَصَصْتُ فُلَانًا بِشَيْءٍ خَصُوصِيَّةً»
        - word: "مكانية"
