# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «حيزية» مكتوبة بدون تشكيل — يجب تصويبها إلى «حَيِّزِيَّة» (بتشديد الياء وفتح الحاء)"
      - "لمّة «خاصية مكانية» مكتوبة بدون تشكيل — يجب ضبطها بالشكل الكامل: «خَاصِّيَّة مَكَانِيَّة»"
      - "التعريف الحالي «أي خاصية تتعلق بالمكان أو شغله» وصفي عام لا يُبيّن الجنس القريب والفصل النوعي بأسلوب المعجم الوسيط"
      - "غياب توثيق الفارق الدلالي بين اللمّتين: حيزية (مصطلح فلسفي) وخاصية مكانية (مركّب تطبيقي)"
    observations: >
      المجموعة تُغطي مفهوم الـ«spatiality» الفلسفي — خاصية كون الشيء ذا علاقة بالمكان أو شاغلاً
      له حيّزاً. اللمّة «حيزية» تستند إلى المصطلح الفلسفي الكلاسيكي «الحيّز» (الفراغ المتوهَّم
      الذي يشغله الجسم عند علماء الكلام والحكماء)، وهو مصطلح معرّف في معجم الجرجاني
      والتهانوي ودستور العلماء. أما «خاصية مكانية» فمركّب وصفي شفاف موثَّق في المعجمية التقنية
      الحديثة. كلتا اللمّتين ناجحتان في التعبير عن المفهوم من زاويتين مختلفتين، وتستحقان الإبقاء
      مع توثيق الفارق.

  # ── التوليد الأعمى — من التعريف فقط، قبل الاطلاع على اللمّات ──
  blind_candidates:
    - lemma: "حَيِّزِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ح-و-ز عبر اسم «حيّز» (الفراغ المتوهَّم الذي يشغله الشيء) + مصدر صناعي (-يَّة).
        وزن المصدر الصناعي مناسب لتجريد الخاصية الفلسفية، وحيّز مصطلح فلسفي راسخ في التراث
        العربي يدل على الفضاء الذي يشغله الجسم — وهو جوهر الخاصية المطلوبة.

    - lemma: "مَكَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر ك-و-ن عبر اسم «مكان» + مصدر صناعي (-يَّة). وزن المصدر الصناعي يُحوّل
        الصفة المنسوبة «مكاني» إلى مفهوم تجريدي يدل على خاصية التعلق بالمكان. الاشتقاق
        طبيعي وواضح، ويُعادل "spatiality" مورفولوجياً.

    - lemma: "خَاصِّيَّة مَكَانِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي إضافي من «خاصية» (جنس) + «مكانية» (فصل نوعي). يُعادل
        "spatial property" في الإنجليزية مباشرةً. التعبير المركّب محكم لأن «خاصية» وحدها
        تعني property، و«مكانية» تحدد النوع. لا يمكن إبدال «مكانية» بمرادف دون تغيير
        الدلالة — فاختبار التثبيت المعجمي متحقّق.

    - lemma: "اِمْتِدَادِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر م-د-د عبر المصدر «امتداد» + (-يَّة). الامتداد في الفضاء هو جوهر
        خاصية «شغل المكان» المذكورة في التعريف. وزن الافتعال المصدري يُعطي دلالة
        الخاصية الذاتية المجردة. الوزن مناسب لأن «اِفْتِعَالِيَّة» يدل على خاصية جوهرية
        ثابتة في الشيء.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة (٧ استعلامات):
#  ١. Batch headword: حيزية/الحيزية/خاصية مكانية/مكانية/المكانية/حيز/الحيز/مكاني/المكاني/حوزية
#  ٢. English bridge: "spatial property" OR "spatiality" OR "spatial"
#  ٣. Arabic FTS: "حيز" OR "مكانية" OR "فضائي" OR "اتساع"
#  ٤. Combined enrichment (entry_ids: 922463, 6596, 79705, 80140, 986009)
#  ٥. مقاييس اللغة: حوز + مكن
#  ٦. Headword: مكانية/خاصية/مكاني + تحقق من المرشحات
#  ٧. مقاييس اللغة: خص + كون
stage2_evidence:
  per_lemma:
    - lemma: "حيزية"
      confirm:
        - text: "«حَيِّزيّة - من (ح ي ز) مؤنث حَيِّزيّ نسبة إلى حيّز»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry_id: 922463)"
        - text: "«(1) حَيِّزِيّ؛ مكانيّ (2) فضائيّ» — ترجمة كلمة «spatial» الإنجليزية"
          source: "المورد الحديث (2008) (entry_id: 718856)"
        - text: "«صيغَةٌ حَيِّزِيَّة» — ترجمة «spatial formula»"
          source: "المعجم الطبي الموحد (2009) (entry_id: 581313)"
        - text: "«تَصاوُغٌ حَيِّزِيّ» — ترجمة «spatial isomerism»"
          source: "المعجم الطبي الموحد (2009) (entry_id: 597023)"
        - text: "«تَوَضُّعٌ حَيِّزِيّ» — ترجمة «spatial localization»"
          source: "المعجم الطبي الموحد (2009) (entry_id: 603646)"
      expands:
        - text: >
            «الحيِّزُ: هُوَ الْفَرَاغ المتوهم المشغول بالشَّيْء» — وعند المتكلمين:
            «هو الفراغ المتوهم الذي يشغله شيء ممتد، كالجسم، أو غير ممتد، كالجوهر الفرد»
          source: "معجم مقاليد العلوم للسيوطي + كتاب التعريفات للجرجاني (entry_ids: 806846, 794955)"
          addition: >
            الحيّز في الفلسفة الإسلامية الكلاسيكية مفهوم دقيق يختلف عن المكان؛
            الحيزية منه مصطلح فلسفي عريق يدل على خاصية كون الشيء ذا حيّز أو ارتباطه به

    - lemma: "خاصية مكانية"
      confirm:
        - text: "«التحليل المكاني» = spatial analysis"
          source: "معجم البيانات والذكاء الاصطناعي (2024) (entry_id: 765819)"
        - text: "«التخطيط المكاني» = spatial planning"
          source: "AGROVOC (entry_id: 763052)"
        - text: "«توزع مكاني» = spatial distribution"
          source: "AGROVOC (entry_id: 763051)"
        - text: "«تركيب مكاني» = spatial structure"
          source: "مسرد الجغرافيا والتاريخ - ALECSO (entry_id: 501325)"
        - text: "«مكانيّ» كترجمة عربية لـ «spatial»"
          source: "المورد الحديث (2008) (entry_id: 718856)"
        - text: "«الخاصية» = property في معاجم متعددة (رياضيات، فيزياء، كيمياء)"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989), المعجم الموحد للرياضيات والفلك (1990) (entry_ids: 423528, 417234)"
      expands:
        - text: >
            «مظاهر زمانية مكانية» = spatio-temporal aspects — «مظاهر تتعلق بالزمان
            الذي يستغرقه التواصل والحيز المكاني الذي يتم فيه»
          source: "مسرد الإعلام والتواصل - ALECSO (entry_id: 488965)"
          addition: >
            الجمع بين «مكاني» و«حيز» في السياق ذاته يؤكد تكاملهما التعبيري؛
            «مكاني» يُستخدم في السياق العلمي التطبيقي، و«حيزي» في السياق الدقيق

    - lemma: "مَكَانِيَّة"
      expands:
        - text: "«مكانيّ» = صفة تُستخدم نعتاً في مركّبات: «التحليل المكاني»، «التخطيط المكاني»، «البيانات المكانية»"
          source: "AGROVOC + معجم الجغرافيا والتاريخ + موسوعة الكهرباء (entry_ids متعددة)"
          addition: >
            «مكانية» في الاستخدام الموثَّق صفة منسوبة ومنعوت بها، لا اسم مجرد
            يدل على الخاصية التجريدية. عدم وجودها مفردةً كاسم للمفهوم في أي مصدر.
      contradicts:
        - text: >
            «مَكَنَ - الْمِيمُ وَالْكَافُ وَالنُّونُ كَلِمَةٌ وَاحِدَةٌ. الْمَكْنُ: بَيْضُ الضَّبِّ»
            — ليس للمكن أصل يدل على المكان في ابن فارس
          source: "مقاييس اللغة لابن فارس (dictionary_id: 151)"
          conflict: >
            الجذر م-ك-ن لا يدل على المكان. المكان من جذر ك-و-ن، لذا فمكانيّة قياسها
            على كونيّة/حيزيّة لا يعني أن «مكانية» المجردة تُعبِّر عن المفهوم تعبيراً كافياً
            دون الاستناد إلى «خاصية»

    - lemma: "اِمْتِدَادِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة: حيزية ────────────────────────────────────
    - lemma: "حيزية"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة معجمياً في موسوعة قابوس وفي المعجم الطبي الموحد وترجمات المورد
        الحديث لـ«spatial». جذرها ح-و-ز عريق في التراث، والتجريد بـ(-يَّة) منهج اشتقاقي
        سليم. المصطلح راسخ في الفلسفة الإسلامية (حيّز المتكلمين) مما يضفي عليه عمقاً
        دلالياً لا يحمله «خاصية مكانية». تحتاج فقط إلى تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: >
        وزن (فَعِّيليَّة) من باب النسبة + المصدر الصناعي — مناسب تماماً للدلالة على الخاصية
        الجوهرية المجردة. الياء المشددة في حيّز هي أصلها واو (أشار ابن فارس)، والصيغة
        النهائية حَيِّزِيَّة صحيحة قياساً.
      nuance_differentiation: >
        تحمل دلالة فلسفية كلاسيكية مستمَدَّة من «الحيّز» عند المتكلمين (الفراغ المتوهَّم
        الذي يشغله الجسم)؛ تُفضَّل في الكتابات الفلسفية والعلمية الدقيقة (الكيمياء الفراغية،
        الطب، المنطق)، وتُستخدم نعتاً (حيّزي) أكثر من استخدامها اسماً مجرداً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَيِّزِيَّة"

    # ── لمّة موجودة: خاصية مكانية ────────────────────────────
    - lemma: "خاصية مكانية"
      decision: confirmed
      decision_reason: >
        المركّب الوصفي موثَّق توثيقاً واسعاً في عشرات المصادر التقنية (ARABTERM, AGROVOC,
        موسوعة الكهرباء، الجغرافيا، المعلوماتية). «خاصية» بمعنى property ثابتة في معاجم
        متخصصة متعددة. المركّب يُعادل "spatial property" بنية وظيفة. اختبار التثبيت
        المعجمي محقَّق: لا يمكن إبدال «مكانية» بمرادف دون تحوّل الدلالة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      morphological_fit: >
        «خاصية» مصدر صناعي من «خاصة» (نسبة مؤنثة)، و«مكانية» نعت مجرور مضموم إليه.
        البنية الوصفية (خاصية + صفة) نمط منتج في المعجمية العربية الحديثة وشائع في
        المصطلحات المرجمة.
      nuance_differentiation: >
        مركّب وصفي شفاف وأكثر قابلية للفهم الفوري في الأدبيات العلمية والتطبيقية المعاصرة
        (الجغرافيا، المعلوماتية، الهندسة المدنية، التخطيط). يُستخدم في سياق أوسع جمهوراً
        مقارنةً بـ«حيزية» الأكثر تخصصاً وفلسفيةً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاصِّيَّة مَكَانِيَّة"

    # ── مرشح المرحلة ١: مكانية (مرفوض) ──────────────────────
    - lemma: "مَكَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «مكانية» في المصادر الموثَّقة صفة منسوبة مجرورة وليست اسماً مجرداً يدل على
        مفهوم «الخاصية الفضائية». استخدامها في ARABTERM يكشف عنها دائماً نعتاً لاسم
        آخر (التحليل المكاني، البيانات المكانية...). وجود «خاصية مكانية» في المجموعة
        يُغني عنها تماماً، وإضافتها كلمّة مستقلة سيُنشئ التباساً لدى المستخدم.
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: امتداديةة (مرفوض) ──────────────────
    - lemma: "اِمْتِدَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أي شواهد معجمية للمصطلح في قاعدة البيانات. الامتداد مفهوم مرتبط
        لكن يخص جانباً واحداً من الحيزية (الكميّة)؛ «الحيزية» تشمله وتتخطاه.
        المصطلح غير ثابت الاستخدام ولا موثَّق في مصادر معتمَدة.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "أي خاصية تتعلق بالمكان أو شغله"
    assessment:
      decision: revise
      reason: >
        الصياغة الحالية وصف وظيفي لا تعريف منطقي: «أي خاصية» جنس أعمى لا يُميَّز،
        و«تتعلق» علاقة غامضة. التعريف مترجَم بشكل حرفي من الإنجليزية «any property
        relating to or occupying space» دون صياغة معجمية عربية. يجب إعادة صياغته
        بجنس قريب (صفة/خاصية جوهرية) وفصل نوعٍ (علاقتها بالحيّز والمكان).
    authored:
      - type: terminological
        text: >
          خَاصِّيَّةٌ جَوْهَرِيَّةٌ تَتَعَلَّق بالمكان أو الحيِّز؛ فتُعبِّر عن ارتباط الشيء بهما
          إمَّا بالكون فيهما أو بشغل جزءٍ منهما
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          ما يدل من الصفات الجوهرية على تعلُّق الشيء بالمكان أو احتلاله حيِّزاً فيه
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05069917-n"
          definition_index: 0
          text: >
            خَاصِّيَّةٌ جَوْهَرِيَّةٌ تَتَعَلَّق بالمكان أو الحيِّز؛ فتُعبِّر عن ارتباط الشيء بهما
            إمَّا بالكون فيهما أو بشغل جزءٍ منهما
      - command: add_definition
        params:
          synset_id: "awn4-05069917-n"
          text: "ما يدل من الصفات الجوهرية على تعلُّق الشيء بالمكان أو احتلاله حيِّزاً فيه"

  examples:
