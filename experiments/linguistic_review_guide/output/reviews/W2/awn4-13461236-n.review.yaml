stage1_review:
  assessment:
    concerns:
      - "مصطلح 'نشاط حيوي' قد يكون أعم من الدلالة المحددة للعملية الجسدية، إذ يمكن أن يشمل أنشطة الكائنات الدقيقة أو النباتات، بينما المجموعة تخص العمليات الجسدية."
      - "خلو المجموعة من المصطلح العلمي المتداول 'عملية فسيولوجية'."
    observations: "المصطلحات الحالية تغطي المفهوم بشكل معقول. الترجمة 'عملية جسدية' حرفية ومقبولة، بينما 'وظيفة جسدية' تعكس المصطلح الإنجليزي 'bodily function'. الدلالة تركز على العمليات العضوية المرتبطة بجسد الكائن الحي."
  blind_candidates:
    - lemma: "وَظِيفَة عُضْوِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي يربط الوظيفة بالعضو، وهو دارج في سياق وظائف الأعضاء."
    - lemma: "عَمَلِيَّة فِسْيُولُوجِيَّة"
      generation_method: taarib
      justification: "التعريب العلمي المباشر المعتمد في الطب والأحياء للتعبير عن الوظائف الجسدية."
    - lemma: "فِعْل حَيَوِيّ"
      generation_method: tarkib
      justification: "تعبير مركب يصف أي فعل أو وظيفة يقوم بها الكائن الحي لاستمرار بقائه."
    - lemma: "نَشَاط بَدَنِيّ"
      generation_method: tarkib
      justification: "تركيب مألوف يدل على تفاعلات أو حركات صادرة عن البدن."

