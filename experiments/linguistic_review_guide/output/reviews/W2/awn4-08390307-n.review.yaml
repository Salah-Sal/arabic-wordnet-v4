# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-08390307-n (vernation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «ترتيب الأوراق» دائرية — مأخوذة حرفياً من صدر التعريف"
      - "«ترتيب الأوراق» مصطلح عام يصلح لـ phyllotaxy (نظام ترتيب الأوراق على الساق) لا لـ vernation (هيئة الأوراق في البرعم)"
      - "المجموعة تحتوي على لمّة واحدة فقط لمفهوم نباتي متخصص يحتاج مصطلحاً دقيقاً"
    observations: "المفهوم يصف هيئة انتظام الأوراق الصغيرة داخل البرعم الورقي قبل تفتّحه، وهو مصطلح نباتي دقيق يتمايز عن مفهوم ترتيب الأوراق على الساق (phyllotaxy) وعن هيئة الأوراق الزهرية في البرعم (aestivation/الالتفاف الزهري). يحتاج المفهوم إلى تركيب اصطلاحي يتضمن تقييد «برعمي» للتمييز عن المفاهيم المجاورة."
  blind_candidates:
    - lemma: "تَوَرُّق"
      generation_method: ishtiqaq
      justification: "مشتق من جذر «ورق» على وزن تَفَعُّل، يدل على عملية مرتبطة بالأوراق وحالاتها"
    - lemma: "التَّرْتِيب البُرْعُمِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين الترتيب والنسبة إلى البرعم، فيحصر الدلالة في هيئة الانتظام داخل البرعم تحديداً"
    - lemma: "تَرْتِيب الوَرَق البُرْعُمِيّ"
      generation_method: tarkib
      justification: "تركيب إضافي وصفي يضبط المفهوم بدقة: ترتيب الورق الذي يكون في طور البرعمة، ويميّزه عن الالتفاف الزهري"
    - lemma: "اِنْطِوَاء الوَرَق"
      generation_method: tarkib
      justification: "تركيب إضافي يصف هيئة انطواء الأوراق في البرعم باعتبار أن الأوراق تكون مطوية أو ملتفة"


stage2_evidence:
  per_lemma:
    - lemma: "تَرْتِيب الأَوْرَاق"
      contradicts:
        - text: "«ترتيب الأوراق — phyllotaxy»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          conflict: "المصطلح مُسجَّل بمقابل phyllotaxy (ترتيب الأوراق على الساق) لا vernation (هيئة الأوراق في البرعم)، فهما مفهومان نباتيان مختلفان"

    - lemma: "تَوَرُّق"
      contradicts:
        - text: "«(تورق) الحيوان أكل الورق»"
          source: "المعجم الوسيط"
          conflict: "الدلالة المعجمية الأصلية: أكل الورق، لا علاقة بترتيب الأوراق في البرعم"
        - text: "«بنية صفائحية تنتج عن فرز المعادن المختلفة إلى صفيحات موازية للبنية التنضدية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "مصطلح جيولوجي مأخوذ يقابل foliation"
      expands:
        - text: "«تورق الزهر — phyllody»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "يوجد استعمال نباتي لكنه يعني تحوّل الأعضاء الزهرية إلى أوراق، لا ترتيب الأوراق في البرعم"

    - lemma: "التَّرْتِيب البُرْعُمِيّ"
      confirm:
        - text: "«التَّرتيب البُرعميّ: ترتيب الأوراق في البُرعم.»"
          source: "المورد الحديث (2008)"

    - lemma: "تَرْتِيب الوَرَق البُرْعُمِيّ"
      confirm:
        - text: "«ترتيب البرعم الورقي، ترتيب الورق البرعمي — prefoliation; vernation»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"

    - lemma: "اِنْطِوَاء الوَرَق"
      contradicts:
        - text: "«الالتفاف الزُّهْرِيّ (في علم الأحياء) اسم لحالة الأوراق الزهرية في وضع بعضها من بعض في البرعم قبل تفتحه (مج)»"
          source: "المعجم الوسيط"
          conflict: "المصطلح المعجمي المقابل هو «الالتفاف الزهري» لا «الانطواء»، وهو يخص الأوراق الزهرية (aestivation) لا الأوراق الخضرية (vernation)"
        - text: "«انطواء — introversion»"
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
          conflict: "المصطلح مشغول بدلالة نفسية (الانطواء على الذات) في عدة مجالات"


stage3_analysis:
  per_lemma:
    - lemma: "تَرْتِيب الأَوْرَاق"
      decision: removed
      decision_reason: "المصطلح يقابل phyllotaxy في المكنز الزراعي (AGROVOC)، وهو مفهوم مختلف عن vernation. فضلاً عن ذلك، هو دائري مع التعريف الحالي للمجموعة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَوَرُّق"
      source: stage1
      decision: removed
      decision_reason: "الدلالة المعجمية محصورة في أكل الورق (المعجم الوسيط) أو البنية الصفائحية الجيولوجية (foliation)، ولا صلة لها بترتيب الأوراق في البرعم. كما أن المصطلح مأخوذ في مجالات أخرى."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "التَّرْتِيب البُرْعُمِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح موثق في المورد الحديث (2008) بمقابل vernation مباشرة. تركيب وصفي مستقر ومختصر يحصر الدلالة في هيئة الانتظام داخل البرعم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "صيغة مختصرة تصلح عنواناً معجمياً، تركز على وصف الترتيب بنسبته إلى البرعم دون تخصيص نوع الأوراق (ورقية أو زهرية)"
      actions:
        - command: create_entry
          params:
            lemma: "التَّرْتِيب البُرْعُمِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَرْتِيب الوَرَق البُرْعُمِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد من مجمع اللغة العربية (ALECSO) في المعجم الموحد لمصطلحات علم الأحياء (1993) بمقابل vernation/prefoliation. صيغة تفصيلية تميّز المفهوم بدقة عن الالتفاف الزهري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "صيغة تفصيلية معتمدة من ALECSO، تحدد نوع الأوراق (ورقية لا زهرية) وتميّز المفهوم صراحةً عن الالتفاف الزهري (aestivation)"
      actions:
        - command: create_entry
          params:
            lemma: "تَرْتِيب الوَرَق البُرْعُمِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اِنْطِوَاء الوَرَق"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على هذا التركيب بدلالة نباتية. «انطواء» مشغول بدلالة نفسية (introversion) في مسارد متعددة. والمصطلح النباتي القريب هو «الالتفاف الزهري» الذي يخص aestivation لا vernation."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi


