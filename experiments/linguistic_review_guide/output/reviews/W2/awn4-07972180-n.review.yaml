stage1_review:
  assessment:
    concerns:
      - اللمات الحالية تفتقر إلى التشكيل الكامل.
      - التعريف الحالي يحتاج إلى صياغة معجمية أكثر دقة لبيان طبيعة الاجتماع أو الظهور.
    observations: "اللمتان الموجودتان (دفعة وفوج) صحيحتان وتعبران عن المفهوم بدقة في السياقات الحديثة والتراثية. المفهوم يركز على الوحدة الزمنية للاجتماع أو الظهور."
  blind_candidates:
    - lemma: "دُفْعَةٌ"
      generation_method: majaz
      justification: "من الدفع، وتستخدم في المعجم الحديث للمجموعة التي تشترك في صفة أو تظهر بمرة واحدة كدفعة الخريجين."
    - lemma: "فَوْجٌ"
      generation_method: majaz
      justification: "جماعة من الناس تظهر أو تأتي معاً، وهي أصيلة في الاستعمال القرآني."
    - lemma: "رَعِيلٌ"
      generation_method: majaz
      justification: "الجماعة المتقدمة من الناس أو الخيل، وتستخدم لوصف 'أراغيل الرياح' أي دفعها إذا تتابعت، مما يناسب مفهوم المجموعة التي تظهر معاً."
    - lemma: "ثُبَّةٌ"
      generation_method: ishtiqaq
      justification: "الجماعة من الناس، وأصلها من ثبي/ثبو الذي يدل على الاجتماع."

stage2_evidence:
  per_lemma:
    - lemma: "دُفْعَةٌ"
      confirm:
        - text: "«الدًُّفعة من الشيء: المجموعة التي تشترك في شيء يجمعها فيقال: دُفعة من المطر، ودفعة من الخريجين.»"
          source: "معجم الصواب اللغوي"
        - text: "«مجموعة متجانسة من المفردات، ومنها دفعة بطاقات.»"
          source: "مسرد التربية (ArabTerm)"
    - lemma: "فَوْجٌ"
      confirm:
        - text: "«الفَوْجُ الجماعة من الناسِ... يدخلون في دين الله أَفْواجاً؛ أَي جماعاتٍ كثيرةً.»"
          source: "لسان العرب"
        - text: "«الجماعة من الناس والجماعة المارّة السريعة.»"
          source: "المعجم الوسيط"
    - lemma: "رَعِيلٌ"
      confirm:
        - text: "«الرعيل: الجماعة... ويقال فلان من الرعيل الأول من السابقين.»"
          source: "المعجم الوسيط"
        - text: "«أراغيل الرياح أو السحاب أوائلها أو دفعها إذا تتابعت.»"
          source: "المعجم الوسيط"
    - lemma: "ثُبَّةٌ"
      confirm:
        - text: "«(الثبة) الجماعة والجماعة من الفرسان خاصة.»"
          source: "المعجم الوسيط"
        - text: "«فانفروا ثبات أو انفروا جميعا؛ أي جماعات متفرقة.»"
          source: "تفسير/الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "دفعة"
      decision: confirmed
      decision_reason: "لمة أساسية وشائعة جداً في العربية المعاصرة لوصف المجموعات البشرية (طلاب، عمال) والمادية (بضائع، مطر) التي تظهر معاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُفْعَةٌ"
    - lemma: "فوج"
      decision: confirmed
      decision_reason: "لمة فصيحة وتراثية تدل على الجماعة الكبيرة التي تظهر أو تتحرك معاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَوْجٌ"
    - lemma: "رَعِيلٌ"
      source: stage1
      decision: confirmed
      decision_reason: "لمة تراثية قوية تدل على الجماعة المتقدمة أو التي تظهر في طليعة المجموعات، وتناسب تماماً المعنى الدلالي لـ crop."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رَعِيلٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ثُبَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة قرآنية تدل على الجماعة المجتمعة، وهي مرادف دقيق للمجموعة البشرية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ثُبَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "مجموعة من الأشخاص أو الأشياء تظهر معًا"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً؛ يحتاج لإضافة قيد 'الوقت الواحد' أو 'الدفعة الواحدة' لتمييزه عن مجرد التجميع المكاني."
    authored:
      - type: terminological
        text: "مجموعة من الأشخاص أو الأشياء التي تظهر أو تُنتج أو تخرج معاً في وقت واحد أو دفعة واحدة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مجموعة من الأشخاص أو الأشياء التي تظهر أو تُنتج أو تخرج معاً في وقت واحد أو دفعة واحدة."}
  examples:
    per_lemma:
      - lemma: "دُفْعَةٌ"
        examples:
          - text: "تخرجت دفعة جديدة من المهندسين هذا العام."
            type: usage
      - lemma: "فَوْجٌ"
        examples:
          - text: "وصل فوج سياحي كبير إلى المدينة الأثرية."
            type: usage
      - lemma: "رَعِيلٌ"
        examples:
          - text: "كان هؤلاء العلماء من الرعيل الأول الذين أسسوا الجامعة."
            type: usage
      - lemma: "ثُبَّةٌ"
        examples:
          - text: "{فَانْفِرُوا ثُبَاتٍ أَوِ انْفِرُوا جَمِيعاً}"
            type: quran
            source: "النساء: 71"
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "ظهرت دفعة جديدة من الخريجين في حفل التخرج."}

stage5_enrichment:
  per_entry:
    - lemma: "دُفْعَةٌ"
      entry_id: "{auto}"
      root: "دفع"
      maqayis_quote: "«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ... وَالدُّفْعَةُ مِنَ الْمَطَرِ وَالدَّمِ وَغَيْرِهِ.»"
    - lemma: "فَوْجٌ"
      entry_id: "{auto}"
      root: "فوج"
      maqayis_quote: "«الْفَاءُ وَالْوَاوُ وَالْجِيمُ كَلِمَةٌ تَدُلُّ عَلَى تَجَمُّعٍ. مِنْ ذَلِكَ الْفَوْجُ، الْجَمَاعَةُ مِنَ النَّاسِ.»"
    - lemma: "رَعِيلٌ"
      entry_id: "{auto}"
      root: "رعل"
      maqayis_quote: "«الرَّاءُ وَالْعَيْنُ وَاللَّامُ مُعْظَمُ بَابِهِ أَصْلَانِ: أَحَدُهُمَا جَمَاعَةٌ... فَالْأَوَّلُ الرَّعْلَةُ: الْقِطْعَةُ مِنَ الْخَيْلِ. وَالرَّعِيلُ مِثْلُ الرَّعْلَةِ.»"
    - lemma: "ثُبَّةٌ"
      entry_id: "{auto}"
      root: "ثبي"
      maqayis_quote: "«الثَّاءُ وَالْبَاءُ وَالْيَاءُ أَصْلٌ وَاحِدٌ... وَأَمَّا الثُّبَةُ فَالْعُصْبَةُ مِنَ الْفُرْسَانِ، يَكُونُونَ ثُبَةً، وَالْجُمَعَ ثُبَاتٌ.»"
  per_sense:
    - lemma: "دُفْعَةٌ"
      sense_id: "{auto}"
      nuance: "تُستخدم للأشخاص والأشياء، وتوحي بالخروج بمرة واحدة أو ككتلة واحدة."
      mwe: false
    - lemma: "فَوْجٌ"
      sense_id: "{auto}"
      nuance: "تُستخدم غالباً للأشخاص المتحركين كجماعات كبيرة."
      mwe: false
    - lemma: "رَعِيلٌ"
      sense_id: "{auto}"
      nuance: "توحي بالتقدم أو المجموعات الأولى التي تظهر في طليعة السياق."
      mwe: false
    - lemma: "ثُبَّةٌ"
      sense_id: "{auto}"
      nuance: "تؤكد على تماسك الجماعة واجتماعها في مكان واحد."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دفع","maqayis":"«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ... وَالدُّفْعَةُ مِنَ الْمَطَرِ وَالدَّمِ وَغَيْرِهِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فوج","maqayis":"«الْفَاءُ وَالْوَاوُ وَالْجِيمُ كَلِمَةٌ تَدُلُّ عَلَى تَجَمُّعٍ. مِنْ ذَلِكَ الْفَوْجُ، الْجَمَاعَةُ مِنَ النَّاسِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"رعل","maqayis":"«الرَّاءُ وَالْعَيْنُ وَاللَّامُ مُعْظَمُ بَابِهِ أَصْلَانِ: أَحَدُهُمَا جَمَاعَةٌ... فَالْأَوَّلُ الرَّعْلَةُ: الْقِطْعَةُ مِنَ الْخَيْلِ. وَالرَّعِيلُ مِثْلُ الرَّعْلَةِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ثبي","maqayis":"«الثَّاءُ وَالْبَاءُ وَالْيَاءُ أَصْلٌ وَاحِدٌ... وَأَمَّا الثُّبَةُ فَالْعُصْبَةُ مِنَ الْفُرْسَانِ، يَكُونُونَ ثُبَةً، وَالْجُمَعَ ثُبَاتٌ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُستخدم للأشخاص والأشياء، وتوحي بالخروج بمرة واحدة أو ككتلة واحدة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
