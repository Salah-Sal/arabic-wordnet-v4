          source: "المعجم الكبير (OCR، entry_id=58687)"
          conflict: "الفتور جاء في الشعر مقروناً بالضعف لا مرادفاً له، مما يُشير إلى أن الفتور أخص من الضعف (يدل على تناقص النشاط لا انعدام القوة)"

    - lemma: "الكَلَل"
      expands:
        - text: "«كلَّ الإنسانُ والدابَّةُ كلالاً وكلالةً، وهو كالٍ مُكِلّ: كلَّت دوابُّه»"
          source: "أساس البلاغة للزمخشري (Hawramani، entry_id=999263)"
          addition: "كلال يدل على الإعياء من الجهد (التعب العارض) لا على صفة انعدام القوة الجوهرية"
        - text: "«كَلَل: fatigue» (هندسة / فيزياء)"
          source: "معجم المصطلحات الموحدة (Arabterm، entry_id=350825)"
