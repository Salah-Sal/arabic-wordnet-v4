# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset: awn4-05211905-n  |  ili: i64319  |  pos: n
# الموضوع: صفة انعدام القوة أو القدرة (powerlessness / impotence)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يُعاني من الدوران: يُعرَّف المفهوم بـ«الضعف والوهن»، وضعف هي إحدى لمّات المجموعة ذاتها"
      - "اللمّتان الحاليتان (ضعف، عجز) خاليتان من التشكيل الكامل"
      - "يُحتمل إغفال فروق دلالية جوهرية بين ضعف (صفة جوهرية) وعجز (قصور فاعلي)"
    observations: >
      المجموعة تمثّل مفهوم "صفة انعدام القوة أو القدرة" وهو مفهوم محوري في اللغة العربية له
      جذور راسخة في التراث والاستعمال المعاصر. اللمّتان (ضعف وعجز) معيارية وأصيلة، غير أن
      بينهما فارقاً دقيقاً: الضعف يصف الحالة الكامنة لغياب القوة، بينما العجز يصف القصور عن
      الفعل والإنجاز. وجود كلمتَيْ "impotence / impotency" في الإنجليزية يُشير إلى أن المجموعة
      تشمل الضعف العام لا العنّة الجنسية تحديداً. التعريف الحالي يحتاج إلى تحرير لتجنّب الدوران.

  blind_candidates:
    - lemma: "الخَوَر"
      generation_method: majaz
      justification: >
        إحياء لفظ عربي قديم: الخَوَر بمعنى الرخاوة والضعف في كل شيء، ورد في كتاب العين
        «الخور: رخاوة وضعف في كل شيء»، وفي المقاييس «الآخر يدل على ضعف». مجاز بالإزاحة
        من المعنى المادي (رخاوة المادة) إلى الصفة المجردة لانعدام القوة.
    - lemma: "الفُتُور"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ف ت ر) على وزن فُعُول، يدل على التراخي والفتور وذهاب حدة النشاط. اشتقاق
        على وزن قياسي للمصادر الدالة على الحالات (كالنبور والنزور). يعبّر عن الجانب السلبي من
        غياب القوة الحيوية.
    - lemma: "الكَلَل"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ك ل ل) على وزن فَعَل، مصدر كلَّ يكِلُّ، يدل على الإعياء والعجز بعد بذل
        الجهد كما قال الزمخشري «كلّ الإنسان والدابة كلالاً». وهو من الأوزان الصرفية الفصيحة
        للمصادر الدالة على الحالات العارضة للأحياء.
    - lemma: "التَّهَالُك"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ه ل ك) على وزن تَفَاعُل، يدل على الاسترخاء والانهيار وقد استُعمل في وصف
        من أُسقط في يده وانهارت قواه. وزن تَفَاعُل يحمل دلالة المشاركة والتدرج مما يناسب
        التعبير عن الانحلال التدريجي للقوة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "ضَعْف"
      confirm:
        - text: "«ضدُّ القُوَّةِ»"
          source: "المعجم الكبير (OCR، entry_id=58687)"
        - text: "«الضَّعْفُ والضُّعْفُ: خلاف القوَّة. وقد ضَعُفَ فهو ضعيفٌ، وأضْعَفَهُ غيره. وقومٌ ضِعافٌ وضُعَفاءُ وضَعَفَةٌ»"
          source: "تاج اللغة وصحاح العربية (Hawramani، entry_id=982212)"
        - text: "«الضَّادُ وَالْعَيْنُ وَالْفَاءُ أَصْلَانِ مُتَبَايِنَانِ، يَدُلُّ أَحَدُهُمَا عَلَى خِلَافِ الْقُوَّةِ، وَيَدُلُّ الْآخَرُ عَلَى أَنْ يُزَادَ الشَّيْءُ مِثْلَهُ»"
          source: "مقاييس اللغة لابن فارس (Hawramani، entry_id=987438)"
        - text: "«الضَّعْفُ، ويُضَمُّ، ويُحَرَّكُ: ضِدُّ القُوَّةِ»"
          source: "القاموس المحيط للفيروزآبادي (Hawramani، entry_id=799465)"
        - text: "«ضَعُفَ ضَعْفاً: هُزِلَ, أَوْ مَرِضَ وذهبت قوته أو صحته»"
          source: "المعجم الوسيط (OCR، entry_id=16798)"
      expands:
        - text: "«اللَّهُ الَّذِي خَلَقَكُم مِّن ضَعْفٍ ثُمَّ جَعَلَ مِنْ بَعْدِ ضَعْفٍ قُوَّةً» (الروم: ٥٤)"
          source: "شاهد قرآني في المعجم الكبير (OCR، entry_id=58687)"
          addition: "توثيق الاستعمال القرآني للفظ ضعف دالاً على انعدام القوة الجوهري"
        - text: "asthenia; weakness"
          source: "المعجم الموحد لمصطلحات الطب البيطري (Arabterm، entry_id=468506)"
          addition: "يُقابَل في المصطلحية الطبية الحديثة بـ asthenia (الوهن العام)"

    - lemma: "عَجْز"
      confirm:
        - text: "«نقيض الحزم [و] الضعف وهو نقيض القوة»"
          source: "كتاب العين للخليل بن أحمد (OCR، entry_id=94714)"
        - text: "«العَجْزُ: الضعف. تقول: عَجَزْتُ عن كذا أعْجِزُ بالكسر عَجْزاً ومَعْجِزَةً»"
          source: "تاج اللغة وصحاح العربية (Hawramani، entry_id=982478)"
        - text: "«الْعَيْنُ وَالْجِيمُ وَالزَّاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى الضَّعْفِ، وَالْآخَرُ عَلَى مُؤَخَّرِ الشَّيْءِ. فَالْأَوَّلُ عَجِزَ عَنِ الشَّيْءِ يَعْجِزُ عَجْزًا، فَهُوَ عَاجِزٌ»"
          source: "مقاييس اللغة لابن فارس (Hawramani، entry_id=987652)"
        - text: "«عجز: أعجزني فلان إذا عجزت عن طلبه وإدراكه. والعجز نقيض الحزم. وعَجَزَ يَعْجِزُ عَجْزا فهو عاجزٌ ضعيفٌ»"
          source: "كتاب العين للخليل (Hawramani، entry_id=838489)"
        - text: "infirmity"
          source: "المعجم الطبي الموحد (Arabterm، entry_id=594691)"
          addition: "يُقابَل في المصطلحية الطبية بـ infirmity (الوهن الناجم عن عجز)"
      expands:
        - text: "«العجز والمَعْجِزُ والمَعْجِزَةُ... ضِدُّ الحَزْمِ»"
          source: "القاموس المحيط (Hawramani، entry_id=799775)"
          addition: "يُبرز العلاقة بين العجز والمفهوم المعاكس (الحزم والاقتدار)"

    - lemma: "الخَوَر"
      confirm:
        - text: "«الخور: رخاوة وضعف في كل شيء»"
          source: "كتاب العين للخليل (OCR، entry_id=96937)"
        - text: "«الخوار: الضعيف من كل شيء»"
          source: "مقاييس اللغة (OCR، entry_id=101043)"
        - text: "«الْخَاءُ وَالْوَاوُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى صَوْتٍ، وَالْآخَرُ عَلَى ضَعْفٍ»"
          source: "مقاييس اللغة لابن فارس (Hawramani، entry_id=986180)"
