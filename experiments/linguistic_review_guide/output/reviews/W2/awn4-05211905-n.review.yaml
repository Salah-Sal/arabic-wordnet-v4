          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani، entry_id=892207)"
          conflict: "التهالك يدل على الإقبال بشوق وحرص (حالة إيجابية انفعالية)، وهو نقيض المعنى المقصود تماماً"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "ضَعْف"
      decision: confirmed
      decision_reason: >
        لفظ عربي أصيل راسخ في التراث والاستعمال المعاصر، يدل على انعدام القوة بوصفه صفةً
        جوهرية. مؤيَّد بشواهد قرآنية ومعجمية تمتد من كتاب العين إلى المعاجم الحديثة. الوزن
        الصرفي فَعْل مناسب للمصادر الدالة على الحالات الكامنة. لا اعتراض عليه من حيث الفصاحة
        أو الاطراد أو الاشتقاقية. يحتاج إلى إضافة التشكيل الكامل: ضَعْف.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على الصفة الجوهرية الكامنة لغياب القوة في ذاتها، سواء أكانت بدنية أم نفسية أم
        معنوية. هو الأعم والأشمل في الدلالة، ويُعبَّر به عن الحالة الوجودية لانعدام القوة
        بصرف النظر عن الفعل أو الإنجاز.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ضَعْف"

    - lemma: "عَجْز"
      decision: confirmed
      decision_reason: >
        لفظ عربي أصيل يدل على التقاعس والقصور عن الفعل. أيَّده كتاب العين والصحاح ومقاييس
        اللغة لابن فارس وغيرها. الوزن الصرفي فَعْل مصدر من عجَزَ، ويُشكّل المقابل الأدق
        للـ impotence/impotency بالمعنى العام (العجز عن الفعل). فارقه عن ضعف جوهري ومعتدّ به.
        يحتاج إلى إضافة التشكيل الكامل: عَجْز.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على القصور الفاعلي، أي التقاعس أو الإخفاق في ممارسة القدرة على الفعل والإنجاز.
        أخص من الضعف في الجانب الحركي التنفيذي؛ فالضعف صفة والعجز إخفاق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَجْز"

    - lemma: "الخَوَر"
      source: stage1
      decision: removed
      decision_reason: >
        على الرغم من توثيق المعاجم الكلاسيكية (كتاب العين، المقاييس، المصباح) للفظ الخَوَر
        بمعنى «رخاوة وضعف في كل شيء»، فإن الاستعمال المعاصر انصرف بالدرجة الأولى إلى المعنى
        الجغرافي (مصب الماء/الخليج) والمعنى الطبي الضيق (نقص الإرادة/hypobulia). علاوة على
        ذلك، الخَوَر في أصل دلالته يصف الرخاوة المادية للأشياء أكثر مما يصف صفة انعدام القوة
        الإنسانية الوجودية، مما يجعل توظيفه في هذه المجموعة مثاراً للالتباس ودون ضرورة مع
        وجود ضعف وعجز.
      evidence_assessment:
        case: mixed

    - lemma: "الفُتُور"
      source: stage1
      decision: removed
      decision_reason: >
        الفتور يدل على التراخي وانحسار النشاط تدريجياً لا على انعدام القوة بوصفه صفةً جوهرية.
        ورد في الشعر القديم مقروناً بالضعف لا مرادفاً له («على ضعف من حاله وفتور»). المصطلحية
        الحديثة تُرجمت الفتور بـ hypoactivity (نقص مرضي في النشاط)، وهو أبعد ما يكون عن
        powerlessness. لم يُعثر على دليل معجمي كلاسيكي مباشر يُثبّت الفتور بمعنى انعدام القوة.
      evidence_assessment:
        case: mixed

    - lemma: "الكَلَل"
      source: stage1
      decision: removed
      decision_reason: >
        الكلال والكلل يدلان على الإعياء الناتج عن الجهد (تعب السيف أو الدابة أو الإنسان بعد
        السعي)، وليسا صفةً أصيلة لانعدام القوة الكامنة. المصطلحية الحديثة وجّهتهما نحو
        الإجهاد الميكانيكي (fatigue)، لا نحو الوهن الإنساني الجوهري. الاشتقاق صحيح لكن
        المعنى غير مطابق للمجموعة.
      evidence_assessment:
        case: no_material

    - lemma: "التَّهَالُك"
      source: stage1
      decision: removed
      decision_reason: >
        تهالك يدل على الإقبال بحرص شديد أو الارتماء على شيء بلهفة، وهو نقيض المعنى المقصود
        تماماً. الاستعمال المعجمي المُوثَّق يُثبت أن التهالك يصف الحماسة والرغبة لا الضعف
        وانعدام القوة. خطأ في الاشتقاق الدلالي.
      evidence_assessment:
        case: contradicts_only


