# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لا تشكيل على اللمّتين الموجودتين (سلطة، منصب)."
      - "التعريف الحالي جملة تفسيرية مترجمة حرفياً لا يتّسق أسلوبها مع معاجم اللغة."
      - "التعريف يبدو دائرياً: «تولي منصب يعني أن تكون في السلطة» — وكلاهما لمّتا المجموعة ذاتها."
      - "غياب لمّة تعبّر عن مفهوم الوِلَاية الإدارية/السياسية الراسخ في المعجمية العربية."
    observations: >
      المجموعة awn4-13968154-n تُمثّل المفهوم الإنجليزي (office / power) بمعنى «الحالة
      التي يكون فيها مسؤول حكومي أو حكومة في موقع السُّلطة بحكم تقلُّدها منصباً رسمياً».
      والمفهوم مُتجذِّر في العربية إذ يقابله جملة ألفاظ راسخة (ولاية، إمارة، سلطان، حكم).
      اللمّتان الحاليتان (سلطة + منصب) تُغطّيان البُعدَين الإنجليزيَّين (power + office)،
      غير أن كلاً منهما يحمل ظلالاً دلالية تختلف عن الأخرى وتستحق التوثيق.
      الجذر (سلط) يدل على القوة والقهر بينما (نصب) يدل على الإقامة والرفع.

  blind_candidates:
    - lemma: "وِلَايَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من جذر (ولي) على وزن فِعَالَة، وهو وزن مشهور لدلالة الحِرَف والمناصب
        (وزارة، إمارة، قضاء). الولاية في المعجمية العربية الكلاسيكية والفقهية تعني
        «تنفيذ القول على الغير» و«الخطة والإمارة والسلطان»، فهي تُعبِّر عن حالة تقلُّد
        الشخص للسُّلطة والأمر، وهو جوهر المجموعة الترادفية.
    - lemma: "إِمَارَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من جذر (أمر) على وزن فِعَالَة. الإمارة في المعاجم: «منصب الأمير» و«الولاية».
        تربطها بالمجموعة مشابهة دلالية من حيث إنها تُجسِّد حالةَ كون الشخص في موقع
        القيادة والأمر؛ بيد أنها أخصُّ من «سلطة» و«منصب» إذ تقتصر تاريخياً على حَكَم
        بعينه (الأمير).
    - lemma: "تَوَلٍّ"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل (تَوَلَّى) من جذر (ولي) على وزن تَفَعُّل. يدل على استلام الشخص
        الأمرَ والسلطةَ وأخذه على عاتقه. التوَلّي يُشير إلى حالة الشخص بعد تقلّده
        الأمر لا إلى فعل التقلّد نفسه.
    - lemma: "حُكْم"
      generation_method: majaz
      justification: >
        من جذر (حكم)، أصله المنع من الظلم. ويُستعمل مجازاً للدلالة على السلطة السياسية
        والسيادة («في عهد حكمه» / «تسلّم الحكم»). يحمل دلالة ممارسة السلطة من موقع
        تولّي المنصب.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات نُفِّذت:
# ١. مطابقة دفعية: سلطة/السلطة، منصب/المنصب، ولاية/الولاية، امارة/الامارة، تول/التول، حكم/الحكم
# ٢. إثراء بالمعرّف (definitions + examples) لمدخلات سلطة ومنصب وولاية وإمارة
# ٣. جسر إنجليزي: office OR power OR authority
# ٤. مقاييس اللغة للجذور: سلط، نصب، ولي، أمر
stage2_evidence:
  per_lemma:
    - lemma: "سلطة"
      confirm:
        - text: "«السُّلْطَةُ: السَّيْطرة والتحكُّم. ذوو السَّيطرة والتحكُّم. (فى علم الاجتماع): القُدرة القانونية أو المجتمعية على مُمَارسة نفوذٍ على فرد أو جماعة، ومن وسائلها إصدارُ الأوامر والنواهى ممَّن يملكها إلى الخاضعين لها»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
        - text: "«(السلطة) التسلط والسيطرة والتحكم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "power — قوة سياسية أو اجتماعية أو اقتصادية تجعل الفرد المتمتع بها في وضع أعلى ممن هم دونه"
          source: "مسرد الإعلام والتواصل، ARABTERM (entry 488672)"
        - text: "authority"
          source: "مسرد الفلسفة وعلم النفس، ARABTERM (entry 489308)"
      expands:
        - text: "«السُّلْطَةُ التشريعيَّة: البرلمان والمجالس النيابية. السُّلْطَةُ التَّنفيذيَّةُ: الحكومة والوزارات. السُّلْطَةُ القَضائيَّةُ: المحاكم والنيابة العامة»"
          source: "المعجم الكبير"
          addition: "يكشف عن تعدُّد وجوه السُّلطة الحكومية وانتظامها في منظومة مناصب رسمية — مما يربط السُّلطة بالمنصب ربطاً وثيقاً."

    - lemma: "منصب"
      confirm:
        - text: "«المَنْصِب: ما يتولَّاه المرء من عمل. يقال: تولَّى منصب الوزارة أو القضاء ونحوهما. (مو)»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(المنصب) المَقَام والأصل. يُقال هو يرجع إلى منصب كريم. ولفلان منصب: علو ورفعة. وما يتولَّاه المرء من عمل. يُقال تولَّى منصب الوزارة أو القضاء ونحوهما (مو)(ج) مناصب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "portfolio"
          source: "المعجم الموحد لمصطلحات القانون 2017، ARABTERM (entry 413864)"
      expands:
        - text: "«المَقَام والأصل. يقال: هو يرجع إلى مَنْصِب كريم»"
          source: "المعجم الوسيط"
          addition: "يكشف أن للمنصب بُعداً أصيلاً/نسبياً يُضاف إلى البُعد الوظيفي، مما يعني أن تقلُّده يُكسب صاحبه رفعةً ومكانة."

    - lemma: "وِلَايَة"
      confirm:
        - text: "«الوِلَايَة: الخِطَّة والإمارة والسُّلطان والبلاد التى يتسلَّط عليها الوالى»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(الوِلَايَة) الخطة والإمارة والسُّلطان والبلاد التي يتسلط عليها الوالي»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الوَلاية: تنفيذ القول على الغير شاءَ الغير أوْ لا، ومن له الوَلاية وَلِيٌّ. وبالكسر الخِطَّة والإمارة»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«الولاية: من الولي، وهو القرب. وفي الشرع: تنفيذ القول على الغير شاء الغير أم أبى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الوَلاية: القَرابة»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأول للولاية هو القرابة الدموية، وهو معنى لا صلة له بالمجموعة الترادفية الخاصة بتقلُّد المناصب الحكومية."

    - lemma: "إِمَارَة"
      confirm:
        - text: "«(الإِمَارَة) منصب الأَمير وجزء من الأرض يحكمه أمير»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الإمارةُ: الولاية. يقال: ما لك في الإمارة خيرٌ. مَنطِقةٌ يحكُمها أمير (مُوَلَّد)»"
          source: "المعجم الكبير"
        - text: "principality"
          source: "مسرد الجغرافيا والتاريخ، ARABTERM (entry 503986)"
      contradicts:
        - text: "«الأمارة — بالفتح — لغةً: العلامة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "تُشير المصادر إلى وجوب التمييز بين الأَمَارة (بالفتح) = العلامة، والإِمَارة (بالكسر) = المنصب. ضبط الهمزة حاسم لتجنّب الاشتراك اللفظي."

    - lemma: "تَوَلٍّ"
      evidence_status: "no_material_found"

    - lemma: "حُكْم"
      contradicts:
        - text: "«الحُكْم: القضاءُ. وأصلُه المنعُ. يُقال: حكمتُ عليه بكذا إذا منعتَه من خلافه»"
          source: "المصباح المنير للفيومي"
          conflict: "الحُكم في معظم المصادر يُحيل على القضاء والفصل لا على تولّي منصب حكومي."
        - text: "«الحُكم: إسناد أمرٍ إلى آخر إيجاباً أو سلباً»"
          source: "التعريفات للجرجاني"
          conflict: "المعنى الاصطلاحي الراسخ للحكم هو القضاء المنطقي/الشرعي، مما يُبعده عن دلالة المجموعة."
      expands:
        - text: "«الحكم: [في الإنجليزية] Verdict, judgement, gouvernment, power»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يوجد وجه من وجوه الحكم يقابل government/power إنجليزياً، لكنه ليس المعنى الأولي الغالب."


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "سلطة"
      decision: confirmed
      decision_reason: >
        اللمّة مُثبَّتة في المعاجم الكلاسيكية والحديثة بمعنى التسلّط والسيطرة، وتُقابل
        الإنجليزية "power" مباشرةً. ARABTERM يُسجِّلها بصراحة ترجمةً لـ power وauthority.
        تحتاج إلى تشكيل كامل: سُلْطَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
        type: native
        notes: "لفظ عربي أصيل من جذر سلط."
      morphological_fit: "اسم على وزن فُعْلَة من جذر سلط — مناسب لدلالة الحالة والصفة."
      nuance_differentiation: >
        تُبرز الجانبَ القوّاتي/القدراتي للسلطة (القهر، التحكم، النفوذ) دون التركيز على
        طبيعة الموقع الوظيفي في حد ذاته. هي المآل الذي يُفضي إليه تقلّد المنصب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُلْطَة"

    - lemma: "منصب"
      decision: confirmed
      decision_reason: >
        اللمّة مُثبَّتة بأدلة صريحة: «ما يتولاه المرء من عمل — تولَّى منصب الوزارة أو القضاء»،
        وهي تُقابل الإنجليزية "office" مباشرةً (المورد الحديث: «منصِب»). تحتاج إلى تشكيل
        كامل: مَنْصِب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
        type: native
        notes: "لفظ عربي من جذر نصب على وزن مَفْعِل (مكان/آلة)، يدل على الموضع الذي يُنصَب فيه المرء."
      morphological_fit: "وزن مَفْعِل يُناسب دلالة الموقع والمكانة (مَجلِس، مَقعَد، مَنصِب)."
      nuance_differentiation: >
        يُبرز الموقعَ الوظيفي الرسمي الذي يتقلَّده المرء (office/position)، لا القوة المكتسبة
        منه. «تولَّى منصب الوزارة» يركّز على طبيعة الدور الذي يشغله صاحبه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنْصِب"

    - lemma: "وِلَايَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        الولاية مُثبَّتة في المعاجم بمعنى «الخطة والإمارة والسلطان» و«تنفيذ القول على الغير»،
        وهي بذلك مرادفة حقيقية لمفهوم المجموعة في بُعده الإداري/الشرعي. المعنى الداخلي للجذر
        (القُرب) تطوَّر إلى دلالة «القيام بالأمر» — وهو جوهر تقلّد المنصب. تجاوز معنى «القرابة»
        (المعنى الأول البيولوجي) محتمَل في سياق الاستعمال السياسي الراسخ.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      loan_check:
        type: native
        notes: "عربي أصيل من جذر ولي."
      morphological_fit: "وزن فِعَالَة مناسب للمناصب والحِرَف (إمارة، وزارة، ولاية)."
      nuance_differentiation: >
        تُبرز البُعد الشرعي/المؤسسي لتحمّل المسؤولية وتفويض السلطة (authority/guardianship)،
        بخلاف سُلْطَة التي تُبرز القوة، ومَنْصِب الذي يُبرز الموقع الوظيفي.
      actions:
        - command: create_entry
          params:
            lemma: "وِلَايَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إِمَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        الإمارة في المعاجم = «منصب الأمير» و«principality» (ARABTERM) — خاصة بنوع واحد من
        الحاكمين (الأمير)، ولا تُعبِّر عن المفهوم العام لتقلّد أيِّ منصب حكومي. المجموعة
        تشمل أي حكومة أو مسؤول حكومي، فلا تصلح الإمارة لمّةً عامة هنا.

    - lemma: "تَوَلٍّ"
      source: stage1
      decision: removed
      decision_reason: >
        «تَوَلٍّ» مصدر للفعل تَوَلَّى يدل على فعل الأخذ والاستلام لا على الحالة المُستقرَّة
        للكون في السلطة. والمجموعة تنتمي إلى hypernym «حالة» (state)، فلا يُناسبها مصدر
        الحدث. علاوة على ذلك لم تُعثر له على أدلة معجمية مستقلة بهذه الدلالة.

    - lemma: "حُكْم"
      source: stage1
      decision: removed
      decision_reason: >
        الحُكم في المعجمية العربية أصلُه القضاء والفصل، وهو في الاستعمال السياسي
        يُشير إلى ممارسة السلطة لا إلى حالة تقلّد المنصب. اختلاف الدلالة جوهري:
        الحُكم نشاط/فعل، بينما المجموعة تُعبِّر عن حالة كون المسؤول في السُّلطة.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
