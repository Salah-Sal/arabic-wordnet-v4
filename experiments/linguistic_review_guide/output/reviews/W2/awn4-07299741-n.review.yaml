stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية (سيل، طوفان) تفتقر إلى التشكيل الكامل."
      - "المجموعة تمثل استخداماً مجازياً لظواهر طبيعية، ويُفضّل إثراؤها بمترادفات مجازية أخرى شائعة في هذا السياق."
    observations: "المفهوم يعبر عن الكثرة الغامرة والمفاجئة (avalanche)، وهي دلالة تُستعار لها في العربية ألفاظ السيل والطوفان والفيض والوابل، وكل منها يضيف فارقاً دلالياً طفيفاً (nuance) يتعلق بطبيعة التدفق."
  blind_candidates:
    - lemma: "سَيْل"
      generation_method: majaz
      justification: "يُستخدم مجازاً للتعبير عن تتابع الأشياء وكثرتها بشكل غامر ومستمر كجريان الماء."
    - lemma: "طُوفَان"
      generation_method: majaz
      justification: "يدل على الكثرة العظيمة من الأشياء التي تطغى على ما حولها وتغمره."
    - lemma: "فَيْض"
      generation_method: majaz
      justification: "يعبر عن الزيادة والكثرة التي تفيض عن المعتاد، ويشيع في السياقات المعنوية والمادية."
    - lemma: "وَابِل"
      generation_method: majaz
      justification: "يُستعار من المطر الشديد للتعبير عن تلاحق الأشياء (كالأسئلة أو الرصاص) بكثافة وسرعة."

stage2_evidence:
  per_lemma:
    - lemma: "سَيْل"
      confirm:
        - text: "«(السَّيْل) المَاء الْكثير السَّائِل وَمَاء الْمَطَر إِذا جرى مسرعا فَوق سطح الأَرْض»"
          source: "المعجم الوسيط"
        - text: "«an avalanche of misfortunes: سَيْل؛ فَيْض؛ طوفان»"
          source: "المورد الحديث"
    - lemma: "طُوفَان"
      confirm:
        - text: "«(الطوفان) من كل شَيْء مَا كَانَ كثيرا أَو عَظِيما من الْأَشْيَاء أَو الْحَوَادِث بِحَيْثُ يطغى على غَيره»"
          source: "المعجم الوسيط"
    - lemma: "فَيْض"
      confirm:
        - text: "«(الْفَيْض) الْكثير الغزير يُقَال أَعْطَانَا غيضا من فيض قَلِيلا من كثير»"
          source: "المعجم الوسيط"
        - text: "«الفاء والياء والضاد أصل صحيح واحد يدل على جريان الشيء بسهولة، ثم يقاس عليه»"
          source: "مقاييس اللغة"
    - lemma: "وَابِل"
      confirm:
        - text: "«(الوابل) الْمَطَر الشَّديد الضَّخم الْقطر وَرجل وابل جواد يبل بالعطايا»"
          source: "المعجم الوسيط"
        - text: "«الوابل: كبار المطر لأنه يشتد وقعه على الأرض، وكل ثقيل وبيل»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "انْهِيَال"
      confirm:
        - text: "«الهاء والياء واللام كلمة واحدة تدل على دفع شيء يمكن كيله دفعا من غير كيل... ومنه قولهم: جاء بالهيل والهيلمان، أي الشيء الكثير»"
          source: "مقاييس اللغة"
        - text: "«(1) «أ», التَّيْهُور؛ الجُراف: «ب» كتلة ضخمة من ثلجٍ أو جليد أو صخر تنهار بسرعة على جانب جبل. «ج» سَيْل؛ فَيْض؛ طوفان an avalanche of misfortunes»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "سيل"
      decision: confirmed
      decision_reason: "كلمة أصيلة في المجموعة تعبر بدقة عن التدفق المتتابع للأشياء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَيْل"
    - lemma: "طوفان"
      decision: confirmed
      decision_reason: "كلمة أصيلة، والتعريف المعجمي يؤكد استخدامها لكل شيء كثير يطغى على غيره."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طُوفَان"
    - lemma: "فَيْض"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي وشائع للاستخدام المجازي بمعنى الوفرة والكثرة الغامرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَيْض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "وَابِل"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم بكثرة في اللغة المعاصرة للتعبير عن تلاحق الأشياء (مثل الأسئلة أو الانتقادات) بكثافة، وهو ما يطابق المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "وَابِل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "انْهِيَال"
      source: stage1
      decision: confirmed
      decision_reason: "الاسم المشتق من 'انهال' الذي يعبر عن صب الشيء بكثرة، وهو المعادل الدقيق لاستعارة الـ 'avalanche' في تتابع السقوط والتدفق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "انْهِيَال", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "ظهور مفاجئ لعدد هائل من الأشياء"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول لكنه يفتقر إلى صبغة التعريف المصطلحي التي تعكس طبيعة 'التدفق' و'التتابع' المتضمنة في المفهوم."
    authored:
      - type: terminological
        text: "تتابعٌ غامرٌ وكثيفٌ لعددٍ كبيرٍ من الأشياء يظهر فجأةً وبصورةٍ متلاحقة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "تتابعٌ غامرٌ وكثيفٌ لعددٍ كبيرٍ من الأشياء يظهر فجأةً وبصورةٍ متلاحقة."}
  examples:
    per_lemma:
      - lemma: "سَيْل"
        examples:
          - text: "تلقى المكتبُ الإعلاميُّ سيلاً من الرسائلِ بعد إعلانِ النتائج."
            type: usage
      - lemma: "طُوفَان"
        examples:
          - text: "واجهتِ الشركةُ طوفاناً من الشكاوى بسببِ العطلِ التقنيّ."
            type: usage
      - lemma: "فَيْض"
        examples:
          - text: "غمره فيضٌ من المشاعرِ الجيّاشةِ وهو يرى وطنهُ بعد غياب."
            type: usage
      - lemma: "وَابِل"
        examples:
          - text: "أمطرَ الصحفيون الوزيرَ بوابلٍ من الأسئلةِ الصعبة."
            type: usage
      - lemma: "انْهِيَال"
        examples:
          - text: "أدى فوزُ الفريقِ إلى انهيالِ العروضِ المغريةِ على لاعبيه."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "انهالتِ التبرعاتُ في سيلٍ غامرٍ لإغاثةِ المنكوبين."}

stage5_enrichment:
  per_entry:
    - lemma: "سَيْل"
      entry_id: "{auto}"
      root: "سيل"
      maqayis_quote: "«السِّينُ وَالْيَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى جَرَيَانٍ وَامْتِدَادٍ.»"
    - lemma: "طُوفَان"
      entry_id: "{auto}"
      root: "طوف"
      maqayis_quote: "«الطَّاءُ وَالْوَاوُ وَالْفَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى دَوَرَانِ الشَّيْءِ عَلَى الشَّيْءِ، وَأَنْ يُحَفَّ بِهِ.»"
    - lemma: "فَيْض"
      entry_id: "{auto}"
      root: "فيض"
      maqayis_quote: "«الْفَاءُ وَالْيَاءُ وَالضَّادُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى جَرَيَانِ الشَّيْءِ بِسُهُولَةٍ.»"
    - lemma: "وَابِل"
      entry_id: "{auto}"
      root: "وبل"
      maqayis_quote: "«الْوَاوُ وَالْبَاءُ وَاللَّامُ: أَصْلٌ يَدُلُّ عَلَى شِدَّةٍ فِي شَيْءٍ وَتَجَمُّعٍ.»"
    - lemma: "انْهِيَال"
      entry_id: "{auto}"
      root: "هيل"
      maqayis_quote: "«الْهَاءُ وَالْيَاءُ وَاللَّامُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى دَفْعِ شَيْءٍ يُمَكِنُ كَيْلُهُ دَفْعًا مِنْ غَيْرِ كَيْلٍ.»"
  per_sense:
    - lemma: "سَيْل"
      sense_id: "{auto}"
      nuance: "يوحي بالتدفق المستمر والسريع كجريان الماء في الوادي."
      mwe: false
    - lemma: "طُوفَان"
      sense_id: "{auto}"
      nuance: "يوحي بالكثرة الكاسحة التي تطغى وتغمر كل ما في طريقها."
      mwe: false
    - lemma: "فَيْض"
      sense_id: "{auto}"
      nuance: "يوحي بالوفرة التي تخرج عن نطاق الاحتواء وتفيض بجود وكرم."
      mwe: false
    - lemma: "وَابِل"
      sense_id: "{auto}"
      nuance: "يوحي بالتلاحق الشديد والضربات المتتابعة (كالرصاص أو المطر الغزير)."
