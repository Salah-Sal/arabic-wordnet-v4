          source: "المعجم الوسيط"
          addition: "الأوان بمعنى الحين المناسب لكنه عامّ غير مخصص للسياق الإعلامي"

stage3_analysis:
  per_lemma:
    - lemma: "وَقْت العَرْض"
      decision: confirmed
      decision_reason: >
        لمّة موجودة مقبولة. «وقت العرض» مركب إضافي مفهوم وشائع في الاستعمال العربي
        للدلالة على الزمن المحدد لبدء عرض فيلم أو برنامج. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يركّز على الزمن الفعلي الذي يبدأ فيه العرض دون التأكيد على بُعد الجدولة المسبقة.
        أعمّ من «توقيت العرض» وأكثر تداولاً في الحديث اليومي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَقْت العَرْض"

    - lemma: "تَوْقِيت العَرْض"
      source: stage1
      decision: confirmed
      decision_reason: >
        مؤيَّد بدليل من مسرد الإعلام والتواصل (ALECSO) حيث ورد مقابلاً لـ"show time".
        «التوقيت» أدق من «الوقت» لأنه مصدر «وقّت» بمعنى حدّد الوقت،
        فيتضمن بُعد الجدولة والتحديد المسبق الذي يطابق "scheduled" في التعريف.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يؤكد بُعد التحديد المسبق والجدولة. أكثر تخصصاً ودقةً من «وقت العرض»،
        ويُفضَّل في السياقات المهنية والإعلامية الرسمية.
      actions:
        - command: create_entry
          params: {lemma: "تَوْقِيت العَرْض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَوْعِد العَرْض"
      source: stage1
      decision: confirmed
      decision_reason: >
        «الموعد» ورد في المعجم الوسيط بمعنى الزمان المحدد والعهد، وهو شائع في الاستعمال
        الإعلامي العربي (مثلاً: «موعد عرض المسلسل»). المركب الإضافي مألوف ومتداول.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يحمل دلالة الالتزام والعهد الزمني بين المعروض والمشاهد.
        أكثر شيوعاً في سياق البرامج التلفزيونية المنتظمة («موعد عرض الحلقة»).
      actions:
        - command: create_entry
          params: {lemma: "مَوْعِد العَرْض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "سَاعَة العَرْض"
      source: stage1
      decision: removed
      decision_reason: >
        «ساعة» عامّ جداً ولا يحمل دلالة التحديد المسبق أو الجدولة.
        كما أنه قد يُفهم بمعنى مدة العرض (ساعة من الزمن) لا موعده، فيقع لبس دلالي.
        لا أدلة معجمية تؤيد هذا المركب بوصفه وحدة اصطلاحية.

    - lemma: "أَوَان العَرْض"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ «أوان» فصيح تراثي لكنه لا يُستعمل في السياق الإعلامي المعاصر.
        استعماله في هذا المقام يبدو متكلَّفاً وغير مألوف. لا أدلة معجمية تؤيده
        بوصفه مصطلحاً إعلامياً ثابتاً.

