stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «وقت العرض» غير مشكّلة"
      - "المجموعة تحتوي لمّة واحدة فقط، ما يحدّ من التغطية المعجمية"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزية"
    observations: >
      المفهوم يدور حول النقطة الزمنية المحددة لبدء عرض ترفيهي (فيلم، برنامج تلفزيوني...).
      هذا مفهوم حديث مرتبط بالثقافة الإعلامية، لكنّ العربية تملك أدوات تركيبية غنية
      للتعبير عنه عبر مركبات إضافية من ألفاظ الزمن مع لفظ «العرض».
      الرابطة المعنوية الأساسية هي: زمن محدد + بداية + ترفيه/عرض.
  blind_candidates:
    - lemma: "مَوْعِد العَرْض"
      generation_method: tarkib
      justification: >
        مركب إضافي من «موعد» (مِفْعِل من وعد، بمعنى الزمان المحدد) و«العرض».
        «الموعد» يحمل دلالة التحديد المسبق والجدولة، وهو ما يطابق معنى الـ"scheduled"
        في التعريف الإنجليزي.
    - lemma: "تَوْقِيت العَرْض"
      generation_method: tarkib
      justification: >
        مركب إضافي من «توقيت» (مصدر وقّت يوقّت، أي حدّد الوقت) و«العرض».
        «التوقيت» أدق من «الوقت» لأنه يتضمن معنى التحديد والجدولة.
    - lemma: "سَاعَة العَرْض"
      generation_method: tarkib
      justification: >
        مركب إضافي من «ساعة» (بمعنى اللحظة الزمنية) و«العرض».
        شائع في الاستعمال العامّ لكنه أقل تخصصاً.
    - lemma: "أَوَان العَرْض"
      generation_method: tarkib
      justification: >
        مركب إضافي من «أوان» (الحين والوقت المناسب) و«العرض».
        لفظ تراثي فصيح لكنه قد يبدو أدبياً أكثر من كونه مصطلحاً إعلامياً.

