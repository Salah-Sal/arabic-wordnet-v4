      reason: >
        التعريف الحالي ترجمة شبه حرفية من الإنجليزية. عبارة «ترفيه ما» ركيكة في العربية،
        والأسلوب لا يتوافق مع المعجم الوسيط. يحتاج إعادة صياغة بأسلوب عربي سلس.
