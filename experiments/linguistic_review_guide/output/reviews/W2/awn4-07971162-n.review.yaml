stage1_review:
  assessment:
    concerns:
      - "المفهوم عبارة عن مركب إضافي حر (Phraset) وليس مصطلحاً معجمياً مستقلاً."
    observations: "المفهوم يمثل دلالة واضحة ومباشرة لـ 'مجموعة من الزجاجات'. في اللغة العربية، يعبر عن هذا المفهوم باستخدام مركب إضافي نظراً لغياب مفردة واحدة تصف هذا المفهوم بدقة."
  blind_candidates:
    - lemma: "مَجْمُوعَةُ زُجَاجَاتٍ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر بدقة عن تجميع لعدد من الزجاجات، وهو الترجمة المباشرة للمفهوم."
    - lemma: "تَشْكِيلَةُ قَنَانٍ"
      generation_method: tarkib
      justification: "مركب إضافي؛ فالتشكيلة تدل على التنوع والتجميع، والقناني هي القوارير."
    - lemma: "مَجْمُوعَةُ قَوَارِيرَ"
      generation_method: tarkib
      justification: "استخدام كلمة 'قوارير' الفصيحة بدلاً من زجاجات لتشكيل مركب إضافي دقيق."
    - lemma: "تَجْمِيعَةُ زُجَاجَاتٍ"
      generation_method: tarkib
      justification: "استخدام 'تجميعة' كمصدر دال على الهيئة أو حاصل الجمع."

stage2_evidence:
  per_lemma:
    - lemma: "مَجْمُوعَةُ زُجَاجَاتٍ"
      expands:
        - text: "«لفظ عام يطلق على مجموع عناصر منسجمة تكون وحدة»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات"
          addition: "يثبت دلالة كلمة 'مجموعة'."
        - text: "«القطعة من الزجاج القارورة»"
          source: "المعجم الوسيط"
          addition: "يثبت دلالة كلمة 'زجاجة'."
    - lemma: "تَشْكِيلَةُ قَنَانٍ"
      evidence_status: "no_material_found"
    - lemma: "مَجْمُوعَةُ قَوَارِيرَ"
      evidence_status: "no_material_found"
    - lemma: "تَجْمِيعَةُ زُجَاجَاتٍ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مجموعة زجاجات"
      decision: confirmed
      decision_reason: "المركب الإضافي يمثل الترجمة الأدق والمباشرة للمفهوم، بالرغم من كونه تركيباً حراً (Phraset)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوعَةُ زُجَاجَاتٍ"

    - lemma: "مَجْمُوعَةُ زُجَاجَاتٍ"
      source: stage1
      decision: removed
      decision_reason: "متطابق مع اللمة الموجودة في المجموعة بعد التشكيل."

    - lemma: "تَشْكِيلَةُ قَنَانٍ"
      source: stage1
      decision: removed
      decision_reason: "مفهوم 'تشكيلة' يميل إلى معنى التنويع أكثر من مجرد التجميع، و'مجموعة زجاجات' أكثر شيوعاً ومباشرة."

    - lemma: "مَجْمُوعَةُ قَوَارِيرَ"
      source: stage1
      decision: removed
      decision_reason: "بالرغم من فصاحة 'قوارير'، إلا أن 'زجاجات' تظل شائعة ووافية بالغرض وموجودة مسبقاً في اللمات."

    - lemma: "تَجْمِيعَةُ زُجَاجَاتٍ"
      source: stage1
      decision: removed
      decision_reason: "كلمة 'مجموعة' أوضح وأكثر شيوعاً واستقراراً من 'تجميعة'."

stage4_content:
  definition:
    current: "مجموعة من الزجاجات"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويمثل المعنى المطلوب بصيغة سليمة."
  examples:
    per_lemma:
      - lemma: "مَجْمُوعَةُ زُجَاجَاتٍ"
        examples:
          - text: "يَعْرِضُ الْمَتْحَفُ مَجْمُوعَةَ زُجَاجَاتٍ قَدِيمَةٍ تَعُودُ لِلْقَرْنِ التَّاسِعِ عَشَرَ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-07971162-n", text: "يَعْرِضُ الْمَتْحَفُ مَجْمُوعَةَ زُجَاجَاتٍ قَدِيمَةٍ تَعُودُ لِلْقَرْنِ التَّاسِعِ عَشَرَ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يَعْرِضُ الْمَتْحَفُ مَجْمُوعَةَ زُجَاجَاتٍ قَدِيمَةٍ تَعُودُ لِلْقَرْنِ التَّاسِعِ عَشَرَ."}

