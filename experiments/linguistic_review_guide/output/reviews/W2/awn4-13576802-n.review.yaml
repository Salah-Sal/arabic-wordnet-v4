        key: note
        value: '{"nuance":"يختص بوقوع الأجزاء كالأوراق والشعر بشكل متتابع.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح عام يشمل إلقاء الريش أو الجلد أو أي أجزاء أخرى بشكل دوري.","mwe":false}'
