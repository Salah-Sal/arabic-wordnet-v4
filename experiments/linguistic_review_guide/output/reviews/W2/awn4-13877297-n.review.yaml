# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13877297-n (antipode / direct opposite)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «المقابل المباشر» مقتضب جداً ولا يميّز المفهوم عن الضدّ أو العكس"
      - "المجموعة تحتوي على لمّة واحدة فقط (نَقِيض)، وقد يكون هناك مرادفات مناسبة"
    observations: "المفهوم يدلّ على الكيان الذي يقع في أقصى درجات التقابل مع كيان آخر، وهو مصطلح فلسفي ومنطقي راسخ في التراث العربي. المقصود هنا ليس العلاقة (التضادّ) بل الطرف المقابل ذاته. يحتاج التعريف إلى تحسين ليعكس هذا التمييز."
  blind_candidates:
    - lemma: "ضِدّ"
      generation_method: ishtiqaq
      justification: "من جذر ض د د، الضِّدّ هو ما يخالف الشيء ويقابله، وهو أكثر الألفاظ شيوعاً للدلالة على المقابل"
    - lemma: "مُقَابِل"
      generation_method: ishtiqaq
      justification: "من جذر ق ب ل على وزن مُفَاعِل، اسم فاعل يدلّ على ما يقع قبالة الشيء ويعارضه"
    - lemma: "عَكْس"
      generation_method: ishtiqaq
      justification: "من جذر ع ك س، يدلّ على قلب الشيء وردّه إلى خلاف وجهته، فالعكس هو المقلوب والمعكوس"
    - lemma: "نَقِيضَة"
      generation_method: ishtiqaq
      justification: "من جذر ن ق ض على وزن فَعِيلَة، تأنيث النقيض، تُستعمل في الفلسفة والمنطق والشعر للدلالة على القضية أو القصيدة المعارِضة"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "نَقِيض"
      confirm:
        - text: "«المخالف. (نقيض الدعوى): (في الفلسفة): قضيَّة تُعارِض دَعْوًى معيَّنة»"
          source: "المعجم الوسيط"
        - text: "«(النقيض) الْمُخَالف يُقَال فلَان نقيضك وَهَذَا القَوْل نقيض ذَاك»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«النَّقيض: نقيض كل شيء رفعُه، والنقيضان الأمران المتمانعان بالذات بحيث لا يمكن اجتماعهما بوجه كالإيجاب والسَّلب»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«نقيض كل شيء: رفع تلك القضية، فإذا قلنا: كل إنسان حيوان بالضرورة، فنقيضها: أنه ليس كذلك»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«النّقيض: Contrary, opposite, antagonist — قال العلماء النقيضان الأمران المتمانعان بالذات أي الأمران اللذان يتمانعان ويتدافعان»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«نقيض. — antipode»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد المقابلة المباشرة مع المصطلح الإنجليزي antipode"
        - text: "«والنقيضان (فِي الْمنطق) المتناقضان»"
          source: "المعجم الوسيط (هورماني)"
          addition: "يبيّن الاستعمال المنطقي المتخصص حيث النقيضان = المتناقضان لا المتضادّان"

    - lemma: "ضِدّ"
      confirm:
        - text: "«الضِّدّ: المخالِفُ والمُنافسُ. كلُّ شيءٍ خالفَ شيئًا ليغْلِبَهُ»"
          source: "المعجم الكبير"
        - text: "«ضِدُّ الشَّيْءِ: الذي يَضَادُّه ويُخَالِفُه»"
          source: "المحيط في اللغة للصاحب بن عباد"
        - text: "«الضِّدّ: الْمُخَالف والمنافي والمثل والنظير والكفء»"
          source: "المعجم الوسيط (هورماني)"
      contradicts:
        - text: "«الضِّدّ: المِثْلُ والنَّظيرُ والكفْءُ»"
          source: "المعجم الكبير"
          conflict: "لفظ «ضِدّ» من الأضداد في اللغة: يدلّ على المخالف وعلى المثل معاً، مما يُضعف دقته كمصطلح للمقابل المباشر"
        - text: "«الخلاف أعم من الضد، لأن كل ضدين مختلفان ولا عكس»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الضدّ أخصّ من المخالفة لكنه أعمّ من النقيض في المنطق (الضدّان قد يرتفعان معاً بخلاف النقيضين)"

    - lemma: "مُقَابِل"
      confirm:
        - text: "«مقابل — opposite»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      contradicts:
        - text: "«(1) مواجِه؛ مقابل the shop opposite to ours — (6) الضِّدّ؛ النقيض»"
          source: "المورد الحديث (2008)"
          conflict: "المُقابِل أعمّ بكثير: يدلّ على المواجهة المكانية والرياضية، وليس محصوراً في التقابل الدلالي المباشر"

    - lemma: "عَكْس"
      evidence_status: "no_material_found"

    - lemma: "نَقِيضَة"
      expands:
        - text: "«نقيضة — antithesis»"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
          addition: "النقيضة تُستعمل في الفلسفة بمعنى antithesis لا antipode، وهي مفهوم مختلف (الأطروحة المضادة لا المقابل المباشر)"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "نَقِيض"
      decision: confirmed
      decision_reason: "لفظ «نَقِيض» مؤكَّد بأدلة معجمية غزيرة من المعاجم الكلاسيكية والحديثة. المعجم الوسيط يعرّفه بـ«المخالف»، وكتب المصطلحات تعرّفه بأنه «ما يتمانع مع الشيء بالذات». المورد الحديث يقابله مباشرة بـantipode. الوزن فَعِيل صفة مشبهة تدلّ على الثبات، مما يناسب المفهوم المجرد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَقِيض"

    - lemma: "ضِدّ"
      source: stage1
      decision: removed
      decision_reason: "رغم شيوع «ضِدّ» للدلالة على المقابل، فإنه لفظ من الأضداد في اللغة (يدلّ على المخالف وعلى المِثل معاً)، مما يُضعف دقته. كذلك فإن الضدّين في المنطق قد يرتفعان معاً (كالأحمر والأسود)، بخلاف النقيضين اللذين لا يجتمعان ولا يرتفعان. والأهم أن المقولة الأعلى (hypernym) هي «تَضَادّ» فلا يصح أن يكون الضدّ مرادفاً للنقيض وهو أعمّ منه."
      evidence_assessment:
        case: mixed

    - lemma: "مُقَابِل"
      source: stage1
      decision: removed
      decision_reason: "لفظ عامّ جداً يدلّ على المواجهة المكانية والرياضية والمجازية، ولا يختصّ بالتقابل الدلالي المباشر. لا يصلح مصطلحاً دقيقاً لمفهوم antipode."
      evidence_assessment:
        case: mixed

    - lemma: "عَكْس"
      source: stage1
      decision: removed
      decision_reason: "العكس يدلّ على القلب والردّ إلى خلاف الوجهة، وهو أقرب إلى مفهوم reverse منه إلى opposite/antipode. لا تسعفه الأدلة المعجمية في هذا السياق."
      evidence_assessment:
        case: no_material

    - lemma: "نَقِيضَة"
      source: stage1
      decision: removed
      decision_reason: "النقيضة تُستعمل في الفلسفة بمعنى antithesis (الأطروحة المضادة) وفي الشعر بمعنى القصيدة المعارِضة، وهي مفهوم مختلف عن antipode (المقابل المباشر). كذلك فإنها مؤنث في حين أن المجموعة تحتاج إلى اسم مذكر عامّ."
      evidence_assessment:
        case: mixed


