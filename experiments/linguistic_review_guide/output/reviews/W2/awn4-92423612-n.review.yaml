              تُعدُّ الأُسْتُرَالِيَّةُ مزيجاً فريداً من القِيَمِ الديمقراطيَّةِ والانفتاحِ الثقافيِّ وروحِ المغامرةِ
              التي ورثَها المجتمعُ الأسترالي عبرَ مسيرتِه التاريخيَّة.
