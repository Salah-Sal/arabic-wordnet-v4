            إلى أستراليا أو يُعرَّفُ بها.
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >
            مجموعُ الصفاتِ والقِيَمِ والأنماطِ السلوكيَّةِ التي تُشكِّلُ الهُوِيَّةَ الأستراليَّةَ وتُميِّزُها
            عن سائرِ الهُوِيَّاتِ القوميَّة، وتشملُ الموروثَ الثقافيَّ البريطانيَّ ومنظومةَ قِيَمِ الشعوبِ
            الأبوريجينيَّةِ الأصليَّةِ وأثرَ الهجراتِ المتعاقبة.

  examples:
