# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «الطابع الأسترالي» مركّبةٌ وصفيَّةٌ تفشل اختبار السكّ: يصحّ إبدال «الطابع» بـ«السمة» أو «الخاصية» مع بقاء الوصف سليماً، مما يكشف أنَّها عبارة وصفية حرّة لا مصطلح مُثبَّت"
      - "«الطابع الأسترالي» غير مُسجَّل بوصفه وحدةً معجميَّةً ثابتةً في أيٍّ من المعاجم الكبرى، فيفشل اختبار التثبيت المعجمي"
      - "التعريف الحالي «حالة أو جودة كون الشيء أسترالياً» ترجمةٌ حرفيَّةٌ آليَّةٌ من الإنجليزية، مفتقرةٌ إلى أسلوب المعجم العربي"
      - "المفهوم ينتمي إلى فئة «الفجوة المعجمية» (lexical gap): يُدرَكُ في السياق العربي لكن يعوزه مصطلحٌ أحاديُّ الكلمة"
    observations: >
      المجموعةُ تمثِّلُ مفهومَ «الأسترالية» بوصفها خاصيَّةً قوميَّةً مجرَّدةً — أي مجموعَ الصفاتِ الجوهريَّةِ التي تميِّزُ ما هو أسترالي.
      في العربية، تُعالَجُ المفاهيمُ المماثلةُ بأسلوبَيْن: إمَّا بالمصدر الصناعي (الصفةُ النسبية + ياء التجريد) كـ«عَرُوبَة» و«أَمْريكِيَّة»،
      وإمَّا بمركَّب وصفي من نوع «الطابع القومي». المعجمُ الكبيرُ يُوثِّقُ «الطَّابِعُ القَوْمِيّ: خصائصُ ظاهرةٌ تميِّزُ مجتمعًا ما»،
      مما يُقدِّمُ نموذجاً قياسيَّاً ذا دلالة. غيرَ أنَّ المصدرَ الصناعي «أُسْتُرَالِيَّة» أدقُّ في الإحالة على المجرَّد دون الوصف،
      ويحقِّقُ الاشتقاقيَّةَ ويُسرَ التداوُل. علاقة الاشتمال مع المُشتَرَك الأعلى «خَاصِّيَّة جَوْهَرِيَّة» صحيحةٌ ودقيقة.

  blind_candidates:
    - lemma: "أُسْتُرَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدرٌ صناعيٌّ مُشتَقٌّ من الصفة النسبية «أُسْتُرَالِيّ» بإضافة ياء النسبة وتاء التجريد، قياساً على الأوزان العربية
        المُنتِجة للمجرَّدات القومية: «أَمْريكِيَّة»، «فَارِسِيَّة»، «يَابَانِيَّة»، ومنه «عَرُوبَة» بنمط مختلف.
        يدلُّ بشكلٍ مباشرٍ على حالة الانتساب إلى أستراليا وما يرافقُها من صفاتٍ وطنيَّةٍ وثقافيَّة.

    - lemma: "الجَوْهَرُ الأُسْتُرَالِيُّ"
      generation_method: tarkib
      justification: >
        مركَّبٌ وصفيٌّ (wasfi) من «جَوْهَر» بمعنى الذاتِ الحقيقيَّةِ والسِّمةِ الأصيلة + الصفة النسبية،
        يُشيرُ إلى الجانبِ الجوهريِّ غير العَرَضيِّ من الانتساب الأسترالي.

    - lemma: "السِّمَةُ الأُسْتُرَالِيَّة"
      generation_method: tarkib
      justification: >
        مركَّبٌ وصفيٌّ (wasfi) من «سِمَة» (الخاصيَّةُ المميِّزة والعلامةُ الفارقة) + الصفة النسبية،
        بديلٌ للمركَّبِ الموجود بمُحسِّناتٍ دلاليَّة: «سِمَة» أدقُّ من «طابع» في الإحالة على الخصيصة الهُوِيَّاتية.

    - lemma: "الخُصُوصِيَّةُ الأُسْتُرَالِيَّة"
      generation_method: tarkib
      justification: >
        مركَّبٌ وصفيٌّ (wasfi) من «خُصُوصِيَّة» (الصفةُ الفردانيَّةُ المميِّزة عن الغير) + الصفة النسبية،
        يستحضرُ البُعدَ التمييزيَّ لما يجعلُ الأسترالي أسترالياً بحيثيَّةٍ ثقافيَّة.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "الطابع الأسترالي"
      expands:
        - text: >
            «الطَّابَعُ: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ. [...]
            الطَّابِعُ القَوْمِيّ: خصائصُ ظاهرةٌ تميِّزُ مجتمعًا ما, كقولنا: إن المصريّ يمتاز بكذا وكذا»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            يُوثِّقُ المعجمُ الكبيرُ النموذجَ القياسيَّ «الطابع القومي» بمعنى «خصائص ظاهرة تميّز مجتمعاً»،
            مما يُعطي «الطابع الأسترالي» سنداً قياسياً. بيد أنَّ «الطابع + صفة قومية» هيكلٌ إسنادي وليس
            مصطلحاً معجمياً مُثبَّتاً.
        - text: >
            «(الطَّابَع): الطبيعة. يقال: له طَابَع حسن.»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: >
            يُقرِّرُ المعجمُ الوسيطُ أنَّ «الطابع» يُرادفُ «الطبيعة»، مما يُوسِّعُ دلالتَه لتشملَ
            الطبيعةَ الكامنةَ في الهوية الأسترالية.

    - lemma: "أُسْتُرَالِيَّة"
      contradicts:
        - text: >
            «(1) الأستراليّ: أحد أبناء أستراليا
            (2) الأسترالية: إحدى لغات أستراليا الأصلية
            (3) أسترالي.»
          source: "المورد الحديث (2008) — Al-Mawrid Al-Hadeeth"
          conflict: >
            المعجمُ يُحدِّدُ دلالةَ «الأسترالية» في معنيَيْن: (١) المرأةُ الأسترالية، (٢) اللغةُ الأستراليَّة الأصليَّة.
            وهذا يُبيِّنُ وجودَ اشتراكٍ لفظيٍّ ينافسُ توظيفَ «أسترالية» مجرَّداً بمعنى «حالة الانتساب»، لكنَّه
            لا يمنعُ قياسيَّةَ المصدر الصناعي في السياق المجرَّد.

    - lemma: "الجَوْهَرُ الأُسْتُرَالِيُّ"
      evidence_status: "no_material_found"

    - lemma: "السِّمَةُ الأُسْتُرَالِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الخُصُوصِيَّةُ الأُسْتُرَالِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "الطابع الأسترالي"
      decision: removed
      decision_reason: >
        أولاً — اختبار السكّ: يصحُّ إبدالُ «الطابع» بـ«السمة» أو «الخاصية» أو «الطبيعة» مع بقاء العبارة صالحةً وصفاً
        — هذا يكشفُ أنَّها تعبيرٌ تركيبيٌّ وصفيٌّ لا مصطلحٌ مسكوك.
        ثانياً — اختبار التثبيت المعجمي: لم يُسجِّلِ المعجمُ الكبيرُ ولا الوسيطُ «الطابع الأسترالي» وحدةً معجميَّةً ثابتة،
        وإنَّما وثَّقا نموذجَ «الطابع القومي» الذي هو هو أيضاً تعبيرٌ إسنادي وليس مُدرجاً كمصطلح مُعجَّم.
        ثالثاً — بديلٌ اشتقاقيٌّ أوفى: «أُسْتُرَالِيَّة» (المرحلة ١) يُغني عنه بمصطلحٍ أحاديِّ الكلمة وفق
        القياس الصرفي العربي المُنتِج.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أُسْتُرَالِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصدرٌ صناعيٌّ على النمط الاشتقاقي العربي المُنتِج (صفة نسبية + ياء التجريد) قياساً على:
        «أَمْريكِيَّة» (Americanness)، «فَارِسِيَّة» (Persianness)، «يَابَانِيَّة» (Japaneseness).
        يُحقِّقُ معايير جودة المصطلح: الاشتقاقيَّة (وزن مطَّرد)، يُسر التداول (أحادية الكلمة)، الملاءمة
        (مُنسجمٌ مع المستوى الدلالي لمفهوم الهُوِيَّةِ القومية).
        الاشتراكُ اللفظيُّ مع «الأسترالية» بمعنى «اللغة الأصلية» (المورد الحديث) محدودٌ بالسياق؛
        التعريفُ والمحيطُ الاصطلاحيُّ يُرسِّخان المعنى المجرَّد دون التباس.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمَّةُ الوحيدةُ المؤكَّدةُ في هذه المجموعة؛ تُمثِّلُ المجرَّدَ من حالةِ الانتساب إلى أستراليا
        بصياغةٍ صرفيَّةٍ تجريديَّة، لا الصفةَ العَرَضيَّة (أُسْتُرَالِيّ) ولا الفرد المنتسب إليها.
      actions:
        - command: create_entry
          params:
            lemma: "أُسْتُرَالِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "الجَوْهَرُ الأُسْتُرَالِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        مركَّبٌ وصفيٌّ يفشل اختبار السكّ: «الجوهرُ الأسترالي» و«الكنهُ الأسترالي» كلاهما صالحٌ وصفاً.
        لا أدلَّةَ على تثبيتٍ معجميٍّ. «أُسْتُرَالِيَّة» يُغني عنه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "السِّمَةُ الأُسْتُرَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مركَّبٌ وصفيٌّ يفشل اختبار السكّ: «السمةُ الأسترالية» و«الخاصيَّةُ الأسترالية» مترادفتان وصفاً.
        لا أدلَّةَ على تثبيتٍ معجميٍّ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "الخُصُوصِيَّةُ الأُسْتُرَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مركَّبٌ وصفيٌّ يفشل اختبار السكّ بالنمط ذاته. لا أدلَّةَ على تثبيتٍ معجميٍّ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "حالة أو جودة كون الشيء أسترالياً"
    assessment:
      decision: revise
      reason: >
        التعريفُ الحاليُّ ترجمةٌ حرفيَّةٌ آليَّةٌ من الإنجليزية (state or quality of being Australian) مفتقرةٌ إلى:
        (١) جنسٍ قريبٍ محدَّد، (٢) فصلٍ نوعيٍّ فارق، (٣) أسلوبِ المعجم العربي. كما أنَّه يدورُ حولَ
        الصفة المُعرَّفة (أُسْتُرَالِيَّة = كون الشيء أسترالياً) وهو تعريفٌ دائريٌّ.
    authored:
      - type: terminological
        text: >
          خاصيَّةٌ جوهريَّةٌ تجمعُ السماتِ الثقافيَّةَ والوطنيَّةَ والاجتماعيَّةَ المميِّزةَ لكلِّ ما ينتسبُ
          إلى أستراليا أو يُعرَّفُ بها.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مجموعُ الصفاتِ والقِيَمِ والأنماطِ السلوكيَّةِ التي تُشكِّلُ الهُوِيَّةَ الأستراليَّةَ وتُميِّزُها
          عن سائرِ الهُوِيَّاتِ القوميَّة، وتشملُ الموروثَ الثقافيَّ البريطانيَّ ومنظومةَ قِيَمِ الشعوبِ
          الأبوريجينيَّةِ الأصليَّةِ وأثرَ الهجراتِ المتعاقبة.
    actions:
      - command: update_definition
        params:
