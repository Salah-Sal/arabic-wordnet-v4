# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # ── أ. التوليد الأعمى (قبل الاطلاع على اللمات الموجودة) ──
  # المدخل: synset_info_masked.yaml — التعريف فقط:
  # «حالة أو شرط كون الشيء سوفيتياً»
  # المفهوم: الخاصية المجردة لكون الشيء سوفيتياً (Sovietness)
  blind_candidates:
    - lemma: "السُّوفِيَتِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بإضافة ياء النسب والتاء المربوطة (-يَّة) إلى الصفة المُعرَّبة
        «سوفيتي»، وهو قياس عربي منتج لتحويل الصفات إلى مفاهيم مجردة
        (كالعربية، والإسلامية، والمادية). يُعبِّر عن خاصية «كون الشيء سوفيتياً»
        بصيغة اسم مجرد مفرد يقبل التعريف والنسبة.

    - lemma: "الطَّابَعُ السُّوفِيَتِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (اسم + صفة): «الطابع» بمعنى الخُلُق الغالب والعلامة المميِّزة
        (معجم الوسيط) + «السوفيتي» نسبةً إلى السوفيت. يُعبِّر عن
        «الخاصية السوفيتية» تعبيراً مركَّباً شائعاً في الخطاب السياسي العربي.

    - lemma: "الصِّبْغَةُ السُّوفِيَتِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي: «الصبغة» (اللون والطابع والخاصية الغالبة) + «السوفيتية».
        تُستعمل «الصبغة» في العربية للدلالة على الطابع والميزة الغالبة،
        كـ«صبغة إسلامية» و«صبغة ثورية»، وهو ما يناسب مفهوم «الخاصية السوفيتية».

    - lemma: "الرُّوحُ السُّوفِيَتِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي: «الروح» (الجوهر والمضمون الكامن) + «السوفيتية»،
        يُعبِّر عن الطابع الجوهري لما هو سوفيتي من حيث الفكر والنهج. أكثر
        ميلاً نحو البُعد الأيديولوجي مقارنةً بـ«الطابع» و«الصبغة».

  # ── ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل) ──
  assessment:
    concerns:
      - "اللمّة الموجودة «الطابع السوفيتي» خالية من التشكيل — تستوجب update_lemma بتشكيل كامل."
      - >
        التعريف «حالة أو شرط كون الشيء سوفيتياً» ترجمة حرفية للإنجليزية
        (the state or quality of being Soviet)، وفيه دور لغوي؛ إذ تظهر «سوفيتياً»
        في المُعرَّف والتعريف معاً.
      - >
        اللمّة «الطابع السوفيتي» تركيب وصفي حرّ يُحتمَل ألا يكون وحدةً معجمية
        مسكوكة: يصحّ «الطابع الأمريكي» و«الطابع الروسي» بالتركيبة ذاتها،
        مما يُضعف ادعاء التثبيت المعجمي.
      - >
        التهجئة السائدة في العربية المعيارية هي «سوفياتي» (بالألف، من الروسية
        советский)، لا «سوفيتي» (من الفرنسية soviétique)؛ وكلتاهما
        مستخدمتان، لكن المورد الحديث (2008) يوثّق «السوفياتية» بالألف.
      - "لا لمّة مفردة (single-word) في المجموعة تحمل المفهوم بصيغة اسم مجرد."
    observations: >
      تمثّل هذه المجموعة مفهوماً تاريخياً-سياسياً محدداً هو «السوفيتية»
      (Sovietness) بوصفه خاصيةً مجردة. ترتيبها تحت «خاصّيّة جَوْهَرِيَّة»
      معقول من حيث التصنيف المعجمي، غير أن «الجوهرية» قد تكون وصفاً مُبالَغاً
      فيه لمفهوم أيديولوجي تاريخي. اللمّة الموجودة («الطابع السوفيتي») تُعبِّر
      عن المفهوم تعبيراً سياقياً شائعاً في الكتابة السياسية والتاريخية العربية،
      لكنها تركيب وصفي حرّ لا مصطلح مسكوك. الأنسب لغوياً: إضافة المصدر
      الصناعي «السوفيتية» (أو «السوفياتية» بحسب التهجئة المعيارية)
      لمّةً مفردةً مجردة توازي الاسم الإنجليزي Sovietness/Sovietism.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  # ── استراتيجية الاستعلام المستخدمة ──
  # الاستعلام ١: مطابقة دفعية لمكوّنات اللمّات (الطابع، سوفيتي، السوفيتية...)
  # الاستعلام ٢: جسر إنجليزي (Sovietness, Soviet, Sovietism)
  # الاستعلام ٣: FTS عربي (سوفييت، سوفيت، شيوعي)
  # الاستعلام ٤: مقاييس اللغة — جذر طبع

  per_lemma:

    # ── اللمّة الموجودة: الطابع السوفيتي ──
    - lemma: "الطابع السوفيتي"
      confirm:
        - text: >
            «الطابَع: الطبيعة. [و] الطَّابَعُ: ما يُطبَع به أو يُخْتَمُ؛
            الميسم؛ الخُلُق الغالب. طابع البريد: ما يُلصقُ بالرسائل وغيرها
            من بطاقاتٍ صغيرة ترسمها الدولة.»
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (1998)"
        - text: >
            «الطَّابِعُ والطَّابَعُ: الخاتَمُ الذي يُخْتَمُ بـه على الأشياء.
            العَلَامَةُ الْمُمَيِّزَةُ. يقال: طابَع الشاة.»
          source: "المعجم الكبير — مجمع اللغة العربية (طبعة أحدث)"
        - text: >
            «الطابع: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ.»
          source: "المعجم الكبير — مجمع اللغة العربية"
      expands:
        - text: >
            «(طَبَعَ) الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ
            مَثَلٌ عَلَى نِهَايَةٍ يَنْتَهِي إِلَيْهَا الشَّيْءُ حَتَّى
            يُخْتَمَ عِنْدَهَا، يُقَالُ: طَبَعْتُ عَلَى الشَّيْءِ طَابَعًا.
            ثُمَّ يُقَالُ عَلَى هَذَا: طَبْعُ الْإِنْسَانِ وَسَجِيَّتُهُ.
            وَالطَّابَعُ: الْخَاتَمُ يُخْتَمُ بِهِ. وَالطَّابِعُ: الَّذِي يَخْتِمُ.»
          source: "مقاييس اللغة — ابن فارس (ت. 395هـ)"
          addition: >
            يربط ابن فارس «الطابع» بمعنى الختم والإكمال والسمة الجوهرية
            المنتهى إليها، مما يدعم استخدامه للدلالة على الخاصية الغالبة.

    # ── المرشح الأول: السوفيتية ──
    - lemma: "السُّوفِيَتِيَّة"
      confirm:
        - text: >
            «السوفياتية: «أ» نظام الحكم السوفياتي. «ب» الشيوعية.»
            [ترجمة للمدخل الإنجليزي: Sovietism]
          source: "المورد الحديث — روحي البعلبكي (2008)"
      expands:
        - text: >
            «Soviet: (1) «أ»، السوفيات: «ب» مجلس حكوميّ منتَخَب في بلد
            شيوعيّ. «ج» pl. cap.: البلاشفة. «د» pl. cap.: شعب الاتحاد
            السوفياتي؛ وبخاصة: قادتُه السياسيّون والعسكريون.
            (2) cap. ا.ك: سوفياتيّ.»
          source: "المورد الحديث — روحي البعلبكي (2008)"
          addition: >
            يُثبت المورد الحديث صيغة «السوفياتية» (بالألف) مرادفةً لـ«Sovietism»
            بمعنى «نظام الحكم السوفياتي والشيوعية». التهجئة بالألف («سوفياتي»)
            أشيع في المعاجم الحديثة من التهجئة بدونها («سوفيتي») الواردة في AWN4.

    # ── المرشح الثاني: الطابع السوفيتي ──
    # (نفس اللمّة الموجودة — تمّ توثيق أدلته أعلاه)

