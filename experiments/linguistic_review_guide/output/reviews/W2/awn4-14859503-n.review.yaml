stage1_review:
  assessment:
    concerns:
      - غياب التشكيل الكامل عن اللمات الحالية.
      - اللمة "مادة مخففة" عبارة وصفية، بينما يفضل استخدام "مخفف" ككلمة مفردة في السياقات التقنية.
      - الحاجة إلى لمات أكثر تخصصاً (مثل مرقق وممدد) لتغطية الجوانب التقنية المختلفة (الدهانات، الكيمياء).
    observations: "المجموعة تغطي مفهوم المواد التي تضاف لتقليل التركيز أو اللزوجة. اللمات الحالية صحيحة دلالياً لكنها تفتقر للضبط الصرفي والتمايز التقني."
  blind_candidates:
    - lemma: "مُخَفِّف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'خفف'، وهو المصطلح القياسي للمادة التي تقلل التركيز أو اللزوجة."
    - lemma: "مَادَّةٌ مُخَفِّفَة"
      generation_method: tarkib
      justification: "تركيب وصفي شائع الاستخدام في الأدبيات الكيميائية والتقنية."
    - lemma: "مُرَقِّق"
      generation_method: ishtiqaq
      justification: "يستخدم خاصة في سياق الدهانات (thinner) للإشارة إلى المادة التي ترقق قوام السائل."
    - lemma: "مُمَدِّد"
      generation_method: ishtiqaq
      justification: "يستخدم في الكيمياء للإشارة إلى المادة التي تزيد من حجم المحلول مع تقليل تركيزه (diluent)."

stage2_evidence:
  per_lemma:
    - lemma: "مُخَفِّف"
      confirm:
        - text: "أية مادة سائلة أو صلبة أو غازية تستخدم في التمديد أو في الإذابة"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "عامل يقلل تركيز شيء ما، أو يخفف أثره."
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "هوعملية تذويب تستخدم مع جميع أنواع مواد التلوين."
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
    - lemma: "مَادَّةٌ مُخَفِّفَة"
      confirm:
        - text: "مادة مخَفّفة للّزُوجة وبخاصة في الدم."
          source: "المورد الحديث (2008)"
    - lemma: "مُرَقِّق"
      confirm:
        - text: "سائل كزيت التُّربنتينة ونحوه، يُتَّخذ مُرقِّقًا لِقَوام الطِّلاء وأنواع الورنيش."
          source: "المورد الحديث (2008)"
        - text: "مرقق القوام"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "مُمَدِّد"
      confirm:
        - text: "مرقق، ممدد (thinner)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"

stage3_analysis:
  per_lemma:
    - lemma: "مخفف"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً وعمومية للدلالة على مادة التخفيف في مختلف المجالات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَفِّف"
    - lemma: "مادة مخففة"
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق وشائع الاستخدام في السياقات العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّةٌ مُخَفِّفَة"
    - lemma: "مُرَقِّق"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني متخصص يستخدم غالباً في سياق الدهانات والطلاء (Thinner)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُرَقِّق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُمَدِّد"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم في الكيمياء للدلالة على المادة التي تزيد الحجم وتقلل التركيز (Diluent)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُمَدِّد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عامل تخفيف"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويعتبر ترجمة حرفية للمصطلح الإنجليزي، ويفضل تعريفه ببيان وظيفته الفيزيائية والكيميائية."
    authored:
      - type: terminological
        text: "مَادَّةٌ سَائِلَةٌ أَوْ صَلْبَةٌ أَوْ غَازِيَّةٌ تُضَافُ إِلَى مَادَّةٍ أُخْرَى لِتَقْلِيلِ تَرْكِيزِهَا أَوْ لِتَقْلِيلِ لُزُوجَتِهَا لِتُصْبِحَ أَكْثَرَ سُيُولَةً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "مُخَفِّف"
        examples:
          - text: "يُضَافُ المُخَفِّفُ إِلَى الطِّلاءِ لِتَسْهِيلِ مَدِّهِ عَلَى الجُدْرَانِ."
            type: usage
      - lemma: "مَادَّةٌ مُخَفِّفَة"
        examples:
          - text: "يُعَدُّ المَاءُ مَادَّةً مُخَفِّفَةً شَائِعَةً لِلأَحْمَاضِ فِي المُخْتَبَرَاتِ."
            type: usage
      - lemma: "مُرَقِّق"
        examples:
          - text: "اسْتَخْدَمَ الدَّهَّانُ المُرَقِّقَ لِتَخْفِيفِ قَوَامِ الوَرْنِيشِ."
            type: usage
      - lemma: "مُمَدِّد"
        examples:
          - text: "يُضَافُ المُمَدِّدُ لِلْمَحَالِيلِ الكِيمْيَائِيَّةِ لِلْحُصُولِ عَلَى التَّرْكِيزِ المَطْلُوبِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مَادَّةٌ سَائِلَةٌ أَوْ صَلْبَةٌ أَوْ غَازِيَّةٌ تُضَافُ إِلَى مَادَّةٍ أُخْرَى لِتَقْلِيلِ تَرْكِيزِهَا أَوْ لِتَقْلِيلِ لُزُوجَتِهَا لِتُصْبِحَ أَكْثَرَ سُيُولَةً."}

