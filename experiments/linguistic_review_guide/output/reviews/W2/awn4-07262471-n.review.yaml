# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلمة «رسالة» في التعريف الحالي مُضلِّلة — المقصود «مضمون» أو «عمل فني»، وليس الرسالة بمعناها الأشيع (خطاب / مهمة)"
      - "اللمّتان الموجودتان عبارتان وصفيتان حرّتان، لا مصطلحان مسكوكان ثابتان في المعاجم"
      - "كلتا اللمّتين تفتقران إلى التشكيل الكامل (يخلوان من تنوين الضم)"
    observations: >
      المجموعة awn4-07262471-n تُعبِّر عن مفهوم «الشيء المُثير أو المُصدِم في عملٍ إبداعي»،
      المعروف بالإنجليزية بـ shocker. الجذر الأعلى (رِسَالَة / مَضْمُون) يُحيل إلى
      سياق المحتوى التواصلي، وعليه فالتعريف المنقَّح ينبغي أن يُبرز المضمون الصادم
      لا الرسالة. كلمة «رسالة» في التعريف الراهن هي ترجمة حرفية لـ message في مصطلح
      علم الاتصال (message = content), وهو استخدام مجازي لا يتناسب مع الأسلوب المعجمي العربي.
      كلتا اللمّتين (عمل صادم / قصة مثيرة) مفيدتان دلالياً ولا بديل أفضل منهما،
      لكنهما تحتاجان إلى إكمال التشكيل.

  blind_candidates:
    - lemma: "صَاعِقَةٌ"
      generation_method: majaz
      justification: >
        توسّع دلالي مجازي من الصاعقة (البرق + النار المُحرِقة) إلى العمل الفني
        الذي يُصيب المتلقي بصدمة عنيفة مفاجئة. الاستعارة تستند إلى المشابهة
        التأثيرية: الصاعقة تُصيب فجأةً وتُخلِّف أثراً بالغاً، وكذا العمل المُثير.
        إحياء للمعنى المجازي المعروف في التراث (وَأَخَذَتِ الَّذِينَ ظَلَمُوا الصَّيْحَةُ).
    - lemma: "مَصْدَمَةٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (ص د م) على وزن مَفْعَلَة الدال على الحدث/الموضع.
        يُعبِّر عن الشيء الذي يُصيب المتلقي بصدمة حادة، قياساً على
        مَصدَمة بمعنى موضع الاصطدام. الجذر موثَّق في ابن فارس: «الصدمُ:
        ضربُ الشيء الصلب بمثله».
    - lemma: "إِبْهَارٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر أفعل من جذر (ب هـ ر) بمعنى الإدهاش البالغ الأثر. يُستخدم
        في السياق الفني للتعبير عن المحتوى الذي يُبهر المتلقي ويُدهشه.
        الصياغة على وزن الإفعال من ثلاثي مزيد، قياساً شائعاً في المصطلحية
        العربية المعاصرة.
    - lemma: "عَجِيبَةٌ"
      generation_method: majaz
      justification: >
        توسّع دلالي من «الأمر العجيب / الخارق للمألوف» إلى العمل الفني
        الاستثنائي الذي يُدهش ويُفاجئ. الجذر (ع ج ب) يُفيد الدهشة
        والانبهار، وهي حالة انفعالية قريبة مما يُحدثه العمل المُثير.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عَمَل صَادِم"
      expands:
        - text: "شيء مروِّع. وبخاصة: رواية أو مسرحية مثيرة."
          source: "المورد الحديث (2008) — بند shocker (entry_id 716815)"
          addition: >
            يُقدِّم المورد الحديث «شيء مروِّع» مع التخصيص بالرواية والمسرحية
            كمقابل عربي للمفهوم، مما يُؤيِّد دلالة «عمل صادم» ويُثبت أن
            المفهوم موجود في الاستخدام العربي المعاصر وإن لم يُسكَّ بهذه
            الصيغة تحديداً.

    - lemma: "قِصَّة مُثِيرَة"
      confirm:
        - text: "رواية مثيرة"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — بند thriller (entry_id 486750)"
        - text: "شيء مثير. وبخاصة: رواية أو تمثيلية مثيرة."
          source: "المورد الحديث (2008) — بند thriller (entry_id 723401)"

    - lemma: "صَاعِقَةٌ"
      contradicts:
        - text: "نارٌ تسقط من السَّماء والعذابُ المهلك وجسم ناري مشتعل يسقط من السماء في رعدٍ شديد"
          source: "المعجم الوسيط (entry_id 16015)"
          conflict: >
            المعجم يقصر «الصاعقة» على ظاهرة كونية وعذاب إلهي؛ لا يُثبت
            استخدامها مجازاً للمحتوى الروائي أو السينمائي المُثير.
        - text: "الصاعقةُ: الموتُ، وكلُّ عَذابٍ مُهْلِكٍ، وصَيْحَةُ العذابِ، والمِخْراقُ الذي بيَدِ المَلَكِ سائِقِ السحابِ، ولا يأتي على شيءٍ إلاَّ أحْرَقَهُ"
          source: "القاموس المحيط للفيروزآبادي (entry_id 799232)"
          conflict: "المعنى موقوف على الظاهرة الكونية؛ لا صلة للمعنى الحرفي ولا المجازي الموثَّق بالمحتوى الأدبي أو الفني."

    - lemma: "مَصْدَمَةٌ"
      contradicts:
        - text: "إبلٌ مُصَدَّمةٌ: بها صُدامٌ, وهو داءٌ"
          source: "المعجم الكبير (entry_id 55241)"
          conflict: >
            المعنى الموثَّق خاص بالإبل المصابة بالصُّدام (داء)؛ لا صلة
            له بالمحتوى الفني الصادم.
        - text: "knocker-out"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية، بناء - تجارة (entry_id 477551)"
          conflict: >
            مصطلح تقني في مجال البناء والنجارة؛ بعيد كل البُعد عن السياق
            الأدبي والفني.

    - lemma: "إِبْهَارٌ"
      contradicts:
        - text: >
            «مرفوضة — السبب: لاستعمال مصدر الفعل «أبْهَر» مع عدم وروده في المعاجم
            بدلاً من مصدر الفعل «بهَرَ». الصواب والرتبة: إسدال عناصر الإبهار على
            الفكرة [صحيحة] — إسدال عناصر البَهْر على الفكرة [فصيحة مهملة]»
          source: "معجم الصواب اللغوي لأحمد مختار عمر (entry_id 850496)"
          conflict: >
            المعجم ينبّه إلى أصل ضعف صيغة «إبهار»، ويُوجِّه إلى «بَهْر/بُهور»
            كأفصح. علاوةً على ذلك فالدلالة على الإدهاش البصري، لا على الصدمة
            الروائية.
      expands:
        - text: "إِبْهار (بَهْرُ البَصَر) — glare"
          source: "المعجم الطبي الموحد (2009) (entry_id 584379)"
          addition: >
            يُثبِّت «إبهار» في الاستخدام التقني بمعنى بهر البصر (إبهار بصري)،
            مما يُبعِده أكثر عن السياق الأدبي.

    - lemma: "عَجِيبَةٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عَمَل صَادِم"
      decision: confirmed
      decision_reason: >
        المركّب الوصفي (اسم + صفة: عمل + صادم) يُعبِّر بوضوح عن المفهوم المطلوب
        ولا يوجد بديل مسكوك أفضل منه. المورد الحديث يُقدِّم «شيء مروِّع» و«رواية
        أو مسرحية مثيرة» مقابلاً لـ shocker، مما يُؤيِّد الدلالة المقصودة. كلمة
        «عمل» في العربية تشمل الفيلم والمسرحية والرواية. يحتاج إلى إكمال التشكيل
        بإضافة تنوين الضم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يتمحور حول الطابع الصادم المُفزِع (الجذر صدم = ضرب الشيء الصلب بمثله،
        أي الأثر العنيف المباغت)؛ يُلائم الأعمال السينمائية والمسرحية التي
        تُباغت المتلقي بمحتوى مروِّع أو نهاية غير متوقَّعة. هو أقرب ترجمةً
        لـ shocker من حيث شدة الصدمة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلٌ صَادِمٌ"

    - lemma: "قِصَّة مُثِيرَة"
      decision: confirmed
      decision_reason: >
        مدعوم مباشرةً بمسرد الإعلام («رواية مثيرة» = thriller) والمورد الحديث
        («شيء مثير. وبخاصة: رواية أو تمثيلية مثيرة»). المركّب الوصفي راسخٌ
        في الاستخدام العربي المعاصر. يحتاج إلى إكمال التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يتمحور حول الإثارة والتشويق المتواصلَيْن (الجذر ثور = انبعاث الشيء
        وهيجانه)؛ يُلائم الروايات والقصص التي تُبقي المتلقي في حالة توتر
        متصاعدة. أقرب ترجمةً لـ thriller أو sensational story، مع تركيز
        على الصنف القصصي/الروائي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِصَّةٌ مُثِيرَةٌ"

    - lemma: "صَاعِقَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        جميع المعاجم المُستعلَمة تحصر «الصاعقة» في البرق والعذاب الإلهي والظاهرة
        الكونية، ولا يوجد دليل معجمي على استخدامها مجازاً ثابتاً للمحتوى الروائي
        أو الفني المُثير. إضافتها تُوقع في اشتراك لفظي مع المعنى الحرفي الشائع.

    - lemma: "مَصْدَمَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن «مُصَدَّمة» خاصة بالإبل المريضة بالصُّدام،
        وأن «مصدمة» في ARABTERM مصطلح تقني في البناء والنجارة بمعنى knocker-out.
        لا صلة لأي من المعنيين بالمحتوى الفني. الاشتقاق المقترح مرفوض.

    - lemma: "إِبْهَارٌ"
      source: stage1
      decision: removed
      decision_reason: >
        معجم الصواب يُنبِّه إلى ضعف صيغة «إبهار» أصلاً مقارنةً بـ«بَهْر».
        دلالة الكلمة على الإدهاش البصري (بهر البصر) تُبعِدها عن الصدمة
        الروائية. كلا الاعتراضَيْن يمنع قبولها.

    - lemma: "عَجِيبَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على أي دليل معجمي يُثبِّت «عجيبة» كمصطلح للمحتوى الفني
        المُثير؛ الوارد في المعاجم اسم علم فحسب (موسوعة أسماء العرب).
        المرشّح مرفوض لانعدام الأدلة الداعمة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "رسالة مثيرة (في فيلم أو مسرحية أو رواية)"
    assessment:
      decision: revise
      reason: >
        كلمة «رسالة» ترجمة حرفية مُضلِّلة لـ message في مصطلح نظرية الاتصال؛
        فالعربية توظِّف «رسالة» للخطاب المكتوب أو المهمة الرسالية، مما يُربك
        الدلالة المقصودة. الأنسب التعبير بـ«مضمون» الذي يُطابق المعنى المقصود
        ويتسق مع الجذر الأعلى (مَضْمُون). فضلاً عن ذلك، التعريف الحالي يفتقر
        إلى الفصل النوعي الدقيق.
    authored:
      - type: terminological
        text: "مضمونٌ صادمٌ أو مُثيرٌ للفزع يتضمَّنه فيلمٌ أو عرضٌ مسرحيٌّ أو روايةٌ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          عملٌ فنيٌّ من الأفلام أو المسرحيات أو الروايات يقوم على مضمونٍ مُثير
          للصدمة والرُّعب، يُفاجئ المتلقي ويُثير مشاعره بصورة حادّة؛ وكثيراً
          ما يشتمل على أحداث أو مفاجآت تتعارض مع التوقّعات وتُخلِّف أثراً
          انفعالياً بالغاً.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07262471-n"
          definition_index: 0
          text: "مضمونٌ صادمٌ أو مُثيرٌ للفزع يتضمَّنه فيلمٌ أو عرضٌ مسرحيٌّ أو روايةٌ"
      - command: add_definition
