      generation_method: tarkib
      justification: "مركّب وصفي من «لغة» و«تركيبيّة» (نسبة إلى التركيب)، يُقابل المصطلح الإنجليزي synthetic language تقابلاً دقيقاً؛ فالتركيب هنا بمعنى ضمّ الصَّرفيّات في وحدة لفظية واحدة"
    - lemma: "لُغَة تَأْلِيفِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «تأليف» بمعنى الجمع والضمّ، وهو مرادف محتمل لـ«تركيبية» في السياق اللساني، إذ يدلّ على ائتلاف المعاني النحوية في بنية الكلمة الواحدة"
    - lemma: "لُغَة صَرْفِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «صرف» أي التغيير في بنية الكلمة، يشير إلى اللغة التي تعتمد التصريف والإلحاق لبيان الوظائف النحوية"
    - lemma: "لُغَة اِنْدِمَاجِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «اندماج»، يشير إلى اندماج الصَّرفيّات في بنية الكلمة. يُستعمل أحياناً مرادفاً لـ«تركيبية» في المؤلفات اللسانية العربية"


