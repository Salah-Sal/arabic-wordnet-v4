    observations: "المجموعة تمثّل مفهوماً لسانياً تصنيفياً (typological) يُقابل «اللغة التحليلية» (analytic language). اللغات التركيبية تجمع عدة صَرفيّات في كلمة واحدة، وتضمّ نوعين فرعيين: اللغات التصريفية (الاندماجية) كاللاتينية والعربية، واللغات الإلصاقية كالتركية والفيتنامية. التعريف الحالي يقصر المفهوم على النوع التصريفي فقط، وهو تضييق غير دقيق."

  blind_candidates:
