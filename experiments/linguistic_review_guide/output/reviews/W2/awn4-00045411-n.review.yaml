# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "المجموعة تغطي مفهومين متقاربين: جعل الأشياء متساوية (equalization) وجعلها موحدة (uniforming)، واللمّات الحالية تركز أكثر على التساوي."
    observations: "المجموعة تعبر عن فعل الإحداث (act) وليس الحالة. اللمّات المقترحة تغطي الجوانب الفيزيائية (تسوية) والقانونية/المعنوية (مساواة) والتقنية (توحيد)."
  blind_candidates:
    - lemma: "تَسْوِيَة"
      generation_method: ishtiqaq
      justification: "المصدر القياسي للفعل (سوّى)، وهو الأدق للتعبير عن الـ leveling والـ equalization."
    - lemma: "مُسَاوَاة"
      generation_method: ishtiqaq
      justification: "المصدر القياسي للفعل (ساوى)، ويستخدم غالباً في سياق الحقوق والقيم."
    - lemma: "تَوْحِيد"
      generation_method: ishtiqaq
      justification: "المصدر القياسي للفعل (وحّد)، وهو الأنسب للمقابل الإنجليزي (making uniform)."
    - lemma: "تَعْدِيل"
      generation_method: ishtiqaq
      justification: "بمعنى التسوية وإزالة العوج، ويستخدم في السياقات الفنية والرياضية."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَسْوِيَة"
      confirm:
        - text: "«(فى علم الجيولوجيا) Leveling: تمهيدُ سطْحِ الأرض بخفض أعاليها ورفع منخفضاتها.»"
          source: "المعجم الكبير"
        - text: "«تسوية سطح الأرض، وعادة باستخدام آلة محددة (غريدر)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
      expands:
        - text: "«أسلوب في تسوية النزاعات يرتكز على التوفيق بين مصالح الأطراف...»"
          source: "المعجم الموحد لمصطلحات المياه"
    - lemma: "مُسَاوَاة"
      confirm:
        - text: "«(فى علم الفلسفة) Equality: ضربان: ١- مادية... ٢- معنوِيَّةٌ، وهى تساوى الأفراد فى الحقوق والواجبات»"
          source: "المعجم الكبير"
        - text: "«حالة شيء واحد مشابهة لحالة شيء آخر من حيث الطبيعة والشكل والجودة والكمية.»"
          source: "مسرد المناخ والبيئة"
    - lemma: "مُوَازَنَة"
      confirm:
        - text: "«مُوَازَنَة من (و ز ن) المساواة والعدل والمقابلة والميزانية.»"
          source: "موسوعة السلطان قابوس"
      expands:
        - text: "«تعديل وتوزيع أثقال [أرياش العنفة] بطول المحورين»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
    - lemma: "تَوْحِيد"
      confirm:
        - text: "«التوحيد هو لغة جعل شيء واحدا.»"
          source: "كشاف اصطلاحات الفنون"
        - text: "«تَوْحِيد النمط (فِي الاقتصاد السياسي) اقْتِصَار الْمُنْشَآت على إنتاج نموذج وَاحِد...»"
          source: "المعجم الوسيط"
    - lemma: "تَعْدِيل"
      confirm:
        - text: "«والتعديل في اللغة التسوية.»"
          source: "كشاف اصطلاحات الفنون"
        - text: "«إجراء تغيير جزئيّ لتحسين الوضع أو الصفات.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تسوية"
      decision: confirmed
      decision_reason: "مصدر أصيل يعبر عن التسوية المادية (Leveling) والمعنوية، وهو مرادف دقيق للمصطلح الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسْوِيَة"
    - lemma: "مساواة"
      decision: confirmed
      decision_reason: "يعبر عن التساوي في المقدار أو القيمة أو الحقوق، وهو المقابل الأشيع لـ Equalization."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسَاوَاة"
    - lemma: "موازنة"
      decision: confirmed
      decision_reason: "تفيد معنى التساوي من خلال موازنة الكفتين أو القوى، وتستخدم في سياقات تقنية واقتصادية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَازَنَة"
    - lemma: "تَوْحِيد"
      source: stage1
      decision: confirmed
      decision_reason: "مهم لتغطية جانب 'making uniform' الوارد في التعريف، حيث يعني جعل الأشياء على نمط واحد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَوْحِيد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00045411-n"}
    - lemma: "تَعْدِيل"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف لغوي للتسوية، ويشيع استخدامه في السياقات الفنية والتقنية لضبط الأشياء وجعلها متساوية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَعْدِيل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00045411-n"}

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "فعل جعل الأشياء متساوية أو موحدة"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً؛ يفضل صياغته بأسلوب معجمي يوضح أبعاد التساوي والتماثل."
    authored:
      - type: terminological
        text: "عَمَلِيَّةُ صَيْرُورَةِ الأَشْيَاءِ مُتَمَاثِلَةً فِي القَدْرِ أَو القِيمَةِ أَو المِقْدَارِ أَو الهَيْئَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "جَعْلُ الشَّيْءِ سَوِيًّا أَوْ مُمَاثِلًا لِغَيْرِهِ فِي الخَصَائِصِ أَو الصِّفَاتِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-00045411-n", definition_index: 0, text: "عَمَلِيَّةُ صَيْرُورَةِ الأَشْيَاءِ مُتَمَاثِلَةً فِي القَدْرِ أَو القِيمَةِ أَو المِقْدَارِ أَو الهَيْئَةِ."}
      - command: add_definition
        params: {synset_id: "awn4-00045411-n", text: "جَعْلُ الشَّيْءِ سَوِيًّا أَوْ مُمَاثِلًا لِغَيْرِهِ فِي الخَصَائِصِ أَو الصِّفَاتِ."}
  examples:
    per_lemma:
      - lemma: "تَسْوِيَة"
        examples:
          - text: "بَدَأَتِ الآلَاتُ بِتَسْوِيَةِ مَسَارِ الطَّرِيقِ الجَدِيدِ."
            type: usage
      - lemma: "مُسَاوَاة"
        examples:
          - text: "يَسْعَى القَانُونُ إِلَى المُسَاوَاةِ بَيْنَ جَمِيعِ الأَطْرَافِ فِي الحُقُوقِ."
            type: usage
      - lemma: "مُوَازَنَة"
        examples:
          - text: "تَمَّتْ مُوَازَنَةُ الحُمُولَةِ لِضَمَانِ اسْتِقْرَارِ السَّفِينَةِ."
            type: usage
      - lemma: "تَوْحِيد"
        examples:
          - text: "يُؤَدِّي تَوْحِيدُ المَقَايِيسِ إِلَى زِيَادَةِ كَفَاءَةِ التَّبَادُلِ التِّجَارِيِّ."
            type: usage
      - lemma: "تَعْدِيل"
        examples:
          - text: "يَلْزَمُ تَعْدِيلُ المِيزَانِ قَبْلَ كُلِّ عَمَلِيَّةِ قِيَاسٍ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-00045411-n", text: "تَتَطَلَّبُ الصِّنَاعَاتُ الحَدِيثَةُ تَوْحِيدَ أبعادِ القِطَعِ الغِيَارِ."}

