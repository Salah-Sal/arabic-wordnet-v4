# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'طباعة كربونية' تفتقر إلى التشكيل الكامل"
      - "المصطلح غير مُوثَّق بهذه الصيغة في أيٍّ من المعاجم المتاحة (OCR، Hawramani، ARABTERM)"
      - "معجم ARABTERM يُسجِّل 'طباعة تصويرية' مقابل autotype وهو مصطلح منافس ينبغي دراسة علاقته بالمجموعة"
      - "المجموعة تضمّ لمّة واحدة فقط مما يُضعف البنية الترادفية"
    observations: >-
      المجموعة تمثّل مفهوماً تقنياً تاريخياً في علم التصوير الفوتوغرافي، وهو عملية
      طباعة قائمة على تثبيت صبغة الكربون في طبقة جيلاتينية مُحسَّسة لإنتاج مطبوعات
      ثابتة بصريةً وزمنياً. المفهوم ذو أصل غربي بحت (autotype/autotypy) وليس له جذر
      ثقافي عربي، ومن ثَمَّ تتنافس التسميات بين الوصف المادي (كربون/فحم) والوصف
      الوظيفي (تصويري). اللمّة الموجودة 'طباعة كربونية' تركيب وصفي (wasfi) صحيح
      صرفياً يُحدِّد المادة المُستخدمة، غير أنه لم يُثبَّت في المعجمية التقنية العربية
      بعد. الجذر 'طبع' في ابن فارس يُعطي دلالة الختم والإكمال، وهي ملائمة تماماً
      للمفهوم الطباعي الحديث. يُشير استعمال 'فحم' بديلاً لـ 'كربون' في معاجم تقنية
      متعددة إلى أن 'الطباعة الفحمية' بديلٌ محتمل بجذر عربي أصيل.

  blind_candidates:
    - lemma: "الطَّبَاعَة الفَحْمِيَّة"
      generation_method: majaz
      justification: >-
        الفحم هو المقابل العربي الأصيل للكربون (فَحَمَ = اسودَّ)؛ ويُثبت المعجم الموحد
        للمياه أن 'فحم نشيط' مرادف لـ active carbon، وكذلك 'فحم عضوي' مقابل organic carbon.
        والمشابهة مادية تامة: الكربون المُستخدَم في الطباعة هو فحم مُركَّز. وبهذا تُحيي
        الكلمةَ الميتةَ 'فحم' بمعنى أوسع منعاً للاستلفاظ بالمُعرَّب.

    - lemma: "الطِّبَاعَة الكَرْبُونِيَّة"
      generation_method: ishtiqaq
      justification: >-
        نسبة صناعية (-يَّة) إلى 'كَرْبُون' المُعرَّب، تُوضح مباشرةً المادة المحورية في
        العملية. وزن النسبة مُطَّرِد في المصطلحية العربية (بكتيرية، نووية، كيميائية).
        اختارت هذا المسار لأن 'كربون' أصبح مصطلحاً عالمياً له أسبقية في التداول التقني.

    - lemma: "طِبَاعَة الفَحْمِيَّات"
      generation_method: tarkib
      justification: >-
        تركيب إضافي: 'طِبَاعَة' + 'الفَحْمِيَّات' (جمع فحمية، أي مركبات الكربون).
        الأنموذج حاضر في المعجمية العلمية (كربونيات، فحميات). يُركِّز على المادة الخام
        كوحدة معجمية ثابتة لا مجرد وصف.

    - lemma: "أُوتُوتِيبِيَّة"
      generation_method: taarib
      justification: >-
        تعريب autotypy بإضافة تاء التأنيث وياء النسبة (كالأنالوجيا: فوتوغرافيا ← فوتوغرافية،
        ليثوغرافيا ← ليثوغرافية). يقبل لام التعريف (الأوتوتيبية) وجمع السالم (أوتوتيبيات)
        والنسبة (أوتوتيبي). لجأنا إليه ملاذاً أخيراً لعدم وجود مقابل عربي أصيل مسكوك.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المُنفَّذة (٤ استعلامات):
#  Q1 — مطابقة دفعية لجميع اللمّات والمرشحات (صفر نتائج)
#  Q2 — الجسر الإنجليزي: autotype, autotypy, carbon print/process/printing
#  Q3 — FTS عربي: مطبوعات، طباعة، كربون، فحم، صبغة، دائمة
#  Q4 — إثراء entry_id المُكتشَفة + مقاييس اللغة للجذور: طبع، فحم، صبغ
stage2_evidence:
  per_lemma:
    - lemma: "طباعة كربونية"
      contradicts:
        - text: "«طباعة تصويرية» — translation_en: autotype | translation_fr: phototypographie | domain: Printing - Electricity"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.١ (طباعة - كهرباء، 1996)"
          conflict: >-
            المعجم يُقابل 'autotype' بـ 'طباعة تصويرية' لا 'طباعة كربونية'، مما يُشير إلى أن
            المصطلحية التقنية العربية الرسمية تختار البُعد التصويري لا الكيميائي لوصف هذه العملية.
            غير أن الترجمة الفرنسية 'phototypographie' تُلمح إلى مفهوم أعمّ (الطباعة الضوئية)
            يتجاوز الطباعة الكربونية تحديداً، مما يُضعف حجّة استبدال 'طباعة كربونية' بها.

    - lemma: "الطَّبَاعَة الفَحْمِيَّة"
      expands:
        - text: "«فَحْم نَشِيط — كربون نقي ذو مسامية عالية ومساحة سطحية كبيرة. يُمكن الحصول عليه من تفحيم الخشب، والخث، والليجنيت، والفحم الحجري، إلخ.» — translation_en: active carbon / activated carbon"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: >-
            يُثبت أن 'فحم' يُستعمل في المعجمية التقنية العربية مرادفاً وظيفياً للكربون النقي،
            مما يُسوِّغ صياغة 'الطباعة الفحمية' كمصطلح أصيل وظيفياً.
        - text: "«فَحْم عُضَوِيّ — كربون عضوي (المرادف العربي)» — translation_en: organic carbon"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: >-
            يُقرِّر صراحةً أن 'فحم' هو المرادف العربي الأصيل لـ 'كربون' في السياقات التقنية،
            مما يُعزِّز جذرية 'الطباعة الفحمية' كبديل تراثي دقيق.

    - lemma: "الطِّبَاعَة الكَرْبُونِيَّة"
      evidence_status: "no_material_found"

    - lemma: "طِبَاعَة الفَحْمِيَّات"
      evidence_status: "no_material_found"

    - lemma: "أُوتُوتِيبِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "طباعة كربونية"
      decision: confirmed
      decision_reason: >-
        اللمّة تركيب وصفي (wasfi) صحيح صرفياً ودلالياً: تُسمِّي العملية بالمادة المحورية المميِّزة
        (الكربون)، وهو اختيار منهجي سليم في المصطلحية العربية. وإن كان ARABTERM يستخدم 'طباعة
        تصويرية' لـ autotype، فإن الفحص الدقيق يكشف أن ذلك المصطلح يُغطي مفهوماً أعمّ
        (phototypographie)، في حين أن هذه المجموعة تخصّ عملية الكربون تحديداً. غياب التوثيق
        المعجمي المباشر لا يُلغي صحة المصطلح وهو مما يُعالَج بإثراء المعجمية لا بالحذف.
        يُقرَّر تثبيتها مع تصحيح التشكيل وإضافة جذر صريح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        تُخصِّص هذه اللمّة مفهوم التصوير الفوتوغرافي العام (الجنس: تصوير فوتوغرافي) في عملية
        بعينها تعتمد صبغة الكربون وحدها مادةً وثابتاً، مما يميزها عن أي عملية تصويرية أخرى
        تستخدم أملاح الفضة أو الحبر أو الإيموجن؛ فالدوام هو الفصل النوعي الجوهري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طِبَاعَة كَرْبُونِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "الطَّبَاعَة الفَحْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم صحة 'فحم' مرادفاً للكربون في السياقات التقنية، يظل اللفظ مثيراً للالتباس في
        هذا السياق إذ قد يُوهم بالفحم الحجري أو فحم الخشب لا الكربون الصباغي المُستخدَم
        في الطباعة. كما أن اللمّة لم تُرصد في مصدر تقني طباعي. والمجموعة تمتلك لمّة
        موجودة كافية بعد تصحيح التشكيل.

    - lemma: "الطِّبَاعَة الكَرْبُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        هذه اللمّة مرادفة شكلية للمّة الموجودة 'طباعة كربونية' مع إضافة ال- فحسب؛
        وهي ليست مصطلحاً مستقلاً بل صيغة معرَّفة للمصطلح نفسه. لا حاجة لإضافتها
        كلمّة منفصلة.

    - lemma: "طِبَاعَة الفَحْمِيَّات"
      source: stage1
      decision: removed
      decision_reason: >-
        التركيب الإضافي 'طباعة الفحميات' غير مثبَّت معجمياً ولم يرد في أي مصدر.
        اختبار السكّ يُثبت أنه وصف حر لا وحدة معجمية: يمكن إبدال 'الفحميات' بـ
        'الكربونيات' أو 'الصبغات' وتبقى العبارة صالحة وصفاً، إذن ليست مصطلحاً مسكوكاً.

    - lemma: "أُوتُوتِيبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        وإن كان التعريب مباحاً منهجياً عند استنفاد البدائل، إلا أن وجود 'طباعة كربونية'
        المُقرَّرة في AWN4 يُغني عنه. علاوةً على ذلك، فإن 'autotypy' ليس له الانتشار العالمي
        الذي يستوجب استدخاله كمصطلح عربي (على خلاف 'فوتوغرافيا' مثلاً). فضلاً عن أنه
        لا توجد شواهد على تداول 'أوتوتيبية' في أي نص عربي متخصص.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "عملية لإنتاج مطبوعات دائمة بصبغة الكربون"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مقبول لغوياً لكنه ناقص معجمياً: يغفل الطابع الفوتوغرافي للعملية (الجنس
        القريب الصحيح هو: عملية تصويرية فوتوغرافية)، ولا يُميِّز الآلية التقنية (الطبقة
        الجيلاتينية المُحسَّسة بالكرومات). هذا التعريف قد يصف طباعة أي مادة كربونية لا
        هذه العملية بعينها. يحتاج إلى جنس أقرب وفصل أوضح.
    authored:
      - type: terminological
        text: >-
          عملية تصويرية فوتوغرافية تُنتَج فيها مطبوعات دائمة مستدامة، بتحسيس طبقة
          جيلاتينية بمركّب الكرومات ثم تعريضها للضوء خلف سلبيّ فوتوغرافي، ثم ترسيخ
          الصورة الناتجة بصبغة الكربون؛ تمتاز مطبوعاتها بمقاومة التلوّن والتشقق على مرّ الزمن.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          أسلوب تاريخي في الطباعة الفوتوغرافية، يعود إلى اختراع جوزيف سوان عام 1864م،
          يعتمد على طلاء الورق بالجيلاتين والبيكرومات ثم تعريضه لضوء الشمس من خلال
          سلبي فوتوغرافي، فتتصلّب مناطق الضوء وتُغسَل المناطق الحساسة، ثم تُقلَّب الصورة
          على سطح ثانٍ ويُثبَّت الكربون في الطبقة. تُعدّ من أكثر أساليب الطباعة ديمومةً
          لأن صبغة الكربون لا تتحلل كيميائياً، وقد استُخدمت على نطاق واسع لحفظ
          الصور الفوتوغرافية الفنية والأرشيفية.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13457534-n"
