            سلبي فوتوغرافي، فتتصلّب مناطق الضوء وتُغسَل المناطق الحساسة، ثم تُقلَّب الصورة
            على سطح ثانٍ ويُثبَّت الكربون في الطبقة. تُعدّ من أكثر أساليب الطباعة ديمومةً
            لأن صبغة الكربون لا تتحلل كيميائياً، وقد استُخدمت لحفظ الصور الفوتوغرافية
