stage3_analysis:
  per_lemma:
    - lemma: "لاسلكية"
      decision: confirmed
      decision_reason: >
        المصدر الصناعي «لاسلكية» مشتق اشتقاقاً سليماً من الصفة «لاسلكيّ» المعتمَدة
        مصطلحاً في معاجم عربية موحّدة متعددة (الفيزياء، الكهرباء، المعلوماتية)
        وأجازها مجمع اللغة المصري. الاشتقاق على نمط المصدر الصناعي (-يّة) منتج
        ومعروف في العربية المعاصرة. غياب التسجيل المباشر كمدخل مستقل مفهوم لأن
        المعاجم التقنية تُدرج الصفة «لاسلكيّ» لا المصدر الصناعي منها؛ والأخير
        يُستعمل في النصوص التقنية والإعلامية (تقنية اللاسلكية، خاصية اللاسلكية).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphology_check: >
        الوزن: مصدر صناعي (اسم + يّة). لاسلكيّ + ة = لاسلكيّة. الوزن ملائم
        للدلالة على الخاصية المجردة. الجذر: سلك (السين واللام والكاف).
      borrowing_check:
        lexical_borrowing: "لا اقتراض لفظياً — الاشتقاق عربي صرف"
        calque_check: >
          ترجمة للمفهوم الإنجليزي wirelessness (wireless + -ness) بالآلية
          العربية المقابلة (لاسلكيّ + ية). الترجمة دقيقة ومطابقة للمدلول.
        blind_loan: >
          لا تضارب بين الشكل العربي والمدلول العلمي. المصطلح يصف الخاصية
          الصحيحة تماماً.
      quality_gate:
        consistency: "مطّرد — السيرورة الاشتقاقية منتجة في عشرات المصطلحات المشابهة (لاهوائية، لامائية)"
        usability: "سهل التداول، قصير، مألوف في الاستخدام التقني"
        adequacy: "ملائم تماماً للمفهوم"
        heritage_preference: "لا تراثي بديل متوفر"
        arabic_preference: "عربي محض"
        derivability: "قابل للاشتقاق والنسبة والتصغير"
      nuance_differentiation: >
        المجموعة تضم لمّة واحدة فلا تباين دلالي مع أشقاء. اللمّة تُركّز على
        الحالة أو الخاصية المجردة لكون الشيء خالياً من الأسلاك كصفة في الأنظمة
        والأجهزة، وهي أشمل من «إرسال لاسلكي» الذي يقتصر على الإرسال.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاسِلْكِيَّة"

    - lemma: "لَاسِلْكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذه اللمّة المرشحة هي نفس اللمّة الموجودة بعد إضافة التشكيل؛ لذا
        لا تُضاف كلمّة مستقلة بل يُحدَّث تشكيل اللمّة الموجودة.
      evidence_assessment:
        case: mixed

    - lemma: "انعِدَامُ الأَسْلَاك"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تفشل اختبار التثبيت المعجمي: يمكن إبدال «الأسلاك»
        بـ«الكابلات» أو «التوصيلات» وتبقى وصفاً صالحاً مما يدل على أنها
        ليست وحدة معجمية ثابتة. كما يفتقر المركّب إلى أدلة تسجيل في
        المعاجم.
      evidence_assessment:
        case: no_material

    - lemma: "الأَثِيرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الإزاحة الدلالية بعيدة وغير مألوفة في السياق التقني الحديث. المصطلح
        «الأثير» وإن كان له استخدام تاريخي وتقني، إلا أن «الأثيرية» كمصطلح
        لـ«اللاسلكية» غير مسكوك ولن يُفهم في غياب سياق تفسيري. اختبار
        السياق: «تتميز هذه الشبكة بالأثيرية» لا توازي في الوضوح «تتميز
        بالسلكية». لا أدلة معجمية تسنده.
      evidence_assessment:
        case: no_material

    - lemma: "خُلُوُّ السِّلْكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مركّب إضافي يصف الحالة وصفاً دقيقاً لكنه تعبير وصفي حر لا مصطلح
        مسكوك؛ يمكن إبدال «خلوّ» بـ«انعدام» أو «غياب» وتبقى العبارة
        صالحة، وهذا يدل على عدم التثبيت. لا توجد شواهد معجمية على استعماله
        مصطلحاً.
      evidence_assessment:
        case: no_material


