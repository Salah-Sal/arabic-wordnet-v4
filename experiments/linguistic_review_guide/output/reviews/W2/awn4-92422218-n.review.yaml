            مثل استخدام الراديو، أو الموجة المكروية، أو تحت الحمراء.»
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
          addition: >
            يؤكد أن المصطلح «لاسلكي» (الأساس الاشتقاقي للمّة) يُستعمل
            لوصف الاتصالات الخالية من الأسلاك؛ وهذا يدعم «لاسلكية» كمصدر
            صناعي منه.
        - text: >
            «اللاَّسِلْكيّ — الجذر: س ل ك — الاتِّصال اللاَّسلكيّ [صحيحة]؛
            أجاز مجمع اللغة المصري دخول "أل" على حرف النفي "لا" المتصل
            بالاسم، مثل: اللامائي واللاهوائي واللاسلكي … وذلك لشيوع هذه
            الكلمات في العصر الحديث واستعمالها في لغة العلم.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر — hawramani"
          addition: >
            يُثبت الاعتراف الأكاديمي بـ«لاسلكي» كمصطلح صحيح فصيح،
            مما يُجيز اشتقاق «لاسلكية» منه.
        - text: >
            «لاسلكي — wireless — domain: Physics»
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
          addition: "تثبيت مصطلحي في الفيزياء العامة."
        - text: >
            «لاسلكي — wireless — domain: Printing - Electricity»
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1 (1996) — ARABTERM"
