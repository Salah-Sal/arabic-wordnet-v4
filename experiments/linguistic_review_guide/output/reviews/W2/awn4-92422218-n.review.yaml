# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — awn4-92422218-n
# المفهوم: اللاسلكية (wirelessness)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'لاسلكية' مكتوبة بلا تشكيل كامل"
      - "التعريف الحالي يستخدم 'لاسلكياً' وهو تعريف دوري يشتق من اللمّة ذاتها"
      - "المصطلح حديث النشأة ولا يوجد له أصل تراثي مستقل في المعاجم الكلاسيكية"
      - "المجموعة تفتقر إلى التنويع المصطلحي رغم وجود أوجه اشتقاقية ممكنة"
    observations: >
      المجموعة تمثّل مفهوماً تقنياً حديثاً هو «خاصية اللاسلكية» أي صفة الأجهزة والأنظمة
      التي تعمل دون أسلاك. واللمّة الموجودة «لاسلكية» هي المصدر الصناعي المباشر من الصفة
      «لاسلكي» بإضافة ياء النسبة المشددة والتاء المربوطة، وهو تكوين اشتقاقي صحيح ومقبول
      في العربية المعاصرة. الأصل الجذري «سلك» يدل على النفوذ والمرور في شيء، ومنه السِّلك
      (الخيط أو الأسلاك). المفهوم لا يقابله لفظ تراثي عربي واحد بعينه مما يجعله في دائرة
      الفجوة المعجمية (lexical gap) التي سُدَّت بالاشتقاق الحديث.

  blind_candidates:
    - lemma: "لَاسِلْكِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مباشر بإضافة ياء النسبة والتأنيث إلى الجذر «سِلك»
        مع النفي بـ«لا»، على نمط: (لا + سِلكيّ) + ة = لاسلكية.
        يدل على الخاصية المجردة الدالة على انعدام الأسلاك في الجهاز أو النظام.
    - lemma: "انعِدَامُ الأَسْلَاك"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «انعِدَام» (مصدر يدل على الغياب التام) + «الأسلاك»
        (جمع سِلك)، يصف الحالة التي يخلو فيها النظام أو الجهاز من الأسلاك
        التوصيلية المادية.
    - lemma: "الأَثِيرِيَّة"
      generation_method: majaz
      justification: >
        بإحياء لفظ «الأثير» (ether) وهو الوسط الخامس عند الفلاسفة القدامى
        الذي كانوا يعتقدون أنه يملأ الفضاء وينقل الظواهر الطبيعية بلا وسيط
        مادي محسوس، مع إزاحة دلالية نحو الخاصية التي تُمكّن الاتصال عبر
        الفضاء دون أسلاك. وقد استُعمل «الأثير» في التقنية الحديثة بمعنى
        وسيط الإرسال اللاسلكي (Ethernet أصلاً من ether).
    - lemma: "خُلُوُّ السِّلْكِيَّة"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «خُلُوّ» (مصدر دال على الانعدام والبراءة) + «السلكية»
        (المصدر الصناعي من سِلكيّ)، يعبّر عن حالة براءة الجهاز أو النظام
        من الخاصية السلكية بأسلوب إضافي مألوف في العربية.


