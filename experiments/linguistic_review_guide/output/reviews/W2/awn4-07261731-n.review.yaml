stage3_analysis:

  per_lemma:

    - lemma: "إِعْلَان"
      decision: confirmed
      decision_reason: >
        اللمّة الأصيل والمركزية لمفهوم المجموعة. جذرها علن عربي صحيح يدل على الإظهار والنشر (ابن فارس).
        موثّقة في المعجم الوسيط بمعنى «إظهار الشيء بالنشر عنه في الصحف ونحوها» وفي عشرات المعاجم المتخصصة
        بمعنى advertisement / publicity. التشكيل صحيح. لا إشكال في الفصاحة أو الاشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُشير بالأساس إلى الوحدة الإعلانية المفردة (قطعة الإعلان) وإلى عملية النشر العلني؛ الأعمّ
        والأشيع في الفصحى المعاصرة؛ محايد دلالياً ويشمل كل أنواع الإعلان: التجاري والسياسي
        والإعلامي. يتمحور حول مفهوم الإظهار والتعميم.

    - lemma: "تَرْوِيج"
      decision: confirmed
      decision_reason: >
        مصطلح راسخ في المعاجم الحديثة للدلالة على promo / promotion.
        رغم أن ابن فارس يعدّ جذر روج دخيلاً، فإن المصطلح استُعمل ودُوِّن في معاجم عربية كثيرة
        وأصبح من المصطلحات المتداولة المقبولة في سياق الترويج والإعلام. التشكيل صحيح.
        اختبار الاستبدال: يمكن إحلاله محل «إعلان» في بعض السياقات مع فارق دلالي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على العملية التداولية: نشر المادة وتوزيعها وجعلها رائجة في الأوساط؛ أكثر حيويةً
        وديناميكية من إعلان — يُشير إلى إذاعة الرسالة وانتشارها لا إلى الوثيقة المجردة وحدها؛
        كثيراً ما يُستعمل في سياق الترويج للبرامج الإعلامية والمنتجات التجارية معاً.

    - lemma: "دِعَايَة"
      decision: confirmed
      decision_reason: >
        رغم أن المعاجم المتخصصة تُترجمها بـ propaganda، فإن الاستعمال العربي المعاصر يُوظّفها
        كثيراً في سياق الترويج التجاري («دعاية تجارية»، «حملة دعاية»). والمعجم الموحد للتجارة
        يُثبتها بمعنى publicity. لمّة مقبولة في المجموعة مع تحفّظ على دلالتها الإقناعية
        الآيديولوجية التي قد تتعارض مع الترويج التجاري المحايد. التشكيل صحيح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تحمل شحنةً إقناعيةً وعاطفية أقوى من سائر اللمّات؛ تُستخدم في السياقات السياسية
        والآيديولوجية والتجارية على حدٍّ سواء؛ تُركّز على الترويج للأفكار والقضايا لا للمنتجات
        فحسب؛ وهي أكثر إثارةً للجدل من إعلان وإشهار من حيث الحياد.

    - lemma: "إِشْهَار"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثّق توثيقاً واسعاً في المعاجم المتخصصة بمعنى advertising و publicity؛ يرد في
        عشرات التعابير الاصطلاحية المركّبة في مسرد الإعلام (إشهار سينمائي، لوحة إشهار، مدير الإشهار...).
        معجم الصواب يُثبته [صحيحة]. جذره شهر عربي أصيل. شائع في المعجم الشمال أفريقي.
        اجتاز اختبار التثبيت المعجمي (وحدة مصطلحية ثابتة مسجّلة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على جعل الشيء مشهوراً ومعروفاً لدى الجمهور الأوسع؛ يُناسب الإعلان التجاري
        في وسائل الإعلام المختلفة (إشهار تلفزيوني / مطبوع / رقمي)؛ يُستخدم في المغرب العربي
        بديلاً رئيسياً عن إعلان؛ يُبرز الشهرة والانتشار الجماهيري كغاية من الرسالة.
      actions:
        - command: create_entry
          params:
            lemma: "إِشْهَار"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07261731-n"

    - lemma: "تَسْوِيق"
      source: stage1
      decision: removed
      decision_reason: >
        تسويق يُقابل marketing الذي هو العملية التسويقية الشاملة (بحوث السوق، التوزيع،
        التسعير، الإعلان)، لا رسالةً ترويجية واحدة. جميع مصادر ArabTerm تُترجمه بـ marketing.
        المعجم الاقتصادي يُدرج الإشهار ضمن التسويق — وهو ما يُثبت أن تسويق أعمّ وأشمل،
        ويخرج عن دلالة هذه المجموعة (رسالة واحدة لصالح شيء ما).

    - lemma: "نَشَرَةٌ تَرْوِيجِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        فشل في اختبار التثبيت المعجمي: لا يرد في أي معجم كوحدة معجمية ثابتة.
        فشل في اختبار السكّ: يمكن إبدال «ترويجية» بـ «إعلانية» أو «تسويقية» دون أن
        يفقد التعبير معناه الوصفي — مما يكشف أنه وصف حر لا مصطلح مسكوك. حذف.

    - lemma: "مُحْتَوىً تَرْوِيجِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        فشل في اختبار التثبيت المعجمي: لا أثر له في أي معجم متخصص.
        فشل في اختبار السكّ: «محتوى تسويقي» / «محتوى إعلاني» تُعطي معنىً مماثلاً —
        مما يُثبت أنه تعبير وصفي حر لا مصطلح. حذف.


