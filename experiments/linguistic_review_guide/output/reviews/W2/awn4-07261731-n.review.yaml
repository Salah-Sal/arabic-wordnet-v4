stage1_review:
  assessment:
    concerns:
      - "دِعَايَة: تُترجَم في جميع المعاجم المتخصصة بـ «propaganda» لا بـ «promotional material»، مما يُوحي بدلالة آيديولوجية لا تتوافق مع المعنى الترويجي التجاري المحايد."
      - "تَرْوِيج: جذره (روج) يصفه ابن فارس في مقاييس اللغة بأنه دخيل غير أصيل، مما يُضعف مشروعيته الاشتقاقية."
      - "المجموعة تفتقر إلى لمّة إِشْهَار الشائعة في المعاجم الحديثة والمصطلحات المتخصصة لمفهوم الإعلان والترويج."
      - "التعريف الحالي ترجمة حرفية عن الإنجليزية، لا يعكس أسلوب المعجم الوسيط."
    observations: >
      المجموعة تدور حول مفهوم «المادة الترويجية الإعلانية» — أي رسالة أو خطاب يُنشَر بهدف التعريف بمنتجٍ أو قضيةٍ أو شخصٍ أو مؤسسةٍ وكسب الجمهور إليها. اللمّة الأكثر دقةً هي
      إِعْلَان (جذر علن — الإظهار والنشر)، وهي اللمّة المركزية في الفصحى المعاصرة للدلالة على الوحدة الإعلانية.
      أما تَرْوِيج فيُركّز على العملية التداولية (جعل الشيء رائجاً) أكثر من الرسالة ذاتها. ودِعَايَة تحمل شحنةً إقناعيةً أو آيديولوجية تبتعد عن الحياد التجاري.
      يُلاحظ غياب لمّة إِشْهَار رغم توثيقها الواسع في المعاجم المتخصصة.

  blind_candidates:
    - lemma: "إِشْهَار"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر شهر (وضوح، إضاءة) على وزن إفعال، بمعنى جعل الشيء مشهوراً ومعروفاً لدى الجمهور.
        يُناسب تماماً دلالة «رسالة تصدر لصالح شيء ما»، إذ غايتها إشهاره وتعريف الناس به.
    - lemma: "تَسْوِيق"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر سوق (حدو الشيء وتوجيهه) على وزن تفعيل، يُفيد توجيه المنتج نحو السوق.
        يُستخدم للدلالة على الأنشطة الترويجية التجارية وإن كان أوسع من مجرد رسالة واحدة.
    - lemma: "نَشَرَةٌ تَرْوِيجِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من «نشرة» (ما يُنشَر من مادة إعلامية) + «ترويجية» (منسوبة إلى الترويج).
        يُحدد نوع المادة الإعلانية بوصفها وحدةً مكتوبةً تُوزَّع أو تُبثّ للترويج لشيءٍ ما.
    - lemma: "مُحْتَوىً تَرْوِيجِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي يجمع «محتوى» (مادة الرسالة) + «ترويجي» (موجَّه للترويج).
        يُعبِّر عن الجانب المضموني للمادة الإعلانية ويُلائم السياق الرقمي المعاصر.


