    - lemma: "جِرْمٌ"
      entry_id: "{auto}"
      root: "جرم"
      maqayis_quote: "«الجيم والراء والميم أصل واحد يرجع إليه الفروع. فالجرم القطع... والجسد جرم، لأن له قدرا وتقطيعا.»"
