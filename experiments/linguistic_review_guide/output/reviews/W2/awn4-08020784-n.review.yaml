      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"فضاء","root":"فضي","maqayis":"«الْفَاءُ وَالضَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْفِسَاحٍ فِي شَيْءٍ وَاتِّسَاعٍ. مِنْ ذَلِكَ الْفَضَاءُ: الْمَكَانُ الْوَاسِعُ.»"},{"word":"جزئي","root":"جزا","maqayis":"«الْجِيمُ وَالزَّاءُ وَالْهَمْزَةُ أَصْلٌ وَاحِدٌ، هُوَ الِاكْتِفَاءُ بِالشَّيْءِ... وَالْجُزْءُ: الطَّائِفَةُ مِنَ الشَّيْءِ.»"}]}'
