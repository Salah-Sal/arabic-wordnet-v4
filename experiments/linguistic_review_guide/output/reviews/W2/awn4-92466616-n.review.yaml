stage4_content:
  definition:
    current: "مادة تميل لإنتاج حب الشباب، مثلاً عن طريق سد المسام في الجلد"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكنه يفتقر للمصطلحات العلمية الدقيقة (الزؤان، العدّ) ويحتاج لصياغة أكثر شمولاً."
    authored:
      - type: terminological
        text: "مادّة فيزيائيّة تحفّز تكوّن الزُّؤان (الرؤوس السوداء والبيضاء) أو تسبّب ظهور العُدّ (حب الشباب) عن طريق انسداد جريبات الشعر والمسام في الجلد."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-92466616-n"
          definition_index: 0
          text: "مادّة فيزيائيّة تحفّز تكوّن الزُّؤان (الرؤوس السوداء والبيضاء) أو تسبّب ظهور العُدّ (حب الشباب) عن طريق انسداد جريبات الشعر والمسام في الجلد."
  examples:
    per_lemma:
      - lemma: "مَادَّة سَادَّة لِلْمَسَام"
        examples:
          - text: "يجب على ذوي البشرة الحساسة تجنب مستحضرات التجميل التي تحتوي على مواد سادّة للمسام."
            type: usage
      - lemma: "مَادَّة زُؤَانِيَّة"
        examples:
          - text: "يُنصح دائمًا باختيار واقي شمس غير زؤاني لضمان عدم تفاقم مشاكل البشرة الدهنية."
            type: usage
      - lemma: "مَادَّة مُحْدِثَة لِلْعُدّ"
        examples:
          - text: "أثبتت الدراسات المخبرية أن بعض الزيوت المعدنية قد تعمل كمواد محدثة للعدّ عند استخدامها بتركيز عالٍ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-92466616-n"
          text: "تتسبب المواد السادّة للمسام في احتباس الزيوت داخل الجلد، مما يؤدي إلى ظهور الرؤوس السوداء."

