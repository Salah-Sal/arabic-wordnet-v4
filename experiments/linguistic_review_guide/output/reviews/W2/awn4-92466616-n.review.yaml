stage1_review:
  assessment:
    concerns:
      - "اللّمات الموجودة عبارة عن تعابير وصفية طويلة وليست مصطلحات معجمية موجزة."
      - "كلمة 'سادة' في 'مادة سادة' قد تُقرأ 'Sada' (بمعنى سادة/أسياد أو سادة/بسيطة) والصواب 'سادّة' بتشديد الدال."
      - "استخدام 'الزيوان' شائع ولكن 'الزؤان' هو المصطلح الطبي المعتمد في المعجم الطبي الموحد."
    observations: "المجموعة تفتقر إلى المصطلحات الطبية الدقيقة (مثل زؤاني ومحدث للعد) التي تعبر عن المفهوم بكلمة واحدة أو مركب اصطلاحي مستقر."
  blind_candidates:
    - lemma: "مَادَّة مُسِدَّة لِلْمَسَام"
      generation_method: tarkib
      justification: "تعبير اصطلاحي طبي يعبر عن خاصية سد المسام (obstruent/occlusive) بشكل أدق من 'سادة'."
    - lemma: "مَادَّة مُزَوِّنَة"
      generation_method: ishtiqaq
      justification: "اشتقاق اسم فاعل من 'زؤان/زيوان' للتعبير عن خاصية إنتاج الزؤان (comedogenic)."
    - lemma: "مَادَّة مُبَثِّرَة"
      generation_method: ishtiqaq
      justification: "اشتقاق من 'بثر' (حب الشباب) للتعبير عن المادة المسببة له (acnegenic)، وقد وردت في معاجم مثل دوزي."
    - lemma: "زُؤَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي أو صفة من الزؤان لتمثيل خاصية المادة (comedogenicity)."

stage2_evidence:
  per_lemma:
    - lemma: "مادة سادة للمسام"
      confirm:
        - text: "«السُّدَادُ: دَاءٌ يَأْخُذُ فِي الْأَنْفِ يَمْنَعُ النَّسِيمَ.»"
          source: "مقاييس اللغة"
        - text: "«مُسِدّ: obstruent»"
          source: "المعجم الطبي الموحد"
    - lemma: "مادة مسببة للزيوان"
      confirm:
        - text: "«زُؤانِيُّ: comedogenic»"
          source: "المعجم الطبي الموحد"
        - text: "«زُؤان (صمامة من الكراتين و الزهم تسد فتحة جريب الشعرة): comedo»"
          source: "المعجم الطبي الموحد"
    - lemma: "مَادَّة زُؤَانِيَّة"
      confirm:
        - text: "«زُؤانِيُّ: comedogenic»"
          source: "المعجم الطبي الموحد"
        - text: "«وَحْمَةٌ زُؤانِيَّة: nevus comedonicus»"
          source: "المعجم الطبي الموحد"
    - lemma: "مَادَّة مُحْدِثَة لِلْعُدّ"
      confirm:
        - text: "«مُحْدِثُ العُدّ: acnegenic»"
          source: "المعجم الطبي الموحد"
        - text: "«عُدّ: acne»"
          source: "المعجم الطبي الموحد"
    - lemma: "مَادَّة مُبَثِّرَة"
      confirm:
        - text: "«مبثرة للفم أي تسبب خروج البثور في الفم»"
          source: "تكملة المعاجم العربية (دوزي)"

