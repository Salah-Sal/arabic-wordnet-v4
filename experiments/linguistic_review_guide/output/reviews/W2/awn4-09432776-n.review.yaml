        result: "pass"
      nuance_differentiation: "يرادف (حيد محيطي) تماماً ويُفضل في المناهج الجيولوجية المتأثرة بالمدرسة الفرنسية."
      example: "تتكون قشرة محيطية جديدة عند منطقة الظهر المحيطي بسبب صعود الصهارة."
