step0_evidence:
  per_lemma:
    - lemma: "حيد محيطي"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "المعاجم المتخصصة تورد كلمة (حيد) بمعنى (ridge) في الجيولوجيا، وكلمة (محيطي) بمعنى (oceanic). كما تورد المعاجم (تلال وسط المحيط) كمرادف قريب."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تلال وسط المحيط"
      source_section: "step6_fts_keyword"
      evidence_citation: "«صدع ممدود يتوسع ويرتفع في قاع المحيط حيث ينبثق البازلت بشكل دوري، ويشكل القشرة المحيطية الجديدة» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      justification: "تركيب إضافي وجد في المعاجم البيئية كترجمة لـ (mid-oceanic ridges)."
  knowledge_candidates:
    - lemma: "ظهر محيطي"
      justification: "تركيب وصفي (مجاز) يُستخدم بكثرة في الجيولوجيا كترجمة للمصطلح الأجنبي (Dorsale océanique / Oceanic ridge)."
  generation_notes: "المصطلح (حيد محيطي) هو الأكثر شيوعاً ودقة جيولوجياً، تليه المصطلحات الأخرى المستمدة من مدارس مختلفة."

step1_lemma_validation:
  per_lemma:
    - lemma: "حيد محيطي"
      decision: confirmed
      decision_reason: "مصطلح علمي دقيق وشائع في الجيولوجيا (مركب وصفي)، وهو ترجمة مطابقة لـ oceanic ridge وتتفق مكوناته مع المعاجم."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح الأكاديمي القياسي للتعبير عن التضاريس المرتفعة الممتدة في قاع المحيط."
      example: "يعتبر الحيد المحيطي الأطلسي من أطول السلاسل الجبلية المغمورة تحت الماء."
    - lemma: "تلال وسط المحيط"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي يميل إلى شرح المفهوم بدلاً من أن يكون مصطلحاً مسكوكاً وموجزاً، ويُستخدم بصيغة الجمع عادةً."
      step05_citation: "«صدع ممدود يتوسع ويرتفع في قاع المحيط...» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
    - lemma: "ظهر محيطي"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح جيولوجي مسكوك وشائع الاستعمال ويمثل اقتراضاً مفهومياً معتمداً."
      step05_citation: "المعرفة الجيولوجية المتخصصة."
