    - lemma: "بُرْهَان"
      decision: confirmed
      decision_reason: >
        مصطلح أصيل موثَّق في المعجمية العربية الكلاسيكية والمنطقية والفقهية، يدل على
        أقوى صور الإثبات وأوثقها. التشكيل الصحيح: بُرْهَان.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        البُرْهَان أعلى درجات الإثبات في سلّم الأدلة؛ إذ يقوم على اليقينيات ويُفضي إلى
        نتيجة لازمة ضرورية؛ على خلاف الدليل الذي قد يكون ظنياً، والبيّنة التي قد تقتصر
        على الشهادة الحسية.
      actions:
        - command: update_lemma
          params:
