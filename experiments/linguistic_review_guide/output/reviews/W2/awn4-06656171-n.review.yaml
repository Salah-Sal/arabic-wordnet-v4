      decision_reason: >
        مصطلح راسخ في الفقه والقانون والمعجمية العربية، يعني الدلالة الواضحة حسيّة أو
        عقلية. التشكيل الصحيح: بَيِّنَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        البَيِّنَة هي الحجة الواضحة المُشاهَدة أو المُدرَكة مباشرةً، ومستخدمة في الفقه
        والقضاء للإثبات المادي؛ تختلف عن البرهان (الاستدلال اليقيني) وعن الدليل (الأمارة
        التي يُستدل بها) بأنها تنصبّ على الوضوح الحسي والقطعي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَيِّنَة"

    - lemma: "دَلِيل"
      decision: confirmed
      decision_reason: >
        أعمّ المصطلحات الثلاثة وأشملها؛ يدل في اللغة والمنطق والفقه على ما يُستدل به
        للوصول إلى المطلوب. التشكيل الصحيح: دَلِيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الدَّلِيل أعم الثلاثة؛ يشمل كل ما يُرشد إلى الحقيقة أو يُمكّن من إدراكها سواء
        كان يقينياً (= برهان) أو ظنياً؛ وهو في اللغة أيضاً «المرشد» وفي الاصطلاح «ما
        يُلزم من العلم به العلم بآخر»، مما يجعله أوسع مدلولاً من البيّنة والبرهان.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَلِيل"

    - lemma: "شَاهِد"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الشاهد يرد في بعض المعاجم بمعنى «الدليل»، فإن استعماله الراسخ في الفقه
        والقانون وعموم الاستعمال العربي يخص الشخصَ المدلي بالشهادة لا الدليل المادي
        أو الإشارة الدالة؛ وهو ما يُنشئ اشتراكاً لفظياً مُربكاً مع المجموعة الحالية.
        اختبار السك: استبدال «الشاهد على الجريمة» بـ«دليل على الجريمة» يُغيِّر الدلالة
