        (evidence/presumption) يُكرِّس استخدامها في السياق ذاته. اختبار التثبيت المعجمي:
        «القرينة» وحدة معجمية ثابتة في الفقه والأصول. التعارض مع معنى «النفس/الزوجة»
        خُصومة بين استعمالَيْن لنفس اللفظ، والمعنى الاصطلاحي المتعلق بالدليل أثبتُ
        توثيقاً في المصادر الاصطلاحية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        القَرِينَة هي الأمر الدال على المراد لا بالنص الصريح بل بالاقتران والملازمة؛
        هي الدليل الظرفي والاستنتاجي، تختلف عن البرهان (قطعي يقيني) وعن البيّنة
        (حسية أو قضائية واضحة) وعن الدليل (أشمل وأعم) بأنها تعتمد على الاستنتاج
        من القرائن المصاحبة.
      actions:
        - command: create_entry
          params:
            lemma: "قَرِينَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "كَاشِف"
      source: stage1
      decision: removed
      decision_reason: >
        استُقرَّ «كاشف» في المعاجم التقنية العربية (أربعة عشر مصدراً في arabterm)
        بمعنى detector أو reagent؛ وهو الاستعمال المهيمن في العصر الحديث. إعادته إلى
        مجال «الدليل» ستُنشئ تضارباً مع الاستعمال التقني الراسخ. أما أمر «كشف الأمر»
        فالأدق التعبير عنه بالدليل أو البيّنة.
