# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يستخدم لفظ «دلالة» الذي هو بالضبط مصطلح المجموعة الأم (awn4-06810027-n)، مما يُفضي إلى دوران معجمي."
      - "عبارة «شيئاً ما» كَلْك إنجليزي مباشر لـ something، وليست من أساليب المعجم العربي الفصيح."
      - "اللمّات الثلاث الموجودة (برهان، بينة، دليل) مكتوبة بدون تشكيل كامل."
      - "المجموعة تخلو من مصطلح «القرينة» الذي يُعبِّر عن الدليل الاستنتاجي الظرفي وهو تنويع دلالي مهم في المجموعة."
    observations: >
      المجموعة تضمّ ثلاثة مصطلحات عربية أصيلة راسخة في التراث الفقهي والمنطقي والمعجمي،
      غير أنها تشترك جميعاً في الحقل الدلالي العام للإثبات والاستدلال مع فوارق نوعية واضحة:
      البرهان أقوى درجات الدليل (يقيني)، والبينة الحجة المادية الحسية أو العقلية الواضحة،
      والدليل أعمّها وأشملها. غياب «قرينة» يُخلّ بتمثيل الدلالة الاستنتاجية الظرفية.

  blind_candidates:
    - lemma: "شَاهِد"
      generation_method: majaz
      justification: >
        الشاهد أصلاً «الحاضر العالم بالأمر» ثم نُقل مجازاً إلى «ما يشهد على صحة الشيء»؛
        يعمل الانكشاف الدلالي من الشاهد البشري إلى الأمر الدالّ.
    - lemma: "مُبِين"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «أَبَانَ» على وزن مُفعِل، بمعنى «الذي يُجلي الأمرَ ويُظهره»؛
        الاشتقاق من جذر بَيَنَ المعروف بدلالة الظهور والانكشاف.
    - lemma: "قَرِينَة"
      generation_method: majaz
      justification: >
        من «قَرَنَ» بمعنى جمع شيء إلى شيء؛ القرينة ما يقترن بالأمر ليدل عليه
        من غير نصٍّ صريح، إزاحة دلالية من معنى «الاقتران» إلى «الأمر الدال بالاقتران».
    - lemma: "كَاشِف"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «كَشَفَ» على وزن فاعِل، بمعنى «ما يسرو الغطاءَ عن الشيء
        ويُجليه»؛ يناسب التعريف «دلالة تجعل شيئاً ما واضحاً».


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "بُرْهَان"
      confirm:
        - text: "«الحُجّة الفاصلة البيّنة؛ (في الفلسفة): استدلال ينتقل فيه الذهن من قضايا مُسلَّمة إلى أخرى تنتج عنها ضرورةً»"
          source: "المعجم الكبير (ocr)"
        - text: "«البرهان آكد الأدلة وهو الذي يقتضي الصدق أبداً لا محالة»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
        - text: "«البرهان: بيان الحجة وإيضاحها على ما قال الخليل. وقد يطلق على الحجة نفسها»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
        - text: "«البرهان: هو القياس المؤلف من اليقينيات. والبرهان بيانٌ يظهر به الحقُّ من الباطل»"
          source: "التعريفات الفقهيّة للبركتي (hawramani)"
      expands:
        - text: "«البُرهان اللِّمِّي: ما يكون الحد الأوسط فيه علته للنسبة في الذهن والعين معاً. البُرهان الإِنِّي: ما يكون الحد الأوسط فيه علته للنسبة في الذهن فقط»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani)"
          addition: "يُميّز بين نوعين من البرهان: اللمّي (من السبب إلى المسبَّب) والإنّي (من المسبَّب إلى السبب)، مما يوضح أن البرهان منهجٌ استدلالي راسخ لا مجرد إشارة."

    - lemma: "بَيِّنَة"
      confirm:
        - text: "«البينة: الدلالة الواضحة عقلية كانت أو حسية»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
        - text: "«الحجة الواضحة»"
          source: "المعجم الوسيط (ocr)"
        - text: "«ما يُبَيِّن الشيءَ ويُوضِّحُه، حسيّاً كان الشيء أو عقليّاً؛ في الشرع: اسمٌ لِما يُبيِّن الحقَّ ويُظْهِرُه»"
          source: "المعجم الكبير (ocr)"
        - text: "«البيِّنة: هي الحجة القويةُ والدليلُ»"
          source: "التعريفات الفقهيّة للبركتي (hawramani)"
      expands:
        - text: "«ما تَثْبُت به الحقوقُ والدعاوي، وتُبْنَى عليه أحكامُ القضاء»"
          source: "المعجم الكبير (ocr)"
          addition: "يُبرز الاستخدام القانوني والفقهي الراسخ للبيّنة بوصفها أداة إثبات قضائية."

    - lemma: "دَلِيل"
      confirm:
        - text: "«الدليل: ما يُؤَدِّي إِلَى إِدْرَاك الْمَطْلُوب، وقيل: ما يلزم من العلم به العلم بشيء آخر»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani)"
        - text: "«الدليل: لغة، المرشد وما به الإرشاد. وفي عرف أهل الميزان: ما يلزم من العلم به العلم بآخر»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
        - text: "«الدَّالُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا إِبَانَةُ الشَّيْءِ بِأَمَارَةٍ تَتَعَلَّمُهَا؛ فالدليل: الأمارة في الشيء»"
          source: "مقاييس اللغة لابن فارس (مدخل دَلَّ)"
        - text: "«دليل مقبول، إثبات مقبول: دليل أو إثبات يتم قبوله من طرف المحكمة للإثبات أو النفي»"
          source: "المعجم الموحد لمصطلحات القانون (arabterm)"
      expands:
        - text: "«علامة تفيد مدلولاً معيناً بواسطة دال يكون إما خطياً أو سمعياً أو بصرياً»"
          source: "المعجم الموحد لمصطلحات اللسانيات (arabterm)"
          addition: "يوسِّع الدلالة لتشمل الأنظمة السيميائية، وليس فقط الحجة المنطقية."

    - lemma: "شَاهِد"
      confirm:
        - text: "«الشَّاهِد: من يُؤَدِّي الشَّهادةَ، والدَّليلُ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«الشَّاهِد: الحاضِرُ، الدَّلِيلُ من الأُمورِ»"
          source: "المعجم الكبير (ocr)"
        - text: "«الشاهد عند أهل الأصول: المعلوم المستدل به قبل العلم بالمستدل عليه»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
      contradicts:
        - text: "«الشاهد: هو المخبر بقضية أو بحق شخص على غيره، عن مشاهدة وعيان، لا عن تخمين وحسبان»"
          source: "التعريفات الفقهيّة للبركتي (hawramani)"
          conflict: "الاستعمال الراسخ للشاهد في الفقه والقانون هو الشخصُ الإنسانيُّ الذي يُدلي بشهادته، لا الدليل المادي أو الأمر الدال؛ مما يُربك الاستعمال في المجموعة."

    - lemma: "مُبِين"
      confirm:
        - text: "«المُبيَّنُ: الْوَاضِح بِنَفسِهِ أَو بِغَيْرِهِ»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani)"
        - text: "«مُبين: الظاهر والمتضح والمفصح عما يريد ومظهر الشيء وموضحه»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
      contradicts:
        - text: "«مُبِين: مَوْضِعٌ في بلاد تَمِيم، أو اسْمُ بئر»"
          source: "المعجم الكبير (ocr)"
          conflict: "المعجم الكبير يُسجِّل مُبين اسماً خاصاً لمكان، مما يعني أن المفردة قد هُجرت كاسم عام للحجة أو الدليل."

    - lemma: "قَرِينَة"
      confirm:
        - text: "«القرينة: عند أهل العربية هي الأمر الدّالّ على شيء لا بالوضع»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
        - text: "«القَرِينة: ما يدلُّ على المراد من غير كونه صريحاً؛ والقرينةُ القاطعةُ: كمن خرج من البيت وبيده سكِّين وفيه الدم...»"
          source: "التعريفات الفقهيّة للبركتي (hawramani)"
        - text: "«القرينة: في الاصطلاح، أمر يشير إلى المطلوب. والقرينة إما حالية أو معنوية أو لفظية»"
          source: "كتاب التعريفات للشريف الجرجاني (hawramani)"
        - text: "«القرينة: presumption / evidence»"
          source: "المعجم الموحد لمصطلحات القانون (arabterm)"
      contradicts:
        - text: "«القَرِينَةُ: النفس، الزوجة؛ لأنها تقارن زوجها»"
          source: "المعجم الوسيط (ocr)"
          conflict: "المعنى اللغوي الأصلي للقرينة هو النفس أو الزوجة بسبب الاقتران، وهو مغاير تماماً للمعنى الاصطلاحي المراد."

    - lemma: "كَاشِف"
      contradicts:
        - text: "«كاشِف: detector»"
          source: "مسرد الهندسة الكهربائية - موسوعة الكهرباء (arabterm)"
          conflict: "المعنى المستقر في المعاجم التقنية العربية الحديثة هو «جهاز الكشف/المستجيب» وهو مغاير لمفهوم «الدليل أو البينة»."
        - text: "«كاشف: reagent — مادة كيميائية تستخدم لكشف وجود مواد أخرى»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (arabterm)"
          conflict: "الكاشف استُعمل مصطلحاً للكاشف الكيميائي، مما يُرسّخ دلالة تقنية بعيدة عن مفهوم الدليل المعرفي."


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
