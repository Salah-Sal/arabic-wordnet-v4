# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "(فيزياء) خاصية كون الشيء متماثل الخواص؛ له نفس القيمة عند قياسه في اتجاهات مختلفة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم الصيغة الوصفية «متماثل الخواص» (= isotropic، صفة) لتعريف الاسم المجرد (= isotropy، اسم) — مما يُفضي إلى دوران تعريفي. كذلك «متماثل» أُزيلت لمّته من المجموعة لصالح «تساوي». يُستحسن تعريف مصطلحي بجنس قريب (خاصية + نوع الوسط) وفصل نوعي (تساوي القيم باختلاف الاتجاه)."
    authored:
      - type: terminological
        text: "(فيزياء) خاصِّيَّةٌ لبعضِ الموادِّ والأوساطِ الطبيعيَّةِ؛ تَجعلُ مقادِيرَها الفيزيائيَّةَ مُتَسَاوِيَةً عند القياسِ في جميعِ الاتِّجَاهَاتِ المكانيَّةِ، ونقيضُها التباينُ الاتِّجَاهِيّ"
