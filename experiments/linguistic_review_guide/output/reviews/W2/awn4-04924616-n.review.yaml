# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "لمة «تماثل الخواص» غير موثَّقة اصطلاحاً بوصفها اسماً لـ isotropy في أيٍّ من المعاجم التقنية المعتمدة؛ صيغة «تساوي الخواص» هي المُقابَل الموثَّق في معاجم الجيولوجيا والزلازل والجغرافيا وغيرها، فيما «متماثل الخواص» صفةٌ (isotropic) لا اسماً"
      - "لمة «توحد الخواص» تحمل دلالة الانفراد والتفرُّد (singularity/uniqueness) وفق معاجم اللغة ومقاييسها، وهذا يناقض دلالة isotropy القائمة على الاستواء والتعادل في جميع الاتجاهات"
      - "غياب تشكيل كامل على اللمتَين الموجودتَين"
      - "التعريف الحالي يستخدم الصيغة الوصفية «متماثل الخواص» لتعريف الاسم المجرد، مما يُفضي إلى دوران تعريفي ضمني"
    observations: "المجموعة تمثّل مفهوم الـ isotropy الفيزيائي (تناحي الخواص أو تساويها في جميع الاتجاهات المكانية). تكشف المسح الأولي أن المعاجم التقنية العربية تتفرق في تعبيرها عن هذا المفهوم: «تساوي الخواص» في معاجم الجيولوجيا وعلوم الزلازل والجغرافيا، و«اتساق الاتجاهات» في المعجم الطبي الموحد، و«وحدة الخصائص» في الكيمياء، و«لاتجاهي الخواص» في معجم الفيزياء (وهذا وصف لا اسم)، و«متناح» في المورد الحديث (اسم فاعل). الصيغتان الحاليتان في AWN4 (تماثل الخواص، توحد الخواص) ضعيفتا التوثيق لهذا المعنى تحديداً، والأُولى مرتبطة بـ symmetry في الأدبيات لا بـ isotropy."
  blind_candidates:
    - lemma: "تَسَاوِي الخَوَاصِّ"
      generation_method: tarkib
      justification: "تركيب إضافي من «تَسَاوِي» (مصدر تساوى، جذر سوي — يدل على الاستقامة والاعتدال بين شيئين وفق مقاييس اللغة) و«الخَوَاصِّ» (جمع خاصية). يُعبّر مباشرةً عن مضمون التعريف «له نفس القيمة عند قياسه في اتجاهات مختلفة»: الخواص متساوية. اختيار الجذر سوي يُوثَّق بمعنى التعادل والتماثل الكمي."
    - lemma: "اتِّسَاقُ الاتِّجَاهَاتِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «اتِّسَاق» (مصدر اتسق، جذر وسق — يدل على الجمع والضمّ) و«الاتِّجَاهَات» (جمع اتجاه، جذر وجه). «اتساق» في العربية المعاصرة يحمل معنى الانتظام والتوافق؛ فاتساق الاتجاهات يعني أن الاتجاهات منتظمة متوافقة (أي القياس فيها يعطي النتيجة ذاتها). يُعبّر عن المفهوم من زاوية الاتجاهات لا الخواص."
    - lemma: "اسْتِوَاءُ الاتِّجَاهَاتِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «اسْتِوَاء» (مصدر استوى، جذر سوي — يدل على التسطح والتعادل والانبساط) و«الاتِّجَاهَات». الاستواء مجاز طبيعي لـ isotropy: كأن الاتجاهات كلها تقف على مستوى واحد من حيث قيمة الخاصية. الجذر سوي يدعم معنى التعادل."
    - lemma: "التَّنَاظُرُ الاتِّجَاهِيُّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «تَنَاظُر» (مصدر تناظر، جذر نظر — بمعنى المقابلة والتناظر) والصفة «اتِّجَاهِيّ». يصف تناظر الخواص وتقابلها في جميع الاتجاهات، مما يُعبّر عن مضمون «له نفس القيمة في اتجاهات مختلفة» من خلال التناظر الاتجاهي."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استُعمل 5 استعلامات: (١) مطابقة دفعية للمكوّنات، (٢) جسر إنجليزي لـ isotropy/symmetry،
# (٣) بحث كلمات مفتاحية عربية، (٤) التحقق من المرشحات، (٥) مقاييس اللغة للجذور
stage2_evidence:
  per_lemma:

    - lemma: "تماثل الخواص"
      confirm:
        - text: "«متماثل الخواص: صفة حالة تكون فيها كمية ما، أو المشتقات المكانية لهذه الكمية، موَّحدة الخواص في جميع الاتجاهات» [translation_en: isotropic]"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
      contradicts:
        - text: "«تماثل: التشابه والتساوي في الشكل والحجم والمكان النسبي لأجزاء جسم ما على جبهتين متقابلتين» [translation_en: symmetry]"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "تماثل منفرداً في المعاجم التقنية مُقابَل لـ symmetry وليس isotropy؛ الخلط بينهما خطأ مصطلحي إذ هما مفهومان فيزيائيان مختلفان"
        - text: "«التّماثل: [في الإنكليزية] Equality, analogy؛ والمماثلة عند المحاسبين كون العددين متساويين»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "تماثل يدل على التشابه والمساواة المطلقة لا على الاستواء في الاتجاهات الفيزيائية تحديداً"

    - lemma: "توحد الخواص"
      contradicts:
        - text: "«(تَوَحَّدَ) اللهُ بربوبيته وجلاله وعظمته: تفرَّد بها. فلانٌ: بقى مفرداً. برأيه: تفرَّد به»"
          source: "المعجم الوسيط"
          conflict: "توحد يعني الانفراد والتميز — وهو ضدّ التناحي الذي يعني التساوي في كل الاتجاهات"
        - text: "«(توَحد) الله بربوبيته وجلاله وعظمته تفرد بها وفلان بقي مفرداً وبرأيه تفرد به»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
          conflict: "الدلالة ذاتها: الانفراد والتفرد لا الاستواء والتعادل"
        - text: "«وَحَدَ: الْوَاوُ وَالْحَاءُ وَالدَّالُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر وحد يدل على الانفراد لا على التعادل؛ فجذر توحد لا يُفيد دلالة isotropy"

    - lemma: "تَسَاوِي الخَوَاصِّ"
      confirm:
        - text: "«تساوي الخواص الضوئية في كل الاتجاهات» [translation_en: isotropy]"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«تساوي الخواص الضوئية في كل الاتجاهات» [translation_en: isotropy]"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "[translation_en: isotropy] (إدخال مباشر)"
          source: "مسرد الجغرافيا والتاريخ — المنظمة العربية للتربية والثقافة والعلوم"
        - text: "[translation_en: isotropy] (إدخال مباشر)"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«تساوي الخصائص، وحدة الخصائص» [translation_en: isotropy; isotropisme]"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«متساوي الخواص: متساوي الخصائص في جميع الاتجاهات» [translation_en: isotropic]"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يُثبت صحة صيغة الخواص في السياق الاتجاهي (في جميع الاتجاهات)"
        - text: "«سَوِيَ: السِّينُ وَالْوَاوُ وَالْيَاءُ أَصْلٌ يَدُلُّ عَلَى اسْتِقَامَةٍ وَاعْتِدَالٍ بَيْنَ شَيْئَيْنِ. يُقَالُ هَذَا لَا يُسَاوِي كَذَا، أَيْ لَا يُعَادِلُهُ. وَفُلَانٌ وَفُلَانٌ عَلَى سَوِيَّةٍ مِنْ هَذَا الْأَمْرِ، أَيْ سَوَاءٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر سوي يدل على التعادل والاستقامة بين شيئين — وهو أساس دلالة تساوي الخواص"

    - lemma: "اتِّسَاقُ الاتِّجَاهَاتِ"
      confirm:
        - text: "[translation_en: isotropy] (إدخال مباشر)"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«مُتَّسِقُ الاتِّجاهات» [translation_en: isotropic]"
          source: "المعجم الطبي الموحد (2009)"
          addition: "الصيغة الصفية المقابلة (isotropic) مُوثَّقة في المصدر ذاته، مما يُثبت الثنائية (اسم + صفة) للمصطلح"
        - text: "«وَسَقَ: الْوَاوُ وَالسِّينُ وَالْقَافُ: كَلِمَةٌ تَدُلُّ عَلَى حَمْلِ الشَّيْءِ. وَوَسَقَتِ الْعَيْنُ الْمَاءَ: حَمَلَتْهُ. قَالَ اللَّهُ سُبْحَانَهُ: {وَاللَّيْلِ وَمَا وَسَقَ} أَيْ جَمَعَ وَحَمَلَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر وسق يدل على الجمع والحمل؛ ومنه اتساق بمعنى الانتظام والتوافق في العربية المعاصرة"

    - lemma: "اسْتِوَاءُ الاتِّجَاهَاتِ"
      evidence_status: "no_material_found"

    - lemma: "التَّنَاظُرُ الاتِّجَاهِيُّ"
      contradicts:
        - text: "«تناظر» [translation_en: symmetry]"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "تناظر مقابل لـ symmetry في معاجم الفيزياء، لا لـ isotropy — وهما مفهومان مختلفان فيزيائياً"
        - text: "«(1) تناظُر؛ تماثُل (2) تناسُق؛ تساوُق» [translation_en: symmetry]"
          source: "المورد الحديث (2008)"
          conflict: "تناظر = symmetry بإجماع المعاجم المتعددة؛ لا صلة له بـ isotropy"
        - text: "«تناظر بِلَّوري» [translation_en: crystal symmetry]"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "التركيب المُثبَت في معاجم الفيزياء يربط تناظر باتجاه التماثل البلوري، لا بالتناحي"


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────────
