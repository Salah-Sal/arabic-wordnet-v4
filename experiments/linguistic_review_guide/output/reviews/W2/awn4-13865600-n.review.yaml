# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13865600-n
# reciprocality of sentiments — تبادل المشاعر
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تَبَادُلِيَّة» مشتركة مع المجموعة الأمّ (awn4-13863412-n) التي تعريفها «علاقة اعتماد أو عمل أو تأثير متبادل»، ممّا يجعل التمييز المعجمي بين الأمّ والبنت معدوماً"
      - "التعريف العربي «تبادل المشاعر» مختصر جداً ولا يميّز المجموعة عن مفهوم التبادلية العامّ"
      - "المجموعة تحتوي لمّة واحدة فقط، وهذا يضعف الشبكة الدلالية"
    observations: "المفهوم هو خاصّية التبادل في المشاعر تحديداً (أن يبادل شخصٌ شخصاً آخر المشاعرَ نفسها)، وهو نوع خاصّ من التبادلية العامّة. العربية غنيّة بألفاظ التبادل العاطفي على وزن تَفَاعُل (تَوَادّ، تَعَاطُف) ومُفَاعَلَة (مُوَادَّة)، لكنّ المصدر الصناعي «تبادلية» أعمّ ولا يختصّ بالمشاعر."

  blind_candidates:
    - lemma: "تَوَادّ"
      generation_method: ishtiqaq
      justification: "من الجذر «ودد» على وزن تَفَاعُل الدالّ على المشاركة والتبادل، ويعني تبادل الودّ والمحبّة بين طرفين، وهو أخصّ من التبادلية العامّة"
    - lemma: "مُوَاجَدَة"
      generation_method: ishtiqaq
      justification: "من الجذر «وجد» على وزن مُفَاعَلَة الدالّ على المشاركة، بمعنى تشارك الوِجْدان والمشاعر بين الطرفين"
    - lemma: "تَعَاطُف"
      generation_method: ishtiqaq
      justification: "من الجذر «عطف» على وزن تَفَاعُل، بمعنى أن يعطف كلّ طرف على الآخر ويبادله الشعور"
    - lemma: "تَجَاوُب"
      generation_method: ishtiqaq
      justification: "من الجذر «جوب» على وزن تَفَاعُل، بمعنى استجابة كلّ طرف لمشاعر الآخر وتبادلها"


stage2_evidence:
  per_lemma:
    - lemma: "تَبَادُلِيَّة"
      confirm:
        - text: "«(1) التبادليّة: كون الشيء مُتَبادَلًا (2) تبادل العواطف إلخ.»"
          source: "المورد الحديث (2008)"
        - text: "«تبادلية — reciprocity»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
        - text: "«تَبادُلِيَّة — reciprocity»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَبادُلِية — reciprocity»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«تبادلية — reciprocity»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«(1) التبادُليّة (2) تبادُل (3) المعاملة بالمثل [بين حكومتين] من حيث القيود على التجارة أو التسهيلات الخاصة بها.»"
          source: "المورد الحديث (2008)"
          addition: "المورد يوسّع دلالة التبادلية لتشمل التبادل والمعاملة بالمثل السياسية، فضلاً عن تبادل العواطف"
        - text: "«تبادلية — commutativity»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "في الرياضيات والتجارة تُستعمل بمعنى الإبدالية (commutativity) لا التبادل العاطفي"

    - lemma: "تَوَادّ"
      confirm:
        - text: "«توادَّ الصَّديقان: تحابَّا، وودَّ كلٌّ منهما الآخر»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«تَوَاد — من (و د د) الحبب والتراحم.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«التقى الثريان — مثل في سرعة تواد الرجلين»"
          source: "أساس البلاغة للزمخشري"
          addition: "التواد مستعمل في الأمثال العربية القديمة بمعنى التحابب السريع بين شخصين"

    - lemma: "مُوَاجَدَة"
      evidence_status: "no_material_found"

    - lemma: "تَعَاطُف"
      contradicts:
        - text: "«تعاطف — sympathy»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
          conflict: "التعاطف يقابل sympathy لا reciprocality of sentiments، فهو المشاركة الوجدانية لا تبادل المشاعر"
        - text: "«تعاطف — sympathy»"
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
          conflict: "مصطلح مكرّس لمفهوم التعاطف (sympathy) في الفلسفة وعلم النفس"
      expands:
        - text: "«(تعاطف) الْقَوْم عطف بَعضهم على بعض وَفُلَان فِي مشيته تثنى»"
          source: "المعجم الوسيط"
          addition: "الدلالة المعجمية الأصلية هي عطف القوم بعضهم على بعض، وهي أقرب للتراحم منها للتبادلية"

    - lemma: "تَجَاوُب"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "تَبَادُلِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مكرّس في المعاجم المصطلحية الحديثة لمعنى reciprocity، والمورد الحديث ينصّ صراحةً على «تبادل العواطف» كأحد معانيه. الجذر «بدل» يدلّ على قيام الشيء مقام الشيء، والمصدر الصناعي «تبادلية» يحوّل فعل التبادل إلى خاصّية مجرّدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبَادُلِيَّة"

    - lemma: "تَوَادّ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي أصيل مثبت في المعاجم الكلاسيكية والمعاصرة بمعنى التحابب المتبادل. يختصّ بالمشاعر تحديداً (الودّ والمحبة) على خلاف «تبادلية» العامّ، ممّا يجعله أدقّ تعبيراً عن مفهوم المجموعة «reciprocality of sentiments». مثبت في أساس البلاغة والمعجم المعاصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بتبادل الودّ والمحبّة بين طرفين، بينما «تبادلية» تدلّ على خاصّية التبادل مطلقاً سواء في المشاعر أو غيرها"
      actions:
        - command: create_entry
          params: {lemma: "تَوَادّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُوَاجَدَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تثبت استعمال هذا اللفظ. صيغة غير مسكوكة ولا مسجّلة في المعاجم."

    - lemma: "تَعَاطُف"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مكرّس لمفهوم «sympathy» في علم الاجتماع والفلسفة وعلم النفس، وهو مفهوم مختلف عن تبادل المشاعر (reciprocality of sentiments). التعاطف مشاركة وجدانية أحادية الاتجاه لا تبادلية ثنائية."

    - lemma: "تَجَاوُب"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تربطه بتبادل المشاعر. التجاوب أعمّ ويدلّ على الاستجابة المتبادلة في أيّ سياق، وليس مصطلحاً مخصّصاً لتبادل العواطف."


