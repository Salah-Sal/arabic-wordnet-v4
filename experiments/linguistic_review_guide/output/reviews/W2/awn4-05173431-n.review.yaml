stage2_evidence:
  per_lemma:

    - lemma: "إِتْلَاف"
      confirm:
        - text: "«(1) نهب؛ سلب (2) تخريب؛ إتلاف (3) خراب؛ تلف (4) ينهب؛ يسلب (5) يخرب؛ يتلف»"
          source: "المورد الحديث (2008) — ترجمة ravage"
        - text: "«عملية حذف المعطيات من قرص أو غيره بحيث لا يمكن بعد ذلك استرجاع تلك المعطيات»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
      contradicts:
        - text: "«التَّاءُ وَاللَّامُ وَالْفَاءُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ ذَهَابُ الشَّيْءِ. يُقَالُ تَلِفَ يَتْلَفُ تَلَفًا. وَأَرْضٌ مَتْلَفَةٌ، وَالْجَمْعُ مَتَالِفُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر ت-ل-ف يدلّ على ذهاب الشيء وضياعه؛ إِتْلَاف (مصدر أتلف) هو الفعل الحدثي للإضاعة لا الصفة المجردة للإتلافية. وجوده في مجموعة الخصائص المجردة (تحت جودة / نوعية) خلطٌ مقولي."

    - lemma: "تَدْمِيرِيَّة"
      expands:
        - text: "«الدَّالُ وَالْمِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الدُّخُولِ فِي الْبَيْتِ وَغَيْرِهِ... وَالدَّمَارُ: الْهَلَاكُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن جذر دمر يُفيد الدخول القسري ثم الاستئصال والهلاك. «الدمار: الهلاك» يُعزز مشروعية اشتقاق تَدْمِيرِيَّة كمصدر صناعي دال على الخاصية المجردة لإحداث الهلاك"
        - text: "«(1) تدمير؛ تخريب (2) دمار؛ خراب»"
          source: "المورد الحديث (2008) — ترجمة devastation"
          addition: "يؤكد أن تدمير والدمار وحدة دلالية متكاملة في العربية المعاصرة، مما يُسند الاشتقاق منهما"

    - lemma: "هَدَّامِيَّة"
      expands:
        - text: "«هدّام» (translation_en: destructive)"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) وعلوم الزلازل (1999)"
          addition: "هدّام موثَّق كصفة بمعنى destructive في مجالَي الجيولوجيا وعلوم الزلازل؛ يُثبت صحة الوزن الصرفي، لكن هدّامية بوصفها مصدراً صناعياً مستقلاً غير مُوثَّقة"
        - text: "«الْهَاءُ وَالدَّالُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى حَطِّ بِنَاءٍ، ثُمَّ يُقَاسُ عَلَيْهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ه-د-م متخصص أصالةً في هدم الأبنية والحيطان، مما يضيّق دلالة هدّامية نحو التدمير المادي للمنشآت"

    - lemma: "تَخْرِيبِيَّة"
      confirm:
        - text: "«عُدْوَانٌ تَخْرِيبِيّ» (translation_en: destructive aggression)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَقْطيرٌ تَخْريبِيّ» (translation_en: destructive distillation)"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الْخَاءُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ يَدُلُّ عَلَى التَّثَلُّمِ وَالتَّثَقُّبِ... وَمِنَ الْبَابِ، وَهُوَ الْأَصْلُ، الْخَرَابُ: ضِدُّ الْعِمَارَةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر خ-ر-ب يدلّ على التثلم والتخريب؛ الخراب ضد العمارة. يُسند اشتقاق تَخْرِيبِيَّة كصفة مجردة للتدمير الإرادي"

    - lemma: "إِفْنَائِيَّة"
      evidence_status: "no_material_found"

    - lemma: "وَبَال"
      confirm:
        - text: "«الفساد الشِّدَّة الثِّقَلُ سوءُ العاقبة»"
          source: "المعجم الوسيط"
        - text: "«(الوبال) الْفساد والشدة والثقل وَسُوء الْعَاقِبَة وَفِي التَّنْزِيل الْعَزِيز {فذاقت وبال أمرهَا}»"
          source: "المعجم الوسيط (hawramani)"
        - text: "﴿فَذَاقَتْ وَبَالَ أَمْرِهَا﴾"
          source: "القرآن الكريم (سورة الطلاق)"
      contradicts:
        - text: "«الوَبَالُ: هُوَ البرج الْمُقَابل لبيت الْكَوْكَب»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "اشتراك لفظي مع مصطلح فلكي (البرج المقابل لبيت الكوكب) يُفضي إلى التباس في السياق العلمي"
        - text: "«وَبَال: الفساد، والشدة، والثقل»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "وبال يدلّ على العاقبة الوخيمة والمصيبة اللاحقة (الأثر والنتيجة)، لا على الخاصية الذاتية للتدمير (السبب والطبيعة). فرق جوهري: «صفة التسبب» تطلب وصفاً للفاعل لا للنتيجة"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إِتْلَاف"
      decision: removed
      decision_reason: "إتلاف مصدرٌ حدثي (verbal noun / مصدر أتلف) يدلّ على فعل الإضاعة والإفساد، أي «التدمير» بوصفه حدثاً لا خاصيةً. المجموعة تندرج ضمن تدرج الصفات الجوهرية (جودة / نوعية)، ومصدرها الفوق «صفة جوهريّة ومميِّزة لشيء أو شخص» — وهو ما لا ينطبق على مصدر حدثي. الفرق بين «الإتلاف» و«التدميرية»: الأول يصف الفعل (act of destroying)، والثانية تصف الخاصية (quality of being destructive). كذلك لا يوجد مدخل كلاسيكي لإتلاف منفرداً، وورد في ARABTERM بمعنى تقني ضيق (حذف البيانات) يبعده عن المفهوم الفلسفي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَدْمِيرِيَّة"
      decision: confirmed
      decision_reason: "مصدر صناعي مشتق من «تدمير» (مصدر دَمَّرَ) بإضافة ياء النسب وتاء التأنيث، وهو نمط اشتقاقي منتج في العربية المعاصرة لتوليد الخصائص المجردة. جذر «دمر» موثَّق في مقاييس اللغة بمعنى الدخول القسري والاستئصال (الدمار: الهلاك)، وورد في القرآن الكريم {دَمَّرَ اللَّهُ عَلَيْهِمْ}. تَدْمِيرِيَّة تصفُ الخاصية الكامنة في الشيء أو الكائن نحو إحداث الهلاك والفناء، وهو بالضبط ما تعرفه المجموعة. التشكيل موثَّق صحيحاً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تَدْمِيرِيَّة تدلّ على الهلاك الشامل والاستئصال الكلي المرتبط بجذر دمر — عامة تستوعب التدمير المادي والمعنوي دون اشتراط القصد أو الإرادة؛ بخلاف تَخْرِيبِيَّة التي تضمّن دلالة الإفساد الإرادي المتعمد"

    - lemma: "هَدَّامِيَّة"
      source: stage1
      decision: removed
      decision_reason: "هدّامية غير موثَّقة في أي معجم كمصطلح مستقل. رغم صحة الاشتقاق القياسي من هدّام + ية، فإن جذر هدم يتخصص أصالةً في هدم الأبنية والحيطان (حطّ بناء — مقاييس)، مما يضيّق الدلالة نحو التدمير المادي للمنشآت دون استيعاب مفهوم «التدميرية» العام. تَدْمِيرِيَّة أوسع دلالةً وأكثر شيوعاً في الاستعمال المعاصر."

    - lemma: "تَخْرِيبِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي مشتق من «تخريب» (مصدر خَرَّبَ من جذر خ-ر-ب) بإضافة ياء النسب وتاء التأنيث. الصفة تخريبي موثَّقة في المعجم الطبي الموحد بمعنى destructive (عدوان تخريبي، تقطير تخريبي). جذر خ-ر-ب موثَّق في مقاييس اللغة والخراب ضد العمارة. تَخْرِيبِيَّة تضيف نوانساً دلالية قيّمة (الإفساد الإرادي) تُكمل تَدْمِيرِيَّة في تغطية الطيف الدلالي لـ destructiveness."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تَخْرِيبِيَّة تتضمن دلالة الإفساد الإرادي والمتعمد للبنى والمنشآت والعلاقات (intentional/deliberate destructiveness)، بخلاف تَدْمِيرِيَّة التي تدلّ على الخاصية العامة دون اشتراط القصد"
      actions:
        - command: create_entry
          params:
            lemma: "تَخْرِيبِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إِفْنَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: "إفنائية مشتق من «إفناء» الذي يعني الاستئصال التام والإعدام الكلي — وهو أقوى دلالةً من «التدمير» الذي قد لا يبلغ حد الفناء الكلي. كذلك لا أدلة معجمية تدعم هذا المصطلح، ومفهومه أضيق وأشدّ مما تقتضيه المجموعة."

    - lemma: "وَبَال"
      source: stage1
      decision: removed
      decision_reason: "وبال موثَّق بمعنى «الفساد والشدة والثقل وسوء العاقبة» — يدلّ على الأثر والعاقبة الوخيمة اللاحقة (consequence) لا على الخاصية الذاتية للتدمير الكامنة في الفاعل (property/quality). الفرق مقولي جوهري. يُضاف إلى ذلك اشتراك لفظي مع المصطلح الفلكي."


