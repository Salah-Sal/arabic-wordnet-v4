# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "إِتْلَاف مصدرٌ حدثي (verbal noun) يدلّ على فعل الإضاعة والإفساد لا على الخاصية المجردة للتدمير؛ وجوده في مجموعة «الصفات» يُشكّل خلطاً بين المصدر الحدثي والمصدر الصناعي الوصفي"
      - "تَدْمِيرِيَّة مصدر صناعي حديث غير مُوثَّق في المعاجم الكلاسيكية، وإن كان مشتقاً اشتقاقاً صحيحاً من جذر دمر الموثَّق"
      - "التعريف الحالي «صفة التسبب في الدمار» مُقتضَب وغير مُصاغ بأسلوب المعجمية العربية: لا جنس قريب صريح ولا فصل نوعي كافٍ"
    observations: "المجموعة تدلّ على مفهوم «التدميرية» بوصفها خاصية مجردة (abstract quality)، لا على فعل التدمير أو نتيجته المادية. الفرق الجوهري بين «الإتلاف» (المصدر الحدثي الدال على الفعل) و«التدميرية» (المصدر الصناعي الدال على الخاصية) يعكس تمييزاً دلالياً أساسياً في تراتب المجموعات. العربية الكلاسيكية لا تعرف مصطلحاً موحداً لهذا المفهوم الفلسفي المجرد، مما يُنبئ بوجود فجوة معجمية جزئية تُغطَّى بمصادر صناعية حديثة."
  blind_candidates:
    - lemma: "هَدَّامِيَّة"
      generation_method: ishtiqaq
      justification: "من «هدّام» (وزن فعّال من ه-د-م، للمبالغة في الهدم) + ياء النسب + تاء التأنيث → مصدر صناعي يدلّ على صفة الهدم الشامل والتدمير الكلي للبنى"
    - lemma: "تَخْرِيبِيَّة"
      generation_method: ishtiqaq
      justification: "من «تخريب» (مصدر خَرَّبَ من خ-ر-ب) + ياء النسب + تاء التأنيث → مصدر صناعي يدلّ على صفة التخريب والإفساد المتعمد"
    - lemma: "إِفْنَائِيَّة"
      generation_method: ishtiqaq
      justification: "من «إفناء» (مصدر أفنى من ف-ن-ي) + ياء النسب + تاء التأنيث → مصدر صناعي يدلّ على صفة الإفناء والاستئصال الكلي بوصفها أقصى درجات التدمير"
    - lemma: "وَبَال"
      generation_method: majaz
      justification: "لفظ قديم يعني الفساد والشدة وسوء العاقبة؛ إزاحة دلالية نحو الخاصية الإتلافية بمعنى الثقل الوخيم المُتأصِّل في الشيء المُهلِك — إحياء لفظ ميت لتجنب الاشتراك اللفظي مع المصادر الحدثية"


