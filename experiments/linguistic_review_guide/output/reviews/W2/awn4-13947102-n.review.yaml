      evidence_status: "no_material_found"

    - lemma: "مَشْرُوطِيَّة"
      evidence_status: "no_material_found"

    - lemma: "قَيْدِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "شرطية"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في خمسة مصادر معجمية كلاسيكية وحديثة بوصفها المصطلح
        العربي المعتمد لمفهوم «conditional». صحيح أن المصادر الكلاسيكية ركّزت
        على المعنى المنطقي (القضية الشرطية)، لكنّ الشَّرْطِيَّة بوصفها مصدراً
        صناعياً (فَعْلِيَّة) تُولَّد تلقائياً من الصفة شَرْطِيّ لتدلّ على
        الخاصيّة المجرَّدة، وهو توليد منتج ومطّرد في العربية. كما وردت في
        المعاجم التقنية الحديثة. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة المؤكدة في المجموعة؛ تُبرز البُعد المنطقي-الفلسفي لكون الشيء مُتعلِّقاً بشرط، وهي موروث اصطلاحي راسخ في المعجمية العربية من المنطق والنحو إلى القانون والحوسبة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَرْطِيَّة"

    - lemma: "تقييد بشرط"
      decision: removed
      decision_reason: >
        عبارة وصفية حرّة لا تجتاز اختبار السكّ المعجمي؛ فإبدال «تقييد» بـ«تعليق»
        أو «اشتراط» أو «تحديد» يُبقي العبارة مقبولة وصفاً، مما يدلّ على غياب
        التثبيت المعجمي. كذلك تعبّر عن مفهوم «conditional restriction» أكثر من
        مفهوم «conditionality» المجرّد. لا شاهد معجمي يُثبّتها كمصطلح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اشْتِرَاطِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي في قواعد البيانات المتاحة. وإن كانت الاشتقاقية
        سليمة، إلا أن «شرطية» المرسّخة تُغني عنها؛ إذ لا توجد فجوة دلالية تستدعي
        إضافتها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مَشْرُوطِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم سلامة اشتقاقها وورودها في السياق السياسي-التاريخي (مشروطية = النظام
        الدستوري المشروط عند العثمانيين والإيرانيين)، فهذا الحمل الدلالي التاريخي
        يُلوِّث المفهوم المجرّد المطلوب. لم يُعثر على توثيق لها بمعنى
        «conditionality» المجرّد في قواعد البيانات.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "قَيْدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        غير موثّقة معجمياً. رغم أصالة المجاز من (قيد) إلا أن «قيدية» كمصطلح لم
        يُثبَت في المعجمية العربية، ولا توجد ضرورة لتبنّيه في ظل وجود «شرطية»
        المرسّخة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


