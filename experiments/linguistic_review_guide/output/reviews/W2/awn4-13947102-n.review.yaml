# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «تقييد بشرط» عبارة وصفية حرّة لا تجتاز اختبار السكّ المعجمي؛ إذ يمكن إبدال «تقييد» بـ«تعليق» أو «تحديد» وتبقى العبارة صالحة وصفاً، مما يكشف غياب التثبيت المعجمي"
      - "لمّة «شرطية» خالية من التشكيل في قائمة اللمّات"
      - "التعريف الحالي «حالة كونه مشروطاً» دوراني جزئياً؛ إذ يعود إلى جذر (شرط) ذاته دون تقديم جنس قريب أو فصل نوعي مستقل"
    observations: >
      المجموعة تعبّر عن مفهوم الشَّرْطِيَّة المجرَّدة، وهي خاصيّة دلاليّة ومنطقية
      راسخة في الموروث الفلسفي والنحوي العربي. الجذر (ش ر ط) يدلّ في أصله على
      العلامة والأثر، وانزاحت منه «الشَّرْطِيَّة» للدلالة على توقّف الشيء على
      شيء آخر. اللمّة «شرطية» موثّقة في معاجم الاصطلاح الكلاسيكية والحديثة على
      حدٍّ سواء. في المقابل، «تقييد بشرط» تعبير وصفي لا مصطلحي، ويعكس مفهوم
      conditional restriction أكثر من مفهوم conditionality المجرّد.
  blind_candidates:
    - lemma: "شَرْطِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ش ر ط) بإلحاق ياء النسبة وتاء التأنيث على وزن (فَعْلِيَّة)،
        وهو الوزن المنتج في العربية لاشتقاق أسماء الخصائص والحالات المجرّدة
        (حُرِّيَّة، عَقْلانِيَّة، إنسانيَّة). تُعبِّر مباشرةً عن «كون الشيء
        شرطياً»، وتوازي مصطلح conditionality الإنجليزي بنية ومعنىً.
    - lemma: "اشْتِرَاطِيَّة"
      generation_method: ishtiqaq
      justification: >
        من المصدر (اشتراط) على وزن (افتعال) + ياء النسبة + تاء التأنيث، مما
        يُبرز بُعد الإلزام والاقتضاء؛ فهي أكثر تصريحاً من «شرطية» بمعنى فرض
        الشروط أو إلزاميتها، وتناسب المقام الحقوقي والسياسي خاصةً.
    - lemma: "مَشْرُوطِيَّة"
      generation_method: ishtiqaq
      justification: >
        من اسم المفعول (مشروط) + ياء النسبة + تاء التأنيث، على غرار
        (مَعْقُولِيَّة، مَشْرُوعِيَّة). تُعبِّر حرفياً عن «خاصيّة المشروط» أي
        «حالة كون الشيء مشروطاً»، وتطابق المفهوم الوارد في التعريف مطابقةً مباشرة.
    - lemma: "قَيْدِيَّة"
      generation_method: majaz
      justification: >
        إحياء دلالي من (قيد) بمعنى الحبس والتقييد؛ فابن فارس يذكر أن القيد
        «يُستعار في كل شيء يُحبَس». بإلحاق ياء النسبة والتأنيث تدلّ على حالة
        كون الشيء مقيَّداً بشرط، وهو توصيف دقيق للاشتراط من منظور الاحتباس
        الدلالي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "شرطية"
      confirm:
        - text: "«الشّرطية:[في الانكليزية] Conditional [في الفرنسية] Conditionnel — عند النحاة هي الجملة المصدّرة بأداة الشرط … وعند المنطقيين هي القضية المركّبة من قضيتين إحداهما محكوم عليها والأخرى محكوم بها»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
        - text: "«الشرطية: ما تتركب من قضيتين، وقيل: الشرطية، هو الذي يتوقف عليه الشيء ولم يدخل في ماهية الشيء ولم يؤثر فيه»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413م)"
        - text: "«الشَّرْطِيَّة: مَا لَا تحل بطرفيها إلى مفردين»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
        - text: "«الشّرطِيَّة: في القضية إن شاء الله تعالى»"
          source: "دستور العلماء للأحمدنكري (ق18م)"
        - text: "«شرطي — conditional» (مجال الرياضيات والفلك)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      expands:
        - text: "«الشّرطي:[في الانكليزية] Conditional، hypothetical — قسم من القياس الاقتراني ويجيء في لفظ القياس»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
          addition: "يكشف أن «الشرطي» كصفة مضادة لـ«المطلق/المرسل» مستعمل في المنطق العربي الكلاسيكي، مما يدعم اشتقاق الشَّرْطِيَّة كمصدر صناعي لهذا المفهوم"

    - lemma: "تقييد بشرط"
