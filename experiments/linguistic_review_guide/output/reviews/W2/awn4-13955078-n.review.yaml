      - "يوتوبيا تعريبٌ، والمصادر الحديثة تتفاوت في إملائه بين يوتوبيا ويوطوبيا"
      - "التعريف الحالي مترجَمٌ حرفياً من الإنجليزية ولا يُبيّن الطابع التخيُّليَّ للمفهوم"
      - "لا يُشير السجل إلى عمق الجذر الفلسفي الإسلامي للمفهوم (الفارابي)"
    observations: >
      المجموعة تتناول مفهوم "اليوتوبيا"، وهو مفهوم له امتدادٌ عميق في التراث الفلسفي العربي
      من خلال مصطلح "المدينة الفاضلة" الذي صكّه الفارابي (ت. 339هـ)، قبل أن يبتكر توماس مور
      مصطلحه اللاتيني عام 1516م. ولذلك يجمع المفهوم في العربية بين بُعدَيْن: الأول فلسفيٌّ
      كلاسيكي (المدينة الفاضلة)، والثاني مُعاصرٌ غربيٌّ (يوتوبيا/طوباوية). اللمّة الأولى مُركَّبٌ
      وصفيٌّ ثابتٌ، والثانية تعريبٌ، وكلتاهما موثَّقتان في المعاجم المعاصرة. يُلاحَظ غياب
      المصطلح الاشتقاقي "طوباوية" المُقنَّن في مسارد المنظمة العربية للتربية والثقافة والعلوم.

