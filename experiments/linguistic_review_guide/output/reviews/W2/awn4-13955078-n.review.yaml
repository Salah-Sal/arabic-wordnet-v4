      generation_method: ishtiqaq
      justification: >
        مصدرٌ صناعيٌّ من "طُوبَى" القرآنية (فُعلى من الطيب) على وزن المصدر الصناعي (-يَّة)،
        يُحوِّل المفهوم إلى اسم مجرد يدلّ على النزعة أو الحالة المثالية الطيبة، وهو أسلوبٌ
        عربيٌّ منتِجٌ في التأليف المصطلحي الفلسفي.
    - lemma: "الْمَدِينَةُ الْمُثْلَى"
      generation_method: tarkib
      justification: >
        مُرَكَّبٌ وصفيٌّ (مدينة + المُثلى؛ أُنثى الأمثل) يُعبِّر عن بلوغ النظام الاجتماعي
        درجته القصوى من الكمال؛ يُشابه في بنيته مصطلح "المدينة الفاضلة" الموروث، غير أن
        "المُثلى" أكثرُ صراحةً في الدلالة على الإطلاق والكمال التام.
    - lemma: "الْجَنَّةُ الْأَرْضِيَّةُ"
      generation_method: majaz
      justification: >
        إزاحةٌ دلالية من "الجنة" (الفردوس السماوي) إلى مفهوم الحال الاجتماعية البالغة الكمال
        على الأرض؛ يُعبِّر عن المفهوم بمجاز وجدانيٍّ مألوف، يربط الحالة المثالية بصورة الجنة
        في الوجدان العربي الإسلامي.
    - lemma: "أُوطُوبِيَا"
      generation_method: taarib
      justification: >
        تعريبٌ مباشرٌ للفظ utopia الإنجليزي (أصله اليوناني ou-topos = المكان الذي لا وجود له)،
        يُفيد في السياقات الأكاديمية الحديثة التي تتداول المصطلح الغربي بصيغته الأصلية؛
        ويختلف عن "يوتوبيا" في إضافة واو بعد الهمزة للتقريب الصوتي.


