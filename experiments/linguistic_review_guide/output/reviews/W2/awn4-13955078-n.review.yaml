# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    - lemma: "مَدِينَةٌ فَاضِلَةٌ"
      entry_id: "{auto}"
      roots:
        - word: "مَدِينَة"
          root: "مدن"
          maqayis_quote: >
            «الْمِيمُ وَالدَّالُ وَالنُّونُ لَيْسَ فِيهِ إِلَّانَةٌ، إِنْ كَانَتْ
            عَلَى فَعِيلَةٍ، وَيَجْمَعُونَهَا مُدُنًا. وَمَدَّنْتُ مَدِينَةً»
        - word: "فَاضِلَة"
          root: "فضل"
          maqayis_quote: >
            «الْفَاءُ وَالضَّادُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى زِيَادَةٍ
            فِي شَيْءٍ. مِنْ ذَلِكَ الْفَضْلُ: الزِّيَادَةُ وَالْخَيْرُ.
            وَالْإِفْضَالُ: الْإِحْسَانُ»

    - lemma: "يُوتُوبِيَا"
      entry_id: "{auto}"
      # لا جذر عربي — لفظ أجنبي مُعرَّب أصله يوناني: ou-topos

    - lemma: "طُوبَاوِيَّة"
      entry_id: "{auto}"
      root: "طيب"
      maqayis_quote: >
        «الطَّاءُ وَالْيَاءُ وَالْبَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ
        الْخَبِيثِ. مِنْ ذَلِكَ الطَّيِّبُ: ضِدُّ الْخَبِيثِ»
      # تنبيه: طُوبَى هي فُعلى من الطِّيب، كما نصَّ ابن فارس في مادة طوب:
      # «أَصْلُهُ الْيَاءُ، كَأَنَّهَا فُعْلَى مِنَ الطِّيبِ، فَقُلِبَتِ الْيَاءُ وَاوًا لِلضَّمَّةِ»

  per_sense:
    - lemma: "مَدِينَةٌ فَاضِلَةٌ"
      sense_id: "{auto}"
      nuance: >
        يحيل إلى الموروث الفلسفي العربي-الإسلامي (الفارابي/أفلاطون)، ويُبرز الطابعَ
        الفكريَّ والحضاريَّ للمجتمع المثالي؛ أكثرُ تجذُّراً وأعمقُ دلالةً تاريخياً،
        ويُستحضَر في السياقات الفلسفية والسياسية التراثية.
      mwe: true

    - lemma: "يُوتُوبِيَا"
      sense_id: "{auto}"
      nuance: >
        يُصرِّح بالأصل الغربي الحداثي (توماس مور) ويحمل ضمناً معنى اللاتحقق؛
        يُستعمل في السياقات الأكاديمية والإعلامية المعاصرة حين تُراد الإحالة
        المباشرة إلى المصطلح الأوروبي والنقاش الدائر حوله في الفكر السياسي الغربي.
      mwe: false

    - lemma: "طُوبَاوِيَّة"
      sense_id: "{auto}"
      nuance: >
        يُبرز البُعد المذهبي والنقدي (utopia كنزعة فكرية أو مدرسة لا مجرد وصف)؛
        الأنسبُ في السياقات الفلسفية والأدبية (الاشتراكية الطوباوية، أدب اليوتوبيا)،
        ويربط المفهوم الغربي بجذوره اللغوية العربية عبر "طُوبَى" القرآنية.
      mwe: false

  synset:
