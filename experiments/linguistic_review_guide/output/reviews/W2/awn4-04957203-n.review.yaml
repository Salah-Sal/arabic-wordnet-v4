stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان (بصريات، خواص بصرية) مكتوبتان بدون تشكيل كامل"
      - "التعريف الحالي 'الخواص البصرية' يقع في دوران لغوي — يعيد صياغة اللمّة 'خواص بصرية' ذاتها دون إضافة جنس قريب أو فصل نوعي"
      - "لمّة 'بصريات' مشتركة بين دلالتين: علم البصريات (فرع علمي) والخصائص البصرية (مجموعة صفات)، والمجموعة تخص الدلالة الثانية فقط — يحتاج هذا التوضيح في البيانات الوصفية"
    observations: "المجموعة الترادفية تمثّل مفهوم 'الخصائص البصرية' أي جملة الصفات التي تعبّر عن سلوك المادة إزاء الضوء، كالشفافية والانعكاسية والانكسارية ومعامل الانكسار. الجذر المركزي في التسمية العربية هو ب-ص-ر في بصريات وبصرية، أو ض-و-ء في ضوئية، أو خ-و-ص/خ-ص-ص في خواص/خصائص. ثمة فضاء اصطلاحي واسع في المعاجم التقنية العربية لهذا المفهوم، إذ تتوازى تسميتان رئيسيتان: ما يُنسَب إلى البصر وما يُنسَب إلى الضوء مباشرةً."
  blind_candidates:
    - lemma: "بَصَرِيَّات"
      generation_method: ishtiqaq
      justification: "اشتقاق من جذر ب-ص-ر على جمع المصدر الصناعي (بَصَرِيَّة + ات)، يدل على مجموعة الخصائص والظواهر المتعلقة بالبصر والضوء. الوزن منتج في اصطلاح العلوم التطبيقية (كيمياء → كيميائيات، ميكانيك → ميكانيكيات)."
    - lemma: "خَوَاصٌّ ضَوْئِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من خَوَاصّ (جمع خاصة، من خ-و-ص) + ضَوْئِيَّة (نسبة إلى الضوء، من ض-و-ء). يُفضَّل هذا التركيب في الأدبيات الفيزيائية لأنه يُصرِّح بالضوء كظاهرة فيزيائية مستقلة بدلاً من الإحالة إلى حاسة البصر."
    - lemma: "نُورِيَّات"
      generation_method: majaz
      justification: "إحياء لجذر ن-و-ر على وزن الجمع المصدري الصناعي (نُورِيَّة + ات). المجاز الدلالي: الانتقال من 'ما يتعلق بالنور' إلى 'الخصائص المتعلقة بتفاعل الأجسام مع النور'. في مقاييس اللغة: 'النون والواو والراء أصل صحيح يدل على إضاءة واضطراب وقلة ثبات'."
    - lemma: "خَصَائِصُ بَصَرِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من خَصَائِص (جمع خاصية/خصيصة، من خ-ص-ص) + بَصَرِيَّة. خصائص أوسع دلالةً من خواص وأشيع في لغة التوصيف العلمي غير المتخصص؛ تلائم الكتابة الموسوعية والتقارير العلمية."


