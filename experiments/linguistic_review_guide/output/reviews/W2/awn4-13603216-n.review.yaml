    - lemma: "عَدَد"
      entry_id: "{auto}"
      root: "عدد"
      maqayis_quote: "«الْعَيْنُ وَالدَّالُ أَصْلٌ صَحِيحٌ وَاحِدٌ لَا يَخْلُو مِنَ الْعَدِّ الَّذِي هُوَ الْإِحْصَاءُ. وَمِنَ الْإِعْدَادِ الَّذِي هُوَ تَهْيِئَةُ الشَّيْءِ... فَالْعَدُّ: إِحْصَاءُ الشَّيْءِ... وَالْعَدَدُ: مِقْدَارُ مَا يُعَدُّ»"

