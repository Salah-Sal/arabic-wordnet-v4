# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13603216-n (number)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «رَقَم» مضبوطة بفتحتَين وهو وزن الفعل الماضي (رَقَمَ)، بينما الاسم الصحيح هو رَقْم بسكون القاف"
      - "الرَّقْم في الاصطلاح الحسابي يعني الرمز الدالّ على أحد الأعداد البسيطة (0-9)، أي digit، وليس مفهوم العدد المجرد (number)"
      - "التعريف العربي ترجمة حرفية للإنجليزية وليس بأسلوب معجمي عربي أصيل"
    observations: "المجموعة تعبّر عن المفهوم الرياضي المجرد للعدد بوصفه كمّيّة تشمل الصفر والوحدات. اللمّة عَدَد هي التعبير العربي الأصيل والدقيق عن هذا المفهوم، فيما رَقْم يدلّ على الرمز الكتابي لا على المفهوم ذاته."
  blind_candidates:
    - lemma: "عَدَد"
      generation_method: ishtiqaq
      justification: "من الجذر ع-د-د على وزن فَعَل، يدلّ على مقدار ما يُعَدّ ومبلغه، وهو اللفظ العربي الأصيل للمفهوم الرياضي المجرد للكمّيّة المحصاة"
    - lemma: "رَقْم"
      generation_method: ishtiqaq
      justification: "من الجذر ر-ق-م على وزن فَعْل، يدلّ في الاصطلاح الحسابي على الرمز المستعمل للتعبير عن العدد البسيط، يُستعمل في العربية المعاصرة بمعنى العدد مجازاً"
    - lemma: "عِدّ"
      generation_method: ishtiqaq
      justification: "من الجذر ع-د-د على وزن فِعْل، ورد بمعنى مجتمع الماء والقديم، ومنه حَسَبٌ عِدّ، للتحقق من صلاحيته لمعنى العدد"
    - lemma: "حِسَاب"
      generation_method: ishtiqaq
      justification: "من الجذر ح-س-ب، يدلّ على العدّ والإحصاء، للتحقق من إمكان استعماله بمعنى العدد المجرد"

stage2_evidence:
  per_lemma:
    - lemma: "عَدَد"
      confirm:
        - text: "«مِقْدَار مَا يُعَدُّ ومَبْلَغُه»"
          source: "المعجم الوسيط"
        - text: "«العَدَد: كمية متألفة من الآحاد أو مختص بالتعدد في ذاته فلا يكون الواحد عدداً لأنه غير متعدد إذ التعدد الكثرة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«العَدَد: جمَاعَة مركبة من آحَاد: وَقيل: نصف مَجْمُوع الحاشيتين»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«العَدَد: هي الكمِّية المتألفةُ من الوَحْدات فلا يكون الواحدُ عدداً»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«العدد: بفتحتين عند جميع النحاة وبعض المحاسبين هو الكمية والألفاظ الدّالّة على الكمية بحسب الوضع تسمّى أسماء العدد... ثم المراد بما به يجاب عن السؤال بكم هو ما وضع لأن يجاب به فحسب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تفصيل واسع لمفهوم العدد عند النحاة والمحاسبين وتقسيماته إلى صحيح وكسر وزوج وفرد"

    - lemma: "رَقَم"
      contradicts:
        - text: "«(في علم الحساب): هو الرمز المستعمل للتعبير عن أحد الأعداد البسيطة (١، ٢، ٣، ٤، ٥، ٦، ٧، ٨، ٩ والصفر)»"
          source: "المعجم الوسيط"
          conflict: "الرَّقْم يعني الرمز الكتابي (digit) وليس مفهوم العدد المجرد (number)؛ المعجم يُعرّف الرقم بأنه رمز للتعبير عن العدد لا العدد نفسه"
        - text: "«الرمزُ المستعمَلُ للتعبير عن أحَد الأعدادِ البسيطةِ، وهى الأعدادُ التسعةُ الأُولَى والصِّفر»"
          source: "المعجم الكبير"
          conflict: "التأكيد على أن الرقم رمز يعبّر عن العدد وليس العدد ذاته"
        - text: "«أحدُ المحارف المستخدَمة للدلالة على عددٍ كامل (وَحْدة unit) في نظام العدّ»"
          source: "معجم مصطلحات المعلوماتية"
          conflict: "الرقم محرف (character) للدلالة على العدد لا العدد نفسه"
      expands:
        - text: "«الرَّقْمُ: الخَطُّ. والرَّقِيمُ: الكِتابُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يدلّ على الخط والكتابة والنقش لا على مفهوم الكمّيّة"
        - text: "«الرَّقْمُ: الكتابة والخَتْم»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          addition: "تأكيد المعنى الأصلي: الكتابة والختم"

    - lemma: "عِدّ"
      contradicts:
        - text: "«العِدُّ: مُجْتَمَعُ الْمَاءِ، وَجَمْعُهُ أَعْدَادٌ... الْعِدُّ: الْقَدِيمَةُ مِنَ الرَّكَايَا الْغَزِيرَةِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "العِدّ في الأصل مجتمع الماء والركايا القديمة لا العدد الحسابي"

    - lemma: "حِسَاب"
      contradicts:
        - text: "«الحساب: استعمال العدد»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الحساب هو استعمال العدد (العملية) وليس العدد ذاته (المفهوم)"
        - text: "«العَدُّ»"
          source: "المعجم الوسيط"
          conflict: "الحساب = العدّ (الفعل/المصدر) لا العدد (الاسم/المفهوم)"

    - lemma: "رَقْم"
      contradicts:
        - text: "«رمز يستعمل في نظام ترقيم ما»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          conflict: "الرقم رمز في نظام ترقيم أي digit لا number"

stage3_analysis:
  per_lemma:
    - lemma: "عَدَد"
      decision: confirmed
      decision_reason: "تواترت الأدلة المعجمية على أن العَدَد هو «مقدار ما يُعَدّ ومبلغه» و«كمّيّة متألّفة من الآحاد»، وهو المقابل العربي الدقيق للمفهوم الرياضي number بوصفه مفهوماً مجرداً للكمّيّة يشمل الصفر والوحدات"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions: []

    - lemma: "رَقَم"
      decision: removed
      decision_reason: "أولاً: التشكيل خاطئ — الصيغة الصحيحة هي رَقْم (بسكون القاف) لا رَقَم (بفتحتين وهي صيغة الفعل الماضي). ثانياً: حتى مع تصحيح التشكيل، فإن الرَّقْم في الاصطلاح الحسابي يعني الرمز المستعمل للتعبير عن أحد الأعداد البسيطة (0-9) أي digit، وليس مفهوم العدد المجرد number. المعاجم جميعها تميّز بين العدد (المفهوم) والرقم (الرمز). هذه اللمّة أنسب لمجموعة ترادفية تعبّر عن مفهوم digit"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عِدّ"
      source: stage1
      decision: removed
      decision_reason: "العِدّ في المعاجم يعني مجتمع الماء والركايا القديمة، ومنه قولهم حَسَبٌ عِدّ أي قديم. لا يدلّ على المفهوم الرياضي للعدد"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "حِسَاب"
      source: stage1
      decision: removed
      decision_reason: "الحساب هو استعمال العدد والعملية الحسابية (calculation/arithmetic)، وليس العدد ذاته. الفرق بينهما كالفرق بين العدّ والمعدود"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "رَقْم"
      source: stage1
      decision: removed
      decision_reason: "الرَّقْم هو الرمز الكتابي الدالّ على العدد البسيط (digit) وليس مفهوم العدد المجرد (number). ينتمي إلى مجموعة ترادفية أخرى تعبّر عن مفهوم الرقم/الخانة"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "مفهوم للكمية يتضمن الصفر والوحدات"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية ولا يتّسق مع أسلوب التعريف المعجمي العربي. يحتاج إلى إعادة صياغة بأسلوب الجنس القريب والفصل النوعي مستفيداً من التعريفات المعجمية العربية الأصيلة"
    authored:
      - type: terminological
        text: "كَمِّيَّةٌ مُتَأَلِّفَةٌ مِنَ الْوَحَدَاتِ أَوْ أَجْزَائِهَا، تَشْمَلُ الصِّفْرَ وَالْأَعْدَادَ الصَّحِيحَةَ وَالْكُسُورَ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مِقْدَارُ مَا يُعَدُّ وَمَبْلَغُهُ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "كَمِّيَّةٌ مُتَأَلِّفَةٌ مِنَ الْوَحَدَاتِ أَوْ أَجْزَائِهَا، تَشْمَلُ الصِّفْرَ وَالْأَعْدَادَ الصَّحِيحَةَ وَالْكُسُورَ"

  examples:
    per_lemma:
      - lemma: "عَدَد"
        examples:
          - text: "يُصنَّفُ الصِّفرُ ضِمنَ الأعدادِ الصحيحةِ، وهو العَدَدُ الوحيدُ الذي لا يكونُ موجبًا ولا سالبًا."
            type: usage
          - text: "العَدَدُ أساسُ علمِ الحسابِ، وبه تُقاسُ الكمِّيَّاتُ وتُضبَطُ المقاديرُ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُصنَّفُ الصِّفرُ ضِمنَ الأعدادِ الصحيحةِ، وهو العَدَدُ الوحيدُ الذي لا يكونُ موجبًا ولا سالبًا."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "العَدَدُ أساسُ علمِ الحسابِ، وبه تُقاسُ الكمِّيَّاتُ وتُضبَطُ المقاديرُ."

stage5_enrichment:
