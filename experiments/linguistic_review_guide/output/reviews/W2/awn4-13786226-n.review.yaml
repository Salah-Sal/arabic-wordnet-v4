# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13786226-n (ullage)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يذكر «زجاجة النبيذ» وهو مثال غير ملائم ثقافياً للمعجم العربي"
      - "اللمّتان الحاليتان (فراغ، نقص) عامّتان جداً ولا تحملان دلالة تخصيصية على المقدار الناقص في الوعاء"
      - "اللمّتان بدون تشكيل"
    observations: "المفهوم المستهدف هو المقدار الذي ينقص الوعاء ليكون ممتلئاً، وهو مفهوم تقني يُستخدم في صناعة التعبئة والتخزين. في العربية الكلاسيكية لا يوجد مصطلح مخصّص لهذا المعنى بالذات، لكن «النُّقْصَان» في المعجم الوسيط يُعرَّف بأنه «المقدار الذاهب من المنقوص» وهو الأقرب دلالياً. أما «الفراغ» فيدلّ على الخلوّ عامةً لا على مقدار محدد."

  blind_candidates:
    - lemma: "نُقْصَان"
      generation_method: ishtiqaq
      justification: "من جذر ن ق ص على وزن فُعْلان للدلالة على المقدار والحالة، وهو في المعجم الوسيط «المقدار الذاهب من المنقوص» وهو أدقّ من «نقص» في الدلالة على الكمّ"
    - lemma: "خَوَاء"
      generation_method: majaz
      justification: "أصلها خلوّ الجوف من الطعام والفراغ بين الشيئين، فيمكن نقلها مجازاً إلى الحيّز الفارغ في الوعاء"
    - lemma: "خَصَاص"
      generation_method: majaz
      justification: "أصلها كلّ خَلَل وخَرق في الشيء والفُرَج بين الأشياء، فيمكن نقلها إلى مقدار الخلل في امتلاء الوعاء"
    - lemma: "عَجْز"
      generation_method: ishtiqaq
      justification: "من جذر ع ج ز بمعنى القصور عن بلوغ التمام، يُستخدم في المصطلحات الحديثة بمعنى deficit وهو المعادل المفهومي"

# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "فَرَاغ"
      confirm:
        - text: "«(الفَرَاغ) الخُلُوّ والمَكَان الخَالِي»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(الفِرَاغ) من الدلو: ناحيتها التى يُصَبّ منها الماء. حوض من أدم واسع ضخم. من القسيّ: التى بغير وتر أو سهم. من الآنية: الضخم لا يطاق حمله»"
          source: "المعجم الوسيط"
          addition: "معنى الفِراغ (بالكسر) يتعلق بالأواني والدلاء، لكن بدلالة مختلفة عن المقدار الناقص"
        - text: "«الفاء والراء والغين أصل صحيح يدلّ على خلوٍّ وسعة ذرع. من ذلك الفراغ: خلاف الشغل»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدلّ على الخلوّ لا على مقدار النقص"

    - lemma: "نَقْص"
      confirm:
        - text: "«النَّقْص [في زُجاجة شِبه ممتلئة].»"
          source: "المورد الحديث (2008)"
        - text: "«(النَّقْص) الضعف. يقال أصابه نقص في عقله أو دينه»"
          source: "المعجم الوسيط"
      expands:
        - text: "«النُّونُ وَالْقَافُ وَالصَّادُ كَلِمَةٌ وَاحِدَةٌ، هِيَ النَّقْصُ: خِلَافُ الزِّيَادَةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر أحادي الدلالة: خلاف الزيادة عموماً"
        - text: "«النَّقْصُ: الخُسْرَانُ في الحَظّ، كالتَّنْقاصِ والنُّقْصَان. والنُّقْصَانُ أيضاً: اسمٌ للقَدْرِ الذَّاهِبِ من المَنْقُوصِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يفرّق بين النقص (الحدث) والنقصان (المقدار الذاهب)"

    - lemma: "نُقْصَان"
      confirm:
        - text: "«(النُّقْصَان) المقدار الذاهب من المنقوص»"
          source: "المعجم الوسيط"
        - text: "«والنُّقْصَانُ أيضاً: اسمٌ للقَدْرِ الذَّاهِبِ من المَنْقُوصِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«النقصان يكون مصدراً ويكون قدر الشيء الذاهب من المنقوص، اسم له»"
          source: "كتاب العين للخليل بن أحمد"

    - lemma: "خَوَاء"
      confirm:
        - text: "«(الخواء) من الأرض بَراحها والفراغ بين الأرض والسماء والفراغ بين الشيئين»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الخواء: خلو الشيء عما شأنه أن يعيه حسّاً أو معنى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الخواء يدلّ على حالة الخلوّ المطلق لا على مقدار محدد ناقص من الامتلاء"

    - lemma: "خَصَاص"
      confirm:
        - text: "«كُلُّ خَلَلٍ وخَرْقٍ في بابٍ ومُنْخُلٍ وبُرْقُعٍ ونحوه. الفُرَجُ بين الأشياء كالفُرَج التي بين الأثافي والتي بين الأصابع»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«شِبهُ كُوَّةٍ في قُبّة أو نحوها إذا كان واسعاً قَدْرَ الوجه. الجُحرُ الصغير. الفقرُ وسوءُ الحال والخَلّة والحاجة»"
          source: "المعجم الكبير"
          conflict: "الخصاص يدلّ على الفُرَج والثقوب المادية أو الفقر، لا على مقدار كمّي ناقص من سائل"

    - lemma: "عَجْز"
      expands:
        - text: "«عجز؛ نَقْص.»"
          source: "المورد الحديث (2008) — ترجمة shortage"
          addition: "عجز يُستخدم في السياق الاقتصادي والتجاري (deficit) لا في سياق الأوعية والسوائل"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "فَرَاغ"
      decision: confirmed
      decision_reason: "فَرَاغ يدلّ على الخلوّ والمكان الخالي، ويمكن استخدامه بمعنى الحيّز الفارغ في الوعاء. رغم عموميّته فإنه مقبول كمرادف تقريبي يركّز على جانب الخلوّ لا الكمّ"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على حالة الخلوّ والفضاء الفارغ في الوعاء (الجانب المكاني) بخلاف «نقص» الذي يركّز على المقدار الناقص (الجانب الكمّي)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَرَاغ"

    - lemma: "نَقْص"
      decision: confirmed
      decision_reason: "نَقْص مُثبَت مباشرةً في المورد الحديث بمعنى ullage تحديداً: «النَّقْص [في زجاجة شبه ممتلئة]». وهو الأدقّ بين لمّات المجموعة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المقدار الناقص ذاته (الكمّ) بخلاف «فراغ» الذي يدلّ على الحيّز الخالي (المكان)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَقْص"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نُقْصَان"
      source: stage1
      decision: removed
      decision_reason: "رغم أن تعريفه في المعجم الوسيط «المقدار الذاهب من المنقوص» قريب دلالياً، إلا أن نَقْص مُثبَت مباشرةً لمعنى ullage في المورد الحديث، ولا حاجة لإضافة مشتقّ آخر من الجذر نفسه يكاد يكون مرادفاً تامّاً"

    - lemma: "خَوَاء"
      source: stage1
      decision: removed
      decision_reason: "الخواء يدلّ على حالة الخلوّ المطلق وعلى الفراغ بين الشيئين، ولا يحمل دلالة كمّية على مقدار النقص في وعاء. لا يصلح مصطلحاً تقنياً لهذا المفهوم"

    - lemma: "خَصَاص"
      source: stage1
      decision: removed
      decision_reason: "الخصاص يدلّ على الفُرَج والثقوب المادية أو على الفقر والحاجة، وهو بعيد دلالياً عن مقدار نقص السائل في الوعاء"

    - lemma: "عَجْز"
      source: stage1
      decision: removed
      decision_reason: "عَجْز مصطلح اقتصادي حديث بمعنى deficit ولا يُستخدم في سياق الأوعية والسوائل. نقله إلى هذا المجال تعسّف لغوي"

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "المقدار الذي ينقص الوعاء (مثل زجاجة النبيذ أو الخزان) ليكون ممتلئاً"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية للإنجليزية، ويتضمّن مثالاً غير ملائم ثقافياً (زجاجة النبيذ). يحتاج إلى إعادة صياغة بأسلوب معجمي عربي"
    authored:
      - type: terminological
        text: "مِقدارُ ما يَنقُصُ الوِعاءَ عن الامتلاءِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "المِقدارُ الناقصُ من حجمِ الوعاءِ (كالخِزانِ أو القارورةِ) عن بلوغِ تمامِ الامتلاءِ، ويُستخدَم المصطلحُ في صناعاتِ التعبئةِ والتخزينِ لقياسِ كمّيّةِ الهواءِ أو الفراغِ في الحاوية"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مِقدارُ ما يَنقُصُ الوِعاءَ عن الامتلاءِ"

  examples:
    per_lemma:
      - lemma: "فَرَاغ"
        examples:
          - text: "يجب أن يُترَك فَرَاغٌ في أعلى الخِزان لتمدُّد السائل عند ارتفاع الحرارة."
            type: usage
      - lemma: "نَقْص"
        examples:
          - text: "بلغ النَّقْصُ في خزّانات الوقود نحوَ عشرةِ لِتْرات بعد عمليّة النقل."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يجب أن يُترَك فَرَاغٌ في أعلى الخِزان لتمدُّد السائل عند ارتفاع الحرارة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "بلغ النَّقْصُ في خزّانات الوقود نحوَ عشرةِ لِتْرات بعد عمليّة النقل."

