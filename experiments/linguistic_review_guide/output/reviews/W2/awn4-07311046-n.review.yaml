stage1_review:
  assessment:
    concerns:
      - اللمات الموجودة تفتقر إلى التشكيل الكامل.
      - غياب مصطلح "تحول" وهو الأكثر تعبيراً عن الانتقال بين الحالات والمراحل كما في التعريف.
    observations: "المجموعة تعبر عن المفهوم العام للتغير (Change). اللمات الموجودة تغطي الجوانب الإجرائية (تغيير) والذاتية (تغير) والتقنية (تعديل). من الضروري إضافة 'تحول' و'تبدل' لاكتمال الشبكة الدلالية لهذا المفهوم المركزي."
  blind_candidates:
    - lemma: "تَحَوُّل"
      generation_method: ishtiqaq
      justification: "من الجذر (ح و ل)، يعبر عن الانتقال من حال إلى حال، وهو أدق ما يوصف به المرور من مرحلة إلى أخرى."
    - lemma: "تَبَدُّل"
      generation_method: ishtiqaq
      justification: "من الجذر (ب د ل)، يفيد تغير الشيء أو استبدال حال بحال."
    - lemma: "انْتِقَال"
      generation_method: ishtiqaq
      justification: "يفيد التحرك بين المراحل (Phases) أو الحالات."
    - lemma: "اسْتِحَالَة"
      generation_method: ishtiqaq
      justification: "مصطلح كلامي وفلسفي قديم يعبر عن تغير الطبيعة أو الصورة النوعية للشيء."

stage2_evidence:
  per_lemma:
    - lemma: "تغير"
      confirm:
        - text: "«انتقال الشيء من حالة لأخرى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«كون الشيء بحال لم يكن له قبل ذلك»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
    - lemma: "تغيير"
      confirm:
        - text: "«إحداث شيء لم يكن قبله»"
          source: "التعريفات الفقهية للبركتي"
    - lemma: "تعديل"
      confirm:
        - text: "«إجراء تغيير جزئي لتحسين الوضع أو الصفات»"
          source: "المعجم الموحد لتقانات الأغذية"
    - lemma: "تحول"
      confirm:
        - text: "«تنقل من موضع إلى موضع أو من حال إلى حال»"
          source: "المعجم الوسيط"
        - text: "«تغير الشيء من حالة إلى حالة أخرى تدريجيا»"
          source: "معجم مصطلحات المعلوماتية"
    - lemma: "تبدل"
      confirm:
        - text: "«تغير، والشيء اتخذ منه بدلاً»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "تغير"
      decision: confirmed
      decision_reason: "اللفظ الأساسي للتعبير عن التغير الذاتي أو الطبيعي، متوافق مع التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَغَيُّر"
    - lemma: "تغيير"
      decision: confirmed
      decision_reason: "يعبر عن فعل التغيير أو الحدث الناتج عن تدخل، وهو ركن أساسي في الترادف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَغْيِير"
    - lemma: "تعديل"
      decision: confirmed
      decision_reason: "خاص بالتغيير الجزئي أو التحسيني، ويقابل modification."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْدِيل"
    - lemma: "تحول"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح جوهري للتعبير عن الانتقال بين الأطوار والمراحل (transition/transformation)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَحَوُّل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تبدل"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي يفيد تغير الصفات أو تبديل الأحوال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَبَدُّل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حدث يقع عندما يمر شيء ما من حالة أو مرحلة إلى أخرى"
    assessment:
      decision: retain
      reason: "التعريف دقيق ومباشر ويغطي الجانب المصدري (حدث) والجانب المفهومي (المرور من حالة إلى أخرى)."
  examples:
    per_lemma:
      - lemma: "تَغَيُّر"
        examples:
          - text: "لوحظ تَغَيُّرٌ مفاجئٌ في سلوك المادة عند تعرضها للحرارة."
            type: usage
      - lemma: "تَغْيِير"
        examples:
          - text: "يتطلب تَغْيِيرُ النظامِ القائمِ جهداً جماعياً متواصلاً."
            type: usage
      - lemma: "تَعْدِيل"
        examples:
          - text: "صوّت البرلمانُ لصالحِ إجراءِ تَعْدِيلٍ في الدستور."
            type: usage
      - lemma: "تَحَوُّل"
        examples:
          - text: "تَمُرُّ الفراشةُ بمراحلِ تَحَوُّلٍ مذهلةٍ قبل بلوغ شكلها النهائي."
            type: usage
      - lemma: "تَبَدُّل"
        examples:
          - text: "أدى تَبَدُّلُ الظروفِ المناخيةِ إلى هجرةِ العديدِ من الطيور."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعزى تَغَيُّرُ المناخِ إلى الأنشطةِ البشريةِ المتزايدة."}

stage5_enrichment:
  per_entry:
    - lemma: "تَغَيُّر"
      entry_id: "{auto}"
      root: "غير"
      maqayis_quote: "«الْغَيْنُ وَالْيَاءُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ... وَالْآخَرُ عَلَى اخْتِلَافِ شَيْئَيْنِ. فَالْأَصْلُ الثَّانِي: قَوْلُنَا: هَذَا الشَّيْءُ غَيْرُ ذَاكَ، أَيْ هُوَ سِوَاهُ وَخِلَافُهُ.»"
    - lemma: "تَغْيِير"
      entry_id: "{auto}"
      root: "غير"
      maqayis_quote: "«الْغَيْنُ وَالْيَاءُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ... وَالْآخَرُ عَلَى اخْتِلَافِ شَيْئَيْنِ. فَالْأَصْلُ الثَّانِي: قَوْلُنَا: هَذَا الشَّيْءُ غَيْرُ ذَاكَ، أَيْ هُوَ سِوَاهُ وَخِلَافُهُ.»"
    - lemma: "تَعْدِيل"
      entry_id: "{auto}"
      root: "عدل"
      maqayis_quote: "«الْعَيْنُ وَالدَّالُ وَاللَّامُ أَصْلَانِ صَحِيحَانِ... أَحَدُهُمَا يَدُلُّ عَلَى اسْتِوَاءٍ... تَقُولُ: عَدَلْتُهُ حَتَّى اعْتَدَلَ، أَيْ أَقَمْتُهُ حَتَّى اسْتَقَامَ وَاسْتَوَى.»"
    - lemma: "تَحَوُّل"
      entry_id: "{auto}"
      root: "حول"
      maqayis_quote: "«الْحَاءُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ تَحَرُّكٌ فِي دَوْرٍ... وَحَالَ الشَّخْصُ يَحُولُ، إِذَا تَحَرَّكَ، وَكَذَلِكَ كُلُّ مُتَحَوِّلٍ عَنْ حَالَةٍ.»"
    - lemma: "تَبَدُّل"
      entry_id: "{auto}"
      root: "بدل"
      maqayis_quote: "«الْبَاءُ وَالدَّالُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ قِيَامُ الشَّيْءِ مَقَامَ الشَّيْءِ الذَّاهِبِ... بَدَّلْتُ الشَّيْءَ: إِذَا غَيَّرْتُهُ.»"
  per_sense:
    - lemma: "تَغَيُّر"
      sense_id: "{auto}"
      nuance: "يركز على النتيجة النهائية للتحول أو العملية التي تحدث تلقائياً."
      mwe: false
    - lemma: "تَغْيِير"
      sense_id: "{auto}"
      nuance: "يركز على الفعل أو الحدث المتعمد لإحداث الفرق."
      mwe: false
    - lemma: "تَعْدِيل"
      sense_id: "{auto}"
      nuance: "تغيير جزئي يهدف إلى تصحيح المسار أو تحسينه."
      mwe: false
    - lemma: "تَحَوُّل"
      sense_id: "{auto}"
      nuance: "انتقال جذري أو بنيوي بين أطوار متميزة."
      mwe: false
    - lemma: "تَبَدُّل"
      sense_id: "{auto}"
      nuance: "تغير في الهيئة أو الصفات مع إمكانية إحلال حال محل حال."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"غير","maqayis":"«الْغَيْنُ وَالْيَاءُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ... وَالْآخَرُ عَلَى اخْتِلَافِ شَيْئَيْنِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عدل","maqayis":"«الْعَيْنُ وَالدَّالُ وَاللَّامُ أَصْلَانِ صَحِيحَانِ... أَحَدُهُمَا يَدُلُّ عَلَى اسْتِوَاءٍ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حول","maqayis":"«الْحَاءُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ تَحَرُّكٌ فِي دَوْرٍ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"بدل","maqayis":"«الْبَاءُ وَالدَّالُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ قِيَامُ الشَّيْءِ مَقَامَ الشَّيْءِ الذَّاهِبِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"انتقال جذري أو بنيوي بين أطوار متميزة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
