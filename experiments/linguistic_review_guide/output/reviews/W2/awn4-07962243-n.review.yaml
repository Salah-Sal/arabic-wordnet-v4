      decision_reason: "«مُتَوَفَّوْنَ» جمع مذكر سالم لـ«مُتَوَفًّى» وهو صيغة تأدّبية تُستعمل في السياق الرسمي للحديث عن الموت كحدث، لا كوصف دائم لمجموعة بشرية. كما أنه يخصّ المذكر دون المؤنث. المفهوم المراد (the dead) عامّ يشمل الجنسين ويصف حالة ثابتة"
      evidence_assessment:
