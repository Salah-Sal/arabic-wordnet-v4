# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07962243-n
# المفهوم: الناس الذين فارقوا الحياة (the dead)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أموات، موتى) بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "كلتا اللمّتين صيغتا جمع لمفرد واحد (مَيِّت/مَيْت) — ينبغي التحقق من وجود فروق دلالية بينهما"
    observations: >
      المجموعة تمثّل مفهوماً أساسياً في اللغة العربية له حضور كثيف في القرآن الكريم والحديث
      والشعر والنثر. اللمّتان الموجودتان هما جمعا تكسير لـ«مَيِّت» — أحدهما على وزن أَفْعَال
      والآخر على وزن فَعْلَى. المفهوم فطري في الثقافة العربية ولا يحتاج اقتراضاً أو نحتاً.
      التعريف العربي الحالي وافٍ لكنه يستعمل أسلوباً وصفياً («الناس الذين فارقوا الحياة»)
      بدلاً من أسلوب المعجم الوسيط المعهود.
  blind_candidates:
    - lemma: "مَوْتَى"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«مَيْت» على وزن فَعْلَى، وهو من أشهر جموعه في الاستعمال القرآني والفصيح"
    - lemma: "أَمْوَات"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«مَيْت» على وزن أَفْعَال، شائع في القرآن الكريم والنثر العربي"
    - lemma: "هَلْكَى"
      generation_method: ishtiqaq
      justification: "جمع هَالِك على وزن فَعْلَى من جذر ه-ل-ك بمعنى مَن ذهبت حياته وفَنِي"
    - lemma: "مُتَوَفَّوْنَ"
      generation_method: ishtiqaq
      justification: "جمع مذكر سالم لـ«مُتَوَفًّى» من و-ف-ي، يُستعمل في السياق الرسمي والتأبيني"

stage2_evidence:
  per_lemma:
    - lemma: "أَمْوَات"
      confirm:
        - text: "«وقومٌ مَوْتى وأمواتٌ، وميتون وميتون»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«م و ت: الْمَوْتُ ضِدُّ الْحَيَاةِ... فَهُوَ مَيِّتٌ وَ مَيْتٌ... وَقَوْمٌ مَوْتَى وَ أَمْوَاتٌ وَ مَيِّتُونَ وَ مَيْتُونَ»"
          source: "مختار الصحاح للرازي"
        - text: "«المَيْتُ: الذى فارق الحياة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«ماتَ يَموت مَوْتاً... فهو مائِت ومَيْت ومَيِّت... مات الحيُّ: فارقته الحياةُ، فارقت الرُّوحُ جسدَه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يوسّع بذكر الصيغ الصرفية المتنوعة وتأكيد المعنى الأساسي"

    - lemma: "مَوْتَى"
      confirm:
        - text: "«وقومٌ مَوْتى وأمواتٌ، وميتون وميتون»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«وَقَوْمٌ مَوْتَى وَ أَمْوَاتٌ»"
          source: "مختار الصحاح للرازي"
      expands:
        - text: "«ليس من مات فاستراح بمَيْت * إنَّما المَيْتُ ميت الاحياء»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "شاهد شعري يجمع بين صيغتَي مَيْت ومَيِّت ويبيّن البُعد المجازي"

    - lemma: "هَلْكَى"
      evidence_status: "no_material_found"

    - lemma: "مُتَوَفَّوْنَ"
      confirm:
        - text: "«the dead: (1) الموتى»"
          source: "المورد الحديث (2008)"
        - text: "«(1) مَيْت (2) المَيْت؛ الفقيد»"
          source: "المورد الحديث (2008) — مادة deceased"
      expands:
        - text: "«بَاب الْمَوْت: مَاتَ وَفَاتَ وفطس ورهق وَتلف وَهلك وباد وفاد وفاظت نَفسه وَقضى نحبه ودعي فَأجَاب»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
          addition: "يبيّن أن الوفاة من مرادفات الموت في حقل دلالي واحد"

