stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يحتاج إلى صياغة أكثر فصاحة (كل ما له أربعة أركان)."
      - "اللمة الموجودة تفتقر إلى التشكيل."
    observations: "المفهوم يشير إلى الشيء الذي يتخذ شكل المربع أو ما يقاربه، وهو ما تصفه المعاجم العربية بـ 'كل ما له أربعة أركان'. اللفظ 'مربع' هو اللفظ القياسي، وهناك ألفاظ أخرى تدل على قطع أو أجزاء مربعة مثل 'تربيعة'."
  blind_candidates:
    - lemma: "تَرْبِيعَة"
      generation_method: ishtiqaq
      justification: "تدل على القطعة الواحدة المربعة، مثل بلاطة أو حشوة خشبية."
    - lemma: "مُرَبَّعَة"
      generation_method: ishtiqaq
      justification: "تستخدم للدلالة على المكان المربع أو المساحة المربعة."
    - lemma: "شِبْه مُرَبَّع"
      generation_method: tarkib
      justification: "ترجمة حرفية لـ approximating the shape of a square."
    - lemma: "تَرْبِيع"
      generation_method: ishtiqaq
      justification: "مصدر ربع، ويستخدم أحياناً للدلالة على الهيئة المربعة."

stage2_evidence:
  per_lemma:
    - lemma: "مربع"
      confirm:
        - text: "المُرَبَّعُ: كلُّ ما له أربعة أركان"
          source: "المعجم الوسيط"
        - text: "المُرَبَّعُ: كلُّ ما له أَرْبَعَةُ أَرْكان (فى الهندسة): ما لَـه أَرْبَعُ أضلاعٍ مُتساوِيَةٍ"
          source: "المعجم الكبير"
    - lemma: "مُرَبَّعَة"
      confirm:
        - text: "المربعة: المربع"
          source: "المعجم الوسيط"
      expands:
        - text: "المربعة: الأرض ذات اليرابيع"
          source: "المعجم الوسيط"
          addition: "معنى آخر غير مقصود هنا."
    - lemma: "تَرْبِيعَة"
      confirm:
        - text: "تَرْبِيعَة (فى علوم الآثار): حَشَواتٌ أو زَخارِفُ مُخْتَلِفةٌ فى حائطٍ أو سَقْفٍ خَشَبِىٍّ"
          source: "المعجم الكبير"
    - lemma: "شِبْه مُرَبَّع"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مربع"
      decision: confirmed
      decision_reason: "هو المصطلح الأساسي والقياسي لوصف أي شيء له أربعة أركان أو يتخذ شكل المربع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرَبَّع"
    - lemma: "مُرَبَّعَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف للمربع في بعض السياقات، ويشيع استخدامه للدلالة على المساحة أو الغرفة المربعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُرَبَّعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13901590-n"}
    - lemma: "تَرْبِيعَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني ومعجمي يدل على الشيء المربع (حشوة، زخرفة، قطعة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَرْبِيعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13901590-n"}
    - lemma: "شِبْه مُرَبَّع"
      decision: removed
      decision_reason: "تعبير وصفي وليس مصطلحاً معجمياً مسكوكاً."

stage4_content:
  definition:
    current: "شيء يقارب شكل المربع"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي، والأولى استخدام التعبير المعجمي الفصيح الذي يشمل الشكل الهندسي وما يقاربه."
    authored:
      - type: terminological
        text: "كُلُّ ما لَهُ أَرْبَعَةُ أَرْكانٍ أو ما يَقْرُبُ مِنْ شَكْلِ المُربَّعِ الهَنْدَسِيِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13901590-n", definition_index: 0, text: "كُلُّ ما لَهُ أَرْبَعَةُ أَرْكانٍ أو ما يَقْرُبُ مِنْ شَكْلِ المُربَّعِ الهَنْدَسِيِّ."}
  examples:
    per_lemma:
      - lemma: "مُرَبَّع"
        examples:
          - text: "انْتَظَمَ الفُرْسانُ في مُرَبَّعٍ حَرْبِيٍّ لِمُواجَهَةِ خَيَّالَةِ العَدُوِّ."
            type: usage
      - lemma: "مُرَبَّعَة"
        examples:
          - text: "أَقَامُوا حَفْلَهُمْ في مُرَبَّعَةٍ واسِعَةٍ بَسَطوا فيها الرَّياحِينَ."
            type: usage
      - lemma: "تَرْبِيعَة"
        examples:
          - text: "رَصَفَ البَنَّاءُ الأَرْضِيَّةَ بِتَرْبيعاتٍ مِنَ الرُّخامِ المُلوَّنِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-13901590-n", text: "انْتَظَمَ الفُرْسانُ في مُرَبَّعٍ حَرْبِيٍّ لِمُواجَهَةِ خَيَّالَةِ العَدُوِّ."}

