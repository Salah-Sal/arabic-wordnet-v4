# ── المرحلة ١: المراجعة والتوليد ──────────────────────────

stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث مكتوبة بدون تشكيل — يجب إضافة الضبط الكامل"
      - "غياب لمّة 'مَآل' وهي فصيحة موثّقة في المعجمية العربية بمعنى العاقبة والمرجع"
      - "لمّة 'أثر' ذات حقل دلالي واسع جداً يشمل: بقية الشيء، العلامة، الأثر التاريخي، الحديث المروي — يجب توثيق تخصيصه الدلالي في هذا السياق"
      - "لمّة 'عاقبة' تحمل في الغالب ظلالاً سلبية (العقوبة، العواقب الوخيمة) وهي لا تُقابل consequence المحايدة تماماً"
    observations: >
      المجموعة تُعبّر عن مفهوم فلسفي وعلمي راسخ هو: الظاهرة الناتجة عن ظاهرة سابقة بعلاقة سببية.
      العربية تمتلك معجماً ثرياً لهذا المفهوم؛ إذ تتضافر لمّات ثلاث تصفها من زوايا مختلفة:
      "نتيجة" تؤكد العلاقة المنطقية، و"عاقبة" تؤكد الخاتمة الزمنية، و"أثر" يؤكد ما تركته الظاهرة.
      غير أن المجموعة تفتقر إلى لمّات أصيلة كـ"مَآل" و"مَغَبَّة" اللتين توثّقهما المعاجم الكلاسيكية
      والمعاصرة في هذا المعنى بالذات.

  blind_candidates:
    - lemma: "مَآل"
      generation_method: majaz
      justification: >
        من "آلَ يَؤُول مَآلاً" أي رجع وانتهى إلى؛ إحياء لفظ عربي قديم يدل على المنتهى
        والمصير الذي تؤول إليه الأمور. المجاز واضح: الظاهرة الناتجة هي "مآل" الظاهرة السابقة،
        أي ما آلت إليه. الاستخدام الفصيح قائم في تعابير مثل "مآل الأمر" و"مآل المفاوضات".
    - lemma: "مُحَصَّلَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر ح-ص-ل على وزن مُفَعَّلَة، ما تحصَّل وتجمَّع من المقدمات والأسباب.
        الوزن مُفَعَّل يدل على ما أُنجز أو استُخلص. تشبه "محصلة الجهود" في الاستخدام.
    - lemma: "لَازِمَة"
      generation_method: majaz
      justification: >
        من "لَزِمَ يَلْزَم" أي ثبت ودام؛ ما يلزم الظاهرةَ السابقةَ حتماً من نتائج لا مفرّ منها.
        توظيف مجازي للدلالة على الترابط الضروري بين السبب ونتيجته.
    - lemma: "حَاصِل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من "حَصَلَ" على وزن فاعل، ما حصَل وتقرَّر من المقدمات السببية.
        التعبير "الحاصل أن..." شائع في الفصحى بمعنى "النتيجة المستخلصة هي...".


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# الاستعلامات المنفَّذة:
# ١. استعلام دفعي لكل اللمّات الموجودة والمرشحات (headword_norm)
# ٢. جسر إنجليزي: consequence, effect, outcome, result, upshot, sequel, repercussion
# ٣. مقاييس اللغة: جذور أثر، عقب، نتج، أول
# ٤. بحث مغبّة المكتشفة

