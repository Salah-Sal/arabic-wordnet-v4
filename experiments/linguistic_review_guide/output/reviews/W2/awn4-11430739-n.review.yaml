# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────

stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "أثر"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة موثّقة في أمهات المعاجم بمعنى النتيجة والحاصل من الشيء.
        كتاب التعريفات للجرجاني يُصرّح بأن الأثر بمعنى «النتيجة وهو الحاصل من الشيء»،
        وهو استخدام راسخ في التراث الفلسفي والكلامي العربي. تشكيلها الصحيح: أَثَر.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختص بالتأثير المادي أو المعنوي المتروك في شيء ما من جراء فعل أو حدث؛
        دلالته تنحو نحو الانطباع والعلامة الباقية ('أثّر في النفس'، 'آثار الكوارث').
        يختلف عن 'نتيجة' بأن 'نتيجة' تصف الخلاصة المنطقية، بينما 'أثر' يصف
        الانعكاس الحادث في المتأثَّر به. ويختلف عن 'عاقبة' التي تنصبّ على الخاتمة الزمنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَثَر"

    - lemma: "عاقبة"
      decision: confirmed
      decision_reason: >
        لمّة فصيحة راسخة بمعنى آخر الشيء وخاتمته؛ الجذر عقب يدل على التأخر
        والإتيان بعد غيره. المعاجم تؤكد استخدامها في هذا المعنى وإن كانت تميل
        نحو النهايات الجدية أو السلبية. تشكيلها الصحيح: عَاقِبَة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تختص بالنهاية الزمنية الحتمية لمسار حادثة ما؛ تحمل في الغالب دلالة الجدية
        والوطأة ('عاقبة السوء'، 'العواقب الوخيمة') وإن صحّت في الإيجابي ('حميدة العاقبة').
        تختلف عن 'نتيجة' بأنها تركز على الخاتمة بينما 'نتيجة' تركز على الاستنتاج المنطقي،
        وتختلف عن 'أثر' بأنها لا تعني الانطباع المتروك بل الحدث الختامي ذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَاقِبَة"

    - lemma: "نتيجة"
      decision: confirmed
      decision_reason: >
        اللمّة الأكثر حيادية وشيوعاً وأقربها إلى consequence الإنجليزية في دلالتها العامة.
        موثّقة في المعاجم الكلاسيكية والمعاصرة وفي ArabTerm مقابلاً لـ consequence/outcome/result.
        جذرها من النتاج يؤكد صورة الإنتاج من المقدمات. تشكيلها الصحيح: نَتِيجَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تختص بالحصيلة المنطقية والاستنتاج الفكري أو المادي المترتّب على مقدمات محددة؛
        أكثر حيادية من 'عاقبة' وأكثر إجرائية من 'أثر'. يُقال: 'نتيجة التجربة'، 'نتيجة
        الانتخابات'، 'النتيجة الحتمية'. تؤكد العلاقة الإجرائية أو المنطقية دون إيحاء
        إيجابي أو سلبي بالضرورة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَتِيجَة"

    # ── مرشحات المرحلة ١ ──

    - lemma: "مَآل"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح عربي فصيح أصيل موثّق بمعنى المرجع والعاقبة في المعجم الكبير. جذره
        من "آلَ يَؤُول" (أي رجع وانتهى) الذي يُقابل مفهوم الوصول إلى النتيجة النهائية.
        يُستخدم في الفصاحة المعاصرة استخداماً طبيعياً ('مآل الأمر'، 'مآل المفاوضات')،
        وهو أقل شيوعاً من 'نتيجة' لكنه يملأ ثغرة دلالية في التعبير عن المصير الأخير.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختص بالمصير الأخير والنهاية النهائية التي تؤول إليها الأمور؛ أكثر تخصصاً
        من 'نتيجة' إذ يُشير إلى الوجهة الأخيرة لا الخطوة المباشرة التالية.
        يناسب الظواهر المعقدة ذات المسارات الطويلة. يختلف عن 'عاقبة' بأن عاقبة تنصبّ
        على الختم بينما مآل يعني الاتجاه والمآب النهائي.
      actions:
        - command: create_entry
          params:
            lemma: "مَآل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُحَصَّلَة"
      source: stage1
      decision: removed
      decision_reason: >
        مصطلح منطقي تقني يعني القضية المُحصَّلة (التي لا يكون السلب جزءاً من موضوعها
        أو محمولها)، وفي السياق التقني يعني resultant أي المحصّلة الهندسية للقوى.
        كلا المعنيَين بعيد عن consequence العام. اشتقاقها الصرفي سليم لكن دلالتها
        المعجمية الثابتة تتعارض مع الاستخدام المُراد.

    - lemma: "لَازِمَة"
      source: stage1
      decision: removed
      decision_reason: >
        مصطلح رياضي وفلسفي متخصص بمعنى corollary (نتيجة تلزم نظرية برهنية بالضرورة).
        موثّق في المعجم الوسيط وArabTerm بهذا المعنى. لا يصح استخدامها مرادفاً
        لـ consequence العام دون تضليل المتخصصين في الرياضيات والمنطق.

    - lemma: "حَاصِل"
      source: stage1
      decision: removed
      decision_reason: >
        "الحاصل" أقرب إلى التعبير الاصطلاحي الخطابي ("الحاصل أن...") منه إلى المصطلح
        المسكوك. دلالته التقنية الرئيسية حسابية (حاصل الجمع والضرب). اختبار السكّ
        يكشف عدم تثبيته: يمكن استبدال "الحاصل" بـ"النتيجة" في كل سياق دون فقدان المعنى
        الاصطلاحي، مما يدل على كونه وصفياً لا مصطلحاً مسكوكاً بذاته.

  # ملاحظة: مَغَبَّة (اكتُشفت عبر الأدلة لا عبر توليد المرحلة ١)
  # موثّقة في المعجم الوسيط: «من كل شيء: عاقبته وآخره. يقال: لهذا الأمر مَغَبَّة طيبة»
  # يُوصى بمراجعتها في دورة مراجعة مستقبلية لإضافتها إلى المجموعة.


