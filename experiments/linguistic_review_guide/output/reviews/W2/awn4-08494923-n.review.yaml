stage1_review:
  assessment:
    concerns:
      - "اللمة (النساء) تُستخدم عادة كجمع لكلمة امرأة، بينما المدلول هنا يشير إلى الجنس الأنثوي أو عالم النساء ككل (womankind)."
    observations: "المجموعة الترادفية تُعبر عن النساء بوصفهن فئة أو جنساً متميزاً عن الرجال. التعبيرات المتوفرة جيدة ومناسبة، حيث يكثر إطلاق (معشر النساء) و(جنس النساء) للدلالة على هذا المفهوم."
  blind_candidates:
    - lemma: "جِنْسُ النِّسَاءِ"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر بدقة عن النساء كجنس مقابل جنس الرجال."
    - lemma: "نِسْوَة"
      generation_method: ishtiqaq
      justification: "جمع تكسير يستخدم للدلالة على جماعة النساء."
    - lemma: "عَالَمُ حَوَّاءَ"
      generation_method: majaz
      justification: "تعبير مجازي حديث يشير إلى مجمل عالم النساء."
    - lemma: "الجِنْسُ اللَّطِيفُ"
      generation_method: tarkib
      justification: "تعبير وصفي اصطلاحي يطلق على النساء تمييزاً لهن."

stage2_evidence:
  per_lemma:
    - lemma: "النساء"
      confirm:
        - text: "النِّسَاءُ: جمع امرأة من غير لفظه"
          source: "المعجم الوسيط"
    - lemma: "معشر النساء"
      confirm:
        - text: "إنا معشر النساء محصورات مقصورات"
          source: "مجمع بحار الأنوار للفَتِّنيّ"
    - lemma: "جِنْسُ النِّسَاءِ"
      evidence_status: "no_material_found"
    - lemma: "نِسْوَة"
      confirm:
        - text: "(النسْوَة) النِّسَاء"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "عَالَمُ حَوَّاءَ"
      evidence_status: "no_material_found"
    - lemma: "الجِنْسُ اللَّطِيفُ"
      confirm:
        - text: "النِّساء؛ الجنس اللَّطيف. (womankind)"
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "النساء"
      decision: confirmed
      decision_reason: "كلمة فصيحة ومستقرة، وتُستخدم بكثرة للدلالة على جماعة النساء والجنس الأنثوي بشكل عام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "النِّسَاء"

    - lemma: "معشر النساء"
      decision: confirmed
      decision_reason: "تركيب إضافي فصيح ومسجّل في التراث، يدل على طائفة النساء أو مجتمعهن."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْشَر النِّسَاء"

    - lemma: "جِنْسُ النِّسَاءِ"
      source: stage1
      decision: removed
      decision_reason: "المعنى متحقق باللمّات الحالية، ولا توجد حاجة لإضافة هذا التركيب الوصفي."

    - lemma: "نِسْوَة"
      source: stage1
      decision: removed
      decision_reason: "تدل على العدد القليل من النساء غالباً، وليست شاملة لمفهوم الجنس الأنثوي (womankind) بأسره."

    - lemma: "عَالَمُ حَوَّاءَ"
      source: stage1
      decision: removed
      decision_reason: "تعبير صحفي ومجازي غير معجمي."

    - lemma: "الجِنْسُ اللَّطِيفُ"
      source: stage1
      decision: removed
      decision_reason: "تعبير اصطلاحي كنائي مجازي، وقد يحمل دلالات لا تتناسب مع الحياد المعجمي، واللمّات الموجودة تفي بالغرض."

stage4_content:
  definition:
    current: "النساء بتمييزهن عن الرجال"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويؤدي المعنى المطلوب بسلاسة."
  examples:
    per_lemma:
      - lemma: "النساء"
        examples:
          - text: "لِلنِّسَاءِ دَوْرٌ بَارِزٌ فِي بِنَاءِ المُجْتَمَعِ وَتَطَوُّرِهِ."
            type: usage
      - lemma: "معشر النساء"
        examples:
          - text: "«يَا مَعْشَرَ النِّسَاءِ تَصَدَّقْنَ»"
            type: hadith
            source: "صحيح البخاري"
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "لِلنِّسَاءِ دَوْرٌ بَارِزٌ فِي بِنَاءِ المُجْتَمَعِ وَتَطَوُّرِهِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "«يَا مَعْشَرَ النِّسَاءِ تَصَدَّقْنَ»"

