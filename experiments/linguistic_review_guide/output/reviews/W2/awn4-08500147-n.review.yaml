stage1_review:
  assessment:
    concerns:
      - "عدم وجود تشكيل كامل للمصطلح الحالي."
      - "التعريف يفتقر إلى الدقة المعجمية المطلوبة ويشبه الترجمة الحرفية."
    observations: "المفهوم يشير إلى الاعتقاد الديني أو الثقافي باصطفاء إلهي لشعب ما، والمصطلح الأكثر شيوعاً ورسوخاً في العربية هو 'شعب الله المختار' كتركيب إضافي ووصفي."
  blind_candidates:
    - lemma: "شَعْبٌ مُخْتَارٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يطابق الدلالة الإنجليزية 'chosen people' بشكل مباشر."
    - lemma: "أُمَّةٌ مُصْطَفَاةٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يحمل دلالة الاصطفاء الإلهي لمجموعة من البشر أو أمة."
    - lemma: "شَعْبُ اللهِ الْمُخْتَارُ"
      generation_method: tarkib
      justification: "تركيب إضافي ووصفي وهو التعبير المتداول والمستقر ثقافياً وتاريخياً للتعبير عن هذا المفهوم في الأدبيات العربية."
    - lemma: "شَعْبٌ مُصْطَفًى"
      generation_method: tarkib
      justification: "مرادف لـ 'شعب مختار' باستخدام الجذر 'صطفي' الذي يحمل دلالة الاختيار الإلهي في التراث."

