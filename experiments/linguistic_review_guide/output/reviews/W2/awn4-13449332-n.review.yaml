        examples:
          - text: "تُعَدُّ التَّهْوِيَةُ مَرْحَلَةً أَسَاسِيَّةً فِي مُعَالَجَةِ مِيَاهِ الصَّرْفِ الصِّحِّيِّ لِرَفْعِ مُسْتَوَيَاتِ الْأُكْسُجِينِ الْمُنْحَلّ."
            type: usage
          - text: "يَلْجَأُ الْمُزَارِعُونَ إِلَى تَهْوِيَةِ التُّرْبَةِ لِتَحْسِينِ نَفَاذِيَّتِهَا وَتَيْسِيرِ امْتِصَاصِ الْجُذُورِ لِلْمُغَذِّيَات."
            type: usage
