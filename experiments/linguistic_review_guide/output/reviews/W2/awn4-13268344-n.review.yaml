# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13268344-n
# المفهوم: landholding — ملكية الأرض
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الثانية «مِلْكِيَّة الأَرْض» تستخدم المفرد (الأرض) بينما الأولى تستخدم الجمع (الأراضي)؛ قد يُوحي ذلك بفرق دلالي بين ملكية قطعة واحدة وملكية أراضٍ متعددة"
      - "التعريف العربي يكاد يكون ترجمة حرفية للتعريف الإنجليزي؛ يحتاج صياغة معجمية أصيلة"
    observations: "المفهوم يندرج تحت باب الحقوق العينية على الأرض، وهو مفهوم أصيل في الفقه الإسلامي والقانون العربي. يُتوقَّع وجود مصطلحات تراثية كالإقطاع والعقار والحيازة تغطي جوانب من هذا المفهوم."
  blind_candidates:
    - lemma: "حِيَازَةٌ عَقَارِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «حيازة» (وضع اليد والتملّك) و«عقارية» (نسبة إلى العقار وهو كل ملك ثابت كالأرض). يُعبّر عن حالة امتلاك العقار/الأرض."
    - lemma: "حِيَازَة الأَرَاضِي"
      generation_method: tarkib
      justification: "مركب إضافي من «حيازة» و«الأراضي» (جمع أرض). يدل مباشرة على وضع اليد على الأراضي وتملّكها."
    - lemma: "إِقْطَاعِيَّة"
      generation_method: ishtiqaq
      justification: "مشتقة من «إقطاع» (إعطاء السلطان أرضاً لرجل) بإضافة ياء النسب والتاء للتجريد. تدل على حالة امتلاك الأرض بطريقة الإقطاع."
    - lemma: "تَمَلُّكٌ عَقَارِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «تملّك» (مصدر تَمَلَّكَ: صار مالكاً) و«عقاري» (نسبة إلى العقار). يدل على فعل التملّك المتعلق بالعقارات والأراضي."


stage2_evidence:
  per_lemma:
    - lemma: "حِيَازَة الأَرَاضِي"
      confirm:
        - text: "«حيازة الأراضي»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — translation_en: land tenure"
        - text: "«حيازة الرجل: ما في حوزته من مال أو عقار والأرض الزراعية»"
          source: "المعجم الوسيط"
        - text: "«حيازة الشيء: ما ضمّه الإنسان إلى نفسه من مال أو غيره»"
          source: "المعجم الكبير"
        - text: "«حيازة الرجل: ما في حوزته من مال أو عقار الأرض الزراعية تدخل في حيازة فرد أو هيئة»"
          source: "المعجم الكبير"
      expands:
        - text: "«الحاء والواو والزاء أصل واحد، وهو الجمع والتجمّع، يقال لكل مجمع وناحية حوز وحوزة. وحمى فلان الحوزة، أي المجمع والناحية. وكل من ضمّ شيئاً إلى نفسه فقد حازه حوزاً»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يدل على الجمع والضم إلى النفس، مما يؤكد دلالة الحيازة على وضع اليد والتملّك"

    - lemma: "مِلْكِيَّة الأَرْض"
      confirm:
        - text: "«ملكية الأراضي»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — translation_en: land ownership"
        - text: "«المِلْكُ أو التمليك. يقال: بيدي عَقْد مِلكيّة هذه الأرض. قانون تحديد المِلْكِيَّة الزراعية: القانون الذي يحدّد مقدار ما يجوز للفرد أن يمتلكه من الأرض الزراعية»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الميم واللام والكاف أصل صحيح يدلّ على قوّة في الشيء وصحّة. يقال: أملك عجينه: قوّى عجنه وشدّه. ثم قيل ملك الإنسان الشيء يملكه ملكاً. والاسم المِلك؛ لأنّ يده فيه قوية صحيحة»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدل على القوة والصحة في السيطرة، مما يعزز دلالة الملكية بوصفها سلطة قوية ثابتة على الشيء"

    - lemma: "حِيَازَةٌ عَقَارِيَّةٌ"
      confirm:
        - text: "«حيازة عقارية»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — translation_en: land-holding"
        - text: "«حيازة عقارية»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — translation_en: tenure"
        - text: "«نظام الحيازة العقارية»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — translation_en: land tenure system"
      expands:
        - text: "«العقار: كل ملك ثابت له أصل كالأرض والدار. والعقار الحرّ: ما كان خالص الملكية يأتي بدخل سنوي دائم يسمّى ريعاً»"
          source: "المعجم الوسيط"
          addition: "العقار يشمل الأرض والدار، فالحيازة العقارية أوسع قليلاً من حيازة الأراضي وحدها"

    - lemma: "إِقْطَاعِيَّة"
      contradicts:
        - text: "«الإقطاع: نظام يقوم على العلاقة بين السادة ونوابهم، يقضي بأن يملّك الأولون الآخرين قطائع من الأرض على سبيل المنحة لهم ولأولادهم وكل نظام يمكّن المالك من أن يتحكم في الأرض ومن فيها من الناس»"
          source: "المعجم الوسيط"
          conflict: "المصطلح يدل على نظام اجتماعي سياسي قائم على التبعية بين السادة والأتباع، وليس على مجرد ملكية الأرض"
        - text: "«الإقطاع: أن يعطي السلطان أرضاً لرجل فيصير له رقبتها، ويؤدّي عشرها ويكون لورثته بعده»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الإقطاع مرتبط بمنحة السلطان تحديداً، وليس بالملكية العامة للأرض"

    - lemma: "تَمَلُّكٌ عَقَارِيٌّ"
      confirm:
        - text: "«حيازة المِلْكيّة: تملُّك للأرض أو للمنقولات»"
          source: "المورد الحديث (2008) — seizin"
      expands:
        - text: "«تملّك؛ امتلاك؛ حيازة؛ إحراز؛ اقتناء»"
          source: "المورد الحديث (2008) — possession"
          addition: "التملّك يُذكر مرادفاً للحيازة والامتلاك في سياق الترجمة"


stage3_analysis:
  per_lemma:
    - lemma: "حِيَازَة الأَرَاضِي"
      decision: confirmed
      decision_reason: "مصطلح ثابت مسجّل في المَكنَز الزراعي (AGROVOC) مقابلاً لـ land tenure، ومؤيَّد بتعريفات المعجم الوسيط والمعجم الكبير لمادة «حيازة». مركب إضافي واضح الدلالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على البُعد القانوني والعملي لوضع اليد على الأراضي (tenure)، ويشمل أنماط الحيازة المختلفة كالحيازة العرفية والقانونية، سواء أكانت ملكية كاملة أم حقّ انتفاع."
      actions: []

    - lemma: "مِلْكِيَّة الأَرْض"
      decision: confirmed
      decision_reason: "مصطلح مسجّل في AGROVOC بصيغة الجمع (ملكية الأراضي = land ownership). الصيغة المفردة مقبولة لغوياً وتدل على المفهوم العام. مؤيَّد بالمعجم الوسيط الذي يستخدم «ملكية الأرض» في سياق الحديث عن التملّك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على البُعد الحقوقي للعلاقة بين المالك والأرض (ownership)، أي الحق القانوني الكامل في التصرف بالأرض نقلاً وبيعاً وإرثاً، بخلاف الحيازة التي قد تكون بلا ملكية."
      actions: []

    - lemma: "حِيَازَةٌ عَقَارِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسجّل في المعجم الموحد لمصطلحات التجارة والمحاسبة مقابلاً لـ land-holding تحديداً، وفي AGROVOC مقابلاً لـ tenure. يُثري المجموعة الترادفية بتعبير وصفي يجمع بين الحيازة والعقار."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يجمع بين مفهوم الحيازة ومفهوم العقار (الملك الثابت كالأرض والدار)، فهو أعمّ قليلاً إذ قد يشمل الدور والمباني إلى جانب الأراضي، لكنه يُستعمل مرادفاً لحيازة الأراضي في السياق الزراعي والتجاري."
      actions:
        - command: create_entry
          params:
            lemma: "حِيَازَةٌ عَقَارِيَّةٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إِقْطَاعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الإقطاع في المعجم الوسيط يدل على نظام اجتماعي سياسي قائم على علاقة التبعية بين السادة والأتباع، لا على مجرد ملكية الأرض. المصطلح محمّل بدلالات تاريخية وسياسية سلبية (الإقطاعية) تجعله غير مناسب للدلالة على المفهوم المحايد landholding."

    - lemma: "تَمَلُّكٌ عَقَارِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "وإن كان «التملّك العقاري» مستعملاً في السياق القانوني، فإنّه يدل على فعل التملّك (اكتساب الملكية) أكثر من دلالته على حالة الملكية الثابتة. كما أنّ «الحيازة العقارية» أكثر تثبيتاً معجمياً في المعاجم الموحدة."


