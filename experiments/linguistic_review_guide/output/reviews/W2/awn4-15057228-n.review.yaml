  per_entry:
    - lemma: "مُهَيِّج"
      entry_id: "{auto}"
      root: "هيج"
      maqayis_quote: "«الْهَاءُ وَالْيَاءُ وَالْجِيمُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى ثَوَرَانِ شَيْءٍ... فَالْأَوَّلُ: هَاجَ الْفَحْلُ هَيْجًا وَهِيَاجًا. وَهَيَّجْتُهُ أَي أثَرْتُه.»"
    - lemma: "مَادَّة مُهَيِّجَة"
      entry_id: "{auto}"
      roots:
        - word: "مادة"
          root: "مدد"
          maqayis_quote: "«الْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ، وَهُوَ أَنْ يُبْسَطَ الشَّيْءُ...»"
        - word: "مهيجة"
          root: "هيج"
          maqayis_quote: "«الْهَاءُ وَالْيَاءُ وَالْجِيمُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى ثَوَرَانِ شَيْءٍ...»"
    - lemma: "مُهَيِّج كِيمْيَائِيّ"
      entry_id: "{auto}"
      roots:
        - word: "مهيج"
          root: "هيج"
          maqayis_quote: "«الْهَاءُ وَالْيَاءُ وَالْجِيمُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى ثَوَرَانِ شَيْءٍ...»"
        - word: "كيميائي"
