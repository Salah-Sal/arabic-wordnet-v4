stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة خالية من التشكيل ويجب ضبطها."
      - "مصطلح (تجمهر) و(تجمع) مستخدمان بكثرة في المعاجم الحديثة بصيغة المصدر للدلالة على الاسم (المجتمعون)، بينما المعاجم التراثية تدرجها كأفعال أو مصادر فقط."
    observations: "المفهوم يدل على اجتماع مجموعة من الأشخاص في مكان واحد. الكلمات المعبرة عن هذا المعنى في العربية كثيرة وتتدرج من المعنى العام (جمع، تجمع) إلى المعنى الذي يتضمن الكثرة والتعاون (حشد) أو التجمع العفوي (تجمهر)."
  blind_candidates:
    - lemma: "جَمْع"
      generation_method: ishtiqaq
      justification: "مصدر من الفعل (جمع) أُطلق على الجماعة المجتمعين."
    - lemma: "جَمْهَرَة"
      generation_method: ishtiqaq
      justification: "من الفعل (جمهر) وتعني المجتمع من الناس."
    - lemma: "مَحْشَد"
      generation_method: ishtiqaq
      justification: "على وزن (مَفْعَل) للدلالة على مكان الحشد أو المجتمعين."
    - lemma: "مَجْمَع"
      generation_method: ishtiqaq
      justification: "على وزن (مَفْعَل) للدلالة على موضع الاجتماع والمجتمعين أنفسهم."

stage2_evidence:
  per_lemma:
    - lemma: "تجمع"
      confirm:
        - text: "تجمع سكاني يشمل مدينة مركزية وضواحيها."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
        - text: "تكتُّل"
          source: "مسرد الجغرافيا والتاريخ"
      expands:
        - text: "(تجمع) انْضَمَّ بعضه إِلَى بعض"
          source: "المعجم الوسيط"
          addition: "يثبت الأصل الفعلي والمصدري الدال على الانضمام."
    - lemma: "تجمهر"
      confirm:
        - text: "ورد الفعل «جَمَهْرَ» في المعاجم القديمة بمعانٍ عدّة، منها قولهم: جمهرت القوم إذا جمعتهم، وعلى هذا يصح الفعل «تجمهر» على سبيل المطاوعة، بمعنى: تجمَّع."
          source: "معجم الصواب اللغوي"
      expands:
        - text: "(تجمهر) عَلَيْهِ تطاول وَالنَّاس اجْتَمعُوا (مو)"
          source: "المعجم الوسيط"
          addition: "يدل على التجمع والكثرة."
    - lemma: "حشد"
      confirm:
        - text: "(الحشد) من النَّاس الْجَمَاعَة (ج) حشود"
          source: "المعجم الوسيط"
        - text: "الجَماعةُ يَحْتَشِدون. يقال: عند فُلَانٍ حَشْدٌ من النَّاسِ العَشِيرَة"
          source: "المعجم الكبير"
    - lemma: "جمع"
      confirm:
        - text: "الجماعة من كلِّ شيءٍ المُجْتَمِعون الجَيْش"
          source: "المعجم الكبير"
        - text: "الجماعة المجتمعون الجيش"
          source: "المعجم الوسيط"
    - lemma: "جمهرة"
      confirm:
        - text: "المُجْتَمَعُ"
          source: "المعجم الكبير"
    - lemma: "محشد"
      contradicts:
        - text: "مكان جمع القوم واجتماعهم وزمانه."
          source: "موسوعة السلطان قابوس"
          conflict: "يدل على المكان والزمان وليس على الأشخاص أنفسهم."
    - lemma: "مجمع"
      confirm:
        - text: "مَوْضع الاجتماع. المُلْتَقى. جماعةُ النَّاسِ المُجْتَمِعِينَ."
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "تجمع"
      decision: confirmed
      decision_reason: "مصطلح شائع ومقبول في العربية المعاصرة للتعبير عن مجموعة من الأشخاص مجتمعين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجَمُّع"
    - lemma: "تجمهر"
      decision: confirmed
      decision_reason: "كلمة فصيحة وشائعة الاستخدام في العصر الحديث للتعبير عن تجمع الناس، غالباً بشكل عفوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجَمْهُر"
    - lemma: "حشد"
      decision: confirmed
      decision_reason: "لفظ فصيح وموثق في المعاجم القديمة والحديثة بمعنى الجماعة من الناس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَشْد"
    - lemma: "جَمْع"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي أصيل وواسع الاستخدام ويعني بدقة الجماعة المجتمعين من الناس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "جَمْع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "جَمْهَرَة"
      source: stage1
      decision: removed
      decision_reason: "رغم صحتها، إلا أن دلالتها تميل أكثر إلى معنى (المعظم) أو الأغلبية، وتكفي اللمّات الأخرى الأقرب دلالة."
    - lemma: "مَحْشَد"
      source: stage1
      decision: removed
      decision_reason: "يدل عادة على مكان أو زمان الحشد وليس الأشخاص."
    - lemma: "مَجْمَع"
      source: stage1
      decision: removed
      decision_reason: "يغلب استعماله اليوم للدلالة على المؤسسة (مثل مجمع اللغة) أو المكان (مجمع تجاري)."

stage4_content:
  definition:
    current: "مجموعة من الأشخاص مجتمعين معاً في مكان واحد"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ومصاغ بلغة عربية فصيحة ومناسبة للمعنى."
  examples:
    per_lemma:
      - lemma: "تَجَمُّع"
        examples:
          - text: "تَفَرَّقَ التَّجَمُّعُ بَعْدَ انْتِهَاءِ الِاحْتِفَالِ."
            type: usage
      - lemma: "تَجَمْهُر"
        examples:
          - text: "حَاوَلَتِ الشُّرْطَةُ فَضَّ التَّجَمْهُرِ فِي السَّاحَةِ العَامَّةِ."
            type: usage
      - lemma: "حَشْد"
        examples:
          - text: "خَطَبَ الزَّعِيمُ فِي حَشْدٍ كَبِيرٍ مِنَ المُواطِنِينَ."
            type: usage
      - lemma: "جَمْع"
        examples:
          - text: "حَضَرَ حَفْلَ الزِّفَافِ جَمْعٌ مِنَ الأَهْلِ وَالأَصْدِقَاءِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَفَرَّقَ التَّجَمُّعُ بَعْدَ انْتِهَاءِ الِاحْتِفَالِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "حَاوَلَتِ الشُّرْطَةُ فَضَّ التَّجَمْهُرِ فِي السَّاحَةِ العَامَّةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "خَطَبَ الزَّعِيمُ فِي حَشْدٍ كَبِيرٍ مِنَ المُواطِنِينَ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "حَضَرَ حَفْلَ الزِّفَافِ جَمْعٌ مِنَ الأَهْلِ وَالأَصْدِقَاءِ."

