# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-06902380-n  |  ili: i72703
# المعنى: عرض خارجي مبهرج / a gaudy outward display
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث (بهرجة، تباهي، تفاخر) خالية من التشكيل الكامل"
      - "تباهي وتفاخر كلاهما على وزن تَفَاعُل الدالّ على المشاركة المتبادلة، وهو قد يتعارض مع دلالة التفاخر الأحادي الاتجاه الذي يعبّر عنه الـsynset"
      - "التعريف العربي «عرض خارجي مبهرج» فيه دوران: يستخدم «مبهرج» المشتقّ من جذر بهرج نفسه الذي تنتمي إليه لمّة «بهرجة»"
    observations: >
      المجموعة تعبّر عن مفهوم المظهرية والإفراط في التفاخر والعرض الزائف، مقابلاً للإنجليزية
      ostentation/fanfare/flash. بهرجة الأكثر دلالةً على المعنى المطلوب (العرض الخارجي الزائف
      المبهرج)، بينما تباهي وتفاخر يؤكدان بُعد التنافس الاجتماعي في الفخر. وإن كان وزن تَفَاعُل
      يفيد التبادل لغةً، فإن الاستخدام المعاصر أجاز «التباهي» و«التفاخر» دون اشتراط التبادل.
      التعريف الحالي يحتاج إعادة صياغة لإزالة الدوران مع إضافة الجنس القريب والفصل النوعي.
  blind_candidates:
    - lemma: "خُيَلَاء"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فُعَلاء من جذر خ-ي-ل، أصله اختيال الخيل في مشيتها (تلوُّن الحركة)، ثم
        نُقل إلى الكبر والعجب بالنفس. لفظ فصيح قديم ورد في القرآن الكريم، يحمل معنى التظاهر
        بالفضل وهو ضرب من الادعاء الخارجي الذي يلائم مفهوم الـsynset.
    - lemma: "صَلَف"
      generation_method: majaz
      justification: >
        أصله الأرض الصلبة القاحلة (الصَّلْفاء)، نُقل مجازاً إلى التمدُّح بما ليس عند المرء
        ومجاوزة قدر الظرف. المثل العربي «صلفٌ تحت الراعدة» يعكس فكرة العرض الصاخب الخالي
        من الجوهر، وهو جوهر «العرض الخارجي المبهرج». الوزن الصرفي (مصدر ثلاثي) يناسب الاسم الدالّ على الحال.
    - lemma: "زُخْرُف"
      generation_method: majaz
      justification: >
        أصله الذهب ثم كلّ زينة فائقة، يُستخدم مجازاً لكلّ مظهر براق زائف (كُلُّ مُمَوَّه مُزَوَّر
        في الصحاح). يحمل دلالة الإبهار الخارجي الخالي من الأصالة، وهو جوهر مفهوم «العرض الخارجي
        المبهرج». إحياء لهذا الاستخدام المجازي القرآني والتراثي.
    - lemma: "بَذَخ"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر ب-ذ-خ يدلّ على العلو والتعظم والافتخار. ورد في الحديث النبوي الشريف
        «أشراً وبطراً وبَذَخاً». يعبّر عن التفاخر الصارخ والتعاظم الخارجي بالمظهر والهيئة،
        وهو معنى يلتقي مع ostentation.


