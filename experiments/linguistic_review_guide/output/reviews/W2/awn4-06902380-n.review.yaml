stage3_analysis:
  per_lemma:
    - lemma: "بهرجة"
      decision: confirmed
      decision_reason: >
        لفظ فصيح مثبت في التراث العربي ومستخدم في العربية المعاصرة بمعنى العرض الخارجي الزائف
        المبالغ فيه. معجم الصواب صنّفه فصيحاً ووثّق ورود «البهرجة» في التاج بمعنى «العدول عن
        الجادة». في الاستخدام المعاصر يدلّ بوضوح على المظهرية الزائفة والبريق الكاذب. هو الأدقّ
        بين لمّات المجموعة في التعبير عن «gaudy display». غيابه عن إدخالات OCR للمعجم الوسيط
        والمعجم الكبير لا يُبطله، إذ يُثبت التاج والصواب وجوده.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        بهرجة تُركِّز على الجانب المادي البصري للعرض الزائف: البريق الخادع والطلاء الخارجي دون
        أصالة. هي الأقرب لـgaudy بالإنجليزية. تختلف عن تباهي (التنافس في إظهار المزايا) وعن
        تفاخر (الافتخار بالأصل والمأثر).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَهْرَجَة"

    - lemma: "تباهي"
      decision: confirmed
      decision_reason: >
        مصدر تَبَاهَى على وزن تَفَاعُل، ثابت في المعاجم الكلاسيكية والحديثة بمعنى التفاخر
        والتبجُّح. المورد الحديث يترجم «ostentation» بـ«تباهٍ» ضمن مرادفات. وإن كان الوزن
        يفيد التبادل لغةً، فإن «التباهي بـ» أصبح في العربية الحديثة دالاً على الإظهار الأحادي.
        الاستخدام فصيح ومنتشر في النصوص العربية المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَبَاهٍ يُركِّز على إظهار المرء لمزاياه الشخصية أو مقتنياته بغرض إبهار الآخرين أو
        التفوق عليهم، مع إيحاء بالتنافس الاجتماعي. يختلف عن بهرجة (الزيف المادي) وعن تفاخر
        (الافتخار بالأصل التاريخي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبَاهٍ"

    - lemma: "تفاخر"
      decision: confirmed
      decision_reason: >
        مصدر تَفَاخَر على وزن تَفَاعُل، راسخ في التراث العربي بمعنى التعاظم والفخر بالأصل
        والمأثر. المورد الحديث يضعه في مقدمة ترجمة «ostentation». المعاجم الكلاسيكية تجمع
        بين التعاظم وفخر كلٍّ على الآخر، والاستخدام المعاصر يقبل «التفاخر» دون اشتراط التبادل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَفَاخُر يُركِّز على الافتخار بالأصل والنسب والمأثر القديم (عَدُّ القديم بتعبير الجوهري)،
        وهو أكثر ارتباطاً بالبُعد التاريخي/الاجتماعي للفخر. يختلف عن بهرجة (البريق المادي الزائف)
        وعن تباهي (إظهار المزايا الحالية بقصد الإبهار).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَاخُر"

    - lemma: "خُيَلَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الخيلاء يدلّ على الكبر والعجب الباطنيين بالنفس «الكِبْرُ والإِعْجابُ بالنَّفْسِ»، وهو
        حالة داخلية من التصوُّر الزائد للذات. أما هذا الـsynset فيعبّر عن العرض الخارجي الظاهري
        المبهرج (gaudy outward display). الفرق بين الخيلاء (self-conceit داخلي) والتفاخر
        (outward display) فرق جوهري يجعل الخيلاء أبعد دلالةً عن الـsynset. فضلاً عن أن
        المجموعة لا تفتقر إلى لمّات.

    - lemma: "صَلَف"
      source: stage1
      decision: removed
      decision_reason: >
        الصلف يدلّ على التمدُّح بما ليس عند المرء ومجاوزة قدر الظرف مع تكبّر، وهو يقترب من
        المفهوم لكنه يختلف جوهرياً: يتعلق بـ«الادعاء بلا جوهر» (like thunder without rain) لا
        بـ«العرض الخارجي البراق». كما يحمل الصلف دلالة البرود العاطفي وعدم الحظوة (قلة الريع،
        قلة الحظوة عند الزوج) مما يُشتِّت دلالته. والمجموعة لا تفتقر إلى لمّات.

    - lemma: "زُخْرُف"
      source: stage1
      decision: removed
      decision_reason: >
        الزخرف اسمٌ لشيء مادي (ذهب، زينة، نقوش مموَّهة) وليس مصدراً لفعل أو عملية (عرض،
        تفاخر). الـsynset يعني فعل الإظهار/العرض، أما الزخرف فهو ما يُعرَض لا فعل العرض ذاته.
        فشل اختبار السكّ: «زخرف» يصف المادة الزائفة لا السلوك الادعائي.

    - lemma: "بَذَخ"
      source: stage1
      decision: removed
      decision_reason: >
        البذخ يدلّ أساساً على العلو والتعاظم والتطاول (loftiness/haughtiness)، وقد تطوّر في
        المعاجم الحديثة إلى «الترف والرفاهية» (luxury/extravagance). كلا المعنيين يختلف عن
        «العرض الخارجي المبهرج»: فالبذخ يعبّر عن حالة التعاظم أو نمط الحياة الترفي، لا عن فعل
        الإبهار والتفاخر بالمظهر. والمجموعة لا تفتقر إلى لمّات.


