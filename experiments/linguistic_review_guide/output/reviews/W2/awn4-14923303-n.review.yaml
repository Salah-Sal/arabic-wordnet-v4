# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (وسط) تفتقر للتشكيل الكامل."
      - "التعريف العربي مقتضب ويركز على الجانب الوظيفي (تحقيق شيء) دون الجانب الفيزيائي (الحيز/المادة الناقلة)."
    observations: "المفهوم يشير إلى 'Medium' بمعناه الفيزيائي والتقني، وهو الحيز أو المادة التي ينتقل عبرها أثر ما (كالموجات) أو تقع فيها عملية ما. المفهوم يجمع بين الحيز المكاني والمادة المادية."
  blind_candidates:
    - lemma: "وَسَط"
      generation_method: ishtiqaq
      justification: "اللفظ الأصيل والشائع للتعبير عن الحيز المادي الذي يتخلله شيء ما أو ينتقل فيه أثر."
    - lemma: "وَسِيط"
      generation_method: ishtiqaq
      justification: "يُستخدم تقنياً للتعبير عن المادة التي تعمل كحلقة وصل أو ناقل فاعل في عملية معينة."
    - lemma: "مَجَال"
      generation_method: majaz
      justification: "يُستخدم دلالياً للتعبير عن الحيز أو الوسط الذي يقع فيه الفعل أو تنتشر فيه القوة."
    - lemma: "بِيئَة"
      generation_method: majaz
      justification: "يعبر عن الوسط المحيط الذي يكتنف الكائن أو العملية من جميع الجوانب."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "وَسَط"
      confirm:
        - text: "«(في الفيزياء): الحيِّزُ الذى تعْمَلُ فيه أيَّةُ قوَّةٍ كهربائية أو مِغْنَطِيسِيّة أو جاذِبيّة وما إلَيْها»"
          source: "المعجم الكبير"
        - text: "«الوسط من الشَّيء: ما بين طرفيه وهو منه... (حي) محيط دائرة إقامة الإنسان، مجال نشاطه الحياتيّ، مجموع المؤثِّرات الخارجيَّة على كائن حيّ»"
          source: "المعجم الوسيط"
        - text: "«المادة المستخدمة في مرشح لتشكيل حاجز أمام مرور بعض المواد العالقة أو الجزيئات المنحلة»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
    - lemma: "وَسِيط"
      confirm:
        - text: "«يستخدم لتمييع اللون، كالزيوت والماء والورنيش»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
        - text: "«الوسيط في الأدب الرقمي قريب من وسط وجود العمل يسمح بإيصاله وجعله مرئيا، لكن أيضا تكوينه وتحوله.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«مادة مائعة ومُستقرة في نطاق درجة حرارة التشغيل، تمتص الحرارة في جزء من مجال المنظومة لتُطلقها في نطاقٍ جزء آخر.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
    - lemma: "مَجَال"
      expands:
        - text: "«المجال (في الفيزياء): الحيِّزُ الذى تعْمَلُ فيه أيَّةُ قوَّةٍ كهربائية أو مِغْنَطِيسِيّة أو جاذِبيّة وما إلَيْها»"
          source: "المعجم الكبير"
          addition: "يستخدم 'مجال' للتعبير عن الحيز (Field) أكثر من استخدامه للتعبير عن المادة (Medium)."
    - lemma: "بِيئَة"
      expands:
        - text: "«البيئة... كل ما يحيط بالكائن الحي من ظروف وعوامل تؤثر في شكله الخارجيّ وتركيبه الداخليّ»"
          source: "معجم الصواب اللغوي"
          addition: "تشير 'البيئة' إلى المفهوم الأشمل (Environment) وليس بالضرورة المادة الناقلة."

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "وسط"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والأكثر دقة في التعبير عن الوسط المادي والفيزيائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَسَط"
    - lemma: "وَسِيط"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني شائع في الكيمياء والفنون والاتصالات للتعبير عن المادة التي تقوم بدور الناقل أو المحرك للعملية (medium)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "وَسِيط", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14923303-n"}
    - lemma: "مَجَال"
      decision: removed
      decision_reason: "يرمز غالباً إلى 'Field' أو 'Range' ولا يعبر عن 'Substance' أو 'Medium' في سياقه الفيزيائي الدقيق."
    - lemma: "بِيئَة"
      decision: removed
      decision_reason: "تعني 'Environment' وهي أوسع دلالياً من المادة الوسيطة المحددة."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "مادة وسيطة يتم من خلالها تحقيق شيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحصر المفهوم في الجانب الوظيفي (تحقيق شيء) بينما المفهوم يشمل الجانب الفيزيائي (النقل والانتشار)."
    authored:
      - type: terminological
        text: "مَادَّةٌ أَوْ حَيِّزٌ مَادِيٌّ يَنْتَقِلُ فِيهِ أَثَرٌ فِيزِيَائِيٌّ (كَالصَّوْتِ أَوِ الضَّوْءِ) أَوْ تَتَحَقَّقُ مِنْ خِلَالِهِ عَمَلِيَّةٌ مَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14923303-n", definition_index: 0, text: "مَادَّةٌ أَوْ حَيِّزٌ مَادِيٌّ يَنْتَقِلُ فِيهِ أَثَرٌ فِيزِيَائِيٌّ (كَالصَّوْتِ أَوِ الضَّوْءِ) أَوْ تَتَحَقَّقُ مِنْ خِلَالِهِ عَمَلِيَّةٌ مَا."}
  examples:
    per_lemma:
      - lemma: "وَسَط"
        examples:
          - text: "يَنْتَقِلُ الصَّوْتُ فِي الْوَسَطِ الْهَوَائِيِّ بِسُرْعَةٍ مُعَيَّنَةٍ."
            type: usage
      - lemma: "وَسِيط"
        examples:
          - text: "يُعَدُّ الْمَاءُ وَسِيطاً مُمْتَازاً لِتَوْصِيلِ الْمَوَادِّ الْكِيمِيَائِيَّةِ لِلنَّبَاتَاتِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-14923303-n", text: "تَحْتَاجُ بَعْضُ التَّفَاعُلَاتِ الْكِيمِيَائِيَّةِ إِلَى وَسَطٍ حِمْضِيٍّ كَيْ تَتِمَّ."}

