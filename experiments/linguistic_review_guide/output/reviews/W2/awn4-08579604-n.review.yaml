stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي جيد ولكنه قد يشمل الكوكب المادي، بينما القصد هنا هو «المسكن» المقابل للعالم الآخر (الجنة أو النار)."
    observations: "المفهوم يشير إلى دار الحياة الدنيا التي يسكنها البشر مقارنة بالآخرة وما فيها من جنة ونار."
  blind_candidates:
    - lemma: "الدُّنْيَا"
      generation_method: majaz
      justification: "الدنيا في التصور الإسلامي والعربي هي دار الحياة الأولى التي تقابل الآخرة (التي فيها الجنة والنار)."
    - lemma: "العَالَم"
      generation_method: majaz
      justification: "تطلق على مكان عيش البشر أجمعين."
    - lemma: "دَار الفَنَاء"
      generation_method: tarkib
      justification: "مركب إضافي شهير يطلق على الأرض والحياة الدنيا بوصفها مؤقتة ومسكنا للبشر قبل الآخرة."
    - lemma: "الدَّار العَاجِلَة"
      generation_method: tarkib
      justification: "وصف للدنيا ومسكن البشر الحالي في مقابل الآجلة (الآخرة)."

stage2_evidence:
  per_lemma:
    - lemma: "الأرض"
      confirm:
        - text: "«(الأَرْض) أحد كواكب الْمَجْمُوعَة الشمسية وترتيبه الثَّالِث فِي فلكه حول الشَّمْس وَهُوَ الْكَوْكَب الَّذِي نسكنه والجزء مِنْهُ»"
          source: "المعجم الوسيط"
        - text: "«(مؤنثة) : أحد كواكب المجموعة الشمسية ... أطلقت فى القرآن على أرض الجنة»"
          source: "المعجم الكبير"
    - lemma: "الدُّنْيَا"
      confirm:
        - text: "«نَقِيضُ الآخِرَةِ, وهو اسْمٌ لِهذه الحياةِ التى نَحْياها؛ لِبُعْد الآخِرَة عنها.»"
          source: "المعجم الكبير"
        - text: "«الحياة الحاضرة . ويقال : هو يعيش في دنيا الأحلام»"
          source: "المعجم الوسيط"
    - lemma: "العَالَم"
      expands:
        - text: "«(الْعَالم) الْخلق كُله وَقيل كل مَا حواه بطن الْفلك»"
          source: "المعجم الوسيط"
          addition: "يدل على مطلق الوجود المادي وليس بالضرورة مسكن البشر فقط."
    - lemma: "دَار الفَنَاء"
      confirm:
        - text: "«دار الفناء: الدنيا.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "الدَّار العَاجِلَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الأَرْض"
      decision: confirmed
      decision_reason: "كلمة أصيلة وشائعة للدلالة على عالم البشر المادي مقابل السماء أو العالم الآخر الميتافيزيقي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الأَرْض"

    - lemma: "الدُّنْيَا"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح أساسي في الثقافة العربية والإسلامية للدلالة على العالم الذي نعيش فيه الآن على النقيض من الجنة والنار."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "الدُّنْيَا", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "العَالَم"
      source: stage1
      decision: removed
      decision_reason: "أعم من مفهوم الأرض بوصفها مسكن البشر، حيث يشمل الكون بأسره والخلائق كلها بما فيها الملائكة والجن والمجرات."

    - lemma: "دَار الفَنَاء"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير تركيبي اصطلاحي ثابت (مركب إضافي) يُستخدم بوضوح ومباشرة للدلالة على هذا المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "دَار الفَنَاء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "الدَّار العَاجِلَة"
      source: stage1
      decision: removed
      decision_reason: "وإن كانت صحيحة، إلا أن 'الدنيا' و'دار الفناء' يفيان بالغرض وهي أقل شيوعاً كمسكن."

stage4_content:
  definition:
    current: "مسكن البشر (على النقيض من الجنة أو النار)"
    assessment:
      decision: retain
      reason: "التعريف دقيق ومناسب ويوضح القصد من الكلمة في هذا السياق (مقابل الجنة والنار)."
  examples:
    per_lemma:
      - lemma: "الأَرْض"
        examples:
          - text: "عاش طوال حياته على هذه الأرض يعمل بجد."
            type: usage
      - lemma: "الدُّنْيَا"
        examples:
          - text: "وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا مَتَاعُ الْغُرُورِ"
            type: quran
            source: "القرآن الكريم"
      - lemma: "دَار الفَنَاء"
        examples:
          - text: "أدرك أن الدنيا دار فناء فعمل لآخرته."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "عاش طوال حياته على هذه الأرض يعمل بجد."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا مَتَاعُ الْغُرُورِ"}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أدرك أن الدنيا دار فناء فعمل لآخرته."}

stage5_enrichment:
  per_entry:
    - lemma: "الأَرْض"
      entry_id: "{auto}"
      root: "ارض"
      maqayis_quote: "«الْهَمْزَةُ وَالرَّاءُ وَالضَّادُ ثَلَاثَةُ أُصُولٍ ... وَأَمَّا الْأَصْلُ الْأَوَّلُ فَكُلُّ شَيْءٍ يَسْفُلُ وَيُقَابِلُ السَّمَاءَ ... وَالْأَرْضُ: الَّتِي نَحْنُ عَلَيْهَا»"
    - lemma: "الدُّنْيَا"
      entry_id: "{auto}"
      root: "دنو"
      maqayis_quote: "«الدَّالُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يُقَاسُ بَعْضُهُ عَلَى بَعْضٍ، وَهُوَ الْمُقَارَبَةُ ... وَسُمِّيَتِ الدُّنْيَا لِدُنُوِّهَا»"
    - lemma: "دَار الفَنَاء"
      entry_id: "{auto}"
      roots:
        - word: "دار"
          root: "دور"
          maqayis_quote: "«الدَّالُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِحْدَاقِ الشَّيْءِ بِالشَّيْءِ مِنْ حَوَالَيْهِ ... وَالدَّارُ أَصْلُهَا الْوَاوُ»"
        - word: "الفناء"
          root: "فني"
          maqayis_quote: "«الْفَاءُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ. هَذَا بَابٌ لَا تَنْقَاسُ كَلِمُهُ ... فَنِيَ يَفْنَى فَنَاءً، وَاللَّهُ - تَعَالَى - أَفْنَاهُ، وَذَلِكَ إِذَا انْقَطَعَ»"
  per_sense:
    - lemma: "الأَرْض"
      sense_id: "{auto}"
      nuance: "تركز على الجانب المكاني والمادي لمسكن البشر المتميز عن السماء."
      mwe: false
    - lemma: "الدُّنْيَا"
      sense_id: "{auto}"
      nuance: "تركز على الحياة الزمنية الحاضرة والموطن الفاني مقابل الآخرة."
      mwe: false
    - lemma: "دَار الفَنَاء"
      sense_id: "{auto}"
      nuance: "تعبير أدبي وديني يبرز زوال هذا المسكن وعدم خلوده."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ارض","maqayis":"«الْهَمْزَةُ وَالرَّاءُ وَالضَّادُ ثَلَاثَةُ أُصُولٍ ... وَأَمَّا الْأَصْلُ الْأَوَّلُ فَكُلُّ شَيْءٍ يَسْفُلُ وَيُقَابِلُ السَّمَاءَ ... وَالْأَرْضُ: الَّتِي نَحْنُ عَلَيْهَا»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دنو","maqayis":"«الدَّالُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يُقَاسُ بَعْضُهُ عَلَى بَعْضٍ، وَهُوَ الْمُقَارَبَةُ ... وَسُمِّيَتِ الدُّنْيَا لِدُنُوِّهَا»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"دار","root":"دور","maqayis":"«الدَّالُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِحْدَاقِ الشَّيْءِ بِالشَّيْءِ مِنْ حَوَالَيْهِ ... وَالدَّارُ أَصْلُهَا الْوَاوُ»"},{"word":"الفناء","root":"فني","maqayis":"«الْفَاءُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ. هَذَا بَابٌ لَا تَنْقَاسُ كَلِمُهُ ... فَنِيَ يَفْنَى فَنَاءً، وَاللَّهُ - تَعَالَى - أَفْنَاهُ، وَذَلِكَ إِذَا انْقَطَعَ»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تركز على الجانب المكاني والمادي لمسكن البشر المتميز عن السماء.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تركز على الحياة الزمنية الحاضرة والموطن الفاني مقابل الآخرة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبير أدبي وديني يبرز زوال هذا المسكن وعدم خلوده.","mwe":true}'
    - command: set_metadata
