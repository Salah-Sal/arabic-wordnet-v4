        - text: "«الآثار: هي اللوازم المعللة بالشيء»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الآثار في الاصطلاح الفقهي والفلسفي تدلّ على اللوازم والنتائج لا على الأعمال المؤلَّفة"
        - text: "«الآثار: جمع الأثر... الأخبار مرفوعة إلى الشارع والآثار إلى الصحابة»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "الآثار في الحديث تخصّ أقوال الصحابة لا مؤلفات الكتّاب"
        - text: "«علم الآثار: مصطلح معناه معرفة القديم أو علم الوثائق القديمة»"
          source: "المعجم الوسيط"
          conflict: "الآثار في الاستعمال الحديث تغلب عليها دلالة الآثار القديمة (archaeology)"
