        - text: "«المؤلَّف: الكتاب يدوَّن فيه علم أو أدب أو فن»"
          source: "المعجم الوسيط"
        - text: "«المُؤَلَّف: الكتاب يُدَوَّن فيه علم أو أدبٌ أو فن»"
          source: "المعجم الكبير"
        - text: "«مؤلفات، أعمال — works»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«مؤلف — opus»"
          source: "مسرد الفن والتسلية والرياضة (ALECSO)"
      expands:
        - text: "«(1) الأعمال الكاملة [لكاتب أو فنّان] (2) الأثر الفنّيّ: أيّ من آثار الكاتب أو الفنّان»"
          source: "المورد الحديث (oeuvre)"
          addition: "الترجمة الإنجليزية oeuvre تقابل الأعمال الكاملة/المؤلفات"
    - lemma: "مُصَنَّفَات"
      confirm:
        - text: "«مُصَنَّف: من (ص ن ف) الكتاب المؤلَّف»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«مصنفات رقمية — digital works»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«مصنفات (ال...): قائمة الأغاني والمسرحيات والمعزوفات التي وضعها فنان — repertory»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
      expands:
        - text: "«المُصَنِّفُ: المُؤَلِّفُ (الكتاب). يقال: هذا مُصَنَّفٌ في البلاغة أو النحو أو غير ذلك»"
          source: "المعجم الكبير"
          addition: "المصنَّف مرادف للمؤلَّف في الاستخدام المعجمي"
    - lemma: "تَآلِيف"
