stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (كتابات، مؤلفات) بدون تشكيل كامل"
      - "اللمّتان بصيغة الجمع فقط وهو ما يتّسق مع ملاحظة التعريف (عادة بصيغة الجمع)"
      - "التعريف العربي مقتضب ويمكن تحسينه ليكون أكثر دقة معجمية"
    observations: "المجموعة تدلّ على مفهوم أدبي واضح: مجموع ما ألّفه كاتب أو عالم من أعمال مكتوبة. المفهوم راسخ في الثقافة العربية إذ دأب العلماء على إحصاء مؤلفات بعضهم. يندرج تحت التواصل الكتابي (اللغة المكتوبة) بوصفه ناتجاً لفعل الكتابة والتأليف."
  blind_candidates:
    - lemma: "مُصَنَّفَات"
      generation_method: ishtiqaq
      justification: "جمع مُصَنَّف من الجذر (صنف) على وزن مُفَعَّل، يدلّ على الكتاب المؤلَّف المُرتَّب في أصناف. شائع في التراث الإسلامي: مصنّفات الإمام النووي، مصنّفات ابن تيمية."
    - lemma: "تَآلِيف"
      generation_method: ishtiqaq
      justification: "جمع تأليف من الجذر (ألف)، يدلّ على ما ألّفه المؤلف من كتب. مستعمل في عبارات مثل: تآليف ابن خلدون كثيرة."
    - lemma: "آثَار"
      generation_method: majaz
      justification: "جمع أثر بمعنى ما تركه الشخص وراءه، نُقل مجازاً إلى ما خلّفه المؤلف من أعمال فكرية. يُستخدم في: آثار طه حسين الأدبية."
    - lemma: "تَصَانِيف"
      generation_method: ishtiqaq
      justification: "جمع تصنيف من الجذر (صنف)، بمعنى ما صنّفه العالم من كتب. شائع في كتب التراجم: وله تصانيف كثيرة في الفقه والحديث."

stage2_evidence:
  per_lemma:
    - lemma: "كِتَابَات"
      confirm:
        - text: "«الكتابة: يقال في عرف الأدباء لإنشاء النثر»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«(الكِتَابَة) صناعة الكاتب»"
          source: "المعجم الوسيط"
        - text: "«(1) كتابة (2) خطّ (3) رسالة؛ مذكِّرة (4) كتاب؛ مؤلَّف... (9) صناعة الكتابة أو التأليف»"
          source: "المورد الحديث"
      expands:
        - text: "«كتابات جدارية: تدوين خطي أو رسم مصبوغ أو منحوت في سند لم يُسخَّر في الأصل لهذا الغرض»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "كتابات بصيغة الجمع مستعملة في سياقات اصطلاحية متنوعة"
        - text: "«كِتاباتٌ طِبِّيَّةٌ تُراثِيَّة»"
          source: "المعجم الطبي الموحد"
