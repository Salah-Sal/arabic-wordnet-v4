stage3_analysis:
  per_lemma:
    - lemma: "كِتَابَات"
      decision: confirmed
      decision_reason: "جمع كتابة بمعنى ما كُتب، مثبتة في المعاجم الحديثة والاصطلاحية. الجرجاني يخصّ الكتابة بإنشاء النثر في عرف الأدباء، والمعجم الوسيط يعرّفها بصناعة الكاتب. صيغة الجمع كتابات شائعة في الاستعمال المعاصر للدلالة على مجموع ما كتبه مؤلف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "كتابات أعمّ دلالةً من مؤلفات، إذ تشمل كل ما خطّه الكاتب من نثر ومقالات ورسائل ونصوص، سواء أكانت كتباً مستقلة أم لا."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِتَابَات"

    - lemma: "مُؤَلَّفَات"
      decision: confirmed
      decision_reason: "جمع مؤلَّف المعرَّف في المعجم الوسيط والمعجم الكبير بأنه الكتاب الذي يُدوَّن فيه علم أو أدب أو فن. مؤلفات ترجمة مباشرة لـ works/oeuvre. مثبتة في مسرد الإعلام والتواصل بمقابل works."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مؤلَّفات أخصّ من كتابات، تدلّ على الكتب والأعمال الأدبية أو العلمية المستقلة التي بذل مؤلفها جهداً في تأليفها وترتيبها، دون المقالات القصيرة والرسائل."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُؤَلَّفَات"

    - lemma: "مُصَنَّفَات"
      source: stage1
      decision: confirmed
      decision_reason: "جمع مصنَّف وهو مرادف للمؤلَّف في المعاجم العربية. مثبتة في موسوعة السلطان قابوس ومسارد أليكسو. شائعة في كتب التراجم والطبقات للدلالة على أعمال العالم المؤلَّفة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصنَّفات تركّز على الترتيب والتبويب في أصناف، وتغلب على الأعمال العلمية والفقهية والحديثية المبوّبة على أبواب، أكثر من الأعمال الأدبية الإبداعية."
      actions:
        - command: create_entry
          params:
            lemma: "مُصَنَّفَات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَآلِيف"
      source: stage1
      decision: removed
      decision_reason: "تأليف في المعاجم الاصطلاحية يركّز على فعل الجمع والتركيب أكثر من الناتج. كما أنّ له معنى موسيقياً (تركيب النغمات) مما يُحدث اشتراكاً لفظياً. الجمع تآليف أقلّ شيوعاً من مؤلفات ومصنفات للدلالة على أعمال المؤلف."

    - lemma: "آثَار"
      source: stage1
      decision: removed
      decision_reason: "آثار شديدة الاشتراك اللفظي: الآثار القديمة (archaeology)، أقوال الصحابة (الحديث)، اللوازم المعلَّلة (الفلسفة)، الأثر الفنّي. لا تتخصّص بمعنى الأعمال المؤلَّفة إلا في سياق مقيَّد (آثار أدبية)، مما يجعلها غير صالحة لمّةً مستقلة في هذه المجموعة."

    - lemma: "تَصَانِيف"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية مباشرة لهذه الصيغة. وإن كانت تُستعمل في كتب التراجم (وله تصانيف كثيرة)، فإنّ مُصنَّفات أكثر تثبيتاً معجمياً وأشيع استعمالاً في المصادر الحديثة."

