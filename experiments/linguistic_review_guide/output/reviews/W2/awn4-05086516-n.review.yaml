stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمة واحدة فقط."
      - "مفهوم 'الجنوبية' كخاصية مجردة (southernness) هو مفهوم اصطلاحي حديث نسبياً في العربية، وغالباً ما يُستخدم الوصف المباشر بدلاً منه."
    observations: "اللمة الموجودة 'جنوبية' صحيحة صرفياً كاسم تجريدي مشتق من النسبة (جنوبي)، وهي تقابل بدقة المصطلح الإنجليزي 'southernness'."
  blind_candidates:
    - lemma: "جَنُوبِيَّةٌ"
      generation_method: ishtiqaq
      justification: "الاسم التجريدي القياسي المشتق من 'جنوبي' للدلالة على الصفة أو الخاصية."
    - lemma: "الطَّابَعُ الجَنُوبِيُّ"
      generation_method: tarkib
      justification: "تعبير مركب يستخدم للدلالة على الخصائص الملازمة للجهة الجنوبية."
    - lemma: "النَّزْعَةُ الجَنُوبِيَّةُ"
      generation_method: tarkib
      justification: "تعبير يستخدم أحياناً في السياقات الثقافية أو السياسية للدلالة على التوجه أو الخاصية الجنوبية."
    - lemma: "جَنُوبِيَّةُ المَوْقِعِ"
      generation_method: tarkib
      justification: "تعبير وصفي دقيق للخاصية المكانية المطلوبة."

stage2_evidence:
  per_lemma:
    - lemma: "جَنُوبِيَّةٌ"
      expands:
        - text: "«... 6 أقطاب شمالية، و6 أقطاب جنوبية ...»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
          addition: "يؤكد استخدام 'جنوبية' كوصف للموقع والاتجاه، وإن ورد هنا كنعت وليس كاسم مجرد."
    - lemma: "جَنُوبِيٌّ"
      confirm:
        - text: "«(جنوبي): تقع أسوان جنوب مصر [فصيحة] - تقع أسوان جنوبيّ مصر [فصيحة]»"
          source: "معجم الصواب اللغوي"
    - lemma: "جَنب"
      confirm:
        - text: "«(جَنَبَ) الْجِيمُ وَالنُّونُ وَالْبَاءُ أَصْلَانِ مُتَقَارِبَانِ أَحَدُهُمَا: النَّاحِيَةُ، وَالَآخَرُ الْبُعْدُ... وَمِمَّا شَذَّ عَنِ الْبَابِ رِيحُ الْجَنُوبِ.»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "جَنُوبِيَّة"
      decision: confirmed
      decision_reason: "اللمة صحيحة تماماً وتمثل المقابل الدقيق للمفهوم المجرد 'southernness' في السياقات العلمية والجغرافية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَنُوبِيَّةٌ"
    - lemma: "جَنُوبِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تكرار للمة الموجودة مع إضافة التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
    - lemma: "الطَّابَعُ الجَنُوبِيُّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح ثقافي/وصفي أكثر منه خاصية مكانية مجردة."
    - lemma: "النَّزْعَةُ الجَنُوبِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح سياقي لا يصلح كمرادف عام للخاصية المكانية."
    - lemma: "جَنُوبِيَّةُ المَوْقِعِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي مركب، والكلمة المفردة 'جنوبية' تغني عنه."

stage4_content:
  definition:
    current: "خاصية الوجود باتجاه الجنوب"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق لكن يمكن صياغته بأسلوب معجمي أكثر رصانة."
    authored:
      - type: terminological
        text: "صِفَةُ كَوْنِ الشَّيْءِ أَوْ المَكَانِ جَنُوبِيَّاً أَوْ وَاقِعَاً فِي جِهَةِ الجَنُوبِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صِفَةُ كَوْنِ الشَّيْءِ أَوْ المَكَانِ جَنُوبِيَّاً أَوْ وَاقِعَاً فِي جِهَةِ الجَنوبِ."
  examples:
    per_lemma:
      - lemma: "جَنُوبِيَّة"
        examples:
          - text: "تَتَمَيَّزُ بَعْضُ المَنَاطِقِ بِجَنُوبِيَّتِهَا المَلْحُوظَةِ مَا يَجْعَلُهَا أَكْثَرَ عُرْضَةً لِلرِّيَاحِ المَوْسِمِيَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تَتَمَيَّزُ بَعْضُ المَنَاطِقِ بِجَنُوبِيَّتِهَا المَلْحُوظَةِ مَا يَجْعَلُهَا أَكْثَرَ عُرْضَةً لِلرِّيَاحِ المَوْسِمِيَّةِ."

stage5_enrichment:
  per_entry:
    - lemma: "جَنُوبِيَّة"
      entry_id: "{auto}"
      root: "جنب"
      maqayis_quote: "«الْجِيمُ وَالنُّونُ وَالْبَاءُ أَصْلَانِ مُتَقَارِبَانِ أَحَدُهُمَا: النَّاحِيَةُ، وَالَآخَرُ الْبُعْدُ... وَمِمَّا شَذَّ عَنِ الْبَابِ رِيحُ الْجَنُوبِ.»"
  per_sense:
    - lemma: "جَنُوبِيَّة"
      sense_id: "{auto}"
      nuance: "تعبر عن الخاصية المكانية المجردة للشيء من حيث انتماؤه لجهة الجنوب."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جنب","maqayis":"«الْجِيمُ وَالنُّونُ وَالْبَاءُ أَصْلَانِ مُتَقَارِبَانِ أَحَدُهُمَا: النَّاحِيَةُ، وَالَآخَرُ الْبُعْدُ... وَمِمَّا شَذَّ عَنِ الْبَابِ رِيحُ الْجَنُوبِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبر عن الخاصية المكانية المجردة للشيء من حيث انتماؤه لجهة الجنوب.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
