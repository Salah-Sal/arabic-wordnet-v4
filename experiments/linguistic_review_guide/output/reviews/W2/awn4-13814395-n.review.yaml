# ── المرحلة ١: المراجعة والتوليد (أعمى — بدون أدلة) ──────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي وصفي مقبول لكنه يفتقر إلى الجنس القريب الصريح؛ يمكن تحويله إلى صياغة اصطلاحية أدق"
      - "اللمّتان الحاليتان (تَحَالُف ورَابِطَة) تُغطيان جانبَي 'المصلحة المشتركة' و'الوصلة العامة'، لكن يغيب مصطلح يُعبّر عن الرابط القائم على القرابة والرحم تحديداً"
      - "تَحَالُف لفظ يوحي أولاً بالتحالف السياسي/القبلي، ويقل استخدامه للدلالة على روابط الزواج والقرابة"
    observations: "المجموعة تدور حول مفهوم 'الرابط الجامع' بمستوياته الثلاثة: النسب والمصاهرة والمصلحة. المفهوم أصيل في الثقافة العربية وله تعبيرات كلاسيكية راسخة (وشائج الرحم، حِلف القبيلة، رابطة الأخوة). التحدي هو اختيار لمّات تُغطي الطيف الدلالي الكامل دون أن تكون مقيّدة بسياق واحد (سياسي أو نسبي فقط)"
  blind_candidates:
    - lemma: "وَشِيجَة"
      generation_method: majaz
      justification: "إحياء للفظ كلاسيكي عريق من الجذر وشج بمعنى 'الاشتباك والتداخل'؛ يُستخدم مجازاً في سياق قرابة الرحم المتشعبة. يقول العرب 'رحم واشجة' و'وشائج النسب'، مما يجعله مرشحاً طبيعياً للدلالة على الاتصال القائم على القرابة الوثيقة"
    - lemma: "صِلَة"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر وصل على وزن فِعْلَة، يدل على الوصل والتواصل والقرابة. يُقال 'صلة الرحم' دلالةً على رابطة القرابة، وهو مصطلح قرآني وحديثي شائع يشمل الوصل بالأسرة والمجتمع"
    - lemma: "حِلْف"
      generation_method: majaz
      justification: "لفظ كلاسيكي يدل على التعاهد القائم على المصلحة المشتركة والنصرة المتبادلة؛ يُغطي الجانب الثالث من التعريف (المصلحة المشتركة). يقال 'حِلف القبائل' للدلالة على الاتحاد القائم على التعاهد"
    - lemma: "رَابِط"
      generation_method: ishtiqaq
      justification: "اسم فاعل من ربط على وزن فَاعِل، توليد اشتقاقي مُذكَّر للدلالة على ما يربط بين الأشخاص. اشتُقّ كبديل مذكر لرابطة"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1 — مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات + صيغ ال-)
#   Q2 — جسر إنجليزي: alliance, bond, affinity
#   Q3 — FTS عربي: قرابة، مصاهرة، تحالف، رابطة، المصلحة المشتركة
#   Q4 — إثراء (أمثلة) بالمعرّفات المستخرجة
#   Q5 — مقاييس اللغة لجذور: حلف، ربط، وشج
stage2_evidence:
  per_lemma:

    - lemma: "تَحَالُف"
      confirm:
        - text: "«تحالُف، مصاهرة» بما يقابل alliance في القانون الدولي"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
        - text: "«التَّحالُفُ: أَن يحلف كل من الْمُتَعَاقدين أَو الْوَارِث»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani_20)"
      expands:
        - text: "«تَحالَفَ القَوْمُ: تعاهَدُوا وتقاسَمُوا على النُّصْرَةِ»"
          source: "المعجم الكبير لمجمع اللغة العربية (OCR)"
          addition: "الصيغة الفعلية (تَحالَفَ) تؤكد المعنى الجذري، ومصدرها تَحَالُف هو اللمّة الواردة في AWN4"
        - text: "«الحلف: العهد بين القوم، والمحالفة المعاهدة والملازمة...وتحالفا تعاهدا على أن يكون أمرهما واحدا في النصرة والحماية»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani_22)"
          addition: "يوضّح المعنى الجذري للتحالف: التعاهد المتبادل على الولاء والنصرة"

    - lemma: "رَابِطَة"
      confirm:
        - text: "«الرَّابِطةُ: العلاقة والوصلة بين الشيئين؛ الجماعة يجمعهم أمر يشتركون فيه (محدثة)»"
          source: "المعجم الوسيط لمجمع اللغة العربية (OCR)"
        - text: "«الرابطة: العلاقة والوصلة بين الشيئين ومن الدواب ونحوها المربوطة والجماعة يجمعهم أمر يشتركون فيه (محدثة) (ج) روابط»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35)"
        - text: "«رابطة» = alliance في مجال علم الأحياء"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM"
        - text: "«الرَّابِطَةُ: العُلْقَةُ والوُصْلَةُ بين الشَّيْئَيْنِ؛ الجَماعَةُ المُرابِطَةُ»"
          source: "المعجم الكبير لمجمع اللغة العربية (OCR)"
      expands:
        - text: "«الرابطة: اللَّفْظَة الدَّالَّة على نِسْبَة ارتباط المَحْمُول بالموضوع» (في المنطق)"
          source: "معجم مقاليد العلوم للسيوطي (hawramani_20)"
          addition: "استخدام منطقي مختلف (الرابطة المنطقية)؛ يُشير إلى أن اللمة متعددة الاستخدام بحسب السياق"
        - text: "«الرّابطة في اصطلاح الشّطّارين: هو المرشد الكامل الذي يربط المسترشد بالحقّ تعالى»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (hawramani_24)"
          addition: "استخدام صوفي خاص؛ السياق المعجمي الإيجابي هو 'العلاقة والوصلة' لا الاستخدام المنطقي أو الصوفي"

    - lemma: "وَشِيجَة"
      confirm:
        - text: "«بينهم واشجة رحم ووشائج النسب... ووشجت القرابات بيننا واشجات / محكمات القوى بعقدٍ شديد»"
          source: "أساس البلاغة للزمخشري (hawramani)"
        - text: "«وَشِيجَة [مفرد] ج وشائِجُ: (1) واشجة؛ قرابة متصلة مشتبكة 'رحم وشيجة' (2) رباط؛ علاقة 'وشِيجة المحبَّة'»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (hawramani)"
        - text: "«الوشيجة: اشتباك القرابة والتفافها؛ والواشجة والوشيجة: الرحم المشتبكة المتصلة»"
          source: "القاموس المحيط للفيروزآبادي (hawramani)"
        - text: "«الوشيجة: عرق الشجرة والقرابة المشتبكة المتصلة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35)"
        - text: "«رحم واشجة ووشيجة: مشتبكة متصلة. وقد وشجت بك قرابة فلان. تمُتّ بأرحام إليك وشيجة / ولا قُرب بالأرحام ما لم تُقرَّب»"
          source: "لسان العرب لابن منظور (hawramani)"
      expands:
        - text: "«الواو والشين والجيم: كلمة تدل على اشتباك وتداخل. يقال: وشجت الأغصان: اشتبكت. وكل شيء اشتبك فهو واشج»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: "الجذر وشج يدل على التداخل والاشتباك، وبالمجاز على اشتباك القرابة والتفافها؛ وهذا يتناسب تماماً مع الاتصال القائم على القرابة"

    - lemma: "صِلَة"
      confirm:
        - text: "«الصلة في اللغة الفارسية بمعنى: الاتصال، والوصل، والقرابة، والهدية، والعطية»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (hawramani_24)"
      contradicts:
        - text: "«الصلة: البر على غير جهة التعويض»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani_22)"
          conflict: "التعريف المعجمي المحوري للصلة في المعاجم الكلاسيكية هو 'البر والعطاء' لا 'الرابطة'؛ وإن كانت 'صلة الرحم' تعني الحفاظ على القرابة، إلا أن اللمة بمفردها تُوحي بالعطاء لا بالرابطة"

    - lemma: "حِلْف"
      confirm:
        - text: "«الحِلف: المعاهدة على التعاضد والتساعد والاتفاق»"
          source: "المعجم الوسيط لمجمع اللغة العربية (OCR)"
        - text: "«الحلف: العهد بين القوم، والمحالفة: المعاهدة والملازمة»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani_22)"
      contradicts:
        - text: "«الحلف: يمين يؤخذ بها العقد ثم سمِّي به كل يمين»"
          source: "التعريفات الفقهيّة للبركتي (hawramani_27)"
          conflict: "الاستخدام الفقهي للحِلف يتمحور حول القسم واليمين، لا الرابطة الإنسانية. والمعنى مقتصر على التحالف القائم على التعاهد والمصلحة، دون تغطية القرابة أو المصاهرة"

    - lemma: "رَابِط"
      contradicts:
        - text: "«الرَّابطُ: رابط الجأش: شجاع قوىُّ القلب؛ نفسٌ رابط: واسع عريض»"
          source: "المعجم الوسيط لمجمع اللغة العربية (OCR)"
          conflict: "الرابط (المذكر) في المعاجم لا يُستخدم بمعنى 'الرابطة/الصلة' بل هو صفة مشبهة من رَبَطَ بمعنى الشجاعة وثبات القلب"
        - text: "«الرَّابِطُ: الرَّاهِبُ والزّاهِدُ والحكيمُ الذى كَفَّ نَفْسَه عَن الدنيا»"
          source: "المعجم الكبير لمجمع اللغة العربية (OCR)"
          conflict: "المعنى الثاني للرابط في المعجم الكبير هو الزاهد المتعبد، لا أي صلة بمفهوم الاتصال أو الرابطة"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تَحَالُف"
      decision: confirmed
      decision_reason: "مصدر الفعل تَفَاعَلَ من الجذر ح-ل-ف، راسخ في المعجم العربي الكلاسيكي والمعاصر بمعنى 'التعاهد المتبادل والاتحاد على المصلحة المشتركة'. موثّق في ARABTERM للقانون الدولي (= alliance). يُغطي الجانب الثالث من تعريف المجموعة (المصلحة المشتركة). التشكيل صحيح في AWN4"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الاتحاد الرسمي القائم على التعاهد والتقاسم المتبادل للمصلحة والنصرة؛ يوحي بالرسمية والالتزام المتبادل أكثر من مجرد الصلة العاطفية أو الرحمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحَالُف"

    - lemma: "رَابِطَة"
      decision: confirmed
      decision_reason: "لمة مُثبتة بقوة في المعجم المعاصر والكلاسيكي: 'العلاقة والوصلة بين الشيئين'. تُغطي الدلالة العامة للاتصال بجميع أنواعه (قرابة وزواج ومصلحة). الأشمل دلالياً بين لمّات المجموعة. التشكيل صحيح في AWN4"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعم دلالةً وأشمل وصفاً للرابط بوجه عام سواء كان رابط نسب أو زواج أو مصلحة أو عاطفة أو مؤسسة جامعة؛ لا يحمل ضرورةً الإيحاء بالتعاهد الرسمي الذي يحمله تَحَالُف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَابِطَة"

    - lemma: "وَشِيجَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ كلاسيكي عريق موثّق في أمهات المعاجم (لسان العرب، القاموس المحيط، أساس البلاغة، معجم اللغة العربية المعاصرة). يُعبّر تحديداً عن 'القرابة المشتبكة المتصلة' (رحم واشجة، وشائج النسب) وهو ما يُضيف نوعاً خاصاً لم تغطّه لمّتا المجموعة. اجتاز اختبار التثبيت المعجمي: مسجّل في معاجم متعددة. اجتاز اختبار السك: وشيجة رحم ≠ صلة رحم ≠ رابطة رحم (كل منها يحمل ظلالاً دلالية مختلفة)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبّر عن الرابط العضوي العميق المتشعّب، كتشابك عروق الشجرة؛ يُوحي بعمق الصلة ورسوخها ولاسيما في القرابة والرحم، ويُضيف بُعداً طبيعياً/عضوياً للاتصال لا تُعطيه رَابِطَة ولا تَحَالُف"
      actions:
        - command: create_entry
          params:
            lemma: "وَشِيجَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13814395-n"

    - lemma: "صِلَة"
      source: stage1
      decision: removed
      decision_reason: "رغم أن 'صلة الرحم' تعبير اصطلاحي قرآني وحديثي راسخ، فإن اللمة صِلَة بمفردها في المعاجم الكلاسيكية تعني أولاً 'البر والعطاء على غير جهة التعويض'، مما يُفضي إلى التباس دلالي مع تعريف المجموعة الذي يدور حول 'الاتصال والرابطة'. الأدلة مختلطة وتشير إلى سياق مختلف للمعنى المحوري"

    - lemma: "حِلْف"
      source: stage1
      decision: removed
      decision_reason: "الحِلف يُغطي جانب 'المصلحة المشتركة' فحسب، وهو مُغطّى بالفعل من تَحَالُف الذي هو مشتق من نفس الجذر. علاوة على ذلك، الحِلف في السياق الفقهي يتضمن معنى القسم واليمين مما يُبعده عن التعبير العام عن الرابط الإنساني المحوري في هذه المجموعة"

    - lemma: "رَابِط"
      source: stage1
      decision: removed
      decision_reason: "مُعارَض بصراحة في المعاجم الكبرى: الرابط (المذكر) يعني 'رابط الجأش' (شجاع ثابت القلب) أو 'الزاهد المتعبد'، لا الرابط/الصلة بين أشخاص. المعنى المطلوب تُؤدّيه رَابِطَة (المؤنثة) المُثبتة بالفعل في المجموعة"


