# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    - lemma: "انْعِدَامُ الْقِيمَة"
      entry_id: "{auto}"
      roots:
        - word: "انعدام"
          root: "عدم"
          maqayis_quote: "«الْعَيْنُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى فُقْدَانِ الشَّيْءِ وَذَهَابِهِ. مِنْ ذَلِكَ الْعَدَمُ. وَعَدِمَ فُلَانٌ الشَّيْءَ إِذَا فَقَدَهُ.»"
        - word: "القيمة"
          root: "قوم"
          maqayis_quote: "جذر ق-و-م: يدل على الاستقامة والنهوض. القيمة مشتقة منه بمعنى ما يقوم به الشيء ويُقدَّر به."

    - lemma: "تَفَاهَة"
      entry_id: "{auto}"
      root: "تفه"
      maqayis_quote: "«التَّاءُ وَالْفَاءُ وَالْهَاءُ أَصْلٌ وَاحِدٌ وَهُوَ قِلَّةُ الشَّيْءِ. يُقَالُ تَفِهَ الشَّيْءُ فَهُوَ تَافِهٌ إِذَا قَلَّ. وَفِي الْحَدِيثِ فِي ذِكْرِ الْقُرْآنِ: «لَا يَتْفَهُ وَلَا يُخْلِقُ». وَفِي حَدِيثٍ آخَرَ: «كَانَتِ الْيَدُ لَا تُقْطَعُ فِي الشَّيْءِ التَّافِهِ».»"

    - lemma: "خَسَاسَة"
      entry_id: "{auto}"
      root: "خسس"
      maqayis_quote: "الجذر خ-س-س: يدل على الدناءة والانحطاط والقِلَّة. الخسيسُ: الدنيء الحقير. [لم يرد في مقاييس ابن فارس بمدخل مستقل؛ موثّق في المعجم الوسيط والمعجم الكبير]"

