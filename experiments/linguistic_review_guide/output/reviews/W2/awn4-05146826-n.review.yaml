      decision_reason: >
        الرثاثة في الأصل تعني البِلى والتهالك في الهيئة والمظهر («رثّ الهيئة»)، وهي ترتبط بانعدام
        القيمة المادية الظاهرية لا الجوهرية. كما أن المعجم الكبير يُقيّد استعمالها في سياق الأسلوب
        بمعنى «الركاكة والضعف»، مما يُشير إلى تخصّصها. لا تُعبّر تعبيراً مباشراً عن «انعدام القيمة»
        كمفهوم مجرد. الاستغناء عنها لصالح «تفاهة» و«خساسة» أدق دلالةً.
      evidence_assessment:
        case: mixed


