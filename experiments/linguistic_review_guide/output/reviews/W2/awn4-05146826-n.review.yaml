# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «انْعِدَام القِيمَة» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تجتاز اختبار الاستبدال (يمكن قول «فقدان القيمة» أو «غياب القيمة» بنفس الوصفية)."
      - "لمّة «لَا جَدْوَى» تحمل دلالة «العبثية» أو «عدم الجدوى من العمل»، وليس «انعدام القيمة الذاتية للشيء» — تداخل دلالي مع synsets أخرى كـ futility."
      - "اللمّة الإنجليزية «ineptitude» تعني أصلاً «عدم الكفاءة» أو «الجهل بالفن»، وهي تختلف عن «worthlessness» — ضمّهما في مجموعة واحدة تقريب يستحق المراجعة."
      - "التعريف الحالي «عدم امتلاك أي صفات تجعل الشيء قيماً أو مفيداً» يبدو ترجمة مباشرة من الإنجليزية ولا يستوفي أسلوب المعجم الوسيط."
      - "المجموعة الأم (awn4-04731092-n) تضم «جَوْدَة» و«نَوْعِيَّة»، وانعدام القيمة هو نقيض الجودة — العلاقة منطقية لكن يُحبَّذ التحقق من synsets الأخوات."
    observations: >
      المجموعة تُعبّر عن مفهوم «الخسّة اللاجوهرية» أي افتقار الشيء إلى أي خاصية تجعله ذا قيمة أو نفع.
      المعجم العربي يُعبّر عن هذا بالمصادر الصريحة (خَسَاسَة، تَفَاهَة) وبالتعابير الوصفية (لا قيمة له، عديم القيمة).
      اللمّات الموجودة كلتاهما من النوع الثاني (وصفي مركّب)، وغياب المصادر الصريحة يُعدّ ثغرة في التمثيل المعجمي.

  blind_candidates:
    - lemma: "هَبَاء"
      generation_method: majaz
      justification: >
        الهباء في الأصل هو الغبار الدقيق الذي لا يُمسك ولا يُنتفع به.
        استُعمل مجازاً في التراث للدلالة على ما ذهب باطلاً وأصبح لا قيمة له (﴿فَكانَتْ هَباءً مُنبَثًّا﴾).
        الإزاحة الدلالية: من «الشيء الدقيق عديم الثقل» إلى «انعدام القيمة والأهمية».
        لفظ محفور في الضمير العربي، يتجنب الاشتراك اللفظي مع المصطلحات الحديثة.
    - lemma: "تَفَاهَة"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فَعَالَة من الجذر ت-ف-ه (تَفِهَ الشيءُ: قلّ ولم يكن ذا قيمة).
        ابن فارس: «التاء والفاء والهاء أصلٌ واحد وهو قلّة الشيء».
        الوزن فَعَالَة مخصص لمصادر الصفات الدالة على الحالات الجوهرية (شجاعة، بلاغة)،
        مما يجعله ملائماً تماماً للتعبير عن «انعدام القيمة» كحالة ذاتية.
    - lemma: "خَسَاسَة"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فَعَالَة من الجذر خ-س-س (خَسَّ الشيءُ: صار دنيئاً حقيراً).
        الخَسَاسَة: الحالة التي يكون عليها الخَسِيس (المعجم الوسيط).
        يُعبّر عن انعدام القيمة من منظور الجودة الجوهرية، ويُكمّل «تَفَاهَة» بإضافة بُعد الدناءة.
    - lemma: "رَثَاثَة"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فَعَالَة من الجذر ر-ث-ث (رَثَّ الشيءُ: بَلِيَ وتهالك).
        ابن فارس: «الراء والثاء أصل واحد يدل على إخلاق وسقوط».
        يُعبّر عن انعدام القيمة من منظور التردي والانحطاط في الهيئة والجوهر.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "انْعِدَام القِيمَة"
      expands:
        - text: "«(1) «أ» عديم القيمة. «ب» باطل؛ عديم الجدوَى / (2) حقير؛ تافه.»"
          source: "المورد الحديث (2008)"
          addition: "المورد يُقابل worthless بـ«عديم القيمة» و«عديم الجدوى» معاً، مما يؤكد التداخل بين اللمّتين الموجودتين ويدعم القول بأن «عديم القيمة» هو المعادل الأقرب."
        - text: "«تافه؛ عديم القيمة.»"
          source: "المورد الحديث (2008) — مقابل valueless"
          addition: "تأكيد إضافي على أن «عديم القيمة» هو المعادل المستقر في المعجمية الحديثة."
        - text: "«سند عديم القيمة»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — مقابل worthless security"
          addition: "يُثبت أن «عديم القيمة» مصطلح اصطلاحي مستقر في السياق التقني/القانوني."
      contradicts:
        - text: "«انعدام: تعبير يتضمن بأنه لا توجد إشارة واضحة على الرغم من أن الضوضاء وجهود اعتباطية غير الإشارات قد تكون موجودة.»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
          conflict: "«انعدام» هنا مصطلح تقني خاص بالحرب الإلكترونية، يتعارض مع الاستخدام العام المقصود في المجموعة."

    - lemma: "لَا جَدْوَى"
      expands:
        - text: "«(الجدوى) المطر العام والعطية وفائدة»"
          source: "المعجم الوسيط"
          addition: "الجذر الأصلي لـ«جدوى» هو الفائدة والعطاء، مما يعني أن «لا جدوى» تعني «لا فائدة» — وهذا أقرب إلى futility منه إلى worthlessness."
        - text: "«(عَبَث؛ لاجَدْوَى) (2) شيء تافه.»"
          source: "المورد الحديث (2008) — مقابل futility"
          addition: "المورد يُقابل futility (وليس worthlessness) بـ«لا جدوى»، مما يؤكد أن «لا جدوى» تنتمي أولاً لمجموعة futility."
        - text: "«الجِيمُ وَالدَّالُ وَالْحَرْفُ الْمُعْتَلُّ خَمْسَةُ أُصُولٍ مُتَبَايِنَةٍ. فَالْجَدَا مَقْصُورٌ: الْمَطَرُ الْعَامُّ وَالْعَطِيَّةُ الْجَزْلَةُ. وَالْجَدَاءُ مَمْدُودٌ: الْغَنَاءُ وَهُوَ قِيَاسُ مَا قَبْلَهُ مِنَ الْمَقْصُورِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يُرجع الجدوى إلى معنى الغناء والعطاء، مما يُرسّخ أن «لا جدوى» = «لا نفع» وليس «لا قيمة ذاتية»."
      contradicts:
        - text: "«(1) لا شيء / (2) ألبتَّة؛ على الإطلاق / (3) شيء غير موجود؛ عَدَمٌ / (4) شيء أو شخص تافهٌ أو عديم القيمة / (5) تافه؛ عديم القيمة.»"
          source: "المورد الحديث (2008) — مقابل nothing"
          conflict: "دلالة «لا جدوى» وحدها لا تعبّر عن worthlessness بل عن futility — الاقتران مع «عديم القيمة» هو الذي يُعطي المعنى المطلوب."

    - lemma: "هَبَاء"
      confirm:
        - text: "«الهَبَاءُ: التُّرَابُ الَّذِي تُطِيرُه الريحُ ويلزق بالأشياء أو يَنبثُّ في الهواء فلا يبدو إلا في ضوء الشمس. من الناس: القليلو العقل.»"
          source: "المعجم الوسيط"
        - text: "«الهباء: هو ذو الغبرة والرقة. الهَبْوَةُ: الغَبَرَةُ. والهَبَاءُ: دُقَاقُ التُّرَابِ. والشيء المنبثّ الذي تراه في ضوء الشمس: هَبَاء.»"
          source: "مقاييس اللغة لابن فارس — الجذر هبو"
      contradicts:
        - text: "«الهباء في اصطلاح المتصوفة: هو الذي فتح الله فيه أجساد العالم مع أنه لا عين له في الوجود... ويسمى بالهيولى.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "في السياق الصوفي يكتسب «الهباء» معنى فلسفياً تقنياً (المادة الأولى/الهيولى)، وهذا المعنى لا ينسجم مع المجموعة الترادفية المقصودة."
        - text: "«هباء: sind Gemische aus Flüssigkeit und Luft.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — مقابل aerosols"
          conflict: "في السياق العلمي الحديث تُرجمت كلمة aerosols بـ«هباء»، وهذا يُنشئ اشتراكاً لفظياً تقنياً يحول دون تبنّي «هباء» لمفهوم worthlessness."

    - lemma: "تَفَاهَة"
      confirm:
        - text: "«التَّاءُ وَالْفَاءُ وَالْهَاءُ أَصْلٌ وَاحِدٌ وَهُوَ قِلَّةُ الشَّيْءِ. يُقَالُ تَفِهَ الشَّيْءُ فَهُوَ تَافِهٌ إِذَا قَلَّ. وَفِي الْحَدِيثِ فِي ذِكْرِ الْقُرْآنِ: «لَا يَتْفَهُ وَلَا يُخْلِقُ». وَفِي حَدِيثٍ آخَرَ: «كَانَتِ الْيَدُ لَا تُقْطَعُ فِي الشَّيْءِ التَّافِهِ».»"
          source: "مقاييس اللغة لابن فارس — الجذر تفه"
        - text: "«(1) تافه؛ لا قيمة أو أساس له. (2) عديم الجدوى.»"
          source: "المورد الحديث (2008) — مقابل idle"
        - text: "«(1) تافِه / (2) عديم القيمة؛ رخيص؛ رديء.»"
          source: "المورد الحديث (2008) — مقابل trashy"
        - text: "«شيء تافه لا قيمة له.»"
          source: "المورد الحديث (2008) — مقابل losel"
      expands:
        - text: "«(1) «أ» اللّاشيئيّة: العَدَم؛ اللّاوجود. «ب» تفاهة؛ لاأهميّة. (2) شيء تافه أو عديم القيمة.»"
          source: "المورد الحديث (2008) — مقابل nothingness"
          addition: "يُقابل المورد nothingness بـ«تفاهة» مما يربطها بدلالة الانعدام والعدم."

    - lemma: "خَسَاسَة"
      confirm:
        - text: "«الخَسَاسَةُ: الحالةُ التي يكون عليها الخَسيسُ.»"
          source: "المعجم الوسيط"
        - text: "«الخَسَاسَةُ: الحالةُ التى يكونُ عليها الخَسِيسُ.»"
          source: "المعجم الكبير"
        - text: "«(الخساسة) الحالة يكون عليها الخسيس.»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«الخُساسَةُ: القليلُ من المال، عُلالَةُ الفرس.»"
          source: "المعجم الوسيط"
          addition: "الخُسَاسَة (بضم الخاء) تُستعمل للمال القليل — الضبط الحركي يميّز المعنيين."

    - lemma: "رَثَاثَة"
      confirm:
        - text: "«الرَّثَاثَةُ: البَذاذَةُ وهى سوءُ الحالِ والهَيْئَةِ. في هذا الكلام رَثاثَةٌ، أى: رَكاكَةٌ وضَعْفٌ.»"
          source: "المعجم الكبير"
        - text: "«الرَّاءُ وَالثَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِخْلَاقٍ وَسُقُوطٍ. فَالرَّثُّ: الْخَلَقُ الْبَالِي. يُقَالُ حَبْلٌ رَثٌّ وَثَوْبٌ رَثٌّ وَرَجُلٌ رَثُّ الْهَيْئَةِ. وَقَدْ رَثَّ يَرِثُّ رَثَاثَةً وَرُثُوثَةً.»"
          source: "مقاييس اللغة لابن فارس — الجذر رثث"
      contradicts:
        - text: "«رَثَاثَةٌ: رَكاكَةٌ وضَعْفٌ» في سياق الأسلوب."
          source: "المعجم الكبير"
          conflict: "الرثاثة في سياق الكلام تعني ركاكة الأسلوب وضعفه — وهي دلالة خاصة بالإنتاج اللغوي لا بانعدام القيمة الجوهرية للشيء، مما يُفيد بمحدودية نطاق الكلمة."


