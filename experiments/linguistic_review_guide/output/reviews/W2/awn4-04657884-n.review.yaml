# استعلامات قاعدة البيانات المُنفَّذة:
# ١. مطابقة دقيقة دفعية لجميع اللمّات (الموجودة + المرشحة) — entry_ids: 360970، 400421، 484651، 489384، 497824، 731481
# ٢. جسر إنجليزي: communicativeness / communicative / expressiveness — entry_ids: 679259، 487917، 730537…
# ٣. بحث FTS بالكلمات المفتاحية: تواصل / انفتاح / إفصاح / تعبير / انبساط
# ٤. التحقق من المرشحات وعائلة الجذر (بواح، بوّاح، تواصلية، انفتاحية…)
# ٥. مقاييس اللغة (dictionary_id=151): وصل / فتح / بوح / فصح
stage2_evidence:
  per_lemma:

    - lemma: "تواصل"
      confirm:
        - text: "«اتصال متبادل»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«الحوار وتمكين الناس من فهم العوامل الرئيسية لبيئتهم المادية والاجتماعية والاقتصادية والسياسية وترابطها بحيث يمكن حل المشكلات الطارئة بكفاءة. التواصل يتضمن في تعريفه إعطاء المعلومة والحصول على رد الفعل. وبالتالي، فالتواصل هو حزام نقل بين نشر المعلومات وتخطيط العمل.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«نقل الأخبار بواسطة العلامات والإشارات بين مرسل إلى متلقٍ عبر قناة ما، حيث يعمل التواصل بشكل جيّد في وضعية تقاسم الشفرة وغياب التشويش، تنتُج وظيفة التواصل في تعارض مع وظيفة التعبير.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "translation_en: «communication» — موثّق في مسارد متعددة: الإعلام والتواصل، الفلسفة وعلم النفس، علم الاجتماع والأنثروبولوجيا، الحكامة التربوية"
          source: "أرابتيرم (مجموعة مسارد)"
          addition: "يؤكد أن «تواصل» هو المقابل العربي الرسمي لـcommunication في المعجمية التخصصية الحديثة، لكن بمعنى العملية لا السمة الشخصية المجردة."

    - lemma: "انفتاح في الحديث"
      evidence_status: "no_material_found"

    - lemma: "التَّواصُلِيَّة"
      expands:
        - text: "«كِفاية تَواصُليَّة: تمكّن الفرد من قواعد الاستعمال المناسب في المواقف التواصلية، وتتأسس على مفهومين، هما: المناسبة والفعالية. وتشمل كفايات التواصل الفعال لدى المشرف التربوي القدرة على توظيف اللغة بأشكالها المختلفة من أجل التأثير في الآخرين، القدرة على التفاعل وإقامة علاقات إيجابية مع الآخرين»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (2020)"
          addition: "يُثبت أن الصيغة النسبية «تواصلية» (نعت) راسخة في المعجمية التخصصية (كفاية تواصلية، قدرة تواصلية، وظيفة تواصلية، نحو تواصلي…) مما يُعزز مشروعية المصدر الصناعي «التواصلية» كخاصّة مجردة."

    - lemma: "الانفِتاحِيَّة"
      expands:
        - text: "«انفتاح» — translation_en: openness"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية (2020)"
          addition: "يُترجم «انفتاح» بـopenness لا communicativeness، مما يُشير إلى تداخل مع مفهوم مختلف."
        - text: "«انبساط» — translation_en: extraversion; extroversion"
          source: "مسرد التربية / مسرد الفلسفة وعلم النفس (أرابتيرم)"
          addition: "الانبساط مقابل لـextraversion النفسية، وهو يُشير إلى بُعد مختلف من أبعاد الشخصية."

    - lemma: "البَوَّاحِيَّة"
      expands:
        - text: "«البَواحُ: الظاهر الصريح»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«بَوَّاح: من عادته إظهار الأشياء وإفشاء الأسرار»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُثبت أن الوزن بَوَّاح موثّق بمعنى كثير البوح، لكن ارتباطه بإفشاء الأسرار يُضيف دلالة سلبية مُضيِّقة."
        - text: "«الْبَاءُ وَالْوَاوُ وَالْحَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ سَعَةُ الشَّيْءِ وَبُرُوزُهُ وَظُهُورُهُ، فَالْبُوحُ جَمْعُ بَاحَةٍ، وَهِيَ عَرْصَةُ الدَّارِ […] وَمِنْ هَذَا الْبَابِ إِبَاحَةُ الشَّيْءِ، وَذَلِكَ أَنَّهُ لَيْسَ بِمَحْظُورٍ عَلَيْهِ، فَأَمْرُهُ وَاسِعٌ غَيْرُ مُضَيَّقٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدل على السعة والبروز والظهور والإباحة، وهو أقرب للتعبير الواسع منه للتواصل المتبادل."

    - lemma: "الإِفْصَاحِيَّة"
      expands:
        - text: "«صريح؛ كثير الكلام؛ غير متحفّظ» — translation_en: communicative"
          source: "المورد الحديث (2008)"
          addition: "يُعطي مقابل صفة communicative لا اسم السمة communicativeness، والمترادفات (صريح، كثير الكلام، غير متحفظ) تُشير إلى مفهوم أعرض."
        - text: "«الْفَاءُ وَالصَّادُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى خُلُوصٍ فِي شَيْءٍ وَنَقَاءٍ مِنَ الشَّوْبِ. مِنْ ذَلِكَ: اللِّسَانُ الْفَصِيحُ: الطَّلِيقُ. وَالْكَلَامُ الْفَصِيحُ: الْعَرَبِيُّ. وَأَفْصَحَ الرَّجُلُ: تَكَلَّمَ بِالْعَرَبِيَّةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدل على الجودة في الكلام والفصاحة، وهو يُعبّر عن كيفية الكلام لا عن الميل إليه."


