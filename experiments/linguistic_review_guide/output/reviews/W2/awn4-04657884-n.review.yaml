# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تواصل» مصدرٌ للفعل يدل على عملية التواصل (communication) لا على السمة الشخصية (communicativeness)؛ ثمة انزياح دلالي نحو الفعل بدلاً من الخاصّة"
      - "اللمّة «انفتاح في الحديث» عبارة وصفية حرة تفشل اختبار السكّ: يمكن إبدال «الحديث» بـ«الكلام» أو «التعبير» أو «الرأي» مع بقاء الوصف صالحاً، مما يدل على غياب التثبيت المعجمي"
      - "التعريف الحالي «سمة كون المرء متواصلاً» دائري يُعيد استخدام لفظة «متواصل» المشتقة من الجذر نفسه دون فصل نوعي حقيقي"
    observations: "المفهوم يُعبّر عن سمة شخصية نفسية اجتماعية تتصل بميل الفرد للانفتاح على الآخرين والتعبير بيسر، وهو مفهوم حديث الاستخدام المصطلحي في العربية. التراث يزخر بألفاظ قريبة كالبوح والإفصاح والانبساط، لكن لا يوجد مصطلح تراثي جامع يستوعب communicativeness بوصفها سمة محايدة. الصياغة القياسية المعاصرة تُمليها الحاجة إلى مصدر صناعي (فعالية/ية) مشتق من جذر وصل."
  blind_candidates:
    - lemma: "التَّواصُلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن تَفَاعُلِيَّة من الجذر (وصل) عبر صيغة المصدر تَوَاصُل، بإضافة ياء النسب والتاء المربوطة التي تُحوّل المصطلح إلى مفهوم مجرد. الصيغة قياسية في المصطلحية العربية المعاصرة (كالديمقراطية والاشتراكية). تُعبّر بدقة عن السمة لا عن الفعل."
    - lemma: "الانفِتاحِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن انفِعَالِيَّة من الجذر (فتح) عبر صيغة الانفتاح، والانفتاح ضد الانغلاق. يُجسّد بُعداً جوهرياً من أبعاد communicativeness وهو إزالة حواجز التعبير والتفتّح على الآخرين."
    - lemma: "البَوَّاحِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من بَوَّاح (وزن فعّال المبالغة) من جذر (بوح)، والبوّاح من عادته إظهار ما في نفسه وإفصاحه. يُحيي لفظاً عربياً قديماً بصياغة مستحدثة تُعبّر عن السمة."
    - lemma: "الإِفْصَاحِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من أَفْصَحَ يُفْصِحُ إِفْصَاحاً، من جذر (فصح) الذي يدل على الخلوص والظهور في مقاييس اللغة. الإفصاح التعبير الواضح البيّن، وهو الوجه اللغوي لسمة التواصل."


