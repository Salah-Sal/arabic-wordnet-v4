# مراجعة المجموعة الترادفية — awn4-13261869-n
# severalty — exclusive individual ownership
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (ملكية فردية) وهي مركب وصفي، والتعريف العربي مختصر جداً ويكاد يكرر اللمّة ذاتها (ملكية فردية حصرية)"
      - "المصطلح الإنجليزي severalty مصطلح قانوني دقيق يعني الملكية المنفردة مقابل الملكية المشتركة، بينما التعريف العربي لا يوضح هذا التقابل"
      - "ملكية فردية في معجم الاقتصاد الموحد تقابل sole proprietorship (شكل تجاري) لا severalty (ملكية قانونية حصرية)"
    observations: "المفهوم قانوني صرف: ملكية شخص واحد لعقار أو حق دون شريك. يقابله في الفقه الإسلامي مفهوم الملك التام أو الملك المحض. التعريف الحالي يحتاج إلى تعميق لتوضيح أن المراد انفراد المالك بملكه دون مشاركة أحد."
  blind_candidates:
    - lemma: "تَمَلُّكٌ انْفِرَادِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من تَمَلُّك (مصدر تملّك: حاز الملكية) + انفرادي (نسبة إلى الانفراد). يؤدي دلالة الحصرية والانفراد في التملك."
    - lemma: "مِلْكٌ مَحْضٌ"
      generation_method: tarkib
      justification: "مركب وصفي تراثي: المِلْك (ما يُملك) + المحض (الخالص الصرف). يفيد أن الملكية خالصة لصاحبها لا شريك فيها، وهو قريب من الاستعمال الفقهي."
    - lemma: "اسْتِئْثَارٌ"
      generation_method: ishtiqaq
      justification: "مصدر استأثر يستأثر على وزن استفعال من الجذر أ ث ر، بمعنى انفرد بالشيء دون غيره. يجمع معنى الحصرية والانفراد في لفظ واحد."
    - lemma: "إِفْرَادُ المِلْكِيَّةِ"
      generation_method: tarkib
      justification: "مركب إضافي: الإفراد (مصدر أفرد: جعل الشيء فرداً) مضاف إلى الملكية. يدل على جعل الملكية لشخص واحد."

stage2_evidence:
  per_lemma:
    - lemma: "مِلْكِيَّة فَرْدِيَّة"
      confirm:
        - text: "«ملكية فردية — sole proprietorship»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
      expands:
        - text: "«(الملكية) المِلْك أو التمليك. يقال: بيدي عقد ملكية هذه الأرض. و(الملكية الخاصة) ما يملكه الفرد. و(الملكية العامة) ما تملكه الدولة»"
          source: "المعجم الوسيط"
          addition: "المعجم الوسيط يعرّف الملكية عموماً ويفرّق بين الخاصة والعامة لكن لا يذكر تعبير ملكية فردية بهذا النص"
        - text: "«(2) التملّك الانفرادي (ق) (3) المِلك المَحْض: أرضٌ لا شريكَ لمالكها فيها (ق)»"
          source: "المورد الحديث (2008) — مقابل severalty"
          addition: "المورد يترجم severalty بالتملك الانفرادي والملك المحض، لا بملكية فردية"
    - lemma: "تَمَلُّكٌ انْفِرَادِيٌّ"
      confirm:
        - text: "«(2) التملّك الانفرادي (ق)»"
          source: "المورد الحديث (2008) — مقابل severalty"
    - lemma: "مِلْكٌ مَحْضٌ"
      confirm:
        - text: "«(3) المِلك المَحْض: أرضٌ لا شريكَ لمالكها فيها (ق)»"
          source: "المورد الحديث (2008) — مقابل severalty"
    - lemma: "اسْتِئْثَارٌ"
      expands:
        - text: "«الاختصاص: عناية تعين المختص لمرتبة ينفرد بها دون غيره»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الاختصاص قريب من الاستئثار دلالياً (الانفراد بشيء دون غيره) لكن الاستئثار أقوى في إفادة الحصرية"
    - lemma: "إِفْرَادُ المِلْكِيَّةِ"
      expands:
        - text: "«(الإفراد) (في النحو) خلاف التثنية والجمع و(في الفقه) ألا يجمع بين الحج والعمرة في الإحرام»"
          source: "المعجم الوسيط"
          addition: "الإفراد في المعاجم مستعمل في سياقات نحوية وفقهية (الحج) لا في سياق الملكية، مما يضعف التعبير"

