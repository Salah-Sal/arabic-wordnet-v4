# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "دَالَّة"
      entry_id: "{auto}"
      root: "دلل"
      maqayis_quote: "«الدَّالُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا إِبَانَةُ الشَّيْءِ بِأَمَارَةٍ تَتَعَلَّمُهَا، وَالْآخَرُ اضْطِرَابٌ فِي الشَّيْءِ. فَالْأَوَّلُ قَوْلُهُمْ: دَلَلْتُ فُلَانًا عَلَى الطَّرِيقِ. وَالدَّلِيلُ: الْأَمَارَةُ فِي الشَّيْءِ. وَهُوَ بَيِّنُ الدَّلَالَةِ وَالدِّلَالَةِ»"

  per_sense:
    - lemma: "دَالَّة"
      sense_id: "{auto}"
      nuance: >
        دَالَّة هي المصطلح الرياضي الأكثر رسوخًا وانتشارًا في التراث العلمي العربي الحديث
        للمفهوم الذي يعنيه function؛ تنبثق دلالتها من الإبانة والإشارة (الجذر دلل)،
        أي أن الدالةَ «تدلّ» كلَّ عنصر على مقابله في المدى. تختلف عن «تطبيق» (application)
        في الغلبة التعليمية والمعجمية، وعن «اقتران» الشائع في المناهج السورية في
        كونها المصطلح المعتمد في المعاجم العربية الرسمية والمجامع اللغوية.
      mwe: false

  synset:
    cultural_fit: native

