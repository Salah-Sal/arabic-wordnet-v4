# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "دَالَّة"
      decision: confirmed
      decision_reason: >
        أقوى المصطلحات العربية للدالة الرياضية وأكثرها توثيقًا وانتشارًا؛ مشتق من «دلّ» بمعنى
        أشار وبيَّن، وهو استعمال دلالي طبيعي (الدالة تُشير/تدلّ كل عنصر إلى مقابله).
        موثّق في المعجم الكبير بالتعريف الرياضي الصريح، وفي المعاجم التقنية المتخصصة
        بترادف مباشر مع function. يتصرّف اصطلاحيًا في مركبات كثيرة (دالة تحويل، دالة عضوية،
        دالة الغموض…).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check:
        pattern: "فَاعِلَة"
        root: "دلل"
        semantic_fit: "الفاعلية (الدالَّة: التي تدلّ) تناسب وظيفة الإشارة والتعيين"
      nuance_differentiation: >
        دَالَّة هي اللمّة الوحيدة المؤكَّدة في هذه المجموعة بعد حذف «تابع رياضي»؛
        لذا لا تقابل داخلية، لكنّها تتميّز دلاليًا عن «تطبيق» (application/mapping بالمعنى
        الرياضي الفرنسي) في كونها أكثر شيوعًا في التعليم والكتابة العلمية العربية،
        وعن «اقتران» (المستخدم في بعض المناهج السورية واللبنانية بمعنى function) في
        كونها الأوسع انتشارًا والأكثر قبولًا في المعاجم الرسمية.

    - lemma: "تَابِع رِيَاضِيّ"
      decision: removed
      decision_reason: >
        «تابع» في المعجم الموحد لمصطلحات الرياضيات والفلك (1990) يُرادف «dependent» (المتغير
        التابع)، وهو مفهوم مختلف كليًّا عن الدالة. المتغير التابع هو القيمة التي تُنتجها
        الدالة (y = f(x)، فـ y هو التابع)، أما الدالة ذاتها (f) فهي علاقة لا متغير.
        إدراج «تابع رياضي» بمعنى function يُفضي إلى خلط مفاهيمي خطير في التعليم الرياضي.
        اللمّة غير موثّقة في أيٍّ من المعاجم المتخصصة بهذا المعنى.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وَظِيفَة"
      source: stage1
      decision: removed
      decision_reason: >
        وظيفة تعني «الدور/المهمة» في السياقات البيولوجية والتقنية، وهو ما يقابل function
        بمعنى وظيفة العضو، لا بمعناها الرياضي الدقيق (علاقة أحادية القيمة). كذلك فإن
        «وظيفة» تُستخدم في بعض السياقات الحاسوبية بمعنى subroutine وليس mathematical function.
        تبقى الدلالة ملتبسة وغير محكمة للمفهوم الرياضي المقصود.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُصَوِّرَة"
      source: stage1
      decision: removed
      decision_reason: >
        غلب على «مصوِّرة» في المعجمية العربية الحديثة معنى Camera (آلة التصوير)، مما يجعله
        مصطلحًا مشغولًا دلاليًا. المعنى القديم في مقاليد العلوم (القوة المصوِّرة للبدن) لا
        علاقة له بالدالة الرياضية. استخدام هذا المرشح يُفضي إلى اشتراك لفظي مع التصوير
        الضوئي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "إِحَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        «إحالة» موثّق بمعاني: الإحالة اللسانية (reference)، والإحالة الطبية (referral)، والتحوّل
        الكيفي في الفلسفة القديمة (transformation). لا يوجد توثيق على استخدامها بمعنى
        الدالة الرياضية في أيٍّ من المعاجم. الجذر «حول» يوحي بالتحوّل لا بالتعيين الأحادي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "رَابِطَة"
      source: stage1
      decision: removed
      decision_reason: >
        «رابطة» تعني في المنطق القديم رابطة القضية (Copula)، وفي الكيمياء الرابطة الجزيئية
        (bond)، وفي الاجتماع الجمعية (association). لا يوجد توثيق على استخدامها بمعنى
        الدالة الرياضية. علاوة على ذلك، «رابطة» لا تحمل قيد أحادية القيمة الضروري
        لتمييز الدالة عن العلاقة العامة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

  synset_notes:
    - >
      ملاحظة للمحررين: مصطلح «تَطْبِيق» (entry_id=414952، المعجم الموحد للرياضيات والفلك 1990،
      en=application) يُستخدم رسميًا في السياق الرياضي للإشارة إلى mapping (تطبيق تقابلي =
      bijective mapping، مجال تطبيق = domain of mapping). يُنصح بدراسة إضافة «تَطْبِيق» إلى
      هذه المجموعة أو إنشاء مجموعة ترادفية مرتبطة.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "(الرياضيات) علاقة رياضية بحيث يرتبط كل عنصر من مجموعة معينة (مجال الدالة) بعنصر من مجموعة أخرى (مدى الدالة)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في جوهره لكنه يعاني من إشكالين:
        (١) يُهمل قيد «أحادية القيمة» (single-valued) الجوهري الذي يُفرّق الدالة عن
        العلاقة الرياضية العامة — إذ يجوز في العلاقة العامة أن يرتبط العنصر الواحد بأكثر
        من عنصر، بينما الدالة لا تُعيِّن إلا عنصرًا واحدًا.
        (٢) اشتمل على تعبير «مجال الدالة» و«مدى الدالة» ضمن التعريف وهو تكرار دائري جزئي؛
        الأفضل الإحالة إلى المجموعة الأولى والثانية دون استخدام مصطلح «الدالة» داخل تعريفها.
    authored:
      - type: terminological
        text: >
          (رياضيات) علاقةٌ بين مجموعتين تُعيِّن لكلِّ عنصر من المجموعة الأولى (المجال)
          عنصرًا واحدًا بعينه من المجموعة الثانية (المدى)
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          (رياضيات) صورة من صور العلاقات الرياضية، تُميِّزها خاصيةُ أحادية القيمة: إذ يُقابَل
          كل عنصر x في مجموعة المجال D بعنصر واحد فحسب y في مجموعة المدى R، ويُرمز لها
          عادةً بـ f: D → R، وتُكتب f(x) = y. وتشمل الدوالُ الخطيةَ والتربيعيةَ والمثلثيةَ
          وسواها من الأنواع الدراسية والتطبيقية.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "(رياضيات) علاقةٌ بين مجموعتين تُعيِّن لكلِّ عنصر من المجموعة الأولى (المجال) عنصرًا واحدًا بعينه من المجموعة الثانية (المدى)"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "(رياضيات) صورة من صور العلاقات الرياضية، تُميِّزها خاصيةُ أحادية القيمة: إذ يُقابَل كل عنصر x في مجموعة المجال D بعنصر واحد فحسب y في مجموعة المدى R، ويُرمز لها عادةً بـ f: D → R، وتُكتب f(x) = y"

  examples:
    per_lemma:
      - lemma: "دَالَّة"
        examples:
          - text: "اشترط الأستاذُ أن تكون الدالةُ مستمرةً في مجالها قبل البدء في حساب مشتقّها."
            type: usage
          - text: "تُعدُّ الدالةُ التربيعيةُ f(x) = x² من أبسط الدوالِ وأكثرِها ورودًا في مناهج الرياضيات."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اشترط الأستاذُ أن تكون الدالةُ مستمرةً في مجالها قبل البدء في حساب مشتقّها."
