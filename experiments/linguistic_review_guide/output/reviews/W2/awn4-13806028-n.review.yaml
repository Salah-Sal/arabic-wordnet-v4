# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تَابِع رِيَاضِيّ» غير مألوفة في المعجمية الرياضية العربية؛ «تابع» في الاصطلاح الرياضي يعني «المتغير التابع» (dependent variable) لا الدالة بوصفها علاقة."
      - "التعريف الحالي يخلو من قيد «أحادية القيمة» الذي يميّز الدالة عن العلاقة الرياضية العامة؛ يمكن أن تربط العلاقةُ العامةُ عنصرًا بأكثر من عنصر، بينما الدالة تُعيِّن عنصرًا واحدًا بعينه."
      - "مصطلح «تَطْبِيق» (application/mapping) الوارد في المعجم الموحد لمصطلحات الرياضيات والفلك (1990) غائب عن المجموعة، وهو مستخدم رسميًا للإشارة إلى دوال الرسم الرياضي (bijective mapping, monotonic mapping…)."
    observations: >
      المجموعة تُمثّل مفهوم الدالة الرياضية (function) بوصفها علاقة أحادية القيمة بين مجموعتين. المصطلح
      الراسخ في التراث الرياضي العربي الحديث هو «دَالَّة» المشتق من الجذر «دلل» (الدلالة والإشارة)، وهو
      موثّق في المعاجم الكلاسيكية والمعاصرة على حدٍّ سواء. أما «تَابِع رِيَاضِيّ» فمصطلح منقوص الشيوع
      ومُلتبس الدلالة، إذ يحيل في المعاجم المتخصصة إلى «المتغير التابع» لا إلى مفهوم الدالة.
      اللمّات المرشحة في هذه المرحلة مولَّدة من التعريف وحده دون الاطلاع على اللمّات الموجودة.

  blind_candidates:
    - lemma: "وَظِيفَة"
      generation_method: majaz
      justification: >
        «الوظيفة» أصلها ما يُقدَّر من عمل في زمن معيّن (مقاييس اللغة)، وقد توسّع استخدامها في
        العلوم الحديثة لتدلّ على «الدور الخاص» الذي يؤدّيه أيُّ مكوّن. الإزاحة الدلالية هنا:
        الدالة الرياضية تؤدّي «وظيفة» محدّدة بتعيين كل عنصر بمقابله، وقد استُخدم المصطلح فعلًا
        في مجالات علمية عديدة بمعنى function.
    - lemma: "مُصَوِّرَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر «صور» على وزن مُفَعِّلَة (اسم فاعل مؤنث للمضاعَف الوظيفي)، بمعنى
        «التي تُصوِّر عنصرًا بمقابله في المدى»؛ فالدالة تُنشئ صورةً رياضيةً لكل عنصر في
        المجموعة الأصلية. الوزن مناسب لآلة الكشف والربط الوظيفي.
    - lemma: "إِحَالَة"
      generation_method: ishtiqaq
      justification: >
        مصدر «أَحَالَ» بمعنى نقل/أوصل/وجّه، واحتمال الإزاحة قوي: الدالة «تُحيل» كلَّ عنصر
        إلى عنصر مقابل في المدى. الجذر «حول» بمعنى التحوّل والانتقال يلائم العلاقة
        الموجِّهة من مجال إلى مدى.
    - lemma: "رَابِطَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر «ربط» على وزن فَاعِلَة، بمعنى «التي تربط». الدالةُ علاقةٌ رابطة
        بين مجموعتين تُقيم رابطًا محدّدًا بين عناصر المجال وعناصر المدى. الوزن فَاعِلَة
        مثمر في العربية لمفاهيم الترابط والاتصال.


