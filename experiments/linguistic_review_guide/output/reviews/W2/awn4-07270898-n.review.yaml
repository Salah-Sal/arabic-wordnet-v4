# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-07270898-n (telegnosis)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «معرفة عن بعد» عبارة وصفية حرة من ثلاث كلمات، تفشل في اختبار السكّ: يمكن إبدال «معرفة» بـ«علم» أو «إدراك» مع بقاء العبارة صالحة وصفياً"
      - "المفهوم (telegnosis) نادر جداً حتى في الإنجليزية، وهو مفهوم خارق للطبيعة لا مقابل له في التراث العربي المعجمي"
      - "المجموعة تحوي لمّة واحدة فقط، ما يشير إلى فقر معجمي يحتاج إثراء أو مراجعة"
    observations: "المفهوم ينتمي إلى حقل الباراسيكولوجيا (ما وراء علم النفس)، وهو يصف قدرة مزعومة على العلم بأحداث بعيدة دون توسط الحواس. الحقل الأعمّ (hypernym) هو «تواصل خارق» (paranormal communication). المصطلح الإنجليزي telegnosis مركّب يوناني (tele=بُعْد + gnosis=معرفة)، وقد اتجه المترجم إلى نقل الاشتقاق حرفياً بعبارة «معرفة عن بعد». يحتاج المدخل إلى تشكيل كامل وتقييم ما إذا كانت العبارة مصطلحاً ثابتاً أم وصفاً حراً."
  blind_candidates:
    - lemma: "اسْتِغْيَاب"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر «غيب» على وزن استفعال، بمعنى طلب العلم بالغائب والمستتر عن الحواس، فالسين والتاء للطلب، والغيب يدل على التستر عن العيون كما في مقاييس اللغة"
    - lemma: "كَشْف بُعْدِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «كشف» (إزالة الحجاب والاطلاع) و«بُعْدِيّ» (نسبة إلى البُعْد)، على غرار المركبات المصطلحية في الحقل: إدراك فوق حسّي، الجلاء البصري"
    - lemma: "بَصِيرَة بُعْدِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من «بصيرة» (نفاذ الإدراك والعلم بالشيء) و«بُعْدِيَّة» (نسبة إلى البُعْد)، والبصيرة في العربية تتعدى الرؤية البصرية إلى العلم الباطني"
    - lemma: "تِلِغْنُوزِيَّة"
      generation_method: taarib
      justification: "تعريب للمصطلح اليوناني-الإنجليزي telegnosis بإلحاق ياء النسبة والتاء المربوطة، على نمط تعريب المصطلحات العلمية: تلباثية (telepathy)، تلكنيزيا (telekinesis)"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مَعْرِفَة عَنْ بُعْد"
      evidence_status: "no_material_found"

    - lemma: "اسْتِغْيَاب"
      evidence_status: "no_material_found"

    - lemma: "كَشْف بُعْدِيّ"
      evidence_status: "no_material_found"

    - lemma: "بَصِيرَة بُعْدِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تِلِغْنُوزِيَّة"
      evidence_status: "no_material_found"

    - lemma: "اسْتِبْصَار"
      confirm:
        - text: "«قوة إدراك الأشياء بالعقل.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«الاستبصار: القدرة المزعومة على رؤية كل ما هو واقع وراء نطاق البصر»"
          source: "المورد الحديث (2008)"
          addition: "يحصر المصطلح في الرؤية البصرية (clairvoyance) لا المعرفة المطلقة (telegnosis)"

    - lemma: "الجَلَاء البَصَرِيّ"
      expands:
        - text: "«انطباع ذاتي عن رؤية تحدث عن بعد يدركها بعض الناس، وهي إحدى ظواهر الإدراك المجاوز للحواس.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "يقابل clairvoyance تحديداً وليس telegnosis، إذ يركّز على الرؤية لا المعرفة"

    - lemma: "إِدْرَاك فَوْقَ حِسِّيّ"
      expands:
        - text: "«مجموعة من الظواهر النفسية يتم فيها إدراك أشياء بعيدة عن مجال الحواس المعروفة، كالتخاطر مثلا.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "هذا المصطلح أعمّ من telegnosis ويشمل التخاطر والاستبصار وغيرهما"

# ── المرحلة ٣: التحليل اللغوي ────────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مَعْرِفَة عَنْ بُعْد"
      decision: confirmed
      decision_reason: "رغم أنّ العبارة وصفية وليست مصطلحاً مسكوكاً بالمعنى الدقيق، فإنّ المفهوم شديد التخصص ونادر، ولا يوجد مقابل عربي مفرد ثابت. العبارة شفافة دلالياً وتنقل المفهوم بدقة (tele=عن بعد + gnosis=معرفة). في غياب بديل أفضل مُثبت معجمياً، تُبقى مع تسجيل التحفظ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "عبارة وصفية شفافة تترجم المفهوم حرفياً: المعرفة الظاهرية بأحداث بعيدة دون توسط الحواس"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْرِفَة عَنْ بُعْد"

    - lemma: "اسْتِغْيَاب"
      source: stage1
      decision: removed
      decision_reason: "اشتقاق مُولَّد لم يُثبت في أي معجم كلاسيكي أو حديث، ولا يوجد شاهد على استعماله. وزن استفعال من غيب يحتمل تفسيرات عديدة (طلب الغيبة، الاستتار) ما يُفقده الوضوح المصطلحي."
      evidence_assessment:
        case: no_material

    - lemma: "كَشْف بُعْدِيّ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي غير مُثبت معجمياً. «الكشف» في الاصطلاح الصوفي يعني الاطلاع على ما وراء الحجاب، لكنّ إضافة «بُعْدِيّ» لا تُنتج مصطلحاً ثابتاً. يفشل في اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material

    - lemma: "بَصِيرَة بُعْدِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حر غير مُثبت. «البصيرة» تدل على نفاذ العقل، لا على المعرفة الخارقة تحديداً. لا شواهد معجمية تربط هذا التركيب بالمفهوم المراد."
      evidence_assessment:
        case: no_material

    - lemma: "تِلِغْنُوزِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تعريب لمصطلح نادر حتى في الإنجليزية. لا يُعرف هذا التعريب في أي مصدر عربي. مبدأ إيثار العربي يُقدّم العبارة العربية الشفافة «معرفة عن بعد» على تعريب مبهم لا يفيد القارئ شيئاً."
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "معرفة ظاهرية لأحداث بعيدة دون استخدام الإدراك الحسي"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية شبه مباشرة من الإنجليزية. يحتاج إلى صياغة بأسلوب المعجم الوسيط مع توضيح الانتماء للحقل الباراسيكولوجي وتفريقه عن المفاهيم المجاورة (التخاطر، الاستبصار)."
    authored:
      - type: terminological
        text: "قدرة مزعومة على العلم بأحداث تقع في أماكن نائية من غير طريق الحواس المعروفة، وهي من ظواهر الإدراك فوق الحسي."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ظاهرة باراسيكولوجية يُدَّعى فيها أنّ المرء يطّلع على أحداث تجري في أماكن بعيدة دون أن تبلغه بطريق الحواس الخمس أو وسائل الاتصال المادية. تتميز عن التخاطر بأنّها لا تستلزم اتصالاً عقلياً مع شخص آخر، وعن الاستبصار بأنّها لا تقتصر على الرؤية البصرية بل تشمل أنماط المعرفة كلها."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "قدرة مزعومة على العلم بأحداث تقع في أماكن نائية من غير طريق الحواس المعروفة، وهي من ظواهر الإدراك فوق الحسي."

  examples:
    per_lemma:
      - lemma: "مَعْرِفَة عَنْ بُعْد"
        examples:
          - text: "يزعم بعض الباحثين في الباراسيكولوجيا أنّ المعرفة عن بعد تتيح للمرء وصف أحداثٍ تقع في مكان بعيد وصفاً دقيقاً دون أن يبلغه عنها خبر."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يزعم بعض الباحثين في الباراسيكولوجيا أنّ المعرفة عن بعد تتيح للمرء وصف أحداثٍ تقع في مكان بعيد وصفاً دقيقاً دون أن يبلغه عنها خبر."

