stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - التعريف الحالي هو ترجمة حرفية للتعريف الإنجليزي، ويمكن صياغته بأسلوب معجمي أدق يعكس الدورة البيوجيوكيميائية.
    observations: "دورة الكربون مصطلح علمي مستقر، يعبر عن حركة الكربون التبادلية بين الغلاف الجوي والمحيط الحيوي واليابسة. اللمة المختارة صحيحة تماماً من حيث الشيوع والملاءمة."
  blind_candidates:
    - lemma: "دَوْرَةُ الكَرْبُون"
      generation_method: tarkib
      justification: "التركيب الإضافي القياسي والأكثر شيوعاً للتعبير عن هذا المفهوم العلمي."
    - lemma: "الدَّوْرَةُ الكَرْبُونِيَّة"
      generation_method: tarkib
      justification: "صيغة وصفية بديلة تستخدم أحياناً في النصوص العلمية."
    - lemma: "تَدَاوُلُ الكَرْبُون"
      generation_method: tarkib
      justification: "تركيب يعبر عن عملية دوران الكربون وتبادله بين الأغلفة المختلفة."
    - lemma: "تَبَادُلُ الكَرْبُون"
      generation_method: tarkib
      justification: "تركيب يركز على الجانب التفاعلي بين الكائنات الحية والغلاف الجوي."

stage2_evidence:
  per_lemma:
    - lemma: "دَوْرَةُ الكَرْبُون"
      confirm:
        - text: "«النظام المُكوّن من التحوّلات الكيميائية لمُركّبات كربونية داخل الأغلفة الكونية... كما يُشير المُصطلح إلى التبادل الذي يجري في تلك المُركّبات بين الأغلفة الأرضية المذكورة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«التدفق العالمي وانتقال ذرات الكربون من النباتات عبر الحيوانات إلى الغلاف الجوي والتربة والمياه والعودة إلى النباتات.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      expands:
        - text: "«دورة بيوجيوكيميائية يبدل فيها الكربون بين الغلاف الحيوي، والغلاف الترابي، والقشرة الأرضية، والغلاف المائي، والغلاف الجوي للأرض.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "كَرْبُون"
      confirm:
        - text: "«عنصر لا فلزي يوجد على صور مختلفة بعضها غير متبلور كالسناج والفحم وهما صورتان نقيتان وبعضها متبلور كالماس والجرافيت (مج)»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "دورة الكربون"
      decision: confirmed
      decision_reason: "المصطلح العربي القياسي والمستقر علمياً، وهو مطابق تماماً للمفهوم الموصوف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَوْرَةُ الكَرْبُون"

stage4_content:
  definition:
    current: "الدورة العضوية للكربون من الغلاف الجوي إلى الكائنات الحية والعودة مرة أخرى"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط؛ التعديل يضيف الدقة العلمية بذكر الأغلفة المختلفة والعمليات الحيوية (التمثيل الضوئي والتنفس)."
    authored:
      - type: terminological
        text: "دَوْرَةٌ حَيَوِيَّةٌ كِيمْيَائِيَّةٌ يَنْتَقِلُ فِيهَا الكَرْبُونُ بَيْنَ الغِلَافِ الجَوِّيِّ وَالغِلَافِ المَائِيِّ وَاليَابِسَةِ وَالكَائِنَاتِ الحَيَّةِ؛ حَيْثُ تَمْتَصُّهُ النَّبَاتَاتُ فِي عَمَلِيَّةِ التَّمْثِيلِ الضَّوْئِيِّ، ثُمَّ يَعُودُ إِلَى الجَوِّ عَنْ طَرِيقِ التَّنَفُّسِ وَالتَّحَلُّلِ العُضْوِيِّ وَحَرْقِ الوَقُودِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "دورة الكربون"
        examples:
          - text: "تُؤَدِّي دَوْرَةُ الكَرْبُونِ دَوْراً حَاسِماً فِي تَنْظِيمِ مُنَاخِ الأَرْضِ وَتَوَازُنِ الحَيَاةِ."
            type: usage
          - text: "يُسَاهِمُ حَرْقُ الوَقُودِ الأَحْفُورِيِّ فِي اخْتِلَالِ تَدَافُقَاتِ دَوْرَةِ الكَرْبُونِ الطَّبِيعِيَّةِ."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "دَوْرَةٌ حَيَوِيَّةٌ كِيمْيَائِيَّةٌ يَنْتَقِلُ فِيهَا الكَرْبُونُ بَيْنَ الغِلَافِ الجَوِّيِّ وَالغِلَافِ المَائِيِّ وَاليَابِسَةِ وَالكَائِنَاتِ الحَيَّةِ؛ حَيْثُ تَمْتَصُّهُ النَّبَاتَاتُ فِي عَمَلِيَّةِ التَّمْثِيلِ الضَّوْئِيِّ، ثُمَّ يَعُودُ إِلَى الجَوِّ عَنْ طَرِيقِ التَّنَفُّسِ وَالتَّحَلُّلِ العُضْوِيِّ وَحَرْقِ الوَقُودِ."
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُؤَدِّي دَوْرَةُ الكَرْبُونِ دَوْراً حَاسِماً فِي تَنْظِيمِ مُنَاخِ الأَرْضِ وَتَوَازُنِ الحَيَاةِ."

