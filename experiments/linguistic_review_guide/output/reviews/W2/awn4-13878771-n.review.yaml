# مراجعة المجموعة الترادفية: awn4-13878771-n (polarity / sign)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «إِشَارَة» شديدة الاشتراك اللفظي؛ معناها الأول إيماءة/علامة/signal، واستعمالها بمعنى sign (+/−) تخصيص حديث قد يُلبس"
      - "المجموعة تضم مفهومين متقاربين لكنهما مختلفان: polarity (خاصية الأقطاب) وsign (إشارة الموجب/السالب)، واللمّتان الحاليتان تغطيان كلاً منهما على حدة دون رابط مشترك واضح"
      - "غياب مصطلح «تَقَاطُب» الوارد في المعجم الطبي الموحد ومعجم التشريح ومعاجم أخرى مقابلاً لـ polarity"
    observations: "المجموعة تنتمي إلى حقل الفيزياء/الكهرباء وتصف خاصية امتلاك قطبين متضادين. التعريف الحالي ترجمة حرفية واضحة من الإنجليزية. قُطْبِيَّة مصطلح مُوحَّد مُثبت في عدة معاجم عربية متخصصة. إِشَارَة تؤدي معنى sign (الإشارة الرياضية +/−) لكنها تحتاج تمييزاً دلالياً واضحاً."

  blind_candidates:
    - lemma: "قُطْبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «قُطْب» على وزن فُعْلِيَّة، يدل على خاصية امتلاك أقطاب متضادة، وهو الاشتقاق المباشر والطبيعي من الجذر ق ط ب"
    - lemma: "تَقَاطُب"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَاعُل من الجذر ق ط ب، يدل على التقابل والتناظر بين قطبين، ويُستعمل في السياقات العلمية والطبية"
    - lemma: "سِمَة"
      generation_method: majaz
      justification: "إزاحة دلالية من معنى العلامة/الوسم إلى الإشارة الدالة على الاتجاه (موجب/سالب)، لكنها عامة جداً"
    - lemma: "دَلَالَة"
      generation_method: ishtiqaq
      justification: "مصدر من دلّ على وزن فَعَالَة، يدل على ما يُعرف به الشيء ويميَّز، لكنها أقرب إلى المعنى المنطقي/اللساني منها إلى الفيزيائي"

stage2_evidence:
  per_lemma:
    - lemma: "إِشَارَة"
      confirm:
        - text: "«اشارة — sign»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«اشارة — sign»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«إشارة — signal: الإشارات تُمثِّل معلومات، وهي تُجَسَّم من خلال قيمة ثابتة أو تتابع تغيّر قيمة مقدار فيزيائي»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          conflict: "الاستخدام الغالب في المعاجم التقنية هو signal (إشارة كهربائية) لا sign (إشارة الموجب/السالب)"
      expands:
        - text: "«الإشَارةُ: دلَالَة عقلية أَو حسية إِلَى الشَّيْء بِحَيْثُ لَا يُشَارِكهُ فِيهِ غَيره»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "المعنى الأصلي للإشارة هو الدلالة الحسية أو العقلية على شيء محدد، مما يدعم استعمالها بمعنى العلامة المميِّزة"
        - text: "«الإشارة: التلويح بشيء يفهم منه النطق، فهي ترادف النطق في فهم المعنى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "توسيع المعنى من الإيماء الحسي إلى أي علامة دالة"

    - lemma: "قُطْبِيَّة"
      confirm:
        - text: "«قُطْبِيَّة — polarity: إشارةُ فرق الكمون (الجهد) بين نقطتين من دارة. فإذا وُجِدَ فرقُ في الكمون بين نقطتين، فإن إحداهما لها قطبية موجبة والأخرى قطبية سالبة»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«قطبية — polarity: نسبة الشحن إلى الجُهد بين إلكترودين في بطارية»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«قطبية — polarity»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«قطبية — polarity»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«قطبية — polarity»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«قُطْبِيَّة — polarity»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      expands:
        - text: "«(1) القطبيّة؛ التقاطُب (فز) (2) التقاطب؛ التناقض الكامل: التكشُّف عن مبدأين أو نزعتين متناقضتين»"
          source: "المورد الحديث (2008)"
          addition: "يربط بين القطبية والتقاطب كمترادفين، ويوسع المعنى إلى التناقض المعنوي"

    - lemma: "تَقَاطُب"
      confirm:
        - text: "«تَقاطُب — polarity»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَقَاطُب — polarity»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«تقاطب — polarity»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«(1) القطبيّة؛ التقاطُب (فز) (2) التقاطب؛ التناقض الكامل: التكشُّف عن مبدأين أو نزعتين متناقضتين»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد ترادف التقاطب مع القطبية، ويضيف بُعد التناقض الكامل"

    - lemma: "سِمَة"
      contradicts:
        - text: "«السمة: ما وُسِم به الحيوان من ضروب الصُّوَر. العلامة»"
          source: "المعجم الوسيط"
          conflict: "معنى السمة هو العلامة/الوسم الحسي أو الصفة المميزة عموماً، ولا علاقة له بالقطبية أو التضاد الكهربائي"

    - lemma: "دَلَالَة"
      contradicts:
        - text: "«الدّلَالَة: الْإِرْشَاد وَمَا يَقْتَضِيهِ اللَّفْظ عِنْد إِطْلَاقه»"
          source: "المعجم الوسيط"
          conflict: "الدلالة مفهوم لساني/منطقي (العلاقة بين الدال والمدلول) ولا تتصل بمفهوم القطبية الفيزيائية"

stage3_analysis:
