        value: '{"root":"خرج","maqayis":"«الْخَاءُ وَالرَّاءُ وَالْجِيمُ أَصْلَانِ... الْأَوَّلُ: النَّفَاذُ عَنِ الشَّيْءِ.»"}'
    - command: set_metadata
      params:
