        key: note
        value: '{"root":"خلص","maqayis":"«الْخَاءُ وَاللَّامُ وَالصَّادُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، وَهُوَ تَنْقِيَةُ الشَّيْءِ وَتَهْذِيبُهُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح عام يدل على استخراج مادة من أخرى بمختلف الوسائل، ويشيع استخدامه في المجال الميكانيكي والفيزيائي (مثل استخراج المعادن أو الزيوت).","mwe":false}'
    - command: set_metadata
