# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-13991755-n
# ili       : i110341
# pos       : n
# lemmas    : بطالة | تعطل عن العمل
# en        : unemployment
