# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمة (بطالة) مُسجَّلة في المجموعة بلا تشكيل؛ الصيغة الفصيحة (بَطَالَة) أو (بِطَالَة) بحسب معجم الصواب اللغوي"
      - "التعبير (تعطل عن العمل) عبارة وصفية حرّة لا وحدة معجمية مسكوكة؛ يجتاز اختبار الاستبدال (تعطّل عن الخدمة/الإنتاج) مما يكشف أنه ليس مصطلحاً ثابتاً"
      - "التعريف الحالي (حالة كونه عاطلاً عن العمل أو ليس لديه وظيفة) ترجمة حرفية عمياء عن (the state of being unemployed or not having a job)؛ لا يتوافق مع أسلوب المعجم الوسيط"
    observations: >
      المجموعة تُمثّل مفهوماً اقتصادياً واجتماعياً راسخاً في العربية الحديثة. اللمة الأصيلة
      (بطالة) مشتقة من الجذر (ب ط ل) بمعنى ذهاب الشيء وبطلانه، وقد تخصّصت دلالتها الحديثة
      في انعدام العمل، وهي مُعتمَدة في عشرات المعاجم الاصطلاحية العربية (الاقتصاد والقانون والاجتماع).
      أما التعبير (تعطل عن العمل) فيُمثّل صيغة وصفية فعلية أو اسم فاعل موسَّع لا مصدراً جامداً
      يصلح رأساً لمجموعة ترادفية اسمية. وقد وجد الناظر أن التراث المعجمي يعتمد (عاطل عن العمل)
      للصفة، و(بطالة) للحالة الاسمية.

  # ب. اللمّات المرشحة (توليد عمياء قبل الاطلاع على اللمات الموجودة)
  blind_candidates:
    - lemma: "عَطَالَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ع ط ل) — الخلوّ والفراغ — على وزن فَعَالَة الدال على الحالة الثابتة
        (كجهالة وضلالة)؛ فالعاطل عن العمل خالٍ فارغ من الوظيفة، وهي قياسية صرفياً
    - lemma: "تَعَطُّل"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ع ط ل) على وزن تَفَعُّل الدالّ على اتصاف الفاعل بالحالة تدريجاً؛
        ومنه (تعطّل العامل) إذا خلا من الشغل، وهو مصدر يدل على انعدام العمل
    - lemma: "فَقْدُ العَمَل"
      generation_method: tarkib
      justification: >
        مركب إضافي من (فقد) دالاً على الانعدام، و(العمل) الموضوع الرئيسي؛ التركيب الإضافي
        الثنائي مستعمل في الاقتصاد للدلالة على ظاهرة انعدام الوظيفة
    - lemma: "اللَّاعَمَالَة"
      generation_method: tarkib
      justification: >
        مركب من نفي (لا) و(عمالة) قياساً على اللاسُّلطوية واللاتناظر؛ يُعبّر عن انعدام
        حالة التوظيف بأسلوب اشتقاقي حديث يُنتجه العربية المعاصرة في المصطلحات الاجتماعية


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# ميزانية الاستعلامات المُستخدَمة: ٤ استعلامات
# ١. مطابقة دفعية بالعنوان (جميع اللمات + المرشحات)
# ٢. إثراء بالمعرّف (تعريفات + شواهد)
# ٣. جسر إنجليزي (unemployment / joblessness / out of work)
# ٤. بحث FTS عربي (عاطل عن العمل، البطالة) + مقاييس اللغة (بطل، عطل)
stage2_evidence:
  per_lemma:

    # ── لمّة موجودة: بطالة ──
    - lemma: "بطالة"
      confirm:
        - text: >
            «عَدَم توافر العمل لشَخْص راغب فيه، وقادر عليه، فى حِرفة تَتَّفق مع استعداده،
            نظراً لحالة سُوق العمَل»
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«بطالة» — unemployment"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO ArabTerm)"
        - text: "«بطالة» — unemployment"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«بطالة» — unemployment"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«بطالة» — unemployment"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«بطالة» — unemployment"
          source: "مسرد الجغرافيا والتاريخ (ALECSO ArabTerm)"
        - text: "«بطالة» — unemployment"
          source: "مسرد الفلسفة وعلم النفس (ALECSO ArabTerm)"
        - text: "«(1) البِطالة (2) نسبة البطالة» — unemployment"
          source: "المورد الحديث (2008)"
        - text: >
            «بَطَالةالجذر: ب ط ل — الصواب والرتبة: انخفض معدل البَطالة [فصيحة]، انخفض معدل
            البِطالة [فصيحة] — التعليق: مجيء «فِعالة» بكسر الفاء وفتحها مشهور في لغة العرب...
            فقد جاء في الوسيط: «بَطَل العاملُ بِطالة وبَطالة: تعطَّل»»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«اتِّباع اللَّـهـو، والجَهالة»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          addition: >
            البطالة في المعنى الكلاسيكي هي اتباع اللهو والفراغ عن العمل المفيد؛ وهذا المعنى
            القديم يُضيء أصل الدلالة قبل التخصص الاقتصادي الحديث
        - text: >
            «البطالة: ترك العمل لأن الأحوال تبطل بذلك»
          source: "التوقيف على مهمات التعاريف للمناوي (ت١٦٢٢م)"
          addition: >
            المناوي يربط دلالة البطالة بفعل (بطل)؛ وهذا يُؤكد أن الاستخدام الكلاسيكي للمصطلح
            قائم على الجذر الصرفي ذاته، وإن كان السياق مختلفاً

    # ── لمّة موجودة: تعطل عن العمل ──
    - lemma: "تعطل عن العمل"
      confirm:
        - text: "«(تعطل) بَقِي بِلَا عمل وَالْمَرْأَة فقدت الْحلِيّ»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
      contradicts:
        - text: >
            «تَعَطُّل: إخفاقُ برنامجٍ أو مِسْوَق قرص disk drive. يؤدِّي تعطّل البرنامج إلى
            فقدان جميع المعطيات غير المخزَّنة، ويمكِن أن يَترُكَ نظامَ التشغيل في حالة غير
            مستقرة...»
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: >
            (تعطّل) في سياق تقني يعني الانهيار الكامل للبرنامج أو الجهاز (crash)؛ وهو معنى
            شائع في المحيط الرقمي مما يُشكّل اشتراكاً لفظياً مع معنى الإخفاق لا انعدام العمل
        - text: "«تعطل» — breakdown / failure / incident"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "في الهندسة يعني (تعطّل) توقف العمل جراء خلل تقني لا الظاهرة الاقتصادية"
      expands:
        - text: "«عاطل عن العمل» — unemployed"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: >
            المعجم القانوني يُثبت الصفة (عاطل عن العمل) لا المصدر (تعطل عن العمل)؛
            مما يُشير إلى أن الاستعمال الراسخ يتعلق باسم الفاعل وليس المصدر الفعلي

    # ── مرشّح المرحلة ١: عطالة ──
    - lemma: "عطالة"
      confirm:
        - text: "«تعويض البطالة، تعويض العطالة» — unemployment compensation"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: >
            «خاصية الأشياء بحيث تبقى ساكنة أو بحركة مستقيمة منتظمة مالم تُطبَّق عليها قوة
            خارجية» — inertia
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: >
            المعنى الغالب لـ(عطالة) في المعاجم العلمية الحديثة هو العَطَالة الفيزيائية (inertia)؛
            وهذا يخلق اشتراكاً لفظياً يجعلها غير صالحة للتعريف الاقتصادي
        - text: "«عطالة» — inertia"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO ArabTerm)"
          conflict: "تداخل مع المعنى الفيزيائي"
        - text: "«عطالة» — passitivity"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "الاستعمال الكيميائي (خمول/سلبية) مختلف عن انعدام العمل"
        - text: "«عطالة» — inertia"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الاستعمال الطبي كذلك في الخمول الفيزيائي"

    # ── مرشّح المرحلة ١: تعطّل (المصدر المجرد) ──
    - lemma: "تعطّل"
      contradicts:
        - text: >
            «تَعَطُّل: إخفاقُ برنامجٍ أو مِسْوَق قرص... يؤدِّي تعطّل البرنامج إلى فقدان جميع
            المعطيات غير المخزَّنة» — crash
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: >
            المعنى السائد في المعجم التقني هو (انهيار البرنامج)؛ وهذا المعنى منتشر انتشاراً
            واسعاً في وسط المعلوماتية والحوسبة، مما يُبعده عن الاختصاص بانعدام العمل
        - text: "«تعطل» — breakdown / failure / incident"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "الانهيار التقني وليس انعدام العمل"
      expands:
        - text: "«(تعطل) بَقِي بِلَا عمل وَالْمَرْأَة فقدت الْحلِيّ»"
          source: "المعجم الوسيط"
          addition: >
            المعجم الوسيط يُثبت المعنى (بقي بلا عمل) للفعل، غير أن المصدر (تعطّل) تغلب
            عليه في الاستعمال المعاصر دلالة الانهيار التقني لا الظاهرة الاقتصادية

    # ── مرشّح المرحلة ١: فقد العمل ──
    - lemma: "فقد العمل"
      evidence_status: "no_material_found"

    # ── مرشّح المرحلة ١: اللاعمالة ──
    - lemma: "اللاعمالة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: بطالة ──
    - lemma: "بطالة"
      decision: confirmed
      decision_reason: >
        اللمة موثّقة في أكثر من عشرة معاجم اصطلاحية حديثة (الاقتصاد، والقانون، والاجتماع،
        والتجارة) بمعنى (unemployment) مطابق لتعريف المجموعة. المعجم الكبير يُعرّفها تعريفاً
        علمياً دقيقاً. معجم الصواب يُقرّ بفصاحة الصيغتين (بَطالة وبِطالة). الجذر (بطل)
        راسخ في مقاييس اللغة. لا يوجد تعارض مع دلالة المجموعة. تحتاج فقط تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم الجامد الثابت للظاهرة الاقتصادية (unemployment) المستعمَل رأساً للمصطلح
        في جميع التركيبات الاشتقاقية (بطالة موسمية، بطالة هيكلية، معدل البطالة، تأمين ضد
        البطالة)؛ يتميز عن كل تعبير وصفي أو فعلي بأنه وحدة معجمية مستقلة قابلة للإسناد
        والتعديل الصفي في الكلام الاقتصادي والرسمي
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَطَالَة"

    # ── لمّة موجودة: تعطل عن العمل ──
    - lemma: "تعطل عن العمل"
      decision: removed
      decision_reason: >
        فشل اختبار السكّ المصطلحي: يمكن إبدال (العمل) بـ(الخدمة) أو (الإنتاج) ويظل
        التعبير وصفاً صالحاً، مما يُثبت أنه عبارة وصفية حرّة لا مصطلح ثابت. فضلاً عن
        ذلك، فإن المدخل اللغوي الأصيل (تعطل) في المعاجم التقنية الحديثة مشغول بمعنى
        (breakdown / crash)، مما يُحدث اشتراكاً لفظياً ضاراً. أما المفهوم الاسمي لانعدام
        العمل فتُعبّر عنه (بطالة) وهي أجدر لرسوخها وتصاريفها الاصطلاحية الكثيرة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشّح المرحلة ١: عطالة ──
    - lemma: "عَطَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود أثر ضعيف لها في السياق القانوني (تعويض العطالة)، إلا أن الغلبة الساحقة
        لاستعمالها في المعاجم العلمية الحديثة هي (العَطَالة الفيزيائية = inertia)، وهذا
        يُنشئ لبساً دلالياً خطيراً. إضافةً إلى ذلك، فإن (بطالة) هي المصطلح المعتمَد
        والراسخ في جميع المعاجم الاقتصادية، ولا حاجة لترادف مع مصطلح مشغول بمعنى آخر.
      evidence_assessment:
        case: mixed

    # ── مرشّح المرحلة ١: تعطّل (المصدر) ──
    - lemma: "تَعَطُّل"
      source: stage1
      decision: removed
      decision_reason: >
        المصدر (تعطّل) يغلب عليه في العربية المعاصرة معنى (انهيار الجهاز أو البرنامج)
        لا انعدام العمل، وهو ما أثبته معجم المعلوماتية ومعجم المياه. وحتى في الاستعمال
        العام، فإن (تعطّل) يدلّ على توقف عارض لا ظاهرة اقتصادية مستمرة. لا يصلح بديلاً
        عن (بطالة) التي تُغطي المعنى تغطيةً تامة.
      evidence_assessment:
        case: mixed

    # ── مرشّح المرحلة ١: فقد العمل ──
    - lemma: "فَقْدُ العَمَل"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد في أي معجم كمصطلح ثابت. يفشل اختبار السكّ: (فقد الوظيفة / فقد الخدمة)
        تعمل بنفس القدر، مما يُثبت أنه عبارة وصفية لا مصطلح معجمي. ولا قيمة مضافة له
        في وجود (بطالة) المستقرة والجامعة.
      evidence_assessment:
        case: no_material

    # ── مرشّح المرحلة ١: اللاعمالة ──
    - lemma: "اللَّاعَمَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        نيولوجيزم غير مُوثَّق في أي معجم. رغم قياسيته الصرفية النظرية، إلا أنه لا يجتاز
        اختبار التثبيت المعجمي. لا مسوّغ لإضافته والمصطلح الأصيل (بطالة) مُستوفٍ لكل
        المعايير.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
# تُعالَج فقط اللمات المؤكدة: بَطَالَة
stage4_content:
  definition:
    current: "حالة كونه عاطلاً عن العمل أو ليس لديه وظيفة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية عن الإنجليزية (the state of being unemployed or not
        having a job)؛ صياغة (حالة كونه...) ركيكة في العربية المعجمية. كما أن الصياغة
        لا تُميّز بين البطالة الاختيارية والاضطرارية، ولا تُشير إلى البُعد الاقتصادي
        للظاهرة. المعجم الكبير يقدّم تعريفاً أدق وأكثر تخصصاً.
    authored:
      - type: terminological
        text: >
          عَدَمُ تَوَافُرِ فُرَصِ العَمَلِ لِشَخْصٍ رَاغِبٍ فِيهِ قَادِرٍ عَلَيْهِ،
          نَظَرًا لِأَحْوَالِ سُوقِ العَمَلِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          ظَاهِرَةٌ اقْتِصَادِيَّةٌ وَاجْتِمَاعِيَّةٌ تَتَمَثَّلُ فِي خُلُوِّ فَئَةٍ
          مِنَ السُّكَّانِ الْقَادِرِينَ عَلَى الْعَمَلِ وَالرَّاغِبِينَ فِيهِ مِنَ
          الْوَظَائِفِ الْمَأْجُورَةِ؛ وَتُقَاسُ بِمَعْدَلِ الْبَطَالَةِ الَّذِي يُعَبِّرُ
          عَنْ نِسْبَةِ الْعَاطِلِينَ إِلَى إِجْمَالِي قُوَّةِ الْعَمَلِ
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13991755-n"
          definition_index: 0
          text: "عَدَمُ تَوَافُرِ فُرَصِ العَمَلِ لِشَخْصٍ رَاغِبٍ فِيهِ قَادِرٍ عَلَيْهِ، نَظَرًا لِأَحْوَالِ سُوقِ العَمَلِ"
      - command: add_definition
