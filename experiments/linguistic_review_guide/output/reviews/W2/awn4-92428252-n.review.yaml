stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «الطابع الإيطالي» تركيبٌ وصفيٌّ حر؛ يمكن إبدال «الطابع» بـ«السمة» أو «الصفة»، مما يُثير تساؤلاً حول مدى تثبُّته معجمياً"
      - "غياب المصدر الصناعي «إيطالية» الذي يُعدّ الصيغة الأكثر إيجازاً وقياسيةً للتعبير عن خاصية كون الشيء إيطالياً"
      - "التعريف الحالي «حالة أو جودة كون الشيء إيطالياً» ترجمة مباشرة من الإنجليزية، ويفتقر إلى الأسلوب المعجمي العربي"
      - "المجموعة خالية من ILI، وهذا يستدعي مزيداً من التمحيص في علاقاتها الدلالية"
    observations: >
      المجموعة تُعبِّر عن مفهوم الخاصية المجردة المنسوبة إلى إيطاليا (Italianness)، وهو مفهوم
      من فصيلة المصادر الصناعية الدالة على خاصية الانتساب (عروبة، فرنسية، إنسانية...). العربيةُ
      لا تفتقر إلى آليةٍ إنتاجية لمثل هذه المفاهيم — وهي إلحاق تاء المصدر الصناعي بالنسبة —
      غير أن اللمّة المختارة «الطابع الإيطالي» تنحو منحىً تركيبياً وصفياً. ولجذر «طبع» عمقٌ
      دلالي واسع يشمل الخَتْم والطبيعة والخَلِيقة، مما يمنح «الطابع» مشروعيةً في دلالة الخاصية
      المميِّزة للشيء أو الجماعة.
  blind_candidates:
    - lemma: "إِيطَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مُشتَق من النسبة «إيطالي» بإلحاق تاء المصدر الصناعي. الوزن منتجٌ قياسيٌّ
        في العربية المعاصرة لتحويل أي صفة نسبية إلى مفهوم مجرد يدل على الخاصية (عروبة،
        فرنسية، يابانية...). لا يُكرِّر كلمات التعريف، ويجتاز اختبار السكّ إذ لا يقبل إبدال
        مكوّناته بمرادفات وبقاءه مصطلحاً (لا يصح قول «أوروبية» بدلاً عنه للمعنى ذاته).
    - lemma: "الطَّابَعُ الإِيطَالِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «الطابع» (= العلامة المميِّزة والخَلِيقة الغالبة) + «الإيطالي»
        (نسبة). يُشبه في بنيته المُوثَّق معجمياً «الطَّابِعُ القَوْمِيّ» الذي أوردَه
        المعجم الكبير. يُبرز الجانب الظاهريّ المميِّز للهوية الإيطالية.
    - lemma: "الخُصُوصِيَّةُ الإِيطَالِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «الخصوصية» (= ما يختصّ به الشيء من صفات) + «الإيطالية». يؤدي
        معنى ما يتفرّد به الإيطالي من سمات متميزة.
    - lemma: "السِّمَةُ الإِيطَالِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «السِّمة» (من وَسَم: العلامة والخاصية) + «الإيطالية». «السمة»
        في المعجم الوسيط: العلامة والأثر الواضح على الشيء، مما يناسب دلالة الخاصية المميِّزة.


stage2_evidence:
  per_lemma:
    - lemma: "الطَّابَعُ الإِيطَالِيّ"
      confirm:
        - text: >
            «الطَّابِعُ القَوْمِيّ: خصائصُ ظاهرةٌ تميِّزُ مجتمعًا ما, كقولنا: إن المصريّ
            يمتاز بكذا وكذا»
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
        - text: >
            «الطَّابَع: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ»
          source: "المعجم الكبير"
        - text: >
            «الطابع: الطبيعة. يُقَال لَهُ طَابع حسن»
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة، 1998)"
        - text: >
            «العَلَامَةُ الْمُمَيِّزَةُ. يقال: طابَع الشَّاة»
          source: "المعجم الكبير"
      expands:
        - text: >
            «(الطَّابَع) الطبيعة يُقَال لَهُ طَابع حسن؛ الخلق الغالب»
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
          addition: >
            يُثبت أن «الطابع» يستخدم في التعبير عن الخُلق أو الخاصية المميِّزة للشيء
            أو الشخص، مما يمنح مشروعية تركيبه مع النسبة «الإيطالي» لأداء هذا المعنى.
        - text: >
            «له طابع حَسَنٌ»
          source: "المعجم الكبير (مثال استعمالي)"
          addition: >
            يُثبت تعدية «الطابع» في بنية: «طابع + وصف» لوصف الخاصية المميِّزة.

    - lemma: "إِيطَالِيَّة"
      expands:
        - text: >
            «(1) الإيطاليّ: أحد أبناء إيطاليا. شخص إيطاليّ الأصل. (2) اللغة الإيطاليّة.
            (3) إيطاليّ.»
          source: "المورد الحديث (2008)"
          addition: >
            يُثبت الاستخدام المعجمي لـ«إيطالي» كصفة نسبية متصرفة، مما يمهّد لاشتقاق
            المصدر الصناعي «إيطالية» قياساً على الأنماط العربية المنتجة.
        - text: >
            «إيطاليّ الصفة أو الخصائص.»
          source: "المورد الحديث (2008)، ترجمة: Italianate"
          addition: >
            الترجمة العربية للمفهوم الإنجليزي Italianate تُعبِّر عنه بعبارة «إيطاليّ الصفة
            أو الخصائص»، وهي عبارة وصفية حرة لا مصطلح مسكوك، مما يعزز الحاجة إلى مصطلح
            مُكثَّف كـ«إيطالية».
        - text: >
            «يُطَلْيِن: يجعله إيطاليًّا.»
          source: "المورد الحديث (2008)، ترجمة: italianate (verb)"
          addition: >
            المورد الحديث يُثبت محاولة تعريب الفعل المنسوب إلى إيطاليا («يُطَلْيِن»),
            مما يُشير إلى ثراء الحقل الدلالي وإمكانية الاشتقاق.

    - lemma: "الخُصُوصِيَّةُ الإِيطَالِيَّة"
      evidence_status: "no_material_found"

    - lemma: "السِّمَةُ الإِيطَالِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "الطَّابَعُ الإِيطَالِيّ"
      decision: confirmed
      decision_reason: >
        اللمّة تركيب وصفي (إضافي-وصفي) يُسنده توثيق المعجم الكبير للنمط «الطابع القومي»
        بمعنى «خصائص ظاهرة تميّز مجتمعاً ما». «الطابع» محمولٌ على معنى الخاصية المميِّزة
        (العلامة + الخُلُق الغالب)، وتركيبه مع نسبة جنسية قياسٌ متّسق موثَّق. يُمثِّل
        اللمّة وجهاً آخر للمعنى: جانب المظهر الخارجي المميِّز والطابع الظاهري.
        اللمّة بحاجة إلى تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «الطَّابَعُ الإِيطَالِيّ» يُبرز الجانب الظاهري والمميَّز من الخاصية الإيطالية،
        ويُستعمل في سياقات وصف الأعمال الفنية والمعمارية والأسلوبية. في حين تدل
        «إِيطَالِيَّة» على الخاصية بوصفها جوهراً مجرداً قابلاً للتجريد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطَّابَعُ الإِيطَالِيّ"

    - lemma: "إِيطَالِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصدر الصناعي «إيطالية» وزنٌ إنتاجي في العربية المعاصرة يحوّل كل صفة نسبية إلى
        مفهوم مجرد دالّ على الخاصية (عروبة، يابانية، فرنسية...). المورد الحديث يُثبت أن
        المفهوم الإنجليزي Italianate يُعبَّر عنه بـ«إيطاليّ الصفة أو الخصائص»، مما يُثبت
        وجود الحاجة المعجمية ويُعزز مشروعية مصطلح مُكثَّف. يجتاز اختبار الاشتقاقية
        (يقبل الجمع: إيطاليات، والنسبة: إيطاليّ، وال: الإيطالية). يؤثَر على «الطابع
        الإيطالي» في سياقات الخطاب المجرد الفلسفي والنقدي الثقافي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «إِيطَالِيَّة» تدل على الخاصية بوصفها جوهراً مجرداً قابلاً للدراسة والتحليل
        (كقول: «تجلت الإيطالية في أعمال مايكل أنجلو»)، بينما «الطَّابَعُ الإِيطَالِيّ»
        يُبرز الجانب الظاهري المميَّز في الشيء الموصوف.
      actions:
        - command: create_entry
          params:
            lemma: "إِيطَالِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "الخُصُوصِيَّةُ الإِيطَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا يجتاز اختبار السكّ: يمكن إبدال «الخصوصية» بـ«الصفة» أو «السمة» أو «الطابع»
        ويبقى وصفاً صحيحاً، مما يُثبت أنه عبارة وصفية حرة لا مصطلح. كما أن «الخصوصية»
        تحمل أحياناً دلالة الخصوصية القانونية أو السياسية (privacy)، مما يُوجِد اشتراكاً
        لفظياً في السياق المعاصر.

    - lemma: "السِّمَةُ الإِيطَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا يجتاز اختبار السكّ: يمكن إبدال «السمة» بـ«الطابع» أو «الخصوصية» وبقي وصفاً
        حراً. لا أدلة معجمية على تثبّت هذه الصيغة. «السمة» مفيدة في التعريف لكن ليست
        مصطلحاً راسخاً في هذا السياق.


