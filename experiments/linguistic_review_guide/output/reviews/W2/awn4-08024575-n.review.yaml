      decision_reason: "لفظ فصيح وعالٍ في الدلالة على الكتب والأوراق المجموعة، يضيف قيمة بلاغية للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أُضْمُومَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "صُرَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تدل على نوع محدد من الحزم الصغيرة المربوطة في خرفة، وهي شائعة تاريخياً وحديثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "صُرَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "مجموعة من الأشياء ملفوفة أو معبأة معًا في صندوق"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكنه يفتقر للشمولية (يقتصر على الصندوق) والدقة الاصطلاحية."
    authored:
      - type: terminological
        text: "مجموعة من الأشياء لُفَّت أو حُزمت أو عُبئت في غلاف أو صندوق لتكون وحدة واحدة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة من الأشياء لُفَّت أو حُزمت أو عُبئت في غلاف أو صندوق لتكون وحدة واحدة."
  examples:
    per_lemma:
      - lemma: "حِزْمَة"
        examples:
          - text: "اشترى النجار حزمة من الخشب لصناعة الأثاث."
            type: usage
      - lemma: "رِزْمَة"
        examples:
          - text: "أرسل الكاتب رزمة من الأوراق إلى دار النشر."
            type: usage
      - lemma: "طَرْد"
        examples:
          - text: "تلقيتُ طرداً بريدياً يحتوي على كتب علمية."
            type: usage
      - lemma: "رَبْطَة"
        examples:
          - text: "حمل المسافر ربطة من الثياب فوق ظهره."
            type: usage
      - lemma: "أُضْمُومَة"
        examples:
          - text: "تضم المكتبة الوطنية أضمومة نادرة من المخطوطات الأثرية."
            type: usage
      - lemma: "صُرَّة"
        examples:
          - text: "كان الرجل يخبئ دراهمه في صرة من قماش خشن."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "وصلت شحنة البضائع في طرود محكمة الإغلاق."

