      decision: confirmed
      decision_reason: "مصطلح أساسي يصف الأشياء المربوطة معاً، مدعوم بقوة في المعاجم القديمة والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِزْمَة"
    - lemma: "رزمة"
      decision: confirmed
      decision_reason: "مصطلح شائع الاستخدام للأوراق والثياب المجموعة، مدعوم معجمياً بكسر الراء وضمه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِزْمَة"
    - lemma: "طرد"
