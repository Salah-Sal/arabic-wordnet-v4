stage1_review:
  assessment:
    concerns:
      - "افتقار اللّمات الموجودة للتشكيل الكامل."
      - "الحاجة إلى تمييز دلالي دقيق بين اللّمات المترادفة (حزمة، رزمة، طرد)."
    observations: "المجموعة الترادفية تغطي مفهوم الأشياء المجموعة والمحزومة. اللّمات الحالية (حزمة، رزمة، طرد) أساسية وصحيحة، لكن يمكن إثراء المجموعة بمصطلحات أكثر دقة أو فصاحة مثل 'رَبْطَة' و'أُضْمُومَة' و'صُرَّة'."
  blind_candidates:
    - lemma: "حِزْمَة"
      generation_method: ishtiqaq
      justification: "من الجذر (حزم) الذي يدل على الشد والإحكام، وهي أشهر لفظ للمواد المجموعة والمربوطة."
    - lemma: "رِزْمَة"
      generation_method: ishtiqaq
      justification: "من الجذر (رزم) الذي يدل على جمع الشيء وضم بعضه إلى بعض، وتُستخدم غالباً للثياب والأوراق."
    - lemma: "طَرْد"
      generation_method: majaz
      justification: "من الجذر (طرد)، أُطلق على ما يُرسل بالبريد (الطرد البريدي) ثم صار مصطلحاً عاماً للمجموعة المعبأة للشحن."
    - lemma: "رَبْطَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ربط)، وتُستخدم للمواد التي تُجمع وتُشد برباط."

stage2_evidence:
  per_lemma:
    - lemma: "حِزْمَة"
      confirm:
        - text: "«(الحُزْمة) ما جُمع ورُبط من كلِّ شيء»"
          source: "المعجم الوسيط"
        - text: "«(الحَزْمُ) الْحَاءُ وَالزَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ شَدُ الشَّيْءِ وَجَمْعُهُ... وَالْحُزْمَةُ مِنَ الْحَطَبِ وَغَيْرِهِ مَعْرُوفَةٌ»"
          source: "مقاييس اللغة"
    - lemma: "رِزْمَة"
      confirm:
        - text: "«(الرُّزْمَةُ) ما جُمِع فى شيء واحد. يقال: رزمة ثياب، ورزمة ورق، وهكذا»"
          source: "المعجم الوسيط"
        - text: "«(رَزَمَ) الرَّاءُ وَالزَّاءُ وَالْمِيمُ أَصْلَانِ مُتَقَارِبَانِ: أَحَدُهُمَا جَمْعُ الشَّيْءِ وَضَمُّ بَعْضِهِ إِلَى بَعْضٍ تِبَاعًا... وَمِنْ ذَلِكَ اشْتِقَاقُ رِزْمَةِ الثِّيَابِ»"
          source: "مقاييس اللغة"
    - lemma: "طَرْد"
      confirm:
        - text: "«(طَرْد) ما يُرسل في البريد أو نحوه من بضاعة»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«(طَرَدَ الإِبِلَ ونَحْوَها) ضَمَّها وجَمَعَها من نواحيها»"
          source: "المعجم الكبير"
    - lemma: "رَبْطَة"
      confirm:
        - text: "«(الرَّبْطَةُ) الحُزْمَةُ»"
          source: "المعجم الكبير"
        - text: "«(رَبَطَ) الرَّاءُ وَالبَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى شَدٍّ وَثَبَاتٍ»"
          source: "مقاييس اللغة"
    - lemma: "أُضْمُومَة"
      confirm:
        - text: "«(أَضْمُومَةٌ) من الكُتُبِ، والصُّحُفِ، وغيرها: الحُزْمَةُ منها»"
          source: "المعجم الكبير"
        - text: "«(ضَمَّ) الضَّادُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُلَاءَمَةٍ بَيْنَ شَيْئَيْنِ... وَهَذِهِ إِضْمَامَةٌ مِنْ كُتُبٍ»"
          source: "مقاييس اللغة"
    - lemma: "صُرَّة"
      confirm:
        - text: "«(الصُّرَّةُ) ما يُجمع فيه الشيءُ ويُشدّ»"
          source: "المعجم الوسيط"
        - text: "«(صَرَّ) الصَّادُ وَالرَّاءُ أُصُولٌ: الْأَوَّلُ قَوْلُهُمْ صَرَّ الدَّرَاهِمَ يَصُرُّهَا صَرًّا. وَتِلْكَ الْخِرْقَةُ صُرَّةٌ»"
          source: "مقاييس اللغة"

stage3_analysis:
