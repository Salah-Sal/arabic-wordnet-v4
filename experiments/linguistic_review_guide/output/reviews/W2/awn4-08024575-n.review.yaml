      decision_reason: "أصبح المصطلح المعياري للطرود البريدية والشحنات المعبأة، وله أصل دلالي في جمع الإبل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَرْد"
    - lemma: "رَبْطَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف صريح للحزمة في المعاجم (الوسيط والكبير)، ويناسب مفهوم الأشياء المربوطة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
