# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-10700357-n — survivalist
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مُحَافِظ عَلَى الْبَقَاء، مُهْتَمّ بِالْبَقَاء) عبارتان وصفيتان حرّتان لا تعبيران اصطلاحيان ثابتان؛ تخفقان في اختبار السكّ (يمكن إبدال «محافظ» بـ«حريص» أو «ساعٍ» دون تغيّر المعنى)"
      - "لا يوجد مصطلح عربي مسكوك مقابل لـ survivalist في المعاجم المتاحة"
      - "المفهوم حديث ثقافياً ومرتبط بحركة الاستعداد للكوارث في الغرب، فيحتاج إلى مصطلح منحوت"
    observations: "المجموعة تصف شخصاً يسعى إلى ضمان بقائه أو بقاء جماعته في حالات الطوارئ والكوارث. الجذر الأنسب هو «ب ق ي» ومصدره «بقاء»، ويمكن بناء نسبة منه على وزن فَعَالِيّ (بَقَائِيّ) كما يُقال «وجوديّ» من «وجود». اللمّتان الحاليتان مركّبات جرّية (اسم فاعل + جار ومجرور) وليست وحدات معجمية ثابتة."

  blind_candidates:
    - lemma: "بَقَائِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى «بقاء» على وزن فَعَالِيّ، كما يُقال «وجوديّ» و«فضائيّ». النمط منتج في العربية المعاصرة لتحويل المصدر إلى صفة دالّة على المنتسب. يوازي survivalist بدقة."
    - lemma: "اسْتِبْقَائِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى «استبقاء» (طلب البقاء)، صيغة استفعال تفيد السعي والطلب. لكنها طويلة صرفياً وأقلّ تداولاً."
    - lemma: "حَرِيصُ الْبَقَاءِ"
      generation_method: tarkib
      justification: "مركب إضافي من «حريص» + «البقاء»، يصف من يشتدّ اهتمامه بالبقاء. لكنه وصف حرّ وليس مصطلحاً مسكوكاً."
    - lemma: "نَجَاتِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى «نجاة» (الخلاص والسلامة). ورد في موسوعة السلطان قابوس لأسماء العرب كاسم منسوب إلى النجاة. لكن «نجاة» تدلّ على الخلاص من خطر آنيّ أكثر من الاستعداد المسبق للبقاء."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُحَافِظ عَلَى الْبَقَاء"
      evidence_status: "no_material_found"

    - lemma: "مُهْتَمّ بِالْبَقَاء"
      evidence_status: "no_material_found"

    - lemma: "بَقَائِيّ"
      expands:
        - text: "«(بَقِيَ) الْبَاءُ وَالْقَافُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الدَّوَامُ. قَالَ الْخَلِيلُ: يُقَالُ: بَقِيَ الشَّيْءُ يَبْقَى بَقَاءً، وَهُوَ ضِدُّ الْفَنَاءِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ب ق ي أصل واحد يدلّ على الدوام والبقاء ضدّ الفناء، وهو الأساس الاشتقاقي المناسب للنسبة بَقَائِيّ"
        - text: "«بقاء — survival»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (أليكسو)"
          addition: "بقاء مقابل معتمد لـ survival في المعاجم المتخصصة"
        - text: "«البقاء: ثبات الشيء على الحالة الأولى ويضاده الفناء»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف كلاسيكي يؤكد دلالة البقاء على الاستمرار والثبات"

    - lemma: "اسْتِبْقَائِيّ"
      expands:
        - text: "«اسْتَبْقَيْتُ فُلَانًا، وَذَلِكَ أَنْ تَعْفُوَ عَنْ زَلَلِهِ فَتَسْتَبْقِيَ مَوَدَّتَهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "استبقاء في الاستعمال الكلاسيكي يدلّ على استبقاء المودة لا على طلب النجاة الذاتية"

    - lemma: "حَرِيصُ الْبَقَاءِ"
      evidence_status: "no_material_found"

    - lemma: "نَجَاتِيّ"
      expands:
        - text: "«نَجَاتِيّ — من (ن ج و) نسبة إلى نَجاة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "النسبة مستعملة كاسم علم فحسب، ولم تُسجَّل كمصطلح"
      contradicts:
        - text: "«نَجَا الْإِنْسَانُ يَنْجُو نَجَاةً... وَهُوَ مَعْنَى الذَّهَابِ وَالِانْكِشَافِ مِنَ الْمَكَانِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "النجاة تدلّ على الخلاص الآنيّ من خطر محدق (escape/deliverance)، لا على الاستعداد المنهجيّ المسبق للبقاء (survivalism)"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "مُحَافِظ عَلَى الْبَقَاء"
      decision: removed
      decision_reason: "عبارة وصفية حرّة وليست وحدة معجمية ثابتة. تخفق في اختبار السكّ: يمكن إبدال «محافظ» بـ«حريص» أو «ساعٍ» أو «عامل» دون تغيّر المعنى. كذلك «محافظ» في الاستعمال المعجمي المعاصر تدلّ على الوالي (governor) أو المتمسّك بالتقاليد (conservative)، ممّا يولّد لبساً دلالياً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُهْتَمّ بِالْبَقَاء"
      decision: removed
      decision_reason: "عبارة وصفية حرّة تخفق في اختبار السكّ (يمكن إبدال «مهتمّ» بـ«معنيّ» أو «مشغول»). و«مهتمّ» اسم فاعل عامّ لا يدلّ على التخصّص في حفظ البقاء. لا يوجد أيّ شاهد معجمي على تثبيت هذا المركب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بَقَائِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "نسبة منتظمة إلى «بقاء» على وزن فَعَالِيّ، تحاكي النمط الإنتاجيّ في العربية المعاصرة (وجوديّ، فضائيّ، عشوائيّ). الجذر ب ق ي أصل واحد يدلّ على الدوام والبقاء ضدّ الفناء (ابن فارس). المصطلح يقبل الجمع والتأنيث والنسبة (بَقَائِيّون، بَقَائِيَّة). يوازي survivalist بدقة دون لبس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مفرد منسوب إلى البقاء، يدلّ على من يتّخذ البقاء منهجاً ومذهباً، وليس مجرّد وصف عابر"
      actions:
        - command: create_entry
          params:
            lemma: "بَقَائِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اسْتِبْقَائِيّ"
      source: stage1
      decision: removed
      decision_reason: "صيغة طويلة صرفياً (سبعة مقاطع) تُعسّر التداول. و«استبقاء» في الاستعمال الكلاسيكي تعني العفو عن الزلل لا طلب النجاة. لا شاهد معجمي يؤيّد هذا الاستعمال."

    - lemma: "حَرِيصُ الْبَقَاءِ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفيّ-إضافيّ حرّ يخفق في اختبار السكّ، لا يختلف في بنيته عن اللمّتين المرفوضتين."

    - lemma: "نَجَاتِيّ"
      source: stage1
      decision: removed
      decision_reason: "«نجاة» تدلّ على الخلاص الآنيّ من خطر محدق (escape)، لا على الاستعداد المنهجيّ المسبق للبقاء (survivalism). النسبة وردت كاسم علم فحسب ولم تُثبَّت كمصطلح."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "شخص يحاول ضمان بقائه الشخصي أو بقاء مجموعته أو أمته"
    assessment:
      decision: revise
      reason: "التعريف الحالي قريب من الترجمة الحرفية للتعريف الإنجليزي ولا يُبرز السمة المميّزة للبقائيّ وهي الاستعداد المنهجيّ المسبق (التخزين، التدريب، التحصين). كما يفتقر إلى الجنس القريب الدقيق."
    authored:
      - type: terminological
        text: "شخصٌ يتّخذ من ضمان البقاء منهجاً عملياً، فيستعدّ للكوارث والأزمات باكتناز المؤن وتعلّم مهارات العيش الذاتيّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "من يحرص على بقائه أو بقاء جماعته بالتأهّب المسبق للطوارئ والنوازل"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخصٌ يتّخذ من ضمان البقاء منهجاً عملياً، فيستعدّ للكوارث والأزمات باكتناز المؤن وتعلّم مهارات العيش الذاتيّ"

  examples:
    per_lemma:
      - lemma: "بَقَائِيّ"
        examples:
          - text: "شيّد البَقَائِيّ ملجأً محصّناً في أرضه وخزّن فيه ما يكفي عائلته من الغذاء والماء لستّة أشهر."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "شيّد البَقَائِيّ ملجأً محصّناً في أرضه وخزّن فيه ما يكفي عائلته من الغذاء والماء لستّة أشهر."

