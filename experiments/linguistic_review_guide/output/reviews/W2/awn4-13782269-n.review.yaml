stage1_review:
  assessment:
    concerns:
      - "لمّة «تشغيلة» بدون تشكيل في البيانات الأصلية"
      - "لمّة «دفعة إنتاج» مركب إضافي يحتاج تحقق من التثبيت المعجمي"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزية ويحتاج إعادة صياغة"
    observations: "المفهوم يتعلق بالكمية المنتجة خلال دورة تشغيل واحدة مستمرة لآلة أو مصنع. هو كمية غير محددة (حسب المعمم المباشر) مرتبطة بالإنتاج الصناعي. المفهوم له حضور في المصطلحية العربية الحديثة عبر ألفاظ مثل «دُفْعَة» و«وَجْبَة» و«تَشْغِيلَة» في المعاجم التقنية الموحدة."
  blind_candidates:
    - lemma: "تَشْغِيلَة"
      generation_method: ishtiqaq
      justification: "اسم المرة من التشغيل على وزن تَفْعِيلَة، يدلّ على ناتج دورة تشغيل واحدة. اشتقاق طبيعي من الجذر ش غ ل الذي يشمل معاني العمل والتشغيل."
    - lemma: "دُفْعَةُ إِنْتَاجٍ"
      generation_method: tarkib
      justification: "مركب إضافي من «دُفْعَة» (ما يُدفع بمرة واحدة) و«إنتاج»، يحدّد نوع الدفعة بأنها إنتاجية لا مطرية أو مالية."
    - lemma: "نَوْبَةُ إِنْتَاجٍ"
      generation_method: tarkib
      justification: "مركب إضافي من «نوبة» (الدور والمرة) و«إنتاج»، لكن النوبة تدلّ على الفترة الزمنية أكثر من الكمية المنتجة."
    - lemma: "حَصِيلَة"
      generation_method: ishtiqaq
      justification: "من الجذر ح ص ل على وزن فَعِيلَة، بمعنى ما يُحصَّل ويُجمع. لكنها أعمّ من المطلوب إذ تشمل أي محصول أو ناتج."


stage2_evidence:
  per_lemma:
    - lemma: "تَشْغِيلَة"
      confirm:
        - text: "«تَشْغِيْلَةٌ — lot (batch)»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
      expands:
        - text: "«تشغيل مجدول لمجموعة انتاج — scheduled operation (of a generating set)»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يؤكد استخدام الجذر ش غ ل في سياق التشغيل الصناعي"

    - lemma: "دُفْعَةُ إِنْتَاجٍ"
      confirm:
        - text: "«إنتاج على دفعات، إنتاج متقطع — batch production»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«دفعة — كمية الأنسجة التي يمكن تشغيلها في مرحلة واحدة لتمييزها عن التشغيل المستمر»"
          source: "مسرد صناعة النسيج — ARABTERM"
        - text: "«الدُّفعة: كميّة المادة الضرورية لإنتاج شيءٍ ما بعملية واحدة»"
          source: "المورد الحديث (2008)"
        - text: "«دُفْعَة — مجموعةٌ من الوثائق، أو تسجيلاتِ المعطيات، التي تجري معالجتُها كوحدة»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«دُفْعَة، وَجْبَة — كمية من المادة الغذائية يتم تصنيعها في الشروط نفسها لمدّة زمنية واحدة في جهاز واحد»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«(الدفعة) من المطر الدفقة وما انصب من سقاء أو إناء بمرّة ويقال أعطاه ألفاً دفعة بمرّة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الأصل اللغوي: ما يُصبّ أو يُعطى بمرة واحدة، ثم توسّع للكمية المنتجة دفعةً"
        - text: "«الدَّفْعَة: انتهاء جماعة القوم إلى موضعٍ بمرّة / المرّة الواحدة»"
          source: "المعجم الكبير"
          addition: "يدلّ على فعل يقع بمرة واحدة، وهو أساس التوسّع إلى الإنتاج الدفعي"

    - lemma: "نَوْبَةُ إِنْتَاجٍ"
      evidence_status: "no_material_found"

    - lemma: "حَصِيلَة"
      contradicts:
        - text: "«الحصيلة: الحصيل. حصيلة الضرائب وحصيلة الأرباح: ما حصل منها. البقيّة»"
          source: "المعجم الوسيط"
          conflict: "الحصيلة تدلّ على الناتج المالي أو البقية، لا على كمية الإنتاج خلال دورة تشغيل محددة"
      expands:
        - text: "«حصيلة — crop / yield / production»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "تُستخدم بمعنى المحصول والعائد عموماً، وهي أوسع من مفهوم الدفعة الإنتاجية"


stage3_analysis:
  per_lemma:
    - lemma: "تَشْغِيلَة"
      decision: confirmed
      decision_reason: "اسم المرة من التشغيل، مثبت في المعجم الطبي الموحد بمعنى lot/batch. اشتقاق صرفي سليم على وزن تَفْعِيلَة يدلّ على الكمية الناتجة عن تشغيل واحد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على البُعد التشغيلي — الكمية المرتبطة بدورة تشغيل واحدة للآلة أو المصنع، بينما «دُفْعَة إنتاج» تركّز على البُعد الكمّي (مجموعة مُنتَجة معاً)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشْغِيلَة"

    - lemma: "دُفْعَةُ إِنْتَاجٍ"
      decision: confirmed
      decision_reason: "مركب إضافي مثبت في الاستعمال المصطلحي العربي الحديث. «دُفْعَة» وحدها مثبتة في عدة معاجم تقنية موحدة بمعنى batch، والمركب «دفعة إنتاج» يخصّص الدلالة بالسياق الصناعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تركّز على البُعد الكمّي — مجموعة منتجات أُنتجت معاً في ظروف واحدة، بينما «تشغيلة» تركّز على ارتباط الكمية بدورة التشغيل."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُفْعَةُ إِنْتَاجٍ"

    - lemma: "نَوْبَةُ إِنْتَاجٍ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استعمال هذا المركب. «النوبة» تدلّ على الفترة الزمنية (shift) لا على الكمية المنتجة، فلا تصلح لوصف الحاصل الإنتاجي."

    - lemma: "حَصِيلَة"
      source: stage1
      decision: removed
      decision_reason: "الحصيلة أعمّ دلالياً — تعني الناتج أو العائد عموماً (حصيلة الضرائب، حصيلة الأرباح)، ولا تختصّ بكمية الإنتاج خلال دورة تشغيل مستمرة. استعمالها هنا يوسّع المعنى بلا مسوّغ."


