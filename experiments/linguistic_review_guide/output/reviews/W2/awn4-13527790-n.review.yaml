# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-13527790-n  |  ILI: i107705
# POS: n  |  Concept: leaching (natural soil washing process)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «ترشيح» تُرجمت في جميع المعاجم التقنية المحكمة إلى «filtration» لا «leaching»؛ وهما عمليتان مختلفتان: الترشيح = فصل مادة صلبة عالقة بمرشّح مسامي، والغسل (leaching) = إذابة مواد ذائبة بالماء ونقلها عبر التربة؛ إبقاء «ترشيح» في المجموعة يُرسّخ خلطاً مصطلحياً بين العمليتين."
      - "التعريف الحالي يتضمّن «الترشيح» و«الغسل» كأنهما مرادفان في هذا السياق، وهو خطأ علمي ومصطلحي لأن الترشيح لا يُزيل مواد ذائبة بل عالقة."
      - "التعريف لا يُصرّح بالسياق الطبيعي (التربة، المياه الجوفية) الذي يُميّز leaching عن عمليات الغسل الصناعي."
    observations: >
      المجموعة تصف عملية Leaching — وهي العملية الجيولوجية/البيئية الطبيعية التي يتخلّل فيها
      الماءُ التربةَ أو الصخرَ، فيُذيب المواد القابلة للانحلال (كالأملاح والمعادن والمغذيات)
      وينقلها قسراً إلى طبقات أعمق أو إلى المياه الجوفية. من أهم الشواهد المعجمية: معجم المياه
      (2000) يُعرّف «غسل التربة» تعريفاً دقيقاً يطابق leaching، ومسرد المناخ والبيئة يُوضح
      الآلية الجيولوجية بالكامل. كذلك يُصرّح معجم الهندسة المدنية (2012) أن «نَضّ» (من الجذر
      ن-ض-ض: الماء يتسرّب قطرةً قطرةً) هو «المرادف العربي» لـleaching — وهو مصطلح مُهمَل
      في AWN4 يستحق إضافته في مراجعة مستقبلية.

  blind_candidates:
    - lemma: "النَّضْح"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ن-ض-ح): النَّضْح في اللغة هو رشُّ الماء وتسرّبه؛ «نضحت القِرْبة: رشحت»؛
        يُوحي بالسائل المتسرّب عبر مادة مسامية حاملاً ما ذاب فيها، وهو قريب من آلية leaching.
    - lemma: "الإِرْشَاح"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ر-ش-ح) على وزن إِفْعَال (متعدٍّ قسري)؛ الرَّشْح في الأصل هو النَّدى يبدو
        من الشيء؛ صيغة الإفعال توحي بتسريب مقصود أو تسبيب للرَّشح؛ يصلح للعملية المُدارة.
    - lemma: "التَّرَشُّح"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ر-ش-ح) على وزن تَفَعُّل (للتسرّب التلقائي الطبيعي)؛ «تَرَشَّحَ الماءُ»
        أي تسرّب من تلقاء نفسه؛ الصيغة مناسبة لعملية طبيعية كما يوحي تضمين المجموعة
        في قسم العمليات الطبيعية.
    - lemma: "الاسْتِنْضَاح"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ن-ض-ح) على وزن استفعال؛ يدل على استخراج المذابات أو طلب الرَّشح؛
        يُحاكي الفعل الموجَّه (استخلاص المعادن بالغسل) في التطبيقات التقنية والتعدينية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تَرْشِيح"
      contradicts:
        - text: "«التَّرْشِيحُ: تنقيةُ الماء ونحوه من المواد العالقة به. عند الكيمياويين: فصل الأجسام الصُّلْبة العالقة في سائل باستخدام مادة مسامية تسمح للسائل بالنفاذ خلاله مُحْتَجِزَةً الأجسام العالقة.»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            الترشيح يعمل على إزالة المواد العالقة الصلبة لا المواد الذائبة؛ leaching يُزيل
            مواد ذائبة لا عالقة — الآلية والمواد المُزالة مختلفتان جوهرياً.
        - text: "«التَّرشيح (عند البلاغيين): أن يُضاف إلى الاستعارة ما يلائم المستعار منه. (في الكيمياء) filtration: فَصْلُ الأجسام الصُّلبة العالقة في سائل باستخدام مادَّة مسامية.»"
          source: "المعجم الكبير (OCR)"
          conflict: "تأكيد صريح على أن التقابل الكيميائي للترشيح هو filtration لا leaching."
        - text: "«ترشيح: فصل المواد العالقة (وبعض المواد الذائبة) عملية تصفية الماء من المواد العالقة كالرمل والطمي وغيرها. — translation_en: filtration»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM"
          conflict: "مُرجَم صراحةً بـfiltration، وهو غير leaching."
        - text: "«ترشيح: تسرب الماء إلى التربة. — translation_en: percolation»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
          conflict: >
            حتى في دلالته الهيدرولوجية ترشيح = percolation (تسرّب الماء) لا leaching؛
            والفارق أن percolation لا يستلزم إذابة مواد ونقلها.

    - lemma: "غَسْل التُّرْبَة"
      confirm:
        - text: "«غسل التربة: 1- نزع الأملاح في الطبقة العليا للتربة باستخدام مياه قليلة الملوحة نسبياً. 2- نزع الملوثات الموجودة في مياه مستعملة مخزنة. — translation_en: leaching»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM"
        - text: "«غسل التربة — translation_en: leaching»"
          source: "مسرد الجغرافيا والتاريخ — ARABTERM"
        - text: "«غَسْل: عملية غسل المواد القابلة للانحلال من التربة أو من المعادن الخام أو من الفضلات المردومة ووصولها إلى مصدر مائي. نضٌّ (المرادف العربي) — translation_en: leaching»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
        - text: "«الغسل هو العملية التي من خلالها يتم غسل المواد القابلة للذوبان في التربة، مثل الأملاح والمواد الغذائية، والمبيدات الكيميائية أو الملوثات، ونقلها إلى طبقة سفلى من التربة أو حملها إلى المياه الجوفية التي قد تنقلها بعيداً. — translation_en: leaching»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ARABTERM"
      expands:
        - text: "«ارتشاح، غَسْل (شطف): إزالة المواد الذائبة من طبقة صلبة بواسطة ارتشاح المذيب من خلالها. — translation_en: leaching»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM"
          addition: >
            يُظهر أن «الارتشاح» يُعدّ مرادفاً جزئياً في سياق الأغذية، مما يُثبت أن
            «غسل» هو المكوّن الجوهري في مصطلح leaching العربي.

    - lemma: "النَّضْح"
      contradicts:
        - text: "«نضح: يدل النضح (أو التناضح) في العلوم الطبيعية، على تدفق في اتجاه محدد لجسيمات جزيئية من خلال طبقة فصل انتقائية أو شبه منفذة. مرور عفوي للماء أو مذيب آخر عبر غشاء شبه منفذ، الذي هو منفذ للمذيب، ولكن ليس منفذاً للمواد الذائبة. — translation_en: osmosis»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — ARABTERM"
          conflict: >
            «نضح» رُسِّخ في المصطلحية العلمية العربية بمعنى osmosis (التناضح الأسموزي)،
            عملية مختلفة تماماً عن leaching؛ استخدامه هنا سيُنشئ خلطاً مع مصطلح راسخ.
        - text: "«نَضْح — translation_en: exudation»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          conflict: "النضح = exudation (إفراز) في الطب، لا علاقة له بـleaching."
      expands:
        - text: "«(نَضَحَ) النُّونُ وَالضَّادُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى شَيْءٍ يُنَدَّى، وَمَاءٌ يُرَشُّ. فَالنَّضْحُ: رَشُّ الْمَاءِ. يُقَالُ: نَضَحْتُ الْبَيْتَ بِالْمَاءِ. وَنَضَحَ جِلْدُهُ بِالْعَرَقِ. وَالسَّانِيَةُ نَاضِحٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر يدل على الرَّشّ وبلّ الشيء بالماء؛ صلة دلالية بالغسل موجودة لكن المصطلح
            محجوز في الاستخدام الحديث لـosmosis وexudation.

    - lemma: "الإِرْشَاح"
      evidence_status: "no_material_found"

    - lemma: "التَّرَشُّح"
      expands:
        - text: "«رشح غسلي — translation_en: leaching»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — ARABTERM"
          addition: >
            «رشح غسلي» (مركب وصفي) هو المسكوك لـleaching لا «الترشّح» المجرّد؛
            يُبيّن أن القيد الوصفي «غسلي» ضروري لانتزاع دلالة leaching من الجذر.
        - text: "«(1) ترشيح؛ تخليل؛ تسريب / (2) ارتشاح؛ تخلُّل؛ تسرُّب — translation_en: infiltration»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >
            الارتشاح والترشّح يُرادفان infiltration (التسرّب) عموماً لا leaching تحديداً.

    - lemma: "الاسْتِنْضَاح"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تَرْشِيح"
      decision: removed
      decision_reason: >
        مصطلح محكم في المعجمية التقنية العربية بمعنى filtration (فصل المعلّقات الصلبة بمرشّح).
        يختلف جوهرياً عن leaching (إذابة الذوائب ونقلها). جميع المعاجم (الوسيط، الكبير،
        معجم المياه، الكيمياء، الطاقة المتجددة، الطب...) تُرجمه بـfiltration أو percolation.
        إبقاؤه في مجموعة leaching يُكرّس خلطاً مصطلحياً علمياً. لا تدعمه أدلة تربطه
        بالمعنى المقصود.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غَسْل التُّرْبَة"
      decision: confirmed
      decision_reason: >
        المصطلح المُثبَت في المصطلحية التقنية العربية لـleaching؛ موثَّق في معجم المياه (2000)
        ومسرد الجغرافيا والتاريخ ومسرد المناخ والبيئة ومعجم الهندسة المدنية بتعريفات تُطابق
        المفهوم العلمي بدقة. الجذران (غسل) و(ترب) عربيان أصيلان بجذور تراثية راسخة.
        المركب الإضافي مسكوك في عدة مصادر مستقلة. يجتاز اختبار التعبير المركب (لا يُبدَّل
        أحد مكوّنيه بمرادف مع بقاء الدلالة التقنية).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        المصطلح يُقيّد الغسل بالسياق الجيولوجي الطبيعي (التربة كوسط)، بخلاف «الغسل»
        المجرّد الذي يشمل عمليات صناعية وطبية وعلمية متعددة؛ كما يتمايز عن «الارتشاح»
        الذي يعني تسرّب الماء دون التركيز على إذابة المواد ونقلها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَسْل التُّرْبَة"

    - lemma: "النَّضْح"
      source: stage1
      decision: removed
      decision_reason: >
        رُسِّخ في المصطلحية العلمية العربية المعاصرة بمعنى osmosis (التناضح الأسموزي)
        وexudation (الإفراز)، وكلاهما يختلف اختلافاً جوهرياً عن leaching. استخدامه هنا
        سيُنشئ تضارباً مع مصطلح علمي راسخ. التعريفات الكلاسيكية تدل على الرَّشّ الخفيف
        وليس الإذابة والنقل.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الإِرْشَاح"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية مباشرة تربطه بـleaching؛ المادة المعجمية للجذر (رشح) تتوزع على
        معاني الرطوبة والندى والتسرّب، والمشتقات المسكوكة (ارتشاح) ترتبط بـinfiltration
        وexudation لا بـleaching. غياب التوثيق يمنع اعتماده.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "التَّرَشُّح"
      source: stage1
      decision: removed
      decision_reason: >
        «التَّرَشُّح» المجرّد لا يحمل دلالة leaching؛ المعجم الوحيد الذي يقترب من هذه
        الدلالة يستخدم المركّب الوصفي «رشح غسلي»، مما يُظهر أن القيد «غسلي» لازم
        للتفريق. «التَّرَشُّح» وحده يتداخل مع infiltration وpercolation.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "الاسْتِنْضَاح"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية من قواعد البيانات. الصيغة مولَّدة قياساً لكنها ليست مصطلحاً مسكوكاً
        ولا وحدة معجمية ثابتة موثَّقة. لا يجتاز اختبار التثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "عملية الترشيح أو الغسل لإزالة المواد القابلة للذوبان"
    assessment:
      decision: revise
      reason: >
        (١) يستخدم «الترشيح» بمعنى leaching مما يُرسّخ الخلط مع filtration — وقد أُزيلت
        اللمّة «ترشيح» من المجموعة لهذا السبب بالذات. (٢) لا يُحدّد السياق (التربة/الصخر).
        (٣) لا يُوضّح الآلية (تسرّب ماء + إذابة + نقل). (٤) لا يُصرّح بالوجهة (طبقات أعمق،
        مياه جوفية). (٥) لا يُشير إلى الطابع الطبيعي للعملية رغم أن التضمين الفوقي هو
        «عملية طبيعية».
    authored:
      - type: terminological
        text: "عَمَلِيَّةٌ طَبِيعِيَّةٌ يَتَخَلَّلُ فِيهَا الماءُ التُّرْبَةَ أو الصَّخْرَ مُذِيبًا المَوَادَّ القَابِلَةَ لِلذَّوَبانِ — كَالأَمْلاحِ وَالمُغَذِّيَاتِ وَالمُلَوِّثَاتِ — وَحَامِلًا إِيَّاهَا إِلَى طَبَقَاتٍ أَعْمَقَ أَو إِلَى الْمِيَاهِ الْجَوْفِيَّة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ظَاهِرَةٌ بِيئِيَّةٌ تَحْدُثُ حِينَ تَتَسَرَّبُ مِيَاهُ الأَمْطَارِ أو الرَّيِّ عَبْرَ طَبَقَاتِ التُّرْبَةِ، فَتَحْمِلُ مَعَهَا الأَمْلَاحَ وَالنِّتْرَاتِ وَالمُبِيدَاتِ إِلَى الطَّبَقَاتِ الأَعْمَقِ أو إِلَى الْمِيَاهِ الْجَوْفِيَّة؛ مِمَّا قَدْ يُفْقِرُ التُّرْبَةَ الزِّرَاعِيَّةَ وَيُلَوِّثُ مَصَادِرَ الْمِيَاهِ"
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13527790-n"
          definition_index: 0
          text: "عَمَلِيَّةٌ طَبِيعِيَّةٌ يَتَخَلَّلُ فِيهَا الماءُ التُّرْبَةَ أو الصَّخْرَ مُذِيبًا المَوَادَّ القَابِلَةَ لِلذَّوَبانِ — كَالأَمْلاحِ وَالمُغَذِّيَاتِ وَالمُلَوِّثَاتِ — وَحَامِلًا إِيَّاهَا إِلَى طَبَقَاتٍ أَعْمَقَ أَو إِلَى الْمِيَاهِ الْجَوْفِيَّة"
      - command: add_definition
