# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تضم لمّة واحدة فقط رغم وجود مرادف موثَّق (مُعَبِّرِيَّة) في معاجم معاصرة"
      - "التعريف الحالي «صفة كون الشيء معبراً» يقترب من الدوران الاصطلاحي بتوظيف مشتق الجذر نفسه في التعريف"
      - "كلمة تَعْبِيرِيَّة مشتركة بين دلالتين: التعبيرية الفنية (expressionism) وصفة التعبير (expressiveness)، مما يستوجب التمييز السياقي"
    observations: >-
      المفهوم —صفة كون الشيء معبراً— ينتمي إلى طبقة الخصائص المجردة التي تُصاغ عادةً
      في العربية بالمصدر الصناعي (ياء النسبة + التاء المربوطة). والجذر عبر وفير الاشتقاقات
      في المعاجم العربية الكلاسيكية والمعاصرة، مما يتيح عدة أوزان لهذا المفهوم.
      اللمّة الوحيدة تَعْبِيرِيَّة مأخوذة من المصدر تَعْبِير، وهي صحيحة قياساً،
      غير أن المصدر الصناعي من اسم الفاعل مُعَبِّر (→ مُعَبِّرِيَّة) يُركِّز على الصفة الكامنة
      في الشيء ذاته، وقد يكون أدق دلالةً على المفهوم المطلوب.
  blind_candidates:
    - lemma: "عِبَارِيَّة"
      generation_method: ishtiqaq
      justification: >-
        اشتقاق من عبارة (وزن فِعَالِيَّة بياء النسبة والتاء) على قياس «حضارة → حضاريّة».
        العبارة هي القالب اللغوي الذي يُعبَّر به، فالعبارية تدل على صفة كون الشيء ذا
        قدرة في التعبير. الجذر عبر نفسه، والاشتقاق من عبارة يُبرز الجانب الأسلوبي.
    - lemma: "إِفْصَاحِيَّة"
      generation_method: ishtiqaq
      justification: >-
        اشتقاق من إفصاح (المصدر من أفصح) بياء النسبة والتاء على وزن إِفْعَالِيَّة.
        الإفصاح في العربية يعني كشف المعنى وإبرازه، وهو قريب من مفهوم expressiveness
        من حيث القدرة على الإبانة والإيضاح.
    - lemma: "بَيَانِيَّة"
      generation_method: majaz
      justification: >-
        إحياء للفظ بيان بمعناه الكلاسيكي (الوضوح والقدرة على الإبانة) بإضافة ياء النسبة
        والتاء. البيان في العربية أصل فصيح يدل على القدرة على التعبير والإيضاح،
        وهو في كتب البلاغة مرادف للقدرة التعبيرية بمعناها الأعم.
    - lemma: "مُعَبِّرِيَّة"
      generation_method: ishtiqaq
      justification: >-
        اشتقاق من اسم الفاعل مُعَبِّر بياء النسبة والتاء، على قياس «موضوعي → موضوعيّة».
        المعبِّر هو الشيء الذي يعبِّر عن المعاني بكفاءة، فالمعبِّرية تدل على صفة كونه كذلك.
        الاشتقاق من اسم الفاعل يُركّز على الوصف الكامن في الشيء لا على فعل التعبير ذاته.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تَعْبِيرِيَّة"
      confirm:
        - text: "«تعبيرية: القدرة على التعبير.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (أرابترم)"
      contradicts:
        - text: "«تَعْبِيرِيّة: توجه فني في بداية العشرينات (سيزان، فان غوخ، غوغان، نولده، كوكوشكا) بصور تعبيرية وألوان زاهية.»"
          source: "مسرد صناعة النسيج، المنظمة العربية للتربية والثقافة والعلوم (أرابترم)"
          conflict: "الاستعمال هنا يدل على التعبيرية بوصفها مذهباً فنياً (Expressionism) لا صفةً دالةً على كون الشيء معبِّراً"
      expands:
        - text: "«تعبيرية: تدل في علم الوراثة على الاختلاف في المستويات الفردية لصفة مظهرية بين أفراد يحملون نفس التركيب الوراثي.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (أرابترم)"
          addition: "استعمال علم الوراثة للفظ يدل على توسعه التقني بمعنى expressivity (مدى ظهور سمة جينية)، وهو متقارب مع معنى المجموعة ومختلف في التخصص"
        - text: "«تعبيرية: مدى ظهور سمات وراثية في فرد يحمل الناسلات الأساسية المحددة لتلك السمات.»"
          source: "معجم المصطلحات الطبية ج.٢ (أرابترم، 2003)"
          addition: "استعمال تقني دقيق في علم الوراثة يكشف عن اتساع دلالي للفظ في المجالات العلمية"

    - lemma: "مُعَبِّرِيَّة"
      confirm:
        - text: "«(1) التعبير: قدرة إحدى الجينات على تعديل المُتَعضّي (أح) — (2) المُعَبِّرية: كون الشيء مُعَبِّرًا.»"
          source: "المورد الحديث (2008)"

    - lemma: "عِبَارِيَّة"
      evidence_status: "no_material_found"

    - lemma: "إِفْصَاحِيَّة"
      evidence_status: "no_material_found"

    - lemma: "بَيَانِيَّة"
      contradicts:
        - text: "«البيانية: طائفة من غلاة الشيعة، أتباع بيان بن سمعان التميمي، ظهر في أواخر الدولة الأموية، ويُنسب إليهم أنهم يقولون: إن روح الله تحلُّ في بعض الآدميين فيؤلهونهم.»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "اللفظ محجوز اصطلاحياً بوصفه اسم علم لفرقة دينية في المعجم الوسيط والمعجم الكبير معاً؛ فاستعماله دالاً على صفة التعبير سيُفضي إلى اشتراك لفظي مخلٍّ"
        - text: "«إِحدَى فِرَق غُلاة الشيعة، وتُنْسب إلى بَيَان بن سمعان التميمي.»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "تأكيد ثانٍ على أن اللفظ ثابت للفرقة الدينية لا للمفهوم المجرد"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تَعْبِيرِيَّة"
      decision: confirmed
      decision_reason: >-
        اللمّة موثَّقة في معاجم أرابترم الحديثة بمعنى expressiveness (القدرة على التعبير)
        المطابق لمعنى المجموعة. وجود المعنى الثاني (التعبيرية الفنية = expressionism)
        لا يُسقط هذا الاستعمال؛ إذ السياق الأدبي واللغوي يُزيل اللبس. المصدر الصناعي
        من تعبير وزن مطرد في العربية المعاصرة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تشير إلى القدرة التعبيرية بوصفها فعلاً وأسلوباً — أي مقدار ما يُبلَّغ به من
        معنى وكيفية إيصاله — مرتبطة بالمصدر تَعْبِير الدال على فعل الإفصاح، وتُستعمل
        في سياقات الأدب والفن والتواصل اللغوي بصفة عامة.

    - lemma: "مُعَبِّرِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        موثَّقة في المورد الحديث (2008) بالتعريف الحرفي «كون الشيء مُعَبِّرًا» المطابق
        تماماً لتعريف المجموعة (صفة كون الشيء معبراً). الاشتقاق صحيح قياسي من اسم الفاعل
        مُعَبِّر بياء النسبة والتاء على نمط منتج (موضوعي → موضوعيّة، شكلي → شكليّة).
        لا تعارض بين المصادر. اختبار التثبيت المعجمي ناجح (المورد الحديث يثبتها مصطلحاً).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تشير إلى الصفة الجوهرية الكامنة في الشيء التي تجعله في ذاته معبِّراً —
        مرتبطة باسم الفاعل مُعَبِّر الدال على الوصف لا على الفعل — وتُستعمل في
        السياقات التقنية والعلمية (كعلم الوراثة) حيث تُقاس صفة التعبير كمّياً.
      actions:
        - command: create_entry
          params: {lemma: "مُعَبِّرِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عِبَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا دليل معجمي على اللفظ. يتشارك مع تَعْبِيرِيَّة في الجذر (عبر) وفي الوظيفة
        الدلالية دون أن يُضيف فارقاً مفيداً؛ فهو منافس دون ضرورة اصطلاحية. يُفضَّل
        إبقاء تَعْبِيرِيَّة ذات الشيوع الأوسع.

    - lemma: "إِفْصَاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        الإفصاح في العربية يدل أساساً على الكشف والإعلان (بمعنى disclosure/transparency)
        وهو أخصّ من التعبيرية التي تشمل جماليات الأسلوب وقدرته الإيحائية. فضلاً عن
        غياب الدليل المعجمي، فإن هذا اللفظ أصلح للدلالة على مفهوم آخر.

    - lemma: "بَيَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        اللفظ محجوز اصطلاحياً في المعجمين الوسيط والكبير للدلالة على فرقة دينية
        (أتباع بيان بن سمعان التميمي)، فاستعماله سيوقع في اشتراك لفظي يُضر بالضبط
        المعجمي لشبكة AWN4.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "صفة كون الشيء معبراً"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مُقتضب ومائل إلى الدوران الاصطلاحي؛ يستعمل المشتق «معبراً»
        لتعريف المصدر الصناعي من الجذر ذاته دون تحديد جنس قريب أو فصل نوعي.
        يفتقر إلى إشارة لمجال تطبيق الصفة (اللغة / الأسلوب / العمل الفني)
        ودورها في نقل المعاني والمشاعر إلى المتلقي.
    authored:
      - type: terminological
        text: "مَزِيَّةٌ كامنةٌ في اللغة أو الأسلوب أو العمل الفني، تدلُّ على قدرته في نقل المعاني والمشاعر بصورة موحيةٍ تُؤثِّر في المتلقي وتُبلِّغه المراد"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كونُ الشيءِ واجداً من البيان والإيحاء ما يُوصل به ما يُرادُ إيصاله من معانٍ وأحاسيس"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَزِيَّةٌ كامنةٌ في اللغة أو الأسلوب أو العمل الفني، تدلُّ على قدرته في نقل المعاني والمشاعر بصورة موحيةٍ تُؤثِّر في المتلقي وتُبلِّغه المراد"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "كونُ الشيءِ واجداً من البيان والإيحاء ما يُوصل به ما يُرادُ إيصاله من معانٍ وأحاسيس"

