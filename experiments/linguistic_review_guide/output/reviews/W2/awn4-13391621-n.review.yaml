# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13391621-n  |  ILI: i106973  |  POS: n
# English: treasure — "any possession that is highly valued by its owner"
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «نفيسة» صفة مؤنثة (أو اسم علم) وليست اسمًا مستقلًا راسخًا بمعنى «الشيء المقتنى النفيس»، مما يُولِّد التباساً بين الوصف والمصطلح"
      - "اللمّتان الموجودتان مجردتان من التشكيل الكامل"
      - "المجموعة تفتقر إلى تعريف عربي يُعبِّر عن الدلالة بأسلوب المعجم الوسيط (الصياغة الحالية أقرب إلى الترجمة الحرفية)"
    observations: >
      المجموعة تمثّل مفهوم «الكنز» بمعناه الموسَّع: كل مقتنى يُعلي صاحبه من قدره ويضنّ به.
      اللمّة «كنز» راسخة في هذا المعنى المجازي منذ العصر الجاهلي (الزمخشري في أساس البلاغة:
      «ومن المجاز: معه كنز من كنوز العلم»). أما «نفيسة» فهي المؤنث الصرفي لصفة «نفيس»
      (ذو قيمة/خطر) وتُشكِّل اسمَ علمٍ شائعًا للنساء؛ ورودها كلمّة اسمية للمجموعة يُثير
      الاشتراك اللفظي ويُضعف الدقة المعجمية.

  blind_candidates:
    - lemma: "ذَخِيرَة"
      generation_method: majaz
      justification: >
        أصل الكلمة «ما يُذخَر ويُحرَز لقيمته»؛ والجذر ذخر في المقاييس يدل على
        «إحراز شيء يحفظه». انتقلت بالمجاز إلى كل مقتنى نفيس يحرص صاحبه على
        صونه لما يراه فيه من قيمة بالغة. إحياء للفظ عربي أصيل قبل أن يغلب
        عليه المعنى الحربي في العربية الحديثة.
    - lemma: "جَوْهَرَة"
      generation_method: majaz
      justification: >
        أصلها الحجر الكريم النفيس، وقد جرى استخدامها بالمجاز على كل ما يعدّه
        صاحبه من أثمن ما يملك، ماديًا كان أم معنويًا («هي جوهرة الأسرة»).
        المجاز من الشيء النفيس في ذاته إلى كل ما تعظم قيمته عند صاحبه.
    - lemma: "مَعَزَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر «عزز» على وزن مَفْعَلَة (قياسًا على مَأْدَبَة ومَثُبَة)،
        بمعنى الشيء الذي يُعزّ ويُقدَّر ويُحرص عليه؛ الوزن يدل على مكان
        الحدث أو الفعل، فمَعَزَّة = موضع/مناط الإعزاز.
    - lemma: "قُرَّةُ عَيْن"
      generation_method: tarkib
      justification: >
        تعبير اصطلاحي قرآني ثابت (﴿قُرَّتَ عَيْنٍ لِي وَلَكَ﴾) يدل على ما
        يُبهج صاحبه ويُسرّه لقيمته الذاتية عنده. المركب إضافي (idafi) وهو
        وحدة معجمية متثبِّتة في التراث والاستعمال.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "كنز"
      confirm:
        - text: "«الكَنْزُ: اسمٌ للمالِ إذا أُحرِزَ في وِعاءٍ ولِمَا يُحرَزُ فيه، وقيل: الكَنْزُ المالُ المدفون، وجمعه كُنوزٌ، كنَزَهُ يَكنِزُه كَنْزًا واكتَنَزَه»"
          source: "لسان العرب لابن منظور"
        - text: "«ومن المجاز: معه كنز من كنوز العلم»"
          source: "أساس البلاغة للزمخشري"
        - text: "«المال المدفون تحت الأرض — ما يُحرَزُ فيه المال»"
          source: "المعجم الوسيط (OCR)"
        - text: "«treasure → (1) كَنْز (2) ثروة (3) يدَّخِر (4) يُعِزّ to treasure happy memories»"
          source: "المورد الحديث (2008)"
        - text: "«كنَزَ المالَ: جمعه وادَّخره، ولم يؤدِّ حقَّه... {وَالَّذِينَ يَكْنِزُونَ الذَّهَبَ وَالْفِضَّةَ}»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«الكَنْز: جمع المال بعضه على بعض وادخاره. وقيل المال المدفون. وقد صار في الدين اسماً لكل مال لم يُخرَج منه الواجب وإن لم يكن مدفونًا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«الكَنْزُ: هو المالُ الموضوعُ في الأرض، هذا هو الأصل، ثم تُجُوِّزَ فيه»"
          source: "تاج العروس لمرتضى الزبيدي"
          addition: "يثبت أن «كنز» أصله مقيّد بالمال المادي المدفون، ثم توسّع مجازًا ليشمل كل ما يُعزّ ويُحرَص عليه؛ وهذا التوسُّع هو ما تمثّله المجموعة"

    - lemma: "نفيسة"
      contradicts:
        - text: "«نَفِيسَة: مِنْ (ن ف س) العظيمةُ القَدر، والكبيرةُ الخَطر، والغاليةُ، والمرأةُ النفيسةُ المرغوبُ فيها أو المضنونُ بها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المدخل يُثبت أن «نفيسة» صفة مؤنثة أو اسم علم للنساء، لا اسمٌ مستقل بمعنى «الشيء المقتنى النفيس»"
        - text: "«وشيءٌ نفيسٌ، أي ذو نَفْسٍ وخَطَرٍ يُتنافَسُ به. والتَّنافُس: أن يُبرِزَ كلُّ واحدٍ من المتبارزَيْن قوةَ نَفسِه»"
          source: "مقاييس اللغة لابن فارس (جذر نفس)"
          conflict: "ابن فارس يُورد «نفيس» بوصفه صفة مشبهة مشتقة من «النَّفْس/الخطر»، لا اسمًا جامدًا يصلح لمّةً مستقلة للمجموعة"
        - text: "«precious → (1) نفيس؛ كريم precious metals — (2) عزيز؛ أثير precious recollections»"
          source: "المورد الحديث (2008)"
          conflict: "يؤكد أن «نفيس/نفيسة» ترجمةٌ للصفة precious وليست مقابلًا للاسم treasure"

    - lemma: "ذَخِيرَة"
      contradicts:
        - text: "«(الذَّخِيرَة) الذخرُ وعدةُ الحربِ من رصاصٍ وقذائفَ (محدثة). (ج) ذخائر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعنى الحديث المرسَّخ لـ«ذخيرة» هو الذخيرة الحربية؛ ما يُولِّد اشتراكًا لفظيًا حادًا يحول دون اعتمادها مصطلحًا لـ«المقتنى النفيس»"
        - text: "«ما ادُّخِرَ — عدةُ الحربِ من رصاصٍ وقذائفَ (محدثة)»"
          source: "المعجم الكبير (OCR)"
          conflict: "التعريفان (القديم والمحدث) يتنافسان داخل المدخل نفسه، والمعنى الحربي هو الغالب في الاستعمال الراهن"

    - lemma: "جَوْهَرَة"
      expands:
        - text: "«jewel» (مجال: Chemistry / Geography)"
          source: "ARABTERM — المعجم الموحد لمصطلحات الكيمياء / مسرد الجغرافيا والتاريخ"
          addition: "تثبت أن «جوهرة» مصطلح تقني للحجر الكريم/المجوهر في التراث الاصطلاحي الحديث، ودلالتها أضيق من «أي مقتنى يُقدِّره صاحبه»"

    - lemma: "مَعَزَّة"
      contradicts:
        - text: "«مُعِزَّة: مِنْ (ع ز ز) مؤنث مُعِزّ»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الكلمة الموجودة في قاعدة البيانات هي «مُعِزَّة» (اسم فاعل مؤنث من أعزَّ = التي تُعزّ) لا «مَعَزَّة» (مَفعَلَة من عزّ). المصطلح المُولَّد غير مُثبَت معجميًا، فضلًا عن اشتراكه الصوتي مع «مَعَزَة» (الشاة الأنثى)"

    - lemma: "قُرَّةُ عَيْن"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "كنز"
      decision: confirmed
      decision_reason: >
        لمّة راسخة وأصيلة؛ أثبتت المعاجم الكلاسيكية والحديثة استخدامها بمعنى «المال
        المحرَز النفيس»، وأثبت الزمخشري توسّعها المجازي لتشمل كل ما يُعزّ ويُقدَّر
        (كنوز العلم). المورد الحديث يُحددها المقابل الأول لـ treasure. تشكيلها الكامل
        غائب من السجل → تصحيح مطلوب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكَّدة في المجموعة؛ تجمع بين الأصل المادي (المال المدفون/المحرَز)
        والتوسع المجازي الشامل (كل ما يُضنّ به لقيمته البالغة). لا تقتصر على الثروة
        المالية بل تمتد إلى الذكريات والخبرات والعلاقات، وهو ما تُجسِّده المجموعة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَنْزٌ"

    - lemma: "نفيسة"
      decision: removed
      decision_reason: >
        «نَفِيسَة» صيغةُ المؤنث للصفة «نَفِيس» (ذو قيمة/خطر)، وهي في الوقت نفسه
        اسمُ علَمٍ شائعٌ للنساء. لا يثبت لها المعجمُ وضعُ الاسم الجامد الدالّ على
        «الشيء المقتنى النفيس» دون اعتماد الصفة في سياق إحالي. اعتمادها لمّةً يُولِّد
        التباسًا بين الوصف والمصطلح، ويُخلط بينها وبين الاسم العلَم. لا تجتاز
        اختبار السكّ: يمكن إبدال «نفيسة» بـ«غالية» أو «ثمينة» في أي سياق وصفي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ذَخِيرَة"
      source: stage1
      decision: removed
      decision_reason: >
        غلب على «ذخيرة» في العربية المعاصرة المعنى الحربي (الرصاص والقذائف) حتى أصبح
        هو المعنى الأول في المعاجم الحديثة. الاستخدام في سياق «المقتنى النفيس» سيُولِّد
        لَبْسًا دلاليًا خطيرًا في السياقات المهنية والعامة. علاوة على ذلك، المعنى الأصلي
        (ما يُدَّخر) متداخل مع «كنز» دون إضافة دلالية مميِّزة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "جَوْهَرَة"
      source: stage1
      decision: removed
      decision_reason: >
        «جوهرة» مقيَّدة في الاستعمال الاصطلاحي بالحجر الكريم والمجوهرات المادية
        (jewel/gem)؛ دلالتها أضيق من «أيّ مقتنى يُقدِّره صاحبه» الذي يشمل المعنوي
        والرمزي. استخدامها المجازي («هي جوهرة الأسرة») لا يرقى إلى مصطلح معجمي
        ثابت. المجموعة الأُمّ awn4-00032912-n تشمل الحيازات غير المادية، مما يجعل
        «جوهرة» أضيق دلالةً من المطلوب.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مَعَزَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الكلمة المُولَّدة (مَعَزَّة على وزن مَفعَلَة بمعنى «ما يُعزّ») غير مُثبَتة في
        قواعد البيانات المعجمية بهذا الوزن وهذه الدلالة. ما وُجد هو «مُعِزَّة» (مؤنث
        مُعِزّ)، وهي كلمة مختلفة. إضافةً إلى ذلك، «مَعَزَة» (بتخفيف الزاي) تعني
        الشاة الأنثى، وهذا اشتراك لفظي يُعيق التوثيق.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "قُرَّةُ عَيْن"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير الاصطلاحي «قرة عين» يدل على ما يُبهج ويُسرّ القلب في السياق العاطفي
        (الأشخاص بصفة خاصة). لم يثبت له استخدام معجمي ثابت بمعنى «المقتنى الذي
        تعظم قيمته لدى صاحبه» عمومًا. فضلًا عن ذلك، اختبار MWE يُظهر أن
        «قرة» قابلة للإبدال بـ«بهجة»/«فرحة» في نفس السياق → ليس تعبيرًا مسكوكًا
        صارمًا بالمعنى المطلوب. حذفه لا يُخلّ بالمجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "أي ممتلكات يقدرها صاحبها تقديراً عالياً"
    assessment:
      decision: revise
      reason: >
        الصياغة الحالية ترجمة حرفية للتعريف الإنجليزي. «ممتلكات» جمعٌ وإن كانت المجموعة
        تدل على المفرد (possession). التركيب «يقدرها تقديراً عالياً» مكرَّر صوتيًا دون
        إضافة دلالية. التعريف يفتقر إلى الجنس القريب الواضح والفصل النوعي المحكم
        بأسلوب المعجم الوسيط.
