# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-15259561-n (minute — دقيقة)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «دقيقة» واردة بدون تشكيل كامل"
    observations: >
      المجموعة تتضمن مفهوماً زمنياً أساسياً ومعروفاً في العربية منذ العصر الحديث.
      اللفظ «دقيقة» مسكوك ومستقر في الاستعمال العربي المعاصر، وهو مأخوذ من معنى
      الصِّغَر والدِّقَّة (جذر دقق)، أي الجزء الدقيق الصغير من الساعة.
      المجموعة تحتوي لمّة واحدة فقط وهو أمر طبيعي لمفهوم مستقر كهذا.
  blind_candidates:
    - lemma: "دَقِيقَة"
      generation_method: ishtiqaq
      justification: >
        من جذر «دقق» على وزن فَعِيلَة بمعنى الجزء الدقيق الصغير،
        وهو الاشتقاق الطبيعي للدلالة على الوحدة الزمنية الصغيرة من الساعة.
    - lemma: "سُتِّينِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «ستين» على وزن فُعِّيلِيَّة، للدلالة على الجزء
        من ستين من الساعة. توليد نظري لا شيوع له.
    - lemma: "جُزْءُ السَّاعَة"
      generation_method: tarkib
      justification: >
        مركب إضافي يصف المفهوم وصفاً مباشراً: الجزء من الساعة.
        لكنه عبارة وصفية وليس مصطلحاً مسكوكاً.
    - lemma: "مِنُتَة"
      generation_method: taarib
      justification: >
        تعريب للفظ الإنجليزي minute / اللاتيني minuta.
        ملاذ أخير لا حاجة إليه لوجود البديل العربي الأصيل.

stage2_evidence:
  per_lemma:
    - lemma: "دَقِيقَة"
      confirm:
        - text: "«وحدة زمنية تعادل جزءاً من ستين جزءاً من الساعة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(مِنَ الوَقْتِ) minute : وَحدَةٌ زَمَنِيَّةٌ تساوى جُزْءًا من سِتِّين جُزْءًا من السَّاعَةِ»"
          source: "المعجم الكبير (OCR)"
        - text: "«(الدقيقة) وحدة زمنية تعادل جُزْءا من سِتِّينَ جُزْءا من السَّاعَة ووحدة لقياس خطوط الطول أَو الْعرض تَسَاوِي جُزْءا من سِتِّينَ جُزْءا من الدرجَة (مج)(ج) دقائق (محدثة)»"
          source: "المعجم الوسيط (Hawramani)"
        - text: "«الدقِيقَةُ: قسم من سِتِّينَ قسما من الدرجَة إِذا قسمت عَلَيْهَا»"
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "«(عند الجُغْرافِيِّين): وَحدَةٌ لِقِياسِ خُطُوط الطُّولِ, ودَوائِر العَرْضِ, تُساوِى جُزْءًا من سِتِّين جُزْءًا من الدَّرَجَةِ»"
          source: "المعجم الكبير (OCR)"
          addition: "الدقيقة تُستعمل أيضاً في الجغرافيا والفلك لقياس الدرجات"
        - text: "«الدقيقة: وَهِي السِّرّ الدَّقِيق الَّذِي لَا يطلع عَلَيْهِ كل أحد»"
          source: "دستور العلماء للأحمدنكري"
          addition: "معنى اصطلاحي صوفي/فلسفي مغاير للمعنى الزمني"
    - lemma: "سُتِّينِيَّة"
      evidence_status: "no_material_found"
    - lemma: "جُزْءُ السَّاعَة"
      evidence_status: "no_material_found"
    - lemma: "مِنُتَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "دَقِيقَة"
      decision: confirmed
      decision_reason: >
        لفظ عربي أصيل مشتق من جذر «دقق» على وزن فَعِيلَة، مثبت في جميع المعاجم
        الحديثة (المعجم الوسيط، المعجم الكبير) بالمعنى الزمني المطلوب. لا خلاف
        على استعماله وهو المصطلح المعياري الوحيد في العربية الفصحى المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة في المجموعة؛ لا حاجة للتمييز"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَقِيقَة"
    - lemma: "سُتِّينِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        توليد نظري لا شيوع له في أي معجم عربي ولا في الاستعمال.
        لفظ «دقيقة» مستقر ولا حاجة لبديل.
    - lemma: "جُزْءُ السَّاعَة"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة وليست مصطلحاً مسكوكاً. يمكن إبدال «جزء» بـ«قسم»
        أو «حصة» وتبقى العبارة صالحة، مما يُفشلها في اختبار السَّكّ.
    - lemma: "مِنُتَة"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب لا حاجة إليه مع وجود اللفظ العربي الأصيل «دقيقة» المتداول
        والمستقر. يخالف مبدأ إيثار العربي على الأعجمي.

