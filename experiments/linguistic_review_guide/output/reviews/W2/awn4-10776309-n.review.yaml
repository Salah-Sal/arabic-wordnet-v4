stage1_review:
  assessment:
    concerns:
      - اللمة "صاحب خيال" قد تعتبر عبارة وصفية أكثر منها لمة معجمية مسكوكة، لكنها شائعة الاستخدام.
      - غياب مصطلح "رؤيوي" و"طوباوي" وهما من أدق المرادفات لـ visionary في السياق الفكري.
    observations: "المجموعة تعبر عن مفهوم الشخص الحالم أو المثالي الذي يبتعد عن الواقع. اللمات الموجودة صحيحة ولكنها تحتاج إلى إغراء بمرادفات أكثر دقة وتشكيل كامل."
  blind_candidates:
    - lemma: "حَالِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الحلم، وهو المصطلح الأكثر شيوعاً للتعبير عن الشخص الذي يعيش في أوهامه أو أحلامه."
    - lemma: "خَيَالِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الخيال، ويطلق على الشخص الذي يغلب عليه التصور الذهني بعيداً عن الواقع."
    - lemma: "طُوبَاوِيّ"
      generation_method: taarib
      justification: "نسبة إلى (طوبيا/يوتوبيا)، ويستخدم للمثالي الذي ينشد كمالاً غير ممكن."
    - lemma: "رُؤْيَوِيّ"
      generation_method: ishtiqaq
      justification: "مشتق من الرؤية (vision)، ويستخدم للشخص صاحب النظرة البعيدة أو الحالم بمستقبل مختلف."

stage2_evidence:
  per_lemma:
    - lemma: "حَالِم"
      confirm:
        - text: "الحالم: شخص تغلب الصفة غير العملية على فكراته ومشاريعه."
          source: "المورد الحديث (2008)"
    - lemma: "خَيَالِيّ"
      confirm:
        - text: "رجلٌ خَيالِيٌّ: لا يَعيش فى عالم الواقِع"
          source: "المعجم الكبير"
        - text: "خياليّ؛ مثاليّ؛ غير عمليّ"
          source: "المورد الحديث (2008)"
    - lemma: "طُوبَاوِيّ"
      expands:
        - text: "طوباوية: فضاء يحصل فيه البطل على الانتصار... لاختراق أجواء المستحيل... كما في المدن الفاضلة للفلاسفة."
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يدعم استخدام 'طوباوي' لوصف الشخص الذي ينشد هذه الحالة."
    - lemma: "رُؤْيَوِيّ"
      confirm:
        - text: "visionary: (1) «أ» كثير الرّؤى. «ب» حالم (3) شخصٌ كثير الرؤى"
          source: "المورد الحديث (2008)"
    - lemma: "صَاحِب خَيَال"
      confirm:
        - text: "خيال: ظن، وهم، ما تشبه لك من صورة في اليقظة أو في الحلم"
          source: "تكملة المعاجم العربية لوزي"

