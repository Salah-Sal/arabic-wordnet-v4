stage4_content:
  definition:
    current: "شخص يميل إلى التخيلات الحالمة والحماس مع قلة اكتراث بما هو ممكن فعلياً"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي طويل، يفضل صياغته بأسلوب معجمي أكثر إيجازاً ودقة."
    authored:
      - type: terminological
        text: "مَنْ يَغْلِبُ عَلَيْهِ التَّخَيُّلُ وَالأَحْلَامُ وَيَسْعَى لِتَحْقِيقِ أَهْدَافٍ مِثَالِيَّةٍ دُونَ اعْتِبَارٍ لِلْوَاقِعِ أَوِ الإِمْكَانِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-10776309-n", definition_index: 0, text: "مَنْ يَغْلِبُ عَلَيْهِ التَّخَيُّلُ وَالأَحْلَامُ وَيَسْعَى لِتَحْقِيقِ أَهْدَافٍ مِثَالِيَّةٍ دُونَ اعْتِبَارٍ لِلْوَاقِعِ أَوِ الإِمْكَانِ."}
  examples:
    per_lemma:
      - lemma: "حَالِم"
        examples:
          - text: "عاشَ حَيَاتَهُ حَالِمًا بِمُجْتَمَعٍ يَخْلُو مِنَ الفَقْرِ وَالظُّلْمِ."
            type: usage
      - lemma: "صَاحِب خَيَال"
        examples:
          - text: "إِنَّهُ صَاحِبُ خَيَالٍ وَاسِعٍ يَجْعَلُهُ يَبْتَكِرُ حُلُولًا غَيْرَ مَلُوفةٍ."
            type: usage
      - lemma: "خَيَالِيّ"
        examples:
          - text: "هُوَ رَجُلٌ خَيَالِيٌّ لَا يَرَى العَقَبَاتِ الصَّعْبَةَ فِي طَرِيقِهِ."
            type: usage
      - lemma: "طُوبَاوِيّ"
        examples:
          - text: "كَانَ طُوبَاوِيًّا فِي طَرْحِهِ لِحُلُولِ المَشَاكِلِ الاِقْتِصَادِيَّةِ."
            type: usage
      - lemma: "رُؤْيَوِيّ"
        examples:
          - text: "يُعْتَبَرُ القَائِدُ الرُّؤْيَوِيُّ مَنْ يَسْبِقُ زَمَانَهُ بِتَصَوُّرَاتِهِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-10776309-n", text: "كَثِيرٌ مِنَ المُخْتَرِعِينَ كَانُوا يُوصَفُونَ بِأَنَّهُمْ حَالِمُونَ قَبْلَ نَجَاحِ ابْتِكَارَاتِهِمْ."}

stage5_enrichment:
  per_entry:
    - lemma: "حَالِم"
      entry_id: "{auto}"
      root: "حلم"
      maqayis_quote: "«الْحَاءُ وَاللَّامُ وَالْمِيمُ، أُصُولٌ ثَلَاثَةٌ... وَالثَّالِثُ رُؤْيَةُ الشَّيْءِ فِي الْمَنَامِ.»"
    - lemma: "خَيَالِيّ"
      entry_id: "{auto}"
      root: "خيل"
      maqayis_quote: "«الْخَاءُ وَالْيَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَرَكَةٍ فِي تَلَوُّنٍ. فَمِنْ ذَلِكَ الْخَيَالُ، وَهُوَ الشَّخْصُ. وَأَصْلُهُ مَا يَتَخَيَّلُهُ الْإِنْسَانُ فِي مَنَامِهِ.»"
    - lemma: "رُؤْيَوِيّ"
      entry_id: "{auto}"
