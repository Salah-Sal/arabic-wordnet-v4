      maqayis_quote: "«الرَّاءُ وَالْهَمْزَةُ وَالْيَاءُ أَصْلٌ يَدُلُّ عَلَى نَظَرٍ وَإِبْصَارٍ بِعَيْنٍ أَوْ بَصِيرَةٍ.»"
    - lemma: "طُوبَاوِيّ"
