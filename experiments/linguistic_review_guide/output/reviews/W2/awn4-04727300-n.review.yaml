# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# synset: awn4-04727300-n  |  ili: i61852  |  pos: n
# definition_en: the quality of being painful
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة 'وجع' تُشير إلى الألم ذاته (اسم جامع لكل مرض مؤلم)، لا إلى الصفة المجردة لكون الشيء مؤلماً؛ وهذا تداخل مع مجموعة ترادفية مختلفة (pain/ache)"
      - "لمّة 'إيلام' مصدر فِعلي يدل على الفِعل (توليد الألم، algogenesis)، وإن كان مقبولاً بالتوسع للدلالة على خاصية الإيلام"
      - "التعريف الحالي يستخدم 'مؤلم' المشتق من الجذر ذاته (ألم) مما يُقرِّبه من الدوران الاصطلاحي، ويحتاج صياغة أدق"
      - "غياب مصطلح مجرد (مصدر صناعي) يُعبِّر بدقة عن 'خاصية الإيلام' كما في painfulness"
    observations: >
      المجموعة تستهدف مفهوماً فلسفياً مجرداً هو «صفة كون الشيء مؤلماً» ضمن تصنيف الخصائص
      (hypernym: جودة/نوعية). اللمّات الحالية متفاوتة الدقة: إيلام مناسب بالتوسع الدلالي،
      ووجع خاطئ المجموعة إذ هو الألم ذاته لا صفته. يُستحسن إضافة أَلِيمِيَّة (مصدر صناعي
      دقيق) ومَضَضٌ (يغطي بُعد distressingness — خاصية الحرقة الوجدانية).
  blind_candidates:
    - lemma: "أَلِيمِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن فَعِيلِيَّة من الصفة أَلِيم (painful/agonizing)؛ يُعبِّر بدقة عن الصفة المجردة لكون الشيء مؤلماً، قياسي الاشتقاق كإنسانية وحيوانية ومادية وروحانية"
    - lemma: "وَجَعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الاسم وَجَع بإضافة ياء النسب والتاء المربوطة؛ يُصوِّر خاصية الإيلام الجسدي المحسوس، وإن كان أقل دقة من أليمية"
    - lemma: "مَضَضٌ"
      generation_method: majaz
      justification: "لفظ عربي أصيل يدل على الحرقة والمشقة الباطنية؛ يُستعار ليُمثِّل خاصية الإيلام الوجداني والضغط الداخلي المؤلم (distressingness)؛ قال الجوهري: المضض وجع المصيبة"
    - lemma: "أَذِيَّة"
      generation_method: ishtiqaq
      justification: "من جذر أذى، وزن فَعِيلَة، يدل على الأذى والضرر المُلحَق؛ فيه معنى الإيجاع والإيذاء وإن كان أعمّ من الإيلام"


stage2_evidence:
  per_lemma:
    - lemma: "إيلام"
      confirm:
        - text: "«إِيْلام: algogenesia»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إِيْلام: algogenesis»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مضض؛إيلام: tenderness»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إيلامٌ حَرارِيّ: thermalgesia / thermoalgesia»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إيلامٌ ارْتِدادِيّ: rebound tenderness»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«إيلامُ السُّباتِي: carotidynia / carotodynia»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُوظَّف إيلام في المصطلح الطبي وصفاً لأنواع الألم الخاص، مما يُرسِّخ دلالته على خاصية الإيلام لا على الفعل المجرد"

    - lemma: "وجع"
      contradicts:
        - text: "«الوجع: اسم جامع لكل مرض مؤلم»"
          source: "المعجم الوسيط"
          conflict: "وجع يدل على الألم ذاته (pain/ache) لا على الصفة المجردة لكون الشيء مؤلماً (painfulness)؛ وهو تداخل مع مجموعة مغايرة"
        - text: "«الوجع: المرض المؤلم، اسم جامع له، ج: أوجاع»"
          source: "تاج العروس لمرتضى الزبيدي"
          conflict: "مادة الوجع لا تُفيد الصفة المجردة بل تصف حالة الألم الحسية المُعاشة"
        - text: "«الوجع: المرض والألم»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "تعني الحالة الصحية المؤلمة لا خاصية توليد الألم"
      expands:
        - text: "«الوجع، محركة: المرض. وجع كسمع، ووعد لغية، يوجع... وضرب وجيع: مُوجِع»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الصفة وجيع بمعنى مُوجِع (painful) هي الأقرب للمجموعة، لكن الاسم وجع يبقى للألم لا لصفته"
        - text: "«(وَجَعَ) الْوَاوُ وَالْجِيمُ وَالْعَيْنُ: كَلِمَةٌ وَاحِدَةٌ، هِيَ الْوَجَعُ: اسْمٌ يَجْمَعُ الْمَرَضَ كُلَّهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر وجع في أصل اللغة يجمع المرض كله وليس الصفة المجردة"

    - lemma: "أَلِيمِيَّة"
      evidence_status: "no_material_found"

    - lemma: "وَجَعِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مَضَضٌ"
      confirm:
        - text: "«والمَضَضُ: وجعُ المصيبةِ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«وَالْمَضَضُ وَجَعُ الْمُصِيبَةِ»"
          source: "مختار الصحاح للرازي"
        - text: "«والمَضَضُ: وجع المصيبة، وقد مَضِضتَ يا رجل منه، بالكسر، تَمَضُّ مَضَضاً ومَضِيضاً ومَضاضة»"
          source: "لسان العرب لابن منظور"
        - text: "«(مَضَّ) الْمِيمُ وَالضَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ضَغْطِ الشَّيْءِ لِلشَّيْءِ. مِنْهُ مَضَّنِي الشَّيْءُ وَأَمَضَّنِي: بَلَغَ مِنِّي الْمَشَقَّةَ، كَأَنَّهُ قَدْ ضَغَطَكَ. وَالْكُحْلُ يُمِضُّ الْعَيْنَ، إِذَا كَانَتْ لَهُ حُرْقَةٌ. وَمَضِيضُهُ: حُرْقَتُهُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«م ض ض: أَمَضَّهُ الجُرحُ أَوجَعَهُ ومَضَّهُ لُغَةٌ فِيهِ. والكُحلُ يَمُضُّ العَينَ أَي يُحرِقُها. والمَضَضُ وَجَعُ المُصيبَةِ»"
          source: "مختار الصحاح للرازي"
      expands:
        - text: "«مضض؛إيلام: tenderness»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "اقتران مضض مع إيلام في المصطلح الطبي للدلالة على tenderness يُعزِّز صلته بخاصية الإيلام"
        - text: "«المضّ الحُرقَةُ؛ مَضَّني الهمُّ والحُزنُ والقَولُ يَمُضُّني مَضَّاً ومَضيضاً وأَمضَّني: أحرقَني وشَقَّ عليَّ»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "يُبيِّن أن المضض يمتد ليشمل الحرقة الوجدانية والنفسية، مما يُغطي بُعد distressingness في المجموعة"

    - lemma: "أَذِيَّة"
      contradicts:
        - text: "«أَذِيَّة: insult / insultus»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الاستعمال الطبي يقصر أذية على 'الإصابة/الأذى' لا على 'خاصية الإيلام'، بل تدور حول الاعتداء والضرر المباشر"
        - text: "«الأَذِيَّة: الأذى»"
          source: "المعجم الوسيط"
          conflict: "أذية مرادف للأذى (harm/annoyance) وهو أعمّ وأوسع من الإيلام، ولا يدل تحديداً على صفة كون الشيء مؤلماً"


stage3_analysis:
  per_lemma:
    - lemma: "إيلام"
      decision: confirmed
      decision_reason: "رغم أن إيلام مصدر فِعلي يدل على «توليد الألم»، فإن الاستعمال الطبي الحديث وسَّع دلالته ليشمل خاصية الإيلام (algogenesis: the quality of producing pain) وحساسية الأنسجة للألم (tenderness). وقد استقر في المعجم الطبي الموحد مُعادلاً لمصطلحات تدل على هذه الخاصية المجردة. اللمّة بحاجة إلى تشكيل كامل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبِّر عن الخاصية الفاعلة في توليد الألم الجسدي بصورة علمية وطبية، ويتضمن معنى النشاط والإحداث (agent of pain)؛ أكثر تخصصاً واستعمالاً في السياق الطبي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيلامٌ"

    - lemma: "وجع"
      decision: removed
      decision_reason: "وجع يدل على الألم ذاته وعلى المرض المؤلم ('اسم جامع لكل مرض مؤلم') — وهو مفهوم مغاير لـ painfulness (صفة كون الشيء مؤلماً). إدراجه في هذه المجموعة يخلط بين الحالة (pain) وصفتها (painfulness)، وهو خطأ تصنيفي في ضوء أن الـhypernym هو 'quality' (جودة/نوعية). يجب حذف هذا الربط."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "أَلِيمِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي قياسي من الصفة أليم (painful) يُعبِّر بدقة عن الصفة المجردة لكون الشيء مؤلماً، وهو الجوهر الدلالي للمجموعة. التشكيل: فَعِيلِيَّة. لا يرد في المعاجم لأنه حديث الاستعمال المصطلحي، غير أنه قياسي صرفياً ومقبول وضعاً جديداً. اجتاز اختبار السك: لا يمكن إبدال أليم بمرادف بلا تغيير صيغة الاشتقاق."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبِّر عن الصفة الجوهرية المجردة لكون الشيء مؤلماً دون تحديد طبيعة الألم أو مصدره؛ أعمّ من إيلام (الذي يُلمِّح إلى الفعل) وأكثر تجريداً من مضض (الذي يُلمِّح إلى الحرقة الوجدانية)"
      actions:
        - command: create_entry
          params:
            lemma: "أَلِيمِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَضَضٌ"
      source: stage1
      decision: confirmed
      decision_reason: "موثَّق في المعاجم الكلاسيكية الكبرى توثيقاً وافراً: 'المضض: وجع المصيبة' (الجوهري)، 'المضّ: الحرقة' (ابن سيده)، 'يدل على ضغط الشيء للشيء... بلغ مني المشقة' (ابن فارس). يُغطي بُعد distressingness في المجموعة (الخاصية الوجدانية والنفسية للإيلام). مستوفٍ لشروط السك المعجمي ولشرط التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبِّر عن الحرقة الباطنة والضغط الداخلي الأليم، لا سيما في المصائب والأحزان والفراق؛ يُركِّز على البُعد الوجداني والنفسي للإيلام (distressingness) بخلاف إيلام الذي يُركِّز على الجسدي"
      actions:
        - command: create_entry
          params:
            lemma: "مَضَضٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "وَجَعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي. المصدر الصناعي من الاسم (وجع → وجعية) أضعف صرفياً من المصدر الصناعي من الصفة (أليم → أليمية)، ويبقى قريباً من الدوران (وجعية ← وجع = ألم). أليمية تؤدي المهمة نفسها بشكل أدق وأكثر قياسية."

    - lemma: "أَذِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الأذية تدور في حقل الضرر والأذى العام (harm/annoyance/insult) وليس في حقل الإيلام تحديداً؛ تناقضها الأدلة المعجمية مع مفهوم المجموعة، كما أن المصطلح الطبي يُوظِّفها في سياق 'الإصابة' لا 'خاصية الإيلام'."


