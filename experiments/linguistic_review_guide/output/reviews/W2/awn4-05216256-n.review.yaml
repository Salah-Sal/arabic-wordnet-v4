# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'انتقائية' خالية من التشكيل الكامل، مما يُعسِّر الضبط الصوتي الدقيق"
      - "المجموعة تقتصر على لمّة واحدة رغم وجود مرادفات موثّقة في معاجم معتمدة كـ'اصطفائية'"
      - "التعريف العربي الحالي دائري — يستخدم 'انتقائياً' المشتق من الجذر نفسه الذي تنحدر منه 'انتقائية'"
    observations: "المجموعة تحمل مفهوماً علمياً دقيقاً راسخاً في المعجمية التقنية العربية الحديثة. اللمّة الموجودة 'انتقائية' مصدرٌ صناعي من الفعل الخماسي 'انتقى' (افتعل من نقي)، وهي من أبرز المصطلحات الموحَّدة في المعاجم العلمية العربية عبر مجالات متعددة (فيزياء وكيمياء وطب وصيدلة وكهرباء). يمكن إثراء المجموعة بـ'اصطفائية' الموثّقة في المورد الحديث (2008) مرادفاً معتمداً. يُلاحَظ أن التعريف الحالي يقع في الدوران المصطلحي وينبغي إعادة صياغته."
  blind_candidates:
    - lemma: "اِصْطِفَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'اصطفى' (افتعل من الجذر صفو) بمعنى اختار الأفضل وتخيّر الأنقى؛ يدل على خاصية الانتقاء المُفضِّل للأجود والأخلص، وهو جذر ذو صلة وثيقة بمعنى الخلوص والتمييز"
    - lemma: "التَّخَيُّرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'تخيَّر' (تفعَّل من جذر خير) بمعنى التأنّق في الاختيار والمفاضلة بين الخيارات؛ يعبّر عن خاصية الإفراد الدقيق والمفاضلة التي هي جوهر المفهوم"
    - lemma: "اِنْتِقَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'انتقى' (افتعل من نقي) بمعنى أخذ خالص الشيء وأفضله؛ يدل مباشرةً على خاصية كون الشيء مُنتقياً في تفاعله أو استجابته، وهو أوفق الاشتقاقات لتأدية المعنى المقصود"
    - lemma: "اِخْتِيَارِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'اختياري' (نسبة إلى الاختيار، افتعال من جذر خير)؛ يدل على صفة الشيء القائم على التمييز والتفضيل، ويُستخدم في بعض السياقات التقنية للإشارة إلى الانتقائية"


