stage1_review:
  assessment:
    concerns:
      - "اللمّة «تتكثف» صيغة مشوّهة لا وجود لها في المعاجم — يُرجَّح أنها تصحيف لـ«تَكَثُّف» أو «تَكَاثُف»"
      - "اللمّة «تكيثف» صيغة مشوّهة لا وجود لها في المعاجم — يُرجَّح أنها تصحيف لـ«تَكْثِيف»"
      - "كلتا اللمّتين الموجودتين لا تطابقان أي وزن صرفي عربي معروف"
    observations: "المفهوم المُراد هو التكاثف الفيزيائي (condensation)، أي تحوُّل المادة من الحالة الغازية إلى السائلة أو الصلبة. الجذر «كثف» هو الجذر المناسب لهذا المفهوم، وله مشتقات مستعملة في المعاجم العلمية الحديثة: تَكَاثُف (تَفَاعُل)، تَكَثُّف (تَفَعُّل)، تَكْثِيف (تَفْعِيل). اللمّتان الموجودتان تبدوان نتيجة خطأ إدخال بيانات."
  blind_candidates:
    - lemma: "تَكَاثُف"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تَكَاثَفَ على وزن تَفَاعُل من الجذر «كثف»، يدل على حدوث العملية تلقائياً وبشكل متبادَل. هو المصطلح الأكثر شيوعاً للتكاثف الفيزيائي في المعاجم العلمية العربية."
    - lemma: "تَكَثُّف"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تَكَثَّفَ على وزن تَفَعُّل من الجذر «كثف»، يدل على التحوُّل الذاتي. مستعمل في معاجم الهندسة والمياه بمعنى تحوُّل البخار إلى سائل."
    - lemma: "تَكْثِيف"
      generation_method: ishtiqaq
      justification: "مصدر الفعل كَثَّفَ على وزن تَفْعِيل، يدل على إحداث الفعل (المتعدّي). مستعمل في الفيزياء والكيمياء والطاقة بمعنى condensation، لكنه يميل إلى الدلالة على الفعل المتعدّي (تحويل الغاز) لا اللازم."
    - lemma: "تَقَطُّر"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تَقَطَّرَ على وزن تَفَعُّل من الجذر «قطر» (القَطْر: النقطة من الماء)، يدل على التحوُّل إلى قطرات. مصطلح محتمل لكنه يميل إلى معنى التقطير أو التساقط قطرةً قطرةً لا التكاثف."

stage2_evidence:
  per_lemma:
    - lemma: "تتكثف"
      evidence_status: "no_material_found"
    - lemma: "تكيثف"
      evidence_status: "no_material_found"
    - lemma: "تَكَاثُف"
      confirm:
        - text: "«التكاثف، تكثيف: التحول من الحالة الغازية إلى الحالة السائلة أو اتحاد جزئين لتكوين مركب مع انفصال الماء»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«تَكَاثُف» [ترجمة: condensation]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«تكاثُف» [ترجمة: condensation]"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية"
      expands:
        - text: "«التكاثف: هو انتقاض أجزاء المركب من غير انفصال شيء.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "المعنى الفلسفي القديم: نقصان حجم الجسم دون فقدان مادة"
        - text: "«التكاثف: انتقاص مِقْدَار الْجِسْم بِدُونِ انتقاص جسم عَنهُ.»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "تعريف مطابق للمعنى الفلسفي عند الجرجاني"
        - text: "«التكاثف: يطلق على معان: منها الاندماج ومنها غلظ القوام... ومنها انتقاص حجم الجسم من غير أن ينفصل عنه جزء.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تفصيل المعاني المتعددة للمصطلح في العلوم القديمة"
        - text: "«(تكاثف) الشَّيْء كثف يُقَال تكاثف السَّحَاب»"
          source: "المعجم الوسيط"
          addition: "الاستعمال اللغوي العام: صار كثيفاً"
    - lemma: "تَكَثُّف"
      confirm:
        - text: "«تكثُّف: انتقال من الحالة البخارية أو البخار إلى الحالة السائلة»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«تكثف: العملية التي يتحول بها البخار إلى سائل./ تحول البخار إلى سائل بخفض درجة حرارته.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«(التكثف) تراكم الكهربية على موصل (مج)»"
          source: "المعجم الوسيط"
          addition: "في الكهرباء: تراكم الشحنات على المكثّف — معنى مختلف عن التكاثف الفيزيائي"
        - text: "«تَرَاكُمُ الْكَهْرَبِيَّةِ عَلَى مُوصِّلٍ»"
          source: "المعجم الوسيط (OCR)"
          addition: "التأكيد على المعنى الكهربائي في المعجم الوسيط"
    - lemma: "تَكْثِيف"
      confirm:
        - text: "«تكثيف: عملية تحويل غازٍ ما إلى سائل.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«تكثيف» [ترجمة: condensation]"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989)"
        - text: "«تكثيف» [ترجمة: condensation]"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«تكثيف: تحوّل بُخار الماء الساخن إلى بُخار ماء رَطب»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "تخصيص المعنى في سياق الهندسة الحرارية"
        - text: "«(1) تكثيف (2) تَكَثُّف (3) شيء مُكثَّف؛ كتلة مُكَثَّفة (4) تلخيص (5) نِتاج التلخيص (6) إيجاز.»"
          source: "المورد الحديث (2008)"
          addition: "المعاني المتعددة لـ condensation في الإنجليزية ومقابلاتها العربية"
    - lemma: "تَقَطُّر"
      contradicts:
        - text: "«(تقاطر) الْقَوْم جاؤوا أَرْسَالًا وَالْمَاء والدمع وَغَيرهمَا من السوائل تتَابع»"
          source: "المعجم الوسيط"
          conflict: "المعنى اللغوي يدل على تتابع السقوط لا على التحوُّل من غاز إلى سائل"
        - text: "«تَقاطُر» [ترجمة: dribbling / stillicidium]"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المصطلح الطبي يعني التنقيط البولي لا التكاثف"

