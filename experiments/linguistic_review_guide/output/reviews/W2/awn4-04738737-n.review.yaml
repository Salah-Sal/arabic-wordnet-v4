# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04738737-n  |  ILI: i61895  |  POS: n
# characteristic / distinguishing quality
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. توليد اللمّات المرشحة (أعمى — من التعريف فقط، قبل الاطلاع على اللمّات)
  # التعريف المُقنَّع: "صفة مميزة؛ ميزة يمكن استخدامها لتحديد شيء ما"
  blind_candidates:
    - lemma: "مَيسَم"
      generation_method: majaz
      justification: >
        من وَسَمَ — الميسم أصلاً الآلةُ التي يُكوى بها الحيوان لتمييزه وتعريفه عمّا سواه؛
        يُستعار مجازاً لكل علامة فارقة تُعرِّف الشيء وتُمَيِّزه، إحياءٌ لمعنى كلاسيكي
        ثريّ ومتحمِّل للدلالة المطلوبة.
    - lemma: "خَاصِّيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر خ-ص-ص على المصدر الصناعي (فاعليّة): ما يختصّ به الشيء دون غيره من
        صفات تفرده وتُعرِّفه؛ الوزن يناسب دلالة الخاصية الثابتة المقيسة.
    - lemma: "شِيمَة"
      generation_method: majaz
      justification: >
        من شيم — الشيمة في اللغة الطبيعةُ الراسخة والخليقةُ المنشامة في الشيء؛
        إحياءٌ للفظ كلاسيكي ليدل على الصفة المتأصلة التي تُعرِّف الشيء وتُميِّزه.
    - lemma: "مَوسِم"
      generation_method: majaz
      justification: >
        من وَسَمَ — الموسم في أصله المعلَمُ الذي يُعرَف به الشيءُ ويُجتمع إليه؛
        يُستعار للصفة المميزة التي تُعرِّف الشيء وتجعله قابلاً للتعرف إليه.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمّات الثلاث خالية من التشكيل الكامل مما يُعسِّر التحقق الصوتي والصرفي"
      - "«سمة مميزة» تعبيرٌ وصفي حر لا مصطلحٌ مسكوك: يمكن إبدال «مميزة» بـ«فارقة» أو إبدال «سمة» بـ«صفة» ويظل الوصف صالحاً"
      - "«ميزة» تحمل إيحاءً تفضيلياً (advantage) قد لا يُلائم محايَدةَ المفهوم الأصل (characteristic)"
      - "التعريف الحالي يستخدم «ميزة» وهي لمّة في المجموعة — دوران جزئي"
    observations: >
      تتقاطع اللمّات الثلاث في دلالة «الصفة المميزة التي تُعرِّف الشيء»، غير أن كلاً
      منها يحمل ظلاً مختلفاً: «خصيصة» هي الأعمّ والأكثر حيادية، و«ميزة» تميل نحو
      التفضيل والقيمة الإضافية، أما «سمة مميزة» فتعبير وصفي تأليفي لا مصطلح معجمي
      ثابت. يُلاحَظ غياب «خاصية» رغم حضورها الكثيف في المعجمية التقنية بهذا المعنى
      تحديداً.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  # استعلامات نُفِّذت: ٦ استعلامات ضمن الميزانية
  # ١. مطابقة دفعية لجميع اللمّات + المرشحات
  # ٢. إثراء بالمعرّفات (تعريفات + شواهد)
  # ٣. جسر إنجليزي (characteristic / distinguishing feature)
  # ٤. بحث FTS بكلمات مفتاحية
  # ٥-٦. مقاييس اللغة (جذرا خصص ومز)

  per_lemma:

    - lemma: "خصيصة"
      confirm:
        - text: "«الخَصيصَةُ: الخاصة, أو الخاصية — الصِّفَة التى تميِّز الشيء وتحدده»"
          source: "المعجم الوسيط (OCR)"
        - text: "«خَصِيصَةُ الشىءِ: خاصَتُه, وهى الصِّفَة التى تُميِّزه وتُحَدِّدُه»"
          source: "المعجم الكبير (OCR)"
        - text: "«(الخصيصة) الصّفة الَّتِي تميز الشَّيْء وتحدده (ج) خَصَائِص»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«(1) خصِّيصة؛ مِيزة؛ صفة مميِّزة — characteristic»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«في Windows 95: خاصيةُ (أو موسِطُ parameter) غرضٍ أو تجهيزة. فمثلاً، تتضمَّن خصائص ملفٍّ ما: النوعَ، والحجمَ، وتاريخَ الإنشاء»"
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
          addition: "يُثبت استعمال الجمع «خصائص» في التخصصات التقنية الحديثة بدلالة قريبة من property/attribute"

    - lemma: "سمة مميزة"
      evidence_status: "no_material_found"
      # لا يوجد مدخل مستقل لـ "سمة مميزة" في أي من المعاجم المستعلَمة؛
      # التعبير غير مسجّل كوحدة معجمية ثابتة، ويرد فقط ضمن تعريفات مداخل أخرى

    - lemma: "ميزة"
      confirm:
        - text: "«(1) خصِّيصة؛ مِيزة؛ صفة مميِّزة — characteristic»"
          source: "المورد الحديث (2008)"
        - text: "«ميزة طيفية — spectral characteristic»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
      contradicts:
        - text: "«مَيْزَة — الرأي: مرفوضة عند الأكثرين — السبب: للخطأ في ضبط الكلمة بفتح الميم. الصواب: مِيزة السفر بالطائرة اقتصاد الوقت [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "يُثبت أن الضبط الصحيح مِيزَة بكسر الميم، وأن المفتوحة (مَيزة) مرفوضة عند الأكثرين"
        - text: "«ميزة — advantage»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM"
          conflict: "الترجمة الإنجليزية advantage تحمل إيحاءً تفضيلياً (ميزة تفضيلية) لا مجرد 'صفة مميزة' محايدة"
      expands:
        - text: "«مَيْزَة — من (م ي ز) المرة من الميز بمعنى العزل والفرز والتفضيل، والميزة: الرفعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يكشف أن الدلالة الأصلية قائمة على الفرز والتفضيل، مما يُرسِّخ الإيحاء التفضيلي"

    - lemma: "مَيسَم"
      contradicts:
        - text: "«المِيسَمُ: السِّمَة، أثر الحُسن والجمال، اسمٌ للآلة التي يُوسَم بها كالمِكْوَاة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المعنى القاموسي للميسم مقيَّد بمعنيين: أثر الجمال، وآلة الوسم — لا يُفيد 'الصفة المميزة' بالمعنى العام"
        - text: "«ميسم — stigma [الجزء الأعلى من القلم في الزهرة وهو الذي يستقبل اللقاح]»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM"
          conflict: "المصطلح التقني الراسخ لـ 'ميسم' في العربية الحديثة هو مصطلح بيولوجي (stigma في الزهرة)، مما يُشكِّل تزاحماً اصطلاحياً يمنع إعادة توظيفه"

    - lemma: "خَاصِّيَّة"
      confirm:
        - text: "«الخاصيّة: نسبةٌ إلى الخاصَّة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«خَاصِّيّة — يمكن تصحيح كلمة «خاصّيّة» بناءً على ورودها في الوسيط... وقد وردت في الأساسي على أنها مصدر صناعي لـ «خاصّة» — [فصيحة: صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«خاصية — characteristic»"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"
        - text: "«خاصية — property»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
        - text: "«خاصية أدب تُميزه عن لا أَدب. وهي علامة موضوع تسمح بالتعرف على شخصية أو ظاهرة أو أسلوب كتميز خاص عن باقي الأعمال»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
        - text: "«صفة أو ميزة للبيانات يمكن استخدامها مُدخَلًا لعملية التنبؤ، وغالبًا ما تُستخدم مُرادِفًا لكلمة (سمة)»"
          source: "معجم البيانات والذكاء الاصطناعي (2024) — ARABTERM"
      expands:
        - text: "«الخاصية: كلية مقولة على أفراد حقيقة واحدة فقط قولا عرضيا... فخرج بفقط الجنس والعرض العام لأنهما مقولان على حقائق، وبعرضيا النوع والفصل»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622)"
          addition: "يُثبت العمق الفلسفي الكلاسيكي للمصطلح في المنطق العربي"
        - text: "«الخاصيّة: [في الانكليزية] Characteristic, property — بإلحاق الياء تستعمل في الموضع الذي يكون السبب فيه مخفيا... عبّروا بها عن السبب المجهول للأثر المعلوم»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777)"
          addition: "يمنح المصطلح تاريخاً كلاسيكياً طويلاً ويُقابله بالإنجليزية مباشرة"

    - lemma: "شِيمَة"
      contradicts:
        - text: "«الشيمة: الخلق والطبيعة»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي (ت 786)"
          conflict: "الشيمة تعني الطبيعة الراسخة والخُلق الغريزي المتأصل، أقرب لـ temperament/innate nature لا للصفة المميزة القابلة للقياس والتحديد"
        - text: "«الشيمة: الحالة التي عليها الغريزة اعتباراً بالشامة التي في أصل الخلقة»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505)"
          conflict: "تأطير المعنى بالغريزة والخِلقة يُخرجه عن دلالة الصفة المحددة والمميِّزة التي يقوم عليها المفهوم"

    - lemma: "مَوسِم"
      contradicts:
        - text: "«المَوْسِمُ: المَجْمَع الكثير من الناس، وقت ظهور الشيء أو اجتماع الناس له»"
          source: "المعجم الوسيط (OCR)"
          conflict: "الموسم يدل على التجمّع الزماني لا على الصفة المميزة، ودلالته الأساسية تتعلق بالوقت والاجتماع"
        - text: "«موسم — season»"
          source: "مسرد الفن والتسلية والرياضة — ARABTERM"
          conflict: "الاستعمال الراسخ لـ 'موسم' في العربية الحديثة هو season، مما يُحكم إغلاق باب إعادة توظيفه"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "خصيصة"
      decision: confirmed
      decision_reason: >
        مدعومة بتعريف صريح ومطابق في المعجم الوسيط والمعجم الكبير وغيرهما:
        «الصفة التي تميز الشيء وتحدده» — وهو عين تعريف المجموعة الترادفية.
        اللفظ فصيح قديم متأصل، جمعه «خصائص» متداول في الاستعمال الحديث.
        يحتاج فقط إلى تصحيح التشكيل في السجل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ اللمّات الثلاث وأكثرها حيادية — تدل على كل صفة تنفرد بها الشيء
        وتُعرِّفه بغضّ النظر عن قيمتها أو مجالها؛ تُستخدم في السياقات العلمية
        والأدبية والفلسفية بصورة متكافئة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَصِيصَة"

    # ── لمّة موجودة ٢ ──
    - lemma: "سمة مميزة"
      decision: removed
      decision_reason: >
        تعبير وصفي حر لا مصطلح مسكوك: اختبار السكّ يُثبت إمكانية إبدال «سمة»
        بـ«صفة» (→ «صفة مميزة») أو إبدال «مميزة» بـ«فارقة» (→ «سمة فارقة»)
        مع بقاء الوصف صالحاً. لا يوجد في أي من المعاجم مدخل مستقل لـ«سمة مميزة»
        بوصفه وحدة معجمية ثابتة. يُحذف الربط بالمجموعة ويُكتفى بـ«خصيصة» و«ميزة»
        و«خاصية» التي تُغطي الدلالة كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة ٣ ──
    - lemma: "ميزة"
      decision: confirmed
      decision_reason: >
        مدعومة في المورد الحديث وبعض معاجم ARABTERM. معجم الصواب يُثبت أن
        الصواب «مِيزَة» بكسر الميم لا بفتحها. تُبقى لأنها مستعملة فعلاً في
        المعجمية الحديثة بمعنى «characteristic» وإن حملت إيحاءً تفضيلياً تجدر
        الإشارة إليه في nuance.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تحمل إيحاءً تفضيلياً وتقييمياً (advantage/merit): تُستعمل حين تكون
        الصفة المميزة فضيلةً أو قيمةً مضافة لصاحبها، خلافاً لـ«خصيصة» التي
        تصف أي صفة محايدة، و«خاصية» التي تُستعمل في السياق العلمي والتقني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيزَة"

    # ── مرشح المرحلة ١: الميسم ──
    - lemma: "مَيسَم"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود صلة اشتقاقية بجذر وسم، إلا أن المعنى القاموسي للميسم مقيَّد
        بمعنيين لا ثالث لهما في المعاجم الموثوقة: أثر الجمال، وآلة الوسم.
        فضلاً عن ذلك، رسَّخت معاجم ARABTERM «ميسم» مصطلحاً بيولوجياً للـ stigma
        (أعلى مدقة الزهرة)، مما يُنشئ تزاحماً اصطلاحياً يمنع إعادة توظيفه
        بمعنى «الصفة المميزة».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١: خاصية ──
    - lemma: "خَاصِّيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        حضور كثيف وراسخ في المعجمية العربية الحديثة بالدلالة المطلوبة تماماً:
        characteristic / property / feature في عشرات المعاجم المتخصصة.
        مقبولة في معجم الصواب. موثقة في المنطق الكلاسيكي منذ المناوي (ت1622)
        والتهانوي (ت1777). الوزن الصرفي (مصدر صناعي من خاصّة) ملائم لدلالة
        الصفة المجردة. المفهوم قابل للاشتقاق والنسبة والجمع (خواص / خاصيات).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُستعمل أساساً في السياقات العلمية والتقنية والفلسفية (property في الكيمياء
        والفيزياء والرياضيات، characteristic في الهندسة والمنطق)؛ تدل على صفة
        مقيسة وقابلة للاستدلال بها، بخلاف «خصيصة» الأعم وبخلاف «ميزة» التي
        تحمل إيحاءً تفضيلياً.
      actions:
        - command: create_entry
          params:
            lemma: "خَاصِّيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04738737-n"

    # ── مرشح المرحلة ١: شيمة ──
    - lemma: "شِيمَة"
      source: stage1
      decision: removed
      decision_reason: >
        تعني في جميع المعاجم «الطبيعة الراسخة والخُلق الغريزي»، وهو معنى يقترب
        من temperament/innate nature لا من «الصفة المميزة المحددة» التي يقصدها
        المفهوم. الفارق الدلالي جوهري: الشيمة طبيعة متأصلة لا يُختار الشيء
        بواسطتها، أما الخصيصة فصفة تُعتمد أداةً للتعرف والتحديد.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١: موسم ──
    - lemma: "مَوسِم"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال الراسخ لـ«موسم» في العربية الحديثة هو season، ودلالته الأصلية
        التجمّع الزماني والمكاني لا الصفة المميزة. الإزاحة المجازية المقترحة
        بعيدة عن الاستعمال الفعلي ولا يدعمها أي توثيق معجمي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة مميزة؛ ميزة يمكن استخدامها لتحديد شيء ما"
    assessment:
      decision: revise
      reason: >
