# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. المرشحات العمياء — توليد من التعريف فقط قبل الاطلاع على اللمّات
  # المدخل: "دافع يمكن تبريره بالمنطق أو الحجة العقلانية"
  # المفهوم الأعلى: السمة النفسية التي تثير الكائن الحي للقيام بفعل نحو هدف منشود
  blind_candidates:
    - lemma: "بَاعِث عَقْلَانِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من "بَاعِث" (اسم فاعل من بعَثَ: الإثارة والتحريك) و"عَقْلَانِيّ"
        (منسوب إلى العقل). المعجم الكبير يخصّ "الباعث" بالعامل النفسي الداخلي
        (Motif) مقابل الدافع الخارجي، مما يجعله أنسب للدوافع الذهنية.

    - lemma: "مُسَوِّغ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر (س-و-غ) على وزن اسم الفاعل مُفَعِّل. الجذر يدل على سهولة
        المرور والقبول (ساغ في الحلق)، ومنه "سوّغ الأمر" أي أباحه وجعله مقبولاً.
        المُسَوِّغ: ما يُسوِّغ الفعلَ ويُبرّره بالحجة العقلية. التوليد بالاشتقاق
        يُنتج مصطلحاً وحيد الكلمة بدلاً من المركب.

    - lemma: "دَافِع مَعْقُول"
      generation_method: tarkib
      justification: >
        تركيب وصفي من "دَافِع" (ما يحمل على الفعل) و"مَعْقُول" (ما يقبله العقل
        ويُقرّه). المعقول صفة راسخة في الفلسفة العربية بمعنى ما أدركه العقل وصادقه.

    - lemma: "حَافِز مَنْطِقِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من "حَافِز" (من ح-ف-ز: الحثّ والدفع من خلف) و"مَنْطِقِيّ"
        (منسوب إلى المنطق: علم الاستدلال الصحيح). المنطق يُعبّر عن الحجة المنظّمة
        والبرهان الرسمي، مما يُحكم الفارق بين الدافع الانفعالي والدافع الاستدلالي.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّتان الموجودتان (دافع عقلاني، دافع منطقي) خاليتان من التشكيل الكامل."
      - >
        الفارق الدلالي بين اللمّتين ضيّق: «عقلاني» و«منطقي» كلاهما ينسبان
        الدافع إلى العقل/المنطق، دون تمييز اصطلاحي واضح بينهما في الأدبيات
        النفسية العربية.
      - >
        كلمة «عقلاني» (بألف ونون قبل ياء النسب) أثارها معجم الصواب اللغوي
        لأحمد مختار عمر بوصفها مرفوضة قياساً، وأجاز «عقلي» كالأفصح، وإن أقرّها
        «صحيحة» تبعاً للاستعمال.
      - "التعريف الحالي يصف الدافع بصورة غير مباشرة (يمكن تبريره) دون تحديد جنسه الأقرب."
    observations: >
      المجموعة ترادفية تختص بمفهوم نفسي-فلسفي: الدافع ذو الطابع العقلي المبرَّر بالحجة.
      الأصل الاصطلاحي للمفهوم يعود إلى التمييز الفلسفي بين الدوافع الانفعالية (العاطفة
      والغريزة) والدوافع العقلانية (الإرادة المبرَّرة). المعجم الكبير [87981] يوضّح هذا
      التمييز: «الدافع في الفلسفة: الداعي، وماله يختار القادرُ الفعلَ. وهو العاملُ الخاصُّ
      بالإنسانِ والموقف». هذا يُثبت أن "الدافع" مصطلح راسخ في الفلسفة العربية بالمعنى
      المطلوب. كلمة "الحافز" تتداخل مع "الدافع" في الاستخدام الحديث، غير أن المعجم الكبير
      [65588] يُفرّق بينهما: «الباعث في علم النفس: عامل نفسيّ وهو فكرة تنزع إلى إحداث
      عمل إرادي، في حين أن الدافع قد يكون خارجياً». اللمّة المرشحة "مُسَوِّغ" تفيد
      التبرير/الإجازة لا الدافع المحرّك، مما يُبعدها عن معنى المجموعة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# ملاحظة: لم يوجد evidence.json مسبق — نُفّذت الاستعلامات مباشرة.
# الاستعلامات المُنفَّذة:
#   Q1: مطابقة دقيقة دفعية (الكلمات الأساسية + المرشحات)     — 33 نتيجة
#   Q2: جسر إنجليزي (rational motive / logical motive)       — 0 نتيجة
#   Q3: FTS بكلمات مفتاحية (دافع عقلاني، حافز منطقي، ...)    — 1 نتيجة
#   Q4: مفردات مساعدة (عقلاني، معقول، منطقي، مسوغ، ...)      — 12 نتيجة
#   Q5: مقاييس اللغة لابن فارس (دفع، بعث، حفز، سوغ، عقل، نطق) — 6 نتائج
stage2_evidence:
  per_lemma:

    - lemma: "دَافِع عَقْلَانِيّ"
      confirm:
        - text: >
            «(في الفلسفة) mobile: الداعي، وماله يختار القادرُ الفعلَ. وهو العاملُ
            الخاصُّ بالإنسانِ والموقفِ. وقد اصطُلِحَ على إطلاقِ لفظِ الحافزِ على
            الدَّافِعِ الخاصِّ بالإنسانِ ولفظِ "الباعث" على الدَّافِعِ [الداخلي]»
          source: "المعجم الكبير [87981] — مجمع اللغة العربية"
        - text: >
            «حالة داخلية جسمية أو نفسية تدفع الفرد نحو سلوك في ظروف معينة وتوجهه
            نحو إشباع حاجة أو هدف محدد؛ أي أنها قوة محركة منشّطة وموجِّهة في وقت واحد»
          source: "مسرد التربية — ALECSO [398902]، translation_en: motive"
      expands:
        - text: >
            «عَقْلانيّ — مثال: له تفكير عَقْلانيّ — الرأي: مرفوضة — السبب: لزيادة
            الألف والنون قبل ياء النسب. الصواب والرتبة: -له تفكير عَقْليّ [فصيحة]
            -له تفكير عَقْلانيّ [صحيحة]»
          source: "معجم الصواب اللغوي لأحمد مختار عمر [854126]"
          addition: >
            يُقرّ المعجم "عقلاني" صحيحةً وإن فضّل "عقلي". هذا يعني أن الشكل
            الواردَ في اللمّة مقبول اصطلاحياً لكنه ليس الأفصح.

    - lemma: "دَافِع مَنْطِقِيّ"
      confirm:
        - text: >
            «نظرية قائلة بأن كل فرد، إذا كانت ملكية الموارد الطبيعية للعموم، يكون لديه
            حافز منطقي لاستغلال المورد وزيادة فائدته منه، مع تجاهل الكلفة التي سوف
            يتحملها باقي المجتمع»
          source: "المعجم الموحد لمصطلحات المياه 2000 [393242]، ضمن تعريف مأساة المشاعات"
        - text: >
            «ما يَعتمد على اختيارات الصواب والخطأ باعتبارها مقابلاً للعمليات الحسابية
            على قيم الأعداد»
          source: "معجم مصطلحات المعلوماتية 2000 [529079]، translation_en: logical"
      expands:
        - text: >
            «النُّونُ وَالطَّاءُ وَالْقَافُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا كَلَامٌ
            أَوْ مَا أَشْبَهَهُ... الْمَنْطِقُ وَنَطَقَ يَنْطِقُ نُطْقاً»
          source: "مقاييس اللغة لابن فارس، جذر (نطق)"
          addition: >
            أصل "المنطق" في اللغة هو الكلام والبيان، ثم أُطلق على علم الاستدلال؛
            فـ"منطقي" يحمل دلالة الانتظام في الحجة والوضوح في البيان.

    - lemma: "بَاعِث عَقْلَانِيّ"
      confirm:
        - text: >
            «(الباعث) في علم النفس (Motif): عاملٌ نَفْسِيٌّ، وهو فكرة تنزع إلى إحداث
            عَمَل إرادي، في حين أن الدافع قد يكون خارجياً»
          source: "المعجم الكبير [65588] — مجمع اللغة العربية"
        - text: "باعث — translation_en: motive"
          source: "المعجم الموحد لمصطلحات القانون 2017 [413581]"
      expands:
        - text: >
            «(بَعَثَ) الْبَاءُ وَالْعَيْنُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْإِثَارَةُ.
            وَيُقَالُ: بَعَثْتُهُ إِذَا أَثَرْتَهُ»
          source: "مقاييس اللغة لابن فارس، جذر (بعث)"
          addition: >
            الباعث في الأصل العربي يدل على الإثارة من الخمول إلى النشاط؛ وهو أشد
            دلالةً على الحث الداخلي من "الدافع" الذي قد يكون ضغطاً خارجياً.
      contradicts:
        - text: >
            «عَقْلانيّ — الرأي: مرفوضة — السبب: لزيادة الألف والنون قبل ياء النسب.
            الصواب: عَقْليّ [فصيحة]، عَقْلانيّ [صحيحة]»
          source: "معجم الصواب اللغوي لأحمد مختار عمر [854126]"
          conflict: >
            كلمة "عقلاني" مقبولة لكن ليست الأفصح؛ وجمع المرشح مع "الباعث" (وهو
            لا يختلف كثيراً عن "دافع عقلاني" الموجودة) يُضعف مسوّغ إضافته.

    - lemma: "مُسَوِّغ"
      expands:
        - text: >
            «(سَوُغَ) السِّينُ وَالْوَاوُ وَالْغَيْنُ أَصْلٌ يَدُلُّ عَلَى سُهُولَةِ
            الشَّيْءِ وَاسْتِمْرَارِهِ فِي الْحَلْقِ خَاصَّةً، ثُمَّ يُحْمَلُ عَلَى ذَلِكَ.
            يُقَالُ سَاغَ الشَّرَابُ فِي الْحَلْقِ سَوْغاً. وَمِنَ الْمُشْتَقِّ مِنْهُ
            قَوْلُهُمْ: أَصَابَ فُلَانٌ كَذَا فَسَوَّغْتُهُ إِيَّاهُ»
          source: "مقاييس اللغة لابن فارس، جذر (سوغ)"
          addition: >
            التسويغ في الأصل يعني الإباحة والإجازة، وتوسّع إلى التبرير. لكنه
            يصف فعل التبرير لا الدافع نفسه؛ أي أن "المُسَوِّغ" هو ما يُبيح الفعل
            لا ما يدفع إليه.

    - lemma: "دَافِع مَعْقُول"
      confirm:
        - text: "معقول — translation_en: rational"
          source: "مسرد التربية — ALECSO [397196]"
      expands:
        - text: >
            «الْعَيْنُ وَالْقَافُ وَاللَّامُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ مُطَّرِدٌ، يَدُلُّ
            عُظْمُهُ عَلَى حُبْسَةٍ فِي الشَّيْءِ أَوْ مَا يُقَارِبُ الْحُبْسَةَ. مِنْ
            ذَلِكَ الْعَقْلِ، وَهُوَ الْحَابِسُ عَنْ ذَمِيمِ الْقَوْلِ وَالْفِعْلِ»
          source: "مقاييس اللغة لابن فارس، جذر (عقل)"
          addition: >
            المعقول اسم مفعول يُشير إلى ما قبله العقل وحكم بصحته. استخدامه
            صفةً للدافع يُفيد أن الدافع مما يُقبل بالعقل ويُصادَق عليه.

    - lemma: "حَافِز مَنْطِقِيّ"
      confirm:
        - text: >
            «يكون لديه حافز منطقي لاستغلال المورد وزيادة فائدته منه، مع تجاهل
            الكلفة التي سوف يتحملها باقي المجتمع»
          source: "المعجم الموحد لمصطلحات المياه 2000 [393242]، تعريف مأساة المشاعات"
        - text: >
            «(في علم النفس) drive: نشاط داخليّ في الكائن الحيّ، أو في عُضْوِ من
            أعضائه، يجعله مُهَيَّئاً للاستجابةِ لِمُثِيرٍ مُعَيَّن»
          source: "المعجم الكبير [77686]، حافز"
      expands:
        - text: >
            «(حَفَزَ) الْحَاءُ وَالْفَاءُ وَالزَّاءُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى
            الْحَثِّ وَمَا قَرُبَ مِنْهُ. فَالْحَفْزُ: حَثُّكَ الشَّيْءَ مِنْ خَلْفِهِ»
          source: "مقاييس اللغة لابن فارس، جذر (حفز)"
          addition: >
            الحفز يدل على الدفع من الخلف والحث على المضي؛ وهو أشد إلحاحاً من
            مجرد الدافع. والحافز يُعبّر عن النشاط الداخلي في علم النفس (drive).


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "دَافِع عَقْلَانِيّ"
      decision: confirmed
      decision_reason: >
        "الدافع" مصطلح نفسي-فلسفي راسخ (المعجم الكبير: mobile, الداعي وماله
        يختار القادر الفعل). "عقلاني" مقبولة في معجم الصواب رغم أن "عقلي" أفصح.
        اللمّة شائعة في الأدبيات النفسية العربية المعاصرة وتُغطّي الجانب الدلالي
        المتعلق بالكفاءة العقلية والإدراك.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز الجانب العقلي-الإدراكي للدافع (العقل كملكة الفهم والحكم)، مع
        إيحاء بالرشاد والسداد الذهني. "عقلاني" أوسع من "منطقي" إذ يشمل الفطرة
        العاقلة والحكمة، لا الاستدلال الصوري وحده.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَافِع عَقْلَانِيّ"

    # ── لمّة موجودة ٢ ──
    - lemma: "دَافِع مَنْطِقِيّ"
      decision: confirmed
      decision_reason: >
        "منطقي" يحيل إلى المنطق بوصفه علم الاستدلال الصوري والبرهان المنظّم.
        اللمّة واردة في سياق يشبه تعريف المجموعة: «حافز منطقي لاستغلال المورد»
        [393242]. فضلاً عن ذلك فإن "المنطق" راسخ في الفلسفة العربية الإسلامية
        وعلم الكلام، مما يجعل المركب ذا ظهير تراثي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز الجانب الاستدلالي الصوري للدافع (المنطق كعلم البرهان وسلسلة
        الحجج). أضيق دلالةً من "عقلاني": يستلزم قابلية الدافع للتعبير عنه
        بصورة استدلالية منتظمة قابلة للتحقق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَافِع مَنْطِقِيّ"

    # ── مرشح المرحلة ١ — بَاعِث عَقْلَانِيّ ──
    - lemma: "بَاعِث عَقْلَانِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن "الباعث" مصطلح نفسي دقيق (يخص الدافع الداخلي في مقابل الخارجي)،
        إلا أن المركب "باعث عقلاني" لم يُوثَّق كوحدة معجمية ثابتة في قواعد
        البيانات. علاوةً على ذلك، يُضيف هذا المركب تكراراً شبه تام مع "دافع
        عقلاني" الموجودة دون فارق دلالي مُسوِّغ في هذا السياق التحديدي.
        اختبار الاستبدال: "باعث نفسي"، "باعث ديني" — الصيغة وصفية لا اصطلاحية.
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١ — مُسَوِّغ ──
    - lemma: "مُسَوِّغ"
      source: stage1
      decision: removed
      decision_reason: >
        "المُسَوِّغ" يدل على ما يُبيح الفعل ويُبرّره (التبرير)، لا على ما يدفع
        إليه (الدافع). الفرق جوهري: الدافع يُحرّك الإرادة نحو الفعل، أما المسوّغ
        فهو المسند العقلي الذي يُجيز الفعل بعد اتخاذه أو قبله. المجموعة تنتمي
        إلى المفهوم الأول (drive/motive) لا الثاني (justification/rationale).
        عدم التطابق مع المفهوم الأعلى (حافز/دافع/دافعية) يُؤكّد الإقصاء.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١ — دَافِع مَعْقُول ──
    - lemma: "دَافِع مَعْقُول"
      source: stage1
      decision: removed
      decision_reason: >
        "معقول" صفة تعني ما قبله العقل، وهي أقل تخصصاً من "عقلاني" أو "منطقي"
        في السياق الاصطلاحي النفسي-الفلسفي. فضلاً عن ذلك، تنزع الصفة "معقول"
        في الاستخدام المعاصر نحو معنى "مقبول/مناسب" أكثر من معنى "مستند إلى
        العقل"، مما يُضعف الدقة الاصطلاحية. لم يُوثَّق كوحدة معجمية ثابتة.
