        المركّبة ذاتها: «يكون لديه حافز منطقي لاستغلال المورد». "الحافز" في
        المعجم الكبير يُعرَّف صراحةً في علم النفس بـ(drive): النشاط الداخلي
        المُهيّئ للاستجابة، وهو تعريف يتطابق مع المفهوم الأعلى للمجموعة. يُضيف
        هذا المركب بُعداً تكميلياً: يُفرّق بين الدافع (قد يكون خارجياً) والحافز
        (داخلي بامتياز)، مع وصفه بالطابع المنطقي الاستدلالي.
        اختبار MWE: الوحدة واردة في سياق تعريفي معجمي مخصص → مقبولة.
        فحص الاقتراض: لا اقتراض. الفحص الصرفي: حَافِز (اسم فاعل من حَفَزَ) +
