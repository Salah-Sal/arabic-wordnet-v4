    - lemma: "مُقْتَنَيَاتٌ فَنِّيَّةٌ"
      sense_id: "{auto}"
      nuance: "يركز على فعل الاقتناء والحفظ، ويشيع في سياق المتاحف والمجموعات الخاصة."
