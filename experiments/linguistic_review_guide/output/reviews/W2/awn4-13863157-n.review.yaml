stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة حرفية ركيكة للتعريف الإنجليزي."
      - "كلمة 'كيمياء' في هذا السياق هي اقتراض مفهومي حديث (Calque) قد لا تجده المعاجم التقليدية بهذا المعنى."
    observations: "المفهوم يعبر عن التوافق الروحي والنفسي العفوي بين شخصين، وهو ما يشار إليه في العربية قديماً بـ 'الألفة' أو 'ائتلاف الأرواح'."
  blind_candidates:
    - lemma: "كِيمْيَاء"
      generation_method: majaz
      justification: "استعارة من التفاعل الكيميائي للدلالة على التفاعل النفسي غير المرئي."
    - lemma: "انْسِجَام"
      generation_method: majaz
      justification: "التوافق والاتساق في الطباع والأفكار."
    - lemma: "تَجَاذُب"
      generation_method: majaz
      justification: "الميل النفسي المتبادل والمفاجئ."
    - lemma: "تَلَاؤُم"
      generation_method: ishtiqaq
      justification: "التوافق والالتئام بين الطرفين."

stage2_evidence:
  per_lemma:
    - lemma: "انْسِجَام"
      confirm:
        - text: "«حصول توافق بين أعضاء مجموعة معينة يجعل التواصل بينهم ناجحا»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "«تحقيق التوازن والرضاء الداخلي»"
          source: "موسوعة السلطان قابوس"
    - lemma: "كِيمْيَاء"
      confirm:
        - text: "«حيلة وحذق وقدرة على التصرف في الأمور»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«كيمياء السعادة: تهذيب النفس باجتناب الرذائل وتزكيتها عنها، واكتساب الفضائل وتحليتها بها»"
          source: "كتاب التعريفات للجرجاني"
      # ملاحظة: الاستخدام البيني (Interpersonal) هو استخدام معاصر شائع جداً لكنه لم يُقنن بعد في المعاجم الكبرى كتعريف منفصل.
    - lemma: "أُلْفَة"
      confirm:
        - text: "«(في الأخلاق): وشيجة بين شخصين أو أكثر، يحدثها تجاذب الميول النفسية، كصلة الصداقة ولحمة القرابة»"
          source: "المعجم الوسيط"
    - lemma: "تَجَاذُب"
      confirm:
        - text: "«(في علم النفس): خاصة تجاذب الظواهر النفسية في المجال الشعوري بتداعي الأفكار وترابطها»"
          source: "المعجم الوسيط (في تعريف الألفة)"

stage3_analysis:
  per_lemma:
    - lemma: "انْسِجَام"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل في السياق الاجتماعي للدلالة على التوافق السلس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْسِجَام"
    - lemma: "كِيمْيَاء"
      decision: confirmed
      decision_reason: "استخدام معاصر شائع جداً (Calque) للدلالة على 'الكيمياء الشخصية' (Interpersonal chemistry)، وهو مقبول في الاستعمال الحديث."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِيمْيَاء"
    - lemma: "أُلْفَة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح العربي الأصيل والأكثر دقة لهذا المفهوم كما عرفه المعجم الوسيط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أُلْفَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَجَاذُب"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الجانب الوجداني والعفوي في الارتباط بين شخصين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَجَاذُب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الطريقة التي يرتبط بها شخصان ببعضهما البعض"
    assessment:
      decision: revise
      reason: "التعريف الحالي سطحي ومترجم ترجمة حرفية."
    authored:
      - type: terminological
        text: "تَوافُقٌ نَفْسِيٌّ أو رُوحِيٌّ عَفْوِيٌّ يَنْشَأُ بَيْنَ شَخْصَيْنِ، يَجْعَلُ بَيْنَهُما نَوْعاً مِنَ الأُلْفَةِ وتَناغُمِ الطِّباعِ وسُهُولَةِ التَّواصُلِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "تَوافُقٌ نَفْسِيٌّ أو رُوحِيٌّ عَفْوِيٌّ يَنْشَأُ بَيْنَ شَخْصَيْنِ، يَجْعَلُ بَيْنَهُما نَوْعاً مِنَ الأُلْفَةِ وتَناغُمِ الطِّباعِ وسُهُولَةِ التَّواصُلِ."}

  examples:
    per_lemma:
      - lemma: "كِيمْيَاء"
        examples:
          - text: "كانَتِ الْكِيمْيَاءُ بَيْنَ الشَّريكَيْنِ واضِحَةً مُنْذُ اجْتِماعِهِما الأَوَّلِ."
            type: usage
      - lemma: "انْسِجَام"
        examples:
          - text: "يَسُودُ انْسِجَامٌ تامٌّ بَيْنَ أَعْضاءِ فَرِيقِ الْعَمَلِ."
            type: usage
      - lemma: "أُلْفَة"
        examples:
          - text: "أَلْقَى اللهُ بَيْنَهُما أُلْفَةً ومَحَبَّةً لَمْ يُرَ مِثْلُها."
            type: usage
      - lemma: "تَجَاذُب"
        examples:
          - text: "بَيْنَ الأَرْواحِ نَوْعٌ مِنَ التَّجَاذُبِ لَا يُفَسِّرُهُ مَنْطِقٌ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "كانَتِ الْكِيمْيَاءُ بَيْنَ الشَّريكَيْنِ واضِحَةً مُنْذُ اجْتِماعِهِما الأَوَّلِ."}

stage5_enrichment:
  per_entry:
    - lemma: "انْسِجَام"
      entry_id: "{auto}"
      root: "سجم"
      maqayis_quote: "«السِّينُ وَالْجِيمُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ صَبُّ الشَّيْءِ مِنَ الْمَاءِ وَالدَّمْعِ.»"
    - lemma: "أُلْفَة"
      entry_id: "{auto}"
      root: "ألف"
      maqayis_quote: "«الْهَمْزَةُ وَاللَّامُ وَالْفَاءُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى انْضِمَامِ الشَّيْءِ إِلَى الشَّيْءِ... وَالْأُلْفَةُ مَصْدَرُ الِائْتِلَافِ.»"
    - lemma: "تَجَاذُب"
      entry_id: "{auto}"
      root: "جذب"
      maqayis_quote: "«الْجِيمُ وَالذَّالُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى بَتْرِ الشَّيْءِ... فَكَأَنَّهَا جَذَبَتْهُ إِلَى نَفْسِهَا.»"
    - lemma: "كِيمْيَاء"
      entry_id: "{auto}"
      # لا يوجد جذر عربي أصيل لمادة كيمياء (أصلها يوناني chymeia)

  per_sense:
    - lemma: "انْسِجَام"
      sense_id: "{auto}"
      nuance: "يركز على التوافق السلس في العمل أو التواصل (Harmony/Coordination)."
      mwe: false
    - lemma: "كِيمْيَاء"
      sense_id: "{auto}"
      nuance: "يركز على التفاعل الخفي وغير المفسر بين الشخصيات (Interpersonal chemistry)."
      mwe: false
    - lemma: "أُلْفَة"
      sense_id: "{auto}"
      nuance: "يركز على الجانب النفسي والوجداني والاجتماع والالتئام (Bonding/Intimacy)."
      mwe: false
    - lemma: "تَجَاذُب"
      sense_id: "{auto}"
      nuance: "يركز على الميل القوي والمفاجئ (Attraction)."
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"سجم","maqayis":"«السِّينُ وَالْجِيمُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ صَبُّ الشَّيْءِ مِنَ الْمَاءِ وَالدَّمْعِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على التوافق السلس في العمل أو التواصل (Harmony/Coordination).","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.90
