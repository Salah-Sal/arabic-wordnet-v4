stage1_review:
  assessment:
    concerns:
      - "اللمّة 'ناخبون' هي جمع 'ناخب'، وهي صحيحة تماماً لكنها قد تُعتبر صفة للأفراد أكثر منها اسماً للهيئة الجمعية."
    observations: "المصطلح العربي المستقر لهذا المفهوم هو 'الهيئة الناخبة' أو 'الهيئة الانتخابية'. كما يُستخدم 'جمهور الناخبين' للتعبير عن الكتلة البشرية صاحبة حق التصويت."
  blind_candidates:
    - lemma: "النَّاخِبُونَ"
      generation_method: ishtiqaq
      justification: "الجمع السالم لاسم الفاعل 'ناخب'، وهو التعبير المباشر عن الأفراد الذين يشكلون هذه الهيئة."
    - lemma: "الهَيْئَةُ النَّاخِبَةُ"
      generation_method: tarkib
      justification: "تعبير مركب وصفي يعبر عن الكيان الجماعي للمصوتين."
    - lemma: "الهَيْئَةُ الِانْتِخَابِيَّةُ"
      generation_method: tarkib
      justification: "مصطلح قانوني وسياسي شائع جداً يصف مجموع الناخبين."
    - lemma: "جُمْهُورُ النَّاخِبِينَ"
      generation_method: tarkib
      justification: "تعبير إضافي يستخدم لوصف مجموع الناخبين ككتلة واحدة."

stage2_evidence:
  per_lemma:
    - lemma: "ناخبون"
      confirm:
        - text: "«ناخِب [مفرد]: ج ناخِبون ومُنتخبات (لغير العاقل): 1- اسم فاعل من نخَبَ. 2- من له حقّ الاشتراك والتصويت في الانتخاب»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "الهيئة الناخبة"
      confirm:
        - text: "«تصويت إيجابيّ: تصويت يصدر عن البرلمان أو هيئة ناخبة أخرى...»"
          source: "المعجم الموحد لمصطلحات القانون"
    - lemma: "الهيئة الانتخابية"
      confirm:
        - text: "«هيئة انتخابية: مجموع الناخبين في دائرة انتخابية»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«هيئة انتخابية»"
          source: "المعجم الموحد لمصطلحات القانون"
    - lemma: "جمهور الناخبين"
      confirm:
        - text: "«electorate: (2) جمهور النّاخبين.»"
          source: "المورد الحديث"
    - lemma: "هيئة الناخبين"
      confirm:
        - text: "«هيئة الناخبين: مجموع الناخبين في دائرة انتخابية»"
          source: "معجم اللغة العربية المعاصرة"

