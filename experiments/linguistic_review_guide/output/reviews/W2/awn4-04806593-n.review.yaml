stage3_analysis:
  per_lemma:

    - lemma: "أَعْجَمِيَّة"
      decision: confirmed
      decision_reason: >-
        رغم ضيق دلالتها الأصلية (العجمة اللغوية)، فإن أَعْجَمِيَّة تستعمل
        في العربية المعاصرة للدلالة على صفة الانتساب إلى غير العرب، وتقع
        مقابلاً لـ foreignness بمعناها الحضاري-الثقافي. وجودها في AWN4 مقبول
        بوصفها تغطّي الجانب العرقي-اللغوي للمفهوم. يجب توثيق الفارق الدقيق
        بينها وبين غَرَابَة في حقل nuance.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تختصّ بالدلالة على صفة العجمة والانتساب إلى غير الأصل العربي؛
        تُقابل foreignness بمعناها اللغوي-العرقي تحديداً، لا الغربة الوجدانية
        أو الاستغراب.

    - lemma: "غَرَابَة"
      decision: confirmed
      decision_reason: >-
        غَرَابَة تغطّي المعنى الثالث من اللمّات الإنجليزية (curiousness /
        strangeness)، وتُوثّق موسوعة السلطان قابوس ربطها بالبُعد عن الوطن.
        إبقاؤها ضروري لتمثيل هذا الجانب الدلالي، مع التنبّه إلى أنها أقرب
        إلى strangeness منها إلى foreignness.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تُعبِّر عن جانب الاستغراب والخروج عن المألوف (strangeness/curiousness)،
        وتُقابل الشيء الوحشي غير المأنوس؛ تختلف عن أَعْجَمِيَّة (المرتبطة
        بالأصل اللغوي) وعن غُرْبَة (المرتبطة بمفارقة الوطن).

    - lemma: "الغُرْبَة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        الغُرْبَة هي التمثيل الأمثل للمفهوم الجوهري للمجموعة (the quality of
        being alien / not native)؛ تُعرّفها المعاجم الكلاسيكية والحديثة بـ
        «مفارقة الوطن» و«النوى والبعد»، ويؤكد مقاييس اللغة نصراحةً: «الغُرْبَةُ:
        الْبُعْدُ عَنِ الْوَطَنِ». الأدلة قاطعة ومتعددة المصادر.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تدل تحديداً على مفارقة الوطن والكون بعيداً عن البيئة الأصلية
        (foreignness / alienness)؛ أكثر اللمّات صلةً بمحور «غير محلي» في
        التعريف، وتختلف عن غَرَابَة (الاستغراب) وأَعْجَمِيَّة (العجمة اللغوية).
      actions:
        - command: create_entry
          params:
            lemma: "غُرْبَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "الأَجْنَبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على الأَجْنَبِيَّة بوصفها مصدراً صناعياً مسكوكاً في
        المعاجم. الصفة أَجْنَبِيّ موثّقة جيداً، لكن المصدر الصناعي منها
        (أَجْنَبِيَّة) لم يُسجَّل في المعاجم الكلاسيكية ولا في المصطلحيات
        الحديثة كمصطلح قائم بذاته. اختبار السكّ يفشل: يمكن الوصف بـ «صفة
        الكون أجنبياً» بدلاً منها دون خسارة دلالية، مما يدل على أنها عبارة
        وصفية لا مصطلح ثابت.

    - lemma: "النُّبُوُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        معنى النُّبُوّ في المعاجم محدود في ارتداد السيف وتجافي البصر وعدم
        انسجام المكان مع صاحبه، ولا يُعبَّر به اصطلاحياً عن صفة الغربة
        والاغتراب. المجاز المقترح متكلَّف ولا سند له في الاستعمال المعجمي.

    - lemma: "الطَّارِئِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على الطارئية في أي معجم كلاسيكي أو حديث. هي مصدر صناعي
        منشأ لا تحمله المعاجم، ولم يُسكَّ في أي مصطلحية متخصصة. إضافتها
        تعريبٌ بلا سند.


