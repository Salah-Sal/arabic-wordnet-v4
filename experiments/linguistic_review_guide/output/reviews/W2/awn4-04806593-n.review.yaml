stage2_evidence:
  per_lemma:

    - lemma: "أَعْجَمِيَّة"
      confirm:
        - text: >-
            «(الأَعْجَمِيُّ) الأَعجمُ، لسانٌ أعجمىّ، وكتابٌ أعجمىّ»
          source: "المعجم الوسيط (المجمع)"
        - text: >-
            «العجمة: كون الكلمة من غير أوضاع العربية كنوح ولوط، ولا يعرف
            ذلك إلا بالسماع، وهي من أحد أسباب منع الصرف»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: >-
            «العَجَمِيّ: من جنسه العجم وإن أفصح، أما الأعجمي فهو من في
            لسانه عجمة وإن كان عربي الجنس»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: >-
            يكشف المعجم أن أَعْجَمِيَّة تختصّ بالعجمة اللغوية (اللكنة وعدم
            الفصاحة) لا بالانتساب إلى أجنبي بالمعنى العام، مما يضيّق دلالتها
            عن مفهوم المجموعة.
        - text: >-
            «العجمة: كون الكلمة من غير أوزان العرب»
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: >-
            التعريف المعجمي الرئيسي للعجمة يجعلها مصطلحاً لغوياً لا صفةً
            للكون أجنبياً في المعنى المطلوب.
      expands:
        - text: >-
            «(عَجَمَ) الْعَيْنُ وَالْجِيمُ وَالْمِيمُ ثَلَاثَةُ أُصُولٍ:
            أَحَدُهَا يَدُلُّ عَلَى سُكُوتٍ وَصَمْتٍ... فَالْأَوَّلُ
            الرَّجُلُ الَّذِي لَا يُفْصِحُ، هُوَ أَعْجَمُ»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            الأصل الاشتقاقي للجذر عجم يربطه بالصمت وعدم الإفصاح، لا
            بالغربة والاغتراب، مما يؤكد ضيق دلالة أعجمية في هذا السياق.

    - lemma: "غَرَابَة"
      confirm:
        - text: >-
            «غَرَابَة: من (غ ر ب) الابتعاد عن الوطن، والغموض والخفاء
            في الكلام»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >-
            «الغرابة: الندرة. وعند أصحاب المعاني: كون الكلمة وحشية أي
            غير ظاهرة المعنى ولا مأنوسة الاستعمال»
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: >-
            «الغرابة: كون الكلمة وحشية غير ظاهرة المعنى، ولا مأنوسة
            الاستعمال»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >-
            المعاجم اللغوية الكلاسيكية تُعرِّف الغرابة أساساً بالمعنى
            البلاغي-اللغوي (وحشية الكلمة)، لا بمعنى كون الشخص غير محلي.
        - text: >-
            «الغرابة: oddity / strangenss»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          conflict: >-
            المصطلح المعاصر يُترجَم بـ oddity وstrangeness، لا foreignness؛
            مما يؤكد أن غَرَابَة تقابل curiousness/strangeness أكثر من
            foreignness.
      expands:
        - text: >-
            «(غَرَبَ) الْغَيْنُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ...
            الغُرْبَةُ: الْبُعْدُ عَنِ الْوَطَنِ، يُقَالُ: غَرَبَتِ الدَّارُ.
            ومِنْ هَذَا الْبَابِ: غُرُوبُ الشَّمْسِ، كَأَنَّهُ بُعْدُهَا عَنْ
            وَجْهِ الْأَرْضِ»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            مقاييس اللغة يُفرّق بين الغَرَابَة (الغرابة اللفظية) والغُرْبَة
            (البعد عن الوطن)، مما يدل على أن الصيغة المناسبة للمفهوم المقصود
            هي الغُرْبَة لا الغَرَابَة.

    - lemma: "الغُرْبَة"
      confirm:
        - text: >-
            «الغربة: مفارقة الوطن في طلب المقصود»
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: >-
            «الغُرْبَة: النَّوى والبُعْد»
          source: "المعجم الوسيط"
        - text: >-
            «(الغربة) النَّوَى والبعد والحدة»
          source: "المعجم الوسيط لمجموعة من المؤلفين (مجمع القاهرة)"
        - text: >-
            «الغُرْبَةُ: الْبُعْدُ عَنِ الْوَطَنِ، يُقَالُ: غَرَبَتِ الدَّارُ»
          source: "مقاييس اللغة لابن فارس"

    - lemma: "الأَجْنَبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "النُّبُوُّ"
      contradicts:
        - text: >-
            «(نَبَوَ) النُّونُ وَالْبَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ
            صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي الشَّيْءِ عَنْ غَيْرِهِ
            أَوْ تَنَحٍّ عَنْهُ. بَصَرُهُ عَنِ الشَّيْءِ يَنْبُو. وَنَبَا
            السَّيْفُ عَنِ الضَّرِيبَةِ: تَجَافَى وَلَمْ يَمْضِ فِيهَا.
            وَنَبَا بِهِ مَنْزِلُهُ: لَمْ يُوَافِقْهُ»
          source: "مقاييس اللغة لابن فارس"
          conflict: >-
            النُّبُوُّ يدل على الارتداد والتجافي (كارتداد السيف عن الضريبة)
            وعدم انسجام المكان مع صاحبه، لا على صفة الكون غريباً غير محلي؛
            المجاز بعيد ومتكلَّف.
        - text: >-
            «نبا بَصَرُهُ عن الشّيء ينبو نُبُوّاً: تجافى»
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          conflict: >-
            الاستعمال المعجمي للنُّبُوّ محدود في سياقَي السيف والبصر، ولا
            يُسكّ منه مصطلح لصفة الاغتراب.

    - lemma: "الطَّارِئِيَّة"
      evidence_status: "no_material_found"


