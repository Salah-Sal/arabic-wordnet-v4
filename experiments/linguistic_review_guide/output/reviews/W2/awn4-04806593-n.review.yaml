# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — awn4-04806593-n
# المجموعة الترادفية: foreignness / strangeness / curiousness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "أَعْجَمِيَّة مشتقة من جذر عجم الذي يدل أصلاً على عدم الفصاحة وكون اللفظ من غير أوزان العرب (العُجْمَة اللغوية)، لا على الغربة بمعنى بُعد المرء عن وطنه؛ مما يجعل دلالتها أضيق من مفهوم المجموعة."
      - "غَرَابَة تقابل بالأساس المعنى الثالث من اللمّات الإنجليزية (curiousness / strangeness) أكثر من 'foreignness'؛ إذ يُعرّفها المعجميون في الغالب بأنها وحشية الكلمة وغرابتها لا كون الشخص غريباً."
      - "التعريف العربي الحالي دائري: يستخدم 'غريباً' في تعريف مجموعة تضم غَرَابَة كلمّة، مما يُفضي إلى الدوران المنطقي."
      - "تفتقر المجموعة إلى لمّة تمثّل مباشرةً 'البُعد عن الوطن وكون المرء غير محلي'، وهو جوهر المعنى المقصود."
    observations: >-
      تضمّ المجموعة مفهومَين متداخلَين: (أ) كون الشخص أجنبياً غير محلي
      (foreignness / alienness)، و(ب) كون الشيء أو الشخص غريباً مثيراً
      للاستغراب (strangeness / curiousness). اللمّتان الحاليتان توزّعان
      على هذين المحورين دون أن تغطّيا محور الغربة والبُعد عن الوطن بوضوح
      كافٍ. الجذر غ-ر-ب يشمل المعنيين، لكن الاشتقاقَ الصحيح للدلالة على
      مفارقة الوطن هو الغُرْبَة لا الغَرَابَة.

  blind_candidates:
    - lemma: "الأَجْنَبِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي على فَعْلِيَّة من الصفة أَجْنَبِيّ (جذر ج-ن-ب)؛
        يدلّ على صفة الكون أجنبياً وغير منتسب إلى البيئة المحلية، وهو
        ما يتطابق مع التعريف مباشرةً. الجذر جنب يعني الجانب والبُعد
        (مقاييس اللغة: «الناحية والبعد»).

    - lemma: "الغُرْبَة"
      generation_method: ishtiqaq
      justification: >-
        مصدر على فُعْلَة من جذر غ-ر-ب، يدل على مفارقة الوطن والبُعد
        عنه. نمط فُعْلَة يُفيد الحالة والهيئة، فيعبّر عن كون المرء
        غريباً عن موطنه. أصيل في التراث العربي ومستعمل فصيح.

    - lemma: "النُّبُوُّ"
      generation_method: majaz
      justification: >-
        مصدر على فُعُول من نَبَا (يَنْبُو)؛ يدل على تجافي الشيء عن
        الشيء وعدم توافق المكان لصاحبه (نبا به منزله: لم يوافقه). يصح
        مجازاً عن صفة كون الشخص لا ينسجم مع البيئة المحلية.

    - lemma: "الطَّارِئِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من طَارِئ (من طَرَأَ على القوم: قَدِمَ عليهم من
        غير أن يكون من أهلهم)؛ يدل على صفة كون الشيء أو الشخص وافداً
        من خارج دون انتساب محلي. وزنه من الأوزان المعبّرة عن الحالة.


