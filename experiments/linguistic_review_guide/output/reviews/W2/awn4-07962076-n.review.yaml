      sense_id: "{auto}"
      nuance: "تركز على فناء الذات المعنوي والوقوع في شرور الأعمال المؤدية للنار."
      mwe: false
    - lemma: "مُعَذَّبُون"
      sense_id: "{auto}"
      nuance: "تركز على الجانب الحسي والنفسي من العقاب الواقع عليهم."
      mwe: false
    - lemma: "أَهْلُ النَّارِ"
      sense_id: "{auto}"
      nuance: "تعبير اصطلاحي يشير إلى ملازمة العقاب (كأهل الدار الذين لا يبرحونها)."
      mwe: true
  synset:
    cultural_fit: native
  actions:
