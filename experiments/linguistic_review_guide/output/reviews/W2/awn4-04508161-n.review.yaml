stage1_review:
  assessment:
    concerns:
      - "اللمة 'توسعة جانبية' تفتقر إلى التشكيل وتعد مركباً وصفياً مقبولاً."
      - "اللمة 'مفسح' غير شائعة في الاستعمال المعاصر كاسم مكان مخصص للوقوف، وهناك مصطلحات هندسية أكثر دقة."
    observations: "المفهوم يشير إلى 'turnout' أو 'lay-by' وهو جزء يتم توسعته في الطريق للسماح للمركبات بالتوقف أو التجاوز. المعاجم المتخصصة في الهندسة المدنية والنقل توفر مصطلحات مسكوكة ومستقرة لهذا المفهوم مثل 'حارة انتظار' و'مركن جانبي'."
  blind_candidates:
    - lemma: "حَارَة انْتِظَار"
      generation_method: tarkib
      justification: "تركيب إضافي يُستخدم في الهندسة المدنية للدلالة على الجزء الجانبي من الطريق المخصص للتوقف."
    - lemma: "مَرْكَن جَانِبِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يُشير إلى مكان ركن السيارات الجانبي، وهو متداول في معاجم النقل."
    - lemma: "فُسْحَة وُقُوف"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر بدقة عن المساحة المخصصة لوقوف السيارات."
    - lemma: "مُتَّسَع"
      generation_method: ishtiqaq
      justification: "اسم مكان من 'اتسع' يدل على المكان الواسع، ويمكن إطلاقه على التوسعة في الطريق."

stage2_evidence:
  per_lemma:
    - lemma: "توسعة جانبية"
      evidence_status: "no_material_found"
    - lemma: "مفسح"
      evidence_status: "no_material_found"
    - lemma: "حارة انتظار"
      confirm:
        - text: "جزء من طريق خارج حدود حركة الآليات يمكن للسيارات التوقف فيه (lay-by)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
    - lemma: "مركن جانبي"
      confirm:
        - text: "مركن جانبي، نقطة الوقوف (lay by)"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
    - lemma: "فسحة وقوف"
      confirm:
        - text: "فسحة الوقوف (على جانب الطريق) (lay by)"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
    - lemma: "متسع"
      contradicts:
        - text: "يقال ما لي عن ذلك متسع مصرف"
          source: "المعجم الوسيط"
          conflict: "الكلمة تستخدم للدلالة على السعة بشكل عام وليس مصطلحاً مسكوكاً لتوسعة الطريق المخصصة لوقوف السيارات."

stage3_analysis:
  per_lemma:
    - lemma: "توسعة جانبية"
      decision: confirmed
      decision_reason: "مصطلح هندسي وصفي واضح الملامح ومفهوم الدلالة ويشير مباشرة إلى عملية التوسعة التي تتم على جانب الطريق."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوْسِعَة جَانِبِيَّة"

    - lemma: "مفسح"
      decision: removed
      decision_reason: "لم يثبت استعمالها معجمياً للإشارة إلى هذا المفهوم التقني، وهناك بدائل معاصرة أكثر دقة وشيوعاً."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حَارَة انْتِظَار"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسكوك ومعتمد في المعجم الموحد لمصطلحات الهندسة المدنية ويطابق تعريف المجموعة بدقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "حَارَة انْتِظَار"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَرْكَن جَانِبِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسكوك ومعتمد في المعجم الموحد لمصطلحات النقل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "مَرْكَن جَانِبِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "فُسْحَة وُقُوف"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد ومستخدم في المعاجم التقنية للإشارة إلى المساحة المخصصة للتوقف خارج مسار السير."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "فُسْحَة وُقُوف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُتَّسَع"
      source: stage1
      decision: removed
      decision_reason: "كلمة عامة تشير إلى المكان الواسع، ولا تشكل مصطلحاً مخصصاً لـ lay-by."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "جزء من الطريق تم توسيعه للسماح للسيارات بالمرور أو التوقف"
    assessment:
      decision: revise
      reason: "صياغة التعريف بأسلوب معجمي أكثر إحكاماً، مع استبدال 'السيارات' بـ 'المركبات' لتشمل كافة الأنواع."
    authored:
      - type: terminological
        text: "جُزْءٌ مِنَ الطَّرِيقِ يُوَسَّعُ خَارِجَ المَسَارِ الرَّئِيسِيِّ لِلسَّمَاحِ لِلمَرْكَبَاتِ بِالتَّوَقُّفِ أَوِ المُرُورِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "جُزْءٌ مِنَ الطَّرِيقِ يُوَسَّعُ خَارِجَ المَسَارِ الرَّئِيسِيِّ لِلسَّمَاحِ لِلمَرْكَبَاتِ بِالتَّوَقُّفِ أَوِ المُرُورِ."

