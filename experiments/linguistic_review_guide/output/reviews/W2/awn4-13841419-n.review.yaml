# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13841419-n (ratio / نِسْبَة)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (نِسْبَة)، وهو مصطلح رياضي أساسي يستحق إثراء بمترادفات أو مرادفات سياقية"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي، يحتاج صياغة معجمية عربية أصيلة"
    observations: "المفهوم الرياضي (ratio) مستقر في الاستعمال العربي الحديث والتراثي تحت لفظ «نِسْبَة»، وقد استعمله المحاسبون والمهندسون العرب منذ القرون الوسطى. التعريف الحالي يستعمل عبارة «المقادير النسبية» وهي ترجمة لـ relative magnitudes، والأدق أن يُعرَّف بأسلوب المعجم الرياضي العربي."

  blind_candidates:
    - lemma: "نِسْبَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن-س-ب على وزن فِعْلَة، المصطلح الرياضي المعياري للدلالة على قياس مقدار إلى مقدار آخر من جنسه. مستعمل منذ عصر الترجمة."
    - lemma: "تَنَاسُب"
      generation_method: ishtiqaq
      justification: "من الجذر ن-س-ب على وزن تَفَاعُل، يدل على التشاكل والتقابل بين مقدارين. لكنه في الاصطلاح الرياضي يعني تساوي نسبتين (proportion) لا النسبة ذاتها (ratio)."
    - lemma: "مُعَدَّل"
      generation_method: ishtiqaq
      justification: "من الجذر ع-د-ل على وزن مُفَعَّل، يدل على المقدار المعتدل أو الوسط الحسابي. قد يُستعمل بمعنى النسبة في بعض السياقات لكنه أقرب إلى rate أو average."
    - lemma: "قِسْط"
      generation_method: majaz
      justification: "من الجذر ق-س-ط، أصله الحصة والنصيب بالعدل، وفيه دلالة على المقدار المحسوب قياساً إلى كلّ. إزاحة دلالية من الحصة إلى النسبة الكمية."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "نِسْبَة"
      confirm:
        - text: "«النِّسْبَةُ: إِضَافَة مَا فِي الْقدر بَين مقدارين متجانسين.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«النِّسْبَةُ: أَن ينْسب الْعدَد إِلَى آخر، فَيُقَال نصفه، أَو مثله.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«(النِّسْبَة) الصِّلَة أَو الْقَرَابَة و (فِي الرياضة) نتيجة مُقَارنَة إِحْدَى كميتين من نوع وَاحِد بِالْأُخْرَى والمقدار الْمَنْسُوب (مج)»"
          source: "المعجم الوسيط"
        - text: "«النّسبة: بالكسر وسكون السين هي تطلق على معان. منها قياس شيء إلى شيء... ومنها قياس كمية أحد العددين إلى كمية الآخر والعدد الأول يسمّى منسوبا ومقدّما والعدد الثاني يسمّى منسوبا إليه وتاليا وعليه اصطلاح المهندسين والمحاسبين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«نسبة = ratio»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) / المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "المصطلح معتمد في المعاجم الموحدة لأليكسو مقابل ratio"

    - lemma: "تَنَاسُب"
      contradicts:
        - text: "«(التناسب) التشابه و (فِي الرياضة) تَسَاوِي نسبتين مثل أ / ب = ج / د»"
          source: "المعجم الوسيط"
          conflict: "التناسب في الرياضة هو تساوي نسبتين (proportion)، وليس النسبة ذاتها (ratio). فالتناسب مفهوم مختلف أعلى مرتبة."
        - text: "«تناسب = proportion»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "ARABTERM يؤكد أن تناسب يقابل proportion لا ratio"

    - lemma: "مُعَدَّل"
      evidence_status: "no_material_found"

    - lemma: "قِسْط"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "نِسْبَة"
      decision: confirmed
      decision_reason: "لمّة مؤكدة بأدلة معجمية وافرة من المعاجم التراثية والحديثة والمعاجم الموحدة. نِسْبَة هي المصطلح الرياضي المعياري المقابل لـ ratio في العربية، مستعمل منذ عصر الترجمة عند المحاسبين والمهندسين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: "وزن فِعْلَة من الجذر ن-س-ب يناسب الدلالة على الهيئة أو الحالة الناتجة عن النسب (القياس). الوزن مناسب تماماً للمفهوم."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِسْبَة"

    - lemma: "تَنَاسُب"
      source: stage1
      decision: removed
      decision_reason: "التناسب في الاصطلاح الرياضي يدل على تساوي نسبتين (proportion = أ/ب = ج/د)، وهو مفهوم مختلف عن النسبة (ratio) التي هي قياس مقدار واحد إلى آخر. لا يصح إدراجه في هذه المجموعة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُعَدَّل"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تربط مُعَدَّل بمفهوم ratio. المصطلح أقرب إلى rate أو average في الاستعمال المعاصر، وهو مفهوم إحصائي مختلف."
      evidence_assessment:
        case: no_material

    - lemma: "قِسْط"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة على استعمال قِسْط بمعنى النسبة الرياضية. دلالته الأصلية على الحصة والنصيب العادل لا تمتد إلى مفهوم القياس الكمي بين مقدارين."
      evidence_assessment:
        case: no_material


