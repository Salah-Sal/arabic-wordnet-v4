        params:
          sense_id: "{auto}"
          text: "وجدت في الصندوق خَلِيطاً من الأوراق والأشياء القديمة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تحول المبنى القديم إلى رُكَامٍ من الحجارة والخشب."
      - command: add_sense_example
        params:
