      - lemma: "تَكَتُّل"
        examples:
          - text: "شكّلت هذه المواد تَكَتُّلاً غير منتظم في قاع الوعاء."
            type: usage
      - lemma: "تَكَدُّس"
        examples:
          - text: "أدى تَكَدُّس البضائع إلى فوضى في المخزن."
