stage1_review:
  assessment:
    concerns:
      - "خلو المجموعة من التشكيل في اللمات الموجودة."
      - "نقص اللمات المعبرة عن الاختلاط العشوائي مثل (خليط) واقتصار اللمات الموجودة على معنى التجمع فقط (تكتل، تكدس)."
    observations: "المفهوم الإنجليزي (a jumbled collection or mass) يحمل شقين: التجمع (mass) والاختلاط العشوائي (jumble). اللمات الموجودة تغطي التجمع بنسبة أكبر. يجب إضافة لمات تعبر عن العشوائية في الجمع."
  blind_candidates:
    - lemma: "رُكَام"
      generation_method: ishtiqaq
      justification: "مصطلح يدل على تراكم الأشياء وتجمعها بعضها فوق بعض عشوائياً."
    - lemma: "خَلِيط"
      generation_method: ishtiqaq
      justification: "اسم يدل على ما اختلط من أشياء مختلفة دون ترتيب، وهو يقابل jumble."
    - lemma: "لَفِيف"
      generation_method: majaz
      justification: "يستعمل للدلالة على الجمع المختلط من الناس أو الأشياء من أصول شتى."
    - lemma: "كَوْمَة"
      generation_method: ishtiqaq
      justification: "تدل على تجمع الأشياء وتكدسها بشكل غير منتظم."

stage2_evidence:
  per_lemma:
    - lemma: "تكتل"
      confirm:
        - text: "تجمع مواد مختلفة في كتلة واحدة"
          source: "المعجم الموحد لمصطلحات الكيمياء"
        - text: "«أ» تكتيل؛ تكبيب. «ب» تكتُّل؛ تَكَبُّب"
          source: "المورد الحديث"
    - lemma: "تكدس"
      confirm:
        - text: "تجمع المواد بشكل كتلة"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
    - lemma: "خليط"
      confirm:
        - text: "خليط؛ مجموعة أشياء مختلطة بغير انتظام."
          source: "المورد الحديث"
        - text: "ما اختلَط من صنفين أو أصناف المخالِط."
          source: "المعجم الوسيط"
    - lemma: "ركام"
      confirm:
        - text: "ما اجتمع من الأشياء وتراكَمَ بعضُه فوق بعض (رُكامٌ من رمل, وركام من سَحَاب)"
          source: "المعجم الوسيط"
    - lemma: "لفيف"
      confirm:
        - text: "ما اجتمع من الناس من قبائل شتّى, أو من أخلاط شتّى ... طعام لفيف: مخلوطٌ من جنسين فصاعدًا"
          source: "المعجم الوسيط"
    - lemma: "كومة"
      confirm:
        - text: "مجموعة؛ كومة؛ كتلة."
          source: "المورد الحديث"
        - text: "الكَوْم"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "تكتل"
      decision: confirmed
      decision_reason: "الكلمة صحيحة وتدل على تجمع الأشياء واندماجها في كتلة واحدة، وتحتاج للتشكيل فقط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَتُّل"
    - lemma: "تكدس"
      decision: confirmed
      decision_reason: "الكلمة صحيحة للتعبير عن تجمع المواد وتراكمها، وتحتاج لتصحيح التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَدُّس"
    - lemma: "خَلِيط"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر بدقة متناهية عن الشق الثاني من التعريف (أشياء مختلطة بغير انتظام) وتقابل الكلمة الإنجليزية jumble."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "خَلِيط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "رُكَام"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على الأشياء المتجمعة المتراكمة بعضها فوق بعض عشوائياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "رُكَام"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "لَفِيف"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ فصيح يستخدم للمجموعات المختلطة سواء من الأشياء أو غيرها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "لَفِيف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "كَوْمَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن الكتلة المتجمعة من الأشياء غير المنتظمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "كَوْمَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

