stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "الحاجة إلى إضافة مصطلحات طبية ومعجمية معتمدة مثل 'سوء التوضع'."
    observations: "المفهوم يشير إلى وضعية غير صحيحة أو معيبة لشيء ما (malposition)، وهو مفهوم شائع في السياقات الطبية والتقنية. اللمّات الحالية 'سوء تموضع' و'وضع خاطئ' صحيحة ولكنها تحتاج إلى تعزيز بمترادفات أكثر تخصصاً ودقة."
  blind_candidates:
    - lemma: "سُوءُ التَّوَضُّعِ"
      generation_method: tarkib
      justification: "المصطلح الطبي المعياري المقابل لـ (malposition) في المعاجم الطبية المتخصصة."
    - lemma: "سُوءُ الوَضْعَةِ"
      generation_method: tarkib
      justification: "تعبير معجمي (المورد الحديث) يصف الهيئة أو الوضعية الخاطئة."
    - lemma: "خَلَلُ المَوْضِعِ"
      generation_method: tarkib
      justification: "تعبير اصطلاحي يشير إلى وجود عيب (خلل) في مكان استقرار الشيء."
    - lemma: "تَمَوْضُعٌ مَعِيبٌ"
      generation_method: tarkib
      justification: "اشتقاق وصفي مباشر من التعريف العربي (موضع معيب)."

stage2_evidence:
  per_lemma:
    - lemma: "سُوء تَمَوْضُع"
      confirm:
        - text: "«تموضع موازٍ: (في النقل)»"
          source: "المعجم الموحد لمصطلحات النقل"
        - text: "«إيرادات ناتجة عن إعادة تموضع الحاويات»"
          source: "المعجم الموحد لمصطلحات النقل"
      expands:
        - text: "«تموضع المفاتيح في لوحة المفاتيح»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          addition: "يؤكد استخدام 'تموضع' في سياق الترتيب المكاني التقني."
    - lemma: "وَضْع خَاطِئ"
      confirm:
        - text: "«سوء الوَضْعة: وضع خاطئ، كوضع الجنين، أحيانًا، في الرَّحِم.»"
          source: "المورد الحديث"
    - lemma: "سُوءُ التَّوَضُّعِ"
      confirm:
        - text: "«سوء التوضع (malposition)»"
          source: "المعجم الطبي الموحد"
    - lemma: "سُوءُ الوَضْعَةِ"
      confirm:
        - text: "«سوء الوَضْعة: وضع خاطئ (malposition)»"
          source: "المورد الحديث"
    - lemma: "خَلَلُ المَوْضِعِ"
      confirm:
        - text: "«خلل الموضع (ectopy, malposition)»"
          source: "معجم المصطلحات الطبية"

stage3_analysis:
  per_lemma:
    - lemma: "سُوء تَمَوْضُع"
      decision: confirmed
      decision_reason: "مصطلح تقني معاصر مستخدم بكثرة في السياقات العلمية واللوجستية، وهو بديل مقبول للمصطلح الطبي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُوءُ تَمَوْضُعٍ"
    - lemma: "وَضْع خَاطِئ"
      decision: confirmed
      decision_reason: "تعبير وصفي عام ودقيق يطابق التعريف الإنجليزي (faulty position) ومذكور في المعاجم الحديثة كشرح للمصطلح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَضْعٌ خَاطِئٌ"
    - lemma: "سُوءُ التَّوَضُّعِ"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الطبي الرسمي المعتمد في المعجم الطبي الموحد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "سُوءُ التَّوَضُّعِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-05086281-n"}
    - lemma: "سُوءُ الوَضْعَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير معجمي دقيق يركز على هيئة الوضع (posture)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "سُوءُ الوَضْعَةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-05086281-n"}
    - lemma: "خَلَلُ المَوْضِعِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مرادف معتمد في المعاجم الطبية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "خَلَلُ المَوْضِعِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-05086281-n"}

stage4_content:
  definition:
    current: "موضع معيب أو غير صحيح"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويغطي الجوانب المختلفة للمفهوم."
  examples:
    per_lemma:
      - lemma: "سُوءُ تَمَوْضُعٍ"
        examples:
          - text: "يُمكن أن يُؤدي سُوءُ تَمَوْضُعِ الجنينِ إلى تَعَقُّدِ عمليةِ الولادةِ الطبيعية."
            type: usage
      - lemma: "وَضْعٌ خَاطِئٌ"
        examples:
          - text: "كانَ الوَضْعُ الخَاطِئُ لِلعمودِ الفقريِّ سَببًا رئيسًا في آلامِ ظَهْرِه المزمنة."
            type: usage
      - lemma: "سُوءُ التَّوَضُّعِ"
        examples:
          - text: "أظهرتْ صُورُ الأشعةِ سُوءَ تَوَضُّعٍ في مَفْصِلِ الرُّكبةِ نَتجَ عن الإصابة."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-05086281-n", text: "أدَّى سُوءُ التَّمَوْضُعِ لِلآلاتِ في الورشةِ إلى تعطلِ خطِّ الإنتاج."}

stage5_enrichment:
  per_entry:
    - lemma: "سُوءُ تَمَوْضُعٍ"
      entry_id: "{auto}"
      roots:
        - word: "سوء"
          root: "سوأ"
          maqayis_quote: "«السِّينُ وَالْوَاوُ وَالْهَمْزَةُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْقُبْحِ وَالضَّرَرِ... وَالسُّوءُ: كُلُّ مَا يُحْزِنُ الْإِنْسَانَ.»"
        - word: "تموضع"
          root: "وضع"
          maqayis_quote: "«الْوَاوُ وَالضَّادُ وَالْعَيْنُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْخَفْضِ [لِلشَّيْءِ] وَحَطِّهِ. وَوَضَعْتُهُ بِالْأَرْضِ وَضْعًا.»"
    - lemma: "وَضْعٌ خَاطِئٌ"
      entry_id: "{auto}"
      roots:
        - word: "وضع"
          root: "وضع"
          maqayis_quote: "«الْوَاوُ وَالضَّادُ وَالْعَيْنُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْخَفْضِ [لِلشَّيْءِ] وَحَطِّهِ.»"
        - word: "خاطئ"
          root: "خطأ"
          maqayis_quote: "«الْخَاءُ وَالطَّاءُ وَالْمَهْمُوزُ يَدُلُّ عَلَى تَعَدِّي الشَّيْءِ، وَالذَّهَابِ عَنْهُ... وَالْخَطَاءُ مِنْ هَذَا؛ لِأَنَّهُ مُجَاوَزَةُ حَدِّ الصَّوَابِ.»"
  per_sense:
