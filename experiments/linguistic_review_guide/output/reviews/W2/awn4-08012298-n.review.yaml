# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-08012298-n (colony – biological)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحوي لمّة واحدة فقط (مُسْتَعْمَرَة)؛ مفهوم المستعمرة البيولوجية غني بالمرادفات المحتملة في المعجمية العربية المعاصرة"
      - "التعريف العربي الحالي مقبول لكنه ترجمة شبه حرفية للتعريف الإنجليزي، ولا يميّز بوضوح بين المستعمرة البيولوجية والمستعمرة السياسية"
    observations: "المفهوم المستهدف هو التجمّع الأحيائي لكائنات من نوع واحد تعيش أو تنمو معاً، وهو مصطلح مركزي في علم الأحياء الدقيقة وعلم البيئة. الجنس القريب هو «مجموعة أحيائية» (المفرط المباشر). الفصل النوعي: كون الكائنات من نوع واحد وتعيش مجتمعة. يجب التحقق من وجود مرادفات عربية أخرى مستعملة في المعاجم المتخصصة."

  blind_candidates:
    - lemma: "حِلَّة"
      generation_method: majaz
      justification: "الحِلَّة في العربية الكلاسيكية: منزل القوم ومجتمع البيوت؛ يمكن توسيعها مجازياً لتشمل تجمّع الكائنات الحية في موطن واحد، على سبيل الاستعارة من الحلول البشري إلى الحلول الأحيائي"
    - lemma: "مُسْتَوْطَنَة"
      generation_method: ishtiqaq
      justification: "من الجذر و-ط-ن على وزن مُسْتَفْعَلَة، بمعنى الموطن الذي تستوطنه الكائنات وتتكاثر فيه، يوازي مُسْتَعْمَرَة صرفياً ودلالياً"
    - lemma: "سِرْب"
      generation_method: majaz
      justification: "السِّرْب في المعجم الوسيط: الفريق من الطير والحيوان؛ قد يُوسَّع ليشمل أي تجمّع حيواني متراصّ"
    - lemma: "مُجَمَّع أَحْيَائِيّ"
      generation_method: tarkib
      justification: "مركب إضافي وصفي من مُجَمَّع (اسم مكان من جمّع) + أحيائي (نسبة إلى الأحياء)، يصف المفهوم بدقة: تجمّع لكائنات حية"

stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَعْمَرَة"
      confirm:
        - text: "«(فى علم الأحياء الدقيقة): مجموعة من الخلايا تعيش مجتمعة منغرزة فى مادة مخاطية»"
          source: "المعجم الوسيط"
        - text: "«مجوعة من الأحياء المتشابهة يعيش بعضها مع بعض»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«مجوعة من الأحياء المتشابهة يعيش بعضها مع بعض»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«(5) «أ», المستعمَرة: «ب» مجموعة الحيوانات أو النباتات العائشة أو النامية معًا a colony of bees. «ج» مجموعة من المتعضِّيات المجهرية (بك).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«إقليم يحكمه أجنبي يستوطنه أو يكتفى باستغلاله اقتصادياً أو عسكرياً (مج)»"
          source: "المعجم الوسيط"
          addition: "المعنى السياسي (الاستعمار) هو المعنى الأول تاريخياً، والمعنى البيولوجي توسّع مجازي حديث"

    - lemma: "حِلَّة"
      confirm:
        - text: "«مستعمرة»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      contradicts:
        - text: "«منزل القوم جماعة البيوت مجتمع الناس»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي بشري اجتماعي (منزل القوم) لا أحيائي، والمعجم البيولوجي يكتفي بمرادفة «مستعمرة» دون تعريف مستقل"
      expands:
        - text: "«جَمَاعَةُ بُيوتِ النَّاسِ, أو هي مِئَةُ بَيْتٍ. ويُقَال: حَيٌّ حِلَّةٌ: نُزُولٌ وفيهم كَثْرَةٌ»"
          source: "المعجم الكبير"
          addition: "المعنى الكلاسيكي يدل على تجمّع بشري حلّ في موضع، وهو أساس الامتداد المجازي"

    - lemma: "مُسْتَوْطَنَة"
      confirm:
        - text: "«مجموعة أو كتلة من الجراثيم تنشأ من جرثومة واحدة، وتكون أشكالا مختلفة لها حسب نوع الجرثوم ونوع الزرع.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      contradicts:
        - text: "«المستعمِر؛ المستوطِن: شخص يشارك في إنشاء مستعمرة أو مستوطنَة أو يقيم فيها.»"
          source: "المورد الحديث (2008)"
          conflict: "مستوطنة في الاستعمال الشائع تعني المستوطنة البشرية/السياسية وليس التجمّع الأحيائي"

    - lemma: "سِرْب"
      confirm:
        - text: "«الفَريقُ من الطَّير والحيوان»"
          source: "المعجم الوسيط"
        - text: "«مجموعة من الطيور تتغذى أو تنقل وتطير معا.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      contradicts:
        - text: "«السِّينُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ مُطَّرِدٌ، وَهُوَ يَدُلُّ عَلَى الِاتِّسَاعِ وَالذَّهَابِ فِي الْأَرْضِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "جذر سرب يدل على الذهاب والحركة لا على الاستقرار والنمو المشترك؛ السرب تجمّع متنقل لا مستقرّ"

    - lemma: "مُجَمَّع أَحْيَائِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُسْتَعْمَرَة"
      decision: confirmed
      decision_reason: "مصطلح راسخ مُعتمَد في المعجم الوسيط والمعاجم الموحدة (الجيولوجيا، الزلازل، الصيدلة، الطب، البيولوجيا) بمعنى التجمّع الأحيائي. مشتق من الجذر ع-م-ر (العمارة والسكنى) على وزن مُسْتَفْعَلَة الدال على الطلب، أي الموضع المطلوب عمارته."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَعْمَرَة"

    - lemma: "حِلَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم ورودها في المعجم الموحد لعلم الأحياء (1993) مرادفةً لمستعمرة، إلا أن تعريفها دوراني (مستعمرة ← حلة ← مستعمرة)، ومعانيها الكلاسيكية متعددة (منزل القوم، إناء الطهي، الثوب) مما يُحدث لبساً شديداً. كما أن الكسرة على الحاء ضرورية للتمييز عن حُلَّة وحَلَّة، وهذا يُصعّب التداول."

    - lemma: "مُسْتَوْطَنَة"
      source: stage1
      decision: removed
      decision_reason: "وردت في معجم واحد فقط (الطب البيطري 2010) بمعنى المستعمرة الجرثومية، لكنها في الاستعمال العام مرتبطة بالمستوطنات السياسية ارتباطاً وثيقاً، مما يُثير التباساً ثقافياً حاداً. كما أن تعريفها في الطب البيطري يخصّ الجراثيم تحديداً لا الكائنات الحية عموماً."

    - lemma: "سِرْب"
      source: stage1
      decision: removed
      decision_reason: "السِّرْب يدل على الفريق من الطير والحيوان المتنقل، وجذره (سرب) يدل على الاتساع والذهاب في الأرض. المستعمرة البيولوجية تفترض الاستقرار والنمو المشترك في موضع واحد، لا التنقل. الفرق الدلالي جوهري: السِّرْب = flock/swarm (متحرك)، المستعمرة = colony (مستقرّ)."

    - lemma: "مُجَمَّع أَحْيَائِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ لا مصطلح مسكوك؛ لم يُعثر عليه في أي معجم. يمكن إبدال «مُجَمَّع» بمرادفاته (تجمّع، تكتّل) دون تغيّر المعنى، مما يدل على عدم التثبيت المعجمي. فشل في اختبار السكّ."

