step0_evidence:
  per_lemma:
    - lemma: "إنسان طيب"
      evidence_status: "no_material_found"
    - lemma: "فاعل خير"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُحْسِن"
      source_section: "step4_fts_keyword"
      evidence_citation: "«من يقدم الإحسان ويفعل ما هو خير دائما» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "اشتقاق: اسم فاعل من الفعل (أحسن)، يدل على من يتصف بالإحسان إلى الآخرين."
    - lemma: "خَيِّر"
      source_section: "step5_english_bridge"
      evidence_citation: "«الخيِّر؛ الإنسانيّ؛ مُحِبّ البشَر» — المورد الحديث (2008)"
      justification: "اشتقاق: صفة مشبهة من الجذر (خ ي ر) تدل على كثرة فعل الخير."
    - lemma: "طَيِّب"
      source_section: "step4_fts_keyword"
      evidence_citation: "«مَنْ تَخَلَّى عن الرذائل وتحلَّى بالفضائل... طَيِّبُ الأخلاق: إذا كان سَهْلَ المعاشرة» — المعجم الكبير"
      justification: "اشتقاق: صفة مشبهة من الجذر (ط ي ب) تدل على حسن الأخلاق والمعاملة."

step1_lemma_validation:
  per_lemma:
    - lemma: "إنسان طيب"
      decision: removed
      decision_reason: "تركيب وصفي حر مكون من موصوف وصفة، وليس وحدة معجمية مسكوكة."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركيب حر يفيد المعنى ولكنه ليس مصطلحا."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فاعل خير"
      decision: removed
      decision_reason: "تركيب إضافي غير مسكوك معجميا للدلالة على المفهوم العام للمجموعة الترادفية (الشخص الجيد)، ويغلب استعماله للدلالة على المتبرع المجهول."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "يميل للاستعمال في سياق التبرع والصدقة أكثر من السلوك العام."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "خَيِّر"
      source: step05
      decision: confirmed
      decision_reason: "كلمة فصيحة ومناسبة جدا للتعبير عن الشخص الذي يحب الخير للآخرين."
      step05_citation: "«الخيِّر؛ الإنسانيّ؛ مُحِبّ البشَر» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على كثرة فعل الخير ومحبته للناس."
      example: "كان رجلاً خيِّراً يسعى دائماً لمساعدة جيرانه."
      actions:
        - command: create_entry
          params:
            lemma: "خَيِّر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10158287-n"

    - lemma: "طَيِّب"
      source: step05
      decision: confirmed
      decision_reason: "كلمة فصيحة وشائعة للتعبير عن حسن الأخلاق ولين الجانب والمعاملة الحسنة."
      step05_citation: "«مَنْ تَخَلَّى عن الرذائل وتحلَّى بالفضائل... طَيِّبُ الأخلاق: إذا كان سَهْلَ المعاشرة» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على سلامة الصدر وحسن الخلق ولين الجانب."
      example: "عُرف بين أقرانه بأنه شخص طيِّب لا يحمل حقداً على أحد."
      actions:
        - command: create_entry
          params:
            lemma: "طَيِّب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10158287-n"

    - lemma: "مُحْسِن"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح دقيق للتعبير عن من يعامل الآخرين بإحسان."
      step05_citation: "«من يقدم الإحسان ويفعل ما هو خير دائما» — موسوعة السلطان قابوس لأسماء العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على تقديم المنفعة والإحسان الفعلي للآخرين."
      example: "شكر المدير كل مُحْسِنٍ ساهم في بناء المستشفى الخيري."
      actions:
        - command: create_entry
          params:
            lemma: "مُحْسِن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10158287-n"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "خَيِّر"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "طَيِّب"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "مُحْسِن"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

