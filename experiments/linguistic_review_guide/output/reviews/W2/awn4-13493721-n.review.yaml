    per_lemma:
      - lemma: "رَحَلَان كَهْرَبَائِيّ"
        examples:
          - text: "يُعتبر الرَحَلَان الكَهْرَبَائِيّ وسيلة فعالة لفصل البروتينات بناءً على حجمها وشحنتها."
            type: usage
      - lemma: "هِجْرَة كَهْرَبَائِيَّة"
        examples:
          - text: "تعتمد الهجرة الكهربائية للأيونات على شدة المجال الكهربائي المطبق."
            type: usage
      - lemma: "تَرْحِيل كَهْرَبَائِيّ"
        examples:
          - text: "يُستخدم الترحيل الكهربائي في الكشف عن الطفرات الجينية في عينات الدم."
            type: usage
      - lemma: "فَصْل كَهْرَبَائِيّ"
        examples:
          - text: "تتم عملية الفصل الكهربائي للجزيئات في وسط هلامي (جل)."
