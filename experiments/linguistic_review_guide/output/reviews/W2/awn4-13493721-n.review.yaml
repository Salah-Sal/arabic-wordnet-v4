stage1_review:
  assessment:
    concerns:
      - لا توجد مشكلات جوهرية، اللمة الحالية دقيقة علمياً.
      - نقص التشكيل في اللمة الموجودة.
    observations: "المصطلح تقني بحت، واستخدام 'رحلان' لترجمة phoresis هو تعريب دلالي موفق جداً، حيث يربط بين الحركة المادية (الرحيل) وبين الظاهرة الفيزيائية. التعريف العربي جامع ومانع."
  blind_candidates:
    - lemma: "رَحَلَان كَهْرَبَائِيّ"
      generation_method: tarkib
      justification: "المصطلح القياسي في المعاجم الطبية والعلمية الموحدة."
    - lemma: "هِجْرَة كَهْرَبَائِيَّة"
      generation_method: tarkib
      justification: "استخدام 'الهجرة' للتعبير عن انتقال الجسيمات في مجال كهربائي شائع جداً في الكيمياء."
    - lemma: "تَرْحِيل كَهْرَبَائِيّ"
      generation_method: ishtiqaq
      justification: "على وزن تفعيل للدلالة على إجراء العملية (cataphoresis/electrophoresis)."
    - lemma: "فَصْل كَهْرَبَائِيّ"
      generation_method: tarkib
      justification: "وصف وظيفي للعملية التي تُستخدم أساساً لفصل الجزيئات."

stage2_evidence:
  per_lemma:
    - lemma: "رحلان كهربائي"
      confirm:
        - text: "رَحَلان كَهْرَبَائِيّ: وسيلة تشخيصية مخبرية تعتمد على دراسة تحرك أو هجرة الجزيئات المكونة لأحد السوائل البيولوجية وغيرها ضمن مائع أو على الورق أو وسط آخر إثر تطبيق جهد كهربائيّ عليه."
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
        - text: "رَحَلان كهربائيّ: طريقة لفصل المواد من خلال حركتها في مجال كهربائي."
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
    - lemma: "رَحَلَان كَهْرَبَائِيّ"
      confirm:
        - text: "رَحَلان كَهْرَبَائِيّ: وسيلة تشخيصية مخبرية..."
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
    - lemma: "هِجْرَة كَهْرَبَائِيَّة"
      confirm:
        - text: "الهجرة الكهربائية [للجُسَيْمات المُعلَّقة] (cataphoresis)"
          source: "المورد الحديث"
        - text: "تهجير كهربائي (cataphoresis; electrophoresis): عملية كهروكيميائية يتم فيها تهجير الجزيئات الكبيرة في محلول بفعل تأثير تيار كهربائي"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "تَرْحِيل كَهْرَبَائِيّ"
      confirm:
        - text: "الترحيل الكهربائي (cataphoresis)"
          source: "المورد الحديث"
    - lemma: "فَصْل كَهْرَبَائِيّ"
      confirm:
        - text: "عملية الفصل الكهربائيّ: عملية فصل الجزيئات في محلول بواسطة التيار الكهربائيّ."
          source: "المعجم الموحد لمصطلحات علم الوراثة"

