stage1_review:
  assessment:
    concerns:
      - "خلو اللمة الأصلية (فلمنكيون) من التشكيل الدقيق."
      - "اللمة وردت بصيغة الجمع السالم، وهو قياسي ومقبول للإشارة إلى الشعوب والقوميات."
    observations: "التعريف دقيق ويعبر عن المفهوم بوضوح. المصطلح معرّب من Flemish ومستقر في الاستعمال العربي المعاصر للإشارة إلى هذا العرق كاسم منسوب مجموع."
  blind_candidates:
    - lemma: "فَلَمَنْكِيُّون"
      generation_method: taarib
      justification: "تعريب مباشر للفظ الأجنبي للتعبير عن القومية بصيغة الجمع القياسية لاسم المنسوب."
    - lemma: "شَعْبُ الفَلَمَنْك"
      generation_method: tarkib
      justification: "تركيب إضافي ينسب الشعب إلى اسم الجنس العرقي لتوضيح المعنى وتجنب اللبس."
    - lemma: "فْلَامِنْدِيُّون"
      generation_method: taarib
      justification: "تعريب بديل يعتمد على اللفظ الفرنسي (Flamand)، ويستخدم أحياناً في الأدبيات المترجمة."
    - lemma: "فَلَمَنْك"
      generation_method: taarib
      justification: "استخدام اسم الجنس الجمعي المعرب للدلالة على الشعب بأسره."

stage2_evidence:
  per_lemma:
    - lemma: "فلمنكيون"
      confirm:
        - text: "(1) فَلَمَنْكِيّ (2) الفَلَمَنْكِيّ: واحد الفَلَمَنْكيين (3) اللُّغة الفَلَمَنْكيّة (4) الفَلَمَنْكِيّون."
          source: "المورد الحديث (2008)"
    - lemma: "فَلَمَنْكِيُّون"
      confirm:
        - text: "(1) فَلَمَنْكِيّ (2) الفَلَمَنْكِيّ: واحد الفَلَمَنْكيين (3) اللُّغة الفَلَمَنْكيّة (4) الفَلَمَنْكِيّون."
          source: "المورد الحديث (2008)"
    - lemma: "شَعْبُ الفَلَمَنْك"
      evidence_status: "no_material_found"
    - lemma: "فْلَامِنْدِيُّون"
      evidence_status: "no_material_found"
    - lemma: "فَلَمَنْك"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "فلمنكيون"
      decision: confirmed
      decision_reason: "مصطلح معرّب ومستقر في المعاجم العربية الحديثة للإشارة إلى هذه المجموعة العرقية، وصيغة الجمع دقيقة لتمثيل الشعب بأكمله."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَلَمَنْكِيُّون"
    - lemma: "فَلَمَنْكِيُّون"
      source: stage1
      decision: removed
      decision_reason: "مكررة ومطابقة للمة الأصلية التي تم اعتمادها وضبطها بالشكل."
    - lemma: "شَعْبُ الفَلَمَنْك"
      source: stage1
      decision: removed
      decision_reason: "تركيب صحيح ولكنه عبارة وصفية حرة وليست وحدة معجمية مسكوكة، وتغني عنها اللمة المفردة المنسوبة والمجموعة."
    - lemma: "فْلَامِنْدِيُّون"
      source: stage1
      decision: removed
      decision_reason: "صيغة أجنبية أقل شيوعاً من (فلمنكيون)، وتفتقر للدعم المعجمي في القواميس العربية المعتمدة."
    - lemma: "فَلَمَنْك"
      source: stage1
      decision: removed
      decision_reason: "يغلب استخدامها كاسم جنس واسم للمنطقة، والنسب المجموع (فلمنكيون) هو الأدق للإشارة للأفراد."

stage4_content:
  definition:
    current: "مجموعة عرقية تتحدث الفلمنكية وتعيش في شمال وغرب بلجيكا"
    assessment:
      decision: retain
      reason: "التعريف دقيق ومصاغ بأسلوب موسوعي سليم، يحدد الخصائص اللغوية والجغرافية للمجموعة بوضوح كافٍ."
  examples:
    per_lemma:
      - lemma: "فلمنكيون"
        examples:
          - text: "يُشكّل الفَلَمَنْكِيُّون النسبة الكبرى من السكان في دولة بلجيكا."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُشكّل الفَلَمَنْكِيُّون النسبة الكبرى من السكان في دولة بلجيكا."

stage5_enrichment:
  per_entry:
    - lemma: "فلمنكيون"
      entry_id: "{auto}"
  per_sense:
    - lemma: "فلمنكيون"
      sense_id: "{auto}"
      nuance: "مصطلح معرّب يدل حصراً على المجموعة العرقية الناطقة باللغة الفلمنكية التي تقطن الإقليم الفلمنكي في بلجيكا."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح معرّب يدل حصراً على المجموعة العرقية الناطقة باللغة الفلمنكية التي تقطن الإقليم الفلمنكي في بلجيكا.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-08500799-n"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "awn4-08500799-n"
        score: 0.95
