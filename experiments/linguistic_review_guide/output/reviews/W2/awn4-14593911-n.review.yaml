stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي هو ترجمة حرفية للتعريف الإنجليزي ويحتاج إلى صياغة اصطلاحية أدق."
    observations: "المجموعة تركز على مفهوم كيميائي تخصصي يتعلق بالروابط الكيميائية (polyvalence). المصطلح العربي الأكثر شيوعاً هو 'تعدد التكافؤ'."
  blind_candidates:
    - lemma: "تَعَدُّدُ التَّكَافُؤِ"
      generation_method: tarkib
      justification: "الترجمة الاصطلاحية المباشرة للمفهوم (polyvalency)."
    - lemma: "تَكَافُؤٌ مُتَعَدِّدٌ"
      generation_method: tarkib
      justification: "تعبير وصفي مرادف يستعمل في السياقات العلمية."
    - lemma: "مُتَعَدِّدُ التَّكَافُؤِ"
      generation_method: tarkib
      justification: "استخدام الصفة (polyvalent) كاسم للدلالة على الحالة أو الشيء المتصف بها."
    - lemma: "كَثْرَةُ التَّكَافُؤِ"
      generation_method: tarkib
      justification: "بديل لغوي أقل شيوعاً يعبر عن نفس المفهوم."

stage2_evidence:
  per_lemma:
    - lemma: "تعدد التكافؤ"
      confirm:
        - text: "«(1) تعدُّد التكافؤ (ك) (2) تعدُّد القُوَى (بك).»"
          source: "المورد الحديث (2008)"
        - text: "«تعدد التكافؤ: polyvalency (Chemistry)»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "مُتَعَدِّدُ التَّكَافُؤِ"
      confirm:
        - text: "«متعدد التكافؤ: polyvalent (Chemistry)»"
