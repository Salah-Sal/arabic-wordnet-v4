stage4_content:
  definition:
    current: "(كيمياء) حالة امتلاك تكافؤ أكبر من اثنين"
    assessment:
      decision: revise
      reason: "التعريف الحالي سطحي، ويُفضل استخدام صياغة اصطلاحية تربط المفهوم بالهيدروجين أو الروابط الكيميائية كما في المعاجم العلمية."
    authored:
      - type: terminological
        text: "(كيمياء) قُدْرَةُ الذَّرَّةِ أَوْ الْمَجْمُوعَةِ عَلَى الِاتِّحَادِ بِمَا يَزِيدُ عَلَى ذَرَّتَيْنِ مِنْ الْهِيدْرُوجِينِ أَوْ مَا يُكَافِئُهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14593911-n", definition_index: 0, text: "(كيمياء) قُدْرَةُ الذَّرَّةِ أَوْ الْمَجْمُوعَةِ عَلَى الِاتِّحَادِ بِمَا يَزِيدُ عَلَى ذَرَّتَيْنِ مِنْ الْهِيدْرُوجِينِ أَوْ مَا يُكَافِئُهَا."}

  examples:
    per_lemma:
      - lemma: "تَعَدُّدُ التَّكَافُؤِ"
        examples:
          - text: "يُعَدُّ تَعَدُّدُ التَّكَافُؤِ مِنْ الصِّفَاتِ الْمُمَيِّزَةِ لِلْعَنَاصِرِ الِانْتِقَالِيَّةِ فِي الْجَدْوَلِ الدَّوْرِيِّ."
            type: usage
      - lemma: "مُتَعَدِّدُ التَّكَافُؤِ"
        examples:
          - text: "تَتَمَيَّزُ بَعْضُ الْمَعَادِنِ بِأَنَّهَا مُتَعَدِّدَةُ التَّكَافُؤِ، مِمَّا يَجْعَلُهَا تُشَكِّلُ مُرَكَّبَاتٍ مُخْتَلِفَةً."
            type: usage
      - lemma: "تَكَافُؤٌ مُتَعَدِّدٌ"
        examples:
          - text: "لِلْكَرْبُونِ تَكَافُؤٌ مُتَعَدِّدٌ يُمَكِّنُهُ مِنْ بِنَاءِ سَلَاسِلَ عُضْوِيَّةٍ مَعَقَّدَةٍ."
