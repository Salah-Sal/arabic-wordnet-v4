# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي 'شخص تم عزله أو فصله' مصوغ بأسلوب عامي ركيك ويفتقر إلى الجنس القريب والفصل النوعي الملائمَيْن لمعجم علمي"
      - "التعريف دائر على جذري اللمّتين الموجودتين (عزل/فصل)، مما يُحدث حلقة مرجعية صريحة"
      - "لمّة 'مَفْصُول' مشتركة لفظياً في العربية المعاصرة بين الفصل الاجتماعي وفصل الموظف من عمله، وهو اشتراك يُضعف الدقة الدلالية"
      - "غياب لمّة 'مَنْبُوذ' رغم أنها الاصطلاح الاجتماعي الأدق للشخص المُقصَى عن الجماعة بإرادة المجتمع"
    observations: >
      المجموعة تُعبِّر عن مفهوم الشخص الذي فُرض عليه الابتعادُ عن الجماعة بفعل
      قرار خارجي أو ضغط اجتماعي. هذا المفهوم له في العربية ثروة لفظية أصيلة؛ فجذر
      'عزل' أعمّها وأشملها، وجذر 'نبذ' أدقّها في السياق الاجتماعي والأنثروبولوجي.
      اللمّتان الموجودتان (معزول، مفصول) صحيحتان بيد أن التعريف بحاجة إلى إعادة
      صياغة تتجنب الدوران. الاشتمال الفوقي على awn4-09786620-n (شخص يعمل وينجز
      الأمور) مقبول باعتبار المعزول شخصاً ذا فاعلية اجتماعية ولو مقيّدة.

  blind_candidates:
    - lemma: "مَنْبُوذ"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول على وزن مَفْعُول من الثلاثي المجرد 'نَبَذَ' (طرح وألقى من يده).
        الوزن يناسب تماماً الإنسانَ الواقعَ عليه فعلُ الطرح والإقصاء الاجتماعي.
        الجذر فصيح أصيل، والمصطلح مستقرّ في التراث اللغوي والاجتماعي.

    - lemma: "مُقْصَى"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول على وزن مُفْعَل من الرباعي 'أقصى' (مشتق من الجذر ق-ص-و/ق-ص-ي
        بمعنى الإبعاد إلى الطرف والهامش). يُعبِّر عن الشخص الذي دُفع إلى الحافة
        وأُبعد عن مركز الجماعة. شائع في الاستعمال المعاصر للتعبير عن التهميش.

    - lemma: "مُبَعَّد"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول على وزن مُفَعَّل من الثلاثي المزيد بالتضعيف 'بعَّدَ' (جعله بعيداً،
        نحّاه). يُفيد الإبعاد القسري عن الجماعة. وزن مُفَعَّل يُحيل على تكثيف الفعل
        وإمعانه مما يناسب الفصل الكامل عن الجماعة.

    - lemma: "مَطْرُود"
      generation_method: majaz
      justification: >
        اسم مفعول من الثلاثي 'طَرَدَ' (أبعد ونفى). إزاحة دلالية من الطرد الجسدي
        المادي إلى الإقصاء الاجتماعي؛ والمجاز مقبول لأن المشابهة الوظيفية قائمة
        (الشخص المطرود كالشيء المُلقى بعيداً). شائع في التراث بمعنى المُنحَّى المُبعَد.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة (٤ استعلامات):
#   ١. مطابقة دفعية لجميع اللمّات: معزول/مفصول/منبوذ/مقصي/مبعد/مطرود (+صيغ ال-)
#   ٢. جسر إنجليزي: segregate/segregated/isolated/secluded/ostracized/excluded/marginalized
#   ٣. إثراء دفعي (definitions+examples) للمداخل الرئيسية بـ entry_id
#   ٤. مقاييس اللغة لجذور: عزل / فصل / نبذ / طرد / بعد (dictionary_id=151)
stage2_evidence:
  per_lemma:

    - lemma: "مَعْزُول"
      confirm:
        - text: "«(1) يَعْزِل؛ يَفْصِل (2) يَعْزِل [عن سائر أعضاء المجتمع] (4) معزول [عن سائر أعضاء المجتمع] (5) شخص معزول؛ جماعة معزولة»"
          source: "المورد الحديث (2008) — ترجمة segregate"
        - text: "«(1) معزول؛ مفصول عن غيره a segregated area (2) معزول عنصريًّا in segregated schools (3) عَزْليّ: مطبِّق سياسة التمييز العنصري»"
          source: "المورد الحديث (2008) — ترجمة segregated"
        - text: "«معزول — isolated»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«معزول — isolated»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«معزول — isolated»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      expands:
        - text: "«وسط مفصول عن محيطه لمنع أو التقليل من انتقال الحرارة أو الصوت أو الكهرباء أو الكائنات أو غير ذلك، حسب نوعية العزل والمادة العازلة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          addition: "يُثبت أن 'معزول' يُفيد الانفصال الكامل عن المحيط، سواء أكان مادياً أم اجتماعياً"

    - lemma: "مَفْصُول"
      confirm:
        - text: "«(1) معزول؛ مفصول عن غيره a segregated area»"
          source: "المورد الحديث (2008) — ترجمة segregated"
      contradicts:
        - text: "«تصف الحاسوب وعموماً المستعمل الغير موصول بشبكة أو بخدمة على الخطّ. كما تصف المحيطيّ (بالخصوص طابعة) الغير مربوط منطقياً بالحاسوب»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          conflict: "الاستعمال الغالب لـ'مفصول' في المعاجم التقنية الحديثة هو بمعنى offline/disconnected لا الفصل الاجتماعي للأشخاص"
        - text: "«مفصول — disconnected»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "يُرسّخ معنى الانفصال المادي والشبكي على حساب الإقصاء الاجتماعي"

    - lemma: "مَنْبُوذ"
      confirm:
        - text: "«الْمَنْبُوذُ: اللَّقِيط»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (OCR)"
        - text: "«(المنبوذ) اللَّقِيط يُقَال الْتقط فلَان مَنْبُوذًا والمنبوذون طَائِفَة فِي الْهِنْد يتجنبهم الْمُجْتَمع الْهِنْدِيّ ويزدريهم لضعتهم وفقرهم وهوانهم على الله فِي أصل الْخلقَة فِيمَا يَزْعمُونَ (محدثة)»"
          source: "المعجم الوسيط — Hawramani (1998)"
        - text: "«منبوذ — pariah»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
        - text: "«منبوذ — outcast»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
      expands:
        - text: "«النُّونُ وَالْبَاءُ وَالذَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى طَرْحٍ وَإِلْقَاءٍ. وَنَبَذْتُ الشَّيْءَ أَنْبِذُهُ نَبْذًا: أَلْقَيْتُهُ مِنْ يَدِي. وَالصَّبِيُّ الْمَنْبُوذُ: الَّذِي تُلْقِيهِ أُمُّهُ»"
          source: "مقاييس اللغة — ابن فارس (جذر: نبذ)"
          addition: "يكشف أن الجذر يدلّ على الإلقاء والطرح، ومنه انتقل إلى الإقصاء الاجتماعي بمعنى من أُلقي جانباً وأُعرض عنه"

    - lemma: "مُقْصَى"
      evidence_status: "no_material_found"

    - lemma: "مُبَعَّد"
      contradicts:
        - text: "«المِبْعَدُ: رَجُلٌ مِبْعَدٌ: بعيد الأسْفَار. في الطب: آلة لإبعاد حافتي الجرح في الجراحة (retractor)»"
          source: "المعجم الكبير — مجمع اللغة العربية بالقاهرة (OCR)"
          conflict: "المدخل المُوثَّق هو اسم الآلة 'مِبْعَد' أو الصفة 'مِبْعَد' بمعنى بعيد الأسفار، لا اسم المفعول 'مُبَعَّد' بمعنى الشخص المُبعَد اجتماعياً"
        - text: "«مُبَعِّد — abducent / prop»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الصيغة المسجَّلة 'مُبَعِّد' (اسم فاعل) لا 'مُبَعَّد' (اسم مفعول)، وكلاهما مصطلح طبي لا اجتماعي"

    - lemma: "مَطْرُود"
      expands:
        - text: "«مَطْرُود: من (ط ر د) المبعد المنحى استخفافاً به أو عقاباً له، والصيد إذا أرهق حتى يصاد، والمنهزم والمولود أتى بعده مولود جديد»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
          addition: "يُثبت أن 'مطرود' يتضمن معنى الإبعاد لكنه مقيَّد بالاستخفاف أو العقوبة، وهو أخصّ من المفهوم العام للمجموعة"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مَعْزُول"
      decision: confirmed
      decision_reason: >
        لمّة فصيحة راسخة بدعم معجمي واسع. المورد الحديث يُترجم 'segregate' بـ'شخص
        معزول؛ جماعة معزولة' و'segregated' بـ'معزول؛ مفصول عن غيره' مباشرةً. أدلة
        المعاجم التقنية تؤكد الدلالة العامة للانفصال. وزن اسم المفعول مَفْعُول صحيح
        ومناسب. يجب تحديث التشكيل في سجل AWN4.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الأشمل والأعمّ دلالةً في المجموعة؛ يُفيد العزل بمعناه العام (مكاني واجتماعي
        وتقني) دون إيحاء صريح باحتقار أو رفض. يُستخدم في السياقات الرسمية وغير
        الرسمية، ويشمل العزل العنصري والسياسي والصحي على حدٍّ سواء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْزُول"

    - lemma: "مَفْصُول"
      decision: confirmed
      decision_reason: >
        مؤيَّد بشاهد من المورد الحديث 'معزول؛ مفصول عن غيره' مقابل segregated. وإن
        غلب استعماله التقني (offline/disconnected)، فإن الأصل اللغوي في مقاييس ابن
        فارس 'تمييز الشيء من الشيء وإبانته عنه' يسوّغ استعماله بمعنى المفصول عن
        جماعته. يُحتفظ به مع توثيق الفارق الدلالي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على انقطاع الرابط أو الصلة الرسمية بين الشخص والجماعة؛ يتضمن إيحاءً
        بالقطيعة المؤسسية وكثيراً ما يُلمح إلى الفصل بقرار رسمي. أخصّ من 'معزول'
        بتضمّنه فكرة القطيعة الإدارية، وأقل حدةً من 'منبوذ' لخلوّه من معنى الاحتقار.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَفْصُول"

    - lemma: "مَنْبُوذ"
      source: stage1
      decision: confirmed
      decision_reason: >
        دعم معجمي قوي من ثلاثة مصادر مستقلة: المعجم الوسيط (OCR+Hawramani) يُدرجه،
        ومسرد علم الاجتماع (ALECSO) يُرادفه بـ'pariah' و'outcast' وهما أقرب
        المصطلحات الإنجليزية لمفهوم المجموعة. الجذر 'نبذ' أصيل موثَّق في مقاييس
        اللغة. اجتاز اختبار السكّ: لا يمكن إبدال 'نبذ' بغيره دون تغيير المعنى
        الاصطلاحي. اجتاز اختبار التثبيت المعجمي: وحدة معجمية ثابتة مسجَّلة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الأخصّ دلالةً في الإقصاء الاجتماعي؛ يتضمن معنى الاحتقار والتجنُّب الإرادي
        من المجتمع. فالمنبوذ لا يُعزل فحسب، بل يُزدرى ويُتجنَّب بوعي. يُناسب
        السياقات الأنثروبولوجية والاجتماعية المتعلقة بالإقصاء المُعمَّد أكثر من غيره.
      actions:
        - command: create_entry
          params:
            lemma: "مَنْبُوذ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10595667-n"

    - lemma: "مُقْصَى"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية في قاعدة البيانات تدعم هذا المصطلح بوصفه وحدة معجمية مسكوكة
        لوصف الشخص المعزول. وإن كان الفعل 'أقصى' شائعاً، فإن 'مُقْصَى' كاسم مفعول
        للشخص لم يُسجَّل في المعاجم المستعلَمة بما يكفي للإضافة إلى AWN4.

    - lemma: "مُبَعَّد"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن الأوزان المُوثَّقة من جذر 'بعد' في سياق الإبعاد هي
        'مِبْعَد' (اسم آلة) و'مُبْعِد' (اسم فاعل) و'مُبَعِّد' (مصطلح طبي)، لا
        'مُبَعَّد' (اسم مفعول بالتضعيف) بمعنى الشخص المُبعَد اجتماعياً. صيغة مُفَعَّل
        لم تُوثَّق بهذا المعنى في المعاجم المستعلَمة.

    - lemma: "مَطْرُود"
      source: stage1
      decision: removed
      decision_reason: >
        اللمّة صحيحة لغوياً وموثَّقة غير أنها أخصّ من مفهوم المجموعة: 'مطرود' يتضمن
        الإبعادَ بعقوبة أو استخفاف (موسوعة سلطان قابوس)، وهو تضييق للدلالة عن
        المفهوم العام للعزل الاجتماعي. المجموعة مكتفية بعد إضافة 'منبوذ'.


