stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية جيدة ولكنها تحتاج إلى ضبط بالشكل الكامل."
      - "التعريف الحالي مقتضب جداً ويحتاج إلى صياغة معجمية أدق."
    observations: "المجموعة تعبر عن نواتج التكسر والتحطم، واللمّات المقترحة تغطي أوجهاً دلالية تخصصية (كالرُضاض الناتج عن السحق، والجُذاذ الناتج عن القطع)."
  blind_candidates:
    - lemma: "رُضَاض"
      generation_method: ishtiqaq
      justification: "ما رُضَّ ودُقَّ من الشيء، وهو تعبير دقيق عن القطع الصغيرة الناتجة عن السحق."
    - lemma: "جُذَاذ"
      generation_method: ishtiqaq
      justification: "ما تكسر وتفرّق من الشيء، وقد ورد في القرآن الكريم لوصف الأصنام المحطمة."
    - lemma: "دُقَاق"
      generation_method: ishtiqaq
      justification: "ما دقَّ وانكسر من الشيء، ويشير إلى الأجزاء الدقيقة جداً."
    - lemma: "بَرايَة"
      generation_method: ishtiqaq
      justification: "ما يسقط من الشيء عند بريه، وتناسب معنى الشظايا الخشبية (splinters) في سياقات معينة."

stage2_evidence:
  per_lemma:
    - lemma: "حطام"
      confirm:
        - text: "«من كل شيء: ما تحطم منه»"
          source: "المعجم الوسيط"
        - text: "«ما تَحَطَّمَ مِنْه حُطامُ الدُّنْيا: كُلُّ ما فيها من مالٍ يَفْنَى ولا يَبْقَى»"
          source: "المعجم الكبير"
    - lemma: "شظايا"
      confirm:
        - text: "«الشِّينُ وَالظَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى تَصَدُّعِ الشَّيْءِ مِنْ مَوَاضِعَ كَثِيرَةٍ، حَتَّى يَصِيرَ صُدُوعًا مُتَفَرِّقَةً»"
          source: "مقاييس اللغة"
        - text: "«شظايا؛ قِطع صغيرة.»"
          source: "المورد الحديث (ترجمة flinders)"
    - lemma: "فتات"
      confirm:
        - text: "«من الشَّيْء مَا تكسر مِنْهُ وتساقط»"
          source: "المعجم الوسيط"
        - text: "«الوارد في المعاجم «فُتات» بالضم، لما تفتت وتكسَّر من الشيء.»"
          source: "معجم الصواب اللغوي"
    - lemma: "رُضَاض"
      confirm:
        - text: "«رُضَاضُ الشيءِ: قِطَعُه، وما رُضَّ مِنْه فُتَاتُه أو كُسارُه»"
          source: "المعجم الكبير"
        - text: "«الدُّقاقُ والفُتات»"
          source: "المعجم الوسيط"
    - lemma: "جُذَاذ"
      confirm:
        - text: "«ما تكسَّر وتفرَّق من الشيء»"
          source: "المعجم الكبير"
        - text: "«المقطع أَو المكسر وَفِي التَّنْزِيل الْعَزِيز {فجعلهم جذاذا إِلَّا كَبِيرا لَهُم}»"
          source: "المعجم الوسيط"
    - lemma: "دُقَاق"
      confirm:
        - text: "«فتات كل شيء»"
          source: "المعجم الوسيط"
        - text: "«الصَّغِيرُ الرَّدِىءُ فُتَاتُ كُلِّ شىءٍ دُقَّ»"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "حطام"
      decision: confirmed
      decision_reason: "كلمة أصيلة تعبر عن نواتج التحطم، وتناسب معنى Debris وFragments."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُطَام"
    - lemma: "شظايا"
      decision: confirmed
      decision_reason: "المرادف الأدق للكلمة الإنجليزية flinders وsplinters، وتشير إلى القطع المتناثرة المتصدعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَظَايَا"
    - lemma: "فتات"
      decision: confirmed
      decision_reason: "شائعة الاستخدام للأجزاء الصغيرة المتساقطة، مع تصحيح الضبط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُتَات"
    - lemma: "رُضَاض"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر بدقة عن نواتج السحق والدق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رُضَاض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "جُذَاذ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ قرآني بليغ يعبر عن التكسر والتفرق في أجزاء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "جُذَاذ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "دُقَاق"
      source: stage1
      decision: confirmed
      decision_reason: "يشير إلى القطع المتناهية في الصغر (الفتات الدقيق)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دُقَاق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "قطع صغيرة وشظايا وكسرات"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي غير جامع."
    authored:
      - type: terminological
        text: "قِطَعٌ صَغِيرَةٌ مُتَنَاثِرَةٌ نَاتِجَةٌ عَنْ تَحَطُّمِ جِسْمٍ صَلْبٍ أَوْ تَكَسُّرِهِ أَوْ تَهَشُّمِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "قِطَعٌ صَغِيرَةٌ مُتَنَاثِرَةٌ نَاتِجَةٌ عَنْ تَحَطُّمِ جِسْمٍ صَلْبٍ أَوْ تَكَسُّرِهِ أَوْ تَهَشُّمِهِ."}
  examples:
    per_lemma:
      - lemma: "حُطَام"
        examples:
          - text: "تناثر حطام السفينة على طول الشاطئ بعد العاصفة."
            type: usage
      - lemma: "شَظَايَا"
        examples:
          - text: "تطايرت شظايا الزجاج في أرجاء الغرفة إثر الانفجار."
            type: usage
      - lemma: "فُتَات"
        examples:
          - text: "سقط فتات الخبز على المائدة."
            type: usage
      - lemma: "رُضَاض"
        examples:
          - text: "خلف الزلزال رُضاضاً من الصخور والحجارة."
            type: usage
      - lemma: "جُذَاذ"
        examples:
          - text: "جعل البطل الأصنام جُذاذاً محطماً."
            type: usage
      - lemma: "دُقَاق"
        examples:
          - text: "انقلبت العربة فصار ما فيها من فخار دُقاقاً."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "حُطَام"
      entry_id: "{auto}"
      root: "حطم"
      maqayis_quote: "«الْحَاءُ وَالطَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ كَسْرُ الشَّيْءِ. يُقَالُ حَطَمْتُ الشَّيْءَ حَطْمًا كَسْرَتُهُ.»"
    - lemma: "شَظَايَا"
      entry_id: "{auto}"
      root: "شظي"
      maqayis_quote: "«الشِّينُ وَالظَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى تَصَدُّعِ الشَّيْءِ مِنْ مَوَاضِعَ كَثِيرَةٍ، حَتَّى يَصِيرَ صُدُوعًا مُتَفَرِّقَةً.»"
    - lemma: "فُتَات"
      entry_id: "{auto}"
      root: "فتت"
      maqayis_quote: "«الْفَاءُ وَالتَّاءُ كَلِمَةٌ تَدُلُّ عَلَى تَكْسِيرِ شَيْءٍ وَرَفْتِهِ. يُقَالُ: فَتَتُّ الشَّيْءَ أَفُتُّ فَتًّا، فَهُوَ مَفْتُوتٌ وَفَتِيتٌ.»"
    - lemma: "رُضَاض"
      entry_id: "{auto}"
      root: "رضض"
      maqayis_quote: "«الرَّاءُ وَالضَّادُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى دَقِّ شَيْءٍ. يُقَالُ رَضَضْتُ الشَّيْءَ أَرُضُّهُ رَضًّا.»"
    - lemma: "جُذَاذ"
      entry_id: "{auto}"
      root: "جذذ"
      maqayis_quote: "«الْجِيمُ وَالذَّالُ أَصْلٌ وَاحِدٌ، إِمَّا كَسْرٌ وَإِمَّا قَطْعٌ. يُقَالُ جَذَذْتُ الشَّيْءَ كَسَرْتُهُ.»"
    - lemma: "دُقَاق"
      entry_id: "{auto}"
      root: "دقق"
      maqayis_quote: "«الدَّالُ وَالْقَافُ أَصْلٌ وَاحِدٌ يعَلَى صِغَرٍ وَحَقَارَةٍ. فَالدَّقِيقُ: خِلَافُ الْجَلِيلِ.»"
  per_sense:
    - lemma: "حُطَام"
      sense_id: "{auto}"
      nuance: "يُستخدم عادة لوصف بقايا الأشياء الضخمة المحطمة كالسفن أو المباني."
      mwe: false
    - lemma: "شَظَايَا"
      sense_id: "{auto}"
      nuance: "قطع حادة ومستدقة ناتجة عن تصدع أجسام صلبة كالقوارير أو العظام."
      mwe: false
    - lemma: "فُتَات"
      sense_id: "{auto}"
      nuance: "أجزاء صغيرة جداً تتساقط من الشيء عند تكسره أو فركه (كالخبز أو التراب)."
      mwe: false
    - lemma: "رُضَاض"
      sense_id: "{auto}"
      nuance: "الأجزاء الناتجة عن سحق الشيء أو دقه بشدة."
      mwe: false
    - lemma: "جُذَاذ"
      sense_id: "{auto}"
      nuance: "الأجزاء المكسرة المقطعة والمتفرقة."
      mwe: false
    - lemma: "دُقَاق"
      sense_id: "{auto}"
      nuance: "أصغر أنواع الفتات التي تقترب من كونها مسحوقاً."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حطم","maqayis":"«الْحَاءُ وَالطَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ كَسْرُ الشَّيْءِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"شظي","maqayis":"«الشِّينُ وَالظَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى تَصَدُّعِ الشَّيْءِ مِنْ مَوَاضِعَ كَثِيرَةٍ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"قطع حادة ومستدقة ناتجة عن تصدع أجسام صلبة كالقوارير أو العظام.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
