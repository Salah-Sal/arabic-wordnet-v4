# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-05222525-n  |  ILI: i64375  |  POS: n
# المراجع: صفة كون الشيء خفياً أو غير معلن
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (إضمار وخفاء) خاليتان من التشكيل الكامل في قاعدة البيانات."
      - "الإضمار في المعاجم العربية الكلاسيكية والحديثة مصطلح نحوي وعروضي أولاً، وإحالته على الخفاء والإضمار القلبي ثانوية؛ مما يجعله مرشَّحاً للالتباس في هذا السياق."
      - "خفاء (بالفتح) في المعاجم يُستعمل غالباً في السياق الاصطلاحي «برح الخفاء = وضح الأمر»، لا كمصطلح مجرَّد للخفاء."
      - "مفهوم ulteriority يحمل دلالة النية المبيَّتة الخفية، وهي أدق من مجرد الخفاء الحسّي؛ فالتعريف الحالي «خفياً أو غير معلن» واسع بعض الشيء."
    observations: >-
      المجموعة تمثّل مفهوماً فلسفياً-نفسياً يصف صفة ما يُضمَر خلاف ما يُظهَر، وهو مرتبط
      بالنية الخفية والغرض المستتر. العربية تملك تراثاً اشتقاقياً ثرياً في مجال الخفاء
      والتستر (جذور: خفي، ضمر، كمن، ستر) لكن الألفاظ المستقاة منها تتوزع بين الدلالة
      العامة على الخفاء الحسّي، ودلالة التستر القلبي والنيّوي الذي يقتضيه مفهوم «الخلفي».

  blind_candidates:
    - lemma: "كُمُون"
      generation_method: ishtiqaq
      justification: >-
        من الجذر (ك م ن)، وزن فُعُول، مصدر «كَمَنَ يَكْمُنُ». ابن فارس: «الكاف والميم والنون
        أُصيل يدل على استخفاء». الكمون: استتار الشيء عن الحس (السيوطي). مستعمل في المصطلحية
        الحديثة بمعنى latency في الطب والبيولوجيا، مما يدل على تثبيت معجمي نسبي.

    - lemma: "اسْتِتَار"
      generation_method: ishtiqaq
      justification: >-
        من الجذر (س ت ر)، وزن استفعال، يعني الاحتجاب والتخفّي. المعجم الوسيط وسواه يوظّفه
        في سياقات الخفاء والاحتجاب. يُقابل «the quality of being hidden» بصورة مباشرة.

    - lemma: "بَاطِنِيَّة"
      generation_method: ishtiqaq
      justification: >-
        المصدر الصناعي من «باطن»، يصف صفة ما كان في الباطن دون الظاهر. المعجم الموحد
        للسانيات يقابله بـ esotericism في سياق اللسانيات. يُمثِّل الجانب «غير المعلَن» في
        المفهوم.

    - lemma: "وَرَائِيَّة"
      generation_method: ishtiqaq
      justification: >-
        المصدر الصناعي من «وراء»، يُعادل مباشرةً البنية الاشتقاقية لـ ulteriority (اللاتينية
        ulterior = ما كان وراء/أبعد). يصف صفة ما يكون خلف الظاهر ووراءه من النيّات والأغراض.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات مُنفَّذة:
# ١. مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات) — entry_ids استُخرجت
# ٢. جسر إنجليزي: ulterior / ulteriority / concealment / hidden / latency / occultation
# ٣. بحث بالكلمات المفتاحية: خفي، استتار، كامن، مضمر
# ٤. مقاييس اللغة: جذور ضمر، خفي، كمن، ستر
stage2_evidence:
  per_lemma:

    - lemma: "إضمار"
      confirm:
        - text: >-
            «الضَّادُ وَالْمِيمُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى
            دِقَّةٍ فِي الشَّيْءِ، وَالْآخَرُ يَدُلُّ عَلَى غَيْبَةٍ وَتَسَتُّرٍ... وَمِنْ
            هَذَا الْبَابِ: أَضْمَرْتُ فِي ضَمِيرِي شَيْئًا؛ لِأَنَّهُ يُغَيِّبُهُ فِي
            قَلْبِهِ وَصَدْرِهِ»
          source: "مقاييس اللغة لابن فارس (جذر ضمر)"
        - text: "«الإضمار: ترك الشيء مع بقاء أثره»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: >-
            «الإضمار: (في العروض) إسكان الحرف الثاني المتحرك من التفعيلة؛ كالتاء من
            مُتَفاعِلُنْ في الكامل... (في النحو): عدم ظهور العامل، وتقديره مع بقاء أثره»
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: >-
            المعاجم الرئيسية (الوسيط، الكبير، كشاف التهانوي) توثّق الإضمار
            حصراً في دلالة نحوية وعروضية، لا كوصف مجرَّد للخفاء.
        - text: "«حذف بعض عناصر العبارة دون تأثير على فهم المقصود منها»"
          source: "مسرد الإعلام والتواصل — ArabTerm (ترجمته: ellipse)"
          conflict: "المصطلحية الحديثة تُثبّت الإضمار بمعنى الحذف اللغوي لا الخفاء."
      expands:
        - text: "«الإضمار: إسقاط الشيء لا معنى»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يُشير إلى حذف الظاهر مع بقاء المعنى — وهو أقرب المعاني إلى الخلفية الضمنية."

    - lemma: "خفاء"
      confirm:
        - text: >-
            «الْخَاءُ وَالْفَاءُ وَالْيَاءُ أَصْلَانِ مُتَبَايِنَانِ مُتَضَادَّانِ. فَالْأَوَّلُ
            السَّتْرُ... وَهُوَ فِي خِفْيَةٍ وَخَفَاءٍ إِذَا سَتَرْتَهُ»
          source: "مقاييس اللغة لابن فارس (جذر خفي)"
        - text: >-
            «الخَفَاء: من الأضداد يقال "خَفِيَ عليه الأمر" إذا استتر، و"خَفِيَ له" إذا ظهر»
          source: "التعريفات الفقهية للبركتي"
        - text: "«خَفَاء — الاستتار، والمتطأطئ من الأرض»"
          source: "موسوعة السلطان قابوس لأسماء العرب (جذر خفو)"
      contradicts:
        - text: "«الخَفَاء: المُتَطَأْطِئُ من الأرض؛ بَرِحَ الخَفَاءُ: وَضَحَ الأمر»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يُقيّد الخفاء (بالفتح) بالمعنى المكاني، لا المصدري المجرَّد."
      expands:
        - text: "«خَفَاء — (ترجمة: latency) — المعجم الطبي الموحد»"
          source: "المعجم الطبي الموحد — ArabTerm"
          addition: >-
            يُثبّت المعجم الطبي الموحد خفاء بمعنى الكمون/الخفاء الوظيفي، وهو أقرب
            دلالةً إلى المفهوم المقصود من معناه المكاني.

    - lemma: "كُمُون"
      confirm:
        - text: >-
            «الْكَافُ وَالْمِيمُ وَالنُّونُ أُصَيْلٌ يَدُلُّ عَلَى اسْتِخْفَاءٍ. يُقَالُ:
            كَمَنَ الشَّيْءُ كُمُونًا»
          source: "مقاييس اللغة لابن فارس (جذر كمن)"
        - text: "«الكُمُون: استتار الشيء عن الحس»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«كُمُون — latency» (مجالات: الطب البيطري، الصحة، الأحياء، الطاقة المتجددة)"
          source: "ArabTerm — معاجم متعددة"
      contradicts:
        - text: "«الكَمُّون: نبات زراعي عشبي حولي من الفصيلة الخيمية بزوره من التوابل»"
          source: "المعجم الوسيط"
          conflict: >-
            الكمون (بالتشديد) يُحيل على نبات التوابل المعروف بالإنجليزية cumin؛ ما يُنشئ
            اشتراكاً لفظياً مع كُمُون (المصدر من كمن) يُربك الدلالة في الاستعمال.

    - lemma: "اسْتِتَار"
      confirm:
        - text: >-
            «السِّينُ وَالتَّاءُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى الْغِطَاءِ. تَقُولُ:
            سَتَرْتُ الشَّيْءَ سَتْرًا. وَالسُّتْرَةُ: مَا اسْتَتَرْتَ بِهِ»
          source: "مقاييس اللغة لابن فارس (جذر ستر)"
        - text: >-
            «الاستتار: [في الإنجليزية] Disguise... عند الشعراء أن يغطّى حرف بحرف آخر
            من أجل استقامة الوزن»
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«تخفٍّ، استتار — overshadowing» (في السيميائية)"
          source: "المعجم الموحد لمصطلحات اللسانيات — ArabTerm"
      contradicts:
        - text: "«استتار — occultation» (مجال: الرياضيات والفلك)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك — ArabTerm"
          conflict: "في المصطلحية الفلكية والرياضية استُقطب الاستتار لمعنى الاحتجاب الفلكي."

    - lemma: "بَاطِنِيَّة"
      contradicts:
        - text: >-
            «الباطنية: فرقة من الشيعة تعتقد أن للشريعة ظاهراً وباطناً وتُمعن في التأويل»
          source: "المعجم الوسيط"
          conflict: "الاسم مشغول في المعجمية العربية للإحالة على الفرقة الدينية، لا على الصفة المجردة."
        - text: "«الباطنية — esotericism» (مجال: اللغة والأدب)"
          source: "المعجم الموحد لمصطلحات اللسانيات — ArabTerm"
          conflict: >-
            الترجمة الإنجليزية esotericism تُشير إلى مذهب بعينه لا إلى صفة الكون خفياً
            بشكل عام.

    - lemma: "وَرَائِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إضمار"
      decision: confirmed
      decision_reason: >-
        رغم أن الاستعمال المعجمي السائد للإضمار نحوي وعروضي، فإن ابن فارس يُثبّت للجذر ضمر
        معنى «الغيبة والتستر» بقوله «أضمرت في ضميري شيئاً؛ لأنه يغيّبه في قلبه وصدره»؛
        وهذا يُوافق دلالة القصدية الخفية (ulteriority) التي تعني إخفاء النية وراء الظاهر.
        اللمّة تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُركّز على الإضمار النيّوي والقصدي: إخفاء غَرَضٍ أو دافع في الضمير مع إبداء خلافه؛
        يُلمح إلى فاعلية إرادية في الستر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِضْمَار"

    - lemma: "خفاء"
      decision: confirmed
      decision_reason: >-
        الجذر خفي في مقاييس اللغة يؤسّس «الستر» أصلاً راسخاً، وخَفَاء مصدره يعني
        الاستتار والغيوبة. البركتي يوثّق استعمال خفاء بمعنى الاستتار، والمعجم الطبي الموحد
        يُقابله بـ latency. اللمّة مناسبة للدلالة على الصفة المجردة للخفاء والغموض.
        تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبّر عن الصفة العامة للاستتار والغموض بمعنى أوسع؛ يشمل الخفاء الحسّي والمعنوي
        دون اشتراط قصد أو نية — في مقابل إِضْمَار الذي يُضمّن إرادة الإخفاء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَفَاء"

    - lemma: "كُمُون"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم أن المصدر كُمُون من الجذر (كمن) يعني لغةً «استتار الشيء عن الحس» (السيوطي)،
        وهو مطابق للمفهوم دلالياً، إلا أن اللفظ مشغول في الاستعمال العربي الحديث بالاشتراك
        اللفظي مع «الكَمُّون» (نبات التوابل = cumin)، مما يُفضي إلى لبس بالغ في السياق
        المكتوب والمنطوق. لا يُستحسن إدخال لمّة تحمل هذا الاشتراك في الشبكة الدلالية.
      evidence_assessment:
        case: mixed

    - lemma: "اسْتِتَار"
      source: stage1
      decision: removed
      decision_reason: >-
        الاستتار مصدر فعلي يدل على «الفعل» أو «الحدث» أكثر من دلالته على «الصفة» الثابتة.
        يقابل the act of concealing oneself لا the quality of being ulterior. فضلاً عن
        اقتطاعه في المصطلحية الفلكية (occultation)، وعدم إضافته نُدرةً دلالية غير موجودة
        في اللمّتين المؤكَّدتين.
      evidence_assessment:
        case: mixed

    - lemma: "بَاطِنِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        اللفظ مُستنزَف للإحالة على الفرقة الدينية الباطنية في جميع المعاجم العربية الكلاسيكية
        والحديثة؛ استعماله في هذه المجموعة سيُحدث خلطاً فاضحاً مع الدلالة الفرقية الراسخة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "وَرَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على أي توثيق معجمي للفظ ورائية في قواعد البيانات. هي نحت اشتقاقي مقترَح
        بالقياس من «وراء + يّة» دون تثبيت في الاستعمال؛ وإن كانت تعادل بنيوياً كلمة
        ulteriority إلا أنها تفتقر إلى التثبيت المعجمي الضروري.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
