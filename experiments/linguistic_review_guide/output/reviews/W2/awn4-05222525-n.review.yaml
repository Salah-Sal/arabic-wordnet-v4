        في حين أن مفهوم ulteriority يخصّ ما يُبطَن وراء الظاهر من نيّات ودوافع — أي الجانب
        القصدي الإرادي في الخفاء. يُستحسن تعريف يجمع بين الصفة المجردة وطابعها الإرادي.
