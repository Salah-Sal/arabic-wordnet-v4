# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-01075919-n
# the act of hindering or obstructing or impeding
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (إعاقة، عرقلة) بدون تشكيل كامل"
      - "التعريف العربي يعيد ذكر اللمّتين ذاتهما (إعاقة، عرقلة) ممّا يُوقعه في الدوران"
    observations: >
      المجموعة تمثّل مفهوم الفعل المصدري للمنع والعرقلة بوصفه نشاطاً إنسانياً.
      هذا مفهوم عامّ غنيّ بالمرادفات في العربية، إذ تتوفّر مصادر عديدة
      من جذور مختلفة (عوق، صدد، منع، حول، ثبط) تغطّي ظلال دلالية متنوّعة.
      التعريف الحالي دائريّ لأنّه يستخدم اللمّتين نفسيهما في التعريف.
  blind_candidates:
    - lemma: "تَعْوِيق"
      generation_method: ishtiqaq
      justification: "مصدر عَوَّقَ على وزن تَفْعِيل من جذر ع-و-ق، يدلّ على فعل التأخير والحبس عن بلوغ الغاية، وهو من أخصّ الألفاظ دلالة على هذا المفهوم"
    - lemma: "صَدّ"
      generation_method: ishtiqaq
      justification: "مصدر صَدَّ يَصُدُّ من جذر ص-د-د، يدلّ على المنع والصرف عن الأمر، ورد في القرآن الكريم بهذا المعنى"
    - lemma: "حَيْلُولَة"
      generation_method: ishtiqaq
      justification: "مصدر حال يحول حيلولة من جذر ح-و-ل، يدلّ على التوسّط بين الشيء وغايته لمنعه، فيه معنى الاعتراض والمنع"
    - lemma: "تَثْبِيط"
      generation_method: ishtiqaq
      justification: "مصدر ثَبَّطَ على وزن تَفْعِيل من جذر ث-ب-ط، يدلّ على التعويق والتخذيل عن الأمر، ورد في القرآن: {ثَبَّطَهُمْ}"


stage2_evidence:
  per_lemma:
    - lemma: "إِعَاقَة"
      confirm:
        - text: "«(1) إعاقة؛ عرقلة (2) عائق.»"
          source: "المورد الحديث (2008) — مقابل hindrance"
        - text: "«(1) إعاقة (2) عائق (3) مانع شرعي [من الزواج].»"
          source: "المورد الحديث (2008) — مقابل impediment"
        - text: "«(1) «أ» سدّ؛ إعاقة؛ تعويق؛ عَرْقلة. «ب» انسداد؛ تعوُّق؛ تَعَرْقُل (2) إعاقة [أو تَعَوُّق] إقرار مشروع قانونٍ في البرلمان (3) عقبة؛ عائق.»"
          source: "المورد الحديث (2008) — مقابل obstruction"
      expands:
        - text: "«إعاقة تجسمية — أثر التوزيع الفراغي للجزيئات في إعاقة التفاعل»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "استعمال اصطلاحي في الكيمياء يؤكّد المعنى العامّ للإعاقة"

    - lemma: "عَرْقَلَة"
      confirm:
        - text: "«(1) إعاقة؛ عرقلة (2) عائق.»"
          source: "المورد الحديث (2008) — مقابل hindrance"
        - text: "«(1) «أ» سدّ؛ إعاقة؛ تعويق؛ عَرْقلة.»"
          source: "المورد الحديث (2008) — مقابل obstruction"

    - lemma: "تَعْوِيق"
      confirm:
        - text: "«(1) «أ» سدّ؛ إعاقة؛ تعويق؛ عَرْقلة.»"
          source: "المورد الحديث (2008) — مقابل obstruction"
        - text: "«عاقه فاعتاقَهُ وعوَّقَهُ في الكثرة والمبالغة يَعوقُهُ عَوْقاً»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
      expands:
        - text: "«عملية تتسع فيها الزاوية التي تضرب عندها الرياح النسبية أرياش العنفة لتخفيض قوة السحب المُستحثة»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "استعمال اصطلاحي تقني (stall) يختلف عن المعنى العامّ"

    - lemma: "صَدّ"
      confirm:
        - text: "«الصد: المنع بالإغراء الصارف عن الأمر، ذكره بعضهم. وقال الراغب: يكون انصرافا عن الشيء وامتناعا عنه... وقد يكون صرفا ومنعا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«صَدَّ عنه- صَدّاً, وصُدُوداً: أَعْرَضَ... فلاناً عن كذا- صَدّاً: منعه وصرفه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(الصد) الهجران والجانب ومسيل شعب يسيل فِيهِ المَاء»"
          source: "المعجم الوسيط"
          conflict: "الصَّدّ كاسم يدلّ على الهجران والجبل والجانب، لا على فعل المنع مصدرياً"
        - text: "«الصَّادُ وَالدَّالُ مُعْظَمُ بَابِهِ يَئُولُ إِلَى إِعْرَاضٍ وَعُدُولٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل في الباب الإعراض والعدول لا المنع المباشر، والمنع فرع ثانوي"

    - lemma: "حَيْلُولَة"
      confirm:
        - text: "«عَوْق؛ مَنْع؛ حُؤول؛ حَيلولة.»"
          source: "المورد الحديث (2008) — مقابل prevention"
      contradicts:
        - text: "«(1) مَنْع؛ إعاقة (2) وقاية.»"
          source: "المورد الحديث (2008) — مقابل prevention"
          conflict: "الحيلولة أقرب إلى الوقاية والمنع المسبق منها إلى العرقلة أثناء الفعل"

    - lemma: "تَثْبِيط"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "إِعَاقَة"
      decision: confirmed
      decision_reason: >
        مصدر قياسي من أعاقَ (إفعال) من جذر ع-و-ق، ثابت في المعاجم الحديثة والاستعمال المعاصر
        بمعنى فعل المنع والتعطيل. ترد في المورد الحديث مقابلاً لـ hindrance وimpediment وobstruction.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        إِعَاقَة تدلّ على فعل المنع الشامل الذي يحول دون إتمام العمل أو بلوغ الغاية،
        وهي أعمّ من عَرْقَلَة التي تختصّ بالتبطيء والتعثير دون المنع الكلّي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِعَاقَة"

    - lemma: "عَرْقَلَة"
      decision: confirmed
      decision_reason: >
        لفظ مستعمل ومسكوك في العربية المعاصرة بمعنى وضع العراقيل والعقبات.
        يرد في المورد الحديث مرادفاً لإعاقة في مقابل hindrance وobstruction.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        عَرْقَلَة تختصّ بإيجاد عوائق تُبطئ السير أو العمل وتسبّب التعثّر،
        ولا تقتضي المنع الكلّي كما تقتضيه إِعَاقَة، فهي أخفّ وطأة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرْقَلَة"

    - lemma: "تَعْوِيق"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصدر عَوَّقَ على وزن تَفْعِيل من جذر ع-و-ق، ثابت في كتاب العين للخليل
        ويرد في المورد الحديث مرادفاً لإعاقة وعرقلة مقابل obstruction.
        يضيف ظلّاً دلالياً مميّزاً يتعلّق بالتأخير والتبطيء.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَعْوِيق يدلّ على فعل التأخير والحبس عن بلوغ الغاية مع التركيز على البُطء
        والتكرار (من صيغة التفعيل)، بخلاف إِعَاقَة التي تفيد المنع الشامل.
      actions:
        - command: create_entry
          params: {lemma: "تَعْوِيق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "صَدّ"
      source: stage1
      decision: removed
      decision_reason: >
        صَدّ بوصفه اسماً يدلّ في المعاجم الكلاسيكية على الجبل والجانب والهجران،
        أمّا بمعنى المنع فهو مصدر فعلي (صَدَّهُ صَدّاً) يغلب عليه الاستعمال الفعلي.
        كثرة المعاني تجعله مشتركاً لفظياً غير ملائم لهذه المجموعة.

    - lemma: "حَيْلُولَة"
      source: stage1
      decision: removed
      decision_reason: >
        الحيلولة تدلّ على التوسّط والمنع المسبق (prevention) أكثر من العرقلة أثناء الفعل.
        المورد الحديث يضعها مقابل prevention لا hindrance، فالظلّ الدلالي مختلف.

    - lemma: "تَثْبِيط"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية كافية تربطه بمعنى الإعاقة المادية أو العملية.
        التثبيط أقرب إلى التخذيل النفسي وتفتير الهمّة منه إلى العرقلة الفعلية.


