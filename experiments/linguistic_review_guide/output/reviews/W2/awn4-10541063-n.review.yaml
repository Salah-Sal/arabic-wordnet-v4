        الأفعال دون الأقوال، (٣) الأسلوب ركيك مقارنةً بصياغة المعجم الوسيط.
        يُستحسن تحرير تعريف مصطلحي دقيق وتعريف لغوي يُجلّي الدلالة ويُوثِّق
        الاستعمال.
