# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-10541063-n  |  ili: i92530  |  POS: n
# Definition: شخص يكرر فعل الشيء  /  a person who repeats
# Reviewed: 2026-03-16
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف 'شخص يكرر فعل الشيء' مبهم: لم يُحدَّد نوع التكرار (قولاً أم فعلاً أم عادةً)، والضمير في 'الشيء' عائم لا يُعيِّن المفهوم"
      - "اللمّة الوحيدة مُكَرِّر أكثر شيوعاً في السياقات التقنية (أجهزة الاتصال والشبكات) منها في وصف الأشخاص في الاستعمال الحديث"
      - "المجموعة تكتفي بلمّة واحدة؛ يُستحسن استعراض صيغ مبالغة أو مرادفات للدلالة على التكرار المعتاد"
    observations: >
      المجموعة تمثّل مفهوماً إنسانياً عاماً: من يُكرِّر أمراً ما. الجذر ك-ر-ر من أصيل
      العربية وله امتداد معجمي واسع، وقد أكّده ابن فارس في المقاييس بأنه يدل على
      «جمع وترديد». اللمّة الحالية مُكَرِّر صحيحة اشتقاقياً (اسم فاعل Form II)،
      غير أن غلبة استعمالها في ميدان الهندسة والاتصالات في العربية المعاصرة
      تُضعف ملاءمتها للإنسان في السياق العام. صيغة المبالغة كَرَّار أقدم في التراث
      لكن دلالتها تخصّصت في الكرّ العسكري. جذر ع-و-د ومشتقاته منافس طبيعي
      لكن له حمولات دلالية مستقلة.

  # ── التوليد العمياء (من التعريف المقنّع فقط، قبل الاطلاع على اللمّات) ──
  blind_candidates:
    - lemma: "كَرَّار"
      generation_method: ishtiqaq
      justification: >
        صيغة مبالغة فَعَّال من جذر ك-ر-ر؛ تدل على كثير الكرّ والترديد. الوزن
        فَعَّال قياسي للدلالة على من يُكثر الفعل حتى يصير ديدنَه، وهو أوفى في
        التعبير عن الاعتياد من اسم الفاعل مُكَرِّر.
    - lemma: "مُعِيد"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من أَعَادَ يُعِيدُ (Form IV). يدل على من يُعيد الشيء ويُعاوده؛
        الإعادة مرادف قريب للتكرير، والفعل أعاد أوسع استعمالاً في العربية الفصحى
        من كرَّر.
    - lemma: "عَوَّاد"
      generation_method: majaz
      justification: >
        مبالغة فَعَّال من عَادَ يَعُودُ؛ يدل بالمجاز على من يعود إلى الأمر مراراً.
        العودة والتكرار مفهومان متلازمان، والإزاحة الدلالية من «العودة إلى» إلى
        «إعادة الفعل» إزاحةٌ وظيفية مألوفة في التوليد العربي.
    - lemma: "رَجَّاع"
      generation_method: ishtiqaq
      justification: >
        مبالغة فَعَّال من رَجَعَ يَرْجِعُ؛ يدل على من يعود إلى الشيء مراراً.
        جذر ر-ج-ع يحمل دلالة العودة والتكرار، وقد استُعمل في التراث لوصف من
        يرجع إلى الأمر مرةً بعد مرة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استُعلمت قاعدة البيانات بـ ٥ استعلامات:
#  ١. مطابقة دفعية: مكرر/المكرر، كرار/الكرار، معيد/المعيد، عواد/العواد، رجاع/الرجاع
#  ٢. جسر إنجليزي: translation_en:"repeater"
#  ٣. FTS عربي: "يكرر" OR "تكرار" OR "المكرر" OR "معيد" OR "كرار"
#  ٤. مقاييس اللغة (dictionary_id = 4,151): جذر كر / كرر
stage2_evidence:
  per_lemma:

    - lemma: "مُكَرِّر"
      confirm:
        - text: "«المكرِّر؛ المعيد؛ مثل: «أ» الراوي؛ القاصّ؛ المسمِّع عن ظهر قلب. «ب» الساعة الدقّاقة. «ج» السّلاح التكراري: سلاحٌ ناريّ كمسدَّسٍ أو بندقية يمكن إطلاق النار منه عدة مرات. «د» المتعوِّد انتهاك حرمة القانون. «ه» مكرِّر التصويت. «و» الطالب المعيد: طالبٌ «يعيد صفًّا» [أو مادّةً].»"
          source: "المورد الحديث (2008)"
        - text: "«مُعِيد؛ مكرِّر — iterant echoes.»"
          source: "المورد الحديث (2008) — مادة iterant"
      expands:
        - text: "«تجهيزةٌ تُستخدَمُ في دارات الاتصالات، تُقلِّص التشوهات بتضخيم أو بإعادةِ توليدِ إشارةٍ يمكِن إرسالُها بشِدتها وشكلها الأصليين. وفي الشبكات: يَربِطُ المكرِّرُ شبكتَين أو مقتطَعين من شبكة واحدة على الطبقة الفيزيائية.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُثبت أن مُكَرِّر مصطلح تقني راسخ للأجهزة؛ استعماله للشخص أقل حضوراً في المعاجم التقنية المتخصصة"
        - text: "«نظام يستقبل، ويخزن، ويعيد بث الإشارات الراديوية، وعادة على تردد آخر غير التردد المستقبَل.»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
          addition: "يُكرِّس الاستعمال التقني للمُكَرِّر في مجال الإلكترونيات بمعنى الجهاز"

    - lemma: "كَرَّار"
      contradicts:
        - text: "«كَرَّار: الكثير الكر على العدو.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "دلالة كَرَّار تخصّصت في الكرّ العسكري (الهجوم المتكرر على العدو)، لا في التكرار العام لأي فعل"

    - lemma: "مُعِيد"
      confirm:
        - text: "«معيد — redoubling»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«الطالب المعيد: طالبٌ «يعيد صفًّا» [أو مادّةً].»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«المعيد: الحاذق المجرِّب للأمور العالم بها / من يتولى إعادة شرح ما غمض من شرح الأستاذ لتلاميذه / من يتولى منصباً تعليمياً فى الجامعة قبل أن يحصل على منصب المدرس.»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأول (الحاذق المجرِّب) بعيد عن التكرار؛ والمعنى الثاني والثالث يُخصِّصانه في الوظيفة الجامعية"
        - text: "«مُعيد — regenerator»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "الاستعمال التقني المستقل يُرجِّح الجهاز لا الشخص، وبمعنى التوليد لا التكرار"

    - lemma: "عَوَّاد"
      contradicts:
        - text: "«العوَّاد: صانع العيدان الضارب عليها.»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأول والأشيع لعَوَّاد هو عازف العود أو صانعه؛ والاستعمال الأكثر انتشاراً يُبعده عن دلالة التكرار"
        - text: "«عَوَّاد: صانع العيدان والضارب عليها.»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          conflict: "يُؤكد طغيان الدلالة الموسيقية على الدلالة التكرارية"
      expands:
        - text: "«عُوَّاد: كل من أتى الأمر مرة بعد أخرى.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "هذه الدلالة الدقيقة وردت في صيغة عُوَّاد (جمع عائد) لا في عَوَّاد — وهما صيغتان مختلفتان"

    - lemma: "رَجَّاع"
      contradicts:
        - text: "«الرَّجَّاعُ: الكَثِيرُ الرُّجُوع إلى الله تعالى.»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "دلالة رَجَّاع تخصّصت في التوبة والإنابة الدينية، لا في التكرار العام لأي فعل"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُكَرِّر"
      decision: confirmed
      decision_reason: >
        اسم فاعل قياسي من كَرَّرَ (Form II)، مدعوم صراحةً من المورد الحديث بوصفه
        مقابلاً لـ repeater في سياقات إنسانية متعددة (الراوي، المتعوِّد انتهاك القانون،
        الطالب المعيد). الاشتقاق سليم، والتشكيل كامل في synset_info، ولا ضرورة
        لتصحيح. الاستعمال التقني يوسِّع الدلالة ولا يلغيها.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُعبِّر عن الفاعلية المباشرة للتكرار (اسم فاعل)
        دون دلالة على الاعتياد الشديد الذي تحمله صيغ المبالغة؛ محايدة من حيث القدح
        والمدح وتصلح للسياقين الإيجابي (الراوي المُكَرِّر) والسلبي (مُكَرِّر الجرائم).

    - lemma: "كَرَّار"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت تخصّص كَرَّار في الكرّ العسكري (الهجوم المتكرر على العدو)،
        لا في التكرار العام. اختبار الاستبدال يفشل: «كَرَّار في القول» غير مألوف.
        اختبار السكّ: إبدال «الكرّ» بـ«التكرار» لا يُنتج وحدةً معجمية مثبَّتة بهذا المعنى.

    - lemma: "مُعِيد"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود مُعِيد ترجمةً لـ repeater في سياق تعليمي محدود، فإن المعنيَين
        الراسخَين في المعاجم الكبرى (الحاذق المجرِّب، والمعيد الجامعي) يُنشئان
        تعارضاً دلالياً خطيراً لو أُدرج في هذه المجموعة. مبدأ عدم الترادف المطلق
        يوجب رفضه لأن دلالته الفارقة لا تُضيف للمجموعة بل تُلبِّس عليها.

    - lemma: "عَوَّاد"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى الأول والمهيمن لعَوَّاد هو عازف العود أو صانعه؛ فحص الاشتراك اللفظي
        يُوجب الرفض. الدلالة التكرارية التي ظهرت في الأدلة هي لصيغة عُوَّاد (جمع
        عائد) لا لعَوَّاد — وهما صيغتان مختلفتان بنيةً ومعنىً. إدراجه يُحدث لبساً
        مع عازف العود.

    - lemma: "رَجَّاع"
      source: stage1
      decision: removed
      decision_reason: >
        انحصرت دلالة رَجَّاع في المعاجم الكلاسيكية والحديثة في «كثير الرجوع إلى الله
        تعالى»، وهي دلالة دينية متخصصة. توظيفه خارج هذا السياق مخالف للاستعمال
        الفصيح الموثَّق، وفحص الملاءمة الثقافية يُشير إلى خطر الإيهام ديني.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
