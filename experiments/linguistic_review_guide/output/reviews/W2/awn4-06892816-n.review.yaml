# مراجعة المجموعة الترادفية — awn4-06892816-n
# eye contact | التواصل البصري
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'تواصل بصري' تحمل دلالةً أوسع من المفهوم المقصود؛ إذ 'التواصل البصري' (visual communication) يشمل أيّ تواصل يعتمد الرؤية كلغة الإشارة والإيماء، في حين أنّ المجموعة تُحدّد 'eye contact' وهو التقاء العيون تحديداً"
      - "التعريف الحالي 'يعبر عن' يستخدم صيغة فعلية مضارعة غير ملائمة لأسلوب التعريف المعجمي الاسمي"
      - "المجموعة خالية من اللمّات التراثية أو الاشتقاقية الفصيحة التي تصف هذه الظاهرة"
    observations: >
      المجموعة ترادفية تصف ظاهرة التقاء العيون بوصفها وسيلةَ تواصلٍ غير لفظي. المفهوم
      مألوف في الثقافة العربية وله تعبيرات شعرية ونثرية كثيرة، لكنّه يفتقر إلى مصطلح
      واحد مسكوك يُعادل eye contact بدقة. اللمّة الموجودة مركّبة وصفية على نمط المصطلحات
      الحديثة، وإن صحّت تقريباً فهي أعمّ مما تستدعيه المجموعة.

  blind_candidates:
    - lemma: "تَلَاقِي الْعُيُونِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي: مصدر 'تلاقى' (تفاعُل من لقي، يدلّ على وقوع الفعل بين طرفين)
        مضافاً إلى 'العيون'. يُعبّر مباشرةً عن الالتقاء المتبادل بين عيني شخصين،
        وهو تعبير فصيح شائع في الأدب العربي والخطاب الاجتماعي.

    - lemma: "مُبَاصَرَةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر باصَرَ على وزن مُفَاعَلَة من جذر 'بصر'؛ وزن المفاعلة يدلّ على الفعل
        المتبادل بين طرفين. القاموس المحيط يثبت: 'باصَرا: نَظَرا أيُّهُما يُبْصِرُ
        قَبْلُ'. يُعبّر عن التبادل البصري المقصود بين شخصين.

    - lemma: "اتِّصَالٌ بَصَرِيٌّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي: 'اتصال' (الوصل بين طرفين) موصوفاً بـ'بصري' (نسبة إلى البصر).
        أدقّ من 'تواصل بصري' لأن 'الاتصال' يدلّ على الربط الآني المباشر بين شخصين،
        وهو ما يميّز eye contact عن أشكال التواصل البصري الأخرى.

    - lemma: "تَقَاطُعُ الْأَبْصَارِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي: 'تقاطع' (مصدر تقاطع، يدلّ على التقاء خطّين) مضافاً إلى
        'الأبصار'. استعارة هندسية دقيقة تصف لحظة تقاطع خطَّي النظر بين شخصين،
        مما يجعلها وصفاً مجازياً فصيحاً ودقيقاً.


stage2_evidence:
  per_lemma:
    - lemma: "تواصل بصري"
      evidence_status: "no_material_found"
      # المصطلح المركب كاملاً غير موجود في القاعدة. 'تواصل' وُجد كمقابل لـ
      # 'communication' في معاجم عديدة لكنّه لا يُترجم eye contact تحديداً.

    - lemma: "تَلَاقِي الْعُيُونِ"
      evidence_status: "no_material_found"

    - lemma: "مُبَاصَرَةٌ"
      expands:
        - text: "«باصَرا: نَظَرا أيُّهُما يُبْصِرُ قَبْلُ. وتَباصَروا: أبْصَرَ بعضُهُمْ بعضاً»"
          source: "القاموس المحيط (Hawramani)"
          addition: >
            يُثبت الفعل 'بَاصَرَ' في التراث العربي بمعنى التبادل البصري بين طرفين،
            كما يُثبت 'تباصَروا' بمعنى أبصر بعضهم بعضاً — وهو قريب جداً من مفهوم
            التواصل البصري المتبادل. غير أنّ 'باصَرَ' في الاستخدام التراثي يعني
            التنافس في الإبصار لا التواصل الدلالي به.

    - lemma: "اتِّصَالٌ بَصَرِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "تَقَاطُعُ الْأَبْصَارِ"
      evidence_status: "no_material_found"

