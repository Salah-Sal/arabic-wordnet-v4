      confirm:
        - text: "«استعمال العين قصد تبليغ خطاب أو المساعدة على فهمه»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm) — entry_id: 487922"
      expands:
        - text: "translation_en: eye contact — domain: Information and Communication"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          addition: >
            المصطلح مُقيَّد بحقل الإعلام والتواصل ومُترجَم تحديداً لـ eye contact،
            مما يُثبت ثبوته المعجمي في المصطلحية العربية الرسمية.

    - lemma: "دوام النظر"
      expands:
        - text: "«إلى كاميرة التلفزة» — translation_en: eye contact"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm) — entry_id: 484231"
          addition: >
            يُثبت المصطلح في سياق إعلامي مُضيَّق (التلفزيون)، وهو حالة خاصة من
            eye contact وليس المفهوم بعمومه.


stage3_analysis:
  per_lemma:
    - lemma: "تواصل بصري"
      decision: confirmed
      decision_reason: >
        المصطلح مستخدَم في الكتابة العربية المعاصرة للإشارة إلى eye contact وإن كان
        أوسع دلالياً. لا يوجد نصّ معجمي يُفيده بهذا التحديد، لكنّه المصطلح الأكثر
        تداولاً في الخطاب الأكاديمي والإعلامي العربي لهذا المفهوم. يُؤخذ عليه عمومُ
        الدلالة؛ لذا تُضاف لمّة أدقّ إلى جانبه. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُستخدم في السياق الأكاديمي والإعلامي العام، ويشمل بإطلاقه أيّ تواصل
        يعتمد الرؤية؛ وتضييقه إلى eye contact يتمّ بالسياق. أشيع اللمّتين تداولاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَاصُلٌ بَصَرِيٌّ"

    - lemma: "تواصل بالعين"
      source: db_bridge
      decision: confirmed
      decision_reason: >
        مصطلح موثَّق في مسرد الإعلام والتواصل (ArabTerm) بالتحديد مقابلاً لـ eye contact،
        مع تعريف يدلّ صراحةً على استعمال العين في التواصل. هو أدقّ المصطلحين وأوفاهما
        بالمفهوم المقصود، لذا يُضاف إلى المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُحدّد أداةَ التواصل صراحةً (العين)، مما يُميّزه عن 'تواصل بصري' الأعمّ.
        يُفضَّل في السياق التقني والإعلامي حيث الدقة مطلوبة.
      actions:
        - command: add_sense
          params:
            entry_id: "487922"
            synset_id: "{synset_id}"

    - lemma: "تَلَاقِي الْعُيُونِ"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير فصيح وجميل لكنّه لم يُسجَّل كمصطلح معجمي مستقل في أيّ من مصادر
        القاعدة. يفشل اختبار السكّ: يمكن إبدال 'العيون' بـ'الأبصار' أو 'النظرات'
        دون أن يفقد قيمته الوصفية، مما يعني أنّه تعبير وصفي حرّ لا مصطلح ثابت.

    - lemma: "مُبَاصَرَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الفعل 'بَاصَرَ' موجود في التراث بمعنى التنافس في الإبصار (نظرا أيّهما يُبصر
        قبل)، لا التواصل الدلالي بالعين. لا يُفيد المصدر 'مُبَاصَرَة' المعنى المقصود
        (eye contact بدلالته الاجتماعية) بدون إزاحة دلالية مقصودة غير موثّقة.
        عدم وجود أدلة من المعاجم على هذا الاستخدام يمنع قبوله.

    - lemma: "اتِّصَالٌ بَصَرِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        'تماس بصري' وُجد في مسرد النقل (ArabTerm) مقابلاً لـ visual contact، لكنّ
        'اتصال بصري' لم يُسجَّل. فضلاً عن ذلك، 'visual contact' في النقل يعني
        رؤية العوائق والإشارات، لا التواصل الاجتماعي. المصطلح مرفوض لغياب الأدلة
        ولتداخله مع visual contact لا eye contact.

    - lemma: "تَقَاطُعُ الْأَبْصَارِ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي بليغ لكنّه لا يرد كمصطلح مسكوك في أيّ مرجع من قاعدة البيانات.
        يفشل اختبار التثبيت المعجمي. 'تقاطع' في المصطلحية العربية مرتبط بمجالات
        هندسية وعلمية (تقاطع الجزيئات، تقاطع السطوح) بعيداً عن التواصل الاجتماعي.


