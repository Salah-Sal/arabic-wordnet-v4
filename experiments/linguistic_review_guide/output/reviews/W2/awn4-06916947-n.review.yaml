stage1_review:
  assessment:
    concerns:
      - "لمّة «لسان» مشتركة لفظيًّا: العضو الجسدي / اللغة / الرسالة / الحجة؛ يجب توثيق المعنى المقصود"
      - "لمّة «لغة طبيعية» مركّب وصفي حديث قد لا يُفهَم خارج السياق اللساني والحاسوبي"
      - "اللمّة «لسان» بلا تشكيل في المدخل الأصلي — يحتاج تشكيلاً كاملاً"
    observations: >
      المجموعة تدلّ على مفهوم اللغة البشرية الطبيعية بوصفها نظامَ تواصلٍ نشأ تلقائيًّا في مجتمعٍ بشريّ،
      في مقابل اللغات الاصطناعية كلغات البرمجة. المفهوم راسخ في التراث العربي بلفظ «لسان»
      (﴿وَمَا أَرْسَلْنَا مِنْ رَسُولٍ إِلَّا بِلِسَانِ قَوْمِهِ﴾)، وفي الاستعمال الحديث بمصطلح «لغة طبيعية».
      اللمّتان متكاملتان: الأولى تراثية عامّة والثانية اصطلاحية حديثة.
  blind_candidates:
    - lemma: "لِسَان"
      generation_method: majaz
      justification: >
        مجاز مرسل علاقته الآلية: اللسان في الأصل عضو النطق، ثم أُطلق على اللغة التي يُنطَق بها.
        مستعمل في القرآن والشعر والنثر بهذا المعنى، وهو من أقدم الألفاظ العربية الدالة على اللغة.
    - lemma: "لُغَة طَبِيعِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي ثابت في الاصطلاح اللساني والحاسوبي الحديث، يقابل «لغة اصطناعية».
        مسجّل في المعجم الموحد لمصطلحات اللسانيات ومعجم مصطلحات المعلوماتية.
    - lemma: "لُغَة بَشَرِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي يصف اللغة بنسبتها إلى البشر تمييزاً لها من لغة الآلة.
        مستعمل في بعض السياقات لكنه وصف حرّ وليس مصطلحاً مسكوكاً.
    - lemma: "لِسَان بَشَرِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي يجمع بين اللفظ التراثي «لسان» والصفة «بشري» لتقييد الدلالة.
        غير مسجّل في المعاجم وليس وحدة معجمية ثابتة.


stage2_evidence:
