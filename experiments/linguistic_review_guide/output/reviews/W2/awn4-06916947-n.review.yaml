      confirm:
        - text: "«اللُّغَة»"
          source: "المعجم الوسيط"
        - text: "«اللِّسانُ: المِقْوَلُ، ويُؤَنَّثُ... واللُّغَةُ، والرِّسالَةُ، والمُتَكَلِّمُ عن القَوْمِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«اللسان: يذكر، ولا يجوز تأنيثه إذا أردت به العضو. فإن أردت به اللغة أو الرسالة أو القصيدة أنثت فقلت: هذه لسان العرب أي لغتهم»"
          source: "المذكر والمؤنث لابن التستري الكاتب"
        - text: "«واللِّسْنُ، بالكسر: الكلامُ، واللُّغَةُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(3) لُغة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«جسمٌ لحمى مستطيل متحرك, يكون فى الفم, ويصلح للتذوق والبلع, وللنطق»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي لـ«لسان» هو العضو الجسدي، واللغة معنًى مجازي ثانٍ"
        - text: "«اللِّسَانُ: الجارحة وقوتها، ومنه ﴿وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي﴾ يعني به من قوة لسانه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يوسّع الدلالة إلى قوة النطق لا العضو وحده"

    - lemma: "لُغَة طَبِيعِيَّة"
      confirm:
        - text: "«صفة اللغات الخاصة بالكائن البشري وهي أداة للتواصل والتعبير وترتكز على الخصائص الكلية الكامنة فيها. ضد: لغة اصطناعية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«لغةٌ يَنطقها (أو يكتبها) الإنسان، خلافاً للغة البرمجة أو لغة الآلة. يُعدّ فهْمُ اللغة الطبيعية وتقريبها إلى بيئة الحاسوب، أحدَ أهداف البحث في الذكاء الصنعي.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«لغة بشرية يمكن التعبير عنها بنص أو كلام أو إشارة.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"

    - lemma: "لُغَة بَشَرِيَّة"
      evidence_status: "no_material_found"

    - lemma: "لِسَان بَشَرِيّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "لِسَان"
      decision: confirmed
      decision_reason: >
        لفظ «لسان» بمعنى «اللغة» ثابت في المعاجم العربية الكلاسيكية والحديثة على السواء،
        وشواهده القرآنية والشعرية غزيرة (﴿فَإِنَّمَا يَسَّرْنَاهُ بِلِسَانِكَ﴾، ﴿بِلِسَانٍ عَرَبِيٍّ مُبِينٍ﴾).
        وهو لفظ فصيح متداول، يقابل الإنجليزية tongue بمعنى language.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        لفظ تراثي عام يدلّ على لغة قوم بعينهم (لسان العرب، لسان الفرس)، مشترك لفظي
        يحتاج سياقاً لتمييزه من معنى العضو. أعمّ من «لغة طبيعية» إذ لا يحمل التقابل
        مع اللغة الاصطناعية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لِسَان"

    - lemma: "لُغَة طَبِيعِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك ثابت في ثلاثة معاجم اصطلاحية حديثة على الأقل (اللسانيات، المعلوماتية،
        الذكاء الاصطناعي)، وتعريفاته تتطابق مع دلالة المجموعة. مقابله الإنجليزي natural language.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مصطلح حديث تقني يميّز اللغة البشرية من اللغة الاصطناعية (لغة البرمجة، لغة الآلة)
        تمييزاً صريحاً. يُستعمل في سياقات اللسانيات الحاسوبية والذكاء الاصطناعي ومعالجة اللغات.

    - lemma: "لُغَة بَشَرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        وصف حرّ وليس مصطلحاً مسكوكاً؛ لم يُعثَر له على مدخل معجمي مستقل.
        يخفق في اختبار السكّ: يمكن إبدال «بشرية» بـ«إنسانية» أو «آدمية» ويبقى صالحاً كوصف.

    - lemma: "لِسَان بَشَرِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب وصفي غير مسجّل في أي معجم، ولا يُستعمل كوحدة معجمية ثابتة.
        لا حاجة إليه مع وجود «لسان» و«لغة طبيعية».


