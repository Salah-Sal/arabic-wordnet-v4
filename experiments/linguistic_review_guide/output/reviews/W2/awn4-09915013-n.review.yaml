stage4_content:
  definition:
    current: "شخص مسؤول عن تلبية احتياجات طفل أو شخص بالغ معال"
    assessment:
      decision: revise
      reason: "التعريف الحالي سليم ولكنه يميل للأسلوب الوصفي؛ يفضل صياغته بأسلوب معجمي يجمع بين الرعاية الجسدية والتدبير المعيشي."
    authored:
      - type: terminological
        text: "شخصٌ يتولَّى القيامَ بشؤون طفلٍ أو عاجزٍ أو مريضٍ وتلبيةَ احتياجاته الماديَّة والمعنويَّة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09915013-n", definition_index: 0, text: "شخصٌ يتولَّى القيامَ بشؤون طفلٍ أو عاجزٍ أو مريضٍ وتلبيةَ احتياجاته الماديَّة والمعنويَّة."}
  examples:
    per_lemma:
      - lemma: "مُقَدِّم رِعَايَة"
        examples:
          - text: "يجب تدريب مقدم الرعاية على كيفية التعامل مع حالات الطوارئ المنزلية."
            type: usage
      - lemma: "قَيِّم"
        examples:
          - text: "عَيَّن القاضي قيّماً على شؤون العجوز الذي فقد أهليته."
            type: usage
      - lemma: "كَافِل"
        examples:
          - text: "أثنى الرسول صلى الله عليه وسلم على كافل اليتيم وجعله رفيقه في الجنة."
            type: hadith
            source: "صحيح البخاري"
      - lemma: "حَاضِن"
        examples:
          - text: "تعمل الحاضنة على توفير بيئة آمنة ونفسية مستقرة للطفل."
            type: usage
      - lemma: "رَاعٍ"
        examples:
          - text: "الأب راعٍ في بيته ومسؤول عن رعيته."
            type: hadith
            source: "متفق عليه"
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-09915013-n", text: "يقع على عاتق مقدم الرعاية مسؤولية كبيرة في تحسين جودة حياة المريض."}

