stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "مُقَدِّم رِعَايَة" هي تعبير مركب (MWE) وهو ترجمة حرفية دقيقة للمصطلح الإنجليزي، لكنه يفتقر إلى لمّات مفردة (Single-word lemmas) تعبّر عن المفهوم في السياق العربي التراثي والقانوني.
    observations: "المفهوم يغطي جانبين: رعاية الأطفال (حضانة) ورعاية البالغين المعالين (قوامة/كفالة). المصطلح الحالي 'مقدم رعاية' شائع جداً في السياقات الطبية والاجتماعية الحديثة."
  blind_candidates:
    - lemma: "قَيِّم"
      generation_method: ishtiqaq
      justification: "من القوامة؛ وهو الذي يقوم بشأن الشخص ويسوس أمره، وورد في المعاجم بمعنى 'قيم القوم: الذي يقوم بشأنهم'."
    - lemma: "كَافِل"
      generation_method: ishtiqaq
      justification: "من الكفالة؛ وهو الذي يلتزم برعاية إنسان وإعالته، وشائع في التراث العربي (كافل اليتيم)."
    - lemma: "حَاضِن"
      generation_method: ishtiqaq
      justification: "من الحضانة؛ ويُطلق على من يحفظ الصبي ويربيه، ويمكن توسيعه دلالياً ليشمل رعاية العاجزين."
    - lemma: "رَاعٍ"
      generation_method: ishtiqaq
      justification: "بمعنى الحافظ والمسؤول؛ لقوله صلى الله عليه وسلم: 'كلكم راع وكلكم مسؤول عن رعيته'."

stage2_evidence:
  per_lemma:
    - lemma: "مُقَدِّم رِعَايَة"
      confirm:
        - text: "«مُقَدِّمُ الرِّعايَة: caregiver»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مقدم رعاية في منظومة المساعدة المعيشية النشطة: AAL caregiver»"
          source: "موسوعة الكهرباء (IEC 60050)"
    - lemma: "قَيِّم"
      confirm:
        - text: "«قَيِّم القوم: الذى يقوم بشأنهم ويسوس أمرهم»"
          source: "المعجم الوسيط"
        - text: "«من يتولَّى أمر المحجور عليه»"
          source: "المعجم الوسيط"
        - text: "«حتى يكون لخمسين امرأة قيم واحد: زوجها، لأنه يقوم بأمرها وما تحتاج إليه»"
          source: "النهاية في غريب الحديث والأثر"
    - lemma: "كَافِل"
      confirm:
        - text: "«الْكَافِلُ: الَّذِي يَكْفُلُ إِنْسَانًا يَعُولُهُ. قَالَ اللَّهُ جَلَّ جَلَالُهُ: {وَكَفَّلَهَا زَكَرِيَّا}»"
          source: "مقاييس اللغة"
        - text: "«الكَفِيلُ: المثيل الكافلُ الضامِنُ»"
          source: "المعجم الوسيط"
    - lemma: "حَاضِن"
      confirm:
        - text: "«المُوَكَّلُ بالصبىِّ يَحْفَظُه ويُرَبِّيه»"
          source: "المعجم الكبير"
        - text: "«الحاضنة: هي التي تقوم على الصبي في تربيته»"
          source: "التعريفات الفقهيّة للبركتي"
    - lemma: "رَاعٍ"
      confirm:
        - text: "«كل من ولي أمراً بالحفظ والسياسة»"
          source: "المعجم الوسيط"
        - text: "«مَنْ يَحْفَظُ الماشِيَةَ ونَحْوَها ويَرْعاها... كُلُّ مَنْ وَلِيَ أَمْرَ قومٍ بالحِفْظِ أو السِّياسةِ»"
          source: "المعجم الكبير"

