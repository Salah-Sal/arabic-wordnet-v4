# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «جزء فرعي» تفتقر إلى التشكيل الكامل"
      - "التعريف «جزء من جزء» دائريٌّ: يستخدم مفردة «جزء» لتعريف مصطلح مشتق منها أصلاً"
      - "فقر التغطية المعجمية: لمّة واحدة فقط لمفهوم يحتمل مرادفات متعددة"
    observations: >
      المجموعة تُعبِّر عن مفهوم «الجزء الفرعي» (subpart)، أي جزءٌ يندرج داخل جزءٍ
      آخر أكبر منه في هيكلية التركيب. اللمّة الحالية «جزء فرعي» مركَّبٌ وصفيٌّ
      (اسم + نعت)، بنيتُه الصرفية سليمة وشائعة في الكتابة العلمية والتقنية المعاصرة،
      غير أنه لم يُسجَّل كمدخل معجمي مستقل في المعاجم الكلاسيكية ولا في معظم
      المعاجم الحديثة. يرتكز المفهوم على علاقة اشتمال مضاعفة: الجزءُ الفرعيُّ
      جزءٌ من جزء، والجزءُ نفسُه جزءٌ من كلٍّ أكبر.

  blind_candidates:
    - lemma: "شُعَيْبَةٌ"
      generation_method: majaz
      justification: >
        تصغير «شُعبة» (من جذر شعب)؛ الشُّعبة تعني الفرع والتفريعة، فاستعارة
        الصيغة المصغَّرة تُفيد فرعاً صغيراً داخل فرع أكبر، وهو مناسب دلالياً
        لمفهوم الجزء المندرج في جزء. قبل الاطلاع على الأدلة، يبدو مسكوكاً ومنتجاً.

    - lemma: "قِسْمٌ فَرْعِيٌّ"
      generation_method: tarkib
      justification: >
        مركَّب وصفي (wasfi) من «قِسم» (نصيب / حصة) + «فرعي» (منسوب إلى الفرع)؛
        يُفيد الجزءَ الذي هو قسم تابع لقسم أكبر. البنية موازية لكنها تُفادي
        مفردة «جزء» التي وردت في التعريف ذاته فتتجنب الدوران.

    - lemma: "فَلْذَةٌ"
      generation_method: majaz
      justification: >
        أصل الفِلذة: القطعة المقطوعة من الكبد أو اللحم؛ بالإزاحة المجازية تُستعار
        للجزء المقتطَع من شيء أكبر، ما يجعلها مرشحةً للدلالة على «ما انفصل
        وكان جزءاً من جزء». الإحياء المعجمي لهذا اللفظ القديم يُبعده عن
        الاشتراك اللفظي الحديث.

    - lemma: "قُسَيْمٌ"
      generation_method: ishtiqaq
      justification: >
        تصغير «قِسم» على وزن فُعَيْل من جذر قسم؛ التصغير يُفيد الصِّغَر
        والتبعية، أي أنه نصيبٌ صغير ضمن تقسيم أكبر. الوزن فُعَيْل منتجٌ في
        العربية للدلالة على الصنفية الفرعية.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات نُفِّذت: ٦ استعلامات
#   ١. batch headword: جزء فرعي + الجزء الفرعي + شعيبة + قسم فرعي + فلذة + جزيء + جزء + فرع
#   ٢. English bridge: "subpart" OR "sub-part" OR "subdivision" OR "component part"
#   ٣. batch headword (round 2): شعيبة + الشعيبة + فلذة + فرع + فرعي + جزء فرعي + قسيم
#   ٤. FTS Arabic keywords: "جزء فرعي" OR "جزء من جزء" OR "قطعة فرعية"
#   ٥. مقاييس + تفاصيل (entry_ids 720773, 512566, 985656, 988072 via dict_id=151)
#   ٦. مقاييس قسم (dict_id=151, headword_norm='قسم')
stage2_evidence:
  per_lemma:

    - lemma: "جُزْءٌ فَرْعِيٌّ"
      confirm:
        - text: "«القطعةُ من الشيء، وما يتركب الشيء منه ومن غيره»"
          source: "المعجم الوسيط"
        - text: "«الجُزْءُ: البَعْضُ... القِطعةُ من الشيء»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الْجُزْء: مَا يتركب عَنهُ وَعَن غَيره شَيْء هُوَ الْكل»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«الفَرْعُ: مَا لَا يَسْتَقِلُّ بِنَفْسِهِ، وقيل: المُخْتَلَفُ في تعليله»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: >
            تدعم دلالة «فرعي» بوصفها ما لا يستقل بذاته، وهو جوهر مفهوم
            «الجزء الفرعي» الذي يكتسب وجوده من الجزء الأعلى منه.
        - text: "«الْفَاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عُلُوٍّ
            وَارْتِفَاعٍ وَسُمُوٍّ وَسُبُوغٍ. مِنْ ذَلِكَ الْفَرْعُ، وَهُوَ أَعْلَى
            الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر فرع يدل أصلاً على العلو والارتفاع ثم استُعير للمتفرع
            من الأصل، مما يُثري الدلالة الاصطلاحية لـ«فرعي» بمعنى المنشعب
            من كلٍّ أكبر.

    - lemma: "شُعَيْبَةٌ"
      contradicts:
        - text: "«الشُّعَيْبَة (في الطب): مَسْلَكٌ هَوَائِيٌّ مِجْهَرِيٌّ يَتَفَرَّعُ
            مِنَ الشُّعْبَةِ في داخِلِ الرِّئَةِ»"
          source: "المعجم الكبير"
          conflict: >
            اللفظ مُحتلٌّ بالكامل بالمصطلح الطبي «bronchiole»، وهو مسجَّل
            في المعجم الوسيط والمعجم الكبير بهذه الدلالة التخصصية. استعماله
            بمعنى «جزء فرعي» سيُنشئ اشتراكاً لفظياً حاداً.
        - text: "«الشُّعَيْبَة (فِي الطِّبّ): مَسْلَك هوائي مجهري يتَفَرَّع من الشعبة
            فِي دَاخل الرئة»"
          source: "المعجم الوسيط"
          conflict: >
            تأكيد إضافي على احتلال اللفظ في مصدرين معجميين موثوقَيْن.

    - lemma: "قِسْمٌ فَرْعِيٌّ"
      expands:
        - text: "«تقسيم فرعي» — ترجمة عربية لـ subdivision"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (ALECSO 2000)"
          addition: >
            «تقسيم فرعي» مُسجَّل بمعنى «subdivision» في معاجم ألكسو المتخصصة،
            لكنه يدل على عملية التقسيم لا على الكيان الناتج عنه، فهو فعلٌ لا
            اسمٌ لمُحصَّله.
        - text: "«تقسيم فرعي، تقسيم جزئي» — subdivision"
          source: "المعجم الموحد لمصطلحات علوم البحار (ALECSO 2000)"
          addition: >
            يؤكد أن المركَّب «فرعي» مقرون بـ«تقسيم» (المصدر) لا بـ«قسم»
            (الاسم الذاتي)، مما يُضعف «قسم فرعي» كاسم للكيان.

    - lemma: "فَلْذَةٌ"
      contradicts:
        - text: "«الفِلْذَةُ: القِطعةُ من الكَبِدِ واللَّحْمِ والمالِ والذَّهَبِ
            والفِضَّة، والجمع أفلاذٌ»"
          source: "لسان العرب لابن منظور"
          conflict: >
            الفلذة تحمل دلالة خاصة بقطعة شيءٍ ذي قيمة مادية أو حيوية
            (كبد، ذهب)؛ هذا التخصص السيميائي يجعلها غير ملائمة للدلالة
            على جزء مجرد ضمن كلٍّ هرمي.
        - text: "«وفي الحديث: تقيء الأرض أفلاذَ كبدها أي كنوزها وأموالها»"
          source: "لسان العرب لابن منظور"
          conflict: >
            الاستعمال المعجمي راسخ في دلالة القطعة الثمينة المستخرَجة،
            لا في دلالة الجزء البنيوي الهرمي.

    - lemma: "قُسَيْمٌ"
      confirm:
        - text: "«القُسَيْم: قسمٌ من جزءٍ أكبر»"
          source: "المورد الحديث (2008) — مدخل ترجمة: subdivision"
        - text: "«الْقَافُ وَالسِّينُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ
            أَحَدُهُمَا عَلَى جَمَالٍ وَحُسْنٍ وَالْآخَرُ عَلَى تَجْزِئَةِ شَيْءٍ.
            وَالنَّصِيبُ قِسْمٌ بِكَسْرِ الْقَافِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«جزء من مكون» — ترجمة: component part"
          source: "موسوعة الكهرباء IEC 60050 (Electropedia)"
          addition: >
            يُثبت أن فكرة «الجزء ضمن مكوِّن» لها مقابل عربي مستعمَل في
            المعاجم التقنية، مما يُعزز الحاجة إلى مصطلح مختصَر وموحَّد.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "جُزْءٌ فَرْعِيٌّ"
      decision: confirmed
      decision_reason: >
        المركَّب الوصفي سليمٌ بنيوياً، ويُعبِّر بدقة عن «جزء تابع لجزء أكبر».
        جذره جزأ + فرع كلاهما أصيل. اللمّة شائعة في الكتابة التقنية والأكاديمية
        العربية المعاصرة. يحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز البعدَ الهرميَّ الثنائي: «جزء» يدل على الانتماء إلى كلٍّ أكبر،
        و«فرعي» يدل على التبعية والانشعاب؛ فهو المصطلح الأنسب في السياقات
        التقنية والأكاديمية حين يُراد التصريح بأن الكيان ليس مجرد جزء بل
        جزءٌ ضمن جزء أعلى في تراتبية واضحة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُزْءٌ فَرْعِيٌّ"

    - lemma: "شُعَيْبَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ محتلٌّ بالكامل بالمصطلح الطبي «bronchiole» (المسلك الهوائي المجهري)
        المُسجَّل في المعجم الوسيط والمعجم الكبير. استعماله بمعنى «جزء فرعي»
        يُنشئ اشتراكاً لفظياً حاداً مع مصطلح طبي موحَّد على المستوى العربي.

    - lemma: "قِسْمٌ فَرْعِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        يُوازي بنيوياً اللمّة الموجودة «جُزْءٌ فَرْعِيٌّ» دون أن يُضيف قيمةً
        دلالية مستقلة. «تقسيم فرعي» المُسجَّل في معاجم ألكسو يدل على العملية
        (subdivision) لا على الكيان المُحدِّد (subpart). لا تتوافر أدلة على
        «قسم فرعي» بوصفه اسماً للكيان الجزئي الهرمي.

    - lemma: "فَلْذَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الفلذة في الاستعمال العربي المعجمي لها دلالة خاصة بالقطعة الثمينة
        (كبد، ذهب) ولا تنطبق على المفهوم المجرد للجزء البنيوي الهرمي.
        فضلاً عن ذلك، لا يجتاز اختبار السكّ: «فلذة الفصل» ليست تعبيراً
        مستقراً في الكتابة العربية المتخصصة.

    - lemma: "قُسَيْمٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        اللمّة مُثبَّتة معجمياً في المورد الحديث (2008) بمعنى «قسم من جزء أكبر»،
        وهو ما يُطابق تعريف المجموعة تماماً. التصغير (فُعَيل من قِسم) منتجٌ
        صرفياً للدلالة على الصِّغَر والتبعية. الجذر قسم مُوثَّق في مقاييس
        اللغة بمعنى «تجزئة الشيء». اجتاز اختبار التثبيت المعجمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركز على الصِّغَر النسبي والتقسيم بوصفه حصة أو نصيباً (من جذر قسم
        الدال على التوزيع)، بعكس «جُزْءٌ فَرْعِيٌّ» الذي يُبرز التبعية
        الهرمية والانشعاب. «قُسَيْمٌ» أقرب إلى الاستعمال المعجمي الموجز،
        مناسب للسياقات التي تستدعي مصطلحاً أحادي الكلمة.
      actions:
        - command: create_entry
          params:
            lemma: "قُسَيْمٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13833552-n"


