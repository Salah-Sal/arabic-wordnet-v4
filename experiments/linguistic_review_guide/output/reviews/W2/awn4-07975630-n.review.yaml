stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي فيه دور دلالي حيث استخدمت كلمة 'الإجمالي' لتعريف المجموعة التي تضم كلمة 'إجمالي'."
      - "نقص بعض المصطلحات الشائعة في السياقات المالية والرياضية مثل 'حصيلة' و'ناتج'."
    observations: "المجموعة تغطي مفهوم الكلي أو حاصل الجمع، وهي مفاهيم أساسية في الحساب والاقتصاد والمنطق."
  blind_candidates:
    - lemma: "حَصِيلَة"
      generation_method: ishtiqaq
      justification: "تستخدم بكثرة للتعبير عن النتيجة النهائية المجمعة لعملية ما (مثل حصيلة الضرائب)."
    - lemma: "جُمْلَة"
      generation_method: ishtiqaq
      justification: "لفظ تراثي ومعاصر يعني جماعة الشيء أو حاصل جمعه (مثل جملة الحساب)."
    - lemma: "نَاتِج"
      generation_method: ishtiqaq
      justification: "المصطلح الرياضي المعياري لحاصل عملية الجمع أو أي عملية حسابية."
    - lemma: "مُجْمَل"
      generation_method: ishtiqaq
      justification: "يعني ما اجتمع من الشيء، ويستخدم في المحاسبة واللغة بمعنى الكل."

stage2_evidence:
  per_lemma:
    - lemma: "إجمالي"
      confirm:
        - text: "«مبلغ اجمالي، مبلغ جزافي: lump sum»"
        - text: "«(2) كُلّيّ؛ إجماليّ the aggregate amount of indebtedness»"
          source: "المورد الحديث"
    - lemma: "مجموع"
      confirm:
        - text: "«المجموع: (في علم الرياضة) نتيجة ضم الأعداد أو الحدود الجبرية المتشابهة»"
          source: "المعجم الوسيط"
        - text: "«وعند المحاسبين هو الحاصل من عمل الجمع»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "محصلة"
      confirm:
        - text: "«(ر): مجموع الكميات الموجهة (vector sum)»"
          source: "المورد الحديث"
        - text: "«المُحَصَّل: الجزء الأخير من دفاع إلخ، وفيه تُلخَّص النّقاط التي سبق تفصيلُها ويُخْلَص إلى النتائج.»"
          source: "المورد الحديث"
    - lemma: "حصيلة"
      confirm:
        - text: "«(الحصيلة) الحصيل يُقَال حصيلة الضرائب وحصيلة الأرباح والبقية»"
          source: "المعجم الوسيط"
        - text: "«البقية وما يجمع من مال أو جهد.»"
          source: "موسوعة السلطان قابوس"
    - lemma: "جملة"
      confirm:
        - text: "«(الجُمْلَة) جمَاعَة كل شَيْء وَيُقَال أَخذ الشَّيْء جملَة وَبَاعه جملَة متجمعا لَا مُتَفَرقًا»"
          source: "المعجم الوسيط"
        - text: "«جملة الحساب وغيره. يقال: أخذ الشيء جملة، وباعه جملة، أي متجمعا لا متفرقا»"
          source: "المعجم الكبير"
    - lemma: "ناتج"
      confirm:
        - text: "«أي شيء ينتجه العمل أو الجهد أو 'نتيجة لفعل أو عملية ما'.»"
          source: "مسرد التربية (ArabTerm)"
        - text: "«الناتج: نتيجة لعملية ما.»"
          source: "المعجم الموحد للرياضيات"

stage3_analysis:
  per_lemma:
    - lemma: "إجمالي"
      decision: confirmed
      decision_reason: "مصطلح معاصر شائع جداً في السياقات المالية والإحصائية للتعبير عن المجموع الكلي قبل الخصومات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِجْمَالِيّ"
    - lemma: "مجموع"
      decision: confirmed
      decision_reason: "الكلمة الأساسية والأكثر شمولاً للتعبير عن حاصل الجمع في مختلف المجالات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوع"
    - lemma: "محصلة"
      decision: confirmed
      decision_reason: "تستخدم للتعبير عن الناتج النهائي المتضافر لعدة عوامل، وهي مصطلح علمي دقيق (Resultant)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَصَّلَة"
    - lemma: "حَصِيلَة"
      source: stage1
      decision: confirmed
      decision_reason: "تؤكدها المعاجم المعاصرة (الوسيط) كمرادف للمجموع الناتج عن عملية جمع أو تحصيل (مثل الضرائب والأرباح)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حَصِيلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "جُمْلَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ أصيل في اللغة يعني جماعة الشيء، ويستخدم تقنياً في الحساب (جملة المبلغ)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "جُمْلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "نَاتِج"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الرياضي القياسي لنتيجة عملية الجمع، وهو أدق من 'مجموع' في سياق العمليات الحسابية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَاتِج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الإجمالي النهائي أو الكلي"
    assessment:
      decision: revise
      reason: "التعريف الحالي غير مانع (استخدم أحد كلمات المجموعة لتعريفها) ويفتقر للدقة الاصطلاحية."
    authored:
      - type: terminological
        text: "الحاصل من جمع أجزاء أو أعداد، أو النتيجة النهائية لعملية أو مجموعة من العوامل المتضافرة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "الحاصل من جمع أجزاء أو أعداد، أو النتيجة النهائية لعملية أو مجموعة من العوامل المتضافرة."}
  examples:
    per_lemma:
      - lemma: "إِجْمَالِيّ"
        examples:
          - text: "بلغ إجمالي الصادرات الوطنية هذا العام أرقاماً قياسية غير مسبوقة."
            type: usage
      - lemma: "مَجْمُوع"
        examples:
          - text: "مجموع زوايا المثلث المستوي يساوي مئة وثمانين درجة دائماً."
            type: usage
      - lemma: "مُحَصَّلَة"
        examples:
          - text: "كانت المحصلة النهائية للمفاوضات مرضية لجميع الأطراف المعنية."
            type: usage
      - lemma: "حَصِيلَة"
        examples:
          - text: "ارتفعت حصيلة ضريبة القيمة المضافة في الربع الأول من السنة المالية."
            type: usage
      - lemma: "جُمْلَة"
        examples:
          - text: "دفع التاجر جملة المبلغ المطلوب لتخليص بضاعته من الجمارك."
            type: usage
      - lemma: "نَاتِج"
        examples:
          - text: "ناتج عملية الجمع بين هذين الرقمين صحيح ولا غبار عليه."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "إِجْمَالِيّ"
      entry_id: "{auto}"
      root: "جمل"
      maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا تَجَمُّعُ وَعِظَمُ الْخَلْقِ... أَجْمَلْتُ الشَّيْءَ، وَهَذِهِ جُمْلَةُ الشَّيْءِ. وَأَجْمَلْتُهُ حَصَّلْتُهُ.»"
    - lemma: "مَجْمُوع"
      entry_id: "{auto}"
      root: "جمع"
      maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ. يُقَالُ جَمَعْتُ الشَّيْءَ جَمْعًا.»"
    - lemma: "مُحَصَّلَة"
      entry_id: "{auto}"
      root: "حصل"
      maqayis_quote: "«الْحَاءُ وَالصَّادُ وَاللَّامُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ، وَهُوَ جَمْعُ الشَّيْءِ... وَيُقَالُ حَصَّلْتُ الشَّيْءَ تَحْصِيلًا.»"
    - lemma: "حَصِيلَة"
      entry_id: "{auto}"
      root: "حصل"
      maqayis_quote: "«الْحَاءُ وَالصَّادُ وَاللَّامُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ، وَهُوَ جَمْعُ الشَّيْءِ... وَيُقَالُ حَصَّلْتُ الشَّيْءَ تَحْصِيلًا.»"
    - lemma: "جُمْلَة"
      entry_id: "{auto}"
      root: "جمل"
      maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا تَجَمُّعُ وَعِظَمُ الْخَلْقِ... أَجْمَلْتُ الشَّيْءَ، وَهَذِهِ جُمْلَةُ الشَّيْءِ. وَأَجْمَلْتُهُ حَصَّلْتُهُ.»"
    - lemma: "نَاتِج"
      entry_id: "{auto}"
      root: "نتج"
      maqayis_quote: "«النُّونُ وَالتَّاءُ وَالْجِيمُ كَلِمَةٌ وَاحِدَةٌ، هِيَ النِّتَاجُ.»"
  per_sense:
    - lemma: "إِجْمَالِيّ"
      sense_id: "{auto}"
      nuance: "يركز على القيمة الكلية قبل أي استقطاعات أو تفاصيل (contrasts with net)."
      mwe: false
    - lemma: "مَجْمُوع"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشامل لحاصل عملية الجمع الحسابي أو الضم الفيزيائي."
      mwe: false
    - lemma: "مُحَصَّلَة"
      sense_id: "{auto}"
      nuance: "تشير إلى النتيجة النهائية المتولدة عن تداخل عدة قوى أو عوامل (resultant)."
      mwe: false
    - lemma: "حَصِيلَة"
      sense_id: "{auto}"
      nuance: "ترتبط غالباً بما يتم 'تحصيله' أو جنيه في نهاية فترة زمنية (مثل حصيلة الأرباح)."
      mwe: false
    - lemma: "جُمْلَة"
      sense_id: "{auto}"
      nuance: "تشير إلى الكيان ككل وبصيغة مجملة (in the aggregate)."
      mwe: false
    - lemma: "نَاتِج"
      sense_id: "{auto}"
      nuance: "يركز على كونه 'مخرجاً' لعملية حسابية أو منطقية محددة."
      mwe: false
