      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جمع","maqayis":"«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حصل","maqayis":"«الْحَاءُ وَالصَّادُ وَاللَّامُ أَصْلٌ وَاحِدٌ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
