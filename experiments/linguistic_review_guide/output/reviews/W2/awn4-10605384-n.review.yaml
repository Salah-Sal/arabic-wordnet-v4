# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10605384-n
# شخص يمارس السلطة والنفوذ — a person who wields power and influence
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «صَاحِب نُفُوذ» مركب إضافي وصفي شائع لكنه عبارة وصفية أكثر منه مصطلحاً مسكوكاً"
      - "لمّة «مُؤَثِّر» اسم فاعل عام جداً ودلالته الأولى على التأثير لا على ممارسة السلطة والنفوذ كشخص"
      - "التعريف العربي قريب من الترجمة الحرفية للتعريف الإنجليزي"
    observations: "المفهوم يشير إلى شخص له قدرة على التأثير في القرارات والأحداث بفضل ما يملكه من سلطة أو نفوذ. في العربية المعاصرة يُستخدم «مُتَنَفِّذ» و«نَافِذ» و«صَاحِب نُفُوذ» و«ذُو سُلْطَان» بتفاوت دلالي. اللمّة الإنجليزية «mover and shaker» تعبير اصطلاحي أمريكي يدلّ على من يصنع الأحداث ويحرّك الأمور، وليس له مقابل مسكوك واحد في العربية."
  blind_candidates:
    - lemma: "مُتَنَفِّذ"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر «نفذ» على وزن مُتَفَعِّل، يدلّ على من يمارس النفوذ فعلياً ويتصرّف بسلطة. مستعمل في الصحافة العربية المعاصرة بمعنى صاحب النفوذ"
    - lemma: "نَافِذ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «نفذ» على وزن فاعِل، ورد في المعجم الوسيط: «رجل نافذ في أموره: ماضٍ»، و«أمر نافذ: مُطاع». يدلّ على المضاء والقدرة على إنفاذ الأمور"
    - lemma: "ذُو سُلْطَانٍ"
      generation_method: tarkib
      justification: "مركب إضافي كلاسيكي من «ذو» + «سلطان» بمعنى صاحب القوة والقهر. وارد في النصوص التراثية والقرآنية بمعنى من له حجّة وسلطة"
    - lemma: "فَاعِل"
      generation_method: majaz
      justification: "مجاز من الفعل بمعنى التأثير والصنع، يُستعمل في سياق «فاعل في المجتمع» أي مؤثر فيه وصانع لأحداثه. لكنه عام جداً وقد يتداخل مع hypernym"

stage2_evidence:
  per_lemma:
    - lemma: "صَاحِب نُفُوذ"
      confirm:
        - text: "«(5) شخص ذو نفوذ»"
          source: "المورد الحديث (2008) — مدخل influence"
      expands:
        - text: "«الصاحب: المرافق ومالك الشيء والقائم على الشيء»"
          source: "المعجم الوسيط"
          addition: "دلالة «صاحب» على الملكية والقيام على الشيء تدعم استعماله في التركيب الإضافي"
        - text: "«لقبٌ تشريفيٌّ يُطلقُ على كل مَنْ له منزلةٌ أو وجاهة أو سلطان»"
          source: "المعجم الكبير"
          addition: "صاحب يُطلق تشريفياً على ذوي المنزلة والسلطان"

    - lemma: "مُؤَثِّر"
      confirm:
        - text: "«(1) مُؤَثِّر (2) متنفّذ: ذو سلطةٍ أو نفوذ.»"
          source: "المورد الحديث (2008) — مدخل influential"
      contradicts:
        - text: "«المُؤَثِّرُ: مَا ظهر تَأْثِيره فِي الحكم»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "التعريف يستعمل «ما» لا «من»، فالمؤثر في الاصطلاح القديم ليس بالضرورة شخصاً بل قد يكون علّة أو عاملاً"
        - text: "«الْمُؤثر: مَا لَهُ تَأْثِير فِي الشَّيْء إِمَّا تَامّ فَهُوَ الْعلَّة التَّامَّة أَو غير تَامّ فَهُوَ الْعلَّة النَّاقِصَة»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "المؤثر في الاصطلاح الفلسفي والكلامي مفهوم عام يدلّ على العلّة لا على الشخص ذي النفوذ"
      expands:
        - text: "«يظهر المؤثر في إطار جرد الأدوار السردية المطالبة بوظيفة تأثير في الآخرين»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "استعمال اصطلاحي لساني بمعنى الدور السردي المؤثر في الآخرين"

    - lemma: "مُتَنَفِّذ"
      confirm:
        - text: "«(2) متنفّذ: ذو سلطةٍ أو نفوذ.»"
          source: "المورد الحديث (2008) — مدخل influential"

    - lemma: "نَافِذ"
      confirm:
        - text: "«رجل نافذٌ في أمره: ماضٍ»"
          source: "المعجم الوسيط"
        - text: "«أمر نافذ: مُطاعٌ»"
          source: "المعجم الوسيط"
        - text: "«نَافِذ: من (ن ف ذ) الماضي في أموره»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«النُّونُ وَالْفَاءُ وَالذَّالُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَضَاءٍ فِي أَمْرٍ وَغَيْرِهِ. وَهُوَ نَافِذٌ: مَاضٍ فِي أَمْرِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «نفذ» أصله المضاء في الأمر، ما يدعم دلالة «نافذ» على صاحب النفوذ"

    - lemma: "ذُو سُلْطَانٍ"
      evidence_status: "no_material_found"

    - lemma: "فَاعِل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "صَاحِب نُفُوذ"
      decision: confirmed
      decision_reason: "تركيب إضافي شائع في الاستعمال المعاصر وموثّق في المورد الحديث بمعنى «شخص ذو نفوذ». وهو وحدة معجمية ثابتة لا يمكن استبدال مكوّنيها بمرادفات مع الحفاظ على الدلالة نفسها (لا يُقال «رفيق نفوذ» مثلاً)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على الجانب الاجتماعي والسياسي للنفوذ، ويدلّ على من يمتلك نفوذاً مستقراً كصفة اجتماعية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَاحِبُ نُفُوذٍ"

    - lemma: "مُؤَثِّر"
      decision: confirmed
      decision_reason: "موثّق في المورد الحديث كمقابل لـ influential بمعنى الشخص ذي النفوذ. رغم أن الدلالة الكلامية والفلسفية تختلف، فإن الاستعمال المعاصر يُثبت هذا المعنى بوضوح. اللمّة مشكّلة بشكل صحيح."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على القدرة الفعلية على التأثير في الآخرين والأحداث، أعمّ من «صاحب نفوذ» إذ قد يكون التأثير فكرياً أو اجتماعياً لا سياسياً فحسب"

    - lemma: "مُتَنَفِّذ"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق في المورد الحديث كمرادف لـ influential بتعريف صريح: «ذو سلطةٍ أو نفوذ». مشتق قياسي على وزن مُتَفَعِّل من الجذر «نفذ» يدلّ على من يمارس النفوذ فعلياً. شائع في الإعلام العربي المعاصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على من يمارس النفوذ فعلياً ويتصرّف بسلطة، مع إيحاء بالتمكّن والتسلّط، أقوى دلالةً من «مؤثّر» وأكثر تحديداً"
      actions:
        - command: create_entry
          params: {lemma: "مُتَنَفِّذ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "نَافِذ"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «رجل نافذ في أموره: ماضٍ» في المعجم الوسيط، فإن «نافذ» يدلّ على المضاء والنفاذ في الأمور كصفة لا على الشخص ذي النفوذ كاسم. كما أن استعمالاته المعاصرة في المعاجم المتخصصة تتركّز على المعنى المادي (نافذ للسوائل/الأشعة). إضافته قد تُوقع في لبس مع هذه الدلالات."
      evidence_assessment:
        case: mixed

    - lemma: "ذُو سُلْطَانٍ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية مباشرة تُثبته كوحدة معجمية مسكوكة بمعنى الشخص ذي النفوذ. وهو تركيب وصفي حرّ يمكن استبدال «سلطان» بمرادفات (ذو قوة، ذو سطوة) مع الحفاظ على المعنى، فلا يجتاز اختبار السكّ."
      evidence_assessment:
        case: no_material

    - lemma: "فَاعِل"
      source: stage1
      decision: removed
      decision_reason: "عام جداً ويتداخل مع اللمّة «فَاعِل» الموجودة في المجموعة الأعلى (hypernym awn4-09786620-n). لا يحمل دلالة خاصة على النفوذ والسلطة."
      evidence_assessment:
        case: no_material

