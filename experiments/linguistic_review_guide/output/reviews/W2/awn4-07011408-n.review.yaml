# ═══════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset: awn4-07011408-n  |  ili: i73438  |  pos: n
# "photographs or other visual representations in a printed publication"
# ═══════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «رُسُومَات» هي جمع الجمع (رسم → رسوم → رسومات)، وقد وصفها معجم الصواب بأنها «مرفوضة» أصلاً وإن أجازها مجمع اللغة المصري؛ والأصح «رُسُوم»، غير أن الأعراف الاصطلاحية باتت تقبل «رُسُومَات»."
      - "لمّة «مواد غير نصية» ترجمة حرفية لـ nontextual matter، وهي مركب وصفي غير مثبَّت معجمياً ولا يُعدُّ وحدة اصطلاحية راسخة؛ إذ إن التعريف بالسلب («غير نصية») ينأى بها عن المصطلحية الدقيقة."
      - "لمّة «عمل فني» مركب إضافي يُترجم artwork ويُصوِّر القيمة الإبداعية، لكنه أعمّ دلالةً من المفهوم المقيَّد بـ«في منشور مطبوع»."
      - "جميع اللمّات الثلاث خالية من التشكيل الكامل — يجب تحديثها."
    observations: >
      تُمثِّل هذه المجموعة مفهوم المحتوى المرئي (صور وأشكال ورسوم) في المطبوعات، وهو مفهوم حديث النشأة في المعجمية العربية.
      الإشكالية المحورية أن اللغة العربية لا تمتلك مصطلحاً مفرداً راسخاً يُغطّي المفهوم الكلّي بمعنى "مجموع المواد البصرية في مطبوع"،
      بل تتفرّق الدلالة بين ألفاظ متعددة: «رسوم» للأشكال والخطوط، «صور» للتصوير الفوتوغرافي، «إيضاحيات» للتوضيح المصاحب للنص.
      يستوجب ذلك الإبقاء على لمّتَين بصيغتهما المُحسَّنة وحذف الكالك.

  blind_candidates:
    - lemma: "إِيضَاحِيَّات"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «إِيضَاح» (وضح)، يدل على مجموع الأشكال والصور التوضيحية المرفقة بنص مطبوع.
        الوزن (فِعَالِيَّات → إِيضَاحِيَّات) منتج في العربية المعاصرة لتجميع الأدوات المنهجية.
        يلتزم اشتقاقاً بحتاً دون اقتراض.
    - lemma: "مُصَوَّرَات"
      generation_method: ishtiqaq
      justification: >
        جمع «مُصَوَّرَة» من جذر صور على وزن مُفَعَّلَات، يدل على ما أُخذت صورته أو رُسمت هيئته.
        يشمل الصور الفوتوغرافية والرسوم المطبوعة معاً، ويمتلك قابلية اشتقاقية عالية.
    - lemma: "تَصَاوِير"
      generation_method: ishtiqaq
      justification: >
        جمع تكسير كلاسيكي لـ«تَصْوِير» أو «صُورَة» (وزن تَفَاعِيل)، وهو من ألفاظ التراث الدالة على ما يُصوَّر ويُرسم.
        إحياء للفظ الكلاسيكي الذي كان في الاستعمال العربي القديم بمعنى الهيئات المرسومة.
    - lemma: "صُوَر مَطْبُوعَة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «صُوَر» + «مَطْبُوعَة» يُحدِّد الصور بالسياق المطبعي.
        يُضيِّق دلالة «صُوَر» المطلقة بإضافة القيد المكاني/الوظيفي.


stage2_evidence:
  per_lemma:
    - lemma: "رسومات"
      confirm:
        - text: "«رُسُومات هندسيَّة [صحيحة] — التعليق: وردت كلمة «رُسُوم» جمعًا لـ «رَسْم» في المعاجم، ويمكن تصحيح الاستعمال المرفوض على أنه جمع الجمع، وقد أقرَّ مجمع اللغة المصري قياسيَّة جمع الجمع عند الحاجة؛ لكثرة ما ورد منه في الاستعمالات العربية القديمة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: "«رُسُومات هندسيَّة [مرفوضة] — السبب: لأنَّ هذا الجمع لم يرد في المعاجم القديمة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "المعجم يضعها في خانة «مرفوضة» أصلاً، وإن أجازها مجمع اللغة المصري لاحقاً بوصفها جمع جمع."

    - lemma: "عمل فني"
      confirm:
        - text: "«(1) الإنتاج الفنّيّ (2) رسوم الكتاب وزخارفُه»"
          source: "المورد الحديث (2008)"
        - text: "«عمل فني رئيسي — artwork master»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«قِسْم الإبداع — artwork department»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يكشف أن «عمل فني» يُستخدم مؤسسياً في سياق الإنتاج الإعلامي والطباعي."

    - lemma: "مواد غير نصية"
      contradicts:
        - text: "«غير موضح — بدون صور أو رسوم — unillustrated»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"
          conflict: "المصطلح الوارد في المعجم هو «غير موضَّح» (سلبي) وليس «مواد غير نصية» كمصطلح إيجابي مستقل، مما يؤكد غياب التثبيت المعجمي لهذا التركيب."
      expands:
        - text: "«رُسُوميّات — علم أو تقنية معالجة الرسوم، وتطلق أيضاً على العناصر غير المحارف — graphics»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "عبارة «العناصر غير المحارف» تُكافئ مفهوم nontextual matter، وتُثبِّت أن المصطلح الدارج للدلالة على هذا المفهوم هو «رُسُوميّات» لا «مواد غير نصية»."

    - lemma: "إيضاحيات"
      confirm:
        - text: "«إيضاح — illustration — Arts, Recreation and Sports»"
          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«إيضاح — بيان فكرة بوسائل مساعدة كالصورة والحركة والمثال وغيرها — illustration»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«صورة إيضاحيَّة — illustration»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«رسوم توضيحية — توضيح وتزيين نصوص الكتب بالصور أو الرسوم الايضاحية — illustration»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
        - text: "«توضيح — تمثيل خطي أو رسومي يُستخدم لوصف قصة أو رواية أو شعر يُرفق بالصورة، لدعم نص إخباري (علمي أو صحفي) — illustration»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"

    - lemma: "مصورات"
      expands:
        - text: "«مصوَّر — pictorial»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "الشكل الصفة «مصوَّر» موثَّق جيداً، لكن «مصوَّرات» (الاسم الجمع) لم يرد كمصطلح مستقل."

    - lemma: "تصاوير"
      contradicts:
        - text: "«التَّصاوِيرُ: التَّماثيلُ»"
          source: "المعجم الكبير"
          conflict: "المعجم الكلاسيكي يُقيِّد «التصاوير» بمعنى التماثيل والأشكال المنحوتة أو المرسومة ثلاثية الأبعاد، لا بمعنى الصور المطبوعة."

    - lemma: "صور مطبوعة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "رسومات"
      decision: confirmed
      decision_reason: >
        صيغة «رُسُومَات» مقبولة بوصفها جمع الجمع، وقد أقرَّها مجمع اللغة المصري.
        وهي اللمّة الأشمل والأكثر تداولاً في الاستعمال العربي المعاصر للإشارة إلى الأشكال والصور في المطبوعات.
        تحتاج إلى تحديث التشكيل فقط.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز على الجانب الرسومي والبصري (drawings, graphics) وتشمل بالتوسُّع الصور الفوتوغرافية
        عند الاستعمال في سياق المطبوعات؛ وهي أوسع استخداماً في اللغة اليومية والتقنية مقارنةً بـ«عمل فني».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُسُومَات"

    - lemma: "عمل فني"
      decision: confirmed
      decision_reason: >
        موثَّق في المورد الحديث (2008) بالمعنيين: «الإنتاج الفنّيّ» و«رسوم الكتاب وزخارفه»، وهو ما يطابق
        دلالة المجموعة (artwork). يُستعمل في سياقات الإعلام والطباعة والنشر.
        مركَّب إضافي راسخ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على القيمة الإبداعية والجمالية للمادة المرئية (artwork) أكثر من مجرد وصفها بصرياً؛
        ويُحيل إلى الإنتاج الفني بوصفه منتَجاً إبداعياً، بخلاف «رُسُومَات» التي تصف المادة المرئية بشكل تقني وصفي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَل فَنِّيّ"

    - lemma: "مواد غير نصية"
      decision: removed
      decision_reason: >
        ترجمة حرفية للكالك nontextual matter، تعتمد على التعريف بالسلب («غير نصية») وهو أسلوب ضعيف في المصطلحية العربية.
        لا يُثبِّتها أي مصدر معجمي كوحدة اصطلاحية مستقلة. المفهوم المقصود يُعبَّر عنه في المعاجم التقنية بـ«رُسُوميّات»
        أو «العناصر غير المحارف». اختبار التثبيت المعجمي: فشل — يمكن إبدال «مواد» بـ«محتويات» أو «عناصر»
        دون أن تفقد الوصفية، مما يدل على أنها عبارة وصفية حرة لا مصطلح.

    - lemma: "إيضاحيات"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود أدلة قوية لـ«إيضاح» و«رسوم توضيحية» بمعنى illustration، فإن «إِيضَاحِيَّات» بالجمع الجماعي
        لم تَرِد كمصطلح مستقل موثَّق في المعاجم المتاحة. الصيغة المُثبَّتة هي «إيضاح» (مفرد) أو «رسوم توضيحية» (مركّب).
        اختبار السكّ: فشل — «إيضاحيات» تبقى وصفاً للأشكال التوضيحية المصاحبة للنص، لا للمحتوى البصري الكلّي في مطبوعة.

    - lemma: "مصورات"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوثَّق «مُصَوَّرَات» كاسم جمع مستقل في المعاجم؛ «مُصَوَّر» موثَّق بوصفه صفة (pictorial/illustrated)
        لكن الانتقال إلى الاسم الجمع الاستقلالي يفتقر إلى شاهد معجمي.

    - lemma: "تصاوير"
      source: stage1
      decision: removed
      decision_reason: >
        «التَّصاوير» في المعجم الكلاسيكي تعني التماثيل والهيئات المنحوتة/المرسومة، لا الصور المطبوعة الحديثة.
        إحياء هذا اللفظ بمعنى مختلف سيُسبِّب اشتراكاً لفظياً مع الاستعمال التراثي.

    - lemma: "صور مطبوعة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يَثبُت كمصطلح مسكوك في المعاجم. اختبار السكّ: فشل — يمكن إبدال «مطبوعة» بـ«منشورة» أو «مصورة»
        وتظل الجملة وصفية صالحة، مما يدل على أنه عبارة وصفية لا وحدة اصطلاحية ثابتة.


