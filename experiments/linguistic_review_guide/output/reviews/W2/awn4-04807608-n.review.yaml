      decision_reason: >
        المورد الحديث يُدرج «طرافة» ضمن ترجمات «originality» مباشرةً. ومقاييس اللغة
        تثبت أن «الطريف» = الشيء المستحدَث خلاف التليد، ومنه «اطَّرَفتُ الشيءَ إذا
