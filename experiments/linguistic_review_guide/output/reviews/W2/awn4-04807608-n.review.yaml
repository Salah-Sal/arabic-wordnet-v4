            التفرد = الانفراد بخصيصة دون المشاركة فيها، أي «تميز فريد» لا بالضرورة جديد
            أو غير مشتق. «uniqueness» ≠ «originality».
        - text: "«الْفَاءُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى وُحْدَةٍ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مادة فرد"
          conflict: >
            الجذر يدل على الوحدة والانفراد، لا على الجِدَّة وعدم الاشتقاق؛ مما يجعل
            «تفرد» أبعد دلالياً عن «originality».

    - lemma: "جِدَّة"
      contradicts:
        - text: "«(الجِدَّة) وَجْهُ الأَرْضِ وقِلادَةٌ في عُنُقِ الكَلْبِ (ج) جِدَد»"
          source: "المعجم الوسيط (hawramani)"
          conflict: "الدلالة الراسخة في المعجم الوسيط جغرافية/مادية، لا مجردة."
        - text: "«(الجُدَّة) شاطئ النهر / جُزْءُ الشيء يخالف لونُه لونَ سائره»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المدخل في الوسيط بضم الجيم لا بكسره، والمعنى مادي لا مجرد."
      expands:
        - text: "«(1) البِدْع: شيء جديد أو غير مألوف / (2) جِدَّة»"
          source: "المورد الحديث — مدخل novelty"
          addition: >
            Al-Mawrid يستخدم «جِدَّة» ترجمةً لـ novelty (جِدَّة الشيء وحداثته)، غير
            أن novelty ≠ originality.

    - lemma: "بَكَارَة"
      contradicts:
        - text: "«البَكَارَة: عُذْرَةُ المَرأَة»"
          source: "المعجم الكبير (OCR)"
          conflict: "الدلالة المعجمية الوحيدة والراسخة: العذرة. لا علاقة بالأصالة."
        - text: "«البَكارة» — translation_en: maidenhead (hymen)"
