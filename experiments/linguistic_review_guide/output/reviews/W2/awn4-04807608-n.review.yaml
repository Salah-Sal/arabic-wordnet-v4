# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # التقييم الأولي (بعد قراءة synset_info الكامل)
  assessment:
    concerns:
      - "لمّة «ابْتِكَار» تترادف في المعاجم الحديثة مع «innovation» (عملية الإبداع ونتاجه)
         لا مع «originality» (صفة كون الشيء أصيلاً غير مشتق)؛ فهي تُعبِّر عن مسار لا
         عن صفة جوهرية، مما يُوقع في خطأ المفهوم."
      - "لمّة «أَصَالَة» في المعجم الوسيط لها دلالات ثلاث: جودة الرأي، وابتكار الأسلوب،
         وعراقة النسب — وهي أوسع من الدلالة المطلوبة (كون الشيء جديداً غير مشتق). يجب
         أن يُبيَّن في التعريف أيُّ وجه من وجوه الأصالة يُقصد هنا."
      - "التعريف العربي الحالي قريب جداً من الترجمة الحرفية للإنجليزية دون صياغة معجمية
         أصيلة."
    observations: >
      المجموعة تصف «صِفَة» (quality = مصدر صناعي أو وصف مجرد) لا فعلاً ولا اسم عَيْن،
      وهذا يستدعي لمّات على وزن فَعالة (أَصَالَة، طَرَافَة، جِدَّة) أو وزن تَفَعُّل أو مصادر
      رباعية. «أَصَالَة» مناسبة صرفياً تماماً. أما «ابتكار» فمصدر باب الافتعال ويغلب عليه
      معنى الصيرورة والإنجاز لا معنى الوصف الثابت، كما تثبته المعاجم الحديثة التي تُقابله
      بـ innovation و invention. الأجدر أن يُستعاض عنه بلفظ يحمل صفة الجِدَّة والأصالة
      ابتداءً كـ «الطَّرَافَة» التي وردت في المعاجم ترجمةً مباشرة لـ originality.

  # المرشحات العمياء — ولِّدَت قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "طَرَافَة"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فَعالة من جذر (ط ر ف). الطَّرِيفُ في كلام العرب: الشيء المستحدَث
        خلاف التَّلِيد. فـ«الطَّرَافَة» صفة كون الشيء طريفاً جديداً غير موروث، مما يُلامس
        معنى الأصالة (عدم الاشتقاق من آخر). الوزن فَعالة يناسب المفاهيم المجردة الصفاتية.

    - lemma: "تَفَرُّد"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفَعُّل من جذر (ف ر د). يدل على الانفراد بخصيصة وعدم الاشتراك
        فيها مع آخر، مما يقترب من معنى "غير مشتق من شيء آخر". غير أنه يؤكد الوحدة
        أكثر من الجِدَّة.

    - lemma: "جِدَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر من جَدَّ يَجِدُّ، بمعنى صار جديداً وحدِث. «الجِدَّة» تحمل صفة الحداثة
        وكون الشيء جديداً لم يُسبق إليه. وزن فِعْلَة يناسب المصادر الدالة على الحالة.

    - lemma: "بَكَارَة"
      generation_method: majaz
      justification: >
        من جذر (ب ك ر): البِكْرُ أول الشيء وما لم يُسبق إليه. «البَكَارَة» مجازاً:
        كون الشيء أول من نوعه لم يُحذَ حذوه ولم يُشتَق من سابق، على نحو «بِكر الأفكار».
        استحياء لمعنى قديم محجوب تحت الاستخدام الشائع.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "أَصَالَة"
      confirm:
        - text: "«(الأَصَالَة) في الرأي: جودته. في الأسلوب: ابتكاره. في النسب: عراقته»"
          source: "المعجم الوسيط (مجمع اللغة العربية — OCR)"
        - text: "«(الأَصَالَة) فِي الرَّأْيِ جودته وَفِي الأسلوب ابتكاره وَفِي النَّسَبِ عراقته»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«أصالة» — translation_en: originality"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ArabTerm)"
        - text: "«أصالة» — translation_en: originality"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
        - text: "«(1) الأصلية: كون الشيء أصليًّا / (2) جِدّة؛ طرافة / (3) أصالة؛ إبداع /
                 (4) شيء أصليّ أو مُبْتَدَع»"
          source: "المورد الحديث (2008) — مدخل originality"
      expands:
