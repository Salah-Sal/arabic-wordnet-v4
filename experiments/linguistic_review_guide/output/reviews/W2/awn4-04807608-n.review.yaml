                 بفاعل فردي عن الأصالة الجماعية في تنسيبها للثقافة إلى عراقةٍ ما»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ArabTerm)"
          addition: >
            يكشف هذا التعريف عن الطابع الفلسفي للأصالة كممارسة ذاتية لا مجرد صفة
            موضوعية، مما يوسع الدلالة نحو الأصالة الإبداعية.
        - text: "«الأصالة مصدر من الفعل «أَصُلَ يأصُلُ» على وزن «فَعالة» بفتح الفاء»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (hawramani)"
          addition: "يُثبت الوزن الصرفي الصحيح فَعَالَة، ويُصوِّب همزة الفعل."

    - lemma: "ابْتِكَار"
      confirm:
        - text: "«عملية إبداع فكرة جديدة أو التوليف بين أشياء موجودة تأليفاً جديداً على أن
                 تكون الأشياء المبتكرة جديدة، وتتطلب هذه العملية التخيلَ والقدرةَ على
                 الاختيار والتمكُّنَ من الفعل والتنفيذ والاستمراريةَ وقوةَ الإرادة»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (ArabTerm)"
      contradicts:
        - text: "«ابتكار» — translation_en: innovation"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          conflict: >
            الترجمة الإنجليزية «innovation» تعني عملية الإبداع ونتاجه، لا «originality»
            التي تعني الصفة الجوهرية لكون الشيء أصيلاً غير مشتق. فرق دلالي حاسم.
        - text: "«ابتكار» — translation_en: invention"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ArabTerm)"
          conflict: >
            «invention» = اختراع، وهو نتاج عملية محددة، أبعد ما يكون عن «صفة الأصالة».
        - text: "«الْبَاءُ وَالْكَافُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَرْجِعُ إِلَيْهِ فَرْعَانِ... فَالْأَوَّلُ
                 أَوَّلُ الشَّيْءِ وَبَدْؤُهُ... وَالتَّبْكِيرُ وَالْبُكُورُ وَالاِبْتِكَارُ الْمُضِيُّ فِي
                 ذَلِكَ الْوَقْتِ [أي وقت البُكرة = الغداة]»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          conflict: >
            الابتكار في أصله العربي القديم = «المضيُّ في وقت البُكرة»، أي التبكير لا
            الإبداع. دلالته الحديثة مجاز ثانوي. هذا يُضعف توظيفه في سياق «صفة الأصالة».

    - lemma: "طَرَافَة"
      confirm:
        - text: "«(1) الأصلية: كون الشيء أصليًّا / (2) جِدّة؛ طرافة / (3) أصالة؛ إبداع»"
          source: "المورد الحديث (2008) — مدخل originality"
        - text: "«وَمِنَ الْبَابِ قَوْلُهُمْ لِلشَّيْءِ الْمُسْتَحْدَثِ: طَرِيفٌ؛ وَهُوَ خِلَافُ التَّلِيدِ،
                 وَمَعْنَاهُ أَنَّهُ شَيْءٌ أُفِيدَ الْآنَ فِي طَرَفِ زَمَانٍ قَدْ مَضَى. يَقُولُونَ مِنْهُ:
                 اطَّرَفْتُ الشَّيْءَ إِذَا اسْتَحْدَثْتَهُ، أَطَّرِفُهُ، اطِّرَافاً»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مادة طرف"

    - lemma: "تَفَرُّد"
      confirm:
        - text: "«تفرُّد» — translation_en: uniqueness"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
      contradicts:
        - text: "«(تفرد) بالأمر انفرد»"
          source: "المعجم الوسيط (hawramani)"
