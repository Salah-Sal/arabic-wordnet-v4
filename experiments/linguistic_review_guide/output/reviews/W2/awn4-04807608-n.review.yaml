        لكون الشيء أصيلاً غير مشتق. هو اسم مسار (process noun)، لا اسم صفة ثابتة؛ بينما
        المجموعة الترادفية تنتسب إلى مجموعة أمِّها «جَوْدَة / نَوْعِيَّة» (quality). علاوة
        على أن أصله في مقاييس اللغة «التبكير = المضي في وقت البُكرة» مجاز بعيد عن الدلالة
