# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-06636121-n
# correspondence — التواصل عن طريق تبادل الرسائل
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مراسلة، مكاتبة) بدون تشكيل كامل"
      - "التعريف العربي مقبول لكنه قريب من ترجمة حرفية للتعريف الإنجليزي"
    observations: >
      المجموعة تمثّل مفهوم التواصل الكتابي المتبادل عبر الرسائل، وهو مفهوم أصيل في الثقافة العربية
      له جذور عميقة في تراث المراسلات الأدبية والديوانية. اللمّتان الموجودتان مناسبتان
      وتنتميان إلى وزن مُفَاعَلَة الدال على المشاركة. يمكن النظر في إضافة المصدر
      التفاعلي (تَرَاسُل) لتغطية البعد التبادلي.
  blind_candidates:
    - lemma: "مُرَاسَلَة"
      generation_method: ishtiqaq
      justification: "مصدر رَاسَلَ على وزن مُفَاعَلَة من جذر (رسل)، يدل على تبادل الرسائل بين طرفين"
    - lemma: "مُكَاتَبَة"
      generation_method: ishtiqaq
      justification: "مصدر كَاتَبَ على وزن مُفَاعَلَة من جذر (كتب)، يدل على تبادل الكتابة والرسائل"
    - lemma: "تَرَاسُل"
      generation_method: ishtiqaq
      justification: "مصدر تَرَاسَلَ على وزن تَفَاعُل من جذر (رسل)، يؤكد التبادلية والاشتراك في إرسال الرسائل"
    - lemma: "مُخَابَرَة"
      generation_method: ishtiqaq
      justification: "مصدر خَابَرَ على وزن مُفَاعَلَة من جذر (خبر)، قد يدل على تبادل الأخبار والمراسلات"


stage2_evidence:
  per_lemma:
    - lemma: "مُرَاسَلَة"
      confirm:
        - text: "«تبادل الرسائل بين شخصين أو جهتين.»"
          source: "مسرد الإعلام والتواصل (ALECSO/ArabTerm)"
        - text: "«(3) «أ» تراسُل؛ مُراسَلة. «ب» الرسائل المتبادَلة.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مُراسَلة — correspondence / correspondance»"
          source: "مسرد الفن والتسلية والرياضة (ALECSO/ArabTerm)"
          addition: "يؤكد أن المصطلح مستعمل في مجالات متعددة لا في الإعلام فحسب"

    - lemma: "مُكَاتَبَة"
      confirm:
        - text: "«المكاتبة:[في الانكليزية] Correspondance [في الفرنسية] Correspondance هي عند المحدّثين أن يكتب الشيخ مسموعه لغائب أو حاضر بخطّه أو بخطّ غيره بإذنه»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«وفي شرح النخبة أطلق المتأخّرون المكاتبة في الإجازة المكتوب بها بخلاف المتقدّمين فإنّهم إنّما يطلقونها فيما كتبه الشيخ من الحديث إلى الطالب سواء أذن له في روايته أم لا.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "المكاتبة عند المحدّثين مصطلح خاص بنقل الحديث كتابةً، لكنّ الأصل اللغوي عامّ في التراسل الكتابي"

    - lemma: "تَرَاسُل"
      confirm:
        - text: "«(تراسل) القوم أرسل بعضهم إلى بعض رسولا أو رسالة»"
          source: "المعجم الوسيط"
        - text: "«(3) «أ» تراسُل؛ مُراسَلة. «ب» الرسائل المتبادَلة.»"
          source: "المورد الحديث (2008)"
        - text: "«فنّ تبادل الرسائل الكتابية بين الكتاب، وهو موضوع يركز على علاقات فكرية وأسلوبية تساهم في توضيح مكونات النصوص والرؤى الحياتية لكتابها.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — تراسل أدبي"
      expands:
        - text: "«استخدامُ الحواسيبِ ومعدّات اتصالات المعطيات لنقْلِ الرسائل من شخص لآخر، كما هو الحال في البريد الإلكتروني، أو البريد الصوتي، أو الفكس.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "التراسل في السياق التقني يعني messaging ويشمل الوسائط الإلكترونية، وهو توسيع حديث للمفهوم"

    - lemma: "مُخَابَرَة"
      contradicts:
        - text: "«أن يُعطي المالك الفلاح أرضاً يزرعها على بعض ما يخرج منها. كالثلث أو الربع»"
          source: "المعجم الوسيط"
          conflict: "المخابرة في المعاجم العربية الكلاسيكية والمعاصرة تعني المزارعة بالحصص، لا التراسل أو التواصل الكتابي"
        - text: "«المُخَابرة: هي مُزَارعة الأرض على الثُلُث أو الرُبُع أو النصف أي على حصَّة شائعة.»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "تأكيد إضافي أن المخابرة مصطلح فقهي زراعي"
        - text: "«المخابرة: هي مزارعة الأرض على الثلث أو الربع.»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى ثابت عبر المعاجم الكلاسيكية والحديثة: مزارعة لا مراسلة"


stage3_analysis:
  per_lemma:
    - lemma: "مُرَاسَلَة"
      decision: confirmed
      decision_reason: "لمّة مدعومة بأدلة معجمية مباشرة من مصادر متعددة (المورد الحديث، مسرد الإعلام والتواصل) بوصفها ترجمة correspondence. التعريف المعجمي يطابق دلالة المجموعة تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على فعل الإرسال المتبادل (من جذر رسل = أرسل)؛ أعمّ من المكاتبة لأنها تشمل الرسائل الشفوية والكتابية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرَاسَلَة"

    - lemma: "مُكَاتَبَة"
      decision: confirmed
      decision_reason: "لمّة مؤكّدة بدليل من كشّاف اصطلاحات الفنون الذي يربطها صراحةً بـ Correspondance. وإن كان المعنى الاصطلاحي عند المحدّثين أخصّ، فالأصل اللغوي يدل على تبادل الكتابة عموماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على البُعد الكتابي (من جذر كتب = كتابة)؛ أخصّ من المراسلة إذ تقتصر على التواصل المكتوب دون الشفوي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُكَاتَبَة"

    - lemma: "تَرَاسُل"
      source: stage1
      decision: confirmed
      decision_reason: "مدعوم بأدلة من المعجم الوسيط والمورد الحديث ومعجم اللسانيات. المورد الحديث يضعه ترجمةً مباشرة لـ correspondence إلى جانب المراسلة. وزن تَفَاعُل يُبرز التبادلية التي هي جوهر مفهوم المجموعة (exchange of letters)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز التبادلية والاشتراك في الفعل (وزن تَفَاعُل = مشاركة) أكثر من أختيه؛ يُستعمل في السياق الأدبي (تراسل أدبي) وفي السياق التقني الحديث (messaging)"
      actions:
        - command: create_entry
          params:
            lemma: "تَرَاسُل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُخَابَرَة"
      source: stage1
      decision: removed
      decision_reason: "جميع الأدلة المعجمية (الوسيط، الجرجاني، البركتي، التهانوي) تُجمع على أن المخابرة تعني المزارعة بالحصص. الاستعمال المعاصر بمعنى التواصل/الاستخبارات عامّي أو حديث جداً ولا سند معجمياً له."


