stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يحتوي على دور منطقي (استخدام كلمة مبادرة في تعريف مبادرة الاعتدالين)."
    observations: "المصطلح 'مبادرة الاعتدالين' هو المقابل العلمي الدقيق لـ (precession of the equinoxes)، وهناك ترادفات تراثية وعلمية أخرى مثل 'سبق الاعتدالين' و'تقدم الاعتدالين'."
  blind_candidates:
    - lemma: "سَبْقُ الِاعْتِدَالَيْنِ"
      generation_method: tarkib
      justification: "الاسم التاريخي والعلمي المعروف في التراث الفلكي العربي لهذه الظاهرة."
    - lemma: "تَقَدُّمُ الِاعْتِدَالَيْنِ"
      generation_method: tarkib
      justification: "مرادف علمي شائع في الكتب الفلكية الحديثة."
    - lemma: "تَقَدُّمِيَّةُ الِاعْتِدَالَيْنِ"
      generation_method: ishtiqaq
      justification: "صيغة مصدرية صناعية تعبر عن استمرارية الحركة."
    - lemma: "انْزِيَاحُ الِاعْتِدَالَيْنِ"
      generation_method: majaz
      justification: "وصف مباشر للظاهرة كما وردت في التعريف العربي (انزياح غربي بطيء)."

stage2_evidence:
  per_lemma:
    - lemma: "مُبَادَرَةُ الِاعْتِدَالَيْنِ"
      confirm:
        - text: "«مبادرة: precession (Mathematics and Astronomy)»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
        - text: "«مبادَرة الاعتدالين أو تقدُّمهما (فل): precession of the equinoxes»"
          source: "المورد الحديث"
    - lemma: "تَقَدُّمُ الِاعْتِدَالَيْنِ"
      confirm:
        - text: "«مبادَرة الاعتدالين أو تقدُّمهما: precession of the equinoxes»"
          source: "المورد الحديث"
    - lemma: "سَبْقُ الِاعْتِدَالَيْنِ"
      expands:
        - text: "«السّبق:[في الانكليزية] Priority... وعند الرياضيين عبارة عن فضل وسط القمر على وسط الشمس كذا في شرح التذكرة وشرح الچغميني.»"
          source: "كشاف اصطلاحات الفنون"
          addition: "يوثق استخدام مادة 'سبق' في السياق الفلكي والرياضي القديم للتعبير عن تفاوت الحركات السماوية."
    - lemma: "انْزِيَاحُ الِاعْتِدَالَيْنِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُبَادَرَةُ الِاعْتِدَالَيْنِ"
      decision: confirmed
      decision_reason: "المصطلح الفني المعاصر والمعتمد في المعاجم الموحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُبَادَرَةُ الِاعْتِدَالَيْنِ"
    - lemma: "تَقَدُّمُ الِاعْتِدَالَيْنِ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف علمي موثق في المعاجم المتخصصة (المورد الحديث)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "تَقَدُّمُ الِاعْتِدَالَيْنِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "سَبْقُ الِاعْتِدَالَيْنِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فلكي أصيل يعبر عن جوهر الظاهرة (السبق الزمني والمكاني)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "سَبْقُ الِاعْتِدَالَيْنِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "انْزِيَاحُ الِاعْتِدَالَيْنِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي أكثر منه مصطلحاً فنياً مسكوكاً."

stage4_content:
  definition:
    current: "انزياح غربي بطيء للاعتدالين على طول مستوى مسار الشمس ناتج عن مبادرة محور دوران الأرض"
    assessment:
      decision: revise
      reason: "تجنب الدور في التعريف (استخدام كلمة مبادرة لتعريف مبادرة الاعتدالين)."
    authored:
      - type: terminological
        text: "حركة دورانية بطيئة لمحور الأرض تؤدي إلى انزياح تدريجي لنقطتي الاعتدالين (الربيعي والخريفي) باتجاه الغرب على طول مدار البروج."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "حركة دورانية بطيئة لمحور الأرض تؤدي إلى انزياح تدريجي لنقطتي الاعتدالين (الربيعي والخريفي) باتجاه الغرب على طول مدار البروج."}

  examples:
    per_lemma:
      - lemma: "مُبَادَرَةُ الِاعْتِدَالَيْنِ"
        examples:
          - text: "تؤدي مبادرة الاعتدالين إلى تغير طفيف في موقع النجم القطبي بالنسبة لمحور الأرض عبر القرون."
            type: usage
      - lemma: "تَقَدُّمُ الِاعْتِدَالَيْنِ"
        examples:
          - text: "يُعدُّ تقدّم الاعتدالين ظاهرة فلكية تستغرق دورة كاملة فيها حوالي 26 ألف سنة."
            type: usage
      - lemma: "سَبْقُ الِاعْتِدَالَيْنِ"
        examples:
          - text: "عُرفت ظاهرة سبق الاعتدالين لدى الفلكيين العرب القدماء الذين رصدوا تغير مواضع الثوابت."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تتسبب مبادرة الاعتدالين في انزياح البروج الفلكية عن كوكباتها الأصلية بمرور الزمن."}

