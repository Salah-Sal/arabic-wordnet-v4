stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية (مَسْؤُول عِلَاقَات عَامَّة) تفتقر إلى التشكيل الكامل الدقيق للكلمة الأخيرة، وحركة حرف العين في (علاقات) شائعة بالفتح (عَلَاقات)."
      - "التعريف الحالي يبدو مترجماً حرفياً عن الإنجليزية، ويمكن صياغته بأسلوب معجمي عربي أفضل."
    observations: "المفهوم حديث ومأخوذ عن الإنجليزية (Public Relations Officer)، ولكنه استقر في المعجمية العربية المعاصرة بتركيب (مسؤول علاقات عامة) أو (موظف علاقات عامة)."
  blind_candidates:
    - lemma: "مَسْؤُولُ عَلَاقَاتٍ عَامَّةٍ"
      generation_method: tarkib
      justification: "تركيب إضافي ووصفي يعبر بدقة عن وظيفة الشخص المسؤول عن إدارة العلاقة مع الجمهور."
    - lemma: "مُوَظَّفُ عَلَاقَاتٍ عَامَّةٍ"
      generation_method: tarkib
      justification: "مترادف شائع يعبر عن نفس الوظيفة في المؤسسات."
    - lemma: "مَنْدُوبُ عَلَاقَاتٍ عَامَّةٍ"
      generation_method: tarkib
      justification: "بديل مستخدم أحياناً للإشارة لمن يمثل المؤسسة أمام الجمهور."
    - lemma: "مُمَثِّلٌ جَمَاهِيرِيٌّ"
      generation_method: tarkib
      justification: "ترجمة وصفية تشير إلى من يمثل المؤسسة أمام الجماهير."

stage2_evidence:
  per_lemma:
    - lemma: "مَسْؤُول عِلَاقَات عَامَّة"
      confirm:
        - text: "«مسؤول العلاقات العامَّة: public relations officier (P.R.O.)»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "مَسْؤُولُ عَلَاقَاتٍ عَامَّةٍ"
      confirm:
        - text: "«مسؤول العلاقات العامَّة: public relations officier (P.R.O.)»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "مُوَظَّفُ عَلَاقَاتٍ عَامَّةٍ"
      evidence_status: "no_material_found"
    - lemma: "مَنْدُوبُ عَلَاقَاتٍ عَامَّةٍ"
      evidence_status: "no_material_found"
    - lemma: "مُمَثِّلٌ جَمَاهِيرِيٌّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مَسْؤُول عِلَاقَات عَامَّة"
      decision: confirmed
      decision_reason: "مصطلح ثابت ومستقر في الاستعمال الإداري والإعلامي المعاصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "المصطلح الأكثر رسمية وشيوعاً للإشارة إلى هذه الوظيفة الإدارية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَسْؤُولُ عَلَاقَاتٍ عَامَّةٍ"
            
    - lemma: "مُوَظَّفُ عَلَاقَاتٍ عَامَّةٍ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح شائع ومترادف مقبول يعبر عن نفس الوظيفة في المؤسسات وإن كان أقل رتبة في بعض السياقات من (مسؤول)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "قد يشير إلى أي موظف في قسم العلاقات العامة، دون أن يكون بالضرورة المدير أو المسؤول الأول."
      actions:
        - command: create_entry
          params:
            lemma: "مُوَظَّفُ عَلَاقَاتٍ عَامَّةٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَنْدُوبُ عَلَاقَاتٍ عَامَّةٍ"
      source: stage1
      decision: removed
      decision_reason: "غير دقيق للتعبير عن الوظيفة المتكاملة؛ المندوب عادة من ينفذ مهام محددة كالمعاملات الورقية (مخلص) أو التوصيل."
      
    - lemma: "مُمَثِّلٌ جَمَاهِيرِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "وصف عام يمكن أن يطلق على السياسيين أو النقابيين ولا يختص بوظيفة العلاقات العامة المؤسسية."

stage4_content:
  definition:
    current: "شخص موظف لتأسيس وتعزيز علاقة إيجابية مع الجمهور"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية؛ الصياغة المقترحة تتبع أسلوب المعاجم العربية وتوضح الوظيفة والهدف بأسلوب أدق."
    authored:
      - type: terminological
        text: "شَخْصٌ يَتَوَلَّى مَسْؤُولِيَّةَ التَّوَاصُلِ مَعَ الْجُمْهُورِ لِبِنَاءِ صُورَةٍ إِيجَابِيَّةٍ لِلْمُؤَسَّسَةِ الَّتِي يُمَثِّلُهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَتَوَلَّى مَسْؤُولِيَّةَ التَّوَاصُلِ مَعَ الْجُمْهُورِ لِبِنَاءِ صُورَةٍ إِيجَابِيَّةٍ لِلْمُؤَسَّسَةِ الَّتِي يُمَثِّلُهَا."

