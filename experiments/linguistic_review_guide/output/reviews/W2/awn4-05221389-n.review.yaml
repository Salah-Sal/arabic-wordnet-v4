        وفي المورد الحديث بمعنى «كون الشيء ذاتياً» و subjectivism معاً؛
        وهي المصطلح الراسخ في الخطاب الأكاديمي والصحفي العربي لهذا المفهوم.
        غير أنها تفتقر إلى التشكيل الكامل — تحتاج تحديثاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُعبّر عن الخاصية العامة لكون الشيء منتسباً إلى الذات المُدرِكة
        (الجانب الوصفي)، دون أن تنحصر في المذهب الفلسفي المتكامل؛
        تُستعمل في الخطاب اللغوي والتربوي والإعلامي والفلسفي على حدٍّ سواء.
