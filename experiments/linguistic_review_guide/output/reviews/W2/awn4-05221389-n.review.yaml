# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # التوليد الأعمى — قُرئ الملف المُقنّع أولاً (بلا لمّات)
  # المدخلات: pos=n | definition_ar="صفة كون الشيء ذاتياً"
  blind_candidates:
    - lemma: "ذَاتِيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي من "ذات" (النفس/الجوهر) على وزن فَعَالِيَّة،
        يدلّ مباشرةً على خاصية الانتساب إلى الذات؛ وهو أنسب الأوزان
        لتحويل الصفة إلى مفهوم مجرد في عربية المعاصرة.

    - lemma: "ذَاتَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من "ذات" بزيادة بنية (-انية) الدالة على المذاهب
        والنزعات الفكرية (كالروحانية والمادانية والإنسانية)؛ يُميّز
        المذهبَ الفلسفيَّ القائل بذاتية المعرفة عن مجرد الصفة.

    - lemma: "شَخْصَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        من "شخص" بزيادة (-انية)، يُعبّر عن انتساب الأحكام إلى
        الشخص المُدرِك لا الموضوع؛ استُعمل "شخصاني" في المعاجم
        الطبية الموحدة مقابل subjective، فالمصدر الصناعي منه
        يُوفّر مصطلحاً مجرداً مناسباً.

    - lemma: "نَزْعَةُ الذَّاتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: (نَزْعَة = ميل/توجّه) + (الذَّات = النفس)،
        يدل على الميل الفطري إلى إصدار الأحكام من منظور الذات
        لا الموضوع؛ يلتقط البُعد الوصفي-الفلسفي للمفهوم.

  # التقييم الأوّلي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الموجودة «ذاتية» مجرَّدة من التشكيل — تحتاج تحديثاً إلى «ذَاتِيَّة»"
      - >
        التعريف العربي «صفة كون الشيء ذاتياً» دائريٌّ: يستعمل «ذاتياً»
        المشتق من نفس الجذر لشرح «ذاتية» — يجب إعادة صياغته
      - >
        تعارض دلالي محتمل: الاسم الإنجليزي «subjectivism» يُحيل عادةً
        إلى المذهب الفلسفي، بينما «the quality of being subjective»
        أقرب إلى «subjectivity»؛ والمعجمان العربيان يُفرّقان بين
        «ذاتية» (الصفة العامة) و«ذاتانية» (المذهب الفلسفي)
      - "لا يوجد أيّ مثال استعمالي على مستوى المجموعة أو اللمّة"
    observations: >
      المجموعة تُمثّل مفهوماً فلسفياً/إبستمولوجياً هو كوْن المعرفة
      أو الحكم نسبياً للذات المُدرِكة لا للموضوع الخارجي. اللمّة
      «ذاتية» شائعة في المصطلحية العربية وثابتة في عدة معاجم موثوقة،
      لكنها تعاني من ازدواج دلالي: فهي تُوظَّف لكلٍّ من subjectivity
      و subjectivism. المورد الحديث (2008) يُميّز بوضوح بين
      «الذاتية» (كون الشيء ذاتياً) و«الذاتانية» (المذهب الفلسفي
      القائل بأن المعرفة ناشئة عن الخبرة الذاتية)؛ وهذا التمييز
      مُعتمَد في سياق هذه المجموعة التي تُدرج «subjectivism» لمّةً
      إنجليزية. التعريف الحالي يحتاج إلى مراجعة لتجنّب الدور وتوضيح
      الجنس والفصل.


