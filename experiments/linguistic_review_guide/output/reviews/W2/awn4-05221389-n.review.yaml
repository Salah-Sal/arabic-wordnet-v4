    # ── مرشح المرحلة ١ ──
    - lemma: "ذَاتَانِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المورد الحديث (2008) يُعرّفها صراحةً بأنها «مذهب فلسفيّ يقول
        بأن المعرفة كلها ناشئة عن الخبرة الذاتيّة» ويُقابلها بـ subjectivism؛
        وهو ما يتطابق مع اللمّة الإنجليزية المعتمدة في AWN4. الاشتقاق
        على وزن فَعَالَانِيَّة مطّرد في العربية للدلالة على المذاهب الفكرية
        (روحانية، مادانية، أخلاقانية). تُميّز هذه اللمّة المذهبَ الفلسفيَّ
        عن مجرد الصفة (ذاتية).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تخصّ المذهبَ الفلسفيَّ المتكامل القائل بنسبية المعرفة إلى الذات
        المُدرِكة وتوقّفها عليها؛ يُستعمل «ذاتاني» للشخص المؤمن بهذا
        المذهب — وهو تمييز أدقّ من «ذاتية» التي تبقى أكثر عمومية.
      actions:
