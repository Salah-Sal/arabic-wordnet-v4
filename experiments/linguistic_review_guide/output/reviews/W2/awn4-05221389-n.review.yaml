    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "شَخْصَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «شخصاني» موثَّق في المعجم الطبي الموحد كصفة فقط بمعنى subjective
        في السياق الطبي (حسيس شخصاني، عرَض شخصاني)؛ أما المصدر الصناعي
        «شخصانية» فغير مُدرَج في أيٍّ من المعاجم بمعنى subjectivism أو
        subjectivity. فضلاً عن ذلك، «شخصاني» في الخطاب النفسي والطبي
        يُحيل إلى الشخص المُعالَج لا إلى المُدرِك، مما يُبعده دلالياً
        عن المفهوم الفلسفي المُراد.

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "نَزْعَةُ الذَّاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        ARABTERM يُسجّل «نزعة ذاتية» (بالصفة) لا «نزعة الذات» (بالإضافة)؛
        وكلتا الصيغتين تفشلان اختبارَ السكّ لأن «نزعة فردية» أو «توجّه ذاتي»
        يُؤدّيان المعنى ذاته — إذ لا ثبات معجمي ولا دلالة اصطلاحية متجمّدة.
        هي وصف حرّ لا مصطلح.


