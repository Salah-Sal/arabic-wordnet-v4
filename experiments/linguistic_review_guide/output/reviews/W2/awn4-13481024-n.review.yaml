stage1_review:
  assessment:
    concerns:
      - لا توجد مشكلات جوهرية، لكن المصطلحات الحالية تفتقر للتشكيل الكامل.
      - يمكن إغناء المجموعة بمصطلحات أكثر تخصصاً مثل "انكماش نقدي" و"تقلص اقتصادي".
    observations: "المجموعة تعبر عن مفهوم الـ Deflation الاقتصادي بشكل صحيح. المصطلح الأساسي 'انكماش' دقيق وشائع، والتعريف الحالي يحتاج صياغة أكثر مهنية لتشمل الجانب النقدي."
  blind_candidates:
    - lemma: "اِنْكِمَاشٌ نَقْدِيٌّ"
      generation_method: tarkib
      justification: "مصطلح متخصص يشير إلى نقص المعروض النقدي الذي يسبب الانكماش."
    - lemma: "اِنْكِمَاشُ الْأَسْعَارِ"
      generation_method: tarkib
      justification: "وصف مباشر للظاهرة المذكورة في التعريف (انخفاض الأسعار)."
    - lemma: "تَقَلُّصٌ اِقْتِصَادِيٌّ"
      generation_method: ishtiqaq
      justification: "مرادف فصيح لـ 'انكماش اقتصادي' يستخدم بكثرة في التقارير الاقتصادية."
    - lemma: "اِنْكِمَاشٌ مَالِيٌّ"
      generation_method: tarkib
      justification: "يستخدم أحياناً كمرادف للانكماش النقدي أو الاقتصادي العام."

stage2_evidence:
  per_lemma:
    - lemma: "انكماش"
      confirm:
        - text: "الانكماش: نقص المتداول من النقود الورقية (مج)"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "الانكماش: نقص في حجم النقد المتداول يفضي إلى انخفاض الأسعار."
          source: "المورد الحديث (2008)"
      expands:
        - text: "تقلص فلز ما عند تبريده بسرعة بعد تسخينه."
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
          addition: "يستخدم المصطلح في سياقات فيزيائية وهندسية بمعنى التقلص الحجمي (Shrinkage)."
    - lemma: "انكماش اقتصادي"
      confirm:
        - text: "recession"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "يرد 'انكماش' كترجمة لـ recession و contraction في السياق الاقتصادي."
    - lemma: "انكماش نقدي"
      confirm:
        - text: "monetary deflation"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
    - lemma: "انكماش الأسعار"
      confirm:
        - text: "deflation of prices"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
    - lemma: "تقلص اقتصادي"
      confirm:
        - text: "deflation"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"

stage3_analysis:
  per_lemma:
    - lemma: "انكماش"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والأكثر شيوعاً للمفهوم في اللغة العربية المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْكِمَاشٌ"
    - lemma: "انكماش اقتصادي"
      decision: confirmed
      decision_reason: "مصطلح مركب يحدد المجال الدقيق للمفهوم (الاقتصاد)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْكِمَاشٌ اِقْتِصَادِيٌّ"
    - lemma: "اِنْكِمَاشٌ نَقْدِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فني دقيق يربط الظاهرة بأسبابها النقدية، وموثق في المعاجم الموحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
