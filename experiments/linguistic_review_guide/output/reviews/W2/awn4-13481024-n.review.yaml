          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "اِنْكِمَاشُ الْأَسْعَارِ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير اصطلاحي يصف النتيجة المباشرة لعملية الانكماش، وموثق معجمياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "اِنْكِمَاشُ الْأَسْعَارِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَقَلُّصٌ اِقْتِصَادِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي وشائع الاستخدام في الأدبيات الاقتصادية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "تَقَلُّصٌ اِقْتِصَادِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "انكماش النشاط الاقتصادي مما يؤدي إلى انخفاض الأسعار"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لكنه مبسط؛ يفضل صياغته بأسلوب معجمي يجمع بين الجانب النقدي والنتائج السعرية."
    authored:
      - type: terminological
        text: "نَقْصٌ فِي النَّشَاطِ الِاقْتِصَادِيِّ أَوْ حَجْمِ النَّقْدِ الْمُتَدَاوَلِ مِمَّا يُفْضِي إِلَى هُبُوطِ الْمُسْتَوَى الْعَامِّ لِلْأَسْعَارِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "نَقْصٌ فِي النَّشَاطِ الِاقْتِصَادِيِّ أَوْ حَجْمِ النَّقْدِ الْمُتَدَاوَلِ مِمَّا يُفْضِي إِلَى هُبُوطِ الْمُسْتَوَى الْعَامِّ لِلْأَسْعَارِ."}
  examples:
    per_lemma:
      - lemma: "اِنْكِمَاشٌ"
        examples:
          - text: "عَانَى الِاقْتِصَادُ مِنَ اِنْكِمَاشٍ حَادٍّ أَدَّى إِلَى تَرَاجُعِ الْقُوَّةِ الشِّرَائِيَّةِ."
            type: usage
      - lemma: "اِنْكِمَاشٌ اِقْتِصَادِيٌّ"
        examples:
          - text: "تَتَخَوَّفُ الدُّوَلُ مِنْ دُخُولِ الِاقْتِصَادِ الْعَالَمِيِّ فِي مَرْحَلَةِ اِنْكِمَاشٍ اِقْتِصَادِيٍّ طَوِيلَةٍ."
            type: usage
      - lemma: "اِنْكِمَاشٌ نَقْدِيٌّ"
        examples:
          - text: "يَلْجَأُ الْمَصْرِفُ الْمَرْكَزِيُّ لِمُحَارَبَةِ التَّضَخُّمِ عَنْ طَرِيقِ فَرْضِ اِنْكِمَاشٍ نَقْدِيٍّ مُنَظَّمٍ."
            type: usage
      - lemma: "اِنْكِمَاشُ الْأَسْعَارِ"
        examples:
          - text: "يُعْتَبَرُ اِنْكِمَاشُ الْأَسْعَارِ ظَاهِرَةً اِقْتِصَادِيَّةً تُؤَدِّي إِلَى تَأْجِيلِ الْمُسْتَهْلِكِينَ لِعَمَلِيَّاتِ الشِّرَاءِ."
            type: usage
      - lemma: "تَقَلُّصٌ اِقْتِصَادِيٌّ"
        examples:
          - text: "أَظْهَرَتِ التَّقَارِيرُ تَقَلُّصاً اِقْتِصَادِيّاً فِي الرُّبْعِ الْأَوَّلِ مِنَ السَّنَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُؤَدِّي الِانْكِمَاشُ إِلَى تَرَاجُعِ الْإِنْتَاجِ وَزِيَادَةِ الْبَطَالَةِ."}

