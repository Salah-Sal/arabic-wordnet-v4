stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي فيه نوع من الدوران باستخدامه لكلمة 'توليد' لتعريف المصطلح نفسه."
    observations: "اللمّات المختارة (توليد، ولادة) صحيحة تماماً وتعبر عن المفهوم من زاويتي القائم بالفعل (توليد) والحدث نفسه (ولادة). المفهوم طبي وتقني في السياق الحديث."
  blind_candidates:
    - lemma: "تَوْلِيد"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من الفعل (ولّد) الذي يعني المساعدة في إخراج الجنين، وهو المصطلح الطبي المعتمد في 'علم التوليد'."
    - lemma: "وِلَادَة"
      generation_method: ishtiqaq
      justification: "المصدر العام لعملية خروج المولود، ويُستخدم في السياقين اللغوي والطبي."
    - lemma: "قِبَالَة"
      generation_method: ishtiqaq
      justification: "تُشير في الأصل إلى حرفة القابلة (التي تولّد النساء)، وتُستخدم أحياناً كمرادف لعلم التوليد أو عملية المساعدة في الولادة."
    - lemma: "إِنْفَاس"
      generation_method: ishtiqaq
      justification: "مصطلح عربي كلاسيكي يُستخدم بمعنى توليد المرأة أو وضعها لمولودها (من الفعل أنفَسَت)."

stage2_evidence:
  per_lemma:
    - lemma: "وِلَادَة"
      confirm:
        - text: "«الوِلاَدَة: childbirth»"
          source: "المعجم الطبي الموحد"
        - text: "«الولادة: عملية الوضع، أي ولادة الجنين.»"
          source: "معجم المصطلحات الطبية (1985)"
        - text: "«الولادة: خروج الوليد والمشيمة.»"
          source: "معجم المصطلحات الطبية (2003)"
    - lemma: "تَوْلِيد"
      confirm:
        - text: "«طِبُّ التَّوليد: obstetrics»"
          source: "المعجم الطبي الموحد"
        - text: "«مختصر تَوليد: obstet. (obstetrics)»"
          source: "المعجم الطبي الموحد"
        - text: "«علم أو فن الولادة، توليد: obstetrics»"
          source: "معجم مصطلحات علم الصحة وجسم الإنسان"
    - lemma: "وَضْع"
      confirm:
        - text: "«الولادة: عملية الوضع.»"
          source: "معجم المصطلحات الطبية (1985)"
        - text: "«وَضَعَتِ الْمَرْأَةُ وَلَدَهَا: أصل واحد يدل على الخفض للحط والوضع.»"
          source: "مقاييس اللغة"
    - lemma: "قِبَالَة"
      expands:
        - text: "«القِبَالَةُ: حرفة القابلة.»"
          source: "المعجم الوسيط"
        - text: "«القِبالة: طِبّ التوليد.»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "توليد"
      decision: confirmed
      decision_reason: "مصطلح مركزي في المجال الطبي العربي يُعبر عن 'الفعل' النشط الذي يقوم به المساعد الطبي لإتمام عملية الولادة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوْلِيد"
    - lemma: "ولادة"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً وعمومية لوصف الحدث من منظور الأم أو الحدث البيولوجي الكلي، وهو مرادف معتمد طبياً لـ delivery."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِلَادَة"
    - lemma: "وَضْع"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح وأصيل وشائع الاستخدام في المؤلفات الطبية واللغوية لوصف فعل الولادة (وضع الحمل)، وغالباً ما يُستخدم لتعريف المصطلحات الأخرى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "وَضْع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "فعل توليد الطفل"
    assessment:
      decision: revise
      reason: "التعريف الحالي غير كافٍ ودائري (يستخدم كلمة توليد لتعريف نفسها)."
    authored:
      - type: terminological
        text: "عَمَلِيَّةُ إِخْرَاجِ الْجَنِينِ وَالْمَشِيمَةِ مِنْ رَحِمِ الْأُمِّ عِنْدَ تَمَامِ الْحَمْلِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "فِعْلُ وَضْعِ الْمَرْأَةِ لِمَوْلُودِهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عَمَلِيَّةُ إِخْرَاجِ الْجَنِينِ وَالْمَشِيمَةِ مِنْ رَحِمِ الْأُمِّ عِنْدَ تَمَامِ الْحَمْلِ."
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "فِعْلُ وَضْعِ الْمَرْأَةِ لِمَوْلُودِهَا."

  examples:
    per_lemma:
      - lemma: "تَوْلِيد"
        examples:
          - text: "أَشْرَفَ الطَّبِيبُ عَلَى عَمَلِيَّةِ تَولِيدِ الْمَرِيضَةِ فِي غُرْفَةِ الْعَمَلِيَّاتِ."
            type: usage
      - lemma: "وِلَادَة"
        examples:
          - text: "تَمَّتْ وِلَادَةُ الطِّفْلِ بِشَكْلٍ طَبِيعِيٍّ دُونَ حَاجَةٍ لِتَدَخُّلٍ جِرَاحِيٍّ."
            type: usage
      - lemma: "وَضْع"
        examples:
          - text: "تُعَانِي الْمَرْأَةُ مِنَ الْمَخَاضِ حِينَ يَقْتَرِبُ مَوْعِدُ وَضْعِ الْحَمْلِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُعَدُّ عَمَلِيَّةُ التَّوْلِيدِ لَحْظَةً حَاسِمَةً فِي الرِّعَايَةِ الصِّحِّيَّةِ لِلْأُمِّ وَالْمَوْلُودِ."

