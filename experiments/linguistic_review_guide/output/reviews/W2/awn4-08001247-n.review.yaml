stage4_content:
  definition:
    current: "مجموعة من 13 مخطوطة بردية قديمة مترجمة من اليونانية إلى القبطية اكتشفها فلاحون قرب مدينة نجع حمادي في عام 1945؛ تحتوي على نصوص غنوصية هامة"
    assessment:
      decision: retain
      reason: "التعريف دقيق وشامل لجميع جوانب الاكتشاف (العدد، المادة، اللغة، التاريخ، المكان، المحتوى)."
  examples:
    per_lemma:
      - lemma: "مَخْطُوطَات نَجْع حَمَّادِي"
        examples:
          - text: "تُعدّ مَخْطُوطَات نَجْع حَمَّادِي مَصْدَراً رَئِيسِيّاً لِدِرَاسَةِ الفِكْرِ الغُنُوصِيِّ القَدِيمِ."
            type: usage
      - lemma: "مَكْتَبَة نَجْع حَمَّادِي"
        examples:
          - text: "اكْتُشِفَتْ مَكْتَبَةُ نَجْع حَمَّادِي بِمَحْضِ الصُّدْفَةِ فِي أَرْبَعِينِيَّاتِ القَرْنِ العِشْرِينَ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-08001247-n"
          text: "أَلقت مَخْطُوطَات نَجْع حَمَّادِي ضَوْءاً جَدِيداً عَلَى تَارِيخِ المَسِيحِيَّةِ البَاكِرَةِ."

