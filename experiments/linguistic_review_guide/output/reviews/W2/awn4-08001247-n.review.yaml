stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية تفتقر إلى التشكيل الكامل."
    observations: "المصطلحات الحالية دقيقة وتتبع التسمية العالمية المتعارف عليها لهذه المجموعة من المخطوطات. المفهوم محدد تاريخياً وجغرافياً، والترجمة العربية لـ Library بـ 'مكتبة' مقبولة اصطلاحاً في هذا السياق الأثري."
  blind_candidates:
    - lemma: "مَخْطُوطَات نَجْع حَمَّادِي"
      generation_method: tarkib
      justification: "الاسم الأشيع والأكثر دقة لوصف المخطوطات المكتشفة في تلك المنطقة، وهو تركيب إضافي وصفي."
    - lemma: "مَكْتَبَة نَجْع حَمَّادِي"
      generation_method: tarkib
      justification: "الترجمة الاصطلاحية المعتمدة في الأوساط الأكاديمية للمصطلح الإنجليزي (Nag Hammadi Library)."
    - lemma: "نُصُوص نَجْع حَمَّادِي"
      generation_method: tarkib
      justification: "يستخدم للإشارة إلى المتن النصي والمحتوى الفكري للمخطوطات."
    - lemma: "مَدْوَنَة نَجْع حَمَّادِي"
      generation_method: tarkib
      justification: "استخدام 'مدونة' للإشارة إلى مجموع النصوص المترابطة تاريخياً وموضوعياً."

