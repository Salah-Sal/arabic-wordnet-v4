stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (لغة بلاغية، لغة خطابية) مركّبات وصفية حرّة لا مصطلحات مسكوكة ثابتة؛ يمكن إبدال الصفة بمرادف (لغة فصيحة، لغة إقناعية) ويبقى التعبير صالحاً"
      - "التعريف العربي الحالي يبدأ بكلمة «لغة» واللمّتان تبدآن بنفس الكلمة — دوران جزئي"
      - "لا يوجد ربط بـ ILI (ili: null) مما يُصعّب التحقق من المقابل الإنجليزي الدقيق"
    observations: "المفهوم المقصود هو البلاغة بوصفها نمطاً من الكلام يهدف إلى الإقناع والتأثير، لا بوصفها علماً أو ملكةً. في التراث العربي، مصطلح «البلاغة» يشمل هذا المعنى لكنه أوسع (يطلق على العلم والملكة والكلام). و«الخطابة» عند المناطقة تعني القياس المؤلف من المظنونات والمقبولات بغرض الإقناع. كلا المصطلحين المفردين أقرب للمفهوم من المركبات الوصفية الحرة."

  blind_candidates:
    - lemma: "بَلَاغَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ب ل غ) على وزن فَعَالَة، معناها عند البلاغيين مطابقة الكلام لمقتضى الحال مع فصاحته، وتتضمن معنى التأثير والإقناع بالبيان الحسن"
    - lemma: "خَطَابَة"
      generation_method: ishtiqaq
      justification: "من الجذر (خ ط ب) على وزن فَعَالَة، تدل عند المناطقة على القياس المؤلف من المقبولات والمظنونات بغرض الإقناع والترغيب، وفي الأدب العربي على فن مخاطبة الجماهير والتأثير في مشاعرهم"
    - lemma: "أُسْلُوب إِقْنَاعِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «أسلوب» و«إقناعي» (نسبة إلى الإقناع)، يدل على طريقة في الكلام غايتها الإقناع والتأثير"
    - lemma: "كَلَام بَلِيغ"
      generation_method: tarkib
      justification: "مركب وصفي من «كلام» و«بليغ» (صفة مشبّهة من بلغ)، يدل على الكلام الذي يبلغ أقصى التأثير في المتلقي"


