# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06111723-n (quasiparticle)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «شبه جسيم» بدون تشكيل"
      - "المجموعة تحتوي لمّة واحدة فقط، ولا بديل مرادف"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي مع بعض الركاكة في الصياغة"
    observations: "المفهوم فيزيائي متخصص في فيزياء المادة المكثفة. مصطلح «شبه جسيم» مركب إضافي يتّبع نمطاً إنتاجياً شائعاً في الاصطلاح العلمي العربي حيث تُستخدم «شبه» كسابقة بمعنى quasi- (شبه موصّل، شبه عازل، شبه ساكن...). المفهوم ليس له مقابل تراثي لأنه حديث النشأة في الفيزياء الكمية."

  blind_candidates:
    - lemma: "شِبْهُ جُسَيْم"
      generation_method: tarkib
      justification: "مركب إضافي من «شِبْه» (ما يماثل الشيء) و«جُسَيْم» (تصغير جسم، يُستخدم في الفيزياء بمعنى particle). يتّبع النمط الإنتاجي المعتمد في المصطلحات العلمية العربية: شبه + اسم."
    - lemma: "شِبْهُ الجُسَيْم"
      generation_method: tarkib
      justification: "صيغة إضافية بديلة بتعريف المضاف إليه، تُستخدم أحياناً في السياقات العلمية العربية للتوضيح والتخصيص."
    - lemma: "جُسَيْمَة ظاهِرِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «جُسَيْمَة» (مؤنث تصغير جسم) و«ظاهرية» (ما يبدو كذلك دون أن يكون حقيقياً). محاولة لتمييز المصطلح عن الجسيم الحقيقي."
    - lemma: "كُوَازِيجُسَيْم"
      generation_method: taarib
      justification: "تعريب للسابقة الإنجليزية quasi- ملتصقة بـ«جسيم». لا يُلجأ إليه إلا عند عدم وجود بديل عربي صالح، وهو غير مطلوب هنا."


stage2_evidence:
  per_lemma:
    - lemma: "شِبْهُ جُسَيْم"
      confirm:
        - text: "«جُسيْم» = particle"
          source: "المعجم الموحد لمصطلحات الفيزياء (ARABTERM)"
        - text: "«شبه» تُستخدم كسابقة بمعنى quasi- في عشرات المصطلحات: شبه موصّل (quasi conductor)، شبه ساكن (quasi-static)، شبه عازل (quasi dielectric)، إليكترون شبه حر (quasi-free electron)"
          source: "ARABTERM — مصادر متعددة (الفيزياء، الكهرباء، الكيمياء)"
      expands:
        - text: "«(جَسَمَ) الْجِيمُ وَالسِّينُ وَالْمِيمُ يَدُلُّ عَلَى تَجَمُّعِ الشَّيْءِ. فَالْجِسْمُ كُلُّ شَخْصٍ مُدْرِكٍ. كَذَا قَالَ ابْنُ دُرَيْدٍ. وَالْجَسِيمُ: الْعَظِيمُ الْجِسْمِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «جسم» أصله تجمّع الشيء، والجُسَيْم تصغيره يدلّ على الكيان المادي الصغير"
        - text: "«(شَبَهَ) الشِّينُ وَالْبَاءُ وَالْهَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَشَابُهِ الشَّيْءِ وَتَشَاكُلِهِ لَوْنًا وَوَصْفًا. يُقَالُ شِبْهٌ وَشَبَهٌ وَشَبِيهٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «شبه» يدلّ على المشابهة، وهو ما يناسب معنى quasi- أي ما يُشبه الشيء دون أن يكونه تماماً"
        - text: "«جسيم — تصغير جسم»"
          source: "المعجم الموحد لمصطلحات الكيمياء (ARABTERM)"
          addition: "تأكيد أن جُسَيْم صيغة تصغير مصطلحية مستقرة"

    - lemma: "شِبْهُ الجُسَيْم"
      confirm:
        - text: "«شبه النقد» (quasi-money)، «شبه الاحتكار» (quasi-monopoly)، «شبه الريع» (quasi-rent)"
          source: "المعجم الموحد لمصطلحات الاقتصاد (ARABTERM)"
      expands:
        - text: "«كاشف شبه الذروة» (quasi-peak detector)، «جهاز قياس الجهد لشبه الذروة» (quasi-peak voltmeter)"
          source: "موسوعة الكهرباء IEC 60050 (ARABTERM)"
          addition: "صيغة «شبه ال-» مع تعريف المضاف إليه مستخدمة في بعض المصطلحات العلمية لكنها أقل شيوعاً من صيغة الإضافة المباشرة"

    - lemma: "جُسَيْمَة ظاهِرِيَّة"
      evidence_status: "no_material_found"

    - lemma: "كُوَازِيجُسَيْم"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "شِبْهُ جُسَيْم"
      decision: confirmed
      decision_reason: "مصطلح مركب إضافي يتبع النمط الإنتاجي المعتمد في الاصطلاح العلمي العربي (شبه + اسم). الأدلة المعجمية تُثبت استقرار كلّ من مكوّنيه في المعاجم التقنية العربية، والنمط مستخدم في عشرات المصطلحات. التشكيل الكامل مطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شِبْهُ جُسَيْم"

    - lemma: "شِبْهُ الجُسَيْم"
      source: stage1
      decision: removed
      decision_reason: "صيغة «شبه ال-» موجودة في بعض المصطلحات الاقتصادية (شبه النقد، شبه الاحتكار) لكنها أقل شيوعاً في المصطلحات الفيزيائية حيث تسود الإضافة المباشرة بدون أل. إضافتها ستُحدث تكراراً دون فائدة دلالية."

    - lemma: "جُسَيْمَة ظاهِرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استخدام هذا المركب الوصفي. كلمة «ظاهرية» لا تؤدي معنى quasi- بدقة (ظاهري = apparent، وليس شبه). كما أن تأنيث «جسيم» إلى «جسيمة» غير مألوف في الاصطلاح الفيزيائي."

    - lemma: "كُوَازِيجُسَيْم"
      source: stage1
      decision: removed
      decision_reason: "تعريب غير مطلوب لوجود المقابل العربي الراسخ «شبه جسيم». لم يُعثر على أي دليل معجمي على استخدامه، ولا يخضع لقواعد الاشتقاق العربي."


stage4_content:
  definition:
    current: "كم من الطاقة (في شبكة بلورية أو نظام آخر) له موضع وزخم ويمكن اعتباره جسيماً من بعض النواحي"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية للإنجليزي مع ركاكة في التركيب. يحتاج إعادة صياغة بأسلوب المعجم الوسيط مع تحسين البنية المصطلحية."
    authored:
      - type: terminological
        text: "كَمٌّ من الطاقة في شبكة بلّوريّة أو منظومة فيزيائية أخرى، يتّصف بموضع وزخم محدَّدين، ويسلك سلوك الجسيمات في بعض الظواهر."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مفهوم في فيزياء المادّة المكثَّفة يُطلق على إثارة جماعية في منظومة كمّيّة تتصرّف كجسيم مستقلّ له موضع وزخم وطاقة قابلة للقياس. من أمثلته الفونون (كمّ اهتزاز الشبكة البلّوريّة) والبولارون والمغنون."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "كَمٌّ من الطاقة في شبكة بلّوريّة أو منظومة فيزيائية أخرى، يتّصف بموضع وزخم محدَّدين، ويسلك سلوك الجسيمات في بعض الظواهر."

  examples:
    per_lemma:
      - lemma: "شِبْهُ جُسَيْم"
        examples:
          - text: "يُعَدُّ الفونون شِبْهَ جُسَيْمٍ يصف كمّ الاهتزاز في الشبكة البلّوريّة للمادّة الصلبة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ الفونون شِبْهَ جُسَيْمٍ يصف كمّ الاهتزاز في الشبكة البلّوريّة للمادّة الصلبة."


