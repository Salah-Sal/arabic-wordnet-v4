# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'صحة' مكتوبة بدون تشكيل كامل؛ يجب إضافة التشكيل: صِحَّة"
      - "لمّة 'صواب' مكتوبة بدون تشكيل كامل؛ يجب إضافة التشكيل: صَوَاب"
      - "صِحَّة متعددة الدلالات: المعنى الأوّل هو الصحة البدنية (health)، والمعنى الثاني هو صحة الحكم/القول (correctness/validity)؛ قد يُفضي الاشتراك اللفظي إلى لبس خارج السياق"
    observations: >
      المجموعة تمثّل المفهوم المجرد «المطابقة للواقع أو الحقيقة» وهو من صنف الصفات الجوهرية
      (تصنيف فوقي: جَوْدَة)، وهو تصنيف مقبول لغوياً. اللمّتان الموجودتان (صحة وصواب) كلتاهما
      راسختان في التراث والاستعمال المعاصر، وقد وردتا في المعاجم الكلاسيكية والحديثة بدلالة
      الصواب والمطابقة للحقيقة. غير أن صِحَّة تحتاج إلى سياق لتمييزها عن الدلالة الصحية،
      في حين يكاد صَوَاب يكون أحادي الدلالة في هذا المعنى. التعريف الحالي مقبول لكنه يبدو
      كترجمة حرفية للإنجليزية؛ يُستحسن صياغته بأسلوب المعجم العربي.

  blind_candidates:
    - lemma: "سَدَاد"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (سدد) على وزن فَعَال، يدل في أصل اللغة على القصد والاستقامة في القول
        والفعل؛ ورد في المعاجم الكلاسيكية مرادفاً للصواب: «السداد: الاستقامة والقصد والصواب
        من القول والفعل». وزن فَعَال مناسب للمصادر الدالة على الجودة المجردة.

    - lemma: "إِصَابَة"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (صوب) على وزن إِفَالة، بمعنى الإتيان بالحق ومطابقة الأمر لوجهه؛
        يُستخدم في الفصحى: «أصاب في رأيه» أي وافق الحق. الإصابة هي فعل المطابقة للواقع،
        فهي قريبة الدلالة من معنى المجموعة.

    - lemma: "وِفَاق"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (وفق) على وزن فِعَال، يدل على الملاءمة والاتساق؛ يمكن أن يُستخدم
        بمعنى توافق القول مع الواقع، وهو قريب من دلالة «المطابقة للحقيقة».

    - lemma: "اسْتِقَامَة"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن اسْتِفَالة من الجذر (قوم)، يدل على الاستواء والانتصاب في معناه الحسي،
        واستعير للصواب والرشد في المعاني: «استقامة الرأي» = صوابه. يُستخدم في سياق
        الصحة العقلية والمنهجية للقول والحكم.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "صِحَّة"
      confirm:
        - text: "«وتطلق أيضاً على الثبوت وعلى مطابقة الشيء للواقع»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (hawramani، entry 820018)"
        - text: "«صِحَّة» — ترجمة: correctness (مجال: تقنية المعلومات)؛ التعريف: «درجةُ خُلوِّ النظام أو المكوِّن من الأعطال في توصيفه وتصميمه وتَنْجيزه»"
          source: "معجم مصطلحات تقنية المعلومات (arabterm، entry 535105)"
        - text: "«صِحَّة» — ترجمة: exactness (مجال: الفلسفة وعلم النفس)"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (arabterm، entry 489621)"
        - text: "«موافقة الفعل ذي الوجهين وقوعاً الشرعَ»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani، entry 814219) — تفيد صحة العمل/القول من حيث مطابقته للمعيار"
      expands:
        - text: "«(الصِّحَّة) فِي الْبدن حَالَة طبيعية تجْرِي أَفعاله مَعهَا على المجرى الطبيعي»"
          source: "المعجم الوسيط (hawramani، entry 876530)"
          addition: "يكشف عن تعدد دلالات صِحَّة؛ المعنى الصحي هو الأسبق والأشيع، وهذا يستلزم التنبيه على أن استخدامها في هذه المجموعة ثانويٌّ وسياقيٌّ"
        - text: "«الصّحّة:[في الانكليزية] Health، exactitude، Well-founded، validity [في الفرنسية] Sante، exactitude، bien-fonde، validite»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (hawramani، entry 820018)"
          addition: "تؤكد تعدد الدلالات الاصطلاحية لصِحَّة: الصحة البدنية والمطابقة والثبوت والصلاحية"

    - lemma: "صَوَاب"
      confirm:
        - text: "«الصَّوابُ فِي الْقَوْلِ وَالْفِعْلِ، كَأَنَّهُ أَمْرٌ نَازِلٌ مُسْتَقِرٌّ قَرَارَهُ. وَهُوَ خِلَافُ الْخَطَأِ»"
          source: "مقاييس اللغة لابن فارس (entry 987374)"
        - text: "«الصواب: لغةً السداد، واصطلاحاً: هو الأمر الثابت الذي لا يسوغ إنكاره، وقيل: الصواب: إصابة الحق»"
          source: "كتاب التعريفات للشريف الجرجاني (hawramani، entry 795181)"
        - text: "«الصواب: خلاف الخطأ، وهما يستعملان في المجتهدات»"
          source: "كتاب التعريفات للشريف الجرجاني (hawramani، entry 795182)"
        - text: "«ضدُّ الخطأ. السَّدادُ فِي القول والفِعْلِ ونحوهما»"
          source: "المعجم الكبير (ocr، entry 57316)"
        - text: "«(الصَّوَاب) السداد وَالْحق»"
          source: "المعجم الوسيط (hawramani، entry 876798)"
        - text: "«صَوَاب» — ترجمة: truth (مجال: الرياضيات والفلك)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (arabterm، entry 418003)"

    - lemma: "سَدَاد"
      source: stage1
      confirm:
        - text: "«(السداد) الاسْتقَامَة وَالْقَصْد وَالصَّوَاب من القَوْل وَالْفِعْل»"
          source: "المعجم الوسيط (hawramani، entry 875199)"
        - text: "«الصَّوابُ من القول والفِعْلِ»"
          source: "المعجم الكبير (ocr، entry 45129)"
        - text: "«السَّدِيدُ، ذُو السَّدَادِ، أَيِ الِاسْتِقَامَةِ; كَأَنَّهُ لَا ثُلْمَةَ فِيهِ. وَالصَّوَابُ أَيْضًا سَداد»"
          source: "مقاييس اللغة لابن فارس — باب السِّينُ وَالدَّالُ (entry 986917)"
      contradicts:
        - text: "«سداد الدين — مثال: قام بسداد دينه — أجاز مجمع اللغة المصري هذا الاستعمال»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (hawramani، entry 853422)"
          conflict: "أفضت الاستعارة المالية لكلمة سداد إلى غلبة الاستخدام الحديث (سداد الدين، سداد القرض) مما يُوجد تضارباً دلالياً مع إرادة معنى الصواب من كلمة سداد وحدها"
        - text: "«سداد» — ترجمة: paying off (مجال: التجارة والمحاسبة)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (arabterm، entry 408673)"
          conflict: "تُثبت هيمنة الدلالة المالية في المصطلحية العربية الحديثة"

    - lemma: "إِصَابَة"
      source: stage1
      contradicts:
        - text: "«جرح أو أذى يصيب الجسم بسبب قوة خارجية»"
          source: "معجم المصطلحات الطبية (hawramani، entry 742216)"
          conflict: "تحوّلت إصابة في المصطلحية المعاصرة إلى مصطلح طبي حصري بمعنى injury/infestation؛ لم يرد في المعاجم أي توثيق لإصابة بمعنى المطابقة للواقع بوصفها اسماً مستقلاً"
        - text: "«injury» و«affection; injury» و«infestation»"
          source: "معاجم ARABTERM الطبية والبيطرية والزراعية (entries 595113، 468281، 756780)"
          conflict: "تُجمع على دلالة الأذى الجسدي ولا تشير إلى معنى الصواب"

    - lemma: "وِفَاق"
      source: stage1
      contradicts:
        - text: "«من (وفق) الملاءمة بين الشيئين، والاجتماع على أمر واحد»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani، entry 950254)"
          conflict: "الوفاق يعني الاتفاق والملاءمة بين طرفين أو أمرين، لا المطابقة بين القول والواقع؛ الدلالة اجتماعية/قانونية لا إبستيمولوجية"
        - text: "«في القانون الدولي: اصطلاح يطلق على مختلف الاتفاقات الدولية»"
          source: "المعجم الوسيط (hawramani، entry 887692)"
          conflict: "الدلالة القانونية الحديثة تصرف وفاق نحو معنى الاتفاقية والتحالف لا الصواب"

    - lemma: "اسْتِقَامَة"
      source: stage1
      expands:
        - text: "«الاستقامة: كون الخط بحيث تنطبق أجزاؤه المفروضة بعضها على بعض؛ وعرفاً: استقامة الظاهر مع الخلق والباطن مع الحق»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani، entry 812990)"
          addition: "الاستقامة تُفيد الصواب المسلكي والأخلاقي لا المطابقة الإبستيمولوجية للواقع"
        - text: "«استقامة» — ترجمة: rectitude (مجال: الفلسفة وعلم النفس)"
          source: "مسرد الفلسفة وعلم النفس (arabterm، entry 490256)"
          addition: "rectitude = الاستقامة الأخلاقية، وليست correctness = المطابقة للواقع"
      contradicts:
        - text: "«كون الخط بحيث تنطبق أجزاؤه المفروضة بعضها على بعض»"
          source: "كتاب التعريفات للشريف الجرجاني (hawramani، entry 794571)"
          conflict: "الدلالة الهندسية (الخط المستقيم) والمسلكية (ملازمة الصراط المستقيم) لا تُغطّيان معنى الصواب الفكري/الواقعي المقصود في هذه المجموعة"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "صِحَّة"
      decision: confirmed
      decision_reason: >
        صِحَّة راسخة في التراث العربي ومعتمدة في الاستخدام المعاصر بمعنى صحة الحكم والقول
        والمعادلة والخبر (conformity, validity, exactness). وثّقت المعاجم الكلاسيكية
        (التهانوي، المناوي) ومعاجم ARABTERM للفلسفة وتقنية المعلومات هذه الدلالة صراحةً.
        تعدد الدلالات مع الصحة البدنية لا يُخرجها من هذه المجموعة لأن السياق يُزيل اللبس.
        تحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      loan_check:
        type: native
        note: "عربية أصيلة من جذر صحح"
      morphological_fit: "مصدر صِحَّة (فِعْلة) من صَحَّ يَصِحُّ — الوزن مناسب للمصادر الدالة على الأحوال والصفات"
      nuance_differentiation: >
        صِحَّة تُشير إلى انتفاء الخلل المنطقي والشرعي والتقني في الحكم أو القول؛ تُستخدم
        في سياقات منطقية وفقهية وتقنية (صحة القياس، صحة العقد، صحة البرنامج)؛ هي أكثر
        شيوعاً في الاستخدام المعاصر وتحمل نبرة تقنية/منهجية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صِحَّة"

    - lemma: "صَوَاب"
      decision: confirmed
      decision_reason: >
        صَوَاب شبه أحادي الدلالة في هذا المعنى: ضد الخطأ، والسداد في القول والفعل.
        دعمه مقاييس اللغة لابن فارس والجرجاني والمعجم الكبير والمعجم الوسيط بلا تردد.
        لا يحتمل دلالات أخرى تُشوّش معنى المجموعة. يحتاج إلى إضافة التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
        type: native
        note: "عربية أصيلة من جذر صوب"
      morphological_fit: "مصدر صَوَاب (فَعَال) من صَابَ — الوزن مناسب للمصادر الدالة على النتيجة والحال"
      nuance_differentiation: >
        صَوَاب يُستخدم في مقابل الخطأ تحديداً، وينحو نحو التقييم المنهجي والأخلاقي؛
        أصله الدلالي عند ابن فارس من «النزول والاستقرار في مكانه» أي أمر ثابت راسخ
        لا يُنكر — يُفيد إصابة الحق وبلوغ الغاية الصحيحة، وهو أوسع استخداماً في الخطاب
        الديني والفقهي والتقييمي («قال صواباً»، «أصاب الصواب»).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَوَاب"

    - lemma: "سَدَاد"
      source: stage1
      decision: removed
      decision_reason: >
        سَدَاد بمعنى الصواب والاستقامة في القول والفعل موثَّق توثيقاً كلاسيكياً قوياً
        (المعجم الكبير، الوسيط، مقاييس اللغة). غير أن الاستخدام الحديث أفضى إلى هيمنة
        شبه تامة للدلالة المالية (سداد الدين، سداد القرض) حتى إن معجم الصواب اللغوي
        يُثبّت هذا الاستخدام ويُجيزه. إضافة سداد وحيداً إلى هذه المجموعة بمعنى الصواب
        سيوقع القارئ المعاصر في لبس. المجموعة مكتفية بصِحَّة وصَوَاب.
      evidence_assessment:
        case: mixed

    - lemma: "إِصَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        إِصَابَة تحوّلت في المصطلحية المعاصرة إلى مصطلح طبي وأمني حصري بمعنى الأذى
        الجسدي (injury/infestation). لم يرد في أي معجم أن إصابة بوصفها اسماً مستقلاً
        تعني المطابقة للواقع؛ فعل «أصاب» يفيد الصواب لكن مصدره «إصابة» رسّخ معناه
        الطبي. اختبار الاستبدال يُخفق: «الإصابة للواقع» ≠ «المطابقة للواقع».
      evidence_assessment:
        case: contradicts_only

    - lemma: "وِفَاق"
      source: stage1
      decision: removed
      decision_reason: >
        وِفَاق يعني الملاءمة والاتفاق بين طرفين (وفاق بين شخصين)، وهو في القانون الدولي
        يعني الاتفاقية (entente). دلالته علاقية/اجتماعية لا إبستيمولوجية؛ لا يُفيد المطابقة
        بين قول وواقع، بل يُفيد التوافق بين طرفين. مختلف جوهرياً عن معنى المجموعة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "اسْتِقَامَة"
      source: stage1
      decision: removed
      decision_reason: >
        اسْتِقَامَة تدور بين المعنى الهندسي (الخط المستقيم) والمعنى الأخلاقي/الروحي
        (ملازمة الصراط، الوفاء بالعهود). ما تُترجمه ARABTERM هو rectitude لا correctness.
        الصواب الفكري وحده لا يُعبَّر عنه باستقامة في الاستخدام العربي المعجمي؛
        استخدامها في المجموعة سيُحدث خلطاً مع معنى الاستقامة الأخلاقية.
      evidence_assessment:
        case: mixed


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
