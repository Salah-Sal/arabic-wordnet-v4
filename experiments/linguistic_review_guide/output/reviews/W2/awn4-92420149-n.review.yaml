          source: "المَكنَز الزراعي AGROVOC (arabterm)"
          addition: >
            يؤكد أن «البرتغالية» عند الإطلاق تحيل إلى اللغة لا إلى الهوية أو الصفة
            الجوهرية، مما يُرجّح الخلط الدلالي لو استُعملت وحدها.

    - lemma: "السِّمَةُ الْبُرْتُغَالِيَّةُ"
