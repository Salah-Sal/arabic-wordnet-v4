      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "الطَّابَعُ الْبُرْتُغَالِيُّ"
      decision: confirmed
      decision_reason: >
        اللمّة مركب وصفي (tarkib wasfi) يؤدّي المفهوم المطلوب بدقة: «الطابع» مُعجَّم
        بمعنى «الخليقة والسجية الجوهرية» و«العلامة المميزة»، و«البرتغالي» نسبة محددة.
        رغم أن المركب لم يُسجَّل في المعاجم وحدةً ثابتة — وهذا مقبول في هذا النوع من
        الصفات الهوياتية التي تفتقر إليها العربية بطبيعة الحال — فهو الخيار الأوفر
        دلالةً وأكثر ملاءمةً مقارنةً بالبدائل المتاحة. اللمّة بحاجة إلى إضافة التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ «الطابع» يحيل إلى الأثر الجوهري المنطبع المميِّز
        (الخليقة والسجية) في حين أن بدائل مثل «السمة» تبقى على مستوى الخاصية السطحية،
        و«الهوية» تتجاوز إلى الوعي الانتمائي الذاتي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطَّابَعُ الْبُرْتُغَالِيُّ"

    - lemma: "الْبُرْتُغَالِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن المصدر الصناعي (-يَّة) منهجٌ اشتقاقي مشروع في العربية، إلا أن «البرتغالية»
        في الاستعمال المعجمي الراسخ تحيل أولاً وقبل كل شيء إلى اللغة البرتغالية،
        كما يثبته المورد الحديث ومعاجم أخرى. استعمالها بمعنى «صفة كون الشيء برتغالياً»
        يُفضي إلى اشتراك لفظي مُلبِّس ينبغي تجنّبه. لذا تُستبعَد من المجموعة.

    - lemma: "السِّمَةُ الْبُرْتُغَالِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود لهذا المركب في المعاجم. كذلك فإن اختبار الاستبدال يكشف أنه وصف حر
        لا مصطلح مسكوك: «السمة الفرنسية / الإسبانية / الإيطالية» كلها صالحة بالقدر
        ذاته، مما ينفي التثبيت المعجمي. يُستبعد.

    - lemma: "الْهُوِيَّةُ الْبُرْتُغَالِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي للمركب. يفيد «الهوية» دلالةً أوسع (الوعي الانتمائي الكلّي)
        مما يُعيد التصوير المفاهيمي للمجموعة إلى ما هو أشمل من «كون الشيء برتغالياً».
        اختبار الاستبدال يؤكد أنه وصف حرّ. يُستبعد.


