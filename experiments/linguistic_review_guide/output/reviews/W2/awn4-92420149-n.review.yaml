# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «الطابع البرتغالي» خالية من التشكيل"
      - "التعريف الحالي ترجمةٌ حرفيّةٌ عن الإنجليزية (calque)، لا يتبع أسلوب المعجم الوسيط"
      - "ILI: null — المجموعة غير مرتبطة بـ Princeton WordNet"
      - "المفهوم (Portugueseness) ذو طابع غربي وافد ليس له مقابل عربيٌّ اشتقاقيٌّ صافٍ"
      - "المجموعة تحوي لمّةً واحدةً فحسب، مما يُضعف التعدّد الترادفي"
    observations: >
      المجموعة تمثّل مفهوماً هوياتياً مجرَّداً هو «كون الشيء برتغالياً» (Portugueseness)،
      وهو نظير مفاهيم من قبيل «الفرنسية» و«العروبة» وما إليها. في العربية لا يوجد جذر
      اشتقاقي أصيل يؤدي هذه الدلالة، إذ إن «برتغال» اسم علم أعجمي معرَّب. اللمّة الموجودة
      «الطابع البرتغالي» مركبٌ وصفيٌّ تركيبيٌّ (tarkib wasfi) يصف هذا المفهوم وصفاً مقبولاً،
      لكنه غير مسكوك في معجم بوصفه وحدةً ثابتة. يُشار كذلك إلى أن التعريف الحالي
      «الجودة أو الحالة لكون الشيء برتغالياً» يُرجم الإنجليزية ترجمةً آليّة ولا يحاكي
      أسلوب المعجم الوسيط القائم على الجنس القريب والفصل النوعي.

  blind_candidates:
    - lemma: "الْبُرْتُغَالِيَّةُ"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مشتق بإضافة (-يَّة) إلى الصفة النسبية «برتغالي»، على نمط «العروبة»
        من «عربي» و«الفارسية» من «فارسي». يدلّ مباشرةً على «صفة كون الشيء برتغالياً».
        خطر المزاحمة الدلالية مع «اللغة البرتغالية» وارد لكن السياق يُزيل الالتباس.

    - lemma: "الطَّابَعُ الْبُرْتُغَالِيُّ"
      generation_method: tarkib
      justification: >
        مركب وصفي (tarkib wasfi) يجمع «الطابع» (الخلق الغالب / السجية الجوهرية)
        و«البرتغالي» (المنسوب إلى البرتغال). يؤدّي معنى «ما يتّسم به الشيء من
        خصائص جوهرية تجعله برتغالياً». الطابع مُعجَّم في الوسيط والكبير بمعنى
        الخليقة والسجية، مما يجعله جنساً دلالياً ملائماً.

    - lemma: "السِّمَةُ الْبُرْتُغَالِيَّةُ"
      generation_method: tarkib
      justification: >
        مركب وصفي يستخدم «السمة» (الخاصيّة المميزة) مقابل «الطابع». يُركّز على
        البُعد المميِّز للمفهوم أكثر من التركيز على الطبيعة الجوهرية. غير أنه أشيع
        في السياقات الوصفية التحليلية أكثر من المعجمية.

    - lemma: "الْهُوِيَّةُ الْبُرْتُغَالِيَّةُ"
      generation_method: tarkib
      justification: >
        مركب وصفي يعكس البعد الهوياتي التراكمي (cultural identity) لما يعنيه كون
        الشيء برتغالياً. «الهوية» أعمق دلالةً من «الطابع» إذ تشمل الانتماء والوعي
        والموروث الحضاري، لكنها أوسع من الدلالة المطلوبة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
