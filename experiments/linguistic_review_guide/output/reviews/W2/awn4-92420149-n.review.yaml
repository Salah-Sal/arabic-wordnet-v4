          source: "المعجم الوسيط (Al_Waseet، ocr)"
        - text: "«الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ»"
          source: "المعجم الكبير (Al_Mujam_Al_Kabeer، ocr)"
        - text: "«العَلَامَةُ الْمُمَيِّزَةُ»"
          source: "المعجم الكبير (Al_Mujam_Al_Kabeer، ocr)"
        - text: "«الطبيعة والقائم بأعمال الطابعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
        - text: "«(1) البرتغاليّ: أحد أبناء البرتغال (2) اللغة البرتغالية (3) برتغاليّ.»"
          source: "المورد الحديث 2008 (arabterm)"
        - text: "«Portugal»"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC (arabterm)"
      expands:
