          addition: >
            يدل على أن «الطابع» استُعمل أيضاً بمعنى النغمة الصوتية المميزة (timbre)
            في الموسيقى، مما يعزز دلالته على الخصيصة المميزة الجوهرية.
        - text: "«الشكل أو الهندسة المختلفة على السطوح الطرية من أثر تلامس الأجسام لها» — translation_en: impression"
          source: "المعجم الموحد لمصطلحات الجيولوجيا 2000 (arabterm)"
          addition: >
            توسيع دلالي يُظهر أن «الطابع» يستعمل بمعنى الأثر المطبوع والانطباع،
            مما يدعم صلاحيته للتعبير عن السمة الجوهرية المنطبعة.

    - lemma: "الْبُرْتُغَالِيَّةُ"
      contradicts:
        - text: "«(1) البرتغاليّ: أحد أبناء البرتغال (2) اللغة البرتغالية (3) برتغاليّ.»"
          source: "المورد الحديث 2008 (arabterm)"
          conflict: >
            «البرتغالية» في الاستعمال المعجمي الشائع تحيل إلى اللغة البرتغالية لا إلى
            الصفة المجردة «كون الشيء برتغالياً». المصدر الصناعي وإن كان مشروعاً صرفياً
            إلا أنه يصطدم بهذا الاستعمال الراسخ.
      expands:
