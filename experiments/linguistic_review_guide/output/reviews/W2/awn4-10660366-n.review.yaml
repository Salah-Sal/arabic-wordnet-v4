# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────
stage1_review:
  assessment:
    concerns:
      - "مُتَمَدِّد مُشتَرَكٌ لفظياً مع السياقات العلمية والتقنية (التمدد الحراري، الحجمي، الزمني)، مما قد يُعيق الفهم الفوري للمعنى الإنساني"
      - "مُنْبَطِح يحمل دلالةً أضيق من 'يتمدد': يُخصَّص للاستلقاء على الوجه، بينما sprawl يشمل أوضاعاً متنوعة"
      - "الأب التصنيفي (عامل/فاعل = شخص يعمل وينجز الأمور) لا يتوافق دلالياً مع مفهوم الشخص المنبطح غير الفاعل"
    observations: >
      المجموعة تصف شخصاً يجلس أو يضطجع مُمَدِّداً أطرافه في غير انتظام. الألفاظ المختارة
      صادرة من جذرَي التمدد (م-د-د) والانبطاح (ب-ط-ح)، وكلاهما أصيل راسخ في العربية.
      غير أن مُتَمَدِّد تتنافس دلالتُه مع الاستخدامات التقنية الشائعة في معاجم الفيزياء
      والهندسة، فيما يحمل مُنْبَطِح في بعض السياقات إيحاءً بالاستكانة والذِّلَّة. المفهوم
      نادر في العربية بوصفه اسم فاعل يصف شخصاً بعينه على الدوام.

  blind_candidates:
    - lemma: "مُتَفَرِّش"
      generation_method: ishtiqaq
      justification: "من جذر ف-ر-ش على وزن مُتَفَعِّل؛ الافتراش هو بسط الجسم على المكان كما يُبسط الفراش، ملائمٌ لوصف من يمتد ممسحاً المكان بغير انتظام"
    - lemma: "مُتَرَامٍ"
      generation_method: majaz
      justification: "من جذر ر-م-ي بالمجاز؛ يُقال في العربية 'رمى بنفسه' أي ألقاها؛ والمُتَرَامِي من يلقي نفسه بلا اختيار أو انتظام — إحياء لفظي بتوسيع دلالي"
    - lemma: "مُتَسَطِّح"
      generation_method: ishtiqaq
      justification: "من جذر س-ط-ح على وزن مُتَفَعِّل؛ التسطيح هو الانبساط على السطح واحتلاله عرضاً، يصف من يبسط جسمه مُسطَّحاً في غير ترتيب"
    - lemma: "مُنْبَسِط"
      generation_method: ishtiqaq
      justification: "من جذر ب-س-ط على وزن مُنْفَعِل؛ الانبساط يدل على الاسترخاء والامتداد الأفقي — انبسط على الأرض بمعنى امتد عليها"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفَّذة: ٥
#   ١. مطابقة دفعية: متمدد+المتمدد, منبطح+المنبطح, متفرش, مترام, متسطح, منبسط
#   ٢. الجسر الإنجليزي: sprawler, sprawl, sprawling
#   ٣. FTS عربي: تمدد, انبطاح, ينبطح, يتمدد, يفترش
#   ٤. مقاييس اللغة (dictionary_id=151): جذر م-د-د وب-ط-ح
#   ٥. إثراء OCR: بطح, انبطح, منبطح في المعاجم الكلاسيكية
stage2_evidence:
  per_lemma:
    - lemma: "مُتَمَدِّد"
      confirm:
        - text: "«(2) يتمدَّد [باسطًا ذراعيه وقدميه] (5) تمدُّد؛ انبطاح (6) انتشار في غير نظام أو اتّساق»"
          source: "المورد الحديث (2008) — ترجمة لـ sprawl"
        - text: "««أ» ساجد. «ب» منبطح؛ منسطح؛ متمدِّد»"
          source: "المورد الحديث (2008) — ترجمة لـ prostrate"
      expands:
        - text: "«الْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ فِي طُولٍ، وَاتِّصَالِ شَيْءٍ بِشَيْءٍ فِي اسْتِطَالَةٍ»"
          source: "مقاييس اللغة لابن فارس — مادة (م-د-د)"
          addition: "الجذر يُثبت أصالة دلالة الامتداد والجرّ في طول، مما يدعم صحة اشتقاق مُتَمَدِّد للشخص الممتد"
        - text: "«مَدَّ النَّهارُ: انبسط ضياؤه — مَدَّ الشيءَ: زاد فيه — مدَّ اللهُ الأرضَ: بسطها»"
          source: "المعجم الوسيط"
          addition: "الفعل مدَّ يدل على البسط والامتداد في العربية الفصيحة"

    - lemma: "مُنْبَطِح"
      confirm:
        - text: "«انبطح الفلانُ: استلقى على وجهه ممتداً على الأرض»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«(انبطح) اتَّسع وفُلانٌ استلقى على وجهه»"
          source: "المعجم الوسيط"
        - text: "«مُنْبَطِح: procumbent (prone)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(2) ينبطح» [في سياق ترجمة فعل sprawl]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْبَاءُ وَالطَّاءُ وَالْحَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَبَسُّطُ الشَّيْءِ وَامْتِدَادُهُ. قَالَ الْخَلِيلُ: الْبَطْحُ مِنْ قَوْلِكَ بَطَحَهُ عَلَى وَجْهِهِ بَطْحًا»"
          source: "مقاييس اللغة لابن فارس — مادة (ب-ط-ح)"
          addition: "الجذر يدل على الإلقاء على الوجه والامتداد الأفقي منذ كتاب العين؛ يُعمِّق الصلة بمفهوم المجموعة"
        - text: "«بَطَحَ: إلقاء الشيء على وجهه»"
          source: "كتاب العين"
          addition: "أقدم توثيق للجذر يُقرِّر أن البطح إلقاء على الوجه"
        - text: "«بطحته - بطحاً: بسطه. فلاناً: ألقاه على وجهه»"
          source: "المعجم الوسيط"
          addition: "المعجم الوسيط الحديث يُثبت أن البطح = الإلقاء على الوجه والبسط"

    - lemma: "مُتَفَرِّش"
      evidence_status: "no_material_found"

    - lemma: "مُتَرَامٍ"
      evidence_status: "no_material_found"

    - lemma: "مُتَسَطِّح"
      evidence_status: "no_material_found"

    - lemma: "مُنْبَسِط"
      contradicts:
        - text: "«السَّطح المُنْبَسِط: سَطْحٌ يُمكن بَسْطه إلى مستوٍ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: "مُنْبَسِط وصفٌ للسطح الهندسي المستوي، لا للشخص المتمدد"
        - text: "«منبسط: flat»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "الترجمة الإنجليزية flat تعني المستوى الهندسي وليس sprawler"
        - text: "«منبسط: extravert»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "المعنى الاصطلاحي النفسي الاجتماعي (الانبساطية) يتعارض كلياً مع المعنى المقصود"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُتَمَدِّد"
      decision: confirmed
      decision_reason: >
        اسم الفاعل من تمدَّدَ يتمدَّدُ (جذر م-د-د) على وزن مُتَفَعِّل. المورد الحديث يترجم
        sprawl صراحةً بـ«يتمدَّد باسطًا ذراعيه وقدميه»، ويذكر متمدِّد في ترجمة prostrate.
        الجذر موثَّق في مقاييس اللغة بدلالة الجرّ في طول والامتداد. الاشتراك اللفظي مع
        التمدد الفيزيائي قائم لكنه مقبول في السياق الإنساني الصريح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على فعل الامتداد العام للجسم في أي وضعية — جلوساً أو اضطجاعاً على أي جنب — أوسع دلالةً من مُنْبَطِح، يناسب الجلسة المتفرّشة والاضطجاع الممدود معاً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَمَدِّد"

    - lemma: "مُنْبَطِح"
      decision: confirmed
      decision_reason: >
        اسم فاعل من انبطحَ (جذر ب-ط-ح) على وزن مُنْفَعِل. موثَّق في المعجم الطبي الموحد
        بـ«procumbent (prone)»، وفي المعجم الكبير والمعجم الوسيط بمعنى الاستلقاء على الوجه
        ممتداً، وفي المورد الحديث ترجمةً لـ sprawl. الجذر مؤصَّل من كتاب العين ومقاييس
        اللغة وابن فارس — ثلاثة مصادر مستقلة تُؤكِّد الاستخدام.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُخصَّص للاستلقاء الأفقي التام على الأرض أو السطح مع إيحاء بالاستلقاء على البطن أو الوجه؛ أدقّ في وصف الوضعية الجسدية وأضيق دلالةً من مُتَمَدِّد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْبَطِح"

    - lemma: "مُتَفَرِّش"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على توثيق معجمي لهذه الصيغة وصفاً للشخص المتمدد؛ يفتقر إلى التثبيت المعجمي — اختبار السكّ فاشل"

    - lemma: "مُتَرَامٍ"
      source: stage1
      decision: removed
      decision_reason: "المجاز بعيد ولا دليل معجمي يُثبت استخدامه في هذا المعنى؛ مُتَرَامٍ في العربية المعاصرة يُستخدم للأطراف الجغرافية (أطراف مترامية) لا لوصف الجلوس"

    - lemma: "مُتَسَطِّح"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي للفظ في وصف الشخص؛ يُستخدم في الفيزياء والهندسة (موجة متسطحة، سطح متسطح) وليس للشخص"

    - lemma: "مُنْبَسِط"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تُثبت أن مُنْبَسِط يعني المستوي الهندسي (flat) أو الانبساطي النفسي (extravert)؛ إدراجه يُوجد اشتراكاً لفظياً خطيراً مع معانٍ راسخة ومتداولة"


