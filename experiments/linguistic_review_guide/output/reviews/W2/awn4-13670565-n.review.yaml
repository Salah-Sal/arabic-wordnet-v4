        - text: "«مقياسٌ يستخدمُه البحّارة وأخصائيو الأرصاد الجوّية لتوصيف سُرعات الرياح فوق البحار. فعلى سبيل المثال، إذا كانت القوة على مقياس بوفورت من الدرجة 4 مع مُتوسط سُرعة 6.7 م/ث، فإن هذا الوضع يُوصف بأنه نسيمٌ خفيف. أمّا إذا كانت القوة على مقياس بوفورت من الدرجة 9 مع مُتوسط سُرعة 22.6 م/ث، فإن ذلك يُشير إلى رياح عاصفة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
