          source: "المعجم الوسيط"
          addition: "تعريف عام للمقياس يؤكد دلالته على أداة القياس"
        - text: "«ريح بصفر سرعة أو أقلّ من عقدتين (ريح بقوة 0 بمقياس بوفورت)»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "استعمال تطبيقي لمقياس بوفورت في سياق النقل البحري"

