# مراجعة المجموعة الترادفية awn4-13670565-n — مقياس بوفورت
# Beaufort scale — Review Pipeline v2.0
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «مقياس بوفورت» خالية من التشكيل"
      - "لا يوجد سوى لمّة واحدة للمجموعة؛ والمصادر الاصطلاحية تستعمل «سُلَّم بوفور» أيضاً"
      - "التعريف العربي شديد الإيجاز ولا يذكر أنه مقياس لسرعة الرياح وتأثيرها على سطح البحر"
    observations: >
      المفهوم يدور حول مقياس متدرج (من 0 إلى 12) وضعه الأدميرال البريطاني فرانسيس بوفورت
      لتصنيف قوة الرياح بحسب تأثيرها المرئي على سطح البحر واليابسة.
      المصطلح العربي ينتمي إلى حقل الأرصاد الجوية وعلوم البحار، وهو مركب إضافي
      يجمع بين لفظ عربي (مقياس/سُلَّم) واسم عَلَم أجنبي معرَّب (بوفورت/بوفور).
      المفهوم ليس له لفظ عربي صرف لأنه مسمّى بعَلَمٍ أجنبي، فالتعريب لازم.
  blind_candidates:
    - lemma: "سُلَّمُ بُوفُورْ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «سُلَّم» الدال على التدرج والمراتب، مع «بوفور» تعريباً
        للاسم الأجنبي Beaufort. لفظ «سُلَّم» أدق من «مقياس» في الدلالة على
        تسلسل الدرجات المتصاعدة، وهو المعتمد في معجم الأرصاد الجوية الموحد.
    - lemma: "سُلَّمُ قُوَّةِ الرِّيَاحِ"
      generation_method: tarkib
      justification: >
        مركب إضافي وصفي يصف المفهوم بذاته دون اسم العلم الأجنبي.
        يُستخدم عامّاً لأي مقياس تدريجي لقوة الرياح، لكنه قد يفتقر إلى التخصيص.
    - lemma: "مِعْيَارُ بُوفُورْتْ"
      generation_method: tarkib
      justification: >
        مركب إضافي يستعمل «مِعْيَار» بدل «مقياس» للدلالة على المرجعية القياسية
        المعتمدة. «مِعْيَار» على وزن مِفْعال يدل على أداة المعايرة والضبط.
    - lemma: "دَرَجَاتُ بُوفُورْتْ"
      generation_method: tarkib
      justification: >
        مركب إضافي يركّز على التدرج الرقمي (من 0 إلى 12) باستعمال «درجات»
        لإبراز الطابع الترتيبي للمقياس.

