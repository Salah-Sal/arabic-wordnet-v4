      reason: >
        التعريف الحالي موجز جداً ولا يذكر واضع المقياس ولا الغرض الأساسي منه
        (توصيف سرعة الرياح وتأثيرها)، ولا يوضح أن الأرقام تمثّل درجات متصاعدة.
