          فرانسيس بوفورت لتصنيف قوة الرياح بحسب سرعتها وتأثيرها المرئي على سطح البحر
          واليابسة، يُستخدم في الأرصاد الجوية والملاحة البحرية.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          نظام تصنيف جوّي ابتكره الأدميرال البريطاني فرانسيس بوفورت عام 1805،
          يقسّم قوة الرياح إلى ثلاثَ عشْرةَ درجةً: من الدرجة 0 (سكون تامّ،
          سرعة أقل من عقدة واحدة) إلى الدرجة 12 (إعصار، سرعة تتجاوز 64 عقدة).
          اعتمدته المنظمة العالمية للأرصاد الجوية مرجعاً دولياً لتوصيف الرياح.
