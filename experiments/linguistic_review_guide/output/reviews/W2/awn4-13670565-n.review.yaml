stage3_analysis:
  per_lemma:
    - lemma: "مِقْيَاسُ بُوفُورْتْ"
      decision: confirmed
      decision_reason: >
        مصطلح مثبت في عدة معاجم اصطلاحية عربية (الجغرافيا، الزراعة، الطاقة المتجددة)،
        وله تعريف تفصيلي في معجم الطاقة المتجددة. مركب إضافي واضح الدلالة.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الأكثر شيوعاً في المعاجم الاصطلاحية العربية؛ تستعمل «مِقْيَاس» (وزن مِفْعَال)
        الدال على أداة القياس، وتُعرِّب الاسم كاملاً «بُوفُورْتْ» بالتاء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِقْيَاسُ بُوفُورْتْ"

    - lemma: "سُلَّمُ بُوفُورْ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مثبت في معجم الأرصاد الجوية الموحد (1999) والمورد الحديث (2008).
        «سُلَّم» أدق دلالياً لأنه يركز على التدرج المرتبي، وهو المعتمد في
        المصطلحات الجوية المتخصصة. التعريب «بوفور» (بدون تاء) متّبع في المعاجم الجوية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُفضَّل في السياق الجوي والبحري المتخصص؛ «سُلَّم» يبرز الطابع التدريجي
        المرتبي أكثر من «مقياس»، والتعريب «بوفور» (بدون تاء) هو المعتمد في
        مصطلحات الأرصاد الجوية.
      actions:
        - command: create_entry
          params:
            lemma: "سُلَّمُ بُوفُورْ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "سُلَّمُ قُوَّةِ الرِّيَاحِ"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح عامّ جداً: يدل على أي سُلَّم لقوة الرياح (مثل سلم فوجيتا للأعاصير
        أو غيره) وليس على مقياس بوفورت تحديداً. المقابل الإنجليزي في المعجم هو
        wind force scale وليس Beaufort scale.

    - lemma: "مِعْيَارُ بُوفُورْتْ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي. لفظ «مِعْيَار» يدل على المرجع الذي يُحتكم إليه
        في الضبط والمعايرة، لا على سُلَّم متدرج، فالمقياس هنا ليس أداة معايرة
        بل تصنيف وصفي للرياح.

    - lemma: "دَرَجَاتُ بُوفُورْتْ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شاهد معجمي. صيغة الجمع «درجات» غير مناسبة كمصطلح اسمي
        للمقياس ذاته، وإنما تصف مكوّناته (الدرجة 4، الدرجة 9...) لا الكلّ.

stage4_content:
