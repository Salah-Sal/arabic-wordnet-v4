stage1_review:
  assessment:
    concerns:
      - "انعدام التشكيل في اللمات الحالية."
      - "الاعتماد على صيغة الجمع (عبرانيون) مقبول هنا لأن المفهوم يشير إلى المجموعة العرقية ككل، وليس للفرد."
    observations: "اللمات الحالية صحيحة وتعبر بدقة عن المفهوم من منظور تاريخي وديني. تعبير 'بنو إسرائيل' دقيق جداً للإشارة إلى المجموعة العرقية المنحدرة من يعقوب."
  blind_candidates:
    - lemma: "بَنُو إِسْرَائِيلَ"
      generation_method: tarkib
      justification: "التركيب الإضافي الذي يشير إلى نسل يعقوب (إسرائيل)."
    - lemma: "عِبْرَانِيُّون"
      generation_method: ishtiqaq
      justification: "نسبة إلى 'عابر' أو العبور، وهو الاسم التاريخي للمجموعة."
    - lemma: "إِسْرَائِيلِيُّون"
      generation_method: ishtiqaq
      justification: "نسبة إلى إسرائيل (يعقوب)."
    - lemma: "قَوْمُ مُوسَى"
      generation_method: tarkib
      justification: "تعبير إضافي يشير إلى الأمة التي أرسل إليها موسى."

stage2_evidence:
  per_lemma:
    - lemma: "بنو إسرائيل"
      confirm:
        - text: "«من ينتسبون إلى إسرائيل هذا . وقد وردت هذه التسمية فى القرآن الكريم إحدى وأربعين مرة .»"
          source: "المعجم الكبير"
    - lemma: "عبرانيون"
      confirm:
        - text: "«(العبراني) لِسَان الْيَهُود وواحدهم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "إسرائيليون"
      evidence_status: "no_material_found"
    - lemma: "قوم موسى"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "بنو إسرائيل"
      decision: confirmed
      decision_reason: "تعبير ثابت ومشهور يشير بدقة إلى المجموعة العرقية المنحدرة من يعقوب (إسرائيل)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَنُو إِسْرَائِيلَ"
    - lemma: "عبرانيون"
      decision: confirmed
      decision_reason: "مصطلح تاريخي دقيق يشير إلى هذه المجموعة العرقية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عِبْرَانِيُّون"
    - lemma: "إِسْرَائِيلِيُّون"
      source: stage1
      decision: removed
      decision_reason: "يشير في الاستخدام المعاصر غالباً إلى مواطني دولة إسرائيل الحديثة، مما قد يسبب لبساً مع الدلالة العرقية التاريخية المقصودة هنا."
    - lemma: "قَوْمُ مُوسَى"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي وليس مصطلحاً عرقياً ثابتاً."

stage4_content:
  definition:
    current: "المجموعة العرقية التي تدعي النسب إلى إبراهيم وإسحاق (وخاصة من يعقوب بن إسحاق)؛ الأمة التي اختارها الله لتلقي وحيه والتي اختار الله أن يبرم عهداً معها"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو مترجماً حرفياً. يمكن صياغته بأسلوب عربي أرد وأكثر سلاسة مع الحفاظ على الدقة التاريخية والدينية."
    authored:
      - type: terminological
        text: "مجموعة عرقية سامية تنتسب إلى إبراهيم وإسحاق ويعقوب، اصطفاها الله في فترة تاريخية لتلقي وحيه وحمل رسالته."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-08500946-n"
          definition_index: 0
          text: "مجموعة عرقية سامية تنتسب إلى إبراهيم وإسحاق ويعقوب، اصطفاها الله في فترة تاريخية لتلقي وحيه وحمل رسالته."

  examples:
    per_lemma:
      - lemma: "بَنُو إِسْرَائِيلَ"
        examples:
          - text: "أرسل الله أنبياء كثيرين لهداية بني إسرائيل."
            type: usage
      - lemma: "عِبْرَانِيُّون"
        examples:
          - text: "استقر العبرانيون في أرض كنعان بعد خروجهم من مصر."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أرسل الله أنبياء كثيرين لهداية بني إسرائيل."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "استقر العبرانيون في أرض كنعان بعد خروجهم من مصر."

