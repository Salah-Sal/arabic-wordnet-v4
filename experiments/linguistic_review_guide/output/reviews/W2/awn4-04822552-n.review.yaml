      maqayis_quote: "«الرَّاءُ وَالْكَافُ أَصْلَانِ: أَحَدُهُمَا وَهُوَ مُعْظَمُ الْبَابِ رِقَّةُ الشَّيْءِ وَضَعْفُهُ، وَالثَّانِي تَرَاكُمُ بَعْضِ الشَّيْءِ عَلَى بَعْضٍ... الرَّكِيكُ: الضَّعِيفُ الرَّأْيِ»"

    - lemma: "اِبْتِذَال"
      entry_id: "{auto}"
