# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «عَدَم أَنَاقَة» تعبير وصفي حر لا يرقى إلى مستوى الوحدة المعجمية المسكوكة؛ يخفق اختبار التثبيت المعجمي واختبار السكّ."
      - "لمّة «قُبْح» ذات حمولة دلالية أوسع من المطلوب؛ القبح يدل على ضد الحسن في الصورة والفعل، بينما inelegance تخص تحديداً انعدام الأناقة والتهذيب في السلوك والذوق دون استلزام قبح جسدي."
      - "الركاكة في المعاجم الكلاسيكية والحديثة تنصبّ أساساً على ضعف الأسلوب اللغوي أو ضعف الشخصية، لا على انعدام الأناقة الذوقية مباشرةً — الربط بـ inelegance اتساع دلالي معاصر لا تعريفي."
    observations: >
      المجموعة ترادفية تُعبِّر عن مفهوم «انعدام الأناقة والتهذيب وسلامة الذوق»، وهو مفهوم عربيّ الجذور لكنه أدقّ تعيينًا من المفردات المُعطاة. «رَكَاكَة» الأقوى بين اللمّات، غير أن معاجم اللغة تثبّتها أساساً في نقد الأسلوب اللغوي لا في الحكم الاجتماعي-الذوقي. يلزم تعزيز المجموعة بمفردات تدور على الذوق والتهذيب كالابتذال والسوقية.

  blind_candidates:
    - lemma: "الجَفَاء"
      generation_method: ishtiqaq
      justification: >
        من جذر جفو/جفى على وزن فَعَال المدلول به على الخُلُق الثابت؛ «الجفاء» يدل على البعد عن الرقة واللطف وترك التهذيب في العشرة، مما يقترب من مفهوم الافتقار إلى التهذيب والذوق.

    - lemma: "الِابْتِذَال"
      generation_method: ishtiqaq
      justification: >
        مصدر افتعال من جذر بذل (ترك الصيانة)؛ الابتذال في الاستعمال العربي المعاصر يُوظَّف للدلالة على الانحطاط الذوقي والنزول عن مستوى الكياسة والتهذيب، وهو تعبير مسكوك دارج في النقد الثقافي والأدبي.

    - lemma: "الغِلْظَة"
      generation_method: ishtiqaq
      justification: >
        من جذر غلظ على وزن فِعْلَة المدلول به على الخاصية المجردة؛ «الغلظة» تعني ضد الرقة، وقد يُستعار للمعاني كما نصّت المعاجم، مما يجعلها قريبة من مفهوم انعدام الرقة والتهذيب.

    - lemma: "السُّوقِيَّة"
      generation_method: majaz
      justification: >
        مجاز بإزاحة دلالية من «السوق» إلى خاصية من ينتسب إليه خلقاً لا مهنة؛ «السوقي» في التراث العربي من اتصف بخشونة البيئة السوقية وبُعده عن الظرف والتهذيب، و«السوقية» مصدر صناعي منه يعبّر عن هذه الصفة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # === اللمّات الموجودة ===

  - lemma: "رَكَاكَة"
    confirm:
      - text: "«فى الأسلوب: ضَعْفُ الصِّياغَةِ اللُّغَوِيَّةِ وتهافُتُها. يقال: أُسْلُوبٌ فيه رَكَاكَةٌ»"
        source: "المعجم الكبير (مجمع اللغة العربية)"
      - text: "«رَكِيك الأسلوب: سخيفه»"
        source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
      - text: "«ركاكة الرأي: ارتباكه وتحيّره. كلام ركيك: أسلوب ضعيف سخيف واهٍ، سقيم»"
        source: "تكملة المعاجم العربية لدوزي"
    expands:
      - text: "«الرَّاءُ وَالْكَافُ أَصْلَانِ: أَحَدُهُمَا وَهُوَ مُعْظَمُ الْبَابِ رِقَّةُ الشَّيْءِ وَضَعْفُهُ، وَالثَّانِي تَرَاكُمُ بَعْضِ الشَّيْءِ عَلَى بَعْضٍ... الرَّكِيكُ: الضَّعِيفُ الرَّأْيِ»"
        source: "مقاييس اللغة لابن فارس"
        addition: "الجذر ركك يدل أصلاً على الضعف والرقة عموماً، ومنه اشتُقّت الركاكة بمعنى الضعف في كل شيء، مما يسوّغ توسيعها لتشمل الضعف الذوقي وانعدام الأناقة."
    contradicts:
      - text: "«(الركاكة) الرجل يستضعفه النِّساء فلا يهبنه والذي لا يغار على أهله»"
        source: "المعجم الوسيط لمجموعة من المؤلفين / المعجم الوسيط (OCR)"
        conflict: "هذا المعنى (الرجل الذي لا يغار) بضمّ الراء (رُكَاكة) مختلف عن مفهوم انعدام الأناقة المطلوب، مما يستوجب التمييز بين رَكَاكَة (بفتح) ورُكَاكَة (بضم)."

  - lemma: "عَدَم أَنَاقَة"
    expands:
      - text: "«لاأناقة؛ لاانصقال؛ لارقّة.»"
        source: "المورد الحديث (2008) — ARABTERM، ترجمة: inelegance"
        addition: "المورد الحديث يترجم inelegance بهذه العبارة الوصفية المركّبة لا بوحدة معجمية واحدة، مما يكشف غياب تثبيت معجمي لهذا التركيب."

  - lemma: "قُبْح"
    confirm:
      - text: "«(قَبَحَ) الْقَافُ وَالْبَاءُ وَالْحَاءُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى خِلَافِ الْحُسْنِ، وَهُوَ الْقُبْحُ»"
        source: "مقاييس اللغة لابن فارس"
    contradicts:
      - text: "«القُبْحُ: ضد الحُسْنِ يكون في الصورة والفعل»"
        source: "لسان العرب لابن منظور"
        conflict: "القبح في المعاجم يدل على ضد الحسن في الصورة الجسدية أولاً ثم الفعل، وهو أعمّ من inelegance التي تختص بانعدام الأناقة والتهذيب الذوقي دون استلزام قبح جسدي."

  # === مرشحات المرحلة ١ ===

  - lemma: "الجَفَاء"
    confirm:
      - text: "«الجفاء بالفتح، الغلظ في العشرة والخرق في المعاملة وترك الرفق في الأمور»"
        source: "التوقيف على مهمات التعاريف للمناوي"
    contradicts:
      - text: "«الجِيمُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ يَدُلُّ عَلَى أَصْلٍ وَاحِدٍ: نُبُوُّ الشَّيْءِ عَنِ الشَّيْءِ... وَالْجَفَاءُ: خِلَافُ الْبِرِّ»"
        source: "مقاييس اللغة لابن فارس"
        conflict: "الجفاء في أصله البعدُ والتنافر وخلاف البر، وهو يُعبّر عن فظاظة الطباع وسوء الخلق لا عن انعدام الأناقة الذوقية تحديداً."

  - lemma: "الِابْتِذَال"
    expands:
      - text: "«(بَذَلَ) الْبَاءُ وَالذَّالُ وَاللَّامُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ تَرْكُ صِيَانَةِ الشَّيْءِ، يُقَالُ: بَذَلْتُ الشَّيْءَ بَذْلًا، فَأَنَا بَاذِلٌ وَهُوَ مَبْذُولٌ، وَابْتَذَلْتُهُ ابْتِذَالًا. وَجَاءَ فُلَانٌ فِي مَبَاذِلِهِ، وَهِيَ ثِيَابُهُ الَّتِي يَبْتَذِلُهَا»"
        source: "مقاييس اللغة لابن فارس (بذل)"
        addition: "الابتذال مصدر افتعال من بذل = ترك الصيانة؛ والمبتذَل ما سقطت هيبته بالكثرة أو الإهمال، ومنه استُعمل الابتذال في العربية المعاصرة للانحطاط الذوقي وانعدام الكياسة."

  - lemma: "الغِلْظَة"
    confirm:
      - text: "«الغلظة: ضد الرقة، وأصله أن يستعمل في الأجسام، لكن قد يستعار للمعاني»"
        source: "التوقيف على مهمات التعاريف للمناوي"
    contradicts:
      - text: "«الغِلْظَةُ... ضِدُّ الرِّقَّةِ»"
        source: "القاموس المحيط للفيروزآبادي"
        conflict: "الغلظة أصلاً ضد الرقة الجسدية ثم تُستعار للطباع؛ وهي تُعبّر عن الخشونة والشدة لا عن انعدام الأناقة والذوق الرفيع تحديداً."

  - lemma: "السُّوقِيَّة"
    confirm:
      - text: "«(1) «أ» السُّوقيّة: كون الشّيء سُوقيًّا أو مبتَذَلًا. «ب» فظاظة؛ خشونة؛ قلّة تهذيب أو ذوق (2) عَمَلٌ أو مَسْلَكٌ أو كلامٌ سُوقيّ»"
        source: "المورد الحديث (2008) — ARABTERM، ترجمة: vulgarity"
    expands:
      - text: "«السِّينُ وَالْوَاوُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ حَدْوُ الشَّيْءِ... وَالسُّوقُ مُشْتَقَّةٌ مِنْ هَذَا، لِمَا يُسَاقُ إِلَيْهَا مِنْ كُلِّ شَيْءٍ»"
        source: "مقاييس اللغة لابن فارس (سوق)"
        addition: "السوق في التراث العربي مرتبطة بالاختلاط والعامية؛ ومن ثمّ نشأت دلالة «السوقي» على من يتصف بفظاظة السوق وخشونتها وبعده عن الظرف والتهذيب."


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # --- رَكَاكَة (موجودة) ---
    - lemma: "رَكَاكَة"
      decision: confirmed
      decision_reason: >
        الركاكة مصطلح عربي فصيح مُثبَّت معجمياً بمعنى ضعف الصياغة والأسلوب، ويُوظَّف في العربية المعاصرة بصورة أوسع للدلالة على انعدام الأناقة والكياسة في السلوك والأسلوب. رغم أن المعاجم الكلاسيكية تقيّده أساساً بضعف الأسلوب اللغوي، فإن الشيوع الاستعمالي المعاصر يسوّغ إدراجها في هذه المجموعة. التشكيل الصحيح هو رَكَاكَة (بفتح الراء) تمييزاً لها عن رُكَاكَة (بضم) الدالة على الرجل الذي لا يغار.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        رَكَاكَة أعمّ اللمّات وأكثرها تجريداً في التعبير عن هذا المفهوم؛ تُستخدم في نقد الأسلوب الأدبي واللغوي بالدرجة الأولى، وقد تتسع لتشمل الانحطاط الذوقي في السلوك عموماً. تُركّز على الضعف والوهن لا على الانحطاط من مستوى سابق.

    # --- عَدَم أَنَاقَة (موجودة) ---
    - lemma: "عَدَم أَنَاقَة"
      decision: removed
      decision_reason: >
        «عدم أناقة» تعبير وصفي حر وليست وحدة معجمية مسكوكة ومثبّتة؛ يمكن إبدال «أناقة» بـ«ظرافة» أو «لياقة» فيظل الوصف صادقاً، مما يُثبت فشل اختبار السكّ. لم يرصد المورد الحديث هذا التركيب بل لجأ إلى «لاأناقة» بصورة ملتصقة، وهو يختلف عن «عدم أناقة» تركيباً. غياب أي توثيق معجمي لها كوحدة ثابتة يوجب إزالتها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # --- قُبْح (موجودة) ---
    - lemma: "قُبْح"
      decision: removed
      decision_reason: >
        القبح في المعاجم العربية قاطبة يدل على «ضد الحسن في الصورة والفعل» وهو أعمّ بكثير من inelegance؛ فالشيء قد يكون غير أنيق دون أن يكون قبيحاً، والعكس صحيح. المحور الدلالي للمجموعة هو الافتقار إلى التهذيب والذوق الرفيع، لا ضد الجمال الذي هو محور القبح. إدراج القبح يُربك المجموعة بدلالة تشمل القبح الجسدي والأخلاقي والجمالي الواسع.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # --- الجَفَاء (مرشح المرحلة ١) ---
    - lemma: "الجَفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الجفاء يدل على البعد والتنافر وخلاف البر والقسوة في الطباع والمعاملة؛ وهو مفهوم يُعبّر عن سوء الخلق وقسوته أكثر من تعبيره عن انعدام الأناقة والذوق الجمالي. التداخل الدلالي مع المجموعة طفيف لا يكفي للتأهيل. فضلاً عن ذلك فإن الجفاء أثقل في دلالته (يوحي بالعداء والإيذاء) بينما inelegance أخف (تعني انعدام الرقة والأناقة فحسب).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # --- الِابْتِذَال (مرشح المرحلة ١) ---
    - lemma: "الِابْتِذَال"
      source: stage1
      decision: confirmed
      decision_reason: >
        الابتذال مصدر مقيس (افتعال من بذل = ترك الصيانة)، وهو وحدة معجمية مسكوكة مُتداوَلة على نطاق واسع في العربية المعاصرة للدلالة على الانحطاط الذوقي وانعدام الكياسة وسقوط الرفعة. يُوظَّف في نقد الأعمال الفنية والأدبية والسلوك الاجتماعي، مما يجعله في صميم مفهوم «انعدام التهذيب والذوق الرفيع». الجذر بذل يُثبت معنى التخلي عن الصيانة وهو أصل الابتذال.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الابتذال يُركّز على الانحطاط من مستوى رفيع إلى أدنى منه (دلالة الانزلاق)، ويُوحي بأن القيمة والهيبة أُهدرتا وفقد الشيء أو الشخص رفعتَه؛ ولذا يكثر في نقد الأعمال الفنية والكلام الذي سقط عن مستوى الجودة والذوق.
      actions:
        - command: create_entry
          params:
            lemma: "اِبْتِذَال"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # --- الغِلْظَة (مرشح المرحلة ١) ---
    - lemma: "الغِلْظَة"
      source: stage1
      decision: removed
      decision_reason: >
        الغلظة تدل على الخشونة وضد الرقة، وأصلها في الأجسام ثم تُستعار للطباع. هي أقرب إلى القسوة والشدة منها إلى انعدام الأناقة؛ فالرجل الغليظ قاسٍ لا متذوق، بينما inelegance تتعلق بالرقي والأناقة والذوق الجمالي. التداخل الدلالي محدود.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # --- السُّوقِيَّة (مرشح المرحلة ١) ---
    - lemma: "السُّوقِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        السوقية مصدر صناعي مُثبَّت في المورد الحديث بترجمة vulgarity وتعريف «قلّة تهذيب أو ذوق»، وهو ما يتطابق تطابقاً وثيقاً مع تعريف المجموعة. الإيثار التراثي واضح: المجاز من السوق (الخشونة والعامية) إلى الصفة الاجتماعية راسخ في التراث البلاغي العربي. الوحدة معجمية ثابتة تقبل التعريف والجمع والنسبة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        السوقية تحمل دلالة اجتماعية واضحة المرجع: نسبة السلوك أو الكلام إلى بيئة السوق وخشونتها؛ وهي تُركّز على انعدام التهذيب في التعامل العام والكلام والمسلك، مع إيحاء بالعامية والفجاجة في التعبير. أوضح اللمّات في الإحالة إلى السياق الاجتماعي.
      actions:
        - command: create_entry
          params:
            lemma: "سُوقِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة الافتقار إلى التهذيب والذوق الرفيع"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دقيق لكنه يُغفل دلالة الأناقة (elegance) التي هي محور المفهوم، ويكتفي بـ«التهذيب والذوق» دون الإشارة إلى البُعد الجمالي والأسلوبي. فضلاً عن ذلك، صياغة «صفة الافتقار إلى» ثقيلة ويمكن تخفيفها لتتوافق مع أسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: "صِفَةُ مَن يَفتقر إلى الأناقة والتهذيب وسلامة الذَّوق في أسلوبه أو سلوكه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ضَعفُ الذَّوق وخُلُوُّ الأسلوبِ أو السلوكِ من الأناقة والتهذيب والرِّفاهية الحِسِّية"
        quality_check:
