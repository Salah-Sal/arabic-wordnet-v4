# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «دخان» خاليةٌ من التشكيل."
      - "التعريف العربي «مؤشر على نشاط خفي» يبدو ترجمةً حرفيّةً من الإنجليزية ويفتقر إلى الصياغة المعجمية العربية وإلى التنبيه الصريح على طابعه المجازي."
      - "الاستعمال المجازي لـ«دخان» بمعنى دلالة الشر الخفي موثَّق في التراث العربي، لكنه يحتاج إلى توثيق في التعريف."
    observations: >
      المجموعة ترادفيّة تمثّل المعنى المجازي لكلمة «دخان» إذ تستعمل للدلالة
      على نشاطٍ مستتر أو شرٍّ خفيٍّ، مستلهَمةً من المثل العربي «لا دخان بلا
      نار». أصل هذا المعنى متجذّر في التراث كما في «هُدنةٌ على دَخَن» بمعنى
      استقرار يستر أحقاداً مكنونة، وفي «ارتفع له دخان شرٍّ مستطير». الموروث
      الدلالي المجازي صحيح وموثَّق، غير أن التعريف الحالي لا يوضّح هذا البُعد
      المجازي ولا يتّسق مع أسلوب المعجم العربي.

  blind_candidates:
    - lemma: "أَمَارَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (أ م ر) على وزن فَعَالَة. استُعمل في الفقه والمنطق
        للدلالة على كل ما يُفضي إلى الظن بوجود المدلول دون القطع به،
        كالغيم بالنسبة إلى المطر — وهو أقرب المفاهيم إلى «مؤشر على نشاط خفي»
        لا سيما أن الأمارة بطبعها «ظنّية» لا قاطعة.
    - lemma: "قَرِينَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ق ر ن) على وزن فَعِيلَة. تعني في الاصطلاح الأمرَ الدالَّ
        على المراد من غير صراحة؛ وتُستعمل في القانون والبلاغة للإشارة إلى
        ما يقترن بشيء ليكشف عنه — مناسبةٌ للدلالة على نشاط خفي يُستدلّ عليه
        بقرائن لا بدليل صريح.
    - lemma: "نَذِير"
      generation_method: majaz
      justification: >
        من الجذر (ن ذ ر)، وزن فَعِيل. استُعمل مجازاً للإيذان بشر قادم؛
        يُلمّح إلى وجود خطر أو نشاط مخفي على وشك الانكشاف، وفيه معنى الإنباء
        الذي هو روح هذه المجموعة.
    - lemma: "إِيمَاء"
      generation_method: ishtiqaq
      justification: >
        من الجذر (و م أ) على وزن إِفْعَال. يعني الإلقاء الخفيف للمعنى في
        النفس؛ يُلمّح إلى نشاط دون التصريح به، وقد يكون مرادفاً وظيفياً
        للمعنى المجازي المقصود.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# ميزانية الاستعلامات المُنفَّذة:
#   ١ — مطابقة دفعية: دخان + ٤ مرشحات (مع صيغ ال-)   → ٦٤ مدخلاً
#   ٢ — إثراء بالمعرّف: شواهد + أمثلة                  → ٧ مدخلات
#   ٣ — مقاييس اللغة: جذور دخن، أمر، قرن، نذر، ومأ    → ٤ مدخلات
#   ٤ — جسر الإنجليزية: smoke / indication / clue      → ٣٠ مدخلاً
#   ٥ — FTS عربي: مؤشر / نشاط خفي / دلالة خفية        → ٢٠ مدخلاً
# المجموع: ٥ استعلامات ✓
stage2_evidence:
  per_lemma:

    # ── اللمّة الموجودة ───────────────────────────────────────
    - lemma: "دخان"
      confirm:
        - text: >
            «كَانَ بَيْنَهُمْ أَمْرٌ ارْتَفَعَ لَهُ دُخَانٌ: شَرٌّ مُسْتَطِيرٌ»
          source: "المعجم الوسيط، مجمع اللغة العربية بالقاهرة"
        - text: >
            «يُكْنَى بِهِ عَنْ مَوْضِعِ الشَّرِّ إِذَا عَلَا الدَّخُّ»
          source: "المعجم الكبير، مجمع اللغة العربية"
        - text: >
            «الدَّالُ وَالْخَاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ، وَهُوَ الَّذِي
            يَكُونُ عَنِ الْوَقُودِ، ثُمَّ يُشَبَّهُ بِهِ كُلُّ شَيْءٍ
            يُشْبِهُهُ مِنْ عَدَاوَةٍ وَنَظِيرِهَا»
          source: "مقاييس اللغة، ابن فارس"
        - text: >
            «هُدْنَةٌ عَلَى دَخَنٍ: فَهُوَ اسْتِقْرَارٌ عَلَى أُمُورٍ
            مَكْرُوهَةٍ»
          source: "مقاييس اللغة، ابن فارس — تفسير الحديث النبوي"
      expands:
        - text: >
            «مَا تَكَوَّنَ مَعَ لَهِيبِ النَّارِ... العُثَانُ وَهُوَ
            الغُبَارُ. (عَلَى التَّشْبِيهِ): يُقَالُ لِلْبُخَارِ وَمَا هُوَ
            عَلَى صُورَتِهِ الجَدْبُ وَالجُوعُ — كَأَنَّ الجَائِعَ يَرَى
            بَيْنَهُ وَبَيْنَ السَّمَاءِ دُخَاناً مِنْ شِدَّةِ الجُوعِ»
          source: "المعجم الكبير، مجمع اللغة العربية"
          addition: >
            يُثبت المعجمُ الكبير الاستعمالَ المجازي المتعدد لـ«دخان» عبر
            التشبيه الحسّي والمعنوي معاً، مما يدعم صحة استعماله في هذه
            المجموعة.

    # ── المرشح ١: أَمَارَة ──────────────────────────────────
    - lemma: "أَمَارَة"
      confirm:
        - text: >
            «الأَمَارَةُ لُغَةً: الْعَلَامَةُ؛ وَاصْطِلَاحاً: هِيَ الَّتِي
            يَلْزَمُ مِنَ الْعِلْمِ بِهَا الظَّنُّ بِوُجُودِ الْمَدْلُولِ،
            كَالغَيْمِ بِالنِّسْبَةِ إِلَى الْمَطَرِ»
          source: "كتاب التعريفات للجرجاني (ت ١٤١٣م)"
        - text: >
            «وَالْفَرْقُ بَيْنَ الأَمَارَةِ وَالْعَلَامَةِ: أَنَّ الْعَلَامَةَ
            مَا لَا يَنْفَكُّ عَنِ الشَّيْءِ، وَالأَمَارَةَ تَنْفَكُّ عَنْهُ،
            كَالغَيْمِ بِالنِّسْبَةِ لِلْمَطَرِ»
          source: "التعريفات الفقهية للبركتي (ت ١٩٧٥م)"
        - text: >
            «الأَمَارُ أَمَارُ الطَّرِيقِ: مَعَالِمُهُ، الوَاحِدَةُ أَمَارَةٌ.
            وَقَالَ الأَصْمَعِيُّ: الأَمَارَةُ الْعَلَامَةُ، تَقُولُ: اجْعَلْ
            بَيْنِي وَبَيْنَكَ أَمَارَةً وَأَمَاراً»
          source: "مقاييس اللغة، ابن فارس"
        - text: >
            «أَمَارَة: عَلَامَةٌ تَدُلُّ عَلَى هُوِيَّةِ شَيْءٍ مَا»
          source: "مسرد الإعلام والتواصل — أرابترم (token)"

    # ── المرشح ٢: قَرِينَة ──────────────────────────────────
    - lemma: "قَرِينَة"
      confirm:
        - text: >
            «القَرِينَةُ: مَا يَدُلُّ عَلَى الْمُرَادِ مِنْ غَيْرِ كَوْنِهِ
            صَرِيحاً»
          source: "التعريفات الفقهية للبركتي"
        - text: >
            «هِيَ الأَمْرُ الدَّالُّ عَلَى الشَّيْءِ لَا بِالوَضْعِ»
          source: "كتاب التعريفات للجرجاني"
      contradicts:
        - text: >
            «(الْقَرِينَةُ) النَّفْسُ وَالزَّوْجَةُ لِأَنَّهَا تُقَارِنُ
            زَوْجَهَا»
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
          conflict: >
            المعنى الأكثر شيوعاً للقرينة في المعجمية الحديثة هو
            النفس/الزوجة، لا «الدليل على نشاط خفي». الاستعمال الاصطلاحي
            للقرينة بمعنى «الدليل الظرفي» خاصٌّ بالفقه والمنطق، وليس
            دلالةً مجازية على نشاط مستتر.

    # ── المرشح ٣: نَذِير ───────────────────────────────────
    - lemma: "نَذِير"
      contradicts:
        - text: >
            «النُّونُ وَالذَّالُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى تَخْوِيفٍ
            أَوْ تَخَوُّفٍ. مِنْهُ الإِنْذَارُ: الإِبْلَاغُ؛ وَلَا يَكَادُ
            يَكُونُ إِلَّا فِي التَّخْوِيفِ»
          source: "مقاييس اللغة، ابن فارس"
          conflict: >
            النذير يُعبّر عن الإنذار والتخويف — وظيفته التحذير لا الدلالة
            الظنّية على نشاط خفي. فيه تركيز على المستقبل (التخويف مما سيأتي)
            لا على الكشف عمّا هو حادث في الخفاء.

    # ── المرشح ٤: إِيمَاء ──────────────────────────────────
    - lemma: "إِيمَاء"
      contradicts:
        - text: >
            «الإِيمَاءُ: الْكَلَامُ الْمُشَارُ بِهِ إِلَى الْمَطْلُوبِ مِنْ
            قُرْبٍ لَا مَعَ الخَفَاءِ»
          source: "معجم مقاليد العلوم للسيوطي (ت ١٥٠٥م)"
          conflict: >
            التعريف الاصطلاحي ينصّ صراحةً على أن الإيماء «لا مع الخفاء»،
            وهذا يتعارض مباشرةً مع الفصل الأساسي لهذه المجموعة وهو «نشاط
            خفي».
        - text: >
            «الإِيمَاءُ: إِلْقَاءُ الْمَعْنَى فِي النَّفْسِ بِخَفَاءٍ
            وَسُرْعَةٍ»
          source: "دستور العلماء للأحمدنكري (القرن ١٨م)"
          conflict: >
            هذه الصيغة أقرب للمعنى لكنها تركّز على الخفاء في عملية الإيصال
            اللغوي (إيهام المتكلم)، لا على كون الدلالة مؤشّراً على نشاط
            مستتر خارجي كالذي تمثّله هذه المجموعة.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة: دخان ────────────────────────────
    - lemma: "دخان"
      decision: confirmed
      decision_reason: >
        الاستعمال المجازي لـ«دخان» للدلالة على نشاط خفيٍّ أو شر مستتر
        موثَّق في المعجم الوسيط وفي مقاييس اللغة لابن فارس وفي المعجم
        الكبير. ويعزّزه المَثَل العربي «لا دخان بلا نار» الذي يُرسي
        علاقة الدلالة بين الدخان والأمر الخفي المستتر. التشكيل الصحيح
        دُخَان (بضمّ الدال وفتح الخاء).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «دُخَان» هو اللمّة الوحيدة المؤكَّدة في هذه المجموعة؛ يتميّز عن
        المرادفات العامة كـ«أمارة» و«علامة» بكونه استعارةً حسّيّةً تربط
        الدلالةَ الضمنيّةَ بصورة النار الكامنة تحت الدخان، مما يُضفي
        معنى الخطر المستتر والنشاط المكروه الخفي — لا مجرّد العلامة
        العامة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُخَان"

    # ── المرشح ١: أَمَارَة ──────────────────────────────
    - lemma: "أَمَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        أَمَارَة تعني «العلامة الظنّية الدالة على وجود شيء ما» — وهي في
        الحقيقة مُقابِلٌ للمشترك الأعلى (awn4-06810027-n: دلالة/علامة/مؤشر)
        لا للمجموعة الفرعية. فهي لا تحمل بنيةً الخصوصية المطلوبة للمعنى
        المجازي «مؤشر على نشاط خفي بالذات». إضافتها هنا سيجعلها مشتركةً
        مع المشترك الأعلى ويُربك التسلسل الهرمي الدلالي.

    # ── المرشح ٢: قَرِينَة ─────────────────────────────
    - lemma: "قَرِينَة"
      source: stage1
      decision: removed
      decision_reason: >
        القرينة مصطلح فقهي ومنطقي يعني الدليل الظرفي المقترن بالقضية، وهو
        أكثر تحديداً من المفهوم المطلوب. فضلاً عن أن التعريف الأشيع في
        المعاجم الحديثة هو «النفس والزوجة»، لا «الدلالة على الخفي». ليست
        مرادفة دلالياً لـ«دخان» بمعنى الاستعارة الدالة على النشاط المستتر.

    # ── المرشح ٣: نَذِير ─────────────────────────────
    - lemma: "نَذِير"
      source: stage1
      decision: removed
      decision_reason: >
        النذير وظيفته الإنذار والتخويف من خطر قادم، لا الإشارة إلى نشاط
        خفي راهن. مقاييس اللغة تُصرّح: «لا يكاد يكون إلا في التخويف». هذا
        يُبعده عن مفهوم «مؤشر» الذي تقتضيه المجموعة.

    # ── المرشح ٤: إِيمَاء ────────────────────────────
    - lemma: "إِيمَاء"
      source: stage1
      decision: removed
      decision_reason: >
        التعريف الاصطلاحي يُصرّح بـ«لا مع الخفاء»، مما يتعارض مباشرةً مع
        الفصل النوعي لهذه المجموعة. الإيماء إشارةٌ لغوية ضمنية، لا دلالة
        على نشاط مستتر خارجي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
