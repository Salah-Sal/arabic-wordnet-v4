        التعريف الحالي ترجمةٌ شبه حرفية من الإنجليزية «an indication of some
        hidden activity»، ويفتقر إلى: (١) التنبيه على الطابع المجازي، (٢)
        الجنس القريب اللغوي العربي، (٣) الفصل النوعي المميّز. أسلوبه لا
