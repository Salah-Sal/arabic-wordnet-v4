step0_evidence:
  per_lemma:
    - lemma: "حقيقي النواة"
      confirm:
        - text: "«كائن وحيد الخلية أو متعدد الخلايا، التي لديها نواة بغشاء حقيقي وغشاء يحيط بالعضيات»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«كائن بكل خلية منه نواة حقيقية»"
          source: "معجم المصطلحات الطبية (ArabTerm)"
      expands:
        - text: "«حَقيقِيَّاتُ النَّواة (مَمْلَكَةٌ مِنَ الأَحْياء)»"
          source: "المعجم الطبي الموحد"
          addition: "يؤكد أن المصطلح يستخدم أيضاً كاسم لمملكة حيوية (جمع مؤنث سالم)"

step05_lemma_generation:
