      source_section: "step6_fts_keyword"
      evidence_citation: "«حَقيقِيَّاتُ النَّواة (مَمْلَكَةٌ مِنَ الأَحْياء)» — المعجم الطبي الموحد"
      justification: "الاسم الجمعي الشائع للمملكة التي ينتمي إليها الكائن، ويستخدم كاسم جنس."
  knowledge_candidates:
    - lemma: "كائن حقيقي النواة"
      justification: "وصف صريح يزيل اللبس بين الكائن وبين الصفة التشريحية."
    - lemma: "إيوكاريوت"
      justification: "تعريب صوتي مباشر (transliteration) للمصطلح اللاتيني، مستخدم في بعض المراجع المتخصصة."
  generation_notes: "المصطلح العربي المستقر هو 'حقيقي النواة' كصفة وكاسم كائن، و'حقيقيات النوى/النواة' كفئة حيوية."

