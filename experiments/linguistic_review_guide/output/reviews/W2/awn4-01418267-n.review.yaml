step3_definition:
  definition_review_flag: true
  current_definition: "كائن بخلايا مميزة لجميع أشكال الحياة باستثناء الكائنات الدقيقة البدائية مثل البكتيريا؛ أي كائن بنواة 'جيدة' أو محاطة بغشاء في خلاياه"
  assessment:
    decision: revise
    reason: "تحسين الصياغة العلمية واستبدال 'نواة جيدة' (الترجمة الحرفية للأصل اليوناني) بمصطلح 'نواة حقيقية' المستقر عربياً."
  authored_definitions:
    - type: terminological
      text: "كائن حيّ تتألف خلاياه من نواة حقيقية محاطة بغشاء نوويّ يفصل المادة الوراثية عن السيتوبلازم، وتضم جميع الكائنات الحية باستثناء البدائيات (مثل البكتيريا)."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-01418267-n"
        definition_index: 0
        text: "كائن حيّ تتألف خلاياه من نواة حقيقية محاطة بغشاء نوويّ يفصل المادة الوراثية عن السيتوبلازم، وتضم جميع الكائنات الحية باستثناء البدائيات (مثل البكتيريا)."

