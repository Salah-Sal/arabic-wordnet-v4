          params: {lemma: "صَوْب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13849639-n"}

stage4_content:
  definition:
    current: "العلاقة المكانية بين شيء ما والمسار الذي يشير إليه أو يتحرك نحوه"
    assessment:
      decision: revise
      reason: "التعريف الحالي أقرب للترجمة الحرفية، ويفضل صياغته بأسلوب معجمي عربي يركز على الخط الوهمي أو القصد."
    authored:
      - type: terminological
        text: "الخَطُّ الَّذِي يَمُرُّ بِهِ جِسْمٌ مُتَحَرِّكٌ، أَوْ يَتَّجِهُ إِلَيْهِ نَظَرٌ أَوْ قَصْدٌ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "اِتِّجَاه"
        examples:
          - text: "سَلَكَتِ السَّيَّارَةُ اتِّجَاهَ الشَّمَالِ."
            type: usage
      - lemma: "وِجْهَة"
        examples:
          - text: "غَيَّرَ الْمُسَافِرُ وِجْهَتَهُ فِي آخِرِ لَحْظَةٍ."
            type: usage
      - lemma: "جِهَة"
        examples:
          - text: "تَهَبُّ الرِّيَاحُ مِنْ جِهَةِ الْبَحْرِ."
            type: usage
      - lemma: "صَوْب"
        examples:
          - text: "انْطَلَقَ الْفَارِسُ صَوْبَ الْعَدُوِّ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-13849639-n", definition_index: 0, text: "الخَطُّ الَّذِي يَمُرُّ بِهِ جِسْمٌ مُتَحَرِّكٌ، أَوْ يَتَّجِهُ إِلَيْهِ نَظَرٌ أَوْ قَصْدٌ."}

