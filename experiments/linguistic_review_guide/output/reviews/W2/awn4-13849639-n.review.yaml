stage1_review:
  assessment:
    concerns:
      - "لا توجد ملاحظات سلبية؛ اللمّات الحالية دقيقة وتغطي المفهوم."
    observations: "المفهوم يعبر عن المسار أو الوجهة المكانية. اللمّات المقترحة تغطي الاستعمال المعاصر والقديم."
  blind_candidates:
    - lemma: "اِتِّجَاه"
      generation_method: ishtiqaq
      justification: "اللفظ المعاصر الأكثر شيوعاً للتعبير عن مسمت الحركة أو المسار، مشتق من المواجهة."
    - lemma: "وِجْهَة"
      generation_method: ishtiqaq
      justification: "لفظ قرآني وفصيح يدل على الجانب الذي يتوجه إليه المرء."
    - lemma: "جِهَة"
      generation_method: ishtiqaq
      justification: "اسم للمكان الذي تتوجه إليه، وهو من أكثر الألفاظ ترادفاً مع اتجاه."
    - lemma: "صَوْب"
      generation_method: majaz
      justification: "يستخدم بمعنى القصد والجهة، كما في قولهم 'اتجه صوبه'."

stage2_evidence:
  per_lemma:
    - lemma: "اِتِّجَاه"
      confirm:
        - text: "«اتجاه: direction»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "«اتجاه: bearing»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
      expands:
        - text: "«في التصوير المساحي: التوجيه الزاوي لآلة التصوير بالنسبة إلى جملة مرجعية خارجية»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد"
    - lemma: "وِجْهَة"
      confirm:
        - text: "«الوِجهة هي: الجانب والناحية، أو المكان تستقبله»"
          source: "معجم الصواب اللغوي"
        - text: "«الجانب والناحية، والموضع الذي تتوجه إليه وتقصده»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "جِهَة"
      confirm:
        - text: "«الْجِهَة: تطلق على... أطراف الامتدادات... ومنتهى الإشارات ومقصد الحركات»"
          source: "دستور العلماء"
        - text: "«الشطر: القصد والجهة»"
          source: "المحيط في اللغة"
    - lemma: "صَوْب"
      confirm:
        - text: "«الصَّوْبُ: القصد والجهة؛ يقال أقم صوبك أي قوم قصدك»"
          source: "المعجم الوسيط"
        - text: "«الصَّوْبُ: جهة أو ناحية؛ اتجه صوبَه»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
