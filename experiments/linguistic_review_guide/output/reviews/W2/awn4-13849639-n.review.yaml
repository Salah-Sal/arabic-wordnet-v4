      decision_reason: "لفظ فصيح وعريق يدل على الجهة التي يُقصد استقبالها، وهو مرادف قوي لاتجاه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
