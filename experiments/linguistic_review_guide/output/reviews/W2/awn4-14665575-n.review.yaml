stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'يود' تفتقر إلى التشكيل الكامل."
    observations: "المفهوم يشير إلى عنصر اليود الكيميائي، وهو مصطلح معرب مستقر في الاستعمال العلمي المعاصر. المصطلح يتبع اللفظ اليوناني أو الفرنسي الأصل (Iode)، بينما تظهر أحياناً أشكال أخرى تتبع اللفظ الإنجليزي (Iodine)."
  blind_candidates:
    - lemma: "يُود"
      generation_method: taarib
      justification: "التعريب القياسي والأكثر شيوعاً لهذا العنصر في العربية."
    - lemma: "يُودِين"
      generation_method: taarib
      justification: "تعريب مباشر للفظ الإنجليزي (Iodine)، شائع في السياقات الأكاديمية والكيميائية."
    - lemma: "أَيُودِين"
      generation_method: taarib
      justification: "صيغة معربة تتبع النطق الإنجليزي بدقة، وردت في معاجم حديثة."
    - lemma: "عُنْصُرُ الـيُود"
      generation_method: tarkib
      justification: "تركيب وصفي/إضافي لتحديد طبيعة المفهوم كعنصر كيميائي."

stage2_evidence:
  per_lemma:
    - lemma: "يُود"
      confirm:
        - text: "«(اليود) عنصر لَا فلز صلب لَونه بنفسجي أدكن لَهُ بريق وَهُوَ يتسامى إِذا سخن (مج)»"
          source: "المعجم الوسيط"
        - text: "«يُود: العنصر الكيميائيّ رقم (53) وهو ضروريّ لتركيب الهرمونات الدرقية، كما أن لمحلوله فعالية مطهرة.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
    - lemma: "أَيُودِين"
      confirm:
        - text: "«الهالوجين: ... إحدى المجموعات الخمس الكيميائيّة التي تضمّ: الفلورين والكلورين والبرومين والأيودين والإستاتين.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "يُودِين"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "يود"
      decision: confirmed
      decision_reason: "اللمة الأساسية والمستقرة في المعاجم العربية الحديثة والمجامع اللغوية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "يُود"
    - lemma: "يُودِين"
      source: stage1
      decision: confirmed
      decision_reason: "تنويع اصطلاحي شائع جداً في الكتب المدرسية والجامعية للكيمياء، ويمثل تعريباً للفظ العالمي (Iodine)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "يُودِين", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14665575-n"}
    - lemma: "أَيُودِين"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة معربة موثقة في معاجم حديثة (مختار عمر) كجزء من قائمة الهالوجينات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أَيُودِين", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14665575-n"}

stage4_content:
  definition:
    current: "عنصر لافلزي ينتمي إلى الهالوجينات؛ يستخدم خاصة في الطب والتصوير الفوتوغرافي وفي الأصباغ"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يفتقر إلى التفاصيل الفيزيائية المميزة (اللون والتسامي) التي ترد عادة في المعاجم العربية الرصينة."
    authored:
      - type: terminological
        text: "عُنْصُرٌ كِيمْيَائِيٌّ لَا فِلِزِّيٌّ صَلْبٌ مِنْ مَجْمُوعَةِ الهَالُوجِينَاتِ، لَوْنُهُ رَمَادِيٌّ مَائِلٌ إِلَى السَّوَادِ وَبُخَارُهُ بَنَفْسَجِيٌّ، يَتَسَامَى عِنْدَ التَّسْخِينِ، يُسْتَخْدَمُ مُطَهِّرًا فِي الطِّبِّ وَفِي التَّصْوِيرِ الضَّوْئِيِّ وَصِنَاعَةِ الأَصْبَاغِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14665575-n", definition_index: 0, text: "عُنْصُرٌ كِيمْيَائِيٌّ لَا فِلِزِّيٌّ صَلْبٌ مِنْ مَجْمُوعَةِ الهَالُوجِينَاتِ، لَوْنُهُ رَمَادِيٌّ مَائِلٌ إِلَى السَّوَادِ وَبُخَارُهُ بَنَفْسَجِيٌّ، يَتَسَامَى عِنْدَ التَّسْخِينِ، يُسْتَخْدَمُ مُطَهِّرًا فِي الطِّبِّ وَفِي التَّصْوِيرِ الضَّوْئِيِّ وَصِنَاعَةِ الأَصْبَاغِ."}
  examples:
    per_lemma:
      - lemma: "يُود"
        examples:
          - text: "تُسْتَخْدَمُ صِبْغَةُ اليُودِ عَلَى نِطَاقٍ وَاسِعٍ لِتَطْهِيرِ الجُرُوحِ السَّطْحِيَّةِ."
            type: usage
      - lemma: "يُودِين"
        examples:
          - text: "يُعَدُّ اليُودِينُ أَحَدَ العَنَاصِرِ الأَسَاسِيَّةِ الَّتِي تَدْخُلُ فِي تَرْكِيبِ هُرْمُونَاتِ الغُدَّةِ الدَّرَقِيَّةِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُسْتَخْدَمُ صِبْغَةُ اليُودِ عَلَى نِطَاقٍ وَاسِعٍ لِتَطْهِيرِ الجُرُوحِ السَّطْحِيَّةِ."}

