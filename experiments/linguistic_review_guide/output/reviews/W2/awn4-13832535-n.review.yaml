# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة (وحدة) تفتقر إلى التشكيل الكامل في قاعدة البيانات"
      - "التعريف العربي الحالي ترجمة حرفية ركيكة للإنجليزية، وفيه قصور في كلمة «لكل» التي لم تُنوَّن تنويناً صحيحاً"
      - "المجموعة تحتوي على لمة واحدة فقط، وهي كافية للمفهوم لكن يستحسن التحقق من غياب لمات موازية"
    observations: >
      المجموعة تمثل مفهوم «الوحدة» بمعناه التجريدي الواسع: أي كيان — فرداً كان أم
      جماعةً أم هيكلاً — يُنظر إليه باعتباره مكوِّناً هيكلياً أو وظيفياً لمجموع أكبر.
      هذا المفهوم العام يختلف عن «الوحدة» بمعنى وحدة القياس أو وحدة العدد؛ فهو أقرب
      إلى معنى «الوِحدة التنظيمية» أو «العنصر البنيوي». الجذر وحد عريق في العربية
      ومتجذّر في مقاييس اللغة بمعنى الانفراد والتميّز. المجموعة الأم مشمولة ضمن
      آباء من قبيل «جُزْء» و«عُنْصُر» و«مُكَوِّن»، مما يؤكد السياق الهرمي الدلالي
      الصحيح.

  blind_candidates:
    - lemma: "خَلِيَّة"
      generation_method: majaz
      justification: >
        الخَلِيَّة في أصلها العربي القديم «بيت النحل الذي تعسِّل فيه» — وحدة مستقلة
        تؤدي وظيفة ضمن مجموع (خلية النحل ← خلية حية ← خلية تنظيمية). المجاز
        راسخ: الوَحدة المستقلة التي تشكّل مع أخواتها كلاً وظيفياً. يختبر سكّ
        المصطلح: «خلية» وحدها تحمل دلالة المكوِّن البنيوي.
    - lemma: "رُكِيزَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ركز على وزن فَعِيلَة؛ الركيزة «ما يُرتكز عليه»، وهي البنية
        الصغيرة التي يقوم عليها الكل ويتحمّلها. إحياء للمعنى القديم «المال
        المركوز» (ابن فارس) بإزاحة دلالية نحو «الوحدة الحاملة». تمرّ اختبار السكّ:
        لا يمكن إحلال مرادف بسهولة.
    - lemma: "نَوَاة"
      generation_method: majaz
      justification: >
        النواة في أصلها «عجم التمر»؛ ثم مُجِّزت إلى «نواة الذرة» ثم «نواة
        المجموعة». الإزاحة الدلالية من «البذرة المركزية» إلى «الوحدة الجوهرية»
        التي يتكوّن منها الكل. اللفظ ميّت بمعناه التمري وحي بمعناه العلمي، مما
        يُعدّ إحياءً ناجحاً.
    - lemma: "وِحْدَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر وحد على وزن فِعْلَة؛ الوحدة هي حالة الانفراد ثم مُجِّزت إلى
        «الشيء المنفرد المتمايز» الذي ينتمي إلى منظومة أكبر. الوزن «فِعْلَة»
        مناسب للمفاهيم الاسمية المجردة. هذا المصطلح هو الأكثر طبيعية اشتقاقياً
        للتعبير عن مفهوم «الوِحدة البنيوية».


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  query_log:
    - "استعلام ١: مطابقة دفعية لـ وحدة/الوحدة/خلية/الخلية/ركيزة/الركيزة/نواة/النواة"
    - "استعلام ٢: جسر إنجليزي unit/module/component/element/constituent"
    - "استعلام ٣: بحث فئوي لـ وحدة (arabterm مخصص)"
    - "استعلام ٤: مقاييس اللغة لجذور وحد/ركز/نوي/خلو"

  per_lemma:
    - lemma: "وحدة"
      confirm:
        - text: "«وَحَدَ — الْوَاوُ وَالْحَاءُ وَالدَّالُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ. مِنْ ذَلِكَ الْوَحْدَةِ. وَهُوَ وَاحِدُ قَبِيلَتِهِ، إِذَا لَمْ يَكُنْ فِيهِمْ مِثْلُهُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«وحدة — unit; component; device; package»"
          source: "المعجم الموحد لمصطلحات المياه (ARABTERM، 2000)"
        - text: "«وحدة — module» (مُكوِّن أو وحدة)"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (ARABTERM، 1996)"
        - text: "«وحدة — unit; unity»"
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM، 2017)"
        - text: "«وحدة — unit» (استخدام في الفيزياء والكيمياء والجيولوجيا والرياضيات)"
          source: "سلسلة المعاجم الموحدة — ARABTERM (متعدد)"
        - text: "«وحدة صغيرة محددة من المحتوى، وتمثل عنصراً واحداً من دورة أو برنامج»"
          source: "مسرد التربية — ARABTERM (1999)"
        - text: "«الوحدة اللغوية عنصر قابل للعزل ومحدد في مستوى معين من خلال العلاقات التي يربطها مع غيره من العناصر»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM، 2002)"
        - text: "«تتكوّن الوحدة في تكنولوجيا السيارات من جزء مُغلق، يتكوّن من مكونات ميكانيكية و/أو مكونات كهربائية وإلكترونية»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ARABTERM)"
        - text: "«الوحدة (في النظام السياسي) اتحاد أمتين أو أكثر في الرياسة والسياسة والجيش والاقتصاد بموجبها يكوّن أمة واحدة»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (hawramani)"
        - text: "«الوحدة: ما بها يُقال: لكل موجود واحد»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani، ت 1505)"
      expands:
        - text: "«كل ما يحدد ثقافيا كوحدة (شخص، شيء، عاطفة، فكرة، أمل، تخيل)، وهي دلالة تفرد أو فضاء اشتراك مفهومي»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM، 2002)"
          addition: "يوسّع المفهوم ليشمل أي كيان يُنظر إليه كوحدة متمايزة، مما يدعم الدلالة الواسعة للمجموعة"
        - text: "«الوحدة: الانفراد، والواحد الذي لا ينقسم بوجه لا فرضا ولا وهما ولا فعلا»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani، ت 1622)"
          addition: "يربط الوحدة بمفهوم الانفراد وعدم الانقسام — وهو جوهر مفهوم الوحدة البنيوية"

    - lemma: "خَلِيَّة"
      confirm:
        - text: "«(الخَلِيَّة) في علم الأحياء: وحدة بُنيان الأحياء من نبات أو حيوان، صغيرة الحجم لا ترى بالعين المجردة عامةً»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
        - text: "«خلية — cell» (الوحدة الفيزيولوجية والتكوينية للكائنات الحية)"
          source: "المعجم الموحد لمصطلحات علم الوراثة (ARABTERM، 2009)"
        - text: "«خلية — cell» (أصغر وحدة حية مكونة للأنسجة)"
          source: "معجم المصطلحات الطبية ج.1 (ARABTERM، 1985)"
        - text: "«خلية — cell» (وحدة شبه موصلة أو أصغر جزء من وحدة كهرضوئية)"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (ARABTERM، 1996)"
      contradicts:
        - text: "«الخَلِيَّةُ: بيت النحل الذي تعسِّل فيه... السفينة العظيمة... المطلَّقة من عِقَالٍ ترعى حيث شاءت»"
          source: "المعجم الوسيط — كتاب العين (OCR)"
          conflict: "اللفظ الأصلي يحمل دلالات غير ذات صلة بالمفهوم (سفينة، ناقة، مرأة مطلقة) مما يُحدث اشتراكاً لفظياً مع المفهوم المطلوب"
        - text: "«خَلَوَ — الخاء واللام والحرف المعتل أصل واحد يدل على تعرّي الشيء من الشيء»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر الأصلي يدل على الخلوّ والتعري، لا على التركيب والانتماء لكلٍّ أشمل"

    - lemma: "رُكِيزَة"
      confirm:
        - text: "«الرِّكيزة: ما يرتكز عليه، القطعة من جواهر الأرض المركوزة فيها»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الركيزة: ما يرتكز عليه والقطعة من جواهر الأرض المركوزة فيها (ج) ركاز وركائز»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«الرِّكازَة: ما يُرتكز عليه (في اصطلاح الرمّالين): العتبة الداخلة، سُمِّيت بذلك؛ لأنها دليل الكنوز والدفائن»"
          source: "المعجم الكبير (OCR)"
      contradicts:
        - text: "«رَكَزَ — الراء والكاف والزاء أصلان: أحدهما إثبات شيء في شيء يذهب سُفلاً، والآخر صوت»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المعنى الأصلي «إثبات شيء في الأرض» يعني الثبات والأساس لا الانتماء لمجموع؛ الركيزة تعني «الدعامة» لا «الوحدة البنيوية»"

    - lemma: "نَوَاة"
      confirm:
        - text: "«النَّوَاةُ: عجم التمر والزبيب ونحوهما... جزء الذرة الجوهري الذي تدور حوله الإلكترونات (محدثة)»"
          source: "المعجم الوسيط (OCR)"
        - text: "«النواة: عجمة التمر ونحوه أي حبّه وبِزره»"
          source: "التعريفات الفقهية للبركتي (hawramani)"
      contradicts:
        - text: "«نَوَى — النون والواو والحرف المعتل أصل صحيح يدل على معنيين: أحدهما مقصد لشيء، والآخر عجم شيء»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "النواة تعني المركز/الجوهر الداخلي، لا الوحدة البنيوية العامة التي قد تكون فرداً أو مجموعةً أو هيكلاً"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمة الموجودة ──
    - lemma: "وحدة"
      decision: confirmed
      decision_reason: >
        اللمة مؤيَّدة بأدلة معجمية ساحقة من عشرات المصادر الحديثة والكلاسيكية. الجذر
        وحد عريق في العربية بمعنى الانفراد والتمايز، وهو جوهر مفهوم الوحدة البنيوية.
        المصطلح ثابت في جميع المجالات التقنية العربية (ARABTERM) بمعنى unit/component/
        module. تجتاز اختبار السكّ: اللفظ مصطلح معجمي ثابت لا وصف حر. تجتاز معايير
        جودة المصطلح الستة: اطّراد، يُسر، ملاءمة، إيثار تراثي (الجذر وحد)، إيثار
        عربي، اشتقاقية. الوزن الصرفي (فِعْلَة/فَعْلَة) مناسب للمفاهيم الاسمية.
        اللمة تحتاج فقط تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المجموعة تحتوي على لمة واحدة مؤكدة؛ لا توجد لمات أخوات في هذه المجموعة
        تستدعي توثيق الفارق. وَحْدَة هنا بمعناها التجريدي البنيوي: الكيان الذي
        يُنظر إليه كوحدة وظيفية أو هيكلية في سياق منظومة أشمل، وهو أخص من «جُزْء»
        ومن «عُنْصُر» في أن الوحدة تنطوي على قدر من الاستقلالية والتماسك الداخلي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَحْدَة"

    # ── مرشح المرحلة ١ — خلية ──
    - lemma: "خَلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        خَلِيَّة تُستخدم عربياً بمعنى cell (البيولوجية والكهروكيميائية والتنظيمية)،
        وهي أخص من مفهوم المجموعة الترادفية الذي يشمل أي كيان يُعدّ مكوِّناً. علاوةً
        على ذلك، الجذر خلو يدل أصلاً على الخلو والتعري، مما يعني تناقضاً مفهومياً مع
        دلالة الانتماء والتركيب المطلوبة. الاشتراك اللفظي الكثيف (سفينة، ناقة، مرأة
        مطلقة) يُشكّل عبئاً لغوياً. خلية مرشحة لمجموعة ترادفية أخص هي «خلية حيوانية
        أو نباتية».
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ — ركيزة ──
    - lemma: "رُكِيزَة"
      source: stage1
      decision: removed
      decision_reason: >
        الركيزة تعني في المعاجم «ما يرتكز عليه» أي الدعامة أو الأساس — وهو معنى
        مختلف عن «الوحدة البنيوية». الركيزة تصف علاقة الحمل والدعم (أن شيئاً آخر
        يرتكز عليها)، لا علاقة الانتماء لكلٍّ وظيفي. إن صاغ ابن فارس الجذر بـ
        «إثبات شيء في شيء يذهب سُفلاً»، فذلك يؤكد أن الركيزة عنصر تأسيسي ثابت،
        لا وحدة متميزة انتمائية. المعنى لا يطابق دلالة المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١ — نواة ──
    - lemma: "نَوَاة"
      source: stage1
      decision: removed
      decision_reason: >
        النواة تعني المركز أو الجوهر الداخلي (نواة الذرة، النواة البيولوجية)، وهي
        دلالة تخصيصية تشير إلى «المركز» لا إلى «الوحدة» بمفهومها الواسع. مفهوم
        المجموعة يشمل الفرد والمجموعة والهيكل كأي كيان يُعدّ مكوِّناً — وهو أشمل
        من دلالة النواة. أصل الجذر نوى يدل على المقصد والعجم لا على الانتماء
        البنيوي. النواة مناسبة لمجموعة مختلفة تخص «النواة/المركز».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


