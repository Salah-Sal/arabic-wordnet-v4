# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «عَدَم حَرَكَة» عبارة وصفية تركيبية لا مصطلح معجمي مُثبَّت؛ تفشل اختبار السكّ (يصحّ إبدال «عدم» بـ«انعدام»)، وتتداخل مع المصطلح الطبي «poverty of movement» (فقر الحركة/نقص الحركة) الوارد في المعجم الطبي الموحد."
      - "التعريف الحالي «صفة عدم التحرك» مقتضب جداً ويعكس الإنجليزية مباشرةً دون صياغة معجمية عربية مُستقلة."
      - "غياب الفرق الدلالي الموثَّق بين «جُمُود» و«سُكُون»، مع وجود تداخل في المعنى."
    observations: >
      المجموعة تُناول «اللاحركية» (immobility) بوصفها صفةً مجردةً جنسها الأعلى «الصفة الجوهرية
      المميزة». اللمّتان «جُمُود» و«سُكُون» راسختان في التراث العربي وموثَّقتان في معاجم الاصطلاح
      الفلسفي والعلم الكلامي. غير أن «جُمُود» يحمل بُعداً إضافياً يتعلق بالتصلّب (rigidity) مادةً
      ومجازاً، بينما «سُكُون» هو المصطلح الفلسفي الأدق لعدم الحركة عند الحكماء. أما «عَدَم حَرَكَة»
      فليس مصطلحاً مسكوكاً بل وصف تركيبي مجاز في الكلام العادي.
  blind_candidates:
    - lemma: "رُكُود"
      generation_method: ishtiqaq
      justification: "من جذر ركد على وزن فُعُول؛ أصله الاشتقاقي يدل على السكون (مقاييس اللغة: «أصل يدل على سكون»). ورد في حديث الصلاة بمعنى السكون الفاصل بين الحركات."
    - lemma: "خُمُود"
      generation_method: majaz
      justification: "من جذر خمد؛ ابن فارس: «يدل على سكون الحركة والسقوط». نقل مجازي من سكون النار وانطفائها إلى صفة عدم الحركة العامة."
    - lemma: "لَاتَحَرُّكِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على صيغة (لا + مصدر + ية) من الجذر حرك؛ يُعبِّر صراحةً عن «صفة عدم التحرك» بالأسلوب الاشتقاقي المنتج في العربية المعاصرة."
    - lemma: "سُكُونِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي (سكون + ية) يُحوِّل سُكُون إلى مفهوم مجرد صريح يعبّر عن صفة الثبات وانعدام الحركة."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (4 استعلامات):
#   ١. مطابقة دفعية: جمود/سكون/عدم حركة/ركود/خمود/لاتحركية/سكونية + صيغ ال-
#   ٢. جسر إنجليزي: immobility/motionlessness/stillness/fixedness/inertness
#   ٣. إثراء بالمعرّف: تعريفات + شواهد للمداخل المُحددة
#   ٤. مقاييس اللغة: جذور جمد/سكن/ركد/خمد/حرك
stage2_evidence:
  per_lemma:
    - lemma: "جُمُود"
      confirm:
        - text: "«الجمود: [في الانكليزية] Rigidity، immobility، inertia، catatonia [في الفرنسية] Rigidite، immobilite، inertie، catatonie. بضم الجيم والميم عند الأطباء علة إذا عرضت للإنسان بقي على الحالة التي أدركته عليها إما جالساً أو قائماً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت1777م)"
        - text: "«الجمود: هيئة حاصلة للنفس بها يقتصر عن استيفاء ما ينبغي وما لا ينبغي»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت1622م)"
      expands:
        - text: "«الجمود: هو هيئة حاصلة للنفس بها يقتصر على استيفائها ما ينبغي وما لا ينبغي»"
          source: "كتاب التعريفات للشريف الجرجاني (ت1413م)"
          addition: "يُثبت الجرجاني استخدام الجمود اصطلاحاً لحالة الخمول وعدم الاستجابة الإرادية، وهو جانب من معنى immobility."
        - text: "«جمود» → translation_en: inertia (domain: AGROVOC)"
          source: "المَكنَز الزراعي متعدد اللغات (arabterm)"
          addition: "يُستعمل جمود في بعض المصطلحات التقنية مقابل inertia (القصور الذاتي) إلى جانب immobility."

    - lemma: "سُكُون"
      confirm:
        - text: "«السكونُ: عدم الحركة فيما من شأنه أن يتحرك»"
          source: "معجم مقاليد العلوم للسيوطي (ت1505م)"
        - text: "«السكون: هو عدم الحركة عما من شأنه أن يتحرك، فعدم الحركة عما ليس من شأنه الحركة لا يكون سكونًا، فالموصوف بهذا لا يكون متحركًا ولا ساكنًا»"
          source: "كتاب التعريفات للشريف الجرجاني (ت1413م)"
        - text: "«السّكون: [في الانكليزية] Absence of vowel، immobilitiy»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت1777م)"
      expands:
        - text: "«السّكُون: عِنْد الْحُكَمَاء عدم الْحَرَكَة عَمَّا من شَأْنه أَن يَتَحَرَّك فالمجردات غير متحركة وَلَا سَاكِنة إِذْ لَيْسَ من شَأْنهَا الْحَرَكَة. والتقابل بَينهمَا تقَابل الْعَدَم والملكة»"
          source: "دستور العلماء للأحمدنكري"
          addition: "يكشف النص عن التمييز الفلسفي الدقيق: السكون عدم الحركة في الشيء القابل لها بطبعه، وهو التعريف المطابق لمفهوم immobility في المجموعة."
        - text: "«السِّينُ وَالْكَافُ وَالنُّونُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى خِلَافِ الِاضْطِرَابِ وَالْحَرَكَةِ. يُقَالُ سَكَنَ الشَّيْءُ يَسْكُنُ سُكُونًا فَهُوَ سَاكِنٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر سكن يدل أصلاً على خلاف الحركة، مما يُرسّخ «سكون» كالمصطلح الأصيل الأوسع لمفهوم عدم الحركة."

    - lemma: "عَدَم حَرَكَة"
      contradicts:
        - text: "«عَدْمُ الحَرَكَة» → translation_en: poverty of movement (domain: The Unified Medical Dictionary)"
          source: "المعجم الطبي الموحد (2009م)"
          conflict: "«poverty of movement» مصطلح طبي يعني قلّة الحركة ونقصها (hypokinesia/bradykinesia)، وهو مفهوم طبي مغاير تماماً لـ immobility (الانعدام الكلي للحركة). إسناد هذه العبارة للمجموعة يُنشئ تداخلاً مصطلحياً مُضلِّلاً."

    - lemma: "رُكُود"
      confirm:
        - text: "«الرُّكودُ: السُّكونُ، والثَّباتُ»"
          source: "القاموس المحيط للفيروزآبادي (ت1414م)"
        - text: "«رُكُود: من (ر ك د) السكون والهدوء والثبات»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«فى رُكُوعِها وسُجُودِها ورُكودِها» [الركود: السكون الذي يفصل بين حركات الصلاة]"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«(رَكَدَ) الرَّاءُ وَالْكَافُ وَالدَّالُ أَصْلٌ يَدُلُّ عَلَى سُكُونٍ. يُقَالُ رَكَدَ الْمَاءُ: سَكَنَ. وَرَكَدَتِ الرِّيحُ. وَرَكَدَ الْقَوْمُ رُكُودًا: سَكَنُوا وَهَدَءُوا»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«ركود» → translation_en: stagnation (domain: Commerce and Accounting / Economics / Geology / Seismology)"
          source: "مصطلحات arabterm متعددة (1989-2000م)"
          conflict: "الركود في الاستعمال المعاصر الراسخ يُقابل stagnation/recession لا immobility؛ وهذا يُنشئ اشتراكاً لفظياً يُضلِّل المستخدم عند استخدامه للدلالة على عدم الحركة الكلي."

    - lemma: "خُمُود"
      confirm:
        - text: "«(خَمَدَ) الْخَاءُ وَالْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى سُكُونِ الْحَرَكَةِ وَالسُّقُوطِ. خَمَدَتِ النَّارُ خُمُودًا، إِذَا سَكَنَ لَهَبُهَا. وَخَمَدَتِ الْحُمَّى إِذَا سَكَنَ وَهَجُهَا. وَيُقَالُ لِلْمُغْمَى عَلَيْهِ: خَمَدَ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«الخُمُودُ: حفرةٌ تُدفَن فيها النار لتُخمد»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصيل في المعاجم الحديثة هو الحفرة التي تُطفأ فيها النار لا صفة عدم الحركة."
        - text: "«الخُمُودُ: ضعف الْقُوَّة الشهوية عَن تنَاول مَا يَنْبَغِي فِي الشَّرْع»"
          source: "معجم مقاليد العلوم للسيوطي (ت1505م)"
          conflict: "الاصطلاح الفلسفي يخصّ خمود الشهوة لا انعدام الحركة الجسدية."
        - text: "«خمود» → translation_en: damping (domain: Physics)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989م)"
          conflict: "في الاستعمال التقني، خمود يقابل damping (التخميد الفيزيائي) لا immobility."

    - lemma: "لَاتَحَرُّكِيَّة"
      confirm:
        - text: "«ثبات؛ جمود؛ لاتحرّكية.» [مقابل: immobility]"
          source: "المورد الحديث (2008م)"

    - lemma: "سُكُونِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "جُمُود"
      decision: confirmed
      decision_reason: "موثَّق صراحةً في معاجم الاصطلاح مقابل immobility بلغات متعددة (التهانوي 1777). يستوفي معايير الجودة المصطلحية: مشتق من جذر عربي صحيح، راسخ في الاستعمال الفلسفي والطبي، قابل للاشتقاق والتثنية والجمع."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يتضمن دلالة التصلّب والصلابة المادية أو المجازية (كجمود الفكر، جمود الرأي)؛ يُوحي بعجز مرضي أو بنيوي عن التحرك أو التكيف، ويُستعمل في السياق الطبي (catatonia) والفلسفي."

    - lemma: "سُكُون"
      decision: confirmed
      decision_reason: "التعريف المعجمي المتكرر في كتب الاصطلاح العربية هو «عدم الحركة عما من شأنه أن يتحرك»، وهو يُطابق تعريف المجموعة تماماً. أدقّ اللمّات الموجودة دلالةً على المفهوم الفلسفي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الفلسفي الكلاسيكي الأدق لانعدام الحركة؛ يؤكد على غياب الحركة في الجسم القابل لها بطبعه، ويُقابل الحركةَ تقابلَ العدم والملكة. لا يحمل دلالة التصلّب كما في «جمود»، وله استعمالات موازية في النحو والتصوف."

    - lemma: "عَدَم حَرَكَة"
      decision: removed
      decision_reason: "يفشل اختبار التثبيت المعجمي: يصح إبدال «عدم» بـ«انعدام» أو «غياب» وتبقى العبارة صالحة وصفاً → ليست مصطلحاً ثابتاً. فضلاً عن ذلك، يرصد المعجم الطبي الموحد «عدم الحركة» مقابل «poverty of movement» (hypokinesia) لا immobility، مما يُوجد تعارضاً مصطلحياً مع مفهوم طبي آخر. العبارة تُكرر التعريف ذاته (دوران)."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "رُكُود"
      source: stage1
      decision: removed
      decision_reason: "رغم أن الأصل الاشتقاقي لركود هو السكون والثبات، فإن الاستعمال المعاصر الراسخ في المعاجم التقنية (1989-2000م) يُثبّت ركود مقابل stagnation/recession في الاقتصاد والعلوم الطبيعية؛ مما يُنشئ اشتراكاً لفظياً يُضلّل المستخدم عند الدلالة على immobility. الدلالة الكلاسيكية باتت متراجعة أمام المعنى الاقتصادي."

    - lemma: "خُمُود"
      source: stage1
      decision: removed
      decision_reason: "الأصل الاشتقاقي يدل على سكون النار وانطفائها؛ ولا يُستعمل في المعاجم الحديثة للدلالة على immobility، بل يقابل damping (فيزياء) وabatement (طب). التعريف الحديث الراسخ (المعجم الوسيط) يخصّه بـ«حفرة تُدفَن فيها النار»."

    - lemma: "لَاتَحَرُّكِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "موثَّق في المورد الحديث (2008م) بوصفه مقابلاً عربياً لـ immobility. مصدر صناعي مُنتج (لا + تحرّك + ية) على نمط فصيح معتمَد، يُعبِّر صراحةً عن «صفة عدم التحرك»، مستوفٍ لشروط الاشتقاقية والاطّراد ويُسر التداول، خالٍ من الاشتراك اللفظي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح حديث صريح للسياقات العلمية والطبية؛ لا يحمل الدلالة المجازية لـ«جمود» ولا الاستعمال الفلسفي الكلاسيكي المتشعّب لـ«سكون»؛ أوضح لمّات المجموعة في التعبير عن المفهوم المجرد مباشرةً."
      actions:
        - command: create_entry
          params:
            lemma: "لَاتَحَرُّكِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "سُكُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا وجود لهذا الشكل في أي معجم مُستعلَم. المصدر الصناعي «سكونية» غير مُعتمَد ولا مسجَّل، ولا حاجة إليه مع وجود «سُكُون» و«لاتحرُّكية»."


