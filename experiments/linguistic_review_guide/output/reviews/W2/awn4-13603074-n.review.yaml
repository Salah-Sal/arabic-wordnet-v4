# مراجعة المجموعة الترادفية: awn4-13603074-n (chlorinity)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «كُلُورِيَّة» غير مسجّلة في المعاجم المتاحة؛ المعجم الموحد لمصطلحات المياه يسجّل «كُلورينية» بدلاً منها"
      - "المفهوم علمي تخصصي جداً (كيمياء المحيطات) ويفتقر إلى مصطلح عربي أصيل"
      - "التعريف العربي الحالي ترجمة حرفية عن الإنجليزية ويحتاج إلى صياغة معجمية"
    observations: "المفهوم يدلّ على مقياس كمّي لتركيز الكلور والهاليدات في الماء، وهو مصطلح متخصص في علوم المحيطات (أوقيانوغرافيا). الجذر «كلور» معرَّب وليس عربياً أصيلاً، والاشتقاق منه بالمصدر الصناعي (-يَّة) هو الطريقة الأكثر إنتاجية في المصطلحية العربية الحديثة. المفهوم المجاور هو «المُلوحة» (salinity) لكنه أعمّ ويشمل جميع الأملاح لا الكلور وحده."

  blind_candidates:
    - lemma: "كُلُورِيَّة"
      generation_method: taarib
      justification: "مصدر صناعي من «كُلُور» المعرَّب على وزن فُعُولِيَّة، يدلّ على خاصية الكلورية أي نسبة الكلور في الماء، وهو أكثر الصيغ إيجازاً واطّراداً"
    - lemma: "كُلُورِينِيَّة"
      generation_method: taarib
      justification: "تعريب أقرب للأصل الإنجليزي chlorinity مع لاحقة المصدر الصناعي، وقد يكون أدقّ في التمييز عن الكَلْوَرة (chlorination)"
    - lemma: "نِسْبَةُ الكُلُور"
      generation_method: tarkib
      justification: "مركب إضافي يصف المفهوم وصفاً شفّافاً: النسبة الكمّية للكلور في الماء"
    - lemma: "مُحْتَوَى الهَالِيدَات"
      generation_method: tarkib
      justification: "مركب إضافي يعكس الجانب الأشمل من التعريف وهو قياس الهاليدات لا الكلور وحده"


stage2_evidence:
