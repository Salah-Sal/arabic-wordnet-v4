          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "المدخل مسجّل رسمياً في معجم المياه الموحد مقابل chlorinity بالإنجليزية، لكن بصيغة كُلورينية لا كُلورينيَّة"

    - lemma: "نِسْبَةُ الكُلُور"
      evidence_status: "no_material_found"

    - lemma: "مُحْتَوَى الهَالِيدَات"
      evidence_status: "no_material_found"

    - lemma: "كَلْوَرَة"
      contradicts:
        - text: "«إدخال عنصر الكلور في تركيب مركب ما»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "الكَلْوَرة تعني عملية الكلورة (chlorination) لا قياس نسبة الكلور (chlorinity)"
        - text: "«إضافة الكلور إلى مياه الشرب أو المياه العادمة عادة لأغراض التعقيم»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "تأكيد أن الكلورة هي عملية المعالجة لا القياس"

    - lemma: "مُلُوحَة"
      contradicts:
        - text: "«كمية المواد الصلبة (الأملاح) الذائبة في الماء»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "الملوحة (salinity) مفهوم أعمّ يشمل جميع الأملاح الذائبة، بينما الكلورية تقيس الكلور والهاليدات تحديداً"
        - text: "«قياس تركّز الأملاح الذائبة، وخصوصاً كلوريد الصوديوم، في المياه المالحة ومياه البحر»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "الملوحة تقيس مجموع الأملاح وليس الكلور تحديداً"


stage3_analysis:
  per_lemma:
    - lemma: "كُلُورِيَّة"
      decision: confirmed
      decision_reason: "صيغة عربية سليمة على وزن المصدر الصناعي من «كُلُور» المعرَّب، أقصر وأطوع للاشتقاق من الصيغة المنافسة «كُلورينية». وإن لم تُسجَّل بهذا الشكل في معاجم ALECSO، فإنها تتّفق مع القياس الصرفي العربي في تكوين المصطلحات (قارن: حَرارِيَّة، كَهْرَبائِيَّة). تحتاج تصحيح التشكيل إلى كُلُورِيَّة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة المختصرة والأكثر اطّراداً مع القياس العربي للمصدر الصناعي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كُلُورِيَّة"

    - lemma: "كُلُورِينِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "الصيغة المسجّلة في المعجم الموحد لمصطلحات المياه هي «كُلورينية» وهي أقرب للأصل الإنجليزي chlorinity. تُضاف كمرادف رسمي موثّق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "صيغة أقرب إلى الأصل الإنجليزي، مسجّلة في المعجم الموحد لمصطلحات المياه، تتميّز بوضوح اشتقاقها من chlorinity"
      actions:
        - command: create_entry
          params: {lemma: "كُلُورِينِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "نِسْبَةُ الكُلُور"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ لا مصطلح مسكوك؛ يمكن إبدال «نسبة» بـ«مقدار» أو «كمية» ويبقى صالحاً (إخفاق اختبار السكّ). كما أنه غير مسجّل في أي معجم متخصص مقابل chlorinity."

    - lemma: "مُحْتَوَى الهَالِيدَات"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ يخفق في اختبار السكّ (يمكن قول: مقدار الهاليدات، نسبة الهاليدات). فضلاً عن ذلك، chlorinity تقيس الكلوريدات تحديداً وليس جميع الهاليدات في الاستعمال العملي."


