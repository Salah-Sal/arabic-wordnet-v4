# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13818615-n  |  ILI: i109407  |  POS: n
# Concept: unrelatedness — the lack of any particular manner of connectedness
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'عَدَم الارْتِبَاط' تعبير وصفي مركب (MWE إضافي) لا مصطلح مفرد مسكوك بجذر مستقل"
      - "تشكيل اللمّة ناقص: يجب عَدَمُ الِارْتِبَاطِ (بضم عدم وكسر الارتباط)"
      - "تداخل دلالي مع الهيبرنيم المباشر (انفصال / عَدَم التَّرَابُط) يستوجب توثيق الفارق الدقيق"
      - "المجموعة تفتقر إلى لمّة مفردة ذات جذر مستقل تُعبِّر عن هذا المفهوم"
    observations: >-
      المجموعة تُمثِّل مفهوماً منطقياً/فلسفياً مجرداً هو انعدام أي وجه للصلة بين الأشياء.
      العربية تُعبِّر عن هذا المفهوم عادةً بصيغة (عدم + مصدر) وهي صيغة وصفية لا مصطلحية صرفة.
      الهيبرنيم المباشر (انفصال / عدم الترابط) يشترك مع هذه المجموعة في المعنى العام،
      والفارق الدقيق أن الهيبرنيم يدل على الانقطاع كحالة كلية، في حين هذه المجموعة
      تُركِّز تحديداً على انعدام أيِّ نوع بعينه من الارتباط — وهو تقييد دلالي أضيق.
      الجذر 'ربط' راسخ في المعاجم العربية بمعنى الشد والثبات (مقاييس ابن فارس)
      والمصدر 'ارتباط' موثَّق في عشرات المعاجم التقنية بمعاني: correlation, linkage, dependence.

  blind_candidates:
    - lemma: "اللاتَرَابُطِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي منفي من الفعل الخماسي 'تَرَابَطَ' (جذر ربط)؛ بإضافة 'لا' النافية
        وياء النسب والتاء المربوطة على غرار 'اللاخطيَّة' و'اللامركزيَّة'. يدل على
        الحالة المجردة لانعدام الترابط من أي نوع بين عناصر مجموعة.
    - lemma: "الانفِصامِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من 'انفصم' (جذر فصم) على وزن الانفعالية. الفصم أشد من الفصل:
        يدل على الانكسار التام لا مجرد الفصل، فيفيد غياب أي رابط من أساسه.
        يُميَّز عن 'الانفصالية' بأن الفصم يستوجب انكساراً لا فصلاً فحسب.
    - lemma: "التَّنَاكُر"
      generation_method: majaz
      justification: >-
        من جذر 'نكر'، الأصل في خلاف المعرفة. يُستعار للدلالة على غياب أي وجه من
        أوجه الصلة والتعارف بين الأشياء — كأن كل شيء منها ينكر الآخر ولا يتعرّف
        إليه. ويمتاز بأنه لفظ مفرد ذو جذر ثلاثي فصيح.
    - lemma: "البَيْنُونَة"
      generation_method: majaz
      justification: >-
        من جذر 'بين' (بانَ يَبينُ بينونةً) بمعنى البُعد والانفراد. لفظ عربي فصيح
        قديم يدل على الفراق التام والانفصال، يُحتمل إحياؤه للدلالة على الحالة
        المجردة لانعدام الصلة — وفيه إزاحة دلالية من معنى الفراق إلى معنى الانعدام.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "عَدَم الارْتِبَاط"
      expands:
        - text: "«لاعلاقة؛ عدم الإرتباط؛ اللاعلاقية»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: >-
            يُثبت أن التعبير 'عدم الارتباط' مستعمَل في السياق التقني المعياري
            كأحد مقابلات 'irrelevance' جنباً إلى جنب مع 'لاعلاقة' و'اللاعلاقية'،
            مما يُؤكد تداول الصيغة وإن كان المفهوم الإنجليزي المستهدف (irrelevance)
            قريباً من unrelatedness لا مطابقاً له. كما يكشف وجود منافس مصطلحي
            مفرد هو 'اللاعَلاقيَّة'.

    - lemma: "اللاتَرَابُطِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الانفِصامِيَّة"
      evidence_status: "no_material_found"

    - lemma: "التَّنَاكُر"
      contradicts:
        - text: "«تناكر: antipathy»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >-
            التناكر في المعجم الطبي الموحد يُقابَل بـ'antipathy' (نفور/بغض)،
            وهو علاقة سلبية نشطة تختلف جوهرياً عن مجرد غياب الصلة.
        - text: "«(تناكر) فلانٌ تجاهل وَالْقَوْم تعادوا وَأنكر بَعضهم بَعْضًا وَالْأَمر ادَّعى جهلَه»"
          source: "المعجم الوسيط"
          conflict: >-
            يدل على التعادي والتجاهل المتعمَّد؛ وهو يستلزم طرفين على علاقة سابقة
            أو حالية أنكرها أحدهما، لا على انعدام الصلة ابتداءً.
        - text: "«فلانٌ: تجاهل. القومُ: تعادَوْا وأنكر بعضُهم بعضاً. الأمرَ: ادَّعى جهلَه»"
          source: "المعجم الكبير"
          conflict: >-
            المصدر الأكثر موثوقيةً يؤكد نفس المعنى: التجاهل المتعمَّد والتعادي،
            لا الانعدام الأصلي للصلة.

    - lemma: "البَيْنُونَة"
      contradicts:
        - text: "«موضعٌ بالبحرين»"
          source: "المعجم الكبير"
          conflict: >-
            وردت البينونة في أوثق المعاجم المعاصرة (المعجم الكبير) اسم علم لموضع
            جغرافي (pos: proper_noun) لا اسم جنس، مما يسدّ باب توظيفها مصطلحاً
            جديداً في العربية المعاصرة.
      expands:
        - text: "«بَيْنُونة: من (ب ي ن) البعد والانفصال وموضع بالبحرين»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >-
            يُثبت الاشتقاق من جذر 'بين' بمعنى البُعد والانفصال، مما يُؤكد الأصل
            الدلالي للكلمة، لكن غلبة الاستعمال الاسمي العلمي يحول دون توظيفها.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "عَدَم الارْتِبَاط"
      decision: confirmed
      decision_reason: >-
        التعبير موثَّق في المعاجم التقنية المعيارية (IEC 60050) ويؤدي المعنى المطلوب.
        يتسق مع النمط الإنتاجي (عدم + مصدر) المستعمَل في الأدبيات الفلسفية والمنطقية
        العربية. اجتاز اختبارات الجودة الستة بما يكفي للتأكيد مع تحفظ على غياب
        المصطلح المفرد. التشكيل الحالي ناقص ويحتاج تصحيحاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        اللمّة الوحيدة في المجموعة؛ تُعبِّر عن غياب أيِّ نوع مُحدَّد من الارتباط
        بصيغة النفي الإضافي (عدم + مصدر)، مُبرِزةً الطابعَ المصدري للمفهوم الغائب.
        تتميز عن الهيبرنيم (انفصال / عَدَم التَّرَابُط) بأنها تُقيِّد الغياب بوصفه
        غياباً لأيِّ وجه بعينه لا انقطاعاً كلياً مطلقاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ الِارْتِبَاطِ"

    - lemma: "اللاتَرَابُطِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا يرد في أي مصدر من مصادر قاعدة البيانات المعجمية المستعلَمة.
        الصيغة مقبولة قياساً على المصطلحات المنفية (اللاخطية، اللامركزية) لكنها
        تفتقر إلى التثبيت المعجمي الضروري لقبول اللمّة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "الانفِصامِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        الانفصامية راسخة في الاصطلاح الطبي العربي الحديث مرتبطةً بالانفصام النفسي
        (schizophrenia) مما يُنشئ اشتراكاً لفظياً ضاراً يمنع توظيفها في هذا السياق
        المنطقي/الفلسفي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "التَّنَاكُر"
      source: stage1
      decision: removed
      decision_reason: >-
        الأدلة المعجمية المتعددة تُثبت أن التناكر يدل على التعادي والنفور المتبادل
        (antipathy) أي علاقة سلبية نشطة، لا على مجرد غياب الصلة ابتداءً.
        المفهوم المطلوب هو انعدام الرابط لا وجود رابط سلبي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "البَيْنُونَة"
      source: stage1
      decision: removed
      decision_reason: >-
        وردت في المعاجم الموثوقة اسمَ علم جغرافي (proper_noun) في المقام الأول.
        وإن كان أصلها الاشتقاقي (بان يبين) يدل على البُعد، فإن غلبة الاستعمال
        الاسمي العلمي تسدّ باب إعادة توظيفها مصطلحاً منطقياً مجرداً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "غياب أي طريقة معينة للترابط"
    assessment:
      decision: revise
      reason: >-
        'طريقة' ترجمة آلية غير ملائمة لـ'manner' في هذا السياق المنطقي؛ الأدق
        'وَجْه' (أحد أوجه العلاقة). كما تفتقر الصياغة إلى تحديد طرفَي العلاقة
        (بين شيئين أو أكثر) مما يجعلها أقل دقةً من التعريف الإنجليزي الأصل.
    authored:
      - type: terminological
        text: "حالَةُ انعِدامِ أيِّ وَجْهٍ مُحَدَّدٍ مِن أوجُهِ الصِّلَةِ أو الارتِبَاطِ بَيْنَ شَيئَيْنِ أو أكثَرَ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "انعِدامُ أيِّ نَوعٍ مِن أنواعِ الرَّابِطِ أو الصِّلَةِ المُشتَرَكَةِ بَيْنَ الأشياءِ"
        quality_check:
          genus_present: false
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13818615-n"
          definition_index: 0
          text: "حالَةُ انعِدامِ أيِّ وَجْهٍ مُحَدَّدٍ مِن أوجُهِ الصِّلَةِ أو الارتِبَاطِ بَيْنَ شَيئَيْنِ أو أكثَرَ"
      - command: add_definition
        params:
          synset_id: "awn4-13818615-n"
          text: "انعِدامُ أيِّ نَوعٍ مِن أنواعِ الرَّابِطِ أو الصِّلَةِ المُشتَرَكَةِ بَيْنَ الأشياءِ"

  examples:
    per_lemma:
      - lemma: "عَدَمُ الِارْتِبَاطِ"
        examples:
          - text: "خَلَصَ التَّحليلُ الإحصائيُّ إلى عَدَمِ الارتِبَاطِ بَيْنَ المُتَغَيِّرَيْنِ، إذ لم تَظهَرْ أيُّ صِلَةٍ مُحدَّدةٍ تَجمَعُهُما."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "خَلَصَ التَّحليلُ الإحصائيُّ إلى عَدَمِ الارتِبَاطِ بَيْنَ المُتَغَيِّرَيْنِ، إذ لم تَظهَرْ أيُّ صِلَةٍ مُحدَّدةٍ تَجمَعُهُما."


