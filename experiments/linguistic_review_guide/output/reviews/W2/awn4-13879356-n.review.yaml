# ═══════════════════════════════════════════════════════════════
# مراجعة: awn4-13879356-n — ungradable opposition
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تَقَابُل غَيْر مُتَدَرِّج» مركب وصفي طويل (ثلاث كلمات) يبدو ترجمة حرفية للمصطلح الإنجليزي ungradable opposition"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهذا يضعف التغطية المعجمية"
      - "في التراث المنطقي العربي يوجد مصطلح «التناقض» الذي يدل على نفس المفهوم (تقابل لا واسطة فيه) لكنه يحمل دلالات منطقية أوسع"
    observations: >
      المفهوم المقصود هو نوع من التقابل الدلالي لا يقبل التدرج ولا الوسط بين طرفيه
      (مثل: حيّ/ميت، ذكر/أنثى). في التراث العربي المنطقي يُعرف هذا بـ«تقابل التناقض»
      حيث يمتنع اجتماع النقيضين وارتفاعهما معاً، بخلاف «تقابل التضاد» الذي يقبل الواسطة.
      المصطلح الحالي «تقابل غير متدرج» يتبع نمطاً منتجاً في المصطلحية اللسانية العربية المعاصرة
      (قياساً على: تقابل سالب، تقابل ثنائي، تقابل تناسبي) لكنه ترجمة حرفية.
  blind_candidates:
    - lemma: "تَنَاقُض"
      generation_method: ishtiqaq
      justification: >
        من الجذر «نقض» على وزن تَفَاعُل. في المنطق العربي التناقض هو تقابل لا واسطة فيه
        بين الإيجاب والسلب، وهو ما يطابق مفهوم «التقابل غير المتدرج» في اللسانيات.
    - lemma: "تَقَابُلٌ تَنَاقُضِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «تقابل» + «تناقضي» (نسبة إلى التناقض). يحدد نوع التقابل بالإحالة
        إلى المفهوم المنطقي المعروف، وهو أدق من «غير متدرج» لربطه بالتراث.
    - lemma: "تَقَابُلٌ حَدِّيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «تقابل» + «حدّي» (نسبة إلى الحدّ). يشير إلى أن التقابل ثنائي
        حادّ لا تدرج فيه، أي عند حدّ فاصل بين القيمتين.
    - lemma: "مُنَاقَضَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «نقض» على وزن مُفَاعَلة. تعني إبطال أحد القولين بالآخر،
        وهي تفيد التقابل الذي لا يجتمع فيه الطرفان.

stage2_evidence:
  per_lemma:
    - lemma: "تَقَابُل غَيْر مُتَدَرِّج"
      evidence_status: "no_material_found"

    - lemma: "تَنَاقُض"
      confirm:
        - text: "«التناقض: هو اختلاف القضيتين بالإيجاب والسلب، بحيث يقتضي لذاته صدق إحداهما وكذب الأخرى، كقولنا: زيد إنسان، زيد ليس بإنسان»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«التناقض: اختلاف قضيتين بإيجاب وسلب بحيث يقتضي لذاته صدق أحدهما وكذب الأخرى، نحو زيد إنسان زيد غير إنسان وأصله قولهم تناقض الكلامان إذا تدافعا كأن كل واحد ينقض الآخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(التَّنَاقُض) يُقَال فِي كَلَامه تنَاقض بعضه يَقْتَضِي إبِْطَال بعض و(فِي الْمنطق) النِّسْبَة بَين المتناقضين»"
          source: "المعجم الوسيط"
      expands:
        - text: "«التناقض: هو عند الأصوليين تقابل الدليلين المتساويين على وجه لا يمكن الجمع بينهما بوجه ويسمّى بالتعارض والمعارضة أيضا. وعند المنطقيين يطلق على تناقض المفردات وتناقض القضايا»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التناقض عند الأصوليين أعم من المعنى المنطقي، ويشمل تعارض الأدلة"
        - text: "«تناقض — contradiction — Philosophy and Psychology»"
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
          addition: "يؤكد استعمال المصطلح في الفلسفة الحديثة مقابل contradiction"
        - text: "«تَنَاقُض — contradiction — اللسانيات»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يثبت استعمال تناقض في اللسانيات العربية المعاصرة"

    - lemma: "تَقَابُلٌ تَنَاقُضِيّ"
      evidence_status: "no_material_found"

    - lemma: "تَقَابُلٌ حَدِّيّ"
      evidence_status: "no_material_found"

    - lemma: "مُنَاقَضَة"
      contradicts:
        - text: "«المناقضة: لغة: إبطال أحد القولين بالآخر. واصطلاحا: منع مقدمة معينة من مقدمات الدليل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المناقضة في الاصطلاح تعني منع مقدمة من الدليل (مصطلح مناظرة/جدل)، لا نوعاً من التقابل الدلالي"
        - text: "«المناقضة: عبارة عن النقض. وعند أهل النظر عبارة عن منع مقدمة الدليل سواء كان مع السند أو بدونه»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المناقضة مصطلح في آداب البحث والمناظرة وليس في الدلالة اللغوية"

    - lemma: "تَقَابُل"
      confirm:
        - text: "«التقابل: من قال بانحصاره في الأعراض عرفه بعدم إمكان اجتماع الأمرين في موضوع واحد من جهة واحدة [...] والتقابل أقسام أربعة»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«تقابل — Opposition — Language and Literature»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«التقابل: أن يقبل بعض القوم على بعض إما بالذات وإما بالعناية والتوفيق والمودة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المعنى اللغوي الأصلي قبل الاصطلاح المنطقي"

stage3_analysis:
  per_lemma:
    - lemma: "تَقَابُل غَيْر مُتَدَرِّج"
      decision: confirmed
      decision_reason: >
        المركب الوصفي يتبع نمطاً منتجاً في المصطلحية اللسانية العربية المعاصرة، قياساً على:
        تقابل سالب (privative opposition)، تقابل ثنائي (bilateral opposition)،
        تقابل تناسبي (proportional opposition) — جميعها مسجلة في المعجم الموحد لمصطلحات
        اللسانيات. وإن كان المركب ترجمة حرفية، فهو واضح الدلالة ومتسق مع منظومة المصطلحات.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يصف التقابل من زاوية غياب التدرج (الصفة السلبية)، أي أنه تقابل لا وسط فيه.
        هذا أوضح في السياق اللساني الحديث من المصطلحات المنطقية التراثية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقَابُلٌ غَيْرُ مُتَدَرِّجٍ"

    - lemma: "تَنَاقُض"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن التناقض في المنطق العربي يدل على تقابل لا واسطة فيه (وهو جوهر المفهوم)،
        إلا أنه أعم من المطلوب: يشمل التناقض المنطقي بين القضايا والتناقض في الكلام
        والتعارض بين الأدلة عند الأصوليين. إضافته هنا ستخلط بين المفهوم اللساني
        (نوع من التقابل الدلالي) والمفهوم المنطقي (النسبة بين المتناقضين). كما أن
        «تناقض» مصطلح له مجموعة ترادفية خاصة به في الشبكة الدلالية (contradiction).
      evidence_assessment:
        case: mixed

    - lemma: "تَقَابُلٌ تَنَاقُضِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        مركب غير مسجّل في أي معجم أو مرجع لساني. لم يُعثر عليه في قاعدة البيانات المعجمية
        ولا في معاجم ALECSO. يفتقر إلى التثبيت المعجمي المطلوب.
      evidence_assessment:
        case: no_material

    - lemma: "تَقَابُلٌ حَدِّيّ"
      source: stage1
      decision: removed
      decision_reason: >
        مركب غير مسجّل في أي مرجع. الصفة «حدّي» لا تؤدي المعنى المقصود بوضوح،
        إذ قد تُفهم على أنها «متعلق بالحدّ المنطقي» لا «ثنائي لا تدرج فيه».
        يفتقر إلى التثبيت المعجمي.
      evidence_assessment:
        case: no_material

    - lemma: "مُنَاقَضَة"
      source: stage1
      decision: removed
      decision_reason: >
        المناقضة في الاصطلاح العربي تعني «منع مقدمة معيّنة من مقدمات الدليل»
        وهي مصطلح في آداب البحث والمناظرة، لا في الدلالة اللغوية أو أنواع التقابل.
        الأدلة المعجمية تناقض استعمالها بمعنى «تقابل غير متدرج».
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "تعارض ليس له درجة وسطية؛ إما هذا أو ذاك"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي واضح لكنه يستعمل أسلوباً تبسيطياً («إما هذا أو ذاك»)
        لا يليق بالمعجم. يحتاج إلى صياغة أدق تربطه بمنظومة أنواع التقابل
        وتُبيّن خصوصيته عن التقابل المتدرج.
    authored:
      - type: terminological
        text: "نوعٌ من التقابل الدلالي يمتنع فيه التدرج بين الطرفين، فيلزم من صدق أحدهما كذبُ الآخر ومن كذبه صدقُه، نحو: حيّ وميت."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "تقابلٌ بين لفظين لا واسطة بينهما ولا تدرج، بحيث ينتفي أحدهما بثبوت الآخر حتماً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نوعٌ من التقابل الدلالي يمتنع فيه التدرج بين الطرفين، فيلزم من صدق أحدهما كذبُ الآخر ومن كذبه صدقُه، نحو: حيّ وميت."

