# مراجعة المجموعة الترادفية — awn4-13602801-n (acid value)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "تشكيل اللمّة الأولى «رَقَم» خاطئ؛ الصواب «رَقْم» بسكون القاف (فَعْل لا فَعَل)"
      - "اللمّة الثانية «قِيمَة حَمْضِيَّة» مركب وصفي نكرة، بينما المعاجم الموحدة تسجّلها معرفة «القِيمَة الحَمْضِيَّة»"
      - "لا يوجد في المجموعة الصيغة الوصفية المنتشرة «الرَّقْم الحَمْضِيّ» رغم شيوعها في المعاجم الطبية والغذائية والكهربائية"
    observations: "المجموعة تُعبِّر عن مفهوم كيميائي تحليلي دقيق (acid value) يقيس كمية الحمض الحر في الدهون بوحدة ملغ KOH. المصطلح العربي مستقر في المعاجم الموحدة بصيغتين رئيسيتين: إضافية (رقم الحموضة) ووصفية (الرقم الحمضي / القيمة الحمضية). كلا اللمّتين الموجودتين مقبولتان من حيث المفهوم لكن تحتاجان تدقيقاً صرفياً."
  blind_candidates:
    - lemma: "رَقْم الحُمُوضَة"
      generation_method: tarkib
      justification: "مركب إضافي من «رَقْم» (عدد، مقدار محسوب) و«حُمُوضَة» (صفة الحمض). الإضافة تربط المقدار المحسوب بخاصية الحموضة."
    - lemma: "قِيمَة حَمْضِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «قِيمَة» (مقدار) و«حَمْضِيَّة» (نسبة إلى الحمض). يُقابل المصطلح الإنجليزي acid value مباشرة."
    - lemma: "دَلِيل الحُمُوضَة"
      generation_method: tarkib
      justification: "مركب إضافي من «دَلِيل» بمعنى مؤشر/فهرس و«حُمُوضَة». شائع في المصطلحات الكيميائية الفرنسية (indice d'acidité)."
    - lemma: "مُعَامِل الحُمُوضَة"
      generation_method: tarkib
      justification: "مركب إضافي من «مُعَامِل» (وزن مُفاعِل بمعنى القيمة العددية المصاحبة) و«حُمُوضَة». يُستعمل «معامل» في الكيمياء للدلالة على القيم القياسية."

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "رَقَم الحُمُوضَة"
      confirm:
        - text: "«رقم الحموضة، قرينة الحموضة»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«الرقم الحَمضيّ(للدهن) — كمية هيدروكسيد البوتاسيوم بالملغرامات اللازمة لمعادلة الأحماض الدهنية الحرة في غرام واحد من الدهن.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«الرَّقْمُ الحَمْضِيّ»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«رقم حمضي؛ درجة التعادل»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«رَقَمَ — الرَّاءُ وَالْقَافُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خَطٍّ وَكِتَابَةٍ وَمَا أَشْبَهَ ذَلِكَ. فَالرَّقْمُ: الْخَطُّ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الرقم الخط والكتابة، ومنه العدد المكتوب"

    - lemma: "قِيمَة حَمْضِيَّة"
      confirm:
        - text: "«القيمَةُ الحَمْضِيَّة»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«القيمة الحمضية (للدهن) — (انظر : Acid Number)»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«قيمة (ال...) الحمضية»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«قَوَمَ — الْقَافُ وَالْوَاوُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ... وَمِنَ الْبَابِ: قَوَّمْتُ الشَّيْءَ تَقْوِيمًا. وَأَصْلُ الْقِيمَةِ الْوَاوُ، وَأَصْلُهُ أَنَّكَ تُقِيمُ هَذَا مَكَانَ ذَاكَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "القيمة من القيام بمعنى تقدير الشيء وإقامته مقام غيره"

    # ── مرشحات المرحلة ١ ──
    - lemma: "رَقْم الحُمُوضَة"
      confirm:
        - text: "«رقم الحموضة، قرينة الحموضة»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«الرقم الحَمضيّ(للدهن) — كمية هيدروكسيد البوتاسيوم بالملغرامات اللازمة لمعادلة الأحماض الدهنية الحرة في غرام واحد من الدهن.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"

    - lemma: "قِيمَة حَمْضِيَّة"
      confirm:
        - text: "«القيمَةُ الحَمْضِيَّة»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«قيمة (ال...) الحمضية»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"

    - lemma: "دَلِيل الحُمُوضَة"
      evidence_status: "no_material_found"

    - lemma: "مُعَامِل الحُمُوضَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "رَقَم الحُمُوضَة"
      decision: confirmed
      decision_reason: "مصطلح مستقر في عدة معاجم موحدة (النفط، تقانات الأغذية، الطب، الكهرباء). يحتاج تصحيح التشكيل فقط: «رَقَم» → «رَقْم» بسكون القاف، إذ المراد الاسم لا الفعل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مركب إضافي يركّز على البُعد العددي/الكمّي (رَقْم)، ويُفضَّل في سياقات النفط والصناعة الغذائية. يُقابل الإنجليزية acid number."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَقْم الحُمُوضَة"

    - lemma: "قِيمَة حَمْضِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مسجّل في المعجم الطبي الموحد ومعجم الكيمياء وتقانات الأغذية. الصيغة الوصفية النكرة مقبولة كلمّة معجمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "مركب وصفي يركّز على مفهوم القيمة/المقدار الموصوف بالحمضية، ويُفضَّل في السياقات الطبية. يُقابل الإنجليزية acid value."
      actions: []

    # ── مرشحات المرحلة ١ ──
    - lemma: "رَقْم حَمْضِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مسجّل في المعجم الطبي الموحد (الرَّقْمُ الحَمْضِيّ)، وموسوعة الكهرباء (رقم حمضي)، ومعجم تقانات الأغذية (الرقم الحمضي للدهن). صيغة وصفية بديلة شائعة للصيغة الإضافية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "صيغة وصفية بديلة لـ«رقم الحموضة»؛ تُستعمل في المعاجم الطبية والكهربائية. يُقابل acid number بصياغة نعتية."
      actions:
        - command: create_entry
          params:
            lemma: "رَقْم حَمْضِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "دَلِيل الحُمُوضَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي. مصطلح «دليل» يُستعمل في سياقات أخرى (دليل الانكسار) لكنه غير مسجّل مع الحموضة في المعاجم العربية الموحدة."

    - lemma: "مُعَامِل الحُمُوضَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي. «مُعامل» يُستعمل لمفاهيم أخرى (معامل الاحتكاك، معامل التمدد) ولا يُسجَّل مع الحموضة."

