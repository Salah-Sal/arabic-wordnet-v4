          params: {lemma: "إِنْقَاذ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00046648-n"}

stage4_content:
  definition:
    current: "فعل استعادة أو إنقاذ شيء مفقود (أو معرض لخطر الفقدان)"
    assessment:
      decision: revise
      reason: "لجعل التعريف أكثر شمولية لمفهوم الاستخلاص والاسترجاع المعلوماتي."
    authored:
      - type: terminological
        text: "فِعْلُ اِسْتِخْلَاصِ شَيْءٍ مَفْقُودٍ أَوْ إِعَادَتِهِ إِلَى مِلْكِيَّةِ صَاحِبِهِ أَوْ صِيَانَتِهِ مِنْ ضَيَاعٍ أَوْ تَلَفٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "اِسْتِرْدَاد"
        examples:
          - text: "قَرَّرَ التَّاجِرُ رَفْعَ دَعْوَى اِسْتِرْدَادِ حِيَازَةِ المَتْجَرِ بَعْدَ غَصْبِهِ."
            type: usage
      - lemma: "اِسْتِعَادَة"
        examples:
          - text: "سَاعَدَ تَوْفِيرُ النُّسَخِ الاِحْتِيَاطِيَّةِ عَلَى اِسْتِعَادَةِ النِّظَامِ بَعْدَ تَعَطُّلِهِ."
            type: usage
      - lemma: "اِسْتِرْجَاع"
        examples:
          - text: "يَتِمُّ اِسْتِرْجَاعُ البَيَانَاتِ المَحْذُوفَةِ بِسُهُولَةٍ بِوَاسِطَةِ هَذَا البَرْنَامَجِ."
            type: usage
      - lemma: "إِنْقَاذ"
        examples:
          - text: "شَارَكَتْ فِرَقُ الطَّوَارِئِ فِي إِنْقَاذِ المَحَاصِيلِ الزِّرَاعِيَّةِ مِنَ الفَيَضَانِ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-00046648-n", definition_index: 0, text: "فِعْلُ اِسْتِخْلَاصِ شَيْءٍ مَفْقُودٍ أَوْ إِعَادَتِهِ إِلَى مِلْكِيَّةِ صَاحِبِهِ أَوْ صِيَانَتِهِ مِنْ ضَيَاعٍ أَوْ تَلَفٍ."}

