stage1_review:
  assessment:
    concerns:
      - "اللمات الحالية (استرداد، استعادة) تغطي جانب 'الاسترجاع المادي'، لكنها تفتقر للفظ 'استرجاع' الشائع جداً في سياقات استرجاع البيانات والبحث."
    observations: "التعريف العربي الحالي دقيق لغوياً ومتوافق مع التعريف الإنجليزي والـ ILI، لكن يمكن تجويده ليشمل 'الاستخلاص'."
  blind_candidates:
    - lemma: "اِسْتِرْجَاع"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من الفعل 'استرجع'، وهو اللفظ الأكثر شيوعاً في سياق استعادة المعلومات (Retrieval) والموارد المفقودة."
    - lemma: "إِنْقَاذ"
      generation_method: ishtiqaq
      justification: "يعبر عن جانب 'Saving' الوارد في التعريف الإنجليزي، وهو استخلاص الشيء من ورطة أو خطر الضياع."
    - lemma: "اِسْتِرْدَاد"
      generation_method: ishtiqaq
      justification: "يدل على طلب رد الشيء، ويشيع في السياقات القانونية (استرداد الحيازة) والمالية."
    - lemma: "اِسْتِعَادَة"
      generation_method: ishtiqaq
      justification: "يدل على طلب عودة الشيء، ويستخدم بكثرة في سياق استعادة النظم والملفات (System Recovery)."

stage2_evidence:
  per_lemma:
    - lemma: "استرداد"
      confirm:
        - text: "«دَعْوَى استرداد الحيازة (في قانون المرافعات): هى دَعْوَى يرفعها الحائز الذى نزعت حيازته طالباً رَدَّها إليه.»"
          source: "المعجم الوسيط"
        - text: "«عملية استخلاص المواد من خاماتها أو من مركَّباتها أو من مخلَّفاتٍ تحتويها, مثل استردادِ الفضَّةِ من بقايا عمليات التصوير الفوتغرافى.»"
          source: "المعجم الكبير"
    - lemma: "استعادة"
      confirm:
        - text: "«استرجاعُ معطياتٍ فُقِدَتْ، أو ترميمُ معطيات متضاربة، أو معطيات اعتراها خطأ إثر إصابة النظام بعطل.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«استرداد (المرادف العربي) - recovery»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
    - lemma: "استرجاع"
      confirm:
        - text: "«استرجاع البيانات (فى الحَاسِيبِ الآلى) retrieval: البحث عن البيانات المطلوبة فى ملفٍّ أو فى قاعدة للبيانات والاطلاع عليها.»"
          source: "المعجم الكبير"
        - text: "«تجديد معطيات لَحِقَ بها تلف ما، وذلك بكيفية، تصبح معها قابلة للاستعمال من جديد.»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
    - lemma: "إنقاذ"
      confirm:
        - text: "«الإنقاذ: التخليص من ورطه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«فصل مراقب للمواد القابلة للتدوير وإعادة الاستخدام بمكبات القمامة أو مرافق استعادة المواد.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"

