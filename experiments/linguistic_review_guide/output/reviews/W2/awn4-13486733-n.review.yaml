          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — ARABTERM/ALECSO"
        - text: "«انتشار دوّامي — eddy diffusion; turbulent diffusion — Meteorology»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999) — ARABTERM/ALECSO"
      expands:
        - text: "«النُّونُ وَالشِّينُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَتْحِ شَيْءٍ وَتَشَعُّبِهِ. وَنَشَرْتُ الْخَشَبَةَ بِالْمِنْشَارِ نَشْرًا. وَالنَّشْرُ: الرِّيحُ الطَّيِّبَةُ. [...] وَالِانْتِشَارُ: انْتِفَاخُ عَصَبِ الدَّابَّةِ مِنْ تَعَبٍ. وَالنَّشَرُ: أَنْ تَنْتَشِرَ الْغَنَمُ بِاللَّيْلِ فَتَرْعَى، وَلِذَلِكَ يُقَالُ لِمَنْ جَمَعَ أَمْرَهُ: قَدْ ضَمَّ نَشَرَهُ.»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ)"
          addition: "الجذر نشر يدل على الفتح والتشعب والانتشار في الاتجاهات، وهو يُجسّد الحركة الإشعاعية للجزيئات من مركز التركيز نحو المحيط تجسيداً دلالياً دقيقاً."
        - text: "«الانتشار — prevalence — The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM/ALECSO"
          addition: "استعمال ثانوي للفظ بمعنى الانتشار الوبائي (prevalence)؛ يُؤكد قدرة اللمّة على التوسّع الدلالي دون أن يتعارض مع استعمالها الفيزيائي."

    - lemma: "تداخل"
      contradicts:
        - text: "«(فى الفيزياء) interference: ظاهِرَةٌ مَوْجِيَّةٌ تَحدُثُ عن تراكُبِ مَوْجَتَيْن مُتَساوِيَتَى الطُّولِ, صادِرَتَيْنِ عن مَصدَرَيْن مُترابِطَيْن»"
          source: "المعجم الكبير — مجمع اللغة العربية (OCR)"
          conflict: "المعجم الكبير يُحدد تداخل صراحةً بوصفه المصطلح الفيزيائي لـ«interference» لا لـ«diffusion»؛ المفهومان مختلفان جوهرياً: التداخل الموجي تراكبٌ لموجتين، والانتشار انتقالٌ جزيئي بفعل تدرّج التركيز."
        - text: "«التداخل: دخول شيء في شيء بلا زيادة حجم وقدر. تداخل العددين أن يفني أقلهما الأكثر كثلاثة وتسعة.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1031هـ)"
          conflict: "الدلالة الكلاسيكية تصف الاندراج الكامل بحيث يشغل الشيئان حيزاً واحداً، وهو مغاير للانتشار الذي يصف الحركة من مركز إلى محيط."
        - text: "«التدَاخُلُ: تلاقي الشَّيْء الآخر بكليته حَتَّى يكفيهما مَكَان وَاحِد.»"
          source: "معجم مقاليد العلوم للسيوطي (ت. 911هـ)"
          conflict: "اندماج الشيئين في حجم واحد بلا زيادة ليس وصفاً للانتشار الفيزيائي الذي يُعبّر عن حركة جزيئية من تركيز أعلى إلى تركيز أدنى."
        - text: "«التَّدَاخُل: وَفِي عرف الْحُكَمَاء نُفُوذ بعض الْأَشْيَاء فِي بعض بِحَيْثُ يتحدان فِي الْوَضع والحجم. وَبِعِبَارَة أُخْرَى دُخُول شَيْء فِي شَيْء آخر بِلَا زِيَادَة حجم وَمِقْدَار.»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "المفهوم الفلسفي الكلاسيكي للتداخل (interpenetration بلا حجم إضافي) يختلف عن الانتشار الفيزيائي ولا يُعبّر عنه."

