        - text: "«النُّونُ وَالْفَاءُ وَالذَّالُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَضَاءٍ فِي أَمْرٍ وَغَيْرِهِ. وَنَفَذَ السَّهْمُ الرَّمْيَةَ نَفَاذًا.»"
