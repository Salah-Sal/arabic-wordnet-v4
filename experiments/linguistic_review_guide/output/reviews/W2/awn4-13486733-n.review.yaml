  definition:
    current: "(في الفيزياء) العملية التي تحدث فيها حركة لمادة من منطقة ذات تركيز عالٍ لتلك المادة إلى منطقة ذات تركيز أقل"
    assessment:
      decision: revise
      reason: "التعريف مقبول وظيفياً إلا أنه يعاني من: (أ) «تحدث فيها حركة لمادة» صياغة ركيكة؛ (ب) إغفال الطابع التلقائي (spontaneous) الجوهري الذي يميز الانتشار عن النقل الفعّال؛ (ج) «تركيز أقل» دون ذكر الوصول إلى الاتزان كغاية الظاهرة."
