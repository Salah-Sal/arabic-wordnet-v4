        - text: "«السِّينُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ مُطَّرِدٌ، وَهُوَ يَدُلُّ عَلَى الِاتِّسَاعِ وَالذَّهَابِ فِي الْأَرْضِ. [...] وَمِنْ هَذَا الْبَابِ: السَّرَبُ وَالسَّرِبُ، وَهُوَ الْمَاءُ السَّائِلُ مِنَ الْمَزَادَةِ.»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ)"
          addition: "الجذر يدل على السيلان من شق أو فتحة (seepage)، لا على الانتشار الجزيئي العشوائي متعدد الاتجاهات."

