# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «تداخل» هي المصطلح العربي الراسخ لـ«interference» (التداخل الموجي) في الفيزياء، لا لـ«diffusion»؛ ووجودها في هذه المجموعة خلطٌ اصطلاحي خطير يُربك الباحث العلمي."
      - "التعريف العربي الحالي يستعمل عبارة «تحدث فيها حركة لمادة» الركيكة؛ والأدق «تنتقل فيها جُسَيمات مادة ما تلقائياً»."
      - "التعريف يُغفل الطابع التلقائي (spontaneous/passive) للانتشار الذي هو جوهر الظاهرة وما يميزها عن النقل الفعّال (active transport)."
    observations: "المجموعة تمثّل ظاهرة الانتشار الفيزيائي (diffusion)، وهو من أكثر المفاهيم الفيزيائية توثيقاً في المعاجم العلمية العربية. «انتشار» مصطلح مقنَّن صادر عن لجان ALECSO في معاجم الفيزياء والكيمياء والجيولوجيا وهندسة المياه والطاقة المتجددة والطب البيطري، فلا حاجة إلى اشتقاق جديد. المشكلة الوحيدة هي وجود «تداخل» بجانبه وهو ينتمي إلى synset مغاير تماماً."

  blind_candidates:
    - lemma: "تَسَرُّبٌ"
      generation_method: ishtiqaq
      justification: "من جذر س-ر-ب، باب تَفَعُّل، والسرب دالٌّ على السيلان والذهاب في الأرض (ابن فارس: «يدل على الاتساع والذهاب في الأرض»). يُعبّر تسرّب عن انتقال مادة من موضع إلى آخر عبر وسط، وهو ملائم للحركة من منطقة تركيز مرتفع إلى أخفض."
    - lemma: "نَفَاذٌ"
      generation_method: ishtiqaq
      justification: "من جذر ن-ف-ذ، مصدر نَفَذَ يَنْفُذُ. ابن فارس: «أصل صحيح يدل على مضاء في أمر وغيره». يُعبّر النفاذ عن اختراق المادة للوسط وعبورها من منطقة إلى أخرى، وهو ملامس لفكرة انتقال الجزيئات عبر الوسط تدريجياً."
    - lemma: "تَخَلُّلٌ"
      generation_method: ishtiqaq
      justification: "من جذر خ-ل-ل، باب تَفَعُّل. يدل على تغلغل شيء في ثنايا شيء آخر واختراقه. يُعبّر عن تشرّب مادة في الوسط وتوزّعها داخله من مناطق الكثافة العالية إلى المنخفضة."
    - lemma: "تَغَلْغُلٌ"
      generation_method: ishtiqaq
      justification: "من جذر رباعي مضاعف غ-ل-غ-ل، باب تَفَعْلَل. يدل على الاختراق العميق التدريجي. يُناسب الانتشار التدريجي للجزيئات من منطقة إلى أخرى عبر وسط."


