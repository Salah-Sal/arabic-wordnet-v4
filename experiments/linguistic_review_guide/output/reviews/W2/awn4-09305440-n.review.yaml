  generation_notes: "تم استبعاد كلمة (فيضي) لأنها في المعاجم المتخصصة (كالجيولوجيا) تقابل diluvial وتشير إلى الفيضان الطبيعي، مما يتناقض مع قيد (عمداً) في التعريف."

