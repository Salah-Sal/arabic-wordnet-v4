    - lemma: "التَّأْلِيفُ البَصَرِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية على توظيف هذا التركيب مصطلحاً ثابتاً. «التأليف البصري» عبارة وصفية حرة يمكن تحليلها إلى مكوناتها وإبدال أي منها بمرادف (التنسيق البصري، التجميع البصري...) دون أن تفقد قدرتها التوصيفية — مما يدل على أنها ليست مصطلحاً مسكوكاً. فضلاً عن ذلك فإن «التأليف» في المعجم العربي مرتبط بالكتابة والموسيقى بصورة أقوى.

    - lemma: "الإِخْرَاجُ الفَنِّيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        «الإخراج الفني» يُستعمل في العربية للدلالة على «art direction» (توجيه فني) وهو مفهوم مختلف عن «graphic design». الأدلة من قاعدة البيانات تربط «الإخراج الطباعي» بالتنضيد (typography) لا بالتصميم الجرافيكي. اللمّة ليست مرادفاً وإنما تفاضلاً في المعنى.

    - lemma: "التَّنْسِيقُ التَّشْكِيلِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية، والتركيب يصف ظاهرة إجرائية (عملية التنسيق) لا الفن/المجال المهني. اختبار السك يكشف أن إبدال «التنسيق» بـ«الترتيب» أو «التجميع» لا يُفسد المعنى الوصفي — دليل على أنه ليس مصطلحاً ثابتاً.

    - lemma: "الفَنُّ الطِّبَاعِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        «الفن الطباعي» يقابل typography أو printing art، وهو أضيق من «التصميم الجرافيكي» الذي يشمل الهوية البصرية والإعلانات والإنفوغرافيك وغيرها. الأدلة تؤكد هذا القيد الدلالي. اللمّة ليست مرادفاً للمجموعة المستعلَمة.


