stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تصميم جرافيك» مركبٌ هجين يدمج اسماً عربياً (تصميم) مع معرَّب خالص (جرافيك) لا يحمل لاحقة النسبة، مما يضعف تماسك الوحدة المعجمية"
      - "كلمة «جرافيك» منقولة صوتياً من الإنجليزية دون قبولها التصريفي الكامل (لا تُجمع، لا تتلقى ال التعريف، لا تُضاف إليها نسبة بصورة اعتيادية)"
      - "المصطلح لا يرد في أيٍّ من المعاجم الأكاديمية العربية المستعلَمة"
      - "التعريف العربي الحالي يعاني من صياغة ركيكة: «بمزيج ماهر» تعبير غير مألوف، وخاتمة «إلخ.» غير لائقة بأسلوب المعجم"
      - "غياب التشكيل الكامل عن اللمّة"
    observations: >-
      المجموعة الترادفية تمثّل مفهوم «التصميم الجرافيكي» (graphic design) الذي نشأ في سياق الثورة الصناعية الغربية وصناعة الطباعة والإعلان. لا يوجد للمفهوم تعبير عربي كلاسيكي مباشر، غير أن اللغة العربية الحديثة تمتلك مصطلحات قريبة: «الفن التجاري» (commercial art) في معاجم التربية، و«فنون تخطيطية» (graphic arts) في معاجم النفط، و«إخراج طباعي» للتنضيد والطباعة. اللمّة الحالية «تصميم جرافيك» هي الأكثر شيوعاً في الأوساط المهنية العربية المعاصرة رغم هجنتها. يُعدّ هذا المجال من مواطن الفجوة المعجمية (lexical_gap) في العربية المعاصرة.

  blind_candidates:
    - lemma: "التَّأْلِيفُ البَصَرِيّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من «التأليف» (مصدر أَلَّفَ، بمعنى الجمع والتنسيق بين عناصر متباينة) و«البصري» (نسبة إلى البصر). يعكس بدقة عنصر «المزيج الماهر» الوارد في التعريف، ويميّز هذا الفرع من التواصل عن التواصل اللفظي والسمعي.

    - lemma: "الإِخْرَاجُ الفَنِّيّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي مستعمل في لغة الصحافة العربية للدلالة على التنظيم البصري لمحتوى الصفحة المطبوعة (نصوص وصور وعناصر إخراجية). «الإخراج» من خ-ر-ج (الإخراج الفني = art direction)، وهو مفهوم متداخل مع التصميم الجرافيكي في سياقات الإعلانات والمجلات.

    - lemma: "التَّنْسِيقُ التَّشْكِيلِيّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من «التنسيق» (ترتيب العناصر وضبط تناسقها، من ن-س-ق) و«التشكيلي» (نسبة إلى الفنون التشكيلية). يستحضر مصطلح «الفنون التشكيلية» الراسخ في المعجم العربي الحديث ويضيف إليه وظيفة التنسيق التواصلي.

    - lemma: "الفَنُّ الطِّبَاعِيّ"
      generation_method: tarkib
      justification: >-
        تركيب إضافي (فن + طباعي/نسبة إلى الطباعة) يُحيل إلى الجذر التاريخي للتصميم الجرافيكي في صناعة الطباعة والنشر. «الطباعة» هي الحقل الذي نشأ فيه هذا التخصص، والصلة بالإعلانات والمجلات والكتب صريحة في التعريف.


