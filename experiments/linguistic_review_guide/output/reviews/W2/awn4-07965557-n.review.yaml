# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07965557-n
# people collectively who are mentally retarded
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المصطلح الإنجليزي mentally retarded أصبح مهجوراً ومسيئاً في الخطاب المعاصر، وقد استُبدل رسمياً بـ intellectual disability"
      - "اللمّتان الموجودتان كلتاهما تعبيران مركبان (MWE)، ولا يوجد لفظ مفرد عربي يدل على هذه الفئة"
      - "التعريف الحالي يستخدم «تأخر عقلي» وهو أخف من «تخلف عقلي»، مما يُحدث تناقضاً مع اللمّة الأولى"
      - "المجموعة تدل على فئة بشرية جماعية (collective noun) لا على الحالة الطبية ذاتها"
    observations: "هذه المجموعة الترادفية تمثّل تحدياً مزدوجاً: أولاً، المفهوم لا يُعبَّر عنه في العربية إلا بتركيب وصفي أو إضافي، فلا يوجد لفظ مفرد مسكوك يدل على هذه الفئة. ثانياً، المصطلحات تخضع لتطور اجتماعي سريع — فقد انتقل الخطاب الرسمي العربي من «المتخلفون عقلياً» إلى «ذوو الإعاقة الذهنية» مواكبةً للتحول العالمي. التعريف الحالي يحتاج إلى تدقيق ليتوافق مع المصطلحية الطبية المعتمدة."

  blind_candidates:
    - lemma: "مُتَأَخِّرُونَ عَقْلِيًّا"
      generation_method: tarkib
      justification: "تركيب وصفي مبني على «تأخر عقلي» الوارد في التعريف، يدل على من يعانون من بطء في النمو العقلي، وهو مصطلح مستخدم في مسارد التربية"
    - lemma: "مُعَاقُونَ ذِهْنِيًّا"
      generation_method: tarkib
      justification: "تركيب وصفي من «إعاقة ذهنية»، يصف الأشخاص الذين لديهم قصور في القدرات الذهنية، شائع في الخطاب الإعلامي المعاصر"
    - lemma: "ذَوُو الإِعَاقَةِ العَقْلِيَّةِ"
      generation_method: tarkib
      justification: "تركيب إضافي وصفي بديل لـ«ذوو الإعاقة الذهنية» باستبدال «ذهنية» بـ«عقلية»، مستخدم في بعض الوثائق الرسمية العربية"
    - lemma: "ذَوُو التَّأَخُّرِ الذِّهْنِيِّ"
      generation_method: tarkib
      justification: "تركيب إضافي وصفي يجمع بين «التأخر» الوارد في التعريف و«الذهني» للدلالة على القصور في النمو العقلي"


stage2_evidence:
  per_lemma:
    - lemma: "الْمُتَخَلِّفُونَ عَقْلِيًّا"
      confirm:
        - text: "«مُتَخَلِّفٌ عَقْلِيَّاً — mentally retarded»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مِرْفَقُ الرِّعايَةِ المُتَوَسِّطَةِ للمُتَخَلِّفينَ عَقْلِيَّا — intermediate care for the mentally retarded»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُتَخَلِّف — retarded»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«(التَّخَلُّف) (فِي علم النَّفس) بطء فِي النمو الْعقلِيّ للطفل حِين يقل الذكاء عَن حد السوَاء دون أَن يُوصف الطِّفْل بِأَنَّهُ ضَعِيف»"
          source: "المعجم الوسيط"
          addition: "يحدد التخلف بأنه بطء في النمو العقلي دون أن يبلغ درجة الضعف العقلي"
        - text: "«(في علم النَّفْس) backwardness: هو البُطْءُ في النُّمُوِّ العَقْلِيِّ للطِّفْل, حين يَقِلُّ الذَّكاءُ عن حَدّ السَّواءِ, دُونَ أن يُوصفَ الطِّفْلُ بأنَّه ضعيفٌ عَقْليًّا.»"
          source: "المعجم الكبير"
          addition: "يطابق تعريف الوسيط ويضيف المقابل الإنجليزي backwardness"
        - text: "«تَخَلُّفٌ عَقْلِيّ — mental retardation»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المصطلح المركب «تخلف عقلي» مصطلح طبي معتمد يقابل mental retardation"
        - text: "«تخلف عقلي: نقص في النمو العقلي وله ثلاث درجات: (أ) المأفون morons (ب) الأبله imbeciles (ج) المعتوه idiots»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "يصنف التخلف العقلي إلى ثلاث درجات حسب شدته"

    - lemma: "ذَوُو الْإِعَاقَةِ الذِّهْنِيَّةِ"
      evidence_status: "no_material_found"

    - lemma: "مُتَأَخِّرُونَ عَقْلِيًّا"
      confirm:
        - text: "«تأخر عقلي — debility (mental-)»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«التأخّر: ضد التقدم والمتأخّر ضد المتقدم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التأخر في الأصل مفهوم عام يعني عدم التقدم، وليس مصطلحاً طبياً خاصاً"

    - lemma: "مُعَاقُونَ ذِهْنِيًّا"
      expands:
        - text: "«مُعَوَّق: من (ع و ق) الممنوع من الفعل والمثبط عن فعل الخير، وصاحب العاطة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الجذر عوق يدل على المنع والتثبيط عموماً، لا على الإعاقة الذهنية خصوصاً"

    - lemma: "ذَوُو الإِعَاقَةِ العَقْلِيَّةِ"
      evidence_status: "no_material_found"

    - lemma: "ذَوُو التَّأَخُّرِ الذِّهْنِيِّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "الْمُتَخَلِّفُونَ عَقْلِيًّا"
      decision: confirmed
      decision_reason: "مصطلح طبي معتمد في المعجم الطبي الموحد والمعاجم المتخصصة، مدعوم بتعريفات المعجم الوسيط والكبير للتخلف العقلي. يمثل الاستعمال التقليدي/الطبي الراسخ وإن كان الخطاب المعاصر يميل إلى استبداله."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "مصطلح طبي تقليدي مباشر يصف الحالة بوصفها قصوراً، يُستخدم في السياقات الطبية والنفسية التخصصية، وقد يُعدّ غير لائق في الخطاب العام المعاصر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْمُتَخَلِّفُونَ عَقْلِيًّا"

    - lemma: "ذَوُو الْإِعَاقَةِ الذِّهْنِيَّةِ"
      decision: confirmed
      decision_reason: "تعبير رسمي معاصر مستخدم في الخطاب الأممي والحكومي العربي (اتفاقية حقوق الأشخاص ذوي الإعاقة)، وهو البديل اللائق لمصطلح «المتخلفون عقلياً». غياب التوثيق المعجمي يعكس حداثة المصطلح لا ضعفه."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مصطلح رسمي حديث يركز على صاحب الحالة لا على القصور ذاته، يُفضَّل في الخطاب الرسمي والحقوقي والإعلامي المعاصر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ذَوُو الْإِعَاقَةِ الذِّهْنِيَّةِ"

    - lemma: "مُتَأَخِّرُونَ عَقْلِيًّا"
      source: stage1
      decision: removed
      decision_reason: "«تأخر عقلي» يقابل في المصطلحية الطبية debility (mental-) وهو أخف درجة من التخلف العقلي (mental retardation)، فلا يغطي المفهوم الكامل للمجموعة. كما أن اللمّتين الموجودتين تكفيان لتغطية الاستعمال التقليدي والمعاصر."
      evidence_assessment:
        case: mixed

    - lemma: "مُعَاقُونَ ذِهْنِيًّا"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على توثيق معجمي لهذا التركيب بعينه. كما أن «معاق» في الأصل اسم مفعول من «أعاق» بمعنى منعه، واللمّة الموجودة «ذوو الإعاقة الذهنية» أدق وأكثر رسمية."
      evidence_assessment:
        case: no_material

    - lemma: "ذَوُو الإِعَاقَةِ العَقْلِيَّةِ"
      source: stage1
      decision: removed
      decision_reason: "مرادف شبه تام للمّة الموجودة «ذوو الإعاقة الذهنية» بإبدال «ذهنية» بـ«عقلية». الفرق بينهما طفيف ولا يبرر إضافة لمّة ثالثة، والمصطلح الرسمي المعتمد يستخدم «ذهنية»."
      evidence_assessment:
        case: no_material

    - lemma: "ذَوُو التَّأَخُّرِ الذِّهْنِيِّ"
      source: stage1
      decision: removed
      decision_reason: "تركيب غير مسكوك معجمياً ولا مصطلحياً. «التأخر الذهني» أخف دلالياً من «التخلف العقلي» أو «الإعاقة الذهنية»، ولا يغطي المفهوم الكامل للمجموعة."
      evidence_assessment:
        case: no_material


