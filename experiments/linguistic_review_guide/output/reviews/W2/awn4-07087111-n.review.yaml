    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة حرفية مباشرة من الإنجليزية (the expression of one's
        individuality usually through creative activities)، تفتقر إلى الأسلوب
        المعجمي العربي الأصيل. كلمة "فردية" جاءت بدون تشكيل، والتعريف لا يُقدِّم
        جنساً قريباً واضحاً ولا فصلاً نوعياً كافياً وفق المنهج المعجمي.
