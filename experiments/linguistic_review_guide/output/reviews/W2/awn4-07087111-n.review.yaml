# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تعبير عن الذات» عبارة ثلاثية الكلمات مع حرف جر، وهي تعبير اصطلاحي مسكوك لكنه يفتقر إلى التشكيل الكامل في السجل الحالي"
      - "المجموعة تحوي لمّة واحدة فقط؛ وهو أمر هشٌّ معجمياً لمفهوم بالغ الشيوع في مجالات التعليم والفنون والإعلام"
      - "التعريف الحالي ترجمة شبه حرفية من الإنجليزية، ويفتقر إلى الصياغة المعجمية العربية الأصيلة"
    observations: >-
      المفهوم يندرج تحت المجموعة الترادفية الأم «أسلوب / نمط تعبيري»، وهو يُعبِّر عن
      حالة إبداعية/تواصلية يُظهر فيها الإنسان فرديتَه من خلال الفنون والأداء والكلام.
      في التراث العربي لا يوجد مصطلح مفرد راسخ لهذا المفهوم بالدقة المطلوبة؛ إذ تنقسم
      العربية بين مسلكين: الأول نهج التعبير المركب (تعبير عن الذات، إفصاح عن الفردية،
      إبداء الشخصية)، والثاني نهج اشتقاق مصطلح قياسي (تَفَرُّد، تَعْبِيرِيَّة). غير أن
      المورد الحديث (2008) قد أثبت «التعبير عن الذات» مصطلحاً معجمياً معتمداً بترجمة
      self-expression، مما يُعدُّ توثيقاً كافياً لقبول هذه اللمّة.

  blind_candidates:
    - lemma: "التَّجَلِّي الذَّاتِيّ"
      generation_method: tarkib
      justification: >-
        "التجلّي" من جذر (جلو) أصله الانكشاف والبروز كما في مقاييس اللغة، و"الذاتي"
        نسبة للذات. التركيب وصفي يصف انكشاف الفردية وبروزها؛ والوزن مناسب لمفاهيم
        الإظهار الشخصي. جيء به هنا بالمجاز من معنى الانكشاف إلى معنى إبداء الذات.

    - lemma: "الإِبَانَةُ الذَّاتِيَّة"
      generation_method: tarkib
      justification: >-
        "الإبانة" من (أبان) مصدر قياسي يدل على الإيضاح والإظهار، و"الذاتية" نسبة
        للذات. التركيب وصفي يحمل دلالة جلاء الشخصية وإيضاح فرديتها؛ يُعبِّر عن
        الجانب التوضيحي والكاشف في self-expression.

    - lemma: "البَوْحُ الفَرْدِيّ"
      generation_method: tarkib
      justification: >-
        "البوح" من (بوح) جذره سعة الشيء وبروزه وظهوره وفق مقاييس اللغة، واستُعمل
        في اللغة بمعنى الإفصاح عما في النفس (باح بسره: أظهره). "الفردي" نسبة للفردية.
        التركيب وصفي يُعبّر عن الإفضاء بالذات وإظهارها.

    - lemma: "الإِفْصَاحُ الفَرْدِيّ"
      generation_method: tarkib
      justification: >-
        "الإفصاح" من (فصح) يدل على الخلوص والنقاء والبيان، وكل واضح مُفصِح (مقاييس
        اللغة). "الفردي" نسبة للفرد/الفردية. التركيب وصفي يُعبّر عن بيان الشخص
        لخصائصه الفردية بوضوح ونقاء.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة (٥ استعلامات):
#   ١. Batch headword lookup — مكونات اللمّات + المرشحات جميعها
#   ٢. English bridge — self-expression / individuality / expressiveness
#   ٣. Arabic FTS keywords — تعبير، فردية، الذات، إفصاح، إبانة
#   ٤. Candidate validation — التجلي الذاتي، الإبانة الذاتية، البوح الفردي، الإفصاح الفردي
#   ٥. Maqayis al-Lugha — جذور عبر، جلو، فصح، بوح، فرد
stage2_evidence:
  per_lemma:

    - lemma: "تعبير عن الذات"
      confirm:
        - text: >-
            «التعبير عن الذات: «أ» تعبير المرء عن شخصيته من طريق الشعر أو الموسيقى
            إلخ. «ب» توكيد المرء شخصيته من خلال الحديث أو السُّلوك.»
          source: "المورد الحديث (2008)"

    - lemma: "التَّجَلِّي الذَّاتِيّ"
      contradicts:
        - text: >-
            «التجلي: أصله الانكشاف... وعند الصوفية: ما ينكشف للقلوب من أنوار الغيوب.»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >-
            المصطلح محجوز في التراث العربي والمعاجم الفلسفية للتجلي الإلهي عند الصوفية؛
            استخدامه بمعنى self-expression يُوقع في اشتراك لفظي يُضلل القارئ.
        - text: >-
            «التجلي الذاتي: ما يكون مبدؤه الذات من غير اعتبار صفة من الصفات معها
            وإن كان لا يحصل ذلك إلا بواسطة الأسماء والصفات إذ لا يتجلى الحق من
            حيث ذاته على الموجودات إلا من وراء حجاب من الحجب الأسمائية.»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >-
            المركب "التجلي الذاتي" بعينه مُثبَّت معجمياً بمعنى صوفي لا علاقة له
            بالتعبير الإبداعي الفردي.

    - lemma: "الإِبَانَةُ الذَّاتِيَّة"
      contradicts:
        - text: >-
            «إبانة (تنقية بالغسل)» — ترجمة: elutriation / lixiviation / leaching
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: >-
            مصطلح "الإبانة" محجوز في المعجمية التقنية العربية للتنقية الكيميائية
            (فصل الترسبات)؛ إيراده بمعنى إبداء الشخصية يُخلط بين حقلين دلاليين متباينين.
        - text: >-
            «إبانة، ترقيد، تصفيق» — ترجمة: decantation
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "تكرار التعارض ذاته في مجال الكيمياء."
      expands:
        - text: >-
            «الإبانة: إظهار المعنى للنفس بما لا يمكن إدراكه، وأصله القطع فالإبانة
            قطع المعنى من غيره ليظهر من نفسه.»
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: >-
            المعنى اللغوي للإبانة (إظهار المعنى وإيضاحه) يدعم الجذر الدلالي للمرشح
            نظرياً، لكن المصطلح مشغول تقنياً وكلاسيكياً بمعانٍ أخرى.

    - lemma: "البَوْحُ الفَرْدِيّ"
      expands:
        - text: >-
            «(بَوَحَ) الباء والواو والحاء أصل واحد، وهو سعة الشيء وبروزه وظهوره.
            ومن هذا الباب إباحة الشيء، وذلك أنه ليس بمحظور عليه، فأمره واسع غير مضيق.»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            الجذر (بوح) يدل على الظهور والبروز، وهو قريب دلالياً من معنى إظهار الذات،
            مما يُسوِّغ التفكير في اشتقاق منه.
        - text: >-
            «البُوحُ: الأَصْلُ، والذَّكَرُ، والفَرْجُ، والنَّفْسُ، والجِماعُ...
            وباحَ: ظَهَرَ، وـ بِسِرِّهِ بَوْحاً وبُؤُوحاً وبُؤُوحَةً: أظْهَرَهُ.»
          source: "القاموس المحيط للفيروزآبادي"
          addition: >-
            "باح بسره" تعني الإفصاح عما يُكتَم؛ تعني الإفضاء الشخصي لكنها تحمل
            ظلاً من الكشف عن المخفي لا الإبداء الإرادي الإبداعي.

    - lemma: "الإِفْصَاحُ الفَرْدِيّ"
      expands:
        - text: >-
            «(فَصَحَ) الفاء والصاد والحاء أصل يدل على خلوص في شيء ونقاء من الشوب.
            منه اللسان الفصيح: الطليق. والكلام الفصيح: العربي... وكل واضح مُفصِح.»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            الجذر (فصح) يدل على الوضوح والإبانة في التعبير، مما يدعم الاشتقاق
            لكنه يُضيِّق الدلالة على جانب البيان اللغوي دون الإبداع الفردي الأشمل.
        - text: >-
            «إفصاح — ترجمة: disclosure»
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: >-
            المعجمية التقنية استخدمت "الإفصاح" بمعنى الإفصاح القانوني والمعلوماتي
            (disclosure)، مما يُعرِّض المركب "الإفصاح الفردي" للالتباس في السياقات
            القانونية والاقتصادية.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تعبير عن الذات"
      decision: confirmed
      decision_reason: >-
        اللمّة مُثبَّتة في المورد الحديث (2008) بترجمة self-expression مع تعريف
        يطابق المجموعة الترادفية تطابقاً تاماً. تمثّل الصيغة الاصطلاحية العربية
        المعتمدة لهذا المفهوم في المعجمية العربية المعاصرة. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        اللمّة الوحيدة في المجموعة؛ تُعبِّر عن الإبداء الإرادي للفردية والشخصية
        عبر وسائل إبداعية (الشعر، الموسيقى، الفنون، الكلام)، وتتمايز عن
        المجموعة الأم (أسلوب/نمط تعبيري) بتركيزها على الجانب الذاتي الفردي
        لا على الطريقة أو الأسلوب في حد ذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْبِيرٌ عَنِ الذَّاتِ"

    - lemma: "التَّجَلِّي الذَّاتِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        المصطلح "التجلي الذاتي" ثابت في المعجمية الكلاسيكية بمعنى صوفي محض
        (ظهور الذات الإلهية من غير حجاب صفاتي) كما أثبته المناوي في التوقيف،
        فضلاً عن كون "التجلي" عموماً مشغولاً في الإرث الصوفي العربي الإسلامي
        بهذه الحيثية. استخدامه في معنى self-expression يُوقع في اشتراك لفظي
        خطير مع المصطلح الصوفي الراسخ.

    - lemma: "الإِبَانَةُ الذَّاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        كلمة "الإبانة" محجوزة في المعجمية التقنية العربية المعاصرة للتنقية
        الكيميائية (decantation / elutriation)؛ ورد تثبيتها بهذا المعنى في ثلاثة
        معاجم تقنية (المياه، الكيمياء، النفط). كما أن المركب "الإبانة الذاتية"
        لم يُثبَّت في أي مرجع معجمي، وبالتالي لا يجتاز اختبار التثبيت المعجمي.

    - lemma: "البَوْحُ الفَرْدِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        "البوح" في الاستخدام الفصيح يحمل دلالة الإفصاح عما يُكتَم (باح بسره)،
        وهي دلالة إفضاء عن مكنون لا دلالة تعبير إبداعي إرادي. المركب "البوح
        الفردي" غير مسكوك في أي مصدر معجمي، ولا يجتاز اختبار التثبيت المعجمي.

    - lemma: "الإِفْصَاحُ الفَرْدِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        "الإفصاح" في الأصل اللغوي يدل على وضوح التعبير وفصاحة اللسان، وفي
        المعجمية التقنية يُستخدم بمعنى disclosure القانوني والمعلوماتي.
        المركب "الإفصاح الفردي" غير مسكوك، ودلالته تميل نحو الجانب البياني
        اللغوي بمعزل عن الأنشطة الإبداعية التي هي محور تعريف المجموعة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
