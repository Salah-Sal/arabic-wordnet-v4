stage1_review:
  assessment:
    concerns:
      - اللمات الموجودة كافية تقنيًا، لكن يمكن إضافة بدائل مرادفة إذا كانت شائعة في المصادر العربية.
    observations: "المفهوم فيزيائي فلكي دقيق. مصطلح «أَسْر» هو المقابل المعياري لـ «capture» في العلوم الأساسية (الفيزياء والرياضيات) عند الحديث عن احتجاز جسم أو جسيم."
  blind_candidates:
    - lemma: "أَسْر"
      generation_method: ishtiqaq
      justification: "الترجمة المعيارية لمصطلح capture في السياقات العلمية الفيزيائية، وهو مشتق من الجذر (أسر) الذي يفيد الحبس والإمساك."
    - lemma: "أَسْرٌ جَاذِبِيّ"
      generation_method: tarkib
      justification: "تعبير مركب وصفي يحدد نوع الأسر بكونه ناتجاً عن قوة الجاذبية."
    - lemma: "اِقْتِنَاص"
      generation_method: ishtiqaq
      justification: "مرادف للأسر يستخدم أحياناً في السياقات التقنية للتعبير عن عملية الإمساك المفاجئ أو العرضي لشيء ما."
    - lemma: "اِلْتِقَاط"
      generation_method: ishtiqaq
      justification: "يستخدم في سياق جمع أو احتجاز الأجسام أو الإشارات، وهو شائع في المصطلحات التقنية المعاصرة."

stage2_evidence:
  per_lemma:
    - lemma: "أسر"
      confirm:
        - text: "«أسْر (ن): capture»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
        - text: "«أَسْر: capture: اضطلاع مجموعة الإجراءات الإلكترونية المضادة ECM، بالتحكم برادارات الملاحقة»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية"
      expands:
        - text: "«أَسْر نترون (ن): neutron capture»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
    - lemma: "التقاط"
      confirm:
        - text: "«اِلْتِقَاط: capture: عملية إدخال المعطيات إلى الحاسوب»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
        - text: "«التقاط: capture»"
          source: "موسوعة الكهرباء (IEC 60050)"
    - lemma: "اقتناص"
      confirm:
        - text: "«الاقتناص: أخذ الصيد، ويشبه به أخذ كل شيء بشرعة.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "أسر جاذبي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أسر"
      decision: confirmed
      decision_reason: "مصطلح تقني أصيل ومعتمد في المعاجم الموحدة (الفيزياء) كمقابل لـ capture."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَسْر"
    - lemma: "أَسْرٌ جَاذِبِيّ"
      decision: confirmed
      decision_reason: "تعبير اصطلاحي مركب (وصف) مستخدم في الفلك والفيزياء لتخصيص عملية الأسر بمجال الجاذبية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَسْرٌ جَاذِبِيّ"
    - lemma: "اِقْتِنَاص"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من صحة المعنى لغوياً، إلا أن مصطلح (أسر) هو الأكثر شيوعاً واستقراراً في الفيزياء الفلكية."
    - lemma: "اِلْتِقَاط"
      source: stage1
      decision: removed
      decision_reason: "يستخدم غالباً في سياقات الاتصالات ومعالجة الصور والبيانات، وليس في سياق الجاذبية والأجرام السماوية."

stage4_content:
  definition:
    current: "عملية يحتجز فيها نجم أو كوكب جسماً ما في مجال جاذبيته"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أكثر دقة لبيان طبيعة العملية الفيزيائية."
    authored:
      - type: terminological
        text: "عمليةٌ طبيعيةٌ في الفيزياء الفلكيّة تؤدّي فيها الجاذبيةُ القوية لنجمٍ أو كوكبٍ إلى احتجاز جسمٍ مارٍّ به في مدارٍ مستقرٍّ حوله."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عمليةٌ طبيعيةٌ في الفيزياء الفلكيّة تؤدّي فيها الجاذبيةُ القوية لنجمٍ أو كوكبٍ إلى احتجاز جسمٍ مارٍّ به في مدارٍ مستقرٍّ حوله."
  examples:
    per_lemma:
      - lemma: "أَسْر"
        examples:
          - text: "يُعدُّ أَسْرُ القمرِ من قِبَل كوكب المريخ مثالاً على العَمَليات الجَاذِبية الطبيعية."
            type: usage
      - lemma: "أَسْرٌ جَاذِبِيّ"
        examples:
          - text: "أَدّى الأَسْرُ الجَاذِبِيّ لنجم بعيد إلى تشكيل نظام كوكبي جديد."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تم تفسير وجود بعض الأقمار غير المنتظمة حول الكوكاب العملاقة من خلال الأسر الجاذبي."

stage5_enrichment:
  per_entry:
    - lemma: "أَسْر"
      entry_id: "{auto}"
      root: "أسر"
      maqayis_quote: "«الْهَمْزَةُ وَالسِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَقِيَاسٌ مُطَّرِدٌ، وَهُوَ الْحَبْسُ، وَهُوَ الْإِمْسَاكُ. مِنْ ذَلِكَ الْأَسِيرُ، وَكَانُوا يَشُدُّونَهُ بِالْقِدِّ وَهُوَ الْإِسَارُ، فَسُمِّيَ كُلُّ أَخِيذٍ وَإِنْ لَمْ يُؤْسَرْ أَسِيرًا.»"
    - lemma: "أَسْرٌ جَاذِبِيّ"
      entry_id: "{auto}"
      roots:
        - word: "أسر"
