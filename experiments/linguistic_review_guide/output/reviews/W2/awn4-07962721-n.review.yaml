# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07962721-n
# people who are defeated — الناس الذين تعرضوا للهزيمة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مغلوبون، مهزومون) جاءتا بصيغة جمع المذكر السالم فقط، وهي صيغة وصفية أكثر منها اسمية مستقلة، ولا تشمل الإناث"
      - "اللمّتان بلا تشكيل كامل"
      - "التعريف العربي الحالي وصفي عام يحتاج إلى صياغة معجمية أدق"
    observations: "المفهوم يدلّ على جماعة من الناس وقع عليهم الهزيمة أو الغلبة. هو مفهوم حيّ في الثقافة العربية وله ألفاظ فصيحة متعددة الجذور (هزم، غلب، قهر، دحر). اللمّتان الموجودتان كلتاهما اسما مفعول بصيغة الجمع، وهو نمط طبيعي للتعبير عن هذا المعنى في العربية. الفرق بينهما دقيق: الهزيمة أخصّ بالحرب والمعركة، والغلبة أعمّ تشمل كلّ تفوّق."

  blind_candidates:
    - lemma: "مَهْزُومُون"
      generation_method: ishtiqaq
      justification: "اسم مفعول من هَزَمَ على وزن مَفْعُول بصيغة جمع المذكر السالم، وهو أقرب لفظ للدلالة على مَن وقعت عليهم الهزيمة في حرب أو نزاع"
    - lemma: "مَغْلُوبُون"
      generation_method: ishtiqaq
      justification: "اسم مفعول من غَلَبَ على وزن مَفْعُول بصيغة الجمع، يدلّ على مَن غُلِبوا وقُهِروا، أعمّ من المهزوم إذ يشمل كلّ أنواع التغلّب"
    - lemma: "مَدْحُورُون"
      generation_method: ishtiqaq
      justification: "اسم مفعول من دَحَرَ على وزن مَفْعُول بصيغة الجمع، يدلّ على مَن طُرِدوا وأُبعِدوا بعد هزيمتهم. ورد في القرآن: {اخْرُجْ مِنْهَا مَذْءُومًا مَدْحُورًا}"
    - lemma: "مَقْهُورُون"
      generation_method: ishtiqaq
      justification: "اسم مفعول من قَهَرَ على وزن مَفْعُول بصيغة الجمع، يدلّ على مَن غُلِبوا وأُذِلّوا. لكنّ القهر يميل إلى معنى الإذلال والاستبداد أكثر من الهزيمة العسكرية"


stage2_evidence:
  per_lemma:
    - lemma: "مَغْلُوبُون"
      confirm:
        - text: "«مَغْلُوب — من (غ ل ب) المكروه على أمره والمهزوم.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«غَلَبَهُ غَلَبَةً وغَلْباً وغَلَباً [...] والمُغَلَّبُ: المغلوب مراراً.»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«(2) مغلوب؛ مُنْهَك؛ مُخْضَع a prostrate enemy»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْغَيْنُ وَاللَّامُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ وَقَهْرٍ وَشِدَّةٍ. مِنْ ذَلِكَ: غَلَبَ الرَّجُلُ غَلْبًا وَغَلَبًا وَغَلَبَةً.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على القوة والقهر والشدة، فالمغلوب هو مَن وقع عليه القهر والتغلّب"
        - text: "«غَلَبَ يغلِبُ غَلَباً وغَلَبةً. والغِلابُ: النَّزاعُ. والمُغَلَّبُ: الذي يَغلِبُه أقرانه فيما يمارس.»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: "المغلَّب بالتشديد هو مَن يُغلَب مراراً، أمّا المغلوب فهو الوصف العام"

    - lemma: "مَهْزُومُون"
      confirm:
        - text: "«هَزَمْتُ الجيش هَزْماً وهَزيمةً، فانْهَزَموا.»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«والهَزيمة فِي الْقِتَال، الْكسر والفل، هَزَمه يهزِمُه هَزما فانهزَمَ.»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
        - text: "«هزم الجيش وانهزم. وجيش مهزوم وهزيم، وهزمته واستهزمته، وهو يستهزم الجيوش. وهو هزّام فرّاس. ووقعت عليهم الهزيمة.»"
          source: "أساس البلاغة للزمخشري"
        - text: "«(4) مهزوم»"
          source: "المورد الحديث (2008) — مدخل beaten"
      expands:
        - text: "«الْهَاءُ وَالزَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى غَمْزٍ وَكَسْرٍ. فَالْهَزْمُ: أَنْ تَغْمِزَ الشَّيْءَ بِيَدِكَ فَيَنْهَزِمَ إِلَى دَاخِلٍ [...] وَمِنْهُ الْهَزِيمَةُ فِي الْحَرْبِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدلّ على الغمز والكسر، ومنه استُعيرت الهزيمة في الحرب"

    - lemma: "مَدْحُورُون"
      confirm:
        - text: "«(دَحَرَ) الدَّالُ وَالْحَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الطَّرْدُ وَالْإِبْعَادُ. قَالَ اللَّهُ تَعَالَى: {اخْرُجْ مِنْهَا مَذْءُومًا مَدْحُورًا}»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«الدَّالُ وَالْحَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الطَّرْدُ وَالْإِبْعَادُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الدحر أخصّ بالطرد والإبعاد لا بالهزيمة ذاتها؛ المدحور مطرود لا مهزوم بالضرورة"

    - lemma: "مَقْهُورُون"
      expands:
        - text: "«الْقَافُ وَالْهَاءُ وَالرَّاءُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى غَلَبَةٍ وَعُلُوٍّ. يُقَالُ: قَهَرَهُ يَقْهَرُهُ قَهْرًا. وَالْقَاهِرُ: الْغَالِبُ. وَأُقْهِرَ الرَّجُلُ، إِذَا صُيِّرَ فِي حَالٍ يُذَلُّ فِيهَا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "القهر يجمع بين الغلبة والإذلال، فهو أعمّ من الهزيمة العسكرية ويشمل الاستعباد والاستبداد"


stage3_analysis:
  per_lemma:
    - lemma: "مَغْلُوبُون"
      decision: confirmed
      decision_reason: "لفظ فصيح ثابت مشهود له في المعاجم الكلاسيكية والحديثة، يدلّ على مَن وقعت عليه الغَلَبة بأيّ نوع من التفوّق. مؤيَّد بنصوص الجوهري وابن فارس وموسوعة السلطان قابوس"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ من المهزوم، إذ يشمل كلّ أنواع التغلّب (في الحرب، الجدال، المنافسة)، بينما المهزوم أخصّ بالحرب والقتال"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَغْلُوبُون"

    - lemma: "مَهْزُومُون"
      decision: confirmed
      decision_reason: "لفظ فصيح راسخ في الاستعمال، مشتق من الهزيمة في القتال وهو المعنى الأصلي للمجموعة. ثابت في صِحاح الجوهري والمحكم لابن سيده وأساس البلاغة للزمخشري"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أخصّ بسياق الحرب والقتال والمعارك، فالهزيمة في أصلها كسر وفلّ للجيش"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَهْزُومُون"

    - lemma: "مَدْحُورُون"
      source: stage1
      decision: removed
      decision_reason: "الدَّحر في أصله الطرد والإبعاد لا الهزيمة. المدحور مطرود مُبعَد، وهو نتيجة محتملة للهزيمة لا مرادف لها. الفارق الدلالي كبير ولا يصلح ترادفاً"

    - lemma: "مَقْهُورُون"
      source: stage1
      decision: removed
      decision_reason: "القهر يدلّ على الغلبة مع الإذلال والاستعباد، وهو أوسع بكثير من مفهوم الهزيمة. المقهور قد يكون مظلوماً مستضعفاً دون أن يكون في سياق هزيمة حربية أو تنافسية. الإضافة تُشوّش على دقة المجموعة"


