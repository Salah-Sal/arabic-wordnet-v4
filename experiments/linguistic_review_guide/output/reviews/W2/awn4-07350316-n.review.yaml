      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"خفي","maqayis":"«الْخَاءُ وَالْفَاءُ وَالْيَاءُ أَصْلَانِ مُتَبَايِنَانِ مُتَضَادَّانِ. فَالْأَوَّلُ السَّتْرُ، وَالثَّاني الإظهار.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"وري","maqayis":"«الْوَاوُ وَالرَّاءُ وَالْحَرْفُ الْمُعْتَلُّ... وَأَمَّا قَوْلُهُمْ وَرَاءَكَ فَإِنَّهُ يَكُونُ مِنْ خَلْفٍ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
