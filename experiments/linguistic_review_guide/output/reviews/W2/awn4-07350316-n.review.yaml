stage1_review:
  assessment:
    concerns:
      - اللمات الحالية صحيحة لكنها تفتقر إلى التشكيل الكامل.
      - المجموعة يمكن أن تستفيد من مرادفات تعبر عن التدرج في الاختفاء.
    observations: "تعد هذه المجموعة حيوية للتعبير عن الظواهر الطبيعية والفيزيائية. اللفظان (اختفاء) و(تواري) يغطيان الجانب العام والجانب المتعلق بالاستتار خلف شيء ما."
  blind_candidates:
    - lemma: "غِيَاب"
      generation_method: ishtiqaq
      justification: "مصدر غاب، ويعبر عن الخروج من الحضور المادي أو البصري."
    - lemma: "زَوَال"
      generation_method: ishtiqaq
      justification: "يستخدم لوصف اختفاء الأجرام السماوية (زوال الشمس) أو انقضاء الشيء."
    - lemma: "تَلَاشٍ"
      generation_method: majaz
      justification: "يعبر عن الاختفاء التدريجي للشيء حتى ينعدم أثره البصري."
    - lemma: "اِضْمِحْلَال"
      generation_method: majaz
      justification: "يستخدم في السياقات العلمية للتعبير عن تضاؤل الشيء حتى اختفائه."

stage2_evidence:
  per_lemma:
    - lemma: "اِخْتِفَاء"
      confirm:
        - text: "«اختفاء؛ توارٍ؛ زوال؛ اضمحلال؛ تلاشٍ.»"
          source: "المورد الحديث (2008)"
    - lemma: "تَوَارٍ"
      confirm:
        - text: "«(توارى) استتر»"
          source: "المجم الوسيط"
        - text: "«يتوارى؛ يتجنّب المسؤوليّة»"
          source: "المورد الحديث (2008)"
    - lemma: "زَوَال"
      confirm:
        - text: "«الزَّوالُ: الذَّهابُ، والاستِحالةُ»"
          source: "القاموس المحيط"
        - text: "«زالت الشمس ودلكت وزاغت»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة"
    - lemma: "تَلَاشٍ"
      confirm:
        - text: "«تلاشى الشيء: اضمحل، كما ذكره الوسيط مطاوعًا لـ «لاشاه»»"
          source: "معجم الصواب اللغوي"
        - text: "«الانتقال من لقطة إلى أخرى بانصهار الأولى وظهور الثانية تدريجيا»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"

stage3_analysis:
  per_lemma:
    - lemma: "اختفاء"
      decision: confirmed
      decision_reason: "اللفظ الأكثر شيوعاً ودقة للتعبير عن المفهوم العام للاختفاء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِخْتِفَاء"
    - lemma: "تواري"
      decision: confirmed
      decision_reason: "يعبر عن الاختفاء خلف ساتر أو حائل، وهو جزء أساسي من دلالة الخروج عن الرؤية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَارٍ"
    - lemma: "زَوَال"
      source: stage1
      decision: confirmed
      decision_reason: "فصيح ويستخدم في سياق اختفاء الأجرام أو انقضاء الحالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "زَوَال", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07350316-n"}
    - lemma: "تَلَاشٍ"
      source: stage1
      decision: confirmed
      decision_reason: "مهم للتعبير عن الاختفاء المتدرج كما في تقنيات التصوير أو الظواهر الضبابية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَلَاشٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07350316-n"}

stage4_content:
  definition:
    current: "حدث الخروج عن مجال الرؤية"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، وتحسينه بذكر غيبة الشيء عن الأنظار يعزز دلالته المعجمية."
    authored:
      - type: terminological
        text: "غيبة الشيء عن الأنظار أو خروجه عن حيز الرؤية سواء بالاحتجاب خلف حائل أو الاضمحلال تدريجياً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07350316-n", definition_index: 0, text: "غيبة الشيء عن الأنظار أو خروجه عن حيز الرؤية سواء بالاحتجاب خلف حائل أو الاضمحلال تدريجياً."}
  examples:
    per_lemma:
      - lemma: "اِخْتِفَاء"
        examples:
          - text: "أثار اختفاء السفينة المفاجئ في عرض البحر حيرة الباحثين."
            type: usage
      - lemma: "تَوَارٍ"
        examples:
          - text: "راقبنا تواري الشمس خلف الأفق في صمت مهيب."
            type: usage
      - lemma: "زَوَال"
        examples:
          - text: "تحدد مواقيت الصلاة بناءً على زوال الشمس عن كبد السماء."
            type: usage
      - lemma: "تَلَاشٍ"
        examples:
          - text: "أدى تلاشي الضباب إلى وضوح الرؤية على الطريق السريع."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أثار اختفاء السفينة المفاجئ في عرض البحر حيرة الباحثين."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "راقبنا تواري الشمس خلف الأفق في صمت مهيب."}

stage5_enrichment:
  per_entry:
    - lemma: "اِخْتِفَاء"
      entry_id: "{auto}"
      root: "خفي"
      maqayis_quote: "«الْخَاءُ وَالْفَاءُ وَالْيَاءُ أَصْلَانِ مُتَبَايِنَانِ مُتَضَادَّانِ. فَالْأَوَّلُ السَّتْرُ، وَالثَّاني الإظهار.»"
    - lemma: "تَوَارٍ"
      entry_id: "{auto}"
      root: "وري"
      maqayis_quote: "«الْوَاوُ وَالرَّاءُ وَالْحَرْفُ الْمُعْتَلُّ: بِنَاءٌ عَلَى غَيْرِ قِيَاسٍ، وَكَلِمُهُ أَفْرَادٌ... وَأَمَّا قَوْلُهُمْ وَرَاءَكَ فَإِنَّهُ يَكُونُ مِنْ خَلْفٍ.»"
    - lemma: "زَوَال"
      entry_id: "{auto}"
      root: "زول"
      maqayis_quote: "«الزاي والواو واللام أصلٌ يدل على حركةٍ وتَحرُّك.»"
    - lemma: "تَلَاشٍ"
      entry_id: "{auto}"
      root: "لشي"
      maqayis_quote: "«كلمة مولدة مشتقة من (لا شيء).»"
  per_sense:
    - lemma: "اِخْتِفَاء"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشامل لكل أنواع غياب الشيء عن الرؤية."
      mwe: false
    - lemma: "تَوَارٍ"
      sense_id: "{auto}"
      nuance: "يؤكد على الاختفاء خلف ساتر أو الاستتار بشيء آخر."
      mwe: false
    - lemma: "زَوَال"
      sense_id: "{auto}"
      nuance: "يرتبط غالباً بحركة الأجرام أو انقضاء الوجود كلياً."
      mwe: false
    - lemma: "تَلَاشٍ"
      sense_id: "{auto}"
      nuance: "يدل على التلاشي التدريجي والضعف حتى الاختفاء."
      mwe: false
  synset:
    cultural_fit: native
  actions:
