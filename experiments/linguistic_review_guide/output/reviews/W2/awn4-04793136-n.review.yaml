# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "طَبِيعِيَّة"
      decision: confirmed
      decision_reason: "اللمّة مصدر صناعي صحيح من «طَبِيعِيّ» النسبي على وزن فَعِيلِيَّة، وتعبّر تعبيراً مباشراً عن «الطبيعية» كصفة مجردة. رغم توثيق المعاجم التقنية «طبيعية» في سياق المذهب الطبيعي الفلسفي (naturalism)، فإن المصدر الصناعي في الاستخدام العام يصحّ للدلالة على الصفة المجردة، وهو الأنسب بين اللمّات لتمثيل «naturalness». لا تشكيل يستوجب التصحيح."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على خلوّ الشيء من الاصطناع والتكلّف وموافقته لأصله الفطري — هو الوجه الهيكلي/البنيوي للطبيعية: غياب التصنّع والتحريف"

    - lemma: "عَفْوِيَّة"
      decision: confirmed
      decision_reason: "مصدر صناعي صحيح من «عَفَوِيّ» المشتق من «عَفْو» وله أصل عربي كلاسيكي راسخ (أعطاه المال عَفْواً: دون مسألة). موثَّقة في معاجم متخصصة متعددة بمعنى spontaneity وهو وجه محوري من وجوه الطبيعية. الفارق الدقيق عن طبيعية موثَّق. لا تشكيل يستوجب التصحيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على صدور الشيء من تلقاء نفسه دون تخطيط أو قصد مسبق — هو الوجه الديناميكي/الحركي للطبيعية: حضور الانبثاق التلقائي"

    - lemma: "فِطْرِيَّة"
      decision: removed
      decision_reason: "المعاجم الحديثة الموثوقة (المعجم الوسيط، مسارد ALECSO للفلسفة والاجتماع) تُجمع على توثيق «فطرية» بمعنى المذهب الفلسفي القائل بأصالة الأفكار في النفس قبل التجربة (innatism/nativism). هذا المعنى ينتمي إلى مجموعة دلالية مستقلة مختلفة عن «الطبيعية» كصفة عامة. الإبقاء عليها في هذه المجموعة يُحدث خلطاً بين مفهومين فلسفيين متمايزين."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سَجِيَّة"
      source: stage1
      decision: removed
      decision_reason: "سجية تعني الطبع الأصيل والخُلُق الراسخ للأشخاص تحديداً (الملكة الراسخة في النفس)، وهو مفهوم أخصّ وأضيق من الطبيعية المجردة. هي تعبّر عن الطبيعة الخُلُقية الشخصية ولا تصلح مصدراً صناعياً مجرداً للدلالة على صفة الطبيعية في الأشياء كافة."

    - lemma: "أَصَالَة"
      source: stage1
      decision: removed
      decision_reason: "أصالة تعني جودة الرأي وابتكار الأسلوب وعراقة النسب، وفي الفلسفة تعني الأصالة الوجودية (authenticity). هذه المعاني محددة ومتمايزة عن «الطبيعية» كصفة خلوّ الشيء من الاصطناع؛ لا يمكن إدراجها في هذه المجموعة دون خلط مفهومي."

    - lemma: "تَلْقَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تلقائية في المعاجم التقنية تعني الأتمتة (automation/automaticity)، وهي بعيدة كلياً عن مفهوم الطبيعية. وإن كانت تُستخدم في الدارج بمعنى قريب من spontaneity، فإن عفوية أنسب وأوثق توثيقاً بهذا المعنى في المعاجم المتخصصة."


