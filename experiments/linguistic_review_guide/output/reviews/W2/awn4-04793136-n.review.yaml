# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "دوران في التعريف: يستخدم التعريف الحالي كلمة «طبيعياً» في تعريف المجموعة التي لمّتها الأولى هي «طبيعية»، وهو دوران لغوي يُضعف الحجية التعريفية"
      - "إشكالية فطرية: المعاجم الحديثة الموثوقة توثّق «فطرية» بمعنى المذهب الفلسفي (innatism/nativism) لا بمعنى الطبيعية كصفة مجردة؛ وجودها في هذه المجموعة مُشكِل"
      - "تداخل دلالي بين عفوية وطبيعية: عفوية تعني الانبثاق التلقائي دون قصد مسبق وهي وجه مرتبط بالطبيعية لكنها ليست مرادفاً تاماً لها — يستوجب توثيق الفارق الدقيق"
    observations: |
      تضمّ المجموعة ثلاث لمّات عربية خالصة، كلّها مصادر صناعية على وزن فَعِيلِيَّة أو فَعْلِيَّة. اللمّة المحورية «طبيعية» هي الأمكن للتعبير عن «naturalness» كصفة مجردة. «عفوية» مشتقة من «عَفْو» وتحمل دلالة التلقائية والانبثاق غير المتكلَّف، وهي وجه محوري من أوجه الطبيعية موثَّق في المعاجم المتخصصة بمعنى spontaneity. «فطرية» إشكالية: المعجم الوسيط يعرّفها بمعنى المذهب الفلسفي القائل بفطرية الأفكار (innatism)، لا صفة الطبيعية، مما يستوجب إعادة النظر في إدراجها في هذه المجموعة. التعريف الحالي دائر ويحتاج إلى صياغة جديدة تجمع بين الجنس القريب والفصل النوعي دون دوران.
  blind_candidates:
    - lemma: "سَجِيَّة"
      generation_method: majaz
      justification: "إحياء لفظ عربي قديم يعني الطبيعة الراسخة الأصيلة؛ من الجذر سجو (السُّكون والثبات)، يُجسِّد بإزاحة دلالية مفهوم الطبيعية الأصيلة غير المصطنعة — قال المعجم الكبير: «الطبيعة، أو ما دام عليه الطبع وثبت»"
    - lemma: "أَصَالَة"
      generation_method: ishtiqaq
      justification: "مصدر من الفعل أَصُلَ على وزن فَعَالَة، يعبّر عن انتساب الشيء لأصله الأوّل غير المحرَّف وخلوّه من الإضافات المصطنعة، وهو وجه مهم من وجوه الطبيعية"
    - lemma: "فِطْرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «فِطْرِيّ» المنسوب إلى الفطرة؛ يعبّر عن صفة انتساب الشيء إلى الفطرة الأصلية التي لم تشب بعيب — وهو يوافق المفهوم المطلوب اشتقاقياً"
    - lemma: "تَلْقَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تَلْقَائِيّ» المنسوب إلى «تِلْقَاء» بمعنى من تلقاء نفسه؛ يعبّر عن صفة ما يصدر دون تكلّف أو قصد مسبق وهو أحد المعاني الجوهرية للطبيعية"


