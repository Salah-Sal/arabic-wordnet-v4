step05_lemma_generation:
  evidence_candidates:
    - lemma: "إِثْنِيّ"
      source_section: "step5_english_bridge"
      evidence_citation: "«عِرْقيّ؛ أَثنيّ» — المورد الحديث (2008)"
      justification: "الاسم المنسوب إلى 'إثنية'، ويُستعمل كاسم ذات للتعبير عن الانتماء لمجموعة إثنية (تعريب لمصطلح ethnic)."
  knowledge_candidates:
    - lemma: "عِرْقِيّ"
      justification: "الاسم المنسوب إلى 'عرق'، ويمكن استخدامه اسماً للدلالة على الفرد المنتمي إلى عرق محدد، كترجمة لـ (ethnic)."
  generation_notes: "المفهوم الإنجليزي (ethnic كاسم) يمثل فجوة معجمية في العربية؛ إذ يُعبّر عنه غالباً بمركب وصفي، ولكن يمكن سد الفجوة باستخدام الاسم المنسوب كاسم ذات (substantive)."

step1_lemma_validation:
