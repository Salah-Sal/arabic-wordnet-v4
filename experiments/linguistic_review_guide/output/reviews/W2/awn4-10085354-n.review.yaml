      decision: removed
      decision_reason: "تركيب وصفي حر وليس مصطلحاً معجمياً مسكوكاً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "وصف عام ولا يمثل وحدة اصطلاحية."
