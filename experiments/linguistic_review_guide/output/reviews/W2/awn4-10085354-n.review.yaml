        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِثْنِيّ"
      source: step05
      decision: confirmed
      decision_reason: "استخدام الاسم المنسوب كاسم ذات يسد الفجوة المعجمية وهو شائع في الترجمات."
      step05_citation: "«عِرْقيّ؛ أَثنيّ» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز بالتركيز على الانتماء الثقافي والاجتماعي للمجموعة."
      example: "يُعتبر هذا الكاتب إثنيّاً يعتز بجذوره الثقافية في المهجر."
      actions:
        - command: create_entry
          params:
            lemma: "إِثْنِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10085354-n"

    - lemma: "عِرْقِيّ"
      source: step05
      decision: confirmed
      decision_reason: "النسبة إلى عرق واستخدامها كاسم مألوف للتعبير عن الانتماء البيولوجي أو السلالي."
      step05_citation: "«عرقي» — المعجم الموحد لمصطلحات اللسانيات"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز غالباً على الانتماء السلالي والبيولوجي."
      example: "واجه بعض العِرْقيين تمييزاً في المجتمعات المغلقة."
      actions:
        - command: create_entry
          params:
            lemma: "عِرْقِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10085354-n"

  synset_flags:
