    - lemma: "كَمَال"
      entry_id: "{auto}"
      root: "كمل"
      maqayis_quote: "«الْكَافُ وَالْأَلِفُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَمَامِ الشَّيْءِ.»"
