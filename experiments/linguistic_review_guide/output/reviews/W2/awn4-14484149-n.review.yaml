stage1_review:
  assessment:
    concerns: []
    observations: "المصطلحات الحالية (تكامل، سلامة، وحدة) دقيقة وتغطي الجوانب المختلفة للمفهوم: الجانب النظامي (تكامل)، والجانب الوقائي/الهيكلي (سلامة)، والجانب الانفرادي/الاندماجي (وحدة). التعريف العربي الحالي دقيق وواضح."
  blind_candidates:
    - lemma: "تَمَام"
      generation_method: ishtiqaq
      justification: "يدل على بلوغ الشيء نهايته في الكمال دون نقص، وهو ما يطابق 'nothing wanting'."
    - lemma: "كَمَال"
      generation_method: ishtiqaq
      justification: "صفة ما تمت أجزاؤه وبلغ غايته، ويستخدم للتعبير عن 'wholeness'."
    - lemma: "سَلَامَة"
      generation_method: ishtiqaq
      justification: "يدل على كون الشيء صحيحاً غير مكسور أو معيب، وهو المعنى الدقيق لـ 'integrity' المادية والمعنوية."
    - lemma: "تَكَامُل"
      generation_method: ishtiqaq
      justification: "حالة كون الشيء وحدة متكاملة لا تتجزأ، ويستخدم كثيراً في السياقات التقنية والنظمية."

stage2_evidence:
  per_lemma:
    - lemma: "تَكَامُل"
      confirm:
        - text: "«تناسق في المكونات التي تشكل جسماً أو بنية.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
        - text: "«عملية الجمع بين مختلف المكونات... في نظام واحد متكامل.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
    - lemma: "سَلَامَة"
      confirm:
        - text: "«الخلو من الأضرار.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
        - text: "«سلامة المعلومات المخزنة في حاسوب ودقتها، خاصة بعد التعامل معها بطريقة أو بأخرى.»"
          source: "معجم مصطلحات المعلوماتية"
        - text: "«التعري من الآفات الظاهرة والباطنة.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "وَحْدَة"
      confirm:
        - text: "«كون الشيء بحيث لا ينقسم.»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الواحد الذي لا ينقسم بوجه لا فرضاً ولا وهماً ولا فعلاً.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "كَمَال"
      confirm:
        - text: "«الانتهاء إلى غاية ليس وراءها مزيد من كل وجه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«خلو من العيوب.»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
    - lemma: "تَمَام"
      confirm:
        - text: "«تمام الشيء ما يتم به.»"
          source: "المعجم الوسيط"
        - text: "«التام: ما لا نقص في أعضائه.»"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "تكامل"
      decision: confirmed
      decision_reason: "مصطلح أساسي في السياق النظامي والتقني للدلالة على كون الأجزاء تشكل كلاً واحداً متناغماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَامُل"
    - lemma: "سلامة"
      decision: confirmed
      decision_reason: "يقابل 'integrity' بدقة، خاصة في سياق الحفاظ على الحالة الأصلية وعدم التعرض للكسر أو الخلل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَلَامَة"
    - lemma: "وحدة"
      decision: confirmed
      decision_reason: "يدل على الجانب الانفرادي وغير المنقسم من المعنى (Unity)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَحْدَة"
    - lemma: "كَمَال"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي لـ 'wholeness' و 'completeness' ويستخدم في السياقات الفلسفية واللغوية العامة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "كَمَال", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَمَام"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن اكتمال أجزاء الشيء وعدم نقصانها (Nothing wanting)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَمَام", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "اكتمال غير منقسم أو غير مكسور مع عدم نقصان شيء"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يفتقر إلى الصياغة المعجمية التي تربط بين المفاهيم الثلاثة (السلامة، الوحدة، التمام)."
    authored:
      - type: terminological
        text: "حالة من التمام والاكتمال تجعل الشيء وحدة واحدة متماسكة خالية من النقص أو العيب أو الانقسام."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "حالة من التمام والاكتمال تجعل الشيء وحدة واحدة متماسكة خالية من النقص أو العيب أو الانقسام."}
  examples:
    per_lemma:
      - lemma: "تَكَامُل"
        examples:
          - text: "يسعى المهندسون لضمان تكامل النظم البرمجية لتعمل ككتلة واحدة."
            type: usage
      - lemma: "سَلَامَة"
        examples:
          - text: "تعد سلامة الأراضي وسيادتها من المبادئ الأساسية في القانون الدولي."
            type: usage
      - lemma: "وَحْدَة"
        examples:
          - text: "تتجلى وحدة العمل الفني في ترابط أجزائه وتناغم ألوانه."
            type: usage
      - lemma: "كَمَال"
        examples:
          - text: "لم يترك الباحث جهداً في مراجعة كتابه حتى بلغ درجة من الكمال."
            type: usage
      - lemma: "تَمَام"
        examples:
          - text: "تم بناء المسجد على تمام الهيئة المعمارية المطلوبة."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "حافظ البناء على سلامته ووحدته رغم الهزة الأرضية العنيفة."}

stage5_enrichment:
  per_entry:
    - lemma: "تَكَامُل"
      entry_id: "{auto}"
      root: "كمل"
      maqayis_quote: "«الْكَافُ وَالْأَلِفُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَمَامِ الشَّيْءِ. يُقَالُ: كَمَلَ الشَّيْءُ وَكَمُلَ فَهُوَ كَامِلٌ، أَيْ تَامٌّ.»"
    - lemma: "سَلَامَة"
      entry_id: "{auto}"
      root: "سلم"
      maqayis_quote: "«السِّينُ وَاللَّامُ وَالْمِيمُ مُعْظَمُ بَابِهِ مِنَ الصِّحَّةِ وَالْعَافِيَةِ... فَالسَّلَامَةُ: أَنْ يَسْلَمَ الْإِنْسَانُ مِنَ الْعَاهَةِ وَالْأَذَى.»"
    - lemma: "وَحْدَة"
