step0_evidence:
  per_lemma:
    - lemma: "رُكْن"
      confirm:
        - text: "«من البَيْتِ وَنَحوِه: زاويَتُه المحصورَةُ بين جِدارَيْن»"
          source: "المعجم الكبير"
        - text: "«أحَدُ الجوانب التى يَسْتَنِدُ إليها الشيءُ ويقوم بها»"
          source: "المعجم الوسيط"
    - lemma: "زَاوِيَة"
      confirm:
        - text: "«الزاوية: الركن»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«هيئة عارضة للسطح المنحدب عند ملتقى خطين يحيطان به»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "زَاوِيَة المُسْتَوْقَد"
      source_section: "step5_english_bridge"
      evidence_citation: "««أ» زاوية المُسْتَوقَد. «ب» موضعٌ قربَ النار.» — المورد الحديث"
      justification: "مصطلح مخصص ولكنه غير شامل للمعنى العام للزاوية."
  knowledge_candidates:
    - lemma: "قُرْنَة"
      justification: "توليد بالمجاز؛ استعيرت من (قرن) الحيوان لتدل على كل جزء ناتئ أو بارز من شيء يمثل زاوية أو التقاء حافتين. (القُرنة: الطرف الشاخص من كل شيء)."
  generation_notes: "اللمتان (ركن) و(زاوية) هما الأكثر دقة واطّراداً في التعبير عن هذا المفهوم، ولم تظهر بدائل أقوى."

step1_lemma_validation:
  per_lemma:
    - lemma: "رُكْن"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر في المعاجم للدلالة على الجانب الأقوى أو الزاوية من البناء أو الشيء."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يغلب استعماله للزاوية القوية التي تمثل دعامة أو أساساً كأركان البناء."
      example: "وضع المدفأة في أحد أركان الغرفة."
    - lemma: "زَاوِيَة"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع للدلالة على ملتقى خطين أو سطحين، ويستعمل مرادفاً للركن في الاستعمال العام."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أدل على الملتقى الهندسي الخالص لخطين أو سطحين، سواء أكان ناتئاً أم غائراً."
      example: "اصطدمت يده بزاوية الطاولة البارزة."
    - lemma: "زَاوِيَة المُسْتَوْقَد"
      source: step05
      decision: removed
      decision_reason: "تركيب إضافي مخصص لمعنى ضيق ولا يعبر عن المعنى العام للمجموعة الترادفية."
      step05_citation: "««أ» زاوية المُسْتَوقَد. «ب» موضعٌ قربَ النار.» — المورد الحديث"
    - lemma: "قُرْنَة"
      source: step05
      decision: removed
      decision_reason: "اللفظ أقل شيوعاً في الاستعمال الفصيح المعاصر مقارنة بـ (ركن) و(زاوية)، ويميل إلى العامية في بعض الأقطار للتعبير عن الزاوية."
      step05_citation: "المعرفة اللغوية"

