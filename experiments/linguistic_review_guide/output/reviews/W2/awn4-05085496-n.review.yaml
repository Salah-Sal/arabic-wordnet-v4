      maqayis_quote: "«الْقَافُ وَالدَّالُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَبْقٍ وَرَعْفٍ... الْقِدَمُ: خِلَافُ الْحُدُوثِ...»"
    - lemma: "صَدَارَة"
