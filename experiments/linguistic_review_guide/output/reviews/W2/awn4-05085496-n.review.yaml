stage1_review:
  assessment:
    concerns:
      - "اللمة 'تَقَدُّم' قد تُفهم بمعنى التطور (progress) بدلاً من الصفة المكانية (anteriority)؛ لذا يجب توثيق الدلالة الفلسفية المكانية لها."
      - "اللمة 'أَمَامِيَّة' قد تلتبس بفرقة 'الإمامية' الشيعية عند استخدام أل التعريف؛ لذا يفضل توضيح السياق."
    observations: "المفهوم مكاني/تشريحي يعبر عن حالة الوجود في المقدمة أو باتجاه الرأس. اللمات الحالية جيدة، لكن 'تقدم' تحتاج إلى تمييز دلالي عن المعنى الشائع المعاصر (الرقي)."
  blind_candidates:
    - lemma: "أَمَامِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'أمام' للتعبير عن حالة الوجود في المقدمة."
    - lemma: "قُدُمِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'قُدُم' (بمعنى الأمام)، وتستخدم في بعض السياقات العلمية."
    - lemma: "صَدَارَة"
      generation_method: majaz
      justification: "من 'الصدر' وهو مقدمة الشيء، وتدل على التقدم والأولية."
    - lemma: "تَصَدُّر"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تصدر، ويعني الوقوع في المقدمة."

stage2_evidence:
  per_lemma:
    - lemma: "أَمَامِيَّة"
      confirm:
        - text: "«الأماميّة: (1) الأماميّة (2) الأسبقيّة؛ الأقدَمية.»"
          source: "المورد الحديث"
        - text: "«(أَمَامِيّ): anterior»"
          source: "المعجم الطبي الموحد"
      expands:
        - text: "«(الإمامية) نسبة إلى الإمام أو الإمامة وفرقة من الشيعة تقول بإمامة علي وأولاده دون غيرهم»"
          source: "المعجم الوسيط"
          addition: "يشير إلى الاشتراك اللفظي مع اسم الفرقة الدينية."
    - lemma: "تَقَدُّم"
      confirm:
        - text: "«التّقدّم: [في الفرنسية] anteriorite... التقدم بالرتبة: ما كان أقرب من غيره إلى مبدأ محدود، وتقدمه هو تلك الأقربية.»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
        - text: "«التقدم الطبعي: هو كون الشيء الذي لا يمكن أن يوجد آخر إلا وهو موجود...»"
          source: "التعريفات للجرجاني"
    - lemma: "صَدَارَة"
      confirm:
        - text: "«(الصدارة) التَّقَدُّم يُقَال فلَان لَهُ الصدارة فِي الْقَوْم»"
          source: "المعجم الوسيط"
        - text: "«الصدارة بالفتح: التقدم... وقد استعملها النحاة... في الحروف التي لها الصدارة.»"
          source: "معجم الصواب اللغوي (عن تاج العروس)"
    - lemma: "تَصَدُّر"
      confirm:
        - text: "«(تصدر) ... وتقدم قومه»"
          source: "المعجم الوسيط"
      expands:
        - text: "«تَصَدَّر: limelight (to be in)»"
          source: "مسرد الإعلام (ArabTerm)"
          addition: "يدل على التواجد في بؤرة الضوء (المقدمة)."
    - lemma: "قُدُمِيَّة"
      contradicts:
        - text: "«(القدمية) التَّبَخْتُر يُقَال مَشى القدمية»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي المسجل هو هيئة المشي وليس صفة المكان."

stage3_analysis:
  per_lemma:
    - lemma: "أَمَامِيَّة"
      decision: confirmed
      decision_reason: "مصطلح حديث وعلمي دقيق للتعبير عن Anteriority، خاصة في السياقات التشريحية والمكانية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَمَامِيَّة"
    - lemma: "تَقَدُّم"
      decision: confirmed
      decision_reason: "مصطلح أصيل في الفلسفة والمنطق يعبر عن القبلية (anteriority) بالرتبة أو الزمان أو الطبع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقَدُّم"
    - lemma: "صَدَارَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعني لغوياً التقدم والأولية، وتستخدم بكثرة في السياقات العامة والنحوية للتعبير عن الوجود في المقدمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "صَدَارَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَصَدُّر"
      source: stage1
      decision: removed
      decision_reason: "مصدر فعل (Action) يركز على عملية الوصول للمقدمة، بينما المفهوم المطلوب هو صفة (Quality)."
    - lemma: "قُدُمِيَّة"
      source: stage1
      decision: removed
      decision_reason: "ترتبط في المعاجم بهيئة المشي (التبختر) ولا تشيع كمعادل لـ Anteriority."

stage4_content:
  definition:
    current: "صفة الوجود في المقدمة أو (في الحيوانات الدنيا) باتجاه الرأس"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أكثر دقة ليتضمن الدلالات المكانية والزمنية والبيولوجية."
    authored:
      - type: terminological
        text: "صِفَةُ مَا كَانَ في المُقَدَّمَةِ مَكَانًا أَوْ زَمَانًا، وَفي عِلْمِ الأَحْيَاءِ هِيَ التَّوَجُّهُ نَحْوَ الرَّأْسِ أَوْ نَحْوَ الطَّرَفِ الأَمَامِيِّ لِلجِسْمِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صِفَةُ مَا كَانَ في المُقَدَّمَةِ مَكَانًا أَوْ زَمَانًا، وَفي عِلْمِ الأَحْيَاءِ هِيَ التَّوَجُّهُ نَحْوَ الرَّأْسِ أَوْ نَحْوَ الطَّرَفِ الأَمَامِيِّ لِلجِسْمِ."

  examples:
    per_lemma:
      - lemma: "أَمَامِيَّة"
        examples:
          - text: "تَتَمَيَّزُ بَعْضُ الحَشَرَاتِ بِأَمَامِيَّةِ مَوْقِعِ العُيُونِ لِتَسْهِيلِ الرُّؤْيَةِ."
            type: usage
      - lemma: "تَقَدُّم"
        examples:
          - text: "لِلْعِلَّةِ تَقَدُّمٌ بالذَّاتِ علَى المَعْلُولِ، وَإِنْ وُجِدَا مَعًا في الزَّمَانِ."
            type: usage
      - lemma: "صَدَارَة"
        examples:
          - text: "احْتَلَّ الفَرِيقُ صَدَارَةَ التَّرْتِيبِ بَعْدَ فَوْزِهِ الأَخِيرِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تَتَمَيَّزُ بَعْضُ الحَشَرَاتِ بِأَمَامِيَّةِ مَوْقِعِ العُيُونِ لِتَسْهِيلِ الرُّؤْيَةِ."}

