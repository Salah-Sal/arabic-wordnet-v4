# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13794246-n (dose / dosage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «جرعة» بدون تشكيل كامل — يجب إثبات الضبط الصرفي (جُرْعَة بضم الجيم وسكون الراء)"
      - "المجموعة تحتوي لمّة واحدة فقط رغم أن المقابل الإنجليزي يشمل dose وdosage — قد يستدعي ذلك إضافة لفظ آخر"
    observations: "المفهوم واضح ومحدد: كمية العامل النشط (دواء أو إشعاع) المتناوَلة أو الممتصة دفعة واحدة. هذا مفهوم طبي/صيدلاني له تعبير عربي أصيل راسخ من جذر «جرع» الدال على قلة الشيء المشروب وابتلاعه. التعريف العربي الحالي جيد وشامل يغطي المادة والإشعاع معاً."
  blind_candidates:
    - lemma: "جُرْعَة"
      generation_method: ishtiqaq
      justification: "من الجذر «جرع» الدال على ابتلاع الماء والشراب، على وزن فُعْلَة الدال على المرة الواحدة أو المقدار المحدد مما يُجترع. نقل المعنى من السياق الحسي (شرب الماء) إلى السياق الطبي والعلمي (مقدار الدواء أو الإشعاع) نقل طبيعي مطّرد."
    - lemma: "مِقْدَار عِلَاجِيّ"
      generation_method: tarkib
      justification: "مركب إضافي وصفي من «مقدار» (ما يُقدَّر) و«علاجي» (نسبة إلى العلاج)، يدل على الكمية المحددة لغرض المعالجة. لكنه تعبير وصفي عام وليس مصطلحاً مسكوكاً ثابتاً."
    - lemma: "حِصَّة دَوَائِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «حصة» (نصيب محدد) و«دوائية» (نسبة إلى الدواء). يصف المقدار المخصص من الدواء، لكنه تركيب وصفي حر قابل للإبدال وليس وحدة معجمية ثابتة."
    - lemma: "دُوز"
      generation_method: taarib
      justification: "تعريب مباشر من الإنجليزية dose / الفرنسية dose. يقبل لام التعريف (الدُّوز) والنسبة والجمع السالم، لكنه ملاذ أخير لوجود البديل العربي الأصيل «جُرْعَة»."

stage2_evidence:
  per_lemma:
    - lemma: "جُرْعَة"
      confirm:
        - text: "«(الجرعة) من المَاء حسوة مِنْهُ ملْء الْفَم (ج) جرع»"
          source: "المعجم الوسيط"
        - text: "«من الماء : حُسْوة منه ملء الفم»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(في الطب) dose كميّةُ الدَّواء التى يتعاطاها المريضُ فى المرّةِ الواحدةِ بحسب تقدير الطبيبِ»"
          source: "المعجم الكبير"
        - text: "«الجرعة: قدر ما يجترع من الماء ونحوه أي يبلع والجرع الابتلاع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«والجِرْعَةُ، مثلثَةً، من الماءِ: حَسْوَةٌ منه، أو بالضم والفتح: الاسم من جَرِعَ الماءَ، كَسَمِعَ ومَنَع: بَلِعَه، وبالضم: ما اجْتَرعْتَ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«كمية الدواء المقنّنة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«كمية الدواء التي تؤخذ مرة واحدة»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«الكمية المحددة التي تعطى من الدواء أو الإشعاع المؤيَّن في المرة الواحدة»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«الكمية التي تعطى في المرة الواحدة. كمقدار معين من دواء معين أو من الأشعة»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«في مجال الوقاية ضد الإشعاعات، يصف مسمّى جرعة الإشعاع، كمّية الإشعاع المؤيِّن أو الطاقة المستقبَلة»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
      expands:
        - text: "«الجرعة:[في الانكليزية] Sip، gulp... بالضم وسكون راء مهملة يك آشام من ماء أو شراب وأمثاله. وفي اصطلاح الصوفية: عبارة عن أسرار بعض المقامات لا تزال محجوبة على السالك أثناء سلوكه»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة صوفية اصطلاحية إضافية لا تمسّ الدلالة الطبية/العلمية"
        - text: "«الجَرْعَةُ السَّوْداءُ (فى الصَّيْدَلَة) black draught: دواءٌ مُسهِلٌ، وهو مزيجُ السَّنا المركَّب»"
          source: "المعجم الكبير"
          addition: "تركيب وصفي ثابت «الجرعة السوداء» كمصطلح صيدلاني مخصوص"
    - lemma: "مِقْدَار عِلَاجِيّ"
      evidence_status: "no_material_found"
    - lemma: "حِصَّة دَوَائِيَّة"
      evidence_status: "no_material_found"
    - lemma: "دُوز"
      contradicts:
        - text: "«دوزة — عن الفارسية بمعنى نعيم وجنة. يستخدم للإناث»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الجذر «دوز» في العربية مرتبط باسم علم فارسي الأصل لا بالمفهوم الطبي"

stage3_analysis:
  per_lemma:
    - lemma: "جُرْعَة"
      decision: confirmed
      decision_reason: "لمّة عربية أصيلة من جذر «جرع» الدال على الابتلاع، على وزن فُعْلَة الدال على المقدار. مؤكدة في المعجم الوسيط والمعجم الكبير وأكثر من عشرة معاجم مصطلحية حديثة بمعنى dose بالضبط. التشكيل الكامل: جُرْعَة (بضم الجيم وسكون الراء وفتح العين). اللمّة الأصلية بدون تشكيل — يلزم تحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُرْعَة"
    - lemma: "مِقْدَار عِلَاجِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر وليس مصطلحاً مسكوكاً. يفشل في اختبار السكّ: يمكن إبدال «علاجي» بـ«دوائي» أو «طبي» ويظل التعبير صالحاً كوصف. لا دليل معجمي على تثبيته كوحدة معجمية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "حِصَّة دَوَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل في اختبار السكّ واختبار التثبيت المعجمي. «حصة» تدل على النصيب العام لا على المقدار الطبي تحديداً، ولا شاهد على استعماله مصطلحاً ثابتاً في المعاجم المتخصصة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
    - lemma: "دُوز"
      source: stage1
      decision: removed
      decision_reason: "تعريب لا مسوّغ له مع وجود البديل العربي الأصيل «جُرْعَة» الراسخ في جميع المعاجم الطبية والعلمية. لم يرد في أي معجم مصطلحي عربي بمعنى dose. الجذر مشغول بدلالة فارسية أخرى (اسم علم)."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

