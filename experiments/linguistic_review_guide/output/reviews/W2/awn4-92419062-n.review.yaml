# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-92419062-n
# التعريف: أقصى حمل موصى به يمكن للرافعة رفعه
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (قدرة الرفع)، وهي مركبة إضافية تحتاج تقييم ثبوتها المعجمي"
      - "اللمّة غير مشكّلة"
      - "التعريف العربي جيد لكنه يعتمد على كلمة «الرافعة» التي قد تحدّ من عمومية المفهوم"
    observations: "المفهوم تقني هندسي يتعلق بالحمل الأقصى المسموح به للرافعات. هو مقدار كمّي (فرعه الأعلى: كمية تقديرية). المجال الدلالي يقع بين هندسة الرافعات والسلامة الصناعية. التعبير عنه بالعربية يميل إلى التركيب الإضافي لأنه مفهوم مركب (قدرة + رفع، أو حِمل + صفة)."
  blind_candidates:
    - lemma: "طَاقَةُ الرَّفْعِ"
      generation_method: tarkib
      justification: "مركب إضافي من «طاقة» بمعنى القدرة القصوى و«الرفع»، مستعمل في الأدبيات الهندسية العربية للدلالة على أقصى ما تستطيعه آلة رفع"
    - lemma: "حِمْلٌ مُقَنَّنٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «حِمْل» و«مُقنَّن» أي محدَّد بمواصفات رسمية، يُستخدم في المعايير الهندسية للدلالة على الحمل المسموح به"
    - lemma: "سَعَةُ الرَّفْعِ"
      generation_method: tarkib
      justification: "مركب إضافي من «سَعَة» بمعنى الاستيعاب الأقصى و«الرفع»، على غرار سعة الحمل وسعة التحميل"
    - lemma: "حَدُّ الرَّفْعِ"
      generation_method: tarkib
      justification: "مركب إضافي من «حدّ» بمعنى الغاية القصوى و«الرفع»، يشير إلى الحد الأعلى لما يمكن رفعه"

stage2_evidence:
  per_lemma:
    - lemma: "قُدْرَةُ الرَّفْعِ"
      confirm:
        - text: "«قدرة الرفع — lifting power»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      expands:
        - text: "«القُدرة: الطاقة والقوة على الشيء والتمكن منه»"
          source: "المعجم الوسيط"
          addition: "يؤكد أن القدرة تدل على القوة والتمكن، مما يناسب الدلالة على أقصى ما يمكن رفعه"
        - text: "«الرفع: يقال تارة في الأجسام الموضوعة إذا أعليتها عن مقرها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يؤكد المعنى الحسي للرفع المناسب لسياق الرافعات"

    - lemma: "طَاقَةُ الرَّفْعِ"
      expands:
        - text: "«طاقة الحمل بالخُطَّاف (بالتعليق) — hook load capacity — طاقة روافع برج الحفر»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "يُظهر استعمال «طاقة» في سياق حمل الروافع لكن بتركيب مختلف (طاقة الحمل لا طاقة الرفع)"

    - lemma: "حِمْلٌ مُقَنَّنٌ"
      confirm:
        - text: "«الحِمْل المُقَنَّن [لماكينة ما] — rated load»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«حُمولة مُقَنَّنة — restricted cargo — إرساليات وشحنات تستوجب الموافقة المسبقة وفقا لمقتضيات تشريعات الدولة»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "«حمولة مقنّنة» مسجّلة بمعنى بضائع مقيّدة لا حِمل أقصى، لكن «حِمْل مقنّن» (بصيغة حِمْل لا حمولة) يطابق rated load"
      expands:
        - text: "«حِمْل اسميّ — rated input / nominal load / rated load»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يظهر أن «حِمل اسمي» بديل آخر لـ rated load"

    - lemma: "سَعَةُ الرَّفْعِ"
      expands:
        - text: "«سعة الحمل — load capacity»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يُظهر استعمال «سعة» في سياق الحمل لكن بتركيب «سعة الحمل» لا «سعة الرفع»"
        - text: "«سعة التحميل — load capacity — تقدير لتقبل نظام بيئي لاستخدام مكوناته»"
          source: "مسرد المناخ والبيئة"
          addition: "سعة التحميل مستخدمة في سياق بيئي لا هندسي"

    - lemma: "حَدُّ الرَّفْعِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "قُدْرَةُ الرَّفْعِ"
      decision: confirmed
      decision_reason: "مصطلح مثبت في المعجم الموحد لمصطلحات الفيزياء (1989) بمقابل lifting power، وهو مركب إضافي شفاف المعنى ومتداول في الأدبيات الهندسية العربية. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُدْرَةُ الرَّفْعِ"

    - lemma: "حِمْلٌ مُقَنَّنٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مثبت في المورد الحديث (2008) بمقابل rated load، وهو المقابل الدقيق للمفهوم (الحمل المحدَّد بمواصفات). يختلف عن «قدرة الرفع» بأنه يركز على الحمل نفسه لا على القدرة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يدل على الحمل نفسه باعتباره مقداراً موصوفاً بالتقنين، بينما «قدرة الرفع» تدل على الصفة الكامنة في الرافعة"
      actions:
        - command: create_entry
          params: {lemma: "حِمْلٌ مُقَنَّنٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "طَاقَةُ الرَّفْعِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على توثيق معجمي لهذا التركيب بعينه. الشائع في المعاجم الموحدة «طاقة الحمل» لا «طاقة الرفع»، والإضافة ستكرر المعنى مع «قدرة الرفع» دون تمايز دلالي واضح."
      evidence_assessment:
        case: no_material

    - lemma: "سَعَةُ الرَّفْعِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على توثيق لهذا التركيب. المسجّل هو «سعة الحمل» و«سعة التحميل» في سياقات مختلفة (بيئية وكهربائية)، وليس في سياق الرافعات."
      evidence_assessment:
        case: no_material

    - lemma: "حَدُّ الرَّفْعِ"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي لهذا التركيب، و«حدّ» توحي بقيد سلبي أكثر من كونها مقداراً تقديرياً، مما لا يتوافق مع الفرع الأعلى (كمية تقديرية)."
      evidence_assessment:
        case: no_material

