      mwe: false
    - lemma: "بُرُومِين"
      sense_id: "{auto}"
      nuance: "بديل صوتي شائع متأثر بالإنجليزية."
      mwe: false
    - lemma: "عُنْصُر البُرُوم"
      sense_id: "{auto}"
      nuance: "تسمية تقنية رسمية تؤكد على طبيعة المادة كعنصر كيميائي."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"برم","maqayis":"«الْبَاءُ وَالرَّاءُ وَالْمِيمُ يَدُلُّ عَلَى أَرْبَعَةِ أُصُولٍ: إِحْكَامُ الشَّيْءِ، وَالْغَرَضُ بِهِ، وَاخْتِلَافُ اللَّوْنَيْنِ، وَجِنْسٌ مِنَ النَّبَاتِ...»"}'
