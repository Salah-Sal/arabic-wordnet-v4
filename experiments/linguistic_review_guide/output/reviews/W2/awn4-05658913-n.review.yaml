stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي جيد ولكنه قد يكون أقرب إلى ترجمة حرفية من الإنجليزية."
      - "اللمات الحالية (ذخيرة لغوية ومفردات اللغة) صحيحة وتعبر عن المفهوم، ولكن هناك مصطلحات أخرى أساسية في علم اللسانيات والتراث العربي مثل (معجم)، (متن اللغة)، و(مفردات)."
    observations: "المفهوم الإنجليزي (lexis) أو (vocabulary) يشير إلى مجموع مفردات لغة ما أو الحصيلة اللغوية. في التراث العربي، يُعبر عن ذلك بـ (متن اللغة)، وفي اللسانيات الحديثة يستعمل مصطلح (معجم) بمعناه الذهني، أو (مفردات)، أو (ملفظة)."
  blind_candidates:
    - lemma: "مُفْرَدَات"
      generation_method: ishtiqaq
      justification: "جمع مفردة، وتطلق على الكلمات والألفاظ التي تتكون منها اللغة."
    - lemma: "مُعْجَم"
      generation_method: majaz
      justification: "إطلاق اسم الوعاء (المعجم المكتوب) على ما يحويه من حصيلة الكلمات، ويستخدم في اللسانيات الحديثة للدلالة على المخزون اللفظي الذهني."
    - lemma: "مَتْنُ اللُّغَة"
      generation_method: tarkib
      justification: "مصطلح تراثي يشير إلى أصول الكلمات وألفاظها ومفرداتها في لغة معينة."
    - lemma: "مَلْفَظَة"
      generation_method: ishtiqaq
      justification: "مصطلح لساني حديث (على وزن مفعلة) يدل على قائمة الكلمات أو الألفاظ المتحققة في الاستعمال."

stage2_evidence:
  per_lemma:
    - lemma: "ذخيرة لغوية"
      confirm:
        - text: "في اللسانيات، يميز بين المعجم كذخيرة مفرداتية على مستوى القدرة والملفظة كقائمة من الكلمات تتحقق على مستوى الإنجاز."
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
    - lemma: "مفردات اللغة"
      confirm:
        - text: "مجموع مفردات اللُّغة. مجموع المفردات التي يستخدمها شخص أو طبقة ما"
          source: "المورد الحديث (2008)"
        - text: "ضرورة تعلم مفردات اللغة من أجل تكوين معجم"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
    - lemma: "مُفْرَدَات"
      confirm:
        - text: "vocabulary"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
    - lemma: "مُعْجَم"
      confirm:
        - text: "مخزون من المفردات مودع في ذهن المتكلمين المنتمين إلى جماعة لغوية واحدة."
          source: "مسرد الإعلام والتواصل"
        - text: "في علم اللغة العام، مخزون مفرداتي مودع في ذهن المتكلمين داخل عشيرة ما."
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
    - lemma: "مَتْنُ اللُّغَة"
      confirm:
        - text: "متن اللغة: في م. المحيط (أصولها وألفاظها ومفرداتها)."
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "علم متن اللغة هو معرفة أوضاع المفردات"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
    - lemma: "مَلْفَظَة"
      confirm:
        - text: "قائمة من الكلمات المستعملة في النصوص."
          source: "مسرد الإعلام والتواصل"
        - text: "كقائمة من الكلمات تتحقق على مستوى الإنجاز."
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"

