stage4_content:
  definition:
    current: "جميع كلمات لغة ما؛ جميع أشكال الكلمات ذات المعنى أو الوظيفة النحوية"
    assessment:
      decision: revise
      reason: "التعريف الحالي سليم، ولكن يمكن إعادة صياغته بأسلوب معجمي عربي أمتن ليدل على المخزون اللفظي بدقة."
    authored:
      - type: terminological
        text: "مجموع الكلمات والألفاظ التي تتألف منها لغة من اللغات، وتشمل جميع الوحدات المعجمية ذات الدلالة أو الوظيفة النحوية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموع الكلمات والألفاظ التي تتألف منها لغة من اللغات، وتشمل جميع الوحدات المعجمية ذات الدلالة أو الوظيفة النحوية."

  examples:
    per_lemma:
      - lemma: "ذَخِيرَة لُغَوِيَّة"
        examples:
          - text: "يتمتع الكاتب المتميز بذخيرة لغوية واسعة تعينه على التعبير الدقيق."
            type: usage
      - lemma: "مُفْرَدَات اللُّغَة"
        examples:
          - text: "يتطلب تعلم أي لسان أجنبي حفظ قسم كبير من مفردات اللغة."
            type: usage
      - lemma: "مُفْرَدَات"
        examples:
          - text: "يضم هذا المعجم جميع مفردات الاستعمال اليومي."
            type: usage
      - lemma: "مُعْجَم"
        examples:
          - text: "يُخزن المتكلم في ذهنه معجماً غنياً بالألفاظ يسترده عند الحاجة."
            type: usage
      - lemma: "مَتْنُ اللُّغَة"
        examples:
          - text: "اهتم اللغويون القدامى بجمع متن اللغة من أفواه العرب الخُلَّص."
            type: usage
      - lemma: "مَلْفَظَة"
        examples:
          - text: "تدرس اللسانيات التطبيقية ملفظة المتعلمين في مراحلهم الأولى."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "اهتم اللغويون القدامى بجمع متن اللغة من أفواه العرب الخُلَّص."
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يتمتع الكاتب المتميز بذخيرة لغوية واسعة تعينه على التعبير الدقيق."
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُخزن المتكلم في ذهنه معجماً غنياً بالألفاظ يسترده عند الحاجة."

