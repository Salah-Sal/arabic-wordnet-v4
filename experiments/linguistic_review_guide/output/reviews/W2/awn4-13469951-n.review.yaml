# مراجعة المجموعة الترادفية — awn4-13469951-n (chromatography)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم «القابلية للامتصاص» (absorption) بينما الآلية الفعلية هي الادمصاص (adsorption) أو التوزع بين الأطوار"
      - "المجموعة الفائقة (hypernym) هي «عملية طبيعية» والكروماتوغرافيا عملية مخبرية صناعية وليست طبيعية"
    observations: "المفهوم تقنيّ كيميائيّ محض: فصل مكوّنات المخاليط بتمريرها عبر طور ثابت وطور متحرّك، فتتفرّق بحسب قابليّتها للامتزاز أو التوزّع. المصطلح الإنجليزي مأخوذ من اليونانية (chroma = لون + graphein = كتابة) لأنّ أولى التجارب أنتجت أشرطة لونية. في العربية شاع مصطلحان رئيسيان: اشتقاقيّ (استشراب) ومعرَّب (كروماتوغرافيا)، إضافة إلى مصطلح الصيدلة (تفريق لونيّ)."
  blind_candidates:
    - lemma: "اسْتِشْرَاب"
      generation_method: ishtiqaq
      justification: "مصدر على وزن اسْتِفْعَال من الجذر ش-ر-ب، يدلّ على طلب الشَّرْب (الامتصاص)، وهو الآلية الأساسية للكروماتوغرافيا حيث يُمتَصّ المذاب في الطور الثابت"
    - lemma: "تَفْرِيقٌ لَوْنِيّ"
      generation_method: tarkib
      justification: "مركّب وصفيّ من تفريق (فصل) ولونيّ (نسبة إلى اللون)، يعكس أصل التسمية اليونانية حيث تنفصل المكوّنات إلى أشرطة لونية"
    - lemma: "رِسَامَة لَوْنِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفيّ من رسامة (فِعالة للآلة/العملية من رسم) ولونية، يقابل المعنى الحرفي لـchromatography (كتابة الألوان)"
    - lemma: "كُرُومَاتُوغْرَافِيَا"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الأجنبي chromatography، شائع في المعاجم العلمية العربية ويقبل النسبة (كروماتوغرافيّ) والإضافة"

stage2_evidence:
  per_lemma:
    - lemma: "اسْتِشْرَاب"
      confirm:
        - text: "«اسْتِشْراب؛كروماتوغرافيا»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«التحليل الاستشرابيّ (ك).»"
          source: "المورد الحديث (2008)"
        - text: "«إستشراب عمودي» / «إستشراب غازي» / «إستشراب هلامي» / «إستشراب ورقي» / «إستشراب تبادل أيوني»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«اسْتِشْرابٌ امْتِزازِيّ»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«استشراب بتبادل الأيونات — طريقة تحليلية في الكيمياء أو علم الأحياء، يُمكن عن طريقها فصل المواد تبعاً لشحناتها.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«يجمع مصطلح اشتراب كلا العمليتين: الامتصاص والامتزاز (أو الأدمصاص).»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "مصطلح اشتراب (بدون السين) يجمع الامتصاص والامتزاز معاً، مما يؤكد أن استشراب يدل على العملية الجامعة"

    - lemma: "كُرُومَاتُوغْرَافِيَا"
      confirm:
        - text: "«كروماتوغرافيا — chromatography»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«كروماتوغرافيا — فصل كيميائيّ للمواد اعتماداً على خاصية الادمصاص التفضيليّ أو تجزئة مكونات المادة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«كروماتوجرافيا — الاستناد إلى أزمنة المسير المُختلفة لمُكوِّنات خليط ما على وسط مُعيَّن، من أجل فصل هذه المُكوِّنات (التفريق بينها) وفحصها واحداً تلو الآخر زمنياً.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
        - text: "«اسْتِشْرابِيّ؛كروماتوغرافيّ»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«تُستخدم الأجهزة التي تعتمد على الكروماتوجرافيا في تعيين تركيب السوائل والغازات.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          addition: "توسيع لنطاق الاستخدام ليشمل تحليل السوائل والغازات"

    - lemma: "تَفْرِيقٌ لَوْنِيّ"
      confirm:
        - text: "«تفْرِيق لَوْنِيّ — chromatography»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«تَفْرِيق لَوْنِيّ غَازِيّ — إمرار الغاز في عمود يحتوي على مواد مازة مختلفة حسب حالات الغاز نفسه»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«تَفْرِيق لَوْنِيّ بالادْمِصَاص — adsorption chromatography»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"

    - lemma: "رِسَامَة لَوْنِيَّة"
      confirm:
        - text: "«رِسامة لونية (كروماتوغرافيا) — طريقة تحليل كيميائي، يوضع المحلول المراد تحليله في أنبوبة زجاجية رأسية بها مواد امتزازية، فتعبر المواد المذابة في العمود الامتزازي بسرعات مختلفة محدثة شرائط لونية في مستويات مختلفة.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"

stage3_analysis:
