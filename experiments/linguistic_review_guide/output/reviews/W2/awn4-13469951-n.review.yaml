    - lemma: "اسْتِشْرَاب"
      decision: confirmed
      decision_reason: "مصطلح اشتقاقي عربي أصيل على وزن استفعال من الجذر ش-ر-ب، معتمد في المعجم الطبي الموحد والمَكنَز الزراعي والمورد الحديث ومعجم الطاقة المتجددة. يتمتع بإنتاجية اشتقاقية عالية (استشرابيّ، مُستشرَب) وقد بُنيت عليه عشرات المصطلحات المركبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح العربي الاشتقاقي الرسمي، يُفضَّل في السياقات العلمية الرسمية والمعاجم الموحّدة، ويمتاز بالقدرة الاشتقاقية (استشرابيّ، مُستشرَب، مَسكبة الاستشراب)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِشْرَاب"

    - lemma: "كُرُومَاتُوغْرَافِيَا"
      decision: confirmed
      decision_reason: "مصطلح معرَّب واسع الانتشار في المعاجم العلمية العربية (الكيمياء، تقانات الأغذية، الهندسة الكهربائية، الطب). شائع في الاستعمال الفعلي وإن كان المصطلح الاشتقاقي أولى. يقبل النسبة (كروماتوغرافيّ) والإضافة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المعرَّب الدوليّ، أكثر شيوعاً في الممارسة المخبرية اليومية وفي المعاجم القديمة، لكنه أقلّ اشتقاقية من «استشراب»"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كُرُومَاتُوغْرَافِيَا"

    - lemma: "تَفْرِيقٌ لَوْنِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد في المعجم الموحد لمصطلحات الصيدلة (2009) وبُنيت عليه مركبات عديدة (تفريق لونيّ غازيّ، تفريق لونيّ على الورق، إلخ). مركب وصفي ثابت معجمياً."
      evidence_assessment:
