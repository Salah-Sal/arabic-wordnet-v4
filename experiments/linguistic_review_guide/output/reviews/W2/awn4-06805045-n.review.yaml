          conflict: "النفير في المعجم الوسيط يعني القوم الذين ينفرون للقتال أو الكفء في المفاخرة، لا إشارة البدء"
        - text: "«نفير — هو جهاز إشارات سمعية... يُصدر صوتاً أو أصواتاً مُتتابعة» — translation_en: fanfare"
