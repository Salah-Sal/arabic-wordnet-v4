stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (إشارة البدء)، ويمكن إثراؤها بمرادفات مثبتة"
      - "التعريف العربي ترجمة حرفية مختصرة من الإنجليزية، يحتاج إلى صياغة معجمية أصيلة"
    observations: "المفهوم واضح ومتداول في سياق الرياضة والمسابقات: إشارة تُعطى لبدء السباق أو نشاط ما. المصطلح «إشارة البدء» تركيب إضافي شفاف ومثبت في عدة معاجم مصطلحية عربية. الجنس القريب هو «إشارة» (الذي هو أعلى منه في التسلسل الدلالي). يمكن البحث عن مرادفات من باب الانطلاق أو الإيذان."
  blind_candidates:
    - lemma: "إِيذَانَة"
      generation_method: ishtiqaq
      justification: "من جذر أ ذ ن بمعنى الإعلام والإذن، على وزن فِعَالَة الدال على المرة الواحدة من الحدث، فالإيذانة ما يُؤذَن به ببدء شيء"
    - lemma: "نَفِير"
      generation_method: majaz
      justification: "النفير أصلاً صوت البوق الذي يُنفَر به للقتال أو الخروج، فيُستعار مجازاً لإشارة البدء التي تُطلق في السباقات"
    - lemma: "إِشَارَة الِانْطِلَاق"
      generation_method: tarkib
      justification: "تركيب إضافي من إشارة + الانطلاق، مثبت في معاجم المصطلحات العربية في مجالي النقل والرياضة"
    - lemma: "طَلْقَة البَدْء"
      generation_method: tarkib
      justification: "تركيب إضافي من طلقة + البدء، يشير إلى طلقة المسدس التي تُطلق في بداية السباقات كإشارة للانطلاق"

