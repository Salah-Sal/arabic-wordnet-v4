        التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي. يمكن تحسينه بتقديم الجنس القريب
        (شخص) مع فصل نوعي أدق يعكس الاستعمال العربي ويتجنّب تكرار مادة «أنقذ» دوراناً.
    authored:
      - type: terminological
        text: "من يتولّى انتشال شخص أو شيء من خطر داهم أو عنف محدق وتخليصه منه"
        quality_check:
          genus_present: true
