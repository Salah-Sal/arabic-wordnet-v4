# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10542352-n
# rescuer / recoverer / saver — شخص ينقذ شيئاً أو شخصاً من خطر أو عنف
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «مُخَلِّص» تحتمل دلالة التصفية والتنقية (المعنى الأصلي لجذر خلص) أكثر من دلالة الإنقاذ، وقد تلتبس بالمعنى الديني (المسيح المخلِّص)."
      - "لا يوجد في المجموعة لمّة من جذر غ-و-ث رغم أنه الجذر الأقرب لمفهوم الإغاثة من الشدة."
    observations: >
      التعريف يصف فاعلاً يُنقذ شخصاً أو شيئاً من خطر أو عنف. الجذور العربية المرشحة:
      ن-ق-ذ (استخلاص شيء من قوم أو خطر)، خ-ل-ص (تنقية وتهذيب، ثم امتدّ للإنقاذ مجازاً)،
      غ-و-ث (الإغاثة والنصرة عند الشدة)، ن-ج-د (القوة والشجاعة والإعانة).
      المفهوم أصيل في الثقافة العربية وله تعبيرات اشتقاقية متعددة.
  blind_candidates:
    - lemma: "مُغِيث"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أغاثَ (باب الإفعال) من جذر غ-و-ث الدالّ على الإغاثة والنصرة عند الشدة، وهو أقرب الجذور دلالةً للإنقاذ من الخطر."
    - lemma: "مُنْجِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أنجدَ من جذر ن-ج-د الدالّ على الشجاعة والقوة والإعانة. يُقال: استنجدته فأنجدني أي استغثته فأغاثني."
    - lemma: "مُسْتَنْقِذ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استنقذَ (باب الاستفعال) من جذر ن-ق-ذ، بمعنى من يسعى إلى إنقاذ شيء واستخلاصه، وفيه دلالة على بذل الجهد في الإنقاذ."
    - lemma: "نَقَّاذ"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من جذر ن-ق-ذ، للدلالة على كثير الإنقاذ أو المحترف فيه."


stage2_evidence:
  per_lemma:
    - lemma: "مُخَلِّص"
      confirm:
        - text: "«(1) المنقِذ؛ المُنجي (2) cap.: المخلِّص: المسيح؛ عيسى بن مريم»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«مُخَلِّص: من (خ ل ص) مُصفي الشيء ومنقيه من شوائبه، ومميز الشيء من غيره.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعنى المعجمي الأصلي للمخلِّص هو التصفية والتنقية لا الإنقاذ من الخطر"
      expands:
        - text: "«الخَاءُ وَاللَّامُ وَالصَّادُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، وَهُوَ تَنْقِيَةُ الشَّيْءِ وَتَهْذِيبُهُ. يَقُولُونَ: خَلَّصْتُهُ مِنْ كَذَا وَخَلَصَ هُوَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "عبارة خلّصته من كذا تدلّ على أن الفعل تعدّى من التنقية المادية إلى التخليص من المكروه"

    - lemma: "مُنْقِذ"
      confirm:
        - text: "«(1) المنقِذ؛ المُنجي (2) cap.: المخلِّص: المسيح»"
          source: "المورد الحديث (2008)"
        - text: "«(1) يُنقِذ (2) يحرِّر [من السجن] بالقوّة (3) يستردّ [غنيمةً] بالقوة (4) إنقاذ.»"
          source: "المورد الحديث (2008) — مادة rescue"
      expands:
        - text: "«النُّونُ وَالْقَافُ وَالذَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اسْتِخْلَاصِ شَيْءٍ. وَأَنْقَذْتُهُ مِنْهُ: خَلَّصْتُهُ. وَفَرَسٌ نَقِيذٌ: أُخِذَ مِنْ قَوْمٍ آخَرِينَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ أصلاً على استخلاص شيء من حالة سلبية، وهو المعنى الدقيق للإنقاذ"

    - lemma: "مُغِيث"
      confirm:
        - text: "«مُغِيث: من (غ و ث) الناصر والمعين.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«الْغَيْنُ وَالْوَاوُ وَالثَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الْغَوْثُ مِنَ الْإِغَاثَةِ، وَهِيَ الْإِغَاثَةُ وَالنُّصْرَةُ عِنْدَ الشِّدَّةِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر مخصّص للنصرة عند الشدة وهو قريب من الإنقاذ لكنه أعمّ"

    - lemma: "مُنْجِد"
      confirm:
        - text: "«مُنْجِد: من (ن ج د) الناصر المعين، والمرتفع، والمجيب الدعوة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«وَيُقَالُ: اسْتَنْجَدْتُهُ فَأَنْجَدَنِي، أَيِ اسْتَغَثْتُهُ فَأَغَاثَنِي.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أنجد تعادل أغاث في السياق، لكن الجذر أصله في القوة والشجاعة لا في الاستخلاص"

    - lemma: "مُسْتَنْقِذ"
      evidence_status: "no_material_found"

    - lemma: "نَقَّاذ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "مُخَلِّص"
      decision: confirmed
      decision_reason: >
        رغم أن المعنى الأصلي لجذر خ-ل-ص هو التنقية والتصفية، فإن الاستعمال المعاصر رسّخ دلالة
        «المخلِّص» على من ينقذ ويحرر. وقد ورد في المورد الحديث مرادفاً للمنقذ والمنجي.
        الكلمة متداولة وصالحة للاستعمال في هذه المجموعة مع التنبيه على الفارق الدلالي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على التحرير من قيد أو ورطة مع إيحاء بالتصفية من الشوائب، ويحمل ظلالاً دينية
        (المسيح المخلِّص)، فيُستعمل في السياقات الأدبية والدينية أكثر من سياقات الطوارئ المادية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَلِّص"

    - lemma: "مُنْقِذ"
      decision: confirmed
      decision_reason: >
        الجذر ن-ق-ذ يدلّ أصلاً على «استخلاص شيء» كما نصّ ابن فارس، وهو الأدقّ لمفهوم الإنقاذ
        من خطر. ورد في المورد الحديث ترجمةً لـ savior ومادة rescue. اللفظ هو الأكثر تداولاً
        في اللغة المعاصرة للدلالة على من يُنقذ من خطر مادي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الأكثر حيادية ومباشرة في الدلالة على فعل الإنقاذ من خطر محسوس (حريق، غرق، حادث)،
        لا يحمل ظلالاً دينية أو أدبية خاصة. هو المصطلح الافتراضي في لغة الإعلام والطوارئ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْقِذ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُغِيث"
      source: stage1
      decision: removed
      decision_reason: >
        جذر غ-و-ث يدلّ على الإغاثة والنصرة عند الشدة وهو أعمّ من الإنقاذ. المغيث هو الناصر
        والمعين بشكل عام، وليس بالضرورة من ينتشل من خطر محدّد. الكلمة أنسب لمجموعة
        ترادفية تتعلق بالإغاثة (helper/aider) لا بالإنقاذ (rescuer) تحديداً.

    - lemma: "مُنْجِد"
      source: stage1
      decision: removed
      decision_reason: >
        جذر ن-ج-د أصله في القوة والشجاعة والاعتلاء. والمُنجِد ورد بمعنى الناصر المعين
        والمرتفع والمجيب الدعوة، وهي دلالات أعمّ من الإنقاذ. كما أن المُنَجِّد (بتشديد الجيم)
        يعني من يزيّن البيت بالفرش والستور، مما يولّد التباساً صرفياً.

    - lemma: "مُسْتَنْقِذ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد شواهد معجمية للفظ. وهو على وزن مُسْتَفْعِل الثقيل نسبياً، والمعنى مغطّى
        تماماً بـ«مُنْقِذ» الأخفّ والأشيع.

    - lemma: "نَقَّاذ"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مبالغة غير مسموعة ولا مسجّلة في المعاجم. لا حاجة لها مع وجود مُنْقِذ
        ومُخَلِّص اللذين يغطيان المفهوم.


