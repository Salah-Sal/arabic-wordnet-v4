stage1_review:
  assessment:
    concerns:
      - "اللمة 'رواسب القاع' هي تعبير وصفي (MWE) مكون من مضاف ومضاف إليه، وليست مفردة معجمية بسيطة، والأولى استبدالها بمفردات معجمية ثابتة مثل 'رسابة'."
      - "اللمة 'حثالة' تُستخدم غالباً للنفايات الصلبة (كرديء القمح أو التمر) أو مجازاً للأراذل، واستخدامها للرواسب السائلة أقل دقة من 'ثفل' أو 'دردي'."
      - "غياب مصطلحات دقيقة مثل 'دردي' (للرواسب الزيتية) و'عكارة' و'رسابة' وهي مصطلحات مركزية لهذا المفهوم."
    observations: "المجموعة تدور حول المادة الصلبة التي تستقر في قعر السائل. المصطلح التراثي الأدق هو 'الثفل'، وهناك مصطلحات تقنية وحديثة تدعم المفهوم بدقة عالية."
  blind_candidates:
    - lemma: "دُرْدِيّ"
      generation_method: majaz
      justification: "مصطلح تراثي دقيق لما يرسب في أسفل السوائل (كالزيت والعسل)، وهو من أصل معجمي ثابت لهذا المعنى."
    - lemma: "رُسَابَة"
      generation_method: ishtiqaq
      justification: "اسم لما يرسب من المادة في قاع السائل على وزن (فعالة) الدال على البقايا والنفايات، وهو المصطلح التقني الشائع."
    - lemma: "عُكَارَة"
      generation_method: ishtiqaq
      justification: "من العكر، وهو ما يترسب في قعر الإناء من الكدر، وصيغة (فعالة) تدل على ما يتبقى من الشيء."
    - lemma: "ثُفَالَة"
      generation_method: ishtiqaq
      justification: "صيغة مشتقة من (ثفل) شائعة في المعاجم الطبية والتقنية كمرادف مباشر لـ (sediment)."

stage2_evidence:
  per_lemma:
    - lemma: "ثفل"
      confirm:
        - text: "«ما استقرَّ تحت الماء ونحوه من كدر»"
          source: "المعجم الوسيط"
        - text: "«The sediment, or settlings, of anything; the dregs; lees; or thick, or turbid, portion that sinks to the bottom of a thing»"
          source: "Lane's Lexicon"
    - lemma: "حثالة"
      confirm:
        - text: "«الحُثَالَةُ: الطِّيبِ والدُّهْنِ وما أَشْبَهَهُما: ثُفْلُه»"
          source: "المعجم الكبير"
      expands:
        - text: "«الرَّديءُ من كُلِّ شىء... القشارة من التَّمْرِ والشعير والأرز وما أشبهها»"
          source: "المعجم الكبير"
          addition: "الاستخدام الأوسع للحثالة هو في النفايات الصلبة."
    - lemma: "رواسب القاع"
      evidence_status: "no_material_found"
    - lemma: "دُرْدِيّ"
      confirm:
        - text: "«ما رسب أسفل العسل والزيت ونحوهما من كل شيء مائع كالأشربة والأدهان»"
          source: "المعجم الوسيط"
        - text: "«ما يَرْكُدُ في أَسْفَلِ كُلِّ مائِعٍ»"
          source: "المعجم الكبير"
    - lemma: "رُسَابَة"
      confirm:
        - text: "«ما يَرْسُبُ أَسْفَلَ الإناءِ والنَّهْر والمَسِيل»"
          source: "المعجم الكبير"
        - text: "«المادة الصلبة المترسبة من سائل»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
    - lemma: "عُكَارَة"
      confirm:
        - text: "«ترسَّبت العُكارة في قعر الإناء... وزن «فُعالة» الدالّ على بقية الأشياء»"
          source: "معجم الصواب اللغوي"
    - lemma: "ثُفَالَة"
      confirm:
        - text: "«ثُفَالَة: sediment»"
          source: "المعجم الطبي الموحد"

stage3_analysis:
  per_lemma:
    - lemma: "ثفل"
      decision: confirmed
      decision_reason: "المصطلح العربي الأصيل والأكثر دقة لوصف الرواسب التي تستقر في قاع السوائل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثُفْل"
    - lemma: "حثالة"
      decision: confirmed
      decision_reason: "مقبول كمرادف ثانوي، خاصة في سياق رواسب الزيوت والأدهان، وإن كان يُستخدم في معانٍ أخرى أوسع."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُثَالَة"
    - lemma: "رواسب القاع"
      decision: removed
      decision_reason: "تعبير وصفي مركب وليس مفردة معجمية مسكوكة، وتغني عنه مفردات مثل 'رسابة' و'ثفل'."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "دُرْدِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق جداً لرواسب السوائل المائعة كالزيت والشراب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دُرْدِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "رُسَابَة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح التقني المعاصر الأدق والأكثر شيوعاً لوصف المادة المترسبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رُسَابَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "عُكَارَة"
      source: stage1
      decision: confirmed
      decision_reason: "شائع الاستخدام لوصف بقايا السوائل الكدرة التي تستقر في القعر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عُكَارَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ثُفَالَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد في المعاجم العلمية والطبية كمرادف دقيق لـ (sediment)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ثُفَالَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الرواسب التي استقرت في قاع سائل"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط، والأفضل صياغته بأسلوب المعجم الوسيط لبيان طبيعة المادة."
    authored:
      - type: terminological
        text: "مادّةٌ كَدِرَةٌ صَلْبَةٌ تَرْسُبُ وتَسْتَقِرُّ في قاعِ السَّوائِلِ ونَحْوِها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "ثُفْل"
        examples:
          - text: "تَخلّصتُ من ثُفْل القهوة قبل غسل الفنجان."
            type: usage
      - lemma: "دُرْدِيّ"
        examples:
          - text: "يحتوي الزيت القديم على دُرْدِيٍّ في أسفل القنينة."
            type: usage
      - lemma: "رُسَابَة"
        examples:
          - text: "أظهرت نتائج المختبر وجود رُسابة بولية غير طبيعية."
            type: usage
      - lemma: "عُكَارَة"
        examples:
          - text: "ترسَّبت العُكارة في قعر الإناء بعد تركه ساكناً لساعات."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "مادّةٌ كَدِرَةٌ صَلْبَةٌ تَرْسُبُ وتَسْتَقِرُّ في قاعِ السَّوائِلِ ونَحْوِها."}

stage5_enrichment:
  per_entry:
    - lemma: "ثُفْل"
      entry_id: "{auto}"
      root: "ثفل"
      maqayis_quote: "«الثَّاءُ وَالْفَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ الشَّيْءُ يَسْتَقِرُّ تَحْتَ الشَّيْءِ، يَكُونُ ذَلِكَ مِنَ الْكَدَرِ وَغَيْرِهِ.»"
    - lemma: "حُثَالَة"
      entry_id: "{auto}"
      root: "حثل"
      maqayis_quote: "«الْحَاءُ وَالثَّاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى سُوءٍ وَحَقَارَةٍ... حُثَالَةُ الدُّهْنِ وَمَا أَشْبَهَهُ: ثُفْلُهُ.»"
    - lemma: "دُرْدِيّ"
      entry_id: "{auto}"
      root: "درد"
      maqayis_quote: "«الدَّالُ وَالرَّاءُ وَالدَّالُ أُصَيْلٌ فِيهِ كَلَامٌ يَسِيرٌ. فَالدَّرَدُ مِنَ الْأَسْنَانِ: لُصُوقُهَا بِالْأَسْنَاخِ.» (ملاحظة: المعنى التقني للرواسب لم يرد في المقاييس لهذا الجذر)"
    - lemma: "رُسَابَة"
      entry_id: "{auto}"
      root: "رسب"
      maqayis_quote: "«الرَّاءُ وَالسِّينُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، هُوَ ذَهَابُ الشَّيْءِ سُفْلًا مِنْ ثَِقَلٍ. تَقُولُ: رَسَبَ الْحَجَرُ فِي الْمَاءِ يَرْسُبُ.»"
    - lemma: "عُكَارَة"
      entry_id: "{auto}"
      root: "عكر"
      maqayis_quote: "«الْعَيْنُ وَالْكَافُ وَالرَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ... وَمِنَ الْبَابِ: الْعَكِرُ. دُرْدِيُّ الزَّيْتِ.»"
    - lemma: "ثُفَالَة"
      entry_id: "{auto}"
      root: "ثفل"
      maqayis_quote: "«الثَّاءُ وَالْفَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ الشَّيْءُ يَسْتَقِرُّ تَحْتَ الشَّيْءِ.»"
  per_sense:
    - lemma: "ثُفْل"
      sense_id: "{auto}"
      nuance: "المصطلح العام والشامل لأي رواسب أو بقايا بعد العصر أو الغلي."
      mwe: false
    - lemma: "حُثَالَة"
      sense_id: "{auto}"
      nuance: "غالباً ما يُستخدم لرواسب المواد الزيتية والعطرية، وله دلالة على الرداءة."
      mwe: false
    - lemma: "دُرْدِيّ"
      sense_id: "{auto}"
      nuance: "خاص بما يرسب في قاع السوائل المائعة كالزيت والشراب والعسل."
      mwe: false
    - lemma: "رُسَابَة"
      sense_id: "{auto}"
      nuance: "مصطلح تقني حديث يركز على المادة المترسبة نفسها في أي وسط سائل."
      mwe: false
    - lemma: "عُكَارَة"
      sense_id: "{auto}"
      nuance: "يركز على الشوائب والكدر الذي يمنع صفاء السائل ثم يستقر في قاعه."
      mwe: false
    - lemma: "ثُفَالَة"
      sense_id: "{auto}"
      nuance: "يُستخدم بكثرة في السياقات الطبية والمخبرية (مثل ثفالة البول)."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ثفل","maqayis":"«الثَّاءُ وَالْفَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ الشَّيْءُ يَسْتَقِرُّ تَحْتَ الشَّيْءِ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح العام والشامل لأي رواسب أو بقايا بعد العصر أو الغلي.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
