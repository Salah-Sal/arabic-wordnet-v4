# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — من التعريف فقط (قبل الاطلاع على اللمّات الموجودة)
  # التعريف: "حالة أكل كل من المواد الحيوانية والنباتية"
  # المفهوم: الأَكْل الجامع بين النباتي والحيواني — omnivory
  blind_candidates:

    - lemma: "أَكُولِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر (أكل)، على وزن (فَعُول) الدالّ على الطبع الراسخ والقابلية، فأَكُول = شديد الأكل،
        ثم اشتُقَّت المصدر الصناعي (فَعُولِيَّة) للدلالة على الخاصِّيَّة المجردة. تُعبِّر عن
        "صفة أكل الكل" بصيغة مصطلحية مُفردة.

    - lemma: "شُمُولُ الأَكْلِ"
      generation_method: tarkib
      justification: >
        مركَّب إضافي (إضافي): شمول (من شَمَلَ = أحاط بالجميع) + الأكل. الشمول في العربية يُفيد
        الإحاطة الكاملة بجميع الأصناف، فيكون المركب دالًّا على حالة الأكل من جميع المصادر
        الغذائية حيوانيةً ونباتية.

    - lemma: "الِاقْتِيَاتُ الشَّامِل"
      generation_method: majaz
      justification: >
        مجاز بالإزاحة الدلالية: الاقتيات (الأصل: اتخاذ القوت والتغذي منه) أُضيف إليه الوصف
        "الشامل" ليدلّ على كون الكائن يقتات من مصادر شتى — نباتية وحيوانية. الاقتيات لفظ
        فصيح كلاسيكي يُوحي بالتغذية المنتظمة لا الشَّرَه.

    - lemma: "التَّغَذِّي المُزْدَوَج"
      generation_method: tarkib
      justification: >
        مركَّب وصفي (wasfi): التغذي + المزدوج. الازدواج في العربية يُفيد الجمع بين شيئين،
        فالتغذي المزدوج يُشير إلى الجمع بين مصدرَيِ الغذاء: النباتي والحيواني. اختبار السكّ:
        إبدال "المزدوج" بـ"المتنوع" يُغيّر المعنى ويُوسِّعه — مقبول شرطيًّا.

  # ب. التقييم الأوّلي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - >
        "تغذية شاملة": عبارة وصفية حرة لا ترقى إلى مستوى المصطلح المعجمي الثابت؛ تفشل
        اختبار السكّ لأن "شاملة" يمكن إبدالها بـ"متنوعة" أو "كاملة" دون تغيير التركيب النحوي.
      - >
        "قارتية": اللمّة معقولة وقابلة للتحقق، غير أن ابن فارس يُقرّر أن جذر (قرت) يدلّ
        على تغيّر اللون والقبح لا على الأكل — ما يُثير تساؤلاً عن أصل التسمية التقنية.
      - >
        غياب التشكيل عن "قارتية" في قاعدة البيانات — يستلزم التصحيح.
      - >
        تعريف المجموعة "حالة أكل كل من المواد..." يستخدم "حالة" بمعنى state، بينما التضمين
        الفوقي (خاصّيّة جوهرية) يُشير إلى characteristic — ثمة توتر مفهومي يستحق معالجة.
    observations: >
      المجموعة تُمثِّل مفهوم "القارتية" (omnivory/omnivorousness) بوصفه خاصّيةً مجردة
      للكائنات القادرة على الاغتذاء من المصدرَيْن الحيواني والنباتي. اللمّة "قارتية" مشتقة
      من "قارت" (omnivore) الموثَّق توثيقًا واسعًا في المعاجم التقنية العربية الحديثة
      (الطب البيطري، الأحياء، المناخ والبيئة، الجغرافيا). أما "تغذية شاملة" فعبارة وصفية
      عامة تستعمل في اللغة العامة دون تخصيص دلالي مُحكَم للمفهوم البيولوجي. يُلاحَظ
      غياب المصطلح "القارتية" بالتعريف العربي المستقل في القواميس الورقية الكلاسيكية مما
      يُؤكّد حداثة التوحيد المصطلحي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   ١. English bridge — omnivory, omnivorousness, omnivorous, omnivore (pattern ٧)
#   ٢. Batch headword lookup — قارتية، قارت، تغذية شاملة + مرشّحات (pattern ١)
#   ٣. Arabic FTS — قارت، أكل كل، حيوانية ونباتية (pattern ٦)
#   ٤. Maqayis al-Lugha — جذر قرت (pattern enrichment)
#   ٥. نهمة / نهم — التحقق من مصطلح AGROVOC

stage2_evidence:
  per_lemma:

    - lemma: "تغذية شاملة"
      evidence_status: "no_material_found"
      # لم يُعثَر على هذه العبارة في أيّ مدخل معجمي متخصص بهذا المعنى المحدد.

    - lemma: "قارتية"
      confirm:
        - text: >
            «آكل المواد النباتية والحيوانية.»
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — مدخل: قارت"
        - text: >
            «حيوان عاشب ولاحم، يتغذى على النباتات والحيوانات.»
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO) — مدخل: قارت"
        - text: >
            «القارت: واحد القوارت وهي الحيوانات التي تقتات بكل شيء أو بالمواد
            الحيوانية والنباتية معًا.»
          source: "المورد الحديث (2008) — مدخل: القارت"
        - text: >
            «قارِت: «أ» آكلٌ مختلف ضروب الأطعمة. «ب» شرِه؛ نَهِم.»
          source: "المورد الحديث (2008) — مدخل: قارت (omnivorous)"
        - text: >
            «قارِت (آكلُ كلِّ شيء)» — بترجمة: omnivorous
          source: "المعجم الطبي الموحد (2009)"
        - text: >
            «قارت» — بترجمة: omnivore (Ol. Omnivora) (L.)، الجمع: قورات
          source: "مسرد الجغرافيا والتاريخ (ALECSO)"
        - text: >
            «قارِت: مُغْتذٍ بضروب مختلفة من الطعام.»
          source: "المورد الحديث (2008) — مدخل: قارت (polyphagous)"
      expands:
        - text: >
            «(قَرَتَ) الْقَافُ وَالرَّاءُ وَالتَّاءُ أُصَيْلٌ يَدُلُّ عَلَى قُبْحٍ فِي سَحْنَةٍ.
            يَقُولُونَ: قَرِتَ وَجْهُ الرَّجُلِ: تَغَيَّرَ مِنْ حُزْنٍ. وَأَصْلُ ذَلِكَ مِنْ
            قَرَِتَ الدَّمُ، إِذَا يَبِسَ بَيْنَ الْجِلْدِ وَاللَّحْمِ. وَهُوَ دَمٌ قَارِتٌ.
            وَقَرِتَ الْجِلْدُ، إِذَا ضُرِبَ فَاسْوَدَّ.»
          source: "مقاييس اللغة لابن فارس (ت ١٠٠٤م) — مدخل: قرت"
          addition: >
            ابن فارس لا يذكر أي صلة بين الجذر (قرت) والأكل أو التغذية — الدلالة الكلاسيكية
            تتعلق بتغيّر اللون والقبح في السحنة. هذا يُثبت أن توظيف "قارت" بمعنى omnivore
            اصطلاح تقني حديث لا رسوخ له في الموروث الكلاسيكي، ما يعني أن "قارتية" اشتقاق
            تقني من توظيف تقني حديث.

    # — المرشحات من المرحلة ١ —

    - lemma: "أَكُولِيَّة"
      evidence_status: "no_material_found"

    - lemma: "شُمُولُ الأَكْلِ"
      evidence_status: "no_material_found"

    - lemma: "الِاقْتِيَاتُ الشَّامِل"
      evidence_status: "no_material_found"

    - lemma: "التَّغَذِّي المُزْدَوَج"
      evidence_status: "no_material_found"

  # ملاحظة إضافية — النهمة في AGROVOC
  # وجدت "النهمة" مُقابَلة لـ omnivory في AGROVOC (entry_id: 759429)،
  # غير أن المعاجم الكلاسيكية تُجمع على أن النهمة = "إفراط الشهوة في الطعام"
  # (الجوهري، ابن فارس) و"بلوغ الهمّة في الشيء" — أي الشَّرَه لا القارتية.
  # يُعدّ هذا الاقتران في AGROVOC خطأً دلاليًّا وليس شاهدًا معتمدًا.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ══ اللمّات الموجودة ══

    - lemma: "تغذية شاملة"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة (مركَّب وصفي) لا تُشكّل مصطلحًا معجميًا ثابتًا. تفشل اختبار السكّ:
        إذ يمكن إبدال "شاملة" بـ"متنوعة" أو "كاملة" أو "متعددة" والحصول على وصف مقبول
        لسياقات مختلفة — إذن هي ليست مُثبّتة معجميًا. لا يوجد أي شاهد معجمي على توظيفها
        مصطلحًا متخصصًا للمفهوم البيولوجي. تُغني عنها "قارتية" الموثَّقة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قارتية"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة بصورة غير مباشرة عبر الأصل "قارت" في ستة معاجم تقنية عربية متخصصة
        على الأقل (طب بيطري، أحياء، مناخ وبيئة، جغرافيا، طب موحَّد، المورد الحديث).
        القارتيّة = المصدر الصناعي من قارت، قياسًا على: حيوانية، نباتية، لحمية، عشبية —
        النمط الاشتقاقي (فاعل + ية) منتج وصحيح. التحفظ على الجذر الكلاسيكي لا يُبطل
        المصطلح التقني المُوحَّد حديثًا. يستلزم تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكَّدة في المجموعة، فلا مقارنة ترادفية مطلوبة داخل المجموعة.
        وعلى مستوى أوسع: "قارتية" أخصّ من "تنوع الغذاء" وأدقّ من "شمولية الأكل" في كونها
        مصطلحًا مُعيارًا يختصّ بالثنائية الحيوانية/النباتية تحديدًا.
      morphological_check: >
        الوزن: (فاعِلِيَّة) من قارت (فاعل). الوزن مناسب لاشتقاق الصفة المعنوية الثابتة من
        اسم الفاعل، نظير: لاحمية (carnivorousness)، عاشبية (herbivorousness). مقبول صرفيًا.
      borrowing_check:
        lexical_borrowing: >
          قارت توظيف تقني حديث من الجذر العربي قرت — ليس تعريبًا حرفيًّا لكلمة أجنبية.
        calque_check: >
          ليس قرضًا مفهوميًا حرفيًا من اللاتينية omnivorus (آكل الكل)، بل توظيف مستقل
          أجراه المعجميون العرب المحدثون.
        scientific_alignment: >
          يتطابق المدلول الاصطلاحي مع التعريف البيولوجي: الكائن المغتذي بمصدرَي الحيوان
          والنبات على السواء.
      quality_gate:
        consistency_and_prevalence: "مصطلح موحَّد في معاجم ALECSO وغيرها — وثيق الشيوع في المتخصصات"
        ease_of_use: "مفرد ذو بنية اشتقاقية شفّافة"
        appropriateness: "ملائم للسياق العلمي البيولوجي والبيئي والطبي"
        preference_for_heritage: "اشتقاق عربي لا تعريب أجنبي"
        preference_for_arabic: "عربي خالص"
        derivability: "يُشتقّ منه: القوارت (الجمع)، قارتيًّا (نسبة)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَارِتِيَّة"

    # ══ مرشحات المرحلة ١ ══

    - lemma: "أَكُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على توظيف هذا الاشتقاق مصطلحًا للقارتية. فضلًا عن أن "أَكُول" في
        المعاجم يُفيد الشَّرَه وكثرة الأكل عمومًا (hyperphagia) لا الجمع بين الحيواني والنباتي
        تحديدًا. والقارتية مصطلح أثبت وأشيع.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "شُمُولُ الأَكْلِ"
      source: stage1
      decision: removed
      decision_reason: >
        مركَّب إضافي وصفي لا يصمد أمام اختبار التثبيت المعجمي — يمكن إبداله بـ"سعة الأكل"
        أو "عموم الأكل" دون فارق جوهري. ليس مصطلحًا مسكوكًا.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "الِاقْتِيَاتُ الشَّامِل"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية لم يُوثَّق استعمالها مصطلحًا خاصًّا. الاقتيات الشامل قد يُفيد تنوع
        الغذاء عمومًا لا الثنائية الحيوانية/النباتية تحديدًا.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "التَّغَذِّي المُزْدَوَج"
      source: stage1
      decision: removed
      decision_reason: >
        وصف حرّ مقبول لغةً لكنه ليس مصطلحًا معجميًّا ثابتًا. "المزدوج" لا يُحيل إلى الثنائية
        الحيوانية/النباتية تحديدًا إلا بقرينة، ويصحّ في سياقات مغايرة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


