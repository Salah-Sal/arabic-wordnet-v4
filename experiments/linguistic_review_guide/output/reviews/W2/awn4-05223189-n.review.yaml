# ── المرحلة ١: المراجعة والتوليد (عمياء) ────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين مركَّبتان (MWE إضافي)، ولا يوجد مصطلح مفرد مسكوك للمفهوم في المعاجم العربية"
      - "«قابلية» تحمل دلالة الإمكانية والاستعداد لا دلالة الجدارة والاستحقاق، مما يُضعف مطابقتها لمفهوم memorability"
      - "كلتا اللمّتين مكتوبتان بلا تشكيل في السجل الحالي"
      - "الفارق الدلالي بين اللمّتين ضعيف ويحتاج إلى توثيق صريح"
    observations: >
      المجموعة تعبّر عن مفهوم «memorability» الإنجليزي، وهو صفةٌ مجردةٌ تعني أن الشيء
      أو الحدث جديرٌ بالبقاء في الذاكرة واستحضاره. المفهوم حديثُ التداولِ بهذا المعنى
      المصطلحي، ويفتقر إلى لفظ مفرد مسكوك راسخ في العربية. اللمّتان الموجودتان مركّبتان
      إضافيتان تعتمدان على «التذكر» مضافاً إليه، وتختلفان في الجزء المضاف: «جدارة» تعني
      الاستحقاق الذاتي (merit)، بينما «قابلية» تعني الاستعداد الوظيفي (capacity).
      جذر «ذكر» غنيٌّ اشتقاقياً لكنه مُحمَّلٌ بمعانٍ أخرى تُعيق توليد مصطلح جديد
      غير ملتبس، كما أن وزن فَعَالة منه محتلٌّ بمعنى «الفحّال من النخل».
  blind_candidates:
    - lemma: "ذَكَارَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر «ذكر» على وزن فَعَالة القياسي لتجريد الصفات (كفصاحة وبلاغة وفطانة)؛
        تعني صفة كون الشيء جديراً بالذكر والاحتفاظ به في الذاكرة.
    - lemma: "مَذْكُورِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «مذكور» (اسم مفعول من ذكر)؛ يعني صفة الشيء المذكور ذي الصيت والشهرة،
        قياساً على شيوع المصدر الصناعي بإلحاق ياء النسبة وتاء التأنيث.
    - lemma: "خُلُودُ الذِّكْرِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «خلود» (الدوام والبقاء) و«الذكر» (ما يجري على الأذهان)؛
        يُعبّر عن صفة ما يخلد في الذاكرة ولا يُنسى.
    - lemma: "رُسُوخُ الذِّكْرَى"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «رسوخ» (الثبات والتمكن) و«الذكرى» (التجربة الماضية التي تعود إلى
        الذهن تلقائياً أو بمثير)؛ يُعبّر عن صفة ثبات الشيء وتمكّنه في الذاكرة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت (٦ استعلامات):
#   ١. مطابقة دفعية شاملة للمّات الموجودة والمرشّحة + مكوّناتها
#   ٢. جسر إنجليزي (memorability / memorable / memorableness)
#   ٣. بحث FTS عربي (ذاكرة، تذكر، جدير، جدارة، ذكارة، مذكور)
#   ٤. عائلة جذر ذكر (أسماء وصفات)
#   ٥. مقاييس اللغة لابن فارس (جدر + ذكر + قبل)
#   ٦. إثراء دفعي (تعريفات + شواهد لعناصر موجودة)
stage2_evidence:
  per_lemma:
    - lemma: "جدارة التذكر"
      confirm:
        - text: "«هُوَ جَدِيرٌ بِكَذَا، أَيْ حَرِيٌّ بِهِ. وَهُوَ مِمَّا يَنْبَغِي أَنْ يُثْبِتَ وَيَبْنِيَ أَمْرَهُ عَلَيْهِ. وَيَقُولُونَ: الْجَدِيرَةُ الطَّبِيعَةُ»"
          source: "مقاييس اللغة لابن فارس (مادة جدر)"
        - text: "«بَاب الجدارة والاستحقاق: اسْتوْجبَ وَاسْتحق واستأهل»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (ت.1274م)"
      expands:
        - text: "«الذَّالُ وَالْكَافُ وَالرَّاءُ أَصْلَانِ...ذَكَرْتُ الشَّيْءَ، خِلَافُ نَسِيتُهُ. ثُمَّ حُمِلَ عَلَيْهِ الذِّكْرُ بِاللِّسَانِ...وَالذِّكْرُ: الْعَلَاءُ وَالشَّرَفُ»"
          source: "مقاييس اللغة لابن فارس (مادة ذكر)"
          addition: >
            يُظهر أن «الذكر» في أصله يجمع بين الاستحضار الذهني والشرف والرفعة،
            مما يُعضّد دلالة الجدارة بالتذكر ويُثريها.
        - text: "«رجلٌ مذكور: له صيتٌ وثناءٌ»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: >
            يُبيّن أن الاشتقاق من «ذكر» يرتبط بالشهرة والثناء المستحقَّيْن،
            مما يُرسّخ الصلة الدلالية بين الجذر والمفهوم المراد.

    - lemma: "قابلية التذكر"
      confirm:
        - text: "«القَابِلِيَّةُ: الاستعداد للقبول [مصدر صناعي]»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(القابلية) الاستعداد للقبول (مصدر صناعي)»"
          source: "المعجم الوسيط (رواية هوراماني، ت.1998م)"
      contradicts:
        - text: "«قابلية: درجة تفتح أو تقبل أو تحمل نظام للمؤثرات الخارجية، أو حساسيته اتجاه المحفزات المناخية» ← susceptibility"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          conflict: >
            «قابلية» راسخةٌ في المعجمية التقنية بمعنى susceptibility لا memorability؛
            الاستعمال المصطلحي الموثَّق يُنشئ تعارضاً دلالياً يُضعف الدقة.
        - text: "«قابلية: استعداد فطري لاكتساب معرفة معينة أو مهارات عامة أو خاصة» ← aptitude"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          conflict: >
            يُرسّخ «القابلية» في دلالة الاستعداد والملَكة لا في دلالة الجدارة
            بالتذكر؛ مما يُضعف الدقة المصطلحية مقارنةً بـ«جدارة التذكر».

    - lemma: "ذَكَارَة"
      contradicts:
        - text: "«الذُّكارَةُ: الفُحَّالُ من النَّخْل، حَمْلُ النَّخْل»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            وزن فَعَالة من الجذر «ذكر» محتلٌّ بمعنى «الفحّال من النخل» معجمياً؛
            لا يُمكن توظيفه للمفهوم المطلوب دون اشتراك لفظي مع معنى قائم وراسخ.

    - lemma: "مَذْكُورِيَّة"
      expands:
        - text: "«المذكور: رجلٌ مذكور: له صيتٌ وثناءٌ»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: >
            المذكور صفةٌ تحمل معنى الصيت والشهرة؛ قد يُسوّغ ذلك اشتقاقَ مصدر
            صناعي «مذكورية»، لكن المصدر الصناعي نفسه غير موثَّق في أي معجم مستعلَم.

    - lemma: "خُلُودُ الذِّكْرِ"
      evidence_status: "no_material_found"

    - lemma: "رُسُوخُ الذِّكْرَى"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "جدارة التذكر"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي «جدارة التذكر» صائبٌ دلالياً: «جدارة» تعني الاستحقاق والأهلية
        الذاتية (جدير = حري به، مما ينبغي أن يثبت)، و«التذكر» مصدر تذكَّر. أدلةُ المعاجم
        تُؤكّد دلالة الجذرين معاً على المفهوم المطلوب. اللمّة جديرة بالإبقاء مع تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تُركِّز على الاستحقاق الجوهري والقيمة الذاتية للشيء (merit-based memorability):
        الشيء يستأهل الذكر لأثره البالغ وقيمته في نفسها، بصرف النظر عن قدرة المُتلقّي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَدَارَةُ التَّذَكُّرِ"

    - lemma: "قابلية التذكر"
      decision: confirmed
      decision_reason: >
        رغم أن «قابلية» تميل لمعنى الإمكانية والاستعداد (كما تُثبته المعاجم التقنية)،
        إلا أن التركيب «قابلية التذكر» مستعمَلٌ في الكتابات العربية المعرفية والتسويقية
        للتعبير عن قدرة الشيء على الاحتفاظ في الذاكرة. يُكمّل «جدارة التذكر» من زاوية
        وظيفية لا تقييمية. يُحتفَظ به مع تشكيل كامل وتوثيق الفارق الدلالي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تُركِّز على الاستعداد الوظيفي والقدرة على البقاء في الذاكرة (capacity-based
        memorability): تُناسب السياقات التقنية كعلم النفس المعرفي والتسويق حيث يُقاس
        مقدار احتفاظ المُتلقّي بالمعلومة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ التَّذَكُّرِ"

    - lemma: "ذَكَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        الوزن فَعَالة من الجذر «ذكر» محتلٌّ بمعنى «الفحّال من النخل» الموثَّق في المعجم
        الكبير؛ استخدامه للمفهوم المطلوب يُنشئ اشتراكاً لفظياً مع معنى قائم وراسخ.
        اختبار السكّ يفشل: الوزن مشغول.

    - lemma: "مَذْكُورِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصدر الصناعي «مذكورية» غير موثَّق في أي معجم من المعاجم المُستعلَمة، ولم يجرِ
        تداولُه في الكتابات التقنية والمعيارية. اختبار التثبيت المعجمي يرفضه.

    - lemma: "خُلُودُ الذِّكْرِ"
      source: stage1
      decision: removed
      decision_reason: >
        «الخلود» يحمل معنى الدوام الأبدي، وهو أوسع من مجرد الجدارة بالتذكر؛ التركيب
        يُفيد الديمومة المطلقة لا مجرد القيمة التذكارية. فضلاً عن انعدام التثبيت المعجمي.

    - lemma: "رُسُوخُ الذِّكْرَى"
      source: stage1
      decision: removed
      decision_reason: >
        التركيب يُعبّر عن نتيجة عملية التذكر (ثبوتها في الذهن) لا عن صفة الشيء المُتذكَّر؛
        هو حالٌ وصفيةٌ حرّة لا مصطلحٌ مسكوك. اختبار التثبيت المعجمي يرفضه.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
stage4_content:
  definition:
    current: "صفة كون الشيء جديراً بالتذكر"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح لكنه يفتقر إلى الجنس القريب الدقيق والفصل النوعي الكافي؛
        عبارة «صفة كون الشيء» غامضةٌ مبهمة ولا تُحدّد طبيعة الشيء (أهو حدثٌ أم موضوعٌ؟)
        ولا الآلية التي تجعله جديراً بالتذكر (الأثرُ؟ القيمةُ؟). يُستحسن تعريفٌ
        مصطلحي يضبط الجنس والفصل، مع تعريف لغوي بأسلوب الوسيط.
    authored:
      - type: terminological
        text: >
          خاصيَّةٌ في الشَّيءِ أو الحَدَثِ تجعله جديراً بأن يُحتَفَظَ به في الذَّاكرةِ
          ويُستَحضَرَ، لِمَا يُمَثِّلُهُ من أثرٍ بالغٍ أو قيمةٍ متميِّزةٍ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          صفةٌ تُمَيِّزُ ما كان من الأشياءِ والأحداثِ جديراً بالبقاءِ في الأذهانِ،
          لا يَكادُ يَغِيبُ عن الذَّاكرةِ لِرُسُوخِ أَثَرِهِ في النَّفْسِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خاصيَّةٌ في الشَّيءِ أو الحَدَثِ تجعله جديراً بأن يُحتَفَظَ به في الذَّاكرةِ ويُستَحضَرَ، لِمَا يُمَثِّلُهُ من أثرٍ بالغٍ أو قيمةٍ متميِّزةٍ"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "صفةٌ تُمَيِّزُ ما كان من الأشياءِ والأحداثِ جديراً بالبقاءِ في الأذهانِ، لا يَكادُ يَغِيبُ عن الذَّاكرةِ لِرُسُوخِ أَثَرِهِ في النَّفْسِ"

  examples:
