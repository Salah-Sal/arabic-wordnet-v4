          - text: "تتميَّز الوقائعُ التاريخيةُ الكبرى بجدارةِ التَّذكُّرِ؛ إذ تظلُّ ماثلةً في وجدانِ الأجيالِ على مرِّ العقودِ."
            type: usage
      - lemma: "قَابِلِيَّةُ التَّذَكُّرِ"
        examples:
