stage1_review:
  assessment:
    concerns:
      - "لمّة «دهر» بلا تشكيل — يلزم إضافة التشكيل الكامل"
      - "التعريف العربي يحتوي على كلمة بين قوسين «(انتظار)» وهي ترجمة حرفية من الإنجليزية وليست أسلوباً معجمياً عربياً"
      - "المجموعة تضمّ لمّتين فقط، وقد يكون هناك مرادفات إضافية جديرة بالإدراج"
    observations: "المفهوم المستهدف هو فترة زمنية يشعر المرء بأنها لا تنتهي، وهو مفهوم مألوف في الثقافة العربية يُعبَّر عنه بألفاظ متعددة من جذور مختلفة (أبد، دهر، سرمد، خلد). التعريف الحالي يميّز المفهوم عن الأبدية المطلقة بقيد «تبدو بلا نهاية» أي الإحساس الذاتي بالطول لا الامتداد الحقيقي."

  blind_candidates:
    - lemma: "سَرْمَدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «سَرْمَد» (الدائم الذي لا ينقطع)، على وزن فَعْلَلِيَّة. مسجَّل في معجم اللغة العربية المعاصرة بمعنى «دوام لا بدء له ولا نهاية». يدلّ على الاستمرار الزمني المطلق."
    - lemma: "أَبَد"
      generation_method: majaz
      justification: "الأبد في الأصل الدهر الطويل، ثم أُطلق على المدة التي لا يُتوهَّم انتهاؤها. ورد في التعريفات للجرجاني: «مدة لا يتوهم انتهاؤها بالفكر والتأمل البتة». مجاز بالتوسُّع من الطول إلى اللانهاية."
    - lemma: "خُلُود"
      generation_method: ishtiqaq
      justification: "مصدر «خَلَدَ» على وزن فُعُول، يدل على البقاء والدوام. جذره (خلد) أصل واحد يدل على الثبات والملازمة كما في مقاييس اللغة."
    - lemma: "أَزَلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي منسوب إلى «أَزَل» (القِدَم بلا ابتداء). يدل على عدم التناهي الزمني في جانب الماضي، ويقابل الأبدية في جانب المستقبل."


