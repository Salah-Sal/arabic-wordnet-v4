# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. المرشحات الأعمى — توليد قبل الاطلاع على اللمّات الموجودة
  # المدخل: synset_info_masked.yaml فقط (التعريف: "صفة كون الكائن بشرياً أو إنساناً")
  blind_candidates:
    - lemma: "آدَمِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن فَعَلِيَّة من "آدَمِيّ" (المنسوب إلى آدم أبي البشر)،
        وهو من الألفاظ التراثية التي تُعبِّر عن الانتماء إلى الجنس الإنساني
        وما يجمعه من صفات مميِّزة. الجذر (أدم) مستقل عن الجذرين الواردَيْن في
        التعريف (بشر / إنسان) فلا دَوَران.

    - lemma: "نَاسُوتِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من "ناسوت" وهو لفظ تراثي يُقابل "لاهوت"؛ يدلُّ على
        الطبيعة الإنسانية أو الحال البشرية بإزاء الحال الإلهية. شائع في علم
        الكلام والفلسفة الإسلامية لوصف ما يختصُّ به الإنسان من طبيعة مادية
        وزائلة بخلاف الألوهية. يتجنَّب الدوران ويوفِّر فصلاً نوعياً واضحاً.

    - lemma: "أُنْسِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من "إنْسِيّ" (نسبة إلى الإنس)، وجذره (أنس) هو ذاته
        جذر "إنسان"، مما يجعله اشتقاقاً بديلاً لا يكرر لفظ التعريف. "الإنس"
        في العربية خلاف الجن، وكلمة "إنسيّ" راسخة في التراث.

    - lemma: "بَشَرِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن فَعَلِيَّة من "بَشَر" (الجنس الإنساني)؛ اشتقاق
        طبيعي للتعبير عن صفة كون الكائن من البشر. "البشر" أحد مرادفات الإنسان
        الجمعية في العربية الفصحى. ملاحظة: "بشرياً" وارد في التعريف المُقنَّع
        لذا ينبغي مراجعة مدى الدوران لاحقاً.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "كلتا اللمّتين الموجودتَيْن (إنسانية، بشرية) مكتوبتان بلا تشكيل — يجب إضافة التشكيل الكامل"
      - >
        'إنسانية' مشتركة بين معنيَيْن: (أ) الصفة المجردة «quality of being human» وهو
        المقصود هنا، و(ب) المعنى الجمعي «humanity/mankind» وهو مجموعة ترادفية مختلفة —
        يستوجب ذلك توثيق الفارق في nuance
      - >
        'بشرية' محملة في المعاجم الكلاسيكية بمعنى اسم الفرقة المعتزلية (أتباع بشر بن
        المعتمر)، ولا تُعرَّف في المعجم الوسيط ولا المعجم الكبير بمعنى «صفة كون الكائن
        بشرياً»، مما يجعل انتماءها لهذه المجموعة مشكوكاً فيه
      - "التعريف الحالي دائري نسبياً: يستخدم 'بشرياً' و'إنساناً' في تعريف 'البشرية' و'الإنسانية'"
    observations: >
      المجموعة تعبِّر عن مفهوم فلسفي دقيق هو «humanness» أي الخاصية التي
      يتسم بها الكائن من حيث انتماؤه إلى الجنس البشري ومن حيث ما يحمله من
      مزايا إنسانية كالعقل والإرادة الأخلاقية. «الإنسانية» هي أوثق اللمّات
      وأشيعها في هذا المعنى، وقد أيَّدها المعجم الوسيط (المرجع المعياري)
      تصريحاً بـ«جملة الصفات التى تميز الإنسان». أما «البشرية» فلا توجد لها
      في المعاجم المعتمدة شاهد على المعنى المجرد المطلوب. يُستحقُّ النظر في
      إضافة «آدَمِيَّة» التي وثَّقها المعجم الكبير بوصفها «مثل الإنسانية».


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت:
#  Q1 — مطابقة دفعية: انسانية/الانسانية، بشرية/البشرية، ادمية/الادمية، ناسوتية/الناسوتية، انسية/الانسية
#  Q2 — إثراء بالمعرّف (definitions + examples) للمداخل الرئيسية
#  Q3 — جسر إنجليزي: humanness / humanity / manhood / human nature / being human
#  Q4 — FTS عربي: كائن بشري، صفة الانسان، طبيعة بشرية، آدمية
#  Q5 — مقاييس اللغة: جذور أنس، بشر، أدم
stage2_evidence:
  per_lemma:

    - lemma: "إنسانية"
      confirm:
        - text: "«خلاف البهيمية؛ جملة الصفات التى تميز الإنسان؛ جملة أفراد النوع البشرى التى تصدق عليها هذه الصفات»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (OCR)"
        - text: "«الإنسانيةُ: الفضائل النفسية المختصة بالإنسان»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505 م)"
        - text: "«(الإنسانية) خلاف البهيمية وجملة الصفات التي تميز الإنسان أو جملة أفراد النوع البشري التي تصدق عليها هذه الصفات (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين — مجمع اللغة العربية"
        - text: "إنسانية — translation_en: humanity — domain: Law"
          source: "المعجم الموحد لمصطلحات القانون، أليكسو (2017)"
        - text: "إنسانية — translation_en: humanity — domain: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس، أليكسو"
        - text: "إنسانية — translation_en: humanity — domain: Sociology and Anthropology"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، أليكسو"
      expands:
        - text: "«(1) الإنسانية: الشفقة؛ الحنوّ (2) «أ» البشرية؛ الطبيعة البشرية. «ب» pl.: الصفات البشرية (3) pl.: الإنسانيات (4) الجنس البشري»"
          source: "المورد الحديث (2008)"
          addition: >
            يكشف هذا المدخل عن ثلاثة معانٍ متمايزة لـ'إنسانية': (أ) الرحمة والشفقة، (ب) الصفة
            البشرية المجردة وهو معنى هذه المجموعة، (ج) الجنس البشري الجمعي — وهو تعدد دلالي
            مهم يستوجب التمييز في nuance

    - lemma: "بشرية"
      contradicts:
        - text: "«طائفة من المعتزلة، يُنسبون إلى بشر بن المعتمر»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (OCR)"
          conflict: >
            المعجم الوسيط لا يُثبت لـ'البشرية' معنى «صفة كون الكائن بشرياً» بتاتاً؛
            المعنى الوحيد المسجَّل هو اسم الفرقة المعتزلية
        - text: "«البشرية: طائفة بشر بن المعتمر من أفاضل المعتزلة...»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622 م)"
          conflict: "المعجم الكلاسيكي يحصر المعنى في الفرقة الكلامية لا الصفة المجردة"
        - text: "«البشرية: هم أصحاب بشر بن المعتمر...»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413 م)"
          conflict: "تأكيد إضافي على أن 'البشرية' في المعجمية الكلاسيكية = الفرقة المعتزلية"
        - text: "«البشريّة: [في الإنجليزية] Al bishriyya (sect) [في الفرنسية] Al-Bishriyya (secte)...»"
          source: "كشَّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777 م)"
          conflict: "المصطلح محدَّد صراحةً كاسم فرقة في المعجم الفني الكلاسيكي"
      expands:
        - text: "بشرية — translation_en: human kind — domain: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس، أليكسو"
          addition: >
            ARABTERM يربط 'بشرية' بـ'human kind' أي الجنس البشري الجمعي لا الصفة المجردة؛
            هذا يوافق مجموعة ترادفية مختلفة (humanity as species/collective)
        - text: "«الفصيلة البشرية (Hominidae): فصيلة من رتبة الرئيسيات...»"
          source: "المعجم الكبير — مجمع اللغة العربية بالقاهرة (OCR)"
          addition: >
            المعجم الكبير يُثبت 'البشرية' بالمعنى التصنيفي البيولوجي (Hominidae)،
            وهو بعيد عن المعنى الفلسفي المجرد المطلوب

    - lemma: "آدَمِيَّة"
      source: stage1
      confirm:
        - text: "«الآدَمِيَّة: مؤنث الآدمي؛ مصدر صناعي، مثل الإنسانية، يجمع صفات الآدمي ومزاياه»"
          source: "المعجم الكبير — مجمع اللغة العربية بالقاهرة (OCR)"
        - text: "«إنسانية: آدمية، أدب، لطف»"
          source: "تكملة المعاجم العربية لرينهارت دوزي (Hawramani)"

    - lemma: "نَاسُوتِيَّة"
      source: stage1
      expands:
        - text: "«الناسوت: الطبيعة الإنسانيّة»"
          source: "المورد الحديث (2008) — ضمن مدخل manhood"
          addition: >
            'ناسوت' موثَّق بمعنى الطبيعة الإنسانية، غير أن 'ناسوتية' كمصدر صناعي
            مستقل لا يرد في أي مدخل معجمي مستقل بمعنى «صفة كون الكائن بشرياً»

    - lemma: "أُنْسِيَّة"
      source: stage1
      contradicts:
        - text: "«أَنَسِيَّة: من (أ ن س) مؤنث أَنَسِيّ نسبة إلى أَنَس»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
          conflict: "الكلمة مسجَّلة في المعجمية العربية كاسم علم مؤنث لا كمصطلح دلالي مجرد"
        - text: "«أُنْسِيَّة: من (أ ن س) مؤنث أُنْسي: نسبة إلى أُنْس»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
          conflict: "الصيغة نسبة اسمية لا مصدر صناعي لمفهوم 'الإنسانية'"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: إنسانية ──
    - lemma: "إنسانية"
      decision: confirmed
      decision_reason: >
        أوثق لمّة في المجموعة وأشيعها؛ وثَّقها المعجم الوسيط والمعجم الكبير ومعجم السيوطي
        جميعها بمعنى «جملة الصفات التى تميز الإنسان». موثَّقة أيضاً في مصطلحيات القانون
        والفلسفة وعلم الاجتماع. الجذر (أنس) صحيح وفق أفضل المصادر (OCR). تحتاج إلى
        إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
        is_loan: false
      morphological_check:
        pattern: "فِعَالِيَّة (مصدر صناعي من فِعَال/إنسان)"
        pattern_fit: "مناسب للمفاهيم المجردة التي تدلُّ على خاصية أو صفة جوهرية"
      quality_gate:
        ittiraad: true
        yusr: true
        mulaaa'ama: true
        taraathi: true
        arabiyy: true
        ishtiqaaqiyya: true
      nuance_differentiation: >
        تُعبِّر عن الصفة المجردة الجامعة لمزايا الجنس البشري ولا سيما العقل والإرادة
        الأخلاقية، وتُستخدم في السياقات الفلسفية والأدبية والحقوقية. تتمايز عن
        'آدمية' بأنها أعمُّ دلالةً وأشيع استخداماً وأكثر ارتباطاً بالفضائل الإنسانية
        المكتسَبة، في حين تُركِّز 'آدمية' على الأصل البشري المشترك كما يدلُّ عليه
        الاشتقاق من اسم آدم أبي البشر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِنْسَانِيَّة"

    # ── لمّة موجودة: بشرية ──
    - lemma: "بشرية"
      decision: removed
      decision_reason: >
        لا يُوجد في المعاجم العربية المعتمدة (الوسيط، الكبير، معاجم الكلاسيكيين) أي
        مدخل مستقل يُعرِّف 'البشرية' بمعنى «صفة كون الكائن بشرياً». المعنى المُسجَّل
        في المعجم الوسيط هو اسم الفرقة المعتزلية حصراً. مصطلحيات أليكسو تربطها بـ
        'human kind' أي الجنس البشري الجمعي لا الصفة المجردة، وهو ما يُناسب مجموعة
        ترادفية مغايرة. الإبقاء عليها في هذه المجموعة يُضفي غموضاً دلالياً لا مسوِّغ
        له. يُوصى بمراجعة انتمائها إلى مجموعة «الجنس البشري» إن وُجدت.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: آدَمِيَّة ──
    - lemma: "آدَمِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        وثَّقها المعجم الكبير (OCR) صراحةً بوصفها «مصدر صناعي مثل الإنسانية، يجمع
        صفات الآدمي ومزاياه»، وهو تعريف يطابق بدقة المعنى المقصود في هذه المجموعة.
        وأيَّدها دوزي بربطها بـ'إنسانية' في نص مزدوج. الجذر (أدم) مستقل وصحيح.
        الوزن الصرفي مناسب للمصادر الصناعية الدالة على الصفات الجوهرية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
        is_loan: false
      morphological_check:
        pattern: "فَعَلِيَّة (مصدر صناعي من آدَمِيّ)"
        pattern_fit: "مناسب تماماً لصفة الانتماء إلى جنس آدم"
      quality_gate:
        ittiraad: true
        yusr: true
        mulaaa'ama: true
        taraathi: true
        arabiyy: true
        ishtiqaaqiyya: true
      nuance_differentiation: >
        تُركِّز على بُعد الانتماء إلى جنس آدم — الأصل البشري المشترك والموروث —
        وكثيراً ما تُستخدم في السياقات الفقهية والدينية (مثل «لا يُباح إلا للآدميين»)
        وفي خطاب الكرامة الإنسانية المشتركة. تتمايز عن 'إنسانية' بتركيزها على
        جانب الأصل والانتماء الجنسي أكثر من جانب الفضيلة والمزية.
      actions:
        - command: create_entry
          params:
            lemma: "آدَمِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04734196-n"

    # ── مرشح المرحلة ١: نَاسُوتِيَّة ──
    - lemma: "نَاسُوتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على مدخل مستقل بهذا اللفظ في أي معجم من قاعدة البيانات. و'ناسوت'
        وإن ورد بمعنى الطبيعة الإنسانية في المورد الحديث، إلا أن 'ناسوتية' كمصطلح
        قائم بذاته لم يُوثَّق، فضلاً عن أنه محصور في الخطاب الكلامي العقدي (مقابل
        لاهوتية) ولا ينسجم مع الاستخدام الفلسفي العام.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: أُنْسِيَّة ──
    - lemma: "أُنْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد في المعجمية العربية بوصفها مصطلحاً دالاً على «صفة كون الكائن إنساناً»؛
        إنما هي اسم علم مؤنث (نسبة إلى اسم أَنَس أو أُنْس) كما تُثبت موسوعة السلطان
        قابوس. محاولة استخدامها بالمعنى المجرد ستُفضي إلى مصطلح مُلتبس مع الاسم
        الشخصي ومع دلالة 'الأُنس' (المؤانسة) معاً.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
# اللمّات المؤكدة: إِنْسَانِيَّة، آدَمِيَّة
