# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-05155946-n  |  ILI: i64039  |  POS: n
# utility / usefulness — صفة كون الشيء ذا فائدة عملية
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "تعريف دائر (circular): يستخدم لفظ «فائدة» في تعريف مجموعة تحتوي «فَائِدَة» لمّةً من لمّاتها"
      - "الثلاثة لمّات (جَدْوَى، فَائِدَة، مَنْفَعَة) متقاربات دلالياً ولا يُوثَّق الفارق بينها في السجل الحالي"
    observations: >
      المجموعة تمثّل مفهوم «الجودة العملية للشيء» (utility/usefulness) بوصفها خاصِّيَةً مجرَّدة
      وليست الشيءَ النافع ذاته. ولمّاتُها الثلاث كلمات فصيحة أصيلة غنيّة التوثيق في المعاجم
      الكلاسيكية والحديثة. المشكلة الجوهرية هي الدوران في التعريف لا في اختيار اللمّات.
      تجدر الإشارة إلى أن «جَدْوَى» تكثر في السياق السلبي (لا جدوى) أو في «دراسة الجدوى»،
      مما يُضيِّق مجالها نسبياً مقارنةً بـ«فائدة» و«منفعة» في الاستخدام الإيجابي المطلق.

  blind_candidates:
    - lemma: "نَفْعِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقّ من الجذر (نفع) على صيغة المصدر الصناعي (فَعْلِيَّة)، بمعنى «صفة كون الشيء
        ذا نفع». الوزن منتج في المصطلحية الحديثة لتجريد الصفات وتحويلها إلى مفاهيم.
    - lemma: "صَلَاحِيَّة"
      generation_method: majaz
      justification: >
        أصلها «حسن التهيُّؤ للعمل»، وقد تُمتدّ دلالتها بالمجاز لتشمل «القابلية
        على الإفادة العملية». المصدر الصناعي من (صلح) موجود وفصيح.
    - lemma: "إِفَادِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقّ من أَفَادَ (جذر فيد/فود) على المصدر الصناعي (إفادة + ية)، بمعنى
        «خاصيّة إيتاء الفائدة»؛ يتجنّب الدوران لأنه لا يتضمن لفظ «فائدة» نفسه.
    - lemma: "جَدَاء"
      generation_method: ishtiqaq
      justification: >
        من الجذر (جدو) على فَعَال، ثلاثيٌّ عربيّ قديم يعني «النفع والغناء»
        (يُقال: فلانٌ قليل الجداء، أي لا يُجدي). مُحيَاءٌ للفظ تراثي دقيق.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # ملاحظة: نُفِّذ استعلام المطابقة الدفعية (جميع اللمّات بصيغتَي ال+/ ال-)
  # ثم الإثراء بمعرّفات المداخل (definitions+examples+plurals)
  # ثم الجسر الإنجليزي (utility / usefulness)
  # ثم البحث بالكلمات المفتاحية (جدوى / نافع / نفعي / جداء)
  # ثم التحقق من المرشحين + مقاييس اللغة (dictionary_id=151)
  # مجموع الاستعلامات: 6

  per_lemma:

    - lemma: "جَدْوَى"
      confirm:
        - text: "«جَدْوى: المطر العام والعطية الجزلة والغناء والفائدة»"
          source: "مقاييس اللغة (المعجم الكبير — OCR)"
        - text: "headword: جدوى | translation_en: [فارغ] | domain: الاقتصاد — مُدرَجة كمصطلح مستقل"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — ArabTerm"
      expands:
        - text: "«نجاعة، جدوى» — headword مزدوج بالتسوية مع «نجاعة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — ArabTerm"
          addition: >
            يُظهر أنّ «جدوى» يرادف «نجاعة» في بعض السياقات التقنية، مما يشير
            إلى طيف دلالي يمتدّ من المنفعة إلى الفاعليّة (efficacy).
        - text: "«دراسة جدوى» — مُدرَجة في عدة مسارد (تقانة المعلومات، النقل، المياه، التجارة)"
          source: "مسارد ArabTerm متعددة"
          addition: >
            «جدوى» في الاستعمال الحديث تخصّصت غالباً في مركّب «دراسة الجدوى»
            (feasibility study)، مما يُقيّد حضورها المفرد كوصف إيجابي للمنفعة.

    - lemma: "فَائِدَة"
      confirm:
        - text: "«ما أفاد الله العباد من خير يستفيدونه ويستحدثونه»"
          source: "كتاب العين — الخليل بن أحمد الفراهيدي (ت 786 م)"
        - text: "«الفائدة: الشيء المتجدد عند السامع يعود إليه لا عليه»"
          source: "التوقيف على مهمات التعاريف — المناوي (ت 1622 م)"
        - text: "«هي ما يترتّب على الفعل»"
          source: "كشّاف اصطلاحات الفنون والعلوم — التهانوي (ت 1777 م)"
        - text: "«المال الثابت وما يُستفاد من علم أو عمل أو غيره»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
        - text: "headword: فائدة | translation_en: utility | domain: المناخ والبيئة"
          source: "مسرد المناخ والبيئة وإدارة النفايات — ArabTerm"
      expands:
        - text: "«الفائدةُ: استحداثُ مالٍ وخيرٍ. وقد فادَتْ له فائدةٌ. ويُقال: أفَدْتُ غيري، وأفَدْتُ من غيري»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مادة فيد"
          addition: >
            ابن فارس يُرجع الفائدة إلى جذر (فيد) بمعنى استجداد الخير والمال، مُبيِّناً
            أنّ الجذر لا ينقاس قياساً صارماً، مما يجعل «فائدة» لفظاً بعينه لا يُقاس.

    - lemma: "مَنْفَعَة"
      confirm:
        - text: "«كلُّ ما يُنْتَفع به»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
        - text: "headword: منفعة | translation_en: utility | domain: الاجتماع والأنثروبولوجيا"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — ArabTerm"
        - text: "headword: منفعة | translation_en: utility | domain: التجارة والمحاسبة"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ArabTerm"
        - text: "headword: منفعة | translation_en: utility | domain: الجغرافيا والتاريخ"
          source: "مسرد الجغرافيا والتاريخ — ArabTerm"
      expands:
        - text: "«النُّونُ وَالْفَاءُ وَالْعَيْنُ: كَلِمَةٌ تَدُلُّ عَلَى خِلَافِ الضَّرِّ. وَنَفَعَهُ يَنْفَعُهُ نَفْعًا وَمَنْفَعَةً. وَانْتَفَعَ بِكَذَا. وَاللَّهُ أَعْلَمُ بِالصَّوَابِ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مادة نفع"
          addition: >
            ابن فارس يُحيل معنى (نفع) إلى الضد: «خلاف الضر». المنفعة إذن صفة
            ما يُبعد الضرر ويُحقق الخير، وهذا التعريف السلبي يُميّزها عن «فائدة»
            التي تُعرَّف إيجاباً باستجداد الخير.
        - text: "«(مذهب المنفعة) مذهب أخلاقي يجعل من نفع الفرد والمجموع مقياساً للسلوك»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
          addition: >
            وجود «مذهب المنفعة» (Utilitarianism) في تعريف «المنفعة» يُشير إلى أنّ
            هذا اللفظ يُغطّي المعنى الفلسفي (utility theory) فضلاً عن المعنى اليومي.

    # ── مرشحو المرحلة ١ ──

    - lemma: "نَفْعِيَّة"
      confirm:
        - text: "headword: نَفْعِيَّة | translation_en: utility | domain: تقانة المعلومات — «برمجية تقوم بوظيفة محددة مساعِدة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ArabTerm"
      contradicts:
        - text: "headword: نفعية | translation_en: utilitarism | domain: الفلسفة وعلم النفس"
          source: "مسرد الفلسفة وعلم النفس — ArabTerm"
          conflict: >
            «نفعية» في المصطلحية الفلسفية تُحيل إلى «المذهب النفعي» (Utilitarianism)
            لا إلى «صفة الإفادة العملية»؛ وهذا معنًى مختلف عن المجموعة المراجعة.
      expands:
        - text: "«(1) النَّفعيّة (2) نفعيّ»"
          source: "المورد الحديث (2008) — ArabTerm"
          addition: >
            المورد الحديث يورد «النفعية» ترجمةً لـutilitarianism أيضاً، مما يؤكد
            التحمُّل الفلسفي السائد على الاستعمال الحديث للمصطلح.

    - lemma: "صَلَاحِيَّة"
      contradicts:
        - text: "«الاتِّساق في عملٍ ما، الصلاحية للعمل: حسن التهيُّؤ له، الصلاحية لذِي السلطان: مدى ما يخوِّله القانون»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
          conflict: >
            «صلاحية» تعني «الملاءمة والاستعداد للعمل» و«السلطة القانونية»، لا
            «صفة إيتاء النفع العملي»؛ ففرق جوهري بين الصلاحية للفعل وبين الإفادة منه.
        - text: "headword: صلاحية | translation_en: validity | domain: الرياضيات والفلك"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ArabTerm"
          conflict: "المصطلحية العلمية تُرادف «صلاحية» بـvalidity لا بـusefulness."

    - lemma: "إِفَادِيَّة"
      evidence_status: "no_material_found"

    - lemma: "جَدَاء"
      confirm:
        - text: "«النَّفْعُ. يقال: فلانٌ قَلِيلُ الجَدَاءِ — الغَنَاءُ. يقال: هو قَلِيلُ الجَدَاءِ عَنْكَ, أى لا يكادُ يُغْنِي عنكَ شيئاً»"
          source: "المعجم الكبير — مجمع اللغة العربية (OCR)"
        - text: "«(الجداء) الغناء والنفع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
      contradicts:
        - text: "«(الجداء) مبلغ حِسَاب الضَّرْب. يُقال جداء ثلاثة في ثلاثة تسعة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          conflict: >
            لـ«جَداء» (بالفتح) معنًى رياضيٌّ راسخ هو «حاصل الضرب» (product)، وهو
            مُدرَج في مصطلحية الفيزياء بـArabTerm؛ مما يُفضي إلى لَبْس مع المعنى
            النافع المطلوب، لا سيّما أنّ الجذر ذاته (جدو/جدي) يُنتج المعنيين معاً.


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "جَدْوَى"
      decision: confirmed
      decision_reason: >
        لمّة فصيحة أصيلة موثَّقة في مقاييس اللغة بمعنى «الغناء والفائدة»،
        ومُدرَجة في المصطلحية الاقتصادية الحديثة. تشيع في الاستعمال وتُعبِّر
        عن المنفعة مع ظلال التقييم والجدارة. التشكيل الموجود صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «جَدْوَى» تُركّز على قيمة الشيء في ضوء الغرض منه وتُستعمل للتقييم
        (هل يُجدي؟)، وكثيراً ما تَرِد في السياق السلبي (لا جدوى) أو في
        «دراسة الجدوى» الاقتصادية، فهي أقرب إلى «الجدارة العملية» منها
        إلى الفائدة المجرّدة أو الانتفاع المادي.

    - lemma: "فَائِدَة"
      decision: confirmed
      decision_reason: >
        من أعرق الألفاظ توثيقاً منذ العين (ت786م) حتى الوسيط، متعددة المعاني
        تشمل: النفع المعنوي (العلم)، والمادي (المال)، والعملي (العمل). موثَّقة
        بترجمة إنجليزية utility في ArabTerm. التشكيل صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «فَائِدَة» هي الأعمّ والأشمل: تشمل النفع المعنوي (فائدة علمية) والمادي
        (ربح) والعملي. تُعبّر عن الفائدة من منظور المتلقّي (ما يستفيده)،
        وتنتمي إلى سياق الإعلام والتعلُّم والاستفادة الذهنية والمادية معاً.

    - lemma: "مَنْفَعَة"
      decision: confirmed
      decision_reason: >
        موثَّقة بتعريف المعجم الوسيط «كلُّ ما يُنْتَفع به»، ومُترجَمة بـutility
        في ثلاثة مسارد ArabTerm مختلفة (الاجتماع، التجارة، الجغرافيا).
        وجود «مذهب المنفعة» في التعريف المعجمي يؤكد غناءها الدلالي. صحيحة التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «مَنْفَعَة» تُركّز على الانتفاع الملموس المادي والعملي المباشر (ما
        يُنتَفع به فعلاً)، وتستعمل في الاقتصاد (المنفعة الحدية، الكلية، الترتيبية)
        وفي الحقوق (المنفعة العامة). هي أكثر اللمّات الثلاث ارتباطاً بالبُعد
        الاقتصادي والفلسفي (نظرية المنفعة).

    - lemma: "نَفْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        وإن كانت موثَّقة في المصطلحية الحديثة، فإنّ «نفعية» مُحمَّلة بمعنيين
        يُعارضان تخصيصها لهذه المجموعة: (أ) المذهب الفلسفي النفعي (Utilitarianism)
        في مسارد الفلسفة وعلم النفس وفي المورد الحديث، و(ب) برمجية المساعدة
        (utility program) في مسارد المعلوماتية. إضافتها ستُحدث التباساً مع
        مجموعات أخرى في الشبكة الدلالية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "صَلَاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أنّ «صلاحية» تعني «الملاءمة والاستعداد للعمل»
        و«السلطة القانونية» و«validity» في المصطلحية العلمية، لا «صفة الإفادة
        العملية». الفرق جوهري: الصلاحية شرط للأداء، أما الإفادة فنتيجة الأداء.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "إِفَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود للمصطلح في قاعدة البيانات ولا في المعاجم المتاحة. يفتقر إلى
        التثبيت المعجمي اللازم لإدراجه في الشبكة الدلالية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "جَدَاء"
      source: stage1
      decision: removed
      decision_reason: >
        وإن ثبت المعنى الكلاسيكي «النفع والغناء» في المعجم الكبير والوسيط، إلا
        أنّ اللفظ مُشترَك: «جَدَاء» (بالفتح) تعني أيضاً «حاصل الضرب» وقد
        رُصدت في مصطلحية الفيزياء بـArabTerm (translation_en: product)؛ مما
        يُفضي إلى لَبس. فضلاً عن ذلك يُنشئ إضافتها تكراراً دلالياً مع «جَدْوَى»
        الموجودة أصلاً، وهي من الجذر ذاته (جدو/جدي).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


