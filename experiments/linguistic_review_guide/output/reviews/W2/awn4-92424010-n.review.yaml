      decision: confirmed
      decision_reason: >-
        مصطلح موثق ومعتمد في المعجم الموحد لمصطلحات اللسانيات 2002 وفي مسرد الإعلام
        والتواصل (ARABTERM)، يُستخدم صراحةً للإشارة إلى الخصائص الصوتية لأصوات الكلام.
        المركب إضافي ثابت لا يمكن إبدال مكوّنيه دون فقدان المعنى الاصطلاحي. يحتاج
        إلى تحديث التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يجمع الجانبَيْن النطقي (الأرتيكيولاتوري) والسمعي (الأكوستيكي) معاً، مما
        يجعله مصطلحاً شاملاً يستوعب الخصائص التوليدية للصوت وإدراكه السمعي في آنٍ واحد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاصِّيَّة صَوْتِيَّة"

    - lemma: "سِمَةٌ لَفْظِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        المركب «سمة لفظية» غير موثق في أي مصدر معجمي. والصيغة الأقرب في ARABTERM
        هي «سمة صوتية» لا «سمة لفظية». فضلاً عن ذلك، «سِمَة» من وسم تحمل في أصلها
        دلالة الأثر المادي والعلامة الجسدية (كالوَسْم بالنار)، مما يُضعف ملاءمتها
        للخاصية الصوتية المجردة. المصطلح الموجود «خاصية صوتية» أرسخ وأكثر توثيقاً.

    - lemma: "صِفَةٌ لِسَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        «صفة لسانية» فضفاض يشمل أي سمة لغوية (نحوية أو دلالية أو صوتية)، فلا يخصص
        الدلالة الصوتية. الصيغة الأقرب في ARABTERM هي «صفة صوتية» التي تُستخدم في
        وصف الأصوات كالأنفية، لكن المُولَّد هنا «صفة لسانية» لا «صفة صوتية»، والأخيرة
        لم تُطرح كمرشح في المرحلة ١. كما أن «خاصية صوتية» أكثر رسوخاً واعتماداً.

    - lemma: "خَصِيصَةٌ تَلَفُّظِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        المركب «خصيصة تلفظية» غير موثق في أي مصدر. «خصيصة» بمفردها مناسبة دلالياً
        («الصفة التي تميز الشيء وتحدده»)، لكن مقرونةً بـ«تلفظية» تضيّق المفهوم على
        الجانب النطقي وحده، متجاهلةً الجانب السمعي الوارد في التعريف.

    - lemma: "مَيِّزَةٌ أَدَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا شاهد معجمي على هذا المركب ولا على مكوّنيه في السياق اللساني. «مَيِّزَة»
        كمصدر من ميّز غير شائع في المعاجم العربية كاسم جامد للمفهوم. المركب مصطنع
        ولم يُعثر له على استخدام في المصادر المتخصصة.


