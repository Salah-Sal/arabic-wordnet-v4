            type: usage
      - lemma: "عُمْرُ الكَوْنِ"
        examples:
          - text: "يُقدِّرُ العلماءُ عُمرَ الكونِ بنحوِ ثلاثةَ عشرَ ملياراً وثمانِمئةِ مليونِ سنة."
