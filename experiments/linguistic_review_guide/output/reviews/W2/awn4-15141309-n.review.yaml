    assessment:
      decision: revise
      reason: "التعريف الحالي يفتقر إلى الدقة المعجمية والترتيب المنطقي."
    authored:
      - type: terminological
        text: "الفترة الزمنيّة الممتدّة منذُ بداية نشأةِ الكون وتطوّرِ مكوّناتهِ الماديّة إلى اللّحظة الرّاهنة."
