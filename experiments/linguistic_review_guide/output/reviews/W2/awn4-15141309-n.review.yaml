stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي وصفي أكثر منه معجمياً."
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
    observations: "المصطلح علمي متخصص في علم الكونيات (Cosmology)، وهو تعبير حديث نسبياً في المعجمية العربية، لكنه مستقر في المراجع العلمية المترجمة."
  blind_candidates:
    - lemma: "زَمَنٌ كَوْنِيّ"
      generation_method: tarkib
      justification: "الترجمة المباشرة والمصطلح المعتمد في الفلك."
    - lemma: "عُمْرُ الكَوْنِ"
      generation_method: tarkib
      justification: "تعبير شائع في الفيزياء الفلكية يشير إلى المدة الزمنية منذ نشأة الكون."
    - lemma: "أَمَدٌ كَوْنِيّ"
      generation_method: tarkib
      justification: "استخدام 'أمد' للدلالة على المدى الزمني المتطاول."
    - lemma: "تَوْقِيتٌ كَوْنِيّ"
      generation_method: tarkib
      justification: "يشير إلى نظام التوقيت الموحد على مقياس الكون."

stage2_evidence:
  per_lemma:
    - lemma: "زمن كوني"
      confirm:
        - text: "زمن (ال...) الكوني (cosmic time)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) - عرب تيرم"
    - lemma: "دهر كوني"
      confirm:
        - text: "دهر(ال...) الكوني (cosmic eon)"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) - عرب تيرم"
      expands:
        - text: "الدهر الكوني هو فترة زمنية جيولوجية واسعة جداً."
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          addition: "يستخدم في سياق الجيولوجيا والزلازل."

stage3_analysis:
  per_lemma:
    - lemma: "زمن كوني"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد ومستقر في المعاجم المتخصصة لمقابلة cosmic time."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَمَنٌ كَوْنِيّ"
    - lemma: "عُمْرُ الكَوْنِ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير اصطلاحي مرادف في السياقات العامة والعلمية للدلالة على الزمن الذي استغرقه تطور الكون."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "عُمْرُ الكَوْنِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15141309-n"}

