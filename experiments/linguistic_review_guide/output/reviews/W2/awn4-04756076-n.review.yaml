# مراجعة المجموعة الترادفية — Synset Review
# id: awn4-04756076-n  |  ili: i61982  |  pos: n
# المفهوم: the quality of being unlike or dissimilar (difference)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يستخدم لفظ 'مختلفاً' المشتق من جذر اختلاف وهو إحدى لمّات المجموعة، مما يُفضي إلى دوران جزئي"
      - "صياغة 'صفة كون الشيء غير مشابه' تعبير اصطناعي ركيك لا يلتزم أسلوب التعريف المعجمي السليم (جنس قريب + فصل نوعي)"
      - "التعريف ترجمة حرفية للإنجليزية 'the quality of being unlike' ولا يعكس نظيراً معجمياً عربياً أصيلاً"
    observations: >
      المجموعة تعبّر عن مفهوم 'خاصية اللاتشابه' (the quality of being unlike or dissimilar)،
      وهو مفهوم عربي أصيل تتسع له المعجمات الكلاسيكية والمعاصرة. تنتمي اللمّات المحتملة
      إلى حقل دلالي غنيٍّ في العربية، تتوزع فيه المصطلحات بين ما يدل على العموم (اختلاف)
      وما يدل على الشدة والتباعد (تباين) وما يركز على التمييز والفصل (فرق). تستحق الفروق
      الدلالية الدقيقة بين هذه الألفاظ توثيقاً معجمياً صريحاً تجنباً لادعاء الترادف المطلق.
  blind_candidates:
    - lemma: "مُغَايَرَة"
      generation_method: ishtiqaq
      justification: >
        من جذر غ-ي-ر على وزن مُفَاعَلَة؛ أصل الغين والياء والراء يدل على اختلاف شيئين
        (كما جاء في مقاييس اللغة)، فمُغَايَرَة تُعبّر عن صفة كون الشيء غيراً لما سواه
        أي أنه لا يُماثله ولا يُشابهه؛ وهي على الوزن الدال على التحقق والمصدرية
    - lemma: "تَنَافُر"
      generation_method: ishtiqaq
      justification: >
        من جذر ن-ف-ر على وزن تَفَاعُل الدال على التشارك والمفاعلة؛ النفور والتجافي
        والتباعد الأصلي نُقل مجازاً إلى الدلالة على عدم التشابه والتنافر الصفاتي
        بين الأشياء كما يتنافر الجنسان المتباينان في طبيعتهما
    - lemma: "تَفَاوُت"
      generation_method: ishtiqaq
      justification: >
        من جذر ف-و-ت على وزن تَفَاعُل؛ التفاوت يدل على الاختلاف في الأوصاف إذ يفوت
        وصف أحد الشيئين الآخر، وهو أقرب المصطلحات الاشتقاقية للدلالة على عدم التشابه
        من زاوية الأوصاف والصفات المتغايرة
    - lemma: "تَنَاكُر"
      generation_method: ishtiqaq
      justification: >
        من جذر ن-ك-ر على وزن تَفَاعُل؛ النُّكر خلاف المعرفة والألفة، والتناكر يُشير
        مجازاً إلى أن الشيئين لا يتعارفان ولا يتشابهان كأنَّ كلاً منهما ينكر الآخر
        ولا يُقرّ بمشابهته له


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "اخْتِلَاف"
      confirm:
        - text: "«لغة ضدّ الاتفاق»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الاخْتِلافُ (فى الفِقْه): ذَهابُ كُلِّ واحِدٍ إِلى غَيْرِ ما ذَهَبَ إليه الآخَر، أو ضِدُّه»"
          source: "المعجم الكبير"
      expands:
        - text: "«الاختلاف: افتعال من الخلاف، وهو تقابل بين رأيين فيما ينبغي انفراد الرأي فيه، ذكره الحرالي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُخصِّص الدلالة في السياق الكلامي الفقهي بمعنى التعارض بين رأيين؛ أخص من المعنى العام لعدم التشابه"

    - lemma: "تَبَايُن"
      confirm:
        - text: "«التباين: التباعد والافتراق»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«التّباين: Difference، divergence، gap — يرادف المباينة عند المحاسبين وكذا عند المنطقيين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(1) تباين؛ اختلاف (2) نقطةُ تبايُن»"
          source: "المورد الحديث (ARABTERM — dissimilarity)"
      expands:
        - text: "«التباين: ما إذا نسب أحد الشيئين إلى الآخر لم يصدق أحدهما على شيء مما صدق عليه الآخر، فإن لم يصدقا على شيء أصلا فبينهما تباين كلي كالإنسان والفرس، وإن صدقا في الجملة فبينهما تباين جزئي كالحيوان والأبيض»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُفرِّق بين التباين الكلي والجزئي في المنطق؛ توسع اصطلاحي يتجاوز المعنى اللغوي العام"

    - lemma: "فَرْق"
      confirm:
        - text: "«الْفَاءُ وَالرَّاءُ وَالْقَافُ أُصَيْلٌ صَحِيحٌ يَدُلُّ عَلَى تَمْيِيزٍ وَتَزْيِيلٍ بَيْنَ شَيْئَيْنِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "فرق = difference"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ARABTERM)"
        - text: "فَرْق = difference (Gross Anatomy)"
          source: "معجم المصطلحات الطبية — ج.2 (ARABTERM)"
      expands:
        - text: "«الفرق: اختصاص برأي وجهة عمن حقه أن يتصل به ويكون معه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الاستخدام الصوفي والكلامي يُخصِّص الفرق في سياقات الانفصال الوجداني؛ توسع في معناه الأصلي التمييزي"

    - lemma: "مُغَايَرَة"
      evidence_status: "no_material_found"

    - lemma: "تَنَافُر"
      contradicts:
        - text: "«التنافر: في اللغة أصله التحاكم في الحسب ثم كثر حتى استعمل في كل تحاكم. وعند أهل المعاني، وصف في الكلمة يوجب ثقلها على اللسان وعسر النطق بها كهعخع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الدلالة الأصلية في التنافس على الشرف، والاصطلاحية البلاغية في ثقل الكلمات على اللسان — كلتاهما بعيدة عن معنى عدم التشابه"
        - text: "«التّنافر: Dissonance، discord — يُطلق على وصف في الكلمة يوجب ثقلها على اللسان»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "مصطلح بلاغي صوتي لا يُعبِّر عن صفة عدم التشابه بين الأشياء"
      expands:
        - text: "تنافر = incompatibility"
          source: "المعجم الموحد لمصطلحات علم الأحياء (ARABTERM)"
          addition: "استخدام تقني حيوي حديث للدلالة على عدم التوافق البيولوجي؛ يبعد عن المعنى المقصود في هذه المجموعة الترادفية"

    - lemma: "تَفَاوُت"
      confirm:
        - text: "«التفاوت: الاختلاف في الأوصاف كأنه يفوت وصف أحدهما الآخر، أو وصف كل منهما الآخر، وأصله عدم التناسب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«تَفَاوَتَ الشَّيْئَانِ: تَبَاعَدَ مَا بَيْنَهُمَا، أَيْ لَمْ يُدْرِكْ هَذَا ذَاكَ»"
          source: "مقاييس اللغة لابن فارس (جذر فوت)"
          addition: "أصل المعنى التباعد بالدرجة حتى لا يلحق أحدهما الآخر — يُشير إلى فجوة الدرجة لا عدم التشابه الكيفي"

    - lemma: "تَنَاكُر"
      contradicts:
        - text: "«(تناكر) فلانٌ: تجاهل؛ والقومُ: تعادوا وأنكر بعضهم بعضاً؛ والأمرَ: ادّعى جهله»"
          source: "المعجم الوسيط"
          conflict: "المعنى يدور حول التعادي والتجاهل المتبادل بين الأشخاص لا حول صفة عدم التشابه بين الأشياء"
        - text: "تناكر = antipathy"
          source: "المعجم الطبي الموحد (ARABTERM)"
          conflict: "الترجمة الإنجليزية (antipathy) تُشير إلى العداء النفسي لا عدم التشابه الوصفي"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "اخْتِلَاف"
      decision: confirmed
      decision_reason: >
        لمّة راسخة موثّقة في المعجمات الكلاسيكية والمعاصرة بمعنى عدم الاتفاق وعدم التشابه؛
        الأوسع استخداماً في المنظومة الترادفية وأكثرها شيوعاً في الفصحى المعاصرة والكلاسيكية؛
        التشكيل صحيح ولا يحتاج تصحيحاً
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الأعمُّ في الاستخدام؛ يدل على كل ضرب من اللاتشابه سواء في الرأي أو الصفة أو الجوهر؛
        يُحيط بالمفهوم من زوايا متعددة ويُستخدم في السياقين الخبري والإخباري

    - lemma: "تَبَايُن"
      decision: confirmed
      decision_reason: >
        موثّق في المعجمات الكلاسيكية والتقنية بمعنى التباعد والافتراق؛ يؤكد الدلالة على
        عدم التشابه مع تركيز أقوى على التباعد الجوهري؛ مؤيَّد في كشاف التهانوي بترجمة
        Difference/divergence/gap؛ التشكيل صحيح
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أقوى درجةً من الاختلاف؛ يُشير إلى التباعد الجوهري الكلي أو الجزئي في المفاهيم
        والمصاديق؛ أكثر استخداماً في الخطاب المنطقي والفلسفي والعلمي

    - lemma: "فَرْق"
      decision: confirmed
      decision_reason: >
        موثَّق في مقاييس اللغة لابن فارس بمعنى التمييز والفصل بين شيئين، وفي معاجم ARABTERM
        المتعددة بترجمة مباشرة (difference)؛ التشكيل صحيح
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على فعل التمييز والفصل بين أمرين أكثر من الدلالة على الصفة المجردة؛
        كثيراً ما يُستخدم للإشارة إلى مقدار التباين القابل للقياس أو الرصد

    - lemma: "مُغَايَرَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُكشف مادة معجمية مستقلة تُثبت هذا المصطلح بالمعنى المقصود في المعجمات المعتمدة؛
        وإن كان جذر غ-ي-ر يحمل دلالة اللاتشابه (كما في المقاييس) فإن تحديد وزن مُفَاعَلَة
        لهذه الدلالة يحتاج توثيقاً مستقلاً؛ ولا تنطبق عليه اختبارات التثبيت المعجمي

    - lemma: "تَنَافُر"
      source: stage1
      decision: removed
      decision_reason: >
        يدل في المعجمات الكلاسيكية والبلاغية على الثقل الصوتي في الكلام أو التنافس
        في المحتد — لا على صفة عدم التشابه بين الأشياء؛ واستخداماته التقنية الحديثة
        تدور حول Repulsion/Dissonance/Incompatibility في مجالات متخصصة بعيدة عن هذا المفهوم

    - lemma: "تَفَاوُت"
      source: stage1
      decision: removed
      decision_reason: >
        يُخصَّص في المعجم للاختلاف الكمي في الأوصاف والمقادير (أصله عدم التناسب كما
        في التوقيف)؛ أقرب إلى مجموعة ترادفية خاصة بـ disparity/inequality منه إلى
        هذه المجموعة التي تُعبِّر عن الصفة الكيفية العامة لعدم التشابه

    - lemma: "تَنَاكُر"
      source: stage1
      decision: removed
      decision_reason: >
        يدل على التعادي والتجاهل المتبادل بين الأشخاص أو ادعاء الجهل بالأمر؛
        معناه شعوري وعلائقي لا يُعبِّر عن الصفة المجردة لعدم التشابه بين الأشياء


