# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15281228-n
# a unit of play in tennis or squash
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «مجموعة» عامة جداً (مجموعة رياضية، مجموعة أشخاص) وليست مصطلحاً رياضياً مسكوكاً للتنس؛ استخدامها ترجمة حرفية للإنجليزية set"
      - "«شوط» مصطلح رياضي راسخ لكنه يُستعمل عادة لـ«الشوط» في كرة القدم (نصف المباراة) أو في الملاكمة (الجولة)؛ يحتاج تدقيق في سياق التنس تحديداً"
      - "التعريف العربي الحالي مختصر ولا يميّز المجموعة عن الجيم (game) أو الجولة (round)"
    observations: "المفهوم المقصود هو «السِّتّ» (set) في التنس والإسكواش، وهو وحدة تتألف من عدة أشواط فردية (games). في الاستعمال الرياضي العربي المعاصر يُستخدم «شوط» للدلالة على جزء من المباراة عموماً، بينما «مجموعة» ترجمة حرفية من الإنجليزية. المصطلح الأدق في لسان الإعلام الرياضي العربي هو «شوط» أو «مجموعة» مع تفضيل الأول لرسوخه المعجمي."

  blind_candidates:
    - lemma: "شَوْط"
      generation_method: ishtiqaq
      justification: "من الجذر (شوط) على وزن فَعْل، ومعناه الأصلي الجَرْي مرة إلى الغاية، ثم وُسِّع ليشمل الجزء من أي عمل أو مباراة رياضية. مصطلح راسخ في المعجم الوسيط."
    - lemma: "جُولَة"
      generation_method: ishtiqaq
      justification: "من الجذر (جول) على وزن فُعْلة بمعنى الدَّوران والطواف، ويُستخدم في الملاكمة والمصارعة للدلالة على وحدة اللعب. قد يصلح للتنس توسيعاً."
    - lemma: "طَوْر"
      generation_method: majaz
      justification: "من الجذر (طور) بمعنى المرحلة والحد، فالمباراة تمر بأطوار متعاقبة. مجاز قائم على المشابهة بين مراحل المباراة والأطوار الزمنية."
    - lemma: "مَجْمُوعَة"
      generation_method: ishtiqaq
      justification: "من الجذر (جمع) على وزن مَفْعُولة، بمعنى ما جُمع من أشياء. تُستخدم في الإعلام الرياضي العربي ترجمةً للإنجليزية set."


stage2_evidence:
  per_lemma:
    - lemma: "شَوْط"
      confirm:
        - text: "«(الشوط) الْعَدو مرّة إِلَى الْغَايَة يُقَال أجْرى فرسه شوطا أَو شوطين أَو أَكثر وَيُطلق على الْجُزْء من كل عمل (ج) أَشْوَاط»"
          source: "المعجم الوسيط"
        - text: "«الشَّوْطُ الجَرْيُ مَرَّةً إلى الغايةِ وهو الطَّلَقُ والجمعُ أَشْوَاطٌ وطافَ ثلاثةَ أَشْوَاطٍ كُلُّ مرةٍ من الحَجَر إلى الحَجَر شَوْطٌ»"
          source: "المصباح المنير للفيّومي"
        - text: "«الشَّوْطُ: الجَرْيُ مرة إلى غاية، والجمع أَشْواطٌ»"
          source: "لسان العرب لابن منظور"
        - text: "«الشَّوط: هو الجَري مرةً إلى الغاية ويراد به عند الفقهاء: الطواف مرةً جمعُه الأشواط»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«مدة عمل وحدة معالجة ما»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "توسيع حديث للمعنى ليشمل دورة عمل في الهندسة"

    - lemma: "مَجْمُوعَة"
      confirm:
        - text: "«لفظ عام يطلق على مجموع عناصر منسجمة تكون وحدة مثل مجموعة المحارف ومجموعة التعليمات وغيرهما»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      contradicts:
        - text: "«مفهوم رياضي استعمل بكثرة في اللسانيات وهو يدل على عدد من المكونات لها خاصيات متشابهة أو خاصية واحدة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "التعريفات المعجمية لـ«مجموعة» تدور حول المعنى الرياضي/المنطقي (تجمّع عناصر)، لا المعنى الرياضي الرياضوي (وحدة في مباراة)"

    - lemma: "جُولَة"
      confirm:
        - text: "«( في الملاكمة والمصارعة ) round: وحدة اللَّعب الأصلىّ في المباراة , مدَّتُها ثلاثُ دقائق , يَعْقُبُها راحةٌ مدَّتُها دقيقة»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«( في الملاكمة والمصارعة ) round»"
          source: "المعجم الكبير"
          conflict: "«جولة» مقيّدة بالملاكمة والمصارعة حيث وحدة اللعب زمنية (٣ دقائق)، بينما set في التنس وحدة عددية (مجموع ألعاب)"

    - lemma: "طَوْر"
      evidence_status: "no_material_found"

    - lemma: "مَجْمُوعَة (stage1)"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "شَوْط"
      decision: confirmed
      decision_reason: "لفظة «شوط» مصطلح عربي أصيل راسخ في المعاجم التراثية والحديثة بمعنى الجَرْي مرة إلى الغاية، ثم عُمِّم على الجزء من كل عمل (المعجم الوسيط). يُستخدم في الإعلام الرياضي العربي المعاصر بمعنى وحدة من وحدات المباراة في التنس والكرة الطائرة وغيرها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح تراثي أصيل يحمل دلالة الحركة والجري نحو غاية، أعم من «مجموعة» إذ يصلح لأي جزء من عمل رياضي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَوْط"

    - lemma: "مَجْمُوعَة"
      decision: removed
      decision_reason: "لفظة «مجموعة» عامة جداً ومعناها المعجمي الأصلي هو تجمّع عناصر (رياضيات/منطق). استخدامها بمعنى set في التنس ترجمة حرفية (calque) من الإنجليزية لم تثبت في المعاجم العربية بهذا المعنى الرياضوي. «شوط» أولى لرسوخه المعجمي وتخصصه الدلالي في ميدان الألعاب."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جُولَة"
      source: stage1
      decision: removed
      decision_reason: "«جولة» مقيّدة في المعاجم بالملاكمة والمصارعة (round)، وهي وحدة زمنية محددة (٣ دقائق). أما set في التنس فوحدة عددية (مجموع ألعاب يفوز بها اللاعب). الفرق البنيوي يمنع الترادف."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "طَوْر"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على استخدام «طور» في السياق الرياضي. المعنى الأصلي (المرحلة/الحد) بعيد عن دلالة الوحدة الرياضية المحددة البنية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مَجْمُوعَة (stage1)"
      source: stage1
      decision: removed
      decision_reason: "مكررة مع اللمّة الموجودة «مجموعة»، وقد رُفضت للأسباب نفسها."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


