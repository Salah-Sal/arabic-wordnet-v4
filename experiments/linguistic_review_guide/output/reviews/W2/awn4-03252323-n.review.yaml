stage1_review:
  assessment:
    concerns:
      - "تفتقر المجموعة حاليًا للمصطلح المقابل للجانب المخدر (narcotic) المذكور في التعريف."
    observations: "المجموعة تغطي المفهوم العام للعقاقير الطبية والمواد المخدرة. المصطلحات الحالية تركز على الجانب العلاجي (دواء، عقار)، بينما يشمل التعريف الإنجليزي والعرلي صراحة 'المخدر'."
  blind_candidates:
    - lemma: "دَواء"
      generation_method: ishtiqaq
      justification: "اللفظ الأكثر شيوعاً للمادة التي يُتداوى بها."
    - lemma: "عَقَّار"
      generation_method: majaz
      justification: "مصطلح فني يطلق على أصول الأدوية والمواد الصيدلانية."
    - lemma: "مُخَدِّر"
      generation_method: ishtiqaq
      justification: "يقابل الجزء الثاني من التعريف (narcotic) ويشير للمواد المسببة لفقدان الوعي أو التسكين العميق."
    - lemma: "عِلاج"
      generation_method: ishtiqaq
      justification: "يستخدم أحياناً كمرادف للدواء (ما يُعالج به)."

stage2_evidence:
  per_lemma:
    - lemma: "دَوَاء"
      confirm:
        - text: "«الدَّوَاءُ مَا يُتَداوَى به ويُعالَج»"
          source: "المعجم الكبير"
        - text: "«الدواء اسم لما يستعمل لقصد إزالة المرض أو الألم أو لأجل حفظ الصحة»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "عَقَّار"
      confirm:
        - text: "«العَقَّار: مبالغة عاقر، وأصل الدواء (ج) عقاقير»"
          source: "المعجم الوسيط"
        - text: "«عَقَّار بمعنى دواء، تضبط في المعاجم بتشديد القاف، وتجمع على عقاقير»"
          source: "معجم الصواب اللغوي"
    - lemma: "مُخَدِّر"
      confirm:
        - text: "«المخدر: مادة تسبب في الإنسان والحيوان فقدان الوعي بدرجات متفاوتة كالحشيش والأفيون»"
          source: "المعجم الوسيط"
        - text: "«دواء يجعل الروح الحساس أو المحرّك للعضو غير قابل لتأثير القوة النفسانية قبولا تاما»"
          source: "كشاف اصطلاحات الفنون"

stage3_analysis:
  per_lemma:
    - lemma: "دَوَاء"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشائع يتفق تماماً مع التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَوَاء"
    - lemma: "عَقَّار"
      decision: confirmed
      decision_reason: "مصطلح فني دقيق يشير إلى المادة الدوائية في أصلها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَقَّار"
    - lemma: "مُخَدِّر"
      source: stage1
      decision: confirmed
      decision_reason: "ضروري لتغطية الدلالة على المواد المخدرة المذكورة في التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُخَدِّر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "مادّة تُستخدَم كدواء أو مُخدِّر"
    assessment:
      decision: retain
      reason: "التعريف دقيق ومختصر ويجمع بين الشقين الطبي والمخدر للمصطلح الإنجليزي drug."
  examples:
    per_lemma:
      - lemma: "دَوَاء"
        examples:
          - text: "تَنَاوَلَ المَرِيضُ الدَّوَاءَ فِي مَوْعِدِهِ لِيَتَمَاثَلَ لِلشِّفَاء."
            type: usage
      - lemma: "عَقَّار"
        examples:
          - text: "أَعْلَنَ المَعْمَلُ عَنْ طَرْحِ عَقَّارٍ جَدِيدٍ لِعِلَاجِ فَقْرِ الدَّمِ."
            type: usage
      - lemma: "مُخَدِّر"
        examples:
          - text: "حَذَّرَتِ الحُكُومَةُ مِنْ مَخَاطِرِ تَعَاطِي المَوَادِّ المُخَدِّرَةِ."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "دَوَاء"
      entry_id: "{auto}"
      root: "دوي"
      maqayis_quote: "«الدَّالُ وَالْوَاوُ وَالْحَرْفُ الْمُعْتَلُّ... وَالدَّوَاءُ مَعْرُوفٌ، تَقُولُ دَاوَيْتُهُ أُدَاوِيهِ مُدَاوَاةً وَدِوَاءً.»"
    - lemma: "عَقَّار"
      entry_id: "{auto}"
      root: "عقر"
      maqayis_quote: "«الْعَيْنُ وَالْقَافُ وَالرَّاءُ أَصْلَانِ مُتَبَاعِدٌ مَا بَيْنَهُمَا... وَأَخْلَاطُ الدَّوَاء يُقَالُ لَهَا الْعَقَاقِيرُ، وَاحِدُهَا عَقَّارٌ. وَسُمِّيَ بِذَلِكَ لِأَنَّهُ كَأَنَّهُ عَقَرَ الْجَوْفَ.»"
    - lemma: "مُخَدِّر"
      entry_id: "{auto}"
      root: "خدر"
      maqayis_quote: "«الْخَاءُ وَالدَّالُ وَالرَّاءُ أَصْلَانِ: الظُّلْمَةُ وَالسَّتْرُ، وَالْبُطْءُ وَالْإِقَامَةُ... وَمِنَ الْبَابِ خَدِرَتْ رِجْلُهُ. وَخَدِرَ الرَّجُلُ، وَذَلِكَ مِنِ امْذِلَالٍ يَعْتَرِيهِ.»"
  per_sense:
    - lemma: "دَوَاء"
      sense_id: "{auto}"
      nuance: "اللفظ العام الشامل لكل ما يستعمل للعلاج."
      mwe: false
    - lemma: "عَقَّار"
      sense_id: "{auto}"
      nuance: "يشير غالباً إلى المادة الخام أو المستحضر الكيميائي الطبي، ويتميز بصبغة فنية/صيدلانية."
      mwe: false
    - lemma: "مُخَدِّر"
      sense_id: "{auto}"
      nuance: "يختص بالمواد التي تؤثر على الجهاز العصبي وتسبب التخدير أو فقدان الوعي."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دوي","maqayis":"«الدَّالُ وَالْوَاوُ وَالْحَرْفُ الْمُعْتَلُّ... وَالدَّوَاءُ مَعْرُوفٌ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عقر","maqayis":"«الْعَيْنُ وَالْقَافُ وَالرَّاءُ أَصْلَانِ... وَأَخْلَاطُ الدَّوَاء يُقَالُ لَهَا الْعَقَاقِيرُ، وَاحِدُهَا عَقَّارٌ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"خدر","maqayis":"«الْخَاءُ وَالدَّالُ وَالرَّاءُ أَصْلَانِ... وَمِنَ الْبَابِ خَدِرَتْ رِجْلُهُ. وَخَدِرَ الرَّجُلُ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ العام الشامل لكل ما يستعمل للعلاج.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يشير غالباً إلى المادة الخام أو المستحضر الكيميائي الطبي، ويتميز بصبغة فنية/صيدلانية.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يختص بالمواد التي تؤثر على الجهاز العصبي وتسبب التخدير أو فقدان الوعي.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
