# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يستخدم 'معقداً' المشتق من جذر ع-ق-د نفسه الذي تنتسب إليه اللمّة الوحيدة، مما يُفضي إلى دوران اصطلاحي جزئي"
      - "المجموعة تحتوي على لمّة وحيدة فحسب (تَعْقِيد) في حين قد تُوجد مرادفات عربية أدق دلالةً كتَعَقُّد"
      - "تَعْقِيد يحمل في المعاجم الكلاسيكية والبيانية دلالةً مصطلحيةً خاصة هي عيب الكلام الغامض، وهذا يتعارض مع الاستخدام العام المعاصر"
    observations: "المجموعة تمثل مفهوم 'التعقيد' بوصفه صفةً مجردةً مُنتزَعةً من وصف الشيء بأنه معقد ومركب. جذر ع-ق-د الأصيل يدور حول الشدّ والربط والإحكام كما نصّ ابن فارس، ثم اتسع للتشابك والتداخل. اللمّة الوحيدة تَعْقِيد هي مصدر عَقَّدَ (باب التفعيل)، ومعناه الاصطلاحي الكلاسيكي عيبٌ بلاغي في الكلام الغامض الملتوي. الاستخدام الحديث وسّع دلالته ليشمل التعقيد كصفة عامة للأنظمة والعمليات، وهذا التوسيع موثّق في معاجم حديثة متعددة. يبقى تَعَقُّد (مصدر الباب الخامس) مرشّحاً موازياً يُعبّر عن حالة التشابك الذاتي دون نسبة الفعل إلى فاعل."
  blind_candidates:
    - lemma: "تَشَابُكٌ"
      generation_method: ishtiqaq
      justification: "من جذر ش-ب-ك، مصدر الفعل تَشَابَكَ (باب التفاعل)، يدل على الالتحام والتضافر والاشتباك المتبادل بين العناصر. يناسب التعبير عن صفة الشيء الذي تتداخل مكوناته وتتشابك، وهو ما يُعبّر عنه التعريف الإنجليزي بـ intricate."
    - lemma: "وَعُورَةٌ"
      generation_method: majaz
      justification: "أصل المادة و-ع-ر يصف الطريق الصعب الشاقّ غير الممهّد (وَعُرَ يَوْعُرُ وَعُورةً). الإزاحة الدلالية المقترحة: تُستعار وَعُورة لوصف صفة الشيء الذي يصعب سلوكه أو إدراكه لكثرة تشعّباته وتعقيداته، إذ يُقال في العربية 'أمرٌ وَعِر' ومنه الاستعارة الطبيعية."
    - lemma: "تَعَقُّدٌ"
      generation_method: ishtiqaq
      justification: "من جذر ع-ق-د، مصدر الفعل تَعَقَّدَ (باب التفعّل)، يدل على الانعقاد والتشابك الذاتي والوقوع في حال العقدة. يختلف جذرياً عن مصدر التفعيل (تَعْقِيد) لأنه يُعبّر عن الحالة الذاتية المنعكسة لا الفعل المُسنَد إلى فاعل، وهو أدقّ في وصف 'صفة كون الشيء'."
    - lemma: "تَشَعُّبٌ"
      generation_method: ishtiqaq
      justification: "من جذر ش-ع-ب، مصدر الفعل تَشَعَّبَ (باب التفعّل)، يدل على التفرع والانتشار في اتجاهات متعددة. يلتقط بُعد 'التركيب والتعدد' (compounded) في التعريف الإنجليزي، وهو صفة الشيء الذي يتشعّب ولا يكون بسيطاً أو أُحادياً."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفّذة: ٣ استعلامات
