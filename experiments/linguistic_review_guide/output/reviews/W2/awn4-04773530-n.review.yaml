stage2_evidence:
  per_lemma:
    - lemma: "تَعْقِيدٌ"
      contradicts:
        - text: "«(عند البيانيين): تأليف الكلام على وجه يعسُر فهمه لسوء ترتيبه (التعقيد اللفظي), أو لاستعمال مجاز بعيد العلاقة (التعقيد المعنوي)»"
          source: "المعجم الوسيط (OCR، entry 19280)"
          conflict: "المعجم الوسيط يُخصّص التعقيد بمصطلح بلاغي لعيب الكلام الغامض وحده، وهذا المعنى الاصطلاحي الضيّق يتعارض مع توظيفه في AWN كصفة مجردة عامة تنطبق على الأشياء والأنظمة"
        - text: "«التعقيد: هو ألا يكون اللفظ ظاهر الدلالة على المعنى المراد لخلل واقع؛ إما في النظم بألا يكون ترتيب الألفاظ على وفق ترتيب المعاني، بسبب تقديم أو تأخير أو حذف أو إضمار، أو في الانتقال»"
          source: "كتاب التعريفات للشريف الجرجاني (hawramani، entry 794763)"
          conflict: "الجرجاني يُثبّت التعقيد مصطلحاً بلاغياً صرفاً لعيب التعبير الكلامي"
        - text: "«التعقيد: أن لا يكون اللفظ ظاهر الدلالة على المعنى المراد لخلل في النظم»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani، entry 813331)"
          conflict: "المناوي يحصر التعقيد كذلك في عيب النظم الكلامي"
      confirm:
        - text: "«(1) تعقيد؛ تعقّد (2) شيء معقَّد.»"
          source: "المورد الحديث (2008)، [translation_en: complexity، entry 679370]"
        - text: "«الحالةُ التي يكون فيها تصميمُ أو تَنجيزُ نظامٍ أو مكوِّنٍ عصيّاً على الفهم أو يَصعب التحقق منه.»"
          source: "معجم مصطلحات المعلوماتية (2000)، [translation_en: complexity، entry 534873]"
      expands:
        - text: "«السّپَنْسَرِيَّة: فلسفة هربرت سپَنْسَر القائلة بتطوّر الكون من البساطة النِّسبية إلى التعقيد النسبيّ.»"
          source: "المورد الحديث (2008)، [translation_en: Spencerianism، entry 718982]"
          addition: "يؤكد توظيف 'التعقيد' في مقابل 'البساطة' كصفة لأنظمة الكون والطبيعة، وهو الاستخدام المقصود في المجموعة"
        - text: "«تعقيد زمني»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)، [translation_en: Time Complexity، entry 765944]"
          addition: "يُثبت توظيف تعقيد في المصطلحية التقنية الحاسوبية المعاصرة بمعناه العلمي القياسي"

    - lemma: "تَعَقُّدٌ"
      confirm:
        - text: "«منظومة بتفاصيل كثيرة وتربط بين مكوناتها علاقات محيرة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم — ArabTerm، [translation_en: intricacy، entry 359524]"
        - text: "«تَعَقُّدٌ»"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية (2020)، [translation_en: complexity، entry 731495]"
      expands:
        - text: "«تعقَّد... الكلام: أعيا فهمه لسوء تركيبه أو خفاء معناه»"
          source: "المعجم الوسيط (OCR، entry 19279)"
          addition: "يدل على حال الشيء الذي يَعِزّ فهمه لتشابكه الذاتي، وهو تعبير عن الحالة المنعكسة لا الفعل المُسنَد إلى فاعل"
        - text: "«(1) تعقيد\n(2) تعقُّد\n(3) المُعَقِّد: عنصرٌ مُعقِّد\n(4) المضاعَفَة: علّة أو حالة ثانوية تنشأ أثناء مرضٍ ما فتزيده خطورةً.»"
          source: "المورد الحديث (2008)، [translation_en: complication، entry 679380]"
          addition: "يُثبت تعامل المورد الحديث مع تعقيد وتعقّد كمترادفَين في سياق أشمل يشمل complexity وcomplication"

    - lemma: "تَشَابُكٌ"
      expands:
        - text: "«(11) متشابك؛ معقّد؛ مَعُوق عن الحركة (12) تشابكٌ؛ تعقُّد إلخ»"
          source: "المورد الحديث (2008)، [translation_en: foul، entry 689183]"
          addition: "يُظهر استخدام تشابك بمعنى التعقد والاشتباك في سياق حسي ومادي (خيوط، حركة مُعاقة)، لا كصفة مجردة للمفاهيم"
        - text: "«تشابُك (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)، [translation_en: overlap، entry 353327]"
          addition: "يُستخدم في المصطلحيات التقنية لوصف التداخل الهندسي المادي"

    - lemma: "وَعُورَةٌ"
      evidence_status: "no_material_found"

    - lemma: "تَشَعُّبٌ"
      expands:
        - text: "«الشَّيْءُ: تَجَمَّعَ تَفَرَّقَ, وَتَفَرَّعَ. (ضدٌّ)»"
          source: "المعجم الكبير (OCR، entry 51777)"
          addition: "يدل على التفرع والانتشار في شُعَب متعددة، وهو جانب واحد من جوانب التعقيد (التفريع) لا التعقيد بمعناه الشامل"
        - text: "«(تشعب) انْتَشَر وتفرق والزَّرع ونحوه صَار ذَا شعب»"
          source: "المعجم الوسيط (hawramani، entry 890685)"
          addition: "يؤكد دلالة التشعب على الانتشار والتفرع المادي لا على صفة التعقيد المجردة"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تَعْقِيدٌ"
      decision: confirmed
      decision_reason: "رغم الدلالة الكلاسيكية التي تُخصّص تعقيد بمصطلح بلاغي لعيب الكلام، فإن المعاجم الحديثة المعتمدة توثّق استخدامه الواسع للدلالة على التعقيد كصفة مجردة عامة. وقد استقرّ هذا الاستخدام في التقنية والفلسفة والعلوم (تعقيد زمني، تعقيد خوارزمي، تعقيد النظام)، مما يجعله المصطلح العربي الأكثر شيوعاً لـcomplexity في الخطاب المعاصر. بوابة الجودة: الاطّراد حاصل في الاستخدام الحديث، ويُسر التداول مرتفع، الملاءمة متحققة، وله الأولوية بحكم الاستقرار المعجمي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تعقيد (مصدر الباب الثاني: عَقَّدَ يُعقِّد) ينزع نحو الدلالة على التعقيد بوصفه مقياساً موضوعياً قابلاً للحساب والتحليل، ومستخدَم على نطاق واسع في المصطلحيات التقنية والعلمية (التعقيد الزمني، المكاني، الحسابي)؛ بينما تعقّد (مصدر الباب الخامس: تَعَقَّدَ) يُعبّر عن حالة التشابك الذاتي الملموسة في بنية الشيء بما يقترب من intricacy."

    - lemma: "تَعَقُّدٌ"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق في معجم المناخ والبيئة (ALECSO/ArabTerm) بوصفه ترجمةً لـintricacy مع تعريف دقيق ومطابق للمجموعة: 'منظومة بتفاصيل كثيرة وتربط بين مكوناتها علاقات محيرة'. وكذلك في معجم الحكامة التربوية (2020) لـcomplexity. اختبار الاستبدال: يمكن استخدامه في سياقات وصفية مقام تعقيد. اختبار عدم الترادف المطلق: يؤدي فرقاً دقيقاً إذ يُعبّر عن الحالة الذاتية. بوابة الجودة: مُستقّ قياسي على وزن تَفَعُّل، يقبل النسبة والجمع (تعقّدات)، ملائم ومطّرد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تعقّد يُعبّر عن حالة التشابك الذاتي في بنية الشيء (intricacy)، أي صفة الشيء من حيث ذاته بصرف النظر عن من عقّده؛ وهو أقرب للمعنى الوصفي الملموس المتعلق بتشابك العلاقات الداخلية."
      actions:
        - command: create_entry
          params:
            lemma: "تَعَقُّدٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04773530-n"

    - lemma: "تَشَابُكٌ"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المجموعة تُثبت أن تشابك يُستخدم للتشابك الحسي والمادي (خيوط، أسلاك، إشارات) وللترابط الهيكلي في المصطلحيات التقنية، لكنه لا يُوثَّق كمصطلح مستقل للدلالة على صفة التعقيد المجردة بمعنى complexity أو intricacy. اختبار الاستبدال: 'تشابك الخوارزمية' لا يحلّ محلّ 'تعقيد الخوارزمية' في السياقات العلمية. ليس مسكوكاً في هذا المعنى."

    - lemma: "وَعُورَةٌ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي دليل معجمي يُثبت توظيف وعورة للدلالة على صفة التعقيد. المادة الأصيلة و-ع-ر مقيّدة بمجال وصف صعوبة المسالك والطرق الحسية. المجاز المقترح وحده غير كافٍ دون توثيق للسكّ المصطلحي. فشل اختبار التثبيت المعجمي."

    - lemma: "تَشَعُّبٌ"
      source: stage1
      decision: removed
      decision_reason: "الأدلة تُثبت أن تشعّب يدل على التفرع والانتشار في اتجاهات متعددة، وهو جانب واحد من جوانب التعقيد لا مرادف شامل له. لا يُستخدم اصطلاحاً مستقلاً لـcomplexity في أي معجم رصدناه. اختبار الاستبدال: 'تشعّب المسألة' يُعبّر عن التفرع لا عن درجة التعقيد الكلية."


