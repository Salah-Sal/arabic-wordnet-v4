# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13601261-n (utility)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (منفعة)، وهو ما يُضعف التغطية المعجمية للمفهوم الاقتصادي"
      - "اللمّة الموجودة بلا تشكيل"
    observations: >
      المفهوم هو «المنفعة» بالمعنى الاقتصادي: مقياس رقمي أو ترتيبي يعبّر عن درجة
      الإشباع أو الرضا التي يحصل عليها المستهلك من استخدام سلعة أو خدمة، ويُعَدّ
      أساس نظرية الاختيار العقلاني. المصطلح العربي «منفعة» مستقرّ في الأدبيات
      الاقتصادية العربية ومعتمد في المعاجم الموحدة (ALECSO). الجذر نفع يحمل في
      أصله الدلالة على خلاف الضرّ، وهو ملائم تماماً للمفهوم. المركّبات الاصطلاحية
      (منفعة حدّية، منفعة كلية، منفعة ترتيبية) تؤكد رسوخ اللفظ في الحقل الاقتصادي.
  blind_candidates:
    - lemma: "مَنْفَعَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر نفع على وزن مَفْعَلة، دالّ على ما يُنتفع به. المصطلح الاقتصادي
        الراسخ في العربية للدلالة على المقياس الذي يسعى المستهلك لتعظيمه.
    - lemma: "فَائِدَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر فيد على وزن فاعِلة، تدلّ على ما يُستحدَث من مال أو خير.
        قد تُستعمل بمعنى المنفعة العامة في بعض السياقات الاقتصادية.
    - lemma: "جَدْوَى"
      generation_method: majaz
      justification: >
        إزاحة دلالية من «الجدوى» بمعنى النفع والفائدة إلى المقياس الاقتصادي
        المجرد. لكنها تفتقر إلى الاستعمال المصطلحي المتخصص في الاقتصاد.
    - lemma: "نَفْعِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من نفع بإضافة ياء النسبة وتاء المصدر الصناعي.
        يدلّ على المفهوم المجرّد للنفع. لكنه يلتبس مع المذهب الفلسفي (النفعية/utilitarianism).

stage2_evidence:
  per_lemma:
    - lemma: "مَنْفَعَة"
      confirm:
        - text: "«كلُّ ما يُنْتَفع به. مذهب المنفعة: مذهب أخلاقيٌّ يجعل مِنْ نفع الفرد والمجموع مقياساً للسلوك؛ ومن أشهر ممثِّليه: (بِنْتَام), و (ستيوَرْت مِيل)»"
          source: "المعجم الوسيط"
        - text: "«(1) منفعة؛ نفع؛ فائدة (2) شيء نافع أو معدّ للاستعمال (3) مؤسّسة ذات منفعة عامة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«منفعة» = utility — في معاجم التجارة والمحاسبة، والاقتصاد، وعلم الاجتماع، والجغرافيا، والقانون (ALECSO)"
          source: "المعاجم الموحدة (ARABTERM)"
          addition: "المصطلح معتمد في خمسة معاجم موحدة على الأقل بوصفه مقابلاً لـ utility"
        - text: "«منفعة عددية: يمكن قياسها بأعداد، عكس المنفعة الترتيبية» / «منفعة ترتيبية: تقاس بالرتبة التي تحتلها في تصنيف الفئات»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "وجود مركبات اصطلاحية (منفعة عددية/ترتيبية/حدية/كلية) يؤكد رسوخ اللفظ مصطلحاً اقتصادياً"
    - lemma: "فَائِدَة"
      confirm:
        - text: "«مقياس الارتياح.» — translation_en: utility"
          source: "مسرد المناخ والبيئة (ARABTERM)"
      contradicts:
        - text: "«فائدة» = interest (لا utility) في المعجم الموحد لمصطلحات الاقتصاد والتجارة والمحاسبة"
          source: "المعاجم الموحدة للاقتصاد والتجارة (ARABTERM)"
          conflict: "في الحقل الاقتصادي تحديداً، «فائدة» مصطلح مستقرّ بمعنى interest (ربح المال)، لا utility"
        - text: "«(الْفَائِدَة) المَال الثَّابِت وَمَا يُسْتَفَاد من علم أَو عمل أَو مَال أَو غَيره وَربح المَال فِي زمن محدد بِسعْر محدد (مج)»"
          source: "المعجم الوسيط"
          conflict: "التعريف يركّز على الربح المالي وما يُستفاد، لا على المقياس الاقتصادي المجرّد"
    - lemma: "جَدْوَى"
      evidence_status: "no_material_found"
    - lemma: "نَفْعِيَّة"
      contradicts:
        - text: "«نَفْعِيَّة: برمجية تقوم بوظيفة محددة مساعِدة» — translation_en: utility"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          conflict: "المصطلح مشغول في حقل المعلوماتية بمعنى utility software"
        - text: "«نفعية» = utilitarism — في مسرد الفلسفة وعلم النفس"
          source: "مسرد الفلسفة وعلم النفس (ARABTERM)"
          conflict: "المصطلح مشغول بمعنى المذهب النفعي (utilitarianism)، وهو مفهوم مختلف عن المنفعة الاقتصادية"

stage3_analysis:
  per_lemma:
    - lemma: "مَنْفَعَة"
      decision: confirmed
      decision_reason: >
        مصطلح اقتصادي راسخ، معتمد في خمسة معاجم موحدة على الأقل بوصفه المقابل العربي لـ utility.
        المعجم الوسيط يورد «مذهب المنفعة» بمعنى utilitarianism ما يؤكد المجال الدلالي.
        المركبات الاصطلاحية (منفعة حدّية، كلّية، ترتيبية، عددية) تدلّ على رسوخ اللفظ مصطلحاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الاقتصادي المعياري للدلالة على مقياس الإشباع الذي يسعى المستهلك لتعظيمه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنْفَعَة"
    - lemma: "فَائِدَة"
      source: stage1
      decision: removed
      decision_reason: >
        في الحقل الاقتصادي، «فائدة» مصطلح مستقرّ بمعنى interest (الربح على رأس المال)،
        لا utility. إدخالها في هذه المجموعة يُحدث التباساً اصطلاحياً خطيراً.
        الدليل الوحيد المؤيد (مسرد المناخ) شاذّ مقابل إجماع المعاجم الاقتصادية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "جَدْوَى"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي على استعمال «جدوى» مصطلحاً اقتصادياً بمعنى utility.
        اللفظ يدلّ على النفع العام أو الفائدة المرجوّة، لا على المقياس الاقتصادي المجرّد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "نَفْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح مشغول بدلالتين مستقرتين: (١) المذهب النفعي utilitarianism في الفلسفة،
        (٢) البرمجية المساعِدة utility في المعلوماتية. إضافته هنا يُحدث اشتراكاً لفظياً
        مُربكاً ويخالف مبدأ الاطّراد الاصطلاحي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "(اقتصاد) مقياس ينبغي تعظيمه في أي موقف ينطوي على الاختيار"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي، ويفتقر إلى الجنس القريب
        الواضح ولا يوضّح طبيعة المقياس (إشباع/رضا). يحتاج إعادة صياغة بأسلوب
        المعجم الوسيط مع بيان المجال الاقتصادي.
    authored:
      - type: terminological
        text: "(اقتصاد) مِقدارُ الإشباع أو الرِّضا الذي يحصل عليه المستهلِك من استخدام سلعة أو خدمة، ويُتَّخَذ معياراً للمفاضلة بين البدائل المتاحة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "(اقتصاد) ما يعود على المستهلِك من نفعٍ عند اختياره سلعةً أو خدمةً، ويُسعى في تعظيمه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
