stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة غير مشكولة."
    observations: "المفهوم علمي بيئي (ecesis) ويعبر عنه بدقة بمصطلح 'توطن'."
  blind_candidates:
    - lemma: "تَوَطُّن"
      generation_method: ishtiqaq
      justification: "وزن تفعّل للدلالة على الصيرورة والاتخاذ، وهو يعبر عن اتخاذ موطن جديد."
    - lemma: "اِسْتِيطَان"
      generation_method: ishtiqaq
      justification: "يدل على اتخاذ المكان وطناً والاستقرار فيه."
    - lemma: "تَأَقْلُم"
      generation_method: ishtiqaq
      justification: "القدرة على التكيف مع البيئة الجديدة كخطوة للاستقرار."
    - lemma: "اِسْتِقْرَار بِيئِيّ"
      generation_method: tarkib
      justification: "الاستقرار في البيئة الجديدة كمرادف لعملية الإقامة والمكوث."

stage2_evidence:
  per_lemma:
    - lemma: "توطن"
      confirm:
        - text: "«التوطُّن: استقرار نبتة أو حيوان في موطن جديد.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(توطن) مُطَاوع وَطن يُقَال توطنت نَفسه على الشَّيْء ذلت وتمهدت لَهُ وَالْأَرْض وَبهَا اتخذها وطنا»"
          source: "المعجم الوسيط"
          addition: "يؤكد المعنى اللغوي لعملية الاتخاذ والاستقرار."
    - lemma: "استيطان"
      contradicts:
        - text: "«استيطان: colonization»"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
          conflict: "المصطلح يشير إلى الاستيطان (colonization) وليس التوطن البيئي (ecesis)."
    - lemma: "تأقلم"
      evidence_status: "no_material_found"
    - lemma: "استقرار بيئي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "توطن"
      decision: confirmed
      decision_reason: "مصطلح علمي دقيق وموثق في معاجم المصطلحات لترجمة ecesis."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَطُّن"
    - lemma: "اِسْتِيطَان"
      source: stage1
      decision: removed
      decision_reason: "المصطلح يشير عادة إلى الاستيطان البشري أو الاستعمار (colonization) وليس عملية التوطن البيئي (ecesis)."
      evidence_assessment:
        case: contradicts_only
    - lemma: "تَأَقْلُم"
      source: stage1
      decision: removed
      decision_reason: "التأقلم (acclimatization) مفهوم بيئي آخر يختلف عن التوطن."
      evidence_assessment:
        case: no_material
    - lemma: "اِسْتِقْرَار بِيئِيّ"
      source: stage1
      decision: removed
      decision_reason: "يشير إلى حالة الاستقرار البيئي (environmental stability) وليس عملية التوطن."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "(في علم البيئة) العملية التي يستقر بها نبات أو حيوان في موطن جديد"
    assessment:
      decision: revise
      reason: "تشكيل التعريف وتدقيقه وصياغته بأسلوب معجمي رصين."
    authored:
      - type: terminological
        text: "عَمَلِيَّةٌ بِيئِيَّةٌ يَسْتَقِرُّ بِمُوجِبِهَا نَبَاتٌ أَوْ حَيَوَانٌ فِي مَوْطِنٍ جَدِيدٍ وَيَتَّخِذُهُ مَقَرًّا لَهُ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13497470-n"
          definition_index: 0
          text: "عَمَلِيَّةٌ بِيئِيَّةٌ يَسْتَقِرُّ بِمُوجِبِهَا نَبَاتٌ أَوْ حَيَوَانٌ فِي مَوْطِنٍ جَدِيدٍ وَيَتَّخِذُهُ مَقَرًّا لَهُ."
  examples:
    per_lemma:
      - lemma: "تَوَطُّن"
        examples:
          - text: "يُعَدُّ تَوَطُّنُ بَعْضِ الأَنْوَاعِ الدَّخِيلَةِ تَهْدِيدًا لِلتَّوَازُنِ البِيئِيِّ فِي المِنْطَقَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-13497470-n"
          text: "يُعَدُّ تَوَطُّنُ بَعْضِ الأَنْوَاعِ الدَّخِيلَةِ تَهْدِيدًا لِلتَّوَازُنِ البِيئِيِّ فِي المِنْطَقَةِ."

stage5_enrichment:
  per_entry:
    - lemma: "تَوَطُّن"
      entry_id: "{auto}"
      root: "وطن"
      maqayis_quote: "«(وَطَنَ) الْوَاوُ وَالطَّاءُ وَالنُّونُ: كَلِمَةٌ صَحِيحَةٌ. فَالْوَطَنُ: مَحَلُّ الْإِنْسَانِ. وَأَوْطَانُ الْغَنَمِ: مَرَابِضُهَا. وَأَوْطَنْتُ الْأَرْضَ: اتَّخَذْتُهَا وَطَنًا.»"
  per_sense:
    - lemma: "تَوَطُّن"
      sense_id: "{auto}"
      nuance: "المصطلح العلمي الدقيق المعتمد في علم البيئة للدلالة على هذه العملية."
