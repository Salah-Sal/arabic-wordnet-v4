stage1_review:
  assessment:
    concerns:
      - "اللمتان الحاليتان تفتقران إلى التشكيل الكامل الدقيق (مثل غياب حركات الحروف الأولى)."
      - "التعريف الحالي يحتوي على دوران لاحتوائه على كلمة (تشكل) وهي إحدى اللمات."
    observations: "مصطلحا (التشكل) و(التكون) هما مصدران يعبران بدقة عن العمليات الطبيعية التي تفضي إلى بناء الأشياء وظهورها، وكلاهما مستخدم بشكل واسع في المجالات العلمية لوصف الـ (formation)."
  blind_candidates:
    - lemma: "تَشَكُّل"
      generation_method: ishtiqaq
      justification: "مصدر قياسي على وزن تفعّل للدلالة على الصيرورة واتخاذ الشكل."
    - lemma: "تَكَوُّن"
      generation_method: ishtiqaq
      justification: "مصدر قياسي يدل على الحدوث والخروج إلى الوجود."
    - lemma: "تَخَلُّق"
      generation_method: ishtiqaq
      justification: "مصدر يستخدم في السياقات البيولوجية والجيولوجية للدلالة على التشكل والتكون."
    - lemma: "نُشُوء"
      generation_method: ishtiqaq
      justification: "مصدر يدل على الابتداء والظهور والتدرج في التكون."

stage2_evidence:
  per_lemma:
    - lemma: "تَشَكُّل"
      confirm:
        - text: "«الشيءُ: تَصَوَّر وتَمثَّلَ (مطاوعُ شَكَّلَهُ) تَشَكَّلَ الجنينُ فى بَطْنِ أُمِّهِ»"
          source: "المعجم الكبير"
        - text: "«تَشَكُّل: formation»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
    - lemma: "تَكَوُّن"
      confirm:
        - text: "«الشىءُ: حدث. يقال: كَوَّنه فتكوَّن»"
          source: "المعجم الوسيط"
        - text: "«تَكَوُّن: genesis»"
          source: "المعجم الطبي الموحد"
    - lemma: "تَخَلُّق"
      confirm:
        - text: "«(فى الجيولوجيا) diagenesis: تكوُّنُ معادِنَ جديدةٍ فِى الصُّخور بعد تَصلُّبِها...»"
          source: "المعجم الكبير"
    - lemma: "نُشُوء"
      confirm:
        - text: "«نشوء: genesis»"
          source: "مسرد الجغرافيا والتاريخ"

stage3_analysis:
  per_lemma:
    - lemma: "تشكّل"
      decision: confirmed
      decision_reason: "مصدر دقيق وشائع للدلالة على العملية الطبيعية التي يتخذ فيها الشيء شكلاً وتكويناً، وله شواهد معجمية علمية ولغوية قوية تثبته كترجمة لـ formation."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشَكُّل"
    - lemma: "تكوّن"
      decision: confirmed
      decision_reason: "مصدر فصيح يعبر عن الحدوث والظهور للوجود، ويشيع استخدامه في السياقات العلمية مرادفاً للتشكل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَوُّن"
    - lemma: "تَخَلُّق"
      source: stage1
      decision: removed
      decision_reason: "يغلب استخدامه في سياقات متخصصة جداً كالبيولوجيا (تخلق الجنين) ولا يغطي العمومية المطلوبة في هذه المجموعة الترادفية."
    - lemma: "نُشُوء"
      source: stage1
      decision: removed
      decision_reason: "يتقاطع مع مفهوم (التكون) ولكنه يركز أكثر على التطور والارتقاء، لذا يُفضل الاكتفاء باللمتين الموجودتين الدقيقتين."

stage4_content:
  definition:
    current: "عملية طبيعية تتسبب في تشكل شيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على دوران لاستخدامه كلمة (تشكل) التي تمثل إحدى اللمات، ويجب صياغة تعريف مصطلحي دقيق ومستقل."
    authored:
      - type: terminological
        text: "عملية طبيعية ينجم عنها خروج الشيء إلى الوجود أو اتخاذه بنية وهيئة محددة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13504691-n"
