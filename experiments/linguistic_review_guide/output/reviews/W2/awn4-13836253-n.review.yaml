# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13836253-n
# motherhood / maternity — أُمُومَة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (أُمُومَة)، وقد يكون من المفيد إثراؤها بمرادفات أو ألفاظ قريبة"
    observations: >
      المفهوم واضح ومحدّد: علاقة القرابة بين الولد وأمّه. هو مفهوم أصيل في الثقافة العربية وله
      مقابل طبيعي مباشر. التعريف العربي الحالي مقبول ويصف العلاقة بدقة. المصطلح أُمُومَة مشتق
      من «أُمّ» على وزن فُعُولَة الدالّ على الصفة أو الحالة، وهو مصطلح راسخ في المعجمية العربية.
  blind_candidates:
    - lemma: "أُمُومَة"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فُعُولَة من «أُمّ»، يدلّ على حالة كون المرأة أمًّا وعلاقتها بنسلها.
        وزن فُعُولَة منتج للدلالة على الصفات والحالات (كالأُبُوَّة والبُنُوَّة والعُمُومَة).
    - lemma: "وَالِدِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «والِدة» بإضافة ياء النسبة وتاء التأنيث، يدلّ على علاقة الوالدة بمولودها.
        لكنّه قد يشمل الأبوّة أيضاً فيكون أعمّ من المطلوب.
    - lemma: "قَرَابَةٌ أُمِّيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من «قرابة» + «أُمِّيَّة» (نسبة إلى الأمّ)، يصف علاقة القرابة من جهة الأمّ تحديداً.
        غير أنّه تعبير وصفي حرّ وليس مصطلحاً مسكوكاً.
    - lemma: "نَسَبُ الأُمِّ"
      generation_method: tarkib
      justification: >
        مركب إضافي يدلّ على النسب من جهة الأمّ. غير أنّ «النسب» أعمّ من «القرابة» المقصودة
        في التعريف، وليس مصطلحاً ثابتاً في هذا المعنى المحدّد.

stage2_evidence:
  per_lemma:
    - lemma: "أُمُومَة"
      confirm:
        - text: "«نظام الأمومة: نظام تعلو فيه مكانة الأم على مكانة الأب في الحكم, ويُرجع فيه إلى الأم في النسب أو الوراثة. (مج)»"
          source: "المعجم الوسيط"
        - text: "«نظام الأمومة (Matriarcat) : نظام أُسرىّ تعتمد فيه القرابة على الأم وحدها وتعتبر رأس الأسرة , وبها يلحق الأبناء دون الأب»"
          source: "المعجم الكبير"
        - text: "«(1) الأُمومة (2) جماعة الأمّهات.»"
          source: "المورد الحديث (ترجمة motherhood)"
        - text: "«(1) «أ» أُمومة. «ب» حنان؛ عطف (2) دار التوليد (3) حَمْليّ (4) وِلاديّ»"
          source: "المورد الحديث (ترجمة maternity)"
        - text: "«أمومة — maternity»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«أُمُومَة — maternity»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«ما كنتِ أمًّا ولقد أممتِ أُمُومَةً. وفلانة تؤمّ فلاناً، أي: تغذوه، أي: تكون له أمًّا تغذوه وتربّيه»"
          source: "مقاييس اللغة لابن فارس (نقلاً عن أبي عبيدة)"
          addition: "يؤكّد أنّ أُمُومَة مصدر من أَمَّ بمعنى صار أمًّا، ويضيف بُعد التغذية والتربية"
    - lemma: "وَالِدِيَّة"
      confirm:
        - text: "«وَالِدِيَّة — parenthood»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«وَالِدِيَّة — parenthood»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المصطلح يعني الأبوّة والأمومة معاً (parenthood) لا الأمومة وحدها (motherhood/maternity)"
    - lemma: "قَرَابَةٌ أُمِّيَّة"
      evidence_status: "no_material_found"
    - lemma: "نَسَبُ الأُمِّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أُمُومَة"
      decision: confirmed
      decision_reason: >
        لمّة راسخة في المعاجم العربية الكلاسيكية والحديثة. مصدر على وزن فُعُولَة من «أُمّ»
        يدلّ على حالة الأمومة وعلاقة القرابة بين الأمّ ونسلها. أكّدتها أدلّة المعجم الوسيط
        والمعجم الكبير ومقاييس اللغة والمعاجم المصطلحية المتخصصة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُمُومَة"
    - lemma: "وَالِدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح يقابل «parenthood» في المعجم الطبي الموحد، وهو أعمّ من المطلوب إذ يشمل
        الأبوّة والأمومة معاً. المجموعة الترادفية مخصّصة لعلاقة الأمّ بنسلها فحسب.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "قَرَابَةٌ أُمِّيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ وليس مصطلحاً مسكوكاً. يمكن إبدال «أُمِّيَّة» بـ«من جهة الأمّ» دون تغيّر
        المعنى (فشل اختبار السكّ). لم تُسجَّل له شواهد معجمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
    - lemma: "نَسَبُ الأُمِّ"
      source: stage1
      decision: removed
      decision_reason: >
        مركب إضافي وصفي غير ثابت معجمياً. «النسب» يدلّ على السلالة والانتماء لا على
        علاقة القرابة المحدّدة بين الولد والأمّ. لم تُسجَّل له شواهد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

stage4_content:
  definition:
    current: "علاقة القرابة بين النسل والأم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في جوهره لكنّه يفتقر إلى الجنس القريب الدقيق ويستخدم «النسل»
        وهو لفظ يدلّ على الذرّية جماعةً، والأدقّ «الولد» أو «المولود». كما ينبغي
        ربطه بالجنس الأعلى (علاقة أُسريّة) لتوضيح موقعه في الشبكة الدلالية.
