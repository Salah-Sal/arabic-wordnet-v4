# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (بساطة) مكتوبة بلا تشكيل في بيانات المجموعة."
      - "التعريف الحالي فيه قرب دوراني: استعمل (بسيطاً) المشتق من الجذر ذاته (بسط)."
      - "المجموعة تضم لمّةً واحدةً بينما النظير الإنجليزي يملك لمّتَيْن (simplicity + simpleness)؛ يُشير إلى احتمال وجود فجوة."
    observations: "المجموعة تمثّل مفهوماً فلسفياً/منطقياً راسخاً في الموروث العربي؛ وثّقه الجرجاني والمناوي في معجمَيهما التعريفيَّيْن بتصنيف ثلاثي دقيق (حقيقي / عرفي / إضافي). جذر (ب س ط) وفير الاشتقاق في المعجمية العربية، وبساطة هي المصدر الطبيعي على وزن فَعَالَة من بَسُطَ. الفقرة الفوقية (جَوْدَة / نَوْعِيَّة) وجيهة منطقياً."
  blind_candidates:
    - lemma: "الأَحَادِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (أحادي) على وزن (فُعَالِيَّة) يعبّر عن كون الشيء وحدةً لا تتعدد أجزاؤه؛ يلتقي مع معنى (غير مركب) من الجانب الكمّي."
    - lemma: "السَّذَاجَة"
      generation_method: majaz
      justification: "لفظ عربي قديم فصيح يفيد السلامة وعدم التعقيد؛ أجازه مجمع اللغة المصري واشتقّه العجاج (تسذّج). ربط المجاز: المعنى الأصلي (الخلو من الزخرفة) يشاطر المفهوم المقصود في الخلو من التركيب."
    - lemma: "الإِفْرَادِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (مفرد / إفراد) على وزن (إِفْعَالِيَّة)؛ يعبّر عن كون الشيء مفرداً غير متركب من عناصر متعددة، بالتمييز عن المركّب."
    - lemma: "اللاَّتَرْكِيبِيَّة"
      generation_method: ishtiqaq
      justification: "مصطلح مسكوك بالنفي (لا-) + المصدر الصناعي من (تركيبي)؛ يصف مباشرةً الخاصية الجوهرية للمفهوم وهي انتفاء التركيب، على غرار مصطلحات اللغويات الحديثة."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بساطة"
      confirm:
        - text: "«بَسَاطَة: خلاف التَّركيب والتَّعقيد»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«بسُط الشَّيءُ: خلا من التّعقيد، أي صار سهلاً يسيرًا»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«البسيط: ثلاثة أقسام: بسيط حقيقي، وهو ما لا جزء له أصلًا؛ كالبارئ تعالى، وعرفي؛ وهو ما لا يكون مركبًا من الأجسام المختلفة الطبائع، وإضافي؛ وهو ما تكون أجزاؤه أقل بالنسبة إلى الآخر»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413م)"
        - text: "«البسيط: ثلاثة: بسيط حقيقي وهو ما لا جزء له كالباري تقدس. وعرفي وهو ما لا يتركب من أجزاء مختلفة الطبائع. وإضافي وهو ما أجزاؤه أقل بالنسبة للآخر»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«بَسَاطَة: مقياس يتيح، خلال تقييم الأنحاء المتنافسة، اختيار النحو الذي له أقل عدد من القواعد التي يمكنها أن ترصد أكبر قدر من الوقائع الممكنة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«بساطة: تشير إلى الاختزال والاقتصاد بوصفهما مقياسين بالإضافة إلى 'الانسجام' و'الشمولية'»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«بساطة: درجةُ وضوحِ وسهولةِ فَهْمِ التصميم والتنجيز implementation، لنظامٍ أو مكوِّن»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«بَسِيط — ضد المركب، وما لا تعقيد فيه»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت 2003م)"
      expands:
        - text: "«(1) بساطة (2) سذاجة (3) حماقة (4) وضوح»"
          source: "المورد الحديث (2008) — ترجمة simplicity"
          addition: "يُبيّن المورد الحديث أن simplicity يُترجم بطيف عربي يشمل البساطة والسذاجة والوضوح، مما يعكس اتساع الحقل الدلالي للمفهوم في الإنجليزية مقارنةً بالعربية."

    - lemma: "الأَحَادِيَّة"
      contradicts:
        - text: "«أحادية: monism — Water Engineering»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "الأحادية في المصادر المتاحة تُستخدم بمعنى (المذهب الأحادي / monism) في الفلسفة، أي القول بأن الوجود جوهر واحد؛ وهو مفهوم مغاير تماماً لصفة الخلو من التركيب."

    - lemma: "السَّذَاجَة"
      confirm:
        - text: "«سذاجة — المعنى: ببساطته وافتقاره إلى الحُنكة — الصواب والرتبة: [صحيحة] — التعليق: يمكن تصحيح هذا المثال بناء على ما أقره مجمع اللغة المصري من جواز الاشتقاق من الجامد، وقد أجاز الأساسي استعمال هذه الكلمة، بينما أهملها الوسيط»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت 2003م)"
      contradicts:
        - text: "«(1) بساطة (2) سذاجة (3) حماقة (4) وضوح»"
          source: "المورد الحديث (2008)"
          conflict: "المورد الحديث يقرن السذاجة بالحماقة في ترجمة simplicity؛ مما يكشف أن السذاجة تحمل دلالةً سالبة (انعدام الحنكة / الغفلة) تتعارض مع المعنى الفلسفي المحايد للخلو من التركيب."

    - lemma: "الإِفْرَادِيَّة"
      contradicts:
        - text: "«إفرادية: Singularity — سمة مميزة في مقولة العدد تشير إلى تمثيل وحدة قابلة للعزل»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "الإفرادية في المعجم مصطلح لساني يخص قواعد العدد (الإفراد ضد الجمع)، لا صفة الخلو من التركيب الوجودي أو المنطقي."

    - lemma: "اللاَّتَرْكِيبِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
