# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10599128-n  |  ILI: i92876
# المفهوم: sentimentalist / romanticist
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # ب. التقييم الأولي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "المركّب 'عَاطِفِيّ مُفْرِط' تعبيرٌ وصفي يُثار حوله تساؤل التثبيت المعجمي: إذ يمكن إبدال 'مفرط' بـ'شديد' أو 'بالغ' وتبقى الجملة وصفاً صالحاً؛ غير أنه مستعمل استعمالاً اصطلاحياً في الكتابة النفسية والتربوية الحديثة"
      - "اللمّة 'وِجْدَانِيّ' صفةٌ نسبية أصيلة (adjective) لا اسمٌ يدلّ على شخص بعينه؛ المورد الحديث يُقدّمها ترجمةً للصفة sentimental لا للاسم sentimentalist"
      - "غياب مقابل عربي مُفرد راسخ يدلّ على الشخص المفرط في عاطفته — المعاجم تُوثّق 'العاطفيّ' لـsentimentalist دون إضافة 'مفرط'"
      - "التعريف 'ينغمس في العاطفة المفرطة' غير دقيق صياغياً: الإفراط يصف الانغماس لا العاطفة ذاتها؛ كما يفتقر إلى الجنس القريب الكافي"
    observations: "المجموعة تضمّ لمّتَين إنجليزيتين: sentimentalist (المفرط في عاطفته نفسياً) و romanticist (المتبنّي للمذهب الرومانسي أدبياً)؛ وهما مفهومان متداخلان في WordNet لكنهما متمايزان في التقليد النقدي. في العربية، يُعبَّر عنهما بألفاظ متعددة أبرزها 'العاطفيّ' (وهو المُثبَت في المورد الحديث لـsentimentalist) و'رومانسيّ/رومانتيكيّ' (لـromanticist). اللمّة 'وجداني' أوسع دلالةً من المقصود إذ تُترجم affective في مسارد اليونسكو."

  # أ. اللمّات المرشحة (توليد أعمى من التعريف فقط — بدون لمّات)
  blind_candidates:
    - lemma: "الطَّرُوب"
      generation_method: majaz
      justification: "لفظ تراثي من جذر 'طرب' يصف من تُسرع إليه الهزّة العاطفية ويشتدّ تأثّره الوجداني؛ إحياء بمجاز يُوسّع الدلالة من الانفعال الموسيقي إلى الانفعال العاطفي المفرط عموماً"
    - lemma: "الوَجُود"
      generation_method: ishtiqaq
      justification: "صيغة فَعُول للمبالغة من جذر 'وجد' (الحبّ الشديد والحزن والوجدان) — يصف مَن اشتدَّ وجدُه وكثُر تأثُّره بمشاعره على نحو مفرط"
    - lemma: "مُفِيض الوِجْدَان"
      generation_method: tarkib
      justification: "تركيب إضافي يعني الذي يُفيض وجدانَه ومشاعره في كل موقف؛ مأخوذ من 'أفاض في الحديث' بمعنى استرسل مُبالِغاً؛ مُكوَّن من ركيزتين عربيتين أصيلتين"
    - lemma: "رُومَانْسِيّ"
      generation_method: taarib
      justification: "تعريب من romanticist/romantic للدلالة على الشخص المستغرق في مشاعره وأحلامه العاطفية؛ مُثبَت في معجمات المصطلحات العربية الحديثة؛ ملاذٌ أخير بعد استنفاد البدائل الاشتقاقية"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    # — اللمّات الموجودة —

    - lemma: "عَاطِفِيّ مُفْرِط"
      confirm:
        - text: "«العاطفيّ: الشديد التأثّر بالعاطفة.»"
          source: "المورد الحديث (2008) — ترجمة sentimentalist"
        - text: "«(1) وِجدانيّ sentimental poetry (2) عاطفيّ both for sentimental and realistic reasons (3) حسّاس؛ رقيق العاطفة a sentimental girl.»"
          source: "المورد الحديث (2008) — ترجمة sentimental"
      expands:
        - text: "«الْعَيْنُ وَالطَّاءُ وَالْفَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى انْثِنَاءٍ وَعِيَاجٍ … وَتَعَطَّفَ بِالرَّحْمَةِ تَعَطُّفًا. وَعَطَفَ اللَّهُ تَعَالَى فُلَانًا عَلَى فُلَانٍ عَطْفًا.»"
          source: "مقاييس اللغة لابن فارس — مادة عطف"
          addition: "يؤكد أصالة جذر 'عطف' الدالّ على الميل والانعطاف والرحمة، مما يُسبغ شرعيةً تراثية على 'عاطفي'"
        - text: "«الْفَاءُ وَالرَّاءُ وَالطَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِزَالَةِ شَيْءٍ مِنْ مَكَانِهِ وَتَنْحِيَتِهِ عَنْهُ … يُقَالُ أَفْرَطَ، إِذَا تَجَاوَزَ الْحَدَّ فِي الْأَمْرِ. يَقُولُونَ: إِيَّاكَ وَالْفَرَطُ، أَيْ لَا تُجَاوِزِ الْقَدْرَ.»"
          source: "مقاييس اللغة لابن فارس — مادة فرط"
          addition: "يؤكد أصالة 'أفرط' بمعنى تجاوَز الحدَّ — يُضفي وزناً تأصيلياً على 'مفرط' في المركَّب"

    - lemma: "وِجْدَانِيّ"
      confirm:
        - text: "«(1) وِجدانيّ sentimental poetry (2) عاطفيّ both for sentimental and realistic reasons (3) حسّاس؛ رقيق العاطفة a sentimental girl.»"
          source: "المورد الحديث (2008) — ترجمة sentimental (الصفة)"
        - text: "«وجداني، عاطفيّ: يشير الاصطلاح إلى حالة استعداد روحي يرادف الإحساس والانفعال، وهو يترجم شحنة حافزية تتطلع إلى حرية روحية وتوازن نفسي»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ترجمة affective"
      contradicts:
        - text: "«العاطفيّ: الشديد التأثّر بالعاطفة.»"
          source: "المورد الحديث (2008) — ترجمة sentimentalist (الاسم)"
          conflict: "المورد يُترجم 'sentimentalist' (الاسم) بـ'العاطفيّ'، لا بـ'وجداني' — يُشير إلى أن 'وجداني' مقابل الصفة sentimental لا مقابل اسم الشخص sentimentalist"
        - text: "«وجداني: [ترجمة] affective»"
          source: "مسرد التربية، أليكسو (ALECSO)"
          conflict: "دلالة 'affective' أوسع من 'sentimentalist' ولا تتضمّن مفهوم الإفراط المطلوب في هذه المجموعة"

    # — مرشحات المرحلة ١ —

    - lemma: "الطَّرُوب"
      confirm:
        - text: "«السريع الهزَّة والتأثر بما يُطرِب»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (OCR)"
        - text: "«(الطروب) السَّرِيع الهزة والتأثر بِمَا يطرب (ج) طراب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
      contradicts:
        - text: "«الطَّرَبَ خِفَّةٌ تُصِيبُ الرَّجُلَ مِنْ شِدَّةِ سُرُورٍ أَوْ غَيْرِهِ … وَالْكَرِيمُ طَرُوبٌ»"
          source: "مقاييس اللغة لابن فارس — مادة طرب"
          conflict: "الطرب في أصله خفّة من الفرح والإيقاع الموسيقي؛ دلالته مختصّة بالانفعال بالطرب والغناء وليس بالاسترسال في العاطفة الوجدانية المفرطة عموماً"

    - lemma: "الوَجُود"
      evidence_status: "no_material_found"

    - lemma: "مُفِيض الوِجْدَان"
      evidence_status: "no_material_found"

    - lemma: "رُومَانْسِيّ"
      confirm:
        - text: "«رومانسيّ: مذهب أدبي جاء كرد فعل على الكلاسيكية، وهو نزعة ذاتية توظف الأنا في تقصي عوالم الحلم.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ترجمة romantic"
        - text: "«الرومانتيكيّ: المؤيد للرومانتيكيّة.»"
          source: "المورد الحديث (2008) — ترجمة romanticist"
        - text: "«(4) شخص رومانتيكيّ»"
          source: "المورد الحديث (2008) — ترجمة romantic (الاسم)"
      expands:
        - text: "«رُومَانْسِيّ — الرأي: مرفوضة عند الأكثرين … الصواب والرتبة: المذهب الابتداعيّ أحد المذاهب الأدبية الحديثة [فصيحة] — المذهب الرومانسيّ [صحيحة]. وردت كلمة 'رومانسية' في المعجم الأساسي بمعنى العودة إلى الطبيعة وإيثار الحسّ والعاطفة على العقل والمنطق»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "اللفظ مقبول في الاستعمال (صحيح) وإن كان معجم الصواب يُفضّل 'ابتداعيّ' عليه في السياق الأدبي"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "عَاطِفِيّ مُفْرِط"
      decision: confirmed
      decision_reason: "المورد الحديث يُثبت 'العاطفيّ' مقابلاً مباشراً لـsentimentalist. إضافة 'مفرط' تُقيّد دلالة 'عاطفي' العامة وتخصّصها بالإفراط المطلوب في هذا المفهوم؛ وهو مُركَّب وصفي (wasfi) مستعمل في الكتابة النفسية والتربوية المعاصرة. وإن كان اختبار الإبدال يُظهر إمكانية استبدال 'مفرط' بـ'شديد'، فإن 'مفرط' هي الصيغة الأكثر دوراناً في هذا السياق الاصطلاحي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُصرّح بالإفراط الكمّي في العاطفة ويُبرز التجاوز عن الحدّ المعهود — يختلف عن 'الحسّاس' (المتأثّر دون إفراط بالضرورة) وعن 'الرومانسيّ' (الذي يرتبط بالمذهب الرومانسي الأدبي)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَاطِفِيٌّ مُفْرِط"

    - lemma: "وِجْدَانِيّ"
      decision: removed
      decision_reason: "صفة نسبية مشتقة من 'وجدان' تدلّ على ما كان ذا طابع وجداني عاطفي؛ المعاجم الحديثة تُوثّقها ترجمةً للصفة 'sentimental' و'affective' لا للاسم 'sentimentalist'. يُؤكّد المورد الحديث هذا التمييز بجعله 'العاطفيّ' — لا 'الوجداني' — مقابل sentimentalist. كذلك تفتقر دلالتها إلى مفهوم الإفراط المحدَّد في التعريف، إذ هي أوسع مما تُمثّله المجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──

    - lemma: "الطَّرُوب"
      source: stage1
      decision: removed
      decision_reason: "لفظ أصيل يدلّ في المعاجم على 'السريع الهزّة والتأثّر بما يُطرِب' — أي الانفعال بالموسيقى والغناء والإيقاع. هذا المجال الدلالي (الإثارة الموسيقية) مختلف جوهرياً عن الاستغراق في العاطفة المفرطة (sentimentality) بمعناها النفسي العام، وأصل 'الطرب' في مقاييس اللغة يُفيد الخفّة من الفرح لا المبالغة في الوجدان."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "الوَجُود"
      source: stage1
      decision: removed
      decision_reason: "لم يَرِد في أي معجم بمعنى الشخص المفرط في وجده أو عاطفته؛ جذر 'وجد' في مقاييس اللغة يدلّ على الإلفاء والعثور ('الشيء يُلفيه') لا على الشخصية العاطفية. الاشتقاق على فَعُول نظريٌّ غير مُثبَّت معجمياً لهذا المعنى."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُفِيض الوِجْدَان"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حرّ لم يَرِد مُثبَّتاً كوحدة معجمية في أي مصدر؛ يفشل اختبار السكّ إذ يمكن استبدال 'الوجدان' بـ'المشاعر' أو 'العواطف' دون أن يفسد المعنى الوصفي، مما يُثبت أنه عبارة تعريفية لا مصطلح مُسكَّك."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "رُومَانْسِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "المجموعة تضمّ 'romanticist' ضمن لمّاتها الإنجليزية (OEWN lemmas)، والمورد الحديث يُترجم romanticist صراحةً بـ'الرومانتيكيّ: المؤيد للرومانتيكيّة' و'شخص رومانتيكيّ'. اللفظ موثَّق في المعجم الموحد لمصطلحات اللسانيات ومعجم الصواب (مُصنَّف صحيح الاستعمال). تعريبٌ مقبول يُمثّل الوجه الأدبي/الرومانسي للمفهوم مقابل الوجه النفسي الذي تُمثّله 'عَاطِفِيٌّ مُفرِط'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الانتماء إلى الروح الرومانسية وتغليب الخيال والعاطفة على العقل في السياق الأدبي والفكري — يختلف عن 'عاطفي مفرط' الذي يُبرز المبالغة العاطفية الشخصية في المواقف الحياتية"
      actions:
        - command: create_entry
          params:
            lemma: "رُومَانْسِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10599128-n"


