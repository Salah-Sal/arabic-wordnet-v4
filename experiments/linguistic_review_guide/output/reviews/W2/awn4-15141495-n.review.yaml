stage1_review:
  assessment:
    concerns:
      - "اللّمات الموجودة تفتقر إلى التشكيل الكامل."
      - "نقص مصطلح 'التوقيت القياسي' الذي يمثل 'standard time' بدقة."
    observations: "المجموعة تغطي مفاهيم الوقت الرسمي والمدني والمحلي. اللمات المقترحة في AWN حالياً صحيحة دلالياً لكنها تحتاج إلى ضبط وإثراء بمترادفات تقنية مستخدمة في المعاجم المتخصصة."
  blind_candidates:
    - lemma: "تَوْقِيتٌ مَحَلِّيّ"
      generation_method: tarkib
      justification: "الترجمة المباشرة لـ local time، وهو المصطلح الأكثر شيوعاً."
    - lemma: "تَوْقِيتٌ قِيَاسِيّ"
      generation_method: tarkib
      justification: "الترجمة الاصطلاحية لـ standard time، مستخدم في الملاحة والجغرافيا."
    - lemma: "تَوْقِيتٌ مَدَنِيّ"
      generation_method: tarkib
      justification: "الترجمة الاصطلاحية لـ civil time، يشير إلى التوقيت المعتمد للاستخدام العام."
    - lemma: "تَوْقِيتُ المِنْطَقَة"
      generation_method: tarkib
      justification: "يشير إلى نظام التوقيت الخاص بنطاق جغرافي (Time Zone)."

stage2_evidence:
  per_lemma:
    - lemma: "توقيت محلي"
      confirm:
        - text: "«توقيت محلي: local time»"
          source: "مسرد ArabTerm (الجغرافيا والتاريخ)"
        - text: "«التوقيت المحلِّي [لبلدٍ من البلدان]: local time»"
          source: "المورد الحديث"
    - lemma: "توقيت مدني"
      confirm:
        - text: "«التوقيت المدني المعياري: التوقيت الشمسي الوسطي المعتمد على مرور الشمس فوق خط طول معيّن... والمستخدم في منطقة واسعة»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد"
    - lemma: "تَوْقِيتٌ قِيَاسِيّ"
      confirm:
        - text: "«التوقيت القياسيّ: الوقت المعتَمَد رسميًا في منطقة أو بلد. نظام للتوقيت تُقسَّم فيه الأرض على أساس النِّطاق الطولي والدّرَجة.»"
          source: "المورد الحديث"
        - text: "«زمن قياسى: standard time»"
          source: "موسوعة الكهرباء (IEC 60050)"
    - lemma: "تَوْقِيتٌ رَسْمِيّ"
      confirm:
        - text: "«توقيت رسمي: official time»"
          source: "مسرد ArabTerm (الفن والتسلية)"

