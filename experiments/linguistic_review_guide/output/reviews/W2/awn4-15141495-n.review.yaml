stage4_content:
  definition:
    current: "الوقت الرسمي في منطقة محلية (معدل حسب الموقع حول الأرض)؛ يحدد بالقانون أو العرف"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية نوعاً ما، الأفضل صياغته بأسلوب معجمي يوضح كونه نظاماً قانونياً وتقنياً."
    authored:
      - type: terminological
        text: "نظامُ تَوْقِيتٍ مُعتَمَدٍ رَسْمِيًّا فِي بَلَدٍ أَوْ مِنْطَقَةٍ جُغْرَافِيَّةٍ مُحَدَّدَةٍ، يُحَدَّدُ بِنَاءً عَلَى دَرَجَاتِ الطُّولِ وَيُثَبَّتُ بِقَانُونٍ أَوْ عُرْفٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-15141495-n"
          definition_index: 0
          text: "نظامُ تَوْقِيتٍ مُعتَمَدٍ رَسْمِيًّا فِي بَلَدٍ أَوْ مِنْطَقَةٍ جُغْرَافِيَّةٍ مُحَدَّدَةٍ، يُحَدَّدُ بِنَاءً عَلَى دَرَجَاتِ الطُّولِ وَيُثَبَّتُ بِقَانُونٍ أَوْ عُرْفٍ."
  examples:
    per_lemma:
      - lemma: "تَوْقِيتٌ مَحَلِّيّ"
        examples:
          - text: "تَمَّ ضَبْطُ سَاعَةِ المَطَارِ حَسَبَ التَّوْقِيتِ المَحَلِّيّ لِمَدِينَةِ القَاهِرَةِ."
            type: usage
      - lemma: "تَوْقِيتٌ مَدَنِيّ"
        examples:
          - text: "يَعْتَمِدُ العَالَمُ التَّوْقِيتَ المَدَنِيَّ الذِي يَبْدَأُ عِنْدَ مُنْتَصَفِ اللَّيْلِ."
            type: usage
      - lemma: "تَوْقِيتٌ قِيَاسِيّ"
        examples:
          - text: "يُعَدُّ تَوْقِيتُ غِرِينِيتْش هُوَ التَّوْقِيتَ القِيَاسِيَّ المَرْجِعِيَّ لِجَمِيعِ المَنَاطِقِ الزَّمَنِيَّةِ."
            type: usage
      - lemma: "تَوْقِيتٌ رَسْمِيّ"
        examples:
          - text: "أَعْلَنَتْ الدَّوْلَةُ العَوْدَةَ إِلَى التَّوْقِيتِ الرَّسْمِيِّ بَعْدَ انْتِهَاءِ فَتْرَةِ التَّوْقِيتِ الصَّيْفِيِّ."
