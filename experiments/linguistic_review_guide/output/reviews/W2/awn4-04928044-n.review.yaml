      reason: >
        التعريف الحالي صحيح لكنه مُقتَضَب جداً: يفتقر إلى الجنس القريب
        (ما الذي تنتمي إليه؟)، وإلى الفصل النوعي (كيف تنتقل؟ بأي وسيلة؟).
        ولا يُميّزه عن مفهوم «صفة موروثة» المفردة.
    authored:
      - type: terminological
        text: >
          خاصِّيَّةٌ بيولوجيَّةٌ مشتركةٌ بين أفراد النوع، تشملُ مجموعَ السِّمَاتِ
          والصِّفَاتِ المنقولةِ من الأسلافِ إلى الأنسالِ عبرَ الجيناتِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مجموعُ الصِّفَاتِ والسِّمَاتِ البيولوجيَّةِ التي تحملُها الكائناتُ الحيَّةُ
          في شيفرتِها الجينيَّةِ مورَّثةً من الوالدَيْنِ، وهي ما تُحَدِّدُ ملامحَ
          البنيةِ الجسديَّةِ والاستعداداتِ الفِطريَّةِ للفردِ
        quality_check:
