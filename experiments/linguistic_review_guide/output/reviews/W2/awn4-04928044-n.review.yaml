# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04928044-n  |  ili: i62842
# المعنى: مجموع الصفات الموروثة / heredity, genetic endowment
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «إرث جيني» غير مُثبَّتة في أي معجم متخصص كوحدة معجمية مسكوكة، وهي تركيب وصفي حر"
      - "اللمّة «وراثة» مكتوبة بلا تشكيل، ويجب تحديدها إلى «وِرَاثَة»"
      - "التعريف الحالي «مجموع الصفات الموروثة» صحيح لكنه مُقتَضَب ويفتقر إلى الفصل النوعي البيولوجي"
    observations: >
      المجموعة تعبّر عن مفهوم الوراثة بمعنى «مجموع الصفات الموروثة» (genetic endowment)،
      وهو وجه دلالي مختلف عن «علم الوراثة» (heredity كعلم). اللمّة «وراثة» راسخة
      في المعجمية العربية المتخصصة وتؤدي المعنيين معاً. أما «إرث جيني» فهو تعبير
      تركيبي مُحدَث لا سند له في المعاجم الموثوقة، وإن كان مقبول الصياغة لغوياً
      فإنه لم يُسكَّ بعدُ مصطلحاً ثابتاً.

  blind_candidates:
    - lemma: "وِرَاثَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر (و-ر-ث) على وزن «وِفَاعَة» القياسي الدال على المصدر النوعي
        للأفعال المتعلقة بالنقل والتحوّل؛ يُعبِّر عن المجموع المنتقَل من الأسلاف.
    - lemma: "تَوَارُث"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر (و-ر-ث) على وزن «تَفَاعُل» الدال على الاشتراك والتبادل؛
        يُبرز الجانب التسلسلي لانتقال الصفات بين الأجيال.
    - lemma: "الْمَوْرُوثُ الجِينِيّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي (اسم مفعول + نسبة) يعبّر عن «ما هو موروث بيولوجياً»؛ يُركّز
        على المحتوى الموروث (genetic endowment) لا على العملية أو العلم.
    - lemma: "الْجِبِلَّة"
      generation_method: majaz
      justification: >
        إحياء للفظ عربي كلاسيكي بمعنى «الخِلْقة والطبيعة الفطرية»؛ إزاحة دلالية
        نحو «الصفات المفطورة في الكائن الحي بفعل الوراثة».


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "وراثة"
      confirm:
        - text: >
            «الوراثة: «أ» انتقال الصفات بالوراثة. «ب» مجموع الصفات الموروثة.»
          source: "المورد الحديث (2008) — ARABTERM"
        - text: >
            «(علم الوراثة): العلم الذى يبحث فى انتقال صفات الكائن الحىّ من جيلٍ
            إلى آخر, وتفسير الظواهر المتعلقة بطريقة هذا الانتقال»
          source: "المعجم الوسيط — OCR"
        - text: >
            «انتقال الصفات المتميزة للفرد من جيل إلى جيل»
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM، translation_en: heredity"
        - text: >
            «انتقال القدرة على إنتاج خصائص أو صفات مطابقة من جيل إلى آخر.»
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ARABTERM، translation_en: heredity"
        - text: >
            «(الوراثة) (علم الوراثة) الْعلم الَّذِي يبْحَث فِي انْتِقَال صِفَات
            الْكَائِن الْحَيّ من جيل إِلَى آخر وَتَفْسِير الظَّوَاهِر الْمُتَعَلّقَة
            بطريقة هَذَا الِانْتِقَال (مج)»
          source: "المعجم الوسيط (Hawramani، مجمع اللغة العربية)"
      expands:
        - text: >
            «وراثة، توارُث» = «انتقال المعلومات الوراثية من الآباء والأجداد إلى النسل.»
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ARABTERM، translation_en: inheritance"
          addition: "يُثبِت وراثة وتوارث كمترادفَين في المصطلحية الوراثية العربية"
        - text: >
            «وراثة» — translation_en: heredity — domain: Sociology and Anthropology
          source: "مسرد علم الاجتماع والأنثروبولوجيا — ARABTERM"
          addition: "الاستخدام ممتد عبر مجالات: الأحياء، الوراثة، الصحة، الطب البيطري، الفلسفة، علم الاجتماع"

    - lemma: "إرث جيني"
      evidence_status: "no_material_found"

    # ── مرشحات المرحلة ١ ──

    - lemma: "وِرَاثَة"
      confirm:
        - text: >
            «(علم الوراثة): العلم الذى يبحث فى انتقال صفات الكائن الحىّ من جيلٍ
            إلى آخر» — المدخل المُشكَّل: الوِرَاثَةُ
          source: "المعجم الوسيط — OCR (entry_id: 32859)"
        - text: >
            «الوراثة: «ب» مجموع الصفات الموروثة.»
          source: "المورد الحديث (2008) — ARABTERM (entry_id: 692696)"

    - lemma: "تَوَارُث"
      confirm:
        - text: >
            «وراثة، توارُث» ترجمة: inheritance — مجال: علم الوراثة —
            «انتقال المعلومات الوراثية من الآباء والأجداد إلى النسل.»
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ARABTERM (entry_id: 460942)"
      contradicts:
        - text: >
            «توارث (اقتصاد)» — translation_en: inheritance — domain: AGROVOC
          source: "المَكنَز الزراعي متعدد اللغات — ARABTERM (entry_id: 756824)"
          conflict: >
            الاستخدام الشائع لـ«توارث» في قواعد البيانات يشير إلى الوراثة القانونية/الاقتصادية
            أكثر من الوراثة البيولوجية؛ غموض دلالي في المجال

    - lemma: "الْمَوْرُوثُ الجِينِيّ"
      contradicts:
        - text: >
            «صفة موروثة، خاصية وراثية» = «توريث الصفة للكائن الحيّ من سلفه بواسطة المورثات.»
            translation_en: hereditary character
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ARABTERM (entry_id: 460781)"
          conflict: >
            «المورث» في المصطلحية العلمية العربية يشير إلى الجين الواحد (gene)؛ فـ«المورث الجيني»
            يُقرأ «الجين الجيني» وهو تعبير مكرّر المعنى وغير دقيق للدلالة على المجموع الكلي

    - lemma: "الْجِبِلَّة"
      confirm:
        - text: >
            «الجِبِلَّة: الأصلُ والخِلْقَةُ والطَّبيعةُ»
          source: "المعجم الكبير — OCR (entry_id: 70269)"
        - text: >
            «الجِبِلَّة: الخِلْقة والطبيعة»
          source: "المعجم الوسيط — OCR (entry_id: 3556-3557)"
      contradicts:
        - text: >
            «جِبْلَة» — translation_en: protoplasm — domain: Pharmacy
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — ARABTERM (entry_id: 465128)"
          conflict: >
            المصطلحية العلمية الحديثة خصّصت «جبلة» لمفهوم البروتوبلازم (protoplasm)،
            وهو مختلف تماماً عن «مجموع الصفات الموروثة»
        - text: >
            «جِبْلَة» — translation_en: bioplasm (protoplasm); sarcode (protoplasm)
          source: "المعجم الطبي الموحد (2009) — ARABTERM (entry_ids: 549330, 634168, 642923)"
          conflict: "تأكيد على ارتباط الجبلة بالبروتوبلازم في المعجمية الطبية"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "وراثة"
      decision: confirmed
      decision_reason: >
        اللمّة راسخة في عشرات المعاجم المتخصصة عبر مجالات الأحياء والوراثة والطب والفلسفة
        كمرادف عربي لـheredity، وتؤدي الدلالتين: العملية وعلمها، ومجموع الصفات الموروثة.
        تستوفي معايير الاطّراد والشيوع وإيثار التراثي والاشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الوحيد المؤكَّد في هذه المجموعة؛ يُعبِّر عن مجموع الصفات الموروثة
        بوصفه جملةً ما انتقل من الأسلاف إلى النسل عبر الجينات
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِرَاثَة"

    - lemma: "إرث جيني"
      decision: removed
      decision_reason: >
        مركّب وصفي حر لم يُثبَّت في أي معجم متخصص كوحدة اصطلاحية مسكوكة.
        فشل اختبار التثبيت المعجمي: يمكن إبدال «جيني» بـ«وراثي» وبقي التعبير
        صالحاً وصفاً حراً. فضلاً عن أن «وراثة» تؤدي المعنى ذاته بشكل مُثبَّت.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وِرَاثَة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو الصورة المُشكَّلة للمّة الموجودة «وراثة» المُؤكَّدة أعلاه؛
        الإجراء ينعكس على اللمّة الأصلية عبر update_lemma وليس بإدخال جديد.

    - lemma: "تَوَارُث"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ تَفَاعُلي يدلّ على فعل «التوارث» (عملية التناقل) أكثر من دلالته على
        مجموع الصفات الموروثة (product). الأدلة المعجمية تُدرجه مقرونًا بـ«وراثة»
        على أنه بديل إجرائي، لا مصطلحاً مستقلاً للمفهوم. غموضه الدلالي بين
        الوراثة البيولوجية والاقتصادية يُضعف اعتماده.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "الْمَوْرُوثُ الجِينِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        «المورث» في المصطلحية العلمية العربية يشير إلى الجين الواحد (single gene)؛
        فإضافة «الجيني» إليه تنتج تركيباً مكرّر الدلالة. المفهوم المقصود في
        هذه المجموعة هو «المجموع الكلي» وليس «الجين المفرد»، لذا المرشح
        خطأ في الإحالة المصطلحية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "الْجِبِلَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم قِدَم اللفظ وثراء دلالته الكلاسيكية (الخِلقة والطبيعة)، فإن المعجمية
        العلمية العربية الحديثة خصّصت «جبلة» لمفهوم البروتوبلازم (protoplasm)،
        وهو مفهوم بيولوجي مختلف كلياً. استخدامه في هذه المجموعة سيُفضي إلى
        اشتراك لفظي مُضلِّل في النصوص العلمية.
      evidence_assessment:
        case: mixed


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
