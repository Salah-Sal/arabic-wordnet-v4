# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13779389-n
# المفهوم: المسافة التي تغطيها خطوة (the distance covered by a step)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «خطوة» غير مُشكَّلة، والتشكيل يميّز بين الخَطْوَة (المرّة) والخُطْوَة (المسافة)"
      - "التعريف العربي الحالي دائري: يعرّف «خطوة» بـ«خطوة»"
      - "المجموعة تحتوي لمّة واحدة فقط بينما المقابلات الإنجليزية أربع (footstep, pace, step, stride)"
    observations: "المفهوم هو وحدة قياس عرفية للمسافة مبنية على المشي البشري. في العربية الفصحى، الجذر «خ ط و» هو الجذر المركزي لهذا المفهوم، وقد فرّق المعجم الوسيط والمعجم الكبير بين الخَطْوَة (فعلة واحدة) والخُطْوَة (المسافة بين القدمين). المفهوم أصيل في الثقافة العربية وله تعبير لغوي طبيعي."
  blind_candidates:
    - lemma: "مَخْطًى"
      generation_method: ishtiqaq
      justification: "اسم مكان/مسافة على وزن مَفْعَل من الجذر «خ ط و»، يدلّ على موضع الخَطْو أو مقداره، كما في مَرْمًى ومَسْعًى"
    - lemma: "نَقْلَة"
      generation_method: majaz
      justification: "من الجذر «ن ق ل» بمعنى التحويل والانتقال، تُستعمل مجازاً للمسافة التي يقطعها القدم في حركة واحدة"
    - lemma: "خَطْوٌ"
      generation_method: ishtiqaq
      justification: "مصدر خَطَا يَخْطُو، يدلّ على فعل الخَطْو ذاته وقد يُطلق على مسافته بالتوسّع، كما في أساس البلاغة"
    - lemma: "ذَرْعٌ"
      generation_method: majaz
      justification: "من الجذر «ذ ر ع» بمعنى القياس بالذراع أو بالخَطْو، ذَرَعَ المكان أي قاسه بخُطاه، فيُطلق الذَّرْع على مقدار الخطوة"

stage2_evidence:
  per_lemma:
    - lemma: "خُطْوَة"
      confirm:
        - text: "«مسافة ما بين القدمين عند الخطو»"
          source: "المعجم الوسيط (OCR، entry 7755)"
        - text: "«مَسافَةُ ما بَيْنَ القَدَمَيْنِ عندَ الخَطْوِ فى المَشْى»"
          source: "المعجم الكبير (OCR، entry 83271)"
        - text: "«(الخطوة) مَسَافَة مَا بَين الْقَدَمَيْنِ عِنْد الخطو (ج) خطاء»"
          source: "المعجم الوسيط — حوراماني (entry 872248)"
        - text: "«جاء في التاج: الخُطْوة بالضم، ويفتح أيضًا، مابين القدمين»"
          source: "معجم الصواب اللغوي (entry 852771)"
        - text: "«وَالْخُطْوَةُ: مَا بَيْنَ الرِّجْلَيْنِ. وَالْخَطْوَةُ: الْمَرَّةُ الْوَاحِدَةُ»"
          source: "مقاييس اللغة لابن فارس (خَطُوأَ)"
      expands:
        - text: "«(فى علم الميكانيكا): المَسافَةُ بَين نُقْطَتَيْنِ مُتَشابِهَتَيْن فى سِنَّتَيْنِ مُتَتَالِيَتَيْن فى اللَّوالِب والحَلَزُوناتِ والتّروس»"
          source: "المعجم الكبير (OCR، entry 83270)"
          addition: "دلالة تقنية في الميكانيكا مختلفة عن الدلالة الجسدية"
        - text: "«قَرَّبَ اللهُ عليْكَ الخَطْوَةَ, أى المسافَةَ»"
          source: "المعجم الكبير (OCR، entry 83271)"
          addition: "توسّع دلالي: الخطوة بمعنى المسافة المطلقة"
    - lemma: "مَخْطًى"
      evidence_status: "no_material_found"
    - lemma: "نَقْلَة"
      contradicts:
        - text: "«(النقلَة) يُقَال امْرَأَة نقلة تتْرك وَلَا تخْطب لكبرها»"
          source: "المعجم الوسيط — حوراماني (entry 886157)"
          conflict: "النُّقْلَة بمعنى المرأة التي لا تُخطب، لا علاقة بالمسافة"
        - text: "«(النقلَة) النميمة»"
          source: "المعجم الوسيط — حوراماني (entry 886157)"
          conflict: "النَّقَلَة بمعنى النميمة، لا علاقة بالمسافة"
        - text: "«النقلَة: فِي الْحَرَكَة الأينية»"
          source: "دستور العلماء للأحمدنكري (entry 818016)"
          conflict: "مصطلح فلسفي في الحركة الأينية، ليس مسافة خطوة"
    - lemma: "خَطْوٌ"
      confirm:
        - text: "«(1) أثر القَدَم (2) «أ» خَطْو. «ب» خُطوة.»"
          source: "المورد الحديث (entry 688860) — ترجمة footstep"
        - text: "«يُقَالُ خَطَوْتُ أَخْطُو خُطْوَةً. وَالْخُطْوَةُ: مَا بَيْنَ الرِّجْلَيْنِ»"
          source: "مقاييس اللغة لابن فارس (خَطُوأَ)"
      expands:
        - text: "«خطا خطوة واحدة، وخطوة واسعة، وهو فسيح الخطا، وبعيد الخطا. ومن المجاز: قرب الله عليك الخطوة، فانصرف إلى أهلك، أي المسافة»"
          source: "أساس البلاغة للزمخشري (entry 997355)"
          addition: "الزمخشري يعتبر إطلاق الخطوة على المسافة المطلقة مجازاً"
    - lemma: "ذَرْعٌ"
      contradicts:
        - text: "«(9) «أ» يقيس بالخَطْو. «ب» يَذْرَع المكان جيئةً وذُهوبًا»"
          source: "المورد الحديث (entry 705701) — ترجمة pace"
          conflict: "ذَرَعَ فعل بمعنى قاس بالخطو، لكن الذَّرْع اسم لمقدار الباع أو الطول لا لمسافة الخطوة تحديداً"

stage3_analysis:
  per_lemma:
    - lemma: "خُطْوَة"
      decision: confirmed
      decision_reason: "لمّة أصيلة مؤيَّدة بنصوص المعجم الوسيط والكبير ومقاييس اللغة. الخُطْوَة بالضمّ هي تحديداً «المسافة بين القدمين عند الخطو»، وهي الدلالة المطلوبة في هذه المجموعة. اللمّة الموجودة بدون تشكيل، والتشكيل الصحيح للدلالة المسافية هو خُطْوَة بضمّ الخاء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُطْوَة"
    - lemma: "مَخْطًى"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلّة معجمية على استعمال «مَخْطًى» بمعنى مسافة الخطوة. الصيغة قياسية صرفياً لكنها غير مسكوكة ولا مسجّلة في المعاجم المتاحة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "نَقْلَة"
      source: stage1
      decision: removed
      decision_reason: "الأدلّة المعجمية تناقض هذا الاستخدام: النُّقْلَة والنَّقَلَة في المعاجم تعني النميمة أو المرأة المتروكة أو الحركة الأينية الفلسفية، ولا يوجد شاهد على استعمالها بمعنى مسافة الخطوة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "خَطْوٌ"
      source: stage1
      decision: removed
      decision_reason: "خَطْوٌ مصدر يدلّ على فعل الخطو (الحدث)، بينما المجموعة الترادفية تعني المسافة المقطوعة لا الفعل ذاته. المورد يذكره ترجمةً لـ footstep لكن بمعنى «فعل الخطو» لا «مقدار المسافة». الفرق بين المصدر واسم المرّة/الهيئة جوهري هنا."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "ذَرْعٌ"
      source: stage1
      decision: removed
      decision_reason: "الذَّرْع مقياس مختلف (الباع أو الطول)، وذَرَعَ المكان يعني قاسه بخُطاه وليس الذَّرْع نفسه مسافةَ خطوة واحدة. خلط بين أداة القياس ووحدته."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

