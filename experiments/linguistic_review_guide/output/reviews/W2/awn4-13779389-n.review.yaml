      maqayis_quote: "«الْخَاءُ وَالطَّاءُ وَالْحَرْفُ الْمُعْتَلُّ وَالْمَهْمُوزُ، يَدُلُّ عَلَى تَعَدِّي الشَّيْءِ، وَالذَّهَابِ عَنْهُ. يُقَالُ خَطَوْتُ أَخْطُو خُطْوَةً. وَالْخُطْوَةُ: مَا بَيْنَ الرِّجْلَيْنِ. وَالْخَطْوَةُ: الْمَرَّةُ الْوَاحِدَةُ.»"
