    current: "المسافة التي تغطيها خطوة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري — يعرّف «خطوة» بلفظ «خطوة» نفسه. كما أنه ترجمة حرفية من الإنجليزية. المعاجم العربية تقدّم تعريفاً أدقّ وأوضح."
    authored:
      - type: terminological
        text: "مسافةُ ما بَيْنَ القَدَمَيْنِ عندَ المَشْي"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مِقْدارُ ما يَبْلُغُهُ الماشي بنَقْلِ قَدَمٍ واحِدَة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مسافةُ ما بَيْنَ القَدَمَيْنِ عندَ المَشْي"
  examples:
