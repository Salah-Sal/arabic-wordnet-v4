step0_evidence:
  per_lemma:
    - lemma: "مَثِيل"
      confirm:
        - text: "«المِثْل الفاضل» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«أقرَّ مجمع اللغة المصري قياسيّة صيغة فعيل للدلالة على المشاركة... شبيهه ونظيره» — معجم الصواب اللغوي"
          source: "معجم الصواب اللغوي"
      expands:
        - text: "«عضو أو جزء تشريحي يشبه في بنيته وموضعه ومنشئه عضواً آخر، في حيوان من وحدة تصنيفية أخرى» — معجم المصطلحات الطبية"
          source: "معجم المصطلحات الطبية"
          addition: "التخصص البيولوجي والتشريحي (Homologous)"

    - lemma: "مُجَانِس"
      confirm:
        - text: "«المجانِس: المشاكل، يقال: هذا يجانس هذا، أي: يشاكله» — تاج العروس (نقلاً عن الصواب اللغوي)"
          source: "معجم الصواب اللغوي"
        - text: "«المُجانِس: حيوان أو نبات من جنس genus حيوان أو نباتٍ آخر» — المورد الحديث"
          source: "المورد الحديث"

    - lemma: "نَظِير"
      confirm:
        - text: "«المُناظِر المِثْلُ والمُساوِى» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«Peer، equal، analogue... يطلق على المثال مجازا وحقيقة على أعم منه» — كشاف اصطلاحات الفنون"
          source: "كشاف اصطلاحات الفنون"
      expands:
        - text: "«شكل آخر من أشكال ذرات العنصر نفسه... يختلف عنها بالكتلة الذرية» — معجم الصيدلة"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          addition: "المعنى العلمي المتخصص (Isotope)"
        - text: "«النقطة التي تقابل السمت» — المعجم الموحد لمصطلحات الجيولوجيا"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          addition: "المعنى الفلكي (Nadir)"

