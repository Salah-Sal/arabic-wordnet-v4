stage1_review:
  assessment:
    concerns:
      - "نقص اللمات الأساسية المعبرة عن النوع (type) والجنس (genus) رغم وجودها في التعريف الإنجليزي والأدبيات المنطقية العربية."
    observations: "المجموعة تغطي مفهوماً جوهرياً في التصنيف. اللمات الموجودة صحيحة لكنها تحتاج لتعزيز بمرادفات أكثر شمولاً وتخصيصاً (مثل نَوْع وجِنْس)."
  blind_candidates:
    - lemma: "نَوْع"
      generation_method: ishtiqaq
      justification: "اللفظ العربي الأشهر للتعبير عن الصنف أو النوع (Species/Type) في اللغة والمنطق."
    - lemma: "جِنْس"
      generation_method: ishtiqaq
      justification: "يستخدم للتعبير عن المقولة الأعم (Genus) التي تندرج تحتها الأنواع."
    - lemma: "فَصِيلَة"
      generation_method: ishtiqaq
      justification: "يقابل كلمة family في الإنجليزية، ويستخدم في التصنيف العلمي واللغوي."
    - lemma: "مَقُولَة"
      generation_method: ishtiqaq
      justification: "مصطلح منطقي وفلسفي دقيق للتعبير عن الفئة أو المقولة (Category)."

stage2_evidence:
  per_lemma:
    - lemma: "صنف"
      confirm:
        - text: "«الصِّنْفُ طَائِفَةٌ مِنْ كُلِّ شَيْءٍ. وَهَذَا صِنْفٌ مِنَ الْأَصْنَافِ أَيْ نَوْعٌ.»"
          source: "مقاييس اللغة"
        - text: "«الصنف: النوع من كل شيء.»"
          source: "المعجم الوسيط"
    - lemma: "طائفة"
      confirm:
        - text: "«الطائفة من كل شيء: القطعة أو الجزء منه.»"
          source: "المعجم الوسيط"
        - text: "«(في علم الأحياء) (Class): مرتبة تصنيفية في علم التصنيف أدنى من الشعبة وأعلى من الرتبة.»"
          source: "المعجم الكبير"
    - lemma: "فئة"
      confirm:
        - text: "«الفِئَة: الجماعة.»"
          source: "مجمل اللغة"
        - text: "«في مجال البرمجة الموجهة للكائنات، يتحدد في الفئات السمات والأساليب...»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
    - lemma: "نَوْع"
      confirm:
        - text: "«النَّوْعُ مِنَ الشَّيْءِ: الضَّرْبُ مِنْهُ. وَلَيْسَ هَذَا مِنْ نَوْعِ ذَاكَ.»"
          source: "مقاييس اللغة"
        - text: "«النَّوْع: صنف من كل شيء، ميزة، صفة.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "جِنْس"
      confirm:
        - text: "«الْجِيمُ وَالنُّونُ وَالسِّينُ أَصْلٌ وَاحِدٌ وَهُوَ الضَّرْبُ مِنَ الشَّيْءِ.»"
          source: "مقاييس اللغة"
        - text: "«الجنس: الضرب من كل شيء، وهو أعم من النوع.»"
          source: "المعجم الوسيط"
    - lemma: "فَصِيلَة"
      confirm:
        - text: "«قسم من أقسام السلم التصنيفي يقع بين الرتبة والجنس يضم أجناسا متقاربة.»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (ArabTerm)"
    - lemma: "مَقُولَة"
      confirm:
        - text: "«طبقة ذات مكونات متشابهة ولها علاقات تربط بينها.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ArabTerm)"

stage3_analysis:
  per_lemma:
    - lemma: "صِنْف"
      decision: confirmed
      decision_reason: "لفظ أصيل وشائع جداً للتعبير عن الكاتيجوري أو الفئة في السياقات العامة والتجارية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صِنْف"
    - lemma: "طَائِفَة"
      decision: confirmed
      decision_reason: "تستخدم للتعبير عن الجماعة أو الجزء من الكل، ولها دلالة اصطلاحية في التصنيف (Class)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَائِفَة"
    - lemma: "فِئَة"
      decision: confirmed
      decision_reason: "شائعة الاستخدام في التصنيفات الاجتماعية والتقنية (كفئات البرمجة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِئَة"
    - lemma: "نَوْع"
      source: stage1
      decision: confirmed
      decision_reason: "من أهم المترادفات لهذا المفهوم، ويعبر بدقة عن النوع (Species/Type)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نَوْع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "جِنْس"
      source: stage1
      decision: confirmed
      decision_reason: "أساسي في التعبير عن الفئة الأعم (Genus)، وهو متمم لـ 'نوع'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "جِنْس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فَصِيلَة"
      source: stage1
      decision: confirmed
      decision_reason: "يقابل تماماً كلمة family المذكورة في المعنى الإنجليزي للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَصِيلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَقُولَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق للتعبير عن 'Category' في السياق المنطقي والفلسفي واللساني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَقُولَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "مجموعة من الأشياء تشترك في صفة مشتركة"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويغطي الجوهر الدلالي للمجموعة."
    authored:
      - type: linguistic
        text: "جماعة من الأشياء أو الكائنات تجمعها سمات أو خصائص مشتركة تميزها عن غيرها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false

  examples:
    per_lemma:
      - lemma: "صِنْف"
        examples:
          - text: "يتوفر هذا المتجر على أصناف متنوعة من البضائع."
            type: usage
      - lemma: "طَائِفَة"
        examples:
          - text: "تنتمي الثدييات إلى طائفة الفقاريات في التصنيف الحيوي."
            type: usage
      - lemma: "فِئَة"
        examples:
          - text: "يستهدف هذا البرنامج الفئات العمرية الشابة."
            type: usage
      - lemma: "نَوْع"
        examples:
          - text: "لا يزال العلماء يكتشفون أنواعاً جديدة من الكائنات الحية في أعماق المحيطات."
            type: usage
      - lemma: "جِنْس"
        examples:
          - text: "الحيوان جنس يندرج تحته أنواع كثيرة كالإنسان والفرس."
            type: usage
      - lemma: "فَصِيلَة"
        examples:
          - text: "ينتمي الأسد إلى فصيلة السنوريات."
            type: usage
      - lemma: "مَقُولَة"
        examples:
          - text: "تعد الكمية والكيفية من المقولات الأساسية في منطق أرسطو."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "صِنْف"
      entry_id: "{auto}"
      root: "صنف"
      maqayis_quote: "«الصَّادُ وَالنُّونُ وَالْفَاءُ أَصْلٌ صَحِيحٌ مُطَّرِدٌ فِي مَعْنَيَيْنِ، أَحَدُهُمَا الطَّائِفَةُ مِنَ الشَّيْءِ، وَالْآخَرُ تَمْيِيزُ الْأَشْيَاءِ بَعْضِهَا عَنْ بَعْضٍ.»"
    - lemma: "طَائِفَة"
      entry_id: "{auto}"
      root: "طوف"
      maqayis_quote: "«فَأَمَّا الطَّائِفَةُ مِنَ النَّاسِ فَكَأَنَّهَا جَمَاعَةٌ تُطِيفُ بِالْوَاحِدِ أَوْ بِالشَّيْءِ... أَنَّ كُلَّ جَمَاعَةٍ يُمْكِنُ أَنْ تَحُفَّ بِشَيْءٍ فَهِيَ عِنْدَهُمْ طَائِفَةٌ.»"
    - lemma: "فِئَة"
      entry_id: "{auto}"
      root: "فيأ"
      maqayis_quote: "«الْفَاءُ وَالْيَاءُ وَالْهَمْزَةُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الرُّجُوعِ... وَالْفِئَةُ: الْجَمَاعَةُ.»"
    - lemma: "نَوْع"
      entry_id: "{auto}"
      root: "نوع"
      maqayis_quote: "«النُّونُ وَالْوَاوُ وَالْعَيْنُ كَلِمَتَانِ، إِحْدَاهُمَا تَدُلُّ عَلَى طَائِفَةٍ مِنَ الشَّيْءِ مُمَاثِلَةٍ لَهُ... النَّوْعُ مِنَ الشَّيْءِ: الضَّرْبُ مِنْهُ.»"
    - lemma: "جِنْس"
      entry_id: "{auto}"
      root: "جنس"
      maqayis_quote: "«الْجِيمُ وَالنُّونُ وَالسِّينُ أَصْلٌ وَاحِدٌ وَهُوَ الضَّرْبُ مِنَ الشَّيْءِ.»"
    - lemma: "فَصِيلَة"
      entry_id: "{auto}"
      root: "فصل"
      maqayis_quote: "«الْفَاءُ وَالصَّادُ وَاللَّامُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى تَمْيِيزِ الشَّيْءِ مِنَ الشَّيْءِ وَإِبَانَتِهِ عَنْهُ.»"
    - lemma: "مَقُولَة"
      entry_id: "{auto}"
      root: "قول"
      maqayis_quote: "«الْقَافُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ النُّطْقُ بِالْقَوْلِ.» (المقولة مشتقة من القول بالنظر إلى إطلاقها على الماهيات)."

  per_sense:
    - lemma: "صِنْف"
      sense_id: "{auto}"
      nuance: "عام الاستخدام، يركز على التمييز والفرز."
      mwe: false
    - lemma: "طَائِفَة"
      sense_id: "{auto}"
      nuance: "تركز على الجماعة المحيطة أو المكونة لجزء من كل، وتستخدم تقنياً في الأحياء (Class)."
      mwe: false
    - lemma: "فِئَة"
      sense_id: "{auto}"
      nuance: "تركز على الجماعة ذات الخصائص المشتركة، وغالباً ما ترتبط بالتصنيفات الاجتماعية أو الرقمية."
      mwe: false
    - lemma: "نَوْع"
      sense_id: "{auto}"
      nuance: "يركز على الخصائص الجوهرية المتماثلة (Species)، وهو أدق من الجنس."
      mwe: false
    - lemma: "جِنْس"
      sense_id: "{auto}"
      nuance: "يعبر عن الفئة الأعم التي تضم تحتها أنواعاً (Genus)."
      mwe: false
    - lemma: "فَصِيلَة"
      sense_id: "{auto}"
      nuance: "تعادل family، وتركز على الروابط التصنيفية الوثيقة."
      mwe: false
    - lemma: "مَقُولَة"
      sense_id: "{auto}"
      nuance: "اصطلاح منطقي وفلسفي للفئة الذهنية أو اللسانية."
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"صنف","maqayis":"«الصَّادُ وَالنُّونُ وَالْفَاءُ أَصْلٌ صَحِيحٌ مُطَّرِدٌ فِي مَعْنَيَيْنِ، أَحَدُهُمَا الطَّائِفَةُ مِنَ الشَّيْءِ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"عام الاستخدام، يركز على التمييز والفرز.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
