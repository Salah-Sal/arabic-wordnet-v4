# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13355322-n (stockholding)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي لمّة واحدة فقط (حِيَازَة الأَسْهُم)، وهو مركّب إضافي تركيبي لا إشكال فيه صرفياً، لكنه قد يجتاز اختبار السكّ (يمكن إبدال حيازة بـ«ملكية» أو «امتلاك» مع بقاء المعنى)."
      - "التعريف العربي يبدو ترجمة شبه حرفية للتعريف الإنجليزي: «ملكية الأسهم؛ حالة أو حقيقة امتلاك الأسهم» ← 'ownership of stocks; the state or fact of holding stock'."
      - "في قاموس ARABTERM التجاري يُترجَم stockholding بـ«حيازة السندات» لا «حيازة الأسهم»، وهو خلط بين stocks وbonds يستحق التنبيه."
    observations: >
      المفهوم هو حالة امتلاك الأسهم (الأوراق المالية)، وهو نوع خاص من الملكية.
      المركّب الإضافي «حيازة الأسهم» مقبول في اللغة القانونية والتجارية العربية المعاصرة.
      «الحيازة» في المعاجم تدلّ على ضمّ الشيء إلى النفس من مال أو غيره، وهي أعمّ من الملكية
      إذ قد تكون حيازة بدون ملكية. لكنّ الاستعمال الاصطلاحي المالي المعاصر يستخدم
      «حيازة» بمعنى «الاحتفاظ بالأصل المالي» وهو مناسب للمفهوم.
  blind_candidates:
    - lemma: "حِيَازَةُ الأَسْهُمِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «حيازة» (المصدر من حاز يحوز، بمعنى الضمّ والاحتفاظ) و«الأسهم» (جمع سهم بالمعنى المالي).
        الحيازة مصطلح قانوني مالي راسخ يدلّ على واقعة وضع اليد على الشيء والاحتفاظ به.
    - lemma: "تَسَهُّم"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفَعُّل من الجذر «سهم»، يدلّ على حالة اتخاذ الأسهم أو الاشتغال بها.
        الوزن يناسب الدلالة على الحالة المستمرة (كالتملّك والتكسّب). غير أنه غير مسكوك
        في الاستعمال المالي المعاصر.
    - lemma: "مُسَاهَمَة"
      generation_method: ishtiqaq
      justification: >
        مصدر ميمي / اسم مصدر من «ساهَمَ» (فاعَلَ من سهم)، مستعمل في «شركة مساهمة»
        (joint-stock company). قد يتوسّع معناه ليشمل حالة امتلاك الأسهم بالذات.
    - lemma: "تَمَلُّكُ الأَسْهُمِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «تملّك» (المصدر من تملّك يتملّك، بمعنى صيرورة الشيء ملكاً)
        و«الأسهم». يركّز على جانب الملكية القانونية أكثر من مجرّد الحيازة.

stage2_evidence:
  per_lemma:
    - lemma: "حِيَازَةُ الأَسْهُمِ"
      confirm:
        - text: "«حيازة السندات — stockholding»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM"
        - text: "«حيازة — holding»"
          source: "مسرد الجغرافيا والتاريخ — ARABTERM"
        - text: "«حيازة — possession»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
      expands:
        - text: "«(الْحِيَازَة) حِيَازَة الرجل مَا فِي حوزته من مَال أَو عقار وَالْأَرْض الزراعية»"
          source: "المعجم الوسيط (هوراماني)"
          addition: "الحيازة تشمل المال والعقار، فتشمل الأسهم بوصفها مالاً منقولاً"
        - text: "«حيازةُ الشيء: ما ضمَّه الإنسانُ إلى نَفْسِه من مالٍ أو غيره»"
          source: "المعجم الكبير"
          addition: "تأكيد أنّ الحيازة تعمّ كل ما يُضمّ من مال"
      contradicts:
        - text: "«حيازة السندات — stockholding»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "المعجم يستعمل «السندات» (bonds) مقابل stock، وهو خلط بين الأسهم (equity) والسندات (bonds/debt)؛ ربما قُصد stock بمعناه العام لا بمعنى share"

    - lemma: "تَسَهُّم"
      evidence_status: "no_material_found"

    - lemma: "مُسَاهَمَة"
      contradicts:
        - text: "«الْمُسَاهَمَةُ: الإِعانَةُ الماليةُ»"
          source: "المعجم الكبير"
          conflict: "المساهمة في المعاجم تعني الإعانة والمشاركة المالية، لا حالة امتلاك الأسهم بعينها"
        - text: "«مُساهَمة — contribution»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM"
          conflict: "المساهمة تُترجم بـ contribution لا بـ stockholding"
      expands:
        - text: "«شركة مساهَمة مصرية [...] شركة يساهم في رأس مالها عدد من الأفراد [...] يمكن تصحيحه على اعتبار مساهمة مصدرًا لا اسم مفعول»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "المساهمة مرتبطة بالشركات المساهمة لكنها تدلّ على فعل المشاركة لا على حالة امتلاك الأسهم"

    - lemma: "تَمَلُّكُ الأَسْهُمِ"
      confirm:
        - text: "«المِلْكِيَّةُ: المِلْكُ أو التمليك. يقال: بيدى عَقْد مِلكيّة هذه الأرض»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(مَلَكَ) الْمِيمُ وَاللَّامُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ وَصِحَّةٍ [...] مَلَكَ الْإِنْسَانُ الشَّيْءَ يَمْلِكُهُ مَلْكًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الملك يدلّ على القوة والتصرف في الشيء، والتملّك مصدر تملّك: صيّره ملكاً"

stage3_analysis:
  per_lemma:
    - lemma: "حِيَازَةُ الأَسْهُمِ"
      decision: confirmed
      decision_reason: >
        مركّب إضافي مالي راسخ في الاستعمال المعاصر. «الحيازة» مصطلح قانوني ثابت يدلّ على
        وضع اليد والاحتفاظ بالشيء، و«الأسهم» مصطلح مالي لا لبس فيه. المعاجم تدعم المعنى
        العام للحيازة (ضمّ المال)، ومعجم ARABTERM التجاري يستخدم «حيازة» مقابل stockholding
        (وإن أخطأ في استعمال «السندات» بدل «الأسهم»). المركّب مطابق للمفهوم المطلوب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِيَازَةُ الأَسْهُمِ"

    - lemma: "تَسَهُّم"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استعمال «تسهّم» بمعنى حيازة الأسهم. الصيغة غير مسكوكة
        في المعاجم ولا في الاستعمال الاصطلاحي المالي المعاصر. وزن تَفَعُّل من «سهم»
        يقتضي معنى «التحوّل إلى سهم» أو «اتخاذ صفة السهم» وهو بعيد عن المطلوب.
      evidence_assessment:
        case: no_material

    - lemma: "مُسَاهَمَة"
      source: stage1
      decision: removed
      decision_reason: >
        المساهمة في المعاجم تدلّ على الإعانة المالية والمشاركة في رأس المال (contribution)،
        وهي مصدر الفعل «ساهَمَ» الذي يعني أقرع أو شارك. الدلالة المعجمية لا تطابق
        «حالة امتلاك الأسهم» بل تدلّ على فعل المشاركة ذاته. كما أنّ المساهمة في
        الاستعمال المعاصر ترتبط بنوع الشركة (شركة مساهمة) لا بحالة المالك.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَمَلُّكُ الأَسْهُمِ"
      source: stage1
      decision: removed
      decision_reason: >
        «التملّك» يدلّ على فعل الاستيلاء أو الحصول على الملكية (عملية الاقتناء)
        لا على حالة الاحتفاظ بالأسهم. المفهوم المطلوب (stockholding) يركّز على الحالة
        القائمة لا على فعل الشراء. فضلاً عن أنّ «ملكية الأسهم» واردة في التعريف ذاته
        فإدراجها كلمّة يخلق دوراناً معجمياً.
      evidence_assessment:
        case: mixed

