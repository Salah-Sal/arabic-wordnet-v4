      entry_id: "{auto}"
      root: "فقر"
      maqayis_quote: "«الْفَاءُ وَالْقَافُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْفِرَاجٍ فِي شَيْءٍ، مِنْ عُضْوٍ أَوْ غَيْرِ ذَلِكَ.»"
    - lemma: "مَسَاكِين"
