# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-03372987-n
# flower arrangement / تنسيق الزهور
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تنسيق الزهور» تركيب إضافي مصدري يحتمل الدلالة على الفعل (العملية) والنتيجة (الترتيب المادي)، والمجموعة تحتاج إلى لمّة تدل صراحة على الناتج"
      - "اللمّة بدون تشكيل كامل"
      - "المجموعة تحوي لمّة واحدة فقط، وهذا فقر مصطلحي"
    observations: "المفهوم المقصود هو الترتيب الزخرفي المادي للزهور بوصفه شيئاً محسوساً (اسم ذات)، لا فعل التنسيق (اسم حدث). التعريف العربي «ترتيب زخرفي للزهور» واضح ومختصر. المجموعة الأم هي «ترتيب / تنسيق» بمعنى التجميع المنظم، وهذا يؤكد أن المقصود هو الناتج لا العملية. فن تنسيق الزهور معروف في الثقافة العربية الإسلامية ارتباطاً بتزيين المجالس والاحتفالات."
  blind_candidates:
    - lemma: "تَنْسِيقَة"
      generation_method: ishtiqaq
      justification: "اسم مرة من تنسيق على وزن تَفْعِيلَة، يدل على ناتج فعل التنسيق الواحد، أي القطعة الواحدة المنسَّقة من الزهور"
    - lemma: "بَاقَة"
      generation_method: majaz
      justification: "أصلها حزمة من البقل في المعاجم القديمة، ووسّعها المحدثون لتشمل حزمة الزهر المرتبة للتزيين، فيها إزاحة دلالية من النبات العام إلى الزهر المنسَّق"
    - lemma: "إِكْلِيلُ زَهْرٍ"
      generation_method: tarkib
      justification: "تركيب إضافي من الإكليل (طاقة من الورود على هيئة التاج) والزهر، يدل على ترتيب زخرفي دائري للزهور"
    - lemma: "نَضِيدَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن ض د الدال على ضم الشيء إلى الشيء في اتساق، على وزن فَعِيلَة بمعنى مفعولة، أي الشيء المنضود المرتب"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَنْسِيقُ الزُّهُورِ"
      confirm:
        - text: "«التنسيق: من النسق بسكون السين المهملة الترتيب وإجراء الكلام على سياق واحد ونظام واحد. والنسق بالفتحتين من كل شيء ما كان على نظام واحد»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«النون والسين والقاف أصل صحيح يدل على تتابع في الشيء. وكلام نسق: جاء على نظام واحد»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«تنسيق الصفات في صنعة البديع: ذكر الشيء بصفات متتالية مدحاً أو ذمّاً»"
          source: "كتاب التعريفات للجرجاني"
          addition: "التنسيق اصطلاحاً في البديع يعني الترتيب المتتابع، مما يؤكد الدلالة الترتيبية لا مجرد الجمع"

    - lemma: "تَنْسِيقَة"
      evidence_status: "no_material_found"

    - lemma: "بَاقَة"
      confirm:
        - text: "«الباقة: الحزمة من البقل. (مع)»"
          source: "المعجم الوسيط"
        - text: "«باقة [مفرد]: ج باقات: حزمة من البقل، ويُطلقها المحدثون على الضميمة من الزّهر وعلى الحزمة من كلّ شيء. تُقَدَّم باقات الورود في المناسبات السعيدة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«ورد في التاج: الباقة: الحزمة من البقل والبقل نبات كالريحان والورد وعليه فيجوز استعمال الباقة مع الورود ويكون الاستعمال مجازيّاً لعلاقة المشابهة وقد أجاز مجمع اللغة المصري استعمال الكلمتين طاقة وباقة وإن كان يفضل الأولى»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الباقة تدل على حزمة زهور مجموعة لا على ترتيب زخرفي بالضرورة"
        - text: "«الباقة: الحزمة، يُقال باقة من بقل»"
          source: "المعجم الكبير"
          addition: "المعنى الأصلي حزمة وليس ترتيباً زخرفياً"

    - lemma: "إِكْلِيلُ زَهْرٍ"
      confirm:
        - text: "«الإكليل: التاج وعصابة تزين بالجوهر وما أحاط بالظفر وطاقة من الورود والأزهار على هيئة التاج تكلل الرأس أو تطوّق العنق للتزيين (ج) أكاليل (محدثة)»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الإكليل: التاج وعصابة تُزيَّن بالجوهر... طاقة من الورود والأزهار على هيئة التاج تكلِّلُ الرأسَ أو تطوِّق العنقَ»"
          source: "المعجم الوسيط"
          conflict: "الإكليل مقيّد بالشكل التاجي الدائري، فلا يشمل كل ترتيب زخرفي للزهور"

    - lemma: "نَضِيدَة"
      contradicts:
        - text: "«النضيدة: مؤنث النضيد والوسادة وما حُشي من المتاع (ج) نضائد»"
          source: "المعجم الوسيط"
          conflict: "النضيدة تعني الوسادة والمتاع المحشو، ليس لها علاقة بترتيب الزهور"
      expands:
        - text: "«النون والضاد والدال أصل صحيح يدل على ضم شيء إلى شيء في اتساق وجمع»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الضم المتسق لكن المشتقات انصرفت إلى الأثاث والمتاع لا النبات"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تَنْسِيقُ الزُّهُورِ"
      decision: confirmed
      decision_reason: "تركيب إضافي ثابت يجمع بين المصدر «تنسيق» (من نسق = رتّب على نظام واحد) وبين «الزهور»، ويدل في الاستعمال المعاصر على الترتيب الزخرفي للزهور بوصفه ناتجاً ملموساً. المصدر العربي يتحمّل معنى الحدث والناتج معاً، وهو استعمال قياسي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدل على المفهوم العام للترتيب الزخرفي للزهور بوصفه فناً أو ناتجاً، وهو المصطلح الشائع في الاستعمال المعاصر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنْسِيقُ الزُّهُورِ"

    - lemma: "تَنْسِيقَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي لهذه الصيغة. وزن تَفْعِيلة بمعنى اسم المرة من فعّل غير قياسي في هذا الباب، والمسموع هو «تنسيقة» في العامية المصرية فقط."
      evidence_assessment:
        case: no_material

    - lemma: "بَاقَة"
      source: stage1
      decision: removed
      decision_reason: "الباقة تعني حزمة من الزهور أو البقل مجموعةً معاً، وهي دالّة على الحُزْمة لا على الترتيب الزخرفي. فالباقة قد تكون بسيطة غير مرتبة، أما المجموعة الترادفية فتشترط صفة الزخرفة والترتيب الفني. الباقة أقرب إلى synset البوكيه أو الحزمة."
      evidence_assessment:
        case: mixed

    - lemma: "إِكْلِيلُ زَهْرٍ"
      source: stage1
      decision: removed
      decision_reason: "الإكليل مقيّد في المعاجم بالشكل التاجي الدائري الذي يكلّل الرأس أو يطوّق العنق. هذا نوع خاص من ترتيب الزهور وليس المفهوم العام. ينتمي إلى مجموعة ترادفية أخص (wreath/garland)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "نَضِيدَة"
      source: stage1
      decision: removed
      decision_reason: "النضيدة في المعاجم تعني الوسادة والمتاع المحشو، وإن كان الجذر ن ض د يدل على الضم المتسق فإن المشتقات المسموعة انصرفت إلى الأثاث. استعمالها للزهور غير مأنوس ولا مسموع."
      evidence_assessment:
        case: contradicts_only

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "ترتيب زخرفي للزهور"
    assessment:
      decision: retain
      reason: "التعريف موجز ودقيق، يتضمن الجنس القريب (ترتيب) والفصل النوعي (زخرفي + للزهور)، ويتّسق مع التعريف الإنجليزي دون أن يكون ترجمة حرفية. لا يحتاج إلى تعديل."
  examples:
    per_lemma:
      - lemma: "تَنْسِيقُ الزُّهُورِ"
        examples:
          - text: "وُضِعَ تَنْسِيقُ الزُّهُورِ فِي صَدْرِ قَاعَةِ الاسْتِقْبَالِ لِيُضْفِيَ عَلَى المَكَانِ رَوْنَقًا وَبَهَاءً."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "وُضِعَ تَنْسِيقُ الزُّهُورِ فِي صَدْرِ قَاعَةِ الاسْتِقْبَالِ لِيُضْفِيَ عَلَى المَكَانِ رَوْنَقًا وَبَهَاءً."

