stage4_content:
  definition:
    current: "عمل تجاري غير مدمج يمتلكه شخص واحد يكون مسؤولاً عن التزاماته ويحق له أرباحه"
    assessment:
      decision: revise
      reason: "التعريف الحالي أقرب إلى الترجمة الحرفية للتعريف الإنجليزي، ويفتقر إلى الأسلوب المعجمي العربي. كلمة «مدمج» ترجمة حرفية لـ unincorporated وغير شائعة في هذا السياق. يحتاج إعادة صياغة بأسلوب المعجم الوسيط مع بيان الجنس القريب والفصل النوعي"
    authored:
      - type: terminological
        text: "شكل من أشكال المِلْكِيَّة التجارية يملك فيه فردٌ واحد المشروعَ كلَّه، ويتحمّل وحده جميع التزاماته المالية، ويستأثر بأرباحه، دون أن يكون للمشروع شخصية اعتبارية مستقلة عن مالكه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "كيان تجاري يؤسّسه شخص واحد ويديره بنفسه أو بمن ينيبه، ولا يكتسب هذا الكيان شخصية اعتبارية مستقلة، بل تندمج ذمّته المالية في ذمّة مالكه، فيكون المالك مسؤولاً في ماله الخاص عن جميع ديون المشروع والتزاماته. وهو أبسط أشكال النشاط التجاري وأكثرها شيوعاً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
