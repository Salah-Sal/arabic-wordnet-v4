# مراجعة المجموعة الترادفية — awn4-13264678-n
# proprietorship / sole proprietorship
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما مركبتان وصفيتان تنتهيان بـ«فَرْدِيَّة»، ما يطرح سؤالاً عن مدى تمايزهما الدلالي"
      - "«مِلْكِيَّة فَرْدِيَّة» قد تلتبس بالملكية الخاصة (private property) عموماً لا بالكيان التجاري تحديداً"
      - "«مُؤَسَّسَة فَرْدِيَّة» قد تلتبس بمفهوم المؤسسة بمعناها الأعم (institution/foundation)"
    observations: "المفهوم ينتمي إلى حقل القانون التجاري والاقتصاد، ويشير إلى شكل قانوني محدد من أشكال الكيانات التجارية حيث يكون المالك فرداً واحداً مسؤولاً مسؤولية كاملة. المصطلح العربي يتطلب تركيباً وصفياً لأن المفهوم لا يُعبَّر عنه بلفظ مفرد في العربية. الفوقي المباشر هو «مِلْكِيَّة» مما يؤكد انتماء المفهوم إلى باب التملك والحيازة."

  blind_candidates:
    - lemma: "مِلْكِيَّة فَرْدِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من «مِلْكِيَّة» (ownership) و«فَرْدِيَّة» (individual)، يُحاكي البنية الاصطلاحية الشائعة في القانون التجاري العربي للدلالة على sole proprietorship"
    - lemma: "مُؤَسَّسَة فَرْدِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من «مُؤَسَّسَة» (establishment) و«فَرْدِيَّة» (individual)، شائع في الأنظمة التجارية العربية للإشارة إلى الكيان التجاري المملوك لفرد واحد"
    - lemma: "مُنْشَأَة فَرْدِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من «مُنْشَأَة» (enterprise/firm) و«فَرْدِيَّة»، مصطلح اقتصادي يُستخدم للدلالة على المشروع الفردي أو الشركة ذات المالك الواحد"
    - lemma: "مَشْرُوع فَرْدِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «مَشْرُوع» (project/enterprise) و«فَرْدِيّ» (individual)، يُستخدم أحياناً في السياق الاقتصادي للإشارة إلى النشاط التجاري الفردي"


stage2_evidence:
  per_lemma:
    - lemma: "مُؤَسَّسَة فَرْدِيَّة"
      expands:
        - text: "«كل تنظيم يرمى إلى الإنتاج أو المبادلة للحصول على الربح. (مج)»"
          source: "المعجم الوسيط"
          addition: "تعريف «المُؤَسَّسة» عموماً بوصفها تنظيماً إنتاجياً أو تبادلياً ربحياً، ما يؤكد ملاءمة المكوّن الأول للسياق التجاري"
        - text: "«منشأة لتنظيم أعمال الإنتاج أو التجارة»"
          source: "المعجم الكبير"
          addition: "يُعرّف المؤسسة بأنها منشأة إنتاجية أو تجارية، مع ذكر المؤسسات الخيرية كنوع مستقل"

    - lemma: "مِلْكِيَّة فَرْدِيَّة"
      confirm:
        - text: "«ملكية فردية = sole proprietorship»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«مِلْكيّة proprietorship of a copyright»"
          source: "المورد الحديث (2008)"
        - text: "«مِلْكِيَّة (امْتِلاكُ حَقِّ الانْتِفاع) = proprietorship»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«المِلْكُ أو التمليك. يقال: بيدى عَقْد مِلكيّة هذه الأرض. قانون تحديد المِلْكِيَّة الزراعية: القانون الذى يحدِّد مقدار ما يجوز للفرد أن يمتلكه من الأرض الزراعية. الملكية الخاصة: ما يملكه الفرد. الملكية العامة: ما تملكه الدولة»"
          source: "المعجم الوسيط"
          addition: "يبيّن أن المِلْكِيَّة تشمل معنى التملك والحيازة عموماً، ويميّز بين الملكية الخاصة والعامة"

    - lemma: "مُنْشَأَة فَرْدِيَّة"
      confirm:
        - text: "«منشأة فردية، منشأة ذات المالك الوحيد = one man concern; individually owned business»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
      expands:
        - text: "«مكان للعمل أو الصناعة يجمع الآلات والعمال. (مج)»"
          source: "المعجم الوسيط"
          addition: "تعريف «المُنْشَأَة» بوصفها مكاناً إنتاجياً، ما يُركّز على الجانب المادي للمشروع"
        - text: "«المشروع في العربية له عدة معان... نقول: منشأة وهي تنظيم انتاجي أو تجاري يسعى إلى الربح = enterprise»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "يوضح أن «منشأة» تُستخدم مقابل enterprise بدلاً من «مشروع» لتجنب الالتباس"

    - lemma: "مَشْرُوع فَرْدِيّ"
      expands:
        - text: "«ما سوَّغَه الشَّرْع. الأمر يهيأ ليُدرَس ويقرر»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي لـ«المشروع» مرتبط بالشرع والتخطيط (project)، لا بالكيان التجاري"
        - text: "«نشاط تجاري، مشروع تجاري = business»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "«مشروع تجاري» يرد مقابلاً لـ business عموماً لا لـ proprietorship تحديداً"


