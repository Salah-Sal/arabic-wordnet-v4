          source: "المعجم الكبير"
          # entry_id: 71919
          addition: >
            «تجسيد» موثَّق بمعنى «personification» في الآداب والفنون، غير أن
            لا شاهد مباشر على استعماله في طب النفس للمفهوم المقصود.

    - lemma: "إِبَانَةٌ فِعْلِيَّةٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "تمثيل انفعالي"
      decision: confirmed
      decision_reason: >
        المصطلح مُشتَقّ من جذرَيْن عربيَّيْن راسخَيْن (مثل + فعل)، ومصكوك في
        المعجمية النفسية والتربوية العربية. وصف «الانفعالي» يُقيِّد دلالة «التمثيل»
        ويُخصِّصها في الحقل النفسي. وإن كان المعجم الطبي الموحد يُفضِّل «تمثيل
        عصابي» للمقابل الإنجليزي «acting out»، إلا أن «تمثيل انفعالي» يُعبِّر عن
        الجانب العلاجي الصحي الذي يُقدِّمه التعريف، وهو تمييز دلالي وجيه.
      evidence_assessment:
        case: mixed
        # expands فقط — لا تأكيد مباشر، لا تعارض، لكن ثمة بديل أقرب في المعجم الطبي
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على البُعد الأدائي-التعبيري: الانفعال يُؤدَّى ويُمثَّل في صورة أفعال
        تُحاكي حالة نفسية داخلية (من «مَثَّلَ» بمعنى ناظَرَ وشابَهَ)؛ ويُبرز
        العلاقة بين المشاعر والسلوك الظاهري كمحاكاة. يُستخدَم غالباً في الحديث
        عن الجانب التعبيري-الوجداني للمفهوم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمْثِيلٌ انْفِعَالِيٌّ"

    # ── لمّة موجودة ٢ ──
    - lemma: "تنفيس حركي"
      decision: confirmed
      decision_reason: >
        مُثبَت مباشرةً في المعجم الطبي الموحد بمقابل «motor abreaction» (entry_id=535446)،
        وجذره «نفس» متسقٌ مع المعنى (التنفيس = الإفراج عن الكرب والضغط النفسي).
        وصف «حركي» يُحدِّد آلية الإفراج (عبر الحركة والفعل الجسدي)، وهو المكوِّن
        الجوهري في تعريف المجموعة («غالباً في أفعال بدلاً من كلمات»).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على البُعد التخليصي-الحركي: الانفعال المكبوت يُفرَج عنه عبر
        نشاط جسدي حركي (من «نَفَّسَ» بمعنى أزال الكرب وأطلق المحتبَس). يُشير
        إلى الآلية النفسية (التنفيس / abreaction) وإلى وسيلتها (الحركة). يُستخدَم
        غالباً في السياق الطبي التحليلي الذي يُعنى بتحرير الطاقة الانفعالية عبر الفعل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنْفِيسٌ حَرَكِيٌّ"

    # ── مرشح المرحلة ١ — أ ──
    - lemma: "تَنْفِيسٌ حَرَكِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        المرشح يطابق تماماً اللمّة الموجودة الثانية «تنفيس حركي» — وهو في الوقت
        ذاته دليل على صحة التوليد الأعمى ومطابقته للاختيار المعجمي المثبَت.
        لا حاجة إلى إجراء إضافي.

    # ── مرشح المرحلة ١ — ب ──
    - lemma: "تَفْرِيغٌ انْفِعَالِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
