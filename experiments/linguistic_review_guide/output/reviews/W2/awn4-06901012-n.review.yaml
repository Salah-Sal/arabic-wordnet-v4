#   Q2: جسر إنجليزي: "acting out" / "abreaction" / "catharsis" — 14 نتيجة
#   Q3: إثراء بالمعرّف (definitions+examples) لمعرّفات مختارة — فارغ (ARABTERM)
#   Q4: مقاييس اللغة (dict_id=151): نفس، مثل، فعل، حرك — 4 نتائج
#   Q5: FTS عربي: مكبوت، تنفيس انفعالي، عصابي — 20 نتيجة
stage2_evidence:

  per_lemma:

    - lemma: "تمثيل انفعالي"
      expands:
        - text: >
            «تَمْثِيلٌ عُصابِيّ؛ فِعْلٌ زَلَلِيّ»
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            المعجم الطبي الموحد يُخصّص مقابل «acting out» بمصطلح مختلف
            («تمثيل عصابي؛ فعل زللي»، entry_id=536737)، ومقابل «acting out
            behavior» بـ«سلوك التمثيل العصابي» (entry_id=548784). وصف
            «الانفعالي» في اللمّة الموجودة يُبرز الجانب العاطفي لا العصابي،
            وهو تمييز دلالي وجيه في سياق التعريف الذي يُقدِّم المفهوم باعتباره
            صحياً وعلاجياً.
        - text: >
            «تَمْثِيل» (في المسرح أو الإذاعة أو التلفزة أو السينما)
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: >
            يكشف أن «تمثيل» يُوظَّف فعلاً في سياق «acting» (أداء/عرض)، مما
            يدعم التركيب «تمثيل انفعالي» من حيث الاشتقاق، غير أنه يؤكد خطر
            الاشتراك اللفظي مع التمثيل الفني.
        - text: >
            «تَمْثِيلٌ» EN: histrionism
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            أحد مقابلات «تمثيل» في السياق الطبي هو «histrionism» (التظاهر
            المسرحي)، وهو مفهوم مختلف عن «acting out»، مما يُوضح التباين
            الدلالي ويُؤكد الحاجة إلى القيد الوصفي «انفعالي» للتمييز.

    - lemma: "تنفيس حركي"
      confirm:
        - text: >
            «تَنْفِيسٌ حَرَكِيّ» EN: motor abreaction
          source: "المعجم الطبي الموحد (2009)"
          # entry_id: 535446 — مُثبَت مباشرةً في المعجم الطبي الموحد
        - text: >
            «تَنْفِيس» EN: abreaction
          source: "المعجم الطبي الموحد (2009)"
          # entry_id: 535445
        - text: >
            «تنفيس» EN: abreaction
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          # entry_id: 396401
        - text: >
            «تنفيس» EN: abreaction
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
          # entry_id: 400317
        - text: >
            «تنفيس» EN: catharsis
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          # entry_id: 396593
      expands:
        - text: >
            «التنفيس؛ التفريغ: إزالة العُقَد بطرائق التحليل النفسيّ.»
            EN: abreaction
          source: "المورد الحديث (2008)"
          addition: >
            يُقدِّم «التنفيس» بديلاً من «التفريغ» ويصفهما معاً بأنهما إزالة
            العقد النفسية بأساليب التحليل النفسي، مما يُدعم الجذر «نفس» في
            سياق نفسي تحليلي وعلاجي — وهو بالضبط ما يصفه التعريف.
        - text: >
            «تنفيس انفعالي» EN: catharsis (emotional-)
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          # entry_id: 396594
          addition: >
            يُثبت أن التركيب «تنفيس + انفعالي» موجود في المعجمية التربوية
            العربية بمقابل «catharsis (emotional-)»، مما يدعم إنتاجية
            الجذر «نفس» في هذا الحقل الدلالي.

    - lemma: "تَفْرِيغٌ انْفِعَالِيٌّ"
      expands:
        - text: >
            «تفريغ» EN: liberation of complex
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
