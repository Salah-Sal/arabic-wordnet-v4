          addition: >
            «تفريغ» يُوظَّف في علم النفس بمعنى «تحرير العُقَد»، وهو أقرب
            إلى «catharsis» منه إلى «acting out»؛ يدعم التركيب المرشَّح
            جزئياً دون أن يُثبته بدقة للمفهوم المقصود.

    - lemma: "تَجْسِيدٌ انْفِعَالِيٌّ"
      expands:
