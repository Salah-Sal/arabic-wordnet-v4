    # ── مرشح المرحلة ١ — د ──
    - lemma: "إِبَانَةٌ فِعْلِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا تثبيت معجمي في المصادر المستعلَمة. «إبانة» تراثية دقيقة في معنى
        الإيضاح والإظهار لكنها لا تُفيد معنى «الإفراج العلاجي عن المكبوت»؛
        كما أن التركيب «إبانة فعلية» لم يُثبَت مصطلحاً اصطلاحياً ثابتاً
        في علم النفس.


