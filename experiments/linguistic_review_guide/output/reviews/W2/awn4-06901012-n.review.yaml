        الفرق دلالي: «acting out» تعبير سلوكي فعلي، بينما «تفريغ» يُوحي بإفراغ
        الشحنة الداخلية مطلقاً. لا تثبيت معجمي مباشر للتركيب «تفريغ انفعالي»
        في سياق المجموعة.

    # ── مرشح المرحلة ١ — ج ──
    - lemma: "تَجْسِيدٌ انْفِعَالِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «تجسيد» موثَّق في سياق الآداب والفنون (personification) ولا شاهد على
        استخدامه في طب النفس لهذا المفهوم. يُوحي بتجسيد استعاري أكثر منه بتعبير
