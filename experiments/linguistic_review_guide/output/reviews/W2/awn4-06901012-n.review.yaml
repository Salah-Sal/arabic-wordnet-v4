# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. المرشحات الأربعة — توليد أعمى انطلاقاً من التعريف فقط
  #    قبل الاطلاع على اللمّات الموجودة
  blind_candidates:

    - lemma: "تَنْفِيسٌ حَرَكِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «تَنْفِيس» (مصدر نفَّسَ، أي أزال الضغط والكرب) و«حَرَكِيّ»
        (منسوب إلى الحركة). يُعبِّر عن إطلاق الانفعالات المكبوتة عبر أفعال جسدية
        بدلاً من الكلمات، وهو ما يوافق جوهر التعريف.

    - lemma: "تَفْرِيغٌ انْفِعَالِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «تَفْرِيغ» (إخراج ما احتُبس، من فرغ) و«انْفِعَالِيّ»
        (منسوب إلى الانفعال). يُشير إلى إخلاء الشحنة العاطفية المكبوتة عبر
        الفعل السلوكي، بما يناسب الجانب العلاجي الوارد في التعريف.

    - lemma: "تَجْسِيدٌ انْفِعَالِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «تَجْسِيد» (جعل المجرد محسوساً، من جسَّد) و«انْفِعَالِيّ».
        يُعبِّر عن تحويل الانفعالات الداخلية المكبوتة إلى أفعال خارجية ملموسة،
        وهو المآل الأبرز في التعريف.

    - lemma: "إِبَانَةٌ فِعْلِيَّةٌ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «إِبَانَة» (إظهار وإيضاح، مصدر أبانَ) و«فِعْلِيَّة»
        (منسوبة إلى الفعل، مقابل اللفظية). يُشير إلى إظهار المشاعر عبر الأفعال
        لا الكلمات، وهو القيد التعريفي الجوهري. يُحيي لفظاً تراثياً راسخاً.

  # ب. التقييم الأولي بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل — إلزامي لكل لمّة مؤكدة."
      - >
        «تمثيل» في العربية كثير الاشتراك (تمثيل مسرحي، تمثيل دبلوماسي، تمثيل
        ضوئي، قياس منطقي)؛ يُضعف الدقة المصطلحية في السياق النفسي.
      - >
        المعجم الطبي الموحد يُثبت «تَمْثِيلٌ عُصابِيّ؛ فِعْلٌ زَلَلِيّ» للمصطلح
        الإنجليزي «acting out» — بينما تستخدم المجموعة «تمثيل انفعالي»
        المختلف وصفياً، مما يستوجب التوثيق.
      - >
        «تنفيس حركي» مُثبَت في المعجم الطبي الموحد بمقابل «motor abreaction»
        لا «acting out» مباشرةً، وإن كان المفهومان متداخلين.
    observations: >
      المجموعة تُعالج مصطلحاً تقنياً دقيقاً من طب النفس التحليلي. «acting out»
      في الأدبيات الفرويدية هو تجسيد لاشعوري لصراعات مكبوتة عبر الفعل السلوكي
      بدلاً من الكلام؛ ويُعدُّ آلية دفاع وصورة من صور التنفيس العلاجي.
      اللمّة «تنفيس حركي» أدق في التعبير عن المفهوم لأنها تُركّز على الآلية
      (الإفراج عبر الحركة)، فيما تُركّز «تمثيل انفعالي» على الشكل الظاهري
      (الأداء الانفعالي). كلتاهما تمثّل جانباً مختلفاً من المفهوم.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
