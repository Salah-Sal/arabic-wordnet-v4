stage1_review:
  assessment:
    concerns:
      - "تعريف الشبكة 'دول أمريكا الوسطى مجتمعة' يعاني من الدوران، حيث استخدم اسم المنطقة لتعريفها."
    observations: "المفهوم يشير إلى الكيان الجيوسياسي والجغرافي لدول المنطقة الممتدة بين أمريكا الشمالية والجنوبية، ويُطلق على هذه المنطقة اسم (أمريكا الوسطى)."
  blind_candidates:
    - lemma: "أَمْرِيكَا الوُسْطَى"
      generation_method: tarkib
      justification: "تركيب وصفي مستقر في الجغرافيا السياسية للتعبير عن هذه المنطقة."
    - lemma: "دُوَلُ أَمْرِيكَا الوُسْطَى"
      generation_method: tarkib
      justification: "تركيب إضافي يركز على الكيان السياسي المكوّن من الدول نفسها عوضاً عن المنطقة الجغرافية المجردة."
    - lemma: "أَمِيرْكَا الوُسْطَى"
      generation_method: taarib
      justification: "صياغة بديلة لتعريب اسم 'أمريكا' مألوفة في الكتابات الصحفية."
    - lemma: "أَمْرِيكَا المَرْكَزِيَّة"
      generation_method: taarib
      justification: "ترجمة حرفية تستخدم أحياناً لوصف الموقع الجغرافي للمنطقة."

stage2_evidence:
  per_lemma:
    - lemma: "أمريكا الوسطى"
      confirm:
        - text: "«تطلق على الجزء الجنوبي من قارة أمريكا الشمالية الواقع إلى الجنوب من المكسيك, والذي يمتد إلى شمالي كولومبيا بأمريكا الجنوبية. تبلغ مساحتها ٢٢٨,٥٧٨ ميلا مربعا. وتتكون من ست جمهوريات هي: جواتيمالا, وهندوراس, والسلفادور, ونيكاراجوا, وكوستاريكا, وبنما»"
          source: "المعجم الكبير"
    - lemma: "أميركا الوسطى"
      confirm:
        - text: "«أميركا الوسطى: Central America»"
          source: "المكنز الزراعي متعدد اللغات"
    - lemma: "دول أمريكا الوسطى"
      evidence_status: "no_material_found"
    - lemma: "أمريكا المركزية"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أمريكا الوسطى"
      decision: confirmed
      decision_reason: "المصطلح الجغرافي والسياسي المعياري والمستقر للدلالة على هذه المنطقة ودولها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَمْرِيكَا الوُسْطَى"

    - lemma: "أميركا الوسطى"
      source: stage1
      decision: confirmed
      decision_reason: "بديل إملائي شائع الاستخدام في بعض الدول العربية والوكالات الإخبارية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "أَمِيرْكَا الوُسْطَى"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "دول أمريكا الوسطى"
      source: stage1
      decision: removed
      decision_reason: "تركيب إضافي حر لا يشكل وحدة معجمية مستقلة بل يُفهم من ضم الكلمتين."

    - lemma: "أمريكا المركزية"
      source: stage1
      decision: removed
      decision_reason: "ترجمة حرفية غير شائعة ولا ترقى لتكون مصطلحاً جغرافياً مستقراً."

stage4_content:
  definition:
    current: "دول أمريكا الوسطى مجتمعة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعاني من الدوران باحتوائه على مصطلح (أمريكا الوسطى) نفسه، ويجب توضيح الموقع الجغرافي لتعريف المفهوم بدقة."
    authored:
      - type: encyclopedic
        text: "المنطقة الجغرافية ودولها مجتمعة، والتي تمتد من جنوبي المكسيك في أمريكا الشمالية إلى الحدود الشمالية لكولومبيا في أمريكا الجنوبية."
  examples:
    per_lemma:
      - lemma: "أمريكا الوسطى"
        examples:
          - text: "تسعى دول أَمْرِيكَا الوُسْطَى إلى تعزيز التكامل الاقتصادي والتبادل التجاري بينها."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "المنطقة الجغرافية ودولها مجتمعة، والتي تمتد من جنوبي المكسيك في أمريكا الشمالية إلى الحدود الشمالية لكولومبيا في أمريكا الجنوبية."
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تسعى دول أَمْرِيكَا الوُسْطَى إلى تعزيز التكامل الاقتصادي والتبادل التجاري بينها."

