stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «قدرة مطلقة» مكتوبة بدون تشكيل كامل"
      - "المجموعة تقتصر على لمّة واحدة لمفهوم كلامي جوهري تتعدد تسمياته في التراث"
      - "التعريف الحالي يبدو ترجمةً حرفية للإنجليزي بدلاً من صياغة معجمية أصيلة"
      - "«قدرة مطلقة» موجودة في بعض المعاجم بمعنى فقهي مختلف (أدنى قدرة للتكليف) مما يُثير احتمال التباس الدلالة"
    observations: >
      المجموعة تُعبِّر عن مفهوم «القدرة الإلهية الكاملة» (Omnipotence)، وهو مفهوم مركزي
      في علم الكلام الإسلامي وفلسفة الدين. التراث العربي غنيٌّ بمصطلحات هذا المجال
      (الجبروت، القادر، القدير، القدرة الكلية)، مما يعني أن المجموعة تحتاج إثراءً.
      الجذر (قدر) منتج صرفياً ويُتيح مشتقات متعددة. يُلاحظ غياب «القدرة الكلية»
      التي تردُ في المعاجم المعاصرة مكافئاً مباشراً لـ«omnipotence».

  blind_candidates:
    - lemma: "الجَبَرُوت"
      generation_method: majaz
      justification: >
        إحياء لفظ تراثي راسخ؛ الجبروت في أصله العربي يدل على جنس من العظمة والعلو
        والقهر الإلهي المطلق، وقد استُعمل في الحديث النبوي والشعر القديم دالاً على
        السلطان الأعلى الذي لا يُقهر. وجهُ المجاز: القدرة المطلقة هي الجبروت الإلهي
        بعينه، فأُعيد إحياء اللفظ في هذا الإطار الكلامي.

    - lemma: "القَدِيرِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «قَدِير» (صيغة مبالغة من قادر، أي البالغ الذروة في القدرة)
        على وزن فَاعِلِيَّة. يدل على «حالة كون الكيان قديراً»، وهو وزن منتج لتحويل
        الصفات إلى مفاهيم مجردة (حرية ← حرّ، قادرية ← قادر). الجذر قدر معروف
        وصيغة المبالغة قدير من أسماء الله الحسنى.

    - lemma: "القُدْرَةُ الكُلِّيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي (wasfi) من «القُدْرَة» + «الكُلِّيَّة» (نسبة إلى «كل» بمعنى الإحاطة
        والشمول). يعني القدرة الشاملة لكل الأشياء. اختبار التثبيت: «الكلية» لا يمكن
        إبدالها بمرادف وصفي حر دون أن يتغير الاصطلاح، مما يُشير إلى وحدة لغوية متماسكة
        في سياق الخطاب الكلامي.

    - lemma: "الاقْتِدَارُ الْمُطْلَق"
      generation_method: tarkib
      justification: >
        مركب وصفي (wasfi) من «الاقتدار» (مصدر افتعال من قدر، بمعنى القدرة التامة
        والتمكّن الكامل) + «المطلق» (غير المقيّد بشيء). يجمع بين معنى امتلاك القدرة
        (اقتدار) وانعدام القيود عنها (مطلق)، ليُعبِّر عن الحالة الكاملة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "قدرة مطلقة"
      contradicts:
        - text: >
            «قدرَة مُطلقَة: لِأَنَّهَا غير مُقَيّدَة بِصفة الْيُسْر والسهولة وَهِي
            أدنى قُوَّة يتَمَكَّن بهَا الْمَأْمُور من أَدَاء مَا لزمَه بدنيا أَو ماليا.
            وَهَذَا النَّوْع من الْقُدْرَة شَرط فِي كل أَمر احْتِرَازًا عَن تَكْلِيف
            مَا لَيْسَ فِي الوسع.»
          source: "دستور العلماء للأحمدنكري"
          conflict: >
            المعنى هنا فقهي أصولي (القدرة التي يُشترط وجودها للتكليف الشرعي)، وهو
            مختلف اختلافاً جوهرياً عن «omnipotence» الكلامي (القدرة الإلهية المطلقة
            الشاملة). اللمّة محلولة الدلالة في هذا المعجم لسياق التكليف لا القدرة الإلهية.

    - lemma: "الجَبَرُوت"
      confirm:
        - text: >
            «الجبروت: الكِبْرُ والعَظَمَةُ والجلالةُ العتُوُّ والقَهْرُ»
          source: "المعجم الكبير"
        - text: >
            «الجبروت: [في الإنكليزية] The all-mighty, constraint [في الفرنسية]
            La Toute-puissance, contrainte — عند الصوفية عبارة عن الذات القديمة
            وهي صيغة المبالغة بمعنى الجبر... والجبَّار الملك تعالى كبرياؤه متفرّد
            بالجبروت لأنه يجري الأمور مجاري أحكامه، ويجبر الخلق على مقتضيات إلزامه»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: >
            «الجبروت: عند أبي طالب المكي عالم العظمة أي عالم الأسماء والصفات الإلهية»
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: >
            يكشف أن «الجبروت» في الاصطلاح الصوفي الكلامي يُشير إلى عالم الصفات الإلهية،
            مما يُقرِّبه من فضاء القدرة الإلهية لكنه يُبعده عن الدلالة الدقيقة لـ«omnipotence».
        - text: >
            «(جَبَرَ) الْجِيمُ وَالْبَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ جِنْسٌ مِنَ
            الْعَظَمَةِ وَالْعُلُوِّ وَالِاسْتِقَامَةِ... وَذُو الْجَُبُّورَةِ وَذُو
            الْجَبَرُوتِ: اللَّهُ جَلَّ ثَنَاؤُهُ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يُثبت أن الجبروت في أصل الوضع العربي خاصٌّ بالله تعالى، وأنه يدل على
            العظمة والعلو — وهي قيم مرتبطة بالقدرة المطلقة وإن لم تطابقها.

    - lemma: "القَدِيرِيَّة"
      contradicts:
        - text: >
            «قَدِيرية: من (ق د ر) مؤنث قَدِيري نسبة إلى قَدِير»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            اللفظ مسجَّل في المعاجم بوصفه اسم علم (علَماً على مؤنث)، لا مصدراً صناعياً
            دالاً على المفهوم الكلامي. يعني أن اللمّة المقترحة غير ثابتة معجمياً
            بالمعنى المطلوب.

    - lemma: "القُدْرَةُ الكُلِّيَّة"
      confirm:
        - text: >
            «(1) القُدْرة الكُلّية (2) قوّة كُلِّية القُدْرة»
          source: "المورد الحديث (2008) — ترجمة omnipotence"

    - lemma: "الاقْتِدَارُ الْمُطْلَق"
      contradicts:
        - text: >
            «الاقتدار: هو عند البلغاء أن يبرز المتكلم المعنى الواحد في عدة صور اقتداراً
            منه على نظم الكلام وتركيبه وعلى صياغة قوالب المعاني والإعراض»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            «الاقتدار» في الاستعمال المصطلحي يُعبِّر عن مقدرة بلاغية لا عن قدرة
            إلهية مطلقة، مما يُشير إلى تحميل خاطئ لو أُريد به «omnipotence».


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "قدرة مطلقة"
      decision: confirmed
      decision_reason: >
        رغم أن الدليل المعجمي الوحيد (دستور العلماء) يُورد المصطلح في سياق فقهي مغاير،
        إلا أن «قدرة مطلقة» تُمثِّل تعبيراً عربياً متداولاً في الخطاب الكلامي الفلسفي
        المعاصر للتعبير عن «omnipotence»؛ وهو مركب وصفي ثابت يجتاز اختبار السك
        (لا يمكن استبدال «مطلقة» بمرادف وإبقاء المصطلح الاصطلاحي). يُحتفظ به مع
        تصحيح التشكيل الكامل الإلزامي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تُبرز انعدامَ القيود والتحديد؛ «مطلق» من الإطلاق أي الإرسال وعدم التقييد،
        فدلالتها على نفي الحدود عن القدرة أقوى من دلالتها على الشمول الإيجابي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُدْرَة مُطْلَقَة"

    - lemma: "الجَبَرُوت"
      source: stage1
      decision: removed
      decision_reason: >
        رغم قوة الشاهد المعجمي (التهانوي يُعادله بـ«La Toute-puissance» وابن فارس
        يربطه بصفة الله)، إلا أن «الجبروت» يحمل أعباءً دلالية ثلاثة تُعيق استخدامه
        لمّةً لـ«omnipotence»: (أ) في المعجم الوسيط المعاصر يُعرَّف فقط بـ«القهر»
        بلا ذكر للشمول أو اللاتحديد، (ب) في الاصطلاح الصوفي الكلامي هو «عالم الأسماء
        والصفات» بمعنى كوني خاص لا كيفية وصفية، (ج) الاستخدام العامي المعاصر يُحيل
        إلى البطش والتسلط لا القدرة الشاملة. التحديد الدلالي الضروري لشبكة معجمية
        يستلزم إبعاده.

    - lemma: "القَدِيرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود للمصطلح في المعاجم بالمعنى الكلامي المطلوب؛ الشاهد الوحيد (موسوعة
        السلطان قابوس) يُسجِّله اسم علَم مؤنثاً، لا مصدراً صناعياً للمفهوم.
        اللمّة لا تجتاز اختبار التثبيت المعجمي.

    - lemma: "القُدْرَةُ الكُلِّيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        ثابتة معجمياً بوصفها الترجمة العربية الرسمية لـ«omnipotence» في المورد الحديث
        (2008)، وهو معجم عربي-إنجليزي معياري. مركب وصفي (wasfi) يجتاز اختبار السك:
        «الكلية» دالة بالتحديد على الشمول والإحاطة بكل الأشياء، ولا تُبدَّل
        بـ«الشاملة» أو «العامة» دون تغيير المصطلح الاصطلاحي. تكمّل «قُدْرَة مُطْلَقَة»
        بإضافة بُعد الشمول الإيجابي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تُبرز الشمولَ والإحاطة؛ «كلي» من «كل» الدال على الإحاطة بجميع الأشياء
        (ابن فارس: «كل: اسم موضوع للإحاطة»)، فدلالتها على استيعاب القدرة لكل
        الممكنات أقوى من دلالتها على انعدام القيود.
      actions:
        - command: create_entry
          params:
            lemma: "القُدْرَة الكُلِّيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14482633-n"

    - lemma: "الاقْتِدَارُ الْمُطْلَق"
      source: stage1
      decision: removed
      decision_reason: >
        «الاقتدار» في المعجمية العربية يُستعمل في سياق بلاغي خاص (قدرة المتكلم
        على التصرف في الصياغة)، وهو ما يُثبته شاهد التهانوي. لا يوجد شاهد
        معجمي يُعادله بـ«omnipotence»، فضلاً عن أن الإضافة تُنتج تركيباً
        لا يتميز اصطلاحياً عن «قدرة مطلقة» الموجودة.


