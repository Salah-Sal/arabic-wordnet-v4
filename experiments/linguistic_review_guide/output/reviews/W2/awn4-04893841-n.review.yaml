stage1_review:
  assessment:
    concerns:
      - "اللمة 'كوبياء' خطأ مطبعي واضح والصواب 'كبرياء'."
      - "التعريف الحالي مترجم حرفياً وبشكل ركيك من الإنجليزية (التحفز بكراهية النزول)."
    observations: "المفهوم يتعلق بالكرامة واحترام الذات والترفع عن الدنايا. الألفاظ العربية التراثية غنية جداً في هذا الحقل الدلالي مثل الأنفة والإباء والعزة، وهي أقدر على نقل الدلالة من الترجمة الحرفية."
  blind_candidates:
    - lemma: "أَنَفَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الفعل أنف، وتعبر بدقة عن كراهية الإتيان بما يشين والترفع عنه."
    - lemma: "عِزَّة"
      generation_method: ishtiqaq
      justification: "تشير إلى القوة والمنعة النفسية والامتناع عن الذل."
    - lemma: "إِبَاء"
      generation_method: ishtiqaq
      justification: "مشتقة من الفعل أبى، وتعني شدة الامتناع ورفض الضيم."
    - lemma: "تَرَفُّع"
      generation_method: ishtiqaq
      justification: "يعبر عن التنزه والعلو عن الصغائر وما يحط من قدر الإنسان."

stage2_evidence:
  per_lemma:
    - lemma: "عزة نفس"
      confirm:
        - text: "عزة النفس: شرف النفس وكرامتها"
          source: "تكملة المعاجم العربية لدوزي (عن بوشر)"
        - text: "شَهَامَة: عزة النفس، أنفة، إباء. وفي محيط المحيط: الشهامة عند المولدين عزة النفس وترفعها عن الخسائس."
          source: "تكملة المعاجم العربية لدوزي"
    - lemma: "فخر"
      confirm:
        - text: "الْفَخْرُ: التَّمَدُّحُ بالخِصالِ،كالافْتِخارِ... وفَخِرَ، كفَرِحَ: أنِفَ."
          source: "القاموس المحيط للفيروزآبادي"
      expands:
        - text: "الفخر: التطاول على الناس بتعديد المناقب."
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يميل عادة إلى معنى المباهاة والاعتزاز الخارجي أكثر من مجرد الكرامة الداخلية."
    - lemma: "كوبياء"
      contradicts:
        - text: ""
          source: ""
          conflict: "الكلمة غير موجودة في المعاجم، وهي خطأ إملائي صريح للمة 'كبرياء'."
    - lemma: "كبرياء"
      confirm:
        - text: "(الْكِبْرِيَاء) العظمة والتجبر والترفع عَن الانقياد وَالْملك"
          source: "المعجم الوسيط"
    - lemma: "أنفة"
      confirm:
        - text: "(الأنفة) الْعِزَّة وَالْحمية"
          source: "المعجم الوسيط"
        - text: "أنفة الشيء: ابتداؤه الاستكبار الحمية"
          source: "المعجم الكبير"
    - lemma: "إباء"
      confirm:
        - text: "الأنفة والامتناع."
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "الإباء: شدة الامتناع، وكل أباء امتناع ولا عكس، ورجل أبي: يأبى تحمل الضيم."
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "ترفع"
      confirm:
        - text: "(ترفع) ارْتَفع وَعنهُ تنزه"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "عزة نفس"
      decision: confirmed
      decision_reason: "تعبير دقيق ومطابق تماماً لمعنى الترفع عن الدنايا واحترام معايير الذات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عِزَّةُ نَفْس"
    - lemma: "فخر"
      decision: confirmed
      decision_reason: "رغم أن دلالتها الأغلب هي المباهاة، إلا أنها تستعمل أيضاً بمعنى الأنفة والاعتزاز القوي بالنفس، وهي الترجمة الشائعة لـ Pride."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَخْر"
    - lemma: "كوبياء"
      decision: removed
      decision_reason: "خطأ إملائي صرف، والصواب كبرياء."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "كبرياء"
      source: stage1
      decision: confirmed
      decision_reason: "تصحيح للخطأ المطبعي، وتعبر عن الترفع الشديد والعظمة الداخلية ورفض الانقياد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "كِبْرِيَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "أَنَفَة"
      source: stage1
      decision: confirmed
      decision_reason: "من أدق الألفاظ العربية في التعبير عن كراهية الإتيان بما يشين والترفع عن الدنايا، مما يطابق التعريف الإنجليزي بدقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَنَفَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "إِبَاء"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي للأنفة، ويركز على قوة الامتناع ورفض التنازل عن المبادئ ورفض الضيم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "إِبَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "تَرَفُّع"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الحالة النفسية للتنزه عن الصغائر، وهو مكون أساسي في مفهوم المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَرَفُّع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "سمة التحفز بكراهية النزول عن معايير المرء"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك جداً ومترجم ترجمة حرفية غير دقيقة. يتطلب صياغة عربية أصيلة تعبر عن الأنفة والترفع بصورة صحيحة."
    authored:
      - type: terminological
        text: "صفة تدفع المرء إلى الترفع عما يحط من قدره، والأنفة من النزول عن مبادئه وكرامته."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "شعور بالكرامة واحترام الذات يمنع الإنسان من الإتيان بالدنايا أو قبول المهانة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صفة تدفع المرء إلى الترفع عما يحط من قدره، والأنفة من النزول عن مبادئه وكرامته."
