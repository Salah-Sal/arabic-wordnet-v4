# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. اللمّات المرشّحة — توليد عمياء من التعريف فقط
  #    (قبل الاطلاع على synset_info الكامل)
  blind_candidates:
    - lemma: "اِسْتِعْصَاء"
      generation_method: ishtiqaq
      justification: >
        مصدر استفعال من جذر (عصو/عصي)؛ يُقال «استعصى الشيءُ عليه» أي أبى الانقياد
        ولم يقبل الحل. الوزن استفعال دالٌّ على الطلب والمبالغة في التعصّي، وهو مناسب
        لوصف الخاصية التي تتسم بها المشكلة عند استعصائها على أي حل.

    - lemma: "اِسْتِغْلَاق"
      generation_method: majaz
      justification: >
        مجاز من «غَلِقَ الشيء» بمعنى لم يُتَخَلَّص منه. الإزاحة الدلالية من
        الإغلاق الحسّي (الباب المغلق) إلى الإغلاق المعرفي (المشكلة التي لا
        تنفتح على الحل). ابن فارس: «كل شيء لم يُتَخَلَّص فقد غلِق».

    - lemma: "عُسْرُ الحَلِّ"
      generation_method: tarkib
      justification: >
        مركب إضافي من (عُسْر + الحَلّ). عسر الجذر يدل على الصعوبة والشدة
        والالتواء (مقاييس اللغة)، والمركب يُعبّر عن الوصف الكلي للمسألة
        المتعذّرة الحل.

    - lemma: "تَعَذُّرُ الحَلِّ"
      generation_method: tarkib
      justification: >
        مركب إضافي من (تعذُّر + الحلّ). «تعذَّر الأمرُ» = لم يستقم وشقَّ
        وتعسَّر. المصدر تعذُّر يحمل معنى التحوّل إلى حال التعذّر والإباء.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        اللمّة «عدم قابلية الحل» تركيبٌ ثلاثي المكوّنات (عدم + قابلية + الحل)
        يفشل اختبار السكّ: يمكن إبدال «الحل» بـ«الفهم» أو «القياس» ويبقى
        التركيب وارداً، مما يعني غياب التثبيت المعجمي وضعف الاصطلاحية.
      - >
        التباس دلالي محتمل بين «insolubility» بمعنى عدم قابلية الذوبان
        الكيميائي (dissolution)، وهو الشائع في المعاجم التقنية، و«insolubility»
        بمعنى عدم قابلية الحل المعرفي (solving) المقصود هنا. «عدم قابلية
        الحل» يوحي بالمعنيين معاً.
      - >
        كلتا اللمّتين مجرَّدتان من التشكيل الكامل، خلافاً لمتطلبات AWN4.
      - >
        التعريف الحالي مبنيٌّ على ترجمة شبه حرفية للإنجليزي بأسلوب ركيك:
        «الخاصية... التي تجعل من المستحيل حلها» — يحتاج صياغةً بأسلوب
        المعجم الوسيط.

    observations: >
      المجموعة تصف مفهوماً معرفياً/منطقياً: «خاصية المشكلة أو الصعوبة التي
      تستعصي على أي حل». هذا المفهوم حاضر في التراث العربي ضمن مفاهيم
      «المعضلات» و«المستعصيات»، لكنه لم يحظَ بتسمية مفردة مستقرة على مستوى
      مصطلح معجمي ثابت. «استحالة الحل» مركّب إضافي مقبول وصحيح بنيةً، غير
      أنه يحتمل تأويلاً حرفياً («الاستحالة» = التحوّل، وهو غير المقصود).
      المصطلح الأكثر إيجازاً وإيفاءً هو «الاستعصاء» المشتقّ من جذر عريق
      دالٍّ على الإباء والعصيان.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "استحالة الحل"
      expands:
        - text: >
            «(1) لا يُفسَّر؛ لا يُحَلّ insoluble problems
            (2) غير ذوّاب؛ غير قابل للذوبان an insoluble salt»
          source: "المورد الحديث (2008)"
          addition: >
            يُثبت أن المعنى اللغوي الأول لـ insoluble هو «لا يُحَلّ»، مما يدعم
            المسار الدلالي لـ «استحالة الحل» في هذا السياق المعرفي. كما يكشف عن
            الالتباس بالمعنى الكيميائي (عدم الذوبان) في المعنى الثاني.
        - text: >
            «الْحَاءُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ تَحَرُّكٌ فِي
            دَوْرٍ. فَالْحَوْلُ الْعَامُ، وَذَلِكَ أَنَّهُ يَحُولُ، أَيْ يَدُورُ...
            وَحَالَ الشَّخْصُ يَحُولُ، إِذَا تَحَرَّكَ، وَكَذَلِكَ كُلُّ مُتَحَوِّلٍ
            عَنْ حَالَةٍ»
          source: "مقاييس اللغة لابن فارس (جذر حول، entry_id 986002)"
          addition: >
            جذر «استحالة» هو (حول) الدال على التحرك والتحوّل؛ «استحال الشيءُ»
            أي تحوّل إلى حال الاستحالة. يُثبت أن المصدر عربي أصيل.
        - text: >
            «الْحَاءُ وَاللَّامُ لَهُ فُرُوعٌ كَثِيرَةٌ وَمَسَائِلُ، وَأَصْلُهَا
            كُلُّهَا عِنْدِي فَتْحُ الشَّيْءِ، لَا يَشِذُّ عَنْهُ شَيْءٌ. يُقَالُ
            حَلَلْتُ الْعُقْدَةَ أَحُلُّهَا حَلًّا»
          source: "مقاييس اللغة لابن فارس (جذر حلل، entry_id 985942)"
          addition: >
            جذر «الحل» هو (حلل) الدال على فتح الشيء وانحلاله. «استحالة الحل»
            = استحالة الفتح والانحلال — الدلالة سليمة.

    - lemma: "عدم قابلية الحل"
      expands:
        - text: >
            «عدم قابلية الذوبان»
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)، ترجمة insolubility"
          addition: >
            يُثبت أن الهيكل «عدم قابلية + الاسم» مستخدَم في المعاجم التقنية،
            لكن في سياق الذوبان الكيميائي لا الحل المعرفي. المقابلة غير مضبوطة
            للسياق المقصود.
        - text: >
            «لَاانْحِلَالِيَّة»
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)، ترجمة insolubility"
          addition: >
            كشف في المعاجم التقنية عن صيغة «لا-انحلالية» كبديل مُوحَّد
            لـ insolubility في الكيمياء/الصيدلة — وهو مصطلح أكثر إحكاماً
            وإن كان في غير سياق هذه المجموعة.

    # ── مرشحات المرحلة ١ ──

    - lemma: "اِسْتِعْصَاء"
      confirm:
        - text: >
            «(1) عِناد
            (2) استعصاء المرض على العِلاج»
          source: "المورد الحديث (2008)، ترجمة obstinacy"
        - text: >
            «تمرُّد؛ حُرون؛ استعصاء إلخ»
          source: "المورد الحديث (2008)، ترجمة recalcitrance"
        - text: >
            «لِحَدِّ اسْتِعْصَاءِ تَرْجَمَتِهِ إِلَى كَلِمَاتٍ»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)، ضمن تعريف dream"
        - text: >
            «تمسُّك، لزوب، استعصاء»
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)، ترجمة tenacity"
      expands:
        - text: >
            «اسْتَعْصى عليه: تَعَصَّى»
          source: "المعجم الوسيط (OCR)"
          addition: >
            يُثبت أن المصدر «استعصاء» مشتق من فعل «استعصى» الموثَّق في أشهر
            المعاجم العربية الحديثة بمعنى التعصّي والإباء.

    - lemma: "اِسْتِغْلَاق"
      contradicts:
        - text: >
            «طابع علامة أو تعبير لا يُفهم أو يُدرَك بطريقة مُشوِّشة تُخفي
            دلالته، والكلمة مجهولة عند المتلقي لأنها خارج الإجادة في النص الشعري»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)، ترجمة opacity"
          conflict: >
            «استغلاق» مسجَّل بمعنى الغموض اللساني (opacity)، أي إخفاء
            الدلالة، وليس بمعنى استعصاء الحل المعرفي.
        - text: >
            «امتناع عضل القناة الهضمية عن الارتخاء في مواضع التقاء بعض
            أجزائها ببعض»
          source: "معجم المصطلحات الطبية ج.1 (1985)، ترجمة achalasia"
          conflict: >
            «استغلاق» الطبي يعني انسداداً عضلياً محدداً — يتعارض مع
            استخدامه مصطلحاً معرفياً لاستحالة الحل.
      expands:
        - text: >
            «الْغَيْنُ وَاللَّامُ وَالْقَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ
            عَلَى نُشُوبِ شَيْءٍ فِي شَيْءٍ... وَكُلُّ شَيْءٍ لَمْ يُتَخَلَّصْ
            فَقَدْ غَلِقَ»
          source: "مقاييس اللغة لابن فارس (جذر غلق، entry_id 987958)"
          addition: >
            الأصل المعجمي للجذر يدعم المجاز (ما لا يمكن التخلص منه)، لكن
            المصطلحات المسجَّلة في المعاجم التقنية تقطع الصلة بالمعنى
            المقصود هنا.

    - lemma: "عُسْرُ الحَلِّ"
      expands:
        - text: >
            «الْعَيْنُ وَالسِّينُ وَالرَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ
            عَلَى صُعُوبَةٍ وَشِدَّةٍ. فَالْعُسْرُ: نَقِيضُ الْيُسْرِ...
            وَالْعَسَرُ: الْخِلَافُ وَالِالْتِوَاءُ»
          source: "مقاييس اللغة لابن فارس (جذر عسر، entry_id 987711)"
          addition: >
            الجذر يدل على الصعوبة والالتواء لا على الاستحالة التامة، مما يُميّز
            «عسر الحل» عن «استحالة الحل» دلالياً.

    - lemma: "تَعَذُّرُ الحَلِّ"
      confirm:
        - text: >
            «عليه الأمرُ: شقَّ وتعسَّر»
          source: "المعجم الوسيط (OCR)"
        - text: >
            «(تعذر) عَن الأمر تأخّر... وعليه الأمر شقَّ وتعسّر»
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
      expands:
        - text: >
            «وَبَابٌ آخَرُ لَا يُشْبِهُ الَّذِي قَبْلَهُ: تَعَذَّرَ الْأَمْرُ،
            إِذَا لَمْ يَسْتَقِمْ. قَالَ امْرُؤُ الْقَيْسِ:
            وَيَوْمًا عَلَى ظَهْرٍ الْكَثِيبِ تَعَذَّرَتْ ... عَلَيَّ وَآلَتْ
            حَلْفَةً لَمْ تَحَلَّلِ»
          source: "مقاييس اللغة لابن فارس (جذر عذر، entry_id 987711)"
          addition: >
            «تعذّر» عند ابن فارس = لم يستقم، وهو ما يقترب من معنى استحالة
            الحل، لكنه باب مستقل «لا يُشبه الذي قبله» مما يُشير إلى عدم
            إدراجه تحت الأصل الأساسي للجذر.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "استحالة الحل"
      decision: confirmed
      decision_reason: >
        مركب إضافي من كلمتين (استحالة + الحل) بنيةً سليمة وجذران عربيان
        أصيلان. «استحالة» من جذر (حول) الدال على التحوّل، و«الحل» من جذر
        (حلل) الدال على فتح الشيء. اختبار السكّ مُجتاز: إبدال «الحل»
        بـ«الفهم» أو «التطبيق» يُغيّر المعنى كلياً ← «الحل» فصل نوعي
        ضروري. المصطلح مقبول ويحتاج فقط إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على وصف خاصية المشكلة من منظور «الاستحالة» الذهنية الكلية —
        الحالة المطلقة من عدم القابلية للحل، بصرف النظر عن الطريقة أو
        الأسلوب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِحَالَةُ الحَلِّ"

    - lemma: "عدم قابلية الحل"
      decision: removed
      decision_reason: >
        تركيب ثلاثي المكوّنات (عدم + قابلية + الحل) يفشل اختبار السكّ:
        يمكن إبدال «الحل» بـ«الفهم» أو «القياس» وتبقى الصياغة واردة
        وصفياً ← غياب التثبيت المعجمي. لا يظهر في أي معجم متخصص
        كمصطلح مسكوك في سياق الحل المعرفي (solving). يُضاف إلى ذلك
        التباس دلالي مع «insolubility» الكيميائية (عدم الذوبان).
        «اِسْتِحَالَةُ الحَلِّ» و«اِسْتِعْصَاء» تُغنيان عنه.

    # ── مرشحات المرحلة ١ ──

    - lemma: "اِسْتِعْصَاء"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصدر استفعال من جذر (عصو/عصي) صحيح بنيةً وأصيل دلالةً. موثَّق
        في المعاجم الحديثة باستخدامات مشابهة (استعصاء المرض، استعصاء
        الترجمة، استعصاء الشيء على المعالجة). كلمة واحدة تُيسّر التداول
        وتجتاز بوابات جودة المصطلح (الاطراد، يُسر التداول، إيثار التراثي،
        الاشتقاقية). يُضيف فارقاً دلالياً واضحاً عن «استحالة الحل» —
        يُركّز على البُعد الديناميكي للمشكلة التي تعصي الحل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الحالة الديناميكية التي تصف المشكلة بوصفها «تعصي»
        الحل وتأبى الانقياد — أي يُبرز طبيعة فعل الإباء لا مجرد
        وصف الاستحالة الكلية.
      actions:
        - command: create_entry
          params:
            lemma: "اِسْتِعْصَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اِسْتِغْلَاق"
      source: stage1
      decision: removed
      decision_reason: >
        مسجَّل في المعاجم التقنية بمعنيين مغايرين: «opacity» في اللسانيات
        (غموض العلامة) و«achalasia» في الطب (انسداد عضلي). هذه
        المعاني تتعارض مع المقصود ولو بالمجاز البعيد. الحمولة الدلالية
        المسجَّلة تُشكّل عائقاً أمام استعماله مصطلحاً للاستحالة المعرفية.

    - lemma: "عُسْرُ الحَلِّ"
      source: stage1
      decision: removed
      decision_reason: >
        «عسر» يدل على الصعوبة والشدة لا الاستحالة التامة (مقاييس: «يَدُلُّ
        عَلَى صُعُوبَةٍ وَشِدَّةٍ»). الفرق دلالي جوهري: «unsolvability» =
        استحالة مطلقة، بينما «عسر الحل» = صعوبة شديدة قد تُحَلّ بمزيد
        جهد. خلط الاثنين يُفضي إلى تضليل دلالي.

    - lemma: "تَعَذُّرُ الحَلِّ"
      source: stage1
      decision: removed
      decision_reason: >
        وإن كان «تعذّر» يصل أحياناً إلى معنى الاستحالة، فإن الاستخدام
        الشائع يُرجِّح معنى الصعوبة الشديدة لا الاستحالة المطلقة. يتداخل
        مع «استحالة الحل» دون أن يُضيف فارقاً دلالياً حاداً يستوجب
        إدراجه في المجموعة. ويُضاف أن «تعذّر» متاح للحل الجزئي بعد
        إزالة العائق، خلافاً لـ «استحالة الحل».

  # إجراء على مستوى المجموعة
  synset_actions:
    - command: remove_sense
      params:
        sense_id: "{auto}"
        # المقصود: إزالة ارتباط «عدم قابلية الحل» بالمجموعة


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:

  definition:
    current: "الخاصية (لمشكلة أو صعوبة) التي تجعل من المستحيل حلها"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للإنجليزي، أسلوبه ركيك (التكرار
        في «الخاصية... التي تجعل من المستحيل حلها»)، ويفتقر إلى الجنس
        القريب الدقيق والفصل النوعي الواضح بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: >
