stage4_content:
  definition:
    current: "الناس في مجتمع يُنظر إليهم كنظام منظم بنمط مميز من العلاقات"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكنه يركز على الأشخاص أكثر من الهيكل. يفضل صياغته ليعبر عن الشبكة العلائقية والنمط المنظم."
    authored:
      - type: terminological
        text: "هيكل العلاقات المستقرة والأنماط التفاعلية المنظمة بين الأفراد والجماعات التي تشكل وحدة اجتماعية متكاملة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08395550-n", definition_index: 0, text: "هيكل العلاقات المستقرة والأنماط التفاعلية المنظمة بين الأفراد والجماعات التي تشكل وحدة اجتماعية متكاملة."}
  examples:
    per_lemma:
      - lemma: "بِنْيَةٌ اجْتِمَاعِيَّة"
        examples:
          - text: "تحدد البنية الاجتماعية في هذا المجتمع الأدوار والمسؤوليات المنوطة بكل فرد."
            type: usage
      - lemma: "تَنْظِيمٌ اجْتِمَاعِيّ"
        examples:
          - text: "يعتبر التدرج الطبقي أحد أشكال التنظيم الاجتماعي المعقدة."
            type: usage
      - lemma: "نِظَامٌ اجْتِمَاعِيّ"
        examples:
          - text: "يسعى النظام الاجتماعي إلى تحقيق التوازن والاستقرار من خلال مجموعة من القواعد الملزمة."
            type: usage
      - lemma: "نَسَقٌ اجْتِمَاعِيّ"
        examples:
          - text: "درس الباحثون النسق الاجتماعي للقرية باعتباره نظاماً مغلقاً يحافظ على تقاليده."
            type: usage
      - lemma: "بِنَاءٌ اجْتِمَاعِيّ"
        examples:
          - text: "يعكس البناء الاجتماعي توزيع القوة والثروة داخل الدولة."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-08395550-n", text: "تؤثر البنية الاجتماعية السائدة على وتيرة التغير الثقافي في المجتمع."}

