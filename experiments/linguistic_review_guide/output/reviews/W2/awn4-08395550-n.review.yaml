stage1_review:
  assessment:
    concerns:
      - اللمات الموجودة كافية ولكنها لا تغطي كافة الاصطلاحات السوسيولوجية الشائعة مثل "نسق اجتماعي" و"نظام اجتماعي".
    observations: "المفهوم يشير إلى 'البنية الاجتماعية' (Social Structure) و'النظام الاجتماعي' (Social System). اللمات الموجودة صحيحة لغوياً واصطلاحياً، ولكن ينقصها بعض المرادفات التقنية المستخدمة في علم الاجتماع."
  blind_candidates:
    - lemma: "نِظَامٌ اجْتِمَاعِيّ"
      generation_method: ishtiqaq
      justification: "ترجمة اصطلاحية مباشرة لمصطلح Social system، وهو الأكثر شيوعاً في سياق النظم المنظمة."
    - lemma: "بِنْيَةٌ اجْتِمَاعِيَّة"
      generation_method: ishtiqaq
      justification: "ترجمة اصطلاحية لمصطلح Social structure، وتعبر عن الهيكل والنمط المميز للعلاقات."
    - lemma: "تَنْظِيمٌ اجْتِمَاعِيّ"
      generation_method: ishtiqaq
      justification: "ترجمة اصطلاحية لمصطلح Social organization، وتشير إلى الجانب الوظيفي والترتيبي للمجتمع."
    - lemma: "تَكْوِينٌ اجْتِمَاعِيّ"
      generation_method: ishtiqaq
      justification: "يشير إلى الهيئة التي يتشكل منها المجتمع وعلاقاته."

