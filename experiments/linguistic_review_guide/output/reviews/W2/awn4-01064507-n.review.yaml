    concerns:
      - "استخدام 'لا نَشَاط' وهو تعبير وصفي مركب، والأولى في المعاجم الألفاظ المفردة."
      - "الحاجة إلى إضافة مرادفات تعبر عن الجمود والتعطل الوظيفي."
    observations: "المجموعة تغطي مفهوم 'اللافعالية' أو نقص النشاط. اللمات الحالية صحيحة لكنها تفتقر إلى الشمولية لبعض السياقات التقنية (مثل الفيزياء) أو السياقات العامة (مثل الجمود)."
  blind_candidates:
    - lemma: "فُتُور"
      generation_method: ishtiqaq
      justification: "يدل على ضعف النشاط بعد قوة، ويستخدم طبياً وفيزيائياً."
    - lemma: "جُمُود"
      generation_method: ishtiqaq
      justification: "يعبر عن انعدام الحركة أو التغير، وهو مرادف قوي للركود في السياقات المعنوية والمادية."
    - lemma: "تَعَطُّل"
      generation_method: ishtiqaq
      justification: "يدل على توقف النشاط أو الوظيفة، ويناسب مفهوم inactivity."
    - lemma: "سُكُون"
      generation_method: majaz
      justification: "الحالة الأصلية المقابلة للحركة والنشاط."

