stage1_review:
  assessment:
    concerns:
      - "اللمّة «تَضَادّ» موجودة أيضاً في المجموعة الأعلى (awn4-13876846-n) مما قد يوحي بتكرار دلالي بين الأب والابن"
      - "اللمّة «تَنَافُر» معروفة في البلاغة والمعاني بمعنى ثقل اللفظ على اللسان، وهو معنى بعيد عن التضاد بين القوى والمبادئ"
    observations: "المجموعة تمثّل مفهوم العلاقة بين مبادئ أو قوى متعارضة (antagonism)، وهو أخصّ من مفهوم الأب (العلاقة بين الكيانات المتعارضة). التخصيص هنا في نوع المتعارضات: مبادئ وقوى وعوامل، لا كيانات عامّة. وجود تَضَادّ في كلتا المجموعتين مقبول دلالياً لأنّ اللفظ يحمل المعنيَيْن العامّ والخاصّ، لكنّ تَنَافُر تغلب عليه دلالة التنافر الصوتي في التراث البلاغي."
  blind_candidates:
    - lemma: "تَنَاقُض"
      generation_method: ishtiqaq
      justification: "من الجذر ن ق ض على وزن تَفَاعُل الدالّ على المشاركة، يفيد التدافع المتبادل بين طرفين؛ لكنّه أقرب إلى التعارض المنطقي منه إلى التضاد بين القوى"
    - lemma: "مُنَاهَضَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن ه ض على وزن مُفَاعَلَة، تفيد المقاومة المتبادلة والمعارضة الفاعلة بين قوّتين، وهي قريبة دلالياً من antagonism"
    - lemma: "تَعَانُد"
      generation_method: ishtiqaq
      justification: "من الجذر ع ن د على وزن تَفَاعُل، يفيد التمانع والمجاوزة المتبادلة؛ الجذر يدلّ على المجاوزة وترك الاستقامة عند ابن فارس"
    - lemma: "تَخَالُف"
      generation_method: ishtiqaq
      justification: "من الجذر خ ل ف على وزن تَفَاعُل، يفيد التعارض المتبادل؛ لكنّ المعاجم الحديثة خصّصته بالجيولوجيا (disconformity)"

stage2_evidence:
  per_lemma:
    - lemma: "تَضَادّ"
      confirm:
        - text: "«التضاد في اللغة بمعنى: العداوة مع الآخر، وعدم التّجانس والتنافي، وبمعنى عدم التوافق»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«كَون الشَّيْئَيْنِ الوجوديين مُتَقَابلين بِحَيْثُ لَا يكون تعقّل كلّ مِنْهُمَا بِالْقِيَاسِ إِلَى الآخر كَمَا بَيْنَ السّوَاد وَالْبَيَاض»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«(في المنطق): التَّقابلُ بين مَعْنَيَيْن يندرجان تحت جنسٍ واحدٍ, وبينهما بعضُ الخلافِ»"
          source: "المعجم الكبير"
        - text: "«الْأَمْرَانِ كَانَ أَحدهمَا ضد الآخر»"
          source: "المعجم الوسيط"
      expands:
        - text: "«تضاد = antagonism (في علم الأحياء، الفيزياء، الطبّ البيطري، البيئة)»"
          source: "مصطلحات ARABTERM المتعدّدة"
          addition: "المصطلح مستعمل في عدّة حقول علمية بمعنى الاصطلاحي المقابل لـ antagonism"

    - lemma: "تَنَافُر"
      confirm:
        - text: "«الْقَوْم تخاصموا وَتَفَاخَرُوا»"
          source: "المعجم الوسيط"
        - text: "«التنافر بمعنى التخاصم والتجافي، وهو قريب من المعنى القديم... وقد ورد هذا المعنى في المعاجم الحديثة كالوسيط والأساسي»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: "«وصف في الكلمة يوجب ثقلها على اللسان وعسر النطق بها، نحو: الهعخع، ومستشزرات»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "المعنى الاصطلاحي الأصلي للتنافر في البلاغة هو الثقل الصوتي لا التعارض بين القوى"
        - text: "«إِيرَاد الْكَلَام على وَجه لَا يسهل على اللِّسَان، إِمَّا لبعد شَدِيد بَين المخرجين، أَو لقرب بليغ بَينهمَا»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "تأكيد إضافي على أنّ التنافر مصطلح بلاغي متعلّق بثقل الألفاظ"
      expands:
        - text: "«التباعد والمخاصمة والتفاخر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يضيف معنى التباعد وهو أقرب لمفهوم الـ repulsion منه إلى الـ antagonism"

    - lemma: "تَنَاقُض"
      contradicts:
        - text: "«اختلاف قضيتين بالسلب والإيجاب بِحَيْثُ يَقْتَضِي لذاته أَن تكون إِحْدَاهمَا صَادِقَة وَالْأُخْرَى كَاذِبَة»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "التناقض مصطلح منطقي خاصّ بتعارض القضايا صدقاً وكذباً، لا بالتضاد بين القوى"
        - text: "«اختلاف قضيتين بإيجاب وسلب بحيث يقتضي لذاته صدق أحدهما وكذب الأخرى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "تأكيد لتخصيص المصطلح بالمنطق"

    - lemma: "مُنَاهَضَة"
      confirm:
        - text: "«مُناهَضَة؛تَضَادّ = antagonism»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَضادّ (مُناهَضَة) = counteraction (antagonism)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«معاكسة، تضادّ = antagonism»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«مُناهَضَةٌ جُرْثومِيَّة = bacterial antagonism» و«مُناهَضَةٌ اسْتِقْلابِيَّة = metabolic antagonism» و«مُناهَضَة فارماكولوجية = pharmacologic antagonism»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المصطلح منتج اشتقاقياً ومستعمل في تركيبات علمية متعددة"

    - lemma: "تَعَانُد"
      evidence_status: "no_material_found"

    - lemma: "تَخَالُف"
      contradicts:
        - text: "«(فى الجِيُولوجيا) disconformity: الدَّرَجَةُ العُلْيا من عدم التَّوافق»"
          source: "المعجم الكبير"
          conflict: "التخالف مصطلح جيولوجي متخصّص بعدم التوافق الطبقي، لا بالتضاد بين القوى"

