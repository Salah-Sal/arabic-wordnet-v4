      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"طالب","root":"طلب","maqayis":"«الطَّاءُ وَاللَّامُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ابْتِغَاءِ الشَّيْءِ.»"},{"word":"المشورة","root":"شور","maqayis":"«الشِّينُ وَالْوَاوُ وَالرَّاءُ أَصْلَانِ مُطَّرِدَانِ...»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"متلقي","root":"لقي","maqayis":"«اللَّامُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ... أَحَدُهَا اللِّقَاءُ...»"},{"word":"النصيحة","root":"نصح","maqayis":"«النُّونُ وَالصَّادُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى مُلَاءَمَةٍ بَيْنَ شَيْئَيْنِ وَإِصْلَاحٍ لَهُمَا.»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نصح","maqayis":"«النُّونُ وَالصَّادُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى مُلَاءَمَةٍ بَيْنَ شَيْئَيْنِ وَإِصْلَاحٍ لَهُمَا.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يدل على القبول والامتثال للنصيحة، وهو أبلغ من مجرد التلقي.","mwe":false}'
