step0_evidence:
  per_lemma:
    - lemma: "مُضِيف"
      confirm:
        - text: "«(المضيف) الَّذِي يَدْعُو الضيوف ويقربهم وَمن يقوم على خدمَة ركاب الطائرة والجلاس فِي الْمطعم»"
          source: "المعجم الوسيط"
        - text: "«المضيفُ: صاحبُ المنزلِ مَنْ يقومُ على خِدْمَةِ رُكَّابِ الطائرةِ, ورُكَّابِ بعض الحافلاتِ, والجُلَّاسِ في المطْعَمِ»"
          source: "المعجم الكبير"
    - lemma: "صَاحِب الدَّعْوَة"
      evidence_status: "no_material_found"

step05_lemma_generation:
  knowledge_candidates:
    - lemma: "صَاحِب الحَفْل"
      justification: "تركيب: مركب إضافي شائع الاستعمال للإشارة إلى الشخص المسؤول عن إقامة الحفل واستقبال ضيوفه (Host)."
    - lemma: "الدَّاعِي"
      justification: "اشتقاق: اسم فاعل من الفعل (دعا) بمعنى من يوجه الدعوة للضيوف لحضور المناسبة."
  generation_notes: "تم استبعاد (الداعي) لكونها عامة جداً دون تخصيص مقارنة بمركبات أخرى."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُضِيف"
      decision: confirmed
      decision_reason: "مصطلح فصيح ودقيق، وهو الأكثر شيوعاً للتعبير عن الشخص الذي يستقبل الضيوف في منزله أو في مناسبة اجتماعية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على من يستقبل الضيوف ويكرمهم في مكان إقامته أو حفله، مع التركيز على جانب الاستقبال والضيافة."
      example: "استقبل المُضِيف ضيوفه بحفاوة في مدخل المنزل."
    - lemma: "صَاحِب الدَّعْوَة"
      decision: confirmed
      decision_reason: "تعبير مركب (إضافي) فصيح ومستعمل بكثرة في سياق المناسبات للإشارة إلى من وجّه الدعوة للضيوف، وهو مفهوم مطابق للتعريف."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تركز على فعل توجيه الدعوة أكثر من فعل الاستقبال المباشر، وتستخدم غالباً في السياقات الرسمية أو المكتوبة."
      example: "ألقى صَاحِب الدَّعْوَة كلمة شكر للحاضرين على تلبية نداء الحفل."
    - lemma: "صَاحِب الحَفْل"
      source: step05
      decision: confirmed
      decision_reason: "مركب (إضافي) واضح الدلالة على المسؤول عن إقامة الحفلة الاجتماعية ومضيفها، وهو شائع الاستعمال."
      step05_citation: "معرفة لغوية"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص بالمناسبات التي تأخذ طابع الحفل (party)، ولا تشمل مجرد استضافة شخص لآخرين في المنزل بشكل غير رسمي."
      example: "كان صَاحِب الحَفْل يتنقل بين الموائد ليطمئن على راحة ضيوفه."
      actions:
        - command: create_entry
          params:
            lemma: "صَاحِب الحَفْل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10206749-n"
    - lemma: "الدَّاعِي"
      source: step05
      decision: removed
      decision_reason: "كلمة لها معانٍ متعددة ودلالات دينية (الداعي إلى الله) أو وظيفية، واستخدامها منفردة لتعني المضيف غير دقيق ويفضل تقييدها بالإضافة."
      step05_citation: "معرفة لغوية"
      substitution_test:
        result: "fail"
      nuance_differentiation: "عامة جداً ولا تفيد معنى المضيف إلا في سياق مقيد جداً."
  synset_flags:
    definition_review_needed: false
  added_lemmas:
    - lemma: "صَاحِب الحَفْل"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

step3_definition:
  definition_review_flag: false
  current_definition: "شخص يدعو ضيوفاً إلى مناسبة اجتماعية (مثل حفلة في منزله) ويكون مسؤولاً عنهم أثناء وجودهم هناك"
  assessment:
    decision: retain
    reason: "التعريف دقيق وواضح ويغطي الجوانب الأساسية للمفهوم (توجيه الدعوة، والمناسبة الاجتماعية، والمسؤولية عن الضيوف) بأسلوب سليم."

