stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'حمولة مطروحة' صحيحة وشفافة دلالياً، لكنها تتخذ شكل العبارة الوصفية وتفتقر إلى الاختصار الذي يميز المصطلحات المعجمية الفنية."
      - "يغيب عن المجموعة المصطلح الفني المسكوك 'مطروحات' والموثق بقوة في المعاجم المتخصصة (كالمعجم الموحد لمصطلحات التجارة)."
    observations: "مصطلح 'المطروحات' هو المقابل العربي الدقيق والمستقر للمصطلح الإنجليزي (jetsam) في قواميس الملاحة والتجارة، حيث يشير حصراً إلى ما يُلقى في البحر لتخفيف الحمل."
  blind_candidates:
    - lemma: "مَطْرُوحَات"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (طرح) بصيغة جمع المؤنث السالم لاسم المفعول، وهو قياسي للدلالة على الأشياء أو السلع التي تُطرح أو تُرمى."
    - lemma: "طُرَاحَة"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن (فُعَالَة) الذي يُستخدم للدلالة على ما يُسقط أو يُطرح أو يُهمل كالفُضالة والنُفاية."
    - lemma: "حُمُولَةٌ مُلْقَاةٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر بدقة عن حمولة السفينة التي تُلقى في البحر."
    - lemma: "مَقْذُوفَاتُ السَّفِينَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي يخصص الأشياء المقذوفة بنسبتها إلى السفينة."

stage2_evidence:
  per_lemma:
    - lemma: "حُمُولَةٌ مَطْرُوحَةٌ"
      evidence_status: "no_material_found"
    - lemma: "مَطْرُوحَات"
      confirm:
        - text: "«سلع ملقاة في البحر للتخفيف من حمولة السفينة»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«المطروحات: كل ما يُطْرَح من عُدَد المركب وحُمولته تخفيفًا لثقله عند الشدائد فيغرق أو يقذفه الموج إلى الشاطئ»"
          source: "المورد الحديث (2008)"
    - lemma: "طُرَاحَة"
      evidence_status: "no_material_found"
    - lemma: "حُمُولَةٌ مُلْقَاةٌ"
      evidence_status: "no_material_found"
    - lemma: "مَقْذُوفَاتُ السَّفِينَةِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "حمولة مطروحة"
      decision: confirmed
      decision_reason: "تعبير وصفي شفاف ومفهوم، يصح استخدامه في السياقات العامة، ويؤدي المعنى المطلوب بدقة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُمُولَةٌ مَطْرُوحَةٌ"

    - lemma: "مَطْرُوحَات"
      source: stage1
      decision: confirmed
      decision_reason: "هو المصطلح الفني المعتمد والمسكوك في المعاجم المتخصصة، ويمتاز بالاختصار والدقة في التعبير عن المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مَطْرُوحَات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-03601832-n"

    - lemma: "طُرَاحَة"
      source: stage1
      decision: removed
      decision_reason: "لم يثبت استخدامها في هذا السياق المتخصص في المعاجم، رغم صحة مبناها الصرفي."
    - lemma: "حُمُولَةٌ مُلْقَاةٌ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي مشابه للموجود ولا حاجة لإضافته لعدم كونه مصطلحاً مسكوكاً."
    - lemma: "مَقْذُوفَاتُ السَّفِينَةِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب إضافي لم يثبت اصطلاحيته في المعاجم."

stage4_content:
  definition:
    current: "جزء من معدات السفينة أو حمولتها يُرمى في البحر لتخفيف الحمل أثناء العاصفة"
    assessment:
      decision: revise
      reason: "تعديل التعريف ليكون أكثر دقة وشمولاً، بصياغة معجمية رصينة (استبدال 'جزء من' بـ 'ما يرمى من')."
    authored:
      - type: terminological
        text: "مَا يُرْمَى فِي البَحْرِ مِنْ عُدَّةِ السَّفِينَةِ أَوْ حُمُولَتِهَا تَخْفِيفاً لِوَزْنِهَا أَثْنَاءَ العَوَاصِفِ وَالشَّدَائِدِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-03601832-n"
          definition_index: 0
          text: "مَا يُرْمَى فِي البَحْرِ مِنْ عُدَّةِ السَّفِينَةِ أَوْ حُمُولَتِهَا تَخْفِيفاً لِوَزْنِهَا أَثْنَاءَ العَوَاصِفِ وَالشَّدَائِدِ."

  examples:
    per_lemma:
      - lemma: "حُمُولَةٌ مَطْرُوحَةٌ"
        examples:
          - text: "عَثَرَ خَفَرُ السَّوَاحِلِ عَلَى حُمُولَةٍ مَطْرُوحَةٍ قَذَفَتْ بِهَا الأَمْوَاجُ إِلَى الشَّاطِئِ بَعْدَ العَاصِفَةِ."
            type: usage
      - lemma: "مَطْرُوحَات"
        examples:
          - text: "قَامَ طَاقَمُ السَّفِينَةِ بِتَسْجِيلِ المَطْرُوحَاتِ فِي السِّجِلِّ البَحْرِيِّ بَعْدَ أَنْ تَجَاوَزُوا الخَطَرَ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "عَثَرَ خَفَرُ السَّوَاحِلِ عَلَى حُمُولَةٍ مَطْرُوحَةٍ قَذَفَتْ بِهَا الأَمْوَاجُ إِلَى الشَّاطِئِ بَعْدَ العَاصِفَةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "قَامَ طَاقَمُ السَّفِينَةِ بِتَسْجِيلِ المَطْرُوحَاتِ فِي السِّجِلِّ البَحْرِيِّ بَعْدَ أَنْ تَجَاوَزُوا الخَطَرَ."

