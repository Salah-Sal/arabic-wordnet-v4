# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04829454-n | ILI: i62337
# المعنى: the quality of being incomprehensible
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (أعمى) ───────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «عَدَم مَفْهُومِيَّة» عبارة وصفية شفافة تفشل اختبار السكّ، ولا تُمثّل وحدة معجمية مسكوكة"
      - "«إِبْهَام» يُعاني اشتراكاً لفظياً مع «إبهام الأصابع» (الإصبع الغليظة)، مما يستوجب التحقق من وضوح السياق"
      - "التعريف الحالي «صفة كون الشيء غير مفهوم» هزيل وشبه دائري: يُضمّن «مفهوم» في تعريف مجموعة تحمل «مفهومية»، ويفتقر إلى الفصل النوعي"
    observations: >
      تحتوي المجموعة على لمّتين أصيلتين راسختين في المعجم العربي (إِبْهَام، اسْتِغْلَاق) ومركّب
      وصفي شفاف (عَدَم مَفْهُومِيَّة) لا يرقى إلى مستوى المصطلح المسكوك. كلا الجذرين —
      بهم (عدم معرفة المأتى) وغلق (النشوب والانغلاق) — راسخان في مقاييس اللغة وشائعان في
      الاستعمال اللساني والأدبي. ثمة فرق دقيق جوهري بين الإبهام (الغموض الدلالي وانعدام التعيين)
      والاستغلاق (الانغلاق التركيبي للنص). يحتاج التعريف إلى إعادة صياغة تُبيّن الجنس القريب
      والفصل النوعي بأسلوب المعجم الوسيط.
  blind_candidates:
    - lemma: "غُمُوضٌ"
      generation_method: ishtiqaq
      justification: "من جذر غمض (التطامن والتداخل وإغماض العين)، وزن فُعول، يدل على ما يغوص في الخفاء ويبعد عن الإدراك الواضح؛ مستخدم في الدراسات اللسانية للدلالة على خاصية النص الذي يتعسّر فهمه"
    - lemma: "تَعَقُّدٌ"
      generation_method: ishtiqaq
      justification: "من جذر عقد، وزن تَفَعُّل، يدل على التشابك والالتفاف حتى يتعذّر الولوج؛ «تعقّد الكلام» مسجّل في المعجم الوسيط بمعنى «أعيا فهمه لسوء تركيبه أو خفاء معناه»"
    - lemma: "إِعْضَالٌ"
      generation_method: majaz
      justification: "من جذر عضل (الشدة والإعاقة)، وزن إفعال، يدل على بلوغ الأمر درجة من الصعوبة تعجز عنها القدرة الإدراكية؛ إحياء للفظ «المُعضِل» الكلاسيكي"
    - lemma: "اسْتِعْصَاءٌ"
      generation_method: ishtiqaq
      justification: "من جذر عصي، وزن استفعال، يدل على مقاومة الشيء للإدراك وامتناعه على الفهم؛ يُقال «استعصت المسألة» أي أعيت الفهم وأبت الانقياد"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنجزة:
#   Q1: مطابقة دفعية لجميع اللمّات والمرشحات (12 صيغة)
#   Q2: إثراء مُدمج (تعريفات + أمثلة) بالمعرّفات المُستخرجة
#   Q3: جسر إنجليزي (incomprehensibility + incomprehensible + opacity + obscurity)
#   Q4: مقاييس اللغة (جذور بهم، غلق، غمض، عقد)
stage2_evidence:
  per_lemma:
    - lemma: "إِبْهَام"
      confirm:
        - text: "«غموض في الخطاب يمنع المتلقي من فهم المقصود منه إلا بضرب من التأويل»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (translation_en: vagueness)"
        - text: "«(1) مُبْهَم؛ (2) لا يُسْبَر غَوْرُه» — الترجمة العربية للمصطلح الإنجليزي incomprehensible"
          source: "المورد الحديث (2008)"
        - text: "«إبهام» — ترجمة عربية مقابلة لـ ambiguity في سياق الفلسفة وعلم النفس"
          source: "مسرد الفلسفة وعلم النفس، ALECSO"
      expands:
        - text: "«(2) غموض؛ إبهام» — مدرجة كترجمة ثانية لـ obscurity إلى جانب ظُلمة وعَتَمة وقَتَام"
          source: "المورد الحديث (2008)"
          addition: "يتداخل الإبهام دلالياً مع «الغموض» و«الظلمة» في سياق الخفاء، مما يُثبت اتساع حقله الدلالي"
        - text: "«الإصبع الغليظة الخامسة من أصابع اليد والرِّجل، وهى ذات سُلاميَّتَيْن (مؤنثة وقد تذكر)»"
          source: "المعجم الوسيط"
          addition: "يُكشف الاشتراك اللفظي بين المعنى التشريحي (الإبهام = الأصبع) والمعنى الدلالي (الإبهام = الغموض)؛ السياق يُعيّن المراد"

    - lemma: "اسْتِغْلَاق"
      confirm:
        - text: "«طابع علامة أو تعبير لا يُفهم أو يدرك بطريقة مشوشة تخفي دلالته، والكلمة مجهولة عند المتلقي لأنها خارج الإجادة في النص الشعري»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) (translation_en: opacity)"
      expands:
        - text: "«امتناع عضل القناة الهضمية عن الارتخاء في مواضع التقاء بعض أجزائها ببعض» — ترجمة لـ achalasia"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "يمتد الاستغلاق إلى الطب بمعنى امتناع العضل عن الارتخاء، مما يُؤكد الإيحاء الأصلي بالانغلاق والإحكام الشديد"

    - lemma: "عَدَم مَفْهُومِيَّة"
      evidence_status: "no_material_found"

    - lemma: "غُمُوضٌ"
      contradicts:
        - text: "«وجود اثنين أو أكثر من المعاني الممكنة في أي حديث»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "الغموض هنا تعدّد المعاني (ambiguity) لا عدم إمكانية الفهم (incomprehensibility) — مفهومان متمايزان في علم الدلالة"
      expands:
        - text: "«صياغة خطاب يعسُر على المتلقي الوصول إلى مضمونه ومقاصده» (translation_en: confusion)"
          source: "مسرد الإعلام والتواصل، ALECSO"
          addition: "هذا المعنى أقرب لعدم الفهم نسبياً، لكن المصدر يترجمه بـ confusion لا incomprehensibility، مما يُؤكد الفارق"

    - lemma: "تَعَقُّدٌ"
      expands:
        - text: "«الكلام: أعيا فهمه لسوء تركيبه أو خفاء معناه»"
          source: "المعجم الوسيط"
          addition: "يُقرّ المعجم أن تعقّد الكلام يُفضي إلى تعسّر الفهم، غير أن تعقّد فعل لا اسم جامد للصفة المطلوبة في هذه المجموعة"
        - text: "«منظومة بتفاصيل كثيرة وتربط بين مكوناتها علاقات محيرة» (translation_en: intricacy)"
          source: "مسرد المناخ والبيئة، ALECSO"
          addition: "الاستعمال الاصطلاحي الحديث يربط التعقد بالتركيب المُحيّر لا بعدم الفهم المطلق"

    - lemma: "إِعْضَالٌ"
      evidence_status: "no_material_found"

    - lemma: "اسْتِعْصَاءٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إِبْهَام"
      decision: confirmed
      decision_reason: >
        لمّة راسخة في المعجم العربي الكلاسيكي والحديث؛ موثّقة في مصادر لسانية وفلسفية
        بمعنى الغموض الذي يحول دون الفهم. جذرها بهم مُؤسَّس في مقاييس ابن فارس على
        معنى «ما لا يُعرف المأتى إليه» وهو الجذر الدلالي المباشر لمفهوم الإبهام.
        الاشتراك مع إبهام الأصابع مدفوع بأن السياق المجموعي (صفة مجردة تحت جودة/نوعية)
        يُعيّن المعنى بلا لبس. التشكيل إِبْهَام صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الغموض الدلالي وانعدام التعيين في المعنى — الجانب المفهومي الذاتي حيث يتعذّر استيعاب المقصود؛ شائع في الفلسفة وعلم الدلالة والنقد الأدبي"

    - lemma: "اسْتِغْلَاق"
      decision: confirmed
      decision_reason: >
        موثّق في معجم اللسانيات (2002) بمعنى «طابع تعبير لا يُفهم أو يُدرك»، وهو مطابق
        تماماً لمفهوم المجموعة. جذر غلق يُفيد النشوب والانغلاق (مقاييس ابن فارس)، ووزن
        الاستفعال يُفيد المطاوعة الكاملة وبلوغ الحالة القصوى من الانغلاق، مما يجعله أنسب
        الأوزان لهذا المعنى. التشكيل اسْتِغْلَاق صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الانغلاق التركيبي للنص أو التعبير — الجانب البنيوي حيث يُحكم النص بناءه حتى يتعذّر الولوج إلى معناه؛ أكثر تخصصاً في نقد الشعر والنصوص الأدبية"

    - lemma: "عَدَم مَفْهُومِيَّة"
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ فشلاً صريحاً: يمكن إبدال «مَفْهُومِيَّة» بـ«قَابِلِيَّةِ الفَهْمِ» أو
        «إِدْرَاكِيَّة» دون أن يتغير المعنى الوصفي، مما يكشف أنه تعبير تحليلي شفاف لا مصطلح
        مسكوك. لا توجد شواهد معجمية للمركّب كوحدة ثابتة في قواعد البيانات المعجمية. مفهوم
        المجموعة يُغطّيه إبهام واستغلاق بصورة كافية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غُمُوضٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الغموض يُعبّر أساساً عن «تعدّد المعاني المحتملة» (ambiguity) — أي الالتباس الناتج
        عن تعدد الوجوه — لا عن «استحالة الفهم» (incomprehensibility) الذي هو انعدام القدرة
        على الاستيعاب كلياً. الأدلة المعجمية تُثبت هذا الفارق (ترجمة ambiguity في التربية
        والفلسفة، confusion في الإعلام). الخلط بينهما يُفضي إلى تداخل مع مجموعات ترادفية
        أخرى.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَعَقُّدٌ"
      source: stage1
      decision: removed
      decision_reason: >
        التعقّد يُعبّر عن «التشابك والتركيب المُعقَّد» (complexity/intricacy) لا عن «عدم إمكانية
        الفهم» — العلاقة بينهما سببية (التعقيد قد يُفضي إلى الإبهام) لا مطابقة مفهومية. علاوة
        على ذلك فهو أصلاً فعل، وإن ورد كمصدر لصفة، إلا أن الأدلة تُثبت استعماله في سياق
        التركيب والبناء لا في السمة الجوهرية للشيء غير المفهوم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "إِعْضَالٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية في قاعدة البيانات للمرشح. مفهوم الإعضال يُشير إلى الاستعصاء الشديد
        وصعوبة الحل لا إلى الصفة الجوهرية للشيء غير المفهوم. هو أقرب إلى سياق المشكلات
        العويصة منه إلى وصف خاصية إدراكية مجردة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "اسْتِعْصَاءٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية في قاعدة البيانات. الاستعصاء يُستعمل في سياق مقاومة المشكلات
        والعوائق وليس وصفاً للخاصية الجوهرية للشيء الذي يتعذّر فهمه. يحمل إيحاء فاعلياً
        (شيء يقاوم الحل) مختلفاً عن الإيحاء الوصفي المطلوب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة كون الشيء غير مفهوم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ركيك ودائري: يستعمل كلمة «مفهوم» في تعريف مجموعة ترادفية ترتبط
        بـ«مفهومية»، فضلاً عن افتقاره إلى الجنس القريب الصريح والفصل النوعي الكافي —
        لا يُبيّن لماذا يتعذّر الفهم، ولا يُميّز هذه الخاصية عن الغموض العادي أو الإبهام
        الجزئي.
    authored:
      - type: terminological
        text: "خَاصِّيَّةُ مَا يَتَعَذَّرُ إِدْرَاكُهُ وَاسْتِيعَابُهُ، لِغُمُوضِ مَعْنَاهُ أَوْ إِحْكَامِ بِنَائِهِ حَتَّى يَعْجِزَ عَنْهُ الإِدْرَاكُ الاعْتِيَادِيُّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَاصِّيَّةُ مَا يَتَعَذَّرُ إِدْرَاكُهُ وَاسْتِيعَابُهُ، لِغُمُوضِ مَعْنَاهُ أَوْ إِحْكَامِ بِنَائِهِ حَتَّى يَعْجِزَ عَنْهُ الإِدْرَاكُ الاعْتِيَادِيُّ"

  examples:
