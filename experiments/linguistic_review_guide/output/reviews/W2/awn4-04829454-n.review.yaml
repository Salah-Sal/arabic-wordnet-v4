            type: usage
      - lemma: "اسْتِغْلَاق"
        examples:
          - text: "يَصِفُ النُّقَّادُ اسْتِغْلَاقَ الشِّعْرِ الصُّوفِيِّ بِأَنَّهُ حَاجِزٌ مَنِيعٌ يَفْصِلُ بَيْنَ المُتَذَوِّقِينَ وَعَوَالِمِ المَعْنَى الخَفِيَّةِ"
            type: usage
