# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي قصير جداً ويستخدم فعل «تخرج» للتعبير عن الخرج، مما يُقرِّبه من الدوران"
      - "غياب التشكيل الكامل عن لمّة «إشارة الخرج» في السجلّ"
      - "لمّة «مُخْرَج» واسعة الدلالة (تشمل المخرج الصوتي، ومخرج الحروف، والمخرج التقني)؛ يحتاج التمييز توثيقاً"
      - "المجموعة تفتقر إلى تعريف موسوعي يُبيِّن الطبيعة الكهربائية/الرقمية للإشارة"
    observations: >
      المجموعة تُمثِّل مفهوماً من هندسة الإلكترونيات ومعالجة الإشارات، وهو «إشارة الخرج» (output signal)
      المقابلة لـ«إشارة الدخل» (input signal) في أي نظام إلكتروني. وفي المعجمية التقنية العربية، يُستعمل
      مصطلحا الخَرْج والمُخْرَج جنباً إلى جنب للتعبير عن output، غير أن «إشارة الخرج» تتميز باشتراطها
      طابعاً إشارياً محدداً (جهد أو تيار أو بيانات رقمية). تأتي اللمّتان الموجودتان منطقياً لتُكمِّل إحداهما
      الأخرى: تركيبية (إشارة الخرج) وإفرادية (مُخْرَج).
  blind_candidates:
    - lemma: "إشارةُ الْخَرْجِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «إشارة» (الكيان الإشاراتي) + «الخرج» (المصطلح الإلكتروني العربي المُقرَّر
        لـoutput). الخَرْج من الجذر خرج، مستعمَل في معاجم الهندسة الكهربائية وتقانة المعلومات بمعنى
        output مقابل الدخل (input). التركيب الإضافي منتج ومعروف في اللغة التقنية العربية.
    - lemma: "مَخْرَجٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر خرج على وزن مَفْعَل (اسم مكان/مصدر ميمي) بمعنى «ما تخرج منه الإشارة أو ما
        تخرج به». الوزن مَفْعَل منتج في التقنية (مَدْخَل / مَخْرَج). يُقابل بدقة مصطلح outlet/output
        في السياق الإلكتروني.
    - lemma: "نَاتِجَة"
      generation_method: majaz
      justification: >
        إزاحة دلالية لاسم الفاعل «نَاتِجَة» من الجذر نتج بمعنى «ما نتج وصدر» نحو دلالة الإشارة
        الصادرة من النظام. المشابهة الوظيفية: كلٌّ من الناتجة وإشارة الخرج هو «ما ينبثق عن عملية».
        الإزاحة مدعومة بالاستعمال الاصطلاحي للجذر نتج في سياق الإنتاج والمخرجات.
    - lemma: "خَارِجَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق اسم فاعل مؤنث من خرج على وزن فَاعِلَة، بمعنى «الإشارة الخارجة/الصادرة». يُحيل على
        الطابع الحركي للإشارة المتجهة للخارج من النظام في مقابل الداخلة.


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "إشارة الخرج"
      confirm:
        - text: >
            «إشارة خرج مُحوِّل قياس: التمثيل التناظري أو الرقميّ للكمّية المُقاسة الناتجة عن
            مُحوِّل قياس»
          source: "مسرد الهندسة الكهربائية — ALECSO (ArabTerm)"
        - text: >
            «زمن الاستقرار: المدة الزمنية التي تنقضي بعد حدوث تغيّر تدريجي لأحد المقادير المُؤثِّرة،
            وحتى تحيد إشارة الخرج بمقدارٍ لا يزيد على نسبةٍ مئويةٍ مُحدَّدة (ولتكن 5%) من الفرق
            بين القيم المُستقرة لبداية الإشارة ونهايتها»
          source: "مسرد الهندسة الكهربائية — ALECSO (ArabTerm)"
        - text: >
            «دائرة مواءمة: دائرة كهربائية تقوم بترجمة التغيّر الظاهري في إشارة الدخل إلى تغيّر
            مطلوب في إشارة الخرج»
          source: "مسرد الهندسة الكهربائية — ALECSO (ArabTerm)"
        - text: >
            «يُحتسب كنسبة لتغيّر إشارة خرج عنصر تحويل إلى تغيّر إشارة الدخل التابعة له»
          source: "مسرد الهندسة الكهربائية — ALECSO (ArabTerm)"
        - text: >
            «مُحوِّل قياس مُتعدد: مُحوِّل قياس له اثنان من أدوات القياس أو أكثر، تُجمَّع فيه
            الإشارات من المُستشعرات المُفردة، لتوليد إشارة خرج، تتناسب وتتلاءم مع الكمّية المُقاسة»
          source: "مسرد الهندسة الكهربائية — ALECSO (ArabTerm)"
        - text: >
            «نسبة قدرة مستوى إشارة ECM، على إنتاج إشارة خرج مستقبِل يستخدم تقنية ECCM»
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004) — ArabTerm"

    - lemma: "مُخْرَج"
      confirm:
        - text: "«مَخْرج — output»"
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
        - text: "«خَرْج، مُخرَج: ما ينتج عن الدخل»"
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
        - text: >
            «(2) «أ», الخَرْج: «ب» الطاقة التي ينتجها الجهاز (مك). «ج» المُعْطَيات الناتجة
            عن تشغيل الكومبيوتر (ألك)»
          source: "المورد الحديث (2008) — ArabTerm"
        - text: "«خَرْج — output» [في الفيزياء العامة والنووية]"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ArabTerm"
        - text: "«خَرْج: مسلسلات أو مكوّنات مسؤولة عن خرج المعطيات — output»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ArabTerm"
        - text: >
            «خرج: نتائجُ المعالَجةِ المرسَلةُ إلى الشاشة أو الطابعة، أو المُخزَّنةُ في قرص
            باعتبارها ملفاً، أو المُرسَلةُ إلى حاسوب آخر على الشبكة — output»
          source: "معجم مصطلحات المعلوماتية (2000) — ArabTerm"
      expands:
        - text: >
            «مَخْرَج صَوْتيّ: القناة التي يتم عن طريقها إخراج المعطيات الصوتية من الحاسوب وتكون
            مرتبطة عادة بمكبر صوت أو جهاز تسجيل — acoustic output»
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ArabTerm"
          addition: >
            يُشير إلى أن المخرج مفهوم أعمّ يشمل القنوات المختلفة لتدفق الإشارات والبيانات خارج
            النظام، وليس الإشارة الكهربائية وحدها.

    # ── المرشحات من المرحلة ١ ──
    - lemma: "إشارةُ الْخَرْجِ"
      confirm:
        - text: >
            «إشارة خرج مُحوِّل قياس: التمثيل التناظري أو الرقميّ للكمّية المُقاسة الناتجة عن
            مُحوِّل قياس — output signal of a measuring transducer»
          source: "مسرد الهندسة الكهربائية — ALECSO (ArabTerm)"

    - lemma: "مَخْرَجٌ"
      confirm:
        - text: "«مَخْرَج — output» [في الاتصالات والمعلوماتية]"
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
        - text: "«مَخْرَج صَوْتيّ — acoustic output»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ArabTerm"
      contradicts:
        - text: >
            «المَخْرج: عبارةٌ عن موضع خروج الحروف الهجائية وظهورها وتمييزها من غيره بواسطة صوت»
          source: "التعريفات الفقهية للبركتي (Hawramani)"
          conflict: >
            المعنى الكلاسيكي والصوتي لمَخْرَج هو مخرج الحرف (phonemic articulation point)، وهو
            مختلف تماماً عن output signal. تعدد المعاني يُضعف قدرة المصطلح على الإحالة المحددة
            للمفهوم الإلكتروني. بالمقارنة فإن مُخْرَج (بضم الميم) هو الأدق للمفهوم التقني.
      expands:
        - text: >
            «مَخْرَج: فتحة أو ممر تنساب عبره المياه للخروج من خزان أو من مجرى مائي — outlet»
          source: "المعجم الموحد لمصطلحات المياه (2000) — ArabTerm"
          addition: >
            المعنى الهندسي لمَخْرَج = منفذ/فتحة خروج. يُعزز أن المصطلح يحمل دلالة «نقطة/قناة
            الخروج» لا «الكيان الخارج» ذاته، مما يُميزه عن مُخْرَج.

    - lemma: "نَاتِجَة"
      evidence_status: "no_material_found"

    - lemma: "خَارِجَة"
      contradicts:
        - text: >
            «خارِجَةُ: قرية بإفريقية من نواحي تونس»
          source: "معجم البلدان لياقوت الحموي (Hawramani)"
          conflict: "المصطلح ثابت في المعاجم كاسم علم جغرافي وشخصي، لا كمصطلح تقني للإشارة الصادرة"
        - text: "«خارِجةُ: اسم لنحو خمسة عشر من الصحابة والتابعين»"
          source: "المعجم الكبير (OCR)"
          conflict: "يُستعمل اسماً للأشخاص لا مصطلحاً تقنياً"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إشارة الخرج"
      decision: confirmed
      decision_reason: >
        المصطلح ثابت وموثَّق في معاجم الهندسة الكهربائية وتقانة المعلومات وحرب الإلكترونيات بمعنى
        output signal. التركيب الإضافي (إشارة + الخرج) يجتاز اختبار السكّ: لا يمكن إبدال «إشارة»
        بـ«علامة» أو «الخرج» بـ«الصادر» مع الإبقاء على المصطلح التقني ذاته، فهو وحدة معجمية ثابتة
        في مراجع ALECSO والمعاجم الإلكترونية. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الطابع الإشاراتي الكهربائي أو الرقمي تحديداً (جهد/تيار/إشارة رقمية صادرة من
        دائرة)، ويُقابل صراحةً «إشارة الدخل»؛ أدق من مُخْرَج في السياق الإلكتروني البحت.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إشارةُ الْخَرْجِ"

    - lemma: "مُخْرَج"
      decision: confirmed
      decision_reason: >
        الصيغة مُخْرَج (اسم مفعول من أخرج، بضم الميم وسكون الخاء) ثابتة في مسرد الإعلام والتواصل
        بمعنى output. المصطلح جامع يشمل الإشارة الكهربائية والبيانات الرقمية، وورد مقروناً بـ«الخرج»
        في تعريف «ما ينتج عن الدخل». التشكيل الموجود صحيح ودقيق ويميزه من مَخْرَج (اسم مكان/مصدر
        ميمي بمعنى phonemic articulation point أو outlet).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ من «إشارة الخرج»: يشمل أي مخرجات النظام سواء كانت إشارةً كهربائية أم بيانات رقمية أم
        نتائج حوسبة. يُستعمل في سياقات المعالجة وتقانة المعلومات بينما تختص «إشارة الخرج» بالدوائر
        الكهربائية وأجهزة القياس.

    # ── مرشحات المرحلة ١ ──
    - lemma: "إشارةُ الْخَرْجِ"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو لمّة موجودة فعلاً في المجموعة (إشارة الخرج)؛ التوليد العمياء أثبت صحة اللمّة
        الحالية وأدت وظيفتها كمرشح تحققي. لا حاجة لإجراء إضافي.

    - lemma: "مَخْرَجٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيقه بمعنى output في بعض المعاجم التقنية، فإن مَخْرَج (بفتح الميم) يحمل دلالة «نقطة/
        قناة الخروج» (outlet, port) أكثر من «الكيان الخارج» (the output signal نفسه). كما تعارضت
        الأدلة: المعنى الكلاسيكي والصوتي (مخرج الحروف) والهندسي (منفذ مياه) يُضعفان انفراده بالمفهوم
        التقني المطلوب. المجموعة تضم مُخْرَج (بضم الميم) وهو الأدق، فلا حاجة لإضافة مَخْرَج.

    - lemma: "نَاتِجَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي يُثبِّت «ناتجة» مصطلحاً خاصاً بإشارة الخرج. اختبار السكّ:
        يمكن استبدال «ناتجة» بـ«محصّلة» أو «مُنتَجة» في أي جملة وصفية، مما يعني أنها وصف حرّ لا
        مصطلح مسكوك. فضلاً عن ذلك تُحيل على نتيجة عملية ما (result) لا على الإشارة الكهربائية.

    - lemma: "خَارِجَة"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة تُؤكد أن «خارجة» ثابتة في المعاجم كاسم علم (شخصي وجغرافي) لا كمصطلح تقني.
        فحص الاستبدال: «الإشارة الخارجة» عبارة وصفية حرة يمكن تعديلها (الصادرة، المنبعثة...)
        وليست مصطلحاً مسكوكاً. فحص اللهجية: مقبولة فصاحةً لكنها لم تُسكَّ مصطلحاً.


