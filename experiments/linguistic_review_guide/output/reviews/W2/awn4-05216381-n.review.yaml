# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-05216381-n
# ili       : i64342
# pos       : n
# concept   : domesticity — صفة كون الكائن مُحِبًّا للحياة المنزلية أو مُدَجَّناً
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (ألفة منزلية، حياة منزلية) مركّبتان وصفيّتان (واصفيّتا النعت وليستا مصطلحَيْن مسكوكَيْن)؛ يمكن إبدال النعت في كلٍّ منهما بمرادف (عائلية / بيتية) دون أيّ فقد للمعنى، مما يكشف أنهما عبارتان وصفيتان حرّتان لا وحدتان معجميتان ثابتتان"
      - "حياة منزلية تعبّر عن (domestic life) أي الحياة المنزلية بما هي حالة معيشية، لا عن (domesticity) بما هي صِفةٌ مجردة ترتبط بها تحت أبَوِيّ جَوْدَة/نَوْعِيَّة"
      - "التشكيل غائب عن اللمّتين في السجل"
    observations: "المفهوم المُقصود هو الصفة المجردة لكون الكائن مرتبطاً بالحياة المنزلية وآلِفاً لها، أو مُستأنَساً بالبيئة الإنسانية (domesticity). الجذر (دجن) هو الأدق للمعنى الثاني (تدجُّن الحيوانات)، والجذر (ألف) للأول (الأُلفة المنزلية). المفهوم يقع في ثغرة معجمية (lexical gap) إذ لا يملك العربيُّ مصطلحاً أحاديَّ الكلمة شائعاً يجمع المعنيَيْن في آنٍ واحد."
  blind_candidates:
    - lemma: "تَدَجُّنٌ"
      generation_method: ishtiqaq
      justification: "من الجذر (دجن)، وزن تَفَعُّل الدالّ على اكتساب الصفة وتحصيلها تدريجياً. الداجنُ في المعجم: ما ألِفَ البيوتَ. والتدجُّنُ: الدخولُ في حالة الدُجونِ والإقامةِ مع الأنس؛ يعبّر تحديداً عن خاصية كون الكائن مُستأنَساً آلِفاً للبيئةِ الإنسانيةِ"
    - lemma: "أُنْسِيَّةٌ"
      generation_method: ishtiqaq
      justification: "من الجذر (أنس)، المصدر الصناعي على وزن فُعْلِيَّة. الأُنسُ نقيضُ الوحشةِ، وأَنِسَ بالشيءِ: لم يستوحشْ منه؛ الأُنسيّة تدلّ على خاصية عدم التوحّش والألفة بالبيئة المحيطة، وتغطّي البُعد الإنساني للمفهوم"
    - lemma: "مُدَاجَنَةٌ"
      generation_method: ishtiqaq
      justification: "من الجذر (دجن)، وزن مُفَاعَلَة للمشاركة والتلازم. في الأصل اللغوي: حُسن المخالطة والمعاشرة؛ وظّفتُها للدلالة على صفة التلازم مع الحياة المنزلية والألفة بها"
    - lemma: "بَيْتِيَّةٌ"
      generation_method: ishtiqaq
      justification: "من (بيت) على المصدر الصناعي، للدلالة على خاصية كون الكائن بَيْتِيًّا مُرتبطاً بالمنزل، على غرار مصطلحات المصدر الصناعي كالشعبيّة والوطنيّة والمدنيّة"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   [١] مطابقة دفعية: headword_norm IN (الالفة منزلية, الالفة, الاهلية, التاليف, ...)
#   [٢] جسر إنجليزي: translation_en:"domesticity" OR "domestic" OR "domesticated"
#   [٣] FTS عربي: "أليف" OR "تدجين" OR "تدجن" OR "منزلي" OR "داجن"
#   [٤] مقاييس اللغة: dictionary_id=151, headword_norm IN (الف, دجن, نزل, انس)
stage2_evidence:
  per_lemma:
    - lemma: "ألفة منزلية"
      expands:
        - text: "«(1) الألفة؛ التدجُّن (2) الحياة العائلية [أو الوَلَع بها] (3) pl.: الشؤون المنزلية»"
          source: "المورد الحديث (2008)"
          addition: "يُدرج المورد الحديث الألفةَ أولَ ترجمة لـ domesticity مما يدعم المكوّن الأساسي للمركّب، غير أن المعجم لا يستخدم المركّب 'ألفة منزلية' كاملاً"
        - text: "«الاجتماع والالتئام (في علم النفس): خاصة تجاذب الظواهر النفسية في المجال الشعوري بتداعي الأفكار وترابطها (في الأخلاق): وشيجة بين شخصين أو أكثر, يحدثها تجاذب الميول النفسية, كصلة الصداقة ولحمة القرابة»"
          source: "المعجم الوسيط"
          addition: "يكشف أن الأُلفة الاصطلاحية تعني التجاذب والانسجام النفسي وليست مقيّدة بالسياق المنزلي تحديداً؛ مما يفسّر الحاجة إلى قيد 'منزلية' في المركّب"

    - lemma: "حياة منزلية"
      contradicts:
        - text: "«(1) الألفة؛ التدجُّن (2) الحياة العائلية [أو الوَلَع بها] (3) pl.: الشؤون المنزلية»"
          source: "المورد الحديث (2008)"
          conflict: "المورد الحديث يستخدم 'الحياة العائلية' (لا المنزلية) للمعنى الثاني، كما أن هذا المعنى يشير إلى domestic life بما هي حالة معيشية لا إلى domesticity بما هي صِفةٌ مجردة"

    - lemma: "تَدَجُّنٌ"
      confirm:
        - text: "«(1) الألفة؛ التدجُّن (2) الحياة العائلية [أو الوَلَع بها]»"
          source: "المورد الحديث (2008)"
        - text: "«دجَنَ بالمكانِ دُجوناً: أقام، والحمامُ والشاةُ وغيرُهما: ألِفَتِ البيوتَ. وهي داجنٌ ج: دَوَاجِنُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الشَّاةُ الدَّاجِنُ: الَّتِي تَأْلَفُ الْبُيُوتَ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(1) يتبنَّى؛ يُؤهِّل؛ يجعل الشيء الأجنبيّ أهليًا (2) يُدَجِّن؛ يُروِّض (3) يُوْلِعُهُ بالحياة العائليّة»"
          source: "المورد الحديث (2008)"
          addition: "يكشف عن الأفعال الدالة على domesticate، مما يؤكد أن التدجُّن هو المصدر المناسب لـ domesticity من جهة الاشتقاق"

    - lemma: "أُنْسِيَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "مُدَاجَنَةٌ"
      contradicts:
        - text: "«الْمُدَاجَنَةُ: حُسْنُ الْمُخَالَطَةِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المداجنة تعني المعاشرة الحسنة والملاطفة الاجتماعية لا الارتباطَ بالحياة المنزلية؛ المعنى يباعدها عن domesticity"
        - text: "«داجَنَهُ: داهَنَهُ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "المداجنة في الاستخدام الفعلي = المداهنة والملاينة الاجتماعية، بعيدة عن المفهوم المنزلي"

    - lemma: "بَيْتِيَّةٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "ألفة منزلية"
      decision: confirmed
      decision_reason: "اللمّة تُغطّي بُعدَ الارتباط العاطفي بالحياة المنزلية في الإنسان وما يألَفُ الديارَ من الطير والبهائم. رغم أنها مركّب وصفي (wasfi) يفشل اختبار السكّ الصارم — إذ يمكن إبدال 'منزلية' بـ'عائلية' — فإن حالة الثغرة المعجمية (lexical_gap) تُسوّغ الإبقاء عليها بوصفها أقرب التعبيرات المتاحة للجانب الإنساني من المفهوم. تحتاج إلى تشكيل كامل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تُبرز الجانبَ العاطفيَّ والانتمائيَّ نحوَ الحياةِ المنزليةِ (حبُّ البيتِ والتعلُّقُ بالأسرةِ)، وتصلح للإنسانِ وللطيرِ والبهائمِ التي تألَفُ الديارَ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُلْفَةٌ مَنْزِلِيَّةٌ"

    - lemma: "حياة منزلية"
      decision: removed
      decision_reason: "تعبّر عن (domestic life) أي الحياة المنزلية كحالة معيشية، لا عن (domesticity) كصِفةٍ مجردة تندرج تحت أبَوِيّ جَوْدَة/نَوْعِيَّة. المورد الحديث يفصل بوضوح بين 'الألفة؛ التدجّن' (domesticity) و'الحياة العائلية' (domestic life). فضلاً عن ذلك تفشل اختبار المصطلح المسكوك."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَدَجُّنٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مشتقٌّ من الجذر (دجن) الدال على الإقامة وألفة البيوت، على وزن تَفَعُّل المناسب لاكتساب الصفة. يُدرجه المورد الحديث أولَ ترجمة مزدوجة لـ domesticity مع الألفة. الجذر مُثبَّت في المعاجم الكلاسيكية (القاموس المحيط) والمعيارية (ابن فارس) والحديثة (المورد)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على التحوّل الفعليّ من الحالة البريّة إلى الاستئناس والإلفِ، ويُستخدَم خاصةً في الحيوانات الخاضعة للتدجين البشري"
      actions:
        - command: create_entry
          params:
            lemma: "تَدَجُّنٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أُنْسِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أدلة معجمية مباشرة للصيغة. تأنّس في المعاجم يُترجم بـ sociability (اجتماعية) لا بـ domesticity، وابن فارس يربط الأنس بالظهور ونقيض التوحّش في معناه الإنساني العام لا في المعنى المنزلي التخصيصي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُدَاجَنَةٌ"
      source: stage1
      decision: removed
      decision_reason: "المداجنة في المعاجم تعني المداهنة وحسن المخالطة الاجتماعية لا الارتباط بالحياة المنزلية؛ الاستخدام التراثي المعتمد يتعارض تعارضاً صريحاً مع المعنى المطلوب."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "بَيْتِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "لا مادة معجمية داعمة. 'بيتيّة' في الاستخدام الراهن صفة نسبية جارية (مقرّر بيتي، امتحان بيتي) لا مصدر صناعي ذو دلالة مجرّدة مسكوكة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة الحياة المنزلية أو كون الكائن أليفاً"
    assessment:
      decision: revise
      reason: "التعريف الحالي يعتمد أسلوب الوصف الحرّ لا أسلوب الجنس والفصل؛ ويتضمّن مكوّناً (الحياة المنزلية) ينتمي للمّة المحذوفة؛ وكلمة 'أليفاً' تكرار للجذر الموجود في اللمّة المؤكدة 'أُلفة' دون فائدة تعريفية. الصياغة دون مستوى المعجم المعياري."
    authored:
      - type: terminological
        text: "صِفَةٌ تَجمَعُ بينَ حُبِّ الكائنِ للحياةِ المنزليةِ والارتباطِ بها، وبينَ استئناسِ الحيوانِ وتعوُّدِه على صُحبةِ الإنسانِ وبيئتِه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كوْنُ الكائنِ آلِفاً لشُؤونِ بيتِه ومُتَعَلِّقاً بها، أو كوْنُ الحيوانِ داجِناً مُستأنَساً غيرَ نافِرٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صِفَةٌ تَجمَعُ بينَ حُبِّ الكائنِ للحياةِ المنزليةِ والارتباطِ بها، وبينَ استئناسِ الحيوانِ وتعوُّدِه على صُحبةِ الإنسانِ وبيئتِه"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "كوْنُ الكائنِ آلِفاً لشُؤونِ بيتِه ومُتَعَلِّقاً بها، أو كوْنُ الحيوانِ داجِناً مُستأنَساً غيرَ نافِرٍ"

  examples:
    per_lemma:
      - lemma: "أُلْفَةٌ مَنْزِلِيَّةٌ"
        examples:
          - text: "تتجلّى الأُلفةُ المنزليةُ في تعلُّقِ الطفلِ بأجواءِ بيتِه وحرصِه على العودةِ إليه بعدَ كلِّ غيبة"
            type: usage
      - lemma: "تَدَجُّنٌ"
        examples:
          - text: "أسهَمَ تدجُّنُ القطِّ البرِّيِّ قبلَ آلافِ السنينَ في نشأةِ أوثقِ الروابطِ بينَ الإنسانِ والحيوانِ المنزليِّ"
            type: usage
    actions:
      - command: add_sense_example
