stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمة واحدة فقط."
      - "التعريف الحالي يتسم بنوع من الدور لاستخدامه كلمة (الهامش) في تعريف (الهامشية)."
    observations: "المصطلح (هَامِشِيَّة) هو المقابل الأدق للمفهوم الاجتماعي والمكاني لـ (Marginality)، وهو مصدر صناعي مولد استقر استخدامه في المعاجم الحديثة."
  blind_candidates:
    - lemma: "هَامِشِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي القياسي من 'هامش' للتعبير عن الحالة أو الصفة."
    - lemma: "طَرَفِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'طرف' يعبر عن الوجود في الأطراف أو النواحي، ويناسب السياق المكاني والتقني."
    - lemma: "جَانِبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'جانب' للتعبير عن كَوْن الشيء في الجانب أو ثانوياً."
    - lemma: "حَافِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'حافة' للتعبير عن الوجود عند الحواف أو النهايات."

stage2_evidence:
  per_lemma:
    - lemma: "هَامِشِيَّة"
      confirm:
        - text: "«هامشية: مصطلح لم يبدأ استعماله إلا سنة 1965... ويُقصد به إقصاء أو تهميش أفراد لا يطابقون النموذج المهيمن.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«هامشيّ: من يعيش على الهامش غير مندمج في المجتمع.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "طَرَفِيَّة"
      confirm:
        - text: "«طَرَفِيَّة: في الحوسبة: تجهيزةٌ... تُربَطُ بالحاسوب...»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«الطَّاءُ وَالرَّاءُ وَالْفَاءُ أَصْلَانِ: فَالْأَوَّلُ يَدُلُّ عَلَى حَدِّ الشَّيْءِ وَحَرْفِهِ... طَرَفُ الشَّيْءِ وَالثَّوْبِ وَالْحَائِطِ.»"
          source: "مقاييس اللغة لابن فارس"
    - lemma: "هامش"
      confirm:
        - text: "«والهامِشُ: حاشِيَةُ الكِتابِ، مُوَلَّدٌ.»"
          source: "القاموس المحيط"
        - text: "«الهامش: حاشية الكتاب، وفلان يعيش على الهامش: لم يدخل في زحمة الناس (محدثة)»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "هَامِشِيَّة"
      decision: confirmed
      decision_reason: "المصطلح المعاصر الأنسب والأكثر شيوعاً للتعبير عن مفهوم (Marginality)، وقد أقره مجمع اللغة العربية بالقاهرة وأثبته في المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَامِشِيَّة"
    - lemma: "طَرَفِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف صحيح من الناحية الصرفية والدلالية، يستخدم للتعبير عن خاصية الوجود في الأطراف (Peripherality)، سواء في السياق الجغرافي أو التقني."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "طَرَفِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05085354-n"

stage4_content:
  definition:
    current: "خاصية التواجد على الهامش أو الأطراف"
    assessment:
      decision: revise
      reason: "التعريف الحالي قاصر وفيه نوع من الدور، ويحتاج لإضافة البعد المعنوي (الثانوية) والاجتماعي للكلمة."
    authored:
      - type: terminological
        text: "صِفةُ ما كان واقِعاً على الهامِشِ أو طرَفِ الشيءِ، وتُطلَقُ على ما كان ثانوياً غيرَ أساسيٍّ، أو على مَنْ يعيشُ في معزِلٍ عن مجتمعِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05085354-n"
          definition_index: 0
          text: "صِفةُ ما كان واقِعاً على الهامِشِ أو طرَفِ الشيءِ، وتُطلَقُ على ما كان ثانوياً غيرَ أساسيٍّ، أو على مَنْ يعيشُ في معزِلٍ عن مجتمعِهِ."
  examples:
    per_lemma:
      - lemma: "هَامِشِيَّة"
        examples:
          - text: "تُؤَدّي الهامِشِيَّةُ الاِجتِماعِيَّةُ إلى شُعورِ الفَردِ بِالغُربَةِ عَن وَطَنِه."
            type: usage
      - lemma: "طَرَفِيَّة"
        examples:
          - text: "تَتَسِمُ هَذِهِ الأَحياءُ بِطَرَفِيَّتِها المَكانِيَّةِ وبُعدِها عَن خَدَماتِ المَدِينَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُؤَدّي الهامِشِيَّةُ الاِجتِماعِيَّةُ إلى شُعورِ الفَردِ بِالغُربَةِ عَن وَطَنِه."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَتَسِمُ هَذِهِ الأَحياءُ بِطَرَفِيَّتِها المَكانِيَّةِ وبُعدِها عَن خَدَماتِ المَدِينَةِ."

