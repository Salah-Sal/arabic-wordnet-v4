      reason: "التعريف الحالي ترجمةٌ شبه حرفية من الإنجليزية: vivid→حيوي (غير دقيق في
        السياق الوجداني)، impression→انطباع (مقبول لكن يحتمل التطوير)، mind→الذهن (أضعف
        من «النفس» في سياق الأثر العاطفي)؛ كما أن عبارة «ترك انطباع» بصيغة الإفراد تُضعف
        الجنس القريب في التعريف المصطلحي"
