# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-04726778-n | ILI: i61849 | POS: n
# Concept: impressiveness (the quality of making a strong or vivid impression on the mind)
# Date: 2026-03-17
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «تأثير قوي» عبارةٌ وصفيةٌ حرّة لا مصطلحٌ معجميٌّ ثابت — تفشل اختبار السكّ (يمكن إحلال «بالغ» أو «عميق» أو «شديد» محل «قوي» دون إخلال بالدلالة)"
      - "لمّة «إبهار» محلُّ خلاف لغوي: معجم الصواب اللغوي يصفها بـ«مرفوضة» لغةً لكنه يُجيزها استناداً إلى قرار مجمع اللغة العربية المصري"
      - "اللمّات الثلاث خالية من التشكيل — يجب إضافة تشكيل كامل"
    observations: >
      تدور المجموعة حول مفهوم الإبهار بوصفه صِفةً كامنةً في الشيء لا مجرّد تأثيرٍ ظرفيٍّ.
      «رَوْعَة» هي أعلى اللمّات فصاحةً وأقومها تراثاً؛ ففي مقاييس اللغة أن الأروع «يروع مَن يراه»،
      وهو وصفٌ يلتقي مع معنى المجموعة التقاءً مباشراً. «إبهار» حديثةُ الاستعمال غزيرتُه في
      العربية المعاصرة. أما «تأثير قوي» فعبارةٌ وصفيةٌ مركبة تركيباً وصفياً حراً لا يُسكّ
      مصطلحاً معجمياً، وغيابها من قواميس اللغة دليلٌ إضافيٌّ على ذلك.

  blind_candidates:
    - lemma: "هَيْبَة"
      generation_method: ishtiqaq
      justification: "مصدرُ نوعٍ من هَابَ على وزن فَعْلَة، يدل على صفة ما يُلهم الإجلال
        والخشية في النفس — قريبٌ من معنى الانطباع القوي الذي يتركه الشيء المُبهر"
    - lemma: "وَقْع"
      generation_method: majaz
      justification: "مجازٌ من معنى السقوط والإصابة إلى الأثر الذي يتركه الشيء في النفس؛
        يُقال «له وقعٌ في النفس» أي تأثيرٌ بالغٌ راسخٌ — والمجاز راسخٌ في الاستعمال"
    - lemma: "فَخَامَة"
      generation_method: ishtiqaq
      justification: "مصدرٌ من فَخُمَ على وزن فَعَالَة، ومقاييس اللغة: «يدل على جزالة وعظم» —
        صفةُ النبالة والجلالة التي تُؤثِّر في مَن يُدركها"
    - lemma: "جَلَالَة"
      generation_method: ishtiqaq
      justification: "مصدرٌ من جَلَّ على وزن فَعَالَة، تدل على صفة العظمة التي تُلهم الإجلال
        والانبهار — قد تُصلح مرادفاً لـimpressioness بمعنى الجلال والهيبة"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "إبهار"
      confirm:
        - text: "«ويجوز استكمال كلمات المادة اللغوية قياساً بتكوين المصدر «إبهار» واسم الفاعل
            «مُبْهِر»، والفعل «أبهر» منصوص عليه في بعض المعجمات»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«الصواب والرتبة: إسدال عناصر الإبهار على الفكرة [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«الْبَهْرُ الْغَلَبَةُ. يُقَالُ ضَوْءٌ بَاهِرٌ... زَوْجُ بَهْرٍ يُقَالُ
            لِلَّذِي يَبْهَرُ الْعُيُونَ بِحُسْنِهِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«إِبْهَار — الرأي: مرفوضة — السبب: لاستعمال مصدر الفعل «أبْهَر»، مع عدم
            وروده في المعاجم، بدلاً من مصدر الفعل «بهَرَ»»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "المصدر القياسي المسموع هو «بَهْر» أو «بُهُور»، وإبهار مصدر مزيد لم
            يُسمع في كلام العرب القدماء قبل الإجازة المجمعية"
      expands:
        - text: "«التعليق: يمكن تصحيح الاستعمال المرفوض اعتماداً على إجازة مجمع اللغة المصري
            ما شاع استعماله من الأفعال الثلاثية المزيدة بالهمزة «أفعل» التي جاءت بمعنى
            «فَعَل» الثلاثي المجرد، على أن تكون الهمزة لتقوية المعنى وإفادة التأكيد»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الإجازة المجمعية تُضفي على «إبهار» صحةً معيارية معاصرة، وتجعله
            الصيغة الغالبة في الكتابة الفصيحة الحديثة"

    - lemma: "تأثير قوي"
      evidence_status: "no_material_found"

    - lemma: "روعة"
      confirm:
        - text: "«الرَّوْعَةُ: المَسْحَةُ من الجمال»"
          source: "المعجم الوسيط"
        - text: "«رَوْعَة: الفزع المسحة من الجمال في كل شيء»"
          source: "المعجم الكبير"
        - text: "«الْأَرْوَعُ مِنَ الرِّجَالِ: ذُو الْجِسْمِ وَالْجَهَارَةِ، كَأَنَّهُ مِنْ
            ذَلِكَ يَرُوعُ مَنْ يَرَاهُ. وَهِيَ مِنَ النِّسَاءِ الَّتِي تَرُوعُ
            النَّاسَ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الرَّوْعَةُ: الفزعة»"
          source: "المعجم الكبير"
          addition: "تجمع روعة بين دلالتَيْ الجمال المُبهر والفزع الناجم عنه، مما يجعلها
            أشمل من مجرد «الجمال الساكن» وأقرب إلى «الجمال الذي يصعق» أي impressiveness
            بمعناه الكامل"
        - text: "«اللهم آمن رَوْعَاتي» [حديث]"
          source: "المعجم الوسيط"
          addition: "الشاهد النبوي يُثبت استعمال روعة بمعنى الأثر النفسي القوي (الفزعة)،
            وهو ما يُعزّز الرابط مع مفهوم الانطباع البالغ في النفس"

    - lemma: "هَيْبَة"
      confirm:
        - text: "«الهَيْبَةُ: المَخافَةُ، والتَّقِيَّةُ، كالمَهابَةِ. مَهِيبٌ: يَخافُهُ
            الناسُ»"
          source: "القاموس المحيط (رواية المعجم الوسيط للمؤلفين)"
        - text: "«الْهَاءُ وَالْيَاءُ وَالْبَاءُ كَلِمَةُ إِجْلَالٍ وَمَخَافَةٍ. مِنْ
            ذَلِكَ هَابَهُ يَهَابُهُ هَيْبَةً»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«الهَيْبَةُ: المَخافَةُ، والتَّقِيَّةُ»"
          source: "القاموس المحيط"
          conflict: "المعنى الأصلي لهيبة هو الخوف والإجلال (رد فعل المتأثِّر) لا صفة الشيء
            المُبهِر نفسه — انزياح دلالي عن محور المجموعة"

    - lemma: "وَقْع"
      confirm:
        - text: "«وَقْع: التأثير الذي يحدثه التواصل في نفس المتخاطبين»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«الأَثر يخالف اللون»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الْوَاوُ وَالْقَافُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَرْجِعُ إِلَيْهِ
            فُرُوعُهُ يَدُلُّ عَلَى سُقُوطِ شَيْءٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "دلالة السقوط الأصلية توفّر دعماً مجازياً لـ«الأثر النفسي»، لكن
            الاستعمال المعجمي الحديث لـ«وقع» بمعنى التأثير مقيَّدٌ بميدان التواصل
            اللغوي دون التعميم"

    - lemma: "فَخَامَة"
      expands:
        - text: "«فَخُمَ: ضَخُمَ وعَظُمَ قَدْرُهُ»"
          source: "المعجم الوسيط"
          addition: "لا توجد مداخل مستقلة لـ«فخامة» كاسم مصدر في المعجمَيْن المرجعيَّيْن
            (الوسيط والكبير)؛ الشواهد تتعلق بالصفة «فخم» لا باسم الصفة المجرد"
        - text: "«الْفَاءُ وَالْخَاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى جَزَالَةٍ
            وَعِظَمٍ. يُقَالُ: مَنْطِقٌ فَخْمٌ: جَزْلٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "المقاييس يُقيّد الفخامة بالجزالة والضخامة الجسمية أو الخطابية؛
            الدلالة أبعد من «القدرة على ترك انطباع قوي»"

    - lemma: "جَلَالَة"
      contradicts:
        - text: "«الجَلَالَةُ: النَّاقَةُ العَظِيمَةُ الجَسِيمَةُ»"
          source: "المعجم الكبير"
          conflict: "المعنى المعجمي الكلاسيكي الرئيسي لا صلة له بمعنى المجموعة"
        - text: "«الجَلاَّلة: الَّتِي تَأْكُل العَذِرَةَ ولا تأكل غيرها»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "المعنى الفقهي مختلف كلياً عن معنى impressiveness"
        - text: "«جَلالة: Majesty — صاحب [أو صاحبة] الجلالة»"
          source: "المورد الحديث (ArabTerm)"
          conflict: "الاستعمال الحديث حصري في اللقب الرسمي للملوك ولا يُستعمل صفةً مجردة
            للإبهار"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
