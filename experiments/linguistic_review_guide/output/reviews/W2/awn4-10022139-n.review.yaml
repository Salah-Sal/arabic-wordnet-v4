stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يفتقر إلى الإشارة للمعنى المجازي الكامن في مصطلح (demon)، رغم أن اللمات العربية (عفريت، داهية) تنقل هذا المجاز بدقة."
    observations: "اللمات الموجودة (داهية، عفريت) تمثل إزاحة دلالية (مجازاً) موفقة لمفهوم الشخص فائق المهارة أو النشاط، حيث نُقلت صفات الكائنات الميتافيزيقية أو الدواهي لتوصيف البراعة والنفاذ في الأمور."
  blind_candidates:
    - lemma: "عِفْرِيت"
      generation_method: majaz
      justification: "استعارة من اسم الجني الخبيث للدلالة على الشخص النافذ في الأمر بمهارة ودهاء."
    - lemma: "دَاهِيَة"
      generation_method: majaz
      justification: "تُطلق على الشخص البصير بالأمور العظيمة والذي يمتلك قدرة فائقة على حلها."
    - lemma: "جَهْبَذ"
      generation_method: ishtiqaq
      justification: "مشتقة للدلالة على الخبير الماهر الناقد، وتناسب الجزء الخاص بالمهارة الفائقة من التعريف."
    - lemma: "شُعْلَة"
      generation_method: majaz
      justification: "تستخدم مجازاً (شعلة نشاط) للشخص شديد الاجتهاد والنشاط في عمله."

stage2_evidence:
  per_lemma:
    - lemma: "عِفْرِيت"
      confirm:
        - text: "«الْخَبيث الْمُنكر والنافذ فِي الْأَمر مَعَ دهاء (ج) عفاريت»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«النافذُ في الأَمْرِ مع دهاء»"
          source: "المعجم الوسيط"
    - lemma: "دَاهِيَة"
      confirm:
        - text: "«يُقَال رجل داهية بَصِير بالأمور وَالْأَمر الْمُنكر الْعَظِيم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "جَهْبَذ"
      expands:
        - text: "«خبيرٌ بغوامض الأمور، ناقد عارف بتمييز الجيِّد من الرديء»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      contradicts:
        - text: "«النَّقَّادُ الخَبيرُ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الكلمة تدل على الخبير الناقد والصيرفي، ولا تتضمن بالضرورة معنى النشاط المحموم أو الاجتهاد الاستثنائي (demon for work)."
    - lemma: "شُعْلَة"
      expands:
        - text: "«وَيُقَال كَأَنَّهُ شعلة نشاط أَو شعلة ذكاء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«الحرارة الساطعة اللهب»"
          source: "المعجم الوسيط"
          conflict: "تحتاج إلى إضافة (مضاف إليه مثل نشاط أو ذكاء) لتفيد المعنى المطلوب، ولا تدل عليه بمفردها كاسم ذات."

stage3_analysis:
  per_lemma:
    - lemma: "عِفْرِيت"
      decision: confirmed
      decision_reason: "الكلمة تستخدم مجازاً بشكل واسع وموثق في المعاجم للدلالة على الشخص النافذ بمهارة ودهاء، وهو ما يقابل الاستخدام المجازي لـ(demon)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عِفْرِيت"
    - lemma: "دَاهِيَة"
      decision: confirmed
      decision_reason: "مصطلح فصيح يطلق على الشخص شديد البصيرة والمهارة في تدبير الأمور وحلها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَاهِيَة"
    - lemma: "جَهْبَذ"
      source: stage1
      decision: removed
      decision_reason: "تشير الكلمة إلى البراعة في النقد والتمييز المعرفي أكثر من دلالتها على الاجتهاد والنشاط العملي الاستثنائي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "شُعْلَة"
      source: stage1
      decision: removed
      decision_reason: "الكلمة لا تدل على المعنى بشكل مستقل كاسم جامد دون إضافتها إلى ما يخصصها (شعلة نشاط)."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "شخص مجتهد أو ماهر للغاية"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح، ويغطي جانبي الدلالة (الاجتهاد الشديد والمهارة الفائقة) لمفهوم المجموعة."
  examples:
    per_lemma:
      - lemma: "عِفْرِيت"
        examples:
          - text: "إنه عفريتٌ في عمله، ينجز المهام المعقدة في وقت قياسي."
            type: usage
      - lemma: "دَاهِيَة"
        examples:
          - text: "كان هذا المهندس داهيةً في ابتكار حلول سريعة للمشكلات المستعصية."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "إنه عفريتٌ في عمله، ينجز المهام المعقدة في وقت قياسي."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "كان هذا المهندس داهيةً في ابتكار حلول سريعة للمشكلات المستعصية."}

