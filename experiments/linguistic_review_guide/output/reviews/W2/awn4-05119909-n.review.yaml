# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (كفاية، ملاءمة) بدون تشكيل في المجموعة الحالية؛ التشكيل الكامل إلزامي"
      - "التعريف الحالي يستخدم «كافياً» المشتقة من جذر «كفاية» ذاتها، مما يُوقع في الدوران المنطقي"
      - "ملاءمة قد لا تنتمي إلى هذه المجموعة الدلالية — هي أقرب إلى مفهوم الصلاحية والمناسبة، لا الكفاية والوفاء بالمتطلب"
    observations: >
      المجموعة تصف صِفَةً مجردةً هي بلوغ الشيء الحدَّ المطلوب للوفاء بغرضه. في الإنجليزية
      يقابل sufficiency وadequacy في العربية توتر دلالي دقيق: كفاية تعبّر عن الوفاء
      بالمتطلب الكمي أو الكيفي الأدنى، بينما ملاءمة تعبّر عن الانسجام والصلاحية للغرض.
      هذا الفارق جوهري في الشبكة الدلالية؛ إذ للمجموعتين تقاطع لكن ليستا ترادفاً تاماً.
      المجموعة الأم (جَوْدَة / نَوْعِيَّة) تدعم أن المطلوب صفة نوعية مجردة.
  blind_candidates:
    - lemma: "إِجْزَاء"
      generation_method: ishtiqaq
      justification: >
        من الثلاثي أجزأَ (جذر ج-ز-أ) بمعنى كفى واكتفى به. المصدر على وزن إفعال يدل
        على حدث الكفاية المجردة. يستعمل في التراث الفقهي لمعنى الأداء الكافي الذي يُسقط
        الواجب.
    - lemma: "وَفَاء"
      generation_method: majaz
      justification: >
        الوفاء بالشيء إتمامُهُ وبلوغُه حدَّه التام؛ مجاز من الوفاء بالعهد إلى الكفاية
        التامة. وُرِد في التراث بمعنى تمام الشيء وكثرته.
    - lemma: "اكْتِفَاء"
      generation_method: ishtiqaq
      justification: >
        مصدر اكتفى من جذر كفي، يدل على الاستغناء بالشيء وبلوغ حده المكتفى به. اشتقاق
        داخلي صحيح.
    - lemma: "غَنَاء"
      generation_method: majaz
      justification: >
        إحياء للمعنى الكلاسيكي المهجور: الغَنَاء (بفتح الغين والمد) يعني الكفاية والنفع
        في المعجمية العربية القديمة، وهو لفظ مختلف تشكيلاً عن الغِناء الموسيقي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────────
# ميزانية الاستعلامات المستخدمة: ٦ استعلامات
# ١. مطابقة دفعية (كل اللمّات + المرشحات)
# ٢. جسر إنجليزي (sufficiency / adequacy / sufficient / adequate)
# ٣. مقاييس اللغة (جذور: كفي، لأم، غني)
# ٤. إثراء بالمعرّفات (definitions + examples)
# ٥. مقاييس — entry_id لكفا
# ٦. بحث نصي عربي (كفاية / وافٍ / مجزئ)
stage2_evidence:
  per_lemma:

    - lemma: "كفاية"
      confirm:
        - text: >
            «من (ك ف ي) الاستغناء بالشيء عن غيره، وأن يحفظ الله من كيد الغير وشره،
            والقيام بالأمر.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«كفاية» بمعنى adequacy — مصطلح اقتصادي"
          source: "المعجم الموحد لمصطلحات الاقتصاد (ARABTERM)"
        - text: >
            «كفاية» بمعنى sufficiency في باب التجارة والمحاسبة
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM)"
        - text: >
            «صفة تطلق على الأنحاء من حيث قدرتها على الملاحظة أو الوصف أو التفسير.»
            (بمعنى adequacy)
          source: "مسرد الإعلام والتواصل (ARABTERM)"
        - text: >
            «كفاية» — adequacy في المعجم الطبي الموحد
          source: "المعجم الطبي الموحد (ARABTERM)"
      expands:
        - text: >
            «الْكَافُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى
            الْحَسْبِ الَّذِي لَا مُسْتَزَادَ فِيهِ. يُقَالُ: كَفَاكَ الشَّيْءُ يَكْفِيكَ.
            وَقَدْ كَفَى كِفَايَةً، إِذَا قَامَ بِالْأَمْرِ. وَالْكُفْيَةُ: الْقُوتُ
            الْكَافِي.»
          source: "مقاييس اللغة لابن فارس (كفا)"
          addition: "يكشف المقياس الأصلي للجذر: الحَسْب الذي لا مُستزاد فيه — أي الكفاية القصوى بلا إفراط"

    - lemma: "ملاءمة"
      confirm:
        - text: >
            «التوفيق بين طموحات المتعلم وقدراته وتطلعاته والفرص المتاحة أمامه
            باستخدام أدوات واستراتيجيات مناسبة.» (بمعنى adequacy)
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (ARABTERM)"
        - text: "«ملاءمة» بمعنى appropriateness"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
        - text: "«ملاءمة» بمعنى suitability"
          source: "المعجم الموحد لمصطلحات المياه (ARABTERM)"
      contradicts:
        - text: >
            «ملاءمة» تُرجمت في موارد عديدة بـ: conformity, adaptation, fitting,
            relevance, convenience — أي أنها تدور حول الانسجام والصلاحية والتكيف لا
            الوفاء بالحد الأدنى من المتطلبات.
          source: "مسرد الفن والتسلية / مسرد الإعلام / المعجم الطبي (ARABTERM)"
          conflict: >
            معظم ترجمات ملاءمة الإنجليزية (conformity, adaptation, fitting, relevance)
            تنتمي إلى حقل الملاءمة والمناسبة لا حقل الكفاية الوصفية؛ مما يكشف أن ملاءمة
            مرتبطة بمجموعة ترادفية أخرى تخص المناسبة/الصلاحية، لا هذه المجموعة.
      expands:
        - text: >
            «اللَّامُ وَالْأَلِفُ وَالْمِيمُ أَصْلَانِ: أَحَدُهُمَا الِاتِّفَاقُ
            وَالِاجْتِمَاعُ، وَالْآخَرُ خُلُقٌ رَدِيءٌ. فَالْأَوَّلُ قَوْلُهُمْ:
            لَأَمْتُ الْجُرْحَ، وَلْأَمْتُ الصَّدْعَ، إِذَا سَدَدْتُ. وَإِذَا اتَّفَقَ
            الشَّيْئَانِ فَقَدِ الْتَأَمَا.»
          source: "مقاييس اللغة لابن فارس (لأم)"
          addition: >
            الجذر يدل على الاتفاق والاجتماع وسدّ الفجوة — مفهوم الانسجام والتوافق، لا
            مفهوم الكفاية الكمية. هذا يدعم أن ملاءمة تنتمي إلى حقل دلالي مختلف.

    - lemma: "إِجْزَاء"
      confirm:
        - text: >
            «الإِجْزَاءُ: هُوَ الأَدَاءُ الكَافِي لِسُقُوطِ التَّعَبُّدِيَّةِ، وَقِيلَ:
            سُقُوطُ الْقَضَاءِ.»
          source: "معجم مقاليد العلوم للسيوطي"
      contradicts:
        - text: >
            «الأَجْزَاء: هُوَ جَمْعُ الجُزْءِ، وَالأَجْزَاءُ الأَصْلِيَّةُ وَالزَّائِدَةُ
            يُذْكَرُ تَفْسِيرُهُمَا فِي لَفْظِ المَنْوِ.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            «الأجزاء» في الاستعمال العام هو جمع «الجزء» (parts) لا اسم مصدر للكفاية،
            مما يوقع في لبس دلالي شديد.

    - lemma: "وَفَاء"
      contradicts:
        - text: >
            «الوفاء: ملازمة طريق المواساة، ومحافظة عهود الخلطاء.»
          source: "كتاب التعريفات للجرجاني"
          conflict: >
            التعريف الراسخ للوفاء في المعجمية العربية هو الإخلاص والوفاء بالعهد، لا
            الكفاية وبلوغ الغرض.
        - text: >
            «الوفاء: ملازمة طريق المساواة ومحافظة العهود وحفظ مراسم المحبة والمخالطة
            سراً وعلانية حضوراً وغيبة.»
          source: "دستور العلماء للأحمدنكري"
          conflict: "معنى الوفاء مرتبط بالأخلاق والمعاملات لا بصفة الكفاية المجردة."
      expands:
        - text: >
            «من (و ف ي) تمام الشيء وكثرته، والعمل بالعهد وأداء النذر.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يتضمن معنى «تمام الشيء» الذي يقترب من الكفاية لكن المعنى الأغلب هو أداء
            العهد والإخلاص.

    - lemma: "اكْتِفَاء"
      contradicts:
        - text: >
            «الاكتفاء: بالفاء هو عند أهل المعاني نوع من أنواع الحذف وهو أن يقتضي المقام
            ذكر شيئين بينهما تلازم وارتباط، فيكتفى بأحدهما عن الآخر لنكتة.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            في علم البلاغة «الاكتفاء» مصطلح بلاغي يعني الاكتفاء بذكر أحد طرفي التلازم،
            وهو مختلف تماماً عن الكفاية بمعنى الاستيفاء.
      expands:
        - text: >
            «التقليل من استهلاك المواد الخام والطاقة عن طريق خفض الاستهلاك والحد من
            استخدام وسائل الرفاهية.» (sufficiency — في سياق الطاقة المتجددة)
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (ARABTERM)"
          addition: >
            يُستخدم اكتفاء في السياق التقني بمعنى الاكتفاء الذاتي (self-sufficiency)
            وليس الصفة المجردة للكفاية.

    - lemma: "غَنَاء"
      confirm:
        - text: >
            «الغَنَاء، بِفَتْحِ الغَيْنِ وَالمَدِّ، قَالَ أَبُو مَنْصُورٍ: الغَنَاءُ،
            بِفَتْحِ الغَيْنِ وَالمَدِّ، الإِجْزَاءُ وَالكِفَايَةُ، يُقَالُ: رَجُلٌ
            مُغْنٍ أَيْ مُجْزٍ كَافٍ.»
          source: "معجم البلدان لياقوت الحموي"
        - text: >
            «(الغَنَاء) ضِدُّ الفَقْرِ وَالنَّفْعُ وَالكِفَايَةُ يُقَالُ هَذَا الشَّيْءُ
            لَا غَنَاءَ فِيهِ»
          source: "المعجم الوسيط (مخطوط)"
        - text: >
            «ضدّ الفقر — النَّفْعُ والكفايةُ» (مع المثال: هذا الشيءُ لا غَنَاءَ فيه)
          source: "المعجم الوسيط (طبعة OCR)"
        - text: >
            «من (غ ن ي) ضد الفقر، والنفع، والكفاية.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: >
            «الْغَيْنُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ،
            أَحَدُهُمَا يَدُلُّ عَلَى الْكِفَايَةِ، وَالْآخَرُ صَوْتٌ. فَالْأَوَّلُ
            الْغِنَى فِي الْمَالِ. يُقَالُ: غَنِيَ يَغْنَى غِنًى. وَالْغَنَاءُ بِفَتْحِ
            الْغَيْنِ مَعَ الْمَدِّ: الْكِفَايَةُ. يُقَالُ: لَا يُغْنِي فُلَانٌ
            غَنَاءَ فُلَانٍ.»
          source: "مقاييس اللغة لابن فارس (غني)"
          addition: >
            ابن فارس يفرّق صراحةً بين الغَنَاء (بالفتح) = الكفاية، والغِناء (بالكسر)
            = الصوت. هذا الفرق التشكيلي يرفع اللبس الدلالي.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "كفاية"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة راسخة في التراث اللغوي والمعجمي العربي. مصدر قياسي من كفى يكفي.
        توثيقها في المعجمية العربية الحديثة والكلاسيكية متواتر ومتطابق مع دلالة المجموعة.
        تحتاج فقط إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تعبّر عن بلوغ الحدِّ الأدنى الكافي من المتطلبات الكمية أو الكيفية — مفهوم
        الوفاء بالعتبة المطلوبة دون نقص. تُستخدم في السياقات الرسمية والتقنية عن
        الاستيفاء الموضوعي للشرط.
      quality_gate:
        ittiraad: "راسخ في الفصيح"
        yusr_altadawul: "عالي — ذائع في الكتابة الرسمية والتقنية"
        mulaaama: "ملائم للمجموعة الدلالية"
        ithaar_turathi: "ثراثي أصيل"
        ithaar_arabi: "عربي صرف من جذر كفي"
        ishtiqaqiyya: "مصدر صناعي / قياسي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِفَايَة"

    - lemma: "ملاءمة"
      decision: removed
      decision_reason: >
        ملاءمة تنتمي دلالياً إلى حقل الصلاحية والانسجام والتوافق (suitability /
        appropriateness / fitness) لا حقل الكفاية واستيفاء الحد المطلوب (sufficiency /
        adequacy بمعناها الكمي). جذرها (ل-أ-م) يدل في مقاييس اللغة على الاتفاق
        والاجتماع وسدّ الفجوة — لا على بلوغ الحد. معظم ترجماتها في ARABTERM
        (conformity, adaptation, fitting, relevance, convenience) تنتمي إلى مجموعة
        دلالية مختلفة. يُستحسن نقلها إلى مجموعة ترادفية خاصة بـ suitability /
        appropriateness.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِجْزَاء"
      source: stage1
      decision: removed
      decision_reason: >
        إجزاء هو مصطلح فقهي تقني يدل على «الأداء الكافي لسقوط التعبدية»، لا صفة
        مجردة للكفاية. فضلاً عن ذلك، «الأجزاء» (الصيغة الأكثر شيوعاً) هي جمع
        «جزء» (parts)، مما يوقع في لبس دلالي حاد. هذا المرشح لا يصلح لمجموعة الكفاية
        العامة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "وَفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الوفاء في المعجمية العربية مستقرٌّ على معنى الإخلاص ومحافظة العهد؛ وهو معنى
        راسخ لا يمكن إزاحته. المعنى الذي يقترب من «الكفاية» (تمام الشيء) هو معنى
        ثانوي هامشي لا يبرر إدراجه في هذه المجموعة. إدراجه سيُحدث خلطاً بين حقل
        الكفاية وحقل الأمانة والإخلاص.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "اكْتِفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        اكتفاء مثقل بمعنيين متنافسين: (أ) مصطلح بلاغي يعني نوعاً من الحذف، و(ب) مفهوم
        الاكتفاء الذاتي (self-sufficiency) في السياق الاقتصادي. لا يُستخدم اكتفاء وحده
        للدلالة على الصفة المجردة للكفاية؛ وعند استخدامه فهو يقترن دائماً بـ«ذاتي».
        يختلف عن كِفَايَة اختلافاً جوهرياً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "غَنَاء"
      source: stage1
      decision: confirmed
      decision_reason: >
        غَنَاء (بفتح الغين والمد) موثَّق في المعجمية العربية الكلاسيكية والمعيارية
        بمعنى الكفاية والنفع توثيقاً صريحاً. ابن فارس في المقاييس يفرد له معنى مستقلاً:
        «الغَنَاءُ بفتح الغين مع المدِّ: الكِفَايَةُ». المعجم الوسيط يُعرّفه: «النَّفْعُ
        والكفايةُ». أبو منصور الأزهري يصرّح: «رجل مُغْنٍ أي مُجْزٍ كافٍ». التمييز
        التشكيلي بين غَنَاء (فتح) = كفاية وغِناء (كسر) = موسيقى يرفع اللبس. إحياء هذا
        اللفظ المهجور يُثري الشبكة الدلالية بمصطلح موروث.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يضيف بُعداً نفعياً وعملياً إلى جانب الكفاية — «الغَنَاء» يدل على الكفاية
        المقترنة بالنفع والجدوى (هذا الشيء لا غَنَاء فيه = لا نفع كافٍ فيه)، بينما
        كِفَايَة تُركّز على استيفاء الشرط والحد الأدنى من المتطلبات.
      borrowing_check:
        type: ishtiqaq_arabi
