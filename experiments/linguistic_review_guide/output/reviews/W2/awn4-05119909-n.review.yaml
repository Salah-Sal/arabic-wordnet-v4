# ── المرحلة ٥: الإثراء ────────────────────────────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "كِفَايَة"
      entry_id: "{auto}"
      root: "كفي"
      maqayis_quote: >
        «الْكَافُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى
        الْحَسْبِ الَّذِي لَا مُسْتَزَادَ فِيهِ. يُقَالُ: كَفَاكَ الشَّيْءُ يَكْفِيكَ.
        وَقَدْ كَفَى كِفَايَةً، إِذَا قَامَ بِالْأَمْرِ. وَالْكُفْيَةُ: الْقُوتُ
        الْكَافِي.»

    - lemma: "غَنَاء"
      entry_id: "{auto}"
      root: "غني"
      maqayis_quote: >
        «الْغَيْنُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا
        يَدُلُّ عَلَى الْكِفَايَةِ، وَالْآخَرُ صَوْتٌ. فَالْأَوَّلُ الْغِنَى فِي الْمَالِ.
        يُقَالُ: غَنِيَ يَغْنَى غِنًى. وَالْغَنَاءُ بِفَتْحِ الْغَيْنِ مَعَ الْمَدِّ:
        الْكِفَايَةُ. يُقَالُ: لَا يُغْنِي فُلَانٌ غَنَاءَ فُلَانٍ.»

