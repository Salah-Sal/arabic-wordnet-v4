        value: '{"root":"قرر","maqayis":"«الْقَافُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدَهُمَا عَلَى بَرْدٍ، وَالْآخَرُ عَلَى تَمَكُّنٍ... وَالْأَصْلُ الْآخَرُ التَّمَكُّنُ، يُقَالُ قَرَّ وَاسْتَقَرَّ.»"}'
    - command: set_metadata
