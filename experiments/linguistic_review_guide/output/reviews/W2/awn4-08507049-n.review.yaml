stage1_review:
  assessment:
    concerns:
      - "كلمة «موطن» قد تحمل دلالة بيئية أو قومية أكثر من كونها مجرد ارتكاز أو مقَرّ في بعض السياقات، ولكن استخدامها الاستعاري شائع."
      - "التعريف يركز على «الموقع مجازياً» بينما اللمات الموجودة تشمل «مقر» و«موطن»."
    observations: "اللمتان «مقر» و«موطن» تعبران بوضوح عن الجانب المجازي للاستقرار والمكانة. و«مقر» أشد التصاقاً بمعنى (seat) كما في (seat of government) أو مقر السلطة."
  blind_candidates:
    - lemma: "مَقَرّ"
      generation_method: ishtiqaq
      justification: "اسم مكان من الفعل (قرّ)، ويدل على موضع الاستقرار وهو ملائم جداً للمعنى المجازي للارتكاز."
    - lemma: "مَرْكَز"
      generation_method: ishtiqaq
      justification: "اسم مكان من الفعل (ركز)، ويدل على نقطة التجمع والارتكاز وتستعمل بكثرة في المعاني المجازية."
    - lemma: "مُرْتَكَز"
      generation_method: ishtiqaq
      justification: "اسم مكان من (ارتكز)، ويدل بصورة مباشرة على نقطة الارتكاز والأساس."
    - lemma: "قَاعِدَة"
      generation_method: ishtiqaq
      justification: "من الفعل (قعد) وتعني الأساس الذي يُبنى أو يستقر عليه الشيء، وتستعمل مجازاً."

stage2_evidence:
  per_lemma:
    - lemma: "مقر"
      confirm:
        - text: "مَوْضِعُ الاستقرار محلّ يتَّخِذُهُ الإنسان مكاناً لإقامته"
          source: "المعجم الوسيط"
    - lemma: "موطن"
      confirm:
        - text: "الوطن وكل مَكَان أَقَامَ بِهِ الْإِنْسَان لأمر والمجلس والمشهد من مشَاهد الْحَرْب (ج) مَوَاطِن"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "تموطَن الدَّاءُ في الجسد: مُطاوع موطَنَ: تمركَز فيه؛ استقرّ فيه"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "مركز"
      confirm:
        - text: "المَقَرُّ الثَّابِتُ الذى تَتَشَعَّبُ منه الفروع... مركز الرَّجُل: منزلتُه ومكانتُه الحسِّيَّةُ أو المعنويَّة"
          source: "المعجم الوسيط"
        - text: "تمركَز في المكان: مُطاوع مركَزَ: اتَّخذه مَقرًّا ثابتًا أو نقطة أساسيّة له، استقرّ في مركزه"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "مرتكز"
      confirm:
        - text: "بنية تشريحية التي تقوم بدور مفصل أو تعمل بمثابة نقطة ارتكاز في جسم كائن حي أو في آلة."
          source: "مسرد المناخ والبيئة (ArabTerm)"
    - lemma: "قاعدة"
      confirm:
        - text: "القاعدة: ما يقعد عليه الشيء، أي يستقر ويثبت."
          source: "التوقيف على مهمات التعاريف للمناوي"

stage3_analysis:
  per_lemma:
    - lemma: "مَقَرّ"
      decision: confirmed
      decision_reason: "كلمة أصيلة وشائعة الاستخدام وتتطابق مع المعنى المجازي للارتكاز والاستقرار."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَقَرّ"
    - lemma: "مَوْطِن"
      decision: confirmed
      decision_reason: "تستعمل مجازاً بمعنى مكان استقرار الشيء، كقولنا (موطن الداء) وهي دقيقة وفصيحة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْطِن"
    - lemma: "مَرْكَز"
      source: stage1
      decision: confirmed
      decision_reason: "المركز هو نقطة الثبات والتجمع التي تتشعب منها التأثيرات، واستخدامها يتطابق بقوة مع المعنى المجازي (Seat)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَرْكَز", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُرْتَكَز"
      source: stage1
      decision: removed
      decision_reason: "المرتكز يحمل دلالة حسية تقنية أقوى كنقطة ارتكاز ميكانيكية، ولا يتطابق تماماً مع الدلالة المجازية الواسعة للـ (seat) التي يقابلها مقر ومركز وموطن."
    - lemma: "قَاعِدَة"
      source: stage1
      decision: removed
      decision_reason: "دلالتها أعم وأشمل، وتشير إلى الأساس الذي يُبنى عليه أكثر من كونها المكان أو المقر المجازي لعمل الشيء."

stage4_content:
  definition:
    current: "الموقع (مجازياً) الذي يرتكز عليه شيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول لكن يمكن تحسينه ليكون أكثر معجمية وأقل اعتماداً على كلمة (مجازياً) بأسلوب وصفي مباشر."
    authored:
      - type: terminological
        text: "موضع يُتَّخذ للاستقرار أو الارتكاز المعنوي، وتنطلق منه التأثيرات أو الفاعلية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "موضع يُتَّخذ للاستقرار أو الارتكاز المعنوي، وتنطلق منه التأثيرات أو الفاعلية."}
  examples:
    per_lemma:
      - lemma: "مَقَرّ"
        examples:
          - text: "القلبُ مَقَرُّ العاطفةِ والوجدانِ."
            type: usage
      - lemma: "مَوْطِن"
        examples:
          - text: "اكتشفَ الطبيبُ مَوْطِنَ الدَّاءِ وعالجه."
            type: usage
      - lemma: "مَرْكَز"
        examples:
          - text: "أصبحت المدينةُ مَرْكَزاً للإشعاع الثقافي."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "القلبُ مَقَرُّ العاطفةِ والوجدانِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "اكتشفَ الطبيبُ مَوْطِنَ الدَّاءِ وعالجه."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أصبحت المدينةُ مَرْكَزاً للإشعاع الثقافي."}

stage5_enrichment:
  per_entry:
    - lemma: "مَقَرّ"
      entry_id: "{auto}"
      root: "قرر"
      maqayis_quote: "«الْقَافُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدَهُمَا عَلَى بَرْدٍ، وَالْآخَرُ عَلَى تَمَكُّنٍ... وَالْأَصْلُ الْآخَرُ التَّمَكُّنُ، يُقَالُ قَرَّ وَاسْتَقَرَّ.»"
    - lemma: "مَوْطِن"
      entry_id: "{auto}"
      root: "وطن"
      maqayis_quote: "«الْوَاوُ وَالطَّاءُ وَالنُّونُ: كَلِمَةٌ صَحِيحَةٌ. فَالْوَطَنُ: مَحَلُّ الْإِنْسَانِ. وَأَوْطَانُ الْغَنَمِ: مَرَابِضُهَا. وَأَوْطَنْتُ الْأَرْضَ: اتَّخَذْتُهَا وَطَنًا.»"
    - lemma: "مَرْكَز"
      entry_id: "{auto}"
      root: "ركز"
      maqayis_quote: "«الرَّاءُ وَالْكَافُ وَالزَّاءُ أَصْلَانِ: أَحَدُهُمَا إِثْبَاتُ شَيْءٍ فِي شَيْءٍ يَذْهَبُ سُفْلًا، وَالْآخَرُ صَوْتٌ... فَالْأَوَّلُ: رَكَزْتُ الرُّمْحَ رَكْزًا. وَمَرْكَزُ الْجُنْدِ: الْمَوْضِعُ الَّذِي أُلْزِمُوهُ.»"
  per_sense:
    - lemma: "مَقَرّ"
      sense_id: "{auto}"
      nuance: "يركز على دوام الاستقرار وكونه مرجعاً أساسياً تنطلق منه الفعالية."
      mwe: false
    - lemma: "مَوْطِن"
      sense_id: "{auto}"
      nuance: "يركز على المكان الذي يتخذه الشيء سكناً أو مستقراً مجازياً وكأنه موطنه الأصلي."
      mwe: false
    - lemma: "مَرْكَز"
      sense_id: "{auto}"
      nuance: "يركز على كونه نقطة التجمع الثابتة التي تتشعب منها الأفرع أو تتلقى منها التوجيهات."
      mwe: false
  synset:
    cultural_fit: native
  actions:
