stage1_review:
  assessment:
    concerns:
      - "نقص التشكيل في اللمات الحالية."
      - "اللمة 'اجتماعية إيجابية' هي ترجمة حرفية للمصطلح الإنجليزي (Positive Sociality) وقد لا تكون شائعة في المعاجم العربية العامة."
    observations: "المجموعة تعبر عن مفهوم 'الإيجابية الاجتماعية' أو 'السلوك الذي ينفع المجتمع'. التعريف الحالي دقيق من حيث المضمون لكنه يحتاج إلى صياغة معجمية أكثر رصانة."
  blind_candidates:
    - lemma: "نَفْعِيَّةٌ مُجْتَمَعِيَّةٌ"
      generation_method: tarkib
      justification: "تعبير عن جودة كون الشيء مفيداً للمجتمع (Social Utility)."
    - lemma: "تَكَافُلِيَّةٌ"
      generation_method: ishtiqaq
      justification: "من التكافل وهو إعانة الناس بعضهم بعضاً، وتناسب وصف 'الجودة' المطلوبة في التعريف."
    - lemma: "مُوَاطَنَةٌ صَالِحَةٌ"
      generation_method: tarkib
      justification: "مفهوم يعبر عن السلوك المتسق مع قوانين وعادات المجتمع والنافع له."
    - lemma: "إِيجَابِيَّةٌ اجْتِمَاعِيَّةٌ"
      generation_method: tarkib
      justification: "قلب للمصطلح الحالي ليكون 'الإيجابية' هي المبتدأ الموصوف بالاجتماعية."

stage2_evidence:
  per_lemma:
    - lemma: "اجتماعية إيجابية"
      evidence_status: "no_material_found"
    - lemma: "سلوك مؤيد للمجتمع"
      confirm:
        - text: "«سلوك إرادي يقوم به شخص لفائدة شخص آخر»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "نَفْعِيَّةٌ مُجْتَمَعِيَّةٌ"
      expands:
        - text: "«اجتماعيّ النَّزعة: مُهتمّ بالخِدْمة الاجتماعيّة أو بمصلحة المجتمع وخِدْمته بشكل عام»"
          source: "المعجم الوسيط (مادة نزع)"
          addition: "يؤكد وجود مفهوم التوجه نحو نفع المجتمع في المعاجم الحديثة."
    - lemma: "تَكَافُلِيَّةٌ"
      confirm:
        - text: "«التكافل: أن يكفل بعض الناس بعضاً»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "اجتماعية إيجابية"
      decision: confirmed
      decision_reason: "مصطلح علمي مستخدم في علم النفس والاجتماع (Positive Sociality)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِجْتِمَاعِيَّةٌ إِيجَابِيَّةٌ"
    - lemma: "سلوك مؤيد للمجتمع"
      decision: confirmed
      decision_reason: "الترجمة القياسية المعتمدة لمصطلح (Prosocial Behavior) في الأوساط الأكاديمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُلُوكٌ مُؤَيِّدٌ لِلْمُجْتَمَعِ"
    - lemma: "نَفْعِيَّةٌ اجْتِمَاعِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر بدقة عن 'جودة كون الشيء مفيداً' الواردة في التعريف."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "نَفْعِيَّةٌ اجْتِمَاعِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "سُلُوكٌ اجْتِمَاعِيٌّ مُتَضَامِنٌ"
      decision: confirmed
      decision_reason: "وارد في معجم ArabTerm كمرادف لـ prosocial behaviour."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "سُلُوكٌ اجْتِمَاعِيٌّ مُتَضَامِنٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "جودة كون الشيء مفيداً لجميع الأطراف ومتسقاً مع قوانين وعادات المجتمع"
    assessment:
      decision: revise
      reason: "الصياغة الحالية 'جودة كون الشيء' ضعيفة معجمياً."
    authored:
      - type: terminological
        text: "صِفةُ السلوك أو الحالة التي تهدفُ إلى نفعِ الآخرين أو المجتمع، وتتسمُ بالتعاونِ والتآزرِ والالتزامِ بالمعاييرِ والقِيَمِ الاجتماعية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "صِفةُ السلوك أو الحالة التي تهدفُ إلى نفعِ الآخرين أو المجتمع، وتتسمُ بالتعاونِ والتآزرِ والالتزامِ بالمعاييرِ والقِيَمِ الاجتماعية."}
  examples:
    per_lemma:
      - lemma: "اِجْتِمَاعِيَّةٌ إِيجَابِيَّةٌ"
        examples:
          - text: "تُعدُّ الاجتماعيةُ الإيجابيةُ ركيزةً أساسيةً في تعزيزِ التماسكِ الوَطني."
            type: usage
      - lemma: "سُلُوكٌ مُؤَيِّدٌ لِلْمُجْتَمَعِ"
        examples:
          - text: "التبرعُ بالدمِ هو سُلُوكٌ مُؤَيِّدٌ لِلْمُجْتَمَعِ يُنقذُ حياةَ الكثيرين."
            type: usage
      - lemma: "نَفْعِيَّةٌ اجْتِمَاعِيَّةٌ"
        examples:
          - text: "يجبُ تقييمُ المشاريعِ الجديدةِ بناءً على نفعيَّتِها الاجتماعيةِ ومدى استدامتِها."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُعدُّ الاجتماعيةُ الإيجابيةُ ركيزةً أساسيةً في تعزيزِ التماسكِ الوَطني."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "التبرعُ بالدمِ هو سُلُوكٌ مُؤَيِّدٌ لِلْمُجْتَمَعِ يُنقذُ حياةَ الكثيرين."}

stage5_enrichment:
  per_entry:
    - lemma: "اِجْتِمَاعِيَّةٌ إِيجَابِيَّةٌ"
      entry_id: "{auto}"
      roots:
        - word: "اجتماعية"
          root: "جمع"
          maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ.»"
        - word: "إيجابية"
          root: "وجب"
          maqayis_quote: "«الْوَاوُ وَالْجِيمُ وَالْبَاءُ: أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى سُقُوطِ الشَّيْءِ وَوُقُوعِهِ... وَوَجَبَ الْبَيْعُ وُجُوبًا: حَقَّ وَوَقَعَ.»"
    - lemma: "سُلُوكٌ مُؤَيِّدٌ لِلْمُجْتَمَعِ"
      entry_id: "{auto}"
      roots:
        - word: "سلوك"
          root: "سلك"
          maqayis_quote: "«السِّينُ وَاللَّامُ وَالْكَافُ أَصْلٌ يَدُلُّ عَلَى نُفُوذِ شَيْءٍ فِي شَيْءٍ.»"
        - word: "مؤيد"
          root: "ايد"
          maqayis_quote: "«الْهَمْزَةُ وَالْيَاءُ وَالدَّالُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى الْقُوَّةِ وَالْحِفْظِ.»"
  per_sense:
    - lemma: "اِجْتِمَاعِيَّةٌ إِيجَابِيَّةٌ"
      sense_id: "{auto}"
      nuance: "تعبر عن الصفة أو الجودة المجردة للتوجه الاجتماعي النافع."
      mwe: true
    - lemma: "سُلُوكٌ مُؤَيِّدٌ لِلْمُجْتَمَعِ"
      sense_id: "{auto}"
      nuance: "تركز على الجانب العملي والفعلي (الأفعال) التي تصب في مصلحة المجتمع."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"اجتماعية","root":"جمع","maqayis":"«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ.»"},{"word":"إيجابية","root":"وجب","maqayis":"«الْوَاوُ وَالْجِيمُ وَالْبَاءُ: أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى سُقُوطِ الشَّيْءِ وَوُقُوعِهِ...»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبر عن الصفة أو الجودة المجردة للتوجه الاجتماعي النافع.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
