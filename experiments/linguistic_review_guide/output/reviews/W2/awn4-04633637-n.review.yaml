stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي يبدو كترجمة حرفية للتعريف الإنجليزي (طبيعة أو صفة عاطفية)."
    observations: "المفهوم يعبر عن الطبيعة العاطفية أو الميل للانفعال والاستجابة الشعورية. اللمات الموجودة 'انفعالية' و'عاطفية' هي مصادر صناعية مصاغة بطريقة صحيحة وتعبر عن هذه الحالة بدقة، وتطابق المفهوم الإنجليزي (emotionality, emotionalism)."
  blind_candidates:
    - lemma: "عَاطِفِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من العاطفة، يدل على الاتصاف بها."
    - lemma: "اِنْفِعَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الانفعال، يدل على القابلية للتأثر السريع."
    - lemma: "وِجْدَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الوجدان، يعبر عن الطبيعة المتعلقة بالمشاعر."
    - lemma: "مِزَاج عَاطِفِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر عن طبيعة الشخص المائلة إلى العاطفة."

stage2_evidence:
  per_lemma:
    - lemma: "انفعالية"
      confirm:
        - text: "العاطفيّة؛ الانفعاليّة."
          source: "المورد الحديث (2008)"
    - lemma: "عاطفية"
      confirm:
        - text: "العاطفيّة: «أ» الاسترسال مع العاطفة. «ب» نزعة إلى النظر للأشياء عاطفيًا."
          source: "المورد الحديث (2008)"
        - text: "العاطفيّة؛ الانفعاليّة."
          source: "المورد الحديث (2008)"
    - lemma: "وِجْدَانِيَّة"
      evidence_status: "no_material_found"
    - lemma: "مِزَاج عَاطِفِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "انفعالية"
      decision: confirmed
      decision_reason: "مصدر صناعي متداول ومعتمد معجمياً للدلالة على القابلية للانفعال أو الحالة الانفعالية (emotionality)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْفِعَالِيَّة"

    - lemma: "عاطفية"
      decision: confirmed
      decision_reason: "مصدر صناعي معتمد للدلالة على الطبيعة العاطفية والاسترسال مع العاطفة (emotionalism/emotionality)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَاطِفِيَّة"

    - lemma: "وِجْدَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يثبت استخدامها بنفس الشيوع للدلالة المطلوبة كسمة شخصية مقارنة بـ 'عاطفية' و'انفعالية'."
      evidence_assessment:
        case: no_material

    - lemma: "مِزَاج عَاطِفِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر وليس مصطلحاً مسكوكاً ثابتاً."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "طبيعة أو صفة عاطفية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية (emotional nature or quality)، ويمكن تحسينه ليصبح أكثر دقة وملاءمة للأسلوب المعجمي العربي بحيث يركز على الميول والاستجابات الشعورية."
    authored:
      - type: terminological
        text: "حالة أو طبيعة تتسم بسرعة الاستجابة للمشاعر، والميل إلى التأثر العاطفي وتغليب الوجدان."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04633637-n"
          definition_index: 0
          text: "حالة أو طبيعة تتسم بسرعة الاستجابة للمشاعر، والميل إلى التأثر العاطفي وتغليب الوجدان."

  examples:
    per_lemma:
      - lemma: "اِنْفِعَالِيَّة"
        examples:
          - text: "تغلبت الانفعالية على قراراته في تلك الأزمة بدلاً من الحكمة والتروي."
            type: usage
      - lemma: "عَاطِفِيَّة"
        examples:
          - text: "تتسم كتابات الشاعر بعاطفية شديدة ومشاعر جياشة تجذب القراء."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تغلبت الانفعالية على قراراته في تلك الأزمة بدلاً من الحكمة والتروي."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتسم كتابات الشاعر بعاطفية شديدة ومشاعر جياشة تجذب القراء."

