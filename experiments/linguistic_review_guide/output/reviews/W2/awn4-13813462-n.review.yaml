# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «أَسَاس» مكررة في هذه المجموعة (awn4-13813462-n) وفي المجموعة الأم المباشرة (awn4-13812924-n التي تضم أَسَاس وقَاعِدَة)، مما يُنشئ حلقة دلالية ذاتية إشكالية في الشبكة."
      - "التعريف العربي «الأساس أو المصدر الجوهري» دائري؛ يستخدم لفظ «أساس» وهو لمّة المجموعة نفسها لشرح معناها."
      - "اللمّة «جُذُور» صيغة جمع، وقياس الشبكات الدلالية يُفضّل المفرد الإحالي للتمثيل المعجمي؛ غير أن «grass roots» مفهوم جمعي تراكمي بطبيعته."
      - "المفهوم الاجتماعي-السياسي لـ«grass roots» (القاعدة الشعبية في مقابل النخبة) غائب عن التعريف العربي الحالي."
    observations: >
      المجموعة تُعبّر عن مفهوم «grass roots» الإنجليزي بمعنييه: (أ) الأصل الجوهري والمنبع الأولي
      لشيء ما، و(ب) القاعدة الشعبية العريضة في السياق التنظيمي والسياسي. اللمّتان الحاليتان
      تُمثّلان المعنى (أ) بصورة جزئية، لكن المعنى (ب) الأدق لـ«grass roots» غائب. وجود «أَسَاس»
      في المجموعة الأم والمجموعة الابنة يُشكّل خللاً تصنيفياً واضحاً، إذ يصبح المفهوم تصنيفاً
      فرعياً لنفسه. «جُذُور» أقوى المصطلحين؛ فالجذر العربي (جذر) يُعطي دلالة الأصل الحيوي المتشعّب.

  blind_candidates:
    - lemma: "الْمَنْبِتُ"
      generation_method: majaz
      justification: >
        إحياء للفظ كلاسيكي من الجذر (نبت) على وزن مَفْعِل، يعني في أصله «موضع الإنبات».
        المجاز الدلالي: توسيع ليشمل المنشأ الجوهري والمصدر الأولي لأي شيء، وقد ورد في التراث
        قولهم «إنه لفي منبت صدق» بمعنى الأصل الأصيل. فضّل الإحياء على الاشتقاق الجديد
        تجنّباً للاشتراك اللفظي مع الألفاظ الحية.

    - lemma: "الْجَذْرُ"
      generation_method: majaz
      justification: >
        توسيع دلالي مجازي للفظ الكلاسيكي المعروف؛ (جِذْر = أصل كل شيء ومنشؤه) بما يُغطّي
        مفهوم «grass roots» بدلالته الأولية: الأصل الجوهري الكامن في عمق الأشياء. المفرد
        أدق من الصيغة الجمعية في التمثيل المعجمي، وهو مدعوم من أقدم المعجمين (كتاب العين،
        مقاييس اللغة، مجمل اللغة).

    - lemma: "الرَّكِيزَةُ"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ركز) على وزن فَعِيلة الدال على المسمّى الجوهري الذي يرتكز عليه غيره؛
        الدلالة على الدعامة الأساسية والركن الجوهري الذي يستند إليه أمر ما، مما يلتقي مع
        مفهوم «الأساس الجوهري». الوزن فَعِيلة يناسب دلالة الاسم الذي تُوكَل إليه مهمة الدعم.

    - lemma: "الْقَاعِدَةُ الشَّعْبِيَّةُ"
      generation_method: tarkib
      justification: >
        مركب وصفي (إضافي-وصفي) راسخ في الخطاب السياسي العربي الحديث للتعبير عن «grass roots»
        بمعناه الاجتماعي التنظيمي: الطبقة الشعبية القاعدية في أي حركة أو تنظيم أو مؤسسة،
        في مقابل القيادة والنخبة. التركيب الإضافي-الوصفي من نوع «إضافي» (قاعدة + الشعبية).


