# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "أَسَاس"
      decision: removed
      decision_reason: >
        وجود «أَسَاس» لمّةً في هذه المجموعة (awn4-13813462-n) وفي المجموعة الأم المباشرة
        (awn4-13812924-n) يُنشئ حلقة دلالية ذاتية: «أَسَاس» يصبح نوعاً فرعياً من «أَسَاس»،
        وهو تناقض أنطولوجي في شبكة WordNet. يُضاف إلى ذلك أن تعريف المجموعة «الأساس أو المصدر
        الجوهري» دائري لاستخدامه اللمّة ذاتها. الإزالة تُصحّح البنية دون فقدان التغطية الدلالية؛
        إذ تبقى «جُذُور» ممثّلاً وافياً للمفهوم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جُذُور"
      decision: confirmed
      decision_reason: >
        «جُذُور» جمع «جَذْر» وهو الترجمة المجازية الأدق لـ«grass roots» في الاستعمال العربي.
        الأدلة المعجمية من أقدم المصادر (كتاب العين، مقاييس اللغة، المعجم الوسيط) تُثبت أن
        دلالة الجذر (جذر) على الأصل المطلق لكل شيء راسخة ومُجمَع عليها. الصيغة الجمعية ملائمة
        لأن «grass roots» مفهوم جمعي تراكمي بطبيعته في اللغتين. التشكيل الحالي صحيح.
        فحص MWE: كلمة مفردة (جمع). فحص الفصاحة: فصيح معجمي بامتياز. فحص الاشتقاقية: جذر
        ثلاثي واضح (ج-ذ-ر). بوابة جودة المصطلح: مطّرد شائع الفصيح، يسير التداول، ملائم،
        تراثي، عربي خالص، قابل للاشتقاق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «جُذُور» تحمل صورة عضوية حيّة — كتشعّب الجذور النباتية في التربة — مما يُضفي دلالة
        النشأة التدريجية والحيوية النامية على الأصل، في مقابل «أَسَاس» ذي الدلالة البنيوية
        الثابتة (الأساس المادي الذي يرتكز عليه بناء). «جُذُور» تُوحي بالجوهر الكامن في العمق،
        بينما «أَسَاس» يُوحي بالركيزة الظاهرة التي تحمل ما فوقها.

    - lemma: "الْمَنْبِتُ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم الدعم المعجمي الجيد، «المنبت» يحمل دلالة مكانية-ظرفية (موضع الإنبات) أكثر من
        كونه مصطلحاً للأصل الجوهري. الاستعمال المعياري في التراث هو «منبت صدق/سوء» بمعنى
        الأصل النسبي، لا الأصل الجوهري لمفهوم مجرد. لا يُضيف تمييزاً دلالياً واضحاً عن
        «جُذُور» في السياق المطلوب.

    - lemma: "الْجَذْرُ"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر المفرد لـ«جُذُور» المُثبَّتة؛ إضافته تُكرّر المفهوم ذاته بصيغة مفردة. في السياق
        العربي المعاصر، تُستخدم «جذور» (الجمع) للتعبير عن «grass roots» كمفهوم جماعي، ولا
        ضرورة لإضافة المفرد بوصفه لمّة مستقلة في هذه المجموعة.

    - lemma: "الرَّكِيزَةُ"
      source: stage1
      decision: removed
      decision_reason: >
        فحص الاقتراض المفهومي: «ركيزة» تعني «ما يرتكز عليه» (ما يُحمَل عليه شيء)، بينما
        «grass roots / الأصل الجوهري» تعني «ما ينبثق منه شيء» (المنشأ والمصدر). الاتجاه
        معكوس دلالياً: ركيزة = ما يُعتمد عليه (وظيفة دعم)، جذور = ما ينبثق منه (وظيفة نشأة).
        الاستعمال المعجمي لا يدعم التوسّع المطلوب.

    - lemma: "الْقَاعِدَةُ الشَّعْبِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        فشل اختبار السكّ المعجمي: يمكن إبدال «شعبية» بـ«جماهيرية» أو «القاعدة الحزبية» أو
        «القاعدة العمالية» مع الإبقاء على قابلية الوصف، مما يكشف أنها عبارة وصفية حرة لا
        مصطلح ثابت. علاوة على ذلك، لا نص معجمي وجدناه لهذا المركب كوحدة اصطلاحية.


