stage1_review:
  assessment:
    concerns:
      - "قائمة اللمّات الحالية مقتصرة على لفظ واحد فقط (شريك)، بينما يتسع المفهوم لمصطلحات أخرى حسب السياق القانوني أو المؤسسي."
    observations: "المفهوم يشير إلى العضوية في 'شراكة' (partnership)، وهذا يغطي الشريك العام، والمشارك في المشروع، والمساهم في الشركة المساهمة، وحتى المصطلحات الفقهية القديمة كـ'الخليط'."
  blind_candidates:
    - lemma: "شَرِيك"
      generation_method: ishtiqaq
      justification: "اللفظ المعياري المشتق من جذر (شرك) للدلالة على من يقاسم غيره في ملك أو عمل."
    - lemma: "مُشَارِك"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (شارك)، يدل على من يشترك مع غيره في نشاط أو مشروع، ويستخدم كثيراً كمرادف لـ (partner)."
    - lemma: "مُسَاهِم"
      generation_method: ishtiqaq
      justification: "مصطلح متخصص للشريك في شركات المساهمة، وهو عضو في شراكة رأس مالية."
    - lemma: "خَلِيط"
      generation_method: ishtiqaq
      justification: "لفظ تراثي فقهي يطلق على الشريك في المال أو المتاع أو الجوار."

stage2_evidence:
  per_lemma:
    - lemma: "شَرِيك"
      confirm:
        - text: "«صَاحِبُ الحِصَّةِ والنَّصِيبِ فى شَىْءٍ ما»"
          source: "المعجم الكبير"
        - text: "«الشريك: هو المشارك.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الشّريك: [في الانكليزية] Partner»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
    - lemma: "مُشَارِك"
      confirm:
        - text: "«مشارك: joint partner»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«المشارك في الأرباح كعمال بعض المصانع»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يضيف بعد المشاركة في الربح دون ملكية الرقبة أحياناً."
    - lemma: "مُسَاهِم"
      confirm:
        - text: "«كل من يملك سهما في شركة مساهمة أو شركة توصية بالأسهم، وتكون مسؤوليته عن ديون الشركة محدودة»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
    - lemma: "خَلِيط"
      confirm:
        - text: "«الخليط: في الشركة بمعنى الشريك في حقوق الملك»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«(الخليط) ... وَيُطلق على الشَّرِيك والصَّاحب وَالْجَار المصافي»"
          source: "المعجم الوسيط"
        - text: "«الشَّرِيكُ المُشارِكُ فى حُقُوقِ المِلْكِ، كالشِّرْب والطريقِ، ونحوِ ذلك»"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "شَرِيك"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والمعياري المقابل لـ partner."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَرِيك"
    - lemma: "مُشَارِك"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي يستخدم في السياقات الإدارية والعملية للمشاريع المشتركة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُشَارِك", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُسَاهِم"
      source: stage1
      decision: confirmed
      decision_reason: "نوع محدد من الشركاء في العصر الحديث (شركات المساهمة)، وهو عضو في شراكة تجارية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُسَاهِم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خَلِيط"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فقهي وتراثي أصيل يعبر عن مفهوم الشراكة في الملك، مما يثري المجموعة الترادفية دلالياً وتاريخياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خَلِيط", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص عضو في شراكة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، يحسن تعريفه ببيان طبيعة هذه العضوية وما يترتب عليها."
    authored:
      - type: terminological
        text: "شخصٌ يرتبطُ بآخرَ أو أكثرَ في عملٍ تجاريٍّ أو مشروعٍ مشترك، متحملاً معه الأعباءَ ومقتسماً معه الأرباح."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "شَرِيك"
        examples:
          - text: "اتّفق الشّريكان على تمديد عقد الشّركة لعامين إضافيين."
            type: usage
      - lemma: "مُشَارِك"
        examples:
          - text: "يُعتبر كلّ مشاركٍ في المشروع مسؤولاً عن نجاحه وتوزيع عوائده."
            type: usage
      - lemma: "مُسَاهِم"
        examples:
          - text: "اجتمع المساهمون في الشّركة لمناقشة تقرير الأرباح السنويّ وتعيين مجلس إدارة جديد."
            type: usage
      - lemma: "خَلِيط"
        examples:
          - text: "في الفقه الإسلامي، الخليط هو الشريك في العين أو في المنافع كالبئر والطريق."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شخصٌ يرتبطُ بآخرَ أو أكثرَ في عملٍ تجاريٍّ أو مشروعٍ مشترك، متحملاً معه الأعباءَ ومقتسماً معه الأرباح."}

