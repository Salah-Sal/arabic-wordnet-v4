        value: '{"roots":[{"word":"تعدد","root":"عدد","maqayis":"«الْعَيْنُ وَالدَّالُ أَصْلٌ صَحِيحٌ وَاحِدٌ لَا يَخْلُو مِنَ الْعَدِّ الَّذِي هُوَ الْإِحْصَاءُ.»"},{"word":"التكافؤ","root":"كفأ","maqayis":"«الْكَافُ وَالْفَاءُ وَالْهَمْزَةُ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى التَّسَاوِي فِي الشَّيْئَيْنِ.»"}]}'
