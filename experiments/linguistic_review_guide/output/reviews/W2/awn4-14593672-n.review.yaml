      sense_id: "{auto}"
      nuance: "يركز على الجانب الوظيفي والحيوي للقدرة على المواجهة."
      mwe: true
    - lemma: "مُتَعَدِّدُ التَّكَافُؤِ"
      sense_id: "{auto}"
