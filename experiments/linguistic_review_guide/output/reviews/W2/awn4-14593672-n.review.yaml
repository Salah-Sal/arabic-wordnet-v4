stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "تعدد التكافؤ" صحيحة تقنياً، لكنها قد تلتبس مع مصطلح الكيمياء (أكسدة العنصر بأكثر من تكافؤ).
      - هناك حاجة لتوثيق المصطلحات المرادفة الأكثر تخصصاً في العلوم الحيوية مثل "تعدد القوى".
    observations: "المفهوم يشير إلى قدرة المصل أو اللقاح على العمل ضد سلالات أو سموم متعددة. في العربية، يُستخدم 'تعدد التكافؤ' كترجمة مباشرة لـ polyvalence، وهو مصطلح مشترك بين الكيمياء والمناعة."
  blind_candidates:
    - lemma: "تَعَدُّدُ التَّكَافُؤِ"
      generation_method: tarkib
      justification: "ترجمة مباشرة وشائعة للمصطلح الإنجليزي في السياقات العلمية."
    - lemma: "تَعَدُّدُ القُوَى"
      generation_method: majaz
      justification: "مصطلح متخصص ذكره المورد الحديث في سياق الكيمياء الحيوية والطب كمرادف لـ polyvalence."
    - lemma: "مُتَعَدِّدُ التَّكَافُؤِ"
      generation_method: tarkib
      justification: "الصيغة الوصفية المستخدمة غالباً للإشارة إلى المفهوم في سياق اللقاحات والأمصال."
    - lemma: "تَعَدُّدِيَّةُ التَّكَافُؤِ"
      generation_method: ishtiqaq
      justification: "صيغة اسمية مجردة (مصدر صناعي) تعبر عن الحالة أو الخاصية."

stage2_evidence:
  per_lemma:
    - lemma: "تَعَدُّدُ التَّكَافُؤِ"
      confirm:
        - text: "تعدد التكافؤ: (ك) polyvalence"
          source: "المورد الحديث"
        - text: "تعدد التكافؤ: polyvalency"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "تَعَدُّدُ القُوَى"
      confirm:
        - text: "تعدُّد القُوَى (بك): polyvalence"
          source: "المورد الحديث"
    - lemma: "مُتَعَدِّدُ التَّكَافُؤِ"
      confirm:
        - text: "مُتَعَدِّدُ التَّكافُؤ: polyvalent"
          source: "المعجم الطبي الموحد"
        - text: "مُتَعَدِّدُ التَّكافُؤ: multivalent"
          source: "المعجم الطبي الموحد"
    - lemma: "تَعَدُّدِيَّةُ التَّكَافُؤِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تعدد التكافؤ"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والمعتمد في المعاجم الموحدة للكيمياء والعلوم العامة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَدُّدُ التَّكَافُؤِ"
    - lemma: "تَعَدُّدُ القُوَى"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فني دقيق متخصص في سياق الكيمياء الحيوية (المورد الحديث)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "تَعَدُّدُ القُوَى", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُتَعَدِّدُ التَّكَافُؤِ"
      source: stage1
      decision: confirmed
      decision_reason: "على الرغم من كونه صفة، إلا أنه يُستخدم في المصطلحات الطبية للإشارة إلى الحالة (مثل 'لقاح متعدد التكافؤ')."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مُتَعَدِّدُ التَّكَافُؤِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "(علم السموم) حالة القدرة على مواجهة أكثر من سم أو مستضد أو نوع من الكائنات الحية الدقيقة"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً ويغطي الجوانب الأساسية للمفهوم في علم السموم والمناعة."
  examples:
    per_lemma:
      - lemma: "تَعَدُّدُ التَّكَافُؤِ"
        examples:
          - text: "يُعدُّ تَعَدُّدُ التَّكَافُؤِ في المَصْلِ مِيزةً حَيويَّةً لعِلَاجِ لَدَغَاتِ الأَفَاعِي المُتَنَوِّعَةِ."
            type: usage
      - lemma: "تَعَدُّدُ القُوَى"
        examples:
          - text: "يُظْهِرُ اللِّقَاحُ تَعَدُّدَ القُوَى عِنْدَمَا يَمْنَحُ حِصَانَةً ضِدَّ عِدَّةِ أَنْوَاعٍ مِنَ الجَرَاثِيمِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُوفِّرُ تَعَدُّدُ التَّكَافُؤِ في اللِّقَاحَاتِ الحديثةِ حِمايةً وَاسعةَ النِّطاقِ ضِدَّ السُّلالاتِ الفِيروسِيَّةِ المُتَحَوِّرَةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "تَعَدُّدُ التَّكَافُؤِ"
      entry_id: "{auto}"
      roots:
        - word: "تعدد"
          root: "عدد"
          maqayis_quote: "«الْعَيْنُ وَالدَّالُ أَصْلٌ صَحِيحٌ وَاحِدٌ لَا يَخْلُو مِنَ الْعَدِّ الَّذِي هُوَ الْإِحْصَاءُ.»"
        - word: "التكافؤ"
          root: "كفأ"
          maqayis_quote: "«الْكَافُ وَالْفَاءُ وَالْهَمْزَةُ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى التَّسَاوِي فِي الشَّيْئَيْنِ.»"
    - lemma: "تَعَدُّدُ القُوَى"
      entry_id: "{auto}"
      roots:
        - word: "تعدد"
          root: "عدد"
          maqayis_quote: "«الْعَيْنُ وَالدَّالُ أَصْلٌ صَحِيحٌ وَاحِدٌ لَا يَخْلُو مِنَ الْعَدِّ الَّذِي هُوَ الْإِحْصَاءُ.»"
        - word: "القوى"
          root: "قوي"
          maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالْيَاءُ أَصْلَانِ مُتَبَايِنَانِ، يَدُلُّ أَحَدُهُمَا عَلَى شِدَّةٍ وَخِلَافِ ضَعْفٍ.»"
  per_sense:
