# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-07176845-n — proposal
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي «شيء مقترح» يعتمد على اسم المفعول من الجذر نفسه، مما يُوقِعه في دَوَران جزئي"
      - "اللمّة مُقْتَرَح غير مسجّلة كمدخل مستقل في المعاجم الكلاسيكية، لكنها اسم مفعول قياسي من اقترح"
    observations: "المجموعة تمثّل مفهوم الاقتراح بوصفه فكرة أو خطة تُقدَّم للبحث والنظر. المفهوم أصيل في العربية وله تمثيل معجمي واضح في المعاجم الحديثة. الجذر ق-ر-ح في أصله الثالث عند ابن فارس يدلّ على الاستنباط، ومنه اقترح بمعنى استنبط عن غير سماع، وهو ما تطوّر في الاستعمال المعاصر إلى تقديم فكرة للبحث."
  blind_candidates:
    - lemma: "عَرْض"
      generation_method: ishtiqaq
      justification: "من الجذر ع-ر-ض على وزن فَعْل، بمعنى ما يُعرَض من فكرة أو رأي على الآخرين للنظر فيه"
    - lemma: "طَرْح"
      generation_method: ishtiqaq
      justification: "من الجذر ط-ر-ح على وزن فَعْل، بمعنى ما يُطرَح من رأي أو فكرة للمناقشة"
    - lemma: "مَشْرُوع"
      generation_method: ishtiqaq
      justification: "من الجذر ش-ر-ع على وزن مَفْعُول، بمعنى الأمر الذي يُهيَّأ ليُدرَس ويُقرَّر"
    - lemma: "تَصَوُّر"
      generation_method: ishtiqaq
      justification: "من الجذر ص-و-ر على وزن تَفَعُّل، بمعنى الفكرة التي تتشكّل في الذهن كافتراض أو خطة"

stage2_evidence:
  per_lemma:
    - lemma: "اقْتِرَاح"
      confirm:
        - text: "«(الاقتراح) الفكرة تُهَيَّأُ وتشرح وتُقدَّم للبحث والحكم (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«عرض فكرة على سبيل مساعدة أحد المتحاورين وجعله يتبع سلوكا معينا.»"
          source: "مسرد الإعلام والتواصل (أليكسو)"
      expands:
        - text: "«الاقتراح: الاستدعاء والطلب.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المعنى الكلاسيكي أوسع: الاستدعاء والطلب عموماً"
        - text: "«الهمزة في افتعل وانفعل وافعلّ ومصادرها همزة وصل لا تكتب. وكلمة اقتراح مصدر اقترح؛ لذا فهمزتها همزة وصل.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "تأكيد أن الهمزة همزة وصل وليست قطعاً"
        - text: "«تعبير محدد (حقيقي أو خاطئ) بمثابة مُرادف للحافز عند تودوروف»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "في اللسانيات يُستعمل اقتراح بمعنى القضية المنطقية (proposition)"
    - lemma: "مُقْتَرَح"
      evidence_status: "no_material_found"
    - lemma: "عَرْض"
      contradicts:
        - text: "«العَرْضُ: خلاف الطول»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "المعنى الأساسي للعَرْض في المعاجم الكلاسيكية هو خلاف الطول أو المتاع، وليس تقديم فكرة"
      expands:
        - text: "«(1) الاقتراح: تقديم الاقتراحات (2) اقتراح؛ مُقْتَرح؛ عَرْض»"
          source: "المورد الحديث (2008)"
          addition: "يُذكر عَرْض ضمن مرادفات proposal في المعجم الثنائي"
    - lemma: "طَرْح"
      contradicts:
        - text: "«الطرح: إلقاء الشيء وإبعاده. والمطروح: المرمي لقلة الاعتداد به.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الأساسي للطرح هو الرمي والإلقاء والإبعاد، لا تقديم فكرة"
        - text: "«الطّرح: الحذف... وعند المحاسبين يطلق على إسقاط العدد الأقلّ»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المعنى الاصطلاحي الراسخ هو الحذف والإسقاط (subtraction)"
    - lemma: "مَشْرُوع"
      contradicts:
        - text: "«المَشْرُوع: هُوَ الْمَأْذُون من قبل الشَّرْع.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المعنى الأصلي هو ما أذن به الشرع، لا ما يُقترح"
      expands:
        - text: "«(الْمَشْرُوع) ما سوَّغه الشَّرْع والأمر يهيأ ليُدرَس ويقرر (مو)»"
          source: "المعجم الوسيط"
          addition: "في الاستعمال المعاصر توسّع ليشمل الأمر المهيَّأ للدرس، لكنه أعمّ من الاقتراح"
    - lemma: "تَصَوُّر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "اقْتِرَاح"
      decision: confirmed
      decision_reason: "مصدر قياسي من اقترح (افتعل من ق-ر-ح)، موثّق في المعجم الوسيط بمعنى الفكرة المقدَّمة للبحث، ومعتمد في مسارد أليكسو. الاستعمال مطّرد وشائع في الفصحى المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اقتراح يدلّ على فعل التقديم والعملية ذاتها (المصدرية)، أي الفكرة من حيث هي حدث تقديمها، فيُقال: تقدّم باقتراح"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اقْتِرَاح"
    - lemma: "مُقْتَرَح"
      decision: confirmed
      decision_reason: "اسم مفعول قياسي من اقترح على وزن مُفْتَعَل، يدلّ على نتيجة الاقتراح (الشيء المقترَح). رغم عدم ورود مدخل مستقل له في المعاجم التراثية، فهو مشتق صرفي منتظم وشائع الاستعمال في العربية المعاصرة الفصيحة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مُقْتَرَح يدلّ على الشيء المقترَح ذاته بوصفه نتيجة (اسم مفعول)، أي الفكرة أو الخطة كموضوع، فيُقال: هذا مُقْتَرَح جيّد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقْتَرَح"
    - lemma: "عَرْض"
      source: stage1
      decision: removed
      decision_reason: "لفظ شديد الاشتراك اللفظي (خلاف الطول، المتاع، العَرْض العسكري، إلخ). وإن ذُكر ضمن مرادفات proposal في المورد الحديث، فإن معناه الأولي والغالب بعيد عن مفهوم الاقتراح. إضافته تُضعف دقّة المجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "طَرْح"
      source: stage1
      decision: removed
      decision_reason: "المعنى الأساسي في المعاجم هو الرمي والإلقاء والحذف (subtraction). استعماله بمعنى تقديم فكرة حديث ومحدود، ولا يرقى إلى مستوى الترادف مع اقتراح."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "مَشْرُوع"
      source: stage1
      decision: removed
      decision_reason: "المعنى الأصلي ما أذن به الشرع، والمعنى المعاصر (الأمر المهيَّأ للدرس) أعمّ بكثير من الاقتراح ويقابل project لا proposal. إدراجه يُخِلّ بدقّة المجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "تَصَوُّر"
      source: stage1
      decision: removed
      decision_reason: "التصوُّر يدلّ على تمثّل الشيء في الذهن (conception/imagination)، وهو أقرب إلى العمليات الذهنية منه إلى تقديم فكرة منظّمة للبحث. لا يصلح بديلاً لاقتراح."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

