# مراجعة المجموعة الترادفية — awn4-92461960-n
# agglutinative language
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «لغة إلصاقية» بلا تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط — ينبغي إثراؤها بمرادفات"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزية ويحتاج إعادة صياغة بأسلوب معجمي عربي"
      - "مصطلح «مورفيم» في التعريف دخيل غير مشروح — يُفضّل استبداله بـ«وحدة صرفية»"
    observations: "المفهوم ينتمي إلى حقل التصنيف اللغوي (language typology). اللغات الإلصاقية كالتركية والفنلندية تبني كلماتها بسلسلة خطية من الوحدات الصرفية، كلٌّ منها يحمل معنًى واحدًا. يقابل هذا النمط اللغاتِ التصريفيةَ (كالعربية) واللغاتِ العازلةَ (كالصينية). المصطلح العربي يدور بين «إلصاقية» (من إلصاق/لصق) و«مزجية» (من مزج) في المصادر اللسانية المعاصرة."
  blind_candidates:
    - lemma: "لُغَة إِلْصَاقِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من «لغة» + «إلصاقية» (نسبة إلى الإلصاق)، يصف بناء الكلمات بإلصاق الوحدات الصرفية بعضها ببعض في تسلسل خطّيّ"
    - lemma: "لُغَة مَزْجِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من «لغة» + «مزجية» (نسبة إلى المزج)، المصطلح المعتمد في المعجم الموحّد لمصطلحات اللسانيات (ALECSO 2002) للدلالة على اللغات التي تمزج الوحدات الصرفية في بنية الكلمة"
    - lemma: "لُغَة تَلَاصُقِيَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق من التلاصق (تفاعل: الالتصاق المتبادل)، يعكس مفهوم تلاصق الوحدات الصرفية بعضها ببعض في خطّ واحد"
    - lemma: "لُغَة تَرَاصِّيَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق من التراصّ (الانضمام والتراكم)، مصطلح مستعمل في الطبّ والعلوم لمعنى agglutination، قد يصلح نسبةً لوصف اللغة"

stage2_evidence:
  per_lemma:
    - lemma: "لُغَة إِلْصَاقِيَّة"
      confirm:
        - text: "«إلصاق — ظاهرة تعرفها اللغات وهي تمتاز بوجود السوابق أو اللواحق أو الأوساط التي تربط بالأصل فتغير معناه أو تخصصه.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(لَصَقَ) اللَّامُ وَالصَّادُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مُلَازَمَةِ الشَّيْءِ لِلشَّيْءِ. يُقَالُ لَصِقَ بِهِ يَلْصَقُ لُصُوقًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «لصق» يدلّ على الملازمة واللصوق، وهو أساس دلالي مناسب لمفهوم إلصاق الوحدات الصرفية"

    - lemma: "لُغَة مَزْجِيَّة"
      confirm:
        - text: "«لُغات مَزجية — لغات تمتاز ببناء الكلمات بواسطة الزوائد، وتستعمل لواصق مختلفة بعد الجذع للتعبير عن العلاقات النحوية.»"
          source: "مسرد الإعلام والتواصل، ALECSO (ArabTerm)"
        - text: "«لُغَات مَزْجِيَة — ظ. Affixing languages.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«تركيب مَزْجِي — تركيب يجمع في وحدة واحدة بين مكونين أو عدة مكونات مختلفة أصلا.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(مَزَجَ) الْمِيمُ وَالزَّاءُ وَالْجِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خَلْطِ الشَّيْءِ بِغَيْرِهِ. وَمَزَجَ الشَّرَابَ يَمْزُجُهُ مَزْجًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «مزج» يدلّ على الخلط والمزج، وهو أساس المصطلح الرسمي في معاجم ALECSO"

    - lemma: "لُغَة تَلَاصُقِيَّة"
      evidence_status: "no_material_found"

    - lemma: "لُغَة تَرَاصِّيَّة"
      contradicts:
        - text: "«تَرَاصٌّ — تكتل الخلايا أو الأجسام الموجودة في سائل ما، وتجمعها بشكل كتل صغيرة»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "مصطلح «تراصّ» مستقرّ في المجال الطبي/البيولوجي بمعنى agglutination الكيميائي الحيوي، لا اللساني"
      expands:
        - text: "«تراص — agglutinative»"
          source: "مسرد الجغرافيا والتاريخ، ALECSO (ArabTerm)"
          addition: "ورد بمعنى agglutinative في مسرد جغرافي لكن دون تعريف لساني مفصّل"

