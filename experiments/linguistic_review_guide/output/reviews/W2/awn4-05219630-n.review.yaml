# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "صفة قصر الجمجمة أو الرأس (عرض الرأس كبير بالنسبة لطوله)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يخلط بين صيغتَين: الجملة الاسمية "صفة قصر الجمجمة أو الرأس"
        ثم التفسير التوضيحي بين قوسَين "(عرض الرأس كبير بالنسبة لطوله)". هذا البناء
        يُضعف الدقة المصطلحية ويُخلط بين التعريف والشرح. علاوةً على ذلك، يرد "الجمجمة"
        و"الرأس" معاً دون تفريق، في حين أن الظاهرة تشريحياً تخص الجمجمة (skull)
        تحديداً لا الرأس الخارجي. كما أن التعريف لا يُصرِّح بالجنس القريب (أي نوع الصفة)
        ولا بالمؤشر الكمي للتمييز (نسبة المؤشر الرأسي).
    authored:
      - type: terminological
        text: "صِفَةٌ تشريحيةٌ تتميَّزُ بها الجُمجُمَةُ التي يزيدُ بُعدُها العَرضيُّ (المسافةُ بين جانبَيها) على بُعدِها الطُّولِيِّ الأماميِّ الخلفيِّ، فيكونُ مُؤَشِّرُ الرَّأسِ فيها أكثرَ من ثمانينَ"
