# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الوحيدة 'قصر الرأس' خالية من التشكيل تماماً"
      - "المجموعة تضم لمّةً واحدة فقط لمفهوم طبي يستحق ترادفاً أوسع"
      - "التعريف الحالي ممزوج بين الصيغة الاسمية والتفسير التوضيحي في قوسين، مما يُضعف البنية المصطلحية"
      - "اللمّة الموجودة تستعيد كلمتين من التعريف مباشرةً ('قصر' و'الرأس')، وهو ضعف في السكّ المصطلحي وإن ظلّ الاستخدام الطبي مقبولاً"
    observations: >
      المجموعة تُعبِّر عن مفهوم بشري-تشريحي (أنثروبومتري)، هو حالة كبر عَرض الجمجمة على طولها.
      المفهوم غربي المنشأ في أصله العلمي، وقد ابتكرت له المعاجم الطبية العربية الحديثة مصطلحاتٍ
      تعتمد في الغالب على وصف نسبة العَرض إلى الطول. الأصل اليوناني للمصطلح (brachy = قصير +
      kephalē = رأس) أفضى إلى الترجمة الوصفية 'قصر الرأس'. ثمة توجّه آخر في معاجم طبية أقدم
      يعتمد على 'عراضة' بدلاً من 'قصر'، إذ يُبرز العَرضَ لا القِصَر. الرابط الفوقي (جَوْدَة/نَوْعِيَّة)
      صحيح منطقياً كون المفهوم صفة/خاصية.

  blind_candidates:
    - lemma: "التَّفَطُّحُ الرَّأْسِيُّ"
      generation_method: majaz
      justification: >
        جذر "ف ط ح" يدلُّ في المعاجم الكلاسيكية على العَرض في وسط الرأس تحديداً
        (لسان العرب: "الفَطَحُ: عِرَضٌ في وسط الرأس"). المجاز: إسقاط هذا المعنى
        الكلاسيكي على الصفة الطبية المجردة بصيغة المصدر "تَفَطُّح"، ثم تقييده بالنسبة
        "الرأسي" للدقة المصطلحية. اختبار السك: "التفطح" بمفرده معناه صيرورة الشيء عريضاً
        مسطحاً، فإضافة "الرأسي" تُخصِّصه بالجمجمة.
    - lemma: "الأَفْطَحِيَّةُ الرَّأْسِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر "ف ط ح" على وزن أَفْعَلِيَّة. "الأفطح" وصف راسخ في المعاجم لعريض الرأس
        (المعجم الوسيط: "العريض الأَفْدَعُ"). "الأَفْطَحِيَّة" مصدر صناعي يُحوِّل الصفة
        إلى مفهوم مجرد (الحالة/الصفة)، و"الرأسية" تقييد نسبي يخصِّصه بالجمجمة دون غيرها.
    - lemma: "عُرَاضَةُ الرَّأْسِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من "عُراضة" (العَرض الواسع، من جذر ع ر ض) + "الرأس". التعريف يُشير صراحةً
        إلى أن عَرض الرأس كبير نسبةً إلى طوله، فوصف الظاهرة من زاوية العَرض (لا القِصَر) يُعطي
        منظوراً مكمِّلاً. وزن "فُعَالة" يدلُّ على الصفة المجردة (كالعُراضة والبُراعة).
        اختبار التثبيت المعجمي: "عُراضة الرأس" وحدة إضافية محكمة البنية.
    - lemma: "بَرَاكِيسِيفَالِيَا"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح اليوناني-الطبي الدولي brachycephalia. يقبل لام التعريف
        (البراكيسيفاليا) والنسبة (براكيسيفالي) والجمع السالم. الملاذ الأخير عند انعدام
        تعريب موحَّد في المعاجم المتخصصة.


