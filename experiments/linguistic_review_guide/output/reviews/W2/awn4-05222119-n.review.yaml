          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يثبت صحة الضبط: خُيَلاء (بضم الخاء) وتصحّح الصيغة المنتشرة خَيْلاء."

    - lemma: "صَلَف"
      confirm:
        - text: >
            «الصَّلَفُ: مجاوزة قدر الظَّرْف، والادِّعاء فوق ذلك تكبرًا،
