          params:
            entry_id: "{auto}"
            new_lemma: "عَجْرَفَة"

    - lemma: "خُيَلاء"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُعرَّف صراحةً في المعجم الوسيط والمعجم الكبير وكتب التعريفات بـ«التكبر والعجب»،
        وشاهده حديث نبوي متواتر. هو المقابل الأكثر دقةً وأعلى شيوعاً في الموروث
        اللغوي لمفهوم snootiness (التكبر المصحوب بالإعجاب بالنفس). إضافته تُثري المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز الجانب النفسي الداخلي المقترن بالإعجاب بالنفس: وهم الفضيلة والتوهم بامتلاك
        محاسن ليست حقيقية؛ أقرب إلى الغرور الخفي المتخيَّل، مقارنةً بالتعبير الخارجي
        في «عجرفة» أو الإرادة الواعية في «تَكَبُّر».
      borrowing_check:
        loan_type: native
        calque_risk: false
      morphological_fit: >
        فُعَلاء — صيغة المصدر/الاسم للدلالة على صفات النفس والطبائع (قياسية
        كحُمَقاء، شُجَعاء...). الوزن مناسب لصفات الشخصية المذمومة.
      quality_gate:
        consistency: true
        ease_of_use: true
        appropriateness: true
        heritage_preferred: true
        arabic_preferred: true
        derivability: true
      actions:
