            شِدَّةٍ وَكَزَازَةٍ. مِنْ ذَلِكَ الصَّلَفُ، وَهُوَ قِلَّةُ نَزَلِ الطَّعَامِ»
          source: "مقاييس اللغة لابن فارس (ت٣٩٥هـ)"
          conflict: >
