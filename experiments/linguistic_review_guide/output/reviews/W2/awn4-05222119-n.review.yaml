          source: "مجمع بحار الأنوار للفَتِّنيّ (ت٩٨٦هـ)"
        - text: "«بَاب الصلف: الزهو وَالْكبر والتيه والتطاول والبذخ والشمخ»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (ت٦٧٢هـ)"
