    - lemma: "صَلَف"
      source: stage1
      decision: removed
      decision_reason: >
        الأصل الجذري عند ابن فارس هو «شدة وكزازة» (وقلة الخير كالطعام عديم البركة
        والسحاب الذي يرعد ولا يمطر)، ومعنى التكبر فيه مدلول فرعي طارئ. المعجم الوسيط
        يُدرجه في باب الموصوف (ذو الصلف) لا المصدر الصريح للصفة. الأدلة المتضاربة تجعل
        توظيفه في سياق snootiness غير دقيق، والمعنى أشمل وأغمض من المطلوب.

    - lemma: "شَمَاخَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد المصدر «شَمَاخَة» كمدخل مستقل في قاعدة البيانات المعجمية. ورد في مقاييس
        اللغة الفعلُ «شَمَخَ» (تعظّم وارتفع)، إلا أن اللمّة بصيغة المصدر الاسمي غير
        مُثبَتة في الاستخدام المعجمي المُدوَّن؛ فلا ينبغي إضافتها بلا سند مباشر.

    - lemma: "زَهْوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        التركيب الاشتقاقي صحيح نظرياً، والجذر «زهو» ثابت بمعنى الكبر والفخر في مقاييس
        اللغة، لكن الصيغة الصناعية «زَهْوِيَّة» غير موثقة في أي مدوَّن معجمي. وفق اختبار
        التثبيت المعجمي: الصيغة قياسية لكنها غير مسكوكة، فلا تُقبل.


