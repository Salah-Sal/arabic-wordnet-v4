          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (ت٦٧٢هـ)"
          addition: >
            يضع العجرفة ضمن الحقل الدلالي للتكبر والاستعلاء، مع التمييز بين درجاته
