# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تكبر"
      decision: confirmed
      decision_reason: >
        المصدر «تَكَبُّر» مُثبَت في أمهات المعاجم بمعنى «رؤية النفس أكبر من الآخرين»،
        وهو يطابق المفهوم المطلوب. غير أن اللمّة مدوَّنة بلا تشكيل مما يوهم أنها الفعل
        «تَكَبَّرَ»؛ والصواب المصدر «تَكَبُّر» (بضم الباء). يُصحَّح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز الجانب العقلي والإرادي: رؤية النفس فوق الآخرين والامتناع عن الإذعان للحق،
        بمعنى التعظّم الداخلي المتعمّد؛ يخلو من دلالة الجفاء الخارجي التي تحملها «عجرفة».
      borrowing_check:
        loan_type: native
        calque_risk: false
      morphological_fit: >
        تَفَعُّل — مصدر الفعل الخماسي تَفَعَّلَ، صيغة قياسية للمصادر الدالة على التكلّف
        والتظاهر بالصفة. الوزن مناسب لمفهوم الصفة المكتسبة المذمومة.
      quality_gate:
        consistency: true
        ease_of_use: true
        appropriateness: true
        heritage_preferred: true
        arabic_preferred: true
        derivability: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَبُّر"

    - lemma: "عجرفة"
      decision: confirmed
      decision_reason: >
        مُثبَت في المعاجم الأساسية بمعنى الجفاء والخشونة في التعامل مع التكبر والاستهانة
        بالآخرين. المعاجم الإنجليزية-العربية تقابله صراحةً بـhaughtiness وhauteur.
        يختلف في ظلاله عن «تَكَبُّر» بتركيزه على المظهر الخارجي الفظّ. اللمّة تحتاج تشكيلاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز الجانب السلوكي الخارجي: الجفاء في الكلام والتطاول في المعاملة، التكبر
        المصحوب بقلة المبالاة والخشونة في التعامل؛ أشد حدةً وأوضح مظهراً من «تَكَبُّر».
      borrowing_check:
        loan_type: native
        calque_risk: false
      morphological_fit: >
        فَعْلَلَة — مصدر قياسي للأفعال الرباعية (عَجْرَفَ/تَعَجْرَفَ)، صيغة الأسماء
        الدالة على الطبائع والسجايا المركّبة. الجذر رباعي عجرف، لا مقابل له في مقاييس
        اللغة (ابن فارس لا يشمل الجذور الرباعية في الغالب).
      quality_gate:
        consistency: true
        ease_of_use: true
        appropriateness: true
        heritage_preferred: true
        arabic_preferred: true
        derivability: true
      actions:
