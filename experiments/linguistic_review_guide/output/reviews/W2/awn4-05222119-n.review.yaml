    - lemma: "خُيَلاء"
      confirm:
        - text: "«الخُيَلاء: التكبر والعجب»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الخُيَلَاءُ: الكِبْرُ والإِعْجابُ بالنَّفْسِ»"
          source: "المعجم الكبير (OCR)"
        - text: "«الخيلاء: التكبر عن تخيل فضيلة بتراء أي للإنسان في نفسه»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت١٠٤٢هـ)"
        - text: "«(الْخُيَلَاء) التكبر وَالْعجب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«من جَرَّ ثَوْبه خُيَلاء لم يَنْظُرِ اللهُ إليه» [حديث نبوي]"
          source: "المعجم الكبير (OCR) — شاهد حديثي"
        - text: "«خُيلَاء: من (خ ي ل) الكبرياء والعجب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: >
            «تَاهَ خُيَلاءَ على زملائه [فصيحة] — وردت الكلمة في المعاجم بضمِّ
