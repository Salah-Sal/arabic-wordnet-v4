# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «صفة التكبر والتعالي» دائري جزئياً: يستخدم «تكبر» وهو أحد لمّات المجموعة."
      - "اللمّة «تكبر» مُدوَّنة في المعجم الوسيط بوصفها فعلاً (تَكَبَّرَ)، وصواب الاستخدام الاسمي في هذه المجموعة هو المصدر «تَكَبُّر»."
      - "اللمّتان خاليتان من التشكيل كليّاً، وهذا يُخلّ بالضبط الصرفي."
      - "المجموعة فقيرة عدداً (لمّتان)؛ المعنى الإنجليزي «snootiness» يملك في العربية مقابلات أعرق وأشيع."
    observations: >
      المجموعة تمثّل مفهوم «snootiness» — الصفة المجردة الدالة على الاستعلاء على الناس
      واحتقارهم مع الإعجاب بالنفس. المفهوم له جذور عربية أصيلة متعددة. «تَكَبُّر» المصدر
      يصحّ اسماً، و«عَجْرَفَة» أقرب إلى التكبر المصحوب بالجفاء. الأبرز غياباً هو «خُيَلاء»
      الذي تصرّح المعاجم بأنه «التكبر والعجب»، وهو مقابل طبيعي جداً لـ«snootiness».

  blind_candidates:
    - lemma: "خُيَلاء"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فُعَلاء من الجذر خ-ي-ل، يدل على الغرور والتعظّم. مستعمل في
        النصوص الكلاسيكية والحديث النبوي. يجمع معنى الإعجاب بالنفس والاستعلاء على
        الآخرين بما يناسب مفهوم «snootiness».
    - lemma: "صَلَف"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر ص-ل-ف، يعني مجاوزة قدر الظرف والادعاء فوق ذلك تكبراً.
        وارد في نصوص الحديث النبوي وأمثلة المعاجم بمعنى قريب من الاستعلاء والتشامخ.
    - lemma: "شَمَاخَة"
      generation_method: majaz
      justification: >
        من الفعل «شَمَخَ» (رفع رأسه تعالياً، فُلان شامخ الأنف)، والمصدر شَمَاخَة
        إحياء لفظ كلاسيكي على وزن فَعَالَة يدلّ على رفعة الأنف وإباء التواضع.
    - lemma: "زَهْوِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي (على -يَّة) من «زَهْو» (وزن فَعْل من ز-ه-و)، يعني التكبر والفخر.
        الجذر واردٌ في مقاييس اللغة بمعنى الكبر والفخر. الصيغة الصناعية تحوّل الصفة
        إلى مفهوم مجرد موازٍ لـ«snootiness» البنائية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ── استعلامات قاعدة البيانات المُنجَزة ──
  # ١. مطابقة دفعية: تكبر + عجرفة + خيلاء + صلف + شماخة + زهوية (+ صيغ ال-)
  # ٢. إثراء بالأمثلة: entry_ids للمداخل الرئيسية
  # ٣. جسر إنجليزي: snootiness / snooty / haughtiness / hauteur / arrogance / conceit / superciliousness
  # ٤. بحث FTS بالكلمات المفتاحية: تكبر + الاستعلاء + الترفع + صلف + خيلاء
  # ٥. مقاييس اللغة: جذور كبر / خيل / صلف / زهو / شمخ / عجرف

  per_lemma:

    - lemma: "تكبر"
      confirm:
        - text: "«التكبر: أن يرى الإنسان نفسه أكبر من غيره وأعظم»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت١٠٤٢هـ)"
        - text: "«التكبُّر: هو إتباع الكبر، والكبرُ: أن يرى نفسه فوقَ غيره في صفة الكمال»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«التكبُّر: إِظْهَارُ ذَلِك» [أي الكِبر]"
          source: "معجم مقاليد العلوم للسيوطي (ت٩١١هـ)"
        - text: "«(تكبر) تعظم وَامْتنع عَن قبُول الْحق معاندة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«تَكَبَّرَ: تعظَّم وامتنع عن قبول الحقِّ معانِدةً»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            المدخل مُصنَّف في المعجم الوسيط بوصفه فعلاً (pos=verb): «تَكَبَّرَ»؛
            والمجموعة تحتاج اسماً (مصدراً). الصواب اللغوي للاسم: «تَكَبُّر».

    - lemma: "عجرفة"
      confirm:
        - text: "«العَجْرَفَةُ: جَفْوَةٌ فى الكلام، وخُرْقٌ فى العَمَل»"
          source: "المعجم الوسيط (OCR)"
        - text: "«العَجْرَفَةُ: جَفْوَةٌ في الكَلامِ، وخُرْقٌ في العَمَلِ، والإِقْدامُ في هَوَجٍ... وفيه تَعَجْرُفٌ وعَجْرَفِيَّةٌ وعَجْرَفَةٌ: قِلَّةُ مُبالاةٍ لِسُرْعَتِهِ»"
          source: "القاموس المحيط للفيروزآبادي (ت٨١٧هـ)"
        - text: "«(العجرفة) جفوة فِي الْكَلَام وخرق فِي الْعَمَل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«غَطْرَسة؛ عَجْرَفة.» [مقابل haughtiness]"
          source: "المورد الحديث (2008) — قسم ترجمات ARABTERM"
        - text: "«غَطْرسة؛ عَجْرَفة.» [مقابل hauteur]"
          source: "المورد الحديث (2008) — قسم ترجمات ARABTERM"
      expands:
        - text: >
            «بَاب الصلف أَيْضا: النخوة والصلف وَالْعجب وَالْبَغي وَالْخُيَلَاء
