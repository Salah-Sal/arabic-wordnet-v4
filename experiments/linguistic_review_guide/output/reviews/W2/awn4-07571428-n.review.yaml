      entry_id: "{auto}"
      root: "طعم"
      maqayis_quote: "«الطاء والعين والميم أصل مطرد منقاس في تذوق الشيء. يقال: طعمت الشيء طعما. والطعام هو المأكول.»"
    - lemma: "غِذَاءٌ صُلْبٌ"
      entry_id: "{auto}"
      roots:
        - word: "غذاء"
          root: "غذي"
          maqayis_quote: "«الغين والذال والحرف المعتل أصل صحيح يدل على شيء من المأكل، وعلى جنس من الحركة. فأما المأكل فالغذاء، وهو الطعام والشراب.»"
        - word: "صلب"
          root: "صلب"
          maqayis_quote: "«الصاد واللام والباء أصلان: أحدهما يدل على الشدة والقوة، والآخر جنس من الودك. فالأول الصلب، وهو الشيء الشديد.»"
