stage1_review:
  assessment:
    concerns:
      - "اللمة (طعام) واسعة جداً دلالياً في العربية، إذ قد تشمل الأشربة في بعض السياقات اللغوية القديمة."
      - "المصطلح (غذاء صلب) مركب وصفي تقني حديث، وهو ترجمة دقيقة لـ solid food."
    observations: "المجموعة تركز على الحالة الفيزيائية للغذاء (صلب مقابل سائل). المصطلحات الموجودة تغطي المعنى العام والتقني، ولكن يمكن إثراؤها بمصطلحات أكثر دقة أو شيوعاً في سياقات معينة مثل الفطام (solid food for infants)."
  blind_candidates:
    - lemma: "غِذَاءٌ جَامِدٌ"
      generation_method: tarkib
      justification: "استخدام الصفة (جامد) المتسقة مع المجموعة العليا (hypernym) لوصف الغذاء."
    - lemma: "طَعَامٌ صُلْبٌ"
      generation_method: tarkib
      justification: "المرادف الأكثر شيوعاً في السياقات التربوية والطبية لوصف الطعام غير السائل."
    - lemma: "مَأْكُولٌ"
      generation_method: ishtiqaq
      justification: "اسم مفعول يدل على ما يؤكل، ويُستخدم غالباً في المقابلة مع (المشروب)."
    - lemma: "قُوتٌ"
      generation_method: ishtiqaq
      justification: "لفظ تراثي يدل على ما يسد الرمق ويقيم البدن من الطعام الصلب غالباً."

stage2_evidence:
  per_lemma:
    - lemma: "طَعَام"
      confirm:
        - text: "الطَّعَام كل مَا يُؤْكَل وَبِه قوام الْبدن"
          source: "المعجم الوسيط"
        - text: "وفي العرف الطعام اسم لما يؤكل والشراب اسم لما يشرب"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "غِذَاء صُلْب"
      confirm:
        - text: "غذاء (food) + صلب (solid)"
          source: "تحليل تركيبي"
    - lemma: "طَعَام صُلْب"
      confirm:
        - text: "طعام (food) + صلب (solid)"
          source: "تحليل تركيبي"
    - lemma: "قُوت"
      confirm:
        - text: "الْقُوت مَا يقوم بِهِ بدن الْإِنْسَان من الطَّعَام"
          source: "المعجم الوسيط"
        - text: "القُوتُ: مَا يُمْسِكُ الرَّمَقَ من الرِّزْق"
          source: "تاج العروس"
    - lemma: "مَأْكُول"
      confirm:
        - text: "لا يأكل طعاما ينصرف إلى كل مأكول مطعوم"
          source: "كشاف اصطلاحات الفنون"

stage3_analysis:
  per_lemma:
    - lemma: "طَعَام"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والأكثر شيوعاً للدلالة على الغذاء، والتمييز العرفي يخرجه عن الأشربة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَعَامٌ"
    - lemma: "غِذَاء صُلْب"
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق يطابق المفهوم العلمي للحالة الفيزيائية للغذاء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غِذَاءٌ صُلْبٌ"
    - lemma: "طَعَام صُلْب"
      source: stage1
      decision: confirmed
      decision_reason: "مركب وصفي فصيح وشائع الاستخدام في السياقات الطبية والتربوية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "طَعَامٌ صُلْبٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "قُوت"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ أصيل يعبر عن المادة الغذائية التي تقيم البدن، وهو أخص من الطعام في الدلالة على الجوهر المقتات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "قُوتٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "أيّ مادّة صلبة تُستخدَم مصدرًا للتغذية، في مقابل السوائل"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق لكن يمكن صياغته بأسلوب معجمي أكثر رصانة."
    authored:
      - type: terminological
        text: "ما يُؤكل من المواد الجامدة لتغذية البدن وإقامة أوده، تمييزاً له عن الأشربة والسوائل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "طَعَام"
        examples:
          - text: "بَدَأَ الطِّفْلُ يَتَنَاوَلُ الطَّعَامَ بَعْدَ شُهُورٍ مِنَ الرَّضَاعَةِ."
            type: usage
      - lemma: "غِذَاء صُلْب"
        examples:
          - text: "يَنْصَحُ الأَطِبَّاءُ بِالتَّدَرُّجِ فِي إِدْخَالِ الغِذَاءِ الصُّلْبِ لِلرُّضَّعِ."
            type: usage
      - lemma: "طَعَام صُلْب"
        examples:
          - text: "يَجِبُ أَنْ يَكُونَ الطَّعَامُ الصُّلْبُ سَهْلَ المَضْغِ وَالهَضْمِ."
            type: usage
      - lemma: "قُوت"
        examples:
          - text: "كَانَ قُوتُهُمُ التَّمْرَ وَالشَّعِيرَ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "ما يُؤكل من المواد الجامدة لتغذية البدن وإقامة أوده، تمييزاً له عن الأشربة والسوائل."}

stage5_enrichment:
  per_entry:
