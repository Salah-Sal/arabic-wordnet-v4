      maqayis_quote: "«السِّينُ وَاللَّامُ وَالطَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْقُوَّةُ وَالْقَهْرُ. مِنْ ذَلِكَ السَّلَاطَةِ، مِنَ التَّسَلُّطِ وَهُوَ الْقَهْرُ.»"
    - lemma: "نِظَام سِيَاسِيّ"
