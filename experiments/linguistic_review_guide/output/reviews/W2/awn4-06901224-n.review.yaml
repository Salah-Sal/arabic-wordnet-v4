stage2_evidence:
  per_lemma:

    - lemma: "تشكيلة"
      confirm:
        - text: >
            «كلمة تَشْكيلة اسم مرة مأخوذ من الفعل «شَكَّلَ» بمعنى صوَّر أشكالاً،
            وقد جاء في الأساسي أن التشكيلة هي عدد متنوع من شيء ما.» [الحكم: صحيحة]
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "مجموعة العناصر المادية والبرمجية المكونة لحاسوب — configuration"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ARABTERM"
      expands:
        - text: >
            المثال الواردان: «تشكيلة من الأقمشة» — يدل على مجموعة متنوعة من شيء ما.
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: >
            تُقيَّد الدلالة بالتنوع والتجميع لا بالإعجاب أو الإبهار صراحةً؛
            كما أن الاستخدام التقني (configuration) مخالف لمفهوم المجموعة الدلالية.

    - lemma: "مجموعة معروضة"
      evidence_status: "no_material_found"

    - lemma: "إِبْهَار"
      contradicts:
        - text: >
            «(ابهارَّ) النَّهَارُ أو اللَّيلُ انتصفَ»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          conflict: >
            الإدخال الأقدم لـ«ابهارَّ» يدل على انتصاف الوقت لا على الإذهال؛ مما
            قد يُوقع التباساً مع الاستعمال الحديث.
        - text: >
            «(ابْهَارَّ) النهارُ: انتصفَ — اللَّيْلُ: انتصف — استنارت نُجومه —
            الليلُ على القَوْم: طال»
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: >
            المعجم الأكاديمي يُثبت الفعل «ابهارَّ» بمعنى الانتصاف لا الإذهال،
            مما يكشف أن «إبهار» المصدري قياسي حديث وليس مسكوكاً كلاسيكياً.
      expands:
        - text: >
            «الصواب والرتبة: إسدال عناصر الإبهار على الفكرة [صحيحة]. التعليق: يجوز
            استكمال كلمات المادة اللغوية قياساً بتكوين المصدر «إبهار» واسم الفاعل
            «مُبْهِر»، اعتمادًا على إجازة مجمع اللغة المصري.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: >
            المجمع اللغوي المصري أجاز «إبهار» كمصدر بمعنى الإذهال؛ غير أنه مصدر
            فعلي (اسم حدث) لا اسم عرض أو مشهد. الدلالة: «الإذهال/الإسرار» لا «عرض مُبهر».

    - lemma: "أُبَّهَة"
      confirm:
        - text: "«الأُبَّهَةُ: العظمة والرواء»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
        - text: "«الأُبَّهَة: العظمة والكبر والنخوة البَهْجة والرُّواء»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: >
            «الهمزة والباء والهاء يدلُّ على النباهة والسمو... والأُبَّهَةُ: الجلال.»
          source: "مقاييس اللغة — ابن فارس"
        - text: >
            «أُبَّهَةُ المُلْكِ [فصيحة]. كم مِن ذي أُبَّهَةٍ قد جَعَلْتُه حقيرًا.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: >
            «pageant: (1) أُبَّهة فارغة — (2) مِهْرَجان — (3) مَوْكِب — (4) حفلة»
          source: "المورد الحديث (2008)"
          conflict: >
            ترجمة «pageant» بـ«أُبَّهة فارغة» تكشف أن الأبهة مرتبطة بالبهرجة والزخرف
            الأجوف أحياناً؛ مما يُضعف دلالتها على «عرض مثير للإعجاب» إذ قد تُوحي
            بالمبالغة الفارغة لا الإبهار الحقيقي.

    - lemma: "رَوْعَة"
      confirm:
        - text: "«الرَّوْعَةُ: المَسْحَةُ من الجمال»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
        - text: "«رَوْعَة: الفزع المسحة من الجمال في كل شيء»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: >
            «الراء والواو والعين أصل واحد يدل على فزع أو مستقرّ فزع... والأرْوَعُ
            من الرجال: ذو الجسم والجهارة كأنه يروع مَن يراه.»
          source: "مقاييس اللغة — ابن فارس"

    - lemma: "مَشْهَد"
      confirm:
        - text: "«مشهد: أداء أو عرض بارز» — spectacle"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
        - text: "«المَشْهَدُ: ما يشاهَد — المجتمع من الناس»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
        - text: >
            «المشهد: (في الفن): مَنْظَرٌ واحِدٌ مِنْ مَسرحيّة أو أغنية مُصَوَّرة
            أو فيلم سينمائى. المُجْتَمَعُ من النَّاسِ. ما يُشاهَدُ.»
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: >
            «الشين والهاء والدال أصل يدل على حضور وعلم وإعلام... والمشهد: محضر الناس.»
          source: "مقاييس اللغة — ابن فارس"
        - text: >
            «spectacle: (1) مَشْهَد؛ وبخاصة: مَشْهَد غير اعتياديّ أو لافتٌ للنّظر
            أو مُسَلٍّ. (2) عرض مَسرحيّ على نطاق ضخم.»
          source: "المورد الحديث (2008)"


