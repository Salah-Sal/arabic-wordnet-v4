stage3_analysis:
  per_lemma:

    - lemma: "تشكيلة"
      decision: confirmed
      decision_reason: >
        اللمّة مُثبَتة في معجم الصواب بوصفها اسم مرة صحيحة من «شكَّلَ»، بمعنى
        «عدد متنوع من شيء ما»؛ وهي تُلائم جانب التنوع والترتيب في «array» الإنجليزية.
        غير أنها تستلزم إضافة التشكيل الكامل في السجل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُبرز البُعد التركيبي والتنوّعي في العرض (varied arrangement/assortment)،
        دون أن تحمل صراحةً دلالة الإبهار والجلال التي يحملها «مشهد».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشْكِيلَة"

    - lemma: "مجموعة معروضة"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة (وصفي: مجموعة + معروضة) تفشل اختبار التثبيت المعجمي:
        يمكن إبدال «معروضة» بـ«مرتّبة» أو «منظّمة» مع بقاء التركيب صالحاً وصفاً،
        مما يعني أنها ليست وحدة معجمية مسكوكة. لا وجود لها في المعجمية العربية
        المعتمدة. الإزالة تُعيد للمجموعة دقّتها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِبْهَار"
      source: stage1
      decision: removed
      decision_reason: >
        «إبهار» مصدر إفعالي (اسم حدث) يدلّ على الإذهال/الإسرار بالأبصار لا على
        «عرض مثير للإعجاب» كموضوع قائم بذاته. الفئة الدلالية خاطئة: إنه اسم عملية
        (process noun) لا اسم عرض (display noun). فضلاً عن ذلك، المعاجم الكلاسيكية
        تُثبت «ابهارَّ» بمعنى «انتصف الوقت»، مما يُشير إلى اشتراك لفظي محتمل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "أُبَّهَة"
      source: stage1
      decision: removed
      decision_reason: >
        «أُبَّهَة» تدلّ على صفة الجلال والعظمة والرواء في الذات أو المقام (quality noun)
        لا على حدث/عرض مُجرى أمام الناس. يُضاف إلى ذلك أن المورد الحديث ترجم
        «pageant» بـ«أُبَّهة فارغة»، مما يُلمّح إلى إيحاء سلبي (بهرجة وزخرف أجوف).
        لا تستوفي الدلالة الجوهرية للمجموعة: «عرض يُثير الإعجاب».
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "رَوْعَة"
      source: stage1
      decision: removed
      decision_reason: >
        «رَوْعَة» تُعبّر عن «المسحة من الجمال» أو القدرة على إفزاع الأبصار بالبهاء
        (quality noun)، لا عن عرض علني منظَّم. هي صفة جمالية لا حدث مُعروض.
        الفئة الدلالية: جودة وليست موضوعاً (event/object). غير ملائمة للمجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "مَشْهَد"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَت مباشرةً في ARABTERM بمعنى «spectacle: أداء أو عرض بارز»، وهو مطابق
        لمفهوم «an impressive display». المعجم الكبير يُضيف المعنى الفنّي الحديث
        (منظر من مسرحية / عرض على نطاق ضخم). الجذر شهد يدلّ على الحضور والإعلام،
        والمشهد = «محضر الناس»، مما يحمل دلالة الحدث العلني المُشهود. المورد الحديث
        يُترجم «spectacle» بـ«مشهد غير اعتيادي أو لافت للنظر».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز البُعد الإبهاري والمشهدي (spectacle: ما يُشهد ويأخذ بالأبصار)،
        في حين تُبرز «تَشْكِيلَة» البُعد التنوّعي والتركيبي (array: مجموعة منوّعة).
      actions:
        - command: create_entry
          params:
            lemma: "مَشْهَد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


