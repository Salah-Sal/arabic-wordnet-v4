# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-06901224-n
# array — an impressive display
# ══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «مجموعة معروضة» عبارة وصفية حرة لا تستوفي شروط التثبيت المعجمي، ويمكن إبدال «معروضة» بـ«مرتّبة» أو «متنوعة» مع بقائها صالحة كوصف."
      - "لمّة «تشكيلة» خالية من التشكيل في بيانات المجموعة، ولا تحمل صراحةً دلالة «الإعجاب» في حدّ ذاتها."
      - "التعريف العربي الحالي «عرض مثير للإعجاب» قصير وهو في حقيقته ترجمة حرفية من الإنجليزية، ويفتقر إلى جنس قريب ودلالة تفريقية."
    observations: >
      المفهوم يدور على عرض عام يتسم بالتنوع والحجم والإبهار، وهو نوع مخصوص من
      العرض العلني (الأبوين المباشر: إشهار / عرض). يُفرَّق بين جانبَيْن:
      أوّلهما جانب التنوع والترتيب (ما تقرب منه «تشكيلة»)، وثانيهما جانب الإبهار
      والمشاهدة (ما يعبّر عنه «مشهد» بمعنى spectacle). المجموعة تحتاج إلى
      تنقية لمّاتها وإثرائها بمصطلح يحمل دلالة الإبهار صراحةً.

  blind_candidates:
    - lemma: "إِبْهَار"
      generation_method: ishtiqaq
      justification: >
        من الجذر «بهر» (الغلبة والعلو في مقاييس اللغة)، وزن إفعال: مصدر يدلّ على
        الإذهال والإسرار بالأبصار. يلتقط البُعد التأثيري في التعريف (مثير للإعجاب).
    - lemma: "أُبَّهَة"
      generation_method: majaz
      justification: >
        إحياء اللفظ الكلاسيكي الدالّ على الجلال والرواء والهيبة؛ إزاحة دلالية
        من «الهيبة الذاتية» نحو «العرض الفخم المُبهر» بمشابهة التأثير الجمالي.
    - lemma: "رَوْعَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «روع» (الفزع أو مستقرّه)، المعنى التوسّعي: المَسحة من الجمال التي
        تروع الناظر؛ يصفٌ العرض الذي يدهش المشاهد ويأخذ بألبابه.
    - lemma: "مَشْهَد"
      generation_method: majaz
      justification: >
        من الجذر «شهد» (الحضور والإعلام): توسيع دلالي من «ما يُشهد عليه» نحو
        «ما يُشهَد ويُرى بفخامة» — يُلائم الدلالة الإنجليزية spectacle المطابقة
        لـ«عرض مبهر يُشهده الناس».


