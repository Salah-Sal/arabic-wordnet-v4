stage1_review:
  assessment:
    concerns:
      - "اللمّة «مُتَلَقِّي التَّوْجِيه» تبدو عبارة وصفية شارحة (phrasal description) وليست وحدة معجمية مسكوكة."
      - "نقص في المصطلحات العربية الفصيحة التي تعبر عن الطرف المتلقي في علاقة الإرشاد (Mentee)."
    observations: "المفهوم يتعلق بالطرف المتلقي للإرشاد أو التوجيه، وهو مفهوم مركزي في السياقات التعليمية والمهنية والروحية. المصطلح الحالي «مُتَدَرِّب» جيد للمجال المهني، لكن المجموعة تحتاج لمصطلحات أكثر عمومية أو متخصصة في مجالات أخرى."
  blind_candidates:
    - lemma: "مُرْشَد"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الفعل (أرشد)، وهو المقابل المباشر للمرشد (Guide/Mentor)."
    - lemma: "مُسْتَرْشِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (استرشد)، ويعني طالب الرشد أو متلقيه، وهو شائع الاستعمال في الأدب التربوي."
    - lemma: "مُتَدَرِّب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (تدرب)، ويشير لمن يتلقى التوجيه في سياق عملي أو مهاراتي."
    - lemma: "مُرِيد"
      generation_method: majaz
      justification: "مصطلح صوفي وتراثي يشير للتلميذ الذي يتلقى الإرشاد الروحي من شيخه."

stage2_evidence:
  per_lemma:
    - lemma: "مُتَدَرِّب"
      confirm:
        - text: "الشخص الذي يتلقى تدريبا في تخصص أو تكوين أو في عمل معين."
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "trainee"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
    - lemma: "مُرْشَد"
      confirm:
        - text: "من هداه غيره إلى الطريق السوي."
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "advisee"
          source: "المورد الحديث (2008)"
    - lemma: "مُسْتَرْشِد"
      confirm:
        - text: "المُسْتَرْشِد بالله: لقب الخليفة العباسى... وكان عالي الهِمَّة..."
          source: "المعجم الكبير"
        - text: "يُستخدم في السياق اللغوي العام بمعنى طالب الإرشاد."
          source: "الاستعمال اللغوي"
    - lemma: "مَنْصُوح"
      confirm:
        - text: "advisee"
          source: "المورد الحديث (2008)"
    - lemma: "مُرِيد"
      confirm:
        - text: "[في الانكليزية] Adherent ،follower ،disciple novice... ويأتي عند أهل التّصوف بمعنيين: أحدهما بمعنى المحبّ أي السّالك المجذوب، والثاني: بمعنى المقتدي."
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
    - lemma: "مُتَلَقِّي التَّوْجِيه"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُتَدَرِّب"
      decision: confirmed
      decision_reason: "مصطلح مهني وقانوني راسخ لمن يتلقى التدريب والإرشاد العملي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَدَرِّب"
    - lemma: "مُتَلَقِّي التَّوْجِيه"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً معجمياً مسكوکاً؛ يغني عنها «مُرْشَد» أو «مُسْتَرْشِد»."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "مُرْشَد"
      source: stage1
      decision: confirmed
      decision_reason: "هو المقابل الصرفي الدقيق لـ (مرشد)، وموثق في المعاجم الحديثة كترجمة لـ Advisee/Mentee."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُرْشَد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُسْتَرْشِد"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر عن الشخص الذي يطلب الإرشاد ويتلقاه، وهو مناسب للسياق التربوي والاجتماعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُسْتَرْشِد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَنْصُوح"
      source: stage1
      decision: confirmed
      decision_reason: "اسم مفعول يعبر عن متلقي النصح والإرشاد، وموثق في المعاجم المزدوجة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَنْصُوح", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُرِيد"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي أصيل يصف التلميذ في علاقته الإرشادية مع شيخه، وهو ضروري لإغناء المجموعة دلالياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُرِيد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يتلقى التوجيه والإرشاد من مرشد"
    assessment:
      decision: retain
      reason: "التعريف دقيق وجامع ومانع، ويتبع صياغة المعاجم بتحديد الجنس (شخص) والفصل (يتلقى التوجيه...)."
  examples:
    per_lemma:
      - lemma: "مُتَدَرِّب"
        examples:
          - text: "يُشْرِفُ الْمُدَرِّبُ عَلَى أَعْمَالِ الْمُتَدَرِّبِ فِي الْمَصْنَعِ."
            type: usage
      - lemma: "مُرْشَد"
        examples:
          - text: "يَتَّبِعُ الْمُرْشَدُ تَعْلِيمَاتِ مُوَجِّهِهِ بِدِقَّةٍ."
            type: usage
      - lemma: "مُسْتَرْشِد"
        examples:
          - text: "جَاءَ الْمُسْتَرْشِدُ يَطْلُبُ النُّصْحَ وَالْهِدَايَةَ مِنْ شَيْخِهِ."
            type: usage
      - lemma: "مَنْصُوح"
        examples:
          - text: "عَلَى الْمَنْصُوحِ أَنْ يَسْتَمِعَ بِعِنَايَةٍ لِمَا يُقَالُ لَهُ مِنْ إِرْشَادَاتٍ."
            type: usage
      - lemma: "مُرِيد"
        examples:
          - text: "يَلْتَزِمُ الْمُرِيدُ بِآدَابِ الصُّحْبَةِ مَعَ شَيْخِهِ الْمُرَبِّي."
            type: usage

