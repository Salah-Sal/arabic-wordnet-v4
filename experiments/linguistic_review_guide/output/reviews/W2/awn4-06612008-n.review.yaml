# مراجعة المجموعة الترادفية — awn4-06612008-n
# (psychoanalysis) hidden meaning of a fantasy or dream
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مُحْتَوَى كَامِن» مركب وصفي غير مسجّل في المعاجم بهذه الصيغة؛ المعجم الطبي الموحد يسجّل «مَضْمُون كامِن» لا «محتوى كامن»"
      - "المجموعة تحتوي لمّة واحدة فقط وهو عدد قليل لمفهوم نفسي له حضور في الأدبيات العربية"
    observations: "المفهوم ينتمي إلى التحليل النفسي الفرويدي ويشير إلى المعاني المستترة خلف المحتوى الظاهري للحلم. المركب «محتوى كامن» ترجمة حرفية لـ latent content، وهي مقبولة بنيوياً لكنّ المعاجم المتخصصة تُفضّل «مضمون كامن». الجذر «كمن» يدلّ على الاستخفاء والتواري وهو ملائم تماماً للدلالة المطلوبة."

  blind_candidates:
    - lemma: "مَضْمُونٌ كَامِنٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «مضمون» (ما يتضمّنه الشيء من معنى) و«كامن» (مستتر)؛ أقرب إلى الاستعمال المعجمي العربي من «محتوى كامن» لأنّ «مضمون» أكثر شيوعاً في سياق الدلالة والمعنى"
    - lemma: "مَكْنُونُ الحُلُمِ"
      generation_method: tarkib
      justification: "مركب إضافي من «مكنون» (المستور الخفي) و«الحلم»؛ يُحيل إلى الطبقة الخفية من معاني الحلم، مستوحى من الاستعمال القرآني «كتاب مكنون»"
    - lemma: "بَاطِنُ المَعْنَى"
      generation_method: tarkib
      justification: "مركب إضافي من «باطن» (داخل الشيء وخفيّه) و«المعنى»؛ جذر «بطن» يدلّ على الإنسيّ والداخلي عند ابن فارس"
    - lemma: "كَمِينُ الدَّلَالَةِ"
      generation_method: ishtiqaq
      justification: "على وزن فَعِيل بمعنى فاعل من «كمن» (استخفى)، مع إضافة إلى «الدلالة»؛ يفيد المعنى المختبئ غير الظاهر"


stage2_evidence:
  per_lemma:
    - lemma: "مُحْتَوَى كَامِن"
      expands:
        - text: "«كامن — latent» (الكيمياء، الجيولوجيا، الطب، الفيزياء)"
          source: "معاجم أليكسو الموحدة"
          addition: "تأكيد أنّ «كامن» هو المقابل المعتمد لـ latent في المصطلحية العربية الحديثة"
        - text: "«المضمون: المحتوى، ومنه مضمون الكتاب: ما في طيّه، ومضمون الكلام: فحواه وما يُفهم منه»"
          source: "المعجم الوسيط"
          addition: "تأكيد ترادف «المحتوى» و«المضمون» مما يجعل «محتوى كامن» و«مضمون كامن» مترادفَيْن"

    - lemma: "مَضْمُونٌ كَامِنٌ"
      confirm:
        - text: "«مَضْمُوْنٌ كامِن — latent content»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«المضمون: المحتوى، ومنه مضمون الكتاب: ما في طيّه، ومضمون الكلام: فحواه وما يُفهم منه»"
          source: "المعجم الوسيط"
      expands:
        - text: "«مَضْمُوْنُ الحُلُم — dream content»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "وجود مصطلح «مضمون الحلم» في المعجم نفسه يعزّز استعمال «مضمون» في السياق النفسي"

    - lemma: "مَكْنُونُ الحُلُمِ"
      expands:
        - text: "«المكنون: المستور البعيد عن الأعين، والمخفيّ لم تصل إليه الأيدي»"
          source: "المعجم الوسيط"
          addition: "دلالة الإخفاء والصون ملائمة لكنّ «مكنون» يميل إلى ما هو مصون عمداً لا مستتر نفسياً"

    - lemma: "بَاطِنُ المَعْنَى"
      expands:
        - text: "«الباطن من كل شيء: داخله... وباطن الأمر: دخلته، خلاف ظاهره»"
          source: "المعجم الوسيط"
          addition: "«باطن» يدلّ على الداخلي المقابل للظاهري وهو ملائم دلالياً لكنّ المركب «باطن المعنى» ليس مصطلحاً مسكوكاً في علم النفس"

    - lemma: "كَمِينُ الدَّلَالَةِ"
      expands:
        - text: "«الكاف والميم والنون أُصَيْلٌ يدلّ على استخفاء. يقال: كَمَنَ الشيءُ كُمُوناً»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ملائم لكنّ الصيغة «كمين الدلالة» غير مسكوكة ولا مسجّلة"


stage3_analysis:
  per_lemma:
    - lemma: "مُحْتَوَى كَامِن"
      decision: confirmed
      decision_reason: "مركب وصفي مفهوم ومتداول في الأدبيات النفسية العربية، وإن لم يُسجَّل بهذه الصيغة في المعاجم المتخصصة التي تُفضّل «مضمون كامن». يبقى صالحاً لأنّ «محتوى» و«مضمون» مترادفان في المعجم الوسيط."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُستخدم في السياقات الأكاديمية الحديثة والترجمات المعاصرة لنظرية فرويد؛ أقرب إلى الأسلوب المعاصر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحْتَوًى كَامِنٌ"

    - lemma: "مَضْمُونٌ كَامِنٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسجّل في المعجم الطبي الموحد (2009) مقابلاً لـ latent content بالذات. جذر «ضمن» يدلّ على جعل الشيء في شيء يحويه (ابن فارس)، و«مضمون» أكثر شيوعاً في سياق الدلالة والفحوى من «محتوى»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح المعتمد في المعاجم الطبية والنفسية المتخصصة؛ أقرب إلى التراث المصطلحي العربي الرسمي"
      actions:
        - command: create_entry
          params:
            lemma: "مَضْمُونٌ كَامِنٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَكْنُونُ الحُلُمِ"
      source: stage1
      decision: removed
      decision_reason: "مركب إضافي غير مسكوك في الاصطلاح النفسي. دلالة «مكنون» تميل إلى الصون المتعمّد (كاللؤلؤ المكنون) لا إلى الاستتار اللاواعي. كما أنّ تقييد المركب بـ«الحلم» يُضيّق الدلالة عن المفهوم الذي يشمل الخيال أيضاً."

    - lemma: "بَاطِنُ المَعْنَى"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة وليست مصطلحاً مسكوكاً. يمكن إبدال «باطن» بـ«خفيّ» أو «دفين» والعبارة تبقى صالحة → لا تجتاز اختبار السكّ. لا توجد في أيّ معجم متخصص."

    - lemma: "كَمِينُ الدَّلَالَةِ"
      source: stage1
      decision: removed
      decision_reason: "صيغة غير مسكوكة ولا مسجّلة. وزن «فَعِيل» بمعنى فاعل من «كمن» ممكن صرفياً لكنّ المركب «كمين الدلالة» لا يُعرف في الاستعمال ولا في المعاجم. كما أنّ «كمين» يرتبط ذهنياً بالكمين الحربي."


