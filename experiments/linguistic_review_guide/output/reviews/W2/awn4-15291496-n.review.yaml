# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15291496-n
# middle — النقطة بين بداية ونهاية فترة زمنية أو عملية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (منتصف، وسط) بدون تشكيل كامل"
      - "وسط لفظ متعدد الدلالات (ظرف، اسم، صفة) وقد يلتبس بالمعاني الأخرى كالعدل والخيار"
    observations: >
      المجموعة تُعبّر عن مفهوم زمني بحت: النقطة الفاصلة بين بداية فترة زمنية ونهايتها.
      التعريف واضح ومحدد. المفهوم أصيل في العربية وله ألفاظ متعددة مشتقة من جذرَي
      (ن ص ف) و(و س ط). التمييز بين الاستعمال الزمني والمكاني ضروري لضبط اللمّات.
  blind_candidates:
    - lemma: "مُنْتَصَف"
      generation_method: ishtiqaq
      justification: "مُفْتَعَل من (نصف)، يدل على بلوغ النصف من الشيء، يُستعمل خصوصاً مع الأزمنة: منتصف النهار، منتصف الشهر"
    - lemma: "وَسَط"
      generation_method: ishtiqaq
      justification: "من (وسط)، ما بين طرفَي الشيء، يصلح للزمان والمكان"
    - lemma: "مَنْصِف"
      generation_method: ishtiqaq
      justification: "مَفْعِل من (نصف) بمعنى اسم المكان والزمان، ورد في المعاجم بمعنى المنتصف من النهار والطريق"
    - lemma: "نِصْف"
      generation_method: ishtiqaq
      justification: "من (نصف)، شطر الشيء ونصيفه، قد يُستعمل مجازاً للدلالة على نقطة التنصيف"

stage2_evidence:
  per_lemma:
    - lemma: "مُنْتَصَف"
      confirm:
        - text: "«من كلِّ شيء: وسطه»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(المنتصف) من كل شَيْء وَسطه يُقَال أَتَيْته منتصف النَّهَار أَو الشَّهْر أَو السَّاعَة»"
          source: "المعجم الوسيط (هَورماني)"
        - text: "«مُنْتَصَف: من (ن ص ف) وسط كل شيء، والمستوفي حقه كاملا»"
          source: "المغرب في ترتيب المعرب"
      expands:
        - text: "«منتصف = middle»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "المصطلح معتمد في المعاجم الاصطلاحية الحديثة"

    - lemma: "وَسَط"
      confirm:
        - text: "«وَسَطُ الشيء، محركةً: ما بين طَرَفَيْهِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الْوسط) وسط الشَّيْء مَا بَين طَرفَيْهِ وَهُوَ مِنْهُ»"
          source: "المعجم الوسيط (هَورماني)"
        - text: "«الوسط: محركةً ما بين طرفي الشيء كمركز الدائرة»"
          source: "التعريفات للجرجاني"
      expands:
        - text: "«والمعتدل من كل شَيْء يُقَال شَيْء وسط بَين الْجيد والرديء... وَالْعدْل وَالْخَيْر»"
          source: "المعجم الوسيط (هَورماني)"
          addition: "للوسط دلالات إضافية على العدل والاعتدال والخيار لا تتعلق بالمعنى الزمني المقصود"
        - text: "«ما يستوي في الوسط أي بالمنطقة الناصفة للجسم أو لعضو ما»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          addition: "يُستعمل وسط في السياق التشريحي بمعنى مكاني"

    - lemma: "مَنْصِف"
      confirm:
        - text: "«المَنْصَفُ: من النهار والطريق وكل شيء وسطه»"
          source: "معجم البلدان لياقوت الحموي"
        - text: "«(الْمنصف) المنتصف يُقَال بلغ منصف الطَّرِيق»"
          source: "المعجم الوسيط (هَورماني)"
      contradicts:
        - text: "«المنصف: على انه اسم مفعول من التنصيف عند المحاسبين هو العدد الحاصل من عمل التنصيف كالأربعة الحاصلة من تنصيف الثمانية»"
          source: "كشاف اصطلاحات الفنون والعلوم"
          conflict: "في الاصطلاح الرياضي المنصَّف يعني نتيجة التنصيف لا النقطة الوسطى"

    - lemma: "نِصْف"
      contradicts:
        - text: "«نِصْفُ الشَّيْءِ وَنَصِيفُهُ: شَطْرُهُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "النِّصف يدل على الشطر (الجزء) لا على النقطة الوسطى بين طرفين"

stage3_analysis:
  per_lemma:
    - lemma: "مُنْتَصَف"
      decision: confirmed
      decision_reason: >
        لمّة فصيحة مشتقة من (نصف) على وزن مُفْتَعَل، مؤيَّدة بنصوص المعجم الوسيط
        وغيره، وتُستعمل خصوصاً مع الأزمنة (منتصف النهار، الشهر، الساعة)
        وهو الأنسب للدلالة الزمنية المقصودة في هذه المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختص بالدلالة على نقطة التنصيف الدقيقة زمنياً أو مكانياً، ويغلب استعماله مع الأزمنة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْتَصَف"

    - lemma: "وَسَط"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة من جذر (وسط)، ثابتة في المعاجم بمعنى «ما بين طرفَي الشيء»،
        وإن كانت أعمّ من منتصف فإنها تصلح للدلالة الزمنية في سياقات مثل
        «وسط الأسبوع» و«وسط الحدث».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ من مُنتصَف، يدل على ما بين الطرفين دون اشتراط التساوي الدقيق، ويصلح للزمان والمكان والمجرد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَسَط"

    - lemma: "مَنْصِف"
      source: stage1
      decision: removed
      decision_reason: >
        وإن ورد في بعض المعاجم بمعنى المنتصف، فهو نادر الاستعمال في العربية المعاصرة
        ويلتبس بـ«مُنْصِف» (العادل) و«مُنَصَّف» (الرياضي)، ولا يضيف فرقاً دلالياً
        واضحاً عن «مُنتصَف» الموجود.

    - lemma: "نِصْف"
      source: stage1
      decision: removed
      decision_reason: >
        النِّصف يدل على الشَّطر والجزء المساوي، لا على النقطة الفاصلة بين الطرفين.
        لا يصح أن يحل محل «منتصف» في سياق «نقطة بين بداية ونهاية فترة زمنية».

