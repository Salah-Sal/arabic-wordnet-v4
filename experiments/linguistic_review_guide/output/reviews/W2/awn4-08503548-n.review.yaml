stage4_content:
  definition:
    current: "(العهد الجديد) الحكماء الذين زاروا يسوع ومريم ويوسف بعد فترة وجيزة من ولادة يسوع؛ يقول إنجيل متى إنهم استرشدوا بنجم وجلبوا هدايا من الذهب واللبان والمر؛ ولأن هناك ثلاث هدايا، يُفترض عادة أنهم كانوا ثلاثة"
    assessment:
      decision: revise
      reason: "التعريف الحالي طويل جداً ويحتوي على تفاصيل استطرادية. الأفضل صياغته بأسلوب معجمي مركز."
    authored:
      - type: terminological
        text: "الحكماء الذين قادهم النجم إلى بيت لحم لزيارة يسوع (المسيح) بعد ولادته، وقدموا له هدايا من الذهب واللبان والمر، واشتهروا بكونهم ثلاثة لعدد هداياهم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "المَجُوسُ الثَّلَاثَةُ"
        examples:
          - text: "يرمز الذهب الذي قدمه المجوس الثلاثة إلى ملوكية يسوع."
            type: usage
      - lemma: "حُكَمَاءُ المَشْرِقِ"
        examples:
          - text: "جاء حكماء المشرق إلى أورشليم قائلين: أين هو المولود ملك اليهود؟"
            type: usage
            source: "إنجيل متى 2:1-2"
      - lemma: "المَجُوسُ"
        examples:
          - text: "سار المجوس خلف النجم حتى وصلوا إلى موضع الطفل."
            type: usage
      - lemma: "المُلُوكُ الثَّلَاثَةُ"
        examples:
          - text: "تُقام الاحتفالات بعيد الملوك الثلاثة في ذكرى زيارتهم للمسيح."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "الحكماء الذين قادهم النجم لزيارة يسوع المسيح في مهد ببيت لحم، حاملين هدايا من الذهب واللبان والمُرّ."}

