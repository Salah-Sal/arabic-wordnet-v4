stage1_review:
  assessment:
    concerns:
      - التعريف الحالي يميل للأسلوب الموسوعي المطول (Encyclopedic).
      - اللمات الموجودة كافية ومناسبة، لكن ينقصها التشكيل الكامل وربما إضافة صيغ شائعة أخرى.
    observations: "المصطلح يشير إلى فئة تاريخية/دينية محددة في التقليد المسيحي، ويرتبط دلالياً بمصطلحات أخرى مثل نجم بيت لحم والهدايا الثلاث. لفظ 'المجوس' في أصله الفارسي يشير لرجال الدين الزرادشتيين، لكنه في هذا السياق اكتسب دلالة مسيحية خاصة."
  blind_candidates:
    - lemma: "المَجُوسُ الثَّلَاثَةُ"
      generation_method: tarkib
      justification: "الاسم الأكثر شيوعاً وتحديداً لهذه المجموعة في العربية."
    - lemma: "حُكَمَاءُ المَشْرِقِ"
      generation_method: tarkib
      justification: "ترجمة كتابية تقليدية (إنجيل متى 2:1) مستخدمة بكثرة في الأدبيات المسيحية."
    - lemma: "المَجُوسُ"
      generation_method: majaz
      justification: "الاسم العام الذي يُطلق عليهم في سياق قصة الميلاد، وغالباً ما يُقصد به هؤلاء الثلاثة تحديداً عند وروده في هذا السياق."
    - lemma: "المُلُوكُ الثَّلَاثَةُ"
      generation_method: tarkib
      justification: "تسمية بديلة شائعة متأثرة بالتقاليد الغربية (Three Kings) وموجودة في بعض الترجمات العربية."

stage2_evidence:
  per_lemma:
    - lemma: "المجوس الثلاثة"
      confirm:
        - text: "المجوسيّ: واحد من ثلاثة حكماء حملوا الهدايا إلى المسيح عند ولادته"
          source: "المورد الحديث"
    - lemma: "حكماء المشرق"
      confirm:
        - text: "نجم بَيْتَ لَحْمَ: نجم يعتقد النَّصارى أنه قاد المجوس إلى يَسوعَ الطفل في بيتَ لَحمَ."
          source: "المورد الحديث"
    - lemma: "المجوس"
      confirm:
        - text: "المجوس: (في الإنكليزية) Magi... المَجُوس: فرقة من الكفرة يعبدون الشمس والقمر"
          source: "كشاف اصطلاحات الفنون / المعجم الوسيط"
      expands:
        - text: "واحد من ثلاثة حكماء حملوا الهدايا إلى المسيح عند ولادته"
          source: "المورد الحديث"
          addition: "يوضح الاستخدام الخاص للمفرد في السياق الكتابي."
    - lemma: "الملوك الثلاثة"
      evidence_status: "no_material_found"

