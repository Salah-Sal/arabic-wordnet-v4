stage1_review:
  assessment:
    concerns:
      - "غياب التشكيل عن اللمات الحالية (تعتق، نضج) مما قد يسبب التباساً مع الأفعال."
      - "الترجمة الحرفية لعبارة (without being undisturbed) إلى (دون إزعاج) لا تتناسب مع السياق العلمي واللغوي، فالأصح (في ظروف مهيأة) أو (دون تدخل)."
    observations: "المفهوم يشير إلى التغيرات الإيجابية التي تحدث للمادة بمرور الزمن. في العربية، يعبر (النُّضْج) عن اكتمال الخصائص في الثمار والأشياء الحيوية، بينما يعبر (التَّعَتُّق) و(التَّعْتِيق) عن اكتساب الجودة بالزمن (كالطيب والجبن)."
  blind_candidates:
    - lemma: "تَعَتُّق"
      generation_method: ishtiqaq
      justification: "مصدر لفعل (تعتّق)، يدل على صيرورة الشيء عتيقاً واكتسابه خصائص الجودة بمرور الزمن."
    - lemma: "نُضْج"
      generation_method: ishtiqaq
      justification: "مصدر لفعل (نضج)، يدل على اكتمال الشيء وبلوغه النهاية في التمام والكمال."
    - lemma: "تَعْتِيق"
      generation_method: ishtiqaq
      justification: "مصدر يدل على العملية الصناعية أو المقصودة لترك الشيء زمناً ليطيب ويجود."
    - lemma: "إِنْضَاج"
      generation_method: ishtiqaq
      justification: "مصدر يدل على إحكام الشيء وإيصاله إلى مرحلة النضج المطلوبة."

stage2_evidence:
  per_lemma:
    - lemma: "تَعَتُّق"
      confirm:
        - text: "«ageing»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"
    - lemma: "نُضْج"
      confirm:
        - text: "«(نضج) نضجا ونضجا ونضاجا أدْرك وطاب يُقَال نضج اللَّحْم ونضجت الْفَاكِهَة ونضج الطَّعَام وَيُقَال نضج الرَّأْي ونضج الْأَمر أحكم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«اكتمال النمو maturation»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "تَعْتِيق"
      confirm:
        - text: "«تعتيق (في حالة الطحين والجبنة مثلاً): aging; ageing»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
    - lemma: "إِنْضَاج"
      confirm:
        - text: "«ripening»"
          source: "المَكنَز الزراعي متعدد اللغات"

stage3_analysis:
  per_lemma:
    - lemma: "تَعَتُّق"
      decision: confirmed
      decision_reason: "مصدر دقيق يعبر عن اكتساب الشيء لصفات الجودة بمرور الوقت، وهو مطابق لعملية (ageing)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَتُّق"
    - lemma: "نُضْج"
      decision: confirmed
      decision_reason: "مصدر فصيح يدل على التمام واكتساب الخصائص المطلوبة خصوصاً في العمليات الحيوية، ويقابل (ripening)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُضْج"
    - lemma: "تَعْتِيق"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر يستخدم كثيراً للدلالة على ترك المادة (كالأجبان والعطور) لفترة لتكتسب الجودة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَعْتِيق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "إِنْضَاج"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر يقابل اصطلاحاً التدخل لإتمام اكتساب الخصائص، ويستخدم كمرادف لـ (ripening)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "إِنْضَاج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "اكتساب صفات مرغوبة عن طريق ترك الشيء دون إزعاج لبعض الوقت"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على ترجمة ركيكة (دون إزعاج). يجب صياغته بأسلوب علمي ومعجمي سليم يعكس التطور بمرور الزمن."
    authored:
      - type: terminological
        text: "عملية تُترك فيها المادة لفترة من الزمن في ظروف مهيأة لتكتسب خصائص مرغوبة كالجودة أو الطعم أو الرائحة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية تُترك فيها المادة لفترة من الزمن في ظروف مهيأة لتكتسب خصائص مرغوبة كالجودة أو الطعم أو الرائحة."

  examples:
    per_lemma:
      - lemma: "تَعَتُّق"
        examples:
          - text: "أكسبت مرحلة التَّعَتُّق الجبنَ طعمه الغني ونكهته المميزة."
            type: usage
      - lemma: "نُضْج"
        examples:
          - text: "تحتاج بعض الثمار إلى النُّضْج بعد قطفها لضمان حلاوة المذاق."
            type: usage
      - lemma: "تَعْتِيق"
        examples:
          - text: "يُعتبر تَعْتِيق العطور في أوعية مخصصة خطوة أساسية لزيادة تركيزها."
            type: usage
      - lemma: "إِنْضَاج"
        examples:
          - text: "تُستخدم غرف خاصة بغرض إِنْضَاج الفواكه وتجهيزها للأسواق."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أكسبت مرحلة التَّعَتُّق الجبنَ طعمه الغني ونكهته المميزة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تحتاج بعض الثمار إلى النُّضْج بعد قطفها لضمان حلاوة المذاق."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعتبر تَعْتِيق العطور في أوعية مخصصة خطوة أساسية لزيادة تركيزها."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُستخدم غرف خاصة بغرض إِنْضَاج الفواكه وتجهيزها للأسواق."

