stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (حزمة، علبة) تغطي جوانب محددة (الربط المادي أو الوعاء) ولكنها تفتقر للّفظ المعياري للمجموعة المتكاملة (Set)."
    observations: "المفهوم يشير إلى 'Pack' أو 'Set' بمعناهما العام كتشكيلة كاملة متجانسة. كلمة 'طقم' هي الأنسب دلالياً في المعجم الحديث لهذا الغرض."
  blind_candidates:
    - lemma: "طَقْم"
      generation_method: taarib
      justification: "اللفظ المعياري الحديث لمجموعة متكاملة من الأدوات أو الأشياء (طقم صحون، طقم ورق لعب)."
    - lemma: "رِزْمَة"
      generation_method: ishtiqaq
      justification: "ما جُمع من الأشياء المتشابهة في وحدة واحدة (رزمة ورق، رزمة ثياب)."
    - lemma: "عُدَّة"
      generation_method: ishtiqaq
      justification: "تُطلق على المجموعة الكاملة من الأدوات أو الأجهزة اللازمة لغرض معين."
    - lemma: "تَوْلِيفَة"
      generation_method: ishtiqaq
      justification: "مجموعة منسقة من العناصر المترابطة."

stage2_evidence:
  per_lemma:
    - lemma: "حُزْمَة"
      confirm:
        - text: "ما جُمع ورُبط من كلِّ شيء"
          source: "المعجم الوسيط"
        - text: "تجميع منظم لمجموعة من العناصر."
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "عُلْبَة"
      confirm:
        - text: "وعاء من خشب أو ورق أو صفيح معدني يحفظ فيه الشيء"
          source: "المعجم الوسيط"
      expands:
        - text: "تُستخدم للدلالة على الـ (Pack) التجاري الذي يحوي عدداً محدداً من الأشياء المتشابهة (مثل علبة السجائر)."
          source: "ملاحظة لغوية"
    - lemma: "طَقْم"
      confirm:
        - text: "مجموعة متكاملة من الأدوات أو الأشياء تُستعمل لأغراض خاصَّة (طقم أقلام/ مجوهرات/ فضيّات/ صحون/ قهوة/ شاي)."
          source: "معجم اللغة العربية المعاصرة"
        - text: "مجموعة متكاملة من الأدوات تستعمل في أغراض خاصة"
          source: "المعجم الوسيط"
    - lemma: "رِزْمَة"
      confirm:
        - text: "ما جُمع فى شيء واحد. يقال: رزمة ثياب, ورزمة ورق, وهكذا"
          source: "المعجم الوسيط"
        - text: "جمع الشيء وضم بعضه إلى بعض تباعاً... ومن ذلك اشتقاق رزمة الثياب."
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "حزمة"
      decision: confirmed
      decision_reason: "فصيحة وتؤدي معنى المجموعة المجموعة برباط، وهي ترجمة شائعة لـ bundle و packet."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُزْمَة"
    - lemma: "علبة"
      decision: confirmed
      decision_reason: "رغم دلالتها الأصلية على الوعاء، إلا أنها تُستخدم اصطلاحياً للمجموعة التي يحويها الوعاء (Pack)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُلْبَة"
    - lemma: "طَقْم"
      source: stage1
      decision: confirmed
      decision_reason: "أدق مصطلح حديث للتعبير عن 'المجموعة الكاملة المتكاملة' (Set/Pack)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "طَقْم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07973040-n"
    - lemma: "رِزْمَة"
      source: stage1
      decision: confirmed
      decision_reason: "فصيحة وتدل على جمع الأشياء المتجانسة وضمها في وحدة واحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "رِزْمَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07973040-n"

stage4_content:
  definition:
    current: "مجموعة كاملة من أشياء متشابهة"
    assessment:
      decision: revise
      reason: "لجعله أكثر دقة ومعجمية ليشمل مفهوم التكامل والتجانس."
    authored:
      - type: terminological
        text: "مجموعةٌ مُتكاملةٌ من أشياءَ مُتجانسةٍ تُؤخَذُ أو تُستخدَمُ كوَحدةٍ واحدة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "حُزْمَة"
        examples:
          - text: "اشترى التاجرُ حُزْمَةً كبيرةً من الحطب."
            type: usage
      - lemma: "عُلْبَة"
        examples:
          - text: "أخرج الرسامُ عُلْبَةَ ألوانِهِ وبدأ بالرسم."
            type: usage
      - lemma: "طَقْم"
        examples:
          - text: "قدمت العروسُ طَقْمَ صحونٍ فاخراً لضيوفها."
            type: usage
      - lemma: "رِزْمَة"
        examples:
          - text: "وضعت السكرتيرةُ رِزْمَةَ ورقٍ في الطابعة."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07973040-n"
          definition_index: 0
          text: "مجموعةٌ مُتكاملةٌ من أشياءَ مُتجانسةٍ تُؤخَذُ أو تُستخدَمُ كوَحدةٍ واحدة."

stage5_enrichment:
  per_entry:
    - lemma: "حُزْمَة"
      entry_id: "{auto}"
      root: "حزم"
      maqayis_quote: "«الْحَاءُ وَالزَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ شَدُ الشَّيْءِ وَجَمْعُهُ، قِيَاسٌ مُطَّرِدٌ.»"
    - lemma: "رِزْمَة"
