# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04947907-n  |  ILI: i62942
# Lemmas: قابلية الاختراق / نفاذية
# Concept: penetrability / perviousness
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي مصوغٌ بأسلوب الترجمة الحرفية من الإنجليزية («وما إلى ذلك» وتقنية القوسين التوضيحيين) بدلاً من أسلوب المعجم الوسيط"
      - "اللمتان خاليتان من التشكيل الكامل وهو إلزامي للمجموعات الترادفية"
      - "نفاذية تُستخدم في المعاجم التقنية العربية في الغالب مقابل permeability (نفاذية المواد الصلبة للموائع) وليس penetrability (قابلية الاختراق بالقوة الفيزيائية) — وهذا تمييز دقيق ينبغي توثيقه"
      - "قابلية الاختراق مركب وصفي حر اشتقاقياً، يصعب التثبّت من درجة تعجّمه ومحدودية تداوله في السياق غير الجيوتقني"
    observations: >
      تُدلّ المجموعة على خاصية مجردة مُنسوبة إلى الجسم أو المادة، وهي قبوله للنفاذ والاختراق.
      اللمتان الموجودتان جاءتا من منهجين مختلفين: «نفاذية» مصدر صناعي من الجذر (نفذ)،
      و«قابلية الاختراق» مركب إضافي من قابلية + الاختراق. الفرق الدلالي جوهري: نفاذية تستعمل
      كثيراً في الفيزياء والكيمياء بمعنى نفاذية المواد (permeability)، بينما قابلية الاختراق
      تُلائم سياق الاختراق بالقوة الفيزيائية (أشخاص، قذائف، أدوات). يُلاحَظ أن النسيج
      المعجمي العربي الحديث لا يُفرّق دائماً بين المفهومين، مما يجعل التوثيق الدقيق ضرورياً.
  blind_candidates:
    - lemma: "نَفَاذِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الجذر (نفذ) على مصدر نَفَاذ + ياء النسب والتاء المربوطة. وزن المصدر الصناعي
        (-ية) مناسب تماماً للمفاهيم المجردة الدالة على الصفات والخصائص. الجذر نفذ يدل على
        المضاء في الأمر والعبور عبره، وهو يُغطي المفهوم دلالياً بدقة.
    - lemma: "اخْتِرَاقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الفعل الخماسي اخترقَ + ية. وزن الاشتقاق يدل على الصفة المجردة لكون
        الشيء قابلاً للاختراق. الجذر (خرق) يدل على مزق الشيء وجوبه، وهو مناسب للمفهوم.
    - lemma: "نُفُوذِيَّة"
      generation_method: majaz
      justification: >
        إحياء للمعنى الكلاسيكي لـ«نُفُوذ» الذي كان يدل أصلاً على المرور عبر الشيء ونفاذه
        (نفذ السهمُ الرميةَ)، قبل أن يتخصص في العصر الحديث بمعنى السلطة والنفوذ السياسي.
        إضافة ياء المصدر الصناعي تُنشئ مصطلحاً دالاً على الصفة المجردة مع تجنّب اشتراك
        «نفاذية» في حقل permeability.
    - lemma: "تَخَلُّلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الفعل تَخَلَّلَ (النفاذ عبر الثغرات والفجوات) + ية. الجذر (خلل)
        يدل على الفُرجة بين الشيئين والمرور من خلالهما. يُغطي خاصة النفاذ عبر
        الشبكات والمسام والمادة الهشّة، وهو يتكامل مع الجذر (نفذ).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "قابلية الاختراق"
      confirm:
        - text: "«قابلية الاختراق — penetrability — pénétrabilité — سهولة إدخال عينة في التربة. وتقاس هذه السهولة بوحدات المسافة، أو السرعة، أو القوة، أو العمل، ويتوقف ذلك على نوع جهاز أو أداة قياس الاختراق المستخدمة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«اختراق — penetrability — العمق من عشر المليمتر، الذي تدخله إبرة قياسية تخترق عينة من القار في ظل ظروف موحدة من الحمل، ودرجة الحرارة، والوقت.»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: >
            يكشف هذا المدخل أن مصطلح الاختراق ومشتقاته يُستعمل في حقل النقل لقياس نوع خاص
            من الاختراق في مواد القار، وهو أضيق من المعنى العام للمجموعة.
        - text: "«اختراق — penetration — الحركة الشاقولية لوتد عند كل ضربة مطرقة»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: >
            يُثبّت استخدام الاختراق ومشتقاته في السياقات الجيوتقنية والهندسية،
            مما يُعزّز ملاءمة «قابلية الاختراق» في هذه الحقول.

    - lemma: "نفاذية"
      confirm:
        - text: "«نَفَاذِيَّة — penetrability — pénétrabilité»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«نفاذية — penetrability (deprecated) — pénétrabilité (déconseillé) f»"
          source: "موسوعة الكهرباء الدولية IEC 60050 (Electropedia)"
        - text: "«نفاذية — قابلية النفوذ — permeability — perméabilité»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«نَفاذية — مقدرة التربة أو الأحجار والصخور على تحويل وتصريف المياه.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«نَفَاذِيَّة — قابلية المادة لتمرير الغازات والأبخرة والسوائل.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«نفاذية — permeability — perméabilité»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«نفاذية — permeability — perméabilité»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«نفاذية — permeability — perméabilité»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      expands:
        - text: "«نَفاذِيَّة — خاصية في الأجسام الصلبة، تُتيح لها إمرار الغازات و/أو السوائل عبرها. وفي علوم الكيمياء والأحياء، تكون مثل هذه الأجسام الصلبة ذات خاصية النفاذية أغشيةً رقيةً. يوجد نوعان من النفاذيّة: «شِبة النفاذيّة» و«النفاذيّة الانتقائية».»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: >
            التعريف يُوضّح أن النفاذية في السياق الكيميائي والبيولوجي تخص الأغشية الرقيقة
            وتمريرها للموائع، وهو استخدام مجازي موسّع لمفهوم permeability.
        - text: "«نفاذية — نسبة كثافة التدفّق المغناطيسيّ إلى قوة المجال المغناطيسيّ، وتُعتبر مقياساً للخصائص المادية للوسط.»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: >
            يُظهر امتداد «نفاذية» إلى حقل الفيزياء الكهرومغناطيسية بمعنى مغاير
            (معامل النفاذية المغناطيسية)، وهو مختلف عن penetrability.
        - text: "«نفاذية، قابلية النفاذ — permeability — perméabilité»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: >
            يعرض المعجم «نفاذية» و«قابلية النفاذ» معاً كمترادفين في الكيمياء،
            مما يُثبّت وجود مصطلح بديل «قابلية النفاذ» في الاستعمال التقني.

    - lemma: "اخْتِرَاقِيَّة"
      contradicts:
        - text: "«اخْتِرَاقِيَّة — penetrability — العمق من عشر المليمتر، الذي تدخله إبرة قياسية تخترق عينة من القار في ظل ظروف موحدة من الحمل، ودرجة الحرارة، والوقت.»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: >
            الاختراقية في المعجم التقني مصطلح ضيق جداً خاص بقياس الاختراق في مواد القار
            والإسفلت (bitumen penetration test)، وهو معنى حرفي لنوع قياس محدد، لا يُغطي
            المعنى العام للمجموعة الترادفية (الصفة المجردة للقابلية للاختراق بوجه عام).

    - lemma: "نُفُوذِيَّة"
      confirm:
        - text: "«نَفُوْذِيَّةُ — perviousness — perméabilité»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«نفاذية، نُفوذية — permeability — perméabilité»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«نَفُوذيّة (نفاذية) — permeability — perméabilité»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«نُفُوذية، قابلية النفوذ — permeability — perméabilité»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"

    - lemma: "تَخَلُّلِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "قابلية الاختراق"
      decision: confirmed
      decision_reason: >
        المصطلح مُسجَّل في معجم تقني رسمي (ArabTerm / ALECSO) مقابلاً لـ"penetrability"
        مع تعريف علمي محدد. اجتاز اختبار السكّ: التعبير وحدة اصطلاحية إضافية ثابتة في
        السياق الجيوتقني والهندسي. لا يمكن إبدال «الاختراق» بمرادفه «النفاذ» بحرية في
        سياق «قياس قابلية اختراق التربة» دون تغيير المعنى التقني المقصود.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على الاختراق بفعل قوة فيزيائية خارجية (أشخاص، قذائف، أدوات قياس)؛ الأنسب
        للسياقات الجيوتقنية والعسكرية. يختلف عن «نفاذية» التي تغلب عليها دلالة السماح
        بمرور الموائع والإشعاع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّة الاخْتِرَاق"

    - lemma: "نفاذية"
      decision: confirmed
      decision_reason: >
        مصطلح راسخ في عشرات المعاجم التقنية العربية الرسمية، مشتق اشتقاقاً صحيحاً من
        الجذر (نفذ) على وزن نَفَاذ + ية. المعجم الطبي الموحد وموسوعة الكهرباء (Electropedia)
        يُثبتانه صراحةً مقابلاً لـpenetrability. اجتاز جميع معايير بوابة جودة المصطلح:
        الاطراد، اليسر، الملاءمة، الأصالة العربية، الاشتقاقية.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أوسع تداولاً في السياقات التقنية الفيزيائية والكيميائية والبيولوجية؛ يغلب عليه
        معنى permeability (السماح بمرور الموائع والإشعاع)، مع توثيق بعض المعاجم له
        صراحةً في معنى penetrability.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَفَاذِيَّة"

    - lemma: "اخْتِرَاقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح موجود في معجم النقل لكن بمعنى ضيق جداً خاص بقياس اختراق مواد القار (bitumen
        penetration test)، وهو تقنية قياس محددة بعيدة عن المعنى العام للمجموعة.
        فشل اختبار التثبيت المعجمي في المعنى المطلوب، ولا يصلح لتمثيل الصفة المجردة
        «قابلية الاختراق» بوجه عام.

    - lemma: "نُفُوذِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَّت في المعجم الطبي الموحد (2009) مقابلاً مباشراً وحصرياً لـ"perviousness" —
        وهو أحد اللمّتين الإنجليزيتين للمجموعة — مما يجعل إضافته للمجموعة إثراءً دقيقاً.
        كما يرد في معاجم الجيولوجيا والطب البيطري والأرصاد بوصفه مرادفاً لـنفاذية.
        مصدر صناعي صحيح من الجذر (نفذ) على نُفُوذ + ية.
        يتمايز عن نفاذية بتركيز أكبر على السياق الطبي والبيولوجي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الأكثر تخصصاً في السياق الطبي والبيولوجي للدلالة على نفاذية الأغشية والأنسجة
        (perviousness)، في مقابل نفاذية الأعم استخداماً في الفيزياء والكيمياء.
      actions:
        - command: create_entry
          params:
            lemma: "نُفُوذِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَخَلُّلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود للمصطلح في أي مصدر معجمي متاح. يفتقر إلى التثبيت المعجمي اللازم
        لقبوله وإن كان مشتقاً اشتقاقاً صحيحاً من الجذر (خلل).


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
