        prefers_arabic: "عربي أصيل"
        derivability: "يقبل الاشتقاق: مَذاقات، ذو مذاق"
      nuance_differentiation: >-
        يُحيل إلى التجربة الحسية الفعلية الناتجة عن التذوّق، أي ما يُحسّ به المتذوّق
