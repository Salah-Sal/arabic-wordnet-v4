        «نكهة» إلى «flavour» الجامع للطعم والرائحة معاً — وهو أوسع من «taste property»
        التي تقتصر على حاسة الذوق وحدها. ولا يصح تضمين «نكهة» هذه المجموعة لما في ذلك
