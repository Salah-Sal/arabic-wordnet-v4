# ═══════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review
# Synset: awn4-04999341-n  |  ILI: i63237
# المعنى: خاصية ذوقية (taste property)
# ═══════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «خاصية ذوقية» مكتوبة بلا تشكيل"
      - "المجموعة تحتوي على لمّة واحدة فقط وهي مركب وصفي مطوَّل؛ ينبغي إثراؤها بمفردات مستقلة راسخة"
      - "الفعل «تُقدَّر» في التعريف العربي لا يناسب السياق الحسي؛ الأدق «تُدرَك» أو «يُحسّ بها»"
    observations: >-
      المجموعة تمثّل مفهوماً تصنيفياً مجرّداً هو «الخاصية الذوقية» بوصفه جنساً يجمع
      أنواع الطعوم المحسوسة (كالحلاوة والمرارة والحموضة والملوحة). للعربية ألفاظ مفردة
      راسخة في هذا الحقل هي «طَعْم» و«مَذَاق»، وغيابهما عن المجموعة يجعلها ناقصة. كذلك
      «نَكْهَة» مرشّحة محتملة لكنها في العربية الأصيلة تعني رائحة الفم أولاً، وفي
      اصطلاح علوم الأغذية تُفيد «flavour» الجامع للطعم والرائحة معاً — وهو أوسع من
      المفهوم المقصود هنا.

  blind_candidates:
    - lemma: "مَذَاق"
      generation_method: ishtiqaq
      justification: >-
        مصدر ميمي على وزن مَفْعَل من الجذر (ذ و ق)؛ يدل على ما يُحسّ به من طعم الشيء
        عند تذوّقه، وهو بذلك خاصية يُدرَك وجودها عبر حاسة الذوق بعينها.

    - lemma: "طَعْم"
      generation_method: majaz
      justification: >-
        إزاحة دلالية من المعنى المحسوس (ما يتذوقه الإنسان) إلى المعنى التصنيفي
        (الخاصية الذوقية الكامنة في المادة). ذُكر في دستور العلماء وغيره بمعنى «ما
        تُدركه حاسة الذوق» وهو عين المفهوم المطلوب.

    - lemma: "نَكْهَة"
      generation_method: majaz
      justification: >-
        توسيع دلالي من «رائحة الفم» إلى «الكيفية الذوقية المميزة للمادة»، وقد شاع
        استخدامها بمعنى «flavour» في المعاجم الطبية وعلوم الأغذية الحديثة.

    - lemma: "صِفَة ذَوْقِيَّة"
      generation_method: tarkib
      justification: >-
        مركب وصفي (إضافة + نسبة): «صِفَة» جنس قريب + «ذَوْقِيَّة» نسبة إلى الذوق،
        يوازي البنية الدلالية للمصطلح الإنجليزي «taste property».


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "خاصية ذوقية"
      evidence_status: "no_material_found"
      # لم يُعثر على المركب «خاصية ذوقية» كمدخل في أيّ معجم.
      # «ذوقية» (نسبة إلى الذوق) ورد في موسوعة السلطان قابوس وحده.

    - lemma: "مَذَاق"
      confirm:
        - text: "«(المَذاق) طعم الشيء. يقال: طيبُ المذاق»"
          source: "المعجم الوسيط (OCR)"
        - text: "«المَذاقُ: طَعْمُ الشيءِ.»"
          source: "المعجم الكبير (OCR)"
        - text: "«(المذاق) طعم الشَّيْء يُقَال طيب المذاق»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«مَذاق» — translation_en: taste"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — ARABTERM"
        - text: "«مذاق» — translation_en: taste"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999) — ARABTERM"
        - text: "«طعْم، مذاق» — translation_en: taste"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — ARABTERM"
        - text: "«طَعْم، مَذَاق» — translation_en: taste"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — ARABTERM"
        - text: "«ذوْق، طَعْم، مَذَاق» — translation_en: taste; flavor"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — ARABTERM"
        - text: "«(1) مذاق؛ طَعْم ... (8) مَذاق؛ طَعْم»"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: "«نَكْهة؛ مَذاق؛ طَعْم.» — translation_en: sapor"
          source: "المورد الحديث (2008) — ARABTERM"

    - lemma: "طَعْم"
      confirm:
        - text: "«الطَّعْم: مَذاقُ كلِّ شيءٍ من حلاوةٍ, أو مَرارَةٍ, أو مُلُوحَةٍ, أو حُمُوضَةٍ»"
          source: "المعجم الكبير (OCR)"
        - text: "«(الطّعْم) مَا تُدْرِكهُ حاسة الذَّوْق من طَعَام أَو شراب كالحلاوة والمرارة والحموضة وَمَا بَينهمَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الطّعْم: مَعْرُوف وأنواعه تِسْعَة وَهِي المرارة - والحرافة - والملوحة والعفوصة - والحموضة - وَالْقَبْض - والحلاوة - والدسومة - والتفاهة»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«طَعْم» — translation_en: flavour"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — ARABTERM"
        - text: "«طعم (ال...) والرائحة» — translation_en: taste and odors"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
        - text: "«طعم حديدي: مذاق يشبه ذلك الذي يحسه من يمس لسانه قطعة من المعدن.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985) — ARABTERM"
          addition: "يُثبت أن طعم يُستخدم للدلالة على كيفية ذوقية محددة"
        - text: "«الطعم: تناول الغذاء، ويسمى ما يتناول منه طعما وطعاما.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«(الطّعْم) الطَّعَام وَمَا يلقى للسمك وَغَيره لاصطياده، ويطلق مجازاً على كل ما يتوصل به إلى شيء كالرشوة والمصل يحقن به الجسم ليكتسب مناعة من المرض (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يُثبت تعدد دلالات «طعم» — المعنى الذوقي مقابل معانٍ أخرى؛ يجب توثيق الفرق دلالياً"

    - lemma: "نَكْهَة"
      confirm:
        - text: "«1- نكهة 2- منكّه: 1- خاصية في المادة تنبه حس الذوق. 2- مادة كيميائية تستخدم لتحسين مذاق طعام أو دواء.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003) — ARABTERM"
        - text: "«نَكْهَة» — translation_en: flavor"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "«نكهة» — translation_en: flavour"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — ARABTERM"
      contradicts:
        - text: "«(النكهة) رَائِحَة الْفَم يُقَال هُوَ طيب النكهة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعنى الأصيل هو رائحة الفم، لا الخاصية الذوقية"
        - text: "«نَكَهَ: النُّونُ وَالْكَافُ وَالْهَاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ نَكْهَةُ الْإِنْسَانِ. وَاسْتَنْكَهْتُهُ: تَشَمَّمْتُ رِيحَ فَمِهِ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل المعجمي يدل على الشمّ لا الذوق"
        - text: "«نَكْهَة، مذاق: خليط من حاستي الطعم والرائحة تستثار من مادة بالفم.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM"
          conflict: "نكهة بمعنى flavour تجمع الذوق والشم معاً، وهذا أوسع من مجرد «taste property»"

    - lemma: "صِفَة ذَوْقِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────
