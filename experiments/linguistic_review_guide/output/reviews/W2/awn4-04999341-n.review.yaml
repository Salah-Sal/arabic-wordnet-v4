        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "طَعْم"
      source: stage1
      decision: confirmed
      decision_reason: >-
        الجذر الفصيح الأصيل للمفهوم المطلوب في العربية؛ عرَّفه دستور العلماء بتعداد
        أنواعه التسعة، وعرَّفه المعجم الوسيط بأنه «مَا تُدْرِكهُ حاسة الذَّوْق» —
        وهو عين تعريف المجموعة. مؤيَّد بمقاييس اللغة وعدد من المعاجم الحديثة.
        لا يصح إبداله بوصف آخر في السياق الاصطلاحي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      term_quality:
        consistency: "راسخ في التراث من عهد الخليل وابن فارس"
        ease_of_use: "أحادي المقطع، أسهل الألفاظ تداولاً"
        appropriateness: "يناسب المفهوم المجرد والمحسوس معاً"
        prefers_heritage: "موثَّق في كتاب العين ومقاييس اللغة"
        prefers_arabic: "عربي أصيل"
        derivability: "يقبل اشتقاقاً واسعاً: طعوم، مَطعَم، طاعم، طَعِيم"
      nuance_differentiation: >-
        يدل على الكيفية الذوقية الثابتة الملازمة للمادة ذاتها (كالحلاوة والمرارة)؛
        أشمل دلالةً وأقدم توثيقاً، ويُستعمل للدلالة على جنس الطعوم ومجموع كيفياتها.
