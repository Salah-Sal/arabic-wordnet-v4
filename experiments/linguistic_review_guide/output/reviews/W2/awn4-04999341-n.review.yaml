      decision: confirmed
      decision_reason: >-
        مركب وصفي صحيح البنية (خاصية + نسبة إلى الذوق)، منسجم مع المصطلحية العلمية
        العربية الحديثة ومع هوية المجموعة الترادفية التصنيفية. يحتاج إلى إضافة تشكيل
        كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        مصطلح مركب يُصنِّف الظاهرة ضمن الخصائص الذوقية تصنيفاً علمياً صريحاً؛
        يُستخدم بصفة رئيسية في السياقات الموسوعية والتقنية التصنيفية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاصِّيَّة ذَوْقِيَّة"

    - lemma: "مَذَاق"
      source: stage1
      decision: confirmed
      decision_reason: >-
        مصدر ميمي فصيح على وزن مَفْعَل من الجذر (ذوق)، مدعوم بأدلة معجمية قوية من
        المعجم الوسيط والمعجم الكبير وطائفة من المعاجم التقنية الموحدة. يُقابَل
        بـ«taste» في اصطلاح متعدد التخصصات. اجتاز اختبار السكّ: لا يصح إبدال «مَذَاق»
        بوصف حرّ آخر مع الحفاظ على وحدة المصطلح.
      evidence_assessment:
