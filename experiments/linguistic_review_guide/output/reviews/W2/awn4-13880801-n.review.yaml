# مراجعة المجموعة الترادفية awn4-13880801-n
# علاقة تعارض مباشر — a relation of direct opposition
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «عَكْس» في المعاجم يدل أصالةً على القلب والرد لا على علاقة التعارض ذاتها، فهو أقرب إلى الفعل أو الحدث منه إلى العلاقة المجردة"
      - "لفظ «نَقِيض» صفة بمعنى المخالف (فعيل بمعنى مفعول/فاعل)، وهو يدل على الطرف المقابل لا على العلاقة بين الطرفين"
      - "المجموعة تحتاج لمّةً تدل على العلاقة ذاتها (المصدر أو الاسم المجرد) لا على أحد طرفيها"
    observations: "المفهوم المستهدف هو «العلاقة» القائمة بين شيئين متعارضين تعارضاً مباشراً، وهو فرع من التضاد/التعارض (awn4-13876846-n). اللمّتان الحاليتان تصلحان للدلالة على المعارض نفسه أو على فعل العكس، لكن التعريف يطلب اسم العلاقة المجردة. مصطلحات المنطق العربي توفر ألفاظاً دقيقة مثل «تقابُل» و«تضادّ» و«تناقُض»، لكن التضاد محجوز للمجموعة الأم، ويبقى التقابل والتناقض مرشحَيْن قويَّيْن."

  blind_candidates:
    - lemma: "تَقَابُل"
      generation_method: ishtiqaq
      justification: "مصدر «تقابَلَ» على وزن تَفَاعُل من جذر ق-ب-ل، يدل في المنطق واللسانيات على علاقة التعارض بين طرفين، وهو أقرب المصادر العربية لمفهوم opposition المباشر"
    - lemma: "مُعَاكَسَة"
      generation_method: ishtiqaq
      justification: "مصدر «عاكَسَ» على وزن مُفَاعَلَة من جذر ع-ك-س، يدل على فعل المعارضة المتبادلة بين طرفين، فيصلح اسماً للعلاقة"
    - lemma: "ضِدِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «ضِدّ» بإضافة ياء النسب وتاء التأنيث، يدل على صفة كون الشيء ضداً لغيره أي علاقة التعارض المباشر ذاتها"
    - lemma: "تَنَاقُض"
      generation_method: ishtiqaq
      justification: "مصدر «تناقَضَ» على وزن تَفَاعُل من جذر ن-ق-ض، مصطلح منطقي راسخ يدل على تمانع القضيتين بالإيجاب والسلب، لكنه أخصّ من المطلوب لأنه يقتضي عدم إمكان الاجتماع والارتفاع معاً"


stage2_evidence:
  per_lemma:
    - lemma: "عَكْس"
      confirm:
        - text: "«العَكْس (في المنطق): تبديلٌ في طرفي القضية لتنشأ قضية أخرى مساوية للأولى في الصدق»"
          source: "المعجم الوسيط"
        - text: "«العكس: رد الشيء إلى سننه أي طريقه الأول كعكس المرآة إذا ردت بصرك بصفائها إلى وجهك»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«العَكْس، كالضَّرْبِ: قَلْبُ الكلامِ ونحوِهِ، ورَدُّ آخِرِ الشيءِ إلى أولِهِ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الدلالة الأصلية هي القلب والرد (حدث) لا العلاقة المجردة بين طرفين متعارضين"
      expands:
        - text: "«في عرف الفقهاء: تعليق نقيض الحكم المذكور بنقيض علته المذكورة ردّاً إلى أصل آخر... وعكسه ما لم يلزم بالنذر لم يلزم بالشروع فيكون على هذا ضد الطرد»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "في الأصول والفقه: العكس مصطلح تقني يعني إثبات نقيض الحكم بنقيض العلة، وهو ضد الطرد"

    - lemma: "نَقِيض"
      confirm:
        - text: "«النَّقيض: المُخالِف. يقال: فلان نقيضك وهذا القول نقيض ذاك»"
          source: "المعجم الوسيط"
        - text: "«النقيضان الأمران المتمانعان بالذات أي الأمران اللذان يتمانعان ويتدافعان بحيث يقتضي لذاته تحقّق أحدهما في نفس الأمر انتفاء الآخر»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«النقيض: نقيض كل شيء رفعُه، والنقيضان الأمران المتمانعان بالذات بحيث لا يمكن اجتماعهما بوجه كالإيجاب والسَّلب»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "النقيض يدل على الطرف المقابل (الذات) لا على العلاقة بين الطرفين، والمجموعة تطلب اسم العلاقة"

    - lemma: "تَقَابُل"
      source: stage1
      confirm:
        - text: "«تقابل — opposition»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«تقابل — opposition: اختلاف بين وحدتين أو عدة وحدات مميزة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«تقابل القضايا — opposition of propositions»"
          source: "مسرد الفلسفة وعلم النفس"
      expands:
        - text: "«تقابل سالب — Privative opposition: تقابل بين لفظين، يتميز أحدهما بوجود سمة مميزة تدعى علامة لا توجد في الآخر»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "للتقابل أنواع فرعية مصطلحية راسخة (سالب، تناسبي، ثنائي) مما يؤكد ثبوته مصطلحاً للعلاقة"

    - lemma: "مُعَاكَسَة"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "ضِدِّيَّة"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "تَنَاقُض"
      source: stage1
      confirm:
        - text: "«التَّنَاقُضُ: اخْتِلَاف قضيتين بالسلب والإيجاب بِحَيْثُ يَقْتَضِي لذاته أَن تكون إِحْدَاهمَا صَادِقَة وَالْأُخْرَى كَاذِبَة»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«التناقض: اختلاف قضيتين بإيجاب وسلب بحيث يقتضي لذاته صدق أحدهما وكذب الأخرى... وفي كلامه تناقض إذا كان بعضه يقتضي إبطال بعض»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«وعند المنطقيين يطلق على تناقض المفردات وتناقض القضايا... فتناقض القضيتين اختلافهما بالايجاب والسلب بحيث يقتضي لذاته صدق إحداهما وكذب الأخرى»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التناقض يقتضي استحالة الاجتماع والارتفاع معاً (contradiction)، وهو أخصّ من المطلوب الذي هو التعارض المباشر (contrariety) حيث يمتنع الاجتماع لا الارتفاع"


