      decision_reason: "مصطلح مسجّل في المعجم الموحّد لمصطلحات تقانات الأغذية بتعريف واضح (1% سكر ذائب). وإن كان المقابل الإنجليزي «brix degree» يشير إلى الوحدة لا النظام، فإنّ الاستعمال الفعلي يتوسّع ليشمل الإشارة إلى النظام كلّه بالتجوّز."
