# مراجعة المجموعة الترادفية — awn4-13631289-n
# Brix scale — نظام لقياس تركيز محاليل السكر
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مقياس بركس» مركّب إضافي يجمع بين كلمة عربية ولفظ معرّب، وقد يُفضّل صيغة مشكّلة أو بديل أدقّ"
      - "لا يوجد سوى لمّة واحدة للمجموعة، ممّا يُضعف التغطية المعجمية"
      - "المفهوم تقنيّ متخصّص في صناعة الأغذية والزراعة، والمصطلح العربي غير شائع في المعاجم التراثية"
    observations: "المجموعة تصف نظام قياس علميًّا منسوبًا إلى العالم الألماني أدولف بركس (Adolf Brix)، يُستخدم لتحديد نسبة السكر في المحاليل بوحدة الدرجة. المفهوم حديث مرتبط بعلم تقانة الأغذية والكيمياء التحليلية. الاسم المنسوب إلى مبتكره لا بديل عربيًّا صرفًا له، لكن يمكن توليد مركّبات إضافية أو استخدام التعريب المباشر."
  blind_candidates:
    - lemma: "سُلَّمُ بِرِكْس"
      generation_method: tarkib
      justification: "مركّب إضافي من «سُلَّم» (الذي يُستعمل بمعنى scale/échelle في المعاجم الموحّدة) و«بركس» المعرَّب. يوافق المقابل الإنجليزي Brix scale حرفيًّا مع لفظ عربي أصيل للمكوّن الأول"
    - lemma: "دَرَجَةُ بِرِكْس"
      generation_method: tarkib
      justification: "مركّب إضافي مسجّل في المعجم الموحّد لمصطلحات تقانات الأغذية (2004) بمعنى 1% سكر ذائب، يُستعمل للإشارة إلى وحدة القياس وبالتوسّع إلى النظام نفسه"
    - lemma: "مِقْيَاسُ السُّكَّرِ"
      generation_method: tarkib
      justification: "مركّب إضافي مسجّل في عدّة معاجم موحّدة (الصيدلة، الطبّ، تقانات الأغذية) بمعنى جهاز قياس نسبة السكر في المحاليل (saccharometer). قريب دلاليًّا وإن كان أعمّ"
    - lemma: "بِرِكْس"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الأجنبي Brix، مسجّل في المكنز الزراعي متعدّد اللغات (AGROVOC). يقبل لام التعريف (البِرِكْس) والنسبة (بِرِكْسِيّ)"

stage2_evidence:
