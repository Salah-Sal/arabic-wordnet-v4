      confirm:
        - text: "«درجة بْرِكْس — 1% سكر ذائب»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«translation_en: brix degree»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "يؤكّد أنّ المصطلح مقابل لـ brix degree وليس brix scale تحديدًا، فهو وحدة القياس لا النظام بأكمله"

    - lemma: "مِقْيَاسُ السُّكَّرِ"
      confirm:
        - text: "«جهاز لقياس كمية السكر في محلول ما»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«جهاز قياس نسبة السكر في المحاليل (انظر: saccharimeter)»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      contradicts:
        - text: "«مِقْياسُ السُّكَّر — saccharometer / saccharimeter / saccharascope»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "مقياس السكر في المعاجم الطبية والصيدلية يُقابل saccharometer (جهاز قياس) لا Brix scale (نظام قياس)؛ فالعلاقة بينهما عموم وخصوص"

    - lemma: "بِرِكْس"
      confirm:
        - text: "«بركس — translation_en: brix — domain: AGROVOC»"
          source: "المَكنَز الزراعي متعدد اللغات"
      expands:
        - text: "«بَرْكَسَ الشيءَ: جمَعَه، يمانِيّة. والبِرْكاسُ، بالكسْرِ: القطعَةُ المُجتمعَةُ من ورَقِ الشَّجَرِ»"
          source: "تاج العروس لمرتضى الزبيدي"
          addition: "جذر «بركس» العربي القديم بمعنى الجمع لا علاقة له بالمصطلح العلمي المعرَّب؛ هذا توافق لفظي فقط"

