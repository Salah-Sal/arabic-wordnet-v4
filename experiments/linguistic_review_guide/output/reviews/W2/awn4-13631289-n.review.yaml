      decision_reason: "لم يُعثر على أيّ دليل معجمي لهذا المركّب. ومع أنّ «سُلَّم» يُستعمل بمعنى scale في بعض المعاجم الموحّدة، فإنّ «مقياس» هو الأثبت والأشيع في سياق أنظمة القياس العلمية. إضافته تُحدث ازدواجًا بلا فائدة."

    - lemma: "مِقْيَاسُ السُّكَّرِ"
