    - lemma: "السمة الأيسلندية"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "الطابع الأيسلندي"
      decision: confirmed
      decision_reason: "اللمّة موجودة وتحمل دلالة مقبولة (الطابع = الطبيعة والسجية والعلامة المميزة)، وهي مدعومة بتعريفات معجمية وافية لكلٍّ من مكوّنيها. رغم أنها مركب وصفي حر (يمكن إبدال النسبة)، فإن استخدامها في السياق الموسوعي والأدبي العربي راسخ، وتعبّر عن دلالة المجموعة بصورة صحيحة. تحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركِّز على الطابع والسجية الثقافية الموروثة والعلامة المميزة للأيسلنديين كخصوصية جماعية راسخة، بتلميح إلى البُعد الثقافي والوجداني أكثر من مجرد الانتساب الاسمي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطَّابَعُ الأَيْسَلَنْدِيُّ"

    - lemma: "الأيسلندية"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي قياسي من النسبة (أيسلندي) على الوزن المعيار لتجريد صفة الانتساب؛ الوزن منتج بشكل واسع في العربية المعاصرة (الفرنسية، الألمانية، الإنجليزية، اليابانية، الكورية). المدخل في المورد الحديث يُثبت استخدام 'إيسلندي' للغة، ومن ثَمَّ يكون المصدر الصناعي هو الأنسب للخاصية المجردة. الصيغة المُفردة أعلى إيجازاً واستيعاباً من المركب الوصفي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبِّر عن الخاصية المجردة للانتساب إلى أيسلندا بصيغة مصدرية صناعية مُوجزة ومُحايدة، مع ملاحظة أن هذا الشكل ذاته يُستخدم اسماً للغة الأيسلندية في بعض السياقات."
      actions:
        - command: create_entry
          params:
            lemma: "الأَيْسَلَنْدِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "الهوية الأيسلندية"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي. المركب لا يجتاز اختبار التثبيت: يمكن إبدال 'الأيسلندية' بأي نسبة أخرى ('الهوية الفرنسية') ويبقى التعبير وصفاً صحيحاً، وبالتالي فهو ليس وحدة اصطلاحية مسكوكة. كما أن 'الهوية' تحمل بُعداً وجودياً أشمل مما يُريده المفهوم."

    - lemma: "السمة الأيسلندية"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية. يفشل اختبار التثبيت (تعبير حر تام التركيب). 'السمة' لفظة جيدة لكن في هذا التركيب لا ترقى إلى مصطلح معجمي مسكوك."


