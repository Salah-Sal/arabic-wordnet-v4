# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'الطابع الأيسلندي' مركّب وصفي حر: يمكن إبدال 'الأيسلندي' بأي نسبة أخرى ('الطابع الدنماركي'، 'الطابع النرويجي') فيظل وصفاً صحيحاً، مما يعني عدم التثبيت المعجمي كوحدة اصطلاحية مسكوكة."
      - "غياب التشكيل الكامل عن اللمّة الموجودة."
      - "ILI = null: المجموعة غير مرتبطة بالشبكة الدلالية العالمية (OEWN/PWN)، مما يُضعف موثوقية الحدود الدلالية."
      - "التعريف الحالي ترجمة حرفية من الإنجليزية ('the state or quality of being Icelandic') ولا يلتزم أسلوب المعجم الوسيط في الجنس والفصل."
    observations: "المجموعة تمثّل المفهوم المجرد لخاصية الانتساب إلى أيسلندا — مفهوم طارئ على التراث المعجمي العربي الكلاسيكي. القياس الصرفي يُوجب المصدر الصناعي (أيسلندية) من النسبة (أيسلندي) على غرار: الفرنسية، الألمانية، الأسترالية. أما المركب الوصفي (طابع + نسبة) فيعبّر عن الخلق والسجية المميزة، وهو أسلوب صحيح لكنه أوسع دلالةً من مجرد الانتساب؛ وعلى كلٍّ فهو مركّب حر لا مصطلح مسكوك. الأنسب معجمياً: المصدر الصناعي المُفرد."

  blind_candidates:
    - lemma: "الأَيْسَلَنْدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من النسبة أيسلندي بإضافة تاء التأنيث المربوطة؛ وهو الوزن المعيار في العربية المعاصرة للتعبير عن خاصية الانتساب إلى الجنسيات والأمم (الفرنسية، الإنجليزية، الألمانية، اليابانية). يجمع التعريف والتأنيث والتجريد في صيغة مُوجزة."
    - lemma: "الطَّابَعُ الأَيْسَلَنْدِيُّ"
      generation_method: tarkib
      justification: "تركيب وصفي (إضافي-وصفي): الطَّابَع بمعنى الطبيعة والسجية والخلق الغالب (المعجم الوسيط) + نسبة أيسلندي؛ يُعبِّر عن مجموع الصفات الموروثة والخصوصية الثقافية التي تُمَيِّز ما هو أيسلندي."
    - lemma: "الهُوِيَّةُ الأَيْسَلَنْدِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي: الهوية (الجوهر الذاتي والخصوصية المميزة) + نسبة؛ يُركِّز على البعد الوجودي والانتمائي لمفهوم 'كون الشيء أيسلندياً'."
    - lemma: "السِّمَةُ الأَيْسَلَنْدِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي: السمة (العلامة المميزة والخاصية الفارقة في الاستعمال العربي الحديث) + نسبة؛ يُعبِّر عن الخاصية الدالة على التميز الأيسلندي."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   ١. مطابقة دفعية: الطابع الأيسلندي + جميع المرشحات (entries + entries_norm)
#   ٢. جسر إنجليزي: Icelandic / Iceland / icelandic quality / icelandic character
#   ٣. FTS عربي: أيسلندي / أيسلندية / أيسلندا
#   ٤. مقاييس اللغة لجذر طبع (dictionary_id=151)
