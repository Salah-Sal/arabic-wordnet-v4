          source: "المعجم الكبير (ocr)"
        - text: "«الطابَع: الطبيعة»"
          source: "المعجم الوسيط (ocr)"
        - text: "«(الطابع) الطابع والطبيعة يُقال له طابع حسن»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«(1) إيسلندي (2) اللغة الإيسلندية»"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«الطَّابِعُ: العَلَامَةُ الْمُمَيِّزَةُ»"
          source: "المعجم الكبير (ocr)"
          addition: "يُعزِّز دلالة التمييز والخصوصية التي يحملها المركب 'الطابع الأيسلندي'"
        - text: "«أيسلندا: هضبة يبلغ متوسط ارتفاعها نحو ألفي قدم... عَمَرها النرويجيون والدانمركيون منذ القرن التاسع الميلادي، وأصبحت مملكة مستقلة...»"
          source: "المعجم الكبير (ocr)"
          addition: "يُثبت وجود مدخل موسوعي لأيسلندا في المعجمية العربية الحديثة"

    - lemma: "الأيسلندية"
      expands:
        - text: "«(1) إيسلندي (2) اللغة الإيسلندية»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يُثبت أن الشكل الأساسي للنسبة في العربية المعاصرة هو إيسلندي/أيسلندي، ومن ثَمَّ فالمصدر الصناعي الطبيعي هو الأيسلندية"

    - lemma: "الهوية الأيسلندية"
