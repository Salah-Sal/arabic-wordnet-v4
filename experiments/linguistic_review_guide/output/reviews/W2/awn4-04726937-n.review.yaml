# المفهوم: navigability — صلاحية الملاحة
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'صلاحية الملاحة' خالية من التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط لمفهوم له وجود في المعجمية التقنية العربية"
      - "التعريف الحالي 'صفة الملاءمة' يجمع بين كلمتي صفة وملاءمة بصورة فيها بعض الإطناب؛ إذ ملاءمة نفسها تعبير عن صفة"
      - "المجموعة لا تُغطّي الدلالة الجوية (airworthiness) بوضوح"
    observations: >
      المجموعة awn4-04726937-n تمثّل مفهوم "navigability" بمعنى الخاصية التي تجعل
      مجرىً مائياً أو مساراً جوياً صالحاً لعبور السفن أو الطائرات. هذا المفهوم
      ذو امتداد في المعجمية التقنية العربية الحديثة، وإن ظلّ المصطلح الغالب
      عبارةً مركبة إضافية لا كلمةً مفردة. اللمّة الموجودة "صلاحية الملاحة"
      دقيقة وشائعة في المعجمية التقنية، غير أنّها تحتاج إلى تشكيل كامل وتحقّق
      من وجود مرادفات متداولة قد تُثري المجموعة.
  blind_candidates:
    - lemma: "مَلاحِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الصفة النسبية "مَلاحِيّ" (= المتعلق بالملاحة) بإضافة
        التاء المربوطة لتحويلها إلى مصدر صناعي يدلّ على الخاصية. قياساً
        على: دوليّة، إقليميّة، عسكريّة. الجذر: م ل ح. الوزن: فَعَالِيَّة
        بعد الحذف. يُعبِّر بإيجاز شديد عن "كون الشيء ملاحياً".
    - lemma: "صَلوحِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر ص ل ح على وزن فَعُولِيَّة الدالّ على الخاصية الراسخة
        في الموصوف، قياساً على: قَبُولِيَّة، حَيُولِيَّة، دُخُولِيَّة. يُفيد
        هذا البناء في التعبير عن خاصية ذاتية كامنة في الشيء، أشدّ تعبيراً
        عن الكيفية الجوهرية من "صلاحية" التي تعني كذلك السلطة والصلاحيات
        الإدارية، فيُجنَّب بذلك الاشتراك اللفظي.
    - lemma: "إِمْكَانِيَّةُ الملاحةِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من "إمكانية" (= قابلية التحقق) و"ملاحة" (= navigation).
        يُعبِّر عن navigability من زاوية الإمكان والقابلية للتحقق، وهو شائع
        في الصياغة التقنية العربية الحديثة في مجال البحريات والملاحة الجوية.
        نوع المركب: إضافي (idafi).
    - lemma: "صَلاحِيَّةُ الإِبْحَارِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من "صَلاحِيَّة" (= fitness/suitability) و"إبحار" (= sailing/navigation).
        يُركِّز على الصلاحية التقنية للإبحار تحديداً، ويوازي تركيبياً
        "صَلاحِيَّةُ الطيران" المستخدمة في الطيران المدني. نوع المركب: إضافي (idafi).


