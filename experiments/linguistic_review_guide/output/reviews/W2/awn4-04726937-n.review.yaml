# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "صلاحية الملاحة"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة في المورد الحديث (2008) بالتقابل المباشر مع "navigability"،
        وفي معجم النقل (2010) بالتركيب الموسَّع "صلاحية الملاحة الجوية = airworthiness".
        المصطلح معجمياً راسخ وسائر في المعجمية التقنية العربية. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تُركِّز على الجانب الرسمي والتقني: الاستيفاء الكامل لمعايير السلامة
        والملاءمة المعتمدة لمرور السفن أو الطائرات. تُستعمَل في السياقات التنظيمية
        والقانونية (شهادات الصلاحية، معايير هيئات الملاحة).
      quality_gate:
        consistency: "مطّرد في المعجمية التقنية البحرية والجوية"
        ease_of_use: "ميسور التداول في المعجمية الرسمية"
        appropriateness: "ملائم — لا غرابة ولا ابتذال"
        heritage_preference: "يستند إلى مادة صلح العربية الأصيلة"
        arabic_preference: "عربي أصيل — جذر صلح ومادة ملح"
        derivability: "قابل للاشتقاق: صالح، صلوح، إصلاح"
      morphological_check: >
        مركب إضافي صحيح: مضاف (صلاحيّة) + مضاف إليه (الملاحة). المضاف على
        وزن فَعَالِيَّة (المصدر الصناعي من صالح)، والمضاف إليه مصدر من الجذر ملح.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَلاحِيَّةُ الملاحةِ"

    - lemma: "مَلاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود الصيغة في موسوعة أسماء العرب، فإنّها مُقيَّدة هناك بكونها اسم
        علم (نسبة إلى مَلَاحَة = ملجأ الملح أو اسم مكان)، لا مصطلحاً للخاصية
        المجردة "navigability". لا يوجد في المصادر التقنية استخدامٌ لـ"مَلاحِيَّة"
        بمعنى "صلاحية الملاحة". فضلاً عن ذلك، "مَلاحَة" الحديثة تعني navigation
        نفسها لا الخاصية المجردة، فيبقى "مَلاحِيَّة" مُشتركاً محتملاً مع معاني
        الجمال (المَلاحة = الحسن) ومواضع الملح. حذفه تجنُّباً للبس.
      evidence_assessment:
        case: mixed

    - lemma: "صَلوحِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلّة معجمية على استخدام "صَلوحِيَّة" في أي من المصادر المستعلَمة.
        الوزن فَعُولِيَّة قياسيٌّ لكنه غير مسكوك لهذه المادة في المعجمية
        التقنية أو الكلاسيكية. يفتقر إلى شرط التثبيت المعجمي.
      evidence_assessment:
        case: no_material

    - lemma: "إِمْكَانِيَّةُ الملاحةِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَّت مباشرةً في المعجم الموحد لمصطلحات علوم البحار (2000) بالتقابل
        "إمكانية الملاحة = navigability". يُعدّ مرادفاً تقنياً مستخدَماً في
        المعجمية البحرية العربية. يُتيح التمييز الدلالي بين "الصلاحية" الرسمية
        و"الإمكانية" العملية، مما يُثري المجموعة الترادفية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تُركِّز على بُعد الإمكان والقابلية الفعلية للتحقق: هل الظروف والشروط
        تُتيح عملياً مرور السفن أو الطائرات؟ تُستعمَل في السياقات الوصفية
        والدراسات التقنية (تقييم إمكانية الملاحة في مجرى مائي معيّن)، بخلاف
        "صلاحية الملاحة" ذات الطابع التنظيمي الرسمي.
      quality_gate:
        consistency: "مطّرد في معجمية علوم البحار"
        ease_of_use: "ميسور في الخطاب التقني والعلمي"
        appropriateness: "ملائم — غير غريب ولا عامّي"
        heritage_preference: "إمكانية من مادة مكن العربية الأصيلة"
        arabic_preference: "عربي — جذرا مكن وملح"
        derivability: "قابل للتصرف: ممكن، إمكان، تمكين"
      morphological_check: >
        مركب إضافي صحيح: مضاف (إمكانية على وزن إفعالية) + مضاف إليه (الملاحة).
        الوزن إفعالية مصدر صناعي من أمكن/إمكان، وهو قياسي في المصطلحية الحديثة.
      actions:
        - command: create_entry
          params:
            lemma: "إِمْكَانِيَّةُ الملاحةِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04726937-n"

    - lemma: "صَلاحِيَّةُ الإِبْحَارِ"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح موجود في المعجمية التقنية لكنه مقيَّد بمعنى أخصّ هو seaworthiness
        (= صلاحية السفينة للإبحار)، وهو مفهوم مختلف عن navigability العامة. يُقتصر
        استخدامه في عبارات كـ"شهادة صلاحية السفينة للإبحار". إدراجه في هذه المجموعة
        سيُخلّ بالدقة الدلالية.
      evidence_assessment:
        case: mixed


