stage1_review:
  assessment:
    concerns:
      - "لفظة «طَلَب» عامة جداً تشمل كل ابتغاء ولا تختص بالرسالة الرسمية المقدَّمة إلى سلطة"
      - "التعريف العربي ترجمة حرفية للإنجليزي ويحتاج صياغة معجمية عربية أصيلة"
      - "المجموعة تفتقر إلى لفظة «عَرِيضَة» وهي أدقّ مقابل للمفهوم في الاستعمال القانوني والإداري المعاصر"
    observations: "المجموعة تعبّر عن مفهوم الرسالة الرسمية التي تُرفع إلى جهة ذات سلطة طلباً لأمر ما. الالتماس في أصل الوضع اللغوي يدلّ على الطلب بين متساويين في الرتبة، لكنه تطوّر في العرف الحديث إلى الدلالة على الطلب المتواضع المرفوع إلى سلطة، ولا سيما في الاستعمال القانوني (التماس إعادة النظر). أمّا طَلَب فعامّ لا يقتصر على الرسمي. المجموعة تحتاج إثراء بلفظة عريضة."

  blind_candidates:
    - lemma: "عَرِيضَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر ع-ر-ض على وزن فَعِيلَة، تدلّ في الاستعمال المعاصر على الصحيفة التي تُعرض فيها حاجة إلى سلطة قضائية أو إدارية"
    - lemma: "رَفِيعَة"
      generation_method: majaz
      justification: "من رَفَعَ القصة إلى العامل، أي بلّغها؛ مصطلح تراثي ورد في التاج والمصباح بمعنى القضية التي تُرفع إلى ذي سلطة"
    - lemma: "اسْتِدْعَاء"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر د-ع-و على وزن اسْتِفْعَال، تدلّ على طلب رسمي يُوجَّه إلى جهة رسمية"
    - lemma: "مَطْلَب"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر ط-ل-ب على وزن مَفْعَل بمعنى ما يُطلب، وتُستعمل في سياق المطالب الرسمية"


stage2_evidence:
  per_lemma:
    - lemma: "الْتِمَاس"
      confirm:
        - text: "«الالتماس: هو الطلب مع التساوي بين الآمر والمأمور في الرتبة.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«(الالتماس) الطّلب والتماس إِعَادَة النّظر و (فِي قانون المرافعات) طَرِيق الطعْن فِي الحكم النهائي يرفع إِلَى المحكمة الَّتِي أصدرته لأسباب عَددهَا القانون يطْلب بِهِ إِعَادَة النّظر فِي هَذَا الحكم (مج)»"
          source: "المعجم الوسيط"
        - text: "«عريضة، التماس»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ترجمة request"
      expands:
        - text: "«الالتماس: الطّلب مَعَ التَّسَاوِي بَين الْآمِر والمأمور فِي الرُّتْبَة وَإِن تعارف بَين الْعَوام أَنه طلب الْأَدْنَى من الْأَعْلَى رُتْبَة. وَقَالَ الْعَلامَة التَّفْتَازَانِيّ فِي الْعرف إِنَّمَا يُطلق على مَا يكون مَعَ تواضع»"
          source: "دستور العلماء للأحمدنكري"
          addition: "في أصل الاصطلاح: طلب بين متساويين، لكنه تعارف عند العوام بمعنى طلب الأدنى من الأعلى مع تواضع"
        - text: "«الالتماس لغة طلب الفعل مع التساوي، وأمّا عرفا فيطلق على ما يكون مع نوع تواضع، كما في البديع الميزان»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تمييز بين المعنى اللغوي (تساوٍ) والعرفي (تواضع)"

    - lemma: "طَلَب"
      confirm:
        - text: "«الطلب: الفحص عن وجود الشيء عينا أو معنى.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«طَلَبٌ — request — demande»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      expands:
        - text: "«الطّلب لغة محبّة حصول الشيء على وجه يقتضي السّعي في تحصيله... وإن كان بطريق التّساوي فالتماس... الدعاء والالتماس من أقسام الطلب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "الطلب جنس أعلى يشمل الأمر والدعاء والالتماس والنداء والتمنّي — أعمّ من المفهوم المقصود"

    - lemma: "عَرِيضَة"
      confirm:
        - text: "«(العريضة) الصَّحِيفَة تعرض بهَا حَاجَة من الْحَاجَات وعريضة الدَّعْوَى صحيفَة يكْتب الْمُدَّعِي فِيهَا ظلامته إِلَى القَاضِي (محدثة) (ج) عرائض»"
          source: "المعجم الوسيط"
        - text: "«عريضة، التماس»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ترجمة request"
      expands:
        - text: "«يرى بعضهم أن الأفصح أن يقال: رفيعة؛ لأنها وردت في المعاجم القديمة... ولكن الوسيط ذكر كلمة عريضة بالمعنى المذكور، ونصَّ على أنها محدثة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "العريضة محدثة مقبولة لغوياً وإن فضّل بعضهم رفيعة التراثية"

    - lemma: "رَفِيعَة"
      expands:
        - text: "«قَدَّمَ رَفِيعةً إلى القاضي [فصيحة مهملة]... في التاج والمصباح: الرفيعة: القصة يُبلِّغها الرجل، ويرفعها على العامل»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "مصطلح تراثي فصيح لكنه مهمل في الاستعمال المعاصر"

    - lemma: "اسْتِدْعَاء"
      evidence_status: "no_material_found"

    - lemma: "مَطْلَب"
      confirm:
        - text: "«طَلبٌ، مطْلَب — request — demande; recherche»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "«(المطلب) مَوضِع الطّلب وَمَا يطْلب (ج) مطَالب»"
          source: "المعجم الوسيط"
          addition: "يدلّ على موضع الطلب أو ما يُطلب، لا على الوثيقة الرسمية ذاتها"


