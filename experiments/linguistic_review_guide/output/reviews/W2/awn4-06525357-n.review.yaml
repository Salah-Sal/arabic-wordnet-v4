      nuance_differentiation: "يتميّز عن طَلَب بكونه يتضمّن معنى التواضع والرجاء، ويغلب في السياق القانوني (التماس إعادة النظر). وعن عَرِيضَة بكونه يدلّ على فعل الطلب ذاته لا على الوثيقة المكتوبة."
      actions:
        - command: update_lemma
          params:
