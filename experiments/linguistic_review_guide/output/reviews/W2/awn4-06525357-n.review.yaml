      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ لفظة في المجموعة، تشمل كل ابتغاء رسمي أو غير رسمي. تتميّز عن الالتماس بعدم تضمّنها معنى التواضع، وعن العريضة بعدم اقتصارها على الوثيقة المكتوبة."

    - lemma: "عَرِيضَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظة محدثة مقبولة أثبتها المعجم الوسيط ومعجم الصواب اللغوي والمعجم الموحد للقانون. تدلّ تحديداً على الصحيفة المكتوبة التي تُعرض بها حاجة إلى سلطة قضائية أو إدارية — وهي أدقّ مقابل لمفهوم المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تتميّز بالدلالة على الوثيقة المكتوبة تحديداً (الصحيفة)، بخلاف الالتماس الذي يدلّ على فعل الطلب، والطَّلَب العامّ."
      actions:
        - command: create_entry
          params:
            lemma: "عَرِيضَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رَفِيعَة"
      source: stage1
      decision: removed
      decision_reason: "لفظة تراثية فصيحة لكنها مهملة في الاستعمال المعاصر كما نصّ معجم الصواب اللغوي. إدراجها قد يُربك المستخدم لعدم تداولها."

    - lemma: "اسْتِدْعَاء"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلّة معجمية تربطها بمفهوم الطلب الرسمي المقدَّم إلى سلطة. الاستدعاء يُستعمل غالباً بمعنى الاستحضار والاستقدام لا بمعنى تقديم عريضة."

    - lemma: "مَطْلَب"
      source: stage1
      decision: removed
      decision_reason: "يدلّ على ما يُطلب أو موضع الطلب، لا على الرسالة الرسمية ذاتها. يتداخل مع طَلَب دون إضافة فرق دلالي واضح يخصّ المفهوم المقصود."


