# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-14482391-n  |  ili: i112995  |  pos: n
# المفهوم: عِلْمٌ مُطْلَقٌ / كُلِّيَّةُ الْعِلْمِ (Omniscience)
# ═══════════════════════════════════════════════════════════════

# ══ المرحلة ١: المراجعة والتوليد ═══════════════════════════════
stage1_review:
  assessment:
    concerns:
      - "لمّة «إحاطة بكل شيء» عبارةٌ وصفية حرّة لا مصطلحٌ مسكوك؛ تفشل اختبار التثبيت المعجمي (يمكن إبدال «إحاطة» بـ«معرفة» أو «علم» ويبقى الوصف صالحاً)"
      - "كلتا اللمّتين الموجودتين خاليتان من التشكيل الكامل الإلزامي"
      - "المصطلح المعجمي الموثَّق «كُلِّيَّةُ الْعِلْمِ» غائب عن المجموعة رغم توثيقه في المورد الحديث"
      - "التعريف الحالي يتضمن تعريفاً دائرياً جزئياً (حالة العلم بكل شيء ← يعرّف العلم بالعلم)"
    observations: >
      المجموعة تمثّل مفهوماً لاهوتياً-فلسفياً أصيلاً، وهو الصفة الإلهية بالعلم الشامل بكل الموجودات
      والممكنات. هذا المفهوم حاضر في التراث العربي الإسلامي بعبارات قرآنية راسخة كـ«وَأَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا»
      (الطلاق: ١٢)، وفي علم الكلام بالنعت «عليم» وفي الفلسفة الإسلامية بـ«كلي العلم» و«كلية العلم».
      اللمّة «إحاطة بكل شيء» وإن اتّكأت على الجذر القرآني فهي عبارة وصفية لا اسم عَلَم على المفهوم.
      أما «علم مطلق» فأقرب إلى المصطلح المسكوك لكنه يحتاج تشكيلاً.

  blind_candidates:
    - lemma: "الإِحَاطَةُ الْعِلْمِيَّةُ"
      generation_method: majaz
      justification: >
        مجاز من الإحاطة المكانية (السور يحيط بالشيء) إلى الإحاطة المعرفية؛ الجذر القرآني
        «أَحَاطَ» في «وَأَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا» يجعل هذا التركيب الوصفي إحياءً
        للفظ قرآني أصيل. «الإحاطة» لفظ ميّت في الاستعمال الوصفي المباشر للمفهوم، فإحياؤه
        يتجنّب الاشتراك اللفظي.

    - lemma: "كُلِّيَّةُ الْعِلْمِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «كُلِّيَّة» (المصدر الصناعي من «كل»، يفيد التمامَ والشمولَ) مضافاً
        إلى «الْعِلْم». يُعبّر عن «كون العلم كلياً شاملاً» بصورة مباشرة. نوع التركيب:
        إضافي (idafi). يقبل لام التعريف والنسبة والجمع.

    - lemma: "الشُّمُولُ الْعِلْمِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «الشُّمُول» (الاشتمال على الكل وعمومه) مع النعت «الْعِلْمِيّ».
        يعتمد على دلالة «شَمِلَهم الأمرُ» أي عمّهم، فيكون المعنى: العموم المعرفي الذي
        يشمل جميع المعلومات.

    - lemma: "الاكتِنَاهُ"
      generation_method: majaz
      justification: >
        إحياء للفظ «اكتنه» من جذر «كنه» بمعنى بلوغ كُنه الشيء وحقيقته. المجاز: من
        «إدراك عُمق شيء واحد» إلى «إدراك عُمق كل الأشياء في آنٍ واحد»، وهو حالة
        الإحاطة الكلية. الوزن: اِفْتِعَال — يناسب المعنى الدلالي للاكتساب والبلوغ.


# ══ المرحلة ٢: جمع الأدلة ════════════════════════════════════
stage2_evidence:
  per_lemma:

    - lemma: "إحاطة بكل شيء"
      evidence_status: "no_material_found"

    - lemma: "علم مطلق"
      expands:
        - text: >
            «(1) «أ», العِلْم الكُلّي؛ كُلّيَّة العِلْم: «ب» العلم بكل شيء. «ج» معرفة غير محدودة
            (2) cap.: الله.»
          source: "المورد الحديث (2008) — ترجمة «omniscience»"
          addition: >
            يؤكد أن «العلم بكل شيء» و«المعرفة غير المحدودة» مرادفان لـomniscience؛ غير
            أن المعجم يُفضّل «العلم الكلي / كلية العلم» على سواهما.

    - lemma: "الإِحَاطَةُ الْعِلْمِيَّةُ"
      evidence_status: "no_material_found"

    - lemma: "كُلِّيَّةُ الْعِلْمِ"
      confirm:
        - text: >
            «(1) «أ», العِلْم الكُلّي؛ كُلّيَّة العِلْم: «ب» العلم بكل شيء.
            «ج» معرفة غير محدودة. (2) cap.: الله.»
          source: "المورد الحديث (2008) — entry_id: 704502 — ترجمة «omniscience»"

    - lemma: "الشُّمُولُ الْعِلْمِيُّ"
      contradicts:
        - text: "«(الشُّمُول) ريح الشمَال وَالْخمر»"
          source: "المعجم الوسيط — entry_id: 876288"
          conflict: >
            «الشمول» في المعاجم العربية الكلاسيكية والحديثة = الخمر أو ريح الشمال؛
            ليس له دلالة المعرفة الكلية. الاستعمال المعاصر لـ«الشمول» (comprehensiveness)
            دخيل على المعجم ولم يُثبَّت بعد.
        - text: "«ريحُ الشَّمالِ الخَمْرُ وقيل: الخَمْرُ الباردَةُ»"
          source: "المعجم الكبير — entry_id: 53234"
          conflict: "نفس المشكلة — دلالة راسخة بعيدة عن الإحاطة المعرفية"

    - lemma: "الاكتِنَاهُ"
      evidence_status: "no_material_found"


# ══ المرحلة ٣: التحليل اللغوي للمّات ════════════════════════
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──────────────────────────────────────────
    - lemma: "إحاطة بكل شيء"
      decision: removed
      decision_reason: >
        اللمّة عبارة وصفية حرّة لا مصطلحٌ مسكوك؛ تفشل اختبار السكّ: يمكن إبدال
        «إحاطة» بـ«معرفة» أو «علم» ويبقى الوصف صالحاً وصحيحاً. وتفشل اختبار التثبيت
        المعجمي: لا تُسجَّل في أي معجم بهذه الصورة حداً للمفهوم. العبارات الوصفية
        الحرّة غير مقبولة لمّاتٍ في AWN4.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة ٢ ──────────────────────────────────────────
    - lemma: "علم مطلق"
      decision: confirmed
      decision_reason: >
        تركيب إضافي-وصفي ثابت في الكتابة الفلسفية الإسلامية، ويعبّر عن بُعد
        «انعتاق العلم من كل قيد» (من الجذر طلق = التحلّل والإرسال). دلالياً يختلف
        عن «كلية العلم» في أنه يُؤكّد انعدام القيود لا مجرّد الشمول العددي.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز بُعد الإطلاق وعدم التقييد — العلم الحر من كل حدٍّ أو استثناء —
        لا الشمول الكمّي فحسب. يناسب السياق العقدي الكلامي (الصفات السلبية والثبوتية).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عِلْمٌ مُطْلَقٌ"

    # ── مرشح المرحلة ١ — أ ─────────────────────────────────────
    - lemma: "الإِحَاطَةُ الْعِلْمِيَّةُ"
      source: stage1
      decision: confirmed
      decision_reason: >
        تركيب وصفي محكم، جذره قرآني راسخ: «وَأَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا» (الطلاق: ١٢).
        يُعدّ من التعبيرات التقنية الراسخة في علم الكلام الإسلامي، ويُجمع على «إحاطات
        علمية». وإن لم يُعثر له على مدخل معجمي مستقل في قاعدة البيانات فإن قيمته
        المصطلحية مستمدّة من الاستعمال القرآني الراسخ. يختلف عن «كلية العلم» في تأكيد
        البُعد الإحاطي (الدوران والشمول) لا الكلّية العددية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز دلالة الإحاطة المكانية-المجازية (كالسور يحيط بكل شيء) مستعيراً من
        الاستعمال القرآني. الأنسب في السياقات الدينية والتفسيرية.
      actions:
        - command: create_entry
          params:
            lemma: "الإِحَاطَةُ الْعِلْمِيَّةُ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — ب ─────────────────────────────────────
    - lemma: "كُلِّيَّةُ الْعِلْمِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصطلح الأوثق توثيقاً معجمياً: أثبته المورد الحديث (2008) صراحةً ترجمةً
        لـomniscience. تركيب إضافي محكم من «كُلِّيَّة» (مصدر صناعي من «كل»، يفيد التمامَ
        والإطلاقَ) مضافاً إلى «الْعِلْم». يقبل جمع السالم (كليّات العلم) ولام التعريف
        والنسبة (كليّاتي). المصطلح الأرسى في الفلسفة والكلام الحديثَيْن.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الكليّة العددية-الوجودية — أن العلم يشمل كل موجود ومعدوم وممكن.
        المصطلح الأنسب للسياقات الأكاديمية والفلسفية المقارنة. أكثر حيادية دينياً
        من «الإحاطة العلمية» ومن «علم مطلق».
      actions:
        - command: create_entry
          params:
            lemma: "كُلِّيَّةُ الْعِلْمِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — ج ─────────────────────────────────────
    - lemma: "الشُّمُولُ الْعِلْمِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        «الشمول» في المعاجم العربية الكلاسيكية والحديثة (المعجم الوسيط، المعجم الكبير،
        التوقيف للمناوي) يعني الخمر أو ريح الشمال. الدلالة الراسخة تطغى على أي محاولة
        لاستعماله بمعنى الشمولية المعرفية، مما يُفضي إلى اشتراك لفظي مُربك. مرفوض.

    # ── مرشح المرحلة ١ — د ─────────────────────────────────────
    - lemma: "الاكتِنَاهُ"
      source: stage1
      decision: removed
      decision_reason: >
        لا مادة معجمية تدعم هذا الاستعمال. والمجاز مُجهَد: «اكتناه الشيء» = بلوغ
        كُنه شيء واحد بعينه، لا الإحاطة بكل الأشياء. الإزاحة الدلالية من «الواحد»
        إلى «الكل» شرط في المجاز المقبول أن يكون مألوفاً أو قرآنياً، وهذا الاستعمال
        لا يتوفر فيه ذلك. مرفوض.


# ══ المرحلة ٤: التعريف والأمثلة ════════════════════════════
stage4_content:
  definition:
    current: "حالة العلم بكل شيء؛ امتلاك معرفة لا نهائية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يقع في دوران جزئي (يُعرَّف «حالة العلم» دون تمييز جنس قريب واضح)،
        وعبارة «معرفة لا نهائية» أقل دقة من «معرفة شاملة بجميع الموجودات» إذ إن اللانهائية
        وصف كمّي قد يُلبَّس والشمولُ وصفٌ نوعي أدق. يحتاج تعريفاً مصطلحياً بجنس قريب
        وفصل نوعي.
    authored:
      - type: terminological
        text: >
          حَالَةُ الْإِحَاطَةِ الْعِلْمِيَّةِ الْكَامِلَةِ بِجَمِيعِ الْمَعْلُومَاتِ وَالْمَوْجُودَاتِ وَالْمُمْكِنَاتِ،
          بِحَيْثُ لَا يَعْزُبُ عَنِ الْعَالِمِ شَيْءٌ مِنَ الظَّاهِرِ وَالْخَفِيِّ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مِنْ أُمَّهَاتِ الصِّفَاتِ الإِلَهِيَّةِ فِي اللَّاهُوتِ الْمُقَارَنِ، وَتَعْنِي أَنَّ الْعَالِمَ
          يُدْرِكُ كُلَّ شَيْءٍ إِدْرَاكًا تَامًّا مِنْ غَيْرِ غَفْلَةٍ وَلَا نِسْيَانٍ؛ وَهِيَ فِي الْإِسْلَامِ
          مَنُوطَةٌ بِاللهِ وَحْدَهُ، وَتَجَلَّتْ فِي قَوْلِهِ تَعَالَى: ﴿وَأَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا﴾.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            حَالَةُ الْإِحَاطَةِ الْعِلْمِيَّةِ الْكَامِلَةِ بِجَمِيعِ الْمَعْلُومَاتِ وَالْمَوْجُودَاتِ وَالْمُمْكِنَاتِ،
            بِحَيْثُ لَا يَعْزُبُ عَنِ الْعَالِمِ شَيْءٌ مِنَ الظَّاهِرِ وَالْخَفِيِّ.

  examples:
    per_lemma:
      - lemma: "عِلْمٌ مُطْلَقٌ"
        examples:
          - text: "يَنْفَرِدُ اللهُ بِعِلْمٍ مُطْلَقٍ لَا يَشُوبُهُ قُصُورٌ وَلَا غَفْلَةٌ، يُحِيطُ بِالسِّرِّ وَأَخْفَى."
            type: usage

      - lemma: "الإِحَاطَةُ الْعِلْمِيَّةُ"
        examples:
          - text: "تَجَلَّتِ الإِحَاطَةُ الْعِلْمِيَّةُ الإِلَهِيَّةُ فِي قَوْلِهِ تَعَالَى: ﴿وَأَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا﴾."
            type: quran
            source: "سورة الطلاق: ١٢"

      - lemma: "كُلِّيَّةُ الْعِلْمِ"
        examples:
          - text: "تُعَدُّ كُلِّيَّةُ الْعِلْمِ مِنَ الصِّفَاتِ الَّتِي أَجْمَعَ عَلَيْهَا الْمُتَكَلِّمُونَ فِي وَصْفِ الذَّاتِ الإِلَهِيَّةِ."
            type: usage

    actions:
