      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَجَلَّتِ الإِحَاطَةُ الْعِلْمِيَّةُ الإِلَهِيَّةُ فِي قَوْلِهِ تَعَالَى: ﴿وَأَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا﴾."
      - command: add_sense_example
