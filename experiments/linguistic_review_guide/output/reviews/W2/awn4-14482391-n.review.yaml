# ══ المرحلة ٥: الإثراء (البيانات الوصفية) ══════════════════
stage5_enrichment:
  per_entry:
    - lemma: "عِلْمٌ مُطْلَقٌ"
      entry_id: "{auto}"
      roots:
        - word: "علم"
          root: "علم"
          maqayis_quote: >
            «الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى أَثَرٍ
            بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ ... وَالْعِلْمُ: نَقِيضُ الْجَهْلِ»
        - word: "مطلق"
          root: "طلق"
