stage1_review:
  assessment:
    concerns:
      - "اللمّة «لغة تفاهم مشترك» عبارة وصفية حرّة وليست مصطلحاً مسكوكاً؛ يمكن إبدال «تفاهم» بـ«تواصل» أو «اتصال» وتبقى صالحة كوصف."
      - "كلتا اللمّتَيْن الموجودتَيْن تفتقران إلى التشكيل الكامل."
      - "المجموعة تفتقر إلى مصطلحات لسانيّة مسجّلة في المعاجم المتخصّصة مثل «لغة ناقلة» أو «لغة تواصليّة»."
    observations: "المفهوم (لغة مشتركة بين أقوام مختلفي اللسان) مفهوم متأصّل في الثقافة العربية الإسلامية — فالعربيّة ذاتها أدّت هذا الدور قروناً. المصطلح «لغة مشتركة» راسخ في الاستعمال المعجمي والمصطلحي العربي الحديث، لكنّه يحتاج إلى إثراء بمرادفات متخصّصة."

  blind_candidates:
    - lemma: "لُغَة نَاقِلَة"
      generation_method: tarkib
      justification: "مركب وصفي من «لغة» و«ناقلة» (اسم فاعل من نقل)؛ يدلّ على اللغة التي تنقل المعاني بين أقوام مختلفي اللسان، على وزن فَاعِلَة الدالّ على الفعل المستمرّ."
    - lemma: "لُغَة تَوَاصُلِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «لغة» و«تواصليّة» (نسبة إلى التواصل)؛ يُبرز وظيفة التواصل بين الجماعات اللغوية المختلفة."
    - lemma: "لِسَان مُشْتَرَك"
      generation_method: tarkib
      justification: "مركب وصفي من «لسان» (مرادف لغة في العربية الكلاسيكية) و«مشترك»؛ ورد في المورد الحديث ضمن تعريف lingua franca."
    - lemma: "لُغَة بَيْنِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «لغة» و«بينيّة» (نسبة إلى بَيْن)؛ يقابل المصطلح الإنجليزي interlanguage بترجمة دلالية."

stage2_evidence:
  per_lemma:
    - lemma: "لُغَة مُشْتَرَكَة"
      confirm:
        - text: "«لغة أو لهجة مشتركة بين سكان منطقة شاسعة، أو هي اللغة التي تسود خارج منطقتها الأصلية.»"
          source: "مسرد الإعلام والتواصل (ALECSO) — koine"
        - text: "«أية لغة مشتركة مولدة من عدة لهجات تستخدمها جماعات وسيلة للتفاهم المتبادل بينها بسبب الاختلاف بين لغات هذه الجماعات.»"
          source: "مسرد الإعلام والتواصل (ALECSO) — lingua franca"
        - text: "«لغة الكلام والكتابة في بلدان البحر البيض المتوسط الشرقية في الحقبتين الهيلينية والرومانية والتي كانت آنذاك اللغة اليونانية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — Koine"
      expands:
        - text: "«اللغة الفَرَنكيّة أو المشتركة: «أ» لغة مشتركة قوامها الإيطاليّة ممزوجةً بالفرنسيّة والإسبانيّة واليونانيّة والعربيّة [يُتكلّم بها في موانئ البحر الأبيض المتوسط]. «ب» إحدى اللغات المستخدمة كلسان مشترك أو تجاريّ بين أقوام مختلفي اللغة.»"
          source: "المورد الحديث (2008) — lingua franca"
          addition: "يربط المصطلح بأصله التاريخي (اللغة الفرنكية) ويوسّع الاستعمال ليشمل أيّ لغة وسيطة تجارية."

    - lemma: "لُغَة تَفَاهُم مُشْتَرَك"
      evidence_status: "no_material_found"

    - lemma: "لُغَة نَاقِلَة"
      confirm:
        - text: "«لغة تُستخدَم في تواصل عدة شعوب ذات لغات أُمّ مختلفة.»"
          source: "مسرد الإعلام والتواصل (ALECSO) — vehicular language"
        - text: "«لغة فوق محلية تستخدم في تواصل عدة شعوب ذات لغات أم مختلفة، مثال: السواحلية لغة البانتوي المستعملة في إفريقيا الشرقية وفي شرق الكونجو الديموقراطية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — Vehicular language"

    - lemma: "لُغَة تَوَاصُلِيَّة"
      confirm:
        - text: "«لغة خليط مكونة من مفردات إيطالية ورومانية كانت تستعمل في الموانئ المتوسطية إلى غاية القرن التاسع عشر.-2-نسق لغوي ذو قواعد تأليف ومفردات معجمية ناتجة عن لغات متمازجة بين عشيرتين لغويتين أو أكثر، وليس لهم أي وسيلة اتصال إلا هذه اللغة المختلطة.-3-كل لغة مشتر»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — Lingua franca"

    - lemma: "لِسَان مُشْتَرَك"
      expands:
        - text: "«إحدى اللغات المستخدمة كلسان مشترك أو تجاريّ بين أقوام مختلفي اللغة.»"
          source: "المورد الحديث (2008) — lingua franca"
          addition: "ورد «لسان مشترك» ضمن تعريف lingua franca كمرادف سياقي، لا كمدخل مستقل."

    - lemma: "لُغَة بَيْنِيَّة"
      evidence_status: "no_material_found"

