# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-15295848-n (absence)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (غياب)، ولا بد من إثرائها بمرادفات تغطي الفروق الدلالية"
      - "اللمّة الموجودة بدون تشكيل كامل"
    observations: >
      المفهوم يدل على الفترة الزمنية التي يكون فيها شيء أو شخص بعيداً أو متوارياً.
      الجذر «غ ي ب» هو الجذر المحوري لهذا المفهوم في العربية، ومنه اشتقاقات عديدة:
      غِيَاب (مصدر غاب)، غَيْبَة (اسم للمدة)، تَغَيُّب (مصدر تغيّب).
      المفهوم أصيل في الثقافة العربية وله تعبيرات طبيعية متعددة.
  blind_candidates:
    - lemma: "غِيَاب"
      generation_method: ishtiqaq
      justification: "مصدر غاب يغيب على وزن فِعال، يدل على حالة البعد والتواري، وهو الأكثر شيوعاً في الاستعمال المعاصر للدلالة على الغياب بوصفه فترة زمنية"
    - lemma: "غَيْبَة"
      generation_method: ishtiqaq
      justification: "اسم من غاب يغيب بفتح الغين، يدل تحديداً على مدة البعد والتواري، كما في: أطلتَ غيبتك. وردت في المعجم الوسيط بهذا المعنى صراحةً"
    - lemma: "تَغَيُّب"
      generation_method: ishtiqaq
      justification: "مصدر تغيّب (الباب الخامس) من الجذر نفسه، يدل على الابتعاد والغياب عمداً أو اختياراً"
    - lemma: "مَغِيب"
      generation_method: ishtiqaq
      justification: "على وزن مَفْعِل الدال على الزمان والمكان، يُستعمل في مغيب الشمس ويمكن توسيعه للدلالة على فترة الغياب"


stage2_evidence:
  per_lemma:
    - lemma: "غِيَاب"
      confirm:
        - text: "«غياب — absence — Law»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«غياب — تخلف عن الحضور — default — Law»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«يمفصل الغياب عالم الوجود السيميائي، لهذا تغلب عليه لغة استبدالية لما يطلق عليه الوجود الحقيقي (بالحضور)»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«(1) غِياب (2) فقدان؛ انعدام — absence»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الغياب) الْقَبْر وغياب الشّجر عروقه»"
          source: "المعجم الوسيط"
          addition: "في الوسيط لم يُذكر الغياب بمعنى البعد الزمني بل بمعنى القبر وعروق الشجر، والمعنى الزمني يُستفاد من المصدر غاب يغيب"
        - text: "«الغياب — الفقدان المؤقت للوعي، كما يحصل في نوبات الصرع»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "استعمال طبي متخصص لا ينطبق على المعنى الزمني العام"

    - lemma: "غَيْبَة"
      confirm:
        - text: "«الغَيْبَة: البعد والتوارى. يقال: أوحشتنى غيبة فلان, وقد أطَلّت غيبتك»"
          source: "المعجم الوسيط"
        - text: "«(الْغَيْبَة) الْبعد والتواري يُقَال أوحشتني غيبَة فلَان وَقد أطلت غَيْبَتِك»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«غَيْبَةٌ — absentia»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«غَيْبة — الجذر: غ ي ب — الثابت في المعاجم أن الغِيبة بالكسر من الاغتياب... أما الغَيْبة بفتح الغين فبمعنى البعد والتواري»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يميّز بين الغَيْبة (بالفتح: البعد) والغِيبة (بالكسر: الاغتياب)"

    - lemma: "تَغَيُّب"
      confirm:
        - text: "«تغيّب — absenteeism — Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
      expands:
        - text: "«(تغيب) غَابَ وَيُقَال تغيب فلَان سَافر وَبعد وَعنهُ الْأَمر خَفِي»"
          source: "المعجم الوسيط (هورماني)"
          addition: "التغيّب فعل لازم يدل على الفعل ذاته لا على الفترة الزمنية، ومعناه الاصطلاحي في علم الاجتماع هو التغيّب المتكرر (absenteeism) لا مجرد الغياب (absence)"

    - lemma: "مَغِيب"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "غِيَاب"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة مؤيدة بشواهد معجمية متعددة من معاجم القانون واللسانيات والطب والمورد الحديث.
        مصدر غاب يغيب على وزن فِعال، والأكثر شيوعاً في الاستعمال المعاصر للدلالة على فترة الغياب.
        تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غِيَاب"

    - lemma: "غَيْبَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        وردت في المعجم الوسيط صراحةً بمعنى «البعد والتواري» مع أمثلة سياقية تدل على الفترة الزمنية:
        «أوحشتني غيبة فلان، وقد أطلت غيبتك». وهي أدق من «غياب» في الدلالة على المدة المحددة
        للبعد، بينما «غياب» أعمّ وقد يدل على الحالة لا المدة فحسب.
        يجب التنبه للتشكيل: بفتح الغين للبعد، وبكسرها للاغتياب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "غَيْبَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَغَيُّب"
      source: stage1
      decision: removed
      decision_reason: >
        التغيّب مصدر يدل على فعل الابتعاد ذاته لا على الفترة الزمنية. كما أن معناه الاصطلاحي
        في علم الاجتماع هو «absenteeism» (التغيّب المتكرر كظاهرة) وليس «absence» (فترة الغياب).
        لا يصلح بديلاً مباشراً لـ«غياب» في سياق الفترة الزمنية.

    - lemma: "مَغِيب"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر على شواهد معجمية تدعم استعمال «مَغِيب» بمعنى فترة غياب شخص أو شيء.
        الاستعمال السائد محصور في «مغيب الشمس» للدلالة على وقت الغروب،
        ولا يُعمَّم على الغياب بالمعنى المطلق.


stage4_content:
  definition:
    current: "الفترة الزمنية التي يكون فيها شيء أو شخص ما غائباً"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي. يمكن تحسينه بأسلوب المعجم الوسيط
        مع تجنب الدوران (استعمال «غائباً» في تعريف الغياب).
    authored:
      - type: terminological
        text: "فَتْرَةٌ زَمَنِيَّةٌ يَنْقَطِعُ فِيهَا الشَّخْصُ أَوِ الشَّيْءُ عَنْ مَكَانِهِ أَوْ مَوْضِعِهِ الْمُعْتَاد"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مُدَّةُ الْبُعْدِ وَالتَّوَارِي عَنِ الْمَكَانِ أَوِ الْمَوْقِعِ الْمَأْلُوف"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُدَّةُ انْقِطَاعِ الشَّخْصِ أَوِ الشَّيْءِ عَنْ مَكَانِهِ أَوْ مَوْضِعِهِ الْمُعْتَاد"

  examples:
    per_lemma:
      - lemma: "غِيَاب"
        examples:
          - text: "طَالَ غِيَابُ الْمُدِيرِ عَنِ الْمَكْتَبِ فَتَرَاكَمَتِ الْمُعَامَلَاتُ عَلَى مَكْتَبِهِ."
            type: usage
      - lemma: "غَيْبَة"
        examples:
          - text: "أَوْحَشَتْنِي غَيْبَتُكَ الطَّوِيلَةُ، فَمَتَى تَعُودُ إِلَى الْوَطَن؟"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "طَالَ غِيَابُ الْمُدِيرِ عَنِ الْمَكْتَبِ فَتَرَاكَمَتِ الْمُعَامَلَاتُ عَلَى مَكْتَبِهِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَوْحَشَتْنِي غَيْبَتُكَ الطَّوِيلَةُ، فَمَتَى تَعُودُ إِلَى الْوَطَن؟"


