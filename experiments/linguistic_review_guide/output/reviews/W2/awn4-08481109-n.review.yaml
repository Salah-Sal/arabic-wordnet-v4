stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية (كنز مكتشف) هي تركيب وصفي بسيط وليست مصطلحاً معجمياً مكثفاً."
      - "اللمة الحالية غير مشكولة."
    observations: "المجموعة تشير إلى مفهوم 'Treasure trove'، والذي يمتلك في العربية الكلاسيكية مقابلاً دقيقاً هو 'الركاز' أو 'اللقية'. المصطلح الحالي صحيح لكنه يفتقر إلى الرصانة المعجمية."
  blind_candidates:
    - lemma: "رِكَازٌ"
      generation_method: majaz
      justification: "مصطلح فقهي ولغوي قديم يشير إلى ما وجد مدفوناً من قطع الذهب والفضة وغيرها مما له قيمة."
    - lemma: "لُقْيَةٌ"
      generation_method: ishtiqaq
      justification: "اسم لما يُعثر عليه ويُكتشف، على وزن فُعْلة (للمرة أو الهيئة أو الشيء)."
    - lemma: "مَعْثُورَاتٌ"
      generation_method: ishtiqaq
      justification: "اسم مفعول مجموع يشير إلى الأشياء التي عُثر عليها."
    - lemma: "ذَخِيرَةٌ"
      generation_method: majaz
      justification: "ما يُدخر من المال والأشياء الثمينة، وتُستخدم دلالياً لوصف الكنز المكتشف."

stage2_evidence:
  per_lemma:
    - lemma: "كَنْزٌ مُكْتَشَفٌ"
      confirm:
        - text: "«كَنْز دفين [يُعثر عليه]... اكتشاف؛ لُقية.»"
          source: "المورد الحديث (2008)"
    - lemma: "رِكَازٌ"
      confirm:
        - text: "«الرِّكَاز: المَال المركوز فِي الأَرْض مخلوقا كَانَ أَو مَوْضُوعا فِيهَا فَهُوَ أَعم من الْمَعْدن والكنز.»"
          source: "دستور العلماء"
        - text: "«الرِّكَاز: مَا ركزه الله تَعَالَى فِي الأَرْض من الْمَعَادِن فِي حالتها الطبيعية والكنز وَالْمَال المدفون قبل الْإِسْلَام.»"
          source: "المعجم الوسيط"
    - lemma: "لُقْيَةٌ"
      confirm:
        - text: "«(2) اكتشاف؛ لُقية.»"
          source: "المورد الحديث (2008) في ترجمة treasure trove"
        - text: "«اللُّقْيَةُ فُعْلَةٌ مِنَ اللِّقَاءِ، وَالْجَمْعُ لُقًى.»"
          source: "مقاييس اللغة"
    - lemma: "كَنْزٌ دَفِينٌ"
      confirm:
        - text: "«كَنْز دفين [يُعثر عليه]»"
          source: "المورد الحديث (2008)"

