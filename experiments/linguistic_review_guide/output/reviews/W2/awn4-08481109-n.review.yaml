stage4_content:
  definition:
    current: "أي مجموعة من الأشياء الثمينة التي يتم اكتشافها"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط، ويفضل صياغته بأسلوب معجمي يبرز طبيعة هذه الأشياء وكونها كانت مخبوءة."
    authored:
      - type: terminological
        text: "مجموعةٌ مِنَ الأَشْياءِ الثَّمِينَةِ أَوِ المَقْتَنَيَاتِ النَّفِيسَةِ التِي يُعْثَرُ عَلَيْهَا بَعْدَ أَنْ كَانَتْ مَخْبُوءَةً أَوْ ضَائِعَةً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-08481109-n"
          definition_index: 0
          text: "مجموعةٌ مِنَ الأَشْياءِ الثَّمِينَةِ أَوِ المَقْتَنَيَاتِ النَّفِيسَةِ التِي يُعْثَرُ عَلَيْهَا بَعْدَ أَنْ كَانَتْ مَخْبُوءَةً أَوْ ضَائِعَةً."
  examples:
    per_lemma:
      - lemma: "كَنْزٌ مُكْتَشَفٌ"
        examples:
          - text: "أعلنت وزارة الآثار عن كنز مكتشف يضم مئات العملات الذهبية."
            type: usage
      - lemma: "رِكَازٌ"
        examples:
          - text: "وَجَدَ الفَلَّاحُ رِكَازاً مِنَ العَهْدِ الرُّومَانِيِّ فِي أَرْضِهِ."
            type: usage
      - lemma: "لُقْيَةٌ"
        examples:
          - text: "تُعَدُّ هَذِهِ الجِرَارُ الفَخَّارِيَّةُ لُقْيَةً أَثَرِيَّةً هَامَّةً."
            type: usage
      - lemma: "كَنْزٌ دَفِينٌ"
        examples:
          - text: "ظَلَّ السِّرُّ مَخْبُوءاً كَأَنَّهُ كَنْزٌ دَفِينٌ لَا يَعْلَمُهُ أَحَدٌ."
            type: usage

