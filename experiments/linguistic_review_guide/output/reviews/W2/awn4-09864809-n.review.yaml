    - lemma: "سُتْرَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«السّترة ما استترت به من شيء كائنا ما كان» — معجم البلدان لياقوت الحموي"
      justification: "لفظ عام يدل على الإخفاء والستر، وهو مجاز (إزاحة دلالية) لمن يُتخذ لستر شيء، وإن كان أقل شيوعاً من ستار."
  knowledge_candidates:
    - lemma: "وَاجِهَة"
      justification: "مصطلح شائع (إزاحة دلالية / مجاز) يُطلق على الشخص أو الشيء الذي يُستخدم كستار لتمثيل شيء آخر أو إخفاء حقيقته أمام المجتمع."
  generation_notes: "المفهوم الإنجليزي (beard) خاص جداً بثقافة معينة، ولا يقابله في العربية لفظ مسكوك مخصص له حصراً؛ بل تُستخدم ألفاظ عامة تفيد الستر أو التغطية أو الواجهة مجازياً."

