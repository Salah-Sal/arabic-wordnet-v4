        - text: "ما يُسْتَتَرُ به"
          source: "المعجم الكبير"
          addition: "استُعير المعنى المادي للغطاء للدلالة على شخص (امرأة) يُتخذ واجهة لإخفاء حقيقة شخص آخر"
    - lemma: "غِطَاء"
