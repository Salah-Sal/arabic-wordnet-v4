# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. اللمّات المرشحة (أُولِّدت قبل الاطلاع على لمّات المجموعة الفعلية)
  blind_candidates:
    - lemma: "صَفِيرَةٌ"
      generation_method: ishtiqaq
      justification: >
        وزن فَعِيلة يفيد المرة أو الوقعة الواحدة؛ صَفِيرَة = فعلة صفيرٍ بعينها للإشارة أو
        الاستدعاء، مستقة من جذر ص-ف-ر على قياس رَمِيَّة ورَمِيَّة ونَظِيرَة.

    - lemma: "نَفِيرٌ"
      generation_method: majaz
      justification: >
        إحياء للفظ عربي قديم (جذر ن-ف-ر) يعني الصوت الصاخب الداعي إلى الاجتماع والحشد؛
        يُنقل بالمجاز إلى الإشارة الصوتية (الصفير) لاستدعاء الشخص، تجنُّباً للاشتراك
        مع ألفاظ جذر صفر الواردة في التعريف ذاته.

    - lemma: "إِشَارَةٌ صَفِيرِيَّةٌ"
      generation_method: tarkib
      justification: >
        مركَّب وصفي (موصوف + صفة نسبية): الإشارة التي تُنجز بطريقة الصفير؛ الصفة
        «صَفِيرِيَّة» مشتقة بالنسبة من «صَفِير»، ونظيرها في اللغة المعاصرة: إشارةٌ
        ضوئية، إشارةٌ صوتية.

    - lemma: "زَمِيرٌ"
      generation_method: majaz
      justification: >
        من جذر ز-م-ر (النفخ في المِزمار والآلة الموسيقية)؛ يُنقل بالمجاز إلى النفخ في
        الصافرة بوصفه إشارة، إحياءً للفظ القديم في معنى ذي صلة وظيفية.

  # ب. التقييم الأولي (بعد الاطلاع على البيانات الكاملة)
  assessment:
    concerns:
      - >
        التعريف العربي الحالي دائري: يستعمل «التصفير» في تعريف مجموعة إحدى لمّاتيها
        «تصفير»، وهو تجنَّبه المعجم الوسيط بتعريف الشيء بغيره.
      - >
        «تصفير» في جميع المعاجم التقنية الحديثة (المعجم الموحد للسانيات، مسرد الإعلام،
        مسرد النسيج) تعني «الأصوتة» (assibilation) أو «الإصفرار» أو «الضبط على الصفر»
        — لا فعل الصفير. هذا تعارض حاد مع الاستخدام المراد في المجموعة.
      - >
        اللمّتان خاليتان من التشكيل الكامل في بيانات AWN الحالية.
    observations: >
      جذر ص-ف-ر في مقاييس اللغة لابن فارس يتضمن ستة أصول منفصلة؛ الأصل الرابع مخصص
      للصوت: «الصَّفِيرُ لِلطَّائِرِ»، وهو الأصل الذي تنبثق منه دلالة الصفير البشري
      والإشارة الصوتية. في المقابل، تشغل «تصفير» (مصدر الباب الثاني صَفَّرَ) في
      المعاصرة دلالاتٍ مختلفة تماماً. «صَفِير» (مصدر الباب الأول صَفَرَ) هو الأصلح
      لتمثيل المفهوم، وتشهد له المعاجم الكلاسيكية والحديثة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت:
# [Q1] مطابقة دفعية: تصفير، التصفير، صفير، الصفير، صافرة، الصافرة
# [Q2] الجسر الإنجليزي: whistle، whistling، whistle signal، blow a whistle
# [Q3] البحث بالكلمات المفتاحية: صفر، صفير، نفخ، استدعاء، تصفير
# [Q4] مقاييس اللغة: dictionary_id=151، headword_norm='صفر'
stage2_evidence:

  per_lemma:

    - lemma: "صفير"
      confirm:
        - text: >
            «(الصَّفِيرُ) صَوْتٌ عَلَى دَرَجَةٍ كَبِيرَةٍ مِنَ الرَّخَاوَةِ؛
            كَالسِّينِ وَالزَّايِ وَالصَّادِ»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >
            «الصَّفِيرُ: الصَّوْتُ؛ الصَّوْتُ بِالدَّوَابِّ إِذَا سُقِيَتْ.
            حُرُوفُ الصَّفِيرِ: حُرُوفٌ عَلَى دَرَجَةٍ كَبِيرَةٍ مِنَ الرَّخَاوَةِ،
            كَالسِّينِ وَالزَّايِ وَالصَّادِ»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «الصَّفِيرُ: الصَّوْتُ الْخَالِي عَنِ الْحُرُوفِ»
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: >
            «(1) صَفِير. (6) يَدْعُو [إِلَى الْحُضُورِ] بِالصَّفِيرِ.
            (7) يَدْعُو أَوْ يَطْرُدُ أَوْ يُعَبِّرُ عَنْ كَذَا بِالصَّفِيرِ»
          source: "المورد الحديث (2008)، بند whistle"
      expands:
        - text: >
            «وَأَمَّا الرَّابِعُ فَالصَّفِيرُ لِلطَّائِرِ. وَقَوْلُهُمْ:
            مَا بِهَا صَافِرٌ مِنْ هَذَا، أَيْ كَأَنَّهُ يُصَوِّتُ»
          source: "مقاييس اللغة لابن فارس (ت 395هـ)، مادة صَفَرَ، الأصل الرابع"
          addition: >
            يُثبت ابن فارس أن الصفير هو الأصل اللغوي الرابع لمادة ص-ف-ر، وأن
            أصله صوت الطائر؛ مما يدل على أن الصفير البشري تعميمٌ طبيعي لهذا الأصل.
        - text: >
            «(1) صَفِير (2) صَافِر» [ترجمة: whistling]
          source: "المورد الحديث (2008)، بند whistling"
          addition: >
            يُعطي المورد الحديث «صفير» و«صافر» مقابلاً لـ whistling (الاسم والصفة)،
            مما يؤكد صلاحيته للدلالة على فعل التصفير وليس الصوت وحده.

    - lemma: "تصفير"
      contradicts:
        - text: >
            «تَحْوِيلُ صَوْتٍ انْسِدَادِيٍّ إِلَى صَفِيرِيٍّ» [مقابل: Assibilation]
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)، مجال: اللغة والأدب"
          conflict: >
            تصفير = أصوتة (assibilation) وهو مصطلح علم الأصوات الصرف، لا علاقة له
            بفعل إعطاء إشارة بالصفير.
        - text: >
            «تَحْوِيلُ صَوْتٍ انْسِدَادِيٍّ إِلَى صَفِيرِيٍّ» [مقابل: assibilation]
          source: "مسرد الإعلام والتواصل، منظمة ALECSO"
          conflict: >
            تكرار لنفس المعنى التقني في مصدر ثانٍ مما يؤكد رسوخ هذا الاستعمال.
        - text: >
            «تَغْيِيرُ أَلْوَانِ مَوَادِّ الْأَلْيَافِ وَفَسَائِلِ الْخُيُوطِ
            وَخَاصَّةً الْأَلْيَافَ الصِّنَاعِيَّةَ مِنْ مُتَعَدِّدِ الْأَمِيدِ
            عَنْ طَرِيقِ الْحَرَارَةِ وَتَأْثِيرِ الضَّوْءِ» [مقابل: yellowing]
          source: "مسرد صناعة النسيج، منظمة ALECSO"
          conflict: >
            تصفير = إصفرار الألياف الصناعية؛ دلالة مغايرة تماماً لا علاقة لها بالصفير.

    - lemma: "صَفِيرَةٌ"
      evidence_status: "no_material_found"

    - lemma: "نَفِيرٌ"
      evidence_status: "no_material_found"

    - lemma: "إِشَارَةٌ صَفِيرِيَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "زَمِيرٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:

  per_lemma:

    # ── لمّات المجموعة الموجودة ──

    - lemma: "صفير"
      decision: confirmed
      decision_reason: >
        صَفِير هو المصدر القياسي للفعل «صَفَرَ» (باب فَعَلَ يَفْعِلُ صَفِيراً)، ومعناه
        الصوت الحادّ المُنتَج بالنفخ عبر الشفتين أو في أداة. تشهد له المعاجم الكلاسيكية
        والحديثة بهذا المعنى (المناوي، الوسيط، الكبير، المورد)، وأكد ابن فارس أن الصفير
        هو الأصل الرابع لمادة ص-ف-ر. المورد الحديث يقابل به whistling صراحةً.
        اللمّة خالية من التشكيل في AWN؛ تحتاج تصحيحاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صَفِير هو اللفظ العربي الجامع للصوت الصافر وفعل إنتاجه سواء أكان من إنسان أم
        طائر أم آلة؛ يغطي المفهوم الجوهري للمجموعة (إشارة بالصفير) بدلالة أصيلة
        ومباشرة لا تشوبها اشتراكات تقنية تُضلِّل القارئ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَفِيرٌ"

    - lemma: "تصفير"
      decision: removed
      decision_reason: >
        «تصفير» (مصدر الباب الثاني صَفَّرَ) محتلٌّ في المعجم التقني الحديث بثلاث دلالات
        متجذّرة: (أ) أصوتة [assibilation] في علم الأصوات، (ب) إصفرار في صناعة النسيج،
        (ج) ضبط على الصفر في الهندسة. لا يوجد في المصادر اللغوية أو التقنية أي شاهد
        على استخدامه بمعنى «فعل الإشارة بالصفير». استبقاؤه يُوقع القارئ في لبس مع
        المصطلح الصوتي المستقر. «صَفِير» يُغني عنه تماماً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──

    - lemma: "صَفِيرَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        وزن فَعِيلة قياسي للمرة الواحدة، غير أنه غير مسجَّل في المعاجم بهذه الدلالة،
        ولا حاجة إليه مع وجود «صَفِير» الذي يشمل الفعل عموماً. لا أدلة في قاعدة
        البيانات. فضلاً عن أن المورد الحديث يترجم whistling بـ«صفير» لا بـ«صفيرة».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "نَفِيرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        نَفِير من جذر ن-ف-ر يعني في الاستعمال العربي الراسخ النداء إلى الحشد العسكري
        أو العام («كان نفيراً عاماً»)، لا إشارةً بالصفير بالمعنى الحرفي المراد هنا.
        المسافة الدلالية كبيرة، ولا شاهد في المعاجم على استعماله مرادفاً للصفير
        بوصفه إشارة استدعاء يومية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "إِشَارَةٌ صَفِيرِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ: يمكن إبدال «صفيرية» بـ«صوتية» أو «نفخية» والجملة تظل صالحة
        وصفاً، مما يدل على أنه ليس مصطلحاً ثابتاً. اختبار التثبيت المعجمي: لم يَرِد في
        أي مصدر مُعجمي. ARABTERM يستخدم «إشارة بالصافرة» لا «إشارة صفيرية». المجموعة
        بحاجة إلى مصطلح لا إلى عبارة وصفية حرة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "زَمِيرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        من جذر ز-م-ر (العزف على المزمار)؛ المسافة الدلالية عن «الصفير إشارةً» بعيدة،
        والمجاز المقترح غير متعارف عليه في الاستعمال. لا شاهد في قاعدة البيانات.
        اقتراح الزمير هنا كلفة دلالية غير مبررة في وجود «صفير» المتاح والمثبت.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


