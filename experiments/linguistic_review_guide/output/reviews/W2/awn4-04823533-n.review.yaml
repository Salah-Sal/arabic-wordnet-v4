            type: usage
      - lemma: "حَضَرِيَّة"
        examples:
          - text: "الحضريّةُ ليست مجرَّدَ سكنى في المدينةِ، بل هي نمطُ حياةٍ وطريقةُ تفكيرٍ تتشكَّل عبر الزمنِ في أحضانِ الوسطِ الحضريّ."
            type: usage
      - lemma: "مَدَنِيَّة"
        examples:
          - text: "رصدَ الباحثُ تفاوُتَ مستوى المدنيّةِ بين أحياءِ العاصمةِ وضواحيها، وارتبطَ ذلك بقِدَمِ التحضُّرِ ومستوى البنية التحتيّة."
