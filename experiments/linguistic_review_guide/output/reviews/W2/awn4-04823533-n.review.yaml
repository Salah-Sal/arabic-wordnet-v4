# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04823533-n | ILI: i62310 | POS: n
# Lemmas: تمدن، حضرية | EN: urbanity
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تمدن، حضرية) مكتوبتان بدون تشكيل، مما يُعسِّر تحديد وزنهما الصرفي الدقيق."
      - "تمدن — في المعاجم الحديثة والمصطلحية — يُقابَل بـ urbanization (عملية التمدن) لا بـ urbanity (صفة/طابع الحياة الحضرية)؛ مما يُشير إلى احتمال التشويش الدلالي."
      - "حضرية كمدخل مستقل ذو دلالة مجردة غير موثَّق في المعاجم الكبرى (الوسيط، الكبير)؛ إذ لا تُوجَد إلا في موسوعة الأسماء بوصفها اسم مؤنث."
      - "التعريف الحالي (صفة أو طابع الحياة في المدينة أو البلدة) ترجمة حرفية من الإنجليزية دون أسلوب معجمي عربي أصيل."
    observations: >
      المجموعة تعبّر عن المعنى الأول لـ urbanity، وهو الطابع المميَّز للحياة الحضرية في المدن والبلدات —
      لا المعنى الثاني الشائع في المعاجم الثنائية (التهذيب ولطف الأدب). وهذا التمييز حاسم؛
      إذ أشار المورد الحديث إلى أن urbanity = "تهذيب؛ لطف؛ كياسة"، وهو المعنى الثاني المختلف كلياً عن هذه المجموعة.
      اللمّتان الموجودتان صحيحتان من حيث الأصل الاشتقاقي لكنهما تحتاجان إلى تشكيل وتوثيق.
      الجذران الأساسيان في المجموعة هما م-د-ن وح-ض-ر، وكلاهما من الجذور الأصيلة العريقة التي تشهد لها مقاييس ابن فارس.

  blind_candidates:
    - lemma: "مَدَنِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي (فَعَلِيَّة) من الجذر م-د-ن عبر الصفة المنسوبة (مَدَنِيّ)، يُعبِّر عن صفة
        الانتساب إلى المدينة وطابع حياتها. الوزن (فَعَلِيَّة) من أكثر الأوزان إنتاجاً لتجريد
        المفاهيم في العربية المعاصرة، وهو موازٍ لـ إنسانيّة، مدنيّة، عمرانيّة.
    - lemma: "حَضَارِيَّة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من "حضارة" (civilization) نحو صفة الطابع الحضري لحياة المدن؛ إذ "الحضارة"
        في أصلها اللغوي (ابن فارس: سكون الحضر الحضارة) تنصرف إلى الحياة الحضرية. غير أن
        استعمالها الشائع انصرف إلى معنى أوسع (civilization)، ففيها إحياء للدلالة الأصلية الضيّقة
        المتعلقة بطابع حياة الحضر.
    - lemma: "تَحَضُّر"
      generation_method: ishtiqaq
      justification: >
        مصدر (تَفَعُّل) من الجذر ح-ض-ر، يدل على التخلق بأخلاق أهل الحضر والانتقال إلى
        نمط حياتهم. الوزن تَفَعُّل ينقل دلالة الاكتساب والتحوّل، مما يجعله تعبيراً عن
        الطابع الحضري من زاوية ديناميكية (كيف تُكتسب صفة الحياة الحضرية).
    - lemma: "طَابَعُ الحَضَر"
      generation_method: tarkib
      justification: >
        مركَّب إضافي (idafi) يُصرِّح بالمفهوم مباشرةً: "طابع" (character/quality) مضافٌ إلى
        "الحضر" (urban environment). يتوافق بنيويّاً مع التعريف المعطى، وهو مركَّب إضافي
        طبيعي في العربية للتعبير عن الصفات المنسوبة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تمدن"
      confirm:
        - text: "«(تَمُدَّن) عَاشَ عيشة أهل المدن وَأخذ بِأَسْبَاب الحضارة (مو)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
        - text: "«تمدُّن: urbanization — مجال: الجغرافيا والتاريخ»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«التمدن: هُوَ الِاجْتِمَاع مَعَ بني النَّوْع يتعاونون ويتشاركون فِي تَحْصِيل الْغذَاء واللباس والمسكن وَغَيرهَا»"
          source: "دستور العلماء للأحمدنكري (هوراماني)"
          addition: "يُوثِّق دلالة التمدن على الحياة الاجتماعية المشتركة للمدينة وهو ما يُقارب مفهوم الطابع الحضري من زاوية اجتماعية."
        - text: "«تَمَدَّنَ: عاش عيشةَ أهل المدن وأخذ بأسباب الحضارة (مو)»"
          source: "المعجم الوسيط (OCR، مجمع اللغة العربية)"
          addition: "يُثبت أن المصدر تَمَدُّن مشتق من الفعل تمدَّن الواصف لحياة أهل المدن."
      contradicts:
        - text: "«تمدّن: urbanization — مجال: الجغرافيا والتاريخ»"
          source: "ArabTerm — مسرد الجغرافيا والتاريخ"
          conflict: "الترجمة المصطلحية تُعادل تمدّن بـ urbanization (عملية التمدُّن) لا بـ urbanity (صفة/طابع الحياة الحضرية)، مما يُشير إلى انزياح دلالي محتمل."

    - lemma: "حضرية"
      expands:
        - text: "«حَضَرِيَّة: من (ح ض ر) مؤنث حَضَرِيّ»"
          source: "موسوعة السلطان قابوس لأسماء العرب (هوراماني)"
          addition: "يُثبت أن الصيغة الصرفية حَضَرِيَّة موثَّقة وفصيحة، غير أن السياق توثيقي (اسم علم) لا توثيق للمعنى المجرد."
        - text: "«حَضْرِيَّة: من (ح ض ر) مؤنث حَضْرِي»"
          source: "موسوعة السلطان قابوس لأسماء العرب (هوراماني)"
          addition: "وجود صيغتين بالتحريك (حَضَرِيَّة) وبالإسكان (حَضْرِيَّة)، والمعيار الصرفي يُرجِّح حَضَرِيَّة كنسبة إلى الحَضَر."

    - lemma: "مَدَنِيَّة"
      confirm:
        - text: "«المَدَنِيَّةُ: الحضارةُ واتساع العمران»"
          source: "المعجم الوسيط (OCR، مجمع اللغة العربية)"
        - text: "«(المدنية) الحضارة واتساع الْعمرَان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
      expands:
        - text: "«(1) المدينيَّة: طريقة الحياة المميِّزة لأهل المدن (2) تمدُّن؛ تحضُّر (3) تخطيط المُدُن — translation_en: urbanism»"
          source: "المورد الحديث (2008) — ArabTerm"
          addition: >
            المورد الحديث يُدرج 'المدينيَّة' (لا مدنيَّة) بوصفها الترجمة الأولى لـ urbanism بمعنى
            'طريقة الحياة المميِّزة لأهل المدن'، وهو المعنى المطابق تماماً لهذه المجموعة.
            ويُدرج تمدُّن وتحضُّر بوصفهما مرادفَين لهذا المعنى.

    - lemma: "حَضَارِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَحَضُّر"
      confirm:
        - text: "«تَحَضَّرَ البَدَوِيُّ: تَشَبَّه بأَهْلِ الحَضَرِ في أخلاقِهم وعاداتِهم»"
          source: "المعجم الكبير (OCR، مجمع اللغة العربية)"
        - text: "«تحضَّر: حضَر، تخلَّق بأخلاق أهل الحضر وعاداتهم»"
          source: "المعجم الوسيط (OCR، مجمع اللغة العربية)"
      contradicts:
        - text: "«تحضر: urbanization — مجال: المعجم الطبي الموحد (2009)»"
          source: "المعجم الطبي الموحد — ArabTerm"
          conflict: "المصادر المصطلحية تُعادل تحضّر بـ urbanization (عملية الانتقال إلى الحياة الحضرية) لا بـ urbanity (صفة هذه الحياة). كذلك الفعل تحضَّر في الوسيط فعلٌ لا اسم."
        - text: "«تحضر، تمصير: مصر وتمصر المكان: جعله وصار مصراً أي مدينة — translation_en: urbanism»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — ArabTerm"
          conflict: "يُعادَل بـ urbanism/urbanization بمعنى إنشاء المدن، لا طابع الحياة فيها."

    - lemma: "طَابَعُ الحَضَر"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تمدن"
      decision: confirmed
      decision_reason: >
        المصدر تَمَدُّن (من تمدَّنَ، وزن تَفَعُّل) اسمٌ بطبيعته يصف حالة التخلق بعيشة أهل المدن
        وما يرتبط بذلك من طابع حضاري. وإن كانت مصادر المصطلحية تُعادله بـ urbanization، إلا أن
        المعاجم اللغوية الكبرى تصفه وصفاً يشمل حالة الحياة الحضرية لا مجرد عملية الانتقال إليها.
        يُبقى في المجموعة مع تصحيح التشكيل إلزامياً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على الجانب الديناميكي — اكتساب الطابع الحضري والانتقال إليه؛ فيه دلالة التحوُّل
        والصيرورة (تفعُّل). يصف الحالة الناشئة عن عيش أهل المدن، مما يجعله الأقرب إلى
        مفهوم المآل والنتيجة — بخلاف حَضَرِيَّة التي تصف الانتساب الجذري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَدُّن"

    - lemma: "حضرية"
      decision: confirmed
      decision_reason: >
        حَضَرِيَّة مصدر صناعي (فَعَلِيَّة) قياسي من الصفة المنسوبة حَضَرِيّ (نسبة إلى الحَضَر)،
        وهو وزن أصيل منتج لتجريد المفاهيم في العربية المعاصرة. وإن لم يَرِد في المعاجم الكبرى
        كمصدر مستقل بهذا المعنى، فإن المقياس الصرفي يسوِّغه، ويُدعِّمه توثيق موسوعة الأسماء
        للصيغة الصرفية ذاتها. ويُبقى في المجموعة مع تصحيح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        ينسب الطابع مباشرةً إلى الحَضَر (المدينة) في مقابل البادية والريف؛ فيه دلالة الانتساب
        والاختصاص (نسبة). لا يحمل دلالة التحوُّل كتمدُّن، بل يصف الطابع القائم بذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَضَرِيَّة"

    - lemma: "مَدَنِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّقة في المعجم الوسيط (المرجع الأعلى وثوقاً) بوصفها "الحضارة واتساع العمران"،
        وهو تعريف يتضمن طابع الحياة الحضرية. كما يُدرجها المورد الحديث ضمن المقابلات الثانوية
        لـ urbanism. تُعدّ الأقرب إلى المفهوم المقصود من بين المرشحات المولَّدة، وتزيد المجموعة
        بُعداً دلالياً يُكمل تمدُّن وحضريّة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبِّر عن مستوى الرقي المدني والحضاري المصاحب للحياة في المدينة — وهو الأعم دلالةً؛
        إذ يشمل الحضارة والعمران معاً. يختلف عن تمدُّن (الجانب الديناميكي) وعن حضريّة (الانتساب
        إلى الحضر)، ويقترب من المعنى البنيوي للحياة المدنية المتحضّرة.
      actions:
        - command: create_entry
          params:
            lemma: "مَدَنِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حَضَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمياً على استعمال حضاريّة مصطلحاً مستقلاً بمعنى "طابع الحياة الحضرية".
        هي مؤنث الصفة "حضاريّ" (نسبة إلى الحضارة) ولا تُشكِّل وحدة معجمية ثابتة. فضلاً عن
        أنها تستدعي دلالة الحضارة الشاملة (civilization) لا طابع المدينة تحديداً.

    - lemma: "تَحَضُّر"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم والمصادر المصطلحية تُجمع على تعادل تحضُّر بـ urbanization (عملية الانتقال
        إلى الحياة الحضرية وكونها فعل التحوُّل) لا بـ urbanity (صفة هذه الحياة/طابعها).
        أصله في الوسيط فعلٌ (تحضَّر)، ومصدره يُعبِّر عن العملية لا عن الصفة الثابتة. لا يُلائم
        هذه المجموعة المعنى-ياً.

    - lemma: "طَابَعُ الحَضَر"
      source: stage1
      decision: removed
      decision_reason: >
        فشل اختبار التثبيت المعجمي: يمكن إبدال "طابع" بـ"صفة" أو "سمة" أو "روح" وإبدال
        "الحضر" بـ"المدينة" أو "البلدة" مع بقاء العبارة وصفاً صالحاً — مما يُثبت أنها عبارة
        وصفية حرة لا مصطلح مسكوك. غياب التثبيت في أي مصدر معجمي يُؤكِّد ذلك.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة أو طابع الحياة في المدينة أو البلدة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية (the quality or character of life in a city
        or town) دون أسلوب معجمي عربي أصيل. يفتقر إلى الفصل النوعي (differentia) الذي
        يُمَيِّز هذا الطابع من غيره، ولا يُحدِّد المقابل (الريف/البادية) الذي يُجلِّي المفهوم.
    authored:
      - type: terminological
        text: >
          خاصيّةٌ جوهريّةٌ تتسِمُ بها الحياةُ في المدينةِ أو البلدةِ، مِمَّا يُمَيِّزُها من الحياةِ
          الريفيّةِ، شاملةً أساليبَ العيشِ والأنماطَ الاجتماعيّةَ والثقافيّةَ الخاصّةَ بالوسطِ
          الحضريّ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          ما يتَّصِفُ به الوسطُ الحضريُّ من طابعٍ وسِمةٍ تُميِّزانِه من البيئةِ الريفيّة في أساليبِ
          العيشِ والحياةِ الاجتماعيّة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            خاصيّةٌ جوهريّةٌ تتسِمُ بها الحياةُ في المدينةِ أو البلدةِ، مِمَّا يُمَيِّزُها من الحياةِ
            الريفيّةِ، شاملةً أساليبَ العيشِ والأنماطَ الاجتماعيّةَ والثقافيّةَ الخاصّةَ بالوسطِ
            الحضريّ.
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >
            ما يتَّصِفُ به الوسطُ الحضريُّ من طابعٍ وسِمةٍ تُميِّزانِه من البيئةِ الريفيّة في أساليبِ
            العيشِ والحياةِ الاجتماعيّة.

  examples:
