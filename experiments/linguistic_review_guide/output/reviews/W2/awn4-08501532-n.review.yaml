stage1_review:
  assessment:
    concerns:
      - "افتقار اللمة الحالية للتشكيل، مما قد يؤدي إلى التباس في النطق."
      - "المصطلح أعجمي محض لعدم وجود مقابل عربي أصيل لهذه المجموعة العرقية الإفريقية."
    observations: "اللمة 'مبوندو' هي تعريب صوتي للاسم الأصلي (Mbundu)، وهو الإجراء السليم مع أسماء المجموعات العرقية الخاصة بثقافات أخرى. من الضروري ضبط النطق بالتشكيل (مُبُونْدُو)."
  blind_candidates:
    - lemma: "مُبُونْدُو"
      generation_method: taarib
      justification: "تعريب لاسم المجموعة العرقية (Mbundu) وهو الاسم المستقر عالميًا."
    - lemma: "أُوفِيمْبُونْدُو"
      generation_method: taarib
      justification: "تعريب لاسم المجموعة العرقية (Ovimbundu) وهو الاسم البديل للمجموعة."
    - lemma: "شَعْبُ المُبُونْدُو"
      generation_method: tarkib
      justification: "تركيب إضافي يوضح ماهية الكيان كشعب أو مجموعة عرقية مع الاحتفاظ بالاسم الأعجمي."
    - lemma: "قَبَائِلُ المُبُونْدُو"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر عن الكيان كقبائل، وهو شائع في تسمية المجموعات العرقية الإفريقية."

stage2_evidence:
  per_lemma:
    - lemma: "مبوندو"
      evidence_status: "no_material_found"
    - lemma: "مُبُونْدُو"
      evidence_status: "no_material_found"
    - lemma: "أُوفِيمْبُونْدُو"
      evidence_status: "no_material_found"
    - lemma: "شَعْبُ المُبُونْدُو"
      evidence_status: "no_material_found"
    - lemma: "قَبَائِلُ المُبُونْدُو"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مبوندو"
      decision: confirmed
      decision_reason: "الاسم الأعجمي المعرب للمجموعة العرقية، وهو مستقر في الاستعمال للتعريف بهذا الكيان الإفريقي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُبُونْدُو"

    - lemma: "مُبُونْدُو"
      source: stage1
      decision: removed
      decision_reason: "اللمة موجودة بالفعل في المجموعة، واقتراحها كمرشح جديد كان لغرض ضبط التشكيل الذي عولج بتحديث اللمة الأصلية."
      evidence_assessment:
        case: no_material

    - lemma: "أُوفِيمْبُونْدُو"
      source: stage1
      decision: confirmed
      decision_reason: "الاسم البديل والموازي للمجموعة العرقية (Ovimbundu)، وهو تعريب دقيق ومناسب لإضافته كمرادف."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أُوفِيمْبُونْدُو"
            pos: "n"
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "شَعْبُ المُبُونْدُو"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حر (شعب + اسم) يصف المجموعة ولا يعد اسماً علماً بحد ذاته."
      evidence_assessment:
        case: no_material

    - lemma: "قَبَائِلُ المُبُونْدُو"
      source: stage1
      decision: removed
      decision_reason: "تركيب حر يعبر عن تصنيف المجموعة كقبائل وليس اسماً علماً مسكوكاً."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "مجموعة عرقية تتحدث لغة أومبوندو وتعيش في غرب أنغولا"
    assessment:
      decision: retain
      reason: "التعريف دقيق وشامل للجنس القريب (مجموعة عرقية) والفصل النوعي (اللغة والموقع الجغرافي)، ومصاغ بأسلوب معجمي سليم."
  examples:
    per_lemma:
      - lemma: "مُبُونْدُو"
        examples:
          - text: "تُشكل مجموعة مُبُونْدُو العرقية نسبة كبيرة من سكان أنغولا."
            type: usage
      - lemma: "أُوفِيمْبُونْدُو"
        examples:
          - text: "تتركز مناطق شعب أُوفِيمْبُونْدُو في المرتفعات الوسطى من البلاد."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُشكل مجموعة مُبُونْدُو العرقية نسبة كبيرة من سكان أنغولا."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتركز مناطق شعب أُوفِيمْبُونْدُو في المرتفعات الوسطى من البلاد."

