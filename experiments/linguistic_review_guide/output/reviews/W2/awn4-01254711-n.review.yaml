stage4_content:
  definition:
    current: "(قانون) انخفاض في قيمة العقار ناتج عن فعل أو إهمال"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية شبه كاملة للتعريف الإنجليزي. يحتاج إلى صياغة معجمية عربية أدقّ تبيّن السياق القانوني وتُميّز بين الفعل والإهمال"
    authored:
      - type: terminological
        text: "نَقْصٌ في قيمة العَقار يلحقه بسبب تصرُّف المنتفع أو المستأجر تصرُّفاً مُضِرّاً، أو بسبب إهماله صيانة العقار والمحافظة عليه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مصطلح في القانون العامّ (Common Law) يُطلق على كلّ فعل أو تقصير يصدر من حائز العقار — كالمستأجر أو صاحب حقّ الانتفاع — فيؤدّي إلى انخفاض قيمته الماليّة. ويُقسَم إلى: إضرار فعليّ (voluntary waste) ناتج عن عمل إيجابي كالهدم أو التغيير الجوهري، وإضرار بالإهمال (permissive waste) ناتج عن التقصير في الصيانة والإصلاح"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نَقْصٌ في قيمة العَقار يلحقه بسبب تصرُّف المنتفع أو المستأجر تصرُّفاً مُضِرّاً، أو بسبب إهماله صيانة العقار والمحافظة عليه"

  examples:
    per_lemma:
      - lemma: "إِضْرَارٌ بِالمَالِ"
        examples:
          - text: "رفع المالك دعوى على المستأجر بتهمة الإضرار بالمال العقاريّ بعد أن أهمل صيانة السقف حتى تسرّبت المياه وأتلفت الجدران"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "رفع المالك دعوى على المستأجر بتهمة الإضرار بالمال العقاريّ بعد أن أهمل صيانة السقف حتى تسرّبت المياه وأتلفت الجدران"

