# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-01254711-n
# waste / permissive waste — (law) reduction in the value of an estate
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان عبارتان وصفيتان حرتان وليستا مصطلحتين مسكوكتين؛ يمكن إبدال مكوّناتهما بمرادفات (إضرار بالممتلكات / تبديد الأموال) دون تغيير المعنى"
      - "تبديد الممتلكات أقرب إلى مفهوم الاختلاس أو التصرّف في المحجوزات منه إلى انخفاض قيمة العقار بالفعل أو الإهمال"
      - "المفهوم (waste في القانون العام) مفهوم إنجليزي خاصّ لا نظير دقيق له في الفقه الإسلامي أو القانون المدني العربي"
      - "اللمّتان تفتقران إلى التشكيل الكامل"
    observations: "المجموعة تمثّل مفهوماً قانونياً من القانون العام (Common Law) يصف انخفاض قيمة العقار بفعل المستأجر أو المنتفع أو بإهماله. في القانون العربي يُعبَّر عن جزء من هذا المعنى بمصطلحات متفرقة كالإتلاف والإضرار والتعدي، لكن لا يوجد مصطلح واحد يجمع الفعل والإهمال معاً كما في waste الإنجليزي. اللمّتان الموجودتان تعبيران وصفيان مقبولان لكنّهما ليسا مصطلحين ثابتين مسجّلين."

  blind_candidates:
    - lemma: "إِتْلَاف"
      generation_method: ishtiqaq
      justification: "مصدر أَتْلَفَ على وزن إفعال من الجذر (تلف)، يدلّ على إحداث الهلاك والضرر في الشيء. يُستعمل في الفقه والقانون لوصف الفعل المؤدّي إلى تدمير المال أو إنقاص قيمته"
    - lemma: "إِهْدَار"
      generation_method: ishtiqaq
      justification: "مصدر أَهْدَرَ على وزن إفعال من الجذر (هدر) الدالّ على السقوط والإسقاط عند ابن فارس. يفيد إضاعة الشيء وإبطال قيمته، فيناسب معنى إنقاص قيمة العقار"
    - lemma: "تَضْيِيعُ العَقَارِ"
      generation_method: tarkib
      justification: "مركب إضافي من تضييع (مصدر ضَيَّعَ: أهمل وترك) والعقار. يجمع بين معنيَي الإهمال وانخفاض القيمة"
    - lemma: "تَعْيِيب"
      generation_method: ishtiqaq
      justification: "مصدر عَيَّبَ على وزن تفعيل من الجذر (عيب). يدلّ على إحداث العيب في الشيء، وهو انتقاص من قيمة المال بإيجاد خلل فيه"

stage2_evidence:
  per_lemma:
    - lemma: "إِضْرَار بِالمَالِ"
      confirm:
        - text: "«أضرار — damage»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«الضَّادُ وَالرَّاءُ ثَلَاثَةُ أُصُولٍ: الْأَوَّلُ خِلَافَ النَّفْعِ... فَالْأَوَّلُ الضَّرُّ: ضِدُ النَّفْعِ. وَيُقَالُ: ضَرَّهُ يَضُرُّهُ ضَرًّا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (ضرر) أصله خلاف النفع، والإضرار مصدر أضرّ أي ألحق الضرر"
        - text: "«(المَال) كل مَا يملكهُ الْفَرد أَو تملكه الْجَمَاعَة من مَتَاع أَو عرُوض تِجَارَة أَو عقار أَو نقود أَو حَيَوَان»"
          source: "المعجم الوسيط"
          addition: "المال شامل للعقار وغيره فالتعبير أعمّ من المطلوب"

    - lemma: "تَبْدِيدُ المُمْتَلَكَاتِ"
      contradicts:
        - text: "«فى القانون: يُطلق على التَّصَرُّف فى الأشياء المحجوزة قبل بيعها على يد المُحْضِر، تهرباً من وفاء الحقوق المحجوزة من أجلها»"
          source: "المعجم الوسيط"
          conflict: "التبديد في الاصطلاح القانوني العربي يعني التصرّف في المحجوزات تهرباً من التنفيذ، وهو مفهوم مختلف عن waste (انخفاض قيمة العقار بالفعل أو الإهمال)"
      expands:
        - text: "«(1) «أ» تفريق؛ تبديد. «ب» تفرّق؛ تبدّد. «ج» تبذير أو إسراف في الإنفاق»"
          source: "المورد الحديث (2008) — مادة dissipation"
          addition: "في الترجمة الإنجليزية العامة التبديد يقابل dissipation وليس waste بالمعنى القانوني العقاري"
        - text: "«تبديد، تبذير، إسراف — waste»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "في المصطلحات الاقتصادية يقابل التبديد waste بمعناه العام لا القانوني العقاري"
        - text: "«الْبَاءُ وَالدَّالُ فِي الْمُضَاعَفِ أَصْلٌ وَاحِدٌ، وَهُوَ التَّفَرُّقُ وَتَبَاعُدُ مَا بَيْنَ الشَّيْئَيْنِ. وَبَدَّدْتُ الشَّيْءَ: إِذَا فَرَّقْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي للتبديد هو التفريق لا إنقاص القيمة"

    - lemma: "إِتْلَاف"
      confirm:
        - text: "«(تَلَفَ) التَّاءُ وَاللَّامُ وَالْفَاءُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ ذَهَابُ الشَّيْءِ. يُقَالُ تَلِفَ يَتْلَفُ تَلَفًا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(1) سَلْب؛ نَهْب (2) إتلاف — spoliation»"
          source: "المورد الحديث (2008)"
        - text: "«دمار، إتلاف — ravage; devastation»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان"
      contradicts:
        - text: "«عملية حذف المعطيات من قرص أو غيره بحيث لا يمكن بعد ذلك استرجاع تلك المعطيات — scratch»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          conflict: "الإتلاف يدلّ على الإفناء التامّ لا على الانخفاض التدريجي في القيمة، وهو أضيق من waste الذي يشمل الإهمال أيضاً"

    - lemma: "إِهْدَار"
      confirm:
        - text: "«(هَدَرَ) الْهَاءُ وَالدَّالُ وَالرَّاءُ يَدُلُّ عَلَى سُقُوطِ شَيْءٍ وَإِسْقَاطِهِ... وَهَدَرَ السُّلْطَانُ دَمَ فُلَانٍ هَدْرًا: أَبَاحَهُ. وَبَنُو فُلَانٍ هَدَرَةٌ، أَيْ سَاقِطُونَ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(هَدَرَ) يَدُلُّ عَلَى سُقُوطِ شَيْءٍ وَإِسْقَاطِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدلّ على الإسقاط والإبطال مما يناسب معنى إضاعة القيمة، لكنّ الإهدار في الاستعمال المعاصر يغلب عليه معنى التبذير العامّ"

    - lemma: "تَضْيِيعُ العَقَارِ"
      evidence_status: "no_material_found"

    - lemma: "تَعْيِيب"
      expands:
        - text: "«(عَيَبَ) الْعَيْنُ وَالْيَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ... فَالْعَيْبُ فِي الشَّيْءِ مَعْرُوفٌ. تَقُولُ: عَابَ فُلَانٌ فُلَانًا يَعِيبُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على العيب المعروف لكنّ تعييب بمعنى إحداث العيب في العقار ليس مصطلحاً قانونياً مسجّلاً"

stage3_analysis:
  per_lemma:
    - lemma: "إِضْرَارٌ بِالمَالِ"
      decision: confirmed
      decision_reason: "تعبير عربي واضح الدلالة يجمع بين مفهوم الإضرار (الفعل أو الإهمال) والمال (الشامل للعقار). وإن كان تعبيراً وصفياً حراً وليس مصطلحاً مسكوكاً، فهو الأقرب إلى المفهوم القانوني المطلوب. يحتاج إلى تشكيل كامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على جانب الفعل الضارّ الموجَّه إلى المال عموماً (عقاراً كان أو منقولاً)، ويشمل الإهمال والفعل معاً بوصفهما سبباً للضرر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِضْرَارٌ بِالمَالِ"

    - lemma: "تَبْدِيدُ المُمْتَلَكَاتِ"
      decision: removed
      decision_reason: "التبديد في الاصطلاح القانوني العربي (المعجم الوسيط) يعني التصرّف في الأشياء المحجوزة قبل بيعها على يد المُحْضِر تهرّباً من الوفاء، وهو مفهوم مختلف جوهرياً عن waste (انخفاض قيمة العقار بالفعل أو الإهمال). استعمال هذا المصطلح يُوقع في لَبس قانوني خطير."
      evidence_assessment:
