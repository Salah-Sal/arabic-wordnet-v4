stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي جيد ويمثل ترجمة دقيقة للمفهوم الإنجليزي، ولكن يمكن تحسين صياغته ليكون أقرب لأسلوب المعاجم العربية بالاستفادة من تعريف (المعجم الكبير)."
    observations: "المفهوم يعبر عن التنظيم الاجتماعي للأفراد (Society). المفرَدة الأساسية والدقيقة في العربية المعاصرة هي (مُجْتَمَع). هناك ألفاظ قريبة مثل (أمة) و(شعب) لكنها تحمل دلالات سياسية أو عرقية مختلفة (Nation, People)."
  blind_candidates:
    - lemma: "مُجْتَمَع"
      generation_method: ishtiqaq
      justification: "اسم مكان من الفعل (اجتمع)، استُقر على استخدامه كمصطلح مقابل لـ Society ليدل على انتظام جماعة من الناس في إطار واحد."
    - lemma: "أُمَّة"
      generation_method: majaz
      justification: "من الألفاظ التراثية التي تدل على الجماعة من الناس تجمعهم روابط الدين أو اللغة أو الزمان، ويمكن أن تقارب المفهوم."
    - lemma: "شَعْب"
      generation_method: majaz
      justification: "لفظ عربي أصيل يدل على الجماعة العظيمة من الناس."
    - lemma: "كِيَان اجْتِمَاعِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يشير إلى الهيكل التنظيمي الذي يجمع الأفراد."

stage2_evidence:
  per_lemma:
    - lemma: "مُجْتَمَع"
      confirm:
        - text: "«المَجْتَمَعُ: مَوْضِعُ الاجتماع. الجماعة من النَّاس. مجموعةُ أفرادٍ يلتقون في صفات مشتركة, وهو نسق خاصّ تنتظم في إطاره العلاقات التي تربط الأفراد. ولكلِّ مجْتَمَعٍ ثقافته ونظمه وعاداته وتقاليده.»"
          source: "المعجم الكبير"
    - lemma: "أُمَّة"
      contradicts:
        - text: "«الأُمَّةُ: الجماعة ... الدِّينُ والمِلَّةُ ... (فى القانون): جماعة من الناس تجمعهم عناصر مشتركة كوحدة الأصل واللغة والعقيدة والتراث الفكرى، مما يجعلهم وحدة حضارية واحدة»"
          source: "المعجم الكبير"
          conflict: "تدل على القومية أو الرابطة الحضارية (Nation) أكثر من التنظيم الاجتماعي والاقتصادي البحت (Society)."
    - lemma: "شَعْب"
      contradicts:
        - text: "«الشَّعْب: الجماعة الكبيرة ترجع لأب واحد ... الجماعة من الناس تخضع لنظام اجتماعي واحد الجماعة تتكلم لساناً واحداً»"
          source: "المعجم الوسيط"
          conflict: "يشير غالباً إلى مجموعة الأفراد المنتمين لدولة أو قومية (People) وليس بالضرورة التنظيم الاجتماعي المجرد."
    - lemma: "كِيَان اجْتِمَاعِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُجْتَمَع"
      decision: confirmed
      decision_reason: "اللفظ هو المقابل الدقيق والمستقر للمفهوم (Society) في اللغة المعاصرة وعلم الاجتماع، وتؤيده المعاجم بوضوح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُجْتَمَع"
    - lemma: "أُمَّة"
      source: stage1
      decision: removed
      decision_reason: "اللفظ يقابل (Nation) ويشترط غالباً وحدة الأصل واللغة والدين، مما يضيق عن شمولية مفهوم (Society)."
      evidence_assessment:
        case: contradicts_only
    - lemma: "شَعْب"
      source: stage1
      decision: removed
      decision_reason: "اللفظ يقابل (People) ويشير إلى الكتلة البشرية وليس الهيكل التنظيمي للمجتمع."
      evidence_assessment:
        case: contradicts_only
    - lemma: "كِيَان اجْتِمَاعِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر يمكن صياغته بأشكال متعددة، وليس مصطلحاً مسكوكاً مستقراً."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "مجموعة اجتماعية ممتدة لها تنظيم ثقافي واقتصادي مميز"
    assessment:
      decision: revise
      reason: "صياغة التعريف الحالي ركيكة قليلاً، ويمكن دمجها مع دقة (المعجم الكبير) لإنتاج تعريف مصطلحي أوضح."
    authored:
      - type: terminological
        text: "مجموعة كبيرة من الأفراد يعيشون معاً ضمن نسق منظَّم، وتربطهم علاقات ومصالح مشتركة، ولهم تنظيم ثقافي واقتصادي واجتماعي مميز."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة كبيرة من الأفراد يعيشون معاً ضمن نسق منظَّم، وتربطهم علاقات ومصالح مشتركة، ولهم تنظيم ثقافي واقتصادي واجتماعي مميز."
  examples:
    per_lemma:
      - lemma: "مُجْتَمَع"
        examples:
          - text: "يلعب التعليم دوراً أساسياً في بناء مُجْتَمَع متماسك ومتقدم."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يلعب التعليم دوراً أساسياً في بناء مُجْتَمَع متماسك ومتقدم."

stage5_enrichment:
  per_entry:
    - lemma: "مُجْتَمَع"
      entry_id: "{auto}"
      root: "جمع"
      maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ. يُقَالُ جَمَعْتُ الشَّيْءَ جَمْعًا.»"
  per_sense:
    - lemma: "مُجْتَمَع"
      sense_id: "{auto}"
      nuance: "المصطلح الأعم والأدق للإشارة إلى المجتمع الإنساني المنظم بمؤسساته وعلاقاته."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جمع","maqayis":"«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ. يُقَالُ جَمَعْتُ الشَّيْءَ جَمْعًا.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الأعم والأدق للإشارة إلى المجتمع الإنساني المنظم بمؤسساته وعلاقاته.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
