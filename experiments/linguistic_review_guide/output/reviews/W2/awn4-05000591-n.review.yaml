stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (ملوحة) تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي مقبول ولكنه يميل إلى الأسلوب الوصفي البسيط، ويمكن تحسينه ليصبح أكثر دقة معجمية."
    observations: "تعد ملمة 'مُلُوحة' المصطلح الأساسي والأكثر شيوعاً للتعبير عن خاصية احتواء الملح في العربية المعاصرة والقديمة. المصطلح الإنجليزي saltiness يشير إلى الخاصية الفيزيائية أو المذاقية، وهو ما تغطيه اللمة المقترحة بشكل دقيق."
  blind_candidates:
    - lemma: "مُلُوحَة"
      generation_method: ishtiqaq
      justification: "المصدر القياسي للفعل (مَلُحَ) بمعنى صار ملحاً، وهي اللفظة المباشرة للخاصية المطلوبة."
    - lemma: "مَلَاحَة"
      generation_method: ishtiqaq
      justification: "وردت في المعاجم القديمة (مثل لسان العرب) كمصدر للفعل مَلُحَ بنفس معنى ملوحة، وإن كانت غلبت عليها معانٍ أخرى حديثاً."
    - lemma: "إِمْلَاح"
      generation_method: ishtiqaq
      justification: "مصدر الفعل (أملح) بمعنى جعل الشيء مالحاً، وقد تستخدم للتعبير عن الحالة الناتجة عن ذلك."
    - lemma: "تَمَلُّح"
      generation_method: ishtiqaq
      justification: "يعبر عن عملية اكتساب الملوحة أو تراكم الأملاح، وهو قريب من المعنى الوصفي للخاصية."

stage2_evidence:
  per_lemma:
    - lemma: "مُلُوحَة"
      confirm:
        - text: "«وقد مَلُحَ مُلُوحة ومَلاحة ومَلَح يَمْلَح مُلوحاً»"
          source: "لسان العرب"
        - text: "«مستوى تركز الأملاح في الماء أو التربة. يتركز الاهتمام عموما على تركز كلوريد الصوديوم (ملح الطعام).»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«كمية المواد الصلبة(الأملاح) الذائبة في الماء»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
    - lemma: "مَلَاحَة"
      confirm:
        - text: "«وقد مَلُحَ مُلُوحة ومَلاحة...»"
          source: "لسان العرب"
      contradicts:
        - text: "«(الملاحة) حِرْفَة الملاح»"
          source: "المعجم الوسيط"
          conflict: "المعنى الغالب حالياً هو الحرفة أو الملاحة البحرية."
        - text: "«الملاحة: الجمال وحسن المظهر»"
          source: "موسوعة السلطان قابوس"
          conflict: "تستخدم الملاحة غالباً للجمال المعنوي أو الحسي للوجه."
    - lemma: "تَمَلُّح"
      confirm:
        - text: "«عملية تراكم الأملاح في التربة.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«زيادة صافية في محتوى التربة من الملح، وهو ما يؤدى إلى انخفاض الإنتاجية.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يؤكد أن المصطلح يشير للعملية الفيزيائية لتراكم الملح."
    - lemma: "إِمْلَاح"
      confirm:
        - text: "«وأَمْلَحَ الماءُ أَيْضًا... وَقَدْ عَادَ عَذْبُ الْمَاءِ مِلْحًا فَزَادَنِي... أَنْ أَمْلَحَ الْمَشْرَبُ الْعَذْبُ»"
          source: "مقاييس اللغة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "ملوحة"
      decision: confirmed
      decision_reason: "المصطلح المعياري والدقيق للتعبير عن خاصية احتواء الملح، وهو مدعوم بقوة في المعاجم القديمة والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُلُوحَة"
    - lemma: "مَلَاحَة"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من صحتها لغوياً كمصدر للفعل (مَلُحَ)، إلا أن اشتراكها اللفظي مع معاني الملاحة البحرية والجمال يجعلها غير ملائمة كمرادف تقني في هذا السياق المعاصر."
    - lemma: "تَمَلُّح"
      source: stage1
      decision: removed
      decision_reason: "يشير المصطلح إلى العملية (Salinization) وليس إلى الخاصية الجوهرية (Saltiness) المطلوبة في هذه المجموعة."
    - lemma: "إِمْلَاح"
      source: stage1
      decision: removed
      decision_reason: "مصدر للفعل المتعدي، ولا يشيع استخدامه للتعبير عن الخاصية الذاتية للمحلول."

stage4_content:
  definition:
    current: "خاصية احتواء الملح (كمركب أو في محلول)"
    assessment:
      decision: revise
      reason: "التعريف الحالي يفتقر إلى الصياغة المعجمية الرصينة، ويمكن دمجه مع مفهوم التركز الملحي."
    authored:
      - type: terminological
        text: "صِفَةُ مَا كَانَ مَالِحاً، وَتُعَبِّرُ عَنْ مِقْدَارِ تَرَكُّزِ الأَمْلَاحِ الذَّائِبَةِ فِي مَادَّةٍ أَوْ مَحْلُولٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صِفَةُ مَا كَانَ مَالِحاً، وَتُعَبِّرُ عَنْ مِقْدَارِ تَرَكُّزِ الأَمْلَاحِ الذَّائِبَةِ فِي مَادَّةٍ أَوْ مَحْلُولٍ."
  examples:
    per_lemma:
      - lemma: "مُلُوحَة"
        examples:
          - text: "تزداد ملوحة مياه البحر الميت بسبب التبخر العالي وقلة الموارد المائية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تزداد ملوحة مياه البحر الميت بسبب التبخر العالي وقلة الموارد المائية."

stage5_enrichment:
  per_entry:
    - lemma: "مُلُوحَة"
      entry_id: "{auto}"
      root: "ملح"
      maqayis_quote: "«الْمِيمُ وَاللَّامُ وَالْحَاءُ أَصْلٌ صَحِيحٌ لَهُ فُرُوعٌ تَتَقَارَبُ فِي الْمَعْنَى... فَالْأَصْلُ الْبَيَاضُ، مِنْهُ الْمِلْحُ الْمَعْرُوفُ، وَسُمِّيَ لِبَيَاضِهِ.»"
  per_sense:
    - lemma: "مُلُوحَة"
      sense_id: "{auto}"
      nuance: "تعبر عن الدرجة الكمية أو الخاصية الكيفية لوجود الملح."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ملح","maqayis":"«الْمِيمُ وَاللَّامُ وَالْحَاءُ أَصْلٌ صَحِيحٌ لَهُ فُرُوعٌ تَتَقَارَبُ فِي الْمَعْنَى... فَالْأَصْلُ الْبَيَاضُ، مِنْهُ الْمِلْحُ الْمَعْرُوفُ، وَسُمِّيَ لِبَيَاضِهِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبر عن الدرجة الكمية أو الخاصية الكيفية لوجود الملح.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
