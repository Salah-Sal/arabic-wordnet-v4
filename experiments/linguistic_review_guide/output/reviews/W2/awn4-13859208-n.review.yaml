# مراجعة المجموعة الترادفية: awn4-13859208-n (competition)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم «يتنافس» وهو من جذر اللمّة ذاتها (نفس)، مما يُوقع في الدور المعجمي"
      - "المجموعة تحتوي لمّة واحدة فقط (مُنَافَسَة) رغم ثراء الحقل الدلالي للمفهوم في العربية"
    observations: "المفهوم — علاقة تجارية تنافسية — مفهوم أصيل في الثقافة العربية وله جذور معجمية عميقة. الجذر «نفس» ينتج عدة مشتقات تغطي أوجه التنافس المختلفة. التعريف الحالي مقبول دلالياً لكنه يقع في دور معجمي باستخدام مشتق من نفس الجذر."
  blind_candidates:
    - lemma: "تَنَافُس"
      generation_method: ishtiqaq
      justification: "مصدر تَفَاعَلَ من الجذر «نفس» على وزن تَفَاعُل الدال على التشارك والتبادل، وهو الأنسب للدلالة على تسابق الطرفين"
    - lemma: "مُزَاحَمَة"
      generation_method: ishtiqaq
      justification: "مصدر فَاعَلَ من الجذر «زحم» على وزن مُفَاعَلَة، يدل على مدافعة كل طرف الآخرَ في طلب الشيء"
    - lemma: "مُغَالَبَة"
      generation_method: ishtiqaq
      justification: "مصدر فَاعَلَ من الجذر «غلب» على وزن مُفَاعَلَة، يدل على محاولة كل طرف التفوق على الآخر"
    - lemma: "مُبَارَاة"
      generation_method: ishtiqaq
      justification: "مصدر فَاعَلَ من الجذر «بري» على وزن مُفَاعَلَة، يدل على مجاراة الطرفين ومحاولة كل منهما بلوغ ما بلغه الآخر"

stage2_evidence:
  per_lemma:
    - lemma: "مُنَافَسَة"
      confirm:
        - text: "«المُنَافَسَةُ: السَّعْي فِي أَن يبلغ إِلَى مثل خير يصل إِلَى غَيره»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«المنافسة: مجاهدة النفس للتشبه بالإفاضل، واللحوق بهم من غير إدخال ضرر على غيره»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(المنافسة) التنافس»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«المُنَافَسَةُ — التَّنَافس»"
          source: "المعجم الوسيط (OCR)"
        - text: "«منافسة — competition» (مجالات: التجارة والمحاسبة، الاقتصاد، القانون، علم الاجتماع، الفلسفة)"
          source: "معاجم ARABTERM الموحدة"
        - text: "«التنافس بين الأفراد من أجل الحصول على كمية أكبر من شيء نادر»"
          source: "مسرد المناخ والبيئة (ARABTERM)"
      expands:
        - text: "«كل عمل منافسة يتنافى وأعراف الشرف في الميدان الصناعي أو التجاري كتقليد العلامات التجارية أو التشهير بالغير المنافس أو إغراء أجراء المنافس…»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يوضح المفهوم القانوني للمنافسة غير المشروعة، مما يؤكد استعمال المنافسة في السياق التجاري"
        - text: "«مجموع القواعد القانونية المنظمة للمنافسة الحرة والنـزيهة بين المقاولات التجارية»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — قانون المنافسة"
          addition: "يثبت أن المنافسة مصطلح قانوني-تجاري راسخ"

    - lemma: "تَنَافُس"
      confirm:
        - text: "«(التنافس) نَزعَة فطرية تَدْعُو إِلَى بذل الْجهد فِي سَبِيل التَّشَبُّه بالعظماء واللحوق بهم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«(تنافس) الْقَوْم فِي كَذَا تسابقوا فِيهِ وتباروا دون أَن يلْحق بَعضهم الضَّرَر بِبَعْض وَفِي التَّنْزِيل الْعَزِيز {وَفِي ذَلِك فَلْيَتَنَافَس الْمُتَنَافسُونَ}»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«تَنافُس — competition» (المعجم الطبي الموحد)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تنافس — competing: شكل من أشكال النزاع تغلب فيه احتياجات الفرد على احتياجات الآخرين»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«(1) تنافس؛ منافسة؛ مزاحمة — competition»"
          source: "المورد الحديث (2008)"
        - text: "«تنافُس؛ منافَسة — rivalry»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«وَشَيْءٌ نَفِيسٌ، أَيْ ذُو نَفْسٍ وَخَطَرٍِ يُتَنَافَسُ بِهِ. وَالتَّنَافُسُ: أَنْ يُبْرِزَ كُلُّ وَاحِدٍ مِنَ الْمُتَبَارِزَيْنِ قُوَّةَ نَفْسِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُرجع التنافس إلى إبراز قوة النفس، مما يربط المعنى بالأصل الاشتقاقي"

    - lemma: "مُزَاحَمَة"
      contradicts:
        - text: "«مزاحمة — crowding out: ميل الحكومة الاتحادية، من خلال تمويل العجز، إلى التنافس مع الشركات أو الأشخاص على الأموال المقترضة»"
          source: "مسرد المناخ والبيئة (ARABTERM)"
          conflict: "المزاحمة مصطلح اقتصادي بمعنى الإزاحة (crowding out) لا المنافسة التجارية العامة"
      expands:
        - text: "«(زَحَمَ) الزَّاءُ وَالْحَاءُ وَالْمِيمُ أَصْلٌ يَدُلُّ عَلَى انْضِمَامٍ فِي شِدَّةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدل على الازدحام المادي لا التسابق التجاري"

    - lemma: "مُغَالَبَة"
      evidence_status: "no_material_found"

    - lemma: "مُبَارَاة"
      contradicts:
        - text: "«(1) تنافس؛ منافسة؛ مزاحمة — competition (2) «أ» مباراة chess competition»"
          source: "المورد الحديث (2008)"
          conflict: "المباراة تُستعمل للمسابقات الرياضية والفكرية لا للعلاقات التجارية"

stage3_analysis:
  per_lemma:
    - lemma: "مُنَافَسَة"
      decision: confirmed
      decision_reason: "لمّة راسخة مؤيَّدة بعشرات المصادر المعجمية الكلاسيكية والحديثة والاصطلاحية. مُنَافَسَة هي المصطلح المعياري في مجالات التجارة والاقتصاد والقانون وعلم الاجتماع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُركّز على فعل السعي من جانب الفاعل تجاه ما عند غيره (وزن مُفَاعَلَة)، وتُستعمل في السياقات الرسمية والقانونية والتجارية بوصفها المصطلح المعياري"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنَافَسَة"

    - lemma: "تَنَافُس"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر تَفَاعُل مؤيَّد بالمعجم الوسيط ومقاييس اللغة والمعاجم الاصطلاحية. يُستعمل مرادفاً للمنافسة في التجارة والطب والبيئة، ويُبرز البعد التبادلي للتنافس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز التبادلية والاشتراك بين الطرفين (وزن تَفَاعُل)، ويُستعمل في السياقات العامة والعلمية أكثر من السياقات القانونية"
      actions:
        - command: create_entry
          params: {lemma: "تَنَافُس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُزَاحَمَة"
      source: stage1
      decision: removed
      decision_reason: "المزاحمة في الاستعمال الاصطلاحي الحديث تعني الإزاحة (crowding out) لا المنافسة التجارية العامة. وأصلها الاشتقاقي يدل على الازدحام المادي لا التسابق في كسب العملاء."

    - lemma: "مُغَالَبَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تدعم استعمالها في سياق العلاقات التجارية. المغالبة تدل على محاولة الغلبة والقهر، وهي أقرب إلى الصراع منها إلى التنافس التجاري المنظّم."

    - lemma: "مُبَارَاة"
      source: stage1
      decision: removed
      decision_reason: "المباراة في الاستعمال المعاصر مخصصة للمسابقات الرياضية والفكرية (chess competition)، ولا تُستعمل للدلالة على العلاقة التجارية التنافسية."

