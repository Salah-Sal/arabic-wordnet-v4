# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة غير مشكولة (شودرا)."
      - "المصطلح تعريبي لمدلول ثقافي هندي متخصص، مما يجعل الترشيح اللغوي المحض صعباً دون اللجوء للتعريب."
    observations: "المفهوم يشير إلى الطبقة الرابعة في نظام الفارنا الهندوسي. المصطلح العربي القياسي هو تعريب للفظ السنسكريتي (Shudra)."
  blind_candidates:
    - lemma: "شُودْرَا"
      generation_method: taarib
      justification: "التعريب المباشر للفظ السنسكريتي وهو الأكثر شيوعاً في الأدبيات العربية المعاصرة."
    - lemma: "سُودْرَا"
      generation_method: taarib
      justification: "تنويع تعريبي شائع (بالسين بدلاً من الشين) يظهر في بعض الترجمات."
    - lemma: "طَبَقَةُ الشُّودْرَا"
      generation_method: tarkib
      justification: "تعبير مركب يحدد طبيعة اللفظ كمصطلح اجتماعي طبقي."
    - lemma: "الخَدَمُ والمِهَنِيُّون"
      generation_method: tarkib
      justification: "تعبير وصفي مستمد من الوظيفة الدلالية للطبقة في النظام الهندوسي."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "شودرا"
      evidence_status: "no_material_found"
    - lemma: "شُودْرَا"
      evidence_status: "no_material_found"
    - lemma: "سُودْرَا"
      evidence_status: "no_material_found"
    - lemma: "طَبَقَةُ الشُّودْرَا"
      evidence_status: "no_material_found"
    - lemma: "البراهمة"
      confirm:
        - text: "«البراهمةُ: إحدى طوائف المجتمع الهندىّ الأَرْبعة (البراهمة، والنبلاء، والبرجوازيون، والحِرَفِيُّون).»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      expands:
        - text: "«منهم: براهمة، وهي: فرقة قليلة العدد، ومذهبهم إبطال النبوات، وتحريم ذبح الحيوان.»"
          source: "كشف الظنون"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "شودرا"
      decision: confirmed
      decision_reason: "المصطلح التعريبي الوحيد المقبول والمستخدم لوصف هذه الطبقة الاجتماعية المحددة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شُودْرَا"
    - lemma: "سُودْرَا"
      source: stage1
      decision: confirmed
      decision_reason: "تنويع هجائي مستخدم ومقبول في تعريب المصطلح السنسكريتي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سُودْرَا", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08324370-n"}
    - lemma: "طَبَقَةُ الشُّودْرَا"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير اصطلاحي مركب شائع في الدراسات الأنثروبولوجية والاجتماعية العربية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "طَبَقَةُ الشُّودْرَا", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08324370-n"}

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "أدنى الطبقات الأربع: الخدم والعمال ذوو المكانة المتدنية"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب ويحتاج لربطه بالسياق الثقافي الهندوسي (الفارنا) لزيادة الدقة."
    authored:
      - type: encyclopedic
        text: "إحدى الطبقات الأربع في النظام الاجتماعي الهندوسي التقليدي (الفارنا)، وهي أدنى هذه الطبقات، وتضمّ العمّال والخدم وأصحاب الحِرَف اليدوية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08324370-n", definition_index: 0, text: "إحدى الطبقات الأربع في النظام الاجتماعي الهندوسي التقليدي (الفارنا)، وهي أدنى هذه الطبقات، وتضمّ العمّال والخدم وأصحاب الحِرَف اليدوية."}

  examples:
    per_lemma:
      - lemma: "شُودْرَا"
        examples:
          - text: "يُحظر في القانون الهندوسي القديم على الشُّودْرَا قراءة الكتب المقدسة."
            type: usage
      - lemma: "سُودْرَا"
        examples:
          - text: "كانت السُّودْرَا تُكلف بالأعمال الشاقة وخدمة الطبقات الأعلى."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-08324370-n", text: "تُعدّ الشُّودْرَا الطبقة الرابعة في نظام الفارنا الهندوسي الذي يقسم المجتمع إلى أربع مراتب."}

