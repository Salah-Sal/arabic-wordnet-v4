# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-10557711-n
# synset: a person who romps or frolics — شخص يمرح أو يلهو
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المُفارَق الدلالي بين «المرح» و«اللهو» في اللغة العربية أوسع مما يوحي به الترادف: اللهو قد يشمل الغفلة والانشغال عن الجادّ، بينما المرح نشاط فرح بريء"
      - "لفظة «لَاهٍ» شديدة الالتباس مع اسم الجلالة «لاه» في كثير من المعاجم، مما يثير إشكالاً صرفياً ودلالياً"
      - "الأب الدلالي (hypernym) هو «عامل/فاعل» بمعنى مَن يفعل، وهو عامّ جداً لكنه مقبول في بنية ووردنت"
    observations: "المجموعة تصف شخصاً يمرح ويلهو، أي يقوم بفعل المرح أو اللهو. اللمّتان الحاليّتان اسما فاعل من الفعلين (مَرِحَ → مَارِح، لَهَا → لَاهٍ). الحقل الدلالي يشمل ألفاظاً مثل: طَرُوب، مِمْرَاح، لَاعِب، عَابِث. لكن ينبغي التمييز بين مَن يمرح مرحاً بريئاً ومَن يلهو لهواً قد يتضمن غفلة."

  blind_candidates:
    - lemma: "مِمْرَاح"
      generation_method: ishtiqaq
      justification: "على وزن مِفْعَال من الجذر م ر ح، صيغة مبالغة تدل على كثرة المرح والنشاط، وردت في المعاجم لوصف الفَرَس النشيط ويصح استعمالها للإنسان"
    - lemma: "طَرُوب"
      generation_method: ishtiqaq
      justification: "على وزن فَعُول من الجذر ط ر ب، تدل على مَن سَرُعَ تأثُّرُه بما يُطرِب فاهتزّ له، قريبة من معنى المرح والنشاط"
    - lemma: "لَاعِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من لَعِبَ يَلْعَبُ، يدل على مَن يلعب ويلهو، قريب من معنى المرح واللهو في الاستعمال العام"
    - lemma: "عَابِث"
      generation_method: ishtiqaq
      justification: "اسم فاعل من عَبِثَ يَعْبَثُ، يدل على مَن يعبث ويلهو، لكنه يحمل ظلالاً سلبية أكثر من المرح"


stage2_evidence:
  per_lemma:
    - lemma: "لَاهٍ"
      confirm:
        - text: "«(لَهَوَ) اللَّامُ وَالْهَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى شُغْلٍ عَنْ شَيْءٍ بِشَيْءٍ... فَالْأَوَّلُ اللَّهْوُ، وَهُوَ كُلُّ شَيْءٍ شَغَلَكَ عَنْ شَيْءٍ، فَقَدْ أَلْهَاكَ. وَلَهَوْتُ مِنَ اللَّهْوِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«(لاه) اسم الله تعالى أصلها لاه ثم أدخلت الألف واللام للتعظيم»"
          source: "مقاييس اللغة (OCR)"
          conflict: "لفظة «لاه» في أغلب المعاجم تحيل إلى اسم الجلالة لا إلى اسم الفاعل من لَهَا/يلهو"
        - text: "«(لاه) السراب لوها ولوهانا اضطرب وبرق»"
          source: "المعجم الوسيط"
          conflict: "الفعل لاه في المعجم الوسيط يُسند إلى السراب (لاه السراب) لا إلى الشخص اللاهي"
      expands:
        - text: "«اللهو: الشيء الذي يلتذ به الإنسان ثم ينقضي. وقيل ما يشغل الإنسان عما يعنيه ويهمه. قال الطرطوشي: وأصل اللهو الترويح عن النفس بما لا تقتضيه الحكمة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "اللهو يتضمن معنى الانشغال عن الجادّ والترويح، وهو أوسع من مجرد المرح"

    - lemma: "مَارِح"
      confirm:
        - text: "«مَارِح: من (م ر ح) من اشتد فرحه ونشاطه، والمختال، والسحاب الذي يرسل المطر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«المَرَحُ: شدة الفرح، والنشاط. وقد مَرِحَ بالكسر، فهو مَرِحٌ ومريح بالتشديد»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«(مَرِحَ) الْمِيمُ وَالرَّاءُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى مَسَرَّةٍ لَا يَكَادُ يَسْتَقِرُّ مَعَهَا طَرَبًا. وَمَرِحَ يَمْرَحُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(1) «أ» يَقْصُف؛ يلهو على نحو صاخب. «ب» يَمْرَح... (4) فتاةٌ لعوبٌ... (5) قَصْفٌ؛ مَرَح صاخب»"
          source: "المورد الحديث (romp)"
          addition: "الترجمة الإنجليزية romp تُقابَل بـ«يمرح» و«يقصف» مما يؤكد ملاءمة مارِح للمفهوم"

    - lemma: "مِمْرَاح"
      confirm:
        - text: "«وفرسٌ مِمْراحٌ ومَروحٌ، أي نشيطٌ. وقد أمْرَحهُ الكلأُ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«وَفَرَسٌ مِمْرَاحٌ وَمَرُوحٌ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«وَيَقُولُونَ: عَيْنٌ مِمْرَاحٌ: غَزِيرَةُ الدَّمْعِ. وَهَذَا بَعْضُ قِيَاسِ الْبَابِ، لِأَنَّهُمْ ذَهَبُوا فِيهِ إِلَى مَا قُلْنَاهُ مِنْ قِلَّةِ الِاسْتِقْرَارِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "صيغة مِفعال تدل على المبالغة في قلة الاستقرار والنشاط، استُعملت للفرس والعين"

    - lemma: "طَرُوب"
      contradicts:
        - text: "«(الطروب) السَّرِيع الهزة والتأثر بِمَا يطرب (ج) طراب»"
          source: "المعجم الوسيط"
          conflict: "الطَّرُوب مخصوص بالتأثر بالطرب (الغناء والموسيقى) لا بالمرح واللهو العام"

    - lemma: "لَاعِب"
      confirm:
        - text: "«(1) يلهو؛ يَمْرح (2) لَهْو (ا.ق)»"
          source: "المورد الحديث (disport)"
      contradicts:
        - text: "«(5) «أ» الرياضيّ: اللاعب الرياضيّ»"
          source: "المورد الحديث (sport)"
          conflict: "لَاعِب في الاستعمال المعاصر يغلب عليه معنى اللاعب الرياضي لا المَرِح اللاهي"

    - lemma: "عَابِث"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "لَاهٍ"
      decision: confirmed
      decision_reason: "اسم فاعل صحيح من لَهَا يَلْهُو بمعنى انشغل بما يُسلّي ويُمتِع. رغم التباس الشكل مع اسم الجلالة «لاه»، فإن التشكيل الكامل «لَاهٍ» (بالتنوين والكسر) يميّزه تماماً. ودلالته على مَن يلهو مستقرة صرفياً"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على مَن يلهو، أي ينشغل بما يُسلّيه ويُمتعه مع ظلال الغفلة عن الجادّ، بخلاف مَارِح الذي يركّز على النشاط والفرح البريء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاهٍ"

    - lemma: "مَارِح"
      decision: confirmed
      decision_reason: "اسم فاعل من مَرِحَ يَمْرَحُ، موثّق في موسوعة السلطان قابوس بمعنى «من اشتد فرحه ونشاطه». الجذر م ر ح مُجمَع على دلالته على المَسَرَّة والنشاط في المعاجم الكلاسيكية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على مَن اشتد فرحه ونشاطه حتى لا يكاد يستقر طَرَباً، وهو أقرب إلى المرح الحركي البريء بخلاف لَاهٍ الذي يتضمن الانشغال عن الجادّ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَارِح"

    - lemma: "مِمْرَاح"
      source: stage1
      decision: removed
      decision_reason: "صيغة مِفعال وردت في المعاجم أساساً لوصف الفَرَس النشيط والعين الغزيرة الدمع، ولم يُعثَر على شاهد لاستعمالها صفةً للإنسان الذي يمرح. بقاء «مَارِح» يُغني عنها من نفس الجذر"

    - lemma: "طَرُوب"
      source: stage1
      decision: removed
      decision_reason: "الطَّرُوب مخصوص بمعنى سريع التأثر بالطرب والغناء، وهذا أضيق من مفهوم المرح واللهو العام المقصود في المجموعة"

    - lemma: "لَاعِب"
      source: stage1
      decision: removed
      decision_reason: "لفظة «لاعِب» في الاستعمال المعاصر يغلب عليها معنى اللاعب الرياضي، مما يُحدث التباساً دلالياً مع المعنى المقصود (المرح واللهو)"

    - lemma: "عَابِث"
      source: stage1
      decision: removed
      decision_reason: "العَابِث يحمل ظلالاً سلبية قوية (العبث بمعنى اللعب بلا غاية أو الإفساد)، ولا يناسب المرح البريء المقصود. كما لم يُعثر على أدلة معجمية تربطه بمفهوم المرح"


