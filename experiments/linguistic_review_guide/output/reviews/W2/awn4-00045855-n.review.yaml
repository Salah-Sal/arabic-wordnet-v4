  per_entry:
    - lemma: "مِيتْزْفَاه"
      entry_id: "{auto}"
      note: '{"origin": "Hebrew (mitzvah)", "transliteration": true}'
    - lemma: "فَرِيضَة"
      entry_id: "{auto}"
      root: "فرض"
      maqayis_quote: "«الْفَاءُ وَالرَّاءُ وَالضَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَأْثِيرٍ فِي شَيْءٍ مِنْ حَزٍّ أَوْ غَيْرِهِ... وَمِنَ الْبَابِ اشْتِقَاقُ الْفَرْضِ الَّذِي أَوْجَبَهُ اللَّهُ تَعَالَى.»"
    - lemma: "وَصِيَّة"
      entry_id: "{auto}"
      root: "وصي"
      maqayis_quote: "«الْوَاوُ وَالصَّادُ وَالْحَرْفُ الْمُعْتَلُّ: أَصْلٌ يَدُلُّ عَلَى وَصْلِ شَيْءٍ بِشَيْءٍ... وَالْوَصِيَّةُ مِنْ هَذَا الْقِيَاسِ، كَأَنَّهُ كَلَامٌ يُوصَى أَيْ يُوصَلُ.»"
    - lemma: "قُرْبَة"
      entry_id: "{auto}"
      root: "قرب"
      maqayis_quote: "«الْقَافُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الْبُعْدِ... وَالْقُرْبَانُ: مَا قُرِّبَ إِلَى اللَّهِ تَعَالَى مِنْ نَسِيكَةٍ أَوْ غَيْرِهَا.»"

