stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "ميتزفاه" غير مشكولة.
      - الاكتفاء بلمة واحدة معربة في حين أن المفهوم له مرادفات عربية أصيلة مستخدمة في الأدبيات العربية واليهودية-العربية.
    observations: "المصطلح يشير إلى مفهوم مركزي في اليهودية، وهو يجمع بين معنى الواجب الشرعي والعمل الصالح. اللفظ العبري 'ميتزفاه' هو الأشيع في السياقات الأكاديمية والترجمة المباشرة، لكن المصطلحات العربية 'فريضة' و'وصية' و'قربة' تغطي الجوانب الدلالية للمصطلح بدقة عالية."
  blind_candidates:
    - lemma: "مِيتْزْفَاه"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح العبري، وهو الأكثر شيوعاً في الدراسات الدينية المقارنة."
    - lemma: "فَرِيضَة"
      generation_method: majaz
      justification: "المصطلح التقني الذي استخدمه علماء اليهودية الناطقون بالعربية (مثل موسى بن ميمون في كتابه 'كتاب الفرائض') للتعبير عن الميتزفاه."
    - lemma: "وَصِيَّة"
      generation_method: ishtiqaq
      justification: "المقابل الاشتقاقي والدلالي المباشر للجذر العبري (ṣ-w-h)، ويستخدم للدلالة على الأوامر الإلهية."
    - lemma: "قُرْبَة"
      generation_method: ishtiqaq
      justification: "تصف العمل الذي يتقرب به العبد إلى الله، وهو جوهر تعريف الميتزفاه كعمل صالح بدافع الواجب."

stage2_evidence:
  per_lemma:
    - lemma: "ميتزفاه"
      confirm:
        - text: "«ميتزفاه: أَمْر؛ وصيّة [في اليهودية].»"
          source: "المورد الحديث"
    - lemma: "فَرِيضَة"
      confirm:
        - text: "«(الْفَرِيضَة) مَا أوجبه الله على عباده من حُدُوده الَّتِي بَينهَا بِمَا أَمر بِهِ وَمَا نهى عَنهُ.»"
          source: "المعجم الوسيط"
        - text: "«الفريضة: فعيلة من الفرض وهو في اللغة التقدير، وفي الشرع: ما ثبت بدليل مقطوع.»"
          source: "التعريفات للجرجاني"
    - lemma: "وَصِيَّة"
      confirm:
        - text: "«(1) أمر؛ وصيّة (2) إحدى الوصايا العشر.»"
          source: "المورد الحديث"
        - text: "«الوصايا العَشْر: وصايا الله لموسى على جبل سيناء.»"
          source: "المورد الحديث"
    - lemma: "قُرْبَة"
      confirm:
        - text: "«القُرْبَةُ: ما يُتَقَرَّبُ به إلى الله تعالى من أعمال البِرِّ والطَّاعَةِ.»"
          source: "المعجم الوسيط"
        - text: "«القُربة: بالضم وبضمتين ما يُتقرب به إلى الله تعالى من أعمال البرِّ والطاعة أو فعل ما يثاب عليه.»"
          source: "التعريفات الفقهية"

stage3_analysis:
  per_lemma:
    - lemma: "ميتزفاه"
      decision: confirmed
      decision_reason: "المصطلح المعرّب ضروري للإشارة إلى المفهوم بخصوصيته الثقافية العبرية، وهو مستخدم في القواميس الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيتْزْفَاه"
    - lemma: "فَرِيضَة"
      source: stage1
      decision: confirmed
      decision_reason: "هو المصطلح التاريخي والتقني الذي استخدمه الفلاسفة والفقهاء اليهود الناطقون بالعربية، كما في أعمال موسى بن ميمون."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَرِيضَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "وَصِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تشير إلى الجانب التشريعي (Commandment) وهي المقابل اللغوي المباشر للأصل العبري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "وَصِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "قُرْبَة"
      source: stage1
      decision: confirmed
      decision_reason: "تغطي الجانب الأخلاقي والروحي للعمل الصالح الذي يبتغي به فاعله وجه الله."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "قُرْبَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "(في اليهودية) عمل صالح يتم أداؤه بدافع الواجب الديني"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق لكن يمكن تحسينه ليكون أكثر شمولاً للجوانب التشريعية (الوصايا) والأخلاقية."
    authored:
      - type: terminological
        text: "فَرِيضَةٌ أَوْ عَمَلٌ صَالِحٌ يَقُومُ بِهِ الْيَهُودِيُّ بِدَافِعِ الْوَاجِبِ الدِّينِيِّ، وَتُطْلَقُ غَالِبًا عَلَى الْوَصَايَا الَّتِي أَمَرَ بِهَا اللهُ فِي التَّوْرَاةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "فَرِيضَةٌ أَوْ عَمَلٌ صَالِحٌ يَقُومُ بِهِ الْيَهُودِيُّ بِدَافِعِ الْوَاجِبِ الدِّينِيِّ، وَتُطْلَقُ غَالِبًا عَلَى الْوَصَايَا الَّتِي أَمَرَ بِهَا اللهُ فِي التَّوْرَاةِ."}

  examples:
    per_lemma:
      - lemma: "مِيتْزْفَاه"
        examples:
          - text: "يُؤَدِّي الْيَهُودِيُّ الْمِيتْزْفَاه طَاعَةً لِلأَوَامِرِ الإِلَهِيَّةِ."
            type: usage
      - lemma: "فَرِيضَة"
        examples:
          - text: "تُعَدُّ مُسَاعَدَةُ الْفُقَرَاءِ فَرِيضَةً كُبْرَى فِي الشَّرِيعَةِ الْيَهُودِيَّةِ."
            type: usage
      - lemma: "وَصِيَّة"
        examples:
          - text: "الْتَزَمَ الْعَابِدُ بِالْوَصَايَا الدِّينِيَّةِ كُلِّهَا."
            type: usage
      - lemma: "قُرْبَة"
        examples:
          - text: "يَعْتَبِرُ أَهْلُ الْعِلْمِ هَذَا الْعَمَلَ قُرْبَةً يُثَابُ عَلَيْهَا."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُؤَدِّي الْمُؤْمِنُ هَذَا الْعَمَلَ بِاعْتِبَارِهِ مِيتْزْفَاه أَيْ فَرِيضَةً دِينِيَّةً."}

