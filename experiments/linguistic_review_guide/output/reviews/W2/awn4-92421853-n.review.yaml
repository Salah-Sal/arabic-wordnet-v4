# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id: awn4-92421853-n
# pos: n
# المفهوم: Estonian-ness / Estonianism
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «الطابع الإستوني» مركب وصفي تفتقر إلى التشكيل الكامل"
      - "اللمّة لا تصمد تماماً باختبار السكّ: يمكن إبدال «الطابع» بـ«الطبع» أو «السمة» وتبقى الجملة مقبولة وصفاً، مما يُضعف تعيُّنها كمصطلح راسخ"
      - "التعريف الحالي «حالة أو شرط كون الشيء إستونياً» ترجمة حرفية ميكانيكية من الإنجليزية، لا تعكس أسلوب المعجم العربي"
      - "لا يوجد تعريف عربي جامع مانع يميّز هذا المفهوم عن أقاربه (الهوية الإستونية، الثقافة الإستونية)"
    observations: >
      هذه المجموعة تمثّل مفهوم «Estonianism» أو «Estonian-ness»، أي خاصّيّة كون الشيء أو الشخص إستونياً
      بانتمائه وطابعه الثقافي. والعربيّة تُعبّر عن مثل هذه المفاهيم القومية المجرّدة بوسيلتين
      رئيسيّتين: المصدر الصناعي من الاسم المنسوب (كـ«عروبة، أفريقية»)، أو المركّب الوصفي.
      اللمّة الموجودة تتبع المسار الثاني لكنها تعبير وصفي لا مصطلح مسكوك.
      الأصلح للمفهوم المجرّد هو المصدر الصناعي «إستونيّة» قياساً على «عُرُوبة» التي وردت في المعجم
      بمعنى «خصائص الجنس العربي ومزاياه».

  blind_candidates:
    - lemma: "إِسْتُونِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مُشتَقّ من الاسم المنسوب «إستوني» بإلحاق ياء النسبة والتاء، على وزن فَعْلِيَّة المصدري
        الدالّ على الصفة المجرّدة والحالة. قياسه في العربية واسع: عروبة، أفريقية، آسيوية، تركية.
        يدلّ على مجموع ما يميّز الشيء أو الشخص باعتباره إستونياً، وهو أخصر من أي مركّب وصفي.

    - lemma: "الاِنْتِمَاءُ الإِسْتُونِيّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي وصفي من «الانتماء» (مصدر انتمى بمعنى انتسب) مضافاً إلى الصفة المنسوبة «الإستوني».
        يُعبّر عن الجانب الانتسابي للمفهوم، أي صلة الشيء بالكيان الإستوني هويةً وانتساباً.

    - lemma: "الأَصَالَةُ الإِسْتُونِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «الأصالة» (مصدر الصفة الراسخة المتوارَثة) مقيَّداً بـ«الإستوني».
        يُبرز البعد الحضاري والتراثي للمفهوم، مُؤكِّداً أن الإستونية صفة أصيلة لا عارضة.

    - lemma: "الهُوِيَّةُ الإِسْتُونِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «الهوية» (ما يُعرَّف به الشيء ويتمايز) مقيَّداً بـ«الإستوني».
        يُغطّي البُعد الشامل للمفهوم: اللغة والثقافة والانتماء القومي في منظومة واحدة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# الاستعلامات المنفَّذة:
# ١) Batch headword lookup: طابع/الطابع + استونية/الاستونية + انتماء/الانتماء
#    + خصوصية/الخصوصية + سمة/السمة
# ٢) English bridge: translation_en:"Estonian" OR "Estonianism"
# ٣) Candidate validation + analogues: استونية/عروبة/الاستونيا
# ٤) Maqayis al-Lugha (dict 151): جذور طبع، وسم، نمي
stage2_evidence:
  per_lemma:

    - lemma: "الطابع الإستوني"
      confirm:
        - text: "«الطابَع: الطبيعة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الطَّابَع: ما يُطبَع به أو يُخْتَمُ؛ الميسم؛ الخُلُق الغالب»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الطَّابَعُ: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«طابَع: من (ط ب ع) الخلق الغالب وما يطبع به أو يختم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >
            «(1) الأستونيّ: أحد أبناء أستونيا
            (2) اللغة الأستونية
            (3) أستونيّ.» — ترجمة: Estonian
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الطَّابِعُ: العَلَامَةُ الْمُمَيِّزَةُ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            يُفيد أن «الطابع» يحمل معنى العلامة المميّزة، مما يدعم استخدامه للدلالة
            على ما يُميّز شعباً أو ثقافة بأعيانها.

    - lemma: "إِسْتُونِيَّة"
      expands:
        - text: "«عُرُوبة: من (ع ر ب) اسم يراد به خصائص الجنس العربي ومزاياه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يُثبت أن العربية تُشكّل مصادر صناعية دالّة على خصائص الجماعات القومية
            (عروبة، أمازيغية...)؛ وهو النمط القياسي الذي تنتسب إليه «إستونية».

    - lemma: "الاِنْتِمَاءُ الإِسْتُونِيّ"
      expands:
        - text: >
            «وَانْتَمَى فُلَانٌ إِلَى حَسَبِهِ: انْتَسَبَ»
          source: "مقاييس اللغة لابن فارس (جذر نمي)"
          addition: >
            يُؤكّد أن «الانتماء» في أصله يعني الانتساب والنسبة إلى أصل ما؛
            فالمركّب «الانتماء الإستوني» صحيح دلالياً لكنه وصفي لا مصطلحي.

    - lemma: "الأَصَالَةُ الإِسْتُونِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الهُوِيَّةُ الإِسْتُونِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "الطابع الإستوني"
      decision: confirmed
      decision_reason: >
        اللمّة مركّب وصفي مستعمَل فعلاً في AWN4، و«الطابع» موثَّق في المعجم الوسيط
        والكبير بمعنى الطبيعة والخلق الغالب والعلامة المميّزة — وكلّها ملائمة للمفهوم المراد.
        وإن كان المركّب يقبل الإبدال نظرياً، فإن استقراره في السياق المعجمي لـAWN يُبرّر إبقاءه.
        يُحتاج إلى تشكيل كامل ودقيق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز الجانب المُجسَّد والمحسوس للإستونية: الطَّبْع والسجية والعلامة المميّزة
        للثقافة الإستونية كما تتجلّى في الطابع البشري والفني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطَّابَعُ الإِسْتُونِيّ"

    - lemma: "إِسْتُونِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصدر الصناعي من الاسم المنسوب «إستوني» هو الصيغة القياسية الأوفق للتعبير
        عن المفهوم المجرّد (Estonianism)، قياساً على «عُرُوبة» التي وُثِّقت معجمياً
        بمعنى خصائص الجنس ومزاياه. يجمع المفهوم في كلمة واحدة بدلاً من مركّب وصفي.
        يصمد باختبار السكّ: لا يمكن إبدال «إستونية» بمرادف وبقاء دلالتها المحدّدة.
        يقبل لام التعريف والنسبة (إستونيّاتي) والجمع (إستونيّات بالمعنى الجمعي).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن الإستونية بوصفها هويةً مجرَّدة وكلّيّة، شاملةً اللغة والتراث
        والانتماء، دون تخصيص جانب بعينه؛ وهو أدقّ للاستخدام المصطلحي والمعجمي.
      actions:
        - command: create_entry
          params:
            lemma: "إِسْتُونِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "الاِنْتِمَاءُ الإِسْتُونِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا تصمد باختبار السكّ: يمكن إبدال «الانتماء» بـ«الطابع»
        أو «الهوية» أو «الأصالة» وتبقى العبارة مقبولة وصفاً عاماً.
        وحدة معجمية غير ثابتة.

    - lemma: "الأَصَالَةُ الإِسْتُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا تصمد باختبار السكّ: «الأصالة» قابلة للإبدال بأيّ اسم
        يدلّ على الخصيصة (الهوية، الطابع، السمة). لا دليل على تثبيتها معجمياً.

    - lemma: "الهُوِيَّةُ الإِسْتُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة كسابقتَيها، قابلة الإبدال. «الهوية الإستونية» تعبير شائع
        في الخطاب السياسي لكنه ليس مصطلحاً مسكوكاً لهذا المفهوم المعجمي المحدّد.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "حالة أو شرط كون الشيء إستونياً"
    assessment:
      decision: revise
      reason: >
        ترجمة حرفية من الإنجليزية («the state or quality of being Estonian»)
        لا تتسم بأسلوب المعجم العربي؛ «حالة أو شرط» صياغة غربية الطابع.
        ولا تميّز المفهوم عن أقاربه الدلاليّين (الهوية، الثقافة، الانتماء).
    authored:
      - type: terminological
        text: >
          خاصِّيَّةُ الانتساب إلى إستونيا في الهويَّة والطَّابَع الثقافيّ
          والسِّمات الحضاريّة المميِّزة لشعبها وتراثها ولغتها.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          مجموع الطِّباع والسِّمات التي تُعرِّف الشيءَ أو الشخصَ
          بكونه إستونياً انتماءً وهويَّةً وثقافةً.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            خاصِّيَّةُ الانتساب إلى إستونيا في الهويَّة والطَّابَع الثقافيّ
            والسِّمات الحضاريّة المميِّزة لشعبها وتراثها ولغتها.
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >
            مجموع الطِّباع والسِّمات التي تُعرِّف الشيءَ أو الشخصَ
            بكونه إستونياً انتماءً وهويَّةً وثقافةً.

  examples:
    per_lemma:
      - lemma: "الطَّابَعُ الإِسْتُونِيّ"
        examples:
          - text: >
              تجلَّى الطَّابَعُ الإِسْتُونِيّ جليّاً في موسيقى الجوقة الشعبية
              وفي نقوش العمارة الخشبية الموروثة.
            type: usage
      - lemma: "إِسْتُونِيَّة"
        examples:
          - text: >
              تُجسِّد مهرجانات الأغنية الوطنية إستونيَّةً عميقة تمتدّ
              جذورها إلى قرون من الموروث الشفهي البلطي.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            تجلَّى الطَّابَعُ الإِسْتُونِيّ جليّاً في موسيقى الجوقة الشعبية
            وفي نقوش العمارة الخشبية الموروثة.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            تُجسِّد مهرجانات الأغنية الوطنية إستونيَّةً عميقة تمتدّ
            جذورها إلى قرون من الموروث الشفهي البلطي.


