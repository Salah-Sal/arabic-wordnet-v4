stage1_review:
  assessment:
    concerns:
      - "اللمة (إلزامية) لا تعبر عن السلوك النفسي القهري الداخلي بل تعبر عن الوجوب الخارجي أو الفرض القانوني، وتترجم عادة obligation أو mandatory."
    observations: "المفهوم هنا نفسي بحت (the trait of acting compulsively). اللمة (قهرية) صحيحة تماماً وتتسق مع المصطلحات النفسية المعتمدة مثل (الوسواس القهري) و(السلوك القهري)."
  blind_candidates:
    - lemma: "قَهْرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (قهري) للدلالة على سمة القهر والإجبار الداخلي."
    - lemma: "قَسْرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (قسري) بمعنى الإجبار."
    - lemma: "اِضْطِرَارِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (اضطرار) للدلالة على السلوك الاضطراري."
    - lemma: "إِلْحَاحِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (إلحاح) للتعبير عن السلوك الذي يلح على صاحبه (في علم النفس)."

stage2_evidence:
  per_lemma:
    - lemma: "قهرية"
      confirm:
        - text: "عُصابٌ قَهْرِيّ ... compulsion neurosis"
          source: "المعجم الطبي الموحد (2009)"
        - text: "قَهْر ... compulsion (compulsive act)"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "إلزامية"
      contradicts:
        - text: "(1) «أ» إكراه؛ إلزام؛ إجبار؛ قَسْر. «ب» كَرْه؛ اضطرار. «ج» قوةٌ ضاغطة (2) القَسْر؛ القَهْر؛ الإلحاح (نف)."
          source: "المورد الحديث (2008)"
          conflict: "يفرق المعجم بين الإلزام (كمعنى عام للإكراه) وبين القهر كمصطلح نفسي (نف). الإلزامية سمة للأشياء أو القوانين لا سمة تصرف شخصية."
    - lemma: "قَسْرِيَّة"
      expands:
        - text: "قَسْر ... compulsion"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "القسر يؤدي معنى الإجبار، ويمكن صياغة المصدر الصناعي منه كمرادف للقهرية."
    - lemma: "اِضْطِرَارِيَّة"
      evidence_status: "no_material_found"
    - lemma: "إِلْحَاحِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "قهرية"
      decision: confirmed
      decision_reason: "المصطلح الأدق والأكثر شيوعاً في علم النفس للتعبير عن السلوكيات التي يُجبر الشخص على القيام بها من داخله (compulsive)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَهْرِيَّة"
    - lemma: "إلزامية"
      decision: removed
      decision_reason: "اللمة تدل على الفرض والوجوب (مثل التعليم الإلزامي) ولا تستخدم لوصف سمة التصرف القهري النفسي."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "قَسْرِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي صالح للتعبير عن حالة الإجبار والقسر، ويمكن اعتباره مرادفاً للقهرية في بعض السياقات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "قَسْرِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04633239-n"
    - lemma: "اِضْطِرَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: "استخدامها أقل شيوعاً كمصطلح نفسي لسمة الشخصية مقارنة بالقهرية والقسرية."
    - lemma: "إِلْحَاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: "غير شائعة كمصدر صناعي بهذا المعنى، والأفضل الاكتفاء بالقهرية والقسرية."

stage4_content:
  definition:
    current: "سمة التصرف بشكل قهري"
    assessment:
      decision: revise
      reason: "التعريف يكرر اللمة الأساسية (قهري)، الأفضل صياغة تعريف دقيق يشرح الماهية بدون استخدام اللمة المرادة."
    authored:
      - type: terminological
        text: "سمة أو حالة نفسية تدفع الفرد إلى القيام بأفعال أو سلوكيات متكررة بشكل مُلِحّ دون إرادة حرة منه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04633239-n"
          definition_index: 0
          text: "سمة أو حالة نفسية تدفع الفرد إلى القيام بأفعال أو سلوكيات متكررة بشكل مُلِحّ دون إرادة حرة منه."
  examples:
    per_lemma:
      - lemma: "قَهْرِيَّة"
        examples:
          - text: "يُعاني المريض من قَهْرِيَّةٍ تدفعه لغسل يديه عشرات المرات يومياً."
            type: usage
      - lemma: "قَسْرِيَّة"
        examples:
          - text: "يتسم سلوكه بالقَسْرِيَّة التي تمنعه من التوقف عن تكرار الحركة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-04633239-n"
          text: "يُعاني المريض من قَهْرِيَّةٍ تدفعه لغسل يديه عشرات المرات يومياً."

