      entry_id: "{auto}"
      root: "ومض"
      maqayis_quote: "«الْوَاوُ وَالْمِيمُ وَالضَّادُ: كَلِمَةٌ تَدُلُّ عَلَى لَمَعَانِ شَيْءٍ. يُقَالُ: وَمَضَ الْبَرْقُ وَمِيضًا.»"
