      - type: terminological
        text: "دَوْرَةٌ زَمَنِيَّةٌ كَوْنِيَّةٌ فِي الكُوزْمُولُوجِيَا الهِنْدُوسِيَّةِ تَتَأَلَّفُ مِنْ أَرْبَعِ يُوغَاتٍ (سَاتْيَا وَتْرِيتَا وَدْفَابَارَا وَكَالِي) وَيَبْلُغُ مَجْمُوعُهَا 4,320,000 سَنَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "وَحْدَةُ قِيَاسٍ لِلزَّمَنِ الكَوْنِيِّ فِي الفَلْسَفَةِ الهِنْدُوسِيَّةِ، تُمَثِّلُ دَوْرَةً كَامِلَةً مِنْ أَرْبَعِ حِقَبٍ (يُوغَاتٍ) تَبْدَأُ بِعَصْرِ الحَقِيقَةِ (سَاتْيَا يُوغَا) وَتَنْتَهِي بِعَصْرِ الظُّلْمَةِ (كَالِي يُوغَا)، وَمِقْدَارُهَا أَرْبَعَةُ مَلَايِينَ وَثَلَاثُمِئَةٍ وَعِشْرُونَ أَلْفَ سَنَةٍ، وَأَلْفٌ مِنْهَا تُشَكِّلُ يَوْمَ بْرَاهْمَا (كَالْبَا)."
    actions:
      - command: update_definition
