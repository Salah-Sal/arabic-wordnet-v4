stage1_review:
  assessment:
    concerns:
      - "التعريف العربي دائري: يبدأ بـ«ماها يوغا هي...» فيكرر اللمّة في تعريفها"
      - "اللمّة الوحيدة «ماها يوغا» بلا تشكيل"
      - "المفهوم شديد التخصص (وحدة زمنية من الكوزمولوجيا الهندوسية) ولا مقابل عربي تراثي له"
      - "لا يوجد معرّف ILI مما يشير إلى عدم ارتباط المجموعة بـ OEWN"
    observations: "المجموعة تصف «ماها يوغا» وهي دورة زمنية كونية في الفلسفة الهندوسية تتألف من أربع يوغات (ساتيا، تريتا، دفابارا، كالي) ومجموعها 4,320,000 سنة. المفهوم اصطلاحي هندوسي بحت لا مقابل له في التراث المعجمي العربي، فالمصطلح مقترض من السنسكريتية ولا بديل عربي مسكوك."
  blind_candidates:
    - lemma: "الدَّوْرَةُ الكُبْرَى"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يعبّر عن فكرة الدورة الزمنية الكبرى، لكنه وصف عام وليس مصطلحاً مسكوكاً خاصاً بالمفهوم الهندوسي"
    - lemma: "الحِقْبَةُ الهِنْدُوسِيَّةُ"
      generation_method: tarkib
      justification: "مركب وصفي من «حقبة» + «هندوسية»، يقترب من المفهوم لكنه عام جداً إذ يشمل أي فترة هندوسية لا «ماها يوغا» بعينها"
    - lemma: "مَاهَايُوغَا"
      generation_method: taarib
      justification: "تعريب للمصطلح السنسكريتي Mahāyuga بصيغة كلمة واحدة مدمجة، قياساً على نمط تعريب المصطلحات العلمية"
    - lemma: "الدَّهْرُ الأَعْظَمُ"
      generation_method: tarkib
      justification: "مركب وصفي من «الدهر» (الحقبة الطويلة) + «الأعظم» ترجمةً لـ mahā (العظيم)، لكنه تركيب حر وليس مصطلحاً ثابتاً"

