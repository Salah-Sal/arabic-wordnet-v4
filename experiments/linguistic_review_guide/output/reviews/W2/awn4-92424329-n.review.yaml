# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. المرشحات العمياء (قبل الاطلاع على اللمّات الموجودة)
  # التعريف المُقنّع: "ما يتعلق باليهود أو ثقافتهم أو دينهم"
  # المفهوم المستنتج: الخصائص الدينية والثقافية الجوهرية التي تُميّز اليهود (≈ Jewishness)
  blind_candidates:
    - lemma: "يَهُودِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على المصدر الصناعي (-يَّة) من النسبة 'يَهُودِيّ'، قياساً على 'عُرُوبَة' و'إِسْلَامِيَّة' و'مَسِيحِيَّة'. يدل على مجموع الخصائص الدينية والثقافية الجوهرية التي تُميّز الجماعة اليهودية، وهو المقابل الاشتقاقي الطبيعي لـ Jewishness الإنجليزية."

    - lemma: "الطَّابَعُ الْيَهُودِيُّ"
      generation_method: tarkib
      justification: "مركب وصفي (wasfi) من 'طابَع' بمعنى الخصيصة المميّزة والسمة الراسخة، و'اليهودي' صفة نسبية. يُبرز الجانب الحضاري والهوياتي الجمعي أكثر من مجرد الانتماء الديني."

    - lemma: "السِّمَةُ الْيَهُودِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي (wasfi) من 'سِمَة' بمعنى العلامة الدالّة والخاصية المميّزة، مفردها 'وَسْم'. يُركّز على الصفة الجوهرية المشتركة بين أفراد الجماعة اليهودية."

    - lemma: "الْهُوِيَّةُ الْيَهُودِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي (wasfi) يُبرز البُعد الوجودي والهوياتي لمفهوم Jewishness، إذ يتجاوز الدين ليشمل الانتماء الحضاري والثقافي والتاريخي الجمعي."

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمّتان الموجودتان 'يهودية' و'الطابع اليهودي' بدون تشكيل كامل"
      - "التعريف الحالي دائري: يستخدم 'اليهود' في تعريف ما هو 'يهودي'، مما يُفضي إلى دور منطقي"
      - "التعريف وصفي (بنية 'ما يتعلق بـ') لا تعريفي — لا جنس قريب ولا فصل نوعي"
      - "'الطابع اليهودي' يفشل اختبار السكّ: يمكن إبداله بـ'السمة اليهودية' أو 'الخصيصة اليهودية' دون تغيير في الدلالة، مما يُثبت أنه عبارة وصفية حرة لا مصطلح مسكوك"
      - "لا معرّف ILI مرتبط بالمجموعة"
      - "الفارق الدلالي بين اللمّتين غير موثَّق ولا مُبيَّن"
    observations: "المجموعة تُعبّر عن مفهوم 'Jewishness' الإنجليزي، أي الخصائص الجوهرية الدينية والثقافية التي تُميّز اليهود كجماعة بشرية. وقوع المجموعة تحت المجموعة الأمّ 'خَاصِّيَّة جَوْهَرِيَّة' يؤكد أن المقصود صفة ذاتية جوهرية، لا مجرد انتساب ديني. اللمّة الأوفق هي 'يَهُودِيَّة' الموثّقة في المعجم الوسيط بمعنى 'مِلَّة اليهود'، وهي أقرب المصطلحات العربية لهذا المفهوم. أما 'الطابع اليهودي' فعبارة وصفية حرة غير مسكوكة."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة:
#   Q1 — مطابقة دقيقة دفعية (اللمّات + المرشحات)
#   Q2 — إثراء بالمعرّف (تعريفات + أمثلة)
#   Q3 — الجسر الإنجليزي (Jewishness / Jewish / Judaism / Hebraism)
#   Q4 — FTS بالكلمات المفتاحية (يهودي / يهودية)
#   Q5 — مقاييس اللغة (جذر هود)
stage2_evidence:
  per_lemma:

    - lemma: "يهودية"
      confirm:
        - text: "«(الْيَهُودِيَّة) مِلَّة الْيَهُود»"
          source: "المعجم الوسيط — hawramani"
        - text: "«ملَّةُ اليهود»"
          source: "المعجم الوسيط — OCR (مجمع اللغة العربية)"
        - text: "«اليهودية: ديانة اليهود»"
          source: "المورد الحديث (2008) — ARABTERM، translation_en: Judaism"
      expands:
        - text: "«اليَهُودِيّةُ: نسبة إلى اليهود في موضعين: أحدهما محلة بجرجان والآخر بأصبهان»"
          source: "معجم البلدان لياقوت الحموي (ت. 1229م)"
          addition: "يُفيد بأن 'اليهودية' استُعملت اسماً لمواضع جغرافية يسكنها اليهود، وهو معنى جغرافي مغاير للمعنى المقصود هنا؛ إلا أنه يُثبت شيوع الاستخدام العلَمي للفظ."
        - text: "«يهوديّ؛ عِبْريّ»"
          source: "المورد الحديث (2008) — ARABTERM، translation_en: Jewish"
          addition: "يُشير إلى أن 'يهودي' و'عبري' متقاربان في الإنجليزية، مما يُؤكد أن 'اليهودية' هي الاسم المصدري الطبيعي لـ Jewishness/Judaism."

    - lemma: "الطابع اليهودي"
      evidence_status: "no_material_found"

    - lemma: "السِّمَةُ الْيَهُودِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الْهُوِيَّةُ الْيَهُودِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "يهودية"
      decision: confirmed
      decision_reason: "اللمّة موثّقة في المعجم الوسيط (hawramani + OCR) وفي المورد الحديث بمعنى مِلَّة اليهود وديانتهم. مصطلح اشتقاقي مسكوك يجتاز اختبار السكّ: لا يمكن إبداله بشكل صحيح في السياقات التخصصية. تحتاج إلى تشكيل كامل: يَهُودِيَّة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة المؤكدة؛ تُعبّر بإيجاز واقتصاد عن مجموع الخصائص الدينية والثقافية اليهودية — وهي المصطلح العربي المعياري المقابل لـ Jewishness/Judaism في السياقات الدينية والأكاديمية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "يَهُودِيَّة"

    - lemma: "الطابع اليهودي"
      decision: removed
      decision_reason: "مركب وصفي حر يفشل اختبار السكّ: يمكن إبداله بـ'السمة اليهودية' أو 'الخصيصة اليهودية' دون تغيير في الدلالة، مما يُثبت أنه عبارة وصفية لا مصطلح. غائب كلياً من قواعد البيانات المعجمية. بوجود 'يهودية' المسكوكة والموثّقة، 'الطابع اليهودي' زائد عن الحاجة وغير مسوَّغ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────

    - lemma: "يَهُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: "هذا المرشح يطابق اللمّة الموجودة 'يهودية' التي تمّ تأكيدها أعلاه وتشكيلها عبر update_lemma. لا حاجة لإجراء إضافي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "الطَّابَعُ الْيَهُودِيُّ"
      source: stage1
      decision: removed
      decision_reason: "هذا المرشح يطابق اللمّة الموجودة 'الطابع اليهودي' التي تمّ رفضها أعلاه لفشلها اختبار السكّ وغياب توثيقها المعجمي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "السِّمَةُ الْيَهُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل اختبار السكّ (قابلة لاستبدال 'سمة' بـ'طابع' أو 'خصيصة' دون تغيير في الوصف). لا توجد شواهد معجمية تُثبّتها كوحدة اصطلاحية. 'يَهُودِيَّة' تؤدي المعنى ذاته بإيجاز أشد."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "الْهُوِيَّةُ الْيَهُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي يُركّز على البُعد الهوياتي، لكنه يفشل اختبار التثبيت المعجمي: غائب من جميع المصادر المعجمية، وقابل للاستبدال بـ'الانتماء اليهودي' أو 'الخصوصية اليهودية'. 'يَهُودِيَّة' أكثر إيجازاً وتوثيقاً."
      evidence_assessment:
