stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «شيء يوفر التوجيه أو المشورة بشأن قرار أو مسار عمل» ترجمة حرفية للتعريف الإنجليزي، ويفتقر إلى الصياغة المعجمية العربية الأصيلة"
      - "لفظة «اسْتِشَارَة» تدلّ على طلب الرأي (المصدر من استشار) أكثر من دلالتها على المحتوى الإرشادي ذاته، فقد تكون أنسب لمجموعة تدلّ على فعل الاستشارة لا على مضمونها"
      - "المجموعة تفتقر إلى لفظة «نَصِيحَة» وهي من أشهر الألفاظ العربية للتعبير عن مضمون الإرشاد والتوجيه"
    observations: "المجموعة تقع تحت الجنس الأعلى «رسالة/مضمون/محتوى» (awn4-06611268-n)، فالمقصود هنا المحتوى الإرشادي لا فعل الإرشاد ذاته. الألفاظ الثلاثة الموجودة مصادر (إفعال، استفعال، تفعيل)، وكلها تُستعمل اسمياً بمعنى المضمون الإرشادي في العربية المعاصرة. لكنّ غياب «نصيحة» ملفت، لأنها الاسم الأصيل للقول الذي فيه دعاء إلى صلاح."
  blind_candidates:
    - lemma: "نَصِيحَة"
      generation_method: ishtiqaq
      justification: "من جذر ن ص ح على وزن فَعِيلَة، وهي الاسم الأصيل للقول الذي يتضمّن دعاءً إلى صلاح ونهياً عن فساد، وهو صميم مفهوم المجموعة"
    - lemma: "نُصْح"
      generation_method: ishtiqaq
      justification: "مصدر نَصَحَ على وزن فُعْل، يدلّ على إخلاص المشورة وتقديم الرأي الصائب"
    - lemma: "هِدَايَة"
      generation_method: ishtiqaq
      justification: "من جذر هـ د ي، تدلّ على إراءة الطريق الموصل إلى المطلوب، وهي دلالة قريبة من التوجيه"
    - lemma: "إِشَارَة"
      generation_method: ishtiqaq
      justification: "من جذر شـ و ر على وزن إفعالة، من قولهم أشار عليه بالرأي أي نصحه ودلّه على الصواب"

