# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10644647-n
# sophisticate / a worldly-wise person
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (شخص راق، شخص محنك) عبارتان وصفيتان حرّتان وليستا مصطلحين مسكوكين؛ تفشلان في اختبار السكّ (يمكن إبدال «شخص» بـ«إنسان» أو «فرد» دون تغيير)"
      - "«شخص راق» أقرب دلالةً إلى الأناقة والرقيّ منها إلى الحكمة الدنيوية"
      - "التعريف العربي «شخص حكيم دنيوياً» ترجمة حرفية ركيكة"
    observations: "المفهوم المراد هو الشخص الذي حنّكته التجارب فصار عارفاً بدقائق أمور الدنيا ومعاملة الناس — وهو مفهوم أصيل في الثقافة العربية وله ألفاظ تراثية غنية: أريب، محنَّك، لبق، خِرِّيت. الأَولى استخدام ألفاظ مفردة مسكوكة بدلاً من العبارات الوصفية."

  blind_candidates:
    - lemma: "أَرِيب"
      generation_method: ishtiqaq
      justification: "من جذر أ-ر-ب، على وزن فَعِيل، والأريب في المعاجم هو العاقل ذو الدهاء والفطنة، وهو أقرب الألفاظ إلى مفهوم الحكمة الدنيوية"
    - lemma: "مُحَنَّك"
      generation_method: ishtiqaq
      justification: "اسم مفعول من حَنَّك، والتحنيك في اللغة بلوغ الغاية في التجربة، يقال حنّكته التجارب أي أنضجته"
    - lemma: "خِرِّيت"
      generation_method: majaz
      justification: "الخِرِّيت أصلاً الدليل الحاذق بالمفازة، يُستعار للبصير بالأمور الماهر فيها، من جذر خ-ر-ت الدالّ على التثقّب والنفاذ"
    - lemma: "لَبِق"
      generation_method: ishtiqaq
      justification: "من جذر ل-ب-ق على وزن فَعِل، والصفة المشبهة تدلّ على الظرف والحذق ولين الأخلاق، من مصدر اللَّباقة"


stage2_evidence:
  per_lemma:
    - lemma: "شَخْصٌ رَاقٍ"
      contradicts:
        - text: "«رَاقَ — صَفا. عليه: زاد عليه فَضْلًا. الشيءُ فلاناً: أعْجَبَهُ»"
          source: "المعجم الوسيط"
          conflict: "«راق» فعل بمعنى صفا أو أعجب، وليس صفة بمعنى حكيم دنيوياً"
      expands:
        - text: "«(رَوَقَ) الرَّاءُ وَالْوَاوُ وَالْقَافُ أَصْلَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَقَدُّمِ شَيْءٍ، وَالْآخَرُ عَلَى حُسْنٍ وَجَمَالٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر روق يدلّ على الحسن والجمال لا على الحكمة الدنيوية"

    - lemma: "شَخْصٌ مُحَنَّكٌ"
      confirm:
        - text: "«(4) .أ» شخص متكلِّف أو مُحنَّك. .ب» شخص رفيع الثقافة أو مُطَّلِع على أحدث الآراء.»"
          source: "المورد الحديث (2008) — مدخل sophisticate"
        - text: "«(2) يُفقده بساطته أو سذاجته؛ يجعله متكلِّفًا؛ يحنِّكه أو يجعله ذا دراية بشؤون هذا العالم»"
          source: "المورد الحديث (2008) — مدخل sophisticate"
      expands:
        - text: "«(حَنَكَ) الْحَاءُ وَالنُّونُ وَالْكَافُ أَصْلٌ وَاحِدٌ... حَنَّكَتْهُ التَّجَارِبُ، وَاحْتَنَكَتْهُ السِّنُّ احْتِنَاكًا، وَرَجُلٌ مُحْتَنَكٌ... هُوَ التَّنَاهِي فِي الْأَمْرِ وَالْبُلُوغُ إِلَى غَايَتِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ح-ن-ك يدلّ على بلوغ الغاية في الأمر والتجربة"

    - lemma: "أَرِيب"
      confirm:
        - text: "«الأَرِيبُ — الداهية»"
          source: "المعجم الوسيط"
        - text: "«الأَرِيبُ — العاقل ذو الدهاء والفِطْنَة. قِدْحٌ أَرِيبٌ: فائز»"
          source: "المعجم الكبير"
        - text: "«أَرِيب — من (ا ر ب) العاقل والماهر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(أَرَبَ) الْهَمْزَةُ وَالرَّاءُ وَالْبَاءُ لَهَا أَرْبَعَةُ أُصُولٍ... الْحَاجَةُ، وَالْعَقْلُ، وَالنَّصِيبُ، وَالْعَقْدُ... وَالْإِرْبُ: الْعَقْلُ... وَالنَّعْتُ مِنَ الْإِرْبِ أَرِيبٌ... وَمِنْ هَذَا الْبَابِ الْمُؤَارَبَةُ وَهِيَ الْمُدَاهَاةُ... مُؤَارَبَةُ الْأَرِيبِ جَهْلٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر أرب أصوله العقل والدهاء والمهارة، والأريب نعت من الإرب أي العقل"

    - lemma: "مُحَنَّك"
      confirm:
        - text: "«(4) .أ» شخص متكلِّف أو مُحنَّك. .ب» شخص رفيع الثقافة أو مُطَّلِع على أحدث الآراء.»"
          source: "المورد الحديث (2008) — مدخل sophisticate"
      expands:
        - text: "«حَنَّكَتْهُ التَّجَارِبُ، وَاحْتَنَكَتْهُ السِّنُّ احْتِنَاكًا، وَرَجُلٌ مُحْتَنَكٌ... هُوَ التَّنَاهِي فِي الْأَمْرِ وَالْبُلُوغُ إِلَى غَايَتِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "محنَّك اسم مفعول من حنَّك: أنضجته التجارب حتى بلغ غايته"

    - lemma: "خِرِّيت"
      confirm:
        - text: "«الخِرِّيتُ — الدليل الحاذق بالدلالة. يقال: هو في هذا الأمر خِرِّيت: حاذق ماهر فيه»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(خَرَتَ)... الْخِرِّيتُ: الرَّجُلُ الدَّلِيلُ الْمَاهِرُ بِالدَّلَالَةِ. وَسُمِّيَ بِذَلِكَ لِشِقِّهِ الْمَفَازَةَ، كَأَنَّهُ يَدْخُلُ فِي أَخْرَاتِهَا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الخريت الدليل في المفازة، وتوسَّع إلى الماهر في أي أمر"
        - text: "«فاستأجر رجلاً من بني الديل هادياً خِرِّيتاً»"
          source: "حديث نبوي — المعجم الكبير"
          addition: "شاهد حديثي على استخدام خريت بمعنى الدليل الماهر"

    - lemma: "لَبِق"
      contradicts:
        - text: "«اللَّبِقُ واللَّبيقُ: الرجل الحاذقُ الرفيقُ بما يعمله»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          conflict: "اللبق أقرب إلى الحذق والظرف في العمل والتعامل منه إلى الحكمة الدنيوية الشاملة"
      expands:
        - text: "«أبو بكر: اللَّبِقُ الحُلو اللّين الأخلاقِ، قال: وهذا قول ابن الأعرابي»"
          source: "لسان العرب لابن منظور"
          addition: "دلالة اللبق تتركز على اللطف ولين الأخلاق لا الدهاء والحنكة"
        - text: "«(لَبَقَ) اللَّامُ وَالْبَاءُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خَلْطِ شَيْءٍ لِتَطْيِيبِهِ... وَمِنَ الْبَابِ اللَّبِقُ: الْحَاذِقُ بِالشَّيْءِ يَعْمَلُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر خلط شيء لتطييبه، فاللباقة حذق مهاري أكثر منها حكمة دنيوية"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "شَخْصٌ رَاقٍ"
      decision: removed
      decision_reason: "«راق» اسم فاعل من رَاقَ بمعنى أعجب أو صفا، ودلالته على الحسن والأناقة لا على الحكمة الدنيوية. كما أن «شخص راق» عبارة وصفية حرّة لا مصطلح مسكوك، تفشل في اختبار السكّ."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "شَخْصٌ مُحَنَّكٌ"
      decision: confirmed
      decision_reason: "المورد الحديث يوثّق صراحة «شخص محنَّك» ترجمةً لـ sophisticate، ومقاييس اللغة يؤكد دلالة التحنيك على بلوغ الغاية في التجربة. وإن كانت عبارة وصفية، فهي مقابل معجمي مثبت."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على البُعد التجريبي: شخص أنضجته المعايشة والمخالطة حتى صار ذا دراية بشؤون الدنيا، ويُستخدم في السياق الحديث والإعلامي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَخْصٌ مُحَنَّكٌ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أَرِيب"
      source: stage1
      decision: confirmed
      decision_reason: "الأريب في المعجم الوسيط «الداهية» وفي المعجم الكبير «العاقل ذو الدهاء والفطنة»، وجذره أ-ر-ب من أصوله العقل والدهاء كما في مقاييس اللغة. وهو لفظ مفرد مسكوك يدلّ على الحكمة والدهاء الدنيوي تحديداً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على العقل الفطري والدهاء والفطنة، وفيه بُعد الذكاء الإستراتيجي والقدرة على التدبير، وهو لفظ تراثي فصيح"
      actions:
        - command: create_entry
          params:
            lemma: "أَرِيب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُحَنَّك"
      source: stage1
      decision: confirmed
      decision_reason: "اسم مفعول من حنَّك مؤيَّد بمقاييس اللغة «حنَّكته التجارب... التناهي في الأمر والبلوغ إلى غايته» وبالمورد الحديث «شخص محنَّك» ترجمةً لـ sophisticate. إضافته كلمّة مفردة يُغني عن الاعتماد على التركيب الوصفي فحسب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على نتيجة التجربة والاختبار، فالمحنَّك مَن صقلته المواقف والأحداث حتى نضج رأيُه، بخلاف الأريب الذي قد يكون فطريّ الذكاء"
      actions:
        - command: create_entry
          params:
            lemma: "مُحَنَّك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "خِرِّيت"
      source: stage1
      decision: removed
      decision_reason: "الخِرِّيت في المعاجم هو الدليل الحاذق بالطرق والمفازات، واستعماله المجازي يتوسّع إلى الماهر في أمر بعينه لا إلى الحكيم دنيوياً بعامّة. فالفجوة الدلالية بينه وبين المفهوم المراد كبيرة."

    - lemma: "لَبِق"
      source: stage1
      decision: removed
      decision_reason: "اللبق في المعاجم يدلّ على الظرف ولين الأخلاق والحذق في العمل، وأصل جذره خلط الطعام لتطييبه. دلالته أقرب إلى اللباقة الاجتماعية (tact) منها إلى الحكمة والدهاء الدنيوي (worldly wisdom)."


