      reason: >
        التعريف الحالي صحيح بنيوياً (جنس + فصل) لكنه مُقتضَب: «بوسائل إلكترونية»
        مبهم ولا يُحدّد طبيعة هذه الوسائل. كما أن الجنس القريب «إشارة» يحتاج
        إلى تقييد لتمييز هذه الفئة عن الإشارات الصوتية والضوئية. يُقترح تعريف
        مصطلحي أكثر إفصاحاً بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: >
          إشارةٌ تُمثِّل معلوماتٍ أو أوامر تحكّمٍ في صورة تغيُّرات في الجهد
          الكهربائي أو التيار أو المجال الكهرومغناطيسي، تُوَلَّد بدوائر إلكترونية
          كالمكبِّرات وشبه الموصلات والدوائر المتكاملة.
