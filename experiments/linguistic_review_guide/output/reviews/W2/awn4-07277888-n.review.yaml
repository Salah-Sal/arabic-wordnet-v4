# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # التوليد الأعمى — من الملف المُقنَّع (بدون رؤية اللمات)
  # مصدر التعريف: "إشارة تُولد بوسائل إلكترونية"
  # الأجناس العليا: إشارة / علامة
  blind_candidates:
    - lemma: "نَبْضَةٌ إِلِكترُونِيَّة"
      generation_method: tarkib
      justification: >
        مُرَكَّب وصفي من «نَبْضَة» (وزن فَعْلَة من نَبَضَ، يصف الإشارة المتقطعة القصيرة)
        + «إِلِكترُونِيَّة» (صفة جنس)؛ يستحضر مفهوم الإشارة المتولّدة إلكترونياً
        دون تكرار لفظ «إشارة» الوارد في التعريف، وهو مسكوك في التوصيف الهندسي
        بمعنى pulse.

    - lemma: "إِشَارَةٌ كَهْرَبائِيَّة"
      generation_method: tarkib
      justification: >
        مُرَكَّب وصفي بديل يستعيض بـ«كَهْرَبائِيَّة» عن «إِلِكترُونِيَّة» تجنباً
        للاقتراض المزدوج؛ الكهربائية جذرها عربي (كهرب = كهرمان) وتعريب عربي
        أقدم وأرسخ، إذ يشمل نطاقها الظواهرَ الإلكترونية في الاستعمال التقني.

    - lemma: "بَثٌّ إِلِكترُونِيٌّ"
      generation_method: tarkib
      justification: >
        مُرَكَّب وصفي من «بَثّ» (مصدر بَثَّ، وزن فَعْل، يدلّ على الإرسال والنشر)
        + «إِلِكترُونِيّ»؛ يصف العملية التوليدية التي تُميّز هذا النوع من الإشارات،
        ومستخدم في سياق الاتصالات العربية.

    - lemma: "مَوْجَةٌ إِلِكترُونِيَّة"
      generation_method: tarkib
      justification: >
        مُرَكَّب وصفي من «مَوْجَة» (من جذر موج، يصف الطبيعة الموجية للإشارة
        الكهرومغناطيسية) + «إِلِكترُونِيَّة»؛ يُبرز الشكل الفيزيائي الذي تتخذه
        الإشارة الإلكترونية دون الدوران على لفظ «إشارة».

  # التقييم الأولي — بعد قراءة الملف الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة «إشارة إلكترونية» تفتقر إلى التشكيل الكامل في السجلّ."
      - "التعريف الحالي «إشارة تُولد بوسائل إلكترونية» مبهم الفصل النوعي: عبارة «بوسائل إلكترونية» لا تُحدّد طبيعة هذه الوسائل."
      - "المجموعة تضم لمّة واحدة فقط؛ يُستحسن دراسة إضافة مرادفات أو أشكال بديلة."
      - "صفة «إلكترونية» تعريب دخيل من اليونانية عبر الإنجليزية، وإن كانت مقبولة لقبولها الاشتقاق العربي (إلكترونيات، إلكترونياً)."
    observations: >
      «إشارة إلكترونية» مُرَكَّب وصفي ثنائي المكوّن، راسخ في المعجمية التقنية
      العربية المعاصرة؛ وثّقته معاجم أليكسو الموحّدة (الهندسة الكهربائية، المعلوماتية،
      الحرب الإلكترونية). يمثّل النمط الأعمّ شيوعاً للإشارات الكهرومغناطيسية
      والرقمية على حدٍّ سواء. المجموعة الأمّ (إشارة/علامة) تُقيّد نطاق دلالته
      بالإشارات غير اللفظية بوصفها رسائل مُشفَّرة، وهو تحديد صحيح. المرشحات
      الأربعة المُولَّدة في المرحلة العمياء لا تُجاري «إشارة إلكترونية» من حيث
      الدقة التصنيفية ولا الثبوت المعجمي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت:
# (1) batch headword lookup: اشارة + الكتروني + المركبات — صفر نتائج للمركب كمدخل مستقل
# (2) Arabic FTS: "اشارة الكترونية" — 5 نتائج تُثبت الاستخدام في سياق المداخل
# (3) English bridge: "electronic signal" / "electronic pulse" — صفر نتائج مباشرة
# (4) Maqayis al-Lugha: جذر شور — نتيجة واحدة كاملة
stage2_evidence:
  per_lemma:

    - lemma: "إِشَارَةٌ إِلِكترُونِيَّة"
      confirm:
        - text: >
            «إشارةٌ إِلكترونيةٌ للتحكّم في تجهيزات داخلية أو خارجية،
            أو للتحكم في إجرائيات.»
          source: "معجم مصطلحات المعلوماتية (أليكسو، 2000) — مدخل: إشارة تحكم"
        - text: >
            «الجزءُ الابتدائيُّ من إشارةٍ إلكترونية. إذا ابْتَدَلَتْ إشارةٌ رقْميةٌ
            حالةَ الفصل إلى الوصل، ثم عادتْ إلى الفصل، فإن العبورَ من حالة الفصل
            إلى الوصل هو الجبهةُ الصاعدةُ من الإشارة.»
          source: "معجم مصطلحات المعلوماتية (أليكسو، 2000) — مدخل: جبهة صاعدة"
        - text: >
            «الجزءُ الأخيرُ من إشارةٍ إلكترونية. عند ابتدالِ الإشارة الرقمية
            بين on وoff يكون هناك مدة عبور هي الجبهة الهابطة للإشارة.»
          source: "معجم مصطلحات المعلوماتية (أليكسو، 2000) — مدخل: جبهة هابطة"
        - text: >
            «نظام يفتش بموجبه مستقبِلُ رادار ويجد إشارة إلكترونية صخبة،
            ثم يضع مشوِّشاً على تردد هذه الإشارة.»
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (أليكسو، 2004) — مدخل: تفتيش ذاتي للتشويش"
        - text: >
            «لوحة التحكم المحوسبة... صندوق إشارة إلكترونية...»
          source: "المعجم الموحد لمصطلحات النقل (أليكسو، 2010) — مدخل: صندوق إشارة إلكترونية"
      expands:
        - text: >
            «الإشارات تُمثِّل معلومات، وهي تُجَسَّم من خلال قيمة ثابتة أو تتابع
            تغيّر قيمة مقدار فيزيائي، كالحرارة، مثلاً. تُعتَبر الإشارة إذاً
            التمثيل الزمنيّ لمقدار فيزيائيّ، عندما تكون صورة لمقدار مُختلف.»
          source: "مسرد الهندسة الكهربائية (أليكسو / ArabTerm) — مدخل: إشارة"
          addition: >
            يُوضِّح المفهوم العام «إشارة» الذي يقيّد جنس المركب المُراجَع؛
            التمثيل الزمني لمقدار فيزيائي هو الوصف العام، ويُضيف «الإلكترونية»
            قيد توليد الإشارة بالوسائط الإلكترونية.
        - text: >
            «علامة إرادية ترسل تعليمات أو معلومات وتأخذ أشكالاً خطية أو سمعية
            أو بصرية.»
          source: "مسرد الإعلام والتواصل (أليكسو / ArabTerm) — مدخل: إشارة"
          addition: >
            يُبيّن سعة الجنس «إشارة»؛ الوصف بالإلكترونية يُقيّد هذه الأشكال
            بما يُولَّد إلكترونياً تحديداً.

    - lemma: "نَبْضَةٌ إِلِكترُونِيَّة"
      evidence_status: "no_material_found"

    - lemma: "إِشَارَةٌ كَهْرَبائِيَّة"
      evidence_status: "no_material_found"

    - lemma: "بَثٌّ إِلِكترُونِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "مَوْجَةٌ إِلِكترُونِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "إشارة إلكترونية"
      decision: confirmed
      decision_reason: >
        المُرَكَّب الوصفي «إشارة إلكترونية» هو المصطلح المُقرَّر في ثلاثة معاجم
        موحّدة صادرة عن أليكسو (المعلوماتية 2000، الحرب الإلكترونية 2004، النقل 2010).
        يجتاز اختبار التثبيت المعجمي بوصفه وحدة مصطلحية ثابتة وليس وصفاً حرّاً،
        ويستوفي معايير الاطراد والفصاحة والملاءمة. التشكيل الكامل غائب في السجل
        الحالي ويُصحَّح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تتمايز دلالياً عن «الإشارة الصوتية»
        و«الإشارة الضوئية» بكون توليدها مشروطاً بالوسائط الإلكترونية
        (الدوائر المتكاملة، شبه الموصلات، الصمامات الكهربائية)، وتشمل
        الإشارات التناظرية والرقمية على حدٍّ سواء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَةٌ إِلِكترُونِيَّة"

    # ── مرشحات المرحلة ١ (جميعها مرفوضة) ──
    - lemma: "نَبْضَةٌ إِلِكترُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «نَبْضَة» تُحيل تحديداً على الإشارة النبضية القصيرة المتقطعة (pulse)،
        وهي نوع فرعي من الإشارة الإلكترونية لا مرادف لها؛ لذا تضييق دلالي
        لا يصلح بديلاً عن «إشارة إلكترونية» التي تشمل الإشارات التناظرية
        والمستمرة أيضاً. لا أدلة معجمية تدعمها.

    - lemma: "إِشَارَةٌ كَهْرَبائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «كَهْرَبائِيَّة» أعمّ من «إِلِكترُونِيَّة» في الاصطلاح الهندسي؛ تشمل
        التيارات الكهربائية الصناعية وجميع الظواهر الكهربية، في حين أن
        «إلكترونية» مقيَّدة بالعمليات المتعلقة بالإلكترون في الدوائر شبه
        الموصلة. الاستبدال يُخلّ بالدقة التصنيفية. لا أدلة معجمية تدعمها.

    - lemma: "بَثٌّ إِلِكترُونِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «بَثّ» يُركِّز على عملية الإرسال والنشر (broadcasting/transmission)
        لا على الإشارة ذاتها كمقدار فيزيائي؛ انزياح مفهومي يُبعده عن
        الدلالة المُستهدفة. لا أدلة معجمية تدعمه.

    - lemma: "مَوْجَةٌ إِلِكترُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «مَوْجَة» تُحيل على الطبيعة الموجية للظاهرة الفيزيائية وهي وصف
        فيزيائي (wave) لا مصطلح جامع للإشارة الإلكترونية؛ أضيق دلالةً
        من «إشارة إلكترونية» التي تعمّ الإشارات النبضية والموجية والرقمية.
        لا أدلة معجمية تدعمها.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
