          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          تشمل الإشارات الإلكترونية طيفاً واسعاً من الأشكال: إشارات الصوت
          الرقمي، وإشارات الصورة التلفزيونية، وإشارات الراديو والرادار،
          وإشارات التحكم في الحواسيب والشبكات؛ وتتراوح ترددات توليدها من
          الترددات الصوتية المنخفضة حتى الموجات الصغرية العالية.
