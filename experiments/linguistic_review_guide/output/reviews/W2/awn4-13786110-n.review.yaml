# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13786110-n (tankage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «سعة الخزان» مركب إضافي يغطي معنى السعة (capacity) لكنّ المصطلح الإنجليزي tankage يشمل أيضاً الكمية المحتواة فعلاً، وليس السعة القصوى فحسب"
      - "التعريف العربي ترجمة حرفية من الإنجليزية تحتوي قوسين توضيحيين بأسلوب غير معجمي"
      - "المجموعة تحتوي لمّة واحدة فقط وهو عدد قليل لمفهوم له مقابلات عربية متعددة"
    observations: "المفهوم يدور حول مقدار ما يسعه الخزّان أو ما يحتويه فعلاً من مادة. الجذر «خ ز ن» عربي أصيل يدلّ على الصيانة والادّخار، و«سعة» من «و س ع» تدلّ على الطاقة والاحتواء. المركب الإضافي «سعة الخزّان» طبيعي في العربية التقنية. يمكن أيضاً استخدام «صهريج» بدل «خزّان» في بعض السياقات."

  blind_candidates:
    - lemma: "حَمُولَةُ الخَزَّانِ"
      generation_method: tarkib
      justification: "مركب إضافي من «حمولة» (ما يُحمل من كمية) و«الخزّان»، يدلّ على مقدار ما يحتويه الخزّان من مادة"
    - lemma: "مَخْزُونٌ"
      generation_method: ishtiqaq
      justification: "اسم مفعول من «خَزَنَ» على وزن مَفْعُول، يدلّ على الكمية المخزونة في الخزّان"
    - lemma: "صَهْرَجَة"
      generation_method: ishtiqaq
      justification: "مصدر من «صَهْرَجَ» يدلّ على عملية التخزين في الصهاريج أو مقدار ما فيها، مذكور في المورد الحديث مقابلاً لـ tankage"
    - lemma: "اسْتِيعَابُ الخَزَّانِ"
      generation_method: tarkib
      justification: "مركب إضافي من «استيعاب» (الأخذ بالكامل والاحتواء) و«الخزّان»، يدلّ على طاقة الخزّان الاستيعابية"


stage2_evidence:
  per_lemma:
    - lemma: "سَعَةُ الخَزَّانِ"
      confirm:
        - text: "«(1) سَعَةُ الصِّهريج أو محتوياته»"
          source: "المورد الحديث (2008) — مقابل tankage"
        - text: "«سَعَة — capacity (space) / content / cubic content»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«سَعَة — 1- القدرة على الحفظ أو الاحتواء أو الامتصاص. 2- تعبير عن مقدار المادة التي يمكن احتواؤها أو حفظها.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«الخَزَّانُ — اللِّسانُ الرُّطَبُ... مَجْمَعُ الماءِ, قَلَّ أَو كَثُرَ خَزَّانُ التَّراكُم... خَزَّانُ الوَقُودِ: صُنْدُوقٌ مَعْدِنِيٌّ يُمْلَأُ بِنَوْعٍ مُعَيَّنٍ من الوَقُودِ السائل»"
          source: "المعجم الكبير"
      expands:
        - text: "«خزان — وعاء للتخزين أو لنقل السوائل أو الغازات. تتوفر الخزانات بأحجام مختلفة جد، منها الصغيرة والمتوسطة المستعملة في التخزين و/أو النقل والكبيرة جد والقارة التي تستعمل للتخزين فقط.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يوضّح أنّ الخزّان يشمل أوعية بأحجام مختلفة للسوائل والغازات"

    - lemma: "حَمُولَةُ الخَزَّانِ"
      contradicts:
        - text: "«الحَمُولَة: بالفتح الإبل والحمرُ تحمل عليها الأثقال وبالضم الأحمال بأعيانها»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الحمولة في المعاجم الكلاسيكية تدلّ على الدواب أو الأثقال المحمولة، لا على سعة وعاء"
      expands:
        - text: "«الحُمُولة: الأثقال، وفيه أن الحِمْل ما حُمل على ظهر أو رأس»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الحمولة بالضم جمع حِمل أي الأثقال، وليست مقداراً كمّياً للسعة"

    - lemma: "مَخْزُونٌ"
      confirm:
        - text: "«خَزَنَ — الْخَاءُ وَالزَّاءُ وَالنُّونُ أَصْلٌ يَدُلُّ عَلَى صِيَانَةِ الشَّيْءِ. يُقَالُ خَزَنْتُ الدِّرْهَمَ وَغَيْرَهُ خَزْنًا»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«مَخْزُون» يدلّ على الكمية المحفوظة فعلاً (stock/inventory) لا على سعة الوعاء"
          source: "تحليل دلالي"
          conflict: "المخزون يشير إلى ما هو مخزَّن بالفعل وليس إلى طاقة الخزّان الاستيعابية، وهو أعمّ من كونه في خزّان"

    - lemma: "صَهْرَجَة"
      confirm:
        - text: "«(4) الصَّهْرَجة: وَضْع أو خَزْن في الصّهاريج (5) رسم الصَّهرجة: رسمٌ يُفْرَض لقاء الخزن في الصَّهاريج»"
          source: "المورد الحديث (2008) — مقابل tankage"
      contradicts:
        - text: "«الصهرجة التي يضرب عليها الغزل وينقض عليها الإبريسم. والصهريج حوض.»"
          source: "المحيط في اللغة للصاحب بن عبّاد"
          conflict: "الصهرجة في التراث لها معنى مختلف (أداة غزل)، والمعنى الحديث (عملية التخزين في صهاريج) مصدر حدثي لا يدلّ على الكمية"

    - lemma: "اسْتِيعَابُ الخَزَّانِ"
      confirm:
        - text: "«الاستيعاب: أخذ الشيء كله، يقال وعبته وعبا وأوعبته إيعابا، واستوعبته، كلها بمعنى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الاستيعاب: هو الاستيفاء والأخذ أجمعَ»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الاستيعاب يدلّ على فعل الأخذ والاستيفاء (حدث) لا على الكمية الناتجة عنه"


stage3_analysis:
  per_lemma:
    - lemma: "سَعَةُ الخَزَّانِ"
      decision: confirmed
      decision_reason: "مركب إضافي طبيعي ومتداول في العربية التقنية المعاصرة، يجمع بين «سعة» (المقدار الذي يسعه الوعاء) و«الخزّان» (وعاء التخزين). المورد الحديث يعطي «سعة الصهريج» مقابلاً لـ tankage وهو مرادف بنيوي. الأدلة المعجمية تؤكد المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَعَةُ الخَزَّانِ"

    - lemma: "حَمُولَةُ الخَزَّانِ"
      source: stage1
      decision: removed
      decision_reason: "الحمولة في المعاجم العربية تدلّ على الدواب الحاملة أو الأثقال المحمولة، وليس على كمية ما يسعه وعاء. الاستخدام الحديث لـ «حمولة» بمعنى payload/load لا ينطبق على سعة الخزّان التي هي مقدار كمّي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَخْزُونٌ"
      source: stage1
      decision: removed
      decision_reason: "المخزون يدلّ على الكمية المحفوظة فعلاً (المادة المخزَّنة) وهو مفهوم أعمّ من «ما في الخزّان»، إذ يشمل المخزون في المستودعات والأسواق وغيرها. كما أنّه لا يتضمن معنى السعة القصوى. لا يصلح مرادفاً دقيقاً."
      evidence_assessment:
        case: mixed

    - lemma: "صَهْرَجَة"
      source: stage1
      decision: removed
      decision_reason: "الصهرجة في المورد الحديث تعني عملية الخزن في الصهاريج (المعنى الرابع)، وليس الكمية المحتواة. وهي مصدر حدثي لا اسم كمية. كما أنّ لها معنى تراثياً مختلفاً (أداة غزل). لا تصلح لمّة لهذه المجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "اسْتِيعَابُ الخَزَّانِ"
      source: stage1
      decision: removed
      decision_reason: "الاستيعاب مصدر يدلّ على فعل الأخذ والاحتواء (حدث)، لا على المقدار المحتوى (كمية). والمجموعة تحتاج اسم كمية لا مصدراً حدثياً. كما أنّ المركب غير مسكوك معجمياً."
      evidence_assessment:
        case: mixed


