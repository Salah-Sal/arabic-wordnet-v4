stage1_review:
  assessment:
    concerns:
      - "المصطلح (العرق الأصفر) يعتبر قديماً وربما غير دقيق علمياً في الوقت الحاضر، رغم شيوعه التاريخي والجغرافي."
      - "التعريف الحالي (عرق آسيوي) مقتضب جداً ويشبه الترجمة أكثر من كونه تعريفاً معجمياً مستقلاً."
    observations: "المفهوم يشير إلى التصنيف الأنثروبولوجي التقليدي لسكان شرق وجنوب شرق آسيا، والذي يُعرف تاريخياً بالعرق الأصفر أو المغولي."
  blind_candidates:
    - lemma: "العِرْقُ الآسْيَوِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي ينسب العرق إلى القارة، وهو تعبير دقيق وشائع للتخلص من الدلالات اللونية."
    - lemma: "السُّلَالَةُ الآسْيَوِيَّة"
      generation_method: tarkib
      justification: "استخدام مرادف (سلالة) مع النسبة الجغرافية في تركيب وصفي."
    - lemma: "الجِنْسُ الآسْيَوِيّ"
      generation_method: tarkib
      justification: "استخدام مرادف (جنس) للتعبير عن التصنيف البشري في إطار القارة."
    - lemma: "العِرْقُ الْمُغُولَانِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يستخدم النسبة العلمية الدقيقة (المغولاني) كمرادف علمي للمغولي."

stage2_evidence:
  per_lemma:
    - lemma: "العرق الأصفر"
      confirm:
        - text: "العِرق الأصفر [ويشمل المنغوليّين والصِّينيّين والكوريّين واليابانيّين والتايلنديّين والبورميّين وأهل التِّيبت إلخ]."
          source: "المورد الحديث (2008)"
    - lemma: "العرق المغولي"
      confirm:
        - text: "مُغولانيّ: ... ذو علاقة بالعِرق المغولاني"
          source: "المورد الحديث (2008)"
    - lemma: "العِرْقُ الآسْيَوِيّ"
      evidence_status: "no_material_found"
    - lemma: "السُّلَالَةُ الآسْيَوِيَّة"
      evidence_status: "no_material_found"
    - lemma: "الجِنْسُ الآسْيَوِيّ"
      evidence_status: "no_material_found"
    - lemma: "العِرْقُ الْمُغُولَانِيّ"
      confirm:
        - text: "مُغولانيّ: ... ذو علاقة بالعِرق المغولاني"
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "العرق الأصفر"
      decision: confirmed
      decision_reason: "مصطلح معروف وموثق في المعاجم للدلالة على هذا العرق بناءً على التقسيم التقليدي للألوان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "العِرْقُ الْأَصْفَر"

    - lemma: "العرق المغولي"
      decision: confirmed
      decision_reason: "مصطلح شائع للدلالة على العرق المغولي (الآسيوي) ويستخدم بكثرة في الأنثروبولوجيا والدراسات الجغرافية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "العِرْقُ الْمُغُولِيّ"

    - lemma: "العِرْقُ الآسْيَوِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق ومستخدم أكاديمياً للدلالة على سكان قارة آسيا كعرق بشري لتجنب الدلالة اللونية القديمة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "العِرْقُ الآسْيَوِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "السُّلَالَةُ الآسْيَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تعبير حر، ويفضل تخصيص كلمة عرق على سلالة في هذا السياق لتوافقها مع اللمات الأخرى."
      evidence_assessment:
        case: no_material

    - lemma: "الجِنْسُ الآسْيَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير حر وغير اصطلاحي مقارنة بالعرق."
      evidence_assessment:
        case: no_material

    - lemma: "العِرْقُ الْمُغُولَانِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "تسمية علمية دقيقة ظهرت في المعاجم الحديثة لترجمة المصطلح الأجنبي وتخصيصه عن التسمية التاريخية (المغولي)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "العِرْقُ الْمُغُولَانِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عرق آسيوي"
    assessment:
      decision: revise
      reason: "التعريف مقتضب جداً ويشبه الترجمة الحرفية، ويحتاج إلى توضيح المعنى الأنثروبولوجي المقصود بأسلوب معجمي سليم."
    authored:
      - type: encyclopedic
        text: "أَحَدُ الْأَعْرَاقِ الْبَشَرِيَّةِ الرَّئِيسِيَّةِ الَّتِي يَنْتَمِي إِلَيْهَا مُعْظَمُ سُكَّانِ قَارَّةِ آسْيَا الشَّرْقِيَّةِ وَالْجَنُوبِيَّةِ الشَّرْقِيَّةِ، وَيَتَمَيَّزُ أَفْرَادُهُ بِبَعْضِ الصِّفَاتِ الْجِسْمَانِيَّةِ كَالْبَشَرَةِ الْمَائِلَةِ إِلَى الصُّفْرَةِ وَالشَّعْرِ الْمُسْتَرْسِلِ."
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "أَحَدُ الْأَعْرَاقِ الْبَشَرِيَّةِ الرَّئِيسِيَّةِ الَّتِي يَنْتَمِي إِلَيْهَا مُعْظَمُ سُكَّانِ قَارَّةِ آسْيَا الشَّرْقِيَّةِ وَالْجَنُوبِيَّةِ الشَّرْقِيَّةِ، وَيَتَمَيَّزُ أَفْرَادُهُ بِبَعْضِ الصِّفَاتِ الْجِسْمَانِيَّةِ كَالْبَشَرَةِ الْمَائِلَةِ إِلَى الصُّفْرَةِ وَالشَّعْرِ الْمُسْتَرْسِلِ."}

  examples:
    per_lemma:
      - lemma: "العرق الأصفر"
        examples:
          - text: "يَنْتَشِرُ الْعِرْقُ الْأَصْفَرُ فِي شَرْقِ آسْيَا وَلَدَى السُّكَّانِ الْأَصْلِيِّينَ لِلْأَمْرِيكِيَّتَيْنِ."
            type: usage
      - lemma: "العرق المغولي"
        examples:
          - text: "يُعَدُّ الْعِرْقُ الْمُغُولِيُّ مِنْ أَكْبَرِ الْأَعْرَاقِ الْبَشَرِيَّةِ دِيمُوغْرَافِيًّا."
            type: usage
      - lemma: "العِرْقُ الآسْيَوِيّ"
        examples:
          - text: "تَشْتَرِكُ شُعُوبُ الْعِرْقِ الآسْيَوِيِّ فِي عِدَّةِ خَصَائِصَ جِينِيَّةٍ مُشْتَرَكَةٍ."
            type: usage
      - lemma: "العِرْقُ الْمُغُولَانِيّ"
        examples:
          - text: "يُصَنِّفُ عُلَمَاءُ الْأَنْثُرُوبُولُوجْيَا هَذِهِ الْمَجْمُوعَةَ ضِمْنَ الْعِرْقِ الْمُغُولَانِيِّ."
