        params: {sense_id: "{auto}", text: "يَنْتَشِرُ الْعِرْقُ الْأَصْفَرُ فِي شَرْقِ آسْيَا وَلَدَى السُّكَّانِ الْأَصْلِيِّينَ لِلْأَمْرِيكِيَّتَيْنِ."}
