stage1_review:
  assessment:
    concerns:
      - "اللمّة «معلومات» بصيغة الجمع فقط، والمفرد «معلومة» غير مُدرج"
      - "اللمّة الموجودة بدون تشكيل"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي، يفتقر إلى أسلوب المعجم العربي"
    observations: "المجموعة تمثّل مفهوم «المعلومات» بوصفها رسالة مُتلقَّاة مفهومة، وهو مفهوم أساسي في العربية المعاصرة. اللمّة «معلومات» اسم مفعول مجموع من الجذر ع.ل.م على وزن مَفْعُولات، وهي الأكثر شيوعاً واستقراراً في هذا الحقل الدلالي. ينبغي إضافة التشكيل وتحسين التعريف."
  blind_candidates:
    - lemma: "إِفَادَة"
      generation_method: ishtiqaq
      justification: "مصدر أَفَادَ من الجذر ف.ي.د، بمعنى ما يُفيد به المرء غيره من خبر أو بيان، فهي ما يُتلقَّى من رسالة ذات نفع"
    - lemma: "خَبَر"
      generation_method: ishtiqaq
      justification: "من الجذر خ.ب.ر الدالّ على العلم بالشيء، والخبر هو النبأ المُتلقَّى، وهو قريب من معنى الرسالة المفهومة"
    - lemma: "عِلْم"
      generation_method: majaz
      justification: "توسيع مجازي من معنى الإدراك والمعرفة إلى ما يُتلقَّى من مضمون مفهوم، كما في قولهم «بلغني علمٌ بكذا»"
    - lemma: "بَلَاغ"
      generation_method: ishtiqaq
      justification: "من الجذر ب.ل.غ الدالّ على الوصول والإيصال، والبلاغ ما يُبلَّغ من رسالة فيصل إلى المتلقِّي"

stage2_evidence:
