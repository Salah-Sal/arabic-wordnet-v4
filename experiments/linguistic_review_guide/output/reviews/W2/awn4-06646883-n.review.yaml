      contradicts:
        - text: "«إفادة — deposition»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "المعنى المعجمي المُسجَّل هو الشهادة القانونية (deposition)، لا المعلومة المُتلقَّاة"

    - lemma: "خَبَر"
      confirm:
        - text: "«الخَبَرُ، محركةً: النَّبَأ»"
          source: "القاموس المحيط للفيروزآبادي"
      contradicts:
        - text: "«الْخَاءُ وَالْبَاءُ وَالرَّاءُ أَصْلَانِ: فَالْأَوَّلُ الْعِلْمُ، وَالثَّانِي يَدُلُّ عَلَى لِينٍ وَرَخَاوَةٍ وَغُزْرٍ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر خ.ب.ر أصله العلم بالشيء والنبأ عنه، وهو أخصّ من مفهوم المعلومات العام؛ الخبر يدلّ على نبأ مُحدَث لا على مطلق ما يُفهم من رسالة"

    - lemma: "عِلْم"
      contradicts:
        - text: "«العِلم: إدراك الشيء بحقيقته. اليقين. نورٌ يقذفه الله في قلب من يحبُّ. المعرفة.»"
          source: "المعجم الوسيط"
          conflict: "العِلم حالة ذهنية (إدراك/يقين)، لا كيان مُتلقًّى من رسالة؛ فهو أعمّ من المعلومة وأشمل"
        - text: "«الْعِلْمُ: نقيض الْجَهْل»"
          source: "كتاب العين للخليل بن أحمد"
          conflict: "العلم نقيض الجهل أي هو حالة معرفية، لا وحدة معلوماتية مستقلة"

    - lemma: "بَلَاغ"
      contradicts:
        - text: "«البلاغ: كالبلوغ، الانتهاء إلى أقصى المقصد والمنتهى زمانا أو مكانا... والبلاغ، التبليغ نحو {فَإِنَّمَا عَلَيْكَ الْبَلَاغ}. والكفاية نحو {إِنَّ فِي هَذَا لَبَلَاغًا}.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "البلاغ هو فعل التبليغ أو الكفاية، لا مضمون الرسالة المفهوم ذاته"
        - text: "«(بَلَغَ) الْبَاءُ وَاللَّامُ وَالْغَيْنُ أَصْلٌ وَاحِدٌ وَهُوَ الْوُصُولُ إِلَى الشَّيْءِ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "أصل الجذر هو الوصول والإيصال لا المضمون المُتلقَّى"

