      confirm:
        - text: "«بيانات معالجة لها معنى في سياق معين.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«المعنى الذي يُفترَضُ أن تمثِّلَه المعطياتُ للناس. تتألَّفُ المعطياتُ من حقائقَ تتحوّلُ إلى معلومات عندما يُنظر إليها ضمن السياق، وتعبِّر للناس عن معنى.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«مجموعة من الإشارات الدقيقة منتقلة بين المرسِل والمرسَل إليه عبر قناة معينة.»"
          source: "مسرد الإعلام والتواصل — ALECSO"
        - text: "«هي مجموعة من المعطيات في صيغة يمكن الاستفادة منها. مَعْلُومَات (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      expands:
        - text: "«المعلومة، حسب نظرية الإعلام، هي الدلالة المسندة لمعطيات بمساعدة المواصفات المستعملة وذلك لتقديمها على شكل معين، فهي في هذا التصور متوالية من الإشارات الدقيقة المنتقلة بين مرسل ومتلق عبر قناة معينة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "تعريف تقني دقيق يربط المعلومة بنظرية الإعلام والإشارات"
        - text: "«(1) «أ» إعلام؛ إخبار. «ب» عِلْم؛ اطّلاع. «ج» معرفة (2) «أ» أخبار؛ أنباء. «ب» حقائق؛ معلومات»"
          source: "المورد الحديث (2008)"
          addition: "يبيّن تعدد المقابلات العربية لـ information: إعلام، عِلْم، معرفة، أخبار، حقائق، معلومات"

