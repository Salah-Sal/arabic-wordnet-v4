# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
# قُرئ الملف المُقنّع أولاً (لا لمّات)، وولّدت المرشحات الأربعة
# انطلاقاً من التعريف وحده، ثم قُرئ الملف الكامل.
stage1_review:
  assessment:
    concerns:
      - "إِنْسَانِيَّة في المعاجم الكلاسيكية والحديثة تدل على «جملة الصفات التي تميز الإنسان عن البهيمة» وعلى «مجموع أفراد النوع البشري»، وهي دلالة أشمل من humaneness التي تنصرف إلى الجانب الرحيم الرقيق تحديداً — مما يُفضي إلى تعدد دلالي يستوجب توضيح المعنى المقصود لهذه المجموعة"
      - "التعريف الحالي يصل الرحمة ومراعاة الآخرين بـ«أو» التي تُفيد التخيير، بينما هما وجهان متكاملان للصفة الواحدة لا بديلان"
    observations: >
      تضم المجموعة لمّتين متكاملتين: رَأْفَة وهي الكلمة التراثية الفصيحة
      ذات الشواهد القرآنية والمعجمية القوية في دلالة الرحمة الشديدة ودفع الأذى،
      وإِنْسَانِيَّة التي طوّرت دلالتها في المعجم الحديث باتجاه humaneness
      بينما تبقى دلالتها الكلاسيكية أوسع. الجمع بينهما صحيح إذ تشتركان في الحقل الدلالي،
      غير أن رَأْفَة أدق وأخص (أشد الرحمة وأبلغها)، في حين إِنْسَانِيَّة أعم
      وتنطوي في الاستخدام المعاصر على معنى humaneness باتساع.
  blind_candidates:
    - lemma: "حَنَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الحَنَان (العطف والرقة تجاه الغير)، يصوغ الصفة المجردة للرحمة ومراعاة الآخرين وفق نمج اشتقاقي منتج في العربية المعاصرة"
    - lemma: "شَفَقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الشَّفَقة (صرف الهمة إلى إزالة المكروه عن الناس — الجرجاني)، يمنح الصفة بنية اسمية مجردة تستوفي متطلبات مجموعة الصفات الخلقية"
    - lemma: "رِفْق"
      generation_method: majaz
      justification: "الرفق في التراث «خلاف العنف» و«اللطف ولين الجانب»، ويمكن إزاحته دلالياً ليعبّر عن صفة مراعاة الغير؛ الجذر رفق في المقاييس يدل على «موافقة ومقاربة بلا عنف»"
    - lemma: "مَحَبَّةُ الخَلْق"
      generation_method: tarkib
      justification: "مركب إضافي يجمع المحبة والخلق ليصف الصفة التي تجعل صاحبها يراعي الإنسان والحيوان ويرحمهم؛ التركيب من النوع الإضافي الذي يحدد طرفَي الاصطلاح"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٦ استعلامات):
#   ١. مطابقة دفعية لجميع اللمّات (إنسانية + رأفة + الرفق + المحبة)
#   ٢. مطابقة دفعية للمرشحات (حنانية + شفقية)
#   ٣. جسر إنجليزي (humaneness / compassion / consideration / benevolence)
#   ٤. بحث FTS بالكلمات المفتاحية (رحمة/مراعاة/رأفة/حنو/شفقة)
#   ٥. مقاييس اللغة لجذور: أنس، رأف، رفق، شفق، حنو
#   ٦. إثراء بالمعرِّف (أمثلة وتعريفات تفصيلية)
stage2_evidence:
  per_lemma:

    - lemma: "إِنْسَانِيَّة"
      confirm:
        - text: "«الإنسانيةُ: الْفَضَائِل النفسية المختصة بالإنسان»"
          source: "معجم مقاليد العلوم للسيوطي (ت ١٥٠٥ م)"
      expands:
        - text: "«خلاف البهيمية جملة الصفات التى تميز الإنسان جملة أفراد النوع البشرى التى تصدق عليها هذه الصفات»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة)"
          addition: "يوسّع المعنى ليشمل كل الصفات المميِّزة للإنسان وليس الرحمة وحدها، وهي دلالة أشمل من المجموعة الحالية"
        - text: "«(الإنسانية) خلاف البهيمية وَجُمْلَة الصِّفَات الَّتِي تميز الْإِنْسَان أَو جملَة أَفْرَاد النَّوْع البشري الَّتِي تصدق عَلَيْهَا هَذِه الصِّفَات (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (١٩٩٨ م)"
          addition: "الدلالة الثانية (أفراد النوع البشري = Humanity) تُضاف إلى المعنى الخُلُقي، مما يُبيّن تعدد دلالات الكلمة"

    - lemma: "رَأْفَة"
      confirm:
        - text: "«الرَّحْمَةُ أَشَدُّ الرَّحْمَة, أو أرَقُّها مُبالَغَةٌ فى رَحْمَةٍ مَخْصوصَةٍ من دَفْعِ المَكْرُوه وإزالةِ الضُّرّ»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
        - text: "«الرأفة: ألطف الرحمة وأبلغها، فالمرءوف به تقيمه عناية الرأفة حتى تحفظ بمسراها في سره ظهور ما يستدعي العفو»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت ١٦٢٢ م)"
        - text: "«وَلَا تَأْخُذْكُم بِهِمَا رَأْفَةٌ فِي دِينِ اللَّهِ»"
          source: "القرآن الكريم — سورة النور: ٢"
        - text: "«وَجَعَلْنَا فِي قُلُوبِ الَّذِينَ اتَّبَعُوهُ رَأْفَةً وَرَحْمَةً وَرَهْبَانِيَّةً»"
          source: "القرآن الكريم — سورة الحديد: ٢٧"
        - text: "«الرَّاءُ وَالْهَمْزَةُ وَالْفَاءُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى رِقَّةٍ وَرَحْمَةٍ، وَهِيَ الرَّأْفَةُ»"
          source: "مقاييس اللغة لابن فارس (ت ١٠٠٤ م)"

    - lemma: "حَنَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "شَفَقِيَّة"
      evidence_status: "no_material_found"

    - lemma: "رِفْق"
      confirm:
        - text: "«الرِّفْقُ: حسن الانقياد لما يُؤَدِّي إلى الجميل»"
          source: "معجم مقاليد العلوم للسيوطي (ت ١٥٠٥ م)"
        - text: "«الرَّاءُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُوَافَقَةٍ وَمُقَارَبَةٍ بِلَا عُنْفٍ. فَالرِّفْقُ: خِلَافُ الْعُنْفِ»"
          source: "مقاييس اللغة لابن فارس (ت ١٠٠٤ م)"
      contradicts:
        - text: "«الرِّفْقُ ضدُّ العنف … ما استعين به … لين الجانب ولطافة الفعل»"
          source: "لسان العرب لابن منظور (ت ١٣١١ م)"
          conflict: "الرفق يدل على الأسلوب اللطيف في التعامل، وليس على صفة الرحمة ومراعاة الغير بمعنى humaneness؛ دلالته إجرائية (كيفية التصرف) لا انفعالية (الشعور بالرأفة)"
        - text: "«ما كَان الرِّفْقُ فى شىءٍ إلا زانَهُ»"
          source: "المعجم الكبير — شاهد حديث"
          conflict: "الشاهد يؤكد معنى اللطف في الأسلوب، لا معنى الرأفة بالضعفاء"

    - lemma: "مَحَبَّةُ الخَلْق"
      expands:
        - text: "«المحبَّةُ: الميل إلى الشيء السار»"
          source: "المعجم الوسيط"
          addition: "المحبة وحدها لا تستوفي دلالة humaneness، وتركيبها مع «الخلق» غير مسجّل في المعجم كوحدة اصطلاحية ثابتة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إِنْسَانِيَّة"
      decision: confirmed
      decision_reason: >
        رغم أن دلالة إنسانية في المعاجم أشمل من humaneness، إلا أن المعجمية العربية الحديثة
        (معجم مقاليد العلوم: «الفضائل النفسية المختصة بالإنسان») تُدرج الرحمة ومراعاة الغير
        تحتها، وقد استقر استخدامها في العربية المعاصرة بمعنى humaneness تحديداً
        (كقولنا «تحلّى بالإنسانية»). ربط هذه الكلمة بالمجموعة صحيح لهذا المعنى الخاص.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "إنسانية أعم دلالةً إذ تشمل جميع الفضائل الإنسانية الراقية، وحين تُوظَّف في هذه المجموعة تنصرف إلى الجانب الرحيم العطوف منها تحديداً؛ وهي تُقابل humaneness في الخطاب الأخلاقي المعاصر وتحمل طابعاً كلياً أكثر من رأفة"

    - lemma: "رَأْفَة"
      decision: confirmed
      decision_reason: >
        موثقة بأدلة قرآنية ومعجمية قوية تتطابق مع دلالة المجموعة تماماً؛
        تدل على أشد الرحمة وأرقّها مع الحرص على دفع الأذى عن الموجَّهة إليه.
        المعجم الكبير ومقاييس اللغة يُعرِّفانها تعريفاً مطابقاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "رأفة أخص وأدق من إنسانية؛ تختص بأشد درجات الرحمة وأرقّها وتتضمن حتماً دفع المكروه عن صاحبها، وفيها معنى التبصّر والعناية المعمّقة لا مجرد الشعور الوجداني"

    - lemma: "حَنَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يَرِد هذا المصدر الصناعي في أي مصدر معجمي ضمن قاعدة البيانات.
        صيغة «فَعَالِيَّة» المشتقة من «حَنَان» غير مسكوكة ولا متداولة في المعجمية العربية
        الكلاسيكية أو المعاصرة، ولا تجتاز اختبار التثبيت المعجمي.
      evidence_assessment:
        case: no_material

    - lemma: "شَفَقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يَرِد هذا المصدر الصناعي في أي مصدر معجمي. وإن كانت شَفَقَة نفسها
        موثقة ودلالتها قريبة (الجرجاني: «صرف الهمة إلى إزالة المكروه عن الناس»)،
        فإن صيغة «شَفَقِيَّة» كمصدر صناعي غير مسجّلة ولا مستعملة في المدوّنة العربية.
      evidence_assessment:
        case: no_material

    - lemma: "رِفْق"
      source: stage1
      decision: removed
      decision_reason: >
        الرفق يدل على الأسلوب اللطيف في التعامل وضد العنف لا على صفة الرحمة ومراعاة
        الضعفاء بمعنى humaneness؛ دلالته إجرائية كيفية لا انفعالية وجدانية.
        مع وجود إنسانية ورأفة اللتين تستوفيان دلالة المجموعة تماماً، لا حاجة إلى رفق.
      evidence_assessment:
        case: mixed

    - lemma: "مَحَبَّةُ الخَلْق"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: يمكن إبدال «الخلق» بـ«البشر» أو «الناس»
        ويبقى التركيب وصفاً وليس مصطلحاً ثابتاً. كذلك يفشل اختبار السكّ:
        ليس للتركيب وحدة اصطلاحية مسجّلة في المعاجم، ودلالة «محبة» أضيق
        من humaneness الذي يشمل الرحمة والرأفة والمراعاة.
      evidence_assessment:
        case: no_material


