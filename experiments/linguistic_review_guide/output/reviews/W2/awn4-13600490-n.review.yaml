# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13600490-n (information measure)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مقياس المعلومات» تركيب إضافي بلا تشكيل"
      - "المجموعة تحتوي على لمّة واحدة فقط، مما يضعف التغطية المعجمية"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزية، يحتاج صياغة معجمية أصيلة"
    observations: >
      المفهوم ينتمي إلى نظرية المعلومات (شانون ١٩٤٨)، وهو نظام قياس يعتمد على
      الاحتمالات لتحديد كمية المعلومات التي ينقلها حدث ما. المصطلح الإنجليزي
      «information measure» يشير إلى المنظومة القياسية لا إلى وحدة بعينها
      (كالبت أو النات أو الهارتلي). المصطلح العربي المتوقع يكون تركيباً إضافياً
      من كلمة دالّة على القياس مع كلمة دالّة على المعلومات.
  blind_candidates:
    - lemma: "قِيَاسُ المَعْلُومَاتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «قياس» (مصدر قاسَ) و«المعلومات»، يدلّ على فعل القياس
        المتعلق بالمعلومات. القياس مصدر يصلح للدلالة على النظام والعملية معاً.
    - lemma: "مِعْيَارُ المَعْلُومَاتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مِعْيَار» (مِفْعَال من عَيَّرَ، أي ما يُعاير به) و«المعلومات».
        المعيار يدل على أداة التقدير والضبط، وهو قريب من مفهوم نظام القياس.
    - lemma: "مِقْيَاسٌ مَعْلُومَاتِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «مقياس» (اسم آلة من قاس) و«معلوماتي» (نسبة إلى معلومات).
        يصف أداة القياس بأنها مختصة بالمعلومات. أقل شيوعاً من الإضافي لكنه صحيح صرفياً.
    - lemma: "مِقْدَارُ المَعْلُومَاتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مِقْدَار» (ما يُقدَّر به الشيء) و«المعلومات».
        المقدار يدل على الكمية المحددة، لكنه أقرب إلى «كمية المعلومات» منه
        إلى «نظام قياس المعلومات».


stage2_evidence:
  per_lemma:
    - lemma: "مِقْيَاسُ الْمَعْلُومَاتِ"
      confirm:
        - text: "«القيمة المتوسطة لمقياس المعلومات المنقولة نتيجة لحدوث حدث ما من مجموعة محدودة من الأحداث المستقلة تبادليا والتي لها احتمالات محددة وتغطي كل فضاء الاحتمالات.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (تعريف إنتروبي)"
      expands:
        - text: "«المِقْيَاسُ: المِقدار وما قيس به من أداة أو آلة (ج) مقاييس»"
          source: "المعجم الوسيط"
          addition: "يؤكد أن المقياس اسم آلة وأداة قياس، مما يناسب الدلالة على نظام القياس"
        - text: "«شانون؛ وحدة قياس المعلومات لحدثين مترابطين»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يثبت استخدام تركيب «قياس المعلومات» في السياق التقني العربي"
        - text: "«هارتلي؛ وحدة قياس المعلومات لـ 10 أحداث مترابطة»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "شاهد إضافي على ثبوت التركيب في المصطلحية التقنية"

    - lemma: "قِيَاسُ المَعْلُومَاتِ"
      source: stage1
      expands:
        - text: "«شانون؛ وحدة قياس المعلومات لحدثين مترابطين»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "التركيب «قياس المعلومات» مستخدم في تسمية وحدات القياس لكنه يدل على الفعل (المصدر) لا على النظام"
        - text: "«الْقِيَاسُ، وَهُوَ تَقْدِيرُ الشَّيْءِ بِالشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس (مادة قوس)"
          addition: "القياس مصدر يدل على عملية التقدير"

    - lemma: "مِعْيَارُ المَعْلُومَاتِ"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "مِقْيَاسٌ مَعْلُومَاتِيٌّ"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "مِقْدَارُ المَعْلُومَاتِ"
      source: stage1
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "مِقْيَاسُ الْمَعْلُومَاتِ"
      decision: confirmed
      decision_reason: >
        اللمّة مثبتة في النصوص المصطلحية العربية الحديثة. تعريف «الإنتروبي» في
        مسرد التربية يستخدم حرفياً عبارة «مقياس المعلومات»، كما أن تركيبي
        «وحدة قياس المعلومات» (شانون وهارتلي) في موسوعة الكهرباء يؤكدان أن
        هذا المركب الإضافي مصطلح مسكوك في مجال نظرية المعلومات. التشكيل
        مُضاف: مِقْيَاسُ (اسم آلة على وزن مِفْعَال) + الْمَعْلُومَاتِ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِقْيَاسُ الْمَعْلُومَاتِ"

    - lemma: "قِيَاسُ المَعْلُومَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        «قياس» مصدر يدل على فعل القياس (العملية) لا على النظام القياسي ذاته.
        المجموعة الترادفية تعرّف «نظاماً» للقياس لا عمليةَ قياس، فالمقياس (اسم الآلة)
        أنسب من القياس (المصدر). كما أن الأدلة المتاحة تستخدم «قياس المعلومات»
        في سياق وصفي (وحدة قياس المعلومات) لا كمصطلح مستقل.
      evidence_assessment:
        case: mixed

    - lemma: "مِعْيَارُ المَعْلُومَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استخدام هذا التركيب في مجال نظرية المعلومات.
        «المعيار» يُستعمل عادة بمعنى المواصفة القياسية (standard) لا نظام القياس
        (measure)، مما يُحدث لبساً دلالياً.
      evidence_assessment:
        case: no_material

    - lemma: "مِقْيَاسٌ مَعْلُومَاتِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة على استعمال هذا التركيب الوصفي. التركيب الإضافي «مقياس المعلومات»
        أكثر شيوعاً وأوثق في المصطلحية العربية من الوصفي «مقياس معلوماتي».
        اختبار السكّ: يمكن إبدال «معلوماتي» بـ«بياناتي» أو «حاسوبي» والتعبير
        يبقى وصفاً حراً، مما يؤكد أنه ليس مصطلحاً مسكوكاً.
      evidence_assessment:
        case: no_material

    - lemma: "مِقْدَارُ المَعْلُومَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        «المقدار» يدل على الكمية المحددة لا على نظام القياس. المفهوم المقصود هو
        المنظومة القياسية (system of measurement) لا الكمية المُقاسة (quantity).
        لا أدلة معجمية على استخدام هذا التركيب مصطلحاً في نظرية المعلومات.
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "نظام لقياس المعلومات يعتمد على احتمالات الأحداث التي تنقل المعلومات"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية من الإنجليزية. يحتاج إلى صياغة معجمية
        عربية أصيلة بأسلوب الجنس القريب والفصل النوعي، مع ربطه بمصطلحات
        نظرية المعلومات المعروفة.
    authored:
      - type: terminological
        text: "نِظَامٌ مِنْ أَنْظِمَةِ الْقِيَاسِ يُحَدِّدُ كَمِّيَّةَ الْمَعْلُومَاتِ الَّتِي يَحْمِلُهَا حَدَثٌ مَا اعْتِمَادًا عَلَى احْتِمَالِ وُقُوعِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مَنْظُومَةٌ رِيَاضِيَّةٌ فِي نَظَرِيَّةِ الْمَعْلُومَاتِ تَقِيسُ مِقْدَارَ الْمَعْلُومَاتِ الَّتِي يُفْضِي إِلَيْهَا حَدَثٌ مِنْ مَجْمُوعَةِ أَحْدَاثٍ مُتَنَاهِيَةٍ، وَذَلِكَ بِدَلَالَةِ احْتِمَالَاتِ وُقُوعِهَا، وَمِنْ وَحَدَاتِهَا الشَّائِعَةِ: الْبِتُّ وَالنَّاتُ وَالْهَارْتْلِي"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نِظَامٌ مِنْ أَنْظِمَةِ الْقِيَاسِ يُحَدِّدُ كَمِّيَّةَ الْمَعْلُومَاتِ الَّتِي يَحْمِلُهَا حَدَثٌ مَا اعْتِمَادًا عَلَى احْتِمَالِ وُقُوعِهِ"

  examples:
    per_lemma:
      - lemma: "مِقْيَاسُ الْمَعْلُومَاتِ"
        examples:
          - text: "يُعَدُّ مِقْيَاسُ الْمَعْلُومَاتِ أَدَاةً أَسَاسِيَّةً فِي تَصْمِيمِ أَنْظِمَةِ الِاتِّصَالَاتِ الرَّقْمِيَّةِ، إِذْ يُتِيحُ تَحْدِيدَ الْحَدِّ الْأَدْنَى لِعَدَدِ الْبِتَّاتِ اللَّازِمَةِ لِتَرْمِيزِ رِسَالَةٍ مُعَيَّنَةٍ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ مِقْيَاسُ الْمَعْلُومَاتِ أَدَاةً أَسَاسِيَّةً فِي تَصْمِيمِ أَنْظِمَةِ الِاتِّصَالَاتِ الرَّقْمِيَّةِ، إِذْ يُتِيحُ تَحْدِيدَ الْحَدِّ الْأَدْنَى لِعَدَدِ الْبِتَّاتِ اللَّازِمَةِ لِتَرْمِيزِ رِسَالَةٍ مُعَيَّنَةٍ."


