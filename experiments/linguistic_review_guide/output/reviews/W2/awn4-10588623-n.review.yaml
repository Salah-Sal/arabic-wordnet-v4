# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10588623-n
# شخص ذو قدرة أو قيمة من الدرجة الثانية
# a person of second-rate ability or value
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان تعبيران وصفيّان مركّبان لا مصطلحان مسكوكان، ويمكن تغيير مكوّناتهما بحرية (شخص من الدرجة الأولى/الثالثة، متوسط الأداء/الكفاءة)"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي"
      - "لا توجد لمّة مفردة عربية في المجموعة تدلّ على المفهوم"
    observations: "المفهوم — شخص لا يتميّز بقدرة عالية ولا هو عديم القيمة بل هو في المنزلة الدنيا من الوسط — مفهوم حاضر في الثقافة العربية لكنه يُعبَّر عنه عادةً بعبارات وصفية لا بمصطلح مفرد. الجذر و-س-ط يحمل في العربية دلالة إيجابية (العدل والخيرية) مما يجعل استعماله للدلالة على الرداءة مشكلاً. أما «من الدرجة الثانية» فتركيب مقترض مفهومياً من الإنجليزية (second-rate)."
  blind_candidates:
    - lemma: "وَسَط"
      generation_method: majaz
      justification: "إزاحة دلالية من التوسّط المكاني إلى التوسّط في القدرة والقيمة. الجوهري يقول: «شيء وسط أي بين الجيد والرديء». لكنّ اللفظ في سياق الأشخاص يحمل دلالة إيجابية (الحسب والنسب)."
    - lemma: "نَكِرَة"
      generation_method: majaz
      justification: "إزاحة من الإبهام النحوي (ما وُضع لشيء لا بعينه) إلى انعدام التميّز والشأن. يُقال عامّياً «فلان نكرة» أي لا يُعرف ولا قيمة له."
    - lemma: "زَهِيد"
      generation_method: ishtiqaq
      justification: "من جذر ز-ه-د على وزن فَعِيل، يدلّ على القلّة والحقارة. في المعجم الكبير: «من الرجال: القليل الخير». قد يصلح وصفاً لشخص قليل القيمة."
    - lemma: "دُونِيّ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي منسوب إلى «دون» بمعنى الأدنى والأقلّ رتبة. التشكيل على وزن فُعْلِيّ للدلالة على من هو دون المستوى المطلوب في قدرته أو قيمته."

stage2_evidence:
  per_lemma:
    - lemma: "شَخْص مِنَ الدَّرَجَة الثَّانِيَة"
      confirm:
        - text: "«(1) من الدرجة الثانية (2) رديء.»"
          source: "المورد الحديث (2008) — مقابل second-rate"
      expands:
        - text: "«أسهم من الدرجة الثانية»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يُثبت استعمال التركيب «من الدرجة الثانية» في المصطلحية العربية الحديثة لكن في سياق مالي لا بشري"

    - lemma: "مُتَوَسِّط الْمُسْتَوَى"
      confirm:
        - text: "«متوسّط؛ عاديّ؛ معتدل الجودة أو ضئيلها.»"
          source: "المورد الحديث (2008) — مقابل mediocre"
        - text: "«(1) «أ» التوسّط: كونُ الشيء معتدل الجودة أو ضئيلها. «ب» مَقْدِرة [أو براعة] معتدلة (2) شخص متوسّط المقدِرة.»"
          source: "المورد الحديث (2008) — مقابل mediocrity"
      expands:
        - text: "«متوسط القدرة»"
          source: "مسرد التربية — المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يُثبت التركيب «متوسط + اسم القدرة» مصطلحاً تربوياً مقبولاً"

    - lemma: "وَسَط"
      confirm:
        - text: "«ويقال أيضا: شئ وسط، أي بين الجيد والردئ.»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      contradicts:
        - text: "«وهو أوسطهم حسبا، إذا كان في واسطة قومه وأرفعهم محلاً.»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          conflict: "في سياق الأشخاص يدلّ «وسط» على الرفعة والشرف لا على الرداءة"
        - text: "«الْوَاوُ وَالسِّينُ وَالطَّاءُ: بِنَاءٌ صَحِيحٌ يَدُلُّ عَلَى الْعَدْلِ وَالنِّصْفِ. وَأَعْدَلُ الشَّيْءِ: أَوْسَطُهُ وَوَسَطُهُ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الدلالي للجذر يدلّ على العدل والنصف الإيجابي لا على الانحطاط"

    - lemma: "نَكِرَة"
      contradicts:
        - text: "«ما وُضع لشيء لا بعينه»"
          source: "المعجم الوسيط"
          conflict: "النكرة مصطلح نحوي صرف يدلّ على الإبهام لا على ضعف القدرة أو القيمة"
        - text: "«النُّونُ وَالْكَافُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الْمَعْرِفَةِ الَّتِي يَسْكُنُ إِلَيْهَا الْقَلْبُ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدور حول الجهل وعدم المعرفة لا حول ضعف القيمة الشخصية"

    - lemma: "زَهِيد"
      confirm:
        - text: "«من الرِّجالِ: القَلِيلُ الخَيْرِ, اللَّئيمُ المَزْهُودُ فيما عِنْدَه»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الزَّهِيدُ: الشَّيْءُ الْقَلِيلُ. وَهُوَ مُزْهِدٌ: قَلِيلُ الْمَالِ... رَجُلٌ زَهِيدٌ: قَلِيلُ الْمَطْعَمِ، وَهُوَ ضَيِّقُ الْخُلُقِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الدلالة الغالبة على قلة المال والطعام وضيق الخلق لا على ضعف القدرة العقلية أو المهنية"
        - text: "«القليلُ الحقيرُ... القَلِيلُ الأكلِ القانِعُ بالقليل»"
          source: "المعجم الكبير"
          conflict: "الحقل الدلالي يرتبط بالبخل والزهد في المال لا بتوسط الكفاءة"

    - lemma: "دُونِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "شَخْص مِنَ الدَّرَجَة الثَّانِيَة"
      decision: confirmed
      decision_reason: "تعبير مركّب شبه ثابت في العربية المعاصرة يُقابل second-rater. رغم تركيبيّته، فإنّ «من الدرجة الثانية» أصبح وحدة دلالية مستقرّة في الصحافة والخطاب المعاصر بمعنى الأدنى جودة. المورد الحديث يُثبته مقابلاً لـ second-rate."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يحمل دلالة سلبية أوضح من «متوسط المستوى»، ويُشير إلى أنّ الشخص لا يبلغ المرتبة الأولى في الجودة أو الكفاءة، مع إيحاء بالرداءة"
      actions: []

    - lemma: "مُتَوَسِّط الْمُسْتَوَى"
      decision: confirmed
      decision_reason: "تعبير شائع ومفهوم في العربية المعاصرة، مُثبت في المصطلحية التربوية. المورد يُقابل mediocrity بـ «شخص متوسّط المقدرة». التركيب «متوسط + المستوى» وحدة معجمية متداولة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "أقلّ سلبية من «شخص من الدرجة الثانية»، يُركّز على التوسط والاعتيادية دون إيحاء صريح بالرداءة، ويصلح في السياقات الموضوعية والتربوية"
      actions: []

    - lemma: "وَسَط"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ الجوهري يُثبت «شيء وسط أي بين الجيد والرديء»، فإنّ الاستعمال في سياق الأشخاص يحمل دلالة إيجابية (الحسب والنسب والعدل). الاشتراك اللفظي بين الدلالة الإيجابية والسلبية يُولّد لبساً. وفي القرآن: {أُمَّةً وَسَطًا} أي عدلاً."
      evidence_assessment:
        case: mixed

    - lemma: "نَكِرَة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعمال «نكرة» بمعنى شخص ضعيف القدرة. المعاجم تقصرها على المصطلح النحوي (ما وُضع لشيء لا بعينه). الاستعمال العامّي «فلان نكرة» غير مُثبت في المعاجم الفصيحة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "زَهِيد"
      source: stage1
      decision: removed
      decision_reason: "الحقل الدلالي لـ «زهيد» يدور حول قلّة المال والطعام والبخل وضيق الخلق، لا حول توسّط الكفاءة أو القدرة. المعجم الكبير: «القليل الخير، اللئيم» — دلالة أخلاقية مختلفة عن المفهوم المطلوب."
      evidence_assessment:
        case: mixed

    - lemma: "دُونِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا أثر لهذا اللفظ في المعاجم العربية الكلاسيكية أو الحديثة. صيغة مُولَّدة غير مُثبتة."
      evidence_assessment:
        case: no_material

