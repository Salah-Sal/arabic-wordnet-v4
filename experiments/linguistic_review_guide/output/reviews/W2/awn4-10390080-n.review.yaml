step0_evidence:
  per_lemma:
    - lemma: "خفياني"
      expands:
        - text: "«الخفيانية: الإيمان بالقوى الخفية وبإمكان إخضاعها للسيطرة البشرية»"
          source: "المورد الحديث"
          addition: "يدل على المصدر الصناعي والمفهوم المجرد الذي يُشتق منه اسم الفاعل أو المنسوب (خفياني)."
    - lemma: "منجم"
      contradicts:
        - text: "«من ينظر في النجوم يحسب مواقيتها وسيرها ويستطلع من ذلك أحوال الكون»"
          source: "المعجم الوسيط"
          conflict: "المنجم يخص قراءة النجوم واستطلاع أحوال الكون، وهو أضيق بكثير من المتبحر في الفنون السحرية والعلوم الخفية بشكل عام."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "ساحر"
      source_section: "step5_english_bridge"
      evidence_citation: "«السّاحر؛ المُشَعْوِذ.» — المورد الحديث"
      justification: "الساحر هو من يمارس الفنون السحرية، وهو يتقاطع مع جزء من تعريف المجموعة (شخص متبحر في الفنون السحرية)."
  knowledge_candidates:
    - lemma: "روحاني"
      justification: "استخدام مجازي معاصر (مجاز) يُطلق على من يشتغل بالعلوم الخفية والأسرار الباطنية (كالأرقام والطلاسم)."
  generation_notes: "المصطلحات البديلة غالباً ما تميل إلى التخصيص (مثل ساحر ومشعوذ) أو تحمل دلالات دينية (مثل روحاني)، ويبقى (خفياني) الأكثر حيادية ودقة كمقابل لـ Occultist."

step1_lemma_validation:
  per_lemma:
    - lemma: "خفياني"
      decision: confirmed
      decision_reason: "مصطلح دقيق واشتقاق قياسي سليم (بإضافة ياء النسبة) للدلالة على المشتغل بالخفيانية (occultism)، وهو يغطي كامل دلالة المفهوم."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح شامل ومحايد يدل على الانتماء والممارسة للعلوم الخفية بمظلتها الواسعة، دون الحصر في ممارسة السحر."
      example: "كرّس الخفيانيّ حياته لدراسة الطلاسم القديمة واستكشاف القوى الباطنية في الطبيعة."

    - lemma: "منجم"
      decision: removed
      decision_reason: "المنجم مختص بالتنجيم (قراءة النجوم)، بينما المفهوم في المجموعة الترادفية أوسع ويشمل المتبحر في الفنون السحرية والعلوم الخفية بأنواعها."
      evidence_assessment:
        case: "contradicts_only"
      substitution_test:
        result: "fail"
      nuance_differentiation: "أضيق دلالياً؛ إذ ينحصر في استطلاع الغيب عبر مراقبة الأجرام السماوية، ولا يمتد بالضرورة للفنون السحرية والخفيانية الأخرى."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ساحر"
      source: step05
      decision: removed
      decision_reason: "مصطلح 'ساحر' يقابل (magician/sorcerer) وله مجموعة ترادفية مستقلة، بينما المفهوم هنا (occultist) يشمل الإيمان بالخفيات ودراسة علومها وليس فقط ممارسة السحر."
      step05_citation: "«السّاحر؛ المُشَعْوِذ.» — المورد الحديث"
      substitution_test:
        result: "fail"
      nuance_differentiation: "الساحر يمارس السحر بشكل مباشر بغرض التأثير، بينما الخفياني قد يكون باحثاً ومؤمناً بالعلوم الخفية كنسق فكري."

    - lemma: "روحاني"
      source: step05
      decision: removed
      decision_reason: "تعبير يُستخدم شعبياً، لكنه في الأصل يدل على ما يتعلق بالروح (spiritual)، واستعماله بمعنى مشتغل بالسحر أو الخفيات فيه تساهل ولا يرقى للدقة المصطلحية المطلوبة لمقابل occultist."
      step05_citation: "معرفة لغوية واستعمال معاصر"
      substitution_test:
        result: "fail"
      nuance_differentiation: "يحمل دلالات دينية وصوفية أو متعلقة بالأرواح، ولا يطابق المعنى الدقيق للخفياني الذي يدرس الفنون السحرية بمفهومها الشامل."

  synset_flags:
    definition_review_needed: false
    split_needed: false

