stage1_review:
  assessment:
    concerns:
      - اللمات الحالية تفتقر إلى التشكيل الكامل.
      - "عبور" كلمة عامة تحتاج إلى توضيح دلالتها الاصطلاحية في هذا السياق.
    observations: "المفهوم علمي دقيق يتعلق بالوراثة. المصطلح العربي 'عبور' ترجمة دقيقة لـ crossing over، بينما 'تصالب' يشير غالباً إلى البنية الفيزيائية (chiasma) الناتجة عن هذه العملية، لكنه يُستخدم اصطلاحياً للعملية نفسها."
  blind_candidates:
    - lemma: "عُبُور وِرَاثِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يخصص المعنى العام للعبور في سياق الوراثة."
    - lemma: "تَصَالُب"
      generation_method: ishtiqaq
      justification: "مصطلح قديم يُستخدم في العلوم للدلالة على التقاطع (chiasma) وهو المعادل البنيوي للعملية."
    - lemma: "تَبَادُل صِبْغِيّ"
      generation_method: tarkib
      justification: "تعبير وصفي دقيق يشرح ماهية العملية (interchange of chromosomes)."
    - lemma: "تَعَابُر"
      generation_method: ishtiqaq
      justification: "صيغة 'تفاعُل' تدل على المشاركة والتبادل بين طرفين، وهو ما يحدث بين الكروموسومات المتماثلة."

stage2_evidence:
  per_lemma:
    - lemma: "عُبُور"
      confirm:
        - text: "عبور: crossing over (Biology)"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "عملية تبادل المادة الوراثية بين ذراعي الصبغيين المتجانسين بواسطة كسر هذه الصبغيات والتحام بالتبادل..."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "تَصَالُب"
      confirm:
        - text: "تصالُب: ما نراه من تعانق الكروماتيدات غير الشقيقة في الدور التزاوجيّ للانقسام الاختزاليّ الأول."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "تقاطع على شكل صليب."
          source: "معجم المصطلحات الطبية (2003)"
    - lemma: "تَعَابُر"
      confirm:
        - text: "تَعابُر: crossing over"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "تَبَادُل صِبْغِيّ"
      confirm:
        - text: "تبادل صبغي: chromosome interchange"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"

stage3_analysis:
  per_lemma:
    - lemma: "تصالب"
      decision: confirmed
      decision_reason: "مصطلح وراثي معتمد يشير إلى نقطة التقاطع والعملية المرتبطة بها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصَالُب"
    - lemma: "عبور"
      decision: confirmed
      decision_reason: "الترجمة المعتمدة والأكثر شيوعاً لمصطلح crossing over في علم الأحياء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُبُور"
    - lemma: "تَعَابُر"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة صرفية ممتازة (تفاعل) تعكس التبادلية، وموجودة في المعاجم الطبية كمرادف دقيق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَعَابُر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13475303-n"}
    - lemma: "تَبَادُل صِبْغِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح وصفي دقيق ومستعمل في المعاجم الموحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "تَبَادُل صِبْغِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13475303-n"}

stage4_content:
  definition:
    current: "تبادل الأجزاء بين الكروموسومات المتماثلة المقترنة أثناء الطور الأول من الانقسام المنصف"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً وجامع مانع."
    authored:
      - type: terminological
        text: "عملية تبادل المادة الوراثية بين أزواج الصبغيات (الكروموسومات) المتماثلة خلال الانقسام الاختزالي، مما يؤدي إلى إعادة المؤتلفات الجينية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "عُبُور"
        examples:
          - text: "يحدث العُبُور الوراثي في الطور التمهيدي الأول من الانقسام المنصف لإنتاج تنوع جيني."
            type: usage
      - lemma: "تَصَالُب"
        examples:
          - text: "يرتبط التَصَالُب بتكوين بنية مجهرية متقاطعة بين الكروماتيدات غير الشقيقة."
            type: usage
      - lemma: "تَعَابُر"
        examples:
          - text: "تعتمد نسبة التَعَابُر بين الجينات على المسافة الفيزيائية بينها على الصبغي."
            type: usage
      - lemma: "تَبَادُل صِبْغِيّ"
        examples:
          - text: "ينتج عن التَبَادُل الصِبْغِيّ ظهور صفات وراثية جديدة في الأبناء لم تكن موجودة لدى الآباء."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-13475303-n", definition_index: 0, text: "عملية تبادل المادة الوراثية بين أزواج الصبغيات المتماثلة خلال الطور الأول من الانقسام المنصف، مما ينتج عنه تركيبات جينية جديدة."}

