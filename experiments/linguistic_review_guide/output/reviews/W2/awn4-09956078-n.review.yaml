step0_evidence:
  per_lemma:
    - lemma: "جامع"
      confirm:
        - text: "«من (ج م ع) المكان الذي يجمع الناس للصلاة فيه، ومن يضم الأشياء المتناثرة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«جامع نفايات: شخص يعمل لدى السلطة المحلية أو شركة خاصة لجمع النفايات البلدية الصلبة»"
          source: "مسرد المناخ والبيئة، ARABTERM"
          addition: "يثبت استخدام جامع كاسم فاعل يدل على الشخص الذي يقوم بجمع أشياء محددة بصفة مهنية أو اعتيادية."
    - lemma: "مُجَمِّع"
      expands:
        - text: "«يُطلق هذا المُصطلح في هندسة الصرف الصحيّ على القناة التي تستقبل مياه الصرف الصحيّ المُحوّلة من نطاقات جزئية»"
          source: "المعجم الموحد لمصطلحات المياه"
          addition: "يدل على الآلة أو الأداة أو البرنامج الذي يجمع الأشياء أو البيانات، ويمكن قياسه على الشخص الذي يمارس التجميع الممنهج."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جامع نفايات"
      source_section: "step5_english_bridge"
      evidence_citation: "«جامع نفايات: waste collector» — مسرد المناخ والبيئة"
      justification: "ترجمة لمصطلح collector المتخصص، لكنه مقيد بالنفايات فاعتبرته للتمثيل فقط."
  knowledge_candidates:
    - lemma: "مُقْتَنٍ"
      justification: "اشتقاق (اسم فاعل) من الفعل (اقتنى) للدلالة على من يتخذ الأشياء لنفسه ويحتفظ بها، وهو شائع في التعبير عن هواة جمع الأشياء الثمينة (مقتني التحف)."
    - lemma: "جَمَّاع"
      justification: "اشتقاق على وزن المبالغة (فَعَّال) للدلالة على من يُكثر من جمع الأشياء (مثل: جمّاع للكتب والمخطوطات)."

step1_lemma_validation:
  per_lemma:
    - lemma: "جامع"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر للدلالة على من يجمع الأشياء، واسم فاعل صريح من الفعل (جمع)."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على الفاعل المباشر لعملية الجمع، وهو الأشيع في وصف هواة جمع الأشياء كـ (جامع الطوابع)."
      example: "يُعَدُّ صديقي جامعَ طوابعٍ نادرة من مختلف أنحاء العالم."
      
    - lemma: "مُجَمِّع"
      decision: confirmed
      decision_reason: "مصطلح صحيح صرفياً (اسم فاعل من جَمَّعَ المضعّف) يفيد الجمع المنظم أو المتكرر، ويستخدم بكثرة في السياقات المهنية والتقنية للمجمّعين للأشياء."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يفيد التكثير أو الجمع المنظم والممنهج (التجميع)، ويكون أدلّ على الجهد أو الجانب المهني والتقني مقارنة بـ (جامع)."
      example: "يعمل هذا المُجَمِّعُ على تصنيف البيانات والمعلومات وترتيبها."

    - lemma: "مُقْتَنٍ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح دقيق وفصيح يعبّر عن الشخص الذي يجمع الأشياء القيمة ويحتفظ بها."
      step05_citation: "من المعرفة اللغوية (الاشتقاق من اقتنى)."
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بجمع الأشياء الثمينة أو ذات القيمة العالية (كالتحف والفنون) بغرض الاحتفاظ والملكية (الاقتناء)، بخلاف الجمع المطلق."
      example: "حضر المعرض العديد من مقتني اللوحات الفنية الثمينة."
      actions:
        - command: create_entry
          params:
            lemma: "مُقْتَنٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09956078-n"

    - lemma: "جَمَّاع"
      source: step05
      decision: confirmed
      decision_reason: "صيغة مبالغة فصيحة ومعتمدة للدلالة على المبالغة في فعل الجمع."
      step05_citation: "من المعرفة اللغوية (صيغة المبالغة من جمع)."
      substitution_test:
        result: "pass"
      nuance_differentiation: "يفيد المبالغة والكثرة في جمع الأشياء والشغف الشديد بها، كما يقال (جمّاع للكتب)."
      example: "كان الجاحظ جمّاعاً للكتب والمخطوطات النادرة."
      actions:
        - command: create_entry
          params:
            lemma: "جَمَّاع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09956078-n"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "مُقْتَنٍ"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "جَمَّاع"
      reason: "مصدر: الخطوة ٠٫٥"
