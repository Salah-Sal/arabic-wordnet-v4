          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — translation_en: materialism"
          addition: "يكشف عن تنازع دلالي بين معنيَي المادية: الصفة الوجودية (materiality) والمذهب الفلسفي (materialism)"

    - lemma: "جِسْمِيَّة"
      contradicts:
        - text: "«جسمية» — translation_en: objective — domain: Civil Engineering"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "المصطلح مستخدم في الهندسة المدنية بمعنى objective (موضوعي) لا بمعنى الصفة الجسمانية؛ التداخل الدلالي يُبطل الترشيح"

    - lemma: "عَيْنِيَّة"
      contradicts:
        - text: "«العينية: الِاتِّحَاد فِي الذَّات، وَفِي الْفِقْه أَن يَأْتِي الرجل رجلا ليقرضه فَلَا يرغب الْمقْرض وَلَا يقْرض قرضا حسنا طَمَعا فِي الْفضل الَّذِي لَا يَنَالهُ بالقرض فَيَقُول أبيعك هَذَا الثَّوْب بِاثْنَيْ عشر درهما إِلَى أجل وَقِيمَته عشرَة وَإِنَّمَا سمي عَيْنِيَّة لِأَن الْمقْرض أعرض عَن الْقَرْض إِلَى بيع الْعين»"
          source: "دستور العلماء للأحمدنكري (hawramani_23)"
          conflict: "المصطلح محمّل في الفقه الإسلامي بمعنى الاتحاد في الذات وبيع العينة؛ بعيد عن معنى الجسمانية"
        - text: "«عينية» — translation_en: eyepiece — domain: Physics / Biology / Geology"
          source: "معاجم أرابترم المتعددة (فيزياء، أحياء، جيولوجيا، زلازل، طب)"
          conflict: "العينية مُثبَّتة في المعاجم العلمية الحديثة بمعنى eyepiece (عدسة العين في المنظار)؛ استخدامها للجسمانية يُوقع في التباس خطير"

    - lemma: "جِرْمِيَّة"
      evidence_status: "no_material_found"

    - lemma: "هَيُولِيَّة"
