    - lemma: "جُسْمَانِيَّة"
      confirm:
        - text: "«(1) الجسمانية؛ الجَسَدانيّة (2) الوجود الماديّ؛ الجسد (3) pl.: الأشياء المتعلقة بالجَسَد.»"
          source: "المورد الحديث (2008) — مدخل translation_en: corporality"
      expands:
        - text: "«اعتداء جسمانيّ، اعتداء مادي» — physical assault"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
