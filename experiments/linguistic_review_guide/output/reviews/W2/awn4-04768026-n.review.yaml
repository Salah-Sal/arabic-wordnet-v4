        - text: "«إكراه ماديّ، إكراه جسمانيّ» — physical constraint; physical coercion"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يؤكد تكافؤ جسماني ومادي في السياق القانوني بمعنى physical"

    - lemma: "مَادِّيَّة"
      confirm:
        - text: "«(1) الماديّة: كون الشيء ماديًّا (2) مادّة؛ شيء مادّيّ.»"
          source: "المورد الحديث (2008) — مدخل translation_en: materiality"
      contradicts:
        - text: "«(المادية) مَذْهَب يسلم بِوُجُود الْمَادَّة وَحدهَا وَبهَا يُفَسر الْكَوْن والمعرفة والسلوك (مج) — و(المادية التاريخية) مَذْهَب (كارل ماركس) الَّذِي يَرْمِي إِلَى تَفْسِير النّظم الاجتماعية والأحداث التاريخية بالظواهر الاقتصادية (مج)»"
          source: "المعجم الوسيط — مجمع اللغة العربية (ت. 1998م)"
          conflict: "المعجم الوسيط يُعرِّف المادية بوصفها مذهباً فلسفياً (materialism) لا صفةً للتكوين المادي (materiality)؛ تعدُّد المعنى يُوجب التمييز السياقي"
      expands:
