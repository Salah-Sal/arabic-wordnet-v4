# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "جُسْمَانِيَّة"
      decision: confirmed
      decision_reason: "تدعمها شواهد المورد الحديث مباشرةً بمعنى corporality (الجسمانية = الوجود المادي)، كما يُرسِّخها الاستخدام القانوني الحديث. مشتقة من جُسمان (الشخص/الجسد) وهو اشتقاق صحيح عند ابن فارس ('الجُسمانُ: الشخص'). التشكيل صحيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُبرز الجانبَ الهيكلي الجسدي — كَوْن الكيان ذا جِسمٍ ملموس مُدرَك بالحواس وله شكل وامتداد؛ مشتقة من جُسمان (الشخص) وتُفيد البُعدَ الشكلي والتجسيمي للوجود المادي"

    - lemma: "مَادِّيَّة"
      decision: confirmed
      decision_reason: "يؤكدها المورد الحديث صراحةً بمعنى 'كون الشيء مادياً' (= materiality). التشكيل صحيح (مَادِّيَّة بتشديد الدال). الدليل المتعارض من المعجم الوسيط يُشير إلى معنى مختلف (materialism) لا ينفي المعنى الأصيل المقصود في هذه المجموعة؛ التمييز السياقي كافٍ."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُبرز الجانبَ الجوهري الفيزيائي — صفةُ تكوُّن الشيء من مادةٍ في مقابل الطبيعة الروحانية أو التجريدية؛ تحمل ثقلاً فلسفياً وتنزع في سياقات أخرى نحو معنى المذهب المادي (materialism)"

    - lemma: "جِسْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الشاهد المعجمي الوحيد يُترجمها بـ 'objective' في الهندسة المدنية، وهو معنى مختلف. لا دليل على استخدامها للدلالة على صفة الجسمانية أو المادية في أي معجم."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "عَيْنِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح محمّل بمعانٍ متعددة راسخة: بيع العينة في الفقه، وعدسة العين (eyepiece) في علوم الطبيعة؛ استخدامه للجسمانية يُفضي إلى لَبس شديد. مبدأ إيثار العربي مُوفَّر في جسمانية/مادية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "جِرْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا وجود لها في المعاجم بهذه الدلالة. أصل جرم عند ابن فارس هو القطع والاكتساب والجرم (الإثم)، والمعنى الجسدي ثانوي جداً ('الجسد جِرم لأن له قدراً وتقطيعاً'). لا يصلح أساساً للمصطلح في غياب الاستعمال المعجمي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "هَيُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الهيولى في المعجمية الحديثة انزاحت دلالياً نحو هيولى الخلية (cytoplasm) في الطب، ونحو الفوضى في المورد الحديث. المعنى الفلسفي الأرسطي (المادة الأولى) اندثر في التداول المعاصر، ولا يصح إحياؤه في سياق سيُوقع في لَبس طبي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


