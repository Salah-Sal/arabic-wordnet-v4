# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي فيه دَوَرَانٌ دلالي: يستخدم 'مادياً' و'من مادة' في تعريف مصطلحٍ اشتُقَّ هو نفسه من 'مادة'؛ ما يجعله غير وافٍ بمعيار عدم الحميّة"
      - "الجزءان في التعريف متكرران مضمونًا ('مادياً' و'مكوناً من مادة') دون إضافة فصلٍ نوعي مستقل"
      - "المجموعة تجمع مفهومَين متقاربَين لكنهما متمايزان: الجسمانية (corporeality — ذو جِسم محسوس) والمادية (materiality — مُتألِّف من مادة)؛ يُفيد تدقيق الحدود الدلالية بين اللمّتين في الإثراء"
    observations: "المجموعة ذات موروث فلسفي كلاسيكي تصف صفةَ كون الشيء من طينة المادة المحسوسة في مقابل الوجود الروحاني أو المجرَّد. مفهوم الجسمانية عُبِّر عنه في الفلسفة الإسلامية بالجِسم (ابن سينا، الغزالي)، وفي المعجمية الحديثة بجسماني وجسدي. مفهوم المادية أوسع دلالةً وقد تشعّب في العربية الحديثة ليشمل المذهب الفلسفي (materialism). الجذر جسم يحمل في مقاييس ابن فارس معنى تجمُّع الشيء وإدراكه، وهو ما يوافق المفهوم المقصود. يُلاحَظ غياب لمّة جسدية رغم توثيقها في معاجم الألسنيات بمعنى corporeality؛ تستحق الدراسة."

  blind_candidates:
    - lemma: "جِسْمِيَّة"
      generation_method: ishtiqaq
      justification: "اشتُقَّ من جِسْم (كُلُّ شخص مُدرَك) على وزن فِعْلِيَّة المصدري الصناعي المُختصّ بالمفاهيم المجردة؛ يُعبِّر عن صفة كون الشيء ذا جسم محسوس"
    - lemma: "عَيْنِيَّة"
      generation_method: majaz
      justification: "من العَيْن بمعناها الفلسفي (الموجود الحقيقي الذاتي في مقابل العَرَض)؛ استُخدمت في الفلسفة الإسلامية للوجود الملموس المحسوس خلافاً للمجرَّد"
    - lemma: "جِرْمِيَّة"
      generation_method: ishtiqaq
      justification: "من جِرْم (الكتلة المادية ذات القَدْر والتقطيع — 'والجسد جِرمٌ لأن له قدراً وتقطيعاً' ابن فارس) + ياء النسب + تاء التأنيث الصناعي"
    - lemma: "هَيُولِيَّة"
      generation_method: majaz
      justification: "إحياء للفظ الهَيُولى (المادة الأولى عند أرسطو كما عرّبها ابن سينا والفارابي) — إزاحة دلالية من المادة الأوليّة إلى صفة التكوُّن من مادة"


