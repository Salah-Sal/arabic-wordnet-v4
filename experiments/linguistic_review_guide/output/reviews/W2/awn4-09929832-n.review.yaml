stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (جذاب، ساحر، فاتن) تُستخدم غالباً كصفات، ويجب التأكد من ورودها كأسماء تدل على الذات (شخص) في هذا السياق."
      - "هناك تداخل محتمل مع المعنى الحرفي (ساحر بمعنى مشعوذ)."
    observations: "المجموعة تدور حول الشخص الذي يمتلك قدرة طبيعية أو مكتسبة على استمالة الآخرين بجاذبيته. التعريف العربي الحالي دقيق ولكنه يركز على الفعل (يسحر) أكثر من الصفة الملازمة."
  blind_candidates:
    - lemma: "فَتَّان"
      generation_method: ishtiqaq
      justification: "على وزن (فَعَّال) للمبالغة، من الفعل (فتن) الذي يعني الاستمالة والوله."
    - lemma: "خَلَّاب"
      generation_method: ishtiqaq
      justification: "من (خلب) أي فتن قلبه وجذبه برقيق الحديث والجمال."
    - lemma: "آسِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (أسر)، يُستخدم مجازاً لمن يأسر القلوب والأنظار بجاذبيته."
    - lemma: "جَذَّاب الأَنْظَار"
      generation_method: tarkib
      justification: "مركب وصفي يدل على الشخص الذي يجذب الانتباه والأنظار إليه."

stage2_evidence:
  per_lemma:
    - lemma: "جَذَّاب"
      confirm:
        - text: "«جَذَّاب: يجذب الانتباه ويلفت الأنظار»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«الجَاذِبِيَّة: الحالة التي يَجذبُ بها صاحبها غيره. يقال: فلان له جاذبية: يَستَميلُ غيرَه إليه.»"
          source: "المعجم الوسيط"
    - lemma: "سَاحِر"
      confirm:
        - text: "«سَاحِر: من (س ح ر) الخادع والحاوي.»"
          source: "موسوعة السلطان قابوس"
        - text: "«charmer: الساحر؛ المشتغل بالسحر، الحاوي، الفاتن.»"
          source: "المورد الحديث"
    - lemma: "فَاتِن"
      confirm:
        - text: "«فَاتِن: من (ف ت ن) الجميل وما يبهر الإنسان ويستهويه.»"
          source: "موسوعة السلطان قابوس"
    - lemma: "فَتَّان"
      confirm:
        - text: "«فَتَّان: من (ف ت ن) الشيطان، واللص... والفتان عن الشيء: الصارف.»"
          source: "موسوعة السلطان قابوس"
      expands:
        - text: "«الفَتَّانُ: ... الفتّانان: الدرهم والدينار»"
          source: "المعجم الوسيط"
          addition: "تشير المبالغة في 'فتان' إلى قوة الأثر، وتُستخدم حديثاً لوصف الفاتن جداً."
    - lemma: "خَلَّاب"
      confirm:
        - text: "«خَلَبَ: فلاناً: خدعه وفتن قلبه.»"
          source: "المعجم الوسيط"
        - text: "«الخِلابةُ: الخديعةُ برقيق الحديث.»"
          source: "المعجم الوسيط"
    - lemma: "آسِر"
      confirm:
        - text: "«آسِر؛ فاتن؛ رائع؛ لافت للنظر.»"
          source: "المورد الحديث (ترجمة arresting)"
        - text: "«يأسِر: يفتِن؛ يَسْحَر؛ يَسْبي؛ يَخْلِب.»"
          source: "المورد الحديث (ترجمة captivate)"

stage3_analysis:
  per_lemma:
    - lemma: "جَذَّاب"
      decision: confirmed
      decision_reason: "مصطلح شائع جداً ويدل مباشرة على الشخص ذي الجاذبية، وتؤيده المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَذَّاب"
    - lemma: "سَاحِر"
      decision: confirmed
      decision_reason: "يدل على الشخص الذي يملك أثراً سحرياً في جذب الآخرين، وهو من الترجمات المعتمدة لـ charmer."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَاحِر"
    - lemma: "فَاتِن"
      decision: confirmed
      decision_reason: "يدل على الجمال الباهر الذي يستهوي الإنسان، وهو مصطلح أصيل ومؤيد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَاتِن"
    - lemma: "خَلَّاب"
      source: stage1
      decision: confirmed
      decision_reason: "مشتق من (خلب) بمعنى فتن القلب، ويُستخدم لوصف الشخص الذي يخلب الألباب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خَلَّاب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فَتَّان"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة مبالغة من فتن، تدل على شدة الجاذبية والفتنة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَتَّان", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "آسِر"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل يدل على من يأسر القلوب بجاذبيته، وهو مستخدم بكثرة في السياقات الأدبية والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "آسِر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يسحر الآخرين (عادة بجاذبيته الشخصية)"
    assessment:
      decision: revise
      reason: "التعريف الحالي يركز على الفعل 'يسحر' الذي قد يُفهم حرفياً كشعوذة، ويحتاج إلى توضيح الجانب المعنوي والجمالي."
    authored:
      - type: terminological
        text: "من يستميل الناس ويستهويهم بجماله أو سحر شخصيته أو حُسن حديثه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "جَذَّاب"
        examples:
          - text: "كان بطل الرواية شخصاً جذاباً يألفه الناس من اللحظة الأولى."
            type: usage
      - lemma: "سَاحِر"
        examples:
          - text: "تحدث المحاضر بأسلوب ساحر مكنه من كسب ثقة الجمهور."
            type: usage
      - lemma: "فَاتِن"
        examples:
          - text: "ظهرت الممثلة في الحفل بجمال فاتن جذب جميع الأنظار."
            type: usage
      - lemma: "خَلَّاب"
        examples:
          - text: "إنه رجل خلاب بحديثه الرقيق الذي لا يُمل."
            type: usage
      - lemma: "فَتَّان"
        examples:
          - text: "تمتلك تلك الطفلة ابتسامة فتانة تبهج كل من يراها."
            type: usage
      - lemma: "آسِر"
        examples:
          - text: "ألقى الشاعر قصيدة بصوت آسر سكنت له القلوب."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "من يستميل الناس ويستهويهم بجماله أو سحر شخصيته أو حُسن حديثه."}

stage5_enrichment:
  per_entry:
    - lemma: "جَذَّاب"
      entry_id: "{auto}"
      root: "جذب"
      maqayis_quote: "«الْجِيمُ وَالذَّالُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى بَتْرِ الشَّيْءِ. يُقَالُ جَذَبْتُ الشَّيْءَ أَجْذِبُهُ جَذْبًا.»"
    - lemma: "سَاحِر"
      entry_id: "{auto}"
      root: "سحر"
      maqayis_quote: "«السِّينُ وَالْحَاءُ وَالرَّاءُ أُصُولٌ ثَلَاثَةٌ مُتَبَايِنَةٌ... وَالْآخَرُ خَدْعٌ وَشِبْهُهُ... السِّحْرُ، قَالَ قَوْمٌ: هُوَ إِخْرَاجُ الْبَاطِلِ فِي صُورَةِ الْحَقِّ، وَيُقَالُ هُوَ الْخَدِيعَةُ.»"
    - lemma: "فَاتِن"
      entry_id: "{auto}"
      root: "فتن"
      maqayis_quote: "«الْفَاءُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاءٍ وَاخْتِبَارٍ. مِنْ ذَلِكَ الْفِتْنَةُ.»"
    - lemma: "خَلَّاب"
      entry_id: "{auto}"
      root: "خلب"
      maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْبَاءُ أُصُولٌ ثَلَاثَةٌ: أَحَدُهَا إِمَالَةُ الشَّيْءِ إِلَى نَفْسِكَ... وَمِنَ الْبَابِ الْخِلَابَةُ: الْخِدَاعُ، يُقَالُ خَلَبَهُ بِمَنْطِقِهِ.»"
    - lemma: "فَتَّان"
      entry_id: "{auto}"
      root: "فتن"
      maqayis_quote: "«الْفَاءُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاءٍ وَاخْتِبَارٍ. مِنْ ذَلِكَ الْفِتْنَةُ.»"
    - lemma: "آسِر"
      entry_id: "{auto}"
      root: "اسر"
      maqayis_quote: "«الْهَمْزَةُ وَالسِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَقِيَاسٌ مُطَّرِدٌ، وَهُوَ الْحَبْسُ، وَهُوَ الْإِمْسَاكُ. مِنْ ذَلِكَ الْأَسِيرُ.»"
  per_sense:
    - lemma: "جَذَّاب"
      sense_id: "{auto}"
      nuance: "يركز على قوة الشد والميل التلقائي نحو الشخص."
      mwe: false
    - lemma: "سَاحِر"
      sense_id: "{auto}"
      nuance: "يشير إلى تأثير غامض وقوي يشبه السحر في استمالة العقول."
      mwe: false
    - lemma: "فَاتِن"
      sense_id: "{auto}"
      nuance: "يركز على الجمال الباهر الذي يوقع الإنسان في الحيرة والذهول."
      mwe: false
    - lemma: "خَلَّاب"
      sense_id: "{auto}"
      nuance: "يركز على الاستمالة بالقول اللطيف أو المظهر الذي يخلب الألباب."
      mwe: false
    - lemma: "فَتَّان"
      sense_id: "{auto}"
      nuance: "يدل على بلوغ الذروة في الإغراء والفتنة."
      mwe: false
    - lemma: "آسِر"
      sense_id: "{auto}"
      nuance: "يركز على تقييد حرية الشخص المقابل معنوياً بحيث يصبح أسيراً لهذا السحر."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جذب","maqayis":"«الْجِيمُ وَالذَّالُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى بَتْرِ الشَّيْءِ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على قوة الشد والميل التلقائي نحو الشخص.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
