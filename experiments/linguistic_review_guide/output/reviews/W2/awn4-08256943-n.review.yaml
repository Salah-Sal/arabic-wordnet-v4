      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"باب","root":"بوب","maqayis":"«الْبَاءُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ وَاحِدٌ...»"},{"word":"دوار","root":"دور","maqayis":"«الدَّالُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِحْدَاقِ الشَّيْءِ بِالشَّيْءِ مِنْ حَوَالَيْهِ...»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُستخدم لوصف المؤسسة نفسها ككيان متبدل، مشبهاً إياها بالباب الذي لا يتوقف عن الدوران ليدخل الناس ويخرجوا فوراً.","mwe":true}'
    - command: set_metadata
      params:
