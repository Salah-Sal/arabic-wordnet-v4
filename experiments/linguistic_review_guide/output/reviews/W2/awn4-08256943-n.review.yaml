stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'باب دوار' هي ترجمة حرفية (Calque) للمصطلح الإنجليزي 'revolving door'."
      - "يفتقر المعجم العربي التقليدي لمصطلح واحد مخصص لهذه الظاهرة المؤسسية، ويتم التعبير عنها غالباً بالوصف."
    observations: "المفهوم يشير إلى عدم الاستقرار الوظيفي في مؤسسة ما. المصطلح 'باب دوار' شاع في الصحافة والترجمة الإدارية المعاصرة، وهو مقبول لاستخدامه المجازي الواضح."
  blind_candidates:
    - lemma: "بَابٌ دَوَّارٌ"
      generation_method: tarkib
      justification: "الترجمة الاصطلاحية الشائعة للمفهوم في السياقات الإدارية والسياسية."
    - lemma: "مُؤَسَّسَةٌ سَيَّالَةٌ"
      generation_method: majaz
      justification: "استعارة لوصف المؤسسة التي لا يستقر فيها الموظفون، تشبيهاً لها بالسائل الذي لا يثبت."
    - lemma: "هَيْئَةٌ عَابِرَةٌ"
      generation_method: tarkib
      justification: "وصف للمؤسسة التي تكون مجرد محطة عبور للموظفين."
    - lemma: "مُؤَسَّسَةٌ قَلِقَةٌ"
      generation_method: majaz
      justification: "استخدام 'القلق' بمعنى عدم الاستقرار، وهو تعبير عربي فصيح."

stage2_evidence:
  per_lemma:
    - lemma: "باب دوار"
      confirm:
        - text: "«باب دوّار: باب يسمح بالدخول والخروج واحدًا واحدًا»"
        - source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«دوران: ... دوران الدَّم: جريانه في الجسم ... لفّ ودوران: مخادعة.»"
        - source: "معجم اللغة العربية المعاصرة"
        addition: "يوثق المعجم استخدام 'دوران' في سياقات مجازية متنوعة."
    - lemma: "معدل دوران"
      confirm:
        - text: "«تردد دوران رأس المال يعد إشارة إلى عدد مرات تخزين وتفريغ واستهلاك مخزون المستودع...»"
        - source: "معجم مصطلحات النقل (عرب تيرم)"
      expands:
        - text: "«turnover: دوران رأس المال»"
        - source: "معجم مصطلحات النقل (عرب تيرم)"
        addition: "يؤكد استخدام 'دوران' لترجمة 'turnover' في السياقات الاقتصادية والإدارية."

stage3_analysis:
  per_lemma:
    - lemma: "باب دوار"
      decision: confirmed
      decision_reason: "مصطلح اصطلاحي مستقر في اللغة العربية المعاصرة (Calque) للتعبير عن المؤسسة التي تشهد حركية مرتفعة للموظفين، وهو المرادف الوحيد المسكوك لهذا المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَابٌ دَوَّارٌ"

stage4_content:
  definition:
    current: "منظمة أو مؤسسة تعاني من معدل مرتفع في تغيير الموظفين أو العضوية"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق وظيفياً، لكن يفضل صياغته بأسلوب معجمي يوضح الطبيعة المجازية للمصطلح."
    authored:
      - type: terminological
        text: "تعبيرٌ مجازيّ يُطلَق على مُؤَسَّسَةٍ أَوْ مُنَظَّمَةٍ تَشْهَدُ تَبَدُّلاً سَرِيعاً وَمُتَكَرِّراً فِي كَادِرِهَا الْوَظِيفِيِّ أَوْ أَعْضَائِهَا، بِحَيْثُ لَا يَسْتَقِرُّ فِيهَا الْأَفْرَادُ طَوِيلاً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "تعبيرٌ مجازيّ يُطلَق على مُؤَسَّسَةٍ أَوْ مُنَظَّمَةٍ تَشْهَدُ تَبَدُّلاً سَرِيعاً وَمُتَكَرِّراً فِي كَادِرِهَا الْوَظِيفِيِّ أَوْ أَعْضَائِهَا، بِحَيْثُ لَا يَسْتَقِرُّ فِيهَا الْأَفْرَادُ طَوِيلاً."

  examples:
    per_lemma:
      - lemma: "بَابٌ دَوَّارٌ"
        examples:
          - text: "أَصْبَحَتِ الشَّرِكَةُ بَاباً دَوَّاراً لِلْمُوَظَّفِينَ بِسَبَبِ سُوءِ الْإِدَارَةِ وَضَعْفِ الْحَوَافِزِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُعَانِي بَعْضُ الْوِزَارَاتِ مِنْ ظَاهِرَةِ الْبَابِ الدَّوَّارِ حَيْثُ لَا يَمْكُثُ الْمَسْؤُولُونَ فِي مَنَاصِبِهِمْ أَكْثَرَ مِنْ عِدَّةِ أَشْهُرٍ."

stage5_enrichment:
  per_entry:
    - lemma: "بَابٌ دَوَّارٌ"
      entry_id: "{auto}"
      roots:
        - word: "باب"
          root: "بوب"
          maqayis_quote: "«الْبَاءُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ قَوْلُكَ تَبَوَّبْتُ بَوَّابًا، أَيِ اتَّخَذْتَ بَوَّابًا وَالْبَابُ أَصْلُ أَلِفِهِ وَاوٌ.»"
        - word: "دوار"
          root: "دور"
          maqayis_quote: "«الدَّالُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِحْدَاقِ الشَّيْءِ بِالشَّيْءِ مِنْ حَوَالَيْهِ. يُقَالُ دَارَ يَدُورُ دَوَرَانًا.»"

  per_sense:
    - lemma: "بَابٌ دَوَّارٌ"
      sense_id: "{auto}"
      nuance: "يُستخدم لوصف المؤسسة نفسها ككيان متبدل، مشبهاً إياها بالباب الذي لا يتوقف عن الدوران ليدخل الناس ويخرجوا فوراً."
      mwe: true

  synset:
    cultural_fit: lexical_gap

  actions:
