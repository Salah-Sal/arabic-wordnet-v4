# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-07964544-n
# people who are free — الناس الذين يتمتعون بالحرية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «أحرار» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط وهي جمع تكسير؛ قد يُستحسن إضافة صيغ أخرى"
      - "التعريف العربي بسيط وعام — يفتقر إلى الجنس القريب والفصل النوعي"
    observations: "المفهوم يدلّ على جماعة من الناس يتّصفون بالحرية، أي خلاف العبيد والأرقّاء. هذا مفهوم أصيل في الثقافة العربية له جذور عميقة في التراث اللغوي والفقهي والاجتماعي. الجذر «حرر» من أغنى الجذور العربية دلالةً، ومقاييس اللغة يجعل أصله الأول «ما خالف العبودية وبرئ من العيب والنقص». اللمّة «أحرار» هي الجمع الأشهر لـ«حُرّ» وتتناسب تماماً مع المعنى المطلوب."
  blind_candidates:
    - lemma: "أَحْرَار"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«حُرّ» على وزن أَفْعَال، وهو الجمع الأشهر والأكثر استعمالاً للدلالة على الأشخاص المتمتعين بالحرية"
    - lemma: "طُلَقَاء"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«طَلِيق» على وزن فُعَلَاء، يدلّ على من أُطلق سراحه وفُكّ قيده فصار حرّاً"
    - lemma: "عُتَقَاء"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«عَتِيق» على وزن فُعَلَاء، يدلّ على المُحرَّرين من الرقّ والعبودية"
    - lemma: "مُحَرَّرُون"
      generation_method: ishtiqaq
      justification: "جمع مذكر سالم لاسم المفعول «مُحَرَّر» من الفعل «حرَّر»، يدلّ على من نال حريته بفعل التحرير"

stage2_evidence:
  per_lemma:
    - lemma: "أَحْرَار"
      confirm:
        - text: "«الخالص من الشوائب. يقال: ذهب حُرٌّ: لا نُحاس فيه. وفرَس حُرٌّ: عتيق الأصل الخالص من الرق الكريم. وهى حُرَّة. (ج) حرائر من الأشياء: أفضلها»"
          source: "المعجم الوسيط"
        - text: "«الْحر: الْخَالِص من الشوائب ... والخالص من الرّقّ والكريم (ج) أَحْرَار وَهِي حرَّة (ج) حرائر»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«وبالضم: خِلافُ العبدِ، وخيارُ كُلِّ شيءٍ، والفرسُ العتيقُ ... ورجُلٌ بَيِّنُ الحَرُورِيَّةِ ... والحُرِّيَّةِ ج: أحرارٌ وحِرارٌ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«خِلافُ العَبْدِ الكَرِيمُ ... مِنْ كُلِّ شَيءٍ: جَيِّدُه وأفْضَلُه وخِياره ... مِنَ الرِّجالِ: خَيْرُهم وأفْضَلُهم»"
          source: "المعجم الكبير"
      expands:
        - text: "«الحر: بالكسر، فرج المرأة، وبالضم ما خلص من الاختلاط بغيره من نحو طين، ومن الرجال خلاف العبد لأنه خلص من الرق. والحرية ضربان: الأول من لم يجر عليه حكم السبي ... والثاني من لم تملكه قواه الذميمة من حرص وشره على المقتنيات الدنيوية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "التمييز بين الحرية الحكمية (عدم الرق) والحرية المعنوية (التحرر من الشهوات)"
        - text: "«فَالْأَوَّلُ مَا خَالَفَ الْعُبُودِيَّةَ وَبَرِئَ مِنَ الْعَيْبِ وَالنَّقْصِ. يُقَالُ هُوَ حُرٌّ بَيِّنُ الْحَرُورِيَّةِ وَالْحُرِّيَّةِ. وَيُقَالُ طِينٌ حُرٌّ: لَا رَمْلَ فِيهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الدلالي للجذر يدور على الخلوص والبراءة من العيب والنقص"

    - lemma: "طُلَقَاء"
      evidence_status: "no_material_found"

    - lemma: "عُتَقَاء"
      evidence_status: "no_material_found"

    - lemma: "مُحَرَّرُون"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أَحْرَار"
      decision: confirmed
      decision_reason: "لمّة صحيحة لغوياً ومؤيَّدة بأدلة معجمية وافرة من المعجم الوسيط والقاموس المحيط والمعجم الكبير ومقاييس اللغة. «أحرار» هو الجمع الأشهر لـ«حُرّ» بمعنى خلاف العبد، وهو الاستعمال المعياري في الفصحى قديماً وحديثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَحْرَار"

    - lemma: "طُلَقَاء"
      source: stage1
      decision: removed
      decision_reason: "«الطُّلَقَاء» تدلّ على من أُطلق سراحه بعد أسر أو قيد، وليس على الحرية الأصلية. في السيرة النبوية يُطلق على أهل مكة الذين أُطلقوا يوم الفتح. الدلالة تقتضي حالة سابقة من القيد أو الأسر، فلا تطابق المفهوم العام «people who are free»."
      evidence_assessment:
        case: no_material

    - lemma: "عُتَقَاء"
      source: stage1
      decision: removed
      decision_reason: "«العُتَقَاء» جمع «عَتِيق» بمعنى المُعتَق من الرقّ، وهو مصطلح فقهي يدلّ تحديداً على من كان رقيقاً فأُعتق. دلالته أخصّ من المطلوب لأنها تفترض رقّاً سابقاً، بينما المفهوم المستهدف يشمل من وُلد حرّاً أصالةً."
      evidence_assessment:
        case: no_material

    - lemma: "مُحَرَّرُون"
      source: stage1
      decision: removed
      decision_reason: "«المُحَرَّرون» اسم مفعول يدلّ على من وقع عليه فعل التحرير، أي كان مقيَّداً فحُرِّر. دلالته تفترض حالة سابقة من القيد أو الاستعباد، فلا تصلح للدلالة العامة على الأشخاص الأحرار بالأصالة."
      evidence_assessment:
        case: no_material

