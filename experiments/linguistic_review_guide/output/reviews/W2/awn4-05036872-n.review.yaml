      - "التعريفُ الحاليُّ «خاصية كون الشخص قوياً بدنياً أو عقلياً» يستعملُ الصفةَ «قَوِيًّا» المشتقَّةَ من الاسمِ ذاتِهِ «قُوَّة»، وهو دورانٌ جزئيٌّ ينبغي إصلاحُه"
    observations: "المجموعةُ تمثِّلُ مفهوماً عربياً راسخاً ذا توثيقٍ معجميٍّ غزير. وردَتْ «القوة» في المعاجم الفلسفيَّةِ الكلاسيكيَّةِ بتعريفاتٍ مستفيضةٍ تُقسِّمُها إلى طبيعيَّةٍ وحيوانيَّةٍ وعقليَّة، مما يُثبتُ شمولَها للبُعدَين الجسديِّ والعقليِّ المطلوبَين في تعريف المجموعة. اللمَّةُ الوحيدةُ صحيحةٌ لكنَّها تحتاجُ إلى تشكيل. الإشكاليَّةُ الرئيسيَّةُ هي في التعريف لا في اللمَّة."
