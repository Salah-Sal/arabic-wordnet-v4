stage2_evidence:
  per_lemma:

    - lemma: "قوة"
      confirm:
        - text: "«القُوَّةُ: ضِدُّ الضَّعْفِ، والطاقةُ من طاقاتِ الحَبل، وتمكُّنُ الحيوانِ من الأعمالِ الشاقَّة، ومبعثُ النشاطِ والنموِّ والحركة، وتنقسمُ إلى طبيعيَّةٍ وحيويَّةٍ وعقليَّة»"
          source: "المعجم الوسيط (ocr، entry_id=24439)"
        - text: "«القُوَّةُ، بالضم: ضِدُّ الضَّعْفِ»"
          source: "القاموس المحيط للفيروزآبادي (hawramani، entry_id=800898)"
        - text: "«القوة: هي تمكُّنُ الحيوانِ من الأفعالِ الشاقَّة، فقوى النفسِ النباتيَّة تُسمَّى: قوىً طبيعيَّة، وقوى النفسِ الحيوانيَّة تُسمَّى: قوى نفسانيَّة، وقوى النفسِ الإنسانيَّة تُسمَّى: قوى عقليَّة»"
          source: "كتاب التعريفات للشريف الجرجاني (hawramani، entry_id=795415)"
        - text: "«القوة: هي تمكُّنُ الحيوانِ من الأفعالِ الشاقَّة، وقوى النفسِ الإنسانيَّةِ باعتبارِ إداركاتِها للكلِّيَّاتِ تُسمَّى: قوى عقليَّة، وباعتبارِ إداركاتِها للجزئيَّاتِ تُسمَّى: قوى وهميَّة»"
          source: "التعريفات الفقهية للبركتي (hawramani، entry_id=835524)"
        - text: "«القوة: مُبتَدَأُ كلِّ فعلٍ في البَدن»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani، entry_id=807363)"
      expands:
        - text: "«(1) قوَّة، مَقدِرة (2) سَنَد (3) شِدَّة (4) مَتانة (5) مقاومة»"
          source: "المورد الحديث (arabterm، entry_id=720470)"
          addition: "يُثبتُ أنَّ «strength» يُقابَلُ في العربيَّةِ بمجموعةٍ من الألفاظِ تتصدَّرُها «قوة» ثم «شدة» و«متانة»"
        - text: "«قُوَّة: من (ق و ي) مبعثُ النشاطِ والنموِّ والحركةِ والتمكُّنِ من الأعمالِ الشاقَّة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani، entry_id=940038)"
          addition: "يُوثِّقُ القوةَ كصِفةٍ ذاتيَّةٍ راسخةٍ لا مجرَّدَ فعلٍ آني"

    - lemma: "صَلابة"
      confirm:
        - text: "«الصَّلابة: [في الإنجليزية] Solidity, robustness — هي عند بعضِ الحكماء من الكيفيَّاتِ الملموسة، وهي كيفيَّةٌ بها ممانعةُ الغامز»"
          source: "كشَّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani، entry_id=820050)"
        - text: "«صَلابة: strength» — في سياقِ مقاومةِ المضغوطاتِ الدوائية"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (arabterm، entry_id=465559)"
      contradicts:
        - text: "«الصَّفَاقة، ومَشيٌ في صَلابةٍ من الأرض، وصِفةُ الجسمِ الذي يحتفظُ بشكلِهِ وحجمِه (في الهندسة: Solidity)»"
          source: "المعجم الكبير (ocr، entry_id=56388)"
          conflict: "الصَّلابةُ في المعاجم الحديثة تنصرفُ إلى الصُّلودة والصَّلادةِ المادِّيَّة (rigidity/hardness/stiffness)، وتُوظَّفُ في التعبير عن مقاومةِ المادَّةِ للتشوُّه، وليسَ عن صِفةِ القوَّةِ الشخصيَّة البَدَنيَّةِ أو العقليَّة"
        - text: "«صلابة: rigidity» (هندسة مدنية)؛ «صلابة: stiffness» (كهرباء)؛ «صلابة: hardness» (جيولوجيا، نفط، تقنيات تربوية)"
          source: "المعاجم الموحَّدة للمصطلحات التقنية — ALECSO (arabterm، entries متعددة)"
          conflict: "الاستعمال التقني الغالب لـ«صلابة» هو للصلودةِ الفيزيائيَّةِ لا للقوَّةِ الشخصيَّة، مما يُولِّدُ اشتراكاً لفظيًّا يُضعِفُ مناسبتَها لهذه المجموعة"

    - lemma: "مَتانة"
      confirm:
        - text: "«المتانة: قوةُ الخَلقِ وصلابةُ التكوينِ الجَسَدي» — مقابلٌ لـhypersthenia"
          source: "المعجم الطبي الموحد (arabterm، entry_id=741874)"
      contradicts:
        - text: "«المَتانة: أرضٌ متانةٌ: كثيرةُ التِّين»"
          source: "المعجم الوسيط (ocr، entry_id=3054)"
          conflict: "المعاجم الكلاسيكيَّةُ لا تُسجِّلُ «متانة» بمعنى القوَّةِ الشخصيَّة؛ «أرضٌ متانة» لفظٌ مختلفٌ يعودُ إلى جذر «تين» لا «متن»، مما يُشيرُ إلى خلطٍ معجميٍّ أو اشتراكٍ في الرسم"
      expands:
        - text: "«متانة: robustness» — قُدرةُ نظامٍ على الصمودِ لتأثيرِ عاملٍ داخليٍّ أو خارجي"
          source: "مسرد المناخ والبيئة — ALECSO (arabterm، entry_id=359706)"
          addition: "في الاصطلاح التقني الحديث تنتقلُ «المتانة» إلى دلالةِ الصمودِ ومقاومةِ الاضطراب، وهي أقربُ إلى «تحمُّل الأعباء» منها إلى «صِفةِ القوَّة» المجرَّدة"

    - lemma: "جَلادة"
      expands:
        - text: "«جَلادة: القُدرةُ على تحمُّلِ الظروفِ المناخيَّةِ القاسيَّة، وخاصَّةً الصَّقيعِ خلالَ موسمِ النمو» — مقابلٌ لـhardiness"
          source: "مسرد المناخ والبيئة — ALECSO (arabterm، entry_id=357367)"
          addition: "تدلُّ «جلادة» على بُعدِ التحمُّلِ والقُدرةِ على الصمودِ في وجهِ الشدائد، وهو مفهومٌ مجاورٌ لـ«strength» لكنَّه أضيقُ منه (endurance/hardiness لا strength)"
        - text: "«جَلادة: صِفةُ الحيوانِ الذي يصبرُ على التعبِ والتقلُّباتِ الجويَّة» — مقابلٌ لـhardiness"
          source: "المعجم الموحد لمصطلحات الطب البيطري (arabterm، entry_id=469509)"
          addition: "التحمُّلُ الجسديُّ موثَّقٌ لـ«جَلادة» في سياقِ الحيوانِ، ويمكنُ المقايسةُ على الإنسان لكنَّه يبقى في حقلِ «الصُّمودِ» لا «القوَّةِ الذاتيَّة»"

    - lemma: "شَكِيمة"
      confirm:
        - text: "«الشَّكيمة: الحديدةُ المعترضةُ في فمِ الفرسِ من اللجام؛ قوَّةُ القلب»"
          source: "المعجم الوسيط (ocr، entry_id=15303)"
        - text: "«شكيمة: قُوَّةُ القلبِ العارضةُ والجدُّ؛ الأَنَفة؛ إنَّه لشديدُ الشَّكيمة إذا كان أَنِفًا أَبِيًّا لا يَنقاد»"
          source: "المعجم الكبير (ocr، entry_id=52785)"
        - text: "«الشكيمة: الحديدةُ المعترضةُ في فمِ الفرسِ من اللجام؛ وقوَّةُ القلب؛ والانتصارُ من الظُّلم؛ يُقالُ: فلانٌ شديدُ الشكيمةِ أو ذو شكيمة: أنِفٌ أبِيٌّ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani، entry_id=876228)"
      contradicts:
        - text: "«حديدةُ اللِّجامِ المعترضةُ في فمِ الفرس» — المعنى الأصلي حسيٌّ لأداةٍ ماديَّة"
          source: "المعجم الكبير (ocr، entry_id=52784)"
          conflict: "المعنى المجازيُّ «قوَّةُ القلب» مخصوصٌ بالقوَّةِ العقليَّةِ والإرادة وشِدَّةِ الطَّبع، ولا يشملُ القوَّةَ الجسديَّة، مما يجعلُه أضيقَ من تعريفِ المجموعة التي تشملُ البُعدَين البَدَنيَّ والعقليَّ"


