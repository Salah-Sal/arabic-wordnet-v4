# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "خاصية كون الشخص قوياً بدنياً أو عقلياً"
    assessment:
      decision: revise
      reason: "التعريفُ الحاليُّ يتضمَّنُ دوراناً جزئياً: يعرِّفُ الاسمَ «قُوَّة» بالصفةِ «قَوِيًّا» المشتقَّةِ من الجذرِ ذاتِه. وصياغتُهُ «خاصيةُ كونِ الشخص» ركيكةٌ لا تُلائمُ أسلوبَ المعجمِ الوسيط. يحتاجُ التعريفُ إلى إعادةِ صياغةٍ بأسلوبٍ اصطلاحيٍّ يُحدِّدُ الجنسَ القريبَ والفصلَ النوعيَّ."
