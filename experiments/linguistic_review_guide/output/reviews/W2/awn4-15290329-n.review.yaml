stage1_review:
  assessment:
    concerns:
      - "لمّة «استهلال» معناها الأصلي رفع الصوت وصراخ المولود، واستعمالها بمعنى البداية الزمنية توسُّع حديث"
      - "لمّة «انطلاق» تدلّ على الفعل والحركة أكثر من دلالتها على نقطة زمنية بعينها"
      - "اللمّات الثلاث تفتقر إلى التشكيل الكامل"
    observations: "المجموعة تمثّل مفهوم النقطة الزمنية المحددة لبدء شيء ما، وهي فرع من «نقطة زمنية». اللمّات الموجودة تغطّي جانب الحدث (الاستهلال والانطلاق) وجانب الأوّلية (البداية)، لكن ينقصها ألفاظ تدلّ صراحة على الزمان كـ«مطلع» و«مستهلّ» اللتين تُستعملان ظرفياً للزمن."
  blind_candidates:
    - lemma: "مُسْتَهَلّ"
      generation_method: ishtiqaq
      justification: "مصدر ميمي أو اسم زمان من استهلّ على وزن مُسْتَفْعَل، يُستعمل في العربية للدلالة على بداية الوحدة الزمنية: مستهلّ الشهر، مستهلّ العام. أقرب اللمّات إلى الدلالة الزمنية المطلوبة."
    - lemma: "مَطْلَع"
      generation_method: majaz
      justification: "أصله مكان الطلوع أو زمانه، ثم توسّع مجازياً إلى أوّل كل شيء: مطلع القصيدة، مطلع الفجر. مسجّل في المعجم الكبير بمعنى «من كلّ شيءٍ: أوّلُه»."
    - lemma: "شُرُوع"
      generation_method: ishtiqaq
      justification: "مصدر شَرَعَ يَشْرَعُ على وزن فُعُول، يدلّ على الدخول في الأمر وابتدائه. مستعمل في المعاجم الحديثة بمعنى البدء."
    - lemma: "مُفْتَتَح"
      generation_method: ishtiqaq
      justification: "اسم مكان أو زمان من افتتح على وزن مُفْتَعَل، يدلّ على ما يُفتتح به الأمر. مستعمل في سياقات كـ«مفتتح الكلام» و«مفتتح العام»."

stage2_evidence:
