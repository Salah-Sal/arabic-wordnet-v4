          source: "المعجم الوسيط"
        - text: "«(1) ابتداء؛ استهلال (2) حفلة التخرُّج.»"
          source: "المورد الحديث (2008) — مدخل commencement"
      expands:
        - text: "«الاستهلال: أن يكون من الولد ما يدل على حياته من بكاء أو تحريك عضو، أو عين.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "المعنى الأصلي الفقهي مختلف عن دلالة البداية الزمنية"
        - text: "«الاستهلال: رفع الصَّوْت وَأَن يكون من الْوَلَد مَا يدل على حَيَاته من بكاء أَو تَحْرِيك عين أَو عُضْو آخر.»"
          source: "دستور العلماء للأحمدنكري"
