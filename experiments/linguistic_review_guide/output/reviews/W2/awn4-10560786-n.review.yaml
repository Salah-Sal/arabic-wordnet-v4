# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10560786-n (ruler / حاكم)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (حاكم، عاهل) بلا تشكيل"
      - "التعريف العربي مقتضب جداً ولا يميّز المفهوم عن المفاهيم القريبة كالقاضي أو الآمر العسكري"
      - "عاهل أخصّ من ruler إذ يدلّ على الملك الأعظم لا على مطلق من يحكم"
    observations: "المفهوم عام يشمل كلّ من يمارس السلطة والحكم أو يأمر الناس، وهو مفهوم أصيل في الثقافة العربية وله ألفاظ غزيرة. التعريف الإنجليزي (a person who rules or commands) يدلّ على مطلق الحاكم أو الآمر، وهو أعمّ من الملك أو السلطان. الجذر حكم هو الأنسب لهذا المعنى العام، ويليه أمر ثم ولي."
  blind_candidates:
    - lemma: "سُلْطَان"
      generation_method: ishtiqaq
      justification: "من جذر سلط الدالّ على القوة والقهر، وزن فُعْلان، يدلّ على من له القدرة والسلطة على المُلك مطلقاً، وهو لفظ عربي أصيل شائع في الفصحى بمعنى الملك أو الوالي"
    - lemma: "أَمِير"
      generation_method: ishtiqaq
      justification: "من جذر أمر (الأمر ضدّ النهي)، وزن فَعِيل بمعنى فاعِل، يدلّ على صاحب الإمرة والسلطة، قال ابن فارس: صاحبها أمير ومؤمَّر"
    - lemma: "وَالٍ"
      generation_method: ishtiqaq
      justification: "من جذر ولي، وزن فاعِل، يدلّ على من يتولّى تدبير أمور الناس وحكمهم، مستعمل في الفصحى القديمة والمعاصرة"
    - lemma: "مَلِك"
      generation_method: ishtiqaq
      justification: "من جذر ملك الدالّ على القوة والصحة في التصرّف، وزن فَعِل، يدلّ على من يملك السياسة والتصرّف بالأمر والنهي في الجمهور"

stage2_evidence:
  per_lemma:
    - lemma: "حَاكِم"
      confirm:
        - text: "«من نُصب للحكم بين الناس»"
          source: "المعجم الوسيط"
        - text: "«مُنَفِّذُ الحُكْمِ بين النَّاسِ»"
          source: "المعجم الكبير"
        - text: "«(الحاكم) القاضي والأمير»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«منفِّذ الحكم، والقاضي الذي تُعُيِّن ونَصب من جهة السلطان لأجل فصل وحسم الدعاوى والمخاصمات توقيفاً لأحكامها المشروعة»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "يوضّح أنّ الحاكم في الاصطلاح الفقهي قد يخصّ القاضي"
        - text: "«القاضِي، وسُمِّىَ حاكِمًا لأَنَّه يَمْنَعُ الظَّالِمَ من الظُّلْمِ»"
          source: "المعجم الكبير"
          addition: "يبيّن الأصل الاشتقاقي: المنع من الظلم"

    - lemma: "عَاهِل"
      confirm:
        - text: "«الملك الأعظم يحكم شعوباً مختلفة كالخليفة والإمبراطور»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الْعَاهِلُ: الْمَلِكُ لَيْسَ الَّذِي فَوْقَهُ أَحَدٌ إِلَّا اللَّهُ تَعَالَى. يُقَالُ لِلْخَلِيفَةِ: عَاهِلٌ»"
          source: "مقاييس اللغة لابن فارس (عن أبي عبيدة)"
          addition: "يؤكّد أنّ العاهل أخصّ: هو الملك الذي ليس فوقه أحد"

    - lemma: "سُلْطَان"
      confirm:
        - text: "«المَلِكُ أو الوالى. القوةُ والقهر. الحجة والبرهان»"
          source: "المعجم الوسيط"
        - text: "«هو المَلِكُ ومن له القُدرة والسلطة على المُلك مطلقاً»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«السِّينُ وَاللَّامُ وَالطَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْقُوَّةُ وَالْقَهْرُ... وَلِذَلِكَ سُمِّيَ السُّلْطَانُ سُلْطَانًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يبيّن أنّ الأصل القوة والقهر"

    - lemma: "أَمِير"
      confirm:
        - text: "«من يَتولَّى الإمارة. من وُلد في بيت الإمارة. المشاور»"
          source: "المعجم الوسيط"
        - text: "«صاحب الأَمْرِ. مَن يتولَّى الإمارة. مَن وُلِدَ في بيت الإمارة أو المُلْك»"
          source: "المعجم الكبير"
      expands:
        - text: "«وَمِنْ هَذَا الْبَابِ الْإِمْرَةُ وَالْإِمَارَةُ، وَصَاحِبُهَا أَمِيرٌ وَمُؤَمَّرٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يربط الأمير بجذر الأمر مباشرة"

    - lemma: "وَالٍ"
      confirm:
        - text: "«السُّلْطَان: المَلِكُ أو الوالى»"
          source: "المعجم الوسيط (مادة سلطان)"
      expands:
        - text: "«والي(ال...): governor»"
          source: "مسرد الجغرافيا والتاريخ (أليكسو)"
          addition: "يؤكّد استعمال والي بمعنى الحاكم في المصطلحات الحديثة"

    - lemma: "مَلِك"
      confirm:
        - text: "«الملك بالضم: التصرف بالأمر والنهي في الجمهور، وذلك يختص بسياسة الناطقين»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الملك بفتح فكسر: اسم لكل من يملك السياسة... الملك الأعظم يحكم شعوباً مختلفة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "مَلِك أخصّ من حاكم إذ يدلّ عادة على صاحب المُلك الأعلى، ويتداخل مع عاهل"

stage3_analysis:
  per_lemma:
    - lemma: "حَاكِم"
      decision: confirmed
      decision_reason: "لفظ عربي فصيح أصيل من جذر حكم، مطابق تماماً للتعريف (شخص يحكم أو يأمر). ورد في المعجم الوسيط والكبير بمعنى من نُصب للحكم. هو الأعمّ بين ألفاظ المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الأعمّ والأشمل، يدلّ على كلّ من يحكم بين الناس سواء أكان ملكاً أم قاضياً أم والياً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَاكِم"

    - lemma: "عَاهِل"
      decision: confirmed
      decision_reason: "لفظ عربي فصيح ورد في المعجم الوسيط بمعنى الملك الأعظم. وإن كان أخصّ من ruler، فهو يقع ضمن نطاق المفهوم (شخص يحكم) وهو مرادف جزئي مقبول في الشبكة الدلالية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أخصّ من حاكم، يدلّ على الملك الأعظم الذي يحكم شعوباً مختلفة كالخليفة والإمبراطور، لا يقال لصغار الولاة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَاهِل"

    - lemma: "سُلْطَان"
      source: stage1
      decision: removed
      decision_reason: "سلطان في أصله مصدر بمعنى القوة والقهر والحجة، ثم أُطلق على الملك أو الوالي. هو مرادف قريب لكنه يتداخل كثيراً مع عاهل ومَلِك في الدلالة على السلطة العليا، ولا يضيف تمييزاً دلالياً واضحاً عمّا في المجموعة. كما أنّ له معاني أخرى كثيرة (الحجة، القوة) مما يُشوّش الدلالة."

    - lemma: "أَمِير"
      source: stage1
      decision: removed
      decision_reason: "أمير يدلّ على صاحب الإمارة وهو أخصّ من ruler العام، إذ يُستعمل عادة لرتبة محددة دون الملك. والمجموعة تحتوي بالفعل على عاهل (الأعلى) وحاكم (الأعمّ)، فإضافة أمير تُدخل رتبة وسطى قد تُشوّش التراتبية."

    - lemma: "وَالٍ"
      source: stage1
      decision: removed
      decision_reason: "والٍ يدلّ على من يتولّى أمر إقليم أو ولاية بتكليف من سلطة أعلى، فهو تابع لا مستقلّ. وهذا يميّزه عن المفهوم العام للـ ruler الذي يشمل الحاكم المستقلّ."

    - lemma: "مَلِك"
      source: stage1
      decision: removed
      decision_reason: "مَلِك يدلّ على صاحب المُلك الأعلى ويتداخل دلالياً مع عاهل الموجود في المجموعة. لا حاجة لإضافته لأنّ عاهل يؤدّي الوظيفة نفسها مع تمييز دلالي أوضح (الملك الأعظم)."

