stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمة واحدة فقط على الرغم من غنى اللغة العربية بمترادفات لهذا المفهوم."
    observations: "التعريف الحالي يغطي الجانبين: إثارة الاهتمام (attraction) وكون الشيء جذاباً (attractiveness). اللمة الموجودة 'جاذبية' دقيقة جداً وشائعة."
  blind_candidates:
    - lemma: "جَاذِبِيَّةٌ"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي الأكثر شيوعاً للتعبير عن صفة الجذب."
    - lemma: "فِتْنَةٌ"
      generation_method: majaz
      justification: "استخدام لفظ الفتنة للتعبير عن شدة الإعجاب والاستمالة."
    - lemma: "سِحْرٌ"
      generation_method: majaz
      justification: "استعارة السحر للتعبير عن الجاذبية والجمال الذي يخلب اللب."
    - lemma: "مَفْتَنٌ"
      generation_method: ishtiqaq
      justification: "اسم مكان/آلة يراد به الشيء الذي يفتن ويجذب، والجمع 'مفاتن' شائع جداً."

stage2_evidence:
  per_lemma:
    - lemma: "جَاذِبِيَّةٌ"
      confirm:
        - text: "«الحالة التي يجذب بها صاحبها غيره. يقال: فلان له جاذبية: يستميل غيره إليه.»"
          source: "المعجم الوسيط"
        - text: "«الحالة التي يجذب بها صاحبها غيره، وقوة التجاذب بين شيئين.»"
          source: "موسوعة السلطان قابوس"
    - lemma: "فِتْنَةٌ"
      confirm:
        - text: "«تولُّه، إعجاب شديد، قُدْرة على الإغراء والجذب.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«attraction: (2) فِتنة؛ جاذبيّة»"
          source: "المورد الحديث"
    - lemma: "سِحْرٌ"
      confirm:
        - text: "«attractiveness: جاذبية؛ فتنة؛ سِحر.»"
          source: "المورد الحديث"
      expands:
        - text: "«السِّحْر: إخراج الباطل في صورة الحق، ويقال هو الخديعة.»"
          source: "مقاييس اللغة"
    - lemma: "مَفْتَنٌ"
      confirm:
        - text: "«(4) المَفْتَن: كلُّ ما يَفْتِن أو يخلب اللّبّ the attractions of Paris.»"
          source: "المورد الحديث"
        - text: "«مَفَاتِنُ: كلُّ ما يستهوي ويجذب 'مفاتن الطبيعة/ المرأة'.»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "جَاذِبِيَّةٌ"
      decision: confirmed
      decision_reason: "مصطلح أساسي ودقيق يعبر عن جوهر المجموعة الترادفية في السياقات الحديثة والعلمية والاجتماعية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَاذِبِيَّةٌ"
    - lemma: "فِتْنَةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم للتعبير عن الجاذبية الشديدة التي تثير الاهتمام وتستمل القلوب، وهي مدعومة في المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فِتْنَةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "سِحْرٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير مجازي شائع جداً للتعبير عن الجاذبية الجمالية والمعنوية التي تأسر الناظر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سِحْرٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مَفْتَنٌ"
      source: stage1
      decision: confirmed
      decision_reason: "اسم يعبر عن الشيء الذي يثير الفتنة أو الإعجاب، وهو مناسب تماماً للجزء الثاني من التعريف 'شيء يجذب'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَفْتَنٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "صفة إثارة الاهتمام؛ كون الشيء جذاباً أو شيئاً يجذب"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط ولكنه يحتاج إلى صياغة معجمية أكثر رصانة تعبر عن القوة الكامنة في الجذب."
    authored:
      - type: terminological
        text: "خَاصِيَّةٌ أَوْ قُوَّةٌ تَبْعَثُ عَلَى الِاهْتِمَامِ وَالِاسْتِمَالَةِ؛ وَمَا يَفْتِنُ النَّفْسَ وَيَخْلِبُ اللُّبَّ بِجَمَالِهِ أَوْ حُسْنِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "خَاصِيَّةٌ أَوْ قُوَّةٌ تَبْعَثُ عَلَى الِاهْتِمَامِ وَالِاسْتِمَالَةِ؛ وَمَا يَفْتِنُ النَّفْسَ وَيَخْلِبُ اللُّبَّ بِجَمَالِهِ أَوْ حُسْنِهِ."}

  examples:
    per_lemma:
      - lemma: "جَاذِبِيَّةٌ"
        examples:
          - text: "تَتَمَتَّعُ هَذِهِ المَدِينَةُ بِجَاذِبِيَّةٍ سِيَاحِيَّةٍ تَجْعَلُ الزُّوَّارَ يَتَوَافَدُونَ إِلَيْهَا مِنْ كُلِّ مَكَانٍ."
            type: usage
      - lemma: "فِتْنَةٌ"
        examples:
          - text: "كَانَ فِي حَدِيثِهَا فِتْنَةٌ مَحْبُوبَةٌ تَجْعَلُ كُلَّ مَنْ يَسْمَعُهَا يُنْصِتُ بِاهْتِمَامٍ."
            type: usage
      - lemma: "سِحْرٌ"
        examples:
          - text: "لِلطَّبِيعَةِ الخَلَّابَةِ فِي فَصْلِ الرَّبِيعِ سِحْرٌ لَا يُقَاوَمُ."
            type: usage
      - lemma: "مَفْتَنٌ"
        examples:
          - text: "تُعَدُّ هَذِهِ اللَّوْحَةُ الفَنِّيَّةُ مَفْتَنًا لِلنَّاظِرِينَ لِدِقَّةِ تَفَاصِيلِهَا."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَتَمَتَّعُ هَذِهِ المَدِينَةُ بِجَاذِبِيَّةٍ سِيَاحِيَّةٍ تَجْعَلُ الزُّوَّارَ يَتَوَافَدُونَ إِلَيْهَا مِنْ كُلِّ مَكَانٍ."}

stage5_enrichment:
  per_entry:
    - lemma: "جَاذِبِيَّةٌ"
      entry_id: "{auto}"
      root: "جذب"
      maqayis_quote: "«الجِيمُ وَالذَّالُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى بَتْرِ الشَّيْءِ... فَكَأَنَّهَا جَذَبَتْهُ إِلَى نَفْسِهَا.»"
    - lemma: "فِتْنَةٌ"
      entry_id: "{auto}"
      root: "فتن"
      maqayis_quote: "«الْفَاءُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاءٍ وَاخْتِبَارٍ... فَتَنْتُ الذَّهَبَ بِالنَّارِ، إِذَا امْتَحَنْتُهُ.»"
    - lemma: "سِحْرٌ"
      entry_id: "{auto}"
      root: "سحر"
      maqayis_quote: "«السِّينُ وَالْحَاءُ وَالرَّاءُ أُصُولٌ ثَلَاثَةٌ مُتَبَايِنَةٌ... أَحَدُهَا خَدْعٌ وَشِبْهُهُ.»"
    - lemma: "مَفْتَنٌ"
      entry_id: "{auto}"
      root: "فتن"
      maqayis_quote: "«الْفَاءُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاءٍ وَاخْتِبَارٍ.»"
  per_sense:
    - lemma: "جَاذِبِيَّةٌ"
      sense_id: "{auto}"
      nuance: "تعبر عن الصفة العامة أو القوة الكامنة التي تجعل الشيء أو الشخص مركزاً للانتباه."
      mwe: false
    - lemma: "فِتْنَةٌ"
      sense_id: "{auto}"
      nuance: "توحي بجاذبية عاطفية أو جمالية شديدة التأثير حد التولّه."
      mwe: false
    - lemma: "سِحْرٌ"
      sense_id: "{auto}"
      nuance: "تستخدم مجازياً لوصف الجاذبية الغامضة أو الجمال الذي يخلب الألباب بغير تفسير مادي مباشر."
