        value: '{"root":"جذب","maqayis":"«الجِيمُ وَالذَّالُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى بَتْرِ الشَّيْءِ... فَكَأَنَّهَا جَذَبَتْهُ إِلَى نَفْسِهَا.»"}'
