      justification: "يستخدم للدلالة على عاقبة الشيء وآخر جزء فيه، وهو شائع في اللغة المعاصرة."
    - lemma: "تَمَام"
      generation_method: ishtiqaq
      justification: "بلوغ الشيء كماله وانقضاؤه، وإن كان يميل أحياناً إلى معنى الكمال."

