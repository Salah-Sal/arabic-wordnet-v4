# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15251247-n
# full term — تمام الحمل
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (تمام الحمل) وهي تركيب إضافي؛ لا توجد لمّة مفردة بديلة"
      - "التعريف العربي مقبول لكنه ترجمة شبه حرفية من الإنجليزية"
    observations: "المفهوم طبي-فقهي عربي أصيل: «ولدت لتمام» تعبير عربي كلاسيكي مسجّل في المعاجم الكبرى. المرادف الإنجليزي (full term / term) يُستخدم طبياً بمعنى اكتمال مدة الحمل (نحو ٤٠ أسبوعاً). المجموعة تحتاج إلى إثراء بلمّات بديلة ذات سند معجمي."
  blind_candidates:
    - lemma: "تَمَامُ الحَمْلِ"
      generation_method: tarkib
      justification: "تركيب إضافي مباشر يطابق المفهوم الطبي: تمام (اكتمال) + الحمل. وارد في الشعر العربي القديم ومعاجم اللغة."
    - lemma: "اكْتِمَالُ الحَمْلِ"
      generation_method: tarkib
      justification: "تركيب إضافي من المصدر اكتمال (افتعال من كمل) والحمل. يُستخدم في الخطاب الطبي المعاصر بمعنى بلوغ الجنين تمام نموّه."
    - lemma: "أَوَانُ الوَضْعِ"
      generation_method: tarkib
      justification: "تركيب إضافي من أوان (الحين والوقت المناسب) والوضع (الولادة). يركّز على البُعد الزمني للمفهوم."
    - lemma: "مِيعَادُ الوِلَادَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي من ميعاد (وقت الوعد) والولادة. يُستخدم في العربية المعاصرة بمعنى الموعد المتوقع للوضع."

# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَمَامُ الحَمْلِ"
      confirm:
        - text: "«وَلَدت المَرأةُ لِتَمام : إذا وَلَدت مَولُودَها وقد تَمَّ خَلْقُه. وقال الأصْمَعِيُّ : ولدَتْه للتَّمام - بالألف واللام - ولا يَجيءُ نَكرَةً إلَّا فى الشِّعر.»"
          source: "المعجم الكبير"
        - text: "«وَيُقَالُ امْرَأَةٌ حُبْلَى مُتِمٌّ، وَوَلَدَتْ لِتَمَامٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«تَمَخَّضَتِ الْمَنُونُ لَهُ بِيَوْمٍ ... أَنَى وَلِكُلِ حَامِلَةٍ تِمَامُ»"
          source: "مقاييس اللغة لابن فارس (شاهد شعري)"
        - text: "«مكتوب لها الثكل دون تمام الحمل»"
          source: "أساس البلاغة للزمخشري (شرح بيت ذي الرمة)"
      expands:
        - text: "«يقال : قَمَرٌ تَمامٌ , وقَمَرٌ تِمامٌ : إذا تَمَّت استدارتُه لَيلة البَدْر»"
          source: "المعجم الكبير"
          addition: "التمام يُستخدم للدلالة على بلوغ الشيء كماله في سياقات متعددة غير الحمل"
    - lemma: "اكْتِمَالُ الحَمْلِ"
      evidence_status: "no_material_found"
    - lemma: "أَوَانُ الوَضْعِ"
      expands:
        - text: "«الأوان: الحين. وقال أبو البقاء: أوان الشيء وقته الذي يوجد فيه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الأوان يعني الوقت المناسب، لكن لم يُوثّق التركيب (أوان الوضع) كوحدة معجمية ثابتة"
    - lemma: "مِيعَادُ الوِلَادَةِ"
      expands:
        - text: "«(الميعاد) المواعدة وَوقت الْوَعْد وموضعه (ج) مواعيد»"
          source: "المعجم الوسيط"
          addition: "الميعاد يعني وقت الوعد، لكن التركيب (ميعاد الولادة) يدلّ على الموعد المحدّد لا على حالة اكتمال الحمل ذاتها"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "تَمَامُ الحَمْلِ"
      decision: confirmed
      decision_reason: "تركيب إضافي مسجّل في المعاجم الكلاسيكية (المعجم الكبير، مقاييس اللغة، أساس البلاغة). التعبير «ولدت لتمام» أصيل وراسخ في الاستعمال العربي الفصيح منذ الجاهلية. يطابق المفهوم الإنجليزي (full term) تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَامُ الحَمْلِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "اكْتِمَالُ الحَمْلِ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية كلاسيكية لهذا التركيب. مصدر الافتعال (اكتمال) استعمال معاصر صحيح لكنه لا يحمل الثبات المعجمي الذي يحمله (تمام). يبقى تمام الحمل أولى لكونه الأسبق والأكثر توثيقاً."

    - lemma: "أَوَانُ الوَضْعِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حر لا تركيب مصطلحي ثابت. لم يُسجَّل في المعاجم كوحدة معجمية. كما أنه يركّز على الزمن لا على حالة اكتمال النمو، فلا يطابق المفهوم تماماً."

    - lemma: "مِيعَادُ الوِلَادَةِ"
      source: stage1
      decision: removed
      decision_reason: "التركيب يدلّ على الموعد المحدّد المتوقع للولادة (due date) لا على مفهوم اكتمال الحمل ذاته (full term). فارق دلالي جوهري يمنع إدراجه في هذه المجموعة."

