# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-04736257-n
# المفهوم: الجودة الأرقى من نوعها (ultimate quality)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان (قمة، منتهى) مثبّتتان بدون تشكيل كامل"
      - "التعريف يستخدم صيغة «أو» بين وصفين متداخلَيْن (الأرقى / الأكثر تفوقاً) مما يوحي بالتردد لا بالتمييز الدلالي"
    observations: >
      المجموعة تُعبّر عن مفهوم «أعلى مستوى من الجودة في نوعه»، وهو مفهوم راسخ في العربية
      له ألفاظ تراثية أصيلة مسكوكة كالقمة والذروة. تنتمي المجموعة إلى الأم
      «جَوْدَة / نَوْعِيَّة» مما يستدعي التحقق من عدم التداخل مع مجموعات التفوق
      والبراعة. اللمة «منتهى» أقرب إلى معنى الغاية والنهاية القصوى، ويُحمل على
      الجودة الأرقى بالمجاز. الترادف بين اللمتين الموجودتين ليس تاماً: قمة
      تُشير إلى المرتبة العليا، ومُنتهى يُشير إلى الحدّ الأقصى الذي لا يُتجاوز.
  blind_candidates:
    - lemma: "ذُرْوَة"
      generation_method: majaz
      justification: >
        من الجذر ذرو، تعني أعلى السنام وأعلى كل شيء. مجاز راسخ في العربية
        للدلالة على بلوغ أعلى مرتبة في أي مجال بما فيه الجودة، وله شواهد حديثية
        وشعرية موثقة.
    - lemma: "الأُوج"
      generation_method: taarib
      justification: >
        معرَّب فارسي قديم (أوك = العلو)، دخل العربية واستُعمل في الدلالة على
        القمة والذروة، وسُجِّل في المعجم الوسيط وغيره.
    - lemma: "الغَايَة"
      generation_method: majaz
      justification: >
        من الجذر غيي: منتهى الشيء وأقصاه. استُعمل مجازاً للدلالة على القدر
        الأعلى والحدّ الأبعد في الصفات.
    - lemma: "الإِتْقَان"
      generation_method: ishtiqaq
      justification: >
        من الجذر تقن على وزن إفعال، يفيد بلوغ أعلى درجات الإحكام والدقة في
        الصنعة والمعرفة، مما قد يُعبّر عن الجودة القصوى.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "قمة"
      confirm:
        - text: "«القِمَّةُ: من كل شىء: أعلاه»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(القمة) من كُلِّ شَيء أَعْلَاهُ والقامة والبدن»"
          source: "المعجم الوسيط للمجموعة"
        - text: "«القِمَّةُ، بالكسر: أعْلَى الرأسِ وكلِّ شيءٍ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«أعلى نقطة في جسم كقمة الجبل أو المخروط أو الهرم — apex; top; peak»"
          source: "المعجم الموحد لمصطلحات الكيمياء (أرابتيرم)"
        - text: "«قمة الجبل: أَعْلَاهُ وذروته وسماوته وفرعه وقلعته وذؤابته وشرفه وشعفته»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"

    - lemma: "منتهى"
      confirm:
        - text: "«(المُنْتَهَى) الغاية والنهاية، يُقال: هو بعيد المُنْتَهى»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(الْمُنْتَهى) الغاية والنهاية»"
          source: "المعجم الوسيط للمجموعة"
        - text: "«مُنْتَهَى: الغاية والنهاية»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«end-point»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (أرابتيرم)"

    - lemma: "ذُرْوَة"
      confirm:
        - text: "«الذِّرْوَة: أعلى كل شيء»"
          source: "المعجم الكبير"
        - text: "«ذروةُ كلِّ شيءٍ: أعلاه»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الذرْوَة: ذرْوَة كل شَيء أَعْلَاهُ. يُقال: هُوَ فِي ذرْوَة النّسَب وعلا ذرْوَة الشّرف»"
          source: "المعجم الوسيط للمجموعة"
        - text: "«أقصى الشدة، مثل ما يحدث في المرض — climax»"
          source: "معجم المصطلحات الطبية ج.١ (أرابتيرم)"
      expands:
        - text: "«هو في ذروة النسب، وعلا ذُروة الشرف»"
          source: "المعجم الوسيط (شاهد استعمالي)"
          addition: "يُثبت استخدام ذروة مجازاً في التفوق النوعي والمرتبة الرفيعة المجردة"
        - text: "«أُتِيَ بِقَصْعَةٍ فقال: كُلُوا من جَوانِبها، ودَعُوا ذِرْوَتَها، يُبارَكْ فيها»"
          source: "المعجم الكبير (شاهد حديثي)"
          addition: "يُثبت استخدام ذروة للدلالة على الجزء الأعلى والأفضل من الشيء"

    - lemma: "الأُوج"
      confirm:
        - text: "«1- قمة الشيء. 2- أقصى الشدة في سير الأمراض الحادة — acme»"
          source: "معجم المصطلحات الطبية ج.١ (أرابتيرم)"
        - text: "«acme»"
          source: "المعجم الطبي الموحد (أرابتيرم)"
        - text: "«(الأوج) العلوّ وأبعد نقطة في مدار القمر على الأرض»"
          source: "المعجم الوسيط للمجموعة"
      contradicts:
        - text: "«معرب أوك في الفارسية: القمة (في علم الفلك Apogee): أبعد نقطة في مدار القمر عن الأرض»"
          source: "المعجم الكبير"
          conflict: "الأوج مصطلح أجنبي الأصل، دلالته التقنية الغالبة فلكية (apogee) لا جودة"
        - text: "«الأَوْجُ: ضِدُّ الهُبوطِ»"
          source: "القاموس المحيط"
          conflict: "الدلالة الأصلية ترتبط بالحركة الصاعدة والعلو الفيزيائي لا بالجودة النوعية"

    - lemma: "الغَايَة"
      confirm:
        - text: "«الغاية: الغرض والمنتهى»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«الغَايَة: ما يكون مؤثراً في مؤثرية الشيء»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الغاية تدل على الهدف والمقصد، لا على الصفة الأرقى في شيء ما"
        - text: "«destination»"
          source: "المعجم الطبي الموحد (أرابتيرم)"
          conflict: "الترجمة الإنجليزية للغاية في المعاجم الحديثة هي destination/goal لا highest quality"

    - lemma: "الإِتْقَان"
      contradicts:
        - text: "«الإتقان: معرفة الأدلة بعللها، وضبط القواعد الكلية بجزئياتها؛ وقيل: الإتقان معرفة الشيء بيقين»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الإتقان يدل على الدقة المعرفية والإحكام في الصنع، لا على مرتبة الجودة القصوى في نوع شيء"
        - text: "«(فى الاصطلاح): مَعرفَة الأدلَّةِ، وضَبْط القَواعد الكُلِّيَّة بجُزْئِيَّاتِها»"
          source: "المعجم الكبير"
          conflict: "دلالة الإتقان على ضبط المعرفة وإحكام الصنعة لا تُساوي معنى الجودة القصوى في النوع"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "قمة"
      decision: confirmed
      decision_reason: >
        لفظ عربي أصيل من جذر قمم يدل على أعلى الشيء في ذاته. الأدلة المعجمية
        متعددة ومتوافقة. لا لهجية، لا اقتراض، وزنه (فِعْلَة) مناسب لاسم الصفة/الحالة.
        يحتاج تحديث التشكيل إلى الصورة الكاملة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز قِمَّة على بلوغ الذروة من حيث التجمّع والاكتمال (الجذر = الجمع والقوام)؛
        وتستعمل في سياق الإنجازات الكلية وما يجمع الأفضل في ذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِمَّة"

    - lemma: "منتهى"
      decision: confirmed
      decision_reason: >
        لفظ عربي أصيل من جذر نهي يدل على الغاية والبلوغ. المعاجم تُجمع على معنى
        «الغاية والنهاية»، وهو يُعبّر عن أن الجودة قد بلغت حدها الأقصى الذي لا
        يُتجاوز. يستعمل في التعابير الإضافية بصورة طبيعية (مُنتهى الإبداع).
        يحتاج تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز مُنْتَهَى على بلوغ الحدّ الأقصى بمعنى النهاية التي لا تتجاوزها
        الجودة، ويُستعمل في الإضافة إلى المصدر أكثر من الاستعمال المستقل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْتَهَى"

    - lemma: "ذُرْوَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ عربي أصيل من جذر ذرو (أعلى السنام وكل شيء). مدعوم بأدلة معجمية
        كلاسيكية وشواهد حديثية وشعرية. لا اقتراض ولا لهجية. اختبار السكّ: لا
        يمكن إبدال «ذروة» بوصف حر. اختبار التثبيت: مسكوك في المعجم.
        يُعادل تماماً مفهوم «أعلى مستوى من الجودة».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُصوِّر الذُّرْوَةُ القمةَ بصورة حسية ملموسة (أعلى السنام) ممتدة إلى المجرد؛
        وتُستعمل تحديداً في التعبير عن الامتياز النوعي الواضح والتمييز الصريح عن سائر
        الدرجات.
      actions:
        - command: create_entry
          params: {lemma: "ذُرْوَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04736257-n"}

    - lemma: "الأُوج"
      source: stage1
      decision: removed
      decision_reason: >
        الأوج معرَّب فارسي الأصل ذو دلالة تقنية غالبة (مصطلح فلكي = apogee).
        استعماله بمعنى الجودة ثانوي ومجازي بعيد، ولا يُرجَّح إدراجه في وجود
        ألفاظ أصيلة قاطعة (قمة، ذروة). إيثار التراثي العربي الأصيل يستوجب الرفض.

    - lemma: "الغَايَة"
      source: stage1
      decision: removed
      decision_reason: >
        الغاية تدل على الهدف والمقصد (goal/destination) لا على صفة الجودة القصوى
        في شيء ما. إدراجها سيُحدث خلطاً بين «الغرض» و«الجودة الأرقى»، وهو خلط
        يُضعف دقة المجموعة الدلالية.

    - lemma: "الإِتْقَان"
      source: stage1
      decision: removed
      decision_reason: >
        الإتقان يدل على الإحكام والدقة في الصنعة والمعرفة (precision/mastery)،
        لا على مرتبة الجودة القصوى في نوع الشيء. الدلالة المعجمية المتواترة
        تُناقض معنى المجموعة (جودة عالية ≠ إحكام المعرفة بالأدلة).


