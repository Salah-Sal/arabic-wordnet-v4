stage1_review:
  assessment:
    concerns: []
    observations: "تُعدّ «تَرْجَمَة» المصطلح العلمي المستقر والمقابل المباشر للمصطلح الإنجليزي (translation) في علم الوراثة، وهو مجاز علمي حديث نُقل عن اللغات الأجنبية للدلالة على فك الشفرة الجينية لتكوين البروتينات."
  blind_candidates:
    - lemma: "تَرْجَمَة"
      generation_method: majaz
      justification: "استعارة علمية ومقابل دقيق ومستقر للمصطلح الأجنبي للتعبير عن قراءة الشفرة الوراثية وتكوين البروتين."
    - lemma: "بِنَاء بْرُوتِينِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يشير إلى عملية تكوين البروتين بشكل عام، رغم أنه قد يشمل عملية النسخ أيضاً."
    - lemma: "تَخْلِيق بْرُوتِينِيّ"
      generation_method: tarkib
      justification: "مصطلح بديل للبناء يشير إلى العملية الحيوية."
    - lemma: "تَشْكِيل بْرُوتِينِيّ"
      generation_method: tarkib
      justification: "صياغة تصف النتيجة النهائية للعملية الوراثية."

stage2_evidence:
  per_lemma:
    - lemma: "ترجمة"
      confirm:
        - text: "عملية قراءة الشفرة الموجودة في متوالية النكليوتيدات الموجودة في الرنا إلى متوالية من أحماض أمينية لتكوين البروتين."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "عملية تكوين عديد الببتيد، وهى عملية يتم فيها تحديد تسلسل الحمض الأميني بواسطة جزيئات ر ن أ الراسل، وتوصيلها بواسطة ر ن أ الناقل، وتنفيذها على الريبوسومات."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
    - lemma: "تَرْجَمَة"
      confirm:
        - text: "عملية قراءة الشفرة الموجودة في متوالية النكليوتيدات الموجودة في الرنا إلى متوالية من أحماض أمينية لتكوين البروتين."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "بِنَاء بْرُوتِينِيّ"
      evidence_status: "no_material_found"
    - lemma: "تَخْلِيق بْرُوتِينِيّ"
      evidence_status: "no_material_found"
    - lemma: "تَشْكِيل بْرُوتِينِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "ترجمة"
      decision: confirmed
      decision_reason: "المصطلح العلمي القياسي والمستقر والمقابل الدقيق للمصطلح الإنجليزي في المجال الطبي والبيولوجي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْجَمَة"
    - lemma: "تَرْجَمَة"
      source: stage1
      decision: removed
      decision_reason: "متطابق مع اللمة الموجودة في المجموعة، ولا حاجة لإضافة مدخل جديد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
    - lemma: "بِنَاء بْرُوتِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "المصطلح أعم من الترجمة حيث يشمل عملية التخليق ككل (Protein synthesis) بما فيها عملية النسخ (Transcription)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
    - lemma: "تَخْلِيق بْرُوتِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "نفس سبب استبعاد «بناء بروتيني»، فهو أعم من الترجمة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
    - lemma: "تَشْكِيل بْرُوتِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "ليس المصطلح التقني الدقيق الخاص بالمرحلة النهائية المحددة بـ translation."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true

stage4_content:
  definition:
    current: "(علم الوراثة) العملية التي توجه فيها المعلومات الوراثية المشفرة في الرنا المرسال تكوين بروتين معين في الريبوسوم في السيتوبلازم"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يحتاج إلى صياغة أكثر دقة وانسيابية لغوياً، مع الحفاظ على العناصر العلمية الدقيقة (الرنا المرسال، الريبوسوم، تكوين البروتين)."
    authored:
      - type: terminological
        text: "عملية حيوية تُقرأ فيها الشفرة الوراثية المحمولة على الحمض النووي الريبوزي المرسال (mRNA) داخل الريبوسومات لتكوين سلسلة من الأحماض الأمينية تشكل بروتيناً معيناً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية حيوية تُقرأ فيها الشفرة الوراثية المحمولة على الحمض النووي الريبوزي المرسال (mRNA) داخل الريبوسومات لتكوين سلسلة من الأحماض الأمينية تشكل بروتيناً معيناً."
  examples:
    per_lemma:
      - lemma: "ترجمة"
        examples:
          - text: "تعتبر عملية الترجمة الخطوة الثانية في التعبير الجيني بعد عملية النسخ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تعتبر عملية الترجمة الخطوة الثانية في التعبير الجيني بعد عملية النسخ."

