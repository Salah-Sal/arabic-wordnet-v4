stage1_review:
  assessment:
    concerns:
      - "اللمة (أقلية) تحتاج إلى الضبط بالشكل التام لتصبح (أَقَلِّيَّة)."
    observations: "التعريف دقيق ويعبر بوضوح عن المفهوم السوسيوسياسي للأقلية (minority). المصطلح المعتمد والمستخدم بشكل شائع هو (أَقَلِّيَّة) على صيغة المصدر الصناعي."
  blind_candidates:
    - lemma: "أَقَلِّيَّة"
      generation_method: ishtiqaq
      justification: "بإضافة ياء النسبة والتاء المربوطة (المصدر الصناعي) إلى (أقل)، للدلالة على الفئة الأقل عدداً."
    - lemma: "قِلَّة"
      generation_method: ishtiqaq
      justification: "مصدر يدل على نقيض الكثرة."
    - lemma: "فِئَةٌ أَقَلِّيَّةٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين الجماعة وكونها الأقل."
    - lemma: "طَائِفَةٌ صُغْرَى"
      generation_method: tarkib
      justification: "تركيب وصفي يدل على مجموعة أصغر ضمن كيان أكبر."

stage2_evidence:
  per_lemma:
    - lemma: "أقلية"
      confirm:
        - text: "«الأقَلِّيَّةُ: خلاف الأكثرية»"
          source: "المعجم الوسيط"
        - text: "«أقلية: minority»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
    - lemma: "أَقَلِّيَّة"
      confirm:
        - text: "«الأقَلِّيَّةُ: خلاف الأكثرية»"
          source: "المعجم الوسيط"
        - text: "«أقلية: minority»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
    - lemma: "قِلَّة"
      expands:
        - text: "«القِلَّةُ: ضد الكثرة»"
          source: "المعجم الوسيط"
    - lemma: "فِئَةٌ أَقَلِّيَّةٌ"
      evidence_status: "no_material_found"
    - lemma: "طَائِفَةٌ صُغْرَى"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أقلية"
      decision: confirmed
      decision_reason: "هو المصطلح السائد والمعتمد حديثاً للتعبير عن المفهوم السياسي والاجتماعي للأقلية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَقَلِّيَّة"
    - lemma: "أَقَلِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "هي نفس اللمة الموجودة بالفعل، وقد تم ضبط اللمة الأصلية."
    - lemma: "قِلَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح عام يدل على النقص في العدد ولا يحمل بالضرورة الدلالة الاصطلاحية السياسية للفئة المستضعفة أو الأقل."
    - lemma: "فِئَةٌ أَقَلِّيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "تعبير غير مسكوك، ويكتفى بالمصطلح المفرد لشيوعه واعتماده."
    - lemma: "طَائِفَةٌ صُغْرَى"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي غير مستقر معجمياً كمرادف لهذا المفهوم."

stage4_content:
  definition:
    current: "مجموعة من الناس تختلف عرقياً أو سياسياً عن مجموعة أكبر تشكل جزءاً منها"
    assessment:
      decision: retain
      reason: "التعريف دقيق ويفي بالغرض ويعبر عن مفهوم الأقلية بصورة واضحة ومطابقة للمعنى الاصطلاحي."
  examples:
    per_lemma:
      - lemma: "أقلية"
        examples:
          - text: "يَضْمَنُ الدُّسْتُورُ حِمَايَةَ حُقُوقِ كُلِّ أَقَلِّيَّةٍ دِينِيَّةٍ أَوْ عِرْقِيَّةٍ فِي الْبِلَادِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يَضْمَنُ الدُّسْتُورُ حِمَايَةَ حُقُوقِ كُلِّ أَقَلِّيَّةٍ دِينِيَّةٍ أَوْ عِرْقِيَّةٍ فِي الْبِلَادِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يَضْمَنُ الدُّسْتُورُ حِمَايَةَ حُقُوقِ كُلِّ أَقَلِّيَّةٍ دِينِيَّةٍ أَوْ عِرْقِيَّةٍ فِي الْبِلَادِ."}

stage5_enrichment:
  per_entry:
    - lemma: "أقلية"
      entry_id: "{auto}"
      root: "قلل"
      maqayis_quote: "«الْقَافُ وَاللَّامُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى نَزَارَةِ الشَّيْءِ، وَالْآخَرُ عَلَى خِلَافِ الِاسْتِقْرَارِ، وَهُوَ الِانْزِعَاجُ... وَالْقُلُّ: الْقِلَّةُ»"
  per_sense:
    - lemma: "أقلية"
      sense_id: "{auto}"
      nuance: "مصطلح سياسي واجتماعي يدل على الفئة الأقل عدداً ضمن مجتمع أكبر."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قلل","maqayis_quote":"«الْقَافُ وَاللَّامُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى نَزَارَةِ الشَّيْءِ، وَالْآخَرُ عَلَى خِلَافِ الِاسْتِقْرَارِ، وَهُوَ الِانْزِعَاجُ... وَالْقُلُّ: الْقِلَّةُ»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح سياسي واجتماعي يدل على الفئة الأقل عدداً ضمن مجتمع أكبر.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
