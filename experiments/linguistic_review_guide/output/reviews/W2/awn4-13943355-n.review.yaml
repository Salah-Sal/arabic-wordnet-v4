# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "تزيين"
      decision: confirmed
      decision_reason: >
        تزيين مصدر الفعل زَيَّنَ (Form II)، راسخ في المعاجم التقنية العربية مقابل
        "ornamentation" في قطاعات متعددة (علم الأحياء، التقنيات التربوية، الجغرافيا).
        رغم التوتر الدلالي (مصدر فعلي مقابل حالة)، فإن هذا الاستعمال مقبول في
        التقنين العربي؛ إذ المصادر العربية تشمل في الغالب الفعل والحالة معاً.
        تحتاج اللمّة إلى تشكيل كامل: تَزْيِين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تزيين أعمّ وأشمل دلالةً من زخرفة؛ يدل على عملية التزيين بأي وسيلة كانت
        (بالأضواء أو الألوان أو الحلى أو النقش)، ويُستعمل في المعاجم التقنية مقابلاً
        عاماً لـ ornamentation وdecoration وembellishment، بينما زخرفة مختصة بفن
        النقش والتطريز والتطعيم
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَزْيِين"

    - lemma: "زخرفة"
      decision: confirmed
      decision_reason: >
        زخرفة مصدر الفعل زَخْرَفَ (Form II)، موثّقة توثيقاً وافياً في المعاجم العربية
        الكلاسيكية والمعاصرة والتقنية، وتُعادل بصفة خاصة "ornamentation" في سياقات
        الفن والعمارة والجيولوجيا. تحتاج إلى تشكيل كامل: زَخْرَفَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        زخرفة أخصّ من تزيين؛ تدل تحديداً على التزيين الفني المعقّد بالنقش والتطريز
        والتطعيم وما إليها، مع إيحاء بالإتقان الحرفي. الجذر زخرف يرجع إلى الزُّخْرُف
        (الذهب) في أصل الاستعمال، مما يضفي على الكلمة دلالة الزينة الثمينة
        والمبالغة في الزخرف؛ كما تُستعمل في سياق الذمّ (زخرفة الأقوال = تمويهها)
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَخْرَفَة"

    - lemma: "تَزَخْرُف"
      source: stage1
      decision: removed
      decision_reason: >
        المصادر المعجمية تُثبت تَزَخْرَفَ فعلاً (verb) لا مصدراً مستقلاً بوزن تَفَعُّل.
        المصدر تَزَخْرُف غير مُدرَج مداخلَ مستقلةً، ويتداخل مع زخرفة الموجودة أصلاً.
        علاوة على ذلك، فإن اللمّتين المؤكَّدتين (تزيين وزخرفة) تغطّيان المفهوم بصورة
        وافية، ولا حاجة إلى لمّة ثالثة في المجموعة.

    - lemma: "مُزَخْرَفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذه الصيغة في أي من المعاجم المستعلَمة (760,660 مدخل).
        رغم صحّتها الاشتقاقية النظرية، فإن المصدر الصناعي مُزَخْرَفِيَّة ثقيل
        ومصطنع ولا يجري على ألسنة المتخصصين. غياب التوثيق المعجمي يوجب رفضه.

    - lemma: "رَوْنَق"
      source: stage1
      decision: removed
      decision_reason: >
        رونق يدل على الحسن والبهاء الذاتيَّيْن (luster, splendor)، وهو حسنٌ طبيعي
        غير مقصود، بينما تعبّر المجموعة عن حالة الزخرفة المصطنعة المقصودة. الجذر رنق
        في مقاييس ابن فارس يدل على الكدر والاضطراب لا على الزينة، مما يجعل رونق
        بعيداً جذرياً عن المفهوم. يُضاف إلى ذلك أن رونق يختص بفئة خاصة من الجمال
        (ماء السيف، أول الشباب) ولا يعمّ الزخرفة الفنية.

    - lemma: "تَزَيُّن"
      source: stage1
      decision: removed
      decision_reason: >
        تَزَيُّن مصدر الفعل تَزَيَّنَ يتداخل دلالياً مع تَزْيِين المؤكَّد أصلاً
        في المجموعة؛ فكلاهما من الجذر ذاته (زين)، وتمييزهما في المجموعة الواحدة
        سيخلق تكراراً غير مبرر. علاوة على ذلك، تُثبت المعاجم تَزَيَّنَ فعلاً لا اسماً
        في الغالب، والمصدر تَزَيُّن أقل تداولاً من تزيين في السياقات التقنية.


