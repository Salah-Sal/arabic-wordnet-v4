# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان (تزيين، زخرفة) مكتوبتان بدون تشكيل كامل"
      - "كلتا اللمّتين مصدر فعلي يدل في أصل وضعه على فعل التزيين (act of ornamenting) لا على حالة كونه مزخرفاً (state of being ornamented) كما يشير التعريف الإنجليزي — ثمة توتر دلالي بين اللمّات والتعريف"
      - "التعريف العربي الحالي (حالة كونه مزخرفاً) ترجمة حرفية ركيكة لا تتبع أسلوب المعجم الوسيط ولا تصلح معرّفاً معجمياً"
    observations: >
      تضمّ المجموعة لمّتين راسختين في الاستعمال المعجمي والمصطلحي (تزيين وزخرفة)،
      وكلاهما يرد في المعاجم التقنية العربية مقابل "ornamentation". غير أن كلاً منهما
      مصدر يدل في الأصل على العملية والفعل لا على الحالة المجردة؛ وهذا التوتر موجود
      في الاستعمال التقني العربي عموماً ولم يمنع تعميمهما. المشكلة الأكبر هي التعريف
      العربي الحالي الذي يحتاج إلى إعادة صياغة وفق أسلوب التعريف المعجمي العربي.
      يبدو أن المجموعة تعبّر عن مفهوم مزدوج (عملية + حالة) يعكسه غموض المصطلح الإنجليزي
      "ornamentation" نفسه الذي يُستعمل لكليهما.

  blind_candidates:
    # ← مولَّدة من التعريف الأعمى قبل الاطلاع على اللمّات الموجودة
    - lemma: "تَزَخْرُف"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل تَزَخْرَفَ (الفعل المزيد على وزن تَفَعَّلَ من الجذر الرباعي زخرف).
        وزنُ تَفَعُّل يدل على الاكتساب والدخول في الحالة، فـ(تَزَخْرُف) معناه
        اكتساء الشيء بالزخرفة ودخوله في حالة الكون مزخرفاً، وهو أقرب من مصدر
        الفعل المعدّى (زَخْرَفَ → زَخْرَفَة) لأنه يعبّر عن الحالة لا عن الفعل.

    - lemma: "مُزَخْرَفِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي مشتق من اسم المفعول (مُزَخْرَف) بإضافة ياء النسبة والتاء المربوطة،
        على وزن منتج في العربية المعاصرة (معقولية، مقبولية، إلخ).
        تدل مُزَخْرَفِيَّة على الخاصية والحالة المجردة: حالة كون الشيء مُزَخْرَفاً،
        مما يتطابق مع المعنى الإنجليزي "the state of being ornamented".

    - lemma: "رَوْنَق"
      generation_method: majaz
      justification: >
        لفظ عربي تراثي يدل على ماء السيف وصفاؤه وحسنه، ثم توسّع ليشمل الحسن والبهاء
        والإشراق عموماً. يمكن إحياؤه بمعنى مجازي لحالة التزيين والبهاء المكتسب،
        إذ يُقال للشيء المزيّن «له رَوْنَق»، مما يجعله معبّراً عن حالة الاكتساء بالزينة.

    - lemma: "تَزَيُّن"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل تَزَيَّنَ (الفعل المزيد على وزن تَفَعَّلَ من الجذر زين).
        وزنُ تَفَعُّل كما ذُكر يدل على الدخول في الحالة واكتسابها، فـ(تَزَيُّن)
        يعني الحصول على الزينة والاكتساء بها، ويعبّر عن حالة الكون متزيّناً.


