stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية (معشبة) تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي جيد ولكنه يبدو مترجماً حرفياً بعض الشيء، ويمكن صياغته بأسلوب معجمي أسلس."
    observations: "مصطلح (مَعْشَبَة) مشتق على وزن مَفْعَلَة، وهو من أوزان أسماء المكان والآلة في العربية، ويُستخدم هنا للدلالة على المكان الذي تحفظ فيه النباتات والمجموعة المحفوظة نفسها (علاقة مجاز مرسل/مكانية). المصطلح مستقر علمياً."
  blind_candidates:
    - lemma: "مَعْشَبَة"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (عشب) على وزن مَفْعَلَة للدلالة على المكان الذي تُجمع وتُحفظ فيه النباتات والأعشاب للدراسة، وينسحب على المجموعة نفسها."
    - lemma: "مَجْمُوعَةٌ نَبَاتِيَّةٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر بشكل مباشر عن مجموعة النباتات، ويمكن أن يُفهم في سياق الجمع والحفظ."
    - lemma: "مِعْشَب"
      generation_method: ishtiqaq
      justification: "مشتق على وزن مِفْعَل للدلالة على الوعاء أو الأداة التي تضم الأعشاب."
    - lemma: "صِوَانُ نَبَاتَاتٍ"
      generation_method: tarkib
      justification: "تركيب إضافي؛ الصوان هو مكان الحفظ المخصص للكتب أو الأشياء القيمة، ومخصص هنا للنباتات."

stage2_evidence:
  per_lemma:
    - lemma: "مَعْشَبَة"
      confirm:
        - text: "«المَعْشَبَة: «أ» مجموعة من نماذج الأعشاب المجفّفة مرتّبةً ترتيبًا نظاميًّا. «ب» مكان حفظ هذه المجموعة.»"
          source: "المورد الحديث (2008)"
        - text: "«مكان تحفظ فيه النباتات مجففة مرتبة حسب فصائلها وأجناسها وأنواعها»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "مَجْمُوعَةٌ نَبَاتِيَّةٌ"
      expands:
        - text: "«مجموعة نباتية (flora)»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية (موقع ArabTerm)"
          addition: "يُستخدم هذا التركيب عادة للدلالة على الفلورا (النباتات في منطقة أو حقبة معينة) وليس بالضرورة العينات المجففة."
    - lemma: "مِعْشَب"
      evidence_status: no_material_found
    - lemma: "صِوَانُ نَبَاتَاتٍ"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "معشبة"
      decision: confirmed
      decision_reason: "مصطلح دقيق، موثق معجمياً، شائع في علم الأحياء، ويعبر تماماً عن الدلالة المطلوبة (Herbarium)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْشَبَة"
    - lemma: "مَجْمُوعَةٌ نَبَاتِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "يُفضل استخدامه لمقابل كلمة Flora (نبيت أو نباتات منطقة) وليس للمجموعة المجففة المحفوظة."
    - lemma: "مِعْشَب"
      source: stage1
      decision: removed
      decision_reason: "غير موثق معجمياً لهذه الدلالة، و(مَعْشَبَة) تفي بالغرض وأشهر استخداماً."
    - lemma: "صِوَانُ نَبَاتَاتٍ"
      source: stage1
      decision: removed
      decision_reason: "تركيب حر غير مسكوك معجمياً ولا يستخدم كمصطلح علمي مستقر."

stage4_content:
  definition:
    current: "مجموعة من النباتات المجففة التي يتم تثبيتها وتصنيفها بشكل منهجي للدراسة"
    assessment:
      decision: revise
      reason: "تعديل طفيف لضبط الصياغة بأسلوب معجمي أكثر رصانة مع الحفاظ على دقة المعنى."
    authored:
      - type: terminological
        text: "مَجْمُوعَةٌ مِنَ النَّبَاتَاتِ وَالأَعْشَابِ الْمُجَفَّفَةِ، تُثَبَّتُ وَتُصَنَّفُ مَنْهَجِيّاً لِأَغْرَاضِ الدِّرَاسَةِ وَالْبَحْثِ العِلْمِيِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَجْمُوعَةٌ مِنَ النَّبَاتَاتِ وَالأَعْشَابِ الْمُجَفَّفَةِ، تُثَبَّتُ وَتُصَنَّفُ مَنْهَجِيّاً لِأَغْرَاضِ الدِّرَاسَةِ وَالْبَحْثِ العِلْمِيِّ."
  examples:
    per_lemma:
      - lemma: "مَعْشَبَة"
        examples:
          - text: "تَضُمُّ مَعْشَبَةُ الْجَامِعَةِ آلاَفَ الْعَيِّنَاتِ النَّبَاتِيَّةِ النَّادِرَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَضُمُّ مَعْشَبَةُ الْجَامِعَةِ آلاَفَ الْعَيِّنَاتِ النَّبَاتِيَّةِ النَّادِرَةِ."

stage5_enrichment:
  per_entry:
    - lemma: "مَعْشَبَة"
      entry_id: "{auto}"
      root: "عشب"
      maqayis_quote: "«(عَشَبَ) الْعَيْنُ وَالشِّينُ وَالْبَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى يُبْسٍ فِي شَيْءٍ وَقُحُولٍ وَمَا أَشْبَهَ ذَلِكَ. مِنْ ذَلِكَ الْعُشْبُ...»"
  per_sense:
    - lemma: "مَعْشَبَة"
      sense_id: "{auto}"
      nuance: "المصطلح القياسي والمختص للدلالة على مجموعة النباتات المجففة والمكان الذي تُحفظ فيه لأغراض التصنيف والدراسة."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عشب","maqayis":"«(عَشَبَ) الْعَيْنُ وَالشِّينُ وَالْبَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى يُبْسٍ فِي شَيْءٍ وَقُحُولٍ وَمَا أَشْبَهَ ذَلِكَ. مِنْ ذَلِكَ الْعُشْبُ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح القياسي والمختص للدلالة على مجموعة النباتات المجففة والمكان الذي تُحفظ فيه لأغراض التصنيف والدراسة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
