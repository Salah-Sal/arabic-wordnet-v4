# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-10546109-n (revenant)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (عَائِد)، وهي كلمة متعددة المعاني جداً (ربح مالي، ضمير نحوي، مكان) مما قد يسبب التباساً"
      - "المجموعة الفائقة (hypernym) هي awn4-09786620-n (عامل/فاعل = agent) وهذا ربط دلالي ضعيف؛ العائد بعد غياب ليس بالضرورة عاملاً أو فاعلاً"
    observations: "المفهوم المراد هو شخص يعود بعد غيبة طويلة، وهو مفهوم مألوف في الثقافة العربية (الغائب الآيب). في العربية عدة جذور تؤدي هذا المعنى: عود (عاد يعود)، أوب (آب يؤوب)، رجع (رجع يرجع)، قفل (قفل يقفل من السفر). اسم الفاعل من هذه الجذور هو الأقرب صرفياً للدلالة على الشخص العائد."
  blind_candidates:
    - lemma: "عَائِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من عاد يعود (جذر ع و د)، على وزن فَاعِل، وهو أكثر الألفاظ شيوعاً للدلالة على من يرجع بعد غياب"
    - lemma: "آيِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من آب يؤوب (جذر أ و ب)، يدل تحديداً على الرجوع من السفر والغيبة، وقد جاء في الحديث «آيبون تائبون عابدون»"
    - lemma: "رَاجِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رجع يرجع (جذر ر ج ع)، يدل على من يعود إلى موضعه الأصلي"
    - lemma: "قَافِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من قفل يقفل (جذر ق ف ل)، يدل تحديداً على الرجوع من السفر، وقال ابن فارس: لا يقال للذاهبين قافلة حتى يرجعوا"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "عَائِد"
      confirm:
        - text: "«عَائِد: من (ع و د) الراجع والمرتد إلى الشيء ومن يأتي الشيء مرة بعد أخرى، والرجل والبعير هرم كانت فيه بقية»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) العائد [بعد غياب طويل] (2) العائد بعد الموت؛ الشَّبح (3) عائد»"
          source: "المورد الحديث (2008) — ترجمة revenant"
        - text: "«الْعَائِد: من الْعود وَهُوَ الرُّجُوع»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«(الْعَائِد) مَا يعود من ربح على الْمُشْتَرك فِي جمعية تعاونية أَو نَحْوهَا (مو)(ج) عوائد»"
          source: "المعجم الوسيط"
          addition: "في الوسيط العائد مقصور على المعنى المالي (الربح)، وليس للشخص العائد"
        - text: "«العائد عند النحاة أربعة: الضمير، ولام التعريف، ووضع المظهر موضع المضمر، وكون الخبر تفسيراً للمبتدأ»"
          source: "دستور العلماء للأحمدنكري"
          addition: "للعائد معنى اصطلاحي نحوي مختلف تماماً عن المعنى المراد"

    - lemma: "آيِب"
      confirm:
        - text: "«رأى مجمع اللغة المصريّ صحّة كلمة آيِب، استناداً لورود أمثالها في كلام العرب، وقد جاء في الحديث: آيبون تائبون عابدون»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«الهمزة والواو والباء أصل واحد، وهو الرجوع... قال أبو زيد: إنما الإياب الرجوع، أي وقت رجع، تقول: قد آب المسافر»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«والأيبة: الأوبة على المعاقبة، بمعنى الرجوع والتوبة، ظاهر أنه من آب يئيب»"
          source: "تاج العروس للزبيدي"
      expands:
        - text: "«وكل ذي غيبة يؤوب ... وغائب الموت لا يؤوب»"
          source: "مقاييس اللغة (شاهد شعري لعبيد)"
          addition: "الشاهد يربط الأوب تحديداً بالعودة من الغيبة، وهو المعنى المطلوب في المجموعة"

    - lemma: "رَاجِع"
      contradicts:
        - text: "«(الرَّاجِع) المرأة ترجع إلى أهلها بعد وفاة زوجها (ج) رواجع»"
          source: "المعجم الوسيط"
          conflict: "الراجع في الوسيط مخصص للمرأة التي تعود بعد وفاة زوجها، وليس لعموم العائدين"
        - text: "«من النساء: التي ترجع إلى بيت أهلها بموت زوجها أو بطلاقها — العائدُ، خلاف البادئ»"
          source: "المعجم الكبير"
          conflict: "المعنى الأول مخصص بالنساء، والمعنى الثاني (خلاف البادئ) عام جداً لا يفيد العودة بعد غياب طويل"
      expands:
        - text: "«الراء والجيم والعين أصل كبير مطرد منقاس، يدل على رد وتكرار. تقول: رجع يرجع رجوعاً، إذا عاد»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر عام جداً للرد والتكرار، لا يختص بالعودة من غيبة"

    - lemma: "قَافِل"
      expands:
        - text: "«القاف والفاء واللام أصل صحيح يدل أحدهما على أوبة من سفر... فالأول القفول وهو الرجوع من السفر، ولا يقال للذاهبين قافلة حتى يرجعوا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر مختص بالرجوع من السفر، لكن لم يُعثر على استعمال قافل اسم فاعل مفرداً للشخص العائد في المعاجم"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "عَائِد"
      decision: confirmed
      decision_reason: "اسم فاعل من عاد يعود، ثابت في المعاجم بمعنى الراجع والمرتد إلى الشيء. المورد الحديث يترجم revenant صراحة بـ«العائد بعد غياب طويل». رغم تعدد معانيه (ربح مالي، ضمير نحوي)، فإن السياق يميّزه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "عَائِد عام الدلالة، يشمل العودة من أي غياب سواء أكان سفراً أم غيره، ويُستعمل في السياقات المعاصرة والرسمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَائِد"

    - lemma: "آيِب"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من آب يؤوب (جذر أ و ب)، أقرّ مجمع اللغة المصري بفصاحته، وجاء في الحديث النبوي «آيبون تائبون عابدون». الجذر أ و ب مختص بالرجوع من السفر والغيبة كما في مقاييس اللغة. يضيف للمجموعة بُعداً تراثياً ودلالة أخص من عائد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "آيِب أخصّ من عائد؛ يغلب استعماله في سياق العودة من السفر والغيبة البعيدة، وله صبغة تراثية أدبية"
      actions:
        - command: create_entry
          params: {lemma: "آيِب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "رَاجِع"
      source: stage1
      decision: removed
      decision_reason: "الراجع في المعاجم الكبرى مخصص بالمرأة التي تعود بعد وفاة زوجها أو طلاقها (الوسيط والكبير). المعنى العام (خلاف البادئ) لا يستلزم غياباً طويلاً. إدراجه يسبب التباساً مع المعنى المتخصص."

    - lemma: "قَافِل"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على قافل بوصفه اسم فاعل مفرداً يدل على شخص عائد في أي معجم. الجذر ق ف ل مختص بالرجوع من السفر لكن الاستعمال الحي انحصر في القافلة (المجموعة المسافرة) لا في المفرد."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يعود بعد غياب طويل"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح في مضمونه لكنه يفتقر إلى دقة الأسلوب المعجمي؛ ينبغي إضافة الوجهة (الموطن/القوم) لتمييزه عن مجرد العودة العابرة"
    authored:
      - type: terminological
        text: "مَنْ يَرْجِعُ إِلَى مَوْطِنِهِ أَوْ قَوْمِهِ بَعْدَ غَيْبَةٍ طَوِيلَةٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ يَرْجِعُ إِلَى مَوْطِنِهِ أَوْ قَوْمِهِ بَعْدَ غَيْبَةٍ طَوِيلَةٍ"

  examples:
    per_lemma:
      - lemma: "عَائِد"
        examples:
          - text: "استقبلت الأسرةُ ابنَها العائدَ من المهجر بعد عشرين عاماً بفرحة غامرة."
            type: usage
      - lemma: "آيِب"
        examples:
          - text: "«آيبون تائبون عابدون لربنا حامدون»"
            type: hadith
            source: "صحيح البخاري ومسلم"
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "استقبلت الأسرةُ ابنَها العائدَ من المهجر بعد عشرين عاماً بفرحة غامرة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وكلُّ ذي غَيبةٍ يَؤوبُ ... وغائبُ الموتِ لا يَؤوبُ"


