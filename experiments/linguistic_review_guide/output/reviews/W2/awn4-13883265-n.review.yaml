stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "كلمة 'مستوى' في الاستخدام المعاصر تشير غالباً إلى (Level) أو الدرجة، بينما المصطلح الرياضي الدقيق لـ Plane هو 'مُسْتَوٍ' أو 'سَطْح مُسْتَوٍ'."
      - "كلمة 'مسطح' غالباً ما تكون صفة (Flat) وليست اسماً للمفهوم الرياضي المجرد."
    observations: "المجموعة تركز على المفهوم الرياضي للمستوى (Plane). التعريف العربي الحالي دقيق من الناحية العلمية. تحتاج المجموعة إلى لمّات أكثر دقة اصطلاحية وتشكيل كامل."
  blind_candidates:
    - lemma: "مُسْتَوٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'استوى' يدل على الاعتدال وعدم الانحناء، وهو المصطلح الرياضي القياسي للمستوى ثنائي الأبعاد."
    - lemma: "صَفِيحَة"
      generation_method: majaz
      justification: "استخدام اللفظ الدال على الشيء العريض الرقيق (Sheet) للدلالة على السطح المستوي في الرياضيات."
    - lemma: "سَطْحٌ مُسْتَوٍ"
      generation_method: tarkib
      justification: "تعبير وصفي يحدد طبيعة السطح بأنه مستوٍ تماماً، وهو أدق رياضياً لتمييزه عن الأسطح المنحنية."
    - lemma: "سَطْح"
      generation_method: ishtiqaq
      justification: "الاسم العام لكل ما له طول وعرض، ويستخدم في الهندسة ليدل على المستوى."

stage2_evidence:
  per_lemma:
    - lemma: "مستوى"
      confirm:
        - text: "«مستوى ذكاء الطفل: الصواب والرتبة: -مستوى ذكاء الطفل [صحيحة] التعليق: تشيع كلمة «مستوى» في لغة العصر الحديث بمعنى الدرجة والمكانة»"
          source: "معجم الصواب اللغوي"
      contradicts:
        - text: "«المستوى: الدرجة والمكانة التي استوى عليها الشيء»"
          source: "المعجم الوسيط"
          conflict: "المستوى هنا بمعنى Level وليس Plane الرياضي."
    - lemma: "مسطح"
      confirm:
        - text: "«(مُسَطَّح): ذو سطحٍ مُستوٍ»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«مسطَّح: مساحة منبسطة مع انحدار ضعيف إلى ضعيف جدا أو منعدم»"
          source: "المعجم الموحد (ArabTerm)"
    - lemma: "مستو"
      confirm:
        - text: "«مستوٍ: [في الانكليزية] plane [في الفرنسية] plane»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
    - lemma: "سطح"
      confirm:
        - text: "«السطح: (فِي الهندسة) مَا لَهُ طول وَعرض»"
          source: "المعجم الوسيط"
        - text: "«(هس) السَّطح المستوي: السَّطح الذي إذا أخذت فيه أيّ نقطتين كان المستقيم الواصل بينهما منطبقًا عليه»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«وعند الحكماء هو العرض المنقسم في جهتين فقط، أي العرض الذي يقبل الانقسام طولا وعرضا لا عمقا، ونهايته الخط»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "صفيحة"
      confirm:
        - text: "«الصفيحة: هي هياكل سطح مستو، يتم تحميلها بشكل مستعرض على وجهها»"
          source: "المعجم الموحد لمصطلحات النقل"
      expands:
        - text: "«والمراد من ذلك في علم الأسطرلاب هو جسم يحيط به دائرتان متساويتان ومتوازيتان»"
          source: "كشاف اصطلاحات الفنون"
          addition: "استخدام تاريخي تقني."

stage3_analysis:
  per_lemma:
    - lemma: "مستوى"
      decision: confirmed
      decision_reason: "على الرغم من شيوعها بمعنى Level، إلا أنها تستخدم في لغة العلم المعاصرة بمعنى Plane أيضاً، وسنقوم بتشكيلها وتدقيق المعنى."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَوًى"
    - lemma: "مسطح"
      decision: confirmed
      decision_reason: "تستخدم للدلالة على السطح المنبسط، وهي مقبولة في السياق الهندسي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسَطَّح"
    - lemma: "مُسْتَوٍ"
      source: stage1
      decision: confirmed
      decision_reason: "هو المصطلح الرياضي الأدق لترجمة Plane (اسم فاعل من استوى)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُسْتَوٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13883265-n"}
    - lemma: "سَطْحٌ مُسْتَوٍ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير مركب دقيق جداً لتمييز المستوى الرياضي عن الأسطح المنحنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "سَطْحٌ مُسْتَوٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13883265-n"}
    - lemma: "سَطْح"
      source: stage1
      decision: confirmed
      decision_reason: "الاسم الأساسي في الهندسة لما له طول وعرض فقط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سَطْح", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13883265-n"}

stage4_content:
  definition:
    current: "(رياضيات) شكل ثنائي الأبعاد غير محدود"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق علمياً لكنه يفتقر إلى الأسلوب المعجمي العربي الرصين."
    authored:
      - type: terminological
        text: "مساحةٌ مُنْبَسِطةٌ غيرُ محدودةٍ، لها طولٌ وعرضٌ ولا عُمْقَ لها، وهي أصغرُ وحدةٍ مكانيَّةٍ بعد الخطِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13883265-n", definition_index: 0, text: "مساحةٌ مُنْبَسِطةٌ غيرُ محدودةٍ، لها طولٌ وعرضٌ ولا عُمْقَ لها، وهي أصغرُ وحدةٍ مكانيَّةٍ بعد الخطِّ."}
  examples:
    per_lemma:
      - lemma: "مُسْتَوٍ"
        examples:
          - text: "يُعرَّفُ المُسْتَوِي في الهندسةِ بأنَّهُ سَطحٌ لا يَنحَني أبداً."
            type: usage
      - lemma: "سَطْحٌ مُسْتَوٍ"
        examples:
          - text: "تَتَوازى الخطوطُ المُستقيمَةُ إذا وَقَعَت في سَطحٍ مُسْتَوٍ واحدٍ ولم تَلْتَقِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعرَّفُ المُسْتَوِي في الهندسةِ بأنَّهُ سَطحٌ لا يَنحَني أبداً."}

