stage1_review:
  assessment:
    concerns:
      - "تراكم" هو لفظ عام جداً وقد لا يعبر بدقة عن خصوصية الـ backlog كمهام "معلقة" أو "غير منفذة".
      - "أعمال متراكمة" تعبير وصفي صحيح لكنه يفتقر للتشكيل الكامل في البيانات الحالية.
    observations: "المفهوم يشير إلى تراكم كمي للمهام أو الطلبات التي لم يتم التعامل معها في وقتها، وهو مصطلح إداري وتجاري شائع."
  blind_candidates:
    - lemma: "مُتَخَلَّفَاتٌ"
      generation_method: ishtiqaq
      justification: "لفظ عربي فصيح يدل على ما تأخر أو بقي من أعمال أو مستحقات (Arrears)."
    - lemma: "أَعْمَالٌ عَالِقَةٌ"
      generation_method: tarkib
      justification: "تعبير عصري شائع جداً في الإدارة للإشارة إلى المهام التي لم تنجز بعد (Pending/Backlog)."
    - lemma: "مُتَرَاكِمَاتٌ"
      generation_method: ishtiqaq
      justification: "جمع اسم المفعول من تراكم، وهو تعبير مباشر عما تجمع وتراكم من أشياء."
    - lemma: "رَصِيدٌ مُتَرَاكِمٌ"
      generation_method: tarkib
      justification: "يستخدم في سياق الطلبيات أو الأعمال التي تشكل رصيداً ينتظر المعالجة."

stage2_evidence:
  per_lemma:
    - lemma: "تَرَاكُمٌ"
      confirm:
        - text: "«تَرَاكُمَتِ الأَشْغالُ»"
          source: "المعجم الكبير / المعجم الوسيط"
        - text: "«تجميع الطلبيات، تراكم الطلبيات: backlog of orders»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
    - lemma: "مُتَأَخِّرَاتٌ"
      confirm:
        - text: "«المتأخّرات: أعمال غير مُنجزة في موعدها أو ديون استحقّت ولم تُدفع»"
          source: "المورد الحديث"
        - text: "«مستحقات لم تدفع بعد (arrears)»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
    - lemma: "رُكَامٌ"
      confirm:
        - text: "«الرُّكام: رُكام من أعمال غير منجَزة أو من مواد معدّة للمعالجة الصناعية»"
          source: "المورد الحديث"
    - lemma: "أَعْمَالٌ مُتَرَاكِمَةٌ"
      confirm:
        - text: "«يقال: تَرَاكَمَتِ الأَشْغالُ»"
          source: "المعجم الكبير"
          addition: "يدعم صفة التراكم للأشغال."

stage3_analysis:
  per_lemma:
    - lemma: "أَعْمَالٌ مُتَرَاكِمَةٌ"
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق وشائع جداً في السياقات المهنية، ومستند إلى الاستعمال اللغوي في المعاجم (تراكمت الأشغال)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَعْمَالٌ مُتَرَاكِمَةٌ"
    - lemma: "تَرَاكُمٌ"
      decision: confirmed
      decision_reason: "مصدر يدل على الحالة، وهو مستخدم في المصطلحات الموحدة (تراكم الطلبيات)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرَاكُمٌ"
    - lemma: "مُتَأَخِّرَاتٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فني دقيق يعبر عن الأعمال أو الديون التي تأخر إنجازها أو دفعها عن موعدها، وهو مرادف مباشر لـ backlog في سياق الأعمال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُتَأَخِّرَاتٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "رُكَامٌ"
      source: stage1
      decision: confirmed
      decision_reason: "استخدام مجازي موثق في المعاجم الحديثة (المورد) للإشارة إلى تراكم الأعمال غير المنجزة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رُكَامٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "تراكم للوظائف غير المنجزة أو المواد غير المعالجة التي لم يتم التعامل معها بعد (خاصة طلبات العملاء غير المنفذة للمنتجات أو الخدمات)"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي ومترجم حرفياً. يفضل صياغته بأسلوب معجمي أكثر إحكاماً."
    authored:
      - type: terminological
        text: "مَجْمُوعَةٌ مِنَ الْأَعْمَالِ أَوْ الطَّلَبِيَّاتِ الَّتِي تَجَمَّعَتْ وَلَمْ تُنْجَزْ بَعْدُ لِتَجَاوُزِهَا مَوْعِدَهَا أَوْ لِتَرَاكُمِهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَرَاكُمٌ"
        examples:
          - text: "أَدَّى تَرَاكُمُ الْمَلَفَّاتِ بَعْدَ الْإِجَازَةِ إِلَى مَدِّ سَاعَاتِ الْعَمَلِ."
            type: usage
      - lemma: "أَعْمَالٌ مُتَرَاكِمَةٌ"
        examples:
          - text: "لَدَى الشَّرِكَةِ أَعْمَالٌ مُتَرَاكِمَةٌ مِنَ الطَّلَبِيَّاتِ لَمْ تُسَلَّمْ بَعْدُ."
            type: usage
      - lemma: "مُتَأَخِّرَاتٌ"
        examples:
          - text: "تَسْعَى الْإِدَارَةُ لِتَصْفِيَةِ كُلِّ الْمُتَأَخِّرَاتِ الْإِدَارِيَّةِ قَبْلَ نِهَايَةِ الشَّهْرِ."
            type: usage
      - lemma: "رُكَامٌ"
        examples:
          - text: "وَجَدَ السِّكْرِتِيرُ نَفْسَهُ أَمَامَ رُكَامٍ مِنَ الرَّسَائِلِ الَّتِي تَنْتَظِرُ الرَّدَّ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مَجْمُوعَةٌ مِنَ الْأَعْمَالِ أَوْ الطَّلَبِيَّاتِ الَّتِي تَجَمَّعَتْ وَلَمْ تُنْجَزْ بَعْدُ لِتَجَاوُزِهَا مَوْعِدَهَا أَوْ لِتَرَاكُمِهَا."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "سَعَى الْمُوَظَّفُ لِتَقْلِيصِ تَرَاكُمِ الْمَلَفَّاتِ بَعْدَ عَوْدَتِهِ مِنَ الْإِجَازَةِ."}

