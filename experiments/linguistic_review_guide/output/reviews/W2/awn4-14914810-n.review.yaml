stage1_review:
  assessment:
    concerns:
      - "عدم تشكيل اللمات الحالية"
      - "عدم دقة مصطلح 'زيت تشحيم' كمرادف عام للـ (Lubricant) إذ أنه نوع خاص منه"
    observations: "المجموعة تغطي مفهوماً تقنياً واضحاً، واللمات الموجودة تعبر عنه بدقة متفاوتة، ولكنها تحتاج إلى ضبط بالشكل وإضافة بعض المرادفات التقنية الشائعة."
  blind_candidates:
    - lemma: "مُزَلِّق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من زلّق، وهو المصطلح التقني الأكثر شيوعاً للمادة التي تقلل الاحتكاك."
    - lemma: "مُشَحِّمة"
      generation_method: ishtiqaq
      justification: "على وزن مِفْعَلة، للدلالة على الأداة أو المادة التي يتم بها التشحيم."
    - lemma: "مَادَّةُ تَزْلِيق"
      generation_method: tarkib
      justification: "تركيب إضافي وصفي يحدد المادة بوظيفتها في التزليق."
    - lemma: "زَيْتُ تَزْلِيق"
      generation_method: tarkib
      justification: "مرادف شائع في الصناعة الكيميائية والنفطية للمزلقات السائلة."

stage2_evidence:
  per_lemma:
    - lemma: "مُزَلِّق"
      confirm:
        - text: "«مادة تزيل أو تخفف الاحتكاكات، وتكون عادة ذات ملمس دهنيّ»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«المُزَلِّق: زيت أو شحم التزليق؛ مشحم؛ مزيت؛ مخفف للاحتكاك»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«المُزَلِّقُ: مَا يبل سطح الفضلة المحتبسة فِي المجرى»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "استخدام قديم في الطب للمادة المسهلة."
    - lemma: "مُشَحِّم"
      confirm:
        - text: "«مُشَحِّم: lubricant»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
    - lemma: "زَيْتُ تَشْحِيم"
      confirm:
        - text: "«زيت أو شحم التزليق»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "مَادَّةُ تَشْحِيم"
      confirm:
        - text: "«مواد تستخدم للتشحيم/للتزييت بهدف تقليل الاحتكاك والتآكل»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "مَادَّةُ تَزْلِيق"
      confirm:
        - text: "«زيت أو شحم التزليق»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"

stage3_analysis:
  per_lemma:
    - lemma: "مزلق"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والأكثر دقة تقنياً، يحتاج لضبط بالشكل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُزَلِّق"
    - lemma: "زيت تشحيم"
      decision: confirmed
      decision_reason: "مرادف شائع جداً وإن كان من الناحية الفنية نوعاً من المزلقات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَيْتُ تَشْحِيم"
    - lemma: "مادة تشحيم"
      decision: confirmed
      decision_reason: "مصطلح وصفي دقيق ومستخدم بكثرة في المراجع التقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّةُ تَشْحِيم"
    - lemma: "مُشَحِّم"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف معتمد في المعاجم الموحدة (النقل، الكيمياء) ومستخدم في الصناعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُشَحِّم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14914810-n"}
    - lemma: "مَادَّةُ تَزْلِيق"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح علمي دقيق يصف الوظيفة (التزليق) بدلاً من المادة (الشحم)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "مَادَّةُ تَزْلِيق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14914810-n"}

stage4_content:
  definition:
    current: "مادة قادرة على تقليل الاحتكاك عن طريق جعل الأسطح ناعمة أو زلقة"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يحتاج صياغة أكثر دقة ومعجمية."
    authored:
      - type: terminological
        text: "مادة تُستعمل لتقليل الاحتكاك بين الأسطح المتحركة بإنشاء طبقة رقيقة زلقة بينها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مادة ذات قوام دهني أو زيتي تُطلى بها الآلات والأجهزة لتيسير حركتها ومنع تآكل أجزائها بالاحتكاك."
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14914810-n", definition_index: 0, text: "مادة تُستعمل لتقليل الاحتكاك بين الأسطح المتحركة بإنشاء طبقة رقيقة زلقة بينها."}
  examples:
    per_lemma:
      - lemma: "مُزَلِّق"
        examples:
          - text: "يُوضع المُزَلِّقُ على تروسِ الآلةِ لضمانِ دورانِها بسلاسةٍ."
            type: usage
      - lemma: "زَيْتُ تَشْحِيم"
        examples:
          - text: "يُنصحُ بتغييرِ زَيْتِ التَّشْحِيمِ في المحركِ بانتظامٍ لمنعِ التآكلِ."
            type: usage
      - lemma: "مُشَحِّم"
        examples:
          - text: "يُستخدمُ المُشَحِّمُ الصِّنَاعِيُّ في تقليلِ حرارةِ الاحتكاكِ في المكابسِ الثقيلةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-14914810-n", text: "تعتمد كفاءة المحرك بشكل كبير على جودة مادة التشحيم المستخدمة فيه."}

