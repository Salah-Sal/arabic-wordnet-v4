# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'تسجيل بياني' غير موثّقة في أيٍّ من المعاجم التقنية العربية الحديثة ولا الكلاسيكية، وتبدو ترجمةً حرفيةً للإنجليزية 'graphical recording' وهو مصطلح هامشي في الإنجليزية ذاتها"
      - "غياب التشكيل الكامل على اللمّتين الموجودتين"
      - "التعريف الحالي مترجَمٌ ترجمةً مباشرةً من الإنجليزية ولا يجري على أسلوب المعجم الوسيط في الجنس القريب والفصل النوعي"
    observations: >
      المجموعة تعالج مفهوم الرسم البياني ذي المحاور الإحداثية — أي التمثيل الكميّ
      للبيانات في مستوى تعيَّن فيه كل نقطة بقيمتَي متغيرَيْن. لمّة 'رسم بياني'
      مركبٌ وصفي راسخٌ في المصطلحية التقنية العربية الحديثة ويستحق التأكيد.
      في المقابل 'تسجيل بياني' مفتقرٌ إلى أي سند معجمي. وقد كشف التأمل في
      التعريف (بخاصة دلالة المحاور والنقاط) عن مرشحَيْن قويَّيْن: 'مَخْطَط'
      المشتق من جذر الأثر الخطي، و'بَيَان' المستعمَل اصطلاحًا في معاجم الرياضيات
      بمعنى graph. ويُلاحَظ كذلك وجود مصطلح 'مِبْيان' (على وزن مِفْعَال) في
      بعض معاجم ALECSO، وإن لم يبلغ شيوع رسم بياني.

  blind_candidates:
    - lemma: "مَخْطَط"
      generation_method: ishtiqaq
      justification: >
        مشتقٌّ من جذر خطط على وزن مَفْعَل الدال على حاصل الفعل أو موضعه.
        الخطُّ في أصله الأثرُ الممتدُّ (مقاييس ابن فارس: الخاء والطاء أصل واحد هو أثر يمتدّ).
        الرسم البياني قوامه خطوط وآثار ممتدة على مستوى المحاور، فالمخطَّط
        يُعبِّر عن هذه الطبيعة تعبيرًا داخليًّا دقيقًا.
    - lemma: "بَيَان"
      generation_method: majaz
      justification: >
        أصل البيان في العربية الكشفُ والإيضاح وإخراج الشيء من الإشكال إلى التجلي.
        استُعيرَ في المجاز الوظيفي لمفهوم الرسم البياني بوصفه أداةً تُجلّي
        العلاقات الكمية وتكشفها بصريًّا. إحياءٌ للفظ عربي عريق بدلالة جديدة
        يُرسِّخها الاستخدام المتخصَّص في علم الرياضيات.
    - lemma: "صُورَة مَحْوَرِيَّة"
      generation_method: tarkib
      justification: >
        مركَّب وصفي (إضافي + نعت) من 'صورة' (الجنس: تمثيل مرئي) و'محورية'
        نسبةً إلى المحور (الفصل: ارتكازه على منظومة المحاور). يُؤدّي معنى
        التعريف بعناصره الجوهرية: التمثيل البصري المستند إلى محاور.
    - lemma: "خَارِطَة كَمِّيَّة"
      generation_method: tarkib
      justification: >
        مركَّب وصفي يستعير من 'الخارطة' فكرة التمثيل المكاني المضبوط بإحداثيات،
        ويُقيّده بـ'كمية' للدلالة على أن المُمثَّل كمياتٌ رقمية لا مواضع جغرافية.
        يلتقط الجوهرَيْن الأساسيَّيْن في التعريف: التحديد الإحداثي والطابع الكمّي.


