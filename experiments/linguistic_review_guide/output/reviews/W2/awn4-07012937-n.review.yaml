# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "رَسْم بَيَانِيّ"
      decision: confirmed
      decision_reason: >
        موثَّق في أكثر من عشرة معاجم تقنية عربية متخصصة تغطي مجالات الرياضيات
        والفيزياء والاقتصاد والكيمياء والطب والجغرافيا والهندسة الكهربائية،
        وجميعها معاجم موحدة صادرة عن جامعة الدول العربية وALECSO.
        يجتاز معايير الاطراد، والشيوع في الفصيح، ويُسر التداول، وإيثار العربي.
        المركّب الوصفي (رسم + بياني) واضح البنية ويجتاز اختبار السكّ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز جانبَي الفعل المرئي (الرسم = الأثر الخطي) والوظيفة التواصلية (البياني
        = الكاشف المُوضِّح) في آنٍ واحد؛ وهو أشيع المصطلحات الثلاثة تداولًا في
        النصوص التعليمية والعلمية العربية
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَسْم بَيَانِيّ"

    - lemma: "تَسْجِيل بَيَانِيّ"
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المصطلح في أيٍّ من المعاجم التقنية العربية المستعلَمة
        (قاعدة بيانات 107 معجم، 760,660 مدخل). 'تسجيل' في العربية مرتبط
        بالإدراج الرسمي والتسجيل الصوتي والتوثيق، لا بالتمثيل البصري للبيانات.
        يبدو ترجمةً حرفيةً للمقابل الإنجليزي الهامشي 'graphical recording'
        دون أن يُستعمَل في النصوص التقنية العربية.
        لا يجتاز اختبار التثبيت المعجمي ولا معيار الشيوع.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مَخْطَط"
      source: stage1
      decision: confirmed
      decision_reason: >
        مثبَّتٌ في معاجم ALECSO المتخصصة مقرونًا بـ'رسم بياني' بوصفه مصطلحًا
        مكافئًا في الكيمياء والصيدلة والنفط والهندسة الكهربائية؛ كما أن
        'مخطط ثلاثي الأبعاد' معرَّفٌ بـ'رسم بياني مجسم' مما يُثبّت المرادفة.
        الجذر خطط (أصله الأثر الممتد) يُلائم دلالة التمثيل الخطي للبيانات.
        يجتاز معايير الاطراد والاشتقاقية ويُسر التداول وإيثار التراثي.
        التحفظ: يُستخدم في بعض السياقات الطبية بمعنى planner، غير أن السياق
        الرياضي/البياني لا يُوجِد لبسًا فعليًّا.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الجانب الخطي والبنيوي (خطوط ومسارات ومحددات)؛
        أوسع دلالةً من 'رسم بياني' إذ يشمل المخططات الهندسية والتنظيمية
        والتدفقية — فهو الأنسب حين تُراد الإحالة إلى بنية المخطط وهيكله
        بصرف النظر عن الطابع الإحصائي أو الرياضي
      actions:
        - command: create_entry
          params:
            lemma: "مَخْطَط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "بَيَان"
      source: stage1
      decision: confirmed
      decision_reason: >
        مثبَّتٌ صراحةً في المعجم الموحد لمصطلحات الرياضيات والفلك (ALECSO 1990)
        بوصفه المصطلح العربي المعتمد لـ'graph' في الرياضيات البحتة. كذلك يُستخدم
        في مصطلحات مشتقة مثل 'بيان جزئي' (partial graph) و'بيان مماسي' (tangent
        graph)، مما يؤكد إنتاجيته الاصطلاحية. المعنى الأصلي (الكشف والإيضاح)
        يُعزز المجاز الدلالي. التحفظ: الحمل البلاغي الكلاسيكي وارد، لكنه
        لا يُشكّل لبسًا في المعاجم التقنية المتخصصة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الرياضي المفرد المختصَر المستخدَم في الرياضيات البحتة؛
        يُبرز دلالة الكشف والإيضاح عن العلاقات الكمية.
        يُستخدم في تركيبات رياضية تخصصية (البيان الجزئي، البيان المماسي)
        مما يجعله الأكثر دقةً في السياق الرياضي الصرف دون الإحصائي
      actions:
        - command: create_entry
          params:
            lemma: "بَيَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "صُورَة مَحْوَرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المركّب في أيٍّ من المصادر المعجمية المستعلَمة.
        لا يجتاز اختبار التثبيت المعجمي: يمكن إبدال 'صورة' بـ'رسم' أو 'تمثيل'
        وتظل العبارة واصفةً حرّة لا مصطلحًا سائدًا. كما أن 'محورية' غامضة
        إذ تحيل أيضًا إلى المعنى الفلسفي (محوريّ = جوهريّ أساسيّ).

    - lemma: "خَارِطَة كَمِّيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المركّب في قاعدة البيانات. 'الخارطة' في المصطلحية العربية
        مرتبطة بالتمثيل الجغرافي المكاني (خرائط بحرية، خرائط تنبؤ جوي، خرائط
        أعماق)، وتطبيقها على الرسم البياني الإحصائي يُحدث انزياحًا دلاليًّا
        غير مسنود بدليل معجمي.


