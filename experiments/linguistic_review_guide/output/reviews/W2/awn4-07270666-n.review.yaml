# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07270666-n (telepathy)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «انتقال الأفكار» تركيب إضافي حرّ وليس مصطلحاً مسكوكاً؛ يمكن إبداله بـ«نقل الأفكار» أو «انتقال الخواطر» دون تغيّر المعنى (يخفق في اختبار السكّ)"
      - "اللمّة «انتقال الأفكار» ترجمة حرفية (calque) للإنجليزية thought transference ولا توجد في أيّ معجم عربي بوصفها وحدة معجمية ثابتة"
      - "التعريف العربي الحالي مقبول لكنّ لفظ «ظاهري» قد يُلبس بمعنى «سطحي» بدلاً من «مزعوم»"
    observations: "المفهوم ينتمي إلى علم النفس الخوارقي (parapsychology). المصطلح المعتمد في المعاجم العربية الحديثة هو «تخاطر» من الجذر خ ط ر على وزن تَفَاعُل الدالّ على التشارك والتبادل، وهو اشتقاق بارع لأنّ الخاطر هو ما يمرّ بالذهن. أمّا «انتقال الأفكار» فعبارة وصفية شارحة لا ترقى إلى مستوى المصطلح."

  blind_candidates:
    - lemma: "تَخَاطُر"
      generation_method: ishtiqaq
      justification: "من الجذر خ ط ر (الخاطِر = ما يمرّ بالذهن) على وزن تَفَاعُل الدالّ على التشارك بين طرفين، فيكون المعنى: تبادل الخواطر بين عقلين — وهذا جوهر المفهوم"
    - lemma: "تَوَارُدٌ ذِهْنِيٌّ"
      generation_method: tarkib
      justification: "تَوَارُد من ورد على وزن تَفَاعُل بمعنى توافق الأفكار، مع وصف ذِهْنِيّ للتخصيص — لكنّ التوارد أقرب إلى الصدفة منه إلى الاتصال المقصود"
    - lemma: "مُنَاجَاةٌ عَقْلِيَّة"
      generation_method: tarkib
      justification: "المناجاة = التحدّث سرّاً، مع وصف عَقْلِيَّة لتخصيصها بالاتصال الذهني دون الحسّي — لكنّها عبارة وصفية لا مصطلح ثابت"
    - lemma: "تِلِبَاثِيَّة"
      generation_method: taarib
      justification: "تعريب لفظ telepathy بإلحاق ياء النسبة والتاء المربوطة — ملاذ أخير لا حاجة إليه مع وجود تخاطر"


stage2_evidence:
  per_lemma:
    - lemma: "تَخَاطُر"
      confirm:
        - text: "«التَّخاطُر: اتّصال عقل بآخر من غير طريق الكلام أو الكتابة أو الإشارة، أو من غير طريق الحواسّ الخمس»"
          source: "المورد الحديث (2008)"
        - text: "«تَخاطُر (التواصل مع النشاط الذهني للآخرين وقراءة أفكارهم)» = telepathy"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَخاطُر (قراءة الأفكار)» = thought-reading (telepathy)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَخاطُر» = thought-transference (telepathy)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تخاطر» = telepathy"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
      expands:
        - text: "«مجموعة من الظواهر النفسية يتم فيها إدراك أشياء بعيدة عن مجال الحواس المعروفة، كالتخاطر مثلاً»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "ورد التخاطر مثالاً على الإدراك فوق الحسّي (ESP)، مما يؤكّد موقعه في منظومة الظواهر الخوارقية"

    - lemma: "انتقال الأفكار"
      evidence_status: "no_material_found"

    - lemma: "تَوَارُدٌ ذِهْنِيٌّ"
      contradicts:
        - text: "«(توارد) القومُ الماءَ وردوه معاً والشاعران اتفقا في معنى واحد يرد بلفظ واحد من غير أخذ ولا سماع»"
          source: "المعجم الوسيط"
          conflict: "التوارد يدلّ على التوافق العفوي لا على الاتصال المقصود بين عقلين؛ المعنى مختلف جوهرياً عن التخاطر"
        - text: "«ظهور عناصر لغوية بشكل متكرر في النص نفسه وفي وضع محدد» = co-occurrence"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          conflict: "التوارد مصطلح لساني بمعنى التلازم لا التخاطر"

    - lemma: "مُنَاجَاةٌ عَقْلِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تِلِبَاثِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "تَخَاطُر"
      decision: confirmed
      decision_reason: "مصطلح راسخ في المعاجم العربية الحديثة (المورد الحديث، المعجم الطبي الموحد، مسرد علم الاجتماع)، مشتقّ اشتقاقاً سليماً من الجذر خ ط ر على وزن تَفَاعُل. يطابق المفهوم تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَخَاطُر"

    - lemma: "انتقال الأفكار"
      decision: removed
      decision_reason: "تركيب إضافي حرّ لا وحدة معجمية ثابتة: لم يُعثر عليه في أيّ معجم عربي بوصفه مصطلحاً. يخفق في اختبار السكّ (يمكن إبداله بـ«نقل الأفكار» أو «انتقال الخواطر»). وهو ترجمة حرفية (calque) لـ thought transference لا مسوّغ لها مع وجود «تخاطر» المسكوك."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَخَاطُر"
      source: stage1
      decision: removed
      decision_reason: "مرشّح مطابق للمّة موجودة مؤكَّدة — لا حاجة لإنشاء مدخل مكرّر"

    - lemma: "تَوَارُدٌ ذِهْنِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "التوارد يدلّ على التوافق العفوي بين شاعرين في المعنى واللفظ دون اتصال مقصود، وهو مفهوم مختلف جوهرياً عن التخاطر الذي يعني اتصالاً مباشراً بين عقلين. كذلك استقرّ مصطلحاً لسانياً بمعنى co-occurrence."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُنَاجَاةٌ عَقْلِيَّة"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة لا مصطلح مسكوك، ولم يُعثر عليها في أيّ معجم. تخفق في اختبار السكّ (يمكن إبدالها بـ«محادثة عقلية» أو «مخاطبة ذهنية»)."
      evidence_assessment:
        case: no_material

    - lemma: "تِلِبَاثِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تعريب لا حاجة إليه مع وجود المصطلح العربي الأصيل «تخاطر» الراسخ في المعاجم. مخالف لمبدأ إيثار العربي على الأعجمي."
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "تواصل ظاهري من عقل إلى آخر دون استخدام الإدراك الحسي"
    assessment:
      decision: revise
      reason: "لفظ «ظاهري» يحتمل اللبس مع «سطحي»، والتعريف يفتقر إلى الجنس القريب الدقيق. تعريف المورد الحديث أدقّ وأوضح."
    authored:
      - type: terminological
        text: "اتِّصالٌ يُزعَمُ وُقوعُهُ بَيْنَ عَقْلٍ وآخَرَ مِنْ غَيْرِ طَريقِ الحَواسِّ المَعروفَةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ضَرْبٌ مِنَ الإدْراكِ فَوْقَ الحِسِّيِّ يُدَّعى فيهِ أنَّ عَقْلاً يَتَلَقّى أفْكارَ عَقْلٍ آخَرَ أو مَشاعِرَهُ دونَ وَساطَةِ الكَلامِ أوِ الكِتابَةِ أوِ الإشارَةِ أو أيِّ وَسيلَةٍ حِسِّيَّةٍ مَعْروفَةٍ، وهُوَ مِنْ مَباحِثِ عِلْمِ النَّفْسِ الخَوارِقِيِّ"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "اتِّصالٌ يُزعَمُ وُقوعُهُ بَيْنَ عَقْلٍ وآخَرَ مِنْ غَيْرِ طَريقِ الحَواسِّ المَعروفَةِ"

  examples:
    per_lemma:
      - lemma: "تَخَاطُر"
        examples:
          - text: "أجرى فريقُ البحثِ تجاربَ مُتعدِّدةً لاختبارِ ظاهرةِ التَّخاطُرِ بينَ توأمَيْنِ مُتماثِلَيْنِ في ظروفٍ مَخبريَّةٍ مُحكَمَةٍ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أجرى فريقُ البحثِ تجاربَ مُتعدِّدةً لاختبارِ ظاهرةِ التَّخاطُرِ بينَ توأمَيْنِ مُتماثِلَيْنِ في ظروفٍ مَخبريَّةٍ مُحكَمَةٍ."


