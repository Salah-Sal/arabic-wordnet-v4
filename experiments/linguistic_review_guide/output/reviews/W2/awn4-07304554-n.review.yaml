stage1_review:
  assessment:
    concerns:
      - "اللفظ 'شيء' واسع جداً ولا يقتصر على 'الحدث' (event) بل يشمل 'الكيان' (entity)، مما قد يسبب خلطاً انطولوجياً."
      - "التعريف الحالي 'حدث ما' مقتضب جداً ولا يبين خصائص الحدث كونه يقع في حيز زمني ومكاني."
      - "هناك خلل في الهيكلية حيث تظهر المجموعة كفرع من 'الحدث الطبيعي' (Natural Event) بينما العكس هو الصحيح منطقياً."
    observations: "تعتبر هذه المجموعة الترادفية الأصل المفاهيمي لكل ما يقع أو يحدث. في العربية، يتسم لفظ 'حدث' بالدقة والاشتقاق المباشر، بينما 'أمر' و'شيء' هما من الألفاظ العامة التي تكتسب دلالة الحدث بالقرينة أو السياق. تفتقر المجموعة للفظي 'حادثة' و'واقعة' وهما من ركائز هذا الحقل الدلالي."
  blind_candidates:
    - lemma: "حَادِثَة"
      generation_method: ishtiqaq
      justification: "اسم لما يحدث ويتجدد من الأمور، وهو اللفظ المقابل لـ (incident/event)."
    - lemma: "وَاقِعَة"
      generation_method: ishtiqaq
      justification: "من الوقوع، وتستخدم للدلالة على الحدث الكبير أو الحقيقة الواقعة."
    - lemma: "نَازِلَة"
      generation_method: ishtiqaq
      justification: "ما ينزل بالإنسان من أحداث، وإن غلب استعمالها في الشدائد، إلا أنها لغوياً تعني الحدث."
    - lemma: "عَارِضَة"
      generation_method: ishtiqaq
      justification: "ما يعرض للشيء من أحداث أو طوارئ."

stage2_evidence:
  per_lemma:
    - lemma: "حَدَث"
      confirm:
        - text: "«الحَدَثُ: كَوْنُ الشَّيْءِ لَمْ يَكُنْ. يُقَالُ حَدَثَ أَمْرٌ بَعْدَ أَنْ لَمْ يَكُنْ.»"
          source: "مقاييس اللغة"
        - text: "«الأمرُ حدوثًا: وقع»"
          source: "المعجم الوسيط"
    - lemma: "أَمْر"
      confirm:
        - text: "«الأَمْرُ: الحادِثَةُ، ج: أُمورٌ.»"
          source: "القاموس المحيط"
        - text: "«الأمر: الشَّيْء»"
          source: "دستور العلماء"
    - lemma: "شَيْء"
      confirm:
        - text: "«الشَّيْءُ فِي اللُّغَةِ عِبَارَةٌ عَنْ كُلِّ مَوْجُودٍ إمَّا حِسًّا كَالْأَجْسَامِ أَوْ حُكْمًا كَالْأَقْوَالِ»"
          source: "المصباح المنير"
      expands:
        - text: "«Thing; something; Affair, matter»"
          source: "Salomon"
          addition: "يشير إلى أن 'شيء' قد يستخدم بمعنى 'أمر' أو 'شأن' مما يبرر دخوله في السياق."
    - lemma: "حَادِثَة"
      confirm:
        - text: "«الحادثةُ: الحدث، ج حوادث.»"
          source: "المعجم الوسيط"
        - text: "«Event; news»"
          source: "Salomon"
    - lemma: "وَاقِعَة"
      confirm:
        - text: "«الوَاقِعَةُ: كلُّ مَا وقع من الأُمور، والجمعُ وَقائعُ.»"
          source: "المعجم الكبير"
        - text: "«fact»"
          source: "Arabterm"

stage3_analysis:
  per_lemma:
    - lemma: "حَدَث"
      decision: confirmed
      decision_reason: "هو اللفظ الأصيل والمباشر للدلالة على المفهوم، ويتطابق تماماً مع التعريف الإنجليزي والاشتقاق العربي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَدَث"
    - lemma: "أَمْر"
      decision: confirmed
      decision_reason: "مقبول كونه يطلق على الحادثة والخبر والشيء، وهو مستعمل بكثرة في سياق الأحداث (مثل 'أمرٌ ما أتى بك')."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَمْر"
    - lemma: "شَيْء"
      decision: confirmed
      decision_reason: "رغم كونه لفظاً عاماً للكيانات، إلا أنه يستخدم في العربية كلفظ مبهم للإشارة إلى حدث وقع (مثل 'حدث شيء'). إبقاؤه يعكس الشمولية في PWN."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَيْء"
    - lemma: "حَادِثَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف أساسي لـ 'حدث'، وتخصيصه للحدث المتجدد يجعله ركيزة في هذه المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حَادِثَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07304554-n"}
    - lemma: "وَاقِعَة"
      source: stage1
      decision: confirmed
      decision_reason: "من الأدلة اللغوية، يطلق على ما 'وقع' من الأمور، وهو لفظ فصيح يعبر عن تحقق الحدث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "وَاقِعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07304554-n"}

stage4_content:
  definition:
    current: "حدث ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ولا يفي بشروط التعريف المعجمي التي تميز الحدث بوقوعه في زمان ومكان."
    authored:
      - type: terminological
        text: "ما يَقَعُ ويَتَجَدَّدُ مِنَ الأُمُورِ في زَمَنٍ ومَكانٍ مُعَيَّنَيْنِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07304554-n", definition_index: 0, text: "ما يَقَعُ ويَتَجَدَّدُ مِنَ الأُمُورِ في زَمَنٍ ومَكانٍ مُعَيَّنَيْنِ."}
  examples:
    per_lemma:
      - lemma: "حَدَث"
        examples:
          - text: "شَهِدَتِ المَدِينَةُ حَدَثاً ثَقافِيّاً كَبِيراً جَذَبَ الزُّوَّارَ مِنْ كُلِّ مَكانٍ."
            type: usage
      - lemma: "حَادِثَة"
        examples:
          - text: "سَجَّلَ المُؤَرِّخُونَ هذه الحَادِثَةَ العَظِيمَةَ في كُتُبِهِمْ."
            type: usage
      - lemma: "وَاقِعَة"
        examples:
          - text: "كانَتْ وَاقِعَةُ بَدْرٍ فاصِلَةً في تَارِيخِ الإِسْلامِ."
            type: usage
            source: "تاريخي"
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-07304554-n", text: "شَهِدَ العالَمُ في القَرْنِ العِشْرِينَ أَحْداثاً كُبْرَى غَيَّرَتْ مَجْرَى التَّارِيخِ."}

stage5_enrichment:
  per_entry:
    - lemma: "حَدَث"
      entry_id: "{auto}"
      root: "حدث"
      maqayis_quote: "«الْحَاءُ وَالدَّالُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ كَوْنُ الشَّيْءِ لَمْ يَكُنْ. يُقَالُ حَدَثَ أَمْرٌ بَعْدَ أَنْ لَمْ يَكُنْ.»"
    - lemma: "أَمْر"
      entry_id: "{auto}"
      root: "أمر"
      maqayis_quote: "«الْهَمْزَةُ وَالْمِيمُ وَالرَّاءُ أُصُولٌ خَمْسَةٌ: الْأَمْرُ مِنَ الْأُمُورِ... قَوْلُهُمْ هَذَا أَمْرٌ رَضِيتُهُ.»"
    - lemma: "شَيْء"
      entry_id: "{auto}"
      root: "شأ"
      maqayis_quote: "«الشين والهمزة والياء ليس فيه كلامٌ كثير، إلا أنهم يقولون: شِئْتُ الشيءَ أشاؤه مَشيئةً. والشيءُ: واحد الأشياء.»"
    - lemma: "حَادِثَة"
      entry_id: "{auto}"
      root: "حدث"
      maqayis_quote: "«الْحَاءُ وَالدَّالُ وَالثَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ كَوْنُ الشَّيْءِ لَمْ يَكُنْ.»"
    - lemma: "وَاقِعَة"
      entry_id: "{auto}"
      root: "وقع"
      maqayis_quote: "«الْوَاوُ وَالْقَافُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَرْجِعُ إِلَيْهِ فُرُوعُهُ، يَدُلُّ عَلَى سُقُوطِ شَيْءٍ. يُقَالُ: وَقَعَ الشَّيْءُ وُقُوعًا فَهُوَ وَاقِعٌ.»"
  per_sense:
    - lemma: "حَدَث"
      sense_id: "{auto}"
      nuance: "اللفظ العام والأكثر دقة للدلالة على المفهوم المجرد للوقوع."
      mwe: false
    - lemma: "أَمْر"
      sense_id: "{auto}"
      nuance: "يركز على الحدث كشأن أو موضوع ذي بال، ويستخدم غالباً في السياقات العامة."
      mwe: false
    - lemma: "شَيْء"
      sense_id: "{auto}"
      nuance: "أكثر الألفاظ تجريداً، يستخدم للإشارة المبهمة إلى حدث ما دون تخصيص نوعه."
      mwe: false
    - lemma: "حَادِثَة"
      sense_id: "{auto}"
      nuance: "تؤكد على فردية الحدث وكونه واقعة محددة ذات تفاصيل ملموسة."
      mwe: false
    - lemma: "وَاقِعَة"
      sense_id: "{auto}"
      nuance: "تضفي صبغة تاريخية أو أهمية بالغة على الحدث، وترتبط بفعل 'الوقوع' المادي أو المعنوي."
