    # ── اللمّات الموجودة ──
    - lemma: "باراسيكولوجيا"
      confirm:
        - text: "«الباراسيكولوجيا: فرع من علم النفس يبحث في الظواهر التي لا يمكن تفسيرها بالنواميس الطبيعية [كالتخاطر telepathy].»"
          source: "المورد الحديث (2008)"
        - text: "«الباراسيكولوجيا — translation_en: parapsychology»"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "ظواهر نفسية خارقة"
      expands:
        - text: "«(2) ظواهر نَفْسية.» — ضمن مدخل psychic"
          source: "المورد الحديث (2008)"
          addition: "المورد يستعمل «ظواهر نفسية» فقط (كلمتان) دون «خارقة»، مما يشير إلى أن الصيغة الثلاثية ليست مصطلحاً ثابتاً"
        - text: "«خارق: مُتَعَذِّرٌ تعليلُهُ علميًّا.» — ترجمة paranormal"
          source: "المورد الحديث (2008)"
          addition: "«خارق» صفة عامة تعني paranormal وليست جزءاً مسكوكاً من تعبير «ظواهر نفسية خارقة»"

    # ── مرشحات المرحلة ١ ──
