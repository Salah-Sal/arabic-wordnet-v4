    - lemma: "ظَوَاهِرُ نَفْسِيَّةٌ"
      confirm:
        - text: "«(2) ظواهر نَفْسية.» — ضمن مدخل psychic"
          source: "المورد الحديث (2008)"
        - text: "«مجموعة من الظواهر النفسية يتم فيها إدراك أشياء بعيدة عن مجال الحواس المعروفة، كالتخاطر مثلا.» — ضمن مدخل إدراك فوق حسي"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"

    - lemma: "خَوَارِقُ ذِهْنِيَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "بَارَاسِيكُولُوجِيَا"
      confirm:
