stage1_review:
  assessment:
    concerns:
      - "اللمّة «ظواهر نفسية خارقة» عبارة وصفية حرة من ثلاث كلمات وليست مصطلحاً مسكوكاً؛ تفشل في اختبار السكّ (يمكن إبدال «خارقة» بـ«غريبة» أو «عجيبة» ويبقى التعبير صالحاً)"
      - "اللمّة «باراسيكولوجيا» بدون تشكيل"
      - "المجموعة تخلط بين المفهوم (الظواهر) والحقل المعرفي (علم النفس الغيبي) في مجموعة ترادفية واحدة، تبعاً لـ OEWN"
    observations: "المفهوم يدور حول ظواهر يُزعَم أنها تتجاوز القوانين الفيزيائية وتُنسَب إلى تأثير العمليات العقلية، كالتخاطر والاستبصار. الفائق الأعلى (hypernym) هو «تواصل خارق»، مما يُرسِّخ المفهوم في حقل الخوارق والغيبيات. في التراث العربي يُقابَل هذا المفهوم بمصطلحات مثل «الكشف» و«الكرامات» و«الخوارق»، لكنها تحمل دلالات دينية وصوفية. المصطلح الحديث المعتمد في المعاجم العلمية العربية هو «باراسيكولوجيا» (تعريب) و«علم النفس الغيبي» (ترجمة وضعية)."

  blind_candidates:
    - lemma: "عِلْمُ النَّفْسِ الغَيْبِيُّ"
      generation_method: tarkib
      justification: "مركب إضافي-وصفي يقابل parapsychology؛ «علم النفس» للحقل الأساسي و«الغيبي» نسبة إلى الغيب للتعبير عن ما يتجاوز الحسّ المادي. مصطلح مستعمل في مسارد المنظمة العربية (أليكسو)."
    - lemma: "ظَوَاهِرُ نَفْسِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي يقابل psychic phenomena مباشرة؛ «ظواهر» جمع ظاهرة، و«نفسية» نسبة إلى النفس بمعنى القوة العقلية/الروحية. ورد في المورد الحديث ترجمةً لـ psychic."
    - lemma: "خَوَارِقُ ذِهْنِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «خوارق» (جمع خارقة: ما يخرق العادة) و«ذهنية» (نسبة إلى الذهن). يجمع بين فكرة مخالفة القوانين الطبيعية والسببية العقلية."
    - lemma: "بَارَاسِيكُولُوجِيَا"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الأجنبي parapsychology، وهو الملاذ الأخير لكنه الأكثر تداولاً في المعاجم الطبية والنفسية العربية المعاصرة."


stage2_evidence:
