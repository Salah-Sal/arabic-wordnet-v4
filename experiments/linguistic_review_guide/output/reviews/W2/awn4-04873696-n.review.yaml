stage1_review:
  assessment:
    concerns:
      - "خَوَر قد يُفهم منه الضعف البدني أو الوهن العام؛ لذا يحتاج إلى تقييد سياقي ليدل على نقص العزيمة."
      - "اللمّات الحالية تفتقر إلى التشكيل الكامل."
    observations: "المفهوم يعبر عن خصلة نفسية (trait) وليس مجرد فعل التردد اللحظي. الجذور العربية (ر-د-د، خ-و-ر، ح-ي-ر، ذ-ب-ذ-ب) غنية بالألفاظ التي تغطي جوانب هذا المفهوم من حيث التكرار، والضعف، والاضطراب، والتذبذب."
  blind_candidates:
    - lemma: "تَرَدُّد"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من فعل 'تردد'، وهو اللفظ الأكثر شيوعاً للتعبير عن الحيرة بين رأيين أو عدم القدرة على الحسم."
    - lemma: "خَوَر"
      generation_method: ishtiqaq
      justification: "يدل في أصله على الضعف والوهن، ويُستخدم استعارةً لضعف العزيمة والافتقار إلى ثبات القصد (خارت عزيمته)."
    - lemma: "تَذَبْذُب"
      generation_method: ishtiqaq
      justification: "يعبر عن الحركة بين طرفين والاضطراب، ويُطلق على الشخص الذي لا يستقر على رأي."
    - lemma: "حَيْرَة"
      generation_method: ishtiqaq
      justification: "تعبر عن حالة التردد والاضطراب التي تنشأ عن تعارض الأدلة أو إشكال الأمر."

stage2_evidence:
  per_lemma:
    - lemma: "تَرَدُّد"
      confirm:
        - text: "«تَرَدُّد؛ حَيْرة.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الْحيرَة) التَّرَدُّد وَالِاضْطِرَاب»"
          source: "المعجم الوسيط"
    - lemma: "خَوَر"
      confirm:
        - text: "«خارت عزيمته: ضعفت هِمّته- خائر النَّفس: واهن العزيمة.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«والخَوَرُ: الرَّخاوَةُ في كل شَيْءٍ... والخَوّارُ: الضَّعيفُ.»"
          source: "المحيط في اللغة"
    - lemma: "حَيْرَة"
      confirm:
        - text: "«الحَيْرَةُ: مَا ينشأ عَن تعَارض الْأَدِلَّة.»"
          source: "معجم مقاليد العلوم"
        - text: "«الحيرة: حالة الحيران، وهو الذي لا يهتدي إلى الصواب لإشكال الأمر عليه.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "تَذَبْذُب"
      confirm:
        - text: "«الرجل المذبذب: المتردد بين أمرين.»"
          source: "مقاييس اللغة"
    - lemma: "ضَعْفُ العَزِيمَة"
      confirm:
        - text: "«خائر النَّفس: واهن العزيمة.»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "تَرَدُّد"
      decision: confirmed
      decision_reason: "هو اللفظ الأساسي والمعياري للتعبير عن الافتقار لثبات الغرض في اللغة المعاصرة، وتؤيده المعاجم الحديثة كمقابل لـ irresolution."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرَدُّد"
    - lemma: "خَوَر"
      decision: confirmed
      decision_reason: "لفظ تراثي أصيل يعبر عن ضعف النفس ووهن العزيمة، وهو مناسب جداً لوصف 'السمة' (trait) التي تفتقر للصلابة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَوَر"
    - lemma: "حَيْرَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن الجانب المعرفي والنفسي من التردد، حيث يضطرب المرء لعدم اهتدائه للصواب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حَيْرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَذَبْذُب"
      source: stage1
      decision: confirmed
      decision_reason: "يعكس حالة التأرجح وعدم الاستقرار على موقف، وهو وصف دقيق للشخص 'مفتقر الثبات'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَذَبْذُب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ضَعْفُ العَزِيمَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير مركب دقيق جداً في وصف الحالة، وهو المقابل الحرفي والأكثر دقة لـ (lack of firmness of purpose)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "ضَعْفُ العَزِيمَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "سمة كون المرء متردداً؛ يفتقر إلى ثبات الغرض"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب ويميل للترجمة الحرفية؛ يفضل صياغته بأسلوب معجمي يوضح كونه سمة نفسية."
    authored:
      - type: terminological
        text: "خَصْلَةٌ نَفْسِيَّةٌ تَتَمَثَّلُ فِي ضَعْفِ العَزِيمَةِ وَالتَّرَدُّدِ بَيْنَ الخِيَارَاتِ، وَالافْتِقَارِ إِلَى الثَّبَاتِ فِي اتِّخَاذِ القَرَارِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "خَصْلَةٌ نَفْسِيَّةٌ تَتَمَثَّلُ فِي ضَعْفِ العَزِيمَةِ وَالتَّرَدُّدِ بَيْنَ الخِيَارَاتِ، وَالافْتِقَارِ إِلَى الثَّبَاتِ فِي اتِّخَاذِ القَرَارِ."}
  examples:
    per_lemma:
      - lemma: "تَرَدُّد"
        examples:
          - text: "كَانَ تَرَدُّدُهُ فِي اتِّخَاذِ القَرَارِ سَبَبًا فِي ضِيَاعِ الفُرْصَةِ."
            type: usage
      - lemma: "خَوَر"
        examples:
          - text: "أَصَابَهُ الخَوَرُ أَمَامَ التَّحَدِّيَاتِ فَتَرَاجَعَ عَنْ مَشْرُوعِهِ."
            type: usage
      - lemma: "حَيْرَة"
        examples:
          - text: "وَقَعَ فِي حَيْرَةٍ مِنْ أَمْرِهِ فَلَمْ يَدْرِ أَيَّ الطَّرِيقَيْنِ يَسْلُكُ."
            type: usage
      - lemma: "تَذَبْذُب"
        examples:
          - text: "عُرِفَ بِتَذَبْذُبِهِ فِي مَوَاقِفِهِ السِّيَاسِيَّةِ وَعَدَمِ اسْتِقْرَارِهِ عَلَى رَأْيٍ."
            type: usage
      - lemma: "ضَعْفُ العَزِيمَة"
        examples:
          - text: "يُعَانِي بَعْضُ النَّاسِ مِنْ ضَعْفِ العَزِيمَةِ عِنْدَ مُوَاجَهَةِ الصِّعَابِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يَتَّصِفُ المَرءُ بِالتَّرَدُّدِ حِينَ يَعجَزُ عَنِ المضيِّ قُدُمًا فِي مَقاصِدِه."}

stage5_enrichment:
  per_entry:
    - lemma: "تَرَدُّد"
      entry_id: "{auto}"
      root: "ردد"
      maqayis_quote: "«الراء والدال أصل واحد مطرد منقاس، وهو رجع الشيء. تقول: رددت الشيء أرده ردا.»"
    - lemma: "خَوَر"
      entry_id: "{auto}"
      root: "خور"
      maqayis_quote: "«الخاء والواو والراء أصلان: أحدهما يدل على صوت، والآخر على ضعف. فأما الآخر فالخوار: الضعيف من كل شيء.»"
    - lemma: "حَيْرَة"
      entry_id: "{auto}"
      root: "حير"
      maqayis_quote: "«الحاء والياء والراء أصل واحد، وهو التردد في الشيء. من ذلك الحيرة، وقد حار في الأمر يحير.»"
    - lemma: "تَذَبْذُب"
      entry_id: "{auto}"
      root: "ذب"
      maqayis_quote: "«الرجل المذبذب: المتردد بين أمرين. والذبذب: نوس الشيء المعلق في الهواء.»"
    - lemma: "ضَعْفُ العَزِيمَة"
      entry_id: "{auto}"
      roots:
        - word: "ضعف"
          root: "ضعف"
          maqayis_quote: "«الضاد والعين والفاء أصل واحد يدل على خلاف القوة.»"
        - word: "العزيمة"
          root: "عزم"
          maqayis_quote: "«العين والزاي والميم أصل صحيح واحد، يدل على الصريمة والقطع. يقال عزمت على كذا، إذا قطعت عليه.»"
  per_sense:
    - lemma: "تَرَدُّد"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشائع لعدم القدرة على الحسم."
      mwe: false
    - lemma: "خَوَر"
      sense_id: "{auto}"
      nuance: "يوحي بضعف في الإرادة أو انكسار في العزيمة."
      mwe: false
    - lemma: "حَيْرَة"
      sense_id: "{auto}"
      nuance: "تركز على الجانب الذهني والارتباك أمام الخيارات."
      mwe: false
    - lemma: "تَذَبْذُب"
      sense_id: "{auto}"
      nuance: "توحي بالتقلب وعدم الاستقرار على حال واحدة."
      mwe: false
    - lemma: "ضَعْفُ العَزِيمَة"
      sense_id: "{auto}"
      nuance: "وصف مباشر لنقص القوة في التصميم والإرادة."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ردد","maqayis":"«الراء والدال أصل واحد مطرد منقاس، وهو رجع الشيء...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"خور","maqayis":"«الخاء والواو والراء أصلان... والآخر على ضعف. فأما الآخر فالخوار: الضعيف من كل شيء.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ العام والشائع لعدم القدرة على الحسم.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
