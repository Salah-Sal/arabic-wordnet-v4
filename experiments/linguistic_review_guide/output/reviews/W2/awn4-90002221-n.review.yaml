    concerns:
      - "اللمّة الأولى «بْرُومَانس» تبدأ بحرف ساكن (بْ بالسكون) وهذا مستحيل في أوائل الكلمات العربية — يجب تصحيحها إلى «بُرُومَانْس»"
      - "اللمّة الثانية «صَدَاقَة رُجُولِيَّة حَمِيمَة» عبارة وصفية حرة لا تجتاز اختبار السكّ: يمكن إبدال «رُجُولِيَّة» بـ«نِسَائِيَّة» أو «إِنْسَانِيَّة» ويبقى التعبير صالحاً كوصف، مما يدل على أنه ليس مصطلحاً مسكوكاً"
      - "المجموعة تفتقر إلى مصطلح عربي أصيل مسكوك يعبّر عن هذا المفهوم"
      - "التعريف الحالي يستخدم «مكثفة» وهو غير دارج في أسلوب المعجم؛ «حَمِيمَة» أو «وَطِيدَة» أنسب"
    observations: >
      المفهوم المقصود هو «البْرُومَانْس» (bromance)، وهو مصطلح إنجليزي حديث نشأ في الثقافة الشعبية الغربية
      مطلع الألفية الثالثة. يصف علاقة بين رجلين تجمع بين حميمية العلاقات الرومانسية ونقاء الصداقة،
      دون أن تتجاوز حدود الجنس. في التراث العربي، كانت الصداقة الوطيدة بين الرجال مُحتفى بها
      بصورة طبيعية في الأدب والشعر والتصوف، ومن أبلغ ما أُثر في ذلك علاقة الأخوّة الروحية بين
      الصحابة رضوان الله عليهم، وعلاقات الأصفياء في الشعر الجاهلي. المشكلة ليست في غياب المفهوم
      من الثقافة العربية بل في غياب مصطلح حديث مخصوص يحمل الدلالة الفارقة لـ«البرومانس» مقابل
      الصداقة العادية.

  blind_candidates:
    - lemma: "الخُلَّة"
      generation_method: majaz
      justification: >
        «الخُلَّة» في التراث العربي أعلى درجات المودة الصافية التي «تخلّلت القلب فصارت خلاله»
        (المعجم الوسيط). سُمّي إبراهيم عليه السلام «خليل الله»، ونهى النبي صلى الله عليه وسلم
        عن اتخاذ خليل إلا الله. هذه الدلالة الكلاسيكية لعلاقة حميمة صافية غير جنسية بين اثنين
        تتطابق وظيفياً مع دلالة «البرومانس»، فالمجاز الدلالي قائم على التشابه الوظيفي والعاطفي.
        اللفظ ميّت في استخدامه الاصطلاحي المخصوص الآن، مما يتيح إحياءه دون اشتراك لفظي ضارّ.

    - lemma: "التَّصَادُق"
      generation_method: ishtiqaq
      justification: >
        مصدر صياغي على وزن «تَفَاعُل» من جذر «ص د ق»، والوزن يدل على المشاركة والتبادل بين
        طرفين. «تصادق الرجلان» وردت في المعجم الكبير بمعنى «تصاحبا وتوادّا»، فالمصدر «التصادق»
        يعبّر عن الحالة التي يعيشها الرجلان معاً من صداقة متبادلة مكثّفة. الاشتقاق من «الصدق
        في المودة» (ابن فارس) يُحكم الربط المعنوي.

    - lemma: "الأُخُوَّة الحَمِيمَة"
      generation_method: tarkib
      justification: >
        مركب وصفي إضافي من «الأخوة» (الصلة بين الأخوين بالقرابة أو بالصداقة — المعجم الكبير)
        + «الحميمة» (الوطيدة القريبة من القلب). وردت «الأخوة الحميمة» في كتابات الأدباء العرب
        المعاصرين للدلالة على الرابط العاطفي الوثيق بين الرجال.

    - lemma: "المُؤَاخَاة الوَطِيدَة"
      generation_method: tarkib
      justification: >
        مركب وصفي إضافي من «المؤاخاة» (عملية التأخي وإقامة رابطة الأخوّة) + «الوطيدة» (الراسخة
        الثابتة). «المؤاخاة» مصدر أكثر تخصيصاً من «الأخوة» لأنه يتضمن فعل الاختيار الإرادي
        للعلاقة لا القرابة الدموية، مما يناسب طبيعة «البرومانس» كصداقة مختارة ووثيقة.


