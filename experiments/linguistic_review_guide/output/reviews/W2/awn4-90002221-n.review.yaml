        فإنه يُمثّل الاستخدام العربي الفعلي المنتشر في الإعلام الرقمي والصحافة الثقافية العربية
        المعاصرة. وبما أن المفهوم ذاته مفهوم إنجليزي المنشأ ولا يُعدّ جزءاً من التراث العربي
        الأصيل، فإن التعريب هنا مقبول بوصفه ملاذاً أخيراً (تاريخياً المرتبة الرابعة في سلم التوليد).
        غير أن الضبط الحالي «بْرُومَانَس» (بالسكون على الباء) غير صحيح لغوياً إذ لا تبدأ الكلمة
