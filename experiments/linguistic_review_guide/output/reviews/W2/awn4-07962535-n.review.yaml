# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07962535-n
# deaf — الصُّمّ
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «صم» خالية من التشكيل، والصواب «صُمّ» بضمّ الصاد وتشديد الميم"
      - "المجموعة تضمّ لمّة واحدة فقط، وهي جمع تكسير لـ«أَصَمّ»؛ قد يكون من المفيد إثراؤها بصيغ أخرى"
      - "التعريف العربي وصفي أكثر من اللازم ويُشبه ترجمة حرفية للإنجليزي"
    observations: "المجموعة تمثّل مفهوم «الصُّمّ» بوصفهم جماعة من الناس، وهو مفهوم أصيل في اللغة العربية وردت فيه آيات قرآنية متعددة (البقرة ١٨، الأنعام ٣٩، الأنفال ٢٢). اللمّة «صُمّ» هي جمع تكسير لـ«أَصَمّ» على وزن فُعْل، وهو الجمع الأكثر شيوعاً واستعمالاً. يوجد جمع آخر «صُمَّان» لكنه أقلّ تداولاً ويلتبس بالاسم الجغرافي «الصَّمّان»."
  blind_candidates:
    - lemma: "صُمّ"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«أَصَمّ» على وزن فُعْل، وهو الجمع القياسي لأفعل الصفة. استعمال قرآني متكرر: {صُمٌّ بُكْمٌ عُمْيٌ} (البقرة ١٨). أنسب لفظ للدلالة على جماعة فاقدي السمع."
    - lemma: "صُمَّان"
      generation_method: ishtiqaq
      justification: "جمع آخر لـ«أَصَمّ» على وزن فُعْلان، ذكره المعجم الوسيط. أقلّ شيوعاً من «صُمّ» لكنه وارد في النصوص الكلاسيكية."
    - lemma: "فَاقِدُو السَّمْع"
      generation_method: tarkib
      justification: "مركب إضافيّ يصف الأشخاص الذين فقدوا حاسّة السمع. يُستعمل في السياقات الطبية والرسمية المعاصرة."
    - lemma: "ضِعَاف السَّمْع"
      generation_method: tarkib
      justification: "مركب إضافيّ شائع في الخطاب الإعلامي والطبي المعاصر، يدلّ على من يعانون ضعفاً في السمع."

stage2_evidence:
  per_lemma:
    - lemma: "صُمّ"
      confirm:
        - text: "«(الْأَصَم) ذُو الصمم وَالَّذِي لَا يطْمع فِيهِ وَلَا يرد عَن هَوَاهُ والصلب المصمت... وَهِي صماء... (ج) صم وصمان»"
          source: "المعجم الوسيط"
        - text: "«من فُقِدَ حاسة السمع مَنْ لا يُطْمَعُ فيه, ولا يُرَدُّ عن هَواهُ؛ كأنه يُنادَى فلا يَسمَعُ»"
          source: "المعجم الكبير"
        - text: "«أَصَم [ج:صُمّ]» — deaf"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تواصُل الصُّم — تقنية التواصل بالإشارة مع الصُّم»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«أبجديّة الصُّمّ البُكم»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الصَّادُ وَالْمِيمُ أَصْلٌ يَدُلُّ عَلَى تَضَامِّ الشِّيءِ وَزَوَالِ الْخَرْقِ وَالسَّمِّ. مِنْ ذَلِكَ الصَّمَمُ فِي الْأُذُنِ. يُقَالُ صَمِمْتُ، وَأَنْتَ تَصَمُّ صَمَمًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الجذري يدلّ على انسداد المنفذ، والصمم في الأذن فرع من هذا المعنى"
        - text: "«مجموعة الصُّم، مجتمع الصُّم» — deaf population; deaf community"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "يُثبت استعمال «الصُّمّ» بوصفه مصطلحاً جماعياً للدلالة على فئة اجتماعية"

    - lemma: "صُمَّان"
      confirm:
        - text: "«(ج) صم وصمان»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الصَّمّانُ: بالفتح ثم التشديد، وآخره نون... الصمّان أرض غليظة دون الجبل»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "التباس مع اسم المكان «الصَّمَّان» وهو موضع مشهور في أرض تميم"

    - lemma: "فَاقِدُو السَّمْع"
      expands:
        - text: "«فاقد خاصية السمع أو من عنده تصور فيها» (مدخل: أصم)"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "التعريف الطبي يستعمل تركيب «فاقد السمع» في شرح أَصَمّ، لكن لم يُسجَّل «فاقدو السمع» مدخلاً مستقلاً"

    - lemma: "ضِعَاف السَّمْع"
      expands:
        - text: "«آلة يضعها ضعاف السمع على الأذن للسماع» (مدخل: مَسْمَعة)"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "ورد التركيب عَرَضاً في تعريف مدخل آخر، ولم يُسجَّل مدخلاً مستقلاً. كما أنّ «ضعاف السمع» يدلّ على ضعف جزئيّ لا فقدان تامّ"

stage3_analysis:
  per_lemma:
    - lemma: "صُمّ"
      decision: confirmed
      decision_reason: "جمع تكسير قياسيّ لـ«أَصَمّ» على وزن فُعْل، مُثبت في المعجم الوسيط والمعجم الكبير والمعجم الطبي الموحد، واستعمال قرآنيّ راسخ. هو أنسب لفظ عربي للدلالة على جماعة فاقدي السمع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صُمّ"

    - lemma: "صُمَّان"
      source: stage1
      decision: removed
      decision_reason: "وإن كان جمعاً صحيحاً لـ«أَصَمّ» مذكوراً في المعجم الوسيط، إلّا أنه نادر الاستعمال في الدلالة على فئة الأشخاص، ويلتبس بالاسم الجغرافي «الصَّمّان». لا يُضيف قيمة تمييزية على «صُمّ»."

    - lemma: "فَاقِدُو السَّمْع"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفيّ حرّ وليس مصطلحاً مسكوكاً. يمكن إبدال «فاقدو» بـ«عديمو» أو «محرومو» دون تغيّر الدلالة (أخفق في اختبار السكّ). لم يُسجَّل مدخلاً مستقلاً في أي معجم."

    - lemma: "ضِعَاف السَّمْع"
      source: stage1
      decision: removed
      decision_reason: "دلالياً يختلف عن مفهوم المجموعة: «ضعاف السمع» يشير إلى الضعف الجزئي (hard of hearing)، بينما المجموعة تعني فقدان السمع الشديد (deaf). كما أنه تركيب وصفي حرّ لا مصطلح ثابت."

