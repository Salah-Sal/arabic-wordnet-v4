    assessment:
      decision: revise
      reason: "التعريف الحالي وصفيّ وقريب من الترجمة الحرفية. يحتاج إلى صياغة معجمية بأسلوب الجنس القريب والفصل النوعي."
    authored:
      - type: terminological
