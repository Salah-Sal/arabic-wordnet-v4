# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «إبراء ذمة» تعبير إضافي فضفاض يدلّ على فعل الإبراء لا على الوثيقة ذاتها"
      - "ينقص المجموعة مصطلح «براءة ذمة» المُثبت في معاجم التجارة والمحاسبة بمعنى acquittance"
    observations: "المفهوم ينتمي إلى الحقل القانوني-التجاري، ويدور حول وثيقة تشهد بسداد الدين أو الإعفاء من الالتزام. في العربية يوجد مصطلح راسخ هو «مخالصة» عرّفه المعجم الوسيط تعريفاً مطابقاً. المصطلح الثاني «إبراء ذمة» شائع في اللغة القانونية المعاصرة. المفهوم له تعبير عربي طبيعي."
  blind_candidates:
    - lemma: "بَرَاءَة"
      generation_method: ishtiqaq
      justification: "من الجذر ب ر أ على وزن فَعَالَة، بمعنى التخلّص والتباعد من الشيء. يُستعمل بمعنى الخلوص من التهمة أو العيب، لكنه أعمّ من الوثيقة المخصوصة."
    - lemma: "تَخْلِيصَة"
      generation_method: ishtiqaq
      justification: "من الجذر خ ل ص على وزن تَفْعِلَة، بمعنى وثيقة التخليص أو التنقية من الالتزام. وزن تَفْعِلَة يناسب المرّة من الفعل."
    - lemma: "إِعْفَاء"
      generation_method: ishtiqaq
      justification: "مصدر أَعْفَى من الجذر ع ف و، بمعنى رفع التكليف أو الالتزام. يُستعمل في السياق القانوني والإداري."
    - lemma: "صَكّ بَرَاءَة"
      generation_method: tarkib
      justification: "مركب إضافي من صَكّ (وثيقة رسمية) + بَرَاءَة (تخلّص من التزام). يجمع بين الدلالة على الوثيقة والدلالة على الإعفاء."

stage2_evidence:
  per_lemma:
    - lemma: "إِبْرَاء ذِمَّة"
      confirm:
        - text: "«مخالصة، إبراء ذمة» — ترجمة quittance"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«مخالصة، إبراء، تنازل عن حق» — ترجمة quit claim"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«(1) «أ» إبراء من دَين أو التزام. «ب» سند الإبراء أو المخالصة (2) تعويض.» — ترجمة quittance"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«إبراء» — ترجمة receipt in full"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "الإبراء وحده (بدون ذمة) يدلّ على الاستلام الكامل في المجال القانوني"
        - text: "«إبراء من دين» — ترجمة remission of a debt"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "صيغة بديلة: إبراء من دين بدل إبراء ذمة"

    - lemma: "مُخَالَصَة"
      confirm:
        - text: "«(المخالصة) صكٌّ يعترف فيه الدائنُ ببراءة ذمة المدين (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«(المخالصة) صك يعْتَرف فِيهِ الدَّائِن بِبَرَاءَة ذمَّة الْمَدِين (محدثة)»"
          source: "المعجم الوسيط (حرماني)"
        - text: "«المُخالَصَةُ: صَكٌّ يَعْتَرِفُ فيه الدَّائِنُ»"
          source: "المعجم الكبير"
        - text: "«ايصال، مخالصة» — ترجمة receipt"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«كُشوفُ مُخالَصَة» — ترجمة acquittance rolls"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "بَرَاءَة"
      contradicts:
        - text: "«(الْبَرَاءَة) الْإِعْذَار والإنذار ... (بَرَاءَة الاختراع) شَهَادَة تُعْطى للمخترع ... (بَرَاءَة الِاعْتِمَاد) الْأَمر الصَّادِر من الدولة»"
          source: "المعجم الوسيط"
          conflict: "البراءة في الوسيط تُستعمل في معانٍ أخرى (إعذار، اختراع، اعتماد) لا في سياق الإعفاء من الدين كوثيقة مخصوصة"
      expands:
        - text: "«البَراءَةُ: حجَّة يبذلها الجهبذ أو الخازن للمؤدي بِمَا يُؤَدِّي إِلَيْهِ»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "عند السيوطي البراءة حجة (وثيقة) يمنحها الصراف للمؤدي، وهي أقرب للإيصال"
        - text: "«براءة ذمة» — ترجمة acquittance"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "المركب «براءة ذمة» مُثبت بمعنى المخالصة في معجم التجارة"

    - lemma: "تَخْلِيصَة"
      evidence_status: "no_material_found"

    - lemma: "إِعْفَاء"
      contradicts:
        - text: "«إعفاء» — ترجمة exemption; exoneration"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الإعفاء يدلّ على فعل رفع التكليف لا على الوثيقة التي تشهد بذلك"
        - text: "«الإعفاء: الاندراس وذهاب الأثر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى التراثي بعيد تماماً عن مفهوم الوثيقة المالية"

    - lemma: "صَكّ بَرَاءَة"
      evidence_status: "no_material_found"

    - lemma: "بَرَاءَة ذِمَّة"
      confirm:
        - text: "«براءة ذمة» — ترجمة acquittance"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«تبرئة — يقصد بها ... مدنيا براءة الذمة فتحصل بعد الوفاء بما كان من التزامات كالدين وما شابه»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "التبرئة في الجانب المدني تعني براءة الذمة"

stage3_analysis:
  per_lemma:
    - lemma: "إِبْرَاء ذِمَّة"
      decision: confirmed
      decision_reason: "مصطلح مُثبت في المعجم الموحد لمصطلحات القانون (2017) كترجمة مباشرة لـ quittance مقروناً بالمخالصة، وشائع في اللغة القانونية والتجارية المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على الجانب الفعلي — فعل تحرير الذمة من الالتزام — ويُستعمل غالباً في السياق القانوني الرسمي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِبْرَاء ذِمَّة"

    - lemma: "مُخَالَصَة"
      decision: confirmed
      decision_reason: "معرَّف في المعجم الوسيط والمعجم الكبير تعريفاً مطابقاً تماماً لمفهوم المجموعة: «صكٌّ يعترف فيه الدائنُ ببراءة ذمة المدين». هذه أدق لمّة في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الوثيقة المادية (الصكّ) ذاتها، وهو مصطلح محدَث مُعتمد من مجمع اللغة العربية، أكثر تحديداً من إبراء ذمة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَالَصَة"

    - lemma: "بَرَاءَة"
      source: stage1
      decision: removed
      decision_reason: "البراءة لفظ مشترك يحمل دلالات كثيرة (إعذار، اختراع، اعتماد) ولا يتخصص في وثيقة الإعفاء من الدين. وجود «مخالصة» و«إبراء ذمة» يُغني عنه."

    - lemma: "تَخْلِيصَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي لهذه الصيغة. لفظة مبتدعة غير مُثبتة."

    - lemma: "إِعْفَاء"
      source: stage1
      decision: removed
      decision_reason: "الإعفاء يدلّ على فعل رفع الالتزام (exemption) لا على الوثيقة الشاهدة بذلك. اختلاف في المرجع الدلالي: الحدث مقابل الوثيقة."

    - lemma: "صَكّ بَرَاءَة"
      source: stage1
      decision: removed
      decision_reason: "مركب غير مسكوك ولا مُثبت في أي معجم. يمكن إبدال «براءة» بمرادفاتها (صكّ إعفاء، صكّ تبرئة) فهو عبارة وصفية حرة لا مصطلح."

    - lemma: "بَرَاءَة ذِمَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مُثبت في المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) كترجمة لـ acquittance. مركب إضافي ثابت قريب دلالياً من «إبراء ذمة» لكن يركّز على حالة الخلوص لا على فعل الإبراء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدلّ على حالة خلوص الذمة من الدين، بينما «إبراء ذمة» يدلّ على فعل التحرير. براءة (اسم) مقابل إبراء (مصدر)."
      actions:
        - command: create_entry
          params: {lemma: "بَرَاءَة ذِمَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

