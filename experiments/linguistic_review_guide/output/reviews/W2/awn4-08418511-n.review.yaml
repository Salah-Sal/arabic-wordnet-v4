stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائري حيث يعرّف الكلمة بنفسها (الزبائن)."
      - "المفهوم الإنجليزي يمثل اسم جمع (clientele)، بينما اللمات العربية (زبائن، عملاء) هي جموع تكسير تُستخدم دلالياً للتعبير عن هذا الجمع لغياب مصدر صناعي شائع."
    observations: "الجموع (زبائن) و(عملاء) تؤدي وظيفة المفهوم الجماعي (clientele) في اللغة العربية المعاصرة بشكل دقيق وواسع الانتشار، وتسد مسد عدم وجود كلمة مفردة تدل على القاعدة الكاملة للمتعاملين."
  blind_candidates:
    - lemma: "رُوَّاد"
      generation_method: majaz
      justification: "اسم فاعل مجازي من راد، يُستخدم للتعبير عن قاصدي المكان بانتظام."
    - lemma: "زُبَنَاء"
      generation_method: ishtiqaq
      justification: "جمع تكسير آخر لزَبُون، يُستخدم في بعض الأقطار العربية بدلاً من زبائن."
    - lemma: "مُتَعَامِلُون"
      generation_method: ishtiqaq
      justification: "مشتق من التفاعل والتعامل التجاري المستمر."
    - lemma: "جُمْهُور"
      generation_method: majaz
      justification: "استعارة من التجمع البشري لتدل على القاعدة الكلية للمشترين."

stage2_evidence:
  per_lemma:
    - lemma: "زبائن"
      confirm:
        - text: "«زبائن: customer; clientele»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«جماعة الزَّبائن: زبائن المَتْجَر أو الطبيب أو الفندق.»"
          source: "المورد الحديث"
    - lemma: "عملاء"
      confirm:
        - text: "«عملاء: clientele»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
    - lemma: "رُوَّاد"
      expands:
        - text: "«امرأةٌ رَوَّادٌ: رادة ... ريحٌ رَوَّادٌ: رادة»"
          source: "المعجم الوسيط"
          addition: "يستخدم المعجم الكلمة في سياق الحركة وكثرة الذهاب والمجيء، ولكن دلالتها المعاصرة تشمل قاصدي الأماكن العامة."
    - lemma: "زُبَنَاء"
      confirm:
        - text: "«زبائن، زبناء، نزلاء: Clientele»"
          source: "مسرد الفن، التسلية والرياضة (ArabTerm)"
    - lemma: "مُتَعَامِلُون"
      expands:
        - text: "«(العميل) من يُعَامل غَيره فِي شَأْن من الشؤون»"
          source: "المعجم الوسيط"
          addition: "المتعاملون هم من يقومون بالمعاملة ولكن اللفظة أقل تخصصاً في الدلالة على مفهوم (الزبائن)."
    - lemma: "جُمْهُور"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "زبائن"
      decision: confirmed
      decision_reason: "الجمع الأكثر شيوعاً للتعبير عن قاعدة المتعاملين والمشترين بشكل جماعي، ومثبت في المعاجم الحديثة للدلالة على المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَبَائِن"
    - lemma: "عملاء"
      decision: confirmed
      decision_reason: "مرادف شائع لـ(زبائن)، ويُستخدم بشكل خاص في قطاع الخدمات للدلالة على مجموعة المتعاملين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُمَلَاء"
    - lemma: "رُوَّاد"
      source: stage1
      decision: removed
      decision_reason: "الرواد عادة هم قاصدو الأماكن العامة كالمقاهي والمسارح، ولا يشترط فيهم الطابع التجاري أو الشرائي الذي يتضمنه المفهوم."
    - lemma: "زُبَنَاء"
      source: stage1
      decision: removed
      decision_reason: "صيغة جمع أخرى لزبون، لكن (زَبَائِن) أشهر وأكثر اطراداً في المعاجم واللغة المعاصرة."
    - lemma: "مُتَعَامِلُون"
      source: stage1
      decision: removed
      decision_reason: "مفهوم عام يشمل كل من يتعامل مع جهة معينة ولا يقتصر على المستهلكين أو الزبائن التجاريين."
    - lemma: "جُمْهُور"
      source: stage1
      decision: removed
      decision_reason: "الجمهور مصطلح عام يدل على الحشود ولا يدل بمفرده على الزبائن التجاريين إلا إذا أُضيف (جمهور المشترين)."

stage4_content:
  definition:
    current: "الزبائن بشكل جماعي"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري حيث يستخدم كلمة (الزبائن) لتعريف ذات المفهوم، ويجب صياغة تعريف مصطلحي دقيق يشرح المفهوم الجماعي للعملاء."
    authored:
      - type: terminological
        text: "مجموعة من الأشخاص الذين يتعاملون بانتظام مع مؤسسة أو جهة تجارية للحصول على سلع أو خدمات."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة من الأشخاص الذين يتعاملون بانتظام مع مؤسسة أو جهة تجارية للحصول على سلع أو خدمات."
  examples:
    per_lemma:
      - lemma: "زَبَائِن"
        examples:
          - text: "يحظى المتجر بقاعدة واسعة من الزبائن بفضل جودة منتجاته."
            type: usage
      - lemma: "عُمَلَاء"
        examples:
          - text: "تقدم الشركة خدمات مميزة للحفاظ على ولاء العملاء."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يحظى المتجر بقاعدة واسعة من الزبائن بفضل جودة منتجاته."
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تقدم الشركة خدمات مميزة للحفاظ على ولاء العملاء."

