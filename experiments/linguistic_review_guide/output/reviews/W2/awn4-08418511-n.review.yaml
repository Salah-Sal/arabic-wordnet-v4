  per_entry:
    - lemma: "زَبَائِن"
      entry_id: "{auto}"
      root: "زبن"
      maqayis_quote: "«الزَّاءُ وَالْبَاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الدَّفْعِ. يُقَالُ نَاقَةٌ زَبُونٌ، إِذَا زَبَنَتْ حَالِبَهَا.»"
