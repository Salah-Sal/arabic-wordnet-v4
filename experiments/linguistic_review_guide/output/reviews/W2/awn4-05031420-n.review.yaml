# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-05031420-n (mass)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «كتلة» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط — يُستحسن إثراؤها بمرادفات إن وُجدت"
    observations: >
      المفهوم هو الكتلة بمعناها الفيزيائي: الخاصية التي تُكسِب الجسمَ وزناً في حقل
      الجاذبية. هذا مصطلح علمي راسخ في الفيزياء العربية. التعريف العربي الحالي مقبول
      لكنه ترجمة شبه حرفية للتعريف الإنجليزي. اللمّة «كتلة» هي المصطلح المعتمد في
      جميع المعجمات العلمية العربية الموحّدة (فيزياء، كيمياء، هندسة).
  blind_candidates:
    - lemma: "كُتْلَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «كتل» الدالّ على التجمّع، على وزن فُعْلة. المصطلح الفيزيائي
        المعتمد في المعجمات العلمية العربية لترجمة mass.
    - lemma: "جِرْم"
      generation_method: majaz
      justification: >
        الجِرْم في الأصل: الجسد والبدن، ثم توسّع استعماله ليدلّ على الأجرام السماوية.
        يمكن توظيفه مجازاً للدلالة على مقدار المادة في الجسم.
    - lemma: "ثِقَل"
      generation_method: majaz
      justification: >
        من الجذر «ثقل» الدالّ على ضدّ الخفّة. إزاحة دلالية من الثقل الحسّي إلى
        الخاصية الفيزيائية المسبّبة للوزن.
    - lemma: "زَخْم"
      generation_method: ishtiqaq
      justification: >
        من الجذر «زخم» بمعنى الدفع والقوة. محاولة اشتقاقية للدلالة على مقدار
        القصور الذاتي، لكنه أقرب إلى مفهوم الزخم (momentum) منه إلى الكتلة.


stage2_evidence:
  per_lemma:
    - lemma: "كُتْلَة"
      confirm:
        - text: "«القِطْعة المجتمعة من الشَّيء»"
          source: "المعجم الوسيط"
        - text: "«الجماعة من الناس المتفقون على رأى واحد. (مج)»"
          source: "المعجم الوسيط"
        - text: "«هي كمية أساسية في علم الميكانيكا، ووحدة قياسها هي كيلو جرام (كجم). وتكون كتلة أي جسم ثابتة وغير متغيرة. فهي تبلغ على سطح القمر مثلما تبلغ على الأرض. ويعتمد القصور الذاتي - الذي يقاوم به جسم ما تغيّرات حالته الحركية - على مقدار الكتلة.»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
        - text: "«كتلة = mass»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«كتلة = mass»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«كتلة = mass»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«كتلة = mass»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«كتلة = mass»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«كُتْلَة = mass»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      expands:
        - text: "«كتلة الجاذبية = gravitational mass»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "تأكيد على وجود مركّب «كتلة الجاذبية» المتوافق مع تعريف المجموعة"
        - text: "«كتلة ذرية = atomic mass»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "المصطلح يدخل في مركّبات علمية متعددة مما يؤكد رسوخه"

    - lemma: "جِرْم"
      contradicts:
        - text: "«الجَسَدُ»"
          source: "المعجم الوسيط"
          conflict: "الجِرْم يدلّ على الجسد/الجسم ذاته لا على خاصية الكتلة كمقدار فيزيائي"
        - text: "«الجِرْمُ اللَّوْنُ وَالصَّوْتُ وَالْجَسَدُ»"
          source: "المغرب في ترتيب المعرب للمُطَرِّزي"
          conflict: "الجِرْم متعدد الدلالات (لون، صوت، جسد) ولا يختصّ بالكتلة الفيزيائية"
      expands:
        - text: "«جرم الصوت : جهارَتُه»"
          source: "المعجم الوسيط"
          addition: "دلالة إضافية على جهارة الصوت تزيد من غموض المصطلح"

    - lemma: "ثِقَل"
      contradicts:
        - text: "«الثِّقَلُ، كعِنَبٍ: ضِدُّ الخِفَّةِ»"
          source: "القاموس المحيط"
          conflict: "الثِّقَل يدلّ على الوزن/الثقل الحسّي لا على الكتلة؛ في الفيزياء الكتلة ≠ الوزن"
      expands:
        - text: "«مِثْقالُ الشيءِ: مِيزانُهُ من مِثْلِهِ»"
          source: "القاموس المحيط"
          addition: "المثقال وحدة وزن لا كتلة، مما يؤكد أن الحقل الدلالي للجذر ثقل هو الوزن"

    - lemma: "زَخْم"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "كُتْلَة"
      decision: confirmed
      decision_reason: >
        المصطلح المعتمد في جميع المعجمات العلمية العربية الموحّدة (أكثر من عشرة
        معجمات متخصصة في الفيزياء والكيمياء والهندسة والفلك). الجذر «كتل» يدلّ على
        التجمّع، والوزن فُعْلة يناسب الدلالة على القطعة المتجمّعة. التعريف المعجمي
        في الوسيط («القطعة المجتمعة من الشيء») يتّسق مع الاستعمال الفيزيائي عبر
        التوسّع الدلالي المنظّم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كُتْلَة"

    - lemma: "جِرْم"
      source: stage1
      decision: removed
      decision_reason: >
        الجِرْم يدلّ على الجسد أو الجسم المادي ذاته، لا على خاصية الكتلة بوصفها
        مقداراً فيزيائياً. في الاستعمال العلمي العربي يُستخدم «جِرْم» للأجرام السماوية
        (الأجسام) لا لمفهوم الكتلة (mass). كما أنه مشترك لفظي (جسد، صوت، لون، ذنب).

    - lemma: "ثِقَل"
      source: stage1
      decision: removed
      decision_reason: >
        الثِّقَل ضدّ الخفّة ويدلّ على الوزن (weight) لا على الكتلة (mass). في الفيزياء
        الحديثة، الكتلة والوزن مفهومان مختلفان: الكتلة ثابتة والوزن يتغيّر بتغيّر
        حقل الجاذبية. استعمال «ثقل» بمعنى «كتلة» يُحدث خلطاً علمياً.

    - lemma: "زَخْم"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تربط هذا اللفظ بمفهوم الكتلة. الزَّخْم في الاستعمال
        العلمي العربي يدلّ على كمّية الحركة (momentum = mass × velocity)، وهو مفهوم
        مختلف تماماً عن الكتلة.


stage4_content:
  definition:
    current: "خاصية الجسم التي تسبب أن يكون له وزن في مجال الجاذبية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي، ويكتفي بذكر علاقة الكتلة
        بالوزن دون الإشارة إلى القصور الذاتي. كما أن عبارة «تسبب أن يكون» ركيكة
        أسلوبياً.
    authored:
      - type: terminological
        text: "مِقدارُ ما في الجِسمِ من مادَّةٍ، وهي خاصِّيَّةٌ فيزيائيَّةٌ تُحدِّدُ مقاوَمَتَه لتغيُّرِ حالتِه الحَرَكيَّةِ (القُصورَ الذّاتيَّ) وتُكسِبُه وَزناً في حَقلِ الجاذِبيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "كَمِّيَّةٌ فيزيائيَّةٌ أساسيَّةٌ تُقاسُ بالكيلوغرام، تَثبُتُ للجِسمِ أينَما كانَ ولا تتغيَّرُ بتغيُّرِ المَوقِع، بخِلافِ الوَزنِ الذي يَعتمِدُ على شِدَّةِ حقلِ الجاذِبيَّةِ. وتُحدِّدُ الكُتلةُ مِقدارَ القُصورِ الذّاتيِّ لِلجِسمِ، أي مُقاوَمَتَه لأيِّ تَغييرٍ في سُرعتِه أو اتِّجاهِ حَرَكتِه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مِقدارُ ما في الجِسمِ من مادَّةٍ، وهي خاصِّيَّةٌ فيزيائيَّةٌ تُحدِّدُ مقاوَمَتَه لتغيُّرِ حالتِه الحَرَكيَّةِ (القُصورَ الذّاتيَّ) وتُكسِبُه وَزناً في حَقلِ الجاذِبيَّةِ."

  examples:
    per_lemma:
      - lemma: "كُتْلَة"
        examples:
          - text: "تبلغُ كُتْلَةُ الأرضِ نحوَ 5.97 × 10²⁴ كيلوغرامٍ، وهي ثابتةٌ سواءٌ قِيسَتْ على سطحِها أم في الفضاءِ الخارجيِّ."
            type: usage
          - text: "يعتمدُ مقدارُ قوَّةِ الجاذبيَّةِ المتبادَلةِ بينَ جسمَيْنِ على كُتْلَةِ كلٍّ منهما والمسافةِ بينَهما."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
