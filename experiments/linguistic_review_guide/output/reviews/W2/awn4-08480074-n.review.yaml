stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مترجم حرفياً بركاكة (أي مجموعة معينة...)."
    observations: "مصطلح «بريد» في العربية أصيل ومستقر ويعبر بدقة عن الرسائل والطرود المجمعة للإرسال، كما نصت عليه المعاجم الحديثة كالوسيط."
  blind_candidates:
    - lemma: "بَرِيد"
      generation_method: taarib
      justification: "كلمة معربة قديمة ومستقرة، أصبحت أصلًا لغوياً، وتُطلق مجازاً أو اتساعاً على الرسائل والطرود نفسها."
    - lemma: "رَسَائِلُ بَرِيدِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي يوضح ماهية المادة المجمعة لتسليمها."
    - lemma: "طُرُود"
      generation_method: ishtiqaq
      justification: "جمع طرد، وهو ما يُرسل من أمتعة ورسائل مغلفة."
    - lemma: "بَعِيثَة"
      generation_method: ishtiqaq
      justification: "على وزن فَعِيلَة بمعنى مفعولة، أي الأشياء المبعوثة كرسائل وطرود."

stage2_evidence:
  per_lemma:
    - lemma: "بَرِيد"
      confirm:
        - text: "«(الْبَرِيد) أَصله الدَّابَّة الَّتِي تحمل الرسائل وَالرَّسُول والمسافة بَين كل منزلين من منَازِل الطَّرِيق وَهِي أَمْيَال اخْتلف فِي عَددهَا والرسائل (ج) برد (مَعَ)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«وظيفة ومجموع الأدوات التي تمكن من تبادل الرسائل بين الحواسيب ومحطات العمل داخل شبكة»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
          addition: "يؤكد اتساع دلالة المصطلح ليشمل البريد الإلكتروني ونقل الرسائل بشكل عام."
    - lemma: "رَسَائِلُ بَرِيدِيَّة"
      evidence_status: "no_material_found"
    - lemma: "طُرُود"
      evidence_status: "no_material_found"
    - lemma: "بَعِيثَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "بَرِيد"
      decision: confirmed
      decision_reason: "استعمال فصيح وشائع ومثبت معجمياً؛ حيث نص المعجم الوسيط صراحة على أن من معاني البريد «الرسائل»، وهو يعبر عن المفهوم (مجموعة رسائل أو طرود) بدقة وملاءمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَرِيد"

    - lemma: "رَسَائِلُ بَرِيدِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي غير مسكوك اصطلاحياً في هذا السياق، ومصطلح البريد المفرد يغني عنه ويؤدي المعنى كاملاً."

    - lemma: "طُرُود"
      source: stage1
      decision: removed
      decision_reason: "المرشح يدل على الطرود المغلفة فقط ولا يغطي الرسائل الورقية العادية، في حين أن المفهوم يشمل الاثنين."

    - lemma: "بَعِيثَة"
      source: stage1
      decision: removed
      decision_reason: "اشتقاق صحيح قياسياً لكنه غير متداول في الاستعمال المعاصر كبديل لمصطلح البريد الشائع والمستقر."

stage4_content:
  definition:
    current: "أي مجموعة معينة من الرسائل أو الطرود التي يتم تسليمها"
    assessment:
      decision: revise
      reason: "الترجمة الحالية ركيكة حرفية (أي مجموعة معينة...) ولا تتوافق مع أسلوب المعاجم العربية؛ صياغة تعريف جديد أدق دلالياً."
    authored:
      - type: terminological
        text: "مجموعة من الرسائل أو الطرود المجمَّعة التي تُرسل وتُسلَّم إلى المرسَل إليهم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة من الرسائل أو الطرود المجمَّعة التي تُرسل وتُسلَّم إلى المرسَل إليهم."

  examples:
    per_lemma:
      - lemma: "بَرِيد"
        examples:
          - text: "وصل بَرِيدُ اليوم يحمل رسائلَ هامةً وطروداً من الخارج."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وصل بَرِيدُ اليوم يحمل رسائلَ هامةً وطروداً من الخارج."

stage5_enrichment:
  per_entry:
    - lemma: "بَرِيد"
      entry_id: "{auto}"
      root: "برد"
      maqayis_quote: "«الْبَاءُ وَالرَّاءُ وَالدَّالُ أُصُولٌ أَرْبَعَةٌ: أَحَدُهَا خِلَافُ الْحَرِّ، وَالْآخَرُ السُّكُونُ وَالثُّبُوتُ، وَالثَّالِثُ الْمَلْبُوسُ، وَالرَّابِعُ الِاضْطِرَابُ وَالْحَرَكَةُ... وَالْأَصْلُ الرَّابِعُ بَرِيدُ الْعَسَاكِرِ؛ لِأَنَّهُ يَجِيءُ وَيَذْهَبُ.»"
  per_sense:
    - lemma: "بَرِيد"
      sense_id: "{auto}"
      nuance: "المصطلح الشائع والمعتمد الذي يغطي الرسائل والطرود المرسلة ككتلة واحدة."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"برد","maqayis":"«الْبَاءُ وَالرَّاءُ وَالدَّالُ أُصُولٌ أَرْبَعَةٌ: أَحَدُهَا خِلَافُ الْحَرِّ، وَالْآخَرُ السُّكُونُ وَالثُّبُوتُ، وَالثَّالِثُ الْمَلْبُوسُ، وَالرَّابِعُ الِاضْطِرَابُ وَالْحَرَكَةُ... وَالْأَصْلُ الرَّابِعُ بَرِيدُ الْعَسَاكِرِ؛ لِأَنَّهُ يَجِيءُ وَيَذْهَبُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الشائع والمعتمد الذي يغطي الرسائل والطرود المرسلة ككتلة واحدة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95