      decision_reason: "اقتراض لفظي (نقل حرفي) دخيل وغير مستقر في الكتابة (نيكتون/نكتون). المصطلح العربي 'سوابح' يغني عنه تماماً وهو أيسر تداولاً وأكثر ملاءمة للصرف العربي."
