# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — قُرئ synset_info_masked.yaml أولاً (بدون لمّات)
  blind_candidates:
    - lemma: "طَابَع"
      generation_method: majaz
      justification: >
        الطابع في أصله الاشتقاقي «ما يُختم به» ثم توسّع بالمجاز ليدل على الخُلُق الغالب
        والسمة المميِّزة لشيء أو شخص. وبما أن التعريف يصف «صفة كامنة في فعل أو كتابة
        تكشف عن مواقف المؤلف»، فالطابع يؤدي هذه الوظيفة بدقة: إذ يصوِّر البصمة الفكرية
        الثابتة التي تنطبع في النص.

    - lemma: "مَذَاق"
      generation_method: majaz
      justification: >
        من جذر ذَوَقَ — الاختبار الحسي. اتُّسع المذاق مجازًا ليشمل «الطعم المعنوي»
        للكلام، أي ما يُحسُّه القارئ من طبيعة النص وميول كاتبه. غير أنه مرتبط
        بالذوق الجمالي لا بالمواقف والافتراضات مباشرةً.

    - lemma: "نَزْعَة"
      generation_method: ishtiqaq
      justification: >
        من جذر نَزَعَ — القلع والشد نحو. النزعة اسم مرة/هيئة على وزن فَعْلَة تدل
        على الميل الدائم أو الاتجاه الفكري لصاحب النص. يصلح للدلالة على ما تكشفه
        الكتابة من توجهات وافتراضات الكاتب.

    - lemma: "سِمَة"
      generation_method: majaz
      justification: >
        من وَسَمَ — الأثر والعلامة. السِّمة هي الأثر الكامن في النص الذي يشي بهوية
        صاحبه وآرائه؛ مجاز من الوسم الحسي للماشية إلى الوسم المعنوي في الكلام.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "لَهْجَة: المعنى الأوّل المستقر هو اللهجة اللغوية (dialect) والطريقة الكلامية،\
         وهو أبعد عن دلالة «الصفة التي تكشف مواقف المؤلف في الكتابة»."
      - "نَبْرَة: المعنى الأصلي صوتيٌّ فونولوجي (رفع الصوت، النبر)، وإن كانت تُستعمل\
         مجازًا في اللغة المعاصرة للدلالة على التوتر العاطفي في الخطاب."
      - "التعريف العربي الحالي ترجمة حرفية للإنجليزي، يحتاج إلى صياغة بأسلوب المعجم الوسيط."
      - "غياب التشكيل الكامل عن اللمّتين الموجودتَيْن."
      - "المجموعة تفتقر إلى لمّة تعبّر عن الطابع الكلي الثابت في النص (≈ tone = طابع)،\
         وهو ما تثبته المعاجم الثنائية صراحةً."
    observations: >
      المجموعة تمثّل المعنى الأدبي-الفلسفي للـ tone: الصفة الكامنة في نص أو فعل تُعلن
      عن مواقف صاحبه وما يُسلِّم به من مقدمات. اللمّتان الحاليتان (لهجة، نبرة) أُطلقتا
      تقليدياً على المعنى الصوتي أو اللهجي، وإن استُعملتا توسُّعًا للدلالة على الطابع
      الانفعالي للخطاب. والأنسب لهذا السياق الأدبي هو «طابع» (الخُلُق الغالب في الكلام)
      الذي يثبته المورد الحديث صراحةً مقابل «tone» بمعنى الاتجاه العام في السلوك
      أو الكتابة، ويصفه الوسيط بأنه «الطبيعة والخُلُق الغالب». ينبغي إضافة هذه اللمة
      وتشكيل الموجودتَيْن وتحسين التعريف.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "لهجة"
      confirm:
        - text: "«اللَّهْجَةُ: اللسانُ, أو طَرَفُه — لُغَةُ الإنسان التى جُبِل عليها
            فاعتادها — طريقة من طرق الأداء فى اللغة — جَرْسُ الكلام»"
          source: "المعجم الوسيط"
        - text: "«اللَّهجة: اللسان أو طرفه، ولغةُ الإنسان التي جُبل عليها واعتادها»"
          source: "التعريفات الفقهية للبركتي (hawramani)"
        - text: "«(1) لهجة — (4) أسلوب» [مقابل: tone]"
          source: "المورد الحديث (2008)"
        - text: "«accent: (1) لهجة (2) نَبْرة [صوت]»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«لهجة» [ترجمة وحيدة لـ dialect]"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
          conflict: >
            يقصر مصطلح لهجة على المعنى اللساني (dialect) الذي يختلف عن المعنى
            المقصود هنا وهو الصفة الكاشفة عن مواقف المؤلف.
        - text: "«نظام من الدلائل الصوتية والقواعد التأليفية متفرع عن لغة ما»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM)"
          conflict: >
            يرسّخ المعنى اللساني الاصطلاحي (dialect/variety)، وهو بعيد عن دلالة
            الطابع الكاشف عن مواقف المؤلف.
      expands:
        - text: "«طريقة من طرق الأداء والتعبير اللغوي»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يوسّع الدلالة نحو أسلوب الأداء التعبيري عمومًا، مما يقرِّبها من المعنى
            الأدبي للـ tone.

    - lemma: "نبرة"
      confirm:
        - text: "«النَّبْرَةُ: كلُّ مرتفع من شىء — الوَرَمُ — وسط النُّقْرَة في ظاهر
            الشَّفَة — الهمزة — رفع الصَّوت حين النطق بالكلمة, وقد يكون بالاعتماد على
            حرف من حروفها, وباختلاف موضع النَّبر من الكلمة يتميَّز اللهجات»"
          source: "المعجم الوسيط"
        - text: "«(1) نَبْرة [الصوت] — (7أ) روح — (7ب) طابَع — (7ج) اتجاه عام في
            السلوك الأخلاقي أو الاجتماعي — (8) مزاج philosophical tone»
            [مقابل: tone]"
          source: "المورد الحديث (2008)"
        - text: "«نبرة، لكنة» [مقابل: accent]"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM)"
        - text: "«نَبْرَةُ: بفتح أوله، وسكون ثانيه، وراء بعدها هاء، والنبرة عند العرب:
            ارتفاع الصوت»"
          source: "معجم البلدان لياقوت الحموي"
      contradicts:
        - text: "«رفع الصَّوت حين النُّطق بِالْكَلِمَةِ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          conflict: >
            الدلالة الأصلية صوتية فونولوجية بحتة (phonological stress)، وهي مخالفة
            للمعنى المقصود الذي يتعلق بالصفة الكلية الكاشفة عن المواقف في الكتابة.

    - lemma: "طابع"
      confirm:
        - text: "«الطَّابَع: الطبيعة»"
          source: "المعجم الوسيط"
        - text: "«الطَّابَع: ما يُطبَع به أو يُخْتَمُ — الميسم — الخُلُق الغالب»"
          source: "المعجم الوسيط"
        - text: "«الطَّابَعُ: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ»"
          source: "المعجم الكبير"
        - text: "«(7ب) طابَع — (7ج) اتجاه عام في السلوك الأخلاقي أو الاجتماعي»
            [مقابل: tone]"
          source: "المورد الحديث (2008)"
        - text: "«طَابَع: من (ط ب ع) الخلق الغالب وما يطبع به أو يختم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الصوت» [مقابل: timbre]"
          source: "مسرد الفن والتسلية والرياضة (ARABTERM)"

    - lemma: "مذاق"
      contradicts:
        - text: "«المَذاق: طعم الشيء. يقال: طيبُ المذاق»"
          source: "المعجم الوسيط"
          conflict: >
            دلالة المذاق محصورة في التطعم الحسي ولم تتوسع معجميًا مستقرًا للدلالة
            على الصفة الكاشفة عن مواقف المؤلف.
        - text: "«المَذَّاقُ: الكَذُوبُ المَلُولُ»"
          source: "المعجم الوسيط"
          conflict: >
            الصيغة الثانية (مذَّاق) تحمل معنى ذميمًا للشخصية، بعيدة كليًا عن
            المعنى المقصود.

    - lemma: "نزعة"
      contradicts:
        - text: "«النَّزْعَةُ: موضع انحسار الشَّعر من جانِبَيْ الجبهة — الطَّريق فى الجبل»"
          source: "المعجم الوسيط"
          conflict: >
            المعنيان المستقران تشريحي (فروة الرأس) وجغرافي (طريق في جبل)؛
            لا يدعمان الاستخدام دالاً على صفة الكتابة.
      expands:
        - text: "«يلاحظ في التعبير اللغوي، لأسباب يصعب تفسيرها، أن التبدلات تنحو منحى
            موحدًا كما لو أنها محكومة بقانون عام» [مقابل: Tendency]"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM)"
          addition: >
            يثبت استخدام نزعة بمعنى الميل/الاتجاه اللساني، لكن في نطاق التغير
            اللغوي لا في نطاق الكشف عن مواقف المؤلف.

    - lemma: "سمة"
      expands:
        - text: "«ما وُسِم به الحيوان من ضروب الصُّوَر — العلامة»"
          source: "المعجم الوسيط"
          addition: >
            السمة تعني الأثر المميِّز عمومًا، وتُستعمل مصطلحًا في علم اللسانيات
            وتقانة المعلومات بمعنى «خاصية»، لكن لم يثبت استعمالها مقابل
            الـ tone بمعناه الأدبي.
        - text: "«صفة أو ميزة لشيء ما بمقدور البشر أو الطُّرُق المؤتمتة التعرُّف عليها»
            [مقابل: Attribute]"
          source: "معجم البيانات والذكاء الاصطناعي (ARABTERM)"
          addition: >
            الاستعمال المعلوماتي لـ سمة (attribute/feature) بعيد عن المعنى الأدبي
            المقصود.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: لهجة ──
    - lemma: "لهجة"
      decision: confirmed
      decision_reason: >
        رغم أن المعنى الأول لـ لهجة هو اللهجة اللغوية (dialect)، فإن الوسيط يُثبت
        معنىً ثانيًا هو «طريقة من طرق الأداء في اللغة» و«جَرْس الكلام»، وهو ما يجعلها
        مقبولة للدلالة على الطابع التعبيري الذي يكشف عن موقف الكاتب. يؤيدها المورد الحديث
        صراحةً (مقابل 3 للـ tone) وشاعت في الاستعمال العربي المعاصر للتعبير عن
        «لهجة حادة / هادئة / ساخرة». تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        لَهْجَة تستدعي الطريقة الأسلوبية والنبرة الاجتماعية-العاطفية في التعبير،
        وغالبًا ما تُوصف بصفات تقييمية (حادة / ودية / رسمية)؛ تتمحور حول أسلوب
        الخطاب المتوجّه إلى متلقٍّ بعينه.
      quality_gate:
        consistency: "مطَّرد — شائع الفصيح في اللغة المعيارية المعاصرة"
        ease_of_use: "سهل التداول"
        suitability: "ملائم للسياق الأدبي والإعلامي"
        heritage_preference: "تراثي موثَّق في الوسيط والكبير"
        arabic_preference: "عربي صميم"
        derivability: "اشتقاقي من جذر لهج"
      morphological_fit: "اسم على فَعْلَة — يصلح للصفة الواحدة المتكررة (طريقة الأداء)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَهْجَة"

    # ── لمّة موجودة: نبرة ──
    - lemma: "نبرة"
      decision: confirmed
      decision_reason: >
        النبرة تدل أصلاً على رفع الصوت والهمز، وتُستعمل مجازًا راسخًا للدلالة على
        الحدة الانفعالية أو الليونة في الكلام والكتابة. المورد الحديث يضعها في المرتبة
        الأولى مقابل tone. الاستعمال المعاصر (نبرة حادة / متعالية) يثبت انتقالها
        من الدلالة الصوتية إلى الدلالة الأسلوبية-الانفعالية. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        نَبْرَة تُركِّز على الوقع الآني والانطباع العاطفي اللحظي الذي يُحدثه الكلام
        أو الكتابة على المتلقي، وكثيرًا ما تُلمِح إلى شدة أو ليونة اللحظة التعبيرية
        بدلاً من الطابع الفكري الثابت للنص.
      quality_gate:
        consistency: "مطَّرد — شائع"
        ease_of_use: "سهل التداول"
        suitability: "ملائم"
        heritage_preference: "تراثي من جذر نبر"
        arabic_preference: "عربي صميم"
        derivability: "اشتقاقي من نَبَرَ"
      morphological_fit: "اسم مرة على فَعْلَة — يناسب الحدث الصوتي أو الانفعالي المنفرد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَبْرَة"

    # ── مرشح المرحلة ١: طابع ──
    - lemma: "طَابَع"
      source: stage1
      decision: confirmed
      decision_reason: >
        أقوى المرشحين دعمًا معجميًا: الوسيط يعرِّفه بـ«الخُلُق الغالب» و«الطبيعة»،
        والكبير بـ«الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ»، وهذه بالضبط
        هي الصفة التي تكشف عن مواقف صاحبها. المورد الحديث يثبته مقابل tone في المعنى
        السابع (7ب). ابن فارس يرجعه إلى «نهاية يُختم عندها الشيء» أي البصمة الثابتة
        — استعارة دقيقة لبصمة الكاتب في نصه. اجتاز اختبار السكِّ: لا يمكن إبدال
        «طابع» في عبارة مثل «طابع النص التشاؤمي» بمرادف عشوائي دون تغيير الدلالة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        طَابَع يدل على الخاصية الكلية الثابتة الممتدة في النص كله والتي تُمثِّل
        سِمة المؤلف الفكرية والأيديولوجية؛ أشمل وأعمق من نبرة (آنية) ولهجة (أسلوبية).
      quality_gate:
        consistency: "مطَّرد — شائع الفصيح"
        ease_of_use: "سهل التداول"
        suitability: "ملائم جدًا للسياق الأدبي والنقدي"
        heritage_preference: "تراثي موثَّق في الوسيط والكبير"
        arabic_preference: "عربي صميم من جذر طبع"
        derivability: "اشتقاقي — اسم فاعل/آلة من طَبَعَ"
      morphological_fit: >
        فَاعَل — صيغة تدل على الطبيعة والخصيصة الثابتة، مناسبة تمامًا للدلالة
        على الصفة الكلية الكاشفة.
      actions:
        - command: create_entry
          params:
            lemma: "طَابَع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: مذاق — مرفوض ──
    - lemma: "مَذَاق"
      source: stage1
      decision: removed
      decision_reason: >
        دلالة مذاق محصورة معجميًا في الطعم الحسي (طعم الشيء)، ولا يوجد ما يثبت
        استقراره للدلالة على الصفة الكاشفة عن مواقف المؤلف. الصيغة الثانية (مذَّاق =
        الكذوب) تزيد الالتباس. الانتقال المجازي المفترض (ذوق → مذاق أدبي) لم يتبلور
        مصطلحًا مسكوكًا في المعاجم.

    # ── مرشح المرحلة ١: نزعة — مرفوضة ──
    - lemma: "نَزْعَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعنيان الراسخان في المعاجم تشريحي (انحسار الشعر) وجغرافي (طريق في الجبل).
        واستعمالها بمعنى «الميل» في اللسانيات (ARABTERM) يدل على اتجاه التحول اللغوي
        لا على صفة تكشف عن مواقف مؤلف بعينه. لا تجتاز اختبار الدلالة المحددة للمجموعة.

    # ── مرشح المرحلة ١: سمة — مرفوضة ──
    - lemma: "سِمَة"
      source: stage1
      decision: removed
      decision_reason: >
        سمة تعني العلامة الجسدية أو الخاصية التقنية (في المعلوماتية)، وتُستعمل
        مصطلحًا لـ attribute/feature/trait لا لـ tone. لم يثبت في المعاجم استعمالها
        للدلالة على الصفة الأدبية الكاشفة عن مواقف الكاتب وافتراضاته.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "صفة لشيء ما (فعل أو كتابة) تكشف عن مواقف وافتراضات المؤلف"
    assessment:
      decision: revise
      reason: >
