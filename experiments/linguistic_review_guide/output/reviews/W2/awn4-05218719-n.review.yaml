# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
stage5_enrichment:

  per_entry:
    - lemma: "لَهْجَة"
      entry_id: "{auto}"
      root: "لهج"
      maqayis_quote: >
        «اللَّامُ وَالْهَاءُ وَالْجِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الْمُثَابَرَةِ
        عَلَى الشَّيْءِ وَمُلَازَمَتِهِ، وَأَصْلٌ آخَرُ يَدُلُّ عَلَى اخْتِلَاطٍ
        فِي أَمْرٍ»

    - lemma: "نَبْرَة"
      entry_id: "{auto}"
      root: "نبر"
      maqayis_quote: >
        «النُّونُ وَالْبَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى رَفْعٍ وَعُلُوٍّ.
        وَنَبَرَ الْغُلَامُ: صَاحَ أَوَّلَ مَا يَتَرَعْرَعُ. وَرَجُلٌ نَبَّارٌ: فَصِيحٌ
        جَهِيرٌ. وَسُمِّيَ الْمِنْبَرُ لِأَنَّهُ مُرْتَفِعٌ وَيُرْفَعُ الصَّوْتُ
        عَلَيْهِ»

    - lemma: "طَابَع"
      entry_id: "{auto}"
      root: "طبع"
      maqayis_quote: >
        «الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ مَثَلٌ عَلَى نِهَايَةٍ
        يَنْتَهِي إِلَيْهَا الشَّيْءُ حَتَّى يُخْتَمَ عِنْدَهَا، يُقَالُ: طَبَعْتُ
        عَلَى الشَّيْءِ طَابَعًا. ثُمَّ يُقَالُ عَلَى هَذَا: طَبْعُ الْإِنْسَانِ
        وَسَجِيَّتُهُ»

  per_sense:
    - lemma: "لَهْجَة"
      sense_id: "{auto}"
      nuance: >
        يُستعمل للدلالة على الأسلوب التعبيري الذي يعكس موقف الكاتب إزاء موضوعه
        أو مخاطَبه، ويحمل في الغالب دلالة عاطفية-اجتماعية (حدة، ليونة، سخرية).
        يُوظَّف كثيرًا لوصف أسلوب خطاب موجَّه إلى متلقٍّ بعينه.

    - lemma: "نَبْرَة"
      sense_id: "{auto}"
      nuance: >
        يُركِّز على الوقع الصوتي والانطباع العاطفي الآني الذي يُحدثه الكلام،
        وينتقل مجازًا في الكتابة للدلالة على الحِدَّة أو الليونة في لحظة تعبيرية
        بعينها. أضيق من لهجة وأكثر تركيزًا على الشدة الانفعالية اللحظية.

    - lemma: "طَابَع"
      sense_id: "{auto}"
      nuance: >
        يدل على الخاصية الكلية الثابتة الممتدة في النص كله أو في منجز المؤلف
        بأجمعه، والتي تُمثِّل بصمته الفكرية والأيديولوجية. أشمل الثلاثة وأعمق
        ارتباطًا بشخصية المؤلف البنيوية لا بلحظة تعبيرية واحدة.

  synset:
    cultural_fit: native

  actions:
    # set_metadata للمدخل: لهجة
