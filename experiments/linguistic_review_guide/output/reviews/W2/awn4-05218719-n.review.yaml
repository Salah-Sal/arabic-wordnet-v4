      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"لهج","maqayis":"«اللَّامُ وَالْهَاءُ وَالْجِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الْمُثَابَرَةِ عَلَى الشَّيْءِ وَمُلَازَمَتِهِ»"}'

    # set_metadata للمدخل: نبرة
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نبر","maqayis":"«النُّونُ وَالْبَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى رَفْعٍ وَعُلُوٍّ»"}'

    # set_metadata للمدخل: طابع (جديد)
