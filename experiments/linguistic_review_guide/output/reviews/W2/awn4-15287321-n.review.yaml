# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-15287321-n (run-time)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «وقت التشغيل» خالية من التشكيل"
      - "المجموعة تحتوي لمّة واحدة فقط وهي تركيب إضافي — يُفضَّل إثراؤها بمرادف"
      - "التعريف العربي يستخدم «تشغيل» وهي أعمّ من المفهوم البرمجي؛ «تنفيذ» أدقّ في سياق البرمجيات"
      - "المفهوم في الشبكة نقطة زمنية (hypernym = لحظة) لا مدة زمنية، فيجب أن تعكس اللمّة ذلك"
    observations: "المجموعة تصف مفهوم «run-time» بوصفه لحظةً أو طوراً يكون فيه البرنامج قيد التنفيذ، لا مقدار الزمن المُستغرَق. اللمّة الحالية «وقت التشغيل» مقبولة لكنّها فضفاضة؛ «التشغيل» في العربية تشمل تشغيل الآلات والمعدّات عموماً، بينما «التنفيذ» أخصّ بالبرمجيات. المفهوم تقنيّ حديث ليس له مقابل تراثيّ مباشر، فالأنسب هو التركيب الإضافي."
  blind_candidates:
    - lemma: "زَمَنُ التَّنْفِيذِ"
      generation_method: tarkib
      justification: "تركيب إضافيّ من «زمن» (وقت) و«التنفيذ» (إجراء الأوامر)؛ مصطلح مُثبَت في معاجم المعلوماتية العربية للدلالة على الحقبة التي يعمل فيها البرنامج"
    - lemma: "لَحْظَةُ التَّنْفِيذِ"
      generation_method: tarkib
      justification: "تركيب إضافيّ يطابق المعنى الدقيق للمجموعة (نقطة زمنية)؛ «لحظة» تنسجم مع المفهوم الأعلى «لحظة / نقطة زمنية»"
    - lemma: "وَقْتُ التَّنْفِيذِ"
      generation_method: tarkib
      justification: "تركيب إضافيّ بديل يستعمل «وقت» (أعمّ من لحظة) مع «التنفيذ» (أدقّ من التشغيل في سياق البرمجة)"
    - lemma: "رَنْتَايْم"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي runtime؛ يقبل لام التعريف (الرنتايم) والنسبة (رنتايميّ) لكنّه ملاذ أخير"

stage2_evidence:
  per_lemma:
    - lemma: "وَقْتُ التَّشْغِيلِ"
      confirm:
        - text: "«خوارزمية تغير سلوكها في وقت التشغيل بناءً على المعلومات المتاحة»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
      expands:
        - text: "«وقت التشغيل؛ فترة التشغيل — operating time»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "المصطلح يُستخدم أيضاً بمعنى مدة التشغيل الهندسية لا لحظة التنفيذ البرمجية"
        - text: "«متوسط وقت التشغيل الخالي من الأعطال — MTBF»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          addition: "يدلّ على المدة الزمنية لا النقطة الزمنية في السياق الهندسي"
    - lemma: "زَمَنُ التَّنْفِيذِ"
      confirm:
        - text: "«المدةُ التي يُنفَّذ البرنامج خلالها»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«مقدارُ الزمن المنقضي، أو زمن المعالِجِ المستخدَم في تنفيذ برنامجٍ حاسوبي»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      contradicts:
        - text: "«انظر: execution time — running time»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "المعجم يساوي بين زمن التنفيذ وexecution time (مقدار زمنيّ)، بينما المجموعة تعني run-time كنقطة زمنية"
    - lemma: "لَحْظَةُ التَّنْفِيذِ"
      confirm:
        - text: "«عند التنفيذ (لحظة التنفيذ) — run-time: حادثٌ بعد بدءِ تنفيذِ برنامج، كتقييم تعابير متغيّرة وتحصيص ذاكرة ديناميكي»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«إيثاق عند التنفيذ — run-time binding: إسنادُ معنىً إلى هُويّة (متغيّر مثلاً) في برنامجٍ عند تنفيذ البرنامج، لا عند تصريفه»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يؤكّد أنّ «عند التنفيذ / لحظة التنفيذ» مصطلح مُثبَت للدلالة على طور التنفيذ مقابل طور التصريف"
        - text: "«خطأ عند التنفيذ — run-time error: خطأٌ برمجيٌّ يَحدثُ عند تنفيذ البرنامج»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يعزّز استعمال «عند التنفيذ» كمصطلح تقني ثابت في مركبات متعددة"
    - lemma: "وَقْتُ التَّنْفِيذِ"
      expands:
        - text: "«مدة التنفيذ — run time: هي الفترة التي يكون في أثنائها البرنامج نشيطاً»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "المعجم الموحّد يستعمل «مدة التنفيذ» لا «وقت التنفيذ»، ما يشير إلى أنّ «وقت التنفيذ» ليس الصيغة المعيارية"
    - lemma: "رَنْتَايْم"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "وَقْتُ التَّشْغِيلِ"
      decision: confirmed
      decision_reason: "مصطلح مستعمل في النصوص التقنية العربية الحديثة للدلالة على طور تشغيل البرنامج؛ وإن كان «التشغيل» أعمّ من «التنفيذ»، فهو مفهوم ومتداول. يحتاج إضافة تشكيل كامل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُستخدم في السياقات العامة والهندسية؛ أقرب إلى مفهوم operating time منه إلى execution-phase، لكنّه شائع في الاستعمال الحاسوبيّ العربيّ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَقْتُ التَّشْغِيلِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لَحْظَةُ التَّنْفِيذِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مُثبَت في معجم مصطلحات المعلوماتية (2000) بصيغة «عند التنفيذ (لحظة التنفيذ)» مقابلاً لـ run-time، ويطابق تعريف المجموعة الذي يعني نقطة زمنية لا مدة. ينسجم مع المفهوم الأعلى «لحظة / نقطة زمنية»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدلّ تحديداً على الطور أو اللحظة التي يكون فيها البرنامج قيد التنفيذ، مقابل طور التصريف (compile-time)؛ أدقّ من «وقت التشغيل» في السياق البرمجي"
      actions:
        - command: create_entry
          params: {lemma: "لَحْظَةُ التَّنْفِيذِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "زَمَنُ التَّنْفِيذِ"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تُظهر أنّ «زمن التنفيذ» يعني مقدار الزمن المنقضي (execution time = duration)، بينما المجموعة الترادفية تعني نقطة زمنية (run-time = point). المفهوم الأعلى «لحظة» يؤكّد هذا التمييز."
      evidence_assessment:
        case: contradicts_only

    - lemma: "وَقْتُ التَّنْفِيذِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثَر على المصطلح بهذه الصيغة في المعاجم؛ المعجم الموحد يستعمل «مدة التنفيذ» بدلاً منه. كما أنّه يتداخل دلالياً مع اللمّة الموجودة «وقت التشغيل» دون إضافة تمييز واضح."
      evidence_assessment:
        case: no_material

    - lemma: "رَنْتَايْم"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على تعريب «رنتايم» في أيّ معجم عربيّ. يتوفّر بديلان عربيان مُثبتان، فلا مسوّغ للتعريب."
      evidence_assessment:
        case: no_material

