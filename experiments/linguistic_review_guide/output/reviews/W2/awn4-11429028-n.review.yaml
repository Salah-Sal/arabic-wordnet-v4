# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'تناسخ الأرواح' مكتوبة بدون تشكيل"
      - "المجموعة تحتوي على لمّة واحدة فقط، بينما 'التقمص' مرادف مباشر موثّق في كبريات المعاجم الحديثة"
      - "التعريف الحالي مصاغ بأسلوب سردي (تبدأ الروح...) لا بأسلوب التعريف المصطلحي المعياري (جنس قريب + فصل نوعي)"
      - "التقييد بـ'جسم بشري' يعكس المعنى الضيّق (النسخ في الاصطلاح الفلسفي) دون الإشارة إلى موضعه في المنظومة الأشمل"
    observations: "مصطلح 'تناسخ الأرواح' عريق في التراث الفلسفي العربي الإسلامي، موثَّق منذ الجرجاني (ت 816 هـ) والمناوي والتهانوي، وهو المصطلح الراسخ في الفكر الكلامي والفلسفي. يرادفه 'التقمص' الذي يُصوِّر الروح وهي 'تلبس' جسداً جديداً كالثوب، وهو أكثر شعريةً وتداولاً في الأدب الحديث ومعاجمه. التعريف الحالي قريب من ترجمة الإنجليزية حرفياً ويفتقر إلى الصياغة الاصطلاحية الدقيقة المعهودة في معاجم الفلسفة العربية."
  blind_candidates:
    - lemma: "تَناسُخُ الأَرْواحِ"
      generation_method: tarkib
      justification: "تركيب إضافي من 'تَناسُخ' (على وزن تَفاعُل من نسخ: التحوّل والانتقال المتعاقب) مضافاً إلى 'الأَرْواح' تخصيصاً. وزن التفاعل يدلّ على الفعل المتبادل المتسلسل، فالأرواح تتناوب على الأبدان وتتداولها بالتعاقب."
    - lemma: "التَّقَمُّص"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من الجذر قمص (القميص)؛ مجاز لطيف: الروح 'تتقمّص' جسداً جديداً كما يُلبَس القميص، مستعار من قولهم 'تقمَّص الإمارةَ' أي دخل فيها وتمكَّن منها. الوزن تَفَعُّل يدلّ على التحوّل الاختياري الكامل."
    - lemma: "الحُلُولُ التَّعاقُبِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من 'الحلول' (نزول الشيء في الشيء وسكونه فيه) و'التعاقبي' (المتتابع المتسلسل). يصف حلول الروح في الأبدان البشرية بصورة متعاقبة، بيد أن مصطلح الحلول يحمل أعباءً دلالية تشير إلى وحدة الوجود في الغالب."
    - lemma: "إعادَةُ التَّجَسُّدِ"
      generation_method: tarkib
      justification: "تركيب إضافي من 'إعادة' و'التجسُّد' (ظهور الروح في جسد مادي). يصف العملية من حيث إعادة التجسيد المادي للروح في بدن بشري جديد بعد الموت."


