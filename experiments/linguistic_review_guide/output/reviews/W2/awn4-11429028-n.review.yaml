      decision: confirmed
      decision_reason: "المصطلح عريق في التراث الفلسفي العربي الإسلامي، موثَّق في كتب الاصطلاح منذ الجرجاني والمناوي والتهانوي، وفي معاجم الحداثة (المعجم الوسيط، معجم اللغة المعاصرة). يُقابل metempsychosis مباشرةً في المصطلحيات الحديثة. التركيب الإضافي صحيح: 'تناسخ' مصدر يدلّ على التحوّل المتعاقب، و'الأرواح' مضاف إليه يخصّصه. يجتاز اختبار السكّ ولا يمكن إبدال أي مكوّن بمرادف مع الحفاظ على الوحدة المصطلحية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُستخدم في السياقات الفلسفية والكلامية والأكاديمية، ومرتبط بالمنظومة الاصطلاحية الكلاسيكية التي فرّقت بين مراتب انتقال الروح (نسخ/مسخ/رسخ/فسخ). يحمل طابع الاصطلاح العلمي الدقيق المستقرّ، وهو أوسع دلالةً وأكثر رسوخاً في أدب الفلسفة."
      actions:
