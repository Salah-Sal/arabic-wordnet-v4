# استعلامات نُفِّذت (5 استعلامات):
#  1. مطابقة دفعية: تناسخ/التناسخ/تقمص/التقمص/حلول/الحلول/تجسد/التجسد
#  2. جسر إنجليزي: metempsychosis/rebirth/reincarnation/transmigration/palingenesis
#  3. مقاييس اللغة لجذرَي نسخ وقمص
#  4. FTS عربي: "تناسخ الأرواح"/"انتقال الأرواح"/"تقمص الروح"
#  5. مقاييس اللغة لجذر روح
stage2_evidence:
  per_lemma:
    - lemma: "تَناسُخُ الأَرْواحِ"
      confirm:
        - text: "«التناسخ: عبارة عن تعلق الروح بالبدن بعد المفارقة من بدن آخر، من غير تخلل زمان بين التعلقين، للتعشق الذاتي بين الروح والجسد.»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 816 هـ / 1413م)"
        - text: "«التناسخ: تعلق الروح بالبدن بعد المفارقة من بدن آخر بغير تخلل زمن بين التعلقين.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1031 هـ / 1622م)"
        - text: "«التناسخُ: هي المناسخةُ... وعند الحكماء: انتقال النفس الناطقة من بدن إلى بدن آخر.»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«(التناسخ) تناسخ الرّوح عقيدة شاع أمرها بين الهنود وغيرهم من الأمم القديمة مؤداها أن روح الميت تنتقل إلى حيوان أعلى أو أقل منزلة لتنعم أو تعذب جزاء على سلوك صاحبها الذي مات وأصحاب هذه العقيدة لا يقولون بالبعث.»"
          source: "المعجم الوسيط (نسخة هوراماني)"
        - text: "«تناسختِ الأرواحُ: انتقلت من أجسام إلى أخرى بعد الموت كما يزعُم بعضُهم... يُعرف بالتقمّص.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«تناسخ → metempsychosis» (domain: Sociology and Anthropology)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا - المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«(1) التناسُخ؛ التّقمُّص (را. metempsychosis) (2) تجسُّدٌ جديد.»"
          source: "المورد الحديث (2008) — مدخل reincarnation"
        - text: "«التّقمُّص؛ التناسخ.» (ترجمة metempsychosis)"
          source: "المورد الحديث (2008) — مدخل metempsychosis"
      expands:
        - text: "«التناسخ: انتقال النفس الناطقة من بدن إلى بدن آخر... إنّ الأرواح البشرية إن كانت سعيدة... تنتقل إلى أبدان الملوك... وأما إن كانت شقية... تنتقل إلى أبدان الحيوانات. ويُسمّى انتقال الروح إلى البدن الإنساني: 'نسخاً'، وإلى بدن الحيوان: 'مسخاً'، وإلى النباتي: 'رسخاً'، وإلى الجمادي: 'فسخاً'.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1158 هـ / 1777م)"
          addition: "يوضح أن التناسخ إلى الأبدان البشرية تحديداً يُسمّى 'النسخ' في التصنيف الفلسفي الكلاسيكي، وأن 'تناسخ الأرواح' مصطلح جامع للمنظومة بأسرها"

    - lemma: "التَّقَمُّص"
      confirm:
        - text: "«التّقمُّص؛ التناسخ.» (ترجمة metempsychosis)"
          source: "المورد الحديث (2008)"
        - text: "«(1) «أ» ولادة جديدة أو ثانية: تقمّص.» (ترجمة rebirth)"
          source: "المورد الحديث (2008)"
        - text: "«تناسخ الأرواح: عقيدة شاع أمرُها بين الهنود وغيرهم... يُعرف بالتقمّص.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«الْقَافُ وَالْمِيمُ وَالصَّادُ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى لُبْسِ شَيْءٍ وَالِانْشِيامِ فِيهِ... تَقَمَّصَهُ، إِذَا لَبِسَهُ. ثُمَّ يُسْتَعَارُ ذَلِكَ فِي كُلِّ شَيْءٍ دَخَلَ فِيهِ الْإِنْسَانُ، فَيُقَالُ: تَقَمَّصَ الْإِمَارَةَ، وَتَقَمَّصَ الْوِلَايَةَ.»"
          source: "مقاييس اللغة لابن فارس (ت 395 هـ)"
      contradicts:
        - text: "«تَقَمُّص → appersonification» و«تَقَمُّص → emboitement (encasement)»"
          source: "المعجم الطبي الموحد (2009) — ArabTerm"
          conflict: "المعجم الطبي يوظّف 'التقمص' لمصطلحَين مختلفَين تماماً (الشخصنة في علم النفس، والتكيُّس في علم الأجنة)، مما يُنبئ بخطر الاشتراك اللفظي في السياق الطبي، وإن كان السياق الفلسفي الثابت واضحاً ومستقلاً"

    - lemma: "الحُلُولُ التَّعاقُبِيّ"
      evidence_status: "no_material_found"

    - lemma: "إعادَةُ التَّجَسُّدِ"
      evidence_status: "no_material_found"


