      decision: confirmed
      decision_reason: "موثَّق صراحةً في المورد الحديث (2008) كمقابل مباشر لـ metempsychosis وrebirth. صرَّح به معجم اللغة المعاصرة (مختار عمر) كمرادف لتناسخ الأرواح في سياق التعريف. جذره (قمص) ووزنه (تَفَعُّل) يتناسبان مع الدلالة المجازية. الأدلة الطبية المتعارضة لا تُلغي الدلالة الفلسفية الثابتة لأن السياق يفصل بينهما."
      evidence_assessment:
