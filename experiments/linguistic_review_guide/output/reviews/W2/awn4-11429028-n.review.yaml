      decision_reason: "لم يُوجد في أي مصدر كمصطلح مسكوك لمفهوم تناسخ الأرواح. 'الحلول' مصطلح فلسفي يختصّ في الغالب بالحلول الإلهي أو وحدة الوجود أو الاتحاد الصوفي، وهو مفهوم مغاير تماماً. يفشل اختبار السكّ: يمكن إبدال 'التعاقبي' بـ'المتكرر' أو 'المتسلسل' ويبقى التركيب وصفاً صالحاً."

