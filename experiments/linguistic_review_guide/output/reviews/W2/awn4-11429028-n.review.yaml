      nuance_differentiation: "يُصوِّر الجانب الوجداني والحيوي للانتقال بمجاز الثوب (الروح تلبس جسداً جديداً)، وأكثر شيوعاً في الأسلوب الأدبي والتعليمي العام. يُفضَّل حين يكون التركيز على تجربة الانتقال الروحي في حدّ ذاتها لا على المذهب بوصفه نظاماً عقدياً تصنيفياً."
      actions:
