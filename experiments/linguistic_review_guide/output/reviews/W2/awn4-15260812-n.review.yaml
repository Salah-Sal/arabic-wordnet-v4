# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15260812-n (nanosecond)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «نانوثانية» معرّبة بالكامل، ولا يوجد بديل عربي صرف للمصطلح"
      - "اللمّة بدون تشكيل — يجب إضافة التشكيل الكامل"
    observations: >
      المفهوم (واحد من مليار من الثانية) مفهوم تقني حديث بحت مرتبط بالفيزياء وعلوم الحاسوب.
      السابقة «نانو» يونانية الأصل وعالمية الاستعمال، وقد أقرّتها المنظمات المعيارية الدولية (SI).
      الجزء الثاني «ثانية» عربي أصيل من جذر ث ن ي.
      المصطلح لا يقبل الاشتقاق المحض من جذر عربي لأنّ الدلالة المقصودة
      (10⁻⁹) مرتبطة بنظام البادئات المترية العالمي، فالتعريب هو الخيار الطبيعي.
  blind_candidates:
    - lemma: "نَانُوثَانِيَة"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الإنجليزي nanosecond بدمج السابقة العالمية «نانو»
        مع الكلمة العربية «ثانية»، على نمط «ميكروثانية» و«ملّيثانية».
        قابل للتعريف والجمع (نانوثانيات) والنسبة (نانوثانوي).
    - lemma: "نَانُو ثَانِيَة"
      generation_method: taarib
      justification: >
        صيغة بديلة للمصطلح السابق بفصل المكوّنين «نانو» و«ثانية» بمسافة،
        وهي شائعة في بعض المعاجم التقنية العربية.
    - lemma: "مِلْيَارِيَّةُ الثَّانِيَة"
      generation_method: tarkib
      justification: >
        مركب إضافي من المصدر الصناعي «مِلْيَارِيَّة» (= جزء من مليار) + «الثانية».
        يُوضح الدلالة العددية مباشرة، لكنه ثقيل صرفياً ولا شيوع معجمي له.
    - lemma: "نُفَيْرِيَّةُ الثَّانِيَة"
      generation_method: tarkib
      justification: >
        مركب إضافي يستعمل «نُفَيْر» (البديل العربي المقترح للسابقة «نانو»
        في بعض معاجم ALECSO) مع المصدر الصناعي + «الثانية».
        محاولة لتعريب البادئة بدل اقتراضها، لكنها لم تنتشر.

stage2_evidence:
  per_lemma:
    - lemma: "نَانُوثَانِيَة"
      confirm:
        - text: "«جزء من مليار من الثانية وتقاس بها سرعة الولوج إلى الذاكرة وبالتالي سرعة المعالجة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
        - text: "«النانوثانية: جزء من بليون من الثانية.»"
          source: "المورد الحديث (2008)"
        - text: "«رمز النَّانُوثانِيَة» — translation_en: ns (nanosecond)"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«مختصره: ns. جزءٌ من بليون من الثانية. وهو وحدة قياسٍ زمنية تُستعمَلُ لتمثيل سرعة الحوسبة، وخصوصاً سرعة انتقال الإشارة الكهربائية في دارات الحاسوب.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يضيف سياق الاستعمال الحوسبي ومختصر الرمز ns"

    - lemma: "نَانُو ثَانِيَة"
      confirm:
        - text: "«هي جزء من بليون من الثانية، 1 نانو ثانية = 10⁻⁹ ثانية = 0.000000001 ثوان.»"
          source: "مسرد هندسة وتكنولوجيا السيارات، ALECSO (ArabTerm)"
        - text: "«نَانُو ثَانِيَة» — translation_en: nanosecond"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«مختصره: ns. جزءٌ من بليون من الثانية. وهو وحدة قياسٍ زمنية تُستعمَلُ لتمثيل سرعة الحوسبة، وخصوصاً سرعة انتقال الإشارة الكهربائية في دارات الحاسوب.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "هذا المعجم يكتبها بفصل المكوّنين «نانو ثانية»"

    - lemma: "مِلْيَارِيَّةُ الثَّانِيَة"
      evidence_status: "no_material_found"

    - lemma: "نُفَيْرِيَّةُ الثَّانِيَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "نَانُوثَانِيَة"
      decision: confirmed
      decision_reason: >
        مصطلح معرّب مستقر أقرّته عدة معاجم موحدة (تقانة المعلومات 2011،
        المعجم الطبي الموحد 2009، المورد الحديث 2008). يتّسق مع نمط
        تسمية وحدات القياس الزمنية (ميكروثانية، ملّيثانية). قابل للاشتقاق
        والجمع والنسبة. اللمّة الموجودة تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَانُوثَانِيَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَانُو ثَانِيَة"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بديلة بفصل المكوّنين موثّقة في عدة معاجم، لكنها مجرد تهجئة مختلفة
        لنفس المصطلح وليست وحدة معجمية مستقلة. الصيغة الموصولة «نانوثانية»
        أكثر انسجاماً مع نمط الوصل في المصطلحات المترية العربية ومع إملاء
        مجمع اللغة العربية. يمكن تسجيلها كصيغة بديلة (form) على المدخل الموجود.

    - lemma: "مِلْيَارِيَّةُ الثَّانِيَة"
      source: stage1
      decision: removed
      decision_reason: >
        مركب إضافي ثقيل لا شيوع معجمي له ولا سند في أي معجم.
        يفتقر إلى اختبار التثبيت المعجمي — عبارة وصفية حرة لا مصطلح مسكوك.

    - lemma: "نُفَيْرِيَّةُ الثَّانِيَة"
      source: stage1
      decision: removed
      decision_reason: >
        البديل «نُفَيْر» للسابقة «نانو» مذكور في مسرد تربوي واحد فقط
        ولم ينتشر في الاستعمال. المركب «نُفَيْرِيَّة الثانية» غير مسجّل
        في أي معجم ولا يتحقق فيه شيوع الفصيح ولا يُسر التداول.

stage4_content:
  definition:
    current: "واحد من مليار (10^-9) من الثانية؛ جزء من ألف من الميكروثانية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية ويحتاج صياغة معجمية عربية.
        تعبير «واحد من مليار» غير دقيق معجمياً (الأصح: جزء من ألف مليون).
        كما ينقصه تعريف الجنس القريب الصريح (وحدة قياس زمنية).
    authored:
      - type: terminological
        text: "وَحْدَةُ قِيَاسٍ زَمَنِيَّةٌ تُسَاوِي جُزْءًا مِنْ أَلْفِ مِلْيُونٍ (10⁻⁹) مِنَ الثَّانِيَةِ، أَيْ جُزْءًا مِنْ أَلْفٍ مِنَ المِيكْرُوثَانِيَةِ، تُسْتَعْمَلُ فِي قِيَاسِ سُرْعَةِ الحَوْسَبَةِ وَانْتِقَالِ الإِشَارَاتِ الكَهْرَبَائِيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "وَحْدَةُ قِيَاسٍ زَمَنِيَّةٌ تُسَاوِي جُزْءًا مِنْ أَلْفِ مِلْيُونٍ (10⁻⁹) مِنَ الثَّانِيَةِ، أَيْ جُزْءًا مِنْ أَلْفٍ مِنَ المِيكْرُوثَانِيَةِ، تُسْتَعْمَلُ فِي قِيَاسِ سُرْعَةِ الحَوْسَبَةِ وَانْتِقَالِ الإِشَارَاتِ الكَهْرَبَائِيَّةِ."

  examples:
    per_lemma:
      - lemma: "نَانُوثَانِيَة"
        examples:
          - text: "تبلغ سرعة الولوج إلى ذاكرة الوصول العشوائي الحديثة نحو عشر نانوثانيات، ممّا يمكّن المعالج من تنفيذ ملايين العمليات في الثانية الواحدة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تبلغ سرعة الولوج إلى ذاكرة الوصول العشوائي الحديثة نحو عشر نانوثانيات، ممّا يمكّن المعالج من تنفيذ ملايين العمليات في الثانية الواحدة."

