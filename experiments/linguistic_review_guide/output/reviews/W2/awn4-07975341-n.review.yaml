    current: "التماثيل مجتمعة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دوري (تكرار اللفظ المراد تعريفه) ويفتقر للجنس القريب."
    authored:
      - type: terminological
        text: "مجموعةٌ من التَّماثيلِ مَنْصُوبَةٌ في مَكانٍ ما، أو مُعْتَبَرَةٌ كَكُلٍّ فَنِّيٍّ أو تَذْكارِيٍّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07975341-n"
