stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي في AWN (التماثيل مجتمعة) يعاني من الدوران، حيث استخدم اللفظ المراد تعريفه في نص التعريف."
    observations: "مصطلح Statuary في الإنجليزية يشير إلى التماثيل ككتلة واحدة أو فن نحتها. في العربية، يُعبر عن هذا المفهوم بالجمع (تماثيل) أو بالتركيب الإضافي (مجموعة تماثيل). المصطلح 'أنصاب' قريب لكنه يغلب على التماثيل التذكارية أو الأصنام."
  blind_candidates:
    - lemma: "تَمَاثِيل"
      generation_method: ishtiqaq
      justification: "جمع تكسير لكلمة تمثال، ويستخدم للدلالة على الجمع والكلية في سياقات الفن والآثار."
    - lemma: "مَجْمُوعَة تَمَاثِيل"
      generation_method: tarkib
      justification: "تركيب إضافي صريح يعبر عن المفهوم الجمعي (statues collectively)."
    - lemma: "مَنْحُوتَات"
      generation_method: ishtiqaq
      justification: "جمع منحوتة، وهو مصطلح أعم يشمل التماثيل وغيرها من الأعمال الفنية المنحوتة."
    - lemma: "تَمَاثِيلِيَّة"
      generation_method: ishtiqaq
      justification: "صيغة مصدر صناعي قد تستخدم للإشارة إلى الفن أو الطابع الجمعي للتماثيل."

stage2_evidence:
  per_lemma:
    - lemma: "تَمَاثِيل"
      confirm:
        - text: "(التمثال) نحت من حجر أو صنع من نحاس ونحوه... (ج) تماثيل."
          source: "المعجم الوسيط"
        - text: "(3) مجموعة تماثيل"
          source: "المورد الحديث (ترجمة statuary)"
    - lemma: "مَجْمُوعَة تَمَاثِيل"
      confirm:
        - text: "(3) مجموعة تماثيل"
          source: "المورد الحديث (ترجمة statuary)"
    - lemma: "مَنْحُوتَات"
      expands:
        - text: "حقل المنحوتات: لوحات حجرية منحوتة"
          source: "ArabTerm"
          addition: "يدل على أن المصطلح يشمل المنحوتات الحجرية واللوحات وليس التماثيل المشخصة فقط."
    - lemma: "تَمَاثِيلِيَّة"
      contradicts:
        - text: "(2) المَثّاليّة [التِمثاليّة]: فنّ نَحْت التماثيل"
          source: "المورد الحديث"
          conflict: "المصطلح يشير إلى الفن (art) وليس إلى المجموعة (collectively)."

stage3_analysis:
  per_lemma:
    - lemma: "تماثيل"
      decision: confirmed
      decision_reason: "الجمع القياسي لكلمة تمثال، وهو اللفظ الأكثر شيوعاً واستخداماً للدلالة على التماثيل مجتمعة في السياقات الفنية والتاريخية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَاثِيلُ"
    - lemma: "مجموعة تماثيل"
      decision: confirmed
      decision_reason: "وحدة معجمية مركبة ثابتة (MWE) تترجم بدقة المصطلح الإنجليزي statuary وتستخدم في المعاجم الحديثة المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوعَةُ تَمَاثِيلَ"
    - lemma: "منحوتات"
      source: stage1
      decision: removed
      decision_reason: "مصطلح أعم يشمل كل ما هو منحوت (Abstract or figurative)، بينما المجموعة الترادفية مخصصة للتماثيل (Representational statues) فقط."
    - lemma: "تماثيلية"
      source: stage1
      decision: removed
      decision_reason: "المصطلح يشير إلى فن النحت أو طابع التماثيل، وليس إلى التماثيل كأشياء مجمعة."

stage4_content:
