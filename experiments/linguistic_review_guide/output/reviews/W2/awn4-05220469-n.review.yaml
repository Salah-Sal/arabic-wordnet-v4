# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان «جمود» و«خدر» تفتقران إلى التشكيل الكامل المطلوب"
      - "«عدم استجابة» عبارةٌ وصفية حرّة لا مصطلح مسكوك؛ تفشل اختبار الثبات المعجمي واختبار السكّ"
      - "«خدر» في أصل استعماله المعجمي يدلّ على الخدر الجسدي (استرخاء العضو)، فدلالته النفسية مجازية؛ يستلزم ذلك توثيق النقلة الدلالية"
      - "التعريف العربي الحالي شبه ترجمة حرفية ويستخدم «عدم الاستجابة» بطريقة دائرية"
    observations: >
      تتمحور المجموعة حول مفهوم «غياب التفاعل» بوصفه صِفةً نفسية وسلوكية.
      للمفهوم جذور عربية أصيلة متعددة: فالجمود يصوِّر تصلُّب النفس وانجمادها،
      والخدر يصوِّر فقدان الإحساس، فيما تحتاج المجموعة إلى لمّتين إضافيتين تستوعبان
      البُعدَين الانفعالي (بلادة) والحيوي (فتور). «عدم استجابة» ينبغي حذفه
      لأنه وصف لا مصطلح.

  blind_candidates:
    - lemma: "بَلادَة"
      generation_method: ishtiqaq
      justification: >
        مشتقّة من جذر «ب-ل-د» على وزن فَعَالة الدالّ على الطبع الراسخ. تدلّ في
        العربية على ثقل الفهم وبُعد الإحساس، وهي تُلائم المفهومَ من جهة انعدام
        التفاعل الانفعالي. الوزن فَعَالة للأوصاف الثابتة كجَبَانة وشَجَاعة.
    - lemma: "فُتُور"
      generation_method: ishtiqaq
      justification: >
        مصدر «فَتَرَ» من جذر «ف-ت-ر» على وزن فُعُول الدالّ على الحالة المستمرة.
        يعني الضعف والتراخي وفقدان الزخم، ويُستعمل تحديداً لبرود العاطفة وكسل
        الاستجابة، وهو ما يلتقي مباشرةً مع دلالة المجموعة.
    - lemma: "اللامُبَالاة"
      generation_method: tarkib
      justification: >
        مركّب وصفي من حرف النفي «لا» ومصدر «المُبَالاة» (من بَلِيَ يُبالي).
        يُعبِّر عن اللامبالاة والاستهتار وعدم الاكتراث، وهو أحد تجلِّيات
        عدم الاستجابة تجاه الناس والأحداث.
    - lemma: "خُمُود"
      generation_method: majaz
      justification: >
        من جذر «خ-م-د»؛ أصله خمود النار أي سكون لهبها وانطفاؤها. استُعمل مجازاً
        لسكون الحياة والحركة والانفعال في الإنسان، وهو مجاز شائع في تصوير انعدام
        الاستجابة العاطفية كانطفاء الشعلة.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "جمود"
      confirm:
        - text: "«الجمود: هيئة حاصلة للنفس بها يقتصر عن استيفاء ما ينبغي وما لا ينبغي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الجمود: هو هيئة حاصلة للنفس بها يقتصر على استيفائها ما ينبغي وما لا ينبغي»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الجمود: [في الإنجليزية] Rigidity, immobility, inertia, catatonia»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«موت؛ جُمود؛ هُمود؛ فُتور إلخ» — ترجمة deadness"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(جمد) الجيم والميم والدال أصل واحد، وهو جمود الشيء المائع من برد أو غيره. يُقال: جمد الماء يجمد»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يكشف الأصل اللغوي لجمود الماء من برد، وهو مجاز دقيق لتصوير انجماد النفس وتحجُّر الانفعال"

    - lemma: "خدر"
