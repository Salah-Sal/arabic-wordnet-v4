      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في مصادر متعددة بمعنى ضعف النشاط (hypoactivity) وفتور الشعور
        (apathy). مقاييس اللغة يُثبِّت الجذر «ف-ت-ر» بمعنى «ضعف في الشيء»،
        وهو ما ينسجم مع دلالة المجموعة على عدم الاستجابة. مُستعمَل في نصوص
        طبية ومعجمية موثَّقة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُصوِّر الفتورُ تراخيَ الاستجابة وضعفها بعد أن كانت قائمة — كجمرة تخبو
        تدريجياً؛ يُستعمل لوصف برود العاطفة والانسحاب البطيء من التفاعل، ويوحي
        بمسار زمني (الاستجابة كانت موجودة ثم خفَّت)، بعكس جمود الطبع الأصيل.
      actions:
        - command: create_entry
          params:
            lemma: "فُتُور"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "خُمُود"
      source: stage1
      decision: removed
      decision_reason: >
        الخمود في المعجمية يدلّ على الانطفاء الكلّي للنار والإغماء («ويقال للمغمى
        عليه: خمد»)، وهو أشدّ من عدم الاستجابة المطلوب. في الطب يُستعمل لتراجع
        الأعراض (abatement)، لا لغياب التفاعل العاطفي. المعنى مُشبَع بجوار جمود
        الموجود بالفعل في المجموعة.

    - lemma: "اللامُبَالاة"
      source: stage1
      decision: removed
      decision_reason: >
        معجم الصواب يرفضها في الفصيح، والصيغة الفصيحة المقررة هي «عدم المبالاة»
        التي هي بدورها عبارة وصفية. دلالتها تميل إلى الاستهتار والإهمال الإرادي
        أكثر من عدم الاستجابة الطبعي. تتداخل مع دلالة الفتور والجمود دون أن
        تُضيف فارقاً دلالياً معتبراً.


