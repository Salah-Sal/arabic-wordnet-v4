    - lemma: "جمود"
      decision: confirmed
      decision_reason: >
        ثابت معجمياً بدلالة نفسية واضحة في مصادر متعددة (المناوي، الجرجاني، التهانوي).
        يُصوِّر تجمُّد النفس وانكفاءها عن الاستجابة، وهو الدلالة المحورية للمجموعة.
        يفتقر إلى التشكيل الكامل ويستدعي تحديثاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُصوِّر الجمودُ حالةً راسخةً من تصلُّب النفس وانجمادها، كأن الروح قد تحجَّرت
        ولم تعد تنبض؛ يُستعمل في الغالب للدلالة على عدم الاستجابة المزمن أو الهيكلي
        في الشخصية، لا على فقدان الإحساس الآني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُمُود"

    - lemma: "خدر"
      decision: confirmed
      decision_reason: >
        موثَّق في المعجم الوسيط (أكاديمي رسمي) بمعنى «فقد الإحساس، وقد يكون نتيجة
        لحالة نفسية»، وهو ما يُجوِّز استعماله في سياق المجموعة. دلالته الأصلية
        جسدية لكنها امتدت للنفسي. يفتقر إلى التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُصوِّر الخدرُ فقدانَ الإحساسِ الطارئ — كالعضو المخدَّر الذي لا يشعر ولا
        يتحرك؛ يُستعمل للدلالة على عدم الاستجابة الحادّ الناجم عن صدمة أو توتر نفسي
        مفاجئ، لا على الخُمول المزمن.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَدَر"

    - lemma: "عدم استجابة"
      decision: removed
      decision_reason: >
        عبارة وصفية حرّة تفشل اختبار السكّ: يمكن إبدال «استجابة» بـ«تفاعل» أو «ردّ»
        دون أن تفقد الجملة معناها الوصفي. لا تعلو لمستوى المصطلح المُثبَّت. علاوة
        على ذلك، تُسبِّب الدوريةَ في التعريف. لم يُعثر على تسجيل معجمي لها كمدخل
        مستقل مفرد يدلّ على هذا المفهوم.
      actions:
