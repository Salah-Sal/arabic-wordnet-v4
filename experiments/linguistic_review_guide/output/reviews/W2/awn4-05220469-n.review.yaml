          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "المعجم يُصنِّف اللامبالاة كصيغة مرفوضة في الفصيح وإن قبلها بوصف «صحيحة»؛ الصيغة المستحسنة هي «عدم المبالاة» وهي بدورها عبارة وصفية لا مصطلح مسكوك"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────
stage3_analysis:
