      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّقة في المعجم الطبي الموحد ومعجم المصطلحات الطبية بمعنى «نقص النشاط
        الانفعالي» (hypoaffectivity)، وهو دلالة محورية للمجموعة. كما أثبتها
        المورد الحديث ترجمةً لـtorpor. جذرها «بلد» مُثبَّت ودلالتها على ثقل
        الطبع وقصور الانفعال واسعة الانتشار في العربية المعاصرة.
