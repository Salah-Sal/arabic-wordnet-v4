          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن الخمود يدلّ على إطفاء الحركة وانطفائها كلياً، وهو أشدّ من عدم الاستجابة البسيط؛ لا يُلائم المفهوم المطلوب تماماً"
        - text: "«نقص شدة الألم أو غيره من الأعراض المرضية» — abatment"
