          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الخدر: بالتحريك، استرخاء العضو فلا يطيق الحركة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الخدر: [في الإنجليزية] Numbness»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(1) خَدَرٌ (2) بلادةٌ (3) سُبات؛ خُدار» — ترجمة torpor"
          source: "المورد الحديث (2008)"
        - text: "«الخَدَر (را. numb)» — ترجمة numbness"
          source: "المورد الحديث (2008)"
      expands:
