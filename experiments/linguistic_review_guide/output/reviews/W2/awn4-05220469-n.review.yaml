          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي لفتر يدلّ على ضعف يطال الشيء في حركته وحدّته، وهو يُصوِّر تراخي الاستجابة الانفعالية تصويراً دقيقاً"

    - lemma: "خُمُود"
      expands:
