        - text: "«بلادة: حالة مرضية لمن ينقص عنده النشاط الانفعالي» — hypothymia"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«(1) خَدَرٌ (2) بلادةٌ» — ترجمة torpor"
