stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل."
    observations: "المصطلح الحالي (نابليونيات) مصاغ صياغة قياسية باستخدام اللاحقة (ـيات) لترجمة اللاحقة الإنجليزية (iana) الدالة على الآثار أو المقتنيات أو المؤلفات المتعلقة بشخصية تاريخية."
  blind_candidates:
    - lemma: "نَابِلْيُونِيَّات"
      generation_method: ishtiqaq
      justification: "صياغة قياسية بزيادة ياء النسب وألف وتاء الجمع للدلالة على المقتنيات أو المؤلفات المتعلقة بالعلَم."
    - lemma: "آثَار نَابِلْيُونِيَّة"
      generation_method: tarkib
      justification: "تعبير وصفي يشير إلى الأشياء التي خلفها أو التي تتعلق بنابليون."
    - lemma: "مُقْتَنَيَات نَابِلْيُون"
      generation_method: tarkib
      justification: "مركب إضافي يدل على الأشياء التي جمعت حول هذه الشخصية."
    - lemma: "مُتَعَلِّقَات نَابِلْيُون"
      generation_method: tarkib
      justification: "مركب إضافي يشير إلى كل ما يتعلق به."

