# ═══════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id : awn4-04802000-n
# ili       : i62201
# pos       : n
# lemmas_en : ordinariness | mundaneness | mundanity
# ═══════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة عَادِيَّة تُشترك في صيغتها مع مؤنث الصفة (عادي)، مما يُفضي إلى التباس صرفي: هل هي مصدر صناعي أم اسم صفة مؤنث أم اسم الخيل المغيرة تاريخياً؟"
      - "كلتا اللمّتين (اعتيادية وعادية) تنحدران من الجذر ذاته (ع-و-د)، مما يُضيّق التنوع في تمثيل المجموعة"
      - "التعريف الحالي يستخدم 'عادياً' — مشتق من جذر إحدى اللمّتين — مما يُورث قدراً من الدوران المعجمي"
    observations: "المفهوم يُعبَّر عنه في العربية بالمصدر الصناعي المشتق من الصفات الدالة على الاعتياد والألفة. الجذر ع-و-د غني بهذا المعنى إذ تشهد مقاييس اللغة لابن فارس على أصل دلالي راسخ حول 'التثنية في الأمر' وتكرار الشيء حتى يصير عادة. المشكلة الرئيسية في المجموعة هي أن عادية تُستعمل في المعاجم الكلاسيكية والحديثة بمعنى الخيل المغيرة وعوادي الدهر ومؤنث الصفة، لا بمعنى الخاصية المجردة للاعتيادية."
  blind_candidates:
    - lemma: "مَأْلُوفِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من مَأْلُوف (اسم مفعول من أَلِفَ) + ية؛ الجذر أ-ل-ف يدل وفق المقاييس على 'انضمام الشيء إلى الشيء' والألفة والإلف، وكون الشيء مألوفاً هو المكافئ الأدق دلالياً للمعنى المستهدف في التعريف"
    - lemma: "ابْتِذَال"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من الجذر ب-ذ-ل؛ ابتذل الشيء: ترك صيانته وأتاحه للعموم؛ يُستعمل في المعاصرة قريباً من mundanity بمعنى كون الشيء مبتذلاً دارجاً بلا تميز"
    - lemma: "رَتَابَة"
      generation_method: ishtiqaq
      justification: "مصدر على فَعَالة من الجذر ر-ت-ب؛ رَتَبَ إذا دام وثبت؛ والرتابة في التداول الحديث تعني السير على وتيرة واحدة مكرورة مألوفة، قريبة من مفهوم الاعتيادية"
    - lemma: "نَمَطِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من نَمَط (نوع، أسلوب متكرر) + ية؛ الجذر ن-م-ط يدل وفق المقاييس على الاجتماع والجماعة؛ والنمطية تعني السير على نمط واحد مكرور بعيداً عن الاستثناء"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "اعْتِيَادِيَّة"
      confirm:
        - text: "«الاعتيادية: كونُ الشيء اعتياديًا أو مألوفًا.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«اعْتِيادِيّ» — ترجمة: ordinary"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُثبت أن اعتيادي صيغة معيارية معتمدة لـ ordinary في المصطلح الطبي الموحد، مما يدعم اشتقاق المصدر الصناعي اعتيادية منه"

    - lemma: "عَادِيَّة"
      contradicts:
        - text: "«(العادية) مؤنث العادي والخيل المغيرة وفي التنزيل العزيز {وَالْعَادِيَاتِ ضَبْحاً} وجماعة القوم يعدون للقتال والشغل يصرفك عن الشيء ودفعت عنك عادية فلان ظلمه وشره (ج) عواد وعوادي الدهر نوائبه وعوادي الكرم ما يغرس منه في أصول الشجر العظام»"
          source: "المعجم الوسيط لمجمع اللغة العربية بالقاهرة (1998)"
          conflict: "يُقيَّد المعجم عادية بمعانٍ بعيدة عن الخاصية المجردة للاعتيادية: الخيل المغيرة، جماعة المقاتلين، الشغل الصارف، الظلم والشر — ولا يُوثَّق فيه استعمالها مصدراً صناعياً بمعنى 'كون الشيء عادياً'"
        - text: "«عَادِيَّة: من (ع و د) مؤنث عَادِيّ والعادية بمعنى الخيل المغيرة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "يحصر السجل المعجمي عادية في مؤنث الصفة والمعاني التاريخية، دون أي توثيق للاستعمال المصدري الصناعي الدال على الخاصية المجردة"

    - lemma: "مَأْلُوفِيَّة"
      evidence_status: "no_material_found"

    - lemma: "ابْتِذَال"
      expands:
        - text: "«(بَذَلَ) الْبَاءُ وَالذَّالُ وَاللَّامُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ تَرْكُ صِيَانَةِ الشَّيْءِ، يُقَالُ: بَذَلْتُ الشَّيْءَ بَذْلًا فَأَنَا بَاذِلٌ وَهُوَ مَبْذُولٌ، وَابْتَذَلْتُهُ ابْتِذَالًا. وَجَاءَ فُلَانٌ فِي مَبَاذِلِهِ، وَهِيَ ثِيَابُهُ الَّتِي يَبْتَذِلُهَا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ب-ذ-ل يدل على 'ترك الصيانة وإتاحة الشيء للعموم'، مما يُثبت أن ابتذال يحمل دلالة سلبية تتجاوز الحياد المطلوب في تعريف الاعتيادية"

    - lemma: "رَتَابَة"
      expands:
        - text: "«رتابة» — المجال: التقنيات التربوية — الترجمة الإنجليزية: monotony"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "توثّق رتابة بمعنى monotony وليس ordinariness؛ الرتابة تعني التكرار المُمِلّ لا غياب التميز المجرد"
        - text: "«رَتَابَة... أقرّ مجمع اللغة المصري ما جاء على فَعَالة دالاًّ على الثبوت والاستمرار من كل فعل ثلاثي... وقد وردت هذه الكلمة في بعض المعاجم الحديثة كالأساسي والمنجد.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (د. 2003)"
          addition: "تؤكد صحة رتابة على فَعَالة لكن بمعنى الثبوت والاستمرار والرتابة الممل، لا الاعتيادية المجردة"

    - lemma: "نَمَطِيَّة"
      expands:
        - text: "«نمطيّة» — المجال: التقنيات التربوية — الترجمة الإنجليزية: routine"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "نمطية موثّقة بمعنى routine لا ordinariness؛ تحمل دلالة 'الاطراد الوظيفي' بينما المجموعة تستهدف 'كون الشيء مألوفاً عادياً' دون إيحاء بالتصنيف أو التكرار الوظيفي"


# ── المرحلة ٣: التحليل اللغوي للمات ──────────────────
stage3_analysis:
  per_lemma:
    - lemma: "اعْتِيَادِيَّة"
      decision: confirmed
      decision_reason: "موثّقة مباشرة في المورد الحديث بتعريف 'كونُ الشيء اعتياديًا أو مألوفًا' المقابل بالإنجليزية لـ ordinariness؛ وهي مصدر صناعي منتظم على القياس من اعتيادي (مشتق من الاعتياد/عود)؛ خالية من الاشتراك اللفظي المخلّ؛ والتشكيل يحتاج تصحيح الحركة الأولى"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة المؤكدة في المجموعة؛ تستمد دلالتها من جذر الاعتياد (تكرار الشيء حتى يصير عادة)، مما يُبرز بدقة خاصية الثبوت والتكرار في المألوف بما يتناسب مع التعريف المستهدف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِعْتِيَادِيَّة"

    - lemma: "عَادِيَّة"
      decision: removed
      decision_reason: "لم يُوثَّق في المعاجم الكلاسيكية والحديثة استعمالها مصدراً صناعياً بمعنى 'الخاصية المجردة للاعتيادية'؛ السجل المعجمي يحصرها في مؤنث الصفة عادي والخيل المغيرة وعوادي الدهر؛ وتطابق صيغتها مع الصفة المؤنثة يولّد التباساً دلالياً وتركيبياً يُضعف صلاحيتها مصطلحاً محدداً"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مَأْلُوفِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا شواهد معجمية تُثبِّت مألوفية مصطلحاً مسكوكاً؛ وإن كانت تتشكّل على قياس منتج (مصدر صناعي من مألوف)، فإن غياب التوثيق يُخرجها عن معيار التثبيت المعجمي المطلوب"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "ابْتِذَال"
      source: stage1
      decision: removed
      decision_reason: "يحمل دلالة سلبية صريحة (إهمال التمييز وإتاحة الشيء للعموم حتى يبتذل)، بينما المجموعة تُعبّر عن اعتيادية محايدة؛ فضلاً عن أن معناه فعلي مصدري يصف حدث الابتذال لا خاصية حالية راسخة"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "رَتَابَة"
      source: stage1
      decision: removed
      decision_reason: "موثّقة بمعنى monotony والثبوت والاستمرار، لا ordinariness؛ الفرق جوهري: الرتابة تعني التكرار الممل بينما الاعتيادية تعني كون الشيء في حدود المألوف غير المتميز"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "نَمَطِيَّة"
      source: stage1
      decision: removed
      decision_reason: "موثّقة بمعنى routine لا ordinariness؛ تحمل دلالة الاطراد الوظيفي والتصنيفي، بينما المجموعة تستهدف خاصية كون الشيء مألوفاً عادياً دون أي إيحاء بالتكرار الوظيفي"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────
stage4_content:
  definition:
    current: "صفة كون الشيء مألوفاً وعادياً"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستعمل 'عادياً' المشتق من جذر اللمّة المحذوفة (عادية)، مما يُورث دوراناً ضمنياً؛ كما أن صيغة 'صفة كون' إطار واهٍ يُضعف الدقة الاصطلاحية مقارنةً بالتعريف القائم على الجنس القريب والفصل النوعي"
    authored:
      - type: terminological
        text: "خاصيةُ ما يكون من الأمور المعتادة المألوفة التي لا تتجاوز حدودَ المعهود، ولا تتميَّز بجِدَّةٍ أو استثناء"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كونُ الشيء في دائرة المعهود من الأمور المتكررة في الحياة اليومية، بعيداً عن كل تفرّد أو طرافة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خاصيةُ ما يكون من الأمور المعتادة المألوفة التي لا تتجاوز حدودَ المعهود، ولا تتميَّز بجِدَّةٍ أو استثناء"

  examples:
    per_lemma:
      - lemma: "اِعْتِيَادِيَّة"
        examples:
          - text: "أَفْضَت اعتياديةُ الحياة اليومية في تلك البلدة الصغيرة إلى شعور عميق بالملل لدى شبابها."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَفْضَت اعتياديةُ الحياة اليومية في تلك البلدة الصغيرة إلى شعور عميق بالملل لدى شبابها."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────
stage5_enrichment:
  per_entry:
    - lemma: "اِعْتِيَادِيَّة"
      entry_id: "{auto}"
      root: "عود"
      maqayis_quote: "«الْعَيْنُ وَالْوَاوُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَثْنِيَةٍ فِي الْأَمْرِ... وَالْعَادَةُ: الدُّرْبَةُ. وَالتَّمَادِي فِي شَيْءٍ حَتَّى يَصِيرَ لَهُ سَجِيَّةً. وَمِنْهُ الْمُعَاوَدَةُ، وَاعْتِيَادُ الرَّجُلِ، وَالتَّعَوُّدُ.»"

  per_sense:
    - lemma: "اِعْتِيَادِيَّة"
      sense_id: "{auto}"
      nuance: "اللمّة الوحيدة المؤكدة في المجموعة؛ تستمد دلالتها من الاعتياد (تكرار الشيء حتى يصير عادة)، مما يُبرز جانب الثبوت والتكرار في المألوف — بخلاف رتابة (monotony) ذات الإيحاء السلبي، ونمطية (routine) ذات الدلالة الوظيفية، وابتذال (banality) ذات الدلالة التقييمية السلبية"

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عود","maqayis":"«الْعَيْنُ وَالْوَاوُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَثْنِيَةٍ فِي الْأَمْرِ... وَالْعَادَةُ: الدُّرْبَةُ. وَالتَّمَادِي فِي شَيْءٍ حَتَّى يَصِيرَ لَهُ سَجِيَّةً. وَمِنْهُ الْمُعَاوَدَةُ، وَاعْتِيَادُ الرَّجُلِ، وَالتَّعَوُّدُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللمة الوحيدة المؤكدة؛ تستمد دلالتها من الاعتياد (تكرار الشيء حتى يصير عادة)، مبرزةً جانب الثبوت في المألوف بخلاف رتابة (monotony) ونمطية (routine) وابتذال (banality)","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.80
