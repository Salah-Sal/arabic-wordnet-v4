        examples:
          - text: "تُعَدُّ دراسة تَطَوُّرِ الكائنات الحية مفتاحاً لفهم التنوع البيولوجي على كوكب الأرض."
            type: usage
      - lemma: "تَطَوُّر عُضْوِيّ"
        examples:
          - text: "قدمت الحفريات أدلة قاطعة على التَّطَوُّرِ العُضْوِيِّ للأنواع المنقرضة."
