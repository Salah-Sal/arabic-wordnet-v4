    current: "(علم الأحياء) تسلسل الأحداث المتضمنة في التطور التطوري لنوع أو مجموعة تصنيفية من الكائنات الحية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على تكرار ركيك 'التطور التطوري'. يجب صياغته بأسلوب علمي سليم."
    authored:
      - type: terminological
        text: "(علم الأحياء) تغيّر تدريجيّ وتاريخي يحدث في البنية والخصائص الجينية لنوع أو مجموعة تصنيفية من الكائنات الحية عبر الأجيال المتعاقبة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13498226-n", definition_index: 0, text: "(علم الأحياء) تغيّر تدريجيّ وتاريخي يحدث في البنية والخصائص الجينية لنوع أو مجموعة تصنيفية من الكائنات الحية عبر الأجيال المتعاقبة."}
