stage1_review:
  assessment:
    concerns:
      - "عدم تشكيل اللمات الموجودة."
      - "وجود مصطلح 'تطور' كترجمة لـ evolution و'نشوء نوعي' كترجمة لـ phylogeny، وهما مفهومان متداخلان لكن يمكن التمييز بينهما دلالياً."
      - "تعريف 'التطور التطوري' فيه تكرار غير مستساغ."
    observations: "المجموعة الترادفية تغطي مفهوم التطور في علم الأحياء (evolution/phylogeny). اللمات الحالية 'تطور'، 'تطور عضوي'، و'نشوء نوعي' مستخدمة بشكل واسع في المعاجم والمصطلحات العلمية."
  blind_candidates:
    - lemma: "تَطَوُّر"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (ط و ر) على وزن تفعُّل، ويدل على الانتقال التدريجي من طور إلى طور."
    - lemma: "نُشُوء"
      generation_method: ishtiqaq
      justification: "اشتقاق من (ن ش أ) ويدل على التكون والظهور المتدرج، ويستخدم في التعبير عن بداية الكائنات."
    - lemma: "اِرْتِقَاء"
      generation_method: ishtiqaq
      justification: "اشتقاق من (ر ق ي) على وزن افتعال، ويعني الصعود في درجات السلم، ويُستعار للتقدم التدريجي للكائنات الحية."
    - lemma: "تَطَوُّر سُلَالِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يحدد نوع التطور بكونه تطوراً خاصاً بسلالة معينة من الكائنات الحية."

stage2_evidence:
  per_lemma:
    - lemma: "تطور"
      confirm:
        - text: "التغيّر التدريجيّ الذي يحدث في بنية الكائنات الحيّة وسلوكها يطلق أيضاً على التغيّر التدريجي الذي يحدث في تركيب المجتمع أو العلاقات أو النظم أو القيم السائدة فيه"
          source: "المعجم الوسيط"
        - text: "evolution"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
    - lemma: "تطور عضوي"
      confirm:
        - text: "organic evolution"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
    - lemma: "نشوء نوعي"
      confirm:
        - text: "(1) التاريخ العِرْقيّ [لنوعٍ من المتعضِّيات] (2) النشوء العِرْقي أو النوعيّ؛ التطوّر العِرقي: نشوء، أو تطوُّر، نوع من أنواع الحيوان أو النبات"
          source: "المورد الحديث (2008)"
    - lemma: "نشوء"
      confirm:
        - text: "(4) «أ» نشوء. «ب» النُّشوء (أح). «ج» نظرية النُّشوء (أح)"
          source: "المورد الحديث (2008)"
    - lemma: "ارتقاء"
      evidence_status: no_material_found
    - lemma: "تطور سلالي"
      confirm:
        - text: "العملية التي يتطور فيها تصاعديا نوع أو جنس ما من الطراز الأصليّ."
          source: "المعجم الموحد لمصطلحات علم الوراثة"

stage3_analysis:
  per_lemma:
    - lemma: "تطور"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشائع جداً للتعبير عن المفهوم (evolution) في علم الأحياء، وموثق في المعاجم اللغوية والعلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَطَوُّر"
    - lemma: "تطور عضوي"
      decision: confirmed
      decision_reason: "مصطلح دقيق يحدد نوع التطور بأنه بيولوجي (organic evolution) تمييزاً له عن التطور الثقافي أو الاجتماعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَطَوُّر عُضْوِيّ"
    - lemma: "نشوء نوعي"
      decision: confirmed
      decision_reason: "ترجمة دقيقة لمصطلح (phylogeny) كما ورد في المعاجم الحديثة والموسوعات العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُشُوء نَوْعِيّ"
    - lemma: "نُشُوء"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مستخدم في الأحياء للدلالة على بداية التطور والتكون كما ورد في المورد الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نُشُوء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13498226-n"}
    - lemma: "اِرْتِقَاء"
      source: stage1
      decision: removed
      decision_reason: "لا يستخدم عادة مستقلاً كمرادف مباشر للتطور في المعاجم العلمية المتاحة، بل يأتي غالباً مقترناً بكلمة النشوء (النشوء والارتقاء)."
      evidence_assessment:
        case: no_material
    - lemma: "تَطَوُّر سُلَالِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد وموثق في معجم الوراثة لترجمة (phyletic evolution)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "تَطَوُّر سُلَالِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13498226-n"}

