# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10580065-n (scientist)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (عَالِم)، والمطلوب إثراؤها بمرادفات إن وُجدت"
      - "التعريف العربي يبدو ترجمة حرفية نسبياً من الإنجليزية ويمكن تحسينه ليكون أكثر عربية"
    observations: >
      المفهوم المطلوب هو شخص ذو معرفة متقدمة في واحد أو أكثر من العلوم، وهو مفهوم أصيل في الثقافة العربية
      إذ كان العلم والعلماء من أركان الحضارة الإسلامية. اللمّة المتوقعة هي «عالِم» على وزن فاعل من عَلِمَ،
      وهي اللفظة الفصيحة الشائعة في العربية المعاصرة والكلاسيكية لهذا المفهوم.
      المفهوم يتميز عن «الباحث» (الذي يركز على فعل البحث) وعن «العلّامة» (صيغة مبالغة تدل على التبحر الشديد).
  blind_candidates:
    - lemma: "عَالِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من عَلِمَ على وزن فَاعِل، وهو اللفظ العربي الأصيل والأشيع للدلالة على المتخصص في العلوم"
    - lemma: "عَلَّامَة"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة من عَلِمَ على وزن فَعَّالة بتاء المبالغة، تدل على العالِم المتبحر جداً في العلوم"
    - lemma: "بَاحِث"
      generation_method: ishtiqaq
      justification: "اسم فاعل من بَحَثَ على وزن فَاعِل، يدل على المجتهد في التعرف على الحقائق والتفتيش عنها"
    - lemma: "عَلِيم"
      generation_method: ishtiqaq
      justification: "صفة مشبهة على وزن فَعِيل من عَلِمَ، تدل على كثير العلم، وقد وردت في المعجم الوسيط بمعنى العالِم"

stage2_evidence:
  per_lemma:
    - lemma: "عَالِم"
      confirm:
        - text: "«عَالِم — من (ع ل م) العارف بالشيء الموقن منه.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«عالِم — scientist — savant»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«عالِم — scientist — savant»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
        - text: "«عالِم — scientist — savant, scientifique»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«العالِم. — scientist»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«العَلِيمُ: العالم»"
          source: "المعجم الوسيط"
          addition: "العليم صفة مشبهة مرادفة للعالم في الوسيط"
        - text: "«العِلْمُ: إدراك الشيء بحقيقته... يطلق العلم حديثاً على العلوم الطبيعية التى تحتاج إلى تجربة ومشاهدة واختبار»"
          source: "المعجم الوسيط"
          addition: "يحدد المجال الدلالي الحديث للعلم بالعلوم التجريبية والطبيعية"

    - lemma: "عَلَّامَة"
      confirm:
        - text: "«عَلَّامة — من (ع ل م) بمعنى عَلَّام، والتاء لتأكيد المبالغة أو للتأنيث.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«وبتشديد اللام مبالغة العالم والتاء للمبالغة ولا تطلق على الله تعالى مع أنه تعالى هو الحقيق بالمبالغة في العلم لتوهم التأنيث»"
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: "«العَلَّام — من علم للمبالغة النَّسَّابة [وتزاد التاء لتأكيد المبالغة. تقول: فلان علَّامة] صفة للمبالغة من عَلِمَ»"
          source: "المعجم الوسيط"
          conflict: "صيغة مبالغة تدل على الكثرة الشديدة في العلم، أعلى درجة من مجرد «عالِم»، فلا تطابق التعريف المحايد للمجموعة"

    - lemma: "بَاحِث"
      confirm:
        - text: "«بَاحِث — من (ب ح ث) المفتش عن الشيء والمجتهد في التعرف على حقيقته.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«باحث — researcher; researchist — chercheur»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«بَاحِث — من (ب ح ث) المفتش عن الشيء والمجتهد في التعرف على حقيقته.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الباحث يركز على فعل البحث والتفتيش، لا على امتلاك معرفة متقدمة بالعلوم؛ والمقابل الإنجليزي researcher لا scientist"

    - lemma: "عَلِيم"
      confirm:
        - text: "«العَلِيمُ: العالم»"
          source: "المعجم الوسيط"
        - text: "«العَلِيمُ: كثير العلم»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«العَلِيمُ: كثير العلم»"
          source: "المعجم الوسيط"
          conflict: "عَلِيم صفة مشبهة عامة تدل على كثرة العلم، وتُستعمل غالباً صفةً لله تعالى، ولا تُستعمل في العربية المعاصرة اسماً مستقلاً بمعنى scientist"

stage3_analysis:
  per_lemma:
    - lemma: "عَالِم"
      decision: confirmed
      decision_reason: >
        اللمّة الأصيلة والأكثر شيوعاً في العربية الفصحى للدلالة على المتخصص في العلوم.
        اسم فاعل من عَلِمَ على وزن فَاعِل، مثبت في جميع المعاجم العربية المعاصرة
        وقواعد المصطلحات الموحدة (ALECSO) مقابلاً لـ scientist.
        التشكيل الموجود (عَالِم بكسر اللام) صحيح ويميزه عن عَالَم (الكون) بفتح اللام.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions: []

    - lemma: "عَلَّامَة"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مبالغة (فَعَّالة) تدل على من بَلَغَ الغاية في العلم والتبحر،
        وهي أعلى رتبةً من عَالِم. تُطلق تقليدياً على العلماء الموسوعيين الكبار
        (كالعلّامة ابن خلدون)، ولا تصلح مرادفاً محايداً لـ scientist.
        تنتمي إلى مجموعة ترادفية مختلفة (polymath / great scholar).

    - lemma: "بَاحِث"
      source: stage1
      decision: removed
      decision_reason: >
        الباحث يدل على من يمارس فعل البحث والتفتيش عن الحقائق،
        وليس بالضرورة ذا معرفة متقدمة بالعلوم. المقابل الإنجليزي الدقيق
        هو researcher لا scientist. ينتمي إلى مجموعة ترادفية مختلفة.
      evidence_assessment:
        case: mixed

    - lemma: "عَلِيم"
      source: stage1
      decision: removed
      decision_reason: >
        صفة مشبهة على وزن فَعِيل تدل على كثرة العلم. تُستعمل في الغالب
        صفةً لله تعالى (العَلِيم)، ولا تُستعمل في العربية المعاصرة
        اسماً مستقلاً للدلالة على scientist. لا تحمل الدلالة التخصصية المطلوبة.
      evidence_assessment:
        case: mixed

stage4_content:
  definition:
    current: "شخص ذو معرفة متقدمة بواحد أو أكثر من العلوم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي سليم المعنى لكنه يبدو ترجمة مباشرة من الإنجليزية.
        يمكن تحسينه بأسلوب أقرب إلى المعاجم العربية مع الحفاظ على الدقة.
    authored:
      - type: terminological
        text: "مَنْ تَخَصَّصَ في عِلْمٍ مِنَ العُلُومِ وبَرَعَ فيه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مَنْ حَذَقَ واحِدًا أو أَكْثَرَ مِنَ العُلُومِ الطَّبِيعِيَّةِ أوِ التَّطْبِيقِيَّةِ أوِ الإنْسانِيَّةِ، واشْتَغَلَ بالبَحْثِ والتَّجْرِبَةِ والاسْتِنْباطِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ تَخَصَّصَ في عِلْمٍ مِنَ العُلُومِ وبَرَعَ فيه"

  examples:
    per_lemma:
      - lemma: "عَالِم"
        examples:
          - text: "حَصَلَ العَالِمُ المِصْرِيُّ عَلَى جَائِزَةِ نُوبِلَ فِي الكِيمِيَاءِ تَقْدِيرًا لِأَبْحَاثِهِ الرَّائِدَةِ."
            type: usage
          - text: "يَسْعَى العُلَمَاءُ إِلَى فَهْمِ أَسْرَارِ الكَوْنِ بِالمُلَاحَظَةِ وَالتَّجْرِبَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "حَصَلَ العَالِمُ المِصْرِيُّ عَلَى جَائِزَةِ نُوبِلَ فِي الكِيمِيَاءِ تَقْدِيرًا لِأَبْحَاثِهِ الرَّائِدَةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يَسْعَى العُلَمَاءُ إِلَى فَهْمِ أَسْرَارِ الكَوْنِ بِالمُلَاحَظَةِ وَالتَّجْرِبَةِ."

