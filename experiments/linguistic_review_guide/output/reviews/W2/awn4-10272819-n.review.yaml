step0_evidence:
  per_lemma:
    - lemma: "أَشْوَل"
      confirm:
        - text: "«من يَسْتَعْمِلُ يُسراه»"
          source: "المعجم الكبير"
    - lemma: "أَعْسَر"
      confirm:
        - text: "«العامل بيُسْراه.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الأعسر) يُقَال هُوَ أعْسر يسر يعْمل بكلتا يَدَيْهِ وَهِي عسراء يسرة وحمام أعْسر بجناحه الْأَيْسَر بَيَاض وَيَوْم أعْسر شَدِيد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "استخدامها مركبة مع 'يسر' للدلالة على من يستخدم كلتا يديه، ومعانٍ أخرى كالشؤم والضيق"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "أَشْدَف"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الأشْدَفُ: مَن يَعْمَلُ بشماله» — المعجم الوسيط"
      justification: "مصطلح فصيح وتراثي مثبت في المعاجم للدلالة على المفهوم بدقة."
    - lemma: "أَيْسَر اليَد"
      source_section: "step5_english_bridge"
      evidence_citation: "«أَيْسَر اليَد: left-handed» — المعجم الطبي الموحد (2009)"
      justification: "التركيب: تركيب إضافي وصفي معتمد في المعاجم الطبية الحديثة، يعبر عن المفهوم بشكل صريح بعيداً عن الاشتراك اللفظي."
  knowledge_candidates:
    - lemma: "عَسْرَاوِيّ"
      justification: "الاشتقاق: اسم منسوب إلى 'عسراء' على غير القياس، شائع في الاستعمال العامي والحديث كمرادف للأعسر، ولكنه أقل فصاحة."
  generation_notes: "تم استخراج 'أشدف' من المعاجم الكلاسيكية و'أيسر اليد' من المعاجم العلمية المتخصصة لتوفير بدائل دقيقة."

step1_lemma_validation:
  per_lemma:
    - lemma: "أَشْوَل"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل بكثرة في السياقات العامة، وأثبته 'المعجم الكبير' للمعنى المقصود."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أقل رسمية من 'أعسر' وأكثر تداولاً في السياقات المعاصرة، ويختص بالاستخدام الغالب لليد اليسرى."
      example: "يُعتبر الملاكم الأشول خصماً صعباً في الحلبة."
      
    - lemma: "أَعْسَر"
      decision: confirmed
      decision_reason: "هو المصطلح الأصح والأكثر شيوعاً واستقراراً في التراث والمعاجم الحديثة للدلالة على من يعتمد على يده اليسرى."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح القياسي والرسمي، ويتميز بإمكانية تركيبه مع 'يسر' (أعسر يسر) للدلالة على الشخص الأضبط (من يستخدم كلتا يديه)."
      example: "وجد الطالب الأعسر صعوبة في استخدام المقصات العادية المخصصة لليد اليمنى."

    - lemma: "أَشْدَف"
      source: step05
      decision: confirmed
      decision_reason: "لفظ تراثي فصيح ومثبت في المعاجم القديمة والحديثة، ويحقق معايير الجودة اللغوية."
      step05_citation: "«الأشْدَفُ: مَن يَعْمَلُ بشماله» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مترادف كلاسيكي نادر الاستعمال في العصر الحديث مقارنة بـ 'أعسر'، يحمل طابعاً تراثياً بحتاً."
      example: "كان الفارس الأشدف يمسك سيفه بيسراه غير مبالٍ بقواعد القتال المألوفة."
      actions:
        - command: create_entry
          params:
            lemma: "أَشْدَف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10272819-n"

    - lemma: "أَيْسَر اليَد"
      source: step05
      decision: confirmed
      decision_reason: "تركيب إضافي ثابت ومعتمد في المعاجم الطبية الحديثة، يعبر عن المفهوم بوضوح ويزيل أي لبس دلالي."
      step05_citation: "«أَيْسَر اليَد: left-handed» — المعجم الطبي الموحد (2009)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح تركيبي يغلب استخدامه في السياقات الطبية والعلمية لوصف الحالة التشريحية بدقة دون الاعتماد على مفردات قد تحمل إيحاءات أخرى كالشؤم والضيق (كما في أعسر)."
      example: "أشارت الدراسة إلى أن نسبة الأشخاص من فئة أيسر اليد تبلغ نحو عشرة بالمئة من السكان."
      actions:
        - command: create_entry
          params:
            lemma: "أَيْسَر اليَد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10272819-n"

  added_lemmas:
    - lemma: "أَشْدَف"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "أَيْسَر اليَد"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

