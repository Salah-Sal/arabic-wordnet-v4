stage1_review:

  # أُنجزَ التوليد الأعمى أولاً من الملف المُقنَّع (بدون لمّات)
  # ثم قُرئ الملف الكامل لإنجاز التقييم
  blind_candidates:
    - lemma: "حُنْكَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من جذر ح-ن-ك على وزن فُعْلَة. أصل الحَنَك هو أقصى الفم؛ ثم استُعير المصدر
        للتعبير عن بلوغ الغاية في الأمر بفعل التجارب والسنين. يُقال «حَنَّكَتْهُ التجاربُ»
        أي نضَّجَتْهُ وأكملَتْهُ. تجمع الكلمة بين وصف «المحارب القديم» (الشيخ العتيق) و«الخبير»
        (صاحب البصيرة في الأمور) في مصطلح واحد، مما يجعلها أدق تمثيلاً للمفهوم الكلي.

    - lemma: "رُسُوخ"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر ر-س-خ على وزن فُعُول، يدل على الثبات والتمكن. «الراسخُ في العلم»
        هو المتمكن منه المستقر فيه الذي لا تعترضه شبهة. يُعبّر عن حالة الشخص الذي تجاوز
        مرحلة التعلم إلى مرحلة التمكن الراسخ، وهو ما يصف جانب «الخبير» من التعريف.

    - lemma: "دُرْبَة"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر د-ر-ب على وزن فُعْلَة. أصله في المقاييس: «أن يُغرى بالشيء ويلزمه»،
        ومنه تسمية العادة والتجربة «دُرْبة». في المعاجم: «التجربة والمران لإتقان العمل».
        تُعبّر عن المهارة الراسخة المكتسبة بالمران المتواصل، وهو وصف الخبير الذي تمرّس بفنّه.

    - lemma: "مِرَاس"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر م-ر-س على وزن فِعال. الأصل في المقاييس: «مُضامَّة شيء لشيء بشدة وقوة»؛
        ومنه «فحلٌ مَرَّاس» و«رجل مَرِس: ذو جَلَد». يُقال: «فلان ذو مِرَاس: جَلَد وقوة
        ومُمارسة للأمور». يُبرز جانب الصمود والمثابرة اللذين يميّزان المحارب القديم.

  assessment:
    concerns:
      - "اللمّتان الموجودتان (أقدمية وخبرة) تُغطّيان وجهَيْن مختلفَيْن من التعريف دون جامع مشترك صريح: أقدمية تُعبّر عن السبق الزمني في الخدمة، وخبرة تُعبّر عن المعرفة العميقة المكتسبة — والتعريف يربطهما بـ«أو» مما يُنبئ بمفهوم أوسع يجمعهما"
      - "غياب التشكيل الكامل عن اللمّتَيْن الموجودتَيْن"
      - "أقدمية مصطلحٌ إداري-قانوني أولاً (يُستخدم في سياق «ترقية بالأقدمية»)، ولا يُعبّر مباشرةً عن صفة المحارب القديم بوصفها خاصية جوهرية"
      - "التعريف الحالي يبدو ترجمةً مباشرةً للتعريف الإنجليزي؛ وتعبير «حالة أو شرط كون الشخص» غير طبيعي في المعجمية العربية"
    observations: >
      المجموعة تُمثّل مفهوماً مجرّداً هو «الخاصية المكتسبة من طول الممارسة الحربية أو
      المهنية». في العربية لهذا المفهوم تعبيرات متنوّعة: ما يُبرز السبق والأقدمية (أقدمية)،
      وما يُبرز المعرفة العميقة (خبرة)، وما يجمعهما في صورة الحكمة المكتسبة بالتجربة (حُنكة).
      الجذر قدم يدل على السبق والتقدم، والجذر خبر يدل على العلم والاختبار، وكلاهما وارد في
      التعريف. كلمة «حُنكة» في المعجمية العربية تجمع بين معنيَيْ العراقة الزمنية والتجربة
      المكتسبة بمرور السنين، وشواهدها الشعرية القديمة تُثبت استخدامها في هذا المعنى الجامع.
      اللمّتان الموجودتان صحيحتان لكنهما بحاجة إلى ضبط بالتشكيل وتكملة بما يُعبّر عن
      الجانب الجامع بين الوجهين.


