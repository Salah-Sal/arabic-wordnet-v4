      mwe: false
    - lemma: "أَقَارِب"
      sense_id: "{auto}"
      nuance: "يركز على صلة الدم والمصاهرة بشكل مباشر."
      mwe: false
    - lemma: "آل"
      sense_id: "{auto}"
      nuance: "يُستخدم غالباً للدلالة على سلالة شخص مرموق أو أتباعه المقربين."
      mwe: false
    - lemma: "أُسْرَة"
      sense_id: "{auto}"
      nuance: "يدل على الدائرة الضيقة من الأقارب الذين يشكلون وحدة متماسكة (تاريخياً: الرهط، وحديثاً: العائلة)."
      mwe: false
    - lemma: "عَشِيرَة"
