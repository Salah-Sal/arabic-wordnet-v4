stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (عشيرة، قبيلة) تشير إلى وحدات اجتماعية أكبر من مجرد 'مجموعة من الأقارب' (kin group)."
      - "اللمّة (قرابة) تعبّر عن العلاقة المجرّدة أكثر من كونها اسماً للمجموعة البشرية، وإن كانت تُستعمل جمعاً."
    observations: "المجموعة تغطي مفهوم الجماعة التي تربطها أواصر الدم والمصاهرة. اللمّات الحالية تركز على التنظيم القبلي (عشيرة، قبيلة)، بينما يفتقر السينست للمصطلحات العامة الشاملة مثل (أهل) و(أقارب)."
  blind_candidates:
    - lemma: "أَهْل"
      generation_method: ishtiqaq
      justification: "اللفظ العربي الأصيل والأعمّ للأقارب وعشيرة الرجل وأخص الناس به."
    - lemma: "أَقَارِب"
      generation_method: ishtiqaq
      justification: "جمع (قريب)، وهو المصطلح الشائع والمباشر لمن يجمعهم نَسَب أو صهر."
    - lemma: "آل"
      generation_method: ishtiqaq
      justification: "تُستعمل للأهل والأتباع، وغالباً ما تُضاف إلى اسم عَلَم لتدل على سلالته أو أهل بيته."
    - lemma: "أُسْرَة"
      generation_method: ishtiqaq
      justification: "رهط الرجل وعشيرته الأدنيين الذين يتقوى بهم، وتُستعمل حالياً للعائلة."

stage2_evidence:
  per_lemma:
    - lemma: "عَشِيرَة"
      confirm:
        - text: "«عشيرة الرجل بنو أبيه الأقربون وقبيلته»"
          source: "المعجم الوسيط"
        - text: "«العشيرة: أهل الرجل الذين يتكثر بهم أي يصيرون له بمنزلة العدد الكامل»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "قَبِيلَة"
      confirm:
        - text: "«الجماعة من الناس تنتسب إلى أب أو جد واحد»"
          source: "المعجم الوسيط"
    - lemma: "قَرَابَة"
      confirm:
        - text: "«شيعتي وانصاري واهلي وخاصتي ولحمتي واسرتي وعشيرتي ورهطي وعترتي وقومي ورحمي وَقَرَابَتِي»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة"
      expands:
        - text: "«القرابة: صلة النسب»"
          source: "معجم الصواب اللغوي"
          addition: "يؤكد أن الأصل في اللفظ هو العلاقة (الصلة) ولكن يُستخدم للمجموعة."
    - lemma: "أَهْل"
      confirm:
        - text: "«أهل الرجل: عشيرته وذوو قرباه من يجمعهم بالإنسان نَسَب أو دين»"
          source: "المعجم الكبير"
        - text: "«أهل الرجل: أخص الناس به»"
          source: "مقاييس اللغة"
    - lemma: "أَقَارِب"
      confirm:
        - text: "«الأقارب: الأهل والعشيرة والزوجة»"
          source: "المعجم الوسيط (تحت مادة أهل)"
    - lemma: "آل"
      confirm:
        - text: "«آل الرجل: أهله وعياله وأتباعه وأنصاره»"
          source: "المعجم الوسيط"
        - text: "«آل الرجل: أهل بيته... لأن إليه مآلهم وإليهم مآله»"
          source: "مقاييس اللغة"
    - lemma: "أُسْرَة"
      confirm:
        - text: "«أهل بيت الإنسان وعشيرته الأدنون»"
          source: "المعجم الكبير"
        - text: "«الأسرة: أهل الرجل وعشيرته»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "عَشِيرَة"
      decision: confirmed
      decision_reason: "مصطلح أصيل يدل على جماعة الأقارب، وإن كان غالباً ما يُستخدم لوحدة اجتماعية أوسع من الأسرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَشِيرَة"
    - lemma: "قَبِيلَة"
      decision: confirmed
      decision_reason: "تدل على جماعة من الناس يجمعهم نسب واحد، وهي مرادفة لـ tribe في السياق الاجتماعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَبِيلَة"
    - lemma: "قَرَابَة"
      decision: confirmed
      decision_reason: "تُستخدم دلالة على الجماعة التي تربطها صلة النسب، وهي مقابلة لمفهوم kinship group."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَرَابَة"
    - lemma: "أَهْل"
      source: stage1
      decision: confirmed
      decision_reason: "اللفظ الأساسي والأشمل في العربية للدلالة على الأقارب والذين يجمعهم بيت أو نسب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَهْل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07986142-n"
    - lemma: "أَقَارِب"
      source: stage1
      decision: confirmed
      decision_reason: "جمع (قريب)، وهو اللفظ الشائع والمباشر في اللغة المعاصرة والقديمة للدلالة على مجموعة الأشخاص ذوي الصلة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَقَارِب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07986142-n"
    - lemma: "آل"
      source: stage1
      decision: confirmed
      decision_reason: "تدل على الأهل والأتباع، وهي ثابتة معجمياً وقرآنياً في هذا المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "آل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07986142-n"
    - lemma: "أُسْرَة"
      source: stage1
      decision: confirmed
      decision_reason: "تدل على الرهط والعشيرة الأدنون، وهي المصطلح الحديث للأقارب الذين يجمعهم بيت واحد أو نسب قريب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أُسْرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07986142-n"

stage4_content:
  definition:
    current: "مجموعة من الناس يرتبطون بالدم أو الزواج"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح دلالياً، ولكن يمكن صياغته بأسلوب معجمي أكثر رصانة يجمع بين المصطلحات التراثية والوضوح."
    authored:
      - type: terminological
        text: "جماعةٌ من الناس يجمعهم نَسَبٌ أو مُصَاهَرَة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07986142-n"
          definition_index: 0
          text: "جماعةٌ من الناس يجمعهم نَسَبٌ أو مُصَاهَرَة"
  examples:
    per_lemma:
      - lemma: "أَهْل"
        examples:
          - text: "حضر أهلُ الميتِ جميعاً لتقبل العزاء."
            type: usage
      - lemma: "أَقَارِب"
        examples:
          - text: "صلةُ الأقاربِ من الواجباتِ الاجتماعيةِ والدينية."
            type: usage
      - lemma: "عَشِيرَة"
        examples:
          - text: "«وَأَنذِرْ عَشِيرَتَكَ الْأَقْرَبِينَ»"
            type: quran
            source: "الشعراء: 214"
      - lemma: "آل"
        examples:
          - text: "«إِنَّ اللَّهَ اصْطَفَىٰ آدَمَ وَنُوحًا وَآلَ إِبْرَاهِيمَ وَآلَ عِمْرَانَ عَلَى الْعَالَمِينَ»"
            type: quran
            source: "آل عمران: 33"
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "حضر أهلُ الميتِ جميعاً لتقبل العزاء."

stage5_enrichment:
  per_entry:
    - lemma: "أَهْل"
      entry_id: "{auto}"
      root: "أهل"
      maqayis_quote: "«الْهَمْزَةُ وَالْهَاءُ وَاللَّامُ أَصْلَانِ مُتَبَاعِدَانِ، أَحَدُهُمَا الْأَهْلُ... وَأَهْلُ الرَّجُلِ أَخَصُّ النَّاسِ بِهِ.»"
    - lemma: "أَقَارِب"
      entry_id: "{auto}"
      root: "قرب"
      maqayis_quote: "«الْقَافُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الْبُعْدِ... وَفُلَانٌ ذُو قَرَابَتِي، وَهُوَ مَنْ يَقْرُبُ مِنْكَ رَحِمًا.»"
    - lemma: "آل"
      entry_id: "{auto}"
      root: "أول"
      maqayis_quote: "«الْهَمْزَةُ وَالْوَاوُ وَاللَّامُ أَصْلَانِ... وَآلُ الرَّجُلِ أَهْلُ بَيْتِهِ... لِأَنَّ إِلَيْهِ مَآلُهُمْ وَإِلَيْهِمْ مَآلُهُ.»"
    - lemma: "أُسْرَة"
      entry_id: "{auto}"
      root: "أسر"
      maqayis_quote: "«الْهَمْزَةُ وَالسِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ... وَأُسْرَةُ الرَّجُلِ رَهْطُهُ، لِأَنَّهُ يَتَقَوَّى بِهِمْ.»"
    - lemma: "عَشِيرَة"
      entry_id: "{auto}"
      root: "عشر"
      maqayis_quote: "«الْعَيْنُ وَالشِّينُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ... وَإِنَّمَا سُمِّيَتْ عَشِيرَةُ الرَّجُلِ لِمُعَاشَرَةِ بَعْضِهِمْ بَعْضًا.»"
    - lemma: "قَبِيلَة"
      entry_id: "{auto}"
      root: "قبل"
      maqayis_quote: "«الْقَافُ وَالْبَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ تَدُلُّ كَلِمُهُ كُلُّهَا عَلَى مُوَاجَهَةِ الشَّيْءِ لِلشَّيْءِ... وَبِذَلِكَ سُمِّيَتْ قَبَائِلُ الْعَرَبِ.»"
    - lemma: "قَرَابَة"
      entry_id: "{auto}"
      root: "قرب"
      maqayis_quote: "«الْقَافُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الْبُعْدِ... وَالْقُرْبَةُ وَالْقُرْبَى: الْقَرَابَةُ.»"
  per_sense:
    - lemma: "أَهْل"
      sense_id: "{auto}"
