stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة هي صيغ جمع، وهذا يتوافق مع اللمة الإنجليزية (peoples) التي تأتي بصيغة الجمع للدلالة على جماعات بشرية متعددة."
      - "التعريف الحالي يستخدم كلمة 'أمة' وهي جزء من اللمة 'أمم'، مما قد يوحي بالدورانية، لكنه مقبول في سياق الشرح."
    observations: "المجموعة تغطي مفهوماً جماعياً واسعاً. المصطلحين 'أمم' و'شعوب' هما الركنان الأساسيان لهذا المفهوم في العربية، حيث ورد ذكرهما في القرآن الكريم وفي المعاجم القانونية والسياسية الحديثة."
  blind_candidates:
    - lemma: "شُعُوبٌ"
      generation_method: ishtiqaq
      justification: "جمع 'شَعْب'، وهو المصطلح الأكثر شيوعاً للتعبير عن الجماعات البشرية المتميزة ثقافياً وعرقياً."
    - lemma: "أُمَمٌ"
      generation_method: ishtiqaq
      justification: "جمع 'أُمَّة'، ويشير إلى الجماعات التي يجمعها دين أو تاريخ أو طموح سياسي مشترك."
    - lemma: "أَقْوَامٌ"
      generation_method: ishtiqaq
      justification: "جمع 'قَوْم'، وهو لفظ تراثي واسع الدلالة على الجماعات البشرية."
    - lemma: "إِثْنِيَّاتٌ"
      generation_method: taarib
      justification: "تعريب للمصطلح العالمي (Ethnics/Ethnicities) للإشارة خصيصاً للمجموعات العرقية المذكورة في التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "أُمَمٌ"
      confirm:
        - text: "(فى القانون): جماعة من الناس تجمعهم عناصر مشتركة كوحدة الأصل واللغة والعقيدة والتراث الفكرى، مما يجعلهم وحدة حضارية واحدة."
          source: "المعجم الكبير"
        - text: "الأُمَّةُ: الجماعةُ. قال الأخفش: هو في اللفظ واحدٌ وفي المعنى جمعٌ. وكلُّ جنس من الحيوان أُمَّةُ."
          source: "الصحاح في اللغة"
    - lemma: "شُعُوبٌ"
      confirm:
        - text: "الشعوب الأصلية: Indigenous Peoples."
          source: "ArabTerm"
        - text: "الشَّعْبُ: مَا تَشَعَّبَ مِنْ قَبَائِلِ الْعَرَبِ وَالْجَمَعِ، وَالْجَمْعُ شُعُوبٌ. قَالَ جَلَّ ثَنَاؤُهُ: {وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ}."
          source: "مقاييس اللغة"
    - lemma: "أَقْوَامٌ"
      confirm:
        - text: "الْقَوْمُ: جَمَاعَةُ نَاسٍ... وَيَقُولُونَ: قَوْمٌ وَأَقْوَامٌ."
          source: "مقاييس اللغة"
    - lemma: "إِثْنِيَّاتٌ"
      confirm:
        - text: "إثنية: عرقية."
          source: "المعجم المعاصر"

stage3_analysis:
  per_lemma:
    - lemma: "أمم"
      decision: confirmed
      decision_reason: "مصطلح أصيل ومركزي، ويغطي الجانب السياسي والحضاري للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُمَمٌ"
    - lemma: "شعوب"
      decision: confirmed
      decision_reason: "مصطلح أصيل ومركزي، ويغطي الجانب العرقي والثقافي للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شُعُوبٌ"
    - lemma: "أَقْوَامٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح وواسع الاستخدام في النصوص التراثية والمعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أَقْوَامٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "إِثْنِيَّاتٌ"
      source: stage1
      decision: confirmed
      decision_reason: "يغطي بدقة جانب 'المجموعة العرقية' الوارد في التعريف، وهو مصطلح تقني معتمد في العلوم الاجتماعية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِثْنِيَّاتٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "البشر الذين ينتمون إلى أمة أو مجتمع أو مجموعة عرقية معينة"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط، ويفضل صياغته بأسلوب معجمي يبرز الروابط الجامعة."
    authored:
      - type: terminological
        text: "جماعات من البشر تجمعهم روابط مشتركة كاللغة أو الدين أو العرق أو الوطن، وتشكل وحدة اجتماعية أو سياسية متميزة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "جماعات من البشر تجمعهم روابط مشتركة كاللغة أو الدين أو العرق أو الوطن، وتشكل وحدة اجتماعية أو سياسية متميزة."}
  examples:
    per_lemma:
      - lemma: "أُمَمٌ"
        examples:
          - text: "تتعاون الأمم في سبيل تحقيق الأمن والسلم الدوليين."
            type: usage
      - lemma: "شُعُوبٌ"
        examples:
          - text: "تتميز شعوب العالم بتنوع ثقافاتها ولغاتها وتقاليدها."
            type: usage
      - lemma: "أَقْوَامٌ"
        examples:
          - text: "هاجرت أقوام كثيرة بحثاً عن الموارد الطبيعية والأراضي الخصبة."
            type: usage
      - lemma: "إِثْنِيَّاتٌ"
        examples:
          - text: "تعيش في هذه المنطقة إثنيات متعددة في جو من التسامح والتعايش."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "أُمَمٌ"
      entry_id: "{auto}"
      root: "أمم"
      maqayis_quote: "«الْهَمْزَةُ وَالْمِيمُ فَأَصْلٌ وَاحِدٌ، يَتَفَرَّعُ مِنْهُ أَرْبَعُ أَبْوَابٍ، وَهِيَ الْأَصْلُ وَالْمَرْجِعُ وَالْجَمَاعَةُ وَالدِّينُ.»"
