# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-14481629-n  |  ILI: i112992
# الموضوع: حالة النعمة الإلهية (اللاهوت المسيحي)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل المطلوب."
      - "حالة النعمة مُركَّب وصفي-إضافي لا يرد في المعجمية الكلاسيكية ويُعدّ ترجمةً حرفيةً لـ state of grace؛ مقبول كمصطلح اصطلاحي حديث لكنه يستوجب التحقق."
      - "التعريف العربي الحالي يستخدم «التقديس من قبل الله» وهي صياغة ركيكة؛ الأفصح: «نيل تقديس الله ورضاه»."
      - "«يخضع لمثل هذا التأثير الإلهي» ترجمة حرفية بالية؛ الأسلوب المعجمي يستوجب إعادة الصياغة."
      - "المفهوم خاصٌّ باللاهوت المسيحي، وقد يلتبس مع لفظ «النعمة» في الاستخدام الإسلامي."
    observations: >
      المجموعة تُمثِّل مصطلحاً لاهوتياً مسيحياً دقيقاً (state of grace)، وهو حالة روحية
      معترَف بها في العقيدة المسيحية تتحدد بموقف الإنسان من الله وسريان نعمته المقدِّسة عليه.
      اللمّة «نعمة» راسخة معجمياً في الدلالة على العطاء الإلهي بوجه عام، غير أنها متعددة
      الدلالات (نعمة الله في الإسلام، النعمة المادية، والنعمة اللاهوتية). أما «حالة النعمة»
      فتخصِّص الدلالة وتحصرها في البُعد الوجودي-الروحي للمصطلح المسيحي. الجذر نعم في
      مقاييس اللغة يدل على «ترفُّه وطيب عيش وصلاح» مما يدعم قرب المفهوم من الوجدان العربي،
      لكن التخصيص اللاهوتي المسيحي يجعل من «حالة النعمة» مصطلحاً مستقلاً يستوجب حفظه.

  blind_candidates:
    - lemma: "التَّقْدِيسُ"
      generation_method: ishtiqaq
      justification: >
        مصدر الباب الثاني من جذر ق-د-س الذي يدل على الطهر؛ واللغة تستعمله في معنى التطهير
        الإلهي، فيصلح مبدئياً للتعبير عن حالة «التقديس من قِبَل الله».
    - lemma: "الحُظْوَةُ الإِلَهِيَّة"
      generation_method: tarkib
      justification: >
        مُركَّب إضافي-وصفي: الحُظْوَة (المكانة والمنزلة) + الإلهيّة؛ يُعبِّر عن حالة حُظوة
        الإنسان عند الله وقَبوله، مستلهَماً من التعبير العربي «يلقى حظوةً عند فلان».
    - lemma: "النَّوَالُ الرَّبَّانِيّ"
      generation_method: tarkib
      justification: >
        مُركَّب وصفي: النَّوَال (العطاء والمِنحة) + الربّاني؛ تستند إلى تعريف النَّوال الصوفي
        «ما ينيله الحق أهل القرب من خلع الرضا»، وتقابل دلالة grace الإنجليزية في سياقها
        الروحاني تقابلاً دقيقاً.
    - lemma: "التَّبَرُّكُ"
      generation_method: ishtiqaq
      justification: >
        مصدر تفعُّل من ب-ر-ك الذي يدل على الثبات والبركة؛ «تبرَّك به: تيمَّن به» قد يُوحي
        بدلالة نيل البركة الإلهية، لكنه يبقى احتمالاً يستوجب اختبار الأدلة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "حالة النعمة"
      evidence_status: "no_material_found"
      # المُركَّب الإضافي «حالة النعمة» لا يرد بوصفه وحدةً معجمية في أيٍّ من مصادر قاعدة البيانات.
      # البحث بالصورتين (مع ال- وبدونها) لم يُسفر عن نتيجة.

    - lemma: "نعمة"
      confirm:
        - text: "«(1) نِعمة إلهيّة... by the grace of God: بنعمة الله. to be in the good graces of: يَلْقى حظوة عند فلان»"
          source: "المورد الحديث (2008)"
        - text: "«النِّعْمَةُ: مَا يُنْعِمُ اللَّهُ تَعَالَى عَلَى عَبْدِهِ بِهِ مِنْ مَالٍ وَعَيْشٍ. يُقَالُ: لِلَّهِ تَعَالَى عَلَيْهِ نِعْمَةٌ. وَالنِّعْمَةُ: الْمِنَّةُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«النعمة: المنفعة المفعولة على جهة الإحسان إلى الغير»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«النعمة: هي ما يقصد به الإحسان والنفع لا لغرض ولا لعوض»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«النِّعْمَة: هي ما قُصد به الإحسان والنفع لا لغرض ولا لعوض»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«(النِّعْمَة) ما أنعم به من رزق ومال وغيره والحال الحسنة والصنيعة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«نِعْمَةٌ: الحالُ الحسَنَة الصَّنيعة. يقال: لك عندى نِعمةٌ لا تُنكَر: مِنَّةٌ وفَضْلٌ»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«النِّعْمَةُ: مَا كَانَت عَاقبَتهَا محمودة»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يُضيف بُعداً غائياً: النعمة الحقيقية ما كانت عاقبتها محمودة، وهو ما يدعم تخصيصها بالنعمة المُوصِلة إلى الخلاص."
        - text: "«النِّعْمَة: فِي تَعْرِيف الْحَمد اللّغَوِيّ هِيَ الفاضلة الَّتِي جمعه الفواضل وَمَعْنَاهَا الْعَطِيَّة المتعدية»"
          source: "دستور العلماء للأحمدنكري"
          addition: "يُبرز الطابع التعديّ (المُتجاوِز للذات) للنعمة، مما يدعم دلالتها على الفيض الإلهي المنبثق نحو الإنسان."

    - lemma: "التقديس"
      contradicts:
        - text: "«التقديس: في اللغة: التطهير، وفي الاصطلاح: تنزيه الحق عن كل ما لا يليق بجنابه، وعن النقائص الكونية مطلقًا»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: >
            التقديس اصطلاحاً هو فعلٌ يصدر عن الإنسان نحو الله (تنزيه الحق)، لا حالةٌ تَصدر
            عن الله نحو الإنسان؛ وهو عكس المعنى المطلوب (state of grace = حالة الإنسان تحت
            الفيض الإلهي).
        - text: "«التقديس: لغة، التطهير، وعرفا، تنزيه الحق عن كل ما لا يليق بجنابه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            يؤكد المعنى السابق: التقديس تنزيهٌ يتجه من الإنسان إلى الله، لا العكس.

    - lemma: "الحظوة الإلهية"
      expands:
        - text: "«(الحُظْوَة، الحِظْوَة): المَكانةُ والمَنْزِلَةُ لَدَى ذِي سُلْطَانٍ ونحوِه»"
          source: "المعجم الكبير (OCR)"
          addition: >
            الحُظوة بمعنى المكانة لدى ذي سلطان تقترب نسبياً من «الحظوة الإلهية»، إذ المعنى
            المطلوب هو مكانة الإنسان عند الله. غير أن المُركَّب «الحظوة الإلهية» لم يرد
            بوصفه وحدة معجمية ثابتة.
        - text: "«to be in the good graces of: يَلْقى حظوةً عند فلان»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت التعادل الدلالي بين «حظوة عند» والتعبير الإنجليزي «in the grace of»، مما يدعم جانباً من الدلالة."

    - lemma: "النوال الرباني"
      expands:
        - text: "«النوال: [في الإنجليزية] Gift، present، favour، grace [في الفرنسية] Don، faveur، grace. بالفتح هو: الإنعام والصواب. والنَّوالة في اصطلاح الصوفية شيء يكرم به الحق أهل القرب من خلع الرضا»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: >
            النوال يُعادل «grace» بالإنجليزية والفرنسية تصريحاً عند التهانوي، وتعريفه الصوفي
            «ما ينيله الحق أهل القرب من خلع الرضا» يتطابق بدقة مع مفهوم النعمة الإلهية.
            غير أن «النوال الرباني» كمُركَّب ثابت لم يرد في المصادر المستعلَمة.
        - text: "«النوال: ما ينيله الحق أهل القرب من خلع الرضا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُعزز الدلالة الصوفية للنوال بوصفه منحةً إلهية لأهل القرب، بما يوازي مفهوم «state of grace» جوهرياً."

    - lemma: "التبرك"
      contradicts:
        - text: "«تبرك بالمكان: أقام. وتِبراك: موضع، مشتق منه»"
          source: "لسان العرب لابن منظور"
          conflict: "المعنى الأصيل للتبرك هو الإقامة في مكان، لا نيل البركة الإلهية."
        - text: "«تَبْرَكَ بالمكانِ: أقامَ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "يُؤكد أن الاستخدام الأساسي للجذر في هذا الباب دالٌّ على الإقامة لا على نيل البركة الإلهية."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حالة النعمة"
      decision: confirmed
      decision_reason: >
        المُركَّب الإضافي «حالة النعمة» ترجمةٌ اصطلاحية ثابتة لـ «state of grace» في الأدبيات
        المسيحية العربية المعاصرة، ويمرّ اختبار السكّ: لا يمكن إبدال «النعمة» بـ «الرحمة» أو
        «المِنَّة» مع الإبقاء على المدلول اللاهوتي بعينه. يُضاف إلى ذلك غياب بديل مفردٍ موثَّق
        يُعبِّر عن هذه الحالة اللاهوتية المحددة، مما يجعل المُركَّب ضرورةً معجمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُخصِّص الحالة الروحية الكاملة وضعاً وجودياً: الإنسان يكون أو لا يكون «في حالة النعمة»؛
        يُركِّز على المَرتبة الدينية الرسمية كما تُعرِّفها العقيدة المسيحية، وهو أدق وأوسع من
        مجرد «النعمة» التي تدل على العطاء الإلهي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حالَةُ النِّعْمَة"

    - lemma: "نعمة"
      decision: confirmed
      decision_reason: >
        مُفردة عربية أصيلة موثَّقة في المعجمية الكلاسيكية والحديثة بمعنى العطاء الإلهي والمِنَّة
        الربانية. يُثبت المورد الحديث تعادلها مع «grace» الإنجليزية بالمعنى اللاهوتي الأول
        «(1) نِعمة إلهيّة»، وعبارة «by the grace of God: بنعمة الله» دليلٌ على رسوخها في
        هذا الاستخدام. الجذر نعم في مقاييس اللغة يدل على «ترفُّه وطيب عيش وصلاح».
        تحتاج إلى تشكيل: نِعْمَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُعبِّر عن النعمة الإلهية بوصفها هِبةً وعطاءً مطلَقاً؛ لها استخدام واسع في السياقَين
        الإسلامي والمسيحي، وهي الوحدة المعجمية الأساسية للمصطلح. تختلف عن «حالة النعمة»
        في أنها تُسمِّي النعمةَ نفسها، لا الحالةَ التي يكون عليها صاحبها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِعْمَة"

    - lemma: "التقديس"
      source: stage1
      decision: removed
      decision_reason: >
        التقديس اصطلاحاً هو تنزيه الإنسان لله عن النقائص (فعلٌ يصدر عن الإنسان نحو الله)،
        وهو عكسُ المعنى المطلوب؛ إذ المجموعة تصف حالة الإنسان الّذي يتلقّى التقديسَ والفيضَ
        من الله. التضادُّ في الاتجاه الدلالي يجعل هذا المرشح غير صالح.
      evidence_assessment:
        case: contradicts_only

    - lemma: "الحظوة الإلهية"
      source: stage1
      decision: removed
      decision_reason: >
        «الحُظوة» تدل على المكانة والمنزلة، وهي دلالة صحيحة جزئياً، لكن المُركَّب «الحظوة
        الإلهية» لم يرد بوصفه وحدةً معجمية ثابتة في أي مصدر مستعلَم، ويفشل اختبار التثبيت
        المعجمي. علاوةً على ذلك يمكن إبدال «الإلهية» بـ «الربانية» أو «الإلهية» مع بقاء
        الوصف صالحاً، مما يُثبت أنه وصفٌ حر لا مصطلح سكَّه.
      evidence_assessment:
        case: no_material

    - lemma: "النوال الرباني"
      source: stage1
      decision: removed
      decision_reason: >
        «النَّوال» موثَّق بمعنى «grace/favour» عند التهانوي، وتعريفه الصوفي دقيقٌ دلالياً،
        لكن المُركَّب «النوال الرباني» لم يرد بوصفه وحدة معجمية مسجَّلة، ويفتقر إلى التثبيت
        المعجمي اللازم لإدراجه في الشبكة الدلالية. يُوصى بالإشارة إليه في الحاشية.
      evidence_assessment:
        case: no_material

    - lemma: "التبرك"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى الأصيل للجذر في هذا الباب «الإقامة في مكان» (تبرَّك بالمكان: أقام) وفي معنى
        آخر «تيمَّن به»، وكلاهما بعيدٌ عن مفهوم «حالة النعمة اللاهوتية». التبرك لا يحمل
        المعنى الوجودي الروحي المطلوب.
      evidence_assessment:
        case: contradicts_only


