# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06525615-n
# memorial — مُذَكِّرَة الْتِمَاس
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (مُذَكِّرَة الْتِمَاس)، وهو مركب إضافي يحتاج تأكيد تثبيته المعجمي"
      - "التعريف العربي ترجمة حرفية تقريباً من الإنجليزية، يحتاج صياغة معجمية أصيلة"
      - "المفهوم قانوني تخصصي (memorial بمعناه القانوني) قد يختلط بالمعنى التذكاري العام"
    observations: "المجموعة تصف وثيقة قانونية تُقدَّم مُرفَقةً بالتماسٍ إلى جهة مختصة، تتضمن بياناً بالوقائع والحقائق. هذا المفهوم يقع في المجال القانوني الإجرائي، وله مقابلات عربية في مصطلحات المرافعات والقضاء. اللمّة الحالية مركب إضافي يربط بين «مذكرة» (وثيقة بيانية) و«التماس» (طلب قانوني)، وهو تركيب منطقي لكنه يحتاج تحققاً من استعماله الفعلي."
  blind_candidates:
    - lemma: "مُذَكِّرَة"
      generation_method: ishtiqaq
      justification: "من الجذر «ذكر» على وزن مُفَعِّلَة، مصطلح قانوني راسخ في العربية المعاصرة يدل على بيان مكتوب يُشرح فيه بعض المسائل ويُقدَّم إلى القاضي، كما نصّ المعجم الوسيط. يشمل المذكرات القانونية والإيضاحية والدبلوماسية."
    - lemma: "رَفِيعَة"
      generation_method: majaz
      justification: "لفظ تراثي من الجذر «رفع» ورد في التاج والمصباح بمعنى القصة يُبلِّغها الرجل ويرفعها على العامل، وهو مجاز من رفع الأمر إلى السلطة. إحياء لفظ كلاسيكي للدلالة على وثيقة تُرفع إلى جهة عليا."
    - lemma: "صَحِيفَةُ وَقَائِع"
      generation_method: tarkib
      justification: "مركب إضافي من «صحيفة» (وثيقة مكتوبة) و«وقائع» (حقائق وأحداث)، يصف المحتوى المادي للوثيقة باعتبارها بياناً مكتوباً بالحقائق."
    - lemma: "مُذَكِّرَةٌ إِيضَاحِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «مذكرة» و«إيضاحية»، مصطلح قانوني مُثبت في المعجم الموحد لمصطلحات القانون بمعنى بيان أسباب الحكم. يتقاطع مع المفهوم من حيث كونه بياناً مكتوباً مرفقاً بوثيقة قانونية."

stage2_evidence:
  per_lemma:
    - lemma: "مُذَكِّرَة الْتِمَاس"
      confirm:
        - text: "«دفترٌ صغيرٌ يُدَوَّن به ما يُرادُ تذكُّره بيانٌ مجمل أو مُفصَّل تُشْرَحُ فيه بعض المسائل, كالمذكّرة التى تقدَّم إلى القاضى»"
          source: "المعجم الوسيط"
        - text: "«بيانٌ مُجْمَلٌ أو مُفَصَّلٌ, تُشْرَحُ فيه بعضُ المسائل, كالمذكرة التي تُقَدَّمُ إلى القاضي»"
          source: "المعجم الكبير"
        - text: "«(5) مُذَكِّرة. (6) .أ» أمرٌ قضائيّ. .ب» خلاصة الدعوى: وثيقة أو مذكِّرة بأهمّ وقائع الدعوى ونقاطها القانونية»"
          source: "المورد الحديث (brief)"
      expands:
        - text: "«(1) تَذْكاريّ (3) نُصُب تذكاريّ (5) مُذَكِّرة.»"
          source: "المورد الحديث (memorial)"
          addition: "المورد يترجم memorial إلى «مذكرة» مباشرة، مما يؤكد العلاقة الدلالية بين المصطلح الإنجليزي واللمّة العربية"
        - text: "«الطَّلَب التماس إعادة النظر. (فى قانون المرافعات) طريق الطَّعن فى الحكم النهائى, يُرفع إلى المحكمة التى أصدرته, لأسباب عدَّدها القانون, يُطلب به إعادة النظر فى هذا الحكم. (مج)»"
          source: "المعجم الوسيط (الالتماس)"
          addition: "يؤكد أن الالتماس مصطلح قانوني في قانون المرافعات، ويدعم المركب الإضافي"
    - lemma: "مُذَكِّرَة"
      confirm:
        - text: "«دفترٌ صغيرٌ يُدَوَّن به ما يُرادُ تذكُّره بيانٌ مجمل أو مُفصَّل تُشْرَحُ فيه بعض المسائل, كالمذكّرة التى تقدَّم إلى القاضى»"
          source: "المعجم الوسيط"
        - text: "«بيانٌ مُجْمَلٌ أو مُفَصَّلٌ, تُشْرَحُ فيه بعضُ المسائل, كالمذكرة التي تُقَدَّمُ إلى القاضي»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«وثيقة صادرة عن رئيس إدارة معينة، وهي أنواع منها: مذكرة إخبارية أو إعلامية ... ومذكرة توضيحية»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي"
          conflict: "«مذكرة» وحدها عامة جداً وتشمل أنواعاً كثيرة (إخبارية، توجيهية، توضيحية، دبلوماسية) لا تختص بالمعنى القانوني للالتماس"
    - lemma: "رَفِيعَة"
      confirm:
        - text: "«يرى بعضهم أن الأفصح أن يقال: رفيعة؛ لأنها وردت في المعاجم القديمة؛ ففي التاج والمصباح (رفع): الرفيعة: القصة يُبلِّغها الرجل، ويرفعها على العامل. يقال: لي عليه رفيعة، وهو مجاز»"
          source: "معجم الصواب اللغوي"
      contradicts:
        - text: "«يرى بعضهم أن الأفصح أن يقال: رفيعة ... ولكن الوسيط ذكر كلمة عريضة بالمعنى المذكور، ونصَّ على أنها محدثة»"
          source: "معجم الصواب اللغوي"
          conflict: "الرفيعة مذكورة كبديل لـ«عريضة» (الشكوى/الطلب) لا كبيان وقائع مرفق بالتماس، فالدلالة مختلفة عن المفهوم المستهدف"
    - lemma: "صَحِيفَةُ وَقَائِع"
      evidence_status: "no_material_found"
    - lemma: "مُذَكِّرَةٌ إِيضَاحِيَّة"
      confirm:
        - text: "«مذكرة إيضاحية: بيان أسباب الحكم»"
          source: "المعجم الموحد لمصطلحات القانون"
      contradicts:
        - text: "«المذكّرة التفسيرية: بيان يصدر به كل قانون لبيان الدّواعي إلى سنّه»"
          source: "المعجم الوسيط"
          conflict: "المذكرة الإيضاحية/التفسيرية تختص ببيان أسباب التشريع أو الحكم، وليست بياناً بالوقائع يُقدَّم مع التماس"

stage3_analysis:
  per_lemma:
    - lemma: "مُذَكِّرَةُ الْتِمَاسِ"
      decision: confirmed
      decision_reason: "مركب إضافي منطقي يجمع بين «مذكرة» (بيان مكتوب يُقدَّم إلى القاضي — المعجم الوسيط) و«التماس» (طلب قانوني — المعجم الوسيط). المركب يُخصّص نوع المذكرة بحسب سياقها القانوني. وإن لم يرد المركب بعينه في المعاجم، فإن كلا مكوّنيه مُثبتان في المجال القانوني، والتركيب الإضافي مُنتج في المصطلحية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "هي اللمّة الوحيدة في المجموعة، تدل تحديداً على البيان الكتابي بالوقائع المُرفَق بالتماس قانوني"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُذَكِّرَةُ الْتِمَاسِ"
    - lemma: "مُذَكِّرَة"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام يشمل أنواعاً كثيرة من المذكرات (إخبارية، دبلوماسية، توضيحية، إيضاحية) ولا يختص بالبيان المرفق بالتماس. إدراجه يُفقد المجموعة تخصيصها الدلالي."
    - lemma: "رَفِيعَة"
      source: stage1
      decision: removed
      decision_reason: "الرفيعة في التراث هي القصة أو الشكوى المرفوعة إلى السلطة، وهي أقرب إلى معنى العريضة/الالتماس ذاته منها إلى البيان المكتوب بالوقائع المرفق به. فضلاً عن أنها مهجورة الاستعمال."
    - lemma: "صَحِيفَةُ وَقَائِع"
      source: stage1
      decision: removed
      decision_reason: "مركب غير مُثبت معجمياً ولا مصطلحياً. لم تُعثر له على شواهد في قواعد البيانات المعجمية. يمكن استبدال «وقائع» بمرادفها «حقائق» فيبقى صالحاً كوصف حرّ، مما يعني أنه ليس مصطلحاً ثابتاً (فشل اختبار السكّ)."
    - lemma: "مُذَكِّرَةٌ إِيضَاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المذكرة الإيضاحية مصطلح قانوني مُثبت لكنه يدل على بيان أسباب الحكم أو دواعي التشريع، وليس على بيان وقائع مرفق بالتماس. الدلالة مختلفة عن المفهوم المستهدف."

